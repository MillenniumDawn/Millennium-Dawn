 russia.500.t: "Rostec Consolidates the Helicopter Industry"
 russia.500.d: "Decades of competition between the Mil and Kamov design bureaus and the Rostvertol, Kazan, and Ulan-Ude assembly plants have left Russian rotorcraft production fragmented. Under Rostec's industrial coordination, the surviving Soviet-era heritage is consolidated into a single integrated holding, JSC Russian Helicopters, to streamline research, production, and exports."
 russia.500.a: "Form Russian Helicopters JSC"
 TT_SOV_russian_helicopters_carry_traits: "All completed traits from §YMil Helicopters§! will be transferred to §YRussian Helicopters§!."
 SOV_Putting_out_the_fire_in_the_post-Soviet_space_accept_tt: "Each member that accepts commits to the union of sovereign states, paving the way for full integration with Russia."
 SOV_Sign_mutual_cooperation_agreements_accept_tt: "Each state that accepts agrees to begin forming the union of sovereign states with Russia."
 SOV_membership_invite_accept_tt: "The invited nations agree to align with Russia and join the Free Independent Alliance."
 SOV_peacekeeping_in_artsakh_accept_tt: "Armenia accepts a Russian peacekeeping mission in Nagorno-Karabakh, advancing the proposal to Azerbaijan."

 # Russian Computing Sovereignty
 SOV_computing_sovereignty_chinese_substitution: "Chinese Substitution"
 SOV_computing_sovereignty_chinese_substitution_desc: "Chinese suppliers replace Western inputs across the Russian computing stack. Shortages ease, but dependence has shifted rather than disappeared."
 SOV_computing_sovereignty_mature_node_specialization: "Mature-Node Specialization"
 SOV_computing_sovereignty_mature_node_specialization_desc: "Russia concentrates on robust domestic output at mature process nodes instead of chasing the frontier. Advanced processors still require an external foundry route."
 SOV_computing_sovereignty_parallel_import_economy: "Parallel-Import Economy"
 SOV_computing_sovereignty_parallel_import_economy_desc: "Unofficial procurement routes keep foreign hardware available at higher cost and lower predictability. The shortage is managed, not solved."
 SOV_computing_sovereignty_sovereign_computing_stack: "Sovereign Computing Stack"
 SOV_computing_sovereignty_sovereign_computing_stack_desc: "Domestic processor design, fabrication, software, and systems integration now form a coherent national stack. Maintaining it demands sustained investment and expertise."
 sov_economic.300.a: "Back the Elbrus architecture"
 sov_economic.300.b: "Build on a proven foreign architecture"
 sov_economic.300.d: "A commercial processor line built around MCST's Elbrus architecture could preserve Russian design expertise outside the x86 ecosystem. Turning that promise into deployable hardware will require patient support, compatible software, and continued access to fabrication."
 sov_economic.300.t: "The Elbrus Gamble"
 sov_economic.301.a: "Guarantee the VEB loan"
 sov_economic.301.b: "Withhold the guarantee until the economics improve"
 sov_economic.301.d: "Angstrem-T proposes to acquire a production line from AMD's former Dresden facility and install it in Zelenograd. The project could expand domestic capacity, but debt, installation risk, and an aging process threaten its economics."
 sov_economic.301.t: "The Angstrem-T Project"
 sov_economic.302.a: "Make substitution binding across the ministries"
 sov_economic.302.b: "Keep procurement open where domestic kit falls short"
 sov_economic.302.d: "Sanctions and strategic anxiety have moved import substitution from slogan to doctrine. Ministries now want Elbrus processors, Baikal system chips and Astra Linux to replace foreign systems, even where the domestic alternatives remain costly or immature."
 sov_economic.302.t: "The Import-Substitution Doctrine"
 sov_economic.303.a: "Prepare for a prolonged embargo"
 sov_economic.303.d: "Coordinated export controls now restrict Russia's access to advanced semiconductors, electronic design automation, and manufacturing equipment, and TSMC has stopped fabricating Baikal and Elbrus parts outright. The computing sector can absorb the embargo and pay for substitution, or build the networks needed to route around it."
 sov_economic.303.t: "The Technology Embargo"
 sov_economic.304.a: "Fall back on the nodes we can still fabricate"
 sov_economic.304.b: "Turn to a Chinese foundry"
 sov_economic.304.c: "Fund a domestic production line"
 sov_economic.304.d: "TSMC will no longer accept Russian processor orders under the new export-control regime. Elbrus products fabricated through TSMC now lack their established production route, turning a supply shock into a strategic crisis."
 sov_economic.304.t: "The TSMC Door Closes"
 sov_economic.305.a: "Accept Chinese foundries as the substitute"
 sov_economic.305.e: "Retreat to the mature nodes we can actually build"
 sov_economic.305.d: "Years of investment and crisis management have bound MCST's Elbrus line, Baikal, the Zelenograd fabs and the domestic software houses into a single national strategy. The balance now struck decides whether Russia holds a frontier of its own, lives on managed dependence, or settles for what it can still build."
 sov_economic.305.t: "A Sovereign Computing Stack"
 sov_economic.303.b: "Build networks to circumvent the controls"
 sov_economic.305.b: "Formalize the parallel import economy"
 sov_economic.305.c: "Declare the sovereign stack complete"
 SOV_vertical_of_power: "The Vertical of Power"
 SOV_vertical_of_power_desc: "In May 2000 Putin creates seven federal districts under presidential envoys and begins checking regional laws against the federal constitution. Moscow regains control of governors who ran their own budgets."
 SOV_yukos_affair: "The Yukos Affair"
 SOV_yukos_affair_desc: "Khodorkovsky funded opposition parties and negotiated a private pipeline deal. In October 2003 he is arrested, and Yukos is broken up and sold to the state-owned Rosneft. Every other owner learns the new rules at once."
 SOV_spare_the_oligarchs: "Spare the Oligarchs"
 SOV_spare_the_oligarchs_desc: "Not every 1990s fortune has to end in court. Owners who pay taxes and stay off television keep their companies and serve as a counterweight to the security men. The price is a state that depends on a few rich families."
 SOV_managed_democracy: "Managed Democracy"
 SOV_managed_democracy_desc: "Elections are held, candidates are screened and television decides the rest. Vladislav Surkov calls the system sovereign democracy. The Duma stops surprising the Kremlin."
 SOV_beslan_aftermath: "After Beslan"
 SOV_beslan_aftermath_desc: "After the school siege in Beslan in September 2004, Putin ends the direct election of governors and moves the Duma to party lists. The security services receive new powers, and the regions lose their independence."
 SOV_munich_speech: "The Munich Speech"
 SOV_munich_speech_desc: "At the Munich Security Conference in February 2007 Putin attacks NATO enlargement and American unilateralism. The Western delegates are stunned. The speech ends the effort to be accepted as a junior partner."
 SOV_color_revolution_lessons: "Lessons of the Color Revolutions"
 SOV_color_revolution_lessons_desc: "Serbia, Georgia and Ukraine each replaced a ruling elite after a disputed election and a crowd. The Kremlin answers with pro-government youth groups, a registry for foreign-funded NGOs and tighter control of election monitors."
 SOV_energy_superpower: "Energy Superpower"
 SOV_energy_superpower_desc: "Oil and gas pay the budget, buy loyalty, and give the Foreign Ministry a lever in Europe. The same dependence starves manufacturing of capital and leaves the accounts hostage to the price of Urals crude."
 SOV_five_day_war: "The Five-Day War"
 SOV_five_day_war_desc: "In August 2008 Georgian troops shell Tskhinvali and Russian forces cross the Roki tunnel. Five days later the army stands near Gori and Moscow recognizes South Ossetia and Abkhazia. The campaign shows the army's reach and its outdated equipment."
 SOV_tandemocracy: "The Tandem"
 SOV_tandemocracy_desc: "The constitution allows two consecutive terms. Putin steps aside in May 2008 for his prime minister, Dmitry Medvedev, and takes the premiership himself. Nobody doubts who decides."
 SOV_idea_grand_bargain: "The Grand Bargain"
 SOV_idea_grand_bargain_desc: "Oligarchs keep their property if they stay out of national politics. The arrangement calms the 1990s property war and leaves the state paying for their quiet."
 SOV_idea_vertical_of_power: "Vertical of Power"
 SOV_idea_vertical_of_power_desc: "Federal districts and Kremlin plenipotentiaries sit above the governors. Policy is easier to issue from Moscow and slower to adapt in the regions."
 SOV_idea_house_restored: "The House Restored"
 SOV_idea_house_restored_desc: "A Romanov sits on the throne again. Church, army and provinces swear to the dynasty, and rivals cannot find a legitimate alternative."
 SOV_idea_imperial_duma: "Imperial Duma"
 SOV_idea_imperial_duma_desc: "Two chambers debate the laws and vote the budget. Only the sovereign names the ministers, and everyone in the hall knows it."
 SOV_idea_zemstvo: "Zemstvo Councils"
 SOV_idea_zemstvo_desc: "Elected county councils pay for roads, schools and clinics out of local taxes, as they did before 1917."
 SOV_idea_state_council: "State Council of the Empire"
 SOV_idea_state_council_desc: "Senior ministers and appointed elders read every bill before the throne signs it. Decisions take longer and fewer of them are mistakes."
 SOV_idea_imperial_chancellery: "Imperial Chancellery"
 SOV_idea_imperial_chancellery_desc: "His Majesty's Own Chancellery sorts petitions, reads the mail of doubtful officials and keeps the emperor's secrets."
 SOV_idea_service_nobility: "Service Nobility"
 SOV_idea_service_nobility_desc: "Land and rank go to officers who earn them. Young nobles fill the staff colleges, and new commissions are cheap to grant."
 SOV_idea_third_rome: "The Third Rome"
 SOV_idea_third_rome_desc: "Moscow presents itself as the protector of the Orthodox world from the Balkans to the Levant, and finds the pretext for a quarrel easier to write."
 SOV_idea_color_revolution_lessons: "Lessons of the Color Revolutions"
 SOV_idea_color_revolution_lessons_desc: "Security officials study how crowds won in Belgrade, Tbilisi and Kyiv, and how to stop the next one before it gathers."
 SOV_idea_castling: "The Castling"
 SOV_idea_castling_desc: "Putin and Medvedev swap chairs in 2011 and the voters hear of it after the decision is made. The party machine adjusts without a murmur."
 SOV_idea_normandy_format: "Normandy Format"
 SOV_idea_normandy_format_desc: "Moscow, Kyiv, Berlin and Paris meet on a regular schedule. Talks do not end the quarrel, but they keep the neighbors from adding to it."
 SOV_idea_young_guard: "The Young Guard"
 SOV_idea_young_guard_desc: "United Russia recruits students through summer camps and scholarships. The party gets a crowd on demand and a pool of young staff."
 SOV_idea_federation_council: "Appointed Federation Council"
 SOV_idea_federation_council_desc: "Governors no longer sit in the upper house. Appointed representatives vote as the Kremlin asks, and laws pass without a regional haggle."
 SOV_idea_popular_front: "All-Russia Popular Front"
 SOV_idea_popular_front_desc: "Unions, veterans and professional groups rally around Putin outside the party structure and supply candidates without United Russia's label."
 SOV_idea_undesirable_orgs: "Undesirable Organizations Law"
 SOV_idea_undesirable_orgs_desc: "Prosecutors can ban foreign groups, and anyone who works with them risks prison. Western foundations leave, and so does much of the goodwill."
 SOV_idea_armed_neutrality: "Armed Neutrality"
 SOV_idea_armed_neutrality_desc: "Russia stays out of every bloc and pays for a border army and a nuclear deterrent instead. No capital counts on our vote."
 SOV_idea_nato_partnership: "NATO Partnership"
 SOV_idea_nato_partnership_desc: "Joint exercises and a mission at Brussels bring Russian officers into NATO staff procedure. The General Staff grumbles but learns."
 SOV_idea_oecd_accession: "OECD Accession"
 SOV_idea_oecd_accession_desc: "Peer review of tax, anti-bribery and competition rules reassures investors, and foreign governments treat us as a partner in good standing."
 SOV_idea_schengen_visas: "Visa-Free Europe"
 SOV_idea_schengen_visas_desc: "Russians travel, study and work in the Schengen area for short stays. Scientists come home with contacts, and the consulate queues disappear."
 SOV_idea_civilian_oversight: "Civilian Oversight of the Army"
 SOV_idea_civilian_oversight_desc: "Parliament approves the defense budget line by line and civilians run the ministry. Scandals reach the press, and drill suffers a little for it."
 SOV_idea_near_abroad: "Near Abroad Doctrine"
 SOV_idea_near_abroad_desc: "Every former republic has a desk in Moscow with money, bases and a veto over rival suitors. Neighbors take the attention as a warning."
 SOV_idea_sco_exercises: "SCO Joint Exercises"
 SOV_idea_sco_exercises_desc: "Peace Mission drills and shared research programs make working with Beijing routine without calling it an alliance."
 SOV_idea_frozen_conflicts: "Managed Frozen Conflicts"
 SOV_idea_frozen_conflicts_desc: "Abkhazia, South Ossetia and Transnistria stay unresolved on purpose. They keep Tbilisi and Chisinau looking east, and every neighbor knows who holds the switch."
 SOV_idea_russian_question: "The Russian Question"
 SOV_idea_russian_question_desc: "Official speeches count the twenty-five million Russians left outside the Federation in 1991, and the neighbors notice who is counting."
 SOV_idea_space_prestige: "Cosmonaut Prestige"
 SOV_idea_space_prestige_desc: "Baikonur flies again on a five-year budget, and a launch on April 12 is something the whole country can cheer."
 SOV_idea_gosbank_credit: "Gosbank Credit Plan"
 SOV_idea_gosbank_credit_desc: "State credit flows to the plants the plan names. Output rises, and the shops see less of the money."
 SOV_idea_governor_rotation: "Rotating Governors"
 SOV_idea_governor_rotation_desc: "Regional chiefs are moved before they grow roots. Younger technocrats owe fewer favors, and the regions resent them less than the barons."
 SOV_idea_yukos_affair: "Yukos Affair"
 SOV_idea_yukos_affair_desc: "The destruction of Yukos recentralizes oil rent in state hands. Investors price in political risk, and the budget takes a larger share of the remaining majors."
 SOV_idea_oligarch_accommodation: "Oligarch Accommodation"
 SOV_idea_oligarch_accommodation_desc: "The 1990s owners remain partners rather than targets. Capital stays, the tax take is softer, and the security services wait."
 SOV_idea_managed_democracy: "Managed Democracy"
 SOV_idea_managed_democracy_desc: "Parties, television, and the electoral threshold are instruments of administration. The system produces majorities. It does not produce surprises."
 SOV_idea_beslan_security: "Security After Beslan"
 SOV_idea_beslan_security_desc: "The federal response to Beslan expands the security services and the police budget. Order is purchased. Open politics is not."
 SOV_idea_energy_superpower: "Energy Superpower"
 SOV_idea_energy_superpower_desc: "Hydrocarbons fund the state and shape diplomacy. Factories that do not pump oil wait in line for investment."
 SOV_idea_five_day_war: "After the Five-Day War"
 SOV_idea_five_day_war_desc: "A short campaign in Georgia restores war support and gives the army a taste of modern war. It also reminds the General Staff how much of the inventory still belongs to 1999."
 sov_statecraft.1.t: "Federal Districts"
 sov_statecraft.1.d: "Seven federal districts now sit between the Kremlin and the governors. The presidential administration wants them staffed by loyal plenipotentiaries, not by men the regions already know."
 sov_statecraft.1.a: "Appoint the siloviki"
 sov_statecraft.1.b: "Bargain with the sitting governors"
 sov_statecraft.2.t: "Khodorkovsky in Court"
 sov_statecraft.2.d: "The Yukos case is no longer a tax dispute. Western investors are watching the verdict, and so are the other oligarchs who still own oil, metals, and television."
 sov_statecraft.2.a: "Make an example of him"
 sov_statecraft.2.b: "Keep the trial narrow"
 sov_statecraft.3.t: "United Russia"
 sov_statecraft.3.d: "The party of power is less an ideology than a staffing system. Governors, mayors, and state company boards now have a single list to join if they want a future."
 sov_statecraft.3.a: "Build the party of power"
 sov_statecraft.4.t: "Beslan"
 sov_statecraft.4.d: "The school in Beslan is a ruin. The presidential administration is already arguing that elected governors made the North Caucasus impossible to police."
 sov_statecraft.4.a: "End gubernatorial elections"
 sov_statecraft.4.b: "Blame the security services and keep the governors"
 sov_statecraft.5.t: "Munich"
 sov_statecraft.5.d: "The Wehrkunde audience expected a partner. They heard a list of NATO broken promises and a warning that a unipolar order would not last."
 sov_statecraft.5.a: "Let the speech stand"
 sov_statecraft.6.t: "War in the Caucasus"
 sov_statecraft.6.d: "Georgian troops have moved on Tskhinvali. The 58th Army is already in North Ossetia. How far we take this fight will be read in every post-Soviet capital."
 sov_statecraft.6.a: "Limit the operation to the Ossetian and Abkhaz questions"
 sov_statecraft.6.b: "Prepare a wider campaign against Tbilisi"
 sov_statecraft.7.t: "Russian Forces Cross the Border"
 sov_statecraft.7.d: "Columns from the 58th Army have entered South Ossetia. Tbilisi has hours, not days, to decide whether this stays a local war."
 sov_statecraft.7.a: "Call up what we can"
 sov_statecraft.8.t: "President and Prime Minister"
 sov_statecraft.8.d: "Medvedev takes the presidency and Putin the premiership. The constitution is observed. The circle around both men is the same circle that ran the last eight years."
 sov_statecraft.8.a: "Keep the tandem intact"
 SOV_united_russia_party: "United Russia"
 SOV_united_russia_party_desc: "United Russia merges the Unity and Fatherland-All Russia parties into one machine for governors, mayors and factory directors. People join because the Kremlin controls jobs and budgets. Its Duma majority passes the president's bills without amendment."
 SOV_conservative_turn: "The Conservative Turn"
 SOV_conservative_turn_desc: "The Kremlin drops liberal language and turns to tradition, the Orthodox Church and a longer presidential term. Putin's team argues that modernization without stability is a danger. The reformers in the government lose their audience."
 SOV_bolotnaya_moment: "Bolotnaya"
 SOV_bolotnaya_moment_desc: "After the Duma election of December 2011 tens of thousands gather on Bolotnaya Square in Moscow. They carry white ribbons and complain of fraud. The Kremlin has to choose between arrests and concessions."
 SOV_ukraine_partnership: "The Ukraine File"
 SOV_ukraine_partnership_desc: "Kyiv is not Warsaw. We keep Ukraine in our economic orbit with gas, credit and cheap transit, and leave Crimea to the lawyers. Kyiv can accept the offer or turn west."
 SOV_kyiv_gas_contract: "The Gas Contract"
 SOV_kyiv_gas_contract_desc: "A ten-year deal between Gazprom and Naftogaz fixes price and transit after the cut-offs of 2006 and 2009. Ukraine gets a discount and we get a stable route to Europe."
 SOV_ukraine_eaeu: "Customs Union with Kyiv"
 SOV_ukraine_eaeu_desc: "Ukraine joins the Eurasian customs space instead of the EU association agreement that was on the table at Vilnius in 2013. Ukrainian factories get Russian orders and our firms get Ukrainian parts."
 SOV_dnipro_industrial_pact: "Dnipro Industrial Pact"
 SOV_dnipro_industrial_pact_desc: "Yuzhmash in Dnipro, Motor Sich in Zaporizhzhia and Antonov in Kyiv were built for one Soviet customer. Joint production gives us rocket stages, aircraft engines and a factory floor on the Dnieper."
 SOV_syria_intervention: "Syria"
 SOV_syria_intervention_desc: "On 30 September 2015 Su-24s and Su-34s left Khmeimim for the first Russian air campaign outside the former Soviet Union. It saves Assad, trains a generation of pilots, and makes Moscow a partner the West has to call again. Sanctions hurt less once we are at the table."
 SOV_independent_courts: "Independent Courts"
 SOV_independent_courts_desc: "Judges receive fixed salaries, security of tenure and a budget the executive cannot cut. Commercial courts begin to rule against ministries. Investors notice within a year."
 SOV_eu_membership_bid: "Apply for EU Candidacy"
 SOV_eu_membership_bid_desc: "Russia files a formal application for candidate status. The Commission lists the standards to meet, from judicial independence to border management. The government calls it the largest reform program since 1991."
 SOV_privatization_audit: "Audit the Privatization"
 SOV_privatization_audit_desc: "The Audit Chamber reviews the loans-for-shares auctions of 1995 and the sales that followed. The findings are legal, political and personal, and the owners will answer them."
 SOV_rein_in_the_fsb: "Rein in the FSB"
 SOV_rein_in_the_fsb_desc: "The FSB loses its investigative monopoly and its budget goes under parliamentary review. Officers who ran businesses on the side are retired. The service reads the reform as an attack."
 SOV_professional_fsb: "A Professional FSB"
 SOV_professional_fsb_desc: "We keep counter-intelligence and the border service intact and retire only the officers with private business interests. The service stays loyal, and the reform stays small."
 SOV_free_press: "A Free Press"
 SOV_free_press_desc: "State television loses its monopoly on national news, and private channels receive licenses without political review. Editors investigate the government, and ministers complain every week."
 SOV_wto_accession: "Join the WTO"
 SOV_wto_accession_desc: "After eighteen years of talks Russia signs the accession protocol. Tariffs on cars, farm goods and machinery come down in stages. Exporters get a legal route to challenge trade barriers."
 SOV_european_choice: "The European Choice"
 SOV_european_choice_desc: "We treat the 1994 Partnership and Cooperation Agreement as a program instead of a formality. Brussels hears that Russia wants closer integration. The army and the foreign ministry will have to accept European rules."
 SOV_armed_neutrality: "Armed Neutrality"
 SOV_armed_neutrality_desc: "Russia stays outside both NATO and a Eurasian bloc. A smaller professional army defends the border and the nuclear deterrent. Neither Washington nor Beijing can count on our vote."
 SOV_liberal_federalism: "Liberal Federalism"
 SOV_liberal_federalism_desc: "Governors are elected again and regions keep a larger share of the taxes they collect. Tatarstan and Bashkortostan receive their treaties in constitutional form, and separatist pressure falls."
 SOV_cis_as_market: "The CIS as a Market"
 SOV_cis_as_market_desc: "Belarus, Kazakhstan and Ukraine are treated as trading partners first. We offer free trade agreements and stop trying to rebuild the Soviet Union in institutions. Their governments welcome the money and distrust the motives."
 SOV_a_european_russia: "A European Russia"
 SOV_a_european_russia_desc: "Visa talks, a seat before the Council of Europe's human-rights court and an end to Soviet legacy rhetoric change how Russia is seen. The foreign ministry no longer prepares a lecture for each meeting in Brussels."
 SOV_social_state: "The Social State"
 SOV_social_state_desc: "Pensions, clinics and a labor code come before any grand restructuring. Zyuganov staffs his cabinet with party veterans and union leaders, and the government runs as the CPRF Duma platform with ministries attached."
 SOV_nationalize_the_nineties: "Undo the Auctions"
 SOV_nationalize_the_nineties_desc: "The loans-for-shares sales of 1995 handed Norilsk, Yukos and Sibneft to a few bankers for a fraction of their value. The CPRF promised to void them, and the owners know which decree is coming."
 SOV_eurocommunism: "The Gorbachev Wing"
 SOV_eurocommunism_desc: "Social democrats inside the party argue the Union died of stagnation, not sabotage. They want rival parties, market socialism on the Chinese or Scandinavian model, and Gorbachev's name cleared. The other two wings are closed."
 SOV_soviet_symbols: "The Red Banner Line"
 SOV_soviet_symbols_desc: "The apparatus wing wants the red flag on the Kremlin towers and the old names back on the map. It wants a Politburo that decides things and a Party nobody dilutes. Taking this line closes the other two wings."
 SOV_planned_industry: "The Return of the Plan"
 SOV_planned_industry_desc: "Sverdlovsk and Chelyabinsk get production targets again, and ministries start writing them. Whichever wing won the argument, nobody in the party wants to defend the 1990s economy."
 SOV_russian_question: "The Russian Question"
 SOV_russian_question_desc: "Twenty-five million Russians woke up outside the Federation in 1991, and Zhirinovsky has made them the first item of foreign policy. Official speeches start to count them, and neighbors start to notice who is counting."
 SOV_protect_russians_abroad: "Protect Russians Abroad"
 SOV_protect_russians_abroad_desc: "Passports go out in Crimea and northern Kazakhstan, and consulates start receiving delegations. Kyiv and Astana read the program as intended."
 SOV_greater_russia: "Greater Russia"
 SOV_greater_russia_desc: "The program drops the pretense of a regional power. Schools teach an imperial map, and the army gets a mission statement that begins at the Baltic and ends at the Pacific."
 SOV_kadyrov_settlement: "The Kadyrov Settlement"
 SOV_kadyrov_settlement_desc: "Akhmad Kadyrov, Chechnya's former mufti, has broken with the separatists and offers Moscow a Chechen government that fights its own war. We pay for it with autonomy and federal money."
 SOV_direct_rule_chechnya: "Direct Federal Rule"
 SOV_direct_rule_chechnya_desc: "We refuse any deal with men who fought us and keep Chechnya under federal prefects, interior troops and a counter-terrorist regime. It is slower and costs more men, but the republic answers to Moscow alone."
 SOV_kadyrovtsy: "The Kadyrovtsy"
 SOV_kadyrovtsy_desc: "Kadyrov's bodyguards grow into a security service of several thousand armed Chechens, loyal to the family before the state. They know the mountains and the clans, and they cost us nothing but trust."
 SOV_united_group_of_forces: "Joint Group of Forces"
 SOV_united_group_of_forces_desc: "Army and Interior Ministry units are placed under one command in the North Caucasus, and brigades rotate through Chechnya for years. Every battalion that passes through comes out with combat experience."
 SOV_serdyukov_new_look: "Serdyukov's New Look"
 SOV_serdyukov_new_look_desc: "Defense Minister Anatoly Serdyukov cuts the officer corps, replaces divisions with permanent-readiness brigades and hands supply to civilian contractors. The army becomes leaner and cheaper, and officers will not forgive him."
 SOV_listen_to_the_generals: "Listen to the Generals"
 SOV_listen_to_the_generals_desc: "The General Staff warns that brigades cannot fight the mass war it still plans for. We keep the divisions, the conscript levy and the mobilization reserves, and keep the officer corps content."
 SOV_northern_fleet: "The Northern Fleet"
 SOV_northern_fleet_desc: "Severomorsk is the base of our strategic submarines and our largest fleet. We repair what we can and keep more ships on patrol."
 SOV_submarine_force: "Submarine Force"
 SOV_submarine_force_desc: "Yasen and Kilo-class boats are the one part of the navy that still builds. We keep the crews at sea and the yards in orders."
 SOV_nuclear_triad: "The Nuclear Triad"
 SOV_nuclear_triad_desc: "Silos, bombers and submarines are modernized together under one deterrent plan. Sarmat and Borei replace the missiles and boats inherited from the Soviet Union."
 sov_army.1.t: "Akhmad Kadyrov Changes Sides"
 sov_army.1.d: "Chechnya's chief mufti has told Moscow he will not fight another war against Russia. He offers to run the republic himself, with his own armed men, if the federal budget pays for it and the troops stay in their barracks."
 sov_army.1.a: "Sign the agreement"
 sov_army.2.t: "Kadyrov Is Killed in Grozny"
 sov_army.2.d: "On 9 May 2004 a bomb under the Dynamo stadium tribune killed Akhmad Kadyrov and several officials during the Victory Day parade. His son Ramzan commands the Kadyrovtsy, and the Interior Ministry has its own candidate."
 sov_army.2.a: "Back Ramzan Kadyrov"
 sov_army.2.b: "Install Alu Alkhanov"
 sov_army.3.t: "Ramzan Sends the Bill"
 sov_army.3.d: "Ramzan Kadyrov wants more money for roads, mosques and his security service. He mentions in passing that his fighters are the reason Chechnya is quiet."
 sov_army.3.a: "Pay the transfer"
 sov_army.3.b: "Refuse the request"
 sov_army.4.t: "Sweeps in the Chechen Villages"
 sov_army.4.d: "Federal units now comb the villages for fighters, and every sweep produces complaints about disappearances and burned houses. The generals say the sweeps work. The rest of the republic says they are making new rebels."
 sov_army.4.a: "Continue the sweeps"
 sov_army.4.b: "Pay for reconstruction and amnesty"
 sov_army.5.t: "The Counter-Terrorist Operation Ends"
 sov_army.5.d: "The regime that has governed Chechnya since 1999 can be formally lifted. Attacks are rare now, but the Interior Ministry argues that a few more months would be safer."
 sov_army.5.a: "Lift the regime"
 sov_army.5.b: "Extend it another year"
 sov_army.6.t: "Lessons of the Georgian War"
 sov_army.6.d_war: "The five-day war reached Tskhinvali and Gori, but only after jammed radios, columns that lost their way and a bomber force that lost a Tu-22M3 to friendly fire and ground fire. The General Staff has a list of failures and a finite budget."
 sov_army.6.d_nowar: "Georgia's war in the Caucasus was not ours to fight, but the General Staff studied every report from the 2008 campaign. Jammed radios, lost columns and an air force that could not find its targets all appear on the list of faults to fix."
 sov_army.6.a: "Fix command and communications first"
 sov_army.6.b: "Rebuild the air force"
 sov_army.6.c: "Fund a new state armament program"
 sov_army.7.t: "The Oboronservis Scandal"
 sov_army.7.d: "Prosecutors have uncovered a scheme in which Oboronservis, the company that took over army supply, sold off Defense Ministry property far below its value. The trail leads to Anatoly Serdyukov's own circle."
 sov_army.7.a: "Dismiss Serdyukov and appoint Shoigu"
 sov_army.7.b: "Close the case and keep the savings"
 sov_army.8.t: "The T-14 Stalls on Red Square"
 sov_army.8.d: "At the Victory Day parade rehearsal the new T-14 Armata stops dead in front of the cameras. The tank is promising, but the Finance Ministry has noticed that each one costs several times a modernized T-90M."
 sov_army.8.a: "Order serial production"
 sov_army.8.b: "Order a small batch and rely on the T-90M"
 sov_army.9.t: "The First Flight of the T-50"
 sov_army.9.d: "The Sukhoi T-50 prototype flew from Komsomolsk-on-Amur in January 2010. India has offered to share the cost, but it wants a say in the design and a version built for its own air force."
 sov_army.9.a: "Finish it with our own money"
 sov_army.9.b: "Take India as a partner"
 sov_army.10.t: "Bulava Fails Another Test"
 sov_army.10.d: "The Bulava submarine-launched missile has failed again. The navy blames a defective part, the designers blame the factory, and the Borei boats are waiting at the pier with nothing to carry."
 sov_army.10.a: "Keep testing until it works"
 sov_army.10.b: "Shift money to the Yasen attack submarines"
 sov_army.11.t: "Iskanders for Kaliningrad"
 sov_army.11.d: "The United States wants to install missile defense interceptors in Poland and a radar in the Czech Republic. The General Staff proposes to answer with Iskander brigades in Kaliningrad, a few minutes' flight from Warsaw."
 sov_army.11.a: "Announce the deployment"
 sov_army.11.b: "Offer to hold back if the shield is dropped"
 sov_army.12.t: "Choosing the Year's Exercise"
 sov_army.12.d: "The General Staff can hold only one large exercise this year. The Western Military District wants to rehearse a defense of Belarus. The North Caucasus Military District wants to test the new brigades near the Turkish border."
 sov_army.12.a: "Hold Zapad with Belarus"
 sov_army.12.b: "Hold Kavkaz in the south"
 SOV_kadyrovtsy_unit_tt: "A §YKadyrovtsy§! special forces unit is created in §YChechnya§! if we control the republic."
 SOV_garrison_unit_tt: "A §YFederal Garrison Brigade§! is created in §YChechnya§! if we control the republic."
 SOV_kadyrov_autonomy_tt: "§YChechnya§! becomes an autonomous republic of the Federation and the war ends."
 SOV_end_the_1998_hangover: "End the 1998 Hangover"
 SOV_end_the_1998_hangover_desc: "Default, barter and wages paid in kind. We close the books on that decade with a treasury that pays in money. The Broken Economy ends, and the rulings we made against or for the oligarchs set the shape of the settlement."
 SOV_ruble_crisis: "The Ruble Crisis"
 SOV_ruble_crisis_desc: "Oil falls from 115 to 50 dollars in six months, sanctions close the bond market and the ruble loses half its value by January 2015. The Central Bank floats the currency on 10 November and raises its key rate to 17 percent overnight. What is left in the reserve decides how this ends."
 SOV_import_substitution: "Import Substitution"
 SOV_import_substitution_desc: "Counter-sanctions on food in 2014 and technology controls after that make substituting imports a national programme. Domestic cheese is a success. Domestic machine tools are a longer story."
 SOV_near_abroad: "The Near Abroad"
 SOV_near_abroad_desc: "Fourteen republics left in 1991 and Moscow still counts most of them as a file it owns. We keep a desk for each, with money, bases and a veto over who else gets to call."
 SOV_csto_pillar: "The CSTO"
 SOV_csto_pillar_desc: "A staff, exercises and a treaty that actually obliges. Collective security that only works in communiques leaves a vacancy for NATO and Beijing."
 SOV_csto_rapid_reaction: "Collective Rapid Reaction Force"
 SOV_csto_rapid_reaction_desc: "Created in 2009, with a standing battalion from each member and contingency plans for Central Asia drawn up in advance. The staff is now ready to move on the first call."
 SOV_csto_membership_drive: "Widen the CSTO"
 SOV_csto_membership_drive_desc: "Uzbekistan left in 2012, and Azerbaijan never joined. We send invitations that come with Russian arms discounts."
 SOV_reset_with_washington: "The Reset"
 SOV_reset_with_washington_desc: "Medvedev and Obama press the button in Geneva in 2009. New START, a civil nuclear deal, and a stretch of years when Washington is not the main enemy."
 SOV_no_reset: "No Reset"
 SOV_no_reset_desc: "The reset is a trap with better stationery. We keep the missiles, the veto, and the assumption that Washington does not wish us well."
 SOV_new_start: "New START"
 SOV_new_start_desc: "We sign the treaty in Prague on 8 April 2010. The United States gets inspections, and we get cuts we were going to make anyway and a research partnership."
 SOV_contract_army: "The Contract Army"
 SOV_contract_army_desc: "We build a core of professional kontraktniki, paid well enough to stay for years. They train longer and fight better, and there are fewer of them than the draft would give us."
 SOV_keep_the_draft: "Keep the Draft"
 SOV_keep_the_draft_desc: "The twelve-month draft stays, and so does the reserve it feeds. Conscripts are cheap and plentiful, and nobody has to argue with the Finance Ministry about contract salaries."
 SOV_gerasimov_doctrine: "The Gerasimov Doctrine"
 SOV_gerasimov_doctrine_desc: "Chief of the General Staff Valery Gerasimov argues that modern war blends force with information, economic and proxy pressure. We reorganize around that idea."
 SOV_rostec_consolidation: "Rostec and the Defense Industry"
 SOV_rostec_consolidation_desc: "In 2007 the state placed most defense firms under Rostec, headed by Sergei Chemezov. Pooled orders, state loans and one procurement chain replace the quarrelling design bureaus."
 SOV_central_asia_pivot: "The Central Asia Pivot"
 SOV_central_asia_pivot_desc: "Tashkent, Astana and Bishkek are where Chinese credit arrives first. We answer with migrant labor quotas, a resettlement program for ethnic Russians, and a diplomatic visit for each capital."
 SOV_anti_corruption_drive: "The Anti-Corruption Drive"
 SOV_anti_corruption_drive_desc: "Prosecutors go after officials with unexplained property and fortunes built at the 1990s auctions. A special agency reports to parliament instead of the president. Some cases succeed and some are settled, and the oligarchs watch which is which."
 SOV_workers_housing: "Workers' Housing"
 SOV_workers_housing_desc: "Prefabricated blocks go up on the edge of every industrial town, paid for by the state and assigned through factory committees. Two years of building will not close the waiting list, but it will shorten it."
 SOV_customs_union: "The Customs Union"
 SOV_customs_union_desc: "Minsk and Astana agree to a common external tariff in 2010. Trade law is how we keep the near abroad in Moscow's orbit when the army cannot."
 SOV_ferghana_bases: "Kant and the 201st"
 SOV_ferghana_bases_desc: "The Kant airbase in Kyrgyzstan and the 201st Division in Tajikistan are where we answer a Central Asian crisis. We ask both governments to extend our access and offer rent in return."
 SOV_sco_deepen: "Deepen the SCO"
 SOV_sco_deepen_desc: "Shanghai Cooperation is the table where we sit with Beijing without calling it an alliance. Peace Mission exercises and joint research give us a habit of working together."
 SOV_turkey_stream: "Blue Stream and TurkStream"
 SOV_turkey_stream_desc: "Blue Stream reached Turkey under the Black Sea in 2003 and TurkStream went on to Thrace and the Balkans in 2020. Ankara becomes our hub for southern Europe, and a customer too large to sanction."
 SOV_land_for_the_villages: "The Land Question"
 SOV_land_for_the_villages_desc: "The CPRF's agrarian allies want farmland sales banned and the kolkhoz back as a legal form. The government has to decide how much of the countryside the state takes in hand, and how hard."
 SOV_ldpr_television: "Zhirinovsky on Every Channel"
 SOV_ldpr_television_desc: "Nationalist politics here was always a performance, and now the performance has a broadcasting budget. Talk shows, rallies and interviews become the public face of the government, for better and for worse."
 SOV_liberal_army_oversight: "Civilian Oversight"
 SOV_liberal_army_oversight_desc: "Parliament approves the defense budget line by line and civilians fill senior posts in the ministry. The General Staff accepts this slowly. Procurement scandals reach the newspapers."
 SOV_cprf_red_army: "Rebuild the Red Army"
 SOV_cprf_red_army_desc: "The defense ministry gets its pre-1991 budget lines and the design bureaus get their orders back. A new arms plant goes up in Rostov to feed the Southern Military District."
 sov_statecraft.9.t: "Bolotnaya Square"
 sov_statecraft.9.d: "Tens of thousands are in the streets over the Duma vote. The presidential administration wants a show of force or a waiting game."
 sov_statecraft.9.a: "Wait them out"
 sov_statecraft.9.b: "Clear the square"
 sov_statecraft.11.t: "A Russian Offer"
 sov_statecraft.11.d: "Moscow proposes a deeper economic relationship and a guarantee of Crimea's present status. The price is staying out of NATO."
 sov_statecraft.11.a: "Take the economic track"
 sov_statecraft.11.b: "Refuse"
 sov_kremlin.1.t: "The Owners Close Ranks"
 sov_kremlin.1.d: "The audit of the 1995 auctions has reached the desks of the largest owners. Their lawyers warn that they will move capital abroad. Their spokesmen offer a one-time payment instead."
 sov_kremlin.1.a: "Take the payment"
 sov_kremlin.1.b: "Let the audit run"
 sov_kremlin.2.t: "The Lubyanka Resists"
 sov_kremlin.2.d: "The FSB director offers his resignation and warns that the service will not forget how the reform was done. Veterans give interviews about a purge of professionals."
 sov_kremlin.2.a: "Dismiss the director"
 sov_kremlin.2.b: "Accept a phased reform"
 sov_kremlin.3.t: "A Deal with the Service"
 sov_kremlin.3.d: "The FSB leadership will back the government if it keeps its current staff. The retired officers with private businesses are an embarrassment, but they also know where the files are."
 sov_kremlin.3.a: "Confirm the leadership"
 sov_kremlin.3.b: "Retire the officers with businesses"
 sov_kremlin.4.t: "The Last Independent Channel"
 sov_kremlin.4.d: "A private channel is losing advertisers under pressure from ministries. Its owner asks whether the government will leave it alone or pay for a public broadcaster that no minister controls."
 sov_kremlin.4.a: "Leave it alone"
 sov_kremlin.4.b: "Fund a public broadcaster"
 sov_kremlin.5.t: "Terms of Entry"
 sov_kremlin.5.d: "The WTO working party asks for a schedule for car, steel and farm tariffs. Producers lobby for longer protection. Exporters want the membership signed."
 sov_kremlin.5.a: "Accept the phase-outs"
 sov_kremlin.5.b: "Protect cars and farms"
 sov_kremlin.6.t: "Brussels Receives Our Application"
 sov_kremlin.6.d: "The Commission will open talks, but it asks which of two roads Moscow wants. Candidate status means adopting the full body of EU law. An association agreement leaves more room to bargain."
 sov_kremlin.6.a: "File for candidate status"
 sov_kremlin.6.b: "Ask for association only"
 sov_kremlin.7.t: "Files on the Table"
 sov_kremlin.7.d: "The lustration law is passed and the archives commission wants to publish the lists. Former officers warn that names will be wrong and lives will be ruined. Reformers say the public has waited long enough."
 sov_kremlin.7.a: "Publish the names"
 sov_kremlin.7.b: "Release to the courts only"
 sov_kremlin.8.t: "Exit from the CSTO"
 sov_kremlin.8.d: "The foreign ministry has drafted two notes. One withdraws from the treaty immediately and the other freezes our participation. Minsk and Yerevan are watching which one is sent."
 sov_kremlin.8.a: "Withdraw outright"
 sov_kremlin.8.b: "Freeze participation"
 sov_kremlin.10.t: "Governors Return to the Ballot"
 sov_kremlin.10.d: "The bill to restore gubernatorial elections reaches the Duma. Reformers want open competition and the administration wants a presidential filter on candidates."
 sov_kremlin.10.a: "Open the ballot"
 sov_kremlin.10.b: "Keep the filter"
 sov_kremlin.11.t: "Who Announces the Swap"
 sov_kremlin.11.d: "United Russia is preparing its congress for September 2011. The party can announce the decision from the stage, or stage a Popular Front nomination to present it as a popular demand."
 sov_kremlin.11.a: "Announce it at the congress"
 sov_kremlin.11.b: "Stage a Popular Front nomination"
 SOV_wartime_economy: "Wartime Economy"
 SOV_wartime_economy_desc: "Defense plants go to three shifts and the procurement order outranks every civilian one. The budget swings to shells and the shops notice."
 SOV_partial_mobilization: "Partial Mobilization"
 SOV_partial_mobilization_desc: "The decree of 21 September 2022 calls up 250,000 reservists with recent service. Thousands of men leave for Georgia and Kazakhstan, but the front gets its replacements. The Bars volunteer reserve follows."
 SOV_full_mobilization: "General Mobilization"
 SOV_full_mobilization_desc: "We stop calling it an operation. Exemptions end, the draft age rises and the register empties into the army, at the cost of the factory floor and public patience."
 SOV_drone_regiments: "Drone Regiments"
 SOV_drone_regiments_desc: "Orlan and Lancet crews become a branch of their own, and Iran sells Shahed airframes that the Alabuga plant soon builds as the Geran. Cheap mass strikes at cities and substations."
 SOV_dprk_ammunition: "Korean Ammunition"
 SOV_dprk_ammunition_desc: "Shell stocks run low in the second year. North Korea ships artillery rounds and rockets by rail from Rajin and wants oil and technology in return."
 SOV_shadow_fleet: "The Shadow Fleet"
 SOV_shadow_fleet_desc: "Old tankers, flags of convenience and an insurer in Dubai carry Urals above the price cap agreed in December 2022. Sovcomflot handles the paperwork."
 SOV_parallel_imports: "Parallel Imports"
 SOV_parallel_imports_desc: "The government legalized parallel imports in March 2022. Branded goods reach the shelves through Kazakhstan, Turkey and the UAE, and sanctions bite a little less."
 SOV_no_limits_partnership: "No Limits"
 SOV_no_limits_partnership_desc: "On 4 February 2022 Xi and Putin signed a partnership with no forbidden areas. Chinese banks and cars replace the Western ones, and Beijing buys the oil Europe stops buying."
 SOV_brics_enlargement: "BRICS Enlargement"
 SOV_brics_enlargement_desc: "The Kazan summit of 2024 turns a club of five into a bloc that cannot isolate us. India, South Africa and Brazil want discounted fuel and a seat at the table."
 SOV_escalate_further: "The Northern Front"
 SOV_escalate_further_desc: "Finland joined NATO in April 2023 and shares a 1,340 km border with us. A second front would tie down NATO and the army with it, and would put a NATO member in the war. Needs 50% war support."
 SOV_seek_settlement: "Seek a Settlement"
 SOV_seek_settlement_desc: "Delegations meet in Istanbul with a map that matches the front. A ceasefire line becomes a border only if we can sell it at home as victory."
 SOV_minsk_track: "The Normandy Format"
 SOV_minsk_track_desc: "Berlin and Paris sit down with Moscow and Kyiv to settle the Donbas without shooting. We trade pressure on the separatists for a seat as guarantor, and Europe prefers that to a war."
 SOV_limited_rearmament: "Limited Rearmament"
 SOV_limited_rearmament_desc: "We modernize the army without a war economy. New arms plants and a stock of artillery, paid for out of a growing budget and not by mobilization."
 SOV_keep_the_window_west: "The Window to Europe"
 SOV_keep_the_window_west_desc: "With a gas hub in Ukraine and no sanctions regime to hide behind, European investors return to Moscow. We trade some control for the capital and keep the line open to Berlin and Paris."
 SOV_arctic_lng: "Yamal LNG"
 SOV_arctic_lng_desc: "Novatek's plant at Sabetta ships its first cargo in December 2017. LNG goes where pipelines cannot, and China's Silk Road Fund holds a share. Sanctions slow the financing but Asian buyers fill the gap."
 SOV_yuan_settlement: "Settle in Yuan"
 SOV_yuan_settlement_desc: "Dollar and euro payments become a liability, so Chinese trade moves to yuan and rubles. Beijing takes a fee in leverage rather than cash, and our banks learn a second currency in a hurry."
 SOV_power_of_siberia: "Power of Siberia"
 SOV_power_of_siberia_desc: "The Chayanda field in Yakutia feeds a 3,000 kilometre pipeline to Heilongjiang. Beijing signs the 400 billion dollar contract in May 2014, at a price Gazprom declines to state. Europe is no longer our only customer."
 SOV_gas_leverage: "The Gas Weapon"
 SOV_gas_leverage_desc: "A quarter of the EU's gas arrives through our pipes, and far more in Bulgaria, Hungary and Slovakia. We can write contracts that carry political conditions or keep them commercial. Either way Brussels starts drafting a diversification plan."
 SOV_electronic_warfare: "Electronic Warfare Troops"
 SOV_electronic_warfare_desc: "Krasukha, Borisoglebsk and Leer systems jam radars, radios and drone links. Dedicated troops put those units into every army."
 SOV_strategic_exercises: "Strategic Exercises"
 SOV_strategic_exercises_desc: "Zapad, Kavkaz, Vostok and Tsentr rotate through the military districts every year. Each one tests the new brigades and sends a message to a chosen neighbour."
 SOV_military_space: "The Military Space Program"
 SOV_military_space_desc: "GLONASS reaches global coverage, and new reconnaissance and communications satellites go up from Plesetsk and Vostochny."
 SOV_borei_class: "Borei Class Submarines"
 SOV_borei_class_desc: "The Yuri Dolgorukiy was laid down in 1996 and entered service only after a decade of delays. The Borei class carries the Bulava missile, which keeps failing its tests."
 SOV_eea_track: "The EEA Track"
 SOV_eea_track_desc: "Moscow asks for an arrangement like the European Economic Area: single-market rules without full membership. The talks require Russia to adopt thousands of pages of EU law."
 SOV_lustration: "Lustration"
 SOV_lustration_desc: "A law bars senior KGB and Communist Party officials from top government posts for ten years. Liberals support it and the security services dislike it. Appeals reach the Constitutional Court."
 SOV_nato_partnership: "NATO Partnership"
 SOV_nato_partnership_desc: "Russia joins joint exercises, shares intelligence on terrorism and opens a mission at NATO headquarters. The General Staff objects to the visits. Partnership is not membership, but it ends the standoff."
 SOV_leave_csto: "Leave the CSTO"
 SOV_leave_csto_desc: "Leaving the Collective Security Treaty ends Russia's obligation to defend its members. Armenia and Belarus see it as abandonment. The savings go to the professional army."
 SOV_join_oecd: "Join the OECD"
 SOV_join_oecd_desc: "OECD membership requires peer review of Russia's tax, anti-bribery and competition rules. The government accepts the review to reassure investors."
 SOV_gosplan_2030: "Gosplan Returns"
 SOV_gosplan_2030_desc: "A state planning committee reopens in its old building on Myasnitskaya, with two-year targets instead of five. Heavy industry gets priority and the ministries get their lines back."
 SOV_comecon_lite: "Comecon, Lite"
 SOV_comecon_lite_desc: "Barter agreements, clearing accounts and joint ministries with Minsk, Astana and Beijing. It is not the old Comecon, and the CPRF is careful to say so."
 SOV_space_prestige: "Cosmonautics Day"
 SOV_space_prestige_desc: "Roscosmos moves back under a ministry, and Baikonur is renewed to serve a program that again has a five-year budget. The Politburo wants a launch on April 12 that nobody outside the country can ignore."
 SOV_russian_world_ministry: "Ministry of the Russian World"
 SOV_russian_world_ministry_desc: "A new ministry funds Russian-language media, schools and Orthodox parishes in the near abroad, with a budget it never publishes in full. It also opens a set of foreign-policy decisions, and neighbors treat each one as a statement of intent."
 SOV_claim_baltics: "Claim the Baltics"
 SOV_claim_baltics_desc: "Tallinn, Riga and Vilnius are told that their 1991 independence was a Moscow concession and not a settled fact. The three capitals are also NATO members, which the speeches mention only when they have to."
 SOV_mobilization_state: "The Mobilization State"
 SOV_mobilization_state_desc: "Reserve rosters are rewritten, factories get mobilization plans, and every town has a military commissar with a map. The country is on a footing it cannot hold forever."
 SOV_jirik_constitution: "A Truly Russian Constitution"
 SOV_jirik_constitution_desc: "The 1993 text is declared a product of tanks and American advisers. The new draft has to choose between a tight vertical of power at home and an open commitment to expansion abroad."
 SOV_jirik_dash_south: "The Southern Crusade"
 SOV_jirik_dash_south_desc: "Zhirinovsky's book promised Russian soldiers washing their boots in the Indian Ocean. The army is pointed at the Levant and the Nile, and the leader's cult grows a foreign-policy wing."
 SOV_jirik_dash_west: "The Western Crusade"
 SOV_jirik_dash_west_desc: "The army is pointed at the German plain and the Iberian coast instead of the south. The leader promises the end of NATO in Europe, and the Atlantic capitals take him at his word."
 SOV_india_arms: "Arms for India"
 SOV_india_arms_desc: "India wants the Admiral Gorshkov carrier and BrahMos missiles built at home. The Baku cruiser either stays with us or goes to Delhi for cash."
 SOV_serbia_brotherhood: "Serbia"
 SOV_serbia_brotherhood_desc: "Belgrade, Kosovo and a church language that still works. We invite Serbia to sit with us in the CSTO and promise a veto in the Security Council."
 SOV_idea_wartime_economy: "Wartime Economy"
 SOV_idea_wartime_economy_desc: "Munitions first. Civilian goods wait."
 SOV_idea_partial_mobilization: "Partial Mobilization"
 SOV_idea_partial_mobilization_desc: "Selected reservists. The rest of the country stays at work."
 SOV_idea_full_mobilization: "General Mobilization"
 SOV_idea_full_mobilization_desc: "The draft pool is emptied into the army. Factories feel it."
 SOV_idea_sanctions_fortress: "Fortress under Sanctions"
 SOV_idea_sanctions_fortress_desc: "Gray imports and substitution. The plants run. The labs lag."
 SOV_idea_drone_war: "Drone War"
 SOV_idea_drone_war_desc: "Mass unmanned strike. Pilots are no longer the bottleneck."
 SOV_idea_shadow_fleet: "Shadow Fleet"
 SOV_idea_shadow_fleet_desc: "Oil moves on hulls that do not appear on a Western register."
 SOV_idea_crimean_consensus: "Crimean Consensus"
 SOV_idea_crimean_consensus_desc: "Approval near 90 percent and a flag on every balcony. The mood is rally, not reform."
 SOV_idea_svo_rally: "Rally for the Operation"
 SOV_idea_svo_rally_desc: "Posters, concerts and a war that must be called an operation. Support holds while the front stays far away."
 SOV_idea_total_war: "Total War Footing"
 SOV_idea_total_war_desc: "The state takes what the front needs: men, steel and patience. Nobody expects a quiet year."
 SOV_idea_info_war_1: "Information Operations"
 SOV_idea_info_war_1_desc: "RT, Sputnik and troll farms carry our version abroad. At home the evening news does the same."
 SOV_idea_info_war_2: "Unified Media Line"
 SOV_idea_info_war_2_desc: "Gazprom-Media channels run one script. Dissent still exists, but it has to find a smaller room."
 SOV_idea_syria_expedition: "Syrian Expeditionary Experience"
 SOV_idea_syria_expedition_desc: "Pilots and staff officers rotated through Khmeimim. The army learned what a real air campaign costs."
 SOV_idea_counter_sanctions: "Counter-Sanctions"
 SOV_idea_counter_sanctions_desc: "Western food is banned and local farms are subsidized. Cheese gets scarce and politicians get a slogan."
 SOV_idea_kyiv_corridor_1: "Kyiv Gas Contract"
 SOV_idea_kyiv_corridor_1_desc: "Fixed price, guaranteed transit and a pipeline both sides depend on."
 SOV_idea_kyiv_corridor_2: "Eurasian Customs Space"
 SOV_idea_kyiv_corridor_2_desc: "Russian and Ukrainian firms trade without tariffs, and shared supply chains tie their plants together."
 SOV_idea_kyiv_corridor_3: "Joint Industry"
 SOV_idea_kyiv_corridor_3_desc: "Engines, rockets and aircraft are built on both sides of the border. Neither side can stop without paying for it."
 SOV_idea_window_to_europe: "Window to Europe"
 SOV_idea_window_to_europe_desc: "Western investors return to Moscow because the law is predictable. We pay for that by giving up some control."
 SOV_idea_liberal_europe: "European Course"
 SOV_idea_liberal_europe_desc: "Law and markets over the General Staff."
 SOV_idea_russian_world: "The Russian World"
 SOV_idea_russian_world_desc: "Language, church, and a claim on Russians who do not live in Russia."
 SOV_federal_development: "Federal Districts"
 SOV_federal_development_desc: "In May 2000 the president grouped Russia's regions into seven districts, each under a presidential envoy. We do the same and add a North Caucasus district as the eighth. Every district gets a loyalty rating, and it slips every month unless Moscow pays attention."
 SOV_fd_governors_end: "End of Elected Governors"
 SOV_fd_governors_end_desc: "After the Beslan siege in 2004 the president proposed to name governors himself and have the regional legislatures approve them. We do the same. Moscow gains a lever in every region, and voters notice what they lost."
 SOV_fd_governors_elected: "Keep the Governors Elected"
 SOV_fd_governors_elected_desc: "Governors stay on the ballot, as they have since the 1990s, though the Kremlin vets the candidates. Regions complain less when they can vote out a bad governor. Moscow gives up some leverage in return, and no Kremlin governor can be appointed."
 SOV_fd_budget_equalization: "Budget Equalization"
 SOV_fd_budget_equalization_desc: "The 2005 budget code moved most tax revenue to Moscow, which then returns it to poorer regions by formula. Donor regions grumble, recipients depend on the check, and fewer governors fall into arrears. The transfers cost money up front."
 SOV_fd_national_projects: "Priority National Projects"
 SOV_fd_national_projects_desc: "Health, education, housing and farming each get a national project with its own budget line, as in 2005 and again in 2018. Governors report progress to Moscow and can point at results. The federal budget pays the bill."
 SOV_fd_south_program: "Black Sea Development"
 SOV_fd_south_program_desc: "The 2014 Sochi Olympics left new roads, hotels and a rebuilt rail line. We extend the program to Novorossiysk, where a larger shipyard and naval base give the Kuban a reason to look to Moscow."
 SOV_fd_caucasus_corporation: "North Caucasus Development"
 SOV_fd_caucasus_corporation_desc: "The North Caucasus district was cut out of the South in 2010, with a state corporation to run resorts and roads. Dagestan and its neighbors have the youngest population in Russia and the fewest jobs for them. Monthly loyalty loss in the district falls from 0.5 to 0.2."
 SOV_develop_tatarstan_industry: "Volga Industrial Program"
 SOV_develop_tatarstan_industry_desc: "KamAZ trucks, Kazan aircraft and Samara rocket engines make the Volga the country's workshop. We fund a new industrial complex in Tatarstan. A republic that earns for the federation also expects a say in how it is run."
 SOV_fd_urals_revival: "Urals Industrial Revival"
 SOV_fd_urals_revival_desc: "Uralvagonzavod, Magnitogorsk and the Chelyabinsk tractor plant survived the 1990s on military orders. Federal money for a new arms line at Nizhny Tagil keeps the directors loyal and the shops busy."
 SOV_fd_east_polygon: "Eastern Polygon"
 SOV_fd_east_polygon_desc: "The Baikal-Amur and Trans-Siberian lines carry coal and containers east, and their capacity has been the bottleneck for years. We widen the main line through Krasnoyarsk and Irkutsk, which also ties both oblasts to federal money. Monthly loyalty loss in Siberia drops from 0.2 to nothing."
 SOV_fd_far_east_hectare: "Far Eastern Hectare"
 SOV_fd_far_east_hectare_desc: "Since 2016 any citizen can claim a free hectare of land in the Far East, and a ministry in Khabarovsk coordinates the program and its subsidies. We begin with farmland in Amur. Monthly loyalty loss in the district falls from 0.4 to 0.1."
 SOV_fd_arctic_route: "Arctic Zone and Northern Sea Route"
 SOV_fd_arctic_route_desc: "Melting ice makes the Northern Sea Route usable for most of the summer. Sevmash builds the icebreakers, and the Yamal LNG terminal needs an all-weather road to ship its gas. The North, from Arkhangelsk to Chukotka, gets a single development plan."
 SOV_fd_power_sharing: "Power-Sharing Treaties"
 SOV_fd_power_sharing_desc: "Tatarstan signed the first one in 1994, and it lasted until 2017. We write new agreements that name specific powers for the republics, so that both sides can point to a text. Kazan and Makhachkala will read the terms closely, and monthly loyalty loss in the Volga falls from 0.3 to 0.1."
 SOV_fd_governor_rotation: "Rotation of Governors"
 SOV_fd_governor_rotation_desc: "Regional chiefs who stay too long grow roots, so the Kremlin moves them or retires them early. Younger technocrats replace the old barons, with less baggage and fewer favors owed. Appointments become more effective and less resented."
 SOV_fd_rosgvardia: "National Guard Regional Commands"
 SOV_fd_rosgvardia_desc: "Formed in 2016 from the Interior Ministry's troops, the National Guard reports directly to the president. A command in each district can reinforce a governor within hours. Curfews in the North Caucasus become more effective as a result."
 SOV_fd_unified_federation: "Unified Federation"
 SOV_fd_unified_federation_desc: "The 2020 constitutional amendments wrote territorial integrity into the text and placed the regions inside one system of public power. We pass similar changes. Who rules Kazan or Khabarovsk is settled on paper, and loyalty is easier to keep."
 SOV_fd_setup_tt: "Each of the eight federal districts gets a loyalty rating from 0 to 100. Every rating slips each month unless Moscow funds projects or appoints governors. A summed modifier follows the average, so a loyal federation helps and a restless one hurts."
 SOV_fd_governor_unlock_tt: "Unlocks the §YKremlin Governor§! decision for each federal district."
 SOV_fd_power_sharing_tt: "The Tatarstan sovereignty event gains a treaty option."
 SOV_fd_rosgvardia_tt: "Curfews in the North Caucasus raise loyalty more."
 SOV_fd_loyalty_below_90_tt: "The district's loyalty is below 90"
 SOV_fd_loyalty_below_95_tt: "The district's loyalty is below 95"
