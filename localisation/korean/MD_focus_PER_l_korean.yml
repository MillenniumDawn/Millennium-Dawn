 PER_domestic_politics: "Iranian Domestic Affairs"
 PER_domestic_politics_desc: "우리의 국내 정세는 우리 정당, 이념, 국가 방향에 의해 형성됩니다. 정부가 성장함에 따라 더 많은 결정을 내릴 수 있게 됩니다."
 PER_state_visit_to_usa: "[USA.GetFlag] 미합중국으로 국빈 방문"
 PER_state_visit_to_usa_desc: "미국에 있는 오랜 친구들을 국빈 방문하도록 주선하면, 우리가 그토록 고립되어 온 세계에서 새로운 동맹을 맺는 데 도움이 될 수 있습니다."
 PER_reestablish_savak: "£PER_monarchism 사바크 (SAVAK) 재건"
 PER_reestablish_savak_desc: "사바크는 수년 전 이슬람 공화국의 손에 해체되어 국가의 비밀경찰이 파괴되었습니다. 그러나 오늘날에는 몇 가지 개혁과 국제적 수준의 로비를 통해 사바크의 복귀와 재건을 정당화할 수 있을 것입니다."
 PER_restore_bandar_pahlavi: "팔라비 항구 복원"
 PER_restore_bandar_pahlavi_desc: "팔레비 항으로도 알려진 반다르에팔레비는 1979년 군주제 전복 이후 반다르안잘리로 개명되었습니다. 물라들이 가한 이 변경을 되돌리면 정부가 어느 정도 정통성을 되찾는 데 도움이 될 수 있습니다."
 PER_distribute_leader_photos: "[PER.GetLeader]의 자화상 배포"
 PER_distribute_leader_photos_desc: "국민의 가정, 사무실, 그 밖의 모든 건물에 걸린 하메네이와 호메이니의 초상화를 [PER.GetLeader]의 초상화로 교체해야 합니다. 이는 우리의 혁명과 대의를 공고히 하는 데 도움이 될 수 있습니다."
 PER_redesign_the_gulf: "반다르아바스 재설계"
 PER_redesign_the_gulf_desc: "반다르아바스는 특히 우리가 개조하고 개선한다면 다시 한번 페르시아만의 주요 무역항이 될 것입니다."
 PER_establish_support_in_yemen: "예멘에서의 지지 확립"
 PER_establish_support_in_yemen_desc: "예멘의 상황이 서서히 불안정해지고 있습니다. 이 아랍 국가에서 어떤 형태로든 지지 기반을 확립해야 합니다."
 PER_move_capital_esfahan: "이스파한으로 수도 이전"
 PER_move_capital_esfahan_desc: "수도를 이스파한으로 옮기면 전쟁 시 국가에서 가장 중요한 도시의 안전을 확보할 수 있습니다. 이스파한은 국가의 중앙에 있어 이웃 국가들로부터 멀리 떨어져 있으므로 이 이전에 완벽한 위치입니다."
 PER_savak_tt: "§H사바크§!가 §G재건§!됩니다"
 PER_the_third_development_plan: "제3차 개발 계획"
 PER_the_third_development_plan_desc: "제3차 개발 계획은 우리나라의 근대사 내내 시행해 온 여러 5개년 계획 중 하나입니다. 산업화와 자급자족에 중점을 두어 이란이 경제 회복의 올바른 길에 올라서야 합니다."
