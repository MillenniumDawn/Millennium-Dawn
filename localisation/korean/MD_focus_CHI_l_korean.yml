 2_per_capita_or_more_tt: "그들의 §Y1인당 GDP§!가 §G2 이상§!입니다"
 on_cancel_idea_tt: "§Y이 국가 정신이 종료되면 다음이 일어납니다.§!"
 CHI_054a_production_line: "054A 생산 라인"
 CHI_054a_production_line_desc: "모든 함대에는 주력이 필요하며, 우리의 주력은 054A형입니다. 2008년부터 끊이지 않고 건조된 이 유능하고 값싼 호위함은 해군의 표준 호위함이 되었으며, 같은 해 중국이 해적 퇴치 순찰에 참여했을 때 아덴만으로 파견되어 먼 해역에서의 첫 장기 임무를 수행한 함정이기도 합니다."
 CHI_45g_national_deployment: "5G 네트워크 구축"
 CHI_45g_national_deployment_desc: "차이나 모바일이 상용 4G를 개시하고, 3년 만에 우리는 나머지 세계를 합친 것보다 많은 기지국을 갖게 됩니다. 공업정보화부가 세 사업자 모두에 5G 면허를 발급하고, 서방 통신사들이 구축 전략을 논의하는 사이 우리는 10억 명의 사용자에게 서비스하는 410만 개의 5G 기지국을 운영하고 있습니다. 기반시설 격차는 이제 우리가 좁혀 가는 것이 아니라, 우리가 뒤집은 것입니다."
 CHI_863_ic_preparatory_research: "863 계획 집적회로 사전 연구"
 CHI_863_ic_preparatory_research_desc: "국가 첨단기술 발전 계획에 따라 집적회로 설계와 제조가 우선 분야로 지정됩니다. 국가 자금이 대학 연구 센터와 주강 삼각주 및 상하이의 초기 단계 파운드리 시범 사업으로 흘러 들어가, 훗날 국가 집적회로 기금이 산업 생산으로 확대할 인적 자본과 공급망의 기초를 놓습니다. 우리는 수확을 보기까지 10년이 걸릴 땅에 씨앗을 심고 있습니다."
 CHI_863_nev_program: "863 계획 신에너지차 트랙과 십성천량"
 CHI_863_nev_program_desc: "아우디에서 9년을 보내고 중국으로 돌아온 엔지니어 출신 장관 완강은 우리가 내연기관을 완전히 건너뛸 수 있다고 주장했습니다. 십성천량 계획은 시범 도시들에 신에너지차 공공 차량단을 배치하고, 선전은 버스와 택시 전체를 전동화합니다. 착공 357일 만에 지어진 테슬라 상하이 기가팩토리는 모든 중국 전기차 제조업체가 품질과 생산 속도로 경쟁하도록 강제하는 촉매가 됩니다. 우리가 만든 시장에서 이보다 못한 결과를 기대해서는 안 되었습니다."
 CHI_a_lighter_touch_on_dissent: "반대 의견에 대한 부드러운 접근"
 CHI_a_lighter_touch_on_dissent_desc: "내부 강압을 격화시키는 대신, 신중히 관리되는 범위 안에서 시민 사회의 표현과 지적 논쟁을 위한 제한적인 공간을 허용합니다. 이 접근은 단기적인 정치적 통제를 내주는 대신 지하 조직화를 부추기는 마찰을 줄입니다."
 CHI_abolish_term_limits: "임기 제한 폐지"
 CHI_abolish_term_limits_desc: "전국인민대표대회는 헌법에서 국가주석의 2연임 제한을 삭제하는 안건을 찬성 2,958표, 반대 2표, 기권 3표로 가결합니다. 표결은 명목상으로는 아니지만 사실상 만장일치입니다. 권력은 더 이상 헌법상의 시계에 얽매이지 않습니다. 이 결정은 마오 이후 개혁 이래 개인 권력에 대한 가장 중요한 제도적 제약을 없앱니다."
 CHI_above_the_neck_reform: "목 위의 개혁"
 CHI_above_the_neck_reform_desc: "과거의 7대 군구는 지상군에 예속되어 각자의 전쟁을 치렀습니다. 2016년 우리는 먼저 '목 위'를 잘라 냅니다. 중앙군사위원회가 직접 지휘권을 장악하고, 5개 전구 사령부가 군구를 대체하며, 하나로 싸울 합동참모부가 탄생합니다. 병력에 앞서 지휘를, 몸에 앞서 머리를 정비합니다."
 CHI_active_defense_doctrine: "적극 방어"
 CHI_active_defense_doctrine_desc: "적극 방어는 마오 이래 군의 지도 전략이었습니다. 전략적으로는 방어적이되 작전적, 전술적으로는 공세적입니다. 우리는 이를 미사일 시대에 맞게 벼리며, 조국을 지키는 가장 확실한 방법은 적의 선봉이 상륙하기 전에 타격하는 것이라고 봅니다."
 CHI_African_Continental_Integration: "중국-아프리카의 세기"
 CHI_African_Continental_Integration_desc: "우리는 연간 양자 무역액이 2,540억 달러를 넘는 아프리카 최대의 단일 무역 파트너가 되었습니다. 항만, 철도, 경제특구에 대한 수십 년간의 BRI 투자 덕분에 우리의 기반시설과 자본은 아프리카 연합의 대륙 통합 구상에 없어서는 안 될 존재가 되었습니다. 이제 이 경제적 비중을 지속적인 제도적 동반자 관계로 전환할 때가 되었습니다."
 CHI_agricultural_tax_abolition: "농업세 폐지"
 CHI_agricultural_tax_abolition_desc: "싼눙 문제, 즉 농업, 농촌, 농민 문제는 공식 논의가 베이징에 닿기 훨씬 전부터 중국 농촌 전역에서 폭발적인 사안이 되어 있었습니다. 안후이성에 기반을 둔 농촌 세금 개혁 시범 사업은 지방 부과금의 부담이 농민 소득과 농업 투자를 얼마나 깊이 억눌러 왔는지 드러냈습니다. 중앙위원회 1호 문건은 10년 연속으로 농촌 문제로 돌아왔습니다. 1958년의 농업세 조례를 폐지하면 수십 년을 기다려 온 농촌 자본이 허난의 중원, 후난의 쌀 곡창 지대, 쓰촨 분지로 흘러갈 수 있게 됩니다."
 CHI_AIIB_Founding: "아시아인프라투자은행"
 CHI_AIIB_Founding_desc: "워싱턴의 거센 반대에도 우리가 57개 회원국과 함께 설립한 아시아인프라투자은행은 아시아와 그 너머의 기반시설에 다자간 금융을 제공합니다. 이 은행의 존재는 우리가 브레턴우즈 체제 밖에서 신뢰할 만한 국제기구를 온전히 세울 수 있음을 보여 줍니다. 개발 금융에 대한 서방의 독점은 깨졌습니다."
 CHI_An_Alliance_to_Rival_NATO_tt: "§Y세력을 창설하면 효과가 표시됩니다§!"
 CHI_anshan_steel_modernization: "안산 제철 단지 현대화"
 CHI_anshan_steel_modernization_desc: "중국에서 가장 오래되고 가장 큰 일관 제철 단지인 안산 철강 그룹이 대대적인 현대화 계획을 거칩니다. 낡은 평로는 염기성 산소 제강법으로 교체되어 비용을 줄이고 후방 제조업의 품질 한계를 끌어올립니다."
 CHI_ant_group_empire: "앤트 그룹의 금융 제국"
 CHI_ant_group_empire_desc: "알리바바에서 분사한 앤트 그룹은 위어바오, 즈마 신용, 화베이, 마이뱅크를 아우르는 금융 제국을 구축하고, 해외에서는 페이티엠, 지캐시, 다나를 후원합니다. 소비자 대출은 모든 국영 은행을 구속하는 규칙 밖에서 운영되며, 마윈은 와이탄 서밋에서 이들 은행을 전당포에 비유하며 공개적으로 도전합니다. 규제 당국이 이를 눈여겨보았습니다."
 CHI_anti_japanese_boycott_campaign: "반일 불매 운동"
 CHI_anti_japanese_boycott_campaign_desc: "대중은 분노하고 있습니다. 우리가 그들의 분노를 만들어 낸 것은 아닙니다. 우리는 단지 그 길을 막지 않기로 했을 뿐이며, 우리가 그렇게 하기로 마음먹는 순간까지 그럴 것입니다."
 CHI_Arab_League_Cooperation_Forum: "중국-아랍 국가 포럼"
 CHI_Arab_League_Cooperation_Forum_desc: "중국-아랍국가협력포럼은 아랍 연맹 22개 회원국 전원의 외무장관을 소집하여 BRI 사업 계획, 무역 정책, 정치적 노선을 조율합니다. 이를 통해 우리는 서방 주도 체제를 완전히 우회하는 중동으로의 상설 제도적 통로를 유지합니다. 아랍 국가들은 우리 자본에 대한 입증된 접근권을 통해 전통적 파트너에 대한 협상력을 얻고, 우리는 우리의 방침을 따라 표를 던지는 블록을 얻습니다."
 CHI_arms_for_influence: "영향력을 위한 무기"
 CHI_arms_for_influence_desc: "수출 상자 하나하나는 현금 이상의 것을 사들입니다. 우리는 서방의 어떤 공급자도 손대지 않을 고객에게 무장을 제공하고, 그 대가를 항만, 표, 충성으로 거두어, 군의 무기 거래를 조용한 외교 정책의 수단으로 바꿔 놓습니다."
 CHI_army_aviation_corps: "육군 항공대"
 CHI_army_aviation_corps_desc: "날지 못하는 군대는 빠르게 타격할 수 없습니다. 우리는 Z-10 공격 헬리콥터와 Z-20 수송 헬리콥터로 육군 항공 병과를 확충하여, 신속 여단에 자체 건십과 수송 수단을 부여해 지형을 뛰어넘어 적의 배후에 병력을 내려놓을 수 있게 합니다."
 CHI_army_reorganisation: "육군 재편"
 CHI_army_reorganisation_desc: "새로운 13개 집단군은 균형을 맞추고 번호를 다시 매겨 각각 둔중한 사단이 아닌 제병 협동 여단으로 구성됩니다. 지상군은 더 날렵하고 모듈화되며 마침내 상호 교환이 가능해져, 전투가 요구하는 대로 집중하거나 분산할 수 있게 됩니다."
 CHI_artillery_modernisation: "포병 현대화"
 CHI_artillery_modernisation_desc: "포는 그것을 조준하는 체계만큼만 쓸모가 있습니다. 대포병 레이더, 디지털 사격 통제, 정밀 포탄은 포병을 면적 무기에서 수술용 메스로 바꿔 놓아, 첫 일제 사격부터 정확하게 타격합니다."
 CHI_assuage_japanese_concerns: "일본의 우려 완화"
 CHI_assuage_japanese_concerns_desc: "그들은 우리의 해안 경비대를 지켜봅니다. 우리의 미사일 시험을 지켜봅니다. 그러니 우리가 공개적으로 훈련을 취소하면 그들은 알아차립니다."
 CHI_astana_speech: "실크로드 경제 벨트"
 CHI_astana_speech_desc: "아스타나의 나자르바예프 대학에서의 연설은 중앙아시아를 거쳐 우리를 유럽과 잇는 '실크로드를 따라 경제 벨트를 공동으로 건설하자'고 제안했습니다. 다음 달 인도네시아에서 발표된 21세기 해상 실크로드와 결합하여 일대일로 구상이 형태를 갖춥니다. 이제 기반시설 금융, 항만 양허, 철도 계약이 세계 질서를 바꿀 규모로 베이징에서 바깥으로 흘러나가야 합니다."
 CHI_avic_reunification: "AVIC 재통합"
 CHI_avic_reunification_desc: "경쟁을 유도하기 위해 1999년 라이벌 두 개로 쪼개진 항공 산업은 중복과 다툼만 배웠습니다. 2008년 AVIC I과 AVIC II가 하나의 항공공업 그룹으로 다시 꿰매어져, 공군이 수십 년간 기다려 온 전투기, 엔진, 항전 장비가 하나의 지붕 아래 놓입니다."
 CHI_Back_Channel_to_Foggy_Bottom: "포기 보텀으로 가는 비공식 채널"
 CHI_Back_Channel_to_Foggy_Bottom_desc: "중국과 미국의 외교팀은 대사관 뒷방과 트랙 II 중개자들을 통해 은밀한 비공식 채널을 구축합니다. 양측은 한반도 문제가 상호 양보 없이는 해결될 수 없다는 점을 사적으로 인정합니다."
 CHI_banking_recapitalisation: "은행 부문 자본 재확충"
 CHI_banking_recapitalisation_desc: "우리 은행 부문은 1990년대 신용 팽창기에 막대한 부실 채권을 쌓았습니다. 우리는 공공 자본을 투입해 국유 은행 대차대조표에서 이 부채를 털어낸 뒤, 구조조정을 마친 기관들을 홍콩 거래소에 상장해야 합니다. 외국인 소수 주주와 국제 회계 기준이 뒤따를 것이며, 이는 우리 금융 체계가 현재 지니지 못한 신뢰성을 부여할 것입니다."
 CHI_baosteel_ipo: "바오강 기업공개"
 CHI_baosteel_ipo_desc: "바오산 철강이 당시 우리 역사상 최대 규모의 기업공개로 상하이 증권거래소에 상장하여 77억 위안을 조달합니다. 신일철의 기술 면허로 설립된 바오강은 주룽지의 '대형은 꽉 잡고 소형은 풀어 준다'는 정책 아래 상하이 야금 지주와 메이산을 흡수했습니다. 고급 자동차용 강판과 전기강판의 통합은 중국 철강 부문 현대화의 기준을 세웁니다."
 CHI_baowu_merger: "바오우 철강의 탄생"
 CHI_baowu_merger_desc: "바오강 그룹과 우한 철강 공사의 합병으로 중국 바오우 철강 그룹이 탄생하며, 세계적 규모로 경쟁할 수 있는 국가 철강 챔피언을 육성한다는 우리 전략의 닻이 됩니다. 천더룽 회장 아래에서 바오우는 이후 마안산 철강, 타이위안 철강, 충칭 철강, 신장 바이이 철강을 인수합니다. 연간 1억 1,500만 톤 이상을 생산하는 바오우는 아르셀로미탈을 제치고 세계 최대의 철강 제조업체가 되었습니다."
 CHI_bat_platform_rise: "BAT의 부상"
 CHI_bat_platform_rise_desc: "바이두, 알리바바, 텐센트가 우리의 인터넷을 규정합니다. 바이두는 구글의 철수 이후 검색을 지배하고, 알리바바는 세계 최대의 전자상거래 생태계를 구축했으며, 텐센트의 위챗은 13억 사용자에 이릅니다. 서방 경쟁사를 막아 둔 정책 환경이 이 기업들을 만든 것은 아니지만, 실리콘 밸리 자본에 인수되거나 파괴되지 않고 성장할 공간을 주었습니다. 그 공간은 전략적 선택이었으며 옳은 선택이었습니다."
 CHI_bayan_obo_ree_group: "바이윈어보와 중국희토그룹"
 CHI_bayan_obo_ree_group_desc: "덩샤오핑은 중동에는 석유가 있고 우리에게는 희토류가 있다고 말했습니다. 중국북방희토그룹이 운영하는 내몽골 바오터우의 바이윈어보 광상은 세계 최대의 경희토류 매장지이며, 장시의 간저우 광산은 디스프로슘과 터븀을 비롯한 중희토류를 공급합니다. 공업정보화부는 6개 지역 생산업체를 중국희토그룹과 중국북방희토그룹으로 통합했습니다. WTO 판정 이후 공식 폐지된 수출 쿼터는 같은 효과를 내는 수출 면허와 생산 쿼터로 되돌아옵니다. 다른 나라들이 대체재를 찾기 전에 이 지렛대를 활용해야 합니다."
 CHI_Beidou_Latin_Constellation: "베이더우 라틴 위성군"
 CHI_Beidou_Latin_Constellation_desc: "아르헨티나와 베네수엘라에 있는 우리 베이더우 항법 시스템의 지상국은 위성군의 정밀도를 서반구까지 넓히고 미국 GPS 기반시설에 대한 지역의 의존을 줄입니다. 이 이중 용도 시설은 민간 농업과 측량 계약을 뒷받침하는 한편 우리에게 전략적 위치 정보를 제공합니다. 워싱턴은 이 시설을 아메리카 대륙에서의 자국 신호 정보 우위에 대한 직접적 도전으로 여기며, 워싱턴의 판단이 옳습니다."
 CHI_beijing_action_plan_green_olympics: "녹색 올림픽 행동 계획"
 CHI_beijing_action_plan_green_olympics_desc: "올림픽 유치 신청에서 우리는 IOC에 환경적으로 책임 있는 행사를 약속했습니다. 이제 그 약속을 지켜야 합니다. 대규모 조림, 베이징 난방망 전반의 석탄-가스 연료 전환, 수도 밖으로의 산업 이전, 강화된 차량 배출 기준, 6개 도시에 걸친 경기장 건설이 그것입니다. 세계가 지켜볼 것입니다."
 CHI_beijing_command_clique: "베이징 지휘부 파벌"
 CHI_beijing_command_clique_desc: "지방 파벌들이 수도로 집결합니다. 매수된 장성들의 조직망이 베이징 자체의 지휘 기관을 장악하여, 그들의 승인과 몫 없이는 어떤 승진도, 계약도, 보직도 움직이지 못하게 됩니다."
 CHI_Beijing_Communique: "베이징 평화 공동성명"
 CHI_Beijing_Communique_desc: "우리는 역사적인 사우디-이란 관계 정상화의 중재자로 자리매김하여, 두 지역 라이벌이 우리의 중재 아래 외교 관계를 복원하도록 했습니다. 이 공동성명은 우리가 워싱턴이 할 수 없거나 하지 않을 지정학적 결과를 이끌어 낼 수 있음을 보여 주며, 대안적 안보 보장국으로서의 신뢰를 굳혀 줍니다. 이제 지역 여론은 눈에 띄게 우리의 외교적 리더십 쪽으로 기울고 있으며, 우리는 그 이점을 밀어붙여야 합니다."
 CHI_beijing_tianjin_hsr: "베이징-톈진 고속철도"
 CHI_beijing_tianjin_hsr_desc: "시속 350km로 30분 만에 주파하는 117km의 베이징-톈진 도시간 철도는 중국 고속철도 확장의 개막을 알립니다. 가와사키, 지멘스, 알스톰, 봄바디어에서 면허를 받은 기술은 이후 합병하여 CRRC가 된 중국남차와 중국북차를 통해 흡수되고 토착화됩니다. 원저우 충돌 사고로 속도는 시속 300km로 낮아지고 품질 기준이 강화됩니다. 노선망은 이제 4만 km를 넘어섰으며, 우리는 이제 막 건설을 시작했을 뿐입니다."
 CHI_below_the_neck_disband: "목 아래 해체"
 CHI_below_the_neck_disband_desc: "최고 사령부가 재편되자 칼날은 몸으로 향합니다. 2017년 4월부터 '목 아래' 개혁은 군단을 제병 협동 여단으로 해체하고, 30만 병력을 감축하며, 육군을 물량에서 기동으로 전환합니다. 남은 부대가 실제로 싸울 수 있도록 군 전체가 명부에서 사라집니다."
 CHI_Belt_and_Road_Vision: "일대일로 구상"
 CHI_Belt_and_Road_Vision_desc: "일대일로 구상을 개시하여 도로, 철도, 항만, 디지털 네트워크를 통해 아시아, 아프리카, 유럽을 중국과 연결하는 기반시설 사업에 수천억을 투자합니다."
 CHI_Bide_Your_Time: "재능을 감추고 때를 기다린다"
 CHI_Bide_Your_Time_desc: "덩샤오핑의 격언을 따릅니다. 대립을 피하고, 경제적 유대를 쌓으며, 종합 국력을 조용히 축적합니다. 중국의 부상이 반드시 이에 맞서는 연합을 불러일으킬 필요는 없습니다."
 CHI_big_four_ipo: "4대 은행 기업공개 물결"
 CHI_big_four_ipo_desc: "우리 국유 은행들은 전례 없는 상장 물결을 완수하고 있습니다. 중국건설은행은 홍콩에서 92억 달러를 조달하고, 중국공상은행의 홍콩-상하이 동시 이중 상장은 219억 달러로 세계 기록을 세우며, 중국농업은행이 221억 달러로 이를 넘어섭니다. 중국공상은행은 이제 총자산 기준 세계 최대의 은행이며, 4대 은행은 금융안정위원회의 글로벌 시스템적 중요 은행 목록에 오릅니다. 중앙후이진투자공사는 각 은행의 최대 주주로 남아 있습니다."
 CHI_big_fund_phase2: "빅 펀드 2기"
 CHI_big_fund_phase2_desc: "국가 집적회로 기금 2기는 미국 제재로 드러난 공급망의 틈을 메우기 위해 장비, 소재, 첨단 패키징에 투입할 2,000억 위안을 조성합니다. 이어 3,000억 위안이 넘는 3기가 뒤따르며, 이는 반도체 역사상 최대의 단일 자본 동원입니다. 전략은 생산 능력 확대에서 완전한 수직 통합으로 옮겨 갔습니다. 원시 웨이퍼부터 패키징된 SoC까지 모든 단계가 국내에서 조달되거나 국내에서 개발될 것입니다. 이보다 못해서는 우리에게 필요한 안보를 얻을 수 없습니다."
 CHI_big_fund_phase_1: "반도체 산업 투자 기금"
 CHI_big_fund_phase_1_desc: "국무원은 반도체를 전략 산업으로 지정하는 18호 문건을 발표했습니다. 국가 집적회로 산업 투자 기금, 즉 빅 펀드는 첫 마감에서 1,387억 위안을 조달하여 파운드리, 설계, 장비 전반에 걸친 국가 주도 자본 동원의 닻을 내립니다. 우리는 SMIC, 화웨이 하이실리콘, 그리고 지방의 여러 공동 투자 기구에 자금을 투입합니다. 우리는 더 이상 TSMC와 ASML에 대한 기술 의존을 감당할 수 없으며, 이 기금은 우리의 의지 선언입니다."
 CHI_blue_granary_aquaculture: "푸른 곡창"
 CHI_blue_granary_aquaculture_desc: "우리 양식업 부문은 연간 5,200만 톤을 생산하며, 이는 세계 생산량의 약 60%이자 우리 수산물 수확량의 80%에 해당합니다. 광둥의 주강 삼각주는 세계에서 가장 조밀한 틸라피아 양식장 망을 보유하고, 저장의 닝보-저우산 해안은 새우와 게 생산을 지배합니다. 황해의 실험적 심해 연어 양식장은 연안 농업 지구를 단백질 수출 거점으로 바꾸고 있지만, 항생제 남용과 타이호 호수의 부영양화는 우리가 무기한 외면할 수 없는 해결되지 않은 환경 비용으로 남아 있습니다."
 CHI_bow_to_china_dream: "중국몽에 머리를 숙이다"
 CHI_bow_to_china_dream_desc: "반부패의 폭풍이 몰아칠 때 동맹은 부러지지 않고 휘어집니다. 파벌은 시진핑의 중국몽에 대한 충성을 요란하게 맹세하고, 상징적인 몇몇을 넘겨주며, 공공연한 약탈을 조용한 특권과 맞바꿔 생존을 삽니다."
 CHI_break_the_first_island_chain: "제1도련선 돌파"
 CHI_break_the_first_island_chain_desc: "도련선은 규슈에서 류큐 열도를 거쳐 대만까지 이어집니다. 40년 동안 이 선은 우리 해군을 연안 해역에 가둬 두었습니다. 사슬은 가장 약한 고리가 양보하는 곳에서 끊어집니다. 그 고리는 양보할 것입니다."
 CHI_BRI_Forum_Beijing: "일대일로 국제협력 포럼"
 CHI_BRI_Forum_Beijing_desc: "베이징에서 열리며 회를 거듭할수록 커지는 일대일로 국제협력 정상포럼은 100개국 이상의 국가 원수와 고위 관리를 소집하여 사업 계획을 조율하고, 기본 협정에 서명하며, 세계 개발 의제에 대한 우리의 리더십을 과시합니다. 어떤 나라도 자국의 식탁 둘레에 이러한 회합을 모을 수 없습니다."
 CHI_byd_catl_integration: "꿈을 짓다"
 CHI_byd_catl_integration_desc: "선전에서 배터리 제조사로 출발한 왕촨푸의 BYD는 순수 내연기관 차량 생산을 중단했으며, 블레이드 배터리 LFP 셀-투-팩 기술은 안전성과 비용의 새로운 기준을 세우고 있습니다. 닝더에 본사를 둔 CATL은 정부의 배터리 화이트리스트를 활용해 파나소닉, LG, 삼성 SDI를 충분히 오래 배제함으로써 견고한 입지를 구축했습니다. 두 회사는 이제 세계 전기차 배터리 생산의 60% 이상을 통제합니다. 우리는 이 산업을 무에서 일구었으며, 이 산업은 우리의 것입니다."
 CHI_cadre_evaluation_reform: "간부 평가 개혁"
 CHI_cadre_evaluation_reform_desc: "우리의 간부 평가 체계는 너무 오랫동안 환경을 훼손하고 공공 서비스를 소홀히 하면서도 GDP 성장을 달성한 지방 관리들에게 보상을 주어 왔습니다. 우리는 경제 성과와 함께 환경 보호, 사회적 조화, 에너지 집약도에 대한 의무적 가중치를 도입해야 합니다. 성장의 조건을 파괴하며 성장을 이룬 관리는 승진할 자격이 없습니다."
 CHI_cadre_rotation: "간부 순환 제도"
 CHI_cadre_rotation_desc: "지방 포획은 중국 통치의 핵심에 있는 부패입니다. 같은 직위에 너무 오래 머무는 관리는 지역 기업 이익과의 유착이 생겨 판단력이 흐려집니다. 충칭의 경험을 활용한 체계적 순환 프로그램은 간부들을 정기적으로 다른 보직으로 이동시켜, 연고 관계망이 굳어지기 전에 끊어 놓습니다."
 CHI_caojing_seven_chem_bases: "상하이 차오징 석유화학 기지"
 CHI_caojing_seven_chem_bases_desc: "국무원은 7개의 국가 석유화학 기지를 지정합니다. 상하이 차오징 화학공업단지를 시작으로 난징, 닝보 다셰, 다야만, 취안저우, 다롄, 차오페이뎬이 이어집니다. 각 기지는 집중 증기 공급, 공동 폐수 처리, 전용 항만 시설, 통합 에틸렌 크래커를 갖추며, 이는 BASF가 루트비히스하펜에서 개척한 페어분트 모델을 복제한 것입니다. BASF, 바이엘, 엑손모빌, 셸, 사우디 아람코는 합작 투자나 100% 자회사를 통해 진입합니다. 100억 유로 규모의 BASF 잔장 단지는 BASF의 세계 최대 단일 투자가 되며, 이는 우리가 외국 자본에 문을 열기로 마음먹었을 때 우리 시장이 제공할 수 있는 것의 척도입니다."
 CHI_Central_Asia_Connectivity: "실크로드 경제 벨트"
 CHI_Central_Asia_Connectivity_desc: "실크로드 경제 벨트는 중앙아시아를 가로지르는 육로로 이어지며, 중국 철도 궤간을 러시아 광궤 철도망과 연결하는 철도-도로 환적 거점인 카자흐스탄 국경의 호르고스 관문 건조항이 그 닻입니다. 시간에 민감한 화물에서 운송 시간이 해상 운송을 앞서면서 이 회랑의 물동량이 늘어납니다. 경쟁 강대국들이 그 전략적 가치를 알아차리기 전에 이 회랑에 대한 투자를 가속해야 합니다."
 CHI_central_china_development: "중부 중국의 부상"
 CHI_central_china_development_desc: "허난, 후베이, 후난의 중부 성들은 연안 호황에서 비켜나 있었습니다. 조율된 개발 구상은 재정 이전, 기반시설 투자, 이전된 제조업을 이 지역으로 돌려, 중국의 인구와 농업 중심지를 성장 이야기에 단단히 묶습니다."
 CHI_central_manufacturing_belt: "중부 제조업 벨트"
 CHI_central_manufacturing_belt_desc: "2008년 이후 연안 임금이 오르면서 제조업체들이 서쪽의 안후이, 장시, 후난으로 밀려납니다. 공장 이전에 대한 국가 인센티브와 더 낮은 토지 및 노동 비용이 결합되어, 이 세 성은 10년 안에 중국의 중간 계층 산업 근간이 되고, 주강 삼각주와 창장 삼각주의 섬유, 전자, 자동차 부품 생산 사슬을 흡수합니다."
 CHI_central_military_civil_fusion: "군민 융합"
 CHI_central_military_civil_fusion_desc: "전시 경제와 민간 경제 사이의 장벽이 포고령으로 허물어집니다. 2017년 국가 우선 과제로 격상된 시진핑의 군민 융합 전략 아래, 상업 전자, 컴퓨팅, 항공우주의 모든 진전은 군을 위해 수확되고 모든 국방 돌파구는 산업으로 환류됩니다. 한 나라 전체의 연구가 총참모부의 실험실이 됩니다."
 CHI_central_urbanization_drive: "중부 중국 도시화 추진"
 CHI_central_urbanization_drive_desc: "중부 성들에서 약 1억 명으로 추산되는 농촌 이주민이 성도와 현급 도시로 이동하고 있습니다. 우리는 주택 보조금, 확대된 도시 서비스, 표적화된 호구 제한 완화로 이 전환을 가속해야 합니다. 인구 구조의 창이 아직 열려 있는 동안 중부 내륙을 노동력 저수지에서 소비 시장으로 바꿔야 합니다."
 CHI_Challenge_Dollar_Hegemony: "달러 패권에 도전"
 CHI_Challenge_Dollar_Hegemony_desc: "위안화를 대안 준비 통화로 홍보하고 양자 통화 스와프 협정을 체결하여 세계 금융에 대한 달러의 장악력을 약화시킵니다."
 CHI_change_lunar_exploration: "창어 달 탐사 계획"
 CHI_change_lunar_exploration_desc: "창어 무인 달 탐사 계획은 2007년 궤도선으로 시작하여 연착륙, 위투 로버, 그리고 역사상 처음으로 달 뒷면에 착륙선과 로버를 내려놓은 2019년 1월의 역사적인 창어 4호 임무로 이어졌습니다. 이 임무들이 보내온 자료는 달의 지질에 대한 우리의 이해를 새로 쓰고 이어질 유인 임무를 위한 과학적 토대를 마련합니다."
 CHI_china_among_the_starts: "별들 속의 중국"
 CHI_china_among_the_starts_desc: "우리의 선저우 계획은 우리를 독자적인 유인 우주 비행이 가능한 소수의 국가 반열에 올려놓았습니다. 이어진 임무들은 궤도 도킹, 선외 활동, 그리고 상주 우주 정거장의 토대를 확립했습니다. 이제 이 성과를 바탕으로 미국, 러시아와 어깨를 나란히 하는 주요 우주 강국의 지위를 확보해야 합니다."
 CHI_Chinese_Diplomacy: "중국 외교"
 CHI_Chinese_Diplomacy_desc: "중화는 역사적으로 동아시아 문제에서 중심 역할을 해 왔습니다. 이제 백년국치에서 회복한 만큼, 지역 이웃과 세계 기구를 아우르는 종합적 외교 전략을 그릴 때입니다."
 CHI_chongqing_model_nationalisation: "충칭 모델"
 CHI_chongqing_model_nationalisation_desc: "보시라이 치하의 충칭은 시장 자유화에 대한 국가주의적 대안이 중화인민공화국 안에서 여전히 실현 가능함을 보여 주었습니다. 전략 자산을 재국유화하고 국유 기업으로 신용을 돌림으로써 이 직할시는 전국 평균을 훨씬 웃도는 GDP 성장을 기록했습니다. 우리는 이 모델을 전국으로 확대할 것입니다."
 CHI_cic_forex_reserves: "중국투자공사"
 CHI_cic_forex_reserves_desc: "우리는 1조 4,000억 달러가 넘는 외환 보유고를 쌓았으며, 이는 우리 자신보다 미국의 자금 조달 필요에 더 이바지하는 저수익 미국 국채에 묶여 있습니다. 2,000억 달러로 자본금을 마련한 중국투자공사는 이 국부를 세계 사모 펀드, 기반시설, 전략 자산으로 다변화합니다. 금융 위기 당시 블랙스톤과 모건 스탠리에서 초기 손실을 본 뒤, CIC는 세계 최대 국부 펀드 중 하나인 1조 3,000억 달러 이상을 운용하는 규율 있는 투자자로 성숙합니다."
 CHI_cj10_cj20_cruise_missile_family: "CJ-10과 CJ-20"
 CHI_cj10_cj20_cruise_missile_family_desc: "장거리 순항 미사일은 폭격기에 타격력을 부여합니다. 지상 발사형 CJ-10과 공중 발사형 CJ-20은 H-6 한 대가 1,500km 떨어진 고정 표적을 타격하게 하여, 표적 상공에서 승무원을 위험에 빠뜨리지 않고 전력 전체의 도달 범위를 배가시킵니다."
 CHI_cloud_computing_triumvirate: "클라우드 컴퓨팅 3강"
 CHI_cloud_computing_triumvirate_desc: "알리바바 클라우드는 우리 퍼블릭 클라우드 시장의 39%를 차지하고, 텐센트 클라우드는 게임과 핀테크 백엔드의 중심이며, 화웨이 클라우드는 2019년 제재 이후 미국 서비스의 국내 대안으로 급성장합니다. 외국 사업자는 사이버보안법에 따라 합작 투자로 제한됩니다. 우리는 외국에 의존하지 않고 디지털 경제를 지탱할 만큼 큰 국내 클라우드 기반시설을 구축했으며, 이는 우연이 아니었습니다."
 CHI_coastal_acceleration_doctrine: "연안 가속 교리"
 CHI_coastal_acceleration_doctrine_desc: "우리의 연안 성들은 성장이 가장 빠르고 자유화의 수익이 가장 뚜렷한 곳입니다. 우리는 우대 정책을 주강 삼각주와 창장 삼각주에 집중해야 합니다. 수출 가공 구역을 늘리고, 산업단지의 토지 사용 쿼터를 완화하며, 연안 정부가 내륙에 앞서 기반시설 채권을 발행하도록 허용하는 것입니다. 연안이 모델을 입증하면 내륙이 뒤따를 것입니다."
 CHI_coastal_sez_2nd_generation: "2세대 경제특구"
 CHI_coastal_sez_2nd_generation_desc: "선전과 푸둥의 1세대 경제특구는 이 모델을 입증했습니다. 더 높은 부가가치의 외국 자본을 유치하기 위해 개선된 법적 틀, 향상된 물류, 강화된 지식재산권 보호를 갖춘 2차 구역이 상하이와 광둥에 지정됩니다."
 CHI_combat_engineer_modernisation: "공병 현대화"
 CHI_combat_engineer_modernisation_desc: "교량, 돌파구, 방어 시설은 여단이 움직일지 멈출지를 결정합니다. 공병대는 현대식 가교, 지뢰 제거, 토목 장비 차량으로 재무장하여 지형이 다시는 진격을 멈추지 못하게 합니다."
 CHI_commercial_launch_sector: "상업 발사 부문"
 CHI_commercial_launch_sector_desc: "2015년 이래 새로운 세대의 중국 상업 발사 기업들이 설계도에서 발사대로 나아갔습니다. 랜드스페이스는 2023년 주췌-2로 궤도에 도달한 최초의 메탄 연료 로켓을 쏘아 올렸으며, 갤럭틱 에너지와 아이스페이스는 여러 차례 소형 위성 발사에 성공했습니다. 이 생태계에 대한 국가의 지원은 우리의 산업 기반을 넓히고, 발사 비용을 낮추며, 민간 자본을 우주 경제로 끌어들입니다."
 CHI_common_prosperity: "공동부유"
 CHI_common_prosperity_desc: "공동부유는 이제 우리의 통치 우선 과제입니다. 성장은 소득 격차를 좁히고, 사회 서비스를 확대하며, 민간 부문의 과잉을 억제하는 쪽으로 방향을 돌려야 합니다. 과외 업체, 기술 플랫폼, 연예 산업은 새로운 경계를 받아들여야 합니다. 내세운 목표는 폭넓게 공유되는 발전이고, 실질적 효과는 우리의 손길을 벗어나 커져 버린 부문들에 대한 권위를 다시 확립하는 것이며, 두 가지 모두 동시에 사실입니다."
 CHI_common_prosperity_original: "공동부유"
 CHI_common_prosperity_original_desc: "발전의 목표는 가난한 이들이 부스러기를 두고 다투게 내버려 둔 채 케이크를 무한정 키우는 것이 아닙니다. 공동부유는 케이크를 키우면서 공정하게 나누는 것을 의미합니다. 소득을 재분배하고, 사회 서비스를 확대하며, 산업화의 열매가 공장을 계획한 관리뿐 아니라 공장을 세운 노동자에게도 닿도록 하는 것입니다."
 CHI_Community_of_Shared_Future: "인류 운명 공동체"
 CHI_Community_of_Shared_Future_desc: "서방 주도 기구의 대안으로 다자주의와 상생 협력을 주창하며 인류 운명 공동체 개념을 홍보합니다."
 CHI_Comprehensive_Agreement_Investment: "EU-중국 투자 협정"
 CHI_Comprehensive_Agreement_Investment_desc: "7년간의 협상 끝에 타결된 포괄적 투자 협정은 국가 보조금 투명성에 대한 약속의 대가로 우리 기업에 유럽 서비스 시장에 대한 향상된 접근권을 부여할 것입니다. 유럽 의회는 상호 제재 이후 비준을 보류했지만, 이 협정의 경제적 논리는 여전합니다. 비준된 협정은 역내 단일 시장 전반에서 중국 자본에 대한 장벽을 크게 낮출 것이며, 우리는 브뤼셀에 협정의 부활을 압박해야 합니다."
 CHI_construction_soe_champions: "국유 건설 챔피언"
 CHI_construction_soe_champions_desc: "중국건축공정총공사, 중국철도건설공사, 중국교통건설그룹, 중국전력건설그룹은 합쳐서 세계 건설업체 순위 상위 10곳 중 7곳을 차지합니다. 수십 년간의 국내 초대형 사업은 우리에게 200만 명이 넘는 숙련된 노동력, 서방 경쟁사보다 20~30% 낮은 단가, 그리고 어떤 민간 경쟁자보다 빠르게 자재를 조달하는 구매망을 안겨 주었습니다. 이러한 구조적 이점은 국내에서 수행하거나 해외에 판매하는 모든 종류의 자본 건설에서 곧바로 비용 절감과 공기 단축으로 이어지므로 지켜야 합니다."
 CHI_cosco_global_network: "코스코의 세계 해운망"
 CHI_cosco_global_network_desc: "코스코와 중국해운의 합병은 세계 최대 컨테이너 선사 중 하나를 탄생시켰고, 이어진 동방해외국제 인수로 우리의 영향권은 더욱 넓어졌습니다. 코스코 해운 항만은 이제 피레우스, 제브뤼허, 발렌시아, 싱가포르, 아부다비, 찬카이에서 터미널을 운영합니다. 21세기 해상 실크로드는 이 거점들을 5개 대륙에 걸친 국가 지원 네트워크로 연결합니다. 우리는 화물을 옮기는 데 다시는 외국 선사에 의존해서는 안 됩니다."
 CHI_Counter_Terrorism_Cooperation: "대테러 협력"
 CHI_Counter_Terrorism_Cooperation_desc: "테러리즘, 분리주의, 극단주의는 지역 안정을 위협합니다. SCO 내에 공동 대테러 기구를 설립함으로써 우리는 회원국 전반의 정보 공유와 보안 작전을 조율할 수 있습니다."
 CHI_crewed_lunar_landing: "유인 달 착륙"
 CHI_crewed_lunar_landing_desc: "중국의 유인 달 착륙 계획은 달 남극 지역을 목표로 하며, 2030년경 첫 착륙을 겨냥합니다. 임무 구성은 창정 10호 대형 로켓과 멍저우 유인 우주선, 란웨 착륙선을 결합하며, 원창 우주 발사장에서 따로 발사하여 달 궤도에서 랑데부합니다. 성공하면 중국은 인간을 달에 착륙시킨 두 번째 나라가 됩니다."
 CHI_cross_strait_military_posture: "양안 군사 태세"
 CHI_cross_strait_military_posture_desc: "독립 지지 세력이 타이베이에서 정치 권력을 공고히 했으며, 우리는 이러한 변화를 대응 없이 넘길 수 없습니다. 인민해방군은 대만 해협 전역에서 태세를 강화해야 합니다. 상륙 훈련의 빈도와 규모를 늘리고, 대만 방공식별구역으로의 항공기 출격을 일상화합니다. 통일은 단순한 정치적 선호가 아닙니다. 그것은 핵심적인 국가 목표이며, 그 뒤에 선 무력은 분명해야 합니다."
 CHI_crossborder_ecommerce: "국경 간 전자상거래"
 CHI_crossborder_ecommerce_desc: "우리 제조업체들은 이제 전통적으로 외국 브랜드가 통제하던 유통망을 우회해 전 세계 소비자에게 직접 판매합니다. 쉬인의 초고속 주기는 광저우 판위 공장에서 돌아가고, 테무는 출시 1년 만에 미국에서 가장 많이 내려받은 앱이 됩니다. 국경 간 수출은 4,000억 달러에 이르고, 서방 정부는 소액 면세 기준 제한으로 대응합니다. 그들이 다시 쌓고 있는 관세 장벽은 우리 수출업자들이 얼마나 효과적으로 변했는지 말해 줍니다."
 CHI_davos_boycott: "다보스 보이콧"
 CHI_davos_boycott_desc: "세계경제포럼은 주권적 발전을 다국적 금융의 선호에 종속시키는 질서, 즉 무국적 자본의 이념을 대표합니다. 우리는 더 이상 최고위 관리들을 스위스 산악 휴양지로 보내 은행가들 앞에 무릎 꿇게 하지 않을 것입니다. 우리의 길은 알프스의 눈으로 치장한 워싱턴 컨센서스가 아니라 자립과 국가 주도 성장입니다."
 CHI_Debt_Trap_Diplomacy: "부채 함정 외교"
 CHI_Debt_Trap_Diplomacy_desc: "채무국에 대한 중국의 영향력을 극대화하는 조건으로 대출을 제공합니다. 그들이 갚지 못할 때, 항만 접근권, 자원권, 정치적 노선 같은 형태로 전략적 양보를 얻어 냅니다."
 CHI_defence_industry_consolidation: "방위 산업 통합"
 CHI_defence_industry_consolidation_desc: "AVIC, CSIC, 노린코, 그리고 우리 방위 산업 기반의 다른 거대 복합 기업들은 개별적으로는 강력하나 전체적으로는 낭비적입니다. 우리는 이들을 SASAC의 더 엄격한 감독 아래 두고, 중복을 없애며, 연구 투자를 우선 사업으로 돌리고, 기업 경영진에 성과 계약을 부과해야 합니다. 쓰촨과 광둥의 전용 생산 시설은 확장되어야 하며, 장난 조선소는 지체 없이 새로운 조선소 투자를 받을 자격이 있습니다."
 CHI_designated_succesor: "지명된 후계자"
 CHI_designated_succesor_desc: "덩샤오핑이 설계한 집단 지도 체제에는 질서 있는 승계 장치가 포함되어 있었습니다. 즉, 역대 최고 지도자는 후계자를 육성하여 1인의 무기한 통치를 막아야 했습니다. 우리는 이제 그 전통에 대한 기대와 우리 자신의 권력 공고화 논리 사이에서 길을 찾아야 합니다. 지명된 후계자는 무제한적인 개인 권력을 경계하는 파벌들에게 안도감을 주며, 퇀파는 묵인의 대가로 상징적 양보를 얻어냅니다. 안정을 위해 치를 만한 대가입니다."
 CHI_Digital_Silk_Road: "디지털 실크로드"
 CHI_Digital_Silk_Road_desc: "5G 네트워크, 광케이블, 스마트 시티 기술을 통해 중국의 디지털 인프라를 개발도상국으로 확장하여 지속적인 기술적 의존 관계를 형성합니다."
 CHI_Digital_Silk_Road_Initiative: "디지털 실크로드 구상"
 CHI_Digital_Silk_Road_Initiative_desc: "화웨이와 ZTE는 이미 80개국 이상에 4G 및 5G 네트워크, 해저 케이블, 스마트 시티 감시 플랫폼을 구축했습니다. 디지털 실크로드는 협력국에 깊은 기술적 의존성을 만들어내고, 해당국의 통신 인프라에 대한 우선적 접근권을 우리에게 제공합니다. 서방의 규제 압력으로 더 많은 정부가 우리 기업을 배제하기 전에 이 사업을 가속해야 합니다."
 CHI_digital_yuan_ecny: "디지털 위안"
 CHI_digital_yuan_ecny_desc: "중국인민은행은 디지털 통화 전자 결제 프로젝트를 개시하여 선전, 쑤저우, 베이징의 시범 사업에서 상업 은행을 통해 e-CNY를 배포하고 있습니다. 현재 2억 6천만 개의 전자 지갑이 활성화되어 있습니다. mBridge 프로젝트는 SWIFT의 대안으로 홍콩, 태국, 아랍에미리트와 국경 간 CBDC 결제를 시험하고 있습니다. 디지털 위안은 단순한 결제 수단이 아니라 워싱턴에 의존하지 않는 통화 질서의 기반 시설입니다."
 CHI_distant_water_fishing_strategy: "원양 어업 전략"
 CHI_distant_water_fishing_strategy_desc: "우리의 원양 어선단은 이제 모리타니, 시에라리온, 아르헨티나, 페루의 배타적 경제 수역에서 조업하는 2,500척 이상의 선박으로 늘어났으며, 이 사업은 중국수산총공사가 서아프리카 해역으로 보낸 첫 원정에 뿌리를 두고 있습니다. 해외 진출 전략은 원양 어업을 식량 안보 정책의 영구적인 한 축으로 자리매김시킵니다. 연료 보조금, 제빙선, 바타, 월비스 베이, 몬테비데오의 항만 협정이 조업을 뒷받침하며, 저장성의 저우산 군도가 주요 가공 거점 역할을 합니다."
 CHI_ditiao_gang_crackdown: "불법 철강 단속"
 CHI_ditiao_gang_crackdown_desc: "연간 약 1억 4천만 톤의 불량 디탸오강 철강을 생산하는 미등록 유도로 제강소 600곳 이상을 폐쇄해야 합니다. 공업정보화부는 이를 공급 측 구조 개혁의 핵심 과제로 삼았습니다. 그림자 생산량이 흡수되면서 공식 생산 통계는 상승하고, 철강 품질은 개선되며, 저급 공급이 시장에서 제거됨에 따라 가격은 오를 것입니다. 이 혼란으로 이익을 챙기던 철근 상인들의 시대는 끝났습니다."
 CHI_document_nine: "9호 문건"
 CHI_document_nine_desc: "'이데올로기 영역의 현황에 관하여'라는 제목의 기밀 당 통지문은 억제해야 할 서방의 이데올로기적 위협 일곱 가지를 지목합니다. 즉 헌정 민주주의, 시민 사회, 신자유주의, 언론의 자유, 역사적 허무주의, 사회주의에 대한 의문 제기, 당 개혁에 대한 의심입니다. 대학과 국영 언론 전반에 의무 학습 모임이 지시됩니다. 허용되는 사상의 경계는 하룻밤 사이에 좁아지고, 충성은 외래 개념의 배격을 통해 증명됩니다."
 CHI_domestic_eda: "국산 EDA 및 IP"
 CHI_domestic_eda_desc: "집적 회로 설계에 쓰이는 도구인 전자 설계 자동화 소프트웨어는 거의 전적으로 케이던스, 시높시스, 멘토 그래픽스가 공급해 왔습니다. 미국이 EDA 도구를 기업 제재 명단의 통제 품목에 올린 뒤, 우리는 엠피리언 테크놀로지, 프리마리우스, 엑스피딕에 투자를 집중했습니다. 국산 EDA는 성숙 공정에서 전 과정을 아우르는 역량에 도달했으나, 5나노 미만 설계를 위한 첨단 공정 지원은 아직 부분적입니다. 국산 IP 블록에 대한 국가 인증이 EDA 개발을 보완하고 있으며, 워싱턴이 우리의 접근을 눈치채기 전에 남은 격차를 메워야 합니다."
 CHI_dragon_eye_over_lanzhou: "란저우 상공의 용의 눈"
 CHI_dragon_eye_over_lanzhou_desc: "중국이 자체 이지스를 구축합니다. 2004년 취역한 란저우함을 선두로 한 052C형 구축함은 346형 '용의 눈' 위상배열 레이더와 HHQ-9 미사일을 탑재하여, 중국 군함에 처음으로 진정한 함대 지역 방공 능력을 부여했습니다. 해군은 마침내 바다 위에서 자신의 하늘을 스스로 지킬 수 있게 되었습니다."
 CHI_dual_credit_auto_export: "이중 학점 제도와 세계 최대 수출국"
 CHI_dual_credit_auto_export_desc: "이중 학점 규제는 우리 시장의 모든 자동차 제조사에 연비 계정과 신에너지차 학점 계정을 별도로 부여하여, 직접 보조금을 경쟁 압력으로 대체하는 전기차 배출권 거래 방식을 만들어냅니다. 우리는 이제 연간 500만 대 이상의 차량을 수출하여 일본을 제치고 세계 최대 자동차 수출국이 되었습니다. 유럽 연합은 기본 관세에 더해 17퍼센트에서 37퍼센트의 관세를 부과하고, 미국은 우리 전기차에 100퍼센트를 부과합니다. 어느 장벽도 시장이 이미 내린 결정을 막지는 못할 것입니다."
 CHI_eat_imperial_grain: "황량을 먹다"
 CHI_eat_imperial_grain_desc: "호텔을 운영하고, 자동차를 밀수하고, 무기를 거래하는 군대는 당이 아니라 자신의 주머니에 충성합니다. 1998년 7월 장쩌민은 인민해방군에게 상업 제국을 포기하고 오로지 국가 예산으로 지급되는 곡식으로 살아가도록 명령했습니다. 우리는 그 길을 끝까지 갑니다. 급여를 받고 청렴하며 오직 베이징에만 응답하는 전문 군대입니다."
 CHI_ecommerce_infrastructure: "중국의 전자 상거래 인프라"
 CHI_ecommerce_infrastructure_desc: "타오바오는 무료 입점과 통합 메시지 기능으로 이베이 차이나를 꺾었고, 이후 티몰은 이 플랫폼을 해외 소매업체를 위한 브랜드 B2C 매장으로 확장했습니다. 징둥닷컴은 1,500개 창고망과 상시 배송 인력을 자체 구축하여, 우리가 물려받은 어떤 물류 서비스보다 빠르게 운영하고 있습니다. 전자 상거래는 이제 우리 소매 판매의 30퍼센트를 차지하며 이는 주요 경제국 가운데 가장 높은 비중이고, 이를 가능하게 한 인프라는 전적으로 우리의 것입니다."
 CHI_Economic_Framework_for_Unity: "통일을 위한 경제 체제"
 CHI_Economic_Framework_for_Unity_desc: "남북한과 강대국 후견국들이 경제 통합 로드맵을 구상합니다. 북한 인프라에 대한 중국의 투자, 한국의 기술 이전, 미국의 금융 보증이 통일 한반도의 가능성을 위한 토대를 이룹니다."
 CHI_Economic_Reintegration: "경제 재통합"
 CHI_Economic_Reintegration_desc: "우리는 북한 경제를 우리 산업권에 통합하는 긴 과정을 시작합니다. 투자는 북으로 흐르고, 원자재와 노동력은 남으로 흐릅니다. 한 세기 동안 잠들어 있던 조선과의 조공 관계가 사실상 복원됩니다."
 CHI_Eight_Country_Initiative: "태평양 8개국 구상"
 CHI_Eight_Country_Initiative_desc: "태평양 도서 8개국에 제안된 통합 안보 및 경제 체제는 서명 한 번으로 우리에게 지역 전역의 치안, 어업 감시, 데이터망 협정을 안겨줄 것입니다. 이 구상은 우리가 태평양 전역에서 축적한 외교적 자산이 오스트레일리아가 수십 년간 유지해 온 지역 구조에 맞서는 집단적 틀로 전환될 수 있는지를 시험합니다. 성공 여부에 따라 우리가 태평양의 제도 설계를 주도할지, 단지 참여하는 데 그칠지가 결정됩니다."
 CHI_eleventh_five_year_plan: "제11차 5개년 계획"
 CHI_eleventh_five_year_plan_desc: "다음 5개년 계획은 구속력 있는 목표를 설정해야 합니다. GDP 단위당 에너지 집약도를 20퍼센트 의무 감축하고, 주요 오염 물질 배출량을 10퍼센트 줄이며, GDP에서 서비스업이 차지하는 비중을 높이는 것입니다. 또한 연구와 교육에 대한 국가 투자를 늘리고 농촌 기반시설 건설을 가속해야 합니다. 이러한 제약이 없는 성장은 우리가 지속할 수 없는 성장입니다."
 CHI_establish_defence_conglomerates: "국방 복합기업 설립"
 CHI_establish_defence_conglomerates_desc: "흩어진 공장과 서로 다투는 부처로는 강대국을 무장시킬 수 없습니다. 우리는 방위 산업을 소수의 거대한 국유 복합기업으로 통합합니다. 각 기업은 자기 분야의 국가 대표 기업으로서 연구에 자금을 대고, 인재를 한데 모으며, 군의 명령에 대규모로 응답할 수 있습니다."
 CHI_Eurasian_Land_Bridge: "유라시아 대륙 횡단 철도 완성"
 CHI_Eurasian_Land_Bridge_desc: "이우-런던 화물 노선은 중국 동부에서 서유럽까지 끊김 없는 육상 철도 회랑이 상업적으로 운영 가능함을 입증했습니다. 유라시아 완전 통합은 우리 제조업체가 해상으로 걸리는 35일 대신 18일 만에 유럽 시장에 도달할 수 있음을 의미합니다. 이제 이 노선이 물동량에서 해상 운송에 필적할 때까지 수송 능력과 운행 빈도를 늘리기 위해 투자해야 합니다."
 CHI_Exercise_Paektu_Honor: "백두 명예 훈련"
 CHI_Exercise_Paektu_Honor_desc: "우리는 압록강 일대의 방어 태세를 강조하는 양자 군사 훈련을 통해 자제의 신호를 보냅니다. 워싱턴에 보내는 메시지는 분명합니다. 우리는 미국의 확전 대응 없이도 평양을 관리할 수 있다는 것입니다."
 CHI_Expand_Foreign_Service: "외교 공무원단 확대"
 CHI_Expand_Foreign_Service_desc: "우리는 영사망과 외교관단을 신속히 확대해야 합니다. 세계 어느 나라도 우리보다 많은 재외 공관을 유지하지 못하고 있으며, 우리는 그 우위를 더욱 밀어붙여야 합니다."
 CHI_export_processing_zones: "수출 가공 지구"
 CHI_export_processing_zones_desc: "장쑤, 푸젠, 저장에 지정된 수출 가공 지구는 보세 창고, 간소화된 통관, 노동비 우위를 제공하여 한국, 대만, 일본의 조립 사업을 끌어들입니다. 중국은 동아시아 생산망의 최종 조립 거점이 됩니다."
 CHI_fabless_design_cluster: "팹리스 설계 클러스터"
 CHI_fabless_design_cluster_desc: "우리의 반도체 설계 산업은 선전과 상하이를 중심으로 통합되었습니다. 국가 보조금이 수백 개의 스타트업을 소비자 전자제품, 통신, AI 가속기용 칩 설계로 끌어들였습니다. 선전은 PCB 조립, 위탁 제조, 소비자 전자제품 공급망과 가까워 자연스러운 거점이 되며, 이 도시의 설계 클러스터는 하이맥스, 락칩, 올위너와 수많은 소규모 설계 업체를 배출했고 그중 다수는 대기금 산하 지방 투자 기구의 후원을 받고 있습니다. 이 생태계의 깊이가 우리의 구조적 강점입니다."
 CHI_factional_balance: "파벌 균형"
 CHI_faw_changchun_automotive: "FAW 창춘 확장"
 CHI_faw_changchun_automotive_desc: "창춘에 본사를 둔 제일자동차(FAW)는 우리의 가장 오래된 자동차 제조사이며 나머지 자동차 산업이 세워진 토대입니다. 우리는 폭스바겐 및 도요타와의 합작 사업 포트폴리오를 확대하는 한편, 국가 투자를 토종 브랜드 개발로 돌려야 합니다. 지린성은 우리 국내 자동차 산업의 중심축이 될 것입니다."
 CHI_fifty_vanke_handover: "반커 인계"
 CHI_fifty_vanke_handover_desc: "1998년 12월까지 수천 개의 군 운영 기업이 평가, 등록되어 민간 소유로 넘겨졌습니다. 반커 개발사 쉰 곳에 맞먹는 막대한 가치의 부동산 자산이 군의 장부에서 영구히 사라집니다. 장군들은 영지를 잃고, 당은 더 깨끗한 칼을 얻습니다."
 CHI_Five_Stars_Highway: "5개국 고속도로 회랑"
 CHI_Five_Stars_Highway_desc: "브라질의 대서양 항구와 페루의 태평양 터미널을 잇는 대륙 횡단 도로 회랑은 다섯 나라를 가로지르며 육로 운송 시간을 몇 주 단축합니다. 이 사업은 우리의 남미 물류 구상의 대표 사업으로, 파나마 운하의 경제적 논리를 대륙 규모로 재현합니다. 우리 건설사와 금융 기관이 개발 부담을 짊어질 것이며, 다섯 나라의 감사가 뒤따를 것입니다."
 CHI_flying_leopard_doctrine: "비표 교리"
 CHI_flying_leopard_doctrine_desc: "함대는 항공모함을 보유하기도 전에 하늘에서 타격하는 법을 배웁니다. 대함 미사일로 무장한 육상 기반 JH-7 '비표' 전폭기는 해군 항공대를 바다 멀리까지 닿아 해안에서 적 기동 함대를 격침할 수 있는 독립적인 타격 전력으로 바꿔 놓습니다."
 CHI_Forum_China_CELAC: "중국-CELAC 협력 포럼"
 CHI_Forum_China_CELAC_desc: "라틴 아메리카 카리브 국가 공동체는 워싱턴이 오랫동안 지배해 온 미주기구를 우회하는 다자 채널을 우리에게 제공합니다. 인프라, 무역, 농업 투자를 중심으로 구성된 장관급 포럼은 미국이 자국 반구에서 누리는 제도적 우위를 잠식할 수단을 우리에게 줍니다. 우리는 이 틀을 일회성 제스처가 아닌 장기 투자로 다뤄야 합니다."
 CHI_four_trillion_stimulus: "4조 위안 경기 부양책"
 CHI_four_trillion_stimulus_desc: "GDP의 12퍼센트에 해당하는 4조 위안 규모의 부양책이 주로 철도, 고속도로, 공항, 사회 주택에 투입됩니다. 지방 정부는 지방 정부 융자 플랫폼을 통해 차입하여 자기 몫의 사업비를 공동 조달합니다. 중국건축공정총공사와 중국교통건설은 그 결과로 따낸 계약을 바탕으로 급속히 팽창합니다. 우리는 세계가 위축되는 동안 경기 침체를 피하지만, 이 부양책은 지방 정부 재정에 부채 과잉을 낳고 오르도스와 창저우 같은 도시에서 부동산 거품의 형성을 가속합니다. 그 대가는 실재하며, 반드시 닥쳐올 것입니다."
 CHI_FTA_2015: "중국-한국 자유 무역 협정"
 CHI_FTA_2015_desc: "한국과의 자유 무역 협정이 이제 완전히 이행되었습니다. 관세 인하, 공동 물류 회랑, 확대된 농업 및 전자 무역은 양자 상호 의존을 심화하고 서울이 우리와의 안정적 관계에 물질적 이해관계를 갖게 합니다. 경제적으로 묶인 한국은 양측이 충돌할 때 워싱턴의 뜻을 따를 가능성이 낮아집니다."
 CHI_game_licensing_regs: "게임 허가 규정"
 CHI_game_licensing_regs_desc: "국가신문출판서는 미성년자의 게임 이용을 주당 3시간으로 제한하고 안면 인식을 통한 단속을 요구합니다. 신화통신의 사설은 게임을 정신적 아편이라 부르며, 이 한 번의 장세로 텐센트 주가에서 10퍼센트가 사라집니다. 신작은 애국적 주제를 선호하는 판호 허가를 받아야 합니다. 개발사들이 해외 시장으로 방향을 틀면서 승인이 재개되고, 규제가 이념적으로 믿을 만하게 만든 상품을 수출합니다."
 CHI_geely_volvo_acquisition: "지리의 볼보 인수"
 CHI_geely_volvo_acquisition_desc: "리수푸가 포드로부터 볼보 자동차를 18억 미국 달러에 인수한 것은 공장이 아니라 브랜드, 지적 재산, 유통망에 초점을 둔 중국 해외 인수의 본보기를 세웠습니다. 이후 지리는 런던 택시 컴퍼니, 프로톤 지분 49.9퍼센트, 로터스 지분 51퍼센트, 다임러 AG 지분 9.7퍼센트를 차례로 인수합니다. 각 인수는 단순한 상거래가 아니라, 중국 기업이 한때 조립만 하던 것들을 소유할 수 있다는 선언입니다."
 CHI_Geneva_Carve_Out: "제네바 양자 체제"
 CHI_Geneva_Carve_Out_desc: "스위스의 상업적 중립 전통은 유럽 연합의 규제 감독을 피해 유럽 시장에 접근하려는 우리 자본에 자연스러운 관문이 됩니다. 양자 자유 무역 협정과 일련의 금융 시장 양해각서는 우리 은행과 국부 펀드에 어느 EU 관할권보다 가벼운 감독 아래 운영되는 제네바 거점을 제공합니다. 베른은 수수료 수입과 거래량을 얻고, 우리는 신뢰할 만한 서방 금융 주소지를 얻습니다."
 CHI_Global_Ambitions: "세계적 야망"
 CHI_Global_Ambitions_desc: "우리는 세계 무대에서의 역할을 규정할 준비가 되었습니다. 문제는 우리가 강대국이 될 것인가가 아니라, 어떤 종류의 강대국이 되기로 선택할 것인가입니다."
 CHI_gobi_solar_offshore_wind: "고비 태양광 벨트와 해상 풍력 기지"
 CHI_gobi_solar_offshore_wind_desc: "우리의 재생 에너지법과 국가발전개혁위원회의 발전 차액 지원제는 태양광 비용 폭락을 이끄는 정책 기반을 만들었습니다. 론지 그린 에너지, 징코솔라, 트리나 솔라, JA 솔라는 패널 비용을 와트당 0.10 미국 달러 아래로 낮추었습니다. 신장과 쓰촨의 폴리실리콘 생산은 이제 세계 수요의 80퍼센트 이상을 공급합니다. 내몽골의 쿠부치 태양광 만리장성, 닝샤의 텅거리 사막 태양광 단지, 신장의 하미 태양광·풍력 기지는 기가와트 규모의 설비이며, 해상 풍력은 양장, 푸톈, 옌청에서 확대되고 있습니다. 이중 탄소 서약이 이 사업을 영구적으로 뒷받침합니다."
 CHI_governance_moderenisation: "통치 현대화"
 CHI_governance_moderenisation_desc: "사회 신용 체계, 디지털 신원 인프라, 통합 감시망은 규정 준수를 추적하고, 협력을 보상하며, 이견에 표시를 하는 단일한 틀 아래 통합되어야 합니다. 스마트 시티 기술은 어떤 전임 정부도 감당하지 못했던 규모로 도시의 이동과 통신을 실시간으로 감시합니다. 디지털 통치란 행정을 한눈에 읽을 수 있게 만드는 것입니다. 인민이 모든 수준에서 우리 눈에 보이고, 그에 맞게 통치할 수 있게 됩니다."
 CHI_grain_for_green_program: "퇴경환림 사업"
 CHI_grain_for_green_program_desc: "파국적인 양쯔강 홍수는 수십 년에 걸친 황토 고원의 삼림 파괴에 대해 지질학적 판결을 내렸습니다. 사망자 4,150명, 침수 면적 2,100만 헥타르, 그리고 더는 자체 유역을 감당하지 못하는 하천 체계였습니다. 퇴경환림 사업은 경사가 25도를 넘는 비탈을 다시 숲이나 초원으로 전환하고, 잃어버린 수확 소득을 곡물과 현금 지급으로 대체합니다. 우리는 3,200만 헥타르를 대상으로 하며, 생산성 높은 평지에서의 집약 영농이 복원 지역의 헥타르당 수확량을 늘려 줍니다. 복원과 생산성은 서로 상반되지 않습니다."
 CHI_great_wall_suv_dominance: "창청 하발 SUV 장악"
 CHI_great_wall_suv_dominance_desc: "웨이젠쥔은 세계 제조업체들이 거의 눈여겨보지 않던 바오딩의 공장에서 창청 자동차를 우리의 SUV 강자로 키워냈습니다. 하발 H6는 4년 연속 중국 최다 판매 SUV가 되었고, 하발은 독립 브랜드가 되어 WEY, 오라, 탱크, 포어가 뒤를 이었습니다. 창청은 이제 러시아, 태국, 브라질에 조립 공장을 운영하며, 서방 제조업체들이 줄곧 과소평가하여 경쟁 없이 내버려 둔 시장 부문을 겨냥합니다."
 CHI_guatian_reckoning: "청산의 날"
 CHI_guatian_reckoning_desc: "부패는 영원히 묻혀 있을 수 없습니다. 군용 토지를 팔아넘기고 술과 금을 상자째 비축한 군수 물류의 거물들이 청산의 날을 맞이하며, 파벌은 몇 명의 희생양을 내놓을지, 아니면 결속하여 베이징에 맞설지를 선택해야 합니다."
 CHI_Gulf_Yuan_Settlement: "걸프 위안화 결제 체제"
 CHI_Gulf_Yuan_Settlement_desc: "걸프 협력 회의 국가들이 원유 수출의 상당 부분을 SWIFT가 아닌 국경 간 은행 간 결제 시스템을 거치는 위안화로 가격 책정하기 시작합니다. 중앙은행 통화 스와프와 국부 펀드의 위안화 배분이 더해지면서, 이 변화는 오일 달러의 구조적 우위를 꾸준히 잠식합니다. 미국은 1974년 이래 행사해 온 금융적 강압 수단 하나를 잃게 됩니다."
 CHI_h20_programme: "H-20 계획"
 CHI_h20_programme_desc: "강대국 무기고에 남은 마지막 공백은 스텔스 폭격기이며, 우리는 이를 메우기로 합니다. 무장 10톤을 싣고 재급유 없이 약 8천 킬로미터를 비행한다고 알려진 전익기 H-20은 중국이 자국 영공에서 태평양을 가로질러 타격할 수 있게 해 줄 것입니다. 이로써 진정한 전 지구적 삼원 체제의 폭격기 축이 완성됩니다."
 CHI_h6k_revival: "H-6K 부활"
 CHI_h6k_revival_desc: "낡은 Tu-16 복제기가 다시 태어납니다. H-6K는 폭탄창 대신 순항 미사일 파일런을 달고 효율적인 터보팬 엔진을 장착해 항속 거리를 크게 늘렸으며, 적 방어망 너머에서 지상 공격 미사일을 발사하는 원거리 타격 플랫폼이 됩니다. 약 110대가 현재 폭격기 전력의 핵심을 이루고 있습니다."
 CHI_harbin_equipment_manufacturing: "하얼빈 중장비 기지"
 CHI_harbin_equipment_manufacturing_desc: "소련 시대에 물려받은 하얼빈의 중공업 유산은 현대화되어 발전 설비, 철도 부품, 산업 기계로 방향을 전환합니다. 이 도시는 중국 기반시설 확장의 공학적 중추가 됩니다."
 CHI_Health_Silk_Road: "건강 실크로드"
 CHI_Health_Silk_Road_desc: "건강 실크로드는 우리의 의료 지원, 병원 건설, 의약품 공급망을 일대일로 협력국으로 확장합니다. 이 구상은 코로나19 팬데믹 중에 두각을 나타냈으며, 당시 백신 외교는 글로벌 사우스의 보건 개발 파트너로서 우리의 위상을 강화했습니다. 이제 이를 공식화하고 확대하여 서방 제약 기관에 대한 의존이 더는 기본값이 되지 않도록 해야 합니다."
 CHI_heavy_combined_arms_brigade: "중형 합동 병과 여단"
 CHI_heavy_combined_arms_brigade_desc: "전차만으로는 금세 쓰러집니다. 우리는 99식 전차를 궤도형 보병, 자주포, 공병과 함께 중형 합동 병과 여단으로 집중시킵니다. 이는 요새화된 전선을 돌파하고 계속 전진하도록 만들어진 자급자족형 충격 부대입니다."
 CHI_hebei_steel_group: "허베이 철강 그룹"
 CHI_hebei_steel_group_desc: "허베이성은 탕산 철강, 한단 철강, 그리고 소규모 제철소들을 허베이 철강 그룹으로 통합했으며, 이것이 훗날 HBIS가 됩니다. 같은 시기 랴오닝의 안산-번시, 산둥 철강 그룹 등 병행 합병도 이루어졌습니다. 제12차 5개년 계획은 통합을 국가 정책으로 격상하여, 상위 10개 생산자가 생산량의 60퍼센트를 통제한다는 목표를 설정합니다. 얇은 마진을 두고 경쟁하는 수천 개의 소규모 제철소 시대는 끝나야 합니다."
 CHI_henan_grain_modernization: "허난 농업 현대화"
 CHI_henan_grain_modernization_desc: "허난성은 유럽의 어느 나라보다 많은 인구를 먹여 살립니다. 저장 시설, 가공 능력, 농업 지도 서비스에 대한 투자는 수확량을 높이고 수확 후 손실을 줄여 국가 식량 안보를 강화하며, 농촌 노동력을 산업으로 재배치할 여력을 만들어 줍니다."
 CHI_high_speed_rail_one: "고속철도 1단계"
 CHI_high_speed_rail_one_desc: "우리의 첫 전용 고속 노선들이 잇따라 개통되고 있습니다. 베이징-톈진, 이어서 우한-광저우, 그리고 세계에서 가장 긴 고속 노선이 될 야심 찬 베이징-상하이 회랑입니다. 이 사업은 유럽과 일본 제조사로부터 도입한 CRH 기술에 의존하며, 우리 기술자들이 이를 중국 환경에 맞게 개조하고 있습니다. 빌려온 지식으로 시작한 것이 우리 자신의 것이 될 것입니다."
 CHI_hisilicon_kirin: "하이실리콘 기린 모바일 플랫폼"
 CHI_hisilicon_kirin_desc: "화웨이의 반도체 자회사 하이실리콘은 화웨이 휴대폰용 기린 SoC 시리즈를 개발하여 서방 경쟁사보다 먼저 온칩 NPU를 도입했고 TSMC에서 7나노 생산에 도달했습니다. 미국의 수출 통제로 그 공급이 끊긴 뒤, 화웨이는 SMIC와 협력하여 국내에서 달성 가능한 공정 노드로 기린 9000S를 제조했습니다. 이 사업은 중국의 팹리스 기업이 애플과 퀄컴 수준의 성능에 도달할 수 있음을 보여주었고, 모든 국산 SoC 개발사가 이제 따르는 본보기가 되었습니다."
 CHI_Honiara_Security_Pact: "호니아라 안보 협정"
 CHI_Honiara_Security_Pact_desc: "솔로몬 제도와의 안보 체제는 중국 인민해방군 해군이 오스트레일리아 본토에서 2,000킬로미터도 채 떨어지지 않은 호니아라에 정박하고, 보급을 받고, 작전을 수행하도록 허용합니다. 캔버라는 경악하며 AUKUS 일정을 앞당기고 워싱턴에 태평양 억지 태세 강화를 로비합니다. 이 협정은 우리에게 제1 도련선 동쪽에서 공인된 첫 안보 거점을 안겨 주며, 호니아라가 압박을 받아 이를 되돌리기 전에 확보해 두어야 합니다."
 CHI_hq17_medium_range_air_defense: "계층형 중거리 방어"
 CHI_hq17_medium_range_air_defense_desc: "점 방어 계층 위에 중거리 엄호를 더하여, 단거리와 장거리 미사일을 하나의 네트워크형 방패로 엮어 나무 꼭대기에서 성층권까지 열린 접근로가 남지 않도록 합니다."
 CHI_hq17_short_range_sam: "HQ-17 단거리 지대공 미사일"
 CHI_hq17_short_range_sam_desc: "여단에는 자체 방공 우산이 필요합니다. 러시아의 토르에서 발전한 HQ-17은 항공기, 드론, 정밀 유도 무기에 대한 신속 대응 점 방어를 제공하며, 보호 대상인 기갑 부대와 보조를 맞추도록 차량에 탑재됩니다."
 CHI_hu_jintao_reign: "후진타오 시대"
 CHI_hu_jintao_reign_desc: "후진타오가 총서기, 국가주석, 중앙군사위원회 주석직을 맡은 것은 우리 공화국 역사상 가장 질서 정연한 지도부 교체를 알립니다. 그의 정부는 개인 권위보다 제도적 통치와 집단 의사결정을 강조하며, 우리 체제를 안정된 국가에 필요한 정기적 승계에 더 가깝게 이끌 것입니다."
 CHI_hua_hong_mature_node: "화훙 성숙 공정 생산 능력"
 CHI_hua_hong_mature_node_desc: "원래 진차오의 중국-프랑스 합작 사업이던 화훙 반도체는 전력 관리, 내장형 비휘발성 메모리, 자동차 및 IoT 시장용 아날로그 칩 등 특화된 성숙 공정 생산으로 방향을 전환했습니다. 상하이와 우시에 있는 200mm 및 300mm 팹은 서방의 제재가 쉽게 닿지 못하는 국내 공급망에 물량을 댔습니다. 국가의 재투자로 생산 능력이 확대되었고 고객 기반도 수출 시장 너머로 다변화되었습니다."
 CHI_hualong_nuclear_batch: "화룽 1호 대량 건설"
 CHI_hualong_nuclear_batch_desc: "싼먼과 하이양에는 웨스팅하우스 AP1000 원자로를, 타이산에는 프라마톰 EPR 원자로를, 톈완에는 로사톰 VVER 호기를 수입한 끝에, 우리는 독자적인 3세대 설계를 완성했습니다. CNNC의 ACP-1000과 CGN의 ACPR-1000이 합쳐진 화룽 1호는 중국의 완전한 지적 재산권을 보유하며 유럽 전력 사업자 요건을 충족합니다. 푸칭 5호기가 가장 먼저 전력망에 연결되고, 장저우 원자력 기지, 하이난의 창장, 팡청강, 타이핑링이 뒤를 잇습니다. 수출형인 HPR1000은 카라치 K-2와 K-3에서 가동에 들어가며, 이는 우리 원전 수출 계획의 시작에 불과합니다."
 CHI_huawei_zte_export: "화웨이 장비 수출"
 CHI_huawei_zte_export_desc: "화웨이와 ZTE는 세계 통신 장비 시장의 35퍼센트 이상을 차지하며, 5G 표준에서 화웨이의 폴라 코드 우위가 그 지배력을 뒷받침합니다. 디지털 실크로드를 통해 우리의 인프라는 170개국의 통신 사업자에게 닿고 있습니다. 서방 정부는 금지와 기업 제재 명단 제한으로 대응하지만, 우리가 이미 설치한 물리적 기반시설은 입법으로 제거할 수 없습니다."
 CHI_huludao_schoolhouse: "후루다오 학교"
 CHI_huludao_schoolhouse_desc: "항공모함은 그 위에 착함할 수 있는 조종사가 없으면 쓸모가 없습니다. 후루다오에서는 해군항공대학이 육상 스키점프대와 착함 제동 장치까지 갖춘 전담 함재기 조종사 양성 체계를 세우고, 움직이는 갑판을 싸울 수 있는 장소로 만들 항공병들을 처음부터 훈련합니다."
 CHI_hybrid_rice_super_program: "슈퍼 하이브리드 벼 사업"
 CHI_hybrid_rice_super_program_desc: "위안룽핑의 창사 소재 중국 국가 하이브리드 벼 연구개발 센터는 잇따라 수확량 이정표를 추구하며, 해마다 겨울이면 육종 팀을 하이난섬 싼야로 옮깁니다. 열대 기후 덕분에 본토에서는 불가능한 연중 재배가 가능하기 때문입니다. 하이브리드 품종은 이미 우리 벼 재배 면적의 60퍼센트를 차지하며, 병행 사업으로 화베이 평원을 위한 내염성 바다 벼를 연구하고 있습니다. 우리는 이 투자를 지속해야 합니다. 식량 안보는 다른 모든 야망이 놓이는 토대이기 때문입니다."
 CHI_hydrogen_green_steel: "수소 제철"
 CHI_hydrogen_green_steel_desc: "우리의 이중 탄소 목표와 EU 탄소 국경 조정 제도는 외국의 관세가 선택을 대신 내려 주기 전에 제철소들이 탈탄소화하도록 압박합니다. 바오우는 리오 틴토와 협력하여 잔장에 연간 100만 톤급 수소 기반 직접 환원 시범 공장을 가동했습니다. HBIS는 장자커우에서 전기 분해로 얻은 그린 수소를 쓰는 유사한 사업을 시작하고 있습니다. 우리는 향후 10년간 전기로 비중을 크게 높여야 하며, 그 전환을 위한 계획은 지금 시작됩니다."
 CHI_hypersonic_strike_integration: "극초음속 타격 통합"
 CHI_hypersonic_strike_integration_desc: "속도가 새로운 스텔스가 됩니다. 음속의 다섯 배 이상으로 활공하며 끝까지 기동하는 극초음속 무기를 공군 타격 패키지에 편입하여, 적의 방어망에 이를 막을 검증된 수단이 없는 위협을 안겨 줍니다."
 CHI_ilrs_lunar_base: "국제 달 연구 기지"
 CHI_ilrs_lunar_base_desc: "중국과 러시아는 2021년 국제 달 연구 기지 로드맵에 서명하고, 협력국들을 초청하여 달 남극 근처에 공동 운영 연구 전초 기지를 건설하기로 했습니다. 이 사업은 현지 자원 활용, 영구적 표면 기반시설, 남극 연구 기지 모델에 견줄 유인 교대 체계를 우선시합니다. 우리는 이를 현실로 만드는 데 우리의 산업 및 공학 기반을 투입합니다."
 CHI_individual_soldier_system: "개인 병사 체계"
 CHI_individual_soldier_system_desc: "소총수는 방아쇠만이 아니라 하나의 결절점이 됩니다. 새로운 병사 체계는 광학 장비, 무전기, 항법 장치, 방탄복을 하나의 장비 세트로 묶어 각 보병을 분대 네트워크와 지휘관의 지도에 연결합니다."
 CHI_Indo_Pacific_Strategy_Collapsed: "인도-태평양 전략 붕괴"
 CHI_Indo_Pacific_Strategy_Collapsed_desc: "한국이 미국-일본-한국 3자 체제에서 탈퇴함으로써 워싱턴의 인도-태평양 연결 고리 가운데 핵심 한 곳이 끊어집니다. 일본은 안보 불안을 홀로 감당해야 하고, 지역 전반에서 미국의 신뢰도는 흔들립니다."
 CHI_Information_Warfare: "정보전"
 CHI_Information_Warfare_desc: "국영 언론, 소셜 미디어 공작, 전략적 서사를 동원하여 대상국의 여론을 형성하고 서방의 정보 지배에 맞섭니다."
 CHI_informatized_local_wars: "정보화 국지전 승리"
 CHI_informatized_local_wars_desc: "우리는 더 이상 북쪽 평원에서의 총력전을 준비하지 않습니다. 지도 교리는 정보화 조건 하의 국지전 승리가 됩니다. 중국 주변부에서 벌어지는 짧고 날카로운 첨단 기술 작전이며, 네트워크화된 전장에서 누가 먼저 보고 먼저 타격하느냐로 승패가 갈립니다. 이하의 모든 개혁은 이제 이 단일한 요구에 복무합니다."
 CHI_inner_party_supervision_regulations: "당내 감독 조례"
 CHI_inner_party_supervision_regulations_desc: "우리의 당내 책임 추궁은 너무 오랫동안 비공식 규범과 개인적 인맥에 의존해 왔습니다. 상급 기관이 하급 당 위원회를 감찰하고, 보고받고, 제재하는 의무 절차를 규정한 공식 감독 조례를 채택해야 합니다. 이러한 장치를 성문화하면 지방 관리들이 건드릴 수 없는 영지처럼 행세할 여지가 줄어들 것입니다."
 CHI_integrated_air_and_space: "공천 일체화"
 CHI_integrated_air_and_space_desc: "공군은 육군의 우산에 머물기를 멈추고 독자적인 전략 군종이 되어야 합니다. 우리는 전투기, 폭격기, 미사일, 위성, 조기 경보를 하나의 사정권으로 묶는 2004년 채택 교리인 '공천 일체, 공수 겸비'를 추진합니다. 하늘과 근우주는 하나의 전구가 되며, 그것은 반드시 우리의 것이어야 합니다."
 CHI_intra_party_democracy_experiments: "당내 민주주의 실험"
 CHI_intra_party_democracy_experiments_desc: "여러 지역에서 현 및 향진 수준의 당직에 대해 복수 후보 경쟁 선거를 실시했습니다. 지지자들은 경쟁적 선발이 정통성을 강화하고 통치를 개선할 것이라고 주장하고, 비판자들은 경합 선거가 이념적 규율을 약화하고 파벌 경쟁을 낳을 것이라고 경고합니다. 이 실험의 결과가 이 모델을 확대할지 억제할지를 결정할 것입니다."
 CHI_invigorate_country_through_STE: "과교흥국"
 CHI_invigorate_country_through_STE_desc: "1995년 장쩌민은 과학과 교육을 통한 국가 부흥 전략을 제시했습니다. 연구 투자, 기술 따라잡기, 고등 교육을 우선시함으로써 이 계획은 선진국과의 격차를 좁히고 중국을 노동 주도 경제에서 지식 기반 경제로 전환하는 것을 목표로 합니다."
 CHI_iron_ore_pricing_war: "철광석 가격 전투"
 CHI_iron_ore_pricing_war_desc: "바오강은 리오 틴토, BHP 빌리턴, 발레와의 연례 철광석 기준 가격 협상에서 중국 구매자의 수석 협상 대표를 신일본제철로부터 넘겨받았습니다. 소규모 중국 제철소들의 현물 구매가 기준 가격을 훼손하면서 이 체제는 붕괴합니다. 상하이에서의 리오 틴토 임원 스턴 후 체포와 리오 틴토 지분 18퍼센트를 노린 중국알루미늄의 실패한 인수 시도는 외교적 마찰의 정점을 이루며, 우리는 공급을 다변화하기 위해 오스트레일리아와 서아프리카의 해외 광산 투자를 가속하여 대응해야 합니다."
 CHI_j10c_multirole_refit: "J-10C 개량"
 CHI_j10c_multirole_refit_desc: "J-10이 이빨을 갖춥니다. J-10C는 AESA 레이더, 장거리 PL-15 미사일, 그리고 2021년부터는 국산 WS-10B 엔진을 더해 경량 전투기를 진정한 다목적 위협으로 탈바꿈시켰으며, 이 전투기는 이후 남아시아 상공에서 피를 보았습니다."
 CHI_j11b_sinification: "J-11 중국화"
 CHI_j11b_sinification_desc: "선양에서 면허 생산한 Su-27이 중국 항공기가 됩니다. J-11B는 러시아제 레이더, 항전 장비, 미사일을 국산 체계로 교체하여 플랭커 계열을 모스크바의 예비 부품에서 해방시키고, 중국 산업이 일선 전투기를 처음부터 끝까지 재설계할 수 있음을 입증합니다."
 CHI_j16_strike_platform: "J-16 타격 플랫폼"
 CHI_j16_strike_platform_desc: "플랭커에서 발전한 복좌 중량급 J-16 '천룡'은 AESA 레이더, 전력 중 가장 많은 무장 탑재량, 긴 항속 거리를 갖추었습니다. 이제 대만 영공을 압박하는 중국의 주력 기체로서, 현대 항공 전력이 구축되는 중심이 되는 다목적 타격 플랫폼입니다."
 CHI_jh7a_update: "JH-7A 개량"
 CHI_jh7a_update_desc: "견고한 복좌 전폭기 JH-7A '비표'는 새로운 정밀 무기와 표적 지정 포드로 개량되어, 저렴하고 검증된 해상 타격기가 신형 전력과 나란히 계속 쓸모를 유지하게 됩니다."
 CHI_jiang_doctrine_taiwan: "대만에 대한 장쩌민 독트린"
 CHI_jiang_doctrine_taiwan_desc: "장쩌민의 8개 항 제안은 무력 사용 가능성을 명시적으로 배제하지 않으면서 평화 통일을 중심으로 양안 정책의 틀을 짭니다. 이 독트린을 인민해방군의 성장하는 접근 거부 무기고와 통합하면 신뢰할 만한 강압적 틀이 갖춰지며, 대만의 법적 독립에 따르는 비용이 타이베이의 어느 정부도 정치적으로 감당할 수 없는 수준으로 높아집니다."
 CHI_jiangnan_changxing_move: "장난-창싱 이전"
 CHI_jiangnan_changxing_move_desc: "옛 상하이 한복판에 비좁게 자리한 유서 깊은 장난 조선소는 더 성장할 수 없습니다. 우리는 이를 강 하류의 창싱섬으로 옮깁니다. 군함을 수십 척씩 건조하도록 지어진 거대한 새 작업장과 심수 부두가 있는 곳입니다. 이전은 건조 능력을 단번에 몇 배로 늘리며 현대 함대의 용광로가 됩니다."
 CHI_jiangnan_scale: "장난 조선소 확장"
 CHI_jiangnan_scale_desc: "군함은 바다에서 승부가 나기 전에 선대에서 먼저 승부가 납니다. 창싱섬에 새로 들어선 장난 조선소의 거대한 작업장은 전속력으로 가동되어, 경쟁국이 한 척씩 건조할 때 구축함과 항공모함을 동시에 건조합니다."
 CHI_joint_operations_command: "합동 작전 사령부"
 CHI_joint_operations_command_desc: "이제 승리는 육군, 해군, 공군, 로켓군을 하나의 주먹으로 융합하는 쪽의 것입니다. 우리는 진정한 합동 작전 사령부를 세워 다섯 개 전구를 하나의 상황도로 연결하며, 전투가 군종끼리 차례를 번갈아 치르는 것이 아니라 전군에 의해 동시에 치러지도록 합니다. 이로써 전구 사령부 체제가 잠금 해제됩니다."
 CHI_Joint_Operations_tt: "전략 선택 사건을 발동합니다. 방어 선택지는 아프가니스탄, 파키스탄, 타지키스탄과 함께 SCO 세력을 결성하거나 확장합니다. 징벌 및 총력전 선택지는 대신 파키스탄의 대응을 통해 탈레반과 TTP에 대한 전쟁 명분을 생성합니다."
 CHI_joint_stock_city_banks: "주식제 상업 은행과 도시 상업 은행"
 CHI_joint_stock_city_banks_desc: "4대 은행 아래에는 풍부한 2차 계층이 발달했습니다. 초상은행은 강력한 모바일 뱅킹으로 소매 금융의 선두 주자가 되었고, 최초의 비국유 은행인 민생은행은 중소기업을 지원하며, HSBC는 교통은행 지분 19.9퍼센트를 보유합니다. 130곳이 넘는 도시 상업 은행은 2선·3선 도시의 지역 금융을 떠받쳐 민간 기업의 신용 접근성을 넓히고 디지털 금융 서비스의 보급을 앞당기고 있습니다. 이러한 기관의 다양성은 우리가 육성해야 할 강점입니다."
 CHI_joint_venture_framework: "합작 투자 산업 체제"
 CHI_joint_venture_framework_desc: "포괄적인 체제가 합작 투자에서의 기술 이전, 현지 부품 조달 요건, 이익 송금을 규율합니다. 외국 기업은 시장 접근권을 얻고, 중국 파트너는 국내 기업으로 점차 흘러드는 기술과 경영 지식을 얻습니다."
 CHI_keep_the_shell_companies: "껍데기 회사 유지"
 CHI_keep_the_shell_companies_desc: "매각 명령을 받고도 우리는 서류상으로만 매각합니다. 군의 기업들은 사촌, 명의 대리인, 페이퍼 컴퍼니 명의로 다시 등록되고, 그 수익은 여전히 소유 부대로 흘러 들어갑니다. 감사관은 텅 빈 사무실을 발견하고, 장군들은 수익을 지킵니다."
 CHI_kj2000_mainring_awacs: "KJ-2000 주고리"
 CHI_kj2000_mainring_awacs_desc: "워싱턴이 이스라엘의 팰콘 판매를 막은 뒤 중국은 자체 기종을 만들었습니다. Il-76에 탑재된 국산 능동 위상 배열 레이더인 KJ-2000은 공군에 최초의 진정한 공중 지휘소를 제공하여, 전투기가 아직 직접 볼 수 없는 표적까지 타격할 수 있게 합니다."
 CHI_kj500_network_centric_hub: "KJ-500 네트워크 거점"
 CHI_kj500_network_centric_hub_desc: "Y-9 터보프롭 기체에 고정식 3면 레이더를 장착한 KJ-500은 하늘의 주력 눈입니다. 다수 생산되어 전투기, 함정, 미사일을 데이터링크로 하나의 상황도에 묶으며, 네트워크 중심전의 공중 거점이 됩니다."
 CHI_KPA_Offensive_Readiness: "조선인민군 공세 태세"
 CHI_KPA_Offensive_Readiness_desc: "우리는 조선인민군의 태세가 종심 방어에서 전방 공세 대기로 전환하는 것을 조용히 승인합니다. 장비 이전이 가속되고 합동 계획 회의가 확대됩니다. 한반도는 벼랑 끝에 한층 가까워집니다."
 CHI_leader_of_the_people: "인민영수"
 CHI_leader_of_the_people_desc: "공산당의 제3차 역사 결의는 인민영수라는 칭호를 공식화합니다. 이는 당 역사상 마오쩌둥과 시진핑, 단 두 인물에게만 적용된 호칭입니다. 마오의 초상은 여전히 톈안먼 위에 걸려 있습니다. 당의 세 번째 역사적 순간이 자신의 역사적 인물을 찾았으며, 결의를 주의 깊게 읽는 사람이라면 누구도 그 연속성이 뜻하는 바를 놓치지 않습니다."
 CHI_leading_small_group_doctrine: "중앙영도소조"
 CHI_leading_small_group_doctrine_desc: "중앙영도소조는 이제 재정, 경제 개혁, 외교, 사이버 보안, 군 개혁을 동시에 총괄하며 모두 단일한 사무실에서 주재합니다. 이 방식은 정치국의 전통적 위원회 구조를 우회하고, 지체 없이 움직일 수 있는 곳에 의사결정을 집중시킵니다. 기술 관료는 집행하고 중앙은 조율합니다. 정책은 더 빠르게 움직이며, 모든 결과물은 하나의 의지에 종속됩니다."
 CHI_Let_Seoul_Lead: "서울이 주도하게 하라"
 CHI_Let_Seoul_Lead_desc: "우리는 향후 통일 과정에서 한국이 주도권을 갖는 것을 받아들인다는 신호를 보냅니다. 서울의 민주적 제도와 경제적 비중은 서울을 통일 한반도의 자연스러운 중심으로 만듭니다. 우리는 한 걸음 물러서서 한국인이 스스로 미래를 결정하도록 합니다."
 CHI_liangjiang_new_area: "량장 국가급 신구"
 CHI_liangjiang_new_area_desc: "충칭의 량장은 상하이의 푸둥, 톈진의 빈하이에 이어 최초의 내륙 국가급 신구가 됩니다. 이 구역은 포드, HP와 300곳이 넘는 포천 500대 기업을 유치했으며 이미 연간 119만 대의 차량을 생산합니다. 시안의 관중 평원도 병행 투자를 받아 산시를 북서부의 상업 및 산업 중심으로 자리매김시킵니다. 모델은 검증되었으며, 이제 확대해야 할 것은 규모입니다."
 CHI_Lips_and_Teeth_Doctrine: "순망치한 독트린"
 CHI_Lips_and_Teeth_Doctrine_desc: "우리는 북한과의 역사적 유대를 재확인합니다. 두 나라는 언제나처럼 입술과 이처럼 가깝습니다. 평양의 생존은 우리의 전략적 책무이며, 우리는 국제적 압력과 상관없이 그에 따라 행동할 것입니다."
 CHI_Lithium_Triangle_Accord: "리튬 삼각지대 협정"
 CHI_Lithium_Triangle_Accord_desc: "아르헨티나, 볼리비아, 칠레는 세계 채굴 가능 리튬 매장량의 절반 이상을 함께 보유하고 있습니다. 채굴 사업에 대한 장기 인수 계약과 지분 참여는 중국의 배터리 및 전기차 제조사에 다음 에너지 패러다임을 규정하는 원자재에 대한 안정적인 접근을 보장합니다. 이 협정은 중국의 공급망을 서방의 구매 연합으로부터 보호합니다."
 CHI_Liu_Huaqing_Doctrine: "류화칭 독트린"
 CHI_Liu_Huaqing_Doctrine_desc: "우리 현대 해군 전략의 설계자인 류화칭 제독은 제1, 제2 도련선을 우리 해양 세력이 더 멀리 투사하기 전에 도전받지 않는 지배권을 확립해야 하는 전략적 경계로 규정했습니다. 남중국해는 전적으로 제1 도련선 안에 있습니다. 이를 완전히 확보하기 전에는 외부로 투사할 수 없으며, 그 안보를 무한정 미룰 수도 없습니다."
 CHI_liu_huaqing_first_island_chain: "류화칭의 제1 도련선"
 CHI_liu_huaqing_first_island_chain_desc: "이 선은 쿠릴 열도에서 류큐 제도와 대만을 거쳐 보르네오까지 이어지며, 그 안쪽의 근해는 우리 것이 되어야 합니다. 현대 인민해방군 해군의 아버지인 류화칭 제독은 근해 해군이 대양을 꿈꾸기 전에 먼저 제1 도련선을 지배해야 한다고 가르쳤습니다. 그의 근해 방어 교리가 우리의 항로를 정합니다. 접근로를 거부하고, 근해를 장악한 뒤, 그 너머를 바라보는 것입니다."
 CHI_livestream_commerce: "라이브 스트리밍 커머스"
 CHI_livestream_commerce_desc: "타오바오 라이브는 서방의 어떤 유사 서비스도 도달하지 못한 규모로 엔터테인먼트와 실시간 구매를 결합합니다. 웨이야와 오스틴 리는 한 번의 방송으로 수십억 위안의 판매를 올리며, 우리 전자 상거래의 40퍼센트가 이제 라이브 스트리밍 채널을 통해 이루어집니다. MCN 기획사는 수천 명의 크리에이터를 관리하고, 규제 당국은 이 플랫폼을 흐르는 부가 비례하여 국가에 도달하도록 엄격한 납세 준수를 강제합니다. 이 형식을 규정하는 것은 우리이며, 세계가 지켜보고 있습니다."
 CHI_logistic_modernisation: "군수 현대화"
 CHI_logistic_modernisation_desc: "보급 꼬리가 끊어진다면 전선의 개혁은 아무 의미가 없습니다. 우리는 컨테이너를 표준화하고, 화물을 팔레트화하며, 새로운 합동 군수 지원 부대 아래 보급망을 디지털화하여 여단이 전진하는 만큼 빠르게 지탱될 수 있도록 합니다."
 CHI_long_march_modernisation: "창정 현대화"
 CHI_long_march_modernisation_desc: "중국항천과학기술그룹이 개발한 창정 발사체 계열은 우리 우주 계획 전체의 중추를 이룹니다. CZ-2, CZ-3, CZ-5, CZ-7 변형 전반의 조립 라인을 개선하고 추진제 취급을 향상하면 발사 빈도와 신뢰도가 높아지며, 추진 공학 전반의 진전은 우리 미사일 계획에 직접 반영됩니다."
 CHI_long_range_firepower: "장거리 화력"
 CHI_long_range_firepower_desc: "사거리가 물량을 이깁니다. 우리는 중형 여단에 장거리 로켓과 배회 탄약을 투입하여, 전차가 접촉하기도 전에 적의 종심, 지휘소, 예비대를 분쇄할 수 있도록 합니다."
 CHI_loongson_riscv: "룽신과 RISC-V 아키텍처"
 CHI_loongson_riscv_desc: "컴퓨팅기술연구소의 룽신 프로세서 계열은 정부 서버와 임베디드 시스템에서 x86과 ARM의 국산 대안을 제공합니다. 룽신과 더불어 개방형 RISC-V 명령어 집합 아키텍처는 RISC-V 인터내셔널 기구와 알리바바의 T-Head, 뉴클레이 시스템 테크놀로지, 사이파이브 차이나를 비롯한 국내 스타트업을 통해 우리의 투자를 끌어들였습니다. RISC-V의 개방형 라이선스는 명령어 집합 아키텍처에 대한 미국 수출 통제의 노출로부터 우리 국산 설계를 보호하며, 그 보호의 가치는 해마다 커집니다."
 CHI_lunar_sample_return: "달 시료 회수"
 CHI_lunar_sample_return_desc: "2020년 12월 창어 5호는 몽스 뤼메케르에서 1.73킬로그램의 달 현무암을 가져왔으며, 이는 1976년 소련의 루나 24호 임무 이후 지구에 도착한 첫 새로운 달 시료였습니다. 2024년 6월에는 창어 6호가 뒤를 이어 달 뒷면의 남극-에이트켄 분지에서 물질을 회수했는데, 이는 어떤 우주 계획에서도 최초였습니다. 우리는 자원을 이 로봇 과학 노선에 집중하여 시료 회수 체계를 새로운 지점으로 확장하고 이를 통해 가능해지는 연구를 가속합니다."
 CHI_made_in_china_2025: "중국제조 2025"
 CHI_made_in_china_2025_desc: "우리는 더 이상 세계의 공장 바닥에 머물 수 없습니다. 로봇, 항공우주, 전기차, 첨단 의료기기, 반도체 등 10대 중점 분야가 첨단 기술 선도 분야로 전환할 대상으로 지정되었습니다. 국가 보조금, 기술 인수 사업, 의무적 국산 조달 목표가 우리의 수단입니다. 워싱턴과 브뤼셀은 불쾌해하겠지만, 이는 우리가 지켜야 할 방향입니다."
 CHI_Maritime_Silk_Road_Indian_Ocean: "진주 목걸이 전략"
 CHI_Maritime_Silk_Road_Indian_Ocean_desc: "스리랑카의 함반토타와 지부티의 도랄레를 비롯해 인도양 연안 전역에 걸친 항만 투자와 물류 시설의 사슬은 우리의 상업적, 잠재적 해군 영향권을 남중국해에서 아프리카의 뿔까지 넓힙니다. 비판자들은 이 양상을 인도를 포위하는 진주 목걸이라고 부릅니다. 그들이 전적으로 틀린 것은 아니며, 바로 그것이 핵심입니다."
 CHI_mass_line_education: "군중 노선"
 CHI_mass_line_education_desc: "당의 군중 노선 운동은 관리들에게 형식주의, 관료주의, 향락주의, 사치 풍조를 배격할 것을 요구합니다. 호화 연회는 금지되고, 공공장소에서 비싼 시계를 착용한 모습이 찍힌 자들은 시계를 몰수당합니다. 인민과의 관계는 특권이 아닌 봉사로 다시 정립되어야 합니다. 이 메시지는 정치적으로 유리한 만큼 진정으로 인기도 있으니, 헛되이 버려서는 안 됩니다."
 CHI_mass_line_renewed: "군중 노선 쇄신"
 CHI_mass_line_renewed_desc: "마오쩌둥의 군중 노선은 당이 인민을 이끌기 전에 먼저 인민에게서 배워야 한다고 보았습니다. 간부와 학생이 농촌 향진과 공장 현장으로 파견됩니다. 경청 운동이 하향식 지시를 대체하고, 대중의 축적된 경험은 당 정책에 다시 반영됩니다. 혁명은 저녁 식사 초대가 아닙니다."
 CHI_mature_node_counter_offensive: "성숙 공정 반격"
 CHI_mature_node_counter_offensive_desc: "서방의 수출 통제가 우리의 첨단 공정 확장을 제한한 뒤, 우리는 생산 능력 투자를 28나노 이상의 성숙 공정으로 돌립니다. SMIC, 화훙, CXMT와 수십 곳의 소규모 팹이 상하이, 선전, 항저우에서 병행 확장을 시작합니다. 우리는 이제 전 세계 성숙 공정 증설량의 33퍼센트 이상을 차지합니다. 자동차, 산업, 방위 전자제품에 공급되는 성숙 공정 부문에서 중국이 지배할 가능성에 경계심을 느낀 서방 정부들은 2차 관세를 논의하고 있습니다. 그 관세가 닥치기 전에 우리의 입지를 공고히 해야 합니다."
 CHI_Media_Offensive: "미디어 공세"
 CHI_Media_Offensive_desc: "CGTN, 신화통신, 소셜 미디어 플랫폼을 통해 조율된 세계적 언론 캠페인을 개시하여 중국의 관점을 알리고 적대적 서사에 맞섭니다."
 CHI_Mekong_Riparian_Cooperation: "란창-메콩 협력"
 CHI_Mekong_Riparian_Cooperation_desc: "란창-메콩 협력 체제는 하천 체계를 공유하는 여섯 연안국 간의 공동 인프라 개발, 수자원 관리, 무역 원활화를 조직합니다. 우리의 상류 댐 건설과 항행 개선 사업은 우리가 통제하는 유량에 의존하는 하류 이웃 국가들에 대해 상당한 영향력을 우리에게 줍니다. 그 영향력이 강압으로 규정되기 전에 이 체제를 공식화해야 합니다."
 CHI_memory_independence: "메모리 칩 독립"
 CHI_memory_independence_desc: "우한에 본사를 두고 대기금의 후원을 받는 YMTC는 128단 3D NAND 생산에 도달했으며, 삼성 및 마이크론과 비슷한 세대에 맞먹는 232단 Xtacking 아키텍처를 달성했습니다. 허페이의 CXMT는 17나노에서 DDR4를 생산하고 DDR5 호환 공정을 개발하고 있습니다. 애플이 YMTC NAND를 잠시 인증한 것은, 미국의 압력으로 애플 공급업체 명단에서 제외되기 전에 우리 메모리가 상용 등급에 도달했음을 보여주었습니다. CXMT의 HBM2 라인은 일정보다 앞서 양산에 들어가 캠브리콘과 비렌 AI 가속기 제작에 인증을 받았으며, 우리 고성능 컴퓨팅 공급망의 해외 메모리 의존을 끝냈습니다."
 CHI_mengshi_program: "멍스 계획"
 CHI_mengshi_program_desc: "험비를 본뜬 중국의 장갑 경차량 멍스는 기관총, 미사일 또는 원격 무장 거치대를 장착할 수 있는 튼튼한 지뢰 방호 차량으로 경보병을 차량화합니다."
 CHI_miit_licensing_framework: "공업정보화부 허가 및 통신사 구조조정"
 CHI_miit_licensing_framework_desc: "공업정보화부는 과거 우전 독점 체제를 별개의 상업 통신사들로 분리하는 허가 체제를 공식화해야 합니다. 주파수 할당 규칙, 상호 접속 요금, 보편적 서비스 의무가 성문화되며, 이는 차이나 모바일, 차이나 유니콤, 차이나 텔레콤이 세계 최대 규모의 4G 및 5G 네트워크를 구축할 규제적 토대가 됩니다. 독점 시대는 소임을 다했고, 경쟁이 다음 단계를 이끌 것입니다."
 CHI_military_training_outline: "신 훈련 대강"
 CHI_military_training_outline_desc: "전군에 새로운 군사 훈련 대강이 하달됩니다. 이는 모든 부대의 기준과 임무를 정하는 규범서입니다. 처음으로 합동, 네트워크 작전을 중심으로 작성되어 전군을 하나의 엄격한 즉응 태세 기준으로 묶습니다."
 CHI_mobile_payment_duopoly: "모바일 결제 복점"
 CHI_mobile_payment_duopoly_desc: "알리바바의 에스크로 서비스로 출범한 알리페이는 독립적인 결제 플랫폼으로 성장했습니다. 위챗페이는 춘절 홍바오 캠페인을 통해 닷새 만에 2억 명의 사용자를 얻었습니다. QR 코드는 이제 우리 거래의 90퍼센트 이상에서 현금을 대체하며, 비자, 마스터카드, 서방 핀테크가 의미 있는 발판을 마련하기 전에 이들을 몰아냈습니다. 우리는 세계에서 가장 앞선 소비자 결제 인프라를 구축했고, 이는 서방 금융 구조 바깥에서 완전히 운영됩니다."
 CHI_money_alliance: "돈의 동맹"
 CHI_money_alliance_desc: "부와 지휘권이 하나의 파벌로 융합됩니다. 가장 부유한 장교들과 그들에게 자금을 대는 밀수 거물들이 서로 결속하여, 자기 사람들을 지킬 만큼, 그리고 명목상 자신들을 지휘하는 당에게 조건을 강요할 만큼 강해집니다."
 CHI_Monroe_Doctrine_Inverted: "역전된 먼로 독트린"
 CHI_Monroe_Doctrine_Inverted_desc: "수십 년에 걸친 인내심 있는 투자, 외교적 접근, 인프라 신용은 우리를 미국이 한때 자신의 전유 영역으로 취급했던 역할인 라틴 아메리카의 불가결한 외부 파트너로 재정립했습니다. 우리에 맞서 반구 연합을 결집하는 워싱턴의 능력은 먼로 독트린이 실제로는 더 이상 집행되지 않는 지경까지 약해졌습니다. 아메리카는 더 이상 미국의 호수가 아닙니다. 우리는 그것이 다시는 그렇게 되지 않도록 해야 합니다."
 CHI_national_overall_emergency_response_plan: "국가 비상 대응 계획"
 CHI_national_overall_emergency_response_plan_desc: "사스 위기는 우리의 국가 비상 대비 태세의 허점을 뼈아프게 드러냈습니다. 자연재해, 공중 보건 비상사태, 사고, 사회 불안을 아우르는 통합 대응 체제를 수립하되, 모든 행정 단계에서 사전 배치된 자원, 명확한 지휘 구조, 부처 간 조정 규약을 갖추어야 합니다. 다음 위기는 미리 알리고 찾아오지 않습니다."
 CHI_naura_amec: "NAURA 및 AMEC 장비 사업"
 CHI_naura_amec_desc: "NAURA 테크놀로지 그룹과 어드밴스드 마이크로-패브리케이션 이큅먼트는 국내 팹을 위한 식각, CVD, PVD 장비를 생산합니다. NAURA는 SMIC에서 28나노 식각 장비 인증을 확보했으며, AMEC의 프리맥스 식각 장비는 양산 라인에 투입되었습니다. 두 기업 모두 SMIC의 전속 수요와 대기금 자본 투입의 혜택을 누립니다. 이들의 장비 포트폴리오는 이제 성숙 공정 로직 팹에 필요한 공정 단계의 약 40퍼센트를 포괄합니다. 나머지 60퍼센트가 우리가 다음에 집중해야 할 부분입니다."
 CHI_nco_corps_reform: "전문 부사관단"
 CHI_nco_corps_reform_desc: "현대 군대는 대령들만이 아니라 부사관들이 지탱합니다. 우리는 계급, 급여, 권한을 갖춘 직업 군인으로 이루어진 진정한 부사관단을 구축하여, 단기 징집병에 대한 기존의 의존을 대체하고 장교와 신병 사이의 격차를 메웁니다."
 CHI_new_energy_vehicles_startups: "신에너지차 개척자들"
 CHI_new_energy_vehicles_startups_desc: "니오, 엑스펑, 리 오토, 화웨이의 HIMA 연맹, 샤오미는 국유 기업이 아닌 기술 자본의 후원을 받아 2014년에서 2024년 사이에 자동차 부문에 진입했습니다. 각 기업은 스마트폰 시대의 소프트웨어, AI 역량, 소비자 브랜드 인지도를 차량에 가져왔습니다. 샤오미의 SU7 세단은 24시간 만에 88,898건의 사전 주문을 받았고, YU7 SUV는 첫날 24만 건의 확정 주문을 확보했습니다."
 CHI_New_World_Order: "신세계 질서"
 CHI_New_World_Order_desc: "우리의 정보 지배력과 언론 영향력은 서방 주도의 국제 질서에 대한 근본적 도전의 토대를 마련했습니다. 이제 우리는 영향력 네트워크, 국영 언론, 비밀 수단을 활용하여, 우리 자신의 규범과 통치 모델이 세계 의제를 정하는 다극 세계를 촉진해야 합니다."
 CHI_norinco_rationalism: "노린코 합리화"
 CHI_norinco_rationalism_desc: "제식 소총에서 화포에 이르기까지 모든 것을 만드는 거대한 중국북방공업은 가지치기되고 집중됩니다. 중복된 라인은 폐쇄되고, 수익성 있는 라인은 통합되며, 지상군의 무기고는 마침내 하나의 산업적 목소리로 말하게 됩니다."
 CHI_northeast_revitalization_plan: "동북 진흥 계획"
 CHI_northeast_revitalization_plan_desc: "랴오닝, 지린, 헤이룽장의 녹슨 공업 지대 성들은 국유 기업 개혁 이후 급격히 쇠퇴했습니다. 중앙 정부는 2003년 진흥 사업을 개시하여 인프라 투자, 우대 신용, 이전된 산업 생산 능력을 이 지역에 투입합니다."
 CHI_northeast_russia_corridor: "동북-러시아 경제 회랑"
 CHI_northeast_russia_corridor_desc: "헤이룽장성과 러시아 극동을 잇는 국경 간 무역 기반시설이 개선되어 자원 흐름, 국경 간 투자, 공동 개발 사업이 가능해집니다. 이 회랑은 중러 전략적 동반자 관계를 상업적 실체로 뒷받침합니다."
 CHI_open_the_august_1st_building: "8·1 빌딩 개방"
 CHI_open_the_august_1st_building_desc: "8·1 빌딩에는 중앙군사위원회가 자리하고 있으며, 인민해방군은 이곳에서 당에게만 응답하고 그 누구에게도 응답하지 않습니다. 1927년 8월 1일의 난창 봉기는 당에 최초의 소총을 안겼고, 그 날짜는 지금도 군대 자체를 가리키는 이름입니다. 이제 군의 재편이 시작됩니다. 부패는 숙청되거나 묵인되고, 사단은 여단으로 재편되며, 공군은 우주와 융합되고, 해안 경비대는 원양 함대로 탈바꿈합니다."
 CHI_Operation_New_Dawn: "새벽 작전"
 CHI_Operation_New_Dawn_desc: "때가 왔습니다. 조선인민군 내 중국이 후원하는 장교들이 김씨 일가의 관저를 향해 움직입니다. 뒤따를 일은 짧고, 폭력적이며, 결정적일 것입니다. 북한이라는 국가는 살아남겠지만, 그 지도부는 그렇지 못할 것입니다."
 CHI_Oppose_Strategic_Flexibility: "전략적 유연성 반대"
 CHI_Oppose_Strategic_Flexibility_desc: "주한 미군이 한반도 밖으로 전개하는 것을 허용하는 워싱턴의 '전략적 유연성' 독트린은 우리 안보 이익에 대한 용납할 수 없는 침해입니다. 우리는 그 철회를 공식적으로 요구합니다."
 CHI_organisation_department_mandate: "조직부 권한"
 CHI_organisation_department_mandate_desc: "중국 공산당 조직부는 7천만 명이 넘는 당 간부의 임용, 평가, 전보를 관리하며, 이는 이 부서를 통제하는 자가 당의 인사 미래를 통제함을 의미합니다. 쩡칭훙의 지휘 아래 조직부는 성급 지도부 임용에 대한 통제를 강화했으며, 평가 기준을 산업 개발 실적이 뛰어난 관리를 우대하는 방향으로 조정했습니다."
 CHI_organisation_department_mandate_tt: "§Y$CHI_organisation_department_1$§!은(는) §Y쩡칭훙§!이 국가 지도자인 동안 항상 활성화됩니다."
 CHI_original_innovation_problem: "원천 혁신의 문제"
 CHI_original_innovation_problem_desc: "모방은 우리를 최전선까지 데려왔지만, 그 너머로 데려갈 수는 없습니다. 가장 어려운 개혁은 문화적인 것으로, 관료적 과학이 오랫동안 억눌러 온 원천 혁신을 요구합니다. 우리는 위험에 자금을 대고, 실패를 용인하며, 어떤 외국 설계도도 줄 수 없는 돌파구에 보상합니다."
 CHI_own_designs: "우리 자체의 설계"
 CHI_own_designs_desc: "한 세대 동안 우리는 소련의 도면을 역설계하고 그것을 진보라 불렀습니다. 더는 아닙니다. 설계국은 모방이 아니라 창안을 하도록, 그리고 다음 무기에는 빌려온 낙인이 아닌 중국의 낙인을 찍도록 지시받았습니다."
 CHI_Pacific_Island_Forum_Pivot: "태평양 도서국 포럼 전환"
 CHI_Pacific_Island_Forum_Pivot_desc: "우리는 태평양 도서국 전역에 대한 외교 공세를 가속해야 하며, 부채 부담이 적은 인프라 보조금, 어업 협정, 외교 승인 패키지를 제공합니다. 우리가 부동표와 후원 옵서버를 공략하면서 포럼 자체가 경합의 장이 됩니다. 역사적으로 태평양 제도적 틀을 지배해 온 오스트레일리아와 뉴질랜드는, 우리의 위상을 인정할 때까지 모든 장관급 회의에서 자신들의 주도권이 도전받는 것을 보게 될 것입니다."
 CHI_Pax_Sinica: "팍스 시니카"
 CHI_Pax_Sinica_desc: "우리의 경제적 비중, 인프라 의존, 정치적 정렬이 자유주의적 규칙 기반 질서를 대체하여 세계 질서의 조직 원리가 되는 중국 중심의 국제 질서입니다. 학자들은 이를 팍스 시니카라 이름 붙였습니다. 우리는 이를 단지 있어야 할 세계라고 부릅니다. 이를 달성하는 것은 우리의 백 년 부흥의 정점이 될 것입니다."
 CHI_Peaceful_Development: "평화 발전"
 CHI_Peaceful_Development_desc: "중국의 부상이 세계 안정의 힘임을 행동으로 입증합니다. 평화 유지, 재난 구호, 개발 원조에 투자하여 책임 있는 강국이라는 평판을 쌓습니다."
 CHI_pearl_river_delta_tech_cluster: "주장 삼각주 전자 산업 클러스터"
 CHI_pearl_river_delta_tech_cluster_desc: "주장 삼각주는 세계 최대의 전자 제품 제조 기지로서의 입지를 굳힙니다. 선전에는 화웨이와 ZTE가 자리하고, 둥관은 대만의 위탁 제조사들로 가득 차며, 이 지역 전체가 세계 소비자 전자 제품을 위한 하나의 통합 공급망으로 기능합니다."
 CHI_Peninsula_Strategy: "한반도 전략"
 CHI_Peninsula_Strategy_desc: "우리는 한반도에서 기로에 서 있습니다. 수십 년에 걸친 계산된 모호성은 의도적인 전략적 태세에 자리를 내주어야 합니다. 각 선택지가 지역 질서에 되돌릴 수 없는 결과를 가져온다는 점을 알고, 우리는 신중하게 길을 택할 것입니다."
 CHI_peoples_armed_police_integration: "무장경찰 통합"
 CHI_peoples_armed_police_integration_desc: "200만 규모의 인민무장경찰은 2018년부터 중앙군사위원회 아래 확고히 편입되어 후방과 국경을 지키며, 야전군이 바깥을 향해 싸울 수 있도록 자유롭게 합니다."
 CHI_Petrocaribe_Successor: "페트로카리베의 후계자"
 CHI_Petrocaribe_Successor_desc: "카리브 및 중미 국가들을 위한 베네수엘라의 특혜 석유 사업은 제재와 경제 실정 속에 붕괴했습니다. 우리는 안정화 채권국으로 나서서 장기 공급 약속의 대가로 카라카스, 아바나, 마나과에 석유 담보 대출을 제공해야 합니다. 이 방식은 이미 서방 자본 시장에서 고립된 정부들과의 유대를 심화하며, 그들의 감사는 오래 지속될 것입니다."
 CHI_Petroyuan_Settlement: "페트로위안 구상"
 CHI_Petroyuan_Settlement_desc: "우리는 상하이 국제에너지거래센터에서 위안화 표시 원유 선물을 출시하여, 일대일로 에너지 수출국이 미국 달러가 아닌 위안화로 계약을 결제할 수 있는 장치를 만들어야 합니다. 지속적인 채택은 오일 달러의 지배력을 약화하고 미국 금융 제재에 대한 우리의 노출을 줄일 것입니다. 위안으로 가격이 매겨지는 원유 한 배럴 한 배럴은 우리가 신뢰할 수 있는 국제 금융 체제를 향한 한 걸음입니다."
 CHI_pgz_gun_missile_hybrid: "포-미사일 복합 방어"
 CHI_pgz_gun_missile_hybrid_desc: "PGZ 자주 방공 체계는 레이더로 조준하는 자동포와 단거리 미사일을 하나의 차체에 결합하여, 미사일 교전 구역 아래로 파고드는 저공 비행 항공기, 헬리콥터, 드론을 격추합니다."
 CHI_phl_mlrs_modernisation: "PHL 로켓 현대화"
 CHI_phl_mlrs_modernisation_desc: "PHL-03과 모듈형 PHL-16은 육군에 수백 킬로미터에 이르는 장거리 로켓 포병을 제공하여 로켓 포대와 전술 미사일 사이의 경계를 흐리고, 여단이 전선 훨씬 뒤까지 타격할 수 있게 합니다."
 CHI_pipechina_gas_reform: "파이프차이나 분리"
 CHI_pipechina_gas_reform_desc: "중국석유천연가스관망공사는 CNPC, 시노펙, CNOOC에서 이전된 약 6천억 위안 규모의 송유관 자산, 저장 시설, LNG 터미널을 받습니다. X+1+X 모델은 다수의 상류 생산자와 다수의 하류 유통업자 사이에 하나의 중립적인 중류 운영자를 두어, 국영 석유 기업들이 이전에 독점적으로 통제하던 기반시설을 개방합니다. ENN 에너지, 화룬 가스, 베이징 엔터프라이즈, 해외 LNG 공급업체 모두 접근권을 얻고, 가스 유통 시장은 처음으로 진정한 경쟁 체제가 됩니다."
 CHI_Piraeus_Model: "피레우스 항만 모델"
 CHI_Piraeus_Model_desc: "코스코의 피레우스 항 과반 지분 인수는 그리스의 주요 상업 항구를 지중해에서 가장 붐비는 컨테이너 항구로 탈바꿈시켰으며 유럽 전역의 우리 항만 관리를 위한 본보기가 되었습니다. 이 모델은 투자 유치국 정부에 측정 가능한 경제적 수익을 안겨 주는 동시에 전략적 요충지에 우리의 운영 통제권을 심어 놓습니다. 리스본과 함부르크의 소수 지분은 과반 인수가 불러올 규제 감시를 촉발하지 않으면서 그 수도들을 계속 끌어들입니다."
 CHI_plz_howitzer_program: "PLZ 곡사포 계획"
 CHI_plz_howitzer_program_desc: "오랫동안 군의 자랑이자 병목이었던 포병이 완전한 자주화를 이룹니다. 2008년부터 배치된 155mm 궤도형 곡사포 PLZ-05는 서방의 사거리와 발사 속도에 필적하며 모든 중형 여단의 포열을 이룹니다."
 CHI_Polar_Silk_Road: "극지 실크로드"
 CHI_Polar_Silk_Road_desc: "우리의 북극 정책 백서는 중국을 \\"근북극 국가\\"로 선언하고, 극지 횡단 항로의 개발을 해상 실크로드의 북쪽 연장선으로 지지합니다. 녹아내리는 해빙은 북극해 항로를 상업적으로 실현 가능하게 만들어 우리와 유럽 사이의 운송 시간을 최대 2주 단축합니다. 다른 이들이 문을 닫아걸기 전에 북극 거버넌스 구조에서 우리의 자리를 차지해야 합니다."
 CHI_policy_banks_cdb: "정책 은행"
 CHI_policy_banks_cdb_desc: "국가개발은행, 중국수출입은행, 중국농업발전은행은 일반적인 상업적 제약 바깥에서 운영되는 병렬적 금융 구조를 이룹니다. 국가개발은행은 이제 세계은행과 아시아개발은행을 합친 것보다 큰 세계 최대의 개발 금융 기관으로, 싼샤 댐, 고속철도, 100개국 이상에 걸친 6천억 미국 달러 이상의 일대일로 인프라 대출에 자금을 댑니다. 이 세 은행은 단순한 금융 기관이 아니라 국가 전략의 도구입니다."
 CHI_politics_law_commision_realigned: "정법위원회 재편"
 CHI_politics_law_commision_realigned_desc: "정법위원회는 보안 기구, 법원, 검찰을 조율합니다. 이를 충칭 모델 뒤에 확고히 정렬한다는 것은 위협이 구체화되기 전에 식별할 수 있는 감시 기반시설을 구축하여 혁명을 외세의 전복 공작과 내부 파괴 활동으로부터 똑같이 차단함을 의미합니다."
 CHI_poly_goes_global: "폴리의 세계 진출"
 CHI_poly_goes_global_desc: "폴리 테크놀로지스는 중국제 소총과 미사일을 아프리카, 중동, 라틴 아메리카로 실어 나르고, 폴리 컬처는 그 수익을 경매 회사와 부동산으로 바꿉니다. 군의 무역 회사는 세계적 복합기업이 되어, 그 거래는 우리의 외교이며 그 수익은 어떤 예산의 손도 닿지 않습니다."
 CHI_Post_Armistice_Architecture: "정전 이후의 구조"
 CHI_Post_Armistice_Architecture_desc: "우리와 미국은 1953년 정전 협정을 대체할 방안을 공동으로 제안합니다. 한국 전쟁을 공식적으로 종결하고 모든 당사자가 수용할 수 있는 지역 안보 보장을 확립하는 포괄적 평화 체제입니다."
 CHI_Predatory_Lending_Doctrine: "함반토타 독트린"
 CHI_Predatory_Lending_Doctrine_desc: "스리랑카가 함반토타 항만 대출을 상환하지 못하자, 스리랑카는 우리 국영 기업 한 곳에 운영권을 넘기는 99년 임대 계약에 서명했습니다. 우리는 이 모델을 공식화해야 합니다. 처음부터 전략 자산이 담보가 되고 채무 불이행 시 장기 접근권으로 전환될 수 있도록 사업을 구성하는 것입니다. 채무자는 상환할지 말지를 선택함으로써 조건을 선택합니다."
 CHI_private_oem_rise: "민영 OEM의 부상"
 CHI_private_oem_rise_desc: "합작 투자 파트너로 지정된 것은 4대 국유 기업뿐이었지만, 지방 정부는 상관없이 자기 지역 제조사를 후원했습니다. 우후의 체리 자동차, 저장의 지리, 바오딩의 창청 자동차는 각각 합법 생산의 길을 찾아냈고 스스로 성장해 올라왔습니다. 민영 제조사들은 이제 우리 승용차의 3분의 1을 생산하며, 합작 투자 기업들이 외면하기로 한 SUV, 저가형, 전기차 부문을 채우고 있습니다. 이들을 지원하는 것이 좋을 것입니다."
 CHI_project_921: "921 공정"
 CHI_project_921_desc: "1992년 9월 중앙군사위원회는 중국 유인 우주 비행 능력을 위한 종합 계획인 921 공정을 승인했습니다. 이 결정으로 CASC의 유인 우주 비행 사무소가 설립되고 선저우 우주선 설계에 자금이 투입되었으며, 국가는 자국의 깃발 아래 궤도에 도달하겠다고 다짐했습니다."
 CHI_project_998: "998 공정"
 CHI_project_998_desc: "1995년과 1996년 미국 항공모함 전단 둘이 대만 해협으로 들어왔으나 우리 해군은 지켜볼 수밖에 없었습니다. 998 공정은 그 굴욕에 대한 답입니다. 항모가 돌아오는 날을 겨냥한 지속적인 해군 증강으로, 연안 방어 전력을 우리 해안에서 떨어진 해역을 놓고 다툴 수 있는 전력으로 바꿔 놓습니다."
 CHI_Project_Coordination_Cell: "일대일로 사업 조정 그룹"
 CHI_Project_Coordination_Cell_desc: "우리의 일대일로 회랑은 수십 개국과 수백 건의 사업에 걸쳐 있으며, 조정 기구가 없다면 지연, 중복, 정치적 취약점이 쌓일 것입니다. 중앙위원회 대외연락부(중롄부)가 신청을 심사하고, 사업 관리자를 지정하며, 이행 일정을 감독하는 부처 간 그룹을 주재해야 합니다. 질서는 성과를 낳고, 성과는 신뢰를 지탱합니다."
 CHI_project_jxx: "J-XX 계획"
 CHI_project_jxx_desc: "1990년대 후반 J-XX 계획으로 시작된 이 사업은 2011년 첫 비행, 2017년 실전 배치된 J-20 '맹룡'을 낳습니다. 스텔스 성능에 항속 거리가 길고 미사일 탑재량이 많은 이 기체는 미국과 러시아 밖에서 처음 등장한 5세대 전투기이며, 태평양 전쟁 수행이 의존하는 급유기와 조기 경보기를 사냥하도록 만들어졌습니다. 중국은 하늘에서 가장 작은 클럽에 가입합니다."
 CHI_project_no_10: "10호 계획"
 CHI_project_no_10_desc: "비밀 10호 계획에서 태어난 J-10은 청두에서 만든 단발 다목적 전투기로 소련의 어떤 도면에도 설계를 빚지지 않은 중국 최초의 현대 토종 전투기입니다. 국산 전투기 산업이 처음으로 홀로 서는 법을 배우게 된 기체입니다."
 CHI_property_tax_pilot_program: "부동산세 시범 사업"
 CHI_property_tax_pilot_program_desc: "상하이와 충칭이 세컨드 하우스와 고가 주 거주지에 완만한 세율을 부과하는 최초의 부동산세 시범 사업을 시작했습니다. 이 시범 사업은 투기성 구매를 억제하고 지방 정부 세수를 토지 매각 수입에서 다변화하는 것을 목표로 합니다. 결과가 유지된다면, 부동산 시장이 관리하기에 너무 큰 부담이 되기 전에 이 모델을 전국으로 확대해야 합니다."
 CHI_provincial_reshuffle: "성급 지도부 개편"
 CHI_provincial_reshuffle_desc: "쩡은 전국인민대표대회에서 대대적인 인사 순환을 설계했습니다. 상하이방의 원로들이 핵심 직위를 받습니다. 천량위는 상하이 당서기, 황쥐는 정치국 상무위원으로 승진, 자칭린은 정협 주석을 맡습니다. 이 개편은 가장 부유한 성들과 국가 자문 기구에 대한 태자당의 영향력을 공고히 합니다."
 CHI_provincial_youth_league_cohort: "성급 공청단 세력 진급"
 CHI_provincial_youth_league_cohort_desc: "허난의 리커창. 충칭의 왕양. 부상하는 류옌둥. 퇀파의 인재풀은 깊고 인내심이 많습니다. 그들이 나아가게 하십시오."
 CHI_public_health_reconstruction: "신형 농촌 합작 의료 제도"
 CHI_public_health_reconstruction_desc: "신형 농촌 합작 의료 제도는 농촌 주민, 지방 정부, 중앙 예산의 분담금을 모아 막대한 의료비를 보장합니다. 이는 우리 공화국 역사상 최초의 체계적인 농촌 건강 보험 사업으로, 가능한 한 빨리 거의 전 국민 보장 수준으로 끌어올려야 합니다. 8억 농민이 단지 병에 걸렸다는 이유로 재정적 파탄에 직면해서는 안 됩니다."
 CHI_public_rental_housing_drive: "공공 임대 주택 추진"
 CHI_public_rental_housing_drive_desc: "수백만 명의 도시 이주 노동자와 대졸자가 민간 집주인의 처분에 맡겨진 임시 거처에서 살고 있습니다. 국가는 건설 자원을 동원하여 주요 도시 전역에 저렴한 공공 임대 주택을 짓고, 보조금이 지급된 임대료를 받으며 3년의 임차 후 구매권을 제공합니다."
 CHI_pudong_financial_hub: "푸둥 금융 중심지"
 CHI_pudong_financial_hub_desc: "상하이 푸둥 신구는 중국의 주요 역외 금융 거점으로 개발됩니다. 루자쭈이 스카이라인, 상하이 증권거래소, 보세 무역 구역의 건설은 지역 금융 중심지로서 홍콩과 싱가포르에 도전하겠다는 중국의 야심을 알립니다."
 CHI_qbz191_rifle: "QBZ-191 소총"
 CHI_qbz191_rifle_desc: "노후한 QBZ-95 불펍 소총은 2019년부터 보급된 레일 장착 광학기기를 갖춘 재래식 배치의 소총 QBZ-191에 자리를 내줍니다. 이제 홀로가 아니라 네트워크로 연결되어 싸울 것이 기대되는 보병을 위한 현대적 무기입니다."
 CHI_qinghai_tibet_railway_planning: "칭짱 철도"
 CHI_qinghai_tibet_railway_planning_desc: "칭짱 철도는 평균 해발 4,500미터에서 탕구라 고개를 넘으며 1,956킬로미터에 걸쳐 이어질 것입니다. 완공되면 세계에서 가장 높은 철도이자 라싸로 가는 최초의 직통 철도 노선이 되어, 어떤 도로나 비행장도 하지 못했던 방식으로 티베트를 나머지 국토와 경제적, 물류적으로 통합할 것입니다."
 CHI_quiet_succession_engineering: "승계 설계"
 CHI_quiet_succession_engineering_desc: "조직부에 대한 쩡칭훙의 권한은 지금 막 열리는 승계 경쟁에 결정적인 영향력을 줍니다. 그는 공청단이 지지하는 리커창보다 시진핑 쪽으로 저울을 기울여야 합니다. 정치국 상무위원회 서열 1위 자리는 사실상 시진핑을 차기 총서기로 확정할 것이며, 우리는 문제가 공개적으로 결론 나기 전에 향후 10년의 당 지도부를 빚어놓게 될 것입니다."
 CHI_ranks_for_sale: "매관매직"
 CHI_ranks_for_sale_desc: "승진은 가격표가 됩니다. 쉬차이허우가 1999년부터 그랬듯이, 모든 별은 최고가 입찰자에게 팔리고, 현금은 구매자의 이름이 적힌 상자에 담겨 전달됩니다. 마침내 베이징 자택이 수색되었을 때 수사관들은 1톤이 넘는 현금을 끌어냈습니다. 계급을 산 장교단은 조국이 아니라 자신의 투자를 위해 싸울 것입니다."
 CHI_rapid_reaction_corps: "신속 대응군단"
 CHI_rapid_reaction_corps_desc: "정예 공수 및 공중 강습 부대가 상시 대기 상태를 유지하며, 몇 시간 안에 중국 전역 또는 그 너머로 전개할 수 있습니다. 이들은 경쟁국이 대응을 모으기 전에 지역 위기를 기정사실로 바꿔 놓습니다."
 CHI_rare_earth_dominance: "희토류 개발 전략"
 CHI_rare_earth_dominance_desc: "중국은 내몽골과 장시에 집중된 전 세계 희토류 생산의 약 85퍼센트를 통제합니다. 국가가 주도하는 통합 사업은 불법 채굴을 줄이고, 가공 표준을 높이며, 중국을 세계 첨단 제조업의 필수 공급국으로 자리매김시킵니다."
 CHI_rare_earth_leverage: "희토류 지렛대"
 CHI_rare_earth_leverage_desc: "우리는 세계의 무기가 없어서는 안 될 희토류, 세계 공급의 거의 90퍼센트를 정제하며, 이는 모든 유도 미사일과 스텔스 전투기 내부의 자석입니다. 수출품이었던 것이 지렛대가 됩니다. 공급을 조이면 경쟁자의 무기고는 멈춰 서고 우리의 것은 거침없이 돌아갑니다."
 CHI_Reclaim_The_Heavenly_Waters: "천수 되찾기"
 CHI_Reclaim_The_Heavenly_Waters_desc: "천수, 하늘의 물은 중화를 둘러싼 바다를 가리키는 고풍스러운 시적 명칭입니다. 이름은 운치를 더할 뿐이며 행동은 현대적이고 해군적입니다. 인민해방군 해군 수상 전단은 분쟁 중인 스프래틀리 해역에 대한 침투를 단계적으로 높이기 시작하여, 영유권 주장국의 해안 경비정에 도전하고, 보급 작전을 방해하며, 각국 정부에 최후통첩을 제시합니다. 분쟁 지형에 대한 중국의 행정 권한을 받아들이거나, 다음 출동을 맞이하라는 것입니다. 충돌 계수는 우리가 결정적인 전술적 성과를 거둘 때만 진전하며, 결론이 나지 않은 교전과 차질은 확전 단계를 정체시킵니다."
 CHI_reconstruction_development: "재건 능력"
 CHI_reconstruction_development_desc: "수년간의 인프라 투자와 축적된 건설 부문 역량은 우리에게 자연재해와 산업 사고 이후 신속하게 재건하는 탁월한 능력을 부여했습니다. 표준화된 재난 대응 규약, 사전 배치된 장비 비축, 전문 육군 공병 부대가 이 능력을 뒷받침합니다. 다음 지진이나 홍수는 우리의 준비 태세를 기다려 주지 않으므로, 이 능력을 예리하게 유지하기 위해 투자해야 합니다."
 CHI_red_arrow_program: "홍젠 계획"
 CHI_red_arrow_program_desc: "장갑 전력에는 홍젠 대전차 미사일 계열로 답합니다. HJ-8과 HJ-9은 보병 삼각대에서 차량과 헬리콥터에 이르기까지 모든 것을 무장시킵니다. 저렴하고 풍부하며 꾸준히 개량되는 이 미사일은 모든 부대에 전차 파괴 능력을 부여합니다."
 CHI_Renminbi_Internationalization: "기축 통화로서의 위안"
 CHI_Renminbi_Internationalization_desc: "우리는 SWIFT 망 바깥에서 위안화 거래를 청산하는 국경 간 은행 간 결제 시스템을 가동했고, 국제통화기금은 위안을 특별인출권 바스켓에 편입했습니다. 위안화로 이루어지는 일대일로 무역 결제는 세계 외환 보유고에서 우리 통화의 비중을 꾸준히 높이고 있습니다. 이제 독립성을 중시하는 파트너에게 위안이 달러의 진정한 대안이 될 때까지 이 장치들을 심화해야 합니다."
 CHI_Responsible_Stakeholder: "책임 있는 이해당사자"
 CHI_Responsible_Stakeholder_desc: "우리는 국제 사회가 세계 기구의 건설적 참여자가 되어 달라는 요구를 받아들여야 합니다. 무역 관계를 심화하고 다자 포럼에서의 마찰을 줄임으로써, 우리는 수정주의적 도전자가 아니라 불가결한 파트너로 자리매김합니다. 그 이면의 전략이 바뀌지 않더라도 명칭은 중요합니다."
 CHI_rmb_internationalisation: "위안화 국제화"
 CHI_rmb_internationalisation_desc: "위안화 무역 결제 시범 사업이 시작되었고, 통화 스와프 협정이 이제 40곳이 넘는 중앙은행과 체결되었습니다. IMF는 위안을 특별인출권 바스켓에 편입했으며, 이는 되돌릴 수 없는 인정입니다. 국경 간 은행 간 결제 시스템은 1,500곳이 넘는 회원 기관에 닿는 SWIFT의 위안화 표시 대안을 제공합니다. 러시아의 SWIFT 배제 이후 러시아-중국 무역의 약 90퍼센트가 CIPS와 위안-루블 통화쌍으로 이동하며, 사우디아라비아, 아랍에미리트, 브라질은 원자재 계약에서 위안을 받기 시작합니다. 달러 체제가 붕괴하는 것은 아니지만, 더 이상 도전자가 없는 체제도 아닙니다."
 CHI_Rome_Memorandum: "로마 일대일로 양해각서"
 CHI_Rome_Memorandum_desc: "이탈리아가 일대일로 양해각서에 서명한 것은 G7 회원국으로는 최초이며, 유럽에서 우리의 인프라 외교를 봉쇄하려는 서방의 합의에 균열을 냈습니다. 이 합의는 항만, 철도, 디지털 인프라 협력을 아우르며, 트리에스테와 제노바는 우리 화물의 북부 아드리아해 및 리구리아해 종착지로 자리매김합니다. 브뤼셀과 워싱턴은 로마에 철회를 압박하겠지만, 우리가 관계를 잘 관리한다면 우리 투자의 상업적 매력은 정치적으로 지속 가능한 것으로 입증될 것입니다."
 CHI_sasac: "국자위에 기업 이관"
 CHI_sasac_desc: "군에서 분리된 기업들은 사라지지 않고, 경제의 핵심 고지를 장악하기 위해 2003년에 설립된 국유자산감독관리위원회로 넘어갑니다. 군의 이윤은 민간 배당금이 되어 병영이 아닌 베이징에 기장됩니다."
 CHI_sasac_founding: "국유자산감독위원회"
 CHI_sasac_founding_desc: "우리의 국유 기업 부문은 오랫동안 일관된 소유 전략 없이 분산된 부처별 감독에 시달려 왔습니다. 우리는 중앙 관리 기업에 대한 통제를 통합하고, 경영진에 성과 계약을 도입하며, 배당금 납부를 요구하고, 주요 투자 결정을 심사하는 전담 감독 위원회를 설립해야 합니다. 국가는 단순한 규제자가 아니라 주주로서 행동해야 합니다."
 CHI_saturn_engine_crisis: "새턴 엔진 위기"
 CHI_saturn_engine_crisis_desc: "중국은 기체는 만들 수 있지만 그 안의 심장은 만들지 못합니다. 우리의 최고 전투기는 여전히 러시아 새턴의 AL-31로 비행하며, 모스크바의 모든 금수 조치나 가격 인상이 함대를 지상에 묶을 위협이 됩니다. WS-10 타이항은 대가가 얼마가 되든 작동하도록 만들어야 하며, 그렇지 않으면 우리의 독립은 수입 터빈 위에 칠한 허구에 불과합니다."
 CHI_scientific_development_outlook_foreshadowed: "과학적 발전관 예고"
 CHI_scientific_development_outlook_foreshadowed_desc: "부주석에게 이념의 공간을 양보합니다. 후진타오 사람들은 교리적 돌파구를 얻습니다. 지속 가능성, 농촌 균형 발전, 인간 중심 접근입니다."
 CHI_scientific_outlook_on_development: "과학적 발전관"
 CHI_scientific_outlook_on_development_desc: "후진타오의 통치 철학은 인민 중심적이고, 포괄적이며, 균형 잡히고, 지속 가능한 발전을 요구합니다. 이를 당의 교리로 채택하면 정책은 GDP 우선 성장에서 벗어나 더 폭넓은 사회적, 환경적 지표를 향해 재조정될 것입니다. 문제는 10년간 생산 목표 최적화에 매달려 온 성급 관리들이 측정하기 더 어려운 무언가를 위해 최적화하도록 설득될 수 있느냐입니다."
 CHI_scientific_outlook_on_development_tt: "§R$CHI_scientific_outlook_idea_1$을(를) 잃었기 때문에 다음을 얻습니다.§!"
 CHI_SCO_Exclusive_Core: "SCO 핵심 폐쇄"
 CHI_SCO_Exclusive_Core_desc: "급속한 확대로 SCO를 희석하기보다, 우리는 기존 회원국 간의 통합을 심화해야 합니다. 헌신적인 소수 국가 사이의 더 강한 유대는 더 큰 전략적 배당을 낳을 것입니다."
 CHI_SCO_Exclusive_Core_tt: "회원국 간 협력을 §G강화§!하고 새로운 대화 파트너의 신청을 §R차단§!합니다. 기존 회원국은 영구적인 관계 보너스를 받습니다."
 CHI_SCO_Plus_Expansion: "SCO+ 확대"
 CHI_SCO_Plus_Expansion_desc: "SCO의 힘은 폭넓음에 있습니다. 가입 장벽을 낮추고 새로운 대화 파트너를 적극적으로 영입함으로써, 우리는 기구의 영향력을 아시아, 중동, 그리고 그 너머로 확장할 수 있습니다."
 CHI_sea_eagles_carrier_wing: "함재 항공단"
 CHI_sea_eagles_carrier_wing_desc: "전투기 몇 대로는 항공단이 되지 않습니다. 우리는 공중 조기 경보, 대잠, 전자전 헬리콥터로 항모의 갑판을 채워, 항공기들을 정찰하고, 엄호하며, 타격하는 하나의 통합된 항공단으로 엮어냅니다."
 CHI_sea_eagles_of_the_liaoning: "랴오닝의 바다 독수리"
 CHI_sea_eagles_of_the_liaoning_desc: "랴오닝함의 갑판이 발톱을 얻습니다. Su-33에서 파생된 중량급 함재 전투기 J-15 '비상어'가 무장을 갖추고 타격기로 숙련되며, 움직이는 중국 갑판에서 항공 전력을 투사하는 항모 타격 교리가 처음으로 작성됩니다."
 CHI_second_gen_platforms: "2세대 플랫폼"
 CHI_second_gen_platforms_desc: "바이트댄스는 국내에서는 더우인을, 해외에서는 틱톡을 출시하여 BAT 세대가 겨냥하지 않았던 이용자층에 도달합니다. 핀둬둬는 공동 구매 방식으로 전자 상거래를 뒤흔들어 4선 도시와 농촌 시장의 소비자에게 닿고, 메이퇀은 즉시 배달 서비스를 선도합니다. 디디는 우버 차이나를 흡수합니다. 2차 플랫폼의 물결은 1세대가 너무 산만하거나 화려하지 않다고 여겨 구축하지 않았던 분야로 우리의 디지털 경제를 심화하고 있습니다."
 CHI_Second_Island_Chain_Reach: "제2 도련선 투사"
 CHI_Second_Island_Chain_Reach_desc: "멜라네시아와 폴리네시아 태평양 전역에서의 인민해방군 해군 접근권은 우리의 전진 작전 기지를 괌, 하와이, 그리고 미국과 동아시아 동맹국을 잇는 해상 교통로를 타격할 수 있는 거리 안으로 가져옵니다. 이 투사는 냉전 이래 미국 기획자들이 의존해 온 제2 도련선의 전략 논리를 깨뜨립니다. 오스트레일리아는 늘 상수로 여겨 온 지리적 완충을 잃습니다. 그들이 그것이 사라졌음을 깨닫기 전에 움직여야 합니다."
 CHI_Secure_The_Heavenly_Waters: "천수 확보"
 CHI_Secure_The_Heavenly_Waters_desc: "천수, 하늘의 물은 중화의 영역을 둘러싼 바다를 가리키는 고풍스러운 용어입니다. 합당한 질서를 인정하라는 초대를 거부한 자들은 이제 무력으로 굴복당합니다. 남해는 우리의 권위 아래 마땅한 통치로 복원됩니다."
 CHI_seed_security_campaign: "종자 안보 운동"
 CHI_seed_security_campaign_desc: "대두 전쟁은 우리의 취약성을 분명히 드러냈습니다. 국내 가공업체들이 투기성 선물 포지션으로 파산한 뒤, ABCD 곡물 거래업체들이 우리 대두 압착 능력의 70퍼센트를 확보했습니다. 우리는 이러한 노출이 반복되도록 놔둬서는 안 됩니다. 하이난섬의 싼야는 우리의 난판 작물 육종 기지로, 열대 겨울 덕분에 해마다 세 세대의 육종이 가능합니다. 중국화공의 신젠타 인수는 세계 종자 유전자원 컬렉션을 국가의 영향력 아래에 두며, 룽핑 하이테크와 베이다황 곡물 기관은 종자 주권의 국가 대표 기업으로 지정됩니다."
 CHI_selective_anti_corruption: "선별적 반부패 운동"
 CHI_selective_anti_corruption_desc: "2000년대 중반의 반부패 수사는 극도로 선별적이었습니다. 독자적인 권력 기반을 축적했거나 파벌의 선을 넘은 관리를 상대로는 사건이 추진된 반면, 동맹과 후견인은 감시로부터 보호받았습니다. 이러한 기소의 정치적 측면은 그 정당성을 훼손했고 당내에 파벌적 원한을 낳았습니다."
 CHI_Seoul_Under_Our_Umbrella: "우리 우산 아래의 서울"
 CHI_Seoul_Under_Our_Umbrella_desc: "우리와 한국은 전략적 동반자 체제를 공식화합니다. 우리의 안보 보장이 미국과의 동맹을 대체하고, 인민해방군 해군의 제주도 접근이 협상되며, 미군은 오래 예견되어 온 한반도 재배치를 시작합니다."
 CHI_service_of_the_three_distances: "삼원 복무"
 CHI_service_of_the_three_distances_desc: "해군은 자신이 닿아야 할 거리를 새로 규정합니다. 류화칭의 제1 도련선이 의미하는 근해 방어를 넘어, 이제는 원해와 대양 모두를 위해 훈련합니다. 이는 세계적 함대가 싸울 준비를 갖춰야 하는 세 가지 거리입니다. 교리는 연안 방어에서 전 세계 대양을 가로지르는 작전으로 결정적으로 전환됩니다."
 CHI_seventeen_plus_one_mechanism: "17+1 협력 체제"
 CHI_seventeen_plus_one_mechanism_desc: "중국-중동부 유럽 협력을 위한 17+1 플랫폼은 우리의 투자를 유럽 연합 및 후보국의 인프라로 유입시키며, 브뤼셀에서는 회원국 노선 이탈과 규제 우회에 대한 우려가 제기됩니다. 브뤼셀이 우려하는 것은 옳습니다. 우리는 바로 그런 이유로 이 관계를 심화해야 합니다. 우리의 시장 접근을 제약하는 통일된 유럽 전선을 분열시키기 때문입니다."
 CHI_shadow_banking_cleanup: "그림자 금융 및 금융 위험 정리"
 CHI_shadow_banking_cleanup_desc: "2008년과 2009년의 부양책 홍수는 자산 관리 상품과 신탁 회사가 부동산과 지방 정부 융자 플랫폼에 불투명한 위험을 쌓게 만들었습니다. 신 자산 관리 규정은 자산 관리 상품에 순자산 가치 평가를 요구하고 묵시적 보증을 없앱니다. 안방 보험은 무모한 3,000억 미국 달러의 해외 인수 끝에 국가에 접수됩니다. HNA 그룹은 자체 부채로 붕괴합니다. 이 정리 작업은 위험 감독을 개편된 은보감회에 집중하고 은행 간 시장을 안정시킵니다. 규율은 처벌이 아니라 우리가 신뢰할 수 있는 체제의 대가입니다."
 CHI_shandong_at_sanya: "싼야의 산둥"
 CHI_shandong_at_sanya_desc: "두 번째 항공모함은 온전히 우리의 것입니다. 중국에서 설계되고 건조된 최초의 항공모함인 002형 산둥함은 2017년 진수되어 2019년 취역했고, 이후 하이난 싼야의 위린 잠수함 동굴 옆을 모항으로 삼았습니다. 남쪽에서 그녀는 해상 교통로와 중국이 지키려는 분쟁 도서들을 감시합니다."
 CHI_shantytown_renovation: "판자촌 재개발 사업"
 CHI_shantytown_renovation_desc: "국가 판자촌 재개발 사업은 오래된 석탄 및 광업 성의 낙후된 노동자 주택을 철거하고 현대적인 주거 및 산업 지구로 대체합니다. 노후한 중공업 기반시설을 떠안은 산시와 허난이 가장 큰 배정을 받습니다. 이 사업에 대한 중앙 정부 지출은 1조 5,400억 위안에 달하여, 건설 계약의 물결을 일으키고 이전에는 없던 내륙 전역에 새로운 산업 구역을 엽니다."
 CHI_shenyang_j35_gyrfalcon: "J-35 청상어"
 CHI_shenyang_j35_gyrfalcon_desc: "두 번째 스텔스 전투기가 첫 번째에 합류합니다. FC-31 시범기에서 발전한 선양의 J-35는 육상 기지와 항모 갑판 모두에 맞는 크기의 쌍발 5세대 전투기로, 중국에 미국만이 달리 보유한 J-20과의 고저 혼합 스텔스 조합을 안겨 줍니다."
 CHI_shenzhou_program: "선저우 계획"
 CHI_shenzhou_program_desc: "2003년 10월 15일 양리웨이는 선저우 5호를 타고 주취안 위성 발사 센터에서 이륙하여 중국 최초의 우주비행사가 되었습니다. 14회 궤도 비행에 21시간이 걸린 이 임무로 중국은 독자적으로 사람을 우주로 보낸 세 번째 나라가 되었고, 우주 유영, 궤도 랑데부, 장기 체류 정거장 임무로 성장하게 될 유인 우주 비행 계획의 문을 열었습니다."
 CHI_sicarrier_euv: "SiCarrier EUV 사업"
 CHI_sicarrier_euv_desc: "국가의 직접적 후원으로 설립된 SiCarrier 테크놀로지는 EUV 격차를 메우는 임무를 맡았습니다. 이 사업은 창춘 광학연구소에서 개발된 국내 광학 설계 역량과 CNNC의 거울 제작 경험에 의존합니다. 작동하는 EUV 시범기에는 13.5나노 광원, 다층 반사 광학계, 나노미터 미만 정밀도의 웨이퍼 스테이지를 국산으로 생산하는 일이 필요합니다. 이것은 반도체 장비 주권을 온전히 달성하려는 우리의 가장 야심 찬 시도입니다. 국산 EUV 장비가 작동한다면 외국 장비 라이선스 하나 없이 첨단 칩을 처음부터 끝까지 제조할 수 있으며, 서방 수출 통제 체제를 그 근본에서 무너뜨릴 수 있습니다."
 CHI_Silk_Road_Fund: "실크로드 기금"
 CHI_Silk_Road_Fund_desc: "우리의 외환 보유고와 국부 펀드에서 400억 달러를 출자한 실크로드 기금은 상업 은행과 다자 대출 기관이 단독으로 떠맡지 않을 일대일로 사업에 지분 금융을 제공합니다. 위험을 감수할 최초 진입자가 없어 정체될 사업에 우리가 승인을 내줄 수 있는 수단입니다."
 CHI_sinograin_strategic_reserve: "시노그레인"
 CHI_sinograin_strategic_reserve_desc: "중국양곡비축공사는 수나라와 당나라 황실 곡창의 역할을 계승하며, 흑토 농장이 어느 성보다 많은 곡물을 생산하는 헤이룽장의 베이다황을 기반으로 합니다. 시노그레인은 최저 곡물 수매가 정책을 시행하여 시장이 하락할 때 국가를 대신해 매입합니다. 이후 전략 돼지고기 비축분이 곡물 저장고에 합류했는데 이는 세계에서 유일한 사례이며, 우리는 이 체제를 그 자체로 전략 자산으로 다뤄야 합니다."
 CHI_smee_lithography: "SMEE 리소그래피 개발"
 CHI_smee_lithography_desc: "상하이 마이크로 일렉트로닉스 이큅먼트 그룹은 우리의 유일한 리소그래피 제조사로, 패키징 및 후공정용 90나노와 110나노 노광 장비를 생산합니다. 국가 자금은 28나노 액침 DUV 스캐너 개발을 가속하며, 국내 팹에서 인증 진행 상황이 보고되고 있습니다. SMEE는 ASML의 가장 뛰어난 장비에 한 세대 뒤처져 있지만, 국산 DUV 생산은 성숙 공정 증설에 대한 의존을 없애고 첨단 공정 리소그래피 개발에 필요한 토대를 제공합니다. 격차는 현실이지만 궤적은 올바릅니다."
 CHI_smic_advanced_node: "SMIC 첨단 공정 추진"
 CHI_smic_advanced_node_desc: "미국 기업 제재 명단에 오른 뒤 SMIC는 국내 개발 노선을 가속했습니다. 우리 기술자들은 기존 DUV 장비를 개조하여 다중 패터닝으로 7나노급 집적도를 달성했으며, 이 성과는 창의적 공정 공학이 EUV 접근을 부분적으로 대체할 수 있음을 확인해 주었습니다. 이 성취는 국산 장비 개발의 시간을 벌어 주었고 기술 격차를 해결 가능한 공학 문제로 재정의했습니다. 메이트 60 프로의 출시는 이 제조 능력을 세계에 드러냈고 미국의 새로운 수출 통제 검토를 촉발했으며, 그 반응은 우리가 올바른 일을 하고 있음을 말해 줍니다."
 CHI_smic_zhangjiang: "SMIC 장장 확장"
 CHI_smic_zhangjiang_desc: "중국 반도체 제조 국제 공사는 장장 하이테크 파크에 주력 300mm 팹 단지를 건설했으며, 연이은 증설에 대한 국가 투자 덕분에 SMIC는 28나노 생산에 도달하고 14나노 위험 생산을 시작할 수 있었습니다. 새 공정이 나올 때마다 TSMC 및 삼성과의 격차가 좁혀지며, SMIC는 이제 첨단 로직 생산이 가능한 유일한 중국 본토 파운드리입니다. 우리는 이 자산을 보호하고 더욱 밀어붙여야 합니다."
 CHI_smuggling_tax: "밀수에 과세"
 CHI_smuggling_tax_desc: "군은 모든 불법 사업을 직접 운영하지는 않고, 허가해 줍니다. 항구와 주둔지를 통해 석유, 자동차, 담배를 옮기는 밀수업자들은 보호의 대가로 현지 지휘관에게 돈을 내고, 그 상납금은 어떤 부처도 보거나 건드릴 수 없는 비공식 예산이 됩니다."
 CHI_Soft_Power_Projection: "소프트 파워 투사"
 CHI_Soft_Power_Projection_desc: "전 세계 대학에 공자학원을 설립하고 국영 언론의 국제적 영향력을 확대하여 중국어, 문화, 관점을 해외에 알립니다."
 CHI_special_operations_forces: "특수 작전군"
 CHI_special_operations_forces_desc: "각 전구는 습격, 정찰, 참수 타격을 위해 훈련된 자체 특수 작전 여단을 창설합니다. 이들은 날카로운 칼날의 끝으로, 주력 부대에 앞서 투입되어 안에서부터 문을 엽니다."
 CHI_star_market_bse: "과창판과 베이징 증권거래소"
 CHI_star_market_bse_desc: "상하이 증권거래소의 과학기술혁신판은 등록제 IPO, 차등 의결권 주식 구조, 적자 기업의 상장 접근을 도입합니다. SMIC는 과창판에서 75억 미국 달러를 조달하고, 베이징 증권거래소가 뒤따라 혁신적 중소기업을 겨냥합니다. 이 플랫폼들이 합쳐져 반도체, 바이오 기술, 첨단 제조업 기업이 월스트리트 상장에 의존하지 않고 국내에서 자본을 조달할 수 있게 합니다. 우리의 자본 시장은 더 이상 의존 위험이 아닙니다."
 CHI_state_council_information_office: "국무원 신문판공실"
 CHI_state_council_information_office_desc: "국무원 신문판공실은 우리의 대외 소통, 해외 선전 작전, 국내 인터넷 관리, 외국 언론 인가를 관리합니다. 우리는 이를 활용하여 금순공정 아래 콘텐츠 검열을 제도화하고, 서방의 서사 지배에 맞서도록 국제 방송을 확대해야 합니다. 정보 환경은 전장이며, 우리는 이를 방치하여 내줄 여유가 없습니다."
 CHI_stock_exchanges_shanghai_shenzhen: "상하이, 선전, 홍콩 증권거래소"
 CHI_stock_exchanges_shanghai_shenzhen_desc: "상하이 증권거래소에는 4대 은행, 시노펙, 페트로차이나, 차이나 모바일을 비롯한 대형 국유 기업이 상장되어 있습니다. 선전 증권거래소에는 BYD, 메이디, 거리, 핑안 같은 민간 기업과 혁신 기업이 상장되어 있습니다. 선전의 촹예반(ChiNext)은 나스닥에 해당하는 성장주 시장으로 기능합니다. 상하이-홍콩 및 선전-홍콩 증권 교차 거래 제도는 자본 계정 완전 자유화 없이도 국제 포트폴리오 투자자에게 통제된 관문을 열어, 우리가 우리 조건으로 외국 자본을 유치할 수 있게 합니다."
 CHI_strategic_materials: "전략 소재 공급망"
 CHI_strategic_materials_desc: "우리는 세계 갈륨과 게르마늄 정제 능력의 80퍼센트 이상을 통제하며, 반도체 제조에 쓰이는 형석, 금속 규소, 희토류 원소의 공급을 지배합니다. 미국의 수출 통제에 이어 우리는 갈륨과 게르마늄에 수출 허가제를 도입하고, 이어서 갈륨 비소 화합물에 추가 제한을 둡니다. 국내 정책은 전략 소재 생산을 우리 자체 팹으로 돌려, 기업 제재 명단의 제약 아래 운영되는 파운드리의 비용을 줄이고 공급 연속성을 확보합니다. 소재의 병목은 양방향으로 작용합니다."
 CHI_strategic_reserve_system: "전략 예비 체제"
 CHI_strategic_reserve_system_desc: "종심은 그 자체로 방어입니다. 개편된 예비군 및 동원 체제는 훈련된 인력을 전선에 쏟아부을 준비가 되어 있으며, 장기 소모전조차 중국이 더 오래 버틸 수 있는 전쟁이 되도록 보장합니다."
 CHI_streamline_the_ranks: "병력 정예화"
 CHI_streamline_the_ranks_desc: "침략자를 인파로 익사시키기 위해 만들어진 200만 대군은 정밀의 전쟁에서 승리할 수 없습니다. 우리는 비대해진 보병을 감축하고, 구식을 퇴역시키며, 절감한 비용을 화력, 센서, 기동성에 쏟아붓습니다. 인민해방군은 더 작아지고, 더 날카로워지며, 처음으로 단지 견디기 위해서가 아니라 이기기 위해 만들어진 군대가 될 것입니다."
 CHI_strike_black_sing_red: "타흑창홍"
 CHI_strike_black_sing_red_desc: "정치 사회를 정화하기 위한 양면 운동입니다. '타흑' 운동은 수천 명의 조직 범죄 인물과 부패 관리를 체포하여 지방 통치를 부식시킨 후견 네트워크를 해체합니다. '창홍' 운동은 혁명 가요와 마오주의 구호를 되살려 대중의 에너지를 애국적 동원으로 돌립니다."
 CHI_Suez_Eastern_Bank: "수에즈 동안 산업 지구"
 CHI_Suez_Eastern_Bank_desc: "운하 동쪽 기슭에 있는 중국-이집트 수에즈 경제무역협력구는 이집트의 우대 규제 조건 아래 우리 제조, 물류, 에너지 기업을 유치합니다. 이 지구는 세계에서 가장 중요한 해상 요충지 중 한 곳에서 우리의 전략적 거점을 굳히고, 운송 비용을 줄이며, 우리 기업에 북아프리카와 유럽 시장 접근의 기지를 제공합니다. 이집트는 경화 수입과 우리와의 정치적 연계를 얻습니다. 양측 모두 우리가 쌓고 있는 것의 가치를 이해합니다."
 CHI_Sunshine_Policy_Revival: "햇볕 정책 부활"
 CHI_Sunshine_Policy_Revival_desc: "우리는 천안함 침몰과 연평도 포격 이후 몇 년 사이 붕괴한 남북 관여 체제를 되살리기 위해 서울과 조율해야 합니다. 공동 문화 교류, 이산가족 상봉 사업, 재개된 직통 전화는 남북한 사이 소통의 기본 기반을 재건하며, 우리는 불가결한 중재자로서 역할을 합니다. 대화하는 한국은 싸우지 않는 한국입니다."
 CHI_system_of_systems_operations: "체계 대 체계 작전"
 CHI_system_of_systems_operations_desc: "개혁의 끝은 편제표가 아니라 전쟁의 방식입니다. 우리는 센서, 사수, 지휘관을 어떤 적도 반응할 수 있는 속도보다 빠르게 생각하고 타격하는 하나의 네트워크로 엮는 체계 대 체계 작전을 추구합니다. 다음 전쟁에서 승리하는 군대는 보는 하나의 유기체로서 싸울 것입니다."
 CHI_tactical_electronic_warfare: "전술 전자전"
 CHI_tactical_electronic_warfare_desc: "정보화된 전장에서는 상대의 눈을 멀게 하는 쪽이 승리합니다. 우리는 여단급에 전담 재밍, 신호, 전자 공격 부대를 배치하여, 첫 발이 발사되기 전에 적의 무전기, 레이더, 데이터링크를 놓고 다툽니다."
 CHI_tactical_uav_integration: "전술 UAV 통합"
 CHI_tactical_uav_integration_desc: "머리 위의 눈이 표준 장비가 됩니다. 소형 정찰 드론이 대대와 중대까지 보급되어, 어떤 지휘관도 눈먼 채 전진하지 않고 모든 표적이 사격받기 전에 발견될 수 있습니다."
 CHI_Takeshima_Solidarity: "리앙쿠르 암초 공동성명"
 CHI_Takeshima_Solidarity_desc: "우리는 리앙쿠르 암초(독도)에 대한 한국의 주장을 공식적으로 지지하며, 이 분쟁을 일본이 제국주의 유산을 인정하기를 거부하는 데 대한 공동의 불만으로 규정합니다. 서울과 도쿄 사이의 쐐기가 넓어지고, 한국의 여론은 워싱턴의 태평양 동맹 구조에서 멀어집니다."
 CHI_telecom_reorganization: "통신 구조조정"
 CHI_telecom_reorganization_desc: "국무원은 우리의 통신 독점을 개편하여 차이나 텔레콤을 분할하고, 차이나 모바일, 차이나 유니콤, 차이나 텔레콤에 3G 주파수를 동시에 허가합니다. 이로 인한 경쟁은 네트워크 인프라 투자를 이끌고, 어떤 외국 경쟁자도 닿을 수 없는 14억 잠재 가입자 시장에서 모바일 광대역 보급을 가속합니다."
 CHI_tencent_games_publisher: "텐센트의 게임 제국"
 CHI_tencent_games_publisher_desc: "텐센트는 라이엇 게임즈와 슈퍼셀을 인수하고 에픽, 액티비전 블리자드, 유비소프트의 대규모 지분을 보유합니다. 왕자영요는 세계 최고 매출의 모바일 게임이 되었고, 원신은 출시 첫 2년 동안 50억 미국 달러를 벌어들입니다. 서방 스튜디오에 대한 우리의 투자는 전통적 소프트 파워의 일부 비용으로 세계 엔터테인먼트에 대한 구조적 영향력을 우리에게 줍니다. 문화는 외교가 닿지 못하는 방식으로 사람들을 움직입니다."
 CHI_The_2022_Reset: "[GetYear]년 재설정"
 CHI_The_2022_Reset_desc: "[GetYear]년에 수립된 발리 G20 체제를 바탕으로, 우리와 미국은 6자 회담 구조를 공식적으로 되살립니다. 우리는 10년 넘게 처음으로 워싱턴, 서울, 평양 사이의 정직한 중재자 역할을 맡습니다."
 CHI_The_2025_Blue_Sky_Operation: "푸른 하늘 작전"
 CHI_The_2025_Blue_Sky_Operation_desc: "우리와 북한은 한국에 대한 조율된 군사 작전을 개시합니다. 푸른 하늘 작전은 무력에 의한 한반도 통일의 국제적 대가를 감수하려는 우리의 의지를 시험할 것입니다."
 CHI_The_610_Northeast_Directive: "610 동북 지침"
 CHI_The_610_Northeast_Directive_desc: "중국 공산당 동북 사령부는 만주와 랴오닝 전역에서 비상 동원 규약을 발동합니다. 국경 병력이 증강되고, 전략 예비대가 재배치되며, 접경 지역의 기반시설은 한반도의 어떤 미래 사태도 뒷받침할 수 있도록 강화됩니다."
 CHI_the_610_office_mandate: "610 사무실 권한"
 CHI_the_610_office_mandate_desc: "창설일을 따서 이름 붙여진 610 사무실은 파룬궁과 사회 안정에 대한 위협으로 간주되는 기타 단체를 탄압하는 데 우리 국가 안보 기관을 조율합니다. 이 기구는 통상적인 법적 경로 바깥에서 운영되며 집행 권한을 중앙의 손에 집중시킵니다. 그 권한은 의도적으로 제약이 없는데, 이 기구가 다루는 위협이 일반 법의 경계를 존중하지 않기 때문입니다."
 CHI_the_998_project: "998 폭격기 계획"
 CHI_the_998_project_desc: "오랫동안 구식이라 치부되던 폭격기 전력에 미래가 주어집니다. 전담 사업이 깊이 현대화된 기체를 중심으로 장거리 타격 전력을 재건하여, 냉전의 유물을 적대적인 해안을 넘지 않고도 서태평양 전역의 표적을 위협할 수 있는 원거리 미사일 운반기로 바꿔 놓습니다."
 CHI_The_Air_Patrol_Zone: "공중 순찰 구역"
 CHI_The_Air_Patrol_Zone_desc: "다른 국가들이 방공 식별 구역이라 부르는 것을 우리는 정례화된 순찰 구역이라 부르기를 선호합니다. 인민해방군 공군 요격기는 남중국해 상공에서 정기적인 주권 순찰을 수행하며, 외국 항공기를 식별하고 비협조적인 통과 항공기를 구역 밖으로 호위합니다. 실제 효과는 2013년 동중국해 선례를 되풀이하여, 모든 비중국 항공기가 식별 요건과 요격 위험에 직면하지만, 틀은 국제 사회가 즉각 반박할 공식적 법적 주장이 아니라 우리의 공군력을 강조합니다."
 CHI_the_anime_generation_gambit: "애니메이션 세대의 승부수"
 CHI_the_anime_generation_gambit_desc: "우리 청년들은 마오를 인용하는 것보다 미야자키 하야오를 더 자주 인용합니다. 이는 문제이거나 기회입니다. 왕후닝 동지는 후자라고 믿습니다."
 CHI_The_Beijing_Peace_Guarantee: "베이징 평화 보장"
 CHI_The_Beijing_Peace_Guarantee_desc: "우리는 남북한 사이의 최종 합의를 보증합니다. 베이징 평화 보장은 통일된 한국의 주권을 외부 간섭으로부터 지킬 것을 우리에게 약속하게 합니다."
 CHI_The_Beijing_Settlement: "베이징 합의"
 CHI_The_Beijing_Settlement_desc: "쿠데타가 공고해진 가운데, 우리는 북한의 새로운 정치 현실의 조건을 중재합니다. 평양의 과도 정부는 우리의 중재를 받아들이고, 조선노동당은 우리의 감독 아래 재편됩니다."
 CHI_the_bohai_bastion: "보하이 보루"
 CHI_the_bohai_bastion_desc: "가장 확실한 억지력은 발견할 수 없는 것입니다. 사거리 약 1만 킬로미터의 JL-3 미사일을 탑재한 094A형 전략 잠수함은 마침내 방어된 근해에서 미국 본토를 타격할 수 있습니다. 함대 뒤의 보호된 보루에 숨은 우리의 탄도 미사일 잠수함은 중국에 진정한 해상 기반 제2격 능력을 안겨 주며, 어떤 선제 타격도 우리를 무장 해제시킬 수 없다는 최종 보장입니다."
 CHI_The_Border_Personnel_Meetings: "국경 인원 회담"
 CHI_The_Border_Personnel_Meetings_desc: "인도와 중국 지휘관들이 확전 규약 없이 만날 수 있는 실질 통제선상의 다섯 지점입니다. 주전자 하나, 접이식 탁자 하나, 깃발 두 개. 외교는 때때로 그토록 작은 곳에서 시작됩니다."
 CHI_The_Cabbage_Strategy: "양배추 전략"
 CHI_The_Cabbage_Strategy_desc: "장자오중 해군 소장은 이 전술을 공개적으로 설명했습니다. 분쟁 중인 지형을 겹겹의 층으로 감싸는 것입니다. 바깥에는 어선, 그 뒤에는 해상 민병, 다음에는 해안 경비정, 핵심에는 호위함을 두어, 가장 바깥쪽 잎이 주권과 구별되지 않을 때까지 이어갑니다. 외국 변호사들이 도착할 무렵이면 양배추는 이미 자라 있습니다. 우리는 이 교리를 남중국해에 대한 우리의 틀로 채택합니다."
 CHI_The_Cabbage_Tightens: "조여드는 양배추"
 CHI_The_Cabbage_Tightens_desc: "해상 민병과 해안 경비정은 이제 분쟁 중인 암초 사슬 전역에서 통일된 인민해방군 해군의 조율 아래 운용됩니다. 양배추의 바깥층이 빈틈없는 행정 및 안보 주둔으로 통합됩니다. 한때 분쟁 대상이던 곳은 이제 사실상 통치되고 있습니다."
 CHI_the_china_plus_one_counteroffensive: "차이나 플러스 원 반격"
 CHI_the_china_plus_one_counteroffensive_desc: "도요다 씨는 양보를 기대하며 톈진을 방문했습니다. 그는 양보와 함께 수소연료전지 차량 10만 대 계약을 가지고 떠났습니다. 주면서 취하는 기술은 여전히 우리가 완성할 몫입니다."
 CHI_The_Chinese_Correction: "중국식 교정"
 CHI_The_Chinese_Correction_desc: "김씨 왕조의 예측 불가한 행동은 전략적 부담이 되었습니다. 우리는 조용하고, 외과적이며, 되돌릴 수 없는 관리된 전환이 평양으로부터 또 한 세대의 협박 외교를 견디는 것보다 낫다고 결정했습니다."
 CHI_the_chinese_dream: "중국몽"
 CHI_the_chinese_dream_desc: "중화민족의 위대한 부흥은 가장 위대한 중국몽입니다. 백 년의 치욕은 복원에 자리를 내주었으며, 당은 이 변혁을 이념이 아닌 14억 모두가 공유하는 역사적 운명으로 규정합니다. 경제력, 군사력, 국제적 존중은 야망이 아니라 우리에게서 빼앗긴 것이며 우리가 되찾을 것입니다."
 CHI_The_Code_Of_Conduct: "행동 준칙"
 CHI_The_Code_Of_Conduct_desc: "중국의 조건 아래 협상된 구속력 있는 지역 행동 준칙이 남중국해 영유권 주장 경합에 대한 결정적 해결책으로 제시됩니다. 이 문서는 양자 합의를 성문화하고, 외부 중재를 배제하며, 분쟁은 오직 중국과 그 이웃의 문제라는 원칙을 명문화합니다. 역외 강국은 어떤 법적 발판도 거부당합니다."
 CHI_the_diaoyu_sovereignty_declaration: "댜오위 주권 선언"
 CHI_the_diaoyu_sovereignty_declaration_desc: "댜오위 제도는 명나라 이래 중국의 영토였습니다. 일본의 '관할'은 세계가 너무 오랫동안 용인해 온 식민지적 유산입니다."
 CHI_The_Duterte_Pivot: "두테르테 전환"
 CHI_The_Duterte_Pivot_desc: "필리핀의 두테르테 대통령이 자국이 미국으로부터 \\"분리\\"되었다고 선언하고 베이징으로 돌아섰을 때, 그는 동남아시아 지도자가 의존보다 주권을 선택할 수 있음을 지역에 보여주었습니다. 우리는 워싱턴의 동맹이 답이 아니라 질문이 될 때까지, 다른 곳에서도 이러한 전환을 조용히 인내심 있게 육성해야 합니다."
 CHI_The_Final_Compromise: "최종 타협"
 CHI_The_Final_Compromise_desc: "수년간의 인내심 있는 외교 끝에, 우리는 남북한 양측이 받아들이는 최종 합의를 중재합니다. 통일도 영구 분단도 아닌 이 방안은 공동 경제 구역, 비무장 국경 통과점, 중국-한국 공동 감시 위원회를 수립합니다. 우리는 한반도 평화의 불가결한 보증자로 부상합니다."
 CHI_The_Five_Fingers_Doctrine: "다섯 손가락 독트린"
 CHI_The_Five_Fingers_Doctrine_desc: "마오는 1959년에 말했습니다. 티베트는 오른쪽 손바닥이며, 다섯 손가락은 라다크, 네팔, 시킴, 부탄, 북동 변경 지역입니다. 우리는 손바닥과 엄지를 가졌습니다. 나머지 손가락들이 기다리고 있습니다."
 CHI_the_fujian_catapults: "푸젠의 캐터펄트"
 CHI_the_fujian_catapults_desc: "스키 점프대가 캐터펄트에 자리를 내줍니다. 2022년 진수된 003형 푸젠함은 전자기 캐터펄트를 갖춘 최초의 중국 항모로, 더 무겁고 연료를 가득 채운 항공기와 심지어 공중 조기 경보기까지 갑판에서 쏘아 올릴 수 있습니다. 이 함선으로 미국 슈퍼 항모와의 격차는 심연에서 한 걸음으로 좁혀집니다."
 CHI_the_fukuda_doctrine_revisited: "후쿠다 독트린 재고"
 CHI_the_fukuda_doctrine_revisited_desc: "덩 동지는 우리에게 말했습니다. 힘을 감추고 때를 기다리라고. 일본 경제는 출혈하고 있고, 출산율은 붕괴하고 있으며, 정치인들은 14개월마다 총리 관저를 오갑니다. 우리가 그 유산을 살 수 있는데 왜 죽어가는 시체와 싸움을 걸어야 합니까?"
 CHI_The_G2_Declaration: "G2 선언"
 CHI_The_G2_Declaration_desc: "워싱턴과 베이징을 오간 정상회담에서 우리 지도부와 미국은 한국인의 통치 아래 평화적으로 통일된 한반도에 대한 공동의 의지를 선언합니다. G2 선언은 강대국이 동아시아 안보를 관리하는 새로운 시대를 알리는 신호이며, 그 체제에서 우리를 대등한 파트너로 인정하는 것입니다."
 CHI_the_great_wall: "만리장성"
 CHI_the_great_wall_desc: "어떤 전투는 결코 패하지 않음으로써 승리합니다. 우리는 방어의 길, 곧 현대판 만리장성을 택합니다. 겹겹의 요새와 두터운 예비대, 그리고 중국 땅에 들어온 침략자의 피를 말려 버릴 군대입니다. 조국을 먼저 불패의 땅으로 만든다면 통일은 기다려도 됩니다."
 CHI_the_great_western_development: "서부 대개발"
 CHI_the_great_western_development_desc: "우리의 서부 대개발 정책은 인프라 건설, 공장 유인책, 이주 사업을 통해 국가 투자를 서부 열두 개 성으로 돌립니다. 연안과 내륙의 격차를 해소하는 것은 경제적으로 반드시 필요한 일이며, 동요하는 변경 지역을 중앙에 묶어 두는 가장 견고한 수단이기도 합니다."
 CHI_the_historical_reckoning: "역사의 청산"
 CHI_the_historical_reckoning_desc: "교과서는 한 도시를 지워 버렸습니다. 신사는 설계자들을 기립니다. 기억하는 쪽은 우리가 될 것입니다."
 CHI_the_iron_fist: "강철 주먹"
 CHI_the_iron_fist_desc: "방어만으로는 잃은 것을 되찾지 못합니다. 우리는 강철 주먹을 택합니다. 99식이 이끄는 중합동병과 여단, 대규모 기갑 전력, 그리고 방어를 갖춘 적을 분쇄하고 땅을 차지하도록 만들어진 장거리 화력입니다. 해협이나 국경을 넘으라는 명령이 떨어지면 압도적인 물량으로 답할 것입니다."
 CHI_The_Jang_Faction_Rehabilitation: "장성택 계파의 복권"
 CHI_The_Jang_Faction_Rehabilitation_desc: "장성택이 숙청되어 처형되면서 평양에서 우리가 가장 믿을 만했던 대화 상대도 함께 사라졌습니다. 이제 우리는 망명 중인 그의 잔존 인맥을 복권시키고, 자신의 앞날을 우리에게 빚진 개혁 성향의 조선 관료 집단을 육성할 것입니다."
 CHI_the_japan_question: "일본 문제"
 CHI_the_japan_question_desc: "우리 북동쪽에는 커다란 위협이자 커다란 기회가 있습니다. 일본 문제는 대만 문제, 한반도 문제와 마찬가지로 영구적인 답이 없으며, 오직 지금 이 시점에 걸맞은 답만 있을 뿐입니다."
 CHI_the_komsomolsk_pipeline: "콤소몰스크 파이프라인"
 CHI_the_komsomolsk_pipeline_desc: "러시아의 공장이 이미 돌아가고 있는데 우리 공장을 기다릴 이유가 있겠습니까? 우리는 아무르 강변의 콤소몰스크에서 Su-27과 Su-30, 그리고 우리 전투기 절반을 움직이는 AL-31 엔진을 사들여, 아직 우리가 만들 수 없는 한 세대 분의 역량을 들여옵니다. 이 파이프라인은 오늘의 공군을 현대적으로 유지해 주지만, 그 대가로 내일 모스크바에 의존하게 됩니다."
 CHI_The_Mandate_Of_The_Seas: "바다의 천명"
 CHI_The_Mandate_Of_The_Seas_desc: "고전적 중국 세계관은 중화를 에워싼 네 개의 바다, 곧 사해를 인정했습니다. 그 바다의 용왕들은 하늘에 복종했고, 하늘을 통해 천자에게 복종했습니다. 그 질서는 백년국치로 단절되었으며, 이제 그것을 집행할 만큼 강한 국가 아래에서 복원되기를 기다리고 있습니다."
 CHI_the_maritime_militia_initiative: "해상 민병 구상"
 CHI_the_maritime_militia_initiative_desc: "모든 어선은 움직이는 주권 표지입니다. 인민무장부 해상 민병은 중앙군사위원회의 지휘를 받지만, 세상에는 어부만 보일 것입니다."
 CHI_The_Maritime_Silk_Road_Initiative: "해상 실크로드 구상"
 CHI_The_Maritime_Silk_Road_Initiative_desc: "해상 실크로드는 일대일로 구상의 바다 부문으로, 우리의 인프라 투자와 무역망을 동남아시아, 남아시아, 동아프리카로 넓힙니다. 남중국해에서는 우리 외교 노선의 경제적 닻 역할을 합니다. 항만 금융, 어업 협정, 탄화수소 합작 사업을 제안받은 영유권 주장국들은 아세안 차원의 대결보다 양자 협상이 더 매력적이라고 느낍니다. 서명된 협정 하나하나는 이러한 분쟁이 이웃 나라 사이의 문제이지 국제 재판에 맡길 사안이 아니라는 원칙을 강화합니다."
 CHI_the_nanjing_memorial_mandate: "난징 추모 의무"
 CHI_the_nanjing_memorial_mandate_desc: "삼십만 명. 이 숫자는 모든 교과서 표지와 모든 박물관 벽, 매년 12월 13일의 모든 묵념 속에 새겨질 것입니다. 일본 정부에게는 그들의 기억이 있습니다. 우리에게는 우리의 기억이 있을 것입니다."
 CHI_The_Nine_Dots_Consensus: "9점 합의"
 CHI_The_Nine_Dots_Consensus_desc: "우리는 평양과 서울 가운데 한쪽을 택하는 대신 절제된 중도의 길을 갑니다. 북한 정권의 존속을 보장하지는 않으면서 북한과의 관계를 유지하고, 전략적 모호성을 버리지 않으면서 남한과의 경제 관계를 심화합니다. 두 갈래의 끈을 동시에 쥐고 있는 것만이 결국 안정된 한반도를 만들어 낼 수 있는 유일한 방법이라고 우리는 판단합니다."
 CHI_the_northeast_tiger: "동북의 호랑이"
 CHI_the_northeast_tiger_desc: "부패한 군에서 권력은 지연과 후원을 통해 흐릅니다. 쉬차이허우가 출세한 터전인 동북의 선양 파벌은 캐스팅 보트를 쥐게 되어, 옛 군구들 전역에서 마치 사유지처럼 인사와 청탁을 거래합니다."
 CHI_the_panda_diplomacy_renewal: "판다 외교 재개"
 CHI_the_panda_diplomacy_renewal_desc: "판다 두 마리. 연간 1,200만 달러의 '보호 비용.' 중국 동물을 보고 웃는 일본 아이의 사진 한 장이 1면을 장식합니다. 위안화 한 푼도 아깝지 않습니다."
 CHI_The_Panmunjom_Architecture: "판문점 구조"
 CHI_The_Panmunjom_Architecture_desc: "우리는 정전 협정이 체결된 곳이자 미국 주도 정상회담이 20년 동안 실패를 거듭한 곳인 판문점에서 새로운 다자 대화를 소집할 것입니다. 우리의 구상은 우리의 중재 아래 서울과 평양을 한 테이블에 앉히고, 우리의 외교적 보장을 바탕으로 모든 당사자가 단계적인 긴장 완화 과정을 이행하도록 약속하게 하는 것입니다. 워싱턴이 해내지 못한 일을 우리가 이루었다고 세상은 인정할 것입니다."
 CHI_the_party_that_lasts: "영속하는 당"
 CHI_the_party_that_lasts_desc: "당의 제도적 메커니즘인 당대회 체제, 중앙위원회, 정치국은 어느 한 지도자보다 오래 지속되도록 설계된 정당한 통치 기관으로 재확인됩니다. 시진핑 사상은 앞으로 한 세기의 운영 틀로 자리 잡지만, 그것을 이어 갈 체제는 집단적이고 견고합니다. 당은 마오쩌둥의 죽음과 문화대혁명, 톈안먼 사건을 견뎌 냈습니다. 그 기구는 지속되도록 만들어졌습니다."
 CHI_The_Pivot_Reversed: "역전된 아시아 회귀"
 CHI_The_Pivot_Reversed_desc: "미국의 아시아 회귀는 워싱턴의 공약을 과도하게 확장시켰고 전략적 공백을 만들었습니다. 미국의 신뢰가 흔들리는 만큼 우리는 그 공백을 메우고, 서울에 가장 유능하고 의지가 있는 안보 파트너로 자리매김할 것입니다."
 CHI_The_PLAN_Expeditionary_Buildup: "중국 해군 원정 전력 증강"
 CHI_The_PLAN_Expeditionary_Buildup_desc: "항모 타격단과 075형 강습상륙함, 해상 보급 함대가 중국 인민해방군 해군을 완전한 원양 작전 능력으로 이끕니다. 남중국해는 더 이상 방어해야 할 변경이 아닙니다. 대륙 간 거리까지 무력을 투사할 수 있는 집결지입니다."
 CHI_the_poly_compromise: "폴리 타협"
 CHI_the_poly_compromise_desc: "깨끗해 보이자고 재산을 내줄 이유가 있겠습니까? 폴리 그룹은 총참모부의 무기 거래 부문에서 태어났으며, 군이 일구어 온 제국들 중 가장 클 뿐입니다. 우리는 장쩌민의 사업 매각 요구를 거부합니다. 사업도, 밀수도, 돈도 그대로 남습니다. 인민해방군은 개혁되기 전에 부유해질 것이며, 충성은 얻어지는 것이 아니라 돈으로 사는 것이 될 것입니다."
 CHI_The_Princeling_Network: "태자당 네트워크"
 CHI_The_Princeling_Network_desc: "우리 정보기관은 이곳에서 교육받은 평양 엘리트의 자녀들을 통해 조선인민군 장교단에 침투합니다. 베이징에서 보낸 세월로 형성된 이 태자당들은 북한 국가 내부에서 우리가 가장 믿을 수 있는 지렛대입니다."
 CHI_the_pterodactyl_generation: "익룡 세대"
 CHI_the_pterodactyl_generation_desc: "윙룽, 곧 익룡 계열 무장 드론은 공군에 정찰과 타격을 위한 저렴하고 끈질긴 사냥꾼을 안겨 주며, 중국의 공군력을 십여 개 외국 전쟁에 실어 나르는 대표 수출품이 됩니다."
 CHI_the_quad_wedge_strategy: "쿼드 쐐기 전략"
 CHI_the_quad_wedge_strategy_desc: "도쿄 없이는 쿼드가 없고, 선택지 없이는 도쿄가 없습니다. 우리는 그들에게 선택지를 줄 것입니다. 조용히, 양자 차원에서, 미국인이 초대받지 못한 자리에서 말입니다."
 CHI_the_quiet_dragons: "고요한 용들"
 CHI_the_quiet_dragons_desc: "물속에서 소음은 곧 죽음이며, 우리 잠수함은 언제나 너무 일찍 탐지되었습니다. 차세대 095형 공격 잠수함은 정숙성을 중심으로 설계되어 펌프제트 추진과 더 조용한 원자로로 미국 사냥꾼 잠수함과의 격차를 좁힙니다. 고요한 용들은 마침내 도련을 빠져나가 적 항모를 그 자신의 바다에서 추적할 수 있습니다."
 CHI_the_rare_earth_lever: "희토류 지렛대"
 CHI_the_rare_earth_lever_desc: "세계 희토류의 대부분은 우리 손을 거쳐 흐릅니다. 모든 도요타 프리우스의 모터, 모든 F-35의 꼬리날개 조립체, 모든 아이폰의 스피커가 그렇습니다. 밸브를 돌릴 권한은 우리에게 있습니다."
 CHI_the_rcep_acceleration: "RCEP 가속화"
 CHI_the_rcep_acceleration_desc: "미국은 TPP에서 걸어 나갔습니다. 일본은 남았습니다. 역내포괄적경제동반자협정은 서명될 것이며, 도쿄는 워싱턴이 아니라 베이징 곁에 서서 서명할 것입니다."
 CHI_the_renhai_cruiser: "런하이급 순양함"
 CHI_the_renhai_cruiser_desc: "중국은 현대 최초의 진정한 주력함을 기공합니다. NATO가 순양함으로 분류하는 055형은 1만 톤급 스텔스 전투함으로, 백 개가 넘는 미사일 발사관을 갖추고 항모 전단을 이끌며 해상의 모든 것과 싸울 수 있도록 만들어졌습니다. 2022년까지 여덟 척이 완성되며, 이로써 해군은 세계 어느 나라에도 뒤지지 않는 수상 전투함을 보유하게 됩니다."
 CHI_The_Roh_Moohyun_Framework: "10.4 선언 부활"
 CHI_The_Roh_Moohyun_Framework_desc: "우리는 10월 4일 선언의 정신을 되살리고 북한에 대한 단계적 관여 구상을 지지할 것입니다. 공동 농업 사업, 제한적 관광, 통제된 국경 무역을 전제 조건 없이 추진할 수 있으며, 그 문을 열어 두는 쪽은 우리가 될 것입니다."
 CHI_The_Sansha_Administrative_Upgrade: "싼사 행정 격상"
 CHI_The_Sansha_Administrative_Upgrade_desc: "파라셀 제도 우디 섬에 시청을 둔 싼사시는 이제 스프래틀리 제도 전체로 관할권을 넓힙니다. 시장과 인구조사 사무소, 기상대가 정치적 위장막을 제공하는 민간적 틀은 의도된 것이며, 그 실질은 분쟁 중인 암초 영토를 우리 행정 질서에 영구히 편입하는 일입니다."
 CHI_The_Scarborough_Model: "스카버러 모델"
 CHI_The_Scarborough_Model_desc: "스카버러 암초에서의 대치는 우리에게 되풀이할 수 있는 방식을 주었습니다. 어선 조우가 해경 대치로 확대되고, 상대가 압박에 못 이겨 물러나며, 제3자가 개입하기 전에 영구적 주둔이 확립되는 것입니다. 우리는 이제 이 모델을 남은 모든 분쟁 지형에 체계적으로 적용할 것입니다."
 CHI_The_Sea_Within_The_Sea: "바다 속의 바다"
 CHI_The_Sea_Within_The_Sea_desc: "남중국해는 일본에서 필리핀을 거쳐 말레이시아까지 굽이치는 육지와 암초, 곧 제1도련선으로 사방이 둘러싸여 있으며, 누적된 군사적 주둔과 경제적 통합, 영토 결정을 거쳐 완전히 우리 행정 통제 안에 갇히게 되었습니다. 구단선은 더 이상 주장이 아니라 국경입니다. 세계 무역의 3분의 1을 실어 나르는 항로는 이제 우리가 법적으로도 실질적으로도 통치하는 해역을 지나며, 우리 해경과 해군은 파라셀 제도에서 스프래틀리 제도까지 끊임없이 주권 순찰을 수행합니다."
 CHI_the_securitate_restructured: "보안 기관 재편"
 CHI_the_securitate_restructured_desc: "충칭에서 왕리쥔이 도입한 혁신을 바탕으로 내부 보안 기관은 포괄적인 국가 보호 기구의 형태로 재편됩니다. 신호 정보, 정보원망, 법적 강제력이 단일 지휘 아래 통합됩니다. 인민 국가에 대한 어떤 음모도 발각을 피하지 못할 것입니다."
 CHI_the_self_reliant_path: "자력갱생의 길"
 CHI_the_self_reliant_path_desc: "수입한 엔진은 모두 목줄입니다. 우리는 자력갱생이라는 더 험한 길을 택하여 자체 설계국에 자원을 쏟아붓고 몇 해 동안 열세의 항공기를 감수함으로써, 다음 세대가 어떤 외국 공급자에게도 빚지지 않게 할 것입니다. 자기 날개를 만들지 못하는 공군은 결코 진정으로 자유로울 수 없습니다."
 CHI_the_senkaku_crisis: "센카쿠 위기"
 CHI_the_senkaku_crisis_desc: "우리는 수년 동안 일본의 방공망을 떠보고 일본 해상보안청 함정을 따라붙었습니다. 다음 도발은 부인할 수 없을 것입니다. 해경 경비정은 군함이 아닙니다. 군함이 되는 순간까지는 말입니다."
 CHI_The_Seoul_Gambit: "서울 승부수"
 CHI_The_Seoul_Gambit_desc: "우리는 평양에 대한 무기한의 약속보다 서울과의 더 깊은 관계가 더 오래가는 안보를 줄 수 있다는 계산된 도박을 합니다. 대한민국을 적대적 이웃이 아닌 전략적 파트너로 대하는 것은 수십 년간의 우리 대한반도 정책과의 단절이며, 가볍게 결정할 일이 아닙니다."
 CHI_the_shanghai_succession: "상하이 승계"
 CHI_the_shanghai_succession_desc: "장쩌민은 공식 지도권을 후진타오에게 넘기되, 상하이방 충성파가 정치국 상무위원회를 장악하도록 보장합니다. 그는 중앙군사위원회 주석직을 유지함으로써 새 지도부에 대한 궁극적 영향력을 보존하고, 태자당 네트워크에 유리한 파벌 균형을 굳힙니다. 권력은 넘겨졌지만 포기된 것은 아닙니다."
 CHI_the_shanghai_succession_tt: "§Y$CHI_factional_balance$§!(§Y$CHI_16_national_congress_mission$§! 시점)이 승계를 결정합니다. §Y$CHI_shanghai_clique_leaning$§! 이상이면 §Y후진타오§!에게, 그렇지 않으면 §Y쩡칭훙§!에게 돌아갑니다."
 CHI_the_sharp_blade: "예리한 칼날"
 CHI_the_sharp_blade_desc: "다음 전쟁은 몇 달이 아니라 몇 시간 만에 결판날 수 있습니다. 우리는 예리한 칼날을 택합니다. 경장비 공중기동 부대와 특수 부대가 먼저, 그리고 멀리 타격하여 방어자가 반응하기 전에 비행장과 항구, 수도를 장악합니다. 속도가 우리의 가장 무거운 무기가 됩니다."
 CHI_the_sharp_sword_doctrine: "예리한 검 교리"
 CHI_the_sharp_sword_doctrine_desc: "스텔스는 전투기만을 위한 것이 아닙니다. 전익기형 전투 드론인 GJ-11 '예리한 검'은 침투형 무인 타격 교리의 중심이 되어, 조종사를 위험에 빠뜨리지 않고 유인 함대보다 먼저 보내져 적의 방어망을 찾아 파괴합니다."
 CHI_the_soaring_dragon: "비룡"
 CHI_the_soaring_dragon_desc: "독특한 결합 날개를 지닌 고고도 장기체공 드론 WZ-7 '비룡'은 며칠이고 해상 접근로를 순찰하며, 중국이 장악하려는 바다에 대한 끊임없는 감시를 타격망에 제공합니다."
 CHI_the_sovremenny_bridge: "소브레멘니 가교"
 CHI_the_sovremenny_bridge_desc: "우리 조선소가 필요한 함선을 건조할 수 있을 때까지는 사서 씁니다. 1990년대 후반 러시아로부터 956E 및 956EM 계획의 소브레멘니급 구축함 네 척을 구입하며, 각 함은 미국 항모를 잡기 위해 만들어진 초음속 모스키트 대함 미사일로 무장했습니다. 이들은 국산 함대가 태어나는 동안 사들인 현대적 화력으로서 세월을 건너는 가교입니다."
 CHI_The_Spirit_Of_Zheng_He: "정화의 정신"
 CHI_The_Spirit_Of_Zheng_He_desc: "600년 전 정화 제독의 보물선단은 난징을 떠나 페르시아만과 동아프리카 해안에 이른 일곱 차례의 항해에 올랐습니다. 그들이 실은 것은 정복이 아니라 비단과 도자기, 그리고 문명적 교류의 규범이었습니다. 해상 실크로드는 그 전통의 현대적 계승자이며, 우리의 동남아시아 관여는 그 정신에 따라 이루어질 것입니다."
 CHI_the_surface_capital_fleet: "수상 주력 함대"
 CHI_the_surface_capital_fleet_desc: "보이지 않는 힘은 감명을 주지 못하며, 우리는 보이고자 합니다. 함대는 항모와 055형 순양함을 중심으로 균형 잡힌 전투단으로 편성되어 어떤 대양도 항해하고 어떤 바다에서도 조건을 강요할 수 있습니다. 먼 항구에서 깃발을 보이는 거대한 수상 함대는 중국이 해양 강국으로 도래했음을 보여 주는 가시적 증거입니다."
 CHI_the_tanker_gap: "공중급유기 격차 해소"
 CHI_the_tanker_gap_desc: "항속 거리는 공군의 가장 오래된 약점입니다. 급유기가 너무 적어 전투기가 본토에서 멀리 체공하지 못하므로, 우리는 공중급유 함대를 확충하여 타격 편대가 먼 바다까지 도달해 그곳에 머물 수 있게 합니다."
 CHI_The_THAAD_Response: "THAAD 대응"
 CHI_The_THAAD_Response_desc: "한국에 배치된 THAAD 미사일 방어 체계는 우리의 핵 억지력을 약화시킵니다. 우리는 경제적 압박으로 대응할 것입니다. 관광을 제한하고, 한국 연예 상품을 보이콧하며, 우리 영토에서 활동하는 한국 기업을 압박하여 서울이 자신의 환대를 재고하게 만드는 것입니다."
 CHI_the_three_represents: "삼개대표"
 CHI_the_three_represents_desc: "장쩌민이 당의 교리에 이론적으로 기여한 이 사상은 중국공산당이 선진 생산력, 선진 문화, 그리고 인민의 가장 광범위한 이익을 대표해야 한다고 규정합니다. 사영 기업가와 자본가의 입당을 허용함으로써 우리는 노동자와 농민을 넘어 통치의 사회적 기반을 넓히고, 당은 존속합니다."
 CHI_the_tokyo_communique: "도쿄 공동성명"
 CHI_the_tokyo_communique_desc: "오늘의 공동성명은 2008년 문서보다 적게 말하고 더 많은 의미를 담을 것입니다. 역사에 대한 상이한 관점이라는 표현은 이 문제를 다시는 입에 올리지 않겠다는 뜻의 외교적 공식입니다."
 CHI_The_Treasure_Fleet_Returns: "보물선단의 귀환"
 CHI_The_Treasure_Fleet_Returns_desc: "일대일로 구상은 해양 부문을 동남아시아 전역으로 확장합니다. 항만 이권과 어업 협정, 가스 플랫폼 합작 사업이 영유권 주장국들에 제안됩니다. 체결된 거래 하나하나는 상대국을 중국 경제권에 더욱 단단히 묶고 대결의 매력을 떨어뜨립니다."
 CHI_the_type_075_yushen: "075형 위선"
 CHI_the_type_075_yushen_desc: "해병대는 평평한 갑판의 기함을 얻습니다. 4만 톤급 헬기 강습함인 075형 위선은 여단 하나와 그 건십 헬기를 수평선 너머로 실어 나르고, 공중과 해상에서 동시에 상륙시킵니다. 이 함선은 해안에서 훨씬 먼 곳의 땅을 점령하고 지키기 위해 편성된 상륙 전단의 심장입니다."
 CHI_the_type_901: "901형과 지부티 생명선"
 CHI_the_type_901_desc: "원양 함대는 보급선에 따라 살고 죽습니다. 항모 전단과 보조를 맞출 만큼 크고 빠른 901형 고속 전투지원함은 함대가 본토에서 멀리 떨어진 바다에 머물 수 있게 해 주며, 2017년 중국은 지부티에 최초의 해외 기지를 열어 해군을 인도양에 붙박는 영구적 생명선을 마련합니다."
 CHI_the_varyag_refit: "바랴크 개장"
 CHI_the_varyag_refit_desc: "녹슨 소련제 선체가 항모 함대의 씨앗이 됩니다. 1998년 우크라이나에서 장비가 뜯긴 채로 사들여 2002년 다롄으로 예인된 미완성의 바랴크는 십 년에 걸쳐 재건되어 2012년 랴오닝으로 취역합니다. 이 함선은 군함이라기보다 훈련함이지만, 그 갑판 위에서 항모 전통이 없던 해군이 비행기 한 대 한 대씩 바다에서 이륙하는 법을 배웁니다."
 CHI_the_yasukuni_protest_doctrine: "야스쿠니 항의 독트린"
 CHI_the_yasukuni_protest_doctrine_desc: "일본 총리가 A급 전범의 이름 앞에 고개를 숙일 때, 그는 조상을 기리는 것이 아닙니다. 다음 전쟁을 연습하는 것입니다. 우리 대사는 추후 통보가 있을 때까지 베이징으로 귀국합니다."
 CHI_the_yuan_and_the_shang: "위안과 상"
 CHI_the_yuan_and_the_shang_desc: "잠수함 전력이 디젤 시대에서 걸어 나옵니다. 공기불요추진 디젤-전기 잠수함인 039형 위안은 근해에서 몇 주 동안 소리 없이 잠복할 수 있으며, 원자력 093형 상은 함대에 본토에서 멀리 활동할 수 있는 최초의 믿을 만한 공격 잠수함을 안겨 줍니다. 조용한 사냥꾼들이 해군의 가장 날카로운 칼날이 됩니다."
 CHI_the_yuzhao_pathfinders: "위자오 개척자들"
 CHI_the_yuzhao_pathfinders_desc: "상륙 전력 투사는 선체와 여단에서부터 시작됩니다. 2000년대에 설계된 071형 유자오급 상륙수송선거함(LPD)은 해군에 진정한 원양 작전용 상륙함을 제공했으며, 이를 탑재할 최초의 전용 해병여단들이 창설되었습니다. 미래 원정군의 개척자들이 마침내 바다로 나아갑니다."
 CHI_theaterization_of_command: "공군 전구 지휘 체제 도입"
 CHI_theaterization_of_command_desc: "항공기는 별도의 군종 지휘 계통이 아니라 전구에 복종해야 합니다. 공군 지휘부는 다섯 개의 합동 전구 사령부로 편입되어, 전투기와 폭격기, 드론이 지상군 및 해군과 같은 지휘관 아래에서 세 개가 아닌 하나의 작전으로 싸웁니다."
 CHI_three_gorges_completion: "싼샤 프로젝트 완공"
 CHI_three_gorges_completion_desc: "쑨원이 제안하고 마오쩌둥이 옹호한 창장의 싼샤 댐이 이제 완공되었습니다. 32기의 터빈으로 22.5GW의 수력 발전 용량을 생산하는 이 댐은 세계 최대의 발전소입니다. 이 사업으로 140만 명이 이주했고 고고학 유적 2천 곳이 수몰되었지만, 그 혜택은 분명합니다. 홍수 통제, 항행 개선, 그리고 중부와 서부 중국의 재생 에너지 생산량의 결정적 증가입니다."
 CHI_three_noc_overseas: "세 통의 석유, 해외로 나가다"
 CHI_three_noc_overseas_desc: "CNPC, 시노펙, CNOOC는 우리의 해외 진출 전략을 투사하는 세 통의 석유입니다. CNPC는 대나일 석유 운영 회사를 통해 수단에서 시추하고, 페트로카자흐스탄을 인수하며, 로스네프트와 250억 달러 규모의 석유 담보 대출 계약을 체결합니다. 시노펙은 애닥스 페트롤리엄을 인수하여 앙골라, 나이지리아, 쿠르디스탄 지역 전역의 생산 면허를 확보합니다. 유노칼 인수가 좌절되었던 CNOOC는 캐나다 넥슨 인수에 성공합니다. PDVSA 및 페트로브라스와도 비슷한 거래가 이어집니다. 모든 인수는 우리의 에너지 공급을 지탱하는 사슬의 한 마디입니다."
 CHI_three_red_lines_crackdown: "부동산 금융 단속"
 CHI_three_red_lines_crackdown_desc: "규제 당국은 부동산 개발업체에 세 가지 엄격한 비율 한도를 부과합니다. 자산 대비 부채 70퍼센트 미만, 자기자본 대비 순부채 100퍼센트 미만, 단기 부채 대비 현금 100퍼센트 초과입니다. 총부채가 3천억 달러를 넘는 헝다는 세 가지를 모두 위반하고 붕괴하여 홍콩 법원에 의해 청산됩니다. 상위 30대 개발업체의 70퍼센트 이상이 구조조정에 들어갑니다. 이 정책은 건설 활동과 지방 정부 수입이 급감하는 대가를 치르고 은행 부문으로부터 시스템 금융 위험을 격리합니다. 대가는 크지만, 그렇지 않았다면 통제할 수 없는 전염이 닥쳤을 것입니다."
 CHI_three_represents_codified: "삼개대표 명문화"
 CHI_three_represents_codified_desc: "사영 기업가가 당에 입당합니다. 상하이 개정안은 헌법에 자리를 잡습니다. 장쩌민의 유산이 문서로 봉인됩니다."
 CHI_tiangong_station: "톈궁 우주정거장"
 CHI_tiangong_station_desc: "톈궁 우주정거장의 톈허 핵심 모듈이 2021년 4월에 발사되었고, 2022년에 원톈과 멍톈 과학 실험 모듈이 뒤를 이었습니다. 중국은 이제 국제우주정거장과 완전히 독립된 상설 유인 궤도 실험실을 운영하며, 6개월 단위로 상주하는 승무원과 확대되는 미세중력 연구 프로그램을 수용하고 있습니다."
 CHI_tianwen_interplanetary: "톈원 행성 탐사선"
 CHI_tianwen_interplanetary_desc: "톈원 1호는 2020년 7월에 발사되어 단일 임무로 궤도 진입, 대기권 진입, 지표면 착륙을 달성했고 2021년 5월 쭈룽 탐사차를 유토피아 평원에 내려놓았습니다. 중국은 화성에서 탐사차를 성공적으로 운용한 두 번째 국가가 되었습니다. 이 임무는 심우주 항법, 자율 위험 회피, 고이득 통신 중계를 입증했으며, 모두 지구-달 권역 너머의 유인 임무를 위한 필수적인 선행 기술입니다."
 CHI_Tianxia_Realized: "천하"
 CHI_Tianxia_Realized_desc: "다보스에서 우리는 다자 기구와 공동 번영에 뿌리를 둔 개방적이고 포용적인 세계 질서, 곧 인류 운명 공동체의 비전을 밝혔습니다. 그 비전은 이제 강압이 아니라 누적된 경제적 중력을 통해 실현되었습니다. 글로벌 발전 이니셔티브와 아시아인프라투자은행, 고품질 일대일로 협력은 이해관계를 통해 우리의 중심성을 인정하는 틀 안으로 국제사회를 끌어들였습니다. 우리가 지금 이끄는 세계는 스스로 따르기를 택했습니다."
 CHI_tiger_and_flies: "호랑이와 파리"
 CHI_tiger_and_flies_desc: "반부패 운동은 당 기구 전반의 고위 호랑이와 하급 파리를 모두 겨냥합니다. 전 정치국 상무위원 저우융캉은 무기징역을 선고받았고 보시라이는 그보다 먼저 몰락했습니다. 이제까지 200만 명이 넘는 관료가 조사받고 처벌받았습니다. 이 운동은 진정한 통치 개혁인 동시에 경쟁하는 정치 세력망을 해체하는 수단이며, 우리는 지금 이를 멈출 여유가 없습니다."
 CHI_Tonga_Tuna_Concession: "태평양 어업 이권"
 CHI_Tonga_Tuna_Concession_desc: "통가, 바누아투, 피지와 맺은 독점 접근 협정은 우리의 원양 어선단에 중부 및 서부 태평양의 광대한 배타적 경제수역에서 우선권을 부여합니다. 그 대가로 우리는 항만 개선, 냉동 시설, 해상 감시 역량에 자금을 대어 수혜국 정부를 장기적인 인프라 의존에 묶어 둡니다. 어업 협정은 우리의 더 넓은 태평양 관여에서 경제적 선봉입니다."
 CHI_train_as_you_fight: "싸우는 대로 훈련하라"
 CHI_train_as_you_fight_desc: "연병장의 제식 훈련은 열병식에서 이길 뿐 전쟁에서 이기지 못합니다. 훈련은 현실적인 전투 조건을 중심으로 재편되며, 주르허 훈련 기지에서 자유 대항 훈련과 전담 가상 적군이 과거의 각본 속 승리를 응징합니다."
 CHI_train_generals: "장군 육성"
 CHI_train_generals_desc: "종이 위의 개혁은 그것을 이해하는 지휘관이 없으면 죽습니다. 우리 사관학교는 합동전과 정보화 시대의 지휘에 능숙한 장교를 양성하도록 개편되고, 현대전을 읽지 못하는 정치적 임명자는 걸러 냅니다."
 CHI_TwentyFive_Year_Iran_Accord: "25년 중국-이란 파트너십"
 CHI_TwentyFive_Year_Iran_Accord_desc: "우리의 포괄적 전략 동반자 관계는 할인된 석유 공급을 대가로 25년에 걸쳐 이란의 인프라, 에너지, 제조업에 4천억 달러를 투자하도록 우리를 구속합니다. 이 협정은 테헤란에 미국의 제재 속 생명선을 주고, 우리에게는 할인된 탄화수소와 페르시아만의 전진 거점을 줍니다. 워싱턴과 텔아비브, 걸프 군주국들은 이 협정을 자신들의 지역 안보 셈법에 대한 직접적 위협으로 봅니다. 그러라고 하십시오."
 CHI_two_centeraries: "제19차 당대회"
 CHI_two_centeraries_desc: "제19차 전국대표대회는 '신시대 중국 특색 사회주의에 대한 시진핑 사상'을 시진핑이 생존해 있는 동안 당헌에 새기는데, 이는 마지막으로 마오쩌둥에게만 허용되었던 영예입니다. 두 개의 100년 목표는 우리의 지평을 규정합니다. 2021년까지 샤오캉 사회, 2049년까지 완전한 선진 사회주의 국가입니다. 앞으로 30년간 국가의 궤적이 이제 정해졌으며, 모든 기관의 자원은 그에 맞게 투입되어야 합니다."
 CHI_two_establishments: "두 개의 확립"
 CHI_two_establishments_desc: "'두 개의 확립' 교리는 당 중앙위원회 내 시진핑 동지의 핵심 지위와 당 생활에서 시진핑 사상의 지도적 역할을 확인합니다. 집단 지도 체제는 폐지되지 않고 재정의됩니다. 상무위원회는 심의하지만 방향은 한 사람이 정합니다. 당은 하나의 몸으로 움직이며, 그 몸에는 중심이 있습니다."
 CHI_two_ocean_fleet: "양대양 함대"
 CHI_two_ocean_fleet_desc: "중국이 이제 의도하는 바에는 심해만으로도, 갑판만으로도 충분하지 않습니다. 우리는 고요한 잠수함 전력과 당당한 수상 함대를 하나의 해군으로 융합하여 태평양과 인도양이라는 두 대양에서 동시에 싸울 수 있게 하고, 근해를 지키면서 원해를 누빕니다. 류화칭이 물려받은 연안 경비대에서 하나를 제외하면 누구에도 뒤지지 않고, 그 하나마저 따라잡고 있는 진정한 원양 해군이 탄생합니다."
 CHI_two_reaffirmations: "두 개의 재확인"
 CHI_two_reaffirmations_desc: "당은 두 가지 근본적 약속을 재확인합니다. 마오쩌둥 사상이 규정한 사회주의 노선에 대한 충성, 그리고 당 지도의 올바른 방법으로서 대중노선의 우위입니다. 이것들은 구호가 아닙니다. 불평등과 부패가 혁명을 안에서부터 속 빈 강정으로 만들도록 허용한 우경화에 맞서는 구조적 보장입니다."
 CHI_type_15_light_tank: "15식 경전차"
 CHI_type_15_light_tank_desc: "중장갑은 티베트 고원에서 숨을 쉬지 못하고 남부의 교량도 건너지 못합니다. 30톤급 경전차 ZTQ-15는 강력한 105mm 포를 탑재하여 99식이 갈 수 없는 곳에서 기동 여단에 진정한 장갑 전력을 부여하며, 지금은 히말라야 국경을 따라 인도를 노려보고 있습니다."
 CHI_type_95_adoption: "95식 채택"
 CHI_type_95_adoption_desc: "1990년대 후반 채택된 5.8mm 불펍식 소총 QBZ-95는 노후한 81식을 전 전선에서 교체하고 보병을 자국산 탄약으로 표준화합니다. 결함이 실제로 있기는 하지만, 모든 병사의 손에 현대적인 국산 소총을 쥐여 줍니다."
 CHI_ultra_low_emission: "초저배출 기준"
 CHI_ultra_low_emission_desc: "생태환경부와 공업정보화부는 소결 공장, 코크스 시설, 제철소가 유럽 기준보다 엄격한 배출 한계치를 충족하도록 요구하는 기준을 발표했습니다. 대형 일관 제철소의 80퍼센트 이상이 설비 개조를 마무리하고 있습니다. 이 개혁은 APEC 블루, 열병식 블루처럼 정치적 행사 때마다 일괄 가동 중단을 하던 관행을 상시적인 청정 대기 기반 시설로 대체합니다. 우리는 더 이상 행사를 위해 하늘을 치워서는 안 됩니다. 하늘을 깨끗하게 유지해야 합니다."
 CHI_underground_great_wall: "지하 장성"
 CHI_underground_great_wall_desc: "우리는 산 아래에 지하 장성을 팝니다. 우리 병력과 미사일을 숨기고 보호하는 수천 킬로미터의 강화 갱도입니다. 찾을 수 없는 것은 파괴할 수 없으며, 땅속에 묻힌 무기고는 어떤 선제공격에도 반드시 응징이 따르도록 보장합니다."
 CHI_undersea_supremacy: "해저 우위"
 CHI_undersea_supremacy_desc: "우리는 수면이 아니라 심해를 지배할 것입니다. 함대의 우선순위는 잠수함이 됩니다. 항모를 잡는 원자력 사냥꾼, 세계를 위협 아래 붙들어 두는 탄도탄 잠수함, 제1도련선을 덫으로 바꾸는 조용한 잠수함의 장벽입니다. 경쟁자들이 위에서 거대한 함대를 과시하게 두십시오. 우리는 돛대 하나 드러내지 않고 그 아래의 물을 차지하여 그들에게서 바다를 박탈할 것입니다."
 CHI_Unification_Ultimatum: "한반도 통일 최후통첩"
 CHI_Unification_Ultimatum_desc: "베이징과 워싱턴이 보조를 맞춘 지금, 평양에 선택을 제시할 때가 왔습니다. 서울 주도의 평화적 재통일을 받아들이든가, 중국과 미국, 한국 군대의 연합 무력에 직면하든가입니다. 이 최후통첩은 어떤 식으로든 한반도 문제를 끝낼 것입니다."
 CHI_Vision_2030_Partnership: "비전 2030 투자 파트너십"
 CHI_Vision_2030_Partnership_desc: "사우디아라비아의 비전 2030 다변화 의제와 걸프 자본 및 계약 사업에 대한 우리의 열망이 청정 에너지, 관광 인프라, 첨단 제조업을 아우르는 방대한 파트너십으로 맞물립니다. 우리 기업들은 네옴과 홍해 프로젝트의 대형 계약을 따내는 한편 우리는 우대된 원유 공급과 확대되는 위안화 결제 비중을 확보합니다. 이 합의는 리야드가 워싱턴에 대한 안보 의존을 공식적으로 끊지 않으면서도 전략적 선택지를 갖게 해 줍니다."
 CHI_wanhua_strategic_materials: "전략 소재 목록"
 CHI_wanhua_strategic_materials_desc: "공업정보화부는 우리가 여전히 수입에 의존하는 약 130종의 화학 소재 목록을 발표했습니다. 리소그래피 포토레지스트, 폴리이미드 필름, T800 이상의 고강도 탄소 섬유, MDI와 TDI 폴리우레탄이 가장 중요한 소재에 속합니다. 미쓰이의 MDI 기술을 역설계하고 헝가리의 보르소드켐을 인수한 옌타이의 완화화학은 바이엘, BASF, 헌츠먼의 폴리우레탄 과점을 깼습니다. 웨이하이 광웨이 복합재료, 지린 탄소 계곡, 시노펙 상하이 석유화학은 풍력 터빈 날개와 항공우주 복합재료용 탄소 섬유 생산 능력을 구축합니다. 대체가 하나 이루어질 때마다 외국 수출 통제에 대한 우리의 구조적 노출이 줄어듭니다."
 CHI_warlord_temptation: "군벌의 유혹"
 CHI_warlord_temptation_desc: "돈에 봉사하는 군대는 스스로에게 봉사하고 싶은 유혹을 받을 수 있습니다. 지역과 수입, 충성스러운 병력을 손에 쥔 대지휘관들은 중국에서 가장 오래된 위험, 곧 중앙보다 자기 장군에게 먼저 복종하는 군대와 군벌 시대로 되돌아가는 공화국 쪽으로 기웁니다."
 CHI_water_security_initiative: "국가 물 안보 구상"
 CHI_water_security_initiative_desc: "중국의 남북 물 불균형은 2002년부터 남수북조 프로젝트를 통해 대응해 왔으며, 이는 지금까지 건설된 최대의 유역 간 물 이송 사업으로 창장 유역의 물을 메마른 황허 유역과 수도권으로 보냅니다. 국가 물 안보 추진 계획은 이 토대를 확장하여 대규모 인프라 건설을 북부에서 물 부족이 가장 심각한 지역을 겨냥한 성 단위 절수 사업과 결합합니다. 이러한 사업을 충분히 완료하면 국가 경제를 짓누르는 물 부족이 점차 완화될 것입니다."
 CHI_weqi_pipeline_lines: "서부-동부 가스관"
 CHI_weqi_pipeline_lines_desc: "서부-동부 가스 수송 프로젝트는 신장의 타림 분지를 4,000킬로미터의 간선으로 상하이와 연결하며, 호르고스를 거쳐 투르크멘 가스를 동쪽으로 실어 오는 제2선과 키르기스스탄을 경유하는 투르크메니스탄발 제3선이 뒤를 잇습니다. 블라디미르 푸틴과 연간 380억 입방미터, 30년 계약으로 합의된 시베리아의 힘 가스관은 이제 헤이룽장에서 우리 동부 전력망으로 가스를 직접 공급합니다. CNPC와 페트로차이나가 전 구간의 건설과 운영을 맡습니다. 이 가스관 기반 시설을 장악한 나라는 에너지 금수로 목이 졸리지 않습니다."
 CHI_west_east_gas_pipeline: "서부-동부 가스관"
 CHI_west_east_gas_pipeline_desc: "서부-동부 가스관은 신장의 타림 분지에서 상하이까지 4,000킬로미터에 걸쳐 뻗어 있으며 2004년에 완공되었습니다. 중국의 산업 동부에 천연가스를 공급하여 석탄 의존도를 줄이고 신장 탄화수소 매장량의 상업화를 앞당깁니다."
 CHI_western_development_strategy: "서부 대개발 전략"
 CHI_western_development_strategy_desc: "시부 다카이파 프로그램은 우대 투자와 세제 혜택, 가속화된 인프라 건설을 서부 열두 개 성과 자치구에 집중시킵니다. 우리는 연안과 내륙의 격차를 좁히고 중앙아시아 및 남아시아와의 통합을 심화하며, 경쟁자들이 그 공간을 메우기 전에 변방을 우리 경제의 핵심으로 끌어들입니다."
 CHI_western_energy_strategy: "서부 에너지 개발"
 CHI_western_energy_strategy_desc: "중국 서부의 성들에는 나라에서 가장 큰 석탄, 천연가스, 수력 자원이 매장되어 있습니다. 조율된 개발 전략은 채굴을 연안 산업 중심지와 연결하여 에너지 수입 의존도를 줄이고 경제 활동을 내륙으로 확장합니다."
 CHI_western_industrial_drive: "서부 산업 개발 추진"
 CHI_western_industrial_drive_desc: "국무원은 지방 산업단지 169곳을 국가급 경제기술개발구로 승격하도록 승인했으며, 다수는 저개발 서부 성에 배정됩니다. 윈난, 구이저우, 쓰촨 서부에 대한 우선 투자는 연안과의 소득 격차를 좁히고 대규모 내륙 제조업을 위한 물류 전제 조건을 마련하기 시작했습니다. 서부는 충분히 오래 기다렸습니다."
 CHI_western_institutional_engagement: "서방 기구 관여"
 CHI_western_institutional_engagement_desc: "쩡칭훙은 규칙이 아직 만들어지는 동안 국제 질서에서 우리 입지를 확보하는 최선의 방법으로 서방이 이끄는 다자 기구와의 관여 심화를 주창합니다. 우리는 IMF 지분 확대를 추진하고, 국유 기업에 국제회계기준을 도입하며, 세계은행 이사회에서의 대표성을 높입니다. 밖에 서 있기보다 안에서 구조를 만드는 편이 낫습니다."
 CHI_western_pipeline_corridor: "서부-동부 가스관"
 CHI_western_pipeline_corridor_desc: "서부-동부 가스관은 신장의 타림 분지에서 간쑤, 산시, 창장 삼각주를 거쳐 상하이까지 4,000킬로미터에 걸쳐 뻗어 있습니다. 완공되면 창장 삼각주 산업의 석탄을 대체하고 가장 부유한 연안 도시들을 숨 막히게 하는 미세먼지 오염을 줄여, 서부의 자원을 동부의 성장에 결합할 것입니다."
 CHI_Win_Win_Cooperation: "운명 공동체"
 CHI_Win_Win_Cooperation_desc: "부채 함정 금융에 대한 국제적 비판이 거세지자 우리는 대출 조건을 개혁하여 양허성 금리, 현지 노동 요건, 부채 지속 가능성 평가를 도입합니다. \\"상생\\"이라는 틀은 일대일로를 전략적 지렛대가 아니라 상호 발전의 수단으로 재규정하며, 비판자들은 자신들의 논거를 유지하기가 더 어려워졌음을 깨닫습니다."
 CHI_Wolf_Warrior_Diplomacy: "전랑 외교"
 CHI_Wolf_Warrior_Diplomacy_desc: "우리는 단호하고 대결적인 외교 노선을 택할 것입니다. 우리 외교관들은 우리의 이익을 공격적으로 방어하고 서방의 서사를 어디서든 맞받아칠 것입니다. 목표는 분명합니다. 미국을 대체하여 세계를 지배하는 강대국이 되는 것입니다."
 CHI_wolf_warrior_doctrine: "전랑 외교"
 CHI_wolf_warrior_doctrine_desc: "우리 외교부에서 새롭고 단호한 외교 방식이 등장했습니다. 우리 대사들은 외국 비판자들을 공개적으로 공격하고, 대변인들은 비난에 위선과 악의라는 맞비난으로 응수합니다. 이 방식은 힘을 숨기고 때를 기다린다는 덩샤오핑의 도광양회 노선을 버리고 정면 대결을 택합니다. 우리는 더 이상 사과하지 않으며, 세계는 그것이 무엇을 의미하는지 이해하기 시작했습니다."
 CHI_ws15_bottleneck_solve: "WS-15 병목 해소"
 CHI_ws15_bottleneck_solve_desc: "제트 엔진은 모든 중국 전투기가 부딪혀 좌절한 벽이며, 우리 최고의 기체조차 러시아 터빈에 의존하게 만들었습니다. WS-15 터보팬은 그 의존을 끝내고 J-20에 설계 의도대로의 초음속 순항 추력을 부여하기 위한 것입니다. 단결정 터빈 블레이드를 숙달하는 것이 등정의 마지막 1미터입니다."
 CHI_wto_accession_drive: "WTO 가입 추진"
 CHI_wto_accession_drive_desc: "15년에 걸친 협상 끝에 우리는 세계무역기구 정식 가입을 눈앞에 두고 있습니다. 가입은 우리의 무역 자유화 개혁을 고착시키고, 외국 시장을 우리 수출에 개방하며, 산업 기술이 우리 손으로 이전되는 속도를 높일 것입니다."
 CHI_wto_commercial_bank_reform: "WTO 상업은행법 개혁"
 CHI_wto_commercial_bank_reform_desc: "WTO 가입은 우리에게 금융 부문을 외국 은행에 개방하도록 약속하게 하며, 주룽지 총리는 그 기한이 닥치기 전에 3단계 구조조정을 개시했습니다. 자산관리회사는 수천억 규모의 부실 채권을 흡수하고, 중앙후이진투자는 외환 보유액으로 자본을 주입하며, 4대 은행은 시장 규율을 부과하기 위해 해외 거래소에 상장합니다. 상업은행법 개정은 4대 은행을 정치적 신용 수단에서 형식상 상업 기관으로 탈바꿈시키며, 외국 은행이 경쟁하러 들어올 때 이 구분은 중요해질 것입니다."
 CHI_wto_implementation: "WTO 이행"
 CHI_wto_implementation_desc: "WTO 가입은 우리에게 관세 인하, 지식재산권 개혁, 서비스 부문 개방, 국가 무역 특권 폐지의 다년간 일정을 약속하게 했습니다. 이행은 고르지 못했고 분쟁해결기구에서 교역 상대국들의 이의 제기를 자주 받았지만, 이 과정은 우리를 세계 공급망에 깊이 통합시켰으며 그 통합은 의무인 만큼 무기이기도 합니다."
 CHI_wto_implementation_tt: "§Y$CHI_wto_accession_drive$§!를 완료하면 보너스가 더 좋아지고 영구적이 됩니다. "
 CHI_wuhan_automotive_hub: "우한 자동차 중심지"
 CHI_wuhan_automotive_hub_desc: "우한에 본사를 둔 둥펑 자동차는 푸조-시트로엥, 닛산, 혼다와의 합작 사업을 확장합니다. 우한은 중부 중국의 자동차 수도가 되어 창장을 따라 부품 공급업체와 물류 기업 집적지의 중심을 이룹니다."
 CHI_xi_jinping_thought_enshrined: "시진핑 사상 헌법 명기"
 CHI_xi_jinping_thought_enshrined_desc: "시진핑 사상은 정책 지침에서 헌법적 교리로 격상되어 전국의 대학과 군사 학교, 당 학교에서 의무적으로 학습됩니다. 쉐시창궈 앱이 수억 대의 휴대전화에 설치되어 일일 이용도가 감시됩니다. 이견은 이제 단지 환영받지 못하는 데 그치지 않고 공식적으로 확립된 진리로부터의 일탈입니다. 국가의 이념적 구조와 한 사람의 이름은 더 이상 분리할 수 없습니다."
 CHI_xinjiang_industrial_zones: "신장 산업 개발"
 CHI_xinjiang_industrial_zones_desc: "우루무치와 타림 분지의 특별 산업 구역은 한족 이주, 가공 산업, 자원 채굴 투자를 끌어들입니다. 이 구역은 신장 경제를 동부 산업 기반에 묶고 전통 농업에 대한 의존을 줄이도록 설계되었습니다."
 CHI_y20_strategic_lift_program: "Y-20 전략 수송 계획"
 CHI_y20_strategic_lift_program_desc: "강대국은 스스로를 움직일 수 있어야 합니다. 2016년부터 취역한 대형 제트 수송기 Y-20 '쿤펑'은 마침내 중국에 대륙 간에 병력과 장갑 전력, 원조를 전개할 공수 능력을 부여하며, 급유기형과 지휘기형은 공군 전체의 작전 반경을 배가합니다."
 CHI_Yangtze_confederation: "창장 경제 연합"
 CHI_Yangtze_confederation_desc: "충칭에서 후베이와 후난을 거쳐 상하이의 하구에 이르는 창장 유역은 중국의 산업 중심지를 품고 있습니다. 이들 성의 공식 경제 연합이 조율된 계획 아래 중복 투자를 없애고 공급망을 통합하며, 나라에서 가장 생산적인 회랑 전역에 충칭 모델을 투사할 것입니다."
 CHI_yangtze_delta_integration: "창장 삼각주 통합"
 CHI_yangtze_delta_integration_desc: "상하이, 장쑤, 저장에 걸친 조율된 국가 투자는 창장 삼각주를 우리의 으뜸가는 제조 및 수출 회랑으로 심화시킵니다. 이곳에 집중된 외국 자본과 숙련 노동력은 앞으로 10년의 성장을 떠받칠 것입니다."
 CHI_yangtze_logistics_corridor: "창장 물류 회랑"
 CHI_yangtze_logistics_corridor_desc: "창장은 세계의 어떤 내륙 수로보다 많은 화물을 처리합니다. 항만 인프라, 항행 개선, 복합 운송 터미널에 대한 투자는 이 강을 국가 공급망에 통합하여 도로 운송 비용의 몇 분의 일로 쓰촨과 상하이를 연결합니다."
 CHI_yj12_standoff_family: "YJ-12 원거리 타격 계열"
 CHI_yj12_standoff_family_desc: "YJ-12는 우리 항공기에 대부분의 방어 수단이 대응하기에는 너무 빨리 접근하는 초음속 해면 밀착 비행 대함 미사일을 안겨 줍니다. 폭격기와 전투기 아래에 매달린 이 미사일은 중국 해안에서 수백 킬로미터 이내의 모든 군함을 위험에 빠뜨립니다."
 CHI_youth_league_pipeline: "공청단 인재 파이프라인"
 CHI_youth_league_pipeline_desc: "공산주의청년단은 후진타오 계파의 주된 인재 풀입니다. 공청단 출신은 성 서기직의 과반을 차지하고 중앙 부처 중간 간부직을 지배하여, 공통된 조직 경험으로 묶인 전국적 관료망을 이룹니다. 그 계단을 오르는 이들은 모두 같은 체제에 승진을 빚지고 있습니다."
 CHI_yuan_internationalisation: "위안화 국제화"
 CHI_yuan_internationalisation_desc: "글로벌 금융 위기는 달러의 취약성을 드러내어 우리에게 기회를 주었습니다. 수십 개 중앙은행과의 양자 통화 스와프 협정, 홍콩과 싱가포르의 역외 위안화 청산 센터, 딤섬 채권 시장은 우리 런민비에 최초의 의미 있는 국제 유통을 가져다주었습니다. 달러의 기축통화 프리미엄은 영원히 살아남지 못할 것입니다."
 CHI_yuanhua_model: "위안화 모델"
 CHI_yuanhua_model_desc: "라이창싱은 일이 어떻게 이루어지는지 보여 주었습니다. 1990년대 내내 샤먼에서 그의 위안화 제국은 약 100억 달러어치의 석유, 자동차, 담배를 밀수했으며, 세관이 조여 올 때마다 유력한 고위 인사가 나타나 그들을 물러나게 했습니다. 우리는 그의 방식을 하나의 체제로 만듭니다. 군이 밀수업자를 비호하고, 밀수업자는 군에 돈을 바칩니다."
 CHI_yuzhao_hull_coral_brigades: "위자오 선체와 산호 여단"
 CHI_yuzhao_hull_coral_brigades_desc: "상륙전의 야망이 개척자 단계에서 함대 단계로 넘어갑니다. 071형은 연속 생산에 들어가고, 해병대는 두 개 여단에서 여섯 개 여단으로 불어나 남중국해의 분쟁 중인 암초와 섬에서 싸우도록 훈련됩니다. 선체와 산호 여단은 함께 자라나 해안선을 점령할 수 있는 전력이 됩니다."
 CHI_zb108_wheeled_family: "08식 차륜 계열"
 CHI_zb108_wheeled_family_desc: "보병 수송차에서 강습포, 구급차에 이르는 8x8 08식 계열은 중간급 여단에 도로에서 빠르고 운영비가 싼 단일 차륜 차체를 제공하며, 중국 신속 전개군의 기동 핵심입니다."
 CHI_zbd04_apex_ifv: "ZBD-04A 정점 보병전투차"
 CHI_zbd04_apex_ifv_desc: "ZBD-04A는 100mm 포 발사기와 30mm 기관포, 그리고 장갑 아래 완편 분대를 싣는 육군 최고의 궤도식 보병전투차입니다. 중기계화 여단의 근간이며 중-인 국경선에서 99식의 짝입니다."
 CHI_zbd_mechanisation: "ZBD 기계화"
 CHI_zbd_mechanisation_desc: "보병은 기갑을 따라가야 합니다. 궤도식 ZBD 전투차 계열은 소총수를 장갑 아래 전방으로 실어 나르고 전차와 나란히 싸우며, 중여단의 기계화를 완성합니다."
 CHI_zeng_qinghong_reign: "쩡칭훙 시대"
 CHI_zeng_qinghong_reign_desc: "상하이방의 선도적 전략가인 쩡칭훙은 부주석이자 중앙당교 교장을 맡고 있습니다. 조직부와 중앙서기처에 대한 그의 통제력은 당-국가 기구의 모든 단계에서 인사 임명에 결정적 영향력을 부여합니다. 그가 앉힌 사람들은 곧 그의 사람입니다."
 CHI_zero_hour: "제로 아워"
 CHI_zero_hour_desc: "수년 동안 군은 훈련하고 재무장하며 기다렸고, 이제 그 모든 것을 쓸 시간이 왔습니다. 우리 보병은 어떤 방어선도 흡수할 수 없는 규모로 진격하고, 기갑 종대는 돌릴 수 없을 만큼 깊은 대형으로 나아가며, 전략 로켓군은 우리가 결코 입에 올리지 않기를 바라는 논거로서 지하 격납고에서 대기합니다. 이 시각부터 인민해방군은 다음 전쟁을 준비하기를 멈추고 오히려 그것을 예상하기 시작하며, 모든 지휘는 마침내 하나의 의지에 응답합니다."
 CHI_ztz96_mainstreaming: "96식 주력화"
 CHI_ztz96_mainstreaming_desc: "모든 여단에 값비싼 99식이 필요한 것은 아닙니다. 더 저렴하고 가벼운 ZTZ-96은 대량 생산되어 96A와 96B로 꾸준히 개량되며, 기갑 전력의 몸통을 채우는 주력 전차가 됩니다."
 CHI_ztz99_rollout: "99식 배치"
 CHI_ztz99_rollout_desc: "ZTZ-99는 복합 장갑과 125mm 포, 레이저 방어 체계를 갖춘 3세대 주력전차로 중여단의 선봉이 됩니다. 서방과 러시아의 최고 전차와 대등하게 맞서도록 만들어진 최초의 중국 전차입니다."
 CHI_ztz99a_apex: "99A식 정점"
 CHI_ztz99a_apex_desc: "2011년부터 배치된 ZTZ-99A는 이 계열의 정점으로, 더 두꺼운 장갑과 강화된 엔진, 헌터-킬러 조준경, 그리고 여단 네트워크의 한 결절점이 되게 하는 완전한 전투 관리 체계를 갖췄습니다. 육군이 내지를 수 있는 가장 무거운 주먹입니다."
 arctic_observer_status: "북극 옵서버 지위"
 arctic_observer_status_desc: "북극이사회의 의석과 극지 실크로드 인프라는 고위도 북쪽에 새로운 항로와 자원 개척지를 열어 줍니다."
 CHI_610_directive_active: "610 동북 지침"
 CHI_610_directive_active_desc: "중국공산당 동북 사령부가 비상 동원 절차를 발동했습니다. 압록강을 따라 보안 병력이 증강되었고, 성 당국은 확대된 비상 권한 아래 운영됩니다."
 CHI_aiib_dividend_member: "AIIB 배당 회원국"
 CHI_aiib_dividend_member_desc: "아시아인프라투자은행의 창립 회원국 자격은 꾸준한 수익을 안겨 줍니다. 투자 배당금과 중국이 자금을 댄 사업에서의 우대 무역 조건이 우리의 재무 상태를 강화합니다."
 CHI_anti_corruption_purge: "반부패 숙청"
 CHI_anti_corruption_purge_desc: "중앙기율검사위원회는 매년 수천 건의 사건을 처리합니다. 조달, 건설, 국유 기업 경영 내의 부정이 폭로되고 처벌받습니다. 모든 계약에서 지대를 챙기던 관리들은 정치적 셈법이 바뀌었음을 깨닫습니다. 후원 관계망이 해체되고 직접적인 책임성으로 대체됨에 따라 국가 기능당 산출량이 증가합니다."
 CHI_anti_terror_crackdown_idea: "대테러 단속"
 CHI_anti_terror_crackdown_idea_desc: "보안 기관은 테러 조직망을 겨냥한 전국적 작전을 수행하고 있습니다. 탐지 능력이 높아지는 대신 정치적 여력은 단속에 흡수됩니다."
 CHI_army_reorganisation_disruption_idea: "육군 재편"
 CHI_army_reorganisation_disruption_idea_desc: "13개 집단군은 번호가 새로 매겨지고 합동병과 여단을 중심으로 재건됩니다. 개편이 진행되는 동안 조직도와 공격력이 저하되고 훈련이 밀립니다. 새 구조가 자리 잡으면 지상군은 전보다 더 날렵하고 유능해져서 모습을 드러냅니다."
 CHI_asian_century_concord_idea: "아시아 세기 협약"
 CHI_asian_century_concord_idea_desc: "베이징과 뉴델리는 지역 및 세계 문제에서 조율하기로 합의했으며, 21세기를 아시아가 함께 빚어 갈 시대로 규정합니다."
 CHI_ban_strategic_partnership: "베이징과의 전략적 동반자 관계"
 CHI_ban_strategic_partnership_desc: "방글라데시는 다자 포럼에서 자국의 외교 노선을 중국과 일치시킵니다."
 CHI_banking_modernised_idea: "재자본화된 은행 부문"
 CHI_banking_modernised_idea_desc: "국유 은행들은 부실 채권을 정리하고 외국인 소수 주주와 함께 홍콩 거래소에 상장되었습니다. 국제 회계 기준, 외부 감사, 시장 규율이 이 부문의 효율성과 신뢰도를 높입니다."
 CHI_beidou_global_constellation: "베이더우 전 지구 위성군"
 CHI_beidou_global_constellation_desc: "라틴아메리카 전역에 지상국이 배치되면서 베이더우 위성망은 이제 전 지구를 포괄적으로 커버합니다. 해군 작전, 정찰, 방첩 활동 모두가 그 정밀도와 도달 범위의 혜택을 봅니다."
 CHI_beijing_communique_guarantor: "베이징 공동성명 보증국"
 CHI_beijing_communique_guarantor_desc: "역내 경쟁국 두 나라 사이의 평화를 중재한 중국의 역할은 책임 있는 강대국으로서의 입지를 높였습니다. 외교적 자산이 자유롭게 흐르고 관계를 유지하기가 수월해집니다."
 CHI_blue_national_soil: "푸른 국토"
 CHI_blue_national_soil_desc: "구단선 안쪽의 해역을 \\"푸른 국토\\"로 규정하는 중화인민공화국의 공식 교리입니다. 이는 육지의 어느 성과 다름없이 양도할 수 없는 해양 영토라는 뜻입니다. 이러한 틀은 양보를 정치적으로 불가능하게 만들고 모든 외국의 존재를 무단 침입으로 재규정합니다."
 CHI_blue_national_soil_militarised: "군사화된 푸른 국토"
 CHI_blue_national_soil_militarised_desc: "행정적 교리로 시작된 것이 작전 태세가 되었습니다. 중국 해군과 해경 전력은 이제 푸른 국토 주장을 적극적으로 집행하며, 외국 선박의 침범을 중국 국내법 위반으로 취급합니다."
 CHI_bo_ideological_consolidation: "이념 공고화"
 CHI_bo_ideological_consolidation_desc: "이념 명료화 운동이 당의 사회주의적 헌신을 강화하고 우경화를 저지합니다. 학습 모임과 정풍 회의, 개정된 교육 과정이 국가 기구 전반에 두 개의 재확인을 새겨 넣습니다."
 CHI_bri_forum_momentum: "일대일로 포럼의 추진력"
 CHI_bri_forum_momentum_desc: "베이징에서 3년마다 열리는 일대일로 포럼은 인프라 주도 세계화에 대한 중국의 의지를 재확인했습니다. 외국 대표단은 새로운 약속을 안고 돌아가며, 우리의 경제 외교는 수년간의 결실을 거둡니다."
 CHI_bri_industrial_zones_tier_1_idea: "경제특구 I"
 CHI_bri_industrial_zones_tier_1_idea_desc: "중국식 모델로 건설된 해외 경제특구는 우리의 제조 기반을 국경 너머로 확장합니다."
 CHI_bri_industrial_zones_tier_2_idea: "경제특구 II"
 CHI_bri_industrial_zones_tier_2_idea_desc: "해외 구역들이 가동 중인 산업단지로 성숙했으며, 건설 전문 지식이 국내 건설 계획으로 환류합니다."
 CHI_bri_industrial_zones_tier_3_idea: "경제특구 III"
 CHI_bri_industrial_zones_tier_3_idea_desc: "중국이 관리하는 산업단지 네트워크는 파트너 국가들의 경제를 우리 공급망과 건설 산업에 묶어 둡니다."
 CHI_bri_mines_tier_1_idea: "자원 이권 I"
 CHI_bri_mines_tier_1_idea_desc: "파트너 국가에 대한 대출을 통해 확보한 광산 이권이 원자재를 중국 산업으로 되돌려 보냅니다."
 CHI_bri_mines_tier_2_idea: "자원 이권 II"
 CHI_bri_mines_tier_2_idea_desc: "이권 포트폴리오가 여러 채굴 부문으로 넓어져 우리 경제가 이용할 수 있는 자원 기반이 깊어졌습니다."
 CHI_bri_mines_tier_3_idea: "자원 이권 III"
 CHI_bri_mines_tier_3_idea_desc: "중국 기업들은 파트너 국가의 채굴 부문 전반에서 지배 지분을 보유하며, 우리 필요를 넘는 잉여분은 웃돈을 받고 되팔립니다."
 CHI_bri_pipelines_tier_1_idea: "에너지 동맥 I"
 CHI_bri_pipelines_tier_1_idea_desc: "중국 정유 시설에 공급하는 파트너 국가의 가스관은 해상 에너지 병목 지점에 대한 우리의 노출을 줄여 줍니다."
 CHI_bri_pipelines_tier_2_idea: "에너지 동맥 II"
 CHI_bri_pipelines_tier_2_idea_desc: "확장된 가스관 용량과 관련 저유 시설 덕분에 더 많은 연료를 끌어오고 더 많이 비축할 수 있습니다."
 CHI_bri_pipelines_tier_3_idea: "에너지 동맥 III"
 CHI_bri_pipelines_tier_3_idea_desc: "육상 에너지 동맥이 이제 해상 병목 지점을 완전히 우회하며, 이를 활용할 저장 시설이 빠르게 건설되고 있습니다."
 CHI_bri_ports_tier_1_idea: "해상 네트워크 I"
 CHI_bri_ports_tier_1_idea_desc: "중국이 운영하는 컨테이너 터미널은 이제 해상 항로를 따라 파트너 국가 무역의 상당한 비중을 처리하며, 우리가 화물을 보내는 국가들과의 상업적 입지를 강화합니다."
 CHI_bri_ports_tier_2_idea: "해상 네트워크 II"
 CHI_bri_ports_tier_2_idea_desc: "터미널 이권이 본격적인 항만 개발 계약으로 넓어졌습니다. 우리 시공사들이 해외에서 짓는 조선소와 부두는 본국의 해군 건조에 가져올 전문성을 연마해 줍니다."
 CHI_bri_ports_tier_3_idea: "해상 네트워크 III"
 CHI_bri_ports_tier_3_idea_desc: "상업 항구의 사슬은, 그 가운데 여러 곳이 군민 겸용 부두와 보급 시설을 갖춘 채, 이제 항로 전역에 뻗어 있습니다. 중국 해운이 더 멀리 나아가고, 그것을 지키는 함대도 그렇습니다."
 CHI_bri_powerplants_tier_1_idea: "발전 네트워크 I"
 CHI_bri_powerplants_tier_1_idea_desc: "중국 시공사가 해외에 건설한 발전 용량은 파트너국의 산업을 우리 조건대로 돌아가게 하며, 우리 자체 발전소도 그 경험 덕분에 더 잘 운영됩니다."
 CHI_bri_powerplants_tier_2_idea: "발전 네트워크 II"
 CHI_bri_powerplants_tier_2_idea_desc: "더 넓어진 해외 발전소 포트폴리오가 본국의 더 높은 산업 처리량을 뒷받침합니다."
 CHI_bri_powerplants_tier_3_idea: "발전 네트워크 III"
 CHI_bri_powerplants_tier_3_idea_desc: "중국의 공학 기술은 파트너 네트워크 전역에서 발전의 기본 공급자가 되었으며, 본국의 산업 생산도 그에 걸맞게 늘었습니다."
 CHI_bri_prestige_tier_1_idea: "위신 외교 I"
 CHI_bri_prestige_tier_1_idea_desc: "파트너 국가에 대한 가시적인 투자는 우리에게 채권자가 아닌 건설자라는 평판을 안겨 줍니다."
 CHI_bri_prestige_tier_2_idea: "위신 외교 II"
 CHI_bri_prestige_tier_2_idea_desc: "일대일로는 공공재로 거론됩니다. 우호 관계를 유지하는 비용이 예전보다 덜 듭니다."
 CHI_bri_prestige_tier_3_idea: "위신 외교 III"
 CHI_bri_prestige_tier_3_idea_desc: "베이징은 이제 개발도상국 대부분에서 제일 먼저 찾는 파트너이며, 그로 인한 위상은 곧바로 국내 정치 자본으로 이어집니다."
 CHI_bri_railways_tier_1_idea: "육상 회랑 I"
 CHI_bri_railways_tier_1_idea_desc: "국경을 넘는 철도 연결망이 파트너 국가의 경제를 중국 산업에 묶어 주며, 그 위로 운송되는 화물은 해당 국가들 사이에서 우리에게 호감을 안겨 줍니다."
 CHI_bri_railways_tier_2_idea: "육상 회랑 II"
 CHI_bri_railways_tier_2_idea_desc: "회랑은 이제 정기 화물 동맥으로 운영됩니다. 신뢰할 수 있는 육상 수송은 해상 접근이 불확실한 곳에서도 우리 병력에 보급이 끊기지 않게 합니다."
 CHI_bri_railways_tier_3_idea: "육상 회랑 III"
 CHI_bri_railways_tier_3_idea_desc: "끊김 없는 육상 네트워크가 대륙의 깊숙한 내륙까지 닿아 있습니다. 우리 철도 공병대는 해외에서 얻은 경험 덕분에 본국에서 더 빠르게 건설합니다."
 CHI_bri_telecom_tier_1_idea: "디지털 실크로드 I"
 CHI_bri_telecom_tier_1_idea_desc: "파트너 국가에 중국이 구축한 네트워크 기간망은 우리 기관이 그곳을 지나는 트래픽을 들여다볼 수 있게 하여 외국 정보 기관의 침투에 대한 방어력을 높여 줍니다."
 CHI_bri_telecom_tier_2_idea: "디지털 실크로드 II"
 CHI_bri_telecom_tier_2_idea_desc: "파트너 네트워크 전반의 장비 계층에 대한 통제는 해외에서 우리 활동을 유지하는 비용을 낮춰 줍니다."
 CHI_bri_telecom_tier_3_idea: "디지털 실크로드 III"
 CHI_bri_telecom_tier_3_idea_desc: "디지털 회랑은 하드웨어, 백홀, 해저 케이블 양륙 지점에 이르기까지 처음부터 끝까지 우리의 것입니다. 이곳을 지나는 외국 트래픽은 우리에게 사적이지도 안전하지도 않습니다."
 CHI_brokered_non_aggression_pact: "베이징이 중재한 불가침 조약"
 CHI_brokered_non_aggression_pact_desc: "중국은 역내 경쟁국과의 불가침 합의에 대한 보증국으로 서 있습니다. 조약이 유지되는 동안 양측은 안정과 베이징과의 따뜻한 관계의 혜택을 누립니다."
 CHI_cadre_evaluation_reform_idea: "종합 간부 평가 개혁"
 CHI_cadre_evaluation_reform_idea_desc: "관료들은 이제 GDP 성장과 함께 환경 관리, 사회 화합, 공공 서비스 제공으로 평가받습니다. 화석 연료 집약적 생산에 대한 의존도 감소와 더 간소한 공공 지출은 더 책임성 있는 행정 계층을 반영합니다."
 CHI_cai_active_phase: "EU 포괄적 투자 협정"
 CHI_cai_active_phase_desc: "포괄적 투자 협정이 활성 단계에 있습니다. 유럽 시장은 중국의 수출과 투자에 활짝 열려 있고, 소비재 비용은 내려갔으며, 우리 산업 역량은 크게 확장되었습니다."
 CHI_cai_residual: "CAI의 지속적 유산"
 CHI_cai_residual_desc: "포괄적 투자 협정의 활성 단계가 끝난 뒤에도 유럽 시장과의 구조적 통합은 지속됩니다. 무역 관계는 그렇지 않았을 경우보다 여전히 따뜻합니다."
 CHI_central_political_commission_1: "중앙정법위원회"
 CHI_central_political_commission_1_desc: "중앙정법위원회는 법원, 검찰, 공안 기구, 국가안전 기관에 대한 감독 권한을 보유합니다. 주된 임무는 국내 질서를 유지하고 법 체계가 독립된 견제 장치로 기능하지 않고 당의 목표에 봉사하도록 보장하는 것입니다. 위원회 내 그 위상이 커질수록 소요를 선제적으로 차단하고, 이견을 효율적으로 처리하며, 여러 기관에 걸친 보안 대응을 조율하는 위원회의 역량이 크게 향상됩니다."
 CHI_chinese_dream_momentum: "중국몽의 추진력"
 CHI_chinese_dream_momentum_desc: "중국몽 서사는 국가적 사명에 대한 대중의 의식을 동원합니다. 시민들은 집단의 부흥에 봉사하도록 요청받고, 당 기관은 폭증하는 입대 문의와 애국적 감정의 공개적 표출을 보고합니다. 아직은 이야기가 목적지보다 더 매력적입니다."
 CHI_chongqing_model_idea: "충칭 모델"
 CHI_chongqing_model_idea_desc: "국유 기업이 투자의 닻이 되고 더 넓은 경제의 속도를 정합니다. 국유화된 자산은 외국 자본이나 민간 부문 세수에 의존하지 않고 복지 지출을 위한 재정 기반을 제공합니다."
 CHI_commercial_bank_law_idea: "상업은행법 시행"
 CHI_commercial_bank_law_idea_desc: "2003년 상업은행법 개정은 4대 은행에 바젤식 자기자본 적정성 비율, 위험 분류 기준, 독립 이사회를 부과합니다. 전환기 동안 규제 준수 비용이 증가하지만, 신용 배분 과정이 처음으로 직접적인 정치 통제에서 벗어납니다."
 CHI_common_prosperity_framework: "공동부유 체제"
 CHI_common_prosperity_framework_desc: "민간 부문 교육, 연예, 기술에 대한 규제 개입이 의료, 농촌 인프라, 사회 보험에 대한 국가 투자 확대와 짝을 이룹니다. 당은 번영이 공동의 것이 된다고 주장하지만, 그 메커니즘은 번영이 무엇을 뜻하는지와 누가 먼저 받는지를 국가가 정하는 것입니다."
 CHI_cpec_partner: "중국-파키스탄 경제 회랑"
 CHI_cpec_partner_desc: "CPEC 투자 패키지는 중국이 자금을 댄 고속도로, 에너지 사업, 산업 구역으로 경제 활동을 가속하며 파키스탄의 인프라를 재편하고 있습니다."
 CHI_crrc_idea1_desc: "세계 최대의 철도 장비 공급업체인 중국중차는 국내의 선로 및 터미널 건설과 중국 철도 차량의 해외 수출을 이끕니다."
 CHI_defiance_of_china: "중국에 대한 저항"
 CHI_defiance_of_china_desc: "이 국가는 중국의 요구를 거부하고 경제적 압박을 견뎌 내며 분쟁 지형에 대한 입장을 유지했습니다. 이 저항 행위는 국내에서 상당한 위신을 가져오며 다른 지역 행위자들이 자신의 입장을 굳히도록 부추길 수 있습니다."
 CHI_diaoyu_patrol_regime: "댜오위 순찰 체제"
 CHI_diaoyu_patrol_regime_desc: "분쟁 해역 인근에서의 지속적인 해경 순환 배치는 현실적인 조건 속에서 해군 승조원을 훈련시킵니다."
 CHI_digital_governance_spirit: "디지털 거버넌스"
 CHI_digital_governance_spirit_desc: "통합 데이터 시스템은 도시 감시망, 금융 거래 모니터링, 사회 신용 점수를 하나의 통일된 준법 인프라로 연결합니다. 지방 정부는 행정 요청을 디지털로 처리하고 자동 경보를 통해 기준을 집행합니다. 시민과 국가 사이의 관료적 접점은 간소해지며, 국가는 모든 접촉 지점에 존재합니다."
 CHI_distant_water_fishing_fleets: "원양 어선단"
 CHI_distant_water_fishing_fleets_desc: "베이징의 보조금을 받고 국유 기업의 뒷받침을 받는 우리 원양 어선단은 세계 최대 규모로, 서아프리카와 남아메리카, 남태평양의 배타적 경제수역에서 조업합니다. 식량 안보를 넘어 이 선박들은 우리 해안에서 먼 해역에 지속적인 해상 주둔을 투사하며, 중국 선박이 항해하는 곳이면 어디든 중국의 이익이 미친다는 원칙을 강화합니다."
 CHI_divestiture_transition_idea: "사업 매각 전환기"
 CHI_divestiture_transition_idea_desc: "군을 상업 수입에서 떼어 내 국가 예산에 의존하게 하면 어떤 예산 배정으로도 하루아침에 메울 수 없는 공백이 생깁니다. 호텔과 농장, 무역 부문으로 자급하던 부대들은 이제 베이징을 기다려야 하며, 그 손실을 달래는 데 정치적 자본이 소모됩니다. 국방 부문이 자급하는 대기업 집단으로 재편되면 부담이 완화됩니다."
 CHI_dragon_king_ascendant: "용왕의 승천"
 CHI_dragon_king_ascendant_desc: "용왕은 중국 우주관에서 사해의 전통적인 군주입니다. 조공 체계가 공식적으로 발동되고 군사적 주둔이 공고해지면서 남해는 오직 한 군주, 곧 베이징만을 인정합니다."
 CHI_eda_grey_market_idea: "회색 경로 EDA 조달"
 CHI_eda_grey_market_idea_desc: "국내 팹리스 업체들은 동남아시아의 페이퍼 컴퍼니를 거쳐 시높시스와 케이던스 설계 흐름을 조달합니다. 테이프아웃은 되지만 공급이 불안정하고 도구 업데이트는 정식 라이선스 시장보다 몇 달 뒤처집니다."
 CHI_eight_points_doctrine: "대만에 관한 8항 제안"
 CHI_eight_points_doctrine_desc: "장쩌민의 8항 제안은 평화 통일을 위한 손짓과 법적 독립에 대한 명시적 경고를 결합하여 양안 정책에 공식적인 교리적 틀을 제공합니다. 유사시 작전에 대한 군사 계획이 외교 노선과 병행되어 베이징에 믿을 만한 강압 수단을 줍니다."
 CHI_etim_designation: "ETIM 지정 체계"
 CHI_etim_designation_desc: "양자 대테러 체계가 동투르키스탄 분리주의 조직망을 겨냥합니다."
 CHI_eu_market_access: "EU 시장 포괄 접근"
 CHI_eu_market_access_desc: "브뤼셀과의 포괄적 투자 체제의 비준은 유럽 소비자 및 자본 시장에 대한 깊은 접근을 열어 수출 한도를 끌어올리고 역내 전역에서 중국 기업에 대한 정치적 분위기를 누그러뜨립니다."
 CHI_grey_society_crisis_idea: "회색 사회 위기"
 CHI_grey_society_crisis_idea_desc: "한 자녀 정책 이후 세대를 맞은 중국은 이제 역피라미드형 연령 구조를 안고 있습니다. 줄어드는 노동력이 늘어나는 은퇴자 집단을 부양해야 하므로 연금과 의료 예산이 고갈되고 생산성 증가는 정체됩니다. 이 부담은 생산 연령 인구가 안정되어야만 완화됩니다.\n§W--------------§!\n이 국가 정신은 §Y$CHI_grey_society_crisis$§! 임무가 시작된 지 10년 뒤 종료될 때 §R제거§!됩니다. §Y$CHI_pro_natalist_subsidies$§!, §Y$CHI_raise_retirement_age$§!, §Y$CHI_automation_robotics_push$§! 같은 완화 결정은 그 기간을 단축합니다."
 CHI_guarantor_of_korean_peace: "한반도 평화의 보증인"
 CHI_guarantor_of_korean_peace_desc: "베이징은 역내 전반에서 한반도 안정의 필수 불가결한 보증인으로 인정받습니다. 이로 인해 얻은 위신은 어떤 한 정권보다도 오래갑니다."
 CHI_gwadar_basing_rights: "과다르 기지 사용권"
 CHI_gwadar_basing_rights_desc: "과다르의 심수 항만 시설에 대한 접근은 인민해방군 해군의 작전 범위를 인도양과 아라비아해 전역으로 넓혀 줍니다."
 CHI_ideological_rectification: "이념 정풍"
 CHI_ideological_rectification_desc: "9호 문건의 금지 사항은 대학, 언론 기관, 국유 기업 전반에서 의무 학습 모임과 자아비판 운동을 통해 집행됩니다. 용인되는 담론의 경계가 빠르게 좁아집니다. 충성은 서구 자유주의 개념에 대한 거부를 통해 증명되며, 이념적 방벽은 외국의 영향에 맞서 단단해집니다."
 CHI_informal_sanctions: "비공식 THAAD 제재"
 CHI_informal_sanctions_desc: "우리는 THAAD 배치에 대한 대응으로 한국에 비공식 경제 제재를 가했습니다. 중국 관광객은 다른 곳으로 돌려지고, 한국 상품은 비관세 장벽에 직면하며, 우리 영토에서 영업하는 한국 기업들은 공권력의 괴롭힘을 보고합니다."
 CHI_information_warfare: "정보전 기구"
 CHI_information_warfare_desc: "국영 언론과 디지털 플랫폼은 중국의 서사를 전 세계에 투사하는 한편 적대적 정보 공작에 맞섭니다."
 CHI_inner_party_supervision_idea: "당내 감독 조례"
 CHI_inner_party_supervision_idea_desc: "공식화된 감독 절차는 상급 당 기관이 하급 위원회를 점검하고 보고하도록 요구합니다. 반부패 집행이 강화되고 정치적 책임이 정례화됩니다."
 CHI_international_department_1: "중국공산당 대외연락부"
 CHI_international_department_1_desc: "대외연락부는 전 세계에서 정당 간 외교를 수행하며 모든 지역의 집권당, 야권 운동, 정치 재단과 관계를 쌓습니다. 또한 일대일로 구상의 정치적 대외 활동을 담당하는 주된 기관으로서 사업 이행을 조율하고, 파트너 국가와의 관여에서 나오는 수익을 관리하며, 수혜 정부가 상환에 어려움을 겪을 때 채무 재조정을 처리합니다. 위원회 내 영향력을 확대하면 호의적인 외국 파트너의 네트워크가 깊어지고 일대일로 약속의 전반적 수익이 개선됩니다."
 CHI_international_sanctions: "국제 제재"
 CHI_international_sanctions_desc: "북한의 군사적 침략에 대한 중국의 지원은 광범위한 국제 제재 체제를 촉발했습니다. 무역 접근이 제한되고 외국인 투자가 말라붙으며 외교적 고립이 깊어집니다."
 CHI_Invigorate_Country_Through_STE1: "과교흥국"
 CHI_Invigorate_Country_Through_STE1_desc: "과학, 기술, 교육으로 나라를 부흥시킨다는 전략은 국가 투자를 연구소와 대학 체계로 돌립니다. 연구의 배당은 더 무거운 교육 예산이라는 대가를 치르고 얻어집니다."
 CHI_Invigorate_Country_Through_STE1_tt: "§Y$CAT_information_technology$§! 또는 §Y$CAT_internet$§!에 대한 연간 기술 증강"
 CHI_iron_brothers_joint_training: "철의 형제 합동 훈련"
 CHI_iron_brothers_joint_training_desc: "파트너 군대와의 지속적인 합동 훈련은 부대 응집력, 교리 일치, 합동 병과 숙련도를 향상시켰습니다."
 CHI_jap_finlandized_sovereignty: "핀란드화된 주권"
 CHI_jap_finlandized_sovereignty_desc: "도쿄는 의회와 언론, 언어를 유지합니다. 또한 베이징이 국경 밖에서 하는 일에 대해서는 침묵을 지킵니다."
 CHI_jap_forced_neutrality: "강제된 중립"
 CHI_jap_forced_neutrality_desc: "일본이 미국의 안보 우산에서 물러난 것은 총구 앞에서 이루어진 일이었습니다. 조약은 서명되었습니다. 그 굴욕은 대를 이어 갈 것입니다."
 CHI_jap_historical_pressure: "중국의 역사 공세"
 CHI_jap_historical_pressure_desc: "베이징은 전시 역사 문제를 다시 꺼내 모든 외교 무대에서 야스쿠니 신사 참배, 교과서 논란, 난징의 유산을 거론하고 있습니다. 이 운동은 일본 국내 여론을 자극하고 중국의 영향력 공작에 맞서는 도쿄의 능력을 갉아먹습니다."
 CHI_japan_soft_power: "중일 문화 교류"
 CHI_japan_soft_power_desc: "관광객 교류와 판다 임대, 장관급 기념 촬영은 호의를 정치적 자본으로 바꿉니다. 공격성이 지나치게 높아지면 자동으로 중단됩니다."
 CHI_japanese_cultural_imports: "허가된 일본 문화 수입"
 CHI_japanese_cultural_imports_desc: "빌리빌리는 스튜디오 지브리를 스트리밍합니다. 텐센트는 귀멸의 칼날의 판권을 계약합니다. 당의 청년 조직은 문화 흡수에 관한 왕후닝의 보고서를 학습합니다."
 CHI_joint_command_consultations: "합동 지휘부 협의"
 CHI_joint_command_consultations_desc: "중국과 북한 군 지휘부 사이의 정례적인 전략 협의는 협조를 개선하고 오판의 위험을 줄이고 있습니다."
 CHI_joint_venture_era_idea: "합작 투자 산업 시대"
 CHI_joint_venture_era_idea_desc: "외국-국내 합작 기업이 기술 획득, 경영 지식 이전, 세계 유통망 접근의 주된 수단이 됩니다."
 CHI_kaesong_co_developer: "개성 공동 개발자"
 CHI_kaesong_co_developer_desc: "중국 건설 업체와 물류 운영사들이 확장된 개성 지구 안에서 합작 사업을 운영하고 있습니다. 공유된 공급망은 비용을 줄이고 서로의 평판을 하나로 묶습니다."
 CHI_kor_beijing_pressure: "베이징의 압박 공세"
 CHI_kor_beijing_pressure_desc: "중국의 지속적인 경제적, 외교적 압박이 한국 국민의 신뢰를 갉아먹고 서울의 독자적 정책 여지를 좁히고 있습니다. 정부는 커지는 국내 불만과 베이징에 맞설 수 있는 줄어드는 재량에 직면해 있습니다."
 CHI_kor_beijing_security_guarantee: "베이징의 안보 보장"
 CHI_kor_beijing_security_guarantee_desc: "공식적인 중국의 안보 보장 아래 한국은 미국 핵우산에 대한 의존에서 벗어납니다. 국방 계획은 베이징과의 협력을 중심으로 재편되어 징병 부담을 줄이고 정치적 분위기를 안정시킵니다."
 CHI_kor_exit_trilateral: "3자 체제 이탈"
 CHI_kor_exit_trilateral_desc: "한국은 한미일 3자 방위 체제에서 탈퇴했습니다. 이 결정은 이 체제의 반중 성향이 한국의 경제적 이익 및 전략적 자율성 목표와 양립할 수 없다는 서울의 판단을 반영합니다."
 CHI_kor_strategic_autonomy_doctrine: "전략적 자율성 독트린"
 CHI_kor_strategic_autonomy_doctrine_desc: "한국은 서울을 워싱턴의 인도-태평양 구조로부터 거리를 두게 하는 전략적 자율성 독트린을 채택했습니다. 한국의 방위 태세는 미국과의 동맹 관리보다 자주국방과 지역 다자주의를 중심으로 재편됩니다."
 CHI_korean_tributary: "북한의 조공 관계"
 CHI_korean_tributary_desc: "북한의 베이징에 대한 정치적 종속은 1895년 이전 중-조 관계를 규정했던 조공 관계를 현대적 제도 형태로 재현했습니다. 한반도의 항구, 시장, 전략 공간에 대한 중국의 접근이 공식적으로 보장됩니다."
 CHI_kpa_intelligence_penetration: "조선인민군 정보 침투"
 CHI_kpa_intelligence_penetration_desc: "중국 정보기관은 조선인민군 내부에 협력자 네트워크를 구축했습니다. 북한의 군사 계획과 내부 정치에 대한 실시간 파악은 베이징에 평양에 대한 전례 없는 지렛대를 쥐여 줍니다."
 CHI_lithium_supply_chain_locked: "리튬 삼각지대 공급망"
 CHI_lithium_supply_chain_locked_desc: "아르헨티나, 볼리비아, 칠레 생산자들과의 장기 인수 계약은 중국 배터리 제조사에 필요한 리튬을 확보해 주며, 효율 곡선을 부드럽게 하고 민간 산업에 여유를 더합니다."
 CHI_long_range_firepower_idea: "장거리 화력"
 CHI_long_range_firepower_idea_desc: "[CHI_long_range_firepower_idea_tt]"
 CHI_lotte_market_correction: "롯데 시장 조정"
 CHI_lotte_market_correction_desc: "롯데 그룹의 중국 내 사업은 관리된 축소로 내몰렸고, 그 시장 점유율은 국내 경쟁자들에게 돌아갔습니다. 이 조정은 소비재 유출을 줄이고 표적을 정한 경제 보복의 정치적 효용을 보여 줍니다."
 CHI_lunar_legacy_industrial: "현실이 된 천궁"
 CHI_lunar_legacy_industrial_desc: "톈궁은 하늘의 궁전을 뜻하며, 역사상 처음으로 전적으로 중국인의 손으로 지은 궁전 하나가 궤도에 영구히 서 있습니다. 그것을 세운 공장과 주조소, 조립 공장들은 이제 입증된 규율을 지상으로 되돌립니다. 정거장을 궤도에 올릴 수 있는 힘이라면 그 아래의 무엇이든 만들 수 있습니다."
 CHI_lunar_legacy_military: "오작교를 건너다"
 CHI_lunar_legacy_military_desc: "오작교라는 뜻의 췌차오 위성은 달 뒤편에서 우리 신호를 중계했으며, 이름은 한때 두 연인이 하늘 건너편에서 만나게 해 준 까치의 다리에서 따왔습니다. 시도된 것 중 가장 어려운 임무를 위해 훈련한 승무원들은 단련되고 확신에 찬 모습으로 귀환했습니다. 달에 닿을 수 있는 군대는 지상의 어떤 도전에도 의심으로 답하지 않습니다."
 CHI_lunar_legacy_political: "항아, 하늘에 오르다"
 CHI_lunar_legacy_political_desc: "옛 신화에서 항아는 영약을 마시고 달로 날아올라, 남편 후예를 영원히 하늘만 바라보게 남겨 두었습니다. 이제 그녀의 이름은 실재하는 한 국가를 달 표면으로 실어 날랐고, 인민은 그 속에서 중국이 일류 강국에 속한다는 증거를 봅니다. 달 착륙은 어떤 경쟁자도 빼앗을 수 없는 위상의 원천이 됩니다."
 CHI_lunar_legacy_research: "천문의 물음"
 CHI_lunar_legacy_research_desc: "하늘에 묻다라는 뜻의 톈원은 우주의 질서를 따져 물은 굴원의 고대 시에서 이름을 가져왔습니다. 위투 탐사차와 달 시료는 어떤 나라도 답하지 못했던 물음에 답했으며, 이를 해독한 연구실들은 더 많은 것에 목마릅니다. 달에서 검증된 과학 체제는 이제 모든 개척지를 향해 손을 뻗습니다."
 CHI_mass_line_bo_campaign: "대중노선 운동"
 CHI_mass_line_bo_campaign_desc: "간부들은 농촌과 공장 현장 곳곳에 파견되어 의견을 수렴하고 당이 인민에게 헌신함을 보여 줍니다. 이 운동은 정치 의식을 높이고 대중의 에너지를 당의 목표 뒤로 모읍니다."
 CHI_mazu_blessing: "마조의 가호"
 CHI_mazu_blessing_desc: "바다의 여신이자 선원의 수호자인 마조는 남중국해 연안 전역에서 숭배받습니다. 그녀의 사원 가호가 남해 함대를 위해 공식적으로 발동되었습니다. 이 의식은 함대 전반에서 거행되며 단결심을 강화합니다."
 CHI_media_offensive: "글로벌 미디어 공세"
 CHI_media_offensive_desc: "CGTN, 신화통신, 소셜 미디어 플랫폼이 중국의 관점을 투사하는 세계적 캠페인을 조율합니다."
 CHI_militia_deployed: "해상 민병 활동 중"
 CHI_militia_deployed_desc: "중국 해상 민병 선박이 분쟁 해역에 전진 배치되어 민간인 위장 아래 지속적인 주둔을 유지합니다. 이들의 존재는 경쟁국 해경 선박이 위기를 촉발하지 않고는 접근하지 못하게 막습니다."
 CHI_monroe_inverted: "뒤집힌 먼로 독트린"
 CHI_monroe_inverted_desc: "우리는 워싱턴을 대신해 라틴아메리카의 주된 외부 파트너가 되었으며, 관계의 비용을 낮추고 지역 여론을 우리 쪽으로 끌어당기는 반구 차원의 재편을 이끌고 있습니다."
 CHI_national_humiliation: "국치"
 CHI_national_humiliation_desc: "남중국해에서의 중국의 외교적 또는 군사적 좌절은 국내에서 백년국치의 연장으로 규정되었습니다. 여론이 격앙되었고, 지도부는 다른 수단으로 체면을 회복하라는 강한 압력에 직면합니다."
 CHI_national_security_commission_1: "중국공산당 국가안전위원회"
 CHI_national_security_commission_1_desc: "2013-2014년 시진핑 체제에서 설립된 국가안전위원회는 중국 안보 구조의 정점에 놓여 국무원이 아니라 당의 직접 지도 아래 정보, 군사, 사이버, 방첩 기능을 조율합니다. 그 창설은 모든 전략적 안보 결정의 의도적인 중앙집권화를 알리는 신호였습니다. 위원회 내에서 영향력이 깊어질수록 조율 권한은 더 포괄적이 되고 국내외 안보 위협에 대한 대응 능력은 더 통일되고 결단력 있게 됩니다."
 CHI_nepal_himalayan_friendship: "히말라야 우호 구상"
 CHI_nepal_himalayan_friendship_desc: "중국의 투자와 호의는 카트만두의 중립을 존중하면서도 네팔을 베이징의 경제권 쪽으로 끌어당기는 협력 틀 아래 네팔로 흘러들어 갑니다."
 CHI_neutral_interlocutor: "중립적 대화 상대"
 CHI_neutral_interlocutor_desc: "우리는 남북한 양쪽이 모두 대화할 수 있는 유일한 강대국으로 자리매김했습니다. 이 역할에는 영향력과 함께 기대도 따릅니다."
 CHI_nko_blue_sky_mobilization: "푸른 하늘 동원"
 CHI_nko_blue_sky_mobilization_desc: "조선인민군은 중국의 전략 목표와 보조를 맞추어 완전한 전투 동원에 돌입했습니다. 모든 휴가가 취소되었고 전방 부대는 공격 위치로 이동하고 있습니다."
 CHI_nko_chinese_economic_sphere: "중국 경제권"
 CHI_nko_chinese_economic_sphere_desc: "북한 경제는 공식적으로 중국의 산업권에 편입되었습니다. 중국 국유 기업이 핵심 부문을 운영하고, 통화 페그 제도가 정상화되었으며, 북한 원화는 런민비에 연동됩니다."
 CHI_nko_energy_aid: "중국의 에너지 원조"
 CHI_nko_energy_aid_desc: "단둥에서 들어오는 중유와 전력 이전이 공장을 가동시키고 불을 켜 두고 있습니다. 베이징의 보조금에는 조용한 기대가 따라붙습니다."
 CHI_nko_food_package: "중국의 식량 지원"
 CHI_nko_food_package_desc: "두만강 국경 통과 지점을 거쳐 운송되는 곡물이 만성적인 부족을 완화하고 있습니다. 이 원조는 당 내부에서 정치적 숨통을 사 줍니다."
 CHI_nko_infrastructure_investment: "중국의 인프라 투자"
 CHI_nko_infrastructure_investment_desc: "중국 건설 여단들이 북한의 인프라를 대규모로 재건하고 있습니다. 도로, 철도, 항만, 전력망이 한 세대 동안 북한의 자원을 중국의 산업 사슬에 묶어 두는 계약 아래 개선됩니다."
 CHI_nko_offensive_readiness: "조선인민군 공세 태세"
 CHI_nko_offensive_readiness_desc: "중국의 병참 지원을 받아 조선인민군은 방어적 태세에서 38선을 넘어 남쪽으로 신속한 공세 작전을 펼치는 데 최적화된 태세로 전환했습니다."
 CHI_nko_security_assurance: "중국의 안전 보장"
 CHI_nko_security_assurance_desc: "베이징은 정권 붕괴에 대비한 은밀하지만 확고한 안전망을 제공했습니다. 이 보장은 핵심 지도부를 안정시키고 동원 압력을 누그러뜨립니다."
 CHI_npm_red_banner_insurgency: "중국이 후원하는 반란"
 CHI_npm_red_banner_insurgency_desc: "베이징의 비밀 보급로는 마오주의 부대에 소총과 탄약, 간부 훈련을 계속 대 줍니다. 인민해방군은 네팔을 혁명 수출의 시험장으로 여기며 투자에 대한 보답을 기대합니다."
 CHI_nrcms_rollout_idea: "신형 농촌 합작 의료 제도"
 CHI_nrcms_rollout_idea_desc: "농촌 주민, 지방 정부, 중앙 예산이 함께 갹출한 기금이 이제 수억 명의 농민에게 대형 의료비를 보장하여 공중 보건을 개선하고 질병이 농촌 가구에 미치는 재정적 충격을 줄입니다."
 CHI_organisation_department_1: "중국공산당 중앙조직부"
 CHI_organisation_department_1_desc: "중앙조직부는 당 서열의 모든 단계에 걸친 임명, 승진, 심사, 징계 등 모든 당 인사 결정을 통제합니다. 그 영향력은 국유 기업과 정부 부처에까지 미치므로, 당내 결속을 위한 가장 강력한 단일 수단이 됩니다. 상무위원회 내에서 위원회의 영향력이 깊어질수록 간부 선발에 대한 장악력은 조여지고 기구를 통해 중앙 지침을 관철시키는 능력도 그만큼 커집니다."
 CHI_pacific_basing_rights: "제2도련선 기지 사용"
 CHI_pacific_basing_rights_desc: "제2도련선 깊숙한 곳에서 협상으로 얻은 기지 사용권과 보급권은 중국 인민해방군 해군에 전략적 도달 범위, 더 짧은 병참선, 원양 배치를 위한 더 빠른 조선소 회전을 안겨 줍니다."
 CHI_pacific_diplomatic_setback: "태평양 외교적 좌절"
 CHI_pacific_diplomatic_setback_desc: "태평양 도서국에서의 세간의 이목을 끈 실패는 역내 수도들이 우리의 접근에 맞서 강경해지게 했으며, 이후 모든 외교 구상의 정치적 비용을 높입니다."
 CHI_pacific_security_lead: "태평양 안보 주도권"
 CHI_pacific_security_lead_desc: "태평양 도서국 전역에 걸친 전진 접근 협정과 순환 배치는 인민해방군 해군의 작전 범위를 넓히고 그것을 뒷받침하는 기지 인프라의 구축을 가속합니다."
 CHI_paf_maritime_militia: "인민무장부 해상 민병"
 CHI_paf_maritime_militia_desc: "군 지휘 아래 조직된 민간 어선단입니다. 바다에서는 그럴듯한 부인이 가능하고, 필요할 때는 실제 수를 갖춥니다."
 CHI_party_century_endures: "영속하는 당"
 CHI_party_century_endures_desc: "시진핑 사상은 당의 헌법적, 조직적 구조에 영구적인 운영 틀로 새겨집니다. 당대회 체제, 정치국, 중앙군사위원회는 지속 가능한 통치 기관으로 재확인됩니다. 마오의 죽음과 문화대혁명, 톈안먼을 견뎌 낸 당은 현 최고 지도자를 포함한 어떤 개인보다도 오래 존속하도록 설계되어 있습니다."
 CHI_patriotic_education_mandate: "애국 교육 의무화"
 CHI_patriotic_education_mandate_desc: "개정된 교육 과정은 어떤 중국 학생도 난징에서, 핑딩산에서, 731부대의 조립식 감방에서 벌어진 일을 잊지 못하도록 보장합니다. 안정도가 강화됩니다. 외국 사상에 대한 의심도 마찬가지입니다."
 CHI_pearls_economic_partner: "중국과의 전략적 동반자 관계"
 CHI_pearls_economic_partner_desc: "중국 해군의 병참 기지를 유치한 대가로 베이징의 경제적 후의를 얻게 되었으며, 항만 현대화 자금과 인프라 신용이 유치국으로 흘러들고 있습니다."
 CHI_personal_rule_mandate: "개인 통치 권한"
 CHI_personal_rule_mandate_desc: "2018년 전국인민대표대회는 헌법에서 국가주석 임기 제한을 삭제하여 최고 지도자를 중심으로 한 권한을 영구적으로 공고히 했습니다. 이제 전략적 방향과 정치적 충성은 단일 중심을 통해 흐르며, 전쟁 지지도는 높아지지만 야전 지휘관의 주도권 여지는 좁아집니다."
 CHI_petrodollar_breaks: "페트로달러 균형 달성"
 CHI_petrodollar_breaks_desc: "위안화로 가격이 매겨진 걸프 석유, 글로벌 사우스 전역의 중앙은행 스와프 라인, SWIFT 대안이 달러의 기축통화 프리미엄을 침식하여 통화적 영향력을 정치권력과 인구적 자신감으로 전환시켰습니다."
 CHI_pla_basing_economic_help: "중국과의 경제 동반자 관계"
 CHI_pla_basing_economic_help_desc: "인민해방군 해군의 병참 기지를 유치한 대가로 우리는 중국의 지속적인 경제 지원을 받습니다. 수출 시장 확대, 민간 공장 개선, 지역 포럼에서의 정치적 지지입니다."
 CHI_policy_bank_lending_idea: "정책은행 대출 추진"
 CHI_policy_bank_lending_idea_desc: "국가개발은행, 수출입은행, 농업발전은행은 국유 기업과 성 정부에 양허성 신용 한도를 발행하여 운송, 에너지, 해외 인프라에 대한 고정자산 투자를 가속합니다. 대출 물결은 건설 산출을 끌어올리지만 가계 저축을 저수익 예금에 묶어 둡니다."
 CHI_princeling_economic_leverage: "태자당 경제 지렛대"
 CHI_princeling_economic_leverage_desc: "국경을 넘는 사업 관계의 네트워크가 이제 북한 엘리트를 중국 자본에 묶고 있습니다. 모든 거래가 의존을 심화시킵니다."
 CHI_property_sector_contraction_idea: "부동산 부문 위축"
 CHI_property_sector_contraction_idea_desc: "3대 레드라인은 최대 개발업체들을 동시다발적 부채 축소로 몰아넣습니다. 건설 착공이 붕괴하고 지방 정부 수준의 토지 매각 수입이 증발하며, 시멘트, 강철, 가전에 걸친 협력업체 네트워크가 차례로 타격을 입습니다. 부동산 거품이 강제로 꺼짐에 따라 더 넓은 경제가 충격을 흡수합니다."
 CHI_property_tax_pilot_idea: "재산세 시범 시행"
 CHI_property_tax_pilot_idea_desc: "상하이와 충칭은 두 번째 주택과 고가 부동산에 소액의 세금을 부과하여 투기성 투자를 억제하고 지방 정부 수입을 토지 매각에서 다변화합니다."
 CHI_publicity_department_1: "중국공산당 중앙선전부"
 CHI_publicity_department_1_desc: "중앙선전부는 중국의 모든 인쇄, 방송, 디지털 매체에 대한 이념 노선을 정하며, 검열, 서사 구성, 당의 정당성에 대한 국내 선전을 지휘합니다. 또한 국영 언론의 확장과 해외 콘텐츠 제휴를 포함한 해외 메시지 인프라를 조율합니다. 위원회의 영향력이 커질수록 정보 환경이 더 일관되고 강력해져 사회 안정도와 당의 우선 과제에 대한 대중의 지지를 강화합니다."
 CHI_qccm_coordination_cell: "QCCM 조정 셀"
 CHI_qccm_coordination_cell_desc: "파미르 회랑을 가로지르는 4자 정보 공유가 중국, 파키스탄, 아프가니스탄, 타지키스탄의 보안 기관을 연결합니다."
 CHI_raj_foreign_defense_pressure: "중국의 압박"
 CHI_raj_foreign_defense_pressure_desc: "베이징의 남아시아 중시 전환은 뉴델리에 지속적인 외교적, 정보적 압박을 가하여 북부와 동부 국경을 따른 인도의 전략적 선택지를 좁혔습니다."
 CHI_rason_investment_flow: "라선 투자 프로그램"
 CHI_rason_investment_flow_desc: "중국 자본이 라선 경제특구로 흘러들어 인프라, 산업 역량, 항만 시설에 자금을 댑니다. 이 실험은 눈에 보이는 성과를 내고 있습니다."
 CHI_rason_port_access: "라선항 접근권"
 CHI_rason_port_access_desc: "우리 선박은 이제 라선의 심수 항만을 안정적으로 이용할 수 있으며, 이는 인민해방군 해군에 동해에서의 전략적 거점을 제공합니다."
 CHI_rcep_member: "RCEP 창립 회원국"
 CHI_rcep_member_desc: "우리는 도쿄, 서울과 함께 역내포괄적경제동반자협정을 공동으로 이끌었습니다. 관세가 내려가고, 공급망이 두터워지며, 미국의 부재가 역내의 표준이 됩니다."
 CHI_reconstruction_plan_idea: "재건 역량 계획"
 CHI_reconstruction_plan_idea_desc: "사전 배치된 장비와 표준화된 절차, 전문화된 육군 공병 부대는 재난 후 인프라와 산업을 복구하는 데 탁월한 속도의 우위를 부여합니다."
 CHI_regional_crisis_alert: "역내 위기 경보"
 CHI_regional_crisis_alert_desc: "한반도에서의 중국의 안보 태세는 역내 전반의 경계 태세 격상을 촉발했습니다. 동맹의 결속이 긴장 상태에 놓였습니다."
 CHI_reunion_humanitarian_lead: "인도주의 외교 주도"
 CHI_reunion_humanitarian_lead_desc: "국경을 넘는 이산가족 상봉에 대한 우리의 조율은 이례적으로 폭넓은 호의를 낳았습니다. 외교부들은 이 접촉을 환영하고, 국내 언론은 이를 증폭시킵니다."
 CHI_rmb_promotion: "위안화 국제화"
 CHI_rmb_promotion_desc: "런민비는 양자 통화 스와프 협정을 통해 국제 준비 통화로 점점 더 널리 받아들여지고 있습니다."
 CHI_russian_arms_dependency: "러시아 무기 의존"
 CHI_russian_arms_dependency_desc: "인민해방군은 소련과 러시아의 설계 위에 세워졌습니다. 소화기는 라이선스 생산한 칼라시니코프인 56식에서 시작했고, 기갑 병과는 소련 T-54A의 직접 복제품인 59식에서 성장했으며, 이후의 전차와 보병전투차도 여전히 T-72와 BMP의 계보를 반영합니다. 포병, 수송기, 방공 포대도 같은 혈통을 공유합니다. 의존은 추진 계통에서 가장 깊습니다. AL-31F는 J-10과 J-11을 움직이고, RD-93은 JF-17을 날게 하며, Su-35 전투기와 S-400 포대는 모스크바에서 완제품으로 구입했습니다. 모든 국산 전투기 계열은 러시아제 터빈을 기다리고, 모든 라이선스 모델은 로열티를 내며, 설계국은 여전히 창조하는 것보다 복제하는 것이 더 많습니다. 중국이 자체 군수 산업 기반을 벼려 내기 전까지, 군의 심장 박동은 러시아에서 정해집니다.\n§W--------------§!\n우리의 군사적 자급자족은 §Y$CHI_norinco_rationalism$§!, §Y$CHI_own_designs$§!, §Y$CHI_ws15_bottleneck_solve$§! 같은 방위 산업 중점과 §Y$CHI_invest_domestic_arms_lines$§!, §Y$CHI_localise_licensed_system$§! 결정을 통해 상승합니다. 이 국가 정신은 자급자족이 §Y25§!를 넘으면 §G개선§!됩니다."
 CHI_sanctions_immunity_partial: "위안화 결제 무역 생명선"
 CHI_sanctions_immunity_partial_desc: "제재 대상 파트너와의 런민비 표시 에너지 및 상품 계약은 서방의 금융 압박의 충격을 무디게 하고, 소비자 압력을 완화하며 수출 경로를 열어 둡니다."
 CHI_sars_outbreak_uncontrolled_idea: "사스 유행"
 CHI_sars_outbreak_uncontrolled_idea_desc: "신속한 비상 대응을 조율하지 못한 탓에 격리 조치가 자리 잡기 전에 사스가 여러 성으로 퍼졌습니다. 지연된 국제 통보는 해외에서의 우리 위상을 손상시켰고 국내에 상당한 경제적 혼란을 가져왔습니다."
 CHI_sars_response_effective_idea: "사스 억제"
 CHI_sars_response_effective_idea_desc: "우리의 비상 대응 체계는 신속한 격리와 즉각적인 국제 통보, 조율된 의료 조치를 가능하게 했습니다. 확산은 억제되었고, 경제적 혼란은 제한적이었으며 국제적 위상은 손상되지 않았습니다."
 CHI_scientific_outlook_idea_1: "과학적 발전관 준비"
 CHI_scientific_outlook_idea_1_desc: "우리는 과학적 발전관에 따라 국가 정책을 GDP 우선 성장에서 더 폭넓은 사회적, 환경적 지표 쪽으로 재조정하고 있습니다."
 CHI_scientific_outlook_idea_1_tt: "§Y$CHI_scientific_outlook_on_development$§! 중점 완료 시간 §G-35§! §Y일§!"
 CHI_sco_dialogue_partner: "SCO 대화 상대국"
 CHI_sco_dialogue_partner_desc: "이 나라는 상하이협력기구의 대화 상대국으로 받아들여졌으며, 이는 회원국들과의 더 깊은 정치적, 경제적 관여의 문을 엽니다."
 CHI_sco_member: "SCO 회원국"
 CHI_sco_member_desc: "이 나라는 상하이협력기구의 정회원국으로서 기구가 마련한 모든 정치, 경제, 안보 협력 틀에 참여합니다."
 CHI_sco_member_econ_desc: "이 나라는 경제 협력에 중점을 둔 상하이협력기구의 정회원국으로서 동료 회원국들과의 강화된 무역 및 투자 관계를 얻습니다."
 CHI_sco_member_mil_desc: "이 나라는 군사 협력에 중점을 둔 상하이협력기구의 정회원국으로서 합동 훈련과 안보 작전에 참여합니다."
 CHI_sco_member_pol_desc: "이 나라는 정치 협력에 중점을 둔 상하이협력기구의 정회원국으로서 더 강력한 통치 및 전복 방지 체계를 얻습니다."
 CHI_sco_observer: "SCO 옵서버"
 CHI_sco_observer_desc: "이 나라는 상하이협력기구에서 옵서버 지위를 보유하며, SCO 포럼과 제한적인 경제 협력에 대한 접근권을 부여받는 한편 진영 선택에 관한 주권을 유지합니다."
 CHI_scs_chinese_debt: "중국 부채 의존"
 CHI_scs_chinese_debt_desc: "일대일로 대출 채무는 베이징에 부채를 진 파트너의 외교 정책 셈법에 대한 상당한 영향력을 안겨 주었습니다. 부채 상환 요건은 중국의 이익에 적대적인 입장을 취할 정부의 자유를 제약합니다."
 CHI_scs_claimant_under_pressure: "중국의 압박 아래"
 CHI_scs_claimant_under_pressure_desc: "중국의 남중국해 지배는 스프래틀리 제도와 관련된 모든 결정의 비용을 이 정부에 더 크게 만들었습니다. 국내 여론은 타협과 저항 사이에서 갈립니다. 남중국해 결정에 부과되는 정치력 페널티는 베이징이 조건을 정하는 상황에서 어떤 노선이든 잡기가 어렵다는 점을 반영합니다."
 CHI_scs_de_facto_sovereignty: "사실상의 주권"
 CHI_scs_de_facto_sovereignty_desc: "인내심 있는 양자 외교와 누적된 협정을 통해 남중국해에 대한 중국의 주장은 역내 기본값이 되었습니다. 이제 어떤 영유권 주장국도 이 체제에 공식적으로 이의를 제기하지 않으며, 역외 강대국들은 인접 국가들이 받아들인 것을 뒤집을 법적 수단이 없습니다."
 CHI_scs_jdz_revenue: "공동 개발 수익"
 CHI_scs_jdz_revenue_desc: "공동 개발 구역에서의 탄화수소 채굴은 우리와 파트너 국가 모두에게 공유 수익을 창출하고 있습니다. 석유 수입은 협정 기간 동안 합의의 양쪽에 있는 해당 스프래틀리 관련국으로 흘러가, 양국 정부에 양자 체제의 지속에 대한 구체적인 이해관계를 부여하고 대결로의 회귀를 복잡하게 만듭니다."
 CHI_scs_setback: "남중국해 좌절"
 CHI_scs_setback_desc: "대치가 불리하게 끝났거나, 외교 구상이 공개적으로 거부되었거나, 국제 판결이 중국의 주장에 불리하게 나왔습니다. 이 좌절은 남중국해 체제 변수를 낮추며 다른 영유권 주장국들의 기회주의적 대응을 불러올 수 있습니다."
 CHI_sea_eagles_carrier_wing_idea: "$CHI_sea_eagles_carrier_wing$"
 CHI_sea_eagles_carrier_wing_idea_desc: "[CHI_sea_eagles_carrier_wing_idea_tt]"
 CHI_selective_anti_corruption_campaign_idea: "선택적 반부패 운동"
 CHI_selective_anti_corruption_campaign_idea_desc: "표적 기소는 가장 노골적인 부패를 억제하고 경쟁하는 권력 브로커를 제거하지만, 집행의 선별적이고 정치적인 성격은 제도적 불확실성을 낳고 주도성을 억누릅니다."
 CHI_self_reliant_path_idea: "타이항의 성장통"
 CHI_self_reliant_path_idea_desc: "자력갱생의 대가는 불이 꺼진 터빈과 지상에 묶인 비행대로 치러집니다. 초기 WS-10 타이항은 제 야망에 숨이 막혀 날개가 갈라지고 수명은 고작 몇 시간으로 헤아려지며, 엔지니어들이 아직 배우지 못한 모든 교훈의 값을 승무원들이 치릅니다. 설계국들은 결국 해낼 것이지만, 그때까지 함대는 믿음으로 날아갑니다."
 CHI_sez_japanese_investors: "일본 투자자를 위한 경제특구"
 CHI_sez_japanese_investors_desc: "도요타, 소니, 파나소닉을 위한 특별 이권입니다. 차이나 플러스 원 전략은 중국을 떠날 수 없는 곳으로 만들어 역전됩니다."
 CHI_sino_japanese_understanding: "중일 전략적 이해"
 CHI_sino_japanese_understanding_desc: "데탕트의 말 없는 구조입니다. 무역의 흐름, 장관급 회담, 그리고 역사를 기록 보관소에 남겨 두기로 한 묵시적 합의입니다. 중일 간 공격성이 다시 높아지면 영구히 사라집니다."
 CHI_smic_foundry_base: "SMIC 파운드리 기반"
 CHI_smic_foundry_base_desc: "SMIC의 장장 캠퍼스는 국내 팹리스 고객을 위한 검증된 28nm 생산 플랫폼을 제공합니다. 이 파운드리의 전속 생산 능력은 성숙 공정 로직에서 TSMC에 대한 중국의 의존을 줄이고 추가적인 국내 공정 개발의 기준선을 제공합니다."
 CHI_society_department_1: "중앙사회공작부"
 CHI_society_department_1_desc: "2023년에 설립된 사회공작부는 이전에 여러 기관에 흩어져 있던 풀뿌리 사회 단체, NGO, 노동조합, 신방(청원) 제도에 대한 중국공산당의 감독을 통합했습니다. 그 임무는 시민사회가 당이 정한 범위 안에서 운영되도록 하고, 대중의 불만이 독립적인 동원이 아닌 관리되는 통로로 돌려지도록 하는 것입니다. 위원회의 영향력이 커지면 이 부서는 조직적 도달 범위를 넓히고 사회적 압력을 흡수하고 해소하는 메커니즘을 정교화할 수 있습니다."
 CHI_sovereign_wealth_diversification_idea: "중국투자공사 국부펀드 다변화"
 CHI_sovereign_wealth_diversification_idea_desc: "중국투자공사는 외환 보유액을 저수익 미국 국채에서 빼내 글로벌 사모펀드, 인프라, 전략적 지분으로 돌립니다. 이 포트폴리오는 준비 자산보다 높은 수익을 내고 베이징에 해외 자본 시장에서의 구조적 지위를 안겨 줍니다."
 CHI_state_tolerated_boycott: "국가가 묵인한 불매 운동"
 CHI_state_tolerated_boycott_desc: "경찰이 해산시키지 않는 반일 시위입니다. 해산시키기 전까지는 말입니다. 애국적 소비자들은 지출을 돌립니다. 일부 중국 소매업체도 출혈을 입습니다."
 CHI_streamline_the_ranks_idea: "병력 정예화"
 CHI_streamline_the_ranks_idea_desc: "1990년대 후반부터 인민해방군은 수십만 명의 인원을 감축하여, 비대한 대중 동원형 병력을 여단 중심의 더 작은 전문 군대와 맞바꿨습니다. 이 전환은 훈련 파이프라인에 부담을 주고 산업을 묶어 둡니다.\n\n§Y두 조건을 모두 충족하면 이 페널티가 해제됩니다.§!\n§Y-§! 육군이 §Y[?CHI_streamline_div_baseline|0]§!개 사단 미만입니다.\n§Y-§! 보병 무기, 포병, 중형 전차 차체의 비축량이 각각 육군 필요량의 §Y10%§! 이상의 예비분을 보유하고 있습니다."
 CHI_strike_black_sing_red_idea: "타흑창홍"
 CHI_strike_black_sing_red_idea_desc: "수천 명의 관리와 조직범죄 인물이 체포되고 그들의 조직망이 해체되었습니다. 대규모 홍색 문화 행사가 애국적 열기로 공공 영역을 채우며, 사기와 당에 대한 충성심을 높입니다."
 CHI_succession_roadmap: "승계 로드맵"
 CHI_succession_roadmap_desc: "지정 후계자의 선별과 육성은 권력 이양이 경쟁이 아닌 관리 속에 이루어질 것이라는 신호를 당 기관에 보냅니다. 국제 파트너들은 승계 체제를 체제 안정의 증거로 읽습니다. 중국과의 장기 협정에 붙는 정치적 위험 프리미엄은, 적어도 그 체제가 유지되는 동안에는 줄어듭니다."
 CHI_summit_host: "정상회담 주최국"
 CHI_summit_host_desc: "베이징은 민감한 역내 회담을 적극적으로 주최하고 있습니다. 외교적 여력이 크고 압박 수단에는 더 큰 무게가 실립니다."
 CHI_taiwan_strait_pressure_spirit: "양안 압박 태세"
 CHI_taiwan_strait_pressure_spirit_desc: "대만 방공식별구역에 대한 인민해방군 항공기의 정기적 침범, 섬 주변 해역에서의 대규모 해군 훈련, 정교하게 조절된 경제적 강압은 전면전에 이르지 않는 지속적 압박 캠페인을 유지합니다. 이 태세는 타이베이를 상시 경계 상태에 묶어 두고 워싱턴에 결의를 알리며, 우리 군을 단련하고 잠재적 유사시에 대한 대중의 전쟁 지지도를 유지합니다."
 CHI_tech_crackdown_moderate: "기술 단속: 관리된 구조조정"
 CHI_tech_crackdown_moderate_desc: "규제 캠페인은 준법 비용을 부과하고 연구 투자를 둔화시켰지만, 플랫폼 부문은 구조적 붕괴 없이 혼란을 흡수할 만한 규모를 갖추고 있습니다."
 CHI_tech_crackdown_severe: "기술 단속: 심각"
 CHI_tech_crackdown_severe_desc: "플랫폼 부문에 대한 우리의 규제 캠페인은 디지털 경제가 발전의 초기 단계에 있을 때 이를 덮쳤습니다. 서비스 부문 건설이 중단되고, 벤처 캐피털이 빠져나갔으며, 연구 투자가 급격히 위축되었습니다."
 CHI_the_duterte_precedent: "두테르테 선례"
 CHI_the_duterte_precedent_desc: "아세안 정부 수반이 워싱턴에서 돌아서 베이징 쪽으로 기울기로 택한 사례는 역내 전역에 파문을 일으킵니다. 다른 지도자들은 미국이 이를 막지 않았거나 막지 못했음을 관찰하고, 그에 맞춰 자신의 선택지를 저울질합니다."
 CHI_three_represents_debate: "삼개대표 논쟁"
 CHI_three_represents_debate_desc: "당내 이념적 전통주의자들은 사영 기업가의 당원 자격을 허용하자는 장쩌민의 제안에 반발하며, 이는 전위의 계급적 성격을 포기하는 것이라고 주장합니다. 이 내부 논쟁은 정책의 일관성을 일시적으로 해치고 성 단위에서 마찰을 낳습니다."
 CHI_three_represents_debate_tt: "\n이 §Y국가 정신§!은 §Y장쩌민§!이 §Y$CHI_three_represents_codified$§!를 완료하지 못하고 더 이상 §Y국가 지도자§!가 아니게 되면 §R취소§!됩니다."
 CHI_tibet_crackdown_idea: "티베트 보안 작전"
 CHI_tibet_crackdown_idea_desc: "티베트 전역에 걸친 조율된 보안 작전이 분리주의 활동을 억누르고 있으나, 그 대가로 일시적인 안정도 부담을 낳습니다."
 CHI_total_war_himalayan_front: "히말라야 전선의 총력전"
 CHI_total_war_himalayan_front_desc: "모든 공장, 모든 철도 종착역, 모든 예비역이 맥마흔 선 문제를 위해 동원되었습니다."
 CHI_two_centenary_resolve: "두 개의 100년 목표"
 CHI_two_centenary_resolve_desc: "2021년과 2049년이라는 쌍둥이 100주년 기한은 경제 및 사회 계획에 한 세대 단위의 지평을 부과합니다. 인프라 투자, 생산성 목표, 기술 개발 프로그램은 이 이정표들을 향해 정렬됩니다. 이 목표들은 관료적 유인을 구조화하고 모든 부처에 걸친 수십 년 단위의 지속적 계획 주기를 열어 줍니다."
 CHI_united_front_department_1: "중앙통일전선공작부"
 CHI_united_front_department_1_desc: "통일전선공작부는 소수민족, 종교 공동체, 화교 네트워크, 포섭되기 쉬운 외국 정치 인사 등 비당원 집단과의 중국공산당 관계를 관리합니다. 그 임무는 잠재적 반대 세력의 원천을 무력화하고 당의 영향력을 공식 당원 너머로 확장하는 것입니다. 위원회의 영향력이 커질수록 부서의 대외 활동은 더 체계적이 되어, 주변부 행위자들을 중국의 전략적 이익을 위한 믿을 만한 도구로 전환시킵니다."
 CHI_usa_asia_pivot_collapse: "인도-태평양 회귀 붕괴"
 CHI_usa_asia_pivot_collapse_desc: "서울이 베이징의 영향권으로 표류하고 도쿄가 전략적으로 고립되면서 미국의 아시아 재균형의 초석이 무너졌습니다. 전진 배치 계획은 혼란에 빠졌고 동맹의 신뢰는 흔들렸으며, 역전의 정치적 비용이 워싱턴을 짓누릅니다."
 CHI_usa_back_channel_open: "포기 보텀으로의 비밀 채널"
 CHI_usa_back_channel_open_desc: "중난하이와 국무부 사이의 은밀한 회선은 공개 외교 노선 아래에서 위기 소통을 열어 둡니다. 이 채널은 미국의 의도에 대한 정보를 꾸준히 제공하지만, 그 대가로 중국 방첩의 노출을 감수해야 합니다."
 CHI_usa_g2_framework: "G2 체제"
 CHI_usa_g2_framework_desc: "워싱턴과 베이징은 한반도 문제를 둘러싼 강대국 공동 관리 체제를 제도화하여 상설 양자 채널을 통해 정책을 조율하고 있습니다. 이러한 체제는 시장을 안정시키고 소비자 비용을 낮추지만, 미국의 한반도 정책을 중국의 지속적인 호의에 묶어 두게 됩니다."
 CHI_wakhan_buffer_idea: "와칸 완충 지대"
 CHI_wakhan_buffer_idea_desc: "와칸 회랑 전역에 걸친 조율된 반극단화 체제가 극단주의 침투에 맞서 중국의 서부 국경을 강화했습니다."
 CHI_wakhan_buffer_partner_idea: "와칸 대테러 협력국"
 CHI_wakhan_buffer_partner_idea_desc: "베이징과의 공동 국경 통제 규약으로 국내 대테러 역량이 향상되었으며, 외국 정보기관들도 협력을 강화하고 있습니다."
 CHI_war_footing_central_asia: "중앙아시아 전시 체제"
 CHI_war_footing_central_asia_desc: "파미르 고원 서쪽에서의 지속적인 작전에 맞춰 조정된 국가 생산 체제입니다."
 CHI_water_shortage: "물 부족"
 CHI_water_shortage_desc: "화북평원, 황허 유역, 베이징-톈진-허베이 회랑은 합쳐서 국토 경작지의 약 절반을 차지하지만 담수 자원은 5분의 1에도 미치지 못합니다. 북부의 1인당 수자원량은 연간 1,000세제곱미터라는 국제적 물 부족 기준선을 한참 밑돕니다. 산업 폐수와 농업 유출수가 이용 가능한 지표수와 지하수의 상당 부분을 오염시켜 물리적 부족을 더욱 악화시키고 있습니다. 농업이 전체 물 소비의 60퍼센트 이상을 차지하며, 에너지 부문의 냉각 수요가 이미 고갈된 수자원 기반에 부담을 더하고 있습니다.\n§W--------------§!\n§Y$CHI_water_security_initiative$§! 중점으로 잠금 해제되는 §Y$CHI_water_shortage_category$§! 결정 범주의 프로젝트와 §Y$CHI_megaprojects$§! 범주의 남수북조 노선을 완료하면 수자원 보전 진척도가 상승합니다. 이 국가 정신은 완료된 프로젝트가 §Y4§!개가 되면 §G개선§!됩니다."
 CHI_wenchuan_reconstruction_drive_idea: "원촨 재건 사업"
 CHI_wenchuan_reconstruction_drive_idea_desc: "우리는 지진 발생 며칠 만에 10만 명이 넘는 병력과 긴급 구조대를 투입했으며, 이어 1조 위안 규모의 재건 계획을 추진했습니다. 이러한 대규모 투입으로 쓰촨과 인근 지역 전역에서 건설 활동이 지속적으로 급증했습니다."
 CHI_western_hemisphere_protector: "신흥 아메리카의 수호자"
 CHI_western_hemisphere_protector_desc: "우리는 워싱턴의 영향권에서 벗어나려는 라틴아메리카 국가들을 위한 대안적 안보 보증국으로 자리매김했습니다. 영향력이 자유롭게 퍼져 나가며, 정보망은 서방의 대응 공작으로부터 보호받고 있습니다."
 CHI_western_institutional_engagement_idea: "서방 제도권 참여"
 CHI_western_institutional_engagement_idea_desc: "IMF, 세계은행, WTO 운영에 적극 참여함으로써 국제적 신뢰를 쌓고 세계 금융 시장에 대한 접근성을 넓힙니다."
 CHI_wto_implementation_idea: "WTO 이행"
 CHI_wto_implementation_idea_desc: "수년에 걸친 관세 인하, 서비스 부문 개방, 국제 무역 규범과의 정합은 세계 공급망에 대한 우리의 편입을 심화하고 교역 상대국들과의 위상을 높입니다."
 CHI_xinjiang_crackdown_idea: "신장 보안 작전"
 CHI_xinjiang_crackdown_idea_desc: "신장 전역에서 대규모 보안 작전이 진행 중입니다. 저항은 약화되지만 그 대가는 국내 안정도에 돌아옵니다."
 chinese_african_century: "중국-아프리카 세기"
 chinese_african_century_desc: "수십 년간의 FOCAC 투자로 중국은 아프리카 대륙의 필수 불가결한 파트너가 되었으며, 인구 구성과 교역 흐름, 정치적 노선을 재편했습니다."
 chinese_surveillance_systems: "중국식 감시 체계"
 chinese_surveillance_systems_desc: "수입한 안전 도시 플랫폼, 안면 인식 카메라, 디지털 신원 도구가 반체제 세력과 외국 정보 작전에 맞서 정권을 강화합니다."
 eurasian_land_bridge: "유라시아 대륙 횡단 철도"
 eurasian_land_bridge_desc: "태평양에서 대서양까지 끊김 없는 철도와 송유관 회랑이 이어져 있으며, 중국의 표준과 궤간, 통관 절차가 육상 무역의 리듬을 좌우합니다."
 JAP_abandoned_by_ally: "워싱턴에 버림받다"
 JAP_abandoned_by_ally_desc: "결정적인 순간에 미국은 발을 뺐습니다. 동맹은 서류상으로는 유지되지만 신뢰는 사라졌으며, 의회의 모든 정파가 저마다의 결론을 내리고 있습니다."
 JAP_china_engagement: "대중국 관여"
 JAP_china_engagement_desc: "도쿄는 베이징과의 공개적인 정치적 관여를 택하여 전략적 마찰을 줄였으나, 그 대가로 민족주의 진영에서의 신뢰를 잃었습니다."
 JAP_export_pain: "수출 타격"
 JAP_export_pain_desc: "중국 소비자들의 지속적인 불매 운동으로 일본의 수출 산업이 대체 시장을 찾느라 허둥대고 있습니다."
 JAP_jcg_emergency_deployment: "해상보안청 긴급 배치"
 JAP_jcg_emergency_deployment_desc: "일본 해상보안청은 동중국해에서 상시 위기 태세에 들어가 있으며, 경비정을 바다에 유지하기 위해 산업에 부담을 지우고 있습니다."
 JAP_rare_earth_diversification: "희토류 다변화 추진"
 JAP_rare_earth_diversification_desc: "오스트레일리아, 베트남, 국내 재활용을 통해 희토류를 조달하려는 긴급 계획입니다. 단기적으로는 고통이 따릅니다."
 JAP_revisionist_pride: "수정주의적 자부심"
 JAP_revisionist_pride_desc: "전시 기억을 둘러싼 외국의 비판에 대한 공개적인 저항이 국내의 민족주의적 분위기를 굳히고 있습니다."
 JAP_sino_japanese_understanding: "중일 상호 이해"
 JAP_sino_japanese_understanding_desc: "도쿄 공동성명은 베이징과의 정기 협의와 무역 우대를 제도화했습니다."
 JAP_strategic_autonomy_drift: "전략적 자율성 표류"
 JAP_strategic_autonomy_drift_desc: "쿼드가 대화체로 격하되면서 일본은 워싱턴으로부터 조용히 노선을 재조정하고 있습니다."
 NKO_pro_beijing_regime: "친베이징 정권"
 NKO_pro_beijing_regime_desc: "평양의 새 정부는 생존을 베이징에 빚지고 있습니다. 모든 부처에 중국인 고문이 앉아 있고, 모든 트럭은 중국산 석유로 움직입니다."
 pax_sinica: "팍스 시니카"
 pax_sinica_consensus: "인류 운명 공동체"
 pax_sinica_consensus_desc: "우리는 수십 년에 걸친 인내심 있는 투자와 양허성 금융, 제도적 외교를 통해 세계적 우위를 달성했습니다. 국제 질서는 강압이 아니라 이해관계를 통해 우리의 중심성을 인정합니다. 전략적 필요가 아니라 상호 이익으로 우리와 묶인 세계입니다."
 pax_sinica_desc: "우리는 스스로의 방식으로 빚어낸 세계 질서의 정점에 서 있으며, 일대일로는 새로운 국제 체제의 연결 조직입니다."
 petroyuan_settlement: "페트로위안 결제망"
 petroyuan_settlement_desc: "국경 간 에너지 계약이 점점 더 위안화로 결제되면서 우리 산업은 달러 청산 병목에서 벗어나고 국내 건설이 가속화됩니다."
 rmb_reserve_currency: "위안화 기축통화"
 rmb_reserve_currency_desc: "위안화가 세계 기축통화 바구니에 편입되어 수출 시장이 열리고, 우리 은행들은 세계적 회복 대출을 보증할 회복력을 얻게 되었습니다."
 SCO_air_defense_initiator: "SCO 공동 방공 (주도국)"
 SCO_air_defense_initiator_desc: "SCO 공동 방공망의 주도국으로서 이 나라는 회원국 전역의 통합 공중 감시와 미사일 방어를 조율합니다."
 SCO_air_defense_member: "SCO 공동 방공"
 SCO_air_defense_member_desc: "SCO 공동 방공망에 참여하면 공유 레이더 감시망과 대공 방어 협조를 이용할 수 있습니다."
 SCO_cultural_exchange_bonus: "SCO 문화 교류"
 SCO_cultural_exchange_bonus_desc: "학술 및 문화 교류 프로그램이 국경을 넘는 연구 협력을 촉진하고 있습니다."
 SCO_dev_bank_initiator: "SCO 개발은행 (설립국)"
 SCO_dev_bank_initiator_desc: "SCO 개발은행의 설립국으로서 이 나라는 투자 흐름을 지휘하며 저금리 금융에 대한 특권적 접근권을 갖습니다."
 SCO_dev_bank_member: "SCO 개발은행"
 SCO_dev_bank_member_desc: "SCO 개발은행 회원국이 되면 개발 대출과 공동 투자 프로그램을 이용할 수 있습니다."
 SCO_development_assistance: "SCO 개발 지원"
 SCO_development_assistance_2: "[CHI.GetAdjective] 개발 지원"
 SCO_development_assistance_2_desc: "우리는 상하이협력기구의 후원 아래 중국으로부터 절실히 필요했던 개발 지원을 받았습니다."
 SCO_development_assistance_desc: "상하이협력기구가 개발 자원을 이 나라로 투입하고 있습니다."
 SCO_energy_deal_income: "SCO 에너지 파트너십"
 SCO_energy_deal_income_desc: "장기 에너지 공급 협정이 안정적인 수익을 창출하고 있습니다."
 SCO_energy_grid_initiator: "SCO 에너지 그리드 (주도국)"
 SCO_energy_grid_initiator_desc: "SCO 에너지 그리드의 주도국으로서 이 나라는 회원국을 아우르는 통합 전력망을 이끌고 있습니다."
 SCO_energy_grid_member: "SCO 에너지 그리드"
 SCO_energy_grid_member_desc: "SCO 에너지 그리드에 참여하면 공유 전력 기반시설과 에너지 비용 절감 혜택을 받을 수 있습니다."
 SCO_intel_sharing_bonus: "SCO 정보 공유"
 SCO_intel_sharing_bonus_desc: "보안이 확보된 정보 공유 채널이 대테러 협조를 개선하고 있습니다."
 SCO_joint_drill: "SCO 합동 군사 훈련"
 SCO_joint_drill_1: "SCO 합동 훈련 (양자)"
 SCO_joint_drill_1_desc: "SCO 파트너와의 양자 군사 훈련이 전술적 협조를 정교하게 다듬고 있습니다."
 SCO_joint_drill_desc: "SCO 전체 합동 군사 훈련에 참여하여 작전 준비 태세가 향상되고 있습니다."
 SCO_joint_drill_specific: "SCO 합동 훈련 (표적형)"
 SCO_joint_drill_specific_desc: "SCO 파트너와의 표적형 합동 훈련이 특정 작전상의 공백을 보완하고 있습니다."
 SCO_railway_initiator: "범유라시아 철도 (주도국)"
 SCO_railway_initiator_desc: "범유라시아 철도의 추진 주체로서 이 나라는 대륙을 가로지르는 무역 회랑에 대한 최우선 접근권의 혜택을 누립니다."
 SCO_railway_member: "범유라시아 철도"
 SCO_railway_member_desc: "범유라시아 철도는 이 나라를 SCO 권역 전역의 대용량 무역망에 연결합니다."
 SCO_trade_agreement_bonus: "SCO 무역 협정"
 SCO_trade_agreement_bonus_desc: "SCO 틀 안의 양자 무역 체제가 민간 산업 생산량을 끌어올리고 있습니다."
 CHI_airforce_modifier: "중국 인민해방군 공군"
 CHI_airforce_modifier_desc: "전투기, 폭격기, 수송기와 통합 방공망을 운용하는 인민해방군의 공군 부문입니다. 이는 그 교리, 훈련, 장비를 나타냅니다."
 CHI_belt_and_road_initiative_idea: "일대일로 구상"
 CHI_belt_and_road_initiative_idea_desc: "2013년에 시작된 중국의 일대일로 구상은 아시아, 아프리카, 중동, 유럽 전역의 항만 건설, 철도 회랑, 송유관, 발전소, 디지털 기반시설에 자금을 댑니다. 자격을 갖춘 국가가 프로젝트를 신청하면 베이징이 자금을 대고 건설하며, 프로젝트가 하나 완료될 때마다 해당 파트너의 등급과 중국 자신의 위상이 상승합니다.\n\n[CHIGetBRIPortTier][CHIGetBRIRailwayTier][CHIGetBRIPipelineTier][CHIGetBRITelecomTier][CHIGetBRIMineTier][CHIGetBRIPowerplantTier][CHIGetBRIIndustrialZoneTier][CHIGetBRIPrestigeTier]"
 CHI_bri_state_industrial: "일대일로 산업 프로젝트"
 CHI_bri_state_industrial_desc: "과거 중국이 후원한 산업 프로젝트가 현지 공장 용량과 자원 채취를 확대합니다."
 CHI_bri_state_infrastructure: "일대일로 기반시설 프로젝트"
 CHI_bri_state_infrastructure_desc: "과거 일대일로 기반시설 프로젝트가 지역 건설, 조선소 작업, 보급 처리량을 가속합니다."
 CHI_coast_guard_standoff: "해안경비대 대치"
 CHI_coast_guard_standoff_desc: "중국 민병과 일본 해상보안청 사이의 매일같은 충돌이 지역 경제 활동을 위축시킵니다."
 CHI_defense_industry: "중국 방위 산업"
 CHI_defense_industry_desc: "중국의 방위 산업 기반은 육상, 항공, 해상, 전자 생산을 아우르는 대형 국영 복합체를 중심으로 구축되어 있으며, 군과 수출 시장 모두에 공급합니다. 이는 국가의 군수 산업 역량을 나타냅니다."
 CHI_diplomacy_modifier: "중국 외교 네트워크"
 CHI_diplomacy_modifier_desc: "가변적인 외교 태세는 중국 외교 네트워크에 대한 투자 수준에 따라 매월 관계 증가, 무역 관계, 해군 투사력, 보급 효율, 해외 영향력 공작, 정치력에 대한 보너스를 부여하거나 거두어 갑니다."
 CHI_economy_modifier: "중국 경제 모델"
 CHI_economy_modifier_desc: "중국은 국유 기업, 민간 산업, 연속적인 5개년 계획을 통한 중앙 계획을 결합한 사회주의 시장 경제를 운영합니다. 이는 국가의 산업 기반, 재정 정책, 무역 구조를 나타냅니다."
 CHI_jap_industrial_partnerships: "중일 산업 파트너십"
 CHI_jap_industrial_partnerships_desc: "일본과의 체계적인 경제 협력으로 정밀 제조, 첨단 자동차 및 전자 공급망, 민간 원자력 노하우에 대한 접근이 확대됩니다. 이 파트너십은 장갑 성능, 항공 기동성, 해군 속도, 연구 처리량, 산업 생산량 전반에 이득을 가져오지만, 역사적 적대감 때문에 국내 정치적으로 민감한 사안입니다."
 CHI_korea_peninsula_modifier: "한반도 전략"
 CHI_korea_peninsula_modifier_desc: "중국은 한반도와 육지 국경을 맞대고 있으며 이 지역 전반에 걸쳐 정치, 경제, 정보 면에서 관계를 유지합니다. 이는 북동부 측면에서의 관계 관리, 국경 안보, 정보망에 대한 베이징의 운영을 나타냅니다."
 CHI_landforce_modifier: "중국 인민해방군 육군"
 CHI_landforce_modifier_desc: "전구 사령부 체제 아래 합동 병과 여단으로 조직된 인민해방군의 지상 부문입니다. 이는 그 교리, 훈련, 장비를 나타냅니다."
 CHI_navy_modifier: "중국 인민해방군 해군"
 CHI_navy_modifier_desc: "수상함, 잠수함, 항공모함, 해병대로 구성된 인민해방군의 해군 부문입니다. 이는 그 함대 구성, 교리, 작전 반경을 나타냅니다."
 CHI_northeast_revitalisation: "동북 진흥"
 CHI_northeast_revitalisation_desc: "동북 진흥 전략은 랴오닝, 지린, 헤이룽장의 러스트 벨트 성들에 국가 자본을 투입하며 중공업, 에너지 기반시설, 산업 단지 건설을 우선시합니다. 소련 시대의 시설을 현대화하고 새로운 생산 역량을 가동하여 이 지역의 산업 기지로서의 역할을 되살립니다."
 CHI_political_system: "중국 정치 체제"
 CHI_political_system_desc: "중화인민공화국은 중국공산당이 이끄는 일당 국가이며, 민주집중제와 거대한 행정 관료 조직을 중심으로 구성되어 있습니다. 이는 통치 구조, 당 기관, 국가 통제를 나타냅니다."
 CHI_rare_earth_embargoed: "희토류 금수"
 CHI_rare_earth_embargoed_desc: "베이징이 일본에 대한 핵심 희토류 수출을 중단하여 산업 생산이 위축되고 있습니다."
 CHI_rare_earth_embargoed_idea: "희토류 금수"
 CHI_rare_earth_embargoed_idea_desc: "베이징이 핵심 희토류 수출을 중단하여 중국의 정제 능력에 의존하는 방위 및 첨단 기술 산업이 위축되고 있습니다."
 CHI_rural_development: "농촌 개발 계획"
 CHI_rural_development_desc: "도로, 공공시설, 지방 행정 역량을 포함한 농촌 기반시설에 대한 집중 투자가 지정된 현들의 건설 활동을 가속합니다. 이 계획은 도농 소득 격차를 좁히고 불균등한 현대화에서 비롯된 사회적 긴장을 완화합니다."
 JAP_china_market_partnerships: "중국 시장 파트너십"
 JAP_china_market_partnerships_desc: "중국 소비자 시장 및 산업 시장과의 깊은 통합이 일본 공장의 효율을 높이고 소비재 비용을 안정시키며 국내 정치적 결속을 뒷받침합니다. 민간 기반시설 생산 역량이 확대되고, 다른 곳에서 지정학적 마찰이 역풍을 일으키는 와중에도 양자 무역량은 성장을 이어 갑니다."
