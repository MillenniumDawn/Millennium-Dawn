 AFG_ai_Weight_effect_Arms: "彼らが受け入れる意欲はデフォルトで§G強い§!。\n\n [USA.GetName]は以下の場合、我々と同盟を結びにくくなる：\n§R -世界観が違う\n -[AFG.GetName]に対する評価が低い§!"
 AFG_ai_Weight_effect_Airlift: "彼らが受け入れる意欲はデフォルトで§G強い§!。\n\n 以下の場合、彼らは受け入れやすくなる：\n §G-[USA.GetLeader]が不朽の自由作戦を発表した§!\n\n 以下の場合、彼らは受け入れにくくなる：\n §R-世界観が違う\n -我々に対する評価が低い§!"
 AFG_ai_Weight_effect_Iran: "彼らが受け入れる意欲はデフォルトで§G強い§!。\n\n 以下の場合、彼らは受け入れにくくなる：\n §R-世界観が違う\n -我々に対する評価が低い\n -我々がスンナ派である§!"
 AFG_ai_Weight_effect_div_usa: "彼らが受け入れる意欲はデフォルトで§R弱い§!。\n\n 以下の場合、彼らは受け入れやすくなる：\n §G-CIAプレデタードローンが承認される\n -世界観が同じ\n -[AFG.GetNameDefCap]に対する評価が高い§!"
