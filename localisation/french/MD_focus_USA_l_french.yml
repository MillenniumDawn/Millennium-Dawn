 usa_economic_events.406.t: "Quatre jours en novembre"
 usa_economic_events.406.d: "Le conseil d'OpenAI a destitué Sam Altman un vendredi et l'a dit à Microsoft quelques minutes avant l'annonce, avec treize milliards de dollars et toute la feuille de route des modèles de l'autre côté de la table. Le lundi, presque tous les employés d'OpenAI avaient signé une lettre menaçant de partir avec lui, et les administrateurs qui l'avaient licencié négociaient les termes de leur propre remplacement. La lecture commerciale à Redmond est qu'un partenaire dont la gouvernance peut faire cela sans préavis n'est pas un partenaire du tout ; la contre-lecture est que la lettre a prouvé que les gens sont l'actif plutôt que la charte, et que les gens peuvent être embauchés."
 usa_economic_events.406.a: "Soutenir sa réintégration et prendre un siège au conseil"
 usa_economic_events.406.b: "L'embaucher, lui et les signataires, à Redmond"
 usa_economic_events.500.t: "Le pitch des tours frontalières"
 usa_economic_events.500.d: "Anduril Industries, fondée cette année dans le comté d'Orange par Palmer Luckey et une poignée d'anciens de Palantir, dit pouvoir surveiller un tronçon de frontière avec des tours autonomes et un seul logiciel plutôt qu'un contrat d'intégration d'une décennie. La dernière tentative exactement de cela, SBInet, a été annulée en 2011 après un milliard de dollars. Anduril propose de construire les tours d'abord et de les vendre ensuite, ce qui n'est pas la façon dont le département achète quoi que ce soit."
 usa_economic_events.500.a: "Financer les tours et les laisser construire d'abord"
 usa_economic_events.500.b: "Garder la surveillance frontalière dans le programme de référence"
 usa_economic_events.501.t: "Moins cher que la cible"
 usa_economic_events.501.d: "De petits drones apparaissent au-dessus des bases et la réponse existante est un missile sol-air qui coûte plus que tout ce qu'il abat. L'Anvil d'Anduril est un drone qui éperonne d'autres drones et Lattice le logiciel qui les trouve. L'acheter, c'est accepter un intercepteur que personne n'a certifié contre une menace que les services n'ont pas encore convenu de classer."
 usa_economic_events.501.a: "Acheter l'intercepteur bon marché"
 usa_economic_events.501.b: "Répondre aux drones par la défense aérienne en couches que nous finançons déjà"
 usa_economic_events.502.t: "Acheter l'usine ou acheter les pièces"
 usa_economic_events.502.d: "Anduril a racheté Area-I et ses effets lancés Altius, et veut posséder les cellules, la pile d'autonomie et les lignes de production plutôt que d'intégrer celles des autres. L'intégration verticale est la seule façon de pricer contre les maîtres d'œuvre. Cela signifie aussi une start-up de défense demandant à être financée comme fabricant avant d'avoir fabriqué quoi que ce soit en volume."
 usa_economic_events.502.a: "Retourner Anduril en tant que fabricant"
 usa_economic_events.502.b: "La garder comme intégrateur achetant à la base d'approvisionnement existante"
 usa_economic_events.503.t: "L'Ukraine prend livraison"
 usa_economic_events.503.d: "Les munitions rôdeuses Altius-600 et le kit anti-drone d'Anduril partent en Ukraine dans les paquets de prélèvement, et les unités qui les utilisent remontent plus vite qu'aucun polygone d'essai américain. Pousser le volume à l'est achète des données de combat que personne d'autre n'a. Cela dépense aussi des stocks pour lesquels les services n'ont pas fini d'écrire la doctrine."
 usa_economic_events.503.a: "Pousser le volume vers l'Ukraine et prendre les données"
 usa_economic_events.503.b: "Garder les stocks pour les unités américaines"
 usa_economic_events.504.t: "Un combattant sans prime"
 usa_economic_events.504.d: "L'Air Force a choisi le Fury d'Anduril et General Atomics pour le premier incrément des Collaborative Combat Aircraft, et a laissé Lockheed Martin, Boeing et Northrop Grumman dehors. Une entreprise qui n'existait pas il y a dix ans construit désormais un avion de combat. Les maîtres d'œuvre argumentent que la base industrielle qui construit tout le reste ne peut être affamée pour prouver un point sur les marchés publics."
 usa_economic_events.504.a: "Laisser le nouveau venu prendre le programme"
 usa_economic_events.504.b: "Garder les maîtres d'œuvre établis à la tête du programme"
 usa_economic_events.505.t: "Ce qu'Anduril est devenu"
 usa_economic_events.505.d: "Une décennie de tours, d'intercepteurs, d'usines et d'un avion de combat a tranché ce qu'est Anduril et ce qu'elle a changé à la façon dont l'Amérique achète des armes : si l'arsenal est possédé ou loué, et si les maîtres d'œuvre se tiennent encore entre le Pentagone et ceux qui construisent."
 usa_economic_events.505.a: "Un arsenal que nous possédons en propre"
 usa_economic_events.505.b: "Un arsenal marchand vendant à qui remplit les critères"
 usa_economic_events.505.c: "Un maître d'œuvre logiciel avec les usines de quelqu'un d'autre"
 usa_economic_events.505.e: "Encore un fournisseur financé par le capital-risque"
 USA_anduril_autonomous_arsenal: "Arsenal autonome"
 USA_anduril_autonomous_arsenal_desc: "Anduril construit ses propres cellules, son autonomie et ses lignes de production sur le sol américain, et le Pentagone achète des systèmes finis plutôt que des programmes d'intégration. Une capacité qui appartient au pays ne peut être re-tarifée par un fournisseur."
 USA_anduril_merchant_arsenal: "Arsenal marchand"
 USA_anduril_merchant_arsenal_desc: "Anduril possède les usines mais vend à tout acheteur qualifié, allié comme intérieur. Le volume tient les lignes au chaud et les relations d'export ouvertes, au prix de toute prétention à la priorité."
 USA_anduril_software_prime: "Logiciel Prime"
 USA_anduril_software_prime_desc: "Anduril a gagné les programmes sans posséder les usines, si bien que Lattice et la pile d'autonomie chevauchent du matériel construit par d'autres. C'est rapide et c'est bon marché, et cela dépend de fournisseurs qui répondent à leurs propres actionnaires."
 USA_anduril_venture_supplier: "Fournisseur financé par du capital-risque"
 USA_anduril_venture_supplier_desc: "Anduril reste un fournisseur parmi d'autres, vendant des composants dans des programmes que les maîtres d'œuvre établis mènent encore. L'ingénierie est réelle ; le levier ne l'est pas."
