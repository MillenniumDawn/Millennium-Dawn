 RAJ_focus_mao_how_to_cancel: "Pour éviter la rébellion, vous devez écraser les maoïstes !"
 RAJ_mao_reb.4.t: "Manifestations anti-gouvernementales"
 RAJ_mao_reb.4.d: "Une vague de manifestations communistes anti-gouvernementales a balayé l’Inde, alors que les citoyens expriment leur mécontentement et exigent des changements. Les manifestations, organisées par divers groupes communistes, ont attiré des foules massives dans les grandes villes et villages. Les manifestants soulèvent des préoccupations sur des questions telles que les inégalités de revenus, le chômage et les politiques perçues comme autoritaires du gouvernement. Ils appellent à une société plus inclusive, où les ressources sont distribuées équitablement et les droits de la classe ouvrière sont protégés."
 RAJ_mao_reb.4.a: "Écrasez-les avec la police !"
 RAJ_mao_reb.5.t: "Révolution communiste !"
 RAJ_mao_reb.5.d: "Dans un tournant stupéfiant, l'Inde est au bord d'une guerre civile alors que les tensions entre le gouvernement et les factions communistes atteignent un sommet. Le pays a été saisi de protestations violentes et d'affrontements, les deux camps refusant de céder. Le gouvernement indien a mis en œuvre des politiques controversées qui ont attiré la colère des partis communistes. Le choc des idéologies et des visions opposées pour l'avenir du pays a dégénéré en un conflit qui s'intensifie."
 RAJ_mao_reb.5.a: "Que les dieux sauvent l’Inde, car personne d’autre ne le peut."
 indian_event.41.t: "Tata Tea paie 271 millions de livres sterling pour Tetley"
 indian_event.41.d: "Tetley, célèbre pour ses publicités télévisées mettant en scène les « Tetley tea folk », a été racheté par Tata Tea, la plus grande entreprise intégrée de thé au monde. La compagnie indienne a payé 271 millions de livres sterling pour Tetley, une entreprise privée qui produit le thé le plus populaire en Grande-Bretagne et la deuxième marque de thé mondiale. L’accord, conclu après des mois de négociations, est financé par une combinaison de fonds propres et de dettes. Tata Tea, qui fait partie du plus grand groupe industriel indien Tata, a déclaré que la direction actuelle de Tetley continuera à gérer les affaires quotidiennes de l’entreprise."
 indian_event.41.a: "Intéressant"
 indian_event.42.t: "Visite du président américain en Inde"
 indian_event.42.d: "Le Premier ministre indien Atal Bihari Vajpayee a salué la pression exercée par le président américain sur Islamabad. C’était la première fois qu’un président américain se rangeait ouvertement du côté de l’Inde contre le Pakistan en temps de guerre. Avant le voyage du président américain, la communauté du renseignement américain avait offert une estimation glaçante : il y avait une chance sur deux qu’une guerre à grande échelle éclate entre les deux puissances nucléaires dans la prochaine décennie. Le président américain a été accueilli comme une rock star à travers l’Inde, avec des arrêts à Delhi, Hyderabad, Jaipur et Mumbai. Il a reçu une ovation debout en s’adressant au Parlement. Les foules étaient énormes partout. Vajpayee a rendu la visite plus tard cette année-là avec un dîner d’État à la Maison Blanche. Après des décennies de relations tendues, l’Inde et l’Amérique ont tourné une page."
 indian_event.42.a: "Salutations, amis."
 indian_event.43.t: "Le scandale des matchs truqués"
 indian_event.43.d: "L’un des plus grands scandales de matchs truqués dans l’histoire du cricket a eu lieu lorsque la police de Delhi a révélé avoir capturé des conversations douteuses entre Sanjay Chawla et Hansie Cronje. Les fans idolâtraient Cronje, un joueur de cricket sud-africain populaire et talentueux. Cependant, il était controversé en raison de son association avec Sanjay Chawla, identifié comme un participant bien connu dans le cercle des paris indiens. Dans un premier temps, Cronje a nié toutes les accusations de matchs truqués en pleurant, mais cela a été suivi par son interrogatoire sous contre-interrogatoire."
 indian_event.43.a: "Interdisez-lui de jouer à nouveau !"
 indian_event.44.t: "La population indienne atteint un milliard"
 indian_event.44.d: "La population de l’Inde a officiellement atteint 1 milliard d’habitants avec la naissance d’une petite fille. Les responsables gouvernementaux ont décidé qu’un bébé né à l’hôpital Safdarjang de Delhi marquerait ce jalon. Astha Arora a été désignée comme le milliardième bébé de l’Inde. Anjana Arora, la mère d’Astha, a parlé à Witness du jour où sa famille s’est retrouvée sous les feux des médias."
 indian_event.44.a: "Est-ce une bonne ou une mauvaise chose ?"
 indian_event.45.t: "Attaque contre le Parlement indien"
 indian_event.45.d: "Un commando suicide a pris d’assaut le complexe du Parlement indien, tuant sept personnes avant de mourir dans une attaque sans précédent contre le siège du pouvoir de la plus grande démocratie mondiale. Selon des témoins, cinq individus ont envahi le Parlement, sautant d’une voiture et attaquant les gardes de sécurité après avoir apparemment pénétré dans le complexe avec un faux laissez-passer. L’un des intrus s’est fait exploser à l’entrée principale des chambres du Parlement. « J’ai entendu un bruit semblable à un pétard près de l’entrée, puis j’ai vu des gens courir dans tous les sens », a déclaré Kharbala Sain, membre du Parlement, devant le grandiose Parlement en grès, conçu par Sir Edwin Lutyens sous la domination coloniale britannique. « J’ai vu beaucoup de gens tirer en même temps. Je ne pouvais pas distinguer qui était qui. Je ne comprenais pas qui étaient les terroristes et qui étaient les policiers », a ajouté le député. Aucun groupe n’a immédiatement revendiqué l’attaque. L’un des assaillants est mort en faisant détoner des explosifs attachés à sa taille. Le Premier ministre indien, qui n’était pas dans le complexe à ce moment-là, a déclaré à la télévision que la bataille de l’Inde contre le terrorisme avait atteint sa phase finale, tandis que ses ministres de la Défense et de l’Intérieur ont promis une réponse ferme. Le ministre de l’Intérieur, LK Advani, a affirmé : « Nous liquiderons les terroristes et leurs sponsors, qui qu’ils soient, où qu’ils soient. » Les premières spéculations se sont tournées vers des militants islamistes luttant contre la domination indienne dans l’État de Jammu-et-Cachemire, où 38 personnes sont mortes dans une attaque suicide contre l’assemblée de l’État il y a deux mois. Si cela se confirme, cela augmenterait les tensions avec le Pakistan, accusé par New Delhi de soutenir le militantisme cachemiri. Le président pakistanais Pervez Musharraf a rapidement condamné l’attaque et envoyé un message de sympathie à M. Vajpayee."
 indian_event.45.a: "Maudits salauds !"
 indian_event.46.t: "Delhi obtient un métro de classe mondiale"
 indian_event.46.d: "Le vice-Premier ministre LK Advani a donné le coup d’envoi au premier train très attendu du métro de Delhi pour un essai au dépôt de métro de Shastri Park, aujourd’hui, en présence d’une foule enthousiaste. Ce métro de classe mondiale, décrit par la ministre en chef de Delhi, Sheila Dikshit, comme un projet qui n’a aucune chance de s’arrêter, devrait commencer à fonctionner avant Noël."
 indian_event.46.a: "Super"
 RAJ_indian_space_programme: "Organisation indienne de recherche spatiale"
 RAJ_indian_space_programme_desc: "L’Organisation indienne de recherche spatiale, communément appelée ISRO, est l’agence spatiale nationale de l’Inde. Elle agit en tant que principal organe de recherche et développement du Département de l’espace, directement supervisé par le Premier ministre indien, tandis que le président de l’ISRO est également l’exécutif du Département de l’espace."
 RAJ_indian_space_endeavors: "Indian Space Endevours"
 RAJ_indian_space_endeavors_desc: "Nous sommes au XXIe siècle, l’ère de la haute technologie et de la prospérité. Récemment, la guerre froide s’est terminée, période durant laquelle différentes superpuissances – l’URSS et les États-Unis – se sont disputées l’exploration spatiale. L’Inde était en retard sur elles, mais cette fois, nous ne manquerons pas l’opportunité de rattraper les autres puissances spatiales dans l’exploration de l’espace."
 RAJ_irs_series: "IRS indien"
 RAJ_irs_series_desc: "Les satellites indiens de télédétection sont des satellites d’observation de la Terre de l’Inde. Ils constituent la plus grande collection de satellites de télédétection à usage civil en activité aujourd’hui, fournissant des services de télédétection."
 RAJ_insat_navic: "Série INSAT"
 RAJ_insat_navic_desc: "Le système national de satellites indien est le système de télécommunication du pays. Il s’agit d’une série de satellites géostationnaires polyvalents construits et lancés par l’ISRO pour répondre aux besoins en télécommunications, radiodiffusion, météorologie et recherche et sauvetage. Depuis l’introduction du premier en 1983, INSAT est devenu le plus grand système de communication domestique dans la région Asie-Pacifique."
 RAJ_Chandrayaan: "Projet Chandrayaan"
 RAJ_Chandrayaan_desc: "Chandrayaan-1 est la première sonde lunaire indienne dans le cadre du programme Chandrayaan. Elle a été lancée par l’Organisation indienne de recherche spatiale (ISRO) en octobre 2008 et sera opérationnelle jusqu’en août 2009."
 RAJ_financing_of_private_space_companies: "Soutenir les initiatives privées"
 RAJ_financing_of_private_space_companies_desc: "Bien que l’industrie spatiale indienne soit principalement dirigée par l’Organisation indienne de recherche spatiale nationale, elle inclut plus de 500 fournisseurs privés et divers organismes du Département de l’espace dans tous les aspects commerciaux, de recherche et arbitraires."
 RAJ_chandrayan_to_moon: "Chandrayaan-3 vers la Lune !"
 RAJ_chandrayan_to_moon_desc: "Chandrayaan-3 est la troisième mission d’exploration lunaire indienne dans le cadre du programme Chandrayaan de l’Organisation indienne de recherche spatiale. Elle comprend un atterrisseur nommé Vikram et un rover nommé Pragyan, similaires à ceux de la mission Chandrayaan-2."
 RAJ_Gaganyan: "Vaisseau spatial orbital indien"
 RAJ_Gaganyan_desc: "Gaganyaan est un vaisseau spatial orbital habité indien destiné à être le vaisseau de base du programme indien de vols spatiaux habités. Le vaisseau est conçu pour transporter trois personnes, et une version améliorée prévue sera équipée de capacités de rendez-vous et d’amarrage."
 RAJ_Human_Spaceflight_Programme: "Programme de vols spatiaux habités"
 RAJ_Human_Spaceflight_Programme_desc: "Le programme indien de vols spatiaux habités est un programme en cours de l’Organisation indienne de recherche spatiale visant à développer la technologie nécessaire pour lancer des vaisseaux spatiaux orbitaux habités en orbite terrestre basse."
 RAJ_astrosat: "ASTROSAT"
 RAJ_astrosat_desc: "Astrosat est le premier télescope spatial multi-longueurs d’onde dédié de l’Inde."
 RAJ_energy_idea: "Énergie nucléaire indienne"
 indian_event.47.t: "La terreur ravage Mumbai"
 indian_event.47.d: "Des groupes coordonnés de tireurs ont semé la mort et la destruction dans des sites touristiques du centre financier indien de Mumbai tard mercredi et tôt aujourd’hui, tuant au moins 101 personnes et blessant plus de 200 autres tout en semblant cibler des citoyens américains et britanniques pour en faire des otages. Les assaillants ont balayé deux hôtels de luxe prisés des étrangers, le Taj Mahal Palace et l’Oberoi, tirant avec des armes automatiques, lançant des grenades et provoquant une fuite paniquée des clients cherchant à se mettre en sécurité. Certains invités sont restés piégés dans les hôtels pendant des heures, alors qu’une série d’explosions a mis le feu à l’hôtel Taj, un monument emblématique le long du front de mer de Mumbai. Bien que Mumbai ait été le théâtre de plusieurs attaques terroristes ces dernières années, les experts ont déclaré que les assauts de mercredi nécessitaient un degré de reconnaissance et de planification jamais vu auparavant. L’ampleur et la synchronisation des attaques suggéraient l’implication probable de commandants expérimentés, certains évoquant une possible implication étrangère. Lancés après la tombée de la nuit, les terroristes ont frappé presque simultanément à l’aéroport domestique de la ville, une gare ferroviaire et ont ouvert le feu au Leopold Café, un restaurant populaire auprès des étrangers. Jusqu’à 16 groupes ont attaqué neuf sites dans le sud de cette métropole surpeuplée de 19 millions d’habitants."
 indian_event.47.a: "Horrible"
 indian_event.48.t: "Le mouvement contre la corruption"
 indian_event.48.d: "Le mouvement indien contre la corruption, populairement connu sous le nom d’Anna Andolan, était une série de manifestations et de protestations à travers l’Inde qui a débuté en 2011 dans le but d’établir une législation forte et une application rigoureuse contre la corruption politique perçue comme endémique. Le mouvement a été nommé parmi les « 10 meilleures nouvelles de 2011 » par le magazine Time. Il a gagné en ampleur à partir du 5 avril 2011, lorsque l’activiste anti-corruption Anna Hazare a entamé une grève de la faim au monument Jantar Mantar à New Delhi. Le mouvement visait à réduire la corruption dans le gouvernement indien par l’introduction du projet de loi Jan Lokpal. Un autre objectif, dirigé par Ramdev, Kiran Bedi, Arvind Kejriwal et d’autres, était le rapatriement de l’argent noir des banques étrangères. Les manifestants de masse se concentraient sur des questions juridiques et politiques, notamment la corruption politique, la kleptocratie et d’autres formes de corruption. Le mouvement était principalement basé sur une résistance civile non violente et comprenait des manifestations, des marches, des actes de désobéissance civile, des grèves de la faim, des rassemblements et l’utilisation des réseaux sociaux pour organiser, communiquer et sensibiliser. Les protestations étaient non partisanes et la plupart des manifestants étaient hostiles aux tentatives des partis politiques d’utiliser le mouvement pour renforcer leur propre agenda politique."
 indian_event.48.a: "Intéressant"
 indian_event.49.t: "Audience au Parlement"
 indian_event.49.d: "Récemment, le mouvement LGBT a gagné de plus en plus de popularité dans la société indienne. Le Parlement indien a tenu de nombreuses discussions sur la légalisation des droits LGBT dans le pays, et lors d’une réunion récente, la question a été soulevée à nouveau. On estime que le moment est venu de prendre une décision finale : légaliser les droits LGBT en Inde ou les maintenir sous interdiction et ne plus jamais revenir sur la question. Que choisirons-nous ?"
 indian_event.49.a: "Le LGBT, quelle blague ?"
 indian_event.49.b: "Nous autorisons la légalisation des droits LGBT."
 indian_event.50.t: "Attentat de Pulwama"
 indian_event.50.d: "L'attentat de Pulwama de 2019 a eu lieu le 14 février 2019, lorsqu'un convoi de véhicules transportant du personnel de sécurité indien sur l'autoroute nationale Jammu-Srinagar a été attaqué par un kamikaze à bord d'un véhicule à Lethapora, dans le district de Pulwama de l'ancien État de Jammu-et-Cachemire. L'attaque a tué 40 personnels de la Central Reserve Police Force (CRPF) indienne ainsi que l'auteur — Adil Ahmad Dar — un jeune Cachemiri local du district de Pulwama. La responsabilité de l'attaque a été revendiquée par le groupe terroriste islamiste basé au Pakistan, Jaish-e-Mohammed. L'Inde a blâmé le Pakistan voisin pour l'attaque, tandis que ce dernier l'a condamnée et a nié tout lien avec elle. L'attaque a porté un coup sévère aux relations indo-pakistanaises, aboutissant par conséquent à l'affrontement militaire indo-pakistanais de 2019. Par la suite, les enquêtes indiennes ont identifié 19 accusés"
 indian_event.50.a: "Oh, merde."
 indian_event.51.t: "La station indienne Chandrayaan-3 a atterri avec succès sur la Lune !"
 indian_event.51.d: "La station interplanétaire automatique indienne Chandrayaan-3 a réussi un atterrissage en douceur sur la Lune. La descente a été diffusée en direct par l'Organisation indienne de recherche spatiale. Elle peut être vue sur YouTube. L'atterrissage en douceur a eu lieu approximativement au pôle Sud de la Lune. Ainsi, l'Inde est entrée dans le club d'élite des puissances spatiales capables d'un atterrissage en douceur à la surface lunaire. Auparavant, cette possibilité avait été démontrée par l'URSS, les États-Unis et la Chine."
 indian_event.51.a: "Merveilleux !"
