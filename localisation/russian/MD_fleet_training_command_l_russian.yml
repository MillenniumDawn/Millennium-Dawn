 MD_ftc_cost_800_blocked: "£navy_experience §R800§!"
 MD_ftc_fully_upgraded: "Полностью улучшено"
 MD_ftc_exercise_capital: "Учения авианосной и надводной группы"
 MD_ftc_exercise_capital_desc: "Подготовка авианосной ударной группы и отработка надводного боя. Совместно отрабатываются циклы полётов с палубы, координация ПВО и пополнение запасов в море."
 MD_ftc_ex_capital_short: "Освоение доктрины крупных кораблей на 90 дней."
 MD_ftc_exercise_escort: "Учения сил охранения"
 MD_ftc_exercise_escort_desc: "Учения по охранению конвоев и противолодочной обороне для фрегатов, корветов и патрульных катеров. В море отрабатываются работа с гидроакустикой, взаимодействие с вертолётами и удержание места в строю."
 MD_ftc_ex_escort_short: "Освоение доктрины сил охранения на 90 дней."
 MD_ftc_exercise_submarine: "Учения подводных сил"
 MD_ftc_exercise_submarine_desc: "Учения по патрулированию и торпедным стрельбам для подводных сил. Экипажи отрабатывают малошумное движение, уклонение от надводных кораблей охранения и согласованные атаки."
 MD_ftc_ex_submarine_short: "Освоение подводной доктрины на 90 дней."
 MD_ftc_exercise_operations: "Учения по боеготовности флота"
 MD_ftc_exercise_operations_desc: "Общефлотский цикл повышения боеготовности, охватывающий управление, логистику и борьбу за живучесть. Корабли учатся действовать вдали от своих баз."
 MD_ftc_ex_operations_short: "Освоение морских операций на 90 дней."
 MD_ftc_staff_course_name: "Штабной курс"
 MD_ftc_staff_course_short: "Каждый командующий флотом получает опыт, а один может получить новую черту."
 MD_ftc_staff_course_cooldown: "Идёт штабной курс"
 MD_ftc_staff_course_cooldown_desc: "Офицеры штаба флота проходят штабной курс. Следующий набор откроется, когда этот выпуск завершит обучение."
 MD_ftc_flag_officer_course_name: "Курс флаг-офицеров"
 MD_ftc_flag_officer_course_short: "Один командующий флотом повышает уровень навыка."
 MD_ftc_flag_officer_course_cooldown: "Идёт курс флаг-офицеров"
 MD_ftc_flag_officer_course_cooldown_desc: "Старшие офицеры завершают командную подготовку к флагманскому званию. Новый курс можно начать после выпуска этого."
 MD_ftc_rnd_liaison_name: "Связь с морскими НИОКР"
 MD_ftc_rnd_liaison_short: "Даёт очко прорыва в морских исследованиях."
 MD_ftc_rnd_liaison_cooldown: "Связь с морскими НИОКР действует"
 MD_ftc_rnd_liaison_cooldown_desc: "Офицеры флота прикомандированы к военно-морским научным учреждениям и превращают опыт операций в требования к разработкам."
 MD_ftc_academy_name: "Учебная программа"
 MD_ftc_academy_short: "Открывает дух военно-морской академии, усиливает учения."
 MD_ftc_academy_level_text: "Уровень [?ROOT.MD_ftc_academy_level|0]/3"
 MD_ftc_fleet_name: "Программа боеготовности флота"
 MD_ftc_fleet_short: "Открывает дух флота для вашей общей доктрины."
 MD_ftc_fleet_level_text: "Уровень [?ROOT.MD_ftc_fleet_level|0]/3"
 MD_ftc_command_name: "Центр морской доктрины"
 MD_ftc_command_short: "Открывает дух военно-морского командования для вашей общей доктрины."
 MD_ftc_command_level_text: "Уровень [?ROOT.MD_ftc_command_level|0]/3"
 MD_ftc_academy_blue_water_1: "Школа авианосной войны I"
 MD_ftc_academy_blue_water_1_desc: "Обучение полётным операциям с палубы, координации авиакрыла и командованию авианосной группой готовит будущих командиров оперативных соединений."
 MD_ftc_academy_blue_water_2: "Школа авианосной войны II"
 MD_ftc_academy_blue_water_2_desc: "$MD_ftc_academy_blue_water_1_desc$"
 MD_ftc_academy_blue_water_3: "Школа авианосной войны III"
 MD_ftc_academy_blue_water_3_desc: "$MD_ftc_academy_blue_water_1_desc$"
 MD_ftc_academy_green_water_1: "Школа прибрежной войны I"
 MD_ftc_academy_green_water_1_desc: "Офицеры прибрежного флота изучают действия на мелководье, противоминные меры и оборону подходов к гаваням."
 MD_ftc_academy_green_water_2: "Школа прибрежной войны II"
 MD_ftc_academy_green_water_2_desc: "$MD_ftc_academy_green_water_1_desc$"
 MD_ftc_academy_green_water_3: "Школа прибрежной войны III"
 MD_ftc_academy_green_water_3_desc: "$MD_ftc_academy_green_water_1_desc$"
 MD_ftc_academy_jeune_ecole_1: "Школа ударных катеров I"
 MD_ftc_academy_jeune_ecole_1_desc: "Офицеры осваивают тактику ракетных катеров, патрульных кораблей и корветов, основанную на скорости и массированном применении лёгких сил."
 MD_ftc_academy_jeune_ecole_2: "Школа ударных катеров II"
 MD_ftc_academy_jeune_ecole_2_desc: "$MD_ftc_academy_jeune_ecole_1_desc$"
 MD_ftc_academy_jeune_ecole_3: "Школа ударных катеров III"
 MD_ftc_academy_jeune_ecole_3_desc: "$MD_ftc_academy_jeune_ecole_1_desc$"
 MD_ftc_academy_guerre_de_course_1: "Курс командиров подлодок I"
 MD_ftc_academy_guerre_de_course_1_desc: "Будущие командиры подводных лодок учатся скрытному патрулированию, выходу в атаку и перехвату торгового судоходства."
 MD_ftc_academy_guerre_de_course_2: "Курс командиров подлодок II"
 MD_ftc_academy_guerre_de_course_2_desc: "$MD_ftc_academy_guerre_de_course_1_desc$"
 MD_ftc_academy_guerre_de_course_3: "Курс командиров подлодок III"
 MD_ftc_academy_guerre_de_course_3_desc: "$MD_ftc_academy_guerre_de_course_1_desc$"
 MD_ftc_fleet_blue_water_1: "Экспедиционная логистика I"
 MD_ftc_fleet_blue_water_1_desc: "Суда снабжения флота, пополнение запасов на ходу и планы передового базирования увеличивают радиус действия развёрнутых оперативных соединений."
 MD_ftc_fleet_blue_water_2: "Экспедиционная логистика II"
 MD_ftc_fleet_blue_water_2_desc: "$MD_ftc_fleet_blue_water_1_desc$"
 MD_ftc_fleet_blue_water_3: "Экспедиционная логистика III"
 MD_ftc_fleet_blue_water_3_desc: "$MD_ftc_fleet_blue_water_1_desc$"
 MD_ftc_fleet_green_water_1: "Региональный контроль на море I"
 MD_ftc_fleet_green_water_1_desc: "Постоянные системы охранения и патрулирования обеспечивают безопасность морских путей и прибрежных подходов у своих вод."
 MD_ftc_fleet_green_water_2: "Региональный контроль на море II"
 MD_ftc_fleet_green_water_2_desc: "$MD_ftc_fleet_green_water_1_desc$"
 MD_ftc_fleet_green_water_3: "Региональный контроль на море III"
 MD_ftc_fleet_green_water_3_desc: "$MD_ftc_fleet_green_water_1_desc$"
 MD_ftc_fleet_jeune_ecole_1: "Рассредоточенные базы флотилий I"
 MD_ftc_fleet_jeune_ecole_1_desc: "Малые корабли действуют из множества рассредоточенных портов и укрытий, что облегчает обслуживание и снижает уязвимость для одного удара."
 MD_ftc_fleet_jeune_ecole_2: "Рассредоточенные базы флотилий II"
 MD_ftc_fleet_jeune_ecole_2_desc: "$MD_ftc_fleet_jeune_ecole_1_desc$"
 MD_ftc_fleet_jeune_ecole_3: "Рассредоточенные базы флотилий III"
 MD_ftc_fleet_jeune_ecole_3_desc: "$MD_ftc_fleet_jeune_ecole_1_desc$"
 MD_ftc_fleet_guerre_de_course_1: "Штаб крейсерской войны I"
 MD_ftc_fleet_guerre_de_course_1_desc: "Специальный штаб планирует отслеживание торгового судоходства и постановку мин на морских путях."
 MD_ftc_fleet_guerre_de_course_2: "Штаб крейсерской войны II"
 MD_ftc_fleet_guerre_de_course_2_desc: "$MD_ftc_fleet_guerre_de_course_1_desc$"
 MD_ftc_fleet_guerre_de_course_3: "Штаб крейсерской войны III"
 MD_ftc_fleet_guerre_de_course_3_desc: "$MD_ftc_fleet_guerre_de_course_1_desc$"
 MD_ftc_command_blue_water_1: "Командование авианосных ударных сил I"
 MD_ftc_command_blue_water_1_desc: "Объединённое командование сводит авиакрылья авианосцев и корабли охранения в единую ударную силу."
 MD_ftc_command_blue_water_2: "Командование авианосных ударных сил II"
 MD_ftc_command_blue_water_2_desc: "$MD_ftc_command_blue_water_1_desc$"
 MD_ftc_command_blue_water_3: "Командование авианосных ударных сил III"
 MD_ftc_command_blue_water_3_desc: "$MD_ftc_command_blue_water_1_desc$"
 MD_ftc_command_green_water_1: "Объединённое береговое командование I"
 MD_ftc_command_green_water_1_desc: "Береговые радары, авиация и боевые корабли подчиняются единому оперативному центру, что улучшает обнаружение и охранение."
 MD_ftc_command_green_water_2: "Объединённое береговое командование II"
 MD_ftc_command_green_water_2_desc: "$MD_ftc_command_green_water_1_desc$"
 MD_ftc_command_green_water_3: "Объединённое береговое командование III"
 MD_ftc_command_green_water_3_desc: "$MD_ftc_command_green_water_1_desc$"
 MD_ftc_command_jeune_ecole_1: "Командование тактики роя I"
 MD_ftc_command_jeune_ecole_1_desc: "Доктрина массированных ночных атак лёгких кораблей с последующим быстрым выходом из боя."
 MD_ftc_command_jeune_ecole_2: "Командование тактики роя II"
 MD_ftc_command_jeune_ecole_2_desc: "$MD_ftc_command_jeune_ecole_1_desc$"
 MD_ftc_command_jeune_ecole_3: "Командование тактики роя III"
 MD_ftc_command_jeune_ecole_3_desc: "$MD_ftc_command_jeune_ecole_1_desc$"
 MD_ftc_command_guerre_de_course_1: "Командование подводной войны I"
 MD_ftc_command_guerre_de_course_1_desc: "Центральное командование подводных сил определяет районы патрулирования, торпедную доктрину и противолодочную разведку."
 MD_ftc_command_guerre_de_course_2: "Командование подводной войны II"
 MD_ftc_command_guerre_de_course_2_desc: "$MD_ftc_command_guerre_de_course_1_desc$"
 MD_ftc_command_guerre_de_course_3: "Командование подводной войны III"
 MD_ftc_command_guerre_de_course_3_desc: "$MD_ftc_command_guerre_de_course_1_desc$"
 MD_ftc_tt_fully_upgraded: "§GПолностью улучшено§!"
 MD_ftc_tt_mastery_0_5: "§G+0,5§!"
 MD_ftc_tt_mastery_0_75: "§G+0,75§!"
 MD_ftc_tt_mastery_1_0: "§G+1,0§!"
 MD_ftc_tt_mastery_1_25: "§G+1,25§!"
 MD_ftc_ex_capital_tt: "§YУчения авианосной и надводной группы§!\n\n£navy_experience Опыт флота: §R-450§!\n£command_power Командный ресурс: §R-75§!\nДаёт национальный дух §YУчения авианосной и надводной группы§! на §H90§! дней:\n £fuel_consumption_texticon  Потребление горючего флотом: §R+25%§!\n £attack_battleship_texticon  Атака крупных кораблей: §G+3%§!\n£doctrine_mastery Освоение направления §H«Крупные корабли»§!: [MD_ftc_exercise_mastery_tt_text] в день в течение §H90§! дней\n\nТребуется флот не менее чем из §H8§! кораблей, включая хотя бы один авианосец, вертолётоносец, линкор, линейный крейсер, крейсер, эсминец, стелс-эсминец или тяжёлый фрегат."
 MD_ftc_ex_escort_tt: "§YУчения сил охранения§!\n\n£navy_experience Опыт флота: §R-450§!\n£command_power Командный ресурс: §R-75§!\nДаёт национальный дух §YУчения сил охранения§! на §H90§! дней:\n £fuel_consumption_texticon  Потребление горючего флотом: §R+25%§!\n £attack_screen_texticon  Атака охранения: §G+3%§!\n£doctrine_mastery Освоение направления §H«Эскортные корабли»§!: [MD_ftc_exercise_mastery_tt_text] в день в течение §H90§! дней\n\nТребуется флот не менее чем из §H8§! кораблей, включая хотя бы один эсминец охранения, фрегат, стелс-фрегат, корвет, стелс-корвет или патрульный катер."
 MD_ftc_ex_submarine_tt: "§YУчения подводных сил§!\n\n£navy_experience Опыт флота: §R-450§!\n£command_power Командный ресурс: §R-75§!\nДаёт национальный дух §YУчения подводных сил§! на §H90§! дней:\n £fuel_consumption_texticon  Потребление горючего флотом: §R+25%§!\n £attack_submarine_texticon  Атака подводных лодок: §G+3%§!\n£doctrine_mastery Освоение направления §H«Подводные лодки»§!: [MD_ftc_exercise_mastery_tt_text] в день в течение §H90§! дней\n\nТребуется флот не менее чем из §H8§! кораблей, включая хотя бы одну ударную или ракетную подводную лодку."
 MD_ftc_ex_operations_tt: "§YУчения по боеготовности флота§!\n\n£navy_experience Опыт флота: §R-450§!\n£command_power Командный ресурс: §R-75§!\nДаёт национальный дух §YУчения по боеготовности флота§! на §H90§! дней:\n £fuel_consumption_texticon  Потребление горючего флотом: §R+25%§!\n £organization_texticon  Организация флота: §G+3%§!\n£doctrine_mastery Освоение направления §H«Корабли поддержки»§!: [MD_ftc_exercise_mastery_tt_text] в день в течение §H90§! дней\n\nТребуется флот не менее чем из §H8§! кораблей, включая хотя бы один ремонтный корабль и одно судно поддержки, а также не менее §H100§! конвоев."
 MD_ftc_academy_tt_blue_water_1: "£navy_experience Опыт флота: §R-550§!\nОткрывает §YШкола авианосной войны I§! в ячейке «Дух военно-морской академии»:\n £doctrine_mastery Прирост освоения поддоктрины «Флот открытого моря»: §G+5%§!\n £experience_neutral_texticon  Прирост опыта от черты «Авиадиспетчер»: §G+10%§!\nЕжедневное £doctrine_mastery §Hосвоение§! на учениях флота растёт с §Y0,5§! до §G0,75§!"
 MD_ftc_academy_tt_green_water_1: "£navy_experience Опыт флота: §R-550§!\nОткрывает §YШкола прибрежной войны I§! в ячейке «Дух военно-морской академии»:\n £doctrine_mastery Прирост освоения поддоктрины «Флот ближнего моря»: §G+5%§!\n £experience_neutral_texticon  Прирост опыта от черты «Защитник флота»: §G+10%§!\nЕжедневное £doctrine_mastery §Hосвоение§! на учениях флота растёт с §Y0,5§! до §G0,75§!"
 MD_ftc_academy_tt_jeune_ecole_1: "£navy_experience Опыт флота: §R-550§!\nОткрывает §YШкола ударных катеров I§! в ячейке «Дух военно-морской академии»:\n £doctrine_mastery Прирост освоения поддоктрины «Молодая школа»: §G+5%§!\n £experience_neutral_texticon  Получаемый опыт корабля: §G+5%§!\nЕжедневное £doctrine_mastery §Hосвоение§! на учениях флота растёт с §Y0,5§! до §G0,75§!"
 MD_ftc_academy_tt_guerre_de_course_1: "£navy_experience Опыт флота: §R-550§!\nОткрывает §YКурс командиров подлодок I§! в ячейке «Дух военно-морской академии»:\n £doctrine_mastery Прирост освоения поддоктрины «Корсарская война»: §G+5%§!\n £experience_neutral_texticon  Прирост опыта от черты «Морской волк»: §G+10%§!\nЕжедневное £doctrine_mastery §Hосвоение§! на учениях флота растёт с §Y0,5§! до §G0,75§!"
