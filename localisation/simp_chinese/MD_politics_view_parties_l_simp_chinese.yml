 YEM.Western_Autocracy: "£YEM_Autocracy_small 全国人民大会党"
 YEM.Western_Autocracy_icon: "£YEM_Autocracy_small"
 YEM.Western_Autocracy_desc: ""
 YEM.Vilayat_e_Faqih: "£generic_Vilayat_e_Faqih_small 胡塞武装"
 YEM.Vilayat_e_Faqih_desc: ""
 YEM.Mod_Vilayat_e_Faqih: "£generic_Mod_Vilayat_e_Faqih_small 真理之路"
 YEM.Mod_Vilayat_e_Faqih_desc: ""
 YEM.Caliphate: "£generic_Caliphate_small 阿拉伯半岛的基地组织"
 YEM.Caliphate_desc: ""
 YEM.Neutral_conservatism: "£generic_Neutral_conservatism_small 纳赛尔统一人民组织"
 YEM.Neutral_conservatism_desc: ""
 YEM.neutral_Social: "£generic_neutral_Social_small 也门社会党（改革派）"
 YEM.neutral_Social_desc: "也门社会党是也门的一个左翼政党，也是1990年之前存在的也门民主人民共和国的执政党。也门南北统一后，也门社会党在努力建设新统一国家的多元民主方面发挥了重要作用。然而，1994年也门内战爆发后，该党及其支持者遭到严重镇压，被迫抵制选举，并与其他反对党联合起来反对也门人民大会党。自东欧集团解体以来，该党整体上已偏离了其最初的马克思列宁主义意识形态，转而采取更加务实温和的社会主义纲领，更加符合泛阿拉伯主义和社会民主主义的理念。该党的大部分支持者来自南部地区，即原也门民主人民共和国的领土。"
 YEM.Neutral_Muslim_Brotherhood: "£muslim_brotherhood_small 改革派"
 YEM.Neutral_Muslim_Brotherhood_desc: ""
