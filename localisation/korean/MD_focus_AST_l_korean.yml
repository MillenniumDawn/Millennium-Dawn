 australian_jobs_act: "§2오스트레일리아 일자리법§!"
 julia_gilard_desc: "웨일스 태생의 활동가이자 법률 파트너였던 길러드는 오스트레일리아 정부의 계급을 밟아 올라 이 나라 최초의 여성 지도자가 되었습니다. \n \n빅토리아 주 노동당의 좌파 사회주의자로 출발한 길러드는 재계와의 인맥을 활용하며 두각을 나타냈습니다. 노동법 사무변호사로 보낸 세월에서 얻은 능력입니다. 전통적으로 남성이 지배하던 분야에서 분투하고, 미혼이며 종교적 신앙이 없는 처지임에도 역경을 이겨 낸 길러드는 의회의 기존 관행을 공식적으로 깨뜨렸습니다. \n\n그녀가 어느 방향으로 가든 당은 전통적 확실성에서 벗어나는 데 조심스러운 불안을 안고 뒤따릅니다. 한 번의 실수가 당이 새로 얻은 안정을 산산조각 내고, 길러드의 지도력이 시작되기도 전에 그녀를 무너뜨릴 수 있습니다."
