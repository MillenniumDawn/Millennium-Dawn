 GRE_process_sco_member_tt: "§YSCO 가입 절차가 시작됩니다.§!"
 GRE_tax_relief_for_businessman: "사업가 세금 경감"
 GRE_tax_relief_for_businessman_desc: "기업들은 이전 정부의 정책 속에서 스스로 살아남아야 하는 처지에 내몰렸으므로, 우리는 재정적으로 그들을 도와야 하며 그들의 세금을 줄일 것입니다."
 istanbul_renamed: "이스탄불 개칭됨"
 GRE_9833_name: "콘스탄티노폴리스"
 GRE_constantinople_not_istanbul: "이스탄불이 아닌 콘스탄티노폴리스"
 GRE_constantinople_not_istanbul_desc: "5세기 동안 콘스탄티노폴리스는 다른 이름으로 알려져 왔습니다. 콘스탄티누스와 유스티니아누스의 도시, 하기아 소피아와 테오도시우스 성벽의 도시는 정복자에 의해 이름이 바뀌고 다시 쓰였습니다. 이 도시가 그리스의 손에 들어온 지금, 우리는 역사가 우리에게서 빼앗아 간 것을 되찾습니다."
 GRE_gain_10_strength: "§H그리스계 키프로스인§!이 §H세력 10§!을 §G얻습니다!§!"
 GRE_lose_10_gain_10: "§H튀르크계 키프로스인§!이 §H세력 10§!을 §R잃습니다!§!"
 GRE_austerity_idea: "긴축 긴장"
 GRE_austerity_idea_desc: "긴축 프로그램은 국민의 인내심을 한계 너머로 밀어붙였습니다. 시위는 아테네에서 테살로니키로 번지고 있고, 파업은 항만과 병원을 멈춰 세우고 있으며, 정치적 열기는 높아지고 있습니다. 새로운 삭감이 있을 때마다 불에 기름을 붓게 됩니다. 긴장을 관리하지 못하면 전면적인 소요가 실제로 일어날 수 있습니다."
 GRE_please_south_desc: "그리스계 키프로스인의 비위를 계속 맞추면 그들이 키프로스 통일과 궁극적인 목표인 에노시스를 향한 우리의 노력을 지지할 가능성을 높일 수 있습니다."
 GRE_please_north_desc: "튀르크계 키프로스인은 그리스인도 키프로스인도 아니라는 점을 강화합니다. 그들은 키프로스에서 몰아내야 할 식민 지배자이자 침략자입니다."
 TUR_CYP_incite_riot_desc: "그리스인들이 이 지역에서 정치적 영향력을 얻지 못하도록 남키프로스에서 폭동을 선동하기 시작할 때입니다."
 TUR_CYP_propaganda_north_desc: "북키프로스인들이 그리스인에게 흔들리지 않도록 선전을 강화하고 퍼뜨리는 것은 이 지역에서의 성공에 필수적입니다."
 TUR_CYP_propaganda_south_desc: "남키프로스인들이 그리스인에게 흔들리지 않도록 선전을 강화하고 퍼뜨리는 것은 이 지역에서의 성공에 필수적입니다."
 TUR_attack_CYP_strength_desc: "그리스계 키프로스인의 세력을 공격함으로써 그들이 이 지역에서 정치적 영향력을 얻지 못하도록 할 수 있습니다."
 GRE_attack_turkish_strength_desc: "튀르크계 키프로스인의 세력을 공격함으로써 그들이 이 지역에서 정치적 영향력을 얻지 못하도록 할 수 있습니다."
 GRE_nato_pressure_turkey_accept_tt: "그리스를 지지하는 동맹국들은 에게해 긴장을 완화하고 키프로스 문제에서 추진력을 쌓아, 한 달 안에 튀르키예가 물러설 가능성을 높입니다."
 GRE_nato_pressure_turkey_reject_tt: "거절하는 동맹국들은 외교적 무게를 더하지 않으므로 튀르키예가 양보할 가능성이 낮아집니다."
 GRE_hellenic_economy: "헬레닉 경제"
 GRE_hellenic_economy_desc: "그리스 경제는 어려운 처지에 놓여 있습니다. 불어나는 부채, 실업, 유로존 가입 문제가 모두 시급한 현안입니다. 그러나 우리에게는 강력한 상선단, 전략적 위치, 매년 수백만 명의 방문객을 불러들이는 관광업이 있습니다. 가진 것을 최대한 활용해야 합니다."
 GRE_debt_mounts: "쌓여 가는 부채"
 GRE_debt_mounts_desc: "우리의 부채는 3,000억 달러에 가깝게 부풀어 올라 1인당 기준으로 세계에서 가장 높은 수준 중 하나가 되었습니다. 이자 지급이 예산의 상당 부분을 잠식하여 투자할 여력이 거의 남지 않았습니다. 외국 은행가들은 초조해하고 있으며 EU는 해명을 요구하고 있습니다. 상황이 더 나빠지기 전에 행동해야 합니다."
 GRE_debt_mounts_req_tt: "우리의 §Y통합 부채 비율§!이 §Y90%§!보다 높음 (현재 §Y[?GRE_unified_debt_ratio|-1%]§!)"
 GRE_brics_membership_req_tt: "동방 정렬 점수가 7보다 높음"
 GRE_pillar_of_the_west_req_tt: "서방에 대한 헌신도가 3보다 높음"
 GRE_aegean_assertiveness_event_tt: "§Y90일 후, 튀르키예가 에게해에서의 우리 순찰에 대응할 것입니다.§!"
 GRE_cyprus_gas_crisis_event_tt: "§R이미 긴장이 고조된 상태에서 시추를 하면 며칠 안에 튀르키예 해군의 대응을 불러일으킬 것입니다.§!"
 GRE_greek_bonds: "채권 시장 복귀"
 GRE_greek_bonds_desc: "아테네는 위기 이후 장기 차입 시장에서 밀려났으며, 그 결과 국고는 단기 채권과 채권단의 분할 지급금에 의존하고 있습니다. 공공부채관리청을 통해 유럽과 미국의 펀드에 판매하는 기준 10년물 발행은 투자자들이 그리스에 다시 정상적인 조건으로 돈을 빌려줄 준비가 되었는지를 가늠하는 시험대가 될 것입니다."
 GRE_solve_evasion: "탈세 해결"
 GRE_solve_evasion_desc: "해마다 수십억 달러의 수입이 탈세로 사라지고 있습니다. 세금 징수를 강화하고 더 나은 기술에 투자하며 역외 계좌를 단속한다면 허점을 막고 예산을 정상 궤도에 되돌릴 수 있습니다."
 GRE_convert_to_euro: "유로로 전환"
 GRE_convert_to_euro_desc: "유로는 기회이자 위험입니다. 이를 도입하면 우리 경제가 유럽 경제에 묶이게 되어 드라크마보다 더 큰 안정을 얻지만, 자국 통화 정책에 대한 통제권을 잃게 됩니다. 이 교환이 가치가 있는지는 우리에게 달려 있습니다."
 GRE_skouries_mines: "스쿠리에스 광산"
 GRE_skouries_mines_desc: "칼키디키의 스쿠리에스 구리-금 광상은 유럽 최대 규모 중 하나입니다. 외국 기업들은 채굴권을 원하며 일자리와 부를 약속하고 있습니다. 환경론자들은 반대합니다. 무엇이 더 중요한지 결정해야 합니다."
 GRE_local_manufacturing: "메이드 인 그리스"
 GRE_local_manufacturing_desc: "그리스 제조업은 식품 가공, 시멘트, 알루미늄, 의약품, 그리고 페라마 해안의 조선 등 소수 분야로 쪼그라들었습니다. 공공 조달에서의 국산품 우대 규칙과 개발법에 따른 투자 인센티브를 결합하면, 살아남은 공장들이 재고용에 필요한 수주 물량을 확보할 수 있을 것입니다."
 GRE_military_industrial: "헬레닉 무기 산업"
 GRE_military_industrial_desc: "엘리니키 비오미하니아 오플론과 그 자매 회사인 피르칼은 냉전 이래 그리스 병사들에게 무기를 공급해 왔지만, 수십 년간의 국가 소유로 인해 부채와 유휴 생산 라인을 떠안게 되었습니다. 지속적이고 표적화된 보조금은 용광로를 계속 가동하게 하고, 탄약과 소화기의 국내 공급을 확보하며, 두 회사를 만성적으로 국고를 축내는 존재가 아니라 경쟁력 있는 단일 제조업체로 통합할 수 있습니다."
 GRE_agriculture_sector: "농촌의 근간"
 GRE_agriculture_sector_desc: "펠로폰네소스의 올리브 숲에서 테살리아의 목화밭에 이르기까지, 그리스인의 거의 5분의 1이 여전히 땅에서 생계를 이끌어 갑니다. 그러나 이 부문은 고령화되고 작은 농지로 쪼개져 있으며, 공동 농업 정책에 따른 보조금을 브뤼셀에 의존하고 있습니다. 관개, 협동조합, 현대식 기계를 추진하면서 농민들을 지원하면 칼라마타 올리브, 페타 치즈, 아시르티코 와인이 계속 세계의 식탁에 오를 수 있습니다."
 GRE_power_corporations: "공공전력공사"
 GRE_power_corporations_desc: "반세기 동안 국영 공공전력공사(DEI)는 프톨레마이다와 메갈로폴리의 갱도에서 캐낸 갈탄을 태워 전등을 밝혀 왔습니다. 이 석탄은 저렴하지만 오염이 심하며, 수입 석유와 가스에 대한 의존은 중동에서 일어나는 모든 충격에 우리를 노출시킵니다. 전력망을 현대화하고 DEPA의 가스망을 확장하며 신규 발전소를 건설하면 이 공익 기업들은 국가의 전략적 근간이 될 것입니다."
 GRE_austerity_measures: "긴축 조치"
 GRE_austerity_measures_desc: "채권단은 연금 삭감, 증세, 복지 폐지를 요구하고 있습니다. 긴축하지 않으면 파산에 직면하지만, 긴축하면 국민의 분노에 직면합니다. 시위와 파업은 불가피합니다. 여기에는 쉬운 선택이 없습니다."
 GRE_debt_refactoring: "전략적 부채 구조조정"
 GRE_debt_refactoring_desc: "채권 경매는 우리에게 시간을 벌어 주었지만 그것만으로는 충분하지 않습니다. 채권단은 인내심을 잃어 가고 있으며 이자 지급은 국고를 고갈시키고 있습니다. 우리는 부채를 구조조정해야 합니다. 조건을 재협상하고 만기를 연장하며, 우리에게 숨 쉴 여유를 주면 실제로 빚을 갚을 수 있다는 것을 파트너들에게 보여 주어야 합니다."
 GRE_ilarionas_hydro: "일라리오나스 수력 발전"
 GRE_ilarionas_hydro_desc: "그리스 북부 일라리오나스의 알리아크모나스 강은 막대한 수력 발전 잠재력을 지니고 있습니다. 수력 발전은 청정하고 재생 가능하며 태양광이나 풍력과 달리 수요에 맞춰 가동됩니다. 이 프로젝트는 수십만 가구에 전력을 공급할 수 있습니다."
 GRE_telecomms: "OTE 투자"
 GRE_telecomms_desc: "섬마을과 산악 도시에 사는 수백만 그리스인은 여전히 안정적인 전화 및 인터넷 접속을 하지 못합니다. OTE에 대한 국가 투자는 이 지역들을 나머지 지역과 연결하여 농민에게는 시장 접근권을, 학생에게는 대학 접근권을 줄 수 있습니다."
 GRE_new_railways: "아테네-테살로니키 철도 노선 재건"
 GRE_new_railways_desc: "아테네-테살로니키 회랑은 그리스 본토의 근간이지만 철도 노선은 고통스러울 만큼 느립니다. 현대식 차량과 개량된 선로는 이동 시간을 절반으로 줄이고 지방 경제에 실질적인 활력을 불어넣을 수 있습니다."
 GRE_highway_initiatives: "AX 고속도로 연장"
 GRE_highway_initiatives_desc: "한때 고대 도시 국가들을 갈라놓았던 산맥은 오늘날에도 지역 사회를 고립시키고 상업을 해칩니다. 제안된 AX 고속도로망은 핀도스 산맥을 가로질러 서해안과 테살리아를 연결할 것입니다. 비용이 많이 들겠지만, 경제적 이득은 그만한 가치가 있을지도 모릅니다."
 GRE_hellas_gold: "카산드라 광산 심화 개발"
 GRE_hellas_gold_desc: "카산드라 광산 지구에는 아직 충분히 개발되지 않은 상당한 크롬 매장량이 있습니다. 기존 작업을 심화하고 채굴 장비에 투자하면 이 부를 시장에 내놓고 수입 의존도를 낮출 수 있습니다."
 GRE_euboea_bauxite_deposits: "에비아 보크사이트 광상"
 GRE_euboea_bauxite_deposits_desc: "에비아에는 알루미늄의 주요 원광인 보크사이트가 상당량 매장되어 있습니다. 대규모 채굴은 우리 산업 기반을 뒷받침하고 값비싼 수입을 줄일 수 있습니다."
 GRE_industrial_lignite_mining: "프톨레마이다 분지"
 GRE_industrial_lignite_mining_desc: "서마케도니아의 프톨레마이다와 아민테오 일대 노천 갈탄 광구는 반세기 동안 공공전력공사에 동력을 공급해 왔습니다. 굴착을 확대하고 액화 설비를 추가하면 이 분지는 노후한 탄광 지구가 아니라 국내 연료원으로 거듭날 것입니다."
 GRE_rare_element_prospecting: "헬레닉 지하자원 탐사"
 GRE_rare_element_prospecting_desc: "할키디키의 금-구리 반암 광상, 파르나소스와 펠로폰네소스의 보크사이트 벨트, 에비아의 니켈 라테라이트는 지도에 표시된 매장지에 불과합니다. 탐사 면허를 바탕으로 한 IGME(지질광물연구소)의 국가 지질 조사가 이루어지면 차세대 채굴 현장을 확보할 수 있을 것입니다."
 GRE_transport_sector: "도로, 철도, 그리고 여객선"
 GRE_transport_sector_desc: "섬과 산으로 이루어진 나라는 교통에 따라 흥망이 갈립니다. KTEL 버스는 고갯길을 굽이굽이 달리고, 푸른색과 흰색의 여객선은 에게해를 하나로 꿰매며, OASA의 버스와 트롤리는 매일 아침 아테네 시민을 일터로 실어 나릅니다. 노후한 차량을 교체하고 노선을 교외로 연장하며 도로, 철도, 해운을 단일 승차권 체계로 엮으면 물자는 시장에, 노동자는 일터에 닿을 수 있을 것입니다."
 GRE_vintage_wines: "그리스의 빈티지"
 GRE_vintage_wines_desc: "그리스인은 로마가 세워지기 전부터 포도를 짜고 있었지만, 세상은 여전히 우리 와인을 타베르나의 유리병에 담긴 싸구려 레치나로만 알고 있습니다. 이는 산토리니의 화산토 아시르티코, 나우사의 대담한 크시노마브로, 네메아의 루비빛 아기오르기티코에 대한 모독입니다. 와이너리 직접 병입, 원산지 보호 표시, 와인 관광에 투자하면 마침내 그리스 빈티지를 프랑스와 이탈리아의 거장들 곁에 나란히 세울 수 있을 것입니다."
 GRE_tobacco_plantations: "오리엔탈 담배"
 GRE_tobacco_plantations_desc: "마케도니아와 트라키아의 햇볕에 말린 바스마 잎은 수 세대 동안 세계 최고급 블렌드에 향을 더해 왔으며, 피레에프스의 파파스트라토스 같은 회사들은 이를 바탕으로 부를 쌓았습니다. 서구의 흡연은 줄어들고 있을지 몰라도 발칸과 중동에서는 수요가 여전하며, 카발라와 크산티 일대의 수천 소농이 여전히 수확에 생계를 의존합니다. 우리는 재배자들을 지원하는 동시에 가능한 이들은 새로운 작물로 전환하도록 도와야 합니다."
 GRE_gas_oil_plants: "아티카의 정유 시설"
 GRE_gas_oil_plants_desc: "사로니코스 만을 둘러싼 정유 시설들, 즉 아스프로피르고스와 엘레프시나의 헬레닉 페트롤리엄, 아기오이 테오도로이의 모터 오일 헬라스는 그리스와 발칸 반도 절반을 움직이는 원유를 처리합니다. 그러나 오래된 설비는 낡았고 이윤은 줄어들고 있습니다. 새로운 분해 설비, 더 깨끗한 탈황 시설, 확장된 저장 시설은 동남부 지중해의 정제 중심지로서 우리의 입지를 확보해 줄 것입니다."
 GRE_trim_the_fat: "군살 빼기"
 GRE_trim_the_fat_desc: "정부는 비대하고 비효율적이 되었습니다. 부처마다 인원이 넘쳐 나고 계약은 친구와 가족에게 돌아가며 관료주의가 모든 것을 숨 막히게 하고 있습니다. 낭비를 줄이고 가능한 곳은 자동화하며 책임을 묻는 방식으로 몸집을 줄여야 합니다."
 GRE_debt_swaps: "부채 스왑 파트너"
 GRE_debt_swaps_desc: "우리의 부채를 외화 표시 채권으로 스왑하면 변동성에 대한 노출을 줄일 수 있습니다. 좋은 은행 파트너와 약간의 금융 공학이 필요하지만, 정치적 후폭풍을 덜 겪으며 부채를 관리하는 한 방법입니다."
 GRE_debt_swap_initial_tt: "국가 부채 §G500억§!이 §G3%§!의 이자율로 선택한 파트너에게 이전됩니다."
 GRE_debt_swap_accepted_opinion: "부채 스왑 수락"
 GRE_debt_swap_rejected_opinion: "부채 스왑 거절"
 GRE_olympic_airways: "올림픽 항공"
 GRE_olympic_airways_desc: "아리스토텔레스 오나시스가 설립한 올림픽 항공은 한때 그리스 항공의 자랑이었습니다. 이 항공사는 최근 몇 년간 고전했지만 그 이름은 여전히 무게가 있습니다. 항공사를 되살리면 관광객을 끌어들이고 다시 찾게 만들 수 있습니다."
 GRE_trainose: "트레노세"
 GRE_trainose_desc: "한때 방치되었던 그리스 철도 체계가 새 생명을 얻었습니다. 트레노세는 아테네와 테살로니키, 펠로폰네소스와 본토를 잇는 여객 및 화물 서비스를 운영합니다. 노선을 확대하고 운행 시간표를 개선하며 차량에 투자하면 철도를 진정한 대안으로 만들 수 있습니다."
 GRE_cotton_plantations: "목화 농장"
 GRE_cotton_plantations_desc: "테살리아와 마케도니아의 그리스산 목화는 세계 최고 수준에 속합니다. 강한 섬유와 뛰어난 품질로 직물에 매우 적합합니다. 목화 농민을 지원하고 제조업에 투자하면 이 산업이 마땅히 있어야 할 자리로 돌아오게 할 수 있습니다."
 GRE_fisheries_expansion: "에게해의 보고"
 GRE_fisheries_expansion_desc: "그리스는 이오니아해와 에게해의 잔잔한 만을 따라 양식장을 늘어놓아 유럽의 어느 나라보다 많은 양식 도미와 농어를 잡아 올립니다. 그러나 자연산 어족은 남획, 오염, 해상 국경을 넘어 밀고 들어오는 트롤 어선 때문에 무너지고 있습니다. 양식업을 확대하고 연안 어선단을 교체하며 정직한 어획 할당량을 시행하면 어부와 물고기 모두 살아남을 수 있을 것입니다."
 GRE_aegean_wind_banks: "멜테미 활용"
 GRE_aegean_wind_banks_desc: "매년 여름 멜테미는 키클라데스 제도를 가로질러 휘몰아치며, 이는 유럽 전체에서 가장 믿을 만한 바람 중 하나입니다. 섬들과 본토의 산등성이에 늘어선 터빈은 전력망에 청정 전력을 쏟아붓고 수입 석유와 석탄에 대한 의존을 끊을 수 있습니다. 더 큰 보상은 마침내 섬들의 디젤 발전기를 국가 전력망에 연결하게 될 연계 송전선입니다."
 GRE_resolution_crisis: "위기 해결"
 GRE_resolution_crisis_desc: "우리는 위기를 실제로 해결하는 대신 너무 오랫동안 관리만 해 왔습니다. 이제 부채, 성장, 은행, 개혁을 한꺼번에 다루는 제대로 된 계획을 세울 때입니다. 쉽지 않겠지만 이것이 유일한 전진의 길입니다. 이 중점을 완료하면 부채 위기가 영구히 종식되므로, 먼저 부채를 통제해야 합니다. 이자율은 8% 미만, GDP 대비 부채는 50% 미만이어야 합니다."
 GRE_urban_railways: "아테네 지하철 확장"
 GRE_urban_railways_desc: "아테네 지하철은 2004년 올림픽 이전에 수도를 바꾸어 놓았지만, 여전히 지하철이 닿지 않는 지구가 곳곳에 있고 테살로니키는 자체 노선을 수십 년째 기다리고 있으며 프로아스티아코 교외 철도는 잠재력을 거의 발휘하지 못하고 있습니다. 새 터널을 뚫고 트램을 해안까지 연장하며 도시들을 서로 엮으면 숨 막히는 교통 체증을 완화하고 스모그를 걷어 내며 수백만 시민의 일상을 끌어올릴 것입니다."
 GRE_ionian_solar: "이오니아 태양광"
 GRE_ionian_solar_desc: "이오니아 제도는 일조량이 풍부합니다. 코르푸, 레프카다, 자킨토스에 태양광 발전 단지를 설치하면 이를 활용하여 수입 화석 연료에 대한 의존을 줄일 수 있습니다."
 GRE_tourism_boom: "그리스에서 신화를 살다"
 GRE_tourism_boom_desc: "크레타의 해변에서 산토리니의 칼데라, 미코노스의 하얗게 칠한 골목에 이르기까지, 그리스는 매년 수천만 명의 방문객을 끌어들이며, 관광업은 이미 경제 전체 생산의 5분의 1에 가까운 수입을 벌어들입니다. 국가관광청이 마케팅, 공항 수용 능력, 섬 연결망에 대해 조율된 노력을 기울이면 이 계절성 물결을 진정한 국부의 기둥으로 바꿀 수 있습니다."
 GRE_tourism_boom_event_TT: "§Y기록적인 성수기로 인해 수익을 어디에 써야 하는지를 두고 논쟁이 벌어집니다.§!"
 GRE_mass_tourism: "태양, 모래, 그리고 패키지 상품"
 GRE_mass_tourism_desc: "맨체스터와 뒤셀도르프에서 출발하는 전세기를 가득 채우고, 해안을 올인클루시브 리조트로 채우며, 인파가 수백만 명씩 밀려들게 합니다. 대량 관광은 국고를 채우고 모든 섬 주민이 여름 소득을 얻게 하지만, 미코노스의 지하수층을 고갈시키고 산토리니의 절벽을 크루즈 승객으로 뒤덮으며 실제로 그곳에 사는 사람들의 인내심을 닳게 합니다."
 GRE_premium_tourism: "요트와 부티크 리조트"
 GRE_premium_tourism_desc: "방문객은 줄이되 각자 훨씬 더 많이 지출하고 환경에는 훨씬 가벼운 발자국을 남기게 합니다. 5성급 리조트, 문화 및 고고학 여행, 이오니아의 슈퍼요트 정박지를 중심으로 방향을 잡으면 취약한 섬들과 그리스라는 브랜드를 함께 지킬 수 있습니다. 내세울 만한 방문객 수는 더디게 오를 수 있지만, 남는 돈은 더 두둑해집니다."
 GRE_diaspora_remittances: "디아스포라 공략"
 GRE_diaspora_remittances_desc: "멜버른에서 시카고에 이르기까지 해외의 수백만 그리스인은 모국과의 유대를 유지하고 있습니다. 이들의 저축과 송금을 경제로 끌어들이면 정서를 자본으로 바꿀 수 있습니다."
 GRE_diaspora_remittances_event_TT: "§Y디아스포라가 투자 요청에 응답합니다.§!"
 GRE_reverse_brain_drain: "두뇌 유출 역전"
 GRE_reverse_brain_drain_desc: "위기는 한 세대의 그리스 기술자, 의사, 연구자를 해외로 내몰았습니다. 세제 혜택, 연구 자금, 실질적인 일자리가 이들과 그들의 전문성을 고국으로 불러올 수 있습니다."
 GRE_eu_cohesion_funds: "EU 결속 기금"
 GRE_eu_cohesion_funds_desc: "연합의 저소득 회원국 중 하나인 그리스는 구조 기금과 결속 기금의 순수혜국입니다. 제공되는 모든 유로를 끌어다 쓰면 도로, 항만, 지역 발전의 재원이 마련됩니다."
 GRE_recovery_resilience_facility: "회복 및 복원력 기금"
 GRE_recovery_resilience_facility_desc: "팬데믹 이후의 회복 및 복원력 기금은 수백억을 녹색 및 디지털 전환에 투입합니다. 잘 쓴다면 이는 현대 그리스 역사상 최대의 투자 프로그램이 될 것입니다."
 GRE_recovery_facility_event_TT: "§Y브뤼셀이 첫 분할금을 지급하며, 아테네는 이를 얼마나 빨리 쓸지 결정해야 합니다.§!"
 GRE_infrastructure_cofinancing: "기반시설 공동 금융"
 GRE_infrastructure_cofinancing_desc: "유럽의 자금이 대부분의 비용을 부담하고 그리스의 자금이 나머지를 부담합니다. 공동 금융 방식의 고속도로, 지하철 노선, 전력망은 국가 비용의 일부만으로 건설됩니다."
 GRE_deterrence_posture: "억지 태세"
 GRE_forward_posture_mod: "공세적 전진 태세"
 GRE_defense_partner: "방위 파트너"
 GRE_naval_partner: "해군 파트너"
 GRE_strong_naval_partner: "긴밀한 해군 파트너"
 GRE_defense_exporter: "방산 수출국"
 GRE_f35_partner: "F-35 계획 파트너"
 GRE_aegean_encroachment: "에게해 침범"
 GRE_refused_debt_call_opinion: "부채 상환 요구 거부"
 GRE_debt_forgiven_opinion: "부채 탕감됨"
 GRE_debt_fully_repaid_opinion: "부채 전액 상환"
 GRE_forgave_debt_opinion: "우리 부채를 탕감함"
 GRE_economy_modifier: "헬레닉 경제"
 GRE_debt_crisis_category: "[GRE.GetAdjective] 부채 위기"
 GRE_debt_crisis_category_desc: "경제 성장에도 불구하고 비효율적인 정부 지출, 만기가 도래하는 채권, 상시적인 예산 부족 등으로 인해 우리 부채는 계속해서 점점 더 커지고 있습니다. 부채가 위기가 되기 전에 대처하거나, 이를 새 천년에도 계속 번영하기 위한 수단으로 바꿔야 합니다.\n\n현재 GDP 대비 부채 비율: [?debt_ratio|%Y]\n현재 §Y채권단 보유 부채§!: $$[?GRE_total_creditor_debt|0]\n"
 GRE_austerity_tension_mission: "긴축 긴장"
 GRE_austerity_tension_mission_desc: "지출 삭감과 증세는 국민을 분노하게 했습니다. 긴장을 끝내려면 통합 부채 비율을 §Y75%§! 아래로 낮춰야 합니다. 시간이 다할 때마다 시위는 악화되며, 시위가 절정에서 폭발하면 나라는 전면적인 부채 위기로 미끄러집니다."
 GRE_debt_crisis_mission: "[GRE.GetAdjective] 부채 위기"
 GRE_debt_crisis_mission_desc: "긴축은 실패했고 시장은 우리에 대한 신뢰를 잃었습니다. 지출 삭감과 외국 채권단에 부채를 떠넘기는 방법을 통해 통합 부채 비율을 §Y75%§! 아래로 낮춰야 합니다. 시간이 다할 때마다 정부가 대가를 치르며, 우리의 실패는 유로존 전체를 함께 끌어내릴 위험이 있습니다."
 GRE_austerity_placate_decision: "시위대 달래기"
 GRE_austerity_placate_decision_desc: "정부의 대국민 접촉과 표적화된 구호는 국민의 불만을 누그러뜨릴 수 있습니다. 긴축의 눈에 보이는 압박을 줄이면 안정도를 회복하고 긴장을 다시 낮추는 데 도움이 될 것입니다."
 GRE_slash_public_spending_decision: "공공 지출 대폭 삭감"
 GRE_slash_public_spending_decision_desc: "부처, 공공 부문 급여, 연금에 대한 일괄 삭감입니다. 장부는 나아 보이겠지만 국민은 모든 유로의 무게를 체감할 것입니다. 국가 부채가 §Y5%§! 감소합니다."
 GRE_emergency_tax_hikes_decision: "긴급 증세"
 GRE_emergency_tax_hikes_decision_desc: "예산의 구멍을 메우기 위해 부가가치세와 소득세를 인상합니다. 세수는 실질적이지만 집권당에 대한 분노 또한 그렇습니다. 국가 부채가 §Y4%§! 감소합니다."
 GRE_privatization_drive_decision: "민영화 추진"
 GRE_privatization_drive_decision_desc: "항만에서 공익 기업에 이르기까지 국유 자산을 돈을 낼 누구에게든 경매로 매각합니다. 노조가 쉽게 용서하지 않을 일회성 횡재입니다. 국가 부채가 §Y8%§! 감소합니다."
 GRE_unified_ratio_below_75_tt: "우리의 §Y통합 부채 비율§!이 §Y75%§!보다 낮음 (현재 §Y[?GRE_unified_debt_ratio|-1%]§!)"
 GRE_buys_mission_time_tt: "§G진행 중인 부채 임무에 30일을 추가합니다§!"
 GRE_austerity_mission_active: "\n현재 긴축 긴장: §R[gre_austerity_tension]§!"
 GRE_generic_decisions_category: "[GRE.GetNameWithFlag] 정치 결정"
 GRE_generic_decisions_category_desc: "그리스 정부가 이용할 수 있는 정치 결정입니다."
 GRE_rename_istanbul_desc: "콘스탄티노폴리스가 그리스의 통제 아래 들어오면서, 정부는 이 도시의 역사적 명칭을 공식적으로 복원합니다. 개칭은 깊은 문화적 의미를 지니며 국민의 사기를 높입니다."
 GRE_archipelago_air_base_rapid_repair: "공군 기지 신속 복구 프로그램"
 GRE_archipelago_air_base_rapid_repair_desc: "섬 공군 기지에 전담 복구 인력과 사전 배치된 장비를 갖추면 적의 공격으로 인한 피해를 더 빨리 복구할 수 있어 우리 공군력을 가동 상태로 유지할 수 있습니다."
 GRE_archipelago_anti_air_rapid_repair: "대공 포대 정비 지침"
 GRE_archipelago_anti_air_rapid_repair_desc: "표준화된 부품과 훈련을 갖춘 이동 정비팀을 섬의 방공 거점에 배치하면 손상된 포대를 더 빨리 복구하고 방공망을 온전하게 유지할 수 있습니다."
 GRE_archipelago_bunker_repair_protocols: "섬 요새 복구단"
 GRE_archipelago_bunker_repair_protocols_desc: "벙커의 신속한 복원에 집중하는 특수 공병 부대를 다도해 전역에 배치합니다. 손상된 방어 시설을 신속하게 완전한 효력 상태로 되돌릴 수 있습니다."
 GRE_archipelago_naval_base_repair_protocols: "해군 기지 정비 구상"
 GRE_archipelago_naval_base_repair_protocols_desc: "섬의 해군 시설에 수리 자재를 사전 배치하고 숙련된 기술자를 두면 손상된 항만 기반시설을 더 빨리 복구하고 해상 작전을 계속 이어 갈 수 있습니다."
 GRE_archipelago_coastal_obstacle_network: "해안 장애물망"
 GRE_archipelago_coastal_obstacle_network_desc: "예상 상륙 지점 전역에 수중 장애물, 기뢰 지대, 방벽을 설치하면 어떤 적의 해상 공격이든 우리 해안에 도달하기가 훨씬 어려워집니다."
 GRE_archipelago_supply_disruption: "중핵 영토 보급 차단"
 GRE_archipelago_supply_disruption_desc: "우리 섬 중핵 지역에 대해 사전에 계획된 병참 교란을 시행하면 점령한 적이 보급선을 유지하거나 현지 자원을 이용하기가 더 어려워집니다."
 GRE_archipelago_coastal_battery_expansion: "해안 포대 확장 프로그램"
 GRE_archipelago_coastal_battery_expansion_desc: "지형이 보통 허용하는 한도를 넘어 해안포 시설을 확장합니다. 섬의 지리적 특성이 해안선을 방어하는 우리의 능력을 제한해서는 안 됩니다."
 GRE_archipelago_island_fortress_expansion: "섬 요새 확장 프로그램"
 GRE_archipelago_island_fortress_expansion_desc: "현재의 지형 제한이 허용하는 수준을 넘어 벙커를 건설하기 위한 공병 작업에 자금을 투입합니다. 우리의 섬들은 현재 교리가 가정한 것보다 더 강력한 방어 시설을 지탱할 수 있습니다."
 GRE_archipelago_attrition_doctrine: "다도해 소모전 교리"
 GRE_archipelago_attrition_doctrine_desc: "섬의 지형을 이용해 공격하는 모든 병력에 출혈을 강요하는 전술을 체계화합니다. 개활지의 적 병력은 더 높은 소모를 겪고 우리의 준비된 진지로부터 끊임없는 교란에 직면하게 됩니다."
 GRE_archipelago_supply_interdiction: "섬 보급 차단 작전"
 GRE_archipelago_supply_interdiction_desc: "적 병력이 현지 자원에 접근하는 것을 적극적으로 차단하도록 부대를 훈련하고 배치합니다. 우리 섬에서 작전하는 모든 적은 보급원이 체계적으로 끊기는 것을 보게 될 것입니다."
 GRE_archipelago_missile_battery_expansion: "섬 미사일 방어 확장"
 GRE_archipelago_missile_battery_expansion_desc: "다도해 전역에 일반적인 지형 한도를 넘어 미사일 방어 거점을 건설하기 위한 추가 자금입니다. 더 많은 공병 투자는 평소의 지형 제약을 넘어설 수 있다는 뜻입니다."
 GRE_archipelago_air_defense_expansion: "방공망 확장"
 GRE_archipelago_air_defense_expansion_desc: "대공 시설의 건설 상한을 표준 지형 한도 이상으로 높입니다. 작은 섬들도 촘촘한 방공 범위를 확보할 수 있습니다."
 GRE_archipelago_decision_active: "다도해 방어 프로그램이 이미 진행 중입니다"
 GRE_archipelago_set1_A_chosen: "공군 기지 신속 복구 프로그램 완료"
 GRE_archipelago_set1_B_chosen: "대공 포대 정비 지침 완료"
 GRE_archipelago_set2_A_chosen: "섬 요새 복구단 완료"
 GRE_archipelago_set2_B_chosen: "해군 기지 정비 구상 완료"
 GRE_archipelago_set3_A_chosen: "해안 장애물망 완료"
 GRE_archipelago_set3_B_chosen: "중핵 영토 보급 차단 완료"
 GRE_archipelago_set4_A_chosen: "해안 포대 확장 프로그램 완료"
 GRE_archipelago_set4_B_chosen: "섬 요새 확장 프로그램 완료"
 GRE_archipelago_set5_A_chosen: "다도해 소모전 교리 완료"
 GRE_archipelago_set5_B_chosen: "섬 보급 차단 작전 완료"
 GRE_archipelago_set6_A_chosen: "섬 미사일 방어 확장 완료"
 GRE_archipelago_set6_B_chosen: "방공망 확장 완료"
 GRE_lie_about_financial_records_decision: "재무 기록을 유리하게 조정"
 GRE_lie_about_financial_records_decision_desc: "지속적인 경제 성장에도 불구하고 낡은 통화와 기타 경제적 어려움이 유럽 연합과의 경제 협정을 마무리하는 것을 가로막고 있습니다."
 GRE_negotiate_debt_swap_deals_decision: "부채 스왑 협상"
 GRE_negotiate_debt_swap_deals_decision_desc: "외국 세력과 통화 스왑을 통한 부채 구조조정 협상을 시작합니다. 우리의 채무를 다른 나라의 중앙은행으로 넘기면 더 유리한 상환 조건을 찾을 수 있습니다."
 GRE_defer_payments_decision: "중점 비용 지급 연기"
 GRE_defer_payments_decision_desc: "경제 프로그램의 비용을 선불로 지급하는 대신 국가 부채로 미룹니다. 채무가 늘어나는 대가로 국고를 보존할 수 있습니다."
 GRE_do_not_defer_payments_decision: "직접 지급 재개"
 GRE_do_not_defer_payments_decision_desc: "비용 연기를 중단하고 국고에서 직접 경제 프로그램 비용을 지급하는 방식으로 돌아갑니다."
 CYP_NCY_diplomatic_category: "키프로스 통일 회담"
 GRE_brit_5_TT: "§G영국의 지지 5 획득§!"
 GRE_brit_30_TT: "§G영국의 지지 30 획득§!"
 GRE_unification_TT: "완료하면 매달 회의가 열리며, 승인 여부에 따라 진전이 있을 수 있습니다."
 PER_presidential_decisions_only_one_is_available_TT: "이 결정들 중 한 번에 하나만 활성화할 수 있습니다."
 GRE_homelessness_crisis_category: "아테네 노숙자 위기"
 GRE_homelessness_crisis_category_desc: "1999년 아테네 지진의 여파로 수천 명의 그리스 시민이 집을 잃었습니다. 현재 도시에서 구호와 복구가 진행 중이지만, 우리는 도시 및 주거 지구의 복구를 마무리하기 위해 이 노력을 거들기로 선택할 수 있습니다."
 GRE_reconstruction_efforts_in_athens_decision: "아테네 추가 재건 노력에 자금 지원"
 GRE_reconstruction_efforts_in_athens_decision_desc: "지진은 아테네 전역에 심각한 피해를 입혔습니다. 아파트 단지가 무너지고 기반시설이 손상되었으며 동네 전체가 잔해로 변했습니다. 초기 복구는 시작되었지만 구호 자금이 충분하지 않습니다. 재건에 추가 자금을 투입하면 재건 노력의 속도를 높일 수 있습니다."
 GRE_issue_relief_funds_to_victims_decision: "지진 피해자에게 구호금 지급"
 GRE_issue_relief_funds_to_victims_decision_desc: "물리적 파괴를 넘어 지진은 많은 가족에게서 모든 것을 앗아 갔습니다. 저축은 사라졌고 사업체는 파괴되었으며 사람들은 다쳤습니다. 피해자에게 직접 구호금을 지급하면 식량, 의류, 임시 거처, 재건을 시작하는 데 필요한 기본 물품을 즉시 지원할 수 있습니다."
 GRE_petition_turkey_for_support_decision: "[TUR.GetName]에 지원 요청"
 GRE_petition_turkey_for_support_decision_desc: "지진 이후의 복구를 위해 [TUR.GetNameWithFlag]에 지원을 요청합니다. 부디 우리가 어려운 때에 우리를 도울 마음을 내 주기를 바랍니다."
 GRE_cypriot_TT: "§Y키프로스§!가 §Y북키프로스§!에 선전포고합니다"
 GRE_debt_crisis_experienced_tt: "우리는 §R부채 위기§!를 겪었음"
 GRE_joining_the_euro_interest_rate_tt: "§Y$EU_join_the_euro_decision$§! 요건을 변경합니다.\n- §Y이자율§! 요건이 §Y3.5%§! 대신 §Y6.5%§!로 변경\n"
 GRE_defer_payments_decision_tt: "향후 행동(예: 결정, 중점)의 비용을 현금으로 지불하는 대신 §Y국가 부채§! 또는 §Y해외 채권자§!에게 미룰 수 있습니다."
 GRE_golden_visa_deals: "골든 비자"
 GRE_golden_visa_deals_desc: "골든 비자 프로그램은 [GRE.GetAdjective] 부동산 또는 사업에 일정 요건을 충족하는 금액을 투자하는 모든 투자자에게 5년 체류 허가를 제공합니다. EU 역외의 고액 자산가 구매자들이 강한 관심을 보였으며, 이는 국내 시장으로 향하는 외국 자본의 직통 통로를 제공합니다."
 GRE_targeted_pension_reforms: "표적 연금 개혁"
 GRE_targeted_pension_reforms_desc: "연금 제도는 GDP에서 불균형하게 큰 몫을 흡수합니다. 수급 자격을 강화하고 조기 퇴직 남용을 줄이며 보충 연금을 적립식 모델로 전환하는 표적 개혁은 안전망을 완전히 해체하지 않고도 재정 부담을 덜어 줄 것입니다."
 GRE_merchant_marine: "상선단"
 GRE_merchant_marine_desc: "그리스는 아테네에서 가장 강력한 산업 로비 단체 중 하나인 그리스선주협회의 깃발 아래 세계 최대의 상선단을 운영합니다. 선주와 그 가족은 선단 톤수의 5분의 2를 장악하고 있으며, 임금, 세금, 항만 수수료를 통해 GDP의 7~8%가 국가 회계로 흘러들게 합니다. 그들의 경쟁 입지를 강화하면 이 원동력이 계속 돌아갑니다."
 GRE_tonnage_tax_regime: "톤세 제도 유지"
 GRE_tonnage_tax_regime_desc: "선주 가문들은 오랫동안 그리스 선적 선박의 수익성을 유지하고 외국 선적으로 옮겨 가는 것을 막아 주는 유리한 톤세 제도를 누려 왔습니다. 이 제도를 유지하면 그리스 항만과 조선소를 통해 흐르는 수입이 보존되어 스카라망가스, 엘레프시나, 네오리온 조선소가 계속 가동됩니다."
 GRE_tax_the_shipowners: "해운 재벌에 과세"
 GRE_tax_the_shipowners_desc: "해운 거물들은 오랫동안 평범한 그리스인에게 부과되는 세금 부담을 피해 왔습니다. 톤세 제도를 폐지하고 선주들에게 직접 과세하면 국고에 일회성으로 큰 횡재를 거둘 수 있지만, 외국 선적으로의 이전은 여전히 상존하는 위협입니다."
 GRE_shipbuilding_revival: "그리스 조선소 부활"
 GRE_shipbuilding_revival_desc: "스카라망가스, 엘레프시나, 네오리온의 조선소는 한때 그리스에 부를 가져다준 상선단을 건조했습니다. 표적화된 보조금과 계약으로 이들의 역량을 복원하면 조선소의 고용을 되살리고 현대적 선체의 국내 공급을 확보할 수 있습니다."
 GRE_pdo_exports: "원산지 보호 프리미엄 수출"
 GRE_pdo_exports_desc: "칼라마타 올리브, 엑스트라 버진 올리브유, 페타 치즈, 아시르티코 와인은 세계적으로 유명합니다. 원산지 보호 명칭 브랜딩과 프리미엄 마케팅에 투자하면 이 제품들이 범용품 경쟁에서 벗어나 국제 시장에서 더 높은 가격을 받게 됩니다."
 GRE_recapitalize_banks: "은행 자본 재확충"
 GRE_recapitalize_banks_desc: "그리스의 4대 시스템 은행은 위기 동안 1,000억 유로가 넘는 부실 대출을 쌓았습니다. 헬레닉 금융안정기금이 강제 자본 재확충을 통해 새 자본을 투입하면 대출 능력을 회복하고 금융 체계를 안정시킬 수 있지만, 상당한 재정 비용이 따릅니다."
 GRE_hercules_scheme: "헤라클레스 자산 보호 제도"
 GRE_hercules_scheme_desc: "HAPS 제도는 은행 대차대조표에서 부실 대출을 증권화하여 은행의 대출 능력을 되살리고, 신용을 찾는 기업과 가계의 차입 비용을 낮춥니다."
 GRE_privatize_banks: "은행을 민간에 환원"
 GRE_privatize_banks_desc: "자본 재확충을 거친 은행에 대한 국가 지분을 민간 투자자에게 매각하면 기업들의 강한 수요를 끌어들이고 주요 세수원을 얻게 됩니다. 시장의 신임 투표는 그리스가 정상으로 돌아왔다는 신호이기도 합니다."
 GRE_state_bank_control: "은행을 국가 소유로 유지"
 GRE_state_bank_control_desc: "은행의 국가 소유를 유지하면 민간 주주의 이윤 압박 없이 대출을 국내 건설, 산업, 전략 부문으로 향하게 할 수 있습니다. 공공 소유의 정치적 비용은 신용 배분에 대한 통제권으로 상쇄됩니다."
 GRE_nationalist_takeover_TT: "그리스 국민이 재선거를 요구하고 있습니다!\n\n이를 위해 충분한 정치력을 비축해 두십시오. 선거를 치러 정부를 구성하는 데 §R실패§!하면 §Y[Nat_Fascism_L]§!에게 힘을 실어 주기 위해 §R또 한 번의 임시 선거를 치러야 합니다§!."
 GRE_dev_cyp_desc: "키프로스는 수십 년간 분단과 투자 부족에 시달렸습니다. 이제 섬이 그리스의 주권 아래 놓였으니, 기반시설과 경제, 제도를 본토 수준으로 끌어올리는 개발 사업을 시작할 수 있습니다."
 GRE_decrease_taxes: "세금 인하"
 GRE_decrease_taxes_desc: "그리스 국민은 높은 세금으로 압박받아서는 안 됩니다. 게다가 세금을 낮추면 우리나라의 큰 문제인 탈세율도 낮출 수 있습니다."
 GRE_eastern_neighborhood: "동부 이웃국"
 GRE_eastern_neighborhood_desc: "그리스는 가장 가까운 이웃인 튀르키예 및 분단된 키프로스 섬과의 관계를 정립해야 합니다. 양쪽을 어떻게 대하느냐가 한 세대 동안 이 지역의 모습을 결정할 것입니다."
 GRE_turkey_rapprochement: "튀르키예와의 화해"
 GRE_turkey_rapprochement_desc: "그리스와 튀르키예는 어느 쪽도 인정하는 것보다 더 많은 공통점을 가지고 있습니다. 무역, 이민, 에게해에 관한 체계적인 대화는 긴장을 완화하고 안정적인 공존으로 가는 길을 열 수 있습니다."
 GRE_turkey_confrontation: "튀르키예의 야심에 대한 대응"
 GRE_turkey_confrontation_desc: "튀르키예의 거듭된 그리스 영공 침범과 에게해에서의 도발에 응징 없이 넘어갈 수는 없습니다. 그리스는 단호한 입장을 취하고 동맹국들을 결집하여 더 이상의 침탈에 맞설 것입니다."
 GRE_aegean_dialogue: "에게해 대화"
 GRE_aegean_dialogue_desc: "에게해의 권리와 경계에 관한 공식 대화 채널은 우발적 확전의 위험을 줄이고 지속 가능한 해양 협정의 토대를 마련해 줍니다."
 GRE_migration_cooperation: "이민 협력"
 GRE_migration_cooperation_desc: "튀르키예와 이민 정책을 조율하는 것은 에게해를 건너오는 난민의 흐름을 관리하는 데 필수적입니다. 책임을 분담하면 양측 모두 위기가 줄어들 것입니다."
 GRE_greco_turkish_trade: "그리스-튀르키예 무역 협정"
 GRE_greco_turkish_trade_desc: "양자 무역을 확대하면 정치적 대립의 유인이 줄어듭니다. 그리스와 튀르키예 간의 경제적 상호 의존은 양국 국민 모두의 이익에 부합합니다."
 GRE_nato_pressure_turkey: "튀르키예에 대한 나토의 압박"
 GRE_nato_pressure_turkey_desc: "그리스는 나토 내의 입지를 활용하여 튀르키예에게 동맹 규범 위반에 대한 책임을 묻고자 합니다. 우리 동맹국들은 동지중해의 안정을 위해서는 튀르키예의 자제가 필요하다는 점을 인식해야 합니다."
 GRE_aegean_assertiveness: "에게해 주권 주장"
 GRE_aegean_assertiveness_desc: "그리스 해군은 에게해 대륙붕과 영공에 대한 주권을 주장하기 위해 분쟁 해역에서의 순찰과 훈련을 늘릴 것입니다."
 GRE_aegean_deterrence: "에게해 억지력"
 GRE_aegean_deterrence_desc: "해안 방어와 신속 대응 병력에 투자하는 것은 그리스가 어떠한 침범에도 영토를 지킬 준비가 되어 있다는 분명한 신호를 보냅니다."
 GRE_enosis_campaign: "에노시스 캠페인"
 GRE_enosis_campaign_desc: "그리스는 그리스계 키프로스 공동체와의 유대를 강화하고 조국과의 궁극적인 재통합이라는 이상을 증진하기 위한 외교·문화 캠페인을 전개합니다."
 GRE_cypriot_economic_integration: "키프로스 경제 통합"
 GRE_cypriot_economic_integration_desc: "그리스와 키프로스 공화국 사이의 무역 및 금융 연계를 심화하면 재통합이 경제적으로 매력적인 선택이 되고 섬에서의 그리스 영향력이 강화됩니다."
 GRE_northern_outreach: "북부 접촉"
 GRE_northern_outreach_desc: "그리스는 북부의 튀르키예계 키프로스인들에게 손을 내밀어 경제적 유인책과 문화 교류를 제공함으로써, 재통합이 누구 못지않게 그들의 이익에도 부합함을 보여 줍니다."
 GRE_british_bases_accord: "영국 기지 협정"
 GRE_british_bases_accord_desc: "영국은 키프로스에 두 곳의 주권 기지 지역을 보유하고 있습니다. 런던과 협정을 맺으면 향후 재통합 과정에 대한 영국의 중립(혹은 적극적 지원)이 보장됩니다."
 GRE_cyprus_gas_exploitation: "키프로스 가스 개발"
 GRE_cyprus_gas_exploitation_desc: "키프로스 남쪽 해역에서 상당한 천연가스 매장량이 발견되었습니다. 그리스는 이 가스전을 공동으로 개발하여 통합된 섬에 대한 공유된 경제적 이해관계를 만들어 가고자 합니다."
 GRE_confederation_framework: "연방 체제 구상"
 GRE_confederation_framework_desc: "그리스는 공동체의 자치를 보존하면서 섬을 단일 주권 아래 통합하는 공식적인 연방 모델을 제안합니다. 이는 양 공동체 모두가 받아들일 수 있는 틀입니다."
 GRE_cyprus_reunification: "키프로스 재통합"
 GRE_cyprus_reunification_desc: "키프로스 모멘텀이 양 공동체의 폭넓은 지지를 이끌고, 에게해 긴장도가 튀르키예가 개입하지 않을 만큼 낮으며, 영국 기지 협정이 확보되고, 연방 체제 구상이 완전히 구체화되었으니, 마침내 섬을 재통합할 때가 도래했습니다."
 GRE_force_enosis: "문제를 밀어붙이다"
 GRE_force_enosis_desc: "협상은 실패했고 섬은 화약고가 되었습니다. 결코 오지 않을 합의를 기다리는 대신, 아테네는 북부가 행동에 나서도록 도발하며 에노시스를 벼랑 끝까지 밀어붙입니다. 만약 니코시아의 튀르키예계 키프로스 지도부가 먼저 반발한다면, 키프로스 공화국은 무력으로 섬을 재통합할 모든 권리를 갖게 될 것입니다."
 GRE_aegean_tension_high_TT: "§B에게해 긴장도 §H50§! 초과§!"
 GRE_recognize_unified_cyprus: "통합 키프로스 공화국 승인"
 GRE_recognize_unified_cyprus_desc: "니코시아의 군대가 북부를 휩쓸었습니다. 반세기 동안 섬에 상처를 남긴 분단은 끝났습니다. 아테네는 그리스와 노선을 같이하는 단일 키프로스 공화국을 공식 승인하고 해당 영토의 통합을 돕습니다."
 GRE_western_alignment: "서방 정렬"
 GRE_western_alignment_desc: "그리스는 서방 외교의 중심에서의 입지를 재확인합니다. 1952년부터 나토 회원국이자 EU 조기 가입국이며 동지중해의 당연한 닻으로서, 아테네는 지리적 비중을 구속력 있는 정치적 약속으로 전환하고자 양자 및 다자 접촉 캠페인을 시작하며 그 성과는 서방 공약으로 측정됩니다."
 GRE_franco_hellenic_pact: "프랑스-그리스 전략적 동반자 관계"
 GRE_franco_hellenic_pact_desc: "2021년 9월 파리에서 체결된 전략적 동반자 관계를 바탕으로, 그리스는 방위 산업, 외교 정책 조율, 동지중해 안보를 아우르는 프랑스와의 포괄적 양자 체계를 추진합니다. 파리는 유럽에서 가장 의지가 확고한 선임 파트너이며, 이들과의 관계를 더 긴밀히 묶는 것이 신뢰할 만한 서방 노선의 초석입니다."
 GRE_eastmed_trilateral: "동지중해 3자 협력"
 GRE_eastmed_trilateral_desc: "그리스, 이스라엘, 키프로스는 오랫동안 이어 온 3자 협력을 공식화합니다. 합동 해군 훈련, 정보 공유, 그리고 동지중해 안보에 대한 조율된 입장이 그 내용입니다. 이 협정은 우호적인 세 수도를 레반트 해역을 마주한 하나의 전략 블록으로 만듭니다."
 GRE_eu_political_anchor: "EU 회원국의 닻"
 GRE_eu_political_anchor_desc: "그리스는 유럽 프로젝트의 오랜 회원국이라는 정체성을 재확인합니다. 결속, 확대, 공동 외교 정책 등 브뤼셀에서 주도적인 목소리를 냄으로써 아테네는 수십 년간의 회원 자격을 현재의 정치적 비중으로 전환합니다."
 GRE_strategic_partnership_treaty: "제2조 상호 방위 조항"
 GRE_strategic_partnership_treaty_desc: "그리스는 프랑스-그리스 동반자 관계를 결론에 이르게 합니다. 제5조를 본뜬 구속력 있는 상호 방위 조항을 조약 형태로 성문화하는 것입니다. 프랑스는 그리스 영토를 방어할 조약상 의무를 지는 최초의 유럽 강국이 되어 지중해 안보 질서의 영구적 변화를 확정합니다."
 GRE_eastmed_gas_forum: "동지중해 가스 포럼 회원국"
 GRE_eastmed_gas_forum_desc: "그리스는 키프로스, 이스라엘, 이집트, 이탈리아, 요르단, 팔레스타인과 함께 동지중해 가스 포럼 내에서의 역할을 공식화합니다. 이 제도적 틀은 지역 에너지 협력의 닻이 되고, 그리스 해운에 대한 우대 무역 접근권을 확보하며, 아테네에 동지중해 외교 테이블의 상설 의석을 부여합니다."
 GRE_3plus1_dialogue: "3+1 전략 대화"
 GRE_3plus1_dialogue_desc: "그리스, 키프로스, 이스라엘은 미국과의 3+1 대화를 공식화합니다. 이는 에너지 안보, 해양 협력, 대테러를 아우르는 미 국무부 후원 형식입니다. 이 협정은 워싱턴에 동지중해 3자 협력체로 가는 체계적인 창구를 제공하며, 미국의 관여로 지역 구도를 완성합니다."
 GRE_eu_strategic_compass: "EU 전략 나침반"
 GRE_eu_strategic_compass_desc: "그리스는 유럽의 전략적 자율성, 더 깊은 PESCO 통합, 나토 내 유럽 축을 추진하며 EU 전략 나침반의 적극적인 옹호자가 됩니다. 아테네는 대륙 방위 문제에서 파리 및 베를린과 보조를 맞추며, 소극적인 회원 자격을 능동적인 주도적 역할과 맞바꿉니다."
 GRE_pillar_of_the_west: "서방의 기둥"
 GRE_pillar_of_the_west_desc: "수년간의 노력이 결실을 맺습니다. 그리스는 서방 외교의 변방이 아니라 그 초석 중 하나로 우뚝 섰습니다. 캠페인을 통해 누적된 서방 공약으로 가늠되는 유산의 깊이가 아테네가 그 구조에 얼마나 확고히 자리 잡았는지를 결정합니다."
 GRE_regional_diplomacy: "지역 외교"
 GRE_regional_diplomacy_desc: "그리스는 발칸의 기둥이며 모든 이웃 나라와 강력한 관계를 유지해야 합니다. 지역의 안정은 그리스 자신의 안보 및 번영과 불가분의 관계에 있습니다."
 GRE_prespa_implementation: "프레스파 협정 이행"
 GRE_prespa_implementation_desc: "프레스파 협정은 북마케도니아의 국호를 둘러싼 수십 년간의 분쟁을 해결했습니다. 이제 그리스는 의무를 온전히 이행하여 관계를 정상화하고 무역 확대의 문을 엽니다."
 GRE_albania_minority: "알바니아 소수민족 권리"
 GRE_albania_minority_desc: "알바니아 남부에는 상당수의 그리스계 소수민족이 거주하고 있습니다. 그리스는 소수민족 권리에 관한 건설적인 대화를 추진하며, 이 문제를 대립이 아니라 더 깊은 양자 관계의 토대로 삼습니다."
 GRE_egypt_maritime: "이집트 해양 동반자 관계"
 GRE_egypt_maritime_desc: "그리스와 이집트는 동지중해에서 해양 경계 협정을 체결하여 공동 에너지 개발을 위한 법적 틀을 마련하고 해당 해역에서 튀르키예의 주장을 배제합니다."
 GRE_italy_mediterranean_axis: "이탈리아-지중해 축"
 GRE_italy_mediterranean_axis_desc: "이탈리아는 그리스의 EU 내 최대 교역국으로, 연간 양자 무역액이 120억 유로를 넘습니다. 공식적인 동반자 관계는 중부 지중해 전역에서 에너지, 교통, 방위 분야의 협력을 확대합니다."
 GRE_balkan_energy_corridor: "발칸 에너지 회랑"
 GRE_balkan_energy_corridor_desc: "그리스-불가리아 가스 연결관과 알렉산드루폴리스 부유식 터미널은 그리스를 핵심적인 에너지 환적 거점으로 탈바꿈시킵니다. 북마케도니아로 향하는 새 송유관은 이 네트워크를 발칸 깊숙이 확장합니다."
 GRE_mediterranean_energy_hub: "지중해 에너지 허브"
 GRE_mediterranean_energy_hub_desc: "알렉산드루폴리스 FSRU와 레비투사 터미널이 최대 용량으로 가동됨에 따라, 그리스는 유럽의 주요 LNG 관문으로 자리매김하여 러시아 송유관 의존을 동지중해 및 그 너머에서 오는 해상 공급으로 대체합니다."
 GRE_gulf_strategic_partners: "걸프 전략 파트너"
 GRE_gulf_strategic_partners_desc: "그리스는 사우디아라비아와 최고 전략 협력 위원회를 설치하고 아랍에미리트와 방위 및 투자 유대를 심화합니다. 걸프의 자본과 군사 협력이 동지중해로 흘러듭니다."
 GRE_balkans_eu_advocacy: "발칸 EU 가입 지지"
 GRE_balkans_eu_advocacy_desc: "2003년 테살로니키 정상회의의 약속을 바탕으로, 그리스는 서부 발칸의 EU 가입을 옹호합니다. 이 지역에서 가장 오래된 EU 회원국으로서 그리스는 세르비아, 알바니아, 북마케도니아에 대해 소프트 파워 영향력을 얻습니다."
 GRE_imec_gateway: "IMEC 관문"
 GRE_imec_gateway_desc: "인도-중동-유럽 경제 회랑은 피레우스를 유럽 측 종착지로 지정합니다. 대규모 항만 및 물류 투자가 그리스 중부를 아시아와 유럽을 잇는 대륙 간 무역 결절점으로 탈바꿈시킵니다."
 GRE_se_european_pillar: "남동유럽의 기둥"
 GRE_se_european_pillar_desc: "그리스는 에너지 관문, 발칸의 후원자, 지중해 무역의 닻, 세 대륙을 잇는 회랑의 종착지로서 남동유럽의 없어서는 안 될 거점이라는 입지를 굳힙니다."
 GRE_eastern_alignment: "동방 전환"
 GRE_eastern_alignment_desc: "10년간의 트로이카 긴축과 대서양주의의 후견 끝에, 아테네는 동쪽으로 눈을 돌립니다. 그리스는 러시아, 중국, 이란, 정교회 발칸과 병행하여 관계를 키워 나가며, 시간이 지나면서 다극 세계의 지중해 닻으로 스스로를 재편할 것입니다."
 GRE_strategic_autonomy: "전략적 자율성"
 GRE_strategic_autonomy_desc: "그리스는 하나의 주인만 택할 필요가 없습니다. 여전히 러시아산 가스를 사들이고 걸프와 중국의 자본에 구애하며 경쟁자들 사이를 중재하는 나토 회원국은 모든 쪽에서 양보를 얻어 낼 수 있습니다. 아테네는 어느 블록에도 얽매이지 않으면서 모두에게 유용한 다방향 노선을 그려 나갑니다."
 GRE_strategic_autonomy_event_TT: "§Y그리스의 비동맹 입장을 어떻게 활용할 것인가를 두고 논쟁이 시작됩니다.§!"
 GRE_russia_outreach: "모스크바와의 채널 개설"
 GRE_russia_outreach_desc: "그리스는 크렘린에 조용히 접근하여 장기 천연가스 계약, 러시아 해운에 대한 항만 접근 확대, 보다 우호적인 정치적 신호를 제안합니다. 모스크바의 반응이 새로운 지중해 동반자 관계의 분위기를 결정할 것입니다."
 GRE_china_outreach: "베이징과의 협력"
 GRE_china_outreach_desc: "그리스 특사들이 산업 금융, 통신, 기반시설 등 더 깊은 협력을 구하러 베이징으로 향합니다. 중국의 피레우스 인수는 이미 그 모델의 효과를 입증했습니다. 이제 아테네는 이를 그리스 경제 전반으로 확대할 것을 제안합니다."
 GRE_iran_outreach: "테헤란 접촉"
 GRE_iran_outreach_desc: "이란의 제재 관련 불만에 오랫동안 동정적이었던 그리스는 SWIFT 밖의 물물교환 및 에너지 체계를 조용히 제안합니다. 이 조치는 브뤼셀과 워싱턴에서는 도발적이지만, 테헤란이 동의한다면 수익성이 큽니다."
 GRE_orthodox_outreach: "정교회 형제 관계"
 GRE_orthodox_outreach_desc: "아테네는 베오그라드, 니코시아, 예레반과 정상회의를 소집하여 정교회 유럽의 문화적·정치적 연대를 구축합니다. 총대주교청 외교는 국가 경영이 되어, 브뤼셀에도 워싱턴에도 응하지 않는 지역 블록을 형성합니다."
 GRE_russia_milcoop: "그리스-러시아 방위 회담"
 GRE_russia_milcoop_desc: "에너지 동반자 관계에 이어, 아테네는 모스크바와의 공식 방위 협력을 제안합니다. 합동 훈련, S-300 PMU2 현대화, 정보 공유가 그 내용입니다. 나토에 보내는 정치적 신호는 명백합니다."
 GRE_china_bri_anchor: "일대일로의 닻"
 GRE_china_bri_anchor_desc: "그리스는 중국 일대일로의 유럽 측 닻을 자처하여 COSCO의 입지를 넓히고, 아티키에 새로운 자유 무역 지대를 열며, 그리스 물류를 중국 공급망에 통합합니다."
 GRE_iran_med_corridor: "동지중해 회랑"
 GRE_iran_med_corridor_desc: "아테네는 서방의 제재를 우회하기 위해 제3국 중개자를 통해 원유와 LNG를 운송하는 이란-그리스 에너지 회랑을 제안합니다. 테헤란이 수락한다면 그리스는 이란의 유럽 창구가 됩니다."
 GRE_orthodox_security: "정교회 안보 협약"
 GRE_orthodox_security_desc: "정교회 평의회는 합동 훈련, 정보 협력, 상설 정치 협의를 골자로 하는 방위 협약을 공식화합니다. 세르비아, 키프로스, 아르메니아가 그리스와 함께 은밀하지만 분명한 블록을 이룹니다."
 GRE_brics_membership: "BRICS+ 가입"
 GRE_brics_membership_desc: "그리스는 최초의 유럽 회원국으로서 BRICS+ 체제에 공식 가입합니다. 나토와의 결별이 이제 완결되었으며, 그 대가로 아테네는 신개발은행에 대한 우대 접근권, 위안-루블 결제 체계, 다극 세계 테이블의 의석을 얻습니다."
 GRE_multipolar_anchor: "다극 세계의 닻"
 GRE_multipolar_anchor_desc: "그리스는 스스로를 새로운 다극 질서의 닻으로 선언합니다. 대서양 동맹은 폐기되고 유럽 연합은 탈퇴하며, 아테네를 중심으로 세 대륙(유라시아, 레반트, 아프리카)에 걸친 지중해 공화국이 탄생합니다."
 GRE_eastern_outreach: "동방 접촉"
 GRE_eastern_outreach_desc: "아테네는 대서양 동맹 밖의 파트너를 키우기 시작했습니다. 외교적 역량은 동쪽으로 흘러가고 무역 정책의 자율성은 넓어지지만, 서방 수도들은 예의주시하고 있습니다."
 GRE_eurasian_partner: "유라시아 파트너"
 GRE_eurasian_partner_desc: "그리스는 이제 공인된 유라시아 파트너입니다. 모스크바, 베이징, 테헤란의 자본이 그리스 산업을 뒷받침하는 한편 서방의 여론은 굳어집니다. 돌아갈 길은 좁아집니다."
 GRE_brics_anchor: "BRICS의 닻"
 GRE_brics_anchor_desc: "그리스는 BRICS+ 테이블에 앉았습니다. 대서양 동맹은 추억이 되었고 지중해는 다극의 바다입니다. 아테네는 대륙의 경첩으로서의 권위를 가지고 발언합니다."
 GRE_orthodox_defense_pact: "정교회 방위 조약"
 GRE_orthodox_defense_pact_desc: "정교회 유럽 간의 상설 방위 협약입니다. 베오그라드, 니코시아, 예레반과의 합동 훈련, 교리 공유, 정보 통합이 그 내용입니다."
 GRE_iran_barter_framework: "INSTEX식 물물교환"
 GRE_iran_barter_framework_desc: "그리스-이란 무역은 SWIFT 밖의 물물교환 청산소를 통해 이루어지며, 제재를 피하고 그리스 수출업자를 위한 이란 시장을 열어 줍니다."
 GRE_iran_med_corridor_idea: "동지중해 에너지 회랑"
 GRE_iran_med_corridor_idea_desc: "이란산 원유와 LNG가 그리스를 거점으로 하는 회랑을 통해 유럽으로 흘러듭니다. 정유 능력이 확대되고 연료 비축량이 늘어나며, 아테네는 지역 에너지의 요충지가 됩니다."
 GRE_diplomacy_category: "그리스 외교"
 GRE_host_putin_summit: "러시아 정상회담 개최"
 GRE_host_putin_summit_desc: "러시아 대통령을 아테네로 초청하여 주목도 높은 양자 정상회담을 개최합니다. 무역 서류에 서명하고 기념 촬영이 연출되며, 서방 대사관들은 눈살을 찌푸립니다."
 GRE_cosco_pier_expansion: "COSCO 부두 확장"
 GRE_cosco_pier_expansion_desc: "COSCO 피레우스 확장의 또 다른 단계에 공동으로 자금을 댑니다. 민간 공장 한 곳이 3개월간 이 사업에 투입되며, 그 대가로 아티키는 영구적인 기반시설 슬롯을 얻습니다."
 GRE_instex_iran_barter: "이란 물물교환 채널 운영"
 GRE_instex_iran_barter_desc: "그리스-이란 무역의 일부를 물물교환 청산소를 통해 처리하여 체계를 갱신하고, 이를 유지하는 상인들에게 보상합니다."
 GRE_orthodox_patriarchate_summit: "정교회 평의회 소집"
 GRE_orthodox_patriarchate_summit_desc: "아테네에서 총대주교청 정상회의를 개최하여 세르비아, 키프로스, 아르메니아의 지도자들을 모아 교회 및 정치 협의를 진행합니다."
 GRE_retry_russia_outreach: "모스크바에 재접근"
 GRE_retry_russia_outreach_desc: "이전의 거절 이후, 그리스 외교관들은 수정된 제안을 준비하고 크렘린과의 채널을 다시 엽니다."
 GRE_retry_russia_milcoop: "방위 회담 재제안"
 GRE_retry_russia_milcoop_desc: "더 유리한 조건과 한결 조용한 신호로 그리스-러시아 방위 협력 제안을 갱신합니다."
 GRE_retry_china_outreach: "베이징에 재접근"
 GRE_retry_china_outreach_desc: "수정된 조건과 새로운 투자 보증을 지닌 새 특사를 베이징으로 보냅니다."
 GRE_retry_china_bri_anchor: "일대일로 닻 역할 재제안"
 GRE_retry_china_bri_anchor_desc: "물류, 소유권, 정치적 노선에서 더 폭넓은 양보를 담아 일대일로 닻 제안을 수정합니다."
 GRE_retry_iran_outreach: "테헤란과 재접촉"
 GRE_retry_iran_outreach_desc: "테헤란의 최초 거절 이후, 아테네는 제3국 중개자를 통해 비공식 회담 채널을 다시 엽니다."
 GRE_retry_iran_med_corridor: "지중해 회랑 재제안"
 GRE_retry_iran_med_corridor_desc: "서방의 제재 집행에 대한 이란의 노출을 더욱 줄이는 새로운 경로 방안으로 동지중해 회랑 제안을 수정합니다."
 GRE_retry_orthodox_outreach: "정교회 정상회의 재소집"
 GRE_retry_orthodox_outreach_desc: "최초 정상회의가 실패한 후 관계를 회복하고 정교회 국가 외무장관들을 다시 아테네로 불러 모읍니다."
 GRE_retry_orthodox_security: "안보 협약 재제안"
 GRE_retry_orthodox_security_desc: "정보 공유와 훈련 순환에 관한 수정된 약속과 함께 정교회 안보 협약을 갱신합니다."
 greece.530.t: "그리스의 에너지 제안"
 greece.530.d: "아테네가 포괄적인 에너지 및 무역 동반자 관계를 제안합니다. 장기 가스 계약, 러시아 해운에 대한 항만 양허, 그리고 모스크바를 향한 그리스 외교 정책의 은밀한 재조정이 그 내용입니다. 그리스 외무장관이 답변을 기다리고 있습니다."
 greece.530.a: "환영할 만한 시작이다. 서명하라."
 greece.530.b: "아테네는 약속을 이행할 수 없다. 거절하라."
 greece.531.t: "모스크바, 동반자 관계 수락"
 greece.531.d: "크렘린이 그리스의 제안을 수락합니다. 무역 서류가 교환되고, 개선된 양자 협정이 체결되며, 러시아산 가스가 유리한 조건으로 흐르기 시작합니다. 아테네는 첫 동방 파트너를 얻었습니다."
 greece.531.a: "새로운 그리스 외교 정책에 오신 것을 환영합니다."
 greece.532.t: "모스크바, 거절"
 greece.532.d: "크렘린이 그리스의 제안을 정중히 거절합니다. 아테네가 대서양 동맹을 떠나겠다는 확실한 보장이 없는 한, 모스크바에는 정치적 위험을 감수할 유인이 없습니다. 좌절은 현실이지만 문이 닫힌 것은 아닙니다."
 greece.532.a: "전열을 정비하고 다시 시도하자."
 greece.533.t: "그리스의 방위 협력 제안"
 greece.533.d: "아테네가 공식 그리스-러시아 방위 체계를 제안합니다. 합동 훈련, S-300 PMU2 현대화 지원, 정보 공유가 그 내용입니다. 모스크바는 정치적 성과와 나토의 외교적 반발을 저울질합니다."
 greece.533.a: "역사적인 제휴다. 수락하라."
 greece.533.b: "그리스는 여전히 나토 회원국이다. 거절하라."
 greece.534.t: "모스크바, 방위 회담 수락"
 greece.534.d: "러시아 국방부가 공식 협력에 동의합니다. 그리스 장교들이 훈련을 위해 모스크바로 향하고, 러시아 기술자들이 살라미스 해군 기지에 도착합니다. 육군 교리 보너스는 상당하지만 정치적 대가 또한 그렇습니다."
 greece.534.a: "그리스-러시아 무기 협력이 시작된다."
 greece.535.t: "모스크바, 방위 회담 거절"
 greece.535.d: "모스크바는 그리스의 지속적인 나토 의무를 이유로 거절합니다. 아테네가 대서양 동맹을 떠나거나 적어도 그럴 신뢰할 만한 의사를 밝히기 전까지는 공식 방위 협력이 없을 것입니다."
 greece.535.a: "더 큰 헌신을 요구한다는 점을 기록해 두자."
 greece.536.t: "그리스의 베이징 접근"
 greece.536.d: "아테네가 통신, 기반시설 금융, 더 폭넓은 일대일로 통합 등 심화된 경제 협력을 제안하며 베이징에 접근합니다. 중국 외교부는 이 제안을 검토에 들어갑니다."
 greece.536.a: "자연스러운 조합이다. 지지하라."
 greece.536.b: "정치적 비용이 이익보다 크다. 거절하라."
 greece.537.t: "베이징, 수락"
 greece.537.d: "중국 지도부가 동반자 관계를 지지합니다. 국가 자본이 그리스의 산업 및 통신 사업으로 흘러들기 시작하고, 베이징의 셈법에서 그리스의 영향력이 눈에 띄게 높아집니다."
 greece.537.a: "중국-그리스 동반자 관계가 심화된다."
 greece.538.t: "베이징, 거절"
 greece.538.d: "베이징이 난색을 표합니다. 이미 조용한 경로로 확보한 것 이상을 아테네가 제공할 수는 없다는 논리입니다. 그리스 외교관들은 빈손으로 돌아오지만 의지는 꺾이지 않았습니다."
 greece.538.a: "다시 검토하고 재시도하자."
 greece.539.t: "그리스의 일대일로 닻 제안"
 greece.539.d: "아테네가 일대일로의 유럽 측 닻을 자처하며 COSCO 양허 확대, 아티키의 자유 무역 지대, 인도·태평양 문제에 대한 정치적 노선 일치를 제안합니다. 대가는 크지만 보상 또한 큽니다."
 greece.539.a: "역사적인 야심의 닻이다. 수락하라."
 greece.539.b: "조건이 아직 받아들일 만하지 않다. 거절하라."
 greece.540.t: "베이징, 일대일로 닻 지지"
 greece.540.d: "중국이 그리스를 일대일로의 닻으로 공식 지정합니다. 건설 인력이 동원되고 아티키로 자본이 쏟아져 들어오며, 중국의 투자가 그리스 산업을 뒷받침하면서 수도권에 민간 공장이 추가로 들어섭니다."
 greece.540.a: "그리스는 일대일로의 유럽 종착지다."
 greece.541.t: "베이징, 닻 역할 거절"
 greece.541.d: "베이징은 그리스의 정치적 변동성이 이 정도 규모로 약속하기에는 너무 높다고 판단하여 공식 닻 지정을 거절합니다. 제안이 갱신되려면 아테네가 더 확고한 노선 일치를 보여 주어야 합니다."
 greece.541.a: "조건을 재검토해야 한다."
 greece.542.t: "그리스의 테헤란 접촉"
 greece.542.d: "테헤란에 파견된 그리스 특사가 서방의 제재를 우회하고 이란 시장을 그리스 수출업자에게 개방하기 위한 SWIFT 밖의 물물교환 및 무역 체계를 제안합니다. 최고국가안보회의가 이 제안을 논의합니다."
 greece.542.a: "유럽에서 온 반가운 파트너다. 수락하라."
 greece.542.b: "아테네는 서방을 대변한다. 거절하라."
 greece.543.t: "테헤란, 체계 수락"
 greece.543.d: "테헤란이 동의합니다. 아테네에 물물교환 청산소가 설립되고 그리스 수출업자들은 이란 시장에 대한 우대 접근권을 얻습니다. 서방 수도들은 달가워하지 않습니다."
 greece.543.a: "이란 체계에 진입한 최초의 유럽 국가다."
 greece.544.t: "테헤란, 거절"
 greece.544.d: "테헤란이 거절합니다. 이란 외무장관은 그리스가 여전히 나토 국가이며, 어떤 체계든 가동되는 순간 미국의 2차 제재에 취약해질 것이라고 지적합니다."
 greece.544.a: "먼저 독립성을 입증하라."
 greece.545.t: "그리스의 지중해 회랑 제안"
 greece.545.d: "아테네가 동지중해 회랑을 제안합니다. 이란산 원유와 LNG를 제3국 중개자를 거쳐 그리스 터미널로 보낸 뒤 유럽으로 재수출하는 방식입니다. 이란 측은 이익과 미국의 보복을 저울질합니다."
 greece.545.a: "회랑은 전략적 보상이다. 수락하라."
 greece.545.b: "노출 위험이 너무 크다. 거절하라."
 greece.546.t: "테헤란, 회랑 지지"
 greece.546.d: "테헤란이 회랑을 지지합니다. 이란산 원유가 그리스 항구에 도착하기 시작하고, 아티키와 보이오티아 전역에서 정유 능력이 확대됩니다. 그리스는 지중해 에너지의 요충지가 되고 테헤란은 조용한 수혜자가 됩니다."
 greece.546.a: "동지중해 에너지 회랑이 개통되었다."
 greece.547.t: "테헤란, 회랑 거절"
 greece.547.d: "테헤란은 중개국에 대한 미국의 역압박을 이유로 거절합니다. 회랑 구상은 보류되며, 양국 수도는 여건이 허락할 때 재검토할 것입니다."
 greece.547.a: "더 나은 때를 기다리자."
 greece.548.t: "아테네, 정교회 평의회 소집"
 greece.548.d: "아테네가 세르비아, 키프로스, 아르메니아 등 유럽 정교회 국가들 간의 상설 정치 협의를 제안합니다. 총대주교청 외교가 명분으로 내세워지지만 진짜 의도는 국가 경영입니다."
 greece.548.a: "늦은 감이 있는 형제 관계다. 수락하라."
 greece.548.b: "위험이 이익보다 크다. 거절하라."
 greece.549.t: "베오그라드, 평의회 지지"
 greece.549.d: "베오그라드가 제안을 지지하고 니코시아가 뒤를 따릅니다. 그리스, 세르비아, 키프로스 외무장관이 참석한 정교회 평의회가 아테네에서 열립니다. 은밀하지만 분명한 블록이 형성되었습니다."
 greece.549.a: "정교회 블록이 탄생했다."
 greece.550.t: "베오그라드, 거절"
 greece.550.d: "베오그라드는 브뤼셀을 자극하고 세르비아의 EU 가입을 복잡하게 만들 우려를 이유로 거절합니다. 정교회 구상은 지연되었을 뿐 죽은 것은 아닙니다."
 greece.550.a: "인내하자. 때는 올 것이다."
 greece.551.t: "그리스의 안보 협약 제안"
 greece.551.d: "아테네가 정교회 블록을 방위 협약으로 공식화할 것을 제안합니다. 공동 훈련, 정보 통합, 상설 정치 협의가 그 내용입니다. 베오그라드는 보상과 브뤼셀의 불가피한 반응을 저울질합니다."
 greece.551.a: "협약은 우리 모두를 강하게 한다. 수락하라."
 greece.551.b: "베오그라드는 위험을 감수할 수 없다. 거절하라."
 greece.552.t: "정교회 방위 협약 체결"
 greece.552.d: "베오그라드, 니코시아, 예레반이 아테네와 함께 정교회 방위 조약을 공식화합니다. 합동 훈련이 시작되고 정보 채널이 열리며, 은밀한 유럽의 한 극이 지도 위에 나타났습니다."
 greece.552.a: "정교회 안보 구조가 수립되었다."
 greece.553.t: "베오그라드, 협약 거절"
 greece.553.d: "베오그라드는 EU 가입 협상이 진행 중인 동안 외교적 비용이 너무 크다고 판단하여 공식 협약을 거절합니다. 정교회 블록은 유지되지만 비공식적입니다."
 greece.553.a: "다른 수단으로 밀어붙이자."
 greece.554.t: "BRICS+ 환영"
 greece.554.d: "BRICS+ 지도자들이 그리스를 동맹 최초의 유럽 회원국으로 공식 환영합니다. 러시아, 중국, 인도, 이란의 특사들이 가입식을 위해 아테네에 도착합니다. 대서양의 장은 닫혔습니다."
 greece.554.a: "아테네가 다극 세계의 테이블에 서다."
 greece.555.t: "다극 세계의 닻이 된 그리스"
 greece.555.d: "그리스는 대서양 동맹과 유럽 연합을 공식 폐기하고 스스로를 새로운 다극 질서의 닻으로 선언했습니다. 세 대륙에 걸친 지중해 공화국이 아테네에서 선포되었습니다. 세계는 그에 맞추어 재편됩니다."
 greece.555.a: "그리스의 미래가 시작되었다."
 greece.555.b: "서방은 지중해 측면을 잃었다."
 greece.555.c: "새로운 극이 등장했다. 주의 깊게 지켜보자."
 CYP_seek_greek_union: "그리스와의 합병 추진"
 CYP_seek_greek_union_desc: "키프로스 공화국은 그리스와의 유대를 강화하고 궁극적인 정치적 통합을 향해 나아가기 위한 공식 외교 구상을 추진합니다."
 CYP_appeal_to_un: "국제연합에 호소"
 CYP_appeal_to_un_desc: "키프로스는 그리스계 키프로스 공동체에 이로운 해결책에 대한 국제적 정당성을 얻기 위해 재통합 문제를 국제연합에 상정합니다."
 CYP_economic_incentive_north: "북부를 위한 경제적 유인책"
 CYP_economic_incentive_north_desc: "키프로스는 북부의 튀르키예계 키프로스 공동체에 경제적 제안을 내놓아 재통합이 섬의 모든 주민에게 실질적 이익을 가져다준다는 점을 보여 줍니다."
 NCY_seek_turkish_union: "튀르키예와의 합병 추진"
 NCY_seek_turkish_union_desc: "북키프로스는 튀르키예와의 정치·경제적 유대를 심화하여 튀르키예 주도 아래의 공식 통합 가능성을 앞당깁니다."
 NCY_recognition_campaign: "국제 승인 캠페인"
 NCY_recognition_campaign_desc: "북키프로스는 더 폭넓은 국제 승인을 얻기 위한 외교 캠페인을 펼쳐 국제 사회의 눈에 자국 정부의 정당성을 확보합니다."
 GRE_aegean_defense_posture: "에게해 방어 태세"
 GRE_aegean_defense_posture_desc: "높아진 대비 태세와 전진 배치된 병력이 그리스군을 높은 경계 상태로 유지합니다. 모든 요격, 모든 순찰, 모든 훈련은 그리스 영토가 지켜질 것이라는 신호입니다."
 GRE_cypriot_integration_idea: "키프로스 경제 통합"
 GRE_cypriot_integration_idea_desc: "관세 동맹과 은행 제도 조화를 포함한 키프로스 공화국과의 깊은 경제 통합은 무역 유대를 강화하고 양국 경제에 지속적인 법인세 수입을 창출합니다."
 GRE_north_macedonian_ties: "북마케도니아와의 유대"
 GRE_north_macedonian_ties_desc: "프레스파 협정 이후 스코페와의 관계 정상화는 발칸에서 새로운 외교 채널을 열었으며, 정치적 영향력으로 이어지는 호의를 만들어 내고 있습니다."
 GRE_chinese_investment: "중국의 기반시설 투자"
 GRE_chinese_investment_desc: "중국 국가 자본이 그리스 전역의 기반시설 및 산업 건설 사업에 자금을 대고 있으며, 국내 예산만으로는 감당할 수 없는 건설 계획을 가속하고 있습니다."
 GRE_lng_gateway: "LNG 관문"
 GRE_lng_gateway_desc: "그리스는 유럽의 주요 액화 천연가스 양륙 지점으로 자리매김하여 송유관에 의존하지 않는 에너지를 지역 파트너들에게 공급하고 있습니다."
 GRE_balkan_advocate: "발칸 EU 가입 옹호국"
 GRE_balkan_advocate_desc: "서부 발칸 가입을 이끄는 EU의 선두 옹호국으로서, 그리스는 북쪽 이웃 나라들에 대해 커지는 소프트 파워 영향력을 행사합니다."
 GRE_imec_terminus: "IMEC 유럽 종착지"
 GRE_imec_terminus_desc: "피레우스가 인도-중동-유럽 경제 회랑의 유럽 측 종착지로 지정되면서 상당한 환적 수입과 기반시설 투자를 가져옵니다."
 GRE_regional_pillar: "남동유럽의 기둥"
 GRE_regional_pillar_desc: "그리스는 남동유럽 지역의 없어서는 안 될 거점으로서의 역할을 확보하여 에너지, 무역, 외교 채널 전반에 영향력을 투사하고 있습니다."
 GRE_epirus_cultural_ties: "에피루스 문화적 유대"
 GRE_epirus_cultural_ties_desc: "티라나와의 공식 소수민족 권리 체계는 알바니아 남부의 그리스어 사용 공동체를 안정시켜, 오랜 골칫거리를 조용한 외교적 자산으로 바꾸었습니다."
 GRE_italo_hellenic_axis: "이탈리아-그리스 축"
 GRE_italo_hellenic_axis_desc: "로마와의 조율된 산업 정책과 공동 조선소 계획은 아테네와 이탈리아 반도를 하나의 지중해 경제권으로 묶었습니다."
 GRE_balkan_gas_transit: "발칸 가스 환적"
 GRE_balkan_gas_transit_desc: "IGB 송유관 확장으로 카스피해 및 동지중해산 가스가 그리스 영토를 거쳐 더 넓은 발칸으로 공급되어 지속적인 환적 수입을 창출합니다."
 GRE_gulf_capital_inflow: "걸프 자본 유입"
 GRE_gulf_capital_inflow_desc: "아라비아 반도의 국부 펀드가 그리스 산업과 물류에 진출하여 경제 전반의 자본 형성을 가속하고 있습니다."
 GRE_eez_delimitation: "EEZ 경계 획정 협정"
 GRE_eez_delimitation_desc: "카이로와의 양자 배타적 경제 수역 협정은 그리스 선박에 동지중해를 통과하는 명확한 항로를 보장하고 경쟁 해양 영유권 주장에 맞설 법적 틀을 제공합니다."
 greece.500.t: "스티븐 손더스의 죽음"
 greece.500.d: "영국 국방 무관 스티븐 손더스가 11월 17일 테러 조직에 의해 아테네에서 암살되었습니다. 대담한 이 공격은 국제적 비난을 불러일으켰고 그리스 보안 기관들에 이 조직을 해체하라는 막대한 압박을 가했습니다."
 greece.500.a: "국내 테러를 단속한다"
 greece.500.b: "국제 정보 기관과 협력한다"
 greece.501.t: "혁명 조직 재판"
 greece.501.d: "체포된 11월 17일 조직원들이 아테네에서 재판을 받고 있습니다. 수십 년간 사법망을 피해 온 조직의 지도부는 일련의 암살과 폭탄 테러로 기소되었습니다. 이번 재판은 그리스 대테러 활동의 획기적인 순간입니다."
 greece.501.a: "중형을 선고한다"
 greece.501.b: "이를 보안 기관 개혁의 기회로 삼는다"
 greece.502.t: "테러와의 전쟁 시위"
 greece.502.d: "이라크 침공에 반발하여 그리스 전역에서 대규모 반전 시위가 일어났습니다. 수만 명이 아테네와 테살로니키 거리로 나와 미국 주도 작전에 대한 깊은 국민적 반대를 드러내고 있습니다."
 greece.502.a: "평화적 시위를 허용한다"
 greece.502.b: "질서 유지를 위해 시위를 제한한다"
 greece.503.t: "헬리오스 항공 522편 추락"
 greece.503.d: "헬리오스 항공 522편이 자동 조종으로 유령 비행을 한 끝에 그라마티코 인근에 추락하여 승객과 승무원 121명 전원이 사망했습니다. 객실 기압 조절 실패로 인한 이 참사는 그리스의 항공 안전 감독에 대한 심각한 의문을 불러일으켰습니다."
 greece.503.a: "항공 안전 개혁을 시작한다"
 greece.503.b: "국가 애도의 날을 선포한다"
 greece.504.t: "아테네의 쿠르드 시위"
 greece.504.d: "아테네의 쿠르드 디아스포라 구성원들이 쿠르드 권리를 지지하는 대규모 시위를 조직했습니다. 이 시위는 해외의 쿠르드 활동에 대한 어떤 지지든 의심의 눈으로 보는 앙카라의 주목을 끌었습니다."
 greece.504.a: "시위를 계속하도록 허용한다"
 greece.504.b: "군중을 해산시킨다"
 greece.505.t: "가자 위기 시위"
 greece.505.d: "가자 지구의 위기가 고조됨에 따라 그리스 도시 전역에서 친팔레스타인 시위가 일어났습니다. 시위대는 정부에 군사 작전에 맞서 더 강력한 입장을 취하고 인도적 원조를 제공할 것을 촉구하고 있습니다."
 greece.505.a: "시위대와 연대를 표명한다"
 greece.505.b: "자제와 외교적 해결책을 촉구한다"
 greece.506.t: "2007년 그리스 산불"
 greece.506.d: "파괴적인 산불이 펠로폰네소스와 에우보이아 전역을 휩쓸어 수십 명이 사망하고 마을 전체가 파괴되었습니다. 이 화재는 그리스의 재난 대응 능력에 있는 치명적인 약점을 드러냈고 정부의 위기 대처에 대한 국민적 분노를 불러일으켰습니다."
 greece.506.a: "비상 자원을 동원한다"
 greece.506.b: "국제 원조를 요청한다"
 greece.507.t: "알렉산드로스 그리고로풀로스의 죽음"
 greece.507.d: "15세의 알렉산드로스 그리고로풀로스가 아테네 엑사르히아 지구에서 경찰관이 쏜 총에 맞아 사망했습니다. 이 총격은 수십 년 만에 그리스가 겪는 최악의 폭동을 촉발했으며, 주요 도시 전역에서 광범위한 파괴가 벌어지고 있습니다."
 greece.507.a: "책임 있는 경찰관들을 기소한다"
 greece.507.b: "질서 회복을 위해 진압 경찰을 투입한다"
 greece.508.t: "2009년 그리스 산불"
 greece.508.d: "또 한 번의 파괴적인 산불 시즌이 그리스를 강타하여 아티키와 펠로폰네소스 동부 전역의 산림을 황폐화하고 정착지를 위협하고 있습니다. 2007년의 교훈에도 불구하고 국가의 소방 기반시설은 여전히 한계에 가깝습니다."
 greece.508.a: "화재 예방 기반시설에 투자한다"
 greece.508.b: "피해 지역 공동체에 대한 구호에 집중한다"
 greece.509.t: "황금새벽당, 의회 진출"
 greece.509.d: "극우 정당 황금새벽당이 긴축과 경제 위기에 대한 국민적 분노를 등에 업고 처음으로 의석을 확보했습니다. 이들의 노골적인 민족주의적이고 폭력적인 수사는 유럽 전역의 민주주의 기관들을 경악하게 했습니다."
 greece.509.a: "그들의 활동을 면밀히 감시한다"
 greece.509.b: "변방 운동으로 간주하고 무시한다"
 greece.510.t: "그리스 해법당 창당"
 greece.510.d: "방송 진행자 키리아코스 벨로풀로스가 보수-민족주의 대안을 표방하며 그리스 해법당을 창당했습니다. 이 당은 전통 우파와 극우 변방 모두에 환멸을 느낀 유권자들에게 호소합니다."
 greece.510.a: "새로운 정치 지형을 인정한다"
 greece.510.b: "포퓰리스트라며 일축한다"
 greece.511.t: "파블로스 피사스의 죽음"
 greece.511.d: "반파시스트 래퍼 파블로스 피사스가 케라치니에서 황금새벽당원의 칼에 찔려 사망했습니다. 이 살인은 전국적인 분노를 불러일으켰고, 정부가 이 당의 폭력 조직망에 단호한 조치를 취해야 한다는 요구를 한층 높였습니다."
 greece.511.a: "황금새벽당을 단속한다"
 greece.511.b: "침착과 적법 절차를 호소한다"
 greece.512.t: "황금새벽당원 재판"
 greece.512.d: "황금새벽당 지도부가 유럽 역사상 정당을 상대로 한 최대 규모의 형사 사건이 된 재판을 받고 있습니다. 범죄 조직 운영, 살인, 이민자와 정적을 겨냥한 다수의 폭행이 혐의에 포함됩니다."
 greece.512.a: "최고형을 요구한다"
 greece.512.b: "정의가 순리대로 진행되도록 한다"
 greece.513.t: "에게해 대지진"
 greece.513.d: "레스보스 인근 에게해 동부에 강력한 지진이 닥쳐 상당한 피해와 인명 손실이 발생했습니다. 튀르키예 또한 영향을 받아, 두 이웃 나라 사이에 재난 구호를 위한 양자 협력의 드문 기회가 열렸습니다."
 greece.513.a: "국가 구호 활동을 시작한다"
 greece.513.b: "튀르키예와 구호에 협력한다"
 greece.514.t: "2018년 아티키 산불"
 greece.514.d: "파국적인 산불이 아티키 동부를 휩쓸어 해안 마을 마티에서만 100명이 넘는 사람이 사망했습니다. 이는 그리스 역사상 가장 치명적인 산불 재해로, 비상 계획과 민방위의 구조적 실패를 드러냈습니다."
 greece.514.a: "민방위 체계를 전면 개편한다"
 greece.514.b: "피해자에게 즉각 지원을 제공한다"
 greece.515.t: "또 한 번의 아테네 지진"
 greece.515.d: "아테네 인근에서 지진이 발생하여 건물이 파손되고 수도에 광범위한 불안이 퍼졌습니다. 인명 피해는 제한적이지만, 이 사건은 그리스의 노후한 기반시설의 내진 능력을 둘러싼 논쟁을 다시 불러일으켰습니다."
 greece.515.a: "건축 기준을 강화한다"
 greece.515.b: "긴급 구호를 제공한다"
 greece.517.t: "에게해 대지진"
 greece.517.d: "레스보스 인근 에게해 동부에 강력한 지진이 닥쳐 상당한 피해와 인명 손실이 발생했습니다. 튀르키예 또한 영향을 받아, 두 이웃 나라 사이에 재난 구호를 위한 양자 협력의 드문 기회가 열렸습니다."
 greece.517.a: "구호 활동을 동원한다"
 greece.518.t: "2018년 아티키 산불"
 greece.518.d: "파국적인 산불이 아티키 동부를 휩쓸어 해안 마을 마티에서만 100명이 넘는 사람이 사망했습니다. 이는 그리스 역사상 가장 치명적인 산불 재해로, 비상 계획과 민방위의 구조적 실패를 드러냈습니다."
 greece.518.a: "긴급 대응을 시작한다"
 greece.519.t: "또 한 번의 아테네 지진"
 greece.519.d: "아테네 인근에서 지진이 발생하여 건물이 파손되고 수도에 광범위한 불안이 퍼졌습니다. 인명 피해는 제한적이지만, 이 사건은 그리스의 노후한 기반시설의 내진 능력을 둘러싼 논쟁을 다시 불러일으켰습니다."
 greece.519.a: "긴급 구조 기관을 조율한다"
 greece.620.t: "통합의 문제"
 greece.620.d: "아테네는 키프로스 공화국에 연방을 완성하고 그리스 국가와 재통합할 것을 공식 초청했습니다. 결정은 니코시아에 달려 있습니다."
 greece.620.a: "그리스 연합에 가입한다"
 greece.620.b: "독립 공화국으로 남는다"
 greece.621.t: "북부의 문제"
 greece.621.d: "그리스의 제안은 섬의 북부에까지 미칩니다. 아테네 아래의 재통합은 별도의 북부 행정부를 해체하고 그 영토를 그리스 국가 안에 편입시킬 것입니다."
 greece.621.a: "재통합을 수락한다"
 greece.621.b: "제안을 거부한다"
 greece.630.t: "아테네의 호소"
 greece.630.d: "그리스는 도시를 짓누르는 주택난을 해소하는 데 도움을 달라고 튀르키예에 요청했습니다. 협력은 아테네의 부담을 덜어 주고 두 이웃 나라 사이의 드문 선의의 순간이 될 것입니다."
 greece.630.a: "지원을 제공한다"
 greece.630.b: "개입을 거절한다"
 greece.631.t: "튀르키예의 지원 도착"
 greece.631.d: "튀르키예의 원조와 건설 지원이 그리스로 흘러들기 시작하여 최악의 주택난을 완화하고 에게해 양안의 관계를 누그러뜨리고 있습니다."
 greece.631.a: "반가운 도움의 손길"
 greece.632.t: "앙카라의 도움 없음"
 greece.632.d: "튀르키예는 그리스의 주택난에 관여하기를 거절했습니다. 아테네는 이 위기를 홀로 감당해야 합니다."
 greece.632.a: "우리 힘으로 일어선다"
 greece.641.t: "기록적인 시즌"
 greece.641.d: "이번 여름은 모든 방문객 기록을 갈아치웠습니다. 호텔은 만실이고 공항은 북적이며 수입이 쏟아져 들어옵니다. 문제는 누가 이 횡재의 혜택을 보느냐입니다."
 greece.641.a: "섬들에 재투자한다"
 greece.641.b: "사업자들이 가져가도록 둔다"
 greece.642.t: "디아스포라의 화답"
 greece.642.d: "해외 그리스인들에 대한 호소가 공감을 불러일으켰습니다. 조국이 회복하기를 바라는 전 세계 공동체에서 투자 약정과 송금이 흘러들고 있습니다."
 greece.642.a: "디아스포라 국부 펀드를 출범한다"
 greece.642.b: "송금액에 상응하는 세금 감면을 제공한다"
 greece.643.t: "수도꼭지를 연 브뤼셀"
 greece.643.d: "첫 번째 회복 기금 분할분이 승인되었습니다. 수백억 유로가 오고 있지만, 개혁과 그리스가 이 돈을 제때 실제로 집행할 수 있는지 여부가 조건입니다."
 greece.643.a: "사업을 앞당겨 추진한다"
 greece.643.b: "신중하게 집행한다"
 greece.650.t: "다방향 독트린"
 greece.650.d: "아테네는 동서양 모두와 자국의 조건으로 거래하겠다고 선언했습니다. 내각은 이 독립성을 어떻게 영향력으로 전환할지 논의합니다."
 greece.650.a: "에너지 및 무역 파트너를 다변화한다"
 greece.650.b: "그리스를 지역 중재자로 자리매김시킨다"
 greece_military.01.t: "그리스 방위 시스템 출범"
 greece_military.01.d: "피르칼과 그리스 무기 산업이 국영 단일 기업인 그리스 방위 시스템으로 통합되었습니다. 이 통합은 조달을 간소화하고 생산을 표준화하며, 단일 경영 구조 아래 국내 방위 산업 역량을 재건하기 위한 것입니다."
 greece_military.01.a: "국가 대표 기업이 탄생했다"
 greece_military.02.t: "그리스 해군, 우리 영해에 도전"
 greece_military.02.d: "그리스는 주권 해역 전략을 완성하고 이제 분쟁 중인 에게해 및 크레타 해역에 대한 권리를 공개적으로 주장하고 있습니다. 그들의 해군 확장은 동지중해에서 우리의 입지에 대한 직접적인 도전입니다."
 greece_military.02.a: "함대를 확장한다"
 greece_military.02.b: "외교적 항의를 제기한다"
 greece.516.t: "기세를 얻은 민족주의 운동"
 greece.516.d: "그리스의 지원을 받는 ELAM 민족주의자들이 우리 섬 전역으로 영향력을 퍼뜨려 왔습니다. 이들의 수사는 그리스와의 합병을 요구하며 일부 주민들 사이에서 호응을 얻었습니다. 우리는 그들의 존재를 용인하거나, 대중의 불안을 감수하고 단속할 수 있습니다."
 greece.516.a: "활동하도록 둔다"
 greece.516.b: "운동을 탄압한다"
 greece_debt.1.t: "부채 스와프 파트너"
 greece_debt.1.desc: "청구서는 계속 날아들고 국고는 계속 줄어들고 있습니다. 우리 재무장관은 파트너 국가의 중앙은행을 통해 유로화 표시 부채의 일부를 외화로 스와프하는 방안을 제안했습니다. 새 채권자는 이자를 부과하겠지만, 협상 가능한 금리와 현재의 채권자들보다 우호적인 조건일 것입니다. 인도, 러시아, 중국, 또는 ECB가 파트너가 될 수 있으나, 각각 고유한 정치적 대가가 따릅니다."
 greece_debt.1.a: "루피가 좋겠다"
 greece_debt.1.b: "루블이 좋겠다"
 greece_debt.1.c: "위안이 좋은 선택일지도 모른다"
 greece_debt.1.e: "현 노선을 유지한다"
 GRE_debt_swap_accept_tt: "§G수락할 경우:§! 그들은 우리 부채의 일부를 매입하여 우리가 이자를 지급해야 하는 채권자가 되며, 지금은 대차대조표를 완화해 주는 대신 이후에는 꾸준한 지급이 필요합니다."
 GRE_debt_counter_refund_tt: "우리는 역제안을 거절합니다. 채권자가 되려던 쪽이 선지급한 자본은 전액 환불됩니다."
 greece_debt.2.a: "거절해야 한다"
 greece_debt.2.b: "그들의 부채를 떠안겠다"
 GRE_homelessness_crisis_idea: "아테네 노숙 위기"
 GRE_homelessness_crisis_idea_desc: "아테네 지진으로 수천 명이 집을 잃고 공원에서 잠을 자고 있습니다. 사회 서비스는 한계에 이르렀고 천막촌이 수도 전역으로 퍼지고 있습니다. 행동에 나서기를 미룰수록 상황은 악화됩니다."
 GRE_the_drachma_idea: "드라크마"
 GRE_the_drachma_idea_desc: "유로존 밖에서 운영한다는 것은 우리가 직접 드라크마를 관리한다는 의미입니다. 통화 불안정과 높은 차입 비용은 경제의 발목을 잡지만, 약한 드라크마는 그리스 수출품의 경쟁력을 유지하고 국제 시장에서의 수익을 끌어올립니다."
 GRE_solving_tax_evasion_idea: "세금 허점 해결"
 GRE_solving_tax_evasion_idea_desc: "세금 허점을 해결하면 틈새를 없앨 수 있지만, 다수의 위원회와 국가 세법의 재검토가 필요합니다."
 GRE_tax_evasion_idea: "통제되지 않는 탈세"
 GRE_tax_evasion_idea_desc: "탈세는 그리스의 재정 생활에 깊이 뿌리내려 있으며 정부 세입을 고갈시킵니다. 기본 서비스와 개혁에 쓸 자금이 없어 국가는 옴짝달싹 못 하고 있습니다."
 GRE_bonds_issued_idea: "고금리 단기 채권"
 GRE_bonds_issued_idea_desc: "우리는 높은 금리의 단기 채권을 발행했습니다. 현금 유입은 당장은 도움이 되지만, 부채가 만기가 될 때까지 높은 수익률은 부담이 될 것입니다."
