 BOL_inefficient_economic_model: "Modelo Econômico Ineficiente"
 BOL_inefficient_economic_model_desc:0 "A Bolívia possui um modelo econômico falho, com dependência excessiva da exportação de recursos e hiperinflação acentuada, além de falta de diversificação econômica e problemas de pobreza e baixas taxas de crescimento. Reformas significativas são necessárias para manter nossa economia à tona."
 BOL_ethnic_divides: "Divisão étnica boliviana"
 BOL_ethnic_divides_desc:0 "A Bolívia apresenta profundas divisões étnicas e raciais entre os mestiços, que se concentram principalmente no leste do país, e os grupos indígenas, que constituem a maioria da população no oeste. Isso tem levado a uma crescente polarização étnica, especialmente com os recentes protestos indígenas sobre diversos temas, como o acesso à água."
 BOL_cochabamba_crisis: "Crise de Cochabamba"
 BOL_cochabamba_crisis_desc:0 "Em dezembro de 1999, começaram protestos em massa na cidade de Cochabamba em resposta à privatização da empresa municipal de abastecimento de água da cidade, a SEMAPA. Desde então, os protestos se ampliaram para abranger questões como o acesso à água e os direitos indígenas. É claro que a crise está saindo de controle, portanto precisamos tomar medidas imediatas para acalmar os ânimos"
