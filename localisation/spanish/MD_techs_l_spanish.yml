 nsb_multiple_atgm_tech_1: "Montaje ATGM Cuádruple de 1ª Generación"
 nsb_multiple_atgm_tech_1_desc: "Un lanzador cuádruple de misiles antitanque guiados (ATGM) es un sistema equipado con cuatro misiles listos para disparar, lo que mejora la capacidad de una plataforma para atacar múltiples objetivos blindados en rápida sucesión. Estas configuraciones se integran frecuentemente en diversos vehículos militares, como vehículos blindados de transporte de personal y vehículos de combate de infantería, para aumentar su eficacia antitanque."
