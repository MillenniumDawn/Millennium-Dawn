 CZE_cnc_equipment_2_desc: "C2 (Command and Control) — это первое поколение оборудования C2. Оборудование C2 — это система, позволяющая руководству осуществлять полномочия и руководить подчинёнными силами для выполнения миссий и задач. Эффективное командование и управление приводят к большей организованности и повышению морального духа."
 CZE_cnc_equipment_3: "RF-13"
 CZE_cnc_equipment_3_desc: "C3 (Command, Control & Communication) — это оборудование C2 второго поколения. Оборудование управления и контроля — это система, позволяющая руководству осуществлять полномочия и руководить подчинёнными силами для выполнения миссий и задач. Эффективное управление и контроль приводят к большей организованности и повышению морального духа."
 CZE_cnc_equipment_4: "RF-1305"
 CZE_cnc_equipment_4_desc: "C3ISTAR (Командование, контроль и связь, разведка, наблюдение, обнаружение целей и рекогносцировка) — это оборудование третьего поколения C2. Командно-контрольное оборудование — это система, позволяющая руководству осуществлять власть и направлять назначенные силы для выполнения миссий и задач. Эффективное командование и контроль ведут к повышению организованности и морального духа."
 CZE_cnc_equipment_5: "RF-1325"
 CZE_cnc_equipment_5_desc: "RF-1325 (Command, Control, Communications, Computers, Intelligence и Interoperability) — это оборудование C2 четвёртого поколения. Командно-контрольное оборудование — это система, позволяющая руководству осуществлять власть и направлять назначенные силы для выполнения миссий и задач. Эффективное командование и контроль ведут к повышению организованности и морального духа."
 CZE_cnc_equipment_6: "RF-1350"
 CZE_cnc_equipment_6_desc: "RF-1350 (командование, контроль, связь, компьютеры, совместная работа и разведка) — это оборудование C2 пятого поколения. Командно-контрольное оборудование — это система, позволяющая руководству осуществлять власть и направлять назначенные силы для выполнения миссий и задач. Эффективное командование и контроль ведут к повышению организованности и морального духа."
 CZE_cnc_equipment_7: "RF-13250"
 CZE_cnc_equipment_7_desc: "RF-13250 (командование, контроль, связь, компьютеры, совместная работа, разведка, интероперабельность, наблюдение, обнаружение целей и рекогносцировка) — седьмое поколение оборудования C2. Командно-контрольное оборудование — это система, позволяющая руководству осуществлять власть и направлять назначенные силы для выполнения миссий и задач. Эффективное командование и контроль ведут к повышению организованности и морального духа."
