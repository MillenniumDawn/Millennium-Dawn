 ALG_enmib_helicopter_unit: "ENMIB - 기초장비기반시설공사(Entreprise Nationale des Matériels et Infrastructures de Base)"
 ALG_mers_el_kebir_shipyards: "메르스 엘케비르 해군 조선소"
