 recognition_category_desc: "승인받지 못한 여러 국가가 국제 사회에 가입하기를 원하고 있습니다. 이들의 운동을 지지할지 결정해야 합니다. UN 회원국으로부터 충분한 지지를 얻으면 국제연합에 가입하여 미승인 상태와 그에 따른 불이익에서 벗어날 수 있습니다. 이미 우리가 승인한 국가에 대해서는 다른 UN 회원국들이 이들을 승인하도록 독려함으로써 운동을 더욱 지원할 수 있습니다."
