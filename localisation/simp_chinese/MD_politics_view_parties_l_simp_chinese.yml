 CRO.conservatism: "£CRO_western_conservative （HDZ）克罗地亚民主联盟"
 CRO.conservatism_icon: "£CRO_western_conservative"
 CRO.conservatism_desc: "（基督教民主主义） - 最初作为克罗地亚社会主义共和国境内的民族主义及反共产主义政党成立，克罗地亚民主共同体成功赢得了该国首次多党选举。在其早期执政期间，克罗地亚实现了国家独立，该党推行了清除共产主义统治残余与社会主义经济体系的激进政策。"
 CRO.liberalism: "£CRO_western_liberal （HSLS）克罗地亚社会自由党"
 CRO.liberalism_icon: "£CRO_western_liberal"
 CRO.liberalism_desc: "(保守自由主义) - 作为新独立的克罗地亚首批拥护自由理念的政党之一，克罗地亚社会自由党曾短暂垄断了主要反对党地位，与执政的克罗地亚民主共同体分庭抗礼。然而该党迅速向中间立场靠拢，最终放弃了最初的社会自由主义立场，转向更为温和的政治愿景。"
 CRO.socialism: "£CRO_western_social_democrat （SDP）克罗地亚社会民主党"
 CRO.socialism_icon: "£CRO_western_social_democrat"
 CRO.socialism_desc: "（第三道路） - 克罗地亚社会民主党由前执政党克罗地亚共产主义者联盟中的自由派成员组建，宣称其不仅承袭了前共产党，还继承了早已消亡的克罗地亚-斯拉沃尼亚社会民主党。该党最终兼并了一个社会民主党竞争对手，进一步与其共产主义历史划清界限。"
 CRO.Conservative: "£CRO_emerging_reactionary (ZZ) 人盾"
 CRO.Conservative_icon: "£CRO_emerging_reactionary"
 CRO.Conservative_desc: "（调和民粹主义） - 拒绝贴上左翼或右翼的标签，“人盾党”采用了一套近乎纯粹的民粹主义纲领，将若干阴谋论融入其信仰与意识形态。其实际立场混合了广泛的民粹主义及略微偏左的经济社会政策，同时否认疫苗有效性、相信化学凝结尾等阴谋论。"
 CRO.anarchist_communism: "£CRO_emerging_left_wing_radical (PH) 让我们改变克罗地亚"
 CRO.anarchist_communism_icon: "£CRO_emerging_left_wing_radical"
 CRO.anarchist_communism_desc: ""
 CRO.Neutral_conservatism: "£CRO_non_aligned_conservative (HDKU) 克罗地亚基督教民主联盟"
 CRO.Neutral_conservatism_icon: "£CRO_non_aligned_conservative"
 CRO.Neutral_conservatism_desc: "（民族保守主义）HDKU成立于1992年，直接受到西欧基督教民主政党的启发，其最终采纳了比其更温和的对手HDZ更为激进的右翼意识形态。这一事实导致其在首次参与的选举中表现不佳，仅在克罗地亚独立战争期间参与了民族团结政府。"
 CRO.Neutral_Communism: "£CRO_non_aligned_communism (CA/CI) 红色行动/红色倡议"
 CRO.Neutral_Communism_icon: "£CRO_non_aligned_communism"
 CRO.Neutral_Communism_desc: "（马克思列宁主义） - CA/CI活跃于塞尔维亚（红色倡议）和克罗地亚（红色行动），在两国以不同名称开展活动，其自诩为主要反对北约和欧盟的反帝国主义政党。在社会议题上，该党也支持进步社会运动，对LGBTQ群体表达积极支持。"
 CRO.Neutral_green: "£CRO_non_aligned_greens (HSS)克罗地亚农民党"
 CRO.Neutral_green_icon: "£CRO_non_aligned_greens"
 CRO.Neutral_green_desc: "（农业主义） - 1991年重建的克罗地亚农民党视自身为1904年创立、1929年和1941年两度遭禁的原始克罗地亚农民党的直接延续。该党秉持融合自由主义与绿色政治元素的温和农业主义理念，曾多次与左翼政党联合执政。"
 CRO.Nat_Autocracy: "£CRO_nationalist_military_junta 克罗地亚武装力量"
 CRO.Nat_Autocracy_icon: "£CRO_nationalist_military_junta"
 CRO.Nat_Autocracy_desc: "（民族主义军政府） - 克罗地亚武装部队成立于1991年，主要在南斯拉夫内战期间组建，并在克罗地亚独立战争中与多支反抗塞尔维亚的准军事组织并肩作战。尽管该军队历史上未曾干预政治，但其独特的建军背景与克罗地亚国内政局深刻塑造了这支军队的特质。"
 CRO.Nat_Fascism: "£CRO_nationalist_fascism (HCSP) 克罗地亚纯粹权利党"
 CRO.Nat_Fascism_icon: "£CRO_nationalist_fascism"
 CRO.Nat_Fascism_desc: "（极端民族主义） - 克罗地亚纯粹权利党自称是1904年成立的同名政党的直接继承者，该党寻求克罗地亚的“自决权”，反对北约和欧盟。此外，该党还尊崇前亲德的乌斯塔沙政权，其高级成员曾出席纪念该政权多位前官员的活动。"
 CRO.Nat_Populism: "£CRO_nationalist_right_wing_populist （HSP）克罗地亚权利党"
 CRO.Nat_Populism_icon: "£CRO_nationalist_right_wing_populist"
 CRO.Nat_Populism_desc: "（新法西斯主义）克罗维亚权利党得名于1929年解散的原始政党，于1990年作为新法西斯主义政党成立。该党初期发展迅速，但经历数次分裂、恐怖主义及其他犯罪指控，加之领导层流失，最终走向衰落。与许多采用相似名称的政党类似，该党崇拜亲德的乌斯塔沙组织，并反对南斯拉夫内战期间克罗地亚政府与塞尔维亚的合作行为。"
 CSA.conservatism: "£generic_conservatism_small 南方保守党"
 CSA.conservatism_desc: "£generic_conservatism_small 南方保守党是一个具有悠久历史的政党，几十年来，随着政治信仰和人口结构的改变，该党也发生了变化。这导致民主党的现代残余更像是一个中右翼政党，而不是一个坚定的右翼政党。这种温和派能够吸引更多对政治漠不关心或漠不关心的民众，成为分裂不断的南方共和国的一种‘温和派集团’。"
 CSA.Conservative: "£generic_Conservative_small 南方传统党"
 CSA.Conservative_desc: "£generic_Conservative_small 南方传统党被视为众多希望重返邦联时代的邦联派政党之一。但他们强调，重返邦联只能是在政府组织方面。党的领导层表示，旧邦联的衰落是由于其过度的集权，邦联本身做对了，而邦联条例和联邦政府做错了。"
 CSA.anarchist_communism: "£generic_anarchist_communism_small 革命党联盟"
 CSA.anarchist_communism_desc: "£generic_anarchist_communism_small 革命联盟党是一个革命社会主义党，旨在实现建立公正社会所需的社会主义革命。许多人认为他们是托洛茨基派政党，但当被问及党员时，他们会引用‘马克思是唯一真正的社会主义者，我们只追随马克思’。有些人对这个激进且可能具有恐怖主义倾向的组织持谨慎态度，但右翼同行希望他们存在，以此贬低任何被视为“正常”的左翼平台。"
 CSA.Caliphate: "£generic_Caliphate_small 南方穆斯林州"
 CSA.Caliphate_desc: ""
 CSA.oligarchism: "£generic_oligarchism_small 经济繁荣党"
 CSA.oligarchism_desc: "£generic_oligarchism_small 经济繁荣党在原则上有点误导性。该党自称是南方共和国的一个独立政党，但许多深入研究的人会发现，该党是一个由大型农业和企业领导人组成的政党。然而，该党确实有一个政纲，即根据国家对某些关键战略资源的需求，放松管制、提供创业补助、提供补贴，以及在自给自足和自由贸易政策之间取得平衡。"
 CSA.Nat_Populism: "£generic_Nat_Populism_small 迪克西第一党"
 CSA.Nat_Populism_desc: "£generic_Nat_Populism_small 迪克西第一党是一个支持邦联并强烈反对移民的政党。随着时代、技术和标准的变化，他们希望将南部邦联重塑为一个新的现代愿景。极端保守派运动和另类右翼运动谴责他们是‘浅灰色的失败者’，指出他们对南方人的意义漠不关心。虽然联盟肯定比南方身份党更右，但他们谴责并拒绝与他们合作。"
 CSA.Nat_Fascism: "£generic_Nat_Fascism_small 南方联盟"
 CSA.Nat_Fascism_desc: "£generic_Nat_Fascism_small 南方联盟是一个极端民族主义团体，旨在‘保护’南方的文化和身份。许多中间派和左派人士认为他们不过是像三K党或白人联盟一样的仇恨团体。他们明显的政策立场是强烈反对移民，高度社会保守，强调他们必须保护所谓的‘基督教身份’。无论如何，联盟发现与伊斯兰国家以及强硬的社会主义政党发生冲突的时间比玩弄政治的时间要多。"
 CSA.Nat_Autocracy: "£generic_Nat_Autocracy_small 南方军队"
 CSA.Nat_Autocracy_desc: "£generic_Nat_Autocracy_small 南方军队是一支极度保守的部队，致力于保护迪克西的土地。他们在军事传统方面支持南部邦联，在外交政策方面，他们的主要目标是收复整个迪克西之地。然而，有点文化冲击的是，南方军队在允许同性恋和少数族裔参军并获得士官和军官军衔方面出人意料地进步。外国人总是对南方军队的真正目标心存警惕，但目前他们表现得还不错，只有时间才能告诉我们南方军队是会继续前进还是会重蹈覆辙。"
 CUB.conservatism: "£CUB_western_conservative 古巴基督教民主党"
 CUB.conservatism_desc: "古巴民主基督教党成立于1959年，以基督教民主原则为基础，强调社会正义、人的尊严和可持续发展。该党支持民主改革，包括多党制，反对卡斯特罗独裁政权。 它支持市场经济，包括社会保护、言论自由、平等和保护所有公民的权利。该党以基督教价值观为基础寻求和平与正义，呼吁民族和解与团结."
 CUB.liberalism: "£CUB_western_liberal 古巴自由联盟(ULC)"
 CUB.liberalism_desc: "活跃于20世纪初的古巴自由联盟是该国政治生活中的重要政党之一。该党提倡自由主义，坚持改革、扩大公民自由和尊重宪法。自由联盟支持私人倡议、投资和经济现代化的发展。国内政策的重点是确保公民的权利和自由，以及加强法治和民主机构。自由主义者反对腐败，支持可持续发展，力求使古巴成为一个进步的国家。"
 CUB.socialism: "£CUB_western_social_democrat 古巴民主社会革命党(PSRDC)"
 CUB.socialism_desc: "古巴社会革命党成立于20世纪初，将社会主义和民族独立的理想统一起来。该党主张社会正义、土地改革、工人权利和文化发展。该党通过民主进程争取社会革命，支持民族从外部统治中解放出来，并深化国家主权。该党强调教育和健康作为进步基础的重要性，旨在为所有古巴人创建一个机会平等和社会福祉的社会。"
 CUB.Nat_Autocracy: "£CUB_nationalist_military_junta 革命武装力量(FAR)"
 CUB.Nat_Autocracy_desc: "古巴革命武装力量是古巴的军事力量。它们包括革命陆军、革命海军、革命空军和防空部队，以及其他准军事机构，包括领土部队民兵、青年劳工军、国防和生产旅，以及民防组织和国家储备机构。"
 CYP.conservatism: "£CYP_western_conservative 民主大会党(DISY)"
 CYP.conservatism_desc: ""
 CYP.liberalism: "£CYP_western_liberal 联合民主党(EDI)"
 CYP.liberalism_desc: ""
 CYP.socialism: "£CYP_western_social_democrat 社会民主运动(EDEK)"
 CYP.socialism_desc: ""
 CYP.Western_Autocracy: "£CYP_western_autocrat 民主党(DIKO)"
 CYP.Western_Autocracy_desc: ""
 CYP.Neutral_conservatism: "£CYP_non_aligned_conservative 团结运动(KA)"
 CYP.Neutral_conservatism_desc: ""
 CYP.neutral_Social: "£CYP_neutral_Social 公民联盟(SYPOL)"
 CYP.neutral_Social_desc: ""
 CYP.Neutral_Communism: "£CYP_Neutral_Communism 复兴民主社会主义运动(ADISOK)"
 CYP.Neutral_Communism_desc: ""
 CYP.Neutral_green: "£CYP_Neutral_green 生态学家运动 -- 公民合作(KOSP)"
 CYP.Neutral_green_desc: ""
 CYP.Nat_Autocracy: "£CYP_Nat_Autocracy 塞浦路斯国民警卫队"
 CYP.Nat_Autocracy_desc: ""
 CYP.Nat_Fascism: "£CYP_nationalist_fascism 民族人民阵线(ELAM)"
 CYP.Nat_Fascism_desc: ""
 CZE.conservatism: "£CZE_western_conservative 公民民主党(ODS)"
 CZE.conservatism_desc: "公民民主党是捷克共和国保守且持欧洲怀疑论的政党。该党在政治光谱上处于中右翼至右翼。公民民主党由瓦茨拉夫·克劳斯于1991年创立，是公民论坛的亲自由市场派别，模仿英国保守党，赢得了1992年立法选举，并在捷克共和国独立后的大部分时间里一直执政。"
 CZE.liberalism: "£CZE_western_liberal 自由联盟-民主联盟(US-DEU)"
 CZE.liberalism_desc: "自由联盟-民主联盟是存在于捷克共和国1998年至2011年期间的一个小型亲欧洲自由主义政党。自由联盟成立于1998年1月，由对瓦茨拉夫·克劳斯领导不满的公民民主党前成员创立。自由联盟最初在看守政府任职，后于1998年大选后成为反对党。在反对党中，自由联盟与民主联盟合并，并与基督教民主联盟-捷克斯洛伐克人民党结成联盟。"
 CZE.socialism: "£CZE_western_social_democrat 捷克社会民主党(CSSD)"
 CZE.socialism_desc: "社会民主党是一个社会民主主义政党，位于政治光谱的中左翼，持有亲欧洲观点。该党起源于奥地利捷克斯拉夫社会民主党，该党是1878年4月7日在奥匈帝国成立的政治团体，是奥地利社会民主党的一个地区分支。"
 CZE.Conservative: "£CZE_emerging_reactionary 国民党(NS)"
 CZE.Conservative_desc: "国民党是一个极右翼民族主义政党。他们强烈反对捷克加入欧盟。他们的主要目标是通过最大限度地减少外国机构的影响来恢复完整的国家主权，并加强国家移民政策。"
 CZE.Autocracy: "£CZE_Autocracy 国家统一党"
 CZE.Autocracy_desc: "国家统一党是捷克的一个小型民族主义政党，于2002年6月3日在扎库皮举行了成立大会。党的领导人是马丁·切伊卡。该党的别名是“民族团结党”，1934年在捷克斯洛伐克成立的政党也使用过这个名字。"
 CZE.Neutral_conservatism: "£CZE_non_aligned_conservative 基督教民主联盟-捷克斯洛伐克人民党(KDU-CSL)"
 CZE.Neutral_conservatism_desc: "基督教民主联盟 - 捷克斯洛伐克人民党，通常简称为人民党，是捷克共和国的一个基督教民主政党。自1990年以来，该党几乎参与了每届捷克政府。德国占领捷克斯洛伐克后，什拉梅克担任流亡英国的捷克斯洛伐克政府首脑。1945年后，捷克斯洛伐克人民党成为民族团结政府的一部分，成为其最右翼的部分。它是捷克共和国最具基督教色彩的政党，代表基督教民主和社会保守主义。"
 CZE.neutral_Social: "£CZE_neutral_Social 捷克国家社会党(CSNS)"
 CZE.neutral_Social_desc: "捷克国家社会党是捷克共和国的一个公民民族主义政党，曾在两次世界大战期间在捷克斯洛伐克发挥了重要作用。该党成立于1897年，由民族自由主义青年捷克党和捷克社会民主党的分离团体组成，致力于实现捷克从奥匈帝国的独立。该党的社会主义形式是温和的改良主义，而不是马克思主义。1930年，国家工党解散并与国家社会主义者合并后，该党也成为捷克自由主义者的避难所。该党最著名的成员是爱德华·贝奈斯，他是捷克斯洛伐克的共同创始人，也是1930年代和1940年代该国的第二任总统。尽管名称相似，但捷克“国家社会主义者”并不隶属于纳粹主义或德国纳粹党。"
 CZE.Neutral_Libertarian: "£CZE_non_aligned_libertarian 自由改革党(LiRA)"
 CZE.Neutral_Libertarian_desc: "自由改革党是一个小型自由市场古典自由主义政党。"
 CZE.Neutral_Communism: "£CZE_Neutral_Communism 民主社会主义党(SDS)"
 CZE.Neutral_Communism_desc: "民主社会主义党是捷克共和国的一个民主社会主义政党。它是欧洲左翼党的创始成员党。该党自1997年12月起更名为该党。它是民主左翼党和左翼集团于1997年6月合并而成的政治党派。该党最初名为左派-民主左翼党。"
 CZE.Neutral_Muslim_Brotherhood: "£CZE_Neutral_Muslim_Brotherhood 穆斯林社区总部(UMO)"
 CZE.Neutral_Muslim_Brotherhood_desc: "穆斯林社区总部是捷克共和国穆斯林的联合组织。现代捷克历史上穆斯林社区的最早痕迹可以追溯到奥匈帝国统治后期，即1908年，当时奥匈帝国在占领了波斯尼亚和黑塞哥维那三十年后正式吞并了该地，并宣布哈乃斐派的逊尼派伊斯兰教为下一个国教，并承担所有法律后果。当时社区的核心是波斯尼亚穆斯林，第一次世界大战期间，第一批捷克族穆斯林也加入了他们，他们大多在参加穆斯林国家的战斗期间接受了伊斯兰教。捷克伊斯兰运动就是这样形成的，新成立的苏联移民也“丰富”了该运动。"
 CZE.Neutral_green: "£CZE_Neutral_green 绿党(SZ)"
 CZE.Neutral_green_desc: "绿党是捷克共和国的一个绿色政党。"
 CZE.Nat_Autocracy: "£CZE_Nat_Autocracy 捷克共和国武装力量"
 CZE.Nat_Autocracy_desc: "绿党成立于1990年，当时捷克斯洛伐克在天鹅绒革命后恢复了自由民主。该党以和平主义（反对任何外国军事力量在捷克共和国设立军事基地的想法）和在该国进一步融入基层民主为竞选纲领。"
 CZE.Nat_Populism: "£CZE_Nat_Populism 共和国集会-捷克斯洛伐克共和党(SPR-RSC)"
 CZE.Nat_Populism_desc: "共和国集会-捷克斯洛伐克共和党是一个小党派，强烈反对欧盟、北约和移民。该党及其领导人米罗斯拉夫·斯拉德克因其对罗姆人（反犹太主义）和德国人的激进态度而闻名。该党成立于1989年12月30日，是后共产主义捷克斯洛伐克的首批政党之一。它在1996年捷克立法选举中以8%的选票达到顶峰，但此后逐渐衰落，并于2001年因财务违规而解散 - 具体而言是主席盗窃党费，他用这笔钱来维系自己的奢侈生活方式。"
 DEN.conservatism: "£DEN_western_conservative 保守人民党"
 DEN.conservatism_desc: "保守人民党是丹麦主要的中右翼政党。该党成立于1916年，主张个人自由和责任、自由市场经济、维持福利国家、与欧盟合作以及确保丹麦的国家历史和传统得到维护。该党还根据绿色保守主义支持并强调环保主义作为核心理念。"
 DEN.liberalism: "£DEN_western_liberal 左翼党"
 DEN.liberalism_desc: "左翼丹麦自由党是丹麦的保守自由农业政党。它成立于1910年，是反对土地贵族的农民运动的一部分，拥护经济自由、支持自由市场的意识形态。它是丹麦中右翼的主要政党，也是该国第二大政党。现代政党遵循经典的自由主义学说，对移民采取坚定立场。该党称‘移民应该学习丹麦语，理解并尊重丹麦文化和传统。’"
 DEN.socialism: "£DEN_western_social_democrat 社会民主党"
 DEN.socialism_desc: "社会民主党是丹麦最大的政党，也是该国领先的社会民主党。它成立于1871年，自20世纪初以来一直在议会中拥有最大的代表权。该党为创建丹麦福利国家铺平了道路，并不断寻求扩展这一概念。它采取了一系列左倾的经济政策，党内越来越多的群体对大规模移民和经济全球化越来越持怀疑态度，他们被引述说‘大规模移民和劳动力自由流动是由下层阶级买单的。’"
 DEN.anarchist_communism: "£DEN_anarchist_communism 团结名单-红绿联盟"
 DEN.anarchist_communism_desc: "红绿联盟是丹麦的生态社会主义政党，成立于1989年，由三个马克思主义政党合并而成，是丹麦议会中最左翼的政党。该党以社会主义和民主草根政党为竞选活动，声称也代表绿色政治、和平运动、反歧视和工会运动。"
 DEN.Neutral_conservatism: "£DEN_non_aligned_conservative 中间民主党"
 DEN.Neutral_conservatism_desc: "中间民主党是一个意识形态混合了中间主义、社会民主主义和自由保守主义的政党。该党于1973年由前议员兼格拉德萨克斯市市长埃哈德·雅各布森创立，是丹麦社会民主党的一个中间派派系。"
 DEN.Neutral_conservatism_2017: "£DEN_non_aligned_conservative_alt 基督教民主党"
 DEN.Neutral_conservatism_2017_desc: "基督教民主党是一个基督教政党。"
 DEN.Neutral_Libertarian: "£DEN_non_aligned_libertarian 激进左翼党"
 DEN.Neutral_Libertarian_desc: "丹麦社会自由党成立于1905年，是从左翼改革党分裂出来的。党的意识形态中心和社会自由主义运动。"
 DEN.Neutral_green: "£DEN_Neutral_green 替代"
 DEN.Neutral_green_desc: "另类选择党是丹麦的绿色政党。该党于2013年公开发起，其思想基础是绿色政策、认真减缓气候变化和创业精神。它的成立并没有完整的政治议程，但希望看到它通过所谓的‘政治实验室’的众包政策来成长和发展。"
 DEN.neutral_Social: "£DEN_neutral_Social 社会主义人民党"
 DEN.neutral_Social_desc: "社会主义人民党（绿左）是丹麦的一个民主社会主义政党。该党成立于1959年，是由于创始人对苏联干预1956年匈牙利革命的批评而从丹麦共产党中分裂出来的。它寻求将美国导向的社会民主党与苏联结合起来。以民主和社会主义相结合为导向的共产主义。它在受绿色政治和民主社会主义启发的社会主义意识形态基础上开展活动。它将民主社会主义的丹麦视为其政治的最终目标。它是女权主义、人权、少数群体权利和民主的坚定支持者。"
 DEN.Nat_Autocracy: "£DEN_Nat_Autocracy 军队"
 DEN.Nat_Autocracy_desc: "丹麦皇家陆军是丹麦武装部队的陆基部队，与丹麦国民卫队一起。这两个军种构成了丹麦武装部队的主要防御和进攻力量。它成立于1614年，在其历史上曾参与过许多军事冲突。"
 DEN.Nat_Fascism: "£DEN_Nat_Fascism 进步党"
 DEN.Nat_Fascism_desc: "进步党由莫根斯·格利斯鲁普于1972年创立，其政治立场包括废除所得税、大幅减少官僚主义和‘法律丛林’、恢复边界和边境管制产品、立即停止移民、停止分配丹麦公民身份，与一体化政策对抗，逐步降低丹麦在欧盟的地位。20世纪70年代，格利斯鲁普在丹麦电视台直播中宣称自己没有缴纳任何所得税，此后，丹麦自由党得到了广泛发展。"
 DEN.Nat_Fascism_2017: "£DEN_Nat_Fascism_alt 强硬路线"
 DEN.Nat_Fascism_2017_desc: "强硬路线是丹麦和瑞典的一个民族主义反伊斯兰政党，由拉斯穆斯·帕鲁丹创立。大多数政治学家和新闻媒体认为该党是激进的极右边缘政党。它倡导民族主义功利主义，重点是保护和增强丹麦人民的‘种族、文化、宗教、语言和规范同质性’。它还倡导右翼自由意志主义，一旦国家的种族同质性得到恢复，个人自由和权利就会急剧增加。"
 DEN.Nat_Populism: "£DEN_Nat_Populism 丹麦人民党"
 DEN.Nat_Populism_desc: "丹麦人民党是丹麦主要的民族主义和右翼民粹主义政党。它由前进步党成员于1995年创立。它以反移民为平台开展活动，保护丹麦人民的自由和文化遗产，促进创业和经济增长。他们还寻求保护丹麦的主权免受欧盟的侵害。该党的经济政策更接近中间和中左翼，使其在丹麦社会中具有独特的地位。坚定的反移民立场使其在丹麦政治光谱中坚定地处于民族主义和右翼民粹主义的地位。"
 DEN.Monarchist: "£DEN_nationalist_monarchist 格吕克斯堡王室"
 DEN.Monarchist_desc: "格吕克斯堡王室是德国奥尔登堡家族的附属分支，目前由丹麦女王玛格丽特二世领导。自1863年以来，该家族一直拥有丹麦王国的王朝血统，从未间断过。"
