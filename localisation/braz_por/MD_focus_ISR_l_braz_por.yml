 israel.87.t: "Negociando o Destino de Jericó"
 israel.87.d: "Desde o início das operações antiterrorismo, [FROM.GetNameWithFlag] pede negociações sobre o futuro dos Cassinos de Jericó. Precisamos decidir o que fazer com eles."
 israel.87.a: "Anular os Protocolos de Oslo."
 israel.87.b: "Mantê-lo como foi acordado."
 ISR_border_raid_hebron: "Incursão da Guarda de Fronteira em Hebron"
 israel.88.t: "O Destino da Caverna dos Patriarcas"
 israel.88.d: "Nossas forças chegaram à Caverna dos Patriarcas. Precisamos decidir como lidar com o local."
 israel.88.a: "Evacuar a Sinagoga!"
 israel.88.b: "Militarizar a Estrada das Orações."
 israel.88.c: "Manter o status quo?"
 israel.89.t: "O Forte Tegart de Tulkarm"
 israel.89.d: "Agora precisamos decidir como lidar com o Forte Tegart de Tulkarm. Qual é o nosso plano?"
 israel.89.a: "Destruir o Forte!"
 israel.89.b: "Convertê-lo em uma Casbá."
 israel.90.t: "Lidar com o Tanzim"
 israel.90.d: "O Tanzim já foi a ala juvenil do Fatah, mas desde então derivou para uma semi-independência. Com nossas forças na Cisjordânia, precisamos decidir como lidar com eles."
 israel.90.a: "Permitir sua integração."
 israel.90.b: "Dissolver o Tanzim."
 israel.91.t: "Operação bem-sucedida!"
 israel.91.d: "A Operação Antiterrorismo foi bem-sucedida e as células terroristas foram desmanteladas. Estamos seguros novamente e podemos agora olhar para o futuro com esperança."
 israel.91.a: "Ótimo!"
 israel.92.t: "Operação fracassada!"
 israel.92.d: "A Operação Homat Mahgehn fracassou. As células terroristas que buscávamos desmantelar estão agora mais fortes do que nunca, encorajadas por nosso fracasso. Precisamos nos preparar para as consequências."
 israel.92.a: "Um golpe duro."
 israel.92.b: "Isso não pode ficar assim."
 israel.92.c: "Um resultado difícil."
