 module_tank_nuclear_engine_gen1: "원자력 엔진 I"
 module_tank_nuclear_engine_gen1_desc: "원자력 엔진은 차량 내부에서 동력을 생산하여 기존 연료 소비를 없애 주므로, 장갑차량이 연료 보급에 의존하지 않고 장기간 작전할 수 있습니다.\n\n§G설계 힌트: 원자력 엔진은 연료 소비를 없애지만 생산 비용이 더 비쌉니다.§!"
