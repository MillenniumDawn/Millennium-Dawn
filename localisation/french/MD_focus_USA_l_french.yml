 raid_type_raid_baath: "Chasse aux cibles baasistes"
 USA_foreign_policy: "Département d'État"
 USA_foreign_policy_desc: "The [USA.GetFlag] United States Department Of State was founded in 1789 as an administrative arm of the Executive Branch. Being considered one of the strongest agencies within the government, the Department Of State is headed by the Secretary Of State. Reporting back directly to only the President of the [USA.GetFlag] United States, the Department Of State is in charge of foreign affairs.\n\nWith every election, a series of new decisions will be unlocked for that candidate. Previous decisions will disappear with new elections, and certain changes in the world may prompt new decisions to appear."
 USA_doing_decision: "Prend une autre décision"
 USA_KUW_baathists: "Traque des baasistes irakiens au Koweït [KUW.GetFlag]"
 department_of_state.94.t: "Les talibans reprennent leur offensive"
 department_of_state.94.d: "The Taliban have announced today that they will be renewing their offensive against the government of [AFG.GetLeader]. This move comes as no surprise following a hasty U.S. withdrawal due to domestic pressure mounting on the current administration. What remains is a fractured, battered, and weakened Afghanistan left alone to defend itself against a much more ferocious foe. Several states have vowed to help defend Afghanistan once more if needed, but their word is as good as their willingness to commit to such a promise. It is still to be seen if the Afghan state is able to hold the Taliban back on its own, but it is likely that the army will not be able to put up much resistance."
 department_of_state.94.a: "L'État afghan va-t-il s'effondrer à nouveau ?"
 department_of_state.200.t: "Rapport sur les pertes en Afghanistan"
 department_of_state.200.d: "Nous avons perdu des hommes et des femmes courageux dans les combats en Afghanistan, et leurs cercueils reviennent aux États-Unis pour un enterrement approprié."
 department_of_state.200.a: "Semper Fi"
 department_of_state.31.c: "À quoi bon faire quoi que ce soit de toute façon"
 department_of_state.95.t: "Vente des destroyers de classe Kidd"
 department_of_state.95.d: "Récemment, les [USA.GetName] nous ont proposé de nous vendre les destroyers de classe Kidd qui ont été désactivés il y a quelques années. Il s'agit d'une série de puissants destroyers lance-missiles initialement commandés par la marine impériale iranienne, mais annulés en raison de la révolution iranienne de 1979. Ils ont depuis été modernisés et réactivés à partir du stock de la marine américaine désactivée, dans le but de vendre les navires. Devons-nous acheter ces navires pour renforcer notre position en cas d'invasion de notre nation par le continent ?"
 department_of_state.95.a: "Signer le chèque."
 department_of_state.95.b: "Nous passerons"
 USA_sale_of_the_kidd_destroyer: "[TAI.GetFlag] Vente du destroyer de classe Kidd à [TAI.GetName]"
 USA_sale_of_the_kidd_destroyer_desc: "Nous avons eu du mal à vendre les destroyers de classe Kidd, mais [TAI.GetNameWithFlag] a montré de l'intérêt à les acheter pour renforcer ses stratégies défensives contre [CHI.GetNameWithFlag]."
 department_of_state.96.t: "Opération Absolute Resolve : réussite"
 department_of_state.96.d: "As the president watched from the situation room, special forces units stormed the compound of Venezuela's dictator, Nicolas Maduro. Swiftly catching him as he made an attempt to escape into a safe room, U.S. troops transported him onboard a plane and sent him on a flight to U.S. soil. It is expected that he will be tried in U.S. courts and given a sentence based on drug charges. It is said that the entire raid lasted just a matter of hours."
 department_of_state.96.a: "Voilà comment on fait une opération de 3 heures"
 department_of_state.97.t: "Les États-Unis lancent un raid"
 department_of_state.97.d: "Les États-Unis ont commis un acte de guerre flagrant : ils ont soumis notre nation à une campagne de bombardements et ont enlevé notre président. Un tel acte ne saurait rester impuni, et nos forces armées sont de plus en plus prêtes à résister à toute tentative d’occupation. Cependant, les États-Unis ont proposé de suspendre toute nouvelle action si nous coopérons, mais accepter reviendrait à leur permettre de contrôler temporairement le pays."
 department_of_state.97.a: "Nous ne resterons pas sur le dos !"
 department_of_state.97.b: "Nous n'avons pas le choix, nos mains sont liées"
 department_of_state.98.t: "Les États-Unis capturent le leader vénézuélien"
 department_of_state.98.d: "The United States has carried out an overnight raid on Venezuela, an oil rich country in South America. This move comes after weeks of accusations by the U.S. president, claiming that the Venezuelan leader has been a destabilizing factor in the region by facilitating the spread of narcotics. The raid code-named 'Operation Absolute Resolve' was successful, and it resulted in the capture of Nicolas Maduro, the long standing dictator of Venezuela. Though the United States hasn't really outlined how they intend to facilitate the transition of power, they've made it very clear that they are the ones in charge now and are calling on what remains of the Venezuelan government to collaborate until a replacement is found."
 department_of_state.98.a: "Un développement préoccupant"
 raid_type_USA_raid_venezuela: "Opération Résolution Absolue"
 raid_type_USA_raid_venezuela_desc: "L'objectif de cette opération est de capturer le dirigeant vénézuélien et de le ramener sain et sauf aux États-Unis pour qu'il y soit jugé. Les services de renseignement ont averti qu'en cas de dérapage, un vide du pouvoir pourrait engendrer une insurrection."
 USA_invasion_in_iraq_mission: "Invasion de l'Irak"
 USA_invasion_in_iraq_mission_desc: "Plus nous tardons, moins notre volonté d'envahir l'Irak se justifie. Si nous voulons mener à bien cette invasion, nous devons intervenir dans l'année à venir, faute de quoi notre justification de guerre ne sera plus valable."
 USA_failed_to_invade_iraq_idea: "L'humiliation nationale"
 USA_failed_to_invade_iraq_idea_desc: "Notre échec à lancer des opérations militaires contre l'Irak, quelles qu'en soient les raisons, laisse les attentats terroristes sans réponse. Cette inaction endommagera gravement notre crédibilité et enhardira nos adversaires pour des années."
 USA_early_2000s_energy_crisis: "La crise énergétique"
 USA_early_2000s_energy_crisis_desc: "Disruptions in the global oil market and the instability in the Middle East has caused an uptick in consumption as people are looking for the best possible price and gas which has inversely led to an increase in consumption of oil and oil-based products causing additional shortages and issues."
 usa_economic_events.36.t: "La Grande Récession résonne"
 usa_economic_events.36.d: "The American media and economy is reporting more and more startling numbers by the minute. The collapse continues to shake the very core and foundations of the world economy causing rippling effects everywhere from Argentina to Greece to New Zealand. No one around the globe has been left unaffected by this Lesser Depression. Time will tell truly how far this will harm..."
 usa_economic_events.36.a: "Injectez des liquidités !"
 usa_economic_events.36.b: "Le marché libre qui se libère..."
 usa_economic_events.37.t: "La crise de l'industrie automobile américaine"
 usa_economic_events.37.d: "L'industrie automobile, déjà aux prises avec des ventes en berne et des dettes croissantes, affronte désormais un effondrement catastrophique à mesure que la crise du crédit s'approfondit. Les Big Three (General Motors, Ford et Chrysler) perdent des milliards de dollars et préviennent que, sans intervention gouvernementale immédiate, ils pourraient être contraints à la faillite en quelques mois. Des milliers d'emplois sont en jeu, pas seulement à Detroit mais dans toute la chaîne d'approvisionnement qui traverse le pays. La question est maintenant de savoir si Washington sauvera une industrie que beaucoup voient comme le symbole de la puissance manufacturière américaine, ou laissera les forces du marché en décider..."
 usa_economic_events.37.a: "Cela peut-il empirer ?"
 usa_economic_events.38.t: "La crise énergétique des années 2000"
 usa_economic_events.38.d: "Les prix du pétrole ont grimpé à des niveaux inédits, poussés par une demande mondiale croissante, l'instabilité géopolitique au Moyen-Orient et la spéculation sur les marchés des matières premières. Les consommateurs américains sentent la douleur à la pompe alors que les prix de l'essence montent sans relâche, pesant sur des budgets déjà meurtris par la récession. La crise énergétique se propage dans toute l'économie. Les coûts de transport s'envolent, les compagnies aériennes peinent, et les entreprises dépendantes du carburant voient leurs marges s'évaporer. Pendant ce temps, les appels à l'indépendance énergétique et aux carburants alternatifs se font plus forts alors que les Américains mesurent leur vulnérabilité aux marchés pétroliers volatils. La question est de savoir s'il s'agit d'un pic temporaire ou du début d'une ère d'énergie chère..."
 usa_economic_events.38.a: "Well, the price of gas will certainly be over $2.00!"
 usa_economic_events_news.7.t: "La crise énergétique des années 2000"
 usa_economic_events_news.7.d: "Oil prices have reached record highs across global markets. Energy analysts predict that fuel costs will remain elevated for the foreseeable future as demand continues to outpace supply. It will truly be interesting to see whether or not the world will just have to pay more for these high oil prices or will the world look for alternatives in this ever changing world."
 usa_economic_events_news.7.a: "Un jour de plus... Une crise économique de plus..."
 usa_economic_events.37.b: "Voir si on peut jeter de l'argent sur le problème..."
