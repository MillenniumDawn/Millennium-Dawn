 L_AT_Equipment: "ПТУР"
 L_AT_Equipment_desc: "Противотанковая управляемая ракета (ПТУР) — управляемая ракета, предназначенная для поражения танков и других бронированных целей."
 Anti_tank_desc: "Противотанковая управляемая ракета (ПТУР) — управляемая ракета, предназначенная для поражения танков и других бронированных целей."
 H_AT_Equipment: "Самоходный ПТУР"
 H_AT_Equipment_desc: "Истребитель танков — это тип боевой бронированной машины, вооружённой артиллерийской пушкой прямого выстрела или ракетной установкой, с ограниченными эксплуатационными возможностями и специально предназначенной для поражения вражеских танков."
 Heavy_Anti_tank_desc: "Истребитель танков — это тип боевой бронированной машины, вооружённой артиллерийской пушкой прямого выстрела или ракетной установкой, с ограниченными эксплуатационными возможностями и специально предназначенной для поражения вражеских танков."
 Anti_tank_1: "ПТРК 1965 года"
 Anti_tank_1_desc: "Противотанковые управляемые ракеты — переносные ракетные комплексы с фугасными боевыми частями, специально предназначенные для поражения тяжелобронированной техники. ПТУР этого поколения управляются с помощью джойстика, поэтому требуют прямой видимости и высокой квалификации оператора."
 Heavy_Anti_tank_1: "Самоходный ПТРК 1965 года"
 Heavy_Anti_tank_1_desc: "Более тяжёлые противотанковые ракетные комплексы обладают большей дальностью и более мощными ракетами. Из-за возросшей массы их нельзя переносить вручную, поэтому их устанавливают на технику. Они используют фугасные боевые части, специально предназначенные для поражения тяжелобронированной техники."
 Anti_tank_2: "ПТУР 1985 года"
 Anti_tank_2_desc: "Противотанковые управляемые ракеты — переносные ракетные комплексы с кумулятивными боевыми частями, специально предназначенными для поражения тяжелобронированной техники. Это поколение ПТУР использует управление по проводам или полуавтоматическое лазерное наведение."
 Heavy_Anti_tank_2: "Самоходный ПТУР 1985 года"
 Heavy_Anti_tank_2_desc: "Тяжёлые противотанковые управляемые ракетные комплексы обладают большей дальностью и более мощной боевой частью. Из-за повышенного веса они непригодны для переноски вручную и устанавливаются на транспортные средства. Они используют кумулятивные боеголовки, специально предназначенные для поражения сильно бронированной техники. Это поколение ПТУР оснащено проводным управлением или лазерной полуавтоматической системой наведения."
 Anti_tank_3: "ПТУР 2005 года"
 Anti_tank_3_desc: "Противотанковые управляемые ракеты — переносные ракетные комплексы с кумулятивными боевыми частями, специально предназначенными для поражения тяжелобронированной техники. Это поколение ПТУР работает по принципу «выстрелил и забыл», используя электронно-оптическую головку самонаведения по изображению. В них применяются ракеты с тандемной боевой частью для преодоления современной динамической защиты, и часто это варианты с атакой сверху, поражающие самую уязвимую часть брони противника."
 Heavy_Anti_tank_3: "Самоходный ПТУР 2005 года"
 Heavy_Anti_tank_3_desc: "Тяжёлые противотанковые управляемые ракетные комплексы обладают большей дальностью и более мощной боевой частью. Из-за повышенного веса они непригодны для переноски вручную и устанавливаются на транспортные средства. Они используют кумулятивные боеголовки, специально предназначенные для поражения сильно бронированной техники. Это поколение ПТУР работает по принципу «выстрелил и забыл» и использует электронно-оптическую головку самонаведения по изображению. Применяются тандемные боеголовки для преодоления современной динамической защиты (ERA) и часто варианты с атакой сверху, поражающие наиболее уязвимые участки брони противника."
 Anti_tank_4: "ПТУР 2025 года"
 Anti_tank_4_desc: "Противотанковые управляемые ракеты — переносные ракетные комплексы с кумулятивными боевыми частями, специально предназначенными для поражения тяжелобронированной техники."
 Heavy_Anti_tank_4: "Самоходный ПТУР 2025 года"
 Heavy_Anti_tank_4_desc: "Тяжёлые противотанковые управляемые ракетные комплексы обладают большей дальностью и более мощной боевой частью. Из-за повышенного веса они непригодны для переноски вручную и устанавливаются на транспортные средства. Они используют кумулятивные боеголовки, специально предназначенные для поражения сильно бронированной техники."
 AA_Equipment: "ПЗРК"
 AA_Equipment_desc: "Ракета класса «земля-воздух» — это ракета, предназначенная для запуска с земли и уничтожения самолётов и других ракет."
 Anti_Air_desc: "Ракета класса «земля-воздух» — это ракета, предназначенная для запуска с земли и уничтожения самолётов и других ракет."
 Anti_Air_0: "ПЗРК 1965 года"
 Anti_Air_0_desc: "Переносные зенитно-ракетные комплексы — пусковые установки ракет класса «земля-воздух», запускаемые с плеча. Поскольку переносимый вес накладывает жёсткие ограничения на размеры ракет, они представляют собой системы малой дальности. Таким образом, они представляют угрозу для низколетящих самолётов и смертельно опасны для вертолётов."
 SP_Anti_Air_0: "ЗРК 1965 года"
 SP_Anti_Air_0_desc: "Системы противовоздушной обороны малой и средней дальности, устанавливаемые на технику, могут применять более крупные и, следовательно, более дальнобойные ракеты, чем ПЗРК, представляя угрозу для любых воздушных судов. Они также несут больший боекомплект. Такие комплексы ПВО сводятся в специализированные зенитные взводы и батареи."
 SP_Anti_Air_desc: "Зенитная самоходная установка — подвижная машина, специально предназначенная для противовоздушной обороны. Зенитные орудия обычно устанавливаются в быстро поворачивающейся башне с высокой скоростью вертикального наведения, чтобы сопровождать быстро движущиеся самолёты."
 Anti_Air_1: "ПЗРК 1985 года"
 Anti_Air_1_desc: "Переносные зенитно-ракетные комплексы представляют собой ракетные пусковые установки класса «земля-воздух», запускаемые с плеча. Поскольку требования к переносимому весу накладывают жёсткие ограничения на размеры ракет, они представляют собой системы малого радиуса действия. Таким образом, они представляют угрозу для низколетящих самолётов и смертельно опасны для вертолётов."
