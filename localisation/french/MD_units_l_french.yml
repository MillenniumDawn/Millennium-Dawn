l_french:
 fighter: "Chasseur de supériorité aérienne"
 Strike_fighter: "Chasseur de frappe"
 L_Strike_fighter: "Chasseur de frappe légère"
 CV_L_Strike_fighter: "Chasseur de frappe embarqué"
 multi_role_fighter: "Chasseur multirôle"
 cv_multi_role: "Chasseur multirôle embarqué"
 cas: "Appui aérien rapproché"
 strat_bomber: "Bombardier stratégique"
 transport_plane: "Avion de transport"
 attack_helicopter: "Hélicoptère d'attaque"
 Air_UAV: "Drone de combat"
 transport_helicopter: "Hélicoptère de transport"
 Militia_Bat: "Milice"
 Militia_Bat_desc: "Bataillon de milice à pied. Les unités de milice se caractérisent par le fait qu'elles disposent de moins d'équipements lourds et de kits de communication que l'infanterie normale. Cela les rend très mobiles et efficaces en terrain difficile, mais elles se fondent rapidement en terrain plat contre un adversaire blindé."
 Mot_Militia_Bat: "Milice motorisée"
 Mot_Militia_Bat_desc: "Bataillon de milice avec des pick-ups ou même des véhicules utilitaires blindés. Les unités de milice se caractérisent par le fait qu'elles disposent de moins d'équipements lourds et de kits de communication que l'infanterie normale. Cela les rend très mobiles et efficaces en terrain difficile, mais elles se fondent rapidement en terrain plat contre un adversaire blindé."
 L_Inf_Bat: "Infanterie légère"
 L_Inf_Bat_desc: "Infanterie légère sans transports. On en voit rarement sur le champ de bataille moderne, mais il existe des unités spécialisées en terrain très difficile comme la jungle et les montagnes - où elles sont très efficaces. Elles peuvent également être utiles comme garnisons urbaines."
 Mot_Inf_Bat: "Infanterie motorisée"
 Mot_Inf_Bat_desc: "L'infanterie motorisée utilise toutes sortes de véhicules utilitaires comme moyen de transport, des pick-ups aux véhicules modernes résistant aux mines. Ils sont bien adaptés au combat en terrain montagneux et en zone urbaine."
 Mech_Inf_Bat: "Infanterie mécanisée"
 Mech_Inf_Bat_desc: "L'infanterie mécanisée utilise des véhicules blindés de transport de troupes comme moyen de transport. Ils sont bien adaptés au combat blindé en terrain plat."
 Arm_Inf_Bat: "Infanterie blindée"
 Arm_Inf_Bat_desc: "L'infanterie blindée utilise des véhicules de combat d'infanterie comme moyen de transport. Ils sont bien adaptés au combat blindé en terrain plat, mais sont gaspillés en terrain difficile où ils doivent opérer à pied loin de leurs VCI."
 L_Air_Inf_Bat: "Infanterie légère aéroportée"
 L_Air_Inf_Bat_desc: "L'infanterie légère aéroportée est une infanterie d'élite, spécialement entraînée à l'insertion aérienne par parachutage depuis des avions de transport ou des hélicoptères de transport. Elle peut réagir rapidement aux situations d'urgence à distance et peut être insérée derrière les lignes ennemies pour prendre des objectifs vitaux avant l'avancée de l'armée principale. Cependant, leur mode de transport impose des limites strictes à la quantité d'équipement lourd qu'elle peut transporter."
 Mot_Air_Inf_Bat: "Infanterie aéroportée motorisée"
 Mot_Air_Inf_Bat_desc: "L'infanterie aéroportée motorisée est une infanterie d'élite, spécialement entraînée à l'insertion aérienne par parachutage depuis des avions de transport ou des hélicoptères de transport. Elle peut répondre rapidement aux urgences à distance et peut être insérée derrière les lignes ennemies pour prendre des objectifs vitaux avant l'avancée de l'armée principale. Ses véhicules utilitaires lui confèrent une grande mobilité lors de son insertion et lui permettent d'apporter plus d'équipement lourd au combat. Il est cependant beaucoup plus exigeant sur le plan logistique de les parachuter avec des véhicules."
 Mech_Air_Inf_Bat: "Infanterie aéroportée mécanisée"
 Mech_Air_Inf_Bat_desc: "L'infanterie aéroportée mécanisée est une infanterie d'élite, spécialement entraînée à l'insertion aérienne par parachutage depuis des avions de transport. Elle peut réagir rapidement aux urgences à distance et peut être insérée derrière les lignes ennemies pour prendre des objectifs vitaux avant l'avancée de l'armée principale. Ses véhicules blindés de transport de troupes légers spécialement conçus lui confèrent une grande mobilité lors de l'insertion et lui permettent d'emporter beaucoup plus d'équipement lourd au combat que les forces aéroportées plus légères. Il est cependant beaucoup plus exigeant sur le plan logistique de les parachuter avec de tels véhicules."
 Arm_Air_Inf_Bat: "Infanterie blindée aéroportée"
 Arm_Air_Inf_Bat_desc: "L'infanterie aéroportée blindée est une infanterie d'élite, spécialement entraînée à l'insertion aérienne par parachutage depuis des avions de transport. Elle peut réagir rapidement aux situations d'urgence à distance et peut être insérée derrière les lignes ennemies pour prendre des objectifs vitaux avant l'avancée de l'armée principale. Ses véhicules de combat d'infanterie légers spécialement conçus lui confèrent une grande mobilité et lui permettent de se battre à armes égales contre des formations mécanisées normales. Il est cependant extrêmement exigeant sur le plan logistique de les parachuter avec leurs véhicules de combat d'infanterie. En 2017, seule la Russie avait déjà exploité de telles forces."
 L_Marine_Bat: "Infanterie légère de marine"
 L_Marine_Bat_desc: "L'infanterie légère des Marines est une infanterie d'élite, spécialement entraînée aux opérations amphibies, comme les traversées de rivières, les opérations dans les marais et les invasions amphibies. Comme ils ne disposent pas de véhicules, la quantité d'équipement lourd qu'ils peuvent transporter est strictement limitée."
 Mot_Marine_Bat: "Infanterie de marine motorisée"
 Mot_Marine_Bat_desc: "L'infanterie de marine motorisée est une infanterie d'élite, spécialement entraînée aux opérations amphibies, telles que les traversées de rivières, les opérations dans les marais et les invasions amphibies. Bien qu'elle débarque en tant qu'infanterie légère, elle dispose de véhicules utilitaires comme moyens de transport terrestre, ce qui lui confère une grande mobilité et lui permet de transporter de grandes quantités d'équipement lourd au combat."
 Mech_Marine_Bat: "Infanterie de marine mécanisée"
 Mech_Marine_Bat_desc: "L'infanterie de marine mécanisée est une infanterie d'élite, spécialement entraînée aux opérations amphibies, telles que les traversées de rivières, les opérations dans les marais et les invasions amphibies. Comme elle effectue ses débarquements protégée dans ses véhicules blindés de transport de troupes amphibies spécialement conçus, elle est parfaitement équipée pour frapper immédiatement avec une grande mobilité, transportant de grandes quantités d'équipement lourd au combat."
 Arm_Marine_Bat: "Infanterie de marine blindée"
 Arm_Marine_Bat_desc: "L'infanterie de marine blindée est une infanterie d'élite, spécialement entraînée aux opérations amphibies, telles que les traversées de rivières, les opérations dans les marais et les invasions amphibies. Elle peut parcourir de grandes distances sur l'eau dans ses véhicules de combat d'infanterie amphibies à réaction lourdement blindés, et être prête à combattre à partir de ces mêmes véhicules une fois arrivée à terre avec une grande efficacité."
 L_Air_assault_Bat: "Infanterie d'assaut aérien"
 L_Air_assault_Bat_desc: "L'infanterie d'assaut aérien est une infanterie d'élite, avec sa formation spéciale en rappel et en transport aérien, son équipement est parfois conçu ou modifié sur le terrain pour permettre un meilleur transport à bord d'un avion. Elle est souvent utilisée pour saisir et tenir des terrains clés qui n'ont pas été entièrement sécurisés, et pour engager directement les forces ennemies derrière les lignes ennemies."
 attack_helo_bat: "Régiment d'hélicoptères d'attaque"
 attack_helo_bat_desc: "Je m'identifie comme un hélicoptère d'attaque AH-64 Apache."
 attack_helo_comp: "Compagnie d'hélicoptères d'attaque"
 attack_helo_comp_desc: "Je m'identifie comme un hélicoptère d'attaque AH-64 Apache."
 Special_Forces: "Forces d'opérations spéciales"
 Special_Forces_desc: "Les forces d'opérations spéciales constituent l'élite de toutes les armées où elles sont déployées, avec une formation plus longue et plus difficile que celle de n'importe quelle autre armée. Ce sont des experts des terrains difficiles, des opérations aéroportées et des débarquements amphibies. Elles sont cependant très légèrement équipées car elles peuvent avoir besoin d'opérer en mobilité derrière les lignes de front."
 armor_Bat: "Bataillon de chars"
 armor_Bat_desc: "Un bataillon de chars ne comprend que les véhicules les plus lourdement blindés qui existent, les chars de combat principaux. Dotés d'une excellente mobilité sur terrain plat et d'un tir direct féroce, ils sont conçus pour percer les lignes de front ennemies qui peuvent être rapidement exploitées par les unités d'infanterie mécanisées qui suivent."
 armor_Comp: "Cie de chars"
 armor_Comp_desc: "Une compagnie de chars ne comprend que les véhicules les plus lourdement blindés qui existent, les chars de combat principaux. Dotés d'une excellente mobilité sur terrain plat et d'un tir direct féroce, ils sont conçus pour percer des trous dans les lignes de front ennemies qui peuvent être rapidement exploités par les unités d'infanterie mécanisées qui suivent."
 L_Recce_Comp: "Cie de reconnaissance légère"
 L_Recce_Comp_desc: "Les compagnies de reconnaissance légères opèrent à pied et sont donc dépourvues de la plupart des équipements lourds qui en font une unité de combat efficace. Elles s'infiltrent près de l'ennemi pour observer et rendre compte de ses activités, et utilisent à la fois la reconnaissance par drone et la surveillance électronique pour recueillir des renseignements. Elles peuvent également effectuer des raids limités et des embuscades. Les compagnies de reconnaissance sont souvent appelées « escadrons » en raison de leur héritage d'anciennes unités de cavalerie."
 Mot_Recce_Comp: "Cie de reconnaissance motorisée"
 Mot_Recce_Comp_desc: "Les compagnies de reconnaissance motorisées opèrent avec des véhicules utilitaires et disposent d'une grande partie du même équipement que leurs homologues d'infanterie. Leurs rôles sont cependant différents. Elles s'infiltrent près de l'ennemi pour observer et rendre compte de son activité, et utilisent à la fois la reconnaissance par drone et la surveillance électronique pour recueillir des renseignements. Elles peuvent également effectuer des raids limités et des embuscades. Les compagnies de reconnaissance sont souvent appelées « escadrons » en raison de leur héritage d'anciennes unités de cavalerie."
 Mech_Recce_Comp: "Cie de reconnaissance mécanisée"
 Mech_Recce_Comp_desc: "Les compagnies de reconnaissance mécanisées opèrent avec des véhicules blindés de transport de troupes et disposent d'une grande partie du même équipement que leurs homologues de l'infanterie. Leurs rôles sont cependant différents. Elles s'infiltrent près de l'ennemi pour observer et rendre compte de son activité, et utilisent à la fois la reconnaissance par drone et la surveillance électronique pour recueillir des renseignements. Elles peuvent également effectuer des raids limités et des embuscades. Les compagnies de reconnaissance sont souvent appelées « escadrons » en raison de leur héritage d'anciennes unités de cavalerie."
 Arm_Recce_Comp: "Cie de reconnaissance mécanisée lourde"
 Arm_Recce_Comp_desc: "Les compagnies de reconnaissance mécanisées lourdes opèrent avec des véhicules de combat d'infanterie et disposent d'une grande partie du même équipement que leurs homologues de l'infanterie blindée. Leurs rôles sont cependant différents. Elles s'infiltrent près de l'ennemi pour observer et rendre compte de son activité, et utilisent à la fois la reconnaissance par drone et la surveillance électronique pour recueillir des renseignements. Elles peuvent également effectuer des raids et des embuscades. Les compagnies de reconnaissance sont souvent appelées « escadrons » en raison de leur héritage d'anciennes unités de cavalerie."
 L_arm_Bat: "Bataillon de chars légers"
 L_arm_Bat_desc: "Les bataillons de chars légers fonctionnent avec des chars légers spéciaux, souvent à roues, qui combinent une mobilité incroyable avec une puissance d'arrêt impressionnante. Ils peuvent tenir tête à tous les types d’infanterie en combat direct. Le combat direct n'est cependant pas leur rôle prévu : ils s'infiltrent près de l'ennemi pour observer et rendre compte de leur activité, et utilisent à la fois la reconnaissance par drone et la surveillance électronique pour recueillir des informations. Ils peuvent également effectuer des raids et des embuscades sur des ressources ennemies importantes et des formations mécanisées."
 armor_Recce_Comp: "Cie de reconnaissance blindée"
 armor_Recce_Comp_desc: "Les sociétés blindées de reconnaissance opèrent avec des chars légers de reconnaissance spéciaux qui combinent une mobilité incroyable avec une puissance d'arrêt impressionnante. Ils peuvent tenir tête à tous les types d’infanterie en combat direct. Le combat direct n'est cependant pas leur rôle prévu : ils s'infiltrent près de l'ennemi pour observer et rendre compte de leur activité, et utilisent à la fois la reconnaissance par drone et la surveillance électronique pour recueillir des informations. Ils peuvent également effectuer des raids et des embuscades sur des ressources ennemies importantes et des formations mécanisées. Les compagnies de reconnaissance sont souvent appelées « escadrons » en raison de leur héritage en tant qu'anciennes unités de cavalerie."
 L_Engi_Comp: "Cie d'ingénieurs"
 L_Engi_Comp_desc: "Les ingénieurs sont chargés de la construction de ponts temporaires et de périmètres défensifs, de la pose et du déminage, ainsi que du déminage. Ils sont équipés d'armes d'infanterie de base, à des fins défensives."
 H_Engi_Comp: "Cie d'ingénieurs lourde"
 H_Engi_Comp_desc: "Les ingénieurs s'occupent de la construction de ponts temporaires et de périmètres défensifs, de la pose et du déminage, ainsi que du déminage. Ils sont équipés d'armes d'infanterie de base, à des fins défensives. Avec des véhicules de construction et de récupération basés sur des chars de combat principaux, ils sont bien équipés pour récupérer les véhicules blindés hors d'usage sur la ligne de front."
 Arty_Bat: "Artillerie"
 Arty_Bat_desc: "Grâce à ses puissantes capacités de tir indirect, l'artillerie fournit des frappes de précision soutenues là où elle est nécessaire sur le champ de bataille, et bien au-delà de la portée visuelle. Elle peut être rechargée directement par son équipage. Comme elle nécessite des véhicules externes pour se déplacer, il peut être difficile de se déplacer entre les frappes, ce qui la rend vulnérable aux contre-attaques de l'artillerie ennemie. Les systèmes légers de faible calibre peuvent être traînés manuellement et conviennent aux opérations aéroportées car ils peuvent être installés à l'intérieur des avions de transport."
 Arty_Battery: "Batterie d'artillerie"
 Arty_Battery_desc: "Grâce à ses puissantes capacités de tir indirect, l'artillerie fournit des frappes de précision soutenues là où elles sont nécessaires sur le champ de bataille, et bien au-delà de la portée visuelle. Elle peut être rechargée directement par son équipage. Comme elle nécessite des véhicules externes pour se déplacer, il peut être difficile de se déplacer entre les frappes, ce qui la rend vulnérable aux contre-attaques de l'artillerie ennemie. Les systèmes légers de faible calibre peuvent être traînés manuellement et conviennent aux opérations aéroportées car ils peuvent être installés à l'intérieur des avions de transport."
 SP_Arty_Bat: "Artillerie automotrice"
 SP_Arty_Bat_desc: "Grâce à ses puissantes capacités de tir indirect, l'artillerie automotrice fournit des frappes de précision soutenues là où elle est nécessaire sur le champ de bataille, et bien au-delà de la portée visuelle. Elle peut être rechargée directement par son équipage, et son autopropulsion la rend mobile afin qu'il puisse se déplacer pour éviter les contre-attaques de l'artillerie ennemie."
 SP_Arty_Battery: "Batterie d'artillerie automotrice"
 SP_Arty_Battery_desc: "Grâce à ses puissantes capacités de tir indirect, l'artillerie automotrice fournit des frappes de précision soutenues là où elles sont nécessaires sur le champ de bataille, et bien au-delà de la portée visuelle. Elle peut être rechargée directement par son équipage, et son autopropulsion la rend mobile afin qu'il puisse se déplacer pour éviter les contre-attaques de l'artillerie ennemie."
 SP_R_Arty_Bat: "Artillerie à roquette automotrice"
 SP_R_Arty_Bat_desc: "Grâce aux lanceurs MLRS, un bataillon d'artillerie à roquettes peut éradiquer une zone entière à distance. Il est utilisé contre les zones arrière ennemies, car le tir aveugle le rend inadapté aux frappes de précision sur le champ de bataille. Il nécessite des véhicules de rechargement spéciaux et les temps de rechargement sont lents."
 SP_R_Arty_Battery: "Batterie d'artillerie à roquette automotrice"
 SP_R_Arty_Battery_desc: "Grâce aux lanceurs MLRS, une batterie de roquettes d'artillerie peut éradiquer des zones à distance. Elle est utilisée contre les zones arrière ennemies, car le tir aveugle la rend inadaptée aux frappes de précision sur le champ de bataille. Elle nécessite des véhicules de rechargement spéciaux et les temps de rechargement sont lents."
 SP_AA_Bat: "Défense aérienne automotrice"
 SP_AA_Bat_desc: "En utilisant des systèmes de missiles anti-aériens automoteurs à courte ou moyenne portée, le bataillon de défense aérienne défendra son unité contre les frappes d'appui aérien rapproché ennemies."
 SP_AA_Battery: "Batterie de défense aérienne automotrice"
 SP_AA_Battery_desc: "En utilisant des systèmes de missiles anti-aériens automoteurs à courte ou moyenne portée, la batterie de défense aérienne défendra son unité contre les frappes d'appui aérien rapproché ennemies."
 combat_service_support_company: "Service de soutien au combat"
 combat_service_support_company_desc: "Services logistiques et médicaux de la division."
 helicopter_combat_service_support: "Service de soutien des hélicoptères de combat"
 helicopter_combat_service_support_desc: "Services logistiques et médicaux de la division."
 L_Marine_Cdo_Bat: "Bataillon de Commandos Marines"
 L_Marine_Cdo_Bat_desc: "Les commandos de la Marine sont des formations plus importantes de Marine Raiders, entraînés à mener des opérations de frappe et de fuite, entre autres tâches d'infanterie légère."
 air_assault_Arty_Battery: "Batterie d'Artillerie Aéromobile"
 air_assault_Arty_Battery_desc: "À l'aide de pièces d'artillerie remorquées, ces unités augmentent leur mobilité en chargeant leurs canons à l'élingue, ce qui leur permet de suivre les unités d'infanterie aéromobiles plus rapides."
 drone_tactical_company: "Entreprise de drones FPV"
 drone_tactical_company_desc: "À l'aide de drones à voilure fixe FPV et de drones quadricoptères, ces unités ont mené des reconnaissances et des frappes ciblées en soutien de leurs unités de ligne."
 group_headquarters_title: "Commandement"
 arm_inf_hq: "Unité de commandement de l’infanterie blindée"
 arm_inf_hq_desc: "Élément de quartier général pour l'infanterie mécanisée et blindée."
 arm_hq: "Quartier général blindé"
 arm_hq_desc: "Élément de quartier général pour chars légers et chars de combat principaux"
 L_Ranger_Bat: "Ranger Light Infantry"
 L_Ranger_Recce_Comp: "Ranger Light Recce Infantry"
 group_headquarters_title_desc: "unités d'état-major, équipées pour mener des unités au combat"
 light_inf_hq: "Quartier général de l'infanterie légère"
 light_inf_hq_desc: "Élément de quartier général pour infanterie légère et motorisée"
 helo_hq: "Quartier général des hélicoptères"
 helo_hq_desc: "Élément de quartier général pour unités d'hélicoptères"
 group_light_bat_title: "Unités en sous-effectif"
 group_light_bat_title_desc: "Éléments de combat en sous-effectif, conçus pour la multiplication de force, aux capacités réduites, mais à l'entraînement et au coût réduits."
 Light_Mech_Inf_Bat: "Bataillon d'infanterie mécanisée en sous-effectif"
 Light_Mech_Inf_Bat_desc: "Un élément mécanisé sous-effectif utilise une petite allocation de véhicules de transport de troupes pour renforcer une formation sans prendre le frontage normal.\n\n§GIndice du concepteur : l'infanterie mécanisée sous-effectif ajoute protection VTT et défense sans largeur de combat. Utilisez-la pour renforcer des formations éligibles en plaines, collines ou villes, mais son coût de véhicules, sa faible force et ses pénalités sévères en montagne, jungle, marais, rivière et amphibie limitent sa valeur de combat indépendante.§!"
 Light_Arm_Inf_Bat: "Bataillon d'infanterie blindée en sous-effectif"
 Light_Arm_Inf_Bat_desc: "Un élément d'infanterie blindée sous-effectif utilise une petite allocation de véhicules de combat d'infanterie pour ajouter une puissance de feu protégée sans occuper le frontage normal.\n\n§GIndice du concepteur : l'infanterie blindée sous-effectif ajoute blindage VCI et puissance de feu sans largeur de combat et performe le mieux en plaines et déserts. Utilisez-la pour renforcer des formations de valeur, mais sa faible organisation, ses véhicules coûteux et ses pénalités extrêmes en terrain difficile, rivière et amphibie la rendent très spécialisée.§!\n§GIndice concepteur : l'infanterie blindée en sous-effectif ajoute blindage et puissance de feu de VCI sans largeur de combat et performe le mieux en plaines et déserts. Utilisez-la pour renforcer des formations de valeur, mais sa faible organisation, ses véhicules coûteux et d'extrêmes pénalités en terrain accidenté, rivière et amphibie la rendent très spécialisée.§!"
 Light_L_Air_assault_Bat: "Bataillon d'infanterie d'assaut aérien en sous-effectif"
 Light_L_Air_assault_Bat_desc: "L'infanterie d'assaut aérien est une infanterie d'élite, avec un entraînement spécial en descente en rappel et transport aérien ; son équipement est parfois conçu ou modifié sur le terrain pour un meilleur transport aérien. Elle est souvent utilisée pour s'emparer et tenir un terrain clé non pleinement sécurisé, et pour engager directement des forces ennemies derrière les lignes.\n\n§GIndice du concepteur : cet élément d'assaut aérien sous-effectif ajoute organisation et de puissants bonus urbains, montagne, forêt, jungle et marais sans largeur de combat. Utilisez-le pour renforcer des formations spécialisées en terrain difficile, mais son exigence d'hélicoptères est coûteuse et il performe mal en plaines, déserts et attaques amphibies.§!"
 Light_attack_helo_bat: "Régiment d'hélicoptères d'attaque en sous-effectif"
 Light_attack_helo_bat_desc: "Un petit élément d'hélicoptères d'attaque offre un soutien rapide de cannonière sans l'empreinte d'un régiment complet.\n\n§GIndice du concepteur : les hélicoptères d'attaque sous-effectif ajoutent une puissance de feu blindée rapide sans largeur de combat et excellent en plaines et déserts. Utilisez-les pour un soutien mobile compact, mais leur très faible organisation et force, leurs aéronefs coûteux et leurs pénalités sévères en montagne, jungle, marais et urbain rendent les pertes difficiles à absorber.§!"
 Light_armor_Bat: "Bataillon de chars en sous-effectif"
 Light_armor_Bat_desc: "Un élément de chars sous-effectif concentre un nombre limité de chars de combat principaux pour renforcer une formation sans occuper le frontage normal.\n\n§GIndice du concepteur : les chars sous-effectif ajoutent blindage, percée et de fortes attaques en plaines et déserts sans largeur de combat. Utilisez-les pour renforcer économiquement des formations offensives, mais leur faible organisation et force, le coût des chars et les pénalités extrêmes en terrain difficile et villes en font un mauvais soutien polyvalent.§!\n§GIndice concepteur : les chars en sous-effectif ajoutent blindage, percée et de fortes attaques en plaine et désert sans largeur de combat. Utilisez-les pour renforcer économiquement des formations offensives, mais leur faible organisation et force, le coût des chars et d'extrêmes pénalités en terrain accidenté et villes en font un appui polyvalent médiocre.§!"
 Light_L_arm_Bat: "Bataillon de chars légers en sous-effectif"
 Light_L_arm_Bat_desc: "Un élément de chars légers sous-effectif offre une puissance de feu anti-blindés mobile et une reconnaissance en force avec une empreinte de véhicules plus petite.\n\n§GIndice du concepteur : les chars légers sous-effectif ajoutent une puissance de feu anti-blindés mobile sans largeur de combat et excellent en plaines et déserts. Utilisez-les pour durcir des formations rapides contre les véhicules, mais leur faible force, châssis spécialisés et lourdes pénalités de terrain difficile, rivière et amphibie limitent la flexibilité.§!\n§GIndice concepteur : les chars légers en sous-effectif ajoutent une puissance de feu anti-blindage mobile sans largeur de combat et excellent en plaines et déserts. Utilisez-les pour raidcir des formations rapides contre les véhicules, mais leur faible force, leur châssis spécialisé et de lourdes pénalités en terrain accidenté, rivière et amphibie limitent la flexibilité.§!"
 Light_SP_Arty_Bat: "Bataillon d'artillerie automotrice en sous-effectif"
 Light_SP_Arty_Bat_desc: "Un élément d'artillerie automotrice réduit délivre un feu indirect mobile avec moins de véhicules qu'un bataillon complet.\n\n§GIndice du concepteur : l'artillerie automotrice sous-effectif ajoute une attaque douce mobile sans largeur de combat et performe particulièrement bien en plaines, déserts et villes. Utilisez-la pour un soutien offensif compact, mais elle n'a presque pas d'organisation, une faible force, un coût de châssis spécialisé, et de plus faibles performances en forêts, montagnes et jungles.§!"
 Light_SP_R_Arty_Bat: "Bataillon d'artillerie à fusées automotrices en sous-effectif"
 Light_SP_R_Arty_Bat_desc: "Un élément de lance-roquettes multiples réduit offre un feu de zone concentré tout en utilisant moins de véhicules qu'un bataillon complet.\n\n§GIndice du concepteur : l'artillerie-roquettes sous-effectif ajoute une puissante attaque douce mobile sans largeur de combat et excelle en plaines, déserts et villes. Utilisez-la pour renforcer des formations offensives, mais son organisation négligeable, sa faible force, le coût des véhicules-roquettes et les pénalités de terrain difficile exigent une protection.§!"
 Light_SP_AA_Bat: "Bataillon de défense aérienne automotrice en sous-effectif"
 Light_SP_AA_Bat_desc: "Un élément de défense aérienne automotrice réduit protège la formation avec une petite allocation de systèmes antiaériens mobiles.\n\n§GIndice du concepteur : la défense aérienne automotrice sous-effectif ajoute de l'attaque aérienne sans largeur de combat ni beaucoup de main-d'œuvre. Utilisez-la pour une protection compacte des formations mobiles sous la puissance aérienne ennemie, mais elle n'a presque pas d'organisation, une faible force, et exige des véhicules antiaériens spécialisés qui ajoutent peu de puissance de feu terrestre.§!"
 Drone_Recce_Comp: "Compagnie de reconnaissance sans pilote"
 Drone_Recce_Comp_desc: "En employant de petits systèmes aériens sans pilote pour étendre l'observation au-delà de la ligne de vue, la compagnie de recon sans pilote améliore la conscience du champ de bataille sans exposer les éclaireurs au feu direct. Ces drones peuvent rapidement cribler les itinéraires, identifier les positions ennemies et confirmer les cibles en terrain complexe, permettant une décision plus rapide et des feux plus précis.\n\n§GIndice du concepteur : la recon sans pilote offre une haute reconnaissance et initiative, renforce les autres éléments de recon et améliore les attaques d'artillerie. Utilisez-la dans des divisions mobiles ou blindées qui peuvent se permettre des drones, mais elle ajoute largeur de combat et consommation de ravitaillement, réduit le retranchement et performe mal en villes et montagnes.§!\n§GIndice concepteur : la recce sans équipage offre une haute reconnaissance et initiative, renforce les autres éléments de recon et améliore les attaques d'artillerie. Utilisez-la dans les divisions mobiles ou blindées qui peuvent s'offrir des drones, mais elle ajoute largeur de combat et consommation de ravitaillement, réduit le retranchement et performe mal en villes et montagnes.§!"
 medium_walker_battalion: "Bataillon de marcheurs moyens"
 medium_walker_battalion_desc: "Conçu comme l'épine dorsale polyvalente des formations de marcheurs, le bataillon de marcheurs moyens combine protection, mobilité et capacité d'emport équilibrées pour le combat direct.\n\n§GIndice du concepteur : les marcheurs moyens offrent une puissance de première ligne blindée flexible déterminée par le châssis de marcheur équipé. Utilisez-les comme noyau polyvalent des formations de marcheurs, mais leur large largeur de combat, faible organisation, long entraînement et forte exigence de châssis les rendent coûteux à aligner et à remplacer.§!\n§GIndice concepteur : les marcheurs moyens offrent une puissance de première ligne blindée flexible déterminée par le châssis équipé. Utilisez-les comme noyau polyvalent des formations de marcheurs, mais leur large largeur de combat, leur faible organisation, leur long entraînement et leur gros besoin de châssis les rendent coûteux à aligner et à remplacer.§!"
 light_walker_tank_battalion: "Bataillon de marcheurs légers"
 light_walker_tank_battalion_desc: "Bâti autour de châssis de marcheurs anti-blindés, le bataillon de marcheurs légers met l'accent sur la chasse aux cibles durcies et l'exploitation des ouvertures plutôt que le combat de ligne soutenu.\n\n§GIndice du concepteur : les marcheurs légers se spécialisent contre les cibles blindées via des châssis de chasseurs de chars. Utilisez-les lorsque le blindage ennemi exige perforation et attaque dure concentrées, mais leur large largeur de combat, faible organisation, long entraînement et coût de châssis spécialisé les rendent inefficaces contre une opposition molle.§!"
 heavy_walker_tank_battalion: "Bataillon de marcheurs lourds"
 heavy_walker_tank_battalion_desc: "Les bataillons de marcheurs lourds montent des charges d'artillerie sur d'immenses plateformes marcheuses pour délivrer un soutien de feu protégé avec la formation principale.\n\n§GIndice du concepteur : les marcheurs lourds offrent une puissance de feu d'artillerie blindée depuis des châssis d'artillerie marcheurs. Utilisez-les pour ajouter un soutien puissant contre l'infanterie et les lignes fortifiées, mais leur large largeur de combat, faible organisation, long entraînement et châssis spécialisés coûteux exigent une formation bien soutenue.§!"
 space_artillery_support_company: "Compagnie de soutien d'artillerie spatiale"
 space_artillery_support_company_desc: "En employant des projectiles d'artillerie tirés depuis des plateformes orbitales, la compagnie de soutien d'artillerie spatiale délivre un bombardement de précision depuis l'espace sur des cibles du champ de bataille bien au-delà de la portée des systèmes conventionnels. Ces frappes peuvent rapidement supprimer des positions fortifiées, détruire des atouts de haute valeur et briser des concentrations ennemies avec un minimum d'avertissement.\n\n§GIndice du concepteur : l'artillerie spatiale double la contribution d'attaque des bataillons d'artillerie sans ajouter de largeur de combat et peut être parachutée. Utilisez-la pour amplifier les formations lourdes d'artillerie, mais son équipement rare de contrôle orbital, son long entraînement et ses faibles statistiques de combat autonomes la rendent gaspillée dans des divisions avec peu d'artillerie.§!"
 space_artillery_equipment_type: "Relais de contrôle de tir orbital"
 space_artillery_equipment_type_desc: "Un relais durci de communications et de visée conçu pour demander, coordonner et confirmer des frappes d'artillerie orbitale en temps réel. Il relie les observateurs de première ligne aux batteries spatiales, permettant des missions de feu rapides, un timing précis et une déconfliction fiable avec les forces amies. Le système est coûteux et gourmand en ressources, mais sans lui la puissance de feu orbitale reste aveugle, lente et dangereusement inefficace."
 space_artillery_equipment_1: "$space_artillery_equipment_type$ Je"
 space_artillery_equipment_1_desc: "$space_artillery_equipment_type_desc$"
 HACS_Mech: "1er. gén. Système de combat à haute agilité"
 HACS_Mech_desc: "Le système de combat à haute agilité de première génération combine blindage, armes et mobilité avancés dans une plateforme de combat déployable par air.\n\n§GIndice du concepteur : les HACS de première génération offrent une très haute organisation, force, puissance de feu tous azimuts et une capacité de parachutage avec de forts bonus en collines et plaines. Utilisez-les comme fers de lance blindés d'élite, mais leur large largeur de combat, très long entraînement, équipement rare et pénalités forêt et jungle rendent les pertes imprudentes graves.§!\n§GIndice concepteur : les HACS de première génération offrent une très haute organisation, force, puissance de feu polyvalente et capacité de parachutage avec de forts bonus en collines et plaines. Utilisez-les comme fers de lance blindés d'élite, mais leur large largeur de combat, leur très long entraînement, leur équipement rare et les pénalités forêt et jungle rendent les pertes imprudentes graves.§!"
 HACS_Mech_2: "2ème. gén. Système de combat à haute agilité"
 HACS_Mech_2_desc: "Le système de combat à haute agilité de deuxième génération améliore protection, systèmes d'armes et endurance au combat tout en conservant la flexibilité de déploiement stratégique.\n\n§GIndice du concepteur : les HACS de deuxième génération améliorent organisation, force et percée tout en conservant parachutage et exfiltration côtière. Utilisez-les pour des attaques d'élite en collines, plaines, déserts et marais, mais la large largeur de combat, l'équipement rare, le long entraînement et une pénalité jungle restante exigent un usage sélectif.§!"
 HACS_Mech_3: "3ème. gén. Système de combat à haute agilité"
 HACS_Mech_3_desc: "Le système de combat à haute agilité de troisième génération combine protection avancée, armes modulaires et endurance exceptionnelle au combat.\n\n§GIndice du concepteur : les HACS de troisième génération offrent organisation, force, retranchement exceptionnels, une large puissance de feu, une capacité de parachutage et de forts bonus de terrain. Utilisez-les pour les opérations blindées les plus exigeantes, mais leur large largeur de combat, long entraînement et équipement avancé irremplaçable punissent encore l'attrition.§!"
 ALN_bellatoris: "Bellatoris"
 ALN_bellatoris_desc: "Le Bellatoris est le guerrier de première ligne de l'essaim Chimère, élevé pour l'assaut rapproché implacable. Rapide et agressif, il submerge les lignes défensives par le nombre et la férocité.\n\n§GIndice du concepteur : les Bellatoris combinent une très haute organisation et force avec des attaques équilibrées, défense, percée et un entraînement rapide. Utilisez-les comme troupes de ligne Chimère polyvalentes en forêts, collines, marais, plaines et déserts, mais ils n'ont pas d'attaque aérienne et souffrent en montagnes et jungles.§!"
 ALN_brachionis: "Brachionis"
 ALN_brachionis_desc: "Le Brachionis est une Chimère à membres multiples bâtie pour agripper et déchirer les cibles blindées à courte portée.\n\n§GIndice du concepteur : les Brachionis échangent un peu de défense contre davantage d'attaque douce et d'attaque dure tout en conservant une haute organisation et un entraînement rapide. Utilisez-les comme troupes d'assaut agressives en terrain ouvert, mais ils restent plus faibles en montagnes et jungles.§!"
 ALN_gravis: "Gravis"
 ALN_gravis_desc: "Le Gravis est la souche Chimère la plus lourde, une masse blindée qui ancre l'avance de l'essaim et brise les positions durcies par la force.\n\n§GIndice du concepteur : les Gravis offrent les plus fortes attaques, percée et initiative Chimère avec une haute organisation et un entraînement rapide. Utilisez-les comme ancres offensives en terrain ouvert, mais ils consomment plus de ravitaillement, ont une défense et une organisation inférieures aux souches plus légères, et souffrent en montagnes et jungles.§!"
 Hvy_Mot_Inf_Bat: "Infanterie lourde motorisée"
 Hvy_Mot_Inf_Bat_desc: "L'infanterie motorisée lourde utilise des véhicules protégés contre les mines et les embuscades (MRAP) comme transport. Leurs véhicules blindés offrent une protection supérieure d'équipage contre mines, IED et armes légères, les rendant idéaux pour les opérations en milieux hostiles où les menaces d'embuscade sont élevées.\n\n§GIndice du concepteur : l'infanterie motorisée lourde utilise des véhicules plus protégés pour des opérations de première ligne rapides en plaines et déserts. Elle est plus gourmande en équipement et a une organisation et un retranchement inférieurs à l'infanterie plus légère, tout en subissant encore de lourdes pénalités en terrain difficile.§!"
 L_Ranger_Bat_desc: "Les rangers sont une infanterie légère d'élite, spécialisée dans les raids, l'action directe et le déploiement rapide en avant de la force principale. Ils voyagent léger pour maximiser mobilité et surprise, s'emparant d'objectifs clés et les tenant jusqu'à l'arrivée des unités conventionnelles. La contrepartie est un équipement lourd clairsemé, les laissant exposés face aux blindés en terrain ouvert.\n\n§GIndice du concepteur : les rangers concentrent une haute organisation et d'exceptionnels bonus de terrain difficile dans une faible largeur de combat. Utilisez-les pour des formations d'élite de montagne, forêt, jungle, marais ou urbaine, mais leur long entraînement, le plafond forces spéciales et l'équipement lourd limité rendent le déploiement de masse coûteux et les exposent en plaine.§!\n§GIndice concepteur : les rangers concentrent une haute organisation et des bonus exceptionnels en terrain difficile dans une faible largeur de combat. Utilisez-les pour des formations d'élite en montagne, forêt, jungle, marais ou urbain, mais leur long entraînement, le plafond forces spéciales et l'équipement lourd limité rendent le déploiement de masse coûteux et les laissent exposés en plaine.§!"
 L_Ranger_Recce_Comp_desc: "Un élément de reconnaissance issu des rangers, formé à s'infiltrer profondément derrière les lignes ennemies à pied et à rendre compte des mouvements ennemis. Combinant furtivité, reconnaissance par drones et surveillance électronique, ils recueillent le renseignement et marquent les cibles pour les feux amis, et peuvent mener raids et embuscades limités lorsque l'occasion se présente.\n\n§GIndice du concepteur : la recon rangers ajoute reconnaissance et initiative tout en améliorant l'attaque douce de l'artillerie et en combattant bien en terrain difficile. Utilisez-la dans des formations de forces spéciales ayant besoin d'une reconnaissance d'élite, mais elle ajoute de la largeur de combat, consomme de la capacité forces spéciales et contribue peu de puissance de feu directe.§!\n§GIndice concepteur : la recce rangers ajoute reconnaissance et initiative tout en améliorant l'attaque douce de l'artillerie et en combattant bien en terrain difficile. Utilisez-la dans les formations de forces spéciales qui ont besoin d'un éclairage d'élite, mais elle ajoute de la largeur de combat, consomme la capacité forces spéciales et contribue peu en puissance de feu directe.§!"
 A_L_arm_Bat: "Compagnie de chars légers aéroportés"
 A_L_arm_Bat_desc: "La compagnie de chars légers opère avec des chars légers spéciaux, souvent à roues, qui combinent une mobilité incroyable et une puissance d'arrêt impressionnante. Ils peuvent tenir face à tous types d'infanterie en combat direct. Le combat direct n'est pourtant pas leur rôle prévu — ils s'infiltrent près de l'ennemi pour observer et rendre compte, et utilisent reconnaissance par drones et surveillance électronique pour recueillir le renseignement. Ils peuvent aussi mener raids et embuscades contre des atouts ennemis importants et des formations mécanisées. Ces unités sont aussi capables d'opérations aéroportées avec des éléments parachutistes, offrant un soutien blindé rapproché immédiat.\n\n§GIndice du concepteur : les chars légers aéroportés donnent aux formations de parachutage un blindage mobile et une puissance de feu anti-véhicule après insertion. Utilisez-les pour soutenir les troupes aéroportées contre une opposition mobile en terrain ouvert, mais les véhicules spécialisés sont coûteux et subissent de sévères pénalités en montagnes, jungles, marais et villes.§!"
 air_assault_Arty_Bat: "Artillerie aéromobile"
 air_assault_Arty_Bat_desc: "Un bataillon complet de pièces d'artillerie tractées transportées par élingage d'hélicoptère. Offre un soutien de feu indirect soutenu aux opérations aéromobiles, suivant le rythme de l'infanterie d'assaut aérien par un repositionnement aérien rapide.\n\n§GIndice du concepteur : l'artillerie aéromobile ajoute une attaque douce substantielle aux formations d'hélicoptères et performe bien en collines, montagnes, forêts, jungles et villes. Utilisez-la pour soutenir les troupes d'assaut aérien en terrain difficile, mais elle ajoute de la largeur de combat, a une faible organisation et force, et exige des hélicoptères de transport coûteux.§!"
 Weapons_company: "Compagnie d'armes"
 Weapons_company_desc: "Une compagnie d'armes, composée d'armes de soutien d'infanterie à tir direct, telles que des équipes de mitrailleuses moyennes et lourdes, d'armes de grenades et d'autres armes lourdes d'infanterie à tir direct. Cette compagnie est conçue pour fournir des feux de soutien à tout élément d'infanterie auquel elle est affectée, sur un large éventail de forces.\n\n§GIndice du concepteur : une compagnie d'armes ajoute de larges statistiques de tir direct, surtout la perforation, sans largeur de combat. Utilisez-la pour renforcer l'infanterie polyvalente, mais sa forte demande d'équipement d'infanterie et sa pénalité de retranchement la rendent moins attractive pour de peu coûteux défenseurs statiques.§!"
 Heavy_mortar_company: "Compagnie de mortier"
 Heavy_mortar_company_desc: "Les mortiers sont conçus pour offrir un soutien de feu rapide et intégré aux unités de ligne, sans attachement d'échelons supérieurs. Ces mortiers offrent un soutien de feu indirect aux éléments de ligne, à un coût bien moindre qu'une unité d'artillerie à grande échelle.\n\n§GIndice du concepteur : une compagnie de mortiers offre une forte attaque douce sans équipement d'artillerie ni largeur de combat. Utilisez-la comme soutien de feu intégré peu coûteux contre l'infanterie, mais elle offre peu d'attaque dure ou de perforation et réduit le retranchement.§!"
 Sniper_company: "Compagnie de tireurs d’élite"
 Sniper_company_desc: "Équipée de tireurs d'élite travaillant en binômes observateur, la compagnie de snipers offre un feu sélectif à longue portée contre des cibles de haute valeur telles qu'officiers, équipages et équipes de communications. Elle excelle à harceler et perturber les formations ennemies depuis la dissimulation, dégradant l'efficacité ennemie tout en restant difficile à localiser et à engager.\n\n§GIndice du concepteur : une compagnie de snipers ajoute attaque douce, reconnaissance, et renforce l'initiative des éléments de recon et la puissance de feu de l'artillerie. Utilisez-la contre l'infanterie et pour une meilleure coordination du champ de bataille, mais elle ajoute de la largeur de combat et a une très faible percée, attaque dure et perforation.§!\n§GIndice concepteur : une compagnie de snipers ajoute attaque douce, reconnaissance, et booste l'initiative des éléments de recon et la puissance de feu de l'artillerie. Utilisez-la contre l'infanterie et pour une meilleure coordination, mais elle ajoute de la largeur de combat et a une très faible percée, attaque dure et perforation.§!"
 AT_company: "Compagnie antichar d'infanterie"
 AT_company_desc: "Équipée d'armes antichars d'infanterie, cette compagnie antichar est conçue pour travailler spécifiquement avec des éléments d'infanterie légère. Capable d'opérer facilement en zones urbaines, forêts et autres lieux retranchés ou rapprochés, cette équipe peut attaquer des éléments blindés ennemis puis disparaître dans ses positions retranchées.\n\n§GIndice du concepteur : l'antichar d'infanterie ajoute une haute attaque dure et perforation sans largeur de combat pour les formations à pied, aéroportées, marines et forces spéciales. Utilisez-la lorsque ces divisions doivent résister aux blindés, mais elle affaiblit les autres statistiques de combat et ajoute un coût d'équipement spécialisé.§!"
 Mot_AT_company: "Compagnie antichar de véhicules"
 Mot_AT_company_desc: "Une compagnie dédiée aux opérations antichars, travaillant depuis des positions de tir montées sur véhicules. Cette compagnie est conçue davantage pour la vitesse, leur permettant de suivre des éléments mobiles et blindés rapides, tout en offrant des capacités antichars accrues.\n\n§GIndice du concepteur : l'antichar véhiculaire ajoute une haute attaque dure et perforation sans ralentir les formations mobiles. Utilisez-la dans des divisions motorisées, blindées, aéroportées ou marines face aux chars, mais les armes antichars lourdes et les véhicules utilitaires la rendent plus coûteuse et elle contribue peu contre les cibles molles.§!"
 AA_company: "Compagnie anti-aérienne"
 AA_company_desc: "Un élément équipé spécifiquement pour engager les éléments aériens ennemis et offrir une défense contre hélicoptères et autres aéronefs.\n\n§GIndice du concepteur : une compagnie antiaérienne offre une forte attaque aérienne sans largeur de combat. Utilisez-la pour protéger des divisions opérant sous la puissance aérienne ennemie, mais elle est faible au combat terrestre et consomme un équipement antiaérien dédié de peu de valeur lorsque le ciel est sûr.§!"
 Combat_engineer_company: "Compagnie du génie de combat"
 Combat_engineer_company_desc: "Les sapeurs de combat mènent des actions de génie offensives en soutien direct des unités de ligne. Ils sont formés et équipés pour franchir un terrain difficile, comme rivières ou fossés antichars. Ils sont aussi équipés pour percer champs de mines ou autres obstacles défensifs, et dégager des zones pour permettre aux autres forces de combat de passer sans entrave.\n\n§GIndice du concepteur : les sapeurs de combat ajoutent défense, percée et de modestes bonus d'attaque et de défense en forêts, montagnes, jungles et villes sans largeur de combat. Utilisez-les pour les assauts en terrain difficile, mais ils exigent un équipement d'infanterie substantiel et offrent moins de valeur spécialisée en terrain ouvert.§!"
 pathfinder_company: "Société des éclaireurs"
 pathfinder_company_desc: "Groupes d'élite de parachutistes, formés à sauter avant les opérations aéroportées, pour trouver les LZ et zones de rassemblement les plus sûrs. Ces troupes d'élite offrent un commandement et un contrôle critiques pendant les moments clés de toute opération aéroportée ou aéromobile.\n\n§GIndice du concepteur : les pathfinders améliorent l'organisation et l'attaque douce de l'infanterie aéroportée et peuvent se déployer en parachute. Utilisez-les pour renforcer des divisions d'assaut aéroporté ou aéromobile, mais ils ajoutent de la largeur de combat, sont limités à ces formations et offrent peu de puissance de combat directe.§!"
 amphibious_landing_detachment: "Attachement d'atterrissage naval"
 amphibious_landing_detachment_desc: "Éléments attachés de la marine permettant des opérations de débarquement amphibie rapides et efficaces. Équipés de navires et d'équipement de débarquement dédiés, ces unités facilitent des opérations rapides de navire à terre ou au-delà de l'horizon. Le prix d'attacher l'une de ces unités, cependant, est la baisse des capacités à mener des opérations non amphibies.\n\n§GIndice du concepteur : un détachement de débarquement naval améliore grandement attaque, défense et mouvement amphibies pour les formations marines. Utilisez-le dans des divisions dédiées à l'assaut des plages, mais il ajoute largeur de combat, main-d'œuvre et équipement et impose de sévères pénalités de combat dans presque tous les terrains terrestres.§!\n§GIndice concepteur : un attachement de débarquement naval améliore grandement attaque, défense et mouvement amphibies pour les formations de marines. Utilisez-le dans les divisions dédiées à l'assaut des plages, mais il ajoute largeur de combat, effectifs et équipement et impose de lourdes pénalités de combat dans presque tous les terrains terrestres.§!"
 combat_maintenance_company: "Entreprise d'entretien"
 combat_maintenance_company_desc: "La compagnie de maintenance maintient les véhicules et l'équipement lourd d'une formation dans le combat, effectuant des réparations de campagne et récupérant les plateformes endommagées avant qu'elles ne soient perdues pour de bon. En restaurant les véhicules hors combat près du front, elle soutient la force blindée lors d'opérations prolongées et réduit le drain de l'attrition.\n\n§GIndice du concepteur : la maintenance améliore fiabilité, récupération et capture d'équipement pour les divisions lourdes en véhicules. Utilisez-la pour limiter l'attrition et préserver un équipement coûteux lors de longues opérations, mais elle ajoute largeur de combat, main-d'œuvre et véhicules utilitaires tout en contribuant peu de puissance de feu directe.§!\n§GIndice concepteur : la maintenance améliore fiabilité, récupération et capture d'équipement pour les divisions lourdes en véhicules. Utilisez-la pour limiter l'attrition et préserver l'équipement coûteux lors de longues opérations, mais elle ajoute largeur de combat, effectifs et véhicules utilitaires tout en contribuant peu en puissance de feu directe.§!"
 airmobile_maintenance_company: "Entreprise de maintenance aéronautique"
 airmobile_maintenance_company_desc: "Un élément de maintenance configuré pour soutenir les forces aéromobiles et d'hélicoptères, avec l'outillage plus léger et plus transportable nécessaire pour garder opérationnelles les unités à voilure tournante et déployées rapidement. Il restaure l'équipement endommagé en zones avancées, soutenant le tempo des opérations d'assaut aérien loin des dépôts établis.\n\n§GIndice du concepteur : la maintenance aéromobile améliore capture d'équipement et fiabilité tout en suivant le rythme des formations d'hélicoptères. Utilisez-la pour préserver un équipement rotatif coûteux, mais elle offre moins de récupération que la maintenance terrestre, ajoute de la largeur de combat et exige de nombreux hélicoptères de transport.§!"
 communications_company: "Entreprise de communication"
 communications_company_desc: "La compagnie de transmissions maintient les réseaux radio, données et de commandement qui lient une formation, assurant que ordres et rapports circulent de façon fiable sur le champ de bataille. Des communications robustes améliorent coordination et temps de réaction, et durcissent la formation contre le brouillage et la perturbation électronique.\n\n§GIndice du concepteur : une compagnie de transmissions améliore organisation, récupération et initiative des bataillons de première ligne. Utilisez-la dans de grandes ou précieuses divisions de combat qui bénéficient de la coordination, mais elle ajoute de la largeur de combat et un coût substantiel d'équipement de commandement et de contrôle tout en offrant peu de puissance de feu directe.§!"
 military_police_attachment: "Police militaire"
 military_police_attachment_desc: "La police militaire gère le contrôle de la circulation, la sécurité de l'arrière et le traitement des prisonniers, libérant les unités de ligne pour le combat. En maintenant les itinéraires de ravitaillement en ordre et en sécurisant l'arrière contre infiltrés et traînards, elle préserve la discipline et fait avancer une formation en douceur.\n\n§GIndice du concepteur : la police militaire multiplie la suppression de l'infanterie et ajoute davantage de suppression sans largeur de combat. Utilisez-la dans des modèles d'occupation et de sécurité d'arrière, mais son coût de main-d'œuvre et d'équipement offre peu de bénéfice aux divisions de combat de première ligne.§!\n§GIndice concepteur : la police militaire multiplie la suppression d'infanterie et ajoute encore de la suppression sans largeur de combat. Utilisez-la dans les modèles d'occupation et de sécurité d'arrière, mais son coût en effectifs et équipement offre peu d'avantage aux divisions de combat de première ligne.§!"
 hq_mech: "Compagnie d'infanterie mécanisée du QG"
 hq_mot: "Compagnie d'infanterie motorisée du QG"
 hq_armor: "Compagnie de cavalerie lourde du QG"
 hq_Mot_Inf_Bat: "Détachement de sécurité d'infanterie motorisée du QG"
 hq_Mech_Inf_Bat: "Détachement de sécurité d'infanterie mécanisée du QG"
 hq_Arm_Inf_Bat: "Détachement de sécurité blindé du QG"
 hq_Mech_Marine_Bat: "Détachement de sécurité maritime du QG"
 hq_Mech_Air_Inf_Bat: "Détachement de sécurité d'assaut aérien du QG"
 Militia_Recce_Comp: "Compagnie de reconnaissance de la milice"
 Militia_Recce_Comp_desc: "Les compagnies de recon de milice utilisent des véhicules utilitaires et un équipement de communication limité pour éclairer en avant des formations de milice. Elles offrent une reconnaissance peu coûteuse des positions ennemies, surtout en terrain bâti.\n\n§GIndice du concepteur : la recon de milice ajoute reconnaissance et initiative sans largeur de combat et performe particulièrement bien en villes et supercités. Utilisez-la pour améliorer à bon marché les tactiques de milice, mais elle est limitée à la milice et contribue peu de puissance de combat directe.§!\n§GIndice concepteur : la recce de milice ajoute reconnaissance et initiative sans largeur de combat et performe particulièrement bien en villes et supercités. Utilisez-la pour améliorer à bon marché les tactiques de milice, mais elle est restreinte à la milice et contribue peu en combat direct.§!"
 light_medium_walker_battalion: "Bataillon de marcheurs moyen (léger)"
 light_medium_walker_battalion_desc: "Un élément de marcheurs moyens réduit renforce une formation avec une petite allocation de châssis de marcheurs polyvalents.\n\n§GIndice du concepteur : les marcheurs moyens sous-effectif ajoutent une puissance blindée flexible avec moins de largeur de combat et bien moins de châssis qu'un bataillon complet. Utilisez-les lorsque la production ne peut soutenir un élément complet, mais ils conservent une faible organisation, un long entraînement et une tenue limitée.§!"
 light_light_walker_tank_battalion: "Bataillon de marcheurs légers (léger)"
 light_light_walker_tank_battalion_desc: "Un élément de marcheurs légers réduit offre une petite force de plateformes marcheuses anti-blindés pour un renforcement ciblé.\n\n§GIndice du concepteur : les marcheurs légers sous-effectif ajoutent une puissance anti-blindés concentrée avec moins de largeur de combat et moins de châssis chasseurs de chars. Utilisez-les pour renforcer des divisions contre des cibles durcies, mais ils conservent une faible organisation, un long entraînement et un rôle étroit contre une opposition molle.§!"
 light_heavy_walker_tank_battalion: "Bataillon de marcheurs lourds (légers)"
 light_heavy_walker_tank_battalion_desc: "Un élément de marcheurs lourds réduit offre des plateformes marcheuses équipées d'artillerie sans l'empreinte d'un bataillon complet.\n\n§GIndice du concepteur : les marcheurs lourds sous-effectif ajoutent une puissance de feu d'artillerie blindée avec moins de largeur de combat et moins de châssis qu'un élément complet. Utilisez-les pour un soutien de feu compact, mais leur faible organisation, long entraînement et châssis d'artillerie spécialisés les rendent encore coûteux.§!"
 hq_support_company: "Société de support du siège social"
 hq_support_company_desc: "La compagnie de soutien du QG fournit l'état-major, les communications, le transport et la sécurité nécessaires pour diriger une formation de campagne.\n\n§GIndice du concepteur : la compagnie de soutien du QG améliore les bonus qu'un chef déployé gagne de la compétence. C'est le choix polyvalent pour un modèle de QG d'armée, mais elle ajoute largeur de combat, main-d'œuvre et équipement sans bonus de combat ou opérationnels spécialisés.§!\n§GIndice concepteur : la compagnie d'appui QG améliore les bonus qu'un chef déployé gagne de la compétence. C'est le choix polyvalent pour un modèle de QG d'armée, mais elle ajoute largeur de combat, effectifs et équipement sans bonus de combat ou opérationnels spécialisés.§!"
 hq_engineer: "Compagnie d'ingénieurs du siège social"
 hq_engineer_desc: "La compagnie du génie du QG coordonne percées, fortification et travaux de mobilité à travers la formation.\n\n§GIndice du concepteur : la compagnie du génie du QG améliore les dégâts aux fortifications et la défense d'invasion amphibie tout en ajoutant retranchement et percée. Utilisez-la pour les opérations de siège, défensives ou côtières, mais elle ajoute de la largeur de combat et offre une puissance de feu directe limitée.§!"
 hq_recon: "Compagnie de reconnaissance du QG"
 hq_recon_desc: "La compagnie de reconnaissance du QG recueille et distribue les informations de terrain et d'ennemi pour l'état-major.\n\n§GIndice du concepteur : la compagnie de reconnaissance du QG améliore la reconnaissance et l'expérience de trait de terrain du chef déployé tout en ajoutant de la reconnaissance au QG. Utilisez-la dans des commandements mobiles ou axés sur le terrain, mais elle ajoute de la largeur de combat et peu de puissance de combat directe.§!\n§GIndice concepteur : la compagnie de reconnaissance QG améliore reconnaissance et expérience de trait de terrain pour le chef déployé tout en ajoutant de la reconnaissance au QG. Utilisez-la dans les commandements mobiles ou axés sur le terrain, mais elle ajoute de la largeur de combat et peu de puissance de combat directe.§!"
 hq_maintenance: "Société de maintenance du siège social"
 hq_maintenance_desc: "La compagnie de maintenance du QG coordonne récupération, réparation et récupération d'équipement à travers la formation.\n\n§GIndice du concepteur : la compagnie de maintenance du QG réduit l'attrition et améliore la capture d'équipement pour le chef déployé tout en ajoutant fiabilité et capture d'équipement au QG. Utilisez-la pour des commandements lourds en équipement, mais elle ajoute de la largeur de combat et a de faibles statistiques de combat.§!\n§GIndice concepteur : la compagnie de maintenance QG réduit l'attrition et améliore la capture d'équipement pour le chef déployé tout en ajoutant fiabilité et capture d'équipement au QG. Utilisez-la pour les commandements lourds en matériel, mais elle ajoute de la largeur de combat et a de faibles statistiques de combat.§!"
 hq_logistics: "Société de logistique du siège social"
 hq_logistics_desc: "La compagnie logistique du QG planifie la distribution du ravitaillement et le mouvement du carburant pour la formation.\n\n§GIndice du concepteur : la compagnie logistique du QG réduit la consommation de ravitaillement pour le chef déployé et la consommation de carburant pour le QG. Utilisez-la sur des fronts contraints en ravitaillement ou intensifs en carburant, mais elle ajoute de la largeur de combat et peu de puissance de combat.§!"
 hq_naval_liaison: "Compagnie de liaison navale du QG"
 hq_naval_liaison_desc: "Les équipes de liaison navale relient le QG aux commandants de flotte et aux réseaux de soutien navire-terre.\n\n§GIndice du concepteur : la compagnie de liaison navale du QG améliore bombardement côtier, invasion amphibie et grâce de ravitaillement marine pour le chef déployé. Utilisez-la pour les campagnes côtières et amphibies, mais elle ajoute de la largeur de combat et offre peu de bénéfice loin à l'intérieur des terres.§!"
 hq_air_liaison: "Compagnie de liaison aérienne du QG"
 hq_air_liaison_desc: "Les équipes de liaison aérienne coordonnent le QG avec les formations de transport, d'appui rapproché et de supériorité aérienne.\n\n§GIndice du concepteur : la compagnie de liaison aérienne du QG raccourcit la préparation d'invasion aérienne et améliore la résistance à l'appui aérien rapproché et le bénéfice de combat de la supériorité aérienne. Utilisez-la là où la coordination air-sol compte, mais elle ajoute de la largeur de combat et pas de puissance de feu terrestre substantielle.§!"
 hq_specops: "Compagnie des opérations spéciales du QG"
 hq_specops_desc: "L'état-major des opérations spéciales coordonne les unités d'élite opérant au-delà des réseaux normaux de ravitaillement et de commandement.\n\n§GIndice du concepteur : la compagnie d'opérations spéciales du QG améliore attaque, défense et performance hors ravitaillement des forces spéciales pour le chef déployé sans ajouter de largeur de combat. Utilisez-la pour commander des formations d'élite, mais son coût de main-d'œuvre et d'équipement est gaspillé sur des forces conventionnelles.§!\n§GIndice concepteur : la compagnie d'opérations spéciales QG améliore attaque, défense et performance hors ravitaillement des forces spéciales pour le chef déployé sans ajouter de largeur de combat. Utilisez-la pour commander des formations d'élite, mais son coût en effectifs et équipement est gaspillé sur des forces conventionnelles.§!"
 hq_mech_desc: "Un état-major d'opérations mécanisées coordonne les véhicules de transport de troupes et leur infanterie embarquée à travers la formation.\n\n§GIndice du concepteur : la compagnie d'infanterie mécanisée du QG améliore attaque et défense mécanisées pour le chef déployé. Utilisez-la pour commander des formations mécanisées, mais elle exige des VTT et un équipement de soutien substantiel tout en offrant peu de bénéfice aux autres types d'unités.§!\n§GIndice concepteur : la compagnie d'infanterie mécanisée QG améliore attaque et défense mécanisées pour le chef déployé. Utilisez-la pour commander des formations mécanisées, mais elle exige des VTT et un équipement d'appui substantiel tout en offrant peu d'avantage aux autres types d'unités.§!"
 hq_mot_desc: "Un état-major d'opérations motorisées coordonne l'infanterie portée et le mouvement rapide de la formation.\n\n§GIndice du concepteur : la compagnie d'infanterie motorisée du QG améliore attaque et défense motorisées pour le chef déployé. Utilisez-la pour commander des formations motorisées, mais ses coûts de véhicules utilitaires et d'équipement offrent peu de valeur aux forces à pied ou blindées.§!"
 hq_armor_desc: "Un état-major d'opérations blindées coordonne chars, infanterie blindée et leurs éléments de soutien à travers la formation.\n\n§GIndice du concepteur : la compagnie de cavalerie lourde du QG améliore attaque et défense blindées pour le chef déployé. Utilisez-la pour commander des forces lourdes en chars, mais ses VCI et larges exigences d'équipement en font l'un des choix de soutien de QG les plus coûteux.§!"
 hq_infantry: "Détachement de sécurité d'infanterie du QG"
 hq_infantry_desc: "Un détachement d'infanterie légère protège le personnel du QG, les communications et les postes de commandement contre une attaque directe.\n\n§GIndice du concepteur : le détachement de sécurité d'infanterie du QG offre une haute force et organisation à un coût d'équipement modeste pour un QG d'armée. Utilisez-le comme ligne de sécurité de base, mais il ajoute de la largeur de combat, n'a pas de bonus de terrain et a des statistiques de combat réduites par rapport à l'infanterie de première ligne ordinaire.§!\n§GIndice concepteur : le détachement de sécurité d'infanterie QG offre une haute force et organisation à un coût d'équipement modeste pour un QG d'armée. Utilisez-le comme ligne de sécurité de base, mais il ajoute de la largeur de combat, manque de bonus de terrain et a des statistiques de combat réduites par rapport à l'infanterie de première ligne ordinaire.§!"
 hq_Mot_Inf_Bat_desc: "Un détachement d'infanterie motorisée offre une sécurité mobile au personnel du QG et aux postes de commandement.\n\n§GIndice du concepteur : le détachement de sécurité d'infanterie motorisée du QG ajoute vitesse, une organisation solide et de fortes performances en collines et urbain à un QG d'armée. Utilisez-le pour une formation de commandement mobile, mais les véhicules ajoutent un coût et il est faible à travers déserts, jungles, marais, rivières et attaques amphibies.§!"
 hq_Mech_Inf_Bat_desc: "Un détachement d'infanterie mécanisée protège un QG mobile avec des véhicules de transport de troupes.\n\n§GIndice du concepteur : le détachement de sécurité d'infanterie mécanisée du QG ajoute une mobilité blindée et une forte défense en collines et villes. Utilisez-le pour protéger un QG d'armée mécanisé, mais les VTT sont coûteux et l'unité souffre de pénalités sévères en montagnes, jungles, marais, rivières et attaques amphibies.§!\n§GIndice concepteur : le détachement de sécurité d'infanterie mécanisée QG ajoute une mobilité blindée et une forte défense en collines et villes. Utilisez-le pour protéger un QG d'armée mécanisé, mais les VTT sont coûteux et l'unité subit de lourdes pénalités en montagnes, jungles, marais, rivières et attaques amphibies.§!"
 hq_Arm_Inf_Bat_desc: "Un détachement d'infanterie blindée utilise des véhicules de combat d'infanterie pour offrir une sécurité lourde à un QG.\n\n§GIndice du concepteur : le détachement de sécurité blindée du QG offre une protection basée sur VCI et des performances en terrain ouvert pour un QG d'armée. Utilisez-le avec des commandements blindés, mais il a une organisation inférieure, un coût d'équipement élevé et de sévères pénalités en terrain difficile et opérations amphibies.§!"
 hq_Mech_Marine_Bat_desc: "Un détachement de marines mécanisées protège un QG pendant les opérations navire-terre et côtières.\n\n§GIndice du concepteur : le détachement de sécurité marine du QG combine mobilité blindée et forte attaque amphibie et de rivière pour un QG d'armée. Utilisez-le dans des commandements marines et des opérations de tête de pont, mais son coût de VTT et ses pénalités de terrain difficile le rendent inefficace pour les campagnes à l'intérieur des terres.§!\n§GIndice concepteur : le détachement de sécurité marine QG combine mobilité blindée et forte attaque amphibie et de rivière pour un QG d'armée. Utilisez-le dans les commandements de marines et les opérations de tête de pont, mais son coût en VTT et ses pénalités en terrain accidenté le rendent inefficace pour les campagnes intérieures.§!"
 hq_Mech_Air_Inf_Bat_desc: "Un détachement mécanisé léger protège les QG affectés aux formations aéroportées et déployées rapidement.\n\n§GIndice du concepteur : le détachement de sécurité d'assaut aérien du QG offre une sécurité blindée parachutable avec un QG d'armée. Utilisez-le pour des formations de commandement aéroporté, mais ses coûts de VTT et d'équipement de soutien sont élevés et il souffre de pénalités majeures en terrain difficile, rivières et attaques amphibies.§!\n§GIndice concepteur : le détachement de sécurité d'assaut aérien QG offre une sécurité blindée qui peut être parachutée avec un QG d'armée. Utilisez-le pour les formations de commandement aéroporté, mais ses coûts en VTT et équipement d'appui sont élevés et il subit de lourdes pénalités en terrain difficile, rivières et attaques amphibies.§!"
 Mech_Militia_Bat: "Milice mécanisée"
 Mech_Militia_Bat_desc: "Bataillon de milice avec véhicules de transport de troupes. Les unités de milice se caractérisent par moins d'équipement lourd et de kits de communication que l'infanterie normale. Cela les rend très mobiles et efficaces en mauvais terrain, mais elles fondent vite en terrain plat face à un adversaire blindé.\n\n§GIndice du concepteur : la milice mécanisée échange encore l'économie contre la vitesse et une plus grande dureté. Utilisez-la pour une sécurité mobile plus lourde abordable et pour pousser contre l'infanterie à pied et l'artillerie, mais ses faibles statistiques de combat par rapport à la mécanisée professionnelle l'empêchent d'affronter une armée bien équipée.§!\n§GIndice concepteur : la milice mécanisée échange encore l'économie contre la vitesse et une plus grande dureté. Utilisez-les pour une sécurité mobile plus lourde abordable et pour pousser contre l'infanterie à pied et l'artillerie, mais leurs statistiques de combat faibles face à la mécanisée professionnelle les empêchent d'affronter une armée bien équipée.§!"