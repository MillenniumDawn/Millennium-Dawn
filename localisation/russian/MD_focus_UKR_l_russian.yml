 ukraine_modernize_sov_equipment_btr_60_modernization_bulgaria_btr_60d: "Запросить старые §YБТР-60ПБ§!: [BUL.GetNameWithFlag]"
 ukraine_modernize_sov_equipment_btr_60_modernization_bulgaria_btr_60d_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr60d_for_tooltip\n\n\n\n\n\n\n\n\n§WВойна с [SOV.GetFlag] Россией перемалывает нашу бронетехнику. [BUL.GetFlag] Болгария всё ещё держит на хранении старые §YБТР-60ПБ§! и готова передать их в качестве военной помощи. Мы можем ввести их в строй как есть или провести капитальный ремонт у себя и заменить изношенные бензиновые двигатели §YГАЗ-40П§! двумя [GER.GetFlag] немецкими дизелями §LDeutz§! §YBF4M2012§! с новой коробкой передач. Эта модернизация — §YБТР-60Д§!.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization.6.name: "Первые БТР-60ПБ из Болгарии"
 ukraine_modernize_sov_equipment_btr_60_modernization.6.desc: "Мы можем попросить у §YБолгарии§! первые §Y20§! §YБТР-60ПБ§! с её складов. Они старые и изношенные, но всё ещё плавают, ездят и могут перевозить отделение. Если §YБолгария§! согласится, мы сможем сразу отправить их на фронт или сначала провести капремонт и установить дизели §YDeutz§!."
 ukraine_modernize_sov_equipment_btr_60_modernization.6.a: "Ввести их в строй как есть"
 ukraine_modernize_sov_equipment_btr_60_modernization.6.b: "Переделать их в §YБТР-60Д§!"
 ukraine_modernize_sov_equipment_btr_60_modernization.6.c: "У Болгарии больше нет лишних"
 ukraine_modernize_sov_equipment_btr_60_modernization.7.name: "Поставлены первые БТР-60Д"
 ukraine_modernize_sov_equipment_btr_60_modernization.7.desc: "Наши ремонтные заводы завершили первые §Y20§! §YБТР-60Д§!. Два дизеля Deutz BF4M2012 по 102 л. с. заменили старые бензиновые ГАЗ-40П, поэтому машины стали надёжнее и немного мощнее. Первые из них отправляются в механизированную бригаду."
 ukraine_modernize_sov_equipment_btr_60_modernization.7.a: "Отправить их на фронт"
 ukraine_modernize_sov_equipment_btr_60_modernization.8.name: "Следующая партия БТР-60ПБ из Болгарии"
 ukraine_modernize_sov_equipment_btr_60_modernization.8.desc: "Мы можем попросить у §YБолгарии§! ещё §Y40§! §YБТР-60ПБ§! с её складов. Мы снова можем использовать их как есть или переделать в §YБТР-60Д§!. Наши заводы уже знают эту работу, так что всё пойдёт быстрее. Сначала должна согласиться §YБолгария§!."
 ukraine_modernize_sov_equipment_btr_60_modernization.8.a: "Ввести их в строй как есть"
 ukraine_modernize_sov_equipment_btr_60_modernization.8.b: "Переделать их в §YБТР-60Д§!"
 ukraine_modernize_sov_equipment_btr_60_modernization.8.c: "$ukraine_modernize_sov_equipment_btr_60_modernization.6.c$"
 ukraine_modernize_sov_equipment_btr_60_modernization.9.name: "Поставлена партия БТР-60Д"
 ukraine_modernize_sov_equipment_btr_60_modernization.9.desc: "Ещё §Y40§! §YБТР-60Д§! вышли с наших ремонтных заводов с новыми дизелями Deutz и коробками передач."
 ukraine_modernize_sov_equipment_btr_60_modernization.9.a: "Отправить их на фронт"
