 north_korea_focus: "Árvore de foco na Coreia do Norte"
 NKO_land_reclamation: "Reclamação de Terra"
 NKO_land_reclamation_desc: "Recuperar terras para uso agrícola e industrial expandirá nossa base de recursos e apoiará o crescimento econômico. Empreenderemos projetos ambiciosos para converter terras áridas em áreas produtivas."
 NKO_infrastructure_development: "Desenvolvimento de Infraestrutura"
 NKO_infrastructure_development_desc: "Desenvolver nossa infraestrutura é crucial para o crescimento econômico e o desenvolvimento nacional. Investiremos em redes de transporte, produção de energia e sistemas de comunicação para criar uma base sólida para a prosperidade futura."
