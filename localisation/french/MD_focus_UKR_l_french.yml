 ukraine_develop_btr4.7.desc: "Nous pouvons choisir le moteur souhaité pour le BTR-4 VCI.\n\n§Y3TD-3§! : moteur diesel ukrainien 3 cylindres à 2 temps développant 500 ch.\n\n§YDeutz BF6M1015CP§! : moteur diesel allemand 6 cylindres développant 442 ch.\n\n§YIveco Cursor 10-430§! : moteur diesel italien 6 cylindres développant 430 ch."
