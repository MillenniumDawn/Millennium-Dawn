 genetics_1: "Empreintes ADN"
 genetics_1_desc: "L'empreinte génétique a été l'une des plus grandes inventions du XXe siècle. Elle a permis des progrès considérables en police, profilage et bien plus dans le domaine génétique."
 genetics_2: "OGM moderne"
 genetics_2_desc: "Un organisme génétiquement modifié (OGM) est un organisme altéré génétiquement utilisable dans de nombreux domaines, par exemple cultures, bétail, science et bien d'autres formes de culture."
 genetics_3: "Thérapie génique"
 genetics_3_desc: "La thérapie génique consiste à sélectionner génétiquement les traits désirés et à écarter les indésirables."
 genetics_4: "Cultures génétiquement modifiées"
 genetics_4_desc: "Les cultures génétiquement modifiées comme le maïs, les tomates ou d'autres plantes sont élevées avec des avantages plus forts que leurs homologues : meilleure résistance aux insectes, et bien plus."
 genetics_5: "Projet Génome Humain"
 genetics_5_desc: "Le séquençage du génome humain a été important pour cartographier l'une des compositions génétiques les plus complexes de la Terre. Cartographier cet océan de connaissances peut encore faire exploser notre savoir génétique."
 genetics_6: "Pesticides ciblant les gènes"
 genetics_6_desc: "Des pesticides ciblant les gènes visent des gènes spécifiques chez les ravageurs, ou des phéromones sécrétées par les plantes, pour empêcher insectes et parasites de les endommager."
 genetics_7: "Vie synthétique"
 genetics_7_desc: "Les avancées en technologie génétique nous ont permis de créer la vie de toutes pièces."
 genetics_8: "Clonage sécurisé"
 genetics_8_desc: "Le clonage a toujours été une affaire délicate. Il est aussi assez dangereux pour les clones. Avant cette percée, la plupart ne survivaient pas à la petite enfance."
 genetics_9: "Traitement CRISPR"
 genetics_9_desc: "Le traitement CRISPR est une technique d'édition génétique pour retirer des mutations des cellules."
 genetics_10: "Cultures génétiquement modifiées CRISPR"
 genetics_10_desc: "Les cultures CRISPR sont similaires au traitement CRISPR chez les animaux et les humains. Cependant, dans les cultures CRISPR, on exagère les gènes souhaitables ou on retire les traits indésirables."
 genetics_11: "Expériences CRISPR humaines"
 genetics_11_desc: "Il est temps de commencer à expérimenter sur l'humain avec CRISPR."
 genetics_12: "Humains génétiquement modifiés"
 genetics_12_desc: "Modifier génétiquement les humains pour les rendre plus forts, meilleurs, plus rapides et plus sains qu'avant peut nous aider à évoluer."
 genetics_13: "Surhumains"
 genetics_13_desc: "Modifier les humains a transcendé la façon dont notre espèce se voit désormais."
 genetics_14: "Clonage surhumain"
 genetics_14_desc: "Pas assez de superhumains ? Nous pouvons désormais les cloner !"
 genetics_15: "Adaptabilité interplanétaire"
 genetics_15_desc: "Jusqu'où pousser l'adaptabilité superhumaine ? Nous pouvons désormais nous installer sur d'autres planètes et nous adapter à des environnements autrefois dangereux."
 genetics_16: "Humains de l'espace"
 genetics_16_desc: "Notre race a atteint le sommet de l'évolution génétique, capable de voyager dans l'espace, immunisée contre le froid spatial et le rayonnement cosmique."
 crispr_1: "CRISPR"
 crispr_1_desc: "CRISPR est une technique d'édition génétique surtout utilisée pour les patients cancéreux et la R&D, comme méthode pour cibler et tuer le cancer d'un patient."
 crispr_2: "Édition du gène Cas9"
 crispr_2_desc: "Cas9 est une protéine dalton du système immunitaire contre virus à ADN et plasmides. Éditer cette protéine peut améliorer la défense naturelle et a un usage étendu en génie génétique."
 crispr_3: "TraceARN"
 crispr_3_desc: "L'ARN CRISPR trans-activateur est un petit ARN trans-codé, d'abord découvert chez le pathogène humain Streptococcus pyogenes. L'ARN aide à fonder une défense contre virus et plasmides."
 crispr_4: "Expérimentation du traitement CRISPR"
 crispr_4_desc: "L'expérimentation CRISPR nous permet d'améliorer le processus d'édition des gènes."
 electrification_11: "Électrification des mines profondes"
 electrification_11_desc: "L'électrification des mines profondes remplace haulage diesel, forage, soutien de ventilation et machines auxiliaires par des systèmes électriques à batterie, assistés par trolley et alimentés par le réseau, accroissant la demande électrique tout en réduisant carburant, chaleur et émissions souterraines."
 electrification_12: "Révolution en orbite basse"
 electrification_12_desc: "L'infrastructure d'orbite basse adopte stations solaires, remorqueurs orbitaux électriques et engins de service automatisés pour soutenir relocalisation de satellites, retrait de débris et transfert de cargo avec bien moins de propergol chimique."
 electrification_13: "Repenser les missions en orbite haute"
 electrification_13_desc: "Les missions d'orbite haute utilisent une propulsion électrique haute puissance et des systèmes autonomes d'élévation d'orbite pour déplacer satellites et cargo vers GEO, l'espace lunaire et les points de staging lointains avec moins de carburant."
 electrification_14: "Les voyages spatiaux réinventés"
 electrification_14_desc: "Le vol spatial avancé étend l'usage de la propulsion électrique, des systèmes d'énergie haute efficacité et du stockage longue durée pour soutenir des voyages soutenus au-delà de l'orbite terrestre tout en réduisant la masse de carburant requise pour cargo et exploration."
 utility_scale_battery_storage_6: "Optimisation du stockage quantique"
 utility_scale_battery_storage_6_desc: "Le stockage quantique a encore de la marge d'amélioration, permettant une accumulation d'énergie plus dense dans des cellules quantiques hautement efficaces."
 utility_scale_battery_storage_7: "Maximisation quantique"
 utility_scale_battery_storage_7_desc: "La recherche sur le stockage d'énergie a atteint son sommet, poussant les limites jusqu'à presque l'impossible physique."
 fuel_refining7: "Raffinage du carburant VII"
 fuel_refining7_desc: "Des changements supplémentaires dans la distillation du biodiesel et du carburant général nous permettent d'obtenir plus de carburant brûlant plus proprement et plus efficacement."
 fuel_refining8: "Raffinage du carburant VIII"
 fuel_refining8_desc: "L'application d'une analyse renforcée par IA du procédé booste l'efficacité."
 fuel_refining9: "Raffinage du carburant IX"
 fuel_refining9_desc: "Le micromanagement par IA du raffinage réduit nettement le gaspillage de ressources."
 fuel_refining10: "Raffinage du carburant X"
 fuel_refining10_desc: "Le calcul quantique et l'analyse en temps réel du raffinage augmentent la pureté du carburant."
 fuel_refining11: "Raffinage du carburant XI"
 fuel_refining11_desc: "Une percée en recherche chimique avec l'aide de la superintelligence permet de produire du carburant à efficacité maximale."
 construction10: "Construction X"
 construction10_desc: "Les chantiers hautement automatisés utilisent planification par IA, assemblage robotisé et logistique intelligente pour coordonner machines, matériaux et ouvriers, améliorant fortement la vitesse des grands ouvrages d'infrastructure."
 construction11: "Construction XI"
 construction11_desc: "La construction de nouvelle génération intègre matériaux auto-surveillants, composants structurels adaptatifs et systèmes de réparation automatisés, permettant aux installations critiques de détecter les dégâts, renforcer les points faibles et rester opérationnelles sous contrainte."
 construction12: "Chantier XII"
 construction12_desc: "La construction future utilise des essaims de constructeurs autonomes, des matériaux programmables et des systèmes structurels conçus par IA pour assembler rapidement des mégaprojets résilients, des installations militaires durcies et des complexes industriels avancés."
 excavation10: "Fouilles X"
 excavation10_desc: "L'excavation assistée par IA utilise géologie prédictive, schémas de forage automatisés et flux de traitement optimisés pour augmenter la production de gisements complexes tout en réduisant pertes de matériau et arrêts d'équipement."
 excavation11: "Fouilles XI"
 excavation11_desc: "Les systèmes robotiques d'extraction profonde utilisent foreuses autonomes, chargeuses, drones de cartographie et centres d'opération à distance pour exploiter des gisements plus profonds et plus dangereux avec moins de travailleurs exposés."
 excavation12: "Fouilles XII"
 excavation12_desc: "L'excavation future utilise des flottes robotiques dirigées par IA, une cartographie précise des ressources et une séparation avancée des matériaux pour récupérer métaux, minéraux et ressources stratégiques de gisements épuisés, complexes ou en environnement extrême."
 agriculture_10: "Nanorobots AGI"
 agriculture_10_desc: "Des AGI agricoles commandent une légion de nanorobots qui contrôlent l'état des cultures et combattent les ravageurs."
 agriculture_11: "Habitats agricoles artificiels"
 agriculture_11_desc: "Le secteur agricole est révolutionné par de grandes serres opérées presque entièrement par l'intelligence artificielle, permettant de produire effectivement n'importe quelle culture n'importe où sur la planète."
 agriculture_12: "Supercomplexes agricoles"
 agriculture_12_desc: "Le développement ultérieur des habitats agricoles a étendu le concept à des mégastructures capables de concentrer toute la production d'une nation en un seul lieu."
 agriculture_13: "Fermes spatiales"
 agriculture_13_desc: "Nous pouvons déplacer les complexes agricoles dans l'espace, sans les contraintes d'espace de la planète. Cela permet aussi de soutenir facilement l'exploration spatiale et de nous installer à travers l'univers."
 tech_diesel_power_systems_5: "Moteurs diesel hyper-avancés"
 tech_diesel_power_systems_5_desc: "Les systèmes diesel hyperavancés utilisent combustion multi-carburants, carburants synthétiques et contrôle moteur assisté par IA pour maintenir l'endurance tout en réduisant émissions, signature thermique et dépendance à la logistique de carburant conventionnelle."
 tech_diesel_power_systems_6: "Moteurs diesel ultra-avancés"
 tech_diesel_power_systems_6_desc: "Les groupes motopropulseurs ultra-avancés dérivés du diesel combinent moteurs à carburants alternatifs, propulsion électrique intégrée, stockage d'énergie et diagnostics autonomes pour fournir une puissance efficace aux flottes longue portée et aux systèmes de guerre énergivores."
 tech_power_systems_5: "Moteurs à turbine à réaction hyper-avancés"
 tech_power_systems_5_desc: "Les turbines hyperavancées utilisent un contrôle de combustion adaptatif, une meilleure efficacité thermique et une propulsion électrique intégrée pour fournir à la fois puissance de manœuvre à haute vitesse et grande sortie électrique pour les systèmes de navire énergivores."
 tech_power_systems_6: "Moteurs à turbine à réaction ultra-avancés"
 tech_power_systems_6_desc: "Les groupes turbine-électrique ultra-avancés combinent turbines multi-carburants, récupération de chaleur avancée, diagnostics autonomes et distribution de puissance intégrée pour propulser les bâtiments futurs et soutenir armes à énergie dirigée, capteurs et charges de propulsion."
 tech_nuclear_power_systems_5: "Réacteurs nucléaires de surface hyper-avancés"
 tech_nuclear_power_systems_5_desc: "Les réacteurs nucléaires de surface hyperavancés intègrent conceptions compactes, systèmes de refroidissement avancés et distribution électrique à l'échelle du navire, réduisant la maintenance tout en soutenant radars haute énergie, guerre électronique et armes à énergie dirigée."
 tech_nuclear_power_systems_6: "Réacteurs nucléaires de surface ultra-avancés"
 tech_nuclear_power_systems_6_desc: "Les réacteurs nucléaires de surface ultra-avancés combinent cœurs à combustible pour la vie du navire, suivi autonome et systèmes de puissance intégrés haute capacité pour fournir une propulsion fiable et une sortie électrique extrême aux futurs bâtiments capitaux."
 tech_fusion_power_systems_1: "Moteurs de fusion modernes"
 tech_fusion_power_systems_1_desc: "Les premiers systèmes de fusion navals appliquent des conceptions expérimentales de réacteur compact et un contrôle plasma haute efficacité pour fournir une immense sortie électrique, offrant une voie possible au-delà des réacteurs à fission conventionnels et de la propulsion fossile."
 tech_fusion_power_systems_2: "Moteurs de fusion de pointe"
 tech_fusion_power_systems_2_desc: "Les moteurs à fusion de pointe intègrent confinement magnétique plus fort, supraconducteurs avancés et distribution fusion-électrique, permettant aux bâtiments de soutenir propulsion, capteurs et armes haute énergie avec une moindre dépendance au carburant."
 tech_fusion_power_systems_3: "Moteurs à fusion hyper-avancés"
 tech_fusion_power_systems_3_desc: "Les moteurs à fusion hyperavancés utilisent cœurs de réacteur compact, contrôle plasma autonome et systèmes de puissance intégrés à l'échelle du navire pour fournir une propulsion de longue endurance et des réserves électriques extrêmes aux futures forces navales."
 tech_fire_control_5: "Contrôle radar de missiles augmenté hyper-avancé"
 tech_fire_control_5_desc: "La conduite de tir radar missiles hyperavancée fusionne radar de bord, capteurs externes, drones, satellites et liaisons de données de flotte en un tableau d'engagement partagé, permettant aux bâtiments de pister des attaques missiles complexes avec plus de vitesse et de précision."
 tech_fire_control_6: "Contrôle radar de missiles augmenté ultra-avancé"
 tech_fire_control_6_desc: "La conduite de tir radar missiles ultra-avancée utilise gestion de bataille prédictive, priorisation des menaces à vitesse machine et coordination automatisée des intercepteurs pour défendre contre attaques par saturation, armes manœuvrantes et systèmes de frappe hypersoniques."
 tech_combat_radar_7: "Radar VIII"
 tech_combat_radar_7_desc: "Les réseaux radar navals distribués combinent réseaux de bord, drones, satellites et capteurs externes en un système de détection partagé, permettant aux flottes de pister des menaces au-delà de l'horizon radar d'un seul bâtiment."
 tech_combat_radar_8: "Radar IX"
 tech_combat_radar_8_desc: "Les radars de combat futurs utilisent traitement de signal assisté par IA, fusion de capteurs adaptative et pistage prédictif pour détecter, classer et engager des menaces furtives, manœuvrantes et hypersoniques dans des espaces de bataille contestés."
 tech_radar_jammer_5: "Brouillage radar V"
 tech_radar_jammer_5_desc: "Les suites d'attaque électronique de bord avancées utilisent analyse de signal assistée par IA, génération de formes d'onde adaptative et coordination au niveau de la flotte pour contrer les réseaux radar modernes. Elles peuvent analyser les émissions ennemies, créer de fausses cibles déceptives et perturber radars adaptatifs et autodirecteurs de missiles en temps réel."
 tech_combat_sonar_7: "Sonar VIII"
 tech_combat_sonar_7_desc: "Les systèmes de surveillance sous-marine distribués utilisent capteurs autonomes, modélisation environnementale et analyse acoustique assistée par IA pour pister sous-marins silencieux, drones sous-marins et torpilles sur de vastes zones océaniques."
 tech_combat_sonar_8: "Sonar IX"
 tech_combat_sonar_8_desc: "Les sonars futurs relient bâtiments de guerre, plateformes sans pilote, réseaux de fonds marins, modèles océanographiques et réseaux de données de flotte en un système prédictif de guerre sous-marine pour détecter, classer et chasser les menaces en eaux contestées."
 tech_naval_recon_drones_5: "Drones de reconnaissance navale V"
 tech_naval_recon_drones_5_desc: "Les groupes de drones navals en réseau coordonnent aéronefs sans pilote, engins de surface et véhicules sous-marins pour surveiller de vastes zones maritimes, partager les contacts à travers la flotte et raccourcir les délais capteur-tireur contre navires, sous-marins, aéronefs et missiles."
 tech_naval_recon_drones_6: "Drones de reconnaissance navale VI"
 tech_naval_recon_drones_6_desc: "Les réseaux de reconnaissance maritime autonomes utilisent classification assistée par IA, détection passive et routage coopératif pour pister les forces ennemies tout en limitant les émissions, évitant l'interception et s'adaptant à la guerre électronique."
 tech_naval_recon_drones_7: "Drones de reconnaissance navale VII"
 tech_naval_recon_drones_7_desc: "Les drones de recon navals futurs forment des réseaux de surveillance autonomes distribués, reliant capteurs aériens, de surface, sous-marins et de flotte pour maintenir la garde des cibles à travers des océans contestés et soutenir un engagement longue portée rapide."
 tech_rail_battery_3: "Batterie de canons à rail III"
 tech_point_defense_system_7: "CIWS VII"
 tech_point_defense_system_7_desc: "Les systèmes CIWS hyperavancés utilisent une conduite de tir assistée par IA, un guidage capteur coopératif et des magasins de munitions prêtes plus profonds pour coordonner plusieurs affûts lors d'attaques par saturation et de menaces d'essaims à courte portée."
 tech_point_defense_system_8: "CIWS VIII"
 tech_point_defense_system_8_desc: "Les canons CIWS ultra-avancés intègrent une conduite de tir prédictive, des munitions intelligentes, une priorisation autonome des cibles et une fusion capteurs à l'échelle du navire dans une couche finale adaptative de défense navale à canons."
 tech_anti_drone_laser_3: "Lasers de défense ponctuelle embarqués III"
 tech_anti_drone_laser_3_desc: "Les lasers embarqués avancés utilisent des émetteurs de plus haute puissance, un contrôle de faisceau adaptatif et une compensation atmosphérique améliorée pour engager drones, munitions guidées et autodirecteurs de missiles avec plus de portée et de fiabilité. Des systèmes d'alimentation intégrés permettent des tirs répétés sans épuiser rapidement les magasins conventionnels."
 tech_anti_drone_laser_4: "Lasers de défense ponctuelle embarqués IV"
 tech_anti_drone_laser_4_desc: "Les défenses laser embarquées hyperavancées relient plusieurs émetteurs, une priorisation des cibles assistée par IA et une gestion de l'énergie à l'échelle du navire en un bouclier à énergie dirigée coordonné. Ces systèmes peuvent endommager rapidement capteurs, cellules et gouvernes lors d'attaques par saturation de drones et de missiles."
 tech_turret_missiles_surface_7: "Missiles anti-navires 2060"
 tech_turret_missiles_surface_7_desc: "Les systèmes de missiles antinavires ultra-avancés utilisent le vol hypersonique, des autodirecteurs multispectraux, une discrimination de cibles assistée par IA et un guidage résistant aux contre-mesures pour vaincre les groupes de surface protégés et les menaces sous-marines insaisissables."
 tech_turret_missiles_surface_8: "Missiles anti-navires 2075"
 tech_turret_missiles_surface_8_desc: "Les systèmes de missiles antinavires de nouvelle génération utilisent une autonomie adaptative, une coordination de salves coopérative et une fusion capteurs en temps réel pour identifier, prioriser et attaquer les navires ennemis dans les espaces de bataille maritimes contestés."
 tech_turret_missiles_drone_4: "Modules d'essaim naval IV"
 tech_turret_missiles_drone_4_desc: "Les modules d'essaim de pointe lancent des drones navals autonomes à sens unique qui partagent les données capteurs, attribuent les cibles et adaptent leurs routes d'attaque même sous communications dégradées. En mélangeant leurres, brouilleurs et charges de frappe dans la même salve, ils peuvent perturber et saturer les défenses aériennes ennemies tout en pressant les navires depuis plusieurs directions."
 tech_turret_missiles_aa_7: "Missiles à cellule roulante 2060"
 tech_turret_missiles_aa_7_desc: "Les lanceurs RAM de pointe utilisent une évaluation des menaces assistée par IA, un guidage résistant aux contre-mesures et un guidage capteur en réseau contre les menaces à haute vitesse et à faible observabilité."
 tech_turret_missiles_aa_8: "Missiles à cellule roulante 2075"
 tech_turret_missiles_aa_8_desc: "Les systèmes RAM de nouvelle génération combinent autodirecteurs adaptatifs, conduite de tir prédictive et réseaux d'engagement coopératif pour la défense à courte portée contre missiles, drones et aéronefs."
 tech_vls_surface_7: "Missiles d'attaque de surface VLS 2060"
 tech_vls_surface_7_desc: "Les armes de frappe VLS ultra-avancées utilisent des profils de vol hypersoniques ou hautement supersoniques, un guidage adaptatif et une discrimination de cibles assistée par IA pour vaincre les défenses durcies et frapper des cibles critiques à portée extrême."
 tech_vls_surface_8: "Missiles d'attaque de surface VLS 2075"
 tech_vls_surface_8_desc: "Les missiles VLS d'attaque de surface de nouvelle génération combinent planification de mission autonome, fusion capteurs en temps réel et coordination de salves coopérative pour saturer les défenses et délivrer des feux navals précis dans les théâtres contestés."
 tech_vls_aa_7: "Missiles surface-air à lancement vertical 2060"
 tech_vls_aa_7_desc: "Les systèmes de défense aérienne VLS ultra-avancés utilisent une évaluation des menaces assistée par IA, des profils d'interception adaptatifs et des véhicules tueurs à haute agilité pour vaincre les menaces furtives, balistiques et hypersoniques dans de vastes espaces de bataille maritimes."
 tech_vls_aa_8: "Missiles surface-air à lancement vertical 2075"
 tech_vls_aa_8_desc: "Les missiles VLS surface-air de nouvelle génération combinent gestion de bataille prédictive, coordination autonome des intercepteurs et fusion capteurs de flotte en temps réel pour une défense en couches contre aéronefs, missiles, drones, menaces quasi spatiales et armes manœuvrantes avancées."
 tech_torpedoes_7: "Torpille 2060"
 tech_torpedoes_7_desc: "Les torpilles ultra-avancées utilisent une classification de cibles assistée par IA, une détection multimode et des profils d'attaque adaptatifs pour distinguer les vraies cibles des leurres et poursuivre les menaces dans des milieux sous-marins complexes."
 tech_torpedoes_8: "2075 Torpille"
 tech_torpedoes_8_desc: "Les torpilles de nouvelle génération combinent réseau sous-marin coopératif, suivi prédictif des cibles, planification de route autonome et rejet avancé des contre-mesures pour chasser navires et sous-marins dans des espaces de bataille saturés de capteurs."
 tech_drone_torpedoes_4: "Torpilles de drones V"
 tech_drone_torpedoes_4_desc: "L'autonomie avancée transforme les torpilles-drones en chasseurs sous-marins coordonnés, capables de recherche coopérative, d'une logique de réattaque plus intelligente et d'une résistance aux leurres. Avec un suivi de sillage affiné et des autodirecteurs multimodes, elles peuvent percer les défenses modernes et maintenir la pression jusqu'à l'élimination de la cible."
 tech_drone_torpedoes_5: "Torpilles de drones VI"
 tech_drone_torpedoes_5_desc: "L'autonomie avancée transforme les torpilles-drones en chasseurs sous-marins coordonnés, capables de recherche coopérative, d'une logique de réattaque plus intelligente et d'une résistance aux leurres. Avec un suivi de sillage affiné et des autodirecteurs multimodes, elles peuvent percer les défenses modernes et maintenir la pression jusqu'à l'élimination de la cible."
 tech_anti_torpedoes_4: "Défense anti-torpille IV"
 tech_anti_torpedoes_4_desc: "Les suites anti-torpilles très avancées associent un suivi haute fidélité à des contre-mesures actives, y compris des intercepteurs à destruction dure conçus pour détruire les torpilles avant l'impact. Capteurs en réseau et systèmes défensifs à tir rapide rendent les attaques sous-marines bien moins décisives, forçant les sous-marins à engager plus d'armes pour moins de résultats."
 tech_anti_torpedoes_5: "Défense anti-torpille V"
 tech_anti_torpedoes_5_desc: "Les suites anti-torpilles hyperavancées associent un suivi haute fidélité à des contre-mesures actives, y compris des intercepteurs à destruction dure conçus pour détruire les torpilles avant l'impact. Capteurs en réseau et systèmes défensifs à tir rapide rendent les attaques sous-marines bien moins décisives, forçant les sous-marins à engager plus d'armes pour moins de résultats."
 tech_nuclear_torpedoes_4: "Torpilles nucléaires V"
 tech_nuclear_torpedoes_4_desc: "Les concepts hyperavancés de torpilles nucléaires visent à rendre la menace survivable, contrôlable et politiquement utilisable sans en réduire l'horreur. Avec une intégration plus serrée au commandement stratégique et des règles de déclenchement plus claires, l'arme devient un pilier formel de la dissuasion maritime. Une fois déployée, elle contraint l'adversaire à négocier par la peur, non par la confiance."
 tech_landing_craft_8: "Péniches de débarquement de haute technologie"
 tech_landing_craft_8_desc: "L'application des avancées technologiques les plus récentes accroît les capacités opérationnelles des chalands de débarquement."
 tech_landing_craft_9: "Péniche de débarquement de haute technologie II"
 tech_landing_craft_9_desc: "L'application des avancées technologiques les plus récentes accroît les capacités opérationnelles des chalands de débarquement."
 tech_landing_craft_10: "Péniche de débarquement de haute technologie III"
 tech_landing_craft_10_desc: "L'application des avancées technologiques les plus récentes accroît les capacités opérationnelles des chalands de débarquement."
 corvette_hull_7: "Coque de Corvette 2055"
 corvette_hull_7_desc: "Plus petite classe de bâtiment considérée comme un navire de guerre, les corvettes ne font généralement pas partie des marines de « haute mer ». Ces navires petits et rapides sont d'ordinaire armés d'un assortiment d'armes, leur permettant d'assurer un éventail de missions. De nombreux pays peuvent aligner des corvettes grâce à leur coût abordable pour les marines petites et moyennes. Elles servent typiquement à : défense côtière et surveillance, dragage de mines, lutte anti-sous-marine, anti-aérienne, antinavire et, à l'époque moderne, frappe terrestre."
 corvette_hull_8: "Coque de Corvette 2070"
 corvette_hull_8_desc: "Plus petite classe de bâtiment considérée comme un navire de guerre, les corvettes ne font généralement pas partie des marines de « haute mer ». Ces navires petits et rapides sont d'ordinaire armés d'un assortiment d'armes, leur permettant d'assurer un éventail de missions. De nombreux pays peuvent aligner des corvettes grâce à leur coût abordable pour les marines petites et moyennes. Elles servent typiquement à : défense côtière et surveillance, dragage de mines, lutte anti-sous-marine, anti-aérienne, antinavire et, à l'époque moderne, frappe terrestre."
