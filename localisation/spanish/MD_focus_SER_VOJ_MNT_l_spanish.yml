 kosovo.3.t: "La lucha por el reconocimiento"
 kosovo.3.d: "We will continue to fight for recognition as an independent state, even though we are not recognized as such now, but we do not intend to stop in our struggle."
 kosovo.3.a: "Adelante, hacia la meta"
 kosovo.4.t: "Kosovo pide garantías de no agresión"
 kosovo.4.d: "Kosovo asks us to confirm its intention not to attack us by concluding a non-aggression pact, as a sign of its non-aggressive manners towards us."
 kosovo.4.a: "Que se vayan al diablo!"
 kosovo.4.b: "Está bien"
 kosovo_rec.7.t: "Kosovo solicita reconocimiento"
 kosovo_rec.7.d: "Diplomáticos de Kosovo han venido a nosotros y nos han solicitado que los reconozcamos como un país. Este será un proceso complicado, pero no sufriríamos ningún daño al reconocerlos."
 kosovo_rec.7.a: "¿Por Qué No?"
 kosovo_rec.7.b: "Ahora no"
