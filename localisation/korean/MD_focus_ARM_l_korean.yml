 ARM_economy_lavash: "아르메니아 경제"
 ARM_economy_lavash_desc: "소련 붕괴 이후 우리 경제는 참담한 상태이며, 예산이 완전히 파탄 나는 것을 막기 위해 혹독한 민영화의 물결도 겪었습니다. 어쩌면 새천년에는 우리에게서 빼앗긴 모든 것을 되찾을 수 있을지도 모릅니다."
 ARM_economy_tourism: "관광 개발"
 ARM_economy_tourism_desc: "아르메니아의 관광업은 국가 예산에서 큰 비중을 차지하며, 우리는 이 산업을 발전시키고 투자할 계획입니다."
 ARM_economy_historic: "역사 유적 복원"
 ARM_economy_historic_desc: "관광객은 고대 유적에 쉽게 끌리므로, 우리는 이를 복원할 것입니다."
 ARM_economy_longest: "최장 케이블카"
 ARM_economy_longest_desc: "아름다운 경치를 감상하는 것을 싫어하는 사람이 있겠습니까? 관광객들이 분명 좋아할 것입니다."
 ARM_economy_sewani: "세반 호로바츠"
 ARM_economy_sewani_desc: "우리는 관광지 주변의 미식 분야를 본격적으로 발전시킬 계획입니다."
 ARM_economy_hotels: "호텔 문제"
 ARM_economy_hotels_desc: "호텔은 국제 기준을 충족해야 하며, 그렇지 않으면 관광객 유입이 매우 빠르게 감소할 것입니다."
 ARM_economy_tobacco: "아르메니아 담배 문제"
 ARM_economy_tobacco_desc: "아르메니아의 담배 산업은 막대한 영역을 차지하며 국고에 세금을 가져다주지만 그 양은 충분하지 않습니다. 게다가 이 기업을 통해 일부 외국이 경제적 수단으로 우리에게 영향력을 행사할 수도 있습니다."
 ARM_economy_shady: "수상한 사업 조사"
 ARM_economy_shady_desc: "지하 경제는 전국의 세금 징수에 부정적인 영향을 미칩니다. 이제 이 심각한 문제를 해결할 때입니다."
 ARM_economy_casino: "온라인 카지노의 운명"
 ARM_economy_casino_desc: "지하 경제의 마지막 보루인 온라인 카지노가 마침내 폐쇄될 것이며, 우리는 지하 사업의 해로운 영향에서 벗어나게 될 것입니다."
 ARM_economy_armenian_card: "아르메니안 카드"
 ARM_economy_armenian_card_desc: "아르메니안 카드는 아르메니아의 결제 대행사이자 카드 발급사입니다. '아르메니안 카드' 폐쇄형 주식회사는 아르메니아 은행권에 새로운 결제 회계 시스템을 도입하고 발전시키기 위해 USAID의 지원을 받아 2000년 아르메니아 중앙은행과 10개 상업 은행이 설립했습니다"
 ARM_economy_evocabank: "에보카방크"
 ARM_economy_evocabank_desc: "에보카방크는 예레반에 본사를 둔 아르메니아의 상업 은행입니다. 디지털화가 대규모로 진행된 지금, 이 은행은 아르메니아에서 가장 선진적이고 기술적으로 앞선 은행 중 하나가 될 준비가 되어 있습니다."
 ARM_economy_artsakhbank: "아르차흐방크"
 ARM_economy_artsakhbank_desc: "이 은행은 아르차흐에 위치해 있으며, 아르차흐에 대한 일종의 경제적 영향력 수단입니다"
 ARM_economy_ardshinbank: "아르드신방크"
 ARM_economy_ardshinbank_desc: "아르드신방크는 모든 은행 서비스를 제공하는 종합 금융 및 신용 기관입니다. 주요 분야로는 주로 아르메니아의 전략 산업과 에너지 부문의 대기업 고객에 대한 프로젝트 금융, 중소기업 대출, 플라스틱 카드 발행 및 서비스, 전자 금융, 국제 송금, 다양한 인구 집단에 대한 주택 담보 대출, 급여 프로젝트가 있습니다"
 ARM_economy_inecobank: "이네코방크"
 ARM_economy_inecobank_desc: "이네코방크는 아르메니아 예레반에 본사를 둔 남캅카스 지역의 선도적인 은행 중 하나입니다. 이 은행은 개인, 중소기업, 법인 고객을 대상으로 디지털 금융 서비스를 포함한 모든 은행 서비스를 제공합니다"
 ARM_economy_vtb: "러시아 VTB 허용"
 ARM_economy_vtb_desc: "러시아의 VTB 은행은 우리나라에 지점을 열기 위해 노력하고 있으며, 러시아 자본은 우리 경제에 상당히 유용할 것입니다."
 ARM_economy_hsbc: "HSBC 문제"
 ARM_economy_hsbc_desc: "HSBC 은행은 90년대부터 우리나라에 자리 잡고 있습니다. 은행 부문이 성장하기 시작한 지금, 이 은행을 어떻게 할지 결정해야 할 때입니다."
 ARM_economy_ycrdi: "YCRDI"
 ARM_economy_ycrdi_desc: "예레반 컴퓨터 연구개발 연구소는 과학 연구 기관이자 아르메니아 IT 및 소프트웨어 산업의 선구자입니다. 이 연구소는 컴퓨터 장비 개발을 위해 1956년 소련 정부가 예레반에 설립했습니다. 현재 이 기관은 민수 및 국방 목적의 컴퓨터와 자동 제어 시스템 개발에 참여하고 있습니다. 지금 이 연구소는 끔찍한 재정 상황에 놓여 있으며, 러시아 교육부가 지원할 수 있도록 러시아에 매각할 것인지, 아니면 우리 기관에 직접 재정적으로 투자할 것인지 선택해야 합니다."
 ARM_economy_orange: "UCOM"
 ARM_economy_orange_desc: "마침내 외국 투자자에게 속하지 않은 우리만의 국내 통신 사업자를 갖게 될 것입니다."
 ARM_economy_veon: "VEON"
 ARM_economy_veon_desc: "VEON 그룹으로도 알려진 VEON Ltd는 다국적 통신 및 디지털 서비스 기업입니다. 본사는 네덜란드에 있으며, 미국 나스닥 증권 거래소에 상장되어 있습니다. 우리는 이 사업자가 통신망을 발전시킬 수 있도록 우리나라에 들여와 시민들의 삶을 개선할 계획입니다."
 ARM_economy_electric_networks: "폐쇄형 주식회사 \\"아르메니아 전력망\\""
 ARM_economy_electric_networks_desc: "폐쇄형 주식회사 \\"아르메니아 전력망\\"은 전력을 배전하고 판매하는 네 개의 국영 지역 기업이 합병하여 설립되었습니다. 이 회사는 주로 규제 대상 전력의 배전 및 판매 사업을 합니다. 전력망의 총 길이는 3만 6천 km입니다. 배전은 아르메니아 공화국 공공서비스규제위원회가 승인한 요금으로 이루어집니다. 이 회사는 100만 명이 넘는 고객에게 서비스를 제공합니다."
 ARM_economy_hrazdan_thermal: "흐라즈단 화력 발전소"
 ARM_economy_hrazdan_thermal_desc: "흐라즈단 화력 발전소는 흐라즈단 시 북서부에 있는 천연가스 화력 발전소로, 아르메니아에서 전력을 생산합니다. 아르메니아에서 가장 큰 발전소 중 하나입니다. 이 발전소는 1963년부터 1974년까지 건설되었으며, 첫 번째 호기는 1966년에 가동되었습니다. 현재 상태에서는 발전소를 전면 개보수하고 충분한 자금을 지원해야 하므로, 이 문제가 다시 제기됩니다. 러시아의 통제로 넘길 것인지, 아니면 자체 예산으로 발전소를 지원할 것인지"
 ARM_economy_rosneft: "로스네프트-아르메니아"
 ARM_economy_rosneft_desc: "우리는 러시아 기업 로스네프트와 석유 시설 건설 계약을 체결할 계획입니다. 우리의 석유 산업은 전혀 발전하지 못했으므로, 또다시 러시아 동료들에게 의존할 수밖에 없습니다."
 ARM_economy_techout_mining: "테구트 광업"
 ARM_economy_techout_mining_desc: "테구트 광업은 아르메니아 공화국에서 두 번째로 큰 구리 및 몰리브덴 광상인 로리 지역의 테구트 광상을 개발하기 위해 설립되었습니다."
 ARM_economy_ml_mining: "ML 광업"
 ARM_economy_ml_mining_desc: "또 하나의 광업 회사가 설립되어 우리나라에서 채굴할 수 있는 자원의 폭을 넓히는 데 도움이 될 것입니다."
 ARM_economy_elnor: "엘노르"
 ARM_economy_elnor_desc: "엘노르는 시장에 활발히 모습을 드러내기 시작한 농공업 제품을 생산하는 또 다른 기업입니다."
 ARM_economy_techout_more: "사업 확장"
 ARM_economy_techout_more_desc: "테구트의 사업이 확장될 것이며, 이는 생산이 양호한 수준임을 보여 주는 뚜렷한 지표입니다."
 ARM_economy_shoghakn: "쇼가크"
 ARM_economy_shoghakn_desc: "쇼가크 공장(구 크리스탈 공장)은 아르메니아 최대의 다이아몬드 가공 기업입니다. 아르메니아에서 가공한 다이아몬드의 첫 번째 물량은 1971년 3월 크리스탈 노르 아크나 공장에서 생산되었습니다. 이후 몇 년 동안 크리스탈은 스탄코스트로이텔니로 개칭되었다가 1992년 쇼가크로 다시 개칭되었습니다. 아르메니아에서 처음으로 '마퀴즈', '오벌', '페어' 모양과 '에메랄드', '바게트' 및 다양한 삼각형 모양의 다이아몬드가 가공되었습니다."
 ARM_economy_grand_candy: "그랜드 캔디"
 ARM_economy_grand_candy_desc: "그랜드 캔디는 가장 큰 식품 산업 기업 중 하나입니다. 이 회사의 제품은 언제나 고객들에게 좋은 평가를 받습니다."
 ARM_economy_agro_support: "스파이카"
 ARM_economy_agro_support_desc: "이 회사는 국제 화물 운송 분야에서 선도적인 위치를 차지하고 있으며, 독립국가연합 국가들, 유럽, 페르시아만 지역으로 과일과 채소 제품을 가장 많이 생산하고 수출하는 업체이기도 했습니다."
 ARM_economy_daily_products: "마리아나"
 ARM_economy_daily_products_desc: "마리아나는 사업 초기부터 제품의 높은 품질을 유지한다는 원칙에 따라 운영되어 왔으며, 꾸준한 노력과 헌신이 회사의 추가 확장과 발전의 열쇠가 되었습니다. 우리는 최고의 소비자에게 최고의 제품을 제공합니다."
 ARM_economy_free_energy: "녹색 에너지"
 ARM_economy_free_energy_desc: "21세기는 녹색 에너지의 세기이므로, 녹색 에너지는 언제나 아르메니아 경제의 우선 과제 중 하나일 것입니다. 그렇지 않습니까?"
 ARM_economy_green_armenia: "녹색 아르메니아 프로그램"
 ARM_economy_green_armenia_desc: "우리의 환경 프로그램이 확대될 것이며, 우리나라는 환경 프로그램 성공의 모범이 되어야 합니다."
 ARM_economy_nuclear: "원자력 에너지"
 ARM_economy_nuclear_desc: "이제 원자력 에너지 개발에 착수할 때입니다. 우리는 오직 우리 자신에게만 의지할 수 있습니다."
 ARM_economy_nuclear_expand: "원자력 에너지 확대"
 ARM_economy_nuclear_expand_desc: "원자력 발전소는 언제나 중요한 문제이며, 이를 어떻게 할지 결정할 때입니다."
 ARM_economy_zangezur_copper: "창게주르 구리·몰리브덴 콤비나트"
 ARM_economy_zangezur_copper_desc: "창게주르 구리·몰리브덴 콤비나트는 아르메니아 최대의 광업 기업이자 세계 10대 몰리브덴 생산 업체 중 하나입니다. ZCMC의 역사는 소비에트 시대로 거슬러 올라갑니다. 1952년 봄, 이 콤비나트는 첫 번째 연속 생산품을 내놓았습니다. 처음에는 갱내 채굴과 노천 채굴을 병행하여 광산을 운영했습니다. 1957년부터 1959년까지는 오로지 노천 채굴로만 운영되었습니다. 창게주르 구리·몰리브덴 콤비나트는 아르메니아 남동부, 아르메니아 시우니크 지역의 카자란 시에 있으며, 지역 중심지인 카판에서 서쪽으로 30km, 수도 예레반에서 약 350km 떨어져 있습니다."
 ARM_economy_yerevan_factori_restore: "예레반 제과·마카로니 공장"
 ARM_economy_yerevan_factori_restore_desc: "예레반 제과·마카로니 공장은 아르메니아에 기반을 둔 산업 기업이었습니다. 1933년에 건설되었습니다. 제과 부서와 마카로니 부서는 1951년에 통합되었습니다. 1977년 이 공장은 소련 최초의 껌 생산업체가 되었으나, 그 껌에는 치클이 전혀 들어 있지 않았습니다. 이 공장은 1990년대 소련 붕괴 과정에서 생산을 거의 중단했으며, 이후 그랜드 캔디 사에 민영화되어 복원되었습니다."
 ARM_economy_yerevan_ararat_factory: "예레반 아라라트 브랜디 공장"
 ARM_economy_yerevan_ararat_factory_desc: "공식 명칭이 예레반 아라라트 브랜디·와인·보드카 공장이며 유명 브랜드 노이로 흔히 알려진 예레반 아라라트 브랜디 공장은 아르메니아 예레반의 선도적인 아르메니아 브랜디 생산 기업입니다."
 ARM_economy_yerevan_destiny_brandy: "예레반 브랜디 회사"
 ARM_economy_yerevan_destiny_brandy_desc: "유명 브랜드 'ArArAt'로 흔히 알려진 예레반 브랜디 회사는 아르메니아의 선도적인 코냑 생산 기업입니다. 이 회사는 러시아 제국 시기인 1887년에 설립되었습니다. 아르메니아가 소비에트화된 후 이 공장은 국영 기업이 되었습니다. 1999년 독립 아르메니아 정부는 이 공장을 프랑스의 증류주 기업 페르노 리카에 매각했습니다. 이 회사의 다양한 코냑 제품은 ArArAt라는 이름으로 표기되어 홍보됩니다."
 ARM_economy_eraz: "ErAZ"
 ARM_economy_eraz_desc: "ErAZ, 즉 예레반 자동차 공장은 아르메니아 예레반의 자동차 제조업체로, 1966년부터 1996년까지 생산한 밴 RAF-977K로 가장 잘 알려져 있습니다. ErAZ 공장 설립 계획은 1964년 12월 31일 아르메니아 소비에트 사회주의 공화국 각료회의에서 나왔습니다. 초기 직원들은 라트비아의 리가 버스 공장과 러시아의 UAZ에서 훈련을 받았습니다. ErAZ는 1995년에 민영화되었습니다."
 ARM_economy_kotayk: "코타이크 양조장"
 ARM_economy_kotayk_desc: "코타이크 양조장은 1974년 아르메니아 코타이크 주 아보비안에 설립된 양조 회사입니다."
 ARM_economy_ashvar: "아우샤르 와인 공장"
 ARM_economy_ashvar_desc: "아우샤르 와인 공장은 아라라트 주 아우샤르 마을에 위치한 아르메니아의 선도적인 주류 생산 업체 중 하나입니다. 이 공장은 아르메니아의 주요 농업 지대 중 하나인 아라라트 평원의 비옥한 마을들에서 나는 포도를 가공하기 위해 1968년에 설립되었습니다. 아르메니아의 전통과 민간 설화에 따르면, 이 지역의 와인 생산은 창세기에서 노아가 아라라트 산에서 내려와 포도를 심은 때로 거슬러 올라갑니다."
 ARM_economy_hrazdan_cement: "흐라즈단 시멘트"
 ARM_economy_hrazdan_cement_desc: "흐라즈단 시멘트 폐쇄형 주식회사는 아르메니아 코타이크 주의 주도인 흐라즈단 시에 위치한 폐쇄형 합자 회사입니다. 1970년 소련 정부가 '흐라즈단 시멘트 공장'으로 설립했습니다."
 ARM_economy_multi_group: "멀티 그룹 스톤"
 ARM_economy_multi_group_desc: "멀티 그룹 스톤 폐쇄형 주식회사는 '멀티 그룹 콘체른'이 아르메니아 아보비안 시에 설립했습니다. 이 회사는 광물 채굴 및 가공, 즉 자체 채석장에서의 천연석과 트래버틴 블록 채굴, 공장에서의 타일 제조 및 최종 가공의 전 과정에 관여합니다."
 ARM_economy_alrosa: "알로사와의 협력"
 ARM_economy_alrosa_desc: "우리는 공화국의 재정과 자원 상태를 개선하기 위해 이 러시아 기업을 우리 시장에 들여올 계획입니다."
 ARM_economy_gazprom: "가스프롬과의 협력"
 ARM_economy_gazprom_desc: "우리는 공화국의 재정과 자원 상태를 개선하기 위해 이 러시아 기업을 우리 시장에 들여올 계획입니다."
 ARM_economy_armenal: "루살-아르메날"
 ARM_economy_armenal_desc: "우리는 공화국의 재정과 자원 상태를 개선하기 위해 이 러시아 기업을 우리 시장에 들여올 계획입니다."
 ARM_economy_mts: "MTS와의 협력"
 ARM_economy_mts_desc: "우리는 이 러시아 기업이 러시아 시장에서 긍정적으로 자리매김했기 때문에 통신 시장에서 사업을 시작하도록 할 계획입니다."
 ARM_government_subsid_it_sphere: "정부의 IT 보조금 지급"
 ARM_government_subsid_it_sphere_desc: "우리나라 IT 부문을 발전시킬 때입니다. 우리나라에는 현대적인 기술과 현대적인 IT 전문가가 필요합니다."
 ARM_invite_microsoft: "마이크로소프트 초청"
 ARM_invite_microsoft_desc: "$ARM_invite_it_corp_shared_desc$"
 ARM_invite_oracle: "오라클 초청"
 ARM_invite_oracle_desc: "$ARM_invite_it_corp_shared_desc$"
 ARM_nvidia_invite: "엔비디아 초청"
 ARM_nvidia_invite_desc: "$ARM_invite_it_corp_shared_desc$"
 ARM_adobe_invite: "어도비 초청"
 ARM_adobe_invite_desc: "$ARM_invite_it_corp_shared_desc$"
 ARM_invite_amd: "AMD 초청"
 ARM_invite_amd_desc: "$ARM_invite_it_corp_shared_desc$"
 ARM_economy_deep: "심부 자원 채굴"
 ARM_economy_deep_desc: "아르메니아의 지하에는 과거에는 낙후된 기술 때문에 접근할 수 없었던 많은 자원이 있으며, 이제 우리는 우리나라의 자원 잠재력을 모두 발휘할 기회를 얻었습니다."
 ARM_economy_heavy: "아르메니아 중공업"
 ARM_economy_heavy_desc: "새로운 자원은 우리 산업 발전에 원동력이 되었으며, 이제 아르메니아의 중공업은 동화가 아니라 현실입니다."
 ARM_economy_new_uranium: "우라늄 채굴 신기술"
 ARM_economy_new_uranium_desc: "우리 산업가들이 우라늄을 채굴하는 새로운 방법을 발견했으며, 우리는 이 산업을 더욱 발전시킬 준비가 되어 있습니다."
 ARM_economy_steel: "제철소"
 ARM_economy_steel_desc: "우리가 발견한 막대한 매장량을 개발하려면 민수 산업과 군수 산업 양쪽에서 새로운 공장이 필요합니다"
 ARM_economy_chemical: "중화학 공장"
 ARM_economy_chemical_desc: "비 온 뒤 버섯처럼 새로운 산업이 생겨나고 있으며, 아르메니아에서도 이미 중화학 공업이 부상하고 있습니다."
 ARM_economy_metal: "금속 합금"
 ARM_economy_metal_desc: "금속 합금 생산에 대한 중점을 확대할 것이며, 이는 우리 중공업에 필요한 추진력을 줄 것입니다."
 ARM_economy_heavy_ebat: "아르메니아 중공업 협동조합"
 ARM_economy_heavy_ebat_desc: "우리는 중공업의 모든 성과를 하나의 협동조합으로 결합할 준비가 되었습니다."
 ARM_economy_wto: "WTO 가입"
 ARM_economy_wto_desc: "세계무역기구에 가입하면 세계 경제에 통합되고 더욱 확장하는 데 도움이 되며, 우리 국가와 국민에게 번영을 가져다줄 것입니다."
 ARM_higher_educ_sph_development: "고등 교육 발전"
 ARM_higher_educ_sph_development_desc: "우리나라의 고등 교육은 끔찍한 상태이지만, 세계 최고의 교육 기관을 유치하고 세계 각지의 여러 대학에 폭넓게 접근할 수 있는 센터를 만들어 이를 바꿀 계획입니다."
 ARM_tumo_project: "투모 창의 기술 센터"
 ARM_tumo_project_desc: "투모 창의 기술 센터는 기술과 디자인을 전문으로 하는 12세에서 18세 청소년을 위한 무료 교육 프로그램이며, 교육은 여러 투모 센터와 허브에서 제공됩니다."
 ARM_support_aua: "아르메니아 아메리칸 대학교"
 ARM_support_aua_desc: "우리는 미국의 교육이 세계 최고 수준 중 하나라고 생각하며, 우리 시민들이 이를 접할 수 있기를 바랍니다."
 ARM_erasmus_coop: "에라스뮈스+ 아르메니아"
 ARM_erasmus_coop_desc: "유럽의 교육 기준은 언제나 유효하며 우리에게 우선순위이므로, 우리는 EU의 주요 대학들과 협력할 준비가 되어 있습니다."
 ARM_ayb_school: "아이브 학교"
 ARM_ayb_school_desc: "아이브 학교는 아르메니아 예레반에 있는 사립 교육 단지로, 아이브 교육 재단이 설립했습니다. 학교 이름은 아르메니아 문자의 첫 글자 아이브에서 따왔습니다. 이곳은 비영리 단체이며, 법적으로는 아이브 러닝 허브 재단으로 등록되어 있습니다. 학교의 좌우명은 '알고 창조하라'입니다. 학교는 루벤 아루티냔이 이끄는 이사회가 운영합니다. 학교장은 다비트 사하캰입니다."
 ARM_educ_coop_brit: "케임브리지와의 협력"
 ARM_educ_coop_brit_desc: "케임브리지의 교육은 세계적으로 높이 평가받고 있으며, 우리는 우리나라에서도 이를 접할 수 있도록 만들 계획입니다."
 ARM_armenia_mgu: "MSU와의 협력"
 ARM_armenia_mgu_desc: "우리는 시민들이 러시아식 교육을 받고 이를 구소련권에 적용할 수 있도록 우리나라에 모스크바 국립대학교 분교를 열 계획입니다."
 ARM_economy_category: "아르메니아 경제"
 ARM_economy_category_desc: "§R소련§! 시기에 £text_icon_armdram §Y아르메니아 경제§!는 산업 중심이었습니다. §R소련의 붕괴§!는 이러한 상황을 근본적으로 바꾸어 놓았습니다. [ARM.GetFlag]§Y아르메니아§!는 대규모 산업 부문에서 소규모 농업으로 옮겨 갔습니다. 1990년 당시 국가의 정치적, 경제적 상황으로 인해 £text_icon_armdram §Y경제§!가 정체되지 않도록, 나아가 §R더 나쁘게는§! §R쇠퇴§!하기 시작하지 않도록 대출을 받을 수밖에 없었습니다"
 ARM_economy_russian_tourists: "[SOV.GetFlag]§Y러시아§! 관광객 유입 촉진"
 ARM_economy_tourism_integrate_azer: "[AZE.GetFlag]§Y아제르바이잔§! 휴양지 통합"
 ARM_economy_tourism_integrate_abkhazia: "[ABK.GetFlag]§Y압하지야§! 휴양지 통합"
 ARM_economy_shadow_economy_destroy: "§R지하 경제§!와의 싸움 지속"
 ARM_economy_shady_idea: "지하 경제"
 ARM_economy_shady_idea4: "약화된 지하 경제"
 ARM_Eraz_idea: "ErAZ"
 ARM_multigroup_idea: "멀티그룹"
 ARM_armbel_trade_center: "아르메니아-벨라루스 무역관"
 ARM_armbel_trade_center_desc: "양국 간의 농업 및 식품 생산과 무역을 늘리기 위해 아르메니아-벨라루스 무역관을 설립할 수 있습니다.\n--------------\n벨라루스와 전쟁을 벌이거나 벨라루스에 대한 관계가 악화되면 이 국가 정신은 §R제거§!됩니다."
 NKR_gaz_energy_problems: "낮은 가스 보급률"
 NKR_corruption_in_police_idea: "부패한 경찰"
 ARM_new_decision_economic_unlock_tt: "£text_icon_armdram §Y아르메니아 경제§!: 새로운 결정 §Y해금§!"
 ARM_tourism_expand_TT: "£text_icon_armdram §Y관광 수입§!이 §G증가§!합니다"
 ARM_tourism_expand_territories_ABK_TT: "£text_icon_armdram 우리는 [ABK.GetFlag]§Y압하지야 휴양지§!를 통합하고 있습니다"
 ARM_tourism_expand_territories_AZE_TT: "£text_icon_armdram 우리는 [AZE.GetFlag]§Y아제르바이잔 휴양지§!를 통합하고 있습니다"
 ARM_Economy_unfluency_ycrdi_SOV_TT: "[SOV.GetFlag] §Y[ROOT.GetNameWithFlag]§!에서의 러시아 §H영향력 배수§!: §R+10%§!"
 ARM_Economy_unfluency_it_USA_TT: "[USA.GetFlag] §Y[ROOT.GetNameWithFlag]§!에서의 미국 §H영향력 배수§!: §R+10%§!"
 ARM_Economy_unfluency_armbel_BLR_TT: "[BLR.GetFlag] §Y[ROOT.GetNameWithFlag]§!에서의 벨라루스 §H영향력 배수§!: §R+10%§!"
