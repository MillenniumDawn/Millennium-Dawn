 ANTCONF_integrate_PTR_desc: "푸에르토리코는 오랫동안 미국의 영토였습니다. 미국의 보호를 받고 있지만, 미국의 핵심 본토는 아닙니다. 인구는 거의 400만 명에 달하며 카리브해에서 가장 큰 섬 중 하나입니다. 앤틸리스 연합에 통합될 수 있는 주 중에서는 가장 작지만, 이 지역의 생동감 넘치는 문화와 관광 산업은 거대한 연합에 큰 이익을 가져다줄 것입니다."
