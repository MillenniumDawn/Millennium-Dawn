 module_naval_asw_nuclear_torpedoes_1: "Torpedos ASW nucleares I"
 module_naval_asw_nuclear_torpedoes_1_desc: "Los torpedos ASW nucleares combinan perfiles de despliegue antisubmarino con una ojiva excepcionalmente potente para maximizar la letalidad contra objetivos sumergidos.\n\n§GConsejo de diseño: Los torpedos ASW nucleares proporcionan una guerra antisubmarina excepcional para destruir submarinos detectados. Son ideales para cazadores de submarinos dedicados, pero cuestan más capacidad industrial (IC) y mano de obra que los torpedos ASW convencionales.§!"
 module_naval_asw_nuclear_torpedoes_2: "Torpedos ASW nucleares II"
 module_naval_asw_nuclear_torpedoes_2_desc: "Los torpedos ASW nucleares combinan perfiles de despliegue antisubmarino con una ojiva excepcionalmente potente para maximizar la letalidad contra objetivos sumergidos.\n\n§GConsejo de diseño: Los torpedos ASW nucleares proporcionan una guerra antisubmarina excepcional para destruir submarinos detectados. Son ideales para cazadores de submarinos dedicados, pero cuestan más capacidad industrial (IC) y mano de obra que los torpedos ASW convencionales.§!"
