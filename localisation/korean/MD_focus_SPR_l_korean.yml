 SPR_idea_green_revolution_2_desc: "국내 선도 에너지 기업의 지원이 늘어남에 따라 우리의 에너지 부문이 빠르게 변모하고 있습니다."
 SPR_idea_green_revolution_3: "사회 전반의 녹색 혁명"
 SPR_idea_green_revolution_3_desc: "우리의 에너지 부문 전체가 친환경 체제로 전환되었습니다. 도시 건물마다 식물이 자라고 전력의 상당 부분이 친환경 기술로 생산되고 있습니다."
