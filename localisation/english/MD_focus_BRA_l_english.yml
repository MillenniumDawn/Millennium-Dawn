 BRA_econ_microchip_workers_tt: "$microchip_plant_worker_requirement_modifier$: $RIGHT|-=%1$"
 BRA_econ_research_tt: "$MODIFIER_RESEARCH_SPEED_FACTOR$: $RIGHT|+=%1$"
 BRA_econ_resources_tt: "Resource Output: $RIGHT|+=%1$"
 BRA_econ_unions_opinion_tt: "$if_labour_unions_minimum_opinion$: $RIGHT|+=0$"
 BRA_econ_farmers_opinion_tt: "$if_farmers_minimum_opinion$: $RIGHT|+=0$"
 BRA_idea_brazilian_knack: "The Brazilian Jeitinho"
 BRA_idea_brazilian_knack_desc: "\"Dar um jeito\" means to find a way. For a street vendor buried in paperwork, the jeitinho can mean survival. For everyone without connections, it means waiting in line while someone's cousin gets served first.\n§W--------------§!\nThis national spirit is reviewed every month and will §GImprove§! once we complete §Y2§! integrity reforms, such as the §Y$BRA_decision_portal_da_transparencia$§! and §Y$BRA_decision_ficha_limpa$§! decisions or an upgrade of §Y$BRA_idea_car_wash$§!. It will be §RRemoved§! and replaced by §Y$BRA_idea_jeitinho_formalization$§! if we take the §Y$BRA_decision_jeitinho_formalization$§! decision."
 BRA_idea_brazilian_knack_2: "The Jeitinho Under Scrutiny"
 BRA_idea_brazilian_knack_2_desc: "Auditors and prosecutors now catch more of the favors that used to pass unnoticed. The jeitinho still gets people around the paperwork, but its hidden costs are shrinking.\n§W--------------§!\nThis national spirit is reviewed every month and will §GImprove§! once we complete §Y4§! integrity reforms, such as the §Y$BRA_decision_access_to_information_law$§! and §Y$BRA_decision_clean_company_act$§! decisions or an upgrade of §Y$BRA_idea_car_wash$§!, and our §Y$education_budget$§! is set to §Y$edu_04_neutral$§! or higher. It will be §RRemoved§! and replaced by §Y$BRA_idea_jeitinho_formalization$§! if we take the §Y$BRA_decision_jeitinho_formalization$§! decision."
 BRA_idea_brazilian_knack_3: "The Jeitinho Fading"
 BRA_idea_brazilian_knack_3_desc: "A generation that expects fair service from the state is wearing down the old habits of favors and bribes. What remains of the jeitinho is closer to ingenuity than to fraud.\n§W--------------§!\nThis national spirit will be §RRemoved§! and replaced by §Y$BRA_idea_jeitinho_formalization$§! if we take the §Y$BRA_decision_jeitinho_formalization$§! decision."
 BRA_idea_jeitinho_formalization: "Microentrepreneur Registration"
 BRA_idea_jeitinho_formalization_desc: "A small business can now go legal in days instead of months. Fewer owners need a friend in the right office."
 BRA_idea_electricity_rationing: "Electricity Rationing"
 BRA_idea_electricity_rationing_desc: "Households and factories must cut consumption or pay surcharges. The lights stay on while the reservoirs refill."
 BRA_idea_public_budget_framework: "New Fiscal Framework"
 BRA_idea_public_budget_framework_desc: "Spending may grow only in step with revenue. Lenders like the predictability, and ministers complain about the limits."
 BRA_idea_spending_ceiling: "Constitutional Spending Ceiling"
 BRA_idea_spending_ceiling_desc: "A constitutional amendment freezes federal spending in real terms. Markets cheer, while unions and public universities brace for lean years."
 BRA_idea_enraged_natives: "Enraged Natives"
 BRA_idea_enraged_natives_desc: "The native peoples of Brazil are enraged with the government. They cite disproportionate pay, poor treatment of workers, and widespread poverty. If we do nothing to support them, the unrest may spread.\n§W--------------§!\nThis national spirit will §GImprove§! if we complete the §Y$BRA_angry_natives$§! focus."
 BRA_idea_angry_natives: "Angry Natives"
 BRA_idea_angry_natives_desc: "The native peoples of Brazil are still unhappy with the government. They continue to cite disproportionate pay, poor treatment of workers, and other grievances despite improvements in the law.\n§W--------------§!\nThis national spirit will be §RRemoved§! and replaced by §Y$BRA_idea_friendly_natives$§! if we complete a political path focus after the §Y$BRA_the_new_elections$§! focus, such as §Y$BRA_new_communist_government$§!, §Y$BRA_the_brazilian_dream$§!, or §Y$BRA_bastion_of_liberty$§!."
 BRA_idea_friendly_natives: "Friendly Natives"
 BRA_idea_friendly_natives_desc: "Changes in our government and laws have won the native peoples over. If we stay the course, they will keep supporting us."
 BRA_idea_new_wave_ideas: "New Wave Ideas"
 BRA_idea_new_wave_ideas_desc: "The time has come to establish ourselves as a new power on the world stage. People across Brazil are backing a wave of new ideas as we define the way forward for our country."
 BRA_idea_restricted_travelers: "Restricted Travelers"
 BRA_idea_restricted_travelers_desc: "The flood of foreign travelers into our country is finally being halted. A number of regulations and restrictions now limit how many may enter."
 BRA_idea_extensive_border_control: "Extensive Border Controls"
 BRA_idea_extensive_border_control_desc: "Heavy controls along our borders keep out migrants from abroad, and the sense of order helps steady the country. The checks slow the work of government and tilt the public toward the nationalist right."
 BRA_idea_diplomatic_powerhouse: "Diplomatic Powerhouse"
 BRA_idea_diplomatic_powerhouse_desc: "Brazil has established itself as a diplomatic powerhouse. Our strength lies not only in our military prowess but also in our standing abroad."
 BRA_idea_the_international_mediator: "International Mediator"
 BRA_idea_the_international_mediator_desc: "As the largest country in South America, Brazil is uninvolved in most global politics and has little to gain from taking sides. That lets us mediate the toughest disputes where others cannot be impartial. Our place between East and West lets us mediate between many parties."
 BRA_idea_minustah_mission: "Stabilization Mission in Haiti"
 BRA_idea_minustah_mission_desc: "Brazilian officers command the United Nations force in Port-au-Prince. The mission raises our standing in capitals far from South America and keeps our diplomats busy."
 BRA_idea_a_global_power: "A Global Power"
 BRA_idea_a_global_power_desc: "Our country is world-renowned and recognized as one of the great powers of the globe. Our rich history, tumultuous moments included, puts us on par with many other nations of our caliber. It is time to take our place in the world as a new global power."
 # Military
 BRA_idea_imbel: "IMBEL"
 BRA_idea_imbel_desc: "Indústria de Material Bélico do Brasil (IMBEL, the Brazilian War Materiel Industry) is the government's primary defense contractor. It descends from the Fábrica de Canos e Sabres para Armas Portáteis of the early 1930s, and Law no. 6227 formally established it in the late 1970s to promote the war materiel industry."
 BRA_idea_modern_artillery: "Modern Artillery"
 BRA_idea_modern_artillery_desc: "Brazilian firms such as Avibras, maker of the ASTROS rocket launcher, give us a home-grown base for artillery. Modern guns and rockets built in our own factories cost us less to buy and make our army more dangerous at range."
 BRA_idea_strength_on_land: "Strength on Land"
 BRA_idea_strength_on_land_desc: "Our army has put land power first. Better logistics and sharper staff work let our columns cross rough terrain with fewer losses and plan their next move faster."
 BRA_idea_modern_armor: "Modern Armor"
 BRA_idea_modern_armor_desc: "Our armored corps needs to be modernized with the newest tech available either from the market or from production here at home."
 BRA_idea_braco_forte_mao_amiga: "Braço Forte Mão Amiga"
 BRA_idea_braco_forte_mao_amiga_desc: "The motto of the Brazilian Army, \"Braço Forte, Mão Amiga\" (\"Strong Arm, Friendly Hand\"), stirs true nationalism and patriotism. The military is one of Brazil's proudest institutions, and we must keep it large enough to honor its history, from the War of Independence to the recent incursions by the Revolutionary Armed Forces of Colombia. We will embody the motto with a strong arm and a friendly hand to all who do not oppose us."
 BRA_idea_underwater_flotilla: "Underwater Flotilla"
 BRA_idea_underwater_flotilla_desc: "A larger submarine flotilla extends our reach beneath the Atlantic."
 BRA_idea_reform_the_navy: "Reform the Navy"
 BRA_idea_reform_the_navy_desc: "Lessons from past mistakes and from other navies are making our fleet stronger and more efficient."
 BRA_idea_french_naval_studies: "French Naval Studies"
 BRA_idea_french_naval_studies_desc: "Our naval officers and engineers are studying French doctrine and shipbuilding."
 BRA_idea_protegendo_nossas_riquezas: "Protegendo Nossas Riquezas"
 BRA_idea_protegendo_nossas_riquezas_desc: "Our fleet now guards the Blue Amazon, the waters that hold our offshore oil and carry most of our trade. Stronger air defenses and better coordination let it fight as one."
 # MERCOSUR
 BRA_idea_associate_states: "Associated Mercosur Member State"
 BRA_idea_associate_states_desc: "[THIS.GetNameWithFlag] is an associated state of Mercosur. It may speak and be heard in the organization but is not a full voting member of the bloc."
 # Mercosur/UNSAUL Diplomacy Ideas
 BRA_idea_eu_trade_agreement: "EU Trade Agreement"
 BRA_idea_eu_trade_agreement_desc: "Our trade agreement with the European Union gives exporters easier access to the European market for soy, beef, and manufactured goods. It also raises our standing with trading partners everywhere."
 # 2018 Ideas
 BRA_idea_olavo_de_carvalho: "Olavo de Carvalho"
 BRA_idea_olavo_de_carvalho_desc: "The ideas of Olavo de Carvalho have taken root in our government and shape its conservative policy."
 BRA_idea_improved_military_conditions: "Improved Military Conditions"
 BRA_idea_improved_military_conditions_desc: "Better equipment, training, and conditions have raised our army's readiness and morale."
 BRA_idea_volunteer_reformation: "Volunteer Reformation"
 BRA_idea_volunteer_reformation_desc: "Better pay, career prospects, and propaganda are drawing more volunteers to a more professional military."
 BRA_idea_harsher_conscription: "Harsher Conscription"
 BRA_idea_harsher_conscription_desc: "Stricter conscription keeps more soldiers in uniform past their first year."
 BRA_idea_nationalism_rise: "A Broken Party"
 BRA_idea_nationalism_rise_desc: "Following the arrests of several prominent Workers' Party figures, including former president Luiz Inácio Lula da Silva, the party is rapidly losing approval and power as new right-wing movements rise."
 BRA_idea_nationalism_rise2: "Nationalism Rising"
 BRA_idea_nationalism_rise2_desc: "The collapse of the Workers' Party has fueled a nationalist movement that is gaining ground across the country."
 BRA_idea_globo_influence: "Influence in Globo"
 BRA_idea_globo_influence_desc: "Our government has won influence over the Globo Network, and its coverage now favors us."
 BRA_idea_opposition_media: "Globo in Opposition"
 BRA_idea_opposition_media_desc: "Most of the media, especially the Globo Network, attacks the government at every turn."
 BRA_idea_globo_disbanded: "Globo Disbanded"
 BRA_idea_globo_disbanded_desc: "We have shut down the Globo Network, leaving the media silenced and the country on edge."
 BRA_idea_nationalised_globo: "Nationalized Globo"
 BRA_idea_nationalised_globo_desc: "The Globo Network is now state property, and its wide viewership works for the government."
 BRA_idea_christian_values: "Christian Values"
 BRA_idea_christian_values_desc: "Brazil has more Catholics than any other country, and evangelical churches are growing fast. Reinforcing Christian values in government and public life gives our rule steadier support and pulls politics toward the nationalist right."
 BRA_idea_tax_reformation: "Tax Reforms"
 BRA_idea_tax_reformation_desc: "A series of targeted and well-thought-out tax reforms have been passed, spurring economic growth in many sectors of the Brazilian economy."
 BRA_idea_monarchism: "Monarchist Ideals"
 BRA_idea_monarchism_desc: "Monarchist ideals follow conservative and nationalist thought and hold that a monarchy should govern and keep the old values."
 BRA_idea_electoral_media: "Electoral Media"
 BRA_idea_electoral_media_desc: "Social media is a tool for a new age. We must exploit it to win our upcoming election."
 BRA_idea_car_wash: "Operation Car Wash"
 BRA_idea_car_wash_desc: "What began with cash laundered through a car wash in Brasília has become the largest corruption inquiry in our history. Every plea deal names someone new, and no party knows whether it is next."
 BRA_idea_lula_in_custody: "Lula in Custody"
 BRA_idea_lula_in_custody_desc: "Lula is serving his sentence in a Federal Police cell in Curitiba while his lawyers file appeal after appeal. Supporters camp outside the building, and the Workers' Party must pick another candidate."
 BRA_idea_lula_conviction_pending: "Lula's Conviction Stands"
 BRA_idea_lula_conviction_pending_desc: "Lula has walked out of prison, but his conviction still keeps him off the ballot. Until a court overturns it, the Workers' Party needs someone else at the top of the ticket."
 BRA_idea_liberalism: "Brazilian Liberalism"
 BRA_idea_liberalism_desc: "Liberal ideas of individual rights and free markets guide our government. Confidence in the rules of the game steadies the country, wins public support, and keeps the democratic center strong against both extremes."
 BRA_idea_social_democracy: "Brazilian Social Democracy"
 BRA_idea_social_democracy_desc: "Social democratic policies are humanizing our capitalism and strengthening our democracy. Cooperation among workers, firms, and the state keeps our factories efficient and our democratic center together."
 BRA_idea_new_coalition: "The New Coalition"
 BRA_idea_new_coalition_desc: "The left-wing coalition of the Workers' Party, the PCdoB, the PPS, and the PSTU acts as one bloc. Shared discipline lifts morale, steadies the government, and pulls the country toward the left."
 BRA_idea_pro_psdb_youth: "Pro-PSDB Youth"
 BRA_idea_pro_psdb_youth_desc: "Students and young professionals have embraced the PSDB's message of competence and reform. Their volunteers fill our rallies and give the government a lift at home."
 BRA_idea_federalization: "Federalization"
 BRA_idea_federalization_desc: "Federalism has given the states more room to develop their own resources and industries."
 BRA_idea_mensalao: "Mensalão"
 BRA_idea_mensalao_desc: "Monthly payments to allied deputies keep our bills moving through Congress. Every payment also leaves a record, and not every ally will stay quiet."
 BRA_idea_public_pension_reform: "Public Pension Reform"
 BRA_idea_public_pension_reform_desc: "Public servants now retire later and contribute more. The savings arrive slowly, and the anger in the unions arrived at once."
 BRA_idea_pt_dissidents: "Workers' Party Dissidents"
 BRA_idea_pt_dissidents_desc: "Heloísa Helena and the deputies expelled over the pension vote have founded the Socialism and Liberty Party. Every vote they win comes from our left flank."
 BRA_idea_oil_royalties_public_services: "Oil Royalties for Public Services"
 BRA_idea_oil_royalties_public_services_desc: "By law, most pre-salt royalties now flow to schools and clinics. Oil money is building classrooms instead of covering deficits."
 BRA_idea_mining_royalty_cut: "Lower Mining Royalties"
 BRA_idea_mining_royalty_cut_desc: "Lower royalty rates leave mining companies with more money to put back into their mines."
 BRA_idea_tailings_dam_retrofits: "Tailings Dam Retrofits"
 BRA_idea_tailings_dam_retrofits_desc: "Crews are draining the old upstream dams in Minas Gerais, and some iron mines have cut output until the work is done."
 BRA_idea_domestic_potash: "Domestic Potash"
 BRA_idea_domestic_potash_desc: "Potash from Autazes reaches our farms without the long voyage from Canada and Russia, and fertilizer costs less."
 BRA_idea_domestic_uranium: "Domestic Uranium"
 BRA_idea_domestic_uranium_desc: "Ore from Caetité supplies part of the fuel for our reactors at Angra."
 BRA_idea_domestic_uranium_2: "Uranium Self-Sufficiency"
 BRA_idea_domestic_uranium_2_desc: "With Caetité and Santa Quitéria both in production, our reactors run mostly on Brazilian uranium."
 BRA_idea_sugarcane_ethanol: "Sugarcane Ethanol Rollout"
 BRA_idea_sugarcane_ethanol_desc: "Most new cars in Brazil run on gasoline, ethanol, or any mix of the two. Mills across São Paulo are racing to fill the pumps."
 BRA_idea_flex_fuel_fleet: "Flex-Fuel Fleet"
 BRA_idea_flex_fuel_fleet_desc: "Most of our cars can run on gasoline, ethanol, or any mix of the two. When gasoline runs short, drivers can turn to the mills instead of the import terminals."
 BRA_idea_ethanol_exports: "Ethanol Export Drive"
 BRA_idea_ethanol_exports_desc: "Foreign buyers are signing contracts for Brazilian ethanol, and mills across the sugarcane belt are expanding to fill them."
 BRA_rffsa_legacy: "The RFFSA Legacy"
 BRA_rffsa_legacy_desc: "The federal railway company RFFSA was broken up and sold off in the 1990s, and the concession holders have run freight on a handful of profitable corridors ever since. Passenger service withered and whole regions were left with rusting track. We must take stock of the network we inherited before we can decide how to repair it."
 BRA_valec_railway_plan: "Valec Takes the Lead"
 BRA_valec_railway_plan_desc: "Valec, the state railway builder, can lay track where no private operator will go. Public money, public engineers, and public ownership of the new lines will rebuild what the old Rede Ferroviária Federal once ran. The cost is ours to carry."
 BRA_rail_concession_model: "Auction the Rail Concessions"
 BRA_rail_concession_model_desc: "Why should the Treasury lay every kilometer of track? We will offer new lines and old corridors to private operators in open auctions and let investors carry the risk. The bidding will fill our coffers while the winners do the building."
 BRA_ferrovia_norte_sul: "Ferrovia Norte-Sul"
 BRA_ferrovia_norte_sul_desc: "The North-South Railway runs from Açailândia in Maranhão through Tocantins and Goiás toward the factories of São Paulo. Soy, corn, and iron ore from the interior will finally have a rail route to the sea. Work that dragged on for decades will be pushed to completion."
 BRA_rail_concession_renewal: "Early Renewal of the Concessions"
 BRA_rail_concession_renewal_desc: "The private operators of our freight corridors, such as MRS in the southeast, hold concessions that run out in the late 2020s. We will renew them early in exchange for binding investment pledges, so the money arrives years before the old contracts end."
 BRA_northeast_railways: "The Northeastern Railways"
 BRA_northeast_railways_desc: "The Transnordestina line is meant to carry the interior of Piauí to the ports of Pecém and Suape. Beside it, the West-East Integration Railway, FIOL, will link Tocantins to the coast at Ilhéus. Projects like these are announced with great fanfare and then left unfinished. We will finish ours."
 BRA_ferrograo: "The Ferrogrão"
 BRA_ferrograo_desc: "The Ferrogrão would run about 930 kilometers from the soy fields of Sinop in Mato Grosso to the river port of Miritituba in Pará, taking grain trucks off the BR-163 highway. Grain traders such as Cargill and Bunge would put money behind it. We will let them build."
 BRA_trem_de_alta_velocidade: "Trem de Alta Velocidade"
 BRA_trem_de_alta_velocidade_desc: "A high-speed line between Rio de Janeiro and São Paulo would join our two largest cities in about ninety minutes. It would be the most expensive railway Brazil has ever contemplated, and we mean to build it."
 BRA_padis_incentives: "PADIS Semiconductor Incentives"
 BRA_padis_incentives_desc: "The PADIS program cuts taxes for companies that design and package semiconductors in Brazil. We will fund it in earnest and set our universities to training the engineers a chip industry needs."
 BRA_expand_ceitec: "Expand CEITEC"
 BRA_expand_ceitec_desc: "CEITEC, our state-owned chip company in Porto Alegre, can make RFID tags for cattle tracking and electronic passports, and it would be the one chip maker in Brazil that answers to us. We will give it money, staff, and a mandate to grow."
 BRA_privatize_ceitec: "Privatize CEITEC"
 BRA_privatize_ceitec_desc: "A state-owned chip company is a costly way to make RFID tags that Asian factories sell for less. We will wind CEITEC down or sell it, and let private capital decide what a Brazilian chip industry should be."
 BRA_ceitec_porto_alegre_fab: "A Fab in Porto Alegre"
 BRA_ceitec_porto_alegre_fab_desc: "Rio Grande do Sul has the engineers and the university ties that a modern fab needs. We will build a proper fabrication plant in Porto Alegre, so that Brazilian chips are made in Brazil from start to finish."
 BRA_foreign_chipmaker_partnership: "Courting Foreign Chipmakers"
 BRA_foreign_chipmaker_partnership_desc: "Foreign chipmakers want a foothold in the largest market in Latin America. We will invite foreign governments and companies to build a fabrication plant in São Paulo at their own expense. In return, they will take a share of its export revenue, and many Brazilians will resent seeing the industry handed to outsiders."
 BRA_brasil_semicon: "Brasil Semicon"
 BRA_brasil_semicon_desc: "A national semiconductor plan would give Brazil's chip makers one set of goals and one source of support. We will fund design houses, packaging plants, and the universities that feed them, and make the program outlast any single government."
 BRA_idea_neglected_railways: "A Neglected Rail Network"
 BRA_idea_neglected_railways_desc: "Brazil moves most of its freight by truck. The railways that remain are a patchwork of broken-up RFFSA lines, mixed gauges, and single-track corridors that serve mines and ports but little else. Every harvest and every shipment pays for it.\n§W--------------§!\nThis national spirit will §GImprove§! if we complete the §Y$BRA_rffsa_legacy$§! focus."
 BRA_idea_neglected_railways2: "A Rail Network Under Repair"
 BRA_idea_neglected_railways2_desc: "We have surveyed the old RFFSA lines and begun emergency repairs. Gauges still differ from region to region, and too many corridors still end at a port or a mine. The worst of the neglect is behind us.\n§W--------------§!\nThis national spirit will §GImprove§! if we complete the §Y$BRA_valec_railway_plan$§! or §Y$BRA_rail_concession_model$§! focus."
 BRA_idea_neglected_railways3: "A Rail Network Catching Up"
 BRA_idea_neglected_railways3_desc: "New lines and new operators are changing how the country moves its goods, but the interior and the northeast still wait for their railways. A few more years of building should close the gap.\n§W--------------§!\nThis national spirit will be §RRemoved§! if we complete the §Y$BRA_northeast_railways$§! or §Y$BRA_ferrograo$§! focus."
 BRA_idea_padis_extension: "PADIS Extension"
 BRA_idea_padis_extension_desc: "Extended tax relief under the PADIS program keeps our chip designers and packagers competitive and funds more research."
 BRA_idea_agrarian_reform: "Agrarian Reform"
 BRA_idea_agrarian_reform_desc: "Agrarian reform is moving land from idle estates into the hands of families who will farm it. Rural workers now have a stake in our government, and the countryside is calmer for it."
 BRA_idea_space: "Brazilian Space Efforts"
 BRA_idea_space_desc: "Our space program, with launches from the equatorial base at Alcântara, trains engineers and feeds research in every field it touches. Each success raises Brazil's standing abroad and our confidence at home."
 BRA_idea_lulismo: "Lulismo"
 BRA_idea_lulismo_desc: "Lulismo's controlled reformism keeps the poorest Brazilians behind the Workers' Party."
 BRA_idea_bolsonarismo: "Bolsonarismo"
 BRA_idea_bolsonarismo_desc: "Bolsonarismo has turned evangelicals, farmers, gun owners, and police and military families into one movement behind our government. Its followers are loud, loyal, and quick to defend the president, and they keep the nationalist camp growing."
 BRA_idea_guns_allowed: "Guns Allowed"
 BRA_idea_guns_allowed_desc: "Our government has restored easy access to guns for Brazilian citizens. Armed civilians back us and would make an invader's work harder on our own soil, though the policy costs us room to maneuver in politics."
 BRA_idea_mbl: "MBL"
 BRA_idea_mbl_desc: "The Free Brazil Movement (MBL) is a liberal movement founded in 2014. It began as an offshoot of the Brazilian branch of Students for Liberty and grew amid the political dissatisfaction that followed the 2013 protests, with funding from foreign and domestic sources. Its best-known leader is the activist and lawmaker Kim Kataguiri."
 BRA_idea_fight_influence: "Fighting Foreign Influence"
 BRA_idea_fight_influence_desc: "Foreign money, media, and diplomats have too much sway in our politics, and we mean to check it. Closer scrutiny of outside interests makes it harder for other governments to meddle at home, though the extra red tape slows our own decisions."
 BRA_idea_parties_left: "Parties of the Left"
 BRA_idea_parties_left_desc: "The PT and its allies on the left have agreed to govern together instead of splitting the vote. The partnership keeps the left pulling in one direction, but every decision takes longer to negotiate."
 BRA_idea_pax_brasilis: "Pax Brasilis"
 BRA_idea_pax_brasilis_desc: "Brazil's leadership in Latin America is uncontested, and neighbors look to Brasília to settle disputes before they turn violent. That standing steadies us at home, lets us send volunteers to friends in need, and stirs up less alarm abroad when we make our moves."
 BRA_idea_bolsonaro_conservative_influence: "Conservative Support"
 BRA_idea_bolsonaro_conservative_influence_desc: "Evangelical churches, rural landowners, and security-minded voters form the conservative core of Bolsonaro's coalition. Keeping them satisfied steadies our government and pulls politics toward the nationalist right."
 BRA_idea_bolsonaro_liberal_influence: "Liberal Support"
 BRA_idea_bolsonaro_liberal_influence_desc: "Free-market economists and business-minded voters backed Bolsonaro for his promises of privatization, lower taxes, and less red tape. Their support speeds up construction and ties the business community to our government."
 BRA_idea_supporting_private_sector: "Private Sector Support"
 BRA_idea_supporting_private_sector_desc: "Government support has freed the private sector to build and extract at a faster pace."
 BRA_idea_supporting_military: "Military Support"
 BRA_idea_supporting_military_desc: "Our government supports the military, and the armed forces repay us with loyalty. Better supply lets units refill their ranks faster in the field."
 BRA_idea_brazilian_space_force: "Brazilian Space Force"
 BRA_idea_brazilian_space_force_desc: "The Brazilian people must be defended at all costs: on land, at sea, in the air, and on our new frontier. We must establish the Brazilian Space Force as a new military branch to handle the defense of all our assets both within and beyond the atmosphere."
 BRA_idea_support_from_the_teachers: "Support from the Teachers"
 BRA_idea_support_from_the_teachers_desc: "Teachers' unions, university professors, and researchers have thrown their weight behind Lula's government and its education agenda. Their backing steadies the country and speeds up work in our schools and labs."
 BRA_idea_scientific_advances: "Scientific Advances"
 BRA_idea_scientific_advances_desc: "Investment in science is paying off in new discoveries, new products, and public confidence in what the country can do. Labs and universities work faster, and the government finds it easier to carry the public with it."
 BRA_idea_education_reforms: "Education Reforms"
 BRA_idea_education_reforms_desc: "Education reforms are showing in better classrooms and busier labs. Students and parents notice, and both the government's standing and the country's research improve."
 BRA_idea_imperial_university: "Imperial University"
 BRA_idea_imperial_university_desc: "The Imperial University is training a new generation of scholars to lead our research and government."
 BRA_idea_trained_pilots: "Trained Pilots"
 BRA_idea_trained_pilots_desc: "Live flight training has made our pilots more agile in the air."
 BRA_idea_psl_growth: "Rise of the PSL"
 BRA_idea_psl_growth_desc: "The Social Liberal Party is gaining massive traction. It is on the rise and, on its current path, is heading for victory in the next election."
 BRA_idea_brazil_energy: "Green Energy"
 BRA_idea_brazil_energy_desc: "Government-led initiatives have expanded green energy as we move toward a greener country. The programs are already paying off as solar and wind companies build out our green infrastructure and add power to the grid."

 # Custom Tooltips
 BRA_legalize_independent_amazonian_development_tt: "We will legalize §YIndependent Private Development§! of the Amazon rainforest and of the states that contain parts of it.\n\nLegalizing §YIndependent Private Development§! means we will get events in which private companies develop the Amazon, giving free §YIndustries§!, resources, and more at the cost of §YConserved Acreage§!.\n"
 BRA_flavour_event.1_tt: "The Federal Police will become involved, pinning their reputation on the outcome of this case."
 BRA_rise_of_bolsonaro_tt: "§YJair Bolsonaro§! will now be the §GPresident of Brazil§!"
 BRA_paulo_guedes_tt: "Begins the §YEconomic Missions§! of §YPaulo Guedes§!."
 BRA_add_pt_annex_parties_tt: "The §Y[anarchist_communism_L]§! absorbs the smaller left-wing parties and gains §G+25.00%§! Popularity (Relative Popularity)\n"
 BRA_coalition_dem_one_tt: "The §Y[liberalism_L]§! and the §Y[conservatism_L]§! form a §Gcoalition§!\n"
 BRA_coalition_dem_tt: "The §Y[Nat_Populism_L]§! and the §Y[conservatism_L]§! form a §Gcoalition§!\n"
 BRA_coalition_prtb_tt: "The §Y[reactionary_L]§! will join our coalition!"
 BRA_coalition_dem_psdb_tt: "The §Y[Nat_Populism_L]§!, the §Y[conservatism_L]§!, and the §Y[liberalism_L]§! form a §Gcoalition§!\n"
 BRA_restauration_empire_TT: "The §Y[Monarchist_L]§! gains §G+10.00%§! Popularity (Relative Popularity)\n§YBrazil§! will be known as the §YEmpire of Brazil§!.\nThe Empire will be restored, with §YLuiz I§! on the throne."
 BRA_pt_win: "§YPT Won the Election§!"
 BRA_psl_win: "§YPSL Won the Election§!"
 BRA_psdb_win: "§YPSDB Won the Election§!"
 BRA_pdt_coalition_tt: "The §Y[socialism_L]§! will join our coalition!"
 BRA_mdb_coalition_tt: "The §Y[oligarchism_L]§! will join our coalition!"
 BRA_new_coalition_tt: "The §Y[neutral_Social_L]§!, the §Y[Neutral_Communism_L]§! and the §Y[communist_state_L]§! will join our coalition!"
 BRA_bolsonaro_influence_tt: "Bolsonaro §Gexpands his influence§!"
 BRA_nationalism_rise_TT: "§YA Broken Party§! will be replaced with §YNationalism Rising§!\n§RStronger nationalist drift, weaker democratic drift, and higher Political Power costs§!"
 BRA_mensalao_inquiry_tt: "In §Y90 days§!, Congress opens an inquiry into the payments. Handing over the records can open §YOperation Car Wash§! early."
 BRA_special_election_tt: "The next scheduled presidential election becomes a three-way race between the §YWorkers' Party§!, the §YSocial Liberal Party§!, and the §YPSDB§!."
 BRA_car_wash_permanent_tt: "§YOperation Car Wash§! keeps its current strength and will not expire again.\n"
 BRA_integrity_reforms_tt: "We complete one §Yintegrity reform§!. Two reforms improve the §YJeitinho§! one tier. Four reforms improve it again once our §Y$education_budget$§! is set to §Y$edu_04_neutral$§! or higher."
 BRA_integrity_reforms_4_tt: "We have completed at least §Y4§! integrity reforms (Current: [?BRA_integrity_reforms|0Y])"
 BRA_car_wash_scheme_tt: "We took part in a corruption scheme such as the §YMensalão§! or the contractors' club at Petrobras, or prosecutors hold evidence from a plea deal"
 BRA_no_scheme_tt: "We have taken part in no corruption scheme and prosecutors hold no evidence from a plea deal"
 BRA_car_wash_evidence_tt: "Prosecutors keep the testimony. It can open §YOperation Car Wash§!, no earlier than March 2014."
 BRA_petrolao_scheme_tt: "We become part of the contractors' scheme at Petrobras. Prosecutors can use it to open §YOperation Car Wash§!, no earlier than March 2014."
 BRA_protest_strength_down_tt: "Reduce Protest Strength by §G15§! points."
 BRA_protest_strength_down_small_tt: "Reduce Protest Strength by §G10§! points."
 BRA_protest_strength_up_tt: "Increase Protest Strength by §R10§! points."
 BRA_coalition_strength_60_tt: "Our governing coalition holds at least §Y60%§! of Congress"
 BRA_debt_ratio_above_50_tt: "Our debt is above §Y50%§! of GDP"
 BRA_wild_acreage_above_50_tt: "More than §Y50 million§! acres of Amazon rainforest remain wild"
 BRA_fundo_amazonia_donor_tt: "§YNorway§! or §YGermany§! exists and is not at war with us"
 BRA_alignment_above_0_tt: "§YWorkers' Party Alignment§! is not fully on the §YRadical Wing§!"
 BRA_alignment_below_100_tt: "§YWorkers' Party Alignment§! is not fully on the §YReformist Wing§!"
 BRA_can_staff_industrial_complex_tt: "We have enough unemployed workers to staff an §YIndustrial Complex§! (needs §Y[?workers_per_civ_fac_display|2]K§!)"
 BRA_public_policy_category: "Brazilian Public Policy"
 BRA_public_policy_category_desc: "Red tape, rising debt, and five overlapping consumption taxes all hold back growth. Each reform costs political capital and needs a willing Congress. Abroad, peacekeeping missions, Embraer sales, BNDES credit to our neighbors, and our partnership with India and South Africa carry our policy further."
 BRA_decision_jeitinho_formalization: "Launch Microentrepreneur Registration"
 BRA_decision_jeitinho_formalization_desc: "Let street vendors, hairdressers, and other informal workers register a business for a small monthly fee. Better schools, cleaner offices, and a record of integrity reforms give the program a chance to work."
 BRA_decision_portal_da_transparencia: "Launch the Transparency Portal"
 BRA_decision_portal_da_transparencia_desc: "The Comptroller General's Office can publish every federal payment online and audit municipal budgets by lottery. Journalists and prosecutors will find more to report, and the audits are not cheap."
 BRA_decision_ficha_limpa: "Sign the Clean Record Law"
 BRA_decision_ficha_limpa_desc: "More than a million citizens have signed a petition to bar politicians convicted by appeals courts from running for office. Many incumbents fear this law more than any court."
 BRA_decision_access_to_information_law: "Enact the Access to Information Law"
 BRA_decision_access_to_information_law_desc: "Every citizen could request government records, and agencies would have to answer within weeks. Ministries dread what the files will show, and so does the party in power."
 BRA_decision_clean_company_act: "Pass the Clean Company Act"
 BRA_decision_clean_company_act_desc: "After the 2013 protests, Congress wants companies to answer for the bribes they pay. Firms would face heavy fines or settle through leniency agreements, and business groups warn that the law will frighten off investors."
 BRA_decision_fiscal_framework: "Debate a New Fiscal Framework"
 BRA_decision_fiscal_framework_desc: "Debt is growing faster than the economy. Congress is ready to write a spending rule, but the leading drafts would bind future governments in very different ways."
 BRA_decision_harmonize_consumption_taxes: "Harmonize Consumption Taxes"
 BRA_decision_harmonize_consumption_taxes_desc: "Replace five overlapping consumption taxes with a dual value-added tax, one federal and one shared by states and municipalities. The states want compensation for the revenue they fear losing."
 BRA_decision_belem_conservation_plan: "Sign the Belém Forest Pact"
 BRA_decision_belem_conservation_plan_desc: "Governors, mayors, and Indigenous leaders have gathered in Belém to protect the standing forest of Pará. Federal money would turn their pledges into patrolled reserves."
 BRA_decision_fundo_amazonia: "Launch the Amazon Fund"
 BRA_decision_fundo_amazonia_desc: "The BNDES can run a fund that takes foreign donations and spends them on protecting standing forest. Norway and Germany have shown interest, but donors want proof that we are already protecting the forest."
 BRA_decision_fund_ibama_rangers: "Expand the IBAMA Ranger Corps"
 BRA_decision_fund_ibama_rangers_desc: "IBAMA's field offices in Manaus and Belém lack rangers and boats, and INPE's satellite alerts go unanswered for weeks. Hiring more rangers and clearing the land registry backlog would turn contested forest into protected reserve."
 BRA_decision_crack_down_on_illegal_logging: "Crack Down on Illegal Logging"
 BRA_decision_crack_down_on_illegal_logging_desc: "Sawmills along the BR-163 and the Transamazonian Highway turn stolen timber into legal lumber with forged permits. Federal Police raids and seized equipment would make illegal logging a poor business."
 BRA_decision_fund_reforestation_grants: "Fund Reforestation Grants"
 BRA_decision_fund_reforestation_grants_desc: "Ranchers in Rondônia and Mato Grosso hold thousands of hectares of exhausted pasture. Grants from the BNDES-run Amazon Fund would pay them to plant native trees instead."
 BRA_decision_relax_clearing_permits: "Relax Forest Clearing Permits"
 BRA_decision_relax_clearing_permits_desc: "Ranchers and soy growers in Mato Grosso and Pará have waited years for clearing permits. Approving them in bulk would fill the state coffers with licensing fees and win us friends in the agribusiness caucus."
 BRA_conversion_rate_below_20_tt: "Our §YConserved Rainforest Acreage Conversion Rate§! is below §Y20§! (Current: [?BRA_acres_conserved_change|Y])"
 BRA_loss_rate_above_25_tt: "Our §YWild Rainforest Acreage Monthly Loss§! is above §Y25§! (Current: [?BRA_acre_rate_loss|Y])"
 BRA_gain_rate_below_125_tt: "Our §YWild Rainforest Acreage Monthly Gain§! is below §Y125§! (Current: [?BRA_acre_rate_gain|Y])"
 BRA_loss_rate_below_105_tt: "Our §YWild Rainforest Acreage Monthly Loss§! is below §Y105§! (Current: [?BRA_acre_rate_loss|Y])"
 BRA_decision_carajas_mineral_processing: "Process Carajás Copper and Nickel"
 BRA_decision_carajas_mineral_processing_desc: "Copper from Sossego and nickel from Onça Puma leave Pará as raw ore. Smelters near the mines would keep more of the value, and the jobs, in the state."
 MER_propose_singapore_trade: "Ratify the Mercosur–Singapore Agreement"
 MER_propose_singapore_trade_desc: "Our negotiators have reached a free trade deal with Singapore, Mercosur's first in Southeast Asia. Congress can ratify it now and send it to Singapore for approval."
 MER_propose_argentina_local_currency_trade: "Propose Local-Currency Trade with Argentina"
 MER_propose_argentina_local_currency_trade_desc: "Our exporters lose money every time they buy dollars to settle a bill in Buenos Aires. A local-currency payment system would let them invoice in reais or pesos."
 MER_offer_focem_pilot: "Offer Paraguay a FOCEM Project"
 MER_offer_focem_pilot_desc: "The Mercosur Structural Convergence Fund exists to close the gap between the bloc's richest and poorest members. Offer to pay for most of a new road around Asunción."
 BRA_car_wash_category: "Operation Car Wash"
 BRA_car_wash_category_desc: "Prosecutors in Curitiba are following the money from Petrobras into Congress and across our borders. We can fund the work and share the evidence, but the courts decide who falls."
 BRA_car_wash_submit_lula_case: "Forward Lula's Case to Prosecutors"
 BRA_car_wash_submit_lula_case_desc: "Investigators say the builder OAS renovated a beachfront apartment in Guarujá as a favor to Lula. The former president denies he ever owned it. Prosecutors want the file."
 BRA_car_wash_share_odebrecht_evidence: "Send the Odebrecht Records to [FROM.GetName]"
 BRA_car_wash_share_odebrecht_evidence_desc: "Odebrecht's own ledgers list payments to officials in [FROM.GetName]. Sharing them would let prosecutors there review the contracts under their own laws."
 BRA_pro_bolsonaro_parties_tt: "The §Y[Nat_Populism_L]§!, §Y[reactionary_L]§!, the §Y[Monarchist_L]§! and the §Y[Nat_Autocracy_L]§! get a boost in their §GPopularity§!\n"
 BRA_conserv_acreage_effect_tt: "Changes §YTotal Conserved Rainforest Acreage§! by [?temp_change|+] (Current Conserved Rainforest Acreage: [?BRA_acres_conserved|Y])"
 BRA_wild_acreage_effect_tt: "Changes §YTotal Wild Rainforest Acreage§! by [?temp_change|+] (Current Wild Rainforest Acreage: [?BRA_acres_wild|Y])"
 BRA_target_acreage_effect_tt: "Changes §YTotal Targeted Rainforest Acreage§! by [?temp_change|+] (Current Targeted Rainforest Acreage: [?BRA_acres_target|Y])"
 BRA_acre_rate_gain_effect_tt: "Changes §YTotal Wild Rainforest Acreage Monthly Gain§! by [?temp_change|+] (Current Wild Rainforest Acreage Monthly Gain: [?BRA_acre_rate_gain|Y])"
 BRA_acre_rate_loss_effect_tt: "Changes §YTotal Wild Rainforest Acreage Monthly Loss§! by [?temp_change|-] (Current Wild Rainforest Acreage Monthly Loss: [?BRA_acre_rate_loss|Y])"
 BRA_acres_conserved_change_effect_tt: "Changes §YConserved Rainforest Acreage Conversion Rate§! by [?temp_change|+] (Current Conserved Rainforest Acreage Conversion Rate: [?BRA_acres_conserved_change|Y])"
 BRA_amazonian_high_command_tt: "Establishes the §YAmazonian High Command§!, allowing us to use the military in events related to the §YAmazon Rainforest§!\n"
 BRA_has_conserved_acreage_x_tt: "Has §YTotal Conserved Rainforest Acreage§! of [?needed_acreage|0Y] or higher (Current Conserved Rainforest Acreage: [?BRA_acres_conserved|Y])"
 BRA_has_wild_acreage_x_tt: "Has §YTotal Wild Rainforest Acreage§! of [?needed_acreage|0Y] or higher (Current Wild Rainforest Acreage: [?BRA_acres_wild|Y])"
 # Custom Diplomatic Relations
 nestor_forster_embassador: "Nestor Forster as Ambassador"
 eduardo_bolsonaro_embassador: "Eduardo Bolsonaro as Ambassador"

 ### Decisions
 # Workers Party Alignment - Decision Category
 BRA_workers_party_alignment_decision_category: "Workers' Party Alignment"
 BRA_workers_party_alignment_decision_category_desc: "The Workers' Party must choose how far to go in changing Brazil. The radical wing pushes for sweeping change. The reformist wing favors gradual reform and a broader coalition."
 BRA_pt_alignment_bop: "Workers' Party Alignment"
 BRA_pt_radical_side: "Radical Wing"
 BRA_pt_reformist_side: "Reformist Wing"
 BRA_pt_left_win_range: "Neo-Communist Party Alignment"
 BRA_pt_left_advanced_range: "Radical Leftist Party Alignment"
 BRA_pt_left_low_range: "Slightly Radical Party Alignment"
 BRA_pt_mid_range: "Well-Balanced Party Alignment"
 BRA_pt_right_low_range: "Slightly Reformist Party Alignment"
 BRA_pt_right_advanced_range: "Modern Reformist Party Alignment"
 BRA_pt_right_win_range: "Party of Progress"
 BRA_decision_support_radicals: "Support Radicals"
 BRA_decision_support_radicals_desc: "The party's radical wing wants faster change and fewer concessions to the market. Giving it more say in setting our agenda shifts the Workers' Party alignment toward the Radical Wing and pulls our policy with it."
 BRA_decision_support_reformists: "Support Reformists"
 BRA_decision_support_reformists_desc: "Reformists in the party prefer gradual change, alliances with other parties, and respect for the rules of the market. Building support for them shifts the Workers' Party alignment toward the Reformist Wing and pulls our policy toward the center."
 # Bolsonaro Alignment
 BRA_bolsonaro_alignment_decision_category: "Bolsonaro Alignment"
 BRA_bolsonaro_alignment_decision_category_desc: "Bolsonaro and the conservatives have come to power. Conservatives and liberals backed him for different reasons, and our coalition holds together only if each wing gets something in return. These decisions let us reward them in turn. Will we keep our promises?"
 BRA_decision_gatter_conservative_support: "Gather Conservative Support"
 BRA_decision_gatter_conservative_support_desc: "Bolsonaro won office on the votes of evangelicals, farmers, and security-minded conservatives, and they expect to be heard. Spending political power on their causes will keep them behind us and keep the base from drifting to someone else."
 BRA_decision_gatter_liberal_support: "Gather Liberal Support"
 BRA_decision_gatter_liberal_support_desc: "The market-friendly liberals around Paulo Guedes backed Bolsonaro for his promises of privatization and a leaner state. We must deliver something for them too, or they will look elsewhere."
 BRA_decision_support_private_sector: "Support the Private Sector"
 BRA_decision_support_private_sector_desc: "Builders, miners, and farmers can get projects done faster than any ministry. Cutting red tape and steering BNDES credit their way will speed up construction and raise resource output."
 BRA_decision_support_militaries: "Support the Military"
 BRA_decision_support_militaries_desc: "The armed forces expect us to look after them, and our government leans on them for order and security. Better pay, housing, and supply for the ranks earn their loyalty, and well-supplied units refill their ranks faster in the field."
 BRA_decision_carajas_s11d: "Open the Carajás S11D Mine"
 BRA_decision_carajas_s11d_desc: "Beneath the Serra dos Carajás lies some of the richest iron ore on Earth. Vale's S11D project would dig it out, if the roads and rails of Pará can carry it to the coast."
 BRA_decision_hold_fuel_prices: "Hold Fuel Prices at the Pump"
 BRA_decision_hold_fuel_prices_desc: "We can order Petrobras to sell fuel below import prices for a year. The losses fall on the treasury, but drivers and truckers will feel the difference at the pump."
 BRA_decision_set_mining_royalties: "Set the Mining Royalty Rates"
 BRA_decision_set_mining_royalties_desc: "Our mining royalties are due for a review. Congress can raise the rates to fill the treasury or cut them to draw investment into our mines."
 BRA_decision_bahia_chromite: "Expand Chromite Mining in Bahia"
 BRA_decision_bahia_chromite_desc: "Most of our chromite comes from the Jacurici Valley in Bahia, where §YFerbasa§! mines it for ferrochrome. Federal support would let the company expand its mines."
 BRA_decision_goias_rare_earths: "Back the Serra Verde Rare Earth Mine"
 BRA_decision_goias_rare_earths_desc: "§YSerra Verde§! mines rare earths at Minaçu in Goiás. Expanding the mine would raise our output of rare metals, but we must decide who finances it."
 BRA_decision_flex_fuel_conversion: "Convert the National Fleet to Flex-Fuel"
 BRA_decision_flex_fuel_conversion_desc: "Volkswagen sold the first flex-fuel car in Brazil, the Gol Total Flex, in March 2003, and other carmakers soon followed. Tax breaks and credit for flex engines would put most of our fleet on gasoline, ethanol, or any mix of the two."
 BRA_decision_ethanol_export_push: "Launch an Ethanol Export Push"
 BRA_decision_ethanol_export_push_desc: "The United States and Brazil signed a biofuels memorandum in São Paulo on March 9, 2007, and together they made most of the world's ethanol. We can court foreign buyers and press for common standards that turn ethanol into a global commodity."
 BRA_decision_ethanol_fuel_emergency: "Run the Fleet on Ethanol"
 BRA_decision_ethanol_fuel_emergency_desc: "When oil prices spike or the pumps run dry, our flex-fuel cars can switch to ethanol. A year-long emergency program would raise blends, keep the mills at full output, and steer drivers to the cheaper fuel."
 BRA_oil_shock_tt: "An §Yenergy crisis§! is under way: the Iraq War oil crisis or a blocked Strait of Hormuz, a global oil price above §Y10§!, or no fuel left in our stocks"
 BRA_decision_scale_sugarcane_ethanol: "Expand Sugarcane Ethanol Distribution"
 BRA_decision_scale_sugarcane_ethanol_desc: "Flex-fuel cars can run on pure ethanol, if the fuel reaches the pump. Fund storage tanks and pipelines from the mills of São Paulo to the cities."
 BRA_decision_ht_micron_packaging: "Expand HT Micron in São Leopoldo"
 BRA_decision_ht_micron_packaging_desc: "§YHT Micron§! makes and tests memory chips in the Tecnosinos technology park of Unisinos. A federal partnership would add a microchip plant in Rio Grande do Sul and tie it to our national chip industry."
 BRA_decision_padis_extension: "Extend the PADIS Chip Incentives"
 BRA_decision_padis_extension_desc: "The §YPADIS§! program has cut taxes for Brazilian chip makers, and its benefits have been extended more than once. Another extension would keep the tax relief flowing to our designers and packagers and speed up their research."
 BRA_ceitec_not_liquidated_tt: "§YCEITEC§! has not been liquidated"
 BRA_ceitec_liquidated_tt: "We can no longer take the §YExpand CEITEC§! focus.\n"
 BRA_decision_aerostructure_composites: "Build an Aerostructures Composites Plant"
 BRA_decision_aerostructure_composites_desc: "§YAkaer§! of São José dos Campos designs major structures for the Gripen E, and §YEmbraer§! builds KC-390 structures in São José dos Campos and Botucatu. A composites plant in São Paulo would let us make more of that airframe work at home."
 BRA_national_development_category: "National Development"
 BRA_national_development_category_desc: "Our mines and cane fields feed the world's steelworks, smelters, and fuel tanks, and our canals, dams, and shipyards decide how far that wealth reaches. New deposits open to us as our excavation techniques improve, and the §YMajor Development Projects§! focus adds the great public works."
 BRA_decision_araxa_niobium: "Expand CBMM's Araxá Niobium Mine"
 BRA_decision_araxa_niobium_desc: "§YCBMM§! mines niobium at Araxá in Minas Gerais and sells most of the world's supply to steelmakers. A larger pit and a new concentrator would raise our output of this rare alloy metal."
 BRA_decision_catalao_niobium: "Open the Catalão Niobium Mine"
 BRA_decision_catalao_niobium_desc: "A second niobium deposit lies at Catalão in Goiás. Better extraction methods make it worth developing alongside Araxá."
 BRA_decision_trombetas_bauxite: "Expand the Trombetas Bauxite Mines"
 BRA_decision_trombetas_bauxite_desc: "§YMineração Rio do Norte§! has mined bauxite at Porto Trombetas in Pará since 1979. New plateaus would feed more ore to the smelters at Barcarena and São Luís."
 BRA_decision_juruti_bauxite: "Open the Juruti Bauxite Mine"
 BRA_decision_juruti_bauxite_desc: "§YAlcoa§! wants to mine the bauxite plateaus at Juruti in western Pará and ship the ore down the Amazon. Federal licenses and a port would bring the mine into production."
 BRA_decision_tailings_dam_safety: "Decommission the Upstream Tailings Dams"
 BRA_decision_tailings_dam_safety_desc: "Dozens of upstream tailings dams hold mine waste above the towns of Minas Gerais. Draining and decommissioning them will slow the iron mines for a while, but a collapse would cost far more."
 BRA_tailings_dams_secured_tt: "The tailings dams of §YMinas Gerais§! will no longer collapse.\n"
 BRA_decision_dry_stack_tailings: "Switch the Iron Quadrangle to Dry Stacking"
 BRA_decision_dry_stack_tailings_desc: "Filtering the water out of tailings and stacking the dry waste needs no dam at all. With the old dams gone, our iron mines can expand without the risk."
 BRA_decision_autazes_potash: "Develop the Autazes Potash Deposit"
 BRA_decision_autazes_potash_desc: "Our farms import most of the potash they spread on their fields. A deposit at Autazes in Amazonas could supply them, but it lies beside the lands of the §YMura§! people and would cut into the forest."
 BRA_decision_jequitinhonha_lithium: "Open the Lithium Valley Mines"
 BRA_decision_jequitinhonha_lithium_desc: "The Jequitinhonha Valley in Minas Gerais holds hard-rock lithium that battery makers want. Federal permits and power lines would turn one of our poorest regions into a mining district."
 BRA_decision_lithium_refining: "Refine Lithium in Minas Gerais"
 BRA_decision_lithium_refining_desc: "We ship our lithium concentrate abroad to be refined. A refinery near the mines would keep the battery-grade chemicals, and the jobs, in Minas Gerais."
 BRA_decision_caetite_uranium: "Expand INB's Caetité Uranium Mine"
 BRA_decision_caetite_uranium_desc: "§YIndústrias Nucleares do Brasil§! mines uranium at Caetité in Bahia for the reactors at Angra. More ore from Caetité means less fuel bought abroad."
 BRA_decision_santa_quiteria_uranium: "Open the Santa Quitéria Uranium Mine"
 BRA_decision_santa_quiteria_uranium_desc: "The Itataia deposit at Santa Quitéria in Ceará holds uranium mixed with phosphate. Mining both would supply our reactors and our fertilizer plants."
 BRA_decision_transposition_saofrancisco: "Divert the São Francisco River"
 BRA_decision_transposition_saofrancisco_desc: "The São Francisco River Integration Project is a federal enterprise under the Ministry of Regional Development. Hundreds of kilometers of concrete channels along two axes, north and east, will carry part of the river's waters across Pernambuco, Paraíba, Ceará, and Rio Grande do Norte, with nine pumping stations along the way."
 BRA_decision_bacia_tocantins: "Develop the Tocantins-Araguaia Basin"
 BRA_decision_bacia_tocantins_desc: "The Tocantins-Araguaia basin is one of the twelve hydrographic regions of Brazil and the largest located entirely within our borders. Its main rivers are the Tocantins and the Araguaia."
 BRA_decision_army_projects: "Fund the Army Projects Office"
 BRA_decision_army_projects_desc: "The Army Projects Office supplies operational units with the defense products they need at minimum operational readiness."
 BRA_decision_improve_dockyards: "Improve Our Dockyards"
 BRA_decision_improve_dockyards_desc: "Our dockyards in [890.GetName] and [885.GetName] need expansion and improvement. Expanding them will let us build ever larger vessels."
 BRA_decision_amazonian_projects: "Amazonian Industrial Projects"
 BRA_decision_amazonian_projects_desc: "It is time to establish a series of Amazonian industrial projects to expand the civilian industrial capacity of the state of [892.GetName]."

 # Amazon System
 BRA_amazon_conservation_system_decision_category: "Amazon Rainforest Conservation"
 BRA_amazon_conservation_system_decision_category_desc: "\n£BRA_desctext_amazon\n\n\n\nThe Amazon rainforest is one of the world's great wonders, and we are lucky to hold its beauty within our borders. Its resources also make it an attractive target for economic development.\n\n\nThe Amazon system requires us to keep our §YTotal Rainforest Acreage§! close to, or above, the §YTotal Targeted Acreage§!. If we do not maintain this balance, our Amazonian states will suffer penalties, and progressively worse events will fire depending on how much of the rainforest has been destroyed. The §YTotal Rainforest Acreage§! is made up of §YWild Acreage§! and §YConserved Acreage§!. Our economic policy decisions about the §YAmazonian States§! make us gain or lose additional §YWild Acreage§! every month.\n\nA high ratio of §YConserved Acreage§! brings greater long-term benefits, but slashing and burning also lets us exploit mineral wealth, §YBuildings§!, and §YBuilding Slots§!.\n\nTotal Targeted Rainforest Acreage: [?BRA_acres_target]\nTotal Rainforest Acreage: [?BRA_acres_current]\n\nTotal Wild Rainforest Acreage: [?BRA_acres_wild] (Ratio: [?BRA_wild_acreage_ratio|%1])\nTotal Conserved Rainforest Acreage: [?BRA_acres_conserved] (Ratio: [?BRA_conserved_acreage_ratio|%1])\n\nConserved Rainforest Acreage Conversion Rate: [?BRA_acres_conserved_change|+]\nWild Rainforest Acreage Monthly Gain: [?BRA_acre_rate_gain|+]\nWild Rainforest Acreage Monthly Loss: [?BRA_acre_rate_loss|-]\nNet Monthly Wild Rainforest Acreage: [?BRA_net_acreage|+] million acres a month"
 BRA_decision_plant_additional_trees: "Plant Additional Trees"
 BRA_decision_plant_additional_trees_desc: "We can replant parts of the Amazon rainforest in our conservation zones to move us toward the target acreage."
 BRA_decision_declare_new_conservation_lands: "Declare New Conservation Lands"
 BRA_decision_declare_new_conservation_lands_desc: "Declaring new conservation lands can help stem illegal activity such as slash-and-burn farming and illegal logging."
 BRA_decision_establish_amazonian_national_park_service: "Establish the SNUC"
 BRA_decision_establish_amazonian_national_park_service_desc: "It is time to establish the National System of Nature Conservation Units (SNUC). The idea dates back to the 1970s, when the Brazilian Forestry Development Institute and the Brazilian Foundation for Nature Conservation proposed it to standardize conservation in Brazil. Now we will put it into practice for the good of all Brazil."
 BRA_decision_reduce_fires: "Reduce the Fires"
 BRA_decision_reduce_fires_desc: "The Amazon burns every year, no matter who governs. With a real effort, we can reduce the fires through targeted programs, public campaigns, and more."
 BRA_decision_safe_mining_expansion: "Safe Mining Expansion"
 BRA_decision_safe_mining_expansion_desc: "We can take some resources from the Amazon to improve our economy, but we must be careful. The more careful we are, the more we can develop the Amazon, and do so sustainably. We can use conserved rainforest acreage that has been prospected for its resources to make a conservation-minded choice."
 BRA_decision_expand_rubber_production_on_the_coast: "Expand Rubber Production on the Coast"
 BRA_decision_expand_rubber_production_on_the_coast_desc: "Rubber is a lifeline resource of the Amazon and of Brazil. Expanding production and planting more rubber trees along the coast will bring us more income and strengthen our position in the global resource market."
 BRA_decision_expand_the_gold_mining_initiatives: "Expand Precious Metal Mining"
 BRA_decision_expand_the_gold_mining_initiatives_desc: "Prospectors and mining firms already pan the rivers of Amazonas and Pará for gold. State backing will bring in heavier equipment and open more of the region's §YPrecious Metals§!, but each expansion draws down the rainforest we have conserved."
 BRA_decision_halt_independent_developments: "Halt Independent Developments"
 BRA_decision_halt_independent_developments_desc: "Private development of the Amazon, recently legalized, has begun to cut down too much of the forest. We can halt it for now to give us room to establish new policies and begin targeted replanting."
 BRA_decision_continue_independent_developments: "Continue Independent Developments"
 BRA_decision_continue_independent_developments_desc: "We believe we are ready to resume development of the Amazon. We should send new communications to private development companies so they can begin again."
 BRA_decision_permanently_ban_private_development: "Permanently Ban Private Amazonian Development"
 BRA_decision_permanently_ban_private_development_desc: "We will permanently ban all private development in the Amazon. The ban is wildly popular with the country's green parties, who will gain significant political ground."
 BRA_decision_initial_investment: "Initial Investment"
 BRA_decision_initial_investment_desc: "Several projects have been proposed to develop parts of the Amazon. They require a large initial investment to organize them and begin development."
 BRA_decision_the_road_to_el_dorado: "The Road to El Dorado"
 BRA_decision_the_road_to_el_dorado_desc: "Manaus is a major city isolated by its position deep in the Amazon. Investing in roads and railways can help us turn it into a new El Dorado."
 BRA_decision_expand_the_mining_industry: "Expand the Mining Industry"
 BRA_decision_expand_the_mining_industry_desc: "Amazonas holds mineral deposits that our firms have barely begun to work. Subsidies for local miners will raise output, but every new pit draws down the rainforest we have set aside, so we must be sure the trade is worth it."
 BRA_decision_increase_the_oil_production: "Increase the Oil Production"
 BRA_decision_increase_the_oil_production_desc: "The Foz do Amazonas basin off our northern coast is one of the last unexplored oil frontiers in the country. Drilling from Pará will add to our oil output, but every new project draws down the conserved rainforest, so we must choose our wells carefully."
 BRA_decision_increase_military_production: "Expand Amazonian Military Production"
 BRA_decision_increase_military_production_desc: "Manaus has long been an industrial hub in the middle of the rainforest, thanks to its free trade zone, and it has the workers, river port, and airport to support more factories. New arms factories there will add to our defense industry, at the cost of some of the rainforest we have conserved."
 BRA_decision_tech_metal_industry_in_the_amazon: "Expand Tech Metal Mining in the Amazon"
 BRA_decision_tech_metal_industry_in_the_amazon_desc: "Resource-rich deposits near the Andes, with impressive amounts of copper, lithium, and more, have been found in the western Amazon. Mining operations of all kinds in this region would help us keep growing our economy and make further use of the Amazon's natural bounty."

 # Dynamic Modifiers
 BRA_amazon_modifier: "The Amazon Rainforest: Local Conservation Efforts"
 BRA_amazon_modifier_desc: "The Amazon rainforest is the largest in the world, and as the Brazilian people we are its caretakers. Unregulated use of its resources could lead to widespread protests, worsen climate change, and much more. If we manage the forest to the best of our abilities, however, we can unleash its economic might and let our great nation prosper.\n\nWe can reduce the state-wide penalties by increasing our §YTotal Conserved Acreage Ratio§! and by funding the §YImprove Local Conservation Efforts§! internal investment for local relief. We suffer no penalties when our §YTotal Conserved Acreage Ratio§! is at 100% (Current: [?BRA_conserved_acreage_ratio|0%])."
 BRA_amazon_country_modifier: "The Amazon Rainforest: Countrywide Conservation Efforts"
 BRA_amazon_country_modifier_desc: "The Amazon rainforest is the largest in the world, and as the Brazilian people we are its caretakers. Unregulated use of its resources could lead to widespread protests, worsen climate change, and much more. If we manage the forest to the best of our abilities, however, we can unleash its economic might and let our great nation prosper.\n§W--------------§!\nThis national spirit will never be §RRemoved§!, but its penalties will §GImprove§! as our §YTotal Acreage§! nears the §YTarget Acreage§! (Current: [?BRA_current_target_ratio|%0]) and vanish once we reach it. The §Y$BRA_preserve_amazon$§! focus and Amazon conservation decisions such as §Y$BRA_decision_plant_additional_trees$§!, §Y$BRA_decision_fund_reforestation_grants$§!, and §Y$BRA_decision_crack_down_on_illegal_logging$§! help us get there. Each conservation decision also makes foreign investment projects sent to us cheaper and faster, by up to §G10%§!. A shrinking forest also pushes voters toward the §YNon-Aligned Outlook§!, while a larger share of §YConserved Acreage§! (Current: [?BRA_conserved_acreage_ratio|%0]) speeds up our research."
 BRA_native_violence_modifier: "Native Violence"
 BRA_native_violence_modifier_desc: "Native violence has erupted in [THIS.GetName] between the local indigenous population and the various developers in the region. It is only a matter of time before this violence grows into something much worse."

 # Events
 # Brazilian Amazon System
 brazil_amazon.1.t: "Rampant Wildfires"
 brazil_amazon.1.d: "A series of wildfires, natural but worsened by other conditions, has begun to ravage a section of the Amazon within our territory. We have already started to organize a response, but the damage done cannot be reversed. We can only hope to stop any further spread."
 brazil_amazon.1.a: "Do what we can with what we have"
 brazil_amazon.1.b: "Deploy the army to assist"
 brazil_amazon.2.t: "Amazon River Flooding"
 brazil_amazon.2.d: "A series of floods, driven by a particularly rainy season, has inundated several sections of the Amazon River near our centers of development. Search and rescue operations are already underway, and damage control teams are close behind. However, some areas, such as our dams in the region, have already suffered significant damage."
 brazil_amazon.2.a: "Do what we can with what we have"
 brazil_amazon.2.b: "Deploy the army to assist with search and rescue"
 brazil_amazon.3.t: "Drought in Amazon Border Regions"
 brazil_amazon.3.d: "Contaminated groundwater and diverted rivers in the regions around the Amazon, combined with poor rains, have brought a drought to one of our border regions. Panic is already spreading, and parts of the region's delicate forest ecosystems are being lost."
 brazil_amazon.3.a: "Leave the border regions to manage their own water"
 brazil_amazon.3.b: "Deploy all the disaster relief we can spare, quickly"
 brazil_amazon.4.t: "Tropical Storm Strikes Amazon Regions"
 brazil_amazon.4.d: "A tropical storm originating from the Atlantic has swept overland and into the Amazon, leaving a trail of destruction in its wake. Homes, trees, and industries alike have taken damage, and search and rescue operations are already underway. The people will be expecting us to respond with some kind of disaster relief."
 brazil_amazon.4.a: "Leave the rebuilding to the locals"
 brazil_amazon.4.b: "Deploy all the disaster relief we can spare, quickly"
 brazil_amazon.5.t: "Illegal Clear-Cutting"
 brazil_amazon.5.d: "An illegal clear-cutting operation located along the periphery of the Amazon has come to our attention. Tons of lumber have already been moved off-site and have begun circulating in the economy while remaining unmarked and most likely untraceable by us. This just leaves the immediate effects for us to deal with."
 brazil_amazon.5.a: "Do what little we can at this point"
 brazil_amazon.5.b: "Take our cut"
 brazil_amazon.6.t: "Illegal Slash-and-Burn"
 brazil_amazon.6.d: "An illegal slash-and-burn operation along the periphery of the Amazon has come to our attention. Several acres of land have already been destroyed and are now being plowed as farmland, grazed by cattle, or used as sites for new developments. Local authorities could easily remove these individuals if they chose to, so we are left to deal with the immediate effects."
 brazil_amazon.6.a: "Do what little we can at this point"
 brazil_amazon.6.b: "Take our cut"
 brazil_amazon.7.t: "Company Purchases Local Conservation Lands"
 brazil_amazon.7.d: "A local company has started buying up some of the conservation land rights we recently put on the market. It is looking to exploit local reserves of gold, copper, and other materials in the area."
 brazil_amazon.7.a: "Welcome the investment"
 brazil_amazon.8.t: "Slash-and-Burn Triggers Wildfires"
 brazil_amazon.8.d: "A slash-and-burn operation that came to our attention appears to have continued despite our interventions, and its operators have become more brazen. The fires have now spread out of control."
 brazil_amazon.8.a: "Deal with the damage"
 brazil_amazon.8.b: "Luckily, we prepared for this possibility"
 brazil_amazon.9.t: "Poaching Leads to Ecosystem Collapse"
 brazil_amazon.9.d: "An illegal poaching ring has recently been uncovered operating within one region of the Amazon. Their activities have already begun the process of ecosystem collapse within their area of operations. As these persons can be easily dealt with by local authorities, this just leaves the immediate effects for us to deal with."
 brazil_amazon.9.a: "Do what little we can at this point"
 brazil_amazon.9.b: "Have the National Park Service reintroduce keystone species"
 brazil_amazon.9.c: "Take our cut"
 brazil_amazon.10.t: "Illegal Incursions onto Native Land"
 brazil_amazon.10.d: "Reports describe frequent and sometimes violent incursions by criminal groups onto native land in the Amazon. Tension is rising, and given the history of conflict it is only a matter of time before this turns into open violence. These groups are also damaging the surrounding forests."
 brazil_amazon.10.a: "Let the natives defend their land"
 brazil_amazon.10.b: "Hand the problem to someone else"
 brazil_amazon.10.c: "Send in the army"
 brazil_amazon.11.t: "Incursions Lead to Killings"
 brazil_amazon.11.d: "The recent incursions by criminal actors have led to a series of killings, involving both the interlopers and the natives. Discerning who started killing who first is impossible at this point. We're simply left with the aftermath and deciding who will be punished. No matter what we do, it will be hard to keep this under control."
 brazil_amazon.11.a: "Do nothing and pray for their souls"
 brazil_amazon.11.b: "A textbook case of criminals killing natives"
 brazil_amazon.11.c: "Send in the army to break this up"
 brazil_amazon.12.t: "Natives Express Thanks"
 brazil_amazon.12.d: "Due to our recent actions related to incursions on native lands within the Amazon, we've received official thanks from tribal councils for our actions. For our support of them, they've pledged future support in our political endeavours within the region."
 brazil_amazon.12.a: "They are law-abiding citizens and deserve our protection"
 brazil_amazon.13.t: "Jungle Narcotics Field Located"
 brazil_amazon.13.d: "Reports have recently filtered in about a plantation, run by the cartels, deep within our Amazon territory. A significant number of trees have been cut down to make room for the fields in what looks like a very sloppy slash-and-burn operation. The only thing keeping the operation at any level of organization is a clear fear of burning their product."
 brazil_amazon.13.a: "Try to get in there and do what we can"
 brazil_amazon.13.b: "Have our police forces cooperate with the local army command"
 brazil_amazon.13.c: "Oh! That is where the field was. Clever"
 brazil_amazon.14.t: "[?var:influence_array^0.GetName] Pressures for Conservation"
 brazil_amazon.14.d: "Recently we have received several petitions from our international partners to increase conservation efforts within the Amazon. While we could normally ignore such requests, our largest trading partner, [Largest Investor], has begun applying pressure in the same direction. In return for our cooperation, they're offering to slacken their influence in other areas."
 brazil_amazon.14.a: "We cannot sacrifice our values for short-term gains"
 brazil_amazon.14.b: "Striking a lucrative deal is always beneficial."
 brazil_amazon.15.t: "Critical Amazon Dam Overflows"
 brazil_amazon.15.d: "One of our dams located within the Amazon has overflowed due to a rapid surge of water from upstream. Disaster management is already en route but it's unclear how much damage has already been done. At the worst, the dam could burst due to the strain, causing even more damage downstream. Even if it's unlikely to happen, we should consider preparing for the possibility."
 brazil_amazon.15.a: "The chances are slim, so deploy only what is necessary"
 brazil_amazon.15.b: "Plan for the worst and evacuate the downstream regions"
 brazil_amazon.16.t: "Disastrous Dam Burst"
 brazil_amazon.16.d: "The worst has happened. A few hours after our last report on the overflowing dam, a structural fault caused it to burst, and the water swept away everything in its path. Search and rescue is underway, but for thousands of people and millions of dollars of infrastructure, it is already too late."
 brazil_amazon.16.a: "This was not supposed to happen"
 brazil_amazon.16.b: "Deploy everything we can to the area"
 brazil_amazon.17.t: "A Dam Bursts"
 brazil_amazon.17.d: "A few hours after our last report on the overflowing dam, a flaw in its structure caused it to burst, and the water swept away everything in its path. Thanks to our foresight, the only known casualties are a handful of technicians who died trying to avert the disaster. Already we are being praised for our planning, and a memorial to the lost technicians is being drawn up."
 brazil_amazon.17.a: "I can only imagine a world where we did nothing"
 brazil_amazon.18.t: "Dam Overflow Subsides"
 brazil_amazon.18.d: "After several tense hours of waiting on news, a beleaguered dam technician has submitted a report that the overflow has subsided. While there is certainly some flooding, it is within manageable levels."
 brazil_amazon.18.a: "We saved money by doing nothing"
 brazil_amazon.19.t: "Dam Overflow Subsides"
 brazil_amazon.19.d: "After several tense hours of waiting on news, a beleaguered dam technician has submitted a report that the overflow has subsided. While there is certainly some flooding, it is within manageable levels. However, the possibility of a burst and the quick work of our disaster management teams has already made the headlines. People from dam technicians to local leaders are being lauded as heroes for averting the disaster."
 brazil_amazon.19.a: "In moments like these, we almost enjoy being public servants"
 brazil_amazon.20.t: "Amazon Establishes Distribution Center in Amazonas"
 brazil_amazon.20.d: "The American company Amazon has established a distribution center in Manaus with the purpose of servicing the region of Amazonas. That such a company would take an interest in the region is a testament to its growing importance on the world stage."
 brazil_amazon.20.a: "This is getting out of hand. Now there are two of them"
 brazil_amazon.21.t: "The Amazon Is Devastated"
 brazil_amazon.21.d: "The Amazon rainforest's total acreage has fallen below fifty million acres, and overdevelopment and repeated disasters have left it beyond repair. The economic development seems to have paid off in the short term, but the long-term destruction may not have been worth it."
 brazil_amazon.21.a: "The Very Last Truffula Tree of Them All"
 brazil_amazon.22.t: "Agro-Industrial Company Invests in Fields"
 brazil_amazon.22.d: "One of the private companies in our country specializing in agricultural products has decided to invest in the fields of the Amazon rainforest."
 brazil_amazon.22.a: "Approve the new districts"
 brazil_amazon.22.b: "Deny the new developments"
 brazil_amazon.23.t: "Industrial Mining Companies Exploit Resource Reserves"
 brazil_amazon.23.d: "The Amazon rainforest holds vast resource reserves beneath its jungle and dense vegetation. Iron, copper, oil, and much more lie under the undergrowth."
 brazil_amazon.23.a: "Approve the new districts"
 brazil_amazon.23.b: "Deny the new developments"
 brazil_amazon.24.t: "Private Company Develops Infrastructure in the Amazon"
 brazil_amazon.24.d: "Private companies recently authorized to develop infrastructure have proposed a new project in the Amazon that would expand the infrastructure beyond the current light roads."
 brazil_amazon.24.a: "Approve the new districts"
 brazil_amazon.24.b: "Deny the new developments"
 brazil_amazon.25.t: "Private Companies Create New Construction Firm"
 brazil_amazon.25.d: "A private company has decided to create a new Amazon-based construction firm to keep developing the Amazon and its cities."
 brazil_amazon.25.a: "Approve the new districts"
 brazil_amazon.25.b: "Deny the new developments"
 brazil_amazon.26.t: "Private Companies Replant Portions of the Amazon"
 brazil_amazon.26.d: "A private company has decided to develop parts of the Amazon rainforest and plant additional trees in local conservation areas. The replanting has allowed some of the previously lost acreage to be regained."
 brazil_amazon.26.a: "Approve the new districts"
 brazil_amazon.26.b: "Deny the new developments"
 brazil_amazon.27.t: "Johan Eliasch Buys a Logging Company"
 brazil_amazon.27.d: "The Swedish businessman Johan Eliasch has bought the logging company Gethal Amazonas and says he will stop its operations at once, freeing the land for conservation. We could treat this as a gift or nationalize the company for our own purposes. What should we do?"
 brazil_amazon.27.a: "Allow him to close the company"

 # Country events
 brazil.3.t: "Amazonian Development Project"
 brazil.3.d: "The Amazon is an untapped treasure that can boost our economy, with metal, timber, and oil to be harvested for our industries and those abroad. Should we allow companies to exploit it for financial gain?"
 brazil.3.a: "The trees will grow back anyway"
 brazil.3.b: "The environment is not for sale."
 brazil.6.t: "Project to Devastate the Amazon"
 brazil.6.d: "The Amazon has already shown promise in its raw resources, and a newer, more aggressive project is on the table. It could help offset our debts and encourage foreign investment."
 brazil.6.a: "Business is more important than some silly trees!"
 brazil.6.b: "We must preserve our national treasures for future generations."
 brazil.14.t: "March of the Excluded"
 brazil.14.d: "Nearly five hundred years ago the Portuguese first set foot on our shores, and the native peoples greeted them with open arms. Today those peoples are excluded from public life. On the 500th anniversary of Brazil in 2000, military police used brute force to disperse the native demonstration known as the \"March of the Excluded\", further isolating the natives from the government."
 brazil.14.a: "A Dividing Day"
 brazil.14.b: "Crack down on the marchers"
 brazil.15.t: "French Naval Studies"
 brazil.15.d: "Brazil has asked us for a new agreement to improve its navy. Its best naval officers would study our doctrines and methods, and its engineers would learn to build ships under ours. Do we accept or reject the proposal?"
 brazil.15.a: "Accept the proposal"
 brazil.15.b: "Reject the proposal"
 brazil.18.t: "A Three-Way Race for the Presidency"
 brazil.18.d: "Car Wash has left no party untouched, and voters are angry. Lula leads the Workers' Party against Jair Bolsonaro, the former army captain running for the PSL, and Geraldo Alckmin of the PSDB."
 brazil.18.d_haddad: "With Lula barred from the ballot, Fernando Haddad carries the Workers' Party against Jair Bolsonaro of the PSL and Geraldo Alckmin of the PSDB. Haddad has weeks to introduce himself to voters who wanted Lula."
 brazil.18.a: "Bolsonaro forms a government"
 brazil.18.b: "The Workers' Party wins"
 brazil.18.c: "Alckmin wins for the PSDB"
 brazil.19.t: "Operation Car Wash Opens"
 brazil.19.d: "Federal Police have raided a Brasília gas station whose car wash moved cash for black-market dealers. Among those arrested is Alberto Youssef, and his phone is full of numbers at Petrobras."
 brazil.19.a: "Let the investigation run"
 brazil.20.t: "Media Joins Opposition"
 brazil.20.d: "Several weeks after our election win, it is clear that the country's biggest media outlet, the Globo Network, opposes the result and attacks [BRA.GetLeader] and the government's allies in every edition of its daily journal. It is only a matter of time before our popularity starts to decline steadily."
 brazil.20.a: "Why can't they just be quiet?"
 brazil.21.t: "Evangelical Judge Takes Seat"
 brazil.21.d: "This week [BRA.GetLeader] appointed Judge André Mendonça to the Supreme Court, fulfilling a campaign promise and satisfying much of the religious majority that helped elect our government. Mendonça is another conservative pick for the court, with two more seats still to fill. The appointment has stirred controversy over Brazil's secular government, since Mendonça has said that a return to religion is inevitable and has called for giving religious institutions more power."
 brazil.21.a: "God is just, and so is our justice"
 brazil.22.t: "Creation of a New Party"
 brazil.22.d: "Bolsonaro is having internal problems with the PSL and will eventually leave it, but he needs a new party. That party will be the \"Aliança\", a conservative party."
 brazil.22.a: "Create the party"
 brazil.23.t: "Nationalist Movements Rise"
 brazil.23.d: "During a moment of political weakness of the left, nationalist and right-wing movements are rising all around the country, seeking an opposite direction to the one the country took several years ago."
 brazil.23.a: "What will become of this country?"
 brazil.24.t: "The Brazilian Monarchy?"
 brazil.24.d: "The republic was proclaimed in a military coup in 1889, and many on our side believe it has never delivered stability. A crowned head of state above party politics might give the country the steady hand it lacks, though voters chose the republic by a wide margin in a plebiscite in the 1990s. The question is open, and the idea is now on the table."
 brazil.24.a: "We will see"
 brazil.25.t: "Government Influences Globo Media Network"
 brazil.25.d: "After the PT's rebirth as an established party under the president, it has regained its once-valued influence over the biggest news outlet, Globo."
 brazil.25.a: "A victory, after all"
 brazil.26.t: "Alliances with the Centrão"
 brazil.26.d: "The Centrão holds the votes that decide most bills in Congress, and it has backed every government that paid its price in posts and budget amendments. We can bring the DEM, and perhaps the PSDB, into a formal coalition, take the bloc's support without any promises, or turn to a smaller partner such as the PRTB."
 brazil.26.a: "Ally with the DEM and the PSDB"
 brazil.26.b: "Ally with the DEM"
 brazil.26.c: "Take their support without forming a coalition"
 brazil.26.dd: "Ally with the PRTB"
 brazil.27.t: "The Globo Question"
 brazil.27.d: "The media is our biggest enemy: it turns the masses against us and makes our regime unpopular. By silencing the biggest channel of all, the Globo conglomerate, we can secure popular support for [BRA.GetLeader] and the party."
 brazil.27.a: "Censor every TV channel"
 brazil.27.b: "Nationalize Globo and use its wide viewership"
 brazil.27.c: "Disband Globo and silence its liars"
 brazil.28.t: "Truckers' Strike"
 brazil.28.d: "For months the price of oil has been soaring in our country, mainly because of [BRA.GetLeader]'s economic policies and the devaluation of the real. The truckers' unions are demanding a lower diesel price and threatening a nationwide strike that would cripple our oil and resource supply. What should we do?"
 brazil.28.a: "Lower the diesel price"
 brazil.28.b: "Hold the current prices"
 brazil.29.t: "Choose Our US Ambassador"
 brazil.29.d: "We must change all the political structures established by the previous regime, including our ambassadors. Who will represent us in the United States: Eduardo Bolsonaro, son of Jair Bolsonaro, or Nestor Forster, an experienced diplomat?"
 brazil.29.a: "Appoint Eduardo Bolsonaro"
 brazil.29.b: "Appoint Nestor Forster"
 brazil.30.t: "Nationalist Leaders Summit"
 brazil.30.d: "Nationalist leaders from around the world have been invited to a summit in Brazil to discuss how to confront communists and globalist liberals."
 brazil.30.a: "Join forces against these groups"
 brazil.31.t: "Logging Reforms"
 brazil.31.d: "Loggers, ranchers, and land grabbers are clearing the Amazon faster than the forest can recover, and the damage is drawing attention at home and abroad. Tougher rules on the logging industry would slow the destruction and win over environmental voters, but industrial interests will resent the added cost."
 brazil.31.a: "Begin the reforms"

 brazil.35.t: "Align with Other Parties"
 brazil.35.d: "We cannot rule Brazil alone, and a liberal government cannot count on a majority of its own. The DEM, heir to the old right, offers votes and a national machine to get bills through Congress. The Free Brazil Movement (MBL) brings young, online, market-minded activists and fresh demands of its own. We can take one partner or both."
 brazil.35.a: "Ally with the DEM"
 brazil.35.b: "Ally with the MBL"
 brazil.35.c: "Ally with both"
 brazil.37.t: "Impeachment of Dilma Rousseff"
 brazil.37.d: "On December 2, 2015, Eduardo Cunha, then president of the Chamber of Deputies, accepted a petition to impeach Dilma Rousseff, the 36th president of Brazil. Rousseff, early in her second term, was charged with administrative misconduct and disregard for the federal budget, in violation of the Constitution and the Fiscal Responsibility Law. Vice President Michel Temer's MDB broke with her government in March 2016, and the process ran into late 2016."
 brazil.37.a: "Approve the impeachment"
 brazil.38.t: "Lula Enters Custody"
 brazil.38.d: "The appeals court in Porto Alegre has upheld Lula's conviction in the Guarujá apartment case. After two days among supporters at the metalworkers' union hall in São Bernardo, he surrenders to the Federal Police."
 brazil.38.a: "The law applies to everyone"
 brazil.39.t: "The 2002 Elections"
 brazil.39.d: "During the second term of President Fernando Henrique Cardoso of the PSDB, an exchange-rate crisis that began soon after the 1998 elections slowed growth, raised unemployment, and increased public debt. Brazil has since fallen into a deep political crisis, and many investors fear that a left-wing candidate will win. Who will be the next president?"
 brazil.39.a: "José Serra, from the Brazilian Social Democracy Party"
 brazil.39.b: "Luiz Inácio Lula da Silva, from the Workers' Party"
 brazil.40.t: "Protests Supporting Dilma's Impeachment"
 brazil.40.d: "Car Wash arrests, a deep recession, and anger at the Workers' Party have filled the avenues of São Paulo and Brasília with crowds in green and yellow. They share one demand, the end of Dilma Rousseff's government, and Congress is listening."
 brazil.40.a: "Fora Dilma!"
 brazil.41.t: "Jair Bolsonaro Stabbed in Juiz de Fora"
 brazil.41.d: "Jair Bolsonaro was stabbed in the stomach today while campaigning in Juiz de Fora, when an attacker slipped into the crowd during a parade. Doctors reportedly said that had he not been in such good shape, he would likely have died from losing two liters of blood."
 brazil.41.a: "Suppression of ideas"
 brazil.41.b: "Serves Him Right"
 brazil.42.t: "Brazil Requests Debt Assistance"
 brazil.42.d: "[BRA.GetLeader] and a delegation have approached us with a new deal. The Brazilian economy is hanging by a thread because of its looming debt crisis and crippled currency, and it proposes that our government buy back its debt from private investors. Should we go forward with the plan?"
 brazil.42.a: "Approve the Plan"
 brazil.42.b: "Deny the Plan"
 brazil.43.t1: "The United States Accepts the Plan"
 brazil.43.t2: "The United States Declines the Plan"
 brazil.43.d1: "The United States has answered our proposal and agrees to the plan. It will take a couple of days to take effect, but American help is on the way."
 brazil.43.d2: "The United States has declined our proposal to ease our debt burden. It is sad news, but we must now move ahead with austerity measures to save our country from default."
 brazil.43.a: "We have a friend in Washington"
 brazil.43.b: "Press on through trials and tribulations"
 brazil.44.t: "Belém Asks to Burn Forest for Sugarcane"
 brazil.44.d: "Belém has asked to clear some of the local mangroves and rainforest by slash-and-burn to plant sugarcane on the outskirts of the city, closer to the densely forested areas. Should we allow it?"
 brazil.44.a: "Allow the slash-and-burn"
 brazil.44.b: "Deny the slash-and-burn"
 brazil.45.t: "Petrobras Records Reach the Public"
 brazil.45.d: "Plea deals have turned the Petrobras case into a list of names: directors, contractors, and the politicians they paid. Protesters fill Avenida Paulista and want to know who still holds a public contract."
 brazil.45.a: "Fund an independent procurement review"
 brazil.45.b: "Honor the existing contracts"
 brazil.45.c: "Offer plea deals to the executives"
 brazil.45.e: "Sign leniency agreements with the contractors"
 brazil.46.t: "Brazil Sends the Odebrecht Records"
 brazil.46.d: "Prosecutors in Brazil have sent us Odebrecht's records of payments tied to the Interoceanic Highway. The files name officials from more than one of our past governments."
 brazil.46.d_ecu: "Prosecutors in Brazil have sent us Odebrecht's records of payments made while it built our dams and highways. Some of the money appears to have reached senior officials in Quito."
 brazil.46.d_col: "Prosecutors in Brazil have sent us Odebrecht's records on the Ruta del Sol II highway concession. The payments suggest the contract was bought, not won."
 brazil.46.a: "Open a full audit"
 brazil.46.b: "Let the contracts stand"
 brazil.47.t: "A Court Orders Lula's Release"
 brazil.47.d: "The Supreme Federal Court has ruled that no sentence can begin until every appeal is exhausted. Lula walks out of the Federal Police building in Curitiba, still convicted and still barred from the ballot."
 brazil.47.a: "Respect the ruling"
 brazil.48.t: "The Curitiba Judgments Are Annulled"
 brazil.48.d: "Justice Edson Fachin has ruled that the court in Curitiba never had jurisdiction over Lula's cases. The convictions are void, and Lula can run for president again. The court has said nothing about his innocence."
 brazil.48.a: "Send the cases to Brasília"
 brazil.49.t: "The Public Pension Bill"
 brazil.49.d: "Our bill would make public servants retire later and contribute more. Union leaders say we are balancing the budget on their members' backs, and our own deputies want room to negotiate."
 brazil.49.a: "Pass the bill as written"
 brazil.49.b: "Negotiate a limited reform"
 brazil.49.c: "Withdraw the bill"
 brazil.50.t: "The Workers' Party Faces a Split"
 brazil.50.d: "Senator Heloísa Helena and three of our deputies voted against the pension bill. The party leadership wants them expelled. They say they will build a new party if we throw them out."
 brazil.50.a: "Expel them"
 brazil.50.b: "Keep them in the party"
 brazil.51.t: "Congress Opens the Mensalão Inquiry"
 brazil.51.d: "Deputy Roberto Jefferson has told a newspaper that allied legislators receive a monthly allowance to vote with the government. A congressional inquiry wants the bank records, and our allies are suddenly hard to reach."
 brazil.51.a: "Hand the records to investigators"
 brazil.51.b: "Stand by our congressional allies"
 brazil.51.c: "Let the paymasters turn state's evidence"
 brazil.51.e: "Let the paymasters repay the money"
 brazil.52.t: "Upgrading Rio's Favelas"
 brazil.52.d: "Residents of Rio's favelas want drainage, paved access roads, and clinics without being pushed out of their homes. Community associations have plans ready and want Brasília to help pay for them."
 brazil.52.a: "Fund roads and drainage in Rio"
 brazil.52.b: "Fund community service programs"
 brazil.52.c: "Leave the plans to the city"
 brazil.53.t: "Who Gets the Pre-Salt Royalties?"
 brazil.53.d: "Oil from the pre-salt fields will soon pour money into the federal budget. Teachers and doctors want a share locked in by law before Congress spends it elsewhere. The finance ministry wants to keep it flexible."
 brazil.53.a: "Set aside royalties for schools and health"
 brazil.53.b: "Keep royalties in the general budget"
 brazil.54.t: "The Grid Runs Short"
 brazil.54.d: "Demand has outrun our power plants, and the grid operator warns of rolling blackouts. Quotas would keep the lights on at the cost of factory output."
 brazil.54.d_2001: "A dry year has drained the reservoirs behind the dams that supply most of our electricity. Without cuts, the grid operator expects blackouts across the Southeast before winter ends."
 brazil.54.a: "Impose consumption quotas"
 brazil.54.b: "Risk the blackouts"
 brazil.55.t: "The Fare Protests Spread"
 brazil.55.d: "A twenty-centavo bus fare increase brought the Free Fare Movement into the streets of São Paulo. Police violence brought everyone else. Hundreds of thousands now march for better schools, hospitals, and transit."
 brazil.55.d_world_cup: "A twenty-centavo fare increase started the protests in São Paulo, and the stadium bills kept them going. Marchers carry signs demanding schools and hospitals built to FIFA standards."
 brazil.55.a: "Help cities reverse the fare increases"
 brazil.55.b: "Propose a plebiscite on political reform"
 brazil.55.c: "Hold the line on fares"
 brazil.56.t: "São Paulo Reviews Prison Oversight"
 brazil.56.d: "The Putim breakout showed how little control the state has inside its own prisons. Prosecutors and families want independent inspectors to look at gang rule, overcrowding, and abuse by guards."
 brazil.56.a: "Authorize independent inspections"
 brazil.56.b: "Leave the review to prison authorities"
 brazil.56.c: "Fine the private contractors and keep them running"
 brazil.57.t: "Congress Debates a Fiscal Framework"
 brazil.57.d: "Two drafts have reached the floor. One freezes federal spending in real terms by constitutional amendment. The other lets spending grow with revenue, inside a fixed band."
 brazil.57.a: "Freeze spending by amendment"
 brazil.57.b: "Tie spending growth to revenue"
 brazil.58.t: "Emergency Aid for Brazilian Households"
 brazil.58.d: "Street vendors, drivers, and maids lost their income overnight, and most have no unemployment insurance to claim. Congress is debating a monthly emergency payment."
 brazil.58.a: "Fund emergency cash payments"
 brazil.58.b: "Keep the current benefits"
 brazil.59.t: "Brazil Ratifies the Mercosur Agreement"
 brazil.59.d: "Brazil has ratified the free trade agreement our negotiators reached with Mercosur. It would open South America's largest market to Singaporean banks, shippers, and engineers."
 brazil.59.a: "Ratify the agreement"
 brazil.59.b: "Let it wait"
 brazil.60.t: "Brazil Offers a FOCEM Project"
 brazil.60.d: "Brazil offers to pay most of the cost of a new road around Asunción through the Mercosur Structural Convergence Fund. We would cover the rest."
 brazil.60.a: "Co-finance the road"
 brazil.60.b: "Decline the project"
 brazil.61.t: "A Letter to the Brazilian People"
 brazil.61.d: "The real is falling and investors fear a Lula victory. Party moderates want him to promise in writing to honor contracts, control inflation, and pay the debt. The unions fear the letter will tie his hands before he takes office."
 brazil.61.a: "Publish the letter"
 brazil.61.b: "Campaign without the letter"
 brazil.62.t: "Trade in Reais and Pesos"
 brazil.62.d: "Brazil proposes a payment system that would let our importers settle bills in pesos without buying dollars first. Brasília is offering a full trade agreement alongside it."
 brazil.62.a: "Join the system"
 brazil.62.b: "Keep using dollars"
 brazil.63.t: "Brazil Proposes Regular Summits"
 brazil.63.d: "Brasília proposes regular presidential summits and a joint commission on trade and energy. A partner of Brazil's size would make it easier to stand up to Washington."
 brazil.63.a: "Agree to the summits"
 brazil.63.b: "Keep the relationship as it is"
 brazil.64.t: "Brazil Will Host the 2014 World Cup"
 brazil.64.d: "FIFA has confirmed that the World Cup returns to Brazil for the first time since 1950. The federation wants modern stadiums in up to twelve cities, and every governor wants one."
 brazil.64.a: "Build stadiums in twelve cities"
 brazil.64.b: "Host in fewer cities"
 brazil.65.t: "The World Cup Comes to an End"
 brazil.65.d: "The tournament is over, and the country is still in shock. Germany beat us 7–1 in the semifinal in Belo Horizonte. At least the tourists spent freely."
 brazil.65.d_twelve_cities: "The tournament is over, and the country is still in shock. Germany beat us 7–1 in the semifinal in Belo Horizonte. The tourists spent freely, but the new stadiums in Manaus and Cuiabá have no top-flight club to fill them."
 brazil.65.a: "Wait for the next Cup"
 brazil.66.t: "A Tailings Dam Collapses in Minas Gerais"
 brazil.66.d_mariana: "A dam holding iron ore waste at the Samarco mine has burst above the village of Bento Rodrigues. The mud has buried the village and is flowing down the Rio Doce toward the Atlantic."
 brazil.66.d: "A Vale tailings dam has collapsed at the Córrego do Feijão mine near Brumadinho. The mud buried the company cafeteria at lunchtime, and rescuers are still counting the dead."
 brazil.66.a: "Fine the companies and fund the cleanup"
 brazil.66.b: "Negotiate a reparations deal"
 brazil.66.c: "Inspect every tailings dam in the country"
 brazil.67.t: "Floods Devastate Rio Grande do Sul"
 brazil.67.d: "Weeks of rain have pushed the Guaíba over its banks. Water covers much of Porto Alegre, the airport is closed, and hundreds of thousands have left their homes."
 brazil.67.a: "Fund federal reconstruction"
 brazil.67.b: "Suspend the state's debt payments"
 brazil.67.c: "Leave the recovery to the state government"
 brazil.68.t: "The Car Wash Task Force's Mandate Runs Out"
 brazil.68.d: "The Curitiba task force that opened Operation Car Wash has reached the end of its mandate. Prosecutor Deltan Dallagnol's team wants more time, while Congress wants the cases closed and sent back to the regular courts."
 brazil.68.a: "Disband the task force"
 brazil.68.b: "Make it a permanent anti-corruption unit"
 brazil.68.c: "Extend the mandate for four more years"
 brazil.69.t: "Rio Wins the 2016 Olympic Games"
 brazil.69.d: "The International Olympic Committee has chosen Rio de Janeiro over Madrid, Chicago, and Tokyo, and the first Olympics in South America are ours. Mayor Eduardo Paes promises an Olympic Park in Barra da Tijuca, new metro lines, and a cleaner Guanabara Bay."
 brazil.69.a: "Fund the full Olympic program"
 brazil.69.b: "Hold a lean Games"
 brazil.69.c: "Leave the bill to Rio's city hall"
 brazil.70.t: "The Rio Olympics Open at the Maracanã"
 brazil.70.d: "The Games open at the Maracanã while the economy shrinks and the state of Rio runs short of cash. Athletes from more than two hundred nations march in, and the foreign press keeps asking about Zika and the water in Guanabara Bay."
 brazil.70.d_full: "The Games open at the Maracanã with the Olympic Park, the new metro line, and the port district finished on time. The state of Rio is nearly bankrupt, and the construction bills are still arriving."
 brazil.70.a: "Bail out Rio's security budget"
 brazil.70.b: "Sell sponsorship and broadcast rights"
 brazil.71.t: "Rio Hosts the G20 Leaders' Summit"
 brazil.71.d: "Leaders of the world's largest economies have gathered at the Museum of Modern Art in Rio de Janeiro for the G20 summit. Aid agencies want a pledge on hunger, investors want a deal on trade, and the Global South wants a louder voice in the IMF."
 brazil.71.a: "Launch the Global Alliance Against Hunger and Poverty"
 brazil.71.b: "Court investors on the summit sidelines"
 brazil.71.c: "Press for reform of the Security Council and the IMF"
 brazil.72.t: "Belém Hosts the COP30 Climate Summit"
 brazil.72.d: "Delegates from nearly two hundred countries have arrived in Belém, the first climate summit held at the edge of the Amazon. Indigenous leaders march outside the venue while investors ask whether the forest is protected or for sale."
 brazil.72.a: "Launch a Tropical Forest Forever fund"
 brazil.72.b: "Sell carbon credits and green bonds"
 brazil.72.c: "Auction Amazon oil and mining licenses"
 brazil.73.t: "Bolivia Nationalizes Its Gas and Seizes Refineries"
 brazil.73.d: "[BOL.GetLeader] has nationalized Bolivia's §Ygas fields§! and sent troops to two refineries owned by Petrobras. Foreign firms have six months to renegotiate their contracts, and much of the gas our industry burns comes from Bolivia."
 brazil.73.a: "Accept the new terms and renegotiate"
 brazil.73.b: "Demand compensation for Petrobras"
 brazil.73.c: "Develop our own gas supply"
 brazil.74.t: "The Tehran Fuel Swap and the Sanctions Vote"
 brazil.74.d: "On May 17, together with Turkey, we signed a §Yfuel swap§! with Iran in Tehran. Now the Security Council votes on Resolution 1929, a new round of sanctions on Iran, and we must decide whether to stand by our deal."
 brazil.74.a: "Defend the swap and vote no"
 brazil.74.b: "Back the sanctions"
 brazil.75.t: "Mais Médicos Brings Doctors to Underserved Towns"
 brazil.75.d: "Provisional Measure 621 creates §YMais Médicos§!, a program to send doctors to towns that lack them. About 8,300 of the doctors would come from Cuba. We can open the program to foreign doctors or wait for our own medical schools to catch up."
 brazil.75.a: "Open the program to foreign doctors"
 brazil.75.b: "Train more doctors at home"
 brazil.76.t: "Rio's Security Crisis and Federal Intervention"
 brazil.76.d: "Violent crime has overwhelmed the security forces of Rio de Janeiro. Decree 9.288 would place an army general in charge of the state's security until December 31."
 brazil.76.a: "Hand Rio's security to the army"
 brazil.76.b: "Back the state police with federal money"
 brazil.76.c: "Push a rights-first reform"
 brazil.77.t: "The JBS Recording and the Corruption Charge"
 brazil.77.d: "In May, Joesley Batista of the meatpacker §YJBS§! gave prosecutors a recording that implicates [BRA.GetLeader]. A corruption charge followed, and the Chamber of Deputies votes today on whether the Supreme Court may try it. Budget amendments could change many minds."
 brazil.77.a: "Buy the votes with budget amendments"
 brazil.77.b: "Let the Supreme Court hear the charge"
 brazil.77.c: "Let the Batista brothers testify"
 brazil.77.e: "Let JBS pay a leniency fine"
 brazil.78.t: "Illegal Gold Miners Invade Yanomami Land"
 brazil.78.d: "We have declared an emergency in §YYanomami§! territory, where about 20,000 illegal gold miners work among some 30,000 Yanomami. Federal raids are due to begin in February."
 brazil.78.a: "Launch the emergency clearance"
 brazil.78.b: "Look the other way"
 brazil.79.t: "Brazil Sets Its Mining Royalty Rates"
 brazil.79.d: "Mining companies pay the §YCFEM§! royalty on the value of what they dig up, and Congress sets the rates. Higher rates fill the treasury, while lower ones keep mining companies investing."
 brazil.79.a: "Raise the royalty rates"
 brazil.79.b: "Cut the royalty rates"
 brazil.80.t: "Choosing a Partner for Serra Verde's Rare Earths"
 brazil.80.d: "Foreign lenders and buyers are lining up behind the §YSerra Verde§! rare earth mine at Minaçu in Goiás. We can take US development finance, sell the output to Chinese buyers, or fund the expansion ourselves."
 brazil.80.a: "Take US development finance"
 brazil.80.b: "Sell the output to Chinese buyers"
 brazil.80.c: "Fund the expansion ourselves"
 brazil.81.t: "Boeing Wants Control of Embraer's Commercial Arm"
 brazil.81.d: "Boeing has proposed a joint venture that would take over the commercial aircraft business of §YEmbraer§!, with the US firm holding 80% of the new company. The deal needs the approval of our government."
 brazil.81.a: "Sell control of the commercial arm"
 brazil.81.b: "Block the sale and keep Embraer national"
 brazil.82.t: "Law 13.467 Would Rewrite Our Labor Code"
 brazil.82.d: "Congress has sent us a §Ylabor reform§! that makes union dues optional and widens the use of outsourcing. Business groups back the change, and the unions oppose it."
 brazil.82.a: "Sign the labor reform into law"
 brazil.82.b: "Veto the reform"
 brazil.83.t: "The Eletrobras Share Issue Awaits Our Signature"
 brazil.83.d: "Law 14.182 lets the state dilute its stake in §YEletrobras§! through a new share issue. We would keep a golden share that caps any shareholder's votes at 10%, and Eletronuclear and Itaipu would stay public."
 brazil.83.a: "Dilute the state's stake for cash"
 brazil.83.b: "Keep state control"
 brazil.84.t: "Huawei and Our 5G Spectrum Auction"
 brazil.84.d: "Anatel has set the rules for the §Y5G§! spectrum auction without a ban on Huawei, and US officials are pressing us to exclude the company. The bidding begins this week."
 brazil.84.a: "Ban Huawei from the 5G networks"
 brazil.84.b: "Let Huawei bid and supply the networks"
 brazil.84.c: "Build a separate secure government network"
 brazil.85.t: "Paraguay Presses for a New Itaipu Deal"
 brazil.85.d: "We share the power of the §YItaipu§! dam with Paraguay, and Paraguay sells us the energy it does not use. The review of the treaty's financial §YAnnex C§! has begun, and Paraguay wants a higher price."
 brazil.85.a: "Pay Paraguay more for its energy"
 brazil.85.b: "Hold firm on the current terms"
 brazil.86.t: "Petrobras Fights for Equatorial Margin Drilling"
 brazil.86.d: "IBAMA, our environmental agency, has refused Petrobras a license to drill an exploratory well in the §YEquatorial Margin§! off the mouth of the Amazon. The company wants the oil, and environmental groups warn of the risk to the Amazon coast."
 brazil.86.a: "Allow Petrobras to drill"
 brazil.86.b: "Protect the Amazon coast"
 brazil.87.t: "Washington Hits Our Exports with 50% Tariffs"
 brazil.87.d: "[USA.GetLeader] has announced 50% tariffs on our exports, citing what Washington calls political persecution in Brazil. Our beef, coffee, and fruit exporters are among the most exposed, and the §YReciprocity Law§! lets us retaliate."
 brazil.87.a: "Retaliate under the Reciprocity Law"
 brazil.87.b: "Negotiate exemptions for our exporters"
 brazil.87.c: "Pivot to BRICS and China"
 brazil.88.t: "The Supreme Court Suspends the Social Network X"
 brazil.88.d: "The Supreme Court has ordered §YX§! suspended after the company named no legal representative in our country and left court fines unpaid. Many citizens rely on the platform, and critics call the order censorship."
 brazil.88.a: "Enforce the suspension"
 brazil.88.b: "Back down and lift the ban"
 brazil.89.t: "The Fate of Our State Chip Maker CEITEC"
 brazil.89.d: "No buyer has come forward for §YCEITEC§!, our state chip maker in Porto Alegre, and a decree to liquidate it is on the table. Its defenders say it is the only chip maker in Latin America and that its engineers would scatter."
 brazil.89.a: "Liquidate CEITEC"
 brazil.89.b: "Keep CEITEC running"
 brazil.90.t: "The PCC Attacks São Paulo"
 brazil.90.d: "After the state moved its jailed leaders to a distant prison, the §YPrimeiro Comando da Capital§! launched coordinated attacks on police and revolts in prisons. Officers and prison guards are already dead, and the attacks are still spreading. We must decide how to answer the gang."
 brazil.90.a: "Crack down on the gang's leadership"
 brazil.90.b: "Negotiate with the prisoners' leaders"
 brazil.90.c: "Fund prison intelligence and new prisons"
 brazil.91.t: "Our Forces Take the Alemão Complex"
 brazil.91.d: "After a week of arson attacks on vehicles across Rio, police and armed forces have entered the §YAlemão§! complex, where the gangs fell back, and met little resistance. We must decide how long our forces stay."
 brazil.91.a: "Keep the army in the complex"
 brazil.91.b: "Hand the complex to the state police"
 brazil.91.c: "Declare victory and withdraw"
 brazil.92.t: "Massacres in Our Prisons"
 brazil.92.d: "A clash between the §YFamília do Norte§! and the §YPCC§! at the Compaj prison in Manaus left at least 56 inmates dead, and killings at a prison in Roraima followed days later. The war between the gangs has moved into prisons that hold far more inmates than they were built for."
 brazil.92.a: "Draw up a federal prison security plan"
 brazil.92.b: "Send soldiers and federal police into the prisons"
 brazil.92.c: "Let the factions settle it behind the walls"
 brazil.93.t: "The State Inquiry into Rio's Militias"
 brazil.93.d: "A state assembly inquiry into the §Ymilitias§!, paramilitary groups drawn from police officers, firefighters, and prison guards, has asked prosecutors to charge more than 200 people, including elected officials. The militias sell protection and services to neighborhoods across Rio."
 brazil.93.a: "Back the prosecutions"
 brazil.93.b: "Shelve the report"
 brazil.93.c: "Raise police pay and oversight"
 brazil.191.t: "The First Pacifying Police Unit"
 brazil.191.d: "Special forces have taken the §YSanta Marta§! favela above Botafogo, and Rio's security secretary wants a permanent police unit trained in community policing to stay behind instead of the usual raid and withdrawal. If the pilot works, the §YPacifying Police Unit§! model can spread to other hills. The state government asks us for the political backing to make it a program."
 brazil.191.a: "Launch the Pacifying Police Unit program"
 brazil.191.b: "Postpone the pilot unit"
 brazil.192.t: "The Gangs Take the Favelas"
 brazil.192.d: "Our settlement with the cartels has a price we did not write into it. Police patrols no longer enter the favelas, and the gangs now collect the rents, run the vans, and settle disputes in [ROOT.GetAdjective] cities. Every favela we had not cleared is now gang-ruled. Each one puts more strength and influence behind the cartels, and their money behind our government. If we want the hills back, the army will have to retake them one by one."
 brazil.192.a: "So be it"
 BRA_gang_ruled_favelas_tt: "Every remaining favela becomes §YGang-Ruled Favelas§!. Each one adds §Y5§! to the §YStrength of the Cartels§! and §Y3§! to their §YPolitical Influence§!, which raises the narco state's bonuses and drug money. The §YRetake the Favelas§! decision clears them one at a time."
 brazil.94.t: "Brazil Proposes a Trade Agreement"
 brazil.94.d: "[BRA.GetName] has sent a delegation with a draft trade agreement. Brazilian officials argue that lower barriers would open their large market to our exporters and bring us the soy, iron ore, and manufactured goods they sell."
 brazil.94.a: "Sign the agreement"
 brazil.94.b: "Decline the offer"
 brazil.95.t: "Brazil Proposes an Investment Treaty"
 brazil.95.d: "[BRA.GetName] wants a treaty that protects each side's investors and opens new parts of the economy to capital from the other. Brazilian officials say our firms would get the same protection in Brazil that theirs would get here."
 brazil.95.a: "Sign the treaty"
 brazil.95.b: "Decline the offer"
 brazil.96.t: "A Package From Brasília"
 brazil.96.d: "An envoy from [BRA.GetName] has arrived with a proposal in three parts: a trade agreement, new investment, and closer political ties. [BRA.GetLeader] describes our governments as natural partners with shared interests and shared critics."
 brazil.96.a: "Accept the package"
 brazil.96.b: "Decline politely"
 brazil.97.t: "Brazil Offers to Lead a Stabilization Mission"
 brazil.97.d: "[BRA.GetName] has offered to send troops to help restore order here as part of a United Nations stabilization mission. Brazilian officers would command the force, and Brazilian engineers would help rebuild the police."
 brazil.97.a: "Welcome the full mission"
 brazil.97.b: "Accept a smaller contingent"
 brazil.97.c: "Ask the UN for a different force"
 brazil.98.t: "Embraer Offers Us Aircraft"
 brazil.98.d: "[BRA.GetName] has offered to sell us light attack aircraft from its Embraer production line. They are rugged, cheap to fly, and proven in counterinsurgency work, and Brazilian officials say a deal would include training and spare parts."
 brazil.98.a: "Order the aircraft"
 brazil.98.b: "Decline the offer"
 brazil.99.t: "An IBSA Trade and Investment Package"
 brazil.99.d: "[BRA.GetName] wants to turn the IBSA dialogue forum into something concrete: a trade agreement and an investment treaty between our economies. Brazilian officials say India, Brazil, and South Africa should trade with each other before they trade with anyone else."
 brazil.99.a: "Sign the package"
 brazil.99.b: "Decline the offer"
 brazil.100.t: "Brazil Offers a New Deal on Itaipu Energy"
 brazil.100.d: "[BRA.GetName] has agreed to reopen the financial annex of the §YItaipu§! treaty and wants to buy more of the power we do not use. Brasília is offering a supply agreement and a payment. Our negotiators think we could hold out for more."
 brazil.100.a: "Accept the offer"
 brazil.100.b: "Hold out for a higher price"
 brazil.100.c: "Refuse and keep the treaty as it is"
 brazil.101.t: "Brazil Offers a Long-Term Gas Contract"
 brazil.101.d: "[BRA.GetName] has accepted our nationalization and wants a long-term contract for the gas that feeds its power plants. Brazil will remain our biggest customer, and our ministers disagree on whether to take the deal or press for a better price."
 brazil.101.a: "Sign the contract"
 brazil.101.b: "Demand a higher price"
 brazil.101.c: "Refuse and sell the gas elsewhere"
 brazil.102.t: "Brazil Asks Us to Back Its Forest Fund"
 brazil.102.d: "[BRA.GetName] is launching the Tropical Forest Forever fund at COP30 in Belém and has asked for donors. Brazilian officials say every contribution goes to protecting standing forest, and that donors will have a seat at the fund's table."
 brazil.102.a: "Fund the forest"
 brazil.102.b: "Decline the request"
 brazil.200.t: "Brazil Asks Us to Fund the Amazon"
 brazil.200.d: "[BRA.GetName] has launched the Amazon Fund through its development bank and points to the rainforest it has already put under protection. Brazilian officials say donors pay for results, and every contribution goes to protecting standing forest."
 brazil.200.a: "Pay into the fund"
 brazil.200.b: "Decline the request"
 brazil.103.t: "Brazil Offers to Link Lethem to Georgetown"
 brazil.103.d: "[BRA.GetName] wants to pay for a bridge over the Takutu River at Lethem and for paving the road to Georgetown. Brazilian officials say the link would give Roraima a short route to the Atlantic, and our port would carry the traffic."
 brazil.103.d_oil: "[BRA.GetName] wants to pay for a bridge over the Takutu River at Lethem and for paving the road to Georgetown. Our offshore oil has made the port busier than ever, and Brazilian officials say the link would give Roraima a short route to the Atlantic."
 brazil.103.a: "Accept the financing"
 brazil.103.b: "Decline the offer"
 BRA_project_fell_through_d: "The project can no longer go ahead, because one of its sites has changed hands or we are at war with the partner. The work has stopped, and the money we put in is coming back to the treasury."
 brazil.104.t: "The Takutu River Bridge Opens"
 brazil.104.d: "Our engineers and their [GUY.GetAdjective] colleagues have finished the bridge at Lethem, and the road to Georgetown is paved. Trucks from Boa Vista now reach the Atlantic in days, and the port has a new customer."
 brazil.104.a: "Cut the ribbon"
 brazil.104.b: "Guyana can no longer host the bridge. Recover the funds"
 brazil.105.t: "Brazil Asks Us to Host a Pacific Road"
 brazil.105.d: "[BRA.GetName] wants to pay for a bridge over the Paraguay River at Carmelo Peralta and for paving the road across the Chaco. The road is meant to continue to the Chilean ports, and Brazilian officials say the main crossing would be ours."
 brazil.105.a: "Sign the corridor agreement"
 brazil.105.b: "Decline the offer"
 brazil.106.t: "Brazil Asks Us to Pave the Salta Road"
 brazil.106.d: "The Bioceanic Road Corridor now has a bridge at Carmelo Peralta, and [BRA.GetName] wants it to continue through the Argentine north toward the Jama Pass. Brazil would pay for the paving in Salta and Jujuy."
 brazil.106.a: "Join the corridor"
 brazil.106.b: "Decline the offer"
 brazil.107.t: "Brazil Asks Us to Open the Antofagasta Road"
 brazil.107.d: "The Bioceanic Road Corridor is on its way across Paraguay and northern Argentina, and [BRA.GetName] wants its last section to reach our ports at Antofagasta and Iquique. Brazil would pay for upgrading the road in the north."
 brazil.107.a: "Join the corridor"
 brazil.107.b: "Decline the offer"
 brazil.108.t: "The Bioceanic Road Corridor Opens"
 brazil.108.d_full: "The bridge at Porto Murtinho is open, and trucks now run on paved roads across the Chaco and the Andes to the Pacific. Our soy and beef reach Asian ports days sooner, and every country along the road shares in the trade."
 brazil.108.d_bridge: "The bridge at Porto Murtinho is open and the Chaco road is paved, but the corridor stops short of the Pacific. Neither Argentina nor Chile has joined, so our cargo still has to find its own way to the coast."
 brazil.108.a: "Open the corridor"
 brazil.108.b: "Paraguay can no longer host the corridor. Recover the funds"
 brazil.109.t: "Brazil Offers to Pave the Interoceanic Highway"
 brazil.109.d: "[BRA.GetName] wants to link Acre to our Pacific ports by paving a highway across the Amazon and the Andes. Odebrecht would build it with Brazilian development credit, and Brazilian officials say Peru would gain a route for its own exports."
 brazil.109.a: "Accept the highway"
 brazil.109.b: "Decline the offer"
 brazil.110.t: "The Interoceanic Highway Opens"
 brazil.110.d: "Odebrecht's crews have finished the road from Assis Brasil to the Pacific. Brazilian soy and Peruvian copper now cross the Andes on pavement, and the firm's name is on every sign. Some critics ask how the contracts were won."
 brazil.110.a: "Open the highway"
 brazil.110.b: "Peru can no longer host the highway. Recover the funds"
 brazil.111.t: "Car Wash Reaches Odebrecht's Peruvian Contracts"
 brazil.111.d: "Federal prosecutors have found payments tied to the Interoceanic Highway in Odebrecht's records. The Peruvian government wants the files, and some of our own politicians would rather keep them in Brasília."
 brazil.111.a: "Send the records to Lima"
 brazil.111.b: "Shield the contractors"
 brazil.111.c: "Let Odebrecht's executives testify"
 brazil.111.e: "Settle with Odebrecht"
 brazil.112.t: "Brazil Proposes a Railway to the Pacific"
 brazil.112.d: "[BRA.GetName] proposes a railway from Assis Brasil in Acre through Cusco to Lima and the port of Callao. Brazil would pay for the whole line and for roads at the border, and we could say yes to Brazil's plan alone."
 brazil.112.d_joint: "[BRA.GetName] and [CHI.GetName] propose to build the Twin-Ocean Railway together, from Assis Brasil in Acre through Cusco to Lima and the port of Callao. Each would pay part of the cost, and each would gain a place in our economy."
 brazil.112.a: "Accept the railway"
 brazil.112.b: "Decline the offer"
 brazil.113.t: "The Twin-Ocean Railway Is Finished"
 brazil.113.d: "The first train from Assis Brasil has reached Lima and the Pacific coast. We paid for the line ourselves, and Lima knows whom to thank. If China planned the same corridor, its diplomats are not smiling."
 brazil.113.d_joint: "The first train from Assis Brasil has reached Lima and the Pacific coast. Brazilian and Chinese firms built the line together, and Lima now owes both of us."
 brazil.113.a: "Run the first train"
 brazil.113.b: "Peru can no longer host the railway. Recover the funds"
 brazil.114.t: "Congress Questions the BNDES Loans"
 brazil.114.d: "A congressional committee has asked for the files on BNDES loans to a foreign borrower, and journalists have found that some contractors on the project also fund our politicians. The inquiry is only starting, and the Federal Police is watching."
 brazil.114.a: "Let the prosecutors follow the money"
 brazil.114.b: "Protect the contractors"
 brazil.114.c: "Offer the contractors a leniency agreement"
 brazil.115.t: "Brazil Offers to Pay for the Oyapock Bridge"
 brazil.115.d: "[BRA.GetName] proposes to finish the bridge over the Oyapock River that Paris and Brasília agreed on in 2005. Brazil would pay for the bridge and for the roads on both banks, and the ferry between Saint-Georges and Oiapoque would no longer be the only crossing."
 brazil.115.a: "Accept the bridge"
 brazil.115.b: "Decline the offer"
 brazil.116.t: "The Oyapock River Bridge Opens"
 brazil.116.d: "The bridge between Oiapoque and Saint-Georges is open at last. Brazilian trucks reach Cayenne by road, and the roads on both banks are paved. The ferry is a memory."
 brazil.116.a: "Open the bridge"
 brazil.116.b: "The bridge can no longer go ahead. Recover the funds"
 brazil.117.t: "Brazil Offers Rail Links at Rivera and Jaguarão"
 brazil.117.d: "[BRA.GetName] wants to connect its railway to ours at Santana do Livramento and Jaguarão and to pave the roads behind both towns. Brazilian officials say a train from Montevideo could reach Porto Alegre without changing tracks."
 brazil.117.a: "Accept the rail link"
 brazil.117.b: "Decline the offer"
 brazil.118.t: "The Rivera and Jaguarão Rail Links Open"
 brazil.118.d: "The first trains have crossed the border at Santana do Livramento and Jaguarão. Uruguayan grain and Brazilian cars now move on a single line, and the border towns have a new reason to grow together."
 brazil.118.a: "Run the first train"
 brazil.118.b: "Uruguay can no longer host the rail links. Recover the funds"
 brazil.119.t: "Brazil Offers a Share of Two Dams"
 brazil.119.d: "[BRA.GetName] wants to build two dams on the Uruguay River and to pay for a power plant on each bank. Brazilian officials say the dams would give both sides cheap power, and that Brazil will buy what we do not use."
 brazil.119.a: "Accept the dams"
 brazil.119.b: "Hold out for a higher price"
 brazil.119.c: "Refuse and keep the river as it is"
 brazil.120.t: "The Garabí and Panambi Dams Come Online"
 brazil.120.d: "The turbines at Garabí and Panambi are turning. Argentina and Brazil share the river's current, and the border towns have cheap power for the first time."
 brazil.120.a: "Open the dams"
 brazil.120.b: "Argentina can no longer share the dams. Recover the funds"
 brazil.121.t: "The VLS-1 Explodes at Alcântara"
 brazil.121.d: "On August 22, 2003, the VLS-1 rocket ignited on its pad three days before launch. Twenty-one technicians died, and the rocket, the pad, and the tower were destroyed. A board of inquiry is at work, and the engineers ask whether we can still build rockets of our own."
 brazil.121.a: "Rebuild the pad and keep the VLS"
 brazil.121.b: "Turn to foreign partners"
 brazil.122.t: "Brazil Asks to Launch Cyclone-4 from Alcântara"
 brazil.122.d: "[BRA.GetName] proposes a binational company to fly our Cyclone-4 rockets from Alcântara, two degrees south of the equator, where a rocket needs less fuel to reach orbit. Brazil would pay for the launch complex, and we would supply the rocket and the engineers."
 brazil.122.a: "Join Alcântara Cyclone Space"
 brazil.122.b: "Decline the offer"
 brazil.123.t: "Alcântara Cyclone Space Opens Its Launch Complex"
 brazil.123.d: "The Cyclone-4 pad at Alcântara is ready. Ukrainian and Brazilian engineers now work side by side, and Brazil has a partner with decades of launch experience."
 brazil.123.a: "Open the launch complex"
 brazil.123.b: "The launch complex can no longer go ahead. Recover the funds"
 brazil.124.t: "Brazil Weighs Leaving Cyclone Space"
 brazil.124.d: "Cyclone-4 has not flown in all the years since the treaty, and the bills keep coming. Ukraine is struggling to pay its share, and our diplomats have drafted a note that would end the treaty."
 brazil.124.a: "End the partnership"
 brazil.124.b: "Keep funding the company"
 brazil.125.t: "Brazil Asks to Launch a Satellite from Kourou"
 brazil.125.d: "[BRA.GetName] wants to send its Geostationary Satellite for Defense and Strategic Communications into orbit from our spaceport at Kourou. Brazil would pay the agreed launch price, and its ministers promise to remember who carried the satellite."
 brazil.125.a: "Accept the launch"
 brazil.125.b: "Decline the offer"
 brazil.126.t: "The SGDC-1 Satellite Reaches Orbit"
 brazil.126.d: "The satellite lifted off from Kourou and reached its orbit without trouble. It carries broadband to schools and remote towns across Brazil, and secure channels for the armed forces."
 brazil.126.a: "Switch on the satellite"
 brazil.126.b: "The launch can no longer go ahead. Recover the funds"
 brazil.127.t: "Brazil Offers Alcântara for American Launches"
 brazil.127.d: "[BRA.GetName] proposes a Technology Safeguards Agreement that would let American rockets and satellites launch from Alcântara. Brazilian staff would stay out of the areas that hold American technology, and in return Brazil would earn launch fees."
 brazil.127.a: "Sign the agreement"
 brazil.127.b: "Decline the offer"
 brazil.128.t: "Quilombola Families Face Removal at Alcântara"
 brazil.128.d: "The plan to expand the base would move hundreds of quilombola families off land their ancestors settled. The base already moved families once, when it was built in the 1980s. Their leaders have gone to court, and the press is watching."
 brazil.128.a: "Compensate the communities"
 brazil.128.b: "Expand the base anyway"
 brazil.129.t: "French Guiana Decides Its Status"
 brazil.129.d_vote: "French Guiana is voting on its status, and our northern neighbor expects to hear from Brasília. The autonomists ask us for support, while Paris asks us to stay quiet."
 brazil.129.d_autonomous: "French Guiana now governs itself within France, and its new leaders ask where Brasília stands. Backing them would please Cayenne and irritate Paris."
 brazil.129.a: "Back Guianese autonomy"
 brazil.129.b: "Stay out of it"
 brazil.129.c: "Side with Paris"
 brazil.130.t: "Brazil Asks to Share Launches at Kourou"
 brazil.130.d: "[BRA.GetName] proposes a standing agreement to share launches at Kourou. It would pay a fee now, and each rocket it flies would earn a refund on its price. Its ministers promise to remember who opened the pad to them."
 brazil.130.a: "Sign the agreement"
 brazil.130.b: "Decline the offer"
 brazil.131.t: "Operation Welcome Opens in Roraima"
 brazil.131.d: "Thousands of Venezuelans cross into Roraima every week, and the clinics and schools of Boa Vista are full. Brasília has set up Operation Welcome to register arrivals, shelter them, and move families to other states. How far should we go?"
 brazil.131.a: "Relocate families across Brazil"
 brazil.131.b: "Close the border"
 brazil.131.c: "Leave it to Roraima"
 BRA_welcome_interiorizing_tt: "In about nine months the relocated families add §GStability§! and §GManpower§!"
 BRA_welcome_neglected_tt: "Roraima's strain will spill over at §YPacaraima§!"
 brazil.132.t: "Relocated Families Find Work"
 brazil.132.d: "Families moved out of Roraima have found jobs and housing in cities across Brazil. Employers report filled vacancies, and the program now has results to defend."
 brazil.132.a: "Welcome the new workers"
 brazil.133.t: "Mobs Burn Venezuelan Camps in Pacaraima"
 brazil.133.d_neglected: "Roraima's shelters overflowed for months, and a robbery in Pacaraima set the town off. A mob burned the Venezuelan camps, and over a thousand migrants fled back across the border. The state government is begging for federal help."
 brazil.133.d_closed: "Our closed border pushed arrivals into improvised camps around Pacaraima, and a robbery in town set off a mob. The camps burned, and over a thousand migrants fled back across the border."
 brazil.133.d_interiorizing: "A robbery in Pacaraima set off a mob that burned Venezuelan camps, and over a thousand migrants fled back across the border. The relocation program has eased the pressure elsewhere, but not here."
 brazil.133.d: "A robbery in Pacaraima set off a mob that burned Venezuelan camps on 18 August, and over a thousand migrants fled back across the border. Roraima wants federal troops."
 brazil.133.a: "Send the Army to Pacaraima"
 brazil.133.b: "Expand shelters and relocation"
 brazil.133.c: "Leave it to the state government"
 brazil.134.t: "Essequibo Tensions Reach Our Border"
 brazil.134.d: "Venezuela's referendum on Essequibo has stirred fears of an invasion next door, and the Army wants armored vehicles in Boa Vista. Georgetown, Caracas, and Washington all want to know where Brasília stands."
 brazil.134.a: "Reinforce Roraima"
 brazil.134.b: "Mediate between Caracas and Georgetown"
 brazil.134.c: "Stay out of it"
 brazil.135.t: "Amorim at Argyle"
 brazil.135.d: "President Lula stays home, but his envoy, Celso Amorim, joins the Argyle meeting beside CARICOM, CELAC, and the United Nations. The declaration may not hold, but our name is on the invitation."
 brazil.135.a: "Take our seat at the table"
 brazil.136.t: "Caracas Declares Victory"
 brazil.136.d: "Venezuela's electoral council has declared Maduro the winner of the 28 July election without publishing the polling-station tallies. The opposition claims a landslide, and several capitals doubt the result. Brasília is expected to speak."
 brazil.136.a: "Withhold recognition until the tallies are published"
 brazil.136.b: "Recognize the result"
 brazil.137.t: "Venezuela Asks to Join BRICS"
 brazil.137.d: "At the Kazan summit, Venezuela asks for a place in the bloc. Consensus is required, Moscow backs the bid, and Caracas still owes Brasília more than a billion dollars in overdue loans. We can stop it."
 brazil.137.a: "Block the bid"
 brazil.137.b: "Back Venezuela's application"
 brazil.138.t: "The Electoral Court Registers NOVO"
 brazil.138.d: "After four years of collecting signatures, the New Party has won its registration at the Superior Electoral Court, the 33rd party on the ballot. Founded by bankers and executives who refuse public party funding, NOVO promises a smaller state, privatization, and an end to the clientelism of the old parties."
 brazil.138.a: "Another name on the ballot"
 brazil.139.t: "[FROM.GetName] Buys Embraer Aircraft"
 brazil.139.d: "[FROM.GetName] has accepted our offer and ordered a squadron of twelve Embraer light attack aircraft. The contract brings money to the treasury and orders to São José dos Campos, and another air force now depends on Brazilian training and spare parts."
 brazil.139.a: "A good contract for Embraer"
 brazil.140.t: "[FROM.GetName] Declines the Embraer Offer"
 brazil.140.d: "[FROM.GetName] has turned down our offer of Embraer light attack aircraft. Its officials thanked our delegation but said the purchase does not fit their plans for now. Our diplomats can take the offer to other capitals, or try [FROM.GetName] again once some time has passed."
 brazil.140.a: "We will find another buyer"
 brazil.141.t: "[FROM.GetName] Declines Our Proposal"
 brazil.141.d: "[FROM.GetNameWithFlag] has turned down our proposal. Its officials thanked our delegation but said the offer does not fit their plans at this time. Itamaraty can raise the matter again once relations or circumstances change."
 brazil.141.a: "Perhaps another time"
 brazil.142.t: "[FROM.GetName] Signs Our Trade Agreement"
 brazil.142.d: "[FROM.GetNameWithFlag] has signed the trade agreement we proposed. Tariffs between our countries will come down, and Brazilian exporters gain easier access to a neighboring market."
 brazil.142.a: "Good for trade"
 brazil.143.t: "[FROM.GetName] Signs the IBSA Package"
 brazil.143.d: "[FROM.GetNameWithFlag] has signed the IBSA trade and investment package. The agreement links our economies more closely and gives the India, Brazil and South Africa forum something concrete to show for its summits."
 brazil.143.a: "The South works together"
 brazil.144.t: "Haiti Welcomes the Full Mission"
 brazil.144.d: "[FROM.GetNameWithFlag] has agreed to host the full UN stabilization mission under Brazilian command. Our troops will lead MINUSTAH in Port-au-Prince, and the permanent members of the Security Council have taken note of our willingness to carry the burden."
 brazil.144.a: "Brazil takes the lead"
 brazil.145.t: "Haiti Accepts a Smaller Contingent"
 brazil.145.d: "[FROM.GetNameWithFlag] has asked for a smaller Brazilian contingent than we offered. Most of the troops we prepared will stay at home, and the money set aside for the full deployment returns to the treasury."
 brazil.145.a: "A smaller role, then"
 brazil.146.t: "Guyana Accepts the Takutu River Bridge"
 brazil.146.d: "[FROM.GetNameWithFlag] has accepted our offer to finance the Takutu River Bridge and the road to Georgetown. Brazilian contractors can begin work at Lethem, and Roraima will gain its first paved route to the Atlantic."
 brazil.146.a: "Start the works"
 brazil.147.t: "Paraguay Signs the Corridor Agreement"
 brazil.147.d: "[FROM.GetNameWithFlag] has signed the Bioceanic Road Corridor agreement. The bridge at Porto Murtinho and the road across the Chaco can now go ahead, and we can ask Argentina and Chile to complete the route to the Pacific."
 brazil.147.a: "On to the Pacific"
 brazil.148.t: "Argentina Joins the Bioceanic Corridor"
 brazil.148.d: "[FROM.GetNameWithFlag] has agreed to pave the Salta section of the Bioceanic Road Corridor. Our share of the cost goes to the works, and the road from Mato Grosso do Sul will run through northern Argentina."
 brazil.148.a: "The corridor grows"
 brazil.149.t: "Chile Joins the Bioceanic Corridor"
 brazil.149.d: "[FROM.GetNameWithFlag] has agreed to upgrade the road to Antofagasta for the Bioceanic Road Corridor. Our share of the cost goes to the works, and Brazilian cargo will have a Chilean port on the Pacific."
 brazil.149.a: "The corridor reaches the coast"
 brazil.150.t: "Peru Accepts the Interoceanic Highway"
 brazil.150.d: "[FROM.GetNameWithFlag] has accepted our offer to pay for the Interoceanic Highway. Brazilian contractors will pave the route from Acre across the Andes to the Peruvian ports."
 brazil.150.a: "Start the works"
 brazil.151.t: "Peru Accepts the Twin-Ocean Railway"
 brazil.151.d: "[FROM.GetNameWithFlag] has accepted our offer to build a railway from Brazil to the Peruvian coast. Brazil will carry the full cost, and the line will be ours to run."
 brazil.151.d_joint: "[FROM.GetNameWithFlag] has accepted the joint offer from Brazil and the Chinese consortium to build a railway to the Peruvian coast. The consortium will carry half of the cost, and Beijing will expect a say in how the line is run."
 brazil.151.a: "Lay the first track"
 brazil.152.t: "[FROM.GetName] Accepts the Oyapock Bridge"
 brazil.152.d: "[FROM.GetNameWithFlag] has accepted our offer to pay for the bridge over the Oyapock River. Amapá will gain a road link to French Guiana, and through it a land border with the European Union."
 brazil.152.a: "Start the works"
 brazil.153.t: "Uruguay Accepts the Rail Link"
 brazil.153.d: "[FROM.GetNameWithFlag] has accepted our offer to link Rivera and Jaguarão to the Brazilian rail network. Freight from Rio Grande do Sul will soon reach Uruguayan ports by train."
 brazil.153.a: "Start the works"
 brazil.154.t: "Argentina Accepts the Garabí Dams"
 brazil.154.d: "[FROM.GetNameWithFlag] has accepted our share of the Garabí and Panambi dams on the Uruguay River. Work can begin on both sites, and the power will be split between our grids."
 brazil.154.a: "Start the works"
 brazil.155.t: "Argentina Holds Out for More"
 brazil.155.d: "[FROM.GetNameWithFlag] has agreed to the Garabí and Panambi dams, but only after pressing us to pay a larger share of the cost. The deal is done, though the extra money comes out of our treasury."
 brazil.155.a: "A costly agreement"
 brazil.156.t: "Ukraine Joins Alcântara Cyclone Space"
 brazil.156.d: "[FROM.GetNameWithFlag] has agreed to form Alcântara Cyclone Space with us. Ukraine will supply the Cyclone-4 rockets, and our share of the money goes to the launch complex near the equator."
 brazil.156.a: "Build the launch complex"
 brazil.157.t: "[FROM.GetName] Accepts Our Satellite Launch"
 brazil.157.d: "[FROM.GetNameWithFlag] has agreed to launch our Geostationary Satellite for Defense and Strategic Communications from Kourou. We have paid the launch price, and the satellite is being shipped to French Guiana."
 brazil.157.a: "Prepare the satellite"
 brazil.158.t: "The United States Signs the Safeguards Agreement"
 brazil.158.d: "[FROM.GetNameWithFlag] has signed the Technology Safeguards Agreement. American rockets and satellites may now launch from Alcântara, and the fees will help pay for the base."
 brazil.158.a: "Alcântara opens for business"
 brazil.159.t: "[FROM.GetName] Agrees to Share Kourou"
 brazil.159.d: "[FROM.GetNameWithFlag] has signed a standing agreement to share launches at Kourou. We have paid the fee, and each rocket we fly from French Guiana will earn a refund on its price."
 brazil.159.a: "A second launch site"
 brazil.160.t: "[FROM.GetName] Acts on the Odebrecht Records"
 brazil.160.d: "[FROM.GetNameWithFlag] has opened its own cases on the Odebrecht records we sent. Its prosecutors have begun questioning former officials, and Brazil's anti-corruption effort now reaches beyond our borders."
 brazil.160.a: "Justice crosses borders"
 brazil.161.t: "[FROM.GetName] Accepts Our Proposal"
 brazil.161.d: "[FROM.GetNameWithFlag] has accepted our proposal. Itamaraty reports that the terms are signed, and the agreed payments and benefits now take effect."
 brazil.161.a: "A good outcome for Brazil"
 brazil.162.t: "The Contractors' Club"
 brazil.162.d: "A few construction firms win nearly every Petrobras contract, always above the engineers' estimates. Rumor in Brasília says they meet to split the tenders and that a share of each contract flows back to the parties that named Petrobras's directors."
 brazil.162.a: "Look the other way"
 brazil.162.b: "Open the tenders to outside bidders"
 brazil.162.c: "Take a share for the party"
 BRA_brics_sponsor_ven_tt: "[VEN.GetNameWithFlag] applies for §YBRICS§! membership, and the bloc's leader decides"
 BRA_favela_pacification_decision: "Pacify the Favelas in §Y[FROM.GetName]§!"
 BRA_favela_pacification_decision_desc: "After special forces clear the favelas of [FROM.GetName], we station permanent §YPacifying Police Units§! there for six months. The operation costs about §R0.3%§! of our GDP. When it ends, the gangs lose ground: the §YStrength of the Cartels§! falls by §G4§!, their §YPolitical Influence§! falls by §G2§!, and the state's favelas become §YUpgraded Favelas§!. Residents resent the occupation, so we lose some stability. Only one favela project can run at a time.\n\nOur favelas now keep the §YStrength of the Cartels§! at §R[?BRA.BRA_favela_strength_floor|0]§! or more and their §YPolitical Influence§! at §R[?BRA.BRA_favela_influence_floor|0]§! or more. The cartels cannot be defeated until every favela is cleared."
 BRA_favela_housing_decision: "Favela Housing in §Y[FROM.GetName]§!"
 BRA_favela_housing_decision_desc: "We launch a §YMinha Casa, Minha Vida§! housing program in [FROM.GetName]: subsidized homes with water, sewage, and land titles for families from the favelas. The project takes about fifteen months and costs about §R1%§! of our GDP. When it ends, the state loses its favela modifier for good. We can build only where pacification has already pushed the gangs back, and only one favela project can run at a time.\n\nOur favelas now keep the §YStrength of the Cartels§! at §R[?BRA.BRA_favela_strength_floor|0]§! or more and their §YPolitical Influence§! at §R[?BRA.BRA_favela_influence_floor|0]§! or more. The cartels cannot be defeated until every favela is cleared."
 BRA_favela_project_free_tt: "We have no §YFavela§! project under way"
 BRA_favela_cleared_tt: "§GRemoves§! the favela modifier from this state"
 BRA_minustah_deployment: "Lead the Stabilization Mission in Haiti"
 BRA_minustah_deployment_desc: "The United Nations wants a force in Port-au-Prince, and we are ready to command it. The deployment costs troops, money, and political power. If Haiti welcomes the full mission, we earn the goodwill of the permanent members and two years of added standing abroad. If it does not, we get back our political power and money. The §Y$BRA_idea_the_international_mediator$§! spirit halves the money cost."
 BRA_ibsa_trade_investment: "Propose an IBSA Package to [FROM.GetName]"
 BRA_ibsa_trade_investment_desc: "The India-Brazil-South Africa dialogue forum has met for years without much to show for it. We can turn it into a trade agreement and an investment treaty with [FROM.GetName]."
 BRA_neighbor_trade_agreement: "Propose a Trade Agreement to [FROM.GetName]"
 BRA_neighbor_trade_agreement_desc: "[FROM.GetName] sits outside Mercosur's customs union, but our ports, farms, and mines already trade with it. A bilateral agreement would cut tariffs on both sides."
 BRA_embraer_export_deal: "Offer Embraer Aircraft to [FROM.GetName]"
 BRA_embraer_export_deal_desc: "Embraer's light attack aircraft already fly with air forces on three continents. [FROM.GetName] is friendly enough to talk about buying a squadron."
 BRA_brics_application_tt: "If an India-led §YBRICS§! exists and we are not yet a full member, we apply for full membership"
 BRA_partner_package_tt: "Each government that accepts signs a §Ytrade agreement§! with us, receives new §Yinvestment§!, and gives us §Ginfluence§! over it. Both governments gain §G15§! Political Power and a lasting §Gfriendship§!."
 BRA_sponsor_ven_mercosur_tt: "We sponsor §YVenezuela§!'s application for associate membership in §YMercosur§!"
 BRA_cop30_donors_tt: "Each donor that accepts pays into the forest fund. We gain the money and §G20§! million conserved acres, and the donor gains our gratitude and §Ginfluence§! over us."
 BRA_bolivian_gas_offer_tt: "§YBolivia§! can sign a gas contract, demand a higher price, or refuse. We pay only if it agrees, and a higher price costs us extra money. If we still have an energy deficit, it starts sharing energy with us and we pay for it every week."
 BRA_itaipu_offer_tt: "§YParaguay§! can accept, hold out for a higher price, or refuse. We pay only if it agrees, and a higher price costs us extra money. If we still have an energy deficit, it starts sharing energy with us and we pay for it every week."
 BRA_on_security_council_tt: "We sit on the §YUN Security Council§!"
 BRA_embraer_boeing_partnership_tt: "Aircraft sold through our §YEmbraer§! export decision earn §G25%§! more"
 BRA_embraer_national_control_tt: "Each aircraft sale through our §YEmbraer§! export decision adds §G50§! more funds to the §YEmbraer§! organization"
 BRA_minustah_p5_tt: "The following will execute for every permanent member of the Security Council:\n"
 BRA_minustah_haiti_tt: "§YHaiti§! can welcome the full mission, accept a smaller contingent, or ask the UN for another force. Only the full mission earns us the §Y$BRA_idea_minustah_mission$§! spirit and the goodwill of the permanent members. Otherwise we get back our political power, our money, and some or all of our troops."
 BRA_ibsa_package_open_tt: "We have not yet signed both a §Ytrade agreement§! and an §Yinvestment treaty§! with them"
 BRA_embraer_export_deal_tt: "They pay for twelve light attack aircraft, we earn the money, and the §YEmbraer§! organization gains funds."
 BRA_embraer_deal_cooldown_tt: "We have no §YEmbraer§! export offer awaiting an answer and have not closed a deal in the last year"
 BRA_guyana_takutu_link: "Link Roraima to Georgetown"
 BRA_guyana_takutu_link_desc: "The road from Boa Vista crosses the Takutu River at Lethem and runs on toward Georgetown's deepwater port. A bridge and a paved road would give Roraima a short way to the Atlantic and give Guyana a customer on its southern border. We pay for the bridge, the road, and a rail link, and §YGuyana§! decides whether to accept."
 BRA_guyana_takutu_link_tt: "§YGuyana§! can accept or decline. If it accepts, we pay §R12.5§! billion now, and in about nine months the §YTakutu River Bridge§! opens. We gain infrastructure in Roraima, the Rupununi, and Georgetown, a railway from Boa Vista to Georgetown, a trade agreement, §Ginfluence§! over Guyana, and higher resource exports."
 BRA_bioceanic_corridor: "Open the Bioceanic Road Corridor"
 BRA_bioceanic_corridor_desc: "A road from Porto Murtinho across the Paraguayan Chaco and the Argentine Andes to the Chilean ports would shorten the way for our soy and beef to Asia. Paraguay holds the key crossing at Carmelo Peralta, so we start with Asunción. Argentina and Chile can join once it agrees."
 BRA_bioceanic_corridor_tt: "§YParaguay§! can accept or decline. If it accepts, we pay §R7§! billion for the bridge and the Chaco road, and then ask §YArgentina§! and §YChile§! to join for §R3.5§! billion each. When the bridge opens in about ten months, we gain infrastructure in Mato Grosso do Sul and in every state that joined, higher resource exports, and §Ginfluence§! over Paraguay. If Argentina or Chile joins, the corridor reaches the Pacific and the gains are larger."
 BRA_interoceanic_highway: "Build the Interoceanic Highway"
 BRA_interoceanic_highway_desc: "Odebrecht is ready to pave the road from Assis Brasil over the Andes to the Peruvian ports on the Pacific, with BNDES credit behind it. Acre would finally have a route to Asia, and Peru would have a Brazilian partner in its jungle. The contracts will not escape attention if prosecutors ever look at them."
 BRA_interoceanic_highway_tt: "§YPeru§! can accept or decline. If it accepts, we pay §R10.5§! billion now, and in a year the road opens. We gain infrastructure in Acre and two Peruvian states, a trade agreement, §Ginfluence§! over Peru, and higher resource exports. If Operation Car Wash opens later, Odebrecht's Peruvian contracts come under investigation."
 BRA_twin_ocean_railway: "Build the Twin-Ocean Railway Ourselves"
 BRA_twin_ocean_railway_desc: "A railway from Assis Brasil through Cusco to Lima and the port of Callao would carry Brazilian cargo to the Pacific. We can build it with our own money and keep the credit, even if China has the same corridor in mind."
 BRA_twin_ocean_railway_tt: "§YPeru§! can accept or decline. If it accepts, we pay §R11§! billion now, and in about eighteen months the railway opens. We gain infrastructure in Acre and Madre de Dios, a rail line to Lima, §G6%§! influence over Peru, and higher resource exports. If China has announced its Five-Country Highway Corridor, it resents being left out."
 BRA_twin_ocean_joint_railway: "Build the Twin-Ocean Railway with China"
 BRA_twin_ocean_joint_railway_desc: "China has already planned a five-country highway corridor across South America. A Brazilian and Chinese consortium could build the railway from Assis Brasil to Lima together, splitting the bill and the influence in Lima."
 BRA_twin_ocean_joint_railway_tt: "§YPeru§! can accept or decline. If it accepts, we pay §R5.5§! billion now, and in about eighteen months the railway opens. We gain infrastructure in Acre and Madre de Dios, a rail line to Lima, and a small rise in resource exports. We and §YChina§! each gain §G3%§! influence over Peru, and China's opinion of us improves."
 BRA_oyapock_bridge: "Build the Oyapock Bridge with [FROM.GetName]"
 BRA_oyapock_bridge_desc: "France and Brazil agreed in 2005 to bridge the Oyapock River between Oiapoque and Saint-Georges, and a ferry still carries every truck. We can pay for the bridge and the roads on both banks if [FROM.GetName] agrees."
 BRA_oyapock_bridge_tt: "The owner of §YFrench Guiana§! can accept or decline. If it accepts, we pay §R7§! billion now, and in about ten months the bridge opens. We gain infrastructure in Amapá and French Guiana, a trade agreement with its owner, better opinion, and a small rise in trade opinion."
 BRA_uruguay_rail_link: "Link Rivera and Jaguarão by Rail"
 BRA_uruguay_rail_link_desc: "Our railways stop at the Uruguayan border at Santana do Livramento and Jaguarão, and so do Uruguay's. We can connect them across both frontier towns and pave the roads behind them. A train from Montevideo would reach Porto Alegre without changing tracks."
 BRA_uruguay_rail_link_tt: "§YUruguay§! can accept or decline. If it accepts, we pay §R10§! billion now, and in about eight months two short railways open at Rivera and Jaguarão. We gain infrastructure in Rio Grande do Sul and northern Uruguay, a trade agreement, §Ginfluence§! over Uruguay, and a small rise in trade opinion."
 BRA_garabi_panambi_dams: "Dam the Uruguay River at Garabí and Panambi"
 BRA_garabi_panambi_dams_desc: "Two dams on the river we share with Argentina would add clean power on both banks. We pay for the plants, and §YArgentina§! decides whether to take part and at what price."
 BRA_garabi_panambi_dams_tt: "§YArgentina§! can accept, hold out for a higher price, or refuse. If it agrees, we pay up to §R19§! billion now, and in about eighteen months the dams open. We gain a renewable power plant in Rio Grande do Sul and another in Mesopotamia, and §Ginfluence§! over Argentina. If we have an energy deficit, Argentina also starts sharing energy with us and we pay for it every week. A higher price costs us extra money."
 BRA_alcantara_cyclone_space: "Found Alcântara Cyclone Space with Ukraine"
 BRA_alcantara_cyclone_space_desc: "Alcântara sits two degrees south of the equator, so a rocket launched there needs less fuel to reach orbit. Ukraine has the Cyclone-4 rocket and decades of flight experience, and we have the site. We can pay for the launch complex if Ukraine agrees."
 BRA_alcantara_cyclone_space_tt: "§YUkraine§! can accept or decline. If it accepts, we pay §R5§! billion now, or §R3.5§! billion if we turned to foreign partners after the Alcântara accident. In about two years the launch complex opens. We gain §Glaunch reliability§!, a research bonus for launch vehicles, a trade agreement, and better opinion. If we are still in the company in 2015, we must decide whether to stay."
 BRA_kourou_satellite_launch: "Launch a Satellite from Kourou with [FROM.GetName]"
 BRA_kourou_satellite_launch_desc: "The European spaceport at Kourou is ready today. An Ariane 5 could carry our geostationary satellite into orbit, and [FROM.GetName] would earn the launch fee."
 BRA_kourou_satellite_launch_tt: "The owner of §YFrench Guiana§! can accept or decline. If it accepts, we pay it §R3§! billion now, and in about nine months the satellite reaches orbit. We gain a research bonus for communications satellites, cheaper education, and better opinion. If the §YOyapock Bridge§! is open, we pay only §R2§! billion and the opinion gain is larger. If we have signed the §YKourou§! launch-sharing agreement, we pay §G1§! billion less."
 BRA_kourou_launch_sharing: "Share Launches at Kourou with [FROM.GetName]"
 BRA_kourou_launch_sharing_desc: "France has opened Kourou to friendly partners. A standing agreement would let us fly our rockets from the pad and get part of each rocket's price back, and [FROM.GetName] would earn the fee."
 BRA_kourou_launch_sharing_tt: "The owner of §YFrench Guiana§! can accept or decline. If it accepts, we pay it §R2§! billion now. Each launch of our rockets then refunds §G15%§! of each rocket's price, and our §YKourou§! satellite launch costs §G1§! billion less."
 BRA_olv_launch_rebate_tt: "Launches refund §G15%§! of each rocket's price"
 BRA_alcantara_safeguards_agreement: "Sign the Technology Safeguards Agreement"
 BRA_alcantara_safeguards_agreement_desc: "Many satellites contain American parts, and US export rules bar launching them from a site without a safeguards agreement. Signing would open Alcântara to American launches, with launch fees for us and tight limits on our own access."
 BRA_alcantara_safeguards_agreement_tt: "The §YUnited States§! can accept or decline. If it accepts, we gain §G2§! billion in launch fees and better opinion. In about three months the expansion of the base threatens the §Yquilombola§! communities, and we must choose how to answer."
 BRA_vls_foreign_partners_tt: "The §YAlcântara Cyclone Space§! offer to §YUkraine§! costs §G1.5§! billion less"
 BRA_bndes_export_credit: "Extend BNDES Credit to [FROM.GetName]"
 BRA_bndes_export_credit_desc: "BNDES lends to Brazilian contractors that build abroad, such as the Mariel port zone in Cuba, the Caracas metro in Venezuela, and Ecuador's hydroelectric dams. We fund the project through the international investment system, and the borrower can accept or refuse. A corrupt borrower can drag us into a scandal."
 BRA_bndes_export_credit_tt: "The borrower receives an offer to build a project we fund: an industrial zone in §YCuba§!, a metro line in §YVenezuela§!, or a hydroelectric plant in §YEcuador§!. If it accepts, the price of the project comes out of our treasury and we gain §Ginfluence§! over the borrower."
 BRA_bndes_scandal_risk_tt: "A corrupt borrower makes a §Rcorruption scandal§! in Congress possible within a year, but only the first time we lend to it"
 BRA_state_can_take_infrastructure_tt: "Has room for another level of §Yinfrastructure§!, and its controller has the §Yrailway tech§! to build it"
 BRA_odebrecht_records_tt: "§YPeru§! receives the Odebrecht records and decides whether to open an audit"
 BRA_favela_modifier: "Favelas"
 BRA_favela_modifier_desc: "Dense settlements built without land titles, services, or secure policing house many of our young workers, but they crowd out formal building plots and slow the state's economic growth. The gangs recruit here: the §YStrength of the Cartels§! cannot fall below §R5§! for each favela, nor their §YPolitical Influence§! below §R2§!, and the cartels cannot be defeated while any favela remains. If we ever concede to the narcos, the gangs take every favela still standing.\n§W--------------§!\nThis modifier will §GImprove§! when the §YPacify the Favelas§! decision ends in this state. In §YRio de Janeiro§!, it will also §GImprove§! if we complete the §Y$BRA_bolsa_familia$§! focus and fund roads and drainage, or approve the §YSanta Marta§! pacifying police unit in 2008."
 BRA_favela_improving_modifier: "Upgraded Favelas"
 BRA_favela_gang_ruled_modifier: "Gang-Ruled Favelas"
 BRA_favela_gang_ruled_modifier_desc: "Since our settlement with the cartels, the gangs run these favelas openly. They recruit freely, tax local businesses, and sabotage anything they do not control. Each gang-ruled favela adds §Y5§! to the §YStrength of the Cartels§! and §Y3§! to their §YPolitical Influence§! in the narco state.\n§W--------------§!\nThis modifier will be §RRemoved§! by the §YRetake the Favelas§! decision."
 BRA_gang_ruled_favelas_category: "Gang-Ruled Favelas"
 BRA_gang_ruled_favelas_category_desc: "Our deal with the cartels left the favelas in their hands. Each gang-ruled favela strengthens the narco state and its drug trade, but it costs us building room, growth, and order. The army can take them back one at a time, at a high price."
 BRA_retake_the_favelas_decision: "Retake the Favelas of [FROM.GetName]"
 BRA_retake_the_favelas_decision_desc: "We send the army and the federal police into the gang-ruled favelas of [FROM.GetName] and hold them for a year while the state rebuilds. The operation costs about §R1.5%§! of our GDP and shakes the cartels' trust in our government. When it ends, the favelas are cleared for good, and the cartels lose this state's share of their strength and influence. Only one favela project can run at a time."
 BRA_favela_improving_modifier_desc: "Paved streets, drainage, and clinics have made the settlements safer and easier to build around, though families still lack secure titles and proper housing. The gangs still recruit here: the §YStrength of the Cartels§! cannot fall below §R2§! for each upgraded favela, nor their §YPolitical Influence§! below §R1§!, and the cartels cannot be defeated while any favela remains.\n§W--------------§!\nThis modifier will be §RRemoved§! by the §YFavela Housing§! decision."

 # News Events
 brazil_news.1.t: "Bolsonaro Coups Brazilian Government!"
 brazil_news.1.d: "Following months of verbal attacks on democracy and moves against Congress, Bolsonaro has staged a coup against the government and installed himself as leader by decree. What will become of Brazil, a nation that has suffered so much political turmoil and now faces a second military dictatorship in under fifty years?"
 brazil_news.1.a: "Brazil above everything, God above all!"
 brazil_news.1.b: "Let us hope for the best"
 brazil_news.2.t: "Brazil Privatizes Petrobras"
 brazil_news.2.d: "Following Paulo Guedes's economic liberalization plans, the Official Journal of the Union (DOU) announced this week that Petrobras, a multinational company majority-owned by the Brazilian government, will open completely to outside shareholders."
 brazil_news.2.a: "Brazil must loosen the state's grip to progress"
 brazil_news.2.b: "We hope they are doing the right thing"
 brazil_news.3.t: "Luiz I Brings Back the Monarchy in Brazil"
 brazil_news.3.d: "After weeks of rapid growth in monarchist movements, Luiz I was crowned today as the third emperor of Brazil. All military leaders and politicians present paid their respects, and a new flag and name for the country were announced at the press conference. Whether this will shake Brazil further or stabilize it and bring peace and prosperity remains to be seen."
 brazil_news.3.a: "Luiz I shall lead us to prosperity!"
 brazil_news.3.b: "Good luck to them"
 brazil_news.5.t: "The Amazon Is Devastated"
 brazil_news.5.d: "Brazilian authorities have confirmed in their monthly report that the Amazon rainforest has fallen below fifty million acres. Scientists say the forest can no longer recover on its own, and governments from Washington to Beijing are weighing what the loss means for the climate, for rainfall across South America, and for carbon markets."
 brazil_news.5.a: "The world is watching how we answer"
 brazil_news.5.b: "The world will pay for this loss"
 brazil_news.4.t: "Lula Wins Brazil's Presidential Election"
 brazil_news.4.d: "Luiz Inácio Lula da Silva of the Workers' Party has won the Brazilian presidency on his fourth attempt, defeating José Serra of the PSDB. The former metalworker promised change without chaos, and investors who feared a left-wing government are watching the real."
 brazil_news.4.a: "A new chapter begins for the Workers' Party"
 brazil_news.4.b: "Watch how the new government handles the markets"
 brazil_news.6.t: "Brazil's Senate Removes Dilma Rousseff"
 brazil_news.6.d: "The Brazilian Senate has voted to remove President Dilma Rousseff from office for breaking federal budget rules, ending the Workers' Party's hold on the presidency. Vice President Michel Temer of the MDB has been sworn in, and Rousseff's supporters call the vote a parliamentary coup."
 brazil_news.6.a: "Move on under new leadership"
 brazil_news.6.b: "Brazil enters a new political era"
 brazil_news.7.t: "Lula Surrenders to Police in Curitiba"
 brazil_news.7.d: "Luiz Inácio Lula da Silva, founder of the Workers' Party, has turned himself in to the Federal Police after an appeals court upheld his conviction in the Guarujá apartment case. His supporters call the case political persecution, and the conviction keeps him off the ballot."
 brazil_news.7.a: "Our courts have spoken"
 brazil_news.7.b: "Brazil's best-known politician is behind bars"
 brazil_news.8.t: "The PSL Wins Brazil's Presidential Election"
 brazil_news.8.d: "[BRA.GetLeader] of the Social Liberal Party has won Brazil's presidential election. Voters angry at the old parties and the Car Wash scandals gave the party a clear mandate, and generals, evangelical leaders, and investors are already lining up behind the new government."
 brazil_news.8.a: "The old parties have been swept aside"
 brazil_news.8.b: "Brazil turns sharply to the right"

 ##Flavour Events
 brazil_flavour_events.1.t: "Kidnapping of Patrícia Abravanel"
 brazil_flavour_events.1.d: "The kidnapping of Patrícia Abravanel, daughter of media mogul Silvio Santos, has gripped the nation. Patrícia has been ransomed, but the local police are still trying to catch the kidnapper, who has escaped and killed two officers despite the police's claim to have the situation under control."
 brazil_flavour_events.1.a: "Let the local police do their jobs"
 brazil_flavour_events.1.b: "Intervene with the Federal Police"

 brazil_flavour_events.2.t: "Kidnapping of Silvio Santos"
 brazil_flavour_events.2.d: "While the Federal Police searched for Patrícia Abravanel's kidnapper, he reappeared at the home of Silvio Santos and took him hostage, demanding to surrender personally to São Paulo's governor, Geraldo Alckmin. With the governor's help, the Federal Police have accepted the kidnapper's surrender."
 brazil_flavour_events.2.a: "The kidnapper is finally brought to justice!"

 brazil_flavour_events.3.t: "Murder of Silvio Santos"
 brazil_flavour_events.3.d: "While the Federal Police searched for Patrícia Abravanel's kidnapper, he reappeared at the home of Silvio Santos and took him hostage, demanding to surrender personally to São Paulo's governor, Geraldo Alckmin. However, a blunder by one of the officers involved resulted in the death of Silvio Santos and the kidnapper. Opposition media have seized on the news, and it is being rebroadcast nationwide."
 brazil_flavour_events.3.a: "This is a national embarrassment!"

 brazil_flavour_events.4.t: "The Assassination of Antônio da Costa Santos"
 brazil_flavour_events.4.d: "Antônio da Costa Santos, known as \"Toninho\", the mayor of Campinas, was assassinated today while driving home from a shopping mall. His death has drawn much speculation: some believe it was politically motivated, others call it a botched robbery. Either way, the loss of a valuable member of the Workers' Party has drawn more attention to the rising left-wing party."
 brazil_flavour_events.4.a: "Another tragedy in paradise"
 brazil_flavour_events.4.b: "We must find those responsible"

 brazil_flavour_events.5.t: "Brazil's Fifth FIFA World Cup"
 brazil_flavour_events.5.d: "Brazil and Germany played an outstanding 2002 World Cup final, and Brazil took the win, 2–0. The victory is Brazil's fifth, the most World Cup wins of any nation since the competition began. Today is a proud day for the Brazilian people."
 brazil_flavour_events.5.a: "Vamos, vamos, Brasil!"
 brazil_flavour_events.5.b: "Brazil, Brazil, Brazil!"

 brazil_flavour_events.6.t: "Canal Hotel Bombing"
 brazil_flavour_events.6.d: "Just a few days after the United Nations set up an assistance mission in Iraq, Jama'at al-Tawhid wal-Jihad drove a car bomb into the Canal Hotel. The terror attack killed the Brazilian UN special representative Sérgio Vieira de Mello along with at least 21 others, and wounded over one hundred UN employees and personnel."
 brazil_flavour_events.6.a: "We mourn a hero of peace and the people"
 brazil_flavour_events.6.b: "We could have prevented this tragedy"

 brazil_flavour_events.7.t: "Cyclone Catarina"
 brazil_flavour_events.7.d: "Cyclone Catarina, a rare hurricane-like storm, has formed in the South Atlantic off the coast of Santa Catarina and threatens that state and Rio Grande do Sul. Many have fled their homes, but we have not yet declared a state of emergency or ordered an evacuation, and many remain despite repeated warnings. What should we do?"
 brazil_flavour_events.7.a: "Evacuate the endangered regions"
 brazil_flavour_events.7.b: "They chose to live there"

 brazil_flavour_events.8.t: "Aftermath of the Putim Prison Jailbreak"
 brazil_flavour_events.8.d: "In late 1999, a record-breaking jailbreak at Putim Prison freed 345 of its 456 inmates. Human Rights Watch has cited Brazil as one of the worst countries in the world for prison security and safety, and legislation to rectify some of these issues is now in progress. Should we push for its passage, or allow the government and its departments to be undermined further?"
 brazil_flavour_events.8.a: "Push for its approval"
 brazil_flavour_events.8.b: "Deny the need"

 brazil_flavour_events.9.t: "Banco Central Burglary"
 brazil_flavour_events.9.d: "The Banco Central branch in Fortaleza was robbed today in one of the largest bank heists in history. A gang spent months preparing, running a landscaping company as a front and tunneling beneath nearly two city blocks to reach the vault. They made off with about R$165 million in unnumbered bills, which makes the loss nearly impossible to trace."
 brazil_flavour_events.9.a: "Rally the Federal Police to prevent a repeat"
 brazil_flavour_events.9.b: "Write off the loss"

 brazil_flavour_events.10.t: "Sérgio Vieira de Mello Medal"
 brazil_flavour_events.10.d: "In 2003, Sérgio Vieira de Mello died in the Canal Hotel bombing. Today, under Law No. 12.281, we have established the Sérgio Vieira de Mello Medal in honor of his life and work. Brazil shows the world that we honor our heroes and the brave people who pursue international peace."
 brazil_flavour_events.10.a: "We honor your memory, Sérgio"

 brazil_flavour_events.11.t: "TAM Airlines Flight 3054 Disaster"
 brazil_flavour_events.11.d: "At São Paulo/Congonhas Airport, TAM Airlines Flight 3054 crashed into an express warehouse next to a gas station. The plane exploded on impact, killing all 187 people on board and 12 people on the ground. Flight 3054 is now the deadliest aviation disaster in South American history."
 brazil_flavour_events.11.a: "The pilot should have been trained better"
 brazil_flavour_events.11.b: "We will mourn them"

 brazil_flavour_events.12.t: "Brazil's 2017 Carnival"
 brazil_flavour_events.12.d: "Brazil's Carnival is a public celebration of parades, circus elements, masks, and street parties. People wear costumes that let them shed their everyday individuality and feel a heightened sense of social unity. It is the world's largest festival and truly represents Brazil."
 brazil_flavour_events.12.a: "Is the best party in Salvador or in Rio?"

 brazil_flavour_events.13.t: "Cristo Redentor Declared a World Wonder"
 brazil_flavour_events.13.d: "The New7Wonders of the World initiative, begun in 2000, set out to choose a new list of wonders, since almost all the ancient ones no longer stand. Today it was announced that Cristo Redentor in Rio has been named one of the New Seven Wonders of the World."
 brazil_flavour_events.13.a: "Brazil's heart swells with pride"
 brazil_flavour_events.13.b: "Count on the tourism money"

 brazil_flavour_events.14.t: "The Democrats Have Formed"
 brazil_flavour_events.14.d: "The Liberal Front Party has refounded itself as \"The Democrats\" to better align its image with its support for free-market policies and democracy and to distance itself from other international liberal parties."
 brazil_flavour_events.14.a: "A New Contender"
 brazil_flavour_events.15.t: "PRONA Merges into the Party of the Republic"
 brazil_flavour_events.15.d: "The Party of the Rebuilding of the National Order has voted to merge with the Liberal Party into a new Party of the Republic. The fusion trades the nationalist crusade of its founder for a share of a larger centrist machine and its public funding. The integralist movement that used to lend PRONA its votes now stands alone on the far right."
 brazil_flavour_events.15.a: "The old order fades"
 brazil_flavour_events.16.t: "PMDB Becomes the MDB"
 brazil_flavour_events.16.d: "The Party of the Brazilian Democratic Movement has voted at an extraordinary convention to drop the word Party from its name and become simply the Brazilian Democratic Movement. The leadership presents the change as a return to the prestige of its opposition-era origins after years of corruption scandals. The party machine, its mayors and its senators remain exactly where they were."
 brazil_flavour_events.16.a: "New name, same centrão"
 brazil_flavour_events.17.t: "PPS Becomes Cidadania"
 brazil_flavour_events.17.d: "The Superior Electoral Court has approved the request of the Popular Socialist Party to rename itself Cidadania. The party says the word socialist no longer describes a social-liberal, pro-democracy center party, and the new name marks the end of its long journey away from communist origins. Its bench and its alliances are unchanged."
 brazil_flavour_events.17.a: "Citizenship, not socialism"
 brazil_flavour_events.18.t: "PHS Absorbed by Podemos"
 brazil_flavour_events.18.d: "The Superior Electoral Court has approved the incorporation of the Humanist Party of Solidarity into Podemos. The small Christian-democratic party could not clear the new performance clause on its own and brings its mandates, members and share of the party fund into the larger center-right party. Podemos gains a bench and the humanists keep their seats."
 brazil_flavour_events.18.a: "One party fewer"
 brazil_flavour_events.19.t: "The Democrats and the PSL Form União Brasil"
 brazil_flavour_events.19.d: "The Superior Electoral Court has approved the merger of the Democrats and the Social Liberal Party into a new party, União Brasil. The union combines the old center-right of the Democrats with the party that carried the nationalist right to the presidency, and it starts life with the largest bench in Congress and the biggest share of the party fund. The nationalist wing has already moved on to the Liberal Party."
 brazil_flavour_events.19.a: "A new giant on the right"

