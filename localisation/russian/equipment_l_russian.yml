 Anti_tank_5: "ПТУР 2035 года"
 Anti_tank_5_desc: "Противотанковые управляемые ракеты — переносные ракетные комплексы с кумулятивными боевыми частями, специально предназначенными для поражения тяжелобронированной техники."
 Heavy_Anti_tank_5: "Самоходный ПТУР 2035 года"
 Heavy_Anti_tank_5_desc: "Тяжёлые противотанковые управляемые ракетные комплексы обладают большей дальностью и более мощной боевой частью. Из-за повышенного веса они непригодны для переноски вручную и устанавливаются на транспортные средства. Они используют кумулятивные боеголовки, специально предназначенные для поражения сильно бронированной техники."
