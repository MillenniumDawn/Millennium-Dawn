l_korean:
 SRA_idea_isolationist_focused_foreign_office: "반외세 정책 우세"
 SRA_idea_isolationist_focused_foreign_office_desc: "우리나라의 상황과 갑작스럽고 불안정한 \\"탄생\\"으로 인해, 정부 내 다수는 물론 일반 대중도 외교 정책이 어떠해야 하는지는 고사하고 외교 정책 자체를 고려하지 않고 있습니다. 현재로서는 외무부가 실제 임명이라기보다 정부 진용을 채우기 위한 대역으로 여겨지고 있습니다."
 SRA_idea_neighborhood_foreign_policy: "제한적 외교 정책 프로그램"
 SRA_idea_neighborhood_foreign_policy_desc: "우리의 훌륭한 국가가 발전하고 위대한 남부에 대한 대중의 인식이 바뀜에 따라, 이제 우리는 국경 너머로 눈을 돌리려 합니다. 친구를 사귈 수도 있겠지만 적이 생기리라는 것도 분명히 압니다. 하지만 지금은 지구 반대편에 무엇이 있는지보다 국경 너머에 무엇이 있는지를 이해하고자 합니다."
 SRA_idea_historical_tensions: "역사적 긴장"
 SRA_idea_historical_tensions_desc: "남부 연합과 남부 전체의 역사는 노예제, 짐 크로법, 인종 분리, 그리고 그 밖에 무엇이 더 있는지 하느님만 아는 것들로 얼룩져 있습니다. 이 문제 많고 피로 얼룩진 과거와 관계없이, 우리는 옛 망령을 떨쳐 내고 우리의 이미지뿐 아니라 모든 남부 시민의 삶을 개선할 방법을 모색해야 합니다."
 Southern_Republic_of_America_focus: "미 남부 공화국 중점 계통도"
 CSA_focus_creating_a_federal_government: "연방정부의 출범"
 CSA_focus_creating_a_federal_government_desc: "사회는 우리 눈앞에서 무너졌습니다. 평화나 안정을 위해 조직을 갖추고 어디로든 나아가려면 일종의 중앙 정부를 수립하는 방안을 모색해야 합니다."
 CSA_focus_bayou_battle: "바이유 태생"
 CSA_focus_bayou_battle_desc: "루이지애나 주는 경제가 탄탄하며 걸프 연안을 끼고 있어 거대한 무역 중심지이기도 합니다. 그럼에도 공공 서비스를 복구하려면 이 주를 안정된 상태로 재건해야 합니다."
 CSA_focus_cajun_cookin: "케이준 요리"
 CSA_focus_cajun_cookin_desc: "경제가 어느 정도 회복되었으니 이제 주에 공공 서비스와 질서를 다시 도입할 수 있습니다. 이는 통합으로 가는 길의 디딤돌에 불과합니다. 우리의 미래를 공고히 할 것은 바로 이 통합이기 때문입니다."
 CSA_focus_mississippi_mayhem: "미시시피의 혼란"
 CSA_focus_mississippi_mayhem_desc: "미시시피 강은 무역과 방어를 위한 전략적, 경제적 요충지입니다. 강과 걸프 연안 개발 같은 사업을 되살리려면 이 주의 경제 역량을 회복시켜야 합니다."
 CSA_focus_magnolia_miracle: "목련의 기적"
 CSA_focus_magnolia_miracle_desc: "이 주의 경제는 정상화되고 있으며 상황이 진정되기 시작했습니다. 이제 소방, 응급 의료, 법 집행 같은 공공 서비스를 다시 도입할 때입니다. 머지않아 이 주는 남부의 가족으로 돌아올 것입니다."
 CSA_focus_the_rotten_peach: "썩은 복숭아"
 CSA_focus_the_rotten_peach_desc: "연방의 대폭동이 조지아를 덮쳤을 때 이 주는 들끓고 황폐해졌습니다. 애틀랜타는 대규모 약탈과 갱단 폭력, 그 밖에 무슨 일이 있었는지 하늘만이 아는 그 자체로 전쟁터였습니다. 이제 먼지가 가라앉고 있으니, 주의 안정을 위해 어디로든 나아가려면 어떤 형태로든 재건을 해야 합니다."
 CSA_focus_the_fruitful_venture: "결실 있는 사업"
 CSA_focus_the_fruitful_venture_desc: "조지아 주의 재건에 투자한 덕분에 이제 행정적 결속과 공공 서비스를 다시 세워 주의 법과 질서를 온전히 회복하는 데로 눈을 돌릴 수 있습니다."
 CSA_focus_a_carolina_reaping: "캐롤라이나의 수확"
 CSA_focus_a_carolina_reaping_desc: "사우스캐롤라이나의 경제는 애초에 대단치 않았으나, 모든 것이 처한 처참한 상황을 감안하면 결속과 기능하는 사회라는 관념을 되살리기 위해 투자해야 합니다. 이는 다른 주들과의 무역과 연안 항구의 가동에도 도움이 될 것입니다."
 CSA_focus_sweet_caroline: "스위이이트 캐롤라인"
 CSA_focus_sweet_caroline_desc: "빰, 빰, 빠암. 이 주의 상태가 이제 너무 좋아 보여서 남아 있는 공공 서비스와 행정 수단을 무엇이든 되살릴 수 있게 되었습니다. 그래도 질서가 유지되도록 하려면 어쨌든 새로운 것에 투자하고 싶어질 것입니다."
 CSA_focus_alabama_abyss: "앨라배마의 심연"
 CSA_focus_alabama_abyss_desc: "앨라배마 주는 미시시피 자체를 제외하면 민족 간 폭력에서 유일하게 견줄 만한 곳입니다. 이 주는 좋은 시절을 보낸 적도 있었으며, 이 주에 대한 실질적인 통제를 확보하려면 무언가를 되돌려 주어야 합니다. 우선 걸프 연안의 경제 활동을 조직하고 일종의 전력망을 구축하는 것부터 시작할 것입니다."
 CSA_focus_rose_of_alabamy: "앨라배미의 장미"
 CSA_focus_rose_of_alabamy_desc: "미시시피 계곡에서부터 우리는 이제 앨라배마를 새롭게 피어날 장미로 바꾸어 놓았습니다. 이를 바탕으로 우리의 아름다운 국가 안에서 주의 평화와 안정을 보장하기 위해 공공 서비스와 법 집행을 도입하고자 합니다."
 CSA_focus_florida_flounder: "플로리다의 광어"
 CSA_focus_florida_flounder_desc: "모래톱 같은 플로리다 주는 연방이 무너지기 전에도 그 자체로 엉망이었습니다. 거대한 관광 및 휴양지였던 이곳은 이제 예전 모습의 껍데기가 되었습니다. 우리는 이 사실을 활용해 경제와 도시 계획을 더 잘 세우고 미래에 대비해야 하며, 그래야 우리 나라의 안정을 확보한 뒤에 이 주가 다시 돌아갈 법한 과열된 명소가 되는 사태를 피할 수 있습니다."
 CSA_focus_the_sun_shines_once_more: "태양이 다시 빛나다"
 CSA_focus_the_sun_shines_once_more_desc: "경제 활동은 이제 정상 수준이며, 물과 전기 같은 일부 요소를 다시 도입할 수 있게 되었습니다. 이제 이 모래 해변의 주에 태양이 다시 빛나게 하고, 공공 서비스와 행정 업무를 조직하여 이 주를 남부의 가족으로 온전히 복귀시킬 때입니다."
 CSA_focus_raleigh_rumble: "롤리의 격돌"
 CSA_focus_raleigh_rumble_desc: "자매 주인 노스캐롤라이나에서 거래에 뛰어들 준비를 합시다. 물과 전기 인프라, 그리고 어떤 형태의 경제를 구축하면 이 주에 어느 정도의 평화를 되돌릴 수 있을 것입니다."
 CSA_focus_sisters_united_once_more: "자매의 재결합"
 CSA_focus_sisters_united_once_more_desc: "노스캐롤라이나의 상황이 안정되기 시작했으니, 이 주에 법과 질서를 되돌리고 길 잃은 자매가 남쪽의 자매 주와 재결합할 길을 닦을 수 있습니다. 또한 우리 남부 가족의 이 즐거운 재회에 합류하게 될 것입니다."
 CSA_focus_tennessee_tumble: "테네시의 추락"
 CSA_focus_tennessee_tumble_desc: "테네시 계곡은 위대하고 평화로운 주입니다. 남부 음악 문화의 고향이자, 북쪽의 양키와 중서부인 앞에 놓인 진정한 남부와 애팔래치아 중간지대의 경계입니다. 수로를 활용해 건설 노력을 재개하고, 주에 어느 정도의 안정을 되찾을 수단을 마련해야 합니다."
 CSA_focus_nashville_renewal: "내슈빌의 재생"
 CSA_focus_nashville_renewal_desc: "주에 서비스와 안정이 돌아오기 시작했으니, 결속력 있는 공공 서비스와 공화국 내에서 주를 제대로 관리할 수단을 재건하여 이를 굳건히 하고자 합니다."
 CSA_focus_arkansee_saw: "아칸시-소"
 CSA_focus_arkansee_saw_desc: "아칸소 주의 기이한 균형은 우리 행정부조차 어리둥절하게 만듭니다. 하지만 대폭동 당시 경제의 대부분은 리틀록과 페이엇빌 등에 집중되어 있었습니다. 그 외에는 이 주에서 솔직히 크게 바뀐 것이 없으므로, 이 지역에 제대로 된 질서를 회복할 때까지 이러한 중심지들을 재건하고 물과 식량이 필요한 이들을 돕기만 하면 됩니다."
 CSA_focus_fort_smith_fantasy: "포트스미스의 환상"
 CSA_focus_fort_smith_fantasy_desc: "주가 되살아나고 초기 투자가 결실을 맺기 시작하면서 행정과 사회 질서가 이 지역에 뿌리내릴 수 있게 되었습니다. 법 집행과 그 밖의 공공 서비스는 사회 안정으로 가는 길을 닦는 데 도움이 될 것입니다."
 CSA_focus_tulsa_troubles: "털사의 골칫거리"
 CSA_focus_tulsa_troubles_desc: "오클라호마 주는 농업 비중이 매우 높은 주로 산업 역량의 중심지는 작은 규모에 불과합니다. 더 이상의 발전을 확보할 생각을 하기 전에 먼저 복구하고, 재건하며, 다각화된 경제를 보장해야 합니다. 그래야 과거 연방정부가 우리에게 그랬던 것처럼 주 안에 분열을 만들지 않을 수 있습니다."
 CSA_focus_red_river_revival: "레드 리버의 부활"
 CSA_focus_red_river_revival_desc: "사회적 결속이 돌아오고 투자가 실질적인 결과를 내면서, 이제 오클라호마를 남부의 가족에 재편입시키기 시작할 수 있습니다. 가족이라기보다는 사촌에 가깝지만, 그래도 우리는 그들 모두를 똑같이 사랑합니다. 가족은 어디까지나 가족이기 때문입니다."
 CSA_focus_we_fought_all_the_way: "끝까지 싸웠다"
 CSA_focus_we_fought_all_the_way_desc: "우리는 회복의 길을 멀리 걸어왔고 마침내 해냈습니다. 남부의 가족이 다시 하나가 되었으며, 이제 경제와 정치 면에서 새로운 지평을 바라볼 수 있습니다."
 CSA_focus_the_political_circus: "정치 서커스"
 CSA_focus_the_political_circus_desc: "현대의 정치 상황은 그 자체로 하나의 서커스입니다. 그럼에도 우리는 극단주의자들을 억누르고, 안정과 진지한 정치 운동을 뒷받침하며, 우리가 후퇴가 아닌 전진을 하도록 보장해야 합니다. 그 자체로 힘겨운 싸움이 되겠지만, 더 나빠질 수는 없겠죠... 그렇지요?"
 CSA_focus_the_center_mass_of_politics: "정치의 중심 세력"
 CSA_focus_the_center_mass_of_politics_desc: "정치적 중도는 우리가 이해하는 정치 영역에서 가장 안정시키는 힘입니다. 이들 정당이 반드시 \\"적극적인 추진력\\"을 가진 것은 아니지만, 오버턴 창이라는 틀의 양극단이나 변두리보다는 우리 나라를 안정시키고 세계 무대를 위해 키워 나가기에 더 안전한 선택입니다. 어쨌든 우리에겐 여전히 선택권이 있으며, 그 선택을 서둘러 내려야 합니다."
 CSA_focus_the_overton_window_shatters: "오버턴 윈도우의 붕괴"
 CSA_focus_the_overton_window_shatters_desc: "정치적 로비와 공포 조장 등을 통해 그 결과 국가의 정치적 중도보다 더 극단적이고 주변부의 정당들에 대한 지지가 높아졌습니다. 우리의 유일한 희망은 이 새로운 물결이 우리에게 남은 얼마 안 되는 국가를 파괴하지 않는 것입니다."
 CSA_focus_ddp_secures_victory: "DDP의 승리"
 CSA_focus_ddp_secures_victory_desc: "놀라운 반전으로 DDP, 즉 딕시 델타당이 무명 신세를 실제 정치적 승리로 바꾸어 놓았습니다. 일각에서는 이를 산업화나 대중교통 같은 분야의 진전으로 칭송합니다. 그러나 다른 이들은 이 정당이 과두제적 수단을 위한 허울에 불과하다고 우려합니다. 어쨌든 그들이 승리했으며, 그들이 선이 될지 악이 될지는 시간만이 알려 줄 것입니다."
 CSA_focus_administrative_overhaul_plan: "행정부 검열 계획"
 CSA_focus_administrative_overhaul_plan_desc: "행정부의 처참한 상태는 만연한 부패, 예산 범위를 넘어선 뇌물, 그리고 좋게 봐줘도 제대로 작동하지 않는 관료제 등을 초래했습니다. 우리의 계획과 열망을 조만간 어디로든 진전시키려면 이 문제를 정면으로 해결해야 합니다."
 CSA_focus_comprehensive_healthcare_restructuring: "의료 구조조정 계획"
 CSA_focus_comprehensive_healthcare_restructuring_desc: "종합 보건 구조조정(CHR)은 처음부터 다시 시작하여, 국가 보건 체계 또는 대규모 보건 체계가 합리적인 행정 수준을 넘어 확장되기 시작할 때 생기는 문제를 선제적으로 해결하는 백지 계획입니다. 지역, 주, 지방 행정 구역에 걸쳐 구역을 재편하고 재원을 균형 있게 배분함으로써 권한을 분산하고, 사정을 더 잘 아는 현지 주체가 재원을 더 잘 관리하도록 합니다. 이를 통해 감독 대상 시설의 직접적이고 즉각적인 필요가, 이 행정 단계의 보다 현장 밀착적인 이해 덕분에 더 빠르게 충족될 수 있습니다. 아울러 이 네트워크로부터 독립된 감독 위원회가 주기적으로 부패 여부를 점검하고, 예산이 명시된 용도로 쓰이도록 하여 이처럼 방대한 네트워크에서 벌어질 수 있는 악명 높은 \\"사라진 중간 상인\\" 문제를 방지합니다."
 CSA_focus_welfare_is_healthcare_plan: "복지는 의료 캠페인 계획"
 CSA_focus_welfare_is_healthcare_plan_desc: "현대 복지 국가는 그 자체로 인구 중 연령상 양극단에 놓인 이들을 위한 보건 계획입니다. 생활 수준에 맞는 일자리를 구하지 못하는 이들을 위한 식량 배급권, 경제 성장에 평생을 바친 이들을 위한 사회 보장, 우리 나라와 그 존속에 새로운 생명을 더하고자 하는 가정을 돕기 위한 보육 및 지원 프로그램이 그것입니다. 따라서 중앙 정부가 행정에 쏟는 부담을 줄이기 위해 보건 구조조정 계획과 유사한 병행 계획을 만드는 편이 낫습니다. 유사한 감독 위원회를 두면 해당 프로그램과 관련된 규정과 확대를 세밀하게 조정하여, 제도를 가장 잘 악용하는 자가 아니라 정말 필요한 이들에게 혜택이 돌아가도록 할 수 있습니다."
 CSA_focus_economic_opportunities_commission: "경제 기회 위원회"
 CSA_focus_economic_opportunities_commission_desc: "경제 기회 위원회(EOC)는 주 정부와 협력하여 구인 중인 일자리가 취업 박람회와 공고를 통해 대중에게 알려지고 노출되도록 하는 전담 기구입니다. 누구에게나 가장 큰 문제는 일자리를 찾는 것입니다. 일자리를 얻는 것은 그리 어렵지 않으나, 찾는 것은 또 다른 문제입니다. 어떤 사람들은 자기 동네나 카운티에 어떤 자리가 있는지조차 모를 수 있습니다. EOC는 바로 그 지점에서 알려지지 않은 것을 알려진 것으로 바꾸어 줍니다."
 CSA_focus_revenue_revitalization_plan: "세수 활성화 계획"
 CSA_focus_revenue_revitalization_plan_desc: "세수 활성화 계획(RRP)은 우리 나라의 세입 흐름을 개편하고, 간소화하며, 개선과 미래를 고려하도록 장려하는 3단계 계획입니다. 첫 단계는 세법의 기본 사항을 정비하고 다시 작성하는 것입니다."
 CSA_focus_modern_monetary_education: "현대 화폐 교육"
 CSA_focus_modern_monetary_education_desc: "현대 화폐 교육(MME) 계획은 현대 경제에서 지출을 관리하고 제대로 이해하며 통화를 획득하는 수단을 이해하고 그 능력을 기르는 것을 필수로 포함하도록 교육 과정을 개편하는 것입니다. 이 화폐 중심 교육은 새로운 세대가 필요한 지식을 바탕으로 더 큰 국가 경제의 일원이 될 수 있도록 선제적으로 가르치고 준비시키는 데 도움이 됩니다."
 CSA_focus_railroad_mania: "철도 열풍"
 CSA_focus_railroad_mania_desc: "현대 세계는 수송량과 대량 화물을 필요로 합니다. 식량용 곡물, 콘크리트와 건축용 모래 등 그 목록은 끝이 없습니다. 우리의 잠재력과 더불어 우리 경제뿐 아니라 세계 경제에 우리의 흔적을 최대한 남기려면 포괄적인 철도망을 구축해야 합니다. 이는 사회적으로 국가를 연결할 뿐 아니라 경제적으로도 연결하여 국내 역량은 물론 해외 수출입의 결속도 보장하는 철도망입니다."
 CSA_focus_decentralization_initiative: "분권화 구상"
 CSA_focus_decentralization_initiative_desc: "중앙 정부는 직접 지출을 위한 재원만 확보하면 됩니다. 중앙 정부가 조직하고 만든 보건이나 사회 안전망 같은 것들이 그 예입니다. 그러나 이러한 하향식 사고에 대한 한 가지 접근법은 세금 징수를 주 단위로 분산하도록 허용하는 것입니다. 이는 주 공무원들이 지역 세금을 주민의 필요에 맞게 더 유연하게 조정할 수 있고, 우리가 중앙 정부의 지출과 프로그램 확대 방식을 더 잘 통제하며 그 미래를 계획할 수 있다는 뜻입니다."
 CSA_focus_strategic_power: "전략적 전력"
 CSA_focus_strategic_power_desc: "우리의 국가 전력망은 계획이 전통적인 전력망보다 더 빠르고 효율적으로 유연하게 실행되도록 해 줄 것입니다. 철도 사업과 더불어 발전소 건설을 병행하면 전력의 대량 수송과 효율적 생산이 가능해지며, 이 전력은 우리 나라와 곧 개발될 땅 전역에 공급될 수 있습니다."
 CSA_focus_investments_across_dixie: "딕시 전역에 대한 투자"
 CSA_focus_investments_across_dixie_desc: "광대하고 우수한 철도망을 갖추겠다는 생각을 조금이라도 하려면 이를 뒷받침할 경제가 있어야 합니다. 따라서 우리는 위대한 국가의 활력을 보장하기 위해 딕시 전역에 일련의 투자 계획으로 투자할 것입니다."
 CSA_focus_civilian_industrial_expansions: "민간 산업 확장"
 CSA_focus_civilian_industrial_expansions_desc: "민간 산업 확장(CIE)은 소비재 및 민간 부문의 제조업과 전반적인 산업 기반을 구축하기 위한 일련의 투자 계획입니다. 이를 통해 철도 계획을 뒷받침할 탄탄한 기반을 확보할 뿐 아니라 정직한 생활 수준을 만들어 내는 실질적인 경제 활동도 창출하기를 기대합니다."
 CSA_focus_tech_and_service_diversification: "기술 및 서비스 다각화"
 CSA_focus_tech_and_service_diversification_desc: "현대 세계에서 서비스와 기술 자체의 활발한 혁신은 우리가 이해해야 할 현실입니다. 따라서 더 넓은 세계 시장에서 존재감을 가지려면 이러한 산업을 육성하기 위한 일련의 투자 계획을 추진해야 합니다."
 CSA_focus_defense_and_export_scheme: "국방 및 수출 계획"
 CSA_focus_defense_and_export_scheme_desc: "국방 및 수출 계획(D&ES)은 무기 및 해군 산업과 관련된 일련의 민간 및 군사 프로젝트입니다. 이 전반적인 계획은 국내 체계를 구축할 뿐 아니라, 생산한 장비를 필요로 하는 이들에게 수출하여 약간의 추가 수입을 얻도록 하기 위한 것입니다. 요즘은 분쟁이 부족하지 않은 듯하니 말입니다."
 CSA_focus_mississippi_central_expansions: "미시시피 중앙 철도 확장"
 CSA_focus_mississippi_central_expansions_desc: "MCR은 우리 위대한 국가의 서부 절반을 연결하는 주요 철도 회사입니다. 이 훌륭한 철도는 새로운 사업이 필요하며, 따라서 우리는 철도 자체를 확장하기 위해 투자할 뿐 아니라 철도가 서비스할 사업체에도 투자할 것입니다."
 CSA_focus_southern_railway_expansions: "서던 철도 확장"
 CSA_focus_southern_railway_expansions_desc: "서던 철도는 실제로 남부를 위해 운행하며, 따라서 가능한 한 남부의 많은 지역에 서비스하도록 보장해야 합니다. 이에 철도 인프라와 지역 경제에 대한 확장 보조금을 지급하며, 이는 우리 국가 경제와 번창하는 철도망 전반에 이익으로 돌아올 것입니다."
 CSA_focus_department_for_transport_innovation: "교통 혁신부"
 CSA_focus_department_for_transport_innovation_desc: "교통 혁신부(DTI)는 교통과 관련된 모든 것을 다루는 전담 연구개발 부서입니다. 현대 경제에는 현대적인 교통수단이 필요하며, 따라서 우리는 경제뿐 아니라 국가 전체를 이해하고, 활용하며, 서로 연결해야 합니다. 혁신과 발전을 통해 세상은 정말로 좁아질 수 있기 때문입니다."
 CSA_focus_transportation_history_is_still_history: "교통의 역사도 역사다"
 CSA_focus_transportation_history_is_still_history_desc: "교통의 역사는 우리 종의 발전과 혁신 자체를 규정합니다. 아, 전쟁도 그렇긴 하지만 이야기가 샜군요. 어쨌든 역사를 가르칠 때 우리의 후세대가 교통이 우리 삶의 핵심 요소이며 그냥 잊어도 되는 단순한 것이 아님을 이해하도록 해야 합니다. 물론 일상적으로 쓰는 것일 수 있지만, 그 쓰임이 애초에 존재한다는 것은 우리가 처음부터 왜 그것을 필요로 했고 원했는지를 이해하는 일입니다."
 CSA_focus_a_true_balance_of_power: "진정한 전력의 균형"
 CSA_focus_a_true_balance_of_power_desc: "우리의 에너지 수요는 우리의 야망을 크게 앞지르고 있으며 신속한 조치를 보장해야 합니다. 따라서 국가 원자력 투자라는 대규모 균형 작업이 우리의 가장 대담한 꿈 이상으로 에너지 수요를 충족시킬 것입니다."
 CSA_focus_breaking_the_chains: "사슬을 끊다"
 CSA_focus_breaking_the_chains_desc: "우리 나라의 역사는 현재와 미래, 그리고 먼 과거를 막론하고 현대의 기준으로 볼 때 취약하고, 피로 얼룩졌으며, 부끄러운 것입니다. 그러나 우리의 연결 프로그램과 경제 투자, 그리고 전반적으로 진정한 남부 국가를 만들어 가는 우리의 방식을 통해 우리는 그 낡은 방식이 배움의 교훈에 불과함을 보여 주었습니다. 우리의 아름다운 남부 땅에 속한 모든 영혼은 남부의 영혼이며, 그렇게 대우받고 보살핌을 받으며 존중받을 것이기 때문입니다. 과거의 사슬을 끊고 하나의 남부 가족으로 단결한 미래를 향해 나아갑시다."
 CSA_focus_the_old_ways_coalition: "옛 방식 연합"
 CSA_focus_the_old_ways_coalition_desc: "옛 방식 연합(OWC)이 전반적인 승리를 거두었으며, 이제 국가의 미래를 건설하고 지키는 일은 연합의 3대 정당에 달렸습니다. SCP, WPD, PDP는 협력하여 정책을 수립하고, 우리의 젊은 국가가 직면할 경제 및 외교 정책 상황도 다루려 할 것입니다."
 CSA_focus_the_SCP_programs: "SCP 프로그램"
 CSA_focus_the_SCP_programs_desc: "남부 보수주의자들이 연합에서 주도권을 잡았습니다. 이들은 자신들의 프로그램을 시행하여 정치적 입지를 굳히고 사회주의 세력의 기세를 꺾으려 할 것입니다. WPD와 PDP는 어떤 지나친 행보든 억제하려 하겠지만, 대체로 정치적 안정이 최우선입니다."
 CSA_focus_servicing_defense_needs: "방위 수요 충족"
 CSA_focus_servicing_defense_needs_desc: "방위 산업 구상(DII)은 장차 우리에 대한 외국의 행위에 대비해 스스로를 준비해야 한다는 필요에서 나온 것입니다. 대단한 것은 아니지만 훈련과 보급 부족 같은 문제를 바로잡을 수 있을 것입니다. 이를 쓸 일이 없기를 바라지만, 적어도 여분의 무기로 수익을 올릴 수는 있습니다."
 CSA_focus_economic_deregulation: "경제 규제 완화"
 CSA_focus_economic_deregulation_desc: "옛 연방은 오락가락하는 입법으로 사업 환경을 서서히 조여 왔기 때문에 무너졌습니다. 따라서 우리는 사업 창업과 관련된 몇 가지 핵심 사안에 대한 규제를 완화하고, 지역 기업을 더 잘 장려하도록 세법 전반을 재편할 것입니다."
 CSA_focus_tried_and_true_power: "검증된 동력"
 CSA_focus_tried_and_true_power_desc: "석탄, 석유, 천연가스라는 화석 연료의 삼두체제는 오랫동안 에너지 수요를 충족하는 신뢰받는 방법이었습니다. 따라서 우리는 국가 전역의 교육, 연구, 자원, 인프라에 투자하여 국가 전체의 기본 수요를 충족하도록 할 것입니다."
 CSA_focus_industrialization_investment_initiatives: "산업화 투자 구상"
 CSA_focus_industrialization_investment_initiatives_desc: "III, 즉 남부 산업 사회 계획은 우리의 아름다운 국가 전체의 제조업과 전반적인 산업화를 장려하기 위한 일련의 입법 및 예산 투자입니다. 이를 통해 우리 경제를 다각화하고 더 균형 잡히도록 채울 수 있을 것입니다."
 CSA_focus_the_WPD_programs: "WPD 프로그램"
 CSA_focus_the_WPD_programs_desc: "휘그당이 연합의 주도권을 잡았으며 자신들의 흔적을 남기려 하고 있습니다. 물론 연합의 목표에서 크게 벗어나지 않으면서도, 그들은 더 고전적인 자유주의 이상에 유리한 쪽으로 국가를 이끌려 합니다. 당연히 SCP와 PDP는 균형을 유지하기 위해 반대 영향력을 행사하려 하겠지만, 그게 정치입니다."
 CSA_focus_its_the_economy_stupid: "문제는 경제야, 멍청아!"
 CSA_focus_its_the_economy_stupid_desc: "우리 모두 \\"문제는 경제야, 바보야!\\"라는 말을 거듭 들어왔는데, 분해해 보면 실제로 상당 부분이 그렇다는 것이 드러났습니다. 이를 알았으니 교육에 제대로 투자하고 불필요한 행정 절차를 간소화하여 시민들이 경제를 창출하고 참여할 수 있게 해야 합니다. 그래야 그들이 진정한 생계를 꾸리고 그 삶을 누릴 수 있습니다."
 CSA_focus_modern_economy_means_modern_jobs: "현대 경제가 현대 일을 만든다"
 CSA_focus_modern_economy_means_modern_jobs_desc: "새로운 경제에서 기술 및 폭넓게 \\"사무 부문\\"이라 불리는 분야는 우리 전체 경제의 혁신과 다양성 중 상당 부분이 나올 곳입니다. 따라서 우리는 규제와 교육 체계를 정교하게 조정하여 미래 세대가 이러한 새로운 직업을 준비하고 더 잘 접할 수 있도록 해야 합니다."
 CSA_focus_economic_health_is_healthcare: "경제 건강이 곧 보건이다"
 CSA_focus_economic_health_is_healthcare_desc: "경제의 건강과 안녕은 평범한 시민의 건강과 안녕도 직접 좌우합니다. 따라서 더 나은 보수의 일자리와 그 일자리를 얻을 수 있는 능력을 장려해야 하며, 기존 보건 및 복지 인프라에 소규모 보완책도 마련하여 시민들이 마땅히 받아야 할 돌봄을 받도록 해야 합니다."
 CSA_focus_the_power_rangers_of_energy_itself: "에너지 그 자체의 파워레인저"
 CSA_focus_the_power_rangers_of_energy_itself_desc: "파워레인저 프로그램은 사람들이 짐작하는 것만큼 멋지지는 않지만, 우리의 에너지 수요를 충족시킬 최선의 방안입니다. 다채로운 우리 국토를 조사하여 다양한 에너지 생산 방식에 투자하고 설치할 수 있으며, 네트워크를 더 간소화해 비효율도 줄일 수 있습니다. 원자력 사용을 달가워하지 않는 이들도 있겠지만, 우리가 처한 에너지 퍼즐을 완성하려면 원자력이 필요하다는 것은 분명합니다."
 CSA_focus_the_PDP_programs: "PDP 프로그램"
 CSA_focus_the_PDP_programs_desc: "진보민주당이 연합을 이끄는 데서 정상에 올랐습니다. 따라서 이들은 더 진보적인 세제 개혁을 추진하고, 기업이 실패하는 부분에서 시민을 돌볼 현대적 복지 국가를 장려하려 할 것입니다. 물론 SCP와 WPD 구성원들은 너무 왼쪽으로 치우치지 않도록 이러한 주도적 움직임에 맞서려 하겠지만, 어쨌든 첫걸음은 왼발부터 내딛고 있습니다."
 CSA_focus_social_education_programs: "사회 교육 프로그램"
 CSA_focus_social_education_programs_desc: "사회 교육 프로그램(SEP)은 나중에 더 많은 사람들이 이 분야에 합류하기를 바라며 보건 의료 관련 교육 프로그램에 전념하는 투자입니다. 이러한 인력이 지역에서 확대되면 더 나은 돌봄을 제공하고, 이 장기 투자를 통해 전체 예산의 증가는 최소화할 수 있을 것입니다."
 CSA_focus_true_progressive_taxation: "옳은 누진세"
 CSA_focus_true_progressive_taxation_desc: "세법을 진정한 누진 기준에 맞춰 개혁하는 것이 재정과 예산의 안정을 확보하는 길입니다. 이를 단순히 \\"돈을 더 벌면 세율이 높다\\"로 보는 대신, 비례 소득의 원칙에 따라 균형을 맞추고자 합니다. 그렇게 되면 누가 정당한 몫의 세금을 내고 있고 내지 않고 있는지를 둘러싼 주의를 흩뜨리는 논쟁도 더는 없을 것입니다."
 CSA_focus_department_of_transportative_infrastructure: "교통 인프라부"
 CSA_focus_department_of_transportative_infrastructure_desc: "교통 인프라부(DoTI)는 교통 중심 인프라의 개발, 투자, 기존 시설 유지를 관리하는 중앙 정부의 전담 부서입니다. 이를 통해 불운을 겪는 사람들에게 일자리를 줄 수 있으며, 현대 인프라 전반을 유지하는 데 적절한 기준을 장려할 수 있습니다."
 CSA_focus_biofuel_investments: "바이오 연료 투자"
 CSA_focus_biofuel_investments_desc: "우리 위대한 국가가 널리 알려진 막대한 농업 규모를 고려하면, 이 핵심 측면을 활용해 에너지 생산 방식을 다각화해야 합니다. 그 한 방법이 바이오 연료 공장에 투자하여 잉여 작물 폐기물과 내일의 연료원이 될 잠재 후보를 지역 에너지 수요 생산에 쓰는 것입니다. 이는 국가 전력망을 보완하는 데도 도움이 되겠지만, 작게 시작하는 편이 더 신뢰할 수 있는 데이터 풀을 제공합니다."
 CSA_focus_startup_grants_for_southern_industries: "남부 산업 창업 보조금"
 CSA_focus_startup_grants_for_southern_industries_desc: "우리는 국내 경제 성장을 장려해야 하며, 그 한 방법이 창업 기업을 위한 보조금 제도를 만드는 것입니다. 창업이 성공하도록 보장하기 위해, 창업 기업은 보조금이 적절한 방식으로 사용되었음을 증명하는 서류를 제출해야 합니다. 또한 보조금의 3분의 1은 신생 기업의 선의와 진정한 성장을 보장하기 위해 처음 5년 안에 상환해야 합니다."
 CSA_focus_promoting_organized_agriculture: "조직적 농업 장려"
 CSA_focus_promoting_organized_agriculture_desc: "세계가 대두, 면화, 그리고 곡물 같은 대량 상품을 필요로 하는 만큼, 농업의 영향이 큰 땅덩어리인 우리는 세계의 수요가 충족되도록 우리의 역할을 해야 합니다. 이를 위해 이러한 수요가 충족되도록 더 조직적인 농업 기업을 장려해야 합니다."
 CSA_focus_dixie_dynamics: "딕시 체계"
 CSA_focus_dixie_dynamics_desc: "딕시의 중심부는 무기 및 해군 제조업을 위한 훌륭한 중심 계획지이자, 우리 군을 역동적으로 훈련시키고 시험장을 마련할 장소입니다. 숲, 늪, 강은 우리의 방위 수요를 공급할 이러한 산업을 준비하고 방어하는 데 도움이 될 것입니다."
 CSA_focus_memphis_miami_project: "멤피스-마이애미 프로젝트"
 CSA_focus_memphis_miami_project_desc: "M&M 프로젝트는 플로리다 주와 테네시 주의 서비스 및 사무 부문에 대한 소규모 표적 투자입니다. 이는 지역 경제를 발전시키고 향후 투자에서 주 사이의 격차를 일부 좁히는 데 도움이 될 것입니다."
 CSA_focus_old_habit_die_new_hopes_are_born: "옛 습관이 사라지는 곳에 새로운 희망이 태어난다"
 CSA_focus_old_habit_die_new_hopes_are_born_desc: "우리는 한 나라로서 먼 길을 걸어왔으며, 가깝거나 먼 과거에도 불구하고 가족으로서 서로를 이해하고 아끼고 사랑하는 법을 배웠습니다. 가족끼리 이따금 다투기도 하지만 결국 가족은 가족이며, 누구도 우리에게서 그 이해를 앗아갈 수 없습니다."
 CSA_focus_new_ways_coalition_victory: "새로운 방식 연합"
 CSA_focus_new_ways_coalition_victory_desc: "더 온건한 정당들이 변두리보다 자신들의 지지층을 활용하려 하는 가운데, 우리는 옛 습관으로 되돌아가지 않도록 해야 합니다. 이에 새로운 방식 연합이 출범했습니다. FDP, SIP, SLP는 남부 국가 전체에 새로운 빛을 비추기 위한 방법으로 이 연합을 구성하기로 합의했습니다. 세 정당 모두 남부의 새로운 전진 방향에 동의하며, 협력하여 \\"새로운 남부\\"를 만드는 데 자신들의 흔적을 남기기로 했습니다."
 CSA_focus_FDP_programs: "FDP 프로그램"
 CSA_focus_FDP_programs_desc: "딕시 연방화당(FDP)이 연합 내에서 더 인기를 얻는 것으로 드러났습니다. 이를 바탕으로 FDP는 옛 연방정부 구조와, 그보다 더 오래된 이전 CSA의 연합 정부 구조 사이에서 진정한 타협을 이루고자 합니다. SIP와 SLP는 연합 내 균형을 확보하기 위해 움직이겠지만, FDP는 별로 걱정하지 않습니다. 더 불간섭적인 접근을 원하는 것은 SLP뿐이고, SIP는 어느 쪽이든 크게 개의치 않기 때문입니다."
 CSA_focus_industrialize_without_automation: "자동화 없는 산업화"
 CSA_focus_industrialize_without_automation_desc: "자동화 반대법은 본질적으로 산업화를 장려하고 고용 수요를 채우기 위한 완화된 임시 조치입니다. 우리는 시민들이 일자리를 얻을 수 있도록 하고, 생산된 제품이 외국의 착취자에게 호소하기보다 국내 수요에 맞춰지도록 보장해야 합니다."
 CSA_focus_primary_needs_need_primary_care: "기본 수요에는 기본 관리가 필요하다"
 CSA_focus_primary_needs_need_primary_care_desc: "1차 산업 관리법, 즉 PIC법은 1차 산업 또는 자원 중심 산업의 발전을 보장하기 위해 지역 산업을 육성하는 국가 투자 계획입니다. 이는 새로운 산업과 새로운 상품 및 서비스가 더 저렴한 비용으로 국가에 제공되도록 합니다."
 CSA_focus_revitalizing_the_interstate_system: "주간 고속도로 체계 재활성화"
 CSA_focus_revitalizing_the_interstate_system_desc: "주간 고속도로 체계에 남은 것은 좋게 말해도 다소 엉망입니다. 더욱이 어디로든 나아가려면 인프라 전반에 실제로 투자해야 합니다. 따라서 가장 큰 것, 즉 우리의 주들을 하나의 가족으로 연결하는 주요 도로망부터 시작해야 합니다."
 CSA_focus_electrical_grid_advancements: "전력망 발전"
 CSA_focus_electrical_grid_advancements_desc: "전력망 발전법은 국가 전력망을 전면 개편하기 위한 투자 패키지입니다. 새 변전소, 더 효율적인 송전선을 구축하고, 전반적으로 전력 수송과 저장에서 생기는 과도한 낭비를 현실적으로 가능한 한 최소한으로 유지하도록 보장합니다."
 CSA_focus_SIP_programs: "SIP 프로그램"
 CSA_focus_SIP_programs_desc: "남부 정체성당(SIP)이 연합에서 지도적 위치를 차지했습니다. 이들은 정치 지향적이라고 할 수는 없지만, 남부 문화에 대한 구체적인 정의가 확립되도록 하려 합니다. FDP와 SLP 등 다른 연합 구성원들은 이러한 직접적 정치 방향의 부재를 활용하여 미래의 결과를 좌우하려 하겠지만, 결국 SIP는 별로 신경 쓰지 않습니다."
 CSA_focus_confederate_history_innovations: "남부연합 역사 혁신"
 CSA_focus_confederate_history_innovations_desc: "CHI는 우리의 문화사 혹은 일반사를 가르치는 원칙에 관한 교육 개혁 패키지로, 남부 노예제가 초래한 잔혹한 현실을 강조합니다. 또한 이 제도를 더 생산적이고 관습적인 수단을 통해 서서히 폐지하는 현실적인 방안이 있었음에도 왜 그토록 치열하게 다투어졌는지도 다룹니다. 우리의 어두운 역사를 배우고 이해할 때 무엇을 분명히 피해야 하는지, 그리고 어디서 두각을 나타내고 빛날 수 있는지 알게 됩니다. 이와 관련하여 우리는 새로운 세대가 다양한 농업 학문 분야와 그 시대별 발전을 접하도록 전담 농업 과정에 투자하고, 같은 학문 분야에서 미래의 혁신이 장려되기를 희망합니다."
 CSA_focus_connecting_the_south: "남부의 연결"
 CSA_focus_connecting_the_south_desc: "1860년대의 남북 전쟁이든 경제를 다각화하기 위한 끊임없는 투쟁이든, 남부 전체의 비효율을 초래한 주된 원인 중 하나는 인프라입니다. 따라서 우리는 남부 정체성이 뚜렷한 주들의 핵심, 즉 남부의 \\"대의\\"의 시작점을 향후 투자의 발판으로 삼아 더 잘 투자해야 합니다. 이 경우 캐롤라이나 자매 주들과 조지아가 훌륭한 출발점입니다."
 CSA_focus_agricultural_developments: "농업 개발"
 CSA_focus_agricultural_developments_desc: "우리의 유산과 땅은 전반적으로 농업 개발에 가장 적합합니다. 기술 및 사무 부문 같은 것을 우선시할 수도 있지만, 이는 훨씬 더 많은 비용이 들고 현 상태가 이미 초래한 것보다 더 큰 재정 부담을 안길 것입니다. 따라서 농업 산업화의 전반적인 발전은 충격을 완화하고 당분간 상황을 조금이나마 낫게 만드는 데 도움이 될 것입니다."
 CSA_focus_confederate_cash_crops: "남부연합 환금 작물"
 CSA_focus_confederate_cash_crops_desc: "CCC는 번창하는 우리 남부 국가의 가장 중심 지역을 떠받치기 위한 심장부 개발 계획입니다. 미시시피와 앨라배마는 딕시 자체의 심장으로 여겨지므로, 우리는 국가의 심장 상태를 돌보고 개선해야 합니다."
 CSA_focus_SLP_programs: "SLP 프로그램"
 CSA_focus_SLP_programs_desc: "남부 자유당(SLP)이 연합에서 정상에 올랐으며, 더 자유지상주의적인 영향을 바탕으로 국민을 위한 진정한 정부를 만들고자 합니다. 최소국가주의 프로그램을 통해 그들이 바라는 바는, 국민이 자신의 필요를 이해하고 정부는 국민이 그러한 목표를 달성할 수단만 제공하면 되는 것입니다. SIP와 FDP는 당연히 연합을 단단히 유지하기 위해 일부 결정에 영향을 미치려 할 것이며, 다가올 선거를 위한 국민의 영향력도 고려할 것입니다."
 CSA_focus_new_wave_deregulations: "새로운 물결의 규제 완화"
 CSA_focus_new_wave_deregulations_desc: "이 새로운 정치의 물결과 함께 우리는 새로운 개발을 전반적으로 허용하는 적절한 규제 완화를 보장해야 합니다. 이를 통해 건축 허가에 대한 규제와 용도 지역 지정에 관한 불필요한 행정 절차를 완화하여, 일반 시민과 그들의 재산을 침해하지 않으면서도 절차를 간소화할 것입니다."
 CSA_focus_education_advancement_choice_program: "교육 발전 선택 프로그램"
 CSA_focus_education_advancement_choice_program_desc: "교육은 사치가 아니라 자신의 삶과 나아갈 방향을 위한 선택이어야 합니다. 이를 염두에 두고 우리는 미래 세대가 편하게 느끼는 일을 선택할 수 있도록 더 간소화하고 선택지를 제공해야 합니다. 천천히 대학에 진학하여 전문 분야나 창업의 발판으로 삼고 싶은지, 아니면 삶을 즐기고 이해하기 위한 기초 지식의 핵심만 갖추고 노동 시장에 진입해 거기서부터 꾸준하면서도 즐거운 경력을 쌓는 데 집중하고 싶은지 말입니다. 삶은 선택으로 가득하며, 우리는 미래 세대가 원하는 선택을 이해하고 내릴 수 있는 능력을 주어야 합니다."
 CSA_focus_selfcare_is_welfare: "자기 돌봄이 곧 복지다"
 CSA_focus_selfcare_is_welfare_desc: "국민은 자신의 필요가 무엇인지 알고 있으며, 그러한 필요를 찾아낼 자원과 능력이 필요하다는 것을 우리는 압니다. 따라서 우리는 연방 및 정부 주도 프로그램을 삭감할 것이며, 그렇게 절감된 모든 재원은 기업 절감과 국민을 위한 직접적인 감세로 환원될 수 있습니다."
 CSA_focus_the_modern_energy_economy: "현대 에너지 경제"
 CSA_focus_the_modern_energy_economy_desc: "세계는 인류 역사상 그 어느 때보다 에너지를 화석 연료에 더 의존하고 있습니다. 우리 종이 계속 늘어나는 한 이 의존은 더욱 커질 수밖에 없습니다. 따라서 우리는 새로운 매장지를 찾는 데 투자하고, 천연가스, 석탄, 석탄 전환, 탄소 포집, 바이오 연료 등을 통해 에너지 수요를 다각화함으로써 오늘날의 에너지 경제에서 현대적 역할을 맡아야 합니다. 그래야 진정으로 시대를 앞서 나가고 우리 경제와 국가 전체의 안정적인 미래를 보장할 수 있습니다."
 CSA_focus_expand_the_office_sectors: "사무 부문 확대"
 CSA_focus_expand_the_office_sectors_desc: "우리 경제는 다각화를 통해 지속되어야 하며, 따라서 경제의 사무 부문 개발과 관련한 투자를 이끌어 낼 방안을 모색해야 합니다. 이는 우리 지역이 흔히 갖는 일면적인 경제, 즉 농업에 대한 훌륭한 균형추가 될 것입니다."
 CSA_focus_expand_the_industrial_base: "산업 기반의 전반적 확대"
 CSA_focus_expand_the_industrial_base_desc: "우리의 제조업은 늘 제한적이었으나, 투자와 전반적인 개발을 통해 우리가 가진 국내 자원으로 이를 전반적으로 아우를 수 있을 것입니다. 결국 농업은 그 위에 쌓아 올릴 훌륭한 기반입니다."
 CSA_focus_down_by_the_docks: "부두에서"
 CSA_focus_down_by_the_docks_desc: "우리 아름다운 국가의 해안선은 국내외 경제 기여에서 첫발을 내딛기 위한 최선의 방법이 될 것입니다. 우리는 해안 지역 전역에 새 조선소와 해군 기반 산업을 개선, 확장하고 투자하여 꾸준한 기여와 무역 상품을 들이고 내보낼 다양한 선택지를 확보할 수 있습니다."
 CSA_focus_dixie_defense_contracts: "딕시 방위 계약"
 CSA_focus_dixie_defense_contracts_desc: "사냥철, 자기 방어, 국방 등 무엇이든 우리가 공급할 수 있습니다. 전반적인 방위 산업의 창설과 해당 산업을 위한 계약업체 구축은 우리 경제의 지속적인 다각화에 기여할 뿐 아니라, 국가 방위 전반에도 크게 기여할 수 있습니다. 이는 외세에 도전받지 않는, 진정으로 방어되는 남부 국가와 그 문화 및 영토를 위한 토대를 마련합니다."
 CSA_focus_old_reliable: "믿음직한 터줏대감"
 CSA_focus_old_reliable_desc: "우리 경제의 \\"믿음직한 터줏대감\\"인 농업 부문은 우리가 진정으로 벗어날 수 없는 것입니다. 땅은 이 산업에 너무나 적합해서 다른 용도로 쓰는 것이 더 비효율적입니다. 그러나 필요한 것은 균형이며, 우리의 이전 사업들을 통해 이제 한 바퀴를 돌아 제자리로 올 수 있습니다. 경제적 기적에 대한 이번 국가적 개편과 이 땅 국민들을 더 낫게 하려는 우리 연합의 노력으로, 우리는 마침내 과거에서 벗어나 국민을 위한 진정한 미래를 만들고자 합니다. 우리는 남부의 가족이며, 가족은 언제나 함께하기 때문입니다."
 CSA_focus_party_for_economic_prosperity_victory: "번영이 승리를 보장한다"
 CSA_focus_party_for_economic_prosperity_victory_desc: "많은 이들에게 작은 이변으로, 경제 번영당(PEP)이 최근 선거에서 승리했습니다. 이 승리와 함께 PEP가 일부가 믿었던 일종의 \\"거물들의 신사 클럽\\"이 되는 대신 실제로 나라를 이끌어야 한다는 현실이 눈앞에 닥쳤습니다. 야당이 무슨 말을 하든 PEP는 자신들의 분명한 주된 목표가 국가 경제를 되살리고 사회적 논쟁을 허용할 재정적, 경제적 상황을 만드는 것이라고 밝혔습니다. 많은 이들이 이 발언의 표현에 의문을 제기하지만, 대부분은 이를 성공하면 순이익이고 실패해도 우리가 방금 빠져나온 상황보다 나빠질 수는 없다고 봅니다... 그렇지요?"
 CSA_focus_paving_the_way_forward: "나아갈 길을 닦다"
 CSA_focus_paving_the_way_forward_desc: "우리의 개발 계획이 문자 그대로 어디로든 나아가려면, 도로망과 전반적인 교통 인프라가 늘어난 교통량을 감당할 수 있도록 보장해야 합니다."
 CSA_focus_establishing_the_labour_corps: "노동 군단 창설"
 CSA_focus_establishing_the_labour_corps_desc: "남부 노동 군단(SLC)은 실업자와 수감자가 인프라 사업에 투입되어 일하게 하는 조직입니다. 기존 인프라 사업의 유지 보수와 신규 건설, 그리고 향후 경제 개발 계획을 위한 부지 정리와 기초 공사 착수 등이 그 임무입니다. 전반적으로 이는 고용 증가에 도움이 되며, 국가의 법 집행에서 더 나은 예산 편성을 통해 SLC의 타당성을 확보할 수 있고, SLC는 다시 실업자가 참여하는 사업의 급여를 배분할 수 있습니다."
 CSA_focus_southern_agriculture_dominance: "남부 농업의 지배"
 CSA_focus_southern_agriculture_dominance_desc: "우리의 땅은 경작을 위한 것이며, 농업의 농장과 들판을 위한 것입니다. 이를 위해 우리는 오늘날 세계를 지배하는 이들을 능가하는 남부 농업의 압도적 지배력을 보장할 것입니다. 이를 이해한 만큼, 진정한 경쟁에서 앞서 나가려면 이 부문에 투자하고 발전시켜야 합니다."
 CSA_focus_heartland_development_scheme: "심장부 개발 계획"
 CSA_focus_heartland_development_scheme_desc: "우리의 첫 번째 핵심 개발 프로그램은 다름 아닌 우리 국가의 핵심입니다. 미시시피와 앨라배마는 옛 연방 내에서 가장 덜 개발된 주로 여겨져 왔습니다. 이제 그런 일은 없을 것이며, 남부 국가라는 몸의 심장인 이곳을 위대한 국가의 힘차게 뛰는 중심 허브로 만들 것입니다."
 CSA_focus_overhauling_taxation_practices: "조세 관행 개혁"
 CSA_focus_overhauling_taxation_practices_desc: "우리 땅에서 최대한을 끌어내려면 제대로 자금을 조달할 수 있어야 합니다. 따라서 조세 방식과 집행을 개혁하면 부패를 줄이고 전반적으로 더 많은 세입을 확보할 수 있을 것입니다."
 CSA_focus_atlantic_advancements: "애틀랜틱 어드밴스먼츠"
 CSA_focus_atlantic_advancements_desc: "애틀랜틱 어드밴스먼츠는 국가 동부에서 성장하는 산업 세력입니다. 우리의 경제 번영에 시동을 걸고자 한다면 이 기업의 사업 확장에 투자해야 합니다."
 CSA_focus_dixie_demolitions: "딕시 디몰리션스"
 CSA_focus_dixie_demolitions_desc: "딕시 디몰리션스는 딕시의 심장부에서 약진하고 있는 건설 및 광업 기업입니다. 최근 지질 조사에서 앨라배마 남부에서 어쩌면 텍사스까지 이르는 얇은 리튬 광맥이 발견되었습니다. 리튬은 많은 배터리 기술과 상당수의 기계 전반을 개발하는 데 핵심 광물입니다. 국내 이익을 지킬 수 있도록 이 작은 리튬 붐에 시동을 거는 것을 도와야 합니다."
 CSA_focus_cajun_computers: "케이준 컴퓨터스"
 CSA_focus_cajun_computers_desc: "케이준 컴퓨터스 사는 국가 서부 지역에서 성장하는 기술 기업으로, 상당한 진전을 이루고 있습니다. 이 기업이 확장하여 우리의 경제 역량을 높일 뿐 아니라 이들 서부 주에 일자리와 새로운 잠재력을 가져올 수 있도록 투자해야 합니다."
 CSA_focus_national_research_institute: "국립 연구소"
 CSA_focus_national_research_institute_desc: "만만찮은 경제 세력이 되려면 우리는 혁신하고 경제 개선을 위한 새로운 방법을 개발해야 합니다. 이에 국립 연구소를 설립하면 바로 그 목표를 위한 자원이 제공될 것입니다. 부수적으로 우리의 연구 노력에도 분명히 도움이 되겠지만, 우리는 산업, 건설 활동, 그 밖의 많은 분야에서 혁신하기를 기대합니다."
 CSA_focus_corps_of_engineers_expansion: "공병단 확장"
 CSA_focus_corps_of_engineers_expansion_desc: "우리 군의 공병단은 우리 군을 하나로 묶는 병참 및 방어 지표의 근간입니다. 어쨌든 군의 이 핵심 측면은 다듬어지고 확대되어야 합니다. 군을 위해서만이 아니라 평시에 실질적으로 활용할 수 있는 민간 부문을 편입시키기 위해서이기도 합니다."
 CSA_focus_growing_defense_capabilities: "방위 역량 확대"
 CSA_focus_growing_defense_capabilities_desc: "국가 방위는 어떤 상상을 해 보아도 최우선 과제입니다. 이에 우리는 국방에 기여할 산업을 창설할 것입니다. 표적 투자를 통해 이 새로운 무기 공장들로부터 부수적인 수익도 거둘 수 있습니다."
 CSA_focus_reforming_industrialization: "산업화 노력 개혁"
 CSA_focus_reforming_industrialization_desc: "우리의 산업 역량은 최대 생산량을 보장할 기계와 기반이 사실상 없다는 사실에 의해 제한됩니다. 따라서 기계류 구매를 모색하고 규제를 개혁하여 우리의 산업 노력 전반을 되살릴 수 있습니다."
 CSA_focus_naval_industrial_expansions: "해군 산업 확장"
 CSA_focus_naval_industrial_expansions_desc: "우리는 광대한 해안선을 가지고 있으며, 따라서 해군 산업 역량을 확대하고 키움으로써 이를 활용해야 합니다."
 CSA_focus_national_infrastructure_improvements: "국가 인프라 개선"
 CSA_focus_national_infrastructure_improvements_desc: "국가가 성장함에 따라 우리의 인프라가 자원 수송과 공급망 전반에 대한 날로 늘어나는 수요를 감당할 수 있도록 보장해야 합니다. 따라서 필요하다고 판단되는 대로 기존 도로망을 점검하고 확장하며 키워 나갈 것입니다."
 CSA_focus_growing_produce_plan: "농산물 증산 계획"
 CSA_focus_growing_produce_plan_desc: "그렇습니다. 우리는 이미 농산물을 재배하고 있으며, 아이러니하게도 이 기존 부문을 더 키울 수 있습니다. 그래서 농산물 증산 계획입니다. 더 많은 생산을 확보하고 남는 물량을 대외 관계를 위한 소프트 파워로 쓸 수 있는데 겨우 충분한 수준에 만족할 이유가 어디 있겠습니까."
 CSA_focus_connecting_the_sister_states: "자매 주 연결"
 CSA_focus_connecting_the_sister_states_desc: "캐롤라이나는 그 자체로 하나의 연합입니다. 그러나 이 연합은 그들에게 가용한 연결에 의해 제한되며, 이를 염두에 두고 우리는 그 유대를 더욱 강화할 것입니다. 포괄적인 철도 사업을 통해 캐롤라이나의 수송 능력을 확대하고, 대량 수송 상품이 자매 주들 사이에서 거의 자유롭게 흐르도록 할 수 있습니다."
 CSA_focus_the_mississippi_western_railroad: "미시시피 서부 철도"
 CSA_focus_the_mississippi_western_railroad_desc: "자매 주 단결 계획에 대한 서부의 균형추를 마련하고 단결을 이루기 위해 우리는 MWRR, 즉 미시시피 서부 철도를 만들고 있습니다. 이 철도는 정부와 민간이 함께 소유하는 형태이며, 제3의 중개자 격 파트너는 미시시피 센트럴입니다. 이들의 경험은 협력적이고 건전한 경쟁과 국가 철도망의 분권화를 이루는 데 도움이 될 것입니다."
 CSA_focus_southern_power: "서던 파워"
 CSA_focus_southern_power_desc: "서던 파워는 빠르게 성장하는 전력 회사로 그 영향력이 국가 상당 지역에 미칩니다. 우리는 이 회사의 주식을 매입하고, 사업 확장을 향한 투자로 주의를 돌리게 함으로써 은밀하게 이 회사를 국유화할 것입니다."
 CSA_focus_dont_look_back_look_forward: "뒤돌아보지 말고 앞만 보라"
 CSA_focus_dont_look_back_look_forward_desc: "문화와 역사적 영향으로서의 우리의 과거를 한탄하는 일을 그만둘 때입니다. 거의 한 세기 전의 부당한 행위를 불과 몇 시간 전의 일처럼 계속 대한다면 우리는 진정으로 어디로도 나아가지 못할 것입니다. 우리는 앞을 보아야 하며, 우리의 거대한 개발과 프로그램을 통해 모든 남부 시민이 안락한 생활이라는 목표를 달성하고 삶을 우리가 \\"그렇다고 믿는 것\\"이 아니라 있는 그대로 진정으로 즐길 수 있는 미래를 보장할 것입니다."
 CSA_focus_cwuf_victory: "남부연합 노동자 단결 전선의 승리"
 CSA_focus_cwuf_victory_desc: "충격적으로 보이는 반전으로, 남부연합 노동자당과 남부 전통당이라는 이색 연합이 선거에서 첫 승리를 거두었습니다. 많은 이들이 이 연합이 어떻게 작동하는지 궁금해하지만, 현실은 그럭저럭 작동합니다. 주된 결속 원리는 양쪽 모두가 지지하는 남부연합 정체성과 신조입니다. 그러나 한쪽이 정치적으로 다른 쪽보다 확연히 반대편에 가깝습니다. 이제 연합이 승리했으니 누가 가장 큰 영향력을 갖게 될지 지켜보는 것도 흥미로울 것입니다."
 CSA_focus_CWP_policy_plan: "CWP 정책 계획"
 CSA_focus_CWP_policy_plan_desc: "남부연합 노동자당이 여론조사에서 선두를 차지했고 그 결과 선거에서 승리했습니다. 이제 이들은 정책을 개시할 기반을 갖추었으며, 노동자를 위한 진정하고 공정한 사회로 가는 길을 열기 위한 정책이 시행될 것입니다."
 CSA_focus_industrialized_agriculture: "산업화된 농업"
 CSA_focus_industrialized_agriculture_desc: "우리 농업 부문이 그토록 많은 노동력을 필요로 하는 한, 노동자를 주역으로 삼으려는 우리의 노력은 현실이 될 수 없습니다. 따라서 우리 경제의 농업 부문을 개선하고, 기계화하며, 더 잘 조직해야 합니다."
 CSA_focus_the_real_economy: "실물 경제"
 CSA_focus_the_real_economy_desc: "산업, 제조업, 그리고 동네 가게들. 이것이 수십 년 전, 거의 한 세기 전에도 그랬듯 현대의 진정한 경제입니다. 우리는 이를 구축하고 지원하며 위대함을 추구할 견고한 토대로 확립해야 합니다."
 CSA_focus_a_honest_tax_system: "정직한 세금 제도"
 CSA_focus_a_honest_tax_system_desc: "솔직해집시다. 사회를 조직하고 지탱하려면 창출된 부는 사회 전체에 더 잘 쓰이도록 어느 정도 조직되고 징수되어야 합니다. 그러므로 새로운 세금 제도를 개혁하고 수립하는 데 정직하고 솔직해야 합니다. 단기적으로는 호감을 얻지 못하겠지만, 문제를 일으키는 관리자들을 도려내고 실제로 돈을 유용하게 쓴다면 국민은 나중에 우리를 사랑하게 될 것입니다."
 CSA_focus_a_needed_evil: "필요악"
 CSA_focus_a_needed_evil_desc: "우리 경제의 \\"기업\\" 부문은 서비스와 기술 전반을 포함합니다. 이 C로 시작하는 단어를 쓰는 것이 다소 꺼려지긴 하나, 외세에 대한 우위를 유지하기 위해서는 필요악이라는 점을 부정할 수 없습니다. 따라서 일부 노동법을 개혁하고 이 부문의 규모를 다소 줄여 핵심 산업처럼 좀 더 현실에 발붙이게 할 수 있습니다."
 CSA_focus_welfare_reforms: "복지 개혁"
 CSA_focus_welfare_reforms_desc: "우리 국가의 시민은 보살핌을 받아야 하며, 그럴 수 있는 유일한 방법은 우리의 사회 안전망을 개혁하고 다시 채워 넣는 것입니다. 행복한 노동자가 생산적인 노동자이며, 우리가 결속력 있는 사회를 보장하기 위해 노력하는 것은 바로 이 행복입니다."
 CSA_focus_STP_policy_plan: "STP 정책 계획"
 CSA_focus_STP_policy_plan_desc: "CWUF의 선거 승리와 함께 남부 전통당이 근소하게 앞섰으며, 이 거의 완전한 승리를 자신들의 정책을 밀어붙이는 발판으로 삼고자 합니다. 이들은 경제 및 문화 정책에 더 집중하고 있지만, 가능한 한 연합의 사회주의 쪽과 거리를 두려 할 것입니다."
 CSA_focus_energizing_the_lands: "땅에 활력을 불어넣다"
 CSA_focus_energizing_the_lands_desc: "광대한 숲과 불리한 지형은 에너지망을 위한 실질적인 인프라를 구축하기에 좋은 조건이 아닙니다. 따라서 더 분산된 발전 수요를 충족시킬 더 나은 방안을 개발해야 합니다. 거기서부터 이러한 \\"블록\\"들이 서로 연결되어 전국 전력망 형태에 기여할 수 있습니다."
 CSA_focus_the_promising_ventures_act: "유망 사업법"
 CSA_focus_the_promising_ventures_act_desc: "PVA는 국내 사업 환경을 발전시키고 장려하기 위한 공동 투자 및 개혁 패키지입니다. 세제 개혁과 노동자 행복을 증진하는 규제, 그리고 창업 소요 시간의 간소화를 통해 우리 연합 내 사회주의 세력과 자본주의 세력 사이에서 균형 잡히고 결속력 있는 경제를 만들 것입니다."
 CSA_focus_machining_imports: "공작 기계 수입"
 CSA_focus_machining_imports_desc: "수입을 위한 표적 공작 장비는 우리의 생산 역량을 개선하고 현대화할 수 있게 할 뿐 아니라, 이 수입품을 역설계하고 다른 방식으로 재제작하여 연구를 촉진하고 외국에 대한 장기 의존도를 피할 수 있게 합니다."
 CSA_focus_mississippi_technological_institute: "미시시피 기술 연구소"
 CSA_focus_mississippi_technological_institute_desc: "MTI는 MIT에 대한 은근한 언급으로, 혁신과 연구에 대한 남부의 해답입니다. 더 중심에 위치한 만큼 삶을 전반적으로 개선하는 데 도움이 될 여러 분야의 다양한 주제에 대한 연구개발에 자금이 투입될 것입니다. 건설 기술의 발전부터 자원 정제 및 채굴 방법에 이르기까지, MTI는 남부 혁신의 정점이 될 것입니다."
 CSA_focus_riverland_investments: "리버랜드 투자"
 CSA_focus_riverland_investments_desc: "리버랜드 투자 계획은 미시시피 강 유역 주들을 개발하기 위한 종합 경제 계획입니다. 루이지애나에서 테네시에 이르는 이 네 개 주는 지역 주민들에게 최선의 결과를 보장하기 위해 일반 경제 사업과 특화된 경제 사업을 함께 추진하여 개발될 것입니다."
 CSA_focus_raw_energy_methods: "원천 에너지 방식"
 CSA_focus_raw_energy_methods_desc: "석유에서 천연가스, 푸른 풀, 대량 생산된 숯에 이르기까지. 각 주의 인프라와 최적의 에너지 생산 수단에 포괄적으로 투자함으로써 우리의 필요와 미래의 사업을 충족시킬 원천 에너지 경제를 만들 수 있습니다."
 CSA_focus_domestic_petrochemicals: "국내 석유화학"
 CSA_focus_domestic_petrochemicals_desc: "오클라호마와 루이지애나 주의 석유와 석탄은 공급량이 제한적이긴 하나 일부를 더 직접적이고 다양한 석유화학 산업으로 전환할 수 있습니다. 이러한 산업을 육성하면 우리가 외국 수입에 의존해야 했을 수도 있는 다수의 화학 및 합성 제품을 확보할 수 있습니다. 많지는 않지만 충분하며, 그것이 중요합니다."
 CSA_focus_mid_atlantic_mining_co: "미드애틀랜틱 광업 회사"
 CSA_focus_mid_atlantic_mining_co_desc: "MAM Co.는 노스캐롤라이나에 기반을 둔 광업 회사로, 귀금속과 상업적으로도 잠재적으로 군사적으로도 도움이 될 수 있는 리튬 및 운모 기반 채굴 사업을 겨냥해 중앙 정부의 투자를 요청했습니다. 어쨌든 이러한 투자를 유지하려면 노스캐롤라이나의 방어에 투자해야 합니다."
 CSA_focus_jobs_a_plenty_act: "일자리 풍부법"
 CSA_focus_jobs_a_plenty_act_desc: "JaPA는 고용에 도움이 되고, 국민이 신속하고 효율적인 서비스를 받으며, 생활의 기본을 감당할 수 있는 일자리를 얻도록 보장하는 서비스 및 일반 목적 일자리를 창출할 것입니다."
 CSA_focus_southern_nucleus: "남부 핵심 에너지법"
 CSA_focus_southern_nucleus_desc: "우리 국가의 심장부는 국가 수요를 위한 에너지 생산 역량의 심장부이기도 해야 합니다. 이러한 에너지 수요를 생산하려면 틀림없이 가장 효율적인 전력 생산 수단이 필요하며, 그것은 제한적인 원자력 발전 투자입니다. 원자력 에너지에 대한 일종의 가벼운 공포 조장 때문에 이 결정에 항의하는 사람들도 있겠지만, 극심한 기상 현상에 대비해 인구 밀집 지역과 해안선에서 떨어진 곳에 발전소를 전략적으로 배치함으로써 더 목소리 높은 이들을 잠재울 수 있습니다."
 CSA_focus_southern_cultural_society: "남부 문화 협회"
 CSA_focus_southern_cultural_society_desc: "국립 남부 문화 협회는 모든 것에서 아주 조금씩 떼어 내어 우리 국가의 길고 매우 고난 가득한 역사를 기리는 연례 일주일 간의 기념 행사와 역사 추모로 되돌려 주려는 국가적이고 지역적인 노력입니다. 우리는 더 이상 원주민도, 유럽인도, 심지어 미국인도 아닙니다. 우리는 남부인이며, 하나의 큰 행복한 남부 가족의 일원입니다."
 CSA_focus_the_southern_dream: "남부의 꿈"
 CSA_focus_the_southern_dream_desc: "마침내 단결을 통해, 그리고 모든 시민을 위한 더 나은 미래를 발전시킴으로써 이제 우리는 진정으로 앞으로 나아갈 수 있습니다. 더 이상 우리의 과거가 우리를 규정하도록 두지 않을 것입니다. 오히려 그것이 우리의 일부일지라도 우리가 배움을 얻었을 뿐 아니라, 더 나은 것을 쌓고 더 밝은 미래로 향하는 여정을 바로잡으려 노력해 온 과거의 잘못에 불과함을 이해합니다. 우리가 함께 노력한다면 꿈은 현실이 될 수 있기 때문입니다."
 CSA_focus_fasp_victory: "자유 농본 사회 협약의 승리"
 CSA_focus_fasp_victory_desc: "변두리 세력들이 다음엔 무슨 생각을 할까요. 또다시 허를 찌르는 일로, 혁명 연합당과 농본 연합당이 손잡고 사실상 말 그대로 그 누구에게서도 승리를 빼앗아 갔습니다. 연합 안팎의 많은 이들이 이 연합이 어떻게 작동하는지 전혀 알지 못합니다. 그러나 각 정당 내부자들은 상대를 자신의 목적을 위한 수단으로 활용할 수 있다고 생각하는 듯합니다. 혁명 연합당(URP)은 국가를 사회주의 이상향으로 바꾸는 데 필요한 농업 전문성을 위해 농본 연합당(AUP)을 원합니다. AUP는 산업 노동자들 사이에서 URP가 누리는 인기를 위해 URP를 원합니다. 양측이 공통적으로 가진 한 가지는 농업이 미래라는 점이며, 이들은 \\"우리는 이 순간을 나중이 아니라 지금 붙잡아야 한다\\"고 말합니다."
 CSA_focus_URP_programs: "URP 프로그램"
 CSA_focus_URP_programs_desc: "자유 농본 사회의 승리와 함께 혁명 연합당이 연합 내에서 정상에 올랐습니다. 이 초기 승리를 발판으로 URP는 AUP가 주도권을 잡거나 특정 정책을 뒤집을 만큼 충분한 영향력을 얻기 전에 가능한 한 아나키스트적 사회주의에 가깝게 분권화를 이루어 내려 합니다. 어쨌든 농업 투자 확대와 전반적인 정부 지출 감소를 기대할 수 있습니다."
 CSA_focus_return_their_wealth_act: "부 반환법"
 CSA_focus_return_their_wealth_act_desc: "RTWA는 중앙 정부 지출에서 삭감할 수 있는 만큼을 통해 국민이 어렵게 번 돈을 되돌려 주는 부의 재분배 노력입니다. 아이러니하게도 이는 국민이 이제 자기 뜻대로 경제에 재투자할 돈을 더 많이 갖게 되므로 우리가 장차 세입을 얻게 해 줄 것입니다."
 CSA_focus_the_basics_of_life: "삶의 기본"
 CSA_focus_the_basics_of_life_desc: "식량, 물, 주거. 어떤 종이든 생존하는 데 필요한 삶의 기본입니다. 이와 최근의 예산 삭감을 바탕으로 우리는 국민이 농업 부문 확대에 투자하도록 장려할 수 있습니다. 우리 경제의 이 기둥은 국민을 먹이고, 낡은 질서의 욕망과 소비주의가 이끄는 파괴적이고 충족되지 않는 삶이 아니라 필요에 기반한 안락한 삶을 보장하는 데 도움이 될 것입니다."
 CSA_focus_the_anti_revenue_act: "반세입법"
 CSA_focus_the_anti_revenue_act_desc: "이 법의 목표는 그 이름이 의미하는 바와 말하자면 정반대를 하는 것입니다. 정부 지출을 삭감하고 이를 감세와 규제 개혁을 통해 되돌려줌으로써, 국민이 자신의 돈을 다시 국가에 투자하는 장기 재투자의 토대를 마련합니다. 물론 시간이 걸리겠지만 우리의 전체 세입은 실제로 증가할 것이며, 다만 단기적으로는 그렇지 않을 뿐입니다."
 CSA_focus_stagnation_industrialism_act: "산업주의 정체법"
 CSA_focus_stagnation_industrialism_act_desc: "국민의 필요에 맞는 안정적이고 진정한 경제를 만들려면 경제 구성이 그것을 만들어 내는 바로 그 사람들을 뒷받침하도록 해야 합니다. 따라서 우리는 산업화 전반을 정체시키고 점차 줄여 나가며 농업 부문의 우위를 보장할 것입니다."
 CSA_focus_local_care_act: "지역 돌봄법"
 CSA_focus_local_care_act_desc: "LCA는 국가 지출과 과도하게 중앙집권화된 기구에서 자원을 거두어, 그 지역민들이 필요로 하는 지역 돌봄 시설에 재투자할 수 있는 지방 정부와 개인에게 돌려주는 의료 및 복지 개혁 패키지입니다. 우리 국가의 국민과 공동체는 자신에게 무엇이 필요한지 알고 있으니, 그 필요가 충족되도록 수단을 갖게 합시다."
 CSA_focus_AUP_programs: "AUP 프로그램"
 CSA_focus_AUP_programs_desc: "승자에게는 전리품이 돌아갑니다. 그러나 이 승자들은 나눠야 하며, 나누는 것은 그들이 결코 좋아하지 않는 일입니다. 그 결과 연합의 승리를 이끈 농본 연합당은 가능한 한 다른 모든 영향력보다 자신들의 구상을 확보하려 신속히 움직였습니다. 진정한 농본 사회가 실현될 것이며 AUP는 그렇게 만들고자 할 것입니다."
 CSA_focus_agricultural_industrialism: "농업 산업주의"
 CSA_focus_agricultural_industrialism_desc: "농업은 본질적으로 여전히 산업입니다. 이것이 우리가 세울 기준이며, 우리의 미래가 배부른 배와 만족한 정신의 미래가 되도록 보장하기 위한 것입니다."
 CSA_focus_food_securities_act: "식량 안보법"
 CSA_focus_food_securities_act_desc: "FSA는 법 집행 기관에 더 많은 재정을 지원하고 새로운 식량 안보청을 신설하는 국내 안보 법안입니다. 이 신설 기관은 대량 식량 저장 시설과 주요 가공 시설을 보호하여 모든 식량 공급 사슬이 중단 없이 이어지도록 하는 임무를 맡습니다. 큰 부수 효과는 이들 기업이 내외부 세력으로부터 제품이 안전하도록 보장하는 데서 기업 수입을 징수하게 된다는 점입니다."
 CSA_focus_continued_agrarian_developments: "지속적인 농본 개발"
 CSA_focus_continued_agrarian_developments_desc: "CAD 계획은 세계 무대에서 우리에게 점점 커지는 수동적 영향력을 계속 부여해 줄 농업 기반 산업주의를 이어 가도록 설계되었습니다. 우리 국가는 국내 안정과 지역적 영향력을 확보할 핵심 고리가 될 것입니다."
 CSA_focus_self_investments_act: "자기 투자법"
 CSA_focus_self_investments_act_desc: "SIA는 개인보다 기업 및 법인에 과세하는 데 더 중점을 두는 세제 개혁 법안입니다. 안전장치로서 세금 집행을 둘러싼 법 집행 기관도 정기적으로 보고하여 허점을 악용하려는 시도가 없도록 합니다. 중앙 정부 의회는 이미 누군가 시도하기만을 기다리는 기업 임금 개혁 및 규제 법안을 갖고 있습니다."
 CSA_focus_farmlife_care_act: "농촌 생활 돌봄법"
 CSA_focus_farmlife_care_act_desc: "정부는 우리의 발전하는 경제에 맞춰 보건 의료 체계를 개혁하는 것이 적절하다고 판단했습니다. 농촌 생활이 가질 수 있는 육체적 부담과 그것이 가져올 수 있는 이점을 이해하는 것입니다. 이러한 균형과 영향을 이해하면 장차의 개혁을 준비하고 시민의 돌봄이 그들의 삶에 맞게 마련되도록 할 수 있습니다."
 CSA_focus_natural_energy_production_act: "천연 에너지 생산법"
 CSA_focus_natural_energy_production_act_desc: "NEP법은 바이오 연료 활용 전반을 확대하고 현대화하는 데 일부 재원과 자원을 투입하는 연구 패키지입니다. 많은 이들이 바이오 연료를 실질적 대안으로 보지 않지만, 농본주의가 우리 사회의 정점인 만큼 우리에게는 그러한 연구 구상에 투입할 진정한 자원이 있습니다. 초기 결과는 큰 의미가 없을 수 있으나, 이는 분명 진정한 녹색 미래를 위한 길을 닦습니다."
 CSA_focus_electric_highways_act: "전기 고속도로법"
 CSA_focus_electric_highways_act_desc: "중앙 정부는 전력망의 현대화와 간소화를 허용하는 재정 법안을 통과시켜, 국가의 전력 수요를 위한 일종의 고속도로 체계를 구축하도록 했습니다. 이는 전국에 전력을 적절히 분산하고 공급할 수 있게 하며, 필요한 경우 미래의 수요와 성장에 유연하게 대응할 수 있게 해 줄 것입니다."
 CSA_focus_moving_mississippis_initiative: "미시시피 이동 구상"
 CSA_focus_moving_mississippis_initiative_desc: "MMI는 위대한 미시시피 강이 지닌 천연 에너지를 우리가 얻고 사용하는 방식을 근본적으로 바꾸기 위한 정부 초대형 프로젝트입니다. 지역화된 인공 하천과 수력 발전 조치를 만들어, 장기적인 주요 계획은 에너지 생산을 늘리고 이 유출수를 주변 주들의 담수원을 보충하는 수단으로 활용하는 방안을 모색하는 것입니다. 물론 이는 장기 프로젝트가 되겠지만, 속도를 알맞게 조절하고 올바르게 계획한다면 결과를 확신할 수 있고 미시시피 강 자체에 서식하는 야생 생물에 대한 실질적 영향은 제한적이거나 거의 없을 것입니다."
 CSA_focus_solidifying_domestic_manufacturing: "국내 제조업 공고화"
 CSA_focus_solidifying_domestic_manufacturing_desc: "순수한 농본 경제에 대한 우리의 희망과 꿈에도 불구하고, 다양한 경제가 안전한 경제라는 현실을 무시할 수는 없습니다. 그래서 우리는 그 안전망을 확보하기에 딱 충분할 만큼만 할 것입니다."
 CSA_focus_limited_office_sector_investments: "제한적 사무 부문 투자"
 CSA_focus_limited_office_sector_investments_desc: "다각화 계획에 충실하게, 우리는 경제가 모든 방향으로 번성하도록 사무 부문과 관련한 제한적 투자를 시작할 것입니다. 하지만 우리가 어디서 왔는지를 결코 잊지 마십시오... 우리가 일구는 농장과 집을."
 CSA_focus_a_past_not_so_easily_forgotten: "쉽게 잊히지 않는 과거"
 CSA_focus_a_past_not_so_easily_forgotten_desc: "우리의 최선의 노력에도 불구하고 많은 이들이 여전히 우리 국가의 존재와 그에 얽힌 매우 어두운 역사를 경계합니다. 앞으로 나아가기 위해 좋은 진전을 이루었지만, 상처는 남아 있고 제대로 아물기를 원치 않는 듯합니다. 우리가 계속 치유되어 언젠가는 흠 없는 미래를 누릴 수 있기를 바랍시다."
 CSA_focus_dpl_victory: "딕시 순혈 동맹의 승리"
 CSA_focus_dpl_victory_desc: "급격한 반전으로, 옛 습관은 많은 이들이 바랐던 만큼 사라지지 않은 듯합니다. 딕시 퍼스트당과 남부 동맹의 연합이 거대한 이변을 일으켰으며, 이들의 승리와 함께 불안한 앞길이 열렸습니다. 역사에 대한 과거의 공포가 남부 시민들의 마음속에 더욱 또렷이 자리하는 가운데, 이들이 정확히 무엇을 할지 많은 이들이 궁금해합니다."
 CSA_focus_DFP_programs: "딕시 퍼스트 프로그램"
 CSA_focus_DFP_programs_desc: "딕시 퍼스트당이 순혈 동맹 내에서 주된 지도적 역할을 맡아 정상에 올랐습니다. 주요 프로그램은 \\"백인\\" 동맹의 상대와 유사하지만, 특정 국내 정책이 얼마나 공격적이어야 하는가를 두고 약간의 균열이 보인다고 많은 이들이 생각합니다. 이는 당연히 일부 \\"백인\\" 동맹 구성원들의 반발을 불러오겠지만, 어쨌든 연합은 안정적으로 유지될 것입니다."
 CSA_focus_voluntary_emigration_programs: "자발적 이주 프로그램"
 CSA_focus_voluntary_emigration_programs_desc: "VEP는 사회에 더 획일적으로 동화되기를 원하지 않는 이들에게 스스로 더 나은 삶을 찾을 기회를 선택지로 주기 위한 정부 구상입니다. 물론 많은 이들이 \\"이곳은 우리 땅이기도 하다, 우리는 여러 세대에 걸쳐 여기서 살았다, 어쩌고저쩌고\\"라고 주장할 것입니다. 그러나 사실은 올바른 유인책과 아마도 약간의 압력이 있다면, 방임이라 할 만큼은 아니지만 더 완고한 이들이 좀 더 배려하게 만들기에는 충분한 정도로, 현대 다문화주의의 오점과 그 본질적으로 불안정한 행태에서 우리 국가를 해방시키기 시작할 수 있다는 것입니다."
 CSA_focus_electrical_prioritization_programs: "전력 우선순위 프로그램"
 CSA_focus_electrical_prioritization_programs_desc: "특히 우리 국가 상태에서 일종의 소프트 파워를 행사하는 방법으로, 우선순위 지점을 정하고 순환 시간제 정전을 실시할 수 있습니다. 시선을 피하기 위해 모두가 참여해야 하겠지만, 끝까지 버티는 이들에게는 우리가 상당한 특혜를 줄 것입니다."
 CSA_focus_robust_economics: "강건한 경제"
 CSA_focus_robust_economics_desc: "고통을 일으키는 다양성을 처리하는 동안, 우리는 성장을 가능케 하는 다양성을 연이어 늘릴 수 있습니다. 포괄적이고 다양한 경제 투자가 이어지면 우리 국가의 땅에 새로운 빛, 새로운 일자리, 새로운 번영이 찾아올 것입니다."
 CSA_focus_energy_research_priority: "에너지 연구 우선"
 CSA_focus_energy_research_priority_desc: "ERP 구상은 에너지 생산 및 사용 혁신에 대한 충격과 경외형 투자입니다. 식량과 주거를 제외하고 모든 현대 경제의 가장 큰 필요는 에너지 그 자체입니다. 따라서 우리는 어떤 식으로든 혁신을 강제할 수 있는 방법을 단단히 붙잡고 밀어붙일 것이며, 그렇게 해서 이를 국가에 공개하고 우리 국가 에너지 수요가 충족될 것이며 이미 충족되었다는 만족을 손쉽게 확산시킬 수 있습니다."
 CSA_focus_domestic_taxation_reforms: "국내 조세 개혁"
 CSA_focus_domestic_taxation_reforms_desc: "국민의 필요가 우선입니다. 이 필요는 사람들이 우리 국가 밖에서 조달하려는 자금의 양을 제한하는 개혁을 우리가 추진한다는 사실에 기초합니다."
 CSA_focus_LotS_programs: "남부 동맹 의제"
 CSA_focus_LotS_programs_desc: "순혈 동맹이 승리했으며 이와 함께 두려운 현실이 도래했습니다. 남부 동맹이 연합의 승리에서 주도적 역할을 맡았고 그 결과 이미 자신들의 지지 기반을 확보하고 국가와 그 국민 자체를 공격적으로 통합하고 획일화하는 프로그램을 시행하기 위해 신속히 움직이고 있습니다. DFP의 상대편은 동맹의 정책이 DFP가 제안하는 것보다 훨씬 더 공격적이고 불안정을 초래할 가능성이 높아 보이므로 항의하기 시작했습니다. 어쨌든 열매가 나무에서 얼마나 멀리 떨어질지는 시간만이 말해 줄 것입니다."
 CSA_focus_organized_deportations: "조직적 추방"
 CSA_focus_organized_deportations_desc: "우리 사회에 기여하는 시민들이 이용할 수 있는 현행 사회, 교육, 보건 프로그램을 악용하는 사람들이 많습니다. 따라서 우리는 사회에 아무것도 기여하지 않는 이들을 위한 추방 및 재정착 프로그램을 조직하기 시작할 것이며, 그들의 상실은 애초에 상실이 아니기 때문입니다."
 CSA_focus_the_basic_needs_program: "기본 수요 프로그램"
 CSA_focus_the_basic_needs_program_desc: "BNP는 위험도가 낮은 범죄자 및 우리 사회에서 \\"쓸모없다\\"고 여겨질 수 있는 이들을 교화하는 방법으로서의 일련의 고용 프로그램입니다. 큰 기대를 하지는 않지만, 이는 당분간 노골적인 공격적 행위와 그로 인한 반응을 막는 임시방편이 될 것입니다."
 CSA_focus_a_hard_border_is_a_real_border: "견고한 국경이 진짜 국경이다"
 CSA_focus_a_hard_border_is_a_real_border_desc: "병든 샘 아저씨, 혹은 적어도 수도 지역에 남은 연방주의자 잔당이 자신들의 야망을 두고 건방지게 굴고 있습니다. 그들이 정확히 무엇을 계획하는지는 알 수 없으나, 우리가 다시는 그들의 폭정에 희생되지 않을 것이라는 것만은 분명합니다. 따라서 아름다운 남부 국가의 평화와 방어를 보장하기 위해 양국 사이에 진정하고 견고한 국경을 건설할 것입니다."
 CSA_focus_fueling_the_nation: "국가에 연료를 공급하다"
 CSA_focus_fueling_the_nation_desc: "국민의 필요와 경제의 수요가 충족되도록 국가 자체에 동력을 공급해야 합니다."
 CSA_focus_mining_expansions: "광업 확장"
 CSA_focus_mining_expansions_desc: "우리 남부 국가의 땅은 사실상 하나의 외길 경제에만 쓰여 왔습니다. 그것은 농업과 우리 국가를 먹여 살리고 존속시키는 그 하위 부문들입니다. 그러나 광범위한 지질 조사와 국내 수요 및 잉여에 더 집중함으로써 우리는 원자재 자급자족의 토대를 확장하고 만들어 낼 수 있습니다. 많지는 않지만, 심장부와 루이지애나에서 발견된 새로운 리튬 매장지는 향후 발견과 사업에 대한 많은 이들의 기대를 모으고 있습니다."
 CSA_focus_military_productions_act: "군수 생산법"
 CSA_focus_military_productions_act_desc: "국가의 방위는 우리 사회와 생활 방식의 안전과 안보를 보장하는 데 가장 중요합니다. 이에 따라 우리는 군수 생산 역량의 확대를 위한 개혁과 투자를 시작할 것입니다."
 CSA_focus_heartland_training_complex: "심장부 훈련 단지"
 CSA_focus_heartland_training_complex_desc: "최고의 훈련 효율을 보장하기 위해 우리는 군에 들어오는 신병을 다양하고 엄격하게 훈련시킬 수 있는 단지를 만들어야 합니다. 육군은 육상의 모든 적으로부터의 핵심 방위이므로, 서로 연결된 기지와 훈련 시설의 광범위한 네트워크를 구축하면 신병들이 자신의 가정과 가족을 지키도록 더 빠르게 훈련시키고, 다듬고, 단련할 수 있을 것입니다."
 CSA_focus_coastal_contingencies: "해안 비상 대책"
 CSA_focus_coastal_contingencies_desc: "우리 땅 자체의 보존은 정면으로 대응해야 하며, 이에 전국적인 상당한 해안 투자와 군사화가 필요합니다. 해군 및 해운 산업의 확대에 투자함으로써, 시간이 지날수록 커져 갈 기준을 세울 수 있습니다."
 CSA_focus_food_procurement_and_surplus_initiative: "식량 조달 및 잉여 구상"
 CSA_focus_food_procurement_and_surplus_initiative_desc: "FP&SI는 식료품 저장과 기본 확충을 발전시키기 위한 종합 투자 계획입니다. 매장에서의 가격 인하와 일반 서민의 부담 경감은 우리의 호소력과 국민 전체의 건강을 높일 것입니다. 또한 이러한 식량 안보가 전반적인 고용 추세를 높이고 평균 실질 실업률을 낮추도록 장려하기를 기대합니다."
 CSA_focus_national_preservation_act: "국가 보존법"
 CSA_focus_national_preservation_act_desc: "국가와 그 기능의 보존은 중앙 정부 자체인 최상층에서 시작됩니다. 이 명백한 사실을 염두에 두고 정부 의회는 부패를 근절할 독립 감사 기구를 만드는 법안을 통과시켰습니다. 좋은 부수 효과는 세금을 걷는 사람과 내는 사람 모두가 제도와 그 결과를 더 신뢰하게 되면서 전반적인 투명성이 높아지고 실시간 세입이 늘어난다는 것입니다."
 CSA_focus_targeted_energy_diplomacy: "표적 에너지 외교"
 CSA_focus_targeted_energy_diplomacy_desc: "연구 투자와 유사한 관점이나 입지를 가진 국가들과의 무역 협정 확보는 지정학적 영향력을 높이게 해 줄 것입니다. 대단하지 않을 수도 있지만, 이는 우리 국가를 개선하고 더 공격적인 부류로부터 입지를 지키기 위한 첫걸음에 불과합니다."
 CSA_focus_ignoring_the_past: "외면하고 나아가라"
 CSA_focus_ignoring_the_past_desc: "오래전에 죽고 지나간 일을 바꿀 수는 없으며, 굳이 신경 쓸 이유도 없습니다. 이제 우리는 스스로와 사회를 지키고, 대비하며, 우리가 원하는 미래를 만들어 갈 수 있습니다. 앞으로 나아가지 못하고 뒤처지는 자들은 저주받을 것입니다."
 CSA_focus_smrs_victory: "남부 현대 왕립 협회의 승리"
 CSA_focus_smrs_victory_desc: "안도의 한숨과 함께 남부 현대 왕립 협회가 선거에서 승리를 거두었습니다. 현역 및 전직 군 복무자들과 '메리디안 가문'으로도 알려진 남부 현대 군주주의 운동이 결합한 이 협회는, 야권의 가혹한 현실에도 불구하고 많은 이들이 훨씬 온건하기를 바라는 승리를 거두었습니다. 그저 바랄 수밖에 없습니다."
 CSA_focus_military_victory: "군의 승리"
 CSA_focus_military_victory_desc: "남부 왕립 협회가 선거에서 승리한 여파로 군 정치 조직이 연립 내에서 주도권을 잡았습니다. 많은 이들은 국가의 안녕을 지키고 보장하는 것을 본분으로 하는 군이 통일성과 자긍심, 그리고 안정감의 기준을 세워 주기를 바랍니다. 군국주의가 악용될 수 있다고 우려하는 이들도 있지만, 놀랍게도 대부분은 느긋한 태도를 보입니다. 어쨌든 메리디안 가문을 통한 동맹 세력은 정책 결정에 균형을 가져오기 위해 최선을 다할 것입니다."
 CSA_focus_arms_economics: "무기 경제"
 CSA_focus_arms_economics_desc: "무기 산업과 국방 산업 전반이 경제에 기여할 수 있다는 사실을 깨닫지 못하는 이들이 많습니다. 국내 사냥용 소화기 및 유사 장비의 판매와 해외 거래를 통해, 우리는 경제의 군사화가 여전히 제대로 작동하는 경제일 수 있다는 선례를 세울 것입니다."
 CSA_focus_expanding_naval_industries: "해군 산업 확장"
 CSA_focus_expanding_naval_industries_desc: "해군 산업 기반의 범용성 덕분에 우리는 유연한 방식으로 경제 군사화를 계속할 수 있습니다. 대부분은 민간 업무에 투입되어 있지만, 조선 또는 해군 기반 산업화의 일반적인 특성상 이를 군수 생산으로 전환하는 것은 어렵지 않을 것입니다."
 CSA_focus_corruption_affairs_administration: "부패 사안 행정국"
 CSA_focus_corruption_affairs_administration_desc: "부패는 어떤 정상적인 사회에서도 골칫거리입니다. 군 자체도 시민 사회 안의 하나의 작은 사회이며, 이러한 인식에 따라 민간과 군의 기구에서 독립하여 부패와 내부 문제를 감사하고 법적으로 처리할 독립 부서가 신설될 것입니다. 결국 권력은 부패하기 마련이니, 권력을 필요로 하지 않는 이들이 모두의 이익을 위해 그것을 쓰도록 하는 편이 낫지 않겠습니까."
 CSA_focus_central_southern_research_institute: "중남부 연구소"
 CSA_focus_central_southern_research_institute_desc: "CSRI는 민간과 군이 공동으로 운영하는 연구개발 복합 단지로, 군과 민간의 혁신을 조율하고 그 혁신들이 어떻게 서로 상승 효과를 낼 수 있는지 모색할 것입니다. 역사가 보여주듯 군사적 혁신은 민간의 혁신을 촉발하며, 일종의 훌륭한 선순환 고리를 만들어 냅니다."
 CSA_focus_dixie_power_llc: "딕시 전력 유한회사"
 CSA_focus_dixie_power_llc_desc: "국가 단위의 전력 회사를 설립하면 나머지 지역에 비해 가장 낙후된 지역 사회를 겨냥해 지원할 수 있습니다. 민간 및 지역 사업자들은 이전처럼 운영되겠지만, 국영 회사는 보완 및 균형 세력으로서 장기적인 경쟁 구도를 유지할 것입니다. 뿐만 아니라 일부 기업이 단기적으로 순손실로만 여기는 곳에 직접 투자해 새 발전소를 건설하고 송전망을 확장할 수 있게 됩니다."
 CSA_focus_meridian_royal_victory: "메리디안 왕립 협회의 승리"
 CSA_focus_meridian_royal_victory_desc: "'메리디안 가문'으로 알려진 현대 왕립 협회는 오랜 전통과 새로운 이상을 결합하여 앞으로 나아갈 새로운 길을 만들고자 합니다. 선출 군주제 원칙과 관련된 개혁을 통해, 가문은 군주와 왕족을 다른 모든 체제와 기술적으로 구별 짓는 단 하나의 요소를 바꾸려 합니다. 즉 직위의 칭호를 혈통을 가진 자만이 보유해야 한다는 필요성을 없애는 것입니다. 대신 직위의 칭호는 그 직위에 선출된 사람에게 그대로 붙게 됩니다. 이제 딸에게 공주라고 말해 주는 것은 하찮은 거짓말이 아닙니다. 언젠가 정말로 공주가 될 수도 있으니까요."
 CSA_focus_titles_renewal_act: "칭호 갱신법"
 CSA_focus_titles_renewal_act_desc: "이 법안은 포괄적인 개혁 패키지입니다. 공직 보유자와 관련된 정부 직책에는 적절한 칭호가 부여됩니다. 예를 들어 대통령직은 이제 '남부의 왕'으로 바뀝니다. 이와 함께 직위 보유자의 명명 규칙도 도입됩니다. 간단히 말해 이름을 기준으로 합니다. 현재 선출된 왕을 시작으로, 왕의 이름이 존이라면 남부 왕국의 존 1세가 됩니다. 이후 또 다른 존이 선출되면 그는 남부 왕국의 존 2세가 됩니다. 전직 칭호 보유자는 연회비를 내고 한때 보유했던 칭호를 합법적으로 갱신할 수 있으며, 이 회비는 국가 경제 재건을 돕는 기금으로 사용됩니다."
 CSA_focus_royal_energies_act: "왕립 에너지법"
 CSA_focus_royal_energies_act_desc: "REA는 전국에 더 많은 에너지 생산 시설을 건설하고 해당 시설의 비축량과 효율을 높이고자 하는 포괄적인 에너지 개발 지출 패키지입니다."
 CSA_focus_imperial_minerals_security_act: "제국 광물 안보법"
 CSA_focus_imperial_minerals_security_act_desc: "우리의 광대한 국가에는 아직 개발되지 않은 막대한 부가 있습니다. 세계 시장에서 입지를 굳히려면 먼저 국내 시장을 확보해야 합니다. 따라서 국내 자원을 늘려 줄 새로운 광산의 개선, 탐사 및 개발에 대규모 자금을 투입하면, 우리가 상상도 못 했던 존재감을 드러낼 수 있을 것입니다."
 CSA_focus_making_an_economy: "경제 만들기"
 CSA_focus_making_an_economy_desc: "가까운 시일 내에 어디로든 나아가려면, 우리가 가야 할 곳으로 이끌어 줄 경제부터 실제로 갖추어야 합니다. 따라서 국가 경제 계획을 수행하여 국가 전체를 제대로 다각화하고 투자함으로써 국가 경제를 증진하고 지역 경제의 특화 분야를 강화할 것입니다."
 CSA_focus_royal_nation_proclaimed: "왕국 선포"
 CSA_focus_royal_nation_proclaimed_desc: "우리의 개혁과 새로 찾은 국가의 희망을 누리는 국민과 함께, 이제 앞으로 나아갈 새로운 길을 만들 때입니다. 남부의 정체성을 현실로 만들고, 일부가 여전히 우리에게 씌우려 하는 상처와 고통이 아니라 통합과 사회적 유동성의 국가로서 역사에 이름을 남길 때입니다."
 CSA_focus_automation_integration_programs: "자동화 통합 프로그램"
 CSA_focus_automation_integration_programs_desc: "변화에 대한 두려움은 인류 역사 내내 이어져 온 것입니다. 자신과 가족을 부양할 일자리와 생계를 잃는다는 두려움보다 분명한 것은 없습니다. 그러나 혁신에는 변화가 따르며, 변화에는 적응해야 합니다. 따라서 자동화나 일부 사람들의 일자리를 불필요하게 만들 수 있는 기술을 도입하려는 기업의 직원은 자동화 재교육 수당을 신청할 수 있으며, 정부는 기업이 해당 인원을 재교육하는 데 필요한 기간 동안 급여 보조금을 지급합니다. 이렇게 하면 개인은 일자리를 유지하고 새로운 기술을 배우며, 기업도 진정한 손실을 입지 않습니다."
 CSA_focus_tax_code_reforms: "일반 세법 개혁"
 CSA_focus_tax_code_reforms_desc: "집행이 어렵고 혼란스러우며 비대해진 낡은 세법은 시급히 정비되어야 합니다. 따라서 중앙 정부는 법 전체를 다시 쓰기로 하고, 여러 차례의 입법 회기를 거쳐 조항별로 개별 검토할 것입니다. 이 새 세법은 집행과 이해가 더 쉽고 단순 명료하여, 허점을 찾으려는 본능적 충동을 억제할 뿐 아니라 이전 세법에서 흔했던 허점을 선제적으로 막기를 기대합니다."
 CSA_focus_military_expansions: "군 확장"
 CSA_focus_military_expansions_desc: "우리 군은 현대적 군대에 대응하기는커녕 방어조차 하기 어려울 만큼 장비가 형편없이 부족합니다. 따라서 남부의 전통에 걸맞은 군대를 만들고 조국을 실제로 방어할 수 있는 실효성 있는 전력을 갖추려면 전반적인 군 확장 사업에 투자해야 합니다."
 CSA_focus_logistics_improvements: "물류 개선"
 CSA_focus_logistics_improvements_desc: "군사적이든 민간적이든, 물류는 지금 당장 일을 끝내는 데 중요한 역할을 합니다. 이를 위해 철도, 도로, 인터넷 인프라 및 물류 관련 전략적 투자가 이루어지고, 이는 사회의 양면에서 모두 필요할 때 도움을 줄 수 있도록 구축될 것입니다."
 CSA_focus_geological_and_mineral_institute: "지질 및 광물 연구소"
 CSA_focus_geological_and_mineral_institute_desc: "GMI는 지질 및 광물 과학 전담 연구 시설입니다. 주된 목표는 자원 채굴, 정제 및 지질 조사 방식의 새로운 혁신을 탐색하고 개발하는 데 투자하는 것입니다. 복합 자금으로 운영되는 이 연구소는 원래 미미하거나 \\"가치가 없다\\"고 여겨졌던 것에서 더 많은 것을 찾고 더 많이 만들어 내는 새로운 방법을 찾아냄으로써 다른 나라들보다 우위를 안겨 주기를 기대합니다."
 CSA_focus_southern_militarism: "남부 군국주의"
 CSA_focus_southern_militarism_desc: "남부는 유능한 군 지휘관과 전술적 역량이라는 풍부한 역사를 가지고 있습니다. 전략적으로는 부족하다고 보는 이들도 있을 것입니다. 그럼에도 우리는 이 전통을 최대한 활용하여 군 예산을 확대해 더 나은 장비를 확보하고, 병사들의 보수를 인상하며, 훈련을 통해 그들이 진정으로 자신의 고향과 가정을 지킬 수 있도록 다듬어 나갈 것입니다."
 CSA_focus_from_past_pains_to_future_honors: "과거의 고통, 미래의 영예"
 CSA_focus_from_past_pains_to_future_honors_desc: "우리나라의 과거는 피에 젖어 있으며, 그 시대와 낡은 방식 속에서 고통받은 모든 이들의 아픔으로 얼룩져 있습니다. 더는 아닙니다. 우리는 더 이상 과거의 낡고 망상적인 이상에 사로잡히지 않을 것이며, 정의와 자유라는 장대로 옛 분노를 찌를 것입니다. 이 이상을 새롭고 번영하는 국가의 토대에 심고, 새로운 영예를 만들어 갈 새로운 길을 열 것입니다."
 CSA_focus_dixinomics: "딕시노믹스"
 CSA_focus_dixinomics_desc: "이제 우리는 두 발로 땅을 딛고 서야 합니다. 경제를 다시 작동시키는 빠른 방법은 이 땅이 본래 만들어진 기반, 즉 농업에서 출발하는 것입니다. 거기에서부터 경제 상황을 파악하고 앞으로 정말 어디로 가고 싶은지 정할 수 있습니다."
 CSA_focus_department_of_energy: "에너지부"
 CSA_focus_department_of_energy_desc: "DoE, 혹은 딕시 에너지부라고도 부르는 이 기관은 에너지 사용과 생산의 응집력을 규제하고 개선하고자 하는 국가 행정 부서입니다. 의지할 기반은 많지 않지만, 진정으로 더 밝은 내일을 향한 시작입니다."
 CSA_focus_electrical_storage_reforms: "전력 저장 개혁"
 CSA_focus_electrical_storage_reforms_desc: "ESR은 전국의 변전소와 변압기를 개별적으로 더 효율적이고 큰 용량으로 만들기 위한 일련의 저장 시설 투자입니다."
 CSA_focus_power_infrastructure_future_proofing: "전력 기반시설 미래 대비"
 CSA_focus_power_infrastructure_future_proofing_desc: "다른 기반시설과 마찬가지로, 전력 기반시설도 이미 개발된 땅 위에 건설된다면 현재가 아니라 미래를 위해 지어져야 합니다. 물론 우리에게는 점쟁이도 수정구슬도 없지만, 도시화의 역사적 추세를 살펴보면 전력 기반시설을 더 잘 구축하는 방법을 이해할 수 있습니다. 이는 내일의 새로운 도시를 만들 뿐 아니라, 이미 내일의 에너지 수요를 감당할 수 있는 능력을 갖추는 일입니다."
 CSA_focus_investing_in_more_conductive_cables: "고전도성 케이블 투자"
 CSA_focus_investing_in_more_conductive_cables_desc: "구리가 전류를 받아들이고 담을 수 있는 전도성 금속이라는 사실은 누구나 기억합니다. 그러나 현대의 수요는 현대적인 형태의 전도성을 필요로 합니다. 따라서 더 안정적인 송전망과 미래의 수요에 대비할 수 있는 송전망을 위해 더 우수하고 튼튼한 케이블에 투자할 것입니다."
 CSA_focus_expanding_fossil_fuel_facilities: "화석 연료 시설 확장"
 CSA_focus_expanding_fossil_fuel_facilities_desc: "오래도록 믿을 수 있는 방식입니다. 환경 운동가들이 끊임없이 불평하더라도, 모두가 순환 정전을 겪고 싶지 않다면 현실을 부정할 수 없습니다. 현대의 에너지 수요는 모든 것을 재생 에너지로 바꾼다는 이른바 \\"합리적인\\" 일정을 넘어섭니다. 따라서 천연가스나 석유 한 가지에만 기대지 않고 개별 수요를 분산시키기 위해 다양한 화석 연료 발전소를 확장해야 합니다."
 CSA_focus_renewable_diversity: "재생 에너지 다변화"
 CSA_focus_renewable_diversity_desc: "우리 영토는 다양한 재생 에너지 방식에 적합한 여러 지리적 지역으로 이루어져 있습니다. 따라서 이들 지역에 투자하여 다양한 방식으로 전력 수요를 충족시킬 것입니다."
 CSA_focus_real_green_energy: "진정한 녹색 에너지"
 CSA_focus_real_green_energy_desc: "허구든 현실이든 미래는 원자력이 이끕니다. 현재 원자력은 그 굴곡진 역사 때문에 가장 많이 발전한 에너지 방식이 되었습니다. 물론 모든 사고는 자연재해 아니면 인재였지만, 그 실수들은 연구되고 개선되어 이제 원자력은 날이 갈수록 더욱 실용적이 되어 가고 있습니다. 이제 우리도 미래에 합류하여 우리만의 원자력 에너지를 만들 것입니다."
 CSA_focus_brighter_tomorrow: "더 밝은 내일"
 CSA_focus_brighter_tomorrow_desc: "우리나라의 에너지 독립은 무엇보다 중요하며, 그에 따라 우리의 안보도 간접적으로 강화됩니다. 이러한 발전과 앞으로의 발전은 다가올 우리의 나날을 지금까지 생각했던 것보다 더 밝게 만들 것입니다."
 CSA_focus_modern_agrinomics_plan: "현대 농업경제 계획"
 CSA_focus_modern_agrinomics_plan_desc: "사회의 핵심 기둥은 국민을 먹일 식량을 확보하고 보유하는 능력입니다. 우리가 이용할 수 있는 현대 기술과 농업에 매우 비옥한 땅을 바탕으로, 우리는 경제를 다양하면서도 동시에 특화된 구조로 이끌 수 있습니다."
 CSA_focus_frontier_industrialism: "변경 산업주의"
 CSA_focus_frontier_industrialism_desc: "중심 지대는 식량을, 변경 지대는 산업을 맡을 것입니다. 우리 아름다운 국가의 중심부가 경제를 그토록 활기차게 만드는 진정한 경제의 심장부와 조화를 이루도록 균형을 이룰 것입니다."
 CSA_focus_cash_crops: "환금 작물"
 CSA_focus_cash_crops_desc: "돈을 위한 작물, 작물을 위한 돈은 경제와 사회생활의 위대한 순환입니다. 그러나 사람마다 가치를 두는 것이 다르며, 우리는 그 가치를 활용해 가능한 곳 어디에서나 그 작물이 가져다주는 부를 모든 주에 퍼뜨릴 것입니다. 면화에서 담배에 이르기까지, 국가 수출로 돈을 벌어들일 방법을 찾아낼 것입니다."
 CSA_focus_manufacturing_investments: "제조업 투자"
 CSA_focus_manufacturing_investments_desc: "동부와 서부의 해안 주들은 경공업과 일부 중공업에 최적의 터전입니다. 항구에서 공장에 이르기까지 기본적인 공급망을 간소화한 뒤, 농업 중심지나 산업 변경 주들로 물자를 보낼 수 있습니다."
 CSA_focus_arms_production_investments: "무기 생산 투자"
 CSA_focus_arms_production_investments_desc: "우리나라는 스스로를 지켜야 하며, 국내 무기 시장을 구축하는 것보다 나은 방법은 없습니다. 우리 땅은 풍부한 사냥터이며, 그보다 더 큰 것에 투자해야 한다 해도 유사한 제조 분야이므로 전시 전환은 그리 어렵지 않을 것입니다."
 CSA_focus_naval_investments: "해군 투자"
 CSA_focus_naval_investments_desc: "우리나라의 연안 해역은 광대하고 길들여지지 않았으므로, 국내 해운뿐 아니라 군사 해군 역량에도 투자할 방안을 검토해야 합니다. 멕시코만은 하나의 문제일 뿐이며, 대서양 자체는 또 다른 종류의 해전을 감당해야 하게 만듭니다."
 CSA_focus_agrinomics_expansion: "농업경제 확장"
 CSA_focus_agrinomics_expansion_desc: "우리 농업경제 계획의 추세는 이 현대 시대에 불가능하다고 여겨졌을 성과를 거두었습니다. 그러나 결단에는 의지가 따르며, 우리 국민의 뛰는 심장과도 같은 그 의지가 노력과 시간을 쏟아 이러한 성과를 만들어 냈습니다. 우리는 세계에서 가장 강력한 농업 산업 중 하나를 갖추고, \\"현대성\\"이라는 복잡하고 지친 나날 속에서도 더 단순한 삶을 사는 방법을 보여 주는 진정한 본보기가 될 것입니다."
 CSA_focus_dixie_agrinomics_practice: "딕시 농업경제 실천"
 CSA_focus_dixie_agrinomics_practice_desc: "DAP는 구식 농본주의에 현대적 맥락을 부여하는 경제 이론입니다. 순수한 농업 사회의 단점을 이해하고, 우리는 대신 경제를 균형 잡히고 내수 중심으로 개혁했으며, 농업이라는 경제적 특화 분야를 국제적 지지를 얻는 지렛대로 삼았습니다. 국제 정세가 다소 틀어지더라도 우리는 인구를 먹여 살리고 성장시키며 군, 학교, 복지 및 의료 프로그램을 식량 등으로 유지할 더 나은 국내 공급을 갖추고 있습니다. 풍요로운 사회이되, 현대 4차 산업혁명 경제가 가진 소비주의의 부정적 영향과 \\"선택의 역설\\"이 없는 풍요입니다."
 CSA_focus_department_of_natural_resources: "천연자원부"
 CSA_focus_department_of_natural_resources_desc: "DoNR의 창설은 천연자원을 다루는 방식에 대한 국가 단위의 통일된 접근법을 중앙 집중화하고 수립하기 위한 것입니다. 우리는 미시시피와 앨라배마 남부에 광물 매장지가 있고, 조지아에 강철, 구리, 금이 있으며, 우리가 통제하는 영토 곳곳에 다양한 자원이 있음을 알고 있습니다. 이러한 인식은 흥미로운 질문을 제기합니다. 우리는 딱 필요한 만큼만 해야 하는가, 아니면 미래의 잠재력까지 확보해야 하는가."
 CSA_focus_the_future_is_now: "미래는 바로 지금!"
 CSA_focus_the_future_is_now_desc: "우리나라는 새롭고 비교적 취약한 나라입니다. 우리의 미래를 지키고, 우리의 집을 지키고, 우리의 삶의 방식 자체를 지키기 위해, 우리나라는 천연자원을 채굴하고 활용하며 수확하는 능력을 반드시 향상시킬 것입니다."
 CSA_focus_dixie_lithium_belt: "딕시 리튬 벨트"
 CSA_focus_dixie_lithium_belt_desc: "앨라배마와 미시시피 남부에서 루이지애나 북부, 잠재적으로는 텍사스에 이르는 지역에 대한 최근 지질 조사 자료에서 리튬이 풍부한 매장지가 길게 이어진 띠가 확인되었습니다. 새로 발견된 이 매장지는 배터리와 일부 기술 기반 제조업에 대한 우리의 기술 수요를 확보하는 데 큰 도움이 될 것입니다."
 CSA_focus_a_devils_deal_with_georgia: "조지아와의 악마의 거래"
 CSA_focus_a_devils_deal_with_georgia_desc: "광물이 풍부한 조지아에는 구리, 철, 금 등 다양한 자원이 있습니다. 따라서 주 북부 애팔래치아 지역을 중심으로 이 훌륭하고 다양한 광물 자원을 탐사, 채굴, 확보하는 데 전념하는 광업 및 후속 산업 거점이 조성될 것입니다."
 CSA_focus_black_gold_and_more: "검은 황금 그리고 그 이상"
 CSA_focus_black_gold_and_more_desc: "우리나라에는 화석 연료와 기타 에너지 자원이 풍부하게 분포해 있습니다. 우리나라의 에너지 수요 안보가 충족되고 앞으로도 충족되도록 이를 반드시 채굴해야 합니다."
 CSA_focus_self_security_over_exhaustion: "고갈보다 자급 안보"
 CSA_focus_self_security_over_exhaustion_desc: "우리나라의 자원은 다양하고 풍부할 수 있으나, 그 확실성은 알 수 없습니다. 따라서 경제의 안정과 결속을 보장하고 외세에 대한 과도한 의존을 제한하는 데 필요한 만큼만 해야 합니다."
 CSA_focus_little_lithium: "리틀 리튬"
 CSA_focus_little_lithium_desc: "LLM과 LLA는 각각 리틀 리튬 미시시피, 리틀 리튬 앨라배마로 알려진 모기업 리튬 채굴 신생 기업을 가리킵니다. 중앙 정부가 일부 보조금을 지급하며, 연구개발과 일반 상업 및 제조업 용도의 단순한 국내 리튬 수요를 확보하는 것이 목표입니다."
 CSA_focus_buford_salem_project: "뷰포드-세일럼 프로젝트"
 CSA_focus_buford_salem_project_desc: "BSP는 조지아와 캐롤라이나 지역의 채굴 신생 기업들에 대한 일련의 종합 투자입니다. 금, 구리, 철을 비롯한 광물이 이들 주의 애팔래치아 지역 곳곳에 흩어져 있습니다. 따라서 각 주를 대상으로 특정 자원을 채굴하도록 지정하여 전반적인 채굴에 도움이 되게 할 수 있으며, 미래에 정말로 필요해진다면 이들의 채굴 사업은 어떤 자원을 찾을지 전환하는 데 서로 도울 수 있습니다."
 CSA_focus_petrochemical_diversity_programs: "석유화학 다변화 프로그램"
 CSA_focus_petrochemical_diversity_programs_desc: "석유 다변화 프로그램은 국내 에너지 독립을 높이는 동시에 소수의 석유화학 관련 제품을 확보하기 위한 일련의 연구 및 화석 연료 채굴 사업입니다."
 CSA_focus_ending_the_resource_debates: "자원 논쟁의 종결"
 CSA_focus_ending_the_resource_debates_desc: "우리나라의 천연자원을 어떻게 활용하고자 하는지 분명하고 의식적으로 이해하게 된 지금, DoNR을 국가 기구의 정식 구성 요소로 공식 선언할 수 있습니다. 이 방향이 정해짐으로써 우리가 추구하고자 하는 미래로 향하는 길을 확보하게 됩니다."
 CSA_focus_modernized_dixinomics_program: "현대화된 딕시노믹스 프로그램"
 CSA_focus_modernized_dixinomics_program_desc: "우리나라가 뒤처져 왔던 역사를 가진 만큼 많은 이들이 우리를 진지하게 받아들이지 않는 것도 당연합니다. 이 고통스러운 진실을 안고 우리는 스스로를 21세기로 밀어 넣어 세계의 산업화된 경제에 합류해야 합니다."
 CSA_focus_tech_industry_investments: "기술 산업 투자"
 CSA_focus_tech_industry_investments_desc: "진정한 현대화를 향한 여정을 시작하려면, 사무직 부문 전반의 기술 산업 분야를 구축하는 데 실질적인 투자를 확보해야 합니다. 이 투자는 기술 부문에서 민간 연구와 혁신을 만들어 우리나라가 혁신의 미래를 모색하기 시작할 수 있도록 도울 것입니다."
 CSA_focus_national_industrialization_efforts: "국가 산업화 노력"
 CSA_focus_national_industrialization_efforts_desc: "전반적인 산업 및 제조업 투자는 우리나라의 다양한 지역과 국민에게 새로운 자원과 재화를 제공하여 이들을 떠받치고 다변화하며 힘을 실어 줄 것이며, 이를 통해 그들은 이전에는 경험하지 못했을 진정한 생활 수준을 누릴 수 있습니다."
 CSA_focus_banking_and_office_sector_jobs: "금융 및 사무직 일자리"
 CSA_focus_banking_and_office_sector_jobs_desc: "재정을 증진하고 경제 다각화를 지속하기 위해 사무직과 금융 부문 일자리 창출에 투자해야 합니다."
 CSA_focus_armaments_investments: "군수 투자"
 CSA_focus_armaments_investments_desc: "이러한 경제 성장을 확보하려면 우리 군에 무장을 공급하고 지원할 충분한 군수 산업을 구축해야 합니다."
 CSA_focus_shipping_industrial_expansions: "해운 산업 확장"
 CSA_focus_shipping_industrial_expansions_desc: "상업과 제조업이 확장됨에 따라 해운 역량도 확대해야 합니다. 따라서 필요할 때 해운이 제대로 보호받을 수 있도록 해군의 투입도 늘려야 합니다."
 CSA_focus_establishing_a_modern_dixie: "현대 딕시의 건설"
 CSA_focus_establishing_a_modern_dixie_desc: "지속적인 산업화는 낡은 농업 사회가 상상조차 할 수 없었던 더 높은 수준으로 우리나라를 끌어올릴 것입니다. 따라서 이 수준을 확보하고 경제가 세계적으로 경쟁력을 갖추도록 더 잘 준비하기 위해 전국에 걸쳐 새로운 투자를 단행할 것입니다."
 CSA_focus_modern_dixinomics_success: "현대 딕시노믹스의 성공"
 CSA_focus_modern_dixinomics_success_desc: "지난 몇 달간의 프로그램과 투자 등을 통해 우리는 국가의 근간을 지킬 균형 잡히고 매우 다양한 경제를 만들어 냈습니다. 이 성공을 바탕으로 우리가 원하는 미래를 위한 수단을 모색할 수 있습니다."
 CSA_focus_department_of_transportation: "교통부"
 CSA_focus_department_of_transportation_desc: "DoT를 설립하면 앞으로 필요할 경우 민간과 잠재적 군사 수요 모두의 물류 업무를 조직할 수 있습니다."
 CSA_focus_southeastern_highways_act: "남동부 고속도로법"
 CSA_focus_southeastern_highways_act_desc: "고속도로의 전반적인 개선과 유연성은 민간 자동차 수요에 미래를 대비하는 데 무엇보다 중요합니다. 이는 해안선 대부분을 차지하는 남동부 주들에서 더욱 두드러지며, 항구를 오가는 물자 수송이 더 많다는 뜻이기도 합니다."
 CSA_focus_greater_mississippi_highways_act: "대미시시피 고속도로법"
 CSA_focus_greater_mississippi_highways_act_desc: "미시시피강은 우리 국방에 있어 가장 거대한 자연 장벽 중 하나입니다. 그러나 동시에 민간 교통 흐름에 있어서도 가장 큰 자연적 장애물입니다. 따라서 이 지역에서 잘 발달하고 더 잘 연결된 국가를 만들기 위해 미시시피 인근 주들에 투자해야 합니다."
 CSA_focus_reestablishing_the_southern_railway: "서던 철도 재건"
 CSA_focus_reestablishing_the_southern_railway_desc: "'서던은 남부를 위해 봉사한다'는 것이 노퍽 앤 웨스턴과 비극적으로 합병되어 노퍽 서던이라는 혼란을 낳기 전, 옛 서던 철도의 모토였습니다. 이제 우리는 쓰러진 깃발을 다시 들어 올리고 새 생명을 불어넣어 남부 국가에 다시 한번 봉사할 진정한 기회를 얻었습니다."
 CSA_focus_reestablishing_the_mississippi_central: "미시시피 센트럴 재건"
 CSA_focus_reestablishing_the_mississippi_central_desc: "MCRR, 즉 미시시피 센트럴 철도는 한창때에는 3급, 거의 2급에 가까운 훌륭한 철도였습니다. 그러나 이제 우리 땅을 우리 스스로 통제하게 된 만큼 이 철도를 되살려 동부의 서던 철도에 대응하는 훌륭한 서부 노선으로 만들 수 있습니다. 이 두 노선과 다른 소규모 철도가 손을 맞잡으면 전국에 걸쳐 막대한 화물을 수송할 수 있을 것입니다."
 CSA_focus_dot_prioritized_budgeting: "교통부 우선 예산 편성"
 CSA_focus_dot_prioritized_budgeting_desc: "전국적인 기반시설의 유지와 개선은 사회가 최고의 결속력으로 기능하게 만드는 요소입니다. 따라서 우리는 교통부에 처음 배정한 금액을 기준으로 예산을 우선적으로 편성할 것입니다."
 CSA_focus_southern_military_forces: "남부 군"
 CSA_focus_southern_military_forces_desc: "SMF는 우리 국방의 근간입니다. 육군, 해군, 공군의 군종으로 구성된 이들은 적들과 진정으로 보조를 맞추기 위해 그에 맞게 점검되고 발전되어야 합니다. 새로 얻은 자유를 이렇게 일찍 잃을 여유는 없기 때문입니다."
 CSA_focus_southern_army: "남부 육군"
 CSA_focus_southern_army_desc: "남부는 풍부한 군사 역사와 전통을 가지고 있지만, 이에는 변화를 원하지 않는 구세대도 따라옵니다. 우리 육군이 오른발이 아닌 왼발로 출발하도록 초기 재편성부터 시작해야 합니다. 그렇지 않고서야 어떻게 행군을 배우겠습니까."
 CSA_focus_standardization_of_training_practices: "훈련 방식의 표준화"
 CSA_focus_standardization_of_training_practices_desc: "필요할 경우 적절한 동원을 보장하기 위해, 육군 내 훈련 프로그램에 통일된 표준을 마련해야 합니다. 훈련 교관들이 기초 훈련 자체의 훈련 방식을 익히게 되므로 더 많은 병사를 더 빠른 속도로 훈련할 수 있습니다."
 CSA_focus_basic_industrial_support: "기초 산업 지원"
 CSA_focus_basic_industrial_support_desc: "군대를 실제로 운영하려면 장비가 필요합니다. 따라서 성장하는 육군에 도움이 되도록 국방 산업에 기초적인 투자를 실시할 것입니다."
 CSA_focus_logistical_centric_planning: "군수 중심 계획"
 CSA_focus_logistical_centric_planning_desc: "LCP는 현장에서 실시되는 표준 교리와는 다른 군사 작전 접근 방식입니다. 우리의 기동은 다소 성길 수 있으나, 보급선과 병력을 보급하는 능력이 전반적인 효율 증대로 이어질 것입니다. 교리와 조직 방식을 군수 중심으로 바꿈으로써 계획을 더 신중하게 세우고 장비와 가급적 병력 자체의 전체적인 손실을 최소화할 수 있기를 기대합니다."
 CSA_focus_jrotc_education_requirements: "JROTC 교육 요건"
 CSA_focus_jrotc_education_requirements_desc: "군을 접할 기회를 수동적으로 제공하는 것이 신규 지원자를 끌어들이고 군에 대한 국민적 자긍심을 높이는 최선의 방법입니다. 따라서 교육 기관 및 군과 협력하여 학생들이 고등학교 재학 중 최소 2년간 JROTC 과정을 이수하도록 보장하는 전담 기구를 구성할 것입니다."
 CSA_focus_equal_opportunity_officer_training_program: "기회 균등 장교 훈련 프로그램"
 CSA_focus_equal_opportunity_officer_training_program_desc: "지도력의 질과 상비군 조직에 필요한 지휘직의 충원을 보장하기 위해, 새로운 OTP, 즉 장교 훈련 프로그램을 만들어야 합니다. OOTP의 목표는 부사관과 군 입대를 원하는 민간인이 장교에 지원하고 훈련받도록 장려하는 환경을 만드는 것입니다. 이는 장교 계급을 위한 기초 훈련처럼 운영되지만, 장교단의 질이 유지되도록 훨씬 더 많은 요건과 기준이 설정됩니다."
 CSA_focus_well_rounded_army: "균형 잡힌 육군"
 CSA_focus_well_rounded_army_desc: "초기 개혁과 새로운 기준이 정해짐에 따라 우리 육군은 스스로를 제대로 지탱할 만큼 안정되었습니다. 이제 국방과 외교 정책의 미래를 위해 육군이 나아갈 방향을 정하고 도약할 수 있게 되었습니다."
 CSA_focus_doctrine_debates: "교리 논쟁의 시작"
 CSA_focus_doctrine_debates_desc: "육군 군종을 창설하고 견고한 기반을 닦은 지금, 현대 전장에서 승리를 거두기 위해 어떤 방향 혹은 교리를 사용할지 이해할 필요가 있음이 분명해졌습니다. 따라서 선택지를 검토하고, 우리가 이 군종에 바라는 미래를 위해 정확히 무엇이 필요한지 파악해야 합니다."
 CSA_focus_civil_defense_doctrine: "민방위 교리"
 CSA_focus_civil_defense_doctrine_desc: "CDD는 개인의 명예와 자긍심에 바탕을 둔 교리입니다. 우리 지역과 옛 미국의 사냥 및 총기 문화를 활용해 독립적인 프로그램을 다듬고 이를 일종의 \\"민간 국가방위군\\"에 맞게 통제할 수 있습니다. 이는 민병 부대와 단체, 그리고 반쯤 훈련된 민간인들이 의무가 부름 때 자원하거나 징집되기가 더 쉬워진다는 뜻입니다. 물론 이 교리는 개인의 공세보다 본토 방어에 더 중점을 두므로 어떤 공세 전쟁도 눈총을 받게 됩니다. 그러나 이른바 \\"3.5세대 전쟁\\" 전술은 적이 계속 갈피를 잡지 못하게 만드는 데 도움이 될 것입니다."
 CSA_focus_funding_independent_company_programs: "독립 중대 프로그램 지원"
 CSA_focus_funding_independent_company_programs_desc: "ICP는 특정 지역이나 마을에 배치되는 \\"중대\\", 즉 독립 지역 부대를 편성하기 위한 일련의 국비 지원 프로그램입니다. 물론 조건이 있는데, 방어 전쟁이 벌어지면 필요할 경우 이 중대들이 소집되어 전쟁이 끝날 때까지 정규군에 합류할 수 있다는 것입니다."
 CSA_focus_rotc_and_jrotc_standards: "ROTC 및 JROTC 기준"
 CSA_focus_rotc_and_jrotc_standards_desc: "교육 제도에 JROTC와 ROTC 프로그램을 도입한 것은 국민이 군 전반이라는 개념을 수동적으로 접하게 하는 좋은 방법이었습니다. 그러나 이 프로그램들을 재정비하여 국민이 고향과 가정을 위해 왜 싸우는지 이해하고, 방어하고, 이끄는 방법을 선제적으로 훈련시켜야 합니다."
 CSA_focus_continual_planning_doctrine: "지속 계획 교리"
 CSA_focus_continual_planning_doctrine_desc: "CPD는 육군의 계획 기구를 중심으로 한 교리입니다. 작전, 정보 등은 모두 계획에서 비롯되며, 이러한 생각을 바탕으로 우리는 단순한 물자와 인력의 힘보다 성과를 보장하도록 계획 자체를 더 잘 다듬고 개선하고 확장하는 지식을 갖추게 됩니다. 결국 전술 없는 전략은 승리로 가는 가장 느린 길이고, 전략 없는 전술은 패배 직전의 소음에 불과합니다."
 CSA_focus_improving_logistical_standards: "군수 기준 개선"
 CSA_focus_improving_logistical_standards_desc: "군수 수요를 더 잘 충족하는 능력을 향상시키는 것은 모든 것을 계획하는 이 새로운 시대에 매우 귀중한 것이 될 것입니다."
 CSA_focus_orienteering_proficiency_training: "오리엔티어링 숙련 훈련"
 CSA_focus_orienteering_proficiency_training_desc: "구식 군대의 농담 중에, 갓 임관한 소위들은 항상 지상 항법 훈련에서 길을 쉽게 잃는다는 말이 있습니다. 이를 교훈으로 삼아 지상 항법을 최우선 과목으로 삼읍시다. 그러면 부대의 결속력과 지형에 대한 이해가 전통적인 훈련보다 훨씬 더 유연해질 것입니다."
 CSA_focus_shells_not_soldiers_doctrine: "병사 아닌 포탄 교리"
 CSA_focus_shells_not_soldiers_doctrine_desc: "SNS 교리는 물자 중심 교리입니다. 크든 작든 포탄은 소수의 정예 병력보다 수량이 많은 편이 낫다는 원칙을 따릅니다. 핵심은 표준적인 신병을 새로 만드는 것보다 총알과 포탄을 더 빨리 만들 수 있다는 점입니다. 경제에는 다소 부담이 되겠지만, 병사만이 아니라 모두가 전쟁 수행 노력에 임한다는 인식을 심어 주어 군 입대 여부를 둘러싼 자존심 중심의 사회적 분열을 줄이고 더 결속된 사회를 만들 것입니다."
 CSA_focus_increasing_production_abilities: "생산 능력 증대"
 CSA_focus_increasing_production_abilities_desc: "이렇게 요구가 큰 교리를 따라가려면, 이미 가진 것으로 원자재 생산량을 어떻게 늘릴 수 있는지 파악해야 합니다."
 CSA_focus_logistical_elitism: "군수 엘리트주의"
 CSA_focus_logistical_elitism_desc: "우리 교리는 이 모든 총알과 폭탄, 보급품을 운반하고 가져올 능력을 요구합니다. 따라서 군수 부대는 그 자체로 일종의 \\"특수 부대\\"로 격상될 것입니다. 뿐만 아니라 현대전에서는 이 중요한 보급품을 적의 항공 전력으로부터 보호하기 위해 최선을 다해야 하므로, 군수 부대에 대한 강조는 우리가 휘말리는 모든 전쟁에서, 그 주변과 인근에서 이들이 사망할 가능성도 그만큼 높인다는 뜻입니다."
 CSA_focus_true_southern_army: "진정한 남부 육군"
 CSA_focus_true_southern_army_desc: "교리 논쟁은 끝났으며, 우리 육군은 국가와 국익을 지키는 잘 기름칠된 기계가 되었습니다. 이를 바탕으로 진정한 현대적 참모 지휘부를 굳건히 하는 기둥을 세울 것입니다."
 CSA_focus_southern_air_force: "남부 공군"
 CSA_focus_southern_air_force_desc: "스페이스 코스트와 라이트 형제는 비행과 관련된 우리나라의 활기찬 역사를 보여 주는 몇 가지 사례입니다. 이 역사 덕분에 공군 군종의 창설은 필요일 뿐 아니라 역사적 전통에 의한 권리이기도 합니다. 우리는 조상들이 자랑스러워할 새로운 역사적 이정표를 세울 공군을 창설할 것입니다."
 CSA_focus_air_r_and_d_department: "공군 연구개발부"
 CSA_focus_air_r_and_d_department_desc: "군사적으로 시대를 앞서 나가려면 공군 내 전문 부서가 필요합니다. 그러나 민간 계약을 통해 민간 용도로도 활용될 수 있으며, 항공 여행과 항공 수송 혁신 등을 전반적으로 촉진할 수 있습니다."
 CSA_focus_sky_defense_doctrine: "하늘 방어 교리"
 CSA_focus_sky_defense_doctrine_desc: "제공권 확보 분야의 발전을 우선시함으로써, 앞으로 공군을 어떻게 편성하고 다듬을지에 대한 기준을 세웁니다."
 CSA_focus_raining_thunder_doctrine: "천둥비 교리"
 CSA_focus_raining_thunder_doctrine_desc: "이 교리는 공군의 지상 공격 및 폭격 능력을 우선시합니다. 이러한 우선순위는 제공권을 장악하기에 현재의 항공기 개발 추세로 충분하다는 판단에 기대고 있으며, 보유한 폭격기들은 적의 지상 및 해상 전력을 궤멸시켜 우리 전쟁 수행 능력 전반에 실질적인 피해가 없도록 합니다. 결국 공장은 재건할 수 있지만, 전사한 병사는 되살릴 수 없습니다."
 CSA_focus_wright_aircraft_production_company: "라이트 항공기 생산 회사"
 CSA_focus_wright_aircraft_production_company_desc: "라이트 형제는 최초의 지속 비행을 개척하여 이동에 대한 완전히 새로운 이해의 토대를 마련했습니다. 이제 우리는 민간 및 군용 항공기 생산을 위해 노스캐롤라이나에 WAP 회사를 설립함으로써 그들의 이름을 기립니다."
 CSA_focus_production_alignments: "생산 체제 정비"
 CSA_focus_production_alignments_desc: "새 교리는 우리의 군수 생산을 재정비하여 해당 교리에 대한 일관된 채택과 헌신이 충족되도록 할 것을 요구합니다."
 CSA_focus_the_blank_canvas_measurement: "백지 캔버스 구상"
 CSA_focus_the_blank_canvas_measurement_desc: "교리 선택이 확고해짐에 따라, 우리 공군은 현대 전장을 백지 캔버스로 만들 무대를 마련하며, 그 위로 우리 군대가 진군하고 더 나은 내일을 이룰 새로운 그림을 그려 나갈 것입니다."
 CSA_focus_national_aviation_association: "전국 항공 협회"
 CSA_focus_national_aviation_association_desc: "NAA는 군과 민간이 함께하는 회원 단체로, 전국에서 행사를 열어 대중에게 비행의 아름다움과 비행 기계, 그리고 그 뒤에 있는 사람들을 알리고 영감을 줍니다. 이러한 수동적 노출은 군의 신병 모집에 큰 도움이 되는 동시에, 민간이든 군이든 비행을 원하는 새로운 세대를 길러 냅니다."
 CSA_focus_expanding_airbases: "공군 기지 확장"
 CSA_focus_expanding_airbases_desc: "국가의 하늘을 제대로 방어할 만한 적정 규모의 공군을 보유하려면, 전국의 여러 전략 공군 기지의 수용 능력을 확장해야 합니다."
 CSA_focus_southern_skies_for_southern_eyes: "남부의 눈을 위한 남부의 하늘"
 CSA_focus_southern_skies_for_southern_eyes_desc: "우리 공군은 남부 군의 일부를 이루는 자랑스럽고 결연한 군종입니다. 육군과 해군처럼, 우리는 이렇게 훌륭한 군종과 머리 위의 하늘을 지키는 복무 요원들을 창설하고 보유하고 있다는 사실이 자랑스럽고 영광스럽습니다."
 CSA_focus_southern_navy: "남부 해군"
 CSA_focus_southern_navy_desc: "풍부한 해안선에도 불구하고 우리 해군은 그다지 훌륭하지 않습니다. 해군력 대부분은 대서양 연안이나 저 태평양 쪽에서 나옵니다. 그러나 미시시피강과 멕시코만이 있어, 우리가 원하는 해군을 다듬고 꾸려 갈 훈련장은 충분합니다."
 CSA_focus_naval_maintenance_standardization: "해군 정비 표준화"
 CSA_focus_naval_maintenance_standardization_desc: "우리 해군 시설은 매우 전문화되어 있어 다소 군수 혼란을 빚는 경향이 있습니다. 따라서 수리가 필요한 어떤 함선이든 받아들일 수 있도록 시설의 유연성을 확보하는 일반 표준을 만들어야 합니다."
 CSA_focus_family_pay_incentives: "가족 수당 장려책"
 CSA_focus_family_pay_incentives_desc: "해군 함선을 운용하려면 많은 인원이 필요하며, 우리가 어떻게든 휘말리게 될 임무나 전쟁에서 이들은 며칠씩 다소간 고립됩니다. 이를 염두에 두고, 해군 인원이 이러한 부담을 지는 데 대한 더 나은 명분을 찾아야 하며, 급여에 가족 수당을 유연하게 얹어 병사들이 자신뿐 아니라 집에 있는 가족까지 부양할 수 있게 할 것입니다."
 CSA_focus_propulsion_testing_program: "추진 시험 프로그램"
 CSA_focus_propulsion_testing_program_desc: "현대의 함선은 크고 많은 무장으로 가득 차 있습니다. 우리 함선을 더 민첩하게 만들어 적이 탄약을 낭비하고 미사일 같은 값비싼 무기를 쓰도록 강요할 방법을 찾아야 합니다. 이런 완만한 형태의 해상 소모전은 위기 시 장기적인 비용 절감이라는 부수적 이점과 함께 실질적인 수준을 유지하게 해 줄 것입니다."
 CSA_focus_njrotc_programs: "NJROTC 프로그램"
 CSA_focus_njrotc_programs_desc: "JROTC 프로그램은 교육 기관이 원하는 어떤 군종으로든 운영될 수 있지만, 해군 프로그램은 학생들에게 해군 자체를 실제로 접하게 한다는 점에서 훨씬 독특합니다. 따라서 해안선이나 미시시피강 인근의 일정 반경 내 학교에는 기존 프로그램에 더해 전담 해군 JROTC 프로그램이 설치될 것입니다. 목표는 이 해군 JROTC 프로그램이 자금과 주요 수로 이용 권한을 갖게 하여, 학생들이 해군에 입대할 경우 하게 될 일을 더 직접적으로 이해할 수 있게 하는 것입니다."
 CSA_focus_general_training_improvements: "일반 훈련 개선"
 CSA_focus_general_training_improvements_desc: "GTI는 해상에서의 사격과 위기 대응 상황의 질과 효율을 보장하기 위한 일련의 종합 투자입니다. 이에 따라 승조원들은 함급별 전문화를 주된 과정이 아니라 다음 단계로 삼게 되어 더 유연해질 수 있습니다."
 CSA_focus_from_the_gulf_to_the_ocean: "만에서 대양으로"
 CSA_focus_from_the_gulf_to_the_ocean_desc: "일반적인 개선 프로그램과 해군 군종의 확립으로, 우리는 이제 다른 어느 나라와 마찬가지로 우리의 해역과 무역로를 구축하고 건설하고 방어할 시설을 갖추었다고 자신 있게 말할 수 있습니다."
 CSA_focus_what_color_water_debate: "무슨 색 바다인가, 논쟁"
 CSA_focus_what_color_water_debate_desc: "방어할 만한 해군력을 갖추는 것은 하나의 문제지만, 우리나라의 미래 안보를 위해 내려야 할 실질적인 선택이 있습니다. 연안 해군이냐 원양 해군이냐 하는 해군 발전의 방향이 우리 해군의 대응 방식을 준비하고 앞으로의 해군을 규정할 선례를 세울 것입니다."
 CSA_focus_if_it_floats_its_a_boat: "뜨면 배다"
 CSA_focus_if_it_floats_its_a_boat_desc: "질보다 양. 이 평생의 논쟁은 각각 장단점이 있어 많은 이들이 고민하는 문제입니다. 그러나 우리는 해군에서 양을 다시 실현 가능하게 만들 방법을 찾아냈을지도 모릅니다. 함선 설계와 인원 훈련 같은 것을 축소, 표준화, 간소화함으로써, 지나치게 정밀한 타격이 아닌 물량으로 대응하는 해군의 판을 짭니다. 바다가 강철과 포의 파도 속으로 사라지는 광경을 본 적의 사기는 분명 눈치를 챌 것입니다."
 CSA_focus_the_steel_wave_doctrine: "강철 파도 교리"
 CSA_focus_the_steel_wave_doctrine_desc: "강철 파도 교리는 해군 함선의 규모를 줄이고 이 새로운 소형 기준에 맞추어 훈련하는 데 중점을 둔 물량 교리입니다. 이러한 재조정으로 순수한 공격 능력을 희생하는 대신 더 많은 함선을 투입할 수 있습니다. 즉 개미가 꿀에 모여들듯, 적 해군을 기동으로 압도하고 유연하게 대응할 수 있다는 뜻입니다."
 CSA_focus_ship_building_supremacy: "조선 우위"
 CSA_focus_ship_building_supremacy_desc: "SBS는 해군 산업이 전시 함대 함선 생산에 유연하게 협조하고 헌신함으로써 우리 해군력의 규모와 결의를 보장하는 것을 말합니다."
 CSA_focus_green_water_gremlins: "연안 그렘린"
 CSA_focus_green_water_gremlins_desc: "멕시코만은 우리 해군을 위한 완벽한 훈련장입니다. 이 연안 해역 덕분에 세계를 누빌 필요 없이 결의와 기량으로 우리 해역을 방어하는 데 전념하는 해군을 만들 수 있습니다."
 CSA_focus_coastal_coordination: "연안 협조"
 CSA_focus_coastal_coordination_desc: "우리 함대가 남부 군이라는 군사 기계의 톱니바퀴가 되려면 지상 및 항공 전력과 더 잘 협조하는 방법을 이해해야 합니다."
 CSA_focus_submerged_animals: "잠수하는 짐승들"
 CSA_focus_submerged_animals_desc: "우리 잠수함 함대는 수상 함대의 외양만큼이나 치명적이어야 합니다. 이러한 생각에 따라 우리는 교리를 맞춤 조정하여 이 심해의 짐승들이 그 이름에 걸맞은 명성을 얻도록 할 것입니다."
 CSA_focus_blue_sea_sailors: "푸른 바다의 선원들"
 CSA_focus_blue_sea_sailors_desc: "세계는 짙푸른 바다로 덮여 있으며, 어떤 현대 해군에든 대응하려면 그러한 보편성에 걸맞은 해군을 만들어야 합니다."
 CSA_focus_fleet_standards_doctrine: "함대 표준 교리"
 CSA_focus_fleet_standards_doctrine_desc: "FSD는 함대의 규모와 구성에 표준을 정립하여 우리 해군이 육군과 유사하게 편성될 수 있도록 하는 교리입니다. 이를 통해 전력을 적절히 증강하고, 비슷하게 구성된 적 함대에 대응할 수 있습니다."
 CSA_focus_seamen_for_a_sea_fleet: "바다 함대를 위한 수병"
 CSA_focus_seamen_for_a_sea_fleet_desc: "원양 항해 함대에 걸맞은 해군 인원의 질을 보장하도록 이들을 훈련하고 다듬는 일은, 그에 맞게 해군 산업을 재정비하려는 우리의 새로운 교리를 확고히 합니다."
 CSA_focus_sailing_the_ocean_blue: "푸른 바다를 항해하며"
 CSA_focus_sailing_the_ocean_blue_desc: "우리 해군의 미래는 확정되었으며, 우리는 앞으로 수십 년간 국가 정책의 선례가 될 군대를 만들어 냈습니다. 우리가 국가의 발전을 위해 옳은 일을 했기를 바랄 뿐입니다."
 CSA_focus_the_southern_general_staff: "남부 총참모부"
 CSA_focus_the_southern_general_staff_desc: "군대의 정비와 발전으로 장교단은 개혁과 미래에 대한 희망의 등대가 되었습니다. 세월이 우리를 사로잡아 인간 연약함의 통상적인 과잉을 짓누르기 시작하기 전에, 이 혁신성과 역량을 최대한 활용해야 합니다."
 CSA_focus_southern_sunrise: "남부의 일출"
 CSA_focus_southern_sunrise_desc: "우리는 생각을 정리했고 국가로서 기능하는 방법을 파악했습니다. 이제 우리 자신뿐 아니라 그 이상을 생각해야 할 때입니다. 문제는 우리가 솔직히 어떤 방식의 대외 관계를 택해야 하느냐는 것입니다."
 CSA_focus_the_golden_policy_plan: "황금 정책 계획"
 CSA_focus_the_golden_policy_plan_desc: "우리나라의 위치와 경제 구성은 걸프 지역에서 독특한 외교 정책 접근을 가능하게 합니다. 이를 염두에 두고, 옛 합중국에서 연방주의의 악취를 털어 내고 새로운 국가 정체성을 굳히기 위해 오래된 구상을 되살릴 수 있습니다."
 CSA_focus_subjugating_the_yellow_rose: "노란 장미의 복속"
 CSA_focus_subjugating_the_yellow_rose_desc: "황금 고리를 되살리는 첫걸음은 이 계획의 가장 큰 행위자인 멕시코로 가는 길을 여는 것입니다. 그러나 멕시코에 가려면 텍사스를 거쳐야 합니다. 우리는 많은 문화적 유사성을 공유하지만, 텍사스인들이 원하는 것, 즉 그들의 문화적 정체성을 주고자 합니다. 결국 미국 시절에 무엇이었냐고 텍사스인에게 물으면, 그들은 이렇게 답할 것입니다. 우리는 첫째로 텍사스인, 둘째로 남부인, 마지막으로 미국인이라고."
 CSA_focus_war_plan_rodeo: "로데오 전쟁 계획"
 CSA_focus_war_plan_rodeo_desc: "고리로 가는 길에는 두 번째로 큰 과속방지턱이 있습니다. 이 과속방지턱은 물론 텍사스라는 나라이며, 콜롬비아나 베네수엘라처럼 비슷한 규모의 나라들이 있기는 하나 텍사스 사람들의 투지에는 견줄 수 없습니다. 따라서 이 로데오 광대들에게 판세가 정말로 뒤집힐 것임을 확실히 보여 주고 확보하는 방법은 전쟁뿐입니다."
 CSA_focus_the_west_indies_whirlwinds: "서인도 제도의 회오리바람"
 CSA_focus_the_west_indies_whirlwinds_desc: "황금 고리를 확보하려면 이 고리를 구성하는 내부 요소들도 실제로 확보해야 합니다. 따라서 가까운 시일 내에 의미 있는 성과를 이루려면 우리만의 섬 건너뛰기 작전을 집중적으로 펼칠 무대를 마련해야 합니다."
 CSA_focus_war_plan_guantanamo: "관타나모 전쟁 계획"
 CSA_focus_war_plan_guantanamo_desc: "쿠바와는 분명히 실질적인 협상력이 없습니다. 카스트로의 영향력이 여전히 목을 움켜쥐고 있어 구태에서 벗어나지 못하고 있습니다. 따라서 우리는 그들을 해방하고 진정으로 더 공정한 체제를 보여 주기 위해 전쟁에 나섭니다."
 CSA_focus_hispaniola_heart_to_heart: "히스파니올라 진심 어린 대화"
 CSA_focus_hispaniola_heart_to_heart_desc: "아이티는 엉망이며, 이웃한 도미니카 공화국도 크게 나을 것이 없습니다. 경제적 수단과 민간 행정 지원을 통한 사회 안정으로 이 두 나라를 유도할 수 있습니다. 우리의 황금 목표를 향한 또 하나의 단계일 뿐입니다."
 CSA_focus_hispaniola_hiccup: "히스파니올라 딸꾹질"
 CSA_focus_hispaniola_hiccup_desc: "히스파니올라섬은 오늘날까지도 문제 많은 역사를 안고 있습니다. 이러한 인식에 따라 우리는 실패한 정부들에 대한 신속하고 직접적인 조치를 통해 섬의 안정을 보장해야 합니다. 더 나은 내일을 위해 섬과 그 주민들에게 안정을 가져다줄 것입니다."
 CSA_focus_carribbean_cleanup: "카리브해 정리 작전"
 CSA_focus_carribbean_cleanup_desc: "지도 위의 이 점들의 상태는 다양하고 예측 불가능합니다. 이들 나라에는 큰 기대를 하지 않아도 되며, 따라서 우리 침공군은 모든 것을 쓸어 정리하고 단결과 안정의 새로운 정치 실체를 만들 수 있을 것입니다. 뿐만 아니라 우리가 얻게 될 관광 독점을 생각해 보십시오. 꽤 괜찮아 보입니다."
 CSA_focus_british_concessions: "영국의 양보"
 CSA_focus_british_concessions_desc: "지역 패권을 굳히려면 아직 유럽의 통제 아래 있는 해외 영토를 확보할 다양한 방법을 찾아야 합니다. 영국은 재정적으로 그다지 좋은 상태가 아니니, 어쩌면 그냥 이 섬들을 사들일 수도 있을 것입니다."
 CSA_focus_french_concessions: "프랑스의 양보"
 CSA_focus_french_concessions_desc: "프랑스는 여전히 이곳 카리브해에서 우리의 미래 지역 계획 내에 거점들을 보유하고 있습니다. 우리 반구 밖의 외세로부터 카리브해에 대한 전반적인 통제권을 확고히 할 수 있도록 일종의 해결책을 논의해야 합니다."
 CSA_focus_dutch_concessions: "네덜란드의 양보"
 CSA_focus_dutch_concessions_desc: "이곳 서반구에 남은 마지막 유럽 통제 거점 중 하나가 퀴라소섬을 가진 네덜란드입니다. 그들이 이를 손에서 놓도록 넉넉한 일시금을 제시할 수 있을 것입니다."
 CSA_focus_retooling_our_bureaucracy: "관료제 재정비"
 CSA_focus_retooling_our_bureaucracy_desc: "우리나라의 행정 수단은 한계까지 팽창해 있습니다. 대외 및 국내 수요를 따라가려면 이를 개편하고 간소화하며 더 잘 조직해야 합니다."
 CSA_focus_war_plan_aztec: "아즈텍 전쟁 계획"
 CSA_focus_war_plan_aztec_desc: "리오그란데를 건너 남부 전선을 확보할 때가 왔습니다. 결국 이미 국경 안에 있다면 불법 이민이란 있을 수 없습니다."
 CSA_focus_war_plan_fruit_basket: "과일 바구니 전쟁 계획"
 CSA_focus_war_plan_fruit_basket_desc: "바나나 전쟁은 옛 미국이 중앙아메리카에 대한 대외 이익을 추구한 흥미로운 시기였습니다. 이제 우리만의 바나나 전쟁을 치러 지역 우위를 확보하고 이 땅 사람들의 지역 경제적 안녕을 지킬 때입니다."
 CSA_focus_war_plan_canal_crosser: "운하 횡단 전쟁 계획"
 CSA_focus_war_plan_canal_crosser_desc: "파나마를 건너 옛 대콜롬비아 국가의 영토로 들어갑니다. 베네수엘라, 콜롬비아, 파나마에 이르는 이 남부 전선을 굳히고 나면, 그 사이의 모든 것을 단단히 움켜쥐기만 하면 됩니다."
 CSA_focus_stabilizing_the_territories: "영토 안정화"
 CSA_focus_stabilizing_the_territories_desc: "우리의 해외 사업이 정점에 이르렀으니, 잠시 숨을 고르고 새로 얻은 영토를 수습하고 재편해야 합니다."
 CSA_focus_dallas_dance: "댈러스 댄스"
 CSA_focus_dallas_dance_desc: "문화를 통합하고 분열보다 안정을 추구하면 텍사스 주의 민간인들이 이 지역에 대한 남부의 지도력에 더 우호적이게 될 것입니다."
 CSA_focus_cuban_calm: "쿠바의 평온"
 CSA_focus_cuban_calm_desc: "카스트로의 망령은 더 이상 존재하지 않습니다. 이제 우리는 구 쿠바 국가에 안정을 가져오고, 국민이 우리와 그리고 스스로와 하나가 되게 할 수 있습니다."
 CSA_focus_western_civil_integrations: "서부 민정 통합"
 CSA_focus_western_civil_integrations_desc: "서쪽의 히스파니올라, 바하마, 자메이카 섬들은 더 효율적인 새로운 민간 행정을 도입하여 통합 노력을 시작할 수 있습니다. 전반적으로 모든 것이 진정으로 공식화될 때까지 적어도 사태를 진정시킬 수 있을 것입니다."
 CSA_focus_eastern_civil_integrations: "동부 민정 통합"
 CSA_focus_eastern_civil_integrations_desc: "푸에르토리코에서 트리니다드 토바고에 이르기까지 동쪽 섬들은 작지만 수가 많으며, 따라서 이 섬들을 서로 간소화하고 더 잘 통합하여 새로운 지역 연합과의 궁극적이고 진정한 통합을 위한 토대를 마련할 방법을 찾아야 합니다."
 CSA_focus_cartel_contingencies: "카르텔 비상 대책"
 CSA_focus_cartel_contingencies_desc: "지역 카르텔과의 협상, 결속력 있는 민간 행정의 도입, 그리고 구 멕시코 국가에 안정을 가져올 방법의 모색을 통해 현지 주민들의 순응과 협력을 얻고, 우리 지역 연합을 위한 토대를 마련할 수 있을 것입니다."
 CSA_focus_centroamerican_unity: "중미 단결"
 CSA_focus_centroamerican_unity_desc: "중미의 가치와 지역주의를 장려하면 이 지역을 더 큰 황금 퍼즐의 한 조각으로 삼는 데 집중할 수 있습니다. 이는 지역 연합과의 더 나은 통합을 가능하게 하는 동시에 그들 자신에게 일종의 이중적 자긍심을 심어 줄 것입니다."
 CSA_focus_golden_confederation_proclaimation: "황금 연합"
 CSA_focus_golden_confederation_proclaimation_desc: "오늘은 우리의 모든 노력이 과일, 채소, 시가, 설탕, 그리고 누릴 수 있는 수많은 경제 작물과 식량이라는 결실을 맺는 날입니다. 오늘부터 우리는 더 이상 단지 \\"남부 국가\\"가 아니라 황금 연합이며, 서반구의 상당 부분을 이루었던 걸프, 중앙아메리카, 카리브해 지역의 형제자매들과 함께 당당하고 자랑스럽게 서 있습니다. 오늘 우리는 서로 손을 맞잡고 단결과 번영, 그리고 우아함과 평화와 고요함으로 바라볼 황금빛 새벽의 미래로 나아갑니다. 황금 연합 만세!"
 CSA_focus_old_glories_policy_plan: "옛 영광 정책 계획"
 CSA_focus_old_glories_policy_plan_desc: "전성기의 아메리카 합중국은 바다에서 빛나는 바다까지 뻗어 있었습니다. 대륙 하나만큼의 천연자원을 누리던 이 나라에 견줄 나라는 해외에 거의 없었습니다. 그러나 막강한 힘에는 막중한 책임이 따르며, 구체제의 퇴폐는 위대한 공화국이 결국 스스로 무너지게 했습니다. 이제 우리는 백지 상태와 새로운 이해를 바탕으로 이 위대함을 다시 한번 재현해 나설 수 있는 매우 특별한 상황에 있습니다. 이 야심 찬 외교 정책 노선을 달가워하지 않을 사람도 상당수 있겠지만, 기회가 영영 사라지기 전에 지금 해 두는 편이 낫습니다."
 CSA_focus_great_northern_expedition: "대북방 원정"
 CSA_focus_great_northern_expedition_desc: "위대한 수복을 시작하려면 먼저 북쪽으로 진군하여, 거대한 장벽인 강대한 미시시피강 동쪽의 가능한 모든 것을 확보해야 합니다."
 CSA_focus_war_plan_superior: "슈피리어 전쟁 계획"
 CSA_focus_war_plan_superior_desc: "초기 침공은 최서단 국경에 걸쳐 이루어져야 하며, 거기서부터 더 동쪽의 적 부대를 포위하고 진격하기가 쉬워질 것입니다."
 CSA_focus_war_plan_appalachia: "애팔래치아 전쟁 계획"
 CSA_focus_war_plan_appalachia_desc: "자유주 침공은 옛 권력의 중심지인 워싱턴 D.C.를 확보하게 해 줄 것입니다. 북동쪽으로 진격하면서 애팔래치아 산맥을 우리에게 유리하게 활용함으로써 이를 달성할 수 있습니다."
 CSA_focus_war_plan_greater_hudson: "대허드슨 전쟁 계획"
 CSA_focus_war_plan_greater_hudson_desc: "허드슨강에서 메인에 이르기까지, 우리는 북동부 전체를 되찾고 우리가 나섰던 운명을 다시 품 안으로 되돌리고자 합니다. 이 마지막 추진으로 곧 위대해질 제2 아메리카 공화국의 동쪽 절반에 대한 장악을 굳건히 할 것이기 때문입니다."
 CSA_focus_cultural_integration_plans: "문화 통합 계획"
 CSA_focus_cultural_integration_plans_desc: "옛 공화국처럼 쉽게 분열되는 일이 없도록 해야 합니다. 따라서 서로에 대한 단결과 문화적 포용의 새롭고 현대적인 기준을 마련하도록 선제적으로 계획해야 합니다."
 CSA_focus_midwestern_brothers: "중서부의 형제들"
 CSA_focus_midwestern_brothers_desc: "사냥은 남부와 중서부가 공유하는 가장 훌륭한 결속 요소입니다. 이 촉매를 활용해 지역들을 하나로 묶고, 음식의 차이를 새로운 음식과 문화적 단결을 만드는 수단으로 삼을 수 있습니다. 게다가 예절과 태도도 서로 그리 멀지 않으며, 단지 다른 말로 표현될 뿐입니다."
 CSA_focus_capital_compromises: "수도 타협"
 CSA_focus_capital_compromises_desc: "연방주의 주들로도 알려진 수도 지역은 옛 공화국의 나머지 지역에 비해 상당히 독특한 곳입니다. 그러나 외부 영향으로 문화가 다를 수는 있어도, 그 역사만으로 그것을 충분히 보완하고도 남습니다. 연합 규약의 제정, 이어서 헌법과 국가 자체의 건국이 모두 이 중심 지역에서 비롯되었습니다. 따라서 이 문화적 중립성을 보존하고 이해와 이성을 통한 단결의 기준을 세울 수 있도록 약간의 타협을 할 수 있습니다."
 CSA_focus_northeastern_needs: "북동부의 요구"
 CSA_focus_northeastern_needs_desc: "북동부 지역의 거칠고 다양한 기질은 통합하기가 다소 어려울 것입니다. 그러나 그들의 요구에 더 귀를 기울임으로써, 일부는 자신들이 원하는 줄도 몰랐을 배려와 친절의 선례를 세울 수 있습니다. 뉴요커에서 보스턴 사람에 이르기까지, 북동부 전체의 독특한 성격을 이루는 다양한 기질은 불안의 무대를 마련할 것입니다. 하지만 충분히 주의를 기울이고 실제로 그들을 돌본다면 더 순탄한 앞길을 기대할 수 있습니다. 게다가 이들 중 일부 기질은 중서부와 남부의 특정 지역과 맞닿아 있으므로 언제든 최선을 다해 그들에게 호소할 수 있습니다."
 CSA_focus_organizing_the_east: "동부 정비"
 CSA_focus_organizing_the_east_desc: "동부에서 얻은 것들을 정비하면 우리가 활용할 수 있는 자원이 무엇인지 다시 파악할 수 있습니다. 게다가 때가 왔을 때 서쪽으로의 확장을 시작할 토대를 마련하는 데에도 도움이 됩니다."
 CSA_focus_pacific_pearls: "태평양의 진주"
 CSA_focus_pacific_pearls_desc: "오늘 우리는 운명을 완수하기 위해 서쪽으로 나아가 진군합니다. 강대한 미시시피에서 이제 태평양의 진주를 얻고 이 위대한 땅을 다시 하나로 합치기 위해 길을 닦습니다."
 CSA_focus_war_plan_houston: "휴스턴 전쟁 계획"
 CSA_focus_war_plan_houston_desc: "텍사스 공화국은 작을지 몰라도 동기가 매우 강하고 자신들의 영토를 잘 아는 나라입니다. 따라서 그들의 야망이 우리가 제대로 통합할 수 있는 한계를 넘어서기 전에 고립시켜 제거해야 합니다."
 CSA_focus_war_plan_wheat_field: "밀밭 전쟁 계획"
 CSA_focus_war_plan_wheat_field_desc: "라코타 공화국은 옛 공화국의 대평원 지역 상당 부분을 차지합니다. 이 곡창지대를 확보하고, 그들의 고립되고 독립적인 정신을 중서부 및 남부와 비교하고 결합하는 수단으로 삼아 통합 계획을 추진해야 합니다."
 CSA_focus_war_plan_canyon: "협곡 전쟁 계획"
 CSA_focus_war_plan_canyon_desc: "데저렛 연방은 이름뿐인 연방일 뿐이며, 그 영토는 주변 및 내부 문화의 영향이 매우 다양하여 지형 자체를 제외하면 침공이 비교적 간단한 일일 것입니다. 하지만 이러한 단결의 결여를 훗날 그들을 통합하고, 그들이 지지할 진정하고 실질적인 정체성을 부여하는 데 활용할 수 있습니다."
 CSA_focus_war_plan_cascade: "캐스케이드 전쟁 계획"
 CSA_focus_war_plan_cascade_desc: "캐스케이디아 지역으로도 알려진 태평양 북서부는 독립 정신의 측면에서 기원이 비교적 젊은 지역입니다. 이 젊음을 앞으로 우리에게 유리하게 활용할 수 있습니다. 당분간은 산악 지대를 돌파하려는 시도가 매우 지루한 일이 될 것이므로 처신에 조심해야 합니다."
 CSA_focus_war_plan_gold: "황금 전쟁 계획"
 CSA_focus_war_plan_gold_desc: "1800년대의 골드러시는 수많은 사람을 캘리포니아로 몰려들게 했으며, 이제 우리는 골드러시의 주를 침공하여 대륙 원정을 완수하러 나섭니다."
 CSA_focus_westward_integrations: "서부 통합"
 CSA_focus_westward_integrations_desc: "국경 지역과의 통합 및 단결 프로그램을 시작합니다. 이는 3단계에 걸친 전반적 통합 노력의 토대를 마련하며, 다음 단계는 로키산맥 일대의 주들이 될 것입니다."
 CSA_focus_rocky_mountain_integrations: "로키산맥 통합"
 CSA_focus_rocky_mountain_integrations_desc: "로키산맥은 가장 거대한 자연 장벽 중 하나이므로 그 위나 너머에 있는 것을 통합하는 일은 평소보다 다소 어려울 것입니다. 하지만 이를 이 지역들의 요구를 타협하고 평가하는 수단으로 활용하면, 이 광대한 거리가 더 이상 그렇게 멀게 느껴지지 않을 것입니다."
 CSA_focus_pacific_pacification_efforts: "태평양 평정 노력"
 CSA_focus_pacific_pacification_efforts_desc: "대륙 하나만큼 떨어져 있다는 것은 전통적인 단결 프로그램을 시행하기가 가장 쉽지만은 않을 것이라는 뜻입니다. 따라서 새로운 민간 행정을 통합하고 지역 내 안정을 확보하여 우리의 통합 노력이 결실을 맺도록 해야 합니다."
 CSA_focus_the_second_republic: "제2공화국"
 CSA_focus_the_second_republic_desc: "오랜 세월 끝에 우리는 해냈으며, 오늘 우리는 제2 아메리카 공화국을 선포하고 진정한 투지와 노고로 일구어 낸 새로운 운명을 열 수 있습니다. 새로운 꿈이 새로운 현실이 되었으며, 이제 우리가 자랑스러워할 만한 새로운 시작을 여는 것이 우리의 임무입니다."
 CSA_focus_cajun_way_forward: "케이준 정책 계획"
 CSA_focus_cajun_way_forward_desc: "우리 문화에 대한 중대한 영향은 루이지애나 주와 그 인근의 케이준과 크리올 사람들에게서 비롯될 수 있습니다. 이 중대한 영향은 프랑스가 캐나다와 뉴잉글랜드에서 잃은 아카디아 식민지를 대신했던 옛 프랑스령 루이지애나로 거슬러 올라갑니다. 따라서 더 나은 외교 정책 계획은 이러한 뿌리를 재발견하고 옛것에서 영감을 얻어 새로운 빛을 비추는 것이라고 믿습니다. 그리하여 국가 지침 아르카디아를 시작하고 우리 스스로의 새로운 이름을 만들어 나갈 것입니다."
 CSA_focus_midwestern_meltdowns: "중서부 붕괴"
 CSA_focus_midwestern_meltdowns_desc: "오대호 연합은 시카고에서 거미줄처럼 뻗은 철도든 미시시피강과 오하이오강의 수로든 핵심적인 물류 거점입니다. 이 지역은 거둘 때가 무르익었으며, 이제 우리가 할 일은 잠재적 명분을 늘어놓을 무대를 마련하는 것뿐입니다."
 CSA_focus_war_plan_windy_city: "바람의 도시 전쟁 계획"
 CSA_focus_war_plan_windy_city_desc: "중서부의 형제자매들을 품 안으로 들일 때가 왔습니다. 문화를 굳건히 하고, 옛 공화국의 잿더미와 이 유사 부족적 상태에서 태어난 하나의 새로운 민족으로서 단결할 때입니다."
 CSA_focus_capital_crisis: "수도 위기"
 CSA_focus_capital_crisis_desc: "수도 지역에는 옛 연방주의 이상의 \\"고향\\"이라는 것 말고는 문화가 없습니다. 따라서 영유권과 위기 상황을 신속하게 조성하여 그에 맞게 행동할 수 있습니다."
 CSA_focus_war_plan_arlington: "알링턴 전쟁 계획"
 CSA_focus_war_plan_arlington_desc: "때가 왔습니다. 수도의 적들은 과거만 생각하니, 새로운 세계의 적들을 향해 몰아칩시다. 이제 그들에게 미래를 보여 줄 때입니다."
 CSA_focus_northeastern_nagging: "북동부 잔소리"
 CSA_focus_northeastern_nagging_desc: "뉴요커들의 호전적인 기질은 긴장을 고조시키기 쉽게 만들 것입니다. 이는 그 뒤에 있는 더 수동적이라는 이웃들까지 연루시킬 무대를 마련해 줍니다."
 CSA_focus_war_plan_tea_party: "티 파티 전쟁 계획"
 CSA_focus_war_plan_tea_party_desc: "판이 짜인 지금, 우리는 북동부로 진격하여 구 합중국 대륙 동쪽 절반에 대한 통제를 굳건히 할 수 있습니다. 이는 우리의 새로운 정체성과 지역 안정, 그리고 우리 스스로 결정할 수 있는 미래를 위한 토대를 마련합니다."
 CSA_focus_border_settlements: "국경 정착지"
 CSA_focus_border_settlements_desc: "옛 국경을 허물고 새로운 정착지를 만드는 것은 서로 다른 문화를 더 잘 통합하고 어우러지게 하는 진정한 첫걸음입니다."
 CSA_focus_chicago_cheers: "시카고의 건배"
 CSA_focus_chicago_cheers_desc: "시카고는 중서부의 심장이며 그렇게 대우받아야 합니다. 이를 위해 바람의 도시를 통해 문화적 차이를 나누고 한 가족으로서의 단결을 축하할 것입니다."
 CSA_focus_detroit_delight: "디트로이트의 기쁨"
 CSA_focus_detroit_delight_desc: "시카고가 심장이라면 디트로이트는 중서부의 폐라 할 수 있습니다. 크고 작은 제조업체의 터전이 될 디트로이트는 우리의 문화 행사와 통합 노력을 위한 훌륭한 두 번째 무대가 될 것입니다."
 CSA_focus_crossing_more_than_the_delaware: "델라웨어 그 이상을 건너며"
 CSA_focus_crossing_more_than_the_delaware_desc: "언덕을 넘고 먼 곳으로, D.C.와 필라델피아를 지나 만으로, 우리는 멀리 이동하여 이 혼란의 땅에 평온을 가져옵니다. 이제 이 땅에 결속과 안정을 가져올 때입니다."
 CSA_focus_boston_beautiful: "아름다운 보스턴"
 CSA_focus_boston_beautiful_desc: "민간 행정을 도입하고 지역의 평온을 되찾으면 보스턴에서 행사와 기념식을 열 수 있습니다. 옛 혁명이 티 파티로 시작되었던 그곳에서, 이제 우리는 하나의 큰 가족으로서 더욱 가까워지며 새로운 축하를 시작합니다."
 CSA_focus_a_new_beginning: "새로운 시작"
 CSA_focus_a_new_beginning_desc: "이제 우리 국민을 위한 쇄신과 새 출발, 그리고 새로운 시대의 과정이 시작됩니다."
 SRA_idea_railroad_mania: "철도 광풍"
 SRA_idea_railroad_mania_desc: "열차는 육상에서 그 종류로는 가장 강력한 운송 수단입니다. 남부 공화국의 기관차는 곧 세계적으로 명성을 얻을 우리 철도를 이루는 부두, 산업, 지선 뒤에 있는 동력입니다. 우리는 위대한 남부 철도를 건설할 뿐 아니라 그 이야기를 널리 전해야 합니다."
 SRA_idea_department_for_transport_innovation: "교통 혁신부"
 SRA_idea_department_for_transport_innovation_desc: "사람과 물자를 모두 운송하는 더 낫고 발전되고 효율적인 방법을 개발하는 전면적인 사업에 전념합니다. DTI는 이러한 목표를 달성하기 위한 전담 자금 지원의 결과물입니다."
 SRA_idea_promoting_agriculture_influence: "농업 영향력 증진"
 SRA_idea_promoting_agriculture_influence_desc: "우리 영토는 전 세계에서 필요로 하는 농산물을 재배하기에 완벽합니다. 우리 경제가 농업에 좌우될 필요는 없지만, 이를 활용해 약간의 연성 영향력을 행사하고 국내 수요도 충족할 수 있음은 분명합니다."
 SRA_idea_old_habits_new_hopes: "남부의 꿈"
 SRA_idea_old_habits_new_hopes_desc: "우리는 모두를 위한, 그리고 모두가 하나를 위할 수 있는 위대한 나라를 세웠습니다. 이 현실을 확보하는 데에는 상당한 시간이 걸렸으며, 그와 함께 과거의 사슬을 떨쳐 내야 하는 현실이 따릅니다. 현재에서 서로를 포용하고, 외모와 상관없이 모든 남부 시민을 위한 미래를 만들어 갈 것입니다. 우리는 '남부의 꿈'을 이루어 왔고 앞으로도 이룰 것입니다."
 SRA_idea_historical_innovation_classes: "역사적 혁신 수업"
 SRA_idea_historical_innovation_classes_desc: "남부의 역사는 농업 발전의 역사입니다. 우리 역사의 어두운 부분이 가르쳐지고 이해되도록 해야 하는 한편, 진정한 혁신은 문제가 심각해질 때 이루어진다는 점 또한 무엇보다 중시해야 합니다. 이에 우리는 식량 안보와 농업 연구라는 영원한 문제에 주목할 것이며, 이는 우리가 세계에 이름을 남기고 과학계에 문화적 흔적을 새기게 해 줄 것입니다."
 SRA_idea_agricultural_industrialism: "농업 산업주의"
 SRA_idea_agricultural_industrialism_desc: "농업은 제대로 기능하는 사회의 기본 토대입니다. 농업 부문 전체를 다각화하는 데 투자함으로써, 우리 산업 발전이 사회의 기본 수요를 충족할 뿐 아니라 우리의 정수인 농업 부문 자체를 최적화하고 확장하며 성장시킬 수 있도록 보장할 수 있습니다."
 SRA_idea_expanded_corps_of_engineers: "확대된 공병단"
 SRA_idea_expanded_corps_of_engineers_desc: "공병단을 확대함으로써 공병단의 민간 확장 조직을 편성하고 여러 평시 임무를 수행하게 할 수 있습니다. 이는 필요할 경우 군 군수와 후방 방어 공사를 돕기 위해 동원될 수 있는 예비 전력을 제공합니다."
 SRA_idea_a_southern_dream: "남부의 꿈"
 SRA_idea_a_southern_dream_desc: "우리의 땅, 우리의 국민, 우리의 가족. 우리의 운명은 남부의 것이며, 안락함과 가족, 그리고 남부 정신이라는 꿈을 모든 시민이 누리도록 보장하는 것이 우리의 목표입니다. 집과 엄마의 집밥보다 좋은 것은 없으니까요."
 SRA_idea_industrial_stagnation: "산업 정체 교리"
 SRA_idea_industrial_stagnation_desc: "농업 부문은 문명의 척추이며, 이 척추는 전반적으로 보살피고 강화해야 합니다. 따라서 이 척추가 부서지기 쉬워지거나 시들어 사라지지 않도록, 우리나라 전체를 발전시키는 방식에 대한 사고방식을 바꾸어야 합니다."
 SRA_idea_nature_navigators: "자연 항해자들"
 SRA_idea_nature_navigators_desc: "이처럼 다양한 지형 덕분에 병사들을 다방면으로 훈련하고 다듬는 능력은 지상의 병사들에게 유연성을 줄 뿐 아니라, 조종사들도 식별하기 어려운 지형에서 적의 움직임을 추적하는 방법을 더 잘 이해하게 합니다."
 SRA_idea_historical_scars: "역사의 상흔"
 SRA_idea_historical_scars_desc: "때로는 과거를 잊지 않는 것이 최선입니다. 하지만 그 고통은 상처를 남기며, 우리나라가 먼 길을 왔음에도 우리의 존재 자체를 둘러싼 국내외의 낙인은 여전히 주저하게 만드는 것입니다. 언젠가는 정말로 앞으로 나아갈 수 있을지도 모릅니다..."
 SRA_idea_ignoring_the_past: "과거를 외면하다"
 SRA_idea_ignoring_the_past_desc: "과거는 말 그대로 과거입니다. 바꿀 수 없는데 걱정할 이유가 없습니다. 게다가 우리에게는 걱정해야 할 현재와 미래가 있습니다."
 SRA_idea_from_past_scars_to_future_honors: "과거의 상흔에서 미래의 영예로"
 SRA_idea_from_past_scars_to_future_honors_desc: "우리는 더 이상 과거와 그 공포에 얽매이지 않을 것입니다. 이제 하나의 남부 가족으로서 함께 앞을 바라보며, 우리가 새로 얻은 자유를 빼앗으려는 적들로부터 서로를 지키고자 합니다. 가족을, 친구를, 고향을 위하여, 남부 국가를 위하여!"
 SRA_idea_formalized_department_of_energy: "공식화된 에너지부"
 SRA_idea_formalized_department_of_energy_desc: "DoE의 설립과 투자로 우리나라의 에너지 수요를 더 잘 충족할 수 있게 되었습니다."
 SRA_idea_from_theory_to_practice: "이론에서 실천으로"
 SRA_idea_from_theory_to_practice_desc: "딕시 농업경제 이론은 내수 중심 경제에 의존하는 방식으로서 훨씬 더 지속 가능하고 안정적임이 입증되었습니다. 물론 우리는 여전히 세계 무역을 하지만, 우리가 정말로 남아도는 것을 거래하는 대신 다양한 품질의 수입품 전반을 받아 옵니다."
 SRA_idea_formalized_department_of_natural_resources: "공식화된 천연자원부"
 SRA_idea_formalized_department_of_natural_resources_desc: "위대한 자원 논쟁이 끝나면서 우리는 DoNR의 기능적 기반을 공식적으로 확립하고 구성했습니다. 이제 우리나라의 발전과 더 밝은 미래를 위한 항로가 정해졌습니다."
 SRA_idea_a_modern_dixie: "현대 딕시"
 SRA_idea_a_modern_dixie_desc: "현대화된 딕시노믹스 프로그램의 균형 잡히고 다양한 성격은 우리를 이전 어느 때보다도 높은 경제력과 삶의 질 기준으로 끌어올렸습니다. 이제 우리는 원하는 미래, 그리고 앞으로 맞이할 미래를 확보할 수 있는 토대를 갖추었습니다."
 SRA_idea_priority_budgeting: "우선 예산 편성"
 SRA_idea_priority_budgeting_desc: "교통부가 예산 편성에서 최우선 순위를 받음으로써, 민간이든 군이든 우리나라의 끊임없이 변하는 수요에 맞춰 기반시설을 다듬고, 적응시키고, 성장시킬 수 있게 될 것입니다."
 SRA_idea_civil_defense_doctrine: "민방위 교리"
 SRA_idea_civil_defense_doctrine_desc: "CDD는 민병 체제를 정규군의 영향과 결합한 것입니다. 어떤 면에서는 전통적인 현대전과 이른바 \\"4세대 전쟁\\" 사이의 다리가 되도록 의도되었습니다. 기록부의 일부 인원은 농담 삼아 이 교리의 다른 이름으로 \\"3.5세대 전쟁\\"을 적어 넣기 시작했습니다."
 SRA_idea_civil_defense_doctrine_one: "민방위 교리"
 SRA_idea_civil_defense_doctrine_one_desc: "CDD는 민병 체제를 정규군의 영향과 결합한 것입니다. 어떤 면에서는 전통적인 현대전과 이른바 \\"4세대 전쟁\\" 사이의 다리가 되도록 의도되었습니다. 기록부의 일부 인원은 농담 삼아 이 교리의 다른 이름으로 \\"3.5세대 전쟁\\"을 적어 넣기 시작했습니다."
 SRA_idea_continual_planning_doctrine: "지속 계획 교리"
 SRA_idea_continual_planning_doctrine_desc: "CPD는 육군 기능의 계획 기구를 활용하여 육군의 전투 요소와 군수 요소 간의 전반적인 결속을 다듬고 개선하는, 정련과 인내의 교리입니다."
 SRA_idea_continual_planning_doctrine_one: "지속 계획 교리"
 SRA_idea_continual_planning_doctrine_one_desc: "CPD는 육군 기능의 계획 기구를 활용하여 육군의 전투 요소와 군수 요소 간의 전반적인 결속을 다듬고 개선하는, 정련과 인내의 교리입니다."
 SRA_idea_shells_not_soldiers_doctrine: "병사 아닌 포탄 교리"
 SRA_idea_shells_not_soldiers_doctrine_desc: "SNS 교리는 단도직입적인 물자 우위 교리입니다. 경제적으로는 더 많은 비용이 들지만, 총알과 폭탄을 잃는 것보다 병사와 인명을 더 많이 잃는 것이 사회로서는 훨씬 더 큰 대가를 치르게 합니다."
 SRA_idea_shells_not_soldiers_doctrine_one: "병사 아닌 포탄 교리"
 SRA_idea_shells_not_soldiers_doctrine_one_desc: "SNS 교리는 단도직입적인 물자 우위 교리입니다. 경제적으로는 더 많은 비용이 들지만, 총알과 폭탄을 잃는 것보다 병사와 인명을 더 많이 잃는 것이 사회로서는 훨씬 더 큰 대가를 치르게 합니다."
 SRA_idea_airforce_sky_defense_doctrine: "공군 하늘 방어 교리"
 SRA_idea_airforce_sky_defense_doctrine_desc: "SDD는 영공 장악에 있어 표적화된 우위에 중점을 둔 교리입니다. 이 우선순위는 폭격 출격을 더 효과적으로 만들지만, 관심이 부족한 탓에 폭격 개발 분야의 혁신은 더뎌질 것입니다."
 SRA_idea_airforce_raining_thunder_doctrine: "천둥비 교리"
 SRA_idea_airforce_raining_thunder_doctrine_desc: "폭격 능력을 우선시함으로써 전장에서 적의 전투 능력에 강력한 타격을 입히는 능력을 높입니다."
 SRA_idea_airforce_sky_defense_doctrine_one: "공군 하늘 방어 교리"
 SRA_idea_airforce_sky_defense_doctrine_one_desc: "SDD는 영공 장악에 있어 표적화된 우위에 중점을 둔 교리입니다. 이 우선순위는 폭격 출격을 더 효과적으로 만들지만, 관심이 부족한 탓에 폭격 개발 분야의 혁신은 더뎌질 것입니다."
 SRA_idea_airforce_raining_thunder_doctrine_one: "천둥비 교리"
 SRA_idea_airforce_raining_thunder_doctrine_one_desc: "폭격 능력을 우선시함으로써 전장에서 적의 전투 능력에 강력한 타격을 입히는 능력을 높입니다."
 SRA_idea_steeL_wave_doctrine: "강철 파도 교리"
 SRA_idea_steeL_wave_doctrine_desc: "SWD는 해군 측면에서 질보다 양을 정련한 교리입니다. 즉 훈련과 함선 규모를 전반적으로 줄임으로써 더 많은 함선을 투입하고 적 부대에 더 기민하고 신속하게 대응할 수 있다는 뜻입니다."
 SRA_idea_steeL_wave_doctrine_one: "강철 파도 교리"
 SRA_idea_steeL_wave_doctrine_one_desc: "SWD는 해군 측면에서 질보다 양을 정련한 교리입니다. 즉 훈련과 함선 규모를 전반적으로 줄임으로써 더 많은 함선을 투입하고 적 부대에 더 기민하고 신속하게 대응할 수 있다는 뜻입니다."
 SRA_idea_green_water_gremlins: "연안 그렘린"
 SRA_idea_green_water_gremlins_desc: "우리가 신경 써야 할 바다는 연안 해역뿐입니다. 따라서 이러한 생각에 맞추어 해군 기구를 훈련하고 개선하여 국가를 최대한 확실히 지킬 것입니다."
 SRA_idea_green_water_gremlins_one: "연안 그렘린"
 SRA_idea_green_water_gremlins_one_desc: "우리가 신경 써야 할 바다는 연안 해역뿐입니다. 따라서 이러한 생각에 맞추어 해군 기구를 훈련하고 개선하여 국가를 최대한 확실히 지킬 것입니다."
 SRA_idea_fleet_standards_doctrine: "함대 표준 교리"
 SRA_idea_fleet_standards_doctrine_desc: "이 교리는 적 부대를 호출하고 유연하게 대응할 수 있는 소규모 해군들을 만들 수 있게 합니다. 이를 통해 해군 전체가 무모한 행동을 하지 않도록 하는 동시에, 표준화된 함대 구성 방식을 통해 승조원과 지휘부에게 풍부한 경험을 쌓게 합니다."
 SRA_idea_fleet_standards_doctrine_one: "함대 표준 교리"
 SRA_idea_fleet_standards_doctrine_one_desc: "이 교리는 적 부대를 호출하고 유연하게 대응할 수 있는 소규모 해군들을 만들 수 있게 합니다. 이를 통해 해군 전체가 무모한 행동을 하지 않도록 하는 동시에, 표준화된 함대 구성 방식을 통해 승조원과 지휘부에게 풍부한 경험을 쌓게 합니다."
 SRA_idea_southern_general_staff: "남부 총참모부"
 SRA_idea_southern_general_staff_desc: "남부 군은 각 군종을 훌륭하게 발전시키고 다듬었으며, 이에 더해 이러한 발전의 약진은 장교단과 총참모부에까지 미쳤습니다. 풍부한 경험은 시대를 앞서 나가는 데 쓰일 것이며, 훗날의 남부인들이 이러한 군의 자긍심을 누릴 수 있기를 바랍니다."
 SRA_idea_retooling_administrative_means: "행정 수단 재정비"
 SRA_idea_retooling_administrative_means_desc: "야심 찬 외교 정책 전략으로 인해 일부 행정적 부작용이 나타나기 시작했습니다. 더 결속력 있게 앞으로 나아가려면 이러한 과잉을 처리하고 통제해야 합니다."
 SRA_idea_cultural_integrations_program: "문화 통합 프로그램"
 SRA_idea_cultural_integrations_program_desc: "옛 공화국의 가장 큰 결함은 그를 이루던 서로 다른 하위 문화를 이해하고, 적응시키고, 통합하는 유연성이 없었다는 것입니다. 우리는 그 실수를 되풀이하지 않고, 이들 하위 문화가 개별주의로 흐르지 않도록 여러 지역과 문화 교류 및 통합 프로그램을 시작할 것입니다. 오히려 이들은 새로운 미국 문화와 생활 방식이라는 퍼즐의 조각이 될 것입니다."
 SRA_idea_the_second_american_republic: "제2 아메리카 공화국"
 SRA_idea_the_second_american_republic_desc: "땀과 위대한 노력을 통해 우리는 제2공화국을 세웠습니다. 이제 우리는 백지 상태에서 시작할 수 있으며, 거의 무한한 가능성의 미래를 맞이하게 되었습니다."
 southern_republic_divided_we_fell: "분열하여 무너지다"
 southern_republic_divided_we_fell_desc: "연방은 더 이상 존재하지 않으며, 이제는 하위 문화들의 산산이 부서진 거울과 그 폭력적 종말의 잿더미만이 남아 있습니다. 진정한 독립 국가가 되려면 앞으로 나아가 어디로든 가기 전에 먼저 스스로를 지탱하는 방법을 찾아야 합니다."
 southern_republic_domestic_policies: "남부 국내 정책"
 southern_republic_domestic_policies_desc: "남부가 겪어 온 흑백으로 갈린, 그리고 매우 붉게 얼룩진 역사에도 불구하고, 현대의 인구 구조 변화는 한때 작용하던 더 과격한 세력들의 상당 부분을 누그러뜨렸습니다. 그럼에도 바로 그 세력들이 적응했으며, 표현이 부족하지만 발버둥 치고 소리 지르지 않고는 사라지지 않을 것으로 보입니다. 그럼에도 우리는 이러한 과잉을 극복하고 신생 국가의 평온과 생존을 보장해야 합니다. 결국 남부의 환대라는 지켜야 할 명성이 있다는 것을 여러분도 아시지 않습니까."
 southern_republic_federal_budgets: "정부 지출"
 southern_republic_federal_budgets_desc: "SRA, 즉 남부 공화국의 중앙 정부는 한마디로 흥미로운 존재입니다. 누구도 \\"연방\\"이라는 말을 좋아하지 않기에, 대신 정부 지출 같은 용어로 이를 우회합니다. 사람들이 어떤 말장난을 하든, 공화국의 중앙 정부는 국민을 부양하면서도 옛 연방과 같은 길을 걷지 않도록 해야 하는 줄타기입니다."
 southern_republic_industrial_policies: "딕시 산업화부"
 southern_republic_industrial_policies_desc: "DID... 헤헤, 그러니까, 아무튼. 딕시 산업화부는 이름 그대로 국가의 산업화와 지속적인 발전을 책임집니다. 우리 땅이 낼 수 있는 작물에는 한계가 있으므로, 다른 대부분의 나라들과 보조를 맞추기 위해 분투할 것입니다."
 southern_republic_resource_management_policies: "딕시 관리청"
 southern_republic_resource_management_policies_desc: "DMA는 가용 노동력을 조직하고, 우리나라의 핵심 산업이 쉽게 구할 수 있는 원자재에 접근할 수 있도록 보장하는 임무를 맡고 있습니다. 즉 채굴과 농업은 대체로 DMA의 감독 아래에 놓입니다."
 southern_republic_tax_policies: "딕시 기부부"
 southern_republic_tax_policies_desc: "또 시작이군요. DDD, 혹은 농담 삼아 '딕시 요구부'라고도 불리는 이 부서는 국가의 세법을 조직하고 시행하여 장부의 전반적인 균형을 맞추는 일을 맡고 있습니다. 이들은 부침을 예상하지만, 국민 상당수가 옛 연방의 자유지상당에 속했거나 가까웠기 때문에 세금이라는 말을 좋아하지 않습니다."
 southern_republic_army_service_branch: "남부 육군"
 southern_republic_army_service_branch_desc: "SAB, 즉 남부 육군은 남부 군에서 매우 전통적인 군종입니다. 자국 영토에서 태어난 역사적 군 지도자들을 기리는 만큼, 일반 보병에게 필요한 수준 이상으로 훈련을 많이 하고 장교단에는 더 높은 기준을 부과하는 경향이 있습니다. 어쨌든 육군은 조국을 방어하든 새로운 모험을 추구하든, 어떤 진지한 방향으로 나아가고자 하는지 스스로를 오래 들여다봐야 할 것입니다."
 southern_republic_air_force_service_branch: "남부 공군"
 southern_republic_air_force_service_branch_desc: "남부 공군, 즉 SAF는 훈련과 연구개발 부서에 대한 실질적 투자 측면에서 일종의 소외된 의붓자식입니다. 그럼에도 플로리다의 스페이스 코스트의 영향과 남부 공화국 내에 자리한 여러 주요 공군 기지 덕분에, 공군은 가진 것으로 버텨 나가고 있습니다. 하지만 국가가 스스로를 제대로 방어하려면 지금보다 훨씬 많은 것이 필요할 것입니다."
 southern_republic_navy_service_branch: "남부 해군 복무청"
 southern_republic_navy_service_branch_desc: "SNS, 혹은 간단히 남부 해군이라 불리는 이 조직은 상당히 견실한 군종입니다. 우리나라는 멕시코만 해안 지대의 사실상 3분의 1을 아우르고 있어 항해와 관련된 민간 및 군사 시설이 많습니다. 다만 이 시설들은 옛 연방의 붕괴로 큰 타격을 입었으며, 이렇게 광대한 해안선을 제대로 방어하려면 수리와 훈련, 그리고 상당한 투자가 필요할 것입니다."
 SRA_new_orleans_capital: "§Y뉴올리언스§!를 수도로 삼았습니다"
 SRA_meridian_capital: "§Y메리디안§!을 수도로 삼았습니다"
 SRA_atlanta_capital: "§Y애틀랜타§!를 수도로 삼았습니다"
 SRA_charleston_capital: "§Y찰스턴§!을 수도로 삼았습니다"
 SRA_country_flag_the_window_holds: "오버턴 창 유지"
