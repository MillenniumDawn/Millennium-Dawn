 afv_hover_suspension_1: "호버 서스펜션 I"
 afv_hover_suspension_1_desc: "호버 서스펜션 체계는 양력 기술로 지면과의 접촉을 줄이고 험지에서의 기동성을 높여, 병력 수송 장갑차가 훨씬 높은 최고 속도를 낼 수 있게 합니다.\n\n§G설계 힌트: 호버 서스펜션은 최고 속도를 크게 높여 주지만 연료 소비와 제작 비용이 증가합니다.§!"
