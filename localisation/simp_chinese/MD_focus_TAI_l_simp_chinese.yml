l_simp_chinese:
 TAI_legacy_of_1949: "1949年的遗留"
 TAI_legacy_of_1949_desc: "1949年中国内战结束后，国民党及其支持者逃到台湾省。这一事件的遗留影响，再加上台湾本地的本土主义运动，导致大多数台湾民众强烈反对与大陆统一。"
 TAI_the_great_chip_empire: "伟大的芯片帝国"
 TAI_the_great_chip_empire_desc: "台湾在半导体和微芯片生产初期就抓住机遇，凭借其相对于其他国家更具吸引力的投资环境，迅速跻身行业前沿。尽管生产成本低廉、效率高，且对西方国家出口量巨大，台湾仍将自身经济与国家安全平衡在向西方世界供应微芯片这一角色上，并通过持续不断的创新保持着行业领先地位。"
 TAI_flight_crew_strike: "桃园空乘工会罢工"
 TAI_flight_crew_strike_desc: "没结果！不会停！"
 TAI_foxconn_ev_pipeline: "无定型电动汽车生产线"
 TAI_foxconn_ev_pipeline_desc: "参考车型和合作伙伴项目提供了工程方面的选择，但经过验证的产品和有竞争力的客户仍然稀缺。在获得稳定销量之前，资金就已经投入使用。"
 TAI_foxconn_factory_behind_brand: "品牌背后的工厂"
 TAI_foxconn_factory_behind_brand_desc: "鸿海/富士康通过模具制造、采购、工艺工程、测试和物流，将客户的设计转化为可重复生产的成品。其巨大的产能仍然受到微薄利润和强大客户群的制约。"
 TAI_foxconn_factory_city_production: "工厂城市生产"
 TAI_foxconn_factory_city_production_desc: "密集的供应商网络、宿舍、交通和工业服务设施使得生产能够迅速提升。然而，将工作和日常生活集中在少数几个园区内也加剧了劳动力短缺和生产中断的风险。"
 TAI_foxconn_resilient_manufacturing_network: "弹性制造网络"
 TAI_foxconn_resilient_manufacturing_network_desc: "建设-运营-本地化网络连接合格的区域枢纽，同时保留宝贵的大陆运力。冗余机制以持续的协调成本为代价，改善了市场准入和危机恢复能力。"
 taiwan.300.a: "构建最密集的大陆网络"
 taiwan.300.a_bonus: "大陆组装网络"
 taiwan.300.b: "与其为他人打造品牌，不如追求我们自己的品牌。"
 taiwan.300.d: "到2000年，总部位于台湾的鸿海/富士康已发展成为一家成熟的电子产品制造商，其在大陆的生产体系​​也在迅速扩张。管理层必须决定是继续为其他品牌大规模生产，还是投入同样的资金尝试打造自己的品牌。"
 taiwan.300.t: "品牌背后的工厂"
 taiwan.301.a: "提高标准并谨慎地实现自动化。"
 taiwan.301.a_bonus: "自动装配线"
 taiwan.301.b: "控制成本，并将生产转移到内陆地区。"
 taiwan.301.d: "一系列工人死亡事件和令人担忧的报道，使人们开始关注工时、薪酬、安全以及工厂城市体系内的生活状况。事件原因尚存争议，但亟需采取制度性应对措施这一点毋庸置疑。"
 taiwan.301.t: "深圳劳工危机"
 taiwan.302.a: "将建设重心集中在郑州"
 taiwan.302.a_bonus: "集中建设能力"
 taiwan.302.b: "建设多个内陆生产节点"
 taiwan.302.d: "郑州拥有完善的基础设施、充足的人才支持以及足够的空间，足以建设一个庞大的内陆生产园区。该项目有望创造非凡的产能，但同时也会加深对单一客户、地点和政策环境的依赖。"
 taiwan.302.t: "iPhone之城"
 taiwan.303.a: "领导夏普资本重组"
 taiwan.303.a_bonus: "显示面板工程"
 taiwan.303.b: "维护战略伙伴关系"
 taiwan.303.d: "夏普需要资本重组合作伙伴，而富士康则希望获得显示屏技术、工程师以及更紧密的零部件合作关系。控制权带来的将是日本企业艰难的转型，而非技术的即时转移。"
 taiwan.303.t: "走钢丝的夏普"
 taiwan.304.a: "致力于威斯康星项目"
 taiwan.304.a_bonus: "海外工厂建设"
 taiwan.304.b: "施工前缩减项目规模"
 taiwan.304.d: "华盛顿方面已对富士康的提议作出回应。该公司现在必须决定，现有支持是否足以支撑其全面投入，或者是否应该在动工前缩减项目规模。"
 taiwan.304.t: "威斯康星承诺"
 taiwan.305.a: "一个任何单一冲击都无法摧毁的制造网络"
 taiwan.305.b: "电动汽车时代的供应商"
 taiwan.305.c: "一座围绕某款产品发布而建的工厂城市"
 taiwan.305.e: "幕后工厂，为其他所有品牌提供产品"
 taiwan.305.d: "完整的AI机架集成了电路板、加速器、电源、冷却系统、线缆以及严格的系统验证。四分之一世纪的规模扩张、危机应对和多元化发展已经决定了哪种类型的制造商能够胜任这项工作。"
 taiwan.305.t: "AI工厂"
 taiwan.310.t: "半导体崩溃期的12英寸"
 taiwan.310.d: "半导体行业的崩溃导致耗资数十亿美元建造的洁净室空置，晶圆厂闲置期间没有任何收益。300毫米晶圆的转型可以降低每片晶圆的成本，但这需要多年的设备研发、集成和耐心提升良率的工作。现在就投入生产，意味着要在一个已经停止采购的市场中生产。"
 taiwan.310.a: "在经济衰退期为300毫米冲坡提供资金"
 taiwan.310.a_bonus: "大型晶圆工艺集成"
 taiwan.310.b: "握紧现金，直到需求回升。"
 taiwan.310.b_bonus: "代工首要原则"
 taiwan.311.t: "没有背叛的蓝图"
 taiwan.311.d: "客户需要设计工具包、库、工具和资质数据才能按照我们的流程构建任何产品，而所有这些工具包、库、工具和资质数据都相互竞争。开放创新平台将为所有客户提供相同的资源，同时避免向任何客户泄露竞争对手的设计。信任是我们在此打造的核心产品。"
 taiwan.311.a: "发布工具包并开放平台"
 taiwan.311.a_bonus: "开放创新平台"
 taiwan.311.b: "保持与客户双边互动。"
 taiwan.311.b_bonus: "机密客户工程"
 taiwan.312.t: "移动锚点"
 taiwan.312.d: "一家手机制造商所需的尖端芯片产能就超过了我们大多数客户的总和，而且他们愿意提前数年付费预订。如此庞大的产能足以支撑下一代芯片的研发。这也将使代工厂的命运完全取决于一家公司的产品周期。"
 taiwan.312.a: "为主要客户预留领先产能"
 taiwan.312.a_bonus: "高容量移动工艺"
 taiwan.312.b: "坚持代工厂中立原则"
 taiwan.312.b_bonus: "中立容量分配"
 taiwan.313.t: "亚利桑那：保险的代价"
 taiwan.313.d: "华盛顿希望尖端晶圆在美国本土生产，并且愿意为此提供资金支持。但宣布消息并不等于建厂：在合格的晶圆生产完成之前，所有必要的设备、工程师、水源和客户都必须到位，而且每一项成本都比在美国高。这种“保险”是真实存在的，保费也是如此。"
 taiwan.313.a: "承诺与海外工厂合作"
 taiwan.313.a_bonus: "海外工厂资质"
 taiwan.313.b: "保持领先优势在岛上"
 taiwan.313.b_bonus: "集中团簇效率"
 taiwan.314.t: "芯片是瓶颈"
 taiwan.314.d: "汽车制造商、消费品牌和计算机用户都在竞相争夺并不存在的资源，而他们的政府已经开始自行决定分配方案。让政府来决定资源分配，将为关键国家的民众赢得相当大的好感。同时，这也会让每一位消费者明白，他们现在看不到的排队顺序，实际上决定了他们在队伍中的位置。"
 taiwan.314.a: "让国家直接分配"
 taiwan.314.a_bonus: "定向产业配置"
 taiwan.314.b: "保持分配商业性"
 taiwan.314.b_bonus: "商业分配原则"
 taiwan.315.t: "片上基板限制"
 taiwan.315.d: "晶圆不再是难题。加速器需要先进的封装、堆叠式存储器和基板才能发挥其价值，而这些技术的供应远远不足。构建这些产能将使晶圆代工厂规模更大，并使我们进入目前客户所处的行业。"
 taiwan.315.a: "将先进封装技术融入到业务中"
 taiwan.315.a_bonus: "先进封装能力"
 taiwan.315.b: "保持纯粹的晶圆制造工艺"
 taiwan.315.b_bonus: "关注纯粹的晶圆制造"
 taiwan.316.t: "我们建造的是哪种类型的代工厂？"
 taiwan.316.d: "二十五年来，随着经济节点、经济衰退、核心客户和海外开拓的不断涌现，该岛的实际生产内容以及生产目的地由谁决定已定。"
 taiwan.316.a: "政府指导的代工厂"
 taiwan.316.b: "一个值得信赖的盟友网络"
 taiwan.316.c: "一家系统代工厂，而不是晶圆厂"
 taiwan.316.e: "一家纯粹的代工厂，仅此而已。"
 TAI_tsmc_state_directed_foundry: "政府指导的代工厂"
 TAI_tsmc_state_directed_foundry_desc: "分配工作先由部委负责，然后才交到销售处，排队等候也是政策决定的。产能分配首先要考虑岛上的利益，其次才是顾客的利益，而顾客们也注意到了这一点。"
 TAI_tsmc_trusted_allied_foundry_network: "值得信赖的联合代工网络"
 TAI_tsmc_trusted_allied_foundry_network_desc: "亚利桑那州、熊本和德累斯顿都获得了参赛资格，因此领先优势不再局限于某个岛屿上的单一地点。虽然每片晶圆的成本高于在家集中生产，但它却能带来集中生产永远无法实现的优势。"
 TAI_tsmc_systems_foundry_platform: "系统代工平台"
 TAI_tsmc_systems_foundry_platform_desc: "晶圆、封装、堆叠式存储器和测试现在作为一个合格产品交付。代工厂出售的是最终的成品，而不是其下方的底层器件，而这原本就是制约因素转移的地方。"
 TAI_tsmc_disciplined_pure_play_foundry: "原则鲜明的纯粹代工厂"
 TAI_tsmc_disciplined_pure_play_foundry_desc: "我们不推出任何自有品牌，不生产任何自有产品，也不与我们的客户竞争。这种模式赖以成功的原则就是这种模式本身，我们始终坚持原则。"
 taiwan.320.t: "宏碁品牌与工厂分离"
 taiwan.320.d: "为其他公司代工电脑，同时又把自己的产品摆放在同样的货架上销售，这种利益冲突是客户会在发票上看到的。如果将生产环节拆分，就能让两家公司各自争取对方的业务，而另一家则会损失部分业务。但这样做也会让公司在刚刚发展壮大之际，陷入分裂。"
 taiwan.320.a: "将品牌从工厂中分离出来"
 taiwan.320.a_bonus: "合同制造分离"
 taiwan.320.b: "保留一家一体化制造商"
 taiwan.320.b_bonus: "集成系统制造"
 taiwan.321.t: "x86问题尘埃落定"
 taiwan.321.d: "多年来围绕指令集和芯片组的诉讼最终以交叉许可协议告终，而非法庭上的胜利。该协议确保了在现有厂商制定的条件下继续生产的权利。第三家x86厂商在法律上仍然可行，但在商业上却不太可能出现。"
 taiwan.321.a: "和解并确保获得许可证"
 taiwan.321.a_bonus: "交叉许可架构"
 taiwan.321.b: "坚持争取更好的条款"
 taiwan.321.b_bonus: "独立芯片组设计"
 taiwan.322.t: "玩家共和国"
 taiwan.322.d: "自行选择主板的组件买家愿意为那些外观出众的组件支付溢价。一条专属的高端产品线能够带来普通商品线无法企及的利润，但它也需要组件供应商从未涉足的市场营销、支持和设计领域。"
 taiwan.322.a: "打造高端品牌"
 taiwan.322.a_bonus: "高级系统品牌"
 taiwan.322.b: "继续做零部件供应商"
 taiwan.322.b_bonus: "商品组件规模"
 taiwan.323.t: "第二次分离"
 taiwan.323.d: "导致宏碁分离的同一冲突如今也困扰着它的竞争对手：如果工厂继续为竞争对手服务，品牌就无法发展壮大。剥离制造部门将打造全球最大的代工制造商之一，同时也意味着拱手让出了成就宏碁品牌的那家工厂。"
 taiwan.323.a: "将制造部门剥离出来"
 taiwan.323.a_bonus: "原始设计制造"
 taiwan.323.b: "保持品牌和工厂的统一性"
 taiwan.323.b_bonus: "垂直整合装配"
 taiwan.324.t: "人人都能拥有的小型电脑"
 taiwan.324.d: "廉价、轻便、动力不足的笔记本电脑已成为计算领域销售最快的类别，每个台湾制造商都可以在周末之前制造出一台。利润非常糟糕，而且数量巨大。这究竟是该行业的未来，还是一种让客户不抱任何期望的时尚，目前尚不清楚。"
 taiwan.324.a: "追逐移动转型"
 taiwan.324.a_bonus: "低成本移动平台"
 taiwan.324.b: "捍卫台式电脑利润"
 taiwan.324.b_bonus: "台式高性能系统"
 taiwan.325.t: "利润挤压"
 taiwan.325.d: "手机占据了销量，品牌占据了货架空间，岛上的手机制造商们为了争夺日益萎缩的市场所剩无几的份额而相互竞争。如果能从上而下地协调整个行业，就能阻止他们互相压价。这也意味着，需要通过一个部门来决定，哪些制造商有资格生存下去。"
 taiwan.325.a: "从上层协调行业发展"
 taiwan.325.a_bonus: "协调的产业政策"
 taiwan.325.b: "让市场自行整合吧。"
 taiwan.325.b_bonus: "竞争性整合"
 taiwan.326.t: "台湾计算机生态系统评估"
 taiwan.326.d: "经过四分之一世纪的分裂、分拆、高端品牌和价格战，该岛的计算机产业格局已经定型：谁的名字印在包装盒上，以及谁的工厂在背后运作。"
 taiwan.326.a: "一个完整的计算生态系统"
 taiwan.326.b: "品牌系统巨头"
 taiwan.326.c: "全球零部件共同体"
 taiwan.326.e: "利润空间被压缩，无人幸免。"
 TAI_pc_full_spectrum_computing_ecosystem: "全方位计算生态系统"
 TAI_pc_full_spectrum_computing_ecosystem_desc: "零部件、代工制造和成品品牌被整合到一个协调的产业链中，而不是各自为政。这个岛屿构建了计算机的每一层，并经过深思熟虑地做出选择。"
 TAI_pc_branded_systems_powerhouse: "品牌系统巨头"
 TAI_pc_branded_systems_powerhouse_desc: "包装盒上的品牌名称是台湾品牌，因此价格也更高，这是任何零部件供应商都无法企及的。品牌靠的是关注度，而关注度是租用的，而非拥有的。"
 TAI_pc_global_component_commonwealth: "全球零部件共同体"
 TAI_pc_global_component_commonwealth_desc: "几乎所有在售电脑都包含一些在这里生产的零件，只是贴上了别人的标签。产量惊人，利润则归贴牌者所有。"
 TAI_pc_fragmented_margin_squeeze: "碎片化利润挤压"
 TAI_pc_fragmented_margin_squeeze_desc: "太多实力雄厚的公司涌入同一个日益萎缩的市场，一路竞相压价。技术水平从未下降，价格也从未停止下跌。"
 USA_tsmc_access_modifier: "获得台积电的访问权限"
 USA_tsmc_access_modifier_desc: "美国产业受益于对台湾半导体生态系统的可靠准入。一旦台湾不复存在、失去对台北的控制权、与美国开战或限制半导体出口，这种收益将不复存在。"
 TAI_tsmc_trade_benefits_tier_1_tt: "台积电开发将为§Y台湾§!与§Y美国§!§Y每家工厂的资源§!§G+1§!。美国获得利益的前提是能够继续进入台湾。"
 TAI_tsmc_trade_benefits_tier_2_tt: "台积电开发将为§Y台湾§!与§Y美国§!§Y每家工厂的资源§!§G+2§!。美国获得利益的前提是能够继续进入台湾。"
 TAI_tsmc_trade_benefits_tier_3_tt: "台积电开发将为§Y台湾§!与§Y美国§!§Y每家工厂的资源§!§G+3§!。美国获得利益的前提是能够继续进入台湾。"