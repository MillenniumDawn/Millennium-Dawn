 battleship_hull_1: "Coque de cuirassé 1965"
 battleship_hull_1_desc: "Les navires de surface constituent la principale composante de la flotte et assurent toutes les fonctions maritimes de la flotte traditionnelle."
 battle_cruiser_hull_1: "Coque du croiseur de bataille de 1965"
 battle_cruiser_hull_1_desc: "Les navires de surface constituent la principale composante de la flotte et assurent toutes les fonctions maritimes de la flotte traditionnelle."
