 PHI.conservatism: "£PHI_conservatism (Lakas)基督教穆斯林民主力量党"
 PHI.conservatism_desc: "基督教民主主义 - 基督教穆斯林民主力量党是一个以基督教和伊斯兰民主原则为基础的中间偏右政党。自成立以来，该党一直倡导自由市场经济增长、政治稳定以及与美国的密切合作。基督教穆斯林民主力量党的独特之处还在于其联盟中吸纳了穆斯林政治领袖，并始终支持宪法改革，包括将菲律宾从总统制过渡到议会制的提议。\n"
 PHI.liberalism: "£PHI_liberalism (LP) 自由党"
 PHI.liberalism_desc: "自由主义 - 菲律宾自由党\n\n它是菲律宾历史最悠久的政党之一，由曼努埃尔·罗哈斯总统于1946年从国民党分裂出来后创立。该党倡导“自由、正义和团结（巴亚尼汉）”的原则，支持自由民主制度，历来倾向于与美国保持紧密关系，同时对中国日益增长的影响力持谨慎态度。\n"
 PHI.socialism: "£PHI_socialism (ACAP) 阿克巴扬公民行动党"
 PHI.socialism_desc: "民主社会主义 - 阿克巴扬公民行动党是一个民主社会主义进步政党，由劳工组织、公民团体和左翼组织联盟创立。作为菲律宾领先的民主左翼政党之一，阿克巴扬倡导参与式民主、社会正义、劳工权益、环境保护和包容性经济发展，同时反对共产主义叛乱和右翼威权主义。\n"
 PHI.anarchist_communism: "£PHI_anarchist_communism (PDP-Laban) 菲律宾民主党"
 PHI.anarchist_communism_2000_desc: "民主改革主义 - 菲律宾民主党\n\n该党以民主社会主义、菲律宾民族主义和参与式民主的原则为基础。在自由、团结、正义、公平、社会责任、自力更生、效率和开明民族主义的理想指导下，该党日益吸引着对传统政治体制不满的选民的支持。\n"
 PHI.anarchist_communism_2017_desc: "左翼激进派 - 菲律宾民主党\n\n该党追求和平民主的生活方式，其特点是“自由、团结、正义、公平、社会责任、自力更生、效率和开明的民族主义”。近年来，该党被视为菲律宾民族主义政党，并在杜特尔特政权统治下日益专制。"
 PHI.Caliphate: "£generic_Caliphate_small (AS) 阿布沙耶夫"
 PHI.Caliphate_desc: "萨拉菲圣战派 - 阿布沙耶夫是一个极端主义的圣战激进海盗组织，遵循逊尼派伊斯兰教的瓦哈比教义。该党主要位于菲律宾南部，与摩洛叛乱组织关系密切。它仍然难以捉摸，而且对非穆斯林和菲律宾政府特别暴力。"
 PHI.Neutral_conservatism: "£PHI_Neutral_conservatism (LDP) 菲律宾民主斗争"
 PHI.Neutral_conservatism_desc: "中立保守主义派 -  菲律宾民主斗争\n\n这是一个保守党派，主张推行包括减税等在内的多项政策，以维护菲律宾的现状。该党的纲领可概括为经济自由主义和社会保守主义。他们高度重视菲律宾的家庭单元，反对离婚、堕胎以及其他更符合基督教原教旨主义价值观的社会政策。"
 PHI.oligarchism: "£PHI_oligarchism (NUP) 国家统合党"
 PHI.oligarchism_desc: "寡头主义派 - 国家统合党\n\n它是从基督教穆斯林民主力量党分裂出来的一个意识形态政党。这个以基督教为中心的政党寻求让国家走上敬畏上帝、菲律宾人民主权的道路。与它的母党基督教穆斯林民主力量党不同，民族团结党更加自由，更注重进步主义。然而，国家统合党仍然保留着其对菲律宾穆斯林和其他少数宗教信仰的反动政策。"
 PHI.Neutral_Libertarian: "£PHI_neutral_libertarian (NPC) 民族主义人民联盟"
 PHI.Neutral_Libertarian_desc: "社会保守主义 - 民族主义人民联盟\n\n是一个保守的包容性政党，由小爱德华多·“丹丁”·科胡昂科于1992年创立。该党以其强大的省级网络和联盟政治而闻名，强调政治稳定、经济发展和务实的治理，而不是严格的意识形态一致性。\n"
 PHI.Neutral_Communism: "£PHI_Neutral_Communism (PRP) 人民改革党"
 PHI.Neutral_Communism_desc: "改革主义 - 人民改革党是菲律宾国内的一支改革力量，致力于改革现有体制。其创始人曾主导1989年的土地改革，将农田重新分配给农民。然而，除了创始人得以继续担任菲律宾参议员之外，改革党在政治上的表现并不理想。"
 PHI.neutral_Social: "£PHI_neutral_social (AD) 民主行动党"
 PHI.neutral_Social_desc: "进步主义 - 民主行动党\n\n这是一个进步的、改革导向的政党，倡导权力下放、区域赋权和问责制治理。该党认为，地方政府最能应对区域挑战，同时支持教育改革、环境保护和可持续经济增长。\n"
 PHI.Neutral_Autocracy: "£PHI_neutral_autocracy (PMP) 菲律宾人民力量"
 PHI.Neutral_Autocracy_desc: "民粹主义 - 菲律宾人民力量是由约瑟夫·埃斯特拉达创立的民粹主义政党，该党以吸引大众和倡导福利的民粹主义为核心，并于1998年将埃斯特拉达推上了总统宝座。然而，在其执政期间，该党却日益与裙带政治、腐败指控和威权主义倾向联系在一起。\n"
 PHI.Neutral_Muslim_Brotherhood: "£muslim_brotherhood_small 马拉德卡"
 PHI.Neutral_Muslim_Brotherhood_desc: "中立伊斯兰教 - 马拉德卡是菲律宾穆斯林兄弟会的一个分支。它相对较小，但在菲律宾南部棉兰老省的地方选举中发挥了突出作用。\n"
 PHI.Nat_Populism: "£PHI_Nat_Populism (NP) 国民党"
 PHI.Nat_Populism_desc: "菲律宾民族主义 - 国民党是菲律宾历史最悠久的政党。该党起源于争取独立的斗争，如今已发展成为一个保守的民族主义运动，强调传统价值观、国家主权、经济发展以及一个强大而务实的国家。它通常与自由主义和进步主义改革运动持对立立场。\n"
 PHI.Nat_Autocracy: "£PHI_Nat_Autocracy (AFP) 菲律宾武装力量"
 PHI.Nat_Autocracy_desc: "军政府 - 菲律宾武装部队\n\n菲律宾武装部队的历史可以追溯到1935年颁布的《国防法》，该法是在菲律宾联邦时期，由道格拉斯·麦克阿瑟将军指导制定的，麦克阿瑟将军后来成为菲律宾第一位陆军元帅。自1946年菲律宾独立以来，菲律宾武装部队一直是该国的主要军事机构，负责捍卫国家主权、打击叛乱以及在危机时期支持民事当局。\n"
 PHI.Nat_Fascism: "£PHI_nat_fascism (MPP) 国家法西斯党"
 PHI.Nat_Fascism_desc: "民族改革主义 - 国家法西斯党起源于参与2003年奥克伍德兵变的一群改革派军官，是菲律宾政坛一股民族主义和反腐败力量。尽管缺乏大规模的选举力量，但它在军方和民众中具有改革意识的群体中保持着影响力。在政治动荡时期，该运动可以成为一股推动体制改革、问责制和国家复兴的决定性力量。\n"
