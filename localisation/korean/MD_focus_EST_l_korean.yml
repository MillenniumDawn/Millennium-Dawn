l_korean:
 EST_focus_tree: "에스토니아 중점 계통도"
 EST_estonias_future: "에스토니아의 미래"
 EST_estonias_future_desc: "우리 국가의 미래는 우리 앞에 놓여 빚어지기를 기다리고 있습니다. 이제 에스토니아를 우리가 그리는 나라로 만들어 갈 때입니다."
 EST_looking_to_the_west: "에스토니아의 민주주의"
 EST_looking_to_the_west_desc: "에스토니아는 소련 붕괴 이후 젊은 민주주의 국가로 출범했습니다. 그 이후 우리는 일관되게 서구 자유민주주의와 보조를 맞춰 왔으며, 우리 정당들도 대체로 서구 전반에서 나타나는 이념적 흐름을 따르고 있습니다."
 EST_isamaa: "이사마당 (Isamaa)"
 EST_isamaa_desc: "직역하면 '조국'을 뜻하는 이사마는 에스토니아에서 중도우파에서 우파 이념을 옹호하는 기독교 민주주의 정당입니다."
 EST_re: "ER"
 EST_re_desc: "1994년에 창당된 에스토니아 개혁당은 우리의 최대 정당으로 의회에서 가장 많은 의석을 보유하고 있습니다. 이 중도우파 정당은 자유주의적 경제 정책에 중점을 두며 나토와 EU 가입을 강력히 지지합니다. 이들의 의제에는 감세, 민영화 확대, 기업가 정신 장려가 포함됩니다."
 EST_neutral_desc: ""
 EST_armed_forces: "에스토니아 국방군"
 EST_armed_forces_desc: "모든 군 병과를 아우르는 에스토니아 국방군은 우리의 독립, 주권, 헌법 질서의 수호자입니다. 21세기에도 효과를 유지하려면 우리 군에 새로운 관심과 자원이 필요합니다."
 EST_ekre: "EKRE"
 EST_ekre_desc: "중대한 정치적 변화로, EKRE가 선거를 통해 권력을 장악했습니다. 에스토니아 애국자들에게 이는 역사적 승리이며, 우리의 이상이 더 이상 외세의 영향에 구속받지 않게 되었습니다."
 EST_above_all: "무엇보다 에스토니아!"
 EST_above_all_desc: "우리 국민은 에스토니아의 이익이 개인의 필요에 우선한다는 점을 이해해야 합니다. 어떤 상황에서도 우리나라가 항상 최우선이어야 합니다."
 EST_we_are_estonians: "우리는 에스토니아인이다!"
 EST_we_are_estonians_desc: "다른 이들이 우리 역사나 문화에 대해 무엇이라 말하든, 우리는 자랑스러운 에스토니아인으로 남을 것입니다! 러시아인도, 독일인도, 핀란드인도 아닌, 우리를 구별 짓는 고유한 정체성을 지니고 있습니다!"
 EST_on_world_stage: "세계 무대 위의 에스토니아"
 EST_on_world_stage_desc: "에스토니아가 세계 정세에서 중요한 행위자로 자리매김할 때가 왔습니다. 우리는 더 이상 유럽의 거대한 게임에서 부차적인 국가로 취급받는 것을 받아들이지 않을 것입니다."
 EST_nato_friends: "우리의 나토 친구들"
 EST_nato_friends_desc: "우리는 나토를 안보 체계의 초석으로 인정하며, 세계 평화와 안정을 유지하기 위해 동맹과 협력하는 데 전념합니다."
 EST_opposing_western_values: "서구적 가치 배격"
 EST_opposing_western_values_desc: "서구적 가치는 순수한 에스토니아 문화를 타락시키고 있으며, 우리는 그 수호자로서 행동해야 합니다. 이러한 외래의 '원칙'을 배격하고 전통적 가치를 받아들임으로써, 진정성을 중시하는 이들로부터 더 큰 존중을 얻고 국가적 결의를 강화할 것입니다."
 EST_europe_of_a_sick_man: "병든 자의 유럽"
 EST_europe_of_a_sick_man_desc: "우리는 유럽이 세계의 병자가 되었다는 현실을 직시해야 합니다. 통제되지 않은 이민과 경기 침체가 우리의 사랑하는 대륙을 약화시켰지만, 이러한 쇠퇴에서 생겨나는 기회를 포착해야 합니다."
 EST_military_cooperation: "동맹국과의 군사 협력"
 EST_military_cooperation_desc: "분명히 합시다. 나토는 우리 안보에 필수적입니다. 합동 훈련을 늘리면 참여하는 모든 국가에 이익이 될 것입니다."
 EST_opposing_foreign_influence: "외세의 영향 배격"
 EST_opposing_foreign_influence_desc: "에스토니아는 스스로의 길을 개척해야 합니다. 비록 작은 나라이지만, 우리는 외부의 간섭 없이 스스로 결정을 내릴 수 있는 자랑스러운 국가입니다."
 EST_opposing_centralisation: "중앙집권화 반대"
 EST_opposing_centralisation_desc: "우리는 중앙집권화를 거부합니다! 에스토니아는 스스로 앞길을 개척할 것입니다. 우리에게 타인의 감독은 필요 없으며, 우리 자신의 힘으로 세계 무대에서 성공할 것입니다!"
 EST_deporting_arab_immigrants: "아랍계 이민자 추방"
 EST_deporting_arab_immigrants_desc: "이 이민자들은 외래의 신념을 우리 국민에게 퍼뜨림으로써 우리나라와 문화에 중대한 안보 위험이 됩니다. 너무 늦기 전에 단호하게 행동해야 합니다."
 EST_questioning_eu: "EU에 대한 의문 제기"
 EST_questioning_eu_desc: "EU는 본래의 목적에서 크게 벗어났습니다. 인권과 자유를 수호하기 위한 기구로 시작되었으나, 이제는 우리의 민족 정체성을 짓밟고 우리를 외세의 꼭두각시로 전락시킬 위험이 있는 기업 이익의 도구로 변질되었습니다. 우리가 왜 이 부패한 동맹을 계속 용인하는지 의문을 제기해야 합니다."
 EST_full_nato_cooperation: "나토와의 전면 협력"
 EST_full_nato_cooperation_desc: "나토는 우리의 자유와 권리의 수호자이며, 문명 세계와 러시아 및 중국에서 보는 독재 정권들 사이의 유일한 장벽입니다. 우리는 가능한 모든 방식으로 동맹과의 협력을 극대화해야 합니다."
 EST_defend_our_home: "우리 집을 지키자"
 EST_defend_our_home_desc: "침략자가 우리 땅을 약탈하고 우리나라를 파괴하려 위협할 때, 우리는 가진 모든 것으로 싸울 준비가 되어 있어야 합니다. 모든 병사와 민병은 자신이 조국과 가족을 지키기 위해 싸우고 있음을 기억해야 하며, 모든 문 앞이 요새가 되어야 합니다."
 EST_compulsory_military_service: "의무 병역법"
 EST_compulsory_military_service_desc: "인기는 없지만, 리이기코구는 국방의 이름으로 의무 병역법을 통과시켰습니다. 이제부터 18세에서 27세 사이의 신체 건강한 에스토니아 남성은 모두 최소 6개월의 병역을 마쳐야 하며, 이후 군의 예비군으로 복무하게 됩니다."
 EST_purchase_foreign_tanks: "외국산 전차 구매"
 EST_purchase_foreign_tanks_desc: "전차는 모든 현대 군대에 필수적인 자산이며, 우리 군에게는 심각한 능력 공백을 의미합니다. 우리는 이러한 필수 무기 체계를 확보하기 위해 동맹국에 눈을 돌릴 것입니다."
 EST_fortify_borders: "국경 요새화"
 EST_fortify_borders_desc: "러시아는 우리를 향한 공격성을 갈수록 노골적으로 드러내고 있으며, 적대 행위를 준비하고 있다는 징후가 보입니다. 재앙을 막으려면 즉시 국경 방어를 강화해야 합니다."
 EST_friend_of_my_friend: "내 친구의 친구는..."
 EST_friend_of_my_friend_desc: "오랜 격언은 삶에서와 마찬가지로 외교에서도 통합니다. '내 친구의 친구는 내 친구다. 내 적의 친구는 내 적이다. 내 친구의 적은 내 적이다. 내 적의 적은 내 친구다.'"
 EST_poking_the_bear: "곰 건드리기"
 EST_poking_the_bear_desc: "곰은 죽어 쓰러지고 나면 두려움의 대상이 되지 못합니다. 우리가 사냥꾼이 될 것이며, 곰은 우리 앞에서 무력해질 것입니다."
 EST_strengthening_territorial_claims: "영토 영유권 강화"
 EST_strengthening_territorial_claims_desc: "60년이 넘도록 러시아는 정당한 에스토니아 영토를 불법으로 점령해 왔습니다. 그들에게 도전하려면 먼저 이 땅들에 대한 우리의 정당한 영유권을 공고히 해야 합니다."
 EST_purging_country_traitors: "국가 반역자 숙청"
 EST_purging_country_traitors_desc: "에스토니아의 자유와 안보를 지키려면, 우리의 발전을 적극적으로 훼손하는 외국 첩자를 뿌리 뽑아야 합니다. 아주 사소한 반역 행위라도 신속하고 단호하게 대처해야 합니다."
 EST_preparing_for_inevitable: "불가피한 사태에 대비"
 EST_preparing_for_inevitable_desc: "전쟁이 다시 한번 지평선 위에 다가오고 있습니다. 다가오는 분쟁에 대비하기 위해 가능한 모든 조치를 취해야 합니다."
 EST_petting_the_bear: "곰 쓰다듬기"
 EST_petting_the_bear_desc: "러시아는 유럽에서의 영향력에서 견줄 상대가 없는 막강한 세계 강국으로 남아 있습니다. 화해가 더 유망한 길을 제시하는데 굳이 이런 세력을 적으로 만들 이유가 있겠습니까?"
 EST_warm_up_with_russia_nat: "러시아와의 관계 개선"
 EST_warm_up_with_russia_nat_desc: "러시아와의 복잡한 역사를 뒤로하고 함께 새로운 협력의 시대로 나아갈 때가 왔습니다."
 EST_finland_model: "핀란드식 협상 모델"
 EST_finland_model_desc: "핀란드는 강한 입장에서 중립을 성공적으로 협상해 냈고 국제 협상에서 영향력을 유지했습니다. 이제 그들은 경제 강국으로 자리하고 있습니다. 그들의 외교적 접근은 우리 협상의 훌륭한 본보기가 됩니다."
 EST_question_russian_sanctions: "제재에 대한 의문 제기"
 EST_question_russian_sanctions_desc: "제재는 효과가 없음이 입증되었습니다. 러시아의 사례에서 분명히 드러나듯 정부의 힘을 약화시키지는 못하면서 평범한 시민들에게 피해를 줍니다. 평범한 사람들만 해치는 이러한 정당하지 않은 조치를 우리가 왜 지지해야 합니까?"
 EST_work_together_rus: "더 밝은 미래를 위한 협력"
 EST_work_together_rus_desc: "러시아와의 협력에서 어떤 해악이 생길 수 있겠습니까? 동반자 관계는 양국 모두에게 새로운 기회를 열어 줄 수 있습니다."
 EST_declaration_bauskha: "바우스카 선언"
 EST_declaration_bauskha_desc: "우리는 발트 지역의 다른 민족주의 정당들에게 바우스카에서 회동하여, 러시아의 영향력에 맞서고 공동 목표를 달성하기 위한 긴밀한 협력 협정에 서명하자고 제안했습니다."
 EST_support_euromaidan: "유로마이단 참가자 지원"
 EST_support_euromaidan_desc: "우크라이나 국민이 자국 정부의 잘못된 방향에 항의하는 것은 정당합니다. 우리는 그들의 대의에 대한 전적인 지지를 선언해야 합니다."
 EST_connection_with_christian_parties_eu: "기독교 연대"
 EST_connection_with_christian_parties_eu_desc: "유럽 전역의 다른 기독교 정당들과 더욱 긴밀한 유대를 쌓음으로써, 우리는 강력한 기독교 국가로서의 에스토니아의 정체성을 강화하는 동시에 앞으로 오랫동안 소중한 외교 파트너로 자리매김할 수 있습니다."
 EST_christian_alliance: "기독교 동맹"
 EST_christian_alliance_desc: "우리가 실천에서 엄격하게 기독교적이지는 않을지라도, 공통의 기독교적 가치에 기반한 동맹은 우리의 이익에 크게 도움이 될 수 있습니다."
 EST_looking_into_scandinavia: "스칸디나비아로 눈을 돌리다"
 EST_looking_into_scandinavia_desc: "그들은 인정하기를 꺼릴지 모르나, 우리는 스칸디나비아 국가들과 형제적 유대를 공유하고 있습니다. 외교적 이점과 수익성 높은 무역 기회를 위해 그들과 더 따뜻한 관계를 추구해야 합니다. 바다 건너 형제들과 공통점을 찾음으로써 우리는 함께 더 강한 미래를 건설할 수 있습니다."
 EST_strengthen_baltic_trade: "무역 강화"
 EST_strengthen_baltic_trade_desc: "공공 기반시설에 투자하고 새로운 협정을 체결함으로써 우리의 소득과 무역 산출을 늘릴 수 있습니다."
 EST_healthcare_reform_nat: "의료 제도 개혁"
 EST_healthcare_reform_nat_desc: "우리는 국민의 필요를 충족하는 보다 효율적이고 효과적인 제도를 만들기 위해 의료 제도를 개혁할 것입니다."
 EST_ban_abortion: "낙태 금지"
 EST_ban_abortion_desc: "낙태가 살인이며 우리나라에 아무런 이익도 가져오지 않는다는 것은 비밀이 아닙니다. 출산율이 개선되고 우리 국가가 계속 성장하려면, 사람들이 감히 '권리'라고 부르는 이 장애를 끝내야 합니다."
 EST_prohibition_law: "금주법"
 EST_prohibition_law_desc: "술은 위장한 악마이며, 술에 취한 싸움과 폭력을 불러들여 평범한 가정을 불안정하게 만드는 배우와 같습니다. 금주는 이 질병이 퍼지는 것을 막을 유일한 방법입니다."
 EST_free_dental_care: "밝은 에스토니아를 위한 무상 치과 진료!"
 EST_free_dental_care_desc: "우리는 소득과 관계없이 모든 주민에게 무상 치과 진료를 제공하기 시작하여, 이 정책이 국민의 구강 건강을 개선하기를 기대합니다. 이제부터 모든 에스토니아 치과 의사는 18세 미만 환자에게 무상 진료를 제공해야 하며, 그 비용은 국가 보험이 부담합니다."
 EST_estonian_values: "변치 않는 에스토니아의 가치"
 EST_estonian_values_desc: "우리의 가치, 우리의 자유, 우리의 국가!"
 EST_market_public_interests: "새로운 공공 시장"
 EST_market_public_interests_desc: "공공 시장은 오랫동안 서민의 등골을 빼 더 부유해지려고만 하는 대기업의 이익에 봉사해 왔습니다. 더 이상 그런 행태를 용인하지 않을 것이며, 시장이 오직 공익에만 봉사하도록 규제할 때입니다."
 EST_nat_public_bank: "국립 공공 은행 설립"
 EST_nat_public_bank_desc: "국가는 은행 부문에서 더 큰 역할을 해야 하며, 공공 은행을 설립하는 것보다 더 좋은 방법이 있겠습니까? 이 분야에서 영향력을 높임으로써 우리는 올바른 경제 발전과 국민을 위한 더 나은 기준을 보장할 수 있습니다."
 EST_education_reform_nat: "교육 제도 개혁"
 EST_education_reform_nat_desc: "우리는 교육 제도를 밑바닥부터 개혁할 것입니다. 길고 고통스러운 개혁이 되겠지만, 교육 제도를 더 효율적으로 만들고 중도 탈락자를 줄이며 교육의 질을 향상시킬 것입니다."
 EST_sinine_aratus: "시니네 아라투스"
 EST_sinine_aratus_desc: "우리의 민족 정체성이 세월을 넘어 살아남으려면 아이들이 자국과 전통을 사랑하는 법을 배우는 것이 중요합니다. 우리는 이러한 이상을 보존하고 민족주의의 부활을 가져오며 에스토니아의 새로운 민족적 각성에 불을 붙일 청소년 조직을 설립할 것입니다!"
 EST_ban_rus_language: "러시아어 금지"
 EST_ban_rus_language_desc: "우리가 두려워하는 외국 압제자가 쓰는 언어와 같은 러시아어의 사용과 교육을 금지하는 것은 지극히 당연한 결정입니다. 러시아어를 쓰는 사람들은 원하는 만큼 항의할 수 있지만, 우리의 방향은 아무것도 바꾸지 못할 것입니다."
 EST_countryside_schools: "농촌 학교 개설"
 EST_countryside_schools_desc: "농촌의 문맹은 우리나라가 재건된 이래 계속 괴롭혀 온 문제이며, 이를 해결하는 여러 방법 중 하나는 교육 접근성을 높이는 것입니다. 농촌 지역에 학교를 여는 것은 우리가 겪고 있는 교육 위기를 완화하고 또 한 세대의 미래를 보장하는 데 도움이 될 것입니다."
 EST_teacher_wages: "교사 임금 인상"
 EST_teacher_wages_desc: "교사에게는 더 나은 임금이 필요합니다. 그렇지 않다면 학생들이 어떻게 제대로 된 교육을 받겠습니까?"
 EST_professional_army: "전문화 추진"
 EST_professional_army_desc: "우리 군의 준군사 조직인 에스토니아 방위연맹은 시대에 뒤떨어진 조치로, 현대 21세기 군대에는 설 자리가 없습니다. 상비군이 에스토니아 방위연맹에 들어가는 예산을 받는다면 외국 침략자를 막아 내기에 충분하고도 남을 것입니다."
 EST_military_status_quo: "평소대로"
 EST_military_status_quo_desc: "속담에도 있듯이... '고장 나지 않았다면 고치지 마라.' 현재의 조직에는 심각한 문제가 없으므로 변화할 실질적인 이유가 없습니다. 이를 모두 고려할 때, 침공 시 소집할 수 있는 에스토니아 방위연맹 같은 준군사 예비 조직을 갖추는 것에는 언제나 이점이 있습니다."
 EST_estonian_defence_league: "준군사 예비 조직 우선"
 EST_estonian_defence_league_desc: "현대 군대는 값비싸고 국내 분쟁이 아닌 국제 분쟁의 부속물일 뿐임이 입증되었습니다. 국가의 목표가 진정으로 분쟁을 끝내는 것이라면, 먼저 우리가 무기를 내려놓는 것이 논리적입니다."
 EST_armored_focus: "기갑 중시"
 EST_armored_focus_desc: "전문적이고 유능한 군대에는 전장의 병력 이상의 것이 필요합니다. 현재 우리의 전차 부대는 낡았고 규모도 바람직하지 않습니다. 이를 바로잡을 때입니다."
 EST_looking_to_russia: "러시아로 눈을 돌리다"
 EST_looking_to_russia_desc: "그들이 과거 우리의 압제자였지만, 과거의 사건이 현재의 정책을 좌우하게 둘 수는 없습니다. 러시아와의 재편을 모색하는 것은 우리의 생존에 필수적입니다."
 EST_center_party: "중도당 (The Center Party)"
 EST_center_party_desc: "중앙당이 선거에서 승리하여 이제 리이기코구에서 자신들의 의제를 밀어붙일 만큼 여유로운 과반수를 차지하고 있습니다."
 EST_left_faction: "좌파 파벌"
 EST_left_faction_desc: "좌파 파벌과 그들의 사회자유주의 정책이 권력을 둘러싼 정치 싸움에서 우위를 점하여, 당과 리이기코구 양쪽에 대한 장악력을 확보했습니다."
 EST_soc_lib_policies: "사회자유주의 정책"
 EST_soc_lib_policies_desc: "우리는 사회자유주의 정책을 추구할 것이며, 궁극적인 목표는 모든 개인이 신분에 관계없이 충분한 기회 속에서 자신의 삶을 자유롭게 살 수 있는 사회를 만드는 것입니다."
 EST_promote_women_rights: "여성 권리 증진"
 EST_promote_women_rights_desc: "유연 근무제와 동일 임금 및 기회에 대한 강력한 강조 같은 정책을 도입함으로써 노동 인구 내 여성의 수를 늘리고 더 많은 여성이 지도적 역할을 맡도록 장려할 수 있습니다."
 EST_align_with_left_parties: "좌익 정당과의 연대"
 EST_align_with_left_parties_desc: "좌익 정당들은 자신들이 무엇을 하는지 알고 있으므로, 그들과 가까워지는 것이 최선일 것입니다."
 EST_progressive_taxation: "누진세 제정"
 EST_progressive_taxation_desc: "우리는 소득 수준에 따라 개인에게 서로 다른 세율을 부과하는 누진세 제도를 제정했습니다. 이 누진세 제도는 저소득 및 중산층 개인이 세금을 납부하기 쉽게 하면서, 소득이 높은 이들이 국가 세수 기반에 더 많이 기여하도록 보장할 것입니다."
 EST_oppose_monopolies: "독점 반대"
 EST_oppose_monopolies_desc: "우리는 독점에 대한 반대를 공개적으로 표명해야 하며, 발견할 수 있는 모든 독점 사례를 해체하기 위해 필요한 모든 조치를 취해야 합니다."
 EST_closer_ties_with_east: "동방과의 긴밀한 유대 구축"
 EST_closer_ties_with_east_desc: "우리 문제의 해답이 바로 눈앞에, 곧 러시아와 중국이라는 강대국에 있는데 서쪽만 바라보는 것은 헛된 일입니다."
 EST_promote_euroscepticism: "유럽 회의론 확산"
 EST_promote_euroscepticism_desc: "진실을 직시합시다. EU는 비민주적이며 책임을 지지 않습니다. EU는 너무 강력해졌고 일반 시민의 삶에 지나치게 간섭하는 괴물이 되었습니다."
 EST_empower_rus_minorities: "러시아계 소수 민족에게 권한 부여"
 EST_empower_rus_minorities_desc: "다른 이들은 반역이라고 하겠지만, 우리에게는 그저 영속적인 문제를 해결하는 일입니다. 의회와 정부 기관에서 그들이 누리는 대표성을 높임으로써 우리 두 주요 민족 사이의 긴장을 완화할 수 있습니다."
 EST_corruption_blind_eye: "부패를 눈감아 주기"
 EST_corruption_blind_eye_desc: "부패는 문제이지만, 그냥 가담하면 될 일을 굳이 맞서 싸울 이유가 있겠습니까? 이러한 관행을 눈감아 주면 이점이 많으며, 무엇보다 더 중요한 다른 문제에 집중할 수 있습니다."
 EST_right_faction: "우파 파벌"
 EST_right_faction_desc: "우파 파벌과 그들의 사회보수주의 정책이 권력을 둘러싼 정치 싸움에서 우위를 점하여, 당과 리이기코구 양쪽에 대한 장악력을 확보했습니다."
 EST_promote_soc_conservatism: "사회보수주의 증진"
 EST_promote_soc_conservatism_desc: "우리는 전통적 가치의 틀 안에서 개인적, 경제적 자유가 극대화될 때 사회가 가장 잘 다스려진다고 믿습니다. 따라서 시민의 삶에 대한 제한적인 정부 개입과 자유 시장 경제를 선호하기 시작할 것입니다."
 EST_oppose_homosexuality: "동성애 반대"
 EST_oppose_homosexuality_desc: "동성애는 부자연스러우며 존재의 이치에 어긋납니다. 이를 노골적으로 범죄화하고 싶은 유혹이 있지만, 적어도 지금은 지나친 조치입니다. 대신 우리는 동성 결합을 인정하지 않고 동성 부부에게 어떤 혜택도 제공하지 않음으로써 조용히 동성애를 억제하는 방식으로 대응할 것입니다."
 EST_promote_mixed_economy: "혼합 경제 증진"
 EST_promote_mixed_economy_desc: "우리는 경제의 존속을 단지 목재에만 의존할 수 없습니다. IT 부문과 산업을 지원함으로써 경제를 다변화해야 합니다."
 EST_strengthen_est_middle_class: "에스토니아 중산층 강화"
 EST_strengthen_est_middle_class_desc: "우리나라 경제는 최근 몇 년간 빠르게 성장했으며, 그 결과 중산층으로 간주되는 사람들의 수가 늘어났습니다. 튼튼한 중산층은 건강한 경제에 필수적이므로 이는 긍정적인 발전입니다. 우리는 중산층이 더욱 성장하도록 돕는 정책을 마련하기 위해 노력할 것입니다. 여기에는 일자리 창출, 더 나은 교육과 훈련의 제공, 신용 접근성 확대가 포함됩니다."
 EST_allign_with_right_parties: "우익 정당과의 연대"
 EST_allign_with_right_parties_desc: "유럽의 다른 우익 정당들은 그 성공이 비할 데 없으니 따를 만한 본보기입니다. 이러한 운동과 보조를 맞추는 것이 도움이 될 수 있습니다."
 EST_sde: "SDE"
 EST_sde_desc: "사회민주당이 선거에서 승리하여 새 정부를 구성하도록 위임받았습니다."
 EST_home_problems: "주택 계획"
 EST_home_problems_desc: "이 주택 계획은 에스토니아의 자격 있는 주민에게 저렴한 주택 선택지를 제공할 것입니다. 아파트, 타운하우스, 단독 주택 등 다양한 주거 형태를 제공할 것입니다."
 EST_socdem_best: "사회 정책"
 EST_socdem_best_desc: "우리나라의 사회 정책을 개혁하고 확대함으로써 국민의 복지를 높일 수 있습니다."
 EST_labour_paradise: "노동조합 보호"
 EST_labour_paradise_desc: "노동조합은 우리나라 전역의 노동자 권리를 보호하며, 우리는 이를 보호하는 데 전념해야 합니다. 새 법은 노동조합을 결성하고 가입할 권리를 보장하고, 단체 교섭의 자유와 더불어 정부나 정치의 간섭으로부터의 독립도 규정합니다."
 EST_workers_support: "어려움에 처한 노동자 지원"
 EST_workers_support_desc: "노동자에 대한 지원은 우리나라를 더욱 번영하게 만드는 데 필수적입니다."
 EST_min_wage: "최저 임금 인상"
 EST_min_wage_desc: "우리는 생활비를 따라가고 더 많은 노동자를 나라로 끌어들이기 위해 최저 임금을 인상할 것입니다."
 EST_ngo_support: "비정부 기구 지원"
 EST_ngo_support_desc: "NGO는 사회의 중요한 일부이며, 그들이 제대로 기능하도록 지원하기 위해 무엇이든 해야 합니다."
 EST_expand_welfare: "사회 복지 국가 확대"
 EST_expand_welfare_desc: "우리는 보건, 교육, 주택에 대한 지출을 늘리고, 평범한 에스토니아 국민의 삶의 질을 향상시키기 위해 실업자, 한부모, 장애인을 돕는 새로운 조치도 도입할 것입니다."
 EST_invite_investors: "외국 투자자 유치"
 EST_invite_investors_desc: "국내 투자자들과 마찬가지로 외국 투자자들 역시 우리 경제 발전에 필수적이며, 우리는 그들이 우리의 작은 나라에 사업을 시작하도록 유치하기 위해 해야 할 모든 것을 할 것입니다."
 EST_guarantee_youth: "청년 보장"
 EST_guarantee_youth_desc: "우리는 다가올 시대에 우리나라가 좋은 손에 맡겨지도록 해야 하며, 교육과 혁신에 대한 우리의 헌신을 통해 청년들에게 밝은 미래를 보장할 수 있습니다."
 EST_little_man: "소시민 지원"
 EST_little_man_desc: "소시민이란 작은 사업을 하거나 농업에 종사하거나 그 어느 쪽도 아닌 평범한 시민입니다. 그는 아무리 작고 미미하더라도 우리나라를 움직이는 데 필수적인 역할을 하므로, 우리는 가능한 모든 수단으로 그를 돕고 보호해야 합니다."
 EST_free_education: "무상 고등 교육"
 EST_free_education_desc: "교육 개혁을 위한 결단으로, 우리는 재정 상황에 관계없이 모든 학생에게 무상 고등 교육을 제공하는 포괄적 정책을 시행할 것입니다. 이는 학문적 진보의 기회 평등을 보장하고 우리 국가의 지적 자본을 강화합니다."
 EST_support_families: "청년 가정 지원"
 EST_support_families_desc: "청년 가정은 경제적 어려움에 특히 취약합니다. 우리는 가정을 이룬 청년들이 재정적 어려움을 이겨 내고 안정적인 가계 환경을 유지하도록 돕는 포괄적인 지원 체계와 안전망을 마련할 것입니다."
 EST_alcho_tax: "주류세"
 EST_alcho_tax_desc: "알코올은 건강 문제의 주요 원인이며, 만연한 알코올 중독은 농촌 지역을 괴롭히는 중대한 문제가 되었습니다. 우리는 주류에 높은 세금을 부과하여 소비를 억제하는 것을 목표로 합니다."
 EST_workspace: "청년의 작업장"
 EST_workspace_desc: "성공적인 개혁과 사회 복지에 대한 투자를 통해, 우리는 에스토니아를 새로운 세대와 기성세대가 더 큰 선을 위해 함께 일하는 청년의 작업장으로 탈바꿈시켰습니다."
 EST_e_residency: "전자 거주 프로그램"
 EST_e_residency_desc: "비에스토니아인이 회사 설립, 은행 업무, 결제 처리, 세무 같은 에스토니아의 서비스를 이용할 수 있도록 허용함으로써, 국내외 투자를 모두 끌어들여 경제 산출을 늘릴 수 있습니다."
 EST_office_sectors: "사무 부문 확대"
 EST_office_sectors_desc: "사무 부문은 거대한 경제라는 기계에 기름을 치는 상당히 큰 역할을 하며, 그것이 가져오는 이점을 고려하면 이를 확대하는 것은 자연스러워 보입니다."
 EST_log_log: "목재 물류"
 EST_log_log_desc: "목재는 우리의 주요 수출품 중 하나로 중요한 소득원입니다. 핵심 기반시설 투자를 통해 목재 운송 물류를 개선함으로써 운송 비용을 낮추고 이윤율을 높일 수 있습니다."
 EST_replant_forests: "산림 재조림"
 EST_replant_forests_desc: "우리는 잃어버린 생태계를 복원하고 재생 가능한 목재 공급원을 확보하기 위해 우리나라의 숲에 다시 나무를 심기 시작할 것입니다."
 EST_expand_log_industry: "목재 수출 확대"
 EST_expand_log_industry_desc: "통나무와 목재 제품은 우리 수출의 큰 비중을 차지하므로, 이 산업을 확대하여 소득을 늘리는 것은 지극히 당연합니다."
 EST_investments_money: "예산 증액"
 EST_investments_money_desc: "우리 예산에는 대규모 투자를 감당할 더 많은 자금이 필요하므로, 소득의 더 큰 부분에 대해 세금을 약간 인상하는 것은 정당하다고 생각합니다."
 EST_better_roads: "국가 연결"
 EST_better_roads_desc: "도로와 철도 기반시설을 확충함으로써 국가를 더 잘 연결하고, 나라를 더욱 발전시키는 동시에 새로운 일자리를 창출할 수 있습니다."
 EST_renovate_factories: "공장 개보수"
 EST_renovate_factories_desc: "소련이 붕괴했을 때, 공장들이 더 이상 수익성도 관리 가능성도 없어 우리는 탈산업화를 강요당했습니다. 그러나 그 이후 많은 시간이 흘렀고 기반시설은 여전히 남아 있습니다. 이 낡은 공장들을 개보수하여 다시 가동 상태로 만드는 것도 좋은 생각일 것입니다."
 EST_pink_shirts: "에스토니아 최고급 분홍 셔츠"
 EST_pink_shirts_desc: "할 말 없음."
 EST_own_shirts: "에스토니아 자급자족"
 EST_own_shirts_desc: "특히 섬유 산업을 포함한 다양한 산업을 갖추는 것이 장기적으로 큰 도움이 될 수도 있습니다."
 EST_robint_kavur: "로빈트 카부르 사"
 EST_robint_kavur_desc: "로빈트 카부르가 대체 누구이며 왜 회사를 가지고 있는가?"
 EST_fighting_unemployment: "실업과의 싸움"
 EST_fighting_unemployment_desc: "우리는 실업과 싸우기로 결의했으며, 이를 위해 여러 조치를 마련했습니다."
 EST_startup_estonia: "스타트업 에스토니아"
 EST_startup_estonia_desc: "야심 찬 개인과 스타트업을 지원하는 것이 핵심이므로, 우리는 에스토니아 스타트업 생태계를 크게 활성화하여 미래에 더 많은 스타트업 성공 사례가 탄생하는 터전이 되도록 하는 정부 사업을 시작할 것입니다."
 EST_open_workplaces_con: "공공 부문 확대"
 EST_open_workplaces_con_desc: "국민에게 더 나은 서비스를 제공하려면, 더 많은 직원을 고용하고 핵심 공공 소유 기반시설을 확대하여 공공 부문을 확대해야 합니다. 이를 통해 경제 성장을 촉진하고 더 많은 고임금 일자리를 창출할 수도 있습니다."
 EST_invest_in_trade_ports: "무역항 투자"
 EST_invest_in_trade_ports_desc: "관련 기반시설, 특히 무역항에 투자함으로써 무역 산출을 늘릴 수 있습니다."
 EST_tax_breaks: "세금 감면 제공"
 EST_tax_breaks_desc: "세금 감면을 제공함으로써 신규 스타트업을 지원하고 에스토니아 경제를 발전시킬 수 있습니다."
 EST_burecracy_ease: "기업 관료주의 해소"
 EST_burecracy_ease_desc: "사업을 시작하고 운영하는 데 따르는 번거로운 절차를 줄이는 것을 우선시함으로써, 창업 과정을 더 효율적이고 간단하게 만들고 기업이 번창하기에 유리한 환경을 조성할 수 있습니다."
 EST_monopoly_war: "독점 기업 견제"
 EST_monopoly_war_desc: "경쟁법과 정책을 도입함으로써 독점 기업의 힘을 효과적으로 제한하고 심지어 분할할 수도 있습니다."
 EST_bussiness_paradise: "소기업의 낙원"
 EST_bussiness_paradise_desc: "우리는 모든 기업을 위한 지원적인 경제 체제를 구축함으로써 에스토니아를 비교적 알려지지 않은 나라에서 진정한 비즈니스 낙원으로 탈바꿈시키는 데 성공했습니다."
 EST_invest_in_police: "경찰 투자"
 EST_invest_in_police_desc: "많은 이들이 예산 낭비라고 여기지만, 경찰력을 지원하는 것은 평범한 시민을 불량배나 해를 끼치려는 이들로부터 보호하는 데 필수적입니다."
 EST_work_or_morgue: "실업 해결"
 EST_work_or_morgue_desc: "실업자에 대한 재정 지원은 물론, 새 일자리를 찾도록 돕는 훈련 및 교육 프로그램 등 다양한 정책과 프로그램을 시행함으로써 실업 문제를 해결할 수 있습니다."
 EST_energy_con: "에너지의 문제"
 EST_energy_con_desc: "에너지는 최근 몇 년간 현상 유지를 주장하는 측과 대안을 모색하는 측 사이에서 뜨거운 논쟁 주제가 되었습니다. 현상 유지는 분명 선택지가 아니지만, 이제 어떤 재생 가능 에너지원을 선택할 것인가 하는 문제가 남아 있습니다."
 EST_renewable_energy: "재생 가능 에너지"
 EST_renewable_energy_desc: "우리는 더 비싸고 위험한 선택지를 택하는 모험을 하지 않을 것이므로 일반적인 재생 가능 에너지를 택할 것입니다."
 EST_nuclear_energy: "원자력으로 나아가다"
 EST_nuclear_energy_desc: "원자력 발전소 건설은 복잡하고 극도로 비싼 사업이지만, 우리는 이를 실현할 전문성이 있다고 확신하며 어쨌든 장기적으로 더 큰 이익을 얻을 것입니다."
 EST_windmills: "유럽이 제공할 수 있는 최고의 풍차"
 EST_windmills_desc: "우리는 유럽에서 가장 우수하고 발전된 풍차를 개발하는 데 성공했으며, 반드시 이를 활용할 것입니다."
 EST_sollar_pannels: "태양 에너지"
 EST_sollar_pannels_desc: "풍차에서 한 걸음 더 나아가, 이제 태양의 힘을 수확하여 전력을 자급자족할 수 있도록 해야 합니다."
 EST_green_atom: "녹색 원자"
 EST_green_atom_desc: "태양의 힘이 바로 우리 손바닥 안에... 죄송합니다, 제가 너무 흥분했나 봅니다. 어쨌든 우리는 에스토니아가 반드시 번영하게 할 최첨단 재생 가능 원자력 에너지원을 개발하는 데 성공했습니다."
 EST_coal_power: "석탄 발전"
 EST_coal_power_desc: "재생 가능 에너지로의 전환은 우리 문제를 해결하지 못합니다. 이제 검증된 연료원에 집중할 때입니다. 석탄! 석탄이 우리의 모든 문제를 해결해 줄 것입니다."
 EST_invest_in_coal: "값싼 가스, 완벽한 전력"
 EST_invest_in_coal_desc: "우리가 값싼 가스에 계속 집중한다면, 우리 국민 한 사람 한 사람에게 항상 전력이 공급될 것입니다."
 EST_invest_future: "미래에 투자"
 EST_invest_future_desc: "우리는 현재에 있는 동안 미래에 대비해야 하며, 사회 프로그램, 교육, 보건에 투자하여 에스토니아 국가에 어떤 해도 가해지지 않도록 해야 합니다."
 EST_invest_in_cities: "올바른 도시 계획"
 EST_invest_in_cities_desc: "무질서한 도시 건설은 과밀화나 지진 위험 증가 같은 예기치 못한 재해로 이어질 수 있습니다. 이러한 건설을 중단하고 올바른 도시 계획 기준을 수립하면 그러한 사태의 위험이 줄어들 것입니다."
 EST_ole_kaasas: "올레 카아사스 프로그램"
 EST_ole_kaasas_desc: "현재 우리의 가장 큰 문제 중 하나는 사회와 경제 각 부문의 디지털 격차입니다. 민간 기관과 협력함으로써 이 격차를 줄이고 행정을 더 효율적으로 만들 수 있습니다."
 EST_reform_curriculum: "교육 과정 개혁"
 EST_reform_curriculum_desc: "현재의 교육 과정은 시험에 지나치게 치중되어 있고 실용적 기술에는 충분히 신경을 쓰지 않습니다. 학교는 학생들에게 비판적으로 사고하고 문제를 해결하는 법, 창의적이고 혁신적이 되는 법을 가르치는 데 집중해야 하며, 전혀 필요하지 않은 수학 공식과 방정식을 기계적으로 쓰는 법을 배우게 해서는 안 됩니다. 솔직히, 마지막으로 근의 공식을 써 본 게 언제입니까?"
 EST_increase_teacher_wages: "교사 급여 인상"
 EST_increase_teacher_wages_desc: "교사 임금 인상에는 많은 이점이 있습니다. 우선 교직은 흔히 저임금 직업으로 여겨지기 때문에 더 많은 사람을 이 직업으로 끌어들일 것입니다. 이는 교육에 열정을 지닌 사람이 교직에 들어올 가능성이 높아지므로 교사의 질 향상으로 이어질 수 있습니다. 또한 급여가 높아지면 교사들이 더 높은 임금의 직업을 찾아 떠날 가능성이 낮아져 교사 유지율이 높아질 것입니다."
 EST_e_education: "전자 교육"
 EST_e_education_desc: "교육의 디지털화는 학교 전체를 변화시키는 중요한 첫걸음이 될 것이며, 모든 연령대의 학생에게 더 상호작용적이고 재미있게 만들 것입니다."
 EST_immigration_cons: "에스토니아의 가치"
 EST_immigration_cons_desc: "우리는 에스토니아의 가치를 수호하고, 다른 민족이 우리나라로 더 이주해 오는 것을 막을 것입니다."
 EST_family_traditions_con: "전통 보존"
 EST_family_traditions_con_desc: "가족의 전통은 언제나 우리의 관점이었고 앞으로도 그러할 것입니다. 우리는 국민이 행복한지 살펴야 합니다."
 EST_air_focus: "항공 발전"
 EST_air_focus_desc: "유능하고 위협적인 육군을 원한다면, 유능하고 더욱 위협적인 공군이 필요합니다. 이제 우리는 공군 발전에 집중하여 우리에게 맞서는 어떤 국가도 이길 수 있도록 해야 합니다."
 EST_air_defence: "에스토니아 방공"
 EST_air_defence_desc: "방공 체계가 없다면 우리 지상군은 표적이 될 뿐입니다. 그러므로 방어 체계에 투자해야 하며, 그렇지 않으면 우리는 순식간에 폭파당할 수 있는 상태로 남게 됩니다."
 EST_air_reform: "에스토니아 공군 개혁"
 EST_air_reform_desc: "단지 신경 쓰는 것을 잊은 장비 때문에 도시와 마을이 초토화된 채 남지 않도록, 현재의 공군을 개혁해야 합니다."
 EST_multirole_focus: "다목적 전투기 중시"
 EST_multirole_focus_desc: "에스토니아 공군에 균형 잡힌 접근을 취하기 위해 다목적 전투기에 집중해야 합니다. 그러지 않으면 별다른 일을 할 수 없는 항공기만 남게 될 것입니다. 다목적 전투기는 단연 가장 강력한 종류의 항공기입니다."
 EST_cas_focus: "근접항공지원기에 투자"
 EST_cas_focus_desc: "우리는 근접 항공 지원 전투기에 투자해야 합니다. 이는 지상 부대의 전쟁을 훨씬 쉽게 만들어 주며, 그것이 없다면 적이 우리에게 2000kg 폭탄을 투하할 수 있는 큰 구멍을 열어 놓게 되고, 우리가 적에게 투하하지 못하게 됩니다."
 EST_defence_league_expansion: "방위연맹 확대"
 EST_defence_league_expansion_desc: "방위연맹의 확대는 우리 자신과 조국의 안전을 보장하는 데 매우 중요합니다. 그것이 없다면 우리는 어떤 공격에도 무너질 가능성이 높습니다."
 EST_reform_conscription: "징병제 개혁"
 EST_reform_conscription_desc: "최대한 많은 인력을 확보할 수 있도록 징병법을 개혁해야 합니다. 징집병이 충분하지 않으면 싸울 사람은 가장 충성스러운 시민들뿐일 것입니다."
 EST_joint_drills: "합동 훈련"
 EST_joint_drills_desc: "제대로 된 효과적인 군대를 원한다면 어떤 상황에 직면하더라도 대비하도록 해야 합니다. 매복? 반격할 수 있습니다. 폭격? 어디로 대피할지 압니다. 총격전? 우리 병사들은 모든 적의 머리에 총알을 박을 것입니다. 준비된 군대는 불멸의 군대입니다."
 EST_homeland_specialization: "본토 방어"
 EST_homeland_specialization_desc: "본토 방어는 가장 중요합니다. 이를 무방비로 둔다면 전쟁이 일어났을 때 싸울 이유가 사라져 모든 것이 무의미해질 것입니다. 그러한 가능성에 대비해야 합니다."
 EST_subsidize_defence: "방위 보조금 지급"
 EST_subsidize_defence_desc: "우리에게는 강력한 군대가 필요합니다. 따라서 군대에 자금을 대야 합니다. 우리는 군을 지원하기 위해 새로운 예치금을 따로 마련할 것입니다."
 EST_coast_guard: "해안경비대"
 EST_coast_guard_desc: "우리는 가장 취약한 곳, 즉 해안을 지킬 제대로 기능하는 해안경비대를 육성해야 합니다. 이를 소홀히 한다면, 우리가 잠든 사이에 침략자들이 쳐들어올 틈을 내주게 될 것입니다."
 EST_viribus_unitis: "비리부스 우니티스"
 EST_viribus_unitis_desc: "우리는 힘을 하나로 모아 정복당하지 않고 멈출 수 없는 힘이 될 것입니다. 그 누구도 감히 우리에게 도전하지 못할 것이며, 완전한 패권을 향한 우리의 길은 필연적입니다. §R엘라구 에스티.§!"
 EST_fortify_islands: "섬 요새화"
 EST_fortify_islands_desc: "우리는 가장 취약한 땅에 방어 시설을 갖추어야 합니다. 최악의 사태에 대비하여 몇 개의 해안 요새를 건설할 것입니다."
 EST_mobilty: "군대 기동화"
 EST_mobilty_desc: "군대를 기동화한다는 것은 총이 폭발탄을 쏘게 만드는 것과 같습니다. 속도와 정밀함으로 타격하고, 죽이고, 정복하십시오. 그들은 무엇에 당했는지도 알지 못할 것입니다."
 EST_know_thyself: "너 자신을 알라"
 EST_know_thyself_desc: "너 자신을 안다는 것은 궁극적으로 자각하는 것입니다. 자신의 결점과 약점, 문제를 아는 것이 강점을 아는 것보다 더 강력합니다. 우리는 군대를 살펴 가장 약한 곳이 어디인지 확인하고 모두 바로잡을 것입니다."
 EST_modernization: "자체 현대화"
 EST_modernization_desc: "우리가 뒤처지기를 원한다면, 지금 아주 잘하고 있는 것입니다. 우리는 반드시 공군, 육군, 해군을 현대화해야 합니다. 어떤 형태의 전쟁이든 고려하기 전에 소형 화기와 차량 같은 장비를 업그레이드할 것입니다."
 EST_the_best_defense: "최선의 방어"
 EST_the_best_defense_desc: "그것은 훌륭한 공격입니다. 조국을 확실히 지키려면, 적을 먼저 격파해야 합니다."
 EST_furor_teutonicus: "푸로르 테우토니쿠스"
 EST_furor_teutonicus_desc: "테우토네스족은 본받을 만한 존재입니다. 우리는 기원전 113년인 것처럼 적들을 모욕하고 무찌를 것입니다. 에스토니아가 최고의 지위에 군림할 것입니다."
 EST_naval_effort: "해군을 위한 노력"
 EST_naval_effort_desc: "우리는 해군을 현대화하고 무장시키기 위해 노력해야 합니다. 최고의 연구진이 가능한 한 가장 효율적인 속도로 새로운 함선을 연구하는 데 투입될 것입니다."
 EST_domestic_research: "국내 연구"
 EST_domestic_research_desc: "우리가 원하는 바가 무엇인지, 어떻게 이루어야 하는지 모르는 외국인에게 연구를 맡기지 말고, 우리의 연구자들이 연구를 수행해야 합니다. 조국 출신이 아닌 설계자는 우리가 바라는 결과를 망칠 것입니다."
 EST_foreign_design: "외국 설계 검토"
 EST_foreign_design_desc: "외국 설계를 검토하는 것은 우리 연구 활동 전반의 범위를 넓히는 일입니다. 다른 관점을 들여오면 큰 이익이 될 것이며, 우리에게 부족한 점을 보여 주고 대외 관계에도 도움이 될 수 있습니다."
 EST_stabilizing_the_nation: "위대한 조국의 안정화"
 EST_stabilizing_the_nation_desc: "최악의 사태는 이미 닥쳤고, 오래전에 지나갔습니다. 우리는 나라를 안정시키고 미래를 준비하는 데 집중해야 합니다."
 EST_reforming_country_step_by_step: "단계적 국가 개혁"
 EST_reforming_country_step_by_step_desc: "우리나라가 또 한 세기를 살아남으려면 뿌리부터 개혁해야 합니다. 과정이 길고 힘들더라도, 이는 조국의 더 나은 미래를 위해 반드시 해야 할 일입니다."
 EST_liberal_values: "자유주의적 가치"
 EST_liberal_values_desc: "개인의 권리, 입헌주의, 민주주의, 그리고 법치. 이 모두는 우리나라가 이 새로운 시대에 번영하기 위해 가르치고 지켜야 할 가치입니다."
 EST_reducing_bureaucratic_preassure: "관료제 부담 경감"
 EST_reducing_bureaucratic_preassure_desc: "대부분의 정부 기관을 디지털화함으로써 관료제의 부담을 덜고 정부 구조의 효율성을 높일 수 있습니다."
 EST_reduce_corporate_tax: "법인세율 인하"
 EST_reduce_corporate_tax_desc: "기업은 어떤 경제에서든 크게 필요한 존재이며, 이들에게 더 낮은 세율을 제공함으로써 막대한 외국 자본을 끌어들이고 새로운 일자리를 창출할 수 있습니다. 모두에게 이득입니다!"
 EST_promo_estonian_culture: "에스토니아 문화 진흥"
 EST_promo_estonian_culture_desc: "경제를 부양하고 에스토니아를 관광지로 홍보하기 위한 폭넓은 계획의 일환으로, 문화 행사와 활동에 막대한 자금을 투자할 것입니다."
 EST_dark_green_on_market: "시장의 짙은 녹색"
 EST_dark_green_on_market_desc: "우리 경제장관이 시장에 '짙은 녹색'이 더 필요하다며 술에 취해 장광설을 늘어놓았는데, 뭐, 그 말에는 우리도 동의하는 것 같습니다..."
 EST_restructuring_finance_department: "재무부 구조조정"
 EST_restructuring_finance_department_desc: "에스토니아 재무부는 시급한 구조조정이 필요합니다. 재무부는 무능한 지도부와 비대한 관료제로 가득 차 있어 일이 효과적으로 처리되지 못하고 있습니다."
 EST_freedom_of_social_media: "소셜 미디어 자유 확대"
 EST_freedom_of_social_media_desc: "언론의 자유가 커진다는 것은 국민의 자유와 대중의 지지가 커진다는 뜻입니다! 자유!"
 EST_e_democracy: "전자 민주주의"
 EST_e_democracy_desc: "인터넷 투표를 도입함으로써 유권자가 세계 어디에서든 인터넷에 연결된 컴퓨터로 투표할 수 있게 하여, 시민들이 편리하게 국정에 참여하도록 할 수 있습니다."
 EST_economic_heaven: "경제적 낙원"
 EST_economic_heaven_desc: "우리나라는 이제 정녕 낙원입니다!"
 EST_listening_to_the_nation: "국민의 목소리 경청"
 EST_listening_to_the_nation_desc: "우리는 정치인이지만, 무엇보다 국민의 지도자입니다. 변화와 개선, 그 무엇이든 국민의 요구에 귀를 기울여야 하며, 또 그렇게 할 것입니다."
 EST_estonian_model_of_democracy: "에스토니아식 민주주의 모델"
 EST_estonian_model_of_democracy_desc: "국민은 권력의 궁극적 원천이며, 우리는 국민의 지도자로서 그들에게 책임을 집니다. 그렇기에 우리는 법치, 권력 분립, 기본권과 자유의 원칙에 기초한 모범 민주주의를 만들기 위해 열심히 노력했으며, 이는 다른 나라들이 자국의 민주주의 실험에서 길잡이로 삼을 수 있는 모범 민주주의입니다."
 EST_a_free_nation: "자유로운 국가"
 EST_a_free_nation_desc: "§Y자유의 횃불이 탈린에서 그 어느 때보다 밝게 빛납니다!§!"
 EST_green_ideas: "녹색 사상"
 EST_green_ideas_desc: "나라를 지킨다는 것은 군사적, 정치적인 의미만이 아니라 생태적인 의미이기도 합니다. 우리가 사는 땅을 어떠한 생태 재해로부터도 지키기 위해 녹색 사상과 계획을 발전시켜야 합니다."
 EST_increase_personal_freedom: "개인의 자유 확대"
 EST_increase_personal_freedom_desc: "우리 사회를 더욱 자유화하려면 개인이 누리는 자유도 늘려야 합니다. 시간제 근무와 직무 공유 같은 유연한 근무 형태를 장려함으로써 사람들이 일과 가정생활의 균형을 맞추기 쉽게 하고, 자신의 시간을 더 잘 통제하도록 할 수 있습니다."
 EST_promoting_eco_solutions: "생태적 해법 진흥"
 EST_promoting_eco_solutions_desc: "우리의 가장 큰 자산은 기술이며, 이를 활용하여 온실가스 배출 문제에 대한 생태적 해법을 만들고 지속 가능한 환경을 촉진할 수 있습니다."
 EST_work_with_eco-friendly_companies: "더 많은 친환경 기업과 협력"
 EST_work_with_eco-friendly_companies_desc: "친환경은 요즘의 새로운 추세입니다. 우리는 우리 기업들에 집중하고 다른 기업들도 더 친환경적이 되도록 장려하여, 시장에 짙은 녹색이 더 늘어나게 해야 합니다!"
 EST_intigrate_minorities: "소수 민족 통합"
 EST_intigrate_minorities_desc: "EKRE 정치인들은 소수 민족이 위험을 대표하며 상황이 통제 불능이 되기 전에 이들을 나라 밖으로 내쫓아야 한다고 말하기를 좋아하지만, 우리는 더 쉽고 더 나은 해법이 있다고 생각합니다. 무료 에스토니아어 강좌와 사회 프로그램을 제공하여 이들 민족을 우리 사회에 서서히 통합함으로써, 결국 이들을 귀화 시민이자 사회의 제 기능을 하는 구성원으로 만들 수 있습니다."
 EST_constitutional_reform: "헌법 개혁"
 EST_constitutional_reform_desc: "현행 기본법은 1992년에 채택되었으며 우리는 이를 현대에 맞게 개정해야 합니다. 동성 결혼 같은 현대적 권리를 명문화함으로써 최근 유럽 역사상 가장 자유로운 헌법을 만들 수 있습니다."
 EST_invest_in_renevable_energy: "재생 에너지 투자"
 EST_invest_in_renevable_energy_desc: "재생 에너지는 우리와 인류 모두에게 안전한 미래를 의미하므로, 이에 투자하는 것은 지극히 당연한 일입니다."
 EST_develop_state_administration: "국가 행정 발전"
 EST_develop_state_administration_desc: "디지털화와 기타 수단을 통해 국가 행정을 발전시키는 데에는 비용이 들지만, 장기적으로는 더 효율적이고 더 저렴하게 운영되는 관료제로 이어질 것입니다."
 EST_ecological_paradise: "진정한 다람쥐의 낙원"
 EST_ecological_paradise_desc: "§Y무운순드에서 실라매까지, 탈린에서 발가까지, 에스토니아 국민이 번영하고 있습니다!§!"
 EST_liberal_estonian_cabinet_reform: "소규모 자유주의 내각 개편"
 EST_liberal_estonian_cabinet_reform_desc: "왜 우리에게 부풀려진 급여를 받는 장관이나 비서관이 그토록 많이 필요합니까? 내각을 더 작고 전문화된 형태로 개편함으로써 불필요한 비용을 막을 수 있습니다."
 EST_demand_stability_in_country: "우리에게는 안정이 필요하다!"
 EST_demand_stability_in_country_desc: "우리는 정치적 분쟁을 제쳐 두고 에스토니아의 안정을 위해 국회(리이기코구)의 다른 정당들과 협력하려 노력할 것입니다."
 EST_environment: "환경 보호"
 EST_environment_desc: "우리의 보살핌과 찬사를 받을 만한 것이 있다면, 그것은 바로 환경입니다. 환경 중심의 비정부기구와 자원봉사 단체를 지원함으로써 자연을 개선하고 더 깨끗하게 만들어 미래 세대가 누릴 수 있도록 할 수 있습니다."
 EST_business_paradise: "과세된 절대적 기업 낙원"
 EST_business_paradise_desc: "우리는 영리한 경제 운용으로 에스토니아를 진정한 기업 낙원으로 만들었으며, 이제 실질적인 세금 인상 없이도 그 혜택과 성장을 거둘 수 있습니다."
 EST_young_family_finance: "청년 가정 재정 지원"
 EST_young_family_finance_desc: "젊은 가정은 경제적 어려움 앞에서 항상 가장 취약하지만, 부담 없는 금융 교육 강좌를 제공함으로써 이들을 돕고 보호할 수 있습니다."
 EST_what_if: "만약에...?"
 EST_what_if_desc: "시간, 공간, 현실. 이 모든 것은 직선적인 길 이상의 것입니다. 하나의 작은 결정이 무한한 결과를 낳을 수 있는, 끝없는 현실들의 프리즘입니다. 이를 가장 흥미로운 사변적 게임, 곧 가지 않은 길이라고 생각해 보십시오. 인류 역사에서 이러한 갈래와 대안의 길은 우리 모두에게 큰 관심사입니다."
 EST_pure_center: "순수한 중도"
 EST_pure_center_desc: "우리는 더 이상 이름뿐인 중앙당이 아닐 것입니다. 중립의 대의에 온전히 헌신함으로써 에스토니아를 위한 순수한 중도의 길을 이룰 수 있습니다."
 EST_soc_con_policies: "사회 보수 정책"
 EST_soc_con_policies_desc: "우리는 나약한 자유주의 운동의 물결에 맞서 가족과 재산권 같은 우리 사회의 전통적 측면을 지키기 위해 노력할 것입니다."
 EST_playing_seesaw: "시소 타기"
 EST_playing_seesaw_desc: "서로 싸우게 만들 수 있는데 굳이 어느 한쪽 편에 설 이유가 있습니까? 이렇게 하면 우리가 얻을 것이 훨씬 많습니다."
 EST_baltic_crossroad: "발트의 교차로"
 EST_baltic_crossroad_desc: "우리 지역은 갈림길에 서 있습니다. 우리는 현대 세계에서 우리만의 자리를 찾아가는 과정에 있습니다. 우리는 동양과 서양 사이, 과거와 미래 사이에 있습니다. 그러나 우리는 우리만의 길, 우리만의 운명을 쓸 수 있다고 믿습니다."
 EST_common_western_programms: "서방 공동 프로그램"
 EST_common_western_programms_desc: "공동 기술 및 경제 프로그램을 통해 서방과 협력하면 독립을 유지하고 중립을 보장하는 동시에 해외 협력의 결실도 거둘 수 있습니다."
 EST_propose_trade_with_east: "동방과의 무역 제안"
 EST_propose_trade_with_east_desc: "우리의 확고한 중립에 대한 양보로서 동방 강대국에 대한 무역 생산량과 경제적 이익을 늘릴 수 있습니다."
 EST_our_baltic_brethren: "우리의 발트 형제들"
 EST_our_baltic_brethren_desc: "우리의 발트 형제인 라트비아와 리투아니아. 우리는 이들 각각을 우호적으로 방문해야 합니다."
 EST_decision_to_stay_neutral: "우리는 중립을 지킬 것이다"
 EST_decision_to_stay_neutral_desc: "우리 정부는 결정했습니다. 어느 세력에서도 좋은 일은 없을 것입니다. 우리는 개입하지 않고 우리만의 길을 가야 합니다."
 EST_cultural_ties: "문화적 유대 형성"
 EST_cultural_ties_desc: "발트 형제들과의 문화적 유대는 필수적입니다."
 EST_dreams_of_union: "발트 연합의 꿈"
 EST_dreams_of_union_desc: "수 세기에 걸쳐 발트 국가들을 통합하려는 시도가 여러 차례 있었고, 역사는 우리가 함께할 때 가장 강하다는 것을 보여 주었습니다. 그렇다면 이 구상을 다시 한번 되살리지 않을 이유가 있겠습니까? 그리고 이번에는 부디 성공하기를 바랍니다."
 EST_infrastructure_expansion: "인프라 확충"
 EST_infrastructure_expansion_desc: "우리는 21세기에 살고 있습니다, 젠장! 흙길이나 비포장도로는 이제 충분합니다! 이제 우리도 현대적이고 대규모의 인프라를 가질 때입니다."
 EST_land_reform: "토지 개혁"
 EST_land_reform_desc: "우리나라의 현 상태에는 토지 개혁, 그것도 무엇보다 일관성 있는 토지 개혁이 필요합니다. 대규모 영지를 쪼개 그 땅을 소농들에게 분배함으로써 농업 및 경제 생산량을 크게 늘릴 수 있습니다."
 EST_ensure_loyal_comptetition: "공정 경쟁 보장"
 EST_ensure_loyal_comptetition_desc: "기업 간 공정한 경쟁을 보장하는 것은 경제 성장을 촉진하고 기업과 거대 기업을 규제하는 데 있어 당연한 일입니다."
 EST_focus_on_consumer_goods: "소비재 집중"
 EST_focus_on_consumer_goods_desc: "평범한 시민을 행복하게 하는 데에는 식탁 위의 음식과 양질의 제품만 한 것이 없습니다. 민수품에 더 많은 자원을 투입함으로써 국민을 행복하게 할 수 있습니다."
 EST_invest_in_innovation: "혁신 투자"
 EST_invest_in_innovation_desc: "혁신은 앞으로 나아가는 모든 국가에 중요하며, 혁신에 투자하는 것은 끝없는 기술 경쟁에서 우리가 뒤처지지 않을 것을 보장합니다."
 EST_lower_tax: "세금 인하"
 EST_lower_tax_desc: "우리 자신의 수입은 줄어들지만, 세금을 낮추면 평범한 시민이 더 행복해집니다."
 EST_promote_work_unions: "노동조합 육성"
 EST_promote_work_unions_desc: "노동조합은 정치에서 유용한 도구입니다. 노동조합을 정치화하고 육성하여 조합원 수를 늘리면, 우리가 손가락만 튕겨도 성난 노동자 무리를 동원할 수 있습니다."
 EST_edu_reform: "교육 개혁"
 EST_edu_reform_desc: "이름뿐인 개혁입니다. 교육은 미래 세대를 만들어 내는 길이며, 그들은 우리에게 위험이 될 수 있는 지식인입니다. 교육 체계에 대한 우리의 장악력을 높이고 정치 권력의 남용을 조장하는 등의 방식으로 체계를 개편함으로써, 위험이 형성되기도 전에 그 위험을 제거할 수 있습니다."
 EST_purge_ngo: "비정부기구 숙청"
 EST_purge_ngo_desc: "비정부기구는 우리의 대의에 위협이므로, 어떠한 수단을 써서라도 나라가 번영하도록 이 위험한 요소들을 제거해야 합니다."
 EST_bribe_media: "언론 매수"
 EST_bribe_media_desc: "언론을 통제한다는 것은 국민을 통제한다는 뜻이며, 특별 보도를 위해 돈을 지불하는 것보다 더 좋은 방법이 어디 있겠습니까?"
 EST_our_industrial_revolution: "우리만의 산업 혁명"
 EST_our_industrial_revolution_desc: "우리는 산업 면에서 선진국에 분명히 뒤처져 있지만, 적절한 곳에 투자함으로써 처음부터 우리만의 산업 혁명을 일으킬 수 있습니다."
 EST_economic_dirigisme: "경제 국가주도주의"
 EST_economic_dirigisme_desc: "국가주도주의는 경제 성장을 촉진하는 효과적인 도구가 될 수 있습니다. 기업들이 효율적으로 운영되도록 경제에 개입함으로써 시장의 모든 불균형을 바로잡을 수 있습니다."
 EST_promote_obligations_investments: "채무 투자 육성"
 EST_promote_obligations_investments_desc: "투자자들이 기업의 보통주를 매입하는 채무 투자를 육성함으로써, 우리가 처한 어떠한 가혹한 재정 상황도 분명 완화할 수 있습니다."
 EST_create_our_own_machinery: "자체 기계 제작"
 EST_create_our_own_machinery_desc: "우리가 직접 생산할 수 있는데 왜 항상 외국 기계를 수입해야 합니까? 우리는 서방의 최고 제품을 역설계하기만 하면 됩니다... 그래, 말처럼 쉽지는 않을 것입니다."
 EST_interest_free_currency: "무이자 화폐"
 EST_interest_free_currency_desc: "우리는 화폐와 대출에 대한 최대 이자율이 0이고 중앙은행 화폐에 보유 수수료를 부과하는 감가 화폐(demurrage currency) 도입 작업에 착수할 것입니다. 이를 통해 성장을 촉진하고 동포들의 삶을 더 낫게 만들 것입니다."
 EST_indoctricate_future_generations: "미래 세대 세뇌"
 EST_indoctricate_future_generations_desc: "우리는 교육을 통제하고 언론을 통제합니다. 이 두 거인을 확고히 손아귀에 넣었으니, 마침내 에스토니아의 미래 세대를 세뇌하는 일에 착수할 수 있습니다."
 EST_eesti: "에스티"
 EST_eesti_desc: "에스티! 에스티! 에스티!S"
 EST_agricultural_selfrelience: "농업 자급자족"
 EST_agricultural_selfrelience_desc: "농업 부문에 대대적으로 투자하고 새로운 유기농 및 지속 가능한 영농 방식을 개발함으로써 에스토니아가 식량 생산에서 완전히 자급자족하도록 만들 수 있습니다."
 EST_ban_abortions: "낙태 금지"
 EST_ban_abortions_desc: "페미니스트들은 얼마든지 항의할 수 있지만, 이 문제에서 역사의 올바른 편에 서 있는 것은 우리입니다. 낙태는 비도덕적이며 우리나라의 발전을 가로막을 뿐이므로, 이를 없앰으로써 인구 증가를 촉진할 수 있습니다."
 EST_glass_ceiling: "유리 천장"
 EST_glass_ceiling_desc: "성별, 인종 또는 기타 보호 대상 특성에 근거한 직장 내 차별을 금지하는 법과 규정을 만들고 시행함으로써, 직장의 유리 천장을 깨고 다양성을 촉진할 길을 열 수 있습니다."
 EST_encourage_far_right_thought: "극우 사상 장려"
 EST_encourage_far_right_thought_desc: "극우는 좌파와 달리 아직 우리를 잘못된 길로 이끈 적이 없습니다. 우리가 앞으로 나아가기 시작하는 지금, 이 교리를 장려할 때입니다."
 EST_underhanded_exchange: "음성적 거래"
 EST_underhanded_exchange_desc: "우리 정부를 채워 넣으면 더할 나위 없이 좋을 만한 사람들이 우리나라에 몇몇 있습니다. 이제 그들을 권력의 자리에 올릴 때일지도 모릅니다."
 EST_the_estonian_party: "독립의 정당"
 EST_the_estonian_party_desc: "우리는 독립의 정당입니다. 에스토니아는 우리의 위대한 지도력으로 강대국이 될 것이며, 또 반드시 되어야 합니다!"
 EST_estonia_first: "에스토니아 제일주의"
 EST_estonia_first_desc: "에스토니아가 무엇보다 최우선이어야 합니다. 우리나라는 외세에 굴복하지 않을 것이며 굴복할 수도 없습니다."
 EST_anti_russian_stance: "반러시아 정서"
 EST_anti_russian_stance_desc: "러시아인들은 우리가 수년간 이웃으로 지내는 동안 우리에게 도움이 된 적이 없습니다. 이제 우리 국민이 러시아인들의 진정한 본성을 제대로 알게 해야 할 때입니다."
 EST_look_at_estomma: "에스토마 문제 제기"
 EST_look_at_estomma_desc: "에스토마는 많은 에스토니아인이 거주하는 러시아 내 지역입니다. 이 지역이 올바른 손에 있는지 스스로에게 물어볼 때가 되었습니다."
 EST_study_russian_tactics: "러시아 전술 연구"
 EST_study_russian_tactics_desc: "러시아인들과의 전투에 대비하려면 먼저 그들의 전략과 전술을 알아야 합니다. 우리는 그들의 전쟁 방식을 분석하고 연구할 것입니다."
 EST_mobilize_the_masses: "대중 준비"
 EST_mobilize_the_masses_desc: "러시아의 위협에 맞서는 일은 결코 쉽지 않을 것입니다. 그들에게 대항할 가능성이라도 가지려면 대중을 동원해야 합니다!"
 EST_all_we_can_get: "구할 수 있는 모든 것"
 EST_all_we_can_get_desc: "우리는 구할 수 있는 것은 무엇이든 확보해야 합니다. 경찰력에서 무기를 몰수하는 것이 좋은 첫걸음이 될 것입니다."
 EST_striking_the_bear: "곰 스테이크 드실 분?"
 EST_striking_the_bear_desc: "우리는 동쪽의 거대한 사악한 곰을 쓰러뜨리고 위대한 새 질서를 회복할 것입니다!"
 EST_revenge_sweden: "스웨덴에 정의를"
 EST_revenge_sweden_desc: "스웨덴인들은 오랜 세월 우리 민족을 예속시켰으며, 우리는 이 범죄를 묵과할 수 없습니다."
 EST_distance_eu: "EU와의 거리 두기"
 EST_distance_eu_desc: "우리는 유럽 연합이라는 그 끔찍한 조직과 거리를 두어야 합니다. 그들의 위험한 견해는 우리 조국의 문화를 뿌리까지 썩게 할 것입니다."
 EST_purge_sympathizers: "잠재적 동조자 숙청"
 EST_purge_sympathizers_desc: "우리 당은 EU의 잠재적 동조자들을 모두 걷어내야 합니다. 그들을 해임하고 그 자리를 더 충성스럽고 EU에 덜 우호적인 당원들로 채울 것입니다."
 EST_ban_eu_parties: "모든 위협 분쇄"
 EST_ban_eu_parties_desc: "자유주의라는 위협으로부터 거리를 확실히 두기 위해, 문제를 일으킬 수 있는 모든 잠재적 정당을 금지할 것입니다."
 EST_our_neighbors: "폭풍 전의 고요"
 EST_our_neighbors_desc: "우리는 다가오는 폭풍에서 승리하도록 우리 병사들을 무장시킬 무기를 위해 조용히 새로운 군수 공장을 건설할 것입니다.."
 EST_strike_latvia: "라트비아 타격"
 EST_strike_latvia_desc: "라트비아는 우리의 오랜 이웃이지만 집세를 내지 않았습니다. 집주인, 곧 지구를 대신하여 그들을 쫓아낼 때입니다."
 EST_strike_lithuania: "빌니우스에서의 축하"
 EST_strike_lithuania_desc: "우리가 리투아니아의 수도 빌니우스의 국민을 해방하여 에스토니아의 통제 아래 두고 나면, 그곳에서 달콤한 승리를 축하할 것입니다!"
 EST_clean_up_finland: "러시아가 못 한 일을 하라"
 EST_clean_up_finland_desc: "우리는 러시아가 하지 못한 일을 해낼 것이며, 공격을 개시하면 핀란드를 무릎 꿇릴 것입니다!"
 EST_teachers_pay: "교실에서의 영향력"
 EST_teachers_pay_desc: "우리는 교실에서의 영향력을 활용하여 팽창과 해방이라는 우리의 위대한 대의에 대한 지지를 얻어낼 것입니다."
 EST_exploiting_resources: "자원 개발"
 EST_exploiting_resources_desc: "에스토니아에는 국내에 자원이 많이 있습니다. 문제는 어떤 행정부나 정부도 적어도 올바른 장소에서 그것을 찾아보려 한 적이 없다는 점입니다."
 EST_push_out_foreign_companies: "견고한 인프라 구축"
 EST_push_out_foreign_companies_desc: "우리나라의 인프라는 어떤 식으로든 공격을 받게 될 것이 분명하므로, 전시에 적절하고 튼튼한 인프라를 확보해야 합니다."
 EST_made_in_estonia: "우리 하늘 수호"
 EST_made_in_estonia_desc: "언젠가 긴급 대응이 필요할 경우에 대비하여 우리 하늘을 지켜야 합니다."
 EST_military_focus: "군사화된 문화"
 EST_military_focus_desc: "우리는 국민의 문화를 군대와 군국주의를 중심으로 돌아가도록 개혁해야 합니다."
 EST_civlian_focus: "에스토니아 문화 유지"
 EST_civlian_focus_desc: "우리 국민의 정체성을 바꿀 필요는 없을 것입니다. 우리의 민족 정체성은 그대로 유지될 것입니다."
 EST_blrt_grupp: "BLRT 그룹"
 EST_blrt_grupp_desc: "BLRT 그룹은 에스토니아와 발트 지역 곳곳에 자리한 조선 회사입니다. 우리는 이를 이용하고 자금을 지원하여 군사용 조선소를 더 만들 수 있습니다."
 EST_nokter: "모크터"
 EST_nokter_desc: "모크터는 산업 기계와 장비를 만듭니다. 모크터를 활용하여 우리 산업을 확장할 수 있습니다."
 EST_heart_of_industry: "발트 산업의 심장부"
 EST_heart_of_industry_desc: "우리는 위대한 노력과 성취를 통해 발트 산업의 심장부가 될 것입니다."
 EST_self_sufficiency: "자립"
 EST_self_sufficiency_desc: "우리는 우리 자신 외에는 누구에게도 의존할 수 없으며, 이는 세계 정치가 불안정하기 때문입니다."
 EST_estonian_goods_outward: "세계화에 의존"
 EST_estonian_goods_outward_desc: "왜 세계화에서 벗어나려 해야 합니까? 그로부터 이익을 얻을 수 있다면 최선의 선택을 해야 하며, 그 추세를 따라가야 합니다!"
 EST_european_federation: "유럽 연방"
 EST_european_federation_desc: "우리의 위대한 노력으로 유럽(적어도 동유럽)을 당분간 에스토니아의 패권 아래 둘 것입니다. 많은 시련을 겪겠지만, 오늘 우리가 있는 이 자리에 이르기 위해 치른 위대한 희생을 잊어서는 안 됩니다."
 estonia.1.t: "발트의 교차로"
 estonia.1.d: "우리는 중립의 길을 걸어왔습니다. 어떤 특정한 길도 포기하고, 가능한 한 진정으로 중립을 지키기 위해서입니다. 우리는 전쟁이 야만적인 것이며, 전쟁을 없애는 것이 진정으로 완벽한 세상이라고 믿습니다."
 estonia.1.o1: "완전한 중립으로 간다"
 estonia.2.t: "우리에게 반기를 든 라트비아"
 estonia.2.d: "라트비아는 중립 속에서 발트 블록을 통합하려는 우리의 야망에 동참할 의사가 없다고 밝혔습니다. 이 모욕에 어떻게 대응해야 합니까?"
 estonia.2.o1: "전쟁이다!"
 estonia.2.o2: "평화는 언제나 하나의 선택지다"
 estonia.3.t: "리투아니아의 반기"
 estonia.3.d: "리투아니아는 중립 속에서 발트 블록을 통합하려는 우리의 야망에 동참할 의사가 없다고 밝혔습니다. 이 모욕에 어떻게 대응해야 합니까?"
 estonia.3.o1: "전쟁이다!"
 estonia.3.o2: "평화는 언제나 하나의 선택지다"
 estonia.5.t: "2001년 유로비전 송 콘테스트"
 estonia.5.d: "2001년 유로비전 송 콘테스트는 스물세 개 나라가 참가한 제46회 노래 대회였습니다. 그러나 우리의 위대한 나라 에스토니아가 이 대회에서 우승하리라고는 누구도 예측하지 못했습니다. 타넬 파다르, 데이브 벤턴, 2XL이 \\"Everybody\\" 무대에서 놀라운 공연을 펼쳐 무려 총 198점을 얻었습니다! 우리가 유로비전에서 처음으로 우승한 순간입니다. 우리가 유로비전에서 우승했습니다!"
 estonia.5.o1: "우리가 우월한 것이 분명하다!"
 estonia.6.t: "승리의 기둥 제막"
 estonia.6.d: "2009년 6월 23일 오늘, 에스토니아 탈린의 자유 광장에서 에스토니아 독립 전쟁에서 최고의 희생을 바친 이들을 기리는 기념물로서 이 승리의 기둥이 제막되었습니다. 이 승리의 기둥은 에스토니아 국민이 우리의 독립과 자유를 위해 싸운 모든 이들을 기릴 수 있게 해 줄 것입니다."
 estonia.6.o1: "자유의 대가를 보여 준다."
 estonia.7.t: "코프터라인 103편 추락 사고"
 estonia.7.d: "코프터라인 103편은 에스토니아 탈린에서 핀란드 헬싱키로 향하던 시코르스키 S-76C+ 헬리콥터로, 2005년 8월 10일 이륙 불과 3~5분 뒤 갑작스러운 서보 고장으로 탈린 만에 추락했습니다. 탑승자는 승무원 2명과 승객 12명이었으며, 생존자는 없었습니다."
 estonia.7.o1: "불행한 일이다"
 estonia.7.o2: "국민들에게 연설"
 estonia.7.o3: "유가족에게 보상금을 지급한다"
 estonia.8.t: "한 번에 두 개의 의자"
 estonia.8.d: "스스로를 \\"진정으로 중립적\\"이라고 규정하는 현 집권당의 통치 아래, 에스토니아는 서방과 동방을 상대로 시소 놀이를 하는 듯합니다. 완전한 민주주의 국가이자 친EU 국가가 한발 물러서서 가속화된 속도로 정책을 바꾸려 한다는 점부터 상황은 꽤 흥미롭습니다."
 estonia.8.o1: "서방으로 기울다"
 estonia.8.o2: "동방으로 기울다"
 estonia.8.o3: "진정한 중립!"
 estonia.9.t: "청동의 밤"
 estonia.9.d: "정치적 논란 속에서, 2007년 4월 에스토니아 정부는 직전 선거(2007년 3월 실시)에서 받은 정치적 위임에 따라 동상 이전과 관련 유해 재매장을 위한 최종 준비에 착수했습니다. 이 조치의 적절성을 둘러싼 의견 불일치는 대규모 시위와 폭동으로 이어졌습니다. 일각에서는 1944년 소련의 재점령 이후 에스토니아 최악의 밤일 수 있다고 말합니다."
 estonia.9.o1: "그 기념물을 옮겨라!"
 estonia.9.o2: "그들의 말에 귀를 기울여야 한다."
 estonia.10.t: "사이버 공격"
 estonia.10.d: "오늘 기준으로, 에스토니아 의회, 은행, 부처, 신문사, 방송사를 비롯한 에스토니아 기관들의 웹사이트를 겨냥한 일련의 사이버 공격이 발생했습니다. 이는 탈린에 있는 정교한 소련 시대의 묘비 표지인 탈린의 청동 병사와 탈린의 전몰자 묘지 이전을 둘러싸고 러시아와 의견 충돌을 빚는 가운데 일어난 일입니다."
 estonia.10.o1: "러시아인들을 탓하라!"
 estonia.10.o2: "미국도 결백하지 않다!"
 estonia.11.t: "빌랸디 학교 총격 사건"
 estonia.11.d: "10월 20일, 빌랸디 시에 비극이 닥쳤습니다. 파알랄린나 학교의 15세 학생이 아버지의 권총을 가져와 교내에 반입했습니다. 이 학생은 이후 교실에서 그 권총을 사용하여 담임 교사에게 치명상을 입혔습니다. 당시 교사는 56세에 불과했습니다. 다른 사람은 다치지 않았으며, 학생은 이후 저항 없이 체포되었습니다. 해당 교사가 어떤 형태로든 괴롭힘이나 학대를 했다는 증거는 없는 것으로 밝혀졌습니다. 이로써 이 사건은 이유 없는 범죄가 되었으며, 우리나라 역사상 처음 발생한 학교 총기 난사 사건입니다."
 estonia.11.o1: "어떻게 이런 일이 일어날 수 있었는가?"
 estonia.11.o2: "우리가 의료에 투자했더라면.."
 estonia.11.o3: "더 강력한 치안이 해결책일 것이다"
 estonia.12.t: "에스토니아 건국 기념일"
 estonia.12.d: "매년 2월 24일, 에스토니아 국민은 1918년부터 1920년까지의 러시아 혁명 중에 우리나라가 러시아 제국으로부터 독립을 얻은 날을 기념합니다. 이는 우리나라에 국가의 지위를 안겨 주기 위해 최고의 희생을 치른 이들을 기리는 방식입니다. 우리는 불꽃놀이, 콘서트, 국방군 퍼레이드, 그리고 마지막으로 대통령 연설로 기념합니다. "
 estonia.12.o1: "무 이사마아, 무 윈, 야 룁(나의 조국, 나의 행복과 기쁨)!"
 estonia.16.t: "ETV2 방송 개시"
 estonia.16.d: "ETV2 방송 채널은 2008년 8월 8일 방송을 시작했습니다. 에스토니아 공영방송의 두 번째 채널로, 어린이 콘텐츠와 다양한 형태의 오락을 통한 문화 콘텐츠를 제공하는 것으로 알려져 있습니다."
 estonia.16.o1: "만화는 아이의 성장에 필수적이다!"
 estonia.18.t: "헌법 개혁"
 estonia.18.d: "우리는 솔직히 시대에 뒤떨어진 헌법을 다시 살펴볼 때가 되었다고 결정했습니다. 몇 가지 변경을 가할 것이며 헌법의 기본 이념을 훼손하지는 않겠지만, 다소 '낡은' 이상은 갱신해야 합니다. "
 estonia.18.o1: "개혁에 더 자유주의적으로 접근한다."
 estonia.18.o2: "보수적인 접근이 더 적절해 보인다."
 estonia.19.t: "내각 개편"
 estonia.19.d: "우리는 내각 개편이 필요하다는 결론에 이르렀습니다. 구체적으로는 자유주의적 개편입니다. 우리는 자유주의 이념을 더 널리 알려야 하며, 그 시작은 가장 핵심인 내각에서부터 이루어져야 합니다."
 estonia.19.o1: "무엇을 기다리고 있는가? 지금 시작하라."
 estonia.20.t: "경제적 피난처"
 estonia.20.d: "에스토니아는 대규모 벌목, 광업, 농업, 그리고 고도로 발달한 은행 부문 등 여러 가지로 알려져 있습니다. 그들은 사람들이 자국에 투자하도록 장려하기 위해 점진적으로 세금을 줄이는 노력을 기울여 왔습니다. 그들의 최근 확장과 더불어 우리의 일부 민간 기업이 바다 건너 이웃 나라에 발판을 마련한 것을 볼 수 있습니다. 유대를 깊게 하고 에스토니아에서 우리의 발판을 넓힐 만한 가치가 있을지도 모릅니다."
 estonia.20.o1: "민간 자본가들이여.."
 estonia.100.t: "간첩 혐의 제기"
 estonia.100.d: "우리가 [SOV.GetName]과 그 영향력으로부터 계속 멀어지고 있는 지난 10년간, 우리나라와 [SOV.GetName] 사이의 국경은 긴장으로 가득했습니다. 국경 지역 일대에서 우리 측과 그들 측 모두 간첩 행위를 했다는 비난이 있었습니다. 우리의 비난을 더욱 밀어붙여야 합니까, 아니면 긴장 완화를 중재하려 해야 합니까?"
 estonia.100.a: "그들이 간첩질을 하고 있다!"
 estonia.100.b: "불에 기름을 붓지 마라."
 estonia.101.t: "에라콘드 레스 푸블리카(RP) 창당"
 estonia.101.d: "에라콘드 레스 푸블리카(레스 푸블리카 당)는 소련 붕괴 이후인 1990년대 초 젊은 보수주의자들의 공동체로서 정치 조직으로 설립되었습니다. 공식적으로는 '공화국을 위한 연합 - 레스 푸블리카'(Ühendus vabariigi eest - Res Publica)로 결성되었으며, 이 당을 지지하는 보수주의자들 사이에서 흔히 레스 푸블리카로 불리게 되었습니다."
 estonia.101.a: "보수주의가 부상하고 있다..."
 estonia.102.t: "낡은 법 폐지"
 estonia.102.d: "에스토니아 법전은 어떤 형태든 에스토니아 정치인은 에스토니아어에 유창해야 한다고 규정하고 있습니다. 이는 국가 서부에서는 문제가 되지 않지만, 이 법은 국가 동부에서 모국어가 러시아어인 정치인들을 계속 소외시키고 있습니다. 러시아어를 쓰는 더 많은 정치인이 지역구민을 대표할 수 있도록 이 법을 폐지하고 그 정책을 철회하자는 제안이 나왔습니다. 이 법을 어떻게 처리해야 합니까?"
 estonia.102.a: "법을 유지한다"
 estonia.102.b: "법을 폐지한다"
 estonia.106.t: "쿠무 미술관 개관"
 estonia.106.d: "여러 해에 걸친 공사 끝에 쿠무 미술관이 지난주 문을 열면서 마침내 마무리되었습니다. 이 미술관은 이전에 카드리오르그 궁전에 보관되어 있던 국가의 수많은 역사 및 예술 유물을 수용하도록 지어졌습니다. 새 건물은 에스토니아의 모든 예술과 역사를 위한 집이 될 것입니다. 우리의 역사와 예술에 멋진 날입니다."
 estonia.106.a: "예술에 멋진 날"
 estonia.111.t: "에스토니아 연합 좌파당 창당"
 estonia.111.d: "에스토니아 연합 좌파당(Eestimaa Ühendatud Vasakpartei)은 에스토니아 좌파당의 후신으로 2008년에 결성되었습니다. 이 당은 지지의 대부분을 국가 북동부에 집중된 러시아어 사용 소수 민족에게서 얻습니다. 이러한 헌신적인 지지 기반에도 불구하고 국가 정치에서는 주변적 세력에 머물렀으며, 의회 진출 장벽을 넘는 일은 거의 없었습니다."
 estonia.111.a: "에스토니아 연합 좌파당이 결성되다"
 estonia.115.t: "EKRE 창당"
 estonia.115.d: "에스토니아 보수 국민당이라고도 하는 에스티 콘세르바티이브네 라흐바에라콘드(EKRE)는 에스토니아 현상에 대한 커져 가는 불만을 대변합니다. 극단적 민족주의, 커져 가는 반러시아 정서, 그리고 자유주의 좌파를 거부하는 더 많은 극우 사상이 우리나라에서 이 당이 세력을 얻는 길을 닦고 있습니다. 이들은 우리나라의 극우를 대표하는 선도 정당이 되었으며, 우리 정치 무대에서 지배적인 세력이 되려고 밀어붙이고 있습니다."
 estonia.115.a: "민족주의의 부상"
 baltic_un.1.t: "발트 연합 제안"
 baltic_un.1.d: "에스토니아가 우리의 힘을 합쳐 발트 연합을 결성하자는 선택지를 제시했으며, 그 이야기를 남기고 갔습니다."
 baltic_un.1.o1: "발트 연합이 되는 데 동의한다"
 baltic_un.1.o2: "우리는 주권을 유지하고 싶다, 사양하겠다!"
 EST_baltictram_category: "발트 트램 프로젝트"
 EST_baltictram_category_desc: "우리는 연구와 노고를 통해 우리의 위대한 나라를 발전시켜야 합니다. '발트 트램' 프로젝트는 이러한 진전을 크게 앞당길 수 있습니다. 도시 교통은 도시의 생활 편의성과 지속 가능성을 형성하는 데 핵심적인 역할을 합니다. 최근 몇 년간 발트 지역에서는 대중교통망을 개선하고 더 효율적이며 친환경적인 도시 이동 체계를 만들고자 하는 발트 트램 프로젝트라는 주목할 만한 사업이 진행되었습니다. 이 선구적인 사업은 사람들의 통근 방식을 혁신하고, 대기 질을 개선하며, 지역의 경제 발전을 촉진할 것을 약속합니다. 현대적인 트램 시스템의 도입을 통해 이 프로젝트는 도시 이동성을 혁신하고, 연결성을 높이며, 환경에 미치는 영향을 줄이고, 경제 성장을 촉진하는 것을 목표로 합니다. 발트 도시들이 이 미래 지향적인 사업을 받아들임에 따라, 이들은 더 지속 가능하고 살기 좋은 도시 환경을 만들어 세계 다른 지역들이 따라야 할 고무적인 본보기가 될 준비를 갖추고 있습니다."
 EST_bt_new_beginnings: "프로젝트의 출발점"
 EST_bt_developing_ideas: "산업 구상 개발"
 EST_bt_getting_there: "새로운 디지털 발견"
 EST_bt_ai_breakthrough: "AI가 대체 뭐지?"
 EST_bt_cybersec_upgrade: "사이버 보안 업그레이드"
 EST_bt_3d_printers: "프린터가.. 3D라고?!"
 EST_bt_excavation: "굴착기 (하지만 더 빠르게)"
 EST_bt_internet_speedup: "연결 속도 향상"
 EST_bt_nanofibres: "나노섬유? 난 그녀를 잘 몰라요!"
 EST_bt_radars: "레이더? 래디컬하군, 친구."
 EST_bt_genetic_editing: "유전자 편집 기술"
 EST_bt_fuel_researching: "연료 처리 분야의 발견"
 EST_bt_opt_out: "프로그램에서 탈퇴"
 EDGAR_SAVISAAR_DESC: "에드가르 사비사르는 에스토니아의 정치인으로, 에스토니아 인민전선과 중앙당의 창립 당원 중 한 명입니다. 에스토니아 총리 직무대행, 내무장관, 경제통신장관, 탈린 시장을 역임했습니다."
 EST_suppressing_russian_language: "러시아어 억압"
 EST_russian_tactic: "러시아인들을 능가하기"
 EST_russian_tactic_desc: "우리가 전장과 그 밖의 분야에서 러시아인들을 그들의 방식으로 계속 앞지른다면, 우리는 더욱 자급자족하게 될 것이며 우리의 자연 국경을 방어할 수 있을 것입니다."
