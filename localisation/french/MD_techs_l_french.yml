 module_light_flight_deck_1: "Dock de Transport Amphibie"
 module_light_flight_deck_1_desc: "Ce module détermine à quel point le navire est orienté vers le soutien direct des opérations amphibies par rapport à la mise en œuvre d'unités aériennes."
 module_light_flight_deck_2: "Hélicoptère d'assaut Polyvalent"
 module_light_flight_deck_2_desc: "Ce module détermine à quel point le navire est orienté vers le soutien direct des opérations amphibies par rapport à la mise en œuvre d'unités aériennes."
 module_light_flight_deck_3: "Hélicoptère d'assaut de Débarquement"
 module_light_flight_deck_3_desc: "Ce module détermine à quel point le navire est orienté vers le soutien direct des opérations amphibies par rapport à la mise en œuvre d'unités aériennes."
 module_fuel_tank: "Réservoirs de Carburant"
 module_fuel_tank_desc: "Réservoirs de carburant agrandis pour permettre aux navires de plus grande taille de fonctionner plus longtemps avant de devoir finalement revenir de déploiement."
 module_esm_1: "MES I"
 module_esm_1_desc: "Les Mesures de Soutien Électronique (MES en abrégé) comprennent les actions de détection, d'interception, d'identification, d'enregistrement, de localisation et/ou d'analyse des sources d'énergie électromagnétique rayonnée pour la reconnaissance des menaces."
 module_esm_2: "MES II"
 module_esm_2_desc: "Les Mesures de Soutien Électronique (MES en abrégé) comprennent les actions de détection, d'interception, d'identification, d'enregistrement, de localisation et/ou d'analyse des sources d'énergie électromagnétique rayonnée pour la reconnaissance des menaces."
 module_esm_3: "MES III"
 module_esm_3_desc: "Les Mesures de Soutien Électronique (MES en abrégé) comprennent les actions de détection, d'interception, d'identification, d'enregistrement, de localisation et/ou d'analyse des sources d'énergie électromagnétique rayonnée pour la reconnaissance des menaces."
 module_sub_esm_1: "MES I"
 module_sub_esm_1_desc: "Les Mesures de Soutien Électronique (MES en abrégé) comprennent les actions de détection, d'interception, d'identification, d'enregistrement, de localisation et/ou d'analyse des sources d'énergie électromagnétique rayonnée pour la reconnaissance des menaces."
