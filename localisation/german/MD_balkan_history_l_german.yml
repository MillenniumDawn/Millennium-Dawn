l_german:
 balkan_news.1.t: "Karadžić wegen Genozids verurteilt."
 balkan_news.1.d: "Das Haager Tribunal hat Radovan Karadžić des Völkermords in Srebrenica sowie der Verbrechen gegen die Menschlichkeit in ganz Bosnien für schuldig befunden und ihn zu einer Freiheitsstrafe von vierzig Jahren verurteilt. Zwei Jahrzehnte nach dem Dayton-Abkommen ist damit der damalige politische Führer der bosnischen Serben von jenem Gericht verurteilt worden, dessen Einrichtung durch den von ihm mitverursachten Krieg erst notwendig wurde."
 balkan_news.1.a: "Das Urteil wird in Sarajevo verlesen"
 balkan_news.1.b: "Ein Urteil gegen alle Serben, behaupten manche."
 balkan_news.1.c: "Späte Gerechtigkeit."
 balkan_news.2.t: "Lebenslange Freiheitsstrafe für Karadžić"
 balkan_news.2.d: "Die Berufungskammer hat die Berufung von Radovan Karadžić zurückgewiesen und seine Strafe auf lebenslange Freiheitsstrafe erhöht. Sie befand, dass die ursprünglich verhängte Freiheitsstrafe von vierzig Jahren der Schwere seiner Verbrechen nicht angemessen sei. Damit ist das endgültige Urteil über den Mann gesprochen, der die Republika Srpska während des Bosnienkriegs führte."
 balkan_news.2.a: "Den Haag beendet das Verfahren."
 balkan_news.3.t: "Mladić wegen Genozids verurteilt."
 balkan_news.3.d: "Das Tribunal hat Ratko Mladić wegen Völkermords, Kriegsverbrechen und Verbrechen gegen die Menschlichkeit verurteilt und ihn zu lebenslanger Freiheitsstrafe verurteilt. Der ehemalige General schrie die Richter an und musste aus dem Gerichtssaal entfernt werden, bevor die Urteilsverkündung beendet war. In Srebrenica verfolgten die Mütter der getöteten die Verkündung schweigend."
 balkan_news.3.a: "Endlich muss der General sich verantworten."
 balkan_news.4.t: "Suizid im Gerichtssaal."
 balkan_news.4.d: "Wenige Augenblicke nachdem die Richter seine zwanzigjährige Haftstrafe bestätigt hatten, erklärte der bosnisch-kroatische General Slobodan Praljak, er sei kein Kriegsverbrecher, und trank vor laufenden Kameras eine Phiole mit Gift. Er starb wenige Stunden später. Die Berufungskammer bestätigte die Verurteilungen aller sechs ehemaligen Führer von Herzeg-Bosna und stellte fest, dass ein gemeinsames kriminelles Unternehmen bis nach Zagreb reichte."
 balkan_news.4.a: "Er verweigerte sich der Rechtsprechung des Gerichts."
 balkan_news.4.b: "Ein tragisches Ende des letzten Falls des Tribunals"
 balkan_news.5.t: "Mladić scheitert mit seiner Berufung."
 balkan_news.5.d: "Die Richter der Vereinten Nationen haben die Verurteilung von Ratko Mladić wegen Völkermords sowie seine lebenslange Freiheitsstrafe bestätigt und damit den letzten großen Fall aus dem Bosnienkrieg abgeschlossen. Ein Vierteljahrhundert nach Srebrenica ist die juristische Aufarbeitung des Krieges abgeschlossen. Die politische Aufarbeitung jedoch nicht."
 balkan_news.5.a: "Das Kapitel wird geschlossen."
 CRO_nat_populism_gain_tt: "§R Der Zulauf für die nationalistische Rechte nimmt zu. §!"
 balkan_news.6.t: "Die Deklaration der serbischen Welt"
 balkan_news.6.d: "Belgrad und Banja Luka haben gemeinsam eine dreizehnseitige Erklärung zur stärkeren Verbindung serbischer Gebiete verabschiedet. Vorgesehen ist ein ständiger Hoher Rat für die Zusammenarbeit zwischen Serbien und der Republika Srpska. Rechtlich hat das Dokument wenig Gewicht – politisch ist seine Zielsetzung jedoch deutlich."
 balkan_news.6.a: "Ein mächtiger Verbündeter."
 balkan_news.6.b: "Saraqevo verliert weiter an Autorität."
 balkan_news.6.c: "Meldungen aus der Region."
 balkan_news.7.t: "EUFOR verstärkt sein Engagement."
 balkan_news.7.d: "Nur wenige Tage nachdem russische Panzer die Ukraine angegriffen hatten, verdoppelte die EU in etwa die Garnisonsstärke von EUFOR Althea in Bosnien und Herzegowina. Reservisten wurden eingeflogen, um einer möglichen Ausweitung der Instabilität in der Region entgegenzuwirken."
 balkan_news.7.a: "Ein beruhigendes Signal der Handlungsbereitschaft"
 balkan_news.7.b: "Eine weitere Vorsichtsmaßnahme."
 balkan_news.8.t: "Erdoğan mobilisiert Sarajevo."
 balkan_news.8.d: "Da ihm Wahlkampfauftritte in Westeuropa untersagt wurden, hat Erdoğan seine einzige europäische Kundgebung im Rahmen des Wahlkampfs in Sarajevo abgehalten. Dabei zog er Tausende Menschen an und traf sich mit Bakir Izetbegović von der SDA. Dodik bezeichnet dies als Einmischung."
 balkan_news.8.a: "Ein verlässlicher Freund für Sarajevo."
 balkan_news.8.b: "Ein Auftritt in einem anderen Land."
 balkan_news.9.t: "Lawrows Sarajevo-Besuch."
 balkan_news.9.d: "Sergej Lawrow hat Sarajevo besucht und wurde am Flughafen allein von Dodik empfangen. Zu diesem Anlass wurde keine bosnische Flagge gehisst. Er reiste mit einer jahrhundertealten orthodoxen Ikone ab, deren Ursprung bis nach Luhansk zurückverfolgt wird – ein Geschenk, für das Kiew eine Erklärung verlangt."
 balkan_news.9.a: "Die eigenständige Außenpolitik der Republika Srpska."
 balkan_news.9.b: "Nur ein Besuch wie jeder andere."