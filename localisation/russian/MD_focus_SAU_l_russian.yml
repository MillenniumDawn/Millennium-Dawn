 SAU_research_modifery_01: "§HDiversification§! - Исследования и разработки"
 SAU_research_modifery_01_desc: "Целевое финансирование университетов и научно-исследовательских институтов ускоряет стремление Королевства к построению экономики знаний, не зависящей от нефти."
 SAU_research_modifery_02: "§HDiversification§! - Исследования мирового класса"
 SAU_research_modifery_02_desc: "Ведущие институты, такие как KAUST, превратили Саудовскую Аравию в восходящий региональный центр науки и инноваций, привлекающий таланты со всего мира."
 SAU_research_modifier_01: "Пробуждение умов"
 SAU_research_modifier_01_desc: "Программы повышения базовой грамотности расширяют число граждан Саудовской Аравии, имеющих возможность получить формальное образование."
 SAU_research_modifier_02: "Читающая нация"
 SAU_research_modifier_02_desc: "Рост грамотности привел к увеличению числа читающих людей и росту спроса на школы и учебные материалы."
 SAU_research_modifier_03: "Расширение образования"
 SAU_research_modifier_03_desc: "Расширение сети школ и увеличение числа учащихся обеспечивают большему числу саудовцев доступ к начальному и среднему образованию."
 SAU_research_modifier_04: "Основы обучения"
 SAU_research_modifier_04_desc: "Королевство создало необходимые учреждения и подготовило персонал для развития более широкой национальной системы образования."
 SAU_research_modifier_06: "Развитие интеллекта"
 SAU_research_modifier_06_desc: "Университеты и научно-исследовательские институты готовят все большее количество высокообразованных саудовских специалистов."
 SAU_royal_ulema_alliance_content: "§HКоролевский альянс улемов§!"
 SAU_royal_ulema_alliance_content_desc: "Он §LУлема§! и §HДом аль-Сауд§! Сотрудничать продуктивно. Обычные фетвы благоприятствуют престолу; обычная политика уважает духовенство. Ни у одной из сторон нет причин для жалоб."
 SAU_royal_ulema_alliance_high: "§HКоролевский альянс улемов§!"
 SAU_royal_ulema_alliance_high_desc: "Он §LСовет старших ученых§! Решительно поддерживают трон, а религиозная элита представляют королевскую политику как легитимную. Такая тесная связь существенно укрепляет династию."
 SAU_royal_ulema_alliance_neutral: "§HКоролевский альянс улемов§!"
 SAU_royal_ulema_alliance_neutral_desc: "Трон и духовенство поддерживают §Yформальный, но ограниченный§! Взаимоотношения. Ни одна из сторон активно не поддерживает и не препятствует другой, поэтому баланс сил не дает никаких преимуществ или недостатков."
 SAU_royal_ulema_alliance_neutral_tt: "§YСоотношение между троном и улемами сбалансировано — нет бонусов или штрафов.§! \n§Yизменение баланса сил = 0.00§!"
 SAU_royal_ulema_alliance_strained: "§RКоролевский штамм улемы§!"
 SAU_royal_ulema_alliance_strained_desc: "Члены организации §LUlema§! в частном порядке критикуют престол и используют проповеди для того, чтобы поставить под сомнение правительственные реформы. Эта оппозиция подрывает религиозную легитимность династии."
 SAU_sabic_01: "САБИК"
 SAU_sabic_01_desc: "Саудовская корпорация базовых отраслей промышленности (SABIC) — крупный производитель нефтехимической продукции. Продолжая расти, SABIC способствует диверсификации промышленности и обеспечивает занятость не только в нефтяном секторе."
 SAU_sabic_agrinutrients: "§HSABIC§! - Сельскохозяйственные удобрения и специальные химикаты"
 SAU_sabic_agrinutrients_desc: "Компания SABIC Agri-Nutrients перерабатывает саудовский газ в мочевину и аммиак, обеспечивая продовольствием фермы по всей Азии и Африке и превращая Королевство в ведущую державу по производству удобрений."
 SAU_sabic_foreign_jv: "§HSABIC§! - Иностранные совместные предприятия"
 SAU_sabic_foreign_jv_desc: "Совместные предприятия с Shell, ExxonMobil и Mitsubishi позволили внедрить передовые мировые технологии на заводах SABIC, при этом прибыль компании осталась в Королевстве."
 SAU_sabic_ge_plastics: "§HSABIC§! - Приобретение компанией GE Plastics"
 SAU_sabic_ge_plastics_desc: "Приобретение компании GE Plastics в 2007 году за более чем одиннадцать миллиардов долларов в одночасье вывело SABIC в число ведущих мировых производителей конструкционных пластмасс."
 SAU_sabic_global_champion: "§HSABIC§! - Мировой чемпион в области химической промышленности"
 SAU_sabic_global_champion_desc: "Компания SABIC входит в число крупнейших химических компаний мира, что доказывает, что саудовская промышленность способна конкурировать далеко за пределами нефтяного рынка."
 SAU_sabic_hadeed: "§HSABIC§! - металлургический комплекс HADEED"
 SAU_sabic_hadeed_desc: "Подразделение Hadeed компании SABIC по производству стали в Джубайле поставляет в саудовскую строительную отрасль миллионы тонн арматуры и листового металла, которые раньше приходилось импортировать."
 SAU_sabic_ibn_affiliates: "§HSABIC§! - Филиалы Ибн"
 SAU_sabic_ibn_affiliates_desc: "Филиалы Ибн Сины, Ибн Захра и Ибн Рушда распределяют нефтехимическую продукцию SABIC между производством пластмасс, метанола и волокон."
 SAU_sabic_jubail_yanbu: "§HSABIC§! – Промышленные города Джубайль и Янбу"
 SAU_sabic_jubail_yanbu_desc: "В результате работы королевской комиссии города Джубайль и Янбу превратили пустынное побережье в два крупнейших в мире промышленных комплекса, заложивших основу тяжелой промышленности Саудовской Аравии."
 SAU_sabic_rnd: "§HSABIC§! - Собственная технология"
 SAU_sabic_rnd_desc: "Научно-исследовательские центры SABIC в Эр-Рияде, Бангалоре и Гелене позволяют компании поддерживать свои катализаторы и полимеры на переднем крае технологического развития."
 SAU_sagia_initiative: "§HИнициатива SAGIA§!"
 SAU_sagia_initiative_02: "§HSAGIA - Инвестиционные реформы§!"
 SAU_sagia_initiative_02_desc: "§LSAGIA§! ослабила ограничения на владение недвижимостью и сократила задержки в получении лицензий. Эти реформы привлекают больше иностранных компаний и упрощают выход на саудовский рынок."
 SAU_sagia_initiative_03: "§HSAGIA - Центр привлечения иностранного капитала§!"
 SAU_sagia_initiative_03_desc: "Саудовская Аравия открыла §Hстратегические сектора§!, введен §Hналоговые льготы§!и разработал §Hэкономические города§! вдоль своих берегов. Эта политика превратила Королевство в крупный региональный центр прямых иностранных инвестиций."
 SAU_sagia_initiative_04: "§GSAGIA - Инвестиционный гигант §!"
 SAU_sagia_initiative_04_desc: "Саудовская Аравия теперь сочетает в себе §Hдиверсифицированная экономика§! с §Hоткрытый инвестиционный рынок§!Завершённые реформы SAGIA привлекают значительный иностранный капитал и квалифицированных работников."
 SAU_sagia_initiative_desc: "Учрежден королевским указом в §YАпрель 2000 г.§!, то §LГенеральное инвестиционное управление Саудовской Аравии§! Это первое в Королевстве агентство, занимающееся привлечением иностранных инвестиций. Оно отвечает за упрощение коммерческого права и предоставление инвесторам информации. §Hединая точка контакта§!а также улучшение доступа на саудовский рынок."
 SAU_salman_health_critical: "§HКоролевское здоровье§! - §RКритический§!"
 SAU_salman_health_critical_desc: "Король больше не путешествует и часто пропускает заседания Совета. Дворец предоставляет мало информации, что заставляет высокопоставленных лиц готовиться к восшествию на престол."
 SAU_salman_health_declining: "§HЗдоровье короля§! - §YУхудшение§!"
 SAU_salman_health_declining_desc: "Король сокращает или отменяет все больше официальных аудиенций, хотя дворец не сообщал о серьезном заболевании. Сокращенный график начинает сказываться на работе правительства."
 SAU_salman_health_near_death: "§HКоролевское здоровье§! - §RНа грани смерти§!"
 SAU_salman_health_near_death_desc: "Король близок к смерти и фактически передал управление своим преемникам. Политическая деятельность теперь сосредоточена на подготовке к престолонаследию."
 SAU_salman_health_serious: "§HКоролевское здоровье§! - §YСерьезный§!"
 SAU_salman_health_serious_desc: "Король редко появляется на публике, и министры все чаще получают указания через королевский двор, а не непосредственно от него."
 SAU_salman_health_stable: "§HКоролевское здоровье§! - §GСтабильность§!"
 SAU_salman_health_stable_desc: "Король ведет насыщенный официальный график, принимает послов, председательствует на заседаниях Совета министров и рассматривает правительственные документы. Его постоянное участие обеспечивает порядок при дворе и в министерствах."
 SAU_shura_led_notables: "Совет знатных лиц"
 SAU_shura_led_notables_desc: "Племенные вожди и влиятельные купеческие семьи доминируют в Совете Шуры благодаря неформальным соглашениям, заключаемым до официального голосования. Такая структура власти характерна для сложившихся саудовских властных структур, но замедляет процесс принятия решений."
 SAU_shura_led_technocrats: "Совет министерств"
 SAU_shura_led_technocrats_desc: "Технократы повысили эффективность работы Совета Шуры по рассмотрению бюджетов и государственной политики. Его члены обладают высокой компетентностью, но плохо представляют интересы общин за пределами Эр-Рияда."
 SAU_shura_led_ulema: "Совет улемов"
 SAU_shura_led_ulema_desc: "Религиозные ученые контролируют Совет Шуры и не позволяют предложениям, которым противостоит религиозная элита, доходить до короля."
 SAU_sp_abrams_combined: "Бронетехника: комбинированные виды вооружения"
 SAU_sp_abrams_combined_desc: "Танки, пехота и артиллерия сражаются как одна сбалансированная команда.\n§G+5%§! Дивизионная атака\n§G+5%§! Дивизионная оборона\n§G+5%§! Организация подразделения\n§R+10%§! Время армейской подготовки"
 SAU_sp_abrams_defensive: "Броня: Защитная стена"
 SAU_sp_abrams_defensive_desc: "Окопная броня как неподвижный щит для Королевства.\n§G+10%§! Защита дивизии\n§G+10%§! Скорость укрепления\n§R-10%§! Скорость дивизии"
 SAU_sp_abrams_shock: "Броня: Шок и Прорыв"
 SAU_sp_abrams_shock_desc: "Быстрые, мощные бронетанковые удары, способные прорвать линию обороны противника.\n§G+10%§! Атака на центральную территорию\n§G+5%§! Скорость дивизии\n§R-5%§! Организация дивизии"
 SAU_sp_apache_antiarmor: "Армейская авиация: истребители танков"
 SAU_sp_apache_antiarmor_desc: "Охотники, вооруженные адским пламенем, уничтожат бронированное наступление.\n§G+7.5%§! Атака на центральную территорию\n§G+5%§! Атака дивизии\n§R-5%§! Получение опыта в воздухе"
 SAU_sp_apache_closeair: "Армейская авиация: непосредственная поддержка"
 SAU_sp_apache_closeair_desc: "Боевые вертолеты в небе обеспечивают стабилизацию и защиту наземных войск.\n§G+5%§! Организация подразделения\n§G+5%§! Коэффициент восстановления подразделения\n§R+10%§! Авиакатастрофы"
 SAU_sp_apache_recon: "Армейская авиация: разведка и рейды"
 SAU_sp_apache_recon_desc: "Взгляд вперед и молниеносные налеты вглубь линии фронта.\n§G+7.5%§! Скорость дивизии\n§G+5%§! Скорость планирования\n§R-5%§! Оборона дивизии"
 SAU_sp_arty_mass: "Артиллерия: массированный огонь"
 SAU_sp_arty_mass_desc: "Сокрушительные артиллерийские обстрелы, чтобы сокрушить врага, наплевав на снабжение.\n§G+10%§! Атака на центральную территорию\n§R+10%§! Расход снабжения"
 SAU_sp_arty_mobile: "Артиллерия: Стрельба и отступление"
 SAU_sp_arty_mobile_desc: "Обстрел и перемещение противника до того, как он сможет ответить.\n§G+5%§! Скорость дивизии\n§G+5%§! Организация дивизии\n§R-5%§! Защита дивизии"
 SAU_sp_arty_precision: "Артиллерия: высокоточный огонь"
 SAU_sp_arty_precision_desc: "Меньше, но более эффективные выстрелы по точно нужной цели.\n§G+7.5%§! Атака дивизии\n§G+5%§! Прирост опыта армии\n§R+5%§! Использование потребительских товаров"
 SAU_sp_awacs_control: "ДРЛО: Управление воздушным боем"
 SAU_sp_awacs_control_desc: "Операторы объединяют всех бойцов в одну смертоносную паутину.\n§G+10%§! Превосходство в воздухе\n§G+5%§! Получение опыта в авиации\n§R+3%§! Использование потребительских товаров"
 SAU_sp_awacs_earlywarn: "AWACS: Сеть раннего предупреждения"
 SAU_sp_awacs_earlywarn_desc: "Ни один рейд не пересекает границу незамеченным.\n§G+10%§! Противовоздушная оборона\n§R-5%§! Воздушная атака"
 SAU_sp_awacs_groundlink: "WACS: Объединенная наземная связь"
 SAU_sp_awacs_groundlink_desc: "Изображение сверху служит ориентиром для армии внизу.\n§G+5%§! Атака дивизии\n§G+5%§! Скорость планирования\n§R-5%§! Получение опыта в воздухе"
 SAU_sp_combat_armor: "Боевое оружие: Бронированный кулак"
 SAU_sp_combat_armor_desc: "Бронированный кулак в качестве наконечника копья.\n§G+7.5%§! Атака на основную территорию\n§G+5%§! Скорость дивизии\n§R+5%§! Расход снабжения"
 SAU_sp_combat_firepower: "Боевые виды вооружения: огневая мощь"
 SAU_sp_combat_firepower_desc: "Сокрушите врага мощным огнем.\n§G+7.5%§! Атака дивизии\n§R-5%§! Скорость дивизии"
 SAU_sp_combat_infantry: "Боевые подразделения: Профессиональная пехота"
 SAU_sp_combat_infantry_desc: "Квалифицированная, слаженная профессиональная пехота удерживает поле боя.\n§G+7.5%§! Дивизионная оборона\n§G+5%§! Организация подразделения\n§R-5%§! Атака на центральную территорию"
 SAU_sp_fleet_bluewater: "Военно-морской флот: стремление к плаванию в открытом море"
 SAU_sp_fleet_bluewater_desc: "Выйти за пределы Персидского залива в открытый океан.\n§G+15%§! Морской полигон\n§G+5%§! Атака крупных кораблей\n§R-5%§! Моральный дух флота"
 SAU_sp_fleet_coastal: "Военно-морской флот: береговая оборона"
 SAU_sp_fleet_coastal_desc: "Стена из небольших судов охраняет каждую гавань и риф.\n§G+5%§! Моральной дух\n§G+10%§! Защита прикрытия\n§R-5%§! Атака крупных кораблей"
 SAU_sp_fleet_gulf: "Военно-морской флот: контроль над морем в Персидском заливе"
 SAU_sp_fleet_gulf_desc: "Доминируйте в тесных, переполненных водах Персидского залива.\n§G+10%§! Атака прикрытия\n§G+5%§! Координация военно-морских сил\n§R-10%§! Дальность действия военно-морских сил"
 SAU_sp_pgm_interdiction: "Высокоточные управляемые боеприпасы: перехват на поле боя"
 SAU_sp_pgm_interdiction_desc: "Отрезать врагу тыл, прежде чем он сможет вступить в бой.\n§G+5%§! Организация подразделения\n§G+5%§! Атака с непосредственной авиационной поддержкой\n§R+10%§! Стоимость воздушной доктрины"
 SAU_sp_pgm_sead: "Высокоточные управляемые боеприпасы: противодействие в обороне"
 SAU_sp_pgm_sead_desc: "В первую очередь, необходимо ослепить и прорвать вражескую систему противовоздушной обороны.\n§G+7.5%§! Превосходство в воздухе\n§G+5%§! Воздушная атака\n§R-5%§! Ловкость в воздухе"
 SAU_sp_pgm_strike: "Высокоточные управляемые боеприпасы: высокоточный удар"
 SAU_sp_pgm_strike_desc: "Умные бомбы, которые уничтожают цель, не затрагивая остальные.\n§G+10%§! Атака с воздуха с непосредственной поддержкой\n§G+5%§! Атака с воздуха\n§R+5%§! Использование потребительских товаров"
 SAU_sp_posture_deterrence: "Позиция: Стратегическое сдерживание"
 SAU_sp_posture_deterrence_desc: "Сбалансированный щит, заставляющий любого агрессора дважды подумать.\n§G+5%§! Дивизионная защита\n§G+5%§! Противовоздушная оборона\n§G+5%§! Стабильность\n§R-5%§! Дивизионная атака"
 SAU_sp_posture_homeland: "Позиция: Оборона Родины"
 SAU_sp_posture_homeland_desc: "Всё обратилось внутрь, чтобы превратить Королевство в крепость.\n§G+10%§! Защита основной территории\n§G+5%§! Максимальное укрепление\n§R-5%§! Скорость дивизий"
 SAU_sp_posture_projection: "Поза: Проекция силы"
 SAU_sp_posture_projection_desc: "Военная сила, способная наносить удары на значительном расстоянии от дома.\n§G+5%§! Скорость дивизии\n§G+10%§! Дальность действия на море\n§G+5%§! Воздушная атака\n§R+5%§! Использование потребительских товаров"
 SAU_sp_redflag_bvr: "Воздух: за пределами видимости"
 SAU_sp_redflag_bvr_desc: "Убивайте издалека, прежде чем враг вас увидит.\n§G+7.5%§! Воздушная атака\n§G+5%§! Превосходство в воздухе\n§R+10%§! Стоимость воздушной доктрины"
 SAU_sp_redflag_defensive: "Воздушная оборона: Доктрина противовоздушной обороны"
 SAU_sp_redflag_defensive_desc: "Выживайте, выдержите и защищайте небо над Королевством.\n§G+10%§! Противовоздушная оборона\n§G+5%§! Ловкость в воздухе\n§R-5%§! Воздушная атака"
 SAU_sp_redflag_dogfight: "Воздушный бой: Мастерство воздушного боя"
 SAU_sp_redflag_dogfight_desc: "Развернись и сгори — домини в ближнем бою.\n§G+10%§! Ловкость в воздухе\n§G+5%§! Воздушная атака\n§R-5%§! Противовоздушная оборона"
 SAU_sp_reform_crash: "Реформа: ускоренная программа"
 SAU_sp_reform_crash_desc: "Реформируйте сейчас, реформируйте быстро — и плевать на любые потрясения.\n§G+10%§! Прирост армейского опыта\n§G+5%§! Организация дивизии\n§R-5%§! Стабильность"
 SAU_sp_reform_foreign: "Реформа: Иностранные подрядчики"
 SAU_sp_reform_foreign_desc: "Нанимайте иностранных экспертов, чтобы сделать это быстро и качественно — за определенную плату.\n§G-15%§! Время армейской подготовки\n§G+5%§! Получение армейского опыта\n§R-5%§! Приобретение политической власти"
 SAU_sp_reform_steady: "Реформа: методичное наращивание"
 SAU_sp_reform_steady_desc: "Терпеливая, упорядоченная реформа, которую армия сможет принять.\n§G+5%§! Организация подразделения\n§G+5%§! Коэффициент восстановления подразделения\n§R-3%§! Дивизионная атака"
 SAU_sp_sang_regime: "Национальная гвардия: Режимная гвардия"
 SAU_sp_sang_regime_desc: "В первую очередь, САНГ защищает трон и два священных города.\n§G+10%§! Защита основной территории\n§G+5%§! Стабильность\n§R-5%§! Атака дивизий"
 SAU_sp_sang_security: "Национальная гвардия: Внутренняя безопасность"
 SAU_sp_sang_security_desc: "Бдительная охрана от подрывной деятельности и беспорядков внутри страны.\n§G-25%§! Подрывная деятельность противника\n§G+5%§! Стабильность\n§R-5%§! Военная поддержка"
 SAU_sp_sang_tribal: "Национальная гвардия: Племенные ополчения"
 SAU_sp_sang_tribal_desc: "Верные племенные кадры пополняют ряды, хотя и не улучшают их мастерство.\n§G+10%§! Численность, пригодная для вербовки\n§G+5%§! Коэффициент восстановления дивизии\n§R-5%§! Организация дивизии"
 SAU_sp_sf_counterterror: "Спецназ: борьба с терроризмом"
 SAU_sp_sf_counterterror_desc: "Небольшой, но смертоносный отряд для освобождения заложников и борьбы с терроризмом.\n§G+10%§! Атака спецназа\n§G+5%§! Оборона спецназа\n§R-3%§! Кепка спецназа"
 SAU_sp_sf_raiders: "Спецназ: Глубокие рейдеры"
 SAU_sp_sf_raiders_desc: "Больше оперативников наносят глубокие удары, но это несколько снижает их живучесть.\n§G+5%§! Лимит спецназа\n§G+7.5%§! Атака спецназа\n§R-5%§! Защита спецназа"
 SAU_sp_sf_recon: "Спецназ: Разведка"
 SAU_sp_sf_recon_desc: "Безмолвные глаза, позволяющие всей армии видеть дальше.\n§G+5%§! Кепка спецназа\n§G+5%§! Скорость планирования\n§R-5%§! Атака спецназа"
 SAU_spirit_king_in_name: "Король по имени, наследник по званию"
 SAU_spirit_king_in_name_desc: "Монархия формально остается неизменной, в то время как наследный принц служит военным офицером под властью Совета. Этот компромисс позволяет избежать открытого разрыва между королевскими и военными институтами, не удовлетворяя при этом в полной мере ни одну из сторон."
 SAU_spirit_national_service: "Парады национальной службы"
 SAU_spirit_national_service_desc: "Дважды в год на улице короля Фахда проходят военные парады, в которых участвуют бронетехника, школьные группы и проводятся прямые трансляции, чтобы заручиться общественной поддержкой национальной службы. Их постановочный характер не препятствует высокой посещаемости."
 SAU_spirit_officer_housing: "Программа предоставления жилья офицерам"
 SAU_spirit_officer_housing_desc: "Правительство в ускоренном темпе строит жилье, школы и клиники для офицеров и их семей. Эти льготы укрепляют лояльность офицерского корпуса режиму."
 SAU_spirit_officer_purge: "Чистка офицерского корпуса"
 SAU_spirit_officer_purge_desc: "Офицеры, которые колебались во время захвата власти, были отправлены в отставку, в то время как те, кто его поддерживал, сохранили командование. Чистка сократила численность армии, но сделала оставшийся офицерский корпус более послушным."
 SAU_spirit_public_accounts: "Государственная финансовая отчетность Совета"
 SAU_spirit_public_accounts_desc: "Впервые в истории Саудовской Аравии министерства начали публиковать данные о своих расходах. Эта политика вызвала недовольство семей, которые извлекали выгоду из сохранения секретности, но пользуется большой популярностью у населения."
 SAU_spirit_quincy_reaffirmed: "Понимание Куинси"
 SAU_spirit_quincy_reaffirmed_desc: "Соединенные Штаты и Совет Безопасности продолжают неофициальное соглашение по вопросам нефти и безопасности, впервые заключенное в 1945 году. Американские войска защищают судоходство в Персидском заливе, в то время как саудовские танкеры поставляют продукцию на мировые рынки, и оба правительства предпочитают оставить соглашение без официального оформления."
 SAU_spirit_security_directorate: "Управление безопасности"
 SAU_spirit_security_directorate_desc: "Совет объединил архивы Мабахита, сети Министерства внутренних дел и военную разведку в едином управлении под руководством одного генерала. Его широкие полномочия по наблюдению делают его эффективным, но при этом вызывающим широкое недоверие."
 SAU_spirit_unbeholden: "Королевство Без Покровителей"
 SAU_spirit_unbeholden_desc: "Саудовская Аравия отвергла иностранные гарантии безопасности и размещение гарнизонов. Теперь она закупает собственные средства противовоздушной обороны и обучает собственных офицеров, добиваясь независимости ценой очень высоких финансовых затрат."
 SAU_succession_instability: "§RНестабильность преемственности§!"
 SAU_succession_instability_desc: "Король Фахд недееспособен после перенесенного инсульта в 1995 году, в результате чего наследный принц Абдулла стал фактическим правителем. Королевский двор разделен между сторонниками Абдуллы и влиятельной фракцией Судаири, что создает атмосферу политической неопределенности. До тех пор, пока вопрос о престолонаследии не будет официально решен, процесс принятия решений в королевстве остается парализованным межфракционными распрями."
 SAU_syria_landbridge_severed: "Иран разорвал сухопутный мост"
 SAU_syria_landbridge_severed_desc: "Дружелюбное правительство в Дамаске перекрыло сухопутный путь Тегерана к «Хезболле». Эта стратегическая победа воодушевляет Королевство и стабилизирует ситуацию в стране."
 SAU_syria_pipeline_t1: "Трубопровод Левант (первый уровень)"
 SAU_syria_pipeline_t1_desc: "Саудовская нефть поступает через Иорданию и Сирию в Средиземное море, бросая вызов российскому газу у ворот Европы. §GДополнительный доход: $3,50 млрд§! от экспорта по трубопроводу против §RДополнительных расходов: $2,00 млрд§! на транзитные сборы странам, через которые проходит линия, — чистыми §G+$1,50 млрд§! в неделю. Саботаж понижает линию на один уровень, срезая и то и другое; перерезанная линия 1-го уровня закрывает маршрут."
 SAU_syria_pipeline_t2: "Трубопровод Левант (второй уровень)"
 SAU_syria_pipeline_t2_desc: "Саудовская нефть поступает через Иорданию и Сирию в Средиземное море, бросая вызов российскому газу у ворот Европы. §GДополнительный доход: $4,25 млрд§! от экспорта по трубопроводу против §RДополнительных расходов: $2,30 млрд§! на транзитные сборы странам, через которые проходит линия, — чистыми §G+$1,95 млрд§! в неделю. Саботаж понижает линию на один уровень, срезая и то и другое; перерезанная линия 1-го уровня закрывает маршрут."
 SAU_syria_pipeline_t3: "Трубопровод Левант (третий уровень)"
 SAU_syria_pipeline_t3_desc: "Саудовская нефть поступает через Иорданию и Сирию в Средиземное море, бросая вызов российскому газу у ворот Европы. §GДополнительный доход: $5,00 млрд§! от экспорта по трубопроводу против §RДополнительных расходов: $2,50 млрд§! на транзитные сборы странам, через которые проходит линия, — чистыми §G+$2,50 млрд§! в неделю. Саботаж понижает линию на один уровень, срезая и то и другое; перерезанная линия 1-го уровня закрывает маршрут."
 SAU_syrian_quagmire: "Сирийское болото"
 SAU_syrian_quagmire_desc: "Многолетняя поддержка безуспешной войны в Сирии привела к сокращению как общественной поддержки, так и доступных средств из государственного бюджета. Сирийское правительство остается у власти, несмотря на расходы Королевства."
 SAU_tadawul_market: "§GTadawul, Саудовская фондовая биржа LVL 0§!"
 SAU_tadawul_market_desc: "Он §LСаудовская фондовая биржа§! Рынок находится на начальной стадии развития, основные торговые и регуляторные функции уже налажены. Завершение соответствующих направлений позволит углубить рынок и увеличить его экономические выгоды."
 SAU_tadawul_market_t1: "§GTadawul, Саудовская фондовая биржа LVL 1§!"
 SAU_tadawul_market_t10: "§GTadawul, Саудовская фондовая биржа LVL 10§!"
 SAU_tadawul_market_t10_desc: "Программа реформ завершена, все запланированные законы, регулирующие органы и списки уже приняты. §LТадавул§! теперь это §Gкрупнейшая биржа в регионе MENA§!с рыночной капитализацией, превышающей суммарную капитализацию всех остальных бирж арабского мира."
 SAU_tadawul_market_t1_desc: "Первый этап реформы Tadawul улучшил функционирование рынка и укрепил доверие инвесторов. Дальнейшее развитие проекта будет сосредоточено на соответствующих направлениях."
 SAU_tadawul_market_t2: "§GTadawul, Саудовская фондовая биржа LVL 2§!"
 SAU_tadawul_market_t2_desc: "На бирже Tadawul размещается все больше компаний, объемы торгов растут, что приводит к увеличению поступлений от офисных и корпоративных налогов."
 SAU_tadawul_market_t3: "§GTadawul, Саудовская фондовая биржа LVL 3§!"
 SAU_tadawul_market_t3_desc: "Три этапа реформы Tadawul позволили бирже расширить доступ к капиталу и увеличить ее вклад в государственные доходы."
 SAU_tadawul_market_t4: "§GTadawul, Саудовская фондовая биржа LVL 4§!"
 SAU_tadawul_market_t4_desc: "В настоящее время Tadawul финансирует как гражданскую промышленность, так и компании, акции которых котируются на бирже, а ужесточение регулирования повышает доверие инвесторов и стабильность."
 SAU_tadawul_market_t5: "§GTadawul, Саудовская фондовая биржа LVL 5§!"
 SAU_tadawul_market_t5_desc: "Компания Tadawul завершила половину своей программы реформ, продемонстрировав рост торговой активности, выручки и доверия инвесторов."
 SAU_tadawul_market_t6: "§GTadawul, Саудовская фондовая биржа LVL 6§!"
 SAU_tadawul_market_t6_desc: "Шесть этапов реформ расширили роль Tadawul в финансировании саудовских предприятий и привлечении инвестиций."
 SAU_tadawul_market_t7: "§GTadawul, Саудовская фондовая биржа LVL 7§!"
 SAU_tadawul_market_t7_desc: "В результате семи этапов реформ Tadawul превратилась в зрелую региональную биржу со значительным капиталом под управлением."
 SAU_tadawul_market_t8: "§GTadawul, Саудовская фондовая биржа LVL 8§!"
 SAU_tadawul_market_t8_desc: "Зрелый Tadawul направляет капитал в строительство и промышленность, предоставляя правительству большее влияние на экономическую политику."
 SAU_tadawul_market_t9: "§GTadawul, Саудовская фондовая биржа LVL 9§!"
 SAU_tadawul_market_t9_desc: "Город Тадавул приближается к стадии полного развития, генерирует высокие налоговые поступления от корпоративного и промышленного секторов и играет все более значительную роль в национальной экономической политике."
 SAU_tenth_five_year_plan: "Десятый пятилетний план"
 SAU_tenth_five_year_plan_desc: "Министерство экономики и планирования выпускало пятилетние планы с 1970 года, но многие из них функционировали в основном как заявления о намерениях. Этот план предусматривает полное финансирование портов, железных дорог, кольцевых дорог и реформ министерства.\n\n§GДлится пять лет§!."
 SAU_vision_2030_delivered: "Видение 2030: Реализовано"
 SAU_vision_2030_delivered_desc: "В рамках программы «Видение 2030» были реализованы крупные строительные проекты и проекты диверсификации экономики, включая проект NEOM, реконструкцию Эр-Рияда и создание новых туристических объектов. Теперь Саудовская Аравия меньше зависит от сырой нефти."
 SAU_vision_2030_expectations: "Видение 2030: Обещание"
 SAU_vision_2030_expectations_desc: "Объявление о мегапроектах в рамках программы «Видение 2030» привлекло инвестиции и укрепило доверие общественности. Однако их масштаб также влечет за собой значительные бюджетные и политические издержки до завершения обещанных проектов."
 SAU_vision_2030_progress: "Видение 2030: обретает форму"
 SAU_vision_2030_progress_desc: "Строительство ведётся по всему Королевству, и первые проекты в рамках программы «Видение 2030» уже введены в эксплуатацию. Этот видимый прогресс снизил сомнения общественности в отношении программы."
 SAU_vision_2030_white_elephant: "Видение 2030: Белые слоны"
 SAU_vision_2030_white_elephant_desc: "Программа «Видение 2030» не была завершена к установленному сроку, в результате чего крупные проекты остались незавершенными или неиспользованными после того, как на них были потрачены сотни миллиардов долларов. Этот провал подтвердил правоту критиков программы и подорвал доверие к ее руководству."
 SAU_water_crisis_01: "§HУправляемый водный кризис§!"
 SAU_water_crisis_01_desc: "Расширение масштабов опреснения, повышение эффективности сельскохозяйственной политики и снижение потребления воды населением позволили свести водный кризис к минимуму. §Gуправляемый§! уровень. Королевство по-прежнему сталкивается со структурной нехваткой воды, но поставки остаются надежными."
 SAU_water_crisis_02: "§HСерьезный водный кризис§!"
 SAU_water_crisis_02_desc: "Саудовская Аравия осушает §LСак§! и §LВаджид§! Ископаемые водоносные горизонты истощаются быстрее, чем происходит их восполнение. Сельское хозяйство потребляет большую часть оставшихся подземных вод, а зависимость от опреснения повышает уровень воды. §Yзатраты на потребительские товары§!уменьшает §Yэффективность§!и ослабляет §Yобщественное терпение§!."
 SAU_yemen_attack_buff: "Скоординированное наступление"
 SAU_yemen_attack_buff_desc: "Планирование и огневая поддержка со стороны Саудовской Аравии обеспечивают нашим силам решающее преимущество в атаке. Увеличение атаки против хуситов на 15%."
 SAU_yemen_pipeline_t1: "Аравийский морской трубопровод (первый уровень)"
 SAU_yemen_pipeline_t1_desc: "Саудовская нефть течет на юг через Аль-Махру в Аравийское море, минуя Ормузский пролив. §GДополнительный доход: $2,00 млрд§! от экспорта по трубопроводу против §RДополнительных расходов: $1,00 млрд§! на транзитные сборы странам, через которые проходит линия, — чистыми §G+$1,00 млрд§! в неделю. Саботаж понижает линию на один уровень, срезая и то и другое; перерезанная линия 1-го уровня закрывает маршрут."
 SAU_yemen_pipeline_t2: "Аравийский морской трубопровод (второго уровня)"
 SAU_yemen_pipeline_t2_desc: "Саудовская нефть течет на юг через Аль-Махру в Аравийское море, минуя Ормузский пролив. §GДополнительный доход: $2,50 млрд§! от экспорта по трубопроводу против §RДополнительных расходов: $1,15 млрд§! на транзитные сборы странам, через которые проходит линия, — чистыми §G+$1,35 млрд§! в неделю. Саботаж понижает линию на один уровень, срезая и то и другое; перерезанная линия 1-го уровня закрывает маршрут."
 SAU_yemen_pipeline_t3: "Аравийский морской трубопровод (третий уровень)"
 SAU_yemen_pipeline_t3_desc: "Саудовская нефть течет на юг через Аль-Махру в Аравийское море, минуя Ормузский пролив. §GДополнительный доход: $3,00 млрд§! от экспорта по трубопроводу против §RДополнительных расходов: $1,25 млрд§! на транзитные сборы странам, через которые проходит линия, — чистыми §G+$1,75 млрд§! в неделю. Саботаж понижает линию на один уровень, срезая и то и другое; перерезанная линия 1-го уровня закрывает маршрут."
 SAU_baath_state: "Арабская партия Баас"
 SAU_baath_state_tt: "§YЕдинство, свобода, социализм.§!\n\nПартия является авангардом арабской нации, объединяя офицера и рабочего, феллаха и студента в единую революционную волю. Каждая граница — лишь перевалочный пункт на пути к единой арабской родине."
 SAU_communist_state: "Социалистическое государство"
 SAU_communist_state_tt: "Диктатура пролетариата в Аравии. Эти достижения сохраняются только до тех пор, пока правит Коммунистическая партия Саудовской Аравии. В случае потери власти они исчезают."
 SAU_Military_Rule: "Военное правление"
 SAU_Monarchy_house_of_al_saud: "Дом Аль Саудов"
 SAU_nda_state: "Национальное демократическое собрание"
 SAU_nda_state_tt: "С каждой реформой, одержанной на выборах, институты либеральной республики укрепляются."
 SAU_nlf_doctrine: "Социализм неприсоединения"
 SAU_nlf_doctrine_tt: "§Y Арабский путь к социализму (только для Фронта национального освобождения): §!\n§G +15% прирост политической власти, +10% поддержка войны §!"
 SAU_peoples_council_works: "Муниципальные общественные работы"
 SAU_peoples_council_works_tt: "По заказу §YНародный совет§! и построен в соответствии со своими стандартами"
 SAU_rep_shia_hardline_doctrine: "Революционная теократия"
 SAU_rep_shia_hardline_doctrine_tt: "«Хезболла Аль-Хиджаз» правит от имени юриста, мобилизованного на сопротивление народа."
 SAU_rep_shia_moderate_doctrine: "Реформистское управление"
 SAU_rep_shia_moderate_doctrine_tt: "Реформистское движение управляет страной посредством примирения, социального обеспечения и голосования."
 SAU_rep_shia_state: "Шиитская Республика"
 SAU_rep_shia_state_tt: "Институты шиитской республики укрепляются с каждой проведенной реформой и каждой одержанной победой."
 SAU_scp_doctrine: "Марксистско-ленинский авангард"
 SAU_scp_doctrine_tt: "§YПравославный марксизм-ленинизм (только для Коммунистической партии Саудовской Аравии):§!\n§G+10% эффективности производства, +10% скорости строительства, +5% стабильности§!"
 SAU_arab_consensus: "Арабский консенсус против нормализации"
 SAU_arab_shield_bond: "Братья Арабского Щита"
 SAU_beijing_agreement: "Пекинское соглашение"
 SAU_betrayed_palestine: "Отказался от палестинского дела"
 SAU_boycott_israel: "Бойкотировать"
 SAU_cause_solidarity: "Солидарность с Палестиной"
 SAU_egypt_economic_ties: "Саудовская экономическая поддержка"
 SAU_egypt_military_ties: "Саудовское военное покровительство"
 SAU_egypt_partnership: "Саудовско-египетское партнерство"
 SAU_exposed_iran: "Разоблаченное вмешательство в дела Йемена"
 SAU_iraq_friendship: "Саудовско-иракская дружба"
 SAU_islamic_rivalry: "Исламское соперничество"
 SAU_islamic_rivalry_tt: "[PER.GetFlag]§RНачинается борьба за исламский мир.§!"
 SAU_israel_normalization: "Нормализация отношений"
 SAU_proxy_aggression: "Спонсор террора"
 SAU_quincy_reaffirmed: "Соглашение с Куинси подтверждено."
 SAU_recognition_anger: "Признание палестинской государственности"
 SAU_recognized_palestine: "Признанная Палестина"
 SAU_taif_spirit: "Дух Таифа"
 SAU_talks_collapsed: "Провал переговоров о нормализации отношений"
 SAU_two_state_champion: "Сторонник решения проблемы на основе принципа двух государств"
 HOU_break_ceasefire_category: "Саудовское соглашение о прекращении огня"
 HOU_drop_north_yemen_name: "Вернем Йемену былое имя"
 HOU_drop_north_yemen_name_desc: "Отбросим в сторону идентичность Северного Йемена и снова будем править под своим собственным знаменем."
 PER_houthi_militia: "Мобилизация народного ополчения"
 PER_houthi_militia_desc: "Мобилизация сторонников из числа племен для обеспечения движения хуситов дополнительной рабочей силой по низкой цене."
 PER_houthi_old_weapons: "Контрабанда оружия хуситам"
 PER_houthi_old_weapons_desc: "Переправить партию старых винтовок через Красное море и через границу бойцам-хуситам."
 PER_houthi_raise_brigade: "Укрепить оборону"
 PER_houthi_raise_brigade_desc: "Отправьте инженеров Корпуса стражей исламской революции, чтобы они загнали хуситов в горы. Вытеснить их с занимаемой ими территории будет гораздо сложнее."
 PER_houthi_support_category: "Поддержите хуситов"
 SAU_abdullah_kaec_construction: "Ускоренное строительство KAEC"
 SAU_abdullah_kaec_construction_desc: "Ускорить строительство Экономического города имени короля Абдаллы, отменив требования к выдаче разрешений и наняв дополнительных подрядчиков вдоль побережья Красного моря."
 SAU_abdullah_kasp_scholarship: "Продлить стипендию KASP для обучения за рубежом"
 SAU_abdullah_kasp_scholarship_desc: "Расширить программу государственных стипендий для обучения за рубежом, чтобы больше саудовских студентов могли изучать предметы, по которым в Королевстве не хватает квалифицированных специалистов. Полученное ими образование укрепит местный рынок труда после их возвращения."
 SAU_abdullah_kaust_grants: "Финансирование грантов KAUST в области высоких технологий"
 SAU_abdullah_kaust_grants_desc: "Предоставить KAUST крупные исследовательские гранты для привлечения ведущих специалистов и создания передовых лабораторий в Тувале."
 SAU_abdullah_national_dialogue: "Созыв национальных диалоговых форумов"
 SAU_abdullah_national_dialogue_desc: "Объединить духовенство, реформаторов, представителей шиитов и женщин на национальных диалоговых форумах. Эти встречи предоставят исключенным группам формальный канал для выражения своих опасений."
 SAU_abdullah_sang_subsidies: "Субсидии на модернизацию SANG"
 SAU_abdullah_sang_subsidies_desc: "Субсидировать контракты на поставку новой техники для Национальной гвардии Саудовской Аравии, снизив затраты на ее модернизацию и укрепив ее лояльность правительству."
 SAU_Among_Major_powers_Open_east: "Открыть §RСотрудничество с Востоком§! Решения"
 SAU_appoint_provincial_governor: "Назначить губернатора провинции"
 SAU_appoint_provincial_governor_desc: "Должность губернатора вакантна. Выберите провинцию на карте, и Совет решит, кто её займет.\n\nКаждая провинция может быть передана один раз."
 SAU_arm_arab_revolutionaries: "Вооружите арабских революционеров"
 SAU_arm_arab_revolutionaries_desc: "Поставлять винтовки и подготовленных организаторов коммунистическим движениям, действующим в других арабских странах."
 SAU_arm_lebanese_army: "Вооружите ливанскую армию"
 SAU_arm_lebanese_army_desc: "Обеспечить ливанскую армию саудовским оружием и подготовкой, чтобы она могла действовать независимо от «Хезболлы»."
 SAU_back_mbn: "Назад Мохаммед бин Найеф"
 SAU_back_mbn_desc: "Поддержите министра внутренних дел, архитектора антитеррористического государства Королевства и любимца Вашингтона. Поддержка кандидата обязывает двор поддерживать его дело на протяжении всей последующей передачи власти."
 SAU_back_mbn_heir: "Назад Мохаммед бин Найеф"
 SAU_back_mbn_heir_desc: "Поддержите наследного принца Мухаммеда бин Найефа, основываясь на его службе в Министерстве внутренних дел, достижениях в борьбе с терроризмом и прочных отношениях с Вашингтоном."
 SAU_back_mbs_heir: "Назад к Мухаммеду бин Салману"
 SAU_back_mbs_heir_desc: "Поддержите Мухаммеда бин Салмана, молодого сына короля, в его стремлении укрепить свою власть над растущим числом министерств, несмотря на ограниченный опыт."
 SAU_back_mutaib: "Назад Мутаиб бин Абдулла"
 SAU_back_mutaib_desc: "Поддержите сына короля Абдаллы, командующего Национальной гвардией и наследника племенных династий своего отца. Поддержка кандидата обязывает двор поддерживать его дело на протяжении всей дальнейшей линии престолонаследия."
 SAU_back_salman: "Назад Салман бин Абдулазиз"
 SAU_back_salman_desc: "Поддержите старшего принца Судаири и многолетнего губернатора Эр-Рияда. Поддержка кандидата обязывает двор поддерживать его дело на протяжении всей последующей линии престолонаследия."
 SAU_bahrain_restore_khalifa: "Восстановить Дом Халифы"
 SAU_bahrain_restore_khalifa_desc: "Развернуть силы по обе стороны дамбы для восстановления власти Дома Халифа в Бахрейне, если он потеряет власть.\n\n§YДоступно, когда§! Бахрейн больше не управляется династией Халифов.\n\n§GВосстанавливает власть династии Халифов§!, исключает Бахрейн из любой фракции, кроме нашей, и подчиняет его §YПолуостровному щиту§!.\n\n§R-$15 млрд, -2% стабильности§! и отношения с Тегераном пострадают. §G+5% поддержки войны§!."
 SAU_bop_note: "§HКак меняется будущее Королевства§!"
 SAU_bop_note_desc: "Он §HБудущее Королевства§! Баланс нельзя изменить напрямую посредством принятия решения. Он меняется в результате §Lзавершены фокусы§! в Тадавуле, САГИИ и других отделениях, а также через §Lключевые события§! и короля §Lреформы§!."
 SAU_break_houthi_ceasefire: "Нарушить перемирие"
 SAU_break_houthi_ceasefire_desc: "Разорвите перемирие с хуситами и возобновите операцию «Решительный шторм»."
 SAU_broadcast_revolution: "Транслируйте революцию"
 SAU_broadcast_revolution_desc: "Используйте радио «Свободная Аравия» для распространения поддержки коммунистического режима среди рабочих и других недовольных групп в арабских странах."
 SAU_coalition_member_arm_yemen: "Вооружите Республику"
 SAU_coalition_member_arm_yemen_desc: "Оружие и люди были отправлены признанному правительству от нашего имени, а не от имени Эр-Рияда.\n\n§GЙемен получает 1500 единиц пехотного вооружения, 8000 человек личного состава и армейский опыт.§!Повторять каждые 30 дней."
 SAU_coalition_member_category: "Йеменская коалиция"
 SAU_coalition_member_leave: "Выход из коалиции"
 SAU_coalition_member_leave_desc: "Выйти из возглавляемой Саудовской Аравией коалиции и прекратить наше участие в ее кампании в Йемене.\n\n§RЭр-Рияд теряет партнера по коалиции и воспринимает это как личную обиду.§!; §G+50 политической власти, +3% стабильности§!."
 SAU_coalition_member_strike: "Выполнить наш вылет"
 SAU_coalition_member_strike_desc: "Наша доля в воздушном боевом нападении была направлена против провинции, контролируемой хуситами.\n\n§RНаносит ущерб инфраструктуре, оружейной промышленности и противовоздушной обороне.§! в целевой провинции. Повторять каждые 21 день."
 SAU_communist_invite_to_comintern: "Пригласить [FROM.GetName] в Арабский Коминтерн"
 SAU_communist_invite_to_comintern_desc: "Пригласите [FROM.GetName] присоединиться к Арабскому Коминтерну. Рабочее государство не обязательно должно быть освобождено силой; оно может принять или отклонить приглашение."
 SAU_communist_seize_power: "Начните социалистическую революцию в [FROM.GetName]"
 SAU_communist_seize_power_desc: "Там, где рабочие контролируют улицы, объявляйте забастовку. При подавляющей поддержке старый режим падает; там, где движение просто сильно, страна погружается в революционную гражданскую войну."
 SAU_council_national_service: "Парады национальной службы"
 SAU_council_national_service_desc: "Проведите военный парад на улице имени короля Фахда, который будет транслироваться по национальному телевидению, с участием представителей городского совета. Это мероприятие призвано способствовать укреплению общественной поддержки вооруженных сил и нового правительства."
 SAU_council_officer_housing: "Программа предоставления жилья офицерам"
 SAU_council_officer_housing_desc: "Построить жилые комплексы, школы и клиники для офицерского корпуса. Это улучшит военную поддержку Совета, но отвлечет государственные средства от других нужд."
 SAU_council_officer_purge: "Провести чистку офицерского корпуса"
 SAU_council_officer_purge_desc: "Уволить офицеров, чья лояльность во время захвата власти вызывала сомнения, и отстранить от должности других, выявленных в ходе последующего расследования. Армия станет меньше, но более надежной."
 SAU_council_public_accounts: "Опубликовать публичную отчетность"
 SAU_council_public_accounts_desc: "Опубликовать отчеты министерств, чтобы продемонстрировать приверженность Совета принципам прозрачности управления. Это улучшит его репутацию честного органа, но ограничит дискреционные расходы, ранее использовавшиеся для неформальных договоренностей."
 SAU_council_security_directorate: "Создать Управление безопасности"
 SAU_council_security_directorate_desc: "Объединить сети Мабахита, Министерства внутренних дел и военной разведки под эгидой единого управления. Централизованная отчетность улучшит возможности Совета по мониторингу угроз на всей территории Королевства."
 SAU_councils_category: "Советы Королевства"
 SAU_councils_category_desc: "§HМаджлис аш-Шура§! - [ROOT.GetSAUShuraBench]\n§OУлема§! [?SAU_shura_ulema|0] §YТехнократы§! [?SAU_shura_technocrats|0] §GИзвестные лица§! [?SAU_shura_notables|0]\n§HНародный совет§! - [ROOT.GetSAUPCStanding], [ROOT.GetSAUPCBloc]\n§OРеформисты§! [?SAU_pc_reformists|0] §YТрадиционалисты§! [?SAU_pc_traditionalists|0] §GПровинциалы§! [?SAU_pc_provincials|0]\n\nВ Эр-Рияде теперь заседают две палаты, и ни одна из них не может принудить короля к чему-либо.\n\n§HНазначается Меджлис аш-Шура§!, который дает советы по любым порученным ему вопросам. Тот, кто занимает больше всего мест на скамейке, определяет её характер, и этот характер чего-то стоит:\n§OУлема-лидер§! §G+8% стабильности, +10% защиты от дрейфа§! / §R-5% исследований, -5% миграции§!\n§YТехнократ-лидер§! §G+8% исследований, +6% производительности офиса, +5% эффективности§! / §R-5% стабильности§!\n§GВыдающийся лидер§! §G+8% политической власти, -8% стоимости коррупции§! / §R+3% потребительских товаров, -3% поддержки войны§!\n\n§YРасположите скамью более чем на 70 мест, и Король сможет навсегда утвердить устав Совета.§! Устав удваивает характеристики этой скамьи, фиксирует ее в Основном законе и навсегда прекращает борьбу — количество мест перестает что-либо решать. Откажитесь, и все три скамьи обнуляются до 40, при этом палата остается вашей для перебалансировки.\n\n§HНародный совет§! отвечает сверху вниз. Это первый орган в истории Королевства, который говорит от имени управляемых, а не к ним, и он может принимать законы по внутренним делам. Король сохраняет право вето, и §Rкаждое его использование стоит стабильности и поддержки войны§!."
 SAU_crown_prince_category: "наследный принц"
 SAU_cyber_defensive_op: "Оборонительная кибер-операция"
 SAU_cyber_defensive_op_desc: "Укрепить Королевство и саботировать наступательные системы цели для §Y90 дней§!Их войска сражаются. §YНа 10% слабее в атаке§! против нас, в то время как GIP защищает наши собственные сети. Требуется §G70%§! сеть на целевом объекте."
 SAU_cyber_offensive_op: "Наступательная кибер-операция"
 SAU_cyber_offensive_op_desc: "Превратите сеть в оружие. §Y90 дней§! Кибератака GIP парализовала командование и оборону цели: их подразделения ведут бои. §YНа 10% слабее в обороне§! и их отрасль застопорилась. Требуется §G70%§! сеть на целевом объекте."
 SAU_debug_bop_left: "§Y(DEBUG) Сдвиг в сторону традиционализма§!"
 SAU_debug_bop_left_desc: "Только для моддеров/отладчиков. Сдвигает баланс §HKingdom's Future§! §R-0.05 влево§! (в сторону традиционализма). Видно только при запуске игры с параметром -debug."
 SAU_debug_bop_right: "§Y(DEBUG) Сдвиг в сторону либерализации§!"
 SAU_debug_bop_right_desc: "Только для моддеров/отладчиков. Изменяет §HБудущее Королевства§! баланс §G+0,05 вправо§! (в направлении либерализации). Видно только при запуске игры с параметром -debug."
 SAU_debug_category: "ОТЛАДКА - Наследство Саудовской Аравии"
 SAU_debug_clear_decree_lock: "ОТЛАДКА: Снять блокировку, наложенную 60-дневным постановлением."
 SAU_debug_clear_decree_lock_desc: "Сбрасывает флаг SAU_royal_decree_active, чтобы решения правящего монарха можно было принимать снова немедленно, без ожидания 60 дней."
 SAU_debug_drain_salman_health: "ОТЛАДКА: Уменьшить здоровье короля Салмана"
 SAU_debug_drain_salman_health_desc: "Устанавливает значение SAU_salman_health равным 0. Цепочка восшествия на престол запускается при следующем ежемесячном обновлении, коронуя того, кто в данный момент является наследным принцем."
 SAU_debug_faisalite_conviction_up: "(ОТЛАДКА) Убеждение сторонников Фейсала +25"
 SAU_debug_faisalite_conviction_up_desc: "Добавляет 25 очков убежденности и переоценивает уровень. Повторите, чтобы достичь 45 и 75."
 SAU_debug_faisalite_open: "(DEBUG) Открыть цепочку Faisalite"
 SAU_debug_faisalite_open_desc: "Запускает мероприятие по случаю саммита в Мекке, которое запускает всю цепочку, без ожидания 140 дней."
 SAU_debug_faisalite_pivot: "(ОТЛАДКА) Запустить механизм переориентации на Ирак"
 SAU_debug_faisalite_pivot_desc: "Запускает ключевой механизм американской оккупации независимо от военной ситуации."
 SAU_debug_faisalite_readout: "(ОТЛАДКА) Фейсалист: [ROOT.GetSAUFaisaliteConviction]"
 SAU_debug_faisalite_readout_desc: "§HУбеждение§!: §Y[?SAU_faisalite_conviction|0]§! из §Y100§!\n§HСоциальный консерватизм в месяц§!: §Y[?SAU_social_conservatism|0]§!\n§HУровень§!: [ROOT.GetSAUFaisaliteConviction]"
 SAU_debug_grievance_open: "(ОТЛАДКА) Открыть цепочку переворотов"
 SAU_debug_grievance_open_desc: "Устанавливает флаг, знаменующий собой нефтяной кризис 2008 года, и инициирует событие, связанное с жалобами офицеров, которое запускает эту цепочку, не дожидаясь 2008 года."
 SAU_debug_grievance_readout: "(DEBUG) Офицеры: [ROOT.GetSAUArmyGrievance]"
 SAU_debug_grievance_readout_desc: "§HGrievance§!: §Y[?SAU_army_grievance|0]§! of §Y100§!\n[ROOT.GetSAUArmyGrievanceEffect]\n§HGuard shielded§! (удваивает ежемесячную ставку): проверяется флагом SAU_sang_shielded."
 SAU_debug_grievance_up: "(ОТЛАДКА) Жалоба офицера +25"
 SAU_debug_grievance_up_desc: "Добавляет 25 жалоб и переоценивает уровень. Повторяйте, чтобы преодолеть отметку в 50 (приказ о развертывании) и 75 (переворот)."
 SAU_debug_junta_legitimacy_up: "(ОТЛАДКА) Легитимность хунты +25"
 SAU_debug_junta_legitimacy_up_desc: "Повышает авторитет Совета, чтобы гарантировать завершение кризиса, а не его истечение по истечении установленного времени."
 SAU_debug_junta_legitimacy_zero: "(DEBUG) Легитимность хунты до 0"
 SAU_debug_junta_legitimacy_zero_desc: "Это приводит к ликвидации Совета, и кризис легитимности активизируется при следующей проверке."
 SAU_debug_junta_open: "(ОТЛАДКА) Принудительное проведение офицерского переворота"
 SAU_debug_junta_open_desc: "Активирует цепочку обработки жалоб и немедленно запускает событие захвата."
 SAU_debug_king_abdullah: "ОТЛАДКА: Коронованный король Абдулла"
 SAU_debug_king_abdullah_desc: "Устанавливает значение SAU_current_king равным 1, назначает Абдуллу главой страны и возобновляет борьбу за престолонаследие времен Абдуллы (Салман 45 / МБН 30 / Мутаиб 25)."
 SAU_debug_king_mbn: "ОТЛАДКА: Корона Мохаммед бин Найеф"
 SAU_debug_king_mbn_desc: "Устанавливает значение SAU_current_king равным 3 и назначает Мохаммеда бин Найефа главой страны."
 SAU_debug_king_mbs: "ОТЛАДКА: Корона Мухаммед бин Салман"
 SAU_debug_king_mbs_desc: "Устанавливает значение SAU_current_king равным 5 и назначает Мухаммеда бин Салмана главой страны."
 SAU_debug_king_mutaib: "ОТЛАДКА: Корона Мутаиба бин Абдуллы"
 SAU_debug_king_mutaib_desc: "Устанавливает значение SAU_current_king равным 4 и назначает Мутаиба бин Абдуллу главой страны."
 SAU_debug_king_salman: "ОТЛАДКА: Коронованный король Салман"
 SAU_debug_king_salman_desc: "Устанавливает значение SAU_current_king равным 2, назначает Салмана главой страны, обнуляет его здоровье до 100 и открывает борьбу между наследным принцем МБС и МБН."
 SAU_debug_oil_dep_readout: "(DEBUG) Зависимость от нефти: [?oil_dependence|0] (четверть такта [?SAU_oil_dep_quarter|0]/3)"
 SAU_debug_oil_dep_readout_desc: "Считывает значение зависимости и показывает, насколько далеко оно находится в пределах трехмесячного интервала."
 SAU_debug_pc_open: "(ОТЛАДКА) Создать Народный совет"
 SAU_debug_pc_open_desc: "Устанавливает флаг и рассаживает членов палаты в соотношении 40/40/40, стоя по 50 очков, без фокусировки."
 SAU_debug_pc_readout: "(ОТЛАДКА) Государство Народного Совета"
 SAU_debug_pc_readout_desc: "§HOpen§! (SAU_peoples_council_open, set by SAU_establish_the_peoples_council)\n§HStanding§!: §Y[?SAU_pc_standing|0]§! - Для общественных работ требуется 60+\n§HSeats§! - реформисты §Y[?SAU_pc_reformists|0]§!, традиционалисты §Y[?SAU_pc_traditionalists|0]§!, провинциалы §Y[?SAU_pc_provincials|0]§! - для выступления требуется 21+\n§HVetoes used§!: §Y[?SAU_pc_vetoes|0]§!"
 SAU_debug_pc_reset_cycle: "(DEBUG) Очистить флаги сессии"
 SAU_debug_pc_reset_cycle_desc: "Сбрасывает состояния SAU_pc_debate_ongoing и SAU_pc_doing_bill, если сессия зависает."
 SAU_debug_pc_standing_up: "(ОТЛАДКА) Рейтинг совета +20"
 SAU_debug_pc_standing_up_desc: "Повышение зарплаты на 20 человек позволит провести тестирование коммунальных служб."
 SAU_debug_shura_dissolve: "(DEBUG) Распустить Маджлис аш-Шура"
 SAU_debug_shura_dissolve_desc: "Выполняет команду SAU_shura_dissolve: сбрасывает флаг, обнуляет значения на верстаках, удаляет спирт."
 SAU_debug_shura_open: "(ОТЛАДКА) Открыть Маджлис аш-Шура"
 SAU_debug_shura_open_desc: "Устанавливает SAU_shura_open и распределяет места в Совете в соотношении 50/50/50, без SAU_reorganization_of_the_majlis_ash_shura или Митеба на троне."
 SAU_debug_shura_readout: "(ОТЛАДКА) Проверка ворот Шуры"
 SAU_debug_shura_readout_desc: "§HВсе условия, необходимые для данной категории: §!\n§YОткрыт совет§! (SAU_shura_open, устанавливается SAU_reorganization_of_the_majlis_ash_shura)\n§YПравление дома Аль-Сауд§!: [?ruling_party|0] должно быть 10\n§YНет переворота§! (SAU_military_coup_ready должно быть ясно)\n§YМонархия цела§! (SAU_monarchy_abolished должно быть ясно)\n\n§HМеста§! - улемы [?SAU_shura_ulema|0], технократы [?SAU_shura_technocrats|0], видные деятели [?SAU_shura_notables|0]"
 SAU_debug_storm_complete_civil_war: "(ОТЛАДКА) Завершить фокус «Гражданская война в Йемене»"
 SAU_debug_storm_complete_civil_war_desc: "Принудительное завершение задания SAU_the_yemeni_civil_war без ожидания ежемесячной проверки."
 SAU_debug_storm_open: "(ОТЛАДКА) Отменить встречу в Эр-Рияде"
 SAU_debug_storm_open_desc: "Событие 194 запускается напрямую, минуя фокус и его предварительные условия."
 SAU_debug_storm_readout: "(DEBUG) Коалиция: [?SAU_coalition_partners|0]"
 SAU_debug_storm_readout_desc: "§HПартнеры по коалиции§!: §Y[?SAU_coalition_partners|0]§!\n§HШторм запущен§!: флаг SAU_decisive_storm_launched\n§HФокус на гражданской войне§!: SAU_the_yemeni_civil_war"
 SAU_debug_water_pride_down: "§Y(DEBUG) Сила Водной Гордости -1 Уровень§!"
 SAU_debug_water_pride_down_desc: "Инструмент для модификации/отладки. Принудительно снижает уровень духа §HSovereign Waters§! на один уровень, независимо от стабильности. Виден только с параметром -debug."
 SAU_debug_water_pride_up: "§Y(DEBUG) Сила Водной Гордости +1 Уровень§!"
 SAU_debug_water_pride_up_desc: "Инструмент для модификации/отладки. Принудительно повышает уровень духа §HSovereign Waters§! на один уровень независимо от стабильности. Виден только с параметром -debug."
 SAU_div_arms: "Локализация производства вооружений"
 SAU_div_arms_desc: "Развернуть §HСАМИ§! а также отечественной оборонной промышленности. Производство оружия в Саудовской Аравии сокращает расходы на импорт, обеспечивает занятость инженеров и §Gрасширить промышленную базу§! помимо нефти."
 SAU_div_digital: "Развивайте цифровую экономику"
 SAU_div_digital_desc: "Поддерживать §Hфинтех, электронная коммерция и стартапы§! для создания квалифицированных рабочих мест и расширения налоговой базы, не связанной с нефтью. §Gснижает зависимость от сырой нефти§! путем расширения частных цифровых отраслей."
 SAU_div_giga_project: "Профинансируйте гигапроект"
 SAU_div_giga_project_desc: "Выделить значительные средства на §HНЕОМ§! и планируемый к строительству город на северо-западе. Проект обеспечивает значительный спрос на строительные работы и стимулирует экономику. §Gвдали от нефти§!но с очень высокими финансовыми издержками."
 SAU_div_pif_invest: "Стратегические инвестиции PIF"
 SAU_div_pif_invest_desc: "Прямой §HГосударственный инвестиционный фонд§! Вложение капитала в отечественные заводы, строительные мощности и занятость в Эр-Рияде. Это приводит к значительному сокращению §Gнефтяная зависимость§! при значительных финансовых затратах для казны."
 SAU_div_renewables: "Расширение мощностей возобновляемой энергетики"
 SAU_div_renewables_desc: "Развернуть §Hсолнечная и ветровая энергия§! В пустыне Руб-эль-Хали. Экологически чистая энергия позволяет экспортировать нефть. §Gослабляет зависимость экономики от нефти§!."
 SAU_div_tourism_event: "Провести глобальное туристическое мероприятие"
 SAU_div_tourism_event_desc: "Продвигайте курорты, фестивали, паломничество и международный туризм на §HПобережье Красного моря§!Расходы посетителей §Gдиверсифицирует§! Доходы Королевства помимо нефти."
 SAU_domestic_external_category: "§HСаудовские внутренние и внешние дела§!"
 SAU_east_belt_road: "Инвестиции в ОПОП"
 SAU_east_belt_road_desc: "Принять китайские инвестиции в рамках инициативы «Один пояс и один путь» в саудовские порты, железные дороги и промышленные города. Эти проекты расширяют инфраструктуру без политических условий, обычно выдвигаемых западными партнерами."
 SAU_east_energy_markets: "Азиатские энергетические рынки"
 SAU_east_energy_markets_desc: "Расширение экспорта нефти в Китай и другие страны Азии. Более широкая клиентская база повышает позиции Саудовской Аравии и снижает зависимость от западного спроса."
 SAU_east_trade: "Торговое соглашение с Востоком"
 SAU_east_trade_desc: "Заключить торговые соглашения, предусматривающие обмен саудовского энергоносителя на промышленные товары из развивающихся стран Азии."
 SAU_faisalite_category: "Фейсалитский вопрос"
 SAU_faisalite_endowments: "Финансирование целевых фондов"
 SAU_faisalite_endowments_desc: "Предоставить дополнительное финансирование религиозным фондам, которые столкнулись с дефицитом средств после снижения доходов от нефти. Неучтенные средства обеспечат поддержку со стороны духовенства, оказывающего влияние на проповеди по всему Королевству."
 SAU_faisalite_guard_petition: "Петиции охраны"
 SAU_faisalite_guard_petition_desc: "Разрешите старшим офицерам Национальной гвардии подать публичную петицию Мутаибу. Подписав ее, вы сможете определить офицеров, поддерживающих его претензии на преемственность."
 SAU_faisalite_int_buy_satellite_channels: "Приобретите арабские спутниковые каналы."
 SAU_faisalite_int_buy_satellite_channels_desc: "Приобретение крупных арабских спутниковых сетей и назначение сотрудников, лояльных Эр-Рияду. Это расширяет влияние Саудовской Аравии на региональные СМИ, но вызывает опасения улемов."
 SAU_faisalite_int_endow_universities: "Оказывать финансовую поддержку зарубежным университетам"
 SAU_faisalite_int_endow_universities_desc: "Финансирование будет направлено на создание постоянных кафедр исламоведения в зарубежных университетах от Каира до Куала-Лумпура. Эр-Рияд предоставит финансирование и определит утвержденную учебную программу."
 SAU_faisalite_int_hard_currency_loans: "Кредитование в твердой валюте"
 SAU_faisalite_int_hard_currency_loans_desc: "Предлагать долларовые займы правительствам, которые не могут получить доступное финансирование в других местах. Выгодные условия усилят их зависимость от поддержки Саудовской Аравии."
 SAU_faisalite_int_officers_abroad: "Во-вторых, офицерский корпус за рубежом."
 SAU_faisalite_int_officers_abroad_desc: "Назначать саудовских офицеров советниками и инструкторами для вооруженных сил по всему мусульманскому миру. Эти командировки улучшат военный опыт Саудовской Аравии и расширят влияние Эр-Рияда."
 SAU_faisalite_int_pilgrimage_quotas: "Расширить квоты на паломничество"
 SAU_faisalite_int_pilgrimage_quotas_desc: "Увеличьте квоты на хадж, несмотря на дополнительную нагрузку на инфраструктуру Мекки. Больше паломников смогут испытать на себе саудовское управление святыми местами и вернуться домой с более крепкими связями с Королевством."
 SAU_faisalite_iso_buy_foreign_firms: "Выкупить иностранные компании"
 SAU_faisalite_iso_buy_foreign_firms_desc: "Приобретение иностранных компаний, работающих в Королевстве, и передача их активов государственным министерствам. Это усиливает саудовский контроль над экономикой, но лишает новых операторов имеющейся у этих фирм экспертизы."
 SAU_faisalite_iso_cancel_visas: "Отменить визы для иностранных рабочих"
 SAU_faisalite_iso_cancel_visas_desc: "Допустить истечение срока действия миллиона разрешений на работу для иностранцев без продления. Это увеличит долю Саудовской Аравии в рабочей силе, но задержит реализацию проектов, зависящих от иностранной рабочей силы."
 SAU_faisalite_iso_close_foreign_schools: "Закрыть зарубежные школы"
 SAU_faisalite_iso_close_foreign_schools_desc: "Закрыть международные школы и перевести их учеников в государственную систему. Образование будет осуществляться по саудовской учебной программе, но школы не готовы к увеличению числа учащихся."
 SAU_faisalite_iso_import_licences: "Нормировать импортные лицензии"
 SAU_faisalite_iso_import_licences_desc: "Сократите количество выдаваемых ежеквартальных импортных лицензий. Импорт станет более дефицитным и дорогим, что даст отечественным производителям больше пространства на рынке."
 SAU_faisalite_iso_repatriate_reserves: "Репатриировать суверенные резервы"
 SAU_faisalite_iso_repatriate_reserves_desc: "Переместить суверенные резервы Саудовской Аравии из Нью-Йорка и Лондона и вернуть их в Королевство. Это усилит прямой контроль над национальными активами, но серьезно подорвет отношения с западными финансовыми партнерами."
 SAU_faisalite_score_interventionist: "§RВмешательство§! §Y[?SAU_faisalite_interventionist|0]§!"
 SAU_faisalite_score_interventionist_desc: "Интервенционизм использует саммиты, финансовую поддержку и военных советников, чтобы поставить Эр-Рияд во главе уммы. Одновременно могут действовать две интервенционистские директивы, и каждая из них приносит выгоду только после выполнения; поддерживайте этот показатель выше §OIsolationist§!, чтобы создать финальный столп §RThe Third Way Doctrine§!."
 SAU_faisalite_score_isolationist: "§OIsolationist§! §Y[?SAU_faisalite_isolationist|0]§!"
 SAU_faisalite_score_isolationist_desc: "Изоляционизм концентрирует политику Саудовской Аравии на границах, религии и нефти, избегая при этом внешних обязательств. Одновременно могут действовать две изоляционистские директивы, и каждая из них приносит выгоду только после завершения; поддерживайте этот показатель выше §RInterventionist§!, чтобы достичь конечного результата §OSplendid Isolation§!."
 SAU_faisalite_sermons: "Распространите проповеди."
 SAU_faisalite_sermons_desc: "Переиздать записанные речи Фейсала и распространить стенограммы среди кругов Национальной гвардии. Эта кампания возродит его политическую доктрину, хотя министерство признает ее последствия для нынешнего правительства."
 SAU_Foregin_affairs_category: "§GСаудовская Аравия Внешняя политика§!"
 SAU_Foreign_affairs_unlocked: "§HВнешняя политика разблокирована§!"
 SAU_Foreign_affairs_unlocked_desc: "Министерство иностранных дел вновь подотчетно Королевству. Приведенные ниже решения являются открытыми."
 SAU_found_arab_comintern: "Основал Арабский Коминтерн"
 SAU_found_arab_comintern_desc: "Аравия объединяет коммунистические государства арабского мира в единый революционный блок под своим собственным руководством."
 SAU_fsa_foreign_fighters: "Открыть канал привлечения иностранных истребителей"
 SAU_fsa_foreign_fighters_desc: "Разрешить иностранным добровольцам, путешествующим через Персидский залив, вступать в ряды Свободной сирийской армии, тем самым увеличив ее боеспособность."
 SAU_fsa_send_cash: "Перевод денежных средств в Свободную сирийскую армию."
 SAU_fsa_send_cash_desc: "Создать тайный канал финансирования для выплаты зарплат, закупок и политической организации Свободной сирийской армии."
 SAU_fsa_smuggle_weapons: "Контрабанда оружия повстанцам"
 SAU_fsa_smuggle_weapons_desc: "Перевозка стрелкового оружия через Иорданию для усиления Свободной сирийской армии в борьбе против сирийского правительства."
 SAU_heir_mbn_maneuver: "Маневры наследного принца"
 SAU_heir_mbn_maneuver_desc: "Используйте полномочия Мохаммеда бин Найефа в Министерстве внутренних дел, его послужной список в сфере безопасности и репутацию в борьбе с терроризмом, чтобы укрепить свои претензии на преемственность."
 SAU_heir_mbs_maneuver: "Маневры молодого принца"
 SAU_heir_mbs_maneuver_desc: "Передайте дополнительные портфели Мухаммеду бин Салману и увольте чиновников, которые выступают против его претензий на преемственность."
 SAU_heir_rally_support: "Объединить усилия в поддержку наследника"
 SAU_heir_rally_support_desc: "Встретьтесь со старшими принцами и проведите брифинг для влиятельных редакторов, чтобы заручиться поддержкой избранного наследника до официального объявления о престолонаследии."
 SAU_heir_undermine_mbn: "Подорвать позиции Мухаммеда бин Найефа"
 SAU_heir_undermine_mbn_desc: "Распространять опасения по поводу здоровья, выносливости и тесных отношений Мухаммеда бин Найефа с Соединенными Штатами, чтобы ослабить его поддержку при дворе."
 SAU_heir_undermine_mbs: "Подорвать авторитет Мухаммеда бин Салмана"
 SAU_heir_undermine_mbs_desc: "Подчеркните действия Мухаммеда бин Салмана во время войны в Йемене, его чрезмерные расходы и разногласия со старшими принцами, чтобы ослабить его поддержку при дворе."
 SAU_houthi_break_ceasefire: "Нарушить саудовское перемирие"
 SAU_houthi_break_ceasefire_desc: "Орудия Королевства замолчали, но война еще не выиграна. Нарушьте перемирие и возобновите наступление против саудовцев."
 SAU_if_cross_border_raid: "Трансграничный рейд"
 SAU_if_cross_border_raid_desc: "Начать вооруженное вторжение с целью нанесения ударов по израильским военным складам и аванпостам. Самый смелый вариант, который с наибольшей вероятностью вызовет ожесточенный ответ."
 SAU_if_rocket_barrage: "Ракетный обстрел израильских городов"
 SAU_if_rocket_barrage_desc: "Отдать приказ Фронту запустить ракеты по израильским городам, что нарушит экономику и вынудит население укрыться в убежищах."
 SAU_if_suicide_bombing: "Развернуть бомбардировочную кампанию"
 SAU_if_suicide_bombing_desc: "Направлять ячейки Фронта на совершение терактов с участием смертников в израильских городах, что приведет к снижению морального духа населения и увеличению расходов Израиля на обеспечение безопасности."
 SAU_intel_counterintel_sweep: "Контрразведывательная операция"
 SAU_intel_counterintel_sweep_desc: "GIP на некоторое время замыкается в себе — конспиративные квартиры закрываются, шифровальщики меняются, и каждому иностранному агенту в Королевстве дают повод замолчать.\n\n§GПодавляет иностранную подрывную деятельность и укрепляет наши шифры на 90 дней§!, и оставляет разведывательное сообщество довольным, когда завершает свою работу.\n\n§YПовторяемый§! — проверка эффективна только до тех пор, пока вы её продолжаете."
 SAU_intel_counterterror: "Управление по борьбе с терроризмом"
 SAU_intel_counterterror_desc: "Координировать рейды и разведывательные операции против «Аль-Каиды» и джихадистских ячеек. Эти меры укрепляют стабильность и сплачивают династию Саудов вокруг Глобальной инициативы по борьбе с терроризмом (GIP), а также наносят прямой удар по любым иностранным боевикам, действующим в Королевстве."
 SAU_intel_expand_gip: "Расширить полномочия Главного разведывательного управления."
 SAU_intel_expand_gip_desc: "Новые станции, новое прикрытие, новые наборы для обучения. Президентство не просто набирает человека и останавливается — оно строит место, куда его можно поставить.\n\n§GПостоянно добавляет оперативный слот§!, чтобы Королевство могло постоянно держать еще одного офицера на поле боя.\n\n§YПовторяется до 3 раз.§!"
 SAU_intel_foreign_stations: "Сеть зарубежных станций"
 SAU_intel_foreign_stations_desc: "Открытие станций GIP за рубежом позволит ослабить иранское влияние и расширить влияние Саудовской Аравии в регионе."
 SAU_intel_mabahith: "Укрепите Мабахит"
 SAU_intel_mabahith_desc: "Расширить наблюдение за деятельностью организации «Мабахит» и усилить меры по борьбе с внутренним инакомыслием. Усиление внутреннего контроля повышает стабильность и способствует получению поддержки со стороны религиозных кругов."
 SAU_intel_surveillance_tech: "Приобретите передовые технологии наблюдения."
 SAU_intel_surveillance_tech_desc: "Вместо того чтобы ждать собственных инженеров Королевства, GIP закупает системы мониторинга и анализа данных в собственность, а установку поручает иностранным подрядчикам.\n\n§GУстанавливает компьютеры агентства немедленно.§!, §Yбез исследований или подготовительной работы, которую обычно требует агентство.§!.\n\n§RВы платите за короткий путь.§! - дороже, чем построить самому, и доступно только один раз."
 SAU_Intelligence_category: "§GГлавное управление разведки§!"
 SAU_islamic_rivalry_close: "Приостановить кампанию против Ирана"
 SAU_islamic_rivalry_close_desc: "Тихо прекратить кампанию. Приостановить рассмотрение решений по вопросу исламского соперничества до возобновления работы."
 SAU_islamic_rivalry_open: "Начните кампанию против Ирана"
 SAU_islamic_rivalry_open_desc: "Направить аппарат Королевства на борьбу против Тегерана. Открывает доступ к решениям, касающимся исламского соперничества."
 SAU_isr_talks_backchannel: "Откройте обратный канал"
 SAU_isr_talks_backchannel_desc: "Используйте посредников в третьих странах для выявления условий, которые Израиль может принять, прежде чем любое из правительств начнет публичные переговоры."
 SAU_isr_talks_clock: "Завершить переговоры с Израилем"
 SAU_isr_talks_clock_desc: "С момента согласия Израиля на переговоры остается 120 дней. Израиль должен принять Арабскую мирную инициативу и как минимум еще один вариант, прежде чем терпение, политика и враги региона закроют этот путь."
 SAU_isr_talks_palestine: "Предложите Арабскую мирную инициативу"
 SAU_isr_talks_palestine_desc: "Оформите инициативу 2002 года в письменном виде: полная нормализация отношений с арабским миром в обмен на независимое палестинское государство на территории, существовавшей в 1967 году."
 SAU_isr_talks_sweeten: "Сделать предложение более привлекательным"
 SAU_isr_talks_sweeten_desc: "В качестве экономических стимулов для заключения соглашения предложите инвестиции, соглашение об открытом небе и доступ к рынку Персидского залива."
 SAU_isr_talks_us_mediation: "Пригласите Вашингтона"
 SAU_isr_talks_us_mediation_desc: "Обратитесь к Соединенным Штатам с просьбой гарантировать проведение переговоров и использовать свое влияние на Израиль для поддержки соглашения."
 SAU_junta_address_the_nation: "Обращение к нации"
 SAU_junta_address_the_nation_desc: "Попросите одного из высокопоставленных членов Совета выступить с телевизионным обращением, в котором он объяснит работу нового правительства и его программу. Это выступление должно заверить часть общественности в том, что государство по-прежнему находится под эффективным контролем."
 SAU_junta_category: "Верховный Военный Совет"
 SAU_junta_control_readout: "§HКонтроль§! §W[?SAU_junta_control|0]§!"
 SAU_junta_control_readout_desc: "Показатель контроля отражает способность Совета обеспечивать выполнение своих приказов посредством гарнизонов, контрольно-пропускных пунктов, разведывательных файлов и лояльного персонала. Он снижается на единицу каждый месяц, а временные программы Совета при запуске расходуют дополнительное количество очков контроля."
 SAU_junta_legitimacy_crisis: "Совет должен ответить за свои действия сам."
 SAU_junta_legitimacy_crisis_desc: "Совет утратил оставшуюся легитимность, и поддержка со стороны духовенства и провинциальных властей начинает рушиться. У него есть шесть месяцев, чтобы урегулировать спор с должностными лицами, выполнить требования племен и восстановить свой статус. §H20§!.\n\n§RЕсли через сто восемьдесят дней этот порог не будет достигнут, Королевство вступит в открытый конфликт.§!"
 SAU_junta_legitimacy_readout: "§HЛегитимность§! §W[?SAU_junta_legitimacy|0]§!"
 SAU_junta_legitimacy_readout_desc: "Показатель легитимности измеряет признание Совета, за которым не стоят выборы, фетва или законная преемственность. Он снижается на единицу каждый месяц, и достижение нуля дает Совету 180 дней на восстановление до 20."
 SAU_junta_reinforce_garrisons: "Укрепить гарнизоны"
 SAU_junta_reinforce_garrisons_desc: "Развернуть дополнительные батальоны в столицах провинций, укомплектовать контрольно-пропускные пункты и восстановить военную связь между Эр-Риядом и гарнизонами."
 SAU_junta_standing_readout: "§HПоложение§! [ROOT.GetSAUJuntaStanding]"
 SAU_junta_standing_readout_desc: "[ROOT.GetSAUJuntaStandingEffect]"
 SAU_junta_tour_the_provinces: "Совершите тур по провинциям."
 SAU_junta_tour_the_provinces_desc: "Направьте представителей Совета на встречи с местными лидерами в Бурайде, Джидде, Джазане и внутренних районах провинции. Рассмотрение жалоб и запросов на финансирование на местном уровне улучшит поддержку со стороны провинций."
 SAU_king_abdullah_category: "Король Абдулла бин Абдулазиз"
 SAU_king_mbn_category: "Король Мухаммед бин Найеф"
 SAU_king_mbs_category: "Король Мухаммед бин Салман"
 SAU_king_mutaib_category: "Король Мутайб бин Абдулла"
 SAU_king_salman_category: "Король Салман бин Абдулазиз"
 SAU_mbn_border_surveillance: "Укрепить системы наблюдения пограничной охраны"
 SAU_mbn_border_surveillance_desc: "Для повышения эффективности обнаружения несанкционированных пересечений границы с Йеменом и Ираком необходимо установить вдоль них вышки, сенсорные ограждения и тепловизионные камеры."
 SAU_mbn_mabahith_campaign: "Уполномочить Мабахита провести контрподрывную кампанию"
 SAU_mbn_mabahith_campaign_desc: "Уполномочить Главное следственное управление ликвидировать предполагаемые подрывные сети по всему Королевству. В рамках этой кампании также будут задержаны некоторые лица, чья причастность к этому делу не установлена."
 SAU_mbn_maneuver: "Фракционные маневры Бин Наефа"
 SAU_mbn_maneuver_desc: "Службы безопасности работают над продвижением претензий Мохаммеда бин Найефа и могут настроить суд против вашего собственного кандидата."
 SAU_mbn_rehabilitation_center: "Активировать реабилитационный центр имени принца Наефа"
 SAU_mbn_rehabilitation_center_desc: "Поместите задержанных в реабилитационную программу с участием священнослужителей, психологов и их семей. Эта программа может снизить рецидивизм, хотя некоторые участники вернутся к воинственной деятельности."
 SAU_mbn_special_security_forces: "Развернуть силы специального назначения Министерства внутренних дел"
 SAU_mbn_special_security_forces_desc: "Развернуть специальные силы безопасности Министерства внутренних дел в крупных городах, предоставив министру вооруженные силы, независимые от регулярной армии."
 SAU_mbn_western_intel_networks: "Активировать западные объединенные разведывательные сети"
 SAU_mbn_western_intel_networks_desc: "Расширить взаимодействие между разведывательными службами Эр-Рияда, ЦРУ и британскими спецслужбами. Саудовская Аравия будет делиться конфиденциальной информацией в обмен на улучшенный доступ к западным разведывательным данным."
 SAU_mbs_anticorruption_drive: "Провести кампанию по борьбе с коррупцией"
 SAU_mbs_anticorruption_drive_desc: "Задержать принцев и бизнесменов в роскошном отеле и потребовать от них финансовых расчетов с государством. Это позволит вернуть средства в казну и продемонстрирует контроль наследного принца над элитой."
 SAU_mbs_aramco_liquidity: "Стратегическое распределение ликвидности Aramco"
 SAU_mbs_aramco_liquidity_desc: "Перевести часть имеющегося у Aramco капитала на программы, контролируемые наследным принцем, ограничив роль совета директоров в принятии решения."
 SAU_mbs_gami_localization: "Мобилизация GAMI Defense Localization"
 SAU_mbs_gami_localization_desc: "Обязать иностранных оборонных подрядчиков тратить половину средств, выделяемых на закупки, внутри Королевства, иначе они лишатся доступа к саудовским контрактам."
 SAU_mbs_pif_neom: "Направить средства PIF на проекты NEOM и Frontier."
 SAU_mbs_pif_neom_desc: "Направить средства из Государственного инвестиционного фонда на проекты NEOM по строительству линейных городов, портов и горных курортов, несмотря на их высокие технические и финансовые риски."
 SAU_mbs_vision2030_blitz: "Запуск кампании «Видение 2030»"
 SAU_mbs_vision2030_blitz_desc: "Запустить скоординированную рекламную и конференционную кампанию для формирования общественной и институциональной поддержки концепции «Видение 2030»."
 SAU_military_category: "§HМодернизация вооруженных сил§!"
 SAU_militia_back_dflp: "Финансируйте Демократический фронт"
 SAU_militia_back_dflp_desc: "Финансировать светские палестинские фракции в качестве противовеса конкурирующим движениям и усилить влияние Саудовской Аравии в палестинской политике."
 SAU_militia_back_hamas: "Банкролл Хамас"
 SAU_militia_back_hamas_desc: "Предоставить ХАМАС деньги, оружие и новобранцев в обмен на более тесное сотрудничество с Эр-Риядом, а не с Тегераном."
 SAU_militia_islamic_front: "Создать лояльный Саудовской Аравии исламский фронт"
 SAU_militia_islamic_front_desc: "Создать и финансировать новую исламистскую фракцию, организация и командование которой по-прежнему будут зависеть от поддержки Саудовской Аравии."
 SAU_mod_abrams_gunnery: "Программа артиллерийской подготовки Abrams"
 SAU_mod_abrams_gunnery_desc: "Запустите программу, чтобы выбрать, как будет вести себя эта часть вооруженных сил.\n\n§YОткрывается с:§! Основной боевой танк M1A2 Abrams.\n§GОткрывает выбор из трех доктрин§!, каждая со своими преимуществами и недостатками. Повторите запуск позже, чтобы §Yпереключиться§!. §H[Stage I reform - finish all three Stage I reforms to unlock Stage II.]§!"
 SAU_mod_apache_training: "Учебные стрельбы с вертолётов Apache"
 SAU_mod_apache_training_desc: "Запустите программу, чтобы выбрать, как будет вести себя эта часть вооруженных сил.\n\n§YОткрывается с:§! Армейская авиация и боевые вертолеты Apache.\n§GОткрывает выбор из трех доктрин§!, каждая со своими преимуществами и недостатками. Повторите запуск позже, чтобы §Yпереключиться§!. §H[Stage II reform - finish all three Stage II reforms to unlock Stage III.]§!"
 SAU_mod_artillery_livefire: "Учения по артиллерийской стрельбе с боевой стрельбой"
 SAU_mod_artillery_livefire_desc: "Запустите программу, чтобы выбрать, как будет вести себя эта часть вооруженных сил.\n\n§YОткрывается с:§! Самоходная артиллерийская установка M109.\n§GОткрывает выбор из трех доктрин§!, каждая со своими преимуществами и недостатками. Повторите запуск позже, чтобы §Yпереключиться§!. §H[Stage II reform - finish all three Stage II reforms to unlock Stage III.]§!"
 SAU_mod_awacs_battle: "Обучение управлению боем на самолетах ДРЛО"
 SAU_mod_awacs_battle_desc: "Запустите программу, чтобы выбрать, как будет вести себя эта часть вооруженных сил.\n\n§YОткрывается с:§! E-3 Sentry AWACS.\n§GОткрывает выбор из трех доктрин§!, каждая со своими преимуществами и недостатками. Повторите запуск позже, чтобы §Yпереключиться§!. §H[Stage III reform - the final batch.]§!"
 SAU_mod_complete: "Этап III: Создание полностью современной армии"
 SAU_mod_complete_desc: "§HЭтап III из III — полностью модернизированные силы.§!\n\n§RЭтот параметр остается заблокированным, пока вы не завершите все три реформы Этапа II:§!\n §Y — Учения по артиллерийской стрельбе с боевой стрельбой\n — Тренировка на боевых вертолетах Apache\n — Учения объединенного флота§!\n(выберите доктрину в каждой).\n\n§GЧто происходит:§! вооруженные силы достигают §GПолной модернизации§! — настоящего противовеса Ирану — и появляются заключительные реформы: §YСпецназ, AWACS и высокоточные удары§!. Выстрел один раз."
 SAU_mod_construction: "Спонсор промышленного строительства"
 SAU_mod_construction_desc: "Выделить средства на строительство новых заводов и дорог в Восточной провинции для расширения промышленного потенциала в главном нефтедобывающем регионе."
 SAU_mod_devfund: "Обеспечить финансирование Фонда развития"
 SAU_mod_devfund_desc: "Направить средства из национального фонда развития на создание новых строительных площадок в Восточной провинции."
 SAU_mod_fleet_exercise: "Совместные учения флота"
 SAU_mod_fleet_exercise_desc: "Запустите программу, чтобы выбрать, как будет вести себя эта часть вооруженных сил.\n\n§YОткрывается с:§! Королевские военно-морские силы Саудовской Аравии.\n§GОткрывает выбор из трех доктрин§!, каждая со своими сильными и слабыми сторонами. Повторите запуск позже, чтобы §Yпереключиться§!. §H[Stage II reform - finish all three Stage II reforms to unlock Stage III.]§!"
 SAU_mod_gulf_lessons: "Военные игры: уроки Персидского залива"
 SAU_mod_gulf_lessons_desc: "Проведите масштабные учения, чтобы проверить армию на основе горького опыта 1991 года и решить, на какой модели её следует перестроить.\n\n§YНачинается с:§! Уроки войны в Персидском заливе.\n§GОткрывает выбор из четырёх доктрин§! — американской, стран Персидского залива, НАТО или внутренней — каждая со своими сильными и слабыми сторонами. Проведите военные игры ещё раз позже, чтобы §Yсменить доктрину§!."
 SAU_mod_modernize: "Этап II: Модернизация боевых подразделений"
 SAU_mod_modernize_desc: "§HЭтап II из III — перевооружение боевых подразделений.§!\n\n§RЭтот пункт останется заблокированным, пока вы не завершите все три реформы Этапа I:§!\n §Y — Учения по боевой готовности Национальной гвардии\n — Программа стрельбы из Abrams\n — Подготовка к воздушному бою Red Flag§!\n(выберите доктрину в каждой).\n\n§GЧто происходит:§! вооруженные силы переходят от §YВ стадии реформ§! к §YМодернизации§!, и появляются три новые реформы — §YАртиллерия, Apache и Объединенный флот§!. Для разблокировки §YStage III§! необходимо выполнить все три задания. Срабатывает один раз."
 SAU_mod_pgm_doctrine: "Курс доктрины высокоточного удара"
 SAU_mod_pgm_doctrine_desc: "Запустите программу, чтобы выбрать, как будет вести себя эта часть вооруженных сил.\n\n§YОткрывается с:§! Высокоточные управляемые боеприпасы.\n§GОткрывает выбор из трех доктрин§!, каждая со своими преимуществами и недостатками. Повторите запуск позже, чтобы §Yпереключиться§!. §H[Stage III reform - the final batch.]§!"
 SAU_mod_red_flag: "Подготовка к воздушному бою «Красный флаг»"
 SAU_mod_red_flag_desc: "Запустите программу, чтобы выбрать, как будет вести себя эта часть вооруженных сил.\n\n§YОткрывается с:§! Королевские ВВС Саудовской Аравии.\n§GОткрывает выбор из трех доктрин§!, каждая со своими сильными и слабыми сторонами. Повторите запуск позже, чтобы §Yпереключиться§!. §H[Stage I reform - finish all three Stage I reforms to unlock Stage II.]§!"
 SAU_mod_reform: "Этап I: Запуск программы реформ"
 SAU_mod_reform_desc: "§HЭтап I из III — первый этап модернизации.§!\n\n§GЧтобы запустить его:§! завершить §YГенеральный штаб§! фокус, затем выиграть §YВоенные игры: Уроки Персидского залива§! (выберите доктрину войны в Персидском заливе).\n\n§GЧто происходит:§! вооруженные силы переходят из §RНемодернизированные§! в §YВ реформе§!, и появляются три новые реформы — §YНациональная гвардия, артиллерийская установка «Абрамс» и Красная Flag§!.\n\n§RВажно:§! затем необходимо выполнить §Rвсе три§! из этих реформ, прежде чем §YЭтап II§! разблокируется. Срабатывает один раз."
 SAU_mod_sang_drills: "Учения по боевой готовности Национальной гвардии"
 SAU_mod_sang_drills_desc: "Запустите программу, чтобы выбрать, как будет вести себя эта часть вооруженных сил.\n\n§YОткрывается с:§! Национальная гвардия Саудовской Аравии.\n§GОткрывает выбор из трех доктрин§!, каждая со своими сильными и слабыми сторонами. Повторите запуск позже, чтобы §Yпереключиться§!. §H[Stage I reform - finish all three Stage I reforms to unlock Stage II.]§!"
 SAU_mod_sf_selection: "Курс отбора в спецназ"
 SAU_mod_sf_selection_desc: "Запустите программу, чтобы выбрать, как будет вести себя эта часть вооруженных сил.\n\n§YОткрывается с:§! Командование специальных операций.\n§GОткрывает выбор из трех доктрин§!, каждая со своими сильными и слабыми сторонами. Повторите запуск позже, чтобы §Yпереключиться§!. §H[Stage III reform - the final batch.]§!"
 SAU_mod_workforce: "Подготовка кадров для национальной системы здравоохранения"
 SAU_mod_workforce_desc: "Программы профессиональной подготовки обеспечивают большему числу саудовцев квалифицированную работу, что способствует стабилизации общества и укреплению национального морального духа."
 SAU_mutaib_capital_garrison: "Укрепите гарнизонную сеть столицы."
 SAU_mutaib_capital_garrison_desc: "Создать вокруг Эр-Рияда контрольно-пропускные пункты Национальной гвардии, позиции бронетехники и независимые средства связи. Это обеспечит защиту столицы и укрепит контроль Национальной гвардии над ней."
 SAU_mutaib_janadriyah_festival: "Проведение Национального фестиваля наследия Джанадрия"
 SAU_mutaib_janadriyah_festival_desc: "Предложите Национальной гвардии провести фестиваль Джанадрия с верблюжьими скачками, танцами с мечами, поэтическими чтениями и телевизионными церемониями племен. Это мероприятие укрепит связи Мутаиба с племенными вождями."
 SAU_mutaib_maneuver: "Фракционные маневры Мутаиба"
 SAU_mutaib_maneuver_desc: "Национальная гвардия работает над продвижением претензий Мутаиба и может настроить суд против вашего кандидата."
 SAU_mutaib_sang_logistics: "Автономное управление логистикой SANG"
 SAU_mutaib_sang_logistics_desc: "Создать независимую систему снабжения Национальной гвардии вместо зависимости от обычных армейских складов. Логистическая автономия повышает оперативную и политическую независимость гвардии."
 SAU_mutaib_sang_procurement: "Ускоренное оформление закупок авиационной и бронетехники для Национальной гвардии ВВС США"
 SAU_mutaib_sang_procurement_desc: "Приоритетное внимание следует уделить вертолетам Apache и бронетехнике для Национальной гвардии, опережая заказы для регулярной армии, включая создание отдельного авиационного подразделения гвардии."
 SAU_mutaib_tribal_reserves: "Мобилизация резервов племенных организаций SANG"
 SAU_mutaib_tribal_reserves_desc: "Призвать племенных шейхов предоставить оплачиваемый резервный персонал для Национальной гвардии в рамках существующей системы пополнения."
 SAU_officer_crisis_category: "Жалоба офицеров"
 SAU_officer_grievance_readout: "Офицерский корпус: [ROOT.GetSAUArmyGrievance]"
 SAU_officer_grievance_readout_desc: "§HGrievance§!: §Y[?SAU_army_grievance|0]§! of §Y100§!\n[ROOT.GetSAUArmyGrievanceEffect]\n\nЭта запись отображает текущий уровень жалобы и не влияет на принятие решения."
 SAU_officers_pay_arrears: "Погасите задолженность"
 SAU_officers_pay_arrears_desc: "Выплата пособий за одиннадцать месяцев, жилищных субсидий и отложенной заработной платы одним платежом задним числом. Это обеспечивает временное облегчение, не устраняя причину недовольства должностных лиц.\n\n§G-20 недовольство§!, §R-$12 млрд§!, повторяется каждые 60 дней."
 SAU_officers_promote_colonels: "Повысить в звании полковников"
 SAU_officers_promote_colonels_desc: "Передайте командование бригадами опытным кадровым офицерам, вместо того чтобы оставлять эти должности для князей. Это изменение повысит уверенность корпуса в продвижении по службе по заслугам.\n\n§G-15 жалоб§!, §G+2% стабильности§!, повторяется каждые 90 дней."
 SAU_officers_restore_defence_budget: "Восстановить оборонный бюджет"
 SAU_officers_restore_defence_budget_desc: "Восстановить финансирование, сокращенное для регулярных войск, и перевести эти расходы в бюджет Национальной гвардии. Это устранит основную причину недовольства офицеров.\n\n§G-25 к недовольству§!, §R-$25 млрд§!, и Национальная гвардия перестанет быть защищенной, так что недовольство будет расти вдвое медленнее; это можно сделать один раз."
 SAU_officers_settle_for_good: "Урегулировать вопрос с офицерами."
 SAU_officers_settle_for_good_desc: "Создать комиссию, сформированную из офицеров, опубликовать график повышения по службе и получить личное одобрение короля на урегулирование. Это может быть завершено только после устранения всех нерешенных вопросов.\n\n§GEЗавершить кризис навсегда и предотвратить государственный переворот§!; требуется подача жалобы на §Y0§!."
 SAU_oil_conserve: "Сохраним заповедники"
 SAU_oil_conserve_desc: "Сокращение производства для сохранения запасов на будущее. Это приведет к потере текущей выручки, но... §Gснижает зависимость экономики от нефти§! и повышает стабильность."
 SAU_oil_embargo: "Объявить нефтяное эмбарго"
 SAU_oil_embargo_desc: "Повторите §H1973§! политика, предусматривающая прекращение экспорта нефти в §LЗапад и друзья Израиля§!, в частности, §LСоединенные Штаты, Великобритания, Франция, Германия и Нидерланды§!Их экономика пострадает от шока предложения, в то время как Саудовская Аравия получит поддержку в арабских и мусульманских странах.\n\nКоролевство теряет доходы от западного экспорта и ухудшает отношения с Вашингтоном, но при этом получает выгоду. §Hпрестиж, единство и благословение духовенства§!."
 SAU_oil_increase_output: "Увеличить добычу нефти"
 SAU_oil_increase_output_desc: "Увеличить добычу нефти в Восточной провинции для §Gбольше нефти и немедленная прибыль§!Это также влияет на экономику. §Rболее зависимый§! об экспорте нефти."
 SAU_oil_new_field: "Разработка нового нефтяного месторождения"
 SAU_oil_new_field_desc: "Финансирование геологоразведочных работ и бурения новых скважин в пустыне Руб-эль-Хали. Проект представляет собой крупное дополнение к существующему. §Gнефтяное месторождение§! но увеличивает зависимость Королевства от нефти."
 SAU_oil_new_field_tt: "§GНовое месторождение доказано§! — §Y+15 нефти§! появляется в одной из провинций Королевства ценой §R$150 млрд§!"
 SAU_opec_cut_production: "Сокращение добычи нефти"
 SAU_opec_cut_production_desc: "Использовать роль Саудовской Аравии как «регулирующего производителя» в ОПЕК для сокращения добычи и §Gповысить мировые цены на нефть§!, увеличивая выручку с барреля. Можно использовать каждые 180 дней."
 SAU_opec_flood_market: "Наводнить нефтяной рынок"
 SAU_opec_flood_market_desc: "Увеличьте объем производства настолько, чтобы §Rснизить мировые цены на нефть§!Саудовская Аравия теряет доходы в краткосрочной перспективе, но конкурирующие экспортеры (§LРоссия, Иран, Ирак, Венесуэла§!) несут более значительные экономические потери. Можно использовать один раз в год."
 SAU_operation_decisive_storm: "Операция «Решающий шторм» (Амалият Асифат аль-Хазм)"
 SAU_operation_decisive_storm_desc: "Запуск §YAmaliyat Asifat al-Hazm§! — воздушной кампании коалиции против территории, контролируемой хуситами в Йемене. Саудовская авиация нанесет удары по позициям хуситов, обеспечит защиту правительственных сил и позволит продолжить поддержку йеменской армии."
 SAU_pal_aid_package: "Пакет помощи Палестине"
 SAU_pal_aid_package_desc: "Обеспечить ежеквартальное финансирование со стороны Саудовской Аравии для выплаты зарплат сотрудникам Палестинской автономии, финансирования больниц, коммунальных услуг и восстановления Рамаллаха."
 SAU_pal_fund_development: "Фонд развития Палестины"
 SAU_pal_fund_development_desc: "Выделить средства на строительство дорог, школ и клиник на палестинских территориях для улучшения условий жизни и поддержки жизнеспособного урегулирования на основе принципа двух государств."
 SAU_pal_invest_gaza: "Инвестируйте в Газу и Западный берег"
 SAU_pal_invest_gaza_desc: "Инвестируйте в заводы и инфраструктуру в секторе Газа и на Западном берегу, чтобы создать рабочие места и уменьшить поддержку воинствующих группировков."
 SAU_pc_convene: "Созовите Народный совет"
 SAU_pc_convene_desc: "Созовите палату и дайте любому блоку, имеющему достаточно мест, три недели на внесение законопроекта. После внесения законопроекта король должен ратифицировать или наложить на него вето; ратификация укрепляет блок, выдвинувший законопроект, а вето ослабляет его.\n\nПовторяется каждые 90 дней."
 SAU_pc_convene_tt: "Открывается возможность выбора места — блок с §Y21+ местами§! может принести счет в течение §Y21 дней§!"
 SAU_pc_dissolve: "Распустить Народный совет"
 SAU_pc_dissolve_desc: "Распустить Народный совет королевским указом, не устанавливая дату его возобновления.\n\n§R-10% стабильности, -8% поддержки войны§!, §G+150 политической власти§!. Не подлежит отмене."
 SAU_pc_enact_provincial: "Принять законопроект провинциальных властей"
 SAU_pc_enact_provincial_desc: "Внедрить ратифицированные саудовские квоты на прием на работу, реформу системы спонсорства и независимую инспекцию, несмотря на противодействие со стороны крупных торговых кругов.\n\n§HСтоя§! измеряет общественный авторитет Народного совета; он §Gподъемы§! когда законопроект рассматривается и принимается, §Rводопады§! после вето, невнимательности или истечения срока действия законопроекта. Ниже. §Y40§!Совет не может провести законопроект через министерства."
 SAU_pc_enact_provincial_tt: "Требуется §Y300 политической власти§!, и Совет должен по-прежнему поддерживать законопроект — он §Hstanding§! выше §Y40§! (теперь §Y[?SAU_pc_standing|0]§! из §Y100§!)"
 SAU_pc_enact_reformist: "Принять Законопроект о реформистах"
 SAU_pc_enact_reformist_desc: "Обеспечить выполнение ратифицированного реформаторского законопроекта, поручив министерствам подготовить его положения, графики и бюджет.\n\n§HСтоя§! измеряет общественный авторитет Народного совета; он §Gподъемы§! когда законопроект рассматривается и принимается, §Rводопады§! после вето, невнимательности или истечения срока действия законопроекта. Ниже. §Y40§!Совет не может провести законопроект через министерства."
 SAU_pc_enact_reformist_tt: "Требуется §Y300 политической власти§!, и Совет должен по-прежнему поддерживать законопроект — он §Hstanding§! выше §Y40§! (теперь §Y[?SAU_pc_standing|0]§! из §Y100§!)"
 SAU_pc_enact_traditionalist: "Принять Закон о традиционалистах"
 SAU_pc_enact_traditionalist_desc: "Реализовать утвержденную программу по религиозным пожертвованиям, жилищным пособиям и провинциальным клиникам через ответственные министерства.\n\n§HСтоя§! измеряет общественный авторитет Народного совета; он §Gподъемы§! когда законопроект рассматривается и принимается, §Rводопады§! после вето, невнимательности или истечения срока действия законопроекта. Ниже. §Y40§!Совет не может провести законопроект через министерства."
 SAU_pc_enact_traditionalist_tt: "Требуется §Y300 политической власти§!, и Совет должен по-прежнему поддерживать законопроект — он §Hstanding§! выше §Y40§! (теперь §Y[?SAU_pc_standing|0]§! из §Y100§!)"
 SAU_pc_public_works: "Комиссия общественных работ"
 SAU_pc_public_works_desc: "Совет выбирает провинцию и устанавливает норматив: §Y[?SAU_pc_req_civ|0]§! гражданских заводов, §Y[?SAU_pc_req_off|0]§! офисов и §Y[?SAU_pc_req_inf|0]§! инфраструктуры, которые правительство должно обеспечить без бесплатного строительства; норматив растёт после каждого успешного срока полномочий. §HДва года на соблюдение требований§!: успех даёт провинции навсегда §G+1 слот для здания, +10% к скорости строительства и +5% к людским ресурсам§!, а неудача §Rсворачивает работы и уничтожает гражданский завод§!. §YТребует§! положения Совета §G60 или выше§!; расходы: §R-$4 млрд§!."
 SAU_pc_readout: "Народный совет: [ROOT.GetSAUPCBloc]"
 SAU_pc_readout_desc: "Народный совет §HНародный совет§! - [ROOT.GetSAUPCBloc], [ROOT.GetSAUPCStanding] (§Y[?SAU_pc_standing|0]§! из §Y100§!)\n§YРеформисты§!: [?SAU_pc_reformists|0] §YТрадиционалисты§!: [?SAU_pc_traditionalists|0] §YПровинциалы§!: [?SAU_pc_provincials|0]\n§HКоролевское вето использовано§!: §Y[?SAU_pc_vetoes|0]§!\n\n§HStanding§! измеряет общественный авторитет; он §G увеличивается§!, когда законопроект рассматривается и принимается, §R уменьшается§! после вето, игнорирования или истечения срока действия законопроекта, и должен оставаться на уровне §Y40+§! для проведения законопроекта через министерства или §Y60+§! для заказа общественных работ. Эта запись носит информационный характер и не имеет решающего значения."
 SAU_pc_session_clock: "Совет ожидает ответа"
 SAU_pc_session_clock_desc: "Совет собрался, и у соответствующего блока есть три недели, чтобы внести законопроект до истечения срока сессии, если он останется без ответа."
 SAU_pc_take_provincial_bill: "Послушайте выступления провинциалов"
 SAU_pc_take_provincial_bill_desc: "Разрешить провинциальному блоку внести законопроект об установлении квот на прием на работу граждан Саудовской Аравии, реформировании системы спонсорства и создании независимой инспекции труда."
 SAU_pc_take_reformist_bill: "Послушайте реформаторов"
 SAU_pc_take_reformist_bill_desc: "Разрешить реформистскому блоку, состоящему из молодых юристов и выпускников вузов, внести законопроект, направленный на повышение эффективности работы правительства и проведение институциональных реформ."
 SAU_pc_take_traditionalist_bill: "Послушайте традиционалистов"
 SAU_pc_take_traditionalist_bill_desc: "Разрешите традиционалистскому блоку внести законопроект о финансировании религиозных фондов, жилищных пособий и клиник в провинциях с недостаточным уровнем медицинского обслуживания."
 SAU_pc_works_mandate: "Поручение совета: [SAU_pc_works_province.GetName]"
 SAU_pc_works_mandate_desc: "Совет выбрал [SAU_pc_works_province.GetName]У правительства есть два года, чтобы выполнить опубликованные стандарты развития. Строительство не предоставляется автоматически.\n\nТребуемый стандарт — §Y[?SAU_pc_req_civ|0]§! гражданские заводы, §Y[?SAU_pc_req_off|0]§! офисы и §Y[?SAU_pc_req_inf|0]§! инфраструктура в провинции."
 SAU_pipeline_iraq: "Европейский трубопровод"
 SAU_pipeline_iraq_desc: "После свержения Саддама необходимо построить иракский участок трубопровода в направлении турецкой границы. Для того чтобы саудовская нефть смогла попасть в Европу, потребуется отдельное соглашение с Анкарой."
 SAU_pipeline_iraq_talks: "Открытые переговоры с Багдадом"
 SAU_pipeline_iraq_talks_desc: "Попросите правительство Саддама разрешить прокладку саудовского трубопровода через Ирак, несмотря на его враждебное отношение к династии Саудов. Багдад вряд ли согласится."
 SAU_pipeline_sabotage_category: "Саботаж саудовских трубопроводов"
 SAU_pipeline_syria_assad: "Переговоры по проекту трубопровода Левант"
 SAU_pipeline_syria_assad_desc: "Необходимо обеспечить транзит через Иорданию, а затем вести переговоры с враждебно настроенным правительством Асада о строительстве трубопровода через Сирию в Средиземное море. Взамен Дамаск потребует существенных транзитных сборов и политических уступок."
 SAU_pipeline_syria_fsa: "Левантийский трубопровод (Свободная Сирия)"
 SAU_pipeline_syria_fsa_desc: "Обеспечить транзит через Иорданию, а затем предложить дружественному сирийскому правительству саудовские инвестиции в обмен на маршрут трубопровода в Средиземное море."
 SAU_pipeline_turkey_extend: "Расширение трубопровода в Турцию"
 SAU_pipeline_turkey_extend_desc: "Вести переговоры с Анкарой о расширении иракского нефтепровода в Турцию и прямом подключении саудовской нефти к европейским рынкам."
 SAU_pipeline_yemen: "Аравийский морской трубопровод"
 SAU_pipeline_yemen_desc: "Построить трубопровод через дружественный Южный Йемен и Аль-Махру к Аравийскому морю. Этот трубопровод остается уязвимым для сбоев, пока продолжается война в Йемене."
 SAU_proj_alula: "Постройте Алулу"
 SAU_proj_alula_desc: "Превращение древних набатейских гробниц и оазиса Аль-Улы в флагманский культурно-исторический центр. §Y(Стоимость: $50 млрд, строительство примерно за 450 дней)§! §RКрайний срок: осталось [?SAU_remain_alula|0] дней.§! §HЗанимает 5 гражданских заводов, находящихся в стадии строительства.§!"
 SAU_proj_amaala: "Постройте Амаалу"
 SAU_proj_amaala_desc: "Оздоровительный и элитный туристический анклав на северо-западном побережье Красного моря, «Ривьера Ближнего Востока». §Y(Стоимость: $50 млрд, строительство примерно за 450 дней)§! §RКрайний срок: осталось [?SAU_remain_amaala|0] дней.§! §HЗанимает 5 гражданских заводов, находящихся в стадии строительства.§!"
 SAU_proj_diriyah: "Постройте Дирийю"
 SAU_proj_diriyah_desc: "Восстановление места рождения Королевства и превращение его в исторический и культурный район вокруг глинобитного города Ат-Тураиф. §Y(Стоимость: $50 млрд, строительство примерно за 450 дней)§! §RКрайний срок: осталось [?SAU_remain_diriyah|0] дней.§! §HЗанимает 5 гражданских заводов, находящихся в стадии строительства.§!"
 SAU_proj_green_riyadh: "Построим зеленый Эр-Рияд"
 SAU_proj_green_riyadh_desc: "Программа по посадке миллионов деревьев по всей столице, направленная на охлаждение города и смягчение воздействия пустыни. §Y(Стоимость: $30 млрд, строительство ~365 дней)§! §RКрайний срок: осталось [?SAU_remain_green_riyadh|0] дней.§! §HЗанимает 4 гражданских завода, находящихся в стадии строительства.§!"
 SAU_proj_jeddah_central: "Постройте центральный офис Джидды."
 SAU_proj_jeddah_central_desc: "Реконструкция набережной Джидды с целью превращения её в современный центр города со стадионом, пристанью для яхт и культурным районом. §Y(Стоимость: $60 млрд, строительство ~450 дней)§! §RКрайний срок: осталось [?SAU_remain_jeddah_central|0] дней.§! §HЗанимает 6 гражданских заводов, находящихся в стадии строительства.§!"
 SAU_proj_king_salman_park: "Постройте парк имени короля Салмана"
 SAU_proj_king_salman_park_desc: "Создать в Эр-Рияде один из крупнейших в мире городских парков. §Y(Стоимость: $40 млрд, строительство ~270 дней)§! §RКрайний срок: осталось [?SAU_remain_king_salman_park|0] дней.§! §HЗанимает 4 гражданских завода, находящихся в стадии строительства.§!"
 SAU_proj_neom: "Создайте NEOM"
 SAU_proj_neom_desc: "Развитие NEOM как флагманского постнефтяного городского и промышленного региона Королевства на побережье Красного моря. §Y(Стоимость: $150 млрд, строительство ~730 дней)§! §RКрайний срок: осталось [?SAU_remain_neom|0] дней.§! §HЗадействует 10 гражданских заводов во время строительства.§!"
 SAU_proj_new_murabba: "Построить новый Мурабба"
 SAU_proj_new_murabba_desc: "В центре Эр-Рияда появился новый комплекс зданий, построенный вокруг Мукааба — кубообразной башни, достаточно огромной, чтобы вместить двадцать небоскрёбов Эмпайр-стейт-билдинг. §Y(Стоимость: $100 млрд, строительство ~730 дней)§! §RКрайний срок: осталось [?SAU_remain_new_murabba|0] дней.§! §HЗанимает 10 гражданских заводов, находящихся в стадии строительства.§!"
 SAU_proj_oxagon: "Постройте оксагон"
 SAU_proj_oxagon_desc: "Построить плавучий порт и производственный центр в NEOM, ориентированный на экологически чистую энергетику. §Y(Стоимость: $80 млрд, строительство ~540 дней)§! §RКрайний срок: осталось [?SAU_remain_oxagon|0] дней.§! §HЗанимает 8 гражданских заводов, находящихся в стадии строительства.§!"
 SAU_proj_qiddiya: "Постройте Киддию"
 SAU_proj_qiddiya_desc: "Мегаполис развлечений, спорта и культуры за пределами Эр-Рияда, с тематическими парками, стадионами и автодромом. §Y(Стоимость: $80 млрд, строительство ~540 дней)§! §RКрайний срок: осталось [?SAU_remain_qiddiya|0] дней.§! §HЗанимает 8 гражданских заводов, находящихся в стадии строительства.§!"
 SAU_proj_red_sea: "Постройте проект «Красное море»"
 SAU_proj_red_sea_desc: "Элитный туристический комплекс, расположенный на десятках нетронутых островов и построенный в соответствии со строгими экологическими стандартами. §Y(Стоимость: $80 млрд, строительство ~540 дней)§! §RКрайний срок: осталось [?SAU_remain_red_sea|0] дней.§! §HЗанимает 7 гражданских заводов, находящихся в стадии строительства.§!"
 SAU_proj_roshn: "Постройте РОШНА"
 SAU_proj_roshn_desc: "Национальный застройщик, строящий целые интегрированные жилые комплексы, чтобы обеспечить миллионы саудовцев современным жильём. §Y(Стоимость: $60 млрд, строительство ~365 дней)§! §RКрайний срок: осталось [?SAU_remain_roshn|0] дней.§! §HЗанимает 7 гражданских заводов, находящихся в стадии строительства.§!"
 SAU_proj_sindalah: "Постройте Синдалу"
 SAU_proj_sindalah_desc: "Развитие Синдалы как роскошного островного курорта NEOM на Красном море и первого проекта компании, открытого для посетителей. §Y(Стоимость: $40 млрд, строительство ~270 дней)§! §RКрайний срок: осталось [?SAU_remain_sindalah|0] дней.§! §HЗанимает 4 гражданских завода, находящихся в стадии строительства.§!"
 SAU_proj_soudah_peaks: "Постройте вершины Суда"
 SAU_proj_soudah_peaks_desc: "Развитие горного туристического комплекса на высоких вершинах Асира с использованием более прохладного климата и зелёных ландшафтов региона. §Y(Стоимость: $40 млрд, строительство ~450 дней)§! §RКрайний срок: осталось [?SAU_remain_soudah_peaks|0] дней.§! §HЗанимает 5 гражданских заводов, находящихся в стадии строительства.§!"
 SAU_proj_sports_blvd: "Постройте спортивный бульвар."
 SAU_proj_sports_blvd_desc: "Рекреационный коридор протяжённостью 135 километров, проходящий через Эр-Рияд, предназначен для езды на велосипеде, бега и верховой езды. §Y(Стоимость: $30 млрд, строительство ~270 дней)§! §RКрайний срок: осталось [?SAU_remain_sports_blvd|0] дней.§! §HЗанимает 4 гражданских завода, находящихся в стадии строительства.§!"
 SAU_proj_the_line: "Постройте линию"
 SAU_proj_the_line_desc: "Постройте THE LINE — линейный город без автомобилей протяжённостью 170 километров, расположенный между двумя зеркальными сооружениями длиной 500 метров. §Y(Стоимость: $200 млрд, строительство примерно за 900 дней)§! §RКрайний срок: осталось [?SAU_remain_the_line|0] дней.§! §HЗанимает 12 гражданских заводов, находящихся в стадии строительства.§!"
 SAU_proj_trojena: "Построить Тройену"
 SAU_proj_trojena_desc: "Круглогодичный горный курорт в высокогорье NEOM с открытым горнолыжным склоном в аравийской пустыне. §Y(Стоимость: $60 млрд, строительство ~450 дней)§! §RКрайний срок: осталось [?SAU_remain_trojena|0] дней.§! §HЗанимает 5 гражданских заводов, находящихся в стадии строительства.§!"
 SAU_rally_support: "Мобилизуйте поддержку нашего кандидата"
 SAU_rally_support_desc: "Заручитесь поддержкой королевской семьи, религиозных кругов и прессы для своего принца. Результат может быть незначительным, существенным или представлять собой крупный прорыв."
 SAU_repair_pipeline_iraq: "Расширить европейский трубопровод"
 SAU_repair_pipeline_iraq_desc: "Поднимите северную магистраль на один уровень выше, восстановив то, что было отнято в результате саботажа, или создав дополнительные насосные мощности для транспортировки большего количества нефти в Турцию."
 SAU_repair_pipeline_syria: "Расширить Левантийский трубопровод"
 SAU_repair_pipeline_syria_desc: "Поднимите средиземноморскую линию на новый уровень, восстановив то, что было уничтожено в результате саботажа, или расширив коридор через Амман и Дамаск."
 SAU_repair_pipeline_yemen: "Расширить Аравийский морской трубопровод"
 SAU_repair_pipeline_yemen_desc: "Поднимите южную магистраль на один уровень выше, восстановив то, что было уничтожено в результате саботажа, или создав дополнительные мощности для переброски большего количества нефти через Ормузский пролив."
 SAU_request_f15: "Запросить у Соединенных Штатов истребитель F-15"
 SAU_request_f15_desc: "Начаты переговоры с Вашингтоном о приобретении истребителей F-15 Strike Eagle. Если американцы согласятся, то... §YИстребитель F-15 Strike Eagle§! Фокус разблокируется.\n\n§RЭто эксклюзивный выбор:§! первый поставщик, принявший на вооружение замки безопасности в нашем истребителе, а также три другие программы (§YТорнадо GR4§!, §YПанавия Торнадо§!, §YЕврофайтер Тайфун§!) будет закрыт навсегда. Выбирайте с умом."
 SAU_request_panavia: "Закажите самолет Panavia Tornado из Италии."
 SAU_request_panavia_desc: "Обратитесь в Рим за Panavia Tornado IDS, многонациональным ударным истребителем. Если итальянцы согласятся, то будет разблокирован фокус §YPanavia Tornado§!.\n\n§RЭто эксклюзивный выбор: §! первый поставщик, принявший блокировку нашего истребителя, и три другие программы (§YF-15 Strike Eagle§!, §YTornado GR4§!, §YUrofighter Typhoon§!) будут закрыты навсегда. Выбирайте с умом."
 SAU_request_tornado: "Запросите самолет Tornado GR4 из Великобритании."
 SAU_request_tornado_desc: "Направляйтесь в Лондон за ударными самолетами Tornado GR4, составляющими основу исторической программы «Аль-Ямама». Если британцы согласятся, то §YТорнадо GR4§! Фокус разблокируется.\n\n§RЭто эксклюзивный выбор:§! первый поставщик, принявший на вооружение замки безопасности в нашем истребителе, а также три другие программы (§YИстребитель F-15 Strike Eagle§!, §YПанавия Торнадо§!, §YЕврофайтер Тайфун§!) будет закрыт навсегда. Выбирайте с умом."
 SAU_request_typhoon: "Запросить истребитель Eurofighter Typhoon"
 SAU_request_typhoon_desc: "Обратиться к европейскому консорциуму (Германия) по программе «Аль-Салам» для истребителя Eurofighter Typhoon. Если они одобрят экспорт, то §YАль-Салам: Eurofighter Typhoon§! Фокус разблокируется.\n\n§RЭто эксклюзивный выбор:§! первый поставщик, принявший на вооружение замки безопасности в нашем истребителе, а также три другие программы (§YИстребитель F-15 Strike Eagle§!, §YТорнадо GR4§!, §YПанавия Торнадо§!) будет закрыт навсегда. Выбирайте с умом."
 SAU_rivalry_back_separatists: "Поддержите сепаратистов!"
 SAU_rivalry_back_separatists_desc: "Главное управление разведки направляет деньги и оружие в Ахваз, Белуджистан и Курдистан. На периферии Ирана начинается волнение."
 SAU_rivalry_propaganda_blitz: "Антииранская медиа-атака"
 SAU_rivalry_propaganda_blitz_desc: "Заполните эфир и мечети информацией о деле против Тегерана."
 SAU_rivalry_strait_patrols: "Патрули пролива"
 SAU_rivalry_strait_patrols_desc: "Продолжайте вести бурение в узких водах Ормузского пролива."
 SAU_royal_patronage: "Королевское покровительство"
 SAU_royal_patronage_desc: "Используйте королевские назначения и контракты, чтобы заручиться поддержкой выбранного кандидата среди старших членов семьи. Это возможно один раз в каждой гонке за престолонаследие.\n\n§G+20 позиций§! для принца, которого вы уже поддерживаете, §Yодин раз при короле Абдалле и один раз при короле Салмане§!."
 SAU_royal_patronage_tt: "§G+20§! к положению принца, которого вы поддерживаете"
 SAU_sabotage_pipeline_iraq: "Забастовка против европейского трубопровода"
 SAU_sabotage_pipeline_iraq_desc: "Повредите трубопровод, по которому саудовская нефть транспортируется через Ирак в Европу. Перережьте его, и вместе с этим рухнет и противостояние Эр-Рияда Москве."
 SAU_sabotage_pipeline_syria: "Уничтожить Левантийский трубопровод"
 SAU_sabotage_pipeline_syria_desc: "Цельтесь в саудовский трубопровод, проходящий через Средиземное море. Успешное попадание перережет линию и лишит Королевство доступа к этому маршруту."
 SAU_sabotage_pipeline_yemen: "Удар по Аравийскому морскому трубопроводу"
 SAU_sabotage_pipeline_yemen_desc: "Отправьте диверсантов против саудовской линии обороны через южный Йемен. Если им это удастся, добыча нефти прекратится, и Королевство потеряет свой южный маршрут."
 SAU_salman_burden_of_state: "Обложите короля государственными делами"
 SAU_salman_burden_of_state_desc: "Поручите королю заниматься делами, делегированием полномочий и проведением церемоний, которые обычно делегируются другим лицам. Увеличение рабочей нагрузки ускорит ухудшение его здоровья."
 SAU_salman_cpsa_council: "Созыв Совета по политическим вопросам и вопросам безопасности"
 SAU_salman_cpsa_council_desc: "Замените существующие комитеты по безопасности единым Советом по политическим вопросам и вопросам безопасности, заседающим в королевском дворце. Консолидация полномочий сократит время, необходимое для принятия важных решений."
 SAU_salman_health_status: "§HКоролевское здоровье§!: [GetSAUKingHealth]"
 SAU_salman_health_status_desc: "Состояние здоровья короля указано как [GetSAUKingHealth]. Когда его здоровье ухудшится, наследный принц станет королём."
 SAU_salman_ksrelief: "Мобилизация операций по оказанию помощи в штате Канзас."
 SAU_salman_ksrelief_desc: "Организация KSrelief отправляет за границу конвои с гуманитарной помощью, полевые госпитали и продовольствие под официальным саудовским покровительством. Операция обеспечивает гуманитарную помощь и одновременно повышает поддержку правительства внутри страны."
 SAU_salman_maneuver: "Фракционные маневры Салмана"
 SAU_salman_maneuver_desc: "Блок Судаири работает над продвижением претензий Салмана и может настроить суд против вашего кандидата."
 SAU_salman_riyadh_metro_plan: "Расширить план развития столичного региона Эр-Рияда"
 SAU_salman_riyadh_metro_plan_desc: "Расширение Эр-Рияда за счет шести линий метро и ряда новых районов, организованных вокруг транспортной сети."
 SAU_salman_royal_decrees: "Выпуск королевских структурных указов"
 SAU_salman_royal_decrees_desc: "Используйте королевские указы для объединения, упразднения и реорганизации министерств без длительного законодательного процесса."
 SAU_salman_royal_physicians: "Вызовите королевских врачей"
 SAU_salman_royal_physicians_desc: "Пригласите специалистов из Европы и США для лечения короля и освободите ему время для отдыха. Это временно улучшит его состояние, но не сможет остановить его ухудшение в долгосрочной перспективе."
 SAU_salman_spark_park: "Субсидировать энергетический парк имени короля Салмана"
 SAU_salman_spark_park_desc: "Предоставить субсидии энергетическому парку имени короля Салмана площадью тридцать квадратных километров недалеко от Даммама для производства насосов, клапанов и бурового оборудования внутри страны."
 SAU_shura_convene_session: "Созовите Совет"
 SAU_shura_convene_session_desc: "Провести протокол заседания Меджлиса аш-Шура с обязательным присутствием министров, которые должны будут ответить на вопросы. Протокол заседания будет опубликован и может повлиять на общественную дискуссию, несмотря на то, что король сохраняет за собой окончательную власть.\n\nЭто решение может быть принято один раз."
 SAU_shura_seat_notables: "Рассадите видных деятелей"
 SAU_shura_seat_notables_desc: "Назначить в Совет племенных шейхов и видные купеческие семьи из Джидды и Бурайды.\n\nПовторяется каждые 60 дней."
 SAU_shura_seat_notables_tt: "§G+10 важных мест§!, §R-5 мест§! для улемов и технократов\n§GВозглавляемые влиятельными лицами§!: §G+8% политической власти, -8% затрат на коррупцию§! / §R+3% товаров народного потребления, -3% поддержки войны§!\n§YПри наличии 70 мест король может навсегда утвердить Совет.§!"
 SAU_shura_seat_technocrats: "Усадите технократов!"
 SAU_shura_seat_technocrats_desc: "Назначить в Совет экономистов, инженеров и опытных сотрудников министерств, в том числе саудовцев, получивших образование за рубежом.\n\nПовторять каждые 60 дней."
 SAU_shura_seat_technocrats_tt: "§G+10 мест для технократов§!, §R-5 мест§! для улемов и знати\n§YПод руководством технократов§!: §G+8% исследований, +6% производительности труда, +5% роста производительности труда§! / §R-5% стабильности§!\n§YПри наличии 70 мест король может навсегда утвердить Совет.§!"
 SAU_shura_seat_ulema: "Посадите улемов"
 SAU_shura_seat_ulema_desc: "Назначить в Совет видных религиозных деятелей и утвержденных ими кандидатов, увеличив влияние духовенства на его работу.\n\nПовторяется каждые 60 дней."
 SAU_shura_seat_ulema_tt: "§G+10 мест улемов§!, §R-5 мест§! для технократов и знати\n§OПод руководством улемов§!: §G+8% стабильности, +10% защиты от дрейфа§! / §R-5% исследований, -5% миграции§!\n§YПри наличии 70 мест король может навсегда утвердить Совет.§!"
 SAU_spread_revolution_category: "Распространяйте революцию"
 SAU_storm_air_campaign: "Ударить по позициям хуситов"
 SAU_storm_air_campaign_desc: "Выберите провинцию, контролируемую движением хуситов, и нанесите удар по её складам, аэродромам и дорогам снабжения. Атака также повредит близлежащую инфраструктуру и нанесёт потери.\n\n§RПовреждает инфраструктуру, оружейную промышленность и противовоздушную оборону§! в целевой провинции и обходится защитникам в живой силе. Повторяется каждые 14 дней."
 SAU_storm_partner_readout: "Коалиция: партнеры [?SAU_coalition_partners|0]"
 SAU_storm_partner_readout_desc: "§HШтаты, летающие с Королевством§!: §Y[?SAU_coalition_partners|0]§!\n\nКаждый член коалиции может выйти из нее самостоятельно."
 SAU_storm_stand_down: "Прекратите кампанию"
 SAU_storm_stand_down_desc: "Прекратить боевые вылеты коалиции и завершить кампанию без дальнейших военных действий.\n\n§G+4% стабильности§!, §R-3% поддержки войны§!Завершает кампанию окончательно."
 SAU_undermine_mbn: "Подорвать позиции Мухаммеда бин Найефа"
 SAU_undermine_mbn_desc: "Использование связей в суде, компрометирующих разоблачений и утаивание покровительства могут привести к снижению поддержки Мохаммеда бин Найефа. Результат может варьироваться от отсутствия эффекта до значительной потери влияния."
 SAU_undermine_mutaib: "Подорвать авторитет Мутаиба бин Абдуллы"
 SAU_undermine_mutaib_desc: "Использование связей в суде, компрометирующих разоблачений и утаивание покровительства могут привести к снижению поддержки Мутаиба бин Абдуллы. Результат может варьироваться от отсутствия эффекта до значительной потери влияния."
 SAU_undermine_salman: "Подорвать Салмана бин Абдель Азиза"
 SAU_undermine_salman_desc: "Использование связей в суде, компрометирующих разоблачений и утаивание покровительства могут привести к снижению поддержки Салмана бин Абдулазиза. Результат может варьироваться от отсутствия эффекта до значительной потери влияния."
 SAU_unleash_laf: "Дайте волю ливанской армии!"
 SAU_unleash_laf_desc: "Армия восстановлена, обеспечена жалованьем и вооружена. Теперь Эр-Рияд требует от Бейрута единственного действительно важного вознаграждения: разоружить «Хезболлу», если потребуется, силой."
 SAU_vision2030_category: "Проекты «Видение 2030»"
 SAU_west_free_trade: "Свободная торговля с Западом"
 SAU_west_free_trade_desc: "Снижение тарифов и подписание торговых соглашений со странами блока НАТО. Отношения с западным альянсом улучшаются, а открытое торговое соглашение связывает их рынки с Королевством."
 SAU_west_joint_training: "Совместная американо-саудовская учебная программа"
 SAU_west_joint_training_desc: "Проведение совместных учений с американскими инструкторами для улучшения общевойсковой подготовки Саудовской Аравии и обмена опытом между различными родами войск."
 SAU_west_petrodollar: "Переработка нефтедолларов"
 SAU_west_petrodollar_desc: "Доходы от продажи нефти в Саудовской Аравии реинвестируются в казначейские облигации США и совместные американские проекты. Королевство получает меньше первоначальной выгоды, но Вашингтон становится богаче и укрепляет свои позиции в поддержку династии Саудов."
 SAU_yemen_old_weapons: "Корабельное избыточное вооружение"
 SAU_yemen_old_weapons_desc: "Передача устаревшего саудовского пехотного вооружения из военных запасов правительству Йемена с минимальными внутренними затратами."
 SAU_yemen_raise_brigade: "Координировать наступление"
 SAU_yemen_raise_brigade_desc: "Внедрить саудовских офицеров в йеменское командование и спланировать скоординированное наступление. Правительственные силы получат существенное преимущество в атаке против хуситов."
 SAU_yemen_war_funds: "Поддержите военные усилия"
 SAU_yemen_war_funds_desc: "Перевести деньги в Аден для выплаты зарплат, закупки топлива и обеспечения дальнейшего пребывания правительственных солдат на передовой."
 YEM_drop_south_yemen_name: "Вернем Йемену былое имя"
 YEM_drop_south_yemen_name_desc: "Отбросьте в сторону идентичность Южного Йемена и снова управляйте просто как Йемен."
 yemen_partition_category: "Два Йемена"
 SAU_events.1.a: "Да смилуется Аллах над его душой."
 SAU_events.1.d: "Король Фахд бин Абдулазиз Аль-Сауд, Хранитель двух священных мечетей, скончался после многолетней болезни, усугубившейся инсультом в 1995 году. На престол взойдет наследный принц Абдулла, который фактически правил королевством почти десять лет. Кризис престолонаследия, нависший над королевством на протяжении многих лет, наконец-то разрешен."
 SAU_events.1.t: "Смерть короля Фахда"
 SAU_events.10.a: "Присоединяйтесь к ОПЕК+."
 SAU_events.10.b: "Отклонить соглашение."
 SAU_events.10.d: "Эр-Рияд предлагает координировать добычу нефти с Москвой в рамках ОПЕК+, что даст обеим странам-экспортерам большее влияние на мировые цены."
 SAU_events.10.t: "Соглашение ОПЕК+ [SAU.GetFlag] [SOV.GetFlag]"
 SAU_events.100.a: "Регион затаил дыхание"
 SAU_events.100.d: "Иран начал войну против отколовшейся Аравийской Республики, ввергнув Персидский залив в открытый конфликт между двумя соперничающими центрами шиитской власти."
 SAU_events.100.t: "Война в Персидском заливе"
 SAU_events.101.a: "Мы выстоим"
 SAU_events.101.d: "Тегеран не вступил в войну, но его ярость очевидна. Иранские агенты разжигают беспорядки в наших городах, а иранские СМИ объявляют республику еретическим государством."
 SAU_events.101.t: "Тегеран кипит от негодования"
 SAU_events.102.a: "Примириться с монархиями Персидского залива"
 SAU_events.102.b: "Отстаивайте дело арабской демократии."
 SAU_events.102.d: "После того как парламент начал свою работу, а республика встала на ноги, вопрос о месте Аравии в мире больше нельзя откладывать. Заключит ли она мир с монархиями Персидского залива или возглавит движение за арабскую демократию?"
 SAU_events.102.t: "Республика и регион"
 SAU_events.103.a: "Вступите в лигу"
 SAU_events.103.b: "Сохраняйте независимость"
 SAU_events.103.d: "Республика Аравия приглашает нашу страну в лигу арабских демократий, блок, подотчетный своим народам, а не королям или духовенству."
 SAU_events.103.t: "Призыв к демократиям"
 SAU_events.104.a: "Новая глава в истории Аравии"
 SAU_events.104.d: "Десятилетия абсолютной монархии подошли к концу. Пока толпы людей заполняют улицы Эр-Рияда, Переходный национальный совет захватил бразды правления, поклявшись управлять страной только до тех пор, пока Аравия не сможет сама выбирать свой путь на выборах."
 SAU_events.104.t: "Дом водопадов Саудов"
 SAU_events.107.a: "Провозгласить Арабскую Республику Аравия"
 SAU_events.107.b: "Сохраним Республику Аравия"
 SAU_events.107.d: "Партия Баас держит бразды правления государством. Должна ли Аравия провозгласить себя Арабской Республикой, авангардом арабской нации, или сохранить скромное название Республики Аравия?"
 SAU_events.107.t: "Название Республики"
 SAU_events.109.a: "Присоединяйтесь к Арабскому Коминтерну"
 SAU_events.109.b: "Мы останемся одни"
 SAU_events.109.d: "[FROM.GetName] приглашает нас в Арабский Коминтерн, союз рабочих государств, объединенных делом революции. Мы можем присоединиться к нашим товарищам или идти своим собственным путем."
 SAU_events.109.t: "Призыв к Арабскому Коминтерну"
 SAU_events.11.a: "Примите предложение."
 SAU_events.11.b: "Отклоните предложение."
 SAU_events.11.d: "Эр-Рияд предлагает Вашингтону долгосрочное соглашение: стабильные поставки саудовской нефти на американские рынки в обмен на более тесное сотрудничество в сфере безопасности. Королевство ожидает ответа."
 SAU_events.11.t: "[SAU.GetFlag] Нефть для безопасности"
 SAU_events.110.a: "Дорогостоящий урок."
 SAU_events.110.d: "Свободная сирийская армия разгромлена. Вооруженные и финансируемые нами повстанцы рассеяны или убиты, а Дамаск стоит непоколебимо. Годы вложений в Сирию, как в финансовые ресурсы, так и в авторитет, принесли Королевству лишь унизительное поражение и режим, который теперь оказывает на Тегеран еще большее давление, чем когда-либо."
 SAU_events.110.t: "Сирийская схема рушится"
 SAU_events.111.a: "Примите прекращение огня"
 SAU_events.111.b: "Война продолжается"
 SAU_events.111.d: "Эр-Рияд выдвинул условия прекращения огня. Королевство прекратит свою воздушную кампанию и прямые боевые действия, оставив правительство Саны вести свою собственную войну. Предложение остается в силе."
 SAU_events.111.t: "Предложение Саудовской Аравии о прекращении огня"
 SAU_events.112.a: "Пауза в боевых действиях"
 SAU_events.112.d: "Сана согласилась на прекращение огня. Операция «Решительная буря» завершена, и Королевство отступает с йеменского фронта. Перемирие будет действовать только до тех пор, пока мы этого хотим."
 SAU_events.112.t: "Хуситы согласны"
 SAU_events.113.a: "Пусть будет так"
 SAU_events.113.d: "Сана категорически отвергла наши условия. Война в Йемене продолжается, и операция «Решительная буря» продолжается."
 SAU_events.113.t: "Хуситы отрекаются от своих хозяев"
 SAU_events.114.a: "Тогда мы будем драться"
 SAU_events.114.d: "Перемирие закончилось. Воодушевленная и перевооруженная, группировка «Ансар Аллах» нарушила режим прекращения огня и возобновила свои атаки. Война в Йемене возобновилась, независимо от того, желало этого Королевство или нет."
 SAU_events.114.t: "Хуситы нарушили перемирие."
 SAU_events.115.a: "Объявите его королём. Он ждал достаточно долго."
 SAU_events.115.b: "Сейчас неподходящее время. Пусть он служит наследным принцем."
 SAU_events.115.d_mbn: "Приказ остаётся в силе. Мухаммед бин Найеф остаётся наследным принцем, его притязания подтверждены королём и не оспариваются публично. Молодой человек уходит в свои министерства, пока что оказавшись перехитренным, — и королевство вздыхает с облегчением."
 SAU_events.115.d_mbs: "Свершилось. Мухаммед бин Найеф освобожден от своих обязанностей и перед камерами целует руку молодого человека, который его сместил. Мухаммед бин Салман — наследный принц, и линия престолонаследия перескочила через поколение. Старшие принцы молчат. Молчание само по себе является ответом."
 SAU_events.115.t: "Назначен наследный принц."
 SAU_events.116.a: "Да будет его царствование долгим."
 SAU_events.116.d_mbn: "Король Салман умер, и наследный принц восходит на престол, как ему и было предначертано. Мухаммед бин Найеф занимает трон при поддержке служб безопасности и с репутацией, построенной на обеспечении процветания королевства."
 SAU_events.116.d_mbs: "Король Салман умер, и трон переходит к его сыну. Мухаммед бин Салман правит королевством единолично в возрасте, когда большинство его предшественников еще ждали назначения на министерский пост. Те, кто сомневался в нем, давно уже ушли в отставку, были арестованы или примирились."
 SAU_events.116.t: "Новый король в Эр-Рияде"
 SAU_events.117.a: "Отправьте их домой."
 SAU_events.117.b: "Приспособьте к естественному состоянию полезные из них."
 SAU_events.117.d: "Девять миллионов иностранных рабочих поддерживают экономику Королевства. Они прокладывают трубы, работают в больницах, водят грузовики и заполняют строительные площадки — и они не являются и никогда не будут частью нации, которую фейсалисты намерены восстановить. Совет не может прийти к единому мнению: являются ли они строительными лесами, которые нужно убрать, или фундаментом, на котором нужно строить."
 SAU_events.117.t: "Вопрос о рабочей силе за рубежом"
 SAU_events.118.a: "Удалите то, о чём мы не писали."
 SAU_events.118.b: "Работайте с ними изнутри."
 SAU_events.118.d: "Организация Объединенных Наций, Фонд и Банк были созданы без согласия Королевства. Выход из состава Совета освободит Эр-Рияд от институтов, которые он не создавал, но оставит о нем лишь разговоры, а не голоса. Совету предстоит сделать выбор между дистанцированием и влиянием."
 SAU_events.118.t: "Вопрос международных форумов"
 SAU_events.119.a: "Заберите всё домой."
 SAU_events.119.b: "Оставьте это там, где оно заслужило свою ценность."
 SAU_events.119.d: "Сотни миллиардов хранятся в западных казначействах и банках, оставаясь в безопасности и принося прибыль, но уязвимые для внешнего давления. Возвращение этих средств в страну позволило бы финансировать развитие Королевства; оставление их за рубежом сохранило бы их доходность и влияние Эр-Рияда в западных столицах."
 SAU_events.119.t: "Вопрос о внешнем богатстве"
 SAU_events.12.a: "Примите предложение о партнерстве."
 SAU_events.12.b: "Отклоните предложение."
 SAU_events.12.d: "Саудовская Аравия предлагает долгосрочное партнерство с Великобританией. Доходы от нефти позволят финансировать британскую промышленность и экспертизу, возродив дух Аль-Ямамы."
 SAU_events.12.t: "[SAU.GetFlag] Саудовско-британское партнерство"
 SAU_events.120.a: "Посещение мечетей — это обязанность, а не требование."
 SAU_events.120.b: "Мы говорим от имени верующих."
 SAU_events.120.d: "Более миллиарда мусульман не имеют единого политического голоса. Королевство владеет Меккой и Мединой, и улемы задаются вопросом, является ли это доверие обязанностью исполнять его тихо или мандатом открыто руководить уммой."
 SAU_events.120.t: "Глобальный вопрос об умме"
 SAU_events.121.a: "Мандат на самодостаточность."
 SAU_events.121.b: "Вооружение на равном расстоянии."
 SAU_events.121.d: "Два блока убеждены, что Королевство принадлежит им безвозмездно. Эр-Рияд может оставаться вооруженным и находиться на равном расстоянии, закупая оружие у обоих блоков, но не принадлежа ни к одному из них, или смириться с необходимостью создания собственного оружия и не зависеть от иностранного арсенала."
 SAU_events.121.t: "Вопрос взаимодействия сверхдержав"
 SAU_events.122.a: "Милостыня, даваемая безвозмездно."
 SAU_events.122.b: "Помощь при определенных условиях."
 SAU_events.122.d: "Саудовские деньги попадают во все уголки мусульманского мира: в мечети, клиники, правительства и армии. Фейсал раздавал их в качестве милостыни и ничего не просил в письменном виде; его наследники утверждают, что помощь без условий не приносит долгосрочного влияния. Королевству предстоит сделать выбор между благотворительностью и рычагами влияния."
 SAU_events.122.t: "Вопрос о суверенной помощи"
 SAU_events.123.a: "Выбить чужие флаги. Они отправляются домой."
 SAU_events.123.a_tt: "Все иностранные державы лишаются военного доступа в Королевство."
 SAU_events.123.b: "Договоренность остается в силе. Необходимость позволяет то, что запрещает принцип."
 SAU_events.123.d: "Иностранные флаги по-прежнему развеваются над саудовской территорией, и с каждым годом отвечать на проповеди становится все сложнее. Гарнизоны гарантируют Королевству защиту от соседей и одновременно унижают его перед собственным духовенством. Совет исчерпал все возможности отложить принятие решения."
 SAU_events.123.t: "Вопрос о зарубежных военных базах"
 SAU_events.124.a: "Провозгласите это с кафедры."
 SAU_events.124.b: "Провозгласите это из дворца."
 SAU_events.124.d: "Когда Фейсал в 1964 году занял трон, свергнув своего брата, он сделал это, имея на руках фетву, а Совет министров уже был реорганизован под его руководством — мечеть и аппарат были перевезены в ту же неделю. Сауд довел королевство до грани банкротства; Фейсал ответил мерами жесткой экономии, о которых никто не просил, и программой из десяти пунктов, за которую никто не голосовал.\n\nПрограмма должна быть возобновлена. Остается только вопрос, от чьего имени она будет возобновлена — духовенство помнит короля, который правил вместе с ними, а министерства помнят короля, который управлял государством сам."
 SAU_events.124.t: "Возрождение файсалитизма"
 SAU_events.125.a: "Выкупить их чартерные договоры."
 SAU_events.125.b: "Замените их полностью."
 SAU_events.125.d: "Абдулазиз связал полуостров браками и жалованиями, оставив своим сыновьям управлять провинциями, которые, по сути, были их собственными. Фейсал потратил одиннадцать лет на то, чтобы освободить министерства от этого соглашения, но так и не завершил этот процесс до конца.\n\nХартии можно выкупить за цену, которую почувствует казначейство, или же их можно просто отозвать — что дешевле и наживает врагов внутри семьи, которые переживут короля, издавшего эти хартии."
 SAU_events.125.t: "Централизация провинциальных эмиратов"
 SAU_events.126.a: "Отдайте им суды."
 SAU_events.126.b: "Отдайте им школы."
 SAU_events.126.d: "Фейсал правил, опираясь на поддержку учёных, и оплачивал всё в рассрочку. Когда в 1965 году он привёл в Королевство телевидение, его собственный племянник погиб, напав на телестанцию в Эр-Рияде, а десять лет спустя брат этого человека вошёл в меджлис и застрелил короля. Союз с улемами никогда не был ни декоративным, ни свободным.\n\nТо, что им дадут обратно сейчас, определит, каким будет это Королевство. Суды сделают их арбитрами права. Школы сделают их авторами следующего поколения."
 SAU_events.126.t: "Укрепить авторитет улемов"
 SAU_events.127.a: "Изгоните их."
 SAU_events.127.b: "Перевоспитать их."
 SAU_events.127.d: "Ирония ситуации не ускользает ни от кого: Фейсал сам построил технократию, отправляя саудовцев в Каир, Лондон и Калифорнию и назначая их на министерские посты по возвращении домой. Заки Ямани руководил нефтяным сектором, имея за плечами диплом Гарварда, и делал это лучше, чем кто-либо, кого Королевство могло бы воспитать у себя на родине.\n\nНо эти люди вернулись не только с квалификацией, и теперь Совет спорит о том, где найти решение: в аэропорту или в учебном классе."
 SAU_events.127.t: "Избавиться от вестернизированной элиты"
 SAU_events.128.a: "Приём по результатам осмотра."
 SAU_events.128.b: "Назначение по принципу лояльности."
 SAU_events.128.d: "До Фейсала в королевстве практически не было штата, который нужно было бы укомплектовывать. Финансы королевства управлялись через королевскую свиту и горстку доверенных купцов, а разница между казной и королевской казной была вопросом личного мнения. Он создал министерства там, где раньше были приближенные.\n\nДля чего на самом деле нужна новая бюрократия, так и не было решено. Служба, выбранная по результатам экзамена, будет компетентной и не будет благодарной. Служба, выбранная по принципу лояльности, не будет ни тем, ни другим."
 SAU_events.128.t: "Суверенная гражданская служба"
 SAU_events.129.a: "Пусть патрулируют большими силами."
 SAU_events.129.b: "Держите их в курсе."
 SAU_events.129.d: "Комитет по поощрению добродетели и предотвращению порока представлял собой разрозненную группу местных силовиков, пока государство не выделило ему бюджет, форму и субординацию. Фейсалу нужно было примирить духовенство с телевидением, женскими школами и иностранными инженерами, разгуливающими по улицам Дахрана, и Комитет был частью того, что он оплачивал.\n\nОн никогда не был в полной мере полицейскими силами, но и никогда ими полностью не переставал быть."
 SAU_events.129.t: "Возвращение комитетов добродетели"
 SAU_events.13.a: "Примите инвестиционное соглашение."
 SAU_events.13.d: "Отбросив старые подозрения, Эр-Рияд предлагает Парижу масштабное инвестиционное соглашение: саудовский капитал для французской промышленности и французский опыт для Королевства. Выгоду получат оба правительства."
 SAU_events.13.t: "[SAU.GetFlag] Франко-саудовский инвестиционный пакт"
 SAU_events.130.a: "Глушить спутники."
 SAU_events.130.b: "Купите сети."
 SAU_events.130.d: "Фейсал развязал свою первую медиавойну против «Голоса арабов» Насера, который вещал в саудовские казармы и сообщал саудовским солдатам, что их король — американский слуга. Эр-Рияд ответил собственными передатчиками и крупными денежными средствами, тайно переданными редакторам в Бейруте и Каире.\n\nУрок усвоен: с трансляцией спорить нельзя. Ее можно только заглушить или купить."
 SAU_events.130.t: "Запретить иностранные СМИ"
 SAU_events.131.a: "Рассадите видных деятелей."
 SAU_events.131.b: "Расширить членство."
 SAU_events.131.d: "Десятипунктная программа 1962 года обещала Королевству создание Консультативного совета. Фейсал правил еще тринадцать лет и так и не созвал его, и в 1992 году Фахду наконец-то пришлось сформировать его — с опозданием на тридцать лет, причем он был назначен, а не избран.\n\nОбещание дается снова, и состав совета — это весь аргумент. Привлечение видных деятелей превратило бы его в суд. Более широкий состав сделал бы его чем-то, что суд не мог бы полностью предсказать."
 SAU_events.131.t: "Реорганизация Меджлиса аш-Шура"
 SAU_events.132.a: "Технические институты."
 SAU_events.132.b: "Военные академии."
 SAU_events.132.d: "Этот экономический бум был создан руками других людей — йеменских рабочих, египетских учителей, палестинских служащих, а со временем и миллиона и более выходцев из Южной Азии. Ответом Фейсала стало образование в масштабах, невиданных ранее на полуострове: в 1967 году открылся Университет имени короля Абдулазиза, стипендиальные программы отправили тысячи людей за границу, и Королевство приступило к созданию собственного среднего класса.\n\nДля чего этот класс будет создан — это и будет определено решением Совета."
 SAU_events.132.t: "Национальная инициатива по формированию кадров"
 SAU_events.133.a: "Полностью загерметизируйте."
 SAU_events.133.b: "Признайте, кто нам нужен."
 SAU_events.133.d: "К 1970-м годам иностранная рабочая сила составляла почти треть от общего числа людей внутри страны, и именно она выполняла большую часть работы, обеспечивавшей функционирование экономики. Фейсал привлекал рабочую силу и беспокоился о связанных с этим политических последствиях: палестинцы принесли дело, йеменцы — численность, а египтяне — Насера.\n\nЗакрытие границы возвращает стране её самостоятельную целостность и создаёт для министерств дефицит рабочей силы, для решения которого у них нет никакого плана."
 SAU_events.133.t: "Закрытая граница"
 SAU_events.134.a: "Укрепите побережье."
 SAU_events.134.b: "Укрепите внутренние помещения."
 SAU_events.134.d: "Королевство Фейсала было окружено теми, кто хотел его уничтожить: Египтом Насера по другую сторону Красного моря, республиканцами в Сане, баасистами в Багдаде и Дамаске, а также Советским Союзом, который списал династию Саудов со счетов, считая её пережитком прошлого. Он создал Национальную гвардию для защиты от переворота и закупил американскую авиацию для борьбы с вторжением, и никогда не был до конца уверен, что произойдет раньше.\n\nТеперь Королевству предстоит решить, к какой угрозе оно на самом деле готовится."
 SAU_events.134.t: "Крепостное Королевство"
 SAU_events.135.a: "Соберите его в Мекке."
 SAU_events.135.b: "Созовите его за границей."
 SAU_events.135.d: "Когда в августе 1969 года сгорела Аль-Акса, Фейсал в течение нескольких недель собрал глав мусульманского мира в Рабате, и Организация исламской конференции существовала еще до конца года. Это был ответ на Лигу арабских государств Насера — не арабскую и светскую, а мусульманскую, возглавляемую из Мекки.\n\nМесто, где Королевство собирает верующих, само по себе является заявлением. Священные города придают легитимность, которую не может дать ни один конференц-зал за границей."
 SAU_events.135.t: "Исламская конференция солидарности"
 SAU_events.136.a: "Открыто угрожать введением эмбарго."
 SAU_events.136.b: "Применяйте это спокойно."
 SAU_events.136.d: "17 октября 1973 года компания Faisal сократила производство и перекрыла поставки в Соединенные Штаты. Цена за баррель выросла с трех до почти двенадцати долларов за сезон, Запад точно понял, чего стоит его комфорт, а Королевство обнаружило, что держит в руках оружие, которое никогда не думало применять.\n\nС тех пор оно не применялось. Министерство все это время поддерживало актуальность данных."
 SAU_events.136.t: "Дух 73-го"
 SAU_events.137.a: "Сначала оружие."
 SAU_events.137.b: "Сначала обо всём остальном."
 SAU_events.137.d: "Королевство добывает нефть, продает ее за границу и выкупает все необходимое обратно, включая трубопровод, по которому нефть транспортируется. Пятилетние планы Фейсала были призваны разорвать этот порочный круг и в значительной степени преуспели в создании объектов, которые ускоряют транспортировку нефти.\n\nЗамещение должно с чего-то начинаться, и то, с чего оно начинается, определяет, что Королевство может делать, не спрашивая ни у кого разрешения."
 SAU_events.137.t: "Искоренить иностранную зависимость"
 SAU_events.138.a: "Профинансируйте это."
 SAU_events.138.b: "Укомплектуйте штат."
 SAU_events.138.d: "Фейсал основал Всемирную мусульманскую лигу в Мекке в 1962 году и семь лет спустя способствовал созданию Организации исламской конференции. Обе организации располагались там, где к ним могли дойти саудовские деньги, и обе были созданы в ответ на панарабизм, в котором не было места для королей.\n\nЕго преемники продолжали оплачивать счета и постепенно перестали определять повестку дня. Деньги покупают почтение; чиновники покупают контроль. Это не одно и то же."
 SAU_events.138.t: "Возвращение лидерства в ОИК"
 SAU_events.139.a: "Строгая квота."
 SAU_events.139.b: "Поэтапная квота."
 SAU_events.139.d: "Компания Aramco была вынуждена закупать продукцию Saudi там, где она уже существовала, а там, где её не было, Королевство платило иностранным фирмам за строительство заводов по её производству. Это был медленный и дорогостоящий процесс, и он остаётся единственным способом для страны, импортирующей собственные буровые долота, прекратить это делать.\n\nНасколько жёстким будет установлен минимальный уровень требований, определяет, будут ли министерства соблюдать его или просто научатся подавать заявления на освобождение от требований."
 SAU_events.139.t: "Квота внутреннего предложения"
 SAU_events.14.a: "Примите инвестиции."
 SAU_events.14.b: "Отклоните предложение."
 SAU_events.14.d: "Саудовская Аравия предлагает инвестировать в нашу промышленность в обмен на углубление экономических связей. Принятие этого предложения приведет к появлению новых заводов и усилению влияния Саудовской Аравии."
 SAU_events.14.t: "[SAU.GetFlag] Инвестиции в страны НАТО"
 SAU_events.140.a: "Пусть он следует за Файсалом. Охрана его понесет."
 SAU_events.140.b: "Королевство Фейсала умерло вместе с Фейсалом. Пусть покоится с миром."
 SAU_events.140.d: "Фахд похоронен, и Абдулла наконец-то стал королем по праву собственного воли после десяти лет правления от имени другого человека. Вопрос о престолонаследии открыт, и принцы уже начали подсчет.\n\nСын короля приходит к нему с аргументом, а не с претензией. Митеб командует Национальной гвардией — племенными ополченцами, людьми из внутренних районов, силами, созданными именно потому, что регулярной армии нельзя было доверять вблизи трона. Он читал Фейсала: его политику жесткой экономии, самодостаточность, королевство, которое говорило от имени уммы и просило разрешения Вашингтона ни за что. Дядя, правивший таким образом, был застрелен собственным племянником, и каждый присутствующий в комнате это знает.\n\nВ программе Фейсала нет наследника. Митеб просит, чтобы он им стал."
 SAU_events.140.t: "Возрождение файсалитизма"
 SAU_events.141.a: "Пусть рынок сам найдет свой минимум."
 SAU_events.141.b: "Государство будет покупать. Мы не можем допустить, чтобы это превратилось в политику."
 SAU_events.141.d: "25 февраля индекс Tadawul All Share закрылся на отметке 20 634, а затем перестал расти. С тех пор он не перестает падать.\n\nЭто не обвал банков и финансовых учреждений. На этом рынке находилась почти половина взрослого населения Королевства — учителя, водители, солдаты, государственные служащие — многие из них владели акциями, купленными на заемные средства по ценам, которые никакая прибыль никогда не смогла бы оправдать. Брокерские конторы открывались в торговых центрах. Женщины торговали из отдельных помещений. В течение двух лет это было национальным развлечением.\n\nК тому времени, когда индекс достигнет своего минимума, он потеряет около двух третей своей стоимости, а вместе с ним и несколько сотен миллиардов риалов сбережений домохозяйств. Управлению по рынку капитала всего три года, и оно никогда не видело ничего подобного. Совету предстоит решить, поймает ли государство падающий нож или позволит рынку преподать урок, который он сам же и преподает."
 SAU_events.141.t: "Чёрный февраль"
 SAU_events.142.a: "Сократить производство. Отстоять цену."
 SAU_events.142.b: "Приостановите производство. Пусть сначала обанкротятся производители, которые слишком дорого обходятся."
 SAU_events.142.d: "Цена на баррель падает и не показывает признаков замедления. Бюджет был составлен на основе предположений, которые больше не соответствуют действительности, и каждое министерство вот-вот узнает, какие из его программ были доступны по цене, а какие просто финансировались.\nЭр-Рияд уже проходил через это. В начале 1980-х годов он сократил собственное производство, чтобы удержать цену, наблюдал, как все остальные производители тихо продавали свою продукцию, заполнив образовавшуюся брешь, и увидел, как добыча в Саудовской Аравии сократилась примерно на три четверти, в то время как цена все равно рухнула. Урок оказался дорогостоящим, и в министерстве до сих пор ведутся споры по этому поводу.\nКоролевство владеет самыми дешевыми баррелями в мире. Это единственное его реальное преимущество, и его можно потратить на защиту цены для всех или на то, чтобы пережить производителей, которые не могут позволить себе продавать по таким ценам."
 SAU_events.142.t: "Обвал цен на нефть"
 SAU_events.143.a: "Тяжелый урок в дорогом классе."
 SAU_events.143.d: "Саудовская фондовая биржа потеряла большую часть своей стоимости за считанные месяцы, что привело к потере нескольких сотен миллиардов риалов благосостояния домохозяйств. Необычно для рынка такого размера, что потери легли почти исключительно на плечи обычных саудовцев, а не на государственные учреждения — учителей, водителей и государственных служащих, которые покупали акции на пике, многие из них в кредит. Зарубежные аналитики отмечают, что крупнейший в мире экспортер нефти только что обнаружил, что у него также есть класс розничных инвесторов, и понятия не имеет, что с ними делать."
 SAU_events.143.t: "Эр-Рияд: Развал Тадавула"
 SAU_events.144.a: "Решение принимает ствол, как это всегда и бывает."
 SAU_events.144.d: "Цена на нефть упала ниже всех прогнозируемых аналитиками уровней. Страны-экспортеры пересматривают бюджеты, основанные на предположениях, которые теперь явно бесполезны, в то время как импортеры наслаждаются неожиданной прибылью, которую они стараются не слишком громко праздновать. Все взгляды прикованы к Эр-Рияду, где нефть стоит дешевле всего в мире, и поэтому единственное решение, которое имеет значение: сократить добычу и сохранить цену для всех, или продолжать добычу и выяснить, кто первым сломается."
 SAU_events.144.t: "Цена на нефть рухнула"
 SAU_events.145.a: "Защитите стражу. Именно она защищает нас."
 SAU_events.145.b: "Обе службы понесут равную бремя."
 SAU_events.145.d: "Резервы истощаются, а бюджет не будет утвержден. Сначала субсидии, затем капитальные проекты, а теперь Министерство финансов взялось за оборонную составляющую.\n\nТрудность заключается в том, что у Королевства нет единой армии. Есть регулярные войска под управлением Министерства обороны, а также Национальная гвардия, набранная из лояльных племен внутренних районов, размещенная вокруг Эр-Рияда и нефтяных месторождений и подчиняющаяся непосредственно трону. Гвардия существует потому, что сыновья Абдулазиза не доверяли армии, и с тех пор ей выплачивается соответствующая плата.\n\nСокращения могут коснуться обеих сторон, или же гвардию можно защитить, а обычным офицерам приказать обходиться тем, что есть. Один из этих вариантов обеспечит безопасность трона в этом году. Другой обеспечит его безопасность через десять лет.\n\n§HОфицерский корпус§!: [ROOT.GetSAUArmyGrievance] (§Y[?SAU_army_grievance|0]§! из §Y100§!)\n[ROOT.GetSAUArmyGrievanceEffect]"
 SAU_events.145.t: "Неравные разрезы"
 SAU_events.146.a: "Ввести охрану. Очистить улицы."
 SAU_events.146.b: "Никто не отправляется в командировки. Найдите деньги и купите мир."
 SAU_events.146.d: "Меры жесткой экономии добрались и до улиц. В Катифе и Даммаме наблюдаются толпы людей, а в Эр-Рияде – меньшие по численности, хотя министерства настаивают, что это вовсе не толпы.\n\nНациональная гвардия является инструментом для этого — она всегда им была, в этом вся суть — и гвардия готова, финансируется и желает помочь. Офицерский корпус регулярной армии пока не получал запроса и очень внимательно следит за тем, к кому он будет направлен.\n\nКаждый полковник в Министерстве обороны понимает, что значит, если в зону боевых действий вводят гвардию, в то время как их собственные подразделения сидят без зарплаты в казармах. Это означает, что престол публично и навсегда решил, какой армии он доверяет.\n\n§HОфицерский корпус§!: [ROOT.GetSAUArmyGrievance] (§Y[?SAU_army_grievance|0]§! из §Y100§!)\n[ROOT.GetSAUArmyGrievanceEffect]"
 SAU_events.146.t: "Приказ о развертывании"
 SAU_events.147.a: "Эр-Рияд, вперед! У охраны не будет времени среагировать."
 SAU_events.147.b: "Не это. Мы солдаты, а не политики."
 SAU_events.147.d: "Итак, вопрос решен. Национальная гвардия получает зарплату и ей доверяют; армия — нет. Тем, кто управляет самолетами, командует бронетехникой и контролирует границу, было сказано, пусть и без прямого ответа, что они — вторая армия в своей стране.\n\nДля того, что произошло дальше, есть прецедент. В 1969 году заговор офицеров ВВС и армии — Нассериста, Хеджази, уставшего от правления одной семьи — едва не привел к свержению Фейсала, согласно разведывательному докладу. Сотни были арестованы. Королевство извлекло урок о том, что регулярным войскам нельзя доверять, усилило Корпус стражей исламской революции и никогда не задавалось вопросом, зачем офицерам вообще понадобилось его создание.\n\nСотрудники проводят совещания уже несколько недель. Они больше не обсуждают бюджеты.\n\n§HОфицерский корпус§!: [ROOT.GetSAUArmyGrievance] (§Y[?SAU_army_grievance|0]§! из §Y100§!)\n[ROOT.GetSAUArmyGrievanceEffect]"
 SAU_events.147.t: "Решение принимают офицеры."
 SAU_events.148.a: "В Королевстве новое правительство."
 SAU_events.148.d: "Подразделения регулярной армии Саудовской Аравии вошли в Эр-Рияд до рассвета и захватили министерства, управление телерадиовещания и подступы к королевским дворцам. Казармы Национальной гвардии были окружены в тот же час и не оказали сопротивления. Высший военный совет объявил о восстановлении общественного порядка и о том, что конституционное положение престола остается неизменным — формулировка, которую, как отмечают наблюдатели, можно интерпретировать по-разному.\n\nКомпания Aramco сообщает о нормальной погрузке в Рас-Тануре. Это единственное предложение во всем сообщении, которое читают нефтяные рынки."
 SAU_events.148.t: "Эр-Рияд: Доспехи на улицах"
 SAU_events.149.a: "Провозгласить Арабскую Социалистическую Республику."
 SAU_events.149.b: "Провозгласить Исламскую Республику."
 SAU_events.149.c: "Провозгласить конституционную республику."
 SAU_events.149.d: "Трон разрушен. Совет контролирует министерства, телерадиовещательную компанию и подъездные пути ко всем дворцам Эр-Рияда, и он обнаружил то, что обнаруживает каждая хунта: захват страны занимает ночь, а управление ею требует названия.\nНеобходимо провозгласить республику, и республику необходимо провозгласить как нечто. Офицеры в зале не пришли к согласию относительно того, что именно. Некоторые служили бок о бок с иракцами и сирийцами и вернулись домой, восхищаясь партией Баас — единой арабской нацией, единой партией, с армией в качестве её опоры. Другие указывают на восток, на Катиф и Восточную провинцию, и утверждают, что единственная массовая группа населения, которую Королевство когда-либо подавляло, — это та, которая могла бы нести республику на своих плечах. Более молодая фракция, те, кто был отправлен за границу учиться, хотят конституции и парламента, и чтобы слово «республика» означало то же, что и везде. А некоторые, более тихие, чем остальные, читали то, за что Мабахит когда-то арестовал бы их.\nЧто бы ни было объявлено сегодня вечером, это будет объявлено от имени саудовского народа, и никого из них об этом не спрашивали."
 SAU_events.149.e: "Провозгласить Народную Республику."
 SAU_events.149.t: "Аль-Джумхурия"
 SAU_events.15.a: "Примите предложение о военно-морском партнерстве."
 SAU_events.15.b: "Отклоните предложение."
 SAU_events.15.d: "Эр-Рияд обращается к Мадриду с военно-морским предложением: испанские верфи будут строить корабли для Королевского военно-морского флота Саудовской Аравии, а саудовские деньги будут поступать в испанскую промышленность."
 SAU_events.15.t: "[SAU.GetFlag] Саудовско-испанское партнерство"
 SAU_events.150.a: "Примите их. Они смогут носить нашу форму."
 SAU_events.150.b: "Распустить охрану полностью. Отправить их домой."
 SAU_events.150.c: "Держитесь, под нашим командованием."
 SAU_events.150.d: "Семьдесят пять тысяч человек, набранных из племен Наджд, потому что сыновья Абдулазиза не доверяли армии профессионалов, и хорошо вооруженных, так что ни одна профессиональная армия не могла двинуться на Эр-Рияд без боя. Ночью они были окружены в своих казармах и не произвели ни единого выстрела. Теперь Совету предстоит решить, что с ними делать.\n\nОни не являются вражеским формированием. Их офицеры — двоюродные братья и соседи тех, кто на них нацелился, и каждый из их солдат принадлежит к племени, имеющему претензии на государство. Распустить их — Совет сэкономит много денег, но наживет множество врагов внутри страны. Поглотить их — удвоить численность личного состава и поглотить семьдесят пять тысяч человек, чья лояльность до прошлой недели была явно направлена к кому-то другому."
 SAU_events.150.t: "Охрана расформирована."
 SAU_events.151.a: "Они будут отвечать либо перед государством, либо ни перед кем."
 SAU_events.151.b: "Восстановите стипендии. Все риалы."
 SAU_events.151.d: "Выплаты стипендий прекратились, когда прекратила свою деятельность гвардия. Во внутренних районах это не было воспринято как бюджетная мера — выплаты племенам Наджд и Шаммара существовали еще до образования самого королевства, это была схема, на основе которой Абдулазиз его создал, и они ни разу не прерывались.\n\nШейхи не бунтуют. Они просто не отвечают, а в стране такого размера не отвечать — это уже почти то же самое."
 SAU_events.151.t: "Ответы племен"
 SAU_events.152.a: "Арестуйте их. Всех до единого, сегодня ночью."
 SAU_events.152.b: "Пригласите их. Расширьте состав Совета и разделите вину."
 SAU_events.152.d: "Совет, который не может платить, не может управлять и не может объяснить свою позицию, — это Совет, о котором его собственные полковники начинают говорить в третьем лице. Снова заседания — те же комнаты, те же чины, те же тщательно продуманные формулировки, что и перед последним.\n\nЛюди, захватившие Эр-Рияд, точно знают, как это делается, потому что они сами это делали. В этом и заключается сложность управления путем переворота: вы опубликовали метод."
 SAU_events.152.t: "Офицеры поворачиваются"
 SAU_events.153.a: "Лучше быть бедным, чем повешенным."
 SAU_events.153.d: "Стипендии восстановлены, трибуналы тихо свернуты, и назначена дата заседания консультативного собрания, которое, как все понимают, будет назначенным, а не избранным. Этого немного. Достаточно того, что люди, отсчитывавшие оставшиеся недели работы Совета, перестали считать вслух.\n\nКазначейство стало беднее на сумму, которую никто не станет разглашать, а офицеры, захватившие Эр-Рияд, вернули значительную часть того, за что его захватили."
 SAU_events.153.t: "Совет выкупает свои активы"
 SAU_events.154.a: "Затем это будет решено на месте."
 SAU_events.154.d: "Прошло девяносто дней, а Совет не нашел ничего сказать. Гарнизон в Хаиле сегодня утром объявил о поддержке короля, к полудню к нему присоединилась Восточная провинция, а племенные отряды, на которые раньше опиралась гвардия, перестали притворяться кем-то другим.\n\nАрмия, захватившая страну за одну ночь, теперь является единственным институтом, защищающим ее, и она обнаруживает, что государство, удерживаемое исключительно силой, требует гораздо больше сил, чем было заложено в бюджет."
 SAU_events.154.t: "Царство разделяется"
 SAU_events.155.a: "Весь мир наблюдает за Восточной провинцией."
 SAU_events.155.d: "Сообщается о боях внутри Саудовской Аравии между подразделениями, лояльными Высшему военному совету, и формированиями, заявляющими о поддержке династии Саудов. Восточная провинция, где находятся нефтяные месторождения, является предметом спора. Цена на нефть марки Brent открылась на одиннадцать долларов выше и продолжает расти.\n\nКаждое министерство иностранных дел, имеющее посольство в Эр-Рияде, выступает с одинаковым заявлением о сдержанности, и каждое из них втайне обдумывает, чью сторону следует поддержать на позднем этапе, а не на раннем."
 SAU_events.155.t: "Эр-Рияд: Гражданская война в Саудовской Аравии"
 SAU_events.156.a: "Удержите Абдуллу. Трон стоит столько, сколько нам это обойдется."
 SAU_events.156.b: "Найдите нам короля, который понимает суть соглашения."
 SAU_events.156.d: "Теперь Совет должен распределить должности губернаторов, что поднимает вопрос, который он старался избегать. Король всё ещё есть.\n\nАбдулла стар, лично строг, как всегда нравилось стране, и командовал Национальной гвардией сорок лет, прежде чем Совет её распустил — это означает, что люди, захватившие Эр-Рияд, задаются вопросом, стоит ли оставлять человека, чью армию они только что распустили. В его пользу: никто в Королевстве не ставит под сомнение его легитимность, а трон, который никто не оспаривает, стоит больше, чем несколько дивизий.\n\nПротив него: он не является и никогда не был марионеткой. Сохранение его означает возврат части того, что Совет забрал, как на практике, так и публично. Альтернатива — найти принца, который понимает, что порядок вещей обратный."
 SAU_events.156.t: "Вопрос о престоле"
 SAU_events.157.a: "Салман бин Абдулазиз."
 SAU_events.157.b: "Мохаммед бин Найеф."
 SAU_events.157.c: "Мутаиб бин Абдулла."
 SAU_events.157.d: "Король Абдалла отрекся от престола, и Высший военный совет должен назначить преемника из числа старших принцев династии Саудов.\n\nКаждый кандидат пользуется поддержкой различных групп населения: истеблишмента династии Судаири, служб безопасности, племен внутренних районов и молодого поколения семьи. Выбор Совета определит, какая часть Королевства первой признает новое устройство, а какую придется убеждать."
 SAU_events.157.e: "Мухаммед бин Салман."
 SAU_events.157.t: "Более удобный король"
 SAU_events.158.a: "Действующий офицер. §H+5 Контроль, -5 Легитимность§!"
 SAU_events.158.b: "Принц из дома Саудов. §H-5 Контроль, +5 Легитимность§!"
 SAU_events.158.c: "Местный житель. §H +2 Контроль, +2 Легитимность §!"
 SAU_events.158.d: "Место вакантно, и Совет должен его заполнить. Было предложено три кандидатуры, и каждая из них дает Совету что-то свое.\n\nК должностному лицу будут подчиняться и ненавидеть. Князя будут признавать и игнорировать. Местный знатный человек не будет ни тем, ни другим, что одновременно является и полезной, и опасной частью."
 SAU_events.158.t: "Губернаторство [SAU_governor_province.GetName]"
 SAU_events.159.a: "Узкое регентство. Он сохраняет трон и мечети."
 SAU_events.159.b: "Полное регентство. Всевластие, без исключения."
 SAU_events.159.c: "Регентство на пять лет. Назначьте дату."
 SAU_events.159.d: "Документ короткий. В нем зафиксировано, что Его Величество, будучи нездоров, передает исполнительную власть и портфель обороны Совету, действующему от его имени, и он ставит свою подпись под абзацем, который ему не дали возможности исправить.\n\nОстается решить, сколько именно забирает этот указ. Регентство, оставляющее королю мечеть, титул и церемонии, — это регентство, с которым страна может смириться, а регентство, оставляющее ему ничего, — это просто записанная правда. Юристы указывают, без всякого вопроса, что указ с датой подписать проще, чем указ без даты.\n\nНет никакой конституции, которую можно было бы приостановить. В этом всегда было удобство этого Королевства."
 SAU_events.159.t: "Указ эпохи Регентства"
 SAU_events.16.a: "Расширьте зону противовоздушной обороны."
 SAU_events.16.b: "Отклонить запрос."
 SAU_events.16.d: "Королевство обращается к Вашингтону с просьбой о расширении системы противовоздушной обороны. Батареи Patriot будут окружать саудовские города и нефтяные месторождения, а финансирование будет полностью осуществляться Эр-Риядом."
 SAU_events.16.t: "[SAU.GetFlag] Американский щит"
 SAU_events.160.a: "Весь аппарат. Комендантский час, трибуналы, цензоры."
 SAU_events.160.b: "Только чрезвычайные полномочия. Не трогайте улицы."
 SAU_events.160.d: "Сегодня утром собрания, передвижение между провинциями и типографии работают под военным контролем. Юристы Совета отмечают, что в Королевстве никогда не было конституции, действие которой можно было бы приостанавливать, что значительно упрощает разработку новых законов.\n\nВопрос в том, насколько далеко это зайдет. Комендантский час, трибуналы и цензоры будут держать страну в покое и запомнятся на целое поколение. Чрезвычайные полномочия без комендантского часа будут действовать гораздо менее эффективно и будут прощены гораздо быстрее."
 SAU_events.160.t: "Военное положение"
 SAU_events.161.a: "В указе говорилось о пяти годах. Прошло уже пять лет."
 SAU_events.161.b: "Недомогание продолжается. Бессрочно."
 SAU_events.161.d: "Пять лет назад Совет установил дату, когда это станет возможным, и юристы, которые консультировали его по этому вопросу, все эти годы незаметно переводились на другие должности. Эта дата настала. Все в Королевстве знают, что она настала.\n\nВыполнение этого обязательства означает возвращение исполнительной власти на трон, который Совет опустошал в течение пяти лет, и веру в то, что благодарность — это нечто реальное. Нарушение же обязательства означает, что слово Совета стоит ровно столько, сколько все и предполагали, и никогда больше не будет стоить больше.\n\n§HВыполненное обещание лишает Совет контроля. Нарушенное обещание лишает его всего остального.§!"
 SAU_events.161.t: "Срок действия эпохи Регентства истекает."
 SAU_events.162.a: "Лицензируйте дизайн. Нам нужно производство, а не гордость."
 SAU_events.162.b: "Построим сами, с нуля, из руды."
 SAU_events.162.d: "Королевство закупало оружие за границей с тех пор, как у него появилось оружие для закупки, и нынешние правители потратили всю свою карьеру в ожидании иностранных запасных частей, которые поступали, когда это разрешалось парламентом другой страны. Закон обязывает производить внутри страны то, что можно изготовить здесь.\n\nЕсть два способа начать. Купить лицензии и оборудование и запустить заводы в течение трех лет, производящие продукцию по чужим проектам на чужих условиях. Или начать с нуля — металлургию, инженеров, неудачи — и полностью владеть результатом, что обойдется казначейству в десятилетие."
 SAU_events.162.t: "Закон об оборонной промышленности"
 SAU_events.163.a: "Принцы. Пусть страна увидит, как они ответят за это."
 SAU_events.163.b: "Диссиденты. Документы уже подготовлены."
 SAU_events.163.c: "И то, и другое. Мы захватили государство не для того, чтобы проявлять избирательность."
 SAU_events.163.d: "Суд заседает под военным контролем, без права обжалования, и обладает юрисдикцией, которой никогда не были предоставлены обычные судьи. С улемами консультировались по форме разбирательства, а не по вердиктам, которые они приняли к сведению.\n\nСовет должен решить, кого привлекать к ответственности. Есть князья, чьи счета не выдержат проверки, и чей позор страна бы с удовольствием пережила. Есть организаторы, священнослужители и подписанты, чьи документы Мабахит хранили двадцать лет. Суд над первыми популярен и выгоден. Суд над вторым необходим и запомнится."
 SAU_events.163.t: "Чрезвычайный трибунал"
 SAU_events.164.a: "Всеобщая служба. Каждому совершеннолетнему мужчине, без исключений."
 SAU_events.164.b: "Призыв на военную службу. Племена сохраняют за собой право на освобождение от службы."
 SAU_events.164.d: "Аль-Сауд никогда никого не призывали в армию. Армия добровольцев, набранная из доверенных племен, лояльна; армия, состоящая из всех, просто велика, а большая армия в стране таких размеров формирует мнение о том, как управляется страна.\n\nСам Совет представляет собой то мнение, которого опасался предыдущий режим, что придает дискуссии некоторую неловкость. Он все равно предлагает пойти на риск — вопрос лишь в том, ляжет ли этот призыв на всех или на всех, кого Совет может позволить себе раздражить."
 SAU_events.164.t: "Призвать в королевство"
 SAU_events.165.a: "Старшие принцы. Их имена до сих пор носят название страны."
 SAU_events.165.b: "Забытые кузены. Благодарность дешевле престижа."
 SAU_events.165.c: "Богатые недовольные. Пригласите их, а проверку проведите позже."
 SAU_events.165.d: "Семья — это не что-то одно. Это тысячи людей с совершенно неравными претензиями, и многие из них всю жизнь оставались без внимания со стороны ветви, занимавшей трон. Совет только что исключил эту ветвь из уравнения.\n\nЕсть высокопоставленные принцы, чьи имена сами по себе могли бы решить вопрос о наследовании целой провинции. Есть кузены, не имеющие особого положения, которые были бы благодарны за должность губернатора и помнили бы, кто её им дал. А есть и те, у кого есть деньги и обиды, кого можно было бы дёшево привлечь к власти и проверить позже."
 SAU_events.165.t: "Лоялисты в провинциях"
 SAU_events.166.a: "Платите купцам. Покупайте в Хиджазе с умом."
 SAU_events.166.b: "Разместите там гарнизон. Они приспособятся."
 SAU_events.166.d: "Провинция Мекка — это Джидда, купеческие дома, паломничество и Хиджаз — регион, который до 1925 года был самостоятельным королевством и никогда полностью не переставал упоминаться. Его семьи финансировали государство еще до появления нефти и так и не примирились полностью с правлением Наджди.\n\nИх можно купить, и они дороги. Или же в провинции можно разместить гарнизон, и им могут напомнить, что паломничество теперь проходит через контрольно-пропускные пункты."
 SAU_events.166.t: "Провинция Мекка"
 SAU_events.167.a: "Заигрывайте с ними. Уступите то, что необходимо."
 SAU_events.167.b: "Переставьте стулья. Нам срочно нужна формулировка."
 SAU_events.167.d: "В Медине находится мечеть Пророка и научное сообщество, которое развивалось вокруг неё на протяжении тринадцати веков. Юристы могут описывать Собор как необходимость, которую община должна принять, или как узурпацию, которую она должна терпеть, и формулировки будут распространяться дальше, чем любое коммюнике, изданное Собором.\n\nИх можно склонить к сотрудничеству, что подразумевает уступки и терпение. Или же старшие кафедры могут быть переназначены тем, кто уже согласен, что происходит быстрее и что заметит каждый учёный в мусульманском мире."
 SAU_events.167.t: "Провинция Медина"
 SAU_events.168.a: "Встаньте за спиной короля. Заимствуйте титул, а не присваивайте его себе."
 SAU_events.168.b: "Опекунство принадлежит государству, а не человеку."
 SAU_events.168.d: "Фахд принял титул Хранителя двух священных мечетей в 1986 году, отказавшись от титула Величества в пользу того, на что не мог претендовать ни один другой мусульманский правитель. Это самая ценная вещь, принадлежащая Дому Саудов, и она не подлежит передаче.\n\nСовет не может отнять этот титул у живого короля. Он может стоять за его спиной, когда тот использует этот титул, и это будет видно всем, что придаст Совету легитимность и напомнит всем, чья это легитимность. Или же он может объявить, что опека принадлежит государству, а не человеку, и выяснить, как к этому отнесется мусульманский мир."
 SAU_events.168.t: "Стражи двух мечетей"
 SAU_events.169.a: "Начнём с комитетов Восточной провинции."
 SAU_events.169.b: "Отправьте проповеди на пересмотр."
 SAU_events.169.c: "Начнём с тех, кто подписал петицию."
 SAU_events.169.d: "Мабахит не нуждался в строительстве. В кабинетах Министерства внутренних дел хранятся имена и названия улиц организаторов Восточной провинции, имена и даты проповедников Сахвы, а также имена тех, кто подписал петицию 2003 года и подписал ее снова в 2007 году. Министерство, которое собирало всю эту информацию, всегда было очень бережно к ней относилось, потому что у людей, фигурирующих в документах, были двоюродные братья в министерстве. У Совета же двоюродных братьев нет."
 SAU_events.169.e: "Возьмите все три файла вместе."
 SAU_events.169.t: "Файлы уже открыты."
 SAU_events.17.a: "Мы ответим на этот вопрос."
 SAU_events.17.d: "Боевики группировки [ROOT.SAU_GetFrontName] обрушили на нашу границу шквал ракетных обстрелов. Над нашими городами воют сирены, семьи ищут убежище, и подсчитывается ущерб."
 SAU_events.17.t: "В наши города попали ракеты"
 SAU_events.170.a: "В открытом судебном заседании, транслируемом по телевидению."
 SAU_events.170.b: "Решите все вопросы в отеле «Ритц», как и прежде."
 SAU_events.170.c: "Помилования, по существующей системе."
 SAU_events.170.d: "Бухгалтеры закончили работу, и цифры оказались хуже слухов. Министерства, которые ничего не построили, заказы на самолеты, которые так и не были поставлены, десятилетие доходов Королевства, которые просто остановились где-то между казначейством и подрядчиком. Стране расскажут часть этого. Вопрос лишь в том, сколько из этого произойдет перед камерами, а сколько будет решено в отеле с закрытыми дверями."
 SAU_events.170.t: "Принцы на скамье подсудимых"
 SAU_events.171.a: "Обеспечьте им щедрую и постоянную пенсию."
 SAU_events.171.b: "Изгнать старших представителей."
 SAU_events.171.c: "Возбудить уголовное дело и конфисковать все обнаруженное."
 SAU_events.171.d: "У Абдулазиза было сорок пять зарегистрированных сыновей, и королевство семьдесят лет пожинает последствия этого. Сейчас их несколько тысяч, они получают стипендии, занимают должности в правительстве, вступили в брак со всеми купеческими домами от Джидды до Хофуфа. Ни один из них по отдельности не представляет угрозы для Совета. Все они вместе составляют единственную альтернативную форму правления, которую когда-либо знала страна, и их нельзя просто оставить на прежнем месте."
 SAU_events.171.e: "Оставьте их богатыми и декоративными."
 SAU_events.171.t: "Каждый из них имеет право на претензию."
 SAU_events.172.a: "Признайте Совет. Его отношения с государством."
 SAU_events.172.b: "Узнайте их и получите за это вознаграждение."
 SAU_events.172.c: "Мы не имеем дело с советом полковников."
 SAU_events.172.d: "Письмо короткое. В нем отмечается, что обязательства Королевства остаются неизменными, что производственные показатели будут достигнуты, что американский персонал находится в безопасности и что Совет приветствовал бы скорейшее заседание. В нем не упоминается король, аресты или конституция. Теперь Вашингтону предстоит решить, перед чем он имеет дело: перед правительством или перед группой чиновников, которые оказались на том месте, где раньше находилось правительство."
 SAU_events.172.t: "Совет пишет в Вашингтон"
 SAU_events.173.a: "Порты, железные дороги и северный коридор."
 SAU_events.173.b: "Капитал, без каких-либо условий."
 SAU_events.173.d: "Китайский посол прибыл через четыре дня после той ночи, поздравил Совет с восстановлением порядка и сразу перешел к вопросу о пропускной способности Яньбу. Ни о короле, ни об арестах, ни о конституции не было и речи. Это был самый откровенный разговор, который министерство иностранных дел Королевства провело за последнее десятилетие, и все присутствующие в зале прекрасно понимают, что именно им предлагается."
 SAU_events.173.t: "Без лишних вопросов"
 SAU_events.174.a: "Примите их, как только Эр-Рияд урегулирует отношения с Тегераном."
 SAU_events.174.b: "В удовлетворении заявки отказано."
 SAU_events.174.c: "Примите их. Без всяких условий."
 SAU_events.174.d: "Заявка Саудовской Аравии на полноправное членство поступает в Секретариат без преамбулы и каких-либо условий, что само по себе является заявлением. Организация никогда не принимала в свои ряды государство Персидского залива. Она также никогда не отказывала крупным нефтедобывающим компаниям, которые вежливо обращались с такой просьбой. Вопрос в Пекине заключается не в том, полезен ли Эр-Рияд — этот вопрос был решен много лет назад, — а в том, означает ли его принятие в организацию перенос конфликта, которого она избегала два десятилетия."
 SAU_events.174.t: "Заявка из Эр-Рияда"
 SAU_events.175.a: "Восстановить взаимопонимание с Тегераном."
 SAU_events.175.b: "Нам не скажут, кто наши соседи."
 SAU_events.175.d: "Ответ вежливый и совершенно недвусмысленный. Китай выступит спонсором заявки, председательствует на голосовании и обеспечит поддержку более мелким членам, а в обмен на это соглашение, достигнутое в Пекине в 2023 году, должно быть восстановлено в письменной форме, включая посольства. Организация не хочет иметь члена, который будет на каждом саммите спорить с другим членом. Эр-Рияду предлагают купить свое место подписью, а не нефтью."
 SAU_events.175.t: "Условия Пекина"
 SAU_events.176.a: "Запомните это и двигайтесь дальше."
 SAU_events.176.d: "Причины не приводятся, поскольку в этом нет необходимости. В коммюнике выражается благодарность Королевству за проявленный интерес, отмечается ценность продолжения диалога и подводится итог. Эр-Рияду было отказано в приеме организацией, которая, как его заверили, примет любого, и этот отказ будет правильно истолкован во всех важных столицах."
 SAU_events.176.t: "Заявка отклонена"
 SAU_events.177.a: "Садитесь."
 SAU_events.177.d: "Голосование единогласное, а это значит, что вопрос был решен еще до его принятия. Королевство вступает в состав в качестве полноправного члена без каких-либо предварительных условий, испытательного срока и без каких-либо упоминаний о том, как нынешнее правительство пришло к власти. Это молчание — и есть вся суть того, что было приобретено."
 SAU_events.177.t: "Приём без условий."
 SAU_events.178.a: "Стволы двигаются как и прежде."
 SAU_events.178.d: "Признание приходит в виде заявления из двух строк, опубликованного в пятницу днем, — именно туда Вашингтон помещает то, что предпочел бы не рассматривать. Посол возвращается на следующей неделе. Никакие аспекты торговых отношений не пересматриваются, и ни одна из сторон не упоминает о событиях последних шести месяцев ни тогда, ни впоследствии."
 SAU_events.178.t: "Дела идут как обычно."
 SAU_events.179.a: "Предоставьте доступ. Такова цена признания."
 SAU_events.179.b: "Признание на таких условиях не является признанием."
 SAU_events.179.d: "Вашингтон признает Совет и приложил к предложению график: расширенный доступ к резиденции принца Султана, право предварительного размещения войск в Восточной провинции и право беспрепятственного полета. Причина очевидна. Правительство, которому настолько необходимо признание, что оно об этом просит, может быть привлечено к ответственности, и Совет обратился за этим первым."
 SAU_events.179.t: "Признание имеет свою цену."
 SAU_events.18.a: "Трусы за это заплатят."
 SAU_events.18.d: "В наших городах развернулась скоординированная кампания взрывов, организованная [ROOT.SAU_GetFrontName]. Подсчитываются погибшие, а общественность требует от правительства принять меры."
 SAU_events.18.t: "Бомбардировки в наших городах"
 SAU_events.180.a: "Тогда мы справимся и без них."
 SAU_events.180.d: "Заявление, состоящее из четырех абзацев и посвященное конституционному правлению и верховенству права, было опубликовано Государственным департаментом, который не говорил ничего подобного о половине соседей Королевства. Совет читает его, отмечает, кто из его собственных сотрудников прошел обучение в Канзасе, и архивирует. Отношения не прекращаются. О них просто перестают говорить."
 SAU_events.180.t: "Вашингтон приходит в упадок"
 SAU_events.181.a: "Подтвердите это в полном объеме. Безопасность нефти, как и прежде."
 SAU_events.181.b: "Масло — да. Гарантия — нет."
 SAU_events.181.c: "Пусть это истечет. Это никогда не было записано."
 SAU_events.181.d: "В феврале 1945 года Рузвельт и Абдулазиз встретились на борту крейсера в Большом Горьком озере и договорились о соглашении, которое лежит в основе политики США на протяжении восьмидесяти лет: американская безопасность, саудовская нефть. Ни один из них ничего не подписал, что с тех пор устраивало каждую администрацию. Теперь Эр-Рияд официально и в письменной форме запрашивает ответ на вопрос, которого эта неопределенность была призвана избежать: была ли сделка заключена с королем или со страной?"
 SAU_events.181.t: "Вопрос о Куинси"
 SAU_events.182.a: "Ничего не подписано. Ничего и не нужно подписывать."
 SAU_events.182.d: "Документа не существует, потому что его никогда и не было. Есть группа перевозчиков, которая не уходит, записка, переданная между двумя правительствами, которая не будет опубликована ни в одной из стран, и соглашение о заправке топливом, продленное на двадцать лет на прежних условиях. Спустя восемьдесят лет эта договоренность пережила смену династии благодаря простому принципу: она никогда не была зафиксирована в письменном виде."
 SAU_events.182.t: "Понимание остается в силе"
 SAU_events.183.a: "Мы возьмём ту половину, которая будет отправлена."
 SAU_events.183.d: "Торговые отношения подтверждаются довольно подробно, а отношения в сфере безопасности дважды описываются как находящиеся на стадии пересмотра. Эр-Рияд прекрасно понимает структуру сделки: поставки танкеров гарантированы, а Королевство — нет. Это та половина проекта Куинси, которая ничего не стоит Вашингтону, предложенная администрацией, которая уже подсчитала стоимость другой половины."
 SAU_events.183.t: "Половина скидки"
 SAU_events.184.a: "Тогда Царство само себя гарантирует."
 SAU_events.184.d: "Ни заявления, ни отказа, ни встречи. Запрос был принят заместителем помощника секретаря, но ответа так и не последовало, и спустя несколько месяцев стало ясно, что именно отсутствие ответа и было ответом. Восемьдесят лет договоренностей не были отменены. Им просто позволили тихо уйти в прошлое, как это всегда бывает в подобных случаях."
 SAU_events.184.t: "Никто не гарантирует"
 SAU_events.185.a: "Пусть читают."
 SAU_events.185.b: "Королевство проводит единую внешнюю политику."
 SAU_events.185.d: "Спустя четыре месяца после начала нового правления в Мекке состоялась встреча Организации исламской конференции — органа, созданного королем Фейсалом после пожара в Аль-Аксе в 1969 году, созванного в его родном городе его младшим братом. Была согласована десятилетняя программа действий, и все разошлись по домам. В офицерских столовых Национальной гвардии вместо этого читали старые речи, произнесенные в 1973 году, и отмечали, что Фейсал не ограничился программами. Командует гвардией Мутайб бин Абдулла. Он не прекратил чтение."
 SAU_events.185.t: "Саммит в Мекке"
 SAU_events.186.a: "Финансируйте это открыто, от имени Королевства."
 SAU_events.186.b: "Пусть гвардия спокойно за это заплатит."
 SAU_events.186.c: "Усмирите его."
 SAU_events.186.d: "В 1969 году Аль-Акса была сожжена, и Фейсал в течение месяца организовал встречу глав мусульманского мира в Рабате; благодаря этому существует Организация исламской конференции. Круг общения Мутаиба хочет возобновить саммит и открыто финансировать Всемирную мусульманскую лигу — от имени Королевства, за счет Королевства, с флагом Королевства на трибуне. Это не просто просьба. Это также в точности то, что сделал его дядя.\n\n§HФейсалисты настроены§!: [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! из §Y100§!)"
 SAU_events.186.t: "Память о Рабате"
 SAU_events.187.a: "В конце концов, у Файсала есть наследник."
 SAU_events.187.d: "ЭР-РИЯД — Командир Национальной гвардии Саудовской Аравии всю неделю в миниатюре повторял то, что в полной мере сделал его дядя. Бюджет Всемирной мусульманской лиги был восстановлен до уровня, близкого к доле 1970-х годов, Исламский банк развития будет рекапитализирован за счет средств, связанных с гвардией, а Мутайб бин Абдулла призвал — беспрецедентно, к тому, чтобы действующий саудовский командующий, а не министр, созвал Организацию исламского сотрудничества на внеочередную сессию.\n\nКороль Фейсал основал Лигу в Мекке в 1962 году и собрал Организацию в Рабате в 1969 году, а в октябре 1973 года он продемонстрировал, на что способно Королевство, когда оно решило действовать, а не выступать посредником. Гвардия — это не государство, и её командующий — не король. Оба эти момента сейчас поднимаются в Эр-Рияде гораздо чаще, чем месяц назад."
 SAU_events.187.t: "У Фейсала есть наследник."
 SAU_events.188.a: "Скажите прямо то, что уже было сказано наедине."
 SAU_events.188.b: "Война Вашингтона — не наша история, и мы не вправе о ней рассказывать."
 SAU_events.188.d: "В Месопотамии существуют американские разногласия, по ту сторону границы, которую Королевству так и не удалось закрыть. Как бы Вашингтон ни называл это соглашение, каждый проповедник от Бурайды до Абхи описывает его одинаково, и факты не противоречат ни одному из них. Круг общения Мутаиба перестал спорить о том, был ли Фейсал прав насчет Запада. Теперь они перешли к обсуждению того, что следует из его правоты.\n\n§HФейсалисты настроены§!: [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! из §Y100§!)"
 SAU_events.188.t: "Соседняя профессия"
 SAU_events.189.a: "Королевство проводит реформы не для того, чтобы получать похвалу за границей."
 SAU_events.189.b: "Наш век не будет нас ждать."
 SAU_events.189.d: "Отдельные указы скромны — смягчение правил здесь, реорганизация министерства там, открытие профессии для людей, которым ранее в нее не допускалось входить. Вместе они представляют собой крупнейшие социальные изменения со времен принятия девочек в школы, и никто в Эр-Рияде не делает вид, что они были разработаны без учета того, как они будут восприниматься в Вашингтоне и Лондоне. Священнослужители обратили гораздо больше внимания на вторую часть, чем на первую.\n\n§HФейсалисты настроены§!: [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! из §Y100§!)"
 SAU_events.189.t: "Королевство открывается"
 SAU_events.19.a: "Укрепить границу."
 SAU_events.19.d: "Истребители [ROOT.SAU_GetFrontName] пересекли границу, нанесли удары по военным складам, после чего снова скрылись в ночи. Наши силы спешно готовятся к ответным действиям."
 SAU_events.19.t: "Вторжение через границу"
 SAU_events.190.a: "Задайте вопрос Файсала вслух."
 SAU_events.190.b: "Резерв не является оружием."
 SAU_events.190.d: "Еще одна мусульманская столица, еще одна американская воздушная кампания, еще одно заявление Саудовской Аравии, призывающее все стороны к сдержанности. Круг общения Мутаиба перестал составлять заявления. Вместо этого он задает один вопрос, и это именно тот вопрос, на который Фейсал ответил в октябре 1973 года: какой смысл в крупнейшем в мире запасе нефти, если его ни разу не используют?\n\n§HФейсалисты настроены§!: [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! из §Y100§!)"
 SAU_events.190.t: "Следующая война"
 SAU_events.191.a: "Пусть идет своим чередом. Он должен быть во главе этого процесса."
 SAU_events.191.b: "Направьте эти средства через министерства."
 SAU_events.191.c: "Развейте его, прежде чем оно назовёт короля."
 SAU_events.191.d: "Разговоры об этом прекратились среди офицеров. Портрет Фейсала висит в окнах на улице Олайя; пятничные проповеди в Бурайде и Унайзе уже шесть недель посвящены одной и той же теме; а собственные призывники гвардии цитируют своим инструкторам запись трансляции 1973 года. Никто это не организовывал, и все понимают, к чему это ведет. Мутаиб бин Абдулла ничего не сказал публично, что само по себе теперь воспринимается как заявление.\n\n§HФейсалисты настроены§!: [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! из §Y100§!)"
 SAU_events.191.t: "Улица помнит Фейсала"
 SAU_events.192.a: "Ответ Файсала. Скажите это его словами."
 SAU_events.192.b: "Откройте казначейство для тех, кто находится под обстрелом."
 SAU_events.192.c: "Заявление, призывающее все стороны к сдержанности."
 SAU_events.192.d: "Израильские войска ведут боевые действия против арабского государства, и телевидение Королевства транслирует это в прямом эфире без перерывов. В течение суток плакаты становятся американскими в той же мере, что и израильскими — самолеты, боеприпасы, последующее вето в Совете Безопасности. Это та почва, которую Фейсал выбрал в 1973 году, и аргумент с тех пор не изменился: Королевство обладает крупнейшими в мире запасами нефти и ни разу не желало их завладеть.\n\n§HФейсалисты настроены§!: [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! из §Y100§!)"
 SAU_events.192.t: "Ещё одна война, и тот же вопрос."
 SAU_events.193.a: "Пусть в протоколе будет указано, что дело было решено за столом."
 SAU_events.193.d: "Документ занимает шестьдесят страниц и содержит практически точные рекомендации, о которых изначально просили полковники, а именно: что происходит, когда комиссии разрешается выбирать своих собственных членов. Повышения по службе публикуются в официальном бюллетене, задолженности закрываются, а офицерам, имена которых фигурировали в документах Министерства внутренних дел, тихо сообщают, что эти документы тоже закрыты.\n\nНикакого переворота не будет. Солдатам Королевства дали повод не быть теми, кто его положит конец, и для армии этого, как правило, достаточно."
 SAU_events.193.t: "Отчеты Комиссии"
 SAU_events.194.a: "Итак, принято решение. Задайте вопрос всем."
 SAU_events.194.b: "Королевство само нанесет ответ Йемену."
 SAU_events.194.d: "Они прибывают в течение одних выходных, и повестка дня так и не публикуется. Кувейт направляет шейха Мохаммеда Аль-Халида Аль-Сабаха, заместителя премьер-министра и министра внутренних дел; Катар направляет своего премьер-министра, шейха Абдуллу бин Нассера Аль-Тани, который также занимает пост министра внутренних дел. Эмираты уже находятся в здании.\n\nСтолица пала под натиском хуситов, а признанный президент находится где-то к югу от нее без армии, достойной названия. Вопрос, стоящий перед собравшимися, заключается не в том, могут ли страны Персидского залива действовать. Вопрос в том, будут ли страны Персидского залива действовать как единое целое или как несколько государств — и каждое государство в этом коридоре решит это самостоятельно."
 SAU_events.194.t: "Встреча в Эр-Рияде"
 SAU_events.195.a: "Подпишите. Любыми необходимыми средствами."
 SAU_events.195.b: "Йемен не будет превращен в протекторат."
 SAU_events.195.d: "Запрос Саудовской Аравии направляется непосредственно президенту, и это не столько предложение помощи, сколько просьба о разрешении. Эр-Рияд хочет получить письмо: обращение в Совет Безопасности и отдельное обращение к государствам-членам Совета сотрудничества стран Персидского залива с просьбой вмешаться. §Yвсеми необходимыми средствами§!.\n\nПризнанное правительство может на законных основаниях приглашать иностранные войска на свою территорию, и это письмо является всей юридической основой всего последующего. Подписанное письмо приводит к прибытию военно-воздушных сил стран Персидского залива. Неподписанное письмо означает, что Республика противостоит хуситам тем, что у неё ещё осталось, и при этом сохраняет за собой право впоследствии заявить, что она никогда не была ничьим клиентом."
 SAU_events.195.t: "Вопрос из Эр-Рияда"
 SAU_events.196.a: "Начинается решающая буря."
 SAU_events.196.b: "Только по воздуху и морю. Саудовские солдаты не пересекают границу."
 SAU_events.196.d: "Объявление было сделано не в Эр-Рияде. Адель аль-Джубейр, посол Королевства в США, зачитал его в посольстве в Вашингтоне, когда первые самолеты уже находились в воздухе — выбор места проведения мероприятия позволил каждой столице мира узнать, с кем и когда проводились консультации.\n\nОперация «Решающая буря». Штаты, откликнувшиеся на приглашение, названы участниками, некоторые из которых узнают о масштабах своего участия из трансляции. Заявленная цель — восстановление легитимного правительства. Дата окончания не указана и не запрашивается.\n\n§HПартнеры по коалиции§!: §Y[?SAU_coalition_partners|0]§!"
 SAU_events.196.t: "Декларация"
 SAU_events.197.a: "В Персидском заливе началась война."
 SAU_events.197.d: "ВАШИНГТОН — Коалиция под руководством Саудовской Аравии начала сегодня вечером воздушные операции над Йеменом, о чем было объявлено из посольства Саудовской Аравии в Вашингтоне, а не в Эр-Рияде. Королевство ссылается на письменный запрос признанного президента Йемена и положения о коллективной обороне Совета сотрудничества стран Персидского залива.\n\nТегеран осудил операцию и отрицает вооружение движения хуситов. Вашингтон подтвердил, что оказывает логистическую и разведывательную поддержку, не задействуя при этом собственную авиацию. Ни один из членов коалиции не назвал примерную продолжительность кампании."
 SAU_events.197.t: "Операция «Решительный шторм»"
 SAU_events.198.a: "Мы полетим вместе с Королевством."
 SAU_events.198.b: "Это не наша война."
 SAU_events.198.d: "Запрос поступает через саудовского посла и носит необычайно прямой характер: самолеты, или экипажи для их обслуживания, или, в крайнем случае, имя в коммюнике. Королевство формирует коалицию против наступления хуситов и предпочло бы не создавать ее в одиночку.\n\nПрисоединение дает Эр-Рияду значительный авторитет и долю в любом последующем развитии событий. Отказ лишает его этого авторитета и ничего больше — а у войны нет конечной даты."
 SAU_events.198.t: "Эр-Рияд просит нас лететь"
 SAU_events.199.a: "Тогда мы не пойдем туда, куда нас не попросят."
 SAU_events.199.b: "Нам не нужна их подпись."
 SAU_events.199.d: "Ответ Саны вежливый, неторопливый и полностью отрицательный. Обращений в Совет Безопасности и запросов в страны Персидского залива не будет, и Королевству выражается благодарность за проявленную заботу на языке, который правительства обычно используют для выражения обеспокоенности, которую они намерены игнорировать.\n\nБез этого письма нет приглашения, а без приглашения воздушная кампания над Йеменом — это просто воздушная кампания над Йеменом. Эр-Рияд всё ещё может действовать. Он сделает это от своего имени, и каждая столица зафиксирует это таким образом."
 SAU_events.199.t: "Письмо не приходит"
 SAU_events.2.a: "Да здравствует Король!"
 SAU_events.2.d: "Абдулла бин Абдулазиз Аль-Сауд был официально провозглашен королем Саудовской Аравии и Хранителем двух священных мечетей. Занимая пост фактического правителя с 1995 года, его официальное восшествие на престол принесет стабильность и преемственность в Королевство. Король Абдулла известен своими осторожными реформаторскими тенденциями и усилиями по развитию межрелигиозного диалога."
 SAU_events.2.t: "Король Абдалла взошел на престол."
 SAU_events.20.a: "Джейш аль-Ислам (Армия ислама)"
 SAU_events.20.b: "Ансар аль-Харамайн (Защитники двух священных мечетей)"
 SAU_events.20.c: "Катаиб аль-Акса (Бригады Аль-Акса)"
 SAU_events.20.d: "Новому движению, поддерживаемому Саудовской Аравией, прежде чем оно заявит о себе миру, нужно придумать название. Выбранное им знамя определит, как о нем будут говорить его сторонники и враги."
 SAU_events.20.e: "Лива аль-Таухид (Бригада единобожия)"
 SAU_events.20.t: "Название для фронта"
 SAU_events.200.a: "Проводить реформы в той мере, в какой это позволят министерства."
 SAU_events.200.b: "Изменилось только имя на указах."
 SAU_events.200.c: "Откройте экономику, а политика пусть сама развернется."
 SAU_events.200.d: "Фахд похоронен в Аль-Уде в безымянной могиле, как того требует доктрина, а Абдулла стал королем от своего имени после десяти лет правления от чужого имени. Соболезнования поступают из девяноста столиц, и в ту же неделю проходит первое заседание кабинета министров.\n\nВсе, что он хотел сделать после инсульта, теперь он может приказать, а не предложить, и министерства это знают. Чего они пока не знают, так это насколько он все еще намерен это сделать. В этом кабинете есть люди, которые десять лет считали, что ответ — очень мало."
 SAU_events.200.t: "Новое царство"
 SAU_events.201.a: "Пусть Совет Верности вынесет решение о престолонаследии."
 SAU_events.201.b: "Король назначает наследника. Совет аплодирует ему."
 SAU_events.201.c: "Вместо этого купите согласие семьи."
 SAU_events.201.d: "С 1953 года престолонаследие определялось по принципу старшинства среди братьев, что работало, пока были братья и пока они могли прийти к согласию. С каждым годом их становится все меньше, и последние две смены власти осуществлялись людьми, которых уже нет в живых, чтобы руководить следующей.\n\nПредложенный вариант – создание постоянного совета сыновей и внуков Абдулазиза, уполномоченного утверждать наследного принца и выносить решения о пригодности короля. Это будет первая в истории Королевства письменная процедура, определяющая престол. Это также будет первый орган в истории Королевства, претендующий на престол самого короля, и это заметили многие присутствующие."
 SAU_events.201.t: "Укрепление короны"
 SAU_events.202.a: "Пусть говорят, и пусть публикуют то, что говорят."
 SAU_events.202.b: "Они могут собраться. Повестка дня наша."
 SAU_events.202.d: "Зал устроен таким образом, что шиитский священнослужитель из Катифа сидит в пределах слышимости от салафитского учёного из Эр-Рияда, а женщины впервые в истории Королевства присутствуют за ширмой. Ничто из решённого здесь не является обязательным для кого-либо. В этом суть, а также возражение против этого.\n\nДелегаты будут говорить то, что им разрешено говорить. Сколько именно — ещё не решено, и двое мужчин, которые должны это решить, расходятся во мнениях: один считает, что заседание, которое ничего не меняет, хуже, чем его отсутствие, другой — что заседание, которое что-то меняет, является первым в серии заседаний, которые никто не контролирует."
 SAU_events.202.t: "Национальный диалог"
 SAU_events.203.a: "Примите предложение Вашингтона в полном объеме."
 SAU_events.203.b: "Мабахит сам справится со своими проблемами."
 SAU_events.203.c: "Реабилитируйте их. Тюрьмы только порождают новых заключенных."
 SAU_events.203.d: "Комплексы в Аль-Хамре и Ишбилии были подвергнуты бомбардировкам людьми, которые выросли здесь, получили здесь образование и финансировались через зарегистрированные здесь благотворительные организации. Каким бы ни был предполагаемый конфликт, теперь очевидно, что он разгорелся с самим Королевством.\n\nВашингтон предлагает создать координационный центр, интеграцию со списками наблюдения и доступ к сигналам, которыми он никогда не делился ни с кем в регионе. Принятие предложения означает, что американские офицеры будут читать саудовские документы. Отказ означает, что придется делать это в одиночку, в стране, где очень многие люди молчаливо соглашаются с действиями террористов."
 SAU_events.203.t: "Сотрудничество в борьбе с терроризмом"
 SAU_events.204.a: "Половина мест занята, и мужчины внесены в списки."
 SAU_events.204.b: "Назначьте их всех и назовите это консультацией."
 SAU_events.204.c: "Включите в списки и женщин."
 SAU_events.204.d: "Половина мест в муниципальных советах избирается; другая половина назначается; а сами советы наделены полномочиями в вопросах водоотведения, уличного освещения и выдачи разрешений на строительство. Никто во дворце не утверждает, что это передача власти.\n\nАргумент против этого не в том, что советы причинят вред. Дело в том, что саудовцы уже проголосовали, и что прецедент, в отличие от указа, нельзя тихо отменить в следующем году."
 SAU_events.204.t: "Провести муниципальные выборы"
 SAU_events.205.a: "Это была лишь рекомендация до самого конца."
 SAU_events.205.d: "Совет заседал, когда поступил приказ, и в приказе не было никаких пояснений. Членам Совета выразили благодарность за службу в четырехстрочном коммюнике, здание было закрыто, а документы, к чтению которых им годами разрешали обращаться, были возвращены в министерства, из которых они пришли.\n\nОн заседал с разрешения короля. Короля нет, или больше нет никого из династии Саудов, а значит, нет и Совета. Никто в Эр-Рияде не ожидал, что он переживет эту неделю, и никто об этом не говорил вслух."
 SAU_events.205.t: "Совет распущен"
 SAU_events.206.a: "Пусть это пройдет."
 SAU_events.206.b: "Корона воздерживается от дачи согласия."
 SAU_events.206.d: "Реформистская коллегия сама произвела расчеты, что является чем-то новым, и эти расчеты оптимистичны, что неудивительно. Дороги к деревням, которые были пропущены в магистральной сети, вода для районов, которые по-прежнему покупают ее автоцистернами, и пункт, обязывающий министерство публиковать данные о расходах.\n\nИменно против последнего пункта возражает министерство."
 SAU_events.206.t: "Законопроект реформаторов"
 SAU_events.207.a: "Пусть это пройдет."
 SAU_events.207.b: "Корона воздерживается от дачи согласия."
 SAU_events.207.d: "Сторонники традиций предлагают то, что они всегда предлагали и никогда прежде не могли вынести на голосование: надлежащее финансирование целевых фондов, повышение жилищных пособий и график работы клиник для провинций, которые остались без них со времен экономического бума.\n\nМинистерство финансов называет эти расчеты амбициозными. Сторонники отвечают, что на протяжении тридцати лет расчеты были амбициозными в противоположном направлении."
 SAU_events.207.t: "Законопроект традиционалистов"
 SAU_events.208.a: "Пусть это пройдет."
 SAU_events.208.b: "Корона воздерживается от дачи согласия."
 SAU_events.208.d: "Провинциальные члены объединились, чего никто в Эр-Рияде от них не ожидал. Введены действующие квоты на найм в Саудовской Аравии, отменены спонсорские соглашения, привязывающие работника к одному работодателю, и создана инспекция, отчитывающаяся перед Советом, а не перед министерством, которое она инспектирует.\n\nНа этой неделе каждый торговый дом в Джидде написал во дворец. Суды знают об этом и всё равно назначили голосование."
 SAU_events.208.t: "Законопроект провинциалов"
 SAU_events.209.a: "Тридцать мест по королевскому указу."
 SAU_events.209.b: "Помещение остаётся в том же виде, в каком оно есть."
 SAU_events.209.d: "Тридцать мест, гарантированных указом, чтобы ни один будущий король не смог спокойно позволить этому числу исчезнуть — пятая часть зала. Они будут входить через отдельную дверь и сидеть в отдельной секции, а фотографии будут распространяться гораздо дальше, чем план рассадки.\n\nОколо сорока ведущих ученых подписали письмо. Письмо ни в чем не угрожает, потому что в этом нет необходимости."
 SAU_events.209.t: "Женщины в Совете Шуры"
 SAU_events.21.a: "Внимательно следите за развитием событий."
 SAU_events.21.d: "Ранее неизвестное движение, называющее себя [ROOT.SAU_GetFrontName], объявило о своем существовании на Западном берегу и в пределах границ самого Израиля. В скоординированных заявлениях оно клянется в вооруженном сопротивлении до освобождения, приписывая себе недавнюю волну нападений. Разведывательные службы пытаются отследить его происхождение, финансирование и масштабы деятельности."
 SAU_events.21.t: "На Святой Земле поднимается новый фронт."
 SAU_events.210.a: "Страны Персидского залива не теряют монархию."
 SAU_events.210.d: "МАНАМА — Саудовская бронетехника пересекла мост короля Фахда до рассвета и достигла столицы, не открыв огня. Эр-Рияд описывает развертывание как операцию «Щит полуострова», предпринятую по запросу законного правительства Бахрейна, и отказывается уточнять, какое именно правительство направило этот запрос.\n\nТегеран назвал это оккупацией. Вашингтон призвал все стороны к сдержанности и не просил никого покинуть свои дома. Дом Халифов вернулся во дворец, и договоренность, которая привела к его возвращению, теперь является общедоступной информацией, а не частным соглашением."
 SAU_events.210.t: "Дорога"
 SAU_events.211.a: "Накачка. Стратегия заключается в освоении месторождений."
 SAU_events.211.b: "Создайте отрасль, которая переживет скважины."
 SAU_events.211.c: "Опрос. Есть и другие подобные исследования."
 SAU_events.211.d: "В Абкайке большая часть нефти Королевства перерабатывается на одном предприятии, а в Рас-Тануре — на другом. Две успешные атаки нанесут мировой экономике больший ущерб, чем любая армия в регионе сможет нанести за год, и министерству наконец-то предложили открыто заявить о своих намерениях по этому поводу.\n\nДеньги хватит на одно решение, а не на три. Нужно активнее добывать нефть, пока месторождения находятся в безопасности; нужно развивать промышленность, которая переживет их потерю; или перестать считать, что имеющиеся в Королевстве месторождения — это все месторождения, которые есть."
 SAU_events.211.t: "Стратегия защиты нефтяной отрасли"
 SAU_events.212.a: "Пусть скамейка тянется вверх."
 SAU_events.212.d: "Закон всегда был адекватным. Не хватало лишь коллегии судей, готовой применять его к вышестоящим инстанциям — суда, который мог бы вызвать министра, комиссии, которая могла бы открыть счета принца, и судьи, у которого после этого сохранилась бы карьера.\n\nОн будет работать ровно настолько хорошо, насколько терпение короля к нему, и каждый, кого могут вызвать, это знает. Движение денег прекращается уже на той неделе, когда объявляют о вызове судов."
 SAU_events.212.t: "Коррупционные суды"
 SAU_events.213.a: "Никто не стоит выше этого дела."
 SAU_events.213.d: "Около двухсот принцев, министров и бизнесменов месяцами содержались в самом дорогом отеле страны. Говорят, что удалось вернуть сто миллиардов долларов. Никаких обвинений не выдвигается, никаких приговоров не выносится, а освобождение происходит поочередно в ходе переговоров.\n\nЭто описывается как антикоррупционная кампания. Это момент, когда семья перестала быть коллективом и стала зрителем, и каждый инвестор на земле наблюдал за этим."
 SAU_events.213.t: "Ритц-Карлтон"
 SAU_events.214.a: "Уладьте это спокойно. Так и должно было быть."
 SAU_events.214.d: "Соглашения о передаче прав заключаются по одному, и условия никогда не публикуются: компания передается здесь, фонд ликвидируется там, должность сына тихо гарантируется. Все участники понимают, что это не юридические, а политические инструменты.\n\nДеньги возвращаются в страну почти сразу, потому что у тех, кто их возвращает, теперь есть причина хранить их там, где за ними можно следить. Досье на каждого из них лежит открытым в ящике в Эр-Рияде."
 SAU_events.214.t: "Сделки через обратный канал"
 SAU_events.215.a: "Семье придётся найти другой повод для споров."
 SAU_events.215.d: "Принцы всё ещё подсчитывали поддержку друг друга, когда офицеры перестали вообще что-либо считать. Наследника нет, потому что нет трона, который можно было бы унаследовать — Совет снял этот вопрос с повестки дня и не намерен его возвращать.\n\nЛюди, которые последние годы занимались формированием своих фракций, обнаружили, что фракция стоит лишь столько, сколько стоит стоящая за ней институция, а институцией, стоящей за всеми ними, была монархия."
 SAU_events.215.t: "Процесс наследования завершен."
 SAU_events.216.a: "Пусть они открыто об этом говорят."
 SAU_events.216.b: "Ограничьтесь беспорядком."
 SAU_events.216.c: "Скажите им, что в королевстве одновременно один король."
 SAU_events.216.d: "Люди Мутаиба уже в третий раз за этот год задали Дивану тот же вопрос, и на этот раз даже не потрудились сформулировать его в виде вопроса. Королевство называет себя хранителем двух мечетей и ведет себя как клиент. Фейсал так не поступал. В этом вся суть спора, и при более внимательном рассмотрении он не становится сложнее.\n\nВопрос о преемственности остается нерешенным, а это значит, что все сказанное сейчас произносится перед людьми, которые выбирают сторону."
 SAU_events.216.t: "Круг снова задает вопрос"
 SAU_events.217.a: "Королевство продолжает существовать."
 SAU_events.217.d: "Эр-Рияд объявил о смерти короля Фахда бин Абдулазиза Аль Сауда, который правил двадцать три года и после инсульта 1995 года занимал очень мало занимаемой им должности. Королевство, которое он оставляет, в течение десяти лет управлялось от его имени и от имени его брата, и объявленная сегодня утром смена власти меняет титул в документах, а не имя человека, подписывающего их.\n\nНаследный принц Абдулла вступает в должность. Ему уже за восемьдесят. Люди, которые имеют значение, смотрят не на него, а на того, кто будет назначен следующим."
 SAU_events.217.t: "Смерть короля Фахда"
 SAU_events.218.a: "Теперь вся история посвящена вопросу преемственности."
 SAU_events.218.d: "Король Абдулла бин Абдулазиз Аль Сауд умер, и вместе с ним уходит последний из братьев, которые могли претендовать на трон исключительно по старшинству, без каких-либо сомнений. Он был похоронен в безымянной могиле в Аль-Ауде, как того требует обряд и как хоронили всех королей до него.\n\nСалман вступает во власть через несколько часов. Далее следует то, что Королевство откладывало тридцать лет: корона должна в конечном итоге перейти к поколению, которое не имеет на нее автоматических прав, и каждый ныне живущий принц это знает."
 SAU_events.218.t: "Смерть короля Абдаллы"
 SAU_events.219.a: "Да здравствует Король!"
 SAU_events.219.d: "Король умер. Эр-Рияд сделал соответствующее заявление, используя максимально лаконичные формулировки, предназначенные для обращения к престолу, и наследный принц уже получил присягу от старших принцев, улемов и командующих гвардией.\n\nПравление, которое заканчивается сегодня, началось со старика и королевства, которое все еще управлялось на основе понимания того, что корона переходит от одного брата к другому. Оно заканчивается тем, что это понимание утрачено, разрушено самим королем в пользу преемственности, которую мир призван считать устоявшейся."
 SAU_events.219.t: "Смерть короля Салмана"
 SAU_events.22.a: "Пусть нефть течет на юг."
 SAU_events.22.b: "Наша земля — это не саудовская автомагистраль."
 SAU_events.22.d: "Саудовская Аравия просит проложить трубопровод через наши южные провинции к Аравийскому морю. Транзитные сборы пополнили бы нашу казну, и Эр-Рияд был бы нам должен услугу, которую ему будет нелегко отплатить."
 SAU_events.22.t: "Трубопровод к морю"
 SAU_events.24.a: "Создайте конвейер."
 SAU_events.24.b: "Отклоните предложение."
 SAU_events.24.d: "Саудовская Аравия предлагает транспортировать свою нефть через нашу территорию в направлении Турции и Европы. Ирак станет мостом между Персидским заливом и Западом, а доходы от транзита позволят восстановить страну."
 SAU_events.24.t: "Трубопровод в Европу"
 SAU_events.25.a: "Отправьте их домой с пустыми руками."
 SAU_events.25.d: "Дом Саудов посылает посланников с предложениями о строительстве трубопровода через нашу землю. Они забывают, кто здесь правит. Ирак никому не кланяется, и уж тем более Эр-Рияду."
 SAU_events.25.t: "Посол Саудовской Аравии в Багдаде"
 SAU_events.26.a: "Отличный."
 SAU_events.26.d: "Сварщики укладывают последний участок, и клапаны открываются. Саудовская нефть теперь течет по новой магистрали к морю, и контроль Королевства над мировыми энергетическими ресурсами усиливается."
 SAU_events.26.t: "Нефтяные потоки"
 SAU_events.27.a: "Мы найдем другой способ."
 SAU_events.27.d: "Сделка сорвалась. На данный момент этот путь к морю остается недоступным для нас, и Ормуз остается единственным выходом."
 SAU_events.27.t: "Маршрут закрыт."
 SAU_events.28.a: "Дорогостоящая неудача."
 SAU_events.28.d: "Война добралась до трубопровода. Диверсанты взорвали участок, и подача нефти прекратилась. Пока не будет обеспечена безопасность южного Йемена, морской маршрут через Аравийское море будет потерян."
 SAU_events.28.t: "Трубопровод разорван."
 SAU_events.29.a: "Откройте маршрут."
 SAU_events.29.b: "Откажитесь от предложения Саудовской Аравии."
 SAU_events.29.d: "Эр-Рияд просит разрешения на прокладку трубопровода через наше королевство в направлении Средиземного моря. Одних только транзитных сборов было бы достаточно для стабилизации наших финансов, а саудовцы — щедрые друзья."
 SAU_events.29.t: "Трубопровод через Иорданию"
 SAU_events.3.a: "Примите предложение Саудовской Аравии."
 SAU_events.3.b: "Отклоните предложение Саудовской Аравии."
 SAU_events.3.d: "Эр-Рияд предлагает китайским компаниям доступ к саудовским сельскохозяйственным и энергетическим проектам. Принятие этого предложения углубит экономические связи между Китаем и Королевством."
 SAU_events.3.t: "[SAU.GetFlag] Саудовско-китайская сделка [CHI.GetFlag]"
 SAU_events.30.a: "Приветствуем этот трубопровод."
 SAU_events.30.b: "Сирия не продаётся."
 SAU_events.30.d: "После того как Иордания согласилась, саудовцы предложили транспортировать нефть через нашу территорию к морю. Свободная и процветающая Сирия получила бы от этого огромную выгоду, и дружба с Эр-Риядом очень ценна."
 SAU_events.30.t: "Предложение из Эр-Рияда"
 SAU_events.300.a: "Независимые технократы."
 SAU_events.300.b: "Королевский надзор необходим."
 SAU_events.300.c: "Привлечь иностранных экспертов."
 SAU_events.300.d: "Он §LЗакон о рынке капитала§! Подписано. Теперь мы должны решить: кто сядет во главе нового правительства? §LУправление по рынку капитала§!Технократы требуют независимости; §HКоролевский двор§! Требуется контроль; иностранные советники предлагают свой опыт. Этот выбор определит финансовую архитектуру королевства на целое поколение."
 SAU_events.300.t: "§HКоролевский указ М/30 - Внедрение§!"
 SAU_events.301.a: "Англосаксонская структура."
 SAU_events.301.b: "Принцип приоритета шариата."
 SAU_events.301.c: "Гибридная модель."
 SAU_events.301.d: "Официальная регистрация компании меняет корпоративный ландшафт. Акционерные общества, общества с ограниченной ответственностью — §LКоролевство§! должен выбрать свою модель. §Lанглосаксонский§! Эта структура обеспечивает эффективность за счет иностранного влияния; §Lшариат прежде всего§! Эта структура обеспечивает легитимность за счет скорости; §Lгибридный§! выбирает взвешенный срединный путь."
 SAU_events.301.t: "§HПравовые реформы 2007 года§!"
 SAU_events.310.a: "Американское обучение и партнерство"
 SAU_events.310.b: "Коллективная оборона стран Персидского залива"
 SAU_events.310.c: "Профессионализм по образцу НАТО"
 SAU_events.310.d: "Домашняя самодостаточность"
 SAU_events.310.desc: "Операция «Буря в пустыне» поставила в тупик каждую армию, которая наблюдала за ней. Королевские сухопутные войска Саудовской Аравии действовали достаточно эффективно бок о бок со своими партнерами по коалиции, но Генеральный штаб знает правду: без американской авиации, материально-технического обеспечения и командования армия Королевства была не готова.\n\nВоенные учения закончились, и вердикт вынесен. Теперь Королевству предстоит выбрать модель, по которой оно будет восстанавливать свои вооруженные силы. Каждый путь делает нас в чем-то сильнее, а в чем-то слабее — свободного выбора не существует.\n\n§YНаведите курсор на каждый параметр, чтобы увидеть, что именно он предоставляет и сколько стоит.§!"
 SAU_events.310.t: "Военные игры: уроки войны в Персидском заливе"
 SAU_events.311.a: "Национальная гвардия: Режимная гвардия"
 SAU_events.311.b: "Национальная гвардия: Племенные ополчения"
 SAU_events.311.c: "Национальная гвардия: Внутренняя безопасность"
 SAU_events.311.desc: "Национальная гвардия Саудовской Аравии должна решить, для чего она действительно нужна. Каждый путь — это долгосрочный компромисс: с одной стороны, мы сильнее, с другой — слабее.\n\n§YНаведите курсор на вариант, чтобы увидеть, что именно он даёт и во что обходится.§!"
 SAU_events.311.t: "Учения по боевой готовности Национальной гвардии"
 SAU_events.312.a: "Броня: Шок и Прорыв"
 SAU_events.312.b: "Бронетехника: комбинированные виды вооружения"
 SAU_events.312.c: "Броня: Защитная стена"
 SAU_events.312.desc: "Как бронетанковый корпус будет сражаться со своими новыми «Абрамсами»? Каждый путь — это долгосрочный компромисс: с одной стороны мы сильнее, с другой — слабее.\n\n§YHover — выберите опцию, чтобы точно узнать, что она дает и сколько стоит.§!"
 SAU_events.312.t: "Программа артиллерийской подготовки Abrams"
 SAU_events.313.a: "Артиллерия: массированный огонь"
 SAU_events.313.b: "Артиллерия: высокоточный огонь"
 SAU_events.313.c: "Артиллерия: Стрельба и отступление"
 SAU_events.313.desc: "Артиллеристы совершенствуют своё мастерство — но в каком направлении? Каждый путь — это долгосрочный компромисс: с одной стороны мы сильнее, с другой — слабее.\n\n§YHover — выберите опцию, чтобы точно узнать, что она даёт и сколько стоит.§!"
 SAU_events.313.t: "Учения по артиллерийской стрельбе с боевой стрельбой"
 SAU_events.314.a: "Армейская авиация: истребители танков"
 SAU_events.314.b: "Армейская авиация: непосредственная поддержка"
 SAU_events.314.c: "Армейская авиация: разведка и рейды"
 SAU_events.314.desc: "Какую роль должен освоить флот вертолетов Apache? Каждый путь — это долгосрочный компромисс: с одной стороны мы сильнее, с другой — слабее.\n\n§YHover — выберите опцию, чтобы точно узнать, что она дает и сколько стоит.§!"
 SAU_events.314.t: "Учебные стрельбы с вертолётов Apache"
 SAU_events.315.a: "Спецназ: борьба с терроризмом"
 SAU_events.315.b: "Спецназ: Глубокие рейдеры"
 SAU_events.315.c: "Спецназ: Разведка"
 SAU_events.315.desc: "На какую специализацию должны быть направлены силы специального назначения? Каждый путь — это долгосрочный компромисс: с одной стороны мы сильнее, с другой — слабее.\n\n§YHover — выберите опцию, чтобы точно узнать, что она дает и чего стоит.§!"
 SAU_events.315.t: "Курс отбора в спецназ"
 SAU_events.316.a: "Военно-морской флот: контроль над морем в Персидском заливе"
 SAU_events.316.b: "Военно-морской флот: стремление к плаванию в открытом море"
 SAU_events.316.c: "Военно-морской флот: береговая оборона"
 SAU_events.316.desc: "На какую миссию должна быть ориентирована деятельность Королевского военно-морского флота Саудовской Аравии? Каждый путь — это долгосрочный компромисс: с одной стороны мы сильнее, с другой — слабее.\n\n§YНаведите курсор на вариант, чтобы увидеть, что именно он даёт и во что обходится.§!"
 SAU_events.316.t: "Совместные учения флота"
 SAU_events.317.a: "Воздушный бой: Мастерство воздушного боя"
 SAU_events.317.b: "Воздух: за пределами видимости"
 SAU_events.317.c: "Воздушная оборона: Доктрина противовоздушной обороны"
 SAU_events.317.desc: "Как следует обучать саудовских пилотов истребителей побеждать? Каждый путь — это долгосрочный компромисс: с одной стороны мы сильнее, с другой — слабее.\n\n§YНаведите курсор на вариант, чтобы увидеть, что именно он даёт и во что обходится.§!"
 SAU_events.317.t: "Подготовка к воздушному бою «Красный флаг»"
 SAU_events.318.a: "ДРЛО: Управление воздушным боем"
 SAU_events.318.b: "WACS: Объединенная наземная связь"
 SAU_events.318.c: "AWACS: Сеть раннего предупреждения"
 SAU_events.318.desc: "Как флот E-3 повлияет на ход сражения? Каждый путь — это долгосрочный компромисс: с одной стороны, мы сильнее, с другой — слабее.\n\n§YHover — выберите опцию, чтобы точно узнать, что она дает и чего стоит.§!"
 SAU_events.318.t: "Обучение управлению боем на самолетах ДРЛО"
 SAU_events.319.a: "Высокоточные управляемые боеприпасы: высокоточный удар"
 SAU_events.319.b: "Высокоточные управляемые боеприпасы: противодействие в обороне"
 SAU_events.319.c: "Высокоточные управляемые боеприпасы: перехват на поле боя"
 SAU_events.319.desc: "Как Королевство будет использовать своё «умное» оружие? Каждый путь — это долгосрочный компромисс: с одной стороны, мы сильнее, с другой — слабее.\n\n§YHover — выберите опцию, чтобы точно узнать, что она даёт и чего стоит.§!"
 SAU_events.319.t: "Курс доктрины высокоточного удара"
 SAU_events.32.a: "Заберите их деньги."
 SAU_events.32.b: "Никогда. Пусть подавятся Ормузским проливом."
 SAU_events.32.d: "Наши давние соперники в Эр-Рияде хотят транспортировать свою нефть через нашу территорию к морю. Они щедро заплатят за транзит. Гордость — это одно, но казна пуста."
 SAU_events.32.t: "Саудовское предложение"
 SAU_events.320.a: "Реформа: ускоренная программа"
 SAU_events.320.b: "Реформа: методичное наращивание"
 SAU_events.320.c: "Реформа: Иностранные подрядчики"
 SAU_events.320.desc: "Реформа начинается. Насколько сильно мы будем давить? Каждый путь — это долгосрочный компромисс: с одной стороны, он делает нас сильнее, с другой — слабее.\n\n§YНаведите курсор на вариант, чтобы увидеть, что именно он даёт и во что обходится.§!"
 SAU_events.320.t: "Этап I: Запуск программы реформ"
 SAU_events.321.a: "Боевое оружие: Бронированный кулак"
 SAU_events.321.b: "Боевые виды вооружения: огневая мощь"
 SAU_events.321.c: "Боевые подразделения: Профессиональная пехота"
 SAU_events.321.desc: "Какое боевое подразделение возглавляет современные вооруженные силы? Каждый путь — это долгосрочный компромисс: с одной стороны мы сильнее, с другой — слабее.\n\n§YHover — выберите опцию, чтобы точно узнать, что она дает и сколько стоит.§!"
 SAU_events.321.t: "Этап II: Модернизация боевых подразделений"
 SAU_events.322.a: "Поза: Проекция силы"
 SAU_events.322.b: "Позиция: Стратегическое сдерживание"
 SAU_events.322.c: "Позиция: Оборона Родины"
 SAU_events.322.desc: "Модернизация завершена. Какую позицию займет Королевство? Каждый путь — это долгосрочный компромисс: с одной стороны, мы сильнее, с другой — слабее.\n\n§YHover — выберите опцию, чтобы точно узнать, что она дает и чего стоит.§!"
 SAU_events.322.t: "Этап III: Создание полностью современной армии"
 SAU_events.33.a: "Станьте мостом в Европу."
 SAU_events.33.b: "Мы не будем провоцировать Россию."
 SAU_events.33.d: "Саудовская Аравия просит нас проложить их трубопровод дальше в Европу. Мы станем своего рода привратниками нефти Персидского залива на Западе, взимая свою плату с каждой баррели, и Москва нам за это не будет благодарна."
 SAU_events.33.t: "Дорога в Европу"
 SAU_events.330.a: "Покупайте американское: M1A2 Abrams"
 SAU_events.330.b: "Диверсифицировать наших поставщиков вооружений"
 SAU_events.330.c: "Создать отечественную оружейную промышленность"
 SAU_events.330.d: "Расширить Национальную гвардию"
 SAU_events.330.desc: "Война в Персидском заливе наглядно показала, насколько наша армия не готова самостоятельно защищать Королевство. Королевские сухопутные войска Саудовской Аравии необходимо восстановить — но с помощью чьего оружия и по каким принципам?"
 SAU_events.330.t: "Восстановление сухопутных войск"
 SAU_events.331.a: "Французские фрегаты: программа «Савари»"
 SAU_events.331.b: "Американские корабли и обучение"
 SAU_events.331.c: "Береговые оборонительные и патрульные катера"
 SAU_events.331.d: "Стремитесь к созданию флота для плавания в открытом море."
 SAU_events.331.desc: "От Персидского залива до Красного моря Королевству предстоит охранять два протяженных побережья и жизненно важный для мира источник нефти. Какой флот нам следует построить?"
 SAU_events.331.t: "Военно-морской флот для двух морей"
 SAU_events.332.a: "Американские орлы: программа «Солнце мира»"
 SAU_events.332.b: "Британские самолеты: сделка с Аль-Ямамой"
 SAU_events.332.c: "Российская мощь: МиГ-31"
 SAU_events.332.desc: "Военно-воздушные силы — это первый щит Королевства и его самый острый меч. Какому пути должны следовать Королевские военно-воздушные силы Саудовской Аравии?"
 SAU_events.332.t: "Владычество в небесах"
 SAU_events.333.a: "Американский: M1A2 Abrams"
 SAU_events.333.b: "Русский: Т-90"
 SAU_events.333.c: "Французский вариант: Leclerc"
 SAU_events.333.d: "Немецкий вариант: Leopard 2"
 SAU_events.333.desc: "Армии необходим современный основной боевой танк. У какой державы мы его купим — или будем производить сами? Этот выбор определяет, от кого будет зависеть Королевство."
 SAU_events.333.t: "Выбор основного боевого танка"
 SAU_events.334.a: "Наведите ракеты на Тегеран"
 SAU_events.334.b: "Используйте их в качестве молчаливого сдерживающего фактора."
 SAU_events.334.c: "Расширить ракетный арсенал"
 SAU_events.334.desc: "Стратегические ракетные войска предоставляют Королевству оружие последнего средства. Какую позицию оно должно занять?"
 SAU_events.334.t: "Стратегическое сдерживание"
 SAU_events.335.a: "Борьба с терроризмом внутри страны"
 SAU_events.335.b: "Проецирование силы за рубежом"
 SAU_events.335.c: "Тренируйтесь с западными спецподразделениями."
 SAU_events.335.desc: "Наши спецназовцы готовы. Где же им удастся проявить себя?"
 SAU_events.335.t: "Доктрина спецназа"
 SAU_events.336.a: "Американские фрегаты (MMSC)"
 SAU_events.336.b: "Российские фрегаты (Горшков)"
 SAU_events.336.c: "Французские фрегаты (Савари)"
 SAU_events.336.d: "Немецкие фрегаты (MEKO)"
 SAU_events.336.desc: "Военно-морскому флоту нужны современные фрегаты для охраны двух морей. Чья верфь должна их строить — или мы должны строить свои собственные?"
 SAU_events.336.t: "Выбор поставщика фрегатов"
 SAU_events.337.a: "десантный отряд"
 SAU_events.337.b: "Береговая и островная защита"
 SAU_events.337.c: "Роль GCC в быстром реагировании"
 SAU_events.337.desc: "Новому подразделению морской пехоты нужна определенная роль. Какова она должна быть?"
 SAU_events.337.t: "Морской флот"
 SAU_events.338.a: "Закупить максимальное количество истребителей F-15."
 SAU_events.338.b: "Поддерживайте сбалансированный состав военно-воздушных сил."
 SAU_events.338.c: "Инвестируйте в подготовку пилотов."
 SAU_events.338.desc: "В рамках программы «Солнце мира» в Королевство поступил истребитель F-15 Eagle. Насколько далеко мы сможем зайти в его освоении?"
 SAU_events.338.t: "Солнце мира"
 SAU_events.34.a: "Дорогостоящий удар."
 SAU_events.34.d: "Диверсанты атаковали трубопровод, идущий на запад, в сторону Средиземного моря. Подача нефти остановлена, и маршрут недоступен до тех пор, пока его не восстановят."
 SAU_events.34.t: "Левантийский трубопровод разорван."
 SAU_events.340.a: "Доктрина наступательной воздушной обороны"
 SAU_events.340.b: "Защитный воздушный щит"
 SAU_events.340.c: "Интегрированная система управления воздушным движением стран Персидского залива"
 SAU_events.340.desc: "Командование воздушных операций объединяет военно-воздушные силы. Какая доктрина должна им руководить?"
 SAU_events.340.t: "Владычество в небесах"
 SAU_events.341.a: "Проведите активную модернизацию с помощью Запада."
 SAU_events.341.b: "Сбалансированное, выверенное наращивание"
 SAU_events.341.c: "Приоритет отдается внутренней безопасности и лояльности."
 SAU_events.341.desc: "После восстановления вооруженных сил Королевству необходимо определить свой общий курс. Как нам следует сформировать армию?"
 SAU_events.341.t: "Позиция Вооруженных Сил"
 SAU_events.342.a: "Американский: M109 Paladin"
 SAU_events.342.b: "Русский: 2S19 Мста"
 SAU_events.342.c: "Французский: Цезарь"
 SAU_events.342.d: "Немецкий: PzH 2000"
 SAU_events.342.desc: "Орудия должны идти в ногу с бронетехникой. Чью самоходную артиллерию нам выставить на поле боя — или построить свою собственную?"
 SAU_events.342.t: "Выбор самоходной артиллерии"
 SAU_events.343.a: "Американская: РСЗО M270"
 SAU_events.343.b: "Русский: БМ-30 Смерч"
 SAU_events.343.desc: "Массированный ракетный огонь способен сорвать наступление противника. Чьи пусковые установки нам приобрести — или лучше построить свои собственные?"
 SAU_events.343.t: "Выбор ракетной артиллерии"
 SAU_events.344.a: "Одобрить продажу."
 SAU_events.344.b: "Отклонить запрос."
 SAU_events.344.desc: "Саудовская Аравия запросила покупку американских истребителей. Одобрение сделки усилит зависимость Эр-Рияда от нашей оборонной промышленности."
 SAU_events.344.t: "Саудовская Аравия запросила американских истребителей."
 SAU_events.345.a: "Одобрить продажу."
 SAU_events.345.b: "Отклонить запрос."
 SAU_events.345.desc: "Саудовская Аравия запросила покупку британских истребителей. Одобрение сделки укрепит выгодное оборонное партнерство."
 SAU_events.345.t: "Саудовская Аравия запросила британских истребителей."
 SAU_events.346.a: "Одобрить продажу."
 SAU_events.346.b: "Отклонить запрос."
 SAU_events.346.desc: "Саудовская Аравия запросила покупку российских истребителей. Одобрение сделки откроет для страны новый крупный рынок в Персидском заливе."
 SAU_events.346.t: "Саудовская Аравия запрашивает российских истребителей."
 SAU_events.347.a: "Одобрить продажу."
 SAU_events.347.b: "Отклонить запрос."
 SAU_events.347.desc: "Саудовская Аравия запросила крупную партию танков M1A2 Abrams. Эта сделка позволит Королевству еще теснее сотрудничать с США в области логистики и обучения."
 SAU_events.347.t: "Саудовская Аравия запросила американские танки."
 SAU_events.348.a: "Одобрить продажу."
 SAU_events.348.b: "Отклонить запрос."
 SAU_events.348.desc: "Саудовская Аравия запросила крупную партию танков Т-90. Эта сделка позволит российской промышленности закрепиться на традиционно западном рынке."
 SAU_events.348.t: "Саудовская Аравия запросила российские танки."
 SAU_events.349.a: "Одобрить продажу."
 SAU_events.349.b: "Отклонить запрос."
 SAU_events.349.desc: "Саудовская Аравия запросила покупку танков Leclerc. Одобрение сделки укрепит оборонные связи Франции с Королевством."
 SAU_events.349.t: "Саудовская Аравия запросила французские танки."
 SAU_events.35.a: "Восстановим то, что сможем."
 SAU_events.35.d: "Наша линия связи с Европой перерезана. Диверсанты взорвали критически важный участок, и нефть больше не поступает на Запад. Сегодня вечером Москва может вздохнуть с облегчением."
 SAU_events.35.t: "Европейский трубопровод разорван."
 SAU_events.350.a: "Одобрить продажу."
 SAU_events.350.b: "Отклонить запрос."
 SAU_events.350.desc: "Саудовская Аравия запросила покупку танков Leopard 2. Одобрение сделки расширит экспорт немецкой военной техники в страны Персидского залива."
 SAU_events.350.t: "Саудовская Аравия запросила немецкие танки."
 SAU_events.351.a: "Одобрить продажу."
 SAU_events.351.b: "Отклонить запрос."
 SAU_events.351.desc: "Саудовская Аравия обратилась к американским верфям с просьбой построить современный фрегат для Королевского военно-морского флота Саудовской Аравии. Этот контракт позволит углубить военно-морское сотрудничество с Эр-Риядом."
 SAU_events.351.t: "Саудовская Аравия запросила американский фрегат."
 SAU_events.352.a: "Одобрить продажу."
 SAU_events.352.b: "Отклонить запрос."
 SAU_events.352.desc: "Саудовская Аравия обратилась к российским верфям с просьбой построить современный фрегат для Королевского военно-морского флота Саудовской Аравии. Этот контракт откроет новый рынок Персидского залива для российских военных кораблей."
 SAU_events.352.t: "Саудовская Аравия запросила российский фрегат."
 SAU_events.353.a: "Одобрить продажу."
 SAU_events.353.b: "Отклонить запрос."
 SAU_events.353.desc: "Саудовская Аравия обратилась к французским верфям с просьбой построить современный фрегат для Королевского военно-морского флота Саудовской Аравии. Этот контракт продлит давние отношения с Эр-Риядом в сфере обороны."
 SAU_events.353.t: "Саудовская Аравия запросила французский фрегат."
 SAU_events.354.a: "Одобрить продажу."
 SAU_events.354.b: "Отклонить запрос."
 SAU_events.354.desc: "Саудовская Аравия обратилась к немецким верфям с просьбой построить современный военный корабль для Королевского военно-морского флота Саудовской Аравии. Этот контракт укрепит оборонные связи Германии в Персидском заливе."
 SAU_events.354.t: "Саудовская Аравия запросила немецкий военный корабль."
 SAU_events.360.a: "§HСоздать суверенный фонд благосостояния.§! Отложите неожиданно полученные деньги и инвестируйте их в будущее."
 SAU_events.360.b: "§HFundGrandGameProjects.§!Вложите деньги в заводы и города в вашей стране."
 SAU_events.360.c: "§HРаспространите это среди людей.§! Субсидии и бонусы покупают лояльность и спокойствие."
 SAU_events.360.d: "Нефтяные отходы поднимаются из $ 25 to over §G$ 140 за баррель§!Петродалы наводняют казну быстрее, чем Королевство успевает их подсчитывать. §YНеожиданный доход 2003-2008 годов§! Это шанс, выпадающий раз в поколение, и то, как он будет использован, определит будущее Королевства на десятилетия вперед. Совет обсуждает: §LСохраните его, используйте его в строительстве или поделитесь им.§!?"
 SAU_events.360.t: "§HНефтяной бум§!"
 SAU_events.361.a: "§RAНевероятный удар!§!"
 SAU_events.361.b: "Найдите новых поставщиков и переждите этот период."
 SAU_events.361.d: "Эр-Рияд присоединился к арабскому нефтяному эмбарго против нас. Танкеры простаивают в Персидском заливе, наши нефтеперерабатывающие заводы испытывают нехватку топлива, а цены на бензин выходят из-под контроля. Заводы простаивают, а автомобилисты стоят в очередях часами.\n\nСаудовцы заявляют, что краны останутся закрытыми до тех пор, пока наша политика в отношении региона не изменится. Наша экономика будет ощущать давление до тех пор, пока действует эмбарго."
 SAU_events.361.t: "§RСаудовская Аравия прекращает поставки нефти§!"
 SAU_events.362.a: "§GНефть — наш меч.§!"
 SAU_events.362.b: "§RМы переживем эту бурю.§!"
 SAU_events.362.c: "Опасная эскалация."
 SAU_events.362.d: "В отголоске §H1973§!Королевство Саудовская Аравия объявило эмбарго на поставки нефти на Запад и друзьям Израиля. §LСоединенные Штаты, Великобритания, Франция, Германия и Нидерланды§! В настоящее время страна сталкивается с нехваткой топлива, нормированием поставок и резким ростом цен.\n\nПо всему арабскому и мусульманскому миру толпы приветствуют непокорность Эр-Рияда. В западных столицах правительства пытаются найти альтернативных поставщиков и предупреждают о рецессии. Нефть, некогда просто товар, стала оружием государственной политики."
 SAU_events.362.t: "§HСаудовская Аравия использует нефтяное оружие§!"
 SAU_events.363.a: "§YБочка всегда звонит.§! (§RНефтяная зависимость +2§!)"
 SAU_events.363.d: "Даже несмотря на диверсификацию экономики Королевства, зависимость от нефти не ослабевает. Каждое министерство, каждая статья бюджета, каждый легкий нефтедоллар тянет экономику обратно к нефти. Корыстные интересы, дешевая энергия и путь наименьшего сопротивления — все тянет в одном направлении.\n\nБез постоянных усилий Королевство снова скатывается к зависимости от нефти."
 SAU_events.363.t: "§RПритяжение нефти§!"
 SAU_events.370.a: "§G Поддержите рыночные реформы.§! Пусть частный сектор возглавит процесс."
 SAU_events.370.b: "§RЗащитите установленный порядок.§!Изменения могут подождать."
 SAU_events.370.d: "Технократы в Министерстве экономики настаивают на §Lдерегулирование, приватизация и открытые рынки§!Старая гвардия предупреждает, что слишком поспешные действия приведут к разрушению общественного договора, на котором построено Королевство. Совет должен указать направление."
 SAU_events.370.t: "§HEЭкономические изменения§!"
 SAU_events.371.a: "§GРасширить возможности для женщин.§! Экономике нужен каждый талант."
 SAU_events.371.b: "§RПоддерживать традиционные роли.§!Сохранить семейную структуру."
 SAU_events.371.d: "Новое поколение образованных саудовских женщин хочет работать, и экономика нуждается в них. Реформаторы видят нераскрытый талант; §LУлема§! А консервативные семьи видят черту, которую нельзя переступать."
 SAU_events.371.t: "§HЖенщины в рабочей силе§!"
 SAU_events.372.a: "§G Разрешить открытый доступ. §! Королевство не может скрыться от мира."
 SAU_events.372.b: "§RФильтр и цензура.§! Охрана общественной морали."
 SAU_events.372.d: "Спутниковое телевидение и ранний интернет наводняют дома саудовцев иностранными идеями. Либералы приветствуют открытие миру; традиционалисты требуют, чтобы государство фильтровало то, что доходит до верующих."
 SAU_events.372.t: "§HСпутниковые антенны и Интернет§!"
 SAU_events.373.a: "§GОграничьте их авторитет.§!Удержите патрули."
 SAU_events.373.b: "§RПодтвердите свой мандат.§!Добродетель должна соблюдаться."
 SAU_events.373.d: "Он §LКомитет по поощрению добродетели§! Патрулируют улицы, следя за соблюдением дресс-кода, молитв и запретом на смешение полов. Городские жители и предприниматели негодуют по поводу их власти; духовенство считает их хранителями души нации."
 SAU_events.373.t: "§HРелигиозная полиция§!"
 SAU_events.380.a: "Разрешить использование обычных процентных счетов."
 SAU_events.380.b: "Строгий запрет на ростовщичество (риба) - шариат имеет высшую силу."
 SAU_events.380.c: "Сукук — в публичном секторе, прагматический интерес — в частном."
 SAU_events.380.d: "Королевство должно занять позицию по вопросу §Lriba§! — запрету на начисление процентов. §LСветские реформаторы§! утверждают, что традиционные процентные счета привлекают иностранный капитал и модернизируют банковскую систему. §LСовет старших ученых§! требует строгого запрета, соответствующего шариату. §Hгибридная структура§! разрешает выпуск сукуков для общественности, а неформальные проценты — за закрытыми дверями."
 SAU_events.380.t: "§HЗакон о стандартизированных процентах§!"
 SAU_events.381.a: "Современная модель частичного резервирования — рост за счет стабильности."
 SAU_events.381.b: "Только с обеспечением активами — стабильно, но медленнее."
 SAU_events.381.c: "Умеренные резервные требования."
 SAU_events.381.d: "Какой объем кредита могут создать банки с каждого риала депозита? §LЗападная модель§! использует §Hбанковское дело с частичным резервированием§! — Кредитное плечо 10:1, больше кредита, больше роста, больше риска. §LИсламская альтернатива§! требования §Hполное обеспечение активами§! — Каждый кредит, привязанный к реальному капиталу, выдается медленнее, но стабильнее. §Hгибридный§! устанавливает умеренные резервные требования."
 SAU_events.381.t: "§HМандаты частичного резервирования§!"
 SAU_events.382.a: "Мягкое регулирование — разрешение использования производных финансовых инструментов и фьючерсов."
 SAU_events.382.b: "Строгий запрет — никаких гараров, никаких азартных игр."
 SAU_events.382.c: "Только регулируемые производные финансовые инструменты — сбалансированный подход."
 SAU_events.382.d: "Насколько строгим должно быть регулирование в Королевстве? §Lспекуляции, деривативы и фьючерсы§!? §LЗападный взгляд§! рассматривает их как важнейшие инструменты управления рисками. §LИсламский взгляд§! осуждает их как §Lгхарар§! (чрезмерная неопределенность) — немногим лучше азартной игры. А §Hгибридный§! разрешает только регулируемые производные финансовые инструменты."
 SAU_events.382.t: "§HДирективы по борьбе со спекуляциями§!"
 SAU_events.383.a: "Традиционный межбанковский рынок с начислением процентов."
 SAU_events.383.b: "Исламский межбанковский рынок, основанный на принципе мурабаха."
 SAU_events.383.c: "Гибридный режим — оба режима работают независимо друг от друга."
 SAU_events.383.d: "На каких условиях банки предоставляют друг другу кредиты? §LЗападная модель§! использует §Hтрадиционные коридоры процентных ставок§! (В стиле LIBOR). §LИсламская альтернатива§! маршруты межбанковских потоков через §Hмурабаха§! - Финансирование по схеме «затраты плюс прибыль», обеспеченное активами. §Hгибридный§! допускает оба варианта в рамках одного сектора."
 SAU_events.383.t: "§H Межбанковский кредитный код §!"
 SAU_events.384.a: "SAMA — независимый светский регулятор."
 SAU_events.384.b: "SAMA + Совет шариата с обязательным правом вето."
 SAU_events.384.c: "Гибрид — две параллельные структуры."
 SAU_events.384.d: "Кто контролирует банки Королевства? §LЗападная модель§! делает §LСАМА§! (Валютное агентство Саудовской Аравии) §Hнезависимый технократический регулятор§!. The §LИсламская альтернатива§! сочетает SAMA с §HСовет по надзору за соблюдением шариата§! - духовенство, обладающее правом обязательного вето. §Hгибридный§! Это две параллельные структуры."
 SAU_events.384.t: "§HЗакон о банковском контроле§!"
 SAU_events.385.a: "Строгая ортодоксия — никаких компромиссов."
 SAU_events.385.b: "Компания Pragmatic – лидер мирового рынка исламских финансов."
 SAU_events.385.d: "Королевство полностью обязуется §HИсламские финансы§!Но насколько строго? §LСтрогая ортодоксия§! - Без компромиссов, каждая сделка одобрена шариатом - заслуживают безоговорочной поддержки §LУлема§! и стабильность для будущих поколений. §LПрагматичный исламский§! - глобальный центр исламских финансов, привлекающий мусульманский капитал из §LМалайзия§!, §LИндонезия§!, §LИран§!, то §LЗалив§! - жертвует определенной степенью чистоты ради влияния."
 SAU_events.385.t: "§HОплот исламских финансов§!"
 SAU_events.386.a: "Полное англосаксонское звучание - разрешены все инструменты."
 SAU_events.386.b: "Постепенный подход — западная практика с элементами шариата."
 SAU_events.386.d: "Королевство порывает с традициями и §Hсекуляризирует§! его финансовый сектор. §LПолный англосаксонский§! В этом пути используются все западные инструменты. §Hпроизводные§!, §Hоблигации§!, §Hмаржинальная торговля§! - привлекает максимальный объем иностранного капитала, но вызывает гнев §LУлема§!. The §LПостепенный§! Этот путь сохраняет видимость соблюдения шариата по сравнению с западными практиками — меньше доходов, меньше негативной реакции."
 SAU_events.386.t: "§GСекуляризация финансов§!"
 SAU_events.39.a: "Буря утихла."
 SAU_events.39.d: "Саудовская Аравия и коалиционные военные самолеты нанесли удары по целям на территории контролируемого хуситами Йемена в ходе масштабной воздушной кампании. Эр-Рияд заявил о своем намерении восстановить признанное правительство и подавить поддерживаемое Ираном движение. Ближний Восток затаил дыхание."
 SAU_events.39.t: "Операция «Решительный шторм» начинается."
 SAU_events.390.a: "Одобрить продажу Эр-Рияду"
 SAU_events.390.b: "Отклонить запрос"
 SAU_events.390.d: "Королевство Саудовская Аравия официально запросило закупку истребителя F-15 Strike Eagle — нашего лучшего экспортного истребителя. Эр-Рияд является ключевым союзником в Персидском заливе и крупным покупателем вооружений. Одобрим ли мы продажу?"
 SAU_events.390.t: "Запрос Саудовской Аравии: истребитель F-15 Strike Eagle"
 SAU_events.391.a: "Отличные новости."
 SAU_events.391.d: "Соединенные Штаты согласились продать Королевству истребители F-15 Strike Eagle. Сделка завершена — Королевские ВВС Саудовской Аравии вскоре будут летать на лучших американских самолетах."
 SAU_events.391.t: "Вашингтон одобрил сделку по F-15."
 SAU_events.392.a: "Неудача."
 SAU_events.392.d: "В настоящее время Соединенные Штаты отказались продавать истребители F-15. Возможно, мы возобновим наш запрос через некоторое время."
 SAU_events.392.t: "Вашингтон приходит в упадок"
 SAU_events.393.a: "Одобрить экспорт"
 SAU_events.393.b: "Отклонить запрос"
 SAU_events.393.d: "Саудовская Аравия запросила истребитель Eurofighter Typhoon в рамках программы «Аль-Салам». Должна ли Германия, как партнер консорциума, одобрить экспорт в Эр-Рияд?"
 SAU_events.393.t: "Запрос Саудовской Аравии: истребитель Eurofighter Typhoon"
 SAU_events.394.a: "Отличные новости."
 SAU_events.394.d: "Консорциум договорился об экспорте истребителя Eurofighter Typhoon в Королевство. Теперь программа «Аль-Салам» может быть продолжена."
 SAU_events.394.t: "Соглашение по проекту Typhoon одобрено."
 SAU_events.395.a: "Неудача."
 SAU_events.395.d: "Европейцы пока отказались экспортировать самолет Typhoon. Возможно, мы попробуем позже."
 SAU_events.395.t: "Сделка по проекту «Тайфун» отклонена."
 SAU_events.396.a: "Одобрить продажу Эр-Рияду"
 SAU_events.396.b: "Отклонить запрос"
 SAU_events.396.d: "Королевство Саудовская Аравия желает расширить программу «Аль-Ямама» и приобрести модернизированный самолет Tornado GR4. Эр-Рияд на протяжении десятилетий является лояльным клиентом британской промышленности. Одобрим ли мы эту продажу?"
 SAU_events.396.t: "Запрос Саудовской Аравии: Tornado GR4"
 SAU_events.397.a: "Отличные новости."
 SAU_events.397.d: "Соединенное Королевство согласилось поставить Королевству самолеты Tornado GR4 в рамках расширенного соглашения Al Yamamah. Наши ударные эскадрильи станут предметом зависти всего Персидского залива."
 SAU_events.397.t: "Лондон одобрил соглашение по борьбе с торнадо."
 SAU_events.398.a: "Неудача."
 SAU_events.398.d: "Соединенное Королевство в настоящее время отказалось расширять соглашение по проекту Tornado. Мы можем возобновить наш запрос через некоторое время."
 SAU_events.398.t: "Лондон приходит в упадок"
 SAU_events.399.a: "Одобрить экспорт"
 SAU_events.399.b: "Отклонить запрос"
 SAU_events.399.d: "Саудовская Аравия запросила Panavia Tornado IDS — надёжный многонациональный ударный самолёт. Должна ли Италия, как партнёр консорциума, одобрить экспорт в Эр-Рияд?"
 SAU_events.399.t: "Запрос Саудовской Аравии: самолет Panavia Tornado"
 SAU_events.4.a: "Отличные новости."
 SAU_events.4.d: "[FROM.GetNameDefCap] принял наше предложение. Теперь соглашение может быть реализовано."
 SAU_events.4.t: "[FROM.GetNameDefCap] принимает предложение"
 SAU_events.40.a: "Сдерживание: изолировать и задушить режим."
 SAU_events.40.b: "Осторожная разрядка: снизьте температуру, по крайней мере, на данный момент."
 SAU_events.40.c: "Военное положение: мы нанесем удар раньше, чем он."
 SAU_events.40.d: "Саддам по-прежнему правит в Багдаде, и память о Кувейте и Хафджи висит над Персидским заливом. Королевству необходимо решить, как поступить с этим опасным соседом, прежде чем он снова решится на рискованные действия."
 SAU_events.40.t: "Тень Саддама"
 SAU_events.400.a: "Отличные новости."
 SAU_events.400.d: "Италия согласилась экспортировать самолет Panavia Tornado IDS в Королевство. Консорциум приветствует появление нового ценного оператора."
 SAU_events.400.t: "Рим одобрил соглашение по торнадо."
 SAU_events.401.a: "Неудача."
 SAU_events.401.d: "Италия пока отказалась экспортировать самолет Tornado. Возможно, мы попробуем позже."
 SAU_events.401.t: "Рим приходит в упадок"
 SAU_events.5.a: "Неудача."
 SAU_events.5.d: "[FROM.GetNameDefCap] отклонил наше предложение. Отношения между нашими странами пострадают."
 SAU_events.5.t: "[FROM.GetNameDefCap] отклоняет предложение"
 SAU_events.56.a: "Провести переговоры в Пекине."
 SAU_events.56.b: "Это не предмет нашего спора."
 SAU_events.56.d: "Саудовская Аравия просит нас выступить посредником между Эр-Риядом и Тегераном. Оба берега Персидского залива продают нам нефть, и их конфликт угрожает каждому танкеру, от которого мы зависим. Проведение переговоров на нашей территории укрепило бы позиции Пекина как незаменимой державы в регионе."
 SAU_events.56.t: "Запрос из Эр-Рияда"
 SAU_events.57.a: "Подпишите соглашение."
 SAU_events.57.b: "Мы не будем садиться с ними за стол переговоров."
 SAU_events.57.d: "Китай приглашает нас в Пекин для подписания соглашения с Саудовской Аравией: восстановление отношений, возобновление работы посольств и прекращение кровопролития через посредников. Саудовцы уже согласились. Теперь очередь за нами."
 SAU_events.57.t: "Приглашение в Пекин"
 SAU_events.58.a: "Новая глава."
 SAU_events.58.d: "Под эгидой Китая Королевство и Исламская Республика подписали соглашение. Посольства возобновят работу, ставленники успокоятся, и страны Персидского залива смогут вздохнуть с облегчением. Соперничество не закончилось, но ножи сложены в ножны."
 SAU_events.58.t: "Пекинское соглашение"
 SAU_events.59.a: "Пусть будет так."
 SAU_events.59.d: "Переговоры провалились, едва начавшись. Соперничество продолжается, и ситуация в Персидском заливе остается опасной."
 SAU_events.59.t: "Медиация терпит неудачу"
 SAU_events.6.a: "Пройдите в коридор."
 SAU_events.6.b: "Отклонить предложение."
 SAU_events.6.d: "Саудовская Аравия предлагает создать Индийско-Ближневосточно-европейский экономический коридор — торговый маршрут, связывающий Индию с Европой через Персидский залив и позволяющий обойти Суэцкий канал."
 SAU_events.6.t: "[SAU.GetFlag] Индийско-Ближневосточно-европейский коридор [RAJ.GetFlag]"
 SAU_events.60.a: "Армия наступает на «Хезболлу»."
 SAU_events.60.b: "Ливан не будет проливать кровь за Эр-Рияд."
 SAU_events.60.d: "Саудовские деньги восстановили нашу армию; саудовские винтовки заполняют её арсеналы. Теперь Эр-Рияд требует цену: выступить против «Хезболлы» и разрушить её государство внутри государства. Армия готова как никогда. Выживет ли Ливан после этой попытки — это уже другой вопрос."
 SAU_events.60.t: "Мандат из Эр-Рияда"
 SAU_events.61.a: "Порядок возвращается на юг."
 SAU_events.61.d: "Ливанские армейские колонны продвигаются на юг, поскольку Бейрут предпринимает шаги по восстановлению государственной власти над южным Ливаном. После десятилетий жизни рядом с государством внутри государства правительство приказало своей восстановленной армии разоружить «Хезболлу» силой. Столицы стран Персидского залива приветствуют это; Тегеран называет это изменой сопротивлению."
 SAU_events.61.t: "Ливанская армия принимает меры против «Хезболлы»."
 SAU_events.63.a: "Доказательства говорят сами за себя."
 SAU_events.63.d: "Саудовская Аравия представила Лиге арабских государств досье, содержащее фрагменты ракет, судовые манифесты и перехваченные сообщения, позволяющие отследить происхождение арсенала хуситов до Ирана. Арабские столицы реагируют с необычайным единством, а опровержения Тегерана находят мало отклика."
 SAU_events.63.t: "Досье разоблачает причастность Ирана к событиям в Йемене."
 SAU_events.64.a: "На улицах царит беспокойство."
 SAU_events.64.d: "От Тегерана до Бейрута толпы людей вышли на улицы против правительств стран «Оси сопротивления». Недовольство протестующих носит локальный характер, но, как отмечают наблюдатели, их финансирование имеет отчетливый характер для стран Персидского залива. Страны «Оси» обвиняют иностранцев; иностранцы всё отрицают."
 SAU_events.64.t: "Протесты охватывают ось сопротивления."
 SAU_events.65.a: "Умма имеет один адрес."
 SAU_events.65.d: "Исламский мир собрался в своем самом священном городе по приглашению Саудовской Аравии, и иранская делегация заняла место среди остальных. Что бы ни решалось за закрытыми дверями, картина безошибочно узнаваема: когда собирается умма, она собирается в Мекке, и Эр-Рияд сидит во главе стола."
 SAU_events.65.t: "Саммит в Мекке"
 SAU_events.67.a: "Рукопожатие в Пекине."
 SAU_events.67.d: "На церемонии, в возможность которой мало кто верил, Саудовская Аравия и Иран подписали в Пекине соглашение о восстановлении дипломатических отношений после многолетней вражды. Посольства вновь откроются, а опосредованные войны утихнут. Китай выступил посредником в этой сделке, и послание Вашингтону недвусмысленно: на Ближнем Востоке появился новый посредник."
 SAU_events.67.t: "Пекинское соглашение"
 SAU_events.68.a: "Выслушайте их."
 SAU_events.68.b: "Обсуждать нечего."
 SAU_events.68.d: "Через посредников в третьей столице Саудовская Аравия спрашивает Израиль, согласится ли он на переговоры о нормализации отношений. Никаких условий пока не озвучено. Вопрос в том, стоит ли прислушиваться к ним."
 SAU_events.68.t: "Спокойный подход из Эр-Рияда"
 SAU_events.69.a: "Прогресс."
 SAU_events.69.d: "Ответ Израиля оказался теплее, чем ожидалось. Ситуация остается стабильной, и переговоры постепенно продвигаются вперед."
 SAU_events.69.t: "Позитивные сигналы из Тель-Авива"
 SAU_events.7.a: "Примите предложение о партнерстве."
 SAU_events.7.b: "Отклоните предложение."
 SAU_events.7.d: "Эр-Рияд предлагает стратегическое инвестиционное партнерство, сосредоточенное на сотрудничестве с Саудовской телекоммуникационной компанией и южнокорейской инфраструктурой. Обе страны получат доступ к рынку друг друга."
 SAU_events.7.t: "[SAU.GetFlag] Саудовско-корейское партнерство [KOR.GetFlag]"
 SAU_events.70.a: "Разочаровывает."
 SAU_events.70.d: "Израиль ответил резко и холодно. Переговоры зашли в тупик, и вместе с этим их эффективность снижается."
 SAU_events.70.t: "Холодный ответ"
 SAU_events.71.a: "Примите границы 1967 года. Государство ради мира."
 SAU_events.71.b: "Строки 1967 года невозможны."
 SAU_events.71.d: "Саудовская Аравия официально предложила Арабскую мирную инициативу: признание, посольства, торговлю и мир со всем арабским миром в обмен на независимое палестинское государство на территории, сформированной в 1967 году. Это крупнейший приз, когда-либо предлагавшийся, и Израиль отказывается от него на протяжении десятилетий."
 SAU_events.71.t: "Арабская мирная инициатива"
 SAU_events.72.a: "Принимайте предложение."
 SAU_events.72.b: "Деньги здесь ни при чём."
 SAU_events.72.d: "Саудовские переговорщики предлагают более привлекательные условия: инвестиционные фонды, соглашение об открытом небе, технологические коридоры и доступ к крупнейшему рынку Персидского залива. Мир с Эр-Риядом принесет такую выгоду, какой не приносил ни один мир до этого."
 SAU_events.72.t: "Богатство Персидского залива"
 SAU_events.73.a: "Мир для государства. История."
 SAU_events.73.d: "Саудовская Аравия и Израиль подписали Эр-Риядские соглашения: полная нормализация отношений в обмен на признание Израилем независимого палестинского государства в границах 1967 года, гарантированная Саудовской Аравией и Иорданией. Арабская мирная инициатива, отвергнутая на протяжении целого поколения, перекроила карту Ближнего Востока за один день."
 SAU_events.73.t: "Эр-Риядские соглашения"
 SAU_events.74.a: "Старые линии возвращаются."
 SAU_events.74.d: "Переговоры между Эр-Риядом и Тель-Авивом завершились без соглашения. Израиль не согласился на создание палестинского государства; Саудовская Аравия не отказалась от своего требования. Самое смелое дипломатическое начинание за целое поколение завершилось резким закрытием двери."
 SAU_events.74.t: "Саудовско-израильские переговоры провалились"
 SAU_events.75.a: "Рискованная ставка века."
 SAU_events.75.d: "Без каких-либо условий, без создания палестинского государства и без предупреждения Саудовская Аравия признала Израиль и установила полноценные отношения. Вашингтон ликует, Тель-Авив ликует, а арабские улицы горят. Хранитель двух священных мечетей пошел на риск века."
 SAU_events.75.t: "Саудовская Аравия признает Израиль."
 SAU_events.76.a: "Момент упущен."
 SAU_events.76.d: "Время переговоров с Израилем истекло. Слишком много вопросов оставалось открытым слишком долго, и момент упущен. Делегации тихо собираются, и старые линии обороны вновь появляются на карте."
 SAU_events.76.t: "Окно закрывается"
 SAU_events.77.a: "Подготовьте соглашения."
 SAU_events.77.d: "Израиль согласился с достаточным количеством наших условий, чтобы сделка стала реальностью. Осталось только подписать соглашение и войти в историю."
 SAU_events.77.t: "Прорыв в переговорах"
 SAU_events.79.a: "Начните переговоры."
 SAU_events.79.b: "Обсуждать нечего."
 SAU_events.79.d: "Через Вашингтон и Амман поступает информация о том, что Саудовская Аравия готова открыто и на самом высоком уровне обсудить нормализацию отношений. Цена будет высока, и за переговорами будет следить весь мир. Но ни одна арабская страна еще никогда не протягивала руку помощи столь широкой стороной."
 SAU_events.79.t: "Увертюра из Эр-Рияда"
 SAU_events.8.a: "Подпишите оборонное соглашение."
 SAU_events.8.b: "Отклонить соглашение."
 SAU_events.8.d: "Саудовская Аравия предлагает Пакистану заключить соглашение о взаимной обороне на фоне роста напряженности на Ближнем Востоке. Соглашение будет включать гарантии и доступ к военным ресурсам для обеих стран."
 SAU_events.8.t: "[SAU.GetFlag] Саудовско-пакистанский оборонный пакт [PAK.GetFlag]"
 SAU_events.80.a: "Немыслимое, запланированное."
 SAU_events.80.d: "Эр-Рияд и Тель-Авив подтвердили это: начались официальные переговоры о нормализации отношений. Делегации уже находятся в воздухе. Каждая канцелярия на Земле пересматривает свои представления о Ближнем Востоке, и каждый противник сделки запускает свой собственный хронометр."
 SAU_events.80.t: "Начались саудовско-израильские переговоры."
 SAU_events.81.a: "Их отказ – это их ответ."
 SAU_events.81.d: "Тель-Авив отказался даже начать переговоры. Предложение обречено на провал, и рука Королевства, протянутая перед всем миром, повисла в воздухе. В этом поколении сделки не будет."
 SAU_events.81.t: "Израиль отказывается от переговоров"
 SAU_events.82.a: "Будущее, построенное из бетона и стекла."
 SAU_events.82.d: "Крайний срок настал, и, вопреки всем прогнозам, Королевство оправдало ожидания. NEOM сверкает на Красном море, Эр-Рияд преобразился, и туристы прибывают туда, где когда-то стояли только нефтяные вышки. Саудовская Аравия обеспечила себе будущее, не зависящее от нефти."
 SAU_events.82.t: "Реализация концепции «Видение 2030»"
 SAU_events.83.a: "Обещания наконец-то исполнились."
 SAU_events.83.d: "На дворе 2030 год, и «Видение будущего» в основном так и не реализовано. Недостроенные башни ржавеют в пустыне, обещанные города стоят пустыми, а сотни миллиардов потраченных средств не приносят результатов. Критики, называвшие это фантазией, празднуют победу, и люди их слушают."
 SAU_events.83.t: "Белые слоны"
 SAU_events.84.a: "Списать это со счетов."
 SAU_events.84.d: "Еще один из флагманских проектов Vision затянулся и остался незавершенным. Подрядчикам выплатили деньги, краны демонтировали, и пресса опубликовала заголовок. Капитал убежал, и сомнения распространились еще дальше."
 SAU_events.84.t: "Проект не уложился в сроки."
 SAU_events.88.a: "Вопрос о преемственности уже поставлен."
 SAU_events.88.d: "Король Фахд бин Абдулазиз ас-Сауд умер. Скончавшись от инсульта десять лет назад, он правил номинально, в то время как его сводный брат Абдулла был регентом, а теперь Абдулла восходит на трон самостоятельно. Однако самому Абдулле уже за восемьдесят, и в меджлисе Дома Саудов принцы уже решают, кто займет его место.\n\n§YНачинается борьба за престолонаследие короля Абдаллы. Ознакомьтесь с решениями наследного принца.§!"
 SAU_events.88.t: "Смерть короля Фахда"
 SAU_events.89.a: "Корона переходит"
 SAU_events.89.d: "Король Абдулла бин Абдулазиз ас-Сауд умер. Десять лет принцы из династии Саудов взвешивали и торговались о том, кто должен сменить его на престоле. Этот вопрос больше нельзя откладывать, и принц, обладающий наибольшим влиянием, будет провозглашен королем.\n\n§YСалман бин Абдулазиз:§! [?SAU_salman_share|0]%\n§YМохаммед бин Найеф:§! [?SAU_mbn_share|0]%\n§YМутаиб бин Абдулла:§! [?SAU_mutaib_share|0]%"
 SAU_events.89.t: "Смерть короля Абдаллы"
 SAU_events.9.a: "Примите предложение о партнерстве."
 SAU_events.9.b: "Отклоните предложение."
 SAU_events.9.d: "Саудовская Аравия предлагает Китаю стратегическое инвестиционное партнерство. Соглашение позволит расширить китайские инфраструктурные проекты и укрепить позиции Пекина в Персидском заливе."
 SAU_events.9.t: "[SAU.GetFlag] Стратегическое партнерство Саудовской Аравии и Китая [CHI.GetFlag]"
 SAU_events.90.a: "Поддержите Корону!"
 SAU_events.90.b: "Упразднить королевство"
 SAU_events.90.d: "Лихорадка, охватившая арабский мир, добралась и до Королевства. Толпы заполняют улицы Восточной провинции и городов Хиджаза, требуя положить конец абсолютной власти. Мутавины колеблются, Национальная гвардия ждет приказов, а Дом Саудов должен решить, ответить ли народу силой или позволить старому порядку пасть."
 SAU_events.90.t: "Арабская весна достигает Королевства"
 SAU_events.91.a: "Закройте сейчас"
 SAU_events.91.b: "Используйте это как рычаг давления"
 SAU_events.91.b.tt: "Решение §YStrait Blockade§! позволяет закрыть пролив в любое удобное для вас время."
 SAU_events.91.d: "Война достигла Персидского залива. Наши ракетные батареи и быстроходные катера стоят в боевой готовности вдоль Ормузского пролива, главной транспортной артерии, через которую проходит пятая часть мировой нефти. Мы можем перекрыть его сейчас и поставить мировую экономику на колени, или же использовать эту угрозу против наших врагов и закрыть его в любой момент по нашему выбору."
 SAU_events.91.t: "Закрыть Ормузский пролив?"
 SAU_events.92.a: "Провозгласить Исламскую Республику"
 SAU_events.92.b: "Сохраним Республику Аравия"
 SAU_events.92.d: "В условиях подъема шиитского движения учредительное собрание должно решить, каким будет государство-республика: исламской республикой, основанной на религиозной власти, или светской Республикой Аравия."
 SAU_events.92.t: "Характер Республики"
 SAU_events.93.a: "Присоединяйтесь к иранской оси сопротивления!"
 SAU_events.93.b: "Создать независимый антиимпериалистический фронт"
 SAU_events.93.d: "Тегеран протягивает руку новой шиитской республике. Сторонникам жесткой линии предстоит сделать выбор: занять место в иранской Оси Сопротивления под опекой Верховного Лидера или создать независимый фронт, не подчиняющийся никакому иностранному капиталу."
 SAU_events.93.t: "Ось сопротивления"
 SAU_events.94.a: "Встаньте спереди"
 SAU_events.94.b: "Отклонить приглашение"
 SAU_events.94.d: "Республика Аравия поднимает знамя, противостоящее Оси Сопротивления, призывая нашу страну порвать с Тегераном и присоединиться к независимому фронту, возглавляемому из Эр-Рияда."
 SAU_events.94.t: "Приглашение из Аравии"
 SAU_events.95.a: "Присоединяйтесь к Арабскому Коминтерну"
 SAU_events.95.b: "Держитесь особняком"
 SAU_events.95.d: "«Красная Аравия» призывает рабочих и революционеров арабского мира объединиться под единым знаменем."
 SAU_events.95.t: "Арабский Коминтерн"
 SAU_events.96.a: "Наступает красный рассвет"
 SAU_events.96.d: "Над Эр-Риядом развевается красный флаг. Дом Саудов свергнут, и провозглашена Аравийская Народная Республика, поклявшаяся распространить революцию по всему арабскому миру."
 SAU_events.96.t: "Народная Республика Аравия"
 SAU_events.97.a: "Так провозглашается"
 SAU_events.97.d: "Учредительное собрание провозгласило Исламскую Республику Аравия, основанную на защите прав юристов и верховенстве веры."
 SAU_events.97.t: "Исламская Республика Аравия"
 SAU_events.98.a: "Опасный разрыв"
 SAU_events.98.d: "Аравия порвала с Тегераном, отвергнув иранскую опеку и возглавив собственный антиимпериалистический фронт. Шиитский мир расколот между двумя соперничающими центрами сопротивления."
 SAU_events.98.t: "Раскол в оси"
 SAU_events.99.a: "Они ответят за это."
 SAU_events.99.d: "Эр-Рияд порвал с Осью и переманил наших союзников. Тегеран должен решить, как ответить на это предательство сопротивления."
 SAU_events.99.t: "Саудовский раскол"
