 USA_infantry_weapons_1: "M14"
 USA_infantry_weapons_1_desc: "Винтовка M14, официально именуемая американской винтовкой калибра 7,62 мм, M14, — это американская автоматическая винтовка, использующая патроны 7,62x51 мм НАТО (.308 дюйма). Она стала стандартной винтовкой армии США в 1959 году, заменив винтовку M1 Garand в армии США к 1961 году."
