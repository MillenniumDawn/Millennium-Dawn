l_braz_por:
 Cascadia_focus: "Cascadia Focus Tree"
 CAS_focus_olympia_rises: "Olympia sobe"
 CAS_focus_olympia_rises_desc: "Com Seattle superdesenvolvida, a capital do estado de Washington se tornará a nova capital nacional. Olympia soa bem de qualquer forma."
 CAS_focus_stabilization_of_washington: "Estabilização de Washington"
 CAS_focus_stabilization_of_washington_desc:0 "Com o estabelecimento da capital federal de nossa nação, podemos agora começar a estabilizar o estado em que ela se encontra. Organizar a infraestrutura e a atividade econômica básica devolverá uma forma de coesão social, o que nos permitirá investir e passar a esforços de integração melhores logo depois."
 CAS_focus_the_new_home: "O Novo Lar"
 CAS_focus_the_new_home_desc:0 "Com a estabilidade econômica... pelo que vale, pelo menos, e com os esforços coesos de nosso povo para formar uma aparência de estrutura social, podemos começar a implantar serviços civis e de emergência em todo o estado de Washington e passar a chamar este canto remanescente do continente de nosso novo lar."
 CAS_focus_our_oregon_trail: "Nossa Trilha do Oregon"
 CAS_focus_our_oregon_trail_desc:0 "Embora nativos e colonos tivessem de viajar até o meio do continente, agora precisamos viajar para o sul para iniciar a reconstrução do território vizinho, o estado do Oregon. Com uma base montada aqui em Washington, devemos conseguir colocá-los em funcionamento em relativamente pouco tempo."
 CAS_focus_another_pacific_gem: "Outra jóia do Pacífico"
 CAS_focus_another_pacific_gem_desc:0 "Com a funcionalidade econômica e social restaurada, podemos começar a conectar e criar serviços civis e de emergência para ligar o estado do Oregon ao nosso ponto de partida. O futuro fica cada vez mais brilhante, ainda que só um pouco."
 CAS_focus_i_dont_know: "Não sei?"
 CAS_focus_i_dont_know_desc: "Não, eu disse Idaho, é claro que não sabíamos das condições do estado. Uma maldita cadeia de montanhas abrange a maior parte do estado. Independentemente disso, podemos começar a reviver coisas como a indústria de mineração e outras atividades econômicas para dar esperança a essas pessoas novamente."
 CAS_focus_mountain_marvel: "Maravilha da Montanha"
 CAS_focus_mountain_marvel_desc:0 "Economia, boa, povo, feliz, situação, boa o bastante. Ótimo. Agora é hora de ligar o estado ao resto da nação; a partir daqui podemos começar a definir exatamente o que faremos em nosso novo lugar no mundo."
 CAS_focus_a_new_beginning: "Um novo começo"
 CAS_focus_a_new_beginning_desc:0 "Com a nação estabilizada, agora devemos olhar para exatamente o que queremos fazer. Nossa posição significa que não estamos de fato em vantagem nem em desvantagem, mas precisaremos agir agora, antes que as coisas no continente voltem a esquentar."
 CAS_ideas_domestic_centric_policy: "Política Centrada no Interior"
 CAS_ideas_domestic_centric_policy_desc: "Nossa nação é jovem, fraca e muito impressionável. Em vez de ser um pontinho na história, precisamos focar verdadeiramente em nós mesmos para garantir nossa estabilidade, crescimento e a capacidade de ganhar o futuro que queremos na vida."
 CAS_ideas_rocky_mountain_resistance: "Resistência das Montanhas Rochosas"
 CAS_ideas_rocky_mountain_resistance_desc:0 "Apesar da unidade que conseguimos criar, a grande divisão que é a cordilheira das Montanhas Rochosas encorajou aqueles que se acham distantes, embora estejam tão próximos. Por isso, a união com Idaho é, na melhor das hipóteses, frágil. Precisamos lidar com isso antes que comece a ferver e cause mais problemas do que podemos suportar."
 CAS_ideas_rocky_mountain_crackdowns: "Repressão às Montanhas Rochosas"
 CAS_ideas_rocky_mountain_crackdowns_desc: "As investigações iniciais correram bem, a criminalidade está diminuindo e o número de membros do grupo RMR está diminuindo lentamente."
 CAS_ideas_rocky_mountain_rescue: "Resgate nas Montanhas Rochosas"
 CAS_ideas_rocky_mountain_rescue_desc: "A adesão ao RMR caiu, a criminalidade está em um nível mais baixo de todos os tempos. A situação está estável e parece mais esperançosa a cada dia. A polícia local está lentamente assumindo mais e mais operações e controle sobre tudo."
 CAS_ideas_cascadian_union: "União Cascadiana"
 CAS_ideas_cascadian_union_desc: "A paz foi restaurada em Idaho, nossa pequena união de estados está mais forte do que nunca. Agora, com as táticas e os membros do RMR completamente resolvidos e dissolvidos, podemos aprender, melhorar e melhorar nossos povos e nossa nação com essas dores de crescimento iniciais que sofremos."
 CAS_decisions_war_time_mobilization_category: "Mobilização em tempo de guerra"
 CAS_decisions_war_time_mobilization_category_desc: "Quando a necessidade surgir, podemos convocar uma legião de voluntários para, pelo menos, preencher as lacunas nas linhas. Pois não sabemos quando a guerra virá, mas sabemos que ela estará sobre nós."
 CAS_war_time_mobilization: "Mobilização da 1ª Onda"
 CAS_war_time_mobilization_desc:0 "O chamado às armas chegou e devemos nos reunir para garantir a defesa de nossos lares. Às armas, rapazes cascadianos!"
 CAS_war_second_wave_defenders: "Defensores da 2ª Onda"
 CAS_war_second_wave_defenders_desc: "O inimigo pressiona para frente, portanto, precisamos recrutar outra onda de defensores. O moral da nação sofrerá, mas precisamos das tropas."
 CAS_war_desperate_defenders: "Defensores Desesperados"
 CAS_war_desperate_defenders_desc: "As coisas estão ficando sombrias, precisamos de todos os corpos disponíveis, capazes ou não, para segurar a linha. Talvez, só talvez, ainda consigamos vencer isso."
 cascadia_event.1.t: "A Resistência se Levanta"
 cascadia_event.1.d: "Desde os primeiros dias de nossa formação, o estado de Idaho tem nos dado... problemas, para dizer o mínimo. Sendo o mais isolado dos três estados, muitos em Idaho acreditam que seria mais seguro e fácil ser apenas sua própria entidade. Não acreditamos que isso vá a lugar algum, mas com a agitação contínua, muitos estão um pouco temerosos de um conflito potencial tão logo após o caos e a anarquia que vieram antes."
 cascadia_event.1.o1: "Não consigo ter uma pausa"
 cascadia_event.2.t: "Onda de crimes"
 cascadia_event.2.d: "Houve uma onda crescente de crimes assolando o estado de Idaho, enquanto isso pode ser apenas um soluço na restauração de toda a lei e ordem. Há apenas algumas pessoas que estão preocupadas com as implicações que isso pode significar. Embora não haja evidências claras, alguns cidadãos e até mesmo ministros estão pressionando o governo para enviar um esquadrão especial de investigação para proteger a situação."
 cascadia_event.2.o1: "A polícia local pode lidar com isso"
 cascadia_event.2.o2: "Alguém me passa os números da associação RMR"
 cascadia_event.3.t: "Marchas nas Montanhas Rochosas"
 cascadia_event.3.d: "O grupo conhecido como Rocky Mountain Resistance começou a organizar marchas. Embora não haja nada de ilegal nisso, o aumento da adesão ao grupo está causando preocupações em Olympia. Como tal, uma ordem foi emitida pelo governo nacional para começar uma mobilização sutil, pois os medos continuam a aumentar sobre a situação de Idaho."
 cascadia_event.3.o1: "Isso nunca acaba"
 cascadia_event.4.t: "A Ascensão do Homem da Montanha"
 cascadia_event.4.d:0 "A Resistência das Montanhas Rochosas tomou o estado de Idaho e, com isso, o líder do grupo apareceu. Um homem corpulento chamado Robert \"Homem da Montanha\" Johnson. Embora não pareça grande coisa, ele e seu grupo fizeram o que muitos esperavam evitar nestes dias tão jovens da nossa nação. Por isso devemos agir e mobilizar a nação para garantir que isso seja resolvido antes que o mundo decida interferir conosco mais do que provavelmente já tentou."
 cascadia_event.4.o1: "Deus nos ajude"
 cascadia_event.5.t: "Nós marchamos"
 cascadia_event.5.d: "Chegou a hora de resolver isso, marchamos pelas montanhas e assumimos a paz que tanto almejamos."
 cascadia_event.5.o1: "Nós vamos para a guerra!"
 cascadia_event.300.t: "Unidade de Investigação Especial Chega"
 cascadia_event.300.d: "Há algum tempo, depois de muita súplica ao governo em Olympia, o governo enviou uma SIU para o estado de Idaho. As investigações iniciais provaram apenas migalhas. No entanto, com o passar do tempo, ondas de crimes cooptados foram descobertas e logo membros da RMR foram detidos e, felizmente, presos por cometerem os crimes."
 cascadia_event.300.o1: "Bem, isso é alguma coisa, pelo menos"
 cascadia_event.301.t: "A criminalidade diminui"
 cascadia_event.301.d: "À medida que a SIU e a polícia local continuam a lidar com a onda de crimes e mais e mais membros da RMR estão sendo presos por roubo de armas e uma infinidade de outros crimes. Os números de membros estão começando a diminuir à medida que as coisas começam a melhorar para a estabilidade do estado de Idaho, muitos se perguntam quando tudo isso chegará a um fim pacífico."
 cascadia_event.301.o1: "Espero que mais cedo do que tarde"
 cascadia_event.302.t: "Esforços contínuos"
 cascadia_event.302.d: "Com o passar do tempo, a SIU assumiu mais um papel de consultor e assistência, já que a polícia local recebeu mais e mais controle operacional sobre a situação. O crime continua a diminuir e as filiações à RMR atingiram o menor número de todos os tempos. Há rumores de que seu líder, conhecido simplesmente como \"Mountain Man\", está programado para fazer um discurso nos próximos dias. Isso ocorre enquanto a liderança na SIU está debatendo se finalmente é hora de deixar o estado, já que a lei e a ordem parecem estar quase restauradas."
 cascadia_event.302.o1: "Demorou um pouco, mas valeu a pena"
 cascadia_event.303.t: "Paz restaurada"
 cascadia_event.303.d:0 "Hoje cedo o líder da RMR anunciou a dissolução oficial do grupo. Muitos membros ficaram indignados, mas tão desanimados que simplesmente voltaram para casa. As autoridades locais afirmam que o crime está no nível mais baixo de todos os tempos e a estabilidade foi restaurada no estado de Idaho. Agora podemos começar a avançar juntos como uma só nação."
 cascadia_event.303.o1: "Finalmente podemos respirar novamente"
 CAS_focus_preparing_for_elections: "Preparando-se para as eleições"
 CAS_focus_preparing_for_elections_desc:0 "Com a nação em condições boas o bastante para organizar partidos políticos e designar áreas de votação, e tendo lidado com a RMR em Idaho, estamos prontos para nossas primeiras eleições nacionais oficiais. O maior problema é que, no momento, parecemos de algum modo mimados com tantas opções. Mas poderia ser pior."
 CAS_focus_setting_the_stage: "Preparando o cenário"
 CAS_focus_setting_the_stage_desc: "Enquanto o povo de nossa nação encontra sua voz entre os partidos políticos emergentes que se formam em todo o país, devemos preparar e estabelecer a infraestrutura e as capacidades necessárias para que a nação realize as eleições para as quais todos estão se preparando."
 CAS_focus_western_politics: "Partidos Políticos Ocidentais"
 CAS_focus_western_politics_desc: "Na preparação e conclusão das nossas primeiras eleições nacionais, parece que o eleitorado tem sido cada vez mais cativado por partidos e movimentos políticos mais orientados para ideias, ideais e princípios ocidentais. Assim, cria-se o cenário não só para o partido vencedor iniciar a sua celebração da vitória, mas também para que novos partidos surjam e tentem, no mínimo, abocanhar uma fatia do bolo político."
 CAS_focus_consumers_party_victory: "Vitória do Partido dos Consumidores"
 CAS_focus_consumers_party_victory_desc: "A apuração dos votos terminou e o Partido dos Consumidores da Cascádia saiu vitorioso, agora com foco nas necessidades do consumidor e também nas necessidades das empresas. É certo que nossa nação conseguirá se reerguer economicamente antes de qualquer outro país do continente."
 CAS_focus_tax_business_act: "Lei de Negócios Tributários"
 CAS_focus_tax_business_act_desc:0 "A TBA, ou Lei de Tributar Empresas, Não Consumidores, como alguns a têm chamado, é uma reforma tributária que cobra mais impostos das empresas e do lado produtor de riqueza da economia, em vez do lado consumidor. A lógica é que, embora em princípio seja mais difícil abrir empresas, com mais dinheiro disponível os consumidores poderão gastar mais livremente e poupar até para abrir seus próprios negócios. Um prejuízo de curto prazo em troca de ganho de longo prazo e investimento futuro."
 CAS_focus_economic_education_act: "Lei de Educação Econômica"
 CAS_focus_economic_education_act_desc: "A Lei de Educação Econômica é um projeto de lei de investimento e reforma da educação geral para melhor investir e capacitar nossos jovens, ensinando-lhes e compreendendo a economia e os conceitos básicos de economia em seu cotidiano. A expectativa é que desenvolvam habilidades de gestão financeira, aprendam a equilibrar um orçamento e outras competências que lhes serão úteis no futuro."
 CAS_focus_young_founders_program:0 "Programa Jovens Fundadores"
 CAS_focus_young_founders_program_desc:0 "O YFP é um programa dedicado a ajudar jovens e aspirantes a líderes empresariais a de fato ter o capital para criar e abrir seu próprio negócio. Eles devem entregar a papelada e detalhar o esboço básico do tipo de negócio que pretendem ter, onde pretendem instalá-lo e a concorrência que enfrentarão. Em suma, trata-se de dar o impulso inicial e criar a base sólida para o setor de pequenas e médias empresas, o que permitirá que o tempo e a sorte as levem adiante ou as mantenham estáveis."
 CAS_focus_general_economics_plan:0 "Plano Econômico Geral"
 CAS_focus_general_economics_plan_desc:0 "Para colocar a nação em funcionamento da forma mais constante e equilibrada possível, precisamos investir de maneira abrangente em cada estado e em suas necessidades gerais, além de entender suas respectivas especialidades. Para isso, investiremos em pelo menos um setor econômico dedicado para cada estado."
 CAS_focus_retooling_regulations:0 "Reformulação das Regulamentações"
 CAS_focus_retooling_regulations_desc:0 "As reformas regulatórias sobre a possibilidade de expandir e zonear novas áreas industriais e comerciais precisam mudar, assim como o entendimento das regras sobre a abertura propriamente dita desses novos empreendimentos. Algumas das regras mais antigas são tão tediosas, sem fazer nada de bom ou ruim, que atrasam todo o processo. Precisamos corrigir isso já se quisermos chegar a algum lugar."
 CAS_focus_national_defense_act:0 "Lei de Defesa Nacional"
 CAS_focus_national_defense_act_desc:0 "A Lei de Defesa Nacional é uma militarização preventiva de nossa indústria para garantir, no mínimo, a independência de nossa nação como um todo."
 CAS_focus_energy_security_act:0 "Lei de Segurança Energética"
 CAS_focus_energy_security_act_desc:0 "A ESA é uma legislação para investir melhor em educação, pesquisa e desenvolvimento, além de meios de melhorar a segurança energética como um todo. Isso nos dará mais independência econômica de nações estrangeiras e nos permitirá levar um pouco mais a quaisquer mesas de negociação no futuro."
 CAS_focus_cascade_care_program:0 "Programa Cascade Care"
 CAS_focus_cascade_care_program_desc:0 "O Cascade Care é um plano federal opcional para o qual todo cidadão contribuirá, como um início suave rumo a um sistema de saúde mais universal. Isso dará aos cidadãos a opção quando e se necessário, mas, com todos contribuindo, o financiamento direto e a receita gerada por esse imposto irão para a criação e o custeio de instalações e equipes de saúde pública em geral, fazendo com que o público seja mais bem cuidado, qualquer que seja sua escolha."
 CAS_focus_cascadian_securities:0 "Programa de Seguridade Cascadiano"
 CAS_focus_cascadian_securities_desc:0 "O CSP é essencialmente o programa nacional de previdência social, mas com uma abordagem diferente da maioria das nações. O CSP conta com uma série de instalações semelhantes a bancos para coletar e guardar a poupança de cada contribuinte. Isso permite, essencialmente, a versão federal de um plano 401k sem passar por uma empresa ou negócio específico. Já será criada uma legislação para proteger esses fundos do uso federal, a menos que haja consentimento expresso e assinado dos contribuintes afetados."
 CAS_focus_new_conservative_victory:0 "Nova Vitória Conservadora"
 CAS_focus_new_conservative_victory_desc:0 "Com a eleição encerrada, o NCP conquistou a vitória; agora cabe aos conservadores da nação manter a firmeza e traçar um rumo para a melhoria e a coesão social."
 CAS_focus_traditional_taxations:0 "Tributações Tradicionais"
 CAS_focus_traditional_taxations_desc:0 "O NCP deseja \"desinchar\" o código tributário, simplificando as normas ao reduzir os diferentes métodos de tributação e voltando a métodos e meios mais tradicionais de obter receita da nação e de seus componentes."
 CAS_focus_manufacturing_investments:0 "Investimentos na Manufatura"
 CAS_focus_manufacturing_investments_desc:0 "Devemos buscar aumentar nossa capacidade de manufatura se quisermos não apenas atender às necessidades internas, mas também entrar em mercados estrangeiros e acordos comerciais."
 CAS_focus_tech_investments:0 "Investimentos em Tecnologia"
 CAS_focus_tech_investments_desc:0 "Embora a função principal seja ampliar nosso setor de tecnologia, em geral este plano de investimento pretende aumentar nossos serviços e a capacidade do setor de \"escritórios\" em geral, para ajudar a diversificar ainda mais nossa composição econômica."
 CAS_focus_food_securities_act:0 "Lei de Segurança Alimentar"
 CAS_focus_food_securities_act_desc:0 "A lei de segurança alimentar é um plano dedicado de pesquisa e investimento para desenvolver nossa segurança alimentar interna. Esperamos que isso apoie mais necessidades internas e nos permita explorar métodos experimentais futuros, como a agricultura vertical e afins."
 CAS_focus_automaton_research_budget:0 "Orçamento de Pesquisa em Autômatos"
 CAS_focus_automaton_research_budget_desc:0 "Investimentos em pesquisa e orçamento para o avanço da automação, da IA e de tipos básicos de autômatos nos permitirão produzir mais em menos tempo e com menos espaço, à medida que aumentamos a eficiência geral e o tamanho da força de trabalho disponível para as tarefas mais repetitivas, nas quais a maioria não teria interesse."
 CAS_focus_increasing_social_funding:0 "Aumento do Financiamento Social"
 CAS_focus_increasing_social_funding_desc:0 "O básico do bem-estar social é uma expectativa moldada pelos primeiros Estados de bem-estar do Império Alemão e de outras nações que o popularizaram durante o século XIX como forma de combater a agitação socialista. Mas, como nação, devemos cuidar de nosso povo quando as coisas simplesmente não vão bem. Todo mundo tem um dia ruim, e devemos garantir que o dia ruim de alguém não seja o primeiro dia de um criminoso."
 CAS_focus_infrastructure_projects:0 "Projetos de Infraestrutura"
 CAS_focus_infrastructure_projects_desc:0 "Aumentos gerais em nossa capacidade de construção permitirão mais desenvolvimento no futuro. Considerando que não temos muita terra para trabalhar, precisamos realmente entender e focar em como aproveitar mais com menos."
 CAS_focus_better_healthcare_options:0 "Melhores Opções de Saúde"
 CAS_focus_better_healthcare_options_desc:0 "Ajustar as regulamentações e investir melhor na infraestrutura de saúde como um todo permite que a população tenha mais opções para obter o melhor atendimento possível. Assim, embora possamos oferecer uma opção governamental, devemos preparar o terreno para opções privadas também."
 CAS_focus_seeking_trade_initiatives:0 "Busca de Iniciativas Comerciais"
 CAS_focus_seeking_trade_initiatives_desc:0 "Precisamos olhar além de nosso próprio solo se quisermos realmente chegar a algum lugar no mundo. Embora nossas opções sejam limitadas, podemos começar com pequenas negociações comerciais para afirmar nosso lugar, por menor que seja, neste mundo."
 CAS_focus_liberal_victory:0 "Uma Vitória Liberal"
 CAS_focus_liberal_victory_desc:0 "Os votos foram depositados e o Partido Liberal da Cascádia venceu a eleição. É essa noção que nos permite agora seguir em frente, rumo a um caminho novo, livre, igual e verdadeiro de movimento social e prosperidade econômica."
 CAS_focus_reformed_regulations:0 "Regulamentações Reformadas"
 CAS_focus_reformed_regulations_desc:0 "Nossa capacidade de desenvolvimento depende inteiramente de nossa capacidade de regular e entender os processos que nos permitem nos desenvolver, para começar. Assim, devemos reformá-los para que sejam mais enxutos e estejam de acordo com os padrões e expectativas modernos."
 CAS_focus_education_standards_act:0 "Lei de Padrões Educacionais"
 CAS_focus_education_standards_act_desc:0 "A ESA, ou Lei de Padrões Educacionais, é uma proposta orçamentária para investir melhor e elevar os padrões de qualidade e as habilidades que nossos estudantes e educadores podem ter ao passar pelo sistema educacional e fazer parte dele como um todo."
 CAS_focus_job_fair_programs:0 "Programas de Feiras de Emprego"
 CAS_focus_job_fair_programs_desc:0 "A segurança no emprego é sempre a principal prioridade de quem tem responsabilidades financeiras. Com esse conhecimento, montamos feiras de emprego e iniciativas para garantir o emprego de nossos cidadãos e o desenvolvimento contínuo de nossa economia."
 CAS_focus_office_sector_development:0 "Desenvolvimento do Setor de Escritórios"
 CAS_focus_office_sector_development_desc:0 "Nossa nação é pequena, acho que todos podem concordar com isso; por isso devemos olhar para negócios que geram mais riqueza, como serviços e indústrias de tecnologia, ou simplesmente o setor de escritórios como um todo. Se conseguirmos extrair deles toda a riqueza que podem gerar, poderemos prover nosso povo com o que ele precisa e, potencialmente, financiar nossa rede de defesa contra ameaças em potencial. Acho difícil acreditar que este continente permanecerá quieto para sempre."
 CAS_focus_food_supplies_act:0 "Lei de Suprimentos Alimentares"
 CAS_focus_food_supplies_act_desc:0 "A mecanização de nosso aparato alimentar e a garantia das cadeias de suprimento de nossas necessidades alimentares internas permitirão o desenvolvimento de uma sociedade mais estável e coesa, enquanto olhamos para o futuro que esperamos que esteja além de nossas fronteiras, se possível."
 CAS_focus_basics_in_defense:0 "Fundamentos da Defesa"
 CAS_focus_basics_in_defense_desc:0 "Para garantir a segurança de nossa nação, precisamos ter algum tipo de indústria de defesa. A Resistência das Montanhas Rochosas já foi um susto e tanto, mas, se a Califórnia, ou se os supostos federalistas avançarem para o oeste, Deus sabe o que seria de nós. Portanto, precisamos de algum tipo de indústria militar para começar a estocar armas e munições para qualquer cenário possível."
 CAS_focus_community_outreach_programs:0 "Programas de Aproximação Comunitária"
 CAS_focus_community_outreach_programs_desc:0 "Desenvolver COPs eficientes e propícios nos permite garantir a estabilidade social que muitos desejam. A polícia tem uma responsabilidade enorme e, por isso, não só deve ser respeitada como também cuidada pelas pessoas a quem serve, e vice-versa. As comunidades e os povos que ela serve devem ter o mesmo respeito e perspectiva; assim há benefício e compreensão mútuos de por que cada parte é essencial para a coesão e para a capacidade de manter a lei e a ordem em nossa nação."
 CAS_focus_bettercare_act:0 "Lei de Melhor Atendimento"
 CAS_focus_bettercare_act_desc:0 "A BCA é um pacote de financiamento para melhorar a qualidade da saúde que nossos cidadãos podem receber em instituições públicas, aumentando o salário de enfermeiros, médicos e equipe de apoio, além da aquisição de equipamentos e recursos necessários para essas instituições."
 CAS_focus_mutual_trade_initiatives:0 "Iniciativas Comerciais Mútuas"
 CAS_focus_mutual_trade_initiatives_desc:0 "A capacidade de suprir à nossa nação aquilo que não conseguimos produzir significa que devemos olhar para o exterior. Portanto, devemos estabelecer que as negociações comerciais sejam o mais mútuas possível, para garantir a independência interna e manter o equilíbrio entre dependência externa e segurança interna."
 CAS_focus_victory_for_progress:0 "Uma Vitória pelo Progresso"
 CAS_focus_victory_for_progress_desc:0 "Com a eleição vencida em nome de nosso partido, agora temos os meios para começar a avançar. Para criar um caminho de mobilidade social e econômica e de igualdade de oportunidades."
 CAS_focus_common_sense_labor_reforms:0 "Reformas Trabalhistas de Bom Senso"
 CAS_focus_common_sense_labor_reforms_desc:0 "Com melhores métodos de negociação coletiva regulada entre sindicatos e empregadores, podemos estabelecer um padrão de negociação e expectativa para que nossos trabalhadores sejam genuinamente bem cuidados. Assim, podemos dar pequenos subsídios a empresas cuja força de trabalho seja majoritariamente sindicalizada, para garantir equilíbrio e maior abertura na aceitação dos sindicatos como um todo."
 CAS_focus_a_more_progressive_tax_code:0 "Um Código Tributário Mais Progressivo"
 CAS_focus_a_more_progressive_tax_code_desc:0 "Para garantir que nossos cidadãos tenham os meios de sustentar a si mesmos e suas famílias, devemos ajustar as alíquotas, os tipos de impostos e os programas de assistência que ajudam a criar o piso sobre o qual as pessoas possam se firmar."
 CAS_focus_budgeting_for_innovation:0 "Orçamento para a Inovação"
 CAS_focus_budgeting_for_innovation_desc:0 "Para nos mantermos à frente, devemos olhar para nossas capacidades científicas e, portanto, investir no futuro. Pelo bem de nossa nação, de seu povo e da pouca terra que temos para utilizar."
 CAS_focus_selective_mechanization:0 "Mecanização Seletiva"
 CAS_focus_selective_mechanization_desc:0 "Modernização não significa que temos de fazer tudo de uma vez. Com esse conhecimento e entendimento, podemos selecionar indústrias e setores econômicos-chave para modernizar e mecanizar, permitindo fazer mais com menos. Isso permite que mais trabalhadores migrem para setores industriais, de escritório ou outros, enquanto buscamos ampliar o apoio e o aparato de transição para que nossos cidadãos possam se mover livremente e da forma mais suave possível neste mundo econômico em constante mudança em que vivemos."
 CAS_focus_investing_in_the_future:0 "Investindo no Futuro"
 CAS_focus_investing_in_the_future_desc:0 "Nossa infraestrutura é a base de nossa capacidade de funcionar, em termos de movimento econômico e social como um todo. Portanto, vamos investir e nos preparar para o presente e o futuro do desenvolvimento de nossa nação, para que possamos estabelecer um padrão de engenhosidade para as gerações vindouras."
 CAS_focus_farming_investments:0 "Investimentos na Agricultura"
 CAS_focus_farming_investments_desc:0 "A capacidade de alimentar nossa população e garantir a rede de abastecimento alimentar de nossos trabalhadores é fundamental para a verdadeira coesão social. Quando esse requisito primário de sobrevivência é prejudicado de alguma forma, é aí que os problemas reais começam, e é isso que vamos evitar. Ao montar fábricas de embalagem e processamento de alimentos e investir em formas experimentais de agricultura, como os métodos de cultivo vertical, podemos aproveitar mais o crescimento das lavouras usando menos terra no geral."
 CAS_focus_rocky_mountain_mining:0 "Mineração das Montanhas Rochosas"
 CAS_focus_rocky_mountain_mining_desc:0 "A RMM era uma empresa apoiada por muitos membros do antigo grupo da resistência das montanhas rochosas nos primeiros dias de nossa estabilização. No entanto, parece que essa empresa virou a página, pois tem solicitado ao governo concessões de terras e algum financiamento para expansão. Ficamos felizes em investir nessa iniciativa, pois a expansão interna de nossos recursos disponíveis nos dará vantagem na segurança interna e nas negociações comerciais com o exterior como um todo."
 CAS_focus_industrial_expansion:0 "Expansões Industriais"
 CAS_focus_industrial_expansion_desc:0 "Para ajudar nossos cidadãos a encontrar empregos, primeiro precisamos criá-los. Assim, investiremos em empregos nos setores industrial e comercial para garantir um mercado básico e universal, de modo que nosso povo consiga um emprego o quanto antes. Eles poderão então servir de trampolim, junto com nossos programas anteriores, para incentivar o crescimento futuro e a diversidade econômica no geral."
 CAS_focus_energy_demands_act:0 "Lei de Demandas Energéticas"
 CAS_focus_energy_demands_act_desc:0 "Nossas necessidades de energia devem ser uma de nossas principais prioridades e, com isso, esta legislação instituirá investimentos em educação, infraestrutura e instalações para ampliar nossa capacidade de produção interna. Em consequência, os investimentos em educação e/ou pesquisa serão usados para reduzir melhor a perda de energia no transporte e no armazenamento, o que deve diminuir as taxas gerais de consumo."
 CAS_focus_eastern_politics:0 "Partidos Políticos Orientais"
 CAS_focus_eastern_politics_desc:0 "Na antessala e na conclusão da eleição, valores, ideias e princípios orientais e do extremo oriente tomaram a população votante. Com isso, damos uma breve respirada e esperamos para ver exatamente com o que vamos acabar no devido tempo."
 CAS_focus_red_mountain_victory:0 "Vitória da Montanha Vermelha"
 CAS_focus_red_mountain_victory_desc:0 "A vitória é nossa e, para o povo de nossa nação, abrimos um novo capítulo. Não nos iludiremos mais com as promessas de riqueza infinita que é o capitalismo. Agora criaremos um sistema para todos, para cada um segundo suas necessidades, e não apenas seus desejos."
 CAS_focus_wealth_tax_act:0 "Lei do Imposto sobre a Riqueza"
 CAS_focus_wealth_tax_act_desc:0 "Com reformas tributárias, planejamos orientar o sistema de impostos para tributar a própria riqueza, em vez de apenas o indivíduo. Claro que os indivíduos podem adquirir riqueza de várias maneiras, mas as empresas e a criação central de riqueza são totalmente separadas dos salários individuais. Assim, podemos manter os impostos mais baixos para os indivíduos e, quem sabe lá na frente, talvez nem precisemos de um imposto de renda propriamente dito."
 CAS_focus_cooperative_ownership_act:0 "Lei da Propriedade Cooperativa"
 CAS_focus_cooperative_ownership_act_desc:0 "A propriedade cooperativa é o método em que todos que compõem uma empresa têm uma parte e/ou \"participação\" nela. Assim, as decisões são tomadas por representantes das partes administrativa e operária da empresa, para garantir coesão e ação mútua em relação ao crescimento e às operações que afetam todos os envolvidos. Faremos com que todas as novas empresas sejam obrigadas a adotar essa organização; as empresas já existentes terão uma janela de cinco anos para fazer a transição para a nova organização ou correrão o risco de ser forçadas a vender ou ser compradas pelo governo, por meio de um acordo forçado, porém consensual."
 CAS_focus_industrial_efficiency_act:0 "Lei de Eficiência Industrial"
 CAS_focus_industrial_efficiency_act_desc:0 "Os pessimistas dirão que não temos tanta terra, que devemos preservar um equilíbrio entre natureza e civilização. Pois essa gente não entende a vontade e a determinação humanas. Investiremos e pesquisaremos novas formas de melhorar nossa capacidade industrial: novas máquinas, novos métodos de produção, tudo novo onde for possível. Pelo bem de nosso povo e do futuro que ele merece, prevaleceremos, apesar dos pessimistas e catastrofistas por aí."
 CAS_focus_industrial_revolutionary_program:0 "Programa Revolucionário Industrial"
 CAS_focus_industrial_revolutionary_program_desc:0 "Nossa nação se preparou e trabalhou para alcançar um novo nível e padrão de industrialização. Agora temos os meios de investir em todo o país sob o IRP e estabelecer novos patamares para nosso poder econômico. Mais cedo ou mais tarde criaremos um futuro para nosso povo e seremos reconhecidos no mundo todo; mesmo que seja uma pequena parte, ainda é uma parte na qual desempenhamos um papel."
 CAS_focus_northwestern_mining_incorporated: "Northwestern Mining Incorporated"
 CAS_focus_northwestern_mining_incorporated_desc:0 "A NWM, ou Northwestern Mining, é uma mineradora criada pelo Estado que cuida de operações de mineração estrategicamente necessárias aos mercados internos da nação. Assim, enquanto as mineradoras normais se concentram em sua especialidade, a NWM se concentrará em adquirir e criar zonas de mineração estratégicas para poder expandir nossa capacidade geral de extração de recursos à medida que a demanda interna cresce com o tempo."
 CAS_focus_cascadian_research_institute:0 "Instituto de Pesquisa Cascadiano"
 CAS_focus_cascadian_research_institute_desc:0 "O CRI é uma instalação dedicada de pesquisa e desenvolvimento para ajudar a inovar em áreas como consumo de energia e métodos de produção, além de campos gerais que possam fazer crescer e tornar mais eficientes nossa nação, seu povo e a economia que criamos."
 CAS_focus_red_mountaineers_budget:0 "Orçamento dos Montanheses Vermelhos"
 CAS_focus_red_mountaineers_budget_desc:0 "A defesa militar de nossa nação é uma medida bastante importante e, com isso, devemos nos concentrar em nossa força nacional: as montanhas. Reservaremos um orçamento dedicado aos Montanheses Vermelhos, uma unidade especializada que ajudará a criar um novo corpo de treinamento, de modo que nosso exército, com o tempo, avance e aprenda mais formas de usar o terreno numa era moderna de guerra em que homens podem ser mortos a aparentes dezenas de quilômetros da linha de frente."
 CAS_focus_better_social_budgeting:0 "Melhor Orçamento Social"
 CAS_focus_better_social_budgeting_desc:0 "Precisamos garantir o cuidado com nosso povo e, para isso, precisamos aumentar o orçamento destinado a nossos programas sociais. Embora isso nos prejudique no curto prazo, esse autoinvestimento nos permitirá elevar melhor o piso da qualidade de vida de nossos cidadãos, de modo que possamos estabelecer um novo padrão e preparar programas futuros para reintegrá-los à força de trabalho o quanto antes."
 CAS_focus_energy_diversity_act:0 "Lei de Diversidade Energética"
 CAS_focus_energy_diversity_act_desc:0 "Para garantir que nossas necessidades de energia sejam atendidas, devemos assegurar a diversidade de nossos métodos de geração de energia. No geral, isso nos permitirá investir não só em diferentes métodos de produção de energia, mas também em pesquisas sobre formas mais eficientes de obter mais energia de equipamentos e infraestrutura menores ou do mesmo tamanho."
 CAS_focus_the_peoples_victory:0 "A Vitória do Povo"
 CAS_focus_the_peoples_victory_desc:0 "Os resultados saíram, o povo falou e tomou a vitória para si. Com isso podemos começar a trazer uma sociedade mais harmoniosa, igualitária e livre, que o povo possa controlar, e não apenas a autoridade central e seu domínio pela violência."
 CAS_focus_community_kitchens:0 "Cozinhas Comunitárias"
 CAS_focus_community_kitchens_desc:0 "Nosso objetivo principal é alcançar um \"Estado\" quase inexistente. Devemos, portanto, dar mais poder ao povo por meio de programas e iniciativas que garantam que a origem do dinheiro permaneça onde deve estar desde o início. O povo."
 CAS_focus_modern_homestead_act:0 "Lei Moderna de Colonização Rural"
 CAS_focus_modern_homestead_act_desc:0 "Derrubar as barreiras do zoneamento significa que o povo pode decidir onde e o que quer. A única coisa é um limite máximo para o tamanho da terra, de modo a permitir que todos tenham uma parte do que nossa grande nação tem a oferecer."
 CAS_focus_tradesmen_society_act:0 "Lei da Sociedade dos Ofícios"
 CAS_focus_tradesmen_society_act_desc:0 "Para empoderar o indivíduo, devemos dar a ele as ferramentas e os meios para se sustentar, encontrar e criar por conta própria. Portanto, ele terá acesso ao máximo possível de conhecimento e de pessoas capazes com esse conhecimento. Marcenaria, ferraria, soldagem, qualquer ofício que ajude um lar é um que ajuda a si mesmo."
 CAS_focus_the_peoples_mountain_state:0 "O Estado Montanhoso do Povo"
 CAS_focus_the_peoples_mountain_state_desc:0 "O estado de Idaho deve ser devolvido ao povo; daremos a ele os meios para construir o que é seu, para fazer uma vida nova e melhor uns para os outros."
 CAS_focus_the_peoples_pacific_gem_state:0 "O Estado Joia do Pacífico do Povo"
 CAS_focus_the_peoples_pacific_gem_state_desc:0 "O estado de Washington receberá agora os meios para que seu povo prospere, viva e construa as vidas que deseja."
 CAS_focus_the_peoples_state_of_trails:0 "O Estado das Trilhas do Povo"
 CAS_focus_the_peoples_state_of_trails_desc:0 "A Trilha do Oregon foi uma trilha de desespero, esperança e horror. Mas agora podemos fazer deste destino final um novo sonho, um novo amanhã e, acima de tudo, um futuro novo e melhor para o seu povo."
 CAS_focus_educations_medicine_act:0 "Lei Educação e Medicina"
 CAS_focus_educations_medicine_act_desc:0 "Duas coisas são importantes para crescer, não só a si mesmo, mas aos que estão ao redor: conhecimento e boa saúde. Com isso, planejamos dar mais acesso e capacidade para que o povo cuide de si e de seus amigos, vizinhos e familiares. Faremos isso aumentando os recursos disponíveis em métodos médicos, produtivos e de uso geral, no que diz respeito às práticas padrão. As inovações e necessidades próprias serão atendidas e elevadas conforme o que o povo precisar e/ou quiser na vida."
 CAS_focus_healthy_people_act:0 "Lei do Povo Saudável"
 CAS_focus_healthy_people_act_desc:0 "O cuidado e o bem-estar do povo são da maior importância, pois pessoas saudáveis vivem vidas longas. Essas vidas podem ser usadas para fazer qualquer coisa a que se dediquem de coração, e devemos garantir que tenham os meios e a capacidade de fazê-lo."
 CAS_focus_unity_act:0 "A Lei da Unidade"
 CAS_focus_unity_act_desc:0 "Derrubadas as barreiras sobre como abrir negócios e construir casas, derrubadas as barreiras sobre como alguém usa a própria terra. Derrubamos as barreiras do próprio Estado e declaramos um caminho unido adiante. Como povos destas terras, eles serão os verdadeiros decisores do que será seu futuro."
 CAS_focus_victory_for_tradition:0 "Vitória pela Tradição"
 CAS_focus_victory_for_tradition_desc:0 "Com os votos depositados e contados, a nação falou e acredita na tradição. Embora nossa nação seja jovem, isso é ainda melhor para gravar em pedra o que nossas tradições podem e vão ser, para estabelecer uma medida de coesão e orgulho social e nacional que será transmitida por gerações."
 CAS_focus_establishing_national_social_traditions:0 "Estabelecimento de Tradições Sociais Nacionais"
 CAS_focus_establishing_national_social_traditions_desc:0 "A criação de nossas tradições sociais nacionais estabelecerá o padrão e o precedente de como nossa sociedade funciona e avança com o passar do tempo. Nossa prioridade é a família; no entanto, a flexibilidade da família é de suma importância, pois um lar estável, independentemente de seu funcionamento, ainda é uma vida estável e melhor para os filhos dessas famílias. Assim, a igualdade de oportunidades das mulheres no trabalho e o conteúdo do caráter, em vez do viés do julgamento e de suposições passadas, serão codificados para evitar decisões injustas e precipitadas tomadas em nome de quem só quer buscar uma carreira e traçar o próprio caminho na vida, mas seria impedido por essas influências negativas se fosse deixado à própria sorte."
 CAS_focus_creating_economic_innovations:0 "Criação de Inovações Econômicas"
 CAS_focus_creating_economic_innovations_desc:0 "Criar o espaço e o ambiente em que todos os nossos cidadãos possam ser futuros empresários nos permite relaxar mais, pois o povo terá mais mobilidade e flexibilidade na vida. Esse novo ambiente permitirá inovações pessoais pelo simples bem da criatividade, desafiando o status quo dos mercados e criando novos futuros para todos que queiram participar, sejam investidores, trabalhadores ou consumidores."
 CAS_focus_creating_educational_excellence:0 "Criação da Excelência Educacional"
 CAS_focus_creating_educational_excellence_desc:0 "Para que nosso povo seja criativo, inovador e trabalhador, devemos ser capazes de ensiná-lo e abrir seus olhos para os mundos de conhecimento e informação que existem no mundo. Pois, sem compreensão e conhecimento, não há senso de progresso e, sem senso de progresso, você realmente está chegando a algum lugar na vida, ou está apenas satisfeito com o que tem."
 CAS_focus_growth_initiative_phase_one:0 "Iniciativa de Crescimento, Fase Um"
 CAS_focus_growth_initiative_phase_one_desc:0 "O GIP, ou Plano de Iniciativa de Crescimento, é um plano geral de desenvolvimento econômico para garantir que a economia de nossa nação esteja à altura das demandas de nossa população. Esta fase inicial começará com alguns desenvolvimentos agrícolas organizados e investimentos limitados na manufatura."
 CAS_focus_growth_initiative_phase_two:0 "Iniciativa de Crescimento, Fase Dois"
 CAS_focus_growth_initiative_phase_two_desc:0 "A fase dois do GIP está focada em expandir o acesso aos recursos minerais do estado de Idaho e usá-lo para fortalecer o setor de escritórios do Oregon. Damos um novo passo rumo ao crescimento econômico, à unidade e ao avanço como um todo."
 CAS_focus_growth_initiative_phase_three:0 "Iniciativa de Crescimento, Fase Três"
 CAS_focus_growth_initiative_phase_three_desc:0 "Os planos finais relacionados ao GIP giram em torno de completar o pacote econômico total, que são as indústrias navais, bem como a fabricação interna de armas. Esses desenvolvimentos ajudarão a impulsionar mais crescimento econômico, além de limitadas formas pelas quais podemos iniciar o desenvolvimento da defesa nacional."
 CAS_focus_subtle_militarization:0 "Militarização Sutil"
 CAS_focus_subtle_militarization_desc:0 "Se quisermos defender nossa nação cada vez maior e próspera, o que inclui a própria cidadania, então devemos investir em uma indústria de armamentos interna para permitir o suprimento de nossas forças militares permanentes. Pode não ser muito, mas é o suficiente para pôr a bola em movimento."
 CAS_focus_naval_yards:0 "Investimentos nos Estaleiros Navais"
 CAS_focus_naval_yards_desc:0 "Nossa força naval tem tamanho razoável e foi herdada dos dias da república. No entanto, ter esses navios não significa nada se não pudermos repará-los e mantê-los quando a necessidade surgir. Assim, garantiremos ter ao menos algo que ajude na manutenção de nossas forças navais como um todo."
 CAS_focus_family_tax_breaks:0 "Isenções Fiscais para Famílias"
 CAS_focus_family_tax_breaks_desc:0 "Para garantir o desenvolvimento pacífico das famílias em toda a nossa nação, devemos incentivar não apenas a ideia de cuidar de uma criança, mas também tranquilizar os novos pais que possam estar preocupados com os encargos e problemas financeiros que isso pode lhes causar. Esse peso significa que eles teriam menos probabilidade de ter filhos, pois não gostariam de criá-los em tal ambiente, que poderia ter uma série de influências negativas ou simplesmente \"más escolhas\". Assim, serão criados alívios fiscais dedicados para ajudar e orientar os pais ao longo da vida dos filhos e da criação que terão."
 CAS_focus_greater_cascadian_victory:0 "Grande Vitória Cascadiana"
 CAS_focus_greater_cascadian_victory_desc:0 "Verdadeiros patriotas cascadianos foram às urnas e fizeram suas vozes serem ouvidas. Com esta vitória, preparamos o terreno para garantir um futuro maior para nossa jovem nação e seus povos gentis. Pela Cascádia!"
 CAS_focus_militaristic_primacy:0 "Primazia Militarista"
 CAS_focus_militaristic_primacy_desc:0 "Para assegurar nossos objetivos como nação, devemos traçar um caminho para criar a certeza que nos permitirá alcançá-los. A priorização militar será a chave que abre a porta para uma nova e Maior Cascádia."
 CAS_focus_economic_militarism:0 "Militarismo Econômico"
 CAS_focus_economic_militarism_desc:0 "Nossa nação deve ser preparada para a eventualidade de nossas futuras conquistas. Para isso, vamos orientar preventivamente a economia para se posicionar para a produção militar. Rodadas limitadas de racionamento e afins condicionarão a população a compreender as possíveis dificuldades e sacrifícios necessários para concluir nossas ambições nacionais."
 CAS_focus_creating_our_own_complex:0 "Criando Nosso Próprio Complexo"
 CAS_focus_creating_our_own_complex_desc:0 "As forças armadas precisam de armas e equipamentos, e nós as forneceremos criando nosso próprio complexo militar-industrial. Prepararemos o terreno para atender às necessidades de nossas forças armadas e traçar um caminho para a vitória."
 CAS_focus_manufacturing_navies:0 "Fabricação de Marinhas"
 CAS_focus_manufacturing_navies_desc:0 "Com o desenvolvimento limitado de nossa economia civil, este é um apoio para garantir nosso poderio industrial naval. Nossos navios, sejam mercantes ou de guerra, singrarão os sete mares e garantirão nossa independência interna diante de demônios estrangeiros e lobos em pele de cordeiro."
 CAS_focus_improving_national_logistics:0 "Melhoria da Logística Nacional"
 CAS_focus_improving_national_logistics_desc:0 "Nossa nação é muito difícil de atravessar, o que nos ajuda e incentiva o inimigo a cair em nossas garras no campo de batalha. Nossos esforços para ampliar e racionalizar nossa rede logística como nação são fundamentais tanto para a capacidade ofensiva quanto para a defensiva. Com essas melhorias, podemos buscar meios de afunilar a visão do inimigo, fazendo-o escolher caminhos determinados e forçando-o a padrões mais previsíveis. Claro que sempre devemos esperar o inesperado, mas, se conseguirmos tornar o inesperado mais esperável, por que não."
 CAS_focus_olympia_soars:0 "Olímpia Decola"
 CAS_focus_olympia_soars_desc:0 "O centro e o núcleo nervoso de nossa nação é o estado de Washington. Devemos consolidar isso expandindo nossos recursos e levando-os à região da capital. Indiretamente, desenvolvemos a economia de toda a nossa nação; pela doutrina principal, consolidamos a fortaleza de Olímpia, que criaremos para garantir a soberania de nossa nação."
 CAS_focus_fortress_cascadia:0 "Fortaleza Cascádia"
 CAS_focus_fortress_cascadia_desc:0 "Nossa defesa nacional é o objetivo primário número um; com isso, garantiremos que o projeto Fortaleza Cascádia seja um sucesso e alcance seu pleno desenvolvimento, para assegurar nossa sobrevivência contínua, mesmo que sejamos empurrados de volta às próprias margens de nossas terras costeiras."
 CAS_focus_coastal_command_project:0 "Projeto Comando Costeiro"
 CAS_focus_coastal_command_project_desc:0 "Como já asseguramos a terra, agora devemos assegurar os mares. É com essa noção que criamos o Grupo de Comando Costeiro, ou CCG, que preparará o terreno para garantir a segurança e as defesas costeiras, evitando desembarques pela porta dos fundos caso queiram contornar nossas impenetráveis redes de defesa."
 CAS_focus_solidifying_the_network_into_society:0 "Consolidando a Rede na Sociedade"
 CAS_focus_solidifying_the_network_into_society_desc:0 "Ter redes defensivas maciças e em camadas é um grande testemunho de nossa determinação nacional... no entanto. A realidade é que tais imposições podem causar um desgaste passivo na vontade civil e na força mental, à medida que o tempo passa. Portanto, desenvolveremos ao redor delas e faremos da rede defensiva mais uma engrenagem que ajuda a movimentar a própria máquina da sociedade em nossa nação."
 CAS_focus_home_grown_politics:0 "Política Genuinamente Local"
 CAS_focus_home_grown_politics_desc:0 "Com a aceleração da eleição e os eleitores se consolidando em partidos e movimentos políticos, uma iniciativa de base mais local tomou conta da população, voltando-se mais para os problemas cascadianos e para o que significa ter ideias e ideais cascadianos. Essa série de movimentos sem influência externa já se firmou à medida que as coisas seguem até a conclusão eleitoral."
 CAS_focus_victory_for_a_greater_cascadia:0 "Vitória por uma Grande Cascádia"
 CAS_focus_victory_for_a_greater_cascadia_desc:0 "Patriotas da Cascádia fizeram suas vozes serem ouvidas enquanto garantíamos a vitória para nossa grande e nobre nação. Agora temos os meios para pavimentar um caminho de grandeza para nosso povo, nossos ideais e a própria identidade nacional."
 CAS_focus_national_security_act:0 "Lei de Segurança Nacional"
 CAS_focus_national_security_act_desc:0 "Nossa segurança nacional é o principal veículo de proteção de nossos cidadãos; seja o exército ou a polícia, garantiremos a segurança de nossos cidadãos a qualquer custo."
 CAS_focus_innovation_station_act:0 "Lei da Estação de Inovação"
 CAS_focus_innovation_station_act_desc:0 "A Estação de Inovação é um complexo de pesquisa dedicado a uma infinidade de projetos de P&D. Eles vão de projetos de defesa a métodos de produção de energia e aproveitamento e extração de recursos. No fim, esse complexo ampliará nossas capacidades futuras tanto para defender nossa nação quanto para buscar as glórias que almejamos."
 CAS_focus_all_roads_lead_to_olympia:0 "Todos os Caminhos Levam a Olímpia"
 CAS_focus_all_roads_lead_to_olympia_desc:0 "Assim como todas as estradas da Europa levam a Roma, deixaremos todas as estradas do novo mundo levarem a Olímpia. Pois é Olímpia que será o farol central e brilhante que acende as chamas da liberdade e da paixão que nossos cidadãos desejam. Empregos, comida, lares e vidas serão feitos em Olímpia, e garantiremos que isso seja um fato certo para todos verem."
 CAS_focus_interstate_revitalization_act:0 "Lei de Revitalização Interestadual"
 CAS_focus_interstate_revitalization_act_desc:0 "A lei de revitalização permitirá que nossa nação seja mais interconectada e que as cadeias de suprimento se tornem mais eficientes. Isso se deve à maior eficácia no transporte de bens, materiais e pessoas, o que deve gerar um impulso líquido aos esforços gerais de produção."
 CAS_focus_domestic_armaments_industry:0 "Indústria Interna de Armamentos"
 CAS_focus_domestic_armaments_industry_desc:0 "Para poder defender nossa nação, precisamos realmente ser capazes de abastecer nossas forças armadas. Portanto, o estabelecimento de uma indústria de armas interna é fundamental para atingir esse objetivo."
 CAS_focus_domestic_naval_yards:0 "Estaleiros Navais Internos"
 CAS_focus_domestic_naval_yards_desc:0 "Nossas águas serão defendidas, temos o poder naval para isso; no entanto, manter tal força exige homens, materiais e instalações. Portanto, garantiremos a criação e a alocação dessas coisas para assegurar a defesa de nossas águas e de nossas costas."
 CAS_focus_army_expansion_act:0 "Lei de Expansão do Exército"
 CAS_focus_army_expansion_act_desc:0 "Nosso exército é a principal defesa terrestre de que dispomos para garantir que a defesa e os objetivos de nossa nação sejam alcançados. Devemos nos concentrar em expandi-lo se quisermos considerar seriamente objetivos além de nossas fronteiras no futuro."
 CAS_focus_naval_expansion_act:0 "Lei de Expansão Naval"
 CAS_focus_naval_expansion_act_desc:0 "A NEA é uma expansão orçamentária dedicada a ampliar as capacidades e os recursos destinados a nossas forças navais. Os investimentos serão usados para desenvolver e aprimorar as capacidades existentes, além de melhorar o treinamento e as instalações, elevando a qualidade geral de nossa marinha permanente."
 CAS_focus_militarization_of_the_budget:0 "Militarização do Orçamento"
 CAS_focus_militarization_of_the_budget_desc:0 "Ajustando o orçamento e os métodos de arrecadação de impostos, podemos estabelecer um superávit orçamentário militar dedicado para destinar às forças armadas. Esse orçamento é usado para aumentar o efetivo permanente em todos os ramos, além de trabalhar em melhorias em cada um deles."
 CAS_focus_in_the_business_of_victory:0 "No Negócio da Vitória"
 CAS_focus_in_the_business_of_victory_desc:0 "Os eleitores falaram e os negócios venceram a eleição. E, como diz nosso slogan, os Negócios de Boise São os Seus Negócios. Esse slogan se confirmará à medida que nos concentrarmos na economia e garantirmos que nossa nação e seu povo sejam bem servidos. Revitalizando não o Sonho Americano de outrora, mas a Clareza Cascadiana, que é o direito de um cascadiano de desfrutar da própria vida, tanto nas grandes quanto nas pequenas coisas."
 CAS_focus_reforming_tax_breaks:0 "Reforma das Isenções Fiscais"
 CAS_focus_reforming_tax_breaks_desc:0 "Reformar as isenções fiscais para incentivar mais o autoinvestimento e o crescimento dos negócios, em vez de simplesmente embolsar o excesso de ganhos de capital, nos permitirá criar um ambiente empresarial fluido e competitivo que estimule investimentos locais e, com sorte, estrangeiros no futuro."
 CAS_focus_refining_regulatory_blocks:0 "Refinamento dos Entraves Regulatórios"
 CAS_focus_refining_regulatory_blocks_desc:0 "Mudar e adaptar os bloqueios regulatórios em obstáculos mais suaves e contornáveis permitirá um ambiente mais coeso e proativo para criar novos empreendimentos e afins. Com isso em mente, poderemos colher mais benefícios, e a única coisa em que precisaríamos investir seriamente seria a segurança dos locais e afins, por meio das forças policiais locais e assim por diante."
 CAS_focus_oregon_petrochemicals:0 "Petroquímicas do Oregon"
 CAS_focus_oregon_petrochemicals_desc:0 "Investimentos na expansão e no aprimoramento da indústria petroquímica do Oregon nos permitirão garantir uma ampla gama de necessidades energéticas e internas em termos de plásticos e dos produtos que tal setor econômico pode fornecer."
 CAS_focus_aspen_construction_contracting:0 "Contratação da Aspen Construction"
 CAS_focus_aspen_construction_contracting_desc:0 "A Aspen Construction é uma construtora de destaque no estado de Idaho. Devemos cair nas graças deles e contratá-los para construir novos empreendimentos; em troca, podemos dar-lhes acesso a terras para extração mineral e afrouxar mais algumas regulamentações para tornar todo esse processo mais suave."
 CAS_focus_capital_computing_corporation: "Capital Computing Corporation"
 CAS_focus_capital_computing_corporation_desc:0 "A CCC é uma empresa emergente voltada à informática e à tecnologia que se destacou recentemente por trazer empregos diversos e conhecimento técnico a esses campos, tanto econômicos quanto acadêmicos. Devemos investir em sua expansão e ajudar apoiando usinas metalúrgicas locais para baratear os materiais de construção dos arranha-céus e tornar as necessidades de desenvolvimento futuro mais sustentáveis a longo prazo."
 CAS_focus_communicate_cascadia: "Communicate Cascadia LLC"
 CAS_focus_communicate_cascadia_desc:0 "A Communicate Cascadia era uma empresa de telemarketing e internet que começou na região do estado de Washington. Com o passar do tempo e a crescente necessidade de internet e serviços de celular e/ou telefone nos desenvolvimentos locais, a empresa cresceu até alcançar porte nacional, beneficiando todos em nossa nação. Ajudá-la a expandir e levar mais cobertura e serviços ao nosso povo tornará a vida dos cidadãos comuns ainda melhor do que antes."
 CAS_focus_policing_expansions_act:0 "Lei de Expansão do Policiamento"
 CAS_focus_policing_expansions_act_desc:0 "A Lei de Expansão do Policiamento, ou Lei Polícia Plus, como alguns a chamam, é um projeto orçamentário e de reforma que amplia as agências policiais estaduais e locais e concede alguns poderes bastante limitados a agências de segurança. Isso, somado a um pacote de gastos com esforços de P&D, nos permitirá testar essas novas iniciativas de policiamento e sua eficácia, caso também criemos zonas de alto valor para atrair exploradores nacionais e estrangeiros a agir contra elas."
 CAS_focus_rocky_mountain_flatlands_act:0 "Lei das Planícies das Montanhas Rochosas"
 CAS_focus_rocky_mountain_flatlands_act_desc:0 "As necessidades nacionais de novos recursos são de interesse vital para a segurança nacional. Para evitar nossa dependência futura de fontes estrangeiras como principal fornecimento desses recursos, permitiremos mais expansões de mineração dedicadas, inclusive nas próprias Montanhas Rochosas. Embora as Montanhas Rochosas sejam, de fato, um marco natural marcante, nossas necessidades nacionais pesam mais que o clamor pseudomoralista pela \"verdadeira preservação\" dessas coisas que ocupam acres e mais acres de terra."
 CAS_focus_future_investments_act:0 "Lei de Investimentos Futuros"
 CAS_focus_future_investments_act_desc:0 "Um negócio feliz é um negócio lucrativo; trabalhadores felizes fazem um negócio feliz, que dá bons lucros. Devemos investir no bem-estar e nos cuidados médicos de nossos trabalhadores, presentes e futuros, se quisermos garantir uma base econômica sólida e crescente para nossa nação."
 CAS_focus_liberty_victorious:0 "Liberdade Vitoriosa"
 CAS_focus_liberty_victorious_desc:0 "O povo depositou seus votos e a liberdade e a autossuficiência levaram a vitória. Agora moldaremos o governo nacional como uma figura paterna adequada, que orienta e ajuda quando necessário, mas permite que seus filhos, isto é, os cidadãos de nossa nação, façam e cuidem de suas próprias necessidades, pois sabem do que precisam."
 CAS_focus_yellow_ribbon_care:0 "Cuidado Fita Amarela"
 CAS_focus_yellow_ribbon_care_desc:0 "Garantir o bem-estar de nossos cidadãos é importante e, para isso, devemos estimular inovações médicas e fazer com que as pessoas queiram cuidar umas das outras. Isenções fiscais sutis e maiores investimentos pessoais em instalações e pesquisas médicas permitirão que as gerações futuras possam realmente zelar umas pelas outras."
 CAS_focus_self_sustainment_act:0 "A Lei da Autossustentação"
 CAS_focus_self_sustainment_act_desc:0 "As pessoas precisam aprender não só a cuidar dos outros, mas também a cuidar de si mesmas. Para isso, devemos incentivar qualquer meio que permita a alguém ganhar a vida de maneira legal e sustentável. Assim, investimentos educacionais para dar mais conhecimento e contato às gerações atuais e futuras terão um papel fundamental nisso."
 CAS_focus_retirement_earnings_act:0 "Lei de Rendimentos da Aposentadoria"
 CAS_focus_retirement_earnings_act_desc:0 "Quando você trabalha a vida toda, tem direito a finalmente descansar no crepúsculo da vida. Assim, as reformas no aparato da Previdência Social a tratarão mais como um 401k em nível nacional. Claro que você pode ter o seu plano ligado ao emprego, mas seus impostos da Previdência agora serão colocados em uma espécie de conta bancária separada, por meio da rede tributária associada às suas declarações de imposto. Assim, a cada ano que declarar, você poderá ver o que colocou e o valor acumulado ao longo dos anos."
 CAS_focus_reindustrialization_act:0 "Lei de Reindustrialização"
 CAS_focus_reindustrialization_act_desc:0 "As indústrias pesada e leve deixaram em grande parte nossa região do continente, a maior parte indo para outras partes ou para o exterior. Agora, porém, temos a capacidade de trazer de volta e formar alguma noção de industrialização para nossa bela nação. Investimentos nacionais por meio de feiras de emprego e empreendimentos públicos e privados nos permitirão, a nós e à nossa nação, voltar ao trabalho."
 CAS_focus_securing_tomorrows_meal:0 "Garantindo a Refeição de Amanhã"
 CAS_focus_securing_tomorrows_meal_desc:0 "O amanhã nunca nos é realmente prometido e, por isso, pelo menos uma coisa nos será prometida: a próxima refeição. A segurança alimentar interna é uma métrica nova, mas importante, para uma sociedade estável e, por isso, investiremos em empreendimentos agrícolas e em mais formas de criar um excedente alimentar sincero."
 CAS_focus_limiting_central_banking_authority:0 "Limitação da Autoridade do Banco Central"
 CAS_focus_limiting_central_banking_authority_desc:0 "O sistema de banco central, embora não seja inerentemente ruim, pode estar aberto a uma das formas mais sutis de abuso: o controle das taxas de juros ligadas a funções nacionais como empréstimos, hipotecas e afins. Retiraremos sua autoridade direta sobre isso e reregularemos o processo, delegando-o a filiais e instituições mais locais, com cláusulas sobre um teto razoável e os termos de alteração dentro de um contrato que se possa ter com essas instituições."
 CAS_focus_reducing_tax_burdens:0 "Redução dos Encargos Fiscais"
 CAS_focus_reducing_tax_burdens_desc:0 "Cortar as formas mais minuciosas do código tributário permite que as pessoas poupem melhor seu dinheiro e tenham mais do próprio dinheiro para fazer o que quiserem. Essa segurança fiscal permitirá que quem tem condições poupe e invista de uma forma ou de outra. O objetivo geral é estimular os gastos e investimentos internos para, essencialmente, repor o que cortamos. Embora possa não ser muito, será mais do que suficiente para garantir a confiança do público em nossa capacidade."
 CAS_focus_energy_highways:0 "Rodovias de Energia"
 CAS_focus_energy_highways_desc:0 "O terreno de nossa nação é um dos mais difíceis de desenvolver, com todas as cordilheiras espalhadas por ele. Portanto, devemos criar rodovias de energia para tornar a segurança energética e a conectividade nacional em geral mais eficientes e, em princípio, mais seguras. Elas obviamente se tornariam alvos inimigos, mas, tendo essa expectativa em mente, podemos usá-las como a principal isca se a situação apertar."
 CAS_focus_expanded_r_and_d_investments:0 "Investimentos Ampliados em P&D"
 CAS_focus_expanded_r_and_d_investments_desc:0 "Inovação e pesquisa são o caminho para se manter à frente e resolver problemas reais de maneiras significativas. Investiremos mais em empreendimentos públicos e privados para aumentar nossa capacidade geral de pesquisa e desenvolvimento, na esperança de gerar um impacto líquido positivo de longo prazo em vários aspectos de nossa nação e de nossa sociedade como um todo."
 CAS_focus_the_robin_flies_to_victory:0 "O Tordo Voa para a Vitória"
 CAS_focus_the_robin_flies_to_victory_desc:0 "Justiça, igualdade, equidade. Esses são os três pilares sobre a fundação de nossa base econômica, com os quais nos esforçaremos para ajudar a todos. Pois esta é uma nação para todos, e não uma nação para um só."
 CAS_focus_pro_labor_regulations:0 "Regulamentações Pró-Trabalhador"
 CAS_focus_pro_labor_regulations_desc:0 "O operário e os ramos modernos da categoria dos trabalhadores comuns são a espinha dorsal de nosso funcionamento econômico. Devemos estar ao lado deles e garantir que sejam devidamente atendidos e realmente cuidados. Afinal, trabalhadores felizes são trabalhadores mais produtivos e eficazes."
 CAS_focus_agrarian_influences:0 "Influências Agrárias"
 CAS_focus_agrarian_influences_desc:0 "Um suprimento estável de alimentos é um princípio central para garantir a estabilidade social e a coesão entre trabalhadores e empregadores. Implementaremos uma forma limitada de investimentos pró-agrários para manter esse equilíbrio e, talvez, usar parte do excedente para investir em biocombustíveis, se possível. Não é muito, mas dizem que é trabalho honesto."
 CAS_focus_olympian_technical_institute:0 "Instituto Técnico Olímpico"
 CAS_focus_olympian_technical_institute_desc:0 "O OTI é uma instalação de ensino e P&D patrocinada pelo governo federal para ajudar o interesse nacional em termos de inovação e estimular mais oportunidades de educação para as gerações futuras."
 CAS_focus_soldiering_workers_act:0 "A Lei dos Trabalhadores Soldados"
 CAS_focus_soldiering_workers_act_desc:0 "Todo trabalhador um soldado: essas palavras encarnam a ideia de que quem luta pode trabalhar e quem trabalha pode lutar. A intercambialidade dessas vidas se baseia no princípio de que ambas defendem a estabilidade da sociedade, uma militarmente e outra economicamente. Instituiremos um programa voluntário de um ano de serviço para dar aos trabalhadores de nossa nação o treinamento para manusear e operar armas de fogo, com as quais possam defender suas famílias, seus lares e nosso próprio modo de vida."
 CAS_focus_streamlining_tax_codes_and_enforcement:0 "Simplificação dos Códigos Tributários e da Fiscalização"
 CAS_focus_streamlining_tax_codes_and_enforcement_desc:0 "A padronização tanto dos códigos tributários quanto da fiscalização permitirá que cidadãos e empresas entendam melhor, se adaptem e façam crescer sua riqueza pessoal ou empresarial e seu valor geral. A esperança é que a facilidade de compreensão e de arrecadação traga mais receita com o tempo e nos permita usar essa nova receita para investir mais em nossos cidadãos e na economia."
 CAS_focus_mineral_rights_expansion:0 "Expansão dos Direitos Minerais"
 CAS_focus_mineral_rights_expansion_desc:0 "A ideia de direitos minerais e a possibilidade de reivindicar terras para a extração de recursos naturais é uma prática bastante comum. Devemos expandir esses direitos para incentivar os cidadãos locais a formar novos empreendimentos e patrociná-los para ampliar a riqueza mineral de nossa nação. Podemos usar isso para aumentar nossa independência econômica enquanto continuamos a nos estender além de nossas fronteiras para o comércio."
 CAS_focus_national_labor_corps:0 "Corpo Nacional de Trabalho"
 CAS_focus_national_labor_corps_desc:0 "O NLC é uma iniciativa governamental para garantir que quem quer um emprego e/ou precisa de um possa ter um. Usando algo semelhante às agências trabalhistas do New Deal, planejamos que os necessitados ajudem a manter e construir infraestrutura e empreendimentos econômicos que garantirão a estabilidade de nossa economia como um todo. Lembre-se: só trabalho e nenhuma diversão pode deixar o Joãozinho um menino sem graça, mas só diversão e nenhum trabalho deixará o Joãozinho um menino pobre."
 CAS_focus_expanding_energy_production_capabilities:0 "Ampliação da Capacidade de Produção de Energia"
 CAS_focus_expanding_energy_production_capabilities_desc:0 "A lei EEPC é um orçamento dedicado a criar novas instalações para gerar energia e levar mais força à rede nacional e às nossas necessidades crescentes como sociedade. Embora seja uma solução de curto prazo, devemos buscar extrair o máximo do que já construímos, devido à nossa escassez de terra."
 CAS_focus_cascadian_family_program:0 "Programa Família Cascadiana"
 CAS_focus_cascadian_family_program_desc:0 "O CFP se dedica a ajudar famílias que esperam filhos e as já constituídas em toda a nossa nação, para garantir que os primeiros anos e o desenvolvimento da juventude de nossa nação não sejam sobrecarregados pelos impactos financeiros e outros da vida. O CFP se esforça para tornar esses anos um pouco mais fáceis para a família como um todo, fornecendo informações úteis e suprimentos limitados e/ou ajuda financeira quando necessário e solicitado. Nem sempre se trata apenas das crianças; às vezes os pais precisam de tanta atenção quanto, ou até mais que, os filhos que trazem ao mundo."
 CAS_focus_nationalist_fever_rises:0 "A Febre Nacionalista Cresce"
 CAS_focus_nationalist_fever_rises_desc:0 "Com o prosseguimento da eleição e o povo começando a expressar suas verdadeiras necessidades e desejos, vemos agora uma tendência rumo a visões e valores mais nacionalistas. Embora alguns moderados e indecisos estejam preocupados, entendemos que o mundo é duro e, talvez, haja algo de verdade em tudo isso."
 CAS_focus_victory_for_strength:0 "Vitória pela Força"
 CAS_focus_victory_for_strength_desc:0 "O povo fala e clama por força, anseia por unidade e, por isso, tomamos as rédeas da vitória e daremos ao povo exatamente o que ele quer."
 CAS_focus_family_promotion_programs:0 "Programas de Promoção da Família"
 CAS_focus_family_promotion_programs_desc:0 "A falha da antiga república foi depender da imigração para fazer crescer a população e, assim, a própria economia. Não repetiremos esse erro. Criando programas de assistência à família, podemos ajudar novas famílias a desfrutar da vida sem os fardos das dificuldades ou do estresse financeiro."
 CAS_focus_automation_developments_act:0 "Lei de Desenvolvimentos em Automação"
 CAS_focus_automation_developments_act_desc:0 "A ADA é um pacote de financiamento e orçamento para desenvolver e ampliar os esforços de automação de nossa nação. Em conjunto com os novos FPPs, precisamos melhorar nossa educação e a produtividade geral para compensar a possível queda de nossa força de trabalho, ao mesmo tempo em que olhamos para o possível aumento de uma força de trabalho futura."
 CAS_focus_national_diversity_act:0 "Lei da Diversidade Nacional"
 CAS_focus_national_diversity_act_desc:0 "A Lei da Diversidade Nacional é um pacote de desenvolvimento econômico que será usado para expandir a base econômica de nossa nação e diversificar o que de fato compõe essa base."
 CAS_focus_energy_investments:0 "Investimentos em Energia"
 CAS_focus_energy_investments_desc:0 "Investimentos nacionais para aumentar nossa capacidade de produção de energia nos permitem expandir tanto nossa população quanto nossa economia em geral."
 CAS_focus_mining_expansion_act:0 "Lei de Expansão da Mineração"
 CAS_focus_mining_expansion_act_desc:0 "Esta legislação será usada para financiar novas técnicas de extração e purificação, a fim de ajudar a ampliar o rendimento de locais de mineração selecionados."
 CAS_focus_military_industrial_investments:0 "Investimentos Industriais Militares"
 CAS_focus_military_industrial_investments_desc:0 "Ao expandir nossa base industrial militar, podemos garantir a independência de nossa nação diante de inimigos estrangeiros que desejam mal a nosso povo."
 CAS_focus_future_leaders_program:0 "Programa Líderes do Futuro"
 CAS_focus_future_leaders_program_desc:0 "Investindo em programas semelhantes aos programas JROTC, podemos expor as gerações futuras ao meio militar, à estrutura e ao respeito próprio pelos próprios atos. Embora possamos usar o programa para ampliar o potencial de preparar as gerações futuras para cargos de liderança na força de trabalho civil, isso também nos ajuda militarmente se a necessidade surgir."
 CAS_focus_young_sailors_program:0 "Programa Jovens Marinheiros"
 CAS_focus_young_sailors_program_desc:0 "O Programa Jovens Marinheiros é semelhante ao FLP, mas se concentra na marinha e/ou no setor naval e de transporte marítimo de forma mais geral. Esperamos dar às gerações futuras aquele espírito naval singelo, porém forte. Entendendo de onde veio o transporte marítimo e por que, ainda hoje, ele é um dos pilares fundamentais não só da segurança nacional, mas também do funcionamento econômico de nossa nação."
 CAS_focus_expanding_military_civilian_joint_programs:0 "Ampliação dos Programas Conjuntos Militares e Civis"
 CAS_focus_expanding_military_civilian_joint_programs_desc:0 "Ao ampliar os programas de empreendimentos conjuntos, podemos nos beneficiar e manter nosso pessoal militar ocupado, ao mesmo tempo em que melhoramos certos aspectos de nossa economia em tempo de paz."
 CAS_focus_the_scarlet_brigade_marches_to_victory:0 "A Brigada Escarlate Marcha para a Vitória"
 CAS_focus_the_scarlet_brigade_marches_to_victory_desc:0 "Orgulho nacional, autodeterminação e respeito próprio diante da interferência estrangeira são os clamores que o povo reivindicou. Com isso, marchamos rumo à vitória e garantiremos nossa suficiência nacional para nossas próprias necessidades, as necessidades de nosso povo e diante da ira e das influências estrangeiras."
 CAS_focus_penal_labor_corps:0 "Corpo de Trabalho Penal"
 CAS_focus_penal_labor_corps_desc:0 "Os ralos da sociedade devem ser postos em uso, ou precisaremos encontrar um jeito de desentupi-los. Assim, estabeleceremos um novo Corpo de Trabalho Penal para ajudar a redimir aqueles que quiseram prejudicar a sociedade. Agora eles poderão consertar e melhorar o que tentaram destruir e corromper."
 CAS_focus_young_cascadians_association:0 "Associação dos Jovens Cascadianos"
 CAS_focus_young_cascadians_association_desc:0 "A YCA é uma liga juvenil destinada a incutir orgulho nacional e senso de dever nas futuras gerações da Cascádia. Essa liga ajudará a dar lições militares e civis de disciplina, liderança e autoestima, não importa o que escolham fazer."
 CAS_focus_cascadian_defense_phase_one:0 "Defesa Cascadiana, Fase Um"
 CAS_focus_cascadian_defense_phase_one_desc:0 "O CDP, ou Plano de Defesa Cascadiano, é uma militarização da nação para se preparar preventivamente contra quaisquer ameaças externas que queiram se impor sobre nossa fatia de paraíso. A fase um é um esforço inicial de industrialização militar para tentar acelerar a produção, de modo que possamos ao menos manter a linha, se necessário."
 CAS_focus_homefront_is_still_a_front:0 "A Frente Interna Ainda é uma Frente"
 CAS_focus_homefront_is_still_a_front_desc:0 "Para poder lutar na linha de frente, é preciso primeiro entender como é lutar na frente interna. Assim, aumentaremos as necessidades industriais internas e investiremos em iniciativas de pesquisa para equipar melhor nossa população civil em caso de uma guerra que pareça ter passado da hora de ir embora."
 CAS_focus_cascadian_defense_phase_two:0 "Defesa Cascadiana, Fase Dois"
 CAS_focus_cascadian_defense_phase_two_desc:0 "A segunda fase do CDP é focar na autarquia estratégica. Certos recursos-chave que temos, e que antes não tínhamos, devemos assegurar e garantir que nossa nação possa se sustentar caso seja bloqueada."
 CAS_focus_cascadian_defense_phase_three:0 "Defesa Cascadiana, Fase Três"
 CAS_focus_cascadian_defense_phase_three_desc:0 "A fase três do CDP é estabelecer um forte suprimento interno de alimentos. Expandiremos nosso setor agrícola organizado e destinaremos mais recursos à pesquisa para melhorar a qualidade e a quantidade de alimentos produzidos em fazendas menores. Pelo menos, se formos bloqueados, duraremos um pouco mais graças à nossa visão de futuro."
 CAS_focus_peace_time_lottery_conscription:0 "Conscrição por Sorteio em Tempo de Paz"
 CAS_focus_peace_time_lottery_conscription_desc:0 "O PTL é um programa nacional de período obrigatório de conscrição para rodiziar aleatoriamente uma certa faixa etária e parte do ano de aniversários, a fim de garantir que nossa população esteja acostumada a um possível serviço militar. Esse período dura apenas de 4 a 6 meses e não se limita estritamente a ensinamentos de combate de infantaria."
 CAS_focus_improving_military_logistical_needs:0 "Melhoria das Necessidades Logísticas Militares"
 CAS_focus_improving_military_logistical_needs_desc:0 "Investindo em infraestrutura logística e em cadeias de suprimento, podemos melhorar a capacidade de sobrevivência e a qualidade gerais de nossas forças militares."
 CAS_focus_the_first_of_many_victories:0 "A Primeira de Muitas Vitórias"
 CAS_focus_the_first_of_many_victories_desc:0 "O povo deseja defender e manter perto seus amigos, famílias e o próprio sustento. Assim, parece que a subfacção política dos militares garantiu uma vitória para o governo nacional. Com essa segurança, podemos agora orientar nossa sociedade e economia para servir não só nosso povo, mas também nossas forças militares, de modo a garantir o auge da defesa nacional."
 CAS_focus_promoting_strategic_mining:0 "Promoção da Mineração Estratégica"
 CAS_focus_promoting_strategic_mining_desc:0 "Com investimentos direcionados, podemos expandir e melhorar a extração mineral de matérias-primas estrategicamente importantes. Nosso objetivo de melhorar nossa posição geral sem depender demais de meios estrangeiros se tornará realidade."
 CAS_focus_national_economics:0 "Economia Nacional"
 CAS_focus_national_economics_desc:0 "Com amplos investimentos em novos desenvolvimentos econômicos, podemos fazer crescer nossa economia nacional e colocar o povo para trabalhar e prover seu próprio sustento. Isso ajudará a iniciar a pequena bola de neve do desenvolvimento geral. À parte, esperamos tirar proveito disso e ter uma base econômica forte o bastante para retribuir mais a quem dá tanto quanto."
 CAS_focus_establishing_defense_industry:0 "Estabelecendo Nossa Indústria de Defesa"
 CAS_focus_establishing_defense_industry_desc:0 "Para garantir a independência de nossa nação diante da interferência estrangeira, devemos assegurar algum tipo de complexo militar-industrial. Assim, iniciaremos um investimento nacional para criar tal coisa."
 CAS_focus_setting_up_mandatory_conscription:0 "Instituição da Conscrição Obrigatória"
 CAS_focus_setting_up_mandatory_conscription_desc:0 "Para preparar preventivamente nossa nação contra qualquer agressão, seja de nossa parte ou da de nossos inimigos, precisamos garantir que nossa mão de obra seja estável e maior do que o esperado. Assim, um período obrigatório de conscrição de seis meses nos permitirá assegurar nossos interesses nacionais em qualquer situação imaginável."
 CAS_focus_automation_conscription_act:0 "Lei de Automação e Conscrição"
 CAS_focus_automation_conscription_act_desc:0 "A legislação ACA é um pacote de gastos para direcionar certas indústrias a serem automatizadas ao máximo e, em troca, a força de trabalho dispensada seria convocada. No entanto, os novos soldados \"conscritos à força\" poderiam procurar posições de reserva, como suprimento, comunicações ou administração, se quisessem."
 CAS_focus_general_military_investments:0 "Investimentos Militares Gerais"
 CAS_focus_general_military_investments_desc:0 "O GMI é um pacote de gastos dedicado a melhorar, em sentido geral, as capacidades de nossas forças armadas. Assim, também serão destinados recursos para melhorar o treinamento recebido pelo estado-maior e pelo corpo de oficiais. Isso permitirá que nossa nação inove e melhore suas forças a longo prazo, além dos ganhos iniciais desses investimentos de curto prazo."
 CAS_focus_army_funding_improvements:0 "Melhorias no Financiamento do Exército"
 CAS_focus_army_funding_improvements_desc:0 "Aumentando nosso financiamento ao exército, podemos melhorar os cursos de treinamento, o que ajudará a aprimorar as habilidades de combate do pessoal de nosso exército."
 CAS_focus_naval_funding:0 "Financiamento Naval"
 CAS_focus_naval_funding_desc:0 "Aumentar nosso financiamento naval dedicado nos permite melhorar sistemas de armas e cursos de treinamento para que nossas embarcações navais aumentem sua capacidade de sobrevivência e seu poder de combate."
 CAS_focus_air_force_investments:0 "Investimentos na Força Aérea"
 CAS_focus_air_force_investments_desc:0 "O financiamento geral da força aérea nos permite melhorar as aeronaves existentes e aprimorar o treinamento de novos pilotos. Em consequência, podemos investir em esforços limitados de P&D para melhorar as medidas de sobrevivência, tanto ofensivas quanto defensivas, como forma de reforçar o poder de combate de nossa força aérea."
 CAS_focus_modern_victory_for_old_ideas:0 "Vitória Moderna para Velhas Ideias"
 CAS_focus_modern_victory_for_old_ideas_desc:0 "A casa sempre vence e, neste caso, é verdade. O movimento monarquista moderno conhecido como Casa de Olímpia garantiu a vitória nas eleições. Prepara-se o terreno para criar uma monarquia eletiva moderna, na qual a organização governamental democrática permanece a mesma, mas os nomes dos cargos são apenas cosmeticamente alterados para se adequar aos antigos títulos feudais. Agora mamãe e papai não estarão mentindo para você sobre virar príncipe ou princesa."
 CAS_focus_modernizing_nobility_act:0 "Lei de Modernização da Nobreza"
 CAS_focus_modernizing_nobility_act_desc:0 "Para estabelecer uma monarquia moderna, primeiro devemos redefinir o que é uma nobreza, pois o sentido tradicional da instituição é, no mínimo, bastante incômodo. Assim, a nobreza cascadiana será um sistema escalonado de títulos conquistáveis. Os principais títulos serão associados aos respectivos cargos eletivos. No entanto, cada estrato social também terá um roteiro de como conquistar seu próprio título de nobreza."
 CAS_focus_reorganizing_traditional_military_ranks:0 "Reorganização das Patentes Militares Tradicionais"
 CAS_focus_reorganizing_traditional_military_ranks_desc:0 "As forças armadas modernas são uma mistura de organizações centradas em unidades grandes ou pequenas. No entanto, e se expandíssemos e reorganizássemos a estrutura de patentes para ter um aumento geral nos tipos de unidade e na escala de tamanho? Isso provavelmente exigirá um aumento no número de suboficiais e de oficiais regulares e, assim, estimulará um recrutamento mais dinâmico para diferentes níveis de liderança."
 CAS_focus_the_new_nation:0 "A Nova Nação"
 CAS_focus_the_new_nation_desc:0 "Uma nova nação e seu povo surgirão das profundezas das cinzas da antiga. Agora somos os Ducados Unidos da Cascádia, somos o povo cascadiano e defenderemos nossos lares, nossas famílias e nosso modo de vida."
 CAS_focus_developing_new_settlements:0 "Desenvolvimento de Novos Assentamentos"
 CAS_focus_developing_new_settlements_desc:0 "Criando novos assentamentos e economias locais, podemos distribuir melhor nossa população, o que nos permitirá ser mais descentralizados como nação caso o inimigo chegue às nossas costas e ao nosso solo."
 CAS_focus_defense_towns:0 "Cidades de Defesa"
 CAS_focus_defense_towns_desc:0 "Mirar assentamentos esparsos ou insignificantes e incentivar empreiteiras de defesa a construir instalações, além de estimular moradores locais ou até outros da região a criar novas cidades e potenciais metrópoles, nos permitirá ter uma logística mais dinâmica. Essas áreas não têm desenvolvimento real e, por isso, levaremos o desenvolvimento a elas. Em outras palavras, nós construiremos e eles virão."
 CAS_focus_cascade_redoubts:0 "Redutos da Cascata"
 CAS_focus_cascade_redoubts_desc:0 "Criar redutos estratégicos nas montanhas nos permitirá estabelecer possíveis linhas de recuo, além de estimular a infraestrutura e o desenvolvimento econômico que ajudarão a liderar essas novas áreas de construção militar."
 CAS_focus_green_mountain_guards:0 "Guardas da Montanha Verde"
 CAS_focus_green_mountain_guards_desc:0 "Uma versão semelhante ao sistema de Guardas Nacionais, mas esses reservistas são mais para quem se aposenta do serviço ativo e ainda quer ser um membro pronto da força. Assim, o ramo GMG é um subramo do corpo de estado-maior geral e pode reunir unidades dos três principais ramos das forças armadas, onde e quando possível."
 CAS_focus_expanding_military_industries:0 "Expandir as Indústrias Militares"
 CAS_focus_expanding_military_industries_desc:0 "Ao expandir nossa base industrial militar, podemos aumentar nossas capacidades defensivas e, se necessário, ofensivas como nação."
 CAS_focus_cascadian_power:0 "Energia Cascadiana"
 CAS_focus_cascadian_power_desc:0 "Por meio de investimentos estratégicos em novas instalações, bem como na logística e nos meios com que encontramos, criamos e usamos nossa energia, podemos ampliar nossa rede energética para melhorar, em geral, tanto a economia quanto a qualidade de vida dos cidadãos."
 CAS_focus_cascadian_economy:0 "A Economia Cascadiana"
 CAS_focus_cascadian_economy_desc:0 "Agora que mais ou menos botamos a cabeça no lugar, podemos começar a reconstruir nossa economia nacional e resolver os grandes problemas que afligem nossa sociedade."
 CAS_focus_strategic_autarky_economy:0 "O Plano Econômico de Autarquia Estratégica"
 CAS_focus_strategic_autarky_economy_desc:0 "O SAEP será uma revitalização abrangente, financiada pela nação, de nossa economia e de seu funcionamento. Embora ainda haja detalhes a definir, em resumo queremos depender mais de nós mesmos, em vez de nos reintegrar plenamente à economia global integrada."
 CAS_focus_creating_a_real_agricultural_sector:0 "Criar um Verdadeiro Setor Agrícola"
 CAS_focus_creating_a_real_agricultural_sector_desc:0 "As colinas ondulantes e as cadeias de montanhas fazem com que não tenhamos muita terra diretamente arável para desenvolver. Teremos de pensar seriamente em como desenvolver nossa agricultura se quisermos realmente sustentar qualquer crescimento populacional significativo."
 CAS_focus_experimental_idaho_farms:0 "Fazendas Experimentais de Idaho"
 CAS_focus_experimental_idaho_farms_desc:0 "As terras do estado de Idaho são mais adequadas para mineração e outros empreendimentos. Assim, as terras agrícolas que existem no estado devem ser voltadas a inovações e eficiência sempre que possível. Portanto, a agricultura de Idaho será a divisão experimental da agricultura de nossa nação. É claro que ela ainda fornecerá o que e onde puder, mas, se queremos algum tipo de autossustentação, precisamos de P&D significativa para aprimorar o que já temos."
 CAS_focus_washington_pasture_products_and_more:0 "Produtos de Pastagem de Washington e Mais"
 CAS_focus_washington_pasture_products_and_more_desc:0 "Desenvolver os produtos gerais de pastagem também nos permite experimentar combustíveis alternativos. O etanol é uma fonte bastante comum para limitar o uso direto de gasolina. Contudo, se pudermos tornar o uso do etanol mais dominante sem ser tão destrutivo para os componentes do motor, poderemos ampliar ainda mais nosso impacto agrícola e científico na autossustentação."
 CAS_focus_oregon_vertical_farming_techniques:0 "Técnicas de Agricultura Vertical do Oregon"
 CAS_focus_oregon_vertical_farming_techniques_desc:0 "Ao impulsionar os avanços na agricultura vertical, podemos diversificar e ampliar os alimentos efetivamente cultivados nessas instalações. Como bônus, essas fazendas ajudarão a melhorar as instalações médicas e os programas de assistência social, fornecendo nutrição adequada e abundante a quem precisa."
 CAS_focus_mountain_agriculture_planning:0 "Planejamento Agrícola de Montanha"
 CAS_focus_mountain_agriculture_planning_desc:0 "O MAP é o ápice de nosso trabalho árduo. Por meio de grandes esforços, tanto fiscais quanto de pesquisa, agora podemos criar um setor agrícola que não depende totalmente de um terreno específico. É claro que não é perfeito, mas é bom o bastante para sustentar adequadamente nossa população crescente."
 CAS_focus_civilian_centric_economics:0 "Economia Centrada no Civil"
 CAS_focus_civilian_centric_economics_desc:0 "O CCE é uma direção nacional dedicada ao desenvolvimento econômico da nação. Em suma, o objetivo é focar em empregos civis em vez de empregos voltados ao militar. Em outras palavras, uma economia mais tradicional, porém diversificada, em vez daquela esperada de uma possível conquista dos territórios vizinhos."
 CAS_focus_home_grown_tech:0 "Tecnologia Nacional"
 CAS_focus_home_grown_tech_desc:0 "Ao estabelecer as bases de um setor tecnológico, podemos ampliar nossa capacidade de P&D e melhorar toda a economia por meio de suas inovações."
 CAS_focus_societal_workforce_program:0 "Programa Social de Mão de Obra"
 CAS_focus_societal_workforce_program_desc:0 "O SWP é um grande programa nacional de empregos e ocupação. Esse programa abrangente usará iniciativas de financiamento coletivo, com assistência social, saúde e financiamento governamental direto, para criar empregos e ocupar todos e quaisquer cidadãos sempre que possível. A grande esperança é trazer estabilidade, ao mesmo tempo em que se avaliam os impactos de longo prazo no equilíbrio nacional da economia."
 CAS_focus_how_high_can_our_sky_rise:0 "Até Onde Nosso Céu Pode Subir"
 CAS_focus_how_high_can_our_sky_rise_desc:0 "O desenvolvimento geral dos setores de escritórios e corporativo permitirá que nosso povo tenha acesso a uma gama diversificada de empregos tecnológicos e outros de colarinho branco. Isso, com sorte, estimulará novas iniciativas educacionais para toda a população, além de dar um impulso significativo ao nosso PIB e aos valores monetários, ajudando também a compensar os custos de todos esses desenvolvimentos."
 CAS_focus_greater_olympian_development_scheme:0 "Grande Plano de Desenvolvimento de Olympia"
 CAS_focus_greater_olympian_development_scheme_desc:0 "O GODS é uma expansão econômica geral da grande área metropolitana da capital. Esperamos que esse polo de força econômica crie um efeito cascata, à medida que sua influência faça crescer as cidades vizinhas, as cidades maiores e até os territórios vizinhos que controlamos."
 CAS_focus_industrialize_cascadia:0 "Industrializar a Cascádia"
 CAS_focus_industrialize_cascadia_desc:0 "Por meio de planos gerais de desenvolvimento, podemos ampliar o mercado de trabalho e nossa diversidade industrial. Empregar cidadãos será mais fácil do que nunca, e preparamos o terreno para um crescimento suave e benéfico de nossa economia nacional."
 CAS_focus_improving_naval_and_shipping_industries:0 "Melhorar as Indústrias Naval e de Transporte Marítimo"
 CAS_focus_improving_naval_and_shipping_industries_desc:0 "Os avanços em nossas indústrias marítimas terão efeitos majoritariamente benéficos em todo o país. Primeiro, crescemos nossa economia como um todo e continuamos a diversificá-la. Segundo, também ajudamos a atender possíveis necessidades militares caso elas surjam. Por fim, embora a principal questão seja o preenchimento e a criação de possíveis empregos na indústria militar, os efeitos em cadeia ligados a novos empregos corporativos e civis, ou \"de colarinho azul\", nos permitem crescer todos a partir da base."
 CAS_focus_developing_a_domestic_arms_industry:0 "Desenvolver uma Indústria Bélica Doméstica"
 CAS_focus_developing_a_domestic_arms_industry_desc:0 "Apesar de a ideia central de uma indústria bélica ser equipar uma força militar, existe também um bom mercado civil. Caçadores, forças policiais e agências federais com histórico de segurança também precisam de armas para fazer o que fazem. Não esqueçamos também os meios de defesa pessoal e do lar. Isso deve trazer benefícios em geral, pois abre mais caminhos de emprego para nossos cidadãos."
 CAS_focus_continued_diversification_efforts:0 "Esforços Contínuos de Diversificação"
 CAS_focus_continued_diversification_efforts_desc:0 "À medida que chegamos à reta final de nosso programa CCE, devemos priorizar a diversificação econômica para multiplicar as oportunidades de emprego para nossos cidadãos."
 CAS_focus_a_true_economy:0 "Uma Economia de Verdade"
 CAS_focus_a_true_economy_desc:0 "Para manter essa magnífica economia, devemos investir em seu futuro. Esse futuro é o povo que chama a Cascádia de lar, e é nesse mesmo povo que investiremos para que também possa desfrutar do que todos criamos."
 CAS_focus_militarized_economy_plan:0 "Plano de Economia Militarizada"
 CAS_focus_militarized_economy_plan_desc:0 "Nossa nação é pequena, e o continente, assim como o mundo em geral, tornou-se um lugar mais instável. Por isso, devemos buscar uma solução rápida para o problema econômico. O caminho mais rápido é criar uma economia militarizada, em que os empregos giram em torno da expansão e do crescimento das forças armadas. Embora não seja muito sustentável, ela ajudaria a dar a partida em planos limitados de expansão, que depois poderiam ser usados para reorganizar de verdade nossa economia."
 CAS_focus_cascadian_corps_of_engineers_program:0 "Programa do Corpo de Engenheiros Cascadiano"
 CAS_focus_cascadian_corps_of_engineers_program_desc:0 "O CCoE é um empreendimento conjunto militar e civil que permite esforços combinados para reconstruir a nação e acelerar o desenvolvimento. Ele também dá aos civis a chance de entrar nas forças armadas sem se preocupar inerentemente com a parte de \"morrer\"."
 CAS_focus_idaho_innovations:0 "Inovações de Idaho"
 CAS_focus_idaho_innovations_desc:0 "O setor de Idaho será composto por elementos de P&D e pela produção geral de armamentos. Esperamos dar a partida nas necessidades locais de armas de fogo e começar a resolver o problema do emprego."
 CAS_focus_oregon_armaments:0 "Armamentos do Oregon"
 CAS_focus_oregon_armaments_desc:0 "O conselho da OA garantirá empregos para o estado do Oregon e ajudará a coordenar o desenvolvimento local. Não será muito nesses estágios iniciais, mas é melhor que nada."
 CAS_focus_washington_war_machines:0 "Máquinas de Guerra de Washington"
 CAS_focus_washington_war_machines_desc:0 "Washington, a região da capital, ficará responsável por construir nossas máquinas de guerra mais caras. A esperança é compensar o desemprego e estimular mais desenvolvimento local à medida que os cidadãos obtêm salários e demais benefícios."
 CAS_focus_oregon_shipping:0 "Navegação do Oregon"
 CAS_focus_oregon_shipping_desc:0 "A Oregon Shipping Inc. é um empreendimento multiuso para atender às necessidades navais da nação e começar a estabelecer o transporte marítimo comercial e outras indústrias marítimas ou voltadas ao mar. A beleza do desenvolvimento naval é que todos podem receber uma parcela mais igual das coisas."
 CAS_focus_washington_naval_industries:0 "Indústrias Navais de Washington"
 CAS_focus_washington_naval_industries_desc:0 "O desenvolvimento contínuo de Washington nos permite manter a bola de neve do desenvolvimento econômico. O bom é que as indústrias navais são muito mais universais do que as indústrias militares estritamente terrestres."
 CAS_focus_establishing_basic_industries:0 "Estabelecer Indústrias Básicas"
 CAS_focus_establishing_basic_industries_desc:0 "Apesar de nossa aposta, nenhuma aposta está realmente completa sem algum tipo de plano de reserva. Por isso, faremos desenvolvimentos civis limitados para garantir que o básico seja atendido."
 CAS_focus_establishing_basic_tech_industries:0 "Estabelecer Indústrias Tecnológicas Básicas"
 CAS_focus_establishing_basic_tech_industries_desc:0 "Se quisermos usar nossa economia em qualquer medida da imaginação, devemos investir numa seção de inovação do setor privado. O setor tecnológico de qualquer economia costuma ser a pequena força das inovações e dos avanços econômicos e tecnológicos. Uma economia totalmente militarizada não conseguiria fazer inovações amplas, mas, se limitarmos uma pequena seção, podemos garantir o pacote completo."
 CAS_focus_an_economy_with_a_state:0 "Uma Economia com um Estado"
 CAS_focus_an_economy_with_a_state_desc:0 "Agora que a economia de nossa nação está praticamente nos trilhos, podemos começar a olhar além do nosso horizonte para garantir e equilibrar nossas necessidades e meios. Teremos um futuro mais brilhante para todos e mais unido."
 CAS_focus_powering_the_nation:0 "Dar Energia à Nação"
 CAS_focus_powering_the_nation_desc:0 "Estabelecer uma economia e pôr as pessoas de volta ao trabalho é ótimo, mas não podemos fazer nada se não houver energia para fazer as coisas funcionarem... A menos que voltemos à era do vapor, mas divago."
 CAS_focus_bringing_washington_online:0 "Colocar Washington em Operação"
 CAS_focus_bringing_washington_online_desc:0 "Os investimentos iniciais em infraestrutura e em novas instalações de geração de energia nos permitem levar uma rede mais equilibrada ao estado capital, Washington. Não é muito, mas ajudará a colocar em operação muitos outros serviços civis, assim como a própria economia."
 CAS_focus_bringing_idaho_online:0 "Colocar Idaho em Operação"
 CAS_focus_bringing_idaho_online_desc:0 "Nossos esforços contínuos para unir alguma forma de rede elétrica nacional nos levam ao estado de Idaho. O maior obstáculo é fazer as coisas atravessarem as cadeias das Cascatas e das Montanhas Rochosas. Mas, no fim, estabilizaremos e construiremos tudo, o que ajudará a pôr tudo de pé."
 CAS_focus_bringing_oregon_online:0 "Colocar o Oregon em Operação"
 CAS_focus_bringing_oregon_online_desc:0 "Continuando a formalizar a rede nacional, passamos ao estado do Oregon. Colocar o estado em operação nos permitirá conectar com a região da capital e ajudará a aumentar todas as formas de atividade nacional, tanto econômicas quanto de serviços civis."
 CAS_focus_stabilizing_the_national_grid:0 "Estabilizar a Rede Nacional"
 CAS_focus_stabilizing_the_national_grid_desc:0 "Com esforços concentrados, conseguimos colocar uma rede nacional em operação, conectada a quase tudo que precisa dela. É claro que não é perfeita e não temos certeza das necessidades futuras. Contudo, temos a base sobre a qual podemos criar nossa economia, cuidar de nossos cidadãos e de fato funcionar como uma sociedade moderna."
 CAS_focus_raising_the_northern_pacific_flag:0 "Hastear a Bandeira da Northern Pacific"
 CAS_focus_raising_the_northern_pacific_flag_desc:0 "Ao restabelecer a Ferrovia Northern Pacific, podemos garantir o futuro da rede ferroviária de nossa nação."
 CAS_focus_northern_pacific_southern_route:0 "Rota Sul da Northern Pacific"
 CAS_focus_northern_pacific_southern_route_desc:0 "Ao criar uma rota sul dedicada de Salem e Eugene, no Oregon, até Boise, em Idaho, podemos consolidar uma nova forma de conectar melhor nossa nação e seus cidadãos."
 CAS_focus_northern_pacific_rocky_mountain_route:0 "Rota das Montanhas Rochosas da Northern Pacific"
 CAS_focus_northern_pacific_rocky_mountain_route_desc:0 "Ao conectar Boise, capital do estado de Idaho, a Spokane, em Washington, podemos criar uma rede significativa de suprimento e logística para pôr nossa economia nacional para funcionar."
 CAS_focus_northern_pacific_beyond_boise_route:0 "Rota Além de Boise da Northern Pacific"
 CAS_focus_northern_pacific_beyond_boise_route_desc:0 "Ao estabelecer conexões ferroviárias com os assentamentos mais distantes de nossa nação, também podemos atacar preventivamente ou preparar nossa nação para ideias além das nossas fronteiras."
 CAS_focus_excavating_the_nation:0 "Escavar a Nação"
 CAS_focus_excavating_the_nation_desc:0 "Nossa nação, embora pequena, tem alguns recursos naturais que podemos utilizar. Precisamos fazer investimentos sólidos e gerais se quisermos ter alguma chance de construir uma economia realmente funcional."
 CAS_focus_wenatchee_iron_works_complex:0 "O Complexo Siderúrgico de Wenatchee"
 CAS_focus_wenatchee_iron_works_complex_desc:0 "Criar um complexo de mineração central em torno do minério de ferro que nossa nação possui nos permite fazer uma infinidade de produtos. Sem falar no aço, um produto que usa ferro e é um dos mais consumidos, atrás apenas do próprio concreto."
 CAS_focus_yakima_bauxite_mills:0 "Usinas de Bauxita de Yakima"
 CAS_focus_yakima_bauxite_mills_desc:0 "A bauxita é o principal minério convertido em alumínio, ou, como os antigos americanos o chamavam, \"aluminum\". Dá para amar o século XIX e a falta de revisão ortográfica antes de imprimir um jornal. Seja como for, a bauxita e outros minérios de materiais leves logo serão escavados, processados e usados para crescer e diversificar nossa economia em proporções nunca vistas."
 CAS_focus_making_a_valley_out_of_a_mountain:0 "Fazer um Vale de uma Montanha"
 CAS_focus_making_a_valley_out_of_a_mountain_desc:0 "A criação da RMMC, a Rocky Mountain Mining Company, é a pedra angular para encontrar e expandir nossos metais gerais de base tecnológica. Itens que ajudam a fazer microchips e afins nos permitirão aumentar nossa eficiência e nosso aparato doméstico como um todo."
 CAS_focus_growing_the_precious_metals_sector:0 "Ampliar o Setor de Metais Preciosos"
 CAS_focus_growing_the_precious_metals_sector_desc:0 "Ouro, gemas e outros minerais exóticos são uma ótima forma de obter alguma alavancagem econômica decente. Consequentemente, minérios raros como o ósmio e afins também seriam ótimos de tentar descobrir. Pensaremos nos mais elusivos depois; por ora, nossas demandas domésticas devem ser atendidas e temos as terras para isso."
 CAS_focus_investing_in_fossil_fuel_developments:0 "Investir em Desenvolvimentos de Combustíveis Fósseis"
 CAS_focus_investing_in_fossil_fuel_developments_desc:0 "Washington tem carvão, o Oregon tem carvão e Idaho tem carvão e petróleo. Até encontrarmos uma forma de produzir sintéticos adequados e duráveis para as respectivas indústrias petroquímicas, somos forçados a expandir e investir nesses recursos potencialmente limitados. Contudo, por ora, preparamos o terreno para um impulso momentâneo até podermos reorganizar e equilibrar nossas necessidades domésticas."
 CAS_focus_strategic_rubber_production_facilities:0 "Instalações Estratégicas de Produção de Borracha"
 CAS_focus_strategic_rubber_production_facilities_desc:0 "Seja com seringueiras numa instalação de clima especializado ou com alguns métodos sintéticos, precisamos de borracha e de produtos à base de borracha. As necessidades da população, assim como possíveis necessidades militares, superam os custos quando pensamos de verdade na independência de nossa nação como um todo."
 CAS_focus_natural_resource_institute_of_cascadia:0 "Instituto de Recursos Naturais da Cascádia"
 CAS_focus_natural_resource_institute_of_cascadia_desc:0 "O NRIC é uma instalação científica dedicada à promoção e expansão de nossos recursos naturais. Não somos uma nação grande, mas, se pudermos inovar e ampliar o que já temos, seja com produção e/ou práticas de mineração mais eficientes, sem falar no mundo dos sintéticos, talvez nos tornemos a primeira nação verdadeiramente autárquica do mundo. É claro que esses são sonhos elevados e utópicos, mas sonhos nunca são ruins, apenas um meio de nos motivar para o amanhã."
 CAS_focus_cascadian_military:0 "Forças Armadas Cascadianas"
 CAS_focus_cascadian_military_desc:0 "O terreno que ocupamos pode ser tanto um salvador quanto um prejuízo para a nossa própria existência. Por isso, formalizar as Forças Armadas Cascadianas nos permitirá moldar e criar uma força militar que, no mínimo, consiga manter as terras que controlamos."
 CAS_focus_mountaineering_army:0 "Exército de Montanha"
 CAS_focus_mountaineering_army_desc:0 "O CA, ou Exército Cascadiano, é um ramo das forças gerado pelas cadeias de montanhas que dominam nosso território. Assim, devemos garantir uma racionalização geral dos esforços de treinamento para que esse conhecimento tático não seja desperdiçado caso uma força inimiga nos ataque."
 CAS_focus_filling_in_logistical_holes:0 "Tapar as Lacunas Logísticas"
 CAS_focus_filling_in_logistical_holes_desc:0 "Para ter forças armadas funcionais, quanto mais um exército, devemos primeiro corrigir os problemas de suprimento e requisição que tornam tudo tão ineficaz no momento atual."
 CAS_focus_streamlining_personnel_placement:0 "Racionalizar a Alocação de Pessoal"
 CAS_focus_streamlining_personnel_placement_desc:0 "Com os esforços combinados do conselho de pessoal e do corpo de logística, agora podemos unificar nossos esforços e esperar um processo mais suave e eficiente para dar aos soldados o que precisam e alocá-los onde são necessários."
 CAS_focus_expanding_training_camps:0 "Expandir os Campos de Treinamento"
 CAS_focus_expanding_training_camps_desc:0 "Para garantir que tenhamos os números para defender adequadamente nossa nação, devemos expandir e melhorar nossas instalações de treinamento como um todo."
 CAS_focus_codifying_equipment_standardizations:0 "Codificar a Padronização de Equipamentos"
 CAS_focus_codifying_equipment_standardizations_desc:0 "Levar os brinquedos novos às tropas é sempre uma prioridade, mas também é responsabilidade do comando garantir que a coesão e a experiência das unidades estejam em pé de igualdade até chegarem ao campo de batalha. Assim, a padronização de kits de campanha e armamentos nos permitirá treinar com mais eficiência e reduzir um pouco o uso excessivo da rede logística."
 CAS_focus_targeted_motorization_efforts:0 "Esforços Direcionados de Motorização"
 CAS_focus_targeted_motorization_efforts_desc:0 "O TME é uma lista de prioridades de para onde nossos primeiros veículos motorizados serão destinados. Itens como logística e transporte geral em massa de tropas nos permitirão continuar nossos esforços para pôr homens suficientes no campo e conseguir manter nossas fronteiras."
 CAS_focus_general_refinement_programs:0 "Programas Gerais de Aperfeiçoamento"
 CAS_focus_general_refinement_programs_desc:0 "Garantir os padrões de treinamento e a manutenção das habilidades aprendidas é uma ótima forma de reter e criar uma nova base de excelência em combate."
 CAS_focus_army_defensive_strategy:0 "Estratégia Defensiva do Exército"
 CAS_focus_army_defensive_strategy_desc:0 "Devido à nossa posição quase isolada, precisamos criar um espírito mais defensivo se quisermos sobreviver a quaisquer incursões vindas do continente."
 CAS_focus_strengthening_defensive_counter_measures:0 "Fortalecer as Contramedidas Defensivas"
 CAS_focus_strengthening_defensive_counter_measures_desc:0 "Os exércitos modernos têm uma série de ferramentas à disposição, e esse conhecimento significa que precisaremos investir melhor em contramedidas para elas. Nenhum humano frágil mata um tanque com facilidade, então vamos dar a eles os meios de destruição, que tal?"
 CAS_focus_anti_air_developments:0 "Desenvolvimentos Antiaéreos"
 CAS_focus_anti_air_developments_desc:0 "Ao investir em sistemas antiaéreos preventivos, podemos aumentar a capacidade de sobrevivência e, por meio dela, a experiência de combate de nossos soldados."
 CAS_focus_defense_social_benefit_contracts:0 "Contratos de Benefícios Sociais de Defesa"
 CAS_focus_defense_social_benefit_contracts_desc:0 "Estabelecer o departamento DSBC dentro do exército nos permite incentivar melhor o alistamento por mais do que apenas defender a nação. Esse golpe preventivo contra a incerteza significa que quem se alista no exército pode assinar um contrato juridicamente vinculante que estabelece um padrão fixo de benefícios monetários, de assistência social e de saúde para o soldado e seus familiares diretos. Em caso de guerra, esses benefícios seriam imediatamente repassados ao cônjuge ou ao parente mais próximo, conforme a situação."
 CAS_focus_aggression_strategy:0 "Estratégia de Agressão"
 CAS_focus_aggression_strategy_desc:0 "Nossa posição é apenas uma bomba-relógio prestes a explodir; devemos partir para a ofensiva se quisermos realmente chegar a algum lugar nestes tempos conturbados."
 CAS_focus_emphasis_on_mobility:0 "Ênfase na Mobilidade"
 CAS_focus_emphasis_on_mobility_desc:0 "Ao promover elementos mais móveis do nosso exército, a manobrabilidade e as capacidades ofensivas aumentarão muito as chances de sobrepujar a capacidade de decisão do inimigo."
 CAS_focus_rearming_soldiers:0 "Rearmar os Soldados"
 CAS_focus_rearming_soldiers_desc:0 "Mudar o equipamento padrão de nossos soldados para algo mais voltado à ofensiva nos permitirá garantir que eles estejam mais preparados para atacar do que para ficar parados."
 CAS_focus_securing_dedicated_conscription:0 "Garantir um Alistamento Dedicado"
 CAS_focus_securing_dedicated_conscription_desc:0 "Melhorar os esforços de alistamento e refinar seus requisitos nos permitirá sustentar os números de que precisamos, especialmente se as linhas de frente se expandirem além do esperado."
 CAS_focus_all_terrain_combat_training:0 "Treinamento de Combate em Todos os Terrenos"
 CAS_focus_all_terrain_combat_training_desc:0 "Ao estabelecer novas instalações de treinamento de combate para expor nossas tropas ao maior número possível de tipos de terreno, estabelecemos um novo padrão de treinamento e adaptabilidade em termos de capacidade geral de combate."
 CAS_focus_cascadian_navy:0 "Marinha Cascadiana"
 CAS_focus_cascadian_navy_desc:0 "O ramo militar CN é a pedra angular da defesa costeira. Usando os navios que temos, devemos reorganizá-los e consertá-los, assim como suas tripulações, e criar uma nova dinâmica de poder. A pérola do Pacífico brilhará intensamente."
 CAS_focus_updating_fleet_logistics:0 "Atualizar a Logística da Frota"
 CAS_focus_updating_fleet_logistics_desc:0 "Reparos e manutenção exigem materiais, pessoal e recursos brutos. Precisamos consertar essa engrenagem fundamental de nossa poderosa máquina naval se quisermos ter uma força naval em funcionamento."
 CAS_focus_remodeling_training_facilities:0 "Reformar as Instalações de Treinamento"
 CAS_focus_remodeling_training_facilities_desc:0 "Ao atualizar e modernizar as instalações decadentes, podemos melhorar a qualidade de nosso pessoal e de sua capacidade de operação, bem como a familiaridade com o navio em que servem."
 CAS_focus_navy_personnel_advancements_training:0 "Treinamento de Progressão do Pessoal Naval"
 CAS_focus_navy_personnel_advancements_training_desc:0 "Aumentar os programas de treinamento para preparar o pessoal naval para possíveis avanços de posto e responsabilidade permitirá uma operação e coordenação mais eficientes dos sistemas de armas em frotas menores."
 CAS_focus_fixing_outdated_propulsion_systems:0 "Consertar Sistemas de Propulsão Obsoletos"
 CAS_focus_fixing_outdated_propulsion_systems_desc:0 "A manutenção dos sistemas de propulsão tem sido quase inexistente, e isso é inaceitável. Devemos consertar esses componentes essenciais e dar a nossas forças navais uma chance de lutar."
 CAS_focus_standardizing_repair_facilities:0 "Padronizar as Instalações de Reparo"
 CAS_focus_standardizing_repair_facilities_desc:0 "Ao padronizar as instalações de docas secas, podemos melhorar nossa capacidade de consertar embarcações danificadas ou quebradas. Isso significa menos tempo fora de serviço e respostas mais rápidas à presença inimiga em nossas águas."
 CAS_focus_weapons_system_task_force:0 "Força-Tarefa de Sistemas de Armas"
 CAS_focus_weapons_system_task_force_desc:0 "Ao criar equipes especializadas de reparo e substituição, podemos garantir que nossas embarcações tenham os sistemas de armas mais funcionais e atualizados."
 CAS_focus_naval_firepower_strategy:0 "Estratégia de Poder de Fogo Naval"
 CAS_focus_naval_firepower_strategy_desc:0 "Ao concentrar o financiamento em sistemas de armas para nossas embarcações navais, podemos garantir a sobrevivência de cada uma delas, pois todas terão um soco poderoso."
 CAS_focus_future_navies_program:0 "Programa das Marinhas do Futuro"
 CAS_focus_future_navies_program_desc:0 "Direcionar financiamento para P&D de novas armas para nossas frotas, assim como de medidas defensivas, aumentará o impacto em combate e a capacidade geral de sobrevivência."
 CAS_focus_strategic_shipbuilding:0 "Construção Naval Estratégica"
 CAS_focus_strategic_shipbuilding_desc:0 "O programa SSB é dedicado a preparar para o futuro e racionalizar a composição da frota naval, bem como o poder de fogo esperado desses navios."
 CAS_focus_naval_replacement_strategy:0 "Estratégia de Reposição Naval"
 CAS_focus_naval_replacement_strategy_desc:0 "Embarcações são perdidas, isso é um fato. Contudo, se não quisermos perder nossa economia no processo, precisamos garantir que o reparo e a modernização, bem como a sobrevivência do pessoal naval, sejam prioridade máxima."
 CAS_focus_ship_design_standards_commission:0 "Comissão de Padrões de Projeto Naval"
 CAS_focus_ship_design_standards_commission_desc:0 "A comissão SDS é uma iniciativa de financiamento para estudar formas de cortar custos e reduzir a produção, o que nos permitirá fazer mais navios com menos recursos. As desvantagens, é claro, serão levemente óbvias, mas a sobrevivência é a prioridade máxima."
 CAS_focus_survivability_designing_priority:0 "Prioridade de Projeto de Sobrevivência"
 CAS_focus_survivability_designing_priority_desc:0 "Ao projetar preventivamente novas embarcações navais com medidas de sobrevivência, podemos salvar mais mão de obra de embarcações potencialmente danificadas ou destruídas."
 CAS_focus_coastal_primary_training:0 "Treinamento Costeiro Primário"
 CAS_focus_coastal_primary_training_desc:0 "Garantir nossa defesa nacional é o objetivo principal e, assim, o treinamento refletirá isso."
 CAS_focus_air_force_of_cascadia:0 "Força Aérea da Cascádia"
 CAS_focus_air_force_of_cascadia_desc:0 "A criação e a formalização da Força Aérea Cascadiana, ou CAF, é um verdadeiro degrau rumo à independência de nossa nação. Potências estrangeiras de todos os tamanhos procuram ter uma força aérea que possa defender os céus de sua nação, e é exatamente isso que faremos."
 CAS_focus_fighter_priority_strategy:0 "Estratégia de Prioridade aos Caças"
 CAS_focus_fighter_priority_strategy_desc:0 "Defender nosso espaço aéreo é o objetivo supremo da sobrevivência a longo prazo. Se deixarmos a força aérea inimiga agir à vontade, melhor desistir antes de começar."
 CAS_focus_improved_weapons_testing:0 "\"Testes de Armas\" Aprimorados"
 CAS_focus_improved_weapons_testing_desc:0 "A instalação de testes de armas é uma ótima forma de melhorar nossas capacidades ofensivas no ar. Contudo, com um projeto inteligente da instalação, também podemos testar contramedidas e tecnologias gerais de aprimoramento."
 CAS_focus_retooling_aircraft_production:0 "Reorganizar a Produção de Aeronaves"
 CAS_focus_retooling_aircraft_production_desc:0 "Ao priorizar os modelos de caça na produção, podemos garantir ao povo de nossa nação, e também aos nossos inimigos, que nossos céus conterão apenas nossos aviões."
 CAS_focus_bomber_priority_strategy:0 "Estratégia de Prioridade aos Bombardeiros"
 CAS_focus_bomber_priority_strategy_desc:0 "Confiamos nas habilidades de nossa força aérea, mas confiamos igualmente na vontade de nossos inimigos de continuar lutando. Por isso, devemos priorizar aeronaves do tipo bombardeiro e derrotar o inimigo tanto na frente quanto na retaguarda."
 CAS_focus_payload_developments:0 "Desenvolvimento de Cargas Úteis"
 CAS_focus_payload_developments_desc:0 "Para garantir a derrota de nossos inimigos, devemos melhorar nossas cargas de bombardeio e a forma como chegam aos alvos."
 CAS_focus_retooling_aircraft_production_two:0 "Reorganizar a Produção de Aeronaves"
 CAS_focus_retooling_aircraft_production_two_desc:0 "Ao destinar recursos de produção a mais modelos de aeronaves do tipo bombardeiro, podemos manter o máximo de pressão sobre o inimigo. Forçaremos sua rendição de um jeito ou de outro."
 CAS_focus_simulator_investments:0 "Investimentos em Simuladores"
 CAS_focus_simulator_investments_desc:0 "Para provar que nossos pilotos são os melhores, devemos submetê-los a uma simulação o mais realista possível. O treinamento será duro e provavelmente esmagador para alguns, mas, no fim, criaremos um novo padrão de pilotos como o mundo nunca viu."
 CAS_focus_general_infrastructure_investments:0 "Investimentos Gerais em Infraestrutura"
 CAS_focus_general_infrastructure_investments_desc:0 "Com investimentos para melhorar a infraestrutura de nossa força aérea, bem como a logística para levar aviões aos campos de partida e afins, melhoraremos muito a prontidão de combate de nosso ramo aéreo."
 CAS_focus_air_force_assistance_department:0 "Departamento de Assistência da Força Aérea"
 CAS_focus_air_force_assistance_department_desc:0 "O Departamento de Assistência, ou, como alguns o chamam, Departamento de Prontidão Conjunta, é uma seção de coordenação da força aérea usada para trabalhar de forma coesa com o exército e outras forças terrestres durante operações de combate. Serve para limitar incidentes de fogo amigo e garantir clareza no campo de batalha."
 CAS_focus_clear_skies_ahead:0 "Céus Limpos à Frente"
 CAS_focus_clear_skies_ahead_desc:0 "Com esforço incansável, acho confortável dizer que podemos desfrutar dos céus acima de nós. Pois os defenderemos de qualquer força inimiga que tente escurecê-los."
 CAS_focus_a_refined_fighting_force:0 "Uma Força de Combate Refinada"
 CAS_focus_a_refined_fighting_force_desc:0 "Nossas forças armadas evoluíram muito, e agora podemos dizer que nossas fronteiras serão defendidas e que nossos inimigos não poderão mais simplesmente \"passar por cima de nós\"."
 CAS_focus_beyond_the_mountain_home:0 "Além do Lar Montanhoso"
 CAS_focus_beyond_the_mountain_home_desc:0 "Ao olhar para nossa grande nação, vemos uma terra e um povo de potencial. Vemos além das grandes cadeias de montanhas dessas belas terras e olhamos com horror como selvagens, exploradores e todo tipo de vagabundos infestam o continente. Se quisermos realmente deixar nossa marca nesta era moderna, devemos ser ousados. Seja o que escolhermos, devemos nos manter de cabeça erguida, orgulhosos e unidos contra aqueles que desejam preservar a decadência ao nosso redor."
 CAS_focus_pan_pacific_plan:0 "O Plano Pan-Pacífico"
 CAS_focus_pan_pacific_plan_desc:0 "A Cascádia é uma nação voltada ao Pacífico; devemos garantir que seja A nação do Pacífico. Assim, começaremos a pôr as engrenagens em movimento para nos tornarmos uma nação maior, que se estenda por toda a costa do Pacífico."
 CAS_focus_preparing_for_the_hunt:0 "Preparar a Caçada"
 CAS_focus_preparing_for_the_hunt_desc:0 "A parte mais fácil desse nosso grande plano será derrubar a atrasada e inerentemente egocêntrica República da Califórnia. Uma espécie de urso, se estivéssemos num circo... mas não estamos. Assim, começaremos os preparativos para adquirir as terras da Califórnia e pôr fim a essa farsa."
 CAS_focus_strike_down_the_bear:0 "Abater o Urso"
 CAS_focus_strike_down_the_bear_desc:0 "A hora é agora e, assim, abateremos o urso, seremos vitoriosos e começaremos uma nova era para a Cascádia!"
 CAS_focus_the_great_southern_expedition:0 "A Grande Expedição ao Sul"
 CAS_focus_the_great_southern_expedition_desc:0 "O México é uma nação forte, mas também confusa e um tanto decepcionante. Este será o nosso maior desafio até agora e, por isso, devemos nos preparar para esta grande batalha."
 CAS_focus_operation_yucatan:0 "Operação Iucatã"
 CAS_focus_operation_yucatan_desc:0 "A Operação Iucatã é a invasão planejada do México. Atacaremos forte e rápido para varrer a península da Baixa Califórnia e depois iniciar um avanço geral para o sul, até finalmente eliminar os últimos focos de resistência no Iucatã."
 CAS_focus_rio_grande_republic:0 "República do Rio Grande"
 CAS_focus_rio_grande_republic_desc:0 "Controlar vastas extensões de território é uma tarefa árdua e drena os poucos recursos humanos que temos. Por isso, precisamos estabelecer um fantoche estratégico como parceiro igual, junto com o que restou do México."
 CAS_focus_yucatan_power_bloc:0 "Bloco de Poder do Iucatã"
 CAS_focus_yucatan_power_bloc_desc:0 "Para consolidar nossos territórios do Pacífico, devemos desmantelar a ideia de um povo mexicano unificado. Assim, reviver a nação e a cultura iucatecas nos permitirá separar outra parte do México maior e ajudar a administrar melhor o sul."
 CAS_focus_our_pacific_territories:0 "Nossos Territórios do Pacífico"
 CAS_focus_our_pacific_territories_desc:0 "Para garantir que nossa presença naval no Pacífico seja cada vez menos provável de ser desafiada, devemos garantir e integrar territórios costeiros-chave do Pacífico. Isso também ajudará a criar um Pacto de Potências Pan-Pacífico unificado, o PPPP. Podemos dividir melhor o México em regiões não poderosas o bastante para nos desafiar, mas poderosas o bastante para nos ajudar e beneficiar, a nós e aos demais Estados-membros constituídos."
 CAS_focus_central_mexico_administration:0 "Administração do México Central"
 CAS_focus_central_mexico_administration_desc:0 "O antigo governo do México pode permanecer no poder e administrar a região central do antigo Estado mexicano. A principal condição é que o novo Estado e sua administração estejam alinhados à Cascádia e a seus objetivos de política externa. Os assuntos internos podem continuar sob a nova administração sem intervenção cascadiana."
 CAS_focus_ensuring_public_stability:0 "Garantir a Estabilidade Pública"
 CAS_focus_ensuring_public_stability_desc:0 "Com a expedição ao sul concluída, podemos agora começar a mobilizar o público em geral e criar um novo caminho adiante. Unidos como um só povo, podemos prosperar como nunca."
 CAS_focus_eastern_bulwark:0 "Baluarte Oriental"
 CAS_focus_eastern_bulwark_desc:0 "Nosso objetivo final é reivindicar os territórios costeiros do Pacífico. Do Alasca à Baixa Califórnia, criaremos uma grande marinha para garantir a paz e a estabilidade no Pacífico. Contudo, precisamos primeiro construir uma base. Os rumores a leste do Mississippi deixam alguns preocupados com um poder opositor em crescimento; além disso, a posição geopolítica do Canadá torna a simples invasão não tão fácil. Por isso, devemos conter a União de Deseret como baluarte contra o leste e ajudar a construir nossa base de poder."
 CAS_focus_operation_morman:0 "Operação Mórmon"
 CAS_focus_operation_morman_desc:0 "A União de Deseret já lutou uma guerra contra o antigo governo federal dos EUA no século XIX. Agora vão ter outro round conosco. Marchamos para o oeste!"
 CAS_focus_securing_eastern_holdings:0 "Garantir as Posses Orientais"
 CAS_focus_securing_eastern_holdings_desc:0 "Garantimos o baluarte; agora devemos estabilizar a situação e restaurar a ordem pública."
 CAS_focus_pushing_buttons_testing_waters:0 "Apertar Botões e Testar as Águas"
 CAS_focus_pushing_buttons_testing_waters_desc:0 "O maior desafio está à nossa frente. Precisamos começar a fazer tudo que pudermos para convencer os canadenses a nos atacar, em vez de simplesmente declarar guerra a eles. É claro que ainda podemos fazer isso, mas, considerando o óbvio, não é a melhor ideia."
 CAS_focus_border_escalation:0 "Escalada na Fronteira"
 CAS_focus_border_escalation_desc:0 "Devemos fazer tudo que for possível para provocar o governo canadense a forçar uma guerra nos termos dele. Assim, mesmo que sejamos um pouco imprudentes, temos de fazer o necessário se não quisermos escalar este conflito regional para algo maior."
 CAS_focus_operation_great_north:0 "Operação Grande Norte"
 CAS_focus_operation_great_north_desc:0 "Quando tudo mais falha, vá em frente e faça você mesmo."
 CAS_focus_stabilizing_the_great_north:0 "Estabilizar o Grande Norte"
 CAS_focus_stabilizing_the_great_north_desc:0 "Agora que efetivamente encerramos as coisas em nossos termos, podemos começar a trazer paz e ordem de volta a estas terras."
 CAS_focus_operation_big_dipper:0 "Operação Grande Concha"
 CAS_focus_operation_big_dipper_desc:0 "A fronteira final. O Alasca, estado rico em petróleo, será uma grande adição à nossa União Pan-Pacífica e uma grande peça estratégica de terra para continuarmos nossa proeza naval."
 CAS_focus_connecting_the_frigid_north:0 "Conectar o Norte Gelado"
 CAS_focus_connecting_the_frigid_north_desc:0 "Agora que o conflito cessou, podemos começar a conectar e estabilizar o território do Alasca."
 CAS_focus_pan_pacific_proclamation:0 "Proclamação Pan-Pacífica"
 CAS_focus_pan_pacific_proclamation_desc:0 "Nosso trabalho não está concluído, mas as partes mais difíceis já passaram. Podemos garantir aos povos de nossa gloriosa nação que somos apenas um. Os povos da costa do Pacífico estão agora unidos e, assim, proclamaremos essa união ao mundo inteiro."
 CAS_focus_cambrian_unity_plan:0 "O Plano de Unidade Cambriana"
 CAS_focus_cambrian_unity_plan_desc:0 "A república se foi, a ideia de \"Estados Unidos\" morreu com sua implosão. Assim, devemos criar um novo caminho adiante e buscar uma nova identidade para nos unir. Algumas das grandes cadeias de montanhas datam da Era Cambriana, então que melhor forma de criar uma nova união do que honrar o legado dessas terras? Cambria, nosso lar."
 CAS_focus_coastal_claims:0 "Reivindicações Costeiras"
 CAS_focus_coastal_claims_desc:0 "Para criar nossa nova união, devemos primeiro traçar um caminho para a unidade costeira do Pacífico. Assim, começaremos a manobrar e a consolidar nossas legítimas reivindicações contra o falho governo californiano."
 CAS_focus_southwestern_securities:0 "Garantias do Sudoeste"
 CAS_focus_southwestern_securities_desc:0 "O sudoeste é rico em combustíveis fósseis e recursos minerais essenciais. Para cuidar adequadamente desta nova e grande nação, devemos começar a consolidar nosso direito de adquirir essas terras."
 CAS_focus_securing_a_stable_food_supply:0 "Garantir um Suprimento Estável de Alimentos"
 CAS_focus_securing_a_stable_food_supply_desc:0 "Os estados das Grandes Planícies são considerados o celeiro do novo mundo. É desse celeiro que alimentaremos nosso povo e fomentaremos a união e a prosperidade nos dias que virão."
 CAS_focus_operation_angel_city:0 "Operação Cidade dos Anjos"
 CAS_focus_operation_angel_city_desc:0 "Para criar uma frente verdadeiramente unida, primeiro devemos unir a costa oeste. Atacaremos ao sul e celebraremos nossa vitória na cidade dos anjos."
 CAS_focus_operation_bread_bowl:0 "Operação Tigela de Pão"
 CAS_focus_operation_bread_bowl_desc:0 "A região das grandes planícies será a melhor para lutar primeiro. Depois de varrê-la, poderemos seguir para o sul e consolidar nossa união."
 CAS_focus_operation_just_deserts:0 "Operação Justos Desertos"
 CAS_focus_operation_just_deserts_desc:0 "A última peça central do nosso grande quebra-cabeça está bem diante de nós. Muitos podem perguntar: por que não simplesmente unir o continente? Bem, a questão é que um dia o faremos. Mas, por ora, devemos unir e consolidar nossos ganhos, fomentar um senso de unidade e criar um novo caminho para o futuro que desejamos ter."
 CAS_focus_beginning_a_new_chapter:0 "Começando um Novo Capítulo"
 CAS_focus_beginning_a_new_chapter_desc:0 "Começamos estabilizando a região costeira, por ser a mais próxima de nós, para iniciar a integração dos serviços civis."
 CAS_focus_restoring_southern_order:0 "Restaurando a Ordem no Sul"
 CAS_focus_restoring_southern_order_desc:0 "Ao integrar os serviços civis, podemos começar a restaurar a lei e a ordem em nossas novas regiões do sul, onde os primeiros passos da unidade nacional podem ser dados."
 CAS_focus_sowing_new_fields_of_unity:0 "Semeando Novos Campos de Unidade"
 CAS_focus_sowing_new_fields_of_unity_desc:0 "Ao restaurar a ordem e a paz nessas terras férteis, podemos restabelecer a legalidade pública garantindo um suprimento de alimentos estável e diversificado."
 CAS_focus_the_new_republic:0 "A Nova República"
 CAS_focus_the_new_republic_desc:0 "Demorou muito para chegar, mas é hora de virar a última página deste livro para que possamos escrever um novo. A história de Cambria começa hoje."
 CAS_focus_old_republic_plan:0 "O Plano da Velha República"
 CAS_focus_old_republic_plan_desc:0 "Nossas terras estão em ordem e, por isso, corrigiremos o que tantos fizeram de errado. Marcharemos para o leste e, juntos, uniremos o continente mais uma vez."
 CAS_focus_coastline_clearance:0 "Limpeza do Litoral"
 CAS_focus_coastline_clearance_desc:0 "Nosso caminho é longo e difícil. Se não tomarmos cuidado, algum maníaco da costa leste pode ter uma ideia semelhante à nossa. Por isso, podemos começar buscando unir os estados costeiros do Pacífico sob uma só bandeira e preparar nossas forças para as campanhas à frente."
 CAS_focus_taking_the_gamble:0 "Correndo o Risco"
 CAS_focus_taking_the_gamble_desc:0 "A metade sul deste lado do continente é coberta por desertos. Esse terreno hostil significa que precisaremos ter cautela com os suprimentos e garantir que não soframos mais com o calor e as doenças do que com o combate em si."
 CAS_focus_working_for_our_meal:0 "Trabalhando pela Refeição"
 CAS_focus_working_for_our_meal_desc:0 "Embora a metade norte deste lado do continente seja em grande parte planície, as Montanhas Rochosas, assim como as colinas e vales ondulados, tornarão a jornada longa e tediosa. Esperemos que, quando o trabalho duro terminar, possamos desfrutar de uma boa refeição farta."
 CAS_focus_a_lone_star_no_more:0 "Nenhuma Estrela Solitária"
 CAS_focus_a_lone_star_no_more_desc:0 "O ponto intermediário e o início da próxima página do nosso livro revanchista de glória. O Texas será um ótimo ponto de parada para nos recompormos, reorganizar nossos ganhos atuais e então nos preparar para a próxima luta, a fim de concluir o trabalho em mãos."
 CAS_focus_war_plan_movie_star:0 "Plano de Guerra Estrela de Cinema"
 CAS_focus_war_plan_movie_star_desc:0 "Atacamos ao sul, contra o urso. Aqueles perucas liberais e a sua alta sociedade nunca terão chance."
 CAS_focus_war_plan_farmville:0 "Plano de Guerra Farmville"
 CAS_focus_war_plan_farmville_desc:0 "O fazendeiro John pode ter uma velha e confiável espingarda, mas nós temos tanques e aviões. Esse bando maltrapilho não vai nos atrapalhar."
 CAS_focus_war_plan_skorpion:0 "Plano de Guerra Skorpion"
 CAS_focus_war_plan_skorpion_desc:0 "Mórmons... sério?! Essa gente é uma piada; imagino que perderemos mais para doenças e para o clima do que para o suposto exército deles."
 CAS_focus_war_plan_alamo:0 "Plano de Guerra Alamo"
 CAS_focus_war_plan_alamo_desc:0 "Lembrem-se do Álamo, pois este será o ponto intermediário para devolver a glória e a honra de um continente unido."
 CAS_focus_beginning_clean_up_operations:0 "Iniciando as Operações de Limpeza"
 CAS_focus_beginning_clean_up_operations_desc:0 "Conforme a poeira baixa na primeira metade deste nosso \"grande jogo\", devemos começar a nos recompor e organizar a frente interna que criamos."
 CAS_focus_peace_land_and_bread:0 "Paz, Terra e Pão"
 CAS_focus_peace_land_and_bread_desc:0 "Garantiremos a paz e restauraremos a ordem pública usando as novas terras e assegurando que o povo tenha pão suficiente para encher o estômago."
 CAS_focus_bread_and_circuses:0 "Pão e Circo"
 CAS_focus_bread_and_circuses_desc:0 "Para garantir a ordem pública aqui no sudoeste, devemos entreter o povo e mantê-lo alimentado. Assim, podemos estudar a expansão da influência de Vegas e buscar fornecer comida barata à região castigada pelo deserto."
 CAS_focus_a_wild_west_no_more:0 "Nenhum Velho Oeste"
 CAS_focus_a_wild_west_no_more_desc:0 "Com a metade oeste do continente agora reorganizada e estável por ora, podemos começar a preparar a marcha através do Mississippi."
 CAS_focus_southern_bell_tolls:0 "Dobra o Sino do Sul"
 CAS_focus_southern_bell_tolls_desc:0 "A marcha para o leste continua, e que melhor forma de cruzar o Mississippi do que pelo estado que leva o seu nome."
 CAS_focus_rusting_chance_to_make_new:0 "Chance Enferrujada de Fazer o Novo"
 CAS_focus_rusting_chance_to_make_new_desc:0 "A região dos Grandes Lagos é uma das áreas mais industrializadas da antiga república. Infelizmente, esses Grandes Lagos corroeram os estados que os margeiam e ficam perto deles. Por isso marcharemos para o leste e continuaremos a luta."
 CAS_focus_capitalizing_the_capital:0 "Capitalizando a Capital"
 CAS_focus_capitalizing_the_capital_desc:0 "A região federal da antiga república sofreu muito devido às influências tóxicas do Distrito. Agora trabalharemos para remediar isso."
 CAS_focus_northeastern_nitwits:0 "Os Tolos do Nordeste"
 CAS_focus_northeastern_nitwits_desc:0 "Os egocêntricos e a gente da alta sociedade que em geral compõem a região nordeste serão moleza. Contudo, não devemos subestimar o terreno que controlam, pois até um bando de arruaceiros pode causar estrago se estiver no lugar certo."
 CAS_focus_war_plan_dixie:0 "Plano de Guerra Dixie"
 CAS_focus_war_plan_dixie_desc:0 "Marchamos sobre Dixie, marchamos para o leste para concluir o trabalho que criamos para nós mesmos."
 CAS_focus_war_plan_industrial_revolution:0 "Plano de Guerra Revolução Industrial"
 CAS_focus_war_plan_industrial_revolution_desc:0 "Marcharemos para o leste e transformaremos essas relíquias enferrujadas em refinados pódios de prosperidade."
 CAS_focus_war_plan_washington:0 "Plano de Guerra Washington"
 CAS_focus_war_plan_washington_desc:0 "O distrito da capital, embora não seja a linha de chegada, é o último grande passo para consolidar nosso novo mandato do destino para o continente. Pois conquistaremos a capital, criaremos a velha república e a faremos nova."
 CAS_focus_war_plan_marathon:0 "Plano de Guerra Maratona"
 CAS_focus_war_plan_marathon_desc:0 "Estamos na reta final, pessoal; agora só precisamos terminar nossa maratona e contemplar o oceano aberto. Do Maine deveremos conseguir ver ao longe a pacífica província canadense da Nova Escócia. Dali, o derramamento de sangue terá acabado e a reconstrução poderá começar."
 CAS_focus_southern_sweethearts:0 "Queridinhos do Sul"
 CAS_focus_southern_sweethearts_desc:0 "A hospitalidade sulista é uma novidade à parte. Se pretendemos restaurar de verdade a lei e a ordem, quanto mais pensar em voltar a ser uma união de estados, devemos mostrar a eles a mesma cortesia que mostram a nós. Guerra é guerra, mas manter a paz é bem mais difícil do que você imagina."
 CAS_focus_midwestern_goodbye:0 "Uma Despedida do Meio-Oeste"
 CAS_focus_midwestern_goodbye_desc:0 "Opa, desculpe aí, amigo, não vi você ali; olha, foi um tempo muito bom, mas tenho coisas a fazer e a resolver antes que a patroa se enrole toda de um jeito extravagante. Mas ei, podemos fazer isso de novo outra hora; eu levo a cerveja e você leva uns bons cachorros-quentes para o jogo."
 CAS_focus_capital_clean_up:0 "Limpeza da Capital"
 CAS_focus_capital_clean_up_desc:0 "É hora de limpar esta relíquia do passado. Talvez um dia restabeleçamos aqui a sede do governo nacional, ou talvez simplesmente a devolvamos a cada respectivo estado e a usemos como lição para as gerações futuras."
 CAS_focus_liberty_shines_once_more:0 "A Liberdade Brilha Mais Uma Vez"
 CAS_focus_liberty_shines_once_more_desc:0 "Hoje limpamos as ruas e a Estátua da Liberdade, pois devemos celebrar a conclusão do nosso grande segundo Destino Manifesto."
 CAS_focus_second_republic:0 "A Segunda República"
 CAS_focus_second_republic_desc:0 "As terras estão em ordem, o povo está unido e o mundo saberá agora que a 2ª República Americana é, mais uma vez, uma potência no cenário global. Pois unidos resistimos, assim como divididos um dia caímos."
 CAS_flag_western_outlook:0 "Ideais Ocidentais Se Firmam"
 CAS_flag_emerging_outlook:0 "Ideais Orientais Se Firmam"
 CAS_flag_non_aligned_outlook:0 "Ideais Nativos Se Firmam"
 CAS_flag_nationalist_outlook:0 "Valores Nacionalistas Dominam a Nação"
 CAS_flag_mount_fort_baker: "Mt. Fort Baker"
 CAS_flag_fort_ruby_mountain: "Fort Ruby Mountain"
 CAS_flag_fort_yakama: "Fort Yakama"
 CAS_flag_fort_saint_helens: "Fort Saint Helens"
 CAS_flag_sprague: "Sprague"
 CAS_flag_umatilla: "Umatilla"
 CAS_flag_arock: "Arock"
 CAS_flag_grimes_pass: "Grimes Pass"
 CAS_ideas_developing_foreign_policy:0 "Desenvolvendo a Política Externa"
 CAS_ideas_developing_foreign_policy_desc:0 "Agora que nos recompusemos, podemos começar a olhar além de nossas fronteiras para garantir nosso lugar neste mundo."
 CAS_ideas_officer_training_funding:0 "Financiamento do Treinamento de Oficiais"
 CAS_ideas_officer_training_funding_desc:0 "O financiamento ampliado nos permitiu expandir o treinamento que nossos oficiais e generais recebem ao longo dos anos de serviço. Isso nos permite, com o tempo, melhorar os elementos de Comando e Controle de nossas forças armadas, além de aprimorar as doutrinas que podemos usar para refinar nossas forças militares."
 CAS_ideas_the_wegonian_rank_structure:0 "A Estrutura de Patentes Wegoniana"
 CAS_ideas_the_wegonian_rank_structure_desc:0 "Inspirada em métodos de C&C mais de nicho, a estrutura de patentes Wegoniana é uma forma mais ampla de patentes militares para cada ramo das forças, que permite unidades militares menores e mais escaláveis. A principal desvantagem é que a expansão dessas patentes e da hierarquia das unidades exige mais cargos de liderança em todos os níveis. No entanto, o potencial benefício é a coordenação entre unidades e a capacidade de aumentar a flexibilidade das unidades, apesar do escalão mais alto que se possa usar."
 CAS_ideas_mountain_agriculture:0 "Agricultura de Montanha"
 CAS_ideas_mountain_agriculture_desc:0 "Por meio de planejamento minucioso e investimentos significativos em P&D, agora podemos ter um setor agrícola relevante, capaz de ao menos considerar uma autossuficiência real caso sejamos assediados por potências estrangeiras que desejem nos causar mal."
 CAS_ideas_cascadian_armed_services_infancy:0 "Forças Armadas Cascadianas \"Infância\""
 CAS_ideas_cascadian_armed_services_infancy_desc:0 "Os primeiros dias de formação de uma força militar sempre serão cheios de saqueadores entusiasmados e preguiçosos acomodados. Embora não seja muito, as CAS farão o que puderem para defender o lar e a família onde e quando for preciso."
 CAS_ideas_army_anti_air_defenses:0 "Defesas Antiaéreas do Exército"
 CAS_ideas_army_anti_air_defenses_desc:0 "Ao priorizar o desenvolvimento de sistemas antiaéreos, podemos prolongar a vida do soldado comum, elevando também a experiência coletiva que os soldados do exército compartilham."
 CAS_ideas_cascading_offensives:0 "Ofensivas em Cascata"
 CAS_ideas_cascading_offensives_desc:0 "Ao retreinar tropas e oficiais para serem mais agressivos e equipar nossas tropas com elementos mais móveis, podemos garantir uma espécie de \"ofensiva perpétua\" caso surja a oportunidade."
 CAS_ideas_all_terrain_combat_training:0 "Treinamento de Combate em Todos os Terrenos"
 CAS_ideas_all_terrain_combat_training_desc:0 "Os programas de treinamento ATC são campos de treinamento especialmente projetados para alternar e expor os soldados a todo tipo de combate, onde e quando possível. Isso aumentará a proficiência de nossos soldados e sua capacidade de sustentar o combate em diferentes ambientes."
 CAS_ideas_future_navies_program:0 "Programa de Marinhas do Futuro"
 CAS_ideas_future_navies_program_desc:0 "Ao concentrar nosso financiamento em sistemas de armas e expandir preventivamente o poder de fogo de diferentes embarcações, podemos melhorar nossa capacidade geral de combate."
 CAS_ideas_tomorrows_navy:0 "A Marinha de Amanhã"
 CAS_ideas_tomorrows_navy_desc:0 "Ao preparar para o futuro a construção naval e a composição das frotas, podemos aumentar muito o poder de fogo e a flexibilidade de nossa marinha."
 CAS_ideas_design_standards:0 "Padrões de Projeto"
 CAS_ideas_design_standards_desc:0 "Ao padronizar os projetos das embarcações navais, podemos reduzir o excesso no uso de recursos."
 CAS_ideas_survivability_designs:0 "Projetos de Sobrevivência"
 CAS_ideas_survivability_designs_desc:0 "Ao focar nas taxas de sobrevivência do pessoal naval, podemos garantir que a perda de experiência e de recursos humanos numa guerra prolongada seja minimizada ao máximo."
 CAS_ideas_weapons_testing_facilities:0 "Instalações de Teste de Armas"
 CAS_ideas_weapons_testing_facilities_desc:0 "Ao rotular uma instalação genérica de teste de armas, podemos não apenas cumprir o nome, mas também esconder outros avanços em contramedidas em meio a todas as armas. No geral, nossa capacidade de controlar os céus deve ser pouco ou nada contestada."
 CAS_ideas_improved_payload_methods:0 "Métodos de Carga Útil Aprimorados"
 CAS_ideas_improved_payload_methods_desc:0 "Investimentos gerais na melhoria da entrega da carga útil, bem como na capacidade da aeronave de acertar o alvo, são o que precisamos para garantir que a vontade de nossos inimigos seja esmagada."
 CAS_ideas_bomber_centric_production:0 "Produção Centrada em Bombardeiros"
 CAS_ideas_bomber_centric_production_desc:0 "Ao concentrar nossos esforços de produção em bombardeiros e tipos de aeronaves semelhantes, podemos esmagar o espírito de nossos inimigos bombardeando-os até a submissão."
 CAS_ideas_assistance_department:0 "Departamento de Assistência de Campo do Exército"
 CAS_ideas_assistance_department_desc:0 "O AFAD é o departamento conjunto de prontidão dos ramos que ajuda a coordenar as operações de combate do exército."
 CAS_ideas_cascadian_armed_services_refined:0 "Forças Armadas Cascadianas \"Refinadas\""
 CAS_ideas_cascadian_armed_services_refined_desc:0 "Por meio de investimento contínuo em tempo, energia e recursos, tanto humanos quanto materiais, finalmente criamos uma força militar funcional. Com isso, podemos investir mais no treinamento e na melhoria da liderança dessa nova força de combate, para que ela não decaia nem definhe."
 CAS_ideas_domestic_stability_programs:0 "Programas de Estabilidade Interna"
 CAS_ideas_domestic_stability_programs_desc:0 "Programas comunitários, reformas policiais e formas justas de se aproximar melhor do público são o principal objetivo dos DSPs. Esperamos fomentar um senso de unidade em vez de divisão perpétua."
 CAS_ideas_cambrian_unity_initiatives:0 "Iniciativas de Unidade Cambriana"
 CAS_ideas_cambrian_unity_initiatives_desc:0 "Se quisermos consolidar nossas terras e unir o povo, devemos criar programas que permitam ao nosso povo sentir-se como um só."
 CAS_ideas_civil_service_integration_programs:0 "Programas de Integração do Serviço Civil"
 CAS_ideas_civil_service_integration_programs_desc:0 "Para garantir a coesão social e fomentar a unidade nacional, devemos primeiro começar a integrar e padronizar os serviços civis. Com isso, podemos ser mais proativos no contato com a comunidade e nas interações sociais gerais com o público em geral."
 cascadia_divided_we_fell:0 "Divididos Caímos"
 cascadia_divided_we_fell_desc:0 "A república se foi e das sombras emergimos em nosso pequeno canto do continente. Lutando contra a agitação interna e uma sociedade disfuncional, sem falar nas tensões com um grupo chamado Resistência das Montanhas Rochosas, que crescem a cada dia. Devemos buscar garantir o básico antes de podermos pensar em avançar."
 cascadia_domestic_policies:0 "Departamento de Assuntos Internos"
 cascadia_domestic_policies_desc:0 "O DoDA é um departamento geral de políticas internas que busca melhorar a atitude do público em relação a olhar para fora, além de ampliar o acesso a certos pilares domésticos fundamentais, como pesquisa, comunidade e alguns programas sociais. Em suma, o departamento garante o bem-estar geral do nosso povo em coesão com outros departamentos e suas funções mais específicas, que podem afetar as capacidades do DoDA."
 cascadia_federal_budgets:0 "Departamento de Orçamento"
 cascadia_federal_budgets_desc:0 "O DoB é responsável por regular os excessos e, em geral, as despesas do governo federal e de seus vários programas. Trabalha em conjunto principalmente com o Departamento do Tesouro."
 cascadia_tax_policies:0 "Departamento do Tesouro"
 cascadia_tax_policies_desc:0 "O Tesouro é responsável por fiscalizar e contabilizar as receitas geradas pela nossa nação e seu povo. O Departamento do Tesouro trata de todas as receitas geradas e depois trabalha em conjunto com o Departamento de Orçamento para criar um programa orçamentário equilibrado e relativamente justo e um código tributário para o funcionamento geral da nação."
 cascadia_industrial_policies:0 "Departamento de Desenvolvimento Industrial"
 cascadia_industrial_policies_desc:0 "O DoID é responsável pelas regulamentações e pelo desenvolvimento nacional geral de sua capacidade manufatureira e industrial. O departamento ajuda a tornar eficiente o pouco de terra que temos para desenvolvimento, já que a agricultura, a habitação e o terreno reduzem a capacidade geral de nossa nação de crescer tanto em população quanto economicamente."
 cascadia_resource_management_policies:0 "Departamento do Trabalho"
 cascadia_resource_management_policies_desc:0 "O DoL é responsável pelo emprego e pela estrutura da composição da força de trabalho da nossa nação. Trabalha com o DoDA e o DoID para garantir que uma força de trabalho flexível e funcional consiga se adaptar e fazer parte da economia como um todo."
 cascadia_army_service_branch:0 "Exército de Montanha Cascadiano"
 cascadia_army_service_branch_desc:0 "O CMA é o ramo do exército das Forças Militares Cascadianas. Este ramo é o elemento terrestre, que geralmente se especializa em guerra de montanha e similares, devido às várias cadeias montanhosas que compõem as terras da própria Cascádia."
 cascadia_air_force_service_branch:0 "Força Aérea Cascadiana"
 cascadia_air_force_service_branch_desc:0 "A CAF é o ramo de aviação das Forças Militares Cascadianas. Este ramo é o elemento aéreo, que tende a se especializar em treinamento de agilidade devido ao terreno áspero e irregular que precisa atravessar ao tentar qualquer ataque contra alvos terrestres."
 cascadia_navy_service_branch:0 "Marinha Cascadiana"
 cascadia_navy_service_branch_desc:0 "A CN é o ramo naval das Forças Militares Cascadianas. Este ramo é o elemento marítimo, que defende as águas costeiras e as vilas ou cidades espalhadas pelo litoral da nação. Embora não seja totalmente única, a marinha da Cascádia tem uma vantagem defensiva maior devido à configuração e aos campos de treinamento que são as águas costeiras do estado de Washington."
 CAS_monarchism_tooltip_desc:0 "§YCascádia§! muda de nome para §YDucados Unidos da Cascádia§!"
 CAS_pan_pacific_union_tooltip_desc:0 "§YCascádia§! muda de nome para §YUnião Pan-Pacífica§!"
 CAS_cambria_path_complete_desc:0 "§YCascádia§! muda de nome para §YCambria§!"
 CAS_second_american_republic_desc:0 "§YCascádia§! muda de nome para §YA Segunda República Americana§!"
 CAS_flag_we_go_to_war:0 "Então Os Tomaremos à Força!"
 CAS_Olympia_capital_desc:0 "§YOlympia, Utah§! é ratificada como a nova capital federal."
 CAS_Centralia_capital_desc:0 "§YCentralia, Kansas§! é constituída como a nova capital federal."
 CAS_Shelby_capital_desc:0 "§YShelby, Kentucky§! é estabelecida como a nova capital federal."
 CAS_DC_capital_desc:0 "§YWashington D.C.§! é restabelecida como a capital federal."
 CAS_Olympia_capital: "Olympia"
 CAS_Old_Olympia:0 "Velha Olympia"
 CAS_Centralia_capital: "Centralia"
 CAS_Shelby_capital: "Shelby"
 CAS_creating_the_mountain_marauders:0 "Criando os Saqueadores da Montanha"
 CAS_creating_the_mountain_marauders_desc:0 "Precisaremos de alguma força pronta para mobilizar caso queiramos enfrentar qualquer situação que nos for lançada."
 CAS_creating_infantry_reserves:0 "Criando Reservas de Infantaria"
 CAS_creating_infantry_reserves_desc:0 "O futuro é incerto. Se seremos nós a alcançar além do horizonte ou alguma força estrangeira, pouco importa. Por isso, devemos estabelecer as reservas prontas para garantir que, quando e se chegar a hora, estaremos preparados para eles."
 CAS_mobilizing_the_reserves:0 "Mobilizando as Reservas"
 CAS_mobilizing_the_reserves_desc:0 "A hora chegou, damos um passo rumo ao futuro que desejamos. Mobilizem as reservas, iremos à guerra!"
 cascadian_politics_event.1.t:0 "Mal de Escolhas"
 cascadian_politics_event.1.d:0 "À medida que a nação se prepara para sua primeira eleição nacional, muitos estão criando seus próprios partidos políticos e afins. A verdadeira questão é: que rumo o povo realmente quer tomar? É difícil dizer nesta fase inicial, mas até agora elementos de partidos como o das forças armadas, o Partido Empresarial de Boise e o Partido da Montanha Vermelha parecem ganhar força, embora pareça que isso esteja mais fatiando a torta política do eleitorado do que consolidando a força dos próprios partidos. Mas quem sabe, dizem que Deus ajuda quem cedo madruga, então quem sabe."
 cascadian_politics_event.1.o1:0 "Deus, Em Quem Eu Voto?"
 cascadian_politics_event.2.t:0 "Cortando o Bolo"
 cascadian_politics_event.2.d:0 "Enquanto cabines de votação e locais designados são criados, assim como, em geral, a organização do processo de votação para realizar a própria eleição, o povo da nação começou a se consolidar em partidos políticos e em diferentes visões sobre como conduzir nossa nação. Alguns buscam manter os verdadeiros princípios democráticos ocidentais, outros buscam olhar mais para a autocracia ou o socialismo e as influências gerais do oriente, e outros simplesmente querem olhar para nós mesmos e não usar outras nações como base, mas sim os princípios de sua ideologia para a nossa nação. Uma espécie de visão centrada na Cascádia, por assim dizer; por fim, há também aqueles que buscam ser mais firmes e autoritários, adotando a ideia centrada na Cascádia e sendo mais nacionalistas. Seja como for, a eleição ainda está a algum tempo de distância."
 cascadian_politics_event.2.o1:0 "Os Princípios Ocidentais Nos Guiarão à Prosperidade"
 cascadian_politics_event.2.o2:0 "Os Azarões do Oriente Nos Guiarão à Solidariedade"
 cascadian_politics_event.2.o3:0 "Nossa Nação É Nossa para Guiar e Fazer Crescer"
 cascadian_politics_event.2.o4:0 "Nossa Nação É Nossa para Afirmar e Expandir!"
 cascadian_politics_event.100.t:0 "Cresce a Influência Ocidental"
 cascadian_politics_event.100.d:0 "Nas últimas semanas parece que mais princípios e práticas ocidentais conquistaram cada vez mais o eleitorado. À medida que entramos nas fases finais, cabe agora aos principais partidos surgidos desse movimento tentar tomar a iniciativa. O Partido dos Consumidores Cascadianos, o Partido dos Novos Conservadores, o Partido Liberal da Cascádia e o Partido do Progresso Social certamente têm muito trabalho pela frente."
 cascadian_politics_event.100.o1:0 "Chegue Mais e Junte-se a Nós Hoje"
 cascadian_politics_event.101.t:0 "Os Quatro Finalistas"
 cascadian_politics_event.101.d:0 "À medida que os votos começam a ser depositados e contados, chega-se a uma disputa final entre quatro. A corrida apertada se resume ao partido pró-empresas conhecido como Partido dos Consumidores Cascadianos, ao Partido dos Novos Conservadores de centro-direita, ao Partido Liberal da Cascádia de centro-esquerda e, por fim, ao movimento progressista que é o Partido do Progresso Social. Esses quatro logo serão reduzidos a um vencedor ou a alguma coalizão geral, se as coisas não ficarem claras o bastante."
 cascadian_politics_event.101.o1:0 "Vote com Mais do que Seu Dinheiro, Vote no Partido dos Consumidores Cascadianos!"
 cascadian_politics_event.101.o2:0 "Mãos Firmes Fazem Votos Firmes, Vote nos Novos Conservadores!"
 cascadian_politics_event.101.o3:0 "Vote pela Mudança, Vote no Partido Liberal da Cascádia!"
 cascadian_politics_event.101.o4:0 "Vote pelo Progresso, Vote no Partido do Progresso Social!"
 cascadian_politics_event.200.t:0 "Crescem os Valores Orientais"
 cascadian_politics_event.200.d:0 "Os valores autocráticos e socialistas do leste e do extremo oriente, como Rússia, China e Ásia Central, para citar alguns, estão se tornando mais populares. A dinâmica interessante, no geral, parece ser de crescimento coletivo, mas também de uma divisão crescente entre socialistas e autocratas. Essa dinâmica provavelmente dividirá o voto, mas, no fim, o rumo da nação parece exigir uma abordagem mais igualitária ou mais de pulso firme daqui em diante. Só espero que seja a melhor escolha que poderíamos ter feito."
 cascadian_politics_event.200.o1:0 "Hã... Tem Certeza Disso?"
 cascadian_politics_event.201.t:0 "Autocracia contra Comunismo"
 cascadian_politics_event.201.d:0 "Conforme os votos começam a ser contados, a divisão crescente entre esse punhado final de partidos se torna cada vez maior. Logo saberemos qual direção nossa nação tomará. A divisão atual é entre os partidos da primazia autocrática, que incluem o Partido por uma Grande Cascádia e os Conservadores pela Cascádia. Do outro lado, no canto comunista, temos o Partido da Montanha Vermelha e o Partido Popular da Cascádia. Disso prepararemos o palco para um futuro que se firmará e abrirá precedente para os anos vindouros."
 cascadian_politics_event.201.o1:0 "Um Voto no Partido da Montanha Vermelha É um Voto na Força na Igualdade"
 cascadian_politics_event.201.o2:0 "Um Voto no Partido Popular da Cascádia É um Voto na Unidade"
 cascadian_politics_event.201.o3:0 "Um Voto na Direita É um Voto nos Conservadores da Cascádia"
 cascadian_politics_event.201.o4:0 "Um Voto na Força É um Voto numa Grande Cascádia"
 cascadian_politics_event.300.t:0 "Meu Deus, Mais Escolhas"
 cascadian_politics_event.300.d:0 "As coisas seguem em frente conforme os votos começam a ser depositados e mais eleitores continuam a se reunir em torno de um conjunto de partidos mais voltados ao âmbito interno. Sem influências externas ou estrangeiras inerentes pressionando nossa jovem nação, parece que o povo se voltou para uma mistura interessante de partidos políticos de esquerda e de direita. Mas ainda é cedo demais para apontar um vencedor ou \"vencedores\"."
 cascadian_politics_event.300.o1:0 "Esquerda ou Direita, Em Cima ou Embaixo, Gire a Roda e Gire Sem Parar"
 cascadian_politics_event.301.t:0 "Ter o Bolo e Comê-lo Também"
 cascadian_politics_event.301.d:0 "As coisas se aproximam da conclusão e, por isso, cabe ao próprio povo determinar o rumo que nossa jovem nação tomará. Disso, o Partido da Grande Cascádia, o Partido Empresarial de Boise, o Partido da Liberdade Cascadiano ou o Partido Robin da Cascádia acabarão vencendo de forma absoluta ou, se ninguém conseguir a maioria, precisarão trabalhar juntos numa coalizão e abrir um precedente, por anos e potencialmente décadas, de coesão e ações políticas."
 cascadian_politics_event.301.o1:0 "Um Voto na Grandeza É um Voto na Própria Cascádia"
 cascadian_politics_event.301.o2:0 "Vote em Negócios para Votar na Economia, Vote no Partido Empresarial de Boise Hoje"
 cascadian_politics_event.301.o3:0 "Um Voto na Liberdade É um Voto em Você"
 cascadian_politics_event.301.o4:0 "Bem-Estar Social e Equidade Econômica, Eleja o Robin Hoje"
 cascadian_politics_event.400.t:0 "O Fervor Nacionalista Toma a Nação"
 cascadian_politics_event.400.d:0 "Conforme as coisas se desenrolam, mais e mais eleitores se voltam para partidos de estilo mais nacionalista. Esses partidos formam um leque da direita, alguns um tanto desagradáveis para o cidadão eleitor mais moderado. Contudo, levará tempo para descobrir o que se materializará a partir desse crescimento do nacionalismo."
 cascadian_politics_event.400.o1:0 "Cascádia para os Cascadianos"
 cascadian_politics_event.401.t:0 "Quão Amargos Estamos?"
 cascadian_politics_event.401.d:0 "As coisas continuam esquentando enquanto uma batalha pelo primeiro lugar é travada entre uma variedade de partidos curiosamente diferentes. Ironicamente, entre os mais moderados dos quatro esquisitos, como os niilistas passaram a chamar as principais opções que surgiram, temos a Casa de Olympia, um partido monarquista parte do Movimento Nova Onda. Esse partido pretende criar uma Monarquia Eletiva com uma constituição como autoridade juridicamente vinculante. Embora muitos sejam céticos quanto a essa plataforma de \"conto de fadas\", outros parecem um pouco mais atraídos pela reaproximação de ideias antigas com novos ideais. Em seguida temos o Partido Força e Unidade, uma espécie de partido populista de direita típico; alguns brincam chamando-o de Partido Cascádia Primeiro, dadas as escolhas flexíveis, mas pró-Cascádia, da plataforma em geral. Depois vem a ala política do que parece ser o Exército Cascadiano; este partido parece mais flexível economicamente, mas aparenta ser mais socialmente conservador, com as coisas tendo natureza mais militarizada. Embora alguns não gostem do período de serviço obrigatório proposto, os programas coesos para estar \"pronto para qualquer coisa\" também são bastante atraentes. Por fim, temos a Brigada Escarlate, bastante malvista, um movimento e/ou partido político orientado pela métrica de: vamos pegar o que o Partido Força e Unidade está fazendo e elevar isso a uns 10 e mais um pouco, já que esses caras são bem fracos nas questões \"reais\". Seja como for, teremos que esperar a contagem dos votos para ter certeza de quem será o vitorioso."
 cascadian_politics_event.401.o1:0 "Força e Unidade Juntas"
 cascadian_politics_event.401.o2:0 "A Brigada Escarlate Marcha para a Vitória"
 cascadian_politics_event.401.o3:0 "A Primeira de Muitas Vitórias Militares por Vir"
 cascadian_politics_event.401.o4:0 "Olympia Ascende às Estrelas, e Seu Povo Também"
 cascadian_foreign_policy_event.1.t:0 "Ânimos Exaltados Causam Baixas"
 cascadian_foreign_policy_event.1.d:0 "Mais cedo hoje, vários grupos foram flagrados provocando guardas de fronteira. O governo cascadiano nega responsabilidade e se ofereceu para punir severamente a negligência criminosa de seus cidadãos. No entanto, achamos difícil acreditar que uma nação que já se movimentou tanto pelo continente seja meramente \"inocente\". Assim, temos uma escolha real a fazer. Podemos escalar e levar a luta até eles, ou podemos supostamente aceitar seus termos e descobrir o que planejam em seguida. Nossa posição geopolítica significa que estamos com a bola, e a Cascádia parece querer tomá-la de volta ou destruí-la."
 cascadian_foreign_policy_event.1.o1:0 "Cuidaremos Deles Pessoalmente"
 cascadian_foreign_policy_event.1.o2:0 "Enviar Nossas Sinceras Desculpas"
 cascadian_foreign_policy_event.2.t:0 "O Canadá Pede Desculpas"
 cascadian_foreign_policy_event.2.d:0 "Apesar de nossos melhores esforços para provocar o governo canadense a agir, fracassamos. Agora enfrentamos uma escolha difícil. Recuar e nos contentar com o que temos, ou reunir as tropas e nos preparar para a guerra em nossos termos."
 cascadian_foreign_policy_event.2.o1:0 "Não Podemos Arcar com Tal Escalada"
 cascadian_foreign_policy_event.2.o2:0 "Dane-se Isso, Reunir as Tropas!"
 CAS_revanchist_event.1.t:0 "Um Dilema Capital"
 CAS_revanchist_event.1.d:0 "O continente é nosso, porém as coisas ainda estão em ruínas e uma nova questão se coloca. Onde instalar o novo governo nacional? Claro que muitos dirão simplesmente devolvê-lo a D.C. No entanto, muitos outros acreditam que, pela posição da antiga capital, ela criou uma barreira natural entre o governo e seu povo. Por isso temos topógrafos em Utah, Kansas e Kentucky para ver se encontramos uma área boa e mais centralizada, ou ao menos mais aberta, para que seja melhor para o povo ver e fazer suas vozes serem ouvidas. Claro que também podemos considerar reformar a antiga capital; pelo menos não faria mal."
 CAS_revanchist_event.1.o1:0 "Precisamos Mesmo Dessa Pompa?"
 CAS_revanchist_event.2.t:0 "A Decisão"
 CAS_revanchist_event.2.d:0 "Com os preparativos concluídos e as opções alinhadas, devemos agora decidir onde ficará a futura capital federal da nossa segunda república. Deve ser no centro-oeste, no centro do continente, no centro-leste ou devolvida ao Distrito de Colúmbia?"
 CAS_revanchist_event.2.o1:0 "Centro-Oeste"
 CAS_revanchist_event.2.o2:0 "Centro do Continente"
 CAS_revanchist_event.2.o3:0 "Centro-Leste"
 CAS_revanchist_event.2.o4:0 "Vamos Usar o Que Temos"
 CAS_focus_military_automation_investments:0 "Investimentos em Automação Militar"
 CAS_focus_military_automation_investments_desc:0 "Quanto mais expandimos nossa capacidade industrial militar, mais gente será necessária no lado econômico das coisas. Portanto, devemos fazer investimentos estratégicos e direcionados em automação para garantir que nossa indústria militar não seja um dreno maior para nossa economia e nosso povo do que tradicionalmente seria."