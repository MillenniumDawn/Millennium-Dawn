 free_operations: "Operaciones Libres"
 free_operations_desc: "Con la reciente retirada de EE. UU. de la región, ahora podemos operar con más libertad táctica y operativa que antes."
 continued_space_efforts: "Esfuerzos Espaciales Continuos"
 continued_space_efforts_desc: "Nuestros esfuerzos continuos en el espacio nos están brindando oportunidades adicionales de investigación y un gran futuro por venir."
 space_force: "Fuerza Espacial"
 space_force_desc: "Quien domine la tierra, dominará el continente. Quien domine los mares, dominará las costas. Quien domine el cielo dominará ambos, y quien domine el espacio dominará la Tierra."
 space_marines: "Marines Espaciales"
 space_marines_desc: "El Servicio Garantiza la Ciudadanía!"
 USA_idea_high_price_for_high_rewards: "Alto Precio por Altas Recompensas"
 USA_idea_high_price_for_high_rewards_desc: "La 2ª Gran Carrera Espacial ha comenzado. Nunca sabremos realmente quién será el ganador de esta carrera, la luna, Marte, tal vez incluso Venus. ¿Quién sabe y, a estas alturas, a quién le importa? El potencial ha sido infinito y hemos abierto la caja de Pandora al adquirir y encontrar recursos, ya que ya no estamos limitados a nuestro planeta. Nos ha costado mucho, pero al final realmente vale la pena."
 USA_idea_aas_the_village_model: "El Modelo de Aldea"
 USA_idea_aas_the_village_model_desc: "By encouraging a new age of homesteading as well as breaking up corporate and office type entities. This in turn deurbanizes as well as decentralizes the economy and makes it a lot more manageable and understood by the average citizen. This model will also hope to create volunteers and defenders for they are not just fighting for a collective large entity, they are truly fighting for their homes and families."
 USA_idea_aas_the_new_agrarian: "El Nuevo Agrario"
 USA_idea_aas_the_new_agrarian_desc: "Uno de los mayores problemas globales es el de asegurar los alimentos para sobrevivir. Ya sea a través de escaseces naturales o provocadas por el ser humano, esta realidad juega a nuestro favor. Si podemos enfocarnos por completo en alentar a nuestros colectivos a regresar a un estilo de vida más tradicional, podríamos usar cualquier exceso que se produzca como moneda de cambio para asegurar nuestra independencia de agentes extranjeros. Será un poco duro económicamente hablando, pero prevaleceremos en nombre de la madre anarquía."
 USA_idea_aas_minuteman_program: "El Programa del Minuteman"
 USA_idea_aas_minuteman_program_desc: "Para defender el hogar y el corazón, nuestro pueblo hará todo lo posible para proteger lo que es suyo. Mediante guías locales y comprendiendo las realidades de la tecnología térmica moderna, vislumbraremos un futuro en el que nuestra gente estará allí en no más de un minuto para defender lo que les pertenece."
