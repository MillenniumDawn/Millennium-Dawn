 howard_doctrine_tt: "§2결정§! 탭에서 새로운 해외 활동을 사용할 수 있게 됩니다."
 ast_international_missions: "국제 임무"
 ast_international_missions_desc: "우리의 독트린은 기존의 것을 존중하면서도 유익하다고 판단되는 새로운 기회를 탐색할 수 있는 유연성을 나타냅니다. 오스트레일리아는 찬란한 새 미래의 문턱에 서 있습니다. 약간의 추진력만 더해 주면 됩니다."
 aus_us_visit: "미국 국빈 방문"
 aus_china_visit: "중국 국빈 방문"
 aus_norm_nk: "북한과의 관계 정상화"
 aus_sk_visit: "한국 국빈 방문 접견"
 aus_tur_visit: "튀르키예 갈리폴리 기념식"
 aus_rus_visit: "러시아 국빈 방문"
 aus_eng_visit: "군주의 국빈 방문 접견"
 ast_political_decisions: "정치 결정"
 ast_political_decisions_desc: "나라를 운영하려면 때로는 소매를 걷어붙이고 손에 기름칠을 해야 합니다. 산업계의 거물이든 정부와 가까운 이들이든, 우리가 막후에서 하는 일이 나라를 굴러가게 합니다. 정직한 일은 아니지만, 꽤 큰 일입니다."
 ast_approach_the_unions: "노조에 접근"
 ast_approach_the_unions_desc: "우리 중 누구도 노조를 상대하는 것을 좋아하지 않지만, 산업계에서 진전을 이루려면 타협은 불가피합니다. 개혁 노력은 여기에 달려 있습니다."
 ast_manufacturer_subsidies: "제조업체 보조금"
 ast_manufacturer_subsidies_desc: "보조금은 생산 공장의 WD-40과도 같습니다. 일부 공장이 매끄럽게 돌아가지 않을 때 보조금을 꺼내 들고 제자리를 찾기를 기대하는 것입니다."
 ast_cabinet_reshuffle: "내각 개편"
 ast_cabinet_reshuffle_desc: "최근 내각이 당의 노선에 뒤처지고 있습니다. 일부는 단순히 직무에 맞지 않고, 다른 일부는 명백히 불복종합니다. 다행히 당 대표로서 우리에게 주어진 몇 안 되는 권한 중 하나를 활용할 수 있습니다. 내각을 개편하여 우리에게 우호적인 인사들을 전면에 배치하고, 협조에 소극적인 이들을 제외할 수 있습니다."
 ast_loosen_gambling_restrictions: "도박 규제 완화"
 ast_loosen_gambling_restrictions_desc: "많은 오스트레일리아인의 악습은 도박입니다. 도박은 어떤 식으로든 우리 경제의 거의 모든 혈관에 스며들어 있습니다. 최근 몇 년간 우리 정책은 이 산업을 강하게 압박해 왔지만, 규제를 조금 완화하면 단기적 이익을 얻고 모두를 만족시킬 수 있습니다."
 ast_revisit_zoning_laws: "용도지역 법규 재검토"
 ast_revisit_zoning_laws_desc: "현재 부지에 건물을 지을 때 '무엇을, 어디에, 어떻게' 지을지는 주 정부와 지방 의회가 정합니다. 최근 부동산 개발업자들이 일부 제약을 풀어 달라고 우리를 끈질기게 압박하고 있습니다. 지침을 재검토하면 이러한 우려를 일부 해소할 수 있습니다."
 cdep: "지역사회 개발 고용 프로젝트"
 cdep_desc: "원래 이 프로그램은 원주민 공동체가 스스로 개발 프로젝트를 계획하고 건설할 수 있기를 바라는 데서 비롯되었습니다. 프로그램은 그럭저럭 이어졌지만, 정부 전문가를 파견하고 가용 자금을 늘리면 프로젝트의 범위를 넓힐 수 있습니다."
 nielns: "국가 원주민 영어 읽기·쓰기 및 수리 전략"
 nielns_desc: "애버리지니와 토레스 해협 도서민의 문해율은 최근 몇 년간 급락했으며, 이미 낮은 출석률과 맞물려 재앙의 전조처럼 보입니다. 학교와 협력하여 학생들을 돕는 프로그램을 개발하면 많은 이들의 삶이 바뀔 수 있습니다."
 fam_violence_proj: "가정폭력 예방 프로젝트"
 fam_violence_proj_desc: "가정폭력은 90년대에 소수의 정치인만이 손대려 했던 추악한 진실이었습니다. 새로운 근거 기반 접근법 덕분에 절차가 더 체계적으로 바뀌었고 정치적 부담도 줄었으므로, 이에 자금을 지원하는 것은 우리에게 손쉬운 조치입니다."
 construct_recon_place: "화해의 광장 건설"
 construct_recon_place_desc: "여러 도시 경관 제안서가 작성되어 승인을 위해 우리 책상 위에 놓여 있습니다. 그중 으뜸은 캔버라의 화해의 광장입니다. 승인된다면 우리의 노력을 보여 주는 훌륭한 증거가 될 수 있습니다."
 repatriate_remains: "원주민 유해 송환"
 repatriate_remains_desc: "영국 박물관들이 다른 나라에서 약탈한 유물을 다수 소장하고 있다는 것은 공공연한 비밀입니다. 그중에는 인골도 포함되어 있습니다. 여러 원주민 단체가 유해를 오스트레일리아로 돌려보내 매장할 수 있도록 청원했습니다."
 mabo_referendum: "화해 선언 개헌"
 mabo_referendum_desc: "헌법 전문에 화해 선언을 공식 포함하도록 헌법을 개정하여, 원주민 오스트레일리아인의 토지에 대한 권리를 인정합니다."
 ast_walk_the_journey_tt: "화해 노력과 관련된 프로그램과 행동이 정치 §2결정§! 탭에서 잠금 해제됩니다."
 mabo_vibe_tt: "화해 선언 개헌이 §2결정§!에서 사용 가능해집니다."
 ast_strong_in_difference_1_ast: "관리되는 다문화주의"
 the_lucky_country_ast: "행운의 나라"
 the_lucky_country_ast_desc: "수년간의 채굴 사업 확대와 다른 부문의 혁신 부족으로 우리는 수출 경제에 의존하게 되었습니다. 이곳에서 번영하려면 우리 대기업들이 깊이 파고들어 몫을 챙겨야 합니다. 그렇지 않다면 무언가가 바뀌어야 합니다."
 wind_power_grants_ast: "풍력 발전 보조금"
 acis_ast: "§2자동차 경쟁력 및 투자 계획§!"
 high_speed_ast_tt: "이 프로젝트는 §2결정§! 산업 탭에서 시작할 수 있습니다. 건설에는 막대한 비용이 들며 지연될 수 있습니다."
 lng_tt: "LNG 프로젝트가 산업 §2결정§! 탭에서 잠금 해제됩니다."
 encouraged_foreign_investment_ast: "해외 투자 장려."
 encouraged_foreign_investment_ast_desc: "국내 기업들은 표적 금융 지원과, 해외 투자를 간소화하고 장려하기 위한 정책을 통해 정부의 후원을 누리고 있습니다."
 diisr_ast_1: "DIISR"
 adf_sensor_upgrades: "ADF 센서 업그레이드"
 our_beloved_bushmaster_tt: "부시마스터의 §2생산 비용§!이 §G20%§! 감소합니다."
 lessons_from_the_middle_east_ast_1: "내열 개조"
 heef_ast: "고등교육 기금"
 ast_wholesale_economics_tt: "정부 일부를 민영화할 수 있는 §2결정§!이 정치 결정 탭에서 사용 가능해집니다."
 subdued_governor_general_ast: "위축된 총독"
 subdued_governor_general_ast_desc: "새 총독의 임명이 관료적 법적 이의 제기의 급류에 묶여 있는 지금, 우리는 왕실의 간섭을 걱정하지 않고 외교 입장을 바꿀 수 있습니다. 해임의 시대는 당분간 지나갔습니다."
 hostile_to_our_tradition: "우리의 전통에 적대적"
