 ABK_repatriation_idea: "송환 프로그램"
 CIS_two_member_state_idea: "CIS-2 회원국"
 CIS_two_member_state_idea_desc: "미승인 국가 연합(CUS) 또는 CIS-2는 구소련 영토의 미승인 국가들이 협의, 상호 원조, 협력 행동의 조율을 위해 만든 연합입니다."
 abkh.2.t: "압하지야의 CIS-2 군사 동맹 제안"
 abkh.2.d: "압하지야가 CIS-2를 군사 동맹으로 결성할 것을 제안하고 있습니다. 우리는 이러한 제휴에 동의하겠습니까?"
 abkh.2.a: "동의한다"
 abkh.2.b: "거절한다"
 abkh.3.t: "압하지야 출신 국제 여단 - \\"퍄트나시카\\""
 abkh.3.d: "압하지야 의용병들이 여단을 창설했으며, 이후 CIS 국가 전역에서 온 많은 지원자가 여기에 합류했습니다. 이제 그들은 우리와 함께 싸우고 있습니다."
 abkh.3.a: "만세"
 ABK_political_decisions: "압하지야 정치"
 ABK_political_decisions_desc: "압하지야 정치는 매우 복잡하면서도 동시에 단순합니다. 그 안에서는 국민의 불같은 기질과 독립에 대한 열망 사이에서 균형을 잡아야 합니다. 균형점을 찾을 수 있을까요?"
