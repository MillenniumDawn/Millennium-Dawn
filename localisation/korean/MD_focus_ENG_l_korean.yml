 ENG_type_23_lifex: "23형 수명 연장"
 ENG_type_23_lifex_desc: "23형 호위함은 선체 수명 18년을 기준으로 설계되었으나, 2000년대 중반에는 생존한 16척이 호위 전력 전체였습니다. 흔히 LIFEX로 불리는 수명 연장 계획은 데번포트에서 각 선체를 차례로 전면 개장했습니다. 새 디젤 발전기와 기어박스, 구조 갱신, 타입 996 레이더를 대체하는 아티잔 타입 997 레이더, 시 울프를 대체하는 시 셉터가 그 내용입니다. 이 작업으로 개별 함정의 취역 기간이 30년을 넘었고, 영국 해군은 후속함을 설계하는 데 필요한 10년을 벌었습니다."
 ENG_future_surface_combatant: "미래 수상 전투함"
 ENG_future_surface_combatant_desc: "1998년에 시작되어 여러 차례 재편된 미래 수상 전투함 계획은 22형과 23형 이후에 무엇이 올지를 규정하려는 시도였습니다. 이 계획은 지속 수상 전투 능력 연구와 대잠수함함, 범용함, 외양 초계함을 아우르는 C1, C2, C3 개념을 거쳐, 글로벌 전투함으로 홍보된 하나의 유연한 선체로 수렴했습니다. 이후 설계되는 모든 영국 호위함은 여기서 확정된 전제를 물려받습니다."
 ENG_ark_royal_class_carrier: "아크 로열급 항공모함"
 ENG_ark_royal_class_carrier_desc: "퀸 엘리자베스와 프린스 오브 웨일스가 취역한 지금, 그 다음에 무엇이 올 것인가가 문제가 됩니다. 개정된 설계로 건조되는 세 번째 선체는 한 척이 심층 정비에 들어갈 때마다 함대에 타격 항공모함이 없어지는 산술적 문제를 끝낼 것이며, 영국 군함 다섯 척이 사용했던 이름, 가장 최근에는 2011년에 퇴역한 인빈서블급 함정의 이름을 이어받을 것입니다."
 ENG_type_45_daring_class: "45형 데어링급 구축함"
 ENG_type_45_daring_class_desc: "1999년 영국이 3국 공동 호라이즌 호위함 계획에서 탈퇴한 후 발주된 45형은 시 바이퍼 체계, 마스트 상단에 장착된 샘프슨 다기능 레이더, S1850M 장거리 레이더를 중심으로 건조되었습니다. 42형을 대체하기 위해 2003년부터 2013년까지 고번, 스코츠턴, 포츠머스에서 여섯 척이 조립되었습니다. 데어링과 돈틀리스이 함급을 선도하며, 이들은 함께 영국 해군이 지금껏 운용한 가장 유능한 지역 방공 플랫폼을 이룹니다."
 ENG_aukus_programme: "AUKUS 계획"
 ENG_aukus_programme_desc: "2021년 9월에 발표된 AUKUS 파트너십은 영국, 미국, 오스트레일리아가 공동의 원자력 추진 공격 잠수함을 보유하기로 약속하는 것입니다. SSN-AUKUS 설계는 영국이 주도하며 애스튜트 후속함 연구에서 발전한 것으로, 롤스로이스의 원자로 설비를 미국의 전투 체계 및 수직 발사 체계와 결합합니다. 건조는 배로인퍼니스와 오즈번이 분담하며, 이 세기의 남은 기간 동안 세 곳의 산업 기반을 하나의 생산 라인으로 묶습니다."
 ENG_albion_class_lpd: "올비언급 상륙 플랫폼 도크함"
 ENG_albion_class_lpd_desc: "상륙 플랫폼 도크 대체 계획은 낡은 피어리스와 인트레피드를 대체하여 2003년과 2004년에 취역한 HMS 올비언과 HMS 불워크를 인도했습니다. 각 함정은 다목적 상륙정 네 척을 위한 침수식 도크, 차량 갑판, 중형 헬리콥터 두 대를 수용할 수 있는 비행 갑판, 상륙 기동 부대 참모진을 위한 지휘 공간을 갖추고 있습니다. 영국 해병대가 여단 규모를 상륙시키는 플랫폼입니다."
 ENG_royal_marines_future_commando_force: "미래 코만도 부대"
 ENG_royal_marines_future_commando_force_desc: "미래 코만도 부대 계획은 제3 코만도 여단을 대규모 상륙 강습에서 상시 전진 급습 쪽으로 전환시킵니다. 코만도는 소규모 자급 팀으로 작전하며, 교두보가 아닌 개조된 보조함과 연안 타격함에서 활동하고, 정찰, 파괴 공작, 핵심 해양 지형 장악을 위한 장비를 갖춥니다. 이는 제2차 세계 대전 이후 영국 해병대 교리에서 가장 큰 변화입니다."
 ENG_royal_marines_littoral_response_group: "연안 대응 집단"
 ENG_royal_marines_littoral_response_group_desc: "대서양 유럽권과 수에즈 동쪽에 각각 하나씩 배치된 두 개의 연안 대응 집단은 코만도 중대 집단과 그 수송함을 상시 해상에 유지합니다. 올비언급 도크함과 베이급 보조함을 중심으로 구성되어, 기동 부대를 편성하는 데 걸리는 수 주가 아니라 수일 안에 가용한 철수, 재난 구호, 협력군과의 훈련, 급습 능력을 상시 제공합니다."
 ENG_royal_marines_arctic_warfare_centre: "북극 전투 센터"
 ENG_royal_marines_arctic_warfare_centre_desc: "영국은 1970년대부터 NATO 북방 측면에 대한 한랭지 작전 의무를 맡아 왔으며, 매년 겨울 제3 코만도 여단을 바르두푸스와 포르상에르모엔에 파견합니다. 이 계절적 파견을 상설 훈련 기관으로 공식화하면 스키 및 산악 지도자 간부, 설상 차량 승무원, 생존 교관을 보존할 수 있고, 영국 해병대는 북극권 이북 작전에서 동맹의 기준 부대로 남게 됩니다."
 ENG_military.048.t: "AUKUS 제안"
 ENG_military.048.d: "런던은 워싱턴, 캔버라와 함께 공동의 원자력 추진 공격 잠수함을 중심으로 하는 3자 동반자 관계를 제안합니다. 영국의 설계는 애스튜트급 후속 연구에서 비롯되었으며 롤스로이스 원자로 설비를 미국의 전투 체계 및 수직 발사 셀과 결합합니다. 이 요청은 이전의 어떤 합의보다도 한 걸음 더 나아간 것입니다. 1958년 상호방위협정 이래 해군 원자력 추진 기술은 영국에게만 공유되어 왔으나, 영국은 이제 오스트레일리아도 이에 포함시킬 것을 요청하고 있습니다. 승인한다면 배로인퍼니스와 오스본이 하나의 생산 라인으로 연결되며, 이번 세기가 끝날 때까지 동인도양에 동맹국의 헌터킬러 잠수함이 배치될 것입니다."
 ENG_military.048.a: "추진 기술 협정을 캔버라에도 확대한다"
 ENG_military.048.b: "원자로는 1958년 협정의 테두리 안에 머문다"
 ENG_military.049.t: "원자력 잠수함인가, 재래식 계획인가"
 ENG_military.049.d: "영국과 미국은 오스트레일리아에 원자력 추진 공격 잠수함을 제안했으며, 이는 자국 핵무기가 없는 국가에 공급되는 최초의 사례입니다. 그 대가는 기존의 재래식 대체 사업이며, 이 계약은 전면 취소되어야 하고 유럽 측 협력사에는 보상이 이루어져야 합니다. 그 대신 HMAS 스털링을 통한 순환 배치, 오스본의 재건된 조선소, 그리고 우리 잠수함이 필요로 할 처리 능력을 확보하기 위해 영국과 미국의 산업 기반에 대한 지불이 따릅니다. 이 결정은 연방을 동맹국의 지원 없이는 유지할 수 없는 잠수함 전력과, 이를 공급하는 동반자 관계에 묶어 두게 됩니다."
 ENG_military.049.a: "주문을 취소하고 오스본에서 원자력 잠수함을 건조한다"
 ENG_military.049.b: "우리가 체결한 계약을 이행하겠다"
 ENG_military.050.t: "AUKUS 서명"
 ENG_military.050.d: "세 정부가 동반자 관계를 발표했습니다. 오스트레일리아는 영국의 설계로 건조된 원자력 추진 공격 잠수함을 운용하게 되며, 원자로 설비, 전투 체계, 그리고 이를 조립하는 조선소는 이제 공동 사업이 되었습니다. 배로인퍼니스는 애스튜트급 후속함을 수십 년간 뒷받침할 수출 주문을 확보하게 되었으며, 영국, 미국, 오스트레일리아의 해군 기술자들은 처음으로 공통의 도면 세트를 바탕으로 작업하게 될 것입니다."
 ENG_military.050.a: "세 해군, 하나의 잠수함"
 ENG_military.051.t: "계약 파기"
 ENG_military.051.d: "캔버라는 사전 경고도 협의도 없이 잠수함 사업을 취소했으며, 이는 우리 몰래 협상된 영미 측의 제안을 받아들이기 위해서입니다. 이 주문은 우리 조선소가 수주한 역대 최대 규모의 방위 계약이었으며, 그 상실은 이미 작업을 시작한 조선소와 설계 팀에 직접적인 타격을 줍니다. 우리 대사들이 소환되고 있습니다. 새로운 합의에 대한 전략적 논거가 무엇이든, 동맹국은 그러한 결정을 언론을 통해 알게 되지 않습니다."
 ENG_military.051.a: "배신이다"
 ENG_military.052.t: "워싱턴의 원자로 제공 보류"
 ENG_military.052.d: "미국은 해군 원자력 추진 기술을 1958년 협정 이상으로 확대하는 것을 거절했습니다. 핵확산 금지에 관한 반대는 언제나 제기될 수밖에 없었으며, 워싱턴은 그것이 전략적 이익보다 크다고 판단했습니다. 잠수함은 건조되겠지만, 혼자 건조하게 될 것입니다."
 ENG_military.052.a: "그렇다면 우리가 직접 건조한다"
 ENG_military.053.t: "캔버라의 거절"
 ENG_military.053.d: "오스트레일리아는 기존 잠수함 사업을 유지하기로 했습니다. 원자력 추진 잠수함 제안에는 취소 비용에서부터 반세기에 걸친 정비 의존에 이르기까지 캔버라가 수용할 준비가 되지 않은 의무가 따랐습니다. 동반자 관계는 진행되지 않을 것입니다."
 ENG_military.053.a: "그들이 마음을 바꾼다면 제안은 유효하다"
 ENG_military.054.t: "AUKUS 발표"
 ENG_military.054.d: "영국, 미국, 오스트레일리아는 공동의 원자력 추진 공격 잠수함을 첫 사업으로 하는 3자 안보 동반자 관계를 발표했습니다. 오스트레일리아는 핵무기가 없는 국가로서는 최초로 이를 운용하게 됩니다. 반응은 즉각적입니다. 확산 전문가들은 고농축 해군 연료의 안전장치에 의문을 제기하고, 베이징은 이 협정을 자국을 겨냥한 블록이라고 규탄하며, 계약이 취소된 유럽 협력사는 대사들을 소환했습니다."
 ENG_military.054.a: "인도·태평양의 균형이 바뀐다"
 AST_aukus_submarine_programme: "AUKUS 잠수함 사업"
 AST_aukus_submarine_programme_desc: "오스본의 조선소는 영국의 설계에 따라 원자력 추진 공격 잠수함을 조립할 수 있도록 재건되고 있으며, 배로인퍼니스와 미국 조선소로의 순환 배치를 통해 훈련된 인력이 투입됩니다. 원자로 설비는 밀봉된 상태로 도착하지만, 선체, 전투 체계 통합, 그리고 평생에 걸친 유지 보수 작업은 남오스트레일리아에 남아, 연방에 이전에는 이 규모로 가져 본 적 없는 잠수함 산업을 안겨 줍니다."
 britain_md.300.t: "설계 아래의 구성 요소"
 britain_md.300.d: "Arm이 아티즌 컴포넌츠를 인수하여, 프로세서 설계에서 모든 설계를 실제 실리콘으로 바꿔 주는 물리 라이브러리 분야로 진출하고 있습니다. 이는 순수한 라이선스 사업에서 벗어나 가치 사슬을 한 단계 올라서는 행보입니다. 재무부는 영국의 연구 지원 혜택이 그 회사를 따라가야 하는지 결정해야 합니다."
 britain_md.300.a: "연구 지원 혜택을 물리 설계 작업까지 확대한다"
 britain_md.300.b: "인수는 상업적 타당성에 맡긴다"
 britain_md.301.t: "모든 주머니 속의 프로세서"
 britain_md.301.d: "Arm 코어가 애플의 새 휴대전화 한가운데에 자리하고 있으며, 뒤따를 거의 모든 경쟁 제품에도 들어갈 것입니다. 칩 하나당 로열티는 몇 푼에 불과하지만 물량은 수십억 개에 달합니다. 케임브리지는 업계 전체가 의존하면서도 그 어느 것도 소유하지 못한 무언가를 만들어 냈습니다."
 britain_md.301.a: "그 주변의 케임브리지 설계 클러스터에 자금을 지원한다"
 britain_md.301.b: "라이선스 모델이 스스로 굴러가도록 둔다"
 britain_md.302.t: "64비트"
 britain_md.302.d: "ARMv8은 Arm 아키텍처를 64비트로 끌어올리며, 인텔이 이렇다 할 도전자 없이 지배해 온 서버와 데이터 센터로 진출하게 합니다. 화이트홀은 공공 컴퓨팅을 영국 아키텍처 편에 둘 수도, 시장에 맡길 수도 있습니다. 조달은 이를 신속하게 움직일 수 있는 유일한 수단입니다."
 britain_md.302.a: "공공 컴퓨팅을 해당 아키텍처에 맡긴다"
 britain_md.302.b: "플랫폼을 상업적으로 중립으로 유지한다"
 britain_md.303.t: "소프트뱅크의 제안"
 britain_md.303.d: "소프트뱅크가 어떤 영국 인수자도 맞출 수 없는 프리미엄으로 Arm에 243억 파운드를 제시했으며, 본사와 영국 인력 규모에 관한 확약을 덧붙였습니다. 회사는 케임브리지에 남겠지만 소유권은 영국 것으로 남지 않을 것입니다."
 britain_md.303.a: "매각이 완료되기 전에 공공 지분을 확보한다"
 britain_md.303.b: "확약을 받아들이고 매각을 진행시킨다"
 britain_md.304.t: "Arm에 400억 달러"
 britain_md.304.d: "엔비디아가 소프트뱅크로부터 Arm을 인수하기로 합의했습니다. 모든 주요 시장에서 엔비디아와 경쟁하는 Arm의 라이선스 고객들은 매각 이후 어떤 중립성이 남을지 공개적으로 의문을 제기했습니다. 결정은 경쟁 당국과 이를 지휘하는 장관들의 몫입니다."
 britain_md.304.a: "구속력 있는 행위 조건을 달아 매각을 승인한다"
 britain_md.304.b: "국가 안보를 이유로 회부한다"
 britain_md.305.t: "Arm이 상장되는 곳"
 britain_md.305.d: "소프트뱅크가 Arm을 다시 상장하려 하며 뉴욕을 택했습니다. 런던은 상장 규정, 지수 비중, 투자자 기반이 영국이 낳은 최대의 기술 기업을 붙잡을 수 없다는 말을 분명히 들었습니다. 상장을 국내에 두려면 이 세 가지를 모두 고쳐 써야 합니다."
 britain_md.305.a: "상장 규정을 개혁하여 런던에 상장을 붙잡는다"
 britain_md.305.b: "뉴욕 상장을 받아들이고 본사를 유지한다"
 britain_md.306.t: "Arm이 된 모습"
 britain_md.306.d: "사반세기에 걸친 라이선스, 인수, 상장을 거쳐 Arm이 무엇인지가 정해졌습니다. 아키텍처가 지구상의 거의 모든 휴대전화 안에 들어 있는 케임브리지 기업을 누가 소유하고, 어느 거래소가 그 가격을 매기는가 하는 문제입니다."
 britain_md.306.a: "아키텍처에 대한 국가 지분"
 britain_md.306.b: "남의 플랫폼의 아키텍처"
 britain_md.306.c: "국내 상장"
 britain_md.306.e: "세계에 라이선스를 주는 섬"
 ENG_arm_sovereign_architecture_stake: "아키텍처 국가 지분"
 ENG_arm_sovereign_architecture_stake_desc: "국가는 전 세계가 기반으로 삼는 명령어 집합을 보유한 기업의 지분을 갖고 있으며, 그 기업의 다음 방향에 대한 거부권도 가집니다. 이 지분은 시장보다 적은 수익을 내지만, 시장에서 팔지 않는 것을 얻게 해 줍니다."
 ENG_arm_foreign_platform_architecture: "외국 플랫폼의 아키텍처"
 ENG_arm_foreign_platform_architecture_desc: "Arm은 이제 더 큰 기업에 속해 있으며, 로드맵은 그 기업의 실리콘을 가장 먼저 위해 움직입니다. 공학 작업은 여전히 케임브리지에서 이루어지고 있으며, 그 규모는 어떤 독립 라이선서도 감당할 수 없는 수준이지만 조건은 남이 정한 것입니다."
 ENG_arm_listed_at_home: "국내 상장"
 ENG_arm_listed_at_home_desc: "상장은 런던에 남았고, 이를 유지하기 위해 규정이 고쳐졌습니다. 거래소는 마침내 기술 분야의 닻을 얻었으며, 이를 가능하게 한 개혁은 이후 상장하는 모든 기업에 적용됩니다."
 ENG_arm_licensing_island: "세계에 라이선스를 주는 섬"
 ENG_arm_licensing_island_desc: "설계는 영국의 것이지만 소유주는 그렇지 않으며, 주식은 뉴욕에서 거래됩니다. 영국은 기술자, 로열티, 명성은 지켰지만, 두 차례 주어졌다가 두 차례 거절된 통제권은 전혀 갖지 못했습니다."
 ENG_scottish_agitation_rising_tt: "스코틀랜드 동요가 10을 넘었습니다."
 ENG_north_irish_agitation_rising_tt: "북아일랜드 동요가 10을 넘었습니다."
 ENG_wales_agitation_rising_tt: "웨일스 동요가 10을 넘었습니다."
 devolution.20.t: "무장 해제 결렬"
 devolution.20.d: "무장 해제 독립 국제 위원회가 활동을 중단했습니다. 현지의 긴장은 감시단이 무기 은닉처를 확인하는 속도보다 빠르게 고조되었고, 준군사 조직 지도부들은 거리가 불타는 와중에 무장 해제하는 모습으로 비치느니 협상 담당자를 철수시켰습니다. 충성파와 공화파 조직 모두 총기가 결코 장애물이 아니었다고 주장하며 결렬의 책임을 서로에게 돌리고 있습니다. 사용 불능 처리된 무기가 되돌아오지는 않겠지만 더 이상의 무기가 인도되지도 않을 것이며, 강경파가 자신들이 옳았음이 입증되었다고 말할 수 있게 된 지금 이 운동을 다시 협상 테이블로 끌어내기는 훨씬 어려워질 것입니다."
 devolution.20.a: "긴장을 낮추고 다시 시도한다"
 devolution.21.t: "사용 불능"
 devolution.21.d: "위원회는 남은 무기고 전체의 무장 해제를 확인했다고 보고했습니다. 소총, 셈텍스, 박격포, 중기관총이 든 봉인된 은닉처들이 독립적인 감독 아래 영구히 접근 불가능한 상태가 되었으며, 양쪽 공동체의 성직자들이 입회했습니다. 수년간 평화 프로세스를 투항이라고 규탄해 온 반체제 분파들은 그렇게 규탄할 가치를 부여하던 단 하나의 근거를 잃었습니다. 신규 모집은 무너졌고, 미국 내 모금 조직도 말라붙었으며, 특별 수사대는 남은 것이 반란이 아니라 범죄 잔재라고 평가합니다. 북아일랜드는 아직 화해하지 못했지만, 1969년 이후 처음으로 무장하지 않은 상태가 되었습니다."
 devolution.21.a: "전쟁은 끝났다"
 devolution.23.t: "웨스트민스터, 통일 제안"
 devolution.23.d: "국경 투표에서 통일 아일랜드에 대한 과반수 찬성이 나왔으며, 협정 조건에 따라 영국 정부는 그 뜻을 이행할 의무가 있습니다. 런던은 더블린에 6개 카운티에 대한 주권을 받아들이라고 공식 초청했습니다. 제안은 현실이며, 그에 따르는 청구서도 현실입니다. 200만 명의 인구, 웨스트민스터가 수십 년간 부담해 온 보조금, 인구의 절반이 여전히 신뢰하지 않는 경찰 조직, 그리고 이에 반대표를 던졌고 어디로도 가지 않을 연합파 공동체가 그것입니다. 수락한다는 것은 공화국이 아일랜드 정치에서 가장 오래된 숙원과 함께 이 모두를 물려받는다는 뜻입니다. 거절한다는 것은 북부의 다수에게 공화국이 그들을 원하지 않는다고 말하는 셈입니다."
 devolution.23.a: "자유롭지 못한 아일랜드는 결코 평화로울 수 없다"
 devolution.23.b: "우리는 북부를 짊어질 준비가 되어 있지 않다"
 devolution.24.t: "국경 투표 부결"
 devolution.24.d: "개표가 끝났고 연합은 유지됩니다. 양측 모두 투표율이 높았고, 선거운동은 북아일랜드에서 늘 그렇듯 모두에게 그들을 갈라놓는 것이 무엇인지 상기시켰으나, 막상 질문이 던져졌을 때 답은 반대였습니다. 민족주의 정치인들은 이번 투표가 너무 일찍 실시되었는지를 두고 벌써 논쟁을 시작했으며, 연합파 정당들은 이 결과를 유예가 아니라 확정으로 받아들이고 있습니다. 북아일랜드 담당 장관은 가까운 시일 내에 다른 투표는 고려하지 않겠다고 확인했습니다."
 devolution.24.a: "질문은 답을 얻었다, 당분간은"
 devolution.25.t: "더블린, 수락"
 devolution.25.d: "아일랜드 총리는 공화국이 북아일랜드에 대한 주권을 받아들일 것이라고 의회에 확인했습니다. 이양은 협정 조건에 따라 진행되며, 연합파 공동체에 대한 보장이 합의문에 명시되고 원하는 모든 이는 영국 시민권을 유지합니다. 여기에는 설욕해야 할 패배도, 총구를 들이대고 강요한 조약도 없습니다. 한 세기에 걸친 아일랜드 문제는 한 번의 투표와 이양으로 마무리되며, 얼스터에는 결코 이곳을 고향이라 부르지 않을 수많은 사람들이 남게 됩니다."
 devolution.25.a: "국민이 말했다"
 devolution.26.t: "더블린, 거절"
 devolution.26.d: "공화국이 거절했습니다. 더블린의 장관들은 공개적으로는 정중했으나 비공개적으로는 직설적이었습니다. 보조금만으로도 그들의 예산이 바닥날 것이고, 안보 부담은 감당할 능력이 없으며, 자신들을 외세로 여기는 연합파 소수 집단을 물려받는 데 26개 카운티 어디에도 의욕이 없다는 것입니다. 북부는 떠나겠다고 표를 던졌으나 갈 곳이 없다는 말을 들었습니다. 민족주의 여론은 이 거절을 모욕으로 받아들였고, 그 결과를 감당해야 하는 것은 웨스트민스터입니다."
 devolution.26.a: "우리는 이 지방을 떠안게 되었다"
 devolution.27.t: "얼스터 봉기"
 devolution.27.d: "스토먼트는 사라졌고, 협정은 사문서가 되었으며, 공화파 운동을 정치 안에 붙들어 두던 헌법적 보장도 함께 사라졌습니다. 폐지 이후 폭동으로 시작된 사태는 이제 경찰청장조차 더 이상 공공 질서 문제라고 부르지 않는 무언가가 되었습니다. 경찰서가 점거당했고, 육군 순찰대는 대낮에 중화기 공격을 받고 있으며, 6개 카운티에 대한 권한을 주장하는 임시 행정부는 이 지방이 왕실로부터 독립했음을 선언했습니다. 영국이 마지막으로 이 전쟁을 치렀을 때는 30년의 세월과 협상에 의한 해결이 있어서야 끝났습니다. 이제는 되돌아갈 합의조차 없습니다."
 devolution.27.a: "그렇다면 무력으로 되찾는다"
 devolution.28.t: "국경 너머의 봉기"
 devolution.28.d: "영국이 협정을 찢어 버렸고 북부는 공공연한 반란 상태에 있습니다. 벨파스트의 임시 정부는 더블린에 승인, 무기, 병력을 요청했으며, 이 요청이 침묵을 하나의 대답으로 읽힐 만큼 공개적으로 이루어졌습니다. 헌법 제2조와 제3조는 폐지된 것이 아니라 개정되었을 뿐이며, 평생 바로 이 순간을 기다려 온 지지층이 이곳에 있습니다. 그러나 영국군이 있고, 영국의 핵 억지력이 있으며, 1998년 이후 공화국이 줄곧 주장해 온 국경은 동의에 의해서만 바뀐다는 모든 논거 또한 있습니다."
 devolution.28.a: "임시 정부를 승인하고 진군한다"
 devolution.28.b: "무기를 대되, 아무것도 인정하지 않는다"
 devolution.28.c: "이것은 우리의 전쟁이 아니다"
 ENG_decommission_paramilitaries: "준군사 조직 무장 해제"
 ENG_decommission_paramilitaries_desc: "무장 해제 독립 국제 위원회는 1997년부터 활동해 왔으나 완전한 무기고를 넘겨받은 적이 한 번도 없습니다. 협정을 거부한 공화파 반체제 분파들은 여전히 신병을 모집할 수 있는 한 무장 해제에 아무런 관심이 없으며, 단지가 가난하고 긴장이 높은 곳이면 어디서든 신병을 모집합니다. 위원회에 자금과 정치 자본을 투입하고, 중재자들이 계속 대화에 나설 만큼 종파 간 긴장도를 낮게 유지하며, 2년의 시간을 준다면 마지막 무기고들도 영구히 사용 불능 상태로 만들 수 있습니다. 긴장도가 다시 오르면 모든 과정이 붕괴됩니다."
 ENG_call_border_poll: "국경 투표 실시"
 ENG_call_border_poll_desc: "협정은 북아일랜드의 과반수가 아일랜드 통일에 투표할 가능성이 높아 보일 때마다 국무장관이 투표를 실시하도록 의무화하며, 영국 정부가 그 결과를 이행하도록 의무화합니다. 민족주의 정당들은 이제 스토몬트에서 균형추를 쥐고 있으며, 협정을 아예 파기하지 않고서는 이 요구를 더 이상 미룰 수 없습니다. 투표는 선거 운동에 1년이 걸리며 결과는 개표 시점에 북아일랜드 여론이 어떻게 변했는지에 따라 결정되므로, 1년간의 선거 운동은 투표 실시 결정만큼이나 중요합니다.!"
 ENG_border_poll_mission: "국경 투표 선거 운동"
 ENG_border_poll_mission_desc: "투표가 실시되었으며 선거 운동은 1년 동안 진행됩니다. 결과는 날짜가 정해졌을 때의 북아일랜드 민족주의의 위치가 아니라 투표일의 위치에 따라 결정될 것입니다. 명확한 민족주의 다수가 나온다면, 더블린이 받아들이는 한 이 지방은 연합왕국에서 벗어나 공화국에 편입됩니다. 그에 미치지 못한다면 헌법 문제는 수년간 종결되며, 투표에서 패배했고 스스로도 그 사실을 아는 민족주의 운동이 남게 됩니다.\n\n북아일랜드 민족주의: §Y[?ENG_north_irish_nationalists|0]§!\n명확한 찬성을 위해서는 §G65§! 이상이 필요합니다."
 ENG_all_ireland_dominion: "전 아일랜드 자치령"
 ENG_all_ireland_dominion_desc: "공화국이 이미 런던의 지시를 따르고 있으므로 국경은 헌법적 경계가 아닌 행정적 경계가 되었습니다. 6개 카운티를 더블린에 넘겨주는 것은 우리가 이미 확보하지 못한 어떤 것도 잃지 않습니다. 섬 전체가 우리가 통제하는 수도에서 통치되기 때문입니다. 이는 이 섬들에서 가장 오래된 불만을 우리에게 유리하게, 그리고 우리의 편의에 맞춰 해결하며, 보조금과 주둔군을 철수시키고 공화파 운동에는 축하할 수 없는 통일 아일랜드만을 남깁니다.\n\n이를 위해서는 북아일랜드의 권한 이양이 먼저 진정으로 안정되어야 합니다. 위기 한가운데에서 넘겨준 지방은 위기를 수출하는 것일 뿐 해결하는 것이 아닙니다.\n\n종파 간 긴장도: §Y[?ENG_north_irish_agitation|0]§!/§G10§!\n북아일랜드 의존도: §Y[?ENG_north_irish_dependency|0]§!/§G70§!\n독립 압력: §Y[?ENG_north_irish_pressure|0]§!/§G40§!"
 ENG_repeal_good_friday_agreement: "성금요일 협정 폐기"
 ENG_repeal_good_friday_agreement_desc: "이 협정은 우리에게 영구적인 보조금, 비대해진 경찰 조직, 그리고 한때 폭탄 테러 작전을 벌였던 자들이 장관직을 맡는 권력 분점 행정부를 요구합니다. 이를 폐기하고 스토몬트를 정지시켜 1998년 이전처럼 런던에서 이 지방을 직접 통치합시다. 절감 효과는 즉각적이며 다른 모든 것도 마찬가지입니다. 공화파 운동을 정치 안에 머무르게 했던 헌법적 보장은 사라지고, 준군사 조직이 돌아오며, 종파 간 긴장도는 이를 누그러뜨릴 아무것도 없는 상태로 온전한 무게로 체감될 것입니다.\n\n얼스터는 봉기할 것입니다. 우리에게는 그때까지 이 지방을 억누를 몇 달의 시간이 있습니다."
 ENG_repeal_gfa_remove_TT: "§Y$ENG_good_friday_agreement$§! 제거"
 ENG_ulster_on_the_brink_activated_TT: "§Y180§!일 안에 §Y북아일랜드 종파 간 긴장도§!를 §G20§! 미만으로 낮추지 못하면 임시 공화파 지도부가 §R독립§!을 선언하며 우리는 §Y얼스터§!를 두고 싸우게 됩니다"
 ENG_ulster_on_the_brink: "벼랑 끝의 얼스터"
 ENG_ulster_on_the_brink_desc: "협정은 사라졌으며 이 지방은 무너지고 있습니다. 폭동은 지속적인 양상이 되었고, 군은 70년대 이후 볼 수 없었던 규모로 거리에 돌아왔으며, 양 공동체는 아무도 자신들을 보호하러 오지 않을 것이라는 전제 아래 무장하고 있습니다. 6개월 안에 종파 간 긴장도를 다시 낮출 수 있다면 협정도 봉기도 없이 이 지방을 유지할 수 있습니다. 그렇지 못한다면 임시 공화파 지도부가 선언할 것이며 우리는 얼스터를 두고 싸우게 될 것입니다.\n\n종파 간 긴장도: §Y[?ENG_north_irish_agitation|0]§!\n§G20§! 미만으로 떨어져야 합니다."
 OPEN_devolution_BUTTON: "권한 이양 사안"
 OPEN_devolution_BUTTON_TT: "권한 이양 패널을 열어 스코틀랜드, 웨일스, 북아일랜드를 관리합니다."
