l_braz_por:
 TIE_pastoral_culture: "Cultura Nômade"
 TIE_pastoral_culture_desc: "The Toubou still mostly live as herders and nomads, with some being farmers near oases. Oases, pastures and wells are divided along clan lines. In the harsh deserts of the Sahara, there are few other opportunities for life"
 TIE_soborom_hot_springs: "Fontes termais de Soborom"
 TIE_soborom_hot_springs_desc: "As fontes termais de Soborom são uma série de fontes termais com fumarolas e vulcões de lama localizadas na parte ocidental das montanhas Tibesti. Muitos Toubou acreditam que as fontes têm propriedades curativas e, como tal, é um local popular para procurar remédios para doenças."
 TIE_clan_structure: "Estrutura do Clã"
 TIE_clan_structure_desc: "The Toubou society is built on clans. Each clan owns certain pastures, wells and oases. After their family, each Toubou identifies with their clan second. In the vast deserts of the Sahara, having a clan means you will find a friendly face almost anywhere you go. The clan system does however undermine the state's authority, but on the other hand any invader will find it difficult to subdue the Toubou as there is no single authority to negotiate with."
 TIE_sharia_law: "Lei Sharia"
 TIE_sharia_law_desc: "Os líderes religiosos dos Toubou estabeleceram tribunais da Sharia. No entanto, o Islão no Chade recebeu muita influência das religiões locais, pelo que a aplicação da Sharia não é tão eficaz como poderia ser."
 TIE_money_from_refugees: "Dinheiro dos refugiados"
 TIE_money_from_refugees_desc: "Os jihadistas deste país participam no contrabando de pessoas para a Líbia, para que possam atravessar o Mediterrâneo para a Europa."
 TIE_derde: "Derde"
 TIE_derde_desc: "O título de Derde foi criado para atuar como autoridade judicial suprema sobre os Toubou. Os Derde são eleitos entre as três famílias mais proeminentes do clã Tomagra. Com a morte dos Derde, o título não é passado para o filho, mas sim para uma das outras duas famílias."
 TIE_punching_above: "Influência Política de Toubou"
 TIE_punching_above_desc: "In Chad, many of the political elite of the country are ethnically Toubou. The Toubou have always punched above their weight despite being a minority, and the political intrigue in Chad has taught them many lessons."
 TIE_clan_elders: "Anciãos do Clã"
 TIE_clan_elders_desc: "The elders of the Toubou clans are arbitrating judicial issues between clans, as well as handling some of the overall political discourse that will lead the country forward."
 TIE_natron: "Mineração de Natrão"
 TIE_natron_desc: "Os Toubou estão extraindo natrão, uma substância semelhante ao sal com muitas aplicações domésticas."
 TIE_trans_saharan_trade_1: "Comércio Trans-Saariano"
 TIE_trans_saharan_trade_1_desc: "Os Toubou estão agindo como intermediários em uma rota comercial transaariana renascida"
 Mahamat_Nouri_desc: "Mahamat Nouri é um líder insurgente de longa data. Nouri lutou como membro do grupo rebelde FROLINAT na 1ª Guerra Civil do Chade, para derrubar o então presidente François Tombalbaye (o 1º Presidente do Chade) com o apoio da Líbia. Ele então serviu sob o comando de Goukouni Oueddei e eventualmente o ajudou a ser deposto por Hissène Habré. Ele então serviu como um dos comandantes mais experientes do Chade no conflito Chade-Líbia. Depois que Habré foi expulso pelos rebeldes de Idriss Déby, Nouri mais uma vez mudou de lado. No entanto, agora Nouri escolheu um caminho diferente, pois recebeu a oportunidade de liderar os Toubou como uma nação independente."
 Goukouni_Oueddei_desc: "Oueddei started as the leading commander of FROLINAT, a rebel group that toppled the then President of Chad, Felix Malloum, with the help of Libya. Oueddei was made president, but was soon betrayed by his ally Hissène Habré, who opposed Libya's influence in the country. Oueddei continued fighting Habré as a Libyan-backed rebel leader during the Chadian-Libyan conflict. In 1985, he was put under house arrest by the Libyan police as he was suspected of trying to negotiate a truce with the Chadians. A few months later, he was shot in the stomach as the Libyan police tried to arrest him. Two years later, he moved to Algeria, though he still claimed to be on good terms with the Libyans. Oueddei is the son of Oueddei Kichidemi, the last derde of the Toubou."
 TIE_birth_of_a_nation: "Nascimento de uma nação"
 TIE_birth_of_a_nation_desc: "O povo Toubou nunca teve muita autonomia, muito menos o seu próprio estado. Muito trabalho precisa ser feito para transformar o conjunto de clãs que vagam pelo deserto em um estado completo."
 TIE_arm_tribesmen: "Homens da tribo do braço"
 TIE_arm_tribesmen_desc: "Para defendermos as nossas casas, devemos armar rapidamente alguns dos nossos povos com armas."
 TIE_toubou_warrior_spirit: "Espírito Guerreiro Toubou"
 TIE_toubou_warrior_spirit_desc: "We consider ourselves as a people of warriors. We have survived empires and enemies for centuries and nothing will destroy us."
 TIE_warrior_spirit: "Espírito Guerreiro"
 TIE_warrior_spirit_desc: "Os Toubou sobreviveram no deserto durante séculos e não vão desistir agora."
 TIE_tibesti_fortress: "A Fortaleza da Montanha Tibesti"
 TIE_tibesti_fortress_desc: "As montanhas Tibesti são compostas por desfiladeiros e gueltas mortais. Qualquer invasor que se aproximasse deles teria dificuldade em erradicar nossos soldados. Com alguma preparação, poderíamos tornar as montanhas quase impenetráveis."
 TIE_camel_corps: "O Corpo de Camelos"
 TIE_camel_corps_desc: "Nosso povo atravessa o deserto principalmente em camelos, pois as estradas são poucas e estão em más condições. Nosso povo se tornou senhor do deserto, e esse conhecimento pode ser expandido para a guerra"
 TIE_warrior_experience: "Experiência Guerreira"
 TIE_warrior_experience_desc: "Em praticamente todos os conflitos em que o Chade esteve, o nosso povo esteve na linha de frente. A guerra civil do Chade, a guerra Chadiano-Líbia e numerosas insurgências menores na região. Podemos aproveitar esta experiência para melhorar a nossa capacidade militar"
 TIE_local_military_production: "Produção Local de Armas"
 TIE_local_military_production_desc: "Fabricar armas localmente não deveria ser tão difícil. Os Taliban fazem isso nas montanhas do Afeganistão. As FARC fazem isso nas selvas da Colômbia. Por que não conseguiríamos fazê-lo nos desertos do Saara?"
 TIE_hold_clan_meeting: "Faça uma reunião dos clãs"
 TIE_hold_clan_meeting_desc: "Devemos realizar uma reunião dos clãs. Juntamente com os anciões do clã, figuras religiosas e comandantes militares, devemos decidir o destino dos Toubou."
 TIE_establish_sharia_courts: "Estabelecer a Lei Sharia"
 TIE_establish_sharia_courts_desc: "A Lei Sharia deveria ser estabelecida sobre os Toubou. A maioria deles pratica uma forma de Islão que está fortemente misturada com as tradições africanas locais. Eles precisam aprender o verdadeiro Islã."
 TIE_seek_help_from_boko_haram: "Procure ajuda do Boko Haram"
 TIE_seek_help_from_boko_haram_desc: "Boko Haram is a jihadist group that operates in Nigeria, Chad and Niger. We can offer their soldiers a safe haven"
 TIE_make_money_of_refugees: "Ganhe dinheiro com refugiados"
 TIE_make_money_of_refugees_desc: "There is a flow of migrants from sub-Saharan Africa to Libya and then to Europe. We should take part in this flow of migrants and smuggle people into Libya in exchange for money. And any rich fools we will kidnap and then ask money from their families."
 TIE_break_clan_structure: "Quebrar a estrutura do clã"
 TIE_break_clan_structure_desc: "The Toubou people are divided into clans. In the vast deserts of the Sahara, this is a necessity to always have a safe haven where to go. However, people are more loyal to their family than their country. We need to encourage some kind of common identity, like nation, religion or culture to bring people together without the need for clans."
 TIE_large_scale_farming: "Agricultura em grande escala"
 TIE_large_scale_farming_desc: "A maior parte do nosso povo são pastores nômades. Precisamos de reunir voluntários de clãs para reunir o seu gado num grande rebanho que possa ser gerido de forma centralizada. Este será o início da indústria para os Toubou."
 TIE_prepare_for_war: "Prepare-se para a guerra"
 TIE_prepare_for_war_desc: "Nossos vizinhos não aprovarão nossa forma de governo. Precisamos de nos preparar para a guerra com eles antes que seja tarde demais."
 TIE_declare_the_caliphate: "Declare o califado"
 TIE_declare_the_caliphate_desc: "Devemos unir-nos aos nossos irmãos fiéis e declarar uma Jihad contra o Ocidente!"
 TIE_reappoint_derde: "Renomear A Derde"
 TIE_reappoint_derde_desc: "The position of Derde used to be the highest judicial authority of the Toubou, who was chosen from the three most prominent families of the Tomagra clan. In 1966, the Chadian government killed four of the five sons of the then Derde Oueddei Kichidemi and forced him into exile. This sparked the 1st Chadian Civil War. The Derde then became a political and military symbol of the Toubou as the rebel group FROLINAT was led by the Derde's only remaining son, Goukouni Oueddei. We need to elect a new Derde to act as the leading judicial authority over the clans."
 TIE_punch_above_our_weight: "Dê um soco acima do nosso peso"
 TIE_punch_above_our_weight_desc: "No Chade, grande parte da elite política, incluindo dois presidentes, são Toubou. Sempre soubemos jogar jogos políticos apesar de sermos uma minoria. Devemos fazer pleno uso desta habilidade."
 TIE_middle_of_nowhere: "Meio do nada"
 TIE_middle_of_nowhere_desc: "We are located in the absolute middle of nowhere. The nearest coastline is a thousand kilometers away, and no matter where you cross the border, you are met with endless sand desert. It is important we keep good relations with our neighbours as our existence relies on it."
 TIE_derde_guard: "Guarda Derde"
 TIE_derde_guard_desc: "O Derde precisa de sua própria guarda pessoal. Esta unidade de elite actuará como tropa de choque sempre que os nossos militares forem necessários."
 TIE_join_libya: "Unificar-se com a Líbia"
 TIE_join_libya_desc: "Após a 1ª Guerra Civil do Chade, quando um presidente Toubou assumiu o controle do país com a ajuda da Líbia, houve negociações sobre a unificação do Chade com a Líbia. Não somos o Chade, mas considerando que existem Toubou na Líbia, talvez devêssemos propor uma união com eles?"
 TIE_birthright_over_chad: "Nosso direito de nascença sobre o Chade"
 TIE_birthright_over_chad_desc: "Desde a 1ª Guerra Civil do Chade, foram os Toubou os líderes e a elite política do Chade. O governo do Chade é nosso por direito e devemos tomar o que merecemos pela força, se necessário."
 TIE_rely_on_clan_elders: "Confie nos Anciãos do Clã"
 TIE_rely_on_clan_elders_desc: "Rather than appointing a single figure or group to control the lives of the clan members, the judicial authority should rest on the shoulders of clan elders. For centuries they have been handling issues and matters that rise between the clans. They know our traditions best, and they are the best choice for upholding them."
 TIE_continue_as_herders: "Continue como pastores"
 TIE_continue_as_herders_desc: "Our people have been herders for centuries. We should not force people to change their lifestyles just to suit the government's needs."
 TIE_use_azza_to_industrialise: "Use o Azza para industrializar"
 TIE_use_azza_to_industrialise_desc: "A sociedade Toubou é socialmente estratificada em um sistema de castas. As pessoas que trabalham em vez de possuir terras e pastorear são chamadas de Azza. Estas pessoas realizam trabalho artesanal, mineração, metalurgia e alfaiataria, e têm sido tradicionalmente desprezadas e segregadas pela casta superior de “homens livres” da sociedade Toubou. Não deveríamos desprezar estas pessoas, mas sim usá-las para criar uma verdadeira indústria para o povo Toubou."
 TIE_adopt_cfa_franc: "Adote o Franco CFA"
 TIE_adopt_cfa_franc_desc: "The CFA Franc is currently widely in use in Western and Central Africa. This currency is heavily tied to France, but it would offer a great boost to our economy."
 TIE_diversify_our_economy: "Diversificar a nossa economia"
 TIE_diversify_our_economy_desc: "Embora cuidar do gado e criar tâmaras proporcione uma vida pacífica, não é uma boa maneira de ganhar dinheiro. Precisamos encontrar outras fontes de renda para nosso governo."
 TIE_mine_natron: "Meu Natrão"
 TIE_mine_natron_desc: "Natron é uma substância semelhante ao sal encontrada em antigos lagos secos. Costumava ser usado como ingrediente em sabonetes, enxaguantes bucais, cremes dentais, anti-sépticos, inseticidas e na fabricação de couro. No entanto, nos tempos modernos, foi substituído principalmente por carbonato de sódio em quase todas as aplicações. Nosso povo ainda o extrai e o utiliza para seus próprios bens domésticos. Deveríamos aumentar esta mineração para reduzir a nossa dependência das importações estrangeiras de carbonato de sódio."
 TIE_survey_for_gold: "Pesquisa para ouro"
 TIE_survey_for_gold_desc: "Há rumores de ouro naquelas colinas. Precisamos encontrá-lo e começar a minerar."
 TIE_new_trans_saharan_trade: "O comércio transaariano renascido"
 TIE_new_trans_saharan_trade_desc: "As rotas comerciais Transaarianas costumavam passar direto pelo nosso território. Hoje em dia, não resta muito dessa riqueza. Com nossa produção de recursos aumentada, precisamos reviver as rotas comerciais para que possamos maximizar nosso potencial."
 TIE_trans_saharan_trade_niger: "Rota Comercial Transaariana para [NGR.GetName]"
 TIE_trans_saharan_trade_niger_desc: "The main export of [NGR.GetNameDef] is gold. By trading with them, we are bound to learn something new about gold mining."
 TIE_trans_saharan_trade_libya: "Rota Comercial Transaariana para [LBA.GetName]"
 TIE_trans_saharan_trade_libya_desc: "A principal exportação de [LBA.GetNameDef] é o petróleo. Infelizmente, não tivemos tanta sorte em encontrar petróleo no nosso país. Talvez com a [LBA.GetAdjective] National Oil Corporation possamos encontrar alguns?"
 TIE_trans_saharan_trade_chad: "Rota Comercial Transaariana para [CHA.GetName]"
 TIE_trans_saharan_trade_chad_desc: "[CHA.GetNameDef] exporta petróleo e ouro. Com a ajuda de [CHA.GetAdjective] seremos capazes de aumentar nossa produção de ouro e petróleo."
 TIE_build_an_airport: "Construir um aeroporto"
 TIE_build_an_airport_desc: "Há muito poucas estradas entrando e saindo de Tibesti. Para melhorar nossa conectividade, precisamos construir uma pequena pista de pouso em nossa capital."
 TIE_establish_air_force: "Establish An Air Force"
 TIE_establish_air_force_desc: "We don't have much of an air force, if even an army. However, with our newly built airstrip, and our growing economy, we need some kind of leverage over our neighbours. Surely we can find some leftover used fighter jets on the market?"
 TIE_import_tourists: "Incentivar o Turismo"
 TIE_import_tourists_desc: "Há muitas maravilhas naturais para ver nas Montanhas Tibesti, como as $TIE_soborom_hot_springs$. Precisamos usar nossos laços com um país ocidental para dar início a um boom turístico."
 TibestiFocusEvents.1.t: "[FROM.GetNameDef] Quer dobrar o joelho"
 TibestiFocusEvents.1.d: "Nossos irmãos jihadistas de [FROM.GetNameDef] nos contataram. Eles querem se juntar à nossa luta na Jihad internacional e nos ajudar a lutar contra o Ocidente decadente. O que devemos dizer?"
 TibestiFocusEvents.1.a: "Nós aceitamos a sua lealdade"
 TibestiFocusEvents.1.b: "Temos outros planos para eles"
 TibestiFocusEvents.2.t: "[FROM.GetNameDef] Aceita nossa fidelidade"
 TibestiFocusEvents.2.d: "Nossos irmãos jihadistas de [FROM.GetNameDef] concordaram em nos deixar participar de sua Jihad internacional."
 TibestiFocusEvents.2.a: "Ótimo"
 TibestiFocusEvents.3.t: "[FROM.GetNameDef] Rejeita nossa lealdade"
 TibestiFocusEvents.3.d: "Nossos irmãos jihadistas de [FROM.GetNameDef] rejeitaram nossa oferta de nos juntar à sua Jihad internacional."
 TibestiFocusEvents.3.a: "Maldição"
 TibestiFocusEvents.4.t: "[FROM.GetNameDef] Quer se juntar ao nosso país"
 TibestiFocusEvents.4.d: "O governo de [FROM.GetNameDef] nos ofereceu um pedido para que sua nação se junte à nossa. Após a 1ª Guerra Civil Chadiana, o presidente vencedor era de origem Toubou, e ele recebeu essa posição com a ajuda militar de Gaddafi. Houve conversas sobre a possibilidade de unificar o Chade com a Líbia. Esse presidente foi deposto e se foi, mas parece que a ideia de unificação com a Líbia ainda vive nos corações dos Toubou."
 TibestiFocusEvents.4.a: "Eles são mais que bem-vindos!"
 TibestiFocusEvents.4.b: "Nós não os queremos"
 TibestiFocusEvents.5.t: "[FROM.GetNameDef] Rejeita nossa oferta"
 TibestiFocusEvents.5.d: "O governo de [FROM.GetNameDef] rejeitou por algum motivo nossa oferta de unir nossos dois países."
 TibestiFocusEvents.5.a: "Maldição"
 TIE_share_oasis: "Compartilhe Oásis"
 TIE_share_oasis_desc: "Todos os recursos são compartilhados entre os clãs. Devemos fazer um levantamento de oásis, poços e pastos e redistribuí-los se virmos desigualdade entre quaisquer dois clãs. Isso fortalecerá a crença do nosso povo de que o sistema de clãs funciona."
 TIE_mining_in_aouzou: "Mineração na Faixa de Aouzou"
 TIE_mining_in_aouzou_desc: "Há rumores de que Urânio foi encontrado na Faixa de Aouzou. Precisamos encontrar e desenterrar esse recurso valioso imediatamente."
 tibesti_focus: "Árvore de Foco Tibesti"
 TIE_import_tourists_tt: "Any §YEuropean Nation§! who is a §YRegional Power§! has at least §Y10%§! influence on us."