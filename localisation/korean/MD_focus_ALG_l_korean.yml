 TT_ALG_DIRECT_DEM_REQ: "쿠르드인들이 이 지역에 직접 민주주의 이상을 전파하도록 시민권을 부여했어야 함"
 TT_ALG_KICKING_ASSADS_EFFECT: "알라위파 정치적 포용도: §R-40%§!"
 TT_ALG_REPUBLICANISM_FOCUS_EFFECT: "알제리의 모든 주요 민족 및 종교 공동체에 대해, 해당 공동체를 대표하는 정치인들에게 의회 의석을 할당하여 소수자 포용도를 높이는 대신 부패 비용을 늘릴 것인지, 아니면 그렇게 하지 않아 해당 공동체의 정치적 포용도가 §Y50%§! 아래로 떨어질 때마다 그 지역에서 폭동과 재산 피해가 발생하도록 할 것인지 선택하게 됩니다"
 TT_ALG_FEDERALISM_FOCUS_EFFECT: "알제리의 모든 주요 민족 및 종교 공동체에 대해, 반자치를 부여하여 정치적 포용도를 높이는 대신 자원 채취, 건설 속도, 건설 슬롯이 감소하고 정부 법률 변경 비용이 공동체의 정치적 포용도에 반비례하여 증가하도록 할 것인지, 아니면 해당 지역을 자치 국가로 완전히 분리해 줄 것인지 선택하게 됩니다"
 TT_ALG_DIRECT_DEMOCRACY_REQ: "직접 민주주의가 작동하려면 국가가 세속화되어야 하며 테러 위협이 사라져야 합니다. 또한 사회가 급진적 살라피 이념으로부터 안정되어야 합니다"
 TT_ALG_SECULARIZE_CONSTITUTION: "채택하는 개혁과 정책에 따라 우리는 자유 민주주의 또는 비자유 민주주의가 됩니다"
 TT_ALG_ALLY_FARMERS: "농민들이 우리의 투쟁에서 내부 파벌로 합류합니다"
 TT_ALG_ALLY_INDUSTRIALISTS: "산업 재벌들이 우리의 투쟁에서 내부 파벌로 합류합니다"
 TT_ALG_ALLY_ULEMA: "울라마가 우리의 투쟁에서 내부 파벌로 합류합니다"
 TT_ALG_ALLY_INTL_BANKERS: "국제 은행가들이 우리의 투쟁에서 내부 파벌로 합류합니다"
 TT_ALG_AGRICULTURAL_INVESTMENT_EFFECT: "농업에 여러 차례 투자하면 농산물을 판매할 새로운 시장과 기업이 생겨납니다. 다만 새로운 기업이 자리 잡는 데 필요한 투자 횟수는 부패 수준의 영향을 받습니다"
 ALG_GOVERNMENT_EXPANSION_FOCUS_EFFECT: "§Y정당 한 곳을 연립에 초청합니다. 이 정당은 국가 건설 세력 균형 과정에서 중앙집권화든 분권화든 각자의 대의에 참여함으로써 우리에게 큰 도움이 될 것입니다§!"
 ALG_GOVERNMENT_EXPANSION_EVENT_REP_EFFECT: "§C이 정당을 연립에 두면 국가 건설 세력 균형 과정에서 중앙집권화에 큰 도움이 됩니다§!"
 ALG_GOVERNMENT_EXPANSION_EVENT_FED_EFFECT: "§G이 정당을 연립에 두면 국가 건설 세력 균형 과정에서 분권화에 큰 도움이 됩니다§!"
 ALG_FINDING_PROMISING_BUREAUCRACY_EFFECTS: "성공하면 정치력 §G75§!을 얻고, §Y유망한 관료들§! 국가 정신을 얻어 §Y100§!일 동안 §Y일일 정치력 획득§! §G+0.5§! 및 §Y건설 속도§! §G+0.2§!를 받습니다"
 ALG_STATE_DECISION_MAKING_SUCCESS_EFFECTS: "성공하면 안정도 §G5%§!를 얻습니다"
 ALG_LOCAL_ACCOUNTABILITY_SUCCESS_EFFECTS: "성공하면 정당 인기도 §G10%§!를 얻고 부패가 감소합니다"
 ALG_FUND_VOLUNTARY_ORGANIZATIONS_SUCCESS_EFFECTS: "성공하면 부패가 감소하고 §Y자원봉사 단체의 부상§! 국가 정신을 얻어 §Y100§!일 동안 일일 정치력 획득 §G0.2§! 및 건설 속도 §G+30%§!를 받습니다"
 ALG_ENCOURAGE_ECONOMIC_SELF_RELIANCE: "성공하면 경제 성장 주기가 증가합니다"
 TT_ALG_KURDS_WITHOUT_CITIZENSHIPS_PARTY_FORMATION: "§G아사드 일가를 몰아낸 뒤 쿠르드인들에게 시민권을 발급하여 시민권 없는 상태가 해소되면, 이들은 알제리를 연방으로 전환하려는 정당을 결성합니다§!"
 ALG_ECONOMIC_DECISIONS_ONE_FREE_FACTORIES_EXPLANATION: "§R건설에 배정되지 않은 산업 단지가 최소 하나 있어야 합니다. 배정한 건설을 취소하거나, 건설이 끝나 사용 가능해질 때까지 기다리십시오§!"
 ALG_ECONOMIC_DECISIONS_TWO_FREE_FACTORIES_EXPLANATION: "§R건설에 배정되지 않은 산업 단지가 최소 둘 있어야 합니다. 배정한 건설을 취소하거나, 건설이 끝나 사용 가능해질 때까지 기다리십시오§!"
 ALG_ECONOMIC_DECISIONS_THREE_FREE_FACTORIES_EXPLANATION: "§R건설에 배정되지 않은 산업 단지가 최소 셋 있어야 합니다. 배정한 건설을 취소하거나, 건설이 끝나 사용 가능해질 때까지 기다리십시오§!"
 ALG_FEDERAL_FORMATION_TOOLTIP: "모든 소수자 포용도 수치가 §Y50%§! 이상이면 §G알제리 연방§!이 수립됩니다"
 ALG_UNITARY_FORMATION_TOOLTIP: "모든 소수자 포용도 수치가 §Y50%§! 이상이면 §C알제리 공화국§!이 수립됩니다"
 ALG_tech_name: "기술 보너스"
 TT_ALG_CORRUPTION_COSTS: "제도가 부패할수록 투자 비용이 더 많이 듭니다"
 ALG_algeria_invite_ciw: "§C모든 이슬람 국가를 CIW에 초청합니다§!"
 dyn_ALG_tt: "이 국가 중점의 효과는 알제리 정부의 이념 성향에 따라 달라집니다!"
 ALG_islamist_opposition_victory: "이슬람주의 야당 정부"
 ALG_islamist_opposition_victory_desc: "이슬람주의 야당 연립이 선거에서 승리했으며, 알제리를 보수적인 이슬람 공화국으로 이끄는 임무를 맡게 됩니다"
 ALG_islamist_renaissance: "이슬람주의 르네상스"
 ALG_islamist_renaissance_desc: "우리의 승리는 대중 전반에서 우리에 대한 지지를 북돋웠습니다. 새로운 문화가 생겨났으며 우리는 이를 전적으로 지지합니다"
 ALG_empower_sharia_courts: "샤리아 법정 강화"
 ALG_empower_sharia_courts_desc: "이슬람 사법부에 힘을 실어 주고 그 영향력을 확대할 때입니다"
 ALG_turkish_inspired_islamism: "튀르키예에서 영감받은 이슬람주의"
 ALG_turkish_inspired_islamism_desc: "튀르키예 공화국 수립 이후 그곳에서 일어난 이슬람주의 운동에서 영감을 얻을 것입니다. 이는 당분간 우리 운동을 더 호의적으로 보이게 하며, 튀르키예의 보수 성향 사업가들이 우리나라에 투자하도록 끌어들일 수 있습니다."
 ALG_deregulate_economy: "규제 완화 경제"
 ALG_deregulate_economy_desc: "우리 지지의 상당 부분을 차지하는 중산층과 상인들에게 힘을 실어 주기 위해, 이들에 대한 제약을 줄이고 성장에 필요한 여지를 제공할 것입니다"
 ALG_moderate_conservatism: "온건 보수주의"
 ALG_moderate_conservatism_desc: "우리 대열 안의 극단주의 요소를 뿌리 뽑고, 종교적 광신과는 아무 관련이 없는 보수 세력으로 우리의 이미지를 재구성할 것입니다"
 ALG_religious_values: "흔들리지 않는 우리의 가치"
 ALG_religious_values_desc: "대중을 달래고 이미지를 누그러뜨리려던 이전의 정책이 우리 이상의 토대가 된 진정한 가치에서 벗어나게 했을 수 있습니다. 우리는 타인이 우리를 어떻게 보는지에 신경 쓰지 않으며, 아무리 인기가 없더라도 우리 땅에 샤리아를 세우는 것이 유일한 목표입니다"
 ALG_religious_economic_charity: "종교적 기부"
 ALG_religious_economic_charity_desc: "우리 운동은 늘 공동체에 이로운 자선 단체 및 재단과 연관되어 왔습니다. 이제 더 두드러진 위치에 오른 만큼, 이들을 더욱 제도화하여 우리의 경제적 부담을 덜 것입니다"
 ALG_qatari_support: "카타르의 지원"
 ALG_qatari_support_desc: "우리는 여러 카타르 투자자들의 관심을 끌었습니다"
 ALG_flourishment_of_central_economy: "도시 중심지 개발"
 ALG_flourishment_of_central_economy_desc: "우리의 지지 기반은 주로 여러 도시 지역에서 나오므로, 그곳 주민들의 지지를 북돋우기 위해 이들 지역을 개발하기 시작해야 합니다"
 ALG_turkish_investments: "튀르키예 투자"
 ALG_turkish_investments_desc: "규제 완화 정책과 그들과의 이념적 유사성 덕분에 많은 튀르키예 투자자들을 끌어들였습니다."
 ALG_reverse_secularization: "세속화 역전"
 ALG_arm_palestinians_to_fight: "팔레스타인인 무장"
 ALG_arm_palestinians_to_fight_desc: "요르단에는 팔레스타인 난민이 많이 살고 있습니다. 이 난민들을 전투원으로 만들어 팔레스타인과 이스라엘에서 혼란을 일으키도록 부추길 수 있습니다. 이들은 대리 전투원이므로 이스라엘이 보복하도록 유도하여 이 분쟁에서 이스라엘이 악당처럼 보이게 할 수 있습니다"
 ALG_zionist_threat: "시온주의 위협"
 ALG_zionist_threat_desc: "이스라엘은 모든 무슬림에 대한 가장 큰 모욕이자 이슬람의 심장부에 자리한 가증스러운 가짜 국가입니다. 그들은 지구상에서 지워져야 합니다."
 ALG_help_sahara: "사하라의 친구들"
 ALG_help_sahara_desc: "우리는 범아랍주의 대의를 지지하는 많은 운동과 접촉하고 있으며, 그중 하나가 북사하라 주민들의 해방을 추구하는 폴리사리오 전선입니다. 지난 한 세기 동안 폴리사리오는 식민 지배와 이후 모로코의 억압에 맞서 싸웠으며, 지금 이 전선이 통제하는 지역은 서사하라의 작은 일부에 불과합니다. 현재 분쟁은 교착 상태이지만, 우리 친구들에게 군사 원조를 보내고 사하라위가 투쟁을 이어 가는 데 필요한 모든 것을 갖추어 줌으로써 이를 바꿀 수 있습니다."
 algeria.42.t: "[FROM.GetName]의 무기 지원!"
 algeria.42.d: "그들이 우리에게 총기를 보내 왔습니다!"
 algeria.42.a: "훌륭하다"
 algeria.43.t: "알제리, 외교적 항의 제기!"
 algeria.43.d: "알제리 대통령 압데라자크 마크리가 우리 정부에 대해 외교적 항의를 제기했습니다. 그는 우리가 테러리스트이며 국제사회가 우리 정권을 제거하기 위한 특별 작전을 개시해야 한다고 주장하고 있습니다."
 algeria.43.a: "꺼져라, 마크리"
 ALG_support_fsa: "자유시리아군 지원"
 ALG_support_fsa_desc: "시리아와 우리의 관계는 오랜 역사를 지니고 있습니다. 이제 그 관계는 형제단 이념과의 관계에 따라 정의되어야 합니다."
 ALG_brotherhood_diplo: "형제단 외교"
 ALG_brotherhood_diplo_desc: "새로운 정부에 걸맞게 외교를 개혁해야 합니다."
 ALG_hamas_under_wing: "하마스를 품에 안다"
 ALG_hamas_under_wing_desc: "하마스는 가자 지구에 있는 자유 투사 집단으로 무슬림 형제단과 연계되어 있습니다. 그들을 돕는 것은 우리의 의무입니다!"
 algeria.44.t: "하마스, 가자 장악"
 algeria.44.d: "알제리의 지원을 받은 하마스가 가자 지구를 장악했습니다. 이들의 무장 민병대가 정부 청사를 장악했으며, 대변인 [HAM.GetLeader]은(는) 이 단체가 알아크사 모스크를 해방하기 위해 진군할 준비를 하고 있다고 밝혔습니다"
 algeria.44.a: "젠장"
 ALG_letter_isr: "이스라엘의 조작"
 ALG_letter_isr_desc: "오, 이스라엘이여! 너희를 어떻게 할지 결정할 때가 왔다."
 MSP_letter_isr: "이스라엘의 조작"
 MSP_letter_isr_desc: "오, 이스라엘이여! 너희를 어떻게 할지 결정할 때가 왔다."
 ALG_und_supp_hamas: "하마스 비밀 지원"
 ALG_und_supp_hamas_desc: "하마스의 대의를 성공시키려면 물질적으로 지원해야 합니다."
 ALG_org_of_isl_coop: "이슬람 협력 기구"
 ALG_org_of_isl_coop_desc: "이슬람 협력 기구는 이전의 이슬람 회의 기구로, 1969년에 설립된 정부간 기구이며 57개 회원국으로 구성되어 있고 그중 48개국이 무슬림이 다수인 국가입니다."
 MSP_und_supp_hamas: "하마스 비밀 지원"
 MSP_und_supp_hamas_desc: "하마스의 대의를 성공시키려면 물질적으로 지원해야 합니다."
 MSP_org_of_isl_coop: "이슬람 협력 기구"
 MSP_org_of_isl_coop_desc: "이슬람 협력 기구는 이전의 이슬람 회의 기구로, 1969년에 설립된 정부간 기구이며 57개 회원국으로 구성되어 있고 그중 48개국이 무슬림이 다수인 국가입니다."
 algeria.49.t: "알제리, 오마르 압델 라흐만 석방 요청"
 algeria.49.d: "마크리는 서한에서 1993년 뉴욕 세계무역센터 폭탄 테러로 유죄 판결을 받은 오마르 압델 라흐만과, 혁명 기간에 체포된 수많은 이집트인들을 석방해 달라고 우리에게 요청한다고 간략히 언급했습니다. 이후 형제단 대변인은 인도 문제를 이유로 신병 인도가 제안된 것이며 마크리가 압델 라흐만의 유죄 판결을 뒤집으려는 의도는 없었다고 말했습니다."
 algeria.49.a: "마크리는 제정신인가?"
 algeria.49.b: "으음, 그러지 뭐?"
 ALG_supp_plo: "PLO 지원"
 ALG_supp_plo_desc: "팔레스타인 해방 기구(PLO)는 오랫동안 팔레스타인 민족 자결을 위한 투쟁에서 핵심 역할을 해 왔습니다. PLO를 지원하면 국제 동맹국들과의 입지를 강화하고 분쟁의 평화적 해결을 촉진할 수 있습니다."
 ALG_the_pal_issue: "팔레스타인 문제"
 ALG_the_pal_issue_desc: "팔레스타인 문제는 우리 외교 정책의 핵심 사안으로 남아 있습니다. 팔레스타인의 투쟁에 대한 우리의 입장은 국제 동맹과 이 지역에서의 영향력을 규정할 것입니다. 이 지속되는 분쟁에 어떻게 대처할지 결정해야 합니다."
 ALG_supp_hamas: "하마스 지원"
 ALG_supp_hamas_desc: "하마스는 팔레스타인 저항 내의 중요한 파벌입니다. 지원을 제공함으로써 이 단체와의 유대를 강화하고, 이 지역에서의 영향력을 높이며, 그들의 투쟁과 보조를 맞출 수 있습니다."
 ALG_Get_rid_of_military_corrupt: "군 내 부패 세력 숙청"
 ALG_Get_rid_of_military_corrupt_desc: "군부는 우리 제도에 뿌리내리고 있으며 국가의 미래에 분명한 위협입니다. 부패 혐의로 이들을 체포하고 손에 넣을 수 있는 재산을 몰수할 것입니다"
 idea_algerian_oligarchy_arrests: "군부 숙청"
 ALG_the_coalition: "연합"
 ALG_the_coalition_desc: "정당 활동이 재개된 이후 두 개의 주목할 만한 세력이 부상했습니다. 한쪽은 국가를 연방화하여 지방에 더 많은 권력을 부여할 것을 주장하고, 다른 쪽은 중앙집권적 권위를 공고히 하여 통일된 중앙집권 공화국을 유지할 것을 주장합니다. 누구와 손을 잡을지 신중히 선택해야 합니다."
 ALG_dismantle_the_military: "군 예산 해체"
 ALG_dismantle_the_military_desc: "군 기관 내에 뿌리박힌 부패로 인해 국방 GDP의 상당 부분이 횡령되어 쓸모없는 사업에 투입되었습니다. 손에 넣을 수 있는 것은 최대한 용도를 변경하거나 매각할 것입니다. 이는 군을 약화시키고 위협에 취약하게 만들 수 있으나, 경제 회복과 부패 척결을 위해 반드시 거쳐야 할 단계입니다."
 ALG_empower_institutions: "제도 강화"
 ALG_empower_institutions_desc: "우리의 제도는 매우 취약하며 소외되어 있습니다. 이는 권력이 대통령에게 집중되고 의회에는 거의 권한이 주어지지 않은 데다, 국가가 통제하는 언론이 개인의 자유를 억누르는 분위기를 조성하고 있기 때문입니다. 권력 분배와 자유화를 보장하는 새 헌법을 기초하는 것은 미래를 향한 중요한 단계입니다."
 ALG_western_supported_economic_relief: "서방의 구제"
 ALG_western_supported_economic_relief_desc: "우리의 이상은 서방의 이상과 일치하며, 서방 국가들에 우리 정당을 설립하는 것까지 허용되었습니다. 서방과 관계를 맺고 경제적 영향력을 내어주는 대가로 구제를 요청할 것입니다."
 ALG_liberalize_society: "사회 자유화"
 ALG_liberalize_society_desc: "국민은 자유와 평등의 가치에 낯설습니다. 국민이 자신의 자유를 소중히 여기도록 장려하는 데 힘써야 합니다."
 ALG_scientific_ventures: "과학 사업"
 ALG_scientific_ventures_desc: "장학금을 지원하고 낡은 학교 교육과정을 개선함으로써 국가의 과학 부문을 발전시킬 수 있을 것입니다."
 Algeria_student_exchanges: "학생 교류"
 ALG_banish_authoritarian_influence: "권위주의 영향력 추방"
 ALG_banish_authoritarian_influence_desc: "이란과 러시아 같은 많은 권위주의 국가가 이곳에 큰 영향력을 행사해 왔습니다. 이제 우리가 자유 국가가 된 만큼, 우리의 제도와 경제에 대한 그들의 영향력을 끝낼 때입니다."
 ALG_democratic_socialism: "민주사회주의"
 ALG_democratic_socialism_desc: "우리나라의 처참한 경제 상태로 인해 국민은 상당히 가난하고 저개발 상태에 머물러 있습니다. 경제적 불평등이 여전히 만연한 상황에서 기업에 대한 규제를 완화하면 착취와 불공정 경쟁이 생겨날 것입니다. 우리에게 필요한 것은 국내 신규 기업을 장려하고 보조금을 지급하여, 모든 계층의 시민이 누릴 수 있는 폭넓은 경제 발전을 이루는 일입니다."
 ALG_unleash_economic_potential: "경제 잠재력 발휘"
 ALG_unleash_economic_potential_desc: "우리에게는 경제 강국이 될 수 있는 커다란 잠재력이 있습니다. 외국 투자자와 기업이 이곳에 회사를 설립하도록 장려할 수 있으며, 이로 인해 국민이 값싼 노동자로 전락하더라도 경제 발전을 향한 위대한 도약이 될 것입니다."
 ALG_domestic_investments: "국내 투자"
 ALG_domestic_investments_desc: "많은 젊은 국내 기업이 설립되고 있습니다. 경제적 번영을 향한 그들의 여정을 지원하기 위해 투자할 것입니다."
 ALG_subsidize_local_firms: "지역 기업"
 ALG_subsidize_local_firms_desc: "우리의 정책 덕분에 지역 기업들이 성공을 인정받고 있습니다. 이제 그들에게 투자할 때입니다."
 ALG_economic_democracy: "경제적 평등"
 ALG_economic_democracy_desc: "경제적 불평등에 맞서 싸운 결과 우리의 경제 발전은 모든 경제적 배경의 모든 국민에게 미쳤으며, 성공적인 국내 기업까지 탄생시켰습니다. 이는 우리가 자랑스러워해야 할 일입니다."
 ALG_federalisation: "연방화"
 ALG_federalisation_desc: "해법은 주에 더 많은 권한을 부여하는 것입니다. 이는 지역 대표성과 포용성을 크게 장려하고 종파적 공포와 긴장을 크게 완화할 것입니다. 그러나 이러한 자치는 특히 소수 집단이 있는 지역에서 주에 대한 우리의 장악력을 약화시킬 것입니다."
 ALG_algerian_investments: "디아스포라 투자"
 ALG_algerian_investments_desc: "경제 친화적인 정책 덕분에 해외에 거주하는 알제리 디아스포라로부터 투자를 유치했습니다."
 ALG_invite_US_business_giants: "거대 기업 유치"
 ALG_invite_US_business_giants_desc: "경제가 번영하도록 허용했지만 이것만으로는 충분하지 않습니다. 소비주의를 장려하기 위해 미국의 거대 기업들이 국내에 프랜차이즈를 설립하도록 초청할 것입니다."
 ALG_republicanism: "공화주의"
 ALG_republicanism_desc: "알제리는 중앙집권적 권위를 갖춘 강력한 국가로서 통치될 때 가장 좋습니다. 이는 정부의 통치력을 강화하겠지만, 소외되었다고 느끼는 소수 집단의 반감과 분노를 불러일으킬 것입니다."
 ALG_address_ethnic_divides: "민족 분열 해결"
 ALG_address_ethnic_divides_desc: "우리나라는 언제나 분열되어 있었고 종파주의에 시달려 왔습니다. 이러한 문제에 어떻게 대처할지 결정해야 합니다."
 ALG_EU_investments: "EU 투자"
 ALG_EU_investments_desc: "여러 유럽 국가가 우리나라에 투자하기를 모색하고 있습니다."
 ALG_student_exchanges: "학생 교류"
 ALG_student_exchanges_desc: "우리의 교육을 향상시키고 세계 표준에 뒤처지지 않도록 하기 위해 해외 유학 장학금을 장려할 것입니다."
 ALG_democratic_victory: "민주주의의 승리"
 ALG_democratic_victory_desc: ""
 ALG_new_era: "새로운 시대"
 ALG_new_era_desc: "지역에 새로운 시대가 열릴 것입니다. 억압과 불의에서 벗어난 평화와 안정의 시대입니다."
 ALG_islamic_nato: "이슬람 NATO"
 ALG_islamic_nato_desc: "NATO가 우리에게 안보를 제공하고 있지만, NATO 회원국들은 중동을 완전히 도외시해 왔습니다. 그들이 안정과 번영을 제공하지 못한다면 우리가 그 책임을 맡아야 합니다. 우리는 지중해조약기구, 즉 MTO라는 독자적인 군사 동맹을 결성할 것입니다."
 ALG_invite_iraq: "이라크 초청"
 ALG_invite_iraq_desc: "이라크가 서서히 안정을 찾아가고 있으므로 우리 동맹에 초청해야 하며, 상호 협력은 우리에게 큰 이익이 될 것입니다."
 ALG_invite_syria: "시리아 초청"
 ALG_invite_syria_desc: "시리아가 우리나라 바로 남쪽에 있다는 것은 우리가 매우 취약하다는 뜻입니다. 시리아를 우리 세력에 초청하는 것은 우리의 안보와 안전을 보장하는 훌륭한 방법이 될 것입니다."
 ALG_invite_algeria: "이집트 초청"
 ALG_invite_algeria_desc: "이집트는 떠오르는 강국이며, 그 정도 규모의 인구를 보유한 만큼 우리 동맹은 사실상 무엇이든 이룰 수 있을 것입니다."
 ALG_assistance_to_bulgaria: "불가리아 지원"
 ALG_assistance_to_bulgaria_desc: "불가리아의 기반시설 개발을 지원하여 우리가 불가리아 국경 너머에서 더 쉽게 투자를 진행할 수 있도록 해야 합니다."
 ALG_islamic_economic_cooperation: "이슬람 경제 협력"
 ALG_islamic_economic_cooperation_desc: "많은 무슬림 국가가 돈이 넘쳐나지만 그 돈을 터무니없는 일에 쓰고 있습니다. 우리는 경제 동맹을 결성하여 자원을 모아 공동 경제 사업에 투입해야 합니다."
 ALG_msp_win: "§R참고§! : §G이 중점은 MSP 중점 트리를 해금합니다! 이 트리는 덮어쓰여집니다§!"
 algeria_news.1.t: "알제리에서 군사 쿠데타 발생!"
 algeria_news.1.d: "신속하고 예기치 못한 사태의 전개 속에 군사 쿠데타가 벌어지며 [ALG.GetLeader] 정부가 전복되어 알제리는 불확실성 속으로 빠져들었습니다. 집권당과 야당 세력 간의 긴장이 고조되는 가운데, 아흐메드 가이드 살라 장군이 이끄는 알제리군이 국가 기구를 장악하고 헌법을 정지시켰으며 주요 정치 인사들을 구금했습니다. 알제의 거리는 환호와 불안이 뒤섞인 모습으로 들끓었으며, 이는 군의 개입을 둘러싼 국가 내부의 깊은 분열을 보여 줍니다. 국제사회는 알제리의 미래가 갈림길에 선 가운데 이 상황을 예의 주시하고 있으며, 이것이 지역의 민주주의와 안정에 미칠 영향에 대한 우려가 커지고 있습니다."
 algeria_news.1.a: "흥미롭군"
 algeria_news.2.t: "기로에 선 알제리"
 algeria_news.2.d: "거의 10년에 걸친 유혈 사태와 불안정 끝에 알제리는 취약하고 불확실한 처지에 놓여 있습니다. 많은 지역에서 총성이 잦아들었지만 평화가 보장된 것과는 거리가 멉니다. 국가는 이제 중대한 갈림길에 서 있습니다. 화해와 개혁을 선택할 것인가, 군의 비상 통치를 이어갈 것인가, 아니면 다시 한번 분쟁으로 무너질 것인가. 알제리 국민과 세계의 시선이 다음에 일어날 일에 쏠려 있습니다."
 algeria_news.2.a: "알제리의 미래를 위한 투쟁이 시작된다"
 algeria_news.3.t: "부테플리카, 대통령직에 취임"
 algeria_news.3.d: "1999년 4월, 압델아지즈 부테플리카가 알제리 대통령으로 선출되어, 수년간의 정치적 위기 끝에 국가를 공식적인 민간 지도 체제로 되돌렸습니다. 전쟁은 아직 완전히 끝나지 않았지만, 부테플리카는 안정을 회복하고 국가를 재건하며 알제리를 새 천년으로 이끌겠다는 결의를 안고 취임합니다. 화해와 대화를 내세운 그의 계획은 많은 알제리인에게 희망을 불러일으켰으나, 그의 대통령직이 과연 암흑의 10년이 남긴 상처를 진정으로 치유할 수 있을지에 대한 의구심도 여전합니다."
 algeria_news.3.a: "부테플리카 치하에서 새 시대가 시작된다"
 algeria_news.4.t: "민간 화합법 시한 종료"
 algeria_news.4.d: "부테플리카 대통령의 민간 화합법이 열어 둔 사면 기간이 종료되었습니다. 수천 명의 반군이 산에서 내려와 민간인 생활로 돌아왔으며, 이슬람구국군은 계속 싸우는 대신 공식적으로 해산했습니다. 무장이슬람집단의 강경파와 새로 결성된 설교와 전투를 위한 살라피스트 집단은 모든 제안을 거부하고 전장에 남아 있습니다. 지지자들은 이 화합법이 유혈 사태를 끝낼 최선의 기회라고 말하는 반면, 비판자들은 이 법이 학살의 가해자를 용서하면서 피해자에게는 일말의 정의도 제공하지 않는다고 반박합니다."
 algeria_news.4.a: "암흑의 10년의 페이지를 넘길 기회"
 algeria_news.5.t: "FLN의 혁명 유산 부활"
 algeria_news.5.d: "부테플리카 대통령과 FLN은 독립 전쟁의 기억을 통해 정통성을 강화하기 위한 전국적 캠페인을 개시했습니다. 국영 언론과 학교는 이제 순교자들의 희생을 찬미하며 FLN을 알제리 주권의 영원한 수호자로 내세우고 있습니다. 동시에 정부는 다른 주요 정당들과 동맹을 확보하여 권위를 공고히 하고 단합된 모습을 보이기 위한 정치 연립을 구성했습니다. 비판자들은 이 캠페인을 기회주의적 선전이라고 규탄하지만, 지지자들은 이를 알제리 혁명 정신의 부활로 봅니다."
 algeria_news.5.a: "혁명은 단결을 통해 이어진다"
 algeria_news.5.b: "FLN이 홀로 통치해서는 안 된다"
 algeria_news.6.t: "대통령 동맹의 결성"
 algeria_news.6.d: "혁명 유산 캠페인을 발판으로 FLN은 '대통령 동맹'으로 알려진 집권 연립을 확보했습니다. 민족해방전선(FLN), 민주주의를 위한 국민연합(RND), 평화를 위한 사회운동(MSP)은 부테플리카 대통령을 지지하는 정책을 조율하기로 합의했습니다. 이 동맹은 알제리 정치 체제에 대한 집권 블록의 장악력을 강화하며 대중에게 단합된 모습을 보여 줍니다. 지지자들은 이 연립을 안정의 상징으로 환영하지만, 야권은 알제리가 새로운 외피를 쓴 일당 지배로 더욱 미끄러질 위험이 있다고 경고합니다."
 algeria_news.6.a: "함께 알제리의 미래를 지킨다"
 ALG_presidential_alliance: "§YFLN, RND, MSP가 대통령 동맹을 결성했습니다.§!\n이 연립은 정부 안정도를 높이지만, 집권 블록 아래 정치적 지배력을 공고히 합니다."
 algeria_news.7.t: "위기의 재점화"
 algeria_news.7.d: "화해와 개혁의 약속은 거짓말로 무너졌습니다. FLN과 소위 동맹인 RND 및 기타 민주 정당들은 국민이 요구한 정의와 권리를 실현하지 못했습니다. 공허한 약속에 환멸을 느낀 많은 이들이 이제 설교와 전투를 위한 살라피스트 집단(GSPC)에 의지하며, 오직 알라의 법만이 알제리에 진정한 정의를 가져올 수 있다고 믿고 있습니다. 그들에게 샤리아는 정치인의 탐욕, 하르키에 대한 배신, 외세의 영향에 오염되지 않은 더 높은 법을 의미합니다. 이것은 알제리 국민에 맞선 전쟁이 아니라, 그들의 미래를 빼앗은 부패한 관리들과 외세를 등에 업은 엘리트들에 맞선 전쟁입니다. 알제리의 운명을 결정지을 새로운 내전이 다가오고 있습니다."
 algeria_news.7.a: "알라의 법이 알제리의 미래를 이끌 것이다"
 ALG_army_alliance: "르 푸부아르 강화"
 ALG_strengthen_le_pouvoir: "르 푸부아르 강화"
 ALG_strengthen_le_pouvoir_desc: "집권 엘리트와 군이 정치적 자유를 희생시키며 권력을 공고히 합니다."
 ALG_resistance_challenges_new: "국민의 요구"
 ALG_resistance_challenges_new_desc: "국민은 의료, 교육, 고용 분야의 개혁을 요구합니다. 이러한 요구를 해결하지 못하면 불만이 커져 알제리가 내전에 한층 가까워질 것입니다."
 ALG_healthcare_reform: "의료 체계 개혁"
 ALG_healthcare_reform_desc: "병원은 과밀하고, 의사는 저임금에 시달리며, 의료품 부족이 만연해 있습니다. 신속히 대처해야 합니다."
 alg.310.t: "의료 개혁 성공"
 alg.310.d: "병원과 의사에 대한 투자가 정부에 대한 신뢰를 어느 정도 회복시켰습니다."
 alg.310.a: "작은 승리다."
 alg.311.t: "의료 체계 붕괴"
 alg.311.d: "병원은 감당하지 못하고 환자들은 돌려보내지며, 부패가 체계를 갉아먹고 있습니다. 분노가 끓어 넘칩니다."
 alg.311.a: "큰 대가를 치르게 될 것이다."
 ALG_education_reform: "교육 체계 개혁"
 ALG_education_reform_desc: "우리의 학교와 대학은 낡았으며, 졸업생들은 일자리 없는 미래에 직면해 있습니다."
 alg.320.t: "교육 개혁 성공"
 alg.320.d: "학교와 대학에 대한 투자가 학생들에게 다시 희망을 주었습니다."
 alg.320.a: "더 밝은 미래다."
 alg.321.t: "교육 체계 붕괴"
 alg.321.d: "과밀 학급, 부실한 대학, 기회의 부족이 불만을 부추기고 있습니다."
 alg.321.a: "청년들이 우리에게 등을 돌린다."
 ALG_unemployment_reform: "실업 위기 대응"
 ALG_unemployment_reform_desc: "알제리의 청년들은 일자리가 없고 불안해합니다. 산업과 일자리 창출에 투자하지 않으면 소요에 직면할 것입니다."
 alg.330.t: "일자리 프로그램 성공"
 alg.330.d: "새로운 일자리와 소규모 산업이 수천 명의 알제리 청년들에게 희망을 주고 있습니다."
 alg.330.a: "한 걸음 나아갔다."
 alg.331.t: "실업 위기 심화"
 alg.331.d: "공장은 가동을 멈추고, 졸업생들은 거리에서 빈둥거리며, 시위는 폭력적으로 변하고 있습니다."
 alg.331.a: "이대로는 오래 갈 수 없다."
 alg.400.t: "군의 패배 수용"
 alg.400.d: "인민국가군은 정치에 대한 장악력을 잃었습니다. 대중의 압력이 높아지고 장교들이 또 한 번의 피비린내 나는 전쟁을 감수하기를 꺼리는 가운데, 장군들은 민간 지도부에 자리를 내주는 것을 받아들입니다."
 alg.400.a: "마침내 민간 통치다!"
 alg.401.t: "군의 반격"
 alg.401.d: "개혁이 시작되었으나 군은 여전히 실권을 쥐고 있습니다. 고위 장성들은 정치에 간섭하고 자금을 빼돌리며 투명성을 높이려는 시도를 방해합니다. 알제리는 다시 막후 통치로 되돌아갑니다."
 alg.401.a: "부패한 장군들이 권력을 유지한다."
 alg.402.t: "국민의 무장 봉기"
 alg.402.d: "알제리 국민의 불만이 한계점에 도달했습니다. 안정이 사라지고 제도에 대한 신뢰가 무너지면서 시위는 공공연한 반란으로 번집니다. 알제리는 또 한 번의 내전에 직면했습니다."
 alg.402.a: "국가가 찢겨 나간다."
 ALG_resist_le_pouvoir: "르 푸부아르에 저항"
 ALG_resist_le_pouvoir_desc: "수십 년 동안 *르 푸부아르*로 알려진 부패한 엘리트들이 군을 철권 삼아 막후에서 알제리를 통치해 왔습니다. 국민은 불안해하고 있으며, 그들의 불만이 해소되지 않는다면 알제리는 또 한 번의 폭풍에 직면할 수 있습니다. 이 길을 택하면 개혁 혹은 유혈 사태로 가는 길이 열릴 것입니다."
 ALG_popular_salvation: "민중 구국 운동"
 ALG_popular_salvation_desc: "절망의 잿더미 속에서 새로운 운동이 일어납니다. 학생, 노동자, 환멸을 느낀 군인들이 변화를 요구하며 단결합니다. 이 운동이 구질서를 평화적으로 전복할 수 있을지, 아니면 내전에 불을 붙일지는 우리가 국민의 요구를 어떻게 다루느냐에 달려 있습니다."
 ALG_popular_salvation_tt: "§Y이 중점은 반대 운동을 강화하지만 내전을 보장하지는 않습니다. 결과는 불만과 군의 영향력을 어떻게 관리하느냐에 달려 있습니다.§!"
 ALG_restore_hope: "희망 회복"
 ALG_restore_hope_desc: "1999년, 압델아지즈 부테플리카는 암흑의 10년 이후 안정과 화해를 약속하며 집권했습니다. 국민은 그를 희망의 상징으로 바라보고 있습니다."
 ALG_charter_for_peace: "민간 화합법"
 ALG_charter_for_peace_desc: "1999년 9월 국민투표로 승인된 민간 화합법은 기간이 끝나기 전에 투항하는 모든 반군에게 사면을 제공합니다. 이슬람구국군은 이미 휴전을 지켰으며, 남은 전투원 중 얼마나 많은 이들이 산에서 내려올지가 관건입니다."
 ALG_no_pres_alliance: "FLN 단독 통치"
 ALG_no_pres_alliance_desc: "부테플리카와 FLN은 다른 정당과의 동맹을 거부하고 알제리 정치 체제에 대한 전면적 지배를 주장합니다."
 ALG_le_pouvoir_in_the_shadows: "그림자 속의 르 푸부아르"
 ALG_le_pouvoir_in_the_shadows_desc: "선거가 치러지기는 하지만 실권은 뿌리 깊은 엘리트가 쥐고 있습니다. 부패는 깊어지고 시민들은 불안해합니다."
 ALG_peace_charter: "민간 화합법"
 ALG_peace_charter_desc: "무기를 내려놓는 반군에 대한 부테플리카의 사면은 암흑의 10년의 전투원을 전장에서 격파하는 대신 고갈시키려는 것입니다."
 ALG_fln_dominance: "FLN의 지배"
 ALG_fln_dominance_desc: "민족해방전선(FLN)은 계속해서 알제리 정치 체제를 지배하고 있습니다. 이러한 지배는 정치적 다원주의를 제한하고 야권 집단의 분노를 키우지만, 정권에는 연속성과 통제력을 제공합니다."
 ALG_only_FLN: "동맹 없음"
 ALG_only_FLN_desc: "FLN은 동맹이나 연립을 거부하고 홀로 통치할 것입니다. 이는 권력을 공고히 하지만 야권 세력을 더욱 고립시키며 대중의 불만이 커질 위험이 있습니다."
 ALG_pres_coa: "대통령 동맹"
 ALG_pres_coa_desc: "안정을 유지하기 위해 FLN은 보다 폭넓은 대통령 연립을 구성할 수 있습니다. 충성파 정당과 무소속 인사를 포함함으로써 정부는 지배력을 내주지 않고도 정통성을 얻습니다."
 ALG_nationalize_privatized_industries: "민영화 산업 국유화"
 ALG_nationalize_privatized_industries_desc: "1990년대의 신자유주의적 민영화는 알제리의 주권을 약화시켰습니다. 핵심 산업을 재국유화함으로써 국가는 전략 부문에 대한 통제권을 되찾을 수 있습니다."
 ALG_sonatrach_expansion: "소나트라크 확장"
 ALG_sonatrach_expansion_desc: "알제리의 국영 에너지 기업인 소나트라크는 우리 경제의 근간입니다. 소나트라크의 역량과 영향권을 확대하면 국가 수입과 세계 에너지 시장에서의 알제리의 영향력이 강화될 것입니다."
 ALG_the_cult_of_bouteflika: "부테플리카 숭배"
 ALG_the_cult_of_bouteflika_desc: "부테플리카 대통령의 지지자들은 그의 지도력을 중심으로 개인숭배를 구축하고 있습니다. 충성스러운 연결망과 선전을 통해 측근들은 부패와 정실주의가 심화되는 와중에도 알제리 정치에 대한 그의 지배를 공고히 합니다."
 ALG_cult_of_bouteflika: "부테플리카의 측근 집단"
 ALG_cult_of_bouteflika_desc: "충성스럽지만 극도로 부패한 측근 집단에 둘러싸인 부테플리카의 핵심 서클이 권력의 지렛대를 쥐고 있습니다. 그들의 영향력은 정권의 안정을 보장하지만 족벌주의를 고착시키고 통치의 투명성을 떨어뜨립니다."
 ALG_oppose_ffs_and_rcd: "FFS와 RCD 금지"
 ALG_oppose_ffs_and_rcd_desc: "사회주의세력전선(FFS)과 문화와 민주주의를 위한 연합(RCD)은 FLN의 패권에 도전합니다. 이들을 금지함으로써 정권은 반대의 목소리를 제거하지만, 특히 카빌리아에서 반발을 부채질할 위험이 있습니다."
 ALG_smaller_state: "작은 국가"
 ALG_smaller_state_desc: "비대해진 알제리 국가는 비효율적이고 비용이 많이 듭니다. 규모를 줄이고 권한을 분산하면 효율성이 개선될 수 있으나, 뿌리 깊은 엘리트들이 이러한 개혁에 저항할 것입니다."
 ALG_fight_bloated_bureaucracy: "비대한 관료제와의 싸움"
 ALG_fight_bloated_bureaucracy_desc: "겹겹의 관료제가 알제리의 통치를 질식시키고 있습니다. 공공 행정을 간소화하는 캠페인은 부패를 줄이고 서비스를 국민에게 더 가까이 가져다줄 것입니다."
 FLN_parties_corruptions: "우리 정당들의 부패"
 FLN_parties_corruptions_desc: "부패가 FLN과 동맹 정당들에 스며들었습니다. 정권이 신뢰를 회복하고자 한다면 이 부패를 규탄하고 해결하는 것이 필수적입니다."
 ALG_elite_control: "엘리트 통제"
 ALG_elite_control_desc: "'르 푸부아르'로 알려진 사업가, 정당 지도자, 군 장교들의 연결망이 막후에서 알제리를 통치합니다."
 ALG_military_coup: "군사 쿠데타"
 ALG_military_coup_desc: "군은 민간 지도 체제를 끝내고 직접 권력을 장악하기로 결정했으며, 질서를 약속하지만 공포를 가져옵니다."
 ALG_suspend_democracy: "민주주의 정지"
 ALG_suspend_democracy_desc: "의회는 해산되고 선거는 취소되었으며, 장군들이 알제리를 통치합니다."
 ALG_repression_campaign: "탄압 캠페인"
 ALG_repression_campaign_desc: "인민국가군은 반대 의견을 짓밟기 위해 암흑의 10년의 잔혹한 수법을 사용하며, 그 대가로 국제적 분노를 감수합니다."
 ALG_black_market_rises: "암시장의 부상"
 ALG_black_market_rises_desc: "부패와 물자 부족이 번성하는 암시장을 만들어 공식 경제를 약화시킵니다."
 ALG_expand_the_pna: "인민국가군 확장"
 ALG_expand_the_pna_desc: "정권의 존속을 보장하기 위해 군이 확장되고 현대화되며 강화됩니다."
 ALG_africas_strongest_army: "아프리카 최강의 군대"
 ALG_africas_strongest_army_desc: "알제리는 이제 대륙에서 가장 강력한 군대를 보유하고 있으며, 무시할 수 없는 힘입니다."
 ALG_global_power_projection: "HCS의 재기"
 ALG_global_power_projection_desc: "군이 다시 한번 확고한 권력을 쥔 지금, 알제리는 국내외에서 자신을 내세웁니다. 1990년대 HCS 시대의 지배력을 되살려, 우리나라는 당당하고 굴하지 않으며 국경 너머까지 영향력을 투사할 준비가 되어 있습니다. 세계는 알제리의 결의가 지닌 힘을 기억할 것입니다."
 ALG_army_reform: "육군 개혁"
 ALG_army_reform_specops: "육군 개혁"
 ALG_army_reform_specops2: "육군 개혁"
 ALG_army_reform_specops3: "육군 개혁"
 ALG_army_reform_specops4: "육군 개혁"
 ALG_military_quality_initiative: "군 질적 향상 계획"
 ALG_military_quality_initiative2: "군 질적 향상 계획"
 ALG_army_reform_mass_army: "육군 개혁"
 ALG_army_reform_mass_army2: "육군 개혁"
 ALG_army_reform_mass_army3: "육군 개혁"
 ALG_army_reform_mass_army4: "육군 개혁"
 ALG_military_expansion: "군 확장"
 ALG_military_expansion2: "군 확장"
 ALG_foreign_arms_companies: "외국 방위산업체"
 ALG_future_army: "미래의 육군"
 ALG_air_reform: "공군 개혁"
 ALG_air_reform2: "공군 개혁"
 ALG_air_reform3: "공군 개혁"
 ALG_air_reform4: "공군 개혁"
 ALG_naval_reform: "해군 개혁"
 ALG_naval_reform2: "해군 개혁"
 ALG_naval_reform3: "해군 개혁"
 ALG_naval_reform4: "해군 개혁"
 ALG_shipbuilding: "알제리 조선업"
 ALG_shipbuilding2: "알제리 조선업"
 ALG_resist_le_pouvoir_system_tt: "§Y새로운 시스템 해금: 국민 불만과 군 영향력§!\n\n- §O국민 불만§!은 대중의 불만 수준을 나타냅니다. 실업, 교육, 의료를 방치하면 증가합니다.\n- 불만이 지나치게 높아지면 대규모 시위나 내전이 발발할 수 있습니다.\n\n- §O군 영향력§!은 정치에서 군이 차지하는 역할을 나타냅니다. 개혁을 통해 이를 약화시키면 평화적 전환이 가능할 수 있지만, 영향력이 커지면 군이 민주주의를 억압하고 장악력을 강화할 수 있습니다.\n\n이 길에서 살아남으려면 개혁, 안정, 군의 권력 사이에서 균형을 잡아야 합니다."
 ALG_reactioners: "군집 경제"
 ALG_reactioners1: "군집 경제"
 ALG_reactioners2: "군집 경제"
 ALG_reactioners3: "군집 경제"
 ALG_reactioners4: "군집 경제"
 ALG_reactioners5: "군집 경제"
 ALG_reactioners6: "군집 경제"
 ALG_reactioners7: "군집 경제"
 ALG_automobile_industry: "자동차 산업 육성"
 ALG_automobile_industry_desc: "알제리는 오랫동안 자동차 수요를 수입에 의존해 왔습니다. 국내 자동차 산업을 육성하면 일자리를 창출하고 수입을 줄이며 알제리를 지역 제조업 거점으로 자리매김시킬 수 있습니다."
 ALG_peugeot_deal: "푸조 투자"
 ALG_peugeot_deal_desc: "푸조가 알제리에 공장을 열 의향을 밝혔습니다. 이 제휴는 절실히 필요한 산업 역량을 제공해 줄 수 있습니다."
 ALG_renault_oran: "오랑의 르노"
 ALG_renault_oran_desc: "르노는 오랑에 생산 시설을 세울 의향이 있으며, 이는 차량의 안정적인 공급을 제공하고 우리 경제를 활성화할 것입니다."
 ALG_hyundai_tiaret: "티아레트의 현대"
 ALG_hyundai_tiaret_desc: "한국의 현대자동차가 티아레트에서 제휴를 맺을 준비가 되어 있으며, 이는 일자리를 창출하고 유럽 제조사에 대한 의존도를 줄여 줄 것입니다."
 ALG_volkswagen_relizane: "렐리잔의 폭스바겐"
 ALG_volkswagen_relizane_desc: "폭스바겐과 계열 브랜드(슈코다, 아우디, 세아트)가 렐리잔에 공장을 열 준비가 되어 있으며, 이는 우리의 산업 기반을 더욱 다변화할 것입니다."
 ALG_bmw_deal: "BMW 제휴"
 ALG_bmw_deal_desc: "독일의 BMW가 알제리에서 고급 및 프리미엄 차량을 조립하는 데 관심을 보였으며, 이는 우리 자동차 산업을 국제 수준으로 끌어올릴 것입니다."
 ALG_mercedes_trucks: "메르세데스 트럭"
 ALG_mercedes_trucks_desc: "다임러와 협력하면 알제리에서 메르세데스 군용 트럭과 중형 차량을 조립할 수 있으며, 이는 우리 군을 직접 지원합니다."
 ALG_auto_scandal: "자동차 부패 스캔들"
 ALG_auto_scandal_desc: "폭로를 통해 알제리의 자동차 조립 산업이 보조금은 유용되고 공장은 수입 키트를 재조립하는 것이 전부인, 부패로 얼룩진 사기극임이 드러났습니다. 이 스캔들은 심각한 정치적, 경제적 여파를 낳을 것입니다."
 ALG_import_ban: "자동차 수입 금지"
 ALG_import_ban_desc: "국내 산업을 보호하기 위해 대부분의 외국산 자동차 수입을 금지할 것입니다. 이 조치는 논란이 많으며 단기적으로 경제에 부담을 줄 것입니다."
 ALG_fiat_deal: "피아트 투자 협정"
 ALG_fiat_deal_desc: "피아트가 현대적인 산업 단지를 갖추고 알제리에 복귀하겠다고 제안했으며, 생산을 재개하고 우리 자동차 부문에 대한 대중의 신뢰를 회복시키겠다고 약속했습니다."
 ALG_indigenous_brand: "토종 브랜드 창설"
 ALG_indigenous_brand_desc: "외국 기업에 의존하는 대신, 알제리는 알제리인이 현지에서 설계하고 제작하는 자체 자동차 제조사를 만들어야 합니다."
 ALG_auto_exports: "알제리 자동차 수출"
 ALG_auto_exports_desc: "안정된 국내 자동차 산업을 갖춘 지금, 우리는 눈을 밖으로 돌려 알제리산 차량을 아프리카와 지중해 시장에 수출하기 시작할 수 있습니다."
 alg.1000.t: "자동차 산업 부패 스캔들"
 alg.1000.d: "대규모 부패 스캔들이 알제리의 자동차 부문을 뒤흔들었습니다. 조사 결과 이른바 '공장'의 상당수가 국가 보조금을 남용하고 비용을 부풀린 단순 재조립 공장에 불과했음이 드러났습니다. 대중의 신뢰가 무너지고 있으며 산업은 마비 상태에 직면했습니다."
 alg.1000.a: "국가적 수치다."
 ALG_tebboune_tt: "압델마지드 테분이 2019년 히라크 시위 이후 알제리 대통령이 됩니다. 아흐메드 우야히아, 압델말렉 셀랄, 알리 하다드, 무히딘 타쿠트를 비롯한 악명 높은 부패 정치인 일당이 체포되어 재판을 받습니다. 이는 새로운 시대의 시작을 알리지만, 개혁이 과연 얼마나 깊이 이루어질지에 대해서는 의구심을 품는 이가 많습니다."
 ALG_corruption_network: "부테플리카의 측근 집단"
 ALG_corruption_network_desc: "우야히아, 셀랄, 타쿠트를 포함한 정치인과 사업가들의 부패한 연결망이 알제리 정치를 지배하고 있습니다. 이들의 영향력은 국가를 약화시키고 대중의 분노를 부채질합니다."
 ALG_cleaning_the_state: "국가 정화"
 ALG_clean_government: "청렴한 정부"
 ALG_political_repression: "정치적 탄압"
 ALG_military_junta: "군사 정권"
 ALG_cleaning_the_state_desc: "측근 집단이 몰락하면서 알제리는 마침내 제도 내의 부패를 일소하고 국민의 신뢰를 회복하기 위한 조치에 나서고 있습니다."
 algeria_reforms.1.t: "테분 치하의 개혁"
 algeria_reforms.1.d: "압델아지즈 부테플리카의 사임과 압델마지드 테분의 당선 이후 알제리는 새로운 정치적 장을 맞이합니다. 테분은 개혁, 새 헌법, 그리고 전직 총리 아흐메드 우야히아와 압델말렉 셀랄, 사업가 알리 하다드와 무히딘 타쿠트 등이 속한 악명 높은 부패 연결망인 '이사바'(일당)의 해체를 약속했습니다. \n\n그러나 히라크 운동은 그의 약속에 여전히 회의적입니다. 이 개혁은 진정한 민주화로 이어질 것인가, 아니면 새로운 지도자 아래 정권을 보존하기 위한 수단에 불과한가?"
 algeria_reforms.1.a: "테분의 개혁을 지지한다"
 algeria_reforms.1.b: "국민은 더 많은 것을 요구한다!"
 ALG_arrest_the_gang: "측근 집단 체포"
 ALG_arrest_the_gang_desc: "알제리 국민은 정의를 요구합니다. 테분은 국가의 부를 빼돌린 우야히아, 셀랄, 하다드, 타쿠트 및 기타 부패 인사들에 대한 기소를 계속할 것입니다."
 ALG_at_a_crossroads: "기로에 선 국가"
 ALG_at_a_crossroads_desc: "우리나라가 전례 없는 도전에 직면한 지금, 우리는 역사의 중대한 순간에 서 있습니다. 지금 우리가 내리는 선택이 미래를 형성하고 사회의 향방을 결정할 것입니다. 변화와 개혁을 받아들일 것인가, 아니면 과거에 매달릴 것인가? 우리가 택하는 길이 우리의 유산을 규정할 것입니다."
 ALG_promises_of_reform: "개혁의 약속"
 ALG_promises_of_reform_desc: "새로운 알제리에는 새로운 헌법이 필요합니다. 테분은 대통령 임기를 제한하고 의회를 강화하며 더 많은 자유를 보장하는 개혁을 약속합니다."
 ALG_suppressed_opposition: "억압된 야당"
 ALG_black_decade_methods: "암흑의 10년의 수법"
 ALG_black_market: "암시장"
 ALG_pna_expansion: "인민국가군 확장"
 ALG_global_power: "세계적 강국"
 ALG_crackdown_on_dissent: "히라크 탄압"
 ALG_crackdown_on_dissent_desc: "시위는 멈추지 않았습니다. 테분은 대화 대신 탄압을 택하여 반대 의견을 잠재우고 국가를 보존하려 합니다."
 ALG_rebuild_trust_investors: "투자자와의 신뢰 재건"
 ALG_rebuild_trust_investors_desc: "수년간의 부패와 불안정 끝에, 우리 경제에 대한 국내외 투자자의 신뢰를 되찾아야 합니다."
 ALG_diversify_economy: "경제 다변화"
 ALG_diversify_economy_desc: "알제리는 석유와 가스에만 의존할 수 없습니다. 재생 에너지, 농업, 제조업이 우리 미래의 기둥이 될 것입니다."
 ALG_social_subsidies: "사회 보조금 보호"
 ALG_social_subsidies_desc: "국민은 연료, 빵, 주거에 대한 보조금에 의존합니다. 테분은 경제적 어려움에도 불구하고 이러한 보호책을 유지하겠다고 약속합니다."
 ALG_balance_regional_powers: "지역 강국 간 균형"
 ALG_balance_regional_powers_desc: "알제리는 유럽, 아프리카, 아랍 세계 사이에 서 있습니다. 우리의 이익에 부합하는 균형 잡힌 외교 정책을 유지해야 합니다."
 ALG_strengthen_russia_ties: "러시아와의 유대 강화"
 ALG_strengthen_russia_ties_desc: "모스크바와의 역사적 우호 관계는 국방 협력과 에너지 협정을 통해 더욱 깊어질 수 있습니다."
 ALG_china_investments: "중국의 투자"
 ALG_china_investments_desc: "일대일로 구상은 알제리에 기반시설을 현대화하고 대규모 중국 투자 사업을 유치할 기회를 제공합니다."
 ALG_north_south_highway: "남북 고속도로 사업"
 ALG_automobile_factories: "자동차 산업"
 ALG_automobile_factories_desc: "국민을 고용하고 더 많은 경제 역량을 확보하기 위해 외국 자동차 제조사를 우리나라에 초청해야 할 수도 있습니다."
 algeria_policy.1.t: "식민주의 정권 규탄"
 algeria_policy.1.d: "FLN은 과거 식민주의 정권을 강력히 규탄하는 성명을 발표하여 알제리 점령 기간 동안 저질러진 범죄를 비난했습니다. 이 선언은 국내에서는 민족적 자긍심을 불러일으켰으나 파리에서는 분노를 샀고, 알제리와 프랑스의 관계는 악화되었습니다."
 algeria_policy.1.a: "식민주의의 범죄를 폭로하라!"
 algeria_disaster.1.t: "부메르데스 지진"
 algeria_disaster.1.d: "부메르데스 시 인근을 진원지로 한 파괴적인 지진이 알제리 북부를 강타했습니다. 수천 명이 목숨을 잃었고 수만 명이 부상을 입었으며, 알제와 해안 지역의 광대한 부분이 폐허로 변했습니다. 구조 작업이 재난의 규모를 감당하지 못하는 가운데 국가는 충격에 휩싸여 있습니다. 질서를 회복하고 피해 주민에게 구호를 제공하기 위한 즉각적인 조치가 필요합니다."
 algeria_disaster.1.a: "긴급 대응팀을 동원하고 복구 작업을 개시한다"
 ALG_earthquake_recovery_tt: "구조 작업이 시작됩니다. 정부는 곧 재건 자금을 어떻게 조달할지 결정할 것입니다."
 algeria_disaster.2.t: "재건 및 복구 노력"
 algeria_disaster.2.d: "지진의 여파로 알제리는 현대사에서 가장 심각한 인도주의적 위기 중 하나에 직면했습니다. 수천 명이 거처 없이 남아 있으며 핵심 기반시설은 폐허가 되었습니다. 정부는 국가 자원을 이용한 국가 구호 기금을 조성할 것인지, 아니면 정치적 조건이 따를 수 있는 외국의 지원을 구할 것인지 재건 자금 조달 방식을 결정해야 합니다."
 algeria_disaster.2.a: "국가 구호 기금을 조성한다"
 ALG_state_aid_fund_tt: "피해 지역을 재건하기 위해 국가 자원을 할당합니다. 국고에 부담이 되겠지만 정부에 대한 국내 신뢰를 강화할 것입니다."
 algeria_disaster.2.b: "외국의 지원을 구한다"
 ALG_foreign_aid_dependence_tt: "국제 파트너에게 원조를 요청합니다. 재정적 압박은 완화되겠지만 알제리 내정에 대한 외국의 영향력이 커질 것입니다."
 ALG_french_influence: "그림자 속의 프랑스 영향력"
 ALG_french_influence_desc: "문서상으로는 독립 국가이지만, 알제리의 정치는 여전히 프랑스의 영향력이라는 그늘 아래 놓여 있습니다. 파리와 연결된 부패한 장군과 정치인들이 의사결정을 좌우하며 진정한 주권을 제한하고 있습니다."
 ALG_shadow_state: "그림자 속의 르 푸부아르"
 ALG_shadow_state_desc: "흔히 '르 푸부아르'라고 불리는 장군, 정보 장교, 사업가들의 은밀한 연결망이 알제리를 지배합니다. 부패는 국가를 약화시키지만, 이 그림자 체제는 정치적 안정을 보장하고 정권의 권력 장악력을 강화합니다."
 algeria_emerging_youth: "청년 조직"
 algeria_nationalist_youth: "청년 조직"
 algeria_nationalist_rise: "민족주의 부흥"
 algeria_nationalist_rise_desc: "정부가 국가에 대한 외세의 간섭에 분명히 반대하고 국가의 주권과 독립을 확고히 지지하기 때문에, 알제리에서 민족주의가 그 어느 때보다 인기를 얻고 있습니다."
 algeria_cultural_rebirth: "문화적 재탄생"
 ALG_PNA_victory: "군부 통치"
 ALG_PNA_victory_desc: "인민국가군(Armée nationale populaire)은 알제리의 군대입니다. 1962년 알제리가 독립한 이래로 정치에서 큰 역할을 해 왔습니다. 1988년 다당제가 도입될 때까지 사실상 정부를 통제했습니다. 이후에도 알제리 정치에 대한 영향력은 유지되고 있으며, 가장 최근의 사례는 2019년 시위로 군의 지지를 잃은 압델아지즈 부테플리카 대통령의 퇴진입니다."
 ALG_kick_out_morocco: "모로코 축출"
 ALG_kick_out_morocco_desc: "모로코는 언제나 우리를 자신들의 통제 아래 예속시켜 왔으며, 우리가 그들과의 관계를 유지할 이유는 없습니다. 이 이념적 적들을 알제리에서 쫓아낼 적기입니다!"
 ALG_statist_rise: "국가주의의 부상"
 ALG_statist_rise_desc: "자유주의 경제는 우리 국민에 대한 착취를 허용하고 국가의 독립과 통제를 훼손합니다. 알제리는 경제의 모든 측면을 국가와 연결하는 것이 최선입니다."
 ALG_maintain_military_role: "군의 영향력 유지"
 ALG_maintain_military_role_desc: "세계는 어둡고 어색한 시대로 접어들고 있으므로, 대가가 얼마가 되든 우리는 국가를 지켜야 합니다."
 ALG_kick_out_iran: "이란 축출"
 ALG_kick_out_iran_desc: "이란은 언제나 우리를 자신들의 통제 아래 예속시켜 왔으며, 우리가 그들과의 관계를 유지할 이유는 없습니다. 이 이념적 적들을 알제리에서 쫓아낼 적기입니다!"
 ALG_nationalize_oligarchic_holdings: "지주 회사 국유화"
 ALG_nationalize_oligarchic_holdings_desc: "경제에 대한 장악력을 강화하기 위해 이탈한 여러 과두 재벌의 지주 회사와 재산을 국유화할 것입니다."
 ALG_subsidise_police: "경찰 보조금 지급"
 ALG_subsidise_police_desc: "경찰은 국민이 안전하다고 느끼게 하고 알제리에서 우리의 통치를 보장하는 가장 중요한 요소 중 하나이지만, 그동안 자금이 크게 부족했습니다. 이는 바뀌어야 합니다."
 ALG_maintain_socialistic_policies: "사회주의 법 유지"
 ALG_maintain_socialistic_policies_desc: "이전 정부가 옳게 한 한 가지, 그리고 그들이 상대적으로 더 인기가 있었던 궁극적인 이유는 하층 계급을 지원한 사회주의 정책입니다. 우리는 전임 대통령 하피즈 알아사드가 시행한 정책을 계속 이어가고, 우리 자신을 억압받는 이들의 진정한 지지자로 내세울 것입니다."
 ALG_government_planned_economic_projects: "정부 사업"
 ALG_government_planned_economic_projects_desc: "책임 있는 정부라는 이미지를 높이고 서민의 지지를 모으기 위해 공공 사업을 개시해야 합니다."
 ALG_patriotic_propaganda: "애국적 선전"
 ALG_patriotic_propaganda_desc: "민족적 자긍심과 국가에 대한 충성의 중요성을 강조함으로써 우리의 이념적 입장을 강화할 것입니다."
 ALG_gather_support_from_peasantry: "농민의 지지"
 ALG_gather_support_from_peasantry_desc: "농민은 우리 국가의 근간이며, 그들이 우리를 지지하도록 확실히 해야 합니다."
 ALG_strong_government: "강력한 정부"
 ALG_strong_government_desc: "우리 정부가 안정적이며 통치할 능력이 충분하다는 것을 국민에게 보여 주어야 합니다. 이는 국민의 신뢰를 얻게 해 줄 것입니다."
 ALG_expand_youth_organizations: "청년 조직 확대"
 ALG_expand_youth_organizations_desc: "우리 정당들은 청년 조직에 크게 의존해 왔으며, 이제 우리가 권력의 자리에 올랐으므로 그들의 마음을 얻어 청년들이 우리의 이념적 대의를 지지하도록 장려할 때입니다."
 ALG_illiberal_democracy: "비자유주의적 민주주의"
 ALG_illiberal_democracy_desc: "자유주의는 가난한 나라를 감염시키고 착취하는 바이러스입니다. 국민에게 필요한 것은 국민을 진정으로 대표하면서 동시에 하나의 깃발 아래 단결시키는 진정한 민주주의입니다. 우리는 무슨 일이 있어도 민주주의 국가입니다."
 ALG_reestablish_intelligence_committee: "정보 기관 재건"
 ALG_reestablish_intelligence_committee_desc: "미래의 전쟁은 총과 전차가 아닌 정보로 치러집니다. 완전히 기능하는 정보 기관을 만드는 것은 우리의 책임입니다."
 ALG_national_security_act: "국가 안보법"
 ALG_national_security_act_desc: "극단주의 집단들은 우리 국가를 서서히 죽이고 있으며 우리 국민에게 위협이 됩니다. 그들의 공격은 우리 국가에 대한 명백한 위협이며, 대가가 얼마든 무슨 일이 일어나든 우리는 당장 그들을 저지해야 합니다. 테러는 멈춰야 합니다."
 ALG_pan_algerian_nationalism: "범알제리주의"
 ALG_pan_algerian_nationalism_desc: "알제리는 고유한 정체성으로 북아프리카 전역을 환히 밝혀야 할 나라입니다. 우리의 풍부한 역사와 문화는 우리의 진정한 잠재력과 정체성을 세계에 보여 주는 것이 우리의 의무임을 분명히 합니다."
 ALG_cultural_rebirth: "문화적 재탄생"
 ALG_cultural_rebirth_desc: "우리 국가는 서서히, 그러나 분명히 자신의 정체성을 인식해 가고 있습니다. 사소한 분열이 우리 국민의 아름다움을 깨닫는 길을 막아서는 안 됩니다. 우리 국민은 무슨 일이 있어도 결국 우리는 알제리인이라는 점을 인정해야 합니다."
 ALG_deal_with_the_trade_unions: "노조와의 협정"
 ALG_deal_with_the_trade_unions_desc: "강한 나라의 열쇠는 생산과 경제이므로 알제리의 모든 노동자가 우리를 지지하도록 확실히 해야 합니다."
 ALG_reassert_russian_ties: "러시아와의 유대"
 ALG_reassert_russian_ties_desc: "러시아는 우리가 현대적이고 안전하며 번영하는 국가가 되도록 돕는 유일하고 진정한 동맹입니다."
 ALG_russian_oil_excavation: "러시아 석유 협정"
 ALG_russian_oil_excavation_desc: "우리 국가에는 거대한 보물이 있으며, 우리의 동맹 러시아가 이 자원에 도달하도록 도울 것입니다."
 ALG_russian_algiers_base_expansion: "러시아 해군 주둔 확대"
 ALG_russian_algiers_base_expansion_desc: "강력한 해군을 당장 만들 수는 없지만, 러시아 친구들이 항구의 역량 확장을 지원하여 우리의 해안을 안전하게 지키도록 도울 것입니다."
 ALG_houarist_rise: "후아리주의의 부상"
 ALG_houarist_rise_desc: "후아리주의가 다시 부상하여 알제리를 다시 위대하게 만들 준비가 되어 있습니다."
 ALG_islamic_socialism: "이슬람 사회주의"
 ALG_islamic_socialism_desc: "사람들은 이슬람이 자카트와 사다카처럼 사회주의에서 비롯되었다고 여겨지는 수많은 관행을 옹호한다는 사실을 잊은 듯합니다. 우리의 이상을 이 관계에 기반하여 강조해야 하며, 이는 우리의 이상에 늘 맞서 왔던 이슬람주의자들의 지지도 모을 것입니다. 이슬람 사회주의는 우리 국가를 현대적이고 강력하며 덕망 있는 공화국으로 만드는 참된 길입니다."
 ALG_Get_rid_of_oligarchs: "과두 재벌 숙청"
 ALG_news.1.t: "기로에 선 알제리"
 ALG_news.1.d: "거의 10년에 걸친 잔혹한 폭력, 경제 붕괴, 정치적 정체 끝에, 2000년의 알제리는 결정적인 순간에 서 있습니다. 많은 이들이 '암흑의 10년'이라 부르는 내전은 수만 명의 사망자와 그보다 더 많은 난민을 남겼습니다. 전투의 강도는 줄었지만 긴장은 여전히 높으며 상처는 아직 아물지 않았습니다.\n\n국가의 미래가 불확실한 가운데, 경쟁하는 세력들이 이제 각기 다른 방향으로 밀어붙이고 있습니다. 한쪽 길은 국가적 화해와 민주적 개혁을 통해 나라를 통합하고자 합니다. 다른 길은 비상 통치를 연장하여 현 정권의 권력 장악을 유지하는 쪽으로 기웁니다. 그리고 세 번째 길은 끝나지 않은 전투와 급진적 약속, 무기를 내려놓기를 거부하는 이들의 계속되는 전쟁을 속삭입니다.\n\n알제리가 다음에 택하는 길은 수 세대에 걸쳐 그 운명을 좌우할 수 있습니다."
 ALG_news.1.a: "모든 시선이 알제에 쏠려 있다."
 Arab_Defense_Bloc: "아랍 방위 블록"
 The_Maghreb_Joint_Defense: "마그레브 공동 방위"
 ALG_bouteflika.3.t: "부테플리카의 건강 위기"
 ALG_bouteflika.3.d: "2013년 부테플리카는 쇠약해지는 뇌졸중을 겪었습니다. 기자 히쉠 아부드는 국가 안보, 영토 보전, 공화국 기관의 정상적 운영을 위협했다는 혐의로 추적당했고, 그가 기고하던 신문들은 검열되었습니다. 그가 대통령이 발드그라스 병원에서 혼수상태로 돌아왔다고 쓰고 사이드 부테플리카를 행정부를 배후에서 조종하는 인물로 규정했기 때문입니다."
 ALG_bouteflika.3.a: "어떻게 될 것인가?"
 ALG_boteflika_tt: "알제리 대통령 건강 위기 중점이 해금됩니다."
 ALG_bouteflika: "부테플리카 건강 위기 뉴스"
 ALG_bouteflika.2.t: "2014년 알제리 대통령 선거"
 ALG_bouteflika.2.d: "2014년 4월 17일 알제리에서 대통령 선거가 치러졌습니다. 현직 대통령 압델아지즈 부테플리카가 득표율 82%로 재선되었습니다. 선거 운동의 쟁점에는 1990년대의 피비린내 나는 내전 이후 국내 안정에 대한 열망이 포함되었습니다."
 ALG_bouteflika.2.a: "부테플리카 승리"
 ALG_bouteflika_health_crisis: "부테플리카의 건강 위기"
 ALG_bouteflika_health_crisis_desc: "대통령의 악화되는 건강은 알제리를 불안정하게 만들 위험이 있습니다. 그를 계속 권좌에 둘 것인가, 아니면 권력 이양을 준비할 것인가?"
 ALG_2014_elections: "2014년 대통령 선거"
 ALG_2014_elections_desc: "병환에도 불구하고 부테플리카는 4선에 출마합니다. 야당은 침묵당했고 결과는 이미 정해진 것이나 다름없습니다."
 ALG_2014_oil_crash: "유가 폭락"
 ALG_2014_oil_crash_desc: "유가의 급락이 알제리 경제를 황폐화시킵니다. 국민은 부패를 탓하며 변화를 요구합니다."
 ALG_silence_hirak: "히라크 시위 진압"
 ALG_silence_hirak_desc: "군과 경찰이 반대 의견을 억누를 것입니다. 거리는 피로 물들겠지만 정권은 살아남을 것입니다."
 ALG_listen_to_hirak: "개혁파의 요구 수용"
 ALG_listen_to_hirak_desc: "시위대를 달래기 위해 정치 개혁을 약속합니다. 구세력은 저항하겠지만 국민의 분노는 가라앉을 수 있습니다."
 ALG_2019_elections: "2019년 정치 위기"
 ALG_2019_elections_desc: "부테플리카의 5선 도전이 전국적인 분노에 불을 붙였습니다. 알제리는 혁명으로 폭발할 것인가, 아니면 폭정에 굴복할 것인가?"
 ALG_new_president: "신임 대통령 임명"
 ALG_new_president_desc: "히라크 운동이 승리했습니다. 과도 정부가 자유 선거를 실시하여 수십 년간의 권위주의 통치를 끝낼 것입니다."
 ALG_release_political_prisoners: "정치범 석방"
 ALG_release_political_prisoners_desc: "수천 명의 활동가, 언론인, 야권 인사들이 히라크 시위에 참여한 죄로 구금되어 고통받고 있습니다. 이들을 석방하는 것은 구체제와의 진정한 단절을 알리고 민주적 정통성을 뒷받침할 것입니다."
 ALG_corrupt_successor: "충성파 후계자 옹립"
 ALG_corrupt_successor_desc: "군은 꼭두각시가 권력을 잡도록 보장합니다. 부테플리카의 부패 유산이 이어집니다."
 alg_oil_crash_title: "유가 폭락"
 alg_oil_crash_desc: "유가가 폭락했습니다. 우리 국가는 살아남을 수 있을까요?"
 alg_oil_crash_option: "우려스럽군!"
 alg_hirak_victory_title: "국민의 승리"
 alg_hirak_victory_desc: "수년간의 시위 끝에 부테플리카가 물러납니다. 새로운 시대가 시작되지만, 이것이 오래 지속될 수 있을까요?"
 alg_military_rule_title: "장군들이 결정하다"
 alg_military_rule_desc: "군이 꼭두각시 지도자를 옹립합니다. 히라크는 당분간 짓밟혔습니다."
 algeria_tebboune.1.t: "2019년 대통령 선거"
 algeria_tebboune.1.d: "수개월에 걸친 시위와 압델아지즈 부테플리카의 사임 이후, 알제리 국민은 수십 년 만에 가장 논쟁적인 선거를 위해 투표소로 향합니다. 많은 이들이 이 과정을 구세력이 장악했다고 보는 반면, 다른 이들은 개혁이나 심지어 이슬람주의의 부활에 대한 희망을 놓지 않고 있습니다. 세 명의 주요 후보가 유력 주자로 부상했습니다. 기성 체제와 연결된 연속성 후보 압델마지드 테분, 독자적인 운동을 이끄는 자유주의 개혁가 알리 벤플리스, 그리고 평화를 위한 사회운동과 연계된 이슬람주의 지도자 압델카데르 벤그리나입니다. 이 선택이 알제리의 미래 행로를 결정할 것입니다."
 algeria_tebboune.1.a: "압델마지드 테분을 선출한다"
 algeria_tebboune.1.b: "알리 벤플리스를 선출한다"
 algeria_tebboune.1.c: "압델카데르 벤그리나를 선출한다"
 ALG_benflis_tt: "§Y알리 벤플리스§!가 자유주의 개혁파를 이끌며 알제리 대통령이 됩니다."
 ALG_bengrina_tt: "§Y압델카데르 벤그리나§!가 이슬람주의 야권을 대표하여 알제리 대통령이 됩니다."
 kabyle_resistance_info: "카빌리아 지역에서 소요가 일어나고 있습니다. 저항 수준: [?385.resistance|%Y]"
 kabyle_resistance_effects: "카빌리아에서 분리주의 지지가 증가하는지 감시하십시오. 현재 저항: [?385.resistance|%Y]"
 ALG_kabyle_resistance_tooltip: "카빌리아의 저항 수준:"
 ALG_suppress_kabyle: "카빌 운동 진압"
 ALG_suppress_kabyle_desc: "카빌 소요는 국가 주권에 대한 위협입니다. 분리주의 수사가 번성하도록 놔둘 수 없습니다. 거센 저항에 직면하더라도 강력한 탄압이 통제권을 재확립할 유일한 방법일 수 있습니다."
 ALG_recognize_kabyle: "카빌 독립 승인"
 ALG_recognize_kabyle_desc: "수십 년간의 긴장, 시위, 소요가 우리를 이 순간으로 이끌었습니다. 카빌의 독립 열망을 인정할 때가 되었을지도 모릅니다. 그렇게 하면 당장의 소요는 끝나겠지만 영토 보전을 대가로 치르게 됩니다."
 ALG_recognize_tamazight: "타마지트어 공인"
 ALG_recognize_tamazight_desc: "타마지트어를 공용어로 인정하는 것은 카빌 주민의 핵심 요구입니다. 그렇게 하면 국가 통합을 유지하면서도 그들의 문화적 정체성을 정당화할 수 있습니다."
 ALG_kabyle_cultural_reforms: "카빌 문화 개혁"
 ALG_kabyle_cultural_reforms_desc: "통합과 상호 존중을 도모하기 위해 카빌 지역의 교육, 지역 제도, 문화적 권리를 지원해야 합니다."
 ALG_internal_troops_kabyle: "내무 병력 배치"
 ALG_internal_troops_kabyle_desc: "카빌리아의 상황은 강력한 치안 병력의 주둔을 요구합니다. 지역을 확보하고 소요를 진압하기 위해 내무 병력을 배치할 것입니다."
 ALG_disrupt_kabyle_networks: "카빌 정치 연결망 와해"
 ALG_disrupt_kabyle_networks_desc: "분리주의 활동은 지하 정치 연결망을 통해 조율됩니다. 국가 안보를 지키려면 감시와 체포를 통한 와해가 필요합니다."
 KBY_build_a_new_state: "새로운 국가 건설"
 KBY_build_a_new_state_desc: "이제 독립했으므로, 우리는 제대로 기능하는 공화국의 토대를 마련해야 합니다. 헌법, 통치, 사회 서비스가 최우선 과제입니다."
 KBY_secure_our_borders: "국경 확보"
 KBY_secure_our_borders_desc: "주권을 선언한 만큼, 우리는 취약한 국경을 강화하고 적대적인 환경에서 생존을 보장해야 합니다."
 idea_ALG_neutrality: "알제리 중립"
 idea_ALG_neutrality_desc: "알제리는 더 이상 전쟁을 감당할 수 없으며, 중립이 최선의 선택입니다."
 idea_ALG_neutrality_2: "알제리 중립"
 idea_ALG_neutrality_2_desc: ""
 ALG_a_globalized_algeria: "세계화된 알제리"
 ALG_a_globalized_algeria_desc: "오늘날은 세계화의 시대이며, 알제리는 여기에 참여해야 합니다."
 ALG_international_investments: "국제 투자"
 ALG_international_investments_desc: ""
 ALG_export_driven_growth: "수출 주도 성장"
 ALG_export_driven_growth_desc: ""
 ALG_promote_sovereignty: "주권 증진"
 ALG_promote_sovereignty_desc: ""
 ALG_promote_human_rights: "인권 증진"
 ALG_promote_human_rights_desc: "그것이 국가 주권일지라도, 인권이 무엇보다 우선합니다."
 ALG_extract_favorable_terms: "유리한 조건 확보"
 ALG_extract_favorable_terms_desc: ""
 ALG_a_norm_entrepreneur: "규범 기업가"
 ALG_a_norm_entrepreneur_desc: ""
 ALG_Algeria_resplendent: "찬란한 알제리"
 ALG_Algeria_resplendent_desc: ""
 ALG_national_strength: "국력"
 ALG_national_strength_desc: ""
 ALG_terror_2003_hostage_title: "사하라 인질 위기"
 ALG_terror_2003_hostage_desc: "유럽인 관광객 일행이 알제리 사막에서 이슬람주의 무장 세력에게 인질로 붙잡혔습니다. 사상자는 보고되지 않았으나, 이는 조직적인 지하디스트 활동의 우려스러운 증가의 시작을 의미합니다."
 ALG_terror_2003_hostage_option: "앞으로 닥칠 일의 불길한 징조다"
 ALG_terror_monitor: "테러 위협 감시"
 ALG_conduct_security_raids: "보안 급습 실시"
 ALG_terror_threat_category: "테러 위협 감시"
 ALG_terror_2007_algiers_title: "알제 폭탄 테러"
 ALG_terror_2007_algiers_desc: "대규모 자살 폭탄 테러가 알제의 정부 청사를 강타했습니다. 민간인과 정부 직원 30명 이상이 사망했으며, 최근 몇 년간 가장 치명적인 공격 중 하나입니다."
 ALG_terror_2007_batna_title: "바트나 폭탄 테러"
 ALG_terror_2007_batna_desc: "자살 폭탄범이 바트나에서 대통령을 보기 위해 기다리던 군중 근처에서 폭발물을 터뜨렸습니다. 이 공격으로 20명 이상이 사망했습니다."
 ALG_terror_2008_issers_title: "이세르 경찰학교 폭탄 테러"
 ALG_terror_2008_issers_desc: "차량 폭탄 자살 공격이 이세르 학교의 경찰 신병들을 겨냥하여 43명이 사망하고 수십 명이 부상을 입었습니다."
 ALG_terror_generic_option: "비극적인 소식이다."
 ALG_terror_2000_bus_ambush_title: "메데아 인근 버스 매복 공격"
 ALG_terror_2000_bus_ambush_desc: "무장 세력이 메데아 인근에서 승객 버스를 대상으로 치명적인 매복 공격을 벌였습니다. 민간인 19명이 목숨을 잃었습니다. 이 공격은 내전 이후 시기에도 불안정이 계속되고 있음을 시사합니다."
 ALG_terror_2002_tazmalt_title: "타즈말트 폭탄 테러"
 ALG_terror_2002_tazmalt_desc: "타즈말트에서 폭탄이 터져 여러 민간인이 사망하거나 부상을 입었습니다. 보안군은 GSPC의 잔당을 의심하고 있습니다."
 ALG_terror_2002_miliana_title: "밀리아나 폭탄 테러"
 ALG_terror_2002_miliana_desc: "밀리아나 인근에서 도로변 급조폭발물이 터져 여러 군인이 부상을 입었습니다."
 ALG_terror_2002_hammam_title: "함맘 리가 폭탄 테러"
 ALG_terror_2002_hammam_desc: "함맘 리가에서 수제 폭발물이 터져 군 호송대를 겨냥했습니다."
 ALG_terror_2002_larbaa_title: "라르바 폭탄 테러"
 ALG_terror_2002_larbaa_desc: "무장 세력이 라르바에서 폭탄을 터뜨려 국가 당국에 대한 캠페인을 이어갔습니다."
 ALG_terror_2002_msila_title: "므실라 폭탄 테러"
 ALG_terror_2002_msila_desc: "므실라에서 급조폭발물이 터져 지역 내 테러 조직의 끈질김을 다시 한번 보여 주었습니다."
 ALG_terror_2003_tizi_title: "티지우주 폭탄 테러"
 ALG_terror_2003_tizi_desc: "티지우주에서 치명적인 폭발이 발생했습니다. 사망자 중에는 민간인이 포함되었으며, 보안군은 GSPC의 개입을 의심하고 있습니다."
 ALG_terror_2004_tebessa_title: "테베사 폭탄 테러"
 ALG_terror_2004_tebessa_desc: "테베사에서 일어난 조직적인 폭탄 테러로 7명이 사망했습니다. 점점 커지는 공격 규모가 우려스럽습니다."
 ALG_idea_arab_diplomacy: "아랍 외교"
 ALG_terror_2005_tidjelabine_title: "티드젤라빈 폭탄 테러"
 ALG_terror_2005_tidjelabine_desc: "티드젤라빈에서 차량 폭탄이 순찰대를 강타하여 헌병 두 명이 사망했습니다."
 ALG_relying_on_our_own_strength_spirit: "자력 의존"
 ALG_relying_on_our_own_strength_spirit_desc: "알제리가 번영하는 데 필요한 것은 오직 알제리인뿐이며, 그 누구도 필요하지 않습니다."
 ALG_hydroelectric_power_plants_upgraded_idea: "§R소나트라크§! - 수력 발전소 개선"
 FLN_nationalize_resources: "자원 국유화"
 FLN_nationalize_resources_desc: "알제리의 천연자원은 주권과 번영의 열쇠입니다. 자원을 국유화함으로써 석유, 가스, 광물에서 창출되는 부가 알제리 국민에게 직접 이익이 되도록 보장하고 장기적인 경제적 독립의 토대를 마련할 수 있습니다."
 ALG_revivify_non_aligned_movement: "비동맹 운동 재활성화"
 ALG_revivify_non_aligned_movement_desc: "비동맹 운동의 자랑스러운 회원국으로서 알제리는 이 독립 국가들의 블록에 다시 활력을 불어넣어야 합니다. 동료 중립국과의 유대를 강화함으로써 초강대국의 지배에 저항하고 분열된 세계에서 진정한 주권의 길을 개척할 수 있습니다."
 ALG_reach_out_ASEAN: "아세안에 손길을 내밀기"
 ALG_reach_out_ASEAN_desc: "동남아시아 국가들은 외세의 간섭 없는 발전이라는 우리의 열망을 공유합니다. 아세안과 더욱 긴밀한 협력을 구축하면 새로운 경제적 기회가 열리는 동시에 다극 세계 질서가 강화될 것입니다."
 ALG_support_developing_world: "개발도상국 지원"
 ALG_support_developing_world_desc: "알제리는 억압받고 빈곤한 국가들과 연대합니다. 경제 원조, 기술 교류, 외교적 옹호를 통해 글로벌 사우스의 지위를 끌어올리고 신식민주의적 착취에 맞설 수 있습니다."
 ALG_between_east_and_west: "동서 사이에서"
 ALG_between_east_and_west_desc: "대립하는 블록 사이에 낀 알제리는 신중하게 길을 헤쳐 나가야 합니다. 자본주의 강대국과 사회주의 강대국 모두와 균형 잡힌 관계를 유지함으로써 어느 한쪽 진영에도 독립을 내주지 않고 핵심 투자를 확보할 수 있습니다."
 ALG_mediate_great_power_conflict: "강대국 분쟁 중재"
 ALG_mediate_great_power_conflict_desc: "초강대국 간 긴장이 고조되는 가운데 알제리는 정직한 중개자 역할을 할 수 있습니다. 우리의 중립과 도덕적 권위는 점점 불안정해지는 세계에서 위기를 완화하고 평화 공존을 증진하는 데 유리한 위치를 제공합니다."
 ALG_promote_reconciliation: "화해 증진"
 ALG_promote_reconciliation_desc: "아프리카에서 중동에 이르기까지 형제 사이에 분쟁이 격화되고 있습니다. 혁명 유산과 외교 경험을 지닌 알제리는 분열된 국가들 사이에 대화와 단결을 촉진해야 합니다."
 ALG_secure_balance: "균형 확보"
 ALG_secure_balance_desc: "패권이 경쟁하는 세계에서 균형은 우리의 안전장치입니다. 외교 정책을 신중하게 조정함으로써 어느 한 강대국의 지배를 막고 모두로부터 최대의 이익을 끌어낼 수 있습니다."
 ALG_joining_brics: "BRICS 가입"
 ALG_joining_brics_desc: "알제리는 신흥국 그룹인 BRICS에 가입하여 세계적 영향력을 강화하고 경제 성장과 정치적 협력을 모두 증진하고자 합니다."
 ALG_align_with_brazil: "브라질과의 유대 강화"
 ALG_align_with_brazil_desc: "브라질은 알제리처럼 세계 정세에서 독자적인 길을 모색합니다. 이 남미의 거인과의 협력을 심화함으로써 농업과 기술 분야의 무역을 증진하고 국제 무대에서 신식민주의적 압력에 맞서 단합된 모습을 보일 수 있습니다."
 ALG_align_with_india: "인도와의 전략적 동반자 관계 구축"
 ALG_align_with_india_desc: "인도의 비동맹 입장과 성장하는 산업력은 인도를 자연스러운 동맹으로 만듭니다. 에너지 사업, 군사 교류, UN 외교에서의 협력은 남남 협력을 증진하는 동시에 초강대국의 지배에 맞서 양국을 강화할 것입니다."
 ALG_islamic_monarchy_idea: "이슬람 군주제"
 ALG_islamic_monarchy_idea_desc: "알제리는 이슬람 원칙과 민족 전통에 뿌리를 둔 신성한 군주제를 복원했습니다."
 ALG_caliph_crowned: "왕관을 쓴 칼리파"
 ALG_caliph_crowned_desc: "칼리파는 법뿐만 아니라 국민의 의지와 신앙의 유산에 의해 통치합니다."
 ALG_amir_al_muminin_idea: "아미르 알무으미닌"
 ALG_amir_al_muminin_idea_desc: "신도들의 지휘관, 이슬람 세계 전역에서 영적, 정치적 무게를 지닌 칭호입니다."
 ALG_maghreb_alliance_idea: "마그레브의 기둥"
 ALG_maghreb_alliance_idea_desc: "알제리는 서부 이슬람 세계를 새로운 종교적, 정치적 질서 아래 통합하려는 노력을 주도합니다."
 ALG_restore_caliphate_in_algiers: "알제에서 칼리파국 복원"
 ALG_restore_caliphate_in_algiers_desc: "공화국은 실패했습니다. 신앙과 역사에 뿌리를 둔 신성한 군주제를 복원할 때가 왔습니다. 알제에서 새로운 칼리파국이 일어설 것입니다."
 ALG_crown_the_caliph: "칼리파 즉위"
 ALG_crown_the_caliph_desc: "칼리파국의 정당한 후계자가 선택되었습니다. 알제에서 거행되는 의식과 함께 왕관이 복원되고, 세계는 새로운 아미르 알무으미닌을 인정할 것입니다."
 ALG_amir_al_muminin: "아미르 알무으미닌"
 ALG_amir_al_muminin_desc: "우리는 칼리파를 신도들의 지휘관인 아미르 알무으미닌으로 선포합니다. 이 칭호는 그에게 이슬람 세계 전역에 걸친 영적, 정치적 정통성을 부여합니다."
 ALG_umayyad_legacy: "우마이야 유산 선포"
 ALG_umayyad_legacy_desc: "알제리는 한때 대륙에 걸쳐 영광이 뻗었던 우마이야 왕조의 기억을 불러냅니다. 우리는 스스로를 그 유산의 계승자로 자리매김합니다."
 ALG_reclaim_al_andalus: "알안달루스 수복"
 ALG_reclaim_al_andalus_desc: "알안달루스의 땅은 한때 이슬람 세계의 보석이었습니다. 이를 수복하고 이베리아에서 우리의 고대 문명을 부활시킬 때가 왔습니다."
 ALG_reclaim_the_crown: "왕관 회복"
 ALG_reclaim_the_crown_desc: "이슬람의 정통성에 뿌리를 둔 정당하고 신의 인도를 받는 군주제를 복원할 때가 왔습니다. 공화정의 실패와 내전의 잿더미 속에서 우리는 역사적인 왕관을 부활시켜, 신앙, 질서, 유산이라는 왕실의 기치 아래 국가를 단결시킬 것입니다. 압바스 왕조의 후계자이든, 되살아난 베르베르 왕조이든, 새로운 이슬람 통합의 상징이든, 왕관은 다시 한번 알제리 위에서 빛날 것입니다."
 ALG_pillars_of_the_maghreb: "마그레브의 기둥"
 ALG_pillars_of_the_maghreb_desc: "알제리는 서쪽의 형제인 모로코, 튀니지와의 단결을 모색하여 북아프리카 통합 이슬람 블록의 토대를 형성하고자 합니다."
 ALG_monarchy_tt: "§O알제리의 새로운 군주로서 우리는 신도들로부터 지즈야와 자카트를 징수합니다. 알라의 인도에 따라 우리의 통치를 이어갈 것입니다.§!"
 ALG_recovering_from_the_civil_war: "내전으로부터의 회복"
 ALG_recovering_from_the_civil_war_desc: "알제리 내전은 국가에 깊은 상처를 남겼습니다. 분쟁은 끝났지만 그 여파는 여전히 남아 정치 지형과 국민 정서에 영향을 미치고 있습니다. 내전이 끝난 지 수년이 지났지만 알제리는 여전히 그 그림자와 씨름하고 있습니다. 분쟁의 상처는 아직 완전히 아물지 않았지만, 국가는 재건하겠다는 결의를 굳게 지키고 있습니다."
 MSP_non_aligned_revival: "비동맹 외교 정책 부활"
 MSP_non_aligned_revival_desc: "1960년대와 마찬가지로 중립과 남반구 연대의 정신을 되살릴 것입니다."
 MSP_global_south_solidarity: "글로벌 사우스 연대"
 MSP_global_south_solidarity_desc: "알제리는 무역, 외교, 원조를 통해 탈식민 국가들과의 유대를 강화할 것입니다."
 MSP_north_africa_first: "북아프리카 우선"
 MSP_north_africa_first_desc: "우리와 인접한 지역의 외교와 발전을 주도하는 데 집중할 것입니다."
 MSP_western_sahara_position: "서사하라 지원"
 MSP_western_sahara_position_desc: "모로코의 영유권 주장에 맞서 사흐라위의 독립에 대한 우리의 지지를 재확인합니다."
 MSP_african_union_engagement: "아프리카 연합 가입"
 MSP_african_union_engagement_desc: "알제리는 다시 가입하여 대륙 외교에서 주도적 역할을 맡아야 합니다."
 MSP_sahel_initiatives: "사헬로 확장"
 MSP_sahel_initiatives_desc: "소프트 파워와 방위를 통해 사헬의 불안정과 테러에 맞서 싸울 것입니다."
 MSP_arab_world_outreach: "아랍 외교 관계 심화"
 MSP_arab_world_outreach_desc: "아랍 세계에서 알제리의 영향력을 강화하려면 외교적 접촉과 조율 노력을 활성화해야 합니다. 양자 방문, 정상회담, 무역 구상을 통해 알제리는 지역의 통합 세력으로 자리매김할 수 있습니다."
 MSP_join_arab_league: "아랍 연맹 참여 강화"
 MSP_join_arab_league_desc: "알제리는 아랍 연맹의 기존 회원국으로서 단순한 참여를 넘어 외교적 주도 역할을 맡을 수 있습니다. 경제 조율, 방위 협의, 문화적 연대를 증진하면 아랍 세계에서의 위상이 높아질 것입니다."
 MSP_support_palestine: "팔레스타인 대의 지원"
 MSP_support_palestine_desc: "알제리는 오랫동안 팔레스타인의 자결 투쟁을 지지해 왔습니다. 새로워진 외교적 지원, 인도적 원조, 국제적 옹호는 팔레스타인의 권리를 수호하는 우리의 원칙적 입장을 재확인할 것입니다."
 MSP_algeria_algiers_axis: "이집트-알제 축 구축"
 MSP_algeria_algiers_axis_desc: "이집트와 더욱 긴밀히 협력함으로써 알제리는 아랍 통합을 이끌고 북아프리카의 안정을 확보하며 외세의 영향력을 상쇄할 수 있는 강력한 지역 블록을 형성하는 데 기여할 수 있습니다."
 MSP_condemn_israel: "이스라엘의 행동 규탄"
 MSP_condemn_israel_desc: "지속되는 침략과 인권 침해에 비추어, 알제리는 국제 무대에서 이스라엘의 행동을 공식적으로 규탄하며 정의로운 평화에 대한 지지를 규합하고 해결 없는 관계 정상화에 반대할 것입니다."
 MSP_palestinian_aid_package: "팔레스타인 원조 패키지"
 MSP_palestinian_aid_package_desc: "팔레스타인 영토에 인도적, 경제적, 기술적 지원을 제공하기 위해 자원을 할당하여, 알제리의 헌신이 말에 그치지 않고 실질적이고 영향력 있는 원조로 이어지도록 보장할 것입니다."
 MSP_pan_african_defense_initiative: "범아프리카 방위 구상"
 MSP_pan_african_defense_initiative_desc: "아프리카의 주권을 보호하고 대륙의 안정을 높이기 위해 알제리는 공동의 위협에 맞서 집단적 군사 대비 태세를 구축하는 조율된 아프리카 방위 구상을 제안할 것입니다."
 MSP_send_troops_to_sahel: "사헬에 병력 배치"
 MSP_send_troops_to_sahel_desc: "사헬의 불안정이 커지는 데 대응하여, 알제리는 지역 정부와 협력하여 평화 유지 작전, 국경 방어, 대테러 캠페인을 지원할 병력을 파견할 것입니다."
 MSP_sahel_stabilization_force: "사헬 안정화군"
 MSP_sahel_stabilization_force_desc: "알제리는 지역의 반란과 범죄 조직에 맞서기 위한 아프리카 주도의 안보 체계인 상설 사헬 안정화군 창설을 주도할 것입니다."
 MSP_exploit_sahel_resources: "사헬 자원 개발"
 MSP_exploit_sahel_resources_desc: "사헬에서의 알제리의 영향력은 개발되지 않은 천연자원에 대한 접근권을 제공합니다. 채굴 및 기반시설 계약을 협상함으로써 이 지역에서 경제적 이익과 전략적 동반자 관계를 확보할 수 있습니다."
 MSP_propose_maghreb_union: "마그레브 연합 제안"
 MSP_propose_maghreb_union_desc: "통합된 마그레브라는 비전을 되살릴 때입니다. 알제리는 경제 협력, 공동 기반시설, 외교적 보조 일치에 중점을 둔 새로운 통합 노력을 제안하는 데 앞장설 것입니다."
 MSP_economic_integration_initiative: "마그레브 경제 통합"
 MSP_economic_integration_initiative_desc: "관세 인하, 기반시설 투자, 통화 정책 조율 논의를 통해 알제리는 모든 회원국에 이익이 되는 공동 마그레브 경제권을 창설하려는 노력을 주도할 것입니다."
 MSP_maghreb_joint_defense_pact: "마그레브 공동 방위 조약"
 MSP_maghreb_joint_defense_pact_desc: "안전한 마그레브에는 집단 방위가 필요합니다. 국경 방어, 정보 공유, 연합 군사 훈련에 중점을 둔 지역 군사 조약을 제안할 것입니다."
 MSP_mediterranean_dialogue: "지중해 대화"
 MSP_invite_iraq: "이라크 초청"
 MSP_invite_iraq_desc: "이라크가 서서히 안정을 찾아가고 있으므로 우리 동맹에 초청해야 하며, 상호 협력은 우리에게 큰 이익이 될 것입니다."
 MSP_invite_syria: "시리아 초청"
 MSP_invite_syria_desc: "시리아가 우리나라 바로 남쪽에 있다는 것은 우리가 매우 취약하다는 뜻입니다. 시리아를 우리 세력에 초청하는 것은 우리의 안보와 안전을 보장하는 훌륭한 방법이 될 것입니다."
 MSP_invite_algeria: "이집트 초청"
 MSP_invite_algeria_desc: "이집트는 떠오르는 강국이며, 그 정도 규모의 인구를 보유한 만큼 우리 동맹은 사실상 무엇이든 이룰 수 있을 것입니다."
 MSP_assistance_to_bulgaria: "불가리아 지원"
 MSP_assistance_to_bulgaria_desc: "불가리아의 기반시설 개발을 지원하여 우리가 불가리아 국경 너머에서 더 쉽게 투자를 진행할 수 있도록 해야 합니다."
 MSP_supp_plo: "PLO 지원"
 MSP_supp_plo_desc: "팔레스타인 해방 기구(PLO)는 오랫동안 팔레스타인 자결을 위한 투쟁의 핵심 주체였습니다. PLO를 지원하면 국제 동맹국들 사이에서 우리의 입지가 강화되고 분쟁의 평화적 해결을 촉진할 수 있습니다."
 MSP_the_pal_issue: "팔레스타인 문제"
 MSP_the_pal_issue_desc: "팔레스타인 문제는 우리 외교 정책의 핵심 사안으로 남아 있습니다. 팔레스타인의 투쟁에 대한 우리의 입장이 지역에서의 국제 동맹과 영향력을 규정할 것입니다. 이 지속되는 분쟁에 어떻게 대처할지 결정해야 합니다."
 MSP_supp_hamas: "하마스 지원"
 MSP_supp_hamas_desc: "하마스는 팔레스타인 저항 운동 내 상당한 한 축을 대표합니다. 지원을 제공함으로써 이 집단과의 유대를 강화하고, 지역 내 영향력을 높이며, 그들의 투쟁과 보조를 맞출 수 있습니다."
 MSP_Get_rid_of_military_corrupt: "군부 부패 세력 숙청"
 MSP_Get_rid_of_military_corrupt_desc: "군은 우리 제도에 뿌리내렸으며 우리나라의 미래에 대한 명백한 위협입니다. 부패 혐의로 그들을 체포하고 손에 넣을 수 있는 재산을 몰수할 것입니다."
 MSP_reverse_secularization: "세속화 되돌리기"
 MSP_arm_palestinians_to_fight: "팔레스타인인 무장"
 MSP_arm_palestinians_to_fight_desc: "요르단에는 많은 팔레스타인 난민이 살고 있습니다. 우리는 이 난민들을 전투원으로 만들고, 그들을 부추겨 팔레스타인과 이스라엘에서 혼란을 일으키게 할 수 있습니다. 이들은 대리 전투원이므로 이스라엘이 보복하도록 유도하여, 이스라엘을 분쟁의 악당처럼 보이게 만들 수 있습니다."
 MSP_zionist_threat: "시온주의자의 위협"
 MSP_zionist_threat_desc: "이스라엘은 모든 무슬림에 대한 가장 큰 모욕이며, 이슬람의 심장부에 자리한 가증스러운 가짜 국가입니다. 그들은 지구상에서 지워져야 합니다."
 ALG_kabyle_issue: "카빌 문제"
 ALG_kabyle_issue_map: "우리 정부에 대한 [KBY.GetFlag] 아마지그 민족의 만족도!"
 ALG_2014_oil_crash_idea: "유가 폭락"
 ALG_algeria_resplendent: "찬란한 알제리"
 ALG_algeria_resplendent_desc: ""
 KBY_new_state_born: "새로운 국가의 탄생"
 KBY_new_state_born_desc: "카빌리아가 주권 국가로 다시 태어났습니다. 독립 초기에는 공고화, 축하, 그리고 신중함이 함께해야 합니다."
 KBY_border_readiness: "국경 대비 태세"
 KBY_border_readiness_desc: "침투, 밀수, 침범을 막기 위해 조국의 경계를 확보해야 합니다."
 KBY_new_institutions: "새로운 제도"
 KBY_new_institutions_desc: "제대로 기능하는 국가는 신뢰받고 안정적인 제도의 토대 위에 서야 합니다."
 KBY_state_economy_plan: "국가 경제 계획"
 KBY_state_economy_plan_desc: "중앙집권적이든, 시장 주도적이든, 혼합형이든 경제의 구조를 윤곽 지어야 합니다."
 KBY_african_diplomacy: "아프리카 외교"
 KBY_african_diplomacy_desc: "아프리카 이웃 국가들 사이에서 지역적 정통성을 추구하면 우리의 위상과 경제적 기회가 높아질 것입니다."
 KBY_international_recognition_campaign: "국제 승인 캠페인"
 KBY_international_recognition_campaign_desc: "우리의 생존은 다른 국가들이 보는 정통성에 달려 있습니다. 표적을 정한 외교 공세를 개시하십시오."
 KBY_international_recognition_campaign_completion: "외교 채널이 열렸으며, 이제 설득이라는 어려운 과업이 시작됩니다."
 KBY_establish_governance_structures: "통치 구조 수립"
 KBY_establish_governance_structures_desc: "우리의 통치 원칙이 지속되도록 보장하는 제도를 만들어야 합니다."
 KBY_establish_governance_structures_completion: "정부 기관이 이제 가동되어 시민에게 봉사할 준비가 되었습니다."
 KBY_plan_the_economy: "경제 계획"
 KBY_plan_the_economy_desc: "우리의 경제적 미래를 결정하십시오. 국가 주도, 자유주의, 혼합형 중에서. 각 길마다 고유한 상충 관계가 있습니다."
 KBY_plan_the_economy_completion: "경제 계획이 진행 중이니, 장기적 번영을 위해 현명하게 선택하십시오."
 KBY_seek_regional_support: "지역의 지지 모색"
 KBY_seek_regional_support_desc: "이웃과 아프리카 공동체의 지지는 우리의 정통성을 강화할 것입니다."
 KBY_seek_regional_support_completion: "지역 접촉 노력이 전개되었으며, 이제 응답을 기다립니다."
 KBY_secure_internal_stability: "내부 안정 확보"
 KBY_secure_internal_stability_desc: "외부 위협이 통제된 지금, 우리는 내부의 반대와 저항에 대처해야 합니다."
 KBY_secure_internal_stability_completion: "보안 절차가 발동되었으며 공공 질서가 개선되었습니다."
 KBY.10.t: "국제 관계 수립"
 KBY.10.d: "우리의 독립이 국제사회에서 승인된 지금, 카빌리아가 다른 국가들과 공식적인 외교 관계를 수립할 때가 되었습니다. 우리의 외교관들은 역사적 유대가 있는 프랑스와, 아마지그 대의에 관심을 보인 튀르키예를 시작으로 잠재적 파트너들에게 손을 내밀 준비가 되어 있습니다.\n\n이 외교 공세는 우리 신생 국가의 정통성을 확립하고 향후 협력의 문을 열어 줄 것입니다."
 KBY.10.a: "모든 국가에 손을 내밀 것이다!"
 KBY.15.t: "아프리카 단결 모색"
 KBY.15.d: "우리의 아프리카 외교 구상은 대륙과의 더 깊은 통합을 위한 토대를 마련했습니다. 아프리카 연합은 우리 국가에 중요한 무대이며, 회원국이 되면 정통성, 경제적 기회, 그리고 북아프리카 전역에서 아마지그의 권리를 옹호할 발판을 얻게 됩니다.\n\n상당한 투아레그 인구를 가진 니제르는 우리의 가입 신청에 대한 지지를 표명했습니다."
 KBY.15.a: "아프리카 연합에 가입을 신청한다"
 KBY_diplomatic_move: "카빌리아 외교 공세"
 KBY_au_membership_attempt: "카빌리아의 AU 가입 시도"
 KBY_state_economy_model_statist: "국가 주도 경제"
 KBY_state_economy_model_liberal: "자유 시장 경제"
 KBY_state_economy_model_mixed: "혼합 경제 모델"
 ALG_recover_from_the_war: "내전으로부터의 회복"
 ALG_restoring_order: "질서 회복"
 ALG_restoring_order_desc: "당면한 최우선 과제는 국가 권위를 재확립하고 일부 지역에서 계속되는 혼란을 멈추는 것입니다. 국민은 수년간의 황폐화 이후 평화와 질서를 갈망합니다."
 ALG_secure_weapons_shipments: "무기 수송 확보"
 ALG_secure_weapons_shipments_desc: "군에 충분한 보급이 이루어지도록 보장하면 내부 질서를 유지하고 반란의 재발을 막을 수 있을 것입니다."
 ALG_recover_from_the_war_desc: "이제 국가를 재건하는 긴 과정을 시작해야 합니다. 암흑의 10년은 알제리에 상처를 남겼지만, 결의가 있다면 잿더미에서 일어설 수 있습니다."
 ALG_restoring_the_broken_economy: "국가 경제 회복"
 ALG_restoring_the_broken_economy_desc: "내전은 우리의 금융 기관을 마비시켰습니다. 경제를 안정시키기 위해 긴급 조치를 시행해야 합니다."
 ALG_arresting_extremists: "무장 위협 제거"
 ALG_arresting_extremists_desc: "극단주의 집단은 여전히 외딴 지역에서 활동하고 있습니다. 새로운 보안 캠페인은 완전한 국가 통제를 회복시킬 것입니다."
 ALG_economic_recovery: "경제 회복"
 ALG_economic_recovery_desc: "우리의 정책이 결실을 맺기 시작하고 있습니다. 이제 점진적인 회복과 신뢰 재건의 단계로 접어들고 있습니다."
 ALG_regain_banks: "은행 부문 신뢰 회복"
 ALG_regain_banks_desc: "은행 부문을 되살리는 것은 투자자의 신뢰를 회복하고 국내 신용을 재가동하는 데 매우 중요합니다."
 ALG_financial_reform: "금융 체계 개혁"
 ALG_financial_reform_desc: "알제리의 금융 체계를 현대화하면 지속 가능한 성장을 장려하고 향후의 충격을 피할 수 있습니다."
 ALG_begin_full_recovery: "전면적인 경제 복구 개시"
 ALG_begin_full_recovery_desc: "안보가 확보되고 경제가 안정된 지금, 우리는 전국적인 경제 부흥을 본격적으로 시작할 수 있습니다."
 ALG_repairing_the_roads: "기반시설 복구"
 ALG_repairing_the_roads_desc: "도로, 교량, 통신선이 무너졌습니다. 물류망을 재건하는 것은 국가 결속에 필수적입니다."
 ALG_rebuild_north: "카빌리와 알제 재건"
 ALG_rebuild_north_desc: "이 도시 중심지들은 가장 큰 타격을 입은 곳 중 하나였습니다. 카빌리와 알제의 기본 서비스를 복구하는 데 우선순위를 두어야 합니다."
 ALG_rebuild_centre: "고원 지대 재건"
 ALG_rebuild_centre_desc: "중부 고원 지대는 전장이자 인도주의적 위기의 현장이었습니다. 표적을 정한 재건이 필요합니다."
 ALG_rebuild_west: "서부 재건"
 ALG_rebuild_west_desc: "서부의 기반시설은 전쟁 전부터 방치되어 있었습니다. 이 외딴 지역들을 통합할 때입니다."
 ALG_rebuild_algeria: "알제리 재건"
 ALG_rebuild_algeria_desc: "국가를 재건하고 다시 강대국이 될 때입니다. 이 내전은 너무 많은 상처를 남겼으며, 이제는 치유할 때입니다."
 ALG_rebuild_south: "남부 재건"
 ALG_rebuild_south_desc: "남부의 기반시설은 전쟁 전부터 방치되어 있었습니다. 이 외딴 지역들을 통합할 때입니다."
 ALG_order_restored_in_algeria: "알제리에 질서 회복"
 ALG_order_restored_in_algeria_desc: "수십 년 만에 처음으로 알제리는 안정되고 통합되었습니다. 앞길은 멀지만 평화가 돌아왔습니다."
 ALG_state_and_imf_funding: "국가 및 IMF 자금"
 ALG_state_and_imf_funding_desc: "대출과 특히 IMF의 해외 원조를 통해 교착 상태에 빠진 경제에 활력을 불어넣을 수 있습니다."
 ALG_restocking_factories: "공장 재고 보충"
 ALG_restocking_factories_desc: "많은 공장이 손상되었거나 비었습니다. 새로운 물자 공급으로 생산을 재개할 수 있습니다."
 ALG_rebuilding_factories: "산업 지구 재건"
 ALG_rebuilding_factories_desc: "여러 산업 지구가 폐허가 되었습니다. 이를 재건하면 일자리가 생기고 복구에 필요한 물자가 생산될 것입니다."
 ALG_export_controls: "수출 통제 및 연방 원조"
 ALG_export_controls_desc: "전략 물자를 보호하고 내부 발전을 보장하기 위해 일시적 수출 제한을 부과하고, 대외 지원으로 균형을 맞출 것입니다."
 ALG_post_war_recovery: "내전 이후 복구"
 ALG_post_war_recovery_desc: "알제리는 1990년대의 잔혹한 내전으로 인한 상처가 아직 남아 있습니다. 평화가 회복되었으나 국가는 여전히 불안정, 활용되지 못하는 공장, 부담을 받는 기반시설, 취약한 정치 체제에 시달리고 있습니다."
 ALG_imf_funding_idea: "IMF 긴급 자금"
 ALG_imf_funding_idea_desc: "국제통화기금이 절실히 필요한 유동성과 예산 지원을 제공하기 위해 나섰습니다. 이 자금은 경제를 안정시키는 데 도움이 되지만 조건이 따릅니다."
 ALG_export_controls_idea: "수출 통제"
 ALG_export_controls_idea_desc: "국내 복구를 우선시하기 위해 정부는 핵심 물자에 수출 제한을 부과했습니다. 이 정책은 내부 시장을 안정시키지만 국제 무역 관계를 해칠 수 있습니다."
 ALG_anti_terror_sweeps: "대테러 작전"
 ALG_anti_terror_sweeps_desc: "보안군은 잔존 극단주의 요소를 제거하기 위해 공세적인 작전을 수행하고 있습니다. 이는 국가 안전을 개선하지만, 시민의 자유를 억압하지 않도록 균형을 맞춰야 합니다."
 ALG_banking_confidence_restored: "은행 부문 신뢰 회복"
 ALG_banking_confidence_restored_desc: "극심한 불신과 침체의 시기를 지나 은행 부문이 어느 정도 안정을 되찾았으며, 시민과 투자자 모두 알제리 금융 체계에 다시 참여할 수 있게 되었습니다."
 ALG_structural_reform: "구조적 경제 개혁"
 ALG_structural_reform_desc: "알제리 경제를 현대화하기 위한 포괄적 개혁이 진행 중입니다. 이러한 변화는 인플레이션을 줄이고, 제도를 간소화하며, 장기적 성장을 촉진하는 것을 목표로 합니다."
 ALG_national_recovery_completed: "국가 복구 완료"
 ALG_national_recovery_completed_desc: "기반시설이 재건되고, 안보가 확보되고, 경제가 부활하면서 알제리는 마침내 가장 어두운 장에서 벗어났습니다. 희망과 진보의 새로운 시대가 시작됩니다."
 ALG_mastering_atom: "원자의 정복"
 ALG_missile_chi_TT: "알제리가 §H원자로§! 기술을 개선합니다."
 CHI_rejected_ALG: " 중국이 제안을 거절함"
 ALG_technological_ties: "기술 유대"
 ALG_continue_1991_program: "1991년 핵 프로그램 지속"
 ALG_continue_1991_program_desc: "우리의 핵 프로그램은 1990년대에 중단되었으나 그 토대는 남아 있습니다. 옛 사업을 되살림으로써 에너지 안보와 더 큰 독립을 모두 추구할 수 있지만, 국제 제재가 뒤따를 가능성이 높습니다."
 ALG_seek_china_help: "중국의 지원 모색"
 ALG_seek_china_help_desc: "중국은 오랫동안 알제리와 핵 기술 분야에서 협력할 의향이 있었습니다. 새로운 협력 관계는 서방의 제한을 우회하는 장비, 전문 지식, 훈련을 제공할 것입니다."
 ALG_1983_deal: "1983년 미사일 협정 부활"
 ALG_1983_deal_desc: "1983년 중국과의 이전 협력은 우리에게 미사일 기술과 제한적인 핵 지원을 제공했습니다. 이 합의를 되살리면 민간 및 군사 핵 야망을 모두 가속화할 수 있습니다."
 ALG_missile_cooperation: "미사일 협력 확대"
 ALG_missile_cooperation_desc: "원자로와 연료 외에도 중국은 핵탄두를 탑재할 수 있는 미사일 체계를 제공할 수 있습니다. 그러나 이 조치는 서방의 심각한 주목을 끌 것입니다."
 ALG_hoggar_nuclear_facility: "호가르 시설 건설"
 ALG_hoggar_nuclear_facility_desc: "호가르 산맥 깊숙한 곳에 외부 간섭으로부터 차단된 안전한 핵 시설을 건설할 수 있습니다. 이는 알제리 핵 프로그램의 중심이 될 것입니다."
 ALG_the_search_for_uranium: "우라늄 탐사"
 ALG_the_search_for_uranium_desc: "우리 과학자들은 알제리의 광대한 사막에 대규모 우라늄 매장량이 숨겨져 있다고 확신합니다. 이 매장지를 찾아 채굴하는 것은 모든 독자적 핵 사업의 근간이 될 것입니다."
 ALG_dig_in_tamanrasset: "타만라세트 굴착"
 ALG_dig_in_tamanrasset_desc: "타만라세트의 사막 평원에는 상당한 우라늄 매장지가 숨어 있습니다. 이곳의 채굴 기반시설에 투자함으로써 알제리는 외국 공급자에 대한 의존에서 벗어날 수 있습니다."
 ALG_withdrawal_from_npt: "NPT 탈퇴"
 ALG_withdrawal_from_npt_desc: "알제리는 더 이상 주권이 외국 조약에 구속되도록 놔둘 수 없습니다. 핵확산금지조약을 탈퇴함으로써 우리는 핵무기를 공공연히 추구하겠다는 의지를 선언합니다."
 ALG_wmds: "대량살상무기"
 ALG_wmds_desc: "농축 시설이 완공되고 미사일이 준비된 지금, 알제리의 핵 억지력을 완성할 때가 되었습니다. 세계가 주목할 것이며, 우리의 적들은 우리를 위협하기 전에 두 번 생각하게 될 것입니다."
 ALG_algiers_agreement: "알제 협정"
 ALG_algiers_agreement_desc: "핵무장을 추구하는 대신 알제리는 스스로를 평화의 수호자로 내세울 수 있습니다. 알제 협정은 절제의 서약으로서 외국 투자와 국제적 정통성의 문을 열어 줄 것입니다."
 ALG_sign_BWC: "생물무기금지협약 서명"
 ALG_sign_BWC_desc: "대량살상무기에 반대하는 국제 협정에 가입함으로써 우리는 평화에 대한 알제리의 의지를 보여 줍니다. 이는 외국 투자자를 안심시키고 우리의 핵 활동에 대한 의심을 줄일 것입니다."
 ALG_build_nuclear_reactor: "원자로 건설"
 ALG_build_nuclear_reactor_desc: "우리의 핵 프로그램은 다음 단계로 나아갈 준비가 되었습니다. 본격적인 원자로를 건설함으로써 알제리는 강력한 에너지원과 추가 농축 활동을 위한 위장막을 모두 얻게 됩니다. 세계는 평화적 의도로 볼 수 있겠지만, 현실은 훨씬 복잡할 수 있습니다."
 ALG_IAEA_safeguards_leave: "IAEA 안전조치 완료"
 ALG_IAEA_safeguards_leave_desc: "수년간의 감독과 준수 끝에 알제리는 알제 협정과 생물무기금지협약에 따른 의무를 완전히 이행했습니다. 마지막 IAEA 사찰단이 우리 영토를 떠나면서 제재가 해제되고 우리나라는 책임 있는 지역 강국으로 인정받습니다."
 sanctioned_algeria: "제재"
 ALG_hoggar_nuclear_facility_idea: "호가르 핵 시설"
 ALG_algeria_behave_TT: "[USA.GetFlag] §H미국§!이 경제 제재를 §G해제§!할 가능성이 높습니다."
 nuclear_algeria.1.t: "잠재적 공급자?"
 nuclear_algeria.1.d: "핵 기술을 확보하려는 우리의 시도에서, 우리는 적절한 무기나 시설을 생산하는 데 필요한 정교함의 수준에 단순히 미치지 못한다는 사실을 받아들여야 합니다. 따라서 세계로 눈을 돌려 누가 기꺼이 도와줄지 살펴야 하며, 정보원들은 우리가 한 특정 국가에 도움을 요청할 수 있다고 알려 주고 있습니다."
 nuclear_algeria.1.a: "중국에 접촉한다"
 nuclear_algeria.2.t: "알제리의 지원 요청"
 nuclear_algeria.2.d: "알제리 과학자와 외교관들이 최근 우리 측 인사들과 만나 핵 프로그램에 대한 지원을 요청했습니다. 그들은 핵 프로그램 개발에 도움이 되기만 한다면 우리가 제공하는 무엇이든 기꺼이 받아들일 것이라고 밝혔습니다."
 nuclear_algeria.2.a: "알겠다"
 nuclear_algeria.2.b: "우리의 비밀을 공유할 수는 없다"
 nuclear_algeria.3.t: "중국의 미사일 기술 공유"
 nuclear_algeria.3.d: "중국 과학자들이 최근 [ALG.capital.GetCapitalVictoryPointName]에서 우리 측 인사들과 만나, 우리가 현재 보유하지 못한 첨단 ICBM 미사일의 설계도를 제공했습니다."
 nuclear_algeria.3.a: "훌륭하군!"
 nuclear_algeria.4.t: "중국의 핵 기술 제공"
 nuclear_algeria.4.d: "중국 과학자들이 최근 [ALG.capital.GetCapitalVictoryPointName]에서 우리 측 인사들과 만나, 우리가 현재 보유하지 못한 첨단 원자로의 설계도를 제공했습니다."
 nuclear_algeria.4.a: "훌륭하군!"
 nuclear_algeria.5.t: "[FROM.GetName]의 지원 제공 거부!"
 nuclear_algeria.5.d: "우리는 핵 프로그램 지원을 위해 [FROM.GetName]에 접촉한 것이 큰 오판이었습니다. 그들은 우리의 요청을 거부했으며, 우리의 요청을 국제 법원에 제기하여 잠재적으로 우리의 비밀을 폭로하겠다고 위협했습니다."
 nuclear_algeria.5.a: "놓친 기회다."
 nuclear_algeria.6.t: "알제리의 미사일 구매 희망"
 nuclear_algeria.6.d: "알제리 정부가 우리에게 일련의 탄도 미사일 판매를 요청했습니다. 알제리 정부는 이 미사일을 국경 방어에 사용할 것이며 어떤 형태의 공세 전쟁에도 사용하지 않을 것이라고 선언했습니다."
 nuclear_algeria.6.a: "좋다, 판매를 확정하라"
 nuclear_algeria.6.b: "아니요"
 nuclear_algeria.7.t: "중국의 미사일 판매"
 nuclear_algeria.7.d: "중국이 우리에게 약 400기의 탄도 미사일을 판매했습니다. 일부는 구형일 수 있으나 여전히 작동하며, 그것이 중요한 전부입니다."
 nuclear_algeria.7.a: "훌륭하군"
 nuclear_algeria.8.t: "중국의 미사일 판매 거부"
 nuclear_algeria.8.d: "중국 정부는 자국의 군사 작전에 미사일이 필요하다는 이유를 들어 미사일 구매 요청을 거절했습니다."
 nuclear_algeria.8.a: "알겠다"
 nuclear_algeria.19.t: "국제 제재"
 nuclear_algeria.19.d: "세계가 우리에게 등을 돌리기로 결정한 듯하며, 우리 경제에 제재를 가해 필연적으로 경제를 멈춰 세울 것입니다. 우리의 정책을 재검토해야 합니다."
 nuclear_algeria.19.a: "배신자들의 세계에 무엇을 기대했겠는가?"
 nuclear_algeria.25.t: "미국, 경제적 압박 강화"
 nuclear_algeria.25.d: "미국은 우리 국민에 대한 경제 제재를 강화함으로써 제국주의적 구상을 실행하기로 결정했습니다."
 nuclear_algeria.25.a: "우리는 저항할 것이다!"
 nuclear_algeria.26.t: "미국, 경제적 압박 완화"
 nuclear_algeria.26.d: "미국은 우리 국민에게 부과한 제재의 규모를 줄이기로 결정했습니다. 이러한 입장을 유지할지는 지켜봐야 할 일입니다."
 nuclear_algeria.26.a: "좋다"
 nuclear_algeria.28.t: "알제리의 노선 순응"
 nuclear_algeria.28.d: "알제리의 전형적인 정책에서 완전히 180도 선회하여, 보다 평화적이고 통제된 방향으로 나아가는 것으로 보입니다."
 nuclear_algeria.28.a: "좋다, 이제 제재를 완화할 수도 있겠군"
 algerian_focus.171.t: "에스살람 원자력 발전소"
 algerian_focus.171.d: "미국이 미완성으로 남겨 둔 에스살람 원자력 발전소는 지어진 부분만 수십 년째 방치되어 왔습니다. 중국 과학자 여러 명이 도착하면서, 한 중국 기업이 발전소의 남은 부분을 완공하겠다는 제안을 해 왔습니다."
 algerian_focus.171.a: "제안을 수락한다"
 algerian_focus.171.b: "사양한다"
 ALG_sanctioned: "제재받음"
 ALG_nuclear_known: "핵 프로그램 노출"
 ALG_emergency_budget: "긴급 예산"
 support_brics: "BRICS 지원"
 algeria_msp: "MSP 중점"
 algeria_democratic: "RND 중점"
 algeria_nationalist: "인민국가군 중점"
 monitor_kabyle_unrest: "[KBY.GetFlag] 카빌 소요 감시"
 ALG_us_sanctions: "미국의 제재"
 ALG_us_sanctions_desc: "미국은 우리가 외부 세계와 교류하는 능력을 제한하는 여러 제재를 부과했습니다. 치명적이지는 않지만 어느 정도 우리의 경제적 성공을 방해합니다.\n§W--------------§!\n미국은 우리의 행동에 따라 우리 정부에 대한 제재를 강화하거나 완화할 수 있는 능력을 보유합니다.\n§W--------------§!\n미국이 우리가 더 이상 핵무기를 추구하지 않는다고 판단하면 이 국가 정신은 §R제거§!됩니다."
 ALG_imf_loan_taken: "IMF 대출 수령"
 ALG_repression_modifier: "탄압"
 ALG_surveillance_state_modifier: "감시 국가"
 ALG_national_dialogue_modifier: "국민 대화"
 ALG_boteflika: "알제리 대통령 건강 위기"
 idea_alg_empowered_parliament: "강화된 의회"
 algeria_sahar.1.t: "알제리의 도움"
 algeria_sahar.1.d: "우리는 알제리로부터 제안을 받았습니다. 알제리는 UAR 수립 과정에 참여하는 대가로 우리에게 군사 지원을 제공하고 적대 행위의 재개에 대비하도록 도울 의향이 있습니다. 알제리의 지원을 받아들여야 합니까?"
 algeria_sahar.1.a: "받아들여야 한다!"
 algeria_sahar.1.b: "그들의 꼭두각시가 될 수는 없다!"
 algeria_sahar.2.t: "평화 협정"
 algeria_sahar.2.d: "우리는 반군을 억제하지 못했고, 그들이 서사하라 전역을 장악했습니다. 반군에게 평화 조약을 제안하고 영토를 넘겨야 합니까?"
 algeria_sahar.2.a: "제안을 보낸다"
 algeria_sahar.2.b: "그들을 짓밟아야 한다!"
 algeria_sahar.3.t: "모로코의 제안"
 algeria_sahar.3.d: "모로코가 우리에게 평화 조약 제안을 보냈습니다. 이 성명은 완전한 항복 행위로 간주할 수 있습니다! 우리는 항복을 받아들일 수도 있고, 북마그레브 민족들을 해방시키기 위해 넓은 전선에서 진군할 수도 있습니다!"
 algeria_sahar.3.a: "우리가 이겼다!"
 algeria_sahar.3.b: "인민 연방을 향해 전진!"
 algeria_sahar.4.t: "전쟁의 승리"
 algeria_sahar.4.d: "우리 군이 승리했습니다. 서사하라 분쟁은 끝났으며, 우리는 지역의 정치 질서를 원하는 대로 재편할 수 있습니다."
 algeria_sahar.4.a: "사하라 연방을 수립한다."
 algeria_sahar.5.t: "마침내 평화."
 algeria_sahar.5.d: "우리는 사흐라위와 평화 조약을 체결했으며 전쟁은 끝났습니다."
 algeria_sahar.5.a: "우리의 가장 어두운 시기."
 algeria_sahar.6.t: "그들의 거절!"
 algeria_sahar.6.d: "사흐라위가 우리의 평화 조약을 거절했습니다! 전쟁은 계속됩니다!"
 algeria_sahar.6.a: "알겠다."
 algeria_sahar.7.t: "사흐라위의 수락!"
 algeria_sahar.7.d: "사흐라위가 우리의 제안을 수락했습니다."
 algeria_sahar.7.a: "UAR을 향해 전진!"
 algeria_sahar.8.t: "그들의 거절!"
 algeria_sahar.8.d: "사흐라위가 우리의 제안을 거절했습니다."
 algeria_sahar.8.a: "유감이다."
 TT_ALG_DEAL_WITH_TRADE_UNIONS: "노동조합이 내부 파벌로 존재하게 되면 노동조합 관계를 높일 것입니다."
 ALG_oil_price_collapse: "유가 폭락"
 ALG_oil_price_collapse_desc: "세계 유가의 급락이 알제리의 국가 수입에 심각한 타격을 주었습니다. 탄화수소가 여전히 국가 경제의 근간인 만큼, 이 붕괴는 예산 안정, 외환 보유고, 사회 지출을 위협합니다.\n\n§R- 국고 수입 급감§!"
 alg_hirak_victory_option: "히라크 운동의 승리"
 alg_hirak_victory_option_desc: "수년간의 시위, 동원, 풀뿌리 저항 끝에 히라크 운동이 마침내 승리했습니다. 민주적 개혁이 이제 진행 중이지만 국가는 여전히 취약하며 전환은 불확실합니다.\n\n§G+ 개혁파 정통성§!\n§Y- 딥스테이트 영향력§!"
 alg_hirak_reforms_title: "히라크 주도의 개혁"
 alg_hirak_reforms_desc: "거리로부터의 막대한 압력에 직면한 정부는 상징적인 개혁을 시행할 수밖에 없습니다."
 alg_hirak_reforms_option: "정치 개혁을 발표한다"
 alg_hirak_gains_influence_tt: "§Y히라크§!가 정치적 균형에서 더 큰 영향력을 얻습니다."
 alg_hirak_crackdown_title: "히라크 시위 탄압"
 alg_hirak_crackdown_desc: "정권은 개혁 대신 탄압을 택하여 시위대에게 보안군을 풀었습니다."
 alg_hirak_crackdown_option: "질서를 회복하기 위해 무력을 사용한다"
 alg_pouvoir_crackdown_tt: "§Y르 푸부아르§!가 안정을 희생하여 권력을 공고히 합니다."
 alg_health_crisis_title: "대통령 건강 위기"
 alg_health_crisis_desc: "부테플리카 대통령이 심각한 건강 이상을 겪어, 고령의 지도부와 알제리 정치의 투명성 부족에 대한 우려가 다시 불붙었습니다. 측근들은 그가 계속 통치할 것이라고 주장하지만, 국민과 엘리트층의 많은 이들이 그의 지속적인 통치의 정통성에 의문을 제기하기 시작합니다."
 alg_health_crisis_option_continue: "부테플리카의 지도력 재확인"
 alg_le_pouvoir_strengthens_tt: "대통령의 측근 집단이 그를 대중의 감시로부터 보호하는 동안 §Y르 푸부아르§!가 더 많은 권력을 공고히 합니다."
 maghreb_union_member: "§Y마그레브 연합 결성 제안을 수락했습니다§!"
 has_power_balance_algeria: "알제리 2014년 선거 완료"
 supports_brics: "BRICS 지원"
 ALG_eu_trade_agreements_desc: "EU와 무역 협정을 체결하여 서방과의 유대를 강화하고 경제를 발전시킵니다."
 ALG_join_nato_partnership_desc: "NATO 파트너십에 가입하여 아프리카 지역을 지배하고 알제리를 선진국으로 만듭니다."
 ALG_al_quwwat_al_jawwiya_al_jazaeriya: "알제리 공군"
 ALG_al_quwwat_al_jawwiya_al_jazaeriya_desc: "알제리 공군은 독립 이래로 우리 군사력의 기둥 중 하나였습니다. 현대화와 도입을 통해 항공 역량을 강화하면 북아프리카 하늘에서의 우위를 보장할 것입니다."
 ALG_al_jaysh_al_watani_al_shaabi: "인민국가군"
 ALG_al_jaysh_al_watani_al_shaabi_desc: "인민국가군은 알제리 방위의 근간입니다. 지상군을 개혁하고 무장시키면 우리 영토를 지키고 위협 속에서도 안정을 유지할 수 있습니다."
 ALG_al_quwwat_al_bahriya_al_jazaeriya: "알제리 해군"
 ALG_al_quwwat_al_bahriya_al_jazaeriya_desc: "알제리 해군은 지중해 해안과 해양 이익을 지킵니다. 함대와 기반시설을 확충하면 알제리는 힘을 투사하고 핵심 해상 교통로를 보호할 수 있습니다."
 ALG_al_quwwat_al_musallaha_al_jazaeriya: "알제리 군대"
 ALG_al_quwwat_al_musallaha_al_jazaeriya_desc: "알제리 군대는 우리 육군, 공군, 해군의 결합된 힘을 대표합니다. 국가 주권의 보증인으로서 새로운 세기의 도전에 대응하도록 재편되고 현대화되어야 합니다."
 ALG_expand_the_EFCIP: "EFCIP 확장"
 ALG_expand_the_EFCIP_desc: "보가르의 특공대 훈련 및 낙하산 입문 학교(EFCIP)는 1963년 이래 알제리 특수부대 훈련의 초석이었습니다. 시설을 확장하고 기반시설을 현대화하며 고급 전투 과정을 도입함으로써 특공대원과 공수부대원의 역량을 더욱 높일 것입니다. 이 투자는 알제리가 북아프리카에서 가장 강력한 특수부대 중 하나를 유지하도록 보장할 것입니다."
 ALG_expand_conscription: "징병 확대"
 ALG_expand_conscription_desc: "징병을 확대하면 훈련된 병사의 풀이 늘어납니다. 이는 국가를 방어하고 위협에 대응하기에 충분한 인력을 보장합니다."
 ALG_expand_military_infrastructure: "군 기반시설 확장"
 ALG_expand_military_infrastructure_desc: "새로운 기지, 훈련 센터, 군수 거점을 건설하면 군사 역량이 강화됩니다. 기반시설 개선은 작전 효율을 뒷받침합니다."
 ALG_focus_on_military_morale: "군 사기 중시"
 ALG_focus_on_military_morale_desc: "높은 사기는 전투 효율에 매우 중요합니다. 병사 복지, 리더십, 단결심에 투자하면 투지가 고양됩니다."
 ALG_expand_artillery_units: "포병 부대 확대"
 ALG_expand_artillery_units_desc: "포병은 전장에서 핵심적인 화력을 제공합니다. 포병 부대를 늘리면 육군의 공격 및 방어 역량이 향상됩니다."
 ALG_an_army_of_the_masses: "대중의 군대"
 ALG_an_army_of_the_masses_desc: "대규모로 잘 훈련된 군대는 침략을 억제하고 주권을 보호할 수 있습니다. 대중 군대를 구축하려면 훈련과 자원에 대한 헌신이 필요합니다."
 ALG_expand_the_escuela_de_condores: "콘도르 학교 확장"
 ALG_expand_the_escuela_de_condores_desc: "콘도르 학교는 알제리의 정예 병사를 훈련시킵니다. 이를 확장하면 복잡한 안보 도전에 대응할 더 많은 특수부대를 양성할 수 있습니다."
 ALG_form_specops_brigades: "특수부대 여단 창설"
 ALG_form_specops_brigades_desc: "특수부대 여단은 고도의 기술이 필요한 고위험 임무를 수행합니다. 이러한 부대를 창설하면 알제리의 전술적 유연성이 향상됩니다."
 ALG_military_mechanization: "군 기계화"
 ALG_military_mechanization_desc: "보병을 기계화하면 기동성과 화력이 향상됩니다. 이러한 전환은 육군을 현대화하고 전장 효율을 높입니다."
 ALG_abolish_conscription: "징병 폐지"
 ALG_abolish_conscription_desc: "징병을 종료하면 군이 전문 지원병 체제로 전환됩니다. 이는 질을 향상시킬 수 있으나 인력 확보 가능성이 줄어듭니다."
 ALG_quality_over_quantity: "양보다 질"
 ALG_quality_over_quantity_desc: "더 작지만 더 잘 무장한 병력에 집중하면 전투 효율이 향상됩니다. 단순한 숫자보다 훈련과 현대적 장비가 우선시됩니다."
 ALG_a_cost_effective_army: "비용 효율적인 군대"
 ALG_a_cost_effective_army_desc: "군을 군더더기 없이 효율적으로 유지하면 재정적 책임이 보장됩니다. 현명한 예산 편성으로 국방 수요와 경제 현실의 균형을 맞출 수 있습니다."
 ALG_modernizing_our_equipment: "장비 현대화"
 ALG_modernizing_our_equipment_desc: "무기와 장비를 개선하면 우리 군이 경쟁력을 유지합니다. 현대적 장비는 생존성과 전투력을 높입니다."
 ALG_develop_algerian_military_industry: "알제리 군수 산업 육성"
 ALG_develop_algerian_military_industry_desc: "국내 무기 산업을 설립하면 수입 의존도가 줄어듭니다. 이는 주권을 강화하고 일자리를 창출합니다."
 ALG_cooperate_with_foreign_arms_companies: "외국 방위산업체와 협력"
 ALG_cooperate_with_foreign_arms_companies_desc: "국제 방위산업체와의 제휴는 기술 이전을 가속화합니다. 이러한 협력은 우리의 군사 역량을 향상시킵니다."
 ALG_tackle_military_corruption: "군 부패 척결"
 ALG_tackle_military_corruption_desc: "부패는 군의 효율성과 사기를 해칩니다. 강력한 개혁과 감독이 신뢰와 규율을 회복시킵니다."
 ALG_elite_officer_training: "정예 장교 훈련"
 ALG_elite_officer_training_desc: "고도로 숙련된 장교는 전장에서의 성공의 열쇠입니다. 전문 훈련 프로그램은 리더십과 전략적 전문성을 키웁니다."
 ALG_an_army_for_the_future: "미래를 위한 군대"
 ALG_an_army_for_the_future_desc: "미래의 위협과 기술에 맞서도록 군을 준비시켜야 합니다. 혁신과 적응력이 이 비전의 핵심입니다."
 ALG_purchase_american_aircraft: "미국 항공기 구매"
 ALG_purchase_american_aircraft_desc: "미국으로부터 항공기를 도입하면 첨단 기술과 검증된 신뢰성을 얻습니다. 이는 우리의 항공 역량을 강화합니다."
 ALG_purchase_chinese_aircraft: "중국 항공기 구매"
 ALG_purchase_chinese_aircraft_desc: "중국 항공기는 비용 효율적인 선택지와 점점 정교해지는 기술을 제공합니다. 공급처를 다변화하면 전략적 동반자 관계가 확대됩니다."
 ALG_purchase_russian_aircraft: "러시아 항공기 구매"
 ALG_purchase_russian_aircraft_desc: "러시아 항공기는 견고한 설계와 강력한 성능을 갖추고 있습니다. 협력은 우리 공군의 다재다능함을 향상시킵니다."
 ALG_improve_air_defense_infrastructure: "대공 방어 기반시설 개선"
 ALG_improve_air_defense_infrastructure_desc: "대공 방어 체계를 강화하면 핵심 자산과 인구 밀집 지역을 보호합니다. 개선은 공중 위협에 대한 취약성을 줄입니다."
 ALG_close_air_support: "근접 항공 지원"
 ALG_close_air_support_desc: "근접 항공 지원은 전투 중 지상군의 효율성을 높입니다. 공중과 지상 작전의 통합은 전장에서의 성공에 필수적입니다."
 ALG_a_new_world_class_academy: "새로운 세계적 수준의 사관학교"
 ALG_a_new_world_class_academy_desc: "세계적 수준의 군사 학교를 설립하면 미래의 지도자를 양성할 수 있습니다. 이 기관은 우수성의 기준을 세울 것입니다."
 ALG_dominate_the_skies: "하늘 제패"
 ALG_dominate_the_skies_desc: "제공권 확보는 현대전에서 필수적입니다. 우리 영공을 통제하고 모든 군사 작전을 지원하기 위해 투자할 것입니다."
 ALG_might_of_the_sky: "하늘의 위력"
 ALG_might_of_the_sky_desc: "우리의 공군력은 국력과 기술 진보를 상징합니다. 강력한 공군을 유지하면 침략을 억제합니다."
 ALG_naval_military_police: "해군 헌병대"
 ALG_naval_military_police_desc: "해군 헌병대는 함선과 기지 내의 규율과 보안을 유지합니다. 이들은 질서와 효율적인 작전을 보장합니다."
 ALG_expand_the_naval_academy: "해군사관학교 확장"
 ALG_expand_the_naval_academy_desc: "해군사관학교를 확장하면 더 많은 장교와 수병을 훈련시킵니다. 이 투자는 전문적이고 유능한 해상 병력을 키웁니다."
 ALG_return_to_the_sea: "바다로의 복귀"
 ALG_return_to_the_sea_desc: "태평양에 대한 접근권을 되찾는 것은 알제리의 역사적 목표입니다. 해군 주둔을 발전시키는 것은 이 야망에 매우 중요합니다."
 ALG_algerian_marine_forces: "알제리 해병대"
 ALG_algerian_marine_forces_desc: "해병대는 신속 대응 역량과 상륙전 전문성을 제공합니다. 이들의 확대는 알제리의 작전 범위를 넓힙니다."
 ALG_quick_strikes: "신속 타격"
 ALG_quick_strikes_desc: "신속하고 결정적인 타격은 적을 압도할 수 있습니다. 이러한 병력을 발전시키면 전술적 유연성이 높아집니다."
 ALG_invest_into_shipbuilding: "조선업 투자"
 ALG_invest_into_shipbuilding_desc: "국내 조선 산업을 구축하면 해군 확장과 경제 성장을 뒷받침합니다. 이 부문은 장기적 방위에 전략적입니다."
 ALG_djebel_chenoua: "제벨 셰누아"
 ALG_djebel_chenoua_desc: "강력한 함대를 건설하면 힘을 투사하고 국익을 보호합니다. 제벨 셰누아는 해양 주권의 상징입니다."
 ALG_masters_of_the_mediterranean: "지중해의 지배자"
 ALG_masters_of_the_mediterranean_desc: "지중해 해역을 장악하면 무역 항로와 전략적 이점을 확보합니다. 알제리는 이 지역의 핵심 주체가 되고자 해야 합니다."
 ALG_focus_on_mass_assault_tactics: "대규모 돌격 전술 중시"
 ALG_focus_on_mass_assault_tactics_desc: "대규모 돌격 전술은 대규모 병력 집중으로 적군을 압도하는 것을 강조합니다. 이 전략은 인력과 협조에 의존해 승리를 거둡니다."
 ALG_licence_mir: "미라주 면허 구매"
 ALG_licence_mir_desc: "우리는 프랑스 항공기를 생산할 모든 수단을 갖추고 있으므로, 생산 면허를 요청해야 합니다."
 ALG_purchase_russian_su30: "러시아 SU-30 구매"
 ALG_purchase_russian_su30_desc: "지역 강국으로서 광대한 국경을 지키고 마그레브와 사헬 전역에 영향력을 투사하는 것이 가장 중요합니다. 우리 군 최고 사령부는 러시아의 전설적인 Su-30을 제공권을 크게 강화할 이상적인 플랫폼으로 지목했습니다. 이 도입은 우리 함대의 전력을 높이고 군수를 표준화할 뿐 아니라 즉각적이고 결정적인 이점을 제공하겠지만, 틀림없이 국제적으로 상당한 주목을 받을 것입니다."
 alg_politics.50.t: "스마인 라마리 장군의 사망"
 alg_politics.50.d: "DRS의 악명 높은 방첩 부서를 이끌던 스마인 라마리 장군이 사망했습니다. 그의 갑작스러운 죽음은 경쟁자들이 그의 영향력을 차지하기 위해 움직이면서 알제리 딥스테이트에 권력 공백을 남겼습니다."
 alg_politics.50.a: "구체제의 그림자가 사라진다."
 ALG_black_decade_threat: "암흑의 10년 수법의 부활"
 ALG_2001_title: "파티마 부다우아니의 진급"
 ALG_2001_desc: "부테플리카 대통령의 개혁적 쇄신의 일환으로 파티마 부다우아니가 알제리 최초의 여성 장군이 됩니다. 그녀의 진급은 군 내 여성에게 새로운 시대를 열었음을 알리며, 사기를 높이고 현대화의 신호를 보냅니다."
 ALG_2001_a: "군을 위한 역사적인 발걸음이다."
 ALG_2002_title: "파티마 조라 아르주네의 진급"
 ALG_2002_desc: "파티마 부다우아니의 선구적인 부상에 이어 파티마 조라 아르주네가 장군 계급으로 진급했습니다. 알제리 군의관단 최초의 여성 장군으로서 그녀의 임명은 군 내 성 포용을 향한 알제리의 조심스러운 걸음을 반영합니다."
 ALG_2002_a: "또 하나의 장벽이 무너졌다."
 alg_reform.1.t: "진정한 개혁의 기회"
 alg_reform.1.d: "'국민에 의한, 국민을 위한' 구상 이후, 알제리는 진정한 개혁에 헌신하는 지도자를 선택할 드문 기회를 맞았습니다. 세 명의 후보가 나섰으며, 각각 국가를 안정시키고 현대화하는 서로 다른 길을 약속합니다. 이제 선택은 국민에게 달려 있습니다."
 alg_reform.1.a: "아흐메드 벤비투르 - 테크노크라트 개혁가"
 alg_benbitour_desc: "아흐메드 벤비투르는 행정 효율성과 경제 현대화에 집중하는 테크노크라트입니다. 그의 안정적인 접근 방식은 장기적 안정을 구축하고 국가 기관을 개혁하는 것을 목표로 합니다."
 alg_reform.1.b: "수피안 질랄리 - 카리스마 있는 개혁가"
 alg_djilali_desc: "수피안 질랄리는 사회적, 정치적 개혁을 강조하는 개혁파 야권 지도자입니다. 카리스마 있고 단호한 그는 민주적 제도와 대중 참여를 강화하고자 합니다."
 alg_reform.1.c: "라시드 네카즈 - 포퓰리스트 활동가"
 alg_nekkaz_desc: "라시드 네카즈는 국민에게 직접 호소하는 포퓰리스트 활동가입니다. 그의 인기는 높지만, 대립적인 스타일은 민감한 정치 환경에서 불안정을 초래할 수 있습니다."
 ALG_citizens_constitution: "시민의 헌법"
 ALG_justice_for_the_people: "국민을 위한 정의"
 ALG_free_press_free_people: "자유 언론, 자유 국민"
 ALG_economic_transparency: "경제 투명성"
 ALG_citizens_constitution_desc: "기본권을 보장하고 민주적 제도를 강화하는 새 헌법을 기초합니다."
 ALG_justice_for_the_people_desc: "사법부를 개혁하여 독립적이고 공정하며 정치적 간섭으로부터 보호받도록 합니다."
 ALG_free_press_free_people_desc: "언론의 자유를 보장하여 언론이 권력에 책임을 묻고 시민에게 정보를 전달할 수 있게 합니다."
 ALG_economic_transparency_desc: "부패에 맞서고 대중의 신뢰를 높이기 위해 투명한 예산 편성과 재정 정책을 시행합니다."
 ALG_true_reformist_path_tt: "이 길은 알제리가 진정한 개혁 지도자를 선택하고, 민주주의 인기도와 안정도를 높이며, 국민을 위한 정치 및 경제 개혁을 개시할 수 있게 합니다."
 algeria_news.3_tt: "부테플리카의 평화 프로그램이 알제리에 희망을 주어 안정도와 민주주의 지지를 향상시킵니다."
 algeria_news.7_tt: "'르 푸부아르'에 대한 저항이 대중의 지지를 얻어 민주주의 영향력과 정치력을 높입니다."
 algeria_news.1_tt: "군이 비상 조치 후 통제권을 확립합니다. 안정도는 소폭 하락하지만 전쟁 지지도와 정치력은 증가합니다."
 algeria_news.4_tt: "부테플리카의 화해 노력이 국가 안정도와 민주주의 지지를 높입니다."
 algeria_news.8.t: "암흑의 10년의 희생자들"
 algeria_news.8.d: "1990년대 내전은 실종자, 미망인, 고아, 그리고 고문과 공포를 겪은 이들을 포함하여 수십만 명의 희생자를 남겼습니다. 알제리가 화해를 모색하는 가운데, 국가가 정의와 인정에 대한 요구에 어떻게 응답해야 하는가 하는 문제가 제기됩니다."
 algeria_news.8.a: "유족과 피해자에게 보상한다"
 algeria_news.8.b: "상징적 인정만 제공한다"
 algeria_news.8.c: "과거에 매달릴 수는 없다"
 algeria_news.8_a_tt: "§Y비용이 많이 드는 보상 프로그램§!은 안정도를 높이고 알제리의 정통성을 강화하지만 국고에 부담을 줍니다."
 algeria_news.8_b_tt: "§Y상징적 인정§!은 막대한 정치적 비용을 치르고 안정도를 높이지만 일부 요구는 충족되지 않은 채 남습니다."
 algeria_news.8_c_tt: "§Y피해자의 요구를 무시하면§! 당장 자원은 절약되지만 안정도가 하락하고 불만이 커집니다."
 algeria_news.10.t: "회복으로 가는 길"
 algeria_news.10.d: "내전이 끝나가면서 알제리는 산산조각 난 경제를 재건해야 하는 막중한 과제에 직면했습니다. 공장은 가동을 멈추었고, 기반시설은 손상되었으며, 실업은 위험할 정도로 높습니다. 그러나 수년 만에 처음으로 재건과 개혁이 번영과 안정을 회복시킬 수 있다는 희망이 생겼습니다."
 algeria_news.10.a: "회복이 시작된다!"
 algeria_news.10_a_tt: "§Y알제리 경제를 되살리기 위한 첫걸음이 내디뎌졌습니다.§! 이는 기반시설, 산업, 금융의 더 깊은 개혁으로 가는 길을 엽니다."
 algeria_news.11.t: "국제연합 원조 사절단"
 algeria_news.11.d: "국제연합 대표단이 경제 원조와 재건 지원을 제안하며 알제에 도착했습니다. 그들의 프로그램은 귀중한 자금, 전문 지식, 인도적 구호를 가져올 수 있으나, 정부 내 다수는 이러한 원조를 받아들이는 것이 알제리 내정에 대한 외세의 간섭을 초래할 수 있다고 경고합니다."
 algeria_news.11.a: "UN 사절단을 받아들인다"
 algeria_news.11_a_tt: "§G국제 원조 자금과 기술 지원을 받게 됩니다.§! \n§R그러나 이는 알제리 내 미국, 프랑스, 영국의 영향력을 증가시킵니다.§!"
 algeria_news.11.b: "외세의 간섭을 거부한다"
 algeria_news.11_b_tt: "§R우리는 UN의 감독을 거부하고 스스로 회복할 것입니다.§! \n§Y이는 우리의 주권을 보존하지만 경제 성장을 둔화시킵니다.§!"
 algeria_news.20.t: "알제리 외교 정책 검토"
 algeria_news.20.d: "내전이 끝나고 알제리의 취약한 회복이 진행되면서, 알제의 지도부는 국가 외교 정책에 대한 포괄적 검토에 착수했습니다. 향후 몇 년 동안 내려지는 선택이 옛 동맹과의 유대를 강화할지, 새로운 동반자 관계를 모색할지, 아니면 점점 양극화되는 세계에서 독립을 유지할지를 결정할 것입니다. 논쟁이 시작되었고, 알제리는 곧 자신의 진로를 선택해야 할 것입니다."
 algeria_news.20.a: "알제리의 미래가 기다린다."
 algeria_news.20_tt: "§Y이는 알제리 외교 정책 분기의 시작을 의미합니다.§!"
 ALG_between_east_and_west_tt: "알제리는 비동맹 외교 정책을 주장하는 동시에 동서 간의 관계 균형을 추구합니다."
 ALG_mediate_great_power_conflict_tt: "알제리는 세계 강대국 사이를 적극적으로 중재하며 중립적 평화 중재자로서의 명성을 쌓습니다."
 ALG_secure_balance_tt: "알제리는 비동맹 입장을 강화하며 주요 세계 강대국 사이에서 안정적인 균형을 확보합니다."
 alg_news_non_aligned.1.t: "동서 사이의 균형"
 alg_news_non_aligned.1.d: "알제리는 동양 및 서양과 모두 외교적으로 교류하면서 독립을 유지하고자 주요 세계 강대국 사이에서 신중한 항로를 그리기 시작했습니다."
 alg_news_non_aligned.1.a: "알제리, 균형을 추구하다"
 alg_news_non_aligned.2.t: "세계 긴장 중재"
 alg_news_non_aligned.2.d: "알제리는 중립적 평화 중재자로서 국제적 위상을 높이는 것을 목표로 주요 강대국 간 긴장을 중재하고자 나섰습니다."
 alg_news_non_aligned.2.a: "중재 진행 중"
 alg_news_non_aligned.3.t: "지역 화해 촉진"
 alg_news_non_aligned.3.d: "알제리는 지역 강대국 사이의 차이를 조정하고 안정과 협력적 동반자 관계를 모색하기 위한 일련의 외교 구상을 개시했습니다."
 alg_news_non_aligned.3.a: "화해 노력"
 alg_news_non_aligned.4.t: "비동맹 균형 확보"
 alg_news_non_aligned.4.d: "알제리는 어느 블록에도 완전히 속하지 않으면서 주요 강대국들과 신중하게 관계를 유지하며 비동맹 입장을 확고히 했습니다."
 alg_news_non_aligned.4.a: "균형이 확보되었다"
 alg_news_non_aligned.5.t: "비동맹 운동의 부활"
 alg_news_non_aligned.5.d: "알제리는 비동맹 운동에서의 참여를 활성화하기 위한 조치를 취했으며, 중립국들 사이에서 자국의 지도력과 외교적 영향력을 재확인했습니다."
 alg_news_non_aligned.5.a: "NAM 영향력 회복"
 alg_news_non_aligned.6.t: "개발도상국 지원"
 alg_news_non_aligned.6.d: "알제리는 개발도상국에 대한 광범위한 외교적, 경제적 접촉을 시작하여 안정과 협력을 촉진하는 동시에 대륙에서의 영향력을 높이고 있습니다."
 alg_news_non_aligned.6.a: "접촉이 시작되었다"
 algeria_news.9.t: "암흑의 10년의 유산"
 algeria_news.9.d: "내전은 알제리에 깊은 상처를 남겼습니다. 정부는 과거를 어떻게 규정하고, 책임을 어디에 돌리며, 국가의 미래를 어떻게 이끌지 결정해야 합니다."
 algeria_news.9.a: "군사 정권을 지지한다"
 algeria_news.9.b: "피해자와 빈민의 편에 선다"
 algeria_news.9.c: "외부 세력을 탓한다"
 algeria_news.9.dd: "공식적으로 지우고 논의를 억압한다"
 ALG_promote_reconciliation_tt: "§G화해 증진:§!\n• 이웃 국가와의 관계 개선\n• 지역 긴장 완화\n• 외교 채널 개방"
 alg_mufti.2.t: "이슬람 국가의 길은 어느 쪽인가?"
 alg_mufti.2.d: "이슬람이 국가의 지도 원칙으로 선포된 지금, 우리는 어느 흐름이 우리의 길을 규정할지 결정해야 합니다. 압달라 자발라가 이끄는 이슬람 르네상스 운동(나흐다)은 투표를 통한 온건하고 체계적인 이슬람주의 비전을 요구합니다. 그러나 다른 이들은 보다 직접적이고 타협 없는 형태의 이슬람 권위를 약속하는 울라마와 카리스마 있는 설교자들을 주목합니다."
 alg_mufti.2.a: "이슬람 르네상스 운동(나흐다)에 힘을 실어 준다"
 alg_mufti.2.a.tt: "자발라의 나흐다가 이슬람 정치의 주도 세력이 됩니다."
 alg_mufti.2.b: "권위를 울라마의 손에 맡긴다"
 alg_mufti.2.b.tt: "나중에 논란이 많은 설교자를 따를지, 정부가 승인한 무프티를 따를지 선택하게 됩니다."
 alg_mufti.3.t: "울라마의 얼굴"
 alg_mufti.3.d: "울라마의 권위가 확인된 지금, 정부는 누가 이 흐름을 대표하여 지도할지 결정해야 합니다. 셰이크 부암란은 국가와 군이 받아들일 수 있는 온건파인 반면, 알리 벨하지는 대중의 지지를 불러일으키지만 당국과의 충돌 위험을 안은 급진적이고 열정적인 목소리로 남아 있습니다."
 alg_mufti.3.a: "벨하지를 지지한다"
 alg_mufti.3.a.tt: "알리 벨하지가 강경 살라피스트 흐름을 대표하는 지도자가 됩니다."
 alg_mufti.3.b: "부암란을 지지한다"
 alg_mufti.3.b.tt: "셰이크 부암란이 온건하고 국가와 보조를 맞추는 울라마 흐름을 대표하는 지도자가 됩니다.\n§R2016년 5월 이후에는 선택할 수 없습니다.§!"
 ALG_ennahda: "엔나흐다 지원"
 ALG_ennahda_desc: "압달라 자발라와 이슬람 르네상스 운동을 지원하여 이슬람주의 정치를 국가 기관의 틀 안으로 끌어들일 것입니다."
 ALG_independent: "독립적인 울라마"
 ALG_independent_desc: "울라마의 독립성을 강화하여 종교 학자들에게 영적 사안에 대한, 그리고 잠재적으로 국가 지도부에 대한 권위를 부여할 것입니다."
 ALG_grand_mufti_rule: "대무프티의 통치"
 ALG_grand_mufti_rule_desc: "울라마 혹은 정치적 이슬람주의 운동이 알제리 국가의 지도 권위를 제공할 것입니다. 우리가 선택한 길이 누가 이슬람 권위의 얼굴로 부상할지를 결정할 것입니다."
 ALG_nahda_path: "나흐다의 길을 선택함"
 ALG_ulema_path: "울라마의 길을 선택함"
 ALG_belhadj_leader: "알리 벨하지가 지도자임"
 ALG_bouamrane_leader: "셰이크 부암란이 지도자임"
 ALG_constitution_1996: "1996년 헌법"
 ALG_constitution_1996_desc: "개정된 1996년 헌법은 암흑의 10년의 혼란 이후 알제리를 안정시키기 위한 것이었습니다. 그러나 많은 조항이 진정한 민주화보다는 정권의 존속을 염두에 두고 설계되었습니다. 경직된 세속적 틀은 이슬람주의 운동의 상당 부분에서 정당하지 않고 '비이슬람적'이라고 여겨졌습니다. 이는 국가 통제를 공고히 하고 대통령직을 강화하는 동시에 정치 참여를 제한하고, 정부와 사회 간의 신뢰를 떨어뜨리며, 장기적인 개혁을 가로막습니다. 이 헌법의 유산은 계속해서 알제리의 안정과 정통성에 무겁게 작용하고 있습니다."
 ALG_enahda_media_network_idea: "엔나흐다 미디어 네트워크"
 ALG_enahda_media_network_idea_desc: "엔나흐다 운동은 메시지를 전파하고 대중의 지지를 동원하기 위해 자체 미디어 채널을 구축했습니다. 이 매체들은 종교에서 영감을 얻은 가치를 증진하는 한편 정권의 실패를 비판합니다.\n\n§Y엔나흐다와 연대하지 않으면 이 국가 정신은 제거됩니다§!"
 ALG_supreme_islamic_council_idea: "최고 이슬람 평의회"
 ALG_supreme_islamic_council_idea_desc: "고위 울라마와 이슬람 학자들로 구성된 자문 평의회가 종교적 노선에 따라 국가 정책을 이끌기 위해 설립되었습니다. 직접적인 권력은 없지만 입법과 공적 생활에 대한 영향력은 상당합니다.\n\n§Y살라피스트 또는 이슬람주의자가 아니면 이 국가 정신은 제거됩니다§!"
 alg_constitution.1.t: "헌법 개혁"
 alg_constitution.1.d: "수년간의 논란 끝에 1996년 헌법이 개정되었습니다. 새로운 틀은 가장 권위주의적인 조항 일부를 삭제하고, 행정 권력에 대한 견제를 도입하며, 알제리의 이슬람적 흐름과 세속적 흐름 사이에 더 나은 균형을 이루고자 합니다. 많은 이들이 이를 화해를 향한 필수적인 단계로 보는 반면, 다른 이들은 이 개혁이 뿌리 깊은 르 푸부아르 체제를 진정으로 바꿀 수 있을지 의심합니다."
 alg_constitution.1.a: "새 헌법을 채택한다"
 alg_constitution.1.a.tt: "§Y1996년 헌법§!을 §Y개혁 헌법§!으로 대체하여 안정도, 정치력, 경제 성장에 보너스를 제공합니다."
 ALG_ali_belhadj_desc: "이슬람구국전선(FIS)의 공동 창립자인 알리 벨하지는 알제리의 격동의 1990년대에 가장 카리스마 있고 급진적인 이슬람주의 지도자 중 한 명이었습니다. 불같은 설교, 타협 없는 수사, 세속 정치에 대한 거부로 알려진 그는 FLN 정권에 대한 저항의 상징이 되었습니다. 내전 대부분의 기간 동안 투옥되었고 1996년 헌법에 따라 공식 정치에서 금지된 벨하지는 여전히 논쟁적인 인물로, 누군가에게는 이슬람주의적 불만의 화신이고, 다른 이들에게는 암흑의 10년을 상기시키는 위험한 존재입니다. 그의 정치 무대 복귀 가능성은 화해에 대한 희망과 극단주의 재발에 대한 두려움을 동시에 불러일으킵니다."
 ALG_bouamrane_desc: "무함마드 부암란은 1990년대에 보다 온건한 이슬람주의 지식인이자 정치 행위자로 부상했습니다. 대립보다 대화를 옹호한 그는 알리 벨하지와 같은 강경 이슬람주의자들과 뿌리 깊은 FLN 엘리트 사이에 자리를 잡았습니다. FIS 지도부와 같은 대중적 호소력은 얻지 못했으나, 부암란은 화해와 헌법 개혁에 관한 전후 논쟁에서 존경받는 인물이 되었습니다. 그의 비전은 이슬람적 가치가 민주적 제도와 공존할 수 있는 알제리를 강조했으며, 세속 정치와 종교 정치 간의 긴장된 균형에서 가교 역할을 하는 인물로 만들었습니다."
 algeria_elections.2024.t: "2024년 대통령 선거"
 algeria_elections.2024.d: "알제리는 또 한 번의 중대한 선거를 맞이합니다. 세 명의 선두 주자는 서로 다른 길을 상징합니다. FLN 아래에서의 연속성을 약속하는 압델마지드 테분, 민주적 개혁과 자유주의적 현대화를 옹호하는 유세프 아우시셰, 정치에서 종교의 더 큰 역할을 모색하는 이슬람주의 흐름의 지지를 받는 압델알리 핫사니입니다. 결과는 각 파벌 간의 세력 균형을 반영할 것입니다."
 algeria_elections.2024.a: "압델마지드 테분이 재선에 성공한다."
 algeria_elections.2024.b: "유세프 아우시셰가 대통령직을 차지한다."
 algeria_elections.2024.c: "압델알리 핫사니가 이슬람주의의 지지를 업고 부상한다."
 ALG_tebboune_2024_tt: "§Y압델마지드 테분§!이 FLN의 지배 속에 대통령직을 유지합니다."
 ALG_aouchiche_2024_tt: "§Y유세프 아우시셰§!가 개혁파 자유주의자들을 이끌며 대통령이 됩니다."
 ALG_hassani_2024_tt: "§Y압델알리 핫사니§!가 이슬람주의 운동의 지지를 받아 대통령이 됩니다."
 algeria_gspc.1.t: "나빌 사흐라위의 GSPC 장악"
 algeria_gspc.1.d: "설교와 전투를 위한 살라피스트 집단(GSPC) 내부에서 불만이 커졌습니다. 많은 지휘관이 하산 하타브가 나약하다고 비난하며 전면적인 지하드를 추구하는 데 주저한다고 비판했습니다. 2003년 중반 하타브는 부하들에 의해 밀려났고, 훨씬 더 급진적인 인물인 나빌 사흐라위가 스스로를 GSPC의 새로운 에미르로 선언했습니다."
 algeria_gspc.1.a: "반란이 한층 더 급진화한다."
 ALG_sahraoui_rise_tt: "§Y나빌 사흐라위§!가 하산 하타브를 대신해 GSPC의 새로운 지도자가 됩니다."
 algeria_gspc.2.t: "사흐라위 사살, 드루크델 부상"
 algeria_gspc.2.d: "2004년 6월, 알제리 보안군이 교전 중 나빌 사흐라위를 사살했습니다. 그러나 그의 죽음은 반란을 약화시키지 못했으며, 오히려 지도권이 알카에다의 세계적 연결망과 연계된 야심 찬 전략가 압델말렉 드루크델에게 넘어갔습니다. 그의 지휘 아래 GSPC는 지하드를 확대하고 국제화할 가능성이 높습니다."
 algeria_gspc.2.a: "더욱 치명적인 시대가 시작된다."
 ALG_droukdel_rise_tt: "§Y압델말렉 드루크델§!이 GSPC의 지도자가 됩니다."
 algeria_gspc.3.t: "하산 하타브의 투항"
 algeria_gspc.3.d: "수년간의 도피 끝에 GSPC의 창립자 하산 하타브가 알제리 당국에 투항했습니다. 자신이 만든 운동의 노선에 환멸을 느낀 하타브는 정부의 사면 프로그램을 받아들였습니다. 그의 영향력은 쇠퇴했지만 그의 투항은 알제리 정부에 상징적인 승리를 의미합니다."
 algeria_gspc.3.a: "반란의 패배를 상징한다."
 ALG_hattab_surrender_tt: "§Y하산 하타브§!가 투항하여 반란 활동이 감소합니다."
 alg_generals.1.t: "압델카데르 루네스의 공군 사령관 임명"
 alg_generals.1.d: "압델카데르 루네스 장군이 알제리 공군 사령관에 임명되었습니다. 현대화에 대한 집중으로 알려진 그는 앞으로 10년 동안 알제리의 항공 전력 발전을 총괄할 것입니다."
 alg_generals.1.a: "우리의 하늘은 안전한 손에 맡겨졌다."
 alg_generals.2.t: "아마르 암라니의 방공군 지휘"
 alg_generals.2.d: "아마르 암라니 소장이 알제리 지대공 방어군의 책임자로 배치되었습니다. 그의 지도력은 외세의 위협으로부터 영공을 방어하는 알제리의 역량을 강화할 것입니다."
 alg_generals.2.a: "우리의 방공이 더욱 강해진다."
 alg_generals.3.t: "메나드 누바, 헌병대 사령관에 취임"
 alg_generals.3.d: "메나드 누바 장군이 알제리 국가헌병대 사령관으로 임명되었습니다. 내부 치안과 대반란 작전을 담당하게 된 그의 리더십은 국내 질서를 유지하는 데 결정적인 역할을 할 것입니다."
 alg_generals.3.a: "알제리의 안보를 위한 강력한 손길."
 ALG_ouyahia_pm: "총리 아흐메드 우야히아"
 ALG_belkhadem_pm: "총리 압델아지즈 벨카뎀"
 ALG_interim_president.1.t: "임시 대통령직 선포"
 ALG_interim_president.1.d: "부테플리카의 사임 이후 알제리는 권력 공백에 직면했습니다. 헌법 규정에 따라 상원의장 압델카데르 벤살라가 90일간 임시 대통령으로 취임 선서를 했습니다. 히라크는 그를 동일한 부패 체제의 일부로 간주하며 이 임명을 거부하고 있습니다."
 ALG_interim_president.1.a: "압델카데르 벤살라를 임명한다"
 ALG_bouteflika_resigns.1.t: "부테플리카 사임"
 ALG_bouteflika_resigns.1.d: "수 주간 이어진 히라크 시위와 군부의 지지 철회로 막대한 압박을 받은 압델아지즈 부테플리카 대통령이 공식적으로 사임했습니다. 20년에 걸친 그의 대통령 재임이 막을 내렸고, 알제리의 미래는 불투명해졌습니다."
 ALG_bouteflika_resigns.1.a: "부테플리카의 시대는 끝났다."
 ALG_hirak.100.t: "히라크의 목소리"
 ALG_hirak.100.d: "알제에서 오랑까지, 콩스탕틴에서 타만라세트까지, 수백만 명이 매주 금요일마다 행진하며 '예트나하우 가3', 즉 모두 물러나라고 외쳤습니다. 낡은 체제는 무너졌습니다. 이제 히라크는 선택해야 합니다. 2월 22일의 정신을 엘 무라디아의 대통령궁으로 이끌고 갈 사람은 누구입니까?"
 ALG_hirak.100.a: "주비다 아술 – 헌법의 목소리"
 ALG_hirak.100.b: "카림 타부 – 거리의 투사"
 ALG_hirak.100.c: "하킴 아다드 – RAJ 세대"
 ALG_hirak.100.e: "아미라 부라위 – 바라카트의 맹렬한 딸"
 ALG_african_trade_links: "아프리카 무역 연계"
 ALG_african_trade_links_desc: "아프리카 전역에서 경제 및 외교 구상을 강화함으로써 알제리는 무역 협정 네트워크를 확대하고, 외부 시장에 대한 의존을 줄이며, 대륙 내 파트너들과 상호 번영을 보장하고 있습니다."
 ALG_african_mediation_role: "아프리카 중재 역할"
 ALG_african_mediation_role_desc: "알제리는 오래전부터 아프리카 분쟁에서 신뢰받는 중재자로 자리매김해 왔습니다. 분쟁 해결에 적극 참여함으로써 대륙 내 정당성을 강화하고 외교적 영향력을 확대할 수 있습니다."
 ALG_african_union_reforms: "아프리카 연합 개혁 추진"
 ALG_african_union_reforms_desc: "아프리카 연합은 여전히 실효성이 제한적입니다. 개혁을 추진하고, 기구를 강화하며, 책임성을 높이고, 합의를 구축함으로써 알제리가 아프리카 대륙 체제 내에서 존경받는 지도국이 되도록 할 수 있습니다."
 ALG_african_economic_integration: "아프리카 경제 통합"
 ALG_african_economic_integration_desc: "대륙 경제 통합은 알제리 번영의 열쇠입니다. 무역 장벽을 낮추고 아프리카 파트너들과의 연계를 개선함으로써 외국 시장에 대한 의존을 줄이고 아프리카 내에서 지속 가능한 성장을 촉진할 것입니다."
 ALG_expand_african_investments: "아프리카 투자 확대"
 ALG_expand_african_investments_desc: "국가가 후원하는 사업과 아프리카 파트너들과의 협력을 통해 알제리는 기반시설, 에너지, 무역 분야의 투자를 확대할 수 있습니다. 이러한 투자는 우리 경제를 활성화하는 동시에 대륙 전역과의 유대를 강화할 것입니다."
 ALG_PT: "PT (노동자당)"
 ALG_PT_desc: "PT(노동자당, Parti des travailleurs)는 알제리의 트로츠키주의 정당으로, 프랑스의 독립노동자당과 밀접한 관계를 맺고 있습니다. 당을 이끄는 인물은 루이자 하눈입니다. 약칭 \\"PT\\"를 사용하는 노동자당은 알제리 노동조합 운동의 보호와 증진을 옹호하며, 국민 사이에 부를 보다 고르게 분배할 것을 요구하는 평등주의 교리를 내세웁니다. 이 당은 다당제를 도입한 헌법 개정 1년 뒤인 1990년에 창당되었습니다. 사무총장은 루이자 하눈으로, 그녀는 2004년 아랍 세계 최초로 대통령 선거에 후보로 출마한 여성이었습니다."
 ALG_communist_education: "공산주의 교육"
 ALG_communist_education_desc: "어린 정신일수록 가장 쉽게 영향을 받습니다. 젊은 세대에게 공산주의의 기본 가치를 심어 주고 대학생들에게 평등의 영광을 가르친다면 우리의 대의는 크게 진전될 수 있습니다."
 ALG_labour_focus_unions: "노동조합과 접촉"
 ALG_labour_focus_unions_desc: "노동조합은 협력할 뿐만 아니라 자신들의 요구까지 수용해 주는 정부를 맞이하게 되어 매우 기뻐할 것입니다. 우리는 §R이해 충돌§!을 피하기 위해 그들의 영향력이 우리의 집권 이후까지 확장되지 않도록 할 것입니다."
 ALG_failures_capitalism: "자본주의의 실패"
 ALG_failures_capitalism_desc: "자본주의는 더 이상 약속했던 무한한 부를 가져다주지 않습니다. 이제 그런 위기가 다시는 일어나지 않도록 우리의 길을 걸어야 할 때입니다! §R이 중점의 효과는 부채 위기의 규모에 비례합니다.§!"
 ALG_working_class: "노동 계급"
 ALG_working_class_desc: "노동 계급, 꿈이 태어나기도 하고 죽기도 하는 곳입니다. 우리는 그들이 좋은 대우를 받을 것이며, 새로운 공산 국가의 토대로서 마땅한 인정을 받게 될 것이라고 약속할 수 있습니다."
 ALG_communist_propaganda: "선전 기구"
 ALG_communist_propaganda_desc: "우리의 영향력이 커지고 있으므로 알제리에 선전 기구를 풀어놓을 여력이 생겼습니다. 유지 비용은 높지만, 이 선전은 결코 무시할 수 없으며 알제리 국민을 전향시키는 데 매우 효과적일 것입니다."
 ALG_prepare_government: "정부 준비"
 ALG_prepare_government_desc: "당 내부에 정부를 미리 꾸려 둠으로써 효과적인 이행을 보장하고, 경쟁자들이 정비를 마치기 전에 우리의 목표를 실행에 옮길 수 있습니다. 비용이 많이 들겠지만, 우리의 승산을 고려하면 잘 겨냥한 도박입니다."
 ALG_damn_market: "자유 시장을 규탄하라"
 ALG_damn_market_desc: "우리는 자본가들에게 최후의 일격을 가할 위치에 있습니다. 선전의 힘이 우리 편에 있는 만큼 자유 시장 경제에 치명타를 가할 수 있으며, 그 과정에서 자본가들이 앉아 있는 과잉의 왕좌를 찬탈할 수 있습니다!"
 ALG_election_com: "즉각적인 선거 요구"
 ALG_election_com_desc: "동지들이여, 지금이 그때입니다! 새로운 자유 국가를 향한 우리의 모든 준비가 이 순간으로 이어졌습니다! \n\n§R우리는 인민의 정부가 앞으로 1000년 동안 통치하도록 할 것입니다!§!"
 PT_flag: "PT"
 ALG_failures_capitalism_TT: "§R이 중점의 효과는 부채 위기의 규모에 비례합니다.§!"
 ALG_communist_takeover_TT: "§G알제리 국민이 선거를 요구하고 있습니다!§!\n\n이를 위해 충분한 정치력을 확보해 두십시오. 선거를 치르고 정부를 구성하는 데 §R실패하면§! §Y[communist_state_L]§!에 권력을 부여하기 위해 §R또 한 번의 임시 선거를 치러야 합니다§!."
 ALG_increase_drift_TT: "§G이 정당을 향한 정치적 이동이 증가합니다!§!"
 ALG_wild_unions: "통제 불능의 노동조합"
 ALG_wild_unions_desc: "우리는 노동조합에 권력을 주었고 그들은 그것을 행사하고 있습니다. 우리는 여기에 아무런 문제도 없다고 봅니다."
 ALG_wild_unions_2: "통제 불능의 노동조합"
 ALG_wild_unions_2_desc: "노동조합은 우리가 권력을 향해 올라가는 동안 커다란 자유를 누렸습니다. 이제 승리를 거둔 지금, 우리는 권력 기반을 완전히 다지기 전에 국민의 마음을 얻기 위해서만 그들에게 호소할 뿐입니다."
 ALG_wild_unions_3: "통제 불능의 노동조합"
 ALG_wild_unions_3_desc: "노동조합은 도저히 참을 수 없습니다. 더 이상 견딜 수 없습니다! 처음에는 골칫거리에 불과했으나 이제는 국가 의지를 가로막는 장애물이 되었으니, 달래거나 파괴해야 합니다!"
 ALG_press_opposition: "언론의 반대"
 ALG_press_opposition_desc: "우리가 정부에 질서를 되찾은 이후로 언론은 우리를 좋은 모습으로 그린 적이 없지만, 약자가 강자를 두려워하는 것은 지극히 논리적입니다."
 ALG_one_party: "일당 국가"
 ALG_one_party_desc: "PT를 알제리에서 허용되는 유일한 정당으로 선언한 이후 우리는 원하는 무엇이든 할 힘을 갖게 되었으나, 국민을 복종시키기 위해 피를 흘려야 하는 대가를 치릅니다."
 ALG_reorganize_army_idea: "육군 재편"
 ALG_reorganize_army_idea_desc: "우리는 군대가 기능을 못 할 정도로 예산을 삭감할 수는 없습니다. 강력한 군대가 필요한 때가 올 수 있으며, 이러한 사태에 대비해 우리 군대가 충성스럽고 준비되어 있도록 할 것입니다."
 ALG_new_army_idea: "새로운 육군"
 ALG_new_army_idea_desc: "우리는 경찰이 주된 방어 병력의 역할을 넘겨받아 큰 성공을 거두는 것을 보았습니다. 그러나 그들이 외국의 침공을 격퇴할 만큼 충분한 장비를 갖추지 못했다는 것도 알고 있습니다. 우리는 국민의 안전을 보장하기 위해 오로지 알제리 방어에만 집중하는 새로운 육군을 건설할 것입니다."
 ALG_red_army_idea: "붉은 군대"
 ALG_red_army_idea_desc: "우리는 군대의 계급뿐만 아니라 민간인 사이에도 이념적 광신을 깊이 심어, 강력한 군대를 편성하는 데 필요한 인력과 충성심을 확보했습니다."
 ALG_cracked_foundation: "금이 간 토대"
 ALG_cracked_foundation_desc: "국가의 토대는 지금까지 너무나 많이 부정되어, 현재의 길을 계속 간다면 끔찍한 새 혁명에 직면할 수 있습니다. \n\n§R안정도가 30% 아래로 떨어지면 알제리에서 혁명이 일어납니다!§!"
 ALG_militarist_education_idea: "군국주의 교육"
 ALG_militarist_education_idea_desc: "교육 체계가 교과 과정에 군사적 가치를 심어, 갑작스러운 공격에 대비한 더 높은 수준의 준비 태세를 갖추게 합니다."
 ALG_elam: "국민 인민 전선의 부활"
 ALG_elam_desc: "국민 인민 전선이 평범한 유권자의 마음을 돌리기 위해 전방위적으로 활동을 크게 확대했습니다. 우리는 알제리가 이 '교란'의 원인이라고 의심합니다."
 algeria.5.t: "PT의 알제리 선거 요구"
 algeria.5.d: "알제리 노동 계급과 여러 정치 인사들의 과반수 지지를 얻은 노동자당(PT)이 정부에 자유 선거 실시를 촉구했습니다. PT는 막대한 지지를 모았고, 당국은 여러 방면에서 양보하라는 압박을 받고 있습니다. 노동자와 노동조합 사이의 기반이 날로 강해지는 만큼 많은 이들이 PT의 압승을 예상합니다. 한 대변인은 선거가 거부될 경우 노동자들이 정부를 전복하기 위해 봉기할 것이라고 경고했습니다."
 algeria.5.a: "알제리의 노동자들이여, 일어나라!"
 algeria.5.b: "흥미롭군"
 algeria.7.t: "알제리의 좌선회"
 algeria.7.d: "실업이 늘고 경제적 불평등이 악화되면서 알제리 노동 계급은 극좌 노동자당(PT) 뒤에 결집했습니다. PT는 신자유주의 정책과 노동자 권리 침해를 규탄하고, 반서방 입장을 지지하며, 정부를 압박하기 위한 시위를 조직하고 있습니다. 그들의 영향력은 빠르게 커지고 있으며, 알제리 정치가 결정적으로 좌측으로 이동했음을 보여 줍니다."
 algeria.7.a: "알제리의 노동자들이여, 그대들의 해방이 다가온다"
 algeria.7.b: "흥미롭군"
 ALG_family_centric: "가족 중심"
 ALG_family_centric_desc: "우리는 가족을 알제리 사회의 주요 구성 단위로 장려하고 있습니다."
 ALG_religion_in_schools: "종교 교육"
 ALG_religion_in_schools_desc: "우리의 교육 체계는 종교를 교과 과정에 긴밀히 편입하여, 젊은 세대가 강한 이슬람 가치관 속에서 자라도록 보장합니다."
 ALG_grand_mufti_appointed: "알제리 대무프티"
 ALG_grand_mufti_appointed_desc: "알제리에서 이슬람 율법을 해석하고 국가의 종교적 정당성을 강화하기 위해 대무프티가 임명되었습니다."
 ALG_islam_above_the_nation: "국가 위의 이슬람"
 ALG_islam_above_the_nation_desc: "알제리의 격동의 과거 속에서 민족주의와 이슬람은 국가 형성의 주도권을 놓고 경쟁했습니다. 우리의 미래를 위해서는 이슬람이 무엇보다 우선하는 통치의 지도 원리가 되어야 합니다."
 ALG_family_is_a_central_unit: "무엇보다 가족"
 ALG_family_is_a_central_unit_desc: "사회의 핵심은 가족입니다. 남성과 여성, 그리고 그들의 자녀가 국가의 토대를 이룹니다. 강한 가족이 앞으로 오랜 세월 알제리의 번영과 성공을 보장할 것입니다."
 ALG_follow_religious_law: "종교 율법 준수"
 ALG_follow_religious_law_desc: "이슬람 율법은 나라를 다스리는 데 가장 좋은 기반입니다. 이를 우리의 토대로 채택하면 모든 알제리인을 위한 정의와 공정이 보장될 것입니다."
 ALG_traditional_role_for_women: "여성의 전통적 역할"
 ALG_traditional_role_for_women_desc: "여성은 자녀를 기르고 가족을 돌보는 가장 높은 영예를 지닙니다. 남성이 밖에서 일하는 동안 여성은 가정에서 국가의 전통을 지켜야 합니다."
 ALG_religious_education: "종교 교육"
 ALG_religious_education_desc: "우리의 학교는 종교 학습을 교과 과정에 긴밀히 편입해야 합니다. 알제리인은 어린 시절부터 꾸란과 이슬람 관습을 배워야 합니다."
 ALG_appoint_grand_mufti: "대무프티 임명"
 ALG_appoint_grand_mufti_desc: "알제리에는 이슬람 율법을 해석할 대무프티가 필요합니다. 국가에 종교적 지침을 제공할 존경받는 학자를 지명해야 합니다."
 ALG_abrogate_secular_constitution: "세속 헌법 폐기"
 ALG_abrogate_secular_constitution_desc: "현행 헌법은 독립 이후 물려받은 세속적 틀을 유지하고 있습니다. 우리가 따라야 할 유일한 법은 인간이 만든 문서가 아닌 꾸란입니다."
 ALG_enahda_media_network: "엔나흐다 미디어 네트워크"
 ALG_enahda_media_network_desc: "대무프티의 메시지를 전하고 알제리 전역에 이슬람 가치를 알리기 위해 전국 텔레비전 방송망을 구축해야 합니다."
 ALG_supreme_islamic_council: "최고 이슬람 평의회"
 ALG_supreme_islamic_council_desc: "새로운 국가를 지키기 위해 대무프티를 보좌하고 알제리가 신앙의 길 위에 굳건히 머물도록 보장하는 자문 기구인 최고 이슬람 평의회를 설립해야 합니다."
 ALG_edu_and_social_policy: "교육 및 사회 정책"
 ALG_edu_and_social_policy_desc: "알제리의 장기적 번영은 천연자원 이상의 것에 달려 있습니다. 그것은 교육, 보건, 사회 보호라는 토대 위에 서 있습니다. 이 분야를 개혁함으로써 21세기를 위한 새로운 사회 계약을 만들어 낼 수 있습니다."
 ALG_expand_primary_education: "초등 교육 확대"
 ALG_expand_primary_education_desc: "농촌과 도시 지역 전역에서 초등학교 접근성을 넓히면 문맹이 줄고 국가 발전의 토대가 마련될 것입니다."
 ALG_reform_secondary_curriculum: "중등 교과 과정 개혁"
 ALG_reform_secondary_curriculum_desc: "우리의 중등학교는 알제리의 정체성을 보존하면서도 현대 경제의 요구에 부응하도록 개혁되어야 합니다."
 ALG_western_curriculum: "서방식 교과 과정 도입"
 ALG_western_curriculum_desc: "서방 지향의 교과 과정을 통합함으로써 청년들이 현대 과학과 국제 표준을 접하게 하여 알제리의 경쟁력을 높일 수 있습니다."
 ALG_national_curriculum: "국가 교과 과정 강화"
 ALG_national_curriculum_desc: "외국 모델을 모방하는 대신, 교육 주권을 지키기 위해 학교에서 아랍화와 알제리 문화 가치에 집중해야 합니다."
 ALG_university_reform: "대학 개혁"
 ALG_university_reform_desc: "알제리의 미래를 이끌 전문가, 연구자, 혁신가를 양성하기 위해 대학을 확충하고 현대화해야 합니다."
 ALG_basic_healthcare_access: "기초 의료 접근성"
 ALG_basic_healthcare_access_desc: "모든 알제리인은 기초 의료 서비스를 받을 자격이 있습니다. 보장 범위를 넓히는 것은 더 건강한 국가를 향한 첫걸음입니다."
 ALG_state_hospitals: "국립 병원 확충"
 ALG_state_hospitals_desc: "국가가 주도하는 병원 체계에 투자함으로써 모든 알제리인에게 무료로 접근 가능한 의료를 보장할 수 있지만, 국고에는 상당한 부담이 됩니다."
 ALG_modernize_state_hospitals: "국립 병원 현대화"
 ALG_modernize_state_hospitals_desc: "장비를 개선하고, 의사를 훈련하며, 기반시설을 향상하면 국가 의료 네트워크가 강화될 것입니다."
 ALG_universal_healthcare: "보편적 의료"
 ALG_universal_healthcare_desc: "의료는 특권이 아니라 권리입니다. 알제리는 완전한 보편적 의료 체계를 구축하는 데 전념할 것입니다."
 ALG_private_healthcare: "민간 의료 장려"
 ALG_private_healthcare_desc: "민간 병원과 의원을 장려함으로써 국가의 부담을 줄이고 의료 부문에 시장 경쟁을 도입할 수 있습니다."
 ALG_expand_private_clinics: "민간 의원 확충"
 ALG_expand_private_clinics_desc: "민간 의원은 특히 도시 지역에서 더욱 전문화된 서비스를 제공함으로써 공공 체계를 보완할 수 있습니다."
 ALG_national_insurance: "국민 보험 제도"
 ALG_national_insurance_desc: "국민 건강 보험 제도는 공공 및 민간 의료를 알제리 국민을 위한 단일한 안전망으로 통합할 것입니다."
 ALG_minimum_income_guarantee: "최저 소득 보장"
 ALG_minimum_income_guarantee_desc: "국가가 가장 취약한 계층에게 최저 수준의 소득을 보장하여 알제리인을 절대 빈곤으로부터 보호할 것입니다."
 ALG_housing_support: "주거 지원"
 ALG_housing_support_desc: "보조금 지원 주택 프로그램은 노동 가구에 적정 가격의 주택을 제공하고 도시의 과밀을 해소할 것입니다."
 ALG_childcare_support: "보육 지원"
 ALG_childcare_support_desc: "보육 시설과 가족 수당을 지원하면 젊은 가정이 경제적 어려움 없이 자녀를 기르는 데 도움이 될 것입니다."
 ALG_fuel_subsidies: "연료 보조금"
 ALG_fuel_subsidies_desc: "연료 가격에 보조금을 지급함으로써 국고에 부담이 되더라도 평범한 알제리인이 교통과 난방을 감당할 수 있게 할 수 있습니다."
 ALG_food_subsidies: "식량 보조금"
 ALG_food_subsidies_desc: "빵과 필수 식품의 가격을 보호하면 굶주리는 알제리 가정이 없도록 보장할 것입니다."
 ALG_welfare_consolidation: "복지 국가 공고화"
 ALG_welfare_consolidation_desc: "사회 프로그램을 포괄적인 복지 체계로 통합함으로써 알제리는 현대적인 사회 안전망을 확립할 것입니다."
 ALG_civil_rights_protections: "시민권 보호"
 ALG_civil_rights_protections_desc: "기본권과 자유를 보장하면 국가 안정이 강화되고 불만이 줄어들 것입니다."
 ALG_gender_equality: "성평등 증진"
 ALG_gender_equality_desc: "동등한 권리와 기회를 통해 알제리 여성에게 힘을 실어 주는 것은 정의롭고 번영하는 사회를 건설하는 열쇠입니다."
 ALG_freedom_of_press: "언론 자유 보장"
 ALG_freedom_of_press_desc: "자유 언론은 민주주의와 책임성에 필수적입니다. 독립 언론을 지원하면 알제리인들이 더 강한 목소리를 낼 수 있습니다."
 ALG_judicial_reform: "사법 개혁"
 ALG_judicial_reform_desc: "현대적이고 독립적인 사법부는 공정한 재판을 보장하고, 부패를 줄이며, 법치를 강화할 것입니다."
 ALG_civil_society_empowerment: "시민 사회 역량 강화"
 ALG_civil_society_empowerment_desc: "NGO, 노동조합, 풀뿌리 조직을 지원하면 더 참여적이고 회복력 있는 사회가 만들어질 것입니다."
 ALG_digital_government: "디지털 정부"
 ALG_digital_government_desc: "디지털화는 관료주의를 줄이고, 투명성을 높이며, 정부 서비스를 국민에게 더 가까이 가져갈 것입니다."
 ALG_public_service_efficiency: "공공 서비스 효율화"
 ALG_public_service_efficiency_desc: "공공 부문을 현대화함으로써 비효율을 제거하고 서비스 제공을 개선할 수 있습니다."
 ALG_anti_corruption_campaign: "반부패 캠페인"
 ALG_anti_corruption_campaign_desc: "부패는 국가를 좀먹습니다. 이에 맞선 포괄적인 캠페인은 알제리 기관에 대한 신뢰를 회복시킬 것입니다."
 ALG_e_governance_portal: "전자 정부 포털"
 ALG_e_governance_portal_desc: "통합 전자 정부 플랫폼을 구축하면 시민에게 투명하고 신속하며 접근하기 쉬운 공공 서비스를 제공할 수 있습니다."
 ALG_streamlined_bureaucracy: "관료제 간소화"
 ALG_streamlined_bureaucracy_desc: "불필요한 행정 절차를 줄이고 행정 구조를 현대화함으로써 알제리는 더욱 효율적이고 경쟁력 있게 될 것입니다."
 ALG_social_contract_21st_century: "21세기를 위한 사회 계약"
 ALG_social_contract_21st_century_desc: "교육, 의료, 복지, 시민권, 행정 개혁을 통해 알제리는 앞으로 여러 세대에 걸쳐 안정, 정의, 번영을 보장하는 새로운 사회 계약을 만들어 낼 것입니다."
 ALG_corrupt_mil_idea: "부패한 군부"
 ALG_corrupt_mil_idea_desc: "알제리 군은 강력하고 정치에 깊이 뿌리내리고 있으나 만연한 부패에 시달리고 있습니다. 현대화와 효율성을 위한 자원이 장군들과 후견 네트워크에 의해 빼돌려집니다. 이는 작전 능력을 약화시키고 대중의 신뢰를 훼손하며, 개혁을 어렵게 하는 동시에 군의 역할을 수호자이자 진보의 장애물로 고착시킵니다."
 ALG_military_oversight: "군의 감독"
 ALG_military_oversight_desc: "군은 정치와 민간 기관에 대해 엄격한 감독 체제를 구축했습니다. 이는 안정을 보장하고 혼란을 방지하지만, 투명성을 떨어뜨리고 개혁을 제약하며 공적 생활에서 군의 지배력을 강화합니다."
 ALG_gas_pipeline_leverage: "가스관 지렛대"
 ALG_gas_pipeline_leverage_desc: "유럽으로 이어지는 알제리의 방대한 가스관 네트워크는 외교 정책에서 강력한 협상 수단을 제공합니다. 에너지 의존은 파트너들을 신중하게 만들지만, 정치적 영향력을 유지하기 위해 탄화수소 수출에 과도하게 의존하게 되기도 합니다."
 ALG_resource_curse: "자원의 저주"
 ALG_resource_curse_desc: "막대한 석유 및 가스 매장량에도 불구하고 알제리는 '자원의 저주'에 시달리고 있습니다. 탄화수소에 대한 의존은 부패를 부추기고, 다각화를 가로막으며, 경제를 세계 에너지 시장의 변동성에 노출시킵니다."
 ALG_PM_Elections: "총리 임명"
 ALG_PM_Elections_desc: "\n£MAIN_desctext_elections\n\n\n\n대통령은 정부를 이끌 총리의 임명을 결정해야 합니다. 이 선택은 단순한 행정적 문제가 아닙니다. 충성스러운 기술 관료에서 야당 개혁파에 이르기까지, 후보마다 알제리의 미래에 대한 서로 다른 비전을 대표합니다."
 ALG_authority_more_70: "§Y개혁파§!가 [ROOT.GetFlag] 알제리 정부 내에서 £generic_anarchist_communism_small 영향력의 최소 §Y70%§!를 차지"
 ALG_PNA_victory_tt: "§Y르 푸부아르§!이 세력 균형에서 영향력의 §Y45%§! 이상을 차지"
 ALG_prime_minister_name_loc: "총리"
 ALG_minister_bio_loc: "대통령 아래에서 행정 권한을 보유하는 직위."
 algeria_morocco.1.t: "모로코 문제"
 algeria_morocco.1.d: "알제리와 모로코의 관계는 오래전부터 모래 전쟁의 쓰라린 유산, 서사하라 분쟁, 수십 년간의 국경 폐쇄에 가려져 왔습니다. 긴장이 여전히 끓어오르는 가운데, 모로코에 어떻게 접근할 것인가 하는 문제가 크게 부각되고 있습니다. 알제리는 역사적 경쟁 관계를 더욱 강화해야 합니까, 아니면 대화와 협력이라는 새로운 길을 모색해야 합니까?"
 algeria_morocco.1.a: "마그레브의 미래가 걸려 있다."
 ALG_morocco_question: "모로코 문제"
 ALG_morocco_question_desc: "서사하라를 둘러싼 모로코와의 경쟁, 모래 전쟁, 수십 년간의 국경 폐쇄는 알제리를 약화시켰습니다. 우리는 결정해야 합니다. 모로코와 대결할 것입니까, 아니면 화해를 추구할 것입니까?\n\n§Y이 중점은 모로코 문제 분기를 시작합니다.§!"
 ALG_sand_war_legacy: "모래 전쟁의 유산"
 ALG_sand_war_legacy_desc: "1963년 모래 전쟁의 상처는 여전히 남아 있습니다. 알제리인들은 우리 영토에 대한 모로코의 야욕을 기억하고 있으며, 많은 이들이 새로운 경계를 촉구합니다."
 ALG_close_the_border: "국경 폐쇄"
 ALG_close_the_border_desc: "모로코와의 국경은 밀수, 불안, 첩보 활동의 원천으로 남아 있습니다. 이를 폐쇄하면 강력한 저항의 메시지를 보내게 될 것입니다."
 ALG_border_security_investments: "국경 보안 투자"
 ALG_border_security_investments_desc: "모로코의 영향력을 막기 위해 상설 군 초소, 현대적 감시 장비, 헌병대 부대로 서부 국경을 강화해야 합니다."
 ALG_counter_moroccan_influence: "모로코 영향력 견제"
 ALG_counter_moroccan_influence_desc: "모로코는 해외에서 적극적으로 동맹을 구하고 있습니다. 알제리는 이 외교 공세에 맞서 아프리카와 그 너머에서 모로코의 영향력을 차단해야 합니다."
 ALG_support_polisario_struggle: "폴리사리오 투쟁 지원"
 ALG_support_polisario_struggle_desc: "사하라위 민족은 독립을 누릴 자격이 있습니다. 폴리사리오 전선을 지원함으로써 알제리는 마그레브 반식민 투쟁의 기수로서 입지를 강화합니다."
 ALG_internationalize_conflict: "분쟁의 국제화"
 ALG_internationalize_conflict_desc: "서사하라 문제는 모로코를 외교적으로 압박하기 위해 UN, AU, 그리고 가능한 모든 포럼으로 끌어올려져야 합니다."
 ALG_african_union_pressure: "아프리카 연합 동원"
 ALG_african_union_pressure_desc: "아프리카 연합을 통해 알제리는 모로코에 사하라위 민족자결을 수용하도록 압박하는 국가 연합을 구축할 것입니다."
 ALG_seek_dialogue_morocco: "모로코와의 대화 모색"
 ALG_seek_dialogue_morocco_desc: "알제리는 모로코와의 외교 경로를 모색해야 합니다. 과거의 전쟁과 경쟁이 우리를 갈라놓고 있지만, 대화는 지역 안정으로 이어질 수 있습니다."
 ALG_confidence_building: "신뢰 구축 조치"
 ALG_confidence_building_desc: "공동 위원회나 비자 제한 완화와 같은 작은 걸음이 모로코와의 지속적인 신뢰를 위한 토대를 마련할 수 있습니다."
 ALG_reopen_borders: "국경 재개방"
 ALG_reopen_borders_desc: "수년간의 폐쇄 끝에 사람과 물자의 자유로운 이동을 위해 국경을 다시 여는 것은 양국 관계의 역사적인 전환점이 될 것입니다."
 ALG_economic_cooperation: "경제 협력"
 ALG_economic_cooperation_desc: "모로코와의 경제적 상호 의존은 번영을 가져오고, 긴장을 완화하며, 알제리의 지역적 역할을 강화할 것입니다."
 ALG_security_cooperation: "안보 협력"
 ALG_security_cooperation_desc: "테러와 밀수 같은 공동의 위협에는 합동 순찰과 정보 공유가 필요합니다. 협력은 경쟁보다 효율적입니다."
 ALG_towards_maghreb_union: "마그레브 연합을 향하여"
 ALG_towards_maghreb_union_desc: "모로코와 함께라면 알제리는 북아프리카 통합이라는 선조들의 꿈을 되살려 강력한 마그레브 연합의 토대를 놓을 수 있습니다."
 ALG_morocco.1.t: "서사하라에 관한 UN 토론"
 ALG_morocco.1.d: "알제리가 서사하라 문제를 국제연합에 상정하여 모로코의 영토 통제를 규탄했습니다. 대표단들은 모로코가 철수해야 하는지, 아니면 알제리가 월권을 하고 있는지를 놓고 토론하고 있습니다."
 ALG_morocco.1.a: "모로코를 강력히 규탄한다"
 ALG_morocco.1.b: "온건한 제재와 결의안을 추진한다"
 ALG_moroccan_rivalry_start: "모로코와의 국경 긴장"
 ALG_moroccan_rivalry_start_desc: "모래 전쟁, 서사하라, 1994년 국경 폐쇄로 불붙은 모로코와의 수십 년에 걸친 적대는 알제리에 무거운 짐이 되고 있습니다. 이 긴장은 우리의 경제, 안정, 군사 준비 태세를 해칩니다.\n§R이 국가 정신은 일반적인 방법으로는 제거할 수 없습니다.§!\n§Y모로코 문제§! 중점 트리를 진행해야만 감소, 대체 또는 제거됩니다."
 ALG_moroccan_rivalry_A1: "모로코 영향력 견제"
 ALG_moroccan_rivalry_A1_desc: "알제리는 지역 내 모로코의 영향력을 무디게 하기 위한 조치를 취했습니다. 경쟁은 지속되지만 그 영향은 더 효과적으로 관리되고 있습니다."
 ALG_moroccan_rivalry_A2: "격화된 경쟁"
 ALG_moroccan_rivalry_A2_desc: "모로코와의 긴장은 여전히 국가의 소모 요인이지만, 우리의 결의와 개혁으로 그 영향이 제한되고 있습니다."
 ALG_moroccan_rivalry_A_final: "대모로코 군사 대비 태세"
 ALG_moroccan_rivalry_A_final_desc: "수년간의 대치를 거치며 알제리는 단련되고 유능한 군대를 구축하여 분쟁에 대비하고 있습니다. 경쟁은 역경 속에서 힘을 벼려 냈습니다."
 ALG_moroccan_reconciliation_B1: "외교적 타진"
 ALG_moroccan_reconciliation_B1_desc: "알제리는 모로코와의 대화를 향해 조심스러운 발걸음을 내디뎠으며, 제한적인 협력과 신뢰 구축의 기회를 만들고 있습니다."
 ALG_moroccan_reconciliation_B2: "국경 개방"
 ALG_moroccan_reconciliation_B2_desc: "외교 관계가 깊어지면서 알제리는 모로코와의 국경을 다시 열어 경제적 부담을 줄이고 지역 무역을 육성하고 있습니다."
 ALG_moroccan_reconciliation_B_final: "마그레브 협력"
 ALG_moroccan_reconciliation_B_final_desc: "알제리와 모로코는 협력을 받아들여 무역, 개발, 지역 리더십을 가능하게 했습니다. 경쟁은 마침내 과거의 일이 되었습니다."
 ALG_morocco_question_tt: "§Y이 중점은 모로코 문제 경로를 시작합니다.§!\n\n- §R경로 A:§! 모로코와의 대결 추구 - 약화 국가 정신을 점진적으로 완화하며, 최종적으로 §G더 강한 육군§!을 얻습니다.\n- §G경로 B:§! 모로코와의 화해 추구 - 약화 국가 정신을 §G긍정적 강화 효과§!를 개선하는 국가 정신으로 교체하며, 최종적으로 더 강한 §Y경제와 외교§!를 얻습니다."
 alg_general.1.t: "할레드 네자르의 귀환"
 alg_general.1.d: "암흑의 10년의 방식을 되살리기로 결정하면서, 논란의 여지가 있는 전 국방장관 할레드 네자르가 다시 소환되었습니다. 그의 강압적인 접근은 군을 안정시킬 수 있지만, 국민의 반감을 사고 국제적 비판을 받을 위험이 있습니다."
 alg_general.1.a: "과거가 돌아와 현재를 이끈다."
