 competence_very_high: "§GTrès élevé§!"
 deep_state_influence_minimal: "§GMinime§!"
 deep_state_influence_low: "§GFaible§!"
 deep_state_influence_moderate: "§YModéré§!"
 deep_state_influence_high: "§RÉlevé§!"
 deep_state_influence_very_high: "§RTrès élevé§!"
 ALG_minister_vacant: "Libre"
 ALG_military_industrial_complex: "Complexe militaro-industriel"
 ALG_patronage_networks: "Réseaux de mécénat"
 ALG_crush_all_opposition: "Écraser toute opposition"
 ALG_control_hydrocarbons: "Contrôler les hydrocarbures"
 ALG_fortress_algeria: "Forteresse Algérie"
 ALG_military_industrial_complex_desc: "L'armée étend son empire économique, bâtissant des usines d'armes et sécurisant de lucratifs contrats de défense. Le corps des officiers devient une classe d'affaires, des généraux siégeant aux conseils d'administration et accumulant une vaste fortune."
 ALG_patronage_networks_desc: "Un réseau de clientélisme relie le régime aux élites des affaires et aux courtiers de pouvoir régionaux. La loyauté s'achète par contrats, licences et accès. L'État devient un instrument d'enrichissement privé."
 ALG_crush_all_opposition_desc: "Le régime élimine toute opposition organisée par arrestations, censure et intimidation. Les partis politiques sont cooptés ou interdits. La société civile est vidée. Seule la voix du régime se fait entendre."
 ALG_control_hydrocarbons_desc: "L'État s'empare du contrôle total du secteur des hydrocarbures, canalisant les revenus pétroliers et gaziers directement dans les caisses du régime. Les partenaires étrangers sont pressurés, les opérateurs indépendants absorbés, et l'État profond contrôle le robinet."
 ALG_fortress_algeria_desc: "L'Algérie devient un État-garnison — militarisé, fermé et méfiant du monde extérieur. L'armée est forte, les frontières scellées, et la population tenue en ligne par un mélange de richesse pétrolière et de répression."
 ALG_oil_crash_weakens_regime_tt: "Le krach pétrolier a gravement affaibli la capacité du régime à acheter la paix sociale. Le mécontentement populaire monte."
 ALG_hirak_wins_tt: "Le mouvement Hirak a triomphé. Une nouvelle Algérie est possible."
 ALG_military_wins_tt: "L'État profond a prévalu. Le règne militaire continue sous un nouveau visage."
 ALG_republic_new_era_tt: "Une nouvelle ère commence pour la République algérienne. L'ancien système est en cours de démantèlement."
 ALG_parliamentary_republic_tt: "L'Algérie a adopté un système parlementaire de gouvernement. L'Assemblée nationale est suprême."
 ALG_semi_presidential_republic_tt: "L'Algérie a adopté un système semi-présidentiel de gouvernement. Le pouvoir est partagé entre président et parlement."
 ALG_presidential_republic_tt: "L'Algérie a adopté un système présidentiel de gouvernement. Le président détient l'autorité exécutive dominante."
 ALG_patronage_enriches_regime_tt: "Les réseaux de clientélisme enrichissent le régime et ses alliés aux dépens du peuple algérien."
 ALG_fortress_state_tt: "L'Algérie est devenue un État-forteresse. L'État profond règne absolument, et la nation est fermée au monde."
 ALG_military_industrial_economy: "Économie militaro-industrielle"
 ALG_state_hydrocarbon_monopoly: "Monopole d'État sur les hydrocarbures"
 ALG_fortress_state: "État forteresse"
 ALG_military_industrial_economy_desc: "L'armée s'est étendue à la production d'armes et à l'industrie de défense, créant une base économique autonome pour le régime. Les généraux siègent aux conseils d'administration et la ligne entre l'uniforme et le costume d'affaires s'est brouillée."
 ALG_state_hydrocarbon_monopoly_desc: "Le contrôle total de l'État sur les revenus pétroliers et gaziers finance le régime et ses réseaux de clientélisme. Le secteur des hydrocarbures est un monde clos où seuls les initiés peuvent opérer."
 ALG_fortress_state_desc: "L'Algérie est devenue un État fermé et militarisé. L'armée est puissante, la société contrôlée, et l'État profond règne sans défi. La stabilité a été achetée au prix de la liberté."
 ALG_redmed_group_expansion: "Expansion du groupe RedMed"
 ALG_redmed_group_expansion_desc: "RedMed Group s'est révélé un partenaire logistique fiable du secteur pétrolier et gazier autour de Hassi Messaoud. Avec le bon investissement, il peut croître en une force industrielle plus large."
 ALG_star_aviation_operations: "Opérations Star Aviation"
 ALG_star_aviation_operations_desc: "La filiale aviation de RedMed Group a maintenu un bilan de sécurité parfait depuis sa fondation. Nous devrions tirer parti de cette réputation pour approfondir notre implication dans le secteur aéronautique."
 ALG_military_aviation_contract: "Contrats d'aviation militaire"
 ALG_military_aviation_contract_desc: "L'excellence opérationnelle de Star Aviation a attiré l'attention de l'armée. Obtenir des contrats de défense ouvrira la porte au développement aérospatial avancé et financera la prochaine phase d'expansion."
 ALG_missile_development_initiative: "Initiative de développement de missiles"
 ALG_missile_development_initiative_desc: "Une armée moderne ne peut s'appuyer uniquement sur l'armement étranger. Nous lancerons un programme de missiles national par RedMed Group, posant les bases d'une dissuasion stratégique."
 ALG_star_aviation_uav_division: "Division des drones de Star Aviation"
 ALG_star_aviation_uav_division_desc: "La technologie UAV étrangère en main, Star Aviation est prête à établir une division drones dédiée. Les ingénieurs algériens étudieront, adapteront et finiront par surpasser ce qui leur a été donné."
 ALG_domestic_uav_production: "Production nationale de drones"
 ALG_domestic_uav_production_desc: "La phase d'ingénierie inverse est achevée. Les installations de Star Aviation sont prêtes à produire des UAV de conception algérienne à l'échelle. Il ne s'agit plus d'imports, mais de souveraineté."
 ALG_russian_missile_cooperation: "Coopération russe en matière de missiles"
 ALG_russian_missile_cooperation_desc: "L'industrie de missiles russe est parmi les plus avancées du monde. Un partenariat avec Moscou accélérera nettement notre programme, au prix d'une dépendance plus profonde à la bienveillance russe."
 ALG_chinese_missile_cooperation: "Coopération chinoise en matière de missiles"
 ALG_chinese_missile_cooperation_desc: "La Chine a montré sa volonté de partager la technologie de missiles avec des États amis. Un accord avec Pékin offre l'accès à des systèmes modernes et renforce notre position dans le monde multipolaire émergent."
 ALG_redmed_star_convergence: "Convergence RedMed-Star"
 ALG_redmed_star_convergence_desc: "L'heure est venue d'unir la division missiles de RedMed aux capacités UAV de Star Aviation sous une seule structure de défense intégrée. L'Algérie n'importera plus sa sécurité : elle la fabriquera."
 ALG_regional_defense_leader: "Leader de la défense maghrébine"
 ALG_regional_defense_leader_desc: "L'industrie de défense algérienne se dresse désormais sans égale au Maghreb. Nos UAV patrouillent le Sahara, nos missiles dissuadent nos rivaux, et notre technologie est recherchée par des voisins qui regardaient jadis vers l'Europe. Voilà à quoi ressemble la souveraineté."
 ALG_uav_procurement_category: "Achat de drones"
 ALG_uav_procurement_category_desc: "Star Aviation a besoin d'une plateforme de référence pour commencer l'ingénierie inverse. Sélectionnez un fournisseur étranger de drones."
 ALG_drone_program_category: "Programme de drones"
 ALG_drone_program_category_desc: "La division drones de Star Aviation est prête à développer le premier drone national algérien. Choisissez une orientation de développement."
 ALG_purchase_turkish_uavs: "Acheter des drones turcs"
 ALG_purchase_turkish_uavs_desc: "Le Bayraktar TB2 a fait ses preuves dans de multiples conflits. L'acquérir auprès de la Turquie fournira une expérience opérationnelle UAV et une solide plate-forme d'ingénierie inverse, au prix d'un rapprochement avec Ankara."
 ALG_purchase_chinese_uavs: "Acheter des drones chinois"
 ALG_purchase_chinese_uavs_desc: "Le Wing Loong II chinois offre des capacités comparables aux systèmes occidentaux à une fraction du prix. Pékin a aussi montré sa volonté d'inclure des clauses de transfert de technologies dans de tels accords."
 ALG_purchase_iranian_uavs: "Acheter des drones iraniens"
 ALG_purchase_iranian_uavs_desc: "Le Mohajer-6 iranien est économique et éprouvé au combat. L'acquérir auprès de Téhéran est l'option la moins chère et approfondit les liens avec un partenaire stratégique naturel, bien que cela puisse attirer un examen international."
 ALG_develop_amel_recon_uav: "Développer l'UAV Amel"
 ALG_develop_amel_recon_uav_desc: "L'Amel sera le premier UAV de reconnaissance de conception nationale algérienne, une plate-forme à haute endurance optimisée pour la surveillance des frontières et le recueil de renseignement à travers le vaste sud saharien."
 ALG_develop_el_djazair_ucav: "Développer l'UCAV El-Djazair"
 ALG_develop_el_djazair_ucav_desc: "L'El-Djazair sera un vrai drone de combat, un UCAV armé capable de frappes de précision. Plus coûteux et techniquement exigeant qu'une plate-forme de reconnaissance, mais un atout militaire bien plus puissant."
 ALG_develop_swarm_loitering: "Développer des munitions pour flâner en essaim"
 ALG_develop_swarm_loitering_desc: "Plutôt qu'un seul grand drone, l'Algérie investira dans des essaims de munitions rôdeuses petites, bon marché et coordonnées. Plus dures à intercepter, dévastatrices en nombre, et moins chères à produire à l'échelle."
 ALG_redmed_group_tt: "§GLe groupe RedMed élargit ses activités au-delà de la logistique pétrolière et gazière vers des capacités industrielles plus vastes.§!"
 ALG_star_aviation_founded_tt: "§GL'excellence opérationnelle de Star Aviation la positionne pour des contrats militaires.§!"
 ALG_military_contract_tt: "§GStar Aviation a obtenu des contrats militaires. Les décisions d'acquisition d'UAV sont désormais disponibles.§!"
 ALG_uav_division_tt: "§GUne division UAV dédiée a été établie. Les décisions de développement de drones sont désormais disponibles.§!"
 ALG_domestic_production_tt: "§GL'Algérie peut désormais fabriquer des drones sur son sol.§!"
 ALG_amel_developed_tt: "§GL'UAV de reconnaissance Amel a été développé avec succès.§!"
 ALG_ucav_developed_tt: "§GLe drone de combat El-Djazair est désormais opérationnel.§!"
 ALG_swarm_developed_tt: "§GL'Algérie a développé une capacité d'essaim de munitions rôdeuses.§!"
 ALG_missile_division_tt: "§GRedMed Group a établi une division dédiée au développement de missiles.§!"
 ALG_redmed_leader_tt: "§GRedMed Group et Star Aviation ont fusionné en un complexe industriel de défense unifié.§!"
 ALG_defense_leader_tt: "§GL'Algérie est reconnue comme la première nation de technologie de défense du Maghreb.§!"
 ALG_redmed_group_logistics: "Logistique du Groupe RedMed"
 ALG_redmed_group_logistics_desc: "RedMed Group fournit des services logistiques d'ensemble au secteur pétrolier et gazier algérien."
 ALG_redmed_star_aviation: "Opérations Star Aviation"
 ALG_redmed_star_aviation_desc: "Star Aviation conserve un bilan de sécurité parfait. Sa précision opérationnelle est désormais tournée vers le développement aérospatial."
 ALG_star_aviation_military: "Contrats militaires de Star Aviation"
 ALG_star_aviation_military_desc: "Star Aviation a obtenu des contrats militaires, apportant son excellence opérationnelle civile au secteur de la défense."
 ALG_star_aviation_uav_division_idea: "Division des drones de Star Aviation"
 ALG_star_aviation_uav_division_idea_desc: "Une division dédiée aux drones étudie les plateformes étrangères afin de développer les capacités propres de l'Algérie."
 ALG_star_aviation_uav_production: "Fabrication de drones Star Aviation"
 ALG_star_aviation_uav_production_desc: "Star Aviation fabrique désormais à grande échelle des drones de conception algérienne."
 ALG_redmed_integrated_defense_systems: "Défense intégrée RedMed"
 ALG_redmed_integrated_defense_systems_desc: "RedMed Group a fusionné ses programmes UAV et missiles en un complexe d'armes avancées unifié."
 ALG_maghreb_defense_powerhouse: "Puissance de défense maghrébine"
 ALG_maghreb_defense_powerhouse_desc: "L'industrie de défense algérienne, menée par RedMed Group et Star Aviation, est la plus avancée d'Afrique du Nord."
 ALG_aerospace_training_program: "Programme de formation aérospatiale"
 ALG_aerospace_training_program_desc: "Un programme national produisant ingénieurs aérospatiaux et techniciens drones pour soutenir l'industrie de défense croissante de l'Algérie."
 ALG_combat_uav_program: "Programme de drones de combat"
 ALG_combat_uav_program_desc: "Le développement actif d'UAV armés accroît la capacité de frappe de l'armée de l'air algérienne."
 ALG_redmed_missile_division_idea: "Division de missiles RedMed"
 ALG_redmed_missile_division_idea_desc: "Le bras dédié au développement de missiles de RedMed Group bâtit la dissuasion stratégique de l'Algérie à partir de zéro."
 ALG_cruise_missile_development: "Développement de missiles de croisière"
 ALG_cruise_missile_development_desc: "Un programme actif de missiles de croisière donne à l'Algérie une capacité de frappe de précision à longue portée pour la première fois."
 ALG_precision_strike_capability: "Capacité de frappe de précision"
 ALG_precision_strike_capability_desc: "Des systèmes intégrés de missiles et d'UAV ont donné à l'Algérie une véritable capacité de frappe de précision."
 ALG_defense_export_industry: "Industrie d'exportation de défense"
 ALG_defense_export_industry_desc: "Les UAV et missiles algériens sont désormais disponibles à l'export. Chaque vente est à la fois un revenu et un levier diplomatique."
 ALG_redmed_group_concern: "Groupe RedMed"
 ALG_redmed_group_concern_desc: "Un conglomérat industriel algérien de premier plan aux racines dans la logistique pétrolière et gazière. RedMed Group est devenu le principal fabricant de défense d'Algérie, produisant UAV et systèmes de missiles pour les forces armées."
 ALG_star_aviation_concern: "Étoile Aviation"
 ALG_star_aviation_concern_desc: "Filiale aviation de RedMed Group. Fondée en 2001 avec un bilan de sécurité parfait, Star Aviation mène désormais les programmes nationaux aérospatiaux et de fabrication de drones de l'Algérie."
 ALG_arrest_opponents_started_tt: "Les forces de sécurité commencent les opérations d'arrestation..."
 ALG_surveillance_started_tt: "L'expansion du réseau de surveillance est en cours..."
 ALG_ban_parties_started_tt: "Les procédures juridiques d'interdiction des partis d'opposition ont commencé..."
 ALG_imf_loan_started_tt: "Les négociations de prêt du FMI sont en cours..."
 ALG_oil_licensing_started_tt: "Les négociations de licences pétrolières avec des compagnies étrangères ont commencé..."
 ALG_repay_imf_started_tt: "Le processus de remboursement du prêt FMI a commencé..."
 ALG_pardon_islamist_started_tt: "Les procédures de grâce pour les islamistes modérés ont commencé..."
 ALG_dialogue_started_tt: "Des sessions de dialogue national sont organisées..."
 ALG_reintegrate_fighters_started_tt: "Les programmes de réinsertion des anciens combattants démarrent..."
 ALG_arrest_opponents_complete_tt: "Les opérations d'arrestation sont conclues. L'opposition est affaiblie."
 ALG_surveillance_complete_tt: "Le réseau de surveillance est désormais pleinement opérationnel."
 ALG_ban_parties_complete_tt: "Les partis d'opposition ont été officiellement interdits."
 ALG_imf_loan_complete_tt: "Les fonds du prêt FMI ont été reçus."
 ALG_oil_licensing_complete_tt: "Les accords de licences pétrolières sont désormais en vigueur."
 ALG_repay_imf_complete_tt: "Le prêt FMI a été entièrement remboursé."
 ALG_pardon_islamist_complete_tt: "Des grâces ont été émises. La réconciliation politique avance."
 ALG_dialogue_complete_tt: "Le dialogue national s'est conclu avec succès."
 ALG_reintegrate_fighters_complete_tt: "Les anciens combattants ont été réintégrés avec succès."
 ALG_fis_return_threat: "Retour du Front islamique du salut en Algérie"
 ALG_fis_return_western_concern: "Alarmé par le gouvernement salafiste en Algérie"
 ALG_fis_return_salafi_solidarity: "Soutient le gouvernement salafiste en Algérie"
 ALG_fis_return_islamist_sympathy: "Accueille prudemment le gouvernement islamiste en Algérie"
 ALG_fis_return_neighbor_alarm: "Alarmé par la prise de pouvoir islamiste en Algérie"
 ALG_fis_return_anti_political_islam: "S'oppose à l'islam politique en Algérie"
 ALG_world_tension_security_ended_tt: "Les mesures de sécurité ont été levées."
 ALG_world_tension_high_security_ended_tt: "L'alerte de haute sécurité a pris fin."
 ALG_crackdown_momentum_ended_tt: "L'élan de répression s'est essoufflé."
 ALG_reconciliation_momentum_ended_tt: "L'élan de réconciliation s'est estompé."
 ALG_by_the_people_for_the_people: "Par le peuple, pour le peuple"
 ALG_by_the_people_for_the_people_desc: "Le mouvement Hirak a ébranlé l'Algérie jusqu'au cœur. Le peuple exige une transformation complète du système politique, non un simple changement de visages, mais une restructuration fondamentale du pouvoir. La vieille garde ne partira pas sans résistance."
 ALG_by_the_people_for_the_people_tt: "Le §Ymouvement Hirak§! doit avoir un élan suffisant (équilibre du pouvoir au-dessus de §G70 %§!)."
 ALG_break_the_oligarchs: "Briser les oligarques"
 ALG_break_the_oligarchs_desc: "Le réseau d'hommes d'affaires qui ont profité de leur proximité avec le régime doit être démantelé. Leurs actifs seront saisis, leurs contrats revus, et leur influence sur l'État définitivement terminée."
 ALG_dismantle_le_pouvoir: "Démanteler Le Pouvoir"
 ALG_dismantle_le_pouvoir_desc: "L'État de l'ombre — les généraux, les services de renseignement, la main invisible qui guide l'Algérie depuis l'indépendance — doit être amené à la lumière et dépouillé de son autorité."
 ALG_new_economic_model: "Un nouveau modèle économique"
 ALG_new_economic_model_desc: "Les oligarques écartés, l'Algérie a besoin d'une nouvelle vision économique. Le modèle d'État rentier est mort. À sa place, une économie diversifiée bâtie sur l'industrie, la technologie et le capital humain."
 ALG_unleash_civil_society: "Libérer la société civile"
 ALG_unleash_civil_society_desc: "Une presse libre, des syndicats indépendants et des partis politiques qui représentent de vraies circonscriptions : voilà les fondements sur lesquels se bâtit la démocratie."
 ALG_constitutional_convention: "Convention constitutionnelle"
 ALG_constitutional_convention_desc: "Des représentants de toute l'Algérie se réunissent pour rédiger une nouvelle constitution. Pour la première fois, le document sera écrit par le peuple, non imposé par les puissants."
 ALG_presidential_republic: "République présidentielle"
 ALG_presidential_republic_desc: "L'Algérie adoptera un système présidentiel avec un exécutif fort, une autorité claire et une responsabilité démocratique. Le président gouverne avec fermeté tandis que des garde-fous constitutionnels empêchent l'abus de pouvoir."
 ALG_parliamentary_republic: "République parlementaire"
 ALG_parliamentary_republic_desc: "L'Algérie adoptera un système parlementaire où le pouvoir est partagé entre représentants élus. La construction de coalitions et le consensus assurent qu'aucun individu ne puisse plus dominer l'État."
 ALG_civilian_military_control: "Contrôle civil de l'armée"
 ALG_civilian_military_control_desc: "L'armée doit servir l'État, non le gouverner. Des officiers professionnels remplacent les généraux politiques. L'armée est modernisée, dépolitisée et placée fermement sous autorité civile."
 ALG_democratic_dividend: "Le dividende démocratique"
 ALG_democratic_dividend_desc: "Une Algérie transparente et démocratique attire l'investissement étranger, les partenariats internationaux et le retour de la diaspora. L'économie se diversifie au-delà des hydrocarbures tandis que le monde s'en aperçoit."
 ALG_a_new_algeria: "Une nouvelle Algérie"
 ALG_a_new_algeria_desc: "Des cendres de l'ancien régime, une nouvelle nation émerge. Les réseaux de corruption sont démantelés. La fuite des cerveaux s'inverse. L'Algérie se dresse comme preuve qu'une vraie démocratie peut se bâtir par la volonté de son propre peuple."
 ALG_transitional_instability: "Instabilité transitionnelle"
 ALG_transitional_instability_desc: "L'effondrement de l'ancien ordre a laissé un vide de pouvoir. Les institutions sont faibles, l'économie perturbée, et les forces politiques rivalisent pour façonner l'avenir."
 ALG_economic_disruption: "Perturbation économique"
 ALG_economic_disruption_desc: "La saisie des actifs oligarchiques et la restructuration des contrats corrompus ont temporairement perturbé l'activité économique."
 ALG_free_press_and_assembly: "Presse et assemblage gratuits"
 ALG_free_press_and_assembly_desc: "Des journaux indépendants publient sans crainte. Les citoyens s'organisent librement. La place publique appartient au peuple."
 ALG_diversified_economy: "Économie diversifiée"
 ALG_diversified_economy_desc: "L'économie algérienne passe de la dépendance pétrolière vers l'industrie, la technologie et le développement durable."
 ALG_new_constitution_permanent: "La Constitution du peuple"
 ALG_new_constitution_permanent_desc: "Rédigée par des délégués élus et ratifiée par référendum populaire, la nouvelle constitution algérienne consacre les droits démocratiques, la séparation des pouvoirs et l'État de droit."
 ALG_presidential_system: "Système présidentiel"
 ALG_presidential_system_desc: "Un exécutif fort, à l'autorité claire et à la responsabilité démocratique, gouverne l'Algérie avec fermeté."
 ALG_parliamentary_system: "Système parlementaire"
 ALG_parliamentary_system_desc: "Un système délibératif où les représentants élus débattent, négocient et bâtissent le consensus. Le pouvoir est partagé entre partis et coalitions."
 ALG_professional_military: "Forces armées professionnelles"
 ALG_professional_military_desc: "Dépolitisée, modernisée et sous commandement civil. L'armée algérienne sert la nation plutôt que de la contrôler."
 ALG_foreign_investment_boom: "Boom des investissements étrangers"
 ALG_foreign_investment_boom_desc: "Les capitaux internationaux affluent vers l'Algérie démocratique. Une gouvernance transparente et l'État de droit font du pays une destination attractive pour l'investissement."
 ALG_beacon_of_democracy: "Phare de la démocratie"
 ALG_beacon_of_democracy_desc: "L'Algérie se dresse comme preuve vivante qu'une vraie transformation démocratique est possible. La nation inspire des mouvements à travers la région et attire l'admiration mondiale."
 ALG_the_nation_stands_at_a_crossroads_desc: "L'Algérie sort de la décennie noire meurtrie. Plus de 200 000 morts, des villages entiers rasés, une économie vidée par la guerre civile. Le président Bouteflika a misé son mandat sur la Concorde civile, offrant l'amnistie aux militants et promettant la réforme. Mais derrière lui se tient le Pouvoir, le réseau d'ombre des généraux et des officiers de renseignement qui dirigent l'Algérie depuis l'indépendance. La voie à suivre appartiendra à qui contrôlera la suite."
 ALG_counterterrorism_agency_desc: "Le Département du renseignement et de la sécurité (DRS) a été reconstruit à partir des restes de l'ancienne Sécurité militaire (SM) après la guerre civile. Opérant avec une quasi-totale autonomie vis-à-vis du contrôle civil, le DRS est devenu l'institution la plus puissante d'Algérie, plus redoutée que la présidence elle-même."
 ALG_investments_in_iraq: "Amitié irakienne"
 ALG_investments_in_iraq_desc: "Malgré des liens moins qu'idéaux avec l'Irak par le passé, il vaut mieux se rapprocher. Nous pouvons investir dans les infrastructures irakiennes et gagner leur confiance"
 ALG_diplo: "Diplomatie MSP"
 ALG_diplo_desc: "Nous devons réformer notre diplomatie conformément à notre nouveau gouvernement."
 ALG_balance_islamists_and_secularists: "Équilibrer islamistes et laïcs"
 ALG_balance_islamists_and_secularists_desc: "Un équilibre fragile doit être maintenu entre mouvements religieux et élites laïques ; l'échec risque un nouveau conflit."
 ALG_new_constutition_reforms: "Réformes constitutionnelles"
 ALG_new_constutition_reforms_desc: "Les demandes de réforme ne peuvent être ignorées indéfiniment. Une nouvelle constitution pourra ouvrir la voie à une gouvernance plus pluraliste."
 ALG_denounce_previous_colonialist_regimes: "Dénoncer la loi française sur le colonialisme"
 ALG_denounce_previous_colonialist_regimes_desc: "La loi française controversée glorifiant son passé colonial a provoqué l'indignation. Le FLN doit mener la charge pour dénoncer les crimes colonialistes et réaffirmer la lutte anticoloniale de l'Algérie."
 ALG_share_power: "Partager le pouvoir"
 ALG_share_power_desc: "Plutôt que de gouverner seul, le FLN peut prudemment partager le pouvoir avec certaines forces d'opposition et technocratiques. Cela pourra préserver la stabilité tout en réduisant la colère populaire contre le régime."
 ALG_legacy_revolution: "FLN"
 ALG_legacy_revolution_desc: "Le Front de libération nationale est un parti nationaliste algérien. Il a été le seul parti légal jusqu'en 1989, gouvernant l'Algérie en régime de parti unique. Après la guerre civile algérienne, il a repris le pouvoir en 2002 comme parti le plus populaire et l'est resté depuis. Son idéologie suit un nationalisme panarabe dont l'anticolonialisme est la valeur originelle. Il soutient le socialisme, mais particulièrement le socialisme arabe, s'opposant aux idées marxistes."
 ALG_devlop_industry: "Développer l'industrie nationale"
 ALG_devlop_industry_desc: "L'avenir de l'Algérie dépend du renforcement de sa base industrielle. En nous concentrant sur le développement de secteurs clés comme l'industrie, l'énergie et la technologie, nous pourrons réduire la dépendance aux importations et bâtir une économie autosuffisante."
 ALG_expand_hydro: "Étendre l'infrastructure hydroélectrique"
 ALG_expand_hydro_desc: "Pour soutenir la demande énergétique croissante de notre nation et réduire la dépendance aux ressources étrangères, nous devons investir dans l'extension de l'hydroélectricité. Exploiter nos cours d'eau fournira une énergie propre, renforcera notre base industrielle et améliorera le quotidien de nos citoyens."
 ALG_optimize_water_management: "Optimiser la gestion de l'eau"
 ALG_optimize_water_management_desc: "Pour lutter contre la rareté de l'eau et améliorer la production agricole, nous devons mettre en œuvre des systèmes modernes de gestion de l'eau. Une distribution et une conservation efficaces soutiendront les communautés rurales comme les centres urbains en croissance, tout en rendant nos terres plus résilientes à la sécheresse."
 ALG_hydroelectric_authority: "Autorité hydroélectrique nationale"
 ALG_hydroelectric_authority_desc: "En établissant une autorité hydroélectrique centralisée, nous pourrons développer de façon systématique les ressources hydriques inexploitées de l'Algérie. Cela fournira une électricité fiable pour l'industrialisation tout en créant des emplois et une expertise technique dans les énergies renouvelables."
 ALG_electrify_rural_algeria: "Électrifier l’Algérie rurale"
 ALG_electrify_rural_algeria_desc: "Apporter l'électricité aux campagnes algériennes est essentiel au développement moderne. Par l'extension du réseau et des projets hydroélectriques locaux, nous pourrons améliorer le niveau de vie, permettre une agriculture mécanisée et relier les communautés isolées au progrès national."
 ALG_foreign_investment: "Attirer les investissements étrangers"
 ALG_foreign_investment_desc: "Pour accélérer notre développement économique, nous devons créer des conditions favorables au capital international. Des partenariats stratégiques dans les infrastructures et l'énergie apporteront financement et savoir-faire tout en maintenant la souveraineté nationale."
 ALG_algeria_islamic: "MSP"
 ALG_algeria_islamic_desc: "Le Mouvement de la société pour la paix est un parti politique algérien de droite à extrême droite. Il a été fondé en 1990 par les Frères musulmans, auxquels il reste aligné. Il est islamiste sunnite et suit une démocratie islamique conservatrice. Son plus grand succès fut aux législatives de 1997, deuxième parti avec 69 sièges sur 380. Il s'est présenté une fois à la présidentielle en 1995, obtenant 25,6 % des voix. Il est entré dans une coalition électorale avec le MRN et le MRI en 2012. Le parti est aussi connu sous le nom de « Hamas », abréviation de son nom arabe « Harakat mujtama' as-silm »."
 ALG_algerian_islamic_movement: "Mouvement islamique algérien"
 ALG_algerian_islamic_movement_desc: "Le mouvement islamique, en bref, était un mouvement islamiste en Turquie, très populaire parmi les étudiants, prônant une vision pacifiste et moderne de l'islam. Nous nous inspirerons de leurs enseignements et réformerons nos programmes scolaires pour promouvoir les valeurs islamiques, les enseigner aux élèves et améliorer l'éducation dans son ensemble."
 ALG_nationwide_security_presence_desc: "Les forces de sécurité sont mobilisées à l'échelle nationale dans le cadre de l'opération Faucon du désert pour décourager les manifestations du Hirak. Efficace pour dissuader les protestations, cette mesure accroît les coûts et sape la confiance du public."
 algerian_events.300.t: "Troubles croissants"
 algerian_events.300.d: "Des rapports de manifestations sporadiques et de désobéissance civile affluent de tout le pays. La frustration publique face à la corruption, au chômage et à l'absence de réforme politique atteint le point d'ébullition. Pour l'heure, les manifestations restent dispersées, mais elles pourraient facilement dégénérer en quelque chose de bien plus vaste."
 algerian_events.300.a: "Cela passera."
 algerian_events.300.b: "Cela pourrait dégénérer."
 algerian_events.230.t: "Des manifestations massives balayent l’Algérie"
 algerian_events.230.d: "L'Algérie a été ébranlée par des manifestations massives et soutenues exigeant une réforme politique et la fin de l'establishment dirigeant. Des centaines de milliers de personnes ont descendu dans les rues des villes à travers le pays dans ce que l'on appelle un nouveau mouvement Hirak. La communauté internationale observe de près l'évolution de la situation."
 algerian_events.230.a: "Un moment décisif pour l'Algérie."
 ALG_deepen_african_union: "Approfondir la coopération de l’Union africaine"
 ALG_deepen_african_union_desc: "L'Algérie a longtemps été l'un des piliers de la diplomatie africaine. En renforçant activement notre rôle au sein de l'Union africaine, nous pourrons améliorer notre influence sur le continent, favoriser la solidarité et faire avancer des initiatives de paix et d'intégration économique. Cela nous coûtera financièrement, mais renforcera notre légitimité en Afrique."
 ALG_strengthen_maghreb_union: "Renforcer l'Union du Maghreb"
 ALG_strengthen_maghreb_union_desc: "Le rêve d'intégration régionale en Afrique du Nord est resté insaisissable, mais l'Algérie a le potentiel de le relancer. En favorisant la coopération avec nos voisins maghrébins, nous pourrons réduire les barrières commerciales, améliorer la confiance diplomatique et renforcer nos liens culturels et historiques partagés."
 ALG_restoration_of_the_ummah: "Restauration de l'Oumma"
 ALG_restoration_of_the_ummah_desc: "La vision d'un monde islamique uni est à portée. Les fidèles se lèveront à nouveau sous une seule bannière."
 ALG_guidance_council: "Le conseil de guidage"
 ALG_guidance_council_desc: "Un conseil de savants seniors supervisera nos politiques et assurera que le gouvernement reste fidèle au guidage divin."
 ALG_restore_the_ummah_experiment: "L'expérience de l'Oumma"
 ALG_restore_the_ummah_experiment_desc: "Nous tenterons de créer un nouveau modèle de gouvernance, mêlant foi, droit et leadership pour inspirer le monde musulman."
 ALG_victory_of_the_faithful: "Victoire des fidèles"
 ALG_victory_of_the_faithful_desc: "Notre persévérance et notre dévotion ont apporté la victoire. L'Algérie se dressera désormais comme bastion des fidèles à travers le monde."
 ALG_exterminate_corruption: "Éradiquer la corruption"
 ALG_exterminate_corruption_desc: "Nous purgerons la corruption de chaque institution. Nul fonctionnaire, nul soldat, nul clerc ne sera au-dessus de la justice divine."
 ALG_to_serve_allah: "Servir Allah"
 ALG_to_serve_allah_desc: "Notre règne n'est pas pour l'ambition mondaine, mais pour Allah seul. Chaque politique, chaque réforme et chaque lutte doit refléter la soumission à Sa volonté divine. Servir Allah, c'est purifier la nation et l'âme."
 ALG_economic_islamization: "Islamisation économique"
 ALG_economic_islamization_desc: "Nous reconstruirons notre économie sur des fondements islamiques. Les systèmes fondés sur l'intérêt et la corruption seront remplacés par une finance conforme à la charia, une éthique commerciale et une répartition équitable de la richesse."
 ALG_rust_belt_rejuvenation_desc: "Les usines abandonnées pendant les années de troubles rugiront à nouveau. Nos ouvriers, guidés par la foi et le dessein, reconstruiront les terres industrielles de l'Algérie."
 ALG_rule_to_perfection_desc: "Notre gouvernance doit être affinée et perfectionnée. Le califat de l'esprit, l'État de l'âme : la perfection administrative par la discipline divine."
 ALG_new_islamic_architecture_desc: "Une nouvelle ère exige un nouveau visage pour notre nation. Par mosquées, écoles et bâtiments civiques, la beauté de l'art islamique symbolisera la renaissance de l'Algérie."
 ALG_prioritize_military_industries_desc: "Une armée fidèle doit être armée par une industrie fidèle. Nous prioriserons la production militaire, assurant que notre défense repose sur la force nationale."
 ALG_industrialize_the_umma_desc: "L'industrie servira l'islam, non la cupidité. L'Oumma doit devenir autosuffisante, productive et fière : une civilisation alimentée par l'acier et la foi."
 ALG_militarize_the_nation: "Militariser la nation"
 ALG_militarize_the_nation_desc: "Chaque croyant doit être prêt à défendre l'Oumma. Nous préparerons notre société à la mobilisation totale sous le commandement divin."
 ALG_soldiers_of_faith: "Soldats de la foi"
 ALG_soldiers_of_faith_desc: "Nos soldats ne combattent ni pour la terre ni pour le pouvoir, mais pour la foi elle-même. L'armée de la foi sera le bouclier de l'islam et l'épée de la nation."
 ALG_forged_in_belief: "Forgés dans la foi"
 ALG_forged_in_belief_desc: "La foi est notre acier, inébranlable, inflexible. Les soldats d'Algérie sont forgés dans la croyance et guidés par la conviction divine."
 ALG_disciplined_army_of_god: "Armée de Dieu disciplinée"
 ALG_disciplined_army_of_god_desc: "Nous forgerons une armée bâtie sur l'obéissance, la pureté et une dévotion inébranlable. Chaque soldat est à la fois guerrier et serviteur de Dieu."
 ALG_made_of_steel_and_faith: "Faits d'acier et de foi"
 ALG_made_of_steel_and_faith_desc: "Nos légions marcheront avec la force du fer et la foi des prophètes. Discipline et croyance fusionneront en une force inébranlable."
 ALG_unrestricted_research: "Recherche sans restriction"
 ALG_unrestricted_research_desc: "La science n'est pas l'ennemie de la foi. Guidés par un dessein divin, nous embrasserons la recherche moderne pour avancer nos capacités militaires et technologiques."
 ALG_ai_military_integration: "Intégration militaire de l'IA"
 ALG_ai_military_integration_desc: "L'intelligence artificielle et l'automatisation deviendront des outils au service de l'ordre divin. Nous intégrerons ces systèmes à notre structure de défense pour accroître précision et contrôle."
 ALG_new_executors_continent: "Nouveaux exécuteurs du continent"
 ALG_new_executors_continent_desc: "L'Algérie est prête à faire appliquer la justice divine à travers l'Afrique. Notre foi et notre acier façonneront le destin du continent."
 ALG_the_future_in_the_present: "L'avenir dans le présent"
 ALG_the_future_in_the_present_desc: "L'avenir est déjà là, guidé par la sagesse d'Allah et fortifié par l'innovation humaine. Notre nation mènera les fidèles dans un nouvel âge."
 ALG_destroy_their_will: "Détruire leur volonté"
 ALG_destroy_their_will_desc: "Nous écraserons tous ceux qui s'opposent à la foi, dans l'esprit, dans la volonté et dans le corps. La résistance sera brisée, et l'ordre divin prévaudra."
 ALG_declare_jihad: "Proclamer le djihad"
 ALG_declare_jihad_desc: "Notre mouvement a mûri. Nous ne nous limiterons plus aux sermons et aux réformes. L'heure est venue d'unir les fidèles sous les armes, de déclarer un djihad contre la corruption et la tyrannie à travers les terres de l'islam."
 ALG_tharir_al_aqsa: "Tahrir al-Aqsa"
 ALG_tharir_al_aqsa_desc: "La libération d'Al-Aqsa est le devoir éternel de l'Oumma. Nous rassemblerons les fidèles à travers le Moyen-Orient, forgeant une alliance sacrée sous une seule bannière de résistance et d'unité."
 ALG_faction_with_middle_east: "S'unir au front moyen-oriental"
 ALG_faction_with_middle_east_desc: "Le Moyen-Orient demeure le cœur spirituel de l'islam. De Damas à La Mecque, notre appel retentira, unissant les nations sunnites qui brûlent de défendre Al-Aqsa et de résister aux oppresseurs."
 ALG_faction_with_north_africa: "S'unir au front nord-africain"
 ALG_faction_with_north_africa_desc: "Nos frères d'Afrique du Nord, des déserts de Libye aux rues du Caire, ont enduré les mêmes luttes. Il est temps de tendre la main et de les inviter à notre cause."
 ALG_faction_with_asia: "S'unir au front oriental"
 ALG_faction_with_asia_desc: "La lumière de l'islam brille au-delà de l'Arabie. Les peuples d'Asie centrale et du Sud doivent être appelés à rejoindre le soulèvement de l'Oumma, des steppes aux îles de l'Est."
 ALG_faction.1.t: "Une invitation d'Alger"
 ALG_faction.1.d: "Un communiqué diplomatique d'Alger a atteint notre gouvernement. Le Front islamique du salut, désormais au pouvoir en Algérie, invite les nations du Moyen-Orient à rejoindre une nouvelle coalition, le Front de libération d'al-Aqsa, dédié à coordonner le soutien politique et matériel à la défense et à la libération d'al-Aqsa. Accepter nous lierait à une cause régionale ; refuser nous tiendrait à l'écart du projet algérien. Comment répondre ?"
 ALG_faction.1.a: "Accepter, rejoindre le Front de libération d'al-Aqsa"
 ALG_faction.1.b: "Décliner, nous ne rejoindrons pas cette coalition régionale"
 ALG_faction.2.t: "Une proposition du Maghreb"
 ALG_faction.2.d: "Des délégations d'Algérie ont formellement invité les gouvernements nord-africains à s'engager dans une nouvelle coalition, le Front de libération d'al-Aqsa. La proposition vise un front maghrébin pour coordonner pression politique et soutien humanitaire à la Palestine. Rejoindre approfondirait les liens avec Alger ; décliner préserverait notre autonomie actuelle. Que répondons-nous ?"
 ALG_faction.2.a: "Oui, le Maghreb se tiendra uni"
 ALG_faction.2.b: "Non, ce n'est pas un chemin que nous prendrons"
 ALG_faction.3.t: "Un appel d'Alger vers l'Est"
 ALG_faction.3.d: "Des envoyés algériens ont contacté des nations musulmanes d'Asie avec une offre : rejoindre le Front de libération d'al-Aqsa, une coalition visant à coordonner les efforts diplomatiques, politiques et matériels pour la défense d'al-Aqsa. L'initiative demande une solidarité transrégionale ; elle risque aussi l'enlisement dans des conflits plus vastes. Rejoindrons-nous la coalition d'Alger ?"
 ALG_faction.3.a: "Rejoindre, nous répondons à l'appel de la solidarité"
 ALG_faction.3.b: "Refuser, nous devons éviter cet enlisement"
 ALG_islamic_offices: "Créer des bureaux islamiques"
 ALG_islamic_offices_desc: "Pour gouverner selon les principes de l'islam, notre mouvement doit bâtir une structure organisée capable de gérer foi et État. En établissant des bureaux islamiques à travers le pays, nous superviserons l'éducation religieuse, les affaires sociales et le guidage moral, assurant que la gouvernance s'aligne sur les valeurs de l'Oumma. Ces bureaux seront l'ossature de notre nouvel ordre, unissant le peuple sous la foi, la discipline et la justice."
 ALG_integrate_kabylie_tt: "§GIntégrer la Kabylie sereinement§!"
 ALG_improve_relations_with_egypt: "Améliorer les relations avec l'Égypte"
 ALG_improve_relations_with_egypt_desc: "L'Égypte et l'Algérie partagent des liens profonds en tant que nations arabes de premier plan. Le MSP, aux racines dans la tradition des Frères musulmans, voit Le Caire comme un partenaire naturel. Renforcer les relations avec l'Égypte rehaussera notre standing dans le monde arabe et ouvrira des portes à la coopération économique et religieuse."
 ALG_el_karaouin_uni: "L'université Al-Qarawiyyin"
 ALG_el_karaouin_uni_desc: "En établissant des liens avec l'une des plus anciennes universités islamiques du monde, le FIS cultivera une génération de savants loyaux au nouvel ordre, éloignant l'armée de l'autorité religieuse."
 ALG_father_of_the_ummah: "Père de l'Oumma"
 ALG_father_of_the_ummah_desc: "Le dirigeant du Front islamique du salut se positionnera comme père spirituel de toute la communauté musulmane, cultivant un culte de la personnalité ancré dans la piété et le mandat divin."
 ALG_followers_of_the_prophet: "Suiveurs du Prophète"
 ALG_followers_of_the_prophet_desc: "L'État sera remodelé autour d'une adhésion stricte à la Sunna. Les citoyens sont censés vivre comme le Prophète, et les institutions gouvernementales seront restructurées pour refléter cette vision."
 ALG_governmental_cleansing: "Nettoyage gouvernemental"
 ALG_governmental_cleansing_desc: "Ceux au sein de l'appareil d'État jugés insuffisamment dévots ou idéologiquement impurs seront systématiquement écartés et remplacés par des adhérents loyaux du mouvement."
 ALG_make_our_nation_pure: "Rendre notre nation pure"
 ALG_make_our_nation_pure_desc: "Le FIS lancera une vaste campagne sociale pour purger l'influence occidentale de la société algérienne, imposant les valeurs islamiques dans l'éducation, le vêtement et le comportement public."
 ALG_new_patriotism: "Un nouveau patriotisme"
 ALG_new_patriotism_desc: "L'amour de l'Algérie et l'amour de l'islam ne font qu'un. Le FIS forgera une nouvelle identité nationale où la foi est le fondement de la fierté civique et du dessein collectif."
 ALG_restore_the_soul_of_the_ummah: "Restaurer l'âme de l'Oumma"
 ALG_restore_the_soul_of_the_ummah_desc: "L'Algérie prendra sur elle le devoir sacré de ranimer la flamme spirituelle du monde musulman, positionnant l'État comme boussole morale de toutes les nations islamiques."
 ALG_sharia_through_discipline: "La charia par la discipline"
 ALG_sharia_through_discipline_desc: "La charia sera appliquée non par la persuasion mais par une discipline ferme. L'État étendra ses pouvoirs de police et de châtiment pour assurer le plein respect de la loi islamique."
 ALG_strength_and_virtue: "Force et vertu"
 ALG_strength_and_virtue_desc: "Un État fort et un peuple vertueux sont inséparables. Le FIS investira à la fois dans l'éducation morale et la discipline institutionnelle pour bâtir une société droite de caractère et ferme de résolution."
 ALG_strict_authority: "Autorité stricte"
 ALG_strict_authority_desc: "La nouvelle Algérie exige une main ferme. Le FIS centralisera le pouvoir et accroîtra le budget de la police, assurant que la population adhère aux normes de conduite du mouvement."
 ALG_the_people_are_not_to_be_trusted: "Le peuple n'est pas digne de confiance"
 ALG_the_people_are_not_to_be_trusted_desc: "La démocratie s'est révélée une porte ouverte à la corruption et à l'impiété. Le FIS démantèlera le processus démocratique et placera fermement la gouvernance entre les mains de ceux qui savent ce qu'Allah exige."
 ALG_urban_preachers: "Prédicateurs urbains"
 ALG_urban_preachers_desc: "Le FIS enverra un réseau de prédicateurs dans les villes d'Algérie, répandant l'idéologie du mouvement et cimentant l'islam d'État comme force dominante de la vie publique."
 ALG_jamiat_al_karaouin_desc: "Les liens avec l'ancienne institution Al-Qarawiyyin ont produit une nouvelle classe de savants islamiques loyaux à l'État FIS et hostiles à l'ingérence militaire dans les affaires religieuses."
 ALG_coalition_economic_program: "Programme économique de coalition"
 ALG_coalition_economic_program_desc: "La coalition présidentielle doit présenter une vision économique unie. En coordonnant les politiques économiques de nos partenaires de coalition, nous pouvons attirer l'investissement, soutenir les petites entreprises et poser les bases d'une croissance durable. Une économie forte légitimera la coalition et fera taire nos critiques."
 ALG_governmental_transparency: "Transparence gouvernementale"
 ALG_governmental_transparency_desc: "Si notre voie démocratique doit signifier quelque chose, nous devons nous tenir à un standard plus élevé que ceux qui nous ont précédés. En mettant en œuvre des mesures de transparence et en ouvrant les archives gouvernementales à l'examen public, nous pouvons extirper la corruption et restaurer la foi du peuple dans ses institutions, même si cela signifie se faire des ennemis parmi la vieille garde."
 ALG_support_mujahideen: "Soutenir les moudjahidines"
 ALG_support_mujahideen_desc: "Des éléments au sein de l'État plaident pour un soutien clandestin aux combattants islamistes opérant à travers la région. Si de telles actions peuvent renforcer notre influence parmi les réseaux radicaux et déstabiliser des acteurs hostiles, elles risquent un grave retour de bâton international et des conséquences intérieures de long terme."
