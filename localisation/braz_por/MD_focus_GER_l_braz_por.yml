 GER_panavia.1.t: "Reativar a Produção do Tornado?"
 GER_panavia.1.d: "Embora a linha de produção original do Tornado tenha sido encerrada em 1998, o cenário estratégico em mudança reacendeu o interesse pela aeronave. Com perfis de missão em evolução, demandas operacionais crescentes e dúvidas cada vez maiores sobre os prazos das plataformas mais novas, surgiu uma proposta para retomar a produção do Tornado.\n\nOs defensores argumentam que uma linha reativada poderia modernizar o projeto com nova aviônica e armamentos, oferecendo uma solução provisória de confiabilidade conhecida. Os críticos alertam que reviver uma célula com décadas de idade poderia drenar recursos de sistemas mais preparados para o futuro."
 GER_panavia.1.a: "Retomar a produção do Tornado com atualizações"
 GER_panavia.1.b: "Deixar o Tornado aposentado"
 GER_panavia.2.t: "Uma Iniciativa Europeia Stealth?"
 GER_panavia.2.d: "Com a mudança global rumo às aeronaves de quinta geração e às doutrinas baseadas em furtividade, vozes dentro do setor de defesa defendem uma resposta europeia unificada. Em vez de depender de plataformas estrangeiras, poderíamos aproveitar a rede Panavia e nossa base industrial existente para iniciar um projeto de desenvolvimento voltado à furtividade.\n\nUm programa assim fortaleceria a soberania de defesa europeia, manteria a competitividade aeroespacial e ofereceria uma alternativa de longo prazo aos projetos americanos ou asiáticos. No entanto, exigiria grandes investimentos, coordenação entre fronteiras e compromisso de longo prazo, sem garantia de sucesso."
 GER_panavia.2.a: "Lançar o Projeto Stealth Europeu"
 GER_panavia.2.b: "Furtividade é cara demais, focar em outras coisas"
 GER_panavia.3.t: "Um Caça Europeu Mais Barato e Ágil?"
 GER_panavia.3.d: "Diante das restrições orçamentárias e dos requisitos de flexibilidade operacional, especialistas em defesa propuseram desenvolver um novo caça europeu mais leve. Essa aeronave priorizaria agilidade, versatilidade e custo acessível, voltada a policiamento aéreo, interceptação e funções de ataque tático.\n\nOs defensores argumentam que tal plataforma complementaria sistemas mais pesados como o Eurofighter e reduziria a dependência de caças leves estrangeiros. Os críticos alertam que pode drenar recursos de projetos stealth de nova geração ou levar à fragmentação da indústria de defesa europeia."
 GER_panavia.3.a: "Sim, desenvolver um caça multifunção europeu leve e ágil"
 GER_panavia.3.b: "Não, manter o foco nas plataformas existentes"
