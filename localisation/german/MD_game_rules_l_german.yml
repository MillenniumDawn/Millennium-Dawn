 RULE_ENABLE_DIVISION_LIMITER: "Aktiviere KI-Divionsbegrenzung"
 RULE_NO_ENABLE_DIVISION_LIMITER_DESC: "Deaktiviere die KI-Divisionsbegrenzung\n\nStandardmäßig wird die Anzahl der produzierbaren Einheiten der KI nicht begrenzt. Um die Performance durch eine Begrenzung der Divisionen zu verbessern, bitte aktivieren!"
 RULE_YES_ENABLE_DIVISION_LIMITER_DESC: "Aktivie KI-Divisionsbegrenzung\n\nWenn ich aktiviert bin, wird die KI weniger wahrscheinlich Einheiten produzieren, um ein effizienteres Spielerlebnis zu ermöglichen und dir als Spieler zu die Möglichkeit zu geben, in relativer Ruhe zu spielen!"
 RULE_OPTION_POTATO_EDITION: "Potato Edition"
 RULE_POTATO_EDITION_DIVISION_LIMITER_DESC: "Enabled Potato Edition AI Division Limiter\n\nEven further limits the AI for performance reasons.\n"
