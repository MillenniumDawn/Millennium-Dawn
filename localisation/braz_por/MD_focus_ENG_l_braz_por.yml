 ENG_auxiliary_navy1: "Marinha Auxiliar Real"
 ENG_auxiliary_navy1_desc: "O conceito de Marinha Real Auxiliar ressalta a importância do apoio civil às operações navais, destacando os esforços colaborativos entre pessoal militar e civil para garantir a eficácia e a prontidão da Marinha Real no cumprimento de suas responsabilidades marítimas."
 ENG_auxiliary_navy2: "Marinha Auxiliar Real"
 ENG_auxiliary_navy2_desc: "O conceito de Marinha Real Auxiliar ressalta a importância do apoio civil às operações navais, destacando os esforços colaborativos entre pessoal militar e civil para garantir a eficácia e a prontidão da Marinha Real no cumprimento de suas responsabilidades marítimas."
 ENG_royal_army1: "Exército Real Britânico"
 ENG_royal_army1_desc: "O Exército Britânico é o ramo de guerra terrestre das Forças Armadas Britânicas, servindo como principal força militar terrestre do Reino Unido. Com uma rica história que atravessa séculos, o Exército Britânico é reconhecido por seu profissionalismo, adaptabilidade e eficácia operacional. Composto por soldados altamente treinados de origens diversas, o Exército está equipado para realizar uma ampla gama de missões, incluindo operações de combate, missões de manutenção da paz, esforços de socorro em desastres e tarefas de assistência humanitária."
 ENG_royal_army2: "Exército Real Britânico"
 ENG_royal_army2_desc: "O Exército Britânico é o ramo de guerra terrestre das Forças Armadas Britânicas, servindo como principal força militar terrestre do Reino Unido. Com uma rica história que atravessa séculos, o Exército Britânico é reconhecido por seu profissionalismo, adaptabilidade e eficácia operacional. Composto por soldados altamente treinados de origens diversas, o Exército está equipado para realizar uma ampla gama de missões, incluindo operações de combate, missões de manutenção da paz, esforços de socorro em desastres e tarefas de assistência humanitária."
 ENG_royal_army3: "Exército Real Britânico"
 ENG_royal_army3_desc: "O Exército Britânico é o ramo de guerra terrestre das Forças Armadas Britânicas, servindo como a principal força militar terrestre do Reino Unido. Com uma rica história que atravessa séculos, o Exército Britânico é reconhecido por seu profissionalismo, adaptabilidade e eficácia operacional. Composto por soldados altamente treinados de origens diversas, o Exército está equipado para cumprir uma ampla gama de missões, incluindo operações de combate, missões de manutenção da paz, esforços de socorro a desastres e tarefas de assistência humanitária."
 ENG_royal_airforce1: "Os Fantasmas da Força Aérea Real"
 ENG_royal_airforce1_desc: "Apesar de sua história notável, a Força Aérea Real (RAF) defasada reflete uma era de equipamentos envelhecidos e capacidades limitadas. Prejudicado por aeronaves obsoletas e esforços de modernização insuficientes, este espírito nacional simboliza os desafios de manter a superioridade aérea com tecnologia ultrapassada. No entanto, em meio a essas limitações, o espírito do legado da RAF perdura, inspirando resiliência e determinação para se adaptar e superar."
 ENG_royal_airforce2: "Modernizando a Força Aérea Real"
 ENG_royal_airforce2_desc: "A Força Aérea Real em Modernização representa uma mudança estratégica rumo à revitalização das capacidades do poder aéreo por meio de amplos esforços de modernização. Com foco na atualização das aeronaves, no aprimoramento das capacidades tecnológicas e no investimento em sistemas de ponta, este espírito nacional reflete uma abordagem proativa para garantir que a RAF permaneça na vanguarda da superioridade aérea no campo de batalha em evolução."
 ENG_royal_airforce3: "Força Aérea Real Modernizada"
 ENG_royal_airforce3_desc: "Centrada na superioridade aérea e na resposta rápida, a Força Aérea Real Modernizada representa uma força formidável equipada com caças de ponta e capacidades de combate avançadas. Com caças ágeis capazes de dominar os céus e enfrentar adversários com velocidade e precisão incomparáveis, este espírito nacional exemplifica o compromisso da RAF em manter a superioridade aérea e defender os interesses nacionais com uma proeza aérea sem igual."
 ENG_royal_airforce4: "Força Aérea Real Modernizada"
 ENG_royal_airforce4_desc: "A Força Aérea Real Modernizada anuncia uma nova era de projeção estratégica do poder aéreo, caracterizada por bombardeiros de última geração e capacidade de ataque de precisão. Com bombardeiros avançados equipados para missões de longo alcance e munições guiadas de precisão, este espírito nacional ressalta a capacidade da RAF de realizar ataques aéreos decisivos e precisos contra alvos de alto valor, projetando poder e dissuadindo adversários com precisão sem paralelo."
 ENG_royal_airforce5: "Força Aérea Real Modernizada"
 ENG_royal_airforce5_desc: "A Força Aérea Real Modernizada anuncia uma nova era de projeção estratégica do poder aéreo, caracterizada por bombardeiros de última geração e capacidade de ataque de precisão. Com bombardeiros avançados equipados para missões de longo alcance e munições guiadas de precisão, este espírito nacional ressalta a capacidade da RAF de realizar ataques aéreos decisivos e precisos contra alvos de alto valor, projetando poder e dissuadindo adversários com precisão sem paralelo."
 ENG_airbus_expansion: "Expansão da Airbus"
 ENG_airbus_expansion_desc: "A Expansão da Airbus ressalta o compromisso da empresa com inovação, excelência e satisfação do cliente, ao mesmo tempo em que contribui para o desenvolvimento econômico, a geração de empregos e o avanço tecnológico na indústria aeroespacial britânica."
 ENG_homegrown_innovation: "Inovação Nacional"
 ENG_homegrown_innovation_desc: "A Inovação Nacional visa fomentar uma cultura de inovação e empreendedorismo nos setores aeroespacial e de aviação do Reino Unido."
 ENG_homegrown_innovation_us1: "Colaboração de Inovação da Força Aérea EUA-Reino Unido"
 ENG_homegrown_innovation_us1_desc: "Os EUA estão trabalhando com o Reino Unido para inovar a Força Aérea"
 ENG_joint_strike_fighter_project_US1: "Colaboração de Inovação da Força Aérea EUA-Reino Unido"
 ENG_joint_strike_fighter_project_US1_desc: "Os EUA estão trabalhando com o Reino Unido para inovar a Força Aérea"
 ENG_trans_atlantic_defence: "Defesa Transatlântica"
 ENG_harmony_doctrine_idea: "Doutrina da Harmonia"
 ENG_harmony_doctrine_idea_desc: "A Doutrina da Harmonia trata o equilíbrio ambiental como interesse nacional, alinhando a influência da Coroa em favor da gestão responsável da terra, da água e da resiliência climática. Ela empurra governo e indústria rumo à produção sustentável, à energia mais limpa e à conservação de longo prazo sem sacrificar a estabilidade. A Grã-Bretanha prosperará vivendo dentro de suas possibilidades, e o Palácio insistirá que a natureza faz parte da arte de governar."
 ENG_abolish_devolution_TT: "Reverteremos todas as políticas de Devolução!\n - Isso provocará um levante da [SCO.GetFlag] Escócia, do [WAS.GetFlag] País de Gales e da [NIR.GetFlag] Irlanda do Norte.\n - O sistema de Devolução ficará indisponível"
 ENG_annex_ireland_TT: "Poderemos transformar [IRE.GetFlag] §HIrlanda§! em território nuclear por meio de uma decisão!"
 ENG_still_can_TT: "§OAinda podemos formar a Federação da Commonwealth se os tornarmos fantoches por outros meios!§!"
 ENG_declares_commonwealth_federation_TT: "Declarará a §HFederação da Commonwealth§!\n - §Hanexaremos§! e tornaremos §Hnúcleo§! os principais súditos da Commonwealth\n- A bandeira e o nome do nosso país mudarão"
