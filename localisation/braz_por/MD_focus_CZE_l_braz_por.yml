 CZE_vop_cz_category: "VOP CZ"
 CZE_vop_cz_category_desc: "A VOP CZ é uma empresa estatal que executa ordens para o Exército da República Tcheca. Ela conduz pesquisas sobre melhoria de tecnologias militares e projetos que visam melhorar a segurança do país. Seu centro de desenvolvimento ajuda tanto o setor militar quanto o civil.\n\n§GSlots de tecnologia Škoda§! disponível: §Y[?THIS.CZE_skoda_tech_slots]§!"
 CZE_quick_modernization: "Modernização rápida"
 CZE_quick_modernization_desc: "Podemos aumentar a produtividade de nossas fábricas temporariamente, mas depois teremos que compensar os recursos e a energia perdidos."
 CZE_research_grants_utility: "Bolsas de Pesquisa - §OUtilitário§!"
 CZE_research_grants_czech: "Bolsas de Pesquisa - §GTecnologia Tcheca§!"
 CZE_research_grants_mbt: "Bolsas de Pesquisa - §RMBT§!"
 CZE_research_grants_combined: "Bolsas de Pesquisa - §BCombinado§!"
 CZE_skoda_laboratories_category: "Laboratórios Škoda"
 CZE_skoda_laboratories_category_desc: "Os laboratórios e as preocupações industriais da Škoda nos permitem financiar conjuntamente pesquisas para melhorar nossas máquinas. Quando a Škoda implementar novas soluções em seus carros, nos concentraremos em fortalecer o exército. A pesquisa levará algum tempo, mas o que não for feito para aumentar o poder de nossa are- ekhem conveniência de nossos cidadãos.\n\n§GSlots de tecnologia Škoda§! disponível: §Y[?THIS.CZE_skoda_tech_slots]§!\n§GAtualizações Škoda§! feito: §Y[?THIS.CZE_skoda_tech_progress]/130§!\n§GAtualizações avançadas do Škoda§! feito: §Y[?THIS.CZE_advanced_skoda_tech_progress]/3§!"
 CZE_change_fuel_injectors: "Trocar injetores de combustível"
 CZE_stronger_chassis: "Chassi mais forte"
 CZE_long_lasting_tires: "Pneus de longa duração"
 CZE_simplify_our_manuals: "Simplifique nossos manuais"
 CZE_invest_in_cheaper_and_better_modules: "Invista em módulos melhores e mais baratos"
 CZE_adaptation_to_every_kind_of_weather: "Adaptação a todos os tipos de clima"
 CZE_setellite_communication_systems: "Sistemas de comunicação via satélite"
 CZE_meb_battery_system: "Sistema de bateria MEB"
 CZE_skoda_superb_cars_export_category: "Produção e exportação de carros Škoda Superb"
 CZE_skoda_superb_cars_export_category_desc: "Usando nossas próprias fábricas, somos capazes de produzir carros Superb nós mesmos. Com a filiação ao Grupo Volkswagen, podemos obter lucros menores de países parceiros, mas sua demanda diminuirá mais lentamente. De países com demanda particularmente alta, podemos obter um pouco mais de lucro.\n\nFábricas da Škoda: §Y[?THIS.CZE_skoda_superb_cars_factories]§!\nProdutividade atual: [?THIS.CZE_skoda_superb_productivity_multiplier|.2Y]x\nOrçamento Škoda: $$[?THIS.CZE_skoda_superb_cars_treasury|G] bilhão\n\n"
 CZE_skoda_superb_cars_text_text: "Demandas dos países:\n@GER §G[GER.GetName]§! [?GER.CZE_skoda_superb_demand|.2%%Y]\n@ENG §G[ENG.GetName]§! [?ENG.CZE_skoda_superb_demand|.2%%Y]\n@FRA §G[FRA.GetName]§! [?FRA.CZE_skoda_superb_demand|.2%%Y]\n@ITA §G[ITA.GetName]§! [?ITA.CZE_skoda_superb_demand|.2%%Y]\n@SPR §G[SPR.GetName]§! [?SPR.CZE_skoda_superb_demand|.2%%Y]\n@POL §G[POL.GetName]§! [?POL.CZE_skoda_superb_demand|.2%%Y]\n@SOV §G[SOV.GetName]§! [?SOV.CZE_skoda_superb_demand|.2%%Y]\n@AUS §G[AUS.GetName]§! [?AUS.CZE_skoda_superb_demand|.2%%Y]\n@SLO §G[SLO.GetName]§! [?SLO.CZE_skoda_superb_demand|.2%%Y]\n@SWI §G[SWI.GetName]§! [?SWI.CZE_skoda_superb_demand|.2%%Y]\n@SWE §G[SWE.GetName]§! [?SWE.CZE_skoda_superb_demand|.2%%Y]\n@NRY §G[NRY.GetName]§! [?NRY.CZE_skoda_superb_demand|.2%%Y]\n@BEL §G[BEL.GetName]§! [?BEL.CZE_skoda_superb_demand|.2%%Y]\n@HOL §G[HOL.GetName]§! [?HOL.CZE_skoda_superb_demand|.2%%Y]\n\nEstoque de §GSuperb I§!: [?THIS.CZE_skoda_superb_cars_stockpile|0Y]\nEstoque de §GSuperb II§!: [?THIS.CZE_skoda_superb2_cars_stockpile|0Y]\nEstoque de §GSuperb III§!: [?THIS.CZE_skoda_superb3_cars_stockpile|0Y]\nEstoque de §GSuperb IV§!: [?THIS.CZE_skoda_superb4_cars_stockpile|0Y]"
 CZE_skoda_superb_cars_sell_text_text: "§YVenda carros excelentes§!"
 CZE_borrow_state_factory: "Aluguel de Fábrica Estatal"
 CZE_borrow_state_factory_desc: "Às vezes, temos que acelerar nossa produção. Podemos pedir ao governo para nos emprestar uma de suas fábricas para que possamos fabricar nossas peças nela."
 CZE_pay_bills: "Pagar contas"
 CZE_expand_kvasiny_factory: "Expandir Fábrica Kvasiny"
 CZE_expand_kvasiny_factory_desc: "Ao modernizar nossa fábrica na cidade de Kvasiny, seremos capazes de atingir uma eficiência de produção extremamente aumentada. Infelizmente, os planos de design assumem que a fábrica ficará fechada durante a construção."
 CZE_skoda_superb_iii_expansion_of_skoda_laboratories: "Expansão dos §YLaboratórios Škoda§!"
 CZE_skoda_superb_iii_expansion_of_skoda_laboratories_desc: "Ao expandir nosso setor científico com um novo instituto de pesquisa, somos capazes, em cooperação com o governo, de desenvolver tecnologias que antes pareciam apenas um sonho distante. Hoje, a realização desse sonho está mais perto do que nunca. É hora de entrar em um novo estágio."
 CZE_new_production_line_in_mlada_boleslav: "Nova linha de produção em Mladá Boleslav"
 CZE_skoda_enyak_iv_development: "Desenvolvimento Škoda Enyaq iV"
 CZE_set_up_location: "Configurar local"
 CZE_electric_highway_category: "Projeto de Rodovia Elétrica"
 CZE_electric_highway_category_desc: "Outros países há muito tempo começaram projetos de rodovias elétricas capazes de carregar veículos elétricos enquanto dirigem. Este investimento extraordinário melhorará o conforto ao dirigir em carros elétricos, embora muito caro, algo que não é feito para os cidadãos."
 CZE_open_planning_phase: "Fase de Planejamento Aberto"
 CZE_prepare_construction_site: "Preparar canteiro de obras"
 CZE_build_one_kilometer_of_electric_highway: "Construir §Y1§! Quilômetro de Rodovia Elétrica\nExtensão atual: §Y[?THIS.CZE_electric_highway_kilometers|.0] km.§!"
 CZE_volkswagen_group_category: "Grupo Volkswagen"
 CZE_volkswagen_group_category_desc: "[CZE_volkswagen_group_category_desc_scripted_loc_TT]"
 CZE_volkswagen_group_category_desc_scripted_loc1_TT: "A VG é uma empresa automotiva alemã sediada em Wolfsburg, na Baixa Saxônia, fundada em 1937. O grupo em 2000 incluía:\n[GER.GetFlag] §YVolkswagen§!\n[GER.GetFlag] §YAudi§!\n[SPR.GetFlag] §YSEAT§!\n[CZE.GetFlag] §YŠkoda§!\n[GER.GetFlag] §YVolkswagen Commercial Vehicles§!\n[ITA.GetFlag] §YLamborghini§!\n[ENG.GetFlag] §YBentley§!\n[FRA.GetFlag] §YBugatti§!\n\nNos últimos anos, Scania, Porsche, MAN, Ducati, Cupra, Jetta e Scout também se juntaram.\nA preocupação pressupõe cooperação mútua entre empresas automotivas e o desenvolvimento da indústria automotiva ao redor do mundo."
 CZE_volkswagen_group_category_desc_scripted_loc2_TT: "A VG é uma empresa automotiva alemã sediada em Wolfsburg, na Baixa Saxônia, fundada em 1937. O grupo em 2000 incluía:\n[GER.GetFlag] §YVolkswagen§!\n[GER.GetFlag] §YAudi§!\n[SPR.GetFlag] §YSEAT§!\n[CZE.GetFlag] §YŠkoda§!\n[GER.GetFlag] §YVolkswagen Commercial Vehicles§!\n[ITA.GetFlag] §YLamborghini§!\n[ENG.GetFlag] §YBentley§!\n[FRA.GetFlag] §YBugatti§!\n===================================================================\n§YŠkoda vs. Volkswagen§!\n\n§GSuporte Volkswagen:§! [?CZE.volkswagen_support|.0%%Y]\n§GSuporte Škoda:§! [?CZE.skoda_support|.0%%Y]\n\n§YSe uma das duas empresas atingir 100% de apoio, o conflito termina com sua vitória. Caso contrário, a empresa com o maior apoio vence. No entanto, em caso de empate, a Skoda admitirá a derrota, pois não conseguiu obter apoio suficiente dentro do grupo para derrubar a liderança da Volkswagen.§!"
 CZE_take_part_in_new_technology_research: "Participe de uma nova pesquisa tecnológica"
 CZE_expand_middle_east_trade: "Expandir o comércio do Oriente Médio"
 CZE_expand_set_up_cooperation_with_india: "Estabelecer cooperação com a Índia"
 CZE_open_aurangabad_factory: "Fábrica Aberta de Aurangabad"
 CZE_open_nanjing_factory: "Fábrica aberta de Nanquim"
 CZE_volkswagen_group_civil_war: "Guerra Civil do Grupo Volkswagen"
 CZE_call_a_press_conference: "Convocar uma conferência de imprensa"
 CZE_quarrel_volkswagen_group_members: "Briga de Membros do Grupo Volkswagen"
 CZE_quarrel_volkswagen_group_members_desc: "A maioria das empresas é muito leal à Volkswagen. Temos que convencê-las de alguma forma a mudar de lado."
 CZE_we_are_the_leaders_here: "Nós somos os líderes aqui"
 CZE_we_are_the_leaders_here_desc: "Lideramos o Grupo Volkswagen desde o começo. Por que esse pequeno tropeço deveria nos privar repentinamente dessa liderança?!"
 CZE_accuse_skoda_of_complicity: "Acusar a Škoda de cumplicidade"
 CZE_accuse_skoda_of_complicity_desc: "Mesmo a menor evidência de que a Škoda estava envolvida em todo esse escândalo poderia minar sua reputação. Temos que bater forte para que o efeito seja visível."
 CZE_fundaments_of_the_skoda_group: "Fundamentos do Grupo Škoda"
 CZE_fundaments_of_the_skoda_group_desc: "Então temos que mostrar aos outros que sabemos o que estamos fazendo. Começaremos a planejar para estabelecer uma nova ordem e estabilizar o grupo assim que assumirmos a liderança dele."
 CZE_talk_to_seat: "Fale com a SEAT"
 CZE_convince_seat_to_stay_with_volkswagen: "Convença a SEAT a permanecer na Volkswagen"
 CZE_talk_to_lamborghini: "Fale com a Lamborghini"
 CZE_convince_lamborghini_to_stay_with_volkswagen: "Convencer a Lamborghini a ficar com a Volkswagen"
 CZE_talk_to_bentley: "Fale com Bentley"
 CZE_convince_bentley_to_stay_with_volkswagen: "Convencer a Bentley a permanecer na Volkswagen"
 CZE_talk_to_bugatti: "Fale com a Bugatti"
 CZE_convince_bugatti_to_stay_with_volkswagen: "Convencer a Bugatti a permanecer na Volkswagen"
 CZE_help_promoting_skoda_actions: "Ajude a promover as ações da Škoda"
 CZE_help_promoting_skoda_actions_desc: "O governo tcheco concordou em nos ajudar a organizar eventos para nos ajudar a assumir o Volkswagen Group. Nós apreciaremos a ajuda deles."
 CZE_talk_with_the_german_government: "Fale com o governo alemão"
 CZE_talk_with_the_german_government_desc: "Graças à ajuda do governo tcheco, estamos iniciando conversas com o governo alemão. Esperemos que valha a pena."
 CZE_get_approval_to_legally_take_over_volkswagen_group: "Obtenha aprovação para assumir legalmente o Grupo Volkswagen"
 CZE_get_approval_to_legally_take_over_volkswagen_group_desc: "O governo alemão não nos dará esse lugar tão facilmente. Precisamos convencê-los de que a credibilidade e posição severamente abaladas da Volkswagen não lhes farão bem."
 CZE_investment_in_the_future: "Investimento no Futuro"
 CZE_investment_in_the_future_desc: "Sabemos que não estamos no mesmo nível da Volkswagen, mas ao assumir a liderança do Grupo Volkswagen, seremos capazes de desenvolver a indústria automotiva mais rápido do que nunca. A Volkswagen foi muito lenta para agir, seremos melhores do que eles."
 CZE_skoda_is_getting_aggressive: "A Škoda está ficando agressiva"
 CZE_skoda_is_getting_aggressive_desc: "As ações repentinas da Škoda nos forçam a tomar contramedidas. Se outras empresas concordarem com seus termos, talvez não consigamos mais salvar nossa posição."
 CZE_what_happened_to_our_group: "O que aconteceu com a nossa comunidade?"
 CZE_what_happened_to_our_group_desc: "Éramos um grupo unido e próspero. Como você pode ver, não muito bem. Um erro terrível perturbou o equilíbrio em nossa comunidade, que foi explorada de forma injusta e agressiva por um de nossos amigos. Não sei por que você está se afastando de nós, mas o Grupo Volkswagen deveria ser algo melhor do que batalhas políticas. Era para ser uma organização que ajudasse o setor automotivo ao redor do mundo. Lamentamos ter decepcionado você."
 CZE_finish_the_preparations: "Termine os preparativos"
 CZE_expansion_to_china: "Expansão para a China"
 CZE_buy_back_full_production_license: "Compre de volta a licença de produção completa"
 CZE_buy_back_full_production_license_desc: "Temos que comprar nossas licenças gradualmente. Se tivermos sorte, a Volkswagen nos dará o valor total antes, se não, temos que dividir tudo em 5 transações."
 CZE_actions_drop: "Ações Drop"
 CZE_cesky_motor_energy_holding: "Česky Motor Energy Holding"
 CZE_cesky_motor_energy_holding_desc: "Embora planejemos deixar o Grupo Volkswagen, isso não significa que estamos desistindo completamente da cooperação com outras empresas. Há muitas outras empresas automotivas em nosso país com as quais podemos estabelecer laços mais próximos. Nosso projeto ainda precisa de algum refinamento, mas quando estivermos prontos, faremos o melhor para unir todas as principais empresas automotivas e produtoras de energia sob uma organização.\n\n§GTATRA Trucks:§! [?CZE.tatra_support|.0%%Y]\n§GVOP CZ:§! [?CZE.vop_support|.0%%Y]\n§GPraga:§! [?CZE.praga_support|.0%%Y]\n§GČEZ:§! [?CZE.cez_support|.0%%Y]"
 CZE_tatra_trucks_decision: "Conversar com a §YTATRA Trucks§! "
 CZE_vop_cz_decision: "Conversar com a §YVOP CZ§! "
 CZE_praga_decision: "Conversar com a §YPraga§! "
 CZE_cez_decision: "Conversar com a §YČEZ§! "
 CZE_start_selling_state_companies_category: "Comece a vender empresas estatais"
 CZE_start_selling_state_companies_category_desc: "Um dos elementos da privatização é a venda de empresas estatais. Tanto outras empresas tchecas quanto empresas estrangeiras poderão comprar ações."
 CZE_czech_railways: "Ferrovias Tchecas"
 CZE_cez_group: "Grupo ČEZ"
 CZE_banks: "Bancos"
 CZE_czech_airlines: "Companhias aéreas checas"
 CZE_temelin_reactor_construction_category: "Construção da Usina Nuclear de Temelin"
 CZE_temelin_reactor_construction_category_desc: "O projeto inteiro da usina nuclear de Temelin começou em 1981. A construção começou em 1987. Este investimento extremamente caro garantirá segurança energética para nós nas próximas décadas. Concluir esta construção deve ser agora nossa maior prioridade."
 CZE_temelin_reactor_opening: "Abertura da Usina de Energia de Temelin"
 CZE_temelin_reactor_opening_desc: "Em 1 ano, concluiremos a construção da usina e seu primeiro reator. Este será um momento extremamente importante na economia tcheca."
 CZE_new_nuclear_power_plant_category: "Nova Usina Nuclear"
 CZE_new_nuclear_power_plant_category_desc: "Recebemos um grande contrato para construir outra usina nuclear. Não podemos falhar neste projeto. O prazo é apertado e o menor erro pode nos custar caro."
 CZE_third_nuclear_power_plant_deadline: "Prazo para Terceira Usina Nuclear"
 CZE_third_nuclear_power_plant_deadline_desc: "Levamos muito tempo para construir a última usina de energia. Os investidores não pretendem esperar tanto agora e estabeleceram um prazo rígido. Se não construirmos a usina até lá, perderemos todos os subsídios de construção."
 CZE_gather_funds: "Reúna fundos"
 CZE_gather_funds_desc: "Precisamos de uma grande quantia de dinheiro para começar a construção.\n§GReúna fundos:§! §Y[?THIS.CZE_power_plants_funds]/200§!"
 CZE_construction_site: "Canteiro de obras"
 CZE_finish_construction: "Construção de acabamento"
 CZE_finish_construction_desc: "Podemos terminar a construção a qualquer momento, mas ainda pode haver espaço para melhorias. Temos tempo limitado, mas concluir projetos adicionais primeiro tornará nossa usina elétrica melhor."
 CZE_additional_laboratory_equipment: "Equipamentos de laboratório adicionais"
 CZE_start_with_better_fuel: "Comece com melhor combustível"
 CZE_thermonuclear_reactor: "Reator Termonuclear"
 CZE_kscm_strikes_at_eu_category: "KSČM ataca a União Europeia"
 CZE_kscm_strikes_at_eu_category_desc: "É nossa última chance de ganhar popularidade antes de sermos esmagados por outros partidos. Ganhar a liderança dos partidos comunistas na União Europeia impulsionará muito nossas relações políticas com muitos países, mas como nossa situação é uma linha descendente, isso não será uma tarefa fácil."
 CZE_eu_mission_fail: "Falha da missão da União Europeia"
 CZE_campaign_in_visegrad_group: "Campanha no Grupo Visegrad"
 CZE_campaign_in_balkans: "Campanha nos Balcãs"
 CZE_campaign_in_west: "Campanha no Ocidente"
 CZE_elections_day: "Dia das Eleições"
 CZE_ods_promote_electoral_program: "§1ODS§! - Promover o Programa Eleitoral"
 CZE_cssd_promote_electoral_program: "§tČSSD§! - Promover o Programa Eleitoral"
 CZE_sell_everything: "Vender tudo"
 CZE_sell_everything_desc: "Podemos vender todos os nossos carros no mercado internacional com lucro menor, mas a preparação dessa transação leva muito tempo e reduzirá nossa produção. Também precisamos converter 1 de nossas fábricas para preparar a transação."
 CZE_reduce_flooding_risk_category: "Reduzir o risco de inundações"
 CZE_reduce_flooding_risk_category_desc: "Uma das promessas do ČSSD era reduzir o risco de inundações no país. A República Tcheca pode ser um país sem litoral, mas os rios, especialmente Vltava e Elba, podem ser muito perigosos para a população local. Esse risco deve ser interrompido ou pelo menos minimizado."
 CZE_increse_bohemia_security: "Aumente a segurança da Boêmia"
 CZE_increse_moravia_security: "Aumentar a segurança da Morávia"
 CZE_increse_sumava_security: "Aumente a segurança do Sumava"
 CZE_increse_czech_silesia_security: "Aumentar a segurança da Silésia Checa"
 CZE_spolu_government_formation_category: "Formação do Governo SPOLU"
 CZE_spolu_government_formation_category_desc: "Com a liderança da coalizão SPOLU, podemos conduzir melhor o futuro do nosso país e da nossa nação. Nestes tempos incertos, cabe a nós escolher uma nova doutrina de desenvolvimento nacional e preparar um novo governo que nos permita entrar na nova década da melhor maneira possível."
 CZE_national_development_doctrine_open: "Abrir Doutrina de Desenvolvimento Nacional"
 CZE_national_development_doctrine_close: "Fechar Doutrina de Desenvolvimento Nacional"
 CZE_stay_in_the_welfare_state: "Permanecer no Estado de Bem-Estar Social"
 CZE_stay_in_the_welfare_state_desc: "Continuaremos nossos programas originais e, aconteça o que acontecer no mundo, conseguiremos concluir nosso programa social."
 CZE_focus_on_the_economy: "Focar na Economia"
 CZE_focus_on_the_economy_desc: "No momento, a economia é muito mais importante do que cuidar das questões sociais. Nosso país precisa estar preparado para mudar rapidamente a linha de produção em tempos de crise."
 CZE_begin_the_rearmament: "Iniciar o Rearmamento"
 CZE_begin_the_rearmament_desc: "Não há tempo para concluir os programas sociais e melhorar nossa economia. Precisamos iniciar a produção em massa de equipamento militar agora mesmo."
 CZE_new_government_preparation_open: "Abrir Preparação do Novo Governo"
 CZE_new_government_preparation_close: "Fechar Preparação do Novo Governo"
 CZE_prepare_martin_baxa_for_new_job: "Preparar Martin Baxa para o Novo Cargo"
 CZE_prepare_zbynek_stanjura_for_new_job: "Preparar Zbyněk Stanjura para o Novo Cargo"
 CZE_prepare_pavel_blazek_for_new_job: "Preparar Pavel Blažek para o Novo Cargo"
 CZE_prepare_martin_kupka_for_new_job: "Preparar Martin Kupka para o Novo Cargo"
 CZE_prepare_jana_cernechova_for_new_job: "Preparar Jana Černochová para o Novo Cargo"
 CZE_petr_pavel_presidenture_category: "Candidatura de Petr Pavel"
 CZE_petr_pavel_presidenture_category_desc: "Após décadas no exército, Petr Pavel decidiu ir para a merecida aposentadoria e ingressar na esfera política. Sempre se preocupou com seu país e seu povo, criando programas de defesa e estabelecendo relações mais estreitas com a aliança. Agora, vai concorrer à presidência do país como político não alinhado a nenhum partido."
 CZE_ods_support: "§1Apoio da ODS§!"
 CZE_kducsl_support: "§3Apoio da KDU-CSL§!"
 CZE_top_support: "§CApoio da TOP-09§!"
 CZE_increase_support_among_the_people: "Aumentar o Apoio entre o Povo"
 CZE_play_cod_with_ment: "Jogar Call of Duty com MenT"
 CZE_play_cod_with_ment_desc: "Antes das eleições, Petr Pavel foi convidado pelo YouTuber MenT para uma conversa e para jogar Call of Duty juntos. O vídeo ficou muito bom."
 CZE_czech.1.t: "Contas Não Pagas"
 CZE_czech.1.d: "Nossa empresa não conseguiu levantar dinheiro para pagar as contas mensais. Por ser a primeira vez em muito tempo que isso acontece e devido ao enorme valor da Škoda para o país, a empresa de cobrança decidiu fazer vista grossa ao nosso erro."
 CZE_czech.1.a: "Precisamos arrumar dinheiro"
 CZE_czech.2.t: "Definir o Local da Rodovia Elétrica"
 CZE_czech.2.d: "Não temos fundos suficientes para construir de forma eficaz trechos de uma rodovia elétrica por toda a República Tcheca. Vamos escolher um governo local onde começaremos o trabalho de criação do primeiro quilômetro da rodovia elétrica."
 CZE_czech.2.o1: "[117.GetName] deve ficar com isso"
 CZE_czech.2.o2: "Vamos de [118.GetName]!"
 CZE_czech.2.o3: "[1017.GetName] dará conta disso"
 CZE_czech.2.o4: "[1018.GetName] é a escolhida"
 CZE_czech.3.t: "Escolher o Futuro Plano da Škoda"
 CZE_czech.3.d: "Nosso futuro parece promissor, mas devemos escolher entre aumentar a eficiência geral de nossas fábricas ou aumentar as demandas da produção diária de nossos modelos Superb."
 CZE_czech.3.o1: "Vamos fabricar mais carros"
 CZE_czech.3.o2: "Precisamos aumentar a produção de nossas fábricas"
 CZE_czech.4.t: "Škoda se Prepara para Deixar o Grupo Volkswagen"
 CZE_czech.4.d: "A Škoda Auto começou a se preparar para deixar o Grupo Volkswagen. No entanto, o amplo controle da empresa alemã Volkswagen não facilita todo o processo. A Škoda primeiro terá de recuperar a plena independência para dar esse passo controverso."
 CZE_czech.4.o1: "Eles sabem o que é melhor para si..."
 CZE_czech.5.t: "Definir o Local da Nova Usina Nuclear"
 CZE_czech.5.d: "A construção de uma usina nuclear exige muitos preparativos. Enquanto reunimos fundos, podemos definir o local do nosso projeto."
 CZE_czech.5.o1: "Boêmia!"
 CZE_czech.5.o2: "Morávia!"
 CZE_czech.5.o3: "Šumava!"
 CZE_czech.5.o4: "Silésia Tcheca!"
 CZE_czech.6.t: "Zaolzie ou Guerra"
 CZE_czech.6.d: "A República Tcheca, liderada pelo partido comunista KSČM, continua com sua doutrina agressiva e exigiu Zaolzie da Polônia."
 CZE_czech.6.o1: "Ahh, tudo bem..."
 CZE_czech.6.o2: "DE NOVO?! NÃO!"
 CZE_czech.7.t: "O Partido Comunista Tcheco KSČM Ataca de Novo!"
 CZE_czech.7.d: "O partido KSČM, da República Tcheca, decidiu mais uma vez influenciar os membros da União Europeia com uma enorme iniciativa pró-comunista. Devido ao apoio muito baixo ao KSČM, ninguém acredita de fato que a propaganda deles terá algum sucesso."
 CZE_czech.7.o1: "Cara, para com isso"
 CZE_czech.8.t: "ODS se prepara para formar nova coalizão"
 CZE_czech.8.d: "O partido democrático ODS decidiu enfrentar a queda de apoio e fazer uma aliança com o Strana Zelených e o KDU-ČSL. Os partidos já são próximos entre si, e o sucesso desse plano pode melhorar a situação de cada um deles."
 CZE_czech.8.o1: "Veremos os efeitos em breve"
 CZE_czech.9.t: "ODS busca novos amigos"
 CZE_czech.9.d: "O partido ODS provou mais uma vez que é um partido voltado à cooperação. Hoje o ODS formou uma coalizão com o novo TOP 09 e o Věci veřejné, partidos conservadores-liberais. Essa nova aliança fortalecerá a posição de domínio do ODS no parlamento tcheco e abrirá novos caminhos para reformar o país."
 CZE_czech.9.o1: "Bom trabalho"
 CZE_czech.10.t: "ODS combate ativistas ecológicos"
 CZE_czech.10.d: "Ativistas ecológicos começaram a protestar em vários lugares de todo o país. Em resposta, políticos do ODS, em cooperação com os serviços uniformizados, reprimiram as \"greves\" e restauraram a ordem."
 CZE_czech.10.o1: "E não voltem mais"
 CZE_czech.11.t: "ODS rebaixado!"
 CZE_czech.11.d: "Ativistas ecológicos começaram a protestar em vários lugares de todo o país. Em resposta, políticos do ODS, em cooperação com os serviços uniformizados, tentaram reprimir as \"greves\", mas um dos políticos decidiu afastar à força um pequeno grupo do local do protesto. Em resposta, as ações do ODS foram criticadas na internet e o político foi detido sob a acusação de atitude agressiva em relação a outras pessoas."
 CZE_czech.11.o1: "Droga!"
 CZE_czech.12.t: "ODS ganha apoio enorme!"
 CZE_czech.12.d: "O partido conservador ODS ganha apoio enorme durante as eleições de [GetYear] e atropela completamente seu rival, o ČSSD. Poderíamos dizer que, para o ODS, a eleição já acabou, mas para o ČSSD é um momento realmente difícil para conseguir qualquer cadeira nas próximas eleições."
 CZE_czech.12.o1: "Interessante"
 CZE_czech.13.t: "ČSSD ganha apoio enorme!"
 CZE_czech.13.d: "O partido social-democrata ČSSD está perto de vencer as próximas eleições com cem por cento dos votos, esmagando seu oponente, o ODS. O ČSSD mostrou mais uma vez seu domínio sobre o ODS e vencerá as eleições de novo."
 CZE_czech.13.o1: "Interessante"
 CZE_czech.14.t: "[CZE.GetName] se aproxima da União Europeia"
 CZE_czech.14.d: "A República Tcheca anunciou sua aprovação à União Europeia. [CZE.GetLeader], líder da República Tcheca, apresentou seu programa, que aproximará seu país da nossa União, e fará de tudo para incluir a República Tcheca na UE."
 CZE_czech.14.o1: "São bem-vindos"
 CZE_czech.15.t: "Referendo nacional"
 CZE_czech.15.d: "O governo decidiu perguntar aos cidadãos o que pensam sobre a possível adesão da República Tcheca à UE. A grande maioria dos residentes tchecos votou a favor do referendo, e sua resposta foi..."
 CZE_czech.15.o1: "SIM!"
 CZE_czech.15.o2: "NÃO!"
 CZE_czech.16.t: "[CZE.GetName] sugere aumento dos gastos com a defesa nacional"
 CZE_czech.16.d: "O governo tcheco acha que nossos gastos com defesa estão baixos demais para os tempos atuais. Eles temem outra guerra, e melhores fortificações podem nos ajudar a intimidar possíveis agressores."
 CZE_czech.16.o1: "Claro"
 CZE_czech.16.o2: "Desperdício de dinheiro"
 CZE_czech.17.t: "Novo programa de gastos militares"
 CZE_czech.17.d: "O novo milênio começou e nosso país fica ainda mais para trás do que antes. As grandes potências estão crescendo em poder, então devemos fazer tudo para alcançá-las, ao menos em uma pequena porcentagem. Infelizmente... nosso orçamento limitado nos permite priorizar apenas um ramo militar."
 CZE_czech.17.o1: "Modernizar o exército"
 CZE_czech.17.o2: "A força aérea é a mais importante"
 CZE_czech.17.o3: "Os oficiais precisam de mais treinamento"
 CZE_czech.18.t: "Petr Pavel tenta impedir a redução dos gastos com defesa"
 CZE_czech.18.d: "Um de nossos oficiais, Petr Pavel, nos apresentou bons argumentos para não reduzirmos nossos gastos com defesa. Podemos não ver uma ameaça agora, mas isso não significa que ela não exista. Talvez devêssemos reconsiderar nossas decisões."
 CZE_czech.18.o1: "Bobagem, não estamos em perigo"
 CZE_czech.18.o2: "Vamos deixar isso de lado por enquanto"
 CZE_czech.18.o3: "Ele tem razão, devemos aumentá-los"
 CZE_czech.19.t: "[CZE.GetName] propõe treinamento militar conjunto"
 CZE_czech.19.d: "O novo presidente tcheco decidiu nos procurar e oferecer um treinamento militar conjunto em nosso território. O atual presidente tcheco é um general do exército aposentado, então podemos aprender muito com suas táticas e seu modo de planejar."
 CZE_czech.19.o1: "Claro"
 CZE_czech.19.o2: "Desperdício de dinheiro e tempo"
 CZE_czech.20.t: "[POL.GetName] aceita nossa oferta"
 CZE_czech.20.d: "O governo polonês começou os preparativos para nossos exercícios militares conjuntos. Ambos nos beneficiaremos disso."
 CZE_czech.20.o1: "Ótimo"
 CZE_czech.21.t: "[POL.GetName] rejeita nossa oferta"
 CZE_czech.21.d: "O governo polonês recusou nossos exercícios de treinamento conjuntos."
 CZE_czech.21.o1: "Valeu a tentativa"
 CZE_czech.22.t: "[CZE.GetName] pede mais equipamentos no flanco oriental"
 CZE_czech.22.d: "O governo tcheco nos procurou para pedir maior proteção contra a Rússia. Temos alguns equipamentos sobrando, mas será uma transação muito cara para nós."
 CZE_czech.22.o1: "Podemos dar alguns equipamentos a eles"
 CZE_czech.22.o2: "Temos coisas melhores a fazer"
 CZE_czech.23.t: "[USA.GetName] nos ajuda com novos equipamentos!"
 CZE_czech.23.d: "O governo americano decidiu lançar um projeto que inclui apoio aos países orientais da nossa aliança. Devido à crescente tensão com a Rússia, eles nos enviarão novos equipamentos para proteção extra."
 CZE_czech.23.o1: "Ótimo!"
 CZE_czech.24.t: "[USA.GetName] envia ajuda!"
 CZE_czech.24.d: "O governo americano decidiu lançar um projeto que inclui apoio aos países orientais da nossa aliança. Devido à crescente tensão com a Rússia, eles enviarão equipamentos aos países do flanco oriental para proteção extra."
 CZE_czech.24.o1: "Ótimo!"
 CZE_czech.25.t: "[USA.GetName] não ajudará"
 CZE_czech.25.d: "O governo americano decidiu se concentrar em assuntos mais internos e não enviará nenhum equipamento extra."
 CZE_czech.25.o1: "Hum"
 CZE_czech.26.t: "Petr Pavel é eleito novo presidente!"
 CZE_czech.26.d: "O general aposentado do exército Petr Pavel venceu as últimas eleições presidenciais e formou um novo governo. Ele não pertence a nenhum partido, mas isso não impediu a coalizão SPOLU de apoiar sua candidatura e seu programa eleitoral."
 CZE_czech.26.o1: "Ótimo!"
 CZE_czech.27.t: "Fábrica em Kvasiny ampliada"
 CZE_czech.27.d: "A Škoda ampliou sua fábrica na cidade de Kvasiny e se prepara para a produção de um novo tipo de seus carros. Os novos blocos da fábrica permitirão à Škoda pesquisar novas formas de fabricação de veículos e desenvolver maior conforto ao dirigir. Os centros de pesquisa ainda não foram abertos, mas há rumores de que tudo começará com o lançamento da produção de seu novo modelo Superb."
 CZE_czech.27.o1: "Super"
 CZE_czech.28.t: "Enchentes maciças por todo o país!"
 CZE_czech.28.d: "Uma semana de chuvas intensas provocou inundações em grande parte do nosso país e em quase metade da Europa. O evento matou 232 pessoas e deixou $27,115 bilhões em prejuízos. A enchente teve uma magnitude esperada para ocorrer aproximadamente uma vez por século. Uma das regiões mais afetadas foi o estado da capital, Praga, que sofreu danos de milhões de dólares e causou a morte de 17 pessoas."
 CZE_czech.28.o1: "Cadê os bombeiros?!"
 CZE_czech.29.t: "Tornado na região da Morávia do Sul"
 CZE_czech.29.d: "Um tornado raro, violento e mortal, de longo percurso, atingiu várias aldeias nos distritos de Hodonín e Břeclav, na região da Morávia do Sul, na República Tcheca, na noite de [?global.date.GetDateStringNoHourLong], matando seis pessoas e ferindo outras 576. Esse tornado foi o mais forte já documentado na história tcheca moderna e o tornado europeu mais mortal desde 2001. Foi classificado como F4 na escala Fujita e IF4 na escala Fujita Internacional."
 CZE_czech.29.o1: "Isso não é bom..."
 CZE_czech.30.t: "Pessoas sofrem com intoxicação por metanol!"
 CZE_czech.30.d: "O governo tcheco criou um conselho central de resposta a emergências e proibiu a venda de bebidas destiladas com mais de 20% de teor alcoólico por volume em barracas de comida em 2012. A intoxicação afetou milhares de cidadãos tchecos, poloneses e eslovacos, causando dezenas de mortes. A polícia verificou sistematicamente as lojas onde as bebidas eram vendidas. Liderada pelo vice-presidente da polícia, Václav Kučera, uma equipe policial especial chamada Metyl coordenou as investigações. A polícia anunciou que a origem do álcool contaminado com metanol havia sido identificada. Dois principais suspeitos foram presos: Rudolf Fian, empresário de Karviná de nacionalidade eslovaca, e Tomáš Křepela, dono de uma empresa tcheca de Řitka."
 CZE_czech.30.o1: "Parem a venda!"
 CZE_czech.31.t: "[642.GetName] é nossa!"
 CZE_czech.31.d: "Nossas forças conseguiram tomar Kaliningrado do inimigo e estabeleceram um novo governo sob nossa administração tcheca. É um dos dias mais importantes para o nosso país, e tal conquista merece uma grande festa!"
 CZE_czech.31.o1: "Dia da vitória!"
 CZE_czech.31.o2: "Isso é desnecessário"
 CZE_news.1.t: "Škoda abre a exportação de carros Superb"
 CZE_news.1.d: "A empresa tcheca Škoda Auto acaba de começar a exportar seu mais recente modelo Škoda Superb I para muitos parceiros europeus. Devido à participação da Škoda no Grupo Volkswagen, outros países cujas empresas também são membros recebem desconto na compra de carros novos."
 CZE_news.1.o1: "Hora dos lucros"
 CZE_news.1.o2: "Interessante"
 CZE_news.2.t: "Škoda desafia a Volkswagen!"
 CZE_news.2.d: "O CEO da Škoda Auto acaba de divulgar resultados de testes privados de carros da alemã Volkswagen, que supostamente continham emissões de escapamento significativamente menores do que as reais. A Škoda Auto decidiu colocar toda a sua reputação dentro do Grupo Volkswagen em jogo para se opor à Volkswagen e anunciar que buscará adquirir a maioria das ações do grupo e, assim, assumir a liderança do Grupo Volkswagen."
 CZE_news.2.o1: "Vai, Škoda!"
 CZE_news.2.o2: "Droga!"
 CZE_news.2.o3: "Isso não é legal, Volkswagen"
 CZE_news.2.o4: "E eles vendiam esses carros para nós?!"
 CZE_news.3.t: "Partido Comunista Tcheco KSČM influencia a União Europeia"
 CZE_news.3.d: "O Komunistická strana Čech a Moravy, KSČM, continua seu programa de ideologia eurocomunista motivando partidos comunistas pertencentes à União Europeia. Os partidos ganharam certa popularidade em todos os membros da União, aumentando o poder da ideologia comunista na Europa."
 CZE_news.3.o1: "Não nos culpem"
 CZE_news.3.o2: "Mas que diabos?!"
 CZE_news.4.t: "Partido Comunista de [CZE.GetName] toma o poder na UE"
 CZE_news.4.d: "O KSČM tcheco, que governa o país atualmente, começou a implementar seu programa de eurocomunismo. Como resultado, partidos comunistas de toda a União Europeia passam a apoiar o KSČM, ganhando apoio enorme. Acontece que a União Europeia não é tão forte quanto todos pensavam. Se nada parar o KSČM, a Europa pode se tornar comunista de novo."
 CZE_news.4.o1: "Isso é necessário"
 CZE_news.4.o2: "A União Europeia deveria ser mais forte"
 CZE_news.4.o3: "A União Europeia é fraca"
 CZE_news.5.t: "[CZE.GetName] comunista inicia a produção de armamentos"
 CZE_news.5.d: "Acontece que o recém-eleito partido comunista tcheco KSČM tinha um plano secreto de recolocar a República Tcheca no caminho da guerra. O líder do partido ofendeu os presidentes da Polônia, da Hungria e da Bulgária, dizendo que eles pagarão pela intervenção do Pacto de Varsóvia na Tchecoslováquia em 1968. Ninguém sabe por que querem se vingar disso, mas, de alguma forma, eles voltaram."
 CZE_news.5.o1: "Eles pagarão por seus crimes"
 CZE_news.5.o2: "O que eles poderiam fazer, afinal?"
 CZE_news.6.t: "Polônia cede Zaolzie à República Tcheca"
 CZE_news.6.d: "A República Tcheca exigiu da Polônia o restante da região de Zaolzie. Essa região foi anteriormente objeto de muitos conflitos entre poloneses e tchecos. Agora, esse território está totalmente controlado pela República Tcheca."
 CZE_news.6.o1: "Muito bem"
 CZE_news.6.o2: "Mas o quê-"
 CZE_news.6.o3: "Ainda não acabou!"
 CZE_news.7.t: "Polônia se recusa a ceder Zaolzie à República Tcheca"
 CZE_news.7.d: "A República Tcheca exigiu da Polônia o restante da região de Zaolzie. Essa região foi anteriormente objeto de muitos conflitos entre poloneses e tchecos. O governo polonês recusou as exigências tchecas, tornando a situação no Grupo de Visegrado muito instável."
 CZE_news.7.o1: "Vamos obrigá-los"
 CZE_news.7.o2: "Boa escolha"
 CZE_news.7.o3: "Eles não podem nos machucar"
 czech_skoda.1.t: "Preparação de exportação de carros"
 czech_skoda.1.d: "Podemos enviar algumas de nossas máquinas para o exterior. Isso trará lucros à nossa empresa e, após a dedução de todos os impostos, ajudará a República Tcheca a desenvolver sua economia."
 czech_skoda.1.o1: "Enviar Superb I"
 czech_skoda.1.o2: "Enviar Superb II"
 czech_skoda.1.o3: "Enviar Superb III"
 czech_skoda.1.o4: "Enviar Superb IV"
 czech_skoda.1.o5: "Mudei de ideia"
 czech_skoda.2.t: "A empresa Škoda de [CZE.GetName] quer vender carros"
 czech_skoda.2.d: "A empresa Škoda nos ofereceu a compra de seus modelos Škoda Superb. Graças a essa transação, nossos investimentos estrangeiros ganharão impulso, e os cidadãos poderão desfrutar de carros novos direto da fábrica."
 czech_skoda.2.o1.german: "Deixar Weiterstadt receber o primeiro Superb I"
 czech_skoda.2.o2.german: "Ampliar o Superb II entre as concessionárias alemãs"
 czech_skoda.2.o3.german: "Wolfsburg aprova a remessa do Superb III"
 czech_skoda.2.o4.german: "Vender o Superb IV abaixo do Passat"
 czech_skoda.2.o5.german: "Wolfsburg não vê espaço para ele"
 czech_skoda.2.o6: "Não, e não nos pergunte de novo"
 czech_skoda.3.t: "[FROM.GetName] aceitou a transação!"
 czech_skoda.3.d: "[FROM.GetName] assinou um acordo para a venda de nossos carros Superb, e os primeiros lotes de mercadorias já estão saindo dos armazéns. O dinheiro foi transferido para a nossa conta e para o tesouro tcheco após a dedução de todos os impostos e contas."
 czech_skoda.3.o1: "Bom negócio"
 czech_skoda.5.t: "[FROM.GetName] recusou a transação!"
 czech_skoda.5.d: "[FROM.GetName] rejeitou a compra de nossos carros. Voltamos à estaca zero, mas ainda há muitos compradores nos mercados que certamente estarão mais dispostos a aceitar nossa oferta. Não podemos pedir outra transação com [FROM.GetName] pelos próximos 7 dias."
 czech_skoda.5.o1: "Há outros mercados"
 czech_skoda.7.t: "[FROM.GetName] bloqueou nossas transações!"
 czech_skoda.7.d: "[FROM.GetName] decidiu parar de comprar nossos carros. Eles não aceitarão mais nossas ofertas."
 czech_skoda.7.o1: "Como puderam?!"
 CZE_scripted_event.1.t: "Protestos antiglobalização em Praga"
 CZE_scripted_event.1.d: "Em Praga, durante uma reunião do Fundo Monetário Internacional e do Banco Mundial, houve tumultos por toda a cidade. Mais de 12.000 antiglobalistas e anticapitalistas tomaram as ruas e começaram a entrar em confronto com as forças de segurança. Apesar da boa preparação das autoridades e da antecipação de possíveis greves, os tumultos duraram quase a semana inteira. Muitos policiais ficaram feridos, mas não foram relatadas mortes. Os rebeldes foram reprimidos e muitos deles foram condenados."
 CZE_scripted_event.1.o1: "Isso não deveria acontecer"
 CZE_skoda_volkswagen.1.t: "Conferência fracassada!"
 CZE_skoda_volkswagen.1.d: "Apesar de todos os nossos esforços, não conseguimos ganhar apoio durante a coletiva de imprensa. Os jornalistas fizeram perguntas demais, que não conseguimos responder a nosso favor. Teremos outra chance em breve."
 CZE_skoda_volkswagen.1.o1: "Ainda não acabou"
 CZE_skoda_volkswagen.2.t: "Škoda sob críticas!"
 CZE_skoda_volkswagen.2.d: "Em resposta às alegações particularmente danosas feitas pela Škoda Auto sobre a falsificação de resultados de gases de escapamento, a Volkswagen decidiu não ficar para trás. Esta manhã, em [?global.date.GetDateStringNoHourLong], conversas privadas entre funcionários-chave da Škoda e da Volkswagen sobre a falsificação dos resultados foram publicadas, e todo o material foi enviado à mídia independente. Uma onda de críticas caiu sobre a Škoda, mas o CEO da empresa acalmou os ânimos garantindo que a companhia não estava envolvida nessa prática."
 CZE_skoda_volkswagen.2.o1: "Por que eles confiam neles?!"
 CZE_skoda_volkswagen.2.o2: "Não nos ataquem se não conseguem esconder as provas"
 CZE_skoda_volkswagen.3.t: "A imagem pública da Volkswagen despencou!"
 CZE_skoda_volkswagen.3.d: "A Volkswagen tentou convencer a mídia independente de que a Škoda estava ativamente envolvida na falsificação dos resultados dos testes de emissões. No entanto, notou-se certa imprecisão que prova que essa informação é falsa. A mídia tornou o assunto público, e a Škoda ganhou apoio de outras empresas do Grupo Volkswagen."
 CZE_skoda_volkswagen.3.o1: "Queriam jogar sujo, é?"
 CZE_skoda_volkswagen.3.o2: "Como isso pôde acontecer?!"
 CZE_skoda_volkswagen.4.t: "SEAT se junta à Škoda!"
 CZE_skoda_volkswagen.4.d: "A SEAT decidiu se juntar ao projeto do Grupo Škoda, que visa excluir a Volkswagen de seu próprio grupo e introduzir novas regras."
 CZE_skoda_volkswagen.4.o1: "Muito bem"
 CZE_skoda_volkswagen.4.o2: "Droga!"
 CZE_skoda_volkswagen.5.t: "Lamborghini se junta à Škoda!"
 CZE_skoda_volkswagen.5.d: "A Lamborghini decidiu se juntar ao projeto do Grupo Škoda, que visa excluir a Volkswagen de seu próprio grupo e introduzir novas regras."
 CZE_skoda_volkswagen.5.o1: "Muito bem"
 CZE_skoda_volkswagen.5.o2: "Droga!"
 CZE_skoda_volkswagen.6.t: "Bentley se junta à Škoda!"
 CZE_skoda_volkswagen.6.d: "A Bentley decidiu se juntar ao projeto do Grupo Škoda, que visa excluir a Volkswagen de seu próprio grupo e introduzir novas regras."
 CZE_skoda_volkswagen.6.o1: "Muito bem"
 CZE_skoda_volkswagen.6.o2: "Droga!"
 CZE_skoda_volkswagen.7.t: "Bugatti se junta à Škoda!"
 CZE_skoda_volkswagen.7.d: "A Bugatti decidiu se juntar ao projeto do Grupo Škoda, que visa excluir a Volkswagen de seu próprio grupo e introduzir novas regras."
 CZE_skoda_volkswagen.7.o1: "Muito bem"
 CZE_skoda_volkswagen.7.o2: "Droga!"
 CZE_skoda_volkswagen.8.t: "Škoda começa a conversar com outras empresas"
 CZE_skoda_volkswagen.8.d: "A Škoda Auto iniciou negociações com outras empresas do Grupo Volkswagen para que se juntem ao projeto do Grupo Škoda, que será estabelecido após a exclusão da Volkswagen de seu próprio grupo."
 CZE_skoda_volkswagen.8.o1: "Não enquanto eu estiver aqui!"
 CZE_skoda_volkswagen.9.t: "Škoda tenta flexibilizar as regras do Grupo Volkswagen"
 CZE_skoda_volkswagen.9.d: "As ações recentes da Škoda mostraram que ela está pronta para flexibilizar algumas regras antigas do Grupo Volkswagen a fim de assumir a liderança em seus próprios termos."
 CZE_skoda_volkswagen.9.o1: "E ninguém se opõe a isso?!"
 CZE_skoda_volkswagen.10.t: "Škoda cria o Grupo Škoda!"
 CZE_skoda_volkswagen.10.d: "Como resultado da controvérsia e das duras críticas que recaíram sobre a montadora Volkswagen, a Škoda assumiu a liderança do grupo e anunciou a criação do Grupo Škoda. Todas as empresas que se juntaram à Škoda podem desfrutar de subsídios à pesquisa e de estabilidade comercial recuperada."
 CZE_skoda_volkswagen.10.o1: "Bom trabalho, Škoda"
 CZE_political_event.1.t: "US-DEU se prepara para as eleições"
 CZE_political_event.1.d: "Depois que a US-DEU mudou de liderança, elegendo o jovem e relativamente inexperiente político Pavel Němec, o partido apresentou um novo programa eleitoral para as próximas eleições...\nHá especulações de que a US-DEU vai mudar sua visão de mundo e surpreender a todos antes das eleições de 2006... mas não do jeito que seus eleitores esperam..."
 CZE_political_event.1.a: "Certo?"
 CZE_political_event.2.t: "US-DEU defende a legalização de drogas leves, da eutanásia e do casamento entre pessoas do mesmo sexo"
 CZE_political_event.2.d: "Descobriu-se que o mais novo programa eleitoral apresentado pela democrática US-DEU inclui a legalização de muitas questões controversas. Em decorrência das informações recém-publicadas, o partido passou a perder ainda mais eleitores do que nunca."
 CZE_political_event.2.a: "Agora está assustador..."
 CZE_political_event.3.t: "US-DEU adere à ideologia semianarquista!"
 CZE_political_event.3.d: "Em resposta à queda de apoio e às controvérsias recentes, os políticos da US-DEU decidiram mudar seu slogan e adotar uma visão semianarquista, substituindo seus logotipos originais por um pentagrama como emblema. A situação enfrentou pesadas críticas de todos os outros partidos e causou frustração internacional. Como resultado, a US-DEU perdeu quase todos os seus eleitores e se tornou o partido menos popular do país."
 CZE_political_event.3.a: "???"
 CZE_political_event.4.t: "US-DEU decide o destino de Hamid bin Abdal Saní"
 CZE_political_event.4.d: "Hamid bin Abdal Saní é membro da família governante do Estado do Catar, que está sob custódia na República Tcheca há cerca de um ano, desde setembro de 2004, por abuso sexual e por pôr em risco a educação de jovens. De acordo com a acusação, ele abusou de um total de 16 meninas.\nPavel Němec está prestes a fazer um discurso e decidir como esse caso deve terminar."
 CZE_political_event.4.a: "O Catar deve resolver este caso"
 CZE_political_event.4.b: "Ele ficará em nosso país"
 CZE_political_event.5.t: "US-DEU renuncia"
 CZE_political_event.5.d: "O partido democrático Unie Svobody - Demokratická Unie declarou hoje, em [GetDateText], o encerramento do partido. A US-DEU deixará de existir em 1º de janeiro do ano de 2011. O partido era conhecido por muitas ações controversas, mas ainda mantinha alguns eleitores leais. Infelizmente para eles, não foi o suficiente."
 CZE_political_event.5.a: "O fim de mais uma era"
 CZE_political_event.6.t: "ČSSD sob fogo de críticas!"
 CZE_political_event.6.d: "O caso surgiu em razão da exploração da jazida de lítio em Cínovec; os direitos de exploração da jazida e a possível mineração subsequente são o assunto do dia. O ČSSD social-democrata exige cooperação com uma empresa australiana e o início da extração do recurso. Já o político do ANO declarou que o memorando é inválido e que a jazida de lítio deve permanecer intocada."
 CZE_political_event.6.a: "Eles não deveriam fazer isso"
 CZE_political_event.6.b: "Ficamos com o ČSSD"
 CZE_political_tree_event.1.t: "As eleições políticas terminaram"
 CZE_political_tree_event.1.d: "Mais uma eleição para a Câmara dos Deputados foi concluída. Os partidos prepararam novos programas para cumprir antes das próximas eleições e já começaram a executá-los."
 CZE_political_tree_event.1.a: "Hora do próximo passo"
 CZE_political_tree_event.2.t: "Eleições extraordinárias começaram"
 CZE_political_tree_event.2.d: "Desta vez, as eleições começaram em 2013 devido a acontecimentos recentes. Os partidos tiveram de se preparar mais rápido para as novas eleições e já estão elaborando novos programas eleitorais."
 CZE_political_tree_event.2.a: "Interessante"
 CZE_petr_pavel_event.1.t: "[CZE.GetName] envia Petr Pavel para ajudar na guerra"
 CZE_petr_pavel_event.1.d: "Petr Pavel é um oficial de ligação tcheco que deseja ajudar em nossos esforços de guerra. Sua experiência em planejamento tático pode nos ajudar a afastar os talibãs de nossa linha de frente."
 CZE_petr_pavel_event.1.a: "Precisamos de toda ajuda"
 CZE_petr_pavel_event.1.b: "Ele pode ficar, mas não pode tocar em nossos mapas"
 CZE_petr_pavel_event.2.t: "Petr Pavel conclui missão no Afeganistão"
 CZE_petr_pavel_event.2.d: "Petr Pavel concluiu sua missão no Afeganistão. Seu treinamento e sua cooperação com unidades afegãs contra as forças talibãs o tornaram mais adaptável ao terreno desértico e melhoraram as relações tcheco-afegãs."
 CZE_petr_pavel_event.2.a: "Bom trabalho!"
 CZE_petr_pavel_event.3.t: "Petr Pavel prepara plano ofensivo"
 CZE_petr_pavel_event.3.d: "Petr Pavel está prestes a concluir sua nova estratégia ofensiva contra os talibãs. Depois de estudar o estilo talibã por meses, ele está pronto para apresentar uma nova doutrina que ajudará nossas forças a vencer esta guerra e retomar o controle de nosso país."
 CZE_petr_pavel_event.3.a: "Bom saber!"
 CZE_petr_pavel_event.4.t: "Petr Pavel conclui operação no Afeganistão"
 CZE_petr_pavel_event.4.d: "Petr Pavel preparou uma nova estratégia ofensiva contra os talibãs e apoiou remotamente as unidades afegãs durante esta operação. O Afeganistão conseguiu vencer muitas batalhas graças a isso, e parece que a guerra começa a pender para o lado deles."
 CZE_petr_pavel_event.4.a: "Ótimo!"
 CZE_petr_pavel_event.5.t: "Petr Pavel conclui operação no Afeganistão"
 CZE_petr_pavel_event.5.d: "Depois de meses de planejamento, Petr Pavel concluiu sua missão no Afeganistão e reforçou as forças afegãs durante esse período. O Afeganistão está agora mais bem preparado para o próximo ataque talibã."
 CZE_petr_pavel_event.5.a: "Ótimo"
 CZE_petr_pavel_event.6.t: "Petr Pavel quer preparar nova estratégia"
 CZE_petr_pavel_event.6.d: "O general tcheco Petr Pavel pediu permissão para preparar a nova estratégia contra as forças talibãs e se tornar o general superior que executará esse plano. O problema é que o europeu usa um estilo diferente do nosso e, quando começar a introduzir seu plano, podemos sofrer com ganho de experiência e velocidade de planejamento reduzidos, justamente do que precisamos agora."
 CZE_petr_pavel_event.6.a: "Podemos aceitar essa proposta"
 CZE_petr_pavel_event.6.b: "Não precisamos dele"
 CZE_petr_pavel_event.7.t: "Petr Pavel prepara estratégia contra os talibãs"
 CZE_petr_pavel_event.7.d: "Petr Pavel está pronto para iniciar uma nova operação no Afeganistão. A única coisa de que ele precisa agora é da aprovação do alto comando afegão."
 CZE_petr_pavel_event.7.a: "Bom trabalho"
 CZE_petr_pavel_event.8.t: "Forças afegãs permitem que Petr Pavel prepare estratégia"
 CZE_petr_pavel_event.8.d: "[AFG.GetName] decidiu permitir que Petr Pavel elabore um novo plano que ajudará as forças afegãs a derrotar os grupos talibãs. Petr Pavel pode agora preparar sua estratégia para ajudar no combate aos talibãs."
 CZE_petr_pavel_event.8.a: "Incrível!"
 CZE_petr_pavel_event.9.t: "Forças afegãs não permitem que Petr Pavel prepare estratégia"
 CZE_petr_pavel_event.9.d: "[AFG.GetName] decidiu não permitir que Petr Pavel elabore um novo plano estratégico. O alto comando afegão prefere seu próprio estilo e suas próprias doutrinas."
 CZE_petr_pavel_event.9.a: "Pena"
 CZE_petr_pavel_event.10.t: "Petr Pavel conclui apoio à Presença Avançada Reforçada"
 CZE_petr_pavel_event.10.d: "Depois de quase um ano de serviço, Petr Pavel voltou ao nosso país, tendo preparado com sucesso uma estratégia defensiva contra a Rússia no flanco oriental."
 CZE_petr_pavel_event.10.a: "Estamos mais seguros agora"
 CZE_petr_pavel_event.11.t: "[CZE.GetName] oferece ajuda nos preparativos da Presença Avançada Reforçada"
 CZE_petr_pavel_event.11.d: "A Presença Avançada Reforçada foi criada em resposta à política russa agressiva, que ameaça a segurança da aliança. [CZE.GetName] gostaria de enviar seu general, Petr Pavel, para ajudar a preparar novas linhas defensivas, mas ao custo de capacidades militares reduzidas."
 CZE_petr_pavel_event.11.a: "Teremos prazer em participar!"
 CZE_petr_pavel_event.11.b: "Não podemos baixar a guarda agora"
 CZE_petr_pavel_event.12.t: "Petr Pavel volta da Operação Atlantic Resolve"
 CZE_petr_pavel_event.12.d: "Petr Pavel ajudou mais uma vez as forças da aliança, e seu planejamento permitiu que outros generais trabalhassem com mais fluidez durante esta operação. Petr Pavel aprendeu mais sobre estratégias defensivas modernas e voltou para casa com novos conhecimentos."
 CZE_petr_pavel_event.12.a: "Muito bem"
 CZE_petr_pavel_event.13.t: "Sucesso da missão de Policiamento Aéreo do Báltico"
 CZE_petr_pavel_event.13.d: "Petr Pavel concluiu seu serviço no aprimoramento do curso da missão de Policiamento Aéreo do Báltico e ajudou os países bálticos a melhorar a coordenação de suas forças aéreas."
 CZE_petr_pavel_event.13.a: "Bom trabalho!"
 CZE_petr_pavel_event.14.t: "[CZE.GetName] envia Petr Pavel para ajudar a coordenar o Policiamento Aéreo do Báltico"
 CZE_petr_pavel_event.14.d: "Petr Pavel é um general tcheco que terá prazer em ajudar a fortalecer a força aérea báltica da aliança. Poderemos treinar melhor nossos pilotos, mas teremos de mudar temporariamente a produção de aviões para modelos leves."
 CZE_petr_pavel_event.14.a: "Claro"
 CZE_petr_pavel_event.14.b: "Perda de tempo"
 CZE_petr_pavel_event.15.t: "Petr Pavel conclui turno no CENTCOM"
 CZE_petr_pavel_event.15.d: "Graças aos esforços de Pavel, a situação no Iraque ficou um pouco mais estável. A guerra é sempre um momento difícil, mas nosso oficial de ligação enfrentou esse desafio com profissionalismo."
 CZE_petr_pavel_event.15.a: "Bom"
 CZE_petr_pavel_event.16.t: "[CZE.GetName] envia Petr Pavel para coordenar os esforços da 2ª Guerra do Golfo"
 CZE_petr_pavel_event.16.d: "[CZE.GetName] pede para aprovarmos a cooperação com seu oficial de ligação Petr Pavel. Ele é um soldado experiente que já ajudou nosso país muitas vezes. A situação no Iraque continua instável, então pode valer a pena aceitar a proposta deles."
 CZE_petr_pavel_event.16.a: "Ele é bem-vindo"
 CZE_petr_pavel_event.16.b: "Nosso comando não precisa de ajuda"
 CZE_petr_pavel_event.17.t: "Petr Pavel volta do Afeganistão"
 CZE_petr_pavel_event.17.d: "Petr Pavel concluiu seu serviço durante a Operação Liberdade Duradoura e ensinou nossos soldados a lutar em ambiente desértico contra um inimigo que usa táticas de guerrilha. Esse serviço levou quase um ano, mas os resultados realmente valem o esforço."
 CZE_petr_pavel_event.17.a: "Perfeito!"
 CZE_petr_pavel_event.18.t: "[CZE.GetName] ajuda na Guerra ao Terror"
 CZE_petr_pavel_event.18.d: "[CZE.GetName] pede a aprovação de seu pedido para ajudar durante a Guerra ao Terror no Afeganistão. Eles desejam enviar seu oficial de ligação e planejador especialista, Petr Pavel, para ajudar em nossos esforços contra a insurgência talibã."
 CZE_petr_pavel_event.18.a: "Claro!"
 CZE_petr_pavel_event.18.b: "Podemos fazer isso sem eles"
 CZE_petr_pavel_event.19.t: "[CZE.GetName] envia Petr Pavel ao Catar"
 CZE_petr_pavel_event.19.d: "O alto comando tcheco ajudará nos esforços da 2ª Guerra do Golfo enviando um de seus oficiais de ligação, Petr Pavel, ao Catar, devido às boas relações em comum. Petr Pavel coordenará estratégias e operações a partir de um dos acampamentos militares americanos no Catar."
 CZE_petr_pavel_event.19.a: "Legal"
 CZE_petr_pavel_event.20.t: "Petr Pavel volta do Catar"
 CZE_petr_pavel_event.20.d: "Após semanas intensas no Catar e na cooperação com as forças americanas que lutam no Iraque, Petr Pavel voltou em segurança ao nosso país, encerrando seu serviço como oficial de ligação."
 CZE_petr_pavel_event.20.a: "Ótimo"
 CZE_petr_pavel_event.21.t: "Petr Pavel volta do Catar novamente"
 CZE_petr_pavel_event.21.d: "Petr Pavel voltou ao Catar por um mês para manter boas relações com o nosso país em caso de outra guerra. Sua missão foi bem-sucedida e agora somos mais amigos do Catar."
 CZE_petr_pavel_event.21.a: "Certo"
 CZE_petr_pavel_event.22.t: "Petr Pavel reduz a tensão na fronteira turco-síria"
 CZE_petr_pavel_event.22.d: "Após longas negociações e muita tensão, Petr Pavel, com a ajuda de outros generais, conseguiu melhorar as relações com a Turquia e a Síria, evitando a escalada do conflito."
 CZE_petr_pavel_event.22.a: "Bem feito"
 CZE_petr_pavel_event.23.t: "Novo Livro Branco assinado"
 CZE_petr_pavel_event.23.d: "Um novo Livro Branco foi redigido e assinado. Essa nova estratégia de defesa ajudará nosso exército a se adaptar a um estilo mais defensivo e a proteger nossa nação em seu território principal."
 CZE_petr_pavel_event.23.a: "Isso deve ajudar"
 CZE_petr_pavel_event.24.t: "[CZE.GetName] deseja assinar o novo Livro Branco"
 CZE_petr_pavel_event.24.d: "Os novos Livros Brancos ajudarão nosso país a se preparar melhor em caso de guerra. As estratégias tchecas certamente serão úteis, mas precisaremos adaptar nosso exército a esse novo estilo ao custo de habilidades de combate reduzidas."
 CZE_petr_pavel_event.24.a: "Claro, precisamos mais de defesa do que de ataque"
 CZE_petr_pavel_event.24.b: "Não, obrigado"
 CZE_petr_pavel_event.25.t: "Petr Pavel conclui serviço na KFOR"
 CZE_petr_pavel_event.25.d: "Embora a situação no Kosovo ainda seja instável devido às exigências sérvias, as forças da operação KFOR fazem o possível para não escalar a situação. Petr Pavel ajudou as forças de segurança a manter o país seguro."
 CZE_petr_pavel_event.25.a: "Mais um sucesso"
 CZE_petr_pavel_event.26.t: "Sucesso da Operação Althea"
 CZE_petr_pavel_event.26.d: "Petr Pavel voltou hoje da Bósnia. As ações que ele realizou ajudaram a acalmar os ânimos e evitaram alguns conflitos inesperados. Os Bálcãs estão mais estáveis agora."
 CZE_petr_pavel_event.26.a: "Ótimo!"
 CZE_petr_pavel_event.27.t: "§Y[CZE.GetName]§! intervém na Operação Althea"
 CZE_petr_pavel_event.27.d: "Petr Pavel foi enviado pelo comando tcheco para ajudar a manter a situação em nosso país estável. Ele nos ajudará a recrutar mais pessoas para guardar a ordem, mas teremos de treiná-las por mais tempo."
 CZE_petr_pavel_event.27.a: "Claro, tudo bem"
 CZE_petr_pavel_event.27.b: "Nem pensar"
 CZE_petr_pavel_event.28.t: "Cooperação JEF concluída"
 CZE_petr_pavel_event.28.d: "Após meses de planejamento e treinamento, Petr Pavel voltou dos exercícios das Forças Expedicionárias Conjuntas, nos quais ajudou a fortalecer o litoral do flanco norte dos países da OTAN."
 CZE_petr_pavel_event.28.a: "Legal"
 CZE_petr_pavel_event.29.t: "[CZE.GetName] envia Petr Pavel para ajudar nos exercícios"
 CZE_petr_pavel_event.29.d: "Petr Pavel é um general tcheco que deseja ajudar na Operação das Forças Expedicionárias Conjuntas. Essa operação nos fornecerá recursos para fortalecer nosso litoral e aprender melhor a protegê-lo de ataques inimigos."
 CZE_petr_pavel_event.29.a: "Precisamos disso"
 CZE_petr_pavel_event.29.b: "Não, obrigado"
 CZE_petr_pavel_event.30.t: "Petr Pavel volta de Brunssum"
 CZE_petr_pavel_event.30.d: "Mais uma reunião da OTAN em Brunssum terminou. Petr Pavel passou os últimos meses em discussões com outros generais e oficiais para melhorar a segurança da aliança contra qualquer ameaça possível."
 CZE_petr_pavel_event.30.a: "Ok"
 CZE_petr_pavel_event.31.t: "Cúpula da OTAN no País de Gales termina"
 CZE_petr_pavel_event.31.d: "A reunião no País de Gales acabou, e Petr Pavel voltou com nova experiência e conhecimento, que pode usar agora para proteger melhor o nosso país."
 CZE_petr_pavel_event.31.a: "Mais uma reunião encerrada"
 CZE_petr_pavel_event.32.t: "Petr Pavel volta da reunião no quartel-general do SHAPE"
 CZE_petr_pavel_event.32.d: "Petr Pavel foi enviado como representante tcheco ao Quartel-General do SHAPE e, junto com outros representantes, preparou novas doutrinas defensivas para proteger os pontos críticos da aliança."
 CZE_petr_pavel_event.32.a: "Foi uma reunião importante"
 CZE_petr_pavel_event.33.t: "Petr Pavel consegue melhorar as relações com [SOV.GetName]"
 CZE_petr_pavel_event.33.d: "Por causa das recentes ações russas, tivemos de intervir e estabilizar um pouco a situação. Petr Pavel foi enviado ao Kremlin para a reunião e conseguiu melhorar nossas relações mútuas."
 CZE_petr_pavel_event.33.a: "Perfeito"
 CZE_petr_pavel_event.34.t: "[CZE.GetName] envia Petr Pavel ao Iraque"
 CZE_petr_pavel_event.34.d: "O governo tcheco recusou a invasão americana do Iraque e decidiu conter a agressão ajudando o Iraque na 2ª Guerra do Golfo. O alto comando enviou um de seus melhores generais, Petr Pavel, para apoiar as forças iraquianas."
 CZE_petr_pavel_event.34.a: "Isso é traição!"
 CZE_petr_pavel_event.34.b: "Vejam só, como o jogo virou"
 CZE_petr_pavel_event.35.t: "Petr Pavel volta do Iraque"
 CZE_petr_pavel_event.35.d: "Após semanas intensas no Iraque e na cooperação com suas forças contra os soldados americanos, Petr Pavel voltou em segurança ao nosso país, encerrando seu serviço como oficial de ligação."
 CZE_petr_pavel_event.35.a: "Ótimo"
 CZE_petr_pavel_event.36.t: "Petr Pavel encerra reunião no Pentágono"
 CZE_petr_pavel_event.36.d: "Mais uma reunião no Pentágono foi concluída. Os generais discutiram novos problemas para a paz mundial e prepararam alguns planos iniciais de novas estratégias para melhorar a postura defensiva da aliança. De qualquer forma, Petr Pavel fez um bom trabalho cooperando com um de nossos generais do exército, e juntos incluíram observações importantes para melhorar uma das novas estratégias."
 CZE_petr_pavel_event.36.a: "Ah, que bom"
 CZE_petr_pavel_event.37.t: "Petr Pavel volta da Rússia"
 CZE_petr_pavel_event.37.d: "A reunião na Rússia foi muito boa. Petr Pavel conseguiu melhorar nossas relações e foi devidamente recebido pelos políticos russos."
 CZE_petr_pavel_event.37.a: "Bom"
 CZE_petr_pavel_event.38.t: "Petr Pavel volta do Iraque"
 CZE_petr_pavel_event.38.d: "Após a Segunda Guerra do Golfo, o Iraque se viu em uma situação realmente difícil. Petr Pavel aceitou o risco, foi a esse país mergulhado no caos e procurou o governo iraquiano para anunciar que nosso partido apoia sua luta pela liberdade."
 CZE_petr_pavel_event.38.a: "Certo"
 CZE_airforce_event.1.t: "Novo contrato de CAS"
 CZE_airforce_event.1.d: "Companies have offered to purchase 15 of our older Su-25 ground-attack aircraft for spare parts. We can accept the sale or instead purchase 15 Aero L-159 aircraft to strengthen our air force."
 CZE_airforce_event.1.a: "Sell 15 Su-25 aircraft"
 CZE_airforce_event.1.b: "Purchase 15 Aero L-159 aircraft"
 CZE_airforce_event.2.t: "Entre a Rússia e a América"
 CZE_airforce_event.2.d: "Precisamos de equipamentos melhores do que os obsoletos aviões leves. A Rússia e os EUA têm alguns aviões de apoio aéreo aproximado sobrando, mas não podemos negociar com ambos. Precisamos fazer uma escolha."
 CZE_airforce_event.2.a: "As máquinas russas são mais baratas"
 CZE_airforce_event.2.b: "A América nos equipará com coisa melhor"
 CZE_airforce_event.3.t: "[CZE.GetName] compra nosso equipamento"
 CZE_airforce_event.3.d: "O governo tcheco decidiu fazer uma transação com uma de nossas empresas militares. O dinheiro já está em nossa conta."
 CZE_airforce_event.3.a: "Legal"
 CZE_airforce_event.4.t: "Caças modernos"
 CZE_airforce_event.4.d: "Vamos para mais uma rodada de compra de equipamentos. A América tem seu novo F-16 sobrando, a Suécia tem o JAS-39 e a Rússia, o MiG-29. Todos esses aviões são bons, mas não podemos ter todos de uma vez."
 CZE_airforce_event.4.a: "Vamos com a América"
 CZE_airforce_event.4.b: "A força aérea sueca é melhor"
 CZE_airforce_event.4.c: "Os aviões russos são bons o bastante"
 CZE_airforce_event.5.t: "Novos helicópteros de ataque"
 CZE_airforce_event.5.d: "Os EUA e a Itália querem vender alguns de seus helicópteros de ataque. É uma boa oportunidade para comprarmos mais máquinas para a nossa força aérea."
 CZE_airforce_event.5.a: "Compraremos da América"
 CZE_airforce_event.5.b: "A Itália é mais moderna"
 CZE_airforce_event.6.t: "Novos helicópteros de transporte"
 CZE_airforce_event.6.d: "A Rússia e a América querem vender seus helicópteros mais antigos. Claro que a América tem máquinas melhores, mas também mais caras, e há ainda a França, que nos oferece seus novos helicópteros AS-532."
 CZE_airforce_event.6.a: "Clássico, Rússia"
 CZE_airforce_event.6.b: "A América serve"
 CZE_airforce_event.6.c: "Vamos com a França"
 CZE_airforce_event.7.t: "Helicópteros de transporte e de ataque"
 CZE_airforce_event.7.d: "Os russos tentam vender seus helicópteros de ataque, mas os EUA nos oferecem um de seus helicópteros de transporte mais novos. Os custos são maiores e os americanos nos fornecerão menos equipamento, mas essas máquinas estão uma geração acima das russas..."
 CZE_airforce_event.7.a: "Precisamos de helicópteros de ataque"
 CZE_airforce_event.7.b: "Vamos ficar com os helicópteros de transporte"
 CZE_airforce_event.8.t: "Contrato de caças médios"
 CZE_airforce_event.8.d: "A Inglaterra, a Itália e a Rússia estão vendendo alguns de seus novos caças de casco médio. Podemos colocar alguns deles em nosso estoque."
 CZE_airforce_event.8.a: "A Inglaterra é a melhor escolha"
 CZE_airforce_event.8.b: "A Itália é melhor"
 CZE_airforce_event.8.c: "Devemos ficar com a Rússia"
 CZE_airforce_event.9.t: "Contrato de caças avançados"
 CZE_airforce_event.9.d: "A América está ampliando sua política de dissuasão contra a Rússia. Eles podem vender alguns de seus mais novos caças F-35. Por outro lado, a Rússia tem uma contraoferta com seus aviões Su-57. É uma alternativa mais barata, mas receberemos mais aviões deles."
 CZE_airforce_event.9.a: "Os F-35 americanos são os melhores"
 CZE_airforce_event.9.b: "A Rússia tem mais a oferecer"
 CZE_airforce_event.10.t: "Nova geração de helicópteros de ataque"
 CZE_airforce_event.10.d: "A Rússia, a América e a Itália vão exportar seus novos helicópteros de ataque. Como sempre, a Rússia oferece mais equipamento, porém mais barato, enquanto a América oferece o mais avançado. Também podemos pensar na Itália, que é um bom meio-termo entre as duas."
 CZE_airforce_event.10.a: "Vamos ficar com a Rússia"
 CZE_airforce_event.10.b: "Mais qualidade, América"
 CZE_airforce_event.10.c: "A Itália é um bom meio-termo"
 CZE_airforce_event.11.t: "Compra de aeronaves de transporte"
 CZE_airforce_event.11.d: "Às vezes precisamos comprar equipamentos mais antigos para manter nossa força aérea em alto nível. Aviões de transporte ajudarão nossos helicópteros a distribuir suprimentos e a lançar nossos paraquedistas."
 CZE_airforce_event.11.a: "França"
 CZE_airforce_event.11.b: "América"
 CZE_Army_2000.01.a: "Comprar blindados de transporte austríacos"
 CZE_Army_2000.01.b: "Negociar um acordo com a Polônia"
 CZE_Army_2000.01.c: "Desenvolver blindados de transporte nacionais"
 CZE_Army_2000.02.t: "Escolhendo nossa solução antiaérea autopropulsada"
 CZE_Army_2000.02.d: "A modernização das forças de defesa aérea da República Tcheca chegou a um ponto crucial. Com a crescente necessidade de sistemas antiaéreos móveis, precisamos agora decidir qual é a solução antiaérea autopropulsada (SPAA) mais adequada para as nossas forças armadas. Três opções se apresentam: o alemão Flugabwehrkanonenpanzer Gepard, renomado por sua precisão e experiência em combate; o chinês Type 95 SPAAA, conhecido por seu baixo custo e facilidade de produção; e o nosso próprio programa STROP 2, que promete independência e benefícios industriais, mas exige mais desenvolvimento. Essa decisão crucial afetará nossa estratégia de defesa e nossas parcerias nos anos vindouros."
 CZE_Army_2000.02.a: "Comprar o Gepard alemão"
 CZE_Army_2000.02.b: "Comprar o Type 95 SPAAA chinês"
 CZE_Army_2000.02.c: "Continuar o desenvolvimento do STROP 2"
 CZE_Army_2000.03.t: "Escolhendo nosso próximo veículo de combate de infantaria"
 CZE_Army_2000.03.d: "A modernização das nossas forças mecanizadas está em um momento crítico. Para garantir que a infantaria da República Tcheca possa operar com eficácia nos campos de batalha modernos, precisamos escolher um novo Veículo de Combate de Infantaria (IFV) para substituir nossos modelos envelhecidos. Três opções se apresentam: o alemão Marder, um IFV muito respeitado e confiável, com experiência comprovada em combate; o russo BMP-2M, que oferece poder de fogo e baixo custo, mas levanta preocupações quanto a laços geopolíticos; e o nacional OT-90M1, que dá a oportunidade de apoiar nossa própria indústria de defesa, embora ainda exija mais desenvolvimento. A escolha que fizermos moldará as capacidades e as alianças das nossas forças armadas nos anos vindouros."
 CZE_Army_2000.03.a: "Adquirir o Marder alemão"
 CZE_Army_2000.03.b: "Comprar o BMP-2M russo"
 CZE_Army_2000.03.c: "Desenvolver o OT-90M1 nacional"
 CZE_Army_2000.04.t: "Escolhendo nosso próximo veículo utilitário"
 CZE_Army_2000.04.d: "A modernização da nossa frota de veículos utilitários é crucial para melhorar a mobilidade e a eficiência logística das Forças Armadas Tchecas. Após uma avaliação cuidadosa, surgiram três opções: o alemão ATF Dingo, conhecido por sua durabilidade e proteção em ambientes hostis; o britânico Land Rover Wolf, uma opção confiável e versátil, amplamente usada pelas forças da OTAN; e o italiano Iveco LMV, que oferece design moderno e adaptabilidade multifuncional. Cada veículo apresenta vantagens diferentes em termos de proteção, custo e parcerias estratégicas. A escolha que fizermos definirá as capacidades e a força logística das nossas forças nos anos vindouros."
 CZE_Army_2000.04.a: "Escolher o ATF Dingo"
 CZE_Army_2000.04.b: "Escolher o Land Rover Wolf"
 CZE_Army_2000.04.c: "Escolher o Iveco LMV"
 CZE_Army_2000.05.t: "Escolhendo nosso próximo carro de combate principal"
 CZE_Army_2000.05.d: "À medida que modernizamos nossas forças blindadas, a necessidade de uma nova geração de Carros de Combate Principais (MBTs) tornou-se crítica. Após avaliar as melhores opções disponíveis, reduzimos as escolhas a três: o alemão Leopard, renomado por sua engenharia de precisão e domínio no campo de batalha; o francês Leclerc, um carro altamente avançado e versátil, com tecnologia de ponta; e o russo T-90, que oferece um equilíbrio entre baixo custo, durabilidade e poder de fogo. Cada opção traz seus próprios pontos fortes e possíveis ramificações geopolíticas. A escolha que fizermos definirá o futuro das nossas forças blindadas e influenciará nossas relações internacionais."
 CZE_Army_2000.05.a: "Comprar o Leopard alemão"
 CZE_Army_2000.05.b: "Comprar o Leclerc francês"
 CZE_Army_2000.05.c: "Comprar o T-90 russo"
 CZE_Army_2010.01.t: "Escolhendo nosso novo sistema de mísseis antitanque guiados"
 CZE_Army_2010.01.d: "À medida que as ameaças blindadas continuam a evoluir, tornou-se imperativo que o Exército Tcheco adquira um sistema moderno e confiável de Mísseis Antitanque Guiados (ATGM), capaz de neutralizar tanques e veículos blindados inimigos com precisão e eficácia. Após avaliações minuciosas, três opções principais foram selecionadas: o sistema israelense Spike, conhecido por sua orientação avançada e versatilidade; o francês Milan 2, um ATGM comprovado e amplamente usado, com sólido desempenho em combate; e o russo Kornet, que oferece excelente alcance e poder de fogo a um custo mais acessível. Cada escolha tem vantagens próprias, mas também traz implicações diplomáticas e estratégicas. A decisão que tomarmos moldará nossas capacidades antiblindagem num futuro próximo."
 CZE_Army_2010.01.a: "Adquirir o Spike israelense"
 CZE_Army_2010.01.b: "Adquirir o Milan 2 francês"
 CZE_Army_2010.01.c: "Adquirir o Kornet russo"
 CZE_Army_2010.02.t: "Escolhendo nosso carro de combate principal de nova geração"
 CZE_Army_2010.02.d: "O ritmo acelerado dos avanços tecnológicos na guerra blindada tornou essencial que o Exército Tcheco adote um novo Carro de Combate Principal (MBT) capaz de enfrentar os desafios do combate moderno. Temos agora três opções avançadas para as nossas forças blindadas: o alemão Leopard 2A6, um carro altamente confiável e testado em batalha, com precisão e proteção incomparáveis; o francês Leclerc S2, que ostenta controle de tiro e mobilidade de ponta; e o russo T-90A, um desenvolvimento adicional da plataforma T-90, com poder de fogo aprimorado e boa relação custo-benefício. Cada um desses carros tem seus próprios pontos fortes, e a escolha que fizermos determinará nossas capacidades militares e alianças na próxima década."
 CZE_Army_2010.02.a: "Escolher o Leopard 2A6 alemão"
 CZE_Army_2010.02.b: "Escolher o Leclerc S2 francês"
 CZE_Army_2010.02.c: "Escolher o T-90A russo"
 CZE_Army_2010.03.t: "Escolhendo nosso novo veículo blindado de transporte de pessoal"
 CZE_Army_2010.03.d: "Em 2010, o Exército Tcheco enfrenta a necessidade de modernizar sua frota de Veículos Blindados de Transporte de Pessoal (APC) para garantir a mobilidade e a segurança da nossa infantaria. Após avaliar várias opções, reduzimos as escolhas a três: o austríaco Pandur II KOV-S, um APC sobre rodas moderno e bem blindado, com excelente modularidade; o russo BTR-82, um APC acessível e testado em combate, com capacidade anfíbia; ou a modernização da nossa atual frota OT ZuBR a um padrão moderno, o que fortalecerá a produção nacional, ao custo de mais atrasos na entrega. A decisão que tomarmos moldará a futura mobilidade e proteção das nossas unidades de infantaria."
 CZE_Army_2010.03.a: "Selecionar o Pandur II KOV-S austríaco"
 CZE_Army_2010.03.b: "Selecionar o BTR-82 russo"
 CZE_Army_2010.03.c: "Modernizar a frota OT ZuBR"
 CZE_Army_2010.04.t: "Escolhendo nosso novo sistema de artilharia autopropulsada"
 CZE_Army_2010.04.d: "Em 2010, o Exército Tcheco precisa atualizar suas capacidades de artilharia para atender às exigências da guerra moderna. Nossos sistemas atuais carecem do alcance, da precisão e da mobilidade necessários para um apoio eficaz no campo de batalha. Temos três opções a considerar: o francês CAESAR, um sistema de artilharia altamente móvel e preciso; o eslovaco Zuzana 2, que oferece excelente alcance e poder de fogo sobre chassi com rodas; e o russo Msta-S, um sistema de artilharia autopropulsada sobre esteiras, comprovado e com poder de fogo substancial. A decisão que tomarmos definirá o apoio de artilharia com que nosso exército poderá contar em operações futuras."
 CZE_Army_2010.04.a: "Selecionar o CAESAR francês"
 CZE_Army_2010.04.b: "Selecionar o Zuzana 2 eslovaco"
 CZE_Army_2010.04.c: "Selecionar o Msta-S russo"
 CZE_Army_2010.05.t: "Escolhendo nosso novo fuzil de serviço"
 CZE_Army_2010.05.d: "Em 2010, o Exército Tcheco busca modernizar o fuzil padrão da infantaria para melhorar a eficácia e a confiabilidade em combate. Após avaliar várias opções de destaque, temos três candidatos: o americano Remington R4, conhecido por sua versatilidade e design modular; a belga FN Minimi, uma metralhadora leve amplamente reconhecida por sua confiabilidade e poder de fogo; ou a nacional CZ 805 BREN, que oferece um design moderno e ainda apoia nossa indústria local. A escolha do nosso novo fuzil moldará o futuro das capacidades de combate da nossa infantaria e influenciará nossa base industrial."
 CZE_Army_2010.05.a: "Selecionar o Remington R4"
 CZE_Army_2010.05.b: "Selecionar a FN Minimi"
 CZE_Army_2010.05.c: "Selecionar a CZ 805 BREN"
 CZE_Army_2010.06.t: "Escolhendo nosso novo veículo utilitário"
 CZE_Army_2010.06.d: "Em 2010, a frota de veículos utilitários do Exército Tcheco precisa ser modernizada para melhorar a mobilidade e o apoio logístico das forças terrestres. Após uma avaliação cuidadosa, três opções se destacam: a confiável Toyota Hilux, conhecida por sua durabilidade e adaptabilidade em condições adversas; o Land Rover Defender, um veículo versátil com excelente capacidade fora de estrada; e o Mercedes-Benz Classe G (G-Wagon), que oferece forte desempenho e flexibilidade em operações militares. Cada veículo oferece vantagens diferentes em custo, versatilidade e durabilidade a longo prazo. A escolha que fizermos moldará nossas capacidades de mobilidade e logística nos próximos anos."
 CZE_Army_2010.06.a: "Selecionar a Toyota Hilux"
 CZE_Army_2010.06.b: "Selecionar o Land Rover Defender"
 CZE_Army_2010.06.c: "Selecionar o Mercedes-Benz Classe G (G-Wagon)"
 CZE_Army_2010.07.t: "Escolhendo nosso novo veículo de combate de infantaria"
 CZE_Army_2010.07.d: "A infantaria mecanizada do Exército Tcheco precisa de um Veículo de Combate de Infantaria (IFV) moderno e confiável para apoiar as operações e aumentar a proteção no campo de batalha. Em 2010, reduzimos as escolhas a três veículos muito capazes: o russo BMP-3, conhecido por sua versatilidade e poder de fogo; o alemão PUMA, que oferece blindagem e tecnologia avançadas; e o sueco CV90, um IFV comprovado e equilibrado, com excelente mobilidade. Cada escolha oferece pontos fortes únicos, da boa relação custo-benefício a recursos de ponta, e terá papel vital na definição do futuro das nossas forças mecanizadas."
 CZE_Army_2010.07.a: "Selecionar o BMP-3 russo"
 CZE_Army_2010.07.b: "Selecionar o PUMA alemão"
 CZE_Army_2010.07.c: "Selecionar o CV90 sueco"
 CZE_Army_2010.08.t: "Escolhendo nosso novo sistema antiaéreo autopropulsado"
 CZE_Army_2010.08.d: "Em 2010, a defesa aérea tornou-se cada vez mais importante à medida que as ameaças aéreas evoluem. O Exército Tcheco deve escolher um novo sistema antiaéreo autopropulsado (SPAA) para garantir que nossas forças estejam bem protegidas contra aeronaves e mísseis inimigos. Temos três opções a considerar: o sueco LvKv 9040C, um veículo antiaéreo móvel e altamente eficaz; o russo Pantsir, que combina sistemas de mísseis e canhões para uma defesa aérea versátil; ou o israelense SPYDER, um sistema altamente móvel capaz de se defender de uma ampla gama de ameaças aéreas. Cada sistema oferece vantagens diferentes em mobilidade, poder de fogo e flexibilidade operacional."
 CZE_Army_2010.08.a: "Selecionar o LvKv 9040C sueco"
 CZE_Army_2010.08.b: "Selecionar o Pantsir russo"
 CZE_Army_2010.08.c: "Selecionar o SPYDER israelense"
 CZE_Army_2010.09.t: "Escolhendo nosso novo sistema de defesa aérea portátil"
 CZE_Army_2010.09.d: "Para reforçar a capacidade do Exército Tcheco de se defender de ameaças aéreas, devemos modernizar nossos Sistemas de Defesa Aérea Portáteis (MANPADS) em 2010. Após avaliar as opções disponíveis, temos três escolhas: o sueco RBS 70, conhecido por sua precisão guiada a laser; o russo Verba, que oferece excelentes capacidades em qualquer clima; ou o americano Stinger, um sistema amplamente usado e altamente eficaz nas forças da OTAN. A escolha que fizermos melhorará a capacidade da nossa infantaria de neutralizar aeronaves e drones inimigos, protegendo nossos céus em operações futuras."
 CZE_Army_2010.09.a: "Selecionar o RBS 70 sueco"
 CZE_Army_2010.09.b: "Selecionar o Verba russo"
 CZE_Army_2010.09.c: "Selecionar o Stinger americano"
 CZE_Army_2020.01.t: "Escolhendo nosso novo veículo utilitário para 2020"
 CZE_Army_2020.01.d: "Em 2020, a frota de veículos utilitários do Exército Tcheco deve ser modernizada para melhorar a mobilidade, a durabilidade e o apoio a operações em ambientes diversos. Após analisar as opções atuais, três veículos se destacam: a confiável e robusta Toyota Hilux 2020, conhecida por seu desempenho fora de estrada e adaptabilidade; o americano Joint Light Tactical Vehicle (JLTV), que oferece proteção e mobilidade avançadas para operações militares; e o alemão Mercedes-Benz Classe G (G 300 CDI), um veículo militar comprovado, com excelente versatilidade e capacidade fora de estrada. Cada veículo oferece vantagens diferentes em custo, durabilidade e desempenho, e a escolha que fizermos moldará nossas capacidades logísticas na próxima década."
 CZE_Army_2020.01.a: "Selecionar a Toyota Hilux 2020"
 CZE_Army_2020.01.b: "Selecionar o JLTV americano"
 CZE_Army_2020.01.c: "Selecionar o Mercedes-Benz G 300 CDI"
 CZE_Army_2020.02.t: "Escolhendo nosso novo veículo blindado de transporte de pessoal para 2020"
 CZE_Army_2020.02.d: "Para melhorar a mobilidade e a proteção das tropas, o Exército Tcheco deve modernizar sua frota de Veículos Blindados de Transporte de Pessoal (APC) em 2020. Após avaliar as melhores opções disponíveis, reduzimos as escolhas a três APCs avançados: a série finlandesa Sisu/Patria XA, uma plataforma sobre rodas bem testada e altamente modular; o austríaco Pandur 3, que oferece proteção moderna e versatilidade; e o russo Kurganets-25, um veículo avançado sobre esteiras, com blindagem e poder de fogo superiores. Cada opção oferece benefícios estratégicos diferentes em proteção, poder de fogo e mobilidade, e a decisão que tomarmos determinará a futura eficácia das nossas forças mecanizadas."
 CZE_Army_2020.02.a: "Selecionar a série finlandesa Sisu/Patria XA"
 CZE_Army_2020.02.b: "Selecionar o Pandur 3 austríaco"
 CZE_Army_2020.02.c: "Selecionar o Kurganets-25 russo"
 CZE_Army_2020.03.t: "Escolhendo nosso novo carro de combate principal para 2020"
 CZE_Army_2020.03.d: "À medida que a guerra de tanques continua a evoluir, o Exército Tcheco precisa atualizar sua frota de Carros de Combate Principais (MBT) para continuar competitivo no campo de batalha moderno. Em 2020, estamos considerando três dos MBTs mais avançados disponíveis: o alemão Leopard 2A8, que oferece blindagem, poder de fogo e consciência situacional superiores; o americano M1A2 SEPv3, conhecido por sua eletrônica avançada, durabilidade e poder de fogo; e o russo T-14 Armata, com sistemas de proteção ativa de ponta e um revolucionário design de torre não tripulada. Cada carro traz vantagens significativas em poder de fogo, proteção e tecnologia. O carro que escolhermos definirá a força e a capacidade futuras das nossas divisões blindadas."
 CZE_Army_2020.03.a: "Selecionar o Leopard 2A8 alemão"
 CZE_Army_2020.03.b: "Selecionar o M1A2 SEPv3 americano"
 CZE_Army_2020.03.c: "Selecionar o T-14 Armata russo"
 CZE_Army_2020.04.t: "Escolhendo nosso novo veículo de combate de infantaria para 2020"
 CZE_Army_2020.04.d: "Em 2020, o Exército Tcheco deve modernizar sua frota de Veículos de Combate de Infantaria (IFV) para oferecer maior proteção, mobilidade e poder de fogo à nossa infantaria mecanizada. Estamos considerando agora três grandes concorrentes: o chinês Type 08, um veículo sobre rodas versátil e bem armado; o alemão Lynx, um IFV de nova geração conhecido por seu design modular e sistemas de proteção avançados; e o russo VPK-7829 Bumerang, um veículo poderoso e fortemente blindado, com fortes capacidades anfíbias. Cada opção oferece vantagens únicas, e o IFV que escolhermos terá papel vital na definição das capacidades das nossas forças mecanizadas nos anos vindouros."
 CZE_Army_2020.04.a: "Selecionar o Type 08 chinês"
 CZE_Army_2020.04.b: "Selecionar o Lynx alemão"
 CZE_Army_2020.04.c: "Selecionar o VPK-7829 Bumerang russo"
 CZE_Army_2020.05.t: "Escolhendo nossa nova artilharia autopropulsada para 2020"
 CZE_Army_2020.05.d: "Para manter a superioridade no campo de batalha, o Exército Tcheco deve modernizar seus sistemas de artilharia autopropulsada em 2020. Após uma avaliação cuidadosa, três opções avançadas estão na mesa: o Vz. 77 DANA tcheco modernizado, um sistema de artilharia sobre rodas comprovado; o americano M142 HIMARS, uma plataforma de artilharia de foguetes altamente móvel e precisa; e o sistema de artilharia sueco Archer, renomado por sua capacidade de tiro rápido e precisão de longo alcance. Cada sistema oferece vantagens únicas em mobilidade, poder de fogo e alcance, e o que escolhermos determinará as futuras capacidades das nossas forças de artilharia."
 CZE_Army_2020.05.a: "Selecionar o Vz. 77 DANA tcheco"
 CZE_Army_2020.05.b: "Selecionar o M142 HIMARS americano"
 CZE_Army_2020.05.c: "Selecionar o sistema de artilharia sueco Archer"
 CZE_TV_Crisis.01.t: "Interrupção do sinal na Televisão Tcheca"
 CZE_TV_Crisis.01.d: "Jan Bobošíkov interrompeu o sinal da Televisão Tcheca, tomando medidas controversas contra a direção e os repórteres da emissora. Os repórteres da TV entraram em greve, exigindo sua remoção e protestando contra sua interferência. A situação está se agravando, e o público começa a tomar partido. O governo deve agora decidir se apoia os manifestantes, alinhando-se às suas exigências de independência jornalística, ou se ignora a questão e permite que Bobošíkov continue no controle."
 CZE_TV_Crisis.01.a: "Apoiar os protestos"
 CZE_TV_Crisis.01.b: "Ignorar a crise"
 CZE_TV_Crisis.02.t: "Os protestos têm sucesso!"
 CZE_TV_Crisis.02.d: "Os manifestantes da Televisão Tcheca conseguiram! Jan Bobošíkov foi removido do cargo e a greve terminou, com o apoio público à independência jornalística em seu nível mais alto. A vitória dos manifestantes levou a maior estabilidade no país, e o partido governante ganhou força política por ficar ao lado do povo."
 CZE_TV_Crisis.02.a: "Comemorar o sucesso dos manifestantes"
 CZE_TV_Crisis.03.t: "Bobošíkov vence a crise"
 CZE_TV_Crisis.03.d: "Apesar dos esforços dos manifestantes, Jan Bobošíkov venceu a crise da TV, mantendo o controle da Televisão Tcheca. O público está desiludido, e o partido governante sofreu por se alinhar a uma causa perdida. A estabilidade diminuiu, e o apoio ao governo se reduziu."
 CZE_TV_Crisis.03.a: "Lidar com as consequências"
 CZE_TV_Crisis.04.t: "A situação se acalma"
 CZE_TV_Crisis.04.d: "A crise na Televisão Tcheca se resolveu por conta própria, sem a intervenção do governo. Embora ainda reste algum descontentamento público, a situação se acalmou e a estabilidade foi parcialmente restaurada. A decisão do governo de permanecer neutro permitiu que a questão se dissipasse sem mais danos políticos."
 CZE_TV_Crisis.04.a: "Seguir em frente"
 CZE_TV_Crisis.05.t: "A crise se agrava"
 CZE_TV_Crisis.05.d: "Ao ignorar a crise na Televisão Tcheca, o governo permitiu que a situação saísse do controle. O descontentamento público cresceu, e o partido governante é visto como ineficaz e desconectado. A estabilidade do país diminuiu, e o partido governante sofreu uma perda significativa de popularidade."
 CZE_TV_Crisis.05.a: "Enfrentar a crise"
 czech_focus: "Árvore de Focos da República Tcheca"
 CZE_military_motorization: "Motorização Militar"
 CZE_military_motorization_desc: "Nossa forte indústria automotiva também serve em grande parte ao desenvolvimento do exército. Graças a isso, somos pioneiros na indústria automotiva da Europa Central e Oriental."
 CZE_motorization_industry: "Indústria de Motorização"
 CZE_motorization_industry_desc: "Graças às fábricas da Škoda, somos capazes de aprimorar nossas máquinas e depois vendê-las no mercado externo. Além disso, a cooperação com a alemã Volkswagen só nos dá mais vento nas velas."
 CZE_implement_new_technologies: "Implementar Novas Tecnologias"
 CZE_implement_new_technologies_desc: "Quanto mais rápido ampliarmos o escopo de nossa pesquisa, mais rápido nos distanciaremos de nossa concorrência. O exército tcheco pode não ser grande, mas compensamos com veículos bem construídos."
 CZE_decrease_fuel_usage: "Reduzir o Consumo de Combustível"
 CZE_decrease_fuel_usage_desc: "Quanto mais pesados são nossos veículos, mais combustível consomem. Por isso, desenvolveremos um novo sistema de injeção de combustível para o motor e aumentaremos a eficiência do próprio combustível, para que nossos novos veículos possam percorrer distâncias ainda maiores."
 CZE_vop_cz: "VOP CZ"
 CZE_vop_cz_desc: "A VOP CZ é uma empresa estatal voltada para tecnologia militar, produção e desenvolvimento de engenharia. A empresa possui seu próprio centro de desenvolvimento, com projetos usados no exército, nas forças de segurança e no setor civil. A empresa é especializada em reparos e modernização de equipamentos militares, e atua principalmente nessa área."
 CZE_thicker_mexas_armour: "Blindagem MEXAS Mais Espessa"
 CZE_thicker_mexas_armour_desc: "O Sistema de Blindagem Modular Expansível (MEXAS) é um sistema de blindagem composta desenvolvido pela empresa alemã IBD Deisenroth Engineering. Aumentaremos sua resistência a danos adicionando várias novas camadas de proteção."
 CZE_apc_improvement: "Melhoria dos Blindados de Transporte"
 CZE_apc_improvement_desc: "Os veículos blindados de transporte de pessoal são ótimos para o combate urbano e ideais para terreno plano. Graças às tecnologias da VOP CZ, podemos nos concentrar em aprimorar esses veículos para adaptá-los a condições de condução mais difíceis."
 CZE_adaptation_to_urban_fight_tactics: "Adaptação às Táticas de Combate Urbano"
 CZE_adaptation_to_urban_fight_tactics_desc: "Temos apenas algumas cidades realmente grandes. Se as perdermos, não conseguiremos controlar os movimentos de nosso próprio exército e os suprimentos podem ficar severamente limitados. Devemos fortalecer nossos principais alvos estratégicos para evitar que sejam tomados pelo inimigo."
 CZE_light_armour_production: "Produção de Blindagem Leve"
 CZE_light_armour_production_desc: "A blindagem leve para nossos blindados de transporte aumentará sua mobilidade e, quando reforçada com uma liga metálica apropriada, será muito mais durável do que nunca."
 CZE_heavy_armour_production: "Produção de Blindagem Pesada"
 CZE_heavy_armour_production_desc: "É melhor escolher tanques antigos e comprovados. O inimigo usará muitos tipos de armas para nos privar de suprimentos, por isso devemos estar prontos para resistir a qualquer ataque possível."
 CZE_dyna_reactive_armour_upgrade: "Melhoria da Blindagem Reativa DYNA"
 CZE_dyna_reactive_armour_upgrade_desc: "A nova variante de blindagem DYNA aumenta a resistência de nossos tanques a danos cinéticos, o que lhes permitirá sobreviver por mais tempo em combate."
 CZE_wake_up_tanks_industry: "Despertar a Indústria de Tanques"
 CZE_wake_up_tanks_industry_desc: "Após a queda do governo comunista, a economia teve de ser reconstruída, e por isso negligenciamos nossas forças armadas. Devemos ao menos restaurar parcialmente uma produção eficiente de tanques."
 CZE_catch_up_with_new_technology: "Acompanhar as Novas Tecnologias"
 CZE_catch_up_with_new_technology_desc: "Podemos acelerar nossa pesquisa por um preço. No entanto, vale a pena considerar o momento certo para isso, pois não podemos financiar a Škoda para sempre."
 CZE_tatra_trucks: "Caminhões Tatra"
 CZE_tatra_trucks_desc: "A Tatra é uma fabricante tcheca de veículos de Kopřivnice. Pertence à empresa TATRA TRUCKS a.s. e é a terceira empresa mais antiga do mundo na produção de veículos motorizados com uma história ininterrupta. Graças ao desenvolvimento dessa empresa, podemos melhorar nossos veículos de transporte e adaptá-los a diversos terrenos."
 CZE_tatra_810: "Tatra 810"
 CZE_tatra_810_desc: "A tração 6x6 do novo caminhão Tatra é uma ótima solução para superar até os maiores obstáculos. Será excelente para combater em um campo de batalha acidentado."
 CZE_reduce_terrain_penalty: "Reduzir Penalidade de Terreno"
 CZE_reduce_terrain_penalty_desc: "No leste do país temos muitas montanhas, e o rio Vltava corre ao norte, na Boêmia. Assim, temos condições ideais para treinar em todos os tipos de terreno encontrados na Europa. Vamos aproveitar isso."
 CZE_new_skoda_factory: "Expandir a Fábrica Škoda"
 CZE_new_skoda_factory_desc: "Estamos prontos para a grande inauguração da fábrica Škoda ampliada em Vrchlabí. Isso nos permitirá desenvolver nossa primeira geração de carros Škoda Superb. Infelizmente, tudo custa dinheiro, mas podemos fazer algo a respeito."
 CZE_navigation_systems: "Sistemas de Navegação"
 CZE_navigation_systems_desc: "Graças à conexão com o satélite, podemos implementar novas tecnologias militares. Infelizmente, ela é importante demais para nosso exército, então não revelaremos seus detalhes por ora e a pesquisaremos por conta própria."
 CZE_new_r4_engine_version: "Nova Versão do Motor R4"
 CZE_new_r4_engine_version_desc: "É hora de alcançar a produção de motores. Graças aos motores a gasolina R4 convertidos, nossos veículos ganharão aceleração, e o uso de materiais de melhor qualidade aumentará sua confiabilidade."
 CZE_modernize_r6_engines: "Modernizar Motores V6"
 CZE_modernize_r6_engines_desc: "Equivalentes mais potentes dos motores R4 permitirão que nossa indústria automotiva abra caminho para novas versões dos motores atuais, seguindo o exemplo de empresas estrangeiras."
 CZE_production_of_twin_turbocharged_v12: "Produção de V12 Biturbo"
 CZE_production_of_twin_turbocharged_v12_desc: "Os motores V12 da Tatra podem ser usados por nosso exército para dar mais potência aos nossos tanques. Basta modificar um pouco os motores civis e teremos um módulo bastante bom."
 CZE_x_engines_focus: "Foco nos Motores X"
 CZE_x_engines_focus_desc: "O moderno motor ISX15 ainda não foi usado em nossas fábricas. Podemos mudar isso graças a contratos estrangeiros e ao trabalho de nossos centros de pesquisa, cujo objetivo atual é criar nossa própria versão desse motor."
 CZE_overcharged_engines: "Motores X12 Sobrealimentados"
 CZE_overcharged_engines_desc: "Os motores X12 generosamente sobrealimentados podem oferecer um pouco menos de confiabilidade, mas no campo de batalha serão ótimos para se deslocar com eficiência do ponto A ao ponto B."
 CZE_decrease_production_cost: "Reduzir Custo de Produção do X12"
 CZE_decrease_production_cost_desc: "Podemos economizar em materiais mantendo a confiabilidade do motor, mas nossas máquinas terão uma velocidade máxima mais limitada."
 CZE_2_0_tdi_engines: "Motores 2.0 TDI"
 CZE_2_0_tdi_engines_desc: "Um pouco mais pesadas e caras de produzir, as novas versões dos motores TDI podem aumentar a capacidade de combate de nossos veículos de forma mais significativa do que os motores TSI."
 CZE_2_0_tsi_engines: "Motores 2.0 TSI"
 CZE_2_0_tsi_engines_desc: "Os motores TSI podem não oferecer as mesmas capacidades das versões TDI, mas são mais leves e mais baratos de produzir."
 CZE_electric_engines_focus: "Foco nos Motores Elétricos"
 CZE_electric_engines_focus_desc: "Já passou da hora de começar a produzir motores elétricos. Precisamos acelerar nossa pesquisa se quisermos alcançar a concorrência."
 CZE_modern_electric_engine: "Motor Elétrico Moderno"
 CZE_modern_electric_engine_desc: "Após longa pesquisa, estamos prontos para entrar em uma nova era de veículos elétricos. Os motores elétricos são ótimos substitutos dos motores de combustão comuns."
 CZE_improve_r4_engines_to_max_efficiency: "Melhorar Motores R4 ao Máximo de Eficiência"
 CZE_improve_r4_engines_to_max_efficiency_desc: "Extraímos o máximo possível dos motores R4 padrão. Essas versões modernas darão aos nossos veículos mobilidade extremamente alta."
 CZE_further_r6_development: "Mais Desenvolvimento do V6"
 CZE_further_r6_development_desc: "Os motores R4 são um assunto encerrado. Escolheremos nosso futuro nas novas gerações de motores R6 e V6."
 CZE_skoda_superb_i: "Škoda Superb I"
 CZE_skoda_superb_i_desc: "Graças ao novo modelo Superb, nosso mercado começará a gerar lucros inimaginavelmente altos. Estamos prontos para iniciar a produção a qualquer momento e, com o dinheiro arrecadado, abriremos um novo centro de pesquisa que aprimorará tanto os veículos civis Škoda quanto as máquinas militares da República Tcheca."
 CZE_go_ahead_our_era: "Avante, Nossa Era"
 CZE_go_ahead_our_era_desc: "Estamos prontos para entrar em uma nova fase da motorização. Graças à energia de nossas usinas nucleares, suportaremos o aumento repentino do consumo de energia e nossa indústria se desenvolverá ainda melhor."
 CZE_new_electric_engine_prototype: "Protótipo de Novo Motor Elétrico"
 CZE_new_electric_engine_prototype_desc: "Antes de lançar um novo motor no mercado, precisamos ter certeza de que ele será o mais livre de falhas possível. Criaremos vários protótipos e escolheremos qual motor nos representará."
 CZE_skoda_superb_ii: "Škoda Superb II"
 CZE_skoda_superb_ii_desc: "A nova geração dos carros Superb, lançada em 2008, é a primeira grande atualização desse modelo. Novas tecnologias implementadas, incluindo GPS, aumentaram o conforto ao dirigir. Graças à produção desse veículo, a demanda por nossos produtos voltará a crescer, o que nos permitirá fazer novos investimentos."
 CZE_skoda_superb_iii: "Škoda Superb III"
 CZE_skoda_superb_iii_desc: "Mais um marco no aprimoramento do modelo Superb, criado em 2015. Graças a motores novos e melhores, o Škoda Superb III tem muito mais potência que seu antecessor, e a tecnologia em constante evolução garante ainda mais segurança do que os antigos sensores de estacionamento comuns."
 CZE_skoda_superb_iv: "Škoda Superb IV"
 CZE_skoda_superb_iv_desc: "A mais recente geração do modelo Superb, desenvolvida em 2023. Motores aprimorados mais uma vez, o maior conforto ao dirigir e uma reputação impecável nos permitirão dominar novamente o mercado externo. Como a indústria automotiva está lentamente entrando em um caminho totalmente novo, não ficaremos para trás e começaremos a trabalhar em nossa própria \"rodovia de recarga\", atualmente projetada nos EUA e na Suécia."
 CZE_stay_with_the_giant: "Ficar com o Gigante"
 CZE_stay_with_the_giant_desc: "O Grupo Volkswagen é uma das melhores coisas que já nos aconteceram. Não há necessidade de mudar de rumo e continuaremos a desfrutar dos benefícios de pertencer a ele. Tanto nós quanto a economia tcheca nos beneficiaremos disso."
 CZE_easier_access_to_multicontinental_market: "Acesso Facilitado ao Mercado Internacional"
 CZE_easier_access_to_multicontinental_market_desc: "Graças ao Grupo VW, temos maiores oportunidades de comércio exterior. Usaremos isso para aumentar nossa influência no mercado oriental."
 CZE_skoda_auto_volkswagen_india: "Škoda Auto Volkswagen Índia"
 CZE_skoda_auto_volkswagen_india_desc: "Em cooperação com a Volkswagen, estamos prontos para abrir novas fábricas na Índia. Isso nos aproximará da China e da receita extraordinária que poderemos obter de seu mercado."
 CZE_chinese_market: "Mercado Chinês"
 CZE_chinese_market_desc: "Aconteceu: a Škoda inicia a produção na China. Graças à nova e ampla cooperação com empresas chinesas, podemos novamente aumentar a eficiência de nossa produção e fortalecer nossa posição, já sólida, no mercado internacional."
 CZE_a_new_way_forward: "Um Novo Caminho à Frente"
 CZE_a_new_way_forward_desc: "Permanecer no Grupo Volkswagen foi uma boa ideia. Nossos investimentos no mercado externo e no desenvolvimento tecnológico renderam lucros extraordinários."
 CZE_electric_engines_research: "Pesquisa de Novos Motores"
 CZE_electric_engines_research_desc: "O Grupo Volkswagen nos dá acesso a vários centros de pesquisa e desenvolvimento. Vamos usá-los para acelerar nossa pesquisa sobre motores de automóveis."
 CZE_take_a_look_into_the_future_of_motorization: "Um Olhar para o Futuro da Motorização"
 CZE_take_a_look_into_the_future_of_motorization_desc: "Dirigir uma grande empresa envolve preparar planos de longo prazo. Devemos escolher a estratégia de negócios certa para garantir a melhor produção possível em nossas fábricas."
 CZE_accept_the_ecological_limitations: "Aceitar as Limitações Ecológicas"
 CZE_accept_the_ecological_limitations_desc: "Infelizmente, a União Europeia impõe certas restrições de gases de escape a outros países. Precisamos cumprir esses requisitos se não quisermos sofrer consequências financeiras."
 CZE_volkswagen_how_many_cars_does_he_have: "Volkswagen? Quantos Carros Ele Tem?"
 CZE_volkswagen_how_many_cars_does_he_have_desc: "Não podemos mais fingir que nada está acontecendo. Não permitiremos que a Volkswagen engane seus clientes e poremos fim a essas ações!"
 CZE_strategy_to_take_over_volkswagen: "Estratégia para Assumir a Volkswagen"
 CZE_strategy_to_take_over_volkswagen_desc: "A Volkswagen é há muito tempo a líder de seu grupo. Não será fácil assumir o controle, mas precisamos confiar em nossos estrategistas de negócios."
 CZE_save_funds: "Poupar Fundos"
 CZE_save_funds_desc: "Precisamos preparar investimentos significativos para convencer outras empresas a nos apoiar. Elas precisam saber que podemos liderar essa comunidade."
 CZE_friends_and_enemies: "Amigos e Inimigos"
 CZE_friends_and_enemies_desc: "É hora de começar a negociar com outras empresas. A Volkswagen não ficará feliz com isso e certamente tentará nos deter, mas temos de aceitar esse risco."
 CZE_attack_german_influence: "Atacar a Influência Alemã"
 CZE_attack_german_influence_desc: "Com o apoio de nosso governo, poderemos pressionar mais a Alemanha, o que acabará nos permitindo assumir a liderança do Grupo Volkswagen."
 CZE_ask_the_government_for_help: "Pedir Ajuda ao Governo"
 CZE_ask_the_government_for_help_desc: "A Volkswagen tem forte apoio do governo alemão. Isso não é surpresa, mas também precisamos de algum apoio de outras fontes. E quem pode ser um aliado melhor do que o governo do país para o qual geramos enormes lucros?"
 CZE_bend_the_volkswagen_group_rules: "Flexibilizar as Regras do Grupo Volkswagen"
 CZE_bend_the_volkswagen_group_rules_desc: "As regras atuais não nos permitem assumir a liderança, mesmo com forte apoio de outras empresas. A Volkswagen é mais forte que nós, então somos forçados a flexibilizar algumas regras."
 CZE_prepare_for_takeover: "Preparar a Tomada de Controle"
 CZE_prepare_for_takeover_desc: "Quando todo o resto estiver pronto, poderemos iniciar a etapa final de preparação para o Grupo Škoda. Será uma vitória extraordinária para nossa empresa."
 CZE_leader_of_the_skoda_group: "Líder do Grupo Škoda"
 CZE_leader_of_the_skoda_group_desc: "Assumimos a liderança, nossa missão foi cumprida. Agora só precisamos concluir as formalidades e reorganizar o grupo segundo as novas regras. Ninguém aqui voltará a enganar seus clientes."
 CZE_skoda_x_volkswagen_cooperation: "Cooperação Škoda x Volkswagen"
 CZE_skoda_x_volkswagen_cooperation_desc: "A Škoda faz parte do Grupo Volkswagen há muitos anos, desde que a Volkswagen comprou a maior parte de suas ações. Em consequência de novos acontecimentos, o equilíbrio entre as empresas pode ser abalado. A Škoda enfrentará uma escolha: permanecer fiel à Volkswagen ou rejeitar o que o Grupo Volkswagen oferece e começar a agir por conta própria."
 CZE_we_can_handle_on_our_own: "Damos Conta Sozinhos"
 CZE_we_can_handle_on_our_own_desc: "O Grupo Volkswagen não é o que pensávamos. É uma comunidade realmente agradável, mas preferimos nos concentrar em nossa pátria."
 CZE_prepare_to_leave_the_volkswagen_group: "Preparar a Saída do Grupo Volkswagen"
 CZE_prepare_to_leave_the_volkswagen_group_desc: "Antes de podermos deixar o grupo, temos de lidar com a Volkswagen. Afinal, dependemos dela, o que dificulta todo o processo."
 CZE_negotiate_the_licenses: "Negociar as Licenças"
 CZE_negotiate_the_licenses_desc: "Temos de recomprar todas as nossas ações que a Volkswagen possui. Talvez eles concordem em devolvê-las mais cedo."
 CZE_sustain_economic_trade: "Sustentar o Comércio Econômico"
 CZE_sustain_economic_trade_desc: "Muitos parceiros comerciais se afastarão de nós por causa de nossa decisão. Precisamos tranquilizá-los de que ainda somos capazes de comerciar com grande eficiência."
 CZE_cesky_motor_energy_holding_project: "Projeto Česky Motor Energy Holding"
 CZE_cesky_motor_energy_holding_project_desc: "Vamos então começar a preparar um novo grupo que reúna empresas tchecas. Antes de conversarmos com outras empresas, precisamos concluir os preparativos para lançar este projeto."
 CZE_focus_on_homeland_companies: "Focar nas Empresas da Pátria"
 CZE_focus_on_homeland_companies_desc: "Estamos prontos para conversar com outras empresas. Estamos de olho na TATRA Trucks, VOP CZ, Praga e ČEZ. Elas estão entre as maiores empresas tchecas e a cooperação com elas trará enormes benefícios de desenvolvimento."
 CZE_secure_company_budget: "Proteger o Orçamento da Empresa"
 CZE_secure_company_budget_desc: "Se não protegermos nossos ativos, podemos literalmente bater em um muro muito espesso. Isso seria uma enorme perda para a empresa e para a indústria tcheca, então devemos nos proteger adequadamente."
 CZE_prepare_for_the_actions_drop: "Preparar-se para a Queda das Ações"
 CZE_prepare_for_the_actions_drop_desc: "Protegemos os fundos, então resta um problema. Nossas ações podem despencar em breve se não fizermos nada. Não podemos impedir a queda, mas podemos preveni-la e reduzir seus efeitos."
 CZE_leave_the_volkswagen_group: "Deixar o Grupo Volkswagen"
 CZE_leave_the_volkswagen_group_desc: "Superamos a crise econômica (causada por nós) e iniciamos o projeto de um novo grupo em nosso país. Assim, podemos deixar o Grupo Volkswagen com tranquilidade, tornando-nos completamente independentes."
 CZE_complete_cesky_motor_energy_holding_project: "Concluir o Projeto Česky Motor Energy Holding"
 CZE_complete_cesky_motor_energy_holding_project_desc: "Agora que todas as empresas se juntaram a nós, finalmente podemos concluir o projeto que iniciamos no começo. A Česky Motor Energy Holding finalmente começa suas operações."
 CZE_continue_the_privatization: "Continuar a Privatização"
 CZE_continue_the_privatization_desc: "O processo de privatização começou imediatamente após a queda do comunismo em nosso país. Muitas empresas estatais foram vendidas a investidores e empresários, mas ainda há muito trabalho pela frente."
 CZE_finish_the_coupon_program: "Encerrar o Programa de Vouchers"
 CZE_finish_the_coupon_program_desc: "Durante muitos anos, distribuímos vouchers semigratuitos para a compra de ações de empresas. É hora de encerrar esse processo e passar para a próxima etapa."
 CZE_expand_promoting_private_ownership_businesses: "Ampliar o Incentivo aos Negócios Privados"
 CZE_expand_promoting_private_ownership_businesses_desc: "Não podemos permitir que importantes edifícios industriais permaneçam abandonados ou sem uso. Vamos incentivar novos investidores a assumir o controle deles."
 CZE_finish_selling_state_companies: "Concluir a Venda das Empresas Estatais"
 CZE_finish_selling_state_companies_desc: "Ainda há várias empresas nas mãos do governo, o que realmente não é bom para nossa imagem nem para o desenvolvimento da economia. Vamos concluir o que ficou pendente e acabar logo com isso."
 CZE_more_liberalization: "Mais Liberalização"
 CZE_more_liberalization_desc: "O processo de privatização está quase concluído, mas alguns partidos políticos comunistas ainda são contra essa decisão. As pessoas precisam saber por que tudo o que fazemos agora faz sentido."
 CZE_switch_to_capitalism: "Mudar para o Capitalismo"
 CZE_switch_to_capitalism_desc: "Quem não ama o capitalismo? Brincadeiras à parte. A introdução completa do sistema capitalista na República Tcheca abrirá perspectivas mais amplas para o comércio com o Ocidente e silenciará as vozes dos partidos comunistas."
 CZE_finish_privatization: "Concluir a Privatização"
 CZE_finish_privatization_desc: "Depois de mais de uma década, finalmente podemos concluir o processo de privatização das empresas. Agora podemos nos concentrar em outros ramos da indústria."
 CZE_bohemia: "Boêmia"
 CZE_bohemia_desc: "A maior região da República Tcheca e a mais industrializada. Graças ao predomínio de planícies sobre áreas montanhosas, a indústria pôde se desenvolver melhor aqui ao longo dos anos. Hoje, a diferença entre áreas montanhosas e planas está desaparecendo lentamente, mas só podemos nos beneficiar disso."
 CZE_take_advantage_of_flatter_terrain: "Aproveitar o Terreno Mais Plano"
 CZE_take_advantage_of_flatter_terrain_desc: "Embora tenhamos mais áreas planas na Boêmia do que na Morávia, nosso campo de ação é bastante limitado. Precisamos concentrar a indústria em um só lugar."
 CZE_reach_out_for_western_investors: "Buscar Investidores Ocidentais"
 CZE_reach_out_for_western_investors_desc: "Usaremos nossa indústria ocidental para comercializar bens com mais eficiência para o resto da Europa. A União Europeia pode se revelar uma ótima parceira comercial."
 CZE_extended_exports: "Exportações Ampliadas"
 CZE_extended_exports_desc: "Com novos investidores, podemos melhorar nosso comércio. Pois é, exatamente."
 CZE_expand_car_exports: "Expandir as Exportações de Carros"
 CZE_expand_car_exports_desc: "O novo modelo Superb foi um grande sucesso. Devemos usar nossos portos na cidade alemã de Hamburgo para iniciar as exportações intercontinentais."
 CZE_modern_car_systems: "Sistemas Automotivos Modernos"
 CZE_modern_car_systems_desc: "O século XXI é uma era de progresso, então devemos aprimorar constantemente nossas tecnologias. Graças à forte posição da Škoda, podemos desenvolver nosso mercado com mais eficiência."
 CZE_infrastructure_projects: "Projetos de Infraestrutura"
 CZE_infrastructure_projects_desc: "Somos conhecidos por nossa rede rodoviária bem desenvolvida. Não vamos nos acomodar e continuaremos nossa tradição."
 CZE_automotive_powerhouse: "Potência Automotiva"
 CZE_automotive_powerhouse_desc: "As estradas não são tudo. Ferrovias e trens bem desenvolvidos também são um aspecto muito importante."
 CZE_it_sector: "Setor de TI"
 CZE_it_sector_desc: "Não são mais os tempos em que computadores e monitores pareciam tijolos grandes e pesados. A tecnologia da computação avançou em ritmo inimaginável durante a segunda metade do século XX. Estamos um pouco atrasados, mas graças à Avast podemos alcançar as últimas tendências."
 CZE_widespread_mobile_internet_access: "Acesso Amplo à Internet"
 CZE_widespread_mobile_internet_access_desc: "Não podemos reclamar do nível de nossa internet, mas isso não significa que não possamos melhorá-la."
 CZE_plug_in_new_computers: "Ligar os Novos Computadores"
 CZE_plug_in_new_computers_desc: "Certo, então temos computadores novos. Seria bom ligá-los na tomada, não é?"
 CZE_advanced_tracking_systems: "Sistemas Avançados de Rastreamento"
 CZE_advanced_tracking_systems_desc: "Novos sistemas de rastreamento ajudarão nossos mísseis a atingir seus alvos com mais precisão. Isso facilitará a eliminação de máquinas inimigas e encurtará a duração dos combates durante as batalhas."
 CZE_ai_calculations: "Cálculos de IA"
 CZE_ai_calculations_desc: "Podemos aplicar o desenvolvimento da inteligência artificial aos nossos carros e outros veículos. Isso melhorará os cálculos e o planejamento."
 CZE_support_avast_development: "Apoiar o Desenvolvimento da Avast"
 CZE_support_avast_development_desc: "A Avast, empresa fundada em 1991, ficou famosa, entre outras coisas, por seu programa antivírus. Podemos usar suas inovações em nossas missões de espionagem, o que nos dará vantagem na guerra cibernética."
 CZE_driver_assistant: "Assistente do Motorista"
 CZE_driver_assistant_desc: "Um assistente computadorizado ao dirigir permitirá que o motorista se concentre em outras coisas (embora o contato constante com a estrada ainda seja muito importante)."
 CZE_advanced_emergency_brakes: "Freios de Emergência Avançados"
 CZE_advanced_emergency_brakes_desc: "É melhor frear bruscamente e expor o veículo a danos do que causar um acidente. Graças ao suporte de IA, os novos sistemas serão ainda mais eficazes."
 CZE_cyber_security: "Cibersegurança"
 CZE_cyber_security_desc: "Graças ao novo software da Avast, podemos proteger melhor os sites do governo e estar preparados para possíveis ataques de hackers. Hoje, a segurança dos dados na internet é tão importante quanto guardar segredos em tempos de guerra."
 CZE_safe_travel: "Boa Viagem!"
 CZE_safe_travel_desc: "Boas festas! Graças às mais recentes inovações nos carros Škoda, seus veículos oferecem o máximo conforto ao dirigir. Novos mecanismos de economia de combustível reduzem o consumo, e o usuário pode desfrutar de uma viagem suave em estradas novas e planas!"
 CZE_moravia: "Morávia"
 CZE_moravia_desc: "Uma região um pouco menos desenvolvida que a Boêmia, mas que ainda mantém um nível elevado. As montanhas predominantes podem ser um problema, mas ela fica perto da Eslováquia e do mercado oriental, o que oferece ótimas oportunidades para o desenvolvimento do comércio."
 CZE_solve_mountains_problem: "Resolver o Problema das Montanhas"
 CZE_solve_mountains_problem_desc: "Como mencionado, as montanhas representam um pequeno problema. Podemos resolvê-lo, mas isso exige alguma preparação."
 CZE_move_industry_to_plains: "Mover a Indústria para as Planícies"
 CZE_move_industry_to_plains_desc: "Podemos começar a mover a indústria para áreas mais planas. Isso facilitará o transporte de matérias-primas e a exportação de bens das fábricas."
 CZE_skoda_superb_ii_project: "Projeto Škoda Superb II"
 CZE_skoda_superb_ii_project_desc: "O Superb I foi apenas o começo. A nova geração de nossos veículos deve ser a base de todas as futuras gerações do Superb. Vamos planejar nossos movimentos com cuidado para que correções não sejam necessárias depois."
 CZE_increase_eastern_trade: "Aumentar o Comércio com o Leste"
 CZE_increase_eastern_trade_desc: "Rússia e Ucrânia são ótimos parceiros comerciais, com enormes quantidades de matérias-primas exportadas. Ao mesmo tempo, renovaremos as relações com a Eslováquia."
 CZE_seek_for_more_coal: "Buscar Mais Carvão"
 CZE_seek_for_more_coal_desc: "Continuaremos as indústrias tradicionais e estimularemos nossas minas de carvão. Este é um caminho melhor do que construir novos parques eólicos ou solares do zero."
 CZE_values_of_the_green_energy: "Valores da Energia Verde"
 CZE_values_of_the_green_energy_desc: "Devemos acompanhar os tempos e começar a estabelecer novas fontes de energia renovável. O carvão está se tornando coisa do passado, e painéis solares, turbinas eólicas e usinas hidrelétricas nos darão estabilidade energética."
 CZE_improve_old_industry: "Melhorar a Indústria Antiga"
 CZE_improve_old_industry_desc: "Precisamos alcançar outros países. Não será fácil, mas certamente não conseguiremos com fábricas obsoletas."
 CZE_open_new_car_parts_factory: "Abrir Nova Fábrica de Autopeças"
 CZE_open_new_car_parts_factory_desc: "Graças às melhorias na indústria, podemos abrir uma nova fábrica Škoda."
 CZE_change_of_energy_regulations: "Mudança nas Regulamentações de Energia"
 CZE_change_of_energy_regulations_desc: "Precisamos decidir se aumentamos a produção de energia ou os impostos. Não podemos nos dar ao luxo de uma crise energética."
 CZE_increase_power_generation: "Aumentar a Geração de Energia"
 CZE_increase_power_generation_desc: "Não faz sentido aumentar impostos. Aumentaremos a capacidade de geração de nossos geradores e, de alguma forma, vamos superar isso."
 CZE_increase_energy_taxes: "Aumentar os Impostos sobre Energia"
 CZE_increase_energy_taxes_desc: "Será melhor aumentar os impostos. Não temos como aumentar a capacidade de nossos geradores neste momento."
 CZE_expand_nuclear_power_plants: "Expandir as Usinas Nucleares"
 CZE_expand_nuclear_power_plants_desc: "Nossos maiores geradores de energia estão dentro das usinas nucleares. Graças às usinas de Dukovany e, em breve, de Temelín, a República Tcheca manteve a estabilidade energética por muito tempo. Mas as novas tecnologias exigem cada vez mais energia. Se deixarmos nossas usinas sem desenvolvimento, podemos sofrer uma crise energética muito em breve."
 CZE_temelin_power_plant: "Usina de Temelín"
 CZE_temelin_power_plant_desc: "A construção desta usina levou literalmente uma eternidade. Que bom que finalmente terminamos e nossa segunda usina nuclear está pronta para começar a operar."
 CZE_dukovany_power_plant: "Usina de Dukovany"
 CZE_dukovany_power_plant_desc: "Nossa primeira usina nuclear. Graças a ela, agora podemos dormir bem sem nos preocupar com problemas de eletricidade. Infelizmente, precisaremos modernizar nossos reatores em breve, o que nos custará muito dinheiro."
 CZE_increased_leu_fuel_efficiency: "Maior Eficiência do Combustível LEU"
 CZE_increased_leu_fuel_efficiency_desc: "Ao aumentar a eficiência do combustível LEU, obteremos mais energia de nossos reatores. É um passo caro, então não poderemos usar esse combustível enriquecido para sempre."
 CZE_strengthen_security: "Reforçar a Segurança"
 CZE_strengthen_security_desc: "Não podemos repetir os erros fatais cometidos na usina nuclear de Chernobyl. Muitos cidadãos, especialmente os que vivem em Dukovany e Temelín, temem que possamos repetir o desastre de Chernobyl. Reforçaremos nossos blocos de reatores o máximo que pudermos."
 CZE_maximize_power_of_four_reactors: "Maximizar a Potência de Quatro Reatores"
 CZE_maximize_power_of_four_reactors_desc: "Corremos o risco de alguns danos ao fazer isso, mas, se conseguirmos aumentar a produção de nossa usina de Dukovany, ganharemos temporariamente muita energia extra."
 CZE_prepare_for_second_reactor_construction: "Preparar a Construção do Segundo Reator"
 CZE_prepare_for_second_reactor_construction_desc: "Um reator, claro, não é suficiente. Estamos desenvolvendo nossas usinas nucleares já pensando em sua futura expansão."
 CZE_terrorist_attacks_protection: "Proteção contra Ataques Terroristas"
 CZE_terrorist_attacks_protection_desc: "World Trade Center, Pentágono. O que virá a seguir? Não podemos deixar que terroristas ataquem nossas usinas nucleares. As consequências seriam muito, muito fatais. Seria o fim da estabilidade energética tcheca, sem falar na radiação e em milhares de vítimas."
 CZE_increased_heu_fuel_efficiency: "Maior Eficiência do Combustível HEU"
 CZE_increased_heu_fuel_efficiency_desc: "Por que precisaríamos disso? Digamos que somos previdentes e nos preparamos para situações inesperadas."
 CZE_open_second_temelin_reactor: "Abrir o Segundo Reator de Temelín"
 CZE_open_second_temelin_reactor_desc: "Estamos prontos para conectar o segundo reator à rede elétrica nacional. Isso nos fornecerá energia extra e abrirá novos postos de trabalho para nossos pesquisadores."
 CZE_further_renewable_energy_expansion: "Maior Expansão da Energia Renovável"
 CZE_further_renewable_energy_expansion_desc: "Não podemos depender apenas de nossas usinas nucleares. Se elas falharem, o que não deveria acontecer, precisaremos de geradores de emergência."
 CZE_future_in_nuclear_energy: "Futuro na Energia Nuclear"
 CZE_future_in_nuclear_energy_desc: "Até agora nossas usinas funcionaram perfeitamente. É hora de dar mais um passo rumo ao desconhecido."
 CZE_third_nuclear_power_plant_preparations: "Preparativos da Terceira Usina Nuclear"
 CZE_third_nuclear_power_plant_preparations_desc: "É uma jogada arriscada, pois nossos investidores não ficaram satisfeitos com a duração do último projeto. Teremos tempo limitado, mas, ao mesmo tempo, temos muito mais experiência."
 CZE_upgrade_existing_reactors: "Modernizar os Reatores Existentes"
 CZE_upgrade_existing_reactors_desc: "Continuaremos aprimorando nossas usinas existentes para não ficarmos para trás. Nossos investidores são bastante céticos quanto a esses gastos e podemos correr o risco de desaprovação de nossos projetos."
 CZE_choose_location: "Escolher o Local"
 CZE_choose_location_desc: "É um procedimento padrão. Primeiro, precisamos reunir fundos e definir o local de nossa mais nova usina nuclear."
 CZE_fifth_dukovany_reactor: "Quinto Reator de Dukovany"
 CZE_fifth_dukovany_reactor_desc: "É melhor melhorar o lugar onde trabalham nossos melhores engenheiros nucleares. Os investidores ficarão mais dispostos a apoiar este projeto."
 CZE_third_temelin_reactor: "Terceiro Reator de Temelín"
 CZE_third_temelin_reactor_desc: "É uma jogada arriscada por causa das recentes controvérsias, mas precisamos convencer os investidores a nos ajudar a financiar outro reator em Temelín."
 CZE_start_construction: "Iniciar a Construção"
 CZE_start_construction_desc: "Reunimos fundos suficientes para iniciar a construção da terceira usina nuclear. Não temos muito tempo, mas, graças aos nossos trabalhadores experientes, vamos concluí-la no prazo."
 CZE_new_energy_storage: "Novo Armazenamento de Energia"
 CZE_new_energy_storage_desc: "A nova usina gerará muita energia. Precisamos armazená-la em algum lugar, e é por isso que construiremos um novo parque de baterias."
 CZE_open_third_nuclear_power_plant: "Abrir a Terceira Usina Nuclear"
 CZE_open_third_nuclear_power_plant_desc: "Ah, sim, a terceira usina nuclear. Com a abertura dos novos reatores, finalmente garantimos a segurança energética por décadas."
 CZE_communism_or_democracy: "Comunismo ou Democracia?"
 CZE_communism_or_democracy_desc: "O KSČM é conhecido como um dos últimos partidos comunistas tchecos significativos. Embora o regime comunista tenha acabado há muito tempo, o partido ainda conta com grande apoio entre os cidadãos tchecos. A situação muda dinamicamente e, com alguma sorte, a República Tcheca poderá ser governada novamente pelos comunistas, mas desta vez seu destino pode ser muito diferente."
 CZE_kscm_program: "Programa do KSČM"
 CZE_kscm_program_desc: "O programa do partido KSČM é o bem-estar dos cidadãos, o eurocomunismo e uma economia baseada na ideologia marxista. Tem opinião negativa sobre a Igreja e coopera estreitamente com o partido ČSSD."
 CZE_nadeje_pro_cr: "Esperança para a República Tcheca"
 CZE_nadeje_pro_cr_desc: "O programa de longo prazo do partido é 'Esperança para a República Tcheca'. Segundo ele, 'o KSČM considera o capitalismo a causa fundamental dos crescentes problemas do mundo e da sociedade'. Deseja substituí-lo por uma 'nova formação socioeconômica, mais progressista'."
 CZE_dont_trust_democracy: "Não Confie na Democracia"
 CZE_dont_trust_democracy_desc: "Simplesmente não confie. Mas, falando sério, a democracia é conhecida por sua lentidão em desenvolver o país. O comunismo é diferente, ele tornará a economia tcheca (desta vez) ótima."
 CZE_eurocommunism: "Eurocomunismo"
 CZE_eurocommunism_desc: "A visão eurocomunista refere-se ao aprimoramento das raízes comunistas dentro da União Europeia e da Europa em geral. Alguns partidos podem adotá-la como um de seus objetivos. É uma ameaça menor à estabilidade e à democracia, mas, se alguém conseguir liderar os partidos comunistas europeus, eles podem se tornar uma ameaça significativa."
 CZE_promote_the_black_book_of_capitalism: "Promover o Livro Negro do Capitalismo"
 CZE_promote_the_black_book_of_capitalism_desc: "Toda mentira, corrupção e fracasso conhecidos do sistema capitalista em um só livro. Por que você não o compra? Custa apenas 333 coroas tchecas!"
 CZE_marxist_fundamentalism: "Fundamentalismo Marxista"
 CZE_marxist_fundamentalism_desc: "A ideologia marxista refere-se ao apoio social e a uma forma diferente de desenvolvimento econômico. O KSČM segue suas ideias para promover o programa do partido."
 CZE_the_last_real_czech_communists: "Os Últimos Verdadeiros Comunistas Tchecos"
 CZE_the_last_real_czech_communists_desc: "Para ser honesto, o KSČM é o único partido comunista restante na República Tcheca que realmente importa na esfera política. Sua influência e cooperação com outros partidos comunistas o tornam mais forte."
 CZE_cssd_cooperation: "Cooperação com o ČSSD"
 CZE_cssd_cooperation_desc: "O KSČM é conhecido por sua ótima cooperação com o grande partido democrata ČSSD. Ambos os partidos compartilham alguma linguagem comum e frequentemente tomam decisões importantes juntos. Embora às vezes tenham problemas na coalizão, tentam permanecer unidos."
 CZE_backstage_with_russia: "Bastidores com a Rússia"
 CZE_backstage_with_russia_desc: "A Rússia é uma ótima parceira comercial e os outros partidos também deveriam saber disso. Ao estabelecer uma nova rota comercial com essa grande potência, o mercado da República Tcheca começará a crescer."
 CZE_ods_rivalry: "Rivalidade com o ODS"
 CZE_ods_rivalry_desc: "O KSČM e o ODS não gostam um do outro. Especialmente quando ele coopera com o ČSSD. É um trio instável que tenta se tolerar, mas às vezes foge ao controle."
 CZE_time_for_changes: "Hora de Mudanças"
 CZE_time_for_changes_desc: "Os comunistas governam a República Tcheca mais uma vez. É hora de reverter a privatização e restaurar muitas instituições sociais."
 CZE_revive_national_spirit: "Reviver o Espírito Nacional"
 CZE_revive_national_spirit_desc: "Nosso povo deve se lembrar de que o comunismo não é só coisa ruim. A democracia ficou no passado e precisamos nos acostumar a um novo futuro."
 CZE_widen_chinese_market: "Ampliar o Mercado Chinês"
 CZE_widen_chinese_market_desc: "A China é uma ótima parceira comercial, com muitos eletrônicos, materiais e máquinas. Precisamos aumentar as importações de lá."
 CZE_sphere_of_asia: "Esfera da Ásia"
 CZE_sphere_of_asia_desc: "A Ásia não termina na China ou na Rússia. Ainda há muitos parceiros valiosos, como a Índia ou o Oriente Médio."
 CZE_take_power_in_european_union: "Tomar o Poder na União Europeia"
 CZE_take_power_in_european_union_desc: "Ao governar os partidos comunistas da União Europeia, poderemos gerir melhor o desenvolvimento da UE, inclinando-a em favor da República Tcheca."
 CZE_limited_trust_for_usa: "Confiança Limitada nos EUA"
 CZE_limited_trust_for_usa_desc: "Não importa se somos aliados ou não. Os EUA são o país democrático mais forte que já existiu. Eles podem tentar nos tirar do poder. Temos de observar seus passos de muito perto."
 CZE_stabilize_the_government: "Estabilizar o Governo"
 CZE_stabilize_the_government_desc: "O povo confia em nós, mas os outros partidos não. Precisamos acalmar os políticos."
 CZE_interventionism: "Intervencionismo"
 CZE_interventionism_desc: "Hora de começar os preparativos para nosso verdadeiro projeto. Fomos feridos muitas vezes no passado. É hora de todos os nossos inimigos pagarem por seus crimes."
 CZE_consequences_of_1968_warsaw_pact_intervention: "Consequências da Invasão do Pacto de Varsóvia"
 CZE_consequences_of_1968_warsaw_pact_intervention_desc: "Nosso povo sofreu demais por causa da intervenção do Pacto de Varsóvia. A maior ameaça é a Rússia, mas primeiro precisamos lidar com seus antigos fantoches."
 CZE_strike_at_hungary: "Atacar a Hungria"
 CZE_strike_at_hungary_desc: "A Hungria foi um dos países que participaram da intervenção de 1968. É hora de pagarem por essa decisão."
 CZE_take_back_zaolzi: "Retomar Zaolzie"
 CZE_take_back_zaolzi_desc: "A Polônia nos roubou a região de Zaolzie no passado. Agora, não só retomaremos todas as suas províncias, como também é nossa vez de exigir algo deles."
 CZE_bulgaria_has_to_pay_for_their_crimes: "A Bulgária Tem de Pagar por Seus Crimes"
 CZE_bulgaria_has_to_pay_for_their_crimes_desc: "E por fim a Bulgária, o país balcânico. Enquanto a Romênia permaneceu relativamente neutra, a Bulgária não foi tão educada com a nossa situação."
 CZE_the_biggest_threat: "A Maior Ameaça"
 CZE_the_biggest_threat_desc: "Hora da Rússia. A principal razão da intervenção de 1968 em nossa pátria. Não será uma tarefa fácil, mas nossa determinação nos permitirá vencer essa ameaça."
 CZE_revert_privatization_effects: "Reverter os Efeitos da Privatização"
 CZE_revert_privatization_effects_desc: "O capitalismo realmente arranhou nossa economia. Temos de restaurar a propriedade pública e pôr fim a esse disparate."
 CZE_strike_at_capitalism: "Atacar o Capitalismo"
 CZE_strike_at_capitalism_desc: "Mostraremos ao mundo os benefícios do sistema comunista. O capitalismo enriquece os ricos, e isso não é bom para as pessoas comuns."
 CZE_finish_agriculture_program: "Concluir o Programa Agrícola"
 CZE_finish_agriculture_program_desc: "Finalmente podemos concluir a reforma do sistema agrícola. Nossos agricultores finalmente receberão o que deveriam ter recebido há muito tempo."
 CZE_keep_the_track_of_peace: "Manter o Caminho da Paz"
 CZE_keep_the_track_of_peace_desc: "A única coisa que sempre quisemos foi fazer nossos cidadãos felizes. O capitalismo e a propriedade privada são um mau jeito de governar a nação. Restauramos o sistema comunista e as mudanças estão feitas. Podemos voltar ao caminho normal."
 CZE_stay_on_track: "Manter o Rumo"
 CZE_stay_on_track_desc: "Não tivemos sucesso nas últimas eleições, mas ainda podemos continuar nosso programa."
 CZE_change_the_labor_code: "Alterar o Código do Trabalho"
 CZE_change_the_labor_code_desc: "Não podemos reverter a privatização, mas pelo menos podemos fazer algumas mudanças no código do trabalho. Isso tornará nosso povo mais independente no trabalho."
 CZE_make_use_of_the_ctyrkoalice_split: "Aproveitar a Dissolução da Čtyřkoalice"
 CZE_make_use_of_the_ctyrkoalice_split_desc: "O pacto dos quatro partidos finalmente caiu. Podemos fortalecer nossas relações com o ČSSD e ganhar apoio."
 CZE_deepen_cooperation_with_cssd: "Aprofundar a Cooperação com o ČSSD"
 CZE_deepen_cooperation_with_cssd_desc: "Como a Čtyřkoalice caiu, nossa aliança com o ČSSD ficará ainda mais forte. Isso também fará o ODS parecer menor."
 CZE_open_for_greater_trade_with_russia: "Abrir-se a Maior Comércio com a Rússia"
 CZE_open_for_greater_trade_with_russia_desc: "A cooperação com o ČSSD nos permite tomar decisões mais controversas. Ao tornar nosso país um pouco dependente dos recursos russos, estabeleceremos relações mais estreitas com essa superpotência."
 CZE_backstage_with_russia_ii: "Bastidores com a Rússia II"
 CZE_backstage_with_russia_ii_desc: "Quem liga para isso, afinal. Isso não afetará muito a economia e conseguiremos preços menores no comércio com a Rússia."
 CZE_regain_people_trust: "Recuperar a Confiança do Povo"
 CZE_regain_people_trust_desc: "O ODS deixa nossa situação bastante ruim. Temos de convencer o povo de que ainda somos uma força significativa na política tcheca."
 CZE_limits_for_the_churches: "Limites para as Igrejas"
 CZE_limits_for_the_churches_desc: "A Igreja está começando a influenciar demais a nossa nação. Não podemos permitir que a religião diminua a produtividade do nosso país."
 CZE_focus_on_whats_real_not_imaginary: "Focar no Que É Real, Não no Imaginário"
 CZE_focus_on_whats_real_not_imaginary_desc: "Por que estamos desperdiçando dinheiro para financiar as Igrejas em vez de novos locais de trabalho? Isso tem de parar."
 CZE_attack_ods: "Atacar o ODS"
 CZE_attack_ods_desc: "Nossa rivalidade se aprofunda a cada ano, então não podemos baixar a guarda e devemos preparar outra ação para ganhar influência à custa do ODS."
 CZE_leadership_of_vojtech_filip: "Liderança de Vojtěch Filip"
 CZE_leadership_of_vojtech_filip_desc: "Vojtěch Filip foi escolhido como novo líder de nosso partido. É hora de mudanças e de reverter a linha de queda de nossa popularidade."
 CZE_continuation_of_2002_elections_program: "Continuação do Programa das Eleições de 2002"
 CZE_continuation_of_2002_elections_program_desc: "Nosso programa nos últimos anos nos trouxe estabilidade e desenvolvimento lento. Seria arriscado mudar isso agora, então ficaremos com o que temos."
 CZE_discuss_with_environmental_protection_experts: "Consultar Especialistas em Proteção Ambiental"
 CZE_discuss_with_environmental_protection_experts_desc: "Este é mais um passo em nossa política verde. Conversaremos com alguns especialistas sobre como podemos melhorar o valor da energia verde na República Tcheca."
 CZE_pro_ecological_innovations: "Inovações Pró-Ecológicas"
 CZE_pro_ecological_innovations_desc: "A poluição começa a se tornar uma ameaça realmente séria para nossa comunidade. Precisamos agir de forma rápida e decisiva."
 CZE_promoting_recycling: "Promover a Reciclagem"
 CZE_promoting_recycling_desc: "É simples, mas eficaz. Ao separar o lixo, nossas fábricas poderão reciclá-lo com mais eficiência."
 CZE_invest_in_renewable_energy: "Investir em Energia Renovável"
 CZE_invest_in_renewable_energy_desc: "Temos várias usinas hidrelétricas e nucleares. Isso é bom, mas não suficiente. Se quisermos manter nosso sistema de energia seguro, temos de construir mais geradores."
 CZE_agriculture_innovations: "Inovações Agrícolas"
 CZE_agriculture_innovations_desc: "Hora de dar mais um passo em nosso programa agrícola. Novos subsídios para os agricultores e acesso facilitado a máquinas avançadas tornarão nossas fazendas lugares melhores para viver e trabalhar."
 CZE_protest_against_mines_privatization: "Protestar contra a Privatização das Minas"
 CZE_protest_against_mines_privatization_desc: "O setor de mineração e recursos deveria estar sempre nas mãos do Estado. A privatização dessa parte da economia pode resultar em aumento nos preços dos recursos."
 CZE_reduce_resource_extraction: "Reduzir a Extração de Recursos"
 CZE_reduce_resource_extraction_desc: "Com a velocidade atual de extração, podemos ter problemas daqui a uma ou duas décadas. Precisamos equilibrar nossa extração de recursos para não cair em crise."
 CZE_waste_less_energy: "Desperdiçar Menos Energia"
 CZE_waste_less_energy_desc: "Nossos recursos limitados nos obrigam a tomar algumas medidas. Investiremos em tecnologias de economia de energia."
 CZE_focus_on_hydroelectric_and_nuclear_power_plants: "Focar nas Usinas Hidrelétricas e Nucleares"
 CZE_focus_on_hydroelectric_and_nuclear_power_plants_desc: "Essas são nossas principais fontes de energia. Mantê-las funcionando é nosso dever para garantir a segurança elétrica."
 CZE_expand_civilian_infrastructure: "Expandir a Infraestrutura Civil"
 CZE_expand_civilian_infrastructure_desc: "A República Tcheca é conhecida por seu sistema rodoviário bem estabelecido. Mas isso não significa que não possa melhorar."
 CZE_better_railway_system: "Melhor Sistema Ferroviário"
 CZE_better_railway_system_desc: "Novos trilhos conectarão novas cidades e encurtarão o tempo que os trens precisam para chegar ao destino."
 CZE_green_czech_republic: "República Tcheca Verde"
 CZE_green_czech_republic_desc: "Fizemos um progresso decente no desenvolvimento da energia verde, então agora precisamos valorizar nossas áreas verdes e apoiar nossos trabalhadores que atuam junto à natureza."
 CZE_nuclear_power_plants_expansion: "Expansão das Usinas Nucleares"
 CZE_nuclear_power_plants_expansion_desc: "A expansão contínua de nossas usinas nucleares é necessária para mantê-las atualizadas. Tudo é limitado, então precisamos modernizar nossos reatores o tempo todo."
 CZE_take_a_look_on_country_agriculture: "Dar uma Olhada na Agricultura do País"
 CZE_take_a_look_on_country_agriculture_desc: "Já mencionamos isso muitas vezes e continuaremos repetindo até que o problema do nosso sistema agrícola seja totalmente resolvido. Mais inovações estão a caminho de serem implementadas."
 CZE_further_green_energy_innovations: "Mais Inovações em Energia Verde"
 CZE_further_green_energy_innovations_desc: "Quem não gosta de energia verde? Bem, muita gente... mas é por isso que devemos mostrar a elas por que ela é realmente melhor que a obsoleta energia do carvão."
 CZE_farmers_league: "Liga dos Agricultores"
 CZE_farmers_league_desc: "O passo final para melhorar as condições de vida de nossos gloriosos agricultores. Os agricultores são a base do país. Eles cultivam as plantas, os alimentos e cuidam dos animais. Devem ser recompensados por isso."
 CZE_hunstman_support: "Apoio aos Caçadores"
 CZE_hunstman_support_desc: "Ser caçador não é apenas matar animais para obter comida ou outros ingredientes. Os caçadores devem cuidar da vida selvagem para que ela possa se desenvolver livremente. Vamos ajudá-los em seu trabalho."
 CZE_further_hydroelectric_plants_improvement: "Mais Melhorias nas Usinas Hidrelétricas"
 CZE_further_hydroelectric_plants_improvement_desc: "Mais uma expansão de nossas usinas hidrelétricas. A água é uma ótima fonte de energia renovável e devemos aproveitá-la."
 CZE_the_initiative_of_communist_and_workers_parties: "Iniciativa dos Partidos Comunistas e Operários"
 CZE_the_initiative_of_communist_and_workers_parties_desc: "A IOCAWP é um grupo de partidos comunistas europeus para sustentar o desenvolvimento comum na esfera política. É nossa última chance de abrir os olhos e enfrentar a crise em nosso partido."
 CZE_in_offense_to_european_union: "Em Ofensiva contra a União Europeia"
 CZE_in_offense_to_european_union_desc: "Ganhamos algum apoio, então agora podemos iniciar nosso programa e tentar assumir a liderança entre os partidos comunistas."
 CZE_capitalist_threat: "Ameaça Capitalista"
 CZE_capitalist_threat_desc: "O capitalismo acabará levando ao colapso da União Europeia. Os países democráticos devem conhecer seu futuro e saber que queremos evitá-lo."
 CZE_cooperation_with_european_communists: "Cooperação com os Comunistas Europeus"
 CZE_cooperation_with_european_communists_desc: "Alguns partidos comunistas apoiam nossa iniciativa. É hora de usar essa popularidade e um bom discurso para impulsionar ainda mais essas relações."
 CZE_speak_against_usa: "Discursar contra os EUA"
 CZE_speak_against_usa_desc: "Os EUA são o maior inimigo do comunismo. Temos de vigiá-los de perto e não deixar que trabalhem contra nossa iniciativa."
 CZE_face_the_crisis: "Enfrentar a Crise"
 CZE_face_the_crisis_desc: "Infelizmente, não conseguimos manter popularidade suficiente na política tcheca. Temos de enfrentar a crise e pelo menos tentar permanecer no parlamento."
 CZE_majority_in_european_communists: "Maioria entre os Comunistas Europeus"
 CZE_majority_in_european_communists_desc: "Conquistamos a liderança entre os partidos comunistas da União Europeia. Podemos usar esse poder para melhorar a posição da República Tcheca na arena internacional."
 CZE_coherent_political_goals: "Metas Políticas Coerentes"
 CZE_coherent_political_goals_desc: "Muitos partidos políticos da República Tcheca têm objetivos em comum. Além de tornar o país forte e independente, a maioria dos partidos importantes pretende desenvolver a energia verde, o bem-estar social e as inovações ecológicas."
 CZE_kducsl_program: "Programa do KDU-ČSL"
 CZE_kducsl_program_desc: "O programa do KDU-ČSL enfatiza o apoio às famílias, educação de qualidade, saúde acessível, economia equilibrada, proteção ambiental, desenvolvimento rural, cooperação com a UE e governança transparente, tudo enraizado em valores democrata-cristãos."
 CZE_social_market_economy: "Economia Social de Mercado"
 CZE_social_market_economy_desc: "A §Yeconomia social de mercado do KDU-ČSL§! §Ybusca unir a eficiência do livre mercado a fortes políticas sociais, garantindo prosperidade econômica, justiça social e apoio às populações vulneráveis por meio de uma abordagem equilibrada que promove tanto a concorrência quanto o bem-estar§!"
 CZE_invest_in_families: "Investir nas Famílias"
 CZE_invest_in_families_desc: "Ao investir nas famílias, não apenas impulsionamos o crescimento populacional, como também criamos uma sociedade mais coesa e produtiva."
 CZE_catholic_ethics_desc: "Ao integrar os valores católicos à nossa governança, buscamos promover a harmonia social, a compaixão e o bem comum."
 CZE_social_pensions: "Pensões Sociais"
 CZE_social_pensions_desc: "Ao implementar um sistema abrangente de pensões sociais, buscamos oferecer segurança financeira a todos os cidadãos em seus anos de aposentadoria."
 CZE_keep_education_on_high_level: "Manter a Educação em Alto Nível"
 CZE_keep_education_on_high_level_desc: "Ao manter um alto padrão de educação, garantimos que nossos cidadãos estejam bem preparados para enfrentar os desafios de um mundo em rápida transformação."
 CZE_catholic_ethics: "Ética Católica"
 CZE_increased_role_of_the_religion_in_society: "Maior Papel da Religião"
 CZE_increased_role_of_the_religion_in_society_desc: "Ao incentivar a educação religiosa, apoiar iniciativas comunitárias de base religiosa e colaborar com líderes religiosos, podemos fomentar uma sociedade fundamentada em princípios éticos e respeito mútuo."
 CZE_conversion_of_unbelievers: "Conversão dos Descrentes"
 CZE_conversion_of_unbelievers_desc: "Ao apoiar programas que educam e convertem aqueles que ainda não seguem nossa fé, buscamos criar uma sociedade mais harmoniosa e devota."
 CZE_easier_access_to_religion: "Acesso Facilitado à Religião"
 CZE_easier_access_to_religion_desc: "Este foco se dedica a remover as barreiras que impedem as pessoas de praticar sua religião, sejam elas físicas, econômicas ou sociais. As iniciativas incluirão a construção de mais locais de culto, o subsídio de materiais religiosos e o apoio a programas de educação religiosa. Além disso, garantiremos que os serviços religiosos estejam disponíveis em áreas rurais e carentes. Ao facilitar o acesso e a prática da religião, buscamos criar uma sociedade mais realizada espiritualmente e coesa, onde a fé possa florescer de forma livre e inclusiva."
 CZE_lgbt_suppresion: "Repressão LGBT"
 CZE_lgbt_suppresion_desc: "Este foco visa impor políticas que suprimam os direitos e a visibilidade LGBT na sociedade. As medidas incluirão a restrição de organizações LGBT, a proibição de manifestações públicas de identidade LGBT e a imposição de papéis de gênero tradicionais."
 CZE_balanced_spendings: "Gastos Equilibrados"
 CZE_balanced_spendings_desc: "Gastos equilibrados ajudarão a criar uma economia resiliente, capaz de resistir a choques externos e de prover o bem-estar de todos os cidadãos."
 CZE_tighten_relations_with_cssd: "Estreitar Relações com o ČSSD"
 CZE_tighten_relations_with_cssd_desc: "O ČSSD é um partido importante em nosso país. Mas devemos dizer que não apoiamos suas ligações com o KSČM."
 CZE_limit_role_of_the_communists: "Limitar o Papel dos Comunistas"
 CZE_limit_role_of_the_communists_desc: "Não devemos confiar no KSČM, não importa qual programa tenham preparado. O comunismo não fez nada de bom pelo nosso país e todos devem se lembrar disso."
 CZE_leadership_of_miroslav_kalousek: "Liderança de Miroslav Kalousek"
 CZE_leadership_of_miroslav_kalousek_desc: "É hora de Kalousek se tornar presidente do nosso partido. Sua nova política tributária ajudará nosso país a reduzir a dívida nacional."
 CZE_stay_close_with_usdeu: "Manter Proximidade com o US-DEU"
 CZE_stay_close_with_usdeu_desc: "O US-DEU não é muito popular, mas apreciamos seu programa. Depois do colapso da Čtyřkoalice, será um bom esforço renovar nossa cooperação."
 CZE_get_closer_to_ods: "Aproximar-se do ODS"
 CZE_get_closer_to_ods_desc: "Another big party is ODS. They have better program than ČSSD and we should aim to get closer with them"
 CZE_cooperation_with_strana_zelenych: "Cooperação com o Strana Zelených"
 CZE_cooperation_with_strana_zelenych_desc: "O Strana Zelených é o partido que mais se empenha pelo meio ambiente. Ele nos ajudará a concluir o programa de energia renovável."
 CZE_promote_renewable_energy_sources: "Promover as Fontes de Energia Renovável"
 CZE_promote_renewable_energy_sources_desc: "Graças ao Strana Zelených, podemos concluir nosso programa de energia renovável antes das eleições de 2006."
 CZE_jiri_cunek_will_lead_us: "Jiří Čunek Nos Liderará"
 CZE_jiri_cunek_will_lead_us_desc: "Jiří Čunek se concentrará em atrair mais pessoas para nosso país graças a novos programas de construção, incluindo novas igrejas. É hora de mudar a liderança do nosso país."
 CZE_limit_freedom_of_the_romes: "Limitar a Liberdade dos Romani"
 CZE_limit_freedom_of_the_romes_desc: "A minoria tem direitos demais em comparação com o nosso povo. Eles precisam saber que este é o nosso país, não o deles."
 CZE_cooperation_with_ods_and_strana_zelenych: "Cooperação com o ODS e o Strana Zelených"
 CZE_cooperation_with_ods_and_strana_zelenych_desc: "É hora de aprofundar a cooperação com o ODS e o Strana Zelených. Com eles, poderemos manter a popularidade e a estabilidade no governo."
 CZE_restrict_social_benefits: "Restringir os Benefícios Sociais"
 CZE_restrict_social_benefits_desc: "O Estado está gastando dinheiro demais com assuntos sociais. Não queremos, mas temos de cortar alguns gastos sociais para melhorar a situação econômica do nosso país."
 CZE_extend_churches: "Ampliar as Igrejas"
 CZE_extend_churches_desc: "Estamos ganhando cada vez mais cristãos, então precisamos construir mais igrejas para eles. Isso faz parte do nosso programa desde o início e é hora de ampliar essas ideias."
 CZE_solve_internal_problems: "Resolver Problemas Internos"
 CZE_solve_internal_problems_desc: "Nosso país vive muitos conflitos internos que devem ser resolvidos com muita rapidez. É hora de passar por algumas reformas."
 CZE_kducsl_2010_program_idea: "§3KDU-ČSL§! - Programa de 2010"
 CZE_pavel_belohradek_idea: "§3KDU-ČSL§! - Pavel Bělobrádek"
 CZE_pavel_belohradek_is_leader: "§3Pavel Bělobrádek§! é o atual líder do §3KDU-ČSL§!"
 CZE_pavel_belohradek_warning: "§RSe §YPavel Bělobrádek§! se aposentar como líder, os efeitos positivos de todos os próximos focos do §YKDU-ČSL§! até §YLiderança de Marian Jurečka§! serão reduzidos pela metade e eles sofrerão perda de Poder Político.§!"
 CZE_majority_of_younger_people: "Maioria de Jovens"
 CZE_majority_of_younger_people_desc: "A juventude é o nosso futuro, então devemos valorizá-la."
 CZE_new_social_program: "Novo Programa Social"
 CZE_new_social_program_desc: "Precisamos oferecer uma rede de proteção maior ao nosso povo."
 CZE_more_ecological_fuel_and_energy: "Mais Combustível e Energia Ecológicos"
 CZE_more_ecological_fuel_and_energy_desc: "Os tempos estão mudando, devemos começar a usar combustível mais ecológico em nossas usinas."
 CZE_less_crowded_cities: "Cidades Menos Lotadas"
 CZE_less_crowded_cities_desc: "As cidades ficaram superlotadas nos últimos anos; temos de fazer algo a respeito."
 CZE_further_nuclear_power_plants_expansion: "Mais Expansão das Usinas Nucleares"
 CZE_further_nuclear_power_plants_expansion_desc: "Dukovany e Temelín provaram ser fontes de energia confiáveis, então devemos expandi-las."
 CZE_back_into_parliament: "De Volta ao Parlamento"
 CZE_back_into_parliament_desc: "Pavel Bělobrádek conseguiu, estamos de volta ao parlamento; devemos mantê-lo por enquanto."
 CZE_kducsl_2013_program_idea: "§3KDU-ČSL§! - Programa de 2013"
 CZE_cssd_and_ano_coalition: "Coalizão ČSSD e ANO"
 CZE_kducsl_2017_program_idea: "§3KDU-ČSL§! - Programa de 2017"
 CZE_marian_jurecka_idea: "§3KDU-ČSL§! - Marian Jurecka "
 CZE_marian_jurecka_warning: "§RSe §YMarian Jurecka§! se aposentar como líder, os efeitos positivos de todos os próximos focos do §YKDU-ČSL§! serão reduzidos pela metade e eles sofrerão perda de Poder Político.§!"
 CZE_cssd_and_ano_coalition_desc: "Devemos restaurar a fé no governo após o caso Nagyová, e nossos aliados nos ajudarão nisso. "
 CZE_succes_in_eu_elections: "Eleições da UE"
 CZE_succes_in_eu_elections_desc: "As eleições para o Parlamento Europeu foram boas para nós. Isso deve nos trazer apoio dentro do país."
 CZE_new_ministers_of_culture_and_agriculture: "Novos Ministros da Cultura e da Agricultura"
 CZE_new_ministers_of_culture_and_agriculture_desc: "Daniel Herman e Marian Jurečka serão nossos novos ministros."
 CZE_climate_change_prevention: "Prevenção das Mudanças Climáticas"
 CZE_climate_change_prevention_desc: "Temos de salvar o clima, que se deteriora rapidamente; vamos investir em prevenção."
 CZE_leadership_of_marek_vyborny_and_marian_jurecka: "Líderes Marek Výborný e Marian Jurečka"
 CZE_leadership_of_marek_vyborny_and_marian_jurecka_desc: "Marek Výborný e Marian Jurečka conduzirão nosso partido a uma nova era."
 CZE_take_care_of_environment: "Cuidar do Meio Ambiente"
 CZE_support_families: "Apoiar as Famílias"
 CZE_support_families_desc: "As famílias são a espinha dorsal da nossa sociedade; apoiá-las deve ser nossa prioridade."
 CZE_support_families_idea: "§3KDU-ČSL§! - Apoio às Famílias"
 CZE_take_care_of_agriculture: "Cuidar da Agricultura"
 CZE_take_care_of_agriculture_desc: "A agricultura é uma grande parte da nossa economia; devemos expandi-la."
 CZE_extend_social_program: "Programa Social Ampliado"
 CZE_extend_social_program_desc: "Precisamos ampliar ainda mais o nível de apoio ao nosso povo."
 CZE_prepare_for_the_together_coalition: "Preparar a Coalizão Spolu"
 CZE_prepare_for_the_together_coalition_desc: "A Spolu é nossa única esperança de derrotar Babiš; devemos nos juntar a eles."
 CZE_ods_program: "Programa do ODS"
 CZE_ods_program_desc: "O programa do ODS defende o bem-estar civil, impostos reduzidos e a construção de uma posição forte do país na arena internacional. Seus valores democráticos chamam a atenção de partidos não alinhados, como o KDU-ČSL. No entanto, seus principais rivais são o ČSSD e o KSČM."
 CZE_reforms_in_national_budget: "Reformas no Orçamento Nacional"
 CZE_reforms_in_national_budget_desc: "O orçamento nacional está em queda. Nossa dívida ainda é muito alta e precisamos finalmente fazer algo a respeito."
 CZE_decrease_debt: "Reduzir a Dívida"
 CZE_decrease_debt_desc: "É hora de reduzir nossa dívida nacional. O ČSSD tem seu próprio jeito de fazer isso, mas nossa estratégia também deve funcionar."
 CZE_fight_ctyrkoalice_effort: "Combater os Esforços da Čtyřkoalice"
 CZE_fight_ctyrkoalice_effort_desc: "A Čtyřkoalice está ficando cada vez mais forte. Ela ameaça nossa posição estável no parlamento e, se não nos opusermos a ela, podemos perder muito apoio nas próximas eleições."
 CZE_increae_social_spending: "Aumentar os Gastos Sociais"
 CZE_increae_social_spending_desc: "Um de nossos objetivos padrão é aumentar o bem-estar de nossos cidadãos. Faremos isso aumentando os gastos sociais para atrair mais pessoas ao nosso país."
 CZE_benefits_from_work: "Benefícios do Trabalho"
 CZE_benefits_from_work_desc: "O trabalho aumenta a produtividade, a produtividade aumenta o bem-estar, o bem-estar facilita o trabalho. É tudo o que você precisa saber."
 CZE_tax_reform: "Reforma Tributária"
 CZE_tax_reform_desc: "O atual sistema tributário é ineficiente e lento. Ao reformar esse setor, aceleraremos os serviços administrativos e deixaremos as pessoas mais felizes."
 CZE_progress_towards_privatization: "Avanço Rumo à Privatização"
 CZE_progress_towards_privatization_desc: "Nosso plano de privatização vai muito bem. Devemos concluí-lo em poucos anos e finalmente nos livrar desse problema. Os comunistas podem tentar frear nossos esforços, mas agora não conseguem detê-los por completo."
 CZE_limited_eu_trust: "Confiança Limitada na UE"
 CZE_limited_eu_trust_desc: "A União Europeia está longe da perfeição. Às vezes ela até diz aos países o que devem ter em suas próprias leis constitucionais. Isso pode arranhar nossa independência e não podemos permitir que essa organização faça isso."
 CZE_advantages_of_nato_membership: "Vantagens de Ser Membro da OTAN"
 CZE_advantages_of_nato_membership_desc: "A Europa nunca foi um continente mais estável do que hoje. A OTAN tem grande parte nisso e é por isso que devemos permanecer com ela a qualquer custo."
 CZE_strong_and_independent_country: "País Forte e Independente"
 CZE_strong_and_independent_country_desc: "Apesar das ameaças externas, temos de permanecer fortes. Não podemos permitir que a UE ou outras instituições entrem em nossas cabeças e influenciem silenciosamente nossa nação."
 CZE_leadership_of_mirek_topolanek: "Liderança de Mirek Topolánek"
 CZE_leadership_of_mirek_topolanek_desc: "Mirek Topolánek terá de enfrentar uma situação muito séria durante sua liderança. As eleições europeias e regionais estão chegando e o ODS terá de fazer tudo para conquistar o máximo de apoio possível. Mas não podemos esquecer nosso objetivo. Para vencer as eleições, precisamos satisfazer nosso povo cumprindo nosso programa."
 CZE_tightening_the_road_network: "Adensar a Malha Viária"
 CZE_tightening_the_road_network_desc: "Nossa malha viária é incrível, mas podemos investir um pouco mais para torná-la ainda melhor. Podemos arcar com esse investimento."
 CZE_grants_for_network_infrastructure: "Subsídios para Infraestrutura de Rede"
 CZE_grants_for_network_infrastructure_desc: "A internet está se desenvolvendo em alta velocidade. Para não ficarmos para trás, teremos de aumentar a eficiência de nossa infraestrutura de rede."
 CZE_vaclav_klaus_for_the_president: "Václav Klaus para Presidente!"
 CZE_vaclav_klaus_for_the_president_desc: "É hora das eleições presidenciais. Václav Klaus será nosso candidato, que falará por nosso partido e conduzirá nossa nação."
 CZE_strengthening_position_in_czech_and_international_arena: "Fortalecer a Posição na Arena Internacional"
 CZE_strengthening_position_in_czech_and_international_arena_desc: "As eleições para o Parlamento Europeu estão muito próximas. Aumentar a popularidade do nosso partido elevará muito nossas chances de sucesso."
 CZE_results_of_the_2004_european_parliamnt_elections: "Eleições para o Parlamento Europeu de 2004"
 CZE_results_of_the_2004_european_parliamnt_elections_desc: "Chegou a hora. Nosso maior rival continua sendo o ČSSD. Se conseguirmos derrotá-lo, ganharemos poder significativo na UE."
 CZE_results_of_the_2004_senate_and_regional_elections: "Eleições Senatoriais e Regionais de 2004"
 CZE_results_of_the_2004_senate_and_regional_elections_desc: "A estratégia é simples. Aumentamos nossa popularidade na capital e nas regiões urbanizadas. Isso deve bastar para cumprir nosso programa eleitoral e vencer o ČSSD."
 CZE_increasing_value_of_the_party: "Aumentando o Valor do Partido"
 CZE_increasing_value_of_the_party_desc: "E é isso. Passamos pelas eleições. Independentemente dos resultados, temos de continuar melhorando nossa posição no parlamento tcheco para não ficarmos para trás."
 CZE_increase_sense_of_security: "Aumentar a Sensação de Segurança"
 CZE_increase_sense_of_security_desc: "Nosso país é seguro, mas isso não significa que seja intocável. Precisamos estar sempre preparados para qualquer ameaça."
 CZE_more_effort_for_education_development: "Mais Esforço no Desenvolvimento da Educação"
 CZE_more_effort_for_education_development_desc: "A educação está em um nível bom o bastante. Ainda assim, é bastante simples. O longo regime comunista afetou nossa comunidade e precisamos promover os valores democráticos mais do que nunca."
 CZE_start_the_new_era: "Iniciar a Nova Era"
 CZE_start_the_new_era_desc: "Um novo período começou na República Tcheca. Mirek Topolánek continua liderando nosso partido e está pronto para iniciar um novo programa."
 CZE_invite_strana_zelenych: "Convidar o Strana Zelených"
 CZE_invite_strana_zelenych_desc: "O partido mais voltado à ecologia em nosso país. Suas opiniões combinam com alguns de nossos objetivos e convidá-los para nossa coalizão nos ajudará a concluir os programas verdes."
 CZE_invite_kdu_csl: "Convidar o KDU-ČSL"
 CZE_invite_kdu_csl_desc: "O KDU-ČSL tem forte apoio às famílias e às questões sociais. Eles nos ajudarão a chegar às famílias católicas do país e a aumentar o apoio entre elas."
 CZE_stabilize_the_coalition: "Estabilizar a Coalizão"
 CZE_stabilize_the_coalition_desc: "A nova coalizão está desorganizada. Se quisermos mantê-la, temos de aumentar nosso senso de solidariedade."
 CZE_reform_of_czech_public_finances: "Reforma das Finanças Públicas Tchecas"
 CZE_reform_of_czech_public_finances_desc: "Pensávamos que este capítulo estava encerrado. Mas o problema financeiro é recorrente e precisamos combatê-lo repetidamente para manter nossa economia estável."
 CZE_reform_of_healthcare: "Reforma da Saúde"
 CZE_reform_of_healthcare_desc: "Gastamos dinheiro demais com nossa saúde, e não de forma positiva. Desperdiçamos orçamento com sistemas de saúde ineficientes e máquinas que deveriam ter sido modernizadas há muito tempo."
 CZE_grand_tax_reform: "Grande Reforma Tributária"
 CZE_grand_tax_reform_desc: "Certo, uma última vez. É hora de finalmente nos livrarmos dos problemas tributários e introduzir a solução definitiva para o nosso sistema de impostos."
 CZE_pension_reform: "Reforma da Previdência"
 CZE_pension_reform_desc: "As pessoas precisam receber benefícios maiores por seu serviço ao nosso país. Concederemos a elas bons benefícios por isso."
 CZE_senate_elections: "Eleições Senatoriais"
 CZE_senate_elections_desc: "Mais eleições se aproximam. O ČSSD está crescendo rapidamente em popularidade e esta será uma grande batalha em que apenas um de nós terá sucesso."
 CZE_stop_the_critics: "Calar os Críticos"
 CZE_stop_the_critics_desc: "O ČSSD não desiste e uma onda de críticas atingiu nosso partido. Para contra-atacar, precisaremos de muito poder político."
 CZE_speak_against_cssd: "Discursar contra o ČSSD"
 CZE_speak_against_cssd_desc: "É a nossa vez de atacar o ČSSD. Vamos arranhar seu apoio e sua imagem para conquistar um novo eleitorado."
 CZE_leadership_of_petr_necas: "Liderança de Petr Nečas"
 CZE_leadership_of_petr_necas_desc: "É hora de cuidar do sistema agrícola e da energia verde. Petr Nečas mudará nosso governo e começará a realizar esse programa."
 CZE_tomas_chalupa_new_minister_of_the_environment: "Tomáš Chalupa, Ministro do Meio Ambiente"
 CZE_tomas_chalupa_new_minister_of_the_environment_desc: "Tomáš Chalupa garantirá que nossas áreas verdes permaneçam intactas e que o desenvolvimento da energia verde continue no caminho certo. É importante para nós deixar de usar carvão como fonte de energia o mais rápido possível."
 CZE_yet_another_renewable_energy_program: "Mais um Programa de Energia Renovável"
 CZE_yet_another_renewable_energy_program_desc: "Outros partidos também fazem isso, mas isso não significa que nós não devamos fazer. É um de nossos objetivos mais comuns na esfera política e faremos de tudo para progredir aqui."
 CZE_transport_sector_renovation: "Renovação do Setor de Transportes"
 CZE_transport_sector_renovation_desc: "Algumas de nossas ferrovias e estradas estão danificadas ou desatualizadas. Cuidaremos delas e as modernizaremos para atender aos padrões atuais."
 CZE_coalition_with_top_09_and_veci_verejne: "Coalizão com o TOP 09 e o Věci Veřejné"
 CZE_coalition_with_top_09_and_veci_verejne_desc: "Novas eleições significam novos aliados. Desta vez encontraremos o TOP 09 e o Věci Veřejné para trabalharmos juntos no parlamento."
 CZE_reduce_the_number_of_ministries: "Reduzir o Número de Ministérios"
 CZE_reduce_the_number_of_ministries_desc: "Temos ministérios demais. Se fundirmos alguns deles, reduziremos os problemas de burocracia e aceleraremos o serviço administrativo."
 CZE_petr_bendl_new_minister_of_the_agriculture: "Petr Bendl, Novo Ministro da Agricultura"
 CZE_petr_bendl_new_minister_of_the_agriculture_desc: "Petr Bendl é um político que se importa mais do que os outros com as regiões rurais. Com sua ajuda, poderemos resolver muitos problemas ignorados por muitos anos e acabaremos com o problema de haver sistemas demais que deveriam funcionar juntos."
 CZE_rural_development_program: "Programa de Desenvolvimento Rural"
 CZE_rural_development_program_desc: "Primeiro, temos de resolver problemas como o risco de enchentes ou secas. Isso melhorará a situação das fazendas e dos campos de cultivo."
 CZE_connect_the_agriculture_system_together: "Unir os Sistemas Agrícolas"
 CZE_connect_the_agriculture_system_together_desc: "É hora de nos livrar do sistema agrícola desnecessariamente complicado e criar um novo que cuide de todos os aspectos de nossa região rural."
 CZE_leadership_of_petr_fiala: "Liderança de Petr Fiala"
 CZE_leadership_of_petr_fiala_desc: "A Era de Petr Fiala começou. É hora de voltar à esfera política com toda a força e determinação, começando por concluir nosso mais novo programa eleitoral, baseado em reformas em todo o país e no esforço pela energia nuclear."
 CZE_refuse_the_eurozone: "Recusar a Zona do Euro"
 CZE_refuse_the_eurozone_desc: "Nossa estável česká koruna é a única moeda oficial em nosso país. A Zona do Euro prejudicará nossa independência e imporá um controle mais rígido por parte da União Europeia."
 CZE_back_to_game: "De Volta ao Jogo"
 CZE_back_to_game_desc: "O ČSSD prejudicou muito nossa reputação anteriormente. Nosso partido esteve perto de uma situação crítica, mas conseguimos sobreviver aos tempos difíceis e voltamos mais fortes do que nunca!"
 CZE_joint_ministers_of_economy: "Ministros da Economia Conjuntos"
 CZE_joint_ministers_of_economy_desc: "Continuação do nosso programa anterior. Desta vez alcançaremos o setor econômico e uniremos todos os ministros da economia. Este objetivo está quase concluído, só precisamos dar mais um passo."
 CZE_reform_mining_sector: "Reformar o Setor de Mineração"
 CZE_reform_mining_sector_desc: "Nossos recursos são limitados e muitos deles estão sendo exportados para o mercado externo. Temos de fazer algo a respeito."
 CZE_finish_the_highway_network_program: "Concluir o Programa da Rede de Rodovias"
 CZE_finish_the_highway_network_program_desc: "Este programa começou há muitos anos e estamos prestes a finalmente concluí-lo. Nossa nova rodovia encurtará a distância percorrida de carro e, como resultado, reduzirá o consumo de combustível."
 CZE_nuclear_not_solar_or_water_energy: "Nuclear, Não Solar nem Hídrica"
 CZE_nuclear_not_solar_or_water_energy_desc: "A energia nuclear é a melhor fonte de energia que podemos obter neste momento. Essa deve ser nossa prioridade."
 CZE_slusny_lidr_dobry_program_silna_pravice: "Bom Líder, Programa Certo, Direita Forte"
 CZE_slusny_lidr_dobry_program_silna_pravice_desc: "Bom Líder, Programa Certo, Direita Forte. Este foi nosso último slogan eleitoral, que nos rendeu muitos votos nas eleições. Vamos mostrar ao povo que não estávamos mentindo ao dizer essas palavras."
 CZE_stop_the_construction_delays: "Acabar com os Atrasos nas Obras"
 CZE_stop_the_construction_delays_desc: "Os canteiros de obras enfrentam muitos atrasos por vários motivos. Tentaremos evitar novos atrasos e acelerar a construção de novos edifícios."
 CZE_fight_the_breaking_law_ecological_activists: "Combater os Ativistas Ecológicos que Violam a Lei"
 CZE_fight_the_breaking_law_ecological_activists_desc: "Alguns ativistas ecológicos começaram a violar a lei para mostrar seu 'respeito' pelo meio ambiente. Isso precisa parar!"
 CZE_intelligent_cities_program: "Programa de Cidades Inteligentes"
 CZE_intelligent_cities_program_desc: "Estamos perto de chegar à segunda década do século XXI. A tecnologia está muito melhor agora do que no início do milênio e a usaremos para tornar nossas maiores cidades mais avançadas do que nunca."
 CZE_more_efficient_waste_management: "Gestão de Resíduos Mais Eficiente"
 CZE_more_efficient_waste_management_desc: "É hora de acabar com os descartes ilegais de lixo e construir mais locais para armazená-lo. Tornaremos nosso país mais limpo e um lugar melhor para se viver."
 CZE_use_new_technology_to_respect_the_environmental_laws: "Usar Tecnologia para Respeitar as Leis Ambientais"
 CZE_use_new_technology_to_respect_the_environmental_laws_desc: "Falando em tecnologia avançada, também podemos usá-la para reduzir os impactos ambientais nocivos das máquinas movidas a petróleo, que causam muita poluição."
 CZE_preparations_for_the_together_coalition: "Preparativos para a Coalizão Spolu"
 CZE_preparations_for_the_together_coalition_desc: "A Coalizão JUNTOS será nossa maior estratégia para manter o poder no parlamento e criar um governo forte e estável de uma vez por todas."
 CZE_limit_the_officials_power_on_private_property: "Limitar o Poder dos Funcionários sobre a Propriedade Privada"
 CZE_limit_the_officials_power_on_private_property_desc: "As pessoas são limitadas demais quanto ao que podem fazer em suas próprias propriedades. Cortaremos parte do poder dos funcionários para tirá-los do pé dessas pessoas."
 CZE_path_towards_european_union: "Caminho Rumo à União Europeia"
 CZE_path_towards_european_union_desc: "Devemos almejar entrar nesse grupo. Antes disso, temos de adotar a nova lei e fazer reformas importantes para que os membros da UE tenham mais probabilidade de aceitar nossa candidatura."
 CZE_prepare_for_the_new_law: "Preparar-se para a Nova Lei"
 CZE_prepare_for_the_new_law_desc: "Então vamos começar adotando a nova lei da UE. Isso inclui muitas reformas que prejudicarão um pouco nosso país, mas o incômodo vale o efeito final."
 CZE_visit_to_brussels: "Visita a Bruxelas"
 CZE_visit_to_brussels_desc: "Podemos ganhar mais aceitação visitando a Bélgica em sua capital. Enviaremos nosso ministro das Relações Exteriores nesta missão para garantir seu sucesso. Não podemos permitir nenhum erro."
 CZE_start_the_reforms: "Iniciar as Reformas"
 CZE_start_the_reforms_desc: "Estamos prontos para iniciar as reformas em nossa legislação atual. Será difícil não violar a constituição, mas faremos de tudo para agradar a todos."
 CZE_courts_reform: "Reforma dos Tribunais"
 CZE_courts_reform_desc: "Temos alguma corrupção que precisa ser purgada. Começando pelos tribunais e juízes corruptos, poderemos avançar na integração à UE."
 CZE_administration_problem: "Problema Administrativo"
 CZE_administration_problem_desc: "A introdução da nova lei causa muitos problemas no setor de escritórios. Para evitar o caos, mudaremos a forma como tudo é organizado e instalaremos novos equipamentos de informática para acelerar todo o processo."
 CZE_ecological_innovations: "Inovações Ecológicas"
 CZE_ecological_innovations_desc: "A União Europeia se empenha fortemente em manter a estabilidade ecológica e proclamar ações pró-ecológicas entre seus membros. Temos de nos adaptar a essa forma de desenvolvimento."
 CZE_reduce_the_corruption: "Reduzir a Corrupção"
 CZE_reduce_the_corruption_desc: "É hora de livrar nosso país da corrupção. Vamos mostrar à UE que podemos viver sem ela e ainda assim progredir ainda mais e melhor."
 CZE_country_wide_referendum: "Referendo Nacional"
 CZE_country_wide_referendum_desc: "Antes de sermos aceitos pelos membros da União Europeia, temos de ser aceitos por nossos cidadãos. Não há razão para entrar na UE se nosso povo não quer fazer parte dela."
 CZE_increased_role_of_the_strana_zelenych_party: "Maior Papel do Partido §7Strana Zelených§!"
 CZE_increased_role_of_the_strana_zelenych_party_desc: "O principal partido pró-ecológico do nosso país é o Strana Zelených. Se ouvirmos seu programa e começarmos a cumpri-lo, ganharemos seu apoio e nos aproximaremos da UE."
 CZE_eu_candidate: "Candidato à UE"
 CZE_eu_candidate_desc: "Depois de muito tempo, chegou a hora de nos tornarmos um membro candidato oficial da UE. Ouvimos que a União Europeia está se preparando para convidar novos países; vamos mostrar que estamos prontos para esse passo."
 CZE_2002_political_rotation: "Rotatividade Política de 2002"
 CZE_2002_political_rotation_desc: "Nas eleições de 2002, o maior vencedor foi o partido democrático ČSSD, mais uma vez um passo à frente de seu principal rival, o ODS. O ČSSD formou coalizão com o KDU-ČSL e o US-DEU."
 CZE_2006_elections_result: "Resultados das Eleições de 2006"
 CZE_2006_elections_result_desc: "Desta vez, devido a um grande escândalo ocorrido poucos dias antes das eleições, o ČSSD foi acusado de corrupção e de interferência em investigações policiais. Ainda assim, obteve uma porcentagem de votos muito alta, mas não o bastante para derrotar o ODS, vencedor das eleições de 2006. O ODS se aliou ao KDU-ČSL e ao Strana Zelených, enquanto o ČSSD continuou cooperando com o comunista KSČM."
 CZE_2010_elections_result: "Resultados das Eleições de 2010"
 CZE_2010_elections_result_desc: "O ČSSD, mais uma vez com uma pequena maioria, tornou-se o partido governante, assumindo o lugar após o ODS. Antes, a popularidade de ambos os partidos se mantinha na faixa de 30% a 40%, mas desta vez o ČSSD mal chegou a 22% e o ODS a 20% dos votos. Numa reviravolta, o recém-criado TOP 09 ficou em 3º lugar com 16% dos votos, tornando-se rapidamente um partido muito popular na República Tcheca."
 CZE_2013_elections_result: "Resultados das Eleições de 2013"
 CZE_2013_elections_result_desc: "Esta eleição foi muito ruim para o ODS, que obteve apenas 7% do total de votos. Foi a pior pontuação de sua história moderna. O povo voltou a confiar no ČSSD. Antes das eleições, foi criado um novo partido, o ANO 2011. Ele ganhou popularidade significativa e terminou em segundo lugar nas eleições legislativas de 2013, a apenas 2% do ČSSD. O terceiro partido foi o KSČM, com 14% dos votos."
 CZE_2017_elections_result: "Resultados das Eleições de 2017"
 CZE_2017_elections_result_desc: "Desta vez aconteceu algo singular. Um partido criado 7 anos antes, o ANO, esmagou totalmente seus rivais, obtendo quase 30% do total de votos, enquanto o segundo maior partido, o ODS, obteve apenas 11%. Também houve um aumento significativo de popularidade do Partido Pirata, que melhorou sua pontuação em 8% e terminou com 10%. O ČSSD e o KSČM obtiveram apenas 7% dos votos cada."
 CZE_2021_elections_result: "Resultados das Eleições de 2021"
 CZE_2021_elections_result_desc: "Desta vez o ANO terminou com 27,13% dos votos. Infelizmente para eles, isso só bastou para ficar em segundo lugar. Em resposta à esmagadora popularidade do ANO, o ODS, junto com o KDU-ČSL e o TOP 09, criou uma aliança chamada SPOLU (tcheco: JUNTOS). A coalizão foi forte o bastante para vencer as eleições com 27,79% dos votos, ganhando por uma pequena diferença de 0,66%. A SPOLU existe até hoje, em 2024, e apoiava a candidatura presidencial do general militar aposentado Petr Pavel."
 CZE_cssd_program: "Programa do ČSSD"
 CZE_cssd_program_desc: "O programa geral do ČSSD é equilibrar os gastos, investir na economia e aumentar o bem-estar social (como quase todos os outros partidos). Mantém boas relações com o partido comunista KSČM e segue as leis do keynesianismo. Seu maior rival é outro partido democrático, o ODS."
 CZE_stay_close_with_the_communists: "Manter Proximidade com os Comunistas"
 CZE_stay_close_with_the_communists_desc: "O ČSSD é um partido social-democrata. Assim como os comunistas, quer aumentar muito o orçamento social, e ambos os partidos cooperaram por muito tempo, até que a popularidade do ANO fez o ČSSD escolher entre eles e o KSČM."
 CZE_keynesianism: "Keynesianismo"
 CZE_keynesianism_desc: "O keynesianismo defende o aumento dos gastos estatais para aumentar o crescimento econômico e sustentar o desenvolvimento estável. O ČSSD segue fortemente suas regras e as integrou em seu programa de desenvolvimento."
 CZE_nato_diplomacy: "Diplomacia da OTAN"
 CZE_nato_diplomacy_desc: "A OTAN é uma aliança poderosa que une a Europa mais do que nunca. A era das guerras finalmente acabou e os países podem desenvolver sua economia civil em vez da indústria de guerra. Mas, mesmo com esse aliado, não podemos baixar a guarda e devemos estar sempre preparados para a defesa com a ajuda de nossos parceiros."
 CZE_progressive_taxes: "Impostos Progressivos"
 CZE_progressive_taxes_desc: "O sistema tributário do nosso país é antiquado. Algumas coisas do regime comunista ainda não acabaram e seremos nós a lidar com isso."
 CZE_turn_for_mixed_economy: "Rumo à Economia Mista"
 CZE_turn_for_mixed_economy_desc: "Nossa economia depende fortemente da indústria automotiva, dominada pela empresa Škoda. Isso bastou até os dias atuais, mas temos de olhar para o futuro e iniciar a produção avançada de outros bens."
 CZE_question_us_politics: "Questionar a Política dos EUA"
 CZE_question_us_politics_desc: "A América está jogando seu próprio jogo. É óbvio que querem manter a estabilidade e a paz, mas será que são realmente jogadores inocentes aqui?"
 CZE_bank_tax: "Imposto Bancário"
 CZE_bank_tax_desc: "Os bancos têm liberdade demais. Colocaremos uma tributação extra sobre eles para limitar seu raio de ação."
 CZE_make_use_of_the_economic_boom: "Aproveitar o Boom Econômico"
 CZE_make_use_of_the_economic_boom_desc: "Nosso país está finalmente vivendo o boom econômico. É uma ótima oportunidade para reduzir nossa dívida nacional."
 CZE_keep_economy_stable: "Manter a Economia Estável"
 CZE_keep_economy_stable_desc: "Estamos vivendo um boom econômico, mas ele acabará mais rápido do que esperamos. Será melhor desacelerar a economia e fazer planos para os próximos anos para que o aumento da produtividade dure ainda mais."
 CZE_stop_the_growing_debt: "Conter a Dívida Crescente"
 CZE_stop_the_growing_debt_desc: "Graças ao boom econômico, podemos pagar parte de nossas dívidas. Este é mais um passo para tornar a República Tcheca totalmente independente."
 CZE_continuation_of_social_funding: "Continuação do Financiamento Social"
 CZE_continuation_of_social_funding_desc: "Um de nossos objetivos constantes. Continuar progredindo rumo ao Estado de bem-estar social."
 CZE_promote_pro_ecological_activities: "Promover Atividades Pró-Ecológicas"
 CZE_promote_pro_ecological_activities_desc: "Não é um de nossos principais objetivos, mas é sempre bom mostrar ao eleitorado que ainda nos importamos com a ecologia. Por qualquer ângulo que se veja, os agricultores que fornecem alimentos e outros bens são a base de uma nação."
 CZE_european_parliament_elections: "Eleições para o Parlamento Europeu"
 CZE_european_parliament_elections_desc: "É hora de outra eleição. Desta vez, para o Parlamento Europeu. Devemos superar facilmente nossos adversários e conquistar boas cadeiras."
 CZE_vladimir_spidl_leaves_party: "Vladimír Špidla Deixa o Partido"
 CZE_vladimir_spidl_leaves_party_desc: "Tinha de acontecer. Bem, sentiremos sua falta. Mas por ora temos de escolher outro líder, pois o ODS ainda está em nosso encalço."
 CZE_victory_of_vladimir_spidl: "Vitória de Vladimír Špidla"
 CZE_victory_of_vladimir_spidl_desc: "Surpreendentemente, Vladimír Špidla conseguiu vencer as eleições e manteve sua liderança. É hora de grandes ações diplomáticas."
 CZE_stanislav_gross_as_a_new_leader: "Stanislav Gross como Novo Líder"
 CZE_stanislav_gross_as_a_new_leader_desc: "Stanislav Gross foi eleito novo líder do nosso partido. Veremos como ele conduzirá o partido."
 CZE_grand_eu_integration: "Grande Integração à UE"
 CZE_grand_eu_integration_desc: "Uma das primeiras decisões de Vladimír Špidla é aumentar a popularidade entre os membros da UE. Manter boas relações com eles é uma boa escolha não só para o nosso partido, mas também para o nosso país."
 CZE_appreciation_of_british_politics: "Apreço pela Política Britânica"
 CZE_appreciation_of_british_politics_desc: "A Grã-Bretanha vai muito bem hoje. Devemos tomá-la como exemplo e seguir o mesmo caminho."
 CZE_distancing_from_kscm: "Afastamento do KSČM"
 CZE_distancing_from_kscm_desc: "Os líderes anteriores eram ligados demais ao partido comunista. Nosso partido ganhará mais quando cortarmos relações com eles."
 CZE_increasing_czech_position_on_the_international_arena: "Elevar a Posição Tcheca na Arena Internacional"
 CZE_increasing_czech_position_on_the_international_arena_desc: "A União Europeia foi apenas o começo. É hora de ir mais longe e buscar acordos com outros continentes."
 CZE_shifts_in_economy_development: "Mudanças no Desenvolvimento Econômico"
 CZE_shifts_in_economy_development_desc: "O keynesianismo é bom, mas podemos aproveitá-lo melhor se tentarmos. Um pouco controverso, mas tenho certeza de que ficaremos bem."
 CZE_open_up_for_foreign_investors: "Abrir-se aos Investidores Estrangeiros"
 CZE_open_up_for_foreign_investors_desc: "A República Tcheca é conhecida por sua avançada indústria automotiva e seu desenvolvimento. Isso atrai muitos investidores estrangeiros com muito dinheiro. Vamos recebê-los de braços abertos."
 CZE_stanislav_gross_keeps_power: "Stanislav Gross Mantém o Poder"
 CZE_stanislav_gross_keeps_power_desc: "As recentes ações e controvérsias de Stanislav Gross não o impediram de continuar como líder do nosso partido. Veremos como as coisas seguirão."
 CZE_leadership_of_jiri_paroubek: "Liderança de Jiří Paroubek"
 CZE_leadership_of_jiri_paroubek_desc: "Após algumas controvérsias recentes e sua vida privada, Stanislav Gross teve de abrir mão da liderança. Jiří Paroubek foi eleito novo líder do nosso partido."
 CZE_restore_the_kscm_support: "Restaurar o Apoio do KSČM"
 CZE_restore_the_kscm_support_desc: "Stanislav Gross cometeu um erro ao começar a cortar relações com o KSČM. Temos novo líder e novo programa, o que também significa novos (velhos) aliados."
 CZE_accept_the_fate: "Aceitar o Destino"
 CZE_accept_the_fate_desc: "De alguma forma, o ODS conseguiu derrotar o ČSSD nas eleições originais de 2006. Não é o fim do mundo. O ČSSD continua sendo um partido muito popular e continuará seu programa."
 CZE_program_of_the_opposition: "Programa da Oposição"
 CZE_program_of_the_opposition_desc: "Então, que decisões um partido de oposição pode tomar? Provavelmente não tão importantes quanto as do partido governante. O foco deve estar em coisas importantes, porém acessíveis."
 CZE_decrease_corruption: "Reduzir a Corrupção"
 CZE_decrease_corruption_desc: "A corrupção é um problema recorrente em quase todos os países. Temos de estar preparados para combatê-la a qualquer momento."
 CZE_short_term_stagnation: "Estagnação de Curto Prazo"
 CZE_short_term_stagnation_desc: "Nossa economia vai bem, mas, se ela piorar perigosamente, poderemos salvá-la com um pouco de sorte."
 CZE_investitions_in_infrastructure: "Investimentos em Infraestrutura"
 CZE_investitions_in_infrastructure_desc: "Mais uma melhoria em nossa malha viária. Essas estradas conectarão nossas rodovias em muitos pontos novos e encurtarão o tempo de viagem."
 CZE_senate_elections_cssd: "Eleições Senatoriais"
 CZE_senate_elections_cssd_desc: "Lá vamos nós. Nós contra o ODS. É mais uma chance de derrotá-los e vencer novamente as eleições senatoriais."
 CZE_in_your_face_ods: "Na Sua Cara, ODS!"
 CZE_in_your_face_ods_desc: "Conseguimos ultrapassar o ODS nesta corrida e a linha de chegada é só uma reta."
 CZE_back_to_form: "De Volta à Boa Forma"
 CZE_back_to_form_desc: "A derrota nas eleições legislativas foi apenas um tropeço isolado. É hora de voltar à ação de verdade."
 CZE_distrust_the_government: "Desconfiar do Governo"
 CZE_distrust_the_government_desc: "O ODS conseguiu colocar alguns de seus políticos no novo governo. Devemos confiar neles? Acho que não."
 CZE_leadership_of_bohuslav_sobotka: "Liderança de Bohuslav Sobotka"
 CZE_leadership_of_bohuslav_sobotka_desc: "A Era de Jiří Paroubek acabou. É hora de Bohuslav Sobotka se tornar nosso líder."
 CZE_finish_new_highway_construction: "Concluir a Construção da Nova Rodovia"
 CZE_finish_new_highway_construction_desc: "A nova rodovia esteve em construção por muito tempo. Exigiu a cooperação de muitos partidos e empresas. É hora de terminar os últimos quilômetros e inaugurar a nova rodovia."
 CZE_reduce_resource_extraction_cssd: "Reduzir a Extração de Recursos"
 CZE_reduce_resource_extraction_cssd_desc: "A extração de recursos está matando o meio ambiente. Além disso, precisamos manter seu uso limitado. É hora de introduzir algumas mudanças na gestão de recursos."
 CZE_water_resource_will_stay_with_the_state: "Os Recursos Hídricos Permanecerão com o Estado"
 CZE_water_resource_will_stay_with_the_state_desc: "Somos nós que definimos os preços da água. Se vendermos essas empresas a particulares, os preços podem disparar em tempos difíceis."
 CZE_research_new_renewable_energy_power_generators: "Novos Geradores de Energia Renovável"
 CZE_research_new_renewable_energy_power_generators_desc: "É hora de continuar nosso programa de energia renovável. Vamos olhar os geradores solares e eólicos. São bons, mas ficam muito atrás das usinas nucleares. Não podemos torná-los melhores que os reatores nucleares, mas pelo menos podemos melhorar sua produtividade."
 CZE_speed_up_construction_of_new_nuclear_reactor: "Acelerar a Construção do Novo Reator Nuclear"
 CZE_speed_up_construction_of_new_nuclear_reactor_desc: "Com a extração de recursos reduzida, precisamos manter a segurança energética do país. Vamos analisar o projeto do novo reator nuclear."
 CZE_cleaner_air: "Ar Mais Limpo"
 CZE_cleaner_air_desc: "Talvez o ar não esteja tão poluído quanto antes, mas o problema ainda é visível. Precisamos plantar mais árvores e limitar a poluição perigosa."
 CZE_cssd_2013_program: "Programa de 2013"
 CZE_cssd_2013_program_desc: "Outra eleição, outro programa. Desta vez, vamos focar na imagem do país e formar novas coalizões."
 CZE_wealth_tax: "Imposto sobre a Riqueza"
 CZE_wealth_tax_desc: "Se nossos cidadãos mais ricos não querem compartilhar seu dinheiro para ajudar no desenvolvimento do país, introduziremos um novo imposto sobre a riqueza. Essa é uma solução fácil para o problema."
 CZE_continue_churches_reparations: "Continuar as Reparações às Igrejas"
 CZE_continue_churches_reparations_desc: "O KDU-ČSL apreciará este ato, que nos aproximará de formar uma coalizão comum. Além disso, algumas de nossas igrejas estão em condições realmente ruins."
 CZE_ano_and_kducsl_coalition: "Coalizão ANO e KDU-CSL"
 CZE_ano_and_kducsl_coalition_desc: "É hora de uma nova aliança. O jovem partido ANO e um dos mais antigos, o KDU-ČSL. Uma combinação interessante, que pode fracassar feio ou ter sucesso com grandes benefícios para todos nós."
 CZE_higher_renewable_energy_expenditure: "Maior Gasto com Energia Renovável"
 CZE_higher_renewable_energy_expenditure_desc: "Esta é uma continuação direta do nosso programa anterior. A energia renovável é o futuro do mundo, o carvão é um recurso obsoleto. Não podemos continuar dependendo de um elemento que causa tanto dano ao meio ambiente."
 CZE_shut_down_the_neo_nazi_workers_party: "Fechar o Partido dos Trabalhadores Neonazista"
 CZE_shut_down_the_neo_nazi_workers_party_desc: "Eles foram longe demais. É hora de fechar essa célula de uma vez por todas. Essa ideologia e doutrina deveriam ter sido proibidas em nosso país há muito tempo!"
 CZE_reduce_flooding_risk: "Reduzir o Risco de Enchentes"
 CZE_reduce_flooding_risk_desc: "Nossos rios às vezes podem ser perigosos. E, quando são, causam muitos danos à população local. É hora de acabar com esse medo e preparar novos sistemas de defesa."
 CZE_leadership_of_jan_hamacek: "Liderança de Jan Hamáček"
 CZE_leadership_of_jan_hamacek_desc: "Outro dia, outro líder. Jan Hamáček terá que enfrentar decisões realmente difíceis nos próximos anos. Esperemos que consiga ser um ótimo líder nesse período."
 CZE_increase_food_quality: "Aumentar a Qualidade dos Alimentos"
 CZE_increase_food_quality_desc: "Embora a tecnologia esteja melhorando, a qualidade dos alimentos melhora de forma bem lenta. Novos subsídios acelerarão esse processo."
 CZE_ano_over_communists: "ANO Acima dos Comunistas"
 CZE_ano_over_communists_desc: "É hora de finalmente nos separarmos do KSČM e ficarmos com o ANO. Eles são o futuro deste país e ficaremos apenas com os melhores."
 CZE_new_healthcare_budget_in_times_of_crisis: "Novo Orçamento da Saúde em Tempos de Crise"
 CZE_new_healthcare_budget_in_times_of_crisis_desc: "Então aconteceu. Um novo capítulo da história humana começou. Precisamos enfrentar esta crise da melhor forma possível."
 CZE_new_apartments_and_houses: "Novos Apartamentos e Casas"
 CZE_new_apartments_and_houses_desc: "Esta ideia atrairá novos investidores e pessoas que querem viver em nosso país. É uma tarefa simples, mas muito importante para a economia."
 CZE_grants_for_novavax: "Subsídios para a Novavax"
 CZE_grants_for_novavax_desc: "A Novavax é nossa principal empresa no desenvolvimento de novas vacinas. Ela vale qualquer dinheiro e por isso precisa muito do nosso apoio agora."
 CZE_security_funding: "Financiamento da Segurança"
 CZE_security_funding_desc: "Os tempos voltaram a ficar instáveis. É hora de cuidar do nosso orçamento de defesa e nos preparar para a ameaça que se aproxima."
 CZE_usdeu_program: "Programa US-DEU"
 CZE_usdeu_program_desc: "O programa US-DEU defende uma política liberal, o que significa reduzir o poder do governo e dar mais liberdades civis. O US-DEU mantém distância do partido comunista KSČM e tenta desenvolver o país lentamente."
 CZE_push_for_tax_reform: "Pressionar pela Reforma Tributária"
 CZE_push_for_tax_reform_desc: "Não somos uma força significativa no governo, mas todos concordamos que a reforma tributária deve ser concluída o quanto antes. Seremos nós a impulsionar essa reforma."
 CZE_stable_development: "Desenvolvimento Estável"
 CZE_stable_development_desc: "Não há necessidade de forçar tanto a economia. Melhor manter a economia estável do que arriscar uma recessão."
 CZE_social_liberalism: "Liberalismo Social"
 CZE_social_liberalism_desc: "Nosso povo sabe o quão opressor ou injusto um governo pode ser. Devemos buscar limitar o poder do Estado e dar mais liberdade ao nosso povo."
 CZE_democratic_spirit: "Espírito Democrático"
 CZE_democratic_spirit_desc: "Depois que nos voltamos para a democracia, nosso país está em constante crescimento. Devemos manter essa mentalidade e ser gratos pelo que temos."
 CZE_support_national_minority: "Apoiar as Minorias Nacionais"
 CZE_support_national_minority_desc: "O Estado anterior não foi muito gentil com as minorias nacionais na República Tcheca. É nosso papel ajudar essas pessoas e flexibilizar a lei de migração."
 CZE_kscm_issue: "A Questão do KSCM"
 CZE_kscm_issue_desc: "É inacreditável que ainda tenhamos um partido comunista no governo. Eles não são os comunistas opressores de antes, mas ainda são uma ameaça à nossa democracia."
 CZE_promote_country_of_law_idea: "Promover a Ideia de Estado de Direito"
 CZE_promote_country_of_law_idea_desc: "Nossa lei e a constituição são as coisas mais importantes neste país. Todos devem obedecê-las, inclusive o governo. Esta é a única forma de manter o Estado dentro de limites aceitáveis."
 CZE_country_without_oppresion: "País sem Opressão"
 CZE_country_without_oppresion_desc: "A democracia foi feita para as pessoas. E as pessoas devem saber que é uma ideologia segura para elas. Aumentaremos os gastos com a polícia para manter nossa nação estável e protegida."
 CZE_fear_of_another_communist_regime: "Medo de Outro Regime Comunista"
 CZE_fear_of_another_communist_regime_desc: "Mas e se o KSČM conseguir chegar ao poder? O que acontecerá com nosso espírito democrático? Não podemos deixar isso acontecer se quisermos dormir tranquilos."
 CZE_western_view: "Visão Ocidental"
 CZE_western_view_desc: "Devemos buscar ingressar na União Europeia. Os países ocidentais estão se desenvolvendo de forma insanamente rápida e por isso devemos seguir seu estilo de vida."
 CZE_stabilize_the_situation: "Estabilizar a Situação"
 CZE_stabilize_the_situation_desc: "Mais uma eleição acabou. Poderia ter sido melhor, mas não podemos parar agora. Ainda há muito a fazer para tornar nosso país grande."
 CZE_reduce_effect_of_the_ctyrkoalice_split: "Reduzir o Efeito da Divisão da Čtyřkoalice"
 CZE_reduce_effect_of_the_ctyrkoalice_split_desc: "Infelizmente, a Čtyřkoalice não sobreviveu por muito tempo. Foi uma boa cooperação, mas pouco bem-sucedida. De qualquer forma, nossa popularidade foi arranhada e precisamos consertar isso."
 CZE_pavel_nemec_for_the_leader: "Pavel Němec para Líder"
 CZE_pavel_nemec_for_the_leader_desc: "Vamos escolher Pavel Němec como nosso próximo líder. Ele não tem muita experiência, mas precisamos alcançar a juventude do nosso país."
 CZE_preparations_for_the_2006_elections: "Preparativos para as Eleições de 2006"
 CZE_preparations_for_the_2006_elections_desc: "Continuamos perdendo popularidade. Isso não é bom, então talvez seja hora de uma estratégia mais pouco convencional..."
 CZE_the_case_of_the_qatari_prince: "O Caso do Príncipe Catarense"
 CZE_the_case_of_the_qatari_prince_desc: "O príncipe catarense violou nossa lei, cometendo crimes gravíssimos. Aqui não é o Oriente Médio, é a Europa. Não toleraremos esse comportamento aqui. Pavel Němec deve decidir o que fazer com ele."
 CZE_its_legal: "'É Legal'"
 CZE_its_legal_desc: "Precisamos pensar no que nossos jovens cidadãos querem do partido governante. Legalização da maconha? Aceitação LGBT? Vamos por este caminho, o que poderia dar errado?"
 CZE_shift_to_semi_anarchism: "Guinada ao Semianarquismo"
 CZE_shift_to_semi_anarchism_desc: "Nosso programa fracassou. Dane-se, só resta uma coisa que pode funcionar e atrair mais eleitores. É hora de mudar nossa visão de mundo."
 CZE_jan_hadrav_leadership: "Liderança de Jan Hadrava"
 CZE_jan_hadrav_leadership_desc: "Vamos simplesmente esquecer a eleição anterior, certo? Legal. Jan Hadrava liderará nosso partido agora, Pavel Němec não deveria ter assumido esse posto antes..."
 CZE_jan_cerny_leadership: "Liderança de Jan Černý"
 CZE_jan_cerny_leadership_desc: "Infelizmente nosso partido está mais desestabilizado do que pensávamos. Devemos tentar com Jan Černý agora. Talvez ele finalmente nos leve a um futuro brilhante."
 CZE_reform_of_the_housing_sector: "Reforma do Setor Habitacional"
 CZE_reform_of_the_housing_sector_desc: "É hora de algumas reformas sólidas. Se cuidarmos do setor habitacional, o povo verá que realmente nos importamos com este país."
 CZE_increase_maternity_leave_time: "Aumentar a Licença-Maternidade"
 CZE_increase_maternity_leave_time_desc: "Há poucas chances de que realmente funcione, mas vale a tentativa. É hora de impulsionar uma lei."
 CZE_finish_repair_of_damage_after_communist_regime: "Concluir os Reparos Após o Regime Comunista"
 CZE_finish_repair_of_damage_after_communist_regime_desc: "Os danos causados pelos comunistas foram muito maiores do que pensávamos. Mas, graças a um orçamento estatal decente, conseguiremos concluir as reparações."
 CZE_further_upgrade_of_infrastructure_network: "Nova Modernização da Rede de Infraestrutura"
 CZE_further_upgrade_of_infrastructure_network_desc: "Todo mundo está fazendo isso, então não seremos piores que eles. Com a popularidade que nos resta, aprovaremos mais uma lei no governo."
 CZE_take_more_advantage_of_renewable_energy: "Aproveitar Mais a Energia Renovável"
 CZE_take_more_advantage_of_renewable_energy_desc: "A energia renovável manterá a segurança energética do nosso país. Moinhos de vento, painéis solares, infraestrutura hidrelétrica. Devemos investir nesses projetos."
 CZE_aim_for_lower_taxes: "Buscar Impostos Menores"
 CZE_aim_for_lower_taxes_desc: "Nosso colapso é inevitável. Vamos aprovar mais uma lei antes de anunciarmos a renúncia."
 CZE_end_of_usdeu: "Fim do US-DEU"
 CZE_end_of_usdeu_desc: "Nossa hora chegou. O fracasso nas eleições de 2002 e 2006 foi prejudicial demais para o nosso partido. Foram tomadas decisões horríveis, houve muitas controvérsias internas. Ele não conseguiu sobreviver, o US-DEU acabou."
 CZE_ano_program: "Programa do ANO"
 CZE_ano_program_desc: "O ANO foi criado em 2011, mas se tornou um partido político em 11 de maio de 2012. Foi criado por pessoas em oposição aos outros partidos. Seu programa é voltado a todas as pessoas da República Tcheca, cuidando do Estado de bem-estar e apresentando ao país uma nova forma de desenvolvimento."
 CZE_we_are_not_politicians: "Não Somos Políticos"
 CZE_we_are_not_politicians_desc: "O ANO não foi criado por políticos. Originalmente era um movimento cujo objetivo era combater a corrupção e a insatisfação dos cidadãos e curar o sistema político."
 CZE_corruption_problem: "Problema da Corrupção"
 CZE_corruption_problem_desc: "Os outros partidos falam continuamente em reduzir a corrupção, mas esse problema ainda existe em nosso país. Não queremos esperar nem mais um ano. É hora de mostrarmos nossa força."
 CZE_prepare_for_the_2013_elections: "Preparar-se para as Eleições de 2013"
 CZE_prepare_for_the_2013_elections_desc: "Ainda não temos um apoio enorme, mas nosso novo programa eleitoral convencerá as pessoas a votar em nós nas próximas eleições. Estamos fazendo isso por todos."
 CZE_unemployment_problem: "Problema do Desemprego"
 CZE_unemployment_problem_desc: "A Škoda continua criando novos postos de trabalho, mas ainda sofremos com o desemprego. Devemos dar uma olhada nisso."
 CZE_kick_off_the_insincere_politicians: "Expulsar os Políticos Insinceros"
 CZE_kick_off_the_insincere_politicians_desc: "Alguns de nossos políticos não foram leais ao nosso partido. Não podemos deixar isso passar e precisamos tomar algumas decisões difíceis."
 CZE_eticky_kodex: "Código de Ética"
 CZE_eticky_kodex_desc: "O ANO foi originalmente criado como um movimento, não como partido político. Mas não podemos fazer mudanças significativas sem esse título. Estamos num caos que precisa ser organizado bem rápido."
 CZE_first_laws_must_be_consulted_with_the_parliamentary_group: "As Leis Devem Ser Consultadas com o Grupo"
 CZE_first_laws_must_be_consulted_with_the_parliamentary_group_desc: "Se quisermos impulsionar quaisquer reformas, todos nós devemos concordar que elas ajudarão nosso país. Por isso temos que consultar toda mudança na lei."
 CZE_second_you_cant_move_to_another_club_during_torm_of_office: "Não Se Pode Sair Durante o Mandato"
 CZE_second_you_cant_move_to_another_club_during_torm_of_office_desc: "Isso seria uma traição. Se você escolheu nosso partido, permaneça leal a ele e não prejudique nossa popularidade aos olhos dos eleitores."
 CZE_third_in_serious_matters_you_cannot_vote_against_ano: "Em Assuntos Sérios, Não Se Pode Votar Contra o ANO"
 CZE_third_in_serious_matters_you_cannot_vote_against_ano_desc: "Temos que ajudar uns aos outros em todos os casos, mas em assuntos realmente sérios devemos permanecer unidos e seguir estritamente o nosso programa."
 CZE_fourth_you_must_doname_7000_crowns_to_the_ano_every_month: "É Preciso Doar 7000 Coroas ao ANO Todo Mês"
 CZE_fourth_you_must_doname_7000_crowns_to_the_ano_every_month_desc: "Nosso partido tem muitos patrocinadores, mas não podemos depender deles nem do orçamento do nosso líder. Cada membro terá que financiar o ANO para tornar sua situação financeira estável."
 CZE_cssd_and_kducsl_coalition: "Coalizão ČSSD e KDU-ČSL"
 CZE_cssd_and_kducsl_coalition_desc: "Podemos confiar no ČSSD e no KDU-ČSL. Não podemos fazer inimigos em todo lugar e precisamos de alguns aliados."
 CZE_join_the_ministry_of_finance: "Entrar no Ministério das Finanças"
 CZE_join_the_ministry_of_finance_desc: "Se entrarmos no Ministério das Finanças, poderemos gerir os gastos nacionais de forma mais eficiente e melhorar o orçamento do nosso país."
 CZE_join_the_ministry_of_internal_affairs: "Entrar no Ministério do Interior"
 CZE_join_the_ministry_of_internal_affairs_desc: "O Ministério do Interior controla os tribunais, o respeito às leis e a manutenção da estabilidade do nosso país. Se entrarmos nele, poderemos transformar mais facilmente nossas leis."
 CZE_join_the_ministry_of_regional_development: "Entrar no Ministério do Desenvolvimento Regional"
 CZE_join_the_ministry_of_regional_development_desc: "O desenvolvimento regional é importante para melhorar a economia e a indústria do nosso país. Ele lidera o setor econômico e, se entrarmos nele, poderemos escolher o caminho do desenvolvimento industrial."
 CZE_new_head_politics_of_the_country_management: "Nova Política de Gestão do País"
 CZE_new_head_politics_of_the_country_management_desc: "Nossa coalizão com o ČSSD e o KDU-ČSL nos permite formar um novo governo. É uma ótima ocasião para assumir o controle das instituições nacionais mais importantes."
 CZE_2014_european_parliamentary_elections: "Eleições para o Parlamento Europeu de 2014"
 CZE_2014_european_parliamentary_elections_desc: "As eleições da UE são muito importantes para nós. Se conseguirmos assentos suficientes, ganharemos prestígio aos olhos dos membros da União Europeia e mais apoio na República Tcheca."
 CZE_makat_a_neblabolit: "Faça o seu melhor e não faça bobagem."
 CZE_makat_a_neblabolit_desc: "'Faça o seu melhor e não faça bobagem.' Com essas palavras conseguimos uma popularidade enorme durante as eleições de 2017. Agora vamos nos concentrar em melhorar os gastos nacionais e o desenvolvimento urbano."
 CZE_great_labor_reforms: "Grandes Reformas Trabalhistas"
 CZE_great_labor_reforms_desc: "Nosso código trabalhista é obsoleto e ineficiente. É nosso trabalho mudá-lo."
 CZE_cybersecurity_funding: "Financiamento da Cibersegurança"
 CZE_cybersecurity_funding_desc: "Nossos sistemas de segurança não são de boa qualidade. Se ninguém investir dinheiro para modernizá-los, podemos nos meter em sérios problemas muito em breve."
 CZE_digitalization_of_the_economy_sector: "Digitalização do Setor Econômico"
 CZE_digitalization_of_the_economy_sector_desc: "Com a cibersegurança reforçada, é hora de levar nossas cidades a uma nova era e iniciar a instalação de novas tecnologias."
 CZE_increase_feeling_of_security: "Aumentar a Sensação de Segurança"
 CZE_increase_feeling_of_security_desc: "Os tempos estão ficando tensos novamente. Nosso povo precisa saber que está seguro, então aumentaremos o orçamento de gastos com a polícia."
 CZE_all_for_people_all_from_people: "Tudo pelo Povo, Tudo do Povo"
 CZE_all_for_people_all_from_people_desc: "Todas as nossas ações recentes visam melhorar a qualidade de vida da nossa nação. Essa era nossa missão e tivemos sucesso nela."
 CZE_take_care_of_the_education: "Cuidar da Educação"
 CZE_take_care_of_the_education_desc: "Nossas escolas são boas, mas os professores são mal pagos. Nosso programa inclui esse problema e é hora de resolvê-lo."
 CZE_the_lithium_case: "O Caso do Lítio"
 CZE_the_lithium_case_desc: "O caso do lítio é um caso político que ocorreu poucos dias antes das eleições de 2017 para a Câmara dos Deputados do Parlamento da República Tcheca. O caso surgiu devido à prospecção da jazida de lítio em Cínovec, aos direitos de explorar a jazida e a uma possível mineração posterior. O ČSSD quer cooperar com uma empresa australiana e iniciar a extração, mas alguns de nossos políticos se opõem a essa escolha."
 CZE_attract_kscm_communists: "Atrair os Comunistas do KSCM"
 CZE_attract_kscm_communists_desc: "Alguns políticos de outros partidos decidiram se juntar ao nosso movimento. Falamos principalmente de apoiadores do KSČM e do ČSSD. É uma boa situação para o nosso partido."
 CZE_top_09_program: "Programa do TOP 09"
 CZE_top_09_program_desc: "Os objetivos do TOP 09 incluem, entre outros, evitar as mudanças ambientais causadas pela industrialização do país. Eles buscam o apoio do partido ODS e, atualmente, fazem parte da coalizão SPOLU (tcheco: JUNTOS)."
 CZE_energy_saving: "Economia de Energia"
 CZE_energy_saving_desc: "Nosso povo e nossas corporações desperdiçam energia demais. Sim, temos reatores nucleares e muitas reformas de energia renovável, mas isso não significa que devemos gastar tudo em um mês. Nossas novas regulamentações impedirão que as pessoas desperdicem energia elétrica."
 CZE_cooperate_with_strana_zelenych: "Cooperar com o Strana Zelených"
 CZE_cooperate_with_strana_zelenych_desc: "O Strana Zelených sempre soube que as áreas verdes são muito importantes para o país. Se unirmos nossos programas, poderemos aprovar mais leis no parlamento."
 CZE_modify_green_savings_program: "Modificar o Programa Poupança Verde"
 CZE_modify_green_savings_program_desc: "O programa Poupança Verde inclui a proteção das florestas e dos animais e reduz o problema da poluição. Mas este programa precisa de algumas correções que o tornarão ainda melhor."
 CZE_seek_ods_coalition: "Buscar Coalizão com o ODS"
 CZE_seek_ods_coalition_desc: "Não podemos fazer muito sem a ajuda de um partido maior. O ODS é o que melhor se encaixa em nosso programa e entraremos em contato com eles."
 CZE_karel_schwarzenberg_ministry_of_foreign_affairs: "Ministro das Relações Exteriores Karel Schwarzenberg"
 CZE_karel_schwarzenberg_ministry_of_foreign_affairs_desc: "Karel Schwarzenberg é ministro das Relações Exteriores há algum tempo. Vamos usar juntos esses privilégios para ajudar a promover nosso partido."
 CZE_european_union_appreciation: "Valorização da União Europeia"
 CZE_european_union_appreciation_desc: "A União Europeia se preocupa com o meio ambiente. Algumas de suas leis podem ser contrárias às nossas, mas eles querem o melhor para seus membros."
 CZE_environment_regulations: "Regulamentações Ambientais"
 CZE_environment_regulations_desc: "Algumas empresas têm um efeito devastador sobre o meio ambiente local. Temos que acabar com essa falta de controle e introduzir regulamentações rígidas."
 CZE_limit_forest_clearing: "Limitar o Desmatamento"
 CZE_limit_forest_clearing_desc: "As madeireiras estão cortando árvores demais. Elas plantam novas, mas leva décadas até que se tornem árvores maduras. Elas precisam limitar o corte de árvores."
 CZE_reform_of_the_transport_sector: "Reforma do Setor de Transportes"
 CZE_reform_of_the_transport_sector_desc: "A Škoda está fazendo um bom trabalho na melhoria do nosso setor de motorização, mas seus carros causam poluição demais. Eles precisam reduzir a emissão de CO2."
 CZE_defend_against_ano: "Defender-se do ANO"
 CZE_defend_against_ano_desc: "O ANO critica nosso partido por motivos diversos. Só queremos cuidar do meio ambiente nacional. Não podemos deixar isso passar sem resposta."
 CZE_intensive_environment_regulations: "Regulamentações Ambientais Intensivas"
 CZE_intensive_environment_regulations_desc: "Nosso programa mais recente inclui ainda mais regulamentações verdes. Além disso, temos que financiar a pesquisa de novas tecnologias que ajudarão a alcançar nossos objetivos."
 CZE_regulate_waste_management: "Regular a Gestão de Resíduos"
 CZE_regulate_waste_management_desc: "Nosso país precisa de uma forma melhor de depositar resíduos. Os aterros estão bem, mas, em vez de descartar o lixo, podemos reciclá-lo e dar outra vida aos resíduos."
 CZE_invent_new_technologies: "Inventar Novas Tecnologias"
 CZE_invent_new_technologies_desc: "Vamos destinar dinheiro ao setor de pesquisa e ajudar a inventar novas tecnologias de economia de energia. Não será um investimento barato, mas este passo é necessário."
 CZE_decrease_construction_cost: "Reduzir o Custo de Construção"
 CZE_decrease_construction_cost_desc: "Devemos começar a usar materiais mais baratos, mas de qualidade comparável. Isso reduzirá os gastos nacionais nas obras e acelerará a construção."
 CZE_continue_green_savings_program: "Continuar o Programa Poupança Verde"
 CZE_continue_green_savings_program_desc: "Outra reforma do programa Poupança Verde. Graças à cooperação com o Strana Zelených, podemos aprovar mais uma lei sem problemas."
 CZE_balanced_energy_development: "Desenvolvimento Energético Equilibrado"
 CZE_balanced_energy_development_desc: "Não podemos depender de apenas um tipo de energia. As usinas de combustíveis fósseis não fazem bem ao meio ambiente, mas, se algo acontecer com o setor de energia renovável, elas serão nossos únicos geradores."
 CZE_miroslav_kalousek_for_the_leader: "Miroslav Kalousek para Líder"
 CZE_miroslav_kalousek_for_the_leader_desc: "Kalousek foi líder do KDU-ČSL. Graças a isso, mantemos boas relações com esse partido. Mas será que ele realmente entende nosso programa eleitoral?"
 CZE_modify_agriculture_effect_on_the_environment: "Modificar o Efeito da Agricultura sobre a Terra"
 CZE_modify_agriculture_effect_on_the_environment_desc: "A agricultura é boa em si, mas às vezes exige o corte de árvores. Também não faz muito bem ao solo sob as terras agrícolas. Vamos dar uma olhada nisso."
 CZE_leadership_of_jiri_pospisil: "Liderança de Jiří Pospíšil"
 CZE_leadership_of_jiri_pospisil_desc: "É hora de Jiří Pospíšil mostrar o que pode fazer pelo nosso partido. Um novo líder significa nova energia e entusiasmo para alcançar nossos objetivos."
 CZE_make_new_parks: "Criar Novos Parques"
 CZE_make_new_parks_desc: "Nossas cidades carecem de áreas verdes com ar limpo. Construindo novos parques resolveremos esse problema."
 CZE_energize_the_tourist_sector: "Dinamizar o Setor de Turismo"
 CZE_energize_the_tourist_sector_desc: "As outras pessoas precisam saber que a República Tcheca também vale a visita. Nosso programa tornou este país mais amigo da natureza e nossos visitantes certamente apreciarão isso."
 CZE_leadership_of_marketa_pekarova_adamova: "Liderança de Markéta Pekarová Adamová"
 CZE_leadership_of_marketa_pekarova_adamova_desc: "Markéta Pekarová Adamová foi escolhida como a mais nova líder do nosso partido. Será seu dever integrar nosso partido à coalizão SPOLU."
 CZE_join_the_spolu_coalition: "Entrar na Coalizão SPOLU"
 CZE_join_the_spolu_coalition_desc: "Estamos prontos para nos juntar ao ODS e ao KDU-ČSL na coalizão SPOLU. É um grande dia para os nossos partidos."
 CZE_waste_recycling: "Reciclagem de Resíduos"
 CZE_waste_recycling_desc: "Já introduzimos um programa de reciclagem, mas hoje é hora de melhorá-lo. Novos centros de reciclagem acelerarão todo o processo."
 CZE_invest_in_green_cities: "Investir em Cidades Verdes"
 CZE_invest_in_green_cities_desc: "As ruas devem ser cobertas de árvores, arbustos e outras plantas semelhantes. Esta solução reduzirá a poluição nas cidades e melhorará a qualidade de vida."
 CZE_the_triple_alliance: "A Tríplice Aliança"
 CZE_the_triple_alliance_desc: "A coalizão SPOLU foi oficialmente criada. ODS, TOP 09 e KDU-ČSL se uniram para superar a crescente popularidade do ANO. Isto é apenas o começo. Após o sucesso nas últimas eleições, a coalizão tem de preparar o novo governo."
 CZE_change_in_the_government: "Mudança no Governo"
 CZE_change_in_the_government_desc: "As mudanças no governo começaram. Os 3 partidos escolheram juntos os 5 melhores políticos de suas fileiras para cuidar da gestão nacional. Com essa popularidade, o SPOLU também pode decidir sobre os planos futuros de desenvolvimento que mudarão a forma de gerir a República Tcheca."
 CZE_martin_baxa_ministry_of_culture: "Martin Baxa - Ministério da Cultura"
 CZE_martin_baxa_ministry_of_culture_desc: "O ODS escolheu Martin Baxa como novo ministro da Cultura. Fora de sua carreira política, ele também é professor de ensino médio. Entrou no ODS em 1999."
 CZE_zbynek_stanjura_minister_of_finance: "Zbyněk Stanjura - Ministro das Finanças"
 CZE_zbynek_stanjura_minister_of_finance_desc: "Zbyněk Stanjura é outro político do ODS escolhido para fazer parte do novo governo de Petr Fiala. Ele assumirá as responsabilidades de ministro das Finanças. Entrou no ODS na aurora do novo milênio e rapidamente se tornou um político importante no partido."
 CZE_pavel_blazek_department_of_justice: "Pavel Blažek - Ministério da Justiça"
 CZE_pavel_blazek_department_of_justice_desc: "Pavel Blažek entrou no ODS em 1998. Ele já serviu como ministro da Justiça durante o mandato de primeiro-ministro de Petr Nečas. Desta vez, tem outra oportunidade de se tornar um dos políticos mais importantes de [CZE.GetName]."
 CZE_martin_kupka_ministry_of_transportation: "Martin Kupka - Ministério dos Transportes"
 CZE_martin_kupka_ministry_of_transportation_desc: "Martin Kupka trabalha como jornalista em sua vida privada. Em 2008 entrou no ODS e em 2 anos ganhou grande apoio e popularidade. No novo governo de Petr Fiala, servirá como ministro dos Transportes."
 CZE_jana_cernochova_minister_of_defence: "Jana Černochová - Ministra da Defesa"
 CZE_jana_cernochova_minister_of_defence_desc: "A última integrante do ODS a entrar no novo governo será Jana Černochová. Ela entrou no partido em 1997. Durante sua carreira, serviu como membro do Parlamento da República Tcheca pela capital, Praga. Agora servirá como a nova ministra da Defesa."
 CZE_coalition_with_pirati_a_strostove: "Coalizão com os Piráti a Starostové"
 CZE_coalition_with_pirati_a_strostove_desc: "A coalizão SPOLU é forte, mas a coalizão Piráti a Starostové também está ganhando popularidade. Unir essas duas coalizões criará o grupo político mais forte da história moderna da República Tcheca."
 CZE_support_petr_pavel_for_the_president: "Apoiar Petr Pavel para Presidente"
 CZE_support_petr_pavel_for_the_president_desc: "O SPOLU apoiou ativamente a candidatura presidencial de Petr Pavel. Ele não pertence a nenhum partido. É um líder independente que conduzirá este país."
 CZE_connecting_five_programs: "Conectando Cinco Programas"
 CZE_connecting_five_programs_desc: "Após a formação da nova coalizão entre o SPOLU e os Piráti a Starostové, é hora de começar a realização do programa político comum e maior de todos."
 CZE_the_strongest_coalition: "A Coalizão Mais Forte"
 CZE_the_strongest_coalition_desc: "O SPOLU rapidamente ganhou um apoio enorme. As ações decisivas de Petr Fiala e a volta de um general aposentado, Petr Pavel, trazem esperança ao povo. A partir daqui, parece que só vai subir."
 CZE_independent_politician_in_power: "Político Independente no Poder"
 CZE_independent_politician_in_power_desc: "Petr Pavel foi eleito líder de [CZE.GetName]. É um grande sucesso para ele e para o SPOLU."
 CZE_take_care_of_the_environment: "Cuidar do Meio Ambiente"
 CZE_take_care_of_the_environment_desc: "O meio ambiente fica mais frágil a cada ano, então não devemos destruí-lo ainda mais."
 CZE_a_soldier_and_a_politician: "Um Soldado e um Político"
 CZE_a_soldier_and_a_politician_desc: "Petr Pavel, nascido em 1º de novembro de 1961 em Planá, iniciou sua carreira militar quando a Tchecoslováquia ainda existia e estava sob regime comunista. Ele era responsável pelo reconhecimento contra países da OTAN. A situação mudou após a queda da União Soviética e a divisão da Tchecoslováquia na democrática República Tcheca e na Eslováquia. Petr Pavel começou a cooperar com as forças da OTAN e dos EUA (embora o inglês não fosse popular no Bloco Oriental, Pavel foi um dos poucos oficiais a estudar inglês, francês e russo). Serviu nas forças militares até 2018, quando se aposentou do serviço militar e continuou sua carreira na esfera política, ganhando o apoio de partidos democráticos e não alinhados, o que o ajudou a se tornar presidente da República Tcheca nas eleições presidenciais de 2023.\nEsta árvore histórica e a interface dedicada servem para dar uma olhada melhor em sua carreira após a aurora do novo milênio, quando ele teve um grande impacto nas operações militares e nas conversas políticas."
 CZE_international_career: "Carreira Internacional"
 CZE_international_career_desc: "O mundo não termina na República Tcheca. A cooperação com outros países é importante para ganhar experiência e aprender táticas de diferentes oficiais e terrenos."
 CZE_home_career: "Carreira em Casa"
 CZE_home_career_desc: "A República Tcheca é nossa casa e devemos fazer de tudo para protegê-la de qualquer ameaça possível. Nossos inimigos devem saber que não somos um alvo fácil."
 CZE_join_ii_persian_gulf_war: "Participar da Segunda Guerra do Golfo Pérsico"
 CZE_join_ii_persian_gulf_war_desc: "Após o ataque terrorista, os Estados Unidos se tornaram mais agressivos em relação ao Oriente Médio. Declararam guerra ao Iraque e temos que ajudar nossos aliados a lutar pela paz de todos."
 CZE_continuation_of_afnorth_cooperation: "Continuação da Cooperação com o AFNORTH"
 CZE_continuation_of_afnorth_cooperation_desc: "O AFNORTH não existe mais, mas outras instituições foram criadas em seu lugar, em Brunssum para ser exato. Sua missão é proteger o flanco norte da aliança, e Petr Pavel tem a oportunidade de ajudar os generais nessa tarefa."
 CZE_zastupce_velitele_divize: "Comandante Adjunto da Divisão"
 CZE_zastupce_velitele_divize_desc: "O cargo de comandante adjunto da divisão é uma ocasião para Petr Pavel se provar mais uma vez em sua terra natal. Ele se tornará o braço direito de um de nossos generais para coordenar planos e estratégias que ajudarão a melhorar nossa postura de dissuasão."
 CZE_brigadni_general: "General de Brigada"
 CZE_brigadni_general_desc: "Petr Pavel está pronto para ser promovido a general de brigada. É uma conquista muito importante em sua carreira, que o aproxima de se tornar o general mais importante de seu país e das estruturas da aliança."
 CZE_homeland_protectionism: "Protecionismo da Pátria"
 CZE_homeland_protectionism_desc: "Nosso país é cercado por vizinhos neutros e amigáveis. Mas isso não significa que podemos confiar totalmente neles. Temos que estar preparados para um ataque de qualquer lado."
 CZE_centcom_liaison_officer: "Oficial de Ligação do CENTCOM"
 CZE_centcom_liaison_officer_desc: "O Comando Central dos Estados Unidos é um dos onze comandos combatentes unificados do Departamento de Defesa dos EUA. Foi estabelecido em 1983, assumindo as responsabilidades anteriores da Força-Tarefa Conjunta de Desdobramento Rápido (RDJTF)."
 CZE_coordination_from_qatar: "Coordenação a partir do Catar"
 CZE_coordination_from_qatar_desc: "O Catar permitiu que as forças americanas estabelecessem seus acampamentos militares e base aérea em seu território. Petr Pavel será enviado para lá para coordenar as forças americanas que lutam no Iraque durante a Segunda Guerra do Golfo."
 CZE_protect_nato_northern_flank: "Proteger o Flanco Norte da OTAN"
 CZE_protect_nato_northern_flank_desc: "Os países escandinavos ainda não são muito capazes de se autodefender, mas são aliados muito importantes. O clima deles é mais frio que o nosso, então se sairão melhor ao lutar contra a Rússia em seu território. Temos que ter certeza de que sua defesa é capaz de deter as forças hostis."
 CZE_special_forces_deputy_commander: "Comandante Adjunto das Forças Especiais"
 CZE_special_forces_deputy_commander_desc: "Antes de estar pronto para se tornar comandante do batalhão de forças especiais, Petr Pavel precisa aprender a comandar uma legião de soldados treinados profissionalmente."
 CZE_deputy_director_of_the_czech_ministry_of_defence: "Diretor Adjunto do Ministério da Defesa"
 CZE_deputy_director_of_the_czech_ministry_of_defence_desc: "Para entender melhor os obstáculos que o país precisa superar para introduzir um novo programa de defesa, Petr Pavel precisa aprender, desde os cargos mais altos, como lidar com qualquer problema."
 CZE_extend_deterrence_policy: "Ampliar a Política de Dissuasão"
 CZE_extend_deterrence_policy_desc: "Nossos inimigos acham que, por causa do nosso exército pequeno, somos um alvo fácil. Sabemos que estão errados, mas eles também precisam saber que lutaremos por cada pedaço da nossa terra."
 CZE_special_forces_commander: "Comandante das Forças Especiais"
 CZE_special_forces_commander_desc: "Após décadas de treinamento, Petr Pavel está pronto para comandar nossos batalhões de forças especiais. Anos de treinamento resultam em outra promoção, e Petr Pavel se aproxima do auge de sua carreira."
 CZE_generalmajor: "General de Divisão"
 CZE_generalmajor_desc: "General de Divisão é mais uma promoção na lista de patentes de general tchecas. O posto concederá a Pavel mais privilégios e acesso a missões mais avançadas."
 CZE_improve_air_defence_program: "Melhorar o Programa de Defesa Aérea"
 CZE_improve_air_defence_program_desc: "Se não conseguimos manter uma produção estável de aviões novos e modernos, temos que gastar nosso dinheiro melhorando sistemas que nos permitam abater os aviões inimigos."
 CZE_protest_for_reducing_military_funding: "Protestar contra a Redução do Financiamento Militar"
 CZE_protest_for_reducing_military_funding_desc: "Nossos políticos estão pensando em aumentar outros gastos do governo à custa dos militares. Se decidirem aprovar essa lei, ficaremos mais fracos, o que não é uma opção."
 CZE_eu_integration: "Integração à UE"
 CZE_eu_integration_desc: "Alguns países da OTAN pertencem à União Europeia. Ganharemos duas vezes melhorando nossas relações com eles, e talvez isso também ajude nossa economia a crescer mais rápido."
 CZE_deputy_chief_of_the_general_staff: "Chefe Adjunto do Estado-Maior"
 CZE_deputy_chief_of_the_general_staff_desc: "Mais uma vez, Petr Pavel precisa aprender como funciona o cargo superior antes de poder ser promovido a ele. O Chefe do Estado-Maior é o mais alto cargo militar nas Forças Tchecas e é uma conquista e tanto receber essa promoção."
 CZE_suggest_increasing_cybersecurity: "Sugerir o Aumento da Cibersegurança"
 CZE_suggest_increasing_cybersecurity_desc: "Nosso inimigo pode usar o quarto poder como fonte de propaganda. Se os sites do nosso governo falharem por causa de um vírus, podemos perder o controle sobre nossa logística e comunicação."
 CZE_shape_representative: "Representante do SHAPE"
 CZE_shape_representative_desc: "O SHAPE é outra instituição da OTAN. Ele coordena todas as operações da OTAN no globo. Petr Pavel será enviado à sua sede na Bélgica para coordenar suas decisões com outros generais experientes."
 CZE_generalporucik: "Tenente-General"
 CZE_generalporucik_desc: "Tenente-General está um passo abaixo da mais alta patente de general que pode ser alcançada no exército da República Tcheca. A campanha está quase no fim e novas missões ficam disponíveis para Petr Pavel."
 CZE_chief_of_staff_of_the_czech_armed_forces: "Chefe do Estado-Maior das Forças Armadas Tchecas"
 CZE_chief_of_staff_of_the_czech_armed_forces_desc: "Graças à nova patente, Petr Pavel agora pode se tornar Chefe do Estado-Maior das Forças Armadas Tchecas. É o oficial militar de mais alto escalão e mais antigo das Forças Armadas da República Tcheca. Ele é nomeado pelo presidente da República Tcheca, que é o comandante-em-chefe."
 CZE_support_for_czech_forces_in_afghanistan: "Apoio às Forças Tchecas no Afeganistão"
 CZE_support_for_czech_forces_in_afghanistan_desc: "O conflito no Afeganistão continua e as forças do Talibã são uma ameaça constante à segurança dos cidadãos afegãos. Os soldados tchecos lutam pela liberdade do Afeganistão e temos que apoiá-los de todas as formas possíveis."
 CZE_head_of_the_nato_military_committee: "Presidente do Comitê Militar da OTAN"
 CZE_head_of_the_nato_military_committee_desc: "Este é o cargo mais alto nas estruturas militares da OTAN. Graças a décadas de treinamento árduo, Petr Pavel está agora pronto para se tornar o general mais importante da estrutura militar da aliança."
 CZE_declare_russia_as_a_major_threat: "Declarar a Rússia uma Grande Ameaça"
 CZE_declare_russia_as_a_major_threat_desc: "A Rússia nunca foi nossa amiga. Se eles não mudarem sua política, desta vez de forma permanente, não podemos fingir que a ameaça posterior à queda da URSS desapareceu."
 CZE_strengthen_eastern_flank: "Fortalecer o Flanco Oriental"
 CZE_strengthen_eastern_flank_desc: "Enquanto a Rússia continuar com sua política ofensiva, não podemos baixar a guarda. Os países do leste devem estar prontos para um possível impacto."
 CZE_armadni_general: "General do Exército"
 CZE_armadni_general_desc: "A mais alta patente alcançável no exército da República Tcheca. Petr Pavel alcançou o posto mais alto e agora está pronto para ir ainda mais longe, tornando-se presidente do Comitê Militar da OTAN."
 CZE_finish_nato_career: "Encerrar a Carreira na OTAN"
 CZE_finish_nato_career_desc: "Petr Pavel está chegando perto da aposentadoria. Com isso em mente, ele precisa se despedir de seus amigos da OTAN e se preparar para deixar o exército."
 CZE_military_pension: "Aposentadoria Militar"
 CZE_military_pension_desc: "Tudo chega a um fim mais cedo ou mais tarde. Petr Pavel está tendo uma aposentadoria merecida, mas o espírito e a sabedoria que adquiriu durante seu serviço continuarão sendo uma peça importante do exército tcheco."
 CZE_further_political_career: "Carreira Política Posterior"
 CZE_further_political_career_desc: "Depois que Petr Pavel concluiu sua carreira militar, é hora de se aprofundar na esfera política. Pavel já tem experiência nesse campo, pois participou de incontáveis reuniões da aliança."
 CZE_spolu_silnejsi: "Mais Fortes Juntos"
 CZE_spolu_silnejsi_desc: "A iniciativa Mais Fortes Juntos foi fundada por Petr Pavel na primavera de 2020. Primeiro, lançaram uma arrecadação de fundos que ajudou as pessoas na linha de frente do combate à epidemia e as mais afetadas pela crise. Mais tarde, Petr Pavel e outros especialistas elaboraram recomendações para uma melhor gestão de crises."
 CZE_fight_disinformation: "Combater a Desinformação"
 CZE_fight_disinformation_desc: "Alguns rebeldes tentam suprimir a popularidade de Pavel espalhando informações falsas na internet. Alguém precisa mostrar ao povo que tudo isso é mentira."
 CZE_collection_for_hospitals: "Arrecadação para os Hospitais"
 CZE_collection_for_hospitals_desc: "Nossos hospitais são bem equipados, mas em tempos de crise não são tão eficazes quanto poderiam ser. Com algumas doações do povo, poderemos ajudá-los a se preparar para qualquer situação."
 CZE_candidate_for_the_president: "Candidato à Presidência"
 CZE_candidate_for_the_president_desc: "É hora de Petr Pavel concorrer à presidência da República Tcheca. Antes soldado, agora político."
 CZE_support_from_politicians: "Apoio dos Políticos"
 CZE_support_from_politicians_desc: "Outros partidos políticos apoiam a candidatura de Petr Pavel. ODS, TOP 09 e KDU-ČSL o ajudarão a ganhar apoio e a ganhar popularidade eles próprios."
 CZE_the_reign_of_petr_pavel: "O Governo de Petr Pavel"
 CZE_the_reign_of_petr_pavel_desc: "Petr Pavel ganhou popularidade suficiente antes das eleições presidenciais e conseguiu vencer seus rivais, garantindo o cargo de presidente de seu país, a República Tcheca. Uma nova era começa agora."
 CZE_election_donations: "Doações Eleitorais"
 CZE_election_donations_desc: "A campanha eleitoral é muito cara. Felizmente temos o apoio dos 3 maiores partidos, que nos ajudarão a arrecadar fundos para a campanha de Petr Pavel."
 CZE_shift_in_politics: "Mudança na Política"
 CZE_shift_in_politics_desc: "Dependemos demais de nossos aliados. Nosso país tem de ser capaz de se defender sem ajuda alguma."
 CZE_stay_close_with_other_countries: "Manter-se Próximo de Outros Países"
 CZE_stay_close_with_other_countries_desc: "Somos mais fortes unidos. A OTAN nos garantirá a independência e uma estratégia de dissuasão perfeita."
 CZE_economical_innovations: "Inovações Econômicas"
 CZE_economical_innovations_desc: "Apesar de nossas ambições de defesa, um país próspero precisa modernizar sua economia todo ano para não ficar para trás das outras nações. Então vamos olhar para soluções modernas para problemas modernos."
 CZE_increase_defence_budget: "Aumentar o Orçamento de Defesa"
 CZE_increase_defence_budget_desc: "Mais do que equipamento, precisamos de soldados mais bem treinados. O exército profissional desperdiça menos equipamento e, graças a isso, podemos nos concentrar na produção das máquinas mais importantes."
 CZE_armaments_funding: "Financiamento de Armamentos"
 CZE_armaments_funding_desc: "Soldados bem treinados são importantes, mas não podemos depender apenas do treinamento. Temos que aumentar a produção de peças e equipamentos militares para reabastecer nosso estoque."
 CZE_internal_affairs: "Assuntos Internos"
 CZE_internal_affairs_desc: "Acho que é o momento de cumprir nossas promessas eleitorais. Bem, vamos trabalhar para deixar nosso povo feliz."
 CZE_explain_our_choice: "Explicar Nossa Escolha"
 CZE_explain_our_choice_desc: "Ouçam, não é que não queiramos nenhuma ajuda externa. Sabemos que não podemos vencer inimigos muito mais fortes, então não há necessidade de punições. Continuamos sendo aliados e continuaremos ajudando outros países."
 CZE_continue_nato_trainings: "Continuar os Treinamentos da OTAN"
 CZE_continue_nato_trainings_desc: "Os treinamentos da OTAN não são novidade para nós. Mas os tempos mudaram e, em vez de exercícios regulares, precisamos preparar nossos soldados para a guerra de verdade..."
 CZE_tighten_ties_with_eu: "Estreitar os Laços com a UE"
 CZE_tighten_ties_with_eu_desc: "Aliança econômica. Parece bom, e é isso que a União Europeia é. É hora de obter mais benefícios desse grupo."
 CZE_more_independent_growth: "Crescimento Mais Independente"
 CZE_more_independent_growth_desc: "Não podemos cair na armadilha de outras nações que buscam apenas benefícios pessoais no comércio. Temos que aumentar a força da nossa própria economia para importar menos materiais."
 CZE_fight_corruption: "Combater a Corrupção"
 CZE_fight_corruption_desc: "A corrupção é um problema imparável. Por mais que você se esforce, ela sempre volta. Mas, se pararmos de combatê-la, ela se tornará uma ameaça muito maior para nossa nação do que a invasão de outro país."
 CZE_higher_retirement_age: "Idade de Aposentadoria Mais Alta"
 CZE_higher_retirement_age_desc: "Quanto mais as pessoas trabalham, melhor fica a nossa economia. Todos ficarão bem se elevarmos a idade de aposentadoria em alguns anos."
 CZE_save_money_for_other_institutions: "Poupar Dinheiro para Outras Instituições"
 CZE_save_money_for_other_institutions_desc: "As forças armadas não são o único setor do país. Temos que apoiar outras instituições, como saúde ou educação, para manter nosso crescimento estável, bem, estável."
 CZE_offensive_innovations: "Inovações Ofensivas"
 CZE_offensive_innovations_desc: "Com uma defesa intransponível, não conseguiremos executar uma ofensiva eficaz contra nosso inimigo. Devemos dar mais foco a assaltos e investidas ofensivas."
 CZE_keep_defensive_doctrine: "Manter a Doutrina Defensiva"
 CZE_keep_defensive_doctrine_desc: "Temos que acreditar que nosso inimigo terá mais... bem, inimigos. Se formos fortes o bastante para manter nossas posições, nossos soldados não precisarão arriscar a vida em assaltos perigosos."
 CZE_czech_polish_military_cooperation: "Cooperação Militar Tcheco-Polonesa"
 CZE_czech_polish_military_cooperation_desc: "A Polônia é um dos países mais fortes do lado leste da Europa. Vamos preparar outro programa de treinamento comum para nossos exércitos."
 CZE_calling_for_eastern_flank_increased_protection: "Pedir Maior Proteção ao Flanco Oriental"
 CZE_calling_for_eastern_flank_increased_protection_desc: "A Rússia não para de ameaçar outros países. O flanco oriental da nossa aliança ainda não está preparado para uma invasão russa, e isso precisa mudar bem rápido."
 CZE_join_the_eurozone: "Entrar na Zona do Euro"
 CZE_join_the_eurozone_desc: "Afinal, por que não? A Zona do Euro nos unirá ainda mais à União Europeia e tornará nossa moeda mais estável."
 CZE_increased_factories_efficiency: "Maior Eficiência das Fábricas"
 CZE_increased_factories_efficiency_desc: "Novas tecnologias permitirão que nossas fábricas aumentem a produção de bens e equipamentos militares. Custará um pouco, mas o resultado valerá o esforço."
 CZE_expansion_of_mining_regions: "Expansão das Regiões de Mineração"
 CZE_expansion_of_mining_regions_desc: "Sim, devemos buscar soluções verdes, mas como estamos tentando alcançar um crescimento mais independente, precisamos garantir um setor de recursos mais seguro."
 CZE_administration_reform: "Reforma Administrativa"
 CZE_administration_reform_desc: "Alguns dos problemas de corrupção surgiram por causa da administração ineficiente. Para apagar essa faísca, a administração precisa passar por reformas importantes."
 CZE_grants_for_schools: "Subsídios para Escolas"
 CZE_grants_for_schools_desc: "Nossas escolas devem ser mais abertas a estudantes internacionais e a viagens a outros países. Com o dinheiro recém-concedido, poderão melhorar o ensino."
 CZE_expand_ministry_of_health: "Expandir o Ministério da Saúde"
 CZE_expand_ministry_of_health_desc: "Os hospitais devem estar prontos para qualquer situação e problema. Os médicos precisam saber como agir em tempos de epidemia ou qualquer outro evento estressante."
 CZE_expand_role_of_the_army_in_politics: "Expandir o Papel do Exército na Política"
 CZE_expand_role_of_the_army_in_politics_desc: "Alguns políticos se importam demais consigo mesmos em vez do que o país precisa. Os generais do exército nos ajudarão a preparar forças militares mais fortes e limitar o papel dos políticos pouco confiáveis."
 CZE_always_prepared: "Sempre Preparados"
 CZE_always_prepared_desc: "Não precisamos ver o exército inimigo na nossa fronteira para saber que ele está se preparando para a guerra. Monitorando as atividades de outros países, saberemos muito mais rápido se alguém prepara uma invasão contra nossa nação."
 CZE_even_together_we_must_be_strong: "Mesmo Juntos, Devemos Ser Fortes"
 CZE_even_together_we_must_be_strong_desc: "Não podemos depender totalmente de nossos fortes aliados. Temos que ser capazes de deter a ameaça iminente apenas com nossas forças."
 CZE_green_parties_support: "Apoio aos Partidos Verdes"
 CZE_green_parties_support_desc: "A situação climática piora a cada ano. Os partidos verdes sabem como deter a crise iminente e, às vezes, vale ouvir suas ideias, mesmo ao custo de um crescimento menor da produtividade."
 CZE_study_russian_strategies: "Estudar as Estratégias Russas"
 CZE_study_russian_strategies_desc: "Nós já as conhecemos, mas a estratégia sempre pode mudar. Vamos fazer isso discretamente, talvez ninguém perceba..."
 CZE_stay_close_with_visegrad: "Manter-se Próximo de Visegrado"
 CZE_stay_close_with_visegrad_desc: "O Grupo de Visegrado fez muito bem a seus 4 membros. Temos que permanecer unidos, aconteça o que acontecer."
 CZE_open_up_for_balkans: "Abrir-se para os Bálcãs"
 CZE_open_up_for_balkans_desc: "Olhando para o lado mais ao sul, temos os países dos Bálcãs. O acesso ao Bósforo (e ao Mar Negro) é muito importante para nós, pois podemos controlar a marinha russa nessa região."
 CZE_more_automatization: "Mais Automação"
 CZE_more_automatization_desc: "Mantendo nosso foco na tecnologia moderna, podemos começar a usar máquinas e equipamentos avançados para facilitar nosso trabalho. Drones podem tirar fotos do céu a qualquer momento em pouco tempo, e os veículos de construção controlados remotamente tornarão a operação muito mais fácil."
 CZE_co2_reduction: "Redução de CO2"
 CZE_co2_reduction_desc: "A Škoda fabrica muitos carros, mas os modelos mais antigos ainda usam um sistema de escapamento obsoleto que gera mais poluição que os atuais. Esse problema precisa finalmente ser resolvido."
 CZE_stand_for_the_center_europe: "Defender a Europa Central"
 CZE_stand_for_the_center_europe_desc: "Estamos cercados por outros países. Alguns são mais amigáveis, outros não. Então vamos garantir que esses países pouco amigáveis mantenham seus exércitos longe da nossa fronteira."
 CZE_our_country_first: "Nosso País em Primeiro Lugar"
 CZE_our_country_first_desc: "Antes de escolhermos qualquer ação diplomática, precisamos ter certeza de que nosso país se beneficiará dela da forma mais satisfatória. Se queremos ajudar os outros, devemos primeiro cuidar de nós mesmos."
 CZE_awaken_national_spirit: "Despertar o Espírito Nacional"
 CZE_awaken_national_spirit_desc: "As pessoas pensam que, com o fim do regime soviético, podemos afrouxar a corda e entrar num processo mais estagnado de desenvolvimento militar. Mas a ameaça volta a ficar visível e precisamos lembrar pelo que lutamos durante a Revolução de Veludo."
 CZE_catch_up_with_the_giants: "Alcançar os Gigantes"
 CZE_catch_up_with_the_giants_desc: "Isso nos custará muito dinheiro, mas graças à sólida posição da Škoda reabasteceremos rapidamente nossos cofres."
 CZE_ready_for_pre_emptive_strike: "Pronto para um Ataque Preventivo"
 CZE_ready_for_pre_emptive_strike_desc: "Um novo conjunto de instruções ajudará nossos soldados a se adaptar a uma invasão inesperada muito mais rápido do que normalmente fariam. O inimigo ficará muito mais surpreso do que poderia esperar."
 CZE_regional_power: "Potência Regional"
 CZE_regional_power_desc: "O novo financiamento de armamentos e a doutrina de planejamento nos tornaram uma potência regional no centro da Europa. É um passo muito importante para nós e fará nossos inimigos pensarem duas vezes antes de atacar nossa nação."
 CZE_2000_airforce_army_procurement: "Expansão da Força Aérea Tcheca"
 CZE_2000_airforce_army_procurement_desc: "O novo milênio abre outra era na capacidade humana de voar pelos céus. Com o desenvolvimento dos motores a jato, nossa força aérea melhora a cada dia. A velocidade supersônica está em nossas mãos, mas há um pequeno problema... nossa indústria não é capaz de produzir essas máquinas. Temos que economizar algum dinheiro e comprar equipamento de outros países."
 CZE_transport_helicopters: "Helicópteros de Transporte"
 CZE_transport_helicopters_desc: "Os helicópteros de transporte fornecerão suprimentos ao nosso exército terrestre e permitirão que os paraquedistas façam seu trabalho. Rússia, Estados Unidos e França têm alguns veículos de sobra, então podemos pedir a um deles e comprar esses helicópteros."
 CZE_lighter_cas: "CAS Mais Leve"
 CZE_lighter_cas_desc: "Aviões a jato devem ser rápidos e muito manobráveis, então devemos buscar reduzir os custos de construção e aliviar nossos aviões."
 CZE_new_fighters: "Caças Modernos"
 CZE_new_fighters_desc: "Os novos caças ficam mais rápidos e mais fortes a cada nova geração. São caros e difíceis de produzir, então devemos comprá-los no mercado internacional."
 CZE_continue_with_full_on_cas: "Continuar com CAS Completo"
 CZE_continue_with_full_on_cas_desc: "Os melhores aviões são aqueles difíceis de destruir e que destroem o inimigo com facilidade. Aviões médios de apoio aéreo aproximado são ótimos para esse trabalho."
 CZE_attack_helicopters: "Helicópteros de Ataque"
 CZE_attack_helicopters_desc: "Os helicópteros de ataque dão apoio no campo de batalha e são ótimos no combate urbano, manobrando facilmente entre prédios e rastreando o inimigo em solo."
 CZE_2010_airforce_army_procurement: "Aquisição Avançada para a Força Aérea"
 CZE_2010_airforce_army_procurement_desc: "Mais uma década chegou ao mundo. A tecnologia de drones não tripulados está em intenso desenvolvimento e os caças se tornam mais difíceis de derrotar graças às novas tecnologias e aos cascos aprimorados. Não podemos mais depender de equipamentos da era da Guerra Fria, é hora de entrar na era moderna."
 CZE_combat_drones_production: "Produção de Drones de Combate"
 CZE_combat_drones_production_desc: "Drones de combate controlados remotamente são perfeitos para reconhecimento e bombardeio rápido de alvos estratégicos. No momento são difíceis de rastrear e destruir, então temos que obtê-los o quanto antes, antes que nosso inimigo aprenda a combater eficazmente esse novo tipo de arma."
 CZE_supply_in_casa_c295_m: "Suprimento no Airbus C-295"
 CZE_supply_in_casa_c295_m_desc: "Um dos maiores aviões de transporte espanhóis. O C-295 nos ajudará a levar suprimentos ao campo de batalha, mas precisará de forte proteção."
 CZE_new_age_of_supersonic_aircraft_research: "Nova Era de Pesquisa de Aeronaves Supersônicas"
 CZE_new_age_of_supersonic_aircraft_research_desc: "Os motores a jato estão mais estáveis a cada ano, então os pilotos podem manobrar suas máquinas com mais facilidade. Não é uma boa notícia para nós; se quisermos ter qualquer chance contra essa tecnologia, precisamos criar a nossa."
 CZE_replace_sokol: "Substituir o Sokol"
 CZE_replace_sokol_desc: "O Sokol era um bom helicóptero, mas não atende aos padrões atuais da guerra moderna. Temos que encontrar um substituto."
 CZE_mobile_operation_center: "Centro de Operações Móvel"
 CZE_mobile_operation_center_desc: "O MOC é um centro de operações altamente avançado que apoiará nossa força aérea onde quer que seja necessário. É um investimento caro, melhor não perdê-lo."
 CZE_lighter_faster: "Mais Leve e Mais Rápido"
 CZE_lighter_faster_desc: "Se nossos pilotos manobrarem bem o bastante para desviar de balas e mísseis inimigos, não precisarão de blindagem mais pesada. O risco é maior, mas isso deixará nossos pilotos mais bem treinados."
 CZE_medium_hull_focus: "Foco em Cascos Médios"
 CZE_medium_hull_focus_desc: "Um pequeno erro e o avião cai. Sabemos que até os melhores pilotos cometem erros, então precisamos aumentar a proteção de nossos aviões."
 CZE_2020_airforce_army_procurement: "Programa de Força Aérea Moderna"
 CZE_2020_airforce_army_procurement_desc: "Estamos agora na terceira década do século XXI. Entre as aeronaves mais reconhecíveis estão os aviões da classe F fabricados nos Estados Unidos e os da classe MiG da Rússia. Temos que obter essas máquinas."
 CZE_middle_size_drones: "Drones de Porte Médio"
 CZE_middle_size_drones_desc: "Drones mais pesados serão mais lentos, mas também mais capazes de transportar explosivos. Drones kamikaze são muito eficazes contra alvos terrestres."
 CZE_modern_aircrafts: "Aeronaves Modernas"
 CZE_modern_aircrafts_desc: "É hora de buscar os aviões mais novos produzidos pelas superpotências."
 CZE_new_attack_helicopters: "Novos Helicópteros de Ataque"
 CZE_new_attack_helicopters_desc: "Os helicópteros de ataque se tornam mais importantes na força aérea a cada ano. Portanto, é razoável que cuidemos deles e os mantenhamos atualizados."
 CZE_next_gen_attack_helicopter: "Helicóptero de Ataque de Nova Geração"
 CZE_next_gen_attack_helicopter_desc: "Não podemos comprar tudo no mercado internacional. Vamos iniciar uma nova pesquisa e começar a produção de nossos próprios helicópteros."
 CZE_new_transport_helicopters: "Novos Helicópteros de Transporte"
 CZE_new_transport_helicopters_desc: "Assim como os helicópteros de ataque, os de transporte têm hoje um papel maior que na última década."
 CZE_heavy_transport_helicopter: "Helicóptero de Transporte Pesado"
 CZE_heavy_transport_helicopter_desc: "Helicópteros difíceis de destruir são muito caros de produzir, mas até poucas unidades podem fazer grande diferença."
 CZE_new_transport_aircraft: "Aeronave de Transporte"
 CZE_new_transport_aircraft_desc: "Os helicópteros de transporte não substituirão os antiquados aviões de transporte. Embora um pouco obsoletos, serão muito úteis para nós."
 CZE_army_of_the_new_century: "Exército do Novo Século"
 CZE_army_of_the_new_century_desc: "Vamos dar mais um passo na modernização do exército da República Tcheca. O novo século parece brilhante para nós, então não deixemos que nossos inimigos enterrem nossas esperanças e sonhos por causa de forças militares mais fortes."
 CZE_remove_national_service: "Abolir o Serviço Militar Obrigatório"
 CZE_remove_national_service_desc: "A guerra e a tensão mundial acabaram há muito tempo, mas a ameaça ainda existe e devemos buscar aprimorar nosso exército profissional em vez de recrutar novos soldados inexperientes."
 CZE_form_activereserves: "Formar Reservas Ativas"
 CZE_form_activereserves_desc: "A Reserva Ativa ajudará nosso exército a manter o controle de nosso território em tempos de guerra. É importante não sobrecarregar nossas forças armadas com tarefas extras."
 CZE_reform_az: "Reserva Ativa"
 CZE_reform_az_desc: "A nova brigada ajudará nossas forças a responder rapidamente a uma ofensiva inesperada. Quanto mais rápido as treinarmos, melhor para nós e pior para nosso inimigo."
 CZE_reform_army_schooling: "Nova Forma de Ensino Militar"
 CZE_reform_army_schooling_desc: "Algumas escolas e universidades ainda usam o modelo comunista de ensino militar. É hora de mudar esses hábitos e introduzir um novo programa de treinamento."
 CZE_UNOB_schooling: "Universidade de Defesa"
 CZE_UNOB_schooling_desc: "A Universidade de Defesa será nossa mais nova escola para treinar futuros soldados. Nosso país tem de continuar com o estilo ofensivo, por que seguiríamos outro caminho?"
 CZE_reform_ms: "Ministério da Justiça"
 CZE_reform_ms_desc: "O regime comunista acabou há muito tempo, mas ainda há lacunas na lei atual que afetam nossas forças armadas. Uma nova forma de gestão do Ministério da Justiça deve resolver esse problema."
 CZE_reform_vispoint: "Vispoint"
 CZE_reform_vispoint_desc: "O Vispoint, localizado na cidade de Vyškov, recebe a maior parte do treinamento militar básico. É um alvo estratégico muito importante para nossos inimigos e devemos fazer o possível para protegê-lo."
 CZE_reform_officer_corp: "Reformar o Corpo de Oficiais"
 CZE_reform_officer_corp_desc: "Antes de reformarmos o exército, os soldados precisam de um estado-maior competente que lhes mostre como lutar."
 CZE_reform_army_corp: "Reformar o Corpo de Exército"
 CZE_reform_army_corp_desc: "Agora que os oficiais estão treinados com um novo programa, podemos começar a reformar nosso exército. Os Estados Unidos estão preparando algo para seus aliados, vamos ver o que podemos conseguir deles."
 CZE_join_tradoc: "Unir-se ao TRADOC"
 CZE_join_tradoc_desc: "O Comando de Treinamento e Doutrina do Exército dos Estados Unidos é um grande comando do Exército dos EUA com sede em Fort Eustis, Virgínia. Ele é encarregado de supervisionar o treinamento das forças do Exército e o desenvolvimento da doutrina operacional."
 CZE_join_natineads: "Unir-se ao NATINEADS"
 CZE_join_natineads_desc: "O Sistema Integrado de Defesa Aérea da OTAN é uma rede de comando e controle que combina radares e outras instalações espalhadas pelas forças de defesa aérea da aliança da OTAN."
 CZE_form_a_new_brigade: "Formar uma Nova Brigada Militar"
 CZE_form_a_new_brigade_desc: "Manteremos a forma tradicional de expansão do exército, criando uma nova divisão. É uma opção mais barata que a de alta tecnologia, mas não podemos arcar com grandes gastos agora."
 CZE_form_cyber_brigade: "Formar a Brigada Cibernética"
 CZE_form_cyber_brigade_desc: "A brigada cibernética mostrará a todos uma nova forma de guerra, a guerra cibernética. Essa unidade cara ajudará nosso país a combater a desinformação e a influência estrangeira."
 CZE_defencestrat: "Estratégia de Defesa"
 CZE_defencestrat_desc: "Nossa nação sempre foi focada numa estratégia de dissuasão. Mas às vezes o inimigo não se importa com quantos fortes terrestres colocarmos nas montanhas e... ahem, por isso temos que melhorar nossa estratégia de defesa para resistir melhor aos agressores."
 CZE_armydoctrinereform: "Reforma da Doutrina do Exército"
 CZE_armydoctrinereform_desc: "A nova estratégia exige mudança nas doutrinas, então vamos mudar a forma como lutamos."
 CZE_nationalhybridoperations: "Operações Híbridas Nacionais"
 CZE_nationalhybridoperations_desc: "A guerra híbrida não é novidade para nós, mas nossos inimigos têm muito mais experiência nesse tipo de estratégia. Por isso temos que treinar mais para combater eficazmente esse tipo de guerra."
 CZE_whitebook: "O Livro Branco"
 CZE_whitebook_desc: "O Livro Branco da Defesa é um documento que conterá as estratégias defensivas do nosso país. Doutrinas, gastos, programa de treinamento militar etc. Graças a Petr Pavel, poderemos ampliar nosso Livro Branco e estender a mão a nossos vizinhos, o que ajudará todos nós a tornar nossas nações mais seguras e mais bem preparadas."
 CZE_expand_military_equipment_production: "Expandir a Produção de Equipamento Militar"
 CZE_expand_military_equipment_production_desc: "Não podemos apenas comprar equipamento no mercado externo. Essa mentalidade nos tornará dependentes demais de outros países. Podemos produzir equipamento básico por conta própria."
 CZE_longterm2035outlook: "Perspectiva de Longo Prazo para 2035"
 CZE_longterm2035outlook_desc: "Nossos generais experientes elaboraram um plano para garantir programas de treinamento para o país pelas próximas décadas. Acho que vale a tentativa."
 CZE_form_intelligence_agency: "Formar Agência de Inteligência"
 CZE_form_intelligence_agency_desc: "Agências de inteligência são muito caras de manter. Podem trabalhar de forma independente, mas só podemos sustentar uma delas. Vamos fazer uma oferta e ver quais empresas nos procuram."
 CZE_bis: "Serviço de Informações de Segurança"
 CZE_bis_desc: "O Serviço de Informações de Segurança é a principal agência nacional de inteligência interna da República Tcheca. É responsável por coletar, analisar, relatar e disseminar inteligência sobre ameaças à segurança nacional da República Tcheca, e por conduzir operações, encobertas e abertas, tanto no país quanto no exterior. Também presta contas e aconselha o governo da República Tcheca sobre questões e situações de segurança nacional que ameacem a segurança da nação."
 CZE_vojenske_zpravodajstvi: "Departamento de Inteligência Militar"
 CZE_vojenske_zpravodajstvi_desc: "A Inteligência Militar é o serviço de inteligência militar da República Tcheca, com atividades em áreas como inteligência de imagens (IMINT), inteligência humana (HUMINT), inteligência de sinais (SIGINT) e inteligência de fontes abertas (OSINT). A agência também obtém inteligência por meio da cooperação com duas ou mais agências de inteligência ao mesmo tempo."
 CZE_UZSI: "Escritório de Relações Exteriores e Informação"
 CZE_UZSI_desc: "O Escritório de Relações Exteriores e Informação é o principal serviço de inteligência estrangeira da República Tcheca, responsável pela coleta, análise e disseminação de inteligência. Tem o mandato de fornecer ao governo da República Tcheca inteligência precisa e oportuna, vital para apoiar e proteger os interesses de política externa e econômica."
 CZE_foreign_training: "Treinamento no Exterior"
 CZE_foreign_training_desc: "Nossos soldados precisam saber lutar em terrenos diferentes sob novo comando. Enviaremos alguns de nossos soldados para ajudar a concluir operações internacionais."
 CZE_eutm_mali: "Missão de Treinamento da União Europeia no Mali"
 CZE_eutm_mali_desc: "A Missão de Treinamento da União Europeia no Mali é uma missão multinacional de treinamento militar da União Europeia com sede em Bamako, Mali. Podemos enviar nossos soldados para ajudar os soldados franceses e participar do treinamento."
 CZE_kfor: "KFOR"
 CZE_kfor_desc: "A Força do Kosovo é uma força internacional de manutenção da paz liderada pela OTAN no Kosovo. Suas operações estão sendo gradualmente reduzidas até que a Força de Segurança do Kosovo, estabelecida em 2009, se torne autossuficiente."
 CZE_eufor_althera_bosna: "Operação Althea da EUFOR"
 CZE_eufor_althera_bosna_desc: "A Operação Althea, formalmente Força da União Europeia na Bósnia e Herzegovina (EUFOR), é um desdobramento militar na Bósnia e Herzegovina para supervisionar a implementação militar do Acordo de Dayton. A missão tem dois objetivos principais: garantir a segurança da população da Bósnia e Herzegovina e cumprir as tarefas estabelecidas nos Anexos 1A e 2 do Acordo de Dayton/Paris de 1995."
 CZE_operation_mountain_thrust: "Operação Mountain Thrust"
 CZE_operation_mountain_thrust_desc: "A Operação Mountain Thrust foi uma operação militar conjunta da OTAN e do Afeganistão na Guerra do Afeganistão. Seu objetivo principal era sufocar a insurgência talibã em curso no sul do país."
 CZE_operation_enduring_freedom: "Operação Liberdade Duradoura"
 CZE_operation_enduring_freedom_desc: "A Operação Liberdade Duradoura (OEF) foi o nome oficial usado pelo governo dos EUA tanto para a primeira fase (2001-2014) da Guerra do Afeganistão (2001-2021) quanto para a Guerra Global ao Terror em maior escala. Em 7 de outubro de 2001, em resposta aos ataques de 11 de setembro, o presidente George W. Bush anunciou que haviam começado ataques aéreos contra a Al-Qaeda e o Talibã no Afeganistão. Além das ações militares no Afeganistão, a Operação Liberdade Duradoura também esteve associada a operações de contraterrorismo em outros países, como OEF-Filipinas e OEF-Trans Sahara."
 CZE_provincial_reconstruction_team_logar: "Equipe Prov. de Reconstrução de Logar"
 CZE_provincial_reconstruction_team_logar_desc: "A PRT combinava especialistas civis do Ministério das Relações Exteriores tcheco e militares do Exército tcheco, cuja função era manter um ambiente seguro para os projetos de reconstrução. A PRT tcheca tinha proporcionalmente um dos maiores números de especialistas civis entre as PRTs."
 CZE_mfo_sinaj: "A Força Multinacional e Observadores no Sinai"
 CZE_mfo_sinaj_desc: "A Força Multinacional e Observadores é uma força internacional de manutenção da paz que supervisiona os termos do tratado de paz entre Egito e Israel. A MFO atua geralmente na península do Sinai e em seus arredores, garantindo a livre navegação pelo Estreito de Tiran e pelo Golfo de Aqaba, e o cumprimento dos demais termos do tratado de paz Egito-Israel."
 CZE_air_policing_iceland: "Policiamento Aéreo da Islândia"
 CZE_air_policing_iceland_desc: "O Policiamento Aéreo da Islândia é uma operação da OTAN conduzida para patrulhar o espaço aéreo islandês. Como a Islândia não tem força aérea, em 2006 solicitou que seus aliados da OTAN enviassem periodicamente caças à Base Aérea de Keflavik para proteger seu espaço aéreo. O primeiro desdobramento de aeronaves ocorreu em maio de 2008."
 CZE_baltic_air_policing: "Policiamento Aéreo do Báltico"
 CZE_baltic_air_policing_desc: "A missão de Policiamento Aéreo do Báltico é um alerta de reação rápida (QRA) de defesa aérea da OTAN para guardar o espaço aéreo sobre os três países bálticos: Estônia, Letônia e Lituânia."
 CZE_air_advisor_team_afghanistan: "Equipe de Assessoria Aérea no Afeganistão"
 CZE_air_advisor_team_afghanistan_desc: "Várias nações têm enviado unidades de suas forças aéreas para ajudar a formar a força aérea afegã. A República Tcheca também ajudará nessa operação."
 CZE_task_force_hippo_afghanistan: "Força-Tarefa Hippo no Afeganistão"
 CZE_task_force_hippo_afghanistan_desc: "Membros da Força Aérea Tcheca começaram a montar uma retaguarda para sua nova unidade de helicópteros a ser desdobrada no Afeganistão. A unidade de helicópteros tcheca, conhecida como Força-Tarefa Hippo, ficou subordinada ao Comando Regional Leste da Aliança. A TF Hippo entrou nas operações da ISAF em 25 de janeiro de 2010."
 CZE_2000st_army_procurement: "Iniciativa de Aquisição do Exército dos Anos 2000"
 CZE_2000st_army_procurement_desc: "Ao entrar no novo milênio, a República Tcheca enfrenta um cenário de segurança em rápida mudança. Nossas forças armadas devem ser equipadas com armamentos e veículos modernos e avançados para manter a prontidão e defender nossos interesses nacionais. A Iniciativa de Aquisição do Exército dos Anos 2000 estabelece a base para uma modernização abrangente, de veículos blindados e sistemas de defesa aérea a tecnologia avançada de comunicações. Ao priorizar este ambicioso programa, garantiremos que o Exército Tcheco possa enfrentar os desafios do século XXI. Agora é hora de decidir como abordaremos essa transformação: por meio da cooperação internacional ou do fortalecimento de nossa indústria de defesa nacional."
 CZE_2000st_apc: "Programa de Modernização da Frota de Blindados de Transporte"
 CZE_2000st_apc_desc: "À medida que o mundo se torna cada vez mais volátil, a República Tcheca deve priorizar a modernização de seus ativos militares. A frota envelhecida de blindados de transporte já não atende às demandas da guerra moderna, e é crucial equiparmos nossas forças com veículos capazes de resistir aos desafios do campo de batalha do futuro. Investindo neste programa de modernização, aumentaremos a mobilidade, a proteção e a eficácia geral de nossas forças armadas. A questão permanece: devemos recorrer a parceiros confiáveis no exterior para uma atualização rápida, ou investir em nossa indústria nacional para desenvolver uma solução tcheca? A decisão que tomarmos moldará o futuro de nossas forças armadas por muitos anos."
 CZE_2000st_strop_2: "Aquisição de SPAA"
 CZE_2000st_strop_2_desc: "À medida que a guerra moderna continua evoluindo, proteger os céus é uma prioridade máxima das Forças Armadas Tchecas. Para enfrentar as crescentes ameaças aéreas, devemos explorar opções para uma solução robusta de artilharia antiaérea autopropulsada (SPAA). O programa nacional STROP 2 promete um sistema versátil, produzido internamente, que apoia a indústria nacional e garante autossuficiência de longo prazo. No entanto, sistemas estrangeiros consolidados oferecem eficácia imediata no campo de batalha e confiabilidade comprovada. Devemos ponderar com cuidado se continuaremos o desenvolvimento do nosso STROP 2 ou buscaremos no exterior soluções que possam ser implantadas sem demora. Esta decisão moldará o futuro da defesa aérea tcheca por muitos anos."
 CZE_2000st_ifv: "Modernização dos Veículos de Combate de Infantaria"
 CZE_2000st_ifv_desc: "Como a guerra mecanizada se torna cada vez mais importante na estratégia militar moderna, a República Tcheca deve modernizar sua frota de Veículos de Combate de Infantaria (IFVs) para apoiar nossa infantaria e fornecer-lhe a mobilidade, a proteção e o poder de fogo necessários para conflitos futuros. A frota atual está obsoleta e incapaz de atender às demandas da guerra contemporânea. Agora temos a oportunidade de explorar várias opções: desenvolver um modelo nacional de IFV alinhado à nossa indústria de defesa ou adquirir projetos comprovados do exterior. Essa modernização aumentará muito a eficácia de nossas forças terrestres e reforçará nossa força militar geral."
 CZE_2000st_utility_vehichles: "Modernização dos Veículos Utilitários"
 CZE_2000st_utility_vehichles_desc: "A espinha dorsal de qualquer exército moderno está não só em seus blindados pesados e poder aéreo, mas também na versatilidade e confiabilidade de seus veículos utilitários. Do transporte de tropas ao apoio logístico, nossa frota atual de veículos utilitários está obsoleta e precisa ser substituída para atender às demandas da guerra moderna. Devemos priorizar a modernização de nossa frota de veículos utilitários para melhorar a mobilidade, a eficiência e a prontidão operacional de nossas forças armadas. Seja pela aquisição de projetos estrangeiros ou pelo desenvolvimento de novos modelos nacionais, aprimorar esse segmento vital fortalecerá tanto nossa capacidade logística quanto nossa flexibilidade no campo de batalha."
 CZE_2000st_tank_modernization: "Modernização dos Carros de Combate Principais"
 CZE_2000st_tank_modernization_desc: "Para manter a força e a eficácia de nossas forças blindadas, a República Tcheca deve priorizar a aquisição de uma nova geração de Carros de Combate Principais (MBTs). Nossa frota atual de tanques está obsoleta e não atende às demandas da guerra moderna, em que velocidade, poder de fogo e proteção são fundamentais. Agora enfrentamos a decisão crítica de escolher uma nova plataforma de MBT entre várias opções de classe mundial. Seja optando pelo alemão Leopard, testado em batalha, pelo francês Leclerc, tecnologicamente avançado, ou pelo russo T-90, econômico e durável, nossa escolha terá um impacto duradouro sobre o futuro de nossas divisões blindadas e alianças internacionais."
 CZE_2010st_army_procurement: "Aquisição do Exército dos Anos 2010"
 CZE_2010st_army_procurement_desc: "À medida que a República Tcheca entra em uma nova década, o cenário em evolução da guerra moderna exige que nossas forças armadas passem por uma revisão significativa. A Iniciativa de Aquisição do Exército dos Anos 2010 é um programa abrangente de modernização projetado para equipar nossas forças com tecnologia de ponta e sistemas de armas avançados em todos os ramos. Essa iniciativa foca na modernização de nossas forças blindadas, equipamento de infantaria, artilharia, defesa aérea e capacidades logísticas. Investindo em carros de combate principais de próxima geração, sistemas antiaéreos, artilharia e armas leves, além de melhorar a mobilidade com novos veículos utilitários e de infantaria, garantiremos que o Exército Tcheco permaneça preparado para enfrentar qualquer conflito futuro com confiança e força."
 CZE_2010st_atg: "Sistemas Avançados de Mísseis Antitanque Guiados"
 CZE_2010st_atg_desc: "O campo de batalha evoluiu, e nossas forças devem ser equipadas com Mísseis Antitanque Guiados (ATGMs) modernos para enfrentar novas ameaças blindadas. Em 2010, o desenvolvimento de ATGMs altamente precisos e de longo alcance se tornou crucial tanto para a infantaria quanto para as unidades mecanizadas. Precisamos adquirir e empregar uma nova geração de ATGMs com maior poder de fogo, sistemas de mira aprimorados e mobilidade, para garantir que nossas forças continuem capazes de neutralizar até os blindados inimigos mais avançados a uma distância segura."
 CZE_2010st_tank_modernisation: "Carros de Combate Principais de Nova Geração"
 CZE_2010st_tank_modernisation_desc: "Nossas forças blindadas continuam sendo a ponta de lança de nosso poder militar, mas em 2010 a crescente sofisticação dos tanques inimigos e das armas antitanque exige a introdução de um novo Carro de Combate Principal (MBT) de ponta. Com blindagem aprimorada, maior mobilidade e sistemas de controle de tiro de última geração, o MBT de nova geração dará às nossas forças poder de fogo e capacidade de sobrevivência superiores no campo de batalha. A escolha da plataforma moldará o núcleo de nossas forças blindadas pela próxima década."
 CZE_2010st_apc: "Programa Moderno de Blindados de Transporte"
 CZE_2010st_apc_desc: "À medida que nossas forças armadas se adaptam às necessidades do combate moderno, garantir a segurança e a mobilidade de nossa infantaria é essencial. Nossos obsoletos Veículos Blindados de Transporte de Pessoal (APCs) devem ser substituídos por modelos modernos que ofereçam maior proteção, velocidade e versatilidade. Com APCs de nova geração, daremos às nossas tropas melhores capacidades de transporte, permitindo desdobramento rápido em ambientes hostis e protegendo-as de IEDs, tiros de armas leves e artilharia."
 CZE_2010st_arty: "Sistemas de Artilharia de Nova Geração"
 CZE_2010st_arty_desc: "Em 2010, precisão e poder de fogo são as marcas de uma artilharia eficaz. Nossos sistemas atuais estão obsoletos, sem o alcance e a precisão necessários para apoiar operações de combate modernas. Devemos investir em novos sistemas de artilharia autopropulsada com maior alcance, mira aprimorada e capacidade de entregar poder de fogo devastador de posições mais seguras e distantes. Essa modernização garantirá que nossas forças mantenham superioridade esmagadora de fogo em qualquer conflito."
 CZE_2010st_small_arms: "Armas Leves de Nova Geração"
 CZE_2010st_small_arms_desc: "Nossa infantaria é a espinha dorsal das Forças Armadas Tchecas, e equipá-la com fuzis modernos e confiáveis é crucial para o sucesso no campo de batalha. Em 2010, nossas armas leves obsoletas já não são suficientes contra adversários bem equipados. Devemos adquirir novos fuzis de assalto que ofereçam maior precisão, modularidade e compatibilidade com óticas e acessórios modernos. O fuzil de nova geração aumentará a eficácia de combate de nossa infantaria em todas as condições."
 CZE_toyota_hilux_utility: "Programa de Veículos Utilitários Modernos"
 CZE_toyota_hilux_utility_desc: "O apoio logístico e tático é a tábua de salvação de qualquer operação militar. Em 2010, a frota de veículos utilitários do Exército Tcheco mostra sua idade, sem a mobilidade e a proteção necessárias para atuar em condições modernas de combate. Uma nova geração de veículos utilitários dará às nossas forças melhor capacidade fora de estrada, maior proteção e maior versatilidade para uma ampla gama de tarefas, do transporte de tropas à logística de campanha e evacuação médica."
 CZE_2010st_ifv: "IFV de Nova Geração"
 CZE_2010st_ifv_desc: "Na guerra mecanizada moderna, os Veículos de Combate de Infantaria (IFVs) desempenham um papel central tanto em operações ofensivas quanto defensivas. Nossa frota atual de IFVs não é mais adequada para proteger e apoiar nossa infantaria no campo de batalha. Desenvolvendo ou adquirindo novos IFVs, daremos às nossas forças proteção, mobilidade e poder de fogo avançados, garantindo que nossa infantaria mecanizada continue eficaz contra adversários cada vez mais capazes."
 CZE_2010st_spaa: "Sistemas Antiaéreos Autopropulsados Modernos"
 CZE_2010st_spaa_desc: "A superioridade aérea se tornou um fator crítico na guerra moderna, e a capacidade de se defender de aeronaves e drones inimigos é vital para manter o controle do campo de batalha. Em 2010, nossos sistemas antiaéreos existentes estão obsoletos e incapazes de enfrentar as ameaças modernas. Devemos adquirir novos sistemas antiaéreos autopropulsados que ofereçam melhor mobilidade, precisão e poder de fogo, garantindo que nossas forças estejam bem protegidas de ameaças aéreas em qualquer teatro de guerra."
 CZE_2010st_manpad: "Sistemas Portáteis Avançados de Defesa Aérea"
 CZE_2010st_manpad_desc: "O aumento das ameaças aéreas e de drones exige que nossa infantaria seja equipada com soluções portáteis modernas de defesa aérea. Em 2010, MANPADS obsoletos não conseguem enfrentar com eficácia caças, helicópteros ou drones modernos. Investindo nos MANPADS mais recentes, daremos aos nossos soldados a capacidade de oferecer defesa imediata e eficaz contra ameaças aéreas, garantindo melhor proteção para nossas forças terrestres e infraestruturas críticas."
 CZE_2020Utility: "Modernização dos Veículos Utilitários"
 CZE_2020Utility_desc: "À medida que as operações militares se tornam mais complexas e geograficamente diversas, o Exército Tcheco deve garantir que seus veículos utilitários atendam às demandas da guerra moderna. Em 2020, nossa frota existente não é mais suficiente para fornecer a mobilidade, a durabilidade e o apoio necessários no campo de batalha. Uma nova geração de veículos utilitários é essencial para ampliar nossas capacidades logísticas e dar apoio confiável às nossas forças em qualquer terreno. Devemos agora decidir entre várias opções avançadas, cada uma com vantagens únicas em proteção, mobilidade e custo. Os veículos que escolhermos serão críticos para o sucesso operacional e a eficiência de nossas forças terrestres."
 CZE_2020APC: "Modernização dos Veículos Blindados de Transporte de Pessoal"
 CZE_2020APC_desc: "A capacidade do Exército Tcheco de transportar a infantaria com segurança e eficiência depende da eficácia de seus Veículos Blindados de Transporte de Pessoal (APCs). Em 2020, nossa frota obsoleta de APCs precisa de uma revisão para enfrentar os desafios da guerra moderna. Devemos agora avaliar as opções de APC mais recentes disponíveis para aumentar a mobilidade, a proteção e o poder de fogo do nosso exército. Seja escolhendo a série finlandesa Sisu/Patria XA por sua modularidade, o Pandur 3 por seu projeto avançado e desempenho comprovado, ou o fortemente blindado Kurganets-25, a decisão moldará o futuro de nossa infantaria mecanizada por muitos anos."
 CZE_2020MBT: "Modernização dos Carros de Combate Principais"
 CZE_2020MBT_desc: "Na guerra moderna, os Carros de Combate Principais (MBTs) continuam sendo a espinha dorsal das forças blindadas, fornecendo poder de fogo, proteção e domínio do campo de batalha. A atual frota de MBTs do Exército Tcheco está se tornando obsoleta e deve ser substituída por uma plataforma de nova geração. Em 2020, consideramos três grandes candidatos: o alemão Leopard 2A8, que oferece precisão e capacidade de sobrevivência incomparáveis; o americano M1A2 SEPv3, conhecido por seus sistemas de ponta e durabilidade; e o russo T-14 Armata, um tanque revolucionário que combina sistemas de proteção avançados com tecnologia inovadora. A escolha que fizermos moldará as capacidades de nossas forças blindadas por décadas."
 CZE_2020IFV: "Modernização dos Veículos de Combate de Infantaria"
 CZE_2020IFV_desc: "À medida que as ameaças no campo de batalha se tornam mais sofisticadas, o Exército Tcheco deve modernizar sua frota de Veículos de Combate de Infantaria (IFVs) para garantir que nossa infantaria tenha a proteção, a mobilidade e o poder de fogo necessários para ter sucesso. Em 2020, avaliamos três opções principais: o chinês Type 08, um veículo sobre rodas que oferece velocidade e versatilidade impressionantes; o alemão Lynx, projetado para modularidade e sistemas de defesa de ponta; e o russo VPK-7829 Bumerang, que combina blindagem pesada com fortes capacidades anfíbias. A decisão que tomarmos influenciará enormemente a eficácia de combate e a adaptabilidade de nossas forças mecanizadas pela próxima geração."
 CZE_2020SPA: "Modernização da Artilharia Autopropulsada"
 CZE_2020SPA_desc: "Como a guerra moderna depende cada vez mais de apoio de fogo rápido e de longo alcance, o Exército Tcheco deve modernizar seus sistemas de artilharia autopropulsada para continuar eficaz. Em 2020, temos três opções principais: o modernizado Vz. 77 DANA tcheco, que combina mobilidade com confiabilidade comprovada; o americano M142 HIMARS, que oferece precisão e mobilidade excepcionais para artilharia de foguetes; e o Sistema de Artilharia Archer sueco, capaz de entregar fogo rápido e preciso a longas distâncias. A decisão que tomarmos moldará significativamente nossa capacidade de fornecer apoio de artilharia potente e móvel em operações futuras."
 CZE_2020st_army_procurement: "Iniciativa de Aquisição do Exército dos Anos 2020"
 CZE_2020st_army_procurement_desc: "O Exército Tcheco enfrenta novos desafios em 2020, pois os avanços tecnológicos e a dinâmica em evolução do campo de batalha exigem que modernizemos e ampliemos nossas capacidades militares. A Iniciativa de Aquisição do Exército dos Anos 2020 visa fornecer às nossas forças armadas o equipamento e os sistemas de ponta de que precisam para se manter competitivas na guerra moderna. De veículos blindados e artilharia a defesa aérea avançada e veículos utilitários, este programa abrangente de aquisição se concentrará em selecionar as melhores plataformas disponíveis para garantir que nossas forças armadas estejam equipadas para o futuro. As decisões tomadas sob esta iniciativa moldarão as capacidades operacionais do Exército Tcheco por muitos anos."
 CZE_2000_army_program_idea: "Aquisição de Veículos do Exército 2000"
 CZE_2010_army_program_idea: "Aquisição de Veículos do Exército 2010"
 CZE_2020_army_program_idea: "Aquisição de Veículos do Exército 2020"
 CZE_motorization_focus_idea: "Foco Automotivo"
 CZE_motorization_focus_idea_desc: "Há anos a República Tcheca é líder na indústria automotiva civil da Europa Central e Oriental. Essa vantagem abre caminho para um comércio exterior altamente lucrativo, que acelera o crescimento da economia tcheca."
 CZE_divided_society_idea: "Sociedade Dividida"
 CZE_divided_society_idea_desc: "O colapso da Tchecoslováquia em 1992 abalou a política interna de ambos os países. Uma sociedade foi dividida em duas. Houve tentativas de impedir a divisão, mas, devido às mudanças políticas após a queda do comunismo, era apenas questão de tempo. No entanto, a esperança de reunificação ainda existe e aqueles que querem o retorno da Tchecoslováquia farão de tudo para que isso aconteça."
 CZE_ctyrkoalice_idea: "Čtyřkoalice"
 CZE_ctyrkoalice_idea_desc: "Coalizão de 4 partidos políticos: KDU-ČSL, US-DEU (composto por dois partidos) e ODA. É uma cooperação mútua de oposição que visa superar o domínio dos partidos ČSSD e ODS na política tcheca."
 CZE_debt_problem_idea: "Problema da Dívida"
 CZE_debt_problem_idea_desc: "A República Tcheca enfrenta atualmente dívidas bastante grandes, que aumentam constantemente. Somente uma cooperação sólida entre os partidos políticos pode estabilizar essa situação."
