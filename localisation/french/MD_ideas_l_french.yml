l_french:
 minority_government: "Gouvernement minoritaire"
 minority_government_desc: "Notre gouvernement est actuellement minoritaire, ce qui rend toute action politique très difficile."
 international_sanctions: "Sanctions internationales"
 international_sanctions_desc: "Nous sommes soumis à des sanctions économiques de la part de la communauté internationale."
 p5_member: "Membre permanent du CSNU"
 p5_member_desc: "Les membres permanents du Conseil de sécurité des Nations unies comprennent les cinq gouvernements suivants: la Chine, la France, la Russie, le Royaume-Uni et les États-Unis. Ces membres représentent les cinq grandes puissances considérées comme les vainqueurs de la Seconde Guerre mondiale. Chacun des membres permanents dispose d'un droit de veto qui lui permet d'empêcher l'adoption de tout projet de résolution « important » du Conseil, quel que soit le niveau de soutien international dont bénéficie ce projet."
 g7_member: "Membre du G7"
 g7_member_desc: "Le Groupe des sept (G7) est un groupe composé du Canada, de la France, de l'Allemagne, de l'Italie, du Japon, du Royaume-Uni et des États-Unis. Ces pays représentent un pourcentage très élevé de la richesse mondiale nette et ont tous un indice de développement humain très élevé."
 developmentalism: "Développementalisme"
 developmentalism_desc: "Le développementalisme est une théorie économique qui affirme que la meilleure façon de développer les économies des pays moins développés est d'avoir un marché intérieur fort et varié avec des tarifs élevés."
 revanchism: "Revanchisme"
 revanchism_desc: "Le revanchisme est le terme qui désigne la volonté d'un pays de reconquérir un territoire qu'il a précédemment perdu. Rendu populaire par les Français après la perte de l'Alsace-Lorraine, le revanchisme reste un facteur clé dans la politique de nombreux pays."
 peaceful_emergence: "Émergence pacifique"
 peaceful_emergence_desc: "Malgré nos visions différentes du monde, nous ne devrions pas être hostiles à l'ordre ancien, mais plutôt travailler lentement à changer le monde par la diplomatie et l'économie."
 idea_GUAM_member_state: "Membre du GUAM"
 idea_GUAM_member_state_desc: "'GUAM' or GUAM Organization of Democracy and Economic Development is an organization founded in 1997 by members Georgia, Ukraine, Azerbaijan and Moldova. The organization's charter, which was officiated in 2001, sought to promote cooperation by promoting democratic values, stable development, enhancing security both domestically and abroad, and finally pushing forward European integration. It is often seen as a means of countering Russian influence in the region, however, the leaders of GUAM have rejected these claims."
 idea_GUAM_member_state_2: "Membre du GUAM"
 idea_GUAM_member_state_2_desc: "Le GUAM ou Organisation pour la démocratie et le développement est une organisation fondée en 1997 par ses membres, la Géorgie, l'Ukraine, l'Azerbaïdjan et la Moldavie. La charte de l'organisation, qui a été officialisée en 2001, vise à favoriser la coopération en promouvant les valeurs démocratiques, un développement stable, en renforçant la sécurité tant à l'intérieur qu'à l'extérieur du pays, et enfin, en faisant avancer l'intégration européenne. Elle est souvent considérée comme un moyen de contrer l'influence russe dans les régimes, mais les dirigeants du GUAM ont rejeté ces affirmations."
 ecowas_member_state: "CEDEAO"
 ecowas_member_state_desc: "La Communauté économique des États de l'Afrique de l'Ouest est une union politique et économique de quinze pays situés en Afrique de l'Ouest. L'union a été officiellement créée en mai 1975 dans le but de promouvoir l'autosuffisance collective en créant un bloc commercial ouest-africain par le biais d'une union économique et commerciale. En outre, la CEDEAO sert également de force de maintien de la paix dans la région et a été utilisée au sein des États membres en cas d'instabilité politique ou de troubles dans les États membres."
 cfa_franc: "Franc CFA"
 cfa_franc_desc: "Le franc CFA a été créé après la Seconde Guerre mondiale pour protéger les colonies de la forte dévaluation. Il devait à l’origine être une générosité du gouvernement français, mais les regards se sont tournés vers le franc CFA comme un autre outil de soumission post-décolonisation. Les avantages économiques et la stabilité de la monnaie ne compensent pas toujours l’influence que la France conserve sur nous et le contrôle qu’elle exerce sur notre politique monétaire."
 combined_arms_idea: "Armes combinées"
 combined_arms_idea_desc: "L'idée des armes combinées est une méthode de guerre qui intègre les différentes armes de combat d'une armée pour atteindre le succès final."
 eco_factories_projects_idea: "Eco-Factories"
 eco_factories_projects_idea_desc: "In an effort to make our countries greener we have started to introduce the concept of Eco-Factories. What better way to help the environment than by building eco-friendly industry?"
 sunni: "Sunnisme"
 sunni_desc: "L'islam sunnite est la plus grande dénomination de l'islam. Son nom vient du mot Sunnah, qui fait référence au comportement exemplaire du prophète islamique Mahomet. Les différences entre les musulmans sunnites et chiites sont nées d'un désaccord sur le choix du successeur de Mahomet et ont ensuite acquis une signification politique plus large, ainsi que des dimensions théologiques et juridiques."
 sufi_islam: "Soufisme"
 sufi_islam_desc: "Sufi Islam is often defined as \"Islamic mysticism\". It formed very early in Islamic history, as a reaction against the politicization of Islam. They believe that, through constant reciting of the Qur'an, singing and deep meditation, a spiritual connection - ecstasy - is created between the seeker and Muhammad. Through Muhammad, Sufis aim to understand, connect with, and experience Allah. Historically, Sufi missionaries were the main spreaders of Islam to Africa and the Indian subcontinent."
 ibadi: "Ibadisme"
 ibadi_desc: "The Ibadi religious movement separated from the main branch of Islam 20 years after the death of the prophet Muhammad, and thus predates both Sunni and Shia Islam. The movement co-originated with the Kharijite secession, where it is believed that Ali's acceptance of arbitration at the Battle of Siffin rendered him unfit for leadership - as Allah's judgement on the battlefield - not negotiations, should determine who the rightful Caliph is. It is, however, considered a much more tolerant branch than the extremist Kharijites, and Ibadism shares several distinct beliefs with both Sunnis and Shias."
 shia: "Chiite"
 shia_desc: "L'islam chiite (disciples d'Ali) est une branche de l'islam qui considère que le prophète Mahomet a désigné Ali ibn Abi Talib comme son successeur (imam). L'islam chiite s'oppose principalement à l'islam sunnite, dont les adeptes pensent que Mahomet n'a pas désigné de successeur et considèrent qu'Abu Bakr (qui a été nommé calife par une shura, c'est-à-dire un consensus communautaire) est le calife correct."
 judaism: "Judaïsme"
 judaism_desc: "§YRègle spéciale:§! §WPeut interdire les partis islamistes modérés.§!\n\nLe judaïsme est une ancienne religion monothéiste abrahamique dont le texte fondateur est la Torah. Il englobe la religion, la philosophie et la culture du peuple juif. Le judaïsme est considéré par les Juifs comme l'expression de l'alliance que Dieu a établie avec les enfants d'Israël."
 cheondo: "Cheondoïsme"
 cheondo_desc: "§YRègle spéciale:§! §WPeut interdire les partis islamistes modérés.§!\n\nLe chéondoïsme (« religion de la voie céleste ») est un mouvement religieux coréen du XXème siècle, basé sur le mouvement néo-confucéen Donghak du XIXème siècle, fondé par Choe Je-u et codifié sous Son Byeong-hui. Le chéondoisme trouve son origine dans les rébellions paysannes qui ont éclaté à partir de 1812 sous la dynastie Joseon."
 shinto: "Shintoïsme"
 shinto_desc: "§YRègle spéciale:§! §WPeut interdire les partis islamistes modérés.§!\n\nLe shintoïsme est la religion ethnique du Japon qui met l'accent sur les pratiques rituelles à accomplir avec diligence, afin d'établir un lien entre le Japon d'aujourd'hui et son ancien passé."
 buddism: "Bouddhisme"
 buddism_desc: "§YRègle spéciale:§! §WPeut interdire les partis islamistes modérés.§!\n\nLe bouddhisme est une religion et un dharma qui englobe une variété de traditions, de croyances et de pratiques spirituelles largement fondées sur les enseignements attribués au Bouddha. Le bouddhisme a vu le jour dans l'Inde ancienne entre le VIème et le IVème siècle avant J.-C., d'où il s'est répandu dans une grande partie de l'Asie, avant de décliner en Inde au cours du Moyen Âge."
 hindu: "Hindouisme"
 hindu_desc: "§YRègle spéciale:§! §WPeut interdire les partis islamistes modérés.§!\n\nL'hindouisme est une religion, ou un mode de vie, largement pratiquée dans le sous-continent indien. L'hindouisme a été qualifié de religion la plus ancienne du monde, et certains pratiquants et érudits le qualifient de sanatana dharma, « loi éternelle », au-delà de l'histoire humaine."
 christian: "Chrétien occidental"
 christian_desc: "§YRègle spéciale :§! §WPeut interdire les partis islamistes modérés.§!\n\nLe christianisme occidental est une religion monothéiste abrahamique fondée sur la vie et les enseignements de Jésus-Christ, point focal des confessions chrétiennes occidentales. Il englobe de nombreuses branches du christianisme telles que le protestantisme, le catholicisme et le luthéranisme, qui totalisent plus de 2,4 milliards de fidèles, soit 33 % de la population mondiale."
 orthodox_christian: "Christianisme orthodoxe"
 orthodox_christian_desc: "§YRègle spéciale:§! §WPeut interdire les partis islamistes modérés.§!\n\nL'Église orthodoxe orientale, également connue sous le nom d'Église orthodoxe ou, officiellement, d'Église catholique orthodoxe, est la deuxième plus grande Église chrétienne et l'une des plus anciennes institutions religieuses existant dans le monde. L'Église orthodoxe orientale enseigne qu'elle est l'Église unique, sainte, catholique et apostolique établie par Jésus-Christ dans sa Grande Commission aux apôtres. Elle pratique ce qu'elle considère être la foi chrétienne originelle et maintient la tradition sacrée transmise par les apôtres."
 zoroastrian: "Zoroastrien"
 zoroastrian_desc: "Zoroastrianism is the world's oldest monotheistic religion, and its teachings are based on the Iranian prophet Zoroaster, as it preaches about the duality of good and evil in the world. The three core principles of Zoroastrianism are Good thoughts, Good deeds, and Good words."
 assianism: "Assianisme"
 assianism_desc: "Assianism  is a folk religion derived from the traditional mythology of the Ossetians, modern descendants of the Scythians of the Alan tribes, believed to be a continuation of the ancient Scythian religion. The religion is known as \"Assianism\" among its Russian-speaking adherents, or simply Iron Din by Ossetians in their own language. It started to be properly reorganized in a conscious way during the 1980s, as an ethnic religion among the Ossetians."
 pluralist: "Pluralisme"
 pluralist_desc: "Pluralism is the worldview according to which one's religion is not the sole and exclusive source of truth, and thus the acknowledgment that at least some truths and true values exist in other religions."
 EU_member: "Membre de l'UE"
 EU_member_desc: "L'Union européenne (UE) est une union politique et économique d'États membres situés principalement en Europe. L'UE a développé un marché intérieur unique grâce à un système normalisé de lois qui s'appliquent dans tous les États membres. Les politiques de l'UE visent à garantir la libre circulation des personnes, des biens, des services et des capitaux au sein du marché intérieur, à adopter une législation en matière de justice et d'affaires intérieures et à maintenir des politiques communes en matière de commerce, d'agriculture, de pêche et de développement régional."
 sco_observer: "Observateur de l'Organisation de coopération de Shanghai"
 sco_observer_desc: "L'Organisation de coopération de Shanghai (OCS) est une organisation politique, économique et de sécurité eurasienne, dont la création a été annoncée le 15 juin 2001 à Shanghai, en Chine, par les dirigeants de la Chine, du Kazakhstan, du Kirghizstan, de la Russie, du Tadjikistan et de l'Ouzbékistan. Le statut d'observateur constitue une étape intermédiaire avant l'adhésion à part entière."
 fifty_fifty_divide: "Division religieuse 50-50"
 fifty_fifty_divide_desc: "Le pays est divisé presque à parts égales en ce qui concerne les pratiques religieuses."
 al_qaeda_network: "Réseau d'Al-Qaïda"
 al_qaeda_network_desc: "En faisant partie du réseau mondial d'Al-Qaida, il nous est plus facile d'envoyer des combattants pour aider nos alliés."
 great_power: "Grande puissance"
 great_power_desc: "Nous sommes une grande puissance dans le monde, avec une capacité mondialement reconnue d'exercer notre influence à l'échelle mondiale, n'étant dépassés à cet égard que par les superpuissances.\n\nLe statut de puissance est déterminé par le montant du PIB que nous contribuons au total mondial, modifié par notre §Yindépendance vis-à-vis de l'influence étrangère§!. Notre contribution actuelle est de §Y[?ROOT.percentage_of_global_factories|%1]§!.\n\nLes contributions requises pour les différents niveaux sont les suivantes:\nPlus de §Y15%§! pour §Y$superpower$§!\nPlus de §Y6.5%§! pour §Y$great_power$§!\nPlus de §Y2.5%§! pour §Y$large_power$§!\nPlus de §Y0.2%§! pour §Y$minor_power$§!\nMoins de §Y0.2%§! pour §Y$non_power$§!\n\nDans chaque région géographique, un certain nombre des plus fortes §Y$minor_power$§! seront classées comme §Y$regional_power$§! s'il n'y a pas assez de §Y$superpower$§!, de §Y$great_power$§! ou de §Y$large_power$§! dans la région. Le nombre de pays au dessus de §Y$minor_power$§! dans chaque région est:\nEurope (7)\nMoyen-Orient et Afrique du Nord (3)\nAfrique sub-saharienne (3)\nAsie (7)\nAmérique (4)"
 great_power_tt: "£economy_laws_cost_texticon Coût des lois: §R+45%§!\n£economy_laws_cost_texticon §YInvestissement interne§! Emplacements: §G+3§!"
 large_power: "Puissance majeure"
 large_power_desc: "En tant que puissance majeure, nous n'avons pas encore atteint le statut de grande puissance ou de superpuissance, mais nous exerçons toujours une influence considérable sur les affaires mondiales et régionales et nous pouvons facilement protéger notre souveraineté et nos intérêts vitaux contre des puissances plus importantes.\n\nLe statut de puissance est déterminé par le montant du PIB que nous contribuons au total mondial, modifié par notre §Yindépendance vis-à-vis de l'influence étrangère§!. Notre contribution actuelle est de §Y[?ROOT.percentage_of_global_factories|%1]§!.\n\nLes contributions requises pour les différents niveaux sont les suivantes:\nPlus de §Y15%§! pour §Y$superpower$§!\nPlus de §Y6.5%§! pour §Y$great_power$§!\nPlus de §Y2.5%§! pour §Y$large_power$§!\nPlus de §Y0.2%§! pour §Y$minor_power$§!\nMoins de §Y0.2%§! pour §Y$non_power$§!\n\nDans chaque région géographique, un certain nombre des plus fortes §Y$minor_power$§! seront classées comme §Y$regional_power$§! s'il n'y a pas assez de §Y$superpower$§!, de §Y$great_power$§! ou de §Y$large_power$§! dans la région. Le nombre de pays au dessus de §Y$minor_power$§! dans chaque région est:\nEurope (7)\nMoyen-Orient et Afrique du Nord (3)\nAfrique sub-saharienne (3)\nAsie (7)\nAmérique (4)"
 large_power_tt: "£economy_laws_cost_texticon Coût des lois: §R+30%§!\n£economy_laws_cost_texticon §YInvestissement interne§! Emplacements: §G+2§!"
 regional_power: "Puissance régionale"
 regional_power_desc: "En tant que puissance régionale, nous exerçons une influence considérable sur les événements régionaux et nous conservons la capacité de protéger notre souveraineté et nos intérêts vitaux sur le territoire national contre l'ingérence de plus grandes puissances.\n\nLe statut de puissance est déterminé par le montant du PIB que nous contribuons au total mondial, modifié par notre §Yindépendance vis-à-vis de l'influence étrangère§!. Notre contribution actuelle est de §Y[?ROOT.percentage_of_global_factories|%1]§!.\n\nLes contributions requises pour les différents niveaux sont les suivantes:\nPlus de §Y15%§! pour §Y$superpower$§!\nPlus de §Y6.5%§! pour §Y$great_power$§!\nPlus de §Y2.5%§! pour §Y$large_power$§!\nPlus de §Y0.2%§! pour §Y$minor_power$§!\nMoins de §Y0.2%§! pour §Y$non_power$§!\n\nDans chaque région géographique, un certain nombre des plus fortes §Y$minor_power$§! seront classées comme §Y$regional_power$§! s'il n'y a pas assez de §Y$superpower$§!, de §Y$great_power$§! ou de §Y$large_power$§! dans la région. Le nombre de pays au dessus de §Y$minor_power$§! dans chaque région est:\nEurope (7)\nMoyen-Orient et Afrique du Nord (3)\nAfrique sub-saharienne (3)\nAsie (7)\nAmérique (4)"
 regional_power_tt: "£economy_laws_cost_texticon Coût des lois: §R+20%§!\n£economy_laws_cost_texticon §YInvestissement interne§! Emplacements: §G+1§!"
 minor_power: "Puissance mineure"
 minor_power_desc: "En tant que puissance mineure, nous ne sommes ni ici ni là dans la diplomatie internationale. Si nous en faisons une priorité absolue, nous avons une légère capacité à résister à la pression et à l'influence étrangères, mais nous souffrons d'une capacité très limitée à projeter notre influence à l'étranger.\n\nLe statut de puissance est déterminé par le montant du PIB que nous contribuons au total mondial, modifié par notre §Yindépendance vis-à-vis de l'influence étrangère§!. Notre contribution actuelle est de §Y[?ROOT.percentage_of_global_factories|%1]§!.\n\nLes contributions requises pour les différents niveaux sont les suivantes:\nPlus de §Y15%§! pour §Y$superpower$§!\nPlus de §Y6.5%§! pour §Y$great_power$§!\nPlus de §Y2.5%§! pour §Y$large_power$§!\nPlus de §Y0.2%§! pour §Y$minor_power$§!\nMoins de §Y0.2%§! pour §Y$non_power$§!\n\nDans chaque région géographique, un certain nombre des plus fortes §Y$minor_power$§! seront classées comme §Y$regional_power$§! s'il n'y a pas assez de §Y$superpower$§!, de §Y$great_power$§! ou de §Y$large_power$§! dans la région. Le nombre de pays au dessus de §Y$minor_power$§! dans chaque région est:\nEurope (7)\nMoyen-Orient et Afrique du Nord (3)\nAfrique sub-saharienne (3)\nAsie (7)\nAmérique (4)"
 non_power: "Non-puissance"
 non_power_desc: "As a Non-Power, we are essentially a non-factor in international diplomacy, with few, if any, caring about our position on anything. We are tools to more dominant and influential sovereign nations, who with ease can influence our politics and society.\n\nPower status is determined by how much GDP we contribute to the world total, modified by our §YIndependence from Foreign Influence§!. Our current contribution is §Y[?ROOT.percentage_of_global_factories|%1]§!.\n\nThe required contributions for the different levels are:\nMore than §Y15%§! for §Y$super_power$§!\nMore than §Y6.5%§! for §Y$great_power$§!\nMore than §Y2.5%§! for §Y$large_power$§!\nMore than §Y0.2%§! for §Y$minor_power$§!\nLess than §Y0.2%§! for §Y$non_power$§!\n\nIn every geographic region, a certain number of the strongest §Y$minor_power$s§! will be classified as §Y$regional_power$s§! if there aren't enough §Y$super_power$s§!, §Y$great_power$s§! and §Y$large_power$s§! in the region. The regions and numbers of countries above §Y$minor_power$§! are:\nEurope (7)\nMiddle East and North Africa (3)\nSub-Saharan Africa (3)\nAsia (7)\nAmericas (4).\n\nPower Ranking is updated quarterly (February, May, August & November)."
 non_power_tt: "£economy_laws_cost_texticon Coût des lois: §G-20%§!"
 child_soldiers: "Enfants soldats"
 child_soldiers_desc: "Des enfants sont actuellement mobilisés dans l'armée. Dans de nombreux conflits asymétriques, les enfants sont enrôlés de force dans les groupes rebelles et désensibilisés à la violence. Le sort de ces enfants est affligeant, car ils sont traumatisés à vie, et beaucoup d'entre eux se tournent vers la violence, l'alcool et la drogue plus tard dans leur vie.\n\nLa conscription forcée d'enfants renforce nos troupes, mais souvent, ces jeunes garçons ne sont rien de plus que de la chair à canon."
 mischevous_failure: "Méfaits et inconduites"
 mischevous_failure_desc: "Comme ce que nous avons fait de nos méfaits et de notre mauvaise conduite, l'État est maintenant mis en grand danger car nous sommes instables et corrompus en ce moment."
 operatives1: "Ajouter 1 agent"
 operatives5: "Ajouter 5 agents"
 operatives10: "Ajouter 10 agents"
 al_jazeera: "Siège d'Al-Jazeera"
 al_jazeera_desc: "Al-Jazeera, de loin le réseau d'information le plus important et le plus influent du monde arabe, est le joyau du soft power qatari. Elle est devenue synonyme de la politique étrangère autonome menée par le Qatar depuis que Hamad ben Khalifa Al Thani a pris le pouvoir en 1995."
 al_jazeera_allowed: "Al-Jazeera"
 al_jazeera_allowed_desc: "Al-Jazeera, by far the largest and most influential news network in the Arab World, is the gem of Qatari soft power around the globe."
 al_jazeera_banned: "Al-Jazeera interdite"
 al_jazeera_banned_desc: "La chaîne d'information populaire Al-Jazeera a été rendue illégale, car elle diffuse des idées dangereuses et promeut les Frères musulmans. Cependant, il est impossible d'empêcher les gens de la regarder via des antennes paraboliques."
 muslim_brotherhood_crackdown: "Répression des Frères musulmans"
 muslim_brotherhood_crackdown_desc: "Les Frères musulmans sont déclarés hors-la-loi et sont réprimés à chaque occasion."
 muslim_brotherhood_home: "Foyer des Frères musulmans"
 muslim_brotherhood_home_desc: "L'Égypte est le berceau et le foyer du mouvement politique sunnite extrêmement populaire et influent appelé les Frères musulmans."
 rentier_state: "État rentier"
 rentier_state_desc: "Le pays étant très riche en ressources naturelles, il n'est pas ou peu nécessaire de taxer la population. Les citoyens bénéficient d'avantages sans payer d'impôts et sont peu enclins à exiger une bonne gouvernance ou des droits politiques. Il en résulte un gouvernement autoritaire et corrompu, ainsi qu'un capitalisme de copinage et un climat commercial peu propice aux secteurs non liés aux ressources.\n\n§RCette idée sera supprimée si l'§Yextraction des ressources§! contribue à moins de 20 % de notre PIB total, que le revenu des §Yexportations de ressources§! est inférieur à 30 % des impôts de la population et des industries combinées, et que vous n'êtes pas en guerre.§!"
 youth_radicalization: "Radicalisation de la jeunesse"
 youth_radicalization_desc: "De nombreux jeunes ont été influencés par des versions radicales de l'islam et le pays est un terrain de recrutement fertile pour des groupes tels qu'Al-Qaïda."
 saudi_aid: "Aide saoudienne aux mosquées et aux madrasas"
 saudi_aid_desc: "Saudi Arabia graciously helps us with our finances, and especially sponsors our mosques and madrassas (religious educational centers). Here, Salafism, a fundamentalist version of Islam is being taught and spread.\n\n§W--------------§!\n§RThis national spirit will be removed if our GDP per Capita is higher than $35k§!, §Y[SAU.GetNameWithFlag]§! is no longer Salafist, or we go to war with §Y[SAU.GetNameWithFlag]§!."
 saudi_aid_idea_TT: "Revenu supplémentaire: §G0.002§!$ par 10 millions d'habitants"
 katib_hezbollah: "Les Kataeb Hezbollah"
 katib_hezbollah_desc: "Far from being just a Lebanese militia group anymore, Hezbollah has expanded into the wider Middle East and with Iranian help, established proxies. Kata'ib Hezbollah is a very large and well-trained Iraqi Shiite militia."
 syrian_hezbollah: "Le Hezbollah syrien"
 syrian_hezbollah_desc: "Le Hezbollah syrien se compose de plusieurs milices chiites syriennes qui adhèrent toutes à la doctrine iranienne du Velayat-e faqih. Il est financé par l'Iran et entraîné par le Hezbollah libanais."
 qatar_expat: "Démographie qatarie"
 qatar_expat_desc: "Seuls 12 % de la population du Qatar sont des citoyens qataris, les autres étant des travailleurs étrangers. Les étrangers occupent presque tous les emplois du pays, la quasi-totalité des Qataris travaillant dans le gouvernement. Le traitement de ces travailleurs étrangers a été fortement critiqué ces dernières années, les conditions de vie étant jugées abusives et relevant de l'exploitation."
 saudi_expat: "Démographie saoudienne"
 saudi_expat_desc: "Seuls 70% de la population de l'Arabie Saoudite sont des citoyens saoudiens, le reste étant des travailleurs étrangers. La plupart des Saoudiens adultes travaillent dans le gouvernement, presque tous les emplois industriels et de services étant occupés par des étrangers. Le traitement de ces travailleurs étrangers a été fortement critiqué ces dernières années, les conditions de vie étant jugées abusives et relevant de l'exploitation."
 omani_expat: "Démographie omanaise"
 omani_expat_desc: "Seuls 64% de la population d'Oman sont des citoyens omanais, le reste étant des travailleurs étrangers. La plupart des Omanais adultes travaillent dans le gouvernement, presque tous les emplois industriels et de services étant occupés par des étrangers. Le traitement de ces travailleurs étrangers a été fortement critiqué ces dernières années, les conditions de vie étant jugées abusives et relevant de l'exploitation."
 uae_expat: "Démographie émirienne"
 uae_expat_desc: "Seuls 11% de la population des Émirats arabes unis sont des citoyens émiratis, le reste étant des travailleurs étrangers. La plupart des Émiriens adultes travaillent dans l'administration, la quasi-totalité des emplois dans l'industrie: le commerce et les services étant occupés par des étrangers. Le traitement de ces travailleurs étrangers a été fortement critiqué ces dernières années, les conditions de vie étant jugées abusives et relevant de l'exploitation."
 kuwait_expat: "Démographie koweïtienne"
 kuwait_expat_desc: "Seuls 29% de la population du Koweït sont des citoyens koweïtiens, le reste étant des travailleurs étrangers. La plupart des Koweïtiens adultes travaillent dans le gouvernement, la quasi-totalité des emplois industriels et de services étant occupés par des étrangers. Le traitement de ces travailleurs étrangers a été fortement critiqué ces dernières années, les conditions de vie étant jugées abusives et relevant de l'exploitation."
 bahraini_expat: "Démographie bahreïnienne"
 bahraini_expat_desc: "Seule la moitié environ de la population de Bahreïn est constituée de citoyens bahreïniens, le reste étant constitué de travailleurs étrangers. La plupart des Bahreïnis adultes travaillent dans le gouvernement: presque tous les emplois industriels et de services étant occupés par des étrangers. Le traitement de ces travailleurs étrangers a été fortement critiqué ces dernières années, les conditions de vie étant jugées abusives et relevant de l'exploitation."
 iranian_aid: "Aide iranienne"
 iranian_aid_desc: "L'Iran fournit une aide militaire et économique. Cela réduit le coût de fonctionnement de notre gouvernement et de notre armée, mais l'Iran tente également d'utiliser cette aide pour influencer notre politique.\n\n§RCet esprit national sera retiré si notre PIB par habitant est supérieur à 17k$§!"
 iranian_aid_idea_TT: "Revenu supplémentaire: §G0.2%§! de notre PIB"
 iranian_aid_custom: "Aide iranienne"
 iranian_aid_custom_desc: "L'Iran fournit une aide militaire et économique. Cela réduit le coût de fonctionnement de notre gouvernement et de notre armée, mais l'Iran tente également d'utiliser cette aide pour influencer notre politique."
 LoAS_member: "Membre de la Ligue arabe"
 LoAS_member_desc: "La Ligue arabe est un conseil des États arabes, destiné à favoriser la coopération politique et le commerce bilatéral."
 restoring_hope: "Restaurer l'espoir"
 restoring_hope_desc: "L'opération « Restaurer l'espoir » est une campagne menée par l'Arabie saoudite pour ramener la paix au Yémen par une solution politique, tout en aidant les forces yéménites."
 idea_focus_industrial_development_program: "Programme de développement industriel"
 idea_focus_industrial_development_program_desc: ""
 multi_ethnic_state_idea: "État multiethnique"
 multi_ethnic_state_idea_desc: "Il y a un dicton qui dit: « L'unité dans la diversité ». Cependant, le plus souvent, les grands groupes minoritaires ont tendance à rechercher une plus grande autonomie ou une indépendance pure et simple."
 the_rubber_baron_of_africa: "Le baron du caoutchouc d'Afrique"
 the_rubber_baron_of_africa_desc: "[CDI.GetName] se trouve sur un trésor de ressources naturelles, et l'une de ces ressources est constituée des arbres à caoutchouc de notre grand pays. Nous produisons la majeure partie du caoutchouc africain et devons continuer à monopoliser une ressource aussi viable pour notre peuple. Cela ne fera qu'aider notre grande nation à croître et à prospérer."
 party_commands_gun: "Le Parti commande le Pistolet"
 party_commands_gun_desc: "La première loyauté de l'Armée populaire de libération va au parti communiste chinois. Cette loyauté est assurée par une formation idéologique rigoureuse et des cadres politiques occupant des postes élevés dans les forces armées."
 party_commands_gun_new_era: "Le Parti commande le Pistolet"
 party_commands_gun_new_era_desc: "La première loyauté de l'Armée populaire de libération va au parti communiste chinois. Cette loyauté est assurée par une formation idéologique rigoureuse et des cadres politiques occupant des postes élevés dans les forces armées."
 china_reunification: "Réunification de la Chine"
 china_reunification_desc: "Après d’innombrables batailles acharnées, la Chine est finalement parvenue à la réunification. La Chine a franchi une nouvelle étape vers le statut de puissance mondiale."
 august_1st: "L'Ordre du 1er août"
 august_1st_desc: "L'Ordre du 1er août est la plus haute distinction militaire décernée aux militaires et civils de l'Armée populaire de libération, de la Police armée populaire et au personnel du Ministère de la Sécurité publique."
 state_system: "ZhongHua"
 state_system_desc: "En règle générale, là où le balai n'atteint pas, la poussière ne disparaît pas d'elle-même. Les armes de la critique ne peuvent remplacer la critique des armes. L'armée chinoise ne se cache plus derrière le mur frontalier en tremblant."
 chastity_paifang: "Coexistence pacifique"
 chastity_paifang_desc: "Depuis la fondation de la République populaire, la politique étrangère chinoise a été guidée par les cinq principes de coexistence pacifique. Ces principes comprennent le respect mutuel de la souveraineté et de l'intégrité territoriale, la non-agression mutuelle, la non-ingérence dans les affaires intérieures des autres États, l'égalité et les avantages mutuels, ainsi que la coexistence pacifique. En raison de ces principes, la Chine a maintenu une position anti-interventionniste tout en défendant la souveraineté de l'État westphalien."
 one_child_policy: "Politique de l'enfant unique"
 one_child_policy_desc: "Conçue comme un moyen de limiter la croissance démographique de la Chine, la politique de l'enfant unique est une tentative controversée et ambitieuse du gouvernement chinois de contrôler la taille de la population chinoise. Si l'ampleur exacte du frein mis à la croissance démographique est débattue, les effets substantiels de la politique sur la société chinoise sont indéniables."
 two_child_policy: "Politique des deux enfants"
 two_child_policy_desc: "After nearly three decades of the one-child policy, China is experiencing a decline in birth rates. To swiftly address this trend and return birth rates to normal levels, the Chinese government intends to loosen the birth restrictions policy a bit."
 factional_politics_balanced: "Politique des factions - équilibrée"
 factional_politics_balanced_desc: "La lutte de pouvoir entre populistes issus des provinces rurales et élitistes des zones plus urbaines et développées de la Chine s'est apaisée, et les membres des deux camps s'accordent à dire que le compromis est la meilleure voie pour assurer l'avenir de la Chine."
 factional_politics_populist: "Politique des factions - domination de la Ligue des jeunes"
 factional_politics_populist_desc: "Les partisans des politiques populistes, tels que les anciens de la Ligue de la jeunesse communiste, déterminent actuellement la politique nationale chinoise. Cela remet en cause les intérêts établis en faveur des pauvres des zones rurales, mais ne favorise pas la croissance économique."
 factional_politics_elitist: "Politique des factions - Domination de la clique de Shanghai"
 factional_politics_elitist_desc: "Les membres de la faction de la politique chinoise plus favorable aux affaires et au développement tiennent les rênes du pouvoir. Cette situation favorise la croissance et le développement, mais rend plus difficile l'obtention du soutien des populations rurales pauvres et la lutte contre la corruption."
 three_represents: "Trois Représentations"
 three_represents_desc: "La « Triple représentativité » est une théorie de ce que représente le Parti communiste, formulée par Jiang Zemin. Elle affirme que le Parti communiste doit être représentatif des forces productives sociales avancées, de la culture avancée et des intérêts de la majorité. Ses implications sont une plus grande acceptation par le Parti communiste chinois de la classe d'affaires en expansion, ce qui lui vaut d'être critiqué dans certains milieux pour s'écarter du marxisme et de la pensée de Mao Zedong."
 scientific_outlook_on_development: "Perspectives scientifiques sur le développement"
 scientific_outlook_on_development_desc: "En bien des points un retour de Hu Jintao contre l'orientation productiviste de la « Triple représentativité » de Jiang Zemin, le « Concept scientifique du développement » constitue le fondement théorique du gouvernement de Hu, axé sur une croissance durable qui minimise la pollution environnementale et les inégalités socioéconomiques."
 zeng_qinghong_thought: "Pensée de Zeng Qinghong"
 zeng_qinghong_thought_desc: "S'appuyant sur la « Triple représentativité » de Jiang Zemin, Zeng a formulé un nouveau fondement idéologique pour le PCC, qui insiste sur le devoir du parti de représenter la majorité du peuple chinois. La pensée de Zeng Qinghong appelle à un parti plus responsable et plus transparent, perçu comme plus représentatif et légitime par le peuple chinois. Au cœur de cette théorie se trouve l'idée du « regard du peuple » et la conviction que les cadres ne peuvent maximiser les intérêts du pays qu'en travaillant sous ce regard."
 xi_jinping_thought: "Pensée de Xi Jinping"
 xi_jinping_thought_desc: "Xi Jinping's contribution to the theoretical basis of the CPC's rule is one that establishes a large number of lofty goals for the party and the country going forward. What sets this particular theory apart from those of most of Xi's predecessors is the extent to which adherence to this ideology is tied to loyalty. Loyalty to the party, loyalty to the country, but also significantly, loyalty to Xi Jinping himself."
 chongqing_model: "Le modèle de Chongqing"
 chongqing_model_desc: "Le modèle de Chongqing est la contribution de Bo Xilai à la doctrine du Parti communiste. Ce modèle comprend un large éventail de politiques sociales et économiques, dont les campagnes « strike black » et « sing red » qui impliquent respectivement la lutte contre le crime organisé et le chant communiste. Le modèle représente également un léger écart par rapport aux politiques chinoises de libéralisation du marché, en mettant l'accent sur la distribution équitable et les entreprises d'État."
 nanjie_model: "Le modèle de Nanjie"
 nanjie_model_desc: "À bien des égards, le modèle de Nanjie est un développement du modèle de Chongqing. Il conserve de nombreux éléments de la théorie originale de Bo mais s'appuie sur l'exemple du village de Nanjie, un bastion du maoïsme qui conserve un système collectiviste. Le modèle Nanjie de Bo appelle la Chine à suivre l'exemple de Nanjie et à abandonner le capitalisme et le marché libre en faveur d'un véritable socialisme."
 open_nation: "Gouvernement réformiste"
 open_nation_desc: "Si l'autoritarisme a bien servi notre pays au cours des dernières décennies, nous devons nous adapter au monde qui nous entoure. Dans un XXIème siècle mondialisé, nous ne pouvons guère faire autrement que de nous ouvrir au reste du monde et de libéraliser notre politique intérieure."
 open_nation_finish: "Gouvernement libéral"
 open_nation_finish_desc: "Nos concitoyens méritent la liberté de s'exprimer, de prendre part au processus politique et de se forger leur propre opinion sur la base de multiples sources d'information."
 censored_nation: "Gouvernement répressif"
 censored_nation_desc: "Bien que nous reconnaissions l'impossibilité pratique de couper complètement notre peuple du reste du monde et de l'endoctriner en masse, nous devons néanmoins contrôler et modérer ce à quoi il est exposé. Notre peuple ne peut pas vraiment être libre dans un système où toute source d'instabilité peut devenir une menace pour sa sécurité en raison d'une approche trop laxiste du discours politique."
 closed_nation: "Gouvernement totalitaire"
 closed_nation_desc: "Afin de préserver la stabilité de la nation et de maintenir notre souveraineté nationale, nous avons complètement restreint l'accès à l'internet et exerçons un contrôle direct sur toutes les autres formes de médias. La dissidence ne peut être tolérée."
 legacy_of_1949: "L'héritage de 1949"
 legacy_of_1949_desc: "La fin de la guerre civile chinoise en 1949 a vu le Kuomintang nationaliste (KMT) et ses partisans fuir vers la province insulaire de Taïwan. L'héritage de cet événement, combiné à un mouvement local nativiste taïwanais, a conduit à un fort rejet de la réunification avec le continent par la majorité des citoyens taïwanais."
 legacy_of_1949_1: "L'héritage de 1949"
 legacy_of_1949_1_desc: "La fin de la guerre civile chinoise en 1949 a vu le Kuomintang nationaliste (KMT) et ses partisans fuir vers la province insulaire de Taïwan. L'héritage de cet événement, combiné à un mouvement local nativiste taïwanais, a conduit à un fort rejet de la réunification avec le continent par la majorité des citoyens taïwanais."
 fate_of_mongolian_area: "Prémonition inquiétante venue du Nord"
 fate_of_mongolian_area_desc: "La région mongole est le nom officiel de la division administrative de la région de la Mongolie extérieure pendant la période continentale de la République de Chine. Lorsque nous avons perdu la Chine continentale, la zone mongole a également été perdue. Aujourd’hui, le gouvernement du continent s’intéresse soudainement à la Mongolie extérieure, ce qui ne semble pas être une bonne chose pour nous."
 fate_of_mongolian_area_1: "Le sort de la zone mongole"
 fate_of_mongolian_area_1_desc: " Unexpectedly, the Mongolian area that we lost was taken back by the Chinese mainland government, so the next goal is self-evident."
 joint_control_zones: "Zone de contrôle partagée du détroit de Taïwan"
 joint_control_zones_desc: "A joint control zone allows China and Taiwan to more effectively patrol the Taiwan Strait and hone the effectiveness of both countries' militaries."
 our_national_enemy: "Notre ennemi historique"
 our_national_enemy_desc: "Les vieilles blessures infligées par les Japonais ne sont pas encore guéries. Leur refus de reconnaître pleinement et de s'excuser pour les crimes qu'ils ont infligés au peuple chinois pendant la guerre sino-japonaise signifie qu'ils resteront, dans un avenir prévisible, un ennemi des successeurs de la Chine communiste et nationaliste."
 old_hatreds: "Vieilles Rancœurs"
 old_hatreds_desc: "La querelle entre la Chine et le Japon qui dure depuis des milliers d'années doit enfin prendre fin."
 ceremony_in_khentii_1: "Cérémonie dans les Khentii"
 ceremony_in_khentii_1_desc: "The victory in Khentii Mountains still inspires us to recapture lost land."
 ceremony_in_khentii_2: "Cérémonie dans les Khentii"
 ceremony_in_khentii_2_desc: "La victoire dans les montagnes de Khentii nous incite toujours à reconquérir les terres perdues."
 prosperity_of_borderland: "Prospérité des frontières"
 prosperity_of_borderland_desc: "L'intérieur du pays et la frontière sont étroitement liés et constituent tous deux une partie indissociable de la Chine."
 chinese_khalkha: "Bouclier De Chine"
 chinese_khalkha_desc: "Le mot Khalkha signifie bouclier en langue mongole, et nous avons repris le puissant bouclier de notre nord."
 jebtsundamba_khutuktu: "Jebtsundamba Khutuktu"
 jebtsundamba_khutuktu_desc: "The Jebtsundamba Khutuktu is a title given to the spiritual head of the Gelug lineage of Tibetan Buddhism in Outer Mongolia region. He would bless us Mongolian people."
 mongolia_rely_to_china: "Mongolia Relies On China"
 mongolia_rely_to_china_desc: "As a landlocked country, our economy is tightly integrated with China."
 island_blockade: "Blocus de l'île"
 CHI_war_preparations: "Préparatifs de guerre"
 taiwanese_coup: "Coup d'État en cours"
 taiwanese_coup_desc: "Des éléments pro-chinois au sein du gouvernement et de l'armée taïwanais tentent actuellement de prendre le contrôle du gouvernement."
 recently_acceded_to_wto: "Adhésion récente à l'Organisation mondiale du commerce"
 recently_acceded_to_wto_desc: "L'adhésion à l'OMC confère une grande variété d'avantages liés au commerce, ce qui donne un élan considérable à l'économie de ce pays."
 CHI_foreign_investment: "Investissement étranger encouragé"
 Socialist_Market_Economy: "Économie socialiste de marché"
 Free_Market_Economy: "Économie de marché libre"
 Planned_Economy: "Économie planifiée"
 factory_of_the_world: "L'usine du monde"
 factory_of_the_world_desc: "L'usine mondiale est une base manufacturière qui fournit des produits industriels à grande échelle pour le marché mondial."
 a_new_leap_forward: "Un nouveau bond en avant"
 a_new_leap_forward_desc: "Se précipiter vers le communisme"
 water_shortages: "Pénurie d'eau"
 water_shortages_desc: "Bien qu'elle possède d'importantes ressources en eau dans le sud du pays, la Chine souffre d'une pénurie d'eau généralisée dans le nord, nettement plus sec. La pollution due à l'industrialisation rapide du pays a également entraîné la contamination de l'eau existante, aggravant ainsi les pénuries d'eau en Chine."
 CHI_solar_power: "Économie basée sur l'énergie solaire"
 CHI_nuclear_power_idea: "Économie basée sur l'énergie nucléaire"
 fusion_power: "Économie basée sur l'énergie de fusion nucléaire"
 CHI_coal: "Économie basée sur le charbon"
 CHI_cepc: "Collisionneur circulaire électron-positron (CCEP)"
 CHI_cepc_desc: "Le CCEP est une grande installation scientifique internationale proposée par la communauté chinoise de physique des particules pour explorer le programme de physique susmentionné. Il a une circonférence de 80 kilomètres (49,70 miles) et pourrait encercler toute l'île de Manhattan."
 CHI_space_marines_idea: "Space Marines"
 CHI_space_marines_idea_desc: ""
 CHI_megacity_development: "Développement des mégapoles"
 CHI_megacity_development_desc: "Les Nations Unies prédisent que la population urbaine mondiale actuelle de 3,2 milliards atteindra 5 milliards en 2030. D'ici 2030, les trois cinquièmes de la population mondiale vivront dans des villes."
 CHI_western_development: "Développement occidental"
 CHI_western_development_desc: "Le développement de l'Ouest est la stratégie globale de développement régional coordonnée du gouvernement central de la République populaire de Chine, qui vise à réduire l'écart de développement économique entre les régions de l'Est et de l'Ouest et à renforcer la force économique globale des régions du centre et de l'Ouest. à travers des préférences politiques et des investissements financiers."
 CHI_new_boundary: "Nouvelle frontière"
 CHI_new_boundary_desc: "In Chinese history books, leaders who obtained new territories will always leave a great mark."
 CHI_mass_production: "Production massive de véhicules"
 CHI_Hyundai_Partnership: "Partenariat avec Hyundai"
 CHI_Volkswagen_Partnership: "Partenariat avec Volkswagen"
 CHI_Toyota_Partnership: "Partenariat avec Toyota"
 CHI_GM_Partnership: "Partenariat avec General Motors"
 Public_Sector_Space_Program: "Programme spatial public"
 Private_Sector_Space_Program: "Programme spatial privé"
 space_combat_support_force: "Force spatiale de soutien au combat"
 space_efforts: "Efforts dans le domaine spatial"
 South_China_Sea_Dispute: "Conflit en mer de Chine méridionale"
 South_China_Sea_Dispute_desc: "Les revendications de la Chine en mer de Chine méridionale chevauchent celles de nombreux pays d'Asie du Sud-Est. Ce chevauchement a entraîné des frictions importantes entre la Chine et des pays comme le Viêt Nam, les Philippines et, dans une moindre mesure, la Malaisie. Les enjeux de ce conflit sont élevés en raison de l'emplacement stratégique d'îles comme les îles Spratly et Paracel et de la présence de pétrole dans la région. La question de la mer de Chine méridionale a considérablement entravé l'amélioration des relations entre la Chine et ses rivaux pour le contrôle des nombreuses îles de la mer."
 Sino_Indian_Tensions: "Tensions sino-indiennes"
 Sino_Indian_Tensions_desc: "En tant que deux puissances économiques et militaires les plus prometteuses d'Asie, l'Inde et la Chine sont des rivaux naturels. Si l'on ajoute à cette prédisposition à la rivalité une histoire de tensions frontalières et le partenariat de la Chine avec le Pakistan, cette rivalité a le potentiel de se transformer en une animosité beaucoup plus importante."
 Workers_Rights: "Droits des travailleurs"
 TV_Internet_Access: "Accès à la TV et à Internet"
 America_in_Decline: "Les États-Unis en déclin"
 America_in_Decline_desc: "Autrefois hégémon mondial incontesté, l'influence des États-Unis à l'étranger est désormais dérisoire par rapport à celle de la nouvelle superpuissance, la Chine. Les États-Unis doivent soit s'accommoder de ce nouvel ordre mondial et se replier sur eux-mêmes, soit contester la nouvelle suprématie de la Chine et maintenir l'ordre mondial centré sur les États-Unis. Ce dernier point peut être atteint soit par la force, soit en soutenant des forces politiques moins révisionnistes en Chine."
 Russia_on_the_Wane: "La Russie en déclin"
 Russia_on_the_Wane_desc: "La Russie ne sait que trop bien ce que c'est que de perdre son statut de grande puissance. Dans les années qui ont suivi la fin de la guerre froide, la nouvelle Fédération de Russie a cherché à retrouver une partie de sa gloire passée. Jusqu'à récemment, la Russie était aidée dans cet objectif par la Chine, le partenariat stratégique des deux pays contribuant à saper l'hégémonie américaine. Toutefois, les aspirations de la Chine en tant que grande puissance ont affaibli la position de la Russie, le géant slave ayant été évincé de sa sphère d'influence en Asie centrale par l'argent chinois. La Russie doit maintenant soit accepter d'être une puissance secondaire, soit chercher à stopper la montée apparemment inexorable de la Chine, soit par la force, soit en soutenant des forces politiques moins révisionnistes en Chine."
 CHI_Peacekeepers: "Missions de maintien de la paix"
 CHI_Peacekeepers_desc: "Notre personnel a été déployé à l'étranger pour participer à des missions de maintien de la paix des Nations unies sur le continent africain, ce qui a permis à nos troupes d'acquérir une expérience indispensable et d'accroître notre crédibilité en tant que membre fiable de la communauté internationale."
 CHI_promoting_innovation: "Promotion de l'innovation"
 CHI_promoting_innovation_desc: "L'innovation est le premier moteur du développement."
 CHI_improving_rd: "Amélioration de la R&D"
 CHI_improving_rd_desc: ""
 CHI_dominant_tech_industry: "Domination technologique chinoise"
 CHI_dominant_tech_industry_desc: "La science et la technologie sont les principales forces productives."
 CHI_idea_high_speed_railway_modifier: "Chinese High Speed Railway"
 CHI_idea_high_speed_railway_modifier_desc: "Le chemin de fer à grande vitesse de la République populaire de Chine constitue actuellement le plus grand réseau ferroviaire à grande vitesse au monde."
 CHI_electric_car_project_idea: "Projet de Voiture Électrique Chinoise"
 CHI_electric_car_project_idea_desc: "Le projet de voiture électrique de la Chine sera un bond en avant dans l'industrie automobile."
 CHI_electric_car_project_idea_1: "Projet de voiture électrique chinois avec l'aide de Xiaomi"
 CHI_electric_car_project_idea_1_desc: "China's electric car project will be a leap forward in the vehicle industry with Xiaomi assistance."
 CHI_bilibili_idea: "Bilibili"
 CHI_bilibili_idea_desc: "Ton oncle, moi, je suis vraiment en colère."
 CHI_studyding_strengthen: "Étudier et renforcer la nation"
 CHI_studyding_strengthen_desc: "Digital version of Quotations from Chairman Mao"
 CHI_string_of_pearls: "Le collier de perles"
 CHI_string_of_pearls_desc: "Le collier de perles est un réseau de bases navales encerclant l'Inde qui nous donnerait un avantage significatif dans un conflit armé avec l'Inde."
 KOR_joint_us_exercises: "Foal Eagle"
 KOR_joint_us_exercises_desc: "Foal Eagle est un exercice d'entraînement annuel mené par les forces armées de la République de Corée et des États-Unis. Ces exercices sont considérés par les deux nations comme des préparatifs défensifs nécessaires en cas d'invasion nord-coréenne, mais le Nord les considère comme le prélude à une action agressive de la part des États-Unis et de la République de Corée."
 Basic_Law_MAC: "La loi fondamentale de la RAS de Macao"
 Basic_Law_MAC_desc: "La Loi fondamentale de la région administrative spéciale de Macao de la République populaire de Chine est le document constitutionnel de Macao, remplaçant l'Estatuto Orgânico de Macau. Conformément à l'article 31 de la Constitution de la République populaire de Chine, Macao a le statut de région administrative spéciale, qui offre des garanties constitutionnelles pour la mise en œuvre de la politique « un pays, deux systèmes » et la base constitutionnelle pour promulguer la Loi fondamentale de Macao. Région administrative spéciale."
 City_Of_Casino: "City Of Casino"
 City_Of_Casino_desc: "A city has casino, or a casino owns a city."
 ASEAN_Member: "Membre de l'ANASE"
 ASEAN_Member_desc: "ASEAN is a primarily economic intergovernmental organisation based in Jakarta that was originally established in 1967. It has since expanded to include those countries that were originally excluded in the tense environment of the Cold War, and has sought to counter the growing influence of China as well as maintain independence from the West. It is committed to the principles of multilateralism, international law, peaceful dispute settlement, non-interference and self-determination."
 socialist_vietnam: "République socialiste du Vietnam"
 socialist_vietnam_desc: "La République socialiste du Vietnam met en œuvre une dictature à parti unique et adhère à la direction du Parti communiste vietnamien."
 lao_vietnan_treaty: "Traité d'amitié et de coopération lao-vietnamien"
 lao_vietnan_treaty_desc: "The treaty signed by the Communist Party of Laos and the Communist Party of Vietnam in Vientiane on July 18, 1977 was an important layout for Vietnam to conceive the establishment of the \"Indochina Federation\" at that time."
 VIE_VPA_Business_Ventures: "Entreprises commerciales APV"
 VIE_VPA_Business_Ventures_desc: "Dans les années 1960 et 1970, l’armée vietnamienne menait des activités commerciales, important principalement de Chine et d’Union soviétique. Après la bataille des Deux Montagnes en 1990, la Chine et le Vietnam ont complètement mis fin à la guerre frontalière, de sorte que le Vietnam a réduit ses dépenses militaires et minimisé ses dépenses. Dans les années 1990, les dépenses militaires du Vietnam ont fortement chuté et le Vietnam a imité les affaires militaires de la Chine, permettant à l'armée de se lancer dans des activités commerciales et d'utiliser l'argent gagné pour rembourser ses dettes et améliorer son équipement militaire et son bien-être."
 dominance_of_the_cpp: "Dominance du RPC"
 dominance_of_the_cpp_desc: "Le Parti populaire cambodgien domine la scène politique cambodgienne depuis la réforme de la constitution cambodgienne.\n"
 finnish_neutrality: "Neutralité finlandaise"
 finnish_neutrality_desc: "La Finlande, bien que protégée dans une certaine mesure par les nations démocratiques occidentales, a soigneusement préservé sa neutralité - principalement pour ne pas insulter les Russes."
 Strategic_city_captured1: "Ville stratégique capturée"
 Strategic_city_captured1_desc: "Nous avons capturé une ville stratégique, ce qui a remonté le moral de nos troupes!"
 western_country: "Fait partie du 1er monde"
