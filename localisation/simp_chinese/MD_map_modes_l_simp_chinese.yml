l_simp_chinese:
 MAPMODE_EU_MAP_MODE_NAME: "欧盟"
 MAPMODE_EU_MAP_MODE: "欧盟"
 MAPMODE_EU_MAP_MODE_DESCRIPTION: "显示欧盟成员国、潜在成员国以及欧盟现任官员所属国。"
 EU_map_mode_tooltip: "欧盟"
 EU_map_mode_tooltip_delayed: "展示欧盟目前的成员国和领导层。\n\n§Y[FROM.CONTROLLER.GetNameWithFlag]§!：§Y[FROM.CONTROLLER.map_mode_EU_status]§!\n\n§Y图例：§!\n§n蓝色§!= 欧盟成员国\n§Y金色§!= 欧盟潜在成员国\n\n§Y官员：§!\n§R红色§! = 欧洲联合会主席，欧洲理事会主席，欧洲议会主席\n§W白色§! = 欧洲联邦主席\n§B靛蓝色§! = 欧洲陆军或欧洲海军秘书长，或欧洲边境管理局执行主任\n§4淡蓝色§! = 欧盟驻联合国高级代表或大使\n§G绿色§! = 欧洲中央银行行长或欧洲经济和财政部长\n\n颜色遵循自动化设置中的§Y地图模式颜色§!选择。\n每周更新"
 MAPMODE_INFLUENCE_MAP_MODE_NAME: "影响力"
 MAPMODE_INFLUENCE_MAP_MODE: "影响力"
 MAPMODE_INFLUENCE_MAP_MODE_DESCRIPTION: "显示您在其他国家的影响力排名。影响力决定外交筹码，并随时间推移影响政治格局。"
 influence_map_mode_tooltip: "影响力"
 influence_map_mode_tooltip_delayed: "显示您拥有影响力的国家、您在影响力人物中的排名以及已设置为自动施加影响力的国家。\n\n影响力决定了你对一个国家的外交影响力。排名越高，对该国的政治立场和外交政策的影响力就越大。\n\n§Y图例：§!\n§Y黄色§! = 你的国家\n§4浅蓝色§! = 第一位影响者(主导)\n§l天蓝色§! = 第二与第三位影响者\n§2蓝色§! = 第四至第七位影响者\n§P品红§! = 自动施加影响的国家 (每月)\n§R红色§! = 扩散影响冷却 (曾经的目标国)\n§g暗灰色§! = 无影响\n\n颜色遵循自动化设置中的§Y地图模式颜色§!选择。\n每周更新"
 MAPMODE_GCC_MAP_MODE_NAME: "海湾合作委员会"
 MAPMODE_GCC_MAP_MODE: "海湾合作委员会"
 MAPMODE_GCC_MAP_MODE_DESCRIPTION: "显示海湾合作委员会的成员国和潜在成员国。"
 GCC_map_mode_tooltip: "海湾合作委员会"
 GCC_map_mode_tooltip_delayed: "显示海湾合作委员会的当前成员国。\n\n§Y[FROM.CONTROLLER.GetNameWithFlag]§!：§Y[FROM.CONTROLLER.map_mode_GCC_status]§!\n\n§Y图例：§!\n§C蓝绿色§! = 海湾合作委员会成员国\n§G黄绿色§! = 海湾合作委员会潜在成员国\n\n每周更新。"
 MAPMODE_SCO_MAP_MODE_NAME: "上海合作组织"
 MAPMODE_SCO_MAP_MODE: "上海合作组织"
 MAPMODE_SCO_MAP_MODE_DESCRIPTION: "显示上海合作组织的成员国、观察员国和潜在成员国。"
 SCO_map_mode_tooltip: "上海合作组织"
 SCO_map_mode_tooltip_delayed: "显示上海合作组织的当前成员国。\n\n§Y[FROM.CONTROLLER.GetNameWithFlag]§!：§Y[FROM.CONTROLLER.map_mode_SCO_status]§!\n\n§Y图例：§!\n§O橙色§! = 上海合作组织成员国\n§0紫色§! = 上海合作组织观察员国\n§4淡蓝色§! = 对话伙伴\n§Y黄色§! = 上海合作组织潜在成员国\n\n每周更新。"
 MAPMODE_GDP_C_MAP_MODE_NAME: "人均GDP"
 MAPMODE_GDP_C_MAP_MODE: "人均GDP"
 MAPMODE_GDP_C_MAP_MODE_DESCRIPTION: "该地图模式显示一个国家的人均GDP，代表人均经济产出。"
 gdp_c_map_mode_tooltip: "[FROM.CONTROLLER.GetNameWithFlag]人均GDP"
 gdp_c_map_mode_tooltip_delayed: "§Y[FROM.CONTROLLER.GetNameWithFlag]§!的人均GDP是：§Y$[?FROM.CONTROLLER:gdp_per_capita|Y]K§!。\n\n人均GDP代表人均经济产出。数值越高，表明经济越富裕、生产力越高。\n\n§Y图例：§!\n§n藏青色§! = 低于8K (低等收入)\n§l深青色§! = 8K - 18K (低中等收入)\n§5蓝绿色§! = 18K - 32K (中等收入)\n§6海绿色§! = 32K - 60K (中上等收入)\n§7淡绿色§! = 60K - 110K (上等收入)\n§W淡黄色§! =高于110K (极其富有)\n\n颜色越亮越富有。\n随每周经济数据浮动更新。"
 MAPMODE_ENERGY_CONSUMPTION_MAP_MODE_NAME: "能耗缺口"
 MAPMODE_ENERGY_CONSUMPTION_MAP_MODE: "能耗缺口"
 MAPMODE_ENERGY_CONSUMPTION_MAP_MODE_DESCRIPTION: "该地图模式显示各国当前未满足能源需求的百分比。"
 energy_consumption_map_mode_tooltip: "[FROM.CONTROLLER.GetNameWithFlag]的能源缺口比率"
 energy_consumption_map_mode_tooltip_delayed: "§Y[FROM.CONTROLLER.GetNameWithFlag]§!的能源缺口比率为：§Y[?FROM.CONTROLLER:unfulfilled_energy_demand_var|%+]§!\n\n这显示了能源需求未得到满足的百分比。负值表示需求超过供应（能源短缺）。\n\n§Y图例：§!\n§n藏青色§! = 低于-30% (严重短缺)\n§l深青色§! = -30%至-18% (中等短缺)\n§5蓝绿色§! = -18%至-12% (轻度短缺)\n§6海绿色§! = -12%至-4% (基本满足)\n§7淡绿色§! = -4%至-1% (几乎满足)\n§W淡黄色§! = 高于-1% (完全满足)\n\n颜色越深情况越糟糕。投资能源生产以改善现状。\n随经济数据浮动每周更新。"
 MAPMODE_PRODUCTIVITY_MAP_MODE_NAME: "生产率"
 MAPMODE_PRODUCTIVITY_MAP_MODE: "生产率"
 MAPMODE_PRODUCTIVITY_MAP_MODE_DESCRIPTION: "该地图模式显示各个省份的当前生产率，代表每位劳动者的经济产出效率。"
 productivity_map_mode_tooltip: "[FROM.GetName]的生产率"
 productivity_map_mode_tooltip_delayed: "§Y[FROM.GetName]§!的生产率为：§Y[?FROM.productivity_state_var|Y]§!\n\n生产率衡量的是一个国家的经济产出效率。生产率越高，意味着每个劳动者的经济产出越多。\n\n§Y图例：§!\n§n藏青色§! = 低于200 (非常低)\n§2蓝色§! = 200 - 500 (低)\n§l深青色§! = 500 - 800 (低于平均值)\n§3钢蓝色§! = 800 - 1200 (平均值)\n§5蓝绿色§! = 1200 - 1900 (高于平均值)\n§6海绿色§! = 1900 - 2800 (高)\n§7淡绿色§! = 3800 - 5000 (非常高)\n§W淡黄色§! = 高于285000 (爆表)\n\n颜色越亮生产率越高。\n随经济数据浮动每周更新。"
 MAPMODE_RENEWABLE_ENERGY_HOTSPOT_MAP_MODE_NAME: "可再生能源热点"
 MAPMODE_RENEWABLE_ENERGY_HOTSPOT_MAP_MODE: "可再生能源热点"
 MAPMODE_RENEWABLE_ENERGY_HOTSPOT_MAP_MODE_DESCRIPTION: "该地图模式根据风能、太阳能和其他地理因素，显示每个省份的自然可再生能源潜力。"
 renewable_energy_hotspot_map_mode_tooltip: "[FROM.GetName]的可再生能源容量系数加成"
 renewable_energy_hotspot_map_mode_tooltip_delayed: "§Y[FROM.GetName]§!的可再生能源容量系数加成为：§Y[?FROM.state_renewable_capacity_factor_modifier_var|Y]§!\n\n这是该省份可再生能源产出公式：§Y1.0§!是世界平均水平，所以一个地区的产量是世界平均水平的1.5倍，一个地区的产量是世界平均水平的0.5倍，世界平均水平的一半。\n\n§Y图例（1.0=世界平均水平）：§!\n§n藏蓝色§!=低于0.6（很低）\n§3深蓝色§!=0.6 - 0.8 （低）\n§l深青色§!=0.8 - 1.0（略低于平均水平）\n§5蓝绿色§!=1.0 - 1.2（高于平均水平）\n§6海绿色§!=1.2 - 1.45（远高于平均水平）\n§7淡绿色§!=1.45 - 1.6（卓越）\n§W淡黄色§!=高于1.6（非凡）\n\n颜色越亮越好。\n该数值是固定的，不会随时间改变。"
 MAPMODE_UNEMPLOYMENT_RATE_MAP_MODE_NAME: "失业率"
 unemployment_rate_map_mode_tooltip: "[FROM.CONTROLLER.GetNameWithFlag]的失业率"
 unemployment_rate_map_mode_tooltip_delayed: "§Y[FROM.CONTROLLER.GetNameWithFlag]§!的失业率为：§Y[?FROM.CONTROLLER:total_unemployed_percentage_display|%Y]§!\n\n这显示了劳动年龄人口中失业人口的百分比。\n\n§Y图例：§!\n§n藏蓝色§! = 高于35% (危机)\n§l淡青色§! = 22% - 35% (非常高)\n§5蓝绿色§! = 10% - 22% (高)\n§6海绿色§! = 5% - 10% (中等)\n§7淡绿色§! = 2% - 5% (低)\n§W淡黄色§! = 低于2% (充分就业)\n\n颜色越深情况越糟糕。通过经济增长和政策降低失业率。\n随经济数据浮动每周更新。"
 MAPMODE_UNEMPLOYMENT_RATE_MAP_MODE: "失业率"
 MAPMODE_UNEMPLOYMENT_RATE_MAP_MODE_DESCRIPTION: "该地图模式显示各国当前的失业率占劳动年龄人口的百分比。"
 MAPMODE_SUBIDEOLOGY_MAP_MODE_NAME: "执政党"
 MAPMODE_SUBIDEOLOGY_MAP_MODE: "执政党"
 MAPMODE_SUBIDEOLOGY_MAP_MODE_DESCRIPTION: "显示各国执政党的子意识形态，鼠标悬停时显示执政党的得票率。"
 subideology_map_mode_tooltip: "[FROM.CONTROLLER.GetNameWithFlag]执政党"
 subideology_map_mode_tooltip_delayed: "§H[FROM.CONTROLLER.GetNameWithFlag]§!\n\n§HR执政党：§![FROM.CONTROLLER.map_mode_ruling_party]\n\n§H政府执政联盟：§![FROM.CONTROLLER.map_mode_coalition_none][FROM.CONTROLLER.L_coal_elect_percent_0][FROM.CONTROLLER.L_coal_elect_percent_1][FROM.CONTROLLER.L_coal_elect_percent_2][FROM.CONTROLLER.L_coal_elect_percent_3][FROM.CONTROLLER.L_coal_elect_percent_4][FROM.CONTROLLER.L_coal_elect_percent_5][FROM.CONTROLLER.L_coal_elect_percent_6][FROM.CONTROLLER.L_coal_elect_percent_7][FROM.CONTROLLER.L_coal_elect_percent_8][FROM.CONTROLLER.L_coal_elect_percent_9][FROM.CONTROLLER.L_coal_elect_percent_10][FROM.CONTROLLER.L_coal_elect_percent_11][FROM.CONTROLLER.L_coal_elect_percent_12][FROM.CONTROLLER.L_coal_elect_percent_13][FROM.CONTROLLER.L_coal_elect_percent_14][FROM.CONTROLLER.L_coal_elect_percent_15][FROM.CONTROLLER.L_coal_elect_percent_16][FROM.CONTROLLER.L_coal_elect_percent_17][FROM.CONTROLLER.L_coal_elect_percent_18][FROM.CONTROLLER.L_coal_elect_percent_19][FROM.CONTROLLER.L_coal_elect_percent_20][FROM.CONTROLLER.L_coal_elect_percent_21][FROM.CONTROLLER.L_coal_elect_percent_22][FROM.CONTROLLER.L_coal_elect_percent_23]\n\n§H政府总体支持：§! §Y[?FROM.CONTROLLER:government_coalition_strength_elect|%1]§!\n\n百分比是各政党在上届选​​举中赢得的选票份额，因此从未举行过选举的国家显示为0.0%。\n\n§Y图例：§!\n每个政党都有自己的专属颜色，经过测试，即使是红绿色盲和蓝黄色盲患者也能轻松辨认。将鼠标悬停在国家名称上即可查看其执政党。\n\n政府更迭时会更新。"
 map_mode_ruling_party_text: "\n[show_ruling_party] ([?party_pop_elect_array^ruling_party|%1])"
 map_mode_coalition_none_text: "\n无（一党制政府）"
 MAPMODE_RESERVE_CURRENCY_MAP_MODE_NAME: "储备货币"
 MAPMODE_RESERVE_CURRENCY_MAP_MODE: "储备货币"
 MAPMODE_RESERVE_CURRENCY_MAP_MODE_DESCRIPTION: "显示各国根据其储备货币政策持有的储备货币。"
 reserve_currency_map_mode_tooltip: "[FROM.CONTROLLER.GetNameWithFlag]的储备货币"
 reserve_currency_map_mode_tooltip_delayed: "§Y[FROM.CONTROLLER.GetNameWithFlag]§!\n\n储备货币：§Y[FROM.CONTROLLER.map_mode_reserve_currency]§!\n\n§Y图例：§!\n§l蓝色§!= 美元\n§n深蓝色§! = 欧元\n§R红色§! = 人民币\n§G深绿色§! = 卢布\n§W白色§! = 日元\n§Y黄色§! = 英镑\n§p粉红色§! = 法郎\n§O橙色§! = 荷兰盾\n§7淡绿色§! = 雷亚尔\n§0紫色§! = 比特币\n§g深灰色§! = 自有货币储备\n\n颜色遵循自动化设置中的§Y地图模式颜色§!选择。\n随每周经济波动更新"
 map_mode_member_state: "成员国"
