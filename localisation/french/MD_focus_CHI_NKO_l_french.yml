l_french:
 CHI_NKO_bilateral_cooperation: "Traité d'amitié sino-nord-coréen"
 CHI_NKO_bilateral_cooperation_desc: "Le traité d'amitié, de coopération et d'assistance mutuelle signé en 1961 entre la RPC et la RPDC demeure le seul traité de défense mutuelle que chacune des deux nations détient. Réaffirmer ses engagements revitalise une relation que Pékin comme Pyongyang ont laissé se refroidir, ouvrant la voie à une coopération structurée dans les domaines économique, militaire et politique."
 CHI_NKO_border_trade_zones: "Zone économique de Hwanggumpyong"
 CHI_NKO_border_trade_zones_desc: "L'île de Hwanggumpyong se trouve dans le Yalou, entre Sinuiju et Dandong. Désignée conjointement comme zone économique spéciale en 2011, le projet a calé en raison de frictions politiques. Relancer l'investissement chinois dans la zone de Hwanggumpyong rétablit le corridor du Yalou comme épine dorsale du commerce bilatéral."
 CHI_NKO_rason_sez: "Port de libre-échange de Rajin-Sŏnbong"
 CHI_NKO_rason_sez_desc: "La zone économique spéciale de Rason, née de la fusion de Rajin et Sonbong, offre à la Chine un rare accès à un port pacifique libre de glace. L'investissement chinois développe le terminal à conteneurs 3 du port de Rajin, l'industrie légère, ainsi que les liaisons routières et ferroviaires reliant la zone à la frontière chinoise à Tumen et Hunchun."
 CHI_NKO_dandong_trade_hub: "Corridor commercial Sinuiju-Dandong"
 CHI_NKO_dandong_trade_hub_desc: "Dandong traite plus de 70 % de toutes les marchandises franchissant la frontière Chine-RPDC. Élargir les infrastructures douanières et d'entreposage de Dandong, avec un dédouanement simplifié au pont de l'Amitié, ancre la ville comme colonne commerciale irremplaçable de la relation bilatérale."
 CHI_NKO_mineral_extraction: "Concessions de minerai de fer de Musan"
 CHI_NKO_mineral_extraction_desc: "La mine de fer à ciel ouvert de Musan, dans la province du Hamgyong du Nord, est l'un des plus grands gisements de fer d'Asie. Des groupes chinois, dont CITIC et la Tonghua Iron and Steel Company, ont signé des contrats d'extraction accordant l'accès en échange de capitaux et d'infrastructures. Les concessions s'étendent à la magnésite du Hamgyong du Sud et à l'anthracite du bassin d'Anju."
 CHI_NKO_fisheries_agreement: "Pacte de pêche en mer de Corée de l’Ouest"
 CHI_NKO_fisheries_agreement_desc: "La Corée du Nord a vendu des licences de pêche annuelles en mer de Corée occidentale à des flottes chinoises opérant dans des eaux dont dépendaient autrefois les pêcheurs coréens. Formaliser cela en un pacte bilatéral offre à Pyongyang des recettes de licences prévisibles tout en donnant aux entreprises de pêche chinoises une couverture légale pour des opérations qui ont à plusieurs reprises suscité les protestations de Séoul et de Tokyo."
 CHI_NKO_yuan_settlement: "Accord de la banque commerciale Koryo"
 CHI_NKO_yuan_settlement_desc: "La Koryo Commercial Bank et la succursale de Dandong de la Bank of China gèrent depuis longtemps les flux financiers informels sous-jacents au commerce bilatéral. Établir des arrangements formels de compensation en yuans élimine l'exposition au dollar qui soumet les négociants nord-coréens aux sanctions secondaires, ancrant plus profondément l'économie de la RPDC dans l'infrastructure financière chinoise."
 CHI_NKO_labor_export: "Programme de détachement de main-d'œuvre du Dongbei"
 CHI_NKO_labor_export_desc: "Le détachement de main-d'œuvre organisé par l'État envoie des dizaines de milliers de travailleurs nord-coréens dans des usines, des chantiers et des restaurants du Liaoning, du Jilin et du Heilongjiang. Les travailleurs sont recrutés par des agences gouvernementales et détachés sous des contrats qui versent la majeure partie des salaires directement à Pyongyang, faisant du programme du Dongbei une source principale de devises pour le régime."
 CHI_NKO_yalu_river_bridge: "Deuxième traversée Sinuiju-Dandong"
 CHI_NKO_yalu_river_bridge_desc: "Le nouveau pont du Yalou, un ouvrage à quatre voies achevé en 2014 aux frais de la Chine, relie directement la zone de développement riveraine de Dandong aux abords de Sinuiju. Bien qu'il soit resté inutilisé pendant des années faute de route de raccordement côté nord-coréen, l'ouverture du passage transforme la capacité de fret du corridor le plus critique de la frontière."
 CHI_NKO_energy_cooperation: "Oléoduc CNPC Dandong"
 CHI_NKO_energy_cooperation_desc: "La China National Petroleum Corporation exploite le seul oléoduc vers la Corée du Nord, allant de Dandong au complexe chimique de Ponghwa près de Sinuiju. La Chine fournit la quasi-totalité du pétrole brut de la RPDC par cette unique artère, donnant à Pékin un levier non dit sur l'économie nord-coréenne. Augmenter le débit et étendre les exportations d'électricité depuis le Liaoning sécurise la base industrielle de la Corée du Nord."
 CHI_NKO_telecom_network: "Déploiement Koryolink 3G"
 CHI_NKO_telecom_network_desc: "Koryolink, le réseau mobile nord-coréen, a été bâti avec des investissements égyptiens d'Orascom, mais ses chaînes d'équipement passent largement par des fournisseurs chinois. Accroître l'implication chinoise via le matériel Huawei et ZTE étend la couverture 3G au-delà de Pyongyang vers les villes provinciales, tandis que des liaisons fibre transfrontalières offrent au gouvernement de la RPDC un backbone haut débit contrôlé mais fonctionnel."
 CHI_NKO_power_grid_link: "Lien avec le réseau hydroélectrique de Supung"
 CHI_NKO_power_grid_link_desc: "La centrale hydroélectrique de Supung sur le Yalou, construite dans les années 1940, alimente depuis lors à la fois le Liaoning et la Corée du Nord. Réhabiliter les infrastructures de transport partagées et formaliser l'accord d'interconnexion des réseaux stabilise l'approvisionnement électrique de Pyongyang et du nord industriel, permettant à la production d'usine de se redresser."
 CHI_NKO_paektu_tourism: "Couloir Paektusan-Changbaishan"
 CHI_NKO_paektu_tourism_desc: "Le mont Paektu, sommet volcanique à cheval sur la province de Ryanggang et le Jilin, est à la fois l'origine sacrée de la mythologie fondatrice de la dynastie Kim et une destination majeure pour les touristes chinois visitant le Changbaishan. Développer une infrastructure touristique intégrée des deux côtés de la frontière capte les dépenses des visiteurs chinois tout en offrant à Pyongyang une fenêtre soigneusement cadrée sur le monde extérieur."
 CHI_NKO_defense_consultations: "Pourparlers d'état-major APL-APC"
 CHI_NKO_defense_consultations_desc: "Des canaux formels entre le département d'état-major général de l'APL et le bureau politique général de l'APC existent depuis la guerre de Corée mais ont souvent cessé. Rétablir des consultations régulières au niveau des vice-chefs crée un forum structuré pour partager les évaluations de menace, coordonner les réponses aux exercices américano-sud-coréens et prévenir les erreurs de calcul le long de la frontière."
 CHI_NKO_military_exchanges: "Programme d'échange de l'Université de défense nationale"
 CHI_NKO_military_exchanges_desc: "L'Université de défense nationale de l'APL à Pékin accueille des officiers de la RPDC pour des cours de commandement supérieur, tandis que les attachés militaires chinois obtiennent en retour un plus grand accès aux installations d'entraînement de l'APC. Le programme forme une génération de commandants nord-coréens familiers de la doctrine et de l'équipement de l'APL, approfondissant l'interopérabilité et des réseaux personnels qui survivent à tout accord politique isolé."
 CHI_NKO_joint_naval_patrols: "Compact de patrouille maritime de la mer Jaune"
 CHI_NKO_joint_naval_patrols_desc: "La flotte de mer du Nord de la marine de l'APL et le commandement naval de l'APC coordonnent les calendriers de patrouille en mer Jaune pour traiter le transbordement illégal, la pêche non autorisée par des flottes tierces et la surveillance des groupes aéronavals américains. Une ligne directe de communication maritime bilatérale réduit le risque d'incidents en mer et établit la Chine comme garant naval de facto de la Corée du Nord."
 CHI_NKO_air_defense_umbrella: "Filet de défense aérienne d'Asie du Nord-Est"
 CHI_NKO_air_defense_umbrella_desc: "Les stations radar de l'armée de l'air de l'APL au Liaoning et au Jilin observent déjà la péninsule coréenne. Relier leurs flux d'alerte précoce aux centres de commandement de l'armée de l'air de l'APC et partager les données de détection transhorizon donne à la Corée du Nord un temps d'alerte effectif contre toute frappe aérienne américaine ou sud-coréenne, sans que Pyongyang doive développer l'infrastructure de manière indépendante."
 CHI_NKO_arms_transfers: "Contrats de fourniture KOMID"
 CHI_NKO_arms_transfers_desc: "La Korea Mining Development Trading Corporation est l'agence principale d'approvisionnement en armements de la RPDC et a historiquement facilité les transferts de technologie depuis les entreprises d'État de défense chinoises. Formaliser des contrats d'approvisionnement pour des composants d'artillerie, des pièces de véhicules blindés et des munitions comble des lacunes critiques de la préparation de l'APC tout en offrant aux firmes de défense chinoises un client d'exportation peu visible."
 CHI_NKO_buffer_state_doctrine: "Doctrine des lèvres et des dents"
 CHI_NKO_buffer_state_doctrine_desc: "L'expression « aussi proches que les lèvres et les dents » décrit la relation Chine-RPDC depuis la guerre de Corée. La codifier en doctrine stratégique formelle reconnaît qu'aucune des deux nations ne peut accepter l'effondrement ou l'alignement étranger de l'autre. Pour Pékin, un tampon nord-coréen empêche les forces américaines et sud-coréennes d'atteindre le Yalou. Pour Pyongyang, le soutien stratégique chinois demeure la garantie ultime de survie du régime."
 CHI_NKO_party_to_party_dialogue: "Accord du Comité central PCC-WPK"
 CHI_NKO_party_to_party_dialogue_desc: "Les relations entre le Parti communiste chinois et le Parti du travail de Corée précèdent les deux États et se sont historiquement menées par des canaux de parti plutôt que diplomatiques. Relancer le cadre de liaison du Comité central donne à Pékin une ligne directe vers le Politburo du PTC qui contourne les formalités d'État à État et permet des discussions sensibles sans trace publique."
 CHI_NKO_cultural_exchanges: "Échange de troupes artistiques Mansudae"
 CHI_NKO_cultural_exchanges_desc: "Le studio d'art Mansudae et ses troupes de spectacle représentent l'expression la plus haute de la culture révolutionnaire de la RPDC. Envoyer des ensembles Mansudae à Pékin et Shanghai tandis que des délégations chinoises de cinéma et d'opéra visitent Pyongyang construit le récit public de solidarité fraternelle et fournit au régime des images de propagande d'audiences chinoises célébrant les réalisations coréennes."
 CHI_NKO_un_coordination: "Accord de bouclier de veto du CSNU"
 CHI_NKO_un_coordination_desc: "Le siège permanent de la Chine au Conseil de sécurité de l'ONU a été à plusieurs reprises utilisé pour diluer ou bloquer des résolutions visant la Corée du Nord. Formaliser la coordination entre diplomates chinois et nord-coréens à l'ONU garantit que les vetos de Pékin sont déployés stratégiquement pour protéger Pyongyang des mesures les plus dures tout en maintenant l'apparence d'un engagement constructif."
 CHI_NKO_un_coordination_tt: "§Y[CHI.GetNameWithFlag]§! vetora chaque suggestion de l'ONU contre §Y[NKO.GetNameWithFlag]§!"
 CHI_NKO_sanctions_circumvention: "Réseau de sociétés écran de Zokwang"
 CHI_NKO_sanctions_circumvention_desc: "Zokwang Trading et un réseau de sociétés écrans affiliées enregistrées à Dandong, Shenyang et Hong Kong font circuler des marchandises sous sanctions, traitent des transferts financiers interdits et facilitent les transbordements de pétrole brut de navire à navire qui soutiennent l'approvisionnement en carburant de la Corée du Nord. Approfondir la tolérance chinoise à cette infrastructure fournit à Pyongyang une bouée de sauvetage indispensable, au prix d'exposer des entités chinoises aux sanctions secondaires américaines."
 CHI_NKO_strategic_partnership: "Partenariat de coopération stratégique"
 CHI_NKO_strategic_partnership_desc: "Élever la relation bilatérale au rang de partenariat de coopération stratégique global, le plus haut palier de la catégorisation diplomatique chinoise, place la RPDC aux côtés de la Russie et du Pakistan dans le cercle intérieur de l'alignement stratégique chinois. La déclaration engage les deux parties à se consulter sur toutes les grandes questions internationales et signale à Washington, Séoul et Tokyo que Pékin considère la sécurité nord-coréenne comme indissociable de la sienne."
 CHI_nko_juche_production: "Production de réserve de masse"
 CHI_nko_juche_production_desc: "Les travailleurs nord-coréens détachés via le programme de main-d'œuvre du Dongbei apportent une discipline industrielle distincte, façonnée par des décennies de doctrine juche d'autosuffisance : la capacité de soutenir une production à fort volume de conceptions simples et éprouvées avec un minimum de frais généraux. Intégrer cette main-d'œuvre au réseau de sous-traitance de NORINCO dans la région de Dandong réduit les coûts unitaires et élargit la capacité des chaînes de production sur toute la gamme d'équipement d'infanterie du bureau."
 NKO_chi_manufacturing_assistance: "Normes de fabrication chinoises"
 NKO_chi_manufacturing_assistance_desc: "L'assistance technique d'entreprises d'État de défense chinoises, principalement des filiales de NORINCO opérant via la Korea Mining Development Trading Corporation, a transféré des tolérances de production normalisées, des procédures de contrôle qualité et des spécifications de composants aux usines d'armes légères du 1er Bureau. Il en résulte moins de rebuts, des performances balistiques plus constantes et des coûts unitaires réduits sur les lignes d'armes individuelles et d'armes d'équipage du bureau."
 CHI_NKO_border_trade_idea: "Zone commerciale de Hwanggumpyong"
 CHI_NKO_energy_supply_idea: "Accord d'approvisionnement en carburant de CNPC"
 CHI_NKO_telecom_idea: "Programme d'infrastructure Koryolink"
 CHI_NKO_telecom_idea_desc: "Une coentreprise élargissant l'infrastructure mobile et de données de Koryolink, reliant les télécommunications nord-coréennes aux réseaux chinois et améliorant les communications transfrontalières."
 CHI_NKO_shared_modifier: "Relation [CHI.GetAdjectiveCap]-[NKO.GetAdjectiveCap]"
 CHI_NKO_shared_modifier_desc: "Suit la profondeur accumulée de la coopération sino-nord-coréenne dans les domaines économique, militaire et politique. Des liens plus forts améliorent la production agricole et industrielle, les relations commerciales, l'efficacité des usines et les exportations de ressources tout en renforçant la planification, l'organisation et la défense aérienne de l'armée ; un alignement plus profond élargit aussi la capacité de renseignement et augmente la puissance politique et le soutien de guerre à mesure que les deux États se coordonnent plus étroitement."
 CHI_eternal_allies: "Alliance juché-communiste"
 CHI_NKO_telecom_network_tt: "[CHI_NKO_telecom_idea_desc]\n"
 CHI_NKO_no_influence_puppet_TT: "Le système d'influence ne peut assujettir §Y[NKO.GetNameWithFlag]§!. La subordination formelle de la Corée du Nord passe plutôt par l'arbre de focus conjoint sino-nord-coréen, aboutissant au règlement de Pékin."
 CHI_NKO_chinese_investments_idea: "Rason Chinese Investment Programme"