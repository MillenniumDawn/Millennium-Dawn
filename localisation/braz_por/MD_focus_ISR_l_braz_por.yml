 israel_economy.215.d: "Israel nos oferece um novo projeto de gasoduto entre nós e Israel. Devemos concordar?"
 israel_economy.215.a: "Onde assino?"
 israel_economy.215.b: "Não."
 israel_economy.216.t: "O Egito concorda!"
