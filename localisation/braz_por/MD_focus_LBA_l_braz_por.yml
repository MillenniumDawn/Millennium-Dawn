 libya_gaddafi_family_exile_muhammad_muammar: "Exilar §Y[ROOT.LBA_muhammad_muammar_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_exile_saif_al_islam: "Exilar §Y[ROOT.LBA_saif_al_islam_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_exile_al_saadi: "Exilar §Y[ROOT.LBA_al_saadi_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_exile_mutassim: "Exilar §Y[ROOT.LBA_mutassim_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_exile_hannibal: "Exilar §Y[ROOT.LBA_hannibal_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_exile_ayesha: "Exilar §Y[ROOT.LBA_ayesha_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_exile_saif_al_arab: "Exilar §Y[ROOT.LBA_saif_al_arab_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_exile_khamis: "Exilar §Y[ROOT.LBA_khamis_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_exile_desc: "Às vezes a interferência de um filho nos assuntos da Líbia pode ser demais. Ele deve ser exilado e mandado embora. Talvez aprenda a se aprimorar passando um tempo longe de casa.\n\n§WEnquanto estiverem no §YExílio§!, os traços de líder dos personagens deixam de afetar nosso país. No entanto, é possível que se tornem amargurados e passem a trabalhar ativamente contra o pai e os irmãos. Um personagem sempre pode ser chamado de volta ao custo de §YInstabilidade§!§!"
 libya_gaddafi_family_recall_muhammad_muammar: "Chamar de volta §Y[ROOT.LBA_muhammad_muammar_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_recall_saif_al_islam: "Chamar de volta §Y[ROOT.LBA_saif_al_islam_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_recall_al_saadi: "Chamar de volta §Y[ROOT.LBA_al_saadi_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_recall_mutassim: "Chamar de volta §Y[ROOT.LBA_mutassim_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_recall_hannibal: "Chamar de volta §Y[ROOT.LBA_hannibal_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_recall_ayesha: "Chamar de volta §Y[ROOT.LBA_ayesha_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_recall_saif_al_arab: "Chamar de volta §Y[ROOT.LBA_saif_al_arab_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_recall_khamis: "Chamar de volta §Y[ROOT.LBA_khamis_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_recall_desc: "Talvez este filho tenha aprendido a lição e esteja pronto para retomar seus deveres pela Líbia.\n\n§WQuando um personagem volta do §YExílio§!, todos os seus traços de líder voltam a ficar ativos!§!"
 libya_gaddafi_family_father_to_son_talk_muhammad_muammar: "Uma Conversa de Pai para Filho com §YMuhammad§!"
 libya_gaddafi_family_father_to_son_talk_muhammad_muammar_desc: "Muhammad nunca se interessou muito por política, apesar de um dia ser o claro sucessor de seu pai. Talvez uma conversa franca com seu pai coloque Muhammad de volta no caminho certo?"
 libya_gaddafi_family_sensor_internet_muhammad_muammar: "Censurar a Internet"
 libya_gaddafi_family_sensor_internet_muhammad_muammar_desc: "Na sua função de presidente da General Posts and Telecommunications Company (GPTC), Muhammad tem o poder de controlar a Internet na Líbia. Podemos bloquear sites prejudiciais e censurar conteúdos noticiosos em favor do nosso regime."
 libya_gaddafi_family_showcase_art_saif_al_islam: "Mostre §YSaif's§! Obra de arte"
 libya_gaddafi_family_showcase_art_saif_al_islam_desc: "Saif al-Islam é um artista talentoso (ou pelo menos um artista). Deveríamos procurar patrocinadores corporativos estrangeiros e organizar uma mostra de arte em algum lugar do Ocidente. Chamaremos-lhe §Y'O Deserto Não é Silencioso'§!, e incluirá imagens tradicionais da cultura Líbia, Islâmica e Árabe."
 saif_al_islam_artshow_great_success_tt: "§GNossos patrocinadores nos proporcionam inovação tecnológica§!"
 saif_al_islam_artshow_success_tt: "§YA vitrine da nossa cultura consolida a nossa posição na política global§!"
 saif_al_islam_artshow_failure_tt: "§REstamos humilhados§!"
 libya_gaddafi_family_discuss_succession_saif_al_islam: "Discuta a sucessão com §YSaif§!"
 libya_gaddafi_family_discuss_succession_saif_al_islam_desc: "Pode ser necessário discutir a ordem de sucessão com Saif. Como Maomé não está muito interessado em política, talvez seja melhor que, com a morte de Gaddafi, Saif seja quem governará o país. Afinal, ele está muito mais interessado em política e é realmente bom nisso."
 saif_al_islam_succession_talk_great_success_tt: "§GSaif ganha §YPensador Geopolítico§!§!"
 saif_al_islam_succession_talk_failure_tt: "§RSaif perde §YMestre das Manobras§!§!"
 libya_gaddafi_family_sue_sunday_telegraph_saif_al_islam: "Sue The Sunday Telegraph"
 libya_gaddafi_family_sue_sunday_telegraph_saif_al_islam_desc: "Em 1995, o jornal britânico The Sunday Telegraph publicou dois artigos alegando que Saif al-Islam estava envolvido num esquema de lavagem de dinheiro no Cairo, com a intenção de inundar o Irão com dinares iranianos falsos. O 2º artigo afirmava que após a publicação do 1º artigo, o autor foi convidado a ir a Trípoli para “conhecer uma fé sinistra”. Ambas as alegações são falsas e devemos processar o jornal por difamação."
 libya_gaddafi_family_improve_football_career_al_saadi: "Impulsionar a Carreira no Futebol de §YAl-Saadi§!"
 libya_gaddafi_family_improve_football_career_al_saadi_desc: "Al-Saadi é o presidente da federação de futebol da Líbia e capitão da seleção nacional de futebol. No entanto, essas posições não foram exatamente alcançadas com habilidade, mas com favores de seu pai. Ele também recebe tratamento especial em todos os jogos que disputa. Talvez se o transferirmos para uma liga de futebol de maior prestígio, como a italiana, ele possa se tornar um verdadeiro jogador de futebol?"
 al_saadi_football_career_great_success_tt: "§GAl-Saadi perde §YEstrela Vaidosa do Futebol§!§!"
 al_saadi_football_career_talk_failure_tt: "§RAl-Saadi ganha §YEstilo de Vida Playboy§!§!"
 libya_gaddafi_family_create_new_city_al_saadi: "Crie uma cidade empresarial"
 libya_gaddafi_family_create_new_city_al_saadi_desc: "Al-Saadi sugeriu a criação de uma cidade voltada para os negócios no oeste da Líbia. Esta nova cidade funcionaria de forma semelhante a Hong Kong na China e estaria localizada entre Trípoli e a fronteira com a Tunísia. A cidade estará aberta a todos os investidores estrangeiros, com foco principal no setor de tecnologia. A cidade terá aeroporto e porto próprios para facilitar o acesso ao mundo. Com uma administração independente, a cidade acolheria pessoas de todo o mundo, permitindo até a construção de sinagogas e igrejas. Deveríamos tentar buscar investidores e empresas de desenvolvimento para participarem deste projeto. Embora nada de tangível aconteça durante anos, isto pode ser um impulso fácil para o nosso país."
 libya_gaddafi_family_send_to_rehab_al_saadi: "Enviar §YAl-Saadi§! para a Reabilitação"
 libya_gaddafi_family_send_to_rehab_al_saadi_desc: "A dependência de drogas de Al-Saadi foi longe demais. Ele precisa ser enviado para a reabilitação, para seu próprio bem."
 al_saadi_rehab_great_success_tt: "§GAl-Saadi perde §YDependente Químico§!§!"
 al_saadi_rehab_failure_tt: "§RAl-Saadi escapa da Líbia§!"
 libya_gaddafi_family_national_security_advisor_mutassim: "Tornar §YMutassim§! o Conselheiro de Segurança Nacional"
 libya_gaddafi_family_national_security_advisor_mutassim_desc: "Mutassim provou agora a sua lealdade ao Estado. Como compensação pelo seu exílio anterior, deveríamos conceder-lhe o papel de Conselheiro de Segurança Nacional."
 mutassim_gaddafi_not_revolutionary_tt: "§Y[ROOT.LBA_mutassim_gaddafi_dummy.GetName]§! não tem o traço §YSuspeito de Ser Revolucionário§!"
 libya_gaddafi_family_additional_equipment_mutassim: "Autorizar §YMutassim§! a Comprar Novas Armas"
 libya_gaddafi_family_additional_equipment_mutassim_desc: "Na sua posição de Conselheiro de Segurança Nacional, é responsabilidade de Mutassim garantir que os militares estejam bem equipados. Devíamos pedir-lhe que comprasse equipamento adicional para o exército."
 mutassim_gaddafi_national_security_advisor_tt: "§Y[ROOT.LBA_mutassim_gaddafi_dummy.GetName]§! tem o traço §YConselheiro de Segurança Nacional§!"
 libya_gaddafi_family_civilian_education_hannibal: "Mandar §YHannibal§! Concluir o Curso"
 libya_gaddafi_family_civilian_education_hannibal_desc: "Hannibal formou-se como Bacharel em Navegação Marinha pela Academia de Estudos Marítimos da Líbia. Deveríamos mandá-lo terminar os estudos e fazer um mestrado. A Copenhagen Business School está oferecendo cursos de Economia e Logística de Navegação, o que parece um bom lugar para refinar as habilidades de Hannibal."
 hannibal_gaddafi_is_bachelor: "§Y[ROOT.LBA_hannibal_gaddafi_dummy.GetName]§! tem o traço §YBacharel em Navegação Marítima§!"
 libya_gaddafi_family_military_education_hannibal: "Enviar §YHannibal§! à Academia Naval Kuznetsov"
 libya_gaddafi_family_military_education_hannibal_desc: "Hannibal formou-se como Bacharel em Navegação Marinha pela Academia de Estudos Marítimos da Líbia. Em vez de prosseguir com uma educação civil, Aníbal deveria finalizar sua educação marítima na Academia Naval Kuznetsov em [SOV.GetNameDef]. Isto deveria dar-lhe mais experiência em assuntos navais."
 libya_gaddafi_family_send_legal_aid_ayesha: "Enviar §YAyesha§! para Prestar Assistência Jurídica"
 libya_gaddafi_family_send_legal_aid_ayesha_desc: "Ayesha estudou direito na Universidade de Paris 1 Panthéon-Sorbonne e é uma excelente advogada. Existem muitos grandes estadistas no mundo que são injustamente pressionados e assediados pela comunidade internacional por alegados “crimes contra a humanidade” e “crimes de guerra”. Devíamos enviar Ayesha com a sua equipa para prestar assistência jurídica a estes pobres servos dos seus povos."
 libya_gaddafi_family_military_training_aid_ayesha: "Concluir o Treinamento Militar de §YAyesha§!"
 libya_gaddafi_family_military_training_aid_ayesha_desc: "Ayesha serviu no exército líbio e alcançou o posto de tenente-coronel. Deveríamos enviá-la para treinamento adicional de oficial e torná-la general. Talvez possamos desbloquear o seu potencial oculto desta forma."
 ayesha_gaddafi_military_education_great_success_tt: "§GAyesha Gaddafi ganha §YAmazona da Líbia§!§!"
 ayesha_gaddafi_military_education_failure_tt: "§RAyesha Gaddafi ganha §YGeneral Inexperiente§!§!"
 libya_gaddafi_family_business_trip_saif_al_arab: "Enviar §YSaif al-Arab§! em Viagem de Negócios"
 libya_gaddafi_family_business_trip_saif_al_arab_desc: "Saif visita frequentemente a Alemanha. Isto o torna perfeito para realizar negócios com empresas europeias. Podemos aprender maneiras de melhorar nossa economia e eficiência."
 libya_gaddafi_family_tech_seminar_saif_al_arab: "Enviar §YSaif al-Arab§! a um Seminário de Tecnologia"
 libya_gaddafi_family_tech_seminar_saif_al_arab_desc: "Saif visita frequentemente a Alemanha. A Alemanha é o lar de muitas empresas industriais que estão na vanguarda da tecnologia e há seminários e exposições anuais no país. Deveríamos enviar Saif a um desses seminários para coletar as últimas inovações tecnológicas."
 libya_gaddafi_family_military_expo_saif_al_arab: "Enviar §YSaif al-Arab§! a uma Exposição Militar"
 libya_gaddafi_family_military_expo_saif_al_arab_desc: "Saif visita frequentemente a Alemanha. A Alemanha tem muitos fabricantes de armas famosos, como Rheinmetall e Heckler & Koch. Devíamos enviar Saif a uma exposição militar para ver o que estes gigantes militares têm para oferecer."
 libya_gaddafi_family_give_military_command_khamis: "Dar um Comando Militar a §YKhamis§!"
 libya_gaddafi_family_give_military_command_khamis_desc: "Khamis recebeu treinamento militar na Líbia e na Academia Militar Frunze, na Rússia. Agora que ele atingiu a maioridade, deveríamos conceder-lhe um lugar como um dos nossos comandantes militares."
 khamis_military_command_great_success_tt: "§GKhamis se torna um grande §YGeneral§!§!"
 khamis_military_command_success_tt: "§YKhamis se torna um §YGeneral§! medíocre§!"
 khamis_military_command_failure_tt: "§RKhamis se torna um §YGeneral§! péssimo§!"
 libya_gaddafi_family_khamis_brigade_khamis: "Forme a Brigada Khamis"
 libya_gaddafi_family_khamis_brigade_khamis_desc: "Devíamos criar uma unidade especial para Khamis comandar. Ele é o mais leal dos filhos de Kadhafi e a sua unidade especial será importante para a defesa do Estado."
 khamis_mutassim_rivalry_tt: "§RComo §YMutassim Gaddafi§! tem o traço §Y77º Batalhão de Tanques§!, a rivalidade crescente entre os irmãos causará §R+15§! de Instabilidade adicional§!\n"
 libya_gaddafi_family_khamis_brigade_khamis_tt: "Uma unidade de §YBrigada Reforçada do Povo Armado§! é criada"
 libya_gaddafi_family_aecom_khamis: "Enviar §YKhamis§! à Escola de Negócios"
 libya_gaddafi_family_aecom_khamis_desc: "Embora Khamis esteja interessado principalmente em assuntos militares, é importante que ele também receba educação civil. Devíamos mandá-lo para a IE Business School em Madrid. Há também vagas para estágio na AECOM Technology Corporation, onde Khamis poderá continuar. AECOM é especializada em infra-estruturas, incluindo infra-estruturas militares de instalações militares."
 libya_gaddafi_family_hold_un_speech_gaddafi: "Faça um discurso na ONU"
 libya_gaddafi_family_hold_un_speech_gaddafi_desc: "Agora que voltamos a fazer parte da comunidade internacional, precisamos de tomar a palavra na Assembleia Geral da ONU. Devemos fazer um discurso repreendendo os americanos e o que eles fizeram ao Médio Oriente. Devemos anunciar a nossa objecção ao sionismo de Israel. Devemos ridicularizar o Ocidente pela forma como nos ridicularizaram. Hoje é o dia em que a Líbia está no centro das atenções!"
 libya_gaddafi_family_throw_money_gaddafi: "Jogue dinheiro nas ruas"
 libya_gaddafi_family_throw_money_gaddafi_desc: "Muitas organizações de ajuda e instituições de caridade operam na Líbia. No entanto, nada mais são do que espiões que tentam controlar a Líbia. Além disso, todo o dinheiro que eles distribuem não vale nada. A caridade não motiva as pessoas a trabalhar. Devíamos provar o nosso ponto de vista viajando por Trípoli num comboio, atirando dinheiro para as ruas. Lá é tão útil quanto distribuído por instituições de caridade."
 libya_gaddafi_family_design_car_gaddafi: "Projete um carro"
 libya_gaddafi_family_design_car_gaddafi_desc: "Muammar Gaddafi está cheio de grandes ideias. A Líbia sofre actualmente de uma elevada taxa de mortalidade no trânsito. Devemos criar um novo design para um carro. Este carro será o carro mais seguro do mundo."
 libya_gaddafi_family_design_car_gaddafi_tt: "Ganharemos um §YEspírito Nacional§! à nossa escolha para modificar nossos §YVeículos Utilitários§! por §Y360§! dia(s)"
 libya_gaddafi_family_state_visit_gaddafi: "Organize uma visita de estado"
 libya_gaddafi_family_state_visit_gaddafi_desc: "Para melhorar a posição da Líbia no mundo, precisamos de fazer uma visita oficial de Estado a um país importante. Faremos disso um verdadeiro espetáculo e mostraremos aos locais que a Líbia é uma grande potência."
 libya_gaddafi_family_do_black_magic_gaddafi: "Envolva-se na magia negra"
 libya_gaddafi_family_do_black_magic_gaddafi_desc: "A Líbia está sob ataque e nós, o nosso regime, estamos em perigo. Nos tempos antigos, grandes reis e chefes de África usavam magia negra para amaldiçoar os seus inimigos e dar às suas tropas o vigor para continuarem a lutar. Devemos fazer o mesmo para o bem da nossa sobrevivência."
 libya_gaddafi_family_meet_women_gaddafi: "Conheça mulheres"
 libya_gaddafi_family_meet_women_gaddafi_desc: "As mulheres da Europa são oprimidas pelo Cristianismo. No Ocidente, as mulheres nada mais são do que móveis para os homens, que podem ser trocadas quando lhes agrada. Devemos organizar uma palestra para as mulheres para educá-las sobre o Islão e fazê-las ver Kadafi como o grande emancipador das mulheres."
 libya_gaddafi_family_hold_tv_speech_gaddafi: "Faça um discurso na televisão"
 libya_gaddafi_family_hold_tv_speech_gaddafi_desc: "Gaddafi realiza regularmente discursos na televisão onde responde diretamente a perguntas dos cidadãos da Líbia, atualiza-os sobre as últimas questões políticas e elogia a intromissão das superpotências. Fazer um discurso é uma ótima maneira de colocar as pessoas do lado de Gaddafi."
 libya_gaddafi_family_abolish_switzerland_gaddafi: "Apelo ao desmantelamento da Suíça"
 libya_gaddafi_family_abolish_switzerland_gaddafi_desc: "Por que a Suíça existe? Nada mais é do que um estado artificial criado por Napoleão ou algum outro colonizador europeu. Os suíços não são pessoas reais, são italianos, alemães ou franceses. Todo o país deveria ser desmantelado."
 libya_gaddafi_family_abolish_switzerland_gaddafi_tt: "Se aceitarem, receberão uma §YReivindicação§! sobre um estado suíço e ganharemos influência sobre eles. Se forem §YNacionalistas§!, é mais provável que aceitem\n\n"
 libya_gaddafi_family_anti_government_protests: "Protestos anti-Gaddafi"
 libya_gaddafi_family_anti_government_protests_desc: "O povo está farto da família governante Gaddafi. As más condições de vida, a má economia e as liberdades políticas limitadas levaram as pessoas às ruas. Se a situação não melhorar rapidamente, ou se Kadhafi abandonar o poder, haverá uma revolta aberta contra o regime."
 libya_gaddafi_family_anti_government_protests_join_rebels_tt: "§RO maior partido da oposição assumirá o poder. Os apoiantes de Gaddafi iniciarão uma guerra civil contra nós!§!"
 libya_gaddafi_family_deploy_military: "Implantar o Corpo da Guarda Revolucionária"
 libya_gaddafi_family_deploy_military_desc: "Devemos mobilizar o Corpo da Guarda Revolucionária para lidar com os manifestantes. Precisamos extinguir as chamas da revolução desde o início."
 libya_gaddafi_family_deploy_military_tt: "§RSe os protestos levarem a uma guerra civil, os rebeldes serão mais fortes! Usar a força contra os manifestantes pode levar a uma intervenção estrangeira!§!"
 muhammad_muammar_gaddafi_not_exiled: "§Y[ROOT.LBA_muhammad_muammar_gaddafi_dummy.GetName]§! não está §YExilado§!"
 saif_al_islam_gaddafi_not_exiled: "§Y[ROOT.LBA_saif_al_islam_gaddafi_dummy.GetName]§! não está §YExilado§!"
 al_saadi_gaddafi_not_exiled: "§Y[ROOT.LBA_al_saadi_gaddafi_dummy.GetName]§! não está §YExilado§!"
 mutassim_gaddafi_not_exiled: "§Y[ROOT.LBA_mutassim_gaddafi_dummy.GetName]§! não está §YExilado§!"
 hannibal_gaddafi_not_exiled: "§Y[ROOT.LBA_hannibal_gaddafi_dummy.GetName]§! não está §YExilado§!"
 ayesha_gaddafi_not_exiled: "§Y[ROOT.LBA_ayesha_gaddafi_dummy.GetName]§! não está §YExilada§!"
 saif_al_arab_gaddafi_not_exiled: "§Y[ROOT.LBA_saif_al_arab_gaddafi_dummy.GetName]§! não está §YExilado§!"
 khamis_gaddafi_not_exiled: "§Y[ROOT.LBA_khamis_gaddafi_dummy.GetName]§! não está §YExilado§!"
 khamis_gaddafi_not_underage: "§Y[ROOT.LBA_khamis_gaddafi_dummy.GetName]§! não tem o traço §YMenor de Idade§!"
 libya_libyan_tribalism: "Tribalismo Líbio"
 libya_libyan_tribalism_desc: "A Líbia é tradicionalmente dividida em três regiões: a Tripolitânia, no noroeste, em torno da capital; a Cirenaica, no leste; e o Fezzan, no sul. Historicamente, essas áreas se governaram sozinhas e só foram unidas pela colonização italiana. Embora tanto o Reino da Líbia quanto o regime de Muammar Gaddafi tenham em grande parte eliminado a filiação tribal, ainda há muitas pessoas na Líbia que se identificam com sua tribo antes da nação.\n\nO nível de lealdade de uma região define quais modificadores de estado ela recebe. Se o valor de lealdade cair demais, a região se revoltará. Se uma das regiões se revoltar e for anexada de volta à Líbia, não poderá organizar outra revolta a menos que tenha sido totalmente pacificada. No entanto, os estados continuarão sendo afetados pelos modificadores de estado."
 LBA_tribalism_disabled_tt: "§Y$libya_libyan_tribalism$§!mecânico foi desativado"
 libya_tribalism_decentralise_state: "Descentralizar o poder"
 libya_tribalism_decentralise_state_desc: "A forma mais eficaz de agradar a todas as tribos líbias é simplesmente reduzir o poder do governo central. O aumento da autonomia, mesmo que seja apenas por um tempo limitado, fará com que os líderes tribais tenham algum poder."
 libya_tribalism_placate_tripolitanians: "Aplacar [TRP.GetNameWithFlag]"
 libya_tribalism_placate_tripolitanians_desc: "Concessões de terras, benefícios monetários, postos militares e cargos governamentais são formas fundamentais de manter os separatistas locais alinhados com o Estado central. Desde que compreendam que permanecer parte da Líbia traz mais benefícios do que desvantagens, tudo estará bem."
 libya_tribalism_placate_cyrenaicans: "Aplacar [CYR.GetNameWithFlag]"
 libya_tribalism_placate_cyrenaicans_desc: "Concessões de terras, benefícios monetários, postos militares e cargos governamentais são formas fundamentais de manter os separatistas locais alinhados com o Estado central. Desde que compreendam que permanecer parte da Líbia traz mais benefícios do que desvantagens, tudo estará bem."
 libya_tribalism_placate_fezzans: "Aplacar [FEZ.GetNameWithFlag]"
 libya_tribalism_placate_fezzans_desc: "Concessões de terras, benefícios monetários, postos militares e cargos governamentais são formas fundamentais de manter os separatistas locais alinhados com o Estado central. Desde que compreendam que permanecer parte da Líbia traz mais benefícios do que desvantagens, tudo estará bem."
 libya_tribalism_tripolitanian_revolt: "[TRP.GetFlag][TRP.GetAdjective]Revolta"
 libya_tribalism_tripolitanian_revolt_desc: "Há movimento dentro das tribos da Tripolitânia. Se os maus-tratos por parte do Estado central continuarem, eles prometeram separar-se da Líbia."
 TT_tripolitania_loyalty_more_than_10: "Lealdade de [TRP.GetNameWithFlag] > 10%"
 TT_tripolitania_loyalty_more_than_30: "Lealdade de [TRP.GetNameWithFlag] > 30%"
 libya_tribalism_cyrenaica_revolt: "[CYR.GetFlag][CYR.GetAdjective]Revolta"
 libya_tribalism_cyrenaica_revolt_desc: "Há movimento dentro das tribos da Cirenaica. Se os maus-tratos por parte do Estado central continuarem, eles prometeram separar-se da Líbia."
 TT_cyrenaica_loyalty_more_than_10: "Lealdade de [CYR.GetNameWithFlag] > 10%"
 TT_cyrenaica_loyalty_more_than_30: "Lealdade de [CYR.GetNameWithFlag] > 30%"
 libya_tribalism_fezzan_revolt: "[FEZ.GetFlag][FEZ.GetAdjective]Revolta"
 libya_tribalism_fezzan_revolt_desc: "Há movimento dentro das tribos de Fezzan. Se os maus-tratos por parte do Estado central continuarem, eles prometeram separar-se da Líbia."
 TT_fezzan_loyalty_more_than_10: "Lealdade de [FEZ.GetNameWithFlag] > 10%"
 TT_fezzan_loyalty_more_than_30: "Lealdade de [FEZ.GetNameWithFlag] > 30%"
 libya_tribalism_dismantle_libya: "Desmantelar a Líbia"
 libya_tribalism_dismantle_libya_desc: "A Líbia desmoronou. Perdemos duas das nossas três regiões principais. Existe alguma razão para continuarmos a chamar-nos Líbia quando não somos mais do que uma sombra do nosso antigo eu?"
 libya_libyan_foreign_policy: "Política Externa da Líbia"
 libya_core_northern_chad: "Integrar o Norte do Chade"
 libya_core_northern_chad_desc: "O norte do Chade é pouco povoado e carece de recursos. Além disso, grande parte da sua população faz parte dos Toubou, que também vivem no sul da Líbia. Isso torna relativamente fácil pacificar a região."
 libya_core_northern_niger: "Integrar o Norte do Níger"
 libya_core_northern_niger_desc: "Embora seja uma região muito pobre, o Norte do Níger tem mais população do que toda a Líbia. Embora uma religião comum ajude, ainda assim será um esforço considerável para colocar a área sob controlo total."
 libya_core_algerian_sahara: "Integrar o Saara Argelino"
 libya_core_algerian_sahara_desc: "A parte argelina do Saara é escassamente povoada e composta principalmente por pastores. Muitos deles já simpatizam com os insurgentes islâmicos da guerra civil. Pacificar a região não deverá demorar muito."
 libya_core_northern_mali: "Integrar Azawad"
 libya_core_northern_mali_desc: "Embora Azawad tivesse uma insurgência islâmica a nosso favor, a região tem uma longa história de separatismo e uma forte identidade tuaregue. A região será muito difícil de integrar."
 libya_core_mauritanian_sahara: "Integrar o Sahel da Mauritânia"
 libya_core_mauritanian_sahara_desc: "A população mauritana é muito resistente aos nossos esforços de integração. Eles não têm simpatia pela nossa ideologia, nem partilham muitos laços religiosos ou culturais. Mas eles se submeterão como todos os outros."
 libya_core_palestine: "Integrar a Palestina"
 libya_core_palestine_desc: "A Palestina é muito populosa em comparação com a Líbia e acolhe uma população mista de muçulmanos palestinianos e judeus israelitas. Será muito difícil e caro integrar a área."
 libya_pacify_cyrenaica: "Pacificar [CYR.GetNameWithFlag]"
 libya_pacify_cyrenaica_desc: "A parte oriental da Líbia rebelou-se e nós esmagamos a sua pequena rebelião. Espera-se alguma resistência contínua, mas não deverá demorar muito até que tenhamos novamente o controlo total da região."
 libya_pacify_tripolitania: "Pacificar [TRP.GetNameWithFlag]"
 libya_pacify_tripolitania_desc: "A parte ocidental da Líbia rebelou-se e nós esmagamos a sua pequena rebelião. Espera-se alguma resistência contínua, mas não deverá demorar muito até que tenhamos novamente o controlo total da região."
 libya_pacify_fezzan: "Pacificar [FEZ.GetNameWithFlag]"
 libya_pacify_fezzan_desc: "A parte sul da Líbia rebelou-se e nós esmagamos a sua pequena rebelião. Espera-se alguma resistência contínua, mas não deverá demorar muito até que tenhamos novamente o controlo total da região."
 libya_pacify_tuaregs: "Pacificar [918.GetName]"
 libya_pacify_tuaregs_desc: "Os tuaregues de [918.GetName] devem ser ensinados a respeitar nosso governo novamente."
 libya_pacify_toubou: "Pacificar o Toubou"
 libya_pacify_toubou_desc: "O povo Toubou deveria voltar a ficar sob o controlo da Líbia."
 libya_liberate_minorities: "Liberte as minorias em [FROM.GetNameDef]"
 libya_liberate_minorities_desc: "A situação atual das minorias étnicas em [FROM.GetNameDef] é insuportável. Devemos exigir mais autonomia para estas pessoas oprimidas."
 libya_liberate_minorities_tt: "Se [FROM.GetName] aceitar nossas demandas, então\n"
 libya_launch_oef: "Iniciar operação [FROM.GetAdjective] Shield"
 libya_launch_oef_desc: "O extremismo está criando raízes em [FROM.GetNameDef], e o governo [FROM.GetAdjective] é completamente impotente ou não quer pará-lo. Precisamos agir rapidamente antes que essa doença se espalhe para a Líbia também."
 libya_build_rail_to_tunisia: "Conecte a ferrovia a [TUN.GetNameWithFlag]"
 libya_build_rail_to_tunisia_desc: "A Tunísia, a oeste, é um país muito estável e um hotspot do turismo europeu. Se nos conectarmos por trem até lá, talvez alguns turistas tenham maior probabilidade de nos visitar também."
 libya_build_rail_to_tunisia_tt: "O custo deste projeto será de $§Y4,00§!.\n"
 libya_build_rail_to_tunisia_tt_2: "§RO custo será dobrado porque temos o espírito nacional §Y$LBA_libyan_gauge_railroads$§!§!\n"
 libya_build_rail_to_egypt: "Conecte a ferrovia a [EGY.GetNameWithFlag]"
 libya_build_rail_to_egypt_desc: "Durante a Segunda Guerra Mundial, os Aliados construíram uma ferrovia temporária de Sollum, no Egito, até Tobruk. O lado líbio da ferrovia, entretanto, foi desmantelado após a independência da Líbia. Deveríamos conectar Tobruk novamente a Sollum para facilitar o acesso ao canal de Suez."
 libya_build_rail_to_egypt_tt: "O custo deste projeto será de $§Y2,00§!.\n"
 libya_build_rail_to_niger: "Conecte a ferrovia a [NGR.GetNameWithFlag]"
 libya_build_rail_to_niger_desc: "O Níger não possui ferrovias existentes. Isso os torna muito isolados do mundo. Se construirmos ali uma ferrovia, poderemos aproximá-la da nossa esfera de influência."
 libya_build_rail_to_niger_tt: "O custo deste projeto será de $§Y7,00§!.\n"
 libya_build_rail_to_chad: "Conecte a ferrovia a [CHA.GetNameWithFlag]"
 libya_build_rail_to_chad_desc: "O Chade não tem ferrovias. Deveríamos construir uma ferrovia até sua capital para torná-los mais dependentes de nós. No entanto, considerando a história do Chade connosco, é pouco provável que concordem com o acordo."
 libya_build_rail_to_chad_tt: "O custo deste projeto será de $§Y6,00§!.\n"
 libya_negotiations_with_un: "Negociações em andamento com a ONU"
 libya_negotiations_with_un_desc: "Devido às nossas atividades hostis, a comunidade internacional impôs-nos sanções. Temos de negociar com a ONU para chegar a uma conclusão sobre o que precisamos de fazer para nos livrarmos dessas sanções. Quanto melhor nos comportarmos no âmbito internacional, mais rápido será o processo."
 libya_negotiations_with_un_tt: "Poderemos iniciar o foco §Y$LBA_remove_sanctions$§!"
 libya_casablanca_accords: "Acordos de Casablanca"
 libya_casablanca_accords_desc: "Estamos em processo de negociação para uma paz duradoura no Sahara Ocidental. Precisamos de convencer todos os países participantes de que a nossa solução funcionará. Mesmo que não consigamos convencer todos os países, a maioria dos países pode tentar impor a solução ao lado oposto. Isto, no entanto, pode levar a uma escalada do conflito."
 libya_casablanca_accords_success_tt: "Todas as delegações assinaram o plano de paz(Atual [?libya_casablanca_accords_no_of_signatories] de [?libya_casablanca_accords_no_of_participants])"
 libya_casablanca_accords_fail_tt: "O número de delegações é inferior a 2 (Atual: [?libya_casablanca_accords_no_of_participants])"
 libya_casablanca_accords_SHA_resistance_tt: "§R[SHA.GetNameWithFlag] resistirá a esta decisão!§!"
 libya_casablanca_accords_MOR_resistance_tt: "§R[MOR.GetNameWithFlag] resistirá a essa decisão!§!"
 libya_casablanca_accords_draft_solution: "Esboçar uma solução de paz para o Sahara Ocidental"
 casablanca_accords_convince_x_tt: "Fizemos §Y$libya_casablanca_accords_draft_solution$§!"
 libya_casablanca_accords_hold_negotiations: "Manter negociações"
 libya_casablanca_accords_hold_negotiations_tt: "Isso atualizará as probabilidades de outros participantes aceitarem nossa solução."
 libya_casablanca_accords_at_least_one_neg_tt: "Fizemos §Y$libya_casablanca_accords_hold_negotiations$§! pelo menos uma vez"
 libya_casablanca_accords_convince_accept_tt: "eles §GAceitando§! a solução"
 libya_casablanca_accords_convince_reject_tt: "eles §RRejeitando§! a solução"
 libya_casablanca_accords_convince_target_tt: "Sua §Yprobabilidade§! de aceitar se baseia em sua posição inicial. Ela é então somada à nossa §YInfluência§! sobre eles. O resultado é multiplicado por sua §YOpinião e Perspectiva§!.\n\nSe rejeitarem a solução, esta decisão ficará disponível novamente após §Y30 dias§!. Cada vez que rejeitarem a solução, há uma chance de que abandonem a conferência\n"
 libya_casablanca_accords_convince_morocco: "Convencer [MOR.GetNameWithFlag]"
 libya_casablanca_accords_convince_morocco_desc: "Converse com os delegados do [MOR.GetAdjective] sobre se eles aceitarão nosso acordo atual."
 libya_casablanca_accords_convince_sahrawi: "Convencer [SHA.GetNameWithFlag]"
 libya_casablanca_accords_convince_sahrawi_desc: "Converse com os delegados do [SHA.GetAdjective] sobre se eles aceitarão nosso acordo atual."
 libya_casablanca_accords_convince_algeria: "Convencer [ALG.GetNameWithFlag]"
 libya_casablanca_accords_convince_algeria_desc: "Converse com os delegados do [ALG.GetAdjective] sobre se eles aceitarão nosso acordo atual."
 libya_casablanca_accords_convince_mauritania: "Convencer [MAU.GetNameWithFlag]"
 libya_casablanca_accords_convince_mauritania_desc: "Converse com os delegados do [MAU.GetAdjective] sobre se eles aceitarão nosso acordo atual."
 libya_anti_colonial_start_revolution: "Preparar Revolução em [FROM.GetNameWithFlag]"
 libya_anti_colonial_start_revolution_desc: "O governo decadente de [FROM.GetNameDef] oprime seu povo. Eles não são nada além de um cachorrinho de colo para o Ocidente e devem ser derrubados em nome da liberdade e da liberdade."
 libya_anti_colonial_start_revolution_tt_1: "§R[FROM.GetNameWithFlag] pode declarar guerra contra nós preventivamente!§!\n"
 libya_anti_colonial_start_revolution_tt_2: "§GO lado revoltado se juntará à nossa facção!§!"
 libya_oil_nationalisation_dynamic_modifier: "Nacionalização do Petróleo"
 TT_libya_oil_nationalisation_dynamic_modifier: "Nível de nacionalização:§Y[?lba_oil_nationalisation|%0]§!\nRenda adicional: $$[?oil_nationalisation_income|+3] bilhões por §YOpetróleo extraído§!\n"
 libya_oil_nationalisation_dynamic_modifier_desc: "Grande parte da produção de petróleo na Líbia é controlada pela National Oil Corporation. Embora benéficos para o Estado, os investimentos internacionais de empresas estrangeiras são limitados. Um nível mais elevado de nacionalização prejudicará o nosso crescimento da produtividade e tornará mais caro o desenvolvimento de novos campos petrolíferos."
 libya_gaddafi_instability_dynamic_modifier: "Instabilidade Familiar"
 libya_gaddafi_instability_dynamic_modifier_desc: "O excentricismo de Gaddafi e a sua insistência em favorecer os seus filhos na política provocam cada vez mais resistência por parte da população líbia"
