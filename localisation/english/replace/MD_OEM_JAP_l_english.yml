 JAP_sony_events.7.b_tt: "Political Power: §G+15§!\nStability: §R-1%§!."
 JAP_sony_events.8.a_tt: "Treasury: §R-$3.00 billion§!\nGain one §G15%§! research bonus for §YComputing Technology§!."
