 UN.420.t: "결의안: 무역 파트너십"
 UN.420.d: "§B국제연합§! §Y총회§!가 §Y무역 파트너십§!에 관한 비구속적 결의안을 통과시켰습니다. 우리는 이 결의안에 찬성하지 않았지만, 여전히 이를 수용하고 이행하기로 선택할 수 있습니다.\n\n이 결의안을 따르는 데 동의하시겠습니까?"
 UN.421.t: "결의안: 디지털 개발"
 UN.421.d: "§B국제연합§! §Y총회§!가 §Y디지털 개발§!에 관한 비구속적 결의안을 통과시켰습니다. 우리는 이 결의안에 찬성하지 않았지만, 여전히 이를 수용하고 이행하기로 선택할 수 있습니다.\n\n이 결의안을 따르는 데 동의하시겠습니까?"
 UNSC.200.t: "[?sway_target.GetName] 설득 시도"
 UNSC.200.d: "이번 §B국제연합§! §Y안전보장이사회§! 결의안에서 원하는 결과를 얻으려면, 더 많은 국가가 우리와 함께 투표하거나 기권하도록 만들어야 합니다. 표를 바꾸게 하려면 이번 표결에 걸맞은 충성의 대가를 제시해야 합니다. 우리가 내놓을 수 있는 제안은 여러 가지이며, 지금 하나를 골라 그들이 받아들이기를 바라야 합니다."
 UNSC.200.a: "무역 및 투자 협상을 제안한다"
 UNSC.200.b: "재정적 유인책을 제안한다"
 UNSC.200.c: "군사적 유인책을 제안한다"
 UNSC.200.e: "개발 유인책을 제안한다"
 UNSC.201.t: "[FROM.GetName](이)가 우리의 표를 돌리려 함"
 UNSC.201.d: "[FROM.GetLeader](이)가 [THIS.GetLeader]에게 은밀히 접근하여, 현재 유엔 안전보장이사회 결의안에 대한 우리의 표를 [vote_change_too](으)로 바꿔 달라고 요청했습니다. 이들은 우리가 표를 바꾸는 데 동의하면 무역 협정과 상호 투자 조약을 제공하고 모든 금수 조치와 봉쇄를 철회하겠다고 제안했으며, 이는 표를 바꾼 후에 이행됩니다. 이들의 요청에 동의하는 것이 안전보장이사회에서 우리의 입장을 바꿀 만한 가치가 있는지 결정해야 합니다."
 UNSC.201.a: "제안을 수락한다"
 UNSC.201.b: "터무니없는 요구를 거부한다!"
 UNSC.202.t: "[FROM.GetName](이)가 우리의 표를 돌리려 함"
 UNSC.202.d: "[FROM.GetLeader](이)가 [THIS.GetLeader]에게 은밀히 접근하여, 현재 유엔 안전보장이사회 결의안에 대한 우리의 표를 [vote_change_too](으)로 바꿔 달라고 요청했습니다. 이들은 우리가 표를 바꾸는 데 동의하면 우리 GDP의 0.25%를 일시불로 지급하겠다고 제안했으며, 이는 표를 바꾼 후에 이행됩니다. 이들의 요청에 동의하는 것이 안전보장이사회에서 우리의 입장을 바꿀 만한 가치가 있는지 결정해야 합니다."
 UNSC.202.a: "제안을 수락한다"
 UNSC.202.b: "터무니없는 요구를 거부한다!"
 UNSC.203.t: "[FROM.GetName](이)가 우리의 표를 돌리려 함"
