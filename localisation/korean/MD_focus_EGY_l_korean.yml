 egypt_news.5.t: "아스완 부족 충돌"
 egypt_news.5.d: "아스완 주에서 아랍계 알할라일 씨족과 누비아계 알다보데야 가문 사이에 폭력적인 충돌이 발생하여 다수의 사상자가 났습니다. 이집트 정부는 부족 분쟁의 추가 확대를 막기 위해 개입했습니다."
 egypt_news.5.a: "가문에 경의를"
 egypt.167.a_tt: "\\"아스완 반군\\"이 아스완에서 봉기하여 우리 정부에 대항하는 내전을 시작합니다.\n민족 간 긴장의 성격상 [SUD.GetName]도 개입할 수 있습니다...\n"
