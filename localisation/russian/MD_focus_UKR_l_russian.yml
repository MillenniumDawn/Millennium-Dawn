 UKR_start_workforce_modifier: "Советские штатные нормативы"
 UKR_start_workforce_modifier_desc: "Бывшие колхозы, гражданские заводы и шахты по-прежнему держат раздутые штаты советской плановой экономики, тогда как оборонные заводы, верфи и новые частные офисы уже работают экономно.\n§W--------------§!\n$UKR_start_workforce_progress$"
 UKR_start_workforce_progress: "§YРабочие места§!: сейчас/цель (§Gизменение за каждое§!)\n§YСельскохозяйственные районы§!: [?agriculture_district_total|0]/[?UKR_start_workforce_agriculture_target|0] (§G-10%§!)\n§YГражданская промышленность§!: [?industrial_complex_total|0]/[?UKR_start_workforce_civ_facs_target|0] (§G-2.5%§!)\n§YВоенная промышленность и верфи§!: [?UKR_start_workforce_mil_facs_count|0]/[?UKR_start_workforce_mil_facs_target|0] (§R+2%§!)\n§YОфисный сектор§!: [?office_park_total|0]/[?UKR_start_workforce_offices_target|0] (§R+2%§!)\n§YДобыча ресурсов§!: §G-2.5%§! за каждый шаг указанных выше рабочих мест\n§YДостижение цели§! навсегда добавляет §YЭкономическому развитию Украины§! ежемесячный прирост населения: §G+10%§! за сельскохозяйственные районы или гражданскую промышленность, §G+5%§! за военную промышленность и верфи или офисный сектор\n\nПроверяется ежемесячно. Потерянные здания не возвращают старые штаты. Этот национальный дух будет §Rснят§!, когда все рабочие места достигнут своих целей."
 UKR_start_workforce_removed_tt: "Все рабочие места достигли своих целей, поэтому §YСоветские штатные нормативы§! §Rснимаются§!."
 ukr_start_workforce.1.t: "Штатные нормативы пересмотрены"
 ukr_start_workforce.1.d: "Новое строительство позволило министерствам переписать ещё часть штатных нормативов советской эпохи.\n\n$UKR_start_workforce_progress$"
