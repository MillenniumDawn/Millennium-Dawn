 if_policy_name_text: "[?global.if_policy_name^if_p.GetTokenLocalizedKey]"
 if_privilege_grant_tt: "§Y[?global.if_policy_name^if_p.GetTokenLocalizedKey]§!\n[?global.if_policy_desc^if_p.GetTokenLocalizedKey]\n\nGrant for §Y[?global.if_cost_grant_pp|0]§! Political Power: opinion §G+10§! now, opinion and influence targets §G+10§! each while active, §R-5§! opinion target for every rival faction.\nRequires no active crackdown on this faction and no policy change in the last [?global.if_policy_cooldown_months|0] months (§Y[?if_policy_cooldown^v|0]§! left)."
 if_privilege_grant_treasury_tt: "§Y[?global.if_policy_name^if_p.GetTokenLocalizedKey]§!\n[?global.if_policy_desc^if_p.GetTokenLocalizedKey]\n\nGrant for §Y$$[?if_cost|.2] Billion§! from the Treasury (0.1% of GDP): opinion §G+10§! now, opinion and influence targets §G+10§! each while active, §R-5§! opinion target for every rival faction.\nRequires no active crackdown on this faction and no policy change in the last [?global.if_policy_cooldown_months|0] months (§Y[?if_policy_cooldown^v|0]§! left)."
 if_privilege_revoke_tt: "§Y[?global.if_policy_name^if_p.GetTokenLocalizedKey]§!\n[?global.if_policy_desc^if_p.GetTokenLocalizedKey]\n\n§GActive.§! Revoke for §Y[?global.if_cost_revoke|0]§! Political Power: opinion §R-15§!, Stability §R-3%§!.\nRequires no policy change in the last [?global.if_policy_cooldown_months|0] months (§Y[?if_policy_cooldown^v|0]§! left)."
 if_crackdown_enact_tt: "§Y[?global.if_policy_name^if_p.GetTokenLocalizedKey]§!\n[?global.if_policy_desc^if_p.GetTokenLocalizedKey]\n\nEnact for §Y[?global.if_cost_crackdown|0]§! Political Power and §R-5%§! Stability: opinion §R-20§! and influence §R-20§! now, opinion target §R-15§! and influence target §R-20§! while active. Cancels this faction's privileges and blocks new ones.\nRequires the Military or the Intelligence Community present and not Hostile; cracking down on the Military requires a Positive Intelligence Community. No policy change in the last [?global.if_policy_cooldown_months|0] months (§Y[?if_policy_cooldown^v|0]§! left)."
 if_crackdown_lift_tt: "§Y[?global.if_policy_name^if_p.GetTokenLocalizedKey]§!\n[?global.if_policy_desc^if_p.GetTokenLocalizedKey]\n\n§GActive.§! Lift for §Y[?global.if_cost_lift|0]§! Political Power: opinion §G+5§!.\nRequires [?global.if_policy_cooldown_months|0] months since the last policy change (§Y[?if_policy_cooldown^v|0]§! left)."
 if_appease_button_text: "Appease"
 if_appease_tt: "Appease this faction for §Y[?global.if_cost_appease|0]§! Political Power: opinion §G+10§!. Other active factions of the same category lose §R3§! opinion."
 if_swap_button_text: "Swap"
 if_swap_tt: "Replace this faction for §Y[?global.if_cost_swap|0]§! Political Power. Only a Marginal faction (influence below 25) can be replaced, and a faction that was just brought in stays for [?global.if_swap_cooldown_months|0] months (§Y[?if_swap_cooldown^v|0]§! left)."
 if_swap_title: "Replace [?global.if_token^if_swap_from.GetTokenLocalizedKey]"
 if_swap_cost_line: "Cost: §Y[?global.if_cost_swap|0]§! Political Power. The replacement starts at opinion 50."
 if_swap_pick_text: "Choose"
 if_swap_pick_tt: "Bring this faction in. Its policies start empty and it cannot be replaced again for [?global.if_swap_cooldown_months|0] months."
