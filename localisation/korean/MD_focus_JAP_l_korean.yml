 JAP_mitsubishi_ship_mio_trait_xconfig_rudder: "X형 방향타 기동성"
 JAP_mitsubishi_ship_mio_trait_next_gen_torpedo: "차세대 어뢰 발사 마운트 시스템"
 JAP_mitsubishi_ship_mio_trait_submarine_research: "잠수함 수출 연구 사무소"
 JAP_choice: "정치 재가동"
 JAP_choice_desc: "장기간의 침체와 제도 피로 속에서 정치에 대한 신뢰는 흔들렸고, 개혁의 필요성만 계속 쌓여 왔습니다. 이 나라가 앞으로 나아가려면 먼저 통치의 명확한 방향을 설정하고 의사 결정의 틀을 확립해야 합니다."
 JAP_left: "일본의 좌파"
 JAP_left_desc: "정치의 목적은 경제 성장만이 아니라 국민의 생활과 존엄을 지키는 것이기도 합니다. 우리는 투명성을 확보하고 권력자를 엄격히 감시하며, 노동자의 교섭력과 사회 안전망을 강화하고 불평등과 불안을 줄일 것입니다. 인권을 경시하지 않는 통치를 추구하고 지속 가능한 에너지로의 전환을 추진함으로써 일본 사회의 재건을 목표로 합니다."
 JAP_left_TT: "§Y좌파 정당 중 하나의 지지율을 크게 높일 수 있습니다!\n다만 그 정당이 집권당인 경우 상승 폭은 작게 유지됩니다.§!"
 JAP_information_disclosure: "정보 공개 강화"
 JAP_information_disclosure_desc: "정치와 공공 행정에 대한 신뢰를 회복하기 위해 철저한 정보 공개를 시행하고 공문서의 작성, 보존, 공개를 강화합니다. 이는 부패와 담합의 온상을 끊고 정책 결정을 더욱 투명하게 만들어 개혁을 추진하기 쉽게 할 것입니다."
 JAP_left_party_TT: "다음 중 하나를 충족해야 합니다:\n§Y$JAP.liberalism$§!이(가) 집권 중입니다.\n§Y$JAP.liberalism_alt$§!이(가) 집권 중입니다.\n§Y$JAP.neutral_Social$§!이(가) 집권 중입니다.\n§Y$JAP.Neutral_Communism$§!이(가) 집권 중입니다.\n§Y$JAP.anarchist_communism$§!이(가) 집권 중입니다.\n"
 JAP_management_documents: "공문서의 엄격한 관리"
 JAP_management_documents_desc: "정책 결정 기록, 행정 절차 이력, 공공 기관이 보유한 문서를 통일된 기준으로 정리 및 보존하고 관리 체계를 강화합니다. 기록의 분산과 부적절한 취급을 방지하고 검증 가능성과 행정의 연속성을 높임으로써, 정부 업무의 신뢰성과 실무 효율을 높이는 것을 목표로 합니다."
 JAP_digital_archiving: "공문서의 디지털 보관"
 JAP_digital_archiving_desc: "공문서 기록을 디지털화하고 중앙에서 관리하여 검색, 공유, 보존 절차를 간소화합니다. 종이 중심의 관행에서 벗어남으로써 행정 부담과 관리 비용을 줄이고 정부 지출을 억제할 것입니다."
 JAP_independent_audits: "완전한 독립 감사"
 JAP_independent_audits_desc: "감사 기관의 완전한 독립성을 보장하고 정치인이나 관료의 간섭이 없는 감독 체계를 구축합니다. 담합과 비리를 조기에 발견하기 쉽게 하여 반부패 노력을 추진하고, 정치에 대한 신뢰를 회복함으로써 정책 이행의 추진력도 강화할 것입니다."
 JAP_eliminating_amakudari: "아마쿠다리 근절"
 JAP_eliminating_amakudari_desc: "관료와 기업 간의 담합을 쉽게 조장하는 아마쿠다리 관행을 끝내고, 뿌리 깊은 기득권에 메스를 댑니다. 인사의 투명성을 높이고 경쟁을 강화함으로써 부패를 억제하는 동시에 비효율을 줄이고 생산성을 높일 것입니다."
 JAP_disclosure_of_political_funding: "정치 자금의 완전한 공개"
 JAP_disclosure_of_political_funding_desc: "정치 자금의 흐름을 철저히 공개하여 기부자와 지출 내역을 분명하게 드러냅니다. 이는 불투명한 자금이 정치에 유입될 여지를 줄이고 반부패 노력을 진전시키는 동시에, 외국 세력의 영향력 공작에 대한 대응력도 높일 것입니다."
 JAP_protecting_human_rights: "인권 보호"
 JAP_protecting_human_rights_desc: "모든 사람의 존엄과 권리를 보호하는 일을 통치의 핵심에 놓겠습니다. 차별과 부당한 대우를 바로잡고 사람들이 안심하고 살 수 있는 사회를 건설함으로써 국내 결속과 안정을 강화할 것입니다."
 JAP_same_sex_partnerships: "동성 파트너십 합법화"
 JAP_same_sex_partnerships_desc: "동성 파트너를 법적으로 인정하고 의료 동의, 주거, 상속 등의 영역에서 일상의 불이익을 줄이는 제도를 마련합니다. 다양한 형태의 가족을 존중하고 사회적 분열을 완화함으로써 국내 안정을 강화할 것입니다."
 JAP_employment_disabilities: "장애인 고용 확대"
 JAP_employment_disabilities_desc: "장애 여부와 관계없이 일할 수 있는 환경을 조성하고 고용 지원과 직장 내 합리적 편의 제공을 확대합니다. 일자리 기회를 넓혀 노동력을 강화하고 사회 참여를 촉진함으로써 국내 안정에도 기여할 것입니다."
 JAP_prevent_domestic_violence: "가정 폭력 예방 노력"
 JAP_prevent_domestic_violence_desc: "가정 폭력의 예방과 조기 발견을 강화하고 상담 서비스와 보호 지원을 확대합니다. 학대의 악순환을 끊고 가정 내 불안과 폭력을 줄임으로써 사회 안정을 높일 것입니다."
 JAP_protecting_labor_union: "노동조합 권리 보호"
 JAP_protecting_labor_union_desc: "노동조합의 권리를 분명히 보장하고 단체 교섭과 노사 협의가 제대로 이루어질 수 있는 환경을 조성합니다. 일터의 목소리를 제도와 기업 경영에 반영함으로써 고용과 근로 조건의 안정을 촉진할 것입니다."
 JAP_subcontracto: "하청업체 갑질 억제"
 JAP_subcontracto_desc: "하청업체에 강요되는 부당한 단가 인하 요구, 대금 지급 지연, 일방적인 계약 조건 변경을 단속하고 공정한 거래 환경을 구축합니다. 중소기업의 수익 기반을 보호함으로써 공급망 전체의 건전성을 강화하고 사회 안정에 기여할 것입니다."
 JAP_pressure_wage_increases: "임금 인상 압박"
 JAP_pressure_wage_increases_desc: "기업이 임금을 올리고 가계 소득을 높이도록 장려합니다. 소비를 뒷받침하고 일상생활의 불안을 완화함으로써 사회 안정을 강화하고 경제의 선순환을 목표로 합니다."
 JAP_regulation_temporary_agency_work: "파견 노동 규제 강화"
 JAP_regulation_temporary_agency_work_desc: "파견 노동의 남용을 억제하고 고용 안정과 근로 조건 개선을 추진합니다. 단기적 효율보다 안정적이고 장기적인 근로 환경을 우선시함으로써 사회 안정을 강화할 것입니다."
 JAP_ban_non_regular_employment: "비정규직 고용 금지"
 JAP_ban_non_regular_employment_desc: "비정규직에 의존하는 고용 관행을 개혁하고, 모두가 안정적인 일자리와 공정한 대우를 받을 수 있는 체제로 전환합니다. 일상생활의 불안을 줄이고 사회 분열을 억제함으로써 국가 안정을 강화할 것입니다."
 JAP_redistribution: "재분배 우선"
 JAP_redistribution_desc: "소득 불평등과 경제적 불안을 바로잡는 것을 우선하는 정책으로 전환하여, 지원이 필요한 이들에게 자원을 더 넉넉히 배분합니다. 재분배를 통해 사회 분열을 억제하고 국민의 안정감을 높이며 안정적인 통치를 목표로 합니다."
 JAP_reducing_medical_costs: "본인 부담 의료비 경감"
 JAP_reducing_medical_costs_desc: "본인 부담 의료비를 줄이고 사람들이 망설임 없이 필요한 치료를 받을 수 있는 제도를 구축합니다. 가계의 재정적 불안을 완화하고 건강 격차의 확대를 억제함으로써 사회 안정을 강화할 것입니다."
 JAP_care_workers: "돌봄 노동자 임금 및 처우 개선"
 JAP_care_workers_desc: "돌봄 노동자의 임금과 근로 조건을 개선하고 인력의 채용과 유지를 촉진합니다. 돌봄의 연속성을 강화하고 가족의 부담을 덜며 노동력 참여를 뒷받침함으로써 사회 안정에 기여할 것입니다."
 JAP_housing_support: "주거 지원 확대"
 JAP_housing_support_desc: "주거 지원을 확대하여 임대료 부담을 줄이고 사람들이 안정적인 주거를 확보하도록 돕습니다. 주거 불안을 완화하고 일상생활의 안정을 뒷받침함으로써 사회 분열을 억제하고 국내 안정을 강화할 것입니다."
 JAP_student_loans: "학자금 대출 부담 경감"
 JAP_student_loans_desc: "학자금 대출의 상환 부담을 줄이고 고등 교육과 재교육의 장벽을 낮춥니다. 미래에 대한 투자로서 인적 자본 개발을 추진함으로써 연구와 기술의 진보를 뒷받침할 것입니다."
 JAP_nuclear_phaseout: "원자력과의 작별"
 JAP_nuclear_phaseout_desc: "다음 지진에 도박을 거는 대신, 나라는 원자로가 면허 만료와 함께 문을 닫도록 두고 그 돈을 효율과 재생 에너지에 쏟아붓습니다. 이 길은 단기적으로 비용이 더 들지만 장기적으로 더 안전합니다. 앞바다를 덮치는 어떤 파도도 제2의 후쿠시마를 위협하지 못할 것입니다.\n-------------\n원전 전체를 가동 중단하고 §Y녹색 전환 프로그램§!을 개시합니다. 이 프로그램은 잃어버린 출력을 일본이 수입할 필요가 없는 발전과 더는 충족할 필요가 없는 수요로 대체합니다. 각 프로젝트는 또한 해당 지역의 원자로를 영구히 해체합니다."
 JAP_leading_disarmament: "군축 외교 주도"
 JAP_leading_disarmament_desc: "군축과 긴장 완화를 외교 정책의 기둥으로 삼고, 대화와 신뢰 구축을 통해 지역 안정을 모색합니다. 무력에 의존하지 않는 해법을 우선시하며 다른 나라와의 관계 개선에 힘쓸 것입니다."
 JAP_restricting_arms_exports: "무기 수출 제한"
 JAP_restricting_arms_exports_desc: "무기 수출을 제한하고 군사적 긴장을 부추길 가능성이 낮은 외교 기조를 분명히 밝힙니다. 군축과 신뢰 구축을 우선시함으로써 지역 안정을 위한 대화를 진전시킬 것입니다."
 JAP_principle_of_no_armed_forces: "전력 불보유 원칙 재확인"
 JAP_principle_of_no_armed_forces_desc: "군사력을 보유하지 않는다는 원칙을 재확인하고 군사력에 의존하지 않는 통치 기조를 분명히 밝힙니다. 평화주의를 정책의 핵심에 놓고 외교와 국제 협력을 통한 안보를 강조할 것입니다."
 JAP_abrogating_us_japan_security_treaty: "미일 안전보장조약 폐기"
 JAP_abrogating_us_japan_security_treaty_desc: "미일 안보 체제에서 탈퇴하고, 미국에 대한 의존에 기대지 않는 자주적 안보 정책으로 전환합니다. 이는 외교 정책의 자유를 넓히고 우리의 주권과 독립을 더욱 분명히 주장하게 해 줄 것입니다."
 JAP_dissolving_sdf: "자위대 해체"
 JAP_dissolving_sdf_desc: "자위대를 해체하고 군사력에 의존하지 않는 통치로 전환합니다. 지금까지 방위에 쏟던 자원과 노력을 민간 부문으로 돌려 산업과 생활 기반 강화를 우선시하고 국내 발전을 가속할 것입니다."
 JAP_army_delete_TT: "§R모든 육군 병력이 제거됩니다!§!"
 JAP_right: "일본의 우파"
 JAP_right_desc: "우리는 국가 역량과 사회 질서를 중시하며, 더욱 강력한 치안과 위기 대응, 그리고 국익을 전면에 내세우는 외교 안보 정책을 추진합니다. 규제 개혁과 기업 활동 활성화를 통한 성장을 목표로 하며, 전통과 공동체 가치의 토대 위에서 나라를 재건하고자 합니다."
 JAP_right_TT: "§Y우파 정당 중 하나의 지지율을 크게 높일 수 있습니다!\n다만 그 정당이 집권당인 경우 상승 폭은 작게 유지됩니다.§!"
 JAP_strengthen_military_power: "군사력 강화 정책"
 JAP_strengthen_military_power_desc: "안보 환경의 변화를 고려하여 방위 태세 강화를 국가 정책으로 분명히 확립합니다. 억지력을 높임으로써 위협이 현실화되기 전에 방지하고, 국민의 안전과 국가 주권을 지키겠다는 의지를 보여줄 것입니다."
 JAP_right_party_TT: "다음 중 하나를 충족해야 합니다:\n§Y$JAP.conservatism$§!이(가) 집권 중입니다.\n§Y$JAP.socialism$§!이(가) 집권 중입니다.\n§Y$JAP.Neutral_conservatism$§!이(가) 집권 중입니다.\n§Y$JAP.Neutral_conservatism2$§!이(가) 집권 중입니다.\n§Y$JAP.Neutral_conservatism3$§!이(가) 집권 중입니다.\n§Y$JAP.Neutral_conservatism4$§!이(가) 집권 중입니다.\n§Y$JAP.Neutral_Libertarian$§!이(가) 집권 중입니다.\n§Y$JAP.Nat_Populism$§!이(가) 집권 중입니다.\n"
 JAP_allow_overseas_deployment: "자위대 해외 파병 허용"
 JAP_allow_overseas_deployment_desc: "국제 정세와 동맹국과의 협력을 고려하여 자위대의 해외 파견을 허용하는 정책을 분명히 밝힙니다. 국제 임무에 참여함으로써 억지력과 영향력을 강화하고 국익과 안보를 더욱 적극적으로 지킬 것입니다."
 JAP_international_missions: "국제 임무를 위한 법적 틀"
 JAP_international_missions_desc: "국제 임무 참여를 위한 법적 근거와 절차를 마련하여, 자위대가 일관된 규칙 아래 활동할 수 있는 체계를 구축합니다. 이는 현장의 불확실성을 줄이고 국제 협력의 보다 확실한 이행을 가능하게 할 것입니다."
 JAP_revising_use_weapons: "무기 사용 규정 재검토"
 JAP_revising_use_weapons_desc: "국제 임무와 위기 대응의 현실에 맞도록 무기 사용의 기준과 절차를 재검토합니다. 임무 수행에 필요한 권한과 책임의 범위를 명확히 함으로써, 자위대가 자신과 타인을 적절히 보호할 수 있는 체계를 확립할 것입니다."
 JAP_exclusive_defense: "전수방위 태세 유지"
 JAP_exclusive_defense_desc: "전수방위 태세를 안보 정책의 지도 원칙으로 엄격히 지키며, 방위 능력의 사용을 우리나라에 대한 공격을 막는 범위로 분명히 제한합니다. 억지력을 유지하는 한편 과도한 군사 확장을 피하고 인접국과의 긴장을 고조시킬 가능성이 낮은 자세를 보여줄 것입니다."
 JAP_exclusive_defense_TT: "§Y이 국가 중점은 세력 균형을 2단계에 더 가깝게 이동시킵니다!§!"
 JAP_collective_self_defense: "집단적 자위권 허용 정책"
 JAP_collective_self_defense_desc: "동맹국에 대한 공격이 우리 자신의 안보에도 직접 영향을 미칠 수 있다는 견해에 따라, 집단적 자위권의 행사를 허용하는 정책을 분명히 밝힙니다. 이는 억지력과 동맹의 실효성을 강화하고 더욱 적극적인 안보 체제를 구축할 것입니다."
 JAP_prioritizing_order: "질서 우선"
 JAP_prioritizing_order_desc: "사회 질서와 공공 안전을 통치의 최우선 과제로 삼겠습니다. 규칙과 책임을 중시하고 치안과 안정적인 행정을 유지함으로써 나라의 토대를 재건할 것입니다."
 JAP_strengthen_public_security: "종합 치안 계획"
 JAP_strengthen_public_security_desc: "치안 체계를 전면 재검토하고 장비, 인력, 정보 조율을 아우르는 종합 계획을 수립합니다. 경찰 역량을 강화하는 한편 현장 업무를 간소화함으로써 범죄 억지력을 강화하고 사회 안정을 확보할 것입니다."
 JAP_against_organized_crime: "조직범죄 대책 강화"
 JAP_against_organized_crime_desc: "조직범죄 단속을 강화하고 자금원 차단과 수사 역량 확대를 추진합니다. 국내 치안을 회복함으로써 사회 안정을 강화하고, 외부 세력의 침투와 영향력 공작에 덜 취약한 국가 체제도 구축할 것입니다."
 JAP_against_terrorist_financing: "테러 자금 대책"
 JAP_against_terrorist_financing_desc: "금융 흐름을 엄격히 감시하고 테러 조직과 극단주의 단체에 대한 자금 지원을 차단하는 제도를 철저히 시행합니다. 금융 당국과 수사 기관 간의 협력을 강화함으로써 국내 안보를 지키고 외부 영향력 공작에 대한 대응력을 높이며 사회 안정을 강화할 것입니다."
 JAP_counter_espionage: "방첩 체계 구축"
 JAP_counter_espionage_desc: "정보 활동에 대한 대응책을 강화하고 기밀 정보를 보호하며 감시를 강화하는 체계를 마련합니다. 외부 세력의 침투와 비밀 공작을 억제하고 국가 의사 결정을 보호함으로써 국내 안정을 확보할 것입니다."
 JAP_strengthening_cabinet: "내각 권한 강화"
 JAP_strengthening_cabinet_desc: "내각의 지휘 계통과 조정 기능을 강화하여 의사 결정의 속도와 일관성을 높입니다. 위기 대응과 주요 정책에 신속히 움직일 수 있는 체제를 구축함으로써 국정 운영에서 결단력 있는 리더십을 강화할 것입니다."
 JAP_cabinet_personnel_bureau: "내각인사국"
 JAP_cabinet_personnel_bureau_desc: "내각이 인사 사항을 중앙에서 총괄할 수 있는 체제를 확립하여 고위직 임명에 대한 투명성과 통제를 강화합니다. 적재적소에 인재를 승진시킴으로써 관료제의 운영을 효율화하고 정부의 정책 이행 역량을 높일 것입니다."
 JAP_breaking_down_bureaucratic_siloing: "관료적 칸막이 해소"
 JAP_breaking_down_bureaucratic_siloing_desc: "부처별로 분절된 행정을 개혁하고 정보 공유와 부처 간 조율을 강화합니다. 중복된 절차와 병목 현상을 줄임으로써 공공 행정을 효율화하고 공공 투자와 사업의 집행을 가속할 것입니다."
 JAP_policy_evaluation_and_kpis: "정책 평가 및 KPI 도입"
 JAP_policy_evaluation_and_kpis_desc: "정책 성과를 측정 가능한 데이터로 검증할 수 있도록 평가 제도와 KPI를 도입합니다. 효과가 낮은 조치를 재검토하고 한정된 자원을 효과가 높은 분야에 집중함으로써 행정 효율을 개선하고 경제 생산성을 높일 것입니다."
 JAP_national_security_council: "국가안전보장회의 설치"
 JAP_national_security_council_desc: "안보 관련 정보와 의사 결정을 내각 내에 집중시키고 신속하고 일관된 결정을 내릴 수 있는 체제를 구축합니다. 위기 대응 역량을 강화하고 동맹국 및 관련 기관과의 조율을 높임으로써 억지력을 강화할 것입니다."
 JAP_emergency_powers: "긴급사태 조항"
 JAP_emergency_powers_desc: "대규모 재해나 무력 공격 같은 비상 상황에 대비하여 긴급 시 필요한 권한과 절차를 명확히 합니다. 평시의 감독을 유지하면서도 위기 대응을 신속히 하고 지휘 계통을 강화하여 국가 안정과 방위 태세를 확보할 것입니다."
 JAP_regulatory_reform: "규제 개혁을 통한 성장"
 JAP_regulatory_reform_desc: "규제와 절차를 재검토하고 행정 부담을 줄이며 기업 활동과 투자를 촉진합니다. 신규 사업의 시작과 시설 개발을 쉽게 만듦으로써 경제 성장의 속도를 높일 것입니다."
 JAP_postal_privatization: "우정 민영화"
 JAP_postal_privatization_desc: "정부 주도 체제를 개편하여 공공 행정의 효율을 높이기 위해 우편 서비스의 민영화를 추진합니다. 시장 원리를 도입하여 기업 활동과 세수 기반을 강화하는 것을 목표로 하지만, 이 개혁은 그 타당성을 둘러싸고 강한 반발을 불러일으켜 정치적 갈등을 심화시킬 수도 있습니다."
 JAP_postal_privatization_TT: "§Y중의원 해산 총선거를 치를지 선택하는 사건이 발생합니다!§!"
 JAP_second_wave_privatization: "민영화 2단계"
 JAP_second_wave_privatization_desc: "민영화 개혁을 한층 더 밀고 나가 공공 부문의 역할과 공공 서비스 운영 방식을 재검토합니다. 행정 비효율을 줄이고 투자와 기업 활동을 장려함으로써 경제 활력을 높일 것입니다."
 JAP_special_zones: "국가전략특구"
 JAP_special_zones_desc: "지정된 지역에서 규제 예외를 만들고 기업의 진출과 신규 투자를 집중적으로 촉진합니다. 기존 제도의 장벽을 넘어 실증 사업과 상용화를 진전시킴으로써 민간 부문의 활력이 이끄는 성장을 가속하고 지역 경제를 되살릴 것입니다."
 JAP_expansion_regulatory_reform_zones: "전국 개혁 특구 확대"
 JAP_expansion_regulatory_reform_zones_desc: "특구에서 거둔 성과를 전국으로 확대하여 규제 개혁을 지역별 예외에서 국가 표준으로 전환합니다. 진입과 투자의 장벽을 낮춤으로써 신규 사업을 장려하고 전국의 경제 활성화를 촉진할 것입니다."
 JAP_new_market_entry: "신규 시장 진입 촉진"
 JAP_new_market_entry_desc: "진입 장벽을 낮추고 창업과 신규 사업 개시를 지원합니다. 경쟁과 혁신을 촉진함으로써 생산성을 높이고 세수 기반을 강화할 것입니다."
 JAP_new_technologies: "신기술 환영"
 JAP_new_technologies_desc: "신기술의 도입과 상용화를 적극 지원하여 연구 개발과 산업 혁신을 가속합니다. 새로운 성장 분야를 육성함으로써 국가 경쟁력을 강화할 것입니다."
 JAP_key_industries_back_home: "핵심 산업 국내 복귀"
 JAP_key_industries_back_home_desc: "핵심 산업의 안정적인 국내 생산이 가능한 체제를 구축하여 공급망을 강화하고 주요 부문의 자급률을 높입니다. 국내 투자를 장려함으로써 산업 기반을 강화하고 국제 환경 변화에 덜 취약한 구조를 만들 것입니다."
 JAP_economic_security: "경제 안보 확립"
 JAP_economic_security_desc: "핵심 물자와 주요 산업의 공급 체계를 재검토하고 기술, 자본, 정보 분야의 위험을 관리하여 경제 안보를 확립합니다. 이는 국가의 자립과 기업의 지속 가능한 경쟁력을 강화하여 안정적인 성장을 뒷받침할 것입니다."
 JAP_patriotic_education: "애국 교육"
 JAP_patriotic_education_desc: "국가의 역사, 문화, 시민적 책임을 강조하는 교육을 추진하여 사회 결속과 공통 규범 의식을 강화합니다. 외부 영향에 덜 취약한 토대를 구축함으로써 국내 안정을 강화할 것입니다."
 JAP_fundamentals_of_education: "교육 기본 재정립"
 JAP_fundamentals_of_education_desc: "교육의 목표와 기준을 재검토하고 학력, 기초 지식, 실용 기술의 육성을 국가 정책으로서 재정립합니다. 교육 투자를 우선시함으로써 인적 자본 개발과 연구 개발의 기반을 강화할 것입니다."
 JAP_dotoku_education: "도덕 교육"
 JAP_dotoku_education_desc: "도덕 교육을 한층 중시하여 학교 교육 안에서 공공심, 책임감, 타인에 대한 배려와 같은 가치를 함양합니다. 사회 규범을 강화하고 지역 공동체의 결속을 깊게 함으로써 국내 안정에 기여할 것입니다."
 JAP_national_flag_and_anthem: "국기와 국가 존중"
 JAP_national_flag_and_anthem_desc: "국기와 국가에 대한 존중을 분명히 확인하여 국가 소속감과 사회 단합을 강화합니다. 이는 위기 시의 결속을 강화하고 외부 영향에 덜 취약한 토대를 구축할 것입니다."
 JAP_family_policy: "가족 정책 강화"
 JAP_family_policy_desc: "가정과 가족의 가치를 존중하고 육아와 일상생활을 지원하는 조치를 확대합니다. 사람들이 안심하고 가정을 꾸릴 수 있는 환경을 조성함으로써 미래의 인구 기반을 강화하고 사회 안정에 기여할 것입니다."
 JAP_glorious_decade: "찬란한 10년을 향하여"
 JAP_inflation_target: "정책 공약 명확화"
 JAP_down_long_term_interest_rates: "장기 금리 인하"
 JAP_down_long_term_interest_rates_desc: "장기 금리를 낮고 안정적으로 유지하여 기업과 가계의 자금 조달 비용을 줄입니다. 투자, 설비 교체, 주택 구입을 뒷받침하여 수요를 떠받치고 경기를 끌어올림으로써 세수 회복의 길도 열 것입니다."
 JAP_special_inspection_banks: "은행 특별 검사"
 JAP_special_inspection_banks_desc: "금융 시스템의 건전성을 회복하기 위해 은행 자산에 대한 철저한 검사를 실시합니다. 부실 채권의 실상을 밝히고 손실 이연과 불투명한 처리를 끝냄으로써, 신용 불안과 대출 위축의 연쇄 반응을 멈출 발판을 마련할 것입니다."
 JAP_bank_supervision: "은행 감독 강화"
 JAP_bank_supervision_desc: "검사와 시정 조치를 일회성으로 다루는 대신, 감독 체계를 상시적으로 강화합니다. 공시와 지배구조를 철저히 시행하고 허술한 위험 관리와 불투명한 처리가 되풀이되지 않도록 방지함으로써 금융 시스템에 대한 신뢰를 안정시킬 것입니다."
 JAP_business_assessment: "공정한 기업 평가"
 JAP_business_assessment_desc: "기업의 역량과 위험을 정확히 판단하기 위해 사업 수익성과 미래 전망을 객관적으로 평가합니다. 기업을 연명시키거나 수명을 늘리는 데 의존하지 않고, 재건해야 할 영역과 구조조정해야 할 영역을 구분하며 자본과 인재가 성장 부문으로 흘러갈 토대를 마련할 것입니다."
 JAP_corporate_debt_restructuring: "기업 부채 구조조정"
 JAP_corporate_debt_restructuring_desc: "과도한 부채 부담을 해소하고 회복에 필요한 시간과 숨돌릴 여유를 확보합니다. 이자 지급과 상환에 잠식된 상태에서 벗어나 자원을 투자, 고용, 사업 전환으로 돌릴 수 있게 함으로써 침체의 사슬을 끊을 것입니다."
 JAP_corporate_revitalization: "기업 활성화"
 JAP_corporate_revitalization_desc: "구조조정을 새로운 단계로 끌어올려 재무와 운영 양면에서 기업의 토대를 재건합니다. 과도한 부담과 비효율을 해소하고 기업이 투자, 채용, 임금 인상에 나설 수 있는 위치로 올려놓음으로써 민간 주도의 회복을 굳건히 할 것입니다."
 JAP_expectations_escaping_deflation: "성장 기대 회복"
 JAP_expectations_escaping_deflation_desc: "부실 채권을 해결하고 과도한 부채를 해소함으로써 경제의 초점을 \\"수비\\"에서 \\"공격\\"으로 전환합니다. 기업이 투자, 연구개발, 사람에 대한 지출을 재개하고 가계가 미래에 대한 더 분명한 전망을 되찾는다면, 생산성과 임금의 선순환이 자리 잡을 가능성이 높아집니다. 경쟁력 회복을 본격적으로 재가동하는 데 필요한 토대를 구축할 것입니다."
 JAP_promoting_labor_mobility: "노동 이동성 촉진"
 JAP_promoting_labor_mobility_desc: "인재가 성장 부문으로 이동하기 쉬운 여건을 조성하고 노동력의 재배치를 추진합니다. 이직과 재취업의 장벽을 낮추고 기술 향상을 지원함으로써 산업 쇄신을 이끌고 생산성을 높일 것입니다."
 JAP_competition_service_sector: "서비스 부문 경쟁 촉진"
 JAP_competition_service_sector_desc: "서비스 부문의 진입과 경쟁을 장려하고 침체의 원인이 되어 온 비효율과 가격 경직성을 해소합니다. 규제와 굳어진 관행을 재검토하여 사업 환경을 개선하고, 더 나은 서비스가 더 쉽게 선택되는 시장으로 전환할 것입니다."
 JAP_revitalization_economy: "일본 경제 재생"
 JAP_revitalization_economy_desc: "금융 시스템과 기업 부문의 재건을 진전시켰으며, 수요 회복과 임금 개선으로 가는 길을 열었습니다. 침체의 원인을 하나씩 제거하고 가계와 기업이 미래를 더 분명히 볼 수 있는 환경을 조성함으로써 성장을 향한 기세를 굳힐 것입니다."
 JAP_equal_pay_for_equal_work: "동일 노동 동일 임금"
 JAP_equal_pay_for_equal_work_desc: "단시간·유기고용노동법은 고용주가 정규직과 비정규직 사이의 모든 임금 및 복리후생 차이를 정당화하거나 폐지하도록 강제합니다. 일본 노동자 열 명 중 네 명은 비정규직으로, 같은 책상에 앉아 시급은 일부에 불과하고 보너스도, 퇴직금도, 내년 봄에 일자리가 있으리라는 기대도 없이 일합니다. 기업들은 수십 년간 의존해 온 값싼 노동 완충재를 잃고, 한 해 앞도 계획할 수 없었던 수백만 명이 마침내 계획을 세울 수 있게 됩니다."
 JAP_diplomacy: "일본의 외교"
 JAP_diplomacy_desc: "세계와의 관계를 재건하고 국제 사회에서 일본의 역할을 재정립합니다."
 JAP_diplomacy_idea_TT: "§Y외교 중점을 진행할수록 이 국가 정신에 추가 변동치가 더해집니다!§!"
 JAP_friendship_asean: "아세안과의 관계 개선"
 JAP_friendship_asean_desc: "일본 정부는 신뢰 회복과 대화 증진을 추진하며 아세안 국가들과의 관계를 개선하기 위해 노력할 것입니다. 일본에게 아세안은 경제와 안보 양면에서 없어서는 안 될 중요한 파트너이며, 그 단결과 안정이 지역 전체의 미래를 좌우할 것입니다."
 JAP_not_asean_war_TT: "\\"아세안 회원국\\" 국가 정신을 가진 국가가 최소 하나 존재하며, 일본이 \\"아세안 회원국\\" 국가 정신을 가진 어떤 국가와도 전쟁 중이 아님."
 JAP_chiang_mai: "치앙마이 이니셔티브"
 JAP_chiang_mai_desc: "치앙마이 이니셔티브를 통해 일본은 아세안 국가들의 경제 안정과 결속을 뒷받침하기 위해 지역 금융 협력을 강화합니다."
 JAP_quantitative_oda: "양적 ODA"
 JAP_quantitative_oda_desc: "교통, 항만, 에너지 같은 핵심 기반 시설에 대한 대규모 ODA 투자를 통해 일본은 아세안의 경제 성장과 지역 연결성을 뒷받침합니다."
 JAP_qualitative_oda: "질적 ODA"
 JAP_qualitative_oda_desc: "현지 기업 및 기관과의 제휴를 통해 일본은 인적 자본 개발과 민주적 가치를 증진하고 아세안 전역에서 영향력을 강화합니다."
 JAP_security_south_china_sea: "남중국해 안보 태세"
 JAP_security_south_china_sea_desc: "아세안 국가들의 신뢰를 바탕으로 일본은 남중국해의 중립적이고 평화적인 해양 안보를 위한 틀을 출범시킵니다."
 JAP_away_dependence: "미국 의존에서 벗어나기"
 JAP_away_dependence_desc: "일본은 오랜 관계의 성격을 재검토하기 시작하여 전략적 선택지와 자율성을 넓히려 합니다. 경제, 기술, 안보 같은 분야에서 우리는 미래에 대한 우리 자신의 구상이 이끄는 길을 추구합니다."
 JAP_development_production: "국내 생산 체인 구축"
 JAP_development_production_desc: "국방을 독자적으로 확보하기 위해 일본 안에서 무기와 자재를 생산할 수 있는 국내 체계를 구축할 것입니다."
 JAP_japanese_doctrine: "일본형 교리 수립"
 JAP_japanese_doctrine_desc: "우리의 전략 환경에 맞춘 유연한 대응을 가능하게 하는 독자적인 일본 안보 교리를 수립할 것입니다."
 JAP_recalling_researchers: "해외 연구자 소환"
 JAP_recalling_researchers_desc: "대학과 국립 연구소는 오랜 인재 유출을 되돌리기 위해 신속 임용 자리, 개선된 시설, 경쟁력 있는 연구비를 제공합니다. 목표는 미국에 있는 일본인 과학자를 고국으로 데려와 국내 연구 역량을 재건하는 것입니다."
 JAP_japanese_cloud: "가스미가세키 클라우드"
 JAP_japanese_cloud_desc: "일본 사업자가 운영하고 국내 서버에 호스팅되는 정부 운영 \\"가스미가세키 클라우드\\"를 구축합니다. 각 부처와 주요 기관은 비용 절감, 보안 표준화, 민감 데이터의 국가 통제 유지를 위해 시스템을 이 공유 플랫폼으로 이전합니다."
 JAP_base_okinawa: "오키나와 주둔 미군 철수 협상"
 JAP_base_okinawa_desc: "일본의 안보 자율성을 높이기 위해 오키나와에 주둔한 미군의 철수를 위한 협상이 시작될 것입니다."
 JAP_enhancement_exercises: "합동 훈련 강화"
 JAP_enhancement_exercises_desc: "더 큰 규모와 더 잦은 합동 훈련으로 미군과의 통합을 심화합니다. 해상, 항공, 지상 부대는 공동 절차, 통신, 군수를 연습하여 실제 위기에서 양측이 하나의 조율된 전력으로 이동하고, 싸우고, 보급받을 수 있도록 합니다."
 JAP_education_jap_usa: "미일 공동 교육 프로그램"
 JAP_education_jap_usa_desc: "일본과 미국 간의 상호 이해를 심화하기 위해 공동 교육 프로그램과 학생 교류를 시행할 것입니다. 일본의 규율 의식과 미국의 기업가 정신으로부터 배움으로써, 이 구상은 국제적 시각을 갖춘 새로운 세대의 지도자를 길러 내고 양국 신뢰를 한층 강화할 것입니다."
 JAP_culture_technology: "미일 기술 문화 교류"
 JAP_culture_technology_desc: "대학 연구실과 스튜디오를 실리콘밸리, 시애틀, 로스앤젤레스의 파트너와 연결하여 일본 기업과 미국 기술 거점의 관계를 긴밀히 합니다. 기술자, 디자이너, 창작자가 공동 프로젝트를 위해 오가며, 미국의 플랫폼 노하우를 일본의 하드웨어, 게임, 애니메이션과 결합합니다."
 JAP_dual_use: "이중 용도 기술 협력"
 JAP_dual_use_desc: "일본과 미국은 민간과 군사 목적 모두에 적용 가능한 이중 용도 기술 분야의 협력을 심화할 것입니다. 산학 협력을 통해 이 제휴는 연구 개발 노력을 가속하고 전반적인 기술 발전을 촉진할 것입니다."
 JAP_okinawa_development: "오키나와 공동 개발 프로젝트"
 JAP_okinawa_development_desc: "오키나와의 경제 성장과 지역 통합을 촉진하기 위해 일본과 미국은 기반 시설 개발을 중심으로 한 공동 개발 프로젝트에 협력할 것입니다. 교통망, 물류 체계, 공공 시설을 개선함으로써 이 구상은 지역 성장을 높이는 한편 미일 협력의 새로운 길을 열고자 합니다."
 JAP_informal_cooperation: "비공식 협력 체계"
 JAP_informal_cooperation_desc: "공식 외교 관계가 없음에도 불구하고 일본과 대만은 실질적이고 내실 있는 형태의 협력을 발전시켜 왔습니다. 재난 대응, 기술 교류, 민간 교류를 통해 상호 이익이 되는 토대가 마련되고 있습니다."
 JAP_disaster_countermeasure_cooperation: "일본-대만 재난 지식 플랫폼"
 JAP_disaster_countermeasure_cooperation_desc: "자연재해에 대한 공통된 취약성을 감안하여 일본과 대만은 재난 대응 전문 지식과 교훈을 공유하는 공동 플랫폼을 구축하고 있습니다. 이 협력은 양국의 회복력과 복구 역량을 높입니다."
 JAP_tai_high_technology: "일본-대만 첨단 기술 연계"
 JAP_tai_high_technology_desc: "일본과 대만의 연구 기관과 민간 기업이 힘을 모아 최첨단 민간 기술을 공동으로 개발하고 있습니다. 이 제휴는 양국 산업의 혁신과 생산성을 높이는 것을 목표로 합니다."
 JAP_tai_tourist_visa: "관광 비자 정책 완화"
 JAP_tai_tourist_visa_desc: "대만으로부터의 방일 관광을 더욱 장려하기 위해 일본은 비자 절차를 완화할 것입니다. 민간 교류와 관광의 증가는 경제를 활성화하고 더 깊은 상호 이해를 키우는 데 도움이 될 것입니다."
 JAP_tai_international_student: "학생 교류 프로그램 확대"
 JAP_tai_international_student_desc: "일본은 대만 학생들이 자국 대학에서 공부할 기회를 확대할 것입니다. 이 구상은 두 사회를 잇는 미래의 지도자를 길러 내는 한편 학술적, 문화적 유대를 심화하는 것을 목표로 합니다."
 JAP_tai_senkaku: "대만과의 해양 협의 수립"
 JAP_tai_senkaku_desc: "센카쿠 열도를 둘러싼 분쟁은 어업권, 해양 안보, 그리고 모든 동중국해 협상을 좌우합니다. 일본은 주권에 대해서는 한 치도 양보하지 않으면서 해상 마찰을 줄이기 위해 대화 채널과 실무 협의를 개설합니다. 대결을 해결하기보다 관리하는 것입니다."
 JAP_dprk_national_policy: "북방 반도 독트린"
 JAP_dprk_national_policy_desc: "북한은 우리 해안에서 가장 가까운 불씨이며 반도에서 가장 예측하기 어려운 행위자로 남아 있습니다. 우리는 외교, 정보, 즉응 태세를 하나의 독트린으로 일치시켜 평양에 대한 통일된 국가 정책을 규정할 것입니다. 우리가 택하는 방향이 동북아시아 안보의 조건을 결정할 것입니다."
 JAP_dprk_maximum_pressure: "평양에 대한 최대 압박"
 JAP_dprk_maximum_pressure_desc: "북한은 선의가 아니라 지렛대를 이해합니다. 우리는 제재 집행을 강화하고, 해상 감시를 확대하며, 외교적 압박을 조율하여 평양의 긴장 고조 여지를 억제할 것입니다. 목표는 단순합니다. 정권이 계산을 다시 하도록 강제될 때까지 모든 도발의 비용을 높이는 것입니다."
 JAP_dprk_missile_defense: "다층 미사일 방패"
 JAP_dprk_missile_defense_desc: "북쪽의 위협은 며칠이 아니라 몇 분 단위로 측정됩니다. 우리는 육상, 해상, 공중에 걸친 다층 미사일 방어망을 강화하여 도시, 항만, 지휘소를 기습 공격으로부터 지킬 것입니다. 신뢰할 수 있는 방패는 평양이 멀리서 우리를 위협할 힘을 빼앗을 것입니다."
 JAP_dprk_trilateral_training: "한미일 반도 훈련"
 JAP_dprk_trilateral_training_desc: "반도의 안보는 선언만으로 지탱될 수 없습니다. 한국, 미국과의 합동 훈련은 지역에서 가장 위험한 화약고의 즉응 태세, 상호 운용성, 위기 대응을 향상시킬 것입니다. 함께 훈련함으로써 우리는 침략에 조율된 응답이 돌아갈 것임을 알립니다."
 JAP_dprk_korean_defense_treaty: "한일 방위 협정"
 JAP_dprk_korean_defense_treaty_desc: "반도와 일본 열도는 같은 최전선을 공유합니다. 한국과의 공식 방위 협정은 정보 공유, 유사시 계획, 상호 안보 공약을 내구성 있는 틀로 묶을 것입니다. 오랜 앙금은 남아 있지만, 전략적 필요는 더 튼튼한 기반을 요구합니다."
 JAP_dprk_conditional_engagement: "평양으로의 조건부 채널"
 JAP_dprk_conditional_engagement_desc: "압박만으로는 모든 위기를 관리할 수 없습니다. 우리는 미사일 시험, 군사적 사건, 지역 불안정화에 대한 엄격한 조건에 묶인 통제된 외교 채널을 북한과 열 것입니다. 대화가 억제를 대체하지는 않지만 오판을 막을 수는 있습니다."
 JAP_dprk_normalization_framework: "관계 정상화 로드맵"
 JAP_dprk_normalization_framework_desc: "안정된 동북아시아는 영구적인 위기 관리 이상을 요구합니다. 우리는 외교적 진전을 검증 가능한 안보 공약 및 지역 보장과 연계하여 북한과의 단계적 정상화 틀을 수립할 것입니다. 모든 합의는 점진적이고, 집행 가능하며, 호혜에 뿌리를 두어야 합니다."
 JAP_dprk_support_unification: "통일 반도 지지"
 JAP_dprk_support_unification_desc: "한반도의 분단은 여러 세대에 걸쳐 동아시아 안보를 규정했지만 영구적일 필요는 없습니다. 우리는 외교, 동반국과의 조율, 지역 안정을 위한 계획을 통해 한반도 통일로 가는 평화적 경로를 지지할 것입니다. 반도가 새로 만들어진다면, 일본은 그 이후의 질서를 형성하는 데 기여해야 합니다."
 JAP_history_education: "역사 교육의 투명성"
 JAP_history_education_desc: "우리는 교육 자료와 학습 지도 요령을 검토하여 역사적 사실을 정면으로 마주해야 합니다. 투명한 역사 교육은 이웃 나라들과의 신뢰를 쌓는 첫걸음입니다."
 JAP_statement: "[ROOT.GetLeader] 담화"
 JAP_statement_desc: "역사적 사건에 대한 책임과 반성의 명확한 입장을 표명하기 위해 정부는 새로운 공식 담화를 발표할 것입니다. 이 구상은 피해 국가들과의 화해를 도모하고 상호 신뢰에 기반한 미래 지향적 관계를 증진하는 것을 목표로 합니다."
 JAP_intellectual_platform: "한중일 역사 플랫폼"
 JAP_intellectual_platform_desc: "국제연합의 중재 아래 일본, 중국, 한국은 전쟁의 기억을 미래 세대에 전하기 위한 박물관과 디지털 기록 보관소를 공동으로 기획하고 설립할 것입니다. 일본은 재정을 지원하며, 이 구상을 평화와 화해의 세계적 상징으로 자리매김시킬 것입니다."
 JAP_intellectual_platform_TT: "§Y양국이 합의에 이르면 세 나라 모두에 §G안정도§!를 높이는 국가 정신이 부여됩니다!§!"
 JAP_chi_friendship: "중국과의 관계 개선"
 JAP_chi_friendship_desc: "중일 관계를 안정시키기 위해 일본 정부는 대화를 지속하고 상호 이해를 증진하며 마찰을 관리하기 위해 노력할 것입니다. 중국은 지역 질서와 경제에 막대한 영향력을 가진 이웃 나라이며, 관계 개선은 일본의 안보 및 번영과 직결됩니다."
 JAP_chi_accept_intellectual_platform: "중국이 한중일 역사 플랫폼 설립에 동의했습니다."
 JAP_chi_trade_support: "중국 무역 제도 개혁 지원"
 JAP_chi_trade_support_desc: "중국 무역 제도의 개혁과 현대화를 위한 기술적, 제도적 지원을 제공합니다. 이는 일본 기업의 원활한 진출을 돕고 지역에서 일본의 영향력을 높입니다."
 JAP_chi_advancement_companies: "기업 간 상호 시장 진출"
 JAP_chi_advancement_companies_desc: "일본 기업과 중국 기업 간의 상호 투자와 시장 진출을 촉진하여 경제적 상호 의존을 높이고 생산성을 향상시킵니다."
 JAP_chi_kanji: "\\"한자 문화권\\" 문화 협력 프로젝트"
 JAP_chi_kanji_desc: "한자 문화권 내 국가들 간의 문화적 유대를 강화함으로써, 이 프로젝트는 공유된 가치와 역사적 결속을 강조하며 외부 영향에 대한 문화적 완충재 역할을 합니다."
 JAP_chi_temple: "불교 사찰 공동 보존 프로젝트"
 JAP_chi_temple_desc: "중일 협력을 통해 불교 사찰을 공동의 문화유산으로 보존합니다. 이 프로젝트는 관광 자산으로서의 가치를 높이고 양국의 역사적 유대를 재확인합니다."
 JAP_chi_senkaku: "센카쿠 분쟁 관리"
 JAP_chi_senkaku_desc: "센카쿠 열도를 둘러싼 긴장은 중일 관계 전반 및 동중국해의 안정과 직결되어 있습니다. 주권에 대한 우리의 입장을 유지하는 동시에, 우발적 충돌을 피하기 위한 외교적 관리 체계를 수립할 필요가 있습니다. 대화 채널을 공식적으로 마련하고, 해상 마찰을 억제하면서 우리나라에 유리한 환경에서 협상을 진행합시다."
 JAP_kor_friendship: "한국과의 관계 개선"
 JAP_kor_friendship_desc: "미래 지향적인 한일 관계를 위해 일본 정부는 신뢰를 회복하고 대화를 지속하기 위해 노력할 것입니다. 한국은 일본의 가장 중요한 이웃 나라 중 하나로 지역 안정 및 경제와 직결되어 있으며, 관계 개선은 일본의 선택지와 영향력을 넓힐 것입니다."
 JAP_kor_accept_intellectual_platform: "한국이 한중일 역사 플랫폼 설립에 동의했습니다."
 JAP_kor_accelerator: "도쿄-서울 액셀러레이터"
 JAP_kor_accelerator_desc: "스타트업 기업을 지원하고 육성하기 위해 도쿄와 서울에 공동 액셀러레이터 프로그램이 설립되어, 두 수도 간의 혁신과 경제 협력을 강화합니다."
 JAP_kor_local_companies: "지역 기업 교류 구상"
 JAP_kor_local_companies_desc: "지역 기업 간의 협력을 촉진하여 지역 수준에서 민간 산업의 성장과 발전을 가속합니다."
 JAP_kor_cultural_exchange: "문화 교류"
 JAP_kor_cultural_exchange_desc: "문화 교류를 증진함으로써 두 국민 간의 더 큰 상호 이해와 여론 영향력의 토대를 마련합니다."
 JAP_kor_aging: "한일 고령화 사회 태스크포스"
 JAP_kor_aging_desc: "고령화 사회라는 공통의 과제에 대응하기 위해 한일 공동 태스크포스가 구성되어, 매월 논의를 열고 협력 정책을 모색합니다."
 JAP_kor_liancourt_rocks: "다케시마 분쟁 관리"
 JAP_kor_liancourt_rocks_desc: "다케시마(독도) 분쟁은 한일 관계 전반에 영향을 미칠 수 있는 중요한 현안입니다. 우리나라의 입장을 확고히 유지하면서, 우발적 마찰과 외교적 긴장의 확대를 피하기 위해 대화와 실무 협의의 틀을 마련할 것입니다. 이는 다케시마(독도) 문제에 관한 한국과의 협상 제한을 해제합니다."
 JAP_approaching_russia: "러시아와의 화해"
 JAP_approaching_russia_desc: "지정학적 안정을 보장하고 자원 접근성을 확보하기 위해 우리는 에너지, 기반시설, 무역 협력에 초점을 맞춰 러시아와의 관계 개선을 목표로 하는 외교 노선을 추구합니다."
 JAP_sov_far_east_development: "극동 구상"
 JAP_sov_far_east_development_desc: "홋카이도의 한랭 기후에서 쌓은 일본의 지역 활성화 전문성을 활용하여, 이 구상은 기반시설 투자와 외국 자본을 통해 러시아 극동의 한랭 지역 개발을 촉진합니다."
 JAP_sov_saakhalin: "사할린 II"
 JAP_sov_saakhalin_desc: "화석 연료에 대한 안정적인 접근을 보장하기 위해 일본은 러시아와 협력하여 사할린 II 에너지 사업에 대한 해외 투자를 강화합니다."
 JAP_sov_logistics_corridor: "일본-유럽 물류 회랑"
 JAP_sov_logistics_corridor_desc: "우리는 러시아를 경유하여 일본과 유럽을 잇는 육상 물류 회랑을 개발할 것입니다. 러시아의 철도와 고속도로를 활용함으로써 수송 시간을 단축하고 유럽 시장에 대한 안정적인 접근을 확립하는 것을 목표로 합니다."
 JAP_sov_it_corridor: "러시아 디지털 회랑"
 JAP_sov_it_corridor_desc: "일본 IT 기업과의 협력으로 데이터 센터와 광케이블 같은 기반시설이 러시아에 구축되어, 유럽, 중앙아시아, 러시아를 잇는 디지털 무역망이 형성될 것입니다."
 JAP_sov_kuril_islands: "북방영토 분쟁 관리"
 JAP_sov_kuril_islands_desc: "북방영토 문제는 일러 관계의 근간에 관련된 미해결 현안입니다. 우리나라의 입장을 확고히 유지하면서, 대립의 고착화를 피하기 위해 외교 협상과 실무 협의의 틀을 마련할 것입니다. 러시아와의 관계를 신중히 관리하면서 북방영토 문제에 관한 협상 제한을 해제할 것입니다."
 JAP_defensive_foundations: "방위의 토대"
 JAP_defensive_foundations_desc: "일본은 헌법 제9조에 대한 엄격한 방어적 해석의 범위 안에서, 본토 방어, 위기 대응, 억제에 초점을 맞춰 자위대의 기본적인 방어 태세를 강화합니다."
 JAP_jgsdf: "육상자위대 강화"
 JAP_jgsdf_desc: "육상자위대는 기동성, 훈련, 즉응 태세를 개선하여 방어 능력을 높입니다. 이러한 조치는 이 부대가 기존의 법적, 전략적 제약 안에서 엄격히 운용되면서도 본토를 지킬 수 있도록 보장합니다."
 JAP_type_x_mbt: "10식 주력 전차 배치"
 JAP_type_x_mbt_desc: "10식은 일본 기갑 개발의 도약을 상징하며, 더 가볍고 빠르고, 일본의 험난한 지형 전역에 신속 전개하도록 특별히 설계되었습니다. 이 첨단 플랫폼의 생산을 늘리고 승무원을 훈련시킴으로써 육상자위대는 본토의 위협에 신속히 대응하는 능력을 강화합니다."
 JAP_type_manouvre_combat_vehicle: "16식 기동전투차"
 JAP_type_manouvre_combat_vehicle_desc: "16식 기동전투차는 신속 대응 부대에 고도의 기동성을 갖춘 화력을 제공합니다. 차륜식 구성 덕분에 육상자위대는 열도 전역에서 부대를 신속히 재배치할 수 있으며, 중장갑 군수에 의존하지 않고 외딴 지역을 증강합니다."
 JAP_wheeled_howitzer: "19식 차륜형 자주포"
 JAP_wheeled_howitzer_desc: "신세대 기동 포병인 19식은 현대적 사격 통제 체계와 신속한 재배치 능력을 결합합니다. 차륜식 차체는 일본의 분산되고 험준한 지리 전역에서 방어 작전에 대한 유연한 지원을 가능하게 합니다."
 JAP_chu_sam: "03식 중거리 지대공 유도탄 망 확충"
 JAP_chu_sam_desc: "일본은 03식 중거리 지대공 유도탄(Chu-SAM) 포대를 추가하여 방공 태세를 강화합니다. 이 현대적 중거리 미사일 체계는 공중 침투에 대한 방어를 강화하고 국가 조기 경보 및 추적 기반시설과 매끄럽게 통합됩니다."
 JAP_type_atgm: "보병 대전차 미사일 부대 업그레이드"
 JAP_type_atgm_desc: "육상자위대는 01식과 96식의 개량형을 포함한 향상된 대전차 유도 미사일 체계를 보병 및 정찰 요소에 장비합니다. 이러한 업그레이드는 지상군이 어떤 방어 교전에서도 현대 기갑 위협에 대응할 수 있도록 보장합니다."
 JAP_central_readiness_force: "중앙즉응집단 확충"
 JAP_central_readiness_force_desc: "중앙즉응집단은 일본 어디에서든 비상사태에 대응할 수 있는 유연하고 신속 전개 가능한 사령부로 발전합니다. 합동 훈련, 기동성, 지역 방면대와의 조율을 개선함으로써 지상 부대가 단시간에 핵심 지역을 증강할 수 있도록 보장합니다."
 JAP_civil_protection_act: "국민보호 체계 시행"
 JAP_civil_protection_act_desc: "새로운 국민보호 조치는 자위대, 지방 당국, 경찰, 긴급 구조 기관 간의 협력을 공식화합니다. 대피, 위기 대응, 기반시설 보호에 대한 명확한 법적 절차는 재난과 안보 사건 모두에서 국민을 보호하는 일본의 역량을 강화합니다."
 JAP_maritime_self_defence_force: "해상자위대 강화"
 JAP_maritime_self_defence_force_desc: "해상자위대는 해상에서 고강도 작전을 지속하기 위해 개선된 훈련, 정비, 지원 구조로 강화됩니다. 호위대군, 초계 능력, 해군 군수를 강화함으로써 일본은 핵심 해상 교통로와 연안 해역을 더 잘 지킬 수 있습니다."
 JAP_amphibious_rapid_deployment: "수륙기동단 훈련"
 JAP_amphibious_rapid_deployment_desc: "일본의 외딴 섬에서 발생하는 위기에 대응하기 위한 전담 수륙양용 신속 전개 부대가 창설됩니다. 보병, 기갑, 해상 수송을 결합한 이 여단은 일본의 해양 전선을 따라 핵심 영토를 증원하고, 확보하며, 필요하다면 탈환하도록 훈련됩니다."
 JAP_atago_destroyer: "첨단 이지스 구축함 취역"
 JAP_atago_destroyer_desc: "새로운 이지스 탑재 구축함이 취역하여 강력한 방공, 대잠, 지휘 능력을 제공합니다. 이 첨단 호위함들은 일본 현대 수상 함대의 핵심을 이루며 함대 방호와 지역 억제력을 크게 강화합니다."
 JAP_keen_sword_operation: "킨 소드 합동 훈련 확대"
 JAP_keen_sword_operation_desc: "킨 소드 훈련 시리즈는 더 복잡한 해상, 항공, 지상 요소를 포함하도록 확대됩니다. 동맹군과의 정기적인 대규모 훈련은 상호 운용성을 날카롭게 다듬고 합동 지휘 통제를 개선하며, 분쟁이 있는 지역 환경에서 효과적으로 작전할 일본의 준비 태세를 보여 줍니다."
 JAP_f2_multirole_defensive_enhancement: "F-2 다목적 기단 강화"
 JAP_f2_multirole_defensive_enhancement_desc: "F-2 기단은 인근 해역에서의 방공과 해상 타격을 개선하기 위해 항전 장비, 센서, 무기 체계를 개량받습니다. 이러한 강화는 주로 방어적인 임무 형태를 유지하면서도 항공기가 지역 위협에 더 효과적으로 대응할 수 있게 합니다."
 JAP_f15_defensive_updat_programe: "F-15 방어 개량 프로그램"
 JAP_f15_defensive_updat_programe_desc: "일본의 F-15 공중우세기가 최신 레이더, 전자전 체계 및 개량형 공대공 미사일을 포함한 전면적인 업그레이드를 거칩니다. 이렇게 개량된 편대는 날로 강력해지는 적대 세력에 맞서 자국 영공을 수호하는 일본의 방어 능력을 크게 강화합니다."
 JAP_hyuga_class: "휴가급 헬리콥터 구축함 배치"
 JAP_hyuga_class_desc: "휴가급 헬리콥터 구축함이 지휘 및 대잠전 플랫폼으로 완전한 작전 운용에 들어갑니다. 호위대군을 조율하고 다수의 헬리콥터를 운용하는 능력은 함대 방호와 해상 상황 인식을 크게 향상시킵니다."
 JAP_p_maritime_patrol: "해상 초계 항공 확충"
 JAP_p_maritime_patrol_desc: "일본은 해상 교통로를 감시하고, 잠수함을 추적하고, 수색 구조 작전을 지원하기 위해 현대적인 해상 초계기에 투자합니다. 열도 주변의 강화된 초계 범위는 국가 안보와 해상 교통의 안전을 모두 강화합니다."
 JAP_deploy_ballistic_warning_radars: "탄도 미사일 경보 레이더 배치"
 JAP_deploy_ballistic_warning_radars_desc: "지역 내 탄도 미사일 발사를 탐지하고 추적하기 위해 새로운 장거리 조기 경보 레이더가 설치됩니다. 이 센서를 국가 지휘망에 통합함으로써 일본은 위협을 평가하고, 국민에게 경보하고, 방어 대응을 조율할 소중한 몇 분을 얻습니다."
 JAP_modernize_jadge: "JADGE 방공망 현대화"
 JAP_modernize_jadge_desc: "일본 항공 방위 지상 환경(JADGE) 체계는 개선된 데이터 링크, 처리 용량, 해상 및 지상 기반 센서와의 통합으로 업그레이드됩니다. 현대화된 JADGE 망은 더 빠른 의사 결정과 방공 자산의 더 효율적인 배치를 가능하게 합니다."
 JAP_air_self_defence_force: "항공자위대 강화"
 JAP_air_self_defence_force_desc: "항공자위대는 더 높은 작전 속도를 감당하기 위해 훈련 프로그램, 기지 기반시설, 지원 부대를 확대합니다. 이러한 개선은 지역 항공 환경이 더 까다로워지는 가운데 일본이 지속적인 공중 초계, 신속 긴급 발진, 복잡한 합동 훈련을 이어 갈 수 있도록 보장합니다."
 JAP_article_nine_transition_comittee: "방위 전환 위원회 설립"
 JAP_article_nine_transition_comittee_desc: "일본의 현대화된 국방 태세로의 전환을 조율하기 위한 전담 위원회가 구성됩니다. 정책 입안자, 군사 기획자, 법률 전문가를 한데 모음으로써 일본은 책임의 변화를 관리하고 안정적이며 체계적인 전환을 보장할 수 있습니다."
 JAP_article_nine_transition_comittee_tt: "§G해석 수준에 따라 제9조 세력 균형 변동치가 더 이상 변하지 않습니다. 이제 국가 중점에 접근할 수 있으며, 제9조는 완전히 제거됩니다§!"
 JAP_secure_public_support: "방위 개혁에 대한 국민적 지지 확보"
 JAP_secure_public_support_desc: "일본 방위 정책의 진화를 설명하고, 국민의 우려를 해소하며, 새로운 안보 태세에 대한 신뢰를 쌓기 위한 전국적 노력이 시작됩니다. 사회의 폭넓은 지지는 정치적 안정을 보장하고 전환 과정의 마찰을 줄입니다."
 JAP_modernize_joint_command: "합동 지휘 구조 현대화"
 JAP_modernize_joint_command_desc: "군대는 작전 지휘부를 하나의 통합된 합동 구조로 통합하여 상호 운용성과 즉응 태세를 개선합니다. 현대적 합동 계획과 공동 훈련 기준은 복잡한 안보 시나리오에 대한 더 효율적인 대응을 가능하게 합니다."
 JAP_normalize_defense_procurement: "방위 조달 체계 정상화"
 JAP_normalize_defense_procurement_desc: "일본은 방위 조달을 간소화하고, 산업 역량을 확대하며, 국내 제조사와의 조율을 강화합니다. 투명하고 현대화된 조달 절차는 핵심 방위 사업이 효율적이고 지속 가능하게 인도되도록 보장합니다."
 JAP_formalize_national_defense: "국방 능력 공식화"
 JAP_formalize_national_defense_desc: "일본은 확대된 방위 책임을 공식적으로 법제화하여 역할, 임무, 장기 전략 목표를 명확히 합니다. 전환이 완료됨에 따라 군대는 점점 복잡해지는 지역 환경에서 국익을 지키기 위해 설계된 통일된 비전 아래 작전합니다."
 JAP_normalize_defense_procurement_done: "방위 조달 정상화됨"
 JAP_modernize_joint_command_done: "합동 지휘 현대화 완료"
 JAP_consolidate_national_defense_framework_done: "국방 체계 공고화됨"
 JAP_rebuild_blue_water_navy: "외양 해군 재건"
 JAP_rebuild_blue_water_navy_desc: "일본은 군수, 보급 능력, 장거리 호위 전력을 확대하며 본국 해역을 훨씬 넘어서는 지속 작전에 대비해 함대를 준비시킵니다. 되살아난 외양 해군은 일본이 해상 교통로를 지키고, 동반국을 지원하며, 더 넓은 지역의 위기에 대응할 수 있게 합니다."
 JAP_carrier_aviation_tt: "[JAP_carrier_aviation_idea_desc]\n"
 JAP_carrier_aviation_development: "함재 항공 개발 프로그램"
 JAP_carrier_aviation_development_desc: "함재 운용이 가능한 항공 전력을 개발하기 위한 전담 프로그램이 시작되어 해군 전투기, 갑판 운용, 전문 훈련을 통합합니다. 신뢰할 수 있는 함재 항공 전력의 구축은 억제와 전투 작전 모두에서 함대의 도달 범위와 유연성을 극적으로 높입니다."
 JAP_submarine_modernization_project: "잠수함 현대화 사업"
 JAP_submarine_modernization_project_desc: "일본은 더 조용한 선체, 첨단 센서, 현대적 무기로 잠수함 전력을 개량합니다. 신세대 공격 잠수함은 수중 억제력, 해상 거부 능력, 분쟁 해역을 깊이 감시하는 능력을 강화합니다."
 JAP_expand_multi_role_destroyer_fleet: "다목적 구축함 전력 확충"
 JAP_expand_multi_role_destroyer_fleet_desc: "방공, 대잠전, 수상 타격 능력을 하나의 유연한 플랫폼에서 제공하기 위해 추가 다목적 구축함이 취역합니다. 이 호위함들은 일본의 확대된 해상 기동 부대의 중추를 이룹니다."
 JAP_establish_joint_rapid_deployment_command: "합동 신속 전개 사령부 창설"
 JAP_establish_joint_rapid_deployment_command_desc: "신속 전개 가능한 육상, 항공, 해상 요소를 조율하기 위해 합동 사령부가 창설됩니다. 통합된 계획과 사전에 마련된 유사시 대응을 통해 일본은 더 넓은 전략 환경 어디에서든 위기에 신속하게 반응할 수 있는 전력을 얻습니다."
 JAP_full_defense_industrial_mobilisation: "전면적 방위 산업 동원"
 JAP_full_defense_industrial_mobilisation_desc: "일본은 산업 기반, 연구 기관, 물류망을 포괄적인 방위 생산 계획 아래 정렬합니다. 표준화된 조달, 장기 계약, 확대된 생산 능력은 함선, 차량, 항공기, 첨단 무기의 지속적인 제조를 가능하게 합니다."
 JAP_long_range_strike_missile_artillery_forces: "장거리 타격 및 미사일 포병 전력"
 JAP_long_range_strike_missile_artillery_forces_desc: "원거리에서 정밀 타격을 가하기 위한 전문 미사일 및 포병 부대가 편성됩니다. 첨단 탄약을 현대적인 표적 지정 및 지휘 체계와 결합함으로써 일본은 먼 곳의 군사 자산과 핵심 기반시설을 위협할 능력을 얻습니다."
 JAP_expand_mechanized_brigades: "기계화 여단 확충"
 JAP_expand_mechanized_brigades_desc: "기존 기계화 부대가 증강되고 현대식 보병 전투차와 지원 기갑을 갖춘 신규 여단이 창설됩니다. 이러한 확충은 지상에서의 기동성, 방호력, 지속 전투 능력을 향상시킵니다."
 JAP_deploy_next_generation: "차세대 전투 부대 배치"
 JAP_deploy_next_generation_desc: "전투 부대는 차세대 장비, 네트워크화된 지휘 체계, 제병협동 교리를 중심으로 재편됩니다. 이 부대들은 신속 전개, 높은 생존성, 복잡하고 고강도인 환경에서의 효과적인 작전을 위해 설계되었습니다."
 JAP_national_defense_professionalization: "국방 전문화"
 JAP_national_defense_professionalization_desc: "일본은 모든 군종에 걸쳐 전문 군사 교육, 경력 개발, 현대적 인사 체계에 투자합니다. 더 유능하고, 경험 많고, 결속력 있는 장교 및 부사관단은 즉응 태세를 높이고, 리더십을 개선하며, 국방군의 장기적인 효율을 지탱합니다."
 JAP_integrated_air_space_command: "통합 항공우주 사령부"
 JAP_integrated_air_space_command_desc: "방공, 조기 경보, 위성 지원, 우주 감시를 조율하기 위한 통합 항공우주 사령부가 설립됩니다. 지상 레이더, 공중 센서, 궤도 플랫폼의 정보를 융합함으로써 일본은 전장 공간에 대한 더 명확한 상황 인식을 얻고 새로 떠오르는 위협에 더 신속히 대응할 수 있습니다."
 JAP_establish_long_range_strike_aviation: "장거리 타격 항공 전력 창설"
 JAP_establish_long_range_strike_aviation_desc: "현대적 항공기와 원거리 발사 무기를 갖춘 전담 장거리 타격 항공 부대가 편성됩니다. 이 전력은 먼 거리의 핵심 표적을 타격하는 능력을 제공하여 더 넓은 지역에서의 억제와 합동 작전을 뒷받침합니다."
 JAP_mext_generation_air_dominance: "차세대 제공 전투기"
 JAP_mext_generation_air_dominance_desc: "일본은 스텔스, 첨단 센서, 네트워크화된 전투 체계를 결합한 차세대 제공 전투기의 개발을 가속합니다. 이 프로그램은 공군이 점점 더 분쟁이 심해지는 하늘에서 앞으로도 오래도록 우위를 유지할 수 있도록 보장합니다."
 JAP_advanced_missile_development: "첨단 미사일국"
 JAP_advanced_missile_development_desc: "첨단 미사일 체계의 연구, 시험, 생산을 총괄하기 위한 전담 국이 설립됩니다. 현대적 공대공 및 대함 무기에서 장거리 정밀 타격 능력에 이르기까지, 이 노력은 일본의 무기고를 넓히고 모든 군종의 실효성을 높입니다."
 JAP_high_tech_domestic_manufacturing: "첨단 국내 방위 제조"
 JAP_high_tech_domestic_manufacturing_desc: "일본은 항전 장비, 센서, 복합재 구조물, 추진 체계의 고급 제조에 투자합니다. 핵심 부품의 국내 공급망을 강화하면 외국 공급업체에 대한 의존이 줄고 항공 및 미사일 플랫폼의 신속한 개량이 뒷받침됩니다."
 JAP_establish_japan_defense_technology_agency: "일본 방위 기술청"
 JAP_establish_japan_defense_technology_agency_desc: "산업계, 학계, 군대 전반의 연구, 조달, 혁신을 조율하기 위해 중앙집중식 방위 기술청이 창설됩니다. 일원화된 감독은 개발 주기를 단축하고, 중복을 줄이며, 유망한 구상이 실험실에서 일선 부대로 신속히 옮겨 가도록 보장합니다."
 JAP_atla_defense_technology_consolidation: "ATLA 기술 통합"
 JAP_atla_defense_technology_consolidation_desc: "방위장비청(ATLA)은 군의 모든 군종에 걸친 연구, 개발, 조달을 조율하는 중심 역할을 맡습니다. 방위 기술 프로그램을 단일 기관 아래 통합함으로써 일본은 중복을 줄이고, 혁신을 가속하며, 유망한 사업을 더 신속히 실전 배치할 수 있습니다."
 JAP_gifu_test_aerospace_development_center: "기후 시험 및 항공우주 개발 센터"
 JAP_gifu_test_aerospace_development_center_desc: "기후는 항공기, 항전 장비, 무기 체계를 위한 일류 시험 평가 거점으로 개발됩니다. 전용 사격장, 계측 장비를 갖춘 공역, 전문 기술 팀이 엄격한 시험을 뒷받침하여 새 설계가 일선 투입 전에 철저히 검증되도록 보장합니다."
 JAP_aichi_nagoya_aerospace_defense_cluster: "아이치-나고야 항공우주 방위 클러스터"
 JAP_aichi_nagoya_aerospace_defense_cluster_desc: "아이치-나고야 지역은 주요 제조사, 협력업체, 연구소를 잇는 선도적인 항공우주 및 방위 생산 클러스터로 육성됩니다. 이 지역에 대한 집중 투자는 군용 및 겸용 플랫폼을 위한 기체, 엔진, 첨단 부품의 생산량을 끌어올립니다."
 JAP_kobo_maritime_heavy_industry_corridor: "고베 해양 중공업 회랑"
 JAP_kobo_maritime_heavy_industry_corridor_desc: "고베와 주변 연안 도시들이 끊김 없는 해양 중공업 회랑으로 개발됩니다. 확장된 조선소, 제철소, 해양 공학 기업은 더 크고 더 유능한 함대와 그 지원 기반시설을 건조하고 유지할 역량을 제공합니다."
 JAP_nagasaki_shipyard_defense: "나가사키 조선소 방위 통합"
 JAP_nagasaki_shipyard_defense_desc: "나가사키의 주요 조선소가 국방 계획에 더 깊이 통합되어 호위함, 지원선, 특수 해군 플랫폼에 추가 역량을 할애합니다. 조선소와 해군 간의 긴밀한 조율은 건조 기간을 단축하고 함대의 즉응 태세를 개선합니다."
 JAP_kure_naval_arsenal_revival: "구레 해군 공창 부활"
 JAP_kure_naval_arsenal_revival_desc: "구레의 역사적인 해군 시설이 현대적인 조선 및 수리 단지로 되살아납니다. 개량된 독, 작업장, 물류 거점은 일선 군함의 정비, 개수, 개량을 위한 핵심 거점이라는 도시의 역할을 회복시킵니다."
 JAP_sasebo_fleet_support_complex: "사세보 함대 지원 단지"
 JAP_sasebo_fleet_support_complex_desc: "사세보는 개선된 수리 능력, 탄약 저장고, 보급 기반시설을 갖춘 종합 함대 지원 단지로 확장됩니다. 일본 서부에 위치한 덕분에 인근 해역과 주요 해상 길목에서의 작전을 지속하기에 이상적인 거점입니다."
 JAP_yokosuka_dockyard_expansion: "요코스카 조선소 확장"
 JAP_yokosuka_dockyard_expansion_desc: "요코스카의 조선소와 부속 시설이 더 많은 함선과 더 깊은 정비 주기를 감당하도록 확대됩니다. 일본의 주요 해군 기지 중 하나인 요코스카의 확장은 주요 수상 전투함을 전개 가능한 상태로 유지하는 해군의 능력을 크게 높입니다."
 JAP_revitalize_defense_production: "방위 생산 기반 재활성화"
 JAP_revitalize_defense_production_desc: "일본은 핵심 제조사를 지원하고, 장기 계약을 안정시키며, 생산 라인을 개량하여 방위 산업 기반을 되살리는 광범위한 노력을 기울입니다. 더 건강한 산업 토대는 나라가 군대를 안정적으로 장비하고 새로운 작전 요구에 더 신속히 적응할 수 있게 합니다."
 JAP_kaguya_starward_expedition: "가구야 별을 향한 원정"
 JAP_kaguya_starward_expedition_desc: "빛의 옷을 입고 달로 돌아간 가구야 공주 이야기에서 영감을 받아, 일본은 지구 근접 소행성에 대한 야심 찬 심우주 조사를 개시합니다. 첨단 로봇 탐사선과 채굴 시연기가 허공으로 파견되어 전설을 기술로 바꾸고 별들 사이의 미래 자원 채취를 위한 토대를 마련합니다."
 JAP_kaguya_starward_expedition_tt: "§Y우리의 달 탐사 임무가 시작됩니다!§!"
 JAP_tsukuyomi_lunar_program: "쓰쿠요미 달 프로그램"
 JAP_tsukuyomi_lunar_program_desc: "일본 신화의 달의 카미 쓰쿠요미의 이름을 딴 이 프로그램은 산업계, 연구 기관, 우주 기관을 지속적인 달 탐사 노력 아래 결집시킵니다. 궤도선, 착륙선, 표면 기반시설은 달을 먼 상징에서 실체가 있는 전초 기지로 탈바꿈시켜, 과학, 항법, 그리고 일본의 우주 진출 미래의 장기적 포부에 기여합니다."
 JAP_amaterasu_martian_dawn: "아마테라스 화성의 새벽"
 JAP_amaterasu_martian_dawn_desc: "떠오르는 태양의 여신 아마테라스의 이름 아래 일본은 붉은 행성에 손을 뻗습니다. 장거리 탐사선, 첨단 추진 기관, 선구적인 생명 유지 연구가 새로운 화성 탐사의 물결을 뒷받침합니다. 각 임무는 인간 창의력의 경계를 밀어내며, 화성의 아득한 불빛을 일본 첨단 문명의 다음 지평선으로 바꿉니다."
 JAP_restore_imperial_household: "황실 복원"
 JAP_restore_imperial_household_desc: "황실은 의례에서 벗어나 국정 행정으로 들어서며 제도적 역량과 공식적인 궁정 역할을 되찾습니다. 정당성은 국화 옥좌가 조건을 추인하는 것이 아니라 스스로 정하도록 재편됩니다. 이제 모든 파벌은 편을 선택해야 합니다."
 JAP_reinstate_former_imperial_houses: "구 황족 복권"
 JAP_reinstate_former_imperial_houses_desc: "구 황족 가문들이 복권되고 지위가 회복되어 옥좌를 계승할 자격이 있는 가지가 넓어집니다. 군주주의자들은 이를 끊이지 않는 혈통의 수호로 환영하고, 입헌주의자들은 정치 공학이라고 비난합니다. 논쟁이 어느 쪽으로 귀결되든 계승은 안전합니다."
 JAP_male_line_succession_act: "남계 계승법 통과"
 JAP_male_line_succession_act_desc: "계승의 불확실성은 국내 논란인 동시에 전략적 취약점입니다. 우리는 모호함을 없애고 앞으로 여러 세대에 걸친 왕조의 연속성을 확보하기 위해 남계 계승을 법률로 성문화할 것입니다. 이 조치는 군주주의자들의 지지를 공고히 하겠지만, 이를 현대 일본으로부터의 후퇴로 보는 개혁파의 격렬한 반대에 불을 지필 것입니다."
 JAP_imperial_rites_restored: "황실 제사 복원"
 JAP_imperial_rites_restored_desc: "의례 없는 옥좌는 무게 없는 왕관입니다. 우리는 황실 제사를 국가가 인정하는 의식으로 복원하여 군주제의 신성한 토대와 나라의 연속성을 재확인할 것입니다. 이로써 우리는 정치권의 찬반과 상관없이 현대 국가를 고대의 정당성에 묶습니다."
 JAP_recall_privy_council: "추밀원 재소집"
 JAP_recall_privy_council_desc: "의회 정치는 소란스럽고 덧없으며 장기적인 국정 운영에서 점점 멀어졌습니다. 우리는 옥좌에 신중하고, 경험 많고, 국가의 연속성에 충성하는 상설 자문 기구를 마련하기 위해 추밀원을 재소집할 것입니다. 추밀원의 복귀는 군주주의자들에게는 안정을 주는 닻으로, 반대자들에게는 선출되지 않은 권력 중심으로 보일 것입니다."
 JAP_imperial_reform_commission: "황실 개혁 위원회 설치"
 JAP_imperial_reform_commission_desc: "복고에는 임기응변이 아니라 구조가 필요합니다. 우리는 쇄신된 군주제를 위한 법적, 제도적 청사진을 기초하고 부처, 궁정 관서, 보안 기관을 하나의 국가 독트린 아래 정렬하기 위해 황실 개혁 위원회를 설치할 것입니다. 위원회가 소집되면 상징을 정책으로 바꾸고 후퇴를 정치적으로 불가능하게 만들 것입니다."
 JAP_imperial_audience: "황실 알현 개최"
 JAP_imperial_audience_desc: "정당들은 대등한 존재가 아니라 옥좌 앞의 청원자로서 소환될 것입니다. 면밀히 연출된 황실 알현에서 우리는 선출 정치가 국가를 지휘하는 것이 아니라 섬기는 새로운 질서에 파벌 지도자들을 묶을 것입니다. 국화 옥좌가 현대판 막부를 주재하려면, 먼저 정치권이 그 논리에 고개를 숙이게 해야 합니다."
 JAP_imperial_civic_oath: "황실 시민 선서 공포"
 JAP_imperial_civic_oath_desc: "새로운 질서에는 칙령 이상의 것, 곧 공유된 충성이 필요합니다. 우리는 관료, 군인, 시민 기관을 정당성의 궁극적 원천인 옥좌에 묶는 황실 시민 선서를 공포할 것입니다. 이로써 우리는 충성을 법으로 만들고 반대를 배신처럼 느끼게 합니다."
 JAP_unified_intelligence_secretariat: "통합 정보 사무국 창설"
 JAP_unified_intelligence_secretariat_desc: "현대의 막부는 눈이 멀 수 없습니다. 우리는 경쟁하는 기관들을 단일 지휘 계통으로 보고하고 옥좌의 전략적 판세를 지키는 통합 정보 사무국으로 통합할 것입니다. 이는 우리의 국정 운영을 하루아침에 날카롭게 하는 한편, 경쟁자들에게는 이제 궁정이 아는 것을 두려워할 온갖 이유를 줄 것입니다."
 JAP_blue_water_navy: "외양 해군 건설"
 JAP_blue_water_navy_desc: "일본의 운명은 바다에 있으며 우리의 안보는 수평선에서 끝날 수 없습니다. 우리는 본국 해역에서 멀리 떨어져 작전하고, 해상 교통로를 지키며, 우리의 이익이 요구하는 곳에 힘을 투사할 수 있는 진정한 외양 해군을 건설할 것입니다. 함대를 옥좌의 강철 도구로 삼아, 세계는 일본이 남기는 항적으로 일본을 가늠하는 법을 배울 것입니다."
 JAP_imperial_defense_council: "황실 방위 회의 구성"
 JAP_imperial_defense_council_desc: "전략을 선거 주기와 부처 간 경쟁에 맡겨 둘 수는 없습니다. 우리는 군대, 정보 지도부, 핵심 부처를 옥좌에 닻을 내린 단일 전략 독트린 아래 통합하기 위해 황실 방위 회의를 구성할 것입니다. 단번에 일본의 안보 정책은 일관성을 갖추게 되고 파벌이 내부에서 방해하기가 훨씬 어려워집니다."
 JAP_rare_earth_resilience: "황실 전략 비축"
 JAP_rare_earth_resilience_desc: "제국 정부는 대형 무역 상사들에게 공급선을 확보하고 어떤 전쟁이나 금수 조치에도 대비하여 원유와 전략 금속을 비축하도록 지시합니다. 황실과 부처들은 함께 나라의 물질적 힘줄을 황실을 위해 위탁 보유합니다. 천황의 영토가 자유롭게 살 수 없는 것은 스스로의 손으로 비축하고 지킵니다.\n-------------\n§Y$JAP_national_energy_security$§!이(가) 이미 달성되었다면, 비축은 확고한 기반 위에 쌓여 전략 금속 이점을 §G두 배§!로 얻습니다."
 JAP_national_shipbuilding_plan: "제국 함대 확장 계획"
 JAP_national_shipbuilding_plan_desc: "옥좌는 연안 방어에 만족하지 않을 것이며, 일본은 우리의 운명을 가르는 바다를 지배할 것입니다. 제국 함대 확장 계획에 따라 우리는 조선소 역량을 급증시키고, 장기 해군 조달을 확정하며, 기공부터 취역까지 끊김 없는 건조 주기를 추진할 것입니다. 이 계획이 진행되면 경쟁자들은 일본의 의도를 논하지 않을 것입니다. 우리의 선체를 세게 될 것입니다."
 JAP_imperial_war_cabinet: "황실 전시 내각 소집"
 JAP_imperial_war_cabinet_desc: "위기의 시기에 일본은 지연, 위원회, 당리당략의 흥정으로 통치될 수 없습니다. 우리는 지휘 권한을 중앙집중화하고 정치 지도부를 옥좌의 위임 아래 하나의 전략 노선에 묶기 위해 황실 전시 내각을 소집할 것입니다. 이 순간부터 국가는 하나의 목소리로 행동할 것이며, 그것은 천황의 목소리일 것입니다."
 JAP_russian_lost_territories: "북방영토 수복"
 JAP_russian_lost_territories_desc: "일본은 러시아가 점유한 섬과 해역에 대한 영유권 주장을 외교적 형식이 아닌 실질적 지렛대가 뒷받침하는 주권적 요구로서 밀어붙입니다. 모스크바가 거부한다면 일본은 어디까지 나아갈 준비가 되어 있는지 결정해야 합니다. 북방은 조약과 침묵 뒤에 닫혀 있지 않을 것입니다."
 JAP_fight_china_again: "용과 국화"
 JAP_fight_china_again_desc: "오랜 분쟁은 결코 진정으로 해결되지 않았으며, 조약과 변화하는 균형 뒤로 미뤄졌을 뿐입니다. 우리는 산업, 군대, 국민의 의지를 결집하여 지역의 미래를 결정지을 전쟁을 위해 다시 한번 중국과 맞설 준비를 갖출 것입니다. 이번에 일본은 생존만을 위해서가 아니라 그 뒤에 올 질서를 위해 싸울 것입니다."
 JAP_reclaim_pacific_rim: "환태평양 권한 주장"
 JAP_reclaim_pacific_rim_desc: "일본의 번영과 안보는 해상 교통로에서 도서 사슬, 먼 해상 길목에 이르기까지 태평양 전역에 새겨져 있습니다. 우리는 함대 주둔, 기지 접근권, 경제적 지렛대로 뒷받침되는 국가 정책으로서 해양 영향력을 다루는 환태평양 권한을 주장할 것입니다. 남들이 지도를 그리는 것을 지켜보던 시대는 끝났습니다. 이제 일본이 그것을 빚을 것입니다."
 JAP_office_for_colonialism: "대동아성 부활"
 JAP_office_for_colonialism_desc: "행정 없는 제국은 스스로의 무게에 무너지는 정복입니다. 우리는 해외 통치, 안보 체제, 경제 통합을 단일 제국 독트린 아래 조율하기 위해 대동아성을 부활시킬 것입니다. 권역을 지휘할 하나의 부처가 있으면 일본의 영향력은 더 이상 즉흥적이지 않고 관리되고, 확장되며, 집행될 것입니다."
 JAP_office_for_colonialism_tt: "아시아 국가에서의 점령법을 해금합니다:\n"
 JAP_reclaim_south_chinese_sea: "남쪽 바다 장악"
 JAP_reclaim_south_chinese_sea_desc: "남중국해는 아시아의 동맥이며, 이를 통제하는 자가 무역, 연료, 권력의 흐름을 통제합니다. 우리는 이 해역에서 지배권을 되찾기 위해 움직여, 어떤 도전자에게도 우리의 의지를 관철할 주둔, 기지, 해군력을 확립할 것입니다. 일본은 접근을 요청하지 않고 무력으로 보장할 것입니다."
 JAP_reclaim_indochina: "인도차이나 복귀"
 JAP_reclaim_indochina_desc: "인도차이나는 항구, 자원, 해상 교통로가 지역의 균형을 누가 정하는지 결정하는 동남아시아의 교차로에 놓여 있습니다. 우리는 압력, 무력, 정치 공작으로 이 영토들을 다시 일본의 전략적 지휘 아래 돌려놓기 위해 복귀할 것입니다. 일단 확보되면 우리 해양 권역의 남쪽 측면은 영구적인 영향력에 닻을 내릴 것입니다."
 JAP_reclaim_australia: "남쪽의 닻"
 JAP_reclaim_australia_desc: "오스트레일리아는 함대, 항공 전력, 장기전을 좌우하는 군수를 수용할 수 있는 대륙으로서 남태평양의 쐐기돌입니다. 우리는 이를 습격이나 시늉이 아닌 우리 해양 권역의 영구적인 닻으로서 일본의 전략적 통제 아래 두기 위해 움직일 것입니다. 남쪽이 확보되면 태평양은 일본의 호수가 됩니다."
 JAP_reclaim_myanmar: "이라와디 관문 확보"
 JAP_reclaim_myanmar_desc: "미얀마는 남아시아와 동남아시아를 잇는 육교로, 벵골만을 지역의 심장부와 연결하는 경로를 통제합니다. 우리는 무력과 정치적 압력으로 이를 되찾고, 항구, 비행장, 회랑을 일본의 더 넓은 권역의 자산으로 바꾸기 위해 움직일 것입니다. 이라와디 관문이 확보되면 우리의 남쪽 측면은 훨씬 도전하기 어려워집니다."
 JAP_reclaim_the_pacific: "우리의 변경으로서의 대양"
 JAP_reclaim_the_pacific_desc: "태평양은 먼 공간이 아니라 일본의 생존과 위대함을 결정하는 변경입니다. 우리는 함대 주둔, 섬 거점, 도쿄가 빚은 해양 질서를 집행할 의지를 통해 이를 되찾을 것입니다. 대양이 우리의 변경이 되면 모든 경쟁자는 우리의 그림자 아래에서 움직이도록 강요당할 것입니다."
 JAP_reclaim_north_korea: "북쪽을 도쿄의 손 아래 묶다"
 JAP_reclaim_north_korea_desc: "우리는 평양에서 전략적 자율성을 박탈하고 그 대외 정책을 일본의 감독 아래 두는 합의를 강제할 것입니다. 통제된 접근, 안보 보장, 자원과 재건에 대한 강력한 지렛대를 통해 북쪽은 예측할 수 없는 위협이 아니라 종속된 완충지대로 바뀔 것입니다. 이는 환상 없는 지배이며, 설계에 의해 집행되는 안정입니다."
 JAP_reclaim_south_korea: "보호국 체제 강요"
 JAP_reclaim_south_korea_desc: "우리는 영향력을 넘어 한국의 외교 및 안보 정책을 도쿄의 방침에 묶는 보호국 체제를 수립할 것입니다. 통제된 협정, 고문관, 핵심 기관에 대한 지렛대를 통해 한국은 공개적인 병합 없이도 종속적 지위에 놓이게 될 것입니다. 이는 서류, 압력, 영속성으로 건설된 현대적 제국입니다."
 JAP_reclaim_taiwan: "대만 보호국 수립"
 JAP_reclaim_taiwan_desc: "우리는 대만의 국방과 외교 정책을 도쿄의 방침에 묶는 보호국 체제를 강요함으로써 영향력에서 통제로 나아갈 것입니다. 보장, 기지 사용권, 제도적 지렛대를 통해 이 섬은 공개적인 병합 없이도 충성스러운 해양 보루로 확보될 것입니다. 이는 해군력과 정치적 압력으로 집행되는 현대적 제국의 방식입니다."
 JAP_basic_reconstruction_policy: "부흥 정책"
 JAP_basic_reconstruction_policy_desc: "동일본 대지진이 초래한 전례 없는 참화에 이어, 정부는 부흥을 위한 기본 방침을 수립해야 합니다. 생계 회복, 기반시설 재건, 산업 재활성화를 위한 국가적 틀을 제시하는 것이 국민의 신뢰를 되찾고 사회를 안정시키는 첫걸음이 될 것입니다."
 JAP_tohoku_infrastructure: "도호쿠 기반시설 재건"
 JAP_tohoku_infrastructure_desc: "지진과 쓰나미는 도호쿠의 교통망과 생명선에 치명적인 피해를 입혔습니다. 도로, 철도, 항만의 재건은 지역 공동체를 회복시키고 지역의 복구를 앞당기는 첫걸음입니다. 이 노력에는 막대한 비용과 시간이 들겠지만 미룰 수 없습니다."
 JAP_fishery_revival: "농수산업 복구"
 JAP_fishery_revival_desc: "쓰나미는 도호쿠의 어항과 농지를 파괴하여 수많은 생계를 무너뜨렸습니다. 이 부문들을 재건하면 지역의 경제적 토대가 회복되고 안정적인 식량 공급이 보장됩니다. 이 노력은 지역 복구와 국가 안보 모두에 필수적입니다."
 JAP_tohoku_port: "도호쿠 항만 기능 복구"
 JAP_tohoku_port_desc: "쓰나미는 항만 시설과 조선소를 마비시켜 물류와 해상 무역을 중단시켰습니다. 재건은 지역 산업을 되살리고 핵심적인 국내외 항로를 다시 열 것입니다. 이러한 관문의 회복은 일본의 보다 폭넓은 경제 회복에 필수적입니다."
 JAP_power_supply: "전력 안정화"
 JAP_power_supply_desc: "재해로 많은 발전 시설과 송전망이 파손되어 심각한 전력 부족이 발생했습니다. 우리는 국민과 산업 모두의 안정을 위해 대체 전원을 신속히 확대하고 전력망을 보강해야 합니다."
 JAP_kanto_infrastructure: "간토 기반시설 재건"
 JAP_kanto_infrastructure_desc: "재해는 특히 북부를 중심으로 간토 지방에 심각한 피해를 입혀 교통망과 도시 기능을 마비시켰습니다. 수도권을 떠받치는 기반시설의 복구는 경제 활동을 되살리고 국가 안정을 유지하는 데 필수적입니다. 신속하고 잘 짜인 재건이 시급합니다."
 JAP_reconstruction_agency: "부흥청 설치"
 JAP_reconstruction_agency_desc: "재해 이후의 복구를 가속하고 조율하기 위해 정부는 부흥청을 설치할 것입니다. 이 전담 기구는 중앙과 지방 당국 간의 노력을 통합하여 복구 계획이 효과적으로 이행되도록 보장할 것입니다."
 JAP_industrial_recovery: "산업 기반 복구"
 JAP_industrial_recovery_desc: "재해는 공장과 산업 시설에 심각한 피해를 입혔습니다. 산업 기반을 재건함으로써 우리는 고용을 회복하고 경제 복구를 가속할 수 있습니다."
 JAP_funding_local_governments: "피해 지자체 지원"
 JAP_funding_local_governments_desc: "복구를 지원하고, 생계를 재건하며, 공공 서비스를 유지할 수 있도록 피해 지역의 지방 정부에 자금을 제공합니다."
 JAP_housing_reconstruction: "이재민 주택 재건"
 JAP_housing_reconstruction_desc: "임시 주택과 장기 주거 지구의 건설을 가속하여 실향민 가족이 대피소를 떠나게 하고 마을에 영구 정착을 위한 명확한 계획을 제시합니다."
 JAP_reconstruction_completed_focus: "부흥 완료"
 JAP_reconstruction_completed_focus_desc: "도호쿠 전역에서 긴급 재건에서 장기 활성화로의 전환을 알립니다. 핵심 기반시설이 복구되고, 산업이 다시 가동되며, 마을은 생존에서 성장으로 옮겨 가기 시작합니다."
 JAP_trilateral_anti_north_korea_training: "한미일 반도 즉응 태세"
 JAP_trilateral_anti_north_korea_training_desc: "한국, 미국과의 정기적인 합동 훈련은 반도의 위기 대응을 위한 공통의 지침서를 만들어 냈습니다. 상호 운용 가능한 지휘 절차, 연합 공중 및 해상 훈련, 조율된 미사일 방어 절차는 평양의 어떤 도발에도 신속하고, 통일되고, 신뢰할 만한 응답이 돌아가도록 보장합니다."
 JAP_dprk_policy_idea: "일본 정책의 침투"
 JAP_dprk_policy_idea_desc: "도쿄의 새로운 한반도 정책은 이전에는 없던 채널을 열었습니다. 외교적 접촉, 비공식 중개인, 경제적 지렛대, 정보 공작을 통해 일본은 북한의 정치 환경 안에서 영향력을 넓힐 일시적인 기회를 얻었습니다. 이 기회는 취약하고 경합 중이지만, 당분간 평양에서 일본의 압력과 존재감은 이전보다 더 큰 무게를 지닙니다."
 JAP_entrenched_demand_shortfall_idea_1: "고착된 수요 침체"
 JAP_entrenched_demand_shortfall_idea_1_desc: "디플레이션 기대와 미래에 대한 불안이 가계 지출을 억누르고 있으며, 기업은 약한 수요 앞에서 투자를 미루고 있습니다. 임금은 정체되고 물가는 거의 움직이지 않으며, 누구도 먼저 지갑을 열려 하지 않습니다. 일본 경제는 붕괴하고 있지 않지만, 마비 상태로 인해 기력이 빠져나가고 있습니다.\n-------------\n§Y$JAP_japanese_economy_decisions$§!의 결정을 사용하여 §Y수요 회복 진행도§!를 최소 §G30§!까지 올리면 이 국가 정신의 효과를 §G완화§!할 수 있습니다!"
 JAP_transparency_and_audit_reform_modifier: "투명성 및 감사 개혁"
 JAP_transparency_and_audit_reform_modifier_desc: "우리는 정보 공개와 공문서 관리를 강화하고, 디지털화와 독립적인 감사를 통해 부정행위의 여지를 줄일 것입니다. 낙하산 인사(아마쿠다리)와 정치 자금의 불투명성을 해결함으로써 행정 효율과 신뢰, 그리고 외부 영향에 대한 회복력을 높일 것입니다."
 JAP_protecting_human_rights_modifier: "$JAP_protecting_human_rights$"
 JAP_protecting_human_rights_modifier_desc: "$JAP_protecting_human_rights_desc$"
 JAP_worker_protection_modifier: "노동자 보호"
 JAP_worker_protection_modifier_desc: "우리는 노동자의 생계와 직장에서의 안전을 지키고, 사람들이 장기간 계속 일할 수 있는 여건을 조성할 것입니다. 임금 인상과 처우 개선을 지원하고 경제적 불안을 덜어 줌으로써 사회 안정과 산업의 토대를 강화할 것입니다."
 JAP_redistribution_modifier: "$JAP_redistribution$"
 JAP_redistribution_modifier_desc: "$JAP_redistribution_desc$"
 JAP_leading_disarmament_idea: "$JAP_leading_disarmament$"
 JAP_leading_disarmament_idea_desc: "$JAP_leading_disarmament_desc$"
 JAP_leading_disarmament_idea_3: "평화 국가로서의 발전"
 JAP_leading_disarmament_idea_3_desc: "우리는 군사력에 의존하지 않는 국가의 길을 분명히 하고 자원과 인재를 민간 발전으로 돌릴 것입니다. 산업 기반과 도시 기능의 강화를 우선시하고 민간 산업과 업무 지구의 건설을 가속함으로써 생활 수준을 높이고 경제 성장을 이끌 것입니다."
 JAP_prioritizing_order_modifier: "$JAP_prioritizing_order$"
 JAP_prioritizing_order_modifier_desc: "$JAP_prioritizing_order_desc$"
 JAP_strengthening_cabinet_modifier: "$JAP_strengthening_cabinet$"
 JAP_strengthening_cabinet_modifier_desc: "$JAP_strengthening_cabinet_desc$"
 JAP_regulatory_reform_modifier: "규제 개혁과 성장 전략"
 JAP_regulatory_reform_modifier_desc: "우리는 국내 경쟁력을 강화하고 안정적인 성장을 지속할 수 있는 체제로 전환할 것입니다. 기업 활동에 대한 제약을 줄임으로써 민간 부문의 활력을 이용해 산업과 고용을 앞으로 이끌 것입니다."
 JAP_patriotic_education_modifier: "$JAP_patriotic_education$"
 JAP_patriotic_education_modifier_desc: "$JAP_patriotic_education_desc$"
 JAP_strengthen_military_idea: "$JAP_strengthen_military_power$"
 JAP_strengthen_military_idea_desc: "$JAP_strengthen_military_power_desc$"
 JAP_jsdf_international_missions_idea1a: "국제 협력 임무를 위한 제도적 기반"
 JAP_jsdf_international_missions_idea1a_desc: "국제 협력 임무에 필요한 법적 틀과 작전 기준의 정비가 진척되었습니다. 해외 파견 절차와 임무 중 대응 기준이 명확해짐에 따라 부대 운용의 안정성과 현장 판단의 일관성이 개선되고 있습니다."
 JAP_constitutional_debate_idea: "격화되는 개헌 논쟁"
 JAP_constitutional_debate_idea_desc: "안보 정책의 대전환은 전후 질서에 대한 오랜 가정을 흔들었습니다. 국방 강화에 대한 지지가 커지는 한편 평화주의의 후퇴를 우려하는 이들의 반대도 여전히 강하며, 사회와 정치권 내의 갈등이 심화되고 있습니다."
 JAP_f15_programe: "F-15 개량 프로그램"
 JAP_submarine_modernization_idea: "잠수함 현대화 프로그램"
 JAP_carrier_aviation: "항공모함 복원"
 JAP_keen_sword_operation_idea: "킨 소드 훈련"
 JAP_defense_technology_agency1: "일본 방위 기술청"
 JAP_defense_technology_agency1_desc: "일본 방위 기술청은 산업계, 학계, 군대 전반의 연구, 개발, 조달을 조율합니다. 첨단 사업을 단일 전략 비전 아래 통합함으로써 일본은 혁신을 가속하고, 중복을 줄이며, 최첨단 기술이 일선 부대에 더 빨리 도달하도록 보장합니다."
 JAP_diplomacy_modifier: "일본의 외교"
 JAP_diplomacy_modifier_desc: "일본은 핵심 국가들과의 양자 관계를 중시하며 경제, 안보, 문화 같은 분야의 협력을 강화합니다. 실용적이고 이익에 기반한 제휴를 통해 일본은 세계 무대에서의 존재감을 강화하고 있습니다."
 JAP_chiang_mai_initiative: "치앙마이 이니셔티브"
 JAP_chiang_mai_initiative_desc: "일본과의 통화 스와프 약정이 확대됨에 따라 아세안 회원국들은 금융 위기에 대한 회복력을 강화하여 경제 안정과 자율성을 높입니다."
 JAP_quantitative_oda_idea: "일본 ODA 기반시설 투자"
 JAP_quantitative_oda_idea_desc: "일본의 공적 개발 원조는 교통, 항만, 전력과 같은 기반시설의 개발을 가속했습니다. 이 지원은 우리나라의 경제 성장을 위한 필수적인 토대가 됩니다."
 JAP_qualitative_oda_idea: "인적 자본과 혁신을 위한 일본 ODA"
 JAP_qualitative_oda_idea_desc: "일본과의 협력은 교육, 인력 개발, 연구에서 상당한 진전을 가져왔습니다. 현지 기업과 기관의 역량 강화는 지속 가능한 발전의 길을 닦습니다."
 JAP_security_south_china_sea_idea: "일본의 해양 안정 관여"
 JAP_security_south_china_sea_idea_desc: "남중국해 해양 안보에 대한 일본의 중립적 관여는 지역의 긴장을 완화하고 항행의 자유를 보호하는 데 기여했습니다. 이는 우리 지역에서 믿을 수 있는 안정화 세력으로 기능합니다."
 JAP_jap_education: "미일 교육 교류 프로그램"
 JAP_jap_education_desc: "일본의 규율과 미국의 기업가 정신을 결합한 혼합형 교육 프로그램이 시범 운영되고 있습니다. 서로의 강점을 배우는 이 과정은 미래 세대의 성장에 귀중한 자극을 제공합니다."
 JAP_jap_education_culture: "미일 문화 및 교육 협력"
 JAP_jap_education_culture_desc: "대중문화와 첨단 기술을 넘어서는 더욱 포괄적인 제휴가 일본과 미국 사이에 떠오르고 있습니다. 규율 중심의 일본 교육과 창의성 중심의 미국 기풍이 융합되며 인력 개발이 깊어졌습니다. 문화적 친화성과 과학 협력의 시너지는 사회 안정과 혁신의 동력을 함께 키웁니다."
 JAP_dual_use_idea: "미일 이중 용도 연구 협력"
 JAP_dual_use_idea_desc: "이중 용도 기술에서 일본과 미국의 협력이 강화되고 있습니다. 가속화된 개발과 공유된 전문 지식은 민간 및 군사 분야 모두에서 더 큰 미래 경쟁력을 약속합니다."
 JAP_disaster_countermeasure_cooperation_idea: "협력을 통한 재난 회복력 강화"
 JAP_disaster_countermeasure_cooperation_idea_desc: "일본과의 재난 대응 협력을 통해 대만은 비상사태에 대처하는 역량을 크게 강화했습니다. 지식 교류와 공동 훈련 프로그램은 피해를 줄이고 복구를 앞당길 것으로 기대됩니다."
 JAP_tai_high_technology_idea: "일본-대만 첨단 기술 제휴"
 JAP_tai_high_technology_idea_desc: "일본과의 공동 연구는 대만 민간 기술 부문의 혁신을 가속하고 있습니다. 공유된 연구 자원과 국제 협력은 산업 경쟁력을 높이고 있습니다."
 JAP_tai_international_student_idea: "일본과의 차세대 교류"
 JAP_tai_international_student_idea_desc: "일본 내 유학 기회의 확대는 더 많은 대만 학생이 다양한 학술 경험을 쌓을 수 있게 합니다. 이는 미래의 일본-대만 관계 지도자를 길러 내고 국제적 시야를 넓힙니다."
 JAP_chi_kor_intellectual_platform: "동아시아 기억 대화 플랫폼"
 JAP_chi_kor_intellectual_platform_desc: "국제연합의 지원 아래 일본, 중국, 한국은 역사적 기억을 보존하고 상호 이해를 심화하기 위한 공동 지적 플랫폼을 출범시켰습니다. 이 구상은 역사적 성찰과 미래 지향적 협력의 균형을 맞추는 새로운 국제적 틀을 제시합니다."
 JAP_chi_trade_support_idea: "무역 제도의 국제적 조화"
 JAP_chi_trade_support_idea_desc: "일본의 기술적, 제도적 지원으로 중국은 국제 표준에 부합하는 무역 제도의 발전을 추진하고 있습니다. 통관 절차 간소화와 법률 개정 같은 개혁이 제도 현대화에 기여하고 있습니다."
 JAP_chi_advancement_companies_idea: "일본과의 산업 통합 강화"
 JAP_chi_advancement_companies_idea_desc: "일본 기업과 중국 기업의 상호 진출 확대는 생산 네트워크를 간소화하고 양국 간의 경제적 상호 의존을 심화하고 있습니다."
 JAP_chi_kanji_idea: "중일 문화권 협력"
 JAP_chi_kanji_idea_desc: "일본과의 문화 협력을 통해 중국은 공유된 \\"한자 문화권\\" 내의 교류를 강화하고 있습니다. 이는 소프트 파워 강화와 더 우호적인 국제 이미지에 기여합니다."
 JAP_chi_temple_idea: "불교 유산 공동 보존"
 JAP_chi_temple_idea_desc: "일본과 함께 불교 사찰과 문화재를 공동으로 보존하고 복원함으로써 중국은 종교 유산의 가치를 재확인하는 한편 관광을 촉진하고 있습니다."
 JAP_kor_accelerator_idea: "도쿄-서울 액셀러레이터 협력"
 JAP_kor_accelerator_idea_desc: "서울과 도쿄가 공동으로 설립한 스타트업 지원 체계는 차세대 창업가 정신을 키우고 도시 간 기술 협력을 강화하고 있습니다."
 JAP_kor_local_companies_idea: "지역 기업 교류 프로그램"
 JAP_kor_local_companies_idea_desc: "한국과 일본의 지역 기업 간 교류를 통해 지역 경제가 활기를 되찾고 새로운 민간 부문 산업 네트워크가 형성되고 있습니다."
 JAP_kor_aging_idea: "고령화 사회 공동 태스크포스"
 JAP_kor_aging_idea_desc: "고령 인구라는 공통의 과제에 대응하기 위해 한국과 일본 전문가들로 구성된 공동 태스크포스가 구성되어 정책적 통찰을 교환하고 사회 복지 대책을 강화하고 있습니다."
 JAP_sov_logistics_corridor_idea: "일러 유라시아 물류망"
 JAP_sov_logistics_corridor_idea_desc: "일본과의 협력으로 러시아를 경유하여 일본과 유럽을 잇는 물류 회랑의 개발이 진행 중입니다. 기반시설 개선과 경제적 연계는 러시아의 지정학적 중요성을 높이고 있습니다."
 JAP_sov_it_corridor_idea: "일러 디지털 연결 구상"
 JAP_sov_it_corridor_idea_desc: "일본의 지원으로 러시아는 IT 기반시설을 확대하고 있습니다. 일러 제휴는 광범위한 디지털 회랑을 구축하고 세계적인 정보 교류의 토대를 마련하는 것을 목표로 합니다."
 JAP_territorial_disputes1: "영토 협상의 정치적 성과"
 JAP_territorial_disputes1_desc: "오랜 영토 문제에서 어느 정도 진전이 이루어지면서 주변 해역의 긴장이 다소 누그러졌고, 국내 여론에도 안도감이 퍼지고 있습니다. 외교적 불확실성의 감소는 연안 지역의 경제 활동에도 긍정적인 영향을 미쳐, 조업 여건 개선을 통해 어업 관련 세수 기반을 뒷받침하고 있습니다."
 JAP_monarchist_shipbuilding_idea: "제국 해군 건함 추진"
 JAP_monarchist_shipbuilding_idea_desc: "제국은 바다를 본래의 영역으로 삼아 되돌아갈 것입니다. 제국 해군 건함 추진 아래 조선소가 확장되고, 계약이 중앙집중화되며, 함대가 일본의 야망에 걸맞아질 때까지 전시 속도로 생산이 지속됩니다. 천황의 이름으로 기공된 바다는 제국의 것입니다!"
 JAP_monarchist_shipbuilding_idea_tt: "§R당신이 다음 상태가 되면 이 국가 정신이 제거됩니다:§! §Y$naval_power_of_the_continent$§!"
 JAP_restoring_imperial_household_idea: "황실 복원"
 JAP_restoring_imperial_household_idea_desc: "황실은 장식적인 궁정이 아닌 국가 기관으로서 재건되고 있습니다. 관서가 확대되고, 의전이 공식화되며, 부처와 사회를 옥좌에 더 가깝게 묶는 임명을 통해 영향력이 회복됩니다. 천황의 황실은 다시 한번 국가적 결속과 방향의 조용한 엔진으로 기능할 것입니다."
 JAP_once_millennium_disaster: "천 년에 한 번의 재해"
 JAP_once_millennium_disaster_desc: "2011년 3월 11일의 동일본 대지진은 근현대 일본 역사에서 가장 파괴적인 재해 중 하나로 남아 있습니다. 지진과 쓰나미는 기반시설, 산업, 생계를 순식간에 무너뜨려 나라를 심각한 혼란에 빠뜨렸습니다. 복구의 길은 길고 험난할 것이며 막대한 자원과 시간이 필요합니다."
 JAP_scars_earthquake_and_tsunami: "지진과 쓰나미의 상흔"
 JAP_scars_earthquake_and_tsunami_desc: "동일본 대지진과 그 파괴적인 쓰나미는 도호쿠 지방의 도시, 항만, 해안 공동체에 치명적인 피해를 입혔습니다. 기반시설과 산업 시설이 파괴되어 지역의 생산성과 생계가 심각하게 훼손되었습니다. 복구에는 수년이 걸리고 막대한 자원과 노력이 필요할 것입니다."
 JAP_scars_earthquake: "지진의 상흔"
 JAP_scars_earthquake_desc: "동일본 대지진의 진동은 간토 지방에도 닥쳐 교통망에 큰 타격을 주고 산업 기반의 일부를 마비시켰습니다. 수도권마저 일시적인 경제 활동 감소를 겪었습니다. 참상이 도호쿠만큼 심각하지는 않지만, 복구에는 여전히 상당한 시간과 노력이 필요합니다."
 JAP_focus_renewable_energy_idea: "재생 에너지 중시"
 JAP_focus_renewable_energy_idea_desc: "원자력 안전에 대한 우려로 우리는 재생 에너지를 우선시하게 되었으며, 이는 발전에서의 장기적 자립을 강화합니다."
 JAP_focus_energy_TT: "추가 지출: GDP의 §R0.01%§!"
 JAP_focus_thermal_power_idea: "화석 연료 발전소 중시"
 JAP_focus_thermal_power_idea_desc: "화석 연료 발전소를 택하면 특히 원자력 안전이 국가적 우려로 남아 있는 동안 안정적인 출력과 즉각적인 공급이 보장됩니다."
 JAP_anxiety_nuclear_power: "원자력에 대한 대중의 불안"
 JAP_anxiety_nuclear_power_desc: "후쿠시마 제1원전 사고의 충격은 원자력에 대한 공포와 불신을 사회 전반에 퍼뜨렸습니다. 대중의 반대와 절차상의 지연으로 신규 건설이 지체되고 있으며, 정치적 혼란도 계속되고 있습니다."
 JAP_shut_down_nuclear_plants: "모든 원자력 발전소 가동 중단"
 JAP_shut_down_nuclear_plants_desc: "정부는 원자력 발전을 중단하기로 결정함으로써 대중의 공포에 직접 대응하였습니다. 반대는 여전히 남아 있으나, 이 결정은 안전을 우선시한 것으로 널리 평가받고 있으며 사회 불안도 점차 가라앉고 있습니다."
 JAP_nuclear_strict_examination: "강화된 원자력 안전 기준"
 JAP_nuclear_strict_examination_desc: "사고에 대응하여 규제와 심사가 대폭 강화되었습니다. 신규 건설과 재가동에는 이제 추가 조치와 장기간의 절차가 요구되어, 원자력 발전의 확대가 더뎌지고 이전 수준으로 가동하기도 어려워졌습니다."
 JAP_continue_nuclear_plants: "원자력 발전 지속"
 JAP_continue_nuclear_plants_desc: "정부는 원자력 발전을 유지하기로 선택했으나, 사고의 기억은 여전히 생생합니다. 안전에 대한 불신과 반발이 지속되어 정치적 갈등을 부추기고 있으며, 이는 국내 안정을 해치고 있습니다."
 JAP_crown_centered: "황실 중심 사상의 부활"
 JAP_crown_centered_desc: "모리 총리의 발언 이후, 전통주의적이고 군주주의적인 수사가 일부 계층에서 힘을 얻기 시작했습니다. 정부가 이러한 흐름을 활용할 의지를 보이면서, 황실을 국가의 중심 원리로 재평가하려는 운동이 제한적이지만 점차 커지는 정치적 영향력을 얻기 시작했습니다."
 JAP_monarchist_modifier: "황실 통치"
 JAP_monarchist_modifier_desc: "옥좌가 통치권을 되찾았으며, 이제 국가는 정당 간의 흥정이 아닌 황제의 칙령으로 움직입니다. 각 부처와 보안 기관, 산업계는 황제를 정통성과 방향의 원천으로 여기는 단일한 교의 아래 정렬되어 있습니다."
 JAP_airforce_modifier: "[JAP_airforce_name]"
 JAP_article9_modifier: "제9조"
 JAP_defense_industry: "교도 방위 네트워크"
 JAP_defense_industry_2: "교도 방위 네트워크"
 JAP_landforce_modifier: "[JAP_landforces_name]"
 JAP_navy_modifier: "[JAP_navy_name]"
 JAP_navy_modifier_2: "[JAP_navy_name]"
 JAP_japanese_tech_agency_tt: "[JAP_defense_technology_idea_desc]\n"
 JAP_military_decision_category: "[JAP.GetAdjectiveCap] 군사"
 JAP_consolidate_national_defense_framework_mission: "국가 방위 체제 공고화"
 JAP_consolidate_national_defense_framework_mission_desc: "더 폭넓은 방위 태세로의 전환은 지휘 구조, 계획 수립 절차, 법적 책임에 불확실성을 가져왔습니다. 국가 방위 체제를 공고히 함으로써 일본은 점차 일관성을 회복하고 개혁으로 인한 혼란을 줄여 나갑니다.\n\n$JAP_article9_mission_explainer_tt$"
 JAP_modernize_joint_command_mission: "통합 지휘 구조 현대화"
 JAP_modernize_joint_command_mission_desc: "육해공과 신흥 영역을 단일한 통합 지휘 체계로 통합하려면 시간과 훈련, 조직 개편이 필요합니다. 새로운 절차가 시험되고 개선됨에 따라 마찰은 서서히 줄어들고 일본 군대의 효율성은 향상됩니다.\n\n$JAP_article9_mission_explainer_tt$"
 JAP_asteroid_mining_light_operation: "소규모 천체 탐사"
 JAP_asteroid_mining_light_operation_desc: "일본은 조상의 영령이 이끌어 주기를 기원하며 탐사선이 하늘에서 쓸 만한 광석을 찾는 소규모 소행성 탐사를 수행합니다."
 JAP_asteroid_mining_medium_operation: "중규모 신성 채취 임무"
 JAP_asteroid_mining_medium_operation_desc: "더 큰 규모의 원정대가 소행성대 깊숙이 진출하며, 일본이 값진 우주 금속을 얻고자 하는 가운데 신화적 상징을 임무의 동력으로 삼습니다."
 JAP_asteroid_mining_heavy_operation: "대규모 천상 채굴 원정"
 JAP_asteroid_mining_heavy_operation_desc: "천상의 대장간에 얽힌 옛 이야기를 되새기며, 일본이 풍부한 천체 자원을 확보하고자 전면적인 소행성 채굴 사업에 착수합니다."
 JAP_mars_mission_program_mission: "화성 식민지 건설 완료"
 JAP_restore_guarantee: "미국의 안보 보장 복원 요청"
 JAP_restore_guarantee_desc: "지역 긴장이 높아지고 우리의 장기적 안보에 대한 의구심이 커지면서, 정부 일각에서는 미국으로부터 새롭고 명시적인 안보 보장을 구해야 한다고 주장합니다. 그렇게 하려면 방위 정책과 제9조 해석에서 정치적 양보가 필요할 가능성이 높으나, 이는 전략적 안정을 위한 대가일 수 있습니다."
 JAP_remove_american_blockade: "미국의 해상 압박 종식 요청"
 JAP_remove_american_blockade_desc: "우리 주요 해상 교통로 주변에서 강화된 미국 해군의 존재는 국내외에서 긴장의 원인이 되었습니다. 이 압박을 줄이거나 끝내기 위한 협상의 외교 경로는 여전히 열려 있으나, 워싱턴은 그 대가로 더 깊은 안보 공약과 제9조에 대한 입장의 추가 조정을 거의 틀림없이 기대할 것입니다."
 JAP_restore_trade_relations: "미국과의 무역 정상화 모색"
 JAP_restore_trade_relations_desc: "미국이 부과한 관세와 표적 무역 조치는 우리 수출업체에 피해를 주고 동맹에 대한 신뢰를 갉아먹고 있습니다. 워싱턴과 직접 협상하면 경제 관계를 정상화할 수 있을지 모르나, 의미 있는 완화는 안보 협력의 재개와 제9조에 대한 보다 폭넓은 해석과 연계될 가능성이 높습니다."
 JAP_chinese_agression_five: "고조되는 중국의 공세"
 JAP_chinese_agression_five_desc: "최근 이 지역에서 벌어진 중국의 행동은 우리 방위 기획관들 사이에 우려를 불러일으켰습니다. 상황이 아직 임계점에 이르지는 않았으나 추세는 분명합니다. 베이징은 꾸준히 태세를 격상시키고 있습니다. 정책 입안자들은 일본이 추가적인 불안정 사태의 가능성에 대비해야 한다고 경고합니다."
 JAP_chinese_agression_ten: "격화되는 중국의 압박"
 JAP_chinese_agression_ten_desc: "중국은 이 지역에서 군사적, 지정학적 압박을 강화했습니다. 순찰 침범, 영공 도전, 공격적인 언사가 모두 크게 늘었습니다. 이러한 사건의 빈도가 늘어나는 것은 일본의 결의를 시험하고 지역 균형을 재편하려는 의도적 전략을 시사합니다."
 JAP_chinese_agression_twelve: "우려스러운 중국의 활동"
 JAP_chinese_agression_twelve_desc: "베이징의 최근 행동은 우려할 만한 격화를 나타냅니다. 정보 보고서에 따르면 해군 전개가 늘었고, 분쟁 해역 인근에서 군사 훈련이 이루어졌으며, 일본을 직접 겨냥한 정치적 메시지가 나오고 있습니다. 상황은 점점 불안정해지고 있으며, 보다 강력한 국가적 대응을 요구하는 목소리가 커지고 있습니다."
 JAP_chinese_agression_fourteen: "심각한 중국의 도발"
 JAP_chinese_agression_fourteen_desc: "중국은 통상적인 압박을 넘어서는 여러 공세적 조치를 취했습니다. 전략 자산이 일본 영토 인근에 배치되었으며, 우리 주변 해역에 대한 침범은 새로운 빈도에 이르렀습니다. 방위 당국자들은 일본이 안보 태세의 일부 요소를 재고해야 할 수 있다고 경고합니다."
 JAP_chinese_agression_sixteen: "위험한 중국의 확전"
 JAP_chinese_agression_sixteen_desc: "지역 정세는 갈수록 위태로워지고 있습니다. 이제 중국의 군사 기동은 일본을 직접 위협하도록 설계된 것으로 보이며, 베이징의 선전 매체는 더 강경한 어조를 취했습니다. 오판으로 인한 위기의 가능성이 급격히 높아지고 있습니다."
 JAP_chinese_agression_eighteen: "위급한 중국의 군사적 압박"
 JAP_chinese_agression_eighteen_desc: "중국의 공세적 태세는 위급한 지점에 이르렀습니다. 주요 해역은 끊임없는 압박을 받고 있고, 공중 침범은 전례 없는 수준이며, 지역 파트너들도 경종을 울리고 있습니다. 도쿄 전역의 정책 입안자들은 일본이 제9조의 해석을 포함하여 방위 전략을 재평가해야 한다고 주장합니다."
 JAP_chinese_agression_twenty: "심각한 지역 위기: 정점에 달한 중국의 공세"
 JAP_chinese_agression_twenty_desc: "상황은 전면적인 지역 위기로 번졌습니다. 중국은 일본 영토 인근에 대규모 군사 전개를 단행하여 더 확전할 의지가 있음을 내비쳤습니다. 국가 안보에 대한 위협은 더 이상 이론이 아니며, 일본은 군사 태세와 자위대의 역할에 관해 역사적 결단을 강요할 수 있는 직접적인 도전에 직면해 있습니다."
 JAP_world_tension_high: "안보 태세 재검토"
 JAP_world_tension_high_desc: "세계적 불안정이 고조됨에 따라 일본은 방위 정책을 재평가하고 국제 질서의 잠재적 변화에 대비해야 합니다."
 JAP_world_tension_high2: "지역 비상사태 대비"
 JAP_world_tension_high2_desc: "세계는 갈수록 위험해지고 있습니다. 일본은 국가 안보를 보장하고 전략적 대비 태세를 유지하기 위한 구체적인 조치를 취해야 합니다."
 JAP_world_tension_high3: "국가 안보 조치 발동"
 JAP_world_tension_high3_desc: "세계적 긴장은 위급한 수준에 이르렀습니다. 일본은 이제 국익을 수호하고 지역 안정을 지키기 위한 비상 조치를 고려해야 합니다."
 JAP_article_nine_protests_appeal: "방위 강화 찬성 시위에 대응"
 JAP_article_nine_protests_appeal_desc: "광범위한 방위 강화 찬성 시위는 더 강력한 군사력과 더 강경한 안보 태세를 요구하고 있습니다. 이러한 요구에 부응하여 제9조의 해석을 넓힘으로써, 정부는 대중의 압력을 활용해 보다 적극적인 국가 방위 정책을 정당화할 수 있습니다."
 JAP_article_nine_protests_appeal_tt: "§Y시위 강도§!가 최소 §R50§! 이상입니다"
 JAP_article_nine_protests_appeal_tt2: "[JAP.GetName](이)가 §Y희망 군사법§!을 가지고 있지 않습니다"
 JAP_article_nine_military_parties: "친군사 정당 활용"
 JAP_article_nine_military_parties_desc: "정부 내 친군사 정당들은 더 강력한 국방과 제9조의 폭넓은 해석을 밀어붙이고 있습니다. 이들의 의제에 보조를 맞춤으로써 정부는 군사 개혁을 추진하고 더 높은 수준의 방위 태세를 정당화할 수 있습니다."
 JAP_article_nine: "제9조 해석"
 JAP_article_nine_left_side: "엄격한 평화주의"
 JAP_article_nine_level_one: "1단계: 평화주의적 해석"
 JAP_article_nine_level_two: "2단계: 방어적 해석"
 JAP_article_nine_level_three: "3단계: 협력적 방위"
 JAP_article_nine_level_four: "4단계: 집단적 자위권"
 JAP_article_nine_level_five: "5단계: 확대된 군사적 역할"
 JAP_article_nine_right_side: "적극적 방위"
 JAP_great_east_japan_earthquake_decision: "재건으로 가는 길"
 JAP_great_east_japan_earthquake_decision_desc: "2011년 3월 11일, 동일본 대지진이 전례 없는 진동과 쓰나미로 나라를 강타하여 현대사에서 보기 드문 참상을 빚어냈습니다. 도호쿠에서 간토에 이르기까지 광대한 지역이 마비되었고, 교통망이 마비되고 경제 활동이 멈췄으며 수많은 삶이 뒤바뀌었습니다. 공동체와 산업은 기반을 잃었고, 나라 전체가 혼란과 불확실성에 빠졌습니다.\n\n이 재해는 단순한 물리적 파괴에 그치지 않았습니다. 국민의 정신에 깊은 상처를 남겼고 사회가 근본부터 다시 생각하도록 강요했습니다. 일본은 이제 갈림길에 서서 복구와 쇄신이라는 막중한 과제를 짊어지고 있습니다. 파괴된 지역을 재건하고, 산업을 되살리며, 국민의 삶과 유대를 회복하는 것은 국가가 피할 수 없는 책무입니다.\n\n'재건으로 가는 길'이라 불리는 이 노력은 길고 험난할 것입니다. 그러나 이러한 역경을 극복해야만 일본은 새로운 미래를 개척할 수 있습니다."
 JAP_tohoku_infrastructure_decision: "도호쿠 기반시설 재건"
 JAP_tohoku_infrastructure_decision_desc: "지진으로 파괴된 기반시설을 한 걸음씩 재건해야 합니다. 지역 경제와 일상생활의 토대인 도로, 철도, 항만을 복구하는 것이 복구의 첫걸음입니다."
 JAP_kanto_infrastructure_decision: "간토 기반시설 재건"
 JAP_kanto_infrastructure_decision_desc: "지진으로 파괴된 기반시설을 한 걸음씩 재건해야 합니다. 지역 경제와 일상생활의 토대인 도로, 철도, 항만을 복구하는 것이 복구의 첫걸음입니다."
 JAP_tohoku_communication_decision: "도호쿠 통신망 복구"
 JAP_tohoku_communication_decision_desc: "재해로 파괴된 통신 기반시설은 복구와 일상생활에 필수적입니다. 공동체를 다시 연결하고 경제를 되살리기 위해 복구를 단계적으로 진행해야 합니다."
 JAP_kanto_communication_decision: "간토 통신망 복구"
 JAP_kanto_communication_decision_desc: "재해로 파괴된 통신 기반시설은 복구와 일상생활에 필수적입니다. 공동체를 다시 연결하고 경제를 되살리기 위해 복구를 단계적으로 진행해야 합니다."
 JAP_tohoku_industrial_recovery_decision: "도호쿠 산업 재활성화"
 JAP_tohoku_industrial_recovery_decision_desc: "재해로 멈춰 선 지역 산업을 되살리는 것은 경제 회복에 필수적입니다. 민간 산업을 복구하면 일자리를 창출하고 생산의 토대를 강화하는 데 도움이 됩니다."
 JAP_kanto_industrial_recovery_decision: "간토 산업 재활성화"
 JAP_kanto_industrial_recovery_decision_desc: "재해로 멈춰 선 지역 산업을 되살리는 것은 경제 회복에 필수적입니다. 민간 산업을 복구하면 일자리를 창출하고 생산의 토대를 강화하는 데 도움이 됩니다."
 JAP_domestic_policy_decision: "[JAP.GetFlag][JAP.GetAdjective] 국내 정책 결정"
 JAP_focus_renewable_energy_decision: "재생 에너지 집중"
 JAP_focus_renewable_energy_decision_desc: "원자력 안전에 대한 우려가 커지는 가운데, 태양광과 풍력 등 재생 에너지원에 대한 투자를 확대하면 에너지를 다각화하고 수입 연료에 대한 의존을 줄일 수 있습니다."
 JAP_focus_thermal_power_decision: "화력 발전소 집중"
 JAP_focus_thermal_power_decision_desc: "원자력 안전에 대한 우려 속에서, 석탄·석유·천연가스 발전소를 확충하면 국가에 더 즉각적이고 안정적인 전력원을 제공할 수 있습니다."
 JAP_saudi_aramco_crude_storage: "사우디 아람코 원유 비축"
 JAP_saudi_aramco_crude_storage_desc: "사우디 아람코를 통해 전용 원유 저장 시설을 확보하여 공급을 안정시키고 갑작스러운 시장 충격에 대한 노출을 줄입니다. 장기적 접근과 예측 가능한 인도를 확보함으로써 일본은 전략적 여유를 얻습니다."
 JAP_overseas_upstream_equity: "원천에서 유정을 사들여라"
 JAP_overseas_upstream_equity_desc: "나라의 대표 탐사 기업 INPEX와 JOGMEC의 국가 금융 담당자들은 아부다비에서 러시아 극동에 이르는 유전의 지분을 확보하여 현물 시장의 변덕으로부터 나라를 보호합니다. 일본 소유 유정에서 뽑은 모든 배럴은 어떤 경쟁자도 막을 수 없는 배럴입니다. 소유야말로 가장 확실한 공급입니다."
 JAP_kosaka_tsl_furnace: "고사카 TSL 용광로 확장"
 JAP_kosaka_tsl_furnace_desc: "가공은 채굴만큼 전략적입니다. 우리는 고사카 TSL 용광로의 용량을 확장하여 복잡한 스크랩과 혼합 정광을 처리하고, 그렇지 않으면 손실될 핵심 금속을 회수하겠습니다."
 JAP_green_ship_recycling: "친환경 선박 재활용"
 JAP_green_ship_recycling_desc: "함대는 건조될 뿐 아니라 해체되기도 하며, 그 강철은 나라로 돌아와야 합니다. 우리는 고부가가치 물자를 안전하고 효율적으로 회수할 수 있도록 친환경 선박 재활용 기준과 시설을 마련하겠습니다. 퇴역한 선체 하나하나가 다음 선체를 위한 자원이 될 것입니다."
 JAP_bibi_world_decision: "라피더스 IIM-1 '비비 월드' 파운드리 건설"
 JAP_bibi_world_decision_desc: "라피더스 IIM-1 '비비 월드' 파운드리 건설을 가속화하여 일본 땅에 차세대 반도체 생산 능력을 확보합니다."
 JAP_yufutsu_oil_expansion_decision: "유후쓰 유전 확장"
 JAP_yufutsu_oil_expansion_decision_desc: "유후쓰 유전을 확장하여 국내 공급을 강화하고 외부 교란에 대한 노출을 줄입니다."
 JAP_toray_expansion_program_decision: "도레이 확장 계획"
 JAP_toray_expansion_program_decision_desc: "도레이의 첨단 소재 생산을 확대하여 가장 중요한 분야에서 일본의 산업 기반을 강화합니다."
 JAP_teijin_aerospace_prepreg_decision: "데이진 항공우주 프리프레그"
 JAP_teijin_aerospace_prepreg_decision_desc: "데이진의 항공우주용 프리프레그 생산 능력을 확장하여 현대 기체와 고급 방위 체계의 복합소재 골격을 확보합니다."
 JAP_demand_south_kuril: "남쿠릴 열도 반환 요구"
 JAP_demand_south_kuril_desc: "도쿄는 남쿠릴 열도의 반환을 공식 요구할 것입니다. 모스크바는 확전을 피하기 위해 양보할 수도 있고, 거부하여 위기를 감수할 수도 있습니다."
 JAP_demand_north_kuril: "북쿠릴 열도 반환 요구"
 JAP_demand_north_kuril_desc: "일본은 더 폭넓은 제국 복원 의제의 일환으로 북쿠릴 열도의 반환을 요구할 것입니다. 거부는 추가 확전을 정당화하는 데 이용될 수 있습니다."
 JAP_demand_sakhalin: "사할린 반환 요구"
 JAP_demand_sakhalin_desc: "일본은 사할린의 반환을 요구할 것입니다. 러시아 정부가 이 요구를 거부하면, 도쿄는 자제, 제한적 충돌, 전쟁 사이에서 선택해야 할 것입니다."
 JAP_peaceout_russia: "러시아와의 종전"
 JAP_peaceout_russia_desc: "우리는 러시아에 합의를 강제하여 우리의 조건으로 전쟁을 끝내고 우리가 차지한 것을 확보하겠습니다. 이는 군사적 결정인 만큼 정치적 결정이기도 하며, 모스크바가 전열을 재정비하기 전에 새로운 현실을 조약으로 고정하는 것입니다. 러시아가 수락하면 전투는 끝나고 지도는 영구히 바뀝니다."
 JAP_claiming_south_korea: "한국 영유권 주장"
 JAP_claiming_south_korea_desc: "우리는 한국을 일본의 안보와 역사적 특권의 문제로 규정하여 모호함을 명시적인 영유권 주장으로 바꾸겠습니다. 이는 몸짓이 아니라 우리의 전략적 전선이 쓰시마 해협에서 끝나지 않는다는 선언입니다. 영유권 주장이 이루어지면 앞으로의 모든 협상은 우리의 조건에서 시작될 것입니다."
 JAP_claiming_north_korea: "한반도 북부 문제 규정"
 JAP_claiming_north_korea_desc: "평양 정권은 이웃이 아니라 우리의 바다와 도시를 위협하는 상시적 위기입니다. 우리는 북부 한반도의 미래를 결정할 일본의 권리를 공식화하고, 이를 타인에게 맡길 수 없는 안보 문제로 다루겠습니다. 선언이 이루어지면 북한은 일본의 조건으로 관리해야 할 문제가 될 것입니다."
 JAP_claiming_taiwan: "대만에 대한 우리의 통치권 재천명"
 JAP_claiming_taiwan_desc: "대만은 제1도련선의 경첩이자 우리 해양 안보의 목구멍에 자리합니다. 우리는 이 섬에 대한 일본의 통치권을 재천명하고, 그 지위를 먼 강대국들이 결정할 사안이 아니라 전략적 필수로 규정하겠습니다. 선언이 이루어지면 일본은 대만의 미래를 자국의 미래와 불가분으로 간주할 것입니다."
 JAP_claiming_malaysia: "말라야 영유권 주장"
 JAP_claiming_malaysia_desc: "말라야는 지역 무역과 연료의 흐름을 좌우하는 핵심 해협과 보급로에 걸터앉아 있습니다. 우리는 공식적으로 영유권을 주장하고 그 지위를 일본의 안보와 해양 질서의 문제로 규정하겠습니다. 선언이 이루어지면 모든 협상은 우리의 통치권이 테이블 위에 놓인 채 시작될 것입니다."
 JAP_claiming_indonesia: "인도네시아에 통치권 확립"
 JAP_claiming_indonesia_desc: "인도네시아는 인도양과 태평양을 하나로 묶는 섬들과 요충지를 장악하고 있습니다. 우리는 이 군도에 대한 통치권을 확립하고 그 해상 교통로와 자원을 일본의 전략적 필수로 다루겠습니다. 이 지역에 질서가 있어야 한다면, 그것은 도쿄에서 집행될 것입니다."
 JAP_claiming_vietnam: "베트남에 대한 이해관계 천명"
 JAP_claiming_vietnam_desc: "베트남은 남중국해의 가장자리를 붙들고 있으며 해안 전체의 균형을 좌우할 수 있는 기지를 제공합니다. 우리는 일본의 이해관계를 천명하고 베트남의 진영 선택이 우리 없이는 결정되지 않을 것임을 분명히 하겠습니다. 영향력은 확신에서 시작되며, 확신은 영유권 주장에서 시작됩니다."
 JAP_claiming_cambodia: "영향권을 캄보디아로 확대"
 JAP_claiming_cambodia_desc: "캄보디아는 작지만 지리적으로 동남아시아 본토의 회랑이자 완충지이며 지렛대입니다. 우리는 영유권 주장을 확대하고 그 미래를 더 넓은 일본의 영향권에 묶겠습니다. 지도에서 사소해 보이는 것이 지역의 안정을 좌우할 수 있습니다."
 JAP_claiming_laos: "메콩 배후지 영유권 주장"
 JAP_claiming_laos_desc: "라오스는 육로와 강, 그리고 해안 뒤편의 조용한 종심을 장악하고 있습니다. 우리는 메콩 배후지를 대륙 안보의 일부로 영유권을 주장하여, 경쟁자들이 이곳을 우리 영향권으로 들어오는 뒷문으로 쓰지 못하게 하겠습니다. 통제는 항구만이 아니라 회랑에도 있습니다."
 JAP_claiming_australia: "오스트레일리아 영유권 선언"
 JAP_claiming_australia_desc: "오스트레일리아는 태평양의 남쪽 닻이며, 함대와 공군력, 장기전의 병참을 수용할 수 있는 대륙입니다. 우리는 영유권을 선언하여 남방 접근로가 일본의 전략적 영향권 밖에 머물지 않을 것임을 알리겠습니다. 남쪽이 확보되면 바다는 뒤따릅니다."
 JAP_claiming_new_zealand: "남방 외곽 영유권 주장"
 JAP_claiming_new_zealand_desc: "뉴질랜드는 멀리 있을지 모르나 태평양이 분쟁 지역이 될 때 중요해지는 항로 위에 있습니다. 우리는 남방 외곽을 영유권으로 주장하고 경쟁자들이 우리 손이 닿지 않는 안전한 후방을 갖지 못하게 하겠습니다. 먼 섬도 다른 이가 쥐면 무기가 됩니다."
 JAP_claiming_myanmar: "이라와디 관문 통제 주장"
 JAP_claiming_myanmar_desc: "미얀마는 대양 사이의 육교이자 이 지역 내륙으로 들어가는 관문입니다. 우리는 영유권을 주장하고 그 항구와 회랑, 비행장을 일본 영향권의 전략 자산으로 다루겠습니다. 관문을 쥔 자가 누가 들어올지를 결정합니다."
 JAP_demand_palau: "팔라우 요구"
 JAP_demand_palau_desc: "팔라우는 작은 섬 무리이지만 해군 계획에서 차지하는 비중은 크며, 정박지와 감시, 작전 반경을 제공합니다. 우리는 일본의 권위에 대한 복종을 요구하고 이곳을 우리 태평양 질서의 전진 기지로 확보하겠습니다. 지도는 연설이 아니라 기지로 쓰입니다."
 JAP_demand_micronesia: "미크로네시아 요구"
 JAP_demand_micronesia_desc: "미크로네시아는 함대와 항공기를 위한 징검다리처럼 중부 태평양을 가로질러 놓여 있습니다. 우리는 통과 항로를 확보하고 경쟁자들이 우리 바다에 집결지를 얻지 못하게 하기 위해 통제권을 요구하겠습니다. 일단 장악하면 이 섬들은 거리를 이점으로 바꿔 줍니다."
 JAP_demand_nauru: "나우루 요구"
 JAP_demand_nauru_desc: "나우루는 아주 작지만 이런 섬들이 넓은 해역에 걸친 감시 범위와 접근을 좌우합니다. 우리는 일본과의 연대를 요구하고 이를 우리의 전초 기지 망에 편입하겠습니다. 해양의 시대에 무의미한 섬은 없습니다."
 JAP_demand_kiribati: "키리바시 요구"
 JAP_demand_kiribati_desc: "키리바시는 정찰, 급유, 차단을 뒷받침할 수 있는 핵심 접근로에 걸쳐 있습니다. 우리는 일본의 지휘에 대한 복종을 요구하고 이 섬들을 우리 외곽 방어선의 한 고리로 확보하겠습니다. 태평양은 한 고리씩 정비될 것입니다."
 JAP_demand_marshall_islands: "마셜 제도 요구"
 JAP_demand_marshall_islands_desc: "마셜 제도는 비행장과 병참, 중부 태평양 항로 통제를 위한 공간을 제공합니다. 우리는 이 섬들을 일본의 영향권으로 이양할 것을 요구하고, 함대 작전을 위한 요새화된 징검다리로 바꾸겠습니다. 이 환초들을 쥔 자가 전구 전체를 좌우할 수 있습니다."
 JAP_demand_tuvalu: "투발루 요구"
 JAP_demand_tuvalu_desc: "투발루는 땅은 거의 없으나 존재감을 제공하며, 존재감이 제해권을 좌우합니다. 우리는 투발루의 연대를 요구하고 이를 남태평양의 청취 기지이자 경유지로 확보하겠습니다. 가장 작은 섬도 방어선의 닻이 될 수 있습니다."
 JAP_demand_solomon_islands: "솔로몬 제도 요구"
 JAP_demand_solomon_islands_desc: "솔로몬 제도는 남서 태평양의 천연 장벽이자 집결지이며, 비행장과 해군 엄호에 이상적입니다. 우리는 일본에 대한 복종을 요구하고 이곳을 지나는 항로를 틀어쥐겠습니다. 이곳을 통제한다는 것은 이동을 통제한다는 뜻입니다."
 JAP_demand_guinea: "뉴기니 요구"
 JAP_demand_guinea_desc: "뉴기니는 대륙 규모의 보루로서 동남아시아와 태평양 사이의 접근로를 지배합니다. 우리는 이양을 요구하고 이곳을 공군력, 병참, 전진 방어의 요새로 바꾸겠습니다. 뉴기니가 확보되면 남방 전구는 우리의 뜻에 따라 움직일 것입니다."
 JAP_demand_vanuatu: "바누아투 요구"
 JAP_demand_vanuatu_desc: "바누아투는 남서 태평양으로의 재보급과 작전 반경에 중요한 항로 위에 있습니다. 우리는 일본과의 연대를 요구하고 이를 우리 기지망에 통합하겠습니다. 섬들의 사슬은 하나로 묶였을 때 장벽이 됩니다."
 JAP_demand_fiji: "피지 요구"
 JAP_demand_fiji_desc: "피지는 남태평양의 중심 거점으로, 넓은 호를 이루는 해역에서 함대 병참과 항공 작전을 뒷받침할 수 있습니다. 우리는 일본에 대한 복종을 요구하고 이곳을 우리 남방 방어선의 쐐기돌로 확보하겠습니다. 피지가 우리 것이 되면 지역의 균형이 바뀝니다."
 JAP_demand_samoa: "사모아 요구"
 JAP_demand_samoa_desc: "사모아는 중부 태평양과 남방 접근로를 잇는 항로 위에 있습니다. 우리는 사모아의 일본과의 연대를 요구하고 그 항구와 비행장을 더 넓은 방어선에 통합하겠습니다. 해양 제국에서는 먼 섬조차 결정적이 됩니다."
 JAP_demand_tonga: "통가 요구"
 JAP_demand_tonga_desc: "통가는 남태평양의 전략적 발판이자 넓은 해역의 움직임을 감시할 거점을 제공합니다. 우리는 통가가 일본의 지휘에 복종할 것을 요구하고 이를 우리 남방 통제선의 일부로 확보하겠습니다. 중립은 우리 해상 교통로에서 허용하지 않을 사치입니다."
 JAP_demand_american_islands: "미국령 섬 요구"
 JAP_demand_american_islands_desc: "미국이 보유한 섬들은 단순한 영토가 아니라 우리 바다로 힘을 투사하는 전진 기지입니다. 우리는 이들을 일본의 권위 아래로 이양하거나 무력화할 것을 요구하여, 워싱턴이 우리 문턱에 집결지를 두지 못하게 하겠습니다. 태평양이 정비되려면 외세의 발판은 제거되어야 합니다."
 JAP_demand_french_islands: "프랑스령 섬 요구"
 JAP_demand_french_islands_desc: "프랑스의 섬 보유지는 태평양에서 외세의 존재에 작전 반경과 항구, 외교적 엄호를 제공합니다. 우리는 일본에 대한 복종을 요구하고 이를 우리의 전초 기지와 회랑망에 편입시키겠습니다. 우리 영향권은 먼 제국들에게 구멍 뚫리지 않을 것입니다."
 JAP_demand_british_islands: "영국령 섬 요구"
 JAP_demand_british_islands_desc: "영국의 섬 영토는 옛 질서의 잔재이나 여전히 핵심 항로 곳곳에 기지와 영향력을 제공합니다. 우리는 이들을 일본의 영향권으로 이양할 것을 요구하고 우리 해양 방어선의 또 하나의 틈을 메우겠습니다. 태평양은 하나의 권위, 곧 우리의 권위 아래 정비될 것입니다."
 JAP_imperial_procurement_standardization: "제국 조달 표준화"
 JAP_imperial_procurement_standardization_desc: "조달 규정을 중앙 집중화하고, 부품을 표준화하며, 군 전반에 공통 사양을 강제합니다. 목표는 더 빠른 생산, 더 단순한 병참, 더 적은 생산 병목입니다."
 JAP_zaibatsu_empowerment_charter: "재벌 권한 부여 헌장"
 JAP_zaibatsu_empowerment_charter_desc: "제국 정부가 설정한 구속력 있는 생산 목표를 대가로 선별된 산업 재벌에 확대된 특권을 부여합니다."
 JAP_neighborhood_associations_system: "이웃 조합 제도"
 JAP_neighborhood_associations_system_desc: "가구를 등록하고, 배급을 조율하며, 신속한 동원을 뒷받침하는 전국적 지역 조합망을 재건합니다. 사회 통제를 강화하고 국가의 대응성을 개선합니다."
 JAP_state_rites_restoration: "국가 제례 복원"
 JAP_state_rites_restoration_desc: "국가 의식과 공공 제례를 국민 생활의 중심 기둥으로 복원합니다. 이 개혁은 황실의 정통성을 강화하고 복원된 질서에 대한 대중의 순응을 장려합니다."
 JAP_national_morals_education_act: "국민 도덕 및 교육법"
 JAP_national_morals_education_act_desc: "시민 교육을 의무, 봉사, 국민적 결속을 중심으로 표준화합니다. 학교는 규율을 기르고 대비 태세를 확충하며 복원된 국가에 대한 충성심을 함양하는 데 쓰일 것입니다."
 JAP_imperial_rescript_revival: "교육칙어 부활"
 JAP_imperial_rescript_revival_desc: "국가의 정통성을 뒷받침하고 국민의 의무를 규정하기 위해 공식 칙어를 부활시킵니다. 복원된 질서는 단결과 의무, 국가적 목적으로의 회귀로 제시될 것입니다."
 JAP_north_korean_remilitarized_dmz: "북한의 DMZ 긴장 고조에 대응"
 JAP_north_korean_remilitarized_dmz_desc: "북한은 비무장지대를 따라 진지를 강화했습니다. 도쿄는 이 긴장 고조를 근거로 안보 태세를 강화하고 제9조 아래 작전 재량을 확대할 것입니다."
 JAP_north_korean_increased_nuclear_testing: "북한의 핵실험에 대응"
 JAP_north_korean_increased_nuclear_testing_desc: "다시 빨라진 핵실험 속도는 지역 위협 환경을 고조시켰습니다. 정부는 이를 근거로 더 엄격한 제9조 해석을 정당화하고 대비 태세 조치를 가속할 것입니다."
 JAP_north_korean_threats_to_south_korea: "북한의 위협에 대응"
 JAP_north_korean_threats_to_south_korea_desc: "대한민국에 대한 직접적인 위협은 일본의 안보 외곽선으로 번질 수 있는 더 넓은 충돌의 위험을 높입니다. 도쿄는 제9조 해석을 넓히고 억지 계획을 강화할 수 있습니다."
 JAP_north_korean_road_to_war: "북한의 전쟁 행진에 대비"
 JAP_north_korean_road_to_war_desc: "상황은 전면 충돌로 미끄러져 가고 있습니다. 일본은 더 이상 자제에만 의존할 수 없습니다. 개정된 제9조 해석은 더 견고한 군사 계획과 더 신속한 대응 수단을 가능하게 할 것입니다."
 JAP_russian_agressiveness: "러시아의 공세성에 대응"
 JAP_russian_agressiveness_desc: "동북아시아에서 점점 단호해지는 러시아의 태세는 지역 안정을 해치고 있습니다. 도쿄는 고조된 위협 환경을 활용하여 억지력을 강화하고 제9조 아래 작전 재량을 확대할 것입니다."
 JAP_defence_russian_asian_ambitions: "러시아의 아시아 야망에 맞서기"
 JAP_defence_russian_asian_ambitions_desc: "모스크바의 아시아에서의 야망은 일본의 안보 환경과 태평양의 세력 균형을 위협합니다. 도쿄는 방위 태세를 굳건히 하고 제9조 아래 작전 선택지를 넓힐 것입니다."
 JAP_russian_north_korean_alliance: "러시아-북한 축에 대비"
 JAP_russian_north_korean_alliance_desc: "러시아와 북한의 더 긴밀한 연대는 여러 방향에서 일본에 가해지는 압박을 조일 것입니다. 도쿄는 억지력을 강화하고 제9조 아래 남은 제약을 완화함으로써 대응할 것입니다."
 JAP_russian_pacific_naval_presence: "러시아의 태평양 해군 증강에 대응"
 JAP_russian_pacific_naval_presence_desc: "태평양에서 러시아의 해군 태세가 더욱 단호해지고 있습니다. 일본은 이러한 변화를 근거로 확대된 해양 대비 태세와 더 유연한 제9조 해석을 정당화할 것입니다."
 JAP_tookover_sikhalin_mission: "상실한 영토 수복 기한"
 JAP_tookover_sikhalin_mission_desc: "시간이 다 되어 가고 있습니다. 러시아가 기한 내에 필요한 목표를 되찾지 못하면, 국제적 압력과 국내의 피로가 합의를 강요할 것입니다. 평화 조약이 체결되고, 전쟁을 끝내는 대가로 상실한 영토는 할양될 것입니다."
 JAP_russia_demands_peace_japan: "러시아와의 평화 협정"
 JAP_russia_demands_peace_japan_desc: "쿠릴 열도와 사할린이 이제 확고히 일본의 통제 아래 들어오자, 도쿄는 전쟁을 끝내기 위한 제안을 내놓았습니다. 제안은 단순하고 계산된 것입니다. 러시아가 북방의 새로운 현실을 인정하는 대가로 평화를 주는 것입니다. 이는 자선이 아니라 전략적 합의로서, 우리의 성과를 확보하고 두 나라가 장기전의 비용을 치르지 않게 해 줍니다. 수락하면 전쟁은 끝나고 점령 영토에 대한 우리의 통제가 공식화됩니다. 거부는 모스크바가 더 이상 이길 확신이 없는 전쟁을 계속할 의지가 있음을 알리는 신호가 될 것입니다."
 JAP_russia_demands_peace_russia: "일본에 평화 요구"
 JAP_russia_demands_peace_russia_desc: "우리는 일본에 합의를 요구하여 전투를 끝내고 상황이 악화되기 전에 동결하겠습니다. 이는 화해가 아니라 피해 통제이며, 아직 결과를 강요할 지렛대가 있을 때 조건을 확정하는 것입니다. 도쿄가 거부한다면 그들이 평화가 아닌 승리를 원한다는 것을 알게 될 것입니다."
 JAP_auto_claiming_tt: "이 결정을 선택하면 모든 중핵 주를 영유권 주장할 때까지 스스로 반복됩니다. 그 후 복종을 요구할 수 있습니다"
 JAP_intellectual_platform_decision: "$JAP_intellectual_platform$"
 JAP_intellectual_platform_decision_desc: "$JAP_intellectual_platform_desc$"
 JAP_declining_birthrate_category: "저출산 대책청"
 JAP_declining_birthrate_category_desc: "일본의 인구 위기는 다면적입니다. 출생이 사망을 따라가지 못하고, 은퇴자 비중은 해마다 늘며, 생산연령 인구는 스스로를 대체하지 못한 채 줄어듭니다. 협조된 조치가 없으면 이 부담은 노동력 공급, 연금 지급 능력, 국가 안정, 농촌 현들의 경제적 활력 전반으로 연쇄 파급됩니다. 단번에 해결할 방법은 없으며, 여러 정책 분야에 걸친 지속적이고 포괄적인 개혁만이 있을 뿐입니다.\n\n여기서 이용할 수 있는 결정들은 인구 중점 가지와 맞물려 작동하도록 설계되었습니다. 각 결정은 위기의 하나 이상의 측면(출생 부족, 노동력 부족, 실업 임계점, 의료비 부담, 사회 비용 부담, 안정도 침식)을 겨냥하며, 어느 한 수단에 대한 과의존을 막기 위해 각 결정은 목표 조건이 개선되면 스스로 종료됩니다.\n\n§Y진척 상황은 §!§G$JAP_demographic_pressure_modifier$§!§Y 국가 정신에 나타납니다. 인구 중점이 완료되고 관련 결정이 시행됨에 따라 변동치의 페널티는 점차 0으로 완화됩니다. 방치가 지속되면 압박이 남거나 악화되어 안정도와 경제 역량이 잠식됩니다.§!"
 JAP_territorial_disputes: "[JAP.GetNameWithFlag]의 영토 분쟁"
 JAP_territorial_disputes_desc: "[JAP.GetName](은)는 현재 다음 세 지역을 두고 이웃 나라들과 영토 분쟁을 벌이고 있습니다.\n\n§Y북방 영토(남쿠릴 열도)§!: [JAP.GetName](은)는 홋카이도 북동쪽에 있는 에토로후, 구나시리, 시코탄 및 하보마이 군도에 대한 영유권을 주장하며, 제2차 세계 대전 이후 소련의 점령이 불법이었다고 주장하고 [SOV.GetName](으)로부터 반환받기를 계속 모색하고 있습니다. 반면 [SOV.GetName](은)는 이 섬들에 대한 주권을 주장하며 실효 지배를 유지하고 있습니다.\n\n§Y다케시마([KOR.GetAdjective] 명칭: 독도)§!: [JAP.GetName] 해(동해)에 위치한 이 섬은 [JAP.GetName](이)가 영유권을 주장하나 1950년대 이래 [KOR.GetName](이)가 실효 지배하고 있습니다. 이 분쟁은 역사 해석과 어업권이 얽힌 두 나라 사이의 매우 민감한 쟁점으로, 정치적으로 예민한 사안으로 여겨집니다.\n§Y다케시마는 지도에 표시하기엔 너무 작으므로, 협상이 성공해도 영토를 얻지는 못합니다. 그러나 아래에 설명된 변동치는 여전히 얻을 수 있습니다!§!\n\n§Y센카쿠 열도(중국 명칭: 댜오위다오)§!: 동중국해의 이 무인 암초 무리는 1895년 이래 [JAP.GetName]의 실효 지배 아래 있으나 [CHI.GetName]와(과) [TAI.GetName]도 영유권을 주장합니다. 1990년대 이후 거듭된 외교적 항의와 경쟁적 주장으로 이 문제는 향후 긴장의 잠재적 불씨가 되었습니다.\n\n이 모든 분쟁은 역사, 국제법, 실효 지배, 외교 관계, 국내 여론과 깊이 얽혀 있습니다. 이를 해결하려면 관련 국가들과 더 긴밀한 유대와 상호 이해를 증진해야 합니다.\n\n§Y힌트: 대상국의 관계를 높이거나 그들에 대한 영향력을 키우면 협상이 성공할 가능성이 더 커집니다!§!\n\n§Y보상:§! 협상이 성공하면 §G$MODIFIER_STABILITY_FACTOR$§!와 §G$agriculture_district_income_tax_modifier$§!에 대한 변동치를 얻을 수 있습니다!"
 JAP_territorial_disputes_TT: "협상이 성공하면 영토 문제의 해결과 더불어 §G$MODIFIER_STABILITY_FACTOR$§!와 §G$agriculture_district_income_tax_modifier$§! 보너스를 얻을 수 있습니다!"
 JAP_dec_negotiations_resolve_northern_territories_dispute: "북방 영토 분쟁 해결 협상"
 JAP_dec_negotiations_resolve_northern_territories_dispute_desc: "북방 영토를 둘러싼 영토 문제는 전후 [JAP.GetName]-[SOV.GetName] 외교에서 가장 중요한 미해결 사안 중 하나로 남아 있습니다. 이 문제를 정면으로 다루고 평화적 해결을 모색하는 것은 [JAP.GetName]의 주권을 회복하고 극동의 안정을 보장하는 데 중요합니다. 충분한 상호 신뢰와 협상 조건이 갖추어지면, 우리는 [SOV.GetName]와(과) 공식 외교 협상을 개시하여 영토의 반환을 요청할 수 있습니다."
 JAP_dec_negotiations_resolve_senkaku_dispute_china: "[CHI.GetName]와(과)의 센카쿠 열도 분쟁 해결 협상"
 JAP_dec_negotiations_resolve_senkaku_dispute_china_desc: "센카쿠 열도에 대한 [CHI.GetName]의 영유권 주장은 [JAP.GetName]-[CHI.GetName] 관계의 불안정 요인이 되었습니다. 이 섬들을 실효 지배하는 당사자로서 [JAP.GetName](은)는 [CHI.GetName](이)가 주장을 철회하도록 설득하여 이 문제를 외교적으로 해결하고자 합니다. 필요한 상호 신뢰와 국제적 영향력이 갖추어졌으므로, 이제 [CHI.GetName]와(과) 직접 협상을 시작할 준비가 되었습니다."
 JAP_dec_negotiations_resolve_senkaku_dispute_taiwan: "[TAI.GetName]와(과)의 센카쿠 열도 분쟁 해결 협상"
 JAP_dec_negotiations_resolve_senkaku_dispute_taiwan_desc: "센카쿠 열도에 대한 [TAI.GetName]의 영유권 주장은 [JAP.GetName]와(과) [TAI.GetName] 사이의 상호 신뢰와 협력에 잠재적 장애물이 되었습니다. 이 섬들에 대한 [JAP.GetName]의 실효 지배를 외교적으로 인정받기 위해, 우리는 이제 [TAI.GetAdjective] 당국과 평화적 협상에 들어갈 준비가 되었습니다."
 JAP_dec_negotiations_resolve_takeshima_dispute: "다케시마 분쟁 해결 협상"
 JAP_dec_negotiations_resolve_takeshima_dispute_desc: "다케시마를 둘러싼 [KOR.GetName]와(과)의 영토 분쟁은 오랫동안 [JAP.GetName]-[KOR.GetName] 관계의 큰 걸림돌이었습니다. 우리나라는 차분하고 진솔한 외교를 통해 해결을 모색하며 [KOR.GetAdjective] 정부에 영토 협상을 공식 제안할 준비가 되어 있습니다."
 JAP_base_okinawa_decision: "오키나와 주둔 미군의 미래"
 JAP_base_okinawa_decision_desc: "오키나와에는 여전히 상당수의 미군 기지가 있어 일본의 안보 체제와 지역 사회 모두에 영향을 미치고 있습니다.\n일본 정부는 더 큰 안보 자율성과 지역 부담 경감을 추구하며 현행 체제를 재평가할 방안을 모색하고 있습니다.\n외교적 교섭을 통해 미일 안보 관계의 새로운 균형을 찾을 수 있을지도 모릅니다.\n\n힌트: §Y[USA.GetName]에서의 [JAP.GetName]의 영향력§!과 §Y[JAP.GetName]에서의 [USA.GetName]의 영향력§!이 협상 성공률에 영향을 줍니다. 또한 §Y제9조를 둘러싼 세력 균형을 해소§!하거나 §Y군사비 지출을 최소 $defence_04$ 이상으로 올려§! 성공률을 높일 수도 있습니다!"
 JAP_negotiation_base_okinawa: "오키나와 미군 철수 협상 개시"
 JAP_negotiation_base_okinawa_desc: "국가 안보 자율성을 강화하기 위해 일본은 오키나와에 주둔한 미군의 철수에 관한 외교 협상을 개시합니다. 이 조치는 변화하는 지역 역학에 비추어 현행 안보 체제를 재평가하고 더 유연한 틀을 모색하는 것을 목표로 합니다."
 Japan.101.t: "우편 해산: 우리의 위임에 대한 시험"
 Japan.101.d: "우정 민영화를 둘러싼 논쟁은 국회에서 강한 저항에 부딪혔고, 심의는 갈수록 긴장이 고조되고 있습니다. 당내에서도 신중론과 반대 목소리가 여전히 강합니다. 일부는 조정과 수정을 거쳐 추진해야 한다고 주장하고, 다른 일부는 지금이야말로 쟁점을 분명히 하고 국민의 심판을 구해야 할 때라고 주장합니다.\n중의원을 해산하고 총선거를 치른다면 개혁 자체를 직접 시험대에 올리게 됩니다. 동시에 정치 일정은 급속히 선거 국면으로 전환되고 정치적 긴장 고조는 피할 수 없을 것입니다.\n\n해산과 총선거를 추진해야 합니까?"
 Japan.101.a: "중의원을 해산한다."
 Japan.101.b: "해산하지 않는다."
 Japan.103.t: "좌파 세력의 부상"
 Japan.103.d: "경기 침체와 고용 불안, 사회 보장에 대한 우려가 커지는 가운데, 재분배 확대와 생활 지원을 요구하는 좌파 세력에 대한 관심이 급속히 높아지고 있습니다. 기성 정치에 대한 불만의 수용체로서 지지가 여러 지역으로 퍼지고 있으며, 여론 조사에서도 좌파 정당의 눈에 띄는 성장이 나타나기 시작했습니다. 앞으로의 정치 상황에서 좌파의 존재감은 무시할 수 없게 될 가능성이 높습니다."
 Japan.103.a: "자유주의 세력에 순풍"
 Japan.103.b: "사회민주주의 세력의 성장"
 Japan.103.c: "공산주의 세력의 존재감 확대"
 Japan.103.e: "좌파 포퓰리즘 세력의 급부상"
 Japan.104.t: "우파 세력의 부상"
 Japan.104.d: "안보 환경에 대한 불안이 커지고 정치에 대한 불신이 높아지는 가운데, 질서 유지와 국가적 자립, 전통적 가치의 중시를 요구하는 우파 세력에 대한 지지가 퍼지고 있습니다. 이러한 입장은 폭넓은 유권자층의 관심을 끌고 있으며, 여론 조사에서도 우파 정당의 눈에 띄는 성장이 나타나기 시작했습니다. 앞으로의 정치 상황에서 우파의 존재감은 더욱 커질 수 있습니다."
 Japan.104.a: "보수주의 세력 지지 확대"
 Japan.104.b: "사회민주주의 세력의 성장"
 Japan.104.c: "개혁 보수 세력의 부상"
 Japan.104.e: "유신 계열 세력 지지 확대"
 JAP_diplomacy.01.t: "오키나와 주둔 미군 철수 협상 개시"
 JAP_diplomacy.01.d: "수십 년 동안 일본 내 미군의 주둔은 전후 일본 안보 체제와 지역 안정의 초석이었습니다. 그러나 변화하는 지정학적 여건, 여론의 변화, 자국 방위 역량 강화에 대한 일본의 관심 증대에 비추어, 정부는 오키나와 주둔 미군을 재검토해야 한다고 판단했습니다. 첫걸음으로 미국과의 공식 협상이 이제 시작됩니다."
 JAP_diplomacy.01.a: "외교 협상을 시작한다"
 JAP_diplomacy.02.t: "일본의 미군 철수 협상 요청"
 JAP_diplomacy.02.d: "일본 정부는 오키나와에 주둔한 미군의 철수에 관한 협상에 들어가자는 공식 요청을 제출했습니다. 이 제안은 적대적인 성격이 아니며 일본의 방위 태세와 변화하는 안보 수요에 대한 더 폭넓은 재평가의 일환으로 제시되었습니다. 미국은 이제 동맹의 온전성과 이 지역의 장기적 전략 이익 사이에서 균형을 잡으며 어떻게 대응할지 고려해야 합니다."
 JAP_diplomacy.02.a: "요청을 수락한다"
 JAP_diplomacy.02.b: "요청을 거절한다"
 JAP_diplomacy.03.t: "합의 도달: 미군 철수"
 JAP_diplomacy.03.d: "일련의 외교 논의 끝에 일본과 미국은 오키나와에서의 미군 철수에 관한 합의에 이르렀습니다. 이는 일본의 진화하는 방위 정책에서 중대한 전환점이며 자국 안보에 대해 더 큰 책임을 지려는 일본의 의지를 보여 줍니다. 기존 체제의 종말을 의미하는 동시에, 미일 관계를 재평가하고 미래를 위한 새로운 형태의 안보 협력을 모색할 기회이기도 합니다."
 JAP_diplomacy.03.a: "안보 정책의 새로운 장이 열린다"
 JAP_diplomacy.04.t: "협상 결렬: 철수 거부됨"
 JAP_diplomacy.04.d: "미국 정부는 오키나와 미군 철수에 대한 일본의 요청을 거절했습니다. 그 결과 기존의 안보 체제는 그대로 유지됩니다. 이 결과는 일본 내에서 엇갈린 반응을 불러일으킬 수 있으며, 방위 문제에서 나라의 자율성에 관한 논쟁을 부추길 수 있습니다. 일본 정부는 이제 더 넓은 지역 및 국내 정세를 계속 주시하면서 접근 방식을 재평가해야 합니다."
 JAP_diplomacy.04.a: "다음 수를 고민할 때입니다"
 JAP_diplomacy.05.t: "미래를 위한 공유 기억을 향하여"
 JAP_diplomacy.05.d: "일본 정부는 과거 전쟁의 기억과 교훈을 공유하고 평화의 문화를 미래 세대에 전하는 것을 목표로, UN의 중재 아래 3국 지식인 플랫폼을 설립하자고 제안하기로 결정했습니다. 이 사업에는 박물관과 디지털 기록관이 포함되며 모든 비용은 일본이 부담합니다. 이 제안은 외교 경로를 통해 중국과 대한민국에 공식 전달될 것입니다."
 JAP_diplomacy.05.a: "제안을 보낸다"
 JAP_diplomacy.06.t: "일본의 제안: 기억과 미래의 공유"
 JAP_diplomacy.06.d: "일본 정부는 전쟁의 기억과 교훈을 미래 세대를 위해 보존하고자, UN의 중재 아래 중국 및 대한민국과 함께하는 3국 지식인 플랫폼 설립을 제안했습니다. 이 구상에는 박물관과 디지털 기록관 건립이 포함되며 모든 비용은 일본이 부담합니다. 우리는 미래지향적 협력을 선택할 것입니까, 아니면 계속 불신 속에 머물 것입니까? 우리의 결정이 동아시아 기억의 미래를 좌우할 것입니다."
 JAP_diplomacy.06.a: "제안을 수락한다"
 JAP_diplomacy.06.b: "제안을 거부한다"
 JAP_diplomacy.08.t: "3국 지식인 플랫폼 출범"
 JAP_diplomacy.08.d: "중국과 대한민국 모두 제안을 수락했습니다. UN의 중재 아래 3국 지식인 플랫폼이 공식 출범했습니다. 공동 박물관과 기록관을 통해 전쟁의 기억과 교훈이 이제 미래 세대에 전해질 것입니다. 이는 화해와 상호 이해를 향한 의미 있는 첫걸음이 될 수 있습니다."
 JAP_diplomacy.08.a: "미래를 향한 새로운 걸음"
 JAP_diplomacy.09.t: "제안 거부"
 JAP_diplomacy.09.d: "안타깝게도 우리가 구상한 지식인 플랫폼은 거부되었습니다. 화해에는 더 많은 시간과 신뢰 구축을 위한 지속적인 노력이 필요하다는 점이 분명합니다."
 JAP_diplomacy.09.a: "또 다른 기회를 기다려야 합니다"
 JAP_news.01.t: "[JAP.GetLeader]의 성명: 역사의 인정"
 JAP_news.01.d: "오늘 일본 정부는 [JAP.GetLeader] 총리의 공식 성명을 발표하여 일본의 과거 식민 통치와 전시 행위에 대해 깊은 반성과 진심 어린 사과를 표명했습니다. 이 성명은 미래지향적인 외교 관계를 구축하고 역사의 기억을 책임감 있게 보존하겠다는 진지한 의지를 강조했습니다. 연설은 국내외에서 큰 주목을 받았으며 앞으로의 동아시아 외교에 영향을 미칠 것으로 예상됩니다."
 JAP_news.01.a: "미래에 대한 우리의 책임입니다."
 JAP_news.01.b: "향후 전개를 면밀히 지켜보겠습니다."
 JAP_diplomacy.34.t: "통화 스와프 협정 확대 제안"
 JAP_diplomacy.34.a: "수락한다"
 JAP_diplomacy.34.b: "당분간 거절한다"
 JAP_diplomacy_34_TT: "§Y수락하는 아세안(ASEAN) 국가마다 안정도 변동치를 받으며 우리에게 §G호의적인 관계§!를 갖게 됩니다.§!"
 JAP_diplomacy.35.t: "스와프 협정 확대 합의"
 JAP_diplomacy.35.d: "[FROM.GetName](은)는 통화 스와프 협정을 확대하자는 일본의 제안에 동의했습니다. 이는 위기 시 유동성 지원이라는 \\"안전망\\"을 한층 강화하고 시장 신뢰와 지역 협력의 실효성을 높입니다. 이 합의는 또한 아세안(ASEAN) 내에서 일본에 대한 신뢰를 높이는 분명한 한 걸음입니다."
 JAP_diplomacy.35.a: "좋습니다."
 JAP_diplomacy.36.t: "제안 거절됨"
 JAP_diplomacy.36.d: "[FROM.GetName](은)는 통화 스와프 협정을 확대하자는 일본의 제안을 거절하겠다고 밝혔습니다. 이는 협정의 조건과 운영 절차를 명확히 하는 것을 우선하겠다는 선호를 반영한 것이며, 제안 자체에 대한 비판은 아닙니다. 일본은 상대국의 사정을 염두에 두면서 대화 경로를 열어 두어야 합니다."
 JAP_diplomacy.36.a: "알겠습니다."
 JAP_diplomacy.37.t: "핵심 기반시설 투자 제안"
 JAP_diplomacy.37.d: "일본 정부는 지역 연결성과 경제 성장을 촉진하기 위해, 교통망, 항만, 에너지 등 핵심 기반시설에 초점을 맞춘 우리나라에 대한 대규모 ODA 투자를 제안했습니다. 도로, 항만, 전력망의 개선은 물류와 산업의 토대를 강화하여 우리나라의 성장을 직접 뒷받침할 것입니다. 제안을 수락하면 아세안(ASEAN) 내 일본의 영향력도 커질 것입니다.\n\n이 제안을 수락하고 기반시설 개발을 가속해야 합니까?"
 JAP_diplomacy.37.a: "수락한다"
 JAP_diplomacy.37.b: "거부한다"
 JAP_diplomacy_37_TT: "§Y수락하는 아세안(ASEAN) 국가마다 기반시설 건설 속도 변동치를 받습니다. 우리는 §R$3.5 billion§!을 출연하고 수락한 각 국가에서 §G영향력 2.5%§!를 얻습니다.§!"
 JAP_diplomacy.38.t: "투자 제안 수락됨"
 JAP_diplomacy.38.d: "[FROM.GetName](은)는 핵심 기반시설에 대한 일본의 ODA 투자 제안을 수락했습니다. 교통망, 항만, 전력 기반시설의 개선을 추진하면 지역 연결성과 경제 성장이 촉진되는 한편 우리의 관여는 더욱 확고히 자리 잡게 됩니다. 이 합의는 아세안(ASEAN) 내 일본의 영향력을 한층 강화할 것입니다."
 JAP_diplomacy.38.a: "좋습니다."
 JAP_diplomacy.39.t: "제안 거절됨"
 JAP_diplomacy.39.d: "[FROM.GetName](은)는 핵심 기반시설에 대한 일본의 ODA 투자 제안을 거절하겠다고 밝혔습니다. 상대국은 국내 계획과 제도적 준비를 우선시하는 것으로 보이나, 이것이 제안 자체를 거부한다는 뜻은 아닙니다. 일본은 상대국의 사정을 염두에 두면서 향후 협력의 여지를 남겨 두어야 합니다."
 JAP_diplomacy.39.a: "알겠습니다."
 JAP_diplomacy.40.t: "인적 자본 및 연구 협력 제안"
 JAP_diplomacy.40.a: "수락한다"
 JAP_diplomacy.40.b: "거부한다"
 JAP_diplomacy_40_TT: "§Y수락하는 아세안(ASEAN) 국가마다 연구 속도 및 생산성 성장 변동치를 받습니다. 수락한 각 국가에서 §G영향력 2.5%§!를 얻습니다.§!"
 JAP_diplomacy.41.t: "협력 제안 수락됨"
 JAP_diplomacy.41.a: "좋습니다."
 JAP_diplomacy.42.t: "제안 거절됨"
 JAP_diplomacy.42.a: "알겠습니다."
 JAP_diplomacy.43.t: "일본 해양 안보 체제 참여 요청"
 JAP_diplomacy.43.d: "일본 정부는 남중국해의 긴장을 완화하고 항행의 자유를 보호하기 위한 중립적이고 평화적인 해양 안보 체제를 출범시키는 계획을 제시했으며, 우리나라에 참여를 타진해 왔습니다. 정보 공유, 해상 수색 구조, 해적 소탕 노력, 합동 훈련 같은 협력은 지역 안정에 기여하고 위기 관리 능력을 높일 것입니다. 제안을 수락하면 아세안(ASEAN) 내 일본의 영향력도 커질 것입니다.\n\n이 제안을 수락하고 일본의 체제 안에서 협력해야 합니까?"
 JAP_diplomacy.43.a: "수락한다"
 JAP_diplomacy.43.b: "거부한다"
 JAP_diplomacy_43_TT: "§Y수락하는 아세안(ASEAN) 국가마다 안정도 변동치를 받습니다. 수락한 각 국가에서 §G영향력 2.5%§!와 호의적인 관계를 얻습니다.§!"
 JAP_diplomacy.44.t: "체제 참여 합의"
 JAP_diplomacy.44.d: "[FROM.GetName](은)는 일본이 제안한 중립적이고 평화적인 해양 안보 체제에 참여하기로 동의했습니다. 정보 공유, 해상 수색 구조, 해적 소탕 노력, 합동 훈련 같은 협력이 진전됨에 따라, 지역 안정과 항행의 자유 보호에서 가시적인 진전을 기대할 수 있습니다. 이 합의는 아세안(ASEAN) 내 일본의 신뢰와 영향력을 강화할 것입니다."
 JAP_diplomacy.44.a: "좋습니다."
 JAP_diplomacy.45.t: "참여 제안 거절됨"
 JAP_diplomacy.45.d: "[FROM.GetName](은)는 일본이 제안한 중립적이고 평화적인 해양 안보 체제에 참여하지 않겠다고 밝혔습니다. 상대국은 지역 정세와 국내 우선순위에 대한 고려를 앞세우는 것으로 보이나, 이것이 협력의 원칙 자체를 거부한다는 뜻은 아닙니다. 일본은 긴장을 부추기지 않는 태도를 유지하면서 대화와 협력의 여지를 남겨 두어야 합니다."
 JAP_diplomacy.45.a: "알겠습니다."
 JAP_diplomacy.46.t: "미일 공동 교육 프로그램 출범"
 JAP_diplomacy.46.d: "일본 정부는 상호 이해를 심화하고 차세대를 육성하기 위해 공동 교육 프로그램과 학생 교류를 확대하자고 제안했습니다. 일본의 규율과 미국의 기업가 정신이라는 서로의 강점에서 배울 수 있는 틀을 마련함으로써 국제적 안목을 갖춘 새로운 세대의 지도자를 길러 내는 것이 목표입니다. 이 구상은 민간 교류를 늘리고 동맹 내 신뢰를 한층 강화할 것입니다."
 JAP_diplomacy.46.a: "미래를 위한 투자입니다."
 JAP_diplomacy.47.t: "미일 기술 및 문화 교류"
 JAP_diplomacy.47.d: "일본 정부는 일본의 대학 연구실, 스튜디오, 기업 네트워크를 실리콘 밸리, 시애틀, 로스앤젤레스의 파트너와 연결하여 기술 및 문화 교류를 확대하는 계획을 제시했습니다. 기술자, 디자이너, 창작자가 공동 프로젝트를 위해 오가며, 플랫폼 운영에서의 미국의 노하우와 하드웨어, 게임, 애니메이션에서의 일본의 강점을 결합하는 것이 목표입니다. 문화적 친화력과 과학 협력이 함께 진전된다면 사회 안정과 혁신의 동력을 모두 높일 것입니다."
 JAP_diplomacy.47.a: "시너지를 극대화합시다."
 JAP_diplomacy.48.t: "미일 이중 용도 연구 협력"
 JAP_diplomacy.48.d: "일본 정부는 민수와 군사 양쪽에 적용될 수 있는 이중 용도 기술 분야에서 미일 협력을 한층 강화하자는 제안을 제시했습니다. 산학 협력을 중심으로 공동 연구를 진전시키고 전문 지식을 공유하며 인적 교류를 촉진하여, 연구 개발을 가속하고 전반적인 기술 발전을 이끄는 것이 목표입니다. 이 협력이 뿌리를 내리면 민수와 군사 양 부문에서 미래 경쟁력이 높아질 것으로 기대됩니다."
 JAP_diplomacy.48.a: "공동 연구를 진전시킵시다."
 JAP_diplomacy.49.t: "일본-대만 재난 대비 지식 플랫폼"
 JAP_diplomacy.49.a: "회복력을 높입시다."
 JAP_diplomacy.50.t: "일본-대만 첨단 기술 파트너십 강화"
 JAP_diplomacy.50.a: "공동 연구를 가속합시다."
 JAP_diplomacy.51.t: "일본 유학 정원 확대"
 JAP_diplomacy.51.d: "일본 정부는 대만 학생들이 일본 대학에서 공부할 기회를 늘리기 위해 장학금 할당과 입학 정원을 확대할 것을 제안했습니다. 이 구상은 학술적, 문화적 유대를 심화할 뿐 아니라 두 사회를 이어 줄 미래의 인재를 기르는 것을 목표로 합니다. 교류가 넓어질수록 일본-대만 관계를 이끌어 갈 다음 세대의 토대는 더욱 굳건해질 것입니다."
 JAP_diplomacy.51.a: "다음 세대를 위한 투자입니다."
 JAP_diplomacy.52.t: "무역 제도 개혁 지원 제안"
 JAP_diplomacy.52.d: "일본 정부는 중국의 무역 제도 개혁과 현대화를 지원하기 위한 기술적, 제도적 협력을 제안했습니다. 통관 절차를 간소화하고, 행정 업무를 디지털화하며, 국제 표준에 부합하는 규칙을 마련함으로써 무역을 원활히 하고 기업 활동의 예측 가능성을 높이는 것이 목표입니다. 이러한 개혁이 진전되면 수출입의 절차적 부담이 줄어 경제 활동의 마찰이 낮아질 것입니다. 이 제안을 수락하면 중국 내 일본의 영향력도 커질 것입니다.\n\n일본의 지원을 수락하고 우리 무역 제도의 국제적 조화를 추진해야 합니까?"
 JAP_diplomacy.52.a: "수락한다"
 JAP_diplomacy.52.b: "거부한다"
 JAP_diplomacy_52_TT: "§Y제안이 수락되면 중국은 세금 부담 감소 변동치를 받으며, 우리는 중국 내에서 §G영향력§!을 얻습니다!§!"
 JAP_diplomacy.53.t: "협력 제안 수락됨"
 JAP_diplomacy.53.d: "[FROM.GetName](은)는 무역 제도의 개혁과 현대화를 위한 일본의 기술적, 제도적 지원 제안을 수락했습니다. 통관 절차가 간소화되고 행정 업무가 개선됨에 따라 무역 원활화와 기업 활동의 예측 가능성이 높아지고, 일본 기업이 시장에 진입할 환경도 개선될 것입니다. 이 합의는 중국 내 일본의 영향력을 꾸준히 강화할 것입니다."
 JAP_diplomacy.53.a: "좋습니다."
 JAP_diplomacy.54.t: "제안 거절됨"
 JAP_diplomacy.54.d: "[FROM.GetName](은)는 무역 제도의 개혁과 현대화를 위한 기술적, 제도적 지원을 제공하겠다는 일본의 제안을 거절하겠다고 밝혔습니다. 상대방은 자체 정책 설계의 우선순위와 국내 조율을 앞세우는 것으로 보이나, 이것이 개혁의 필요성 자체를 거부한다는 뜻은 아닙니다. 일본은 상대국의 사정을 염두에 두면서 대화와 협력의 여지를 남겨 두어야 합니다."
 JAP_diplomacy.54.a: "알겠습니다."
 JAP_diplomacy.55.t: "중일 투자 협력 확대"
 JAP_diplomacy.55.d: "일본 정부는 일본과 중국 기업 간의 상호 투자와 시장 진출을 촉진하기 위한 제도 조율과 협력 틀을 추진할 의사를 밝혔습니다. 상호 진출이 가속되면 생산망이 최적화되고 공급망이 더 효율적으로 바뀌어 전반적인 산업 생산성이 오를 것으로 기대됩니다. 경제적 상호 의존의 심화에는 위험도 따르지만, 마찰을 줄임으로써 동시에 실질적인 안정 요인으로 작용할 수 있습니다."
 JAP_diplomacy.55.a: "시장을 열고 효율을 높입시다."
 JAP_diplomacy.56.a: "문화적 연대를 심화합시다."
 JAP_diplomacy.57.t: "중일 불교 사찰 공동 보존 사업"
 JAP_diplomacy.57.d: "일본 정부는 불교 사찰을 공동 문화유산으로서 함께 보존하고 복원하는 중일 공동 사업을 시행할 것을 제안했습니다. 복원 기술과 조사 방법을 공유하고 문화재 보호를 위한 협력 틀을 마련함으로써, 사찰과 관련 문화 자산의 가치를 재확인하고 장기 보존을 보장하는 것이 목표입니다. 이러한 보존 노력의 성과가 가시화되면 문화 관광의 매력이 높아지고 지역 경제에도 긍정적 파급 효과를 기대할 수 있습니다. 이 협력은 두 나라 사이의 역사적 유대를 재확인하는 계기가 될 수도 있습니다."
 JAP_diplomacy.57.a: "유산을 보호하고 관광을 진흥합시다."
 JAP_diplomacy.58.t: "도쿄-서울 액셀러레이터"
 JAP_diplomacy.58.d: "일본 정부는 도쿄와 서울에 공동 액셀러레이터 프로그램을 설립하여 양국의 스타트업 지원을 제도화하자는 제안을 제시했습니다. 자금 조달 지원, 멘토링, 기업 및 대학과의 협력, 두 도시 간 인재 교류를 통해 스타트업 성공률을 높이고 기술 협력을 강화하는 것이 목표입니다. 이 틀이 의도대로 작동하면 두 도시 사이의 혁신이 가속되고, 한일 경제 협력이 보다 실질적이고 성과 중심으로 강화될 것입니다."
 JAP_diplomacy.58.a: "스타트업의 기세를 가속합시다."
 JAP_diplomacy.59.t: "한일 지역 간 협력 확대"
 JAP_diplomacy.59.a: "지역에서 성장을 만들어 냅시다."
 JAP_diplomacy.60.t: "한일 문화 교류 제안"
 JAP_diplomacy.60.d: "일본 정부는 일본과 대한민국 사이의 문화 교류를 체계적으로 확대하자는 제안을 제시했습니다. 미디어, 예술, 스포츠, 관광, 교육 교류를 통해 양국 국민 간의 상호 이해를 심화하고 사회적 거리를 줄이는 것이 목표입니다. 교류가 넓어지면 대중의 정서와 대외 태도에도 영향을 미칠 것이며, 양국은 서로의 국내 영역에서 보다 효과적으로 발언할 수 있는 환경을 얻게 될 것입니다.\n\n이 제안을 수락하고 문화 교류를 추진해야 합니까?"
 JAP_diplomacy.60.a: "수락한다"
 JAP_diplomacy.60.b: "거부한다"
 JAP_diplomacy_60_TT: "§Y제안이 수락되면 우리는 한국에서 §G영향력§!을 얻지만, 한국도 일본에서 §R영향력§!을 얻습니다.§!"
 JAP_diplomacy_60_TT2: "§Y문화 교류로 우리는 일본에서 영향력을 얻을 수 있지만, 일본의 국내 영향력도 커집니다.§!"
 JAP_diplomacy.61.t: "제안 수락됨"
 JAP_diplomacy.61.d: "[FROM.GetName](은)는 문화 교류를 확대하자는 일본의 제안에 동의했습니다. 미디어, 예술, 스포츠, 관광, 교육 분야의 교류가 넓어짐에 따라 상호 이해가 깊어지고 양국의 대중 정서에도 변화가 뒤따를 수 있습니다. 이 합의를 통해 일본은 한국 내에서 더 큰 발언권을 얻게 되고, 한국도 일본 내에서 영향력을 강화할 것입니다."
 JAP_diplomacy.61.a: "좋습니다."
 JAP_diplomacy.62.t: "제안 거절됨"
 JAP_diplomacy.62.d: "[FROM.GetName](은)는 문화 교류를 확대하자는 일본의 제안을 거절하겠다고 밝혔습니다. 상대국은 여론과 국내 사정에 대한 고려를 앞세우는 것으로 보이나, 이것이 문화 교류 자체를 거부한다는 뜻은 아닙니다. 일본은 대화 경로를 열어 두면서 다른 방식으로 상호 이해를 증진할 여지를 남겨 두어야 합니다."
 JAP_diplomacy.62.a: "알겠습니다."
 JAP_diplomacy.63.t: "한일 고령화 사회 대책반"
 JAP_diplomacy.63.d: "일본 정부는 고령화 사회라는 공동의 과제에 대응하기 위해 일본과 대한민국의 전문가 및 관련 기관으로 구성된 공동 대책반을 설립하고, 매월 협의하여 협력 정책을 수립할 것을 제안했습니다. 노인 돌봄 및 의료 체계 강화, 고용 지원, 지역 복지 설계에 관한 전문 지식을 공유함으로써 정책 대응의 속도와 효과를 모두 높이는 것이 목표입니다. 이 틀이 뿌리를 내리면 사회 복지 대책의 강화가 진전되고 장기적인 사회 안정에 기여할 것입니다."
 JAP_diplomacy.63.a: "함께 준비를 진행합시다."
 JAP_diplomacy_63_TT: "§Y대한민국은 인구 증가 변동치를 받습니다.§!"
 JAP_diplomacy.64.t: "한랭 지역 개발 협력"
 JAP_diplomacy.64.d: "일본 정부는 홋카이도의 한랭 기후 지역 활성화 경험을 바탕으로, 기반시설 투자와 외국 자본 도입을 통해 러시아 극동의 한랭 지역 개발을 지원하는 \\"극동 구상\\"을 제안했습니다. 교통, 물류, 에너지의 기초 여건 개선을 진전시켜 지역 경제 활동을 활성화하고 개발의 실효성을 높이는 것이 목표입니다. 이 구상은 사하와 캄차카의 기반시설 개발을 대상으로 합니다."
 JAP_diplomacy.64.a: "극동의 기반을 강화합시다."
 JAP_diplomacy.65.t: "사할린 II"
 JAP_diplomacy.65.d: "일본 정부는 화석 연료에 대한 안정적인 접근을 확보하기 위해, 러시아와 협력하면서 사할린 II 에너지 사업에 대한 외국인 투자를 강화할 의사를 밝혔습니다. 자본 투자와 운영 안정화가 진전되면 개발의 연속성이 개선되고 생산 능력의 확대를 기대할 수 있습니다. 사할린은 중요한 공급 거점으로 남을 것이며 지역 경제에도 긍정적인 효과를 가져올 것으로 보입니다."
 JAP_diplomacy.65.a: "생산 능력을 확대합시다."
 JAP_diplomacy.66.t: "유라시아 수송망 협력 개시"
 JAP_diplomacy.66.d: "일본 정부는 러시아를 경유하여 일본과 유럽을 잇는 육상 물류 회랑을 개발하기 위한 러일 협력을 추진할 의사를 밝혔습니다. 철도망과 주요 간선도로를 활용하여 수송 시간을 단축하고 유럽 시장에 대한 안정적인 접근을 확립하는 한편, 회랑을 따라 기반시설 개선을 가속하는 것이 목표입니다. 화물이 실제로 흐르기 시작하면 러시아는 유라시아 거점으로서의 중요성을 더욱 높일 것이며 경제적 연결성도 깊어질 것입니다."
 JAP_diplomacy.66.a: "회랑 개발을 가속합시다."
 JAP_diplomacy.67.t: "러일 IT 기반시설 협력 개시"
 JAP_diplomacy.67.d: "일본 정부는 일본 IT 기업과 협력하여 러시아에 데이터 센터와 광섬유 네트워크 같은 기반시설을 개발하는 \\"러시아 디지털 회랑\\" 구상을 제시했습니다. 국내 통신 기반시설을 개선하는 동시에, 유럽·중앙아시아·러시아를 잇는 디지털 무역망의 거점으로서 러시아의 역할을 강화하는 것이 목표입니다. 이 협력이 궤도에 오르면 정보 흐름의 안정성과 네트워크 용량이 개선되고 경제 활동의 디지털화도 가속될 것입니다."
 JAP_diplomacy.67.a: "연결 기반시설을 확대합시다."
 JAP_historical.20110311.t: "동일본 대지진"
 JAP_historical.20110311.d: "2011년 3월 11일 오후 2시 46분, 도호쿠 지방 태평양 연안 앞바다에서 규모 9.0의 거대 지진이 발생했습니다. 일본에서 관측된 가장 강력한 진동은 도호쿠에서 간토에 이르는 넓은 지역을 격렬하게 뒤흔들었고, 뒤이어 닥친 거대한 쓰나미는 해안 마을과 촌락을 집어삼켜 참혹한 폐허를 남겼습니다. 항구와 어촌은 순식간에 파괴되었고 도로, 철도, 공항이 끊겨 도시 기능이 혼란에 빠졌습니다.\n\n수십만 명이 집을 잃고 긴급 대피소로 피난했습니다. 지역 경제의 근간인 농업, 수산업, 제조업이 치명적인 피해를 입어 경제적 타격은 엄청납니다. 기반시설 복구, 이재민 지원, 산업과 도시의 재건이라는 과제가 동시에 닥치면서 정부의 행정 역량은 한계까지 내몰릴 것입니다.\n\n이 전례 없는 비극 속에서 일본 국민은 회복력과 연대를 보여 주었습니다. 그러나 정부가 얼마나 신속하고 효과적으로 대응하느냐가 국가의 안정과 미래를 좌우할 것입니다."
 JAP_historical.20110311.a: "구조와 복구에 모든 노력을 쏟아야 합니다."
 JAP_great_east_japan_earthquake_tree_tt: "§Y동일본 대지진 이후 재건을 위한 국가 중점 트리가 잠금 해제되었습니다!§!"
 JAP_news.02.t: "전례 없는 지진, 일본을 강타"
 JAP_news.02.d: "2011년 3월 11일, 일본은 거대한 지진의 습격을 받았습니다. 훗날 동일본 대지진으로 불리게 되는 도호쿠 태평양 연안 앞바다의 이 규모 9.0 지진은 넓은 지역에 참혹한 파괴를 일으켜 수만 명이 사망하거나 실종되었으며 헤아릴 수 없는 경제적 손실을 입혔습니다.\n\n뒤이은 쓰나미는 해안 마을, 항구, 교통망을 순식간에 휩쓸어 수십만 명이 대피소로 몰렸습니다. 일본 사회는 이제 전후 이래 최대의 위기에 직면해 있습니다.\n\n동일본 대지진은 세계 주요 경제 대국 중 하나가 어떻게 복구를 이루어 낼지 세계가 지켜보는 가운데 결정적인 순간이 되었습니다."
 JAP_news.02.a: "끔찍한 비극..."
 Japan.201103111.t: "복구 완료 선언"
 Japan.201103111.d: "대재해로부터 수년이 흘러 잔해는 치워졌고, 도시에는 다시 사람들의 활기가 가득합니다. 피해자들의 삶은 점차 안정되었고 산업과 기반시설도 복구되었습니다. 오늘 정부는 '복구 달성'을 공식 선언하여 오랜 고난의 시대에 종지부를 찍습니다.\n\n이 비극은 깊은 상처를 남겼지만, 회복력과 자긍심도 길러 내어 더 밝은 미래의 토대를 놓았습니다."
 Japan.201103111.a: "우리는 역경을 이겨 냈습니다!"
 Japan.201103112.t: "기반시설 복구 진전"
 Japan.201103112.d: "재해로 파괴된 기반시설 일부가 복구되었습니다. 교통과 물류가 점차 재개되어 일상생활에 작지만 의미 있는 변화를 가져오고 있습니다. 완전한 복구는 아직 멀었지만, 이는 분명한 전진입니다."
 Japan.201103112.a: "한 걸음 전진입니다."
 Japan.201103113.t: "기반시설 완전 복구"
 Japan.201103113.d: "지진으로 파괴된 도호쿠의 기반시설이 마침내 목표한 복구 수준에 이르렀습니다. 교통망과 물류 기능이 다시 완전히 가동되어 지역 사회와 경제에 새로운 활력을 불어넣고 있습니다. 재건 노력은 중대한 이정표에 도달했습니다."
 Japan.201103113.a: "중대한 이정표입니다."
 Japan.201103114.t: "기반시설 복구 진전"
 Japan.201103114.d: "재해로 파괴된 기반시설 일부가 복구되었습니다. 교통과 물류가 점차 재개되어 일상생활에 작지만 의미 있는 변화를 가져오고 있습니다. 완전한 복구는 아직 멀었지만, 이는 분명한 전진입니다."
 Japan.201103114.a: "한 걸음 전진입니다."
 Japan.201103115.t: "기반시설 완전 복구"
 Japan.201103115.d: "지진으로 파괴된 간토의 기반시설이 마침내 목표한 복구 수준에 이르렀습니다. 교통망과 물류 기능이 다시 완전히 가동되어 지역 사회와 경제에 새로운 활력을 불어넣고 있습니다. 재건 노력은 중대한 이정표에 도달했습니다."
 Japan.201103115.a: "중대한 이정표입니다."
 Japan.201103116.t: "통신망 복구"
 Japan.201103116.d: "피해 지역의 통신망이 마침내 부분적으로 복구되었습니다. 일상생활과 업무를 위한 통신이 개선되어 지역 경제와 사회에 새로운 희망을 가져오고 있습니다."
 Japan.201103116.a: "추가 복구를 계속 추진한다"
 Japan.201103117.t: "통신망 완전 복구"
 Japan.201103117.d: "지진으로 파괴된 도호쿠의 통신 기반시설이 마침내 목표한 복구 수준에 이르렀습니다. 일상생활과 산업의 토대가 확보되면서 복구의 길은 중대한 이정표에 도달했습니다."
 Japan.201103117.a: "복구의 한 걸음으로 기록한다"
 Japan.201103118.t: "통신망 완전 복구"
 Japan.201103118.d: "지진으로 파괴된 간토의 통신 기반시설이 마침내 목표한 복구 수준에 이르렀습니다. 일상생활과 산업의 토대가 확보되면서 복구의 길은 중대한 이정표에 도달했습니다."
 Japan.201103118.a: "복구의 한 걸음으로 기록한다"
 Japan.201103119.t: "지역 산업 재개"
 Japan.201103119.d: "피해 지역의 공장과 기업이 가동을 재개했습니다. 완전한 복구는 아직 멀었지만, 일자리와 경제 활동의 복귀는 눈에 보이는 진전의 실감을 줍니다."
 Japan.201103119.a: "산업 복구를 더욱 추진한다"
 Japan.2011031110.t: "산업 기반 완전 복구"
 Japan.2011031110.d: "지진으로 파괴된 도호쿠의 산업 기반이 마침내 목표한 복구 수준에 이르렀습니다. 일자리와 생산 능력이 회복되면서 재건의 길은 중대한 이정표에 도달했습니다."
 Japan.2011031110.a: "복구의 다음 단계로 나아간다"
 Japan.2011031111.t: "지역 산업 재개"
 Japan.2011031111.d: "피해 지역의 공장과 기업이 가동을 재개했습니다. 완전한 복구는 아직 멀었지만, 일자리와 경제 활동의 복귀는 눈에 보이는 진전의 실감을 줍니다."
 Japan.2011031111.a: "산업 복구를 더욱 추진한다"
 Japan.2011031112.t: "산업 기반 완전 복구"
 Japan.2011031112.d: "지진으로 파괴된 간토의 산업 기반이 마침내 목표한 복구 수준에 이르렀습니다. 일자리와 생산 능력이 회복되면서 재건의 길은 중대한 이정표에 도달했습니다."
 Japan.2011031112.a: "복구의 다음 단계로 나아간다"
 Japan.2011031150.t: "후쿠시마 제1원자력 발전소 사고"
 Japan.2011031150.d: "일본은 전례 없는 지진과 쓰나미의 습격을 받았고, 나라가 대응에 분주한 가운데 또 하나의 최악의 보고가 들어왔습니다. 쓰나미가 후쿠시마의 후쿠시마 제1원자력 발전소를 덮쳐 비상 발전기, 배터리, 연료 탱크가 고장 나면서 부지는 전원이 완전히 상실되었습니다.\n설상가상으로 원자로 건물 내부에 다량의 수소가 발생하여 쌓였고, 이는 1호기, 3호기, 4호기의 수소 폭발로 이어졌습니다. 손상 부위로부터의 방사성 물질 누출이 우려되면서 대중은 공황에 빠졌습니다."
 Japan.2011031150.a: "즉시 행동해야 합니다!"
 JAP_news.03.t: "후쿠시마 제1원자력 발전소 사고"
 JAP_news.03.d: "지진과 쓰나미 이후 일본의 후쿠시마 제1원자력 발전소에서 심각한 사고가 보고되었습니다. 지진 직후 원자로는 정지했으나, 쓰나미로 인해 비상 발전기와 기타 핵심 장비가 작동 불능이 되어 전원이 완전히 상실된 것으로 전해집니다. 냉각을 더 이상 유지할 수 없게 되면서 여러 호기에서 노심 용융이 발생했습니다.\n수소의 발생과 축적은 원자로 건물의 폭발도 일으켰으며, 방사성 물질이 손상 부위를 통해 환경으로 방출되었을 가능성이 매우 높은 것으로 여겨집니다. 일본 정부는 대응에 분주합니다."
 JAP_news.03.a: "이런 사태가..."
 Japan.2011031151.t: "기로에 선 일본의 원자력 정책"
 Japan.2011031151.d: "원전 사고로부터 한 달이 지났고, 일본 정부는 이제 결단을 강요받고 있습니다. 후쿠시마 제1원전 사고는 원자력 안전에 대한 대중의 인식을 뿌리째 흔들어 놓았습니다. 여론은 갈라졌고, 재계는 전력 공급에 미칠 영향을 우려하며, 시민들은 방사성 물질 누출 가능성에 불안해하고 있습니다.\n\n일본은 이제 원자력에 계속 의존할 것인지, 다른 길을 택할 것인지 분명히 밝혀야 합니다."
 Japan.2011031151.a: "금지하고 가동을 중단하라!"
 Japan.2011031151.b: "엄격한 점검을 도입해야 합니다."
 Japan.2011031151.c: "예전처럼 계속하라!"
 JAP_territorial.01.t: "북방 영토 협상 개시"
 JAP_territorial.01.d: "북방 영토를 둘러싼 영토 분쟁은 종전 이래 [JAP.GetName]와(과) [SOV.GetName] 사이의 오랜 현안이었습니다. 이제 우리나라는 이 문제를 평화적으로 해결하기 위해 [SOV.GetName]에 공식적으로 협상을 요청하려는 시점에 이르렀습니다. 이는 단순한 외교적 형식이 아니라 우리의 주권과 역사적 정당성을 주장하는 중요한 단계입니다."
 JAP_territorial.01.oA: "시작합시다!"
 JAP_territorial.02.t: "[JAP.GetName], 북방 영토 협상 요청"
 JAP_territorial.02.d: "[JAP.GetAdjective] 정부는 북방 영토에 관한 협상을 시작하자는 공식 요청을 보내왔습니다. 이 문제는 수십 년 동안 보류되어 왔으며, 이번 결정은 우리의 국제적 위상과 국내 정치 모두에 영향을 미칠 것입니다. 타협은 국익의 손실을 뜻합니까, 아니면 국제적 신뢰의 획득을 뜻합니까? 결단의 때가 왔습니다."
 JAP_territorial.02.oA: "[JAP.GetName]에 영토를 양도한다"
 JAP_territorial.02.oB: "요청을 거절한다. 협상의 여지는 없다"
 JAP_territorial.03.t: "북방 영토 반환 합의"
 JAP_territorial.03.d: "마침내 오랜 북방 영토 문제가 해결되었습니다. [SOV.GetName]와(과)의 협상 끝에 분쟁 영토의 반환에 합의가 이루어졌습니다. 이는 외교적 승리이자 전후 [JAP.GetAdjective] 역사에서 역사적 성과입니다."
 JAP_territorial.03.oA: "역사적인 합의입니다!"
 JAP_territorial.04.t: "북방 영토 협상 결렬"
 JAP_territorial.04.d: "[SOV.GetAdjective] 정부는 북방 영토 반환에 관한 우리의 협상 제안을 공식적으로 거부했습니다. 우리의 외교적 노력에도 불구하고 해결은 이루어지지 않았습니다. 우리는 이제 향후 재협상에 대비하여 더 큰 신뢰를 쌓고 영향력을 넓히는 데 집중해야 합니다."
 JAP_territorial.04.oA: "이번엔 너무 일렀군요..."
 JAP_territorial.05.t: "[CHI.GetName]와(과) 센카쿠 협상 개시"
 JAP_territorial.05.d: "[JAP.GetName](은)는 현재 센카쿠 열도를 실효 지배하고 있으나, [CHI.GetName](은)는 계속 주권을 주장하고 있습니다. 과거의 외교적 노력에 비추어, 이제 우리나라가 평화적 해결을 위해 [CHI.GetAdjective] 정부와 공식 협상에 나설 때가 왔습니다."
 JAP_territorial.05.oA: "시작합시다!"
 JAP_territorial.06.t: "[JAP.GetName], 영토 협상 제안"
 JAP_territorial.06.d: "[JAP.GetAdjective] 정부는 우리에게 센카쿠 열도에 대한 영유권 주장을 철회할 것을 요구했습니다. 그들은 평화적 해결과 지역 안정을 주창하며, 외교적 압력과 국제적 지지를 등에 업고 협상을 추진하고 있습니다. 이 제안의 수용은 국내외에서 지지와 반대를 모두 불러일으킬 것이 분명합니다."
 JAP_territorial.06.oA: "영유권 주장을 철회하고 지역 안정을 우선한다."
 JAP_territorial.06.oB: "영유권 주장을 유지하고 국가 주권을 수호한다."
 JAP_territorial.07.t: "[CHI.GetName], 센카쿠 영유권 주장 철회!"
 JAP_territorial.07.d: "[CHI.GetName](은)는 센카쿠 열도에 대한 영유권 주장을 공식 철회했습니다. 동중국해의 오랜 긴장이 크게 완화되었으며, 이는 국내외에서 중대한 외교적 승리로 환영받고 있습니다. 지역 안정과 신뢰 구축을 향한 중요한 첫걸음이 되었습니다."
 JAP_territorial.07.oA: "역사적인 돌파구입니다."
 JAP_territorial.08.t: "[CHI.GetName], 영유권 주장 유지"
 JAP_territorial.08.d: "[CHI.GetName](은)는 센카쿠 열도에 대한 영유권 주장을 유지하겠다고 선언했습니다. 협상은 성과 없이 끝났으며, 관계 구축과 국제적 영향력 강화가 더 필요함을 드러냈습니다. 대화는 여전히 가능하나 상황은 계속 어렵습니다."
 JAP_territorial.08.oA: "아직 이르지 않았나 싶군요..."
 JAP_territorial.09.t: "[TAI.GetName]와(과) 센카쿠 협상 개시"
 JAP_territorial.09.d: "[TAI.GetName](은)는 역사적, 지리적 근거를 들어 오랫동안 센카쿠 열도에 대한 주권을 주장해 왔으며, [JAP.GetName](은)는 자국의 실효 지배의 정당성에 대한 입장을 견지하고 있습니다. 이 오랜 문제를 평화적으로 해결하기 위해, 우리는 [TAI.GetName]에 공식 외교 제안을 하겠습니다."
 JAP_territorial.09.oA: "시작합시다!"
 JAP_territorial.10.t: "[JAP.GetName], 영토 협상 제안"
 JAP_territorial.10.d: "[JAP.GetAdjective] 정부는 우리에게 센카쿠 열도에 대한 영유권 주장을 포기할 것을 요구했습니다. 양안 관계의 복잡성과 더 넓은 국제적 맥락을 고려할 때, 이 요구를 수용할지 결정하는 데에는 신중한 숙고가 필요할 것입니다."
 JAP_territorial.10.oA: "지역 안정을 위해 영유권 주장을 철회한다."
 JAP_territorial.10.oB: "우리의 주권을 계속 주장해야 합니다."
 JAP_territorial.11.t: "[TAI.GetName], 센카쿠 영유권 주장 철회!"
 JAP_territorial.11.d: "[TAI.GetAdjective] 당국은 센카쿠 열도에 대한 영유권 주장을 공식 철회했습니다. 동중국해의 오랜 현안 하나가 해결됨으로써 [JAP.GetName]-[TAI.GetName] 관계는 새로운 안정의 시대로 접어들고 있으며, 앞으로 더 깊은 협력에 대한 기대가 높아지고 있습니다."
 JAP_territorial.11.oA: "역사적인 합의입니다."
 JAP_territorial.12.t: "[TAI.GetName], 영유권 주장 철회 거부"
 JAP_territorial.12.d: "[TAI.GetName](은)는 센카쿠 열도에 대한 영유권 주장을 유지하겠다고 선언했습니다. 협상은 결렬로 끝났으며, 이 문제를 해결하려면 앞으로 더 큰 외교적 영향력과 더 굳건한 상호 신뢰가 필요함이 분명해졌습니다."
 JAP_territorial.12.oA: "여전히 너무 일렀나 봅니다..."
 JAP_territorial.13.t: "[KOR.GetName]와(과) 다케시마 협상 개시"
 JAP_territorial.13.d: "[JAP.GetName]와(과) [KOR.GetName] 사이의 다케시마를 둘러싼 오랜 영토 분쟁을 끝내기 위해, 우리 정부는 [KOR.GetName]에 평화적 협상을 제안했습니다. 이는 우리의 주장을 일방적으로 강요하는 것이 아니라 양국의 미래지향적 관계를 구축하려는 것입니다."
 JAP_territorial.13.oA: "시작합시다!"
 JAP_territorial.14.t: "[JAP.GetName], 독도 협상 제안"
 JAP_territorial.14.d: "[JAP.GetAdjective] 정부가 독도의 주권을 둘러싼 협상을 위해 접근해 왔습니다. 국내 여론과 역사적 맥락에 비추어 이는 극히 어려운 결정이지만, [JAP.GetName]-[KOR.GetName] 관계의 미래를 좌우할 수 있는 중대한 외교적 판단이기도 합니다."
 JAP_territorial.14.oA: "[JAP.GetName]와(과)의 관계 개선을 우선하여 이양에 동의한다."
 JAP_territorial.14.oB: "우리의 국토를 포기할 수는 없습니다."
 JAP_territorial.15.t: "[KOR.GetName], 다케시마 이양에 동의!"
 JAP_territorial.15.d: "[JAP.GetName]-[KOR.GetName] 관계 개선 노력의 일환으로 [KOR.GetAdjective] 정부는 다케시마를 반환하기로 동의했습니다. 이로써 수십 년간의 대립이 끝나고 두 나라 사이에 새로운 신뢰의 국면이 열립니다. 평화적인 외교적 노력이 결실을 맺은 순간입니다."
 JAP_territorial.15.oA: "역사적인 성과입니다."
 JAP_territorial.16.t: "[KOR.GetName], 다케시마 협상 거부"
 JAP_territorial.16.d: "[KOR.GetAdjective] 정부는 다케시마를 반환해 달라는 우리의 요청을 거절했습니다. 영토 문제의 해결은 여전히 어려우며, 더 강력한 외교적 영향력과 상호 신뢰 없이는 이 문제를 매듭짓기 어려울 것입니다."
 JAP_territorial.16.oA: "당분간 대화를 계속해야 합니다."
 JAP_renegotiation_territory: "1년 뒤 재협상이 가능합니다!"
 JAP_historical.20010426.t: "모리 요시로 사임, 고이즈미 준이치로 총리 취임"
 JAP_historical.20010426.oA: "지금 바로 개혁을!"
 JAP_historical.20060926.t: "연임인가, 승계인가?"
 JAP_historical.20060926.oA: "고이즈미 준이치로"
 JAP_historical.20060926.oB: "아베 신조"
 JAP_historical.20070926.t: "연속인가, 쇄신인가?"
 JAP_historical.20070926.oA: "아베 신조"
 JAP_historical.20070926.oB: "후쿠다 야스오"
 JAP_historical.20080924.t: "조용한 이행인가, 과감한 전환인가?"
 JAP_historical.20080924.oA: "후쿠다 야스오"
 JAP_historical.20080924.oB: "아소 다로"
 Japan.01.t: "전통주의 세력의 접근"
 Japan.01.d: "모리 총리의 발언을 둘러싼 논란이 계속되는 가운데, 황실을 일본 국가 질서의 중심으로 재평가해야 한다고 주장하는 여러 단체와 평론가들이 활동을 강화했습니다. 그들은 정부에 접근하여, 정부가 전통과 국가의 고유성을 수호하려는 의지를 더 분명히 보인다면 여론 형성과 풀뿌리 활동을 통해 정부를 지지할 수 있다고 제안했습니다.\n\n그러나 이런 세력과 가까워지면 기성 보수주의와 급진적 군주주의 사이의 경계가 흐려져 정권에 대한 새로운 비판을 부를 위험이 있습니다. 이 제안을 활용해야 합니까, 아니면 거리를 두어야 합니까?"
 Japan.01.a: "거리를 둔다."
 Japan.01.b: "정치적 지렛대로 활용한다."
 JAP_koizumi_appear_TT: "모리는 골프를 즐길지 모르나, 그의 정치적 영향력은 크게 줄어들 것으로 보입니다. 당은 머지않아 §Y새 지도자§!를 찾기 시작할 수 있습니다."
 JAP_historical.20030926.t: "민주당-자유당 합당: 민주당에 합류한 자유당"
 JAP_historical.20030926.d: "비자민당 세력을 결집하려는 움직임이 가속화되고 있습니다. 거듭된 협의 끝에 민주당과 자유당은 비자민당 진영의 주요 정치 세력을 하나의 조직으로 통합하기로 합의했습니다.\n\n자유당은 해산하여 흡수 합병 형태로 민주당에 합쳐질 것입니다. 이는 의회 내 비자민당 진영의 존재감을 높이겠지만, 정책 노선과 지도부를 둘러싼 당 간의 주도권 다툼으로 새로운 갈등의 불씨가 생길 수도 있습니다."
 JAP_historical.20030926.a: "비자민당 재편이 본격적으로 시작되었습니다."
 JAP_historical.20070307.t: "수상한 광열수도비"
 JAP_historical.20070307.d: "2007년 3월, 참의원 예산위원회 회기 중에 농림수산상 마쓰오카 도시카쓰의 정치자금 관리단체 \\"마쓰오카 도시카쓰 신세기 정치경제 포럼\\"이 2001년부터 2005년까지 5년간 정치자금 보고서에 광열수도비로 총 약 2,880만 엔을 보고한 사실이 드러났습니다.\n\n특히 문제가 된 것은 이 단체의 \\"주 사무소\\"가 수도, 전기, 냉난방이 무상으로 제공되는 중의원 의원회관에 있었다는 점입니다.\n마쓰오카 장관은 경비에 \\"정수기\\"와 \\"전기 난방\\" 비용이 포함되어 있다고 해명했으나, 보고된 금액에 대한 명확한 근거는 제시하지 못했습니다. 이후 국회 회기에서도 그는 \\"제도상 더 이상의 설명은 필요 없다\\"며 추가 설명을 거부했습니다.\n\n야당은 \\"허위 기재\\" 및 \\"제도 남용\\" 가능성이 있다며 강하게 비판했고, 정부의 전반적인 책임 이행에 대한 국민의 불신도 커졌습니다."
 JAP_historical.20070307.oA: "장관에게 국민 앞에서 충분히 설명하도록 요구한다"
 JAP_historical.20070307.oB: "조사가 마무리될 때까지 그를 옹호한다"
 JAP_historical.20070528.t: "너무 무거운 짐"
 JAP_historical.20070528.d: "농림수산상 마쓰오카 도시카쓰가 도쿄 아카사카의 국회 의원 숙소에서 목을 매 숨진 채 발견되었습니다. 경찰은 이후 자살로 확인했습니다.\n\n수개월 동안 마쓰오카 장관은 정치자금 수지 보고서에 기재된 높은 광열수도비를 두고 국회, 언론, 여론의 거센 추궁을 받아 왔습니다.\n\n이 소식은 국민에게 큰 충격을 안겼으며, \\"책임을 물어야 할 사람은 그 한 사람뿐이었는가?\\" \\"정부의 대응은 정말 적절했는가?\\" 하는 더 깊은 의문을 불러일으켰습니다."
 JAP_historical.20070528.oA: "참으로 비극적이다..."
 JAP_historical.20070801.t: "연쇄 스캔들: 책임의 무게"
 JAP_historical.20070801.d: "농림수산상 마쓰오카 도시카쓰의 사망 이후 아카기 노리히코가 후임으로 임명되었습니다. 그러나 불과 두 달 뒤, 아카기는 사무소 경비, 기부금 처리, 정치단체 \\"도쿠유카이\\"의 영수증 이중 보고 등 정치자금 보고서와 관련한 여러 문제가 제기되어 사실상 사임을 강요당했습니다.\n\n이렇게 짧은 기간에 농림수산상 두 명이 연이어 스캔들에 휘말리면서, 정권의 책임 의식과 투명성, 그리고 각료 인선의 신뢰성에 대한 심각한 의문이 제기되었습니다. 농림수산상 자리는 \\"저주받은\\" 자리로 여겨지게 되었으며, 정권은 이제 신뢰를 회복하고 지도력을 안정시키기 위한 결단력 있는 조치를 취하라는 압박을 받고 있습니다."
 JAP_historical.20070801.oA: "왜 이런 일이 계속되는가? 국민의 신뢰를 되찾아야 한다."
 JAP_historical.20070704.t: "치명적인 실언"
 JAP_historical.20070704.d: "방위상 규마 후미오는 공개 강연에서 히로시마와 나가사키에 대한 원자폭탄 투하가 \\"어쩔 수 없었다\\"는 취지의 논란이 될 발언을 했습니다.\n이 발언은 원폭 투하를 용인하는 것으로 널리 해석되어 원폭 피해자 단체와 국민의 거센 반발을 불러일으켰습니다. 여야 의원은 물론 지방 자치단체에서도 비판이 쏟아졌습니다. 아베 총리는 공식적으로 질책했습니다.\n발언 이후 피해 도시에서는 지역 지도자와 시민 단체가 농성 시위를 벌였고, 논란은 본격적인 정치적 위기로 번졌습니다. 규마는 결국 방위상직에서 사임했고, 후임으로 고이케 유리코가 임명되었습니다.\n\n\\"장관 한 사람의 단순한 실언\\"으로 시작된 일은 정권의 통치 능력과 국제적 신뢰성에 대한 심각한 시험대가 되었습니다."
 JAP_historical.20070704.oA: "정부로서 진심 어린 깊은 유감을 표명해야 한다."
 JAP_historical.20090808.t: "당신의 당 창당"
 JAP_historical.20090808.d: "정권 교체에 대한 기대가 높아지는 가운데, 기존 정당들의 더딘 의사 결정과 경직된 행정에 대한 불만이 여전히 강합니다. 이러한 분위기 속에서 와타나베 요시미 등은 \\"개혁\\"을 전면에 내세우며 기존 틀에 의존하지 않는 새로운 정치 세력의 결집을 호소했습니다.\n\n이렇게 해서 당신의 당의 창당이 발표되었습니다. 행정 개혁과 규제 완화를 주창하는 이 움직임은 유권자의 선택지를 넓히는 한편, 일본 정계의 재편과 합종연횡을 더욱 가속할 것입니다."
 JAP_historical.20090808.a: "개혁의 깃발 아래, 새로운 세력이 움직이기 시작한다."
 JAP_historical.20120928.t: "일본유신회 창당"
 JAP_historical.20120928.d: "기존 정당에 대한 불신과 정치적 정체에 대한 불만이 확산되는 가운데, 오사카에서 영향력을 넓혀 온 지역 정당 오사카 유신회를 기반으로 한 개혁 운동이 국정 진출을 향해 움직이기 시작했습니다. 지방 행정 재검토와 통치 개혁을 주창하며 지방 정치에서 존재감을 키워 온 이 흐름은 전국 규모의 정치 세력으로 재편되어 기성 정당의 대안으로 주목받을 것입니다.\n\n일본유신회의 창당은 단순히 새로운 정당의 탄생을 의미하는 데 그치지 않고, 야당의 재편과 \\"제3 세력\\" 형성을 더욱 가속하는 사건이 될 것입니다."
 JAP_historical.20120928.a: "새로운 개혁 세력이 국정에 발을 들였다."
 JAP_historical.20141128.t: "당신의 당 해산"
 JAP_historical.20141128.d: "기존 거대 정당에 맞서는 \\"제3 세력\\"으로 존재감을 확립했던 당신의 당은 당 운영 방향과 선거 대응을 둘러싼 의견 차이가 점차 깊어지면서 내부 결속을 유지하기가 갈수록 어려워지고 있었습니다.\n\n결국 당은 해산을 결정했고, 소속 의원들은 각자 다른 길을 걷게 되었습니다. 개혁의 깃발 아래 모였던 세력의 흩어짐은 야당 재편의 유동적인 성격을 다시 한번 부각시키며, 향후 정치 지형에도 적지 않은 영향을 미칠 것으로 보입니다."
 JAP_historical.20141128.a: "제3 세력의 한 축이 막을 내린다."
 JAP_historical.20170925.t: "야당 재편: 희망의 당과 입헌민주당의 분열"
 JAP_historical.20170925.d: "비자민당 세력이 대규모 재편 국면에 접어들고 있습니다. 새로 부상한 희망의 당은 기존 정당에 대한 불만과 정치적 정체감을 배경으로 개혁 지향적인 새 정치 세력으로서 빠르게 주목받았습니다. 기존 비자민당 진영 일부에게는 합당과 협력이 세력을 재건할 기회로 보였으나, 동시에 정책 노선과 합당 조건을 둘러싼 갈등이 서서히 수면 위로 떠오르기 시작했습니다.\n구 민주당 계열 세력은 하나의 덩어리로 뭉치지 못했습니다. 일부는 희망의 당과 합류하거나 협력했고, 다른 이들은 입헌민주당을 결성해 독자 노선을 택했습니다. 재편은 진전되었지만 분열 또한 동시에 선명해졌고, 비자민당 세력의 구도는 극적으로 새로 짜였습니다."
 JAP_historical.20170925.a: "비자민당 진영이 희망의 당과 입헌민주당으로 갈라졌다."
 JAP_historical.20170925_TT: "§Y민주당은 입헌민주당으로 대체됩니다!§!"
 JAP_historical.20180507.t: "야당 재편: 국민민주당 결성"
 JAP_historical.20180507.d: "희망의 당과 입헌민주당의 분열로 재편된 야권은 추가적인 재편을 계속 겪고 있습니다. 구 민주당 진영의 일부와 희망의 당 진영의 일부는 이견을 안은 채로도 새로운 중도 세력으로 뭉치려 했고, 희망의 당은 독립된 틀로서의 비중을 점차 잃어 갔습니다.\n마침내 국민민주당이 결성되었습니다. 이는 입헌민주당과는 구별되는 중도 노선을 주창하는 새로운 정치 세력의 탄생이기도 했으며, 야권의 구도는 계속 바뀌어 갈 것입니다."
 JAP_historical.20180507.a: "재편은 계속되고, 야권의 모습은 계속 변한다."
 JAP_historical.20180507_TT: "§Y희망의 당은 국민민주당으로 대체됩니다!§!"
 JAP_historical.20190401.t: "레이와 신센구미 창당"
 JAP_historical.20190401.d: "기존 정당에 대한 불신과 생활 불안에 대한 불만이 들끓는 가운데, 야마모토 타로 등은 새로운 정치 세력의 출범에 나섰습니다. 대규모 조직에 의존하지 않는 풀뿌리 지지를 강조하고, 기성 정치 질서가 미처 포착하지 못하는 목소리를 국정에 전달할 것을 주창하는 이 운동은 가계 지원, 사회보장 확대, 소비세를 비롯한 부담 재검토 등 생활 중심의 호소를 전면에 내세우는 세력으로 자리매김할 수 있습니다.\n\n레이와 신센구미의 창당은 야권 내 선택지의 폭을 넓히는 동시에, 정치 재편의 유동성을 다시금 강조하는 사건이 되기도 합니다."
 JAP_historical.20190401.a: "새로운 풀뿌리 세력이 국정 진출을 선언한다."
 JAP_historical.20220710.t: "참정당의 부상"
 JAP_historical.20220710.d: "기존 정당에 대한 불신과 정치 참여에 대한 거리감을 둘러싼 논의가 커지는 가운데, 풀뿌리 활동과 정보 확산을 통해 지지를 넓혀 온 새로운 정치 세력인 참정당이 국가 정치 무대에서 존재감을 드러내기 시작했습니다. 지역 조직 구축과 독자적인 호소에 힘입어, 거대 정당이 충분히 흡수하지 못했던 계층의 정치적 대변체로서 점차 주목받고 있습니다.\n\n참정당은 기성 정당과의 거리를 강조하면서, 당원과 지지자의 참여와 홍보력을 중시하는 신생 정당으로 세력을 넓히고 있습니다. 교육, 식량, 사회 제도, 주권 의식 같은 쟁점을 전면에 내세우는 입장이 지지를 얻고 있으며, 동시에 기존의 정당 구도와 쟁점 구조를 뒤흔드는 요인이 될 수도 있습니다.\n\n이 새로운 세력의 성장은 기존 정당이 무시할 수 없는 변화이며, 향후 야당 및 보수 진영의 재편과 정치 의제 설정에도 영향을 미칠 수 있습니다."
 JAP_historical.20220710.a: "새로 부상한 세력이 정치권에서 존재감을 키우고 있다."
