 SAU_normalization_zionist_01: "Secret Contacts"
 SAU_normalization_zionist_01_desc: "Back-channel contacts with Israeli officials. Intelligence sharing on Iran. Quiet meetings in neutral capitals. The normalization process begins in shadow."
 SAU_normalization_zionist_02: "Abraham Accords Watch"
 SAU_normalization_zionist_02_desc: "The UAE and Bahrain normalize with Israel. Saudi Arabia watches. The kingdom will not be rushed - but it will not be left behind."
 SAU_normalization_zionist_03: "Conditional Normalization"
 SAU_normalization_zionist_03_desc: "Normalization is possible - but only with a Palestinian state. The kingdom holds the line on the Arab Peace Initiative."
 SAU_normalization_zionist_04: "Normalization Without Palestine"
 SAU_normalization_zionist_04_desc: "The kingdom normalizes without a Palestinian deal. Strategic necessity outweighs Arab solidarity. The Arab street is furious."
 SAU_normalization_zionist_05: "Full Normalization"
 SAU_normalization_zionist_05_desc: "Embassies open. Trade begins. Flights cross Israeli airspace. The kingdom and Israel normalize fully - the Middle East transforms."
 SAU_normalization_zionist_06: "Economic Normalization"
 SAU_normalization_zionist_06_desc: "Trade and investment flow before diplomatic recognition. Israeli tech, Saudi capital. The economic relationship precedes the political one."
 SAU_normalization_zionist_07: "Security Cooperation"
 SAU_normalization_zionist_07_desc: "Intelligence sharing on Iran. Cyber cooperation. Airspace coordination for strikes. The security relationship is deep, even if the public one is not."
 SAU_normalization_zionist_08: "Technology Partnership"
 SAU_normalization_zionist_08_desc: "Israeli cybersecurity, agricultural tech, and water technology flow to Saudi Arabia. The kingdom buys Israeli innovation."
 SAU_normalization_zionist_09: "Anti-Iran Alliance"
 SAU_normalization_zionist_09_desc: "Saudi Arabia and Israel share a common enemy: Iran. The anti-Iran alliance drives normalization. The enemy of my enemy is my friend."
 SAU_normalization_zionist_10: "US Pressure for Normalization"
 SAU_normalization_zionist_10_desc: "Washington pushes Riyadh to normalize. Security guarantees, nuclear cooperation, and F-35s are offered. The kingdom considers the price."
 SAU_normalization_zionist_11: "Palestinian Veto"
 SAU_normalization_zionist_11_desc: "The Palestinian Authority vetoes Saudi normalization. The kingdom respects the veto - or ignores it. The choice defines the relationship."
 SAU_normalization_zionist_12: "Normalization Backlash"
 SAU_normalization_zionist_12_desc: "The Arab street erupts. Protests, clerical condemnation, and Iranian propaganda exploit the normalization. The kingdom weathers the storm."
 SAU_normalization_zionist_13: "Normalization Dividend"
 SAU_normalization_zionist_13_desc: "The benefits of normalization flow: technology, investment, security cooperation, and US support. The kingdom's strategic position strengthens."
 SAU_normalization_zionist_14: "Quiet Diplomacy with Israel"
 SAU_normalization_zionist_14_desc: "Quiet diplomacy avoids public controversy. Meetings in neutral capitals, back-channel intelligence sharing, and gradual relationship building."
 SAU_normalization_zionist_15: "Normalization Framework"
 SAU_normalization_zionist_15_desc: "A framework for normalization is established: economic ties first, security cooperation second, diplomatic recognition last. The process is gradual."
 SAU_normalization_zionist_16: "Normalization Complete"
 SAU_normalization_zionist_16_desc: "The kingdom and Israel have normalized. Embassies, trade, and flights connect the two nations. The Middle East will never be the same."
 SAU_normalization_zionist_17: "Defense Cooperation with Israel"
 SAU_normalization_zionist_17_desc: "Joint military exercises, arms sales, and integrated air defense. The Saudi-Israeli defense partnership transforms the regional balance."
 SAU_normalization_zionist_18: "Economic Partnership with Israel"
 SAU_normalization_zionist_18_desc: "Trade reaches billions. Israeli tech companies open in Riyadh. Saudi capital invests in Tel Aviv startups. The economic relationship flourishes."
 SAU_normalization_zionist_19: "Tourism Between Kingdoms"
 SAU_normalization_zionist_19_desc: "Israeli tourists visit Mecca - no, not Mecca, but Jerusalem is open. Saudi tourists visit Tel Aviv. The people-to-people contact transforms perceptions."
 SAU_normalization_zionist_20: "Water Cooperation"
 SAU_normalization_zionist_20_desc: "Israeli desalination technology helps Saudi Arabia. Saudi energy helps Israel. The water-energy swap benefits both nations."
 SAU_normalization_zionist_21: "Cyber Alliance"
 SAU_normalization_zionist_21_desc: "Joint cyber defense against Iranian threats. Israeli cybersecurity firms operate in Saudi Arabia. The digital alliance is critical."
 SAU_normalization_zionist_22: "Regional Security Architecture"
 SAU_normalization_zionist_22_desc: "A new regional security architecture includes Saudi Arabia, Israel, the UAE, and the US. Iran faces a united front."
 SAU_normalization_zionist_23: "Normalization Legacy"
 SAU_normalization_zionist_23_desc: "Normalization with Israel redefines the Middle East. The Arab-Israeli conflict ends. A new era begins - with or without the Palestinians."
 SAU_normalization_zionist_24: "Jerusalem Compromise"
 SAU_normalization_zionist_24_desc: "The kingdom accepts a compromise on Jerusalem. Two states, shared city, normalized relations. The Arab Peace Initiative achieves its goal."
 SAU_normalization_zionist_25: "Palestinian State Facilitation"
 SAU_normalization_zionist_25_desc: "The kingdom facilitates Palestinian statehood as a prerequisite for full normalization. The two-state solution is revived."
 SAU_normalization_zionist_26: "Normalization Stabilizes Region"
 SAU_normalization_zionist_26_desc: "Normalization brings stability. The Middle East heats less. Iran is contained. The kingdom's strategic position is secured."
 SAU_Normaliztion_with_Zionist: "The Israel Question"
 SAU_Normaliztion_with_Zionist_desc: "Normalizing with Israel is the third rail of Saudi politics. The Palestinian cause is sacred to the Arab street. But strategic reality demands reconsideration. What will the kingdom do?"
 SAU_north_africa_policy_01: "Egypt Strategic Partnership"
 SAU_north_africa_policy_01_desc: "Egypt is Saudi Arabia's most important Arab partner after the Gulf. Military cooperation, aid, and investment bind Cairo to Riyadh."
 SAU_north_africa_policy_02: "Libya Stabilization"
 SAU_north_africa_policy_02_desc: "Saudi Arabia works to stabilize Libya. Aid to the government, support for reconstruction, and pressure on militias."
 SAU_north_africa_policy_03: "Tunisia Engagement"
 SAU_north_africa_policy_03_desc: "Tunisia's democracy receives Saudi attention. Aid, investment, and the hope of pulling Tunis away from the Qatari-Turkish orbit."
 SAU_north_africa_policy_04: "Morocco Alliance"
 SAU_north_africa_policy_04_desc: "Morocco and Saudi Arabia share conservative monarchy and anti-Islamist politics. The relationship deepens."
 SAU_north_africa_policy_05: "Algeria Outreach"
 SAU_north_africa_policy_05_desc: "Algeria's military government receives Saudi attention. Energy cooperation and diplomatic coordination expand."
 SAU_north_africa_policy_06: "North African Investment"
 SAU_north_africa_policy_06_desc: "Saudi capital flows to North Africa. Real estate, banking, and telecommunications investments build economic influence."
 SAU_north_africa_policy_07: "Maghreb Diplomacy"
 SAU_north_africa_policy_07_desc: "The Maghreb - Morocco, Algeria, Tunisia, Libya, Mauritania - receives coordinated Saudi diplomacy. The kingdom's influence extends across the Arab West."
 SAU_north_africa_policy_08: "Nilotic Policy"
 SAU_north_africa_policy_08_desc: "Egypt, Sudan, and the Nile states are central to Saudi strategy. Water security, Red Sea access, and Arab solidarity guide policy."
 SAU_north_africa_policy_09: "Sahel Engagement"
 SAU_north_africa_policy_09_desc: "The Sahel - Chad, Niger, Mali - receives Saudi aid. Islamic diplomacy, counter-terrorism cooperation, and migration management."
 SAU_north_africa_policy_10: "Horn of Africa Policy"
 SAU_north_africa_policy_10_desc: "The Horn of Africa - Somalia, Djibouti, Eritrea, Ethiopia - borders the Red Sea. Saudi Arabia projects power across the water."
 SAU_north_africa_policy_11: "Somalia Support"
 SAU_north_africa_policy_11_desc: "Saudi aid to Somalia builds influence. The port of Berbera, Mogadishu reconstruction, and Islamic diplomacy connect Riyadh to Mogadishu."
 SAU_north_africa_policy_12: "Sudan Red Sea Deal"
 SAU_north_africa_policy_12_desc: "The Suakin Island deal gives Saudi Arabia a foothold on the Red Sea. In exchange, billions flow to Khartoum."
 SAU_north_africa_policy_13: "Eritrea Base"
 SAU_north_africa_policy_13_desc: "Saudi Arabia establishes a military base in Eritrea. The Red Sea becomes a Saudi lake."
 SAU_north_africa_policy_14: "Djibouti Presence"
 SAU_north_africa_policy_14_desc: "The kingdom joins the scramble for Djibouti. A logistics base on the Bab el-Mandeb secures the southern Red Sea."
 SAU_north_africa_policy_15: "Red Sea Dominance"
 SAU_north_africa_policy_15_desc: "From Jeddah to Berbera, from Suakin to Djibouti, Saudi power projects across the Red Sea. The kingdom controls both coasts."
 SAU_Open_pipeline_into_ArabiaSea: "A Pipeline to the Arabian Sea"
 SAU_Open_pipeline_into_ArabiaSea_desc: "A pacified Yemen offers what the Kingdom has always wanted: an export route to the Arabian Sea that bypasses the Strait of Hormuz entirely. Build the pipeline that frees Saudi oil from Iran's chokepoint."
 SAU_pal_recognition_drive: "Recognition Drive: [FROM.GetFlag][FROM.GetName]"
 SAU_pal_recognition_drive_desc: "Lean on [FROM.GetName] with every tool of Saudi diplomacy: recognize the State of Palestine."
 SAU_pal_sponsor_peace: "Sponsor the Peace Process"
 SAU_pal_sponsor_peace_desc: "Position the Kingdom as the indispensable broker between the parties. Saudi diplomacy, not the gun, will define the settlement."
 SAU_pipeline_transit_IRQ: "Saudi Pipeline Transit"
 SAU_pipeline_transit_IRQ_desc: "Iraq becomes the bridge between the Gulf and the West, collecting transit fees and reviving its own oil sector. Additional Income and increased oil output."
 SAU_pipeline_transit_JOR: "Saudi Pipeline Transit"
 SAU_pipeline_transit_JOR_desc: "Saudi oil crosses the Hashemite Kingdom on its way to the Mediterranean. The transit fees fund a building boom across Jordan. Additional Income and faster construction."
 SAU_pipeline_transit_SYR: "Saudi Pipeline Transit"
 SAU_pipeline_transit_SYR_desc: "The pipeline brings Damascus its cut of every barrel and the capital to rebuild a shattered nation. Additional Income, faster construction, and improved stability."
 SAU_pipeline_transit_TUR: "Saudi Pipeline Transit"
 SAU_pipeline_transit_TUR_desc: "Turkey is the gatekeeper of Gulf oil to Europe, and it taxes every barrel that passes. The trade revives Anatolian industry. Additional Income and increased steel and chromium output."
 SAU_pipeline_transit_YEM: "Saudi Pipeline Transit"
 SAU_pipeline_transit_YEM_desc: "Saudi crude crosses Yemen to the sea, and the transit fees flow into Aden's coffers. The new infrastructure also opens up the nation's own oil fields. Additional Income and increased oil output."
