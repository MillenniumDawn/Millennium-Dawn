 SAU_events.354.t: "Demande saoudienne d'un navire de guerre allemand"
 SAU_events.360.a: "§HÉtablir un fonds souverain.§! Mettre l'aubaine en banque et l'investir pour l'avenir."
 SAU_events.360.b: "§HFinancer de grands mégaprojets.§! Verser l'argent dans des usines et des villes au pays."
 SAU_events.360.c: "§HLe distribuer au peuple.§! Subventions et primes achètent loyauté et calme."
 SAU_events.360.d: "Le brut grimpe de 25 $ à plus de §G140 $ le baril§!. Les pétrodollars inondent le trésor plus vite que le Royaume ne peut les compter. L'§Yaubaine 2003-2008§! est une chance d'une génération — et la façon dont elle sera dépensée façonnera le Royaume pour des décennies. Le Conseil débat : §Ll'épargner, bâtir avec, ou la partager§! ?"
 SAU_events.360.t: "§HLe boom pétrolier§!"
 SAU_events.361.a: "§RUn coup scandaleux !§!"
 SAU_events.361.b: "Trouver de nouveaux fournisseurs et tenir."
 SAU_events.361.d: "Riyad a rejoint un embargo pétrolier arabe contre nous. Les tankers restent oisifs dans le Golfe, nos raffineries se vident, et les prix à la pompe s'emballent. Les usines chôment et les automobilistes font la queue des heures.\n\nLes Saoudiens disent que les robinets resteront fermés jusqu'à ce que notre politique envers la région change. Notre économie sentira l'étau tant que l'embargo tiendra."
 SAU_events.361.t: "§RL'Arabie saoudite nous coupe le pétrole§!"
 SAU_events.362.a: "§GLe pétrole est notre épée.§!"
 SAU_events.362.b: "§RNous traverserons cette tempête.§!"
 SAU_events.362.c: "Une escalade dangereuse."
 SAU_events.362.d: "En écho de §H1973§!, le Royaume d'Arabie saoudite a proclamé un embargo sur les livraisons de pétrole à l'Occident et aux amis d'Israël. Les §LÉtats-Unis, la Grande-Bretagne, la France, l'Allemagne et les Pays-Bas§! font désormais face à des pénuries de carburant, au rationnement et à des prix en flèche.\n\nÀ travers le monde arabe et musulman, les foules saluent le défi de Riyad. Dans les capitales occidentales, les gouvernements se précipitent vers d'autres fournisseurs et avertissent de la récession. Le pétrole, naguère simple marchandise, est devenu une arme d'État."
 SAU_events.362.t: "§HL'Arabie saoudite brandit l'arme pétrolière§!"
 SAU_events.363.a: "§YLe baril appelle toujours.§! (§RDépendance au pétrole +2§!)"
 SAU_events.363.d: "Même tandis que le Royaume se diversifie, la gravité du brut ne lâche jamais. Chaque ministère, chaque ligne budgétaire, chaque pétrodollar facile ramène l'économie vers le baril. Intérêts établis, énergie bon marché et chemin de moindre résistance tirent tous dans une direction.\n\nSans effort constant, le Royaume glisse à nouveau vers la dépendance au pétrole."
 SAU_events.363.t: "§RL'attrait du pétrole§!"
 SAU_events.370.a: "§GEmbrasser la réforme de marché.§! Laisser le secteur privé mener."
 SAU_events.370.b: "§RProtéger l'ordre établi.§! Le changement peut attendre."
 SAU_events.370.d: "Des technocrates au ministère de l'Économie pressent pour la §Ldéréglementation, la privatisation et les marchés ouverts§!. La vieille garde avertit que trop vite défera le contrat social sur lequel le Royaume est bâti. Le Conseil doit indiquer une direction."
 SAU_events.370.t: "§HChangement économique§!"
 SAU_events.371.a: "§GÉlargir les débouchés pour les femmes.§! L'économie a besoin de tous les talents."
 SAU_events.371.b: "§RMaintenir les rôles traditionnels.§! Préserver la structure familiale."
 SAU_events.371.d: "Une nouvelle génération de Saoudiennes instruites veut travailler, et l'économie a besoin d'elles. Les réformateurs voient un talent inexploité ; les §Loulémas§! et les familles conservatrices voient une ligne qu'il ne faut pas franchir."
 SAU_events.371.t: "§HLes femmes dans la population active§!"
 SAU_events.372.a: "§GAutoriser l'accès ouvert.§! Le Royaume ne peut se cacher du monde."
 SAU_events.372.b: "§RFiltrer et censurer.§! Garder les mœurs publiques."
 SAU_events.372.d: "La télévision par satellite et le début d'internet versent des idées étrangères dans les salons saoudiens. Les libéraux saluent l'ouverture au monde ; les traditionalistes exigent que l'État filtre ce qui atteint les fidèles."
 SAU_events.372.t: "§HParaboles et internet§!"
 SAU_events.373.a: "§GLimiter leur autorité.§! Reprendre les patrouilles."
 SAU_events.373.b: "§RRéaffirmer leur mandat.§! La vertu doit être imposée."
 SAU_events.373.d: "Le §LComité pour la promotion de la vertu§! patrouille les rues en imposant la tenue, la prière et la mixité des sexes. Citadins et entreprises s'irritent de leur pouvoir ; le clergé les tient pour gardiens de l'âme de la nation."
 SAU_events.373.t: "§HLa police religieuse§!"
 SAU_events.380.a: "Autoriser les comptes conventionnels portant intérêt."
 SAU_events.380.b: "Interdiction stricte du riba - la charia est suprême."
 SAU_events.380.c: "Sukuk en public, intérêt pragmatique en privé."
 SAU_events.380.d: "Le Royaume doit prendre position sur le §Lriba§! — l'interdiction de l'intérêt. Les §Lréformateurs laïcs§! arguent que les comptes à intérêt conventionnel attirent le capital étranger et modernisent la banque. Le §LConseil des grands oulémas§! exige une interdiction stricte conforme à la charia. Un §Hhybride§! permet les sukuk pour le public, l'intérêt informel derrière des portes closes."
 SAU_events.380.t: "§HLa loi standardisée sur l'intérêt§!"
 SAU_events.381.a: "Réserves fractionnaires modernes — la croissance au prix de la stabilité."
 SAU_events.381.b: "Uniquement adossé à des actifs - stable mais plus lent."
 SAU_events.381.c: "Exigences de réserves modérées."
 SAU_events.381.d: "Combien de crédit les banques peuvent-elles créer à partir de chaque riyal de dépôts ? Le §Lmodèle occidental§! use de la §Hbanque à réserves fractionnaires§! — levier 10:1, plus de crédit, plus de croissance, plus de risque. L'§Lalternative islamique§! exige une §Hcouverture intégrale d'actifs§! — chaque prêt lié à une richesse réelle, plus lent mais stable. L'§Hhybride§! fixe des exigences de réserve modérées."
 SAU_events.381.t: "§HMandats de réserve fractionnaire§!"
 SAU_events.382.a: "Régulation légère — autoriser dérivés et contrats à terme."
 SAU_events.382.b: "Interdiction stricte - pas de gharar, pas de jeux d'argent."
 SAU_events.382.c: "Dérivés réglementés uniquement - approche équilibrée."
 SAU_events.382.d: "Jusqu'où le Royaume doit-il réglementer la §Lspéculation, les dérivés et les contrats à terme§! ? La §Lvue occidentale§! y voit des outils vitaux de gestion du risque. La §Lvue islamique§! les condamne comme §Lgharar§! (incertitude excessive) — à peine mieux que le jeu. Un §Hhybride§! n'autorise que des dérivés réglementés."
 SAU_events.382.t: "§HLes directives anti-spéculation§!"
 SAU_events.383.a: "Marché interbancaire conventionnel basé sur l'intérêt."
 SAU_events.383.b: "Marché interbancaire islamique basé sur la Murabaha."
 SAU_events.383.c: "Hybride : les deux fonctionnent séparément."
 SAU_events.383.d: "Quand les banques se prêtent entre elles, à quelles conditions ? Le §Lmodèle occidental§! use de §Hcorridors de taux d'intérêt conventionnels§! (style LIBOR). L'§Lalternative islamique§! achemine les flux interbancaires par la §Hmurabaha§! — financement à coût majoré adossé à des actifs. Un §Hhybride§! permet les deux, par secteur."
 SAU_events.383.t: "§HLe code du crédit interbancaire§!"
 SAU_events.384.a: "SAMA - régulateur laïc indépendant."
 SAU_events.384.b: "SAMA + conseil de charia à veto contraignant."
 SAU_events.384.c: "Hybride - deux structures parallèles."
 SAU_events.384.d: "Qui surveille les banques du Royaume ? Le §Lmodèle occidental§! fait de la §LSAMA§! (Agence monétaire saoudienne) un §Hrégulateur technocratique indépendant§!. L'§Lalternative islamique§! apparie la SAMA à un §Hconseil de tutelle de la charia§! — clergé à veto contraignant. Un §Hhybride§! est deux structures parallèles."
 SAU_events.384.t: "§HLa loi de contrôle bancaire§!"
 SAU_events.385.a: "Orthodoxie stricte - aucun compromis."
 SAU_events.385.b: "Pragmatique — mener le marché mondial de la finance islamique."
 SAU_events.385.d: "Le Royaume s'engage pleinement dans la §Hfinance islamique§!. Mais jusqu'où ? L'§Lorthodoxie stricte§! — aucun compromis, chaque transaction bénie par la charia — gagne le soutien inconditionnel des §Loulémas§! et la stabilité pour des générations. L'§Lislamique pragmatique§! — plaque tournante mondiale de la finance islamique, attirant le capital musulman de §LMalaisie§!, d'§LIndonésie§!, d'§LIran§!, du §LGolfe§! — sacrifie un degré de pureté pour l'influence."
 SAU_events.385.t: "§HBastion de la finance islamique§!"
 SAU_events.386.a: "Plein anglo-saxon - tous les instruments autorisés."
 SAU_events.386.b: "Graduel — pratique occidentale avec vernis de charia."
 SAU_events.386.d: "Le Royaume rompt avec la tradition et §Hsécularise§! son secteur financier. La voie §Lpleinement anglo-saxonne§! adopte chaque instrument occidental — §Hdérivés§!, §Hobligations§!, §Htrading sur marge§! — attire un maximum de capital étranger mais exaspère les §Loulémas§!. La voie §Lgraduelle§! garde un vernis de charia sur la pratique occidentale — moins de recettes, moins de contrecoup."
 SAU_events.386.t: "§GLa sécularisation de la finance§!"
 SAU_events.39.a: "La tempête a éclaté."
 SAU_events.39.d: "Des avions de combat saoudiens et de coalition ont frappé des cibles à travers le Yémen tenu par les Houthis dans une vaste campagne aérienne. Riyad a déclaré son intention de rétablir le gouvernement reconnu et de reculer le mouvement soutenu par l'Iran. Le Moyen-Orient retient son souffle."
 SAU_events.39.t: "Début de l’opération Tempête décisive"
 SAU_events.390.a: "Approuver la vente à Riyad"
 SAU_events.390.b: "Décliner la demande"
 SAU_events.390.d: "Le Royaume d'Arabie saoudite a formellement demandé d'acheter le F-15 Strike Eagle — notre meilleur chasseur d'export. Riyad est un allié clé du Golfe et un client d'armement majeur. Approuverons-nous la vente ?"
 SAU_events.390.t: "Demande saoudite : le F-15 Strike Eagle"
 SAU_events.391.a: "Excellente nouvelle."
 SAU_events.391.d: "Les États-Unis ont accepté de vendre le F-15 Strike Eagle au Royaume. L'affaire est conclue — la Force aérienne royale saoudienne volera bientôt les meilleurs jets américains."
 SAU_events.391.t: "Washington approuve l'accord F-15"
 SAU_events.392.a: "Un revers."
 SAU_events.392.d: "Les États-Unis ont refusé de vendre le F-15 pour l'heure. Nous pourrons renouveler notre demande plus tard."
 SAU_events.392.t: "Washington refuse"
 SAU_events.393.a: "Approuver l'export"
 SAU_events.393.b: "Décliner la demande"
 SAU_events.393.d: "L'Arabie saoudite a demandé l'Eurofighter Typhoon au titre du programme Al Salam. En tant que partenaire du consortium, l'Allemagne approuvera-t-elle l'export vers Riyad ?"
 SAU_events.393.t: "Demande saoudite : l'Eurofighter Typhoon"
 SAU_events.394.a: "Excellente nouvelle."
 SAU_events.394.d: "Le consortium a accepté d'exporter l'Eurofighter Typhoon vers le Royaume. Le programme Al Salam peut désormais avancer."
 SAU_events.394.t: "L'accord Typhoon est approuvé"
 SAU_events.395.a: "Un revers."
 SAU_events.395.d: "Les Européens ont refusé d'exporter le Typhoon pour l'heure. Nous pourrons réessayer plus tard."
 SAU_events.395.t: "L'accord Typhoon est refusé"
 SAU_events.396.a: "Approuver la vente à Riyad"
 SAU_events.396.b: "Décliner la demande"
 SAU_events.396.d: "Le Royaume d'Arabie saoudite souhaite étendre le programme Al Yamamah et acheter le Tornado GR4 modernisé. Riyad est un client loyal de l'industrie britannique depuis des décennies. Approuverons-nous la vente ?"
 SAU_events.396.t: "Demande saoudite : le Tornado GR4"
 SAU_events.397.a: "Excellente nouvelle."
 SAU_events.397.d: "Le Royaume-Uni a accepté de fournir le Tornado GR4 au Royaume au titre d'un accord Al Yamamah étendu. Nos escadrons d'attaque feront l'envie du Golfe."
 SAU_events.397.t: "Londres approuve l'accord Tornado"
 SAU_events.398.a: "Un revers."
 SAU_events.398.d: "Le Royaume-Uni a refusé d'étendre l'accord Tornado pour l'heure. Nous pourrons renouveler notre demande plus tard."
 SAU_events.398.t: "Londres décline"
 SAU_events.399.a: "Approuver l'export"
 SAU_events.399.b: "Décliner la demande"
 SAU_events.399.d: "L'Arabie saoudite a demandé le Panavia Tornado IDS, l'avion d'attaque multinational robuste. En tant que partenaire du consortium, l'Italie approuvera-t-elle l'export vers Riyad ?"
 SAU_events.399.t: "Demande saoudite : le Panavia Tornado"
 SAU_events.4.a: "Excellente nouvelle."
 SAU_events.4.d: "[FROM.GetNameDefCap] a accepté notre offre. L'accord peut maintenant avancer."
 SAU_events.4.t: "[FROM.GetNameDefCap] accepte l'offre"
 SAU_events.40.a: "Endiguement : isoler et étrangler le régime."
 SAU_events.40.b: "Détente prudente : baisser la température, pour l'heure."
 SAU_events.40.c: "Pied de guerre : nous frapperons avant qu'il ne le fasse."
 SAU_events.40.d: "Saddam gouverne encore à Bagdad, et le souvenir du Koweït et de Khafji pèse sur le Golfe. Le Royaume doit arrêter comment il traitera ce voisin dangereux, avant qu'il ne décide de rejouer."
 SAU_events.40.t: "L'ombre de Saddam"
 SAU_events.400.a: "Excellente nouvelle."
 SAU_events.400.d: "L'Italie a accepté d'exporter le Panavia Tornado IDS vers le Royaume. Le consortium accueille un nouvel opérateur de valeur."
 SAU_events.400.t: "Rome approuve l'accord Tornado"
 SAU_events.401.a: "Un revers."
 SAU_events.401.d: "L'Italie a refusé d'exporter le Tornado pour l'heure. Nous pourrons réessayer plus tard."
 SAU_events.401.t: "Rome décline"
 SAU_events.5.a: "Un revers."
 SAU_events.5.d: "[FROM.GetNameDefCap] a rejeté notre offre. Les relations entre nos pays en souffriront."
 SAU_events.5.t: "[FROM.GetNameDefCap] rejette l'offre"
 SAU_events.56.a: "Accueillir les pourparlers à Pékin."
 SAU_events.56.b: "Ce n'est pas notre querelle."
 SAU_events.56.d: "L'Arabie saoudite nous demande de médier entre Riyad et Téhéran. Les deux rives du Golfe nous vendent du pétrole, et leur querelle menace chaque tanker dont nous dépendons. Accueillir les pourparlers couronnerait Pékin comme puissance indispensable de la région."
 SAU_events.56.t: "Une demande de Riyad"
 SAU_events.57.a: "Signer l'accord."
 SAU_events.57.b: "Nous ne siégerons pas avec eux."
 SAU_events.57.d: "La Chine nous invite à Pékin pour signer un accord avec l'Arabie saoudite : relations rétablies, ambassades rouvertes, et fin de la saignée par procuration. Les Saoudiens ont déjà accepté. La plume nous attend."
 SAU_events.57.t: "Une invitation à Pékin"
 SAU_events.58.a: "Un nouveau chapitre."
 SAU_events.58.d: "Sous les auspices chinois, le Royaume et la République islamique ont signé. Les ambassades rouvriront, les proxies se tairont, et le Golfe expire. La rivalité n'est pas finie, mais les couteaux sont rengainés."
 SAU_events.58.t: "L'accord de Pékin"
 SAU_events.59.a: "So be it."
 SAU_events.59.d: "Les pourparlers se sont effondrés avant d'avoir commencé. La rivalité continue, et le Golfe reste dangereux."
 SAU_events.59.t: "La médiation échoue"
 SAU_events.6.a: "Rejoindre le corridor."
 SAU_events.6.b: "Décliner la proposition."
 SAU_events.6.d: "L'Arabie saoudite propose le corridor économique Inde-Moyen-Orient-Europe, une route commerciale reliant l'Inde à l'Europe par le Golfe en contournant le canal de Suez."
 SAU_events.6.t: "[SAU.GetFlag] Le corridor Inde-Moyen-Orient-Europe [RAJ.GetFlag]"
 SAU_events.60.a: "L'armée marche contre le Hezbollah."
 SAU_events.60.b: "Le Liban ne saignera pas pour Riyad."
 SAU_events.60.d: "L'argent saoudien a reconstruit notre armée ; les fusils saoudiens remplissent ses arsenaux. Riyad en demande maintenant le prix : marcher contre le Hezbollah et briser son État dans l'État. L'armée n'a jamais été plus prête. Si le Liban survit à la tentative est une autre question."
 SAU_events.60.t: "Un mandat de Riyad"
 SAU_events.61.a: "L'ordre revient au sud."
 SAU_events.61.d: "Des colonnes de l'armée libanaise roulent vers le sud tandis que Beyrouth s'emploie à rétablir l'autorité de l'État sur le Liban-Sud. Après des décennies à vivre à côté d'un État dans l'État, le gouvernement a ordonné à son armée reconstruite de désarmer le Hezbollah par la force. Les capitales du Golfe applaudissent ; Téhéran y voit une trahison de la résistance."
 SAU_events.61.t: "L'armée libanaise agit contre le Hezbollah"
 SAU_events.63.a: "Les preuves parlent."
 SAU_events.63.d: "L'Arabie saoudite a déposé devant la Ligue arabe un dossier de fragments de missiles, de manifestes de navires et de communications interceptées liant l'arsenal houthi à l'Iran. Les capitales arabes répondent avec une unité inhabituelle, et les dénégations de Téhéran trouvent peu d'écoute."
 SAU_events.63.t: "Un dossier révèle la main de l'Iran au Yémen"
 SAU_events.64.a: "Les rues s'agitent."
 SAU_events.64.d: "De Téhéran à Beyrouth, les foules sont dans les rues contre les gouvernements de l'Axe de la résistance. Les griefs des protestataires sont locaux, mais leur financement, notent les observateurs, a un accent distinctement du Golfe. L'Axe blâme des mains étrangères ; les mains étrangères nient tout."
 SAU_events.64.t: "Des protestations balayent l'Axe de la résistance"
 SAU_events.65.a: "L'Oumma n'a qu'une adresse."
 SAU_events.65.d: "Le monde islamique s'est rassemblé dans sa ville la plus sainte sur invitation saoudienne, la délégation iranienne siégeant parmi les autres. Quoi que l'on décide à huis clos, l'image est sans équivoque : quand l'Oumma s'assemble, elle s'assemble à La Mecque, et Riyad siège en tête de table."
 SAU_events.65.t: "Le sommet de La Mecque"
 SAU_events.67.a: "Une poignée de main à Pékin."
 SAU_events.67.d: "Dans une cérémonie que peu croyaient possible, l'Arabie saoudite et l'Iran ont signé à Pékin un accord rétablissant les relations diplomatiques après des années de rivalité. Les ambassades rouvriront et les guerres par procuration doivent se taire. La Chine a négocié l'accord, et le message à Washington est sans équivoque : il y a un nouveau médiateur au Moyen-Orient."
 SAU_events.67.t: "L'accord de Pékin"
 SAU_events.68.a: "Écoutez-les."
 SAU_events.68.b: "Rien à discuter."
 SAU_events.68.d: "Par des intermédiaires dans une troisième capitale, l'Arabie saoudite demande si Israël envisagerait des pourparlers de normalisation. Nulle condition n'a encore été nommée. La question est d'écouter ou non."
 SAU_events.68.t: "Une approche discrète de Riyad"
 SAU_events.69.a: "Progrès."
 SAU_events.69.d: "La réponse d'Israël est revenue plus chaude qu'attendu. La piste tient, et les pourparlers avancent au compte-gouttes."
 SAU_events.69.t: "Signaux positifs de Tel-Aviv"
 SAU_events.7.a: "Accepter le partenariat."
 SAU_events.7.b: "Décliner l'offre."
 SAU_events.7.d: "Riyad propose un partenariat d'investissement stratégique centré sur Saudi Telecom Company et les infrastructures sud-coréennes. Les deux pays gagneraient l'accès au marché de l'autre."
 SAU_events.7.t: "[SAU.GetFlag] Partenariat saoudo-coréen [KOR.GetFlag]"
 SAU_events.70.a: "Décevant."
 SAU_events.70.d: "La réponse d'Israël est revenue sèche et froide. La piste a calé, et les pourparlers s'éteignent avec elle."
 SAU_events.70.t: "Une réponse froide"
 SAU_events.71.a: "Accepter les lignes de 1967. Un État pour une paix."
 SAU_events.71.b: "Les lignes de 1967 sont impossibles."
 SAU_events.71.d: "L'Arabie saoudite a formellement offert l'Initiative de paix arabe : reconnaissance, ambassades, commerce et paix avec tout le monde arabe, en échange d'un État palestinien indépendant sur les lignes de 1967. C'est le plus grand prix jamais offert, au prix qu'Israël refuse depuis des décennies."
 SAU_events.71.t: "L'Initiative de paix arabe"
 SAU_events.72.a: "Prendre l'accord."
 SAU_events.72.b: "L'argent n'est pas la question."
 SAU_events.72.d: "Les négociateurs saoudiens sucrent la table : fonds d'investissement, ciels ouverts, corridors technologiques, et accès au plus grand marché du Golfe. La paix avec Riyad paierait comme nulle paix avant elle."
 SAU_events.72.t: "La richesse du Golfe"
 SAU_events.73.a: "La paix pour un État. L'histoire."
 SAU_events.73.d: "L'Arabie saoudite et Israël ont signé les accords de Riyad : normalisation pleine des relations en échange de l'acceptation israélienne d'un État palestinien indépendant sur les lignes de 1967, garanti par l'Arabie saoudite et la Jordanie. L'Initiative de paix arabe, écartée une génération, a redessiné la carte du Moyen-Orient en un après-midi."
 SAU_events.73.t: "Les accords de Riyad"
 SAU_events.74.a: "Les anciennes lignes reviennent."
 SAU_events.74.d: "Les pourparlers entre Riyad et Tel-Aviv se sont achevés sans accord. Israël n'accepterait pas un État palestinien ; l'Arabie saoudite ne relâcherait pas l'exigence. La plus audacieuse ouverture diplomatique d'une génération se clôt sur une porte qui claque."
 SAU_events.74.t: "Les négociations saoudo-israéliennes échouent"
 SAU_events.75.a: "Le pari du siècle."
 SAU_events.75.d: "Sans conditions, sans État palestinien et sans avertissement, l'Arabie saoudite a reconnu Israël et ouvert des relations pleines. Washington célèbre, Tel-Aviv exulte, et la rue arabe brûle. Le Gardien des deux saintes mosquées a fait le pari du siècle."
 SAU_events.75.t: "L’Arabie Saoudite reconnaît Israël"
 SAU_events.76.a: "Le moment est passé."
 SAU_events.76.d: "Les pourparlers avec Israël ont manqué de temps. Trop de questions sont restées ouvertes trop longtemps, et le moment est passé. Les délégations plient en silence, et les anciennes lignes reviennent sur la carte."
 SAU_events.76.t: "La fenêtre se ferme"
 SAU_events.77.a: "Préparer les accords."
 SAU_events.77.d: "Israël a accepté assez de nos termes pour rendre l'accord réel. Il reste la signature, et les livres d'histoire."
 SAU_events.77.t: "Percée dans les pourparlers"
 SAU_events.79.a: "Ouvrir les pourparlers."
 SAU_events.79.b: "Rien à discuter."
 SAU_events.79.d: "Par Washington et Amman vient le mot que l'Arabie saoudite est prête à discuter la normalisation, ouvertement et au plus haut niveau. Le prix sera élevé et le monde entier regardera les pourparlers. Mais nulle main arabe de cette taille n'a jamais été tendue."
 SAU_events.79.t: "Une ouverture de Riyad"
 SAU_events.8.a: "Signer le pacte de défense."
 SAU_events.8.b: "Décliner le pacte."
 SAU_events.8.d: "L'Arabie saoudite propose un pacte de défense mutuelle avec le Pakistan alors que les tensions montent au Moyen-Orient. L'accord inclurait garanties et accès militaire pour les deux pays."
 SAU_events.8.t: "[SAU.GetFlag] Le pacte de défense saoudo-pakistanais [PAK.GetFlag]"
 SAU_events.80.a: "L'impensable, programmé."
 SAU_events.80.d: "Riyad et Tel-Aviv l'ont confirmé : des pourparlers formels de normalisation des relations ont commencé. Les délégations sont déjà en l'air. Chaque chancellerie de la terre redessine ses hypothèses sur le Moyen-Orient, et chaque ennemi de l'accord lance son propre compte à rebours."
 SAU_events.80.t: "Début des pourparlers saoudo-israéliens"
 SAU_events.81.a: "Leur refus est leur réponse."
 SAU_events.81.d: "Tel-Aviv a refusé même d'ouvrir des négociations. L'ouverture est morte à l'arrivée, et la main du Royaume, tendue devant le monde entier, reste en l'air. Il n'y aura pas d'accord dans cette génération."
 SAU_events.81.t: "Israël refuse les pourparlers"
 SAU_events.82.a: "Un avenir bâti de béton et de verre."
 SAU_events.82.d: "L'échéance arrive, et contre toutes les prédictions le Royaume a livré. NEOM brille sur la mer Rouge, Riyad a été refaite, et les touristes arrivent là où ne se tenaient que des derricks. L'Arabie saoudite s'est acheté un avenir qui ne court plus au brut."
 SAU_events.82.t: "Vision 2030 réalisée"
 SAU_events.83.a: "Les promesses sont échues."
 SAU_events.83.d: "L'année est 2030, et la Vision est surtout non bâtie. Des tours à moitié finies rouillent dans le désert, les villes promises se tiennent vides, et les centaines de milliards dépensés n'ont guère à montrer. Les critiques qui l'appelaient un fantasme font leur tour d'honneur, et le peuple écoute."
 SAU_events.83.t: "Les éléphants blancs"
 SAU_events.84.a: "Écrivez-le."
 SAU_events.84.d: "Encore un projet phare de la Vision a dépassé son échéance inachevé. Les entrepreneurs sont payés, les grues descendent, et la presse a son titre. Le capital fuit, et les doutes s'étendent un peu plus loin."
 SAU_events.84.t: "Un projet rate son échéance"
 SAU_events.88.a: "La succession est déjà en question"
 SAU_events.88.d: "Le roi Fahd ben Abdelaziz Al-Saoud est mort. Abattu par un accident vasculaire il y a une décennie, il régna de nom tandis que son demi-frère Abdallah gouvernait comme régent, et Abdallah monte désormais sur le trône en son propre droit. Pourtant Abdallah a lui-même passé quatre-vingts ans, et à travers le majlis de la maison des Saoud les princes pèsent déjà qui le suivra.\n\n§YLa course pour succéder au roi Abdallah commence maintenant. Voir les décisions de prince héritier.§!"
 SAU_events.88.t: "La mort du roi Fahd"
 SAU_events.89.a: "La couronne passe"
 SAU_events.89.d: "Le roi Abdallah ben Abdelaziz Al-Saoud est mort. Pendant une décennie les princes de la maison des Saoud pesèrent et marchandèrent qui devait le suivre. Cette question ne peut plus attendre, et le prince qui commande la plus grande part d'influence sera proclamé roi.\n\n§YSalmane ben Abdelaziz :§! [?SAU_salman_share|0] %\n§YMohammed ben Nayef :§! [?SAU_mbn_share|0] %\n§YMoutaïb ben Abdallah :§! [?SAU_mutaib_share|0] %"
 SAU_events.89.t: "La mort du roi Abdallah"
 SAU_events.9.a: "Accepter le partenariat."
 SAU_events.9.b: "Décliner l'offre."
 SAU_events.9.d: "L'Arabie saoudite propose un partenariat d'investissement stratégique avec la Chine. L'accord étendrait les projets d'infrastructure chinois et renforcerait la position de Pékin dans le Golfe."
 SAU_events.9.t: "[SAU.GetFlag] Partenariat stratégique saoudo-chinois [CHI.GetFlag]"
 SAU_events.90.a: "Se tenir avec la Couronne"
 SAU_events.90.b: "Abolir le Royaume"
 SAU_events.90.d: "La fièvre qui balaie le monde arabe a franchi le Royaume. Les foules remplissent les rues de la Province orientale et des villes du Hedjaz, exigeant la fin du règne absolu. Les mutaween hésitent, la Garde nationale attend ses ordres, et la maison des Saoud doit décider si elle répond au peuple par la force ou laisse tomber l'ancien ordre."
 SAU_events.90.t: "Le Printemps arabe atteint le Royaume"
 SAU_events.91.a: "Ferme-le maintenant"
 SAU_events.91.b: "Conservez-le comme levier"
 SAU_events.91.b.tt: "La décision §YBlocus du détroit§! reste disponible pour fermer le détroit au moment de votre choix."
 SAU_events.91.d: "La guerre a atteint le Golfe. Nos batteries de missiles et nos vedettes d'attaque se tiennent prêtes le long du détroit d'Ormuz, l'artère par laquelle un cinquième du pétrole mondial doit passer. Nous pouvons l'étrangler maintenant et mettre l'économie mondiale à genoux, ou tenir la menace au-dessus de nos ennemis et le fermer au moment de notre choix."
 SAU_events.91.t: "Fermer le détroit d'Ormuz ?"
 SAU_events.92.a: "Proclamer la République islamique"
 SAU_events.92.b: "Garder la République d'Arabie"
 SAU_events.92.d: "Le mouvement chiite étant ascendant, l'assemblée constituante doit arrêter quel genre d'État sera la république : une République islamique fondée sur l'autorité religieuse, ou la République d'Arabie laïque."
 SAU_events.92.t: "Le caractère de la République"
 SAU_events.93.a: "Rejoindre l'Axe iranien de la résistance"
 SAU_events.93.b: "Forger un front anti-impérialiste indépendant"
 SAU_events.93.d: "Téhéran tend la main à la nouvelle république chiite. Les durs doivent choisir : prendre place dans l'Axe iranien de la résistance sous la tutelle du Guide suprême, ou forger un front indépendant qui ne répond à aucune capitale étrangère."
 SAU_events.93.t: "L'Axe de la résistance"
 SAU_events.94.a: "Rejoindre le front"
 SAU_events.94.b: "Décliner l'invitation"
 SAU_events.94.d: "La République d'Arabie lève une bannière rivale à l'Axe de la résistance, appelant notre nation à rompre avec Téhéran et à rejoindre un front indépendant mené depuis Riyad."
 SAU_events.94.t: "Une invitation d'Arabie"
 SAU_events.95.a: "Rejoindre le Komintern arabe"
 SAU_events.95.b: "Se démarquer"
 SAU_events.95.d: "L'Arabie rouge appelle les ouvriers et les révolutionnaires du monde arabe à s'unir sous une seule bannière."
 SAU_events.95.t: "Le Komintern arabe"
 SAU_events.96.a: "Une aube rouge se lève"
 SAU_events.96.d: "Le drapeau rouge flotte sur Riyad. La maison des Saoud est balayée et la République populaire d'Arabie est proclamée, jurant de porter la révolution à travers le monde arabe."
 SAU_events.96.t: "La République populaire d'Arabie"
 SAU_events.97.a: "Ainsi est-il proclamé"
 SAU_events.97.d: "L'assemblée constituante a proclamé la République islamique d'Arabie, fondée sur la tutelle du jurisconsulte et le gouvernement des fidèles."
 SAU_events.97.t: "La République islamique d'Arabie"
 SAU_events.98.a: "Une faille dangereuse"
 SAU_events.98.d: "L'Arabie a rompu avec Téhéran, rejetant la tutelle iranienne pour diriger son propre front anti-impérialiste. Le monde chiite se scinde entre deux centres rivaux de la résistance."
 SAU_events.98.t: "Schisme dans l'Axe"
 SAU_events.99.a: "Ils en rendront compte"
 SAU_events.99.d: "Riyad a rompu avec l'Axe et détourné nos alliés. Téhéran doit décider comment répondre à cette trahison de la résistance."
 SAU_events.99.t: "Le schisme saoudien"
