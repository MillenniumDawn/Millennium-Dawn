 occupied_countries.1.title: "[FROM.FROM.GetNameDef]의 임시정부"
 occupied_countries.1.desc: "[FROM.FROM.GetNameDef]에 주둔한 우리 점령 당국은 이제 현지 관리들과 긴밀히 협력하고 있으며, 주민 대부분이 우리의 주둔을 받아들였습니다. 협조적인 현지인들로 구성된 임시정부가 우리의 지도 아래 행정을 넘겨받을 준비를 마쳤습니다."
 occupied_countries.1.a: "그들에게 우리의 축복을."
 occupied_countries.1.b: "아직 준비가 안 됐다."
 occupied_countries.1.c: "이런 청원은 그만 가져와라."