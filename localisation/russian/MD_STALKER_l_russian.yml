l_russian:
 STALKER.1.t: "Зона прорывает сдерживание"
 STALKER.1.d: "Аномальная активность вокруг Чернобыля вышла за пределы старого периметра отчуждения. Правительство должно решить: оцепить Зону под военным управлением или разрешить контролируемый научный доступ."
 STALKER.1.a: "Оцепить периметр под военным контролем."
 STALKER.1.b: "Открыть Зону для научных групп."
 STALKER.2.t: "По Зоне прокатился выброс"
 STALKER.2.d: "Мощная волна аномальной энергии прокатилась по Зоне в [STALKER_zone_name]. Инфраструктура нарушена, а Зона стала активнее."
 STALKER.2.a: "Оценить ущерб."
 STALKER.2.b: "Укрепить периметр."
 STALKER.2.b_tt: "Потратить §Y50§! политической власти, чтобы повысить сдерживание до §G15§!, снизить активность до §G10§! и снизить эксплуатацию до §R5§!."
 STALKER.2.c: "Изучить остаточные следы выброса."
 STALKER.2.c_tt: "Потратить §Y25§! политической власти, чтобы повысить эксплуатацию до §G15§!, снизив сдерживание до §R5§!."
 STALKER_zone_management_category: "Управление Зоной"
 STALKER_zone_management_category_desc: "Находить баланс между сдерживанием, общественной безопасностью и научным доступом на подконтрольных нам аномальных территориях.\n\n[STALKER_field_campaign_name]\n[STALKER_field_assignment_status]"
 STALKER_reinforce_zone_containment: "Укрепить периметр: [FROM.GetName]"
 STALKER_reinforce_zone_containment_desc: "Направить дополнительный персонал и технику для подавления аномальной активности: [FROM.GetName].\n\nТекущая активность: §Y[?FROM.STALKER_zone_activity|0]§!\nТекущее сдерживание: §Y[?FROM.STALKER_zone_containment|0]§!\nТекущая эксплуатация: §Y[?FROM.STALKER_zone_exploitation|0]§!\nПрогноз выброса: §Y[FROM.STALKER_current_emission_risk]§!\n\nПосле первого выброса ежемесячный риск равен §Y(Активность + Эксплуатация − Сдерживание) × 0.2§! в пределах от §Y2%§! до §Y20%§!."
 STALKER_zone_presence: "Зона"
 STALKER_zone_presence_desc: "Расширяющаяся область смертоносных аномалий, изменённых экосистем и ненадёжных физических законов."
 STALKER_emission_disruption: "Последствия выброса"
 STALKER_emission_disruption_desc: "Недавний выброс нарушил военную и экономическую деятельность."
 STALKER_zone_administration: "Управление Зоной"
 STALKER_zone_administration_desc: "Поддержание периметра требует национальных ресурсов, а контролируемая эксплуатация Зоны даёт научные открытия, не более §G+10%§! к скорости исследований вне зависимости от числа наших Зон."
 STALKER_military_policy_tt: "Стоит §Y0.2%§! ВВП. Повышает §Yсдерживание§! Зоны на §Y30§!. Первый выброс гарантирован после §Y90-дневного§! льготного периода. В Чернобыльской Зоне это даёт сдерживание §Y60§!, эксплуатацию §Y0§! и ежемесячный риск §Y2%§! до эффектов выбросов и дальнейших действий."
 STALKER_scientific_policy_tt: "Стоит §Y0.2%§! ВВП. Повышает §Yэксплуатацию§! Зоны на §Y30§!, что даёт скорость исследований, пока Зона остаётся под нашим контролем. Первый выброс гарантирован после §Y90-дневного§! льготного периода. В Чернобыльской Зоне это даёт сдерживание §Y30§!, эксплуатацию §Y30§!, §G+1.5%§! к скорости исследований и ежемесячный риск §Y12%§! до эффектов выбросов и дальнейших действий."
 STALKER_reinforce_zone_containment_tt: "§YСдерживание§! Зоны растёт на §G20§!, §Yактивность§! падает до §G10§!, а §Yэксплуатация§! — до §R5§!."
 STALKER_current_emission_risk_value: "[?STALKER_emission_risk_display|.1]%"
 STALKER_first_emission_outlook: "Первый выброс гарантирован при первом ежемесячном обновлении после 90-дневного льготного периода и выбора политики"
 STALKER_emission_cooldown_outlook: "Пока действует 180-дневная перезарядка, риска выброса нет"
 STALKER_cordon_crackdown: "Облава на Кордоне: [FROM.GetName]"
 STALKER_cordon_crackdown_desc: "Прочесать сёла и блокпосты Кордона в поисках бандитских шаек и торговцев, сбывающих их товар.$STALKER_zone_society_readout$"
 STALKER_cordon_crackdown_tt: "Влияние §Yбандитов§! в Зоне падает до §G20§!, число §Yсталкеров§! — до §R10§!, а §Yсдерживание§! растёт на §G5§!."
 STALKER_emergency_perimeter_patrol: "Экстренный патруль периметра: [FROM.GetName]"
 STALKER_emergency_perimeter_patrol_desc: "Отправить патрули закрыть новые бреши в Кордоне, пока прорыв не расширился. Можно сделать один раз за текущий прорыв.$STALKER_zone_society_readout$"
 STALKER_emergency_perimeter_patrol_tt: "§YСдерживание§! Зоны растёт до §G10§!, а §Yактивность§!, влияние §Yбандитов§! и §Yэксплуатация§! падают до §G5§! каждое."
 STALKER_license_cordon_trader: "Выдать лицензию торговцу на Кордоне: [FROM.GetName]"
 STALKER_license_cordon_trader_desc: "Выдать одному торговцу на границе Зоны государственную лицензию на скупку артефактов у сталкеров, чтобы больше добычи попадало в наши лаборатории, а не к бандам.$STALKER_zone_society_readout$"
 STALKER_license_cordon_trader_tt: "§YЭксплуатация§! Зоны растёт на §G10§!, влияние §Yбандитов§! падает до §G10§!, число §Yсталкеров§! растёт на §Y10§!, а влияние §Y«Свободы»§! — на §Y5§! (только в исходной Зоне)."
 STALKER_back_duty: "Поддержать «Долг»: [FROM.GetName]"
 STALKER_back_duty_desc: "Тайно вооружать и снабжать «Долг» — дисциплинированную группировку, считающую, что Зону нужно сдерживать или уничтожить. Влияние «Долга» удерживает сталкеров и бандитов подальше от Зоны.$STALKER_zone_society_readout$"
 STALKER_back_duty_tt: "Влияние §Y«Долга»§! в Зоне растёт на §G20§!, а влияние §Y«Свободы»§! падает до §Y10§!."
 STALKER_back_freedom: "Поддержать «Свободу»: [FROM.GetName]"
 STALKER_back_freedom_desc: "Закрывать глаза на то, как «Свобода» — группировка, считающая, что Зона не принадлежит ни одному правительству, — открывает пути для сталкеров и исследователей. Влияние «Свободы» привлекает в Зону больше сталкеров.$STALKER_zone_society_readout$"
 STALKER_back_freedom_tt: "Влияние §Y«Свободы»§! в Зоне растёт на §G20§!, а влияние §Y«Долга»§! падает до §Y10§!."
 STALKER_study_recovered_artifacts: "Изучить добытые артефакты"
 STALKER_study_recovered_artifacts_desc: "Отправить партию добытых артефактов на изучение в наши лаборатории.\n\nЗапас артефактов: §Y[?ROOT.STALKER_artifact_stockpile|1]§!"
 STALKER_study_recovered_artifacts_tt: "Тратит §Y5§! артефактов из национального запаса и даёт §G+3%§! к скорости исследований на §Y180 дн.§!"
 STALKER_artifact_studies: "Изучение артефактов"
 STALKER_artifact_studies_desc: "Наши лаборатории изучают артефакты, добытые в Зоне."
 STALKER.3.t: "Столкновение «Долга» и «Свободы»"
 STALKER.3.d: "В [STALKER_zone_name] вспыхнула перестрелка между «Долгом» и «Свободой». «Долг» обвиняет «Свободу» в том, что она проводит сталкеров через периметр; «Свобода» говорит, что «Долг» бесплатно делает работу правительства. Обе стороны спрашивают, на чью сторону склонимся мы."
 STALKER.3.a: "Встать на сторону «Долга»."
 STALKER.3.a_tt: "Влияние §Y«Долга»§! в Зоне растёт на §G10§!, влияние §Y«Свободы»§! падает до §Y15§!, а число §Yсталкеров§! — до §Y5§!."
 STALKER.3.b: "Встать на сторону «Свободы»."
 STALKER.3.b_tt: "Влияние §Y«Свободы»§! в Зоне растёт на §G10§!, влияние §Y«Долга»§! падает до §Y15§!, а число §Yсталкеров§! — до §Y5§!."
 STALKER.3.c: "Пусть сами разберутся."
 STALKER.3.c_tt: "Влияние §Y«Долга»§! и §Y«Свободы»§! в Зоне падает до §Y10§! каждое, число §Yсталкеров§! — до §Y10§!, а влияние §Yбандитов§! растёт на §R5§!."
 STALKER.4.t: "Чёрный рынок на Кордоне"
 STALKER.4.d: "Наши пограничники сообщают о рынке под открытым небом на краю Зоны в [STALKER_zone_name], где бандиты продают артефакты покупателям даже из Киева и Минска. Среди клиентов есть и наши собственные офицеры."
 STALKER.4.a: "Устроить облаву на рынок."
 STALKER.4.a_tt: "Стоит §R25§! политической власти. Влияние §Yбандитов§! в Зоне падает до §G15§!, а число §Yсталкеров§! — до §Y5§!."
 STALKER.4.b: "Покупать через подставные компании."
 STALKER.4.b_tt: "Добавляет §G3§! артефакта в национальный запас. Влияние §Yбандитов§! в Зоне растёт на §R5§!."
 STALKER.5.t: "Необычный артефакт"
 STALKER.5.d: "Группа сталкеров из «Свободы» вынесла из Зоны в [STALKER_zone_name] артефакт, не похожий ни на что из каталогов наших учёных. Сталкеры хотят оставить его себе; нашим лабораториям он нужнее."
 STALKER.5.a: "Отправить его в наши лаборатории."
 STALKER.5.a_tt: "Добавляет §G5§! артефактов в национальный запас."
 STALKER.5.b: "Пусть сталкеры оставят его себе."
 STALKER.5.b_tt: "Влияние §Y«Свободы»§! в Зоне растёт на §G10§!, а число §Yсталкеров§! — на §Y5§!."
 STALKER.6.t: "Периметр не выдерживает"
 STALKER.6.d: "В Кордоне в [STALKER_zone_name] открылась брешь. Патрули сообщают об аномальной активности за блокпостами, а бандитские маршруты расширяются. Командиры ожидают развязки примерно через три месяца после начала прорыва; экстренные патрули и работы по сдерживанию ещё могут переломить кризис."
 STALKER.6.a: "Мобилизовать силы периметра."
 STALKER.7.t: "Периметр держится"
 STALKER.7.d: "Экстренные меры закрыли прорыв в [STALKER_zone_name]. Патрули восстанавливают блокпосты, а доступ бандитов сузился."
 STALKER.7.a: "Сохранять бдительность."
 STALKER.8.t: "Периметр прорван"
 STALKER.8.d: "Кордону в [STALKER_zone_name] не удалось сдержать прорыв. Аномальная активность и бандитский трафик резко выросли, дестабилизируя регион и подрывая доверие населения."
 STALKER.8.a: "Восстановить линию."
 STALKER_xlab_stage_0: "Зацепок нет"
 STALKER_xlab_stage_1: "X-18 найдена в Тёмной долине"
 STALKER_xlab_stage_2: "Проект X раскрыт в X-16"
 STALKER_xlab_stage_3: "О-Сознание обнаружено в X-10"
 STALKER_xlab_stage_4: "Подозревается более широкая сеть"
 STALKER_granted_zone_access: "Предоставили нам доступ к Зоне"
 STALKER_refused_zone_access: "Отказали нам в доступе к Зоне"
 STALKER_returned_artifacts: "Вернули изъятые артефакты"
 STALKER_ipsf_contribution: "Участвовали в Международных силах охраны периметра"
 STALKER_artifact_gift: "Подарили нам артефакты Зоны"
 STALKER_zone_society_readout: "\n\nСталкеры: §Y[?FROM.STALKER_zone_stalkers|0]§!\n«Долг»: §Y[?FROM.STALKER_zone_duty|0]§! | «Свобода»: §Y[?FROM.STALKER_zone_freedom|0]§! | Бандиты: §Y[?FROM.STALKER_zone_bandits|0]§! | «Монолит»: §Y[?FROM.STALKER_zone_monolith|0]§!\nЭкологи: §Y[?FROM.STALKER_zone_scientists|0]§! | Военные: §Y[?FROM.STALKER_zone_military|0]§! | «Варта»: §Y[?FROM.STALKER_zone_ward|0]§! | «Искра»: §Y[?FROM.STALKER_zone_spark|0]§!\n«Чистое Небо»: §Y[?FROM.STALKER_zone_clear_sky|0]§! | «Полдень»: §Y[?FROM.STALKER_zone_noon|0]§! | Наёмники: §Y[?FROM.STALKER_zone_mercenaries|0]§!\nЛидирует по влиянию: §Y[FROM.STALKER_zone_leading_faction]§!\nСдерживание: §Y[?FROM.STALKER_zone_containment|0]§! | Активность: §Y[?FROM.STALKER_zone_activity|0]§! | Эксплуатация: §Y[?FROM.STALKER_zone_exploitation|0]§!\nАртефактов за прошлый месяц: §Y[?FROM.STALKER_zone_artifact_haul|1]§!, из них на чёрный рынок попало §R[?FROM.STALKER_zone_black_market|1]§!\n«Долг» подавляет вербовку бандитов и добывает больше артефактов; «Свобода» увеличивает добычу артефактов; контроль бандитов уводит больше артефактов к контрабандистам. «Монолит» убивает сталкеров, идущих на север, и охраняет лаборатории X. Наёмники следуют за иностранной разведкой в исходной Зоне."
 STALKER_study_recovered_artifacts_available_tt: "В национальном запасе не менее §Y5§! артефактов (сейчас §Y[?ROOT.STALKER_artifact_stockpile|1]§!)."
 STALKER.1.d_global: "С тех пор как открылась восьмая капсула, аномалии распространяются далеко от Чернобыля, и теперь одна из них закрепилась в [STALKER_zone_name]. [ROOT.STALKER_zone_flavor] Правительство должно решить: оцепить новую Зону под военным управлением или разрешить контролируемый научный доступ."
 STALKER.1.d_lake_mungo: "У озера Мунго, среди высохших озёрных котловин и одних из древнейших человеческих останков, найденных в Австралии, замолчали приборы, а посетители рассказывают, что видят людей, которых там нет. Правительство должно решить: оцепить аномальную Зону озера Мунго под военным управлением или разрешить контролируемый научный доступ."
 STALKER_zone_flavor_none: ""
 STALKER_zone_flavor_32: "Аномалии сосредоточены в пустыне Чиуауа, к югу от границы с местом испытаний «Тринити», где в 1945 году взорвали первую атомную бомбу."
 STALKER_zone_flavor_34: "Аномалии тянутся вдоль Ормузского пролива, где в пределах видимости периметра проходит пятая часть мировой нефти."
 STALKER_zone_flavor_35: "В Ладакхе, на индийской стороне границы в Аксайчине, Зона лежит на высоте более трёх километров среди армейских постов, обращённых к Китаю."
 STALKER_zone_flavor_2: "Болота и ельники тянутся на север до Гудзонова залива, и единственная дорога туда — железная дорога до Черчилла."
 STALKER_zone_flavor_3: "Река Святого Лаврентия несёт странный свет аномалий вниз по течению к городам, которые никогда не знали эвакуации."
 STALKER_zone_flavor_4: "Зона легла на хребты вокруг Ок-Риджа, где в рамках Манхэттенского проекта когда-то обогащали уран."
 STALKER_zone_flavor_5: "Аномалии сосредоточены в пустыне у места испытаний «Тринити», где в 1945 году взорвали первую атомную бомбу."
 STALKER_zone_flavor_6: "Вдоль западного побережья Гренландии ледники откалываются в тишине, а охотники отказываются выходить на лёд."
 STALKER_zone_flavor_7: "На пустынном востоке Гренландии сам ледяной щит словно сдвигается под исследовательскими станциями."
 STALKER_zone_flavor_8: "Вулканические поля Исландии теперь выбрасывают не только пар, а небольшая береговая охрана острова не может их оцепить."
 STALKER_zone_flavor_9: "В глубине перуанской Амазонии реки — единственные дороги, а полог леса скрывает всё, что под ним."
 STALKER_zone_flavor_10: "Вдоль Амазонки у Манауса аномалии дрейфуют с течением быстрее, чем за ними успевают патрули."
 STALKER_zone_flavor_11: "Там, где Амазонка впадает в Атлантику, скотоводы и лесорубы бросили целые округа."
 STALKER_zone_flavor_12: "В сухом колючем лесу Чако пограничные тропы принадлежат контрабандистам."
 STALKER_zone_flavor_13: "Зона лежит в промышленном сердце Англии, среди автострад, железнодорожных узлов и миллионов людей."
 STALKER_zone_flavor_14: "Поля и старые деревни в центре Франции теперь оказались за периметром, которого никто не планировал."
 STALKER_zone_flavor_15: "На равнинах к западу от Познани Зона перекрыла главные автомобильные и железнодорожные пути из Польши в Германию."
 STALKER_zone_flavor_16: "Степь в низовьях Дона стала враждебной, рядом с черноморскими портами и южным зерновым поясом России."
 STALKER_zone_flavor_17: "Аномалии окружают Бушерскую АЭС на иранском побережье Персидского залива."
 STALKER_zone_flavor_18: "Аномалии распространились по нефтяным месторождениям Ханты-Мансийского округа, где Россия добывает большую часть нефти."
 STALKER_zone_flavor_19: "На побережье Таймыра Зона лежит за Полярным кругом, в дне лёта от норильских рудников."
 STALKER_zone_flavor_20: "В вечной мерзлоте Якутии, где зимой бывает минус пятьдесят, всё движущееся видно за много километров."
 STALKER_zone_flavor_21: "Вдоль Колымы старые гулаговские дороги ведут прямо в Зону."
 STALKER_zone_flavor_22: "На дальнем краю Чукотки Зона смотрит на Аляску через Берингов пролив."
 STALKER_zone_flavor_23: "Сразу к северу от Пекина Зона лежит в досягаемости от китайской столицы и её древних стен."
 STALKER_zone_flavor_24: "На Центральной равнине Таиланда рисовые поля и придорожные городки находятся в нескольких часах от Бангкока."
 STALKER_zone_flavor_25: "В высокогорье Западного Папуа Зона граничит с рудником Грасберг и одними из наименее изученных лесов на Земле."
 STALKER_zone_flavor_26: "В красной пустыне у Алис-Спрингс расстояния огромны, а помощь — в часах лёта."
 STALKER_zone_flavor_27: "Среди высохших котловин озера Мунго Зона хранит одни из древнейших человеческих останков, найденных в Австралии."
 STALKER_zone_flavor_28: "На сахарском севере Мавритании Зона лежит у железнодорожной линии, по которой возят железную руду из Зуэрата."
 STALKER_zone_flavor_29: "В Срединном поясе Нигерии фермеры и скотоводы, и так спорящие за землю, теперь делят её с Зоной."
 STALKER_zone_flavor_30: "В тропическом лесу на стыке Камеруна, Конго и ЦАР ни одна армия не контролирует тропы."
 STALKER_zone_flavor_31: "На плато Аксайчин, удерживаемом Китаем и оспариваемом Индией, Зона лежит на спорной границе на высоте более пяти километров."
 STALKER_duty_security_mandate: "Выдать «Долгу» мандат на охрану: [FROM.GetName]"
 STALKER_duty_security_mandate_desc: "Когда «Долг» лидирует среди местных группировок, его патрули могут взять под контроль доступ в Зону. Зона может выдавать только один мандат группировке раз в 180 дн."
 STALKER_duty_security_mandate_tt: "Влияние «Долга» растёт на §G5§!, сдерживание — на §G10§!. Влияние бандитов падает до §G15§!, а число сталкеров и эксплуатация — до §R5§! каждое."
 STALKER_freedom_access_mandate: "Выдать «Свободе» мандат на доступ: [FROM.GetName]"
 STALKER_freedom_access_mandate_desc: "Когда «Свобода» лидирует среди местных группировок, она может открыть маршруты для вольных сталкеров. Зона может выдавать только один мандат группировке раз в 180 дн."
 STALKER_freedom_access_mandate_tt: "Влияние «Свободы» растёт до §G5§!, влияние бандитов — до §R5§!, а число сталкеров и эксплуатация — до §G10§! каждое. Сдерживание падает до §R10§!."
 STALKER_bandit_broker_mandate: "Договориться с барыгами Зоны: [FROM.GetName]"
 STALKER_bandit_broker_mandate_desc: "Когда бандиты лидируют среди местных группировок, мы можем купить доступ к их маршрутам. Зона может выдавать только один мандат группировке раз в 180 дн."
 STALKER_bandit_broker_mandate_available_tt: "В контрабандном обороте не менее §Y5§! артефактов."
 STALKER_bandit_broker_mandate_tt: "Перемещает §Y5§! контрабандных артефактов в наш запас. Влияние бандитов растёт на §R10§!, эксплуатация — на §G10§!, а сдерживание падает до §R10§!."
