 medium_tank_destroyer_chassis_0: "1세대 경전차 차체"
 medium_tank_destroyer_chassis_0_desc: "경전차의 역할은 정찰과 공수 작전이지만, 장갑이 얇고 오늘날의 각종 대전차 무기 앞에서 생존성이 낮다는 단점이 있습니다. 보병전차의 등장과 맞물려 경전차의 발전은 쇠퇴하였습니다."
 medium_tank_destroyer_chassis_1: "2/3세대 경전차 차체"
