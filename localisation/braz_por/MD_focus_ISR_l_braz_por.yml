 ISR_economy_bonuses: "A Economia Israelense"
 ISR_economy_bonuses_desc: "Dada a influência que as três principais indústrias têm sobre a economia israelense, seu crescimento e sua estabilidade influenciam fortemente a saúde de Israel. Essas indústrias prosperando trarão bônus à economia israelense, enquanto seu declínio trará efeitos negativos ao nosso país."
