 Cameroon.1.t: "The Eruption of Mount Cameroon"
 Cameroon.1.d: "Mount Cameroon, a volcano with an elevation of 4,040 meters, is the highest point in central Africa and is one of Africa's most active volcanoes.\n\nHaving erupted already in 1999, the people around Mount Cameroon were surprised when the volcano, which the natives call Mongo ma Ndemi (\"Mountain of Greatness\"), erupted once more into several months of violent activities on March 28th, 2000."
 Cameroon.1.a: "This will hurt the region"
 Cameroon.1.b: "Send in all needed aid!"
 diplomatic_response.1.t: "[FROM.GetName] Accepts!"
 diplomatic_response.1.d: "[This.GetAdjective]代表団と[FROM.GetAdjective]代表団は、最近の交渉で相互の合意に達した。[FROM.GetName]は我々の提案を受け入れる意向を示している。"
 diplomatic_response.1.o1: "Excellent"
 diplomatic_response.2.t: "[FROM.GetName] Rejects!"
 diplomatic_response.2.d: "幾晩にもわたる交渉と、些細な点や重要事項を巡る激しい議論の末、[This.GetName]と[FROM.GetName]の代表団による最新の交渉は失敗に終わった。我々の提案が実現することは当面なさそうだ。"
 diplomatic_response.2.d1: "[FROM.GetNameWithFlag]は我々の救済要請を拒否する決定を下した。この結果、差し迫る危機は一層深刻なものとなるだろう……。"
 diplomatic_response.2.o1: "Oh well"
 LibyaNews.1.t: "Second Libyan Civil War Comes to an End"
 LibyaNews.1.GNA.d: "The Second Libyan Civil War started in 2014, after the Libyan military under General Khalifa Haftar ousted the ruling government when they refused to step down after losing the elections of 2014. The supporters of the government formed a new faction, the National Salvation Government, sparking a new civil war. In 2015, the UN brokered a truce between the two factions, forming a new joint-government called the Government of National Accord. However, only a year later the peace was shattered, plunging the country into a three-way civil war.\n\nIt seems that the internationally backed Government of National Accord has managed to overcome the rebellious factions and unite the country, despite lacking the backing of the Libyan military. Being recognized by the EU and much of the Western world, this is a vast shift of balance in the region."
 LibyaNews.1.HOR.d: "The Second Libyan Civil War started in 2014, after the Libyan military under General Khalifa Haftar ousted the ruling government when they refused to step down after losing the elections of 2014. The supporters of the government formed a new faction, the National Salvation Government, sparking a new civil war. In 2015, the UN brokered a truce between the two factions, forming a new joint-government called the Government of National Accord. However, only a year later the peace was shattered, plunging the country into a three-way civil war.\n\nIt seems that the House of Representatives with the support of General Haftar, the Libyan military and many Gaddafi-loyalists have managed to legitimize their rule over the country. Supplied and backed by Russia, Haftar has promised land for two Russian military bases in the country. This will see an increase of Russian influence in North Africa."
 LibyaNews.1.GNC.d: "The Second Libyan Civil War started in 2014, after the Libyan military under General Khalifa Haftar ousted the ruling government when they refused to step down after losing the elections of 2014. The supporters of the government formed a new faction, the National Salvation Government, sparking a new civil war. In 2015, the UN brokered a truce between the two factions, forming a new joint-government called the Government of National Accord. However, only a year later the peace was shattered, plunging the country into a three-way civil war.\n\nIt seems that against all odds, the National Salvation Government has emerged victorious. Composed mainly of Islamists and members of the Muslim Brotherhood, many experts claim that this victory could've only been achieved by serious backing from foreign actors. Who those actors were remains unclear."
 SierraLeoneNews.1.t: "シエラレオネ内戦の終結"
 SierraLeoneNews.1.SIE.d: "The Sierra Leonean government announced an official victory over the rebels today. With support from Guinea, United Kingdom and the UNAMSIL forces, the rebels of RUF and AFRC have either surrendered or fled to neighbouring Liberia. The leader of RUF, [AFR.GetLeader], was found in a hideout and arrested, and was handed to the custody of the British SAS.\n\nHe is currently awaiting his trial, being charged with multiple counts of war crimes by the UN."
 SierraLeoneNews.1.AFR.d: "イギリス軍や国連軍の支援にもかかわらず、シエラレオネ政府軍は首都フリータウンから完全に撤退した。一部の政府関係者はナイジェリアへの避難に成功したが、運悪く反乱軍に捕らえられた者たちは即座に処刑され、その遺体はフリータウンの街中で晒された。\n\n政府崩壊後、数日にわたり略奪が続き、国中の反乱勢力が勝利を祝っている。\n\n今や民兵たちにとって敵となる相手はもはや存在せず、国は無政府状態と混乱へと陥る可能性が極めて高い。"
 SierraLeoneNews.1.a: "興味深い進展だ"
 SierraLeone.2.t: "Our Allies in Sierra Leone Fall"
 SierraLeone.2.d: "The Government of Sierra Leone has fallen to the rebels. It seems that our intervention wasn't enough to save them. We can continue fighting the AFRC, but this will mean that we'll have to advance deep into the country to reinstall the legitimate government. On the other hand, it might be better to pull back from Sierra Leone."
 SierraLeone.2.a: "和平交渉を試みる"
 SierraLeone.2.b: "We need to drive them out of Sierra Leone."
 SierraLeone.3.t: "ギニア政府が停戦を要請"
 SierraLeone.3.d: "The Guinean government has contacted us saying that they want to end the fighting between us and them and pull out of Sierra Leone. How should we respond?"
 SierraLeone.3.a: "Stop fighting them."
 SierraLeone.3.b: "Keep fighting them."
 SierraLeone.4.t: "AFRC Agrees to a Truce"
 SierraLeone.4.d: "The Sierra Leonean rebels have agreed to a cease fire."
 SierraLeone.4.a: "Good"
 SierraLeone.5.t: "AFRC Continues Fighting"
 SierraLeone.5.d: "The Sierra Leonean rebels have turned down our offer, and they want to keep fighting us."
 SierraLeone.5.a: "くそっ"
 LiberiaNews.1.t: "第二次リベリア内戦の終結"
 LiberiaNews.1.LIB.d: "Today Charles Taylor, the dictator-president of Liberia, announced the end of LURD in Liberia. Despite the Liberian military being in shambles, and most of the work being done by Taylor's anti-terrorist units, LURD with their Guinean allies weren't able to topple his government. What remaining rebels there are have crossed the border and escaped to Guinea. It is likely that Taylor will continue the conflict with Guinea until all opposition is dealt with."
 LiberiaNews.1.LUR.d: "In a televised broadcast today, Charles Taylor announced his resignation as the president of Liberia. Shortly after, he boarded a plane to fly into exile into Nigeria, as LURD rebels danced all along the streets of Monrovia. Due to suspected war crimes, Interpol issued an arrest warrant for Taylor. However, the Nigerian government has refused to deport Taylor, unless the request comes from the new Liberian government itself.\n\nThe new Liberian government is still in an on-going reorganisation, and it will take time until it establishes itself in Monrovia, and then in the rest of the country."
 LiberiaNews.1.a: "興味深い"
 Liberia.2.t: "Our Allies in Liberia Fall"
 Liberia.2.d: "The Taylor government has driven out the LURD rebels from Liberia. Despite providing them with weapons and aid, and allowing them to cross the border unopposed, the rebels weren't enough to overcome Taylor's government. We can step up our military operations and try to get rid of Taylor ourselves, or we can retreat from Liberia altogether."
 Liberia.2.a: "和平交渉を試みる"
 Liberia.2.b: "We need to topple Taylor."
 Liberia.3.t: "Guinean Government Calls for Truce"
 Liberia.3.d: "The Guinean government has contacted us saying that they want to end the fighting between us and them and pull out of Liberia. How should we respond?"
 Liberia.3.a: "Stop fighting them."
 Liberia.3.b: "Keep fighting them."
 Liberia.4.t: "Taylor Agrees to a Truce"
 Liberia.4.d: "Taylor's government has agreed to a cease fire."
 Liberia.4.a: "Good"
 Liberia.5.t: "Taylor Continues Fighting"
 Liberia.5.d: "Charles Taylor turned down our offer, and they want to keep fighting us."
 Liberia.5.a: "くそっ"
 SudanNews.1.t: "Conflict in South Kordofan and the Blue Nile Is Over"
 SudanNews.1.a: "興味深い"
 SouthSudanNews.1.t: "[SSU.GetAdjective] Civil War Ends"
 SouthSudanNews.1.a: "興味深い"
 AngolaNews.1.t: "アンゴラ内戦の終結"
 AngolaNews.1.AGL.d: "アンゴラ内戦が終結した。1970年代から続いていたこの紛争は、かつての独立闘争の同盟国であるMPLAとUNITAの間で戦われた。\n\n旧ソ連の同盟国であるMPLAは、UNITAをなんとか征服し、打ち負かすことができた。"
 AngolaNews.1.UNI.d: "アンゴラ内戦が終結した。1970年代から続いていたこの紛争は、かつての独立闘争の同盟国であるMPLAとUNITAの間で戦われた。\n\nアメリカの同盟国であるUNITAは、MPLAをなんとか征服し、打ち負かすことができた。"
 AngolaNews.1.a: "興味深い"
 overlord.1.t: "[FROM.GetName]の統合"
 overlord.1.d: "[FROM.GetName] has been our puppet state for far too long. It is no longer a viable partnership to allow them to have autonomy. This day in [GetYear] marks a day we have long desired. [FROM.GetName] has been integrated into our great nation. They will now become [ROOT.GetAdjective] citizens and receive the same care and treatment as any other citizen in our nation. It is a glorious day for us and the people of [FROM.GetName].\nNOTE: Annexing another sovereign nation forces us to assume all of their debt, treasury, and international investments as they merge with us.\n\nYou gain the following: [?ROOT.treasury|Y] Treasury, [?ROOT.debt|R] Debt, [?ROOT.int_investments] International Investments"
 overlord.1.a: "素晴らしい"
 overlord.1.a_tt: "§B[FROM.GetName]の中核州§!が§Y我々の中核州§!となる！\n"
 overlord_news.1.t: "[ROOT.GetName]が[FROM.FROM.GetName]を統合"
 overlord_news.1.d: "Delegations from [ROOT.GetName] and [FROM.FROM.GetName] have announced today that [FROM.FROM.GetName] will be integrated into [ROOT.GetName]. [FROM.FROM.GetName] has been an autonomous state for quite some time and has become increasingly reliant on [ROOT.GetName] in the past months. It is quoted as 'It only makes sense!' from the two parties involved.\n\nThe truth in that statement is yet to be seen."
 overlord_news.1.a: "興味深い"
 debug_money.1.t: "Resource Sale Rate Calculator"
 AIDS_events.1.t: "HIV Prevalence Increases"
 AIDS_events.1.d: "Bad news on the health front of the country. Last year saw a significant increase of HIV cases, and in total the overall HIV situation in our country has gotten worse."
 AIDS_events.1.a: "くそっ"
 AIDS_events.2.t: "HIV Prevalence Normalises"
 AIDS_events.2.d: "It seems that our fight against HIV is growing fruit. Last year saw essentially no change in the prevalence of HIV in our country. While not an improvement, it is still progress."
 AIDS_events.2.a: "What a relief."
 AIDS_events.3.t: "HIV Prevalence Decreases"
 AIDS_events.3.d: "Good news on the health front of the country. Last year saw a significant decrease in HIV cases, and in total the overall HIV situation in our country has improved significantly."
 AIDS_events.3.a: "Magnificent."
 econvent.3.b: "救済措置を発動する"
 DRC.0.t: "ローラン＝デジレ・カビラが暗殺された！"
 DRC.0.d: "Our leader and liberator Laurent-Désiré was attacked today in the presidential palace, his bad standing with the military and attempts to purge disloyal Kadogos have evidently met with a terrible failure, we attempted to rush him to Harare for urgent medical care, but it was too late, our liberator lies dead.\n\nWe have since found and had the perpetrator Rashidi Kasereka executed for his crimes."
 DRC.0.A: "最悪な日だ"
