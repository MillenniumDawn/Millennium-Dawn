 UKR_storage_item_brdm1_tt: "§YБРДМ-1§!\n\n\n£SOV_LAND_BRDM_1\n\n\n\nНа хранении: §Y[?ukraine_has_brdm1_stockpile|0]§!\nПоколение: плавающая разведывательная машина первого поколения, на вооружении с 1957 года.\nТип техники: §YКорпус лёгкого танка 1-го поколения§!\n\nВарианты на хранении:\n• БРДМ-1: §Y[?ukraine_has_brdm1_stockpile|0]§!\n\nПлавающая бронированная разведывательная машина, которую в нашей армии сменила §YБРДМ-2§!."
