name: Test Suite
run-name: >-
  Validate PR #${{ inputs.pr_number ||
  github.event.pull_request.number || 'current' }}
  head=${{ inputs.head_sha || github.event.pull_request.head.sha ||
  github.sha }} base=${{ inputs.base_sha ||
  github.event.pull_request.base.sha || github.sha }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to validate (omit for the current ref)"
        required: false
        type: string
      head_sha:
        description: "PR head SHA to validate"
        required: false
        type: string
      base_sha:
        description: "Base branch SHA for the validation baseline"
        required: false
        type: string

concurrency:
  group: >-
    ${{ github.workflow }}-${{ inputs.pr_number ||
    github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WORKSPACE_PATHS: |
    common
    events
    history
    localisation
    interface
    gfx/flags
    map/adjacency_rules.txt
    music
    tools
    resources/documentation
    .claude
    .github/actions/setup-md-python/action.yml
    CLAUDE.md
    pyproject.toml
    *.mod
    .workspace-manifest
    .validation_cache

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      common: ${{ steps.groups.outputs.common }}
      events: ${{ steps.groups.outputs.events }}
      history: ${{ steps.groups.outputs.history }}
      localisation: ${{ steps.groups.outputs.localisation }}
      ai-strategy: ${{ steps.groups.outputs.ai-strategy }}
      ai-navy: ${{ steps.groups.outputs.ai-navy }}
      ai-equipment: ${{ steps.groups.outputs.ai-equipment }}
      factions: ${{ steps.groups.outputs.factions }}
      characters: ${{ steps.groups.outputs.characters }}
      scientist-traits: ${{ steps.groups.outputs.scientist-traits }}
      oob: ${{ steps.groups.outputs.oob }}
      decisions: ${{ steps.groups.outputs.decisions }}
      scripted-loc: ${{ steps.groups.outputs.scripted-loc }}
      scripted-guis: ${{ steps.groups.outputs.scripted-guis }}
      interface: ${{ steps.groups.outputs.interface }}
      national-focus: ${{ steps.groups.outputs.national-focus }}
      on-actions: ${{ steps.groups.outputs.on-actions }}
      scripted-effects: ${{ steps.groups.outputs.scripted-effects }}
      mios: ${{ steps.groups.outputs.mios }}
      map-adjacency: ${{ steps.groups.outputs.map-adjacency }}
      mod: ${{ steps.groups.outputs.mod }}
      content: ${{ steps.groups.outputs.content }}
      style: ${{ steps.groups.outputs.style }}
      style_files: ${{ steps.groups.outputs.style_files }}
      tools: ${{ steps.groups.outputs.tools }}
      file-paths: ${{ steps.groups.outputs.file-paths }}
      full_suite: ${{ steps.groups.outputs.full_suite }}
      head-sha: ${{ steps.resolve-ref.outputs.head-sha }}
      base-sha: ${{ steps.resolve-ref.outputs.base-sha }}
      checkout-repository: ${{ steps.resolve-ref.outputs.repository }}
      checkout-ref: ${{ steps.resolve-ref.outputs.ref }}
    steps:
      - name: Resolve validation ref
        id: resolve-ref
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_REPOSITORY: >-
            ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          pr_number="${INPUT_PR_NUMBER:-$EVENT_PR_NUMBER}"
          requested_head_sha="$INPUT_HEAD_SHA"
          head_repository="${EVENT_HEAD_REPOSITORY:-$GITHUB_REPOSITORY}"
          head_sha="${EVENT_HEAD_SHA:-$GITHUB_SHA}"
          base_sha="${INPUT_BASE_SHA:-$EVENT_BASE_SHA}"
          if [ -n "$pr_number" ]; then
            pr_url="repos/$GITHUB_REPOSITORY/pulls/$pr_number"
            pr_json=$(gh api "$pr_url")
            head_repository=$(printf '%s' "$pr_json" \
              | jq -r '.head.repo.full_name // empty')
            head_sha=$(printf '%s' "$pr_json" \
              | jq -r '.head.sha // empty')
            if [ -z "$base_sha" ]; then
              base_ref=$(printf '%s' "$pr_json" | jq -r '.base.ref')
              base_sha=$(gh api \
                "repos/$GITHUB_REPOSITORY/commits/$base_ref" --jq '.sha')
            fi
          fi
          base_sha="${base_sha:-$GITHUB_SHA}"
          if [ -n "$requested_head_sha" ] &&
              [ "$head_sha" != "$requested_head_sha" ]; then
            echo "::error::The PR head changed before validation was dispatched"
            exit 1
          fi
          if [ -z "$head_repository" ] || [ -z "$head_sha" ]; then
            echo "::error::Unable to resolve the PR head repository and SHA"
            exit 1
          fi
          {
            echo "repository=$head_repository"
            echo "ref=$head_sha"
            echo "head-sha=$head_sha"
            echo "base-sha=$base_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.resolve-ref.outputs.repository }}
          ref: ${{ steps.resolve-ref.outputs.ref }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            tools/validation/collect_changed_files.py
            tools/validation/change_groups.py
          sparse-checkout-cone-mode: false

      - name: Fetch PR base revision
        env:
          BASE_SHA: ${{ steps.resolve-ref.outputs.base-sha }}
        run: |
          git fetch --no-tags \
            "https://github.com/${{ github.repository }}.git" "$BASE_SHA"

      - name: Derive changed files
        env:
          BASE_SHA: ${{ steps.resolve-ref.outputs.base-sha }}
          HEAD_SHA: ${{ steps.resolve-ref.outputs.head-sha }}
        run: |
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          git diff --name-status -z "$merge_base" "$HEAD_SHA" \
            | python3 tools/validation/collect_changed_files.py \
            > .changed-files.txt
          wc -l .changed-files.txt

      - name: Compute changed groups
        id: groups
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python3 tools/validation/change_groups.py --dispatch \
              < /dev/null
          else
            python3 tools/validation/change_groups.py < .changed-files.txt
          fi

  validate-paths:
    name: File path validation
    needs: [detect-changes]
    if: >-
      needs.detect-changes.outputs.file-paths == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR index and validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.detect-changes.outputs.checkout-repository }}
          ref: ${{ needs.detect-changes.outputs.checkout-ref }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            descriptor.mod
            tools
            .github/actions/setup-md-python/action.yml
          sparse-checkout-cone-mode: false

      - name: Reject links in PR index
        run: |
          if git ls-files --stage | grep -Eq '^(120000|160000) '; then
            echo "::error::PR index contains a symbolic link or submodule"
            exit 1
          fi

      - name: Set up Python
        id: setup-python
        uses: ./.github/actions/setup-md-python
        with:
          install: "false"

      - name: Run file-path validation
        if: always() && !cancelled() && steps.setup-python.outcome == 'success'
        run: >-
          python3 tools/validation/validate_file_paths.py --path .
          --strict --no-color --output validation-file-paths.log

      - name: Verify file-path results
        if: always() && !cancelled() && steps.setup-python.outcome == 'success'
        run: |
          test -f validation-file-paths.log
          test -f validation-file-paths.json

      - name: Upload file-path results
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validation-file-paths-results
          path: |
            validation-file-paths.log
            validation-file-paths.json
          if-no-files-found: error
          retention-days: 7

  prepare-workspace:
    name: Prepare workspace
    needs: [detect-changes]
    if: >-
      needs.detect-changes.outputs.full_suite == 'true' ||
      needs.detect-changes.outputs.content == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
      HEAD_SHA: ${{ needs.detect-changes.outputs.head-sha }}
      MD_NO_CACHE: >-
        ${{ needs.detect-changes.outputs.full_suite == 'true' && '1' || '' }}
    steps:
      - name: Checkout PR workspace
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.detect-changes.outputs.checkout-repository }}
          ref: ${{ needs.detect-changes.outputs.checkout-ref }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            common
            events
            history
            localisation
            interface
            gfx/flags
            map/adjacency_rules.txt
            music
            tools
            resources/documentation
            .claude
            .github/actions/setup-md-python/action.yml
            CLAUDE.md
            pyproject.toml
            *.mod
          sparse-checkout-cone-mode: false

      - name: Restore sparse workspace cache
        id: sparse-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            common
            events
            history
            localisation
            interface
            gfx/flags
            map/adjacency_rules.txt
            music
            tools
            resources/documentation
            .claude
            .github/actions/setup-md-python/action.yml
            CLAUDE.md
            pyproject.toml
            *.mod
          key: >-
            md-sparse-v1-${{ runner.os }}-${{
            needs.detect-changes.outputs.head-sha }}

      - name: Materialize sparse workspace on cache miss
        if: steps.sparse-cache.outputs.cache-hit != 'true'
        run: git sparse-checkout reapply

      - name: Reject links in PR workspace
        run: |
          if git ls-files --stage | grep -Eq '^(120000|160000) '; then
            echo "::error::PR workspace contains a symbolic link or submodule"
            exit 1
          fi

      - name: Compute validator code hash
        id: toolshash
        run: >-
          echo "hash=${{ hashFiles('tools/validation/**',
          'tools/shared_utils.py') }}" >> "$GITHUB_OUTPUT"

      - name: Restore shared validator disk cache
        id: valcache
        if: needs.detect-changes.outputs.full_suite != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .validation_cache
          key: >-
            md-valcache-v1-${{ runner.os }}-${{
            steps.toolshash.outputs.hash }}
          restore-keys: |
            md-valcache-v1-${{ runner.os }}-${{ steps.toolshash.outputs.hash }}-

      - name: Write workspace manifest
        env:
          CACHE_KEY: ${{ steps.valcache.outputs.cache-matched-key }}
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p .validation_cache
          {
            echo "pr=$PR_NUMBER"
            echo "head_sha=$HEAD_SHA"
            echo "checkout_sha=$CHECKOUT_SHA"
            echo "run_id=$RUN_ID"
            echo "cache=$CACHE_KEY"
          } | tee .workspace-manifest

      - name: Save sparse workspace cache
        if: steps.sparse-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            common
            events
            history
            localisation
            interface
            gfx/flags
            map/adjacency_rules.txt
            music
            tools
            resources/documentation
            .claude
            .github/actions/setup-md-python/action.yml
            CLAUDE.md
            pyproject.toml
            *.mod
          key: >-
            md-sparse-v1-${{ runner.os }}-${{
            needs.detect-changes.outputs.head-sha }}

      - name: Upload prepared workspace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: prepared-workspace
          path: ${{ env.WORKSPACE_PATHS }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  tools-tests:
    name: Tools tests (${{ matrix.os }})
    needs: [detect-changes]
    if: >-
      needs.detect-changes.outputs.full_suite == 'true' ||
      needs.detect-changes.outputs.tools == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
            quality: true
          - os: macOS
            runner: macos-latest
            quality: false
          - os: Windows
            runner: windows-latest
            quality: false
    steps:
      - name: Checkout tools test tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.detect-changes.outputs.checkout-repository }}
          ref: ${{ needs.detect-changes.outputs.checkout-ref }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            tools
            pyproject.toml
            .pre-commit-config.yaml
            .claude/docs/typo-watchlist.md
            .github/actions/setup-md-python/action.yml
            common
            events
            history
            localisation
            resources
            package.json
            bun.lock
            .jscpd.json
            .github/workflows/test-suite.yml
            .github/workflows/nightly-pr-validation.yml
            .github/workflows/pr-cache-cleanup.yml
            .github/workflows/validator-cache.yml
            .github/workflows/pr-housekeeping.yml
            .github/workflows/issue-triage.yml
          sparse-checkout-cone-mode: false

      - name: Set up Python and dependencies
        id: dependencies
        uses: ./.github/actions/setup-md-python
        with:
          analysis: ${{ matrix.quality }}

      - name: Verify pytest collection configuration
        id: collection
        if: always() && !cancelled() && steps.dependencies.outcome == 'success'
        run: >-
          python -m pytest tools/tests/collection_layout_test.py
          -o addopts= -q

      - name: Run unit tests with coverage
        id: unit
        if: >-
          always() && !cancelled() && matrix.quality == true &&
          steps.dependencies.outcome == 'success'
        run: >-
          python -m coverage run --branch -m pytest tools/tests
          -o addopts= -o 'python_files=*_test.py' -v

      - name: Report coverage
        id: coverage-report
        if: >-
          always() && !cancelled() && matrix.quality == true &&
          steps.dependencies.outcome == 'success'
        run: python -m coverage report

      - name: Run cross-platform unit tests
        id: cross-platform
        if: >-
          always() && !cancelled() && matrix.quality == false &&
          steps.dependencies.outcome == 'success'
        run: >-
          python -m pytest tools/tests -o addopts=
          -o 'python_files=*_test.py' -v

      - name: Run ruff
        id: ruff
        if: >-
          always() && !cancelled() && matrix.quality == true &&
          steps.dependencies.outcome == 'success'
        run: ruff check tools --output-format=github

      - name: Check formatting (black)
        id: black
        if: >-
          always() && !cancelled() && matrix.quality == true &&
          steps.dependencies.outcome == 'success'
        run: black --check tools

      - name: Run pylint
        id: pylint
        if: >-
          always() && !cancelled() && matrix.quality == true &&
          steps.dependencies.outcome == 'success'
        run: pylint tools --output-format=github --reports=no --score=no

      - name: Run mypy
        id: mypy
        if: >-
          always() && !cancelled() && matrix.quality == true &&
          steps.dependencies.outcome == 'success'
        run: mypy

      - name: Setup Bun
        id: bun
        if: >-
          always() && !cancelled() && matrix.quality == true &&
          steps.dependencies.outcome == 'success'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install duplication dependencies
        id: bun-deps
        if: >-
          always() && !cancelled() && matrix.quality == true &&
          steps.bun.outcome == 'success'
        run: bun install --frozen-lockfile

      - name: Run jscpd
        id: jscpd
        if: >-
          always() && !cancelled() && matrix.quality == true &&
          steps.bun-deps.outcome == 'success'
        run: bun run jscpd

      - name: Fetch merge revision for staged integration
        id: staged-fetch
        if: >-
          always() && !cancelled() && matrix.quality == true &&
          steps.dependencies.outcome == 'success'
        run: >-
          git fetch --no-tags
          "https://github.com/${{ github.repository }}.git"
          "${{ github.sha }}"

      - name: Create staged integration worktree
        id: staged-worktree
        if: >-
          always() && !cancelled() && matrix.quality == true &&
          steps.staged-fetch.outcome == 'success'
        run: |
          worktree="${{ runner.temp }}/md-staged-validator-test"
          git worktree add --detach "$worktree" "${{ github.sha }}"
          git -C "$worktree" sparse-checkout disable

      - name: Run staged-validator integration
        id: staged
        if: >-
          always() && !cancelled() && matrix.quality == true &&
          steps.staged-worktree.outcome == 'success'
        working-directory: ${{ runner.temp }}/md-staged-validator-test
        env:
          MD_RUN_STAGED_INTEGRATION: "1"
        run: >-
          python -m pytest tools/tests/staged_validators_test.py
          tools/tests/staged_validators_real_test.py -q

      - name: Run tools validation
        id: validate-tools
        if: >-
          always() && !cancelled() && matrix.quality == true &&
          steps.dependencies.outcome == 'success'
        run: >-
          python tools/validate_tools.py --strict --no-color --output
          tools_validation.log

      - name: Write tools suite sidecar
        id: suite-sidecar
        if: always() && !cancelled()
        shell: bash
        run: |
          failed=0
          for outcome in \
            "${{ steps.dependencies.outcome }}" \
            "${{ steps.collection.outcome }}" \
            "${{ steps.unit.outcome }}" \
            "${{ steps.coverage-report.outcome }}" \
            "${{ steps.cross-platform.outcome }}" \
            "${{ steps.ruff.outcome }}" \
            "${{ steps.black.outcome }}" \
            "${{ steps.pylint.outcome }}" \
            "${{ steps.mypy.outcome }}" \
            "${{ steps.bun.outcome }}" \
            "${{ steps.bun-deps.outcome }}" \
            "${{ steps.jscpd.outcome }}" \
            "${{ steps.staged-fetch.outcome }}" \
            "${{ steps.staged-worktree.outcome }}" \
            "${{ steps.staged.outcome }}" \
            "${{ steps.validate-tools.outcome }}"; do
            if [ "$outcome" = "failure" ]; then
              failed=$((failed + 1))
            fi
          done
          status=passed
          if [ "$failed" -gt 0 ]; then
            status=failed
          fi
          case "${{ matrix.os }}" in
            Linux) suite_name=tools-linux ;;
            macOS) suite_name=tools-macos ;;
            Windows) suite_name=tools-windows ;;
          esac
          {
            printf '{"suite":"tools","job":"Tools tests (%s)",' \
              "${{ matrix.os }}"
            printf '"name":"%s","title":"Tools tests (%s)",' \
              "$suite_name" "${{ matrix.os }}"
            printf '"status":"%s","errors":%d,"warnings":0,' \
              "$status" "$failed"
            printf '"issues":[]}\n'
          } > suite-run.json

      - name: Upload tools test results
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tools-tests-${{ matrix.os }}-results
          path: suite-run.json
          if-no-files-found: error
          retention-days: 7

  mod-tests:
    name: Mod tests (${{ matrix.batch }})
    needs: [detect-changes, prepare-workspace]
    if: >-
      needs.detect-changes.outputs.full_suite == 'true' ||
      needs.detect-changes.outputs.content == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        batch: [core, targeted-a, targeted-b]
    steps:
      - name: Download prepared workspace
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: prepared-workspace
          path: .

      - name: Set up Python
        id: setup-python
        uses: ./.github/actions/setup-md-python

      - name: Compute changed validator groups
        id: groups
        env:
          G_FULL_SUITE: ${{ needs.detect-changes.outputs.full_suite }}
          G_COMMON: ${{ needs.detect-changes.outputs.common }}
          G_EVENTS: ${{ needs.detect-changes.outputs.events }}
          G_HISTORY: ${{ needs.detect-changes.outputs.history }}
          G_LOCALISATION: ${{ needs.detect-changes.outputs.localisation }}
          G_INTERFACE: ${{ needs.detect-changes.outputs.interface }}
          G_MAP_ADJACENCY: ${{ needs.detect-changes.outputs.map-adjacency }}
          G_DECISIONS: ${{ needs.detect-changes.outputs.decisions }}
          G_OOB: ${{ needs.detect-changes.outputs.oob }}
          G_AI_STRATEGY: ${{ needs.detect-changes.outputs.ai-strategy }}
          G_AI_NAVY: ${{ needs.detect-changes.outputs.ai-navy }}
          G_AI_EQUIPMENT: ${{ needs.detect-changes.outputs.ai-equipment }}
          G_FACTIONS: ${{ needs.detect-changes.outputs.factions }}
          G_CHARACTERS: ${{ needs.detect-changes.outputs.characters }}
          G_SCIENTIST_TRAITS: >-
            ${{ needs.detect-changes.outputs.scientist-traits }}
          G_SCRIPTED_GUIS: ${{ needs.detect-changes.outputs.scripted-guis }}
          G_NATIONAL_FOCUS: ${{ needs.detect-changes.outputs.national-focus }}
          G_ON_ACTIONS: ${{ needs.detect-changes.outputs.on-actions }}
          G_SCRIPTED_EFFECTS: >-
            ${{ needs.detect-changes.outputs.scripted-effects }}
          G_MIOS: ${{ needs.detect-changes.outputs.mios }}
        run: |
          changed=()
          if [ "$G_FULL_SUITE" = "true" ]; then
            changed=(common events history localisation interface \
              map-adjacency decisions oob ai-strategy ai-navy ai-equipment \
              factions characters scientist-traits scripted-guis \
              national-focus on-actions scripted-effects mios)
          else
            for group in common events history localisation interface \
                map-adjacency decisions oob ai-strategy ai-navy ai-equipment \
                factions characters scientist-traits scripted-guis \
                national-focus on-actions scripted-effects mios; do
              var="G_${group^^}"
              var="${var//-/_}"
              if [ "${!var}" = "true" ]; then
                changed+=("$group")
              fi
            done
          fi
          printf 'groups=%s\n' "${changed[*]}" >> "$GITHUB_OUTPUT"

      - name: Run validator batch
        id: validator-batch
        if: always() && !cancelled() && steps.setup-python.outcome == 'success'
        run: >-
          python3 tools/validation/run_validator_batch.py
          --batch ${{ matrix.batch }}
          --changed-groups "${{ steps.groups.outputs.groups || '__none__' }}"
          --no-color --output-dir batch-results

      - name: Collect style-relevant files
        id: style-files
        if: >-
          always() && !cancelled() && matrix.batch == 'core' &&
          steps.setup-python.outcome == 'success'
        env:
          STYLE_FILES_JSON: ${{ needs.detect-changes.outputs.style_files }}
        run: |
          printf '%s' "$STYLE_FILES_JSON" | jq -r '.[]' \
            | grep -vE \
              '(^|/)(Changelog|AUTHORS)\.txt$|/descriptions[^/]*\.txt$' \
            > style_files.txt || true
          if [ -s style_files.txt ]; then
            echo "has-files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-files=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run style check
        if: >-
          always() && !cancelled() && matrix.batch == 'core' &&
          steps.style-files.outputs.has-files == 'true'
        run: |
          MD_STAGED_FILES="$(cat style_files.txt)" \
            python3 tools/validation/validate_style.py \
            --staged --strict --no-color --output validation-style-check.log

      - name: Run common-mistakes check
        if: >-
          always() && !cancelled() && matrix.batch == 'core' &&
          steps.style-files.outputs.has-files == 'true'
        run: |
          tr '\n' '\0' < style_files.txt | xargs -0 -r \
            python3 tools/linting/check_common_mistakes.py \
            --output validation-common-mistakes.log

      - name: Verify style results
        if: >-
          always() && !cancelled() && matrix.batch == 'core' &&
          steps.style-files.outputs.has-files == 'true'
        run: |
          test -f validation-style-check.log
          test -f validation-style-check.json
          test -f validation-common-mistakes.log
          test -f validation-common-mistakes.json

      - name: Check localisation UTF-8 BOM
        if: >-
          always() && !cancelled() && matrix.batch == 'core' &&
          steps.setup-python.outcome == 'success'
        run: python3 tools/linting/validate_localization_encoding.py

      - name: Check .mod file encoding
        if: >-
          always() && !cancelled() && matrix.batch == 'core' &&
          steps.setup-python.outcome == 'success'
        run: |
          find . -name '*.mod' -not -path './resources/*' -print0 \
            | xargs -0 -r python3 tools/linting/validate_mod_encoding.py

      - name: Check mod descriptor replace_path sync
        if: >-
          always() && !cancelled() && matrix.batch == 'core' &&
          steps.setup-python.outcome == 'success'
        run: >-
          python3 tools/validation/validate_mod_descriptors.py --strict
          --no-color

      - name: Upload style results
        if: >-
          always() && !cancelled() && matrix.batch == 'core' &&
          steps.style-files.outputs.has-files == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validation-style-check-results
          path: |
            validation-style-check.log
            validation-style-check.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload common-mistakes results
        if: >-
          always() && !cancelled() && matrix.batch == 'core' &&
          steps.style-files.outputs.has-files == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validation-common-mistakes-results
          path: |
            validation-common-mistakes.log
            validation-common-mistakes.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload batch results
        if: always() && !cancelled() && hashFiles('batch-results/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validation-batch-${{ matrix.batch }}-results
          path: batch-results
          if-no-files-found: error
          retention-days: 7

  report:
    name: Test suite report
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - validate-paths
      - prepare-workspace
      - tools-tests
      - mod-tests
    if: ${{ always() && !cancelled() }}
    permissions:
      contents: read
      pull-requests: write
      checks: write
    env:
      PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
      HEAD_SHA: >-
        ${{ needs.detect-changes.outputs.head-sha ||
        github.event.pull_request.head.sha || github.sha }}
      VALIDATION_SCOPE: >-
        ${{ (github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.full_suite == 'true') &&
        'full' || 'partial' }}
    steps:
      - name: Checkout report tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: >-
            ${{ needs.detect-changes.outputs.checkout-repository ||
            github.repository }}
          ref: ${{ needs.detect-changes.outputs.checkout-ref || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/actions/setup-md-python/action.yml
            tools/generate_validation_report.py
            tools/report_lib
            tools/validation
            tools/shared_utils.py
          sparse-checkout-cone-mode: false

      - name: Compute validator code hash
        id: toolshash
        run: >-
          echo "hash=${{ hashFiles('tools/validation/**',
          'tools/shared_utils.py') }}" >> "$GITHUB_OUTPUT"

      - name: Restore validation baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .validation_baseline
          key: >-
            md-baseline-v1-${{ runner.os }}-${{
            steps.toolshash.outputs.hash }}-${{
            needs.detect-changes.outputs.base-sha || github.sha }}
          restore-keys: |
            md-baseline-v1-${{ runner.os }}-${{ steps.toolshash.outputs.hash }}-

      - name: Set up Python
        id: setup-python
        uses: ./.github/actions/setup-md-python
        with:
          # The report tooling is stdlib-only and the sparse checkout has no
          # pyproject.toml, so there is nothing to install or cache.
          install: "false"

      - name: Download all validation results
        id: download-results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          pattern: "*results"
          path: validation-results

      - name: Record failed validation jobs
        if: >-
          steps.download-results.outcome == 'failure' ||
          needs.detect-changes.result == 'failure' ||
          needs.validate-paths.result == 'failure' ||
          needs.prepare-workspace.result == 'failure' ||
          needs.tools-tests.result == 'failure' ||
          needs.mod-tests.result == 'failure'
        run: |
          pipeline_dir="validation-results/validation-pipeline-results"
          mkdir -p "$pipeline_dir"
          printf '%s\n' \
            '[{"severity":"error","category":"pipeline-job-failed",' \
            '"message":"Validation jobs failed. Review the workflow run."}]' \
            > "$pipeline_dir/validation-pipeline.json"

      - name: Generate and post validation report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TOOLSHASH: ${{ steps.toolshash.outputs.hash }}
        run: |
          workflow_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          workflow_url="$workflow_url/actions/runs/$GITHUB_RUN_ID"
          args=(
            --results-dir validation-results
            --output report.md
            --pr-number "$PR_NUMBER"
            --commit-sha "$HEAD_SHA"
            --workflow-run-url "$workflow_url"
            --github-repository "${{ github.repository }}"
            --validation-scope "$VALIDATION_SCOPE"
            --checks-api
            --print
          )
          args+=(
            --baseline-dir .validation_baseline
            --baseline-toolshash "$TOOLSHASH"
          )
          if [ -n "$PR_NUMBER" ]; then
            args+=(--post-comment)
          fi
          python3 tools/generate_validation_report.py "${args[@]}"

      - name: Upload combined report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: validation-report
          path: report.md
          retention-days: 30
