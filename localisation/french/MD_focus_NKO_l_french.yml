 korea.39.d: ""
 korea.39.a: ""
 korea.40.t: "Les rebelles se sont soulevés"
 korea.40.d: "Le Sud s'est soulevé pour répondre à notre appel, nous devons les soutenir et reprendre le territoire."
 korea.40.a: "À LA GUERRE !"
