 UKR_foreign_finances_category: "Foreign Finances and Influence"
 UKR_foreign_finances_category_desc: "Independent Ukraine inherited a ruined economy, and much of the money that keeps the state running has to come from abroad. Here we can sell off state assets, ask our creditors to restructure our debts, or turn to the §7West§! or the §tEast§! for loans. We can also promote [SOV.GetFlag] §YRussian§! or [USA.GetFlag] §YWestern§! interests among our people.\n\nNo loan comes without strings. Every creditor gains §Yinfluence§! over our policy, and the balance of foreign influence decides which bloc wins the next §YVerkhovna Rada§! elections."
