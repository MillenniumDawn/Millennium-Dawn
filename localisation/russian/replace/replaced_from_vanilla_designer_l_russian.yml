 DESIGNER_BLOCKED_BY_REGIMENT_BATTALIONS: "§R- Требуется не менее §!§H$NUM_BATTALIONS|H$ линейных рот§!§R в батальоне.§!"
 DESIGNER_REGIMENT_SUPPORT_STATS_SCALED: "Характеристики, снаряжение и живая сила масштабируются до $FACTOR|H%0$, так как в батальоне $BATTALIONS|H$/$MAX_BATTALIONS|H$ рот."
 DESIGNER_MAIN_COLUMN_TITLE: "Линейные роты — это ваши войска на передовой.\n\nКаждый столбец — батальон определённого базового типа: §Yбронетехника§!, §Yпехота§! или §Yмоторизованные войска§!. Верхний тип определяет, что ещё можно поставить в этот столбец батальона. Чем больше линейных рот, тем больше §Yширина фронта§! и тем меньше таких бригад поместится в один бой."
 EQUIPMENT_DESIGNER_SELECT_ROLE_DESC: "§HРоль§! определяет, какие §Hроты§! и §Hвзводы поддержки§! снабжаются снаряжением этого проекта."
 DESIGNER_SELECT_NICHE_DISABLED: "В бригаде нет бронетанковых сил"
