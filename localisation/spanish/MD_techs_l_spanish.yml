 NAVAL_TITLE_DRONE_TORPEDO_DESC: ""
 NAVAL_TITLE_NUCLEAR_TORPEDO: "TORPEDOS NUCLEARES"
 NAVAL_TITLE_NUCLEAR_TORPEDO_DESC: ""
 NAVAL_TITLE_ANTI_TORPEDOES: "ANTI-TORPEDO TORPEDOES"
 NAVAL_TITLE_ANTI_TORPEDOES_DESC: ""
 TITLE_MICROCHIP_SUBTITLE: "MICROCHIPS"
 CIVILIAN_TITLE_COMPOSITES: "PRODUCCIÓN DE COMPUESTOS"
 CIVILIAN_TITLE_COMPOSITES_DESC: "Improving our Composite production will allow us to build a higher-quality and high-tech army"
 afs_drone_1: "Dron autónomo de apoyo de fuego"
 afs_drone_1_desc: "Los drones autónomos de apoyo de fuego utilizan navegación asistida por IA, asignación de objetivos y combate supervisado por un operador para acompañar a las unidades terrestres regulares, proporcionando reconocimiento móvil y apoyo de fuego de precisión durante las operaciones ofensivas."
 special_forces_tech_2: "Armas de defensa personal (PDW)"
 special_forces_tech_2_desc: "Las PDW son ampliamente utilizadas por nuestras fuerzas especiales para permitir un tiempo de reacción más rápido en entornos de combate cerrado (CQC), siendo además un equipamiento de dotación especial para estas unidades."
 special_forces_tech_3: "Fuerzas especiales modernas"
 special_forces_tech_3_desc: "El entrenamiento adicional permite a nuestras fuerzas especiales obtener una ventaja estratégica frente a nuestros oponentes."
 special_forces_tech_4: "Armas designadas para fuerzas especiales"
 special_forces_tech_4_desc: "Designar armas específicas para las fuerzas especiales permite desplegar plataformas concretas que satisfagan las necesidades exactas de nuestras unidades de élite."
 special_forces_tech_5: "Fuerzas especiales ciber"
 special_forces_tech_5_desc: "Iniciar el entrenamiento cibernético para nuestras fuerzas especiales les permitirá obtener una mayor inteligencia e información contra nuestros oponentes."
 special_forces_tech_6: "Fuerzas especiales del futuro"
 special_forces_tech_6_desc: "Las fuerzas especiales del futuro integran operaciones cibernéticas, drones compactos, sensores avanzados y comunicaciones seguras en las tácticas de pequeñas unidades, lo que permite a los equipos de élite operar con mejor inteligencia, coordinación y supervivencia en entornos disputados."
 body_armor_1: "Chaleco de Kevlar"
 body_armor_1_desc: "The first modern body armours before the famous Kevlar vests were mainly made of nylon. Kevlar was first introduced in 1975, and the first vests were adopted by the US Army in the 1980s.\n\nThe first vests offered protection only to the upper torso, and they only protected from shrapnel and pistol rounds."
 body_armor_2: "Chaleco reforzado con placas"
 body_armor_2_desc: "A pesar de que las cerámicas se han utilizado en la protección personal desde hace mucho tiempo, las primeras placas balísticas modernas se introdujeron a finales de los 90 y principios de los 2000. El uso de placas balísticas en estos nuevos chalecos proporcionaría protección contra proyectiles de fusil, y la protección contra metralla del propio chaleco se extendería a las zonas de la ingle y el cuello, y no solo al torso superior."
 body_armor_3: "Chaleco táctico mejorado"
 body_armor_3_desc: "While offering great protection, plate reinforced vests can be cumbersome to the user. This led several body armour manufacturers to look for lighter and more tactical designs. While also providing protection, body armour shouldn't limit a soldier's ability to operate on the field. Modern body armours offer integrated solutions where the tactical vests allow personal customisation by the user, making the same vest usable in almost every situation. The protective capabilities are also improved, as modern body armour is capable of even stopping armour piercing bullets."
 body_armor_4: "Traje táctico de asalto"
 body_armor_4_desc: "It's no longer necessary to just protect soldiers from bullets and shrapnel. The armour soldiers are wearing also has to provide environmental protection. In addition, instead of using heavy ceramic plates, the protective technology should take advantage of the hardening properties of non-Newtonian fluids."
 camouflage_1: "Camuflaje temprano"
 camouflage_2: "Camuflaje multiescala"
 camouflage_2_desc: "El camuflaje multiescala mejora al camuflaje básico al aplicar una gama de escalas a los patrones de color del uniforme. Esto mezcla áreas coloreadas más pequeñas sobre un color de fondo en un patrón de tipo fractal. Esto imita los esquemas de color de la naturaleza, haciendo que el camuflaje sea más efectivo en múltiples entornos y a distancias variables."
 camouflage_3: "Camuflaje digital"
 camouflage_3_desc: "El camuflaje digital es una mejora respecto al camuflaje multiescala, ya que el patrón creado es calculado por computadoras. Aunque el camuflaje digital a menudo se utiliza específicamente para referirse a una forma de patrón pixelado, el camuflaje digital no equivale necesariamente a que el patrón deba estar compuesto por cuadrados."
 camouflage_4: "Camuflaje multiespectral personal"
 camouflage_4_desc: "Multispectral camouflage refers to camouflage techniques that are used to hide objects from infrared or radar based detection. For the individual soldier this has mainly been available in the form of ghillie suits, which are impractical in most combat situations. With modern materials, effective infrared shielding coatings and materials can be applied to the battledress of every soldier."
 camouflage_5: "Camuflaje adaptativo de firma"
 camouflage_5_desc: "El camuflaje adaptativo de firma utiliza tejidos avanzados, revestimientos y cubiertas modulares para reducir las firmas visuales, infrarrojas y térmicas en soldados, armas, vehículos y equipos transportados bajo condiciones cambiantes en el campo de batalla."
 tech_diesel_power_systems_1: "Motores diésel"
 tech_diesel_power_systems_1_desc: "Los motores diésel navales proporcionan una propulsión fiable y eficiente en el consumo de combustible para buques de patrulla, auxiliares, submarinos y combatientes menores, ofreciendo una gran autonomía y un mantenimiento más sencillo en comparación con los sistemas de vapor o de turbina."
 tech_diesel_power_systems_2: "Motores diésel modernos"
 tech_diesel_power_systems_2_desc: "Los motores diésel navales modernos utilizan turbocompresión mejorada, controles electrónicos y una inyección de combustible más precisa para aumentar la potencia, reducir el consumo de combustible y optimizar la fiabilidad durante despliegues prolongados."
 tech_diesel_power_systems_3: "Motores diésel avanzados"
 tech_diesel_power_systems_3_desc: "Los sistemas avanzados de energía diésel integran inyección por conducto común (common-rail), monitorización digital y opciones de transmisión diésel-eléctrica, lo que permite a los buques operar de forma más silenciosa, eficiente y flexible a diferentes velocidades."
 tech_diesel_power_systems_4: "Motores diésel futuristas"
 tech_diesel_power_systems_4_desc: "Los motores diésel futuristas combinan propulsión híbrida-eléctrica, almacenamiento de energía y gestión inteligente de la potencia, reduciendo el uso de combustible al tiempo que soportan las crecientes demandas eléctricas de los sensores, armas y sistemas a bordo."
 tech_power_systems_4: "Motores de turbina de chorro modernos"
 tech_power_systems_4_desc: "Los sistemas modernos de turbinas navales integran controles digitales, materiales mejorados y gestión de energía híbrida-eléctrica, ofreciendo un sólido rendimiento de aceleración rápida (sprint) al tiempo que soportan las crecientes demandas eléctricas de radares, sensores y sistemas de combate."
 tech_nuclear_power_systems_4: "Reactores nucleares de superficie futuristas"
 tech_nuclear_power_systems_4_desc: "Los reactores nucleares de superficie futuristas utilizan núcleos de mayor vida útil, automatización mejorada y controles de reactor más seguros para proporcionar a los buques de guerra una propulsión sostenida y grandes reservas eléctricas para sensores, armas y sistemas del navío."
 tech_fire_control_4: "Control de radar de misiles aumentado del futuro"
 tech_fire_control_4_desc: "El control de radar de misiles aumentado del futuro utiliza sistemas de información de combate asistidos por IA para mejorar la detección, el rastreo y la coordinación del combate contra amenazas de misiles subsónicos, supersónicos e hipersónicos."
 tech_combat_radar_6: "Radar VII"
 tech_combat_radar_6_desc: "Las matrices de radar de próxima generación utilizan emisores de alta potencia, detección multibanda y protección electrónica integrada para mejorar el rendimiento contra aeronaves más sigilosas, armas hipersónicas y ataques de saturación."
 tech_radar_jammer_1: "Inhibición de radar I"
 tech_radar_jammer_1_desc: "Los inhibidores electrónicos básicos saturan el radar enemigo inundando los receptores con ruido y falsos ecos. Incluso los sistemas limitados pueden degradar la calidad del rastreo y complicar la interceptación, ganando segundos críticos en un combate."
 tech_radar_jammer_2: "Inhibición de radar II"
 tech_radar_jammer_2_desc: "Una gestión de energía mejorada y un modelado de señales más inteligente permiten una inhibición más efectiva contra los radares modernos de búsqueda y control de tiro. El objetivo no es la invisibilidad, sino la incertidumbre, forzando al enemigo a trabajar más duro para lograr cada fijación de objetivo."
 tech_radar_jammer_3: "Inhibición de radar III"
 tech_radar_jammer_3_desc: "Las técnicas digitales permiten una inhibición engañosa que manipula lo que el radar cree ver, creando objetivos fantasma y alterando alcances, rumbos y marcaciones. Combinados con mejores bibliotecas de amenazas, estos sistemas pueden adaptarse rápidamente a nuevas formas de onda y contramedidas."
 tech_radar_jammer_4: "Inhibición de radar IV"
 tech_radar_jammer_4_desc: "Las suites de ataque electrónico de próxima generación integran sensores en red, análisis en tiempo real y transmisores ágiles para disputar el espectro a gran escala. Pueden suprimir, engañar y abrumar múltiples radares al tiempo que sobreviven a una guerra electrónica pesada y a cambios rápidos de frecuencia."
 tech_combat_sonar_6: "Sonar VII"
 tech_combat_sonar_6_desc: "Las redes de sonar de próxima generación combinan matrices a bordo, vehículos submarinos no tripulados, sensores en el fondo marino y datos acústicos externos para extender la detección antisubmarina más allá del alcance de los sensores de un solo buque."
 tech_naval_recon_drones_1: "Drones de reconocimiento naval I"
 tech_naval_recon_drones_1_desc: "Los drones de reconocimiento lanzados desde buques extienden los ojos de la flota más allá del horizonte, proporcionando una búsqueda de superficie en tiempo real y una localización básica de objetivos. Incluso las plataformas pequeñas pueden rastrear contactos, mapear aproximaciones y reducir el riesgo de sorpresa en aguas disputadas."
 tech_naval_recon_drones_2: "Drones de reconocimiento naval II"
 tech_naval_recon_drones_2_desc: "Los sensores y enlaces de datos mejorados convierten a los drones navales en exploradores persistentes, ofreciendo a los comandantes una imagen marítima más clara con una identificación y rastreo más rápidos. Una mayor autonomía y estabilización los hacen fiables en condiciones climáticas adversas y ciclos de patrulla prolongados."
 tech_naval_recon_drones_3: "Drones de reconocimiento naval III"
 tech_naval_recon_drones_3_desc: "Los drones marítimos en red pueden coordinar patrones de búsqueda, asignar objetivos para armas a bordo y transferir datos de puntería a toda la fuerza de tarea. Con soporte electrónico y procesamiento de señales mejorados, ayudan a exponer amenazas que de otro modo permanecerían ocultas entre las interferencias y las emisiones."
 tech_naval_recon_drones_4: "Drones de reconocimiento naval IV"
 tech_naval_recon_drones_4_desc: "Los drones de reconocimiento naval avanzados proporcionan una vigilancia persistente de áreas extensas, asignación de objetivos y soporte de retransmisión de sensores para misiones de ataque e interceptación. Las comunicaciones blindadas y la navegación autónoma les permiten operar bajo interferencias, enlaces degradados y una guerra electrónica pesada."
 tech_rail_guns_4: "Cañones de riel 2045"
 tech_rail_guns_4_desc: "Los cañones de riel avanzados utilizan proyectiles guiados de hipervelocidad, enlaces de control de tiro de precisión y componentes de lanzamiento más resistentes para atacar buques, aviones, misiles y objetivos terrestres con mayor precisión y capacidad de fuego sostenido."
 tech_rail_battery_1: "Batería de cañones de riel I"
 tech_rail_battery_1_desc: "En lugar de montar un solo cañón de riel, una batería agrupa múltiples tubos en un sistema unificado de control de tiro, emulando la lógica de la doctrina de las torretas de los acorazados. Las salvas coordinadas ofrecen una mayor potencia de impacto, una dispersión más cerrada y un fuego de seguimiento más rápido, a costa de una mayor demanda de energía y complejidad de integración."
 tech_rail_battery_2: "Batería de cañones de riel II"
 tech_rail_battery_2_desc: "Las baterías de cañones de riel de segunda generación perfeccionan la vida útil del tubo, la gestión térmica y la automatización de los pañoles de munición, lo que permite un fuego de salva sostenido a alta cadencia sin sufrir un desgaste crítico. Con una distribución de energía más inteligente y puntería avanzada, estos montajes triples de riel pueden dominar los enfrentamientos de superficie y proporcionar un apoyo de fuego de precisión a larga distancia mucho más allá de la artillería naval convencional."
 tech_point_defense_chain_gun: "Sistemas de defensa de punto"
 tech_point_defense_chain_gun_desc: "Los sistemas de defensa de punto se pueden describir a grandes rasgos como cualquier elemento diseñado para disparar contra los misiles entrantes."
 tech_anti_drone_laser_1: "Láseres de defensa de punto para buques I"
 tech_anti_drone_laser_1_desc: "Los primeros láseres a bordo de buques proporcionan una defensa con reservas de munición ilimitadas contra drones y proyectiles entrantes al perforar sensores, superficies de control y ojivas a la velocidad de la luz. Reducen la dependencia de los misiles interceptores y de los cañones de defensa próxima, pero requieren una energía estable y un rastreo preciso para ser efectivos en condiciones de mal tiempo y fuerte oleaje."
 tech_anti_drone_laser_2: "Láseres de defensa de punto para buques II"
 tech_anti_drone_laser_2_desc: "La calidad mejorada del haz, la gestión térmica y el control de tiro integrado permiten combates sostenidos contra amenazas más rápidas y pequeñas, incluidos enjambres de drones de saturación y misiles rozadores de mar. Con un mejor almacenamiento intermedio de energía y la asignación automatizada de objetivos desde los sensores del buque, los láseres se convierten en una capa fiable dentro del esquema de defensa de punto en lugar de ser un complemento experimental."
 tech_turret_missiles_surface_6: "Misiles antibuque 2045"
 tech_turret_missiles_surface_6_desc: "Los sistemas de misiles antibuque hiperavanzados coordinan ataques de salva, comparten actualizaciones de objetivos y ajustan los perfiles de aproximación en pleno vuelo, optimizando tanto los misiles de ataque de superficie como las armas antisubmarinas a distancia segura (standoff)."
 tech_turret_missiles_drone_1: "Módulos navales de enjambre I"
 tech_turret_missiles_drone_1_desc: "Los módulos de enjambre reemplazan los misiles tradicionales con celdas de lanzamiento optimizadas para drones de ataque de ida (kamikaze). En lugar de un solo proyectil costoso, un buque puede inundar un área defendida con múltiples amenazas pequeñas, forzando a los sensores e interceptores enemigos a elegir qué detener."
 tech_turret_missiles_drone_2: "Módulos navales de enjambre II"
 tech_turret_missiles_drone_2_desc: "Los enlaces de datos y la guía a bordo mejorados permiten a las salvas de drones coordinar su aproximación, dividirse en múltiples ejes y reasignar objetivos en pleno vuelo a medida que cambia la situación. Esto convierte cada lanzamiento en un problema de toma de decisiones para el defensor, donde la certeza es escasa y el tiempo de reacción es corto."
 tech_turret_missiles_drone_3: "Módulos navales de enjambre III"
 tech_turret_missiles_drone_3_desc: "El control avanzado de enjambres permite ataques masivos y semiautónomos diseñados para abrumar la defensa aérea por capas, inhibir el rastreo y explotar brechas con una eficiencia implacable. Con cargas útiles modulares y una navegación más inteligente, los drones suicidas se convierten en una opción de ataque naval flexible que cambia la potencia de un solo disparo por una saturación incesante."
 tech_turret_missiles_aa_6: "Misiles de cuerpo giratorio 2045"
 tech_turret_missiles_aa_6_desc: "Los sistemas RAM hiperavanzados utilizan buscadores multimodo, asignación de objetivos cooperativa y una gestión rápida de salvas para interceptar drones, aviones, misiles de de crucero y ataques de saturación."
 tech_vls_surface_6: "Misiles VLS de ataque a superficie 2045"
 tech_vls_surface_6_desc: "Los misiles VLS de ataque a superficie hiperavanzados utilizan rutas cooperativas, actualizaciones de objetivos en red y buscadores multimodo para coordinar ataques masivos contra zonas costeras defendidas e infraestructura militar dispersa."
 tech_vls_aa_6: "Misiles VLS superficie-aire 2045"
 tech_vls_aa_6_desc: "Los misiles VLS superficie-aire hiperavanzados utilizan fusión de sensores en red, guía resistente a contramedidas y una rápida coordinación de salvas para defender a las flotas contra incursiones masivas de misiles, enjambres de drones y armas hipersónicas."
 tech_torpedoes_6: "Torpedo de 2045"
 tech_torpedoes_6_desc: "Los torpedos hiperavanzados utilizan datos de puntería en red, propulsión de bajo ruido y patrones de búsqueda autónomos para coordinarse con submarinos, aviones, buques de superficie y plataformas no tripuladas durante las operaciones antisubmarinas."
 tech_drone_torpedoes_1: "Torpedos dron II"
 tech_drone_torpedoes_1_desc: "Los primeros torpedos dron añaden guiado y una autonomía limitada a las armas submarinas tradicionales, mejorando la adquisición de objetivos y reduciendo los disparos fallidos. Con mejores sensores y corrección de curso, pueden rastrear buques y submarinos evasivos con mayor fiabilidad en aguas litorales saturadas."
 tech_drone_torpedoes_2: "Torpedos dron III"
 tech_drone_torpedoes_2_desc: "Un procesamiento de sonar optimizado y enlaces de datos seguros permiten a los torpedos dron actualizar sus objetivos a mitad de camino y adaptarse a las contramedidas. Su propulsión y gestión de energía mejoradas incrementan el alcance y la autonomía, ampliando el rango de combate sin sacrificar la velocidad terminal."
 tech_drone_torpedoes_3: "Torpedos dron IV"
 tech_drone_torpedoes_3_desc: "La autonomía avanzada convierte a los torpedos dron en cazadores submarinos coordinados, capaces de realizar búsquedas cooperativas, aplicar una lógica de reataque más inteligente y resistir a los señuelos. Con un guiado perfeccionado por estela y buscadores multimodo, pueden penetrar las defensas modernas y mantener la presión hasta acabar con el objetivo."
 tech_anti_torpedoes_1: "Defensa antitorpedos I"
 tech_anti_torpedoes_1_desc: "Las primeras defensas antitorpedos combinan una alerta de sonar mejorada con contramedidas básicas para reducir la probabilidad de recibir un impacto limpio. Una mejor detección y una reacción más rápida ganan tiempo para realizar maniobras evasivas, desplegar señuelos y establecer pantallas defensivas."
 tech_anti_torpedoes_2: "Defensa antitorpedos II"
 tech_anti_torpedoes_2_desc: "Los sistemas mejorados de alerta de torpedos integran sensores, pantallas tácticas y una lógica de respuesta automatizada para acortar la cadena de destrucción contra las amenazas entrantes. Señuelos más efectivos y una doctrina optimizada de manejo del buque aumentan la supervivencia tanto en entornos de alta mar como litorales."
 tech_anti_torpedoes_3: "Defensa antitorpedos III"
 tech_anti_torpedoes_3_desc: "Las suites avanzadas antitorpedos combinan un rastreo de alta fidelidad con contramedidas activas, incluidos interceptores de destrucción directa (hard-kill) diseñados para destruir los torpedos antes del impacto. Los sensores en red y los sistemas defensivos de tiro rápido hacen que los ataques submarinos sean mucho menos decisivos, forzando a los submarinos a emplear más armas para obtener menos resultados."
 tech_nuclear_torpedoes_1: "Torpedos nucleares II"
 tech_nuclear_torpedoes_1_desc: "Integrar ojivas nucleares en torpedos pesados convierte la guerra submarina en una herramienta de disuasión catastrófica. Incluso la mera posibilidad de un ataque de este tipo obliga a las flotas enemigas a dispersarse, replantearse los puntos de paso obligados y tratar los informes de contacto con submarinos como alarmas existenciales. Es un arma destinada a poner fin a los combates amenazando con acabar con los límites."
 tech_nuclear_torpedoes_2: "Torpedos nucleares III"
 tech_nuclear_torpedoes_2_desc: "Salvaguardas de mando mejoradas y una doctrina de despliegue más fiable convierten a los torpedos nucleares en una opción creíble, aunque aterradora, de contraataque (second strike) en el mar. Su presencia reconfigura la planificación naval al elevar el coste de las formaciones masivas y las zonas de reunión costeras. Cada enfrentamiento queda ensombrecido por el riesgo de escalada."
 tech_nuclear_torpedoes_3: "Torpedos nucleares IV"
 tech_nuclear_torpedoes_3_desc: "Los conceptos avanzados de torpedos nucleares buscan hacer que la amenaza sea sobrevivible, controlable y políticamente utilizable sin reducir su horror. Con una integración más estrecha en el mando estratégico y reglas de autorización más claras, el arma se convierte en un pilar formal de la disuasión marítima. Una vez desplegada, obliga a los oponentes a negociar desde el miedo, no desde la confianza."
 tech_landing_craft_1: "Embarcación de desembarco"
 tech_landing_craft_1_desc: "Una embarcación de desembarco es un buque pequeño que transporta tropas desde alta mar hasta la costa para realizar operaciones anfibias."
 tech_landing_craft_2: "Buque de asalto anfibio"
 tech_landing_craft_2_desc: "Un buque de asalto anfibio es un barco de guerra utilizado para proporcionar apoyo aéreo y de superficie detrás de las líneas del frente cuando se realizan operaciones anfibias en zonas costeras enemigas."
 tech_landing_craft_3: "Embarcación de desembarco por colchón de aire"
 tech_landing_craft_3_desc: "En las operaciones anfibias, las embarcaciones de desembarco tradicionales de tipo barco solo pueden desembarcar en aproximadamente el 15% de las líneas costeras del mundo, mientras que los aerodeslizadores desarrollados a partir de la década de 1960 pueden alcanzar el 70%. Por lo tanto, su adaptabilidad ha mejorado enormemente. Al mismo tiempo, su velocidad es mayor que la de las embarcaciones tradicionales y pueden transportar tanques principales de batalla para cubrir a los marines en tierra. El aerodeslizador ha cambiado por completo las reglas del juego de los desembarcos anfibios."
 tech_landing_craft_4: "Embarcación de desembarco moderna"
 tech_landing_craft_4_desc: "La introducción de la tecnología moderna ha permitido avances significativos en el rendimiento de las embarcaciones de desembarco, mejorando enormemente la eficiencia de los desembarcos anfibios."
 tech_landing_craft_5: "Equipo de protección especializado"
 tech_landing_craft_5_desc: "El equipo de protección especial puede mejorar en gran medida la supervivencia de las embarcaciones de desembarco."
 tech_landing_craft_6: "Sistemas de IA para embarcaciones de desembarco"
 tech_landing_craft_6_desc: "La introducción de la inteligencia artificial permite a las embarcaciones de desembarco responder de manera oportuna y correcta ante emergencias."
 tech_landing_craft_7: "Embarcación de desembarco inteligente"
 tech_landing_craft_7_desc: "La embarcación de desembarco inteligente es la aplicación de la tecnología del futuro en las operaciones anfibias."
 tech_submarine_engineering_5: "Motor de submarino futurista"
 tech_submarine_engineering_5_desc: "La introducción de nuevas tecnologías puede permitir a los submarinos operar bajo el agua a mayores distancias, velocidades más altas y con un nivel de ruido menor."
 patrol_boat_hull_1_tech: "Patrullero de 1985"
 patrol_boat_hull_1_tech_desc: "Patrol boats are light vessels that are intended for coastal coverage. They are smaller than their counterpart the Corvette and are also capable of riverine operations."
 patrol_boat_hull_2_tech: "Patrullero de 2005"
 patrol_boat_hull_2_tech_desc: "Patrol boats are light vessels that are intended for coastal coverage. They are smaller than their counterpart the Corvette and are also capable of riverine operations."
 patrol_boat_hull_3_tech: "Patrullero de 2030"
 patrol_boat_hull_3_tech_desc: "Patrol boats are light vessels that are intended for coastal coverage. They are smaller than their counterpart the Corvette and are also capable of riverine operations."
