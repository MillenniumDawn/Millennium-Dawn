 ENG_scottish_referendum_pressure: "Appels à un référendum écossais"
 ENG_scottish_referendum_pressure_desc: "Le Parlement écossais a une majorité pro-indépendance et le dossier de l'Union n'est plus plaidé nulle part où le public l'entend. Un projet de référendum se rédige à Holyrood. Westminster a un an pour faire paraître la question constitutionnelle moins urgente que la facture d'électricité, soit en achetant la bienveillance en Écosse, soit en rendant les finances écossaises visiblement tributaires du Trésor. Si la pression reste au-dessus de 60 à maturité de la campagne, la demande devient formelle et nous devrons y répondre."
 ENG_scottish_pressure_defused_tt: "La pression indépendantiste écossaise est inférieure à §G50§!"
 ENG_north_irish_referendum_pressure: "Appels à un sondage frontalier"
 ENG_north_irish_referendum_pressure_desc: "Les partis nationalistes tiennent la balance à Stormont et pressent le secrétaire d'État de fixer une date pour un sondage frontalier. Tension confessionnelle et capacité de la Province à s'autofinancer sont sur la table, et la République observe. Westminster a un an pour faire baisser les chiffres avant que la demande ne devienne formelle."
 ENG_north_irish_pressure_defused_tt: "La pression indépendantiste nord-irlandaise est inférieure à §G50§!"
 ENG_welsh_referendum_pressure: "Appels à un référendum gallois"
 ENG_welsh_referendum_pressure_desc: "Une majorité pro-indépendance au Senedd prépare son propre projet de référendum. L'indépendance galloise fut longtemps traitée à Londres comme peu sérieuse précisément parce que les comptes ne tenaient pas ; cet argument ne tient que tant que les comptes restent les nôtres à faire. Nous avons un an pour ramener la pression avant que la demande ne devienne formelle."
 ENG_welsh_pressure_defused_tt: "La pression indépendantiste galloise est inférieure à §G50§!"
