 norway.300.t: "한 지붕 아래 두 사업"
 norway.300.d: "콩스베르그 그루펜은 육군과 해군에 원격 무장 시스템을 판매하고 해상 플랜트 선단에는 항법 및 동적 위치 제어 장치를 판매하는데, 이 두 부문은 기술자와 소프트웨어, 재무제표를 공유합니다. 두 부문을 분리하면 서로를 이해하지 못하는 시장에서 각각 제대로 평가받을 수 있습니다. 반대로 함께 유지하면 이 규모의 노르웨이 기업이 어려운 시기에도 어느 쪽이든 자금을 댈 수 있습니다."
 norway.300.a: "방위 부문과 해양 부문을 함께 유지한다"
 norway.300.b: "그룹을 분할하여 각자 독립하게 한다"
 norway.301.t: "우리만의 미사일"
 norway.301.d: "해군 타격 미사일(NSM)이 양산 준비를 마쳤으며, 콩스베르그는 이 미사일이 피오르 위를 낮게 날아 복잡한 해안선 속에서 함선을 찾아내도록 설계했는데, 이는 노르웨이가 실제로 안고 있는 문제입니다. 생산 라인에 자금을 대려면 이 정도 규모의 나라가 소량만 구매할 무기에 개발 단가를 지불해야 합니다. 대안은 하푼 미사일로, 당장 구할 수 있지만 다른 나라의 바다를 위해 설계된 무기입니다."
 norway.301.a: "해군 타격 미사일 생산 라인에 자금을 투입한다"
 norway.301.b: "검증된 대함 미사일을 해외에서 구매한다"
 norway.302.t: "F-35의 대가"
 norway.302.d: "노르웨이는 그리펜 대신 F-35를 선택했으며, 여기에 붙은 산업적 조건은 콩스베르그의 합동 타격 미사일(JSM)을 F-35에 통합해야 한다는 것입니다. 이는 동맹의 절반이 도입하는 항공기에 노르웨이 무기가 탑재된다는 뜻입니다. 동시에 다른 나라의 일정에 맞춘 수년간의 통합 작업이 필요하며, 그 비용은 자국 역사상 가장 값비싼 조달 사업을 막 확정한 나라가 부담해야 합니다."
 norway.302.a: "JSM의 F-35 통합을 밀어붙인다"
 norway.302.b: "미사일을 노르웨이 플랫폼에 한정한다"
 norway.303.t: "해양 플랜트의 겨울"
 norway.303.d: "유가가 폭락하면서 콩스베르그 마리타임의 고객들이 발주를 중단했습니다. 신규 시추 설비도, 신규 해상 지원선도 없으니 장비를 달 이유도 없습니다. 그룹을 떠받치는 것은 방위 부문입니다. 해양 부문을 불황 내내 끌고 가려면 수주 잔고도 없이 수년간 비용이 들어갑니다. 방위 사업으로 축소하는 것이 수익성 있는 결정이겠지만, 이는 무기와 무관한 회사의 절반을 끝내는 일이 될 것입니다."
 norway.303.a: "해양 사업을 불황 내내 유지한다"
 norway.303.b: "방위 사업으로 축소한다"
 norway.304.t: "롤스로이스의 선단 인수"
 norway.304.d: "롤스로이스가 상선 부문(Commercial Marine)을 매각하고 있으며, 이를 인수하면 추진 장치, 갑판 기계, 선박 설계, 수천 척의 선체에 설치된 기반까지 더해져 콩스베르그 마리타임의 규모가 하룻밤 사이에 대략 두 배가 됩니다. 이는 콩스베르그가 써 본 가장 큰 수표이며, 그 대상은 간신히 5년 동안 없이 살아남는 법을 익힌 사업입니다."
 norway.304.a: "상선 부문을 인수하여 규모를 확보한다"
 norway.304.b: "규모를 키우지 않고 재무 건전성을 유지한다"
 norway.305.t: "콩스베르그가 된 모습"
 norway.305.d: "사반세기에 걸친 원격 포탑, 노르웨이 해역을 위해 만든 미사일, F-35를 둘러싼 통합 분쟁, 그리고 매우 대규모의 해양 부문 인수를 거치며 콩스베르그의 정체성이 정해졌습니다. 노르웨이가 동맹에 타격 무기를 파는지, 세계 해운에 시스템을 파는지, 아니면 둘 다인지가 결정된 것입니다."
 norway.305.a: "동맹이 의존하는 타격 및 해양 그룹"
 norway.305.b: "동맹 안의 미사일 전문 기업"
 norway.305.c: "해양 시스템 선도 기업"
 norway.305.e: "대형 사업의 틈새 납품업체"
 NRY_kongsberg_strike_and_sea_group: "타격 및 해양 그룹"
 NRY_kongsberg_strike_and_sea_group_desc: "콩스베르그는 노르웨이의 조선소와 생산 라인에서 동맹이 구매하는 미사일과 세계의 선박이 운용하는 시스템을 만들어 냅니다. 두 부문을 모두 소유하면 어느 쪽도 타인의 결정으로 끊기지 않습니다."
 NRY_kongsberg_allied_missile_house: "동맹 미사일 전문 기업"
 NRY_kongsberg_allied_missile_house_desc: "합동 타격 미사일은 동맹 각국의 항공기에 탑재되며 콩스베르그가 유일한 공급처입니다. 입지는 탄탄하지만 단일 제품군에 의존하고 있습니다."
 NRY_kongsberg_maritime_systems_leader: "해양 시스템 선도 기업"
 NRY_kongsberg_maritime_systems_leader_desc: "콩스베르그 마리타임은 세계 상선과 해양 플랜트 선단의 상당수에서 함교를 차지하고 있습니다. 수주 잔고는 국방 예산이 아니라 해운 경기에 좌우되며, 이는 장단점을 모두 가집니다."
 NRY_kongsberg_niche_supplier: "틈새 납품업체"
 NRY_kongsberg_niche_supplier_desc: "콩스베르그는 다른 이들이 주도하는 사업에 포탑과 하위 체계를 납품합니다. 공학 기술은 높이 평가받지만 주도권은 통합 업체에 있습니다."
