 UKR_inter_created_tt: "§Y국제군단§!이 창설되며 여러 나라의 동맹 대대를 고용할 수 있게 됩니다"
 UKR_kraken_created_tt: "§Y크라켄 대대§!가 창설될 것입니다."
 UKR_ter_oborona: "영토 방위 형성"
 UKR_ter_oborona_desc: "We need more different units to protect our homeland. We will begin the creation of Ukrainian Territorial Defense so that every region is protected."
 UKR_azov: "아조우 대대 창설"
 UKR_azov_desc: "위험을 감수하고 그들이 우리 군의 대열에 합류하도록 합시다."
 UKR_create_sso: "우크라이나 특수작전군 창설"
 UKR_create_sso_desc: "새로운 군 조직은 적과 더 효과적으로 싸우는 데 도움이 될 것입니다."
 UKR_donbass: "돈바스-우크라이나 대대 창설"
 UKR_donbass_desc: "의용병으로 구성된 또 다른 부대가 우리 휘하에 들어옵니다."
 UKR_reform_mvd: "내무부 개혁"
 UKR_reform_mvd_desc: "We will carry out a global reform in the Ministry of Internal Affairs."
 UKR_found_the_national_police: "특수경찰 순찰대"
 UKR_found_the_national_police_desc: "The Patrol Service of the Special Purpose Police of Ukraine is a service within the Patrol Police Department of Ukraine within the National Police of Ukraine, which was created as part of the Ministry of Internal Affairs of Ukraine as a structure of special forces for the protection of public order.\n\nThe structure became part of the National Police of Ukraine. The service combines former battalions and regiments of the Ministry of Internal Affairs."
 UKR_found_the_kord: "특수 부대 CORD"
 UKR_found_the_kord_desc: "작전 및 급작스러운 행동 군단, 또는 CORD 부대는 우크라이나 국가 경찰의 특수 목적 부대입니다. 이 부대는 긴급 상황을 해결하기 위해 설계되었으며, 그 상황의 수준이 매우 높고 복잡하여 신속 대응 부대나 작전 수색 부대의 능력을 초과할 수 있습니다."
 UKR_inter_legion: "국제 지역 방위군"
 UKR_inter_legion_desc: "우크라이나 영토방위 국제군단은 우크라이나군 영토 방위대의 일부로서 의용 부대를 구성하기 위해 외국인을 모집하려는 우크라이나 정부의 프로젝트입니다."
 UKR_kraken: "특수부대 \"크라켄\""
 UKR_kraken_desc: "크라켄 특수부대는 우크라이나 국방부 국방정보총국 소속의 우크라이나 독립 정찰·파괴 부대입니다."
 UKR_civil_war: "돈바스에서의 전쟁"
 UKR_ukraine_elections: "우크라이나 선거"
 UKR_ukraine_elections_desc: "It is time to decide who will lead our country further."
 donbass_civil_war: "내전이 발생한 돈바스"
 UKR_republic_ukr: "연방 공화국"
 UKR_republic_ukr_desc: "The Federal Republic is a special type of entity, which is the basis of the entire Ukrainian Federation. It has expanded autonomy as well as the ability to make its own laws."
 UKR_confederation: "연방화"
 UKR_confederation_desc: "Several regions received the maximum possible autonomy, which led to a state similar to the Confederate system."
 subject_ukr.1.t: "공장 건설을 요청하는 [FROM.GetNameWithFlag]"
 subject_ukr.1.d: "[FROM.GetNameWithFlag] 정부가 자력으로 건설할 수 없다는 이유로 자국 영토 내 공장 건설을 요청하였습니다."
 subject_ukr.1.a: "좋다"
 subject_ukr.1.b: "안된다"
 subject_ukr.2.t: "공장 건설"
 subject_ukr.2.d: "[UKR.GetNameWithFlag]이(가) 공장 건설에 동의하였습니다."
 subject_ukr.2.a: "좋아"
 subject_ukr.3.t: "공장 건설"
 subject_ukr.3.d: "[UKR.GetNameWithFlag] has refused to build a factory."
 subject_ukr.3.a: "슬프군"
 subject_ukr.4.t: "[FROM.GetNameWithFlag], 보조금 요청"
 subject_ukr.4.d: "[FROM.GetNameWithFlag] 정부가 자국 예산을 위한 보조금을 우리에게 요청하였습니다. 보조금을 지급할 준비가 되었습니까?"
 subject_ukr.4.a: "좋다"
 subject_ukr.4.b: "안된다"
 subject_ukr.5.t: "연방 예산의 보조금"
 subject_ukr.5.d: "[UKR.GetNameWithFlag] has agreed to provide us with funds from the Federal budget."
 subject_ukr.5.a: "좋아"
 subject_ukr.6.t: "연방 예산의 보조금"
 subject_ukr.6.d: "[UKR.GetNameWithFlag] has refused to allocate funds from the Federal budget to us."
 subject_ukr.6.a: "슬프군"
 UKR_subsidies: "§Y[UKR.GetNameWithFlag]§!에 보조금 요청"
 UKR_buildings: "§Y[UKR.GetNameWithFlag]§!에 공장 요청"
 UKR_subject_annex: "구성체 재통합"
 UKR_authority_more_60: "우리 종속국이 [ROOT.GetFlag] 연방 정부 내에서 §Y60%§!의 권한을 가지고 있음"
 ukraine_maidan_west.1.t: "마이단에서의 시위"
 ukraine_maidan_west.1.d: "Our state policies do not suit a certain part of the population. People are starting to come out to the famous Kyiv square - Maidan, as a way to express dissatisfaction with our political decisions."
 ukraine_maidan_west.1.a: "지켜보고 있다"
 ukraine_maidan_west.2.t: "마이단에서의 시위"
 ukraine_maidan_west.2.d: "우리 정부는 시위가 빠르게 끝날 것이라 생각하였지만 그런 일은 일어나지 않았습니다. 오히려 사람들은 더 오래 머물기 위해서 광장에 텐트를 치고 캠프를 만들기 시작했습니다."
 ukraine_maidan_west.2.a: "I Have a Bad Feeling About This"
 ukraine_maidan_west.3.t: "마이단에서의 시위"
 ukraine_maidan_west.3.d: "The protesters are not going to leave and are starting to behave more aggressively, maybe it's time to take action and demolish their little tent city."
 ukraine_maidan_west.3.a: "베르쿠트 부대를 투입하자"
 ukraine_maidan_west.3.b: "우리는 개입하지 않을 것이다."
 ukraine_maidan_west.4.t: "마이단에서의 시위"
 ukraine_maidan_west.4.d: "시위대 해산을 시작하였습니다. 많은 외국 텔레비전 채널이 이를 피비린내 나는 학살로 보도하고 있으나, 우리의 임무는 오직 하나, 국가를 지키는 것입니다."
 ukraine_maidan_west.4.a: "조국을 위하여!"
 ukraine_maidan_west.5.t: "마이단에서의 시위"
 ukraine_maidan_west.5.d: "시위대의 열기가 식어 모두 집으로 돌아가기를 바라며 해산하지 않기로 결정하였습니다. 일단은 다음에 어떤 일이 벌어지는지 지켜보겠지만, 지금까지는 상황이 진정될 기미가 보이지 않습니다."
 ukraine_maidan_west.5.a: "우린 기다리고 있다."
 ukraine_maidan_west.6.t: "마이단에서의 시위"
 ukraine_maidan_west.6.d: "시위대와 협상하기로 결정하였습니다. 어쩌면 그들의 정치적 요구를 충족시킬 수 있을지도 모릅니다."
 ukraine_maidan_west.6.a: "최선을 기대한다"
 ukraine_maidan_west.7.t: "마이단에서의 시위"
 ukraine_maidan_west.7.d: "협상 시도는 우리 당 내에서조차 약함의 표시로 받아들여졌습니다. 동료들은 변화의 바람이 시위대 편에 있다고 느끼며 적극적으로 우리 대열을 떠나 시위대 측으로 넘어가고 있습니다."
 ukraine_maidan_west.7.a: "불길한 예감이 든다"
 ukraine_maidan_west.8.t: "마이단에서의 시위"
 ukraine_maidan_west.8.d: "우리 정치 당은 완전히 붕괴되었습니다. 동료들을 잃었고, 우리 당원들이 반대 세력의 요구에 동의하는 것 같습니다... 이게 끝인 것 같습니다."
 ukraine_maidan_west.8.a: "Oh God..."
 ukraine_maidan_west.10.t: "남동부의 반란"
 ukraine_maidan_west.10.d: "남동부 지역들 또한 벌어지고 있는 사태에 불만을 품고 우리에게 연방화를 요구하였습니다. 이에 동의하겠습니까?"
 ukraine_maidan_west.10.a: "돈바스는 구성체가 될 것이다"
 ukraine_maidan_west.10.b: "연방화는 없다"
 ukraine_maidan_west.11.t: "하르키우 반란"
 ukraine_maidan_west.11.d: "도네츠크와 루한스크의 폭동은 하르키우에서도 비슷한 반응을 불러일으켰습니다. 분리주의자들은 그곳에서 권력을 잡고 하르키우 공화국을 선포하였습니다."
 ukraine_maidan_west.11.a: "대체 얼마나 많은거야?"
 ukraine_maidan_west.12.t: "오데사 반란"
 ukraine_maidan_west.12.d: "돈바스의 봉기가 오데사에서 폭동을 일으켰습니다. 처음에는 모든 것이 비교적 평화롭게 시작되어 끝낼 수도 있었으나, 우리에게는 반란을 진압할 자원이 없었고 이제 현지 시민들은 자신들의 공화국을 선포하였습니다."
 ukraine_maidan_west.12.a: "도대체 몇 곳이나 되는가?"
 ukraine_maidan_west.13.t: "마이단에서의 시위"
 ukraine_maidan_west.13.d: "베르쿠트를 동원하여 마이단을 강제로 해산하려는 시도를 하였습니다."
 ukraine_maidan_west.13.a: "나라를 지키자!"
 ukraine_maidan_west.14.t: "마이단에서의 시위"
 ukraine_maidan_west.14.d: "반응은 오래 걸리지 않았고 시위는 급진화되기 시작하였습니다. 폭력적인 전략을 채택한 사람들은 우리 보안군을 상대로 화염병과 소형 화기, 돌을 사용하기 시작하였습니다."
 ukraine_maidan_west.14.a: "오, 맙소사..."
 ukraine_maidan_west.15.t: "파견되는 군대!"
 ukraine_maidan_west.15.d: "We will try to deploy the army in order to make an attempt to crack down on protests."
 ukraine_maidan_west.15.a: "우크라이나군이 우크라이나를 구하리라."
 ukraine_maidan_west.16.t: "마이단에서의 시위"
 ukraine_maidan_west.16.d: "군 병력 일부가 고도 경계 태세에 들어가 시위에 대처하기 위해 수도로 파견되었습니다."
 ukraine_maidan_west.16.a: "군대가 키이우에 도착하였다"
 ukraine_maidan_west.16.b: "군대는 도움이 되지 못하였다"
 ukraine_maidan_west.17.t: "키이우 학살"
 ukraine_maidan_west.17.d: "군대가 시위대와 무력 충돌에 들어갔습니다. 양측에서 총기가 발사되면서 진짜 학살이 시작되었습니다."
 ukraine_maidan_west.17.a: "끔찍하군"
 ukraine_maidan_west.18.t: "키이우 학살"
 ukraine_maidan_west.18.d: "우리에게는 다른 선택이 없었고, 그 결과 이 탄압에서 살아남은 많은 사람들이 나라의 서부 지역으로 달아났습니다. 그곳에서 그들은 자국민에 대한 이토록 잔혹한 배신을 저지른 우리 정부에 맞서 싸울 준비를 하고 있습니다."
 ukraine_maidan_west.18.a: "폭풍이 다가온다"
 ukraine_maidan_west.20.t: "마이단에서의 시위"
 ukraine_maidan_west.20.d: "군대의 지원이 없으면 우리 보안군은 시위대의 압력을 감당할 수 없습니다. 이 투쟁의 마지막 국면이 곧 다가올지도 모릅니다."
 ukraine_maidan_west.20.a: "끝이 다가왔다"
 ukraine_maidan_west.21.t: "마이단에서의 시위"
 ukraine_maidan_west.21.d: "시위 중에 끔찍한 비극이 일어났습니다. 정체불명의 저격수들이 시위대에게 발포하여 더욱 큰 반발을 불러일으켰습니다. 동료들은 발포 명령이 우리 정부에서 내려졌다고 믿으며 떠나고 있습니다."
 ukraine_maidan_west.21.a: "정말로 패배한 것인가?"
 ukraine_maidan_west.22.t: "마이단에서의 시위"
 ukraine_maidan_west.22.d: "우리 정부는 완전히 무너졌습니다. 곧 우리를 지지할 사람은 아무도 없을 것입니다. 권력을 넘길 준비를 해야 할 때입니다."
 ukraine_maidan_west.22.a: "마지막 시간이다"
 ukraine_maidan_west.23.t: "마이단에서의 시위"
 ukraine_maidan_west.23.d: "우리 정부가 마침내 전복되었습니다. 시위는 목표를 달성하였습니다."
 ukraine_maidan_west.23.a: "마이단이 승리하였다"
 ukraine_maidan_east.1.t: "남동부의 소요"
 ukraine_maidan_east.1.d: "우리의 정책이 나라 남동부에서 시위와 집회를 불러일으켰습니다. 명백히 반정부적인 구호를 내건 시위가 많은 도시를 휩쓸었습니다."
 ukraine_maidan_east.1.a: "갑작스럽군"
 ukraine_maidan_east.2.t: "의원들의 자체 결집"
 ukraine_maidan_east.2.d: "시위가 세력을 얻고 있으며 이제 지방 의원들이 합류하여 상당히 위험한 구호를 외치고 있습니다."
 ukraine_maidan_east.2.a: "걱정되는군"
 ukraine_maidan_east.4.t: "협상 시도"
 ukraine_maidan_east.4.d: "의원들이 협상을 원하고 있습니다. 아직은 분쟁을 평화적으로 해결할 수 있습니다."
 ukraine_maidan_east.4.a: "Meet the deputies"
 ukraine_maidan_east.5.t: "협상 결렬"
 ukraine_maidan_east.5.d: "우리는 합의에 이르지 못하였습니다. 시위대는 더 이상 평화적 해결에 관심이 없습니다."
 ukraine_maidan_east.5.a: "최악의 상황에 대비하다"
 ukraine_maidan_east.6.t: "협상 지속"
 ukraine_maidan_east.6.d: "일단은 폭력을 막고 분쟁 당사자들과 협상할 수 있었습니다. 이제 최종 합의를 위한 그들의 제안을 기다립니다."
 ukraine_maidan_east.6.a: "최악은 피했을지도 모른다"
 ukraine_maidan_east.7.t: "민병대 조직"
 ukraine_maidan_east.7.d: "지역 시위자들은 민병대 부대를 결성하기 시작했으며, 이로 인해 무장 반란이 발생했습니다."
 ukraine_maidan_east.7.a: "Oh God..."
 ukraine_maidan_east.8.t: "진압 개시"
 ukraine_maidan_east.8.d: "동남부의 많은 지역에서 상황이 통제 불능 상태로 치닫고 있습니다. 이제 결단력 있는 조치를 취할 때입니다."
 ukraine_maidan_east.8.a: "We will go to Odesa"
 ukraine_maidan_east.8.b: "우리는 돈바스와 하르키우로 가야한다."
 ukraine_maidan_east.8.c: "우리는 더 준비해야한다."
 ukraine_maidan_east.9.t: "Odesa is Saved"
 ukraine_maidan_east.9.d: "We suppressed the local separatists before they could seize control of the region, but now an armed rebellion has begun in Donbas due to our focus on Odesa."
 ukraine_maidan_east.9.a: "준비할 때다"
 ukraine_maidan_east.10.t: "돈바스 진압"
 ukraine_maidan_east.10.d: "돈바스 반란을 진압하려던 시도는 실패하였습니다. 베르쿠트 부대가 반군에 합류하여 우리는 더욱 어려운 처지에 놓였습니다."
 ukraine_maidan_east.10.a: "준비할 때다"
 ukraine_maidan_east.11.t: "치명적인 지연"
 ukraine_maidan_east.11.d: "우리의 지연으로 인해 남동부의 많은 공화국이 무장 반란을 일으켰습니다."
 ukraine_maidan_east.11.a: "우리가 실수를 하였다."
 ukraine_maidan_east.12.t: "남동부의 소요"
 ukraine_maidan_east.12.d: "우리의 행동이 광범위한 확전으로 이어졌고, 이제 그 결과에 직면해 있습니다."
 ukraine_maidan_east.12.a: "우리가 실수를 하였다."
 ukraine_maidan_east.13.t: "하르키우의 반란"
 ukraine_maidan_east.13.d: "우리 특수 기관의 준비 부족이 또다시 우리에게 나쁜 장난을 쳤습니다. 하르키우에서 우리는 반란을 진압하지 못하였고, 이는 무장 봉기로 이어졌습니다. "
 ukraine_maidan_east.13.a: "도대체 몇 곳이나 되는가?"
 ukraine_maidan_east.17.t: "돈바스 반란"
 ukraine_maidan_east.17.d: "도네츠크와 루한스크 지역에서 무장 봉기가 시작되었습니다. 베르쿠트 부대는 반군이 그곳에 주둔한 일부 군 부대를 무장 해제하는 데 중요한 역할을 하였습니다."
 ukraine_maidan_east.17.a: "젠장"
 ukraine_maidan_east.18.t: "The Odesa Mutiny"
 ukraine_maidan_east.18.d: "Berkut's defection to the rebels has greatly inspired separatists in Odesa, where they have also declared the creation of a people's republic."
 ukraine_maidan_east.18.a: "대체 얼마나 많은거야?"
 ukraine_maidan_east.19.t: "정부는 권력을 잃고 있다."
 ukraine_maidan_east.19.d: "우리는 내전으로 이어진 중요한 실수를 했고, 정치적 반대자들은 이를 이용해 권력을 장악할 것이다."
 ukraine_maidan_east.19.a: "어떤 어려움이 있더라도"
 ukraine_maidan_east.19.b: "어떤 어려움이 있더라도"
 ukraine_maidan_east.19.c: "어떤 어려움이 있더라도"
 ukraine_maidan_east.21.t: "정부는 권력을 잃고 있다."
 ukraine_maidan_east.21.d: "우리는 내전으로 이어진 중요한 실수를 했고, 정치적 반대자들은 이를 이용해 권력을 장악할 것이다."
 ukraine_maidan_east.21.a: "우리 힘으로 해결하겠다"
 ukraine_maidan_east.21.b: "러시아에 도움을 요청하겠다"
 ukraine_maidan_east.22.t: "공동의 적에 맞선 결집"
 ukraine_maidan_east.22.d: "내전이 발발하였음에도 국민은 우리 주위로 결집하였습니다. 우리는 정치적 입지를 약간 잃었을 뿐이며, 분리주의자들에 맞선 신성한 투쟁이라는 구호로 이를 만회하고 있습니다."
 ukraine_maidan_east.22.a: "우크라이나를 위하여!"
 ukraine_maidan_east.23.t: "우리의 도움을 요청한 우크라이나"
 ukraine_maidan_east.23.d: "우크라이나 정부가 내전 발발로 인해 우리에게 도움을 요청하였습니다. 이제 그들을 지원할 의사가 있는지 결정해야 합니다."
 ukraine_maidan_east.23.a: "그들을 돕겠다"
 ukraine_maidan_east.23.b: "그들 스스로 해결하게 두겠다"
 ukraine_maidan_east.24.t: "지원 방식 선택"
 ukraine_maidan_east.24.d: "우크라이나의 요청에 따라 파견대를 보내기로 하였습니다. 이제 누구를 보낼지 결정해야 합니다."
 ukraine_maidan_east.24.a: "진압 경찰을 보내겠다"
 ukraine_maidan_east.24.b: "로스그바르디야를 보내겠다"
 ukraine_maidan_east.24.c: "민간군사기업 바그너를 보내겠다"
 ukraine_maidan_east.25.t: "우리를 돕기를 거부한 러시아"
 ukraine_maidan_east.25.d: "러시아 정부는 우리에게 도움을 보내거나 우리의 비극적인 사건에 어떤 방식으로든 참여하는 것을 거부했습니다. 우리는 실망했습니다."
 ukraine_maidan_east.25.a: "반역자들"
 ukraine_maidan_east.26.t: "연방화 문제"
 ukraine_maidan_east.26.d: "반군은 자신들의 주된 유일한 요구를 내놓았습니다. 바로 우크라이나의 연방화와 돈바스에 연방 구성체로서의 특별한 지위를 부여하는 것입니다. 우리는 위험을 감수하고 이러한 개혁에 동의할 준비가 되었습니까?"
 ukraine_maidan_east.26.a: "연방화는 이루어져야 한다"
 ukraine_maidan_east.26.b: "절대 안된다"
 ukraine_maidan_east.27.t: "마침내 평화"
 ukraine_maidan_east.27.d: "우리는 연방화에 동의하였고, 덕분에 우리나라에 닥칠 끔찍한 결과를 피할 수 있었습니다."
 ukraine_maidan_east.27.a: "좋아"
 UKR_maidan_temporary_attack_idea: "조직적 공세"
 ukraine_maidan.1.t: "크름의 지위"
 ukraine_maidan.1.d: "크름은 러시아계 주민이 다수입니다. 그곳 사람들은 우리 민족입니다. 그들과 돈바스의 형제들이 우크라이나의 통치 아래 사는 것은 부당합니다. 그들의 요청을 받아들여 우리와 함께하기를 갈망하는 사람들을 통합해야 하겠습니까?"
 ukraine_maidan.1.a: "크름을 장악한다"
 ukraine_maidan.1.b: "크름은 우크라이나의 땅이다"
 ukraine_maidan.2.t: "크림을 병합하는 러시아"
 ukraine_maidan.2.d: "크름 주민들이 분리해 나갔습니다. 그들은 러시아 정부의 지원을 구하였습니다. 크름 주민들은 압도적인 찬성으로 이 주를 러시아 국가에 편입하는 것을 허용하는 국민투표를 통과시켰습니다. 크름 인근에 주둔하던 러시아군이 이 지역으로 쏟아져 들어와 주요 거점을 신속히 장악하였습니다. 배신자들은 그 군대를 두 팔 벌려 환영하였습니다. 언젠가 우리는 마땅히 우리 것인 영토를 되찾을 것입니다!"
 ukraine_maidan.2.a: "흥미롭군"
 ukraine_maidan.3.t: "크림 국민을 거부하는 러시아"
 ukraine_maidan.3.d: "크름의 배신자들이 마침내 우리에게서 분리하려는 어리석은 국민투표를 실시하였습니다. 러시아 국민은 오랫동안 이러한 행태를 부추겨 왔습니다. 러시아가 크름 주민들을 거부한 이유는 수수께끼입니다. 그러나 그 지역을 장악하여 우리를 더 이상 약화시키지 않은 점은 고맙게 생각합니다. 이 결정이 무엇을 초래했는지는 시간이 말해 줄 것입니다."
 ukraine_maidan.3.a: "좋은 날이다"
 ukraine_maidan.4.t: "민스크 협정"
 ukraine_maidan.4.d: "전쟁은 우리가 기대한 결과로 이어지지 않았습니다. 분리주의자들은 격파되지 않았고, 국민은 끝없는 전쟁에 분명히 불만을 품고 있습니다. 잠시 휴전하는 것이 좋지 않겠습니까?"
 ukraine_maidan.4.a: "지금 평화를"
 ukraine_maidan.4.b: "평화? 왜?"
 ukraine_maidan.6.t: "OSCE 감시단"
 ukraine_maidan.6.d: "무력 충돌을 통제하고 방지하며 돈바스의 평화와 안정을 보장하기 위해 OSCE 감시단이 국경 지역에 파견되었습니다."
 ukraine_maidan.6.a: "단지 휴전일 뿐이다"
 ukraine_maidan.8.t: "연방화를 제안하는 우크라이나"
 ukraine_maidan.8.d: "우크라이나가 우리에게 연방화 계획을 제안하며 우리를 별개의 실체로 인정하는 데 동의하였습니다. 이에 동의하겠습니까?"
 ukraine_maidan.8.a: "동의한다"
 ukraine_maidan.8.b: "거절한다"
 ukraine_maidan.9.t: "러시아 기업과의 협력"
 ukraine_maidan.9.d: "유럽 연합은 우리에게 필요한 수준의 자원과 기술을 제공할 수 없으므로 러시아 기업과의 협력을 계속할 것입니다."
 ukraine_maidan.9.a: "불가피한 희생"
 ukraine_maidan.16.t: "포퓰리즘 개혁"
 ukraine_maidan.16.d: "우리의 대통령 임기는 어떤 형태로든 개혁으로 시작해야 합니다. 개혁 활동의 초점을 정확히 무엇으로 삼을지 결정해야 합니다."
 ukraine_maidan.16.a: "토지 개혁"
 ukraine_maidan.16.b: "도로 개혁"
 ukraine_maidan.16.c: "라다에 영향력을 행사하겠다"
 UKR_crimea_bund: "크름 공화국이 반란을 일으켰음"
 UKR_civil_war_desc: "우리나라는 분열되었으며 우리는 자국민을 상대로 내전을 치르고 있습니다. 분리주의자들을 격파하려는 서두름 속에 우리 군은 단결되어 있지 않습니다."
 UKR_russian_gas: "러시아 에너지 자원"
 UKR_russian_gas_desc: "우리는 러시아의 자원 공급에 크게 의존하고 있으며, 대안을 찾기 전까지는 모스크바와 협상할 수밖에 없습니다."
 UKR_russian_gas_cheap: "저렴한 러시아 에너지 자원"
 UKR_russian_gas_cheap_desc: "우리는 러시아의 자원 공급에 크게 의존하고 있으며, 대안을 찾기 전까지는 모스크바와 협상할 수밖에 없습니다."
 UKR_russian_gas_cheaper: "저렴한 러시아 에너지 자원"
 UKR_russian_gas_cheaper_desc: "우리는 러시아의 자원 공급에 크게 의존하고 있으며, 대안을 찾기 전까지는 모스크바와 협상할 수밖에 없습니다."
 UKR_russian_gas_sov: "우크라이나와의 가스 계약"
 UKR_russian_gas_sov_desc: "우리와 우크라이나 사이에 특별 조건으로 가스 계약이 체결되었으며, 이를 통해 우리는 그들에 대한 영향력을 확보할 수 있습니다."
 UKR_russian_gas_cheap_sov: "우크라이나와의 가스 계약"
 UKR_russian_gas_cheap_sov_desc: "우리와 우크라이나 사이에 특별 조건으로 가스 계약이 체결되었으며, 이를 통해 우리는 그들에 대한 영향력을 확보할 수 있습니다."
 UKR_russian_gas_cheaper_sov: "우크라이나와의 가스 계약"
 UKR_russian_gas_cheaper_sov_desc: "우리와 우크라이나 사이에 특별 조건으로 가스 계약이 체결되었으며, 이를 통해 우리는 그들에 대한 영향력을 확보할 수 있습니다."
 UKR_idea_old_national_guard: "국가방위군"
 UKR_idea_old_national_guard_desc: "The National Guard of Ukraine is a state armed body created on the basis of the Internal Troops of the USSR, designed to protect the sovereignty of Ukraine, its territorial integrity, as well as the life and personal dignity of citizens, their constitutional rights and freedoms from criminal encroachments and other antisocial actions."
 UKR_kleptocracy01: "강한 도둑정치"
 UKR_kleptocracy01_desc: "우크라이나 정부는 현재 도벽정치의 수렁에 빠져 있습니다. 고위층은 부패했으며, 자신의 권력을 사용해 영토의 국민과 천연자원을 착취하여 부와 정치적 권력을 확장하고 있습니다.\n\n§C도벽 정치의 부정적인 영향을 없애기 위해 국가는 부패를 척결하기 위한 조치를 취해야 합니다.§!"
 UKR_kleptocracy02: "아주 강한 도둑정치"
 UKR_kleptocracy02_desc: "우크라이나 정부는 현재 도벽정치의 수렁에 빠져 있습니다. 고위층은 부패했으며, 자신의 권력을 사용해 영토의 국민과 천연자원을 착취하여 부와 정치적 권력을 확장하고 있습니다.\n\n§C도벽 정치의 부정적인 영향을 없애기 위해 국가는 부패를 척결하기 위한 조치를 취해야 합니다.§!"
 UKR_kleptocracy03: "마비시키는 도둑정치"
 UKR_kleptocracy03_desc: "우크라이나 정부는 현재 도벽정치의 수렁에 빠져 있습니다. 고위층은 부패했으며, 자신의 권력을 사용해 영토의 국민과 천연자원을 착취하여 부와 정치적 권력을 확장하고 있습니다.\n\n§C도벽 정치의 부정적인 영향을 없애기 위해 국가는 부패를 척결하기 위한 조치를 취해야 합니다.§!"
 UKR_every_man_ataman_desc: "자유는 우크라이나인의 영혼 깊숙이 뿌리내려 있습니다. 옛 코사크처럼 모든 우크라이나인은 조국을 위해 일어서고, 부름을 받으면 이끌며, 민족의 독립을 위해 싸울 준비가 되어 있습니다. 역사를 통틀어 우크라이나인들은 자유를 치열하게 지켜 왔으며 통치자들에게 책임을 물어 왔습니다. 자유로운 민중의 의지 위에 군림하는 권위는 없기 때문입니다."
 UKR_gas_tt: "러시아에 에너지 자원 대금을 지불함: $§R0.175§!\n"
 UKR_gas_cheap_tt: "러시아에 에너지 자원 대금을 지불함: $§R0.100§!\n"
 UKR_gas_cheaper_tt: "러시아에 에너지 자원 대금을 지불함: $§R0.100§!\n"
 UKR_gassov_tt: "우크라이나가 우리의 에너지 자원 대금을 지불함: $§G0.175§!\n"
 UKR_gassov_cheap_tt: "우크라이나가 우리의 에너지 자원 대금을 지불함: $§G0.100§!\n"
 UKR_gassov_cheaper_tt: "우크라이나가 우리의 에너지 자원 대금을 지불함: $§G0.100§!\n"
 UKR_dshv_create: "공중강습군"
 UKR_dshv_create_desc: "공중강습군을 지상군에서 분리하여 독자적인 지휘와 구조를 갖춘 별도 부대로 만들어 효율을 높일 것입니다."
 UKR_command_create: "연합군 사령부"
 UKR_command_create_desc: "우크라이나군 연합군 사령부는 다양한 군사 작전을 수행하기 위해 부대 집단 간을 조율하는 우크라이나군의 군사 관리 기구입니다. 또한 우크라이나 밖에서의 평화유지 임무 수행도 책임집니다."
 UKR_national_guard: "국가방위군 재건"
 UKR_national_guard_desc: "국가방위군은 쿠치마 대통령 시절에 해체되었으나, 이제 상황은 이를 재건할 것을 요구합니다. 내무부 내무군을 바탕으로 재편할 것입니다."
 UKR_dissolved_parliament: "해산된 의회"
 UKR_dissolved_parliament_desc: "의회가 해산되어 국내에서 대의제가 더 이상 작동하지 않습니다.\n§W------------------§!\n선거를 복원하면 이 국가 정신은 §R제거§!됩니다."
 UKR_russia_help_battalions: "러시아 지원 대대"
 UKR_oup: "우크로보로놈프"
 UKR_oup_desc: "The Ukrainian industry needs to be revived and quickly. But to do this, we structure all our enterprises into one concern."
 civilwar_after: "내전이 일어났다"
 UKR_win_elections_TT: "우리 §H블록§!이 §H선거§!에서 §G승리§!합니다"
 UKR_lose_elections_TT: "우리 §H블록§!이 §H선거§!에서 §R패배§!합니다"
 UKR_presidential_decisions_only_one_is_available_TT: "이 결정들 가운데 한 번에 하나만 취할 수 있습니다."
 UKR_parliament_block_tt: "이 §H법§!은 §H최고라다§!의 §H승인§!을 받아야 합니다"
 UKR_free_parliament_TT: "§H의회§!에 §C자유 선거§!를 복원합니다"
 UKR_verkhovna_rada: "최고라다"
 UKR_verkhovna_rada_desc: "\n\n\n\n\n\n£UKR_desctext_rada\n\n\n\n\n\n\n\n\nThe §HVerkhovna Rada§! [UKR.GetFlag] is our national parliament, and they dictate what laws come and go, meaning that they can often go against our own needs. The §HVerkhovna Rada§! can be in one of 3 states at any time. §CFree§!, which means we do not have direct control over the §HVerkhovna Rada§!, §CInfluenced§!, which means we have some control, and §CPuppet§!, which means we have total control.\n\nThe §HVerkhovna Rada§! may withdraw its support from our government if we reject §Hcertain proposals§! they have, or if we change to an §Houtlook that isn't closely aligned to theirs§!. They may also randomly withdraw support if they feel like it.\n\nThe more support we have, the better, as it makes it more likely for us to be able to pass laws without having to take additional measures. Completed reforms and defence projects also make the deputies more willing to approve the matching spending changes. The §HVerkhovna Rada§! will hold elections and the outcome will be based on the influence of foreign nations, or our own domestic independence.\n\n§G[?UKR_verkhovna_support]§!/§H450§! Seats of the §HVerkhovna Rada§! currently support our government\n"
 ukraine_nationalist_majority_name: "§H다수 친우크라이나§!"
 UKR_right_wing_desc_TT: "§H친우 우크라이나 의원 다수§!는 의회가 §C서방§!과 §G러시아§!로부터 더 큰 거리를 두기를 원한다는 것을 의미합니다. 그들은 세계 정치에서 보다 독립적이고 중립적인 §H우크라이나§!를 추구하며, 일반적으로 어떤 충돌에서도 편을 들지 않기를 원합니다."
 ukraine_eastern_majority_name: "§G친러시아 다수파§!"
 UKR_left_wing_desc_TT: "의회 내 §G친러시아§! 블록은 대체로 §G러시아§! 정부와의 더 긴밀한 관계를 추구하며 §C서방§! 강국들과 거리를 두고자 합니다. 이 블록 내에서도 급진화 정도는 다양하여, 일부는 §G친러시아§! 관계를 유지하는 독립 §H우크라이나§!를 원하고 다른 일부는 §H우크라이나§!와 §G러시아§! 사회의 더 큰 통합을 원합니다."
 ukraine_western_majority_name: "§B친서방 다수파§!"
 UKR_liberal_TT: "의회 내 §B친서방§! 블록은 §H우크라이나§!가 친러시아 정책을 버리고 §C서방§! 강국들과 더 긴밀한 관계를 맺기를 바라는 정당과 개인을 대표합니다. §C서방§!과 보조를 맞추려는 이들의 목표는 크게 다양하여, 일부는 경제·문화적 유대만을 바라고 다른 일부는 §BNATO§! 동맹에 가입하여 §H우크라이나§!를 §G러시아§!의 영향력으로부터 보호하기를 바랍니다."
 ukraine_dissolved_majority_name: "§R최고라다 해산§!"
 UKR_verkhovna_dissolved_tt: "의회가 해산되어 의사당은 의원 한 명 없이 텅 비어 있습니다."
 ukraine_free_verkhovna: "§C최고라다 상태: 자유§!"
 UKR_verkhovna_free_tt: "의회는 대통령의 영향력에서 자유로우며, 다른 정부 기관의 개입 없이 토론과 논쟁이 자연스럽게 진행됩니다."
 ukraine_influenced_verkhovna: "§p최고라다 상태: 영향받음§!"
 UKR_verkhovna_influenced_tt: "정부가 개편되어 의회는 쉽게 이용당할 수 있게 되었으며, 대통령 정부는 의회가 회기 중일 때 논의를 손쉽게 좌우할 수 있습니다."
 ukraine_puppeted_verkhovna: "§O최고라다 상태: 꼭두각시§!"
 UKR_verkhovna_puppetted_tt: "의회는 대통령과 내각이 국민을 속여 거짓 대의제의 느낌을 주기 위한 한낱 도구에 불과합니다."
