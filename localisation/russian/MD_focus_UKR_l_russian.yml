 ukraine_modernize_sov_equipment_btr_60_modernization_bulgaria_btr_60d: "Попросить у [BUL.GetNameWithFlag] §YБолгарии§! её старые §YБТР-60ПБ§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_bulgaria_btr_60d_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr60d_for_tooltip\n\n\n\n\n\n\n\n\n§WВойна с Россией пожирает нашу бронетехнику. §YБолгария§! всё ещё хранит на складах старые §YБТР-60ПБ§! и готова передать их в качестве военной помощи. Мы можем ввести их в строй как есть или капитально отремонтировать у себя, заменив изношенные бензиновые двигатели §YГАЗ-40П§! двумя немецкими дизелями §YDeutz BF4M2012§! и новой коробкой передач. Такая модернизация — это §YБТР-60Д§!.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization.6.name: "Первые БТР-60ПБ из Болгарии"
 ukraine_modernize_sov_equipment_btr_60_modernization.6.desc: "§YБолгария§! готова отправить нам первые §Y20§! БТР-60ПБ со своих складов, если они у неё ещё остались. Они старые и изношенные, но всё ещё держатся на воде, ездят и могут перевозить отделение. Мы можем сразу отправить их на фронт или сначала капитально отремонтировать и поставить дизели Deutz."
 ukraine_modernize_sov_equipment_btr_60_modernization.6.a: "Ввести их в строй как есть"
 ukraine_modernize_sov_equipment_btr_60_modernization.6.b: "Переделать их в §YБТР-60Д§!"
 ukraine_modernize_sov_equipment_btr_60_modernization.6.c: "У Болгарии больше нет лишних"
 ukraine_modernize_sov_equipment_btr_60_modernization.7.name: "Поставлены первые БТР-60Д"
 ukraine_modernize_sov_equipment_btr_60_modernization.7.desc: "Наши ремонтные заводы завершили первые §Y20§! §YБТР-60Д§!. Два дизеля Deutz BF4M2012 по 102 л. с. заменили старые бензиновые ГАЗ-40П, поэтому машины стали надёжнее и немного мощнее. Первые из них отправляются в механизированную бригаду."
 ukraine_modernize_sov_equipment_btr_60_modernization.7.a: "Отправить их на фронт"
 ukraine_modernize_sov_equipment_btr_60_modernization.8.name: "Следующая партия БТР-60ПБ из Болгарии"
 ukraine_modernize_sov_equipment_btr_60_modernization.8.desc: "§YБолгария§! готова отправить нам ещё §Y40§! БТР-60ПБ со своих складов, если они у неё ещё остались. Мы снова можем использовать их как есть или переделать в §YБТР-60Д§!. Наши заводы уже знают эту работу, поэтому она пойдёт быстрее."
 ukraine_modernize_sov_equipment_btr_60_modernization.8.a: "Ввести их в строй как есть"
 ukraine_modernize_sov_equipment_btr_60_modernization.8.b: "Переделать их в §YБТР-60Д§!"
 ukraine_modernize_sov_equipment_btr_60_modernization.8.c: "$ukraine_modernize_sov_equipment_btr_60_modernization.6.c$"
 ukraine_modernize_sov_equipment_btr_60_modernization.9.name: "Поставлена партия БТР-60Д"
