 NIG.socialism: "£NIG_western_social_democrat (ANPP) - 全尼日利亚人民党"
 NIG.socialism_desc: "社会民主党 - 全尼日利亚人民党成立于1998年，最初是一个右翼保守党。然而，它逐渐失去了其右倾倾向，这些倾向曾经吸引了来自尼日利亚北部的大部分支持。现在，它实际上包含了许多社会民主和左倾思想的元素。"
 NIG.socialism_2017: "£NIG_western_social_democrat_late (APC) - 全民进步大会党"
 NIG.socialism_2017_desc: "社会民主主义 - 全民进步大会党是由全尼日利亚人民党、尼日利亚行动大会、全进步大联盟和议会改革进步党合并而成的政党。"
