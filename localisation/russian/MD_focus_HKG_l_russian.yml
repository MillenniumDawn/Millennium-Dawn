 legco_decrease_administration_motion_clock: "Текущее предложение: §YСокращение £political_power_texticon Бюрократические расходы§!"
 legco_increase_policing_motion_clock: "Текущее движение: §YУвеличение £foreign_influence_defense_modifier_texticon §CБезопасность§!Финансирование§!"
 legco_decrease_policing_motion_clock: "Текущее движение: §YУменьшение £foreign_influence_defense_modifier_texticon §CБезопасность§!Финансирование§!"
 legco_increase_education_motion_clock: "Текущее движение: §YУвеличение £research_speed_texticon §GEобразование§!Бюджет§!"
 legco_decrease_education_motion_clock: "Текущее движение: §YУменьшение £research_speed_texticon §GEобразование§!Бюджет§!"
