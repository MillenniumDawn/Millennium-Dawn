 Sweden.300.t: "소니 에릭슨 탄생"
 Sweden.300.d: "에릭슨과 소니가 휴대전화 사업을 합작 법인으로 통합할 준비를 마쳤습니다. 소니는 소비자 디자인과 미디어 경험을, 에릭슨은 이동통신 엔지니어링을 가져옵니다."
 Sweden.300.a: "소니 에릭슨을 설립한다"
 Sweden.300.b: "에릭슨의 휴대전화 사업을 유지한다"
 Sweden.301.t: "에릭슨의 휴대전화 전략"
 Sweden.301.d: "경쟁이 치열해지면서 스마트폰 시장이 통합되고 있습니다. 에릭슨은 소비자용 휴대전화에서 철수하여 네트워크 인프라에 집중하거나, 완전히 통제하는 단말기 사업을 유지하기 위해 더 많은 자본을 투입할 수 있습니다."
 Sweden.301.a: "휴대전화 사업에서 철수한다"
 Sweden.301.b: "에릭슨 휴대전화에 재투자한다"
 Sweden.302.t: "에릭슨, 보네이지 인수"
 Sweden.302.d: "에릭슨이 보네이지 인수를 완료하여 클라우드 통신 서비스와 대규모 개발자 기반을 확보했습니다. 이 회사는 글로벌 네트워크 API 플랫폼을 구축하거나 자본을 무선 네트워크에 집중시킬 수 있습니다."
 Sweden.302.a: "보네이지 API 플랫폼을 구축한다"
 Sweden.302.b: "무선 네트워크에 계속 집중한다"
 Sweden.310.t: "수륙양용 군단을 위한 선박 16척"
 Sweden.310.d: "수륙양용 군단은 경량 보급정 16척을 원하고 있으며, 유프비크 조선소는 이를 건조할 알루미늄 생산 라인을 갖추고 있습니다. 해군은 충격 흡수 마운트, 피해 통제, 피격을 견디는 선체 등 군사 규격을 요구하고 있습니다. 조선소의 상업 고객들은 같은 24미터급을 훨씬 낮은 가격에 원하며, 그것도 당장 원합니다."
 Sweden.310.a: "경량 보급정을 해군 규격으로 건조한다"
 Sweden.310.b: "상업용 생산 라인을 계속 가동한다"
 Sweden.311.t: "조선소로 돌아오는 타페르급 함정"
 Sweden.311.d: "타페르급은 1993년부터 군도 일대를 초계해 왔으며 몇 해 전에 퇴역했어야 했습니다. 그러나 그렇지 않았습니다. 선체 여섯 척이 유프비크로 돌아오며, 문제는 개수를 얼마나 깊이 할 것인가입니다. 콩스베르그 소나 일체와 신형 엔진을 갖출 것인가, 아니면 앞으로 10년간 물에 떠 있을 만큼의 철판과 도장만 할 것인가."
 Sweden.311.a: "콩스베르그 소나 일체를 장착한다"
 Sweden.311.b: "선체 연장만 하고 그 이상은 하지 않는다"
 Sweden.312.t: "건조대를 차지한 외케뢰보리옌"
 Sweden.312.d: "1894년 이래 선체 518척을 건조했으나 이 조선소는 여전히 인수될 만큼 작습니다. 외케뢰보리옌 그룹이 제안을 내놓았습니다. 건조대를 위한 자본, 두 번째 건조 홀, 그리고 유프비크가 늘 규모가 작아 쫓지 못했던 계약에 입찰할 운전 자본입니다. 4대째 조선소를 운영해 온 일가는 서명을 요구받고 있습니다."
 Sweden.312.a: "투자를 받아들인다"
 Sweden.312.b: "조선소의 독립을 유지한다"
