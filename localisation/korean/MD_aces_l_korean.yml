l_korean:
 MD_ace_promoted.1.t: "에이스 조종사의 등장"
 MD_ace_promoted.1.d: "[Root.GetAdjective] 공군의 몇 몇 용감한 조종사들은 위험을 감수하며 작전에서 크게 활약했고. [From.GetCallsign]라는 별명으로 불리는 숙련된 조종사 [From.GetName] [From.GetSurname]은(는) 단순히 작전에서 살아돌아오는 것 뿐만아니라 [From.GetHerHis] 뛰어난 [From.GetWing] 조종 실력으로 [From.GetHerselfHimself]을 유명하게 만들고 있습니다. 현재 [From.GetName]은(는) [From.GetMissionRegion]에서 작전을 수행 중이며 그는 이 제공권 싸움에서 승리하는데 큰 도움이 되고있습니다.\n\n[From.GetName]는 [Root.GetAdjective]의 용맹함에 대한 빛나는 상징으로써 높은 선전 효과를 거두고 있습니다. 비록 국민들이 전쟁을 영광보다는 지옥이라고 생각할지라도, 많은 젊은이들이 그와 같은 전쟁 영웅들의 뒤를 따르고 있어 다행입니다."
 MD_ace_promoted.1.a: "누가 감히 우리에게 맞서겠는가"
 MD_ace_died.1.t: "에이스 조종사 [From.GetCallsign]가 [From.GetMissionRegion]에서 전사하다"
 MD_ace_died.1.d: "[From.Owner.GetName]의 가장 유명한 [From.GetAceType] 에이스 중 한 명인, [From.GetFullName]이(가) 전투에서 전사했습니다. [From.GetHerHis] [From.GetWingShort]는 [From.GetMissionRegion]에서의 작전 중 적의 포화에 피격 당해 화염에 휩싸여 추락했습니다, [From.GetSheHe]는 오랫동안 에이스 조종사로 활약해 왔기 때문에 [From.GetCallsign]의 죽음은 [From.GetHerHim] 흠모하던 많은 사람들에게 큰 충격을 주었습니다.\n\n우리는 그 사건을 사람들에게 숨기고 싶었지만, [From.GetName]의 공개적인 출연이 없다면 의혹을 불러올 것입니다. 결국, [From.GetHerHis]의 죽음은 우리가 바라던 현 문제를 가려줄 또 다른 전설이 될 것입니다."
 MD_ace_died.1.a: "살아있는 전설은 여전히 더 낫다."
 MD_ace_killed_by_ace.1.t: "[From.GetFullName]이(가) [Prev.GetCallsign]에게 격추당하다"
 MD_ace_killed_by_ace.1.d: "Pilots returning from [From.GetMissionRegion] report that a squadron of [Prev.Owner.GetAdjective] aircraft led by the infamous [Prev.GetCallsign] focused on chasing down [From.GetCallsign]. After taking down a number of enemy aircraft and dodging several missiles from the [Prev.Owner.GetAdjective]s, [From.GetCallsign] was overwhelmed by [Prev.GetCallsign] in [Prev.GetHerHis] [Prev.GetWingShort], who reportedly outmaneuvered [From.GetHerHim] and ripped the fuel tanks open with a clean hit. [From.GetName] [From.GetSurname]'s [From.GetWingShort] caught fire and went spiraling down over [From.GetMissionRegion] in a violent inferno.\n\n[From.GetFullName] has shown great courage throughout [From.GetHerHis] service and was looked up to by many. The loss of this national hero is a great blow to the [From.Owner.GetAdjective] air force and is a devastating blow to the nation as a whole. Knowing that while we grieve, [Prev.Owner.GetName] is celebrating [Prev.GetFullName] as a hero, makes the tragedy even greater."
 MD_ace_killed_by_ace.1.a: "우리에겐 엄청난 손실이군"
 MD_ace_killed_other_ace.1.t: "[From.GetFullName]이(가) [Prev.GetCallsign]을(를) 격추시키다"
 MD_ace_killed_other_ace.1.d: "최근 [From.GetMissionRegion]에서 수행했던 항공 작전에서 [From.Owner.GetAdjective] 공군은 큰 승리를 거두었습니다. 그 중에서도 중요한 성과는 아군 에이스 조종사 [From.GetFullName]의 영웅적인 행동으로 [From.GetCallsign](은)는 [Prev.GetCallsign]라는 별명으로 알려진 [Prev.Owner.GetAdjective] 에이스 조종사 [Prev.GetName] [Prev.GetSurname]을(를) 사냥하기 위해 [From.GetHerselfHimself] 미끼가 되어 [Prev.GetCallsign]을(를) [From.Owner.GetAdjective] 조종사들의 함정으로 유인했고, [Prev.GetCallsign]의 편대는 함정에 빠졌습니다. [From.GetCallsign]은(는) [Prev.Owner.GetAdjective] 항공기들을 전술적으로 완전히 압도했고, 단 한번의 집중 사격으로  [Prev.GetCallsign]은(는) 나선형을 그리며 [From.GetMissionRegion] 상공에서 추락했습니다.\n\n[Prev.GetFullName]은(는) 많은 [From.Owner.GetAdjective] 조종사들이 [Prev.GetHerHis] 실력을 두려워하게 만든 존재였습니다. 이 것은 위대한 승리이며, 장병들이 뛰어난 전쟁 영웅들을 따라 임무에 전념한다면 훌륭한 전과를 올릴 수 있다는 것을 보여줍니다."
 MD_ace_killed_other_ace.1.a: "모든 [From.Owner.GetName] 국민들이 이 승리를 기억할 것이다!"
 MD_aces_killed_each_other.1.t: "[From.GetFullName]의 추락"
 MD_aces_killed_each_other.1.d: "During the latest mission our famous [From.GetAceType] ace [From.GetFullName] ended up in a prolonged fight with the feared ace pilot, [Prev.GetFullName]. Being low on munitions and with no possibility of escape, [From.GetCallsign] maneuvered [From.GetHerHis] [From.GetWingShort] through the fire from the [Prev.Owner.GetAdjective] aircraft and proceeded to ram [Prev.GetCallsign].\nBoth [From.GetCallsign]'s [From.GetWingShort] and [Prev.GetCallsign]'s [Prev.GetWingShort] were spotted going down in pieces over [From.GetMissionRegion].\n\nWhile it is a small consolation that the [Prev.Owner.GetAdjective] menace, [Prev.GetCallsign], will no longer be a nuisance to us, we have lost a valued public figure and inspiration to all [From.Owner.GetAdjective]."
 MD_aces_killed_each_other.1.a: "우리의 큰 손실이다"