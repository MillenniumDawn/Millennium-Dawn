 ITA_infantry_weapons_1: "BM59"
 ITA_infantry_weapons_1_desc: "BM 59 — это автоматическая боевая винтовка, разработанная в Италии в 1959 году. Она создана на основе винтовки M1 Garand под патрон 7,62x51 мм НАТО, модифицирована для использования отъемного магазина и способна вести выборочный огонь. В более поздних модификациях были добавлены другие особенности, характерные для более современных винтовок."
