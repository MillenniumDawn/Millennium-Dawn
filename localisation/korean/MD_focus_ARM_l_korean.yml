 ARM_shiza_kavkaz_tt: "공화국들의 §R분리주의§!: §Y[SOO.GetNameWithFlag]§!, §Y[ADY.GetNameWithFlag]§!, §Y[CHE.GetNameWithFlag]§!, §Y[KBK.GetNameWithFlag]§!, §Y[DAG.GetNameWithFlag]§!에서 §G증가§!합니다"
 arm_levon.1.t: "아르메니아의 제안"
 arm_levon.1.d: "아르메니아의 새로운 중립 지위를 인정한다면, 캅카스의 직접적인 거점과 약간의 재정적 이익을 얻어 어느 정도 이득을 볼 수 있습니다."
 arm_levon.1.a: "좋소."
 arm_levon.1.b: "아니오, 우리는 아르메니아가 마음에 들지 않소."
