 COM.conservatism_desc: "（中间派改革主义者）- 共和党新生代未来组织\n\n"
 MAC.anarchist_communism: "£MAC_anarchist_communism 民众建澳联盟"
 MAC.anarchist_communism_icon: "£MAC_anarchist_communism"
 MAC.anarchist_communism_desc: "澳门公民协会是前葡萄牙属地、中国特别行政区澳门的一个政治团体。在澳门，政党作用并不明显，尽管一些民间团体在选举中提出候选人名单，并可能被视为政党。"
 ALB.oligarchism: "£ALB_non_aligned_oligarchism (MSh) - 阿尔巴尼亚黑帮"
 ALB.oligarchism_desc: "(寡头主义) - 阿尔巴尼亚黑帮\n\n阿尔巴尼亚黑帮作为一个统治集团，代表着以部族为基础的犯罪网络对国家的占领，这些犯罪网络是在20世纪90年代的崩溃、1997年的金字塔计划动乱以及科索沃战争的武器和难民流动中发展起来的。它不是一个政党，而是一个由家庭和以港口为基地的集团组成的网络，在实践中主张薄弱的司法机构、可渗透的边界和可以收买的政治阶层，并将贩运所得的利润洗白到建筑、旅游业和媒体领域。\n\n其实力源于大麻经济，正是大麻经济使拉扎拉特在2014年警方行动前成为欧洲毒品供应商；源于与拉丁美洲贩毒集团和恩德朗盖塔黑手党合作，经由都拉斯和发罗拉走私可卡因的路线；源于意大利和西欧的侨民网络。它对阿尔巴尼亚政治的影响力，在于金钱对低薪机构的影响力，而每个执政党都被指控与它沆瀣一气。"
 ALB.neutral_Social: "£ALB_neutral_Social (PSD) - 阿尔巴尼亚社会民主党"
 ALB.neutral_Social_desc: "(社会民主主义) - 阿尔巴尼亚社会民主党\n\n阿尔巴尼亚社会民主党是一个小型中左翼政党，由前教育部长斯肯德尔·吉努什于1991年3月创立，旨在成为改革后的共产党的西方式社会民主替代方案。该党于1992年至2014年间是社会党国际的成员。它主张建立福利国家、维护工人权利和促进欧洲一体化，同时批评社会党继承自旧政权。\n\n实际上，该党一直扮演着社会党的次要角色，自1997年加入社会党政府以来，其势力范围已缩小至斯库台和北部地区。自汤姆·多西于2020年12月就任主席以来，该党的格局深受其商业帝国以及美国在2018年对其提出的腐败指控的影响，并在2021年和2025年的地区选举中均赢得了三个席位。"
 ALB.Nat_Populism: "£ALB_Nat_Populism (PBK) - 阿尔巴尼亚民族阵线党"
 ALB.Nat_Populism_desc: "(阿尔巴尼亚民族主义) - 阿尔巴尼亚民族阵线党\n\n阿尔巴尼亚民族阵线党是1942年民族主义和反共抵抗运动“巴利·科姆贝塔尔”的复兴组织。该组织在战争中败给了恩维尔·霍查的游击队，后于1989年12月23日在巴黎由阿巴斯·埃尔门吉流亡期间重建。该党主张建立一个涵盖科索沃和北马其顿阿尔巴尼亚族地区的阿尔巴尼亚民族国家，恢复反共阵营的声誉，并对公共生活中的前共产党人采取强硬立场。\n\n实际上，它是一个被记忆而非选票的政党，1996 年以近5%的比例获得两个席位，直到2001年通过胜利联盟才再次进入议会。自2003年在阿德里亚蒂克·阿利马迪领导下以来，它一直处于右翼边缘，其影响力在于它在科索沃或马其顿危机时刻为联盟提供的民族主义象征意义。"
 ALB.Nat_Fascism: "£ALB_Nat_Fascism (PUK) - 民族团结党"
 ALB.Nat_Fascism_desc: "(超民族主义) - 民族团结党\n\n民族团结党是一个极右翼泛阿尔巴尼亚政党，由伊达杰特·贝奇里于1991年3月创立。该党主张，只有将阿尔巴尼亚、科索沃以及马其顿、黑山和希腊境内的阿尔巴尼亚人聚居区统一为一个邦联，才能解决阿尔巴尼亚问题；如果邻国拒绝，则诉诸武力。该党拒绝主流民族主义的妥协，并将1998年至2001年冲突中的武装团体视为真正的民族运动。\n\n该党的历史与其说是选举史，不如说是起诉史。1996年，贝奇里因国际特赦组织认定为政治罪名被判处15年监禁；2003年，他因作为阿尔巴尼亚国民军领导人煽动种族仇恨而被通缉；2004年，他在德国被捕并被引渡回国。该党从未赢得过任何席位，其影响力主要来自它所代表的激进边缘群体。"
 AUS.oligarchism: "£generic_oligarchism_small (DU) - 独立党 - 鲁格纳的名单"
 AUS.oligarchism_desc: "(民粹主义) - 独立党 - 鲁格纳的名单\n\n独立党是维也纳建筑巨头、购物中心业主和社会名流理查德·卢格纳的个人政党。他于1998年创立该党，此前他曾竞选联邦主席，并赢得了近十分之一的选票。该党除了其创始人秉持的常识性保守主义之外，并无其他意识形态：废除联邦参议院，削减国家开支，以补贴工资而非发放福利，并让长期失业者就业。\n\n它与其说是一场运动，不如说是商人实现野心的工具，由他本人在其办公室运作，并由其财富资助，其进入议会的希望随着1999年的选举而破灭。卢格纳的名望仍然是它唯一的政治资产。"
 AUS.Neutral_Libertarian: "£generic_Neutral_Libertarian_small (PIRAT) - 奥地利海盗党"
 AUS.Neutral_Libertarian_desc: "(海盗政治) - 奥地利海盗党\n\n奥地利海盗党由弗洛里安·胡夫斯基和一群程序员及活动家于2006年创立，其模式效仿瑞典海盗党。该党主张改革版权和专利法，保护隐私和数据免受国家监控，提高政府透明度，并保障民众不受限制地获取知识和文化。此后，该党将这些主张扩展为一项涵盖直接民主、无条件基本收入和公民自由的总体纲领。\n\n该党组织形式为线上，立场通过公开投票决定，从未进入过国民议会；其唯一的立足点是格拉茨市的市政政治。其扁平化的组织结构使得加入容易，但领导层却难以形成，而一旦其数字化纲领获得认可，其他大党便会采纳。"
 AUS.neutral_Social: "£generic_neutral_Social_small (PILZ) - 彼得·皮尔茨名单"
 AUS.neutral_Social_desc: "(左翼民粹主义) - 彼得·皮尔茨名单\n\n彼得·皮尔茨名单是绿党任期最长的代表、绿党最著名的议会调查员彼得·皮尔茨于2017年创立的政党，此前他所在的政党拒绝将他列入名单上。它提供了一种左翼民粹主义的社会正义、财富的重新分配、反对政治伊斯兰和腐败的强硬路线以及捍卫中立性，被包装为一场反对建制派的单人运动，而不是一项纲领。\n\n该党与绿党争夺同一批城市左翼选票，然后又疲于应对围绕其创始人的丑闻和党员的叛逃。皮尔茨的个人声誉是该党唯一的资本。"
 AUS.Neutral_Communism: "£generic_Neutral_Communism_small (VRAÖ) - 奥地利革命工人联盟（马列主义派）"
 AUS.Neutral_Communism_desc: "(马列主义) - 奥地利革命工人联盟（马列主义派）\n\n奥地利革命工人联盟由阿尔弗雷德·约查及其《冯克报》和《共产主义者报》的支持者于1968年创立。该联盟是奥地利马克思列宁主义党分裂出来的毛派组织，而奥地利马克思列宁主义党本身也因苏联修正主义问题与奥地利共产党决裂。该联盟坚持马克思、恩格斯、列宁、斯大林和毛泽东的正统路线，主张无产阶级专政，反对议会工作，并呼吁抵制选举而非参与竞选。\n\n到世纪之交，它已沦为一个仅有几十名成员、报纸出版不规律的休眠派别，对其声称领导的劳工运动毫无影响力。它是20世纪六七十年代奥地利毛主义思潮的最后残余。"
 HAI.Neutral_green: "£HAI_neutral_green 农民代表党"
 HAI.Neutral_green_desc: "农业主义 - 农民代表党是一个成立于2010年7月的政党，旨在应对当年摧毁国家的地震。该组织的成立归功于米歇尔·马泰利，一位康巴音乐家，以他的艺名“甜米奇”而闻名，在灾难导致国家状况恶化后，他正式加入政坛。"
 HAI.Nat_Populism: "£HAI_nationalist_populism (AAA) - 海地行动"
 HAI.Nat_Populism_desc: "(联邦民族主义)\n海地行动（Ayiti an Aksyon）\n\n同时是一个民族主义和联邦主义政党。成立于2005年，该党最初寻求为拉蒂博尼特省实现地区主义控制和自决，此后不久便开始推动整体上的权力下放和联邦主义。"
 HAI.Nat_Fascism: "£HAI_nationalist_fascism (PUN) - 民族团结党"
 HAI.Nat_Fascism_desc: "(极权黑人民族主义)\n民族统一党\n\n该党最初成立于1957年，是在弗朗索瓦·“老爹”·杜瓦利埃领导下作为一个反美和海地民族主义政党而创建的。\n\n随着老爹统治的延续，该党变得越来越专制，利用他们令人恐惧的“通顿马库特”镇压一切反对派。老爹杜瓦利埃曾利用通顿马库特搜寻并杀死所有黑狗，因为他相信通顿马库特的前领导人克莱芒·巴尔博已将自己变成了一条黑狗。"
