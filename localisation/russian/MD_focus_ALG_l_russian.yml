 ALG_mio_header_naval_construction: "Военно-морское строительство"
 ALG_mio_header_surface_vessels: "Надводные суда"
 ALG_mio_header_submarine_construction: "Строительство подводных лодок"
 ALG_mio_header_aircraft_maintenance: "Техническое обслуживание самолетов"
 ALG_khenchela_trait_desert_hardened: "Оборудование, закалённое в пустыне"
 ALG_khenchela_trait_desert_hardened_desc: "Оружие, разработанное и испытанное специально для условий Сахары, с улучшенной пылезащитой и термостойкостью."
 ALG_khenchela_trait_simplified_maintenance: "Упрощенное техническое обслуживание"
 ALG_khenchela_trait_simplified_maintenance_desc: "Оптимизированные конструкции, снижающие требования к техническому обслуживанию и затраты на замену деталей."
 ALG_khenchela_trait_standardized_production: "Стандартизированные производственные линии"
 ALG_khenchela_trait_standardized_production_desc: "Внедрить унифицированные производственные процессы для повышения эффективности производства."
 ALG_khenchela_trait_mass_production_focus: "Ориентация на массовое производство"
 ALG_khenchela_trait_mass_production_focus_desc: "Расширить производственные мощности для удовлетворения потребностей многочисленной постоянной армии."
 ALG_seriana_trait_kalashnikov_expertise: "Экспертиза по автоматам Калашникова"
 ALG_seriana_trait_kalashnikov_expertise_desc: "Многолетний опыт производства винтовок типа АК обеспечивает превосходную надежность и огневую мощь."
 ALG_seriana_trait_licensed_production: "Лицензированная эффективность производства"
 ALG_seriana_trait_licensed_production_desc: "Оптимизированы производственные линии для выпуска оружия зарубежной разработки по лицензии."
 ALG_seriana_trait_cost_reduction: "Меры по снижению затрат"
 ALG_seriana_trait_cost_reduction_desc: "Внедряйте экономичные производственные технологии без ущерба для качества."
 ALG_dgi_trait_atgm_development: "Программа разработки ПТУР"
 ALG_dgi_trait_atgm_development_desc: "Разработка отечественных противотанковых управляемых ракет позволит снизить зависимость от зарубежных производителей."
 ALG_dgi_trait_manpads_systems: "ПЗРК"
 ALG_dgi_trait_manpads_systems_desc: "Переносные зенитные ракетные комплексы для пехотных и лёгких подразделений."
 ALG_dgi_trait_artillery_modernization: "Модернизация артиллерии"
 ALG_dgi_trait_artillery_modernization_desc: "Модернизация существующих артиллерийских орудий с помощью современных систем управления огнём и наведения."
 ALG_dgi_trait_cnc_integration: "Интеграция систем C3I"
 ALG_dgi_trait_cnc_integration_desc: "Интегрировать системы управления, контроля, связи и разведки на всех платформах."
 ALG_dgi_trait_mass_production: "Инициатива массового производства"
 ALG_dgi_trait_mass_production_desc: "Наращивать производственные мощности для удовлетворения потребностей, связанных с расширением военных операций."
 ALG_bcl_trait_desert_adaptation: "Пакет мер по адаптации к условиям пустыни"
 ALG_bcl_trait_desert_adaptation_desc: "Специализированные модификации для эксплуатации в пустыне, включая улучшенную систему охлаждения и пылефильтрацию."
 ALG_bcl_trait_soviet_refurbishment: "модернизация советской техники"
 ALG_bcl_trait_soviet_refurbishment_desc: "Опыт в капитальном ремонте и модернизации бронетехники советской эпохи с минимальными затратами."
 ALG_bcl_trait_reactive_armor: "Интеграция реактивной брони"
 ALG_bcl_trait_reactive_armor_desc: "Для повышения защиты от кумулятивных зарядов следует добавить динамическую защиту."
 ALG_bcl_trait_apc_modernization: "Программа модернизации APC"
 ALG_bcl_trait_apc_modernization_desc: "Комплексная модернизация бронетранспортеров и боевых машин пехоты."
 ALG_bcl_trait_production_efficiency: "Повышение эффективности производства"
 ALG_bcl_trait_production_efficiency_desc: "Оптимизация сборочных процессов для увеличения производительности."
 ALG_snvi_trait_saharan_proven: "Проверенные в Сахаре проекты"
 ALG_snvi_trait_saharan_proven_desc: "Транспортные средства прошли всесторонние испытания в условиях пустыни для обеспечения максимальной надежности."
 ALG_snvi_trait_mercedes_partnership: "Партнерство Mercedes-Benz"
 ALG_snvi_trait_mercedes_partnership_desc: "Лицензионное производство коммерческих автомобилей Mercedes-Benz на платформах, адаптированных для военного применения."
 ALG_snvi_trait_mass_production: "Расширение массового производства"
 ALG_snvi_trait_mass_production_desc: "Расширение производственных мощностей для удовлетворения возросшего военного спроса."
 ALG_snvi_trait_cost_reduction: "Оптимизация затрат"
 ALG_snvi_trait_cost_reduction_desc: "Снижение себестоимости единицы продукции за счет повышения эффективности производства."
 ALG_enmib_trait_maintenance_expertise: "Экспертиза в области технического обслуживания и капитального ремонта."
 ALG_enmib_trait_maintenance_expertise_desc: "Специализированные знания в области технического обслуживания вертолетов продлевают срок службы и повышают надежность."
 ALG_enmib_trait_licensed_assembly: "Лицензированные сборочные операции"
 ALG_enmib_trait_licensed_assembly_desc: "Сборка вертолетов по зарубежным проектам по лицензии с меньшими затратами."
 ALG_enmib_trait_production_expansion: "Расширение производственных мощностей"
 ALG_enmib_trait_production_expansion_desc: "Расширение производственных мощностей для увеличения объемов выпуска вертолетов."
 ALG_mek_trait_mediterranean_design: "Средиземноморский военно-морской дизайн"
 ALG_mek_trait_mediterranean_design_desc: "Корабли, оптимизированные для операций в Средиземном море, отличаются повышенной скоростью и эффективностью."
 ALG_mek_trait_patrol_vessel_expertise: "Экспертиза патрульных судов"
 ALG_mek_trait_patrol_vessel_expertise_desc: "Компания специализируется на строительстве быстроходных патрульных катеров с расширенными возможностями обнаружения."
 ALG_mek_trait_shipyard_expansion: "Программа расширения верфи"
 ALG_mek_trait_shipyard_expansion_desc: "Расширить производственные мощности верфи для увеличения объемов строительства."
 ALG_cnan_trait_frigate_construction: "Возможности строительства фрегатов"
 ALG_cnan_trait_frigate_construction_desc: "Развивать потенциал для строительства современных фрегатов и эсминцев."
 ALG_cnan_trait_anti_air_systems: "Морские зенитные системы"
 ALG_cnan_trait_anti_air_systems_desc: "Интегрировать современные зенитные системы в надводные корабли."
 ALG_cnan_trait_submarine_assembly: "Сборка подводной лодки"
 ALG_cnan_trait_submarine_assembly_desc: "Лицензионная сборка дизель-электрических подводных лодок с привлечением иностранной технической помощи."
 ALG_cnan_trait_foreign_assistance: "Иностранная техническая помощь"
 ALG_cnan_trait_foreign_assistance_desc: "Партнерство с зарубежными судостроителями ускоряет технологическое развитие."
 ALG_cnan_trait_shipyard_modernization: "Модернизация верфи"
 ALG_cnan_trait_shipyard_modernization_desc: "Модернизация судостроительных объектов с использованием передового строительного оборудования."
 ALG_ersa_trait_mro_expertise: "Экспертиза в области технического обслуживания и ремонта"
 ALG_ersa_trait_mro_expertise_desc: "Высокий уровень квалификации специалистов по техническому обслуживанию, ремонту и капитальному ремонту обеспечивает максимальную надежность воздушных судов."
 ALG_ersa_trait_licensed_assembly: "Лицензированная сборка самолетов"
 ALG_ersa_trait_licensed_assembly_desc: "Сборка зарубежных моделей самолетов по лицензии с меньшими затратами."
 ALG_ersa_trait_transport_specialization: "Специализация на транспортных самолётах"
 ALG_ersa_trait_transport_specialization_desc: "Основное внимание уделяется военно-транспортным самолетам с увеличенной дальностью полета и повышенной эффективностью."
 ALG_ersa_trait_production_expansion: "Инициатива по расширению производства"
 ALG_ersa_trait_production_expansion_desc: "Расширение производственных мощностей для увеличения объемов выпуска самолетов."
 ALG_resistance_power_struggle: "Борьба за власть"
 ALG_resistance_power_struggle_desc: "Между алжирским народом и движением «Ле Пувуар» бушует тихая война. Обе стороны стремятся укрепить свою поддержку до тех пор, пока неизбежное столкновение не решит будущее Алжира."
 Resistance_support: "Поддержите сопротивление"
 Resistance_support_desc: "Направьте ресурсы на поддержку низовых движений, протестов и подпольных сетей, укрепляя народное сопротивление правящей элите."
 ALG_increase_resistance_tt: "§YНарод становится сильнее, а влияние армии уменьшается.§!"
 Le_Pouvoir_support: "Поддержите *Le Pouvoir*"
 Le_Pouvoir_support_desc: "Прямая поддержка укоренившейся элиты, укрепление её контроля над армией и ослабление недовольства народа."
 ALG_increase_pouvoir_tt: "§YАрмия укрепляет контроль, в то время как народ теряет темп.§!"
 Resistance_Final_Clash: "Финальное столкновение"
 Resistance_Final_Clash_desc: "Конфликт между Сопротивлением и движением «Ле Пувуар» достиг своего пика. Ближайшие месяцы определят, кто на самом деле будет править Алжиром."
 alg_resistance.1.t: "Народ торжествует!"
 alg_resistance.1.d: "Голоса народа поднялись против правящей элиты. Массовые демонстрации и организация протестов на местах вынудили правительство уступить. Алжир вступает в новую эру демократического правления."
 alg_resistance.1.a: "Народ высказался."
 alg_resistance.2.t: "Ле Пувуар подавляет сопротивление"
 alg_resistance.2.d: "Укоренившаяся элита, при поддержке армии, успешно подавила сопротивление. Статус-кво сохраняется, но тлеющее недовольство грозит будущими беспорядками."
 alg_resistance.2.a: "Порядок восстановлен."
 alg_resistance.3.t: "Страна в хаосе"
 alg_resistance.3.d: "Ни Сопротивлению, ни Ле Пувуару не удалось установить господство. Образовавшийся вакуум власти погрузил Алжир в хаос, где за контроль борются военные диктаторы и различные фракции."
 alg_resistance.3.a: "Страна балансирует на грани краха."
 alg_resistance.4.t: "Алжирский кризис обостряется"
 alg_resistance.4.d: "Хрупкая хунта не в состоянии удержать государство вместе, и Алжир всё глубже погружается в хаос. Офицеры могут либо передать страну гражданскому правительству, пока ещё есть что возвращать, либо укрепиться и позволить вооруженным группировкам прийти к власти."
 alg_resistance.4.a: "Передайте власть гражданскому правительству."
 ALG_african_union_tt: "Алжир укрепляет свои связи внутри §YАфриканский Союз§!улучшение отношений с африканскими государствами-членами."
 KBY_alg_modifier_desc: "Малороссия — государство, созданное сравнительно недавно, его внутренняя и внешняя политика полностью подчинены Москве, но при этом оно обладает значительной автономией во внутренней и внешней политике."
 KBY_new_state: "Земля для берберов"
 KBY_new_state_desc: "Наконец, истинные наследницы этих земель, берберы, возьмут власть в свои руки."
 KBY_constitution: "Конституция Кабилии"
 KBY_constitution_desc: "Нам необходимо формализовать законодательное собрание нашего штата. Для этого мы примем собственную конституцию."
 KBY_drs: "Сотрудничество с DRS"
 KBY_fsb_desc: "К сожалению, у нас пока нет возможности создать собственные специализированные службы, поэтому мы будем полагаться на сотрудничество с алжирской службой DRS."
 KBY_mvd: "Подчиняется местному министерству внутренних дел."
 KBY_mvd_desc: "Мы подчиним себе местные органы Министерства внутренних дел, которые находились под французской властью."
 KBY_ter_defence: "Территориальная оборона"
 KBY_ter_defence_desc: "Мы создадим территориальную оборону из местных ополченцев."
 KBY_contract_army: "Контрактная армейская система"
 KBY_contract_army_desc: "Наша армия будет создана в соответствии с контрактной системой."
 KBY_defence_doctrine: "Оборонительная доктрина"
 KBY_defence_doctrine_desc: "Мы ни на кого не нападаем, наша задача — защищать наши границы. Наша армия будет придерживаться доктрины оборонительной тактики."
 KBY_nat_guard: "Национальная гвардия Кабилии"
 KBY_nat_guard_desc: "В 80-х годах в Алжире существовала национальная гвардия. Мы воссоздадим это подразделение, но уже под нашим командованием."
 KBY_defence_prom: "Военная промышленность"
 KBY_defence_prom_desc: "Мы вложим значительные средства в восстановление военной промышленности на нашей территории. Нам нужна сильная армия."
 KBY_rebuild_war_academy: "Военные школы"
 KBY_rebuild_war_academy_desc: "Наши бойцы должны иметь лучшую подготовку для защиты своей родины. Поэтому мы возродим военные академии на нашей территории."
 KBY_no_corrupt_military: "Необходимо серьезно сократить коррупцию в армии."
 KBY_no_corrupt_military_desc: "Наша армия ещё молода, поэтому искоренить в ней коррупцию гораздо проще."
 KBY_nation_quest: "Национальный вопрос"
 KBY_nation_quest_desc: "Кабилия была и будет частью Алжира, это наш ответ на национальный вопрос."
 KBY_referendum: "Референдум о судьбе Кабилии"
 KBY_referendum_desc: "Наступил роковой момент, когда мы должны решить, по какому пути пойдет наша страна. Станет ли она полноценной частью России в виде республики, или мы выберем путь Союзного государства"
 KBY_dinar: "Динар как государственная валюта"
 KBY_dinar_desc: "Динар станет нашей государственной валютой, в этом никто даже не сомневался."
 KBY_corruption: "Борьба с коррупцией"
 KBY_corruption_desc: "Несмотря на то, что наше государство ещё молодое, коррупция в нём уже началась. Нам необходимо с этим бороться."
 KBY_isr_invest: "Израильские инвестиции"
 KBY_isr_invest_desc: "Израиль поддерживает нас своими инвестициями."
 KBY_build_factories: "Строительство заводов"
 KBY_build_factories_desc: "Стране нужны заводы и фабрики, мы обеспечим наших людей всем необходимым."
 KBY_social_invest: "Инвестиции в социальную сферу"
 KBY_social_invest_desc: "Наши граждане должны иметь доступ к медицинским учреждениям самого высокого качества, а также ко всем социальным гарантиям."
 KBY_infrastructure: "Инвестиции в инфраструктуру"
 KBY_infrastructure_desc: "Дороги — это вены нашего штата."
 KBY_fight_oligarch: "Борьба против олигархов"
 KBY_fight_oligarch_desc: "Даже в нашем молодом государстве уже начали появляться коррумпированные олигархи, нажившие огромные деньги на войне. Давайте с ними разберемся."
 KBY_it_invest: "Инвестиции в ИТ"
 KBY_it_invest_desc: "Мы будем инвестировать в информационные технологии для успешного развития нашей страны."
 KBY_maloross_economy: "Экономика Кабилии"
 KBY_maloross_economy_desc: "Наши экономические меры привели к росту нашей экономики."
 KBY_union_state: "Союзный штат"
 KBY_union_state_desc: "Мы выбрали путь Союзного государства"
 KBY_union_group_army: "Объединенная группировка войск"
 KBY_union_group_army_desc: "Наши солдаты войдут в состав объединенного объединения войск Союза."
 KBY_union_group_economic: "Инвестиции штата Юнион"
 KBY_union_group_economic_desc: "Членство в Союзном государстве оказало положительное влияние на нашу экономику."
 KBY_union_health_social: "Сотрудничество с социальной и медицинской сферами"
 KBY_union_health_social_desc: "Члены Союзного государства активно сотрудничают в социальной и медицинской сферах."
 KBY_republic_rf: "Мы — часть Алжира"
 KBY_republic_rf_desc: "Мы стали республикой Алжир, и теперь наша судьба связана с ней."
 KBY_alg_regions: "Сотрудничество с регионами Алжира"
 KBY_alg_regions_desc: "Мы будем активно сотрудничать с другими регионами Алжира."
 KBY_fra_companies: "Сотрудничество с французскими компаниями"
 KBY_fra_companies_desc: "Французские компании станут нашими главными партнерами."
 KBY_integrate_army: "Интегрировать в алжирскую армию"
 KBY_integrate_army_desc: "Мы приведем нашу армию в соответствие со стандартами алжирской армии."
 ALG_legacy_of_independence_war: "Наследие Алжирской войны за независимость"
 ALG_legacy_of_independence_war_desc: "Борьба против французского колониального господства сформировала сильное чувство национальной идентичности и единства. Это непреходящее наследие укрепляет нашу политическую мощь, ускоряет исследования и модернизацию, а также усиливает влияние Алжира за рубежом. Тем не менее, идеологические разногласия и историческая память продолжают формировать общественное мнение и внешние отношения."
 ALG_new_nobility_idea: "Возрожденное Благородство"
 ALG_new_nobility_idea_desc: "Восстанавливая привилегии знати и создавая лояльную аристократию, монархия укрепляет свою власть, вознаграждая лояльность влиянием и престижем."
 ALG_state_islam_idea: "Ислам как государство"
 ALG_state_islam_idea_desc: "Монархия формализует ислам как руководящий принцип государства, наделяя улемов полномочиями и внедряя шариат в систему управления за счет научного прогресса."
 ALG_andalus_crusade_idea: "Наследие Аль-Андалуса"
 ALG_andalus_crusade_idea_desc: "Мечта о возвращении Аль-Андалуса подпитывает дело халифата, вдохновляет воинов и легитимизирует экспансию по всему Иберийскому полуострову."
 ALG_maghribi_identity_idea: "Магрибская идентичность"
 ALG_maghribi_identity_idea_desc: "Монархия способствует формированию самобытной магрибской идентичности, основанной на общей культуре и единстве, укрепляя стабильность и одновременно дистанцируясь от иностранного влияния."
 ALG_maghribi_identity_idea_two: "Истинный магрибизм"
 ALG_maghribi_identity_idea_two_desc: "От Марокко до Ливии Магриб объединяется под единой судьбой. Монархия воплощает это видение, сокращая иностранное вмешательство и сплачивая регион."
 ALG_renewed_nobility_idea: "Восстановлено рыцарское звание"
 ALG_renewed_nobility_idea_desc: "Рыцари королевства возвращаются, почитаемые как верная военная и политическая элита. Их возобновлённая роль укрепляет власть монархии, одновременно снижая издержки на руководство."
 ALG_going_to_roots: "Возвращение к нашим корням"
 ALG_going_to_roots_desc: "Как магрибская, так и андалузская династии заложили основу алжирской идентичности. Приняв эти традиции, мы объединим прошлое и настоящее в единое видение будущего нации."
 ALG_state_islam: "Ислам как государственная вера"
 ALG_state_islam_desc: "Религия всегда направляла народ Алжира. Провозглашая ислам основой монархии, мы укрепляем свою легитимность, завоевываем расположение улемов и усиливаем единство верующих."
 ALG_restore_knighthood: "Восстановить рыцарское звание"
 ALG_restore_knighthood_desc: "В эпоху империй воинские и дворянские ордена защищали нашу землю и веру. Мы восстановим эти рыцарские ордена, чтобы они служили престолу и внушали верность в оружии."
 ALG_andalus_legacy: "Наследие Аль-Андалуса"
 ALG_andalus_legacy_desc: "Наше возрождение Андалусии – это не только вопрос трона. Это вопрос возрождения утраченной гордости мусульман, изгнанных из Иберии столетия назад. Мы будем расширять свое влияние и напоминать Европе, что Аль-Андалус не забыт."
 ALG_our_old_realm: "Наше Старое Королевство"
 ALG_our_old_realm_desc: "Когда-то мы правили частью Иберии под знаменем аль-Андалуса. Теперь, с помощью дипломатических попыток и исторической памяти, мы предъявим права на наши старые земли и подготовим почву для их возвращения."
 ALG_renewed_nobility: "Возрожденное Благородство"
 ALG_renewed_nobility_desc: "Необходимо создать новые дворянские дома, которые будут служить монархии. Старые семьи будут восстановлены, а новые элиты возведены в ранг лидеров, чтобы обеспечить Алжир верными слугами короны."
 ALG_politic_outreach_iberia: "Политическая работа на Пиренейском полуострове"
 ALG_politic_outreach_iberia_desc: "Поддерживая сочувствующие силы в Испании и Португалии, мы можем расширить влияние Алжира на запад. Наша поддержка иберийских движений укрепит наши претензии и ослабит их государства."
 ALG_fate_of_spain: "Судьба Испании"
 ALG_fate_of_spain_desc: "Испания расположена на земле наших предков. Теперь ее судьба может решиться рукой Алжира: путем объединения, возвращения или завоевания."
 ALG_true_maghribism: "Истинный магрибизм"
 ALG_true_maghribism_desc: "Пришло время заявить о нашем собственном видении, идеологии, основанной на магрибской идентичности, исламском единстве и монархической гордости. Доктрина магрибизма вдохновит на создание нового порядка по всей Северной Африке."
 ALG_glory_of_andalus_idea: "Слава Аль-Андалуса"
 ALG_glory_of_andalus_idea_desc: "Культурное возрождение, вдохновленное наследием Аль-Андалуса, придает силы нашим ученым, ремесленникам и правителям. Оно объединяет нацию на основе общей гордой памяти."
 ALG_spain_algeria_union_tt: "Открывает возможность принятия решений о союзе с Испанией под властью алжирской монархии."
 ALG_trade_with_arabic_nations_tt: "Алжир заключает улучшенные торговые соглашения со всеми арабскими странами."
 ALG_loas_influence_tt: "Алжир наращивает свое влияние среди государств-членов Лиги арабских государств посредством дипломатических усилий и соглашений о дружбе."
 ALG_isr_threat: "Алжир осуждает израильскую агрессию"
 ALG_palestinian_aid_package_tt: "Алжир оказывает помощь Палестине и усиливает свое влияние во всех странах Ближнего Востока."
 ALG_african_union_reforms_tt: "Алжир заключил улучшенные торговые соглашения со всеми государствами-членами ОАУ."
 ALG_mutual_defense_idea: "Взаимная оборона"
 ALG_mutual_defense_idea_desc: ""
 ALG_the_State: "Государство Алжир"
 ALG_unlocks_focus_for_us: "§CРазблокирует решение, которое позволит нам убрать отрицательные модификаторы, получаемые от этого!§!"
 ALG_activate_from_event: "§HЭти фокусы активируются в результате события или решения§!"
 ALG_our_society: "Алжирское общество"
 ALG_our_society_desc: "Алжирское общество постоянно меняется и развивается, превращаясь во что-то новое. Хотя роль правительства в этом вопросе обычно ограничена из-за определенных обстоятельств, бывали случаи, когда нам приходилось вмешиваться, и будут случаи, когда нам придется вмешиваться, чтобы внести изменения в нашу политику."
 ALG_DRS: "DRS"
 ALG_DRS_desc: "DRS — это разведывательное агентство нашей страны, задача которого — защита правительства и политики страны от внутренних и внешних угроз."
 ALG_domestic_focus: "Внутренние проблемы"
 ALG_domestic_focus_desc: "DRS следует сосредоточиться на защите страны от внутренних угроз, таких как действия злоумышленников, стремящихся свергнуть правительство путем распространения опасных идей."
 ALG_foreign_focus: "Иностранная направленность"
 ALG_foreign_focus_desc: "ДРС следует опасаться угроз извне, поскольку никто не захочет причинить вред своей собственной стране."
 ALG_disaster_relief: "План действий в случае стихийного бедствия"
 ALG_disaster_relief_desc: "В настоящее время у нас нет плана действий на случай чрезвычайных ситуаций, а это значит, что мы не готовы защищать наших граждан и оказывать им помощь."
 ALG_charity_based: "Создать систему, возглавляемую благотворительными организациями."
 ALG_charity_based_desc: "Благотворительные организации окажут поддержку нашим людям в случае стихийных бедствий, поэтому мы сможем значительно сократить расходы."
 ALG_government_reliant: "Создать систему под руководством правительства"
 ALG_government_reliant_desc: "Задача правительства — оказывать помощь своему народу в случае стихийных бедствий, даже если это означает увеличение расходов."
 ALG_migration_problems: "Проблемы миграции"
 ALG_migration_problems_desc: "У нас всегда были проблемы с притоком мигрантов в страну. Но мы никогда не знали, что с ними делать после того, как их проблемы разрешались на родине."
 ALG_open_door_policy: "Политика открытых дверей"
 ALG_open_door_policy_desc: "Выбрав политику открытых дверей, мы сможем легко использовать прибывающих мигрантов для улучшения и развития нашей страны."
 ALG_closed_borders: "Закрыть границы"
 ALG_closed_borders_desc: "Мы можем полностью избавиться от мигрантов, прибывающих в страну, просто закрыв наши границы, и таким образом решить наши проблемы."
 ALG_drug_problem: "Проблема наркотиков"
 ALG_drug_problem_desc: "Иногда лекарства необходимы в медицинских целях, но это не мешает некоторым людям злоупотреблять системой и использовать их в рекреационных целях, что приводит к опасным последствиям."
 ALG_tighten_punishments: "Более жёсткая позиция"
 ALG_tighten_punishments_desc: "Мы будем привлекать к уголовной ответственности любого, кто употребляет наркотики не в медицинских целях, независимо от его оправдания."
 ALG_relax_restrictions: "Смягчить нашу позицию"
 ALG_relax_restrictions_desc: "Даже если наши люди хотят употреблять наркотики в рекреационных целях, почему нас это должно волновать? Возможно, нам просто следует позволить им делать то, что они хотят, даже если это сопряжено с определенными рисками."
 ALG_rising_nationalism: "Подъем национализма"
 ALG_rising_nationalism_desc: "Несмотря на то, что национализм — это хорошо, его избыток может быть вреден. Национализм внутри страны порождает проблемы и конфликты между меньшинствами."
 ALG_utilize_it: "Используйте национализм"
 ALG_utilize_it_desc: "Мы будем использовать национализм в своих интересах, таким образом враг поймет, что алжирский народ не будет сидеть сложа руки во время войны."
 ALG_combat_it: "Боритесь с этим"
 ALG_combat_it_desc: "Нам придётся бороться с национализмом, поскольку мы не можем допустить дальнейшей нестабильности в пределах границ нашей страны."
 ALG_charity_disasters: "План благотворительного забега"
 ALG_charity_disasters_desc: "Наш план действий в чрезвычайных ситуациях основан на доброте и пожертвованиях граждан для оказания помощи нуждающимся."
 ALG_government_led_disasters: "План, разработанный правительством"
 ALG_government_led_disasters_desc: "Правительство будет оказывать помощь людям, пострадавшим от стихийных бедствий, а не благотворительным организациям, хотя они также могут оказывать помощь по своему желанию."
 ALG_drugs_illegalized: "Наркотики криминализированы"
 ALG_drugs_illegalized_desc: "Если кто-либо употребляет наркотики не в медицинских целях, он столкнется с проблемами с законом."
 ALG_drugs_legalized: "Легализация наркотиков"
 ALG_drugs_legalized_desc: "Нам, честно говоря, всё равно, для чего люди употребляют наркотики, это всё равно их жизнь."
 ALG_drs_idea_1: "Военизированная полиция"
 ALG_drs_idea_1_desc: "Полиция была реорганизована в военизированное формирование, способное бороться с терроризмом, беспорядками и волнениями, что усилило ее роль во внутренней безопасности Алжира."
 ALG_drs_idea_2: "Сильно милитаризированная полиция"
 ALG_drs_idea_2_desc: "В настоящее время полиция действует как хорошо вооруженная военизированная структура, оснащенная передовым оборудованием и имеющая тесные связи с армией, что размывает границы между гражданской безопасностью и военным контролем."
 ALG_drs_idea_3: "Интегрированная военизированная полиция"
 ALG_drs_idea_3_desc: "Наши полицейские силы полностью интегрированы в аппарат безопасности и действуют бок о бок с армией в борьбе с терроризмом, охране границ и внутреннем наблюдении."
 ALG_riot_police_idea: "Полиция по борьбе с беспорядками"
 ALG_riot_police_idea_desc: "Специализированное подразделение полиции, созданное для борьбы с протестами, демонстрациями и социальными волнениями. Они оснащены средствами контроля за толпой и действуют с упором на поддержание стабильности режима."
 ALG_algerian_special_forces: "Сформировать алжирский спецназ"
 ALG_algerian_special_forces_desc: "Угрозы безопасности Алжира требуют наличия элитных подразделений, способных к быстрому реагированию и борьбе с терроризмом. Создание специализированных сил укрепит нашу оборону как от внутренних беспорядков, так и от внешних угроз."
 ALG_BRI: "Расширить ОПОП"
 ALG_BRI_desc: "Бригада по поиску и вмешательству (BRI) — это специализированное полицейское подразделение, обученное освобождению заложников и проведению операций высокого риска. Увеличение их численности и ресурсов повысит безопасность в городах."
 ALG_al_saiqa: "Подразделения «Аль-Саика»"
 ALG_al_saiqa_desc: "Специальные военизированные подразделения по подавлению массовых беспорядков и борьбе с повстанцами укрепят нашу способность поддерживать закон и порядок в периоды гражданских волнений."
 ALG_al_hars_al_watani: "Национальная гвардия"
 ALG_al_hars_al_watani_desc: "Национальная гвардия безопасности будет обеспечивать местную безопасность в уязвимых районах, высвобождать ресурсы армии и поддерживать порядок в кризисных ситуациях."
 ALG_haras_al_hudod: "Подразделения пограничной охраны"
 ALG_haras_al_hudod_desc: "Специализированные подразделения, патрулирующие наши границы, будут пресекать контрабанду, предотвращать проникновение посторонних лиц и укреплять оборону границы Алжира."
 ALG_central_armed_police: "Центральная вооруженная полиция"
 ALG_central_armed_police_desc: "Объединение вооруженной полиции в централизованное командование позволит улучшить время реагирования и повысить эффективность, обеспечив более надежную защиту от организованных угроз."
 ALG_border_security_force: "Пограничная служба безопасности"
 ALG_border_security_force_desc: "Создав специализированное подразделение для пограничного наблюдения и пресечения незаконной торговли, Алжир сможет пресечь деятельность сетей контрабанды и вооруженного проникновения."
 ALG_firqat_tadakhol_al_sariye: "Отделение быстрого реагирования"
 ALG_firqat_tadakhol_al_sariye_desc: "Элитные подразделения быстрого реагирования позволят Алжиру оперативно наносить удары по террористическим ячейкам и разрешать назревающие кризисы до того, как они перерастут в эскалацию."
 ALG_expanding_BRI: "Расширение возможностей ОПОП"
 ALG_expanding_BRI_desc: "При наличии дополнительного финансирования, обучения и современного оборудования инициатива «Один пояс и один путь» может превратиться в грозное подразделение по борьбе с терроризмом и освобождению заложников, способное конкурировать с лучшими в регионе."
 ALG_increase_police_funding: "Увеличить финансирование полиции"
 ALG_increase_police_funding_desc: "Увеличение инвестиций в нашу полицию и жандармерию укрепит внутреннюю стабильность, повысит общественную безопасность и улучшит устойчивость Алжира к беспорядкам."
 ALG_drs_expand: "Развернуть DRS"
 ALG_drs_expand_desc: "Департамент разведки и безопасности (DRS) может быть дополнительно расширен, предоставляя более широкие возможности по сбору разведывательной информации и контрразведке."
 ALG_new_gendarmerie_equipment: "Новое снаряжение для жандармерии"
 ALG_new_gendarmerie_equipment_desc: "Наша жандармерия должна быть надлежащим образом вооружена и оснащена для противодействия вызовам терроризма, преступности и внутренних беспорядков."
 ALG_mia_reform: "Реформировать Министерство внутренних дел"
 ALG_mia_reform_desc: "Централизация командования в рамках Министерства внутренних дел позволит оптимизировать управление внутренней безопасностью, обеспечив более быстрое и скоординированное реагирование."
 ALG_internal_troops: "Внутренние войска"
 ALG_internal_troops_desc: "Внутренние военизированные формирования под государственным командованием усилят борьбу с повстанческими и криминальными сетями."
 ALG_increase_special_forces: "Увеличить численность спецназа"
 ALG_increase_special_forces_desc: "Нашим элитным подразделениям необходимы расширенный набор новобранцев и специализированные программы подготовки для противостояния изощренным угрозам современной войны."
 ALG_cybercrime_directorate: "Управление по борьбе с киберпреступностью"
 ALG_cybercrime_directorate_desc: "Создание Управления по борьбе с киберпреступностью защитит Алжир от цифрового шпионажа, кибератак и враждебных кампаний по распространению дезинформации."
 ALG_riot_police: "Подразделения полиции по борьбе с беспорядками"
 ALG_riot_police_desc: "Организованные подразделения полиции по борьбе с беспорядками обеспечат контроль за толпой и дисциплинированное реагирование на массовые протесты, гарантируя стабильность во время беспорядков."
 ALG_military_police_training: "Подготовка военной полиции"
 ALG_military_police_training_desc: "Программы подготовки военной полиции повысят дисциплину, снизят дезертирство и улучшат управление оккупацией в нестабильных регионах."
 ALG_peoples_security: "Народная безопасность"
 ALG_peoples_security_desc: "Доктрина «народной безопасности» укрепит гражданско-военное сотрудничество, поднимет моральный дух и вовлечет местное население в усилия по национальной обороне."
 ALG_procurement_of_espionage_equipment: "Закупка шпионского оборудования"
 ALG_procurement_of_espionage_equipment_desc: "Инвестиции в передовые технологии наблюдения и шпионажа повысят нашу способность выявлять и нейтрализовать внутренние и внешние угрозы."
 ALG_occupation_management_strategies: "Стратегии управления профессиональной деятельностью"
 ALG_occupation_management_strategies_desc: "Новые стратегии управления оккупированными или нестабильными территориями позволят минимизировать сопротивление, сократить число жертв и укрепить государственную власть."
 ALG_french_weapons: "Импорт французского оружия"
 ALG_french_weapons_desc: "Приобретение французского стрелкового оружия и техники позволит Алжиру быстро модернизировать свою пехоту и укрепить связи с Парижем."
 ALG_russian_guns: "Импорт российского оружия"
 ALG_russian_guns_desc: "Российское стрелковое оружие, поставляемое оптом, обеспечивает Алжир долговечным и надежным вооружением, укрепляя наше традиционное оборонное партнерство с Москвой."
 ALG_algerian_space_programme: "Создать ASAL"
 ALG_algerian_space_programme_desc: "Алжирское космическое агентство (ASAL) будет координировать всю национальную космическую деятельность, от разработки спутников до международного сотрудничества в области космических исследований."
 ALG_alsat_initiative: "Инициатива AlSat"
 ALG_alsat_initiative_desc: "Проект AlSat предоставляет Алжиру первые спутники, предназначенные для наблюдения за Землей и связи, что знаменует собой вступление страны в космическую эру."
 ALG_alsat2_series: "Серия AlSat-2"
 ALG_alsat2_series_desc: "Разработка передовых спутников AlSat-2 позволит расширить наши возможности в области наблюдения, связи и дистанционного зондирования."
 ALG_finance_private_space_companies: "Финансирование частных космических компаний"
 ALG_finance_private_space_companies_desc: "Привлечение частного сектора Алжира к участию в космической отрасли укрепит нашу отечественную высокотехнологичную базу."
 ALG_regional_satnet: "Региональная спутниковая сеть"
 ALG_regional_satnet_desc: "Мы объединим наши спутники в региональную сеть, интегрируя гражданское и военное применение и связывая Алжир с его соседями."
 ALG_asal_lunar_project: "Лунный проект ASAL"
 ALG_asal_lunar_project_desc: "Алжирское космическое агентство начнет амбициозный проект по изучению Луны и развитию ракетных технологий."
 ALG_human_spaceflight: "Программа пилотируемых космических полетов"
 ALG_human_spaceflight_desc: "Наша космическая программа сделает смелый шаг вперед: в партнерстве с международными союзниками планируется первый пилотируемый космический полет Алжира."
 ALG_orbital_defense_program: "Программа орбитальной обороны"
 ALG_orbital_defense_program_desc: "Спутники также могут использоваться в оборонных целях. Развитие возможностей орбитальной обороны защитит Алжир от будущих угроз."
 ALG_alsat_future: "Будущее AlSat"
 ALG_alsat_future_desc: "Будущее космической программы Алжира зависит от устойчивых инвестиций, государственно-частного партнерства и долгосрочного научного планирования."
 ALG_cyber_sat_integration: "Интеграция киберспутников"
 ALG_cyber_sat_integration_desc: "Объединение возможностей кибервойны с нашей спутниковой сетью предоставит Алжиру мощный асимметричный инструмент в современных конфликтах."
 ALG_idea_the_new_space_race: "Новая космическая гонка"
 ALG_idea_the_new_space_race_desc: "Алжир вступил в глобальную космическую гонку, соревнуясь с мировыми державами за доказательство своей технологической и стратегической мощи."
 ALG_idea_cyberwarfare_2: "Интеграция киберспутников"
 ALG_idea_cyberwarfare_2_desc: "Киберкомандование Алжира теперь интегрировано с нашими спутниковыми системами, что обеспечивает превосходную безопасность связи и наступательные возможности."
 ALG_algeria_police_modifier: "Внутренняя безопасность Алжира"
 ALG_algeria_police_modifier_desc: "Правительство Алжира обладает богатым опытом подавления инакомыслия и борьбы с вражескими агентами, накопленным еще со времен СССР."
 ALG_algeria_police_modifier_tt_intro: "Изменить §Y$ALG_algeria_police_modifier$§! на"
 ALG_algeria_support_category: "Вспомогательные войска Алжира"
 ALG_stabilize_mali: "Стабилизировать Мали"
 ALG_stabilize_mali_desc: "Нестабильность в Мали угрожает всему Сахелю. Алжир, обладая опытом в борьбе с повстанцами и дипломатии, должен вмешаться, чтобы стабилизировать ситуацию у своего южного соседа, будь то силой, переговорами или влиянием."
 ALG_back_tuareg_rebellion: "Поддержите восстание туарегов"
 ALG_back_tuareg_rebellion_desc: "Вместо того чтобы поддерживать Бамако, мы можем усилить позиции туарегских повстанцев, стремящихся к автономии на севере Мали. Это ослабит центральную власть в Мали и увеличит наше влияние в регионе."
 ALG_support_malian_army: "Поддержите малийскую армию"
 ALG_support_malian_army_desc: "Вместо этого Алжир может напрямую поддержать правительство Мали, предоставив политическую и военную помощь для укрепления его армии в борьбе с повстанцами."
 ALG_promote_tuareg_dialogue: "Содействовать диалогу с туарегами"
 ALG_promote_tuareg_dialogue_desc: "Вместо того чтобы выбирать сторону, Алжир мог бы выступить посредником и стабилизатором в переговорах между туарегскими повстанцами и малийским государством, приняв на себя роль посредника и стабилизатора в Сахеле."
 ALG_support_tuareg_politicians: "Поддержите политиков-туарегов"
 ALG_support_tuareg_politicians_desc: "Помимо поля боя, влияние туарегов можно наращивать и через политические каналы. Поддержка умеренных лидеров туарегов обеспечит Алжиру долгосрочных союзников внутри Мали."
 ALG_aid_malian_army: "Окажите помощь малийской армии."
 ALG_aid_malian_army_desc: "Алжир может направлять оружие, технику и системы управления для укрепления потенциала малийской армии в борьбе с повстанцами и стабилизации ситуации в стране."
 ALG_mali_stabilized: "Мали Стабилизированный"
 ALG_mali_stabilized_desc: "После многих лет потрясений усилия Алжира принесли свои плоды. Малийский конфликт взят под контроль, восстание туарегов подавлено, и Алжир выступает в качестве стабилизирующей силы в Сахеле."
 ALG_tuareg_autonomy_victory: "Победа в деле автономии туарегов"
 ALG_tuareg_autonomy_victory_desc: "Движение туарегов добилось признания своей автономии. При поддержке Алжира туареги теперь обладают политической властью, и Мали сталкивается с новым балансом сил в Сахеле."
 Algeria.237.t: "Алжирская интервенция в Мали"
 Algeria.237.d: "Алжир заявил о своем намерении стабилизировать ситуацию в Мали, ссылаясь на опасения по поводу терроризма, сепаратизма туарегов и региональной нестабильности. В связи с переброской войск, гуманитарной помощи и политического давления Алжира на юг, баланс сил в Мали меняется. Принесет ли это мир или усугубит конфликт, покажет время."
 Algeria.237.a: "Алжир занимает лидирующую позицию в Сахеле."
 Algeria.409.t: "Инициатива диалога с туарегами"
 Algeria.409.d: "Алжир начал налаживать диалог с представителями туарегов в Мали и в регионе Сахеля в целом. Хотя некоторые в Алжире видят в этом путь к миру и стабильности, другие опасаются, что легитимизация требований туарегов может подстегнуть сепаратизм. Правительство должно решить, насколько далеко оно готово зайти в поддержке этой инициативы."
 Algeria.409.a: "Взаимодействие посредством культурных и медийных мероприятий."
 Algeria.409.b: "Оказывать ненавязчивую поддержку руководству туарегов."
 ALG_TUA_REV_TT: "[TUA.GetFlag] §HСопротивление туарегов§! Алжир поддержал эту инициативу, что привело к созданию §YАвтономный регион Туареги§! (или потенциально §Gновое государство туарегов§!) в пределах Мали."
 ALG_MAL_STABILIZED_TT: "[MAL.GetFlag] §HМали§! был §Gстабилизированный§! При поддержке Алжира, обеспечение мира и снижение риска возобновления конфликта."
 ALG_algerian_intervention: "Доктрина регионального вмешательства"
 ALG_algerian_intervention_desc: "Алжир долгое время выступал в роли регионального посредника. В условиях угрозы нестабильности в нашем регионе мы должны решить, следует ли нам напрямую вмешиваться в региональные конфликты для защиты наших национальных интересов."
 ALG_intervene_in_sahrawi: "Вмешательство в ситуацию в Сахаре"
 ALG_intervene_in_sahrawi_desc: "Конфликт между Марокко и Сахарской Арабской Демократической Республикой остается неразрешенным. Алжир должен вмешаться дипломатическим или военным путем, чтобы защитить свои границы и укрепить свое влияние в Магрибе."
 ALG_supp_polisario: "Поддержите Фронт Полисарио"
 ALG_supp_polisario_desc: "Борьба Сахары за независимость занимает центральное место в региональной политике Алжира. Поставляя оружие и поддержку Фронту ПОЛИСАРИО, мы можем ослабить Марокко и обеспечить рост нашего влияния в Западной Сахаре."
 ALG_a_new_stance: "Новый подход к Марокко"
 ALG_a_new_stance_desc: "Алжир традиционно выступал против марокканского контроля над Западной Сахарой, но меняющаяся политическая обстановка требует прагматизма. Союз с Марокко мог бы снизить напряженность, открыть новые экономические возможности и дать нам рычаги влияния в Магрибе."
 ALG_intervene_in_libya: "Вмешательство в Ливию"
 ALG_intervene_in_libya_desc: "Хаос в Ливии грозит перекинуться на наши границы. Алжир не может позволить себе нестабильность по соседству. Будь то военные действия, дипломатия или тайное влияние, мы должны обеспечить защиту наших интересов в Ливии."
 ALG_assassinate_gaddafi: "Убить Каддафи"
 ALG_assassinate_gaddafi_desc: "Правление Муаммара Каддафи дестабилизирует весь регион. Организовав его свержение, Алжир может ускорить смену режима в Ливии и обеспечить приход к власти более лояльного правительства, даже если это ввергнет Ливию в гражданскую войну."
 ALG_peacekeepers: "Направить миротворцев в Ливию"
 ALG_peacekeepers_desc: "Вместо того чтобы еще больше погружать Ливию в хаос, Алжир мог бы вмешаться в качестве миротворческих сил. Развертывание войск для стабилизации ситуации укрепило бы наш имидж ответственной региональной державы и обеспечило бы нам долгосрочное влияние в Триполи."
 ALG_pulse.1.t: "Пустыня Сахара расширяется"
 ALG_pulse.1.d: "Согласно последним данным, Сахара продолжает неуклонно расширяться. Пастбища опустошаются, оазисы высыхают, а дикие животные, такие как газели и берберские олени, исчезают из-за браконьерства. Чрезмерный выпас скота, бесконтрольная добыча полезных ископаемых и игнорирование браконьерства только усугубят опустынивание."
 ALG_pulse.1.a: "Тревожный знак"
 ALG_pulse.2.t: "Конюшня в пустыне Сахара"
 ALG_pulse.2.d: "Данные этого года свидетельствуют о том, что наступление Сахары замедлилось, а процесс опустынивания остается стабильным. Однако без принятия мер против чрезмерного выпаса скота, браконьерства и нерационального землепользования баланс может вскоре снова измениться."
 ALG_pulse.2.a: "Мы должны сохранять бдительность."
 ALG_pulse.3.t: "Сахара возвращает себе земли"
 ALG_pulse.3.d: "Последние сообщения указывают на то, что растительность постепенно восстанавливается на некоторых окраинах пустынь. Патрулирование против браконьерства, контролируемый выпас скота и усилия по лесовосстановлению, по-видимому, помогают земле восстанавливаться, возвращая баланс хрупким экосистемам."
 ALG_pulse.3.a: "Обнадеживающий прогресс"
 ALG_reduce_yearly_good_desertification_5: "Вероятность §YOasification§!: §R-5%§!\n"
 ALG_increase_yearly_good_desertification_5: "Вероятность §YOasification§!: §G+5%§!\n"
 ALG_increase_yearly_bad_desertification_5: "Вероятность опустынивания §Y§!: §R+5%§!\n"
 ALG_decrease_yearly_bad_desertification_5: "Вероятность опустынивания §Y§!: §G-5%§!\n"
 ALG_reduce_yearly_neutral_desertification_5: "Вероятность стабилизации §Y§!: §R-5%§!\n"
 ALG_increase_yearly_neutral_desertification_5: "Вероятность стабилизации §Y: §!: §G+5%§!\n"
 ALG_anti_poaching_raid_successful: "§GМы успешно устраняем §Y[?poachers_killed]§! Браконьеры!§!"
 ALG_anti_poaching_raid_normal: "§GНам удалось уничтожить §Y[?poachers_killed]§! браконьеров!§!"
 ALG_anti_poaching_raid_failure: "§RНаши рейнджеры несут потери§!"
 ALG_strengthen_ENTV_environmental_campaigns: "Усиление экологических кампаний ENTV"
 ALG_strengthen_ENTV_environmental_campaigns_desc: "Национальная телерадиокомпания ENTV может быть использована для повышения осведомленности об экологических проблемах. Проводя кампании по борьбе с опустыниванием, сохранению водных ресурсов и защите дикой природы, мы можем побудить граждан поддержать устойчивое будущее."
 ALG_increase_cattle_grazing: "Расширение выпаса скота"
 ALG_increase_cattle_grazing_desc: "Животноводство остается краеугольным камнем экономики степей и высокогорных районов Алжира. Расширение выпаса крупного рогатого скота и овец может повысить доходы сельского населения, но при отсутствии тщательного управления это чрезмерный выпас, деградацию почвы и опустынивание."
 ALG_optimize_pastoral_practices: "Оптимизация пастырской практики"
 ALG_optimize_pastoral_practices_desc: "Традиционные методы выпаса скота оказывают огромное давление на хрупкие экосистемы. Внедрение ротационного выпаса, рационального использования водных ресурсов и улучшенной ветеринарной помощи позволит модернизировать пастбищные практики и уменьшить их воздействие на степные и сахарские окраины."
 ALG_expand_steppe_farming: "Расширить степное земледелие"
 ALG_expand_steppe_farming_desc: "Степные регионы Алжира, расположенные между Телль-Атласом и Сахарой, имеют жизненно важное значение для производства зерна и животноводства. Инвестируя в ирригационные и мелиоративные проекты, мы можем увеличить объемы земледелия в этих районах, хотя и с риском дальнейшего ухудшения состояния окружающей среды."
 ALG_research_drought_resistant_crops: "Исследование засухоустойчивых культур"
 ALG_research_drought_resistant_crops_desc: "Изменение климата и опустынивание угрожают продовольственной безопасности Алжира. Инвестируя в исследования засухоустойчивых культур, таких как устойчивые зерновые и сорта финиковых пальм, мы можем защитить наш сельскохозяйственный сектор от ухудшения засушливых условий."
 ALG_shrink_nature_reserves_sahara: "Сокращение природных заповедников Сахары"
 ALG_shrink_nature_reserves_sahara_desc: "Некоторые утверждают, что значительные участки земель, выделенных в качестве природных заповедников в Сахаре, можно было бы перепрофилировать под сельское хозяйство, выпас скота или промышленные проекты. Сокращение размеров этих заповедников позволило бы осуществлять застройку, но ценой больших экологических издержек."
 ALG_expand_nature_reserves_sahara: "Расширение природных заповедников Сахары"
 ALG_expand_nature_reserves_sahara_desc: "Защита хрупких экосистем Сахары имеет важное значение для биоразнообразия и долгосрочного экологического баланса. Расширяя охраняемые территории, мы можем сохранить виды, находящиеся под угрозой исчезновения, и снизить давление, способствующее опустыниванию."
 ALG_drs: "DRS"
 ALG_drs_desc: "Алжирский Департамент разведки и безопасности (DRS) был создан в кровавое «Черное десятилетие» и прославился своими огромными полномочиями. Официально выступая в качестве щита против терроризма и иностранного проникновения, DRS также активно вмешивается в политику, обеспечивая сохранение государственной власти и стабильности, даже ценой гражданских свобод."
 ALG_decline_of_tourism: "Упадок туризма"
 ALG_destroyed_agriculture: "Разрушенное сельское хозяйство"
 ALG_tikjda_resort: "Горнолыжный курорт Тикджа"
 ALG_algerian_tourism: "Туризм в Алжире"
 ALG_natural_products_idea: "Алжирские натуральные продукты"
 ALG_sonatrach: "Расширение Сонатрахеи"
 algeria_invest.1.t: "Инвестиции в Алжир"
 algeria_invest.1.d: "Алжир просит нас инвестировать в их государство. Благодаря инвестициям в Алжир мы можем усилить наше влияние в Северной Африке и на побережье Средиземного моря."
 algeria_invest.1.a: "Хорошо"
 algeria_invest.1.b: "НЕТ"
 algeria_invest.2.t: "Они договорились"
 algeria_invest.2.d: "Они согласились инвестировать в нашу страну."
 algeria_invest.2.a: "Хороший."
 algeria_invest.3.t: "Они отказались"
 algeria_invest.3.d: "Они отказались инвестировать в нашу страну, заявив, что наше предложение невыгодно."
 algeria_invest.3.a: "Грустно"
 algeria_invest.4.t: "Американские инвестиции в Алжир"
 algeria_invest.4.d: "Алжир предоставляет нашим компаниям возможность инвестировать в его экономику. В свою очередь, мы получим влияние и в долгосрочной перспективе укрепим отношения с Алжиром."
 algeria_invest.4.a: "Кто сказал, что деньги?"
 algeria_invest.4.b: "НЕТ"
 algeria_invest.5.t: "Америка согласилась."
 algeria_invest.5.d: "Американские компании уже начали планировать инвестиционные проекты в Алжире."
 algeria_invest.5.a: "Победа для бизнеса и демократии."
 algeria_invest.6.t: "Америка отказалась"
 algeria_invest.6.d: "Америка отказывается инвестировать в нашу экономику. Они не доверяют прозрачности нашей политической системы."
 algeria_invest.6.a: "Ну, тогда позвоним в Европу."
 algeria_invest.7.t: "Европейские инвестиции в Алжир"
 algeria_invest.7.d: "Алжир просит нас инвестировать в его экономику. По их словам, у них благоприятный инвестиционный климат, и наше участие укрепит связи по всему Средиземноморью."
 algeria_invest.7.a: "Конечно"
 algeria_invest.7.b: "Денег нет."
 algeria_invest.8.t: "Европа согласилась"
 algeria_invest.8.d: "Европейские инвесторы согласились поддержать нашу экономику. Несколько крупных компаний уже выразили готовность запустить инвестиционные проекты в Алжире."
 algeria_invest.8.a: "Хорошие новости для развития."
 algeria_invest.9.t: "Европа отказалась"
 algeria_invest.9.d: "Они заявили, что в настоящий момент нет средств для выделения инвестиционного пакета."
 algeria_invest.9.a: "Грустно"
 algeria_invest.10.t: "Китайские инвесторы финансируют метрополитен Алжира"
 algeria_invest.10.d: "Китайский инвестор предлагает нам деньги на расширение Алжирского метрополитена. Мы можем построить метро на их средства или присвоить их, обманув их, но это может навредить нашим отношениям с Китаем."
 algeria_invest.10.a: "Алжиру нужно метро!"
 algeria_invest.10.b: "Алжиру нужны деньги!"
 algeria_invest.11.t: "Алжир нас обманул"
 algeria_invest.11.d: "Группа алжирских мошенников сфальсифицировала проект метро и присвоила все деньги, которые мы для них подготовили."
 algeria_invest.11.a: "Ублюдки"
 algeria_invest.12.t: "Инвестиции Ребраба"
 algeria_invest.12.d: "Иссад Ребраб, основатель компании Cevital, — один из самых влиятельных предпринимателей Алжира. С 1990-х годов он инвестирует в промышленность, производство продуктов питания и международную экспансию. Благодаря ему Алжир получил заводы, рабочие места и престижные проекты. Он остается символом потенциала частного сектора страны."
 algeria_invest.12.a: "Спасибо, Ребраб!"
 ALG_our_economy: "Наша экономика"
 ALG_our_economy_desc: "Экономика Алжира находится на перепутье. После многих лет нестабильности и недостаточного инвестирования правительство должно решить, сосредоточиться ли на внутренних проблемах или открыть двери для модернизации и роста."
 ALG_attract_foreign_inv: "Привлечение иностранных инвестиций"
 ALG_attract_foreign_inv_desc: "Открыв свои рынки для иностранных инвесторов, Алжир сможет привлечь капитал, экспертные знания и реализовать инфраструктурные проекты, которые в противном случае остались бы недоступными."
 ALG_france_inv: "Ищете французские инвестиции?"
 ALG_france_inv_desc: "Франция остается одним из ближайших экономических партнеров Алжира. Возобновление ее участия в наших энергетическом и промышленном секторах могло бы ускорить развитие, если бы мы смогли выдержать ее влияние."
 ALG_chinese_inv: "Китайская инвестиционная инициатива"
 ALG_chinese_inv_desc: "Китай предлагает амбициозные инвестиционные пакеты, часто связанные с развитием инфраструктуры и добычи ресурсов. Партнерство с Пекином могло бы преобразовать нашу экономику, но ценой усиления зависимости."
 ALG_usa_inv: "Пригласить американские инвестиции"
 ALG_usa_inv_desc: "Соединенные Штаты могут предоставить передовые технологии и существенную финансовую поддержку. Сотрудничество с Вашингтоном может преобразовать промышленность и сферу услуг Алжира в конкурентов мирового уровня."
 ALG_russian_inv: "Экономическое сотрудничество России"
 ALG_russian_inv_desc: "Россия уже давно является стратегическим союзником в области энергетики и обороны. Расширение сотрудничества до более широких экономических проектов укрепит наш промышленный и военный хребет."
 ALG_iran_inv: "Партнерство с Ираном"
 ALG_iran_inv_desc: "Алжир и Иран объединяет общая история неприсоединения и сопротивления иностранному господству. Расширение связей с Тегераном может открыть новые возможности в энергетическом сотрудничестве, промышленных проектах и региональной дипломатии, хотя это может вызвать опасения у западных партнеров."
 ALG_italia_inv: "Укрепление итальянских связей"
 ALG_italia_inv_desc: "Италия является одним из ближайших европейских партнеров Алжира, особенно благодаря роли ENI в нашем энергетическом секторе. Углубляя сотрудничество с Римом, мы можем обеспечить жизненно важные инвестиции в инфраструктуру, нарастить торговлю в Средиземноморье и укрепить свои позиции в качестве ключевого поставщика энергии в Европу."
 ALG_algiers_metro_expansion: "Расширить метрополитен Алжира"
 ALG_algiers_metro_expansion_desc: "Алжир страдает от пробок и устаревшей инфраструктуры. Расширение системы метро не только модернизирует транспорт, но и станет сигналом прогресса как для инвесторов, так и для горожан."
 ALG_cevital_group_expansion: "Расширение группы Cevital"
 ALG_cevital_group_expansion_desc: "«Севиталь», ведущий алжирский конгломерат, имеет потенциал стать континентальной державой. Поддержка его роста создаст рабочие места и ускорит промышленную модернизацию."
 ALG_scientific_research_push: "Содействовать научным исследованиям"
 ALG_scientific_research_push_desc: "Инновации — ключ к долгосрочному росту. Инвестируя в научные исследования, Алжир может заложить основу для экономики, основанной на знаниях."
 ALG_expand_higher_education: "Расширение высшего образования"
 ALG_expand_higher_education_desc: "Университеты и технические училища необходимо расширять и модернизировать, чтобы соответствовать требованиям XXI века. Более образованное население укрепит как общество, так и экономику."
 ALG_digitalize_education: "Цифровизация образования"
 ALG_digitalize_education_desc: "Цифровые платформы, онлайн-обучение и интеграция информационных технологий произведут революцию в секторе образования Алжира, создав более квалифицированную и адаптивную рабочую силу."
 ALG_national_research_program: "Запуск национальной исследовательской программы"
 ALG_national_research_program_desc: "Скоординированная национальная исследовательская программа, объединяющая университеты, промышленность и правительство, позволит Алжиру идти в ногу с мировым технологическим прогрессом."
 ALG_industry: "Расширение алжирской промышленности"
 ALG_industry_desc: "Промышленность Алжира нуждается в диверсификации и модернизации. Содействуя промышленному росту, мы можем снизить зависимость от углеводородов и создать более сбалансированную экономику."
 ALG_constantine_hub: "Развитие промышленного центра Константина"
 ALG_constantine_hub_desc: "Город Константина является важным региональным центром. Инвестиции в него создадут новый промышленный центр, который будет способствовать экономическому росту за пределами Алжира."
 ALG_tlemcen_agro_industry: "Развитие агропромышленного комплекса Тлемсена"
 ALG_tlemcen_agro_industry_desc: "Сельское хозяйство и пищевая промышленность в Тлемсене могут быть развиты в мощный агропромышленный сектор, обеспечивающий продовольствием всю страну и создающий рабочие места."
 ALG_snvi_modernization: "Модернизировать SNVI"
 ALG_snvi_modernization_desc: "Для того чтобы конкурировать на мировом рынке, SNVI, национальный производитель автомобилей Алжира, нуждается в модернизации. Расширение производственных мощностей укрепит нашу транспортную и промышленную базу."
 ALG_annaba_steel_complex: "Сталелитейный комплекс Аннаба"
 ALG_annaba_steel_complex_desc: "В Аннабе расположены крупнейшие в Алжире сталелитейные заводы. Их модернизация и расширение станут основой для будущей инфраструктуры и оборонной промышленности."
 ALG_arzew_refinery: "Расширение нефтеперерабатывающего завода Арзев"
 ALG_arzew_refinery_desc: "Нефтеперерабатывающий завод в Аржеве является важнейшим звеном в нашем экспорте энергоносителей. Расширение его мощностей обеспечит приток иностранной валюты и укрепит доминирующее положение компании Sonatrach."
 ALG_pipeline_modernization: "Модернизация конвейеров"
 ALG_pipeline_modernization_desc: "Современная трубопроводная система необходима для безопасного и эффективного экспорта энергоносителей. Модернизация наших трубопроводов позволит предотвратить потери и повысить надежность поставок на международном уровне."
 ALG_skikda_port_modernization: "Модернизация порта Скикда"
 ALG_skikda_port_modernization_desc: "Порт Скикда имеет решающее значение для торговли и экспорта энергоносителей. Модернизация его инфраструктуры обеспечит Алжиру сохранение конкурентоспособности как морского транспортного узла."
 ALG_grant_foreign_energy_concessions: "Предоставление концессий на энергетику иностранным государствам"
 ALG_grant_foreign_energy_concessions_desc: "Предоставляя отдельные льготы иностранным компаниям, Алжир может привлечь капитал и технологии, хотя и с риском частичной утраты энергетической независимости."
 ALG_hassi_messaoud_expansion: "Расширение нефтяного месторождения Хасси-Мессауд"
 ALG_hassi_messaoud_expansion_desc: "Нефтяное месторождение Хасси-Мессауд является крупнейшим в Алжире. Расширение мощностей по добыче и переработке значительно увеличит объемы производства энергии в стране."
 ALG_expand_sonatrach: "Развернуть Сонатрахеальный"
 ALG_expand_sonatrach_desc: "Компания Sonatrach — это сердце экономики Алжира. Укрепление компании обеспечит нам прочную позицию на мировом рынке добычи нефти и газа."
 ALG_protect_oil_gas_facilities: "Защита нефтегазовых объектов"
 ALG_protect_oil_gas_facilities_desc: "Наша энергетическая инфраструктура уязвима во время войны или беспорядков. Укрепление обороны вокруг нефтегазовых объектов имеет решающее значение для национальной безопасности."
 ALG_minister_of_agriculture_reforms: "Программа сельскохозяйственной реформы"
 ALG_minister_of_agriculture_reforms_desc: "Многолетнее пренебрежение ослабило сельское хозяйство Алжира. Новые реформы, проводимые Министерством сельского хозяйства, восстановят производительность и снизят зависимость от импорта продовольствия."
 ALG_modernize_agricultural_sector: "Модернизация сельскохозяйственного сектора"
 ALG_modernize_agricultural_sector_desc: "Годы конфликтов и пренебрежения привели к тому, что алжирские фермы устарели и стали неэффективными. Механизация, ирригационные системы и субсидии оживят сельскохозяйственный сектор, обеспечив продовольственную безопасность нашего населения."
 ALG_rural_development_program: "Программа развития сельских районов"
 ALG_rural_development_program_desc: "Сельские районы Алжира долгое время страдали от недостатка инвестиций. Направляя средства в сельскую инфраструктуру, энергетику и создание рабочих мест, мы уменьшим неравенство между городами и сельской местностью и укрепим национальное единство."
 ALG_promote_algerian_produce: "Продвигайте алжирскую продукцию"
 ALG_promote_algerian_produce_desc: "Наша земля производит широкий спектр сельскохозяйственных культур и продуктов питания, но на местных рынках преобладает импорт из-за рубежа. С помощью брендинга, субсидий и торговых стимулов мы повысим узнаваемость алжирских товаров как внутри страны, так и за рубежом."
 ALG_build_farm_to_market_roads: "Дороги от ферм до рынков"
 ALG_build_farm_to_market_roads_desc: "Фермерам необходим более широкий доступ к потребителям и экспортным маршрутам. Строительство дорог из сельских районов в городские центры и через тунисскую границу укрепит как наш сельскохозяйственный сектор, так и региональные связи."
 ALG_new_agro_industrial_complexes: "Новые агропромышленные комплексы"
 ALG_new_agro_industrial_complexes_desc: "Алжиру необходимо связать сельское хозяйство с современной промышленностью. Создание агропромышленных комплексов позволит производить продукцию с добавленной стоимостью, создавать рабочие места и повышать доходы сельского населения."
 ALG_invest_tourism: "Инвестиции в туризм"
 ALG_invest_tourism_desc: "Туризм в Алжире когда-то процветал, но военные годы отпугнули туристов. Благодаря продуманным инвестициям и улучшению безопасности мы можем начать восстановление этого жизненно важного сектора."
 ALG_restore_hotel_resorts: "Восстановление гостиничных курортов"
 ALG_restore_hotel_resorts_desc: "Многие курорты и отели Алжира находятся в руинах или разрушены. Их реконструкция поможет привлечь иностранных туристов и создаст рабочие места для местных жителей."
 ALG_blida_airbase_modernization: "Модернизация авиабазы Блида"
 ALG_blida_airbase_modernization_desc: "Авиабаза Блида является ключевым объектом как для гражданских перевозок, так и для военной транспортировки. Ее модернизация улучшит транспортную доступность Алжира и будет способствовать развитию региональной торговли."
 ALG_algiers_oran_highway: "Алжирско-Оранская автомагистраль"
 ALG_algiers_oran_highway_desc: "Строительство современной автомагистрали, соединяющей Алжир и Оран, сократит время в пути, поддержит торговлю и укрепит экономическую основу Алжира."
 ALG_east_west_highway_project: "Проект автомагистрали Восток-Запад"
 ALG_east_west_highway_project_desc: "Протянувшаяся через всю территорию Алжира автомагистраль Восток-Запад станет одним из крупнейших инфраструктурных проектов в Африке, соединив наши регионы и стимулируя торговлю."
 ALG_ski_resorts_of_tikjda: "Горнолыжные курорты Тикжда"
 ALG_ski_resorts_of_tikjda_desc: "В горах Кабилии расположен Тикжда, курорт с нераскрытым потенциалом. Модернизация его инфраструктуры и развитие зимнего туризма позволят диверсифицировать экономическую базу Алжира."
 ALG_north_african_tourism_hub: "Туристический Центр Северной Африки"
 ALG_north_african_tourism_hub_desc: "Инвестируя в наше побережье, культурное наследие и природные ландшафты, Алжир может стать ведущим туристическим направлением в Северной Африке, конкурируя с нашими средиземноморскими соседями."
 ALG_it_investments: "ИТ-инвестиции"
 ALG_it_investments_desc: "Учитывая скорость развития информационных технологий, мы не сможем обойтись без них в будущем. Поэтому настало время инвестировать в этот сектор."
 ALG_infrastructure_investments: "Инвестиции в инфраструктуру"
 ALG_infrastructure_investments_desc: "Наша инфраструктура после 90-х годов находится в плачевном состоянии. Давно пора её перестроить."
 ALG_science_idea: "Алжирская наука и образование"
 ALG_fuel: "Алжирское топливо"
 ALG_dziri: "Дзири"
 ALG_dziri_desc: "Алжиру необходимо решить насущные социальные проблемы: от традиций и ислама до прав берберов и демократических реформ. Выбранный нами путь определит будущее страны."
 ALG_traditions_matter: "Традиции имеют значение"
 ALG_traditions_matter_desc: "Алжирский народ твердо придерживается веры, семейных ценностей и национальной идентичности. Наше правительство должно уважать эти традиции, если мы хотим сохранить легитимность."
 ALG_restrict_women_roles: "Сохраним Семейный кодекс"
 ALG_restrict_women_roles_desc: "Лидеры консервативного крыла утверждают, что роль женщин должна по-прежнему оставаться сосредоточенной на семье. Реформирование Семейного кодекса рискует вызвать недовольство религиозных авторитетов и общественности."
 ALG_expand_berber_rights: "Признать права амазигов"
 ALG_expand_berber_rights_desc: "Движение за берберскую идентичность требует полного культурного и языкового признания. Предоставление прав амазигам разрядило бы напряженность, но могло бы оттолкнуть сторонников жесткой линии."
 ALG_censor_internet: "Цензура интернета"
 ALG_censor_internet_desc: "Социальные сети и онлайн-активизм подпитывают протесты. Ограничение свободы в интернете восстановит государственный контроль, но нанесет ущерб нашему международному имиджу."
 ALG_open_civil_society: "Открытое гражданское общество"
 ALG_open_civil_society_desc: "Демократические силы выступают за свободное гражданское общество, НПО и организации «Хирак». Открытие этого пространства укрепит легитимность, но создаст риск политической фрагментации."
 ALG_integration_policy: "Интеграционная политика"
 ALG_integration_policy_desc: "Мигранты из стран Африки к югу от Сахары и возвращающиеся представители диаспоры сталкиваются с трудностями. Структурированная политика интеграции может снизить социальную напряженность и способствовать сплоченности."
 ALG_marriage_subsidies: "Субсидии на брак"
 ALG_marriage_subsidies_desc: "В условиях, когда молодежи трудно вступать в брак и создавать семьи, субсидии на жилье и свадьбы стабилизируют общество и будут способствовать формированию семей."
 ALG_constitutionalize_rights: "Конституционное закрепление прав"
 ALG_constitutionalize_rights_desc: "Мы можем закрепить гражданские свободы, права женщин и признание амазигов посредством конституционной реформы. Это ознаменует собой необратимые социальные изменения."
 ALG_berber_right: "Признание амазигов"
 ALG_berber_right_desc: "Амазигская идентичность получила официальное признание, что способствует повышению стабильности в регионах с преобладающим берберским населением."
 Algeria.238.t: "Стабилизировать Мали"
 Algeria.238.d: "Продолжающийся конфликт в Мали угрожает дестабилизировать весь регион Сахеля. Туарегские сепаратисты и джихадистские группировки создали кризис безопасности на нашей южной границе. Алжир не может оставаться пассивным, пока распространяется нестабильность. Мы должны решить, поддержать ли правительство Мали в восстановлении порядка или продолжить переговоры с туарегскими группировками в надежде на достижение прочного урегулирования."
 Algeria.238.a: "Поддержите правительство Мали"
 Algeria.238.b: "Оказать поддержку силам туарегов"
 ALG_us_invest_tt: "Привлечение американских инвестиций в Алжир"
 ALG_fra_invest_tt: "Привлечение французских инвестиций в Алжир"
 ALG_eng_invest_tt: "Ищу английских инвесторов в Алжире"
 ALG_chi_invest_tt: "Привлечение китайских инвестиций в Алжир"
 ALG_rus_invest_tt: "Искать российские инвестиции в Алжире"
 ALG_open_to_west: "Открыто на запад"
 ALG_open_to_west_desc: "Алжир долгое время придерживался нейтралитета, но времена меняются. Более тесное сближение с западным миром может принести стабильность, безопасность и инвестиционные возможности."
 ALG_nato_partnership: "Партнерство НАТО"
 ALG_nato_partnership_desc: "Мы изучим возможности структурированного сотрудничества с НАТО. Это партнерство укрепит международный авторитет Алжира и поможет модернизировать наши вооруженные силы."
 ALG_energy_partnership_eu: "Энергетическое партнерство с ЕС"
 ALG_energy_partnership_eu_desc: "Огромные энергетические запасы Алжира пользуются большим спросом в Европе. Налаживание партнерских отношений в энергетической сфере с Францией и Великобританией позволит нам обеспечить выгодные контракты и долгосрочные инвестиции."
 ALG_strengthen_eu_trade: "Укрепление торговых отношений с ЕС"
 ALG_strengthen_eu_trade_desc: "Европа остается нашим крупнейшим торговым партнером. Укрепление этих экономических связей стабилизирует наш экспортный рынок и позволит еще больше интегрировать Алжир в мировую торговлю."
 ALG_expand_us_partnership: "Расширить партнерство с США"
 ALG_expand_us_partnership_desc: "Соединенные Штаты стремятся к стабильности в Северной Африке. Расширяя экономическое сотрудничество с Вашингтоном и сотрудничество в области безопасности, Алжир может привлечь инвестиции и приобрести мощного союзника."
 ALG_become_nato_ally: "Станьте союзником НАТО"
 ALG_become_nato_ally_desc: "Хотя полноправное членство в НАТО может быть преждевременным, Алжир может получить статус надежного союзника. Это предоставит нам доступ к военному опыту, совместным учениям и дипломатическим рычагам."
 ALG_exchange_research_with_nato: "Обмен научными исследованиями с НАТО"
 ALG_exchange_research_with_nato_desc: "Научное сотрудничество с союзниками по НАТО позволит Алжиру извлечь выгоду из совместных исследований, обмена военными технологиями и модернизации наших образовательных и научно-исследовательских учреждений."
 ALG_get_nato_military_exp: "Получение военного опыта НАТО"
 ALG_get_nato_military_exp_desc: "Обширная военная подготовка и доктрина НАТО предоставляют ценный опыт. Вооруженные силы Алжира будут модернизироваться посредством совместных учений и стратегического руководства."
 ALG_counterterrorism_coordination: "Координация борьбы с терроризмом"
 ALG_counterterrorism_coordination_desc: "Терроризм остается серьезной угрозой в Северной Африке. Координируя свои действия с разведывательными и контртеррористическими подразделениями НАТО, Алжир может укрепить внутреннюю безопасность и региональную стабильность."
 ALG_get_investements_from_nato: "Привлечение инвестиций НАТО"
 ALG_get_investements_from_nato_desc: "Наше сотрудничество с НАТО привлечет экономическую поддержку и инфраструктурные проекты от членов альянса, что обеспечит долгосрочные выгоды для экономики Алжира."
 ALG_strengthen_democratic_norms: "Укреплять Демократические нормы"
 ALG_strengthen_democratic_norms_desc: "Для полноценной интеграции с западным миром Алжиру необходимо укрепить демократические институты. Это включает в себя защиту гражданских свобод, поддержку плюрализма и поощрение политических реформ."
 ALG_seek_greater_influence_in_wto: "Стремиться к большему влиянию во ВТО"
 ALG_seek_greater_influence_in_wto_desc: "По мере развития Алжира мы должны расширять свою роль во Всемирной торговой организации, обеспечивая, чтобы наш голос был услышан в глобальных экономических переговорах."
 ALG_seek_security_council_seat: "Претендовать на место в Совете Безопасности ООН"
 ALG_seek_security_council_seat_desc: "Дипломатическая история Алжира и его опыт в миротворческой деятельности дают нам веские основания для постоянного присутствия в Совете Безопасности ООН. Мы должны добиваться этой цели."
 ALG_join_nato: "Вступите в НАТО"
 ALG_join_nato_desc: "После десятилетий нейтралитета и осторожного балансирования Алжир готовится сделать исторический шаг: стать полноправным членом НАТО. Это решение укрепит наши позиции среди западных держав и изменит нашу внешнюю политику."
 ALG_global_companies: "Пригласить глобальные корпорации"
 ALG_global_companies_desc: "Открыв наши рынки для иностранных инвесторов, Алжир сможет привлечь глобальные корпорации к созданию представительств в нашей экономике. Это будет способствовать промышленному росту, передаче технологий и повышению международного престижа."
 ALG_huawei: "Huawei Telecommunications"
 ALG_huawei_desc: "Компания Huawei предложила создать в Алжире передовую телекоммуникационную инфраструктуру, обеспечив нам современную цифровую основу и укрепив наши позиции в информационную эпоху."
 ALG_hyundai: "Промышленная экспансия компании Hyundai"
 ALG_hyundai_desc: "Компания Hyundai выразила заинтересованность в инвестициях в автомобильный и промышленный секторы Алжира. Принимая их заводы, мы сможем стимулировать занятость и технологическое развитие."
 ALG_weapons_expert: "Иностранные эксперты в области вооружений"
 ALG_weapons_expert_desc: "Благодаря сотрудничеству с зарубежными оборонными компаниями Алжир может приобрести новый опыт в области вспомогательного вооружения и тактических систем, укрепив тем самым свои сухопутные войска."
 ALG_airburst_weapons: "Разработка оружия с воздушным подрывом"
 ALG_airburst_weapons_desc: "Технология воздушного подрыва позволяет пехоте поражать противников за укрытиями или в укрепленных позициях. Инвестиции в эту передовую систему значительно повысят нашу эффективность на поле боя."
 ALG_vehicle_industry: "Расширение автомобильной промышленности"
 ALG_vehicle_industry_desc: "Сотрудничая с мировыми автопроизводителями и промышленными предприятиями, Алжир может создать мощную военную и гражданскую автомобильную промышленность, что будет способствовать укреплению как обороноспособности, так и экономики."
 ALG_advanced_ultility_vehicle: "Современные служебные транспортные средства"
 ALG_advanced_ultility_vehicle_desc: "Наш автомобильный сектор должен перейти к передовым разработкам. Производство современных, надежных коммерческих автомобилей укрепит логистику и повысит эффективность транспорта."
 ALG_sat_tech: "Сотрудничество в области спутниковых технологий"
 ALG_sat_tech_desc: "Благодаря партнерству с международными компаниями Алжир может развивать передовые спутниковые технологии, совершенствуя системы наблюдения, связи и позиционирования."
 ALG_advanced_radar: "Передовые радиолокационные системы"
 ALG_advanced_radar_desc: "Современные радиолокационные и разведывательные технологии обеспечат Алжиру более высокий уровень обороны и позволят интегрироваться в передовые региональные системы безопасности."
 ALG_microsoft: "Цифровая инфраструктура Microsoft"
 ALG_microsoft_desc: "Сотрудничество с Microsoft позволит Алжиру модернизировать свой ИТ-сектор и сектор программного обеспечения, укрепив кибербезопасность, цифровое управление и обеспечив рост, основанный на технологиях."
 ALG_Lenovo: "Инвестиции Lenovo в технологии"
 ALG_Lenovo_desc: "Компания Lenovo заинтересована в расширении своего присутствия в Алжире. Сотрудничество с ними укрепит нашу индустрию компьютерного оборудования и поддержит технологические инновации."
 ALG_Danone: "Расширение пищевой промышленности компании Danone"
 ALG_Danone_desc: "Инвестиции компании Danone в продовольственный сектор Алжира будут способствовать улучшению питания, повышению стандартов производства продуктов питания и развитию международных торговых отношений."
 ALG_toyota: "Промышленное партнерство Toyota"
 ALG_toyota_desc: "Пригласив компанию Toyota создать промышленные и автомобильные предприятия, Алжир сможет нарастить производство автомобилей, создать рабочие места и способствовать технологическому прогрессу в автомобильной отрасли."
 ALG_align_with_south_africa: "Присоединяйтесь к Южной Африке"
 ALG_align_with_south_africa_desc: "Южная Африка играет ведущую роль в политических и экономических делах Африки. Укрепление нашего партнерства позволит нам координировать политику в области торговли, дипломатии и безопасности на всем континенте."
 ALG_open_to_east: "Открыто на восток"
 ALG_open_to_east_desc: "Поворот на Восток диверсифицирует наши партнерские отношения, уменьшит зависимость от Запада и откроет возможности на таких рынках, как Россия, Китай и другие растущие державы."
 ALG_expand_trade_with_russia: "Расширять торговлю с Россией"
 ALG_expand_trade_with_russia_desc: "Россия предлагает Алжиру новые возможности в области энергетики, вооружений и промышленного сотрудничества. Укрепление наших торговых связей углубит стратегические отношения."
 ALG_expand_trade_with_china: "Расширить торговлю с Китаем"
 ALG_expand_trade_with_china_desc: "Китай стремится инвестировать в Африку и предлагает Алжиру выгодные торговые соглашения. Это сотрудничество может обеспечить нам развитие инфраструктуры и промышленности."
 ALG_mediterranean_corridor_initiative: "Инициатива Средиземноморского коридора"
 ALG_mediterranean_corridor_initiative_desc: "Укрепив связи нашей экономики с рынками Средиземноморья и Востока, Алжир сможет утвердиться в качестве ключевого коридора для торговли и инфраструктурных проектов."
 ALG_Investments_From_East: "Восточные инвестиции"
 ALG_Investments_From_East_desc: "Привлечение инвесторов с Востока укрепит нашу экономику, обеспечит развитие новых отраслей промышленности и гарантирует Алжиру диверсифицированные источники капитала."
 ALG_eastern_alignment: "Восточная ориентация"
 ALG_eastern_alignment_desc: "Укрепление отношений с Россией, Китаем и их союзниками даст Алжиру новых партнеров в области безопасности, торговли и технологий при одновременном снижении влияния Запада."
 ALG_china_civ: "Китайские гражданские инвестиции"
 ALG_china_civ_desc: "Китайские корпорации готовы расширить свое присутствие в гражданской промышленности Алжира. Эти проекты создадут рабочие места и ускорят модернизацию."
 ALG_china_civ2: "Дальнейшие китайские гражданские проекты"
 ALG_china_civ2_desc: "После успеха предыдущих проектов Китай предлагает дополнительные инвестиции для дальнейшего расширения гражданской промышленной базы Алжира."
 ALG_chinese_armor_deal: "Китайская сделка по бронетехнике"
 ALG_chinese_armor_deal_desc: "Китай предложил Алжиру продать бронетехнику и технологические пакеты. Эта сделка укрепит наши сухопутные войска и углубит оборонные связи."
 ALG_joint_military_exercise_with_rus: "Совместные военные учения с Россией"
 ALG_joint_military_exercise_with_rus_desc: "Проводя совместные учения с Россией, Алжир улучшит военную координацию и переняет российский боевой опыт."
 ALG_russia_inf_tech: "Российская пехотная техника"
 ALG_russia_inf_tech_desc: "Российский опыт в области стрелкового оружия и тактики пехоты может быть адаптирован к потребностям Алжира, предоставляя нашим солдатам лучшие инструменты и подготовку."
 ALG_russia_experience: "Оборонительное сотрудничество с Москвой"
 ALG_russia_experience_desc: "Углубление военного сотрудничества с Россией позволит привлечь в Алжир опытных советников и учебные программы. Наши вооруженные силы станут более сильными и подготовленными."
 ALG_idea_parliamentary_republic: "Маджлис аль-Ватани аль-Шааби"
 ALG_idea_presidential_republic: "Президентская система"
 ALG_idea_semi_presidential_republic: "Аль-Джумхорья аль-Демократия аш-Шаабия"
 ALG_release_political_pirsoners: "Освободите политических заключенных"
 ALG_release_political_pirsoners_desc: "Чтобы открыть новую главу в истории страны, новая администрация освободит тех, кто был задержан по политическим причинам в годы беспорядков. Этот акт помилования призван укрепить национальное единство и восстановить доверие между народом и государством."
 ALG_al_jazair_al_djadida: "Аль-Джазаир Аль-Джадида"
 ALG_al_jazair_al_djadida_desc: "Обещание президента Абдельмаджида Теббуна о «новой Алжире» направлено на обновление легитимности государства посредством конституционных и административных реформ, укрепления демократических институтов и доверия населения."
 ALG_republic_of_algeria: "Республика Алжир"
 ALG_republic_of_algeria_desc: "Заложив основы реформ, Алжир подтверждает свою идентичность как республики, руководствующейся национальным суверенитетом, социальной справедливостью и волей своих граждан."
 ALG_majlis_al_watani_al_shaabi: "Маджлис аль-Ватани аль-Шааби"
 ALG_majlis_al_watani_al_shaabi_desc: "Парламентская республика наделила бы избранных представителей народа полномочиями определять направление развития страны, ограничив доминирование исполнительной власти и обеспечив коллективное принятие решений."
 ALG_jumhorya_democratia_shaabia: "Аль-Джумхорья аль-Демократия аш-Шаабия"
 ALG_jumhorya_democratia_shaabia_desc: "Сохранение полупрезидентского баланса между исполнительной и законодательной властью могло бы стабилизировать переходный период в Алжире, предотвратив возвращение к авторитаризму и обеспечив решительное управление страной."
 ALG_deep_state_republic: "Республика Глубинного Государства"
 ALG_deep_state_republic_desc: "За фасадом реформ формируется новая структура власти. Бывшие генералы, бизнесмены и бюрократы укрепляют свою власть в тени. Эта «глубинная республика» поддерживает иллюзию демократии, одновременно оберегая свои сети влияния и коррупции."
 ALG_tamazgha: "Сон Тамазга"
 ALG_tamazgha_desc: "Настало время возрождения Тамазги, земли амазигского народа, простирающейся от Атлантического океана до Нила. Для Северной Африки восходит новый рассвет под знаменем свободы и единства."
 ALG_our_land: "Наша священная земля"
 ALG_our_land_desc: "Наш народ должен вернуть и восстановить земли, которые всегда были нашими. Промышленность, людские ресурсы и мужество станут основой нашей возрожденной родины."
 ALG_expand_our_army: "Расширить нашу армию"
 ALG_expand_our_army_desc: "Оборона Тамазги зависит от силы нашей армии. Мы должны обучать, вооружать и расширять наши силы, чтобы защитить наше новое государство от многочисленных врагов."
 ALG_berber_of_tunisia: "Берберы Туниса"
 ALG_berber_of_tunisia_desc: "Наши братья-берберы в Тунисе долгое время находились под иностранным господством. Пришло время объединить их под флагом Тамазга и освободить их земли."
 ALG_libya_invasion: "Вторжение в Ливию"
 ALG_libya_invasion_desc: "От песков Сахары до берегов Триполи Ливия по праву является частью нашей культурной родины. Мы должны включить её в лоно Тамазга."
 ALG_take_egypt: "Марш на Египет"
 ALG_take_egypt_desc: "Египет играет ключевую роль в обеспечении безопасности восточной границы Тамазги. Его огромные ресурсы и стратегическое значение делают его важной частью нашего видения."
 ALG_canary_island: "Захватите Канарские острова!"
 ALG_canary_island_desc: "Канарские острова когда-то были населены берберами, гуанчами. Мы вернем эти острова под суверенитет берберов."
 ALG_take_niger: "Заявить права на Нигер"
 ALG_take_niger_desc: "Туареги Нигера по крови и наследию — берберы. Их пустыни вновь присоединятся к великой федерации Тамазга."
 ALG_rif_in_morocco: "Риф в Марокко"
 ALG_rif_in_morocco_desc: "Горный хребет Риф дал миру героев, сопротивлявшихся колониализму. Их храбрость вдохновляет нас на объединение Марокко под эгидой берберского движения."
 ALG_demand_mali: "Спрос Мали"
 ALG_demand_mali_desc: "Земли Мали, богатые историей и культурой, когда-то были частью великих берберских империй. Пришло время восстановить наше влияние в Сахеле."
 ALG_demand_mauritania: "Спрос Мавритании"
 ALG_demand_mauritania_desc: "В пустынях Мавритании глубоко уходят корни амазигского народа, уходящие корнями в наше прошлое. Объединение с Тамазга — следующий шаг на пути к нашей континентальной судьбе."
 ALG_TAM_unite_tamazgha: "Объедини Тамазга"
 ALG_TAM_unite_tamazgha_desc: "Все земли берберов должны объединиться под одним знаменем. Мечта о Тамазга — это уже не видение, а миссия, которую мы должны выполнить."
 ALG_expand_more: "Расширить Федерацию"
 ALG_expand_more_desc: "Тамазга не должна стоять на месте. Расширение, как промышленное, так и территориальное, обеспечит нам место великой державы Африки и Средиземноморья."
 ALG_focus_on_our_land: "В центре внимания – наша земля"
 ALG_focus_on_our_land_desc: "Вместо того чтобы слишком расширяться, нам следует сосредоточиться на развитии наших земель, укреплении нашего влияния, экономики и единства внутри самого Тамазга."
 ALG_expand_to_ME: "Расширение на Ближний Восток"
 ALG_expand_to_ME_desc: "Ближний Восток раздирают хаос. Обладая силой и целеустремленностью, Тамазга может навести порядок и установить амазигское правление на землях Аравии."
 ALG_take_arabia: "Завоевать Аравию"
 ALG_take_arabia_desc: "Аравийский полуостров разделён и слаб. Мы принесём свет Тамазга на эти земли и обеспечим своё господство над Красным морем и Персидским заливом."
 ALG_take_levant: "Возьмем Левант"
 ALG_take_levant_desc: "От гор Ливана до равнин Сирии и Палестины, Левант перейдет под знамя Тамазги, приближая нас к контролю над колыбелью цивилизации."
 ALG_legacy_of_dihiya: "Наследие Дихьи"
 ALG_legacy_of_dihiya_desc: "Королева Дихья, бесстрашная воительница племени Аурес, когда-то объединила амазигские племена против чужеземных захватчиков. Ее дух непокорности и лидерства живет в нашем народе. Мы несем ее наследие вперед, непоколебимыми, непреклонными и навсегда свободными."
 ALG_de_arabisation_mission_desc: "В стране идёт масштабная кампания по культурной и языковой реформе. Бюрократия и система образования перестраиваются, чтобы отразить наследие берберов. Эти преобразования вызовут краткосрочные трудности, но в долгосрочной перспективе укрепят нашу нацию."
 ALG_dearabisation_end_TT: "§GЗавершается процесс деарабизации.§! Арабское ядро заменяется берберским, и мы обретаем национальный дух. §Y«Настойчивость имазигов»§!."
 ALG_de_arabisation: "Кампания по деарабизации"
 ALG_de_arabisation_desc: "На протяжении веков истинная идентичность нашего народа была погребена под навязанными культурными стереотипами. Мы вернем себе наши корни, реформировав систему образования, администрацию и языковую политику, даже если это в краткосрочной перспективе нарушит работу нашего общества."
 ALG_dearabisation_penalty: "Административные потрясения"
 ALG_dearabisation_penalty_desc: "Процесс деарабизации подорвал государственную бюрократию и систему образования. Сопротивление, путаница и неэффективность омрачают переходный период, поскольку правительство пытается восстановить институты по образу и подобию берберского народа."
 ALG_imazighen_perseverance: "Настойчивость имазигена"
 ALG_imazighen_perseverance_desc: "Наши люди выстояли, преодолев трудности и пройдя через реформы. Амазигский дух оказался непоколебимым, мы вышли из бури более сильными, гордыми и сплоченными."
 ALG_el_salam_nuclear_reactor: "Атомный реактор Эль-Салам"
 ALG_el_salam_nuclear_reactor_desc: "Для удовлетворения растущего спроса на энергию в Алжире и снижения зависимости от ископаемого топлива правительство начнет строительство ядерного реактора в Эль-Саламе. Этот проект представляет собой важный шаг на пути к научному прогрессу и диверсификации источников энергии."
 ALG_uranium_enrichment: "Программа обогащения урана"
 ALG_uranium_enrichment_desc: "Развитие собственных мощностей по обогащению урана позволит Алжиру самостоятельно обеспечивать себя ядерным топливом. В рамках этой программы наши ученые стремятся освоить центрифужную технологию и достичь ядерной самодостаточности."
 ALG_el_nour_nuclear_facility: "Ядерный объект в Эль- Нуре"
 ALG_el_nour_nuclear_facility_desc: "После успеха реактора в Эль-Саламе Алжир расширит свою ядерную инфраструктуру, построив объект в Эль-Нуре, который станет центром исследований, технического обслуживания реакторов и развития мирной ядерной энергетики."
 ALG_ask_for_help_from_india: "Обратитесь за помощью к Индии."
 ALG_ask_for_help_from_india_desc: "Индия обладает многолетним опытом развития ядерной энергетики под пристальным вниманием международного сообщества. Обратившись к Нью-Дели за техническим и научным сотрудничеством, Алжир сможет быстрее продвинуть свою гражданскую ядерную программу."
 ALG_buy_pinaka_launcher: "Приобретите ракетные установки Pinaka."
 ALG_buy_pinaka_launcher_desc: "Индийская реактивная система залпового огня «Пинака» — это экономичная и надежная система. Приобретение этих пусковых установок укрепит артиллерийские подразделения Алжира и будет способствовать более тесному военному сотрудничеству с Индией."
 ALG_indian_missiles: "Приобретение индийских ракетных технологий"
 ALG_indian_missiles_desc: "Благодаря расширению сотрудничества с Индией в сфере обороны, Алжир может получить доступ к передовым системам наведения и двигательным установкам ракет. Интеграция этих технологий значительно повысит возможности национальной обороны."
 ALG_subsidise_amazigh_businesses: "Субсидируйте предприятия, управляемые берберами."
 ALG_subsidise_amazigh_businesses_desc: "Предоставление государственных субсидий и льготной поддержки предпринимателям-амазигам, стимулирование экономического роста в регионах Тамазга."
 ALG_leave_arab_league: "Покинуть Лигу арабских государств"
 ALG_leave_arab_league_desc: "Вывести Алжир из Лиги арабских государств, утвердив суверенную амазигскую идентичность, отдельную от политики арабского блока."
 ALG_bring_back_amazigh_exiles: "Верните изгнанников-амазигов!"
 ALG_bring_back_amazigh_exiles_desc: "Содействовать возвращению изгнанников и иммигрантов-амазигов, предлагая им стимулы для переселения."
 ALG_boost_kabyle_population: "Увеличить численность населения Кабилии"
 ALG_boost_kabyle_population_desc: "Внедрить политику, направленную на увеличение доли кабильского населения в населении за счет стимулов, переселения и поддержки."
 ALG_de_arabisation_category: "Программа деарабизации Тамазги"
 ALG_de_arabisation_category_desc: "Для построения новой Тамазги мы должны отказаться от навязанной арабской идентичности и восстановить амазигскую душу нашей нации."
 ALG_de_arabisation_mission: "Процесс деарабизации"
 ALG_return_amazigh_exiles: "Верните изгнанников и иммигрантов-амазигов."
 ALG_return_amazigh_exiles_desc: "Десятилетия дискриминации вынудили многих бежать. Пришло время вернуть их домой."
 ALG_dearabisation_fail_TT: "Неудача подрывает стабильность и усиливает этническую напряженность."
 ALG_amazigh_businesses_complete_TT: "Уровень удовлетворенности жизнью и экономическое положение Кабиля улучшаются."
 ALG_amazigh_businesses_fail_TT: "Неудача снижает удовлетворенность кабилов."
 ALG_return_exiles_complete_TT: "Возвращающиеся из изгнания укрепляют берберскую идентичность и увеличивают людские ресурсы."
 ALG_return_exiles_fail_TT: "Неспособность репатриировать изгнанников ослабляет единство."
 ALG_leave_arab_league_complete_TT: "Выход из Лиги арабских государств укрепляет суверенитет Тамазги."
 ALG_leave_arab_league_fail_TT: "Несоблюдение требования покинуть место вызывает беспорядки."
 ALG_kabyle_pop_complete_TT: "Население Кабилии растет, национальное единство укрепляется."
 ALG_kabyle_pop_fail_TT: "Игнорирование демографических данных Кабилей приводит к беспорядкам."
 ALG_tamazgha_cultural_revival_category: "Культурное возрождение Тамазга"
 ALG_tamazgha_cultural_revival_category_desc: "С завершением арабизации настало время восстановить наше культурное, языковое и интеллектуальное наследие, начинается возрождение Тамазга."
 ALG_amazigh_language_reform: "Реформация языка амазигов"
 ALG_amazigh_language_reform_desc: "Мы должны восстановить тамазигтский язык как национальный и продвигать его посредством образования и управления."
 ALG_tamazight_in_education: "Внедрить тамазигхский язык в образование"
 ALG_tamazight_in_education_desc: "Внедрить тамазигский язык в школах и университетах для сохранения наших культурных корней."
 ALG_media_cultural_independence: "Культурная и медийная независимость"
 ALG_media_cultural_independence_desc: "Поддерживайте независимые амазигские СМИ и культурные инициативы, свободные от внешнего влияния."
 ALG_tamazgha_regional_cooperation: "Региональное сотрудничество Тамазга"
 ALG_tamazgha_regional_cooperation_desc: "Объедините североафриканские народы амазигского происхождения в рамках сотрудничества ради общего будущего."
 ALG_amazigh_language_reform_complete_TT: "Тамазигт становится государственным языком и способствует развитию образования."
 ALG_amazigh_language_reform_fail_TT: "Неспособность реформировать образование задерживает культурное возрождение."
 ALG_tamazight_in_education_complete_TT: "Язык тамазигт успешно внедрен в образовательные программы."
 ALG_tamazight_in_education_fail_TT: "Система образования по-прежнему находится под доминированием арабского населения."
 ALG_media_cultural_independence_complete_TT: "Независимые амазигские СМИ укрепляют национальную идентичность."
 ALG_media_cultural_independence_fail_TT: "Бездействие ослабляет культурное влияние."
 ALG_tamazgha_regional_cooperation_complete_TT: "Достигнуто региональное единство между народами Тамазга."
 ALG_tamazgha_regional_cooperation_fail_TT: "Неспособность наладить сотрудничество приводит к изоляции Тамазга."
 ALG_black_decade_lesson: "Уроки «Черного десятилетия»"
 ALG_black_decade_lesson_desc: "Гражданская война 1990-х годов глубоко травмировала страну, оставив после себя поколение, опасающееся экстремизма и нестабильности. Государство извлекло из этой мрачной главы горькие уроки, сосредоточившись на сохранении национального единства, укреплении институтов безопасности и предотвращении хаоса идеологической конфронтации. Однако эти уроки также оправдывают сохранение контроля старой гвардии над политикой, поскольку страх повторения по-прежнему определяет каждую реформу."
 AlgeriaElections.1.t: "Выборы"
 AlgeriaElections.1.d: "Впервые за много лет в Алжире проходят по-настоящему конкурентные выборы. В воздухе витает одновременно предвкушение и напряжение, поскольку миллионы граждан направляются к избирательным участкам, полные решимости определить будущее своей страны после десятилетий политической стагнации. На политическом ландшафте доминируют несколько сил.\n\nОдин блок, состоящий из реформистских, либеральных и умеренных исламистских фракций, выступает за демократию, прозрачность и национальное примирение. Их видение призывает к демонтажу системы «Le Pouvoir» и восстановлению легитимности управления. Их призывы находят сильный отклик у молодежи, гражданского общества и рабочих, стремящихся к подлинным переменам.\n\nДругой фронт состоит из прагматичных независимых кандидатов и технократов, стремящихся к реформам изнутри. Они ставят во главу угла постепенную демократизацию, улучшение управления и экономическую либерализацию, сохраняя при этом стабильность и безопасность.\n\nПо мере подсчета голосов одна партия выходит победителем, каждая из которых представляет свой собственный путь развития страны в будущем."
 AlgeriaElections.1.a: "FFS заявляет о победе"
 AlgeriaElections.1.b: "Партия РНД победила на выборах"
 AlgeriaElections.1.c: "MSP получает мандат"
 AlgeriaElections.1.dd: "RCD приходит к власти"
 AlgeriaElections.2.t: "Выборы"
 AlgeriaElections.2.d: "Долгожданные выборы наконец состоялись, и страна затаила дыхание. Правящий Фронт национального освобождения (ФНО) вновь выступает в качестве центральной опоры политической системы Алжира, обращаясь к тем, кто по-прежнему ценит стабильность, единство и преемственность после потрясений «Черного десятилетия». Под руководством президента Абдельазиза Бутефлики и лояльного партии истеблишмента ФНО обещает модернизацию без хаоса, реформы без разрыва.\n\nОппозиционные движения, хотя и громкие и разнообразные, остаются разрозненными и неспособными сформировать единый фронт, способный бросить вызов старой гвардии. Многие алжирцы, уставшие от потрясений и стремящиеся к порядку, отдают свои голоса за привычное, убежденные, что опыт и безопасность перевешивают риски перемен.\n\nПо мере подсчета окончательных голосов становится ясно: наследие революции по-прежнему остается главным."
 AlgeriaElections.2.a: "Фронт национального освобождения одержал очередную победу!"
 ALG_election_time: "Период выборов"
 ALG_election_time_desc: "Алжир готовится к очередному решающему избирательному сезону. Политическая обстановка напряженная, поскольку как правящая партия Фронт национального освобождения (ФНО), так и оппозиционные партии готовят свои избирательные кампании."
 ALG_FLN_media_control: "Государственные СМИ"
 ALG_FLN_media_control_desc: "Ужесточая контроль над прессой и телевидением, правительство обеспечивает сохранение в общественном сознании лояльности правящей партии Фронт национального освобождения (ФНО) и ее видению стабильности."
 ALG_loyal_military: "Верные военные"
 ALG_loyal_military_desc: "Армия доказала свою надежность в качестве защитника режима, обеспечивая сохранение порядка и национального единства превыше всего."
 ALG_FLN_state_led_development: "Развитие под руководством государства"
 ALG_FLN_state_led_development_desc: "Государство управляет основными секторами экономики, обеспечивая сохранение промышленного и социального развития под национальным контролем."
 ALG_FLN_oil_for_people: "Нефть для народа"
 ALG_FLN_oil_for_people_desc: "Правительство использует огромные углеводородные богатства страны для предоставления социальных пособий и субсидий, продвигая общественный договор, основанный на экономическом перераспределении."
 ALG_FLN_national_security_council: "Совет национальной безопасности"
 ALG_FLN_national_security_council_desc: "Высокопоставленный орган, координирующий внутреннюю безопасность и контрразведку, обеспечивающий оперативное нейтрализацию угроз государству."
 ALG_FLN_industrial_nationalization: "Промышленная национализация"
 ALG_FLN_industrial_nationalization_desc: "Правительство Фронта национального освобождения (ФНО) предприняло шаги по восстановлению контроля над ключевыми отраслями промышленности для защиты экономического суверенитета Алжира."
 ALG_FLN_legacy_of_stability: "Наследие стабильности"
 ALG_FLN_legacy_of_stability_desc: "Несмотря на свои недостатки, правительство ФЛН обеспечило преемственность и стабильность, что многие алжирцы ценят после многих лет потрясений."
 ALG_FLN_oil_for_people_idea: "Нефть для народа"
 ALG_FLN_oil_for_people_idea_desc: "Правительство решило использовать доходы от нефти для прямого финансирования государственных программ и субсидий. Хотя это и повышает уровень жизни, это также чревато долгосрочной неэффективностью и зависимостью."
 ALG_FLN_legacy_of_stability_idea: "Наследие стабильности"
 ALG_FLN_legacy_of_stability_idea_desc: "На протяжении десятилетий Фронт национального освобождения (ФНО) позиционировал себя как защитника стабильности Алжира. Его жесткий контроль над политикой и безопасностью обеспечивает мир, но ценой ограничения свобод."
 ALG_FLN_industrial_nationalization_idea: "Промышленная национализация"
 ALG_FLN_industrial_nationalization_idea_desc: "Крупные сектора экономики передаются под государственный контроль для обеспечения национальной независимости и направления промышленного роста в соответствии с государственным планированием."
 ALG_FLN_state_led_development_idea: "Развитие под руководством государства"
 ALG_FLN_state_led_development_idea_desc: "Государство играет активную роль в руководстве экономическим ростом Алжира, уделяя особое внимание инфраструктуре, образованию и социальному обеспечению для укрепления основ страны."
 ALG_FLN_media_control_idea: "Кодекс информации"
 ALG_FLN_media_control_idea_desc: "Кодекс информации устанавливает правовую основу, регулирующую деятельность прессы и телерадиовещания, позволяя государству регулировать деятельность средств массовой информации и направлять национальное информационное пространство."
 ALG_FLN_national_security_council_idea: "Совет национальной безопасности"
 ALG_FLN_national_security_council_idea_desc: "Влиятельный совет, состоящий из военных, сотрудников разведки и высокопоставленных чиновников, контролирует внутреннюю стабильность и национальную стратегию, обеспечивая лояльность правительству Фронта национального освобождения (ФНО)."
 ALG_loyal_military_idea: "Верные военные"
 ALG_loyal_military_idea_desc: "Военные сохраняют верность Фронту национального освобождения (ФНО), ценя порядок и иерархию превыше всего. Это единство достигается ценой снижения адаптивности и инициативы на поле боя."
 ALG_loyal_military2_idea: "Верный Военный Корпус"
 ALG_loyal_military2_idea_desc: "Лояльность армии укрепилась благодаря политической интеграции и привилегированным льготам, что обеспечило наличие мощного и дисциплинированного военного аппарата под командованием правительства."
 ALG_invest_in_youth_idea: "Инвестируйте в молодежь"
 ALG_invest_in_youth_idea_desc: "Программы по обучению и трудоустройству растущего молодого населения Алжира определят будущее страны, создав новое поколение профессионалов и лидеров."
 ALG_anti_corruption_campaign_idea: "Антикоррупционная кампания"
 ALG_anti_corruption_campaign_idea_desc: "Правительство начало кампанию по искоренению коррупции и злоупотреблений в бюрократической сфере, стремясь восстановить доверие населения и повысить эффективность работы государства."
 ALG_new_era_for_algeria_idea: "Новая эра для Алжира"
 ALG_new_era_for_algeria_idea_desc: "Алжир вступает в новую эру реформ и модернизации, балансируя между инновациями и социальным прогрессом и вызовами меняющейся глобальной экономики."
 ALG_open_market_idea: "Политика открытого рынка"
 ALG_open_market_idea_desc: "Постепенная либерализация алжирской экономики стимулирует инвестиции и предпринимательство, но при этом существует риск ослабления традиционного государственного контроля над ключевыми отраслями."
 ALG_reform_education_system_idea: "Реформировать систему образования"
 ALG_reform_education_system_idea_desc: "Проводятся масштабные реформы с целью модернизации системы образования, содействия инновациям и приведения школ в соответствие с потребностями современной алжирской экономики."
 ALG_reform_the_judicial_system_idea: "Судебная реформа"
 ALG_reform_the_judicial_system_idea_desc: "В настоящее время предпринимаются усилия по модернизации судебной системы Алжира, сокращению коррупции и созданию более справедливых судов, обеспечивающих верховенство права."
 ALG_free_media_idea: "Свободные СМИ"
 ALG_free_media_idea_desc: "Независимые СМИ начинают процветать, обеспечивая прозрачность и подотчетность, хотя это также усиливает критику и общественные дебаты."
 ALG_black_decade_lesson_idea: "Уроки «Черного десятилетия»"
 ALG_black_decade_lesson_idea_desc: "Травма гражданской войны до сих пор преследует Алжир. Страна сохраняет осторожность, отдавая приоритет безопасности, а не риску, чтобы подобная нестабильность никогда не повторилась."
 ALG_election_day: "День выборов"
 ALG_election_day_desc: "Настало время для алжирцев выбрать свое будущее. Сохранит ли правящая партия ФЛН свою власть или одержит победу оппозиция, определит будущее страны на десятилетия вперед."
 ALG_FLN_path: "Победа ФЛН"
 ALG_FLN_path_desc: "Фронт национального освобождения (ФНО) вновь одержал победу, сохранив контроль над правительством и определяя будущее Алжира."
 ALG_FLN_preserve_system: "Сохраните систему"
 ALG_FLN_preserve_system_desc: "Руководство ФЛН не видит необходимости в радикальных изменениях, сохранение существующего порядка обеспечивает стабильность и преемственность."
 ALG_FLN_control_media: "Принять Органический закон №. 12-05"
 ALG_FLN_control_media_desc: "Приняв Органический закон № 12-05 регулируя информацию и деятельность средств массовой информации, государство может формировать национальный нарратив, сохраняя при этом правовую базу для надзора за прессой."
 ALG_election_day_tt: "§YОткрывает путь к президентским выборам в Алжире 2004 года.§!\nВскоре вам придётся выбирать между этими решениями. §RФЛН§! и §YОппозиция§! ради будущего страны."
 ALG_ethnic_kabyle_tt: "§YKabyle Population§! more than §Y10%§!"
 ALG_kabyle_satisfaction_tt: "§YKabyle Удовлетворенность§! составляет как минимум §Y65§!"
 ALG_kabyle_satisfaction_70_tt: "§YKabyle Удовлетворенность§! больше, чем §Y70§!"
 ALG_kabyle_satisfaction_60_tt: "§YKabyle Удовлетворенность§! составляет как минимум §Y60§!"
 ALG_fossil_fuel_industry: "Вестибюль Сонатрах"
 ALG_fossil_fuel_industry_desc: "Государственный энергетический гигант Sonatrach и его сеть подрядчиков образуют одну из самых влиятельных фракций в Алжире. Они защищают субсидии, сопротивляются экономической диверсификации и поддерживают тесные связи с иностранными компаниями и правительствами, зависящими от алжирской нефти и газа."
 ALG_the_military: "Народная национальная армия (АНП)"
 ALG_the_military_desc: "Алжирская армия, АНП, является опорой государства. Она выступает в роли защитника национального единства и стабильности, но её доминирование ограничивает демократические реформы. Балансируя между защитой Алжира и ограничением гражданского правления, АНП всегда играет решающую роль в политике."
 ALG_industrial_conglomerates: "ЦЕВИТАЛ-МАДАР"
 ALG_industrial_conglomerates_desc: "Промышленные конгломераты, в которых доминируют такие гиганты, как Cevital и Madar Holdings, представляют собой растущую олигархическую бизнес-элиту Алжира. Тесно связанные с политической властью и часто переплетенные с военными и правящими семьями, эти группы стремятся к прибыли посредством приватизации, производства потребительских товаров, недвижимости и внешней торговли. Они могут обеспечить столь необходимые инвестиции и рост, но ценой коррупции, неравенства и политического влияния."
 ALG_offices_contruction_speed: "Скорость строительства офисных зданий"
 ALG_arms_factory_contruction_speed: "Строительство военных заводов SPED"
 ALG_civ_construction_speed: "Скорость строительства гражданских заводов"
 ALG_population_energy_consumption: "Потребление энергии населением"
 ALG_civ_factory_workforce: "Требуются гражданские рабочие на завод."
 ALG_mil_factory_workforce: "Требуются рабочие на военные заводы."
 ALG_office_workforce: "Требуются офисные работники"
 ALG_military_modifier: "Алжирские вооруженные силы"
 ALG_military_modifier_desc: "Отражает возможности и реформы алжирской армии."
 ALG_opposition_path: "Путь оппозиции"
 ALG_opposition_path_desc: "По мере усиления политической оппозиции страна сталкивается с выбором: проводить реформы изнутри или рисковать хаосом. Пришло время отдать предпочтение прозрачности и прогрессу."
 ALG_OPP_free_elections: "Провести свободные выборы"
 ALG_OPP_free_elections_desc: "Слишком долго голос народа был заглушен. Истинная демократия начинается с прозрачных и честных выборов."
 ALG_FLN_military_loyalty: "Обеспечение лояльности военнослужащих"
 ALG_FLN_military_loyalty_desc: "Вооруженные силы — это опора стабильности. Обеспечение их лояльности предотвратит беспорядки и обеспечит будущее нашей страны."
 ALG_FLN_public_works: "Запуск программ общественных работ"
 ALG_FLN_public_works_desc: "Инвестируя в общественную инфраструктуру, мы создаём рабочие места и укрепляем доверие людей к государственным институтам."
 ALG_reform_armed_forces: "Реформировать вооруженные силы"
 ALG_reform_armed_forces_desc: "Модернизация военной структуры обеспечит эффективность, дисциплину и лояльность государству, а не отдельным лицам."
 ALG_counter_extremism: "Возможности по борьбе с терроризмом"
 ALG_counter_extremism_desc: "Террористические сети угрожают национальной стабильности. Укрепление разведывательных служб, сил безопасности и программ предотвращения терроризма позволит нам повысить контртеррористический потенциал Алжира."
 ALG_regional_power: "Региональная держава"
 ALG_regional_power_desc: "Достигнув внутренней стабильности, Алжир может продемонстрировать силу и лидерство в Северной Африке и Средиземноморье."
 ALG_expanding_the_power_grid: "Расширить энергосеть"
 ALG_expanding_the_power_grid_desc: "Надежное электроснабжение жизненно важно для экономического роста. Расширение энергетической сети будет способствовать развитию промышленности и сельских районов."
 ALG_OPP_new_constitution: "Разработать проект новой конституции"
 ALG_OPP_new_constitution_desc: "Новая конституция заложит основу для демократии, равенства и гражданского правления."
 ALG_OPP_media_freedom: "Обеспечьте свободу СМИ"
 ALG_OPP_media_freedom_desc: "Свобода прессы имеет решающее значение для привлечения лидеров к ответственности и правдивого информирования общественности."
 ALG_OPP_judiciary_reform: "Реформировать судебную систему"
 ALG_OPP_judiciary_reform_desc: "Независимая и прозрачная судебная система является ключом к обеспечению справедливости для всех граждан, независимо от их статуса или влияния."
 ALG_OPP_education_first: "Образование прежде всего"
 ALG_OPP_education_first_desc: "Современное государство зависит от хорошо образованного населения. Инвестиции в школы и университеты сформируют светлое будущее."
 ALG_OPP_open_market: "Открыть рынок"
 ALG_OPP_open_market_desc: "Экономические реформы и открытая торговля привлекут инвестиции и создадут возможности для предпринимателей."
 ALG_OPP_new_era: "Новая эра для Алжира"
 ALG_OPP_new_era_desc: "После многих лет борьбы и реформ Алжир вступает в новую главу свободы, процветания и стабильности."
 ALG_OPP_anti_corruption: "Борьба с коррупцией"
 ALG_OPP_anti_corruption_desc: "Коррупция истощает потенциал страны. Пришло время для строгих законов, прозрачных институтов и подотчетности на всех уровнях."
 ALG_OPP_invest_in_youth: "Инвестируйте в молодежь"
 ALG_OPP_invest_in_youth_desc: "Молодежь – душа Алжира. Расширяя ее возможности посредством образования и трудоустройства, мы обеспечиваем будущее страны."
 ALG_OPP_state_first: "Государство на первом месте."
 ALG_OPP_state_first_desc: "В периоды перемен единство и национальные интересы должны лежать в основе любой политики. Целостность государства важнее партийной выгоды."
 ALG_terror_2013_in_amenas_title: "2013 год, кризис с заложниками в Аменасе."
 ALG_terror_2013_in_amenas_desc: "Группа вооруженных боевиков, связанных с экстремистскими организациями, совершила внезапное нападение на газовый объект в Ин-Аменасе на юге Алжира. Нападавшие захватили сотни заложников, в том числе иностранных рабочих, что вызвало международный кризис. Алжирская армия быстро окружила объект, что привело к кровавому противостоянию, потрясшему весь мир и поставившем под сомнение способность правительства бороться с терроризмом в пустынных регионах."
 ALG_terror_2013_placeholder_option: "Наши силы дают решительный ответ."
 ALG_terror_2013_low_tt: "Незначительные неполадки устранены. §GСтабильность немного улучшилась.§!"
 ALG_terror_2013_medium_tt: "Ситуация ухудшается, подпитывая §OРадикализация§! и уменьшая §Rстабильность§!."
 ALG_terror_2013_high_tt: "Нападение выходит из-под контроля. §RНациональная стабильность резко падает§! как §OРадикальные повстанцы§! продвигаться вперед."
 ALG_healthcare_reform_tt: "§YОбщественное недовольство§! должно быть ниже §Y40§! начать реформу здравоохранения."
 ALG_education_reform_tt: "§YОбщественное недовольство§! должно быть ниже §Y40§! начать реформу образования."
 ALG_unemployment_reform_tt: "§YОбщественное недовольство§! должно быть ниже §Y40§! начать реформу системы пособий по безработице."
 ALG_employment_TT: "§HБезработица§! меньше §H20%§!"
 ALG_grand_mosque: "Большая мечеть Алжира"
 ALG_grand_mosque_desc: "Великая мечеть Алжира, символ духовного и культурного возрождения страны, является одной из самых высоких и величественных мечетей в мире. Ее строительство не только демонстрирует архитектурные амбиции нации, но и служит маяком исламского наследия и единства. Завершение этого монументального проекта укрепит национальную гордость и продемонстрирует влияние Алжира в мусульманском мире."
 ALG_big_cities_or_rising_states: "Программа городского или регионального развития"
 ALG_big_cities_or_rising_states_desc: "После завершения программы послевоенного восстановления правительство должно решить, что делать дальше: следует ли сосредоточить ресурсы на крупных прибрежных городах для укрепления промышленной базы Алжира или же поднять на новый уровень внутренние и пустынные регионы для достижения сбалансированного национального роста?"
 ALG_focus_on_big_cities: "Сосредоточьтесь на крупных городах"
 ALG_focus_on_big_cities_desc: "Такие городские центры, как Алжир, Оран и Константина, являются двигателями экономики Алжира. Сосредоточив усилия по развитию именно там, мы сможем модернизировать нашу инфраструктуру и повысить производительность."
 ALG_rising_states_program: "Программа «Восходящие штаты»"
 ALG_rising_states_program_desc: "В то время как прибрежные города процветают, внутренние регионы отстают. Программа «Растущие государства» направлена на развитие дорожной сети, школ и промышленности в самом сердце Алжира, чтобы ни одна провинция не осталась без внимания."
 ALG_develop_atlas: "Разработать Алжирский Атлас"
 ALG_develop_atlas_desc: "Горные районы Атласа обладают огромным потенциалом для сельского хозяйства и малого бизнеса. Инвестиции в эти регионы позволят улучшить уровень жизни местного населения и обеспечить долгосрочную продовольственную безопасность."
 ALG_develop_kabylia: "Расширить регион Кабилия"
 ALG_develop_kabylia_desc: "Кабилия обладает сильной культурной самобытностью и трудолюбивым населением. Развитие ее инфраструктуры и офисных зданий укрепит как региональную гордость, так и национальное единство."
 ALG_develop_aures: "Развитие сельского хозяйства в регионе Оре."
 ALG_develop_aures_desc: "В горах Оре расположены обширные сельскохозяйственные угодья и трудолюбивые общины. Модернизация сельскохозяйственного производства в этом регионе позволит сократить бедность в сельской местности и стабилизировать снабжение продовольствием."
 ALG_expand_oran: "Расширить промышленную зону Орана"
 ALG_expand_oran_desc: "Оран — один из важнейших промышленных и портовых городов Алжира. Расширение его промышленной зоны создаст новые рабочие места и увеличит экспорт."
 ALG_expand_algiers: "Модернизировать Алжир"
 ALG_expand_algiers_desc: "Будучи бьющимся сердцем Алжира, Алжир должен продолжать развиваться. Новые офисы, инфраструктура и городские реформы превратят его в образцовую столицу Северной Африки."
 ALG_expand_constantine: "Инвестируйте в Константина"
 ALG_expand_constantine_desc: "Богатая образовательная и культурная история Константины делает его идеальным центром высшего образования и инноваций. Инвестиции сюда позволят воспитать новое поколение алжирских мыслителей и инженеров."
 ALG_develop_tamanrasset: "Развитие инфраструктуры Таманрассета"
 ALG_develop_tamanrasset_desc: "В глубине Сахары расположен Таманрассет, ключевой пункт для логистики юга Алжира. Дороги, узлы снабжения и коммуникационная инфраструктура соединят пустыню с севером."
 ALG_develop_mzab: "Электроэнергия для долины Мзаб"
 ALG_develop_mzab_desc: "Регион Мзаб отличается стойкостью и растущими потребностями в энергии. Строительство новых электростанций обеспечит электроэнергией и создаст рабочие места для местного населения."
 ALG_develop_granderg: "Используйте ресурсы Гранд-Эрга"
 ALG_develop_granderg_desc: "Гранд-Эрг-Оксиденталь может казаться пустынным, но его подземные богатства говорят об обратном. Развитие нефтедобывающих месторождений здесь укрепит позиции Алжира как производителя энергии."
 ALG_FIS.1.t: "Возвращение улемов"
 ALG_FIS.1.d: "Внутри Исламского фронта спасения разгорелись ожесточенные дебаты о направлении нашего движения. Ваххабитские ученые, вдохновленные строгими саудовскими интерпретациями, призывают к полному очищению алжирского ислама и политики от того, что они считают коррупционными нововведениями. Между тем, традиционные улемы Алжира выступают за возвращение к духовному руководству и национальные реформы в рамках более толерантной исламской системы.\n\nНаш выбор определит душу движения."
 ALG_FIS.1.a: "Следуйте за ваххабитскими улемами. Очищайте и укрепляйте веру."
 ALG_FIS.1.b: "Поддержите традиционных улемов. Реформируйте и направляйте нацию."
 ALG_FIS.2.t: "Будущее Исламского фронта спасения"
 ALG_FIS.2.d: "В 1991 году, после массовых демонстраций, организованных Исламским фронтом спасения (ИФС), алжирские власти ответили силой, что стало одним из самых кровавых поворотных моментов в современной истории страны. Основатель движения, Аббаси Мадани, был приговорен к пятнадцати годам тюремного заключения после событий июня, во время которых армия и полиция жестоко разогнали тысячи сторонников ИФС. Генерал Халед Неззар приказал арестовать Мадани и ввел чрезвычайное положение, направленное на расформирование партии и подавление исламистского влияния. Эти репрессии привели к хаосу, жертвам среди гражданского населения и к исчезновению всякой надежды на мирные реформы, что стало искрой, разжегшей разрушительную гражданскую войну в Алжире, позже известную как «Черное десятилетие». После заключения Аббаси Мадани в тюрьму и расформирования руководства ИФС в движении появились новые фигуры. Теперь, когда наше влияние тихо возрождается, возникает вопрос: кто поведет нас через эту эпоху крови и жертв к новому видению Алжира?"
 ALG_FIS.2.a: "Назначить соучредителя и представителя народа. Али Бельхадж"
 ALG_FIS.2.b: "Примите путь борьбы. Абдельхак Лаяда, основатель GIA."
 ALG_ps_victory: "Победа Народного фронта спасения"
 ALG_ps_victory_desc: "Исламский фронт спасения одержал победу. Алжир стоит на перепутье, между верой и порядком, между мечетью и казармами. Теперь мы должны укрепить эту новую эру власти."
 ALG_consolidate_power: "Укрепить Новый Порядок"
 ALG_consolidate_power_desc: "Власть должна быть обеспечена на всех уровнях общества. Партия, улемы и вооруженные группы должны теперь служить одной единственной цели — сохранению нашей власти."
 ALG_national_reconstruction: "Национальная реконструкция"
 ALG_national_reconstruction_desc: "Наша истерзанная войной страна должна быть восстановлена из руин. Реконструкция потребует как веры, так и прагматизма, поскольку мы восстанавливаем промышленность и доверие населения."
 ALG_religious_reconciliation: "Религиозное примирение"
 ALG_religious_reconciliation_desc: "Разногласия среди исламских ученых Алжира угрожают нашему единству. Мы должны примирить наши разногласия и создать единую религиозную основу для нового государства."
 ALG_crackdown_purges: "Жесткие меры и чистки"
 ALG_crackdown_purges_desc: "Для сохранения власти мы должны устранить оппозицию. Необходимо очистить страну от остатков старого режима, светских чиновников и диссидентских фракций."
 ALG_unify_parties: "Объединить исламские движения"
 ALG_unify_parties_desc: "Различные исламистские группировки, поддержавшие наше восхождение, теперь должны быть объединены под одним знаменем. Единство уммы начинается с нас самих."
 ALG_infrastructure_crash: "Восстановление инфраструктуры"
 ALG_infrastructure_crash_desc: "Гражданская война оставила нашу инфраструктуру в руинах. Мы запустим экстренные программы по восстановлению дорог, мостов и инженерных сетей."
 ALG_industry_investment: "Промышленные инвестиции"
 ALG_industry_investment_desc: "Для обеспечения долгосрочного восстановления мы должны инвестировать в национальную промышленность и поддерживать местных предпринимателей, руководствующихся исламскими экономическими принципами."
 ALG_madrasa_reforms: "Реформы медресе"
 ALG_madrasa_reforms_desc: "Образование должно соответствовать как современным потребностям, так и религиозным ценностям. Реформирование наших медресе обеспечит подготовку нового поколения ученых и инженеров, обладающих глубокими знаниями и верой."
 ALG_community_outreach: "Программы работы с местным сообществом"
 ALG_community_outreach_desc: "Мы будем укреплять связь с местными сообществами посредством социальных инициатив, способствуя единству и солидарности на основе исламских ценностей."
 ALG_internal_security: "Аппарат внутренней безопасности"
 ALG_internal_security_desc: "Мы должны создать лояльную внутреннюю сеть безопасности для подавления беспорядков и защиты революции изнутри."
 ALG_intelligence_network: "Исламское разведывательное бюро"
 ALG_intelligence_network_desc: "Эффективная разведывательная служба позволит нам предвидеть угрозы и нейтрализовать заговоры до того, как они смогут укорениться."
 ALG_transport_upgrade: "Модернизация транспорта"
 ALG_transport_upgrade_desc: "Современные транспортные системы ускорят торговлю, улучшат мобильность и свяжут регионы Алжира теснее, чем когда-либо прежде."
 ALG_energy_program: "Национальная энергетическая программа"
 ALG_energy_program_desc: "Развитие как возобновляемых, так и традиционных источников энергии станет основой новой экономики Алжира."
 ALG_scholastic_centers: "Научно-исследовательские центры"
 ALG_scholastic_centers_desc: "Наши ученые и исследователи будут работать бок о бок, чтобы продвигать как исламские знания, так и современную науку во имя национального прогресса."
 ALG_social_welfare: "Расширение системы социального обеспечения"
 ALG_social_welfare_desc: "Мы будем заботиться о бедных, вдовах и перемещенных лицах, обеспечивая, чтобы каждый алжирец пользовался благами нашего управления, основанного на вере."
 ALG_military_rebuild: "Восстановить Армию Веры"
 ALG_military_rebuild_desc: "Армию необходимо восстановить и очистить от коррупции. Дисциплинированная армия защитит революцию и нацию."
 ALG_garrison_restructure: "Реструктуризация гарнизона"
 ALG_garrison_restructure_desc: "Мы должны реорганизовать наши гарнизоны, чтобы обеспечить лояльность, эффективность и готовность к противодействию внешним и внутренним угрозам."
 ALG_factory_output: "Расширение промышленного производства"
 ALG_factory_output_desc: "Наши инвестиции окупаются. Заводы теперь будут работать на полную мощность, чтобы стимулировать экономический рост."
 ALG_oil_and_minerals: "Разработка нефтяных и минеральных месторождений"
 ALG_oil_and_minerals_desc: "Богатые природные ресурсы Алжира — это божественный дар. Мы будем использовать их ответственно, чтобы обеспечить энергетическую независимость."
 ALG_religious_council: "Учредить религиозный совет"
 ALG_religious_council_desc: "Высший совет улемов будет определять моральное и духовное направление развития нации, обеспечивая соответствие каждого закона шариату."
 ALG_national_cohesion: "Национальное сплочение"
 ALG_national_cohesion_desc: "Благодаря социальной поддержке и вере мы залечим раны войны и создадим новую, единую алжирскую идентичность."
 ALG_border_defences: "Укрепить границы"
 ALG_border_defences_desc: "Наши границы должны быть укреплены против проникновения и контрабанды. Враги революции находятся как за пределами наших границ, так и внутри них."
 ALG_strategic_reserves: "Программа стратегических резервов"
 ALG_strategic_reserves_desc: "Мы будем накапливать запасы и расширять наши резервы, чтобы обеспечить выживание во времена войны или экономической нестабильности."
 ALG_heavy_industry: "Развитие тяжелой промышленности"
 ALG_heavy_industry_desc: "Мы будем развивать нашу промышленную базу, выходя за рамки производства потребительских товаров, и сосредоточимся на производстве тяжелой техники, стали и вооружений."
 ALG_international_trade: "Расширение международной торговли"
 ALG_international_trade_desc: "Благодаря торговле с дружественными странами исламского мира, Алжир может стать центром религиозной торговли."
 ALG_cultural_influence: "Инициатива культурного влияния"
 ALG_cultural_influence_desc: "Мы будем экспортировать нашу культуру, нашу веру и наш пример, распространяя алжирскую модель исламского возрождения."
 ALG_welfare_programs: "Программы социального обеспечения"
 ALG_welfare_programs_desc: "Комплексные инициативы в области социального обеспечения укрепят нашу легитимность и защитят уязвимые слои населения."
 ALG_army_of_salvation: "Армия Спасения"
 ALG_army_of_salvation_desc: "Армия Спасения станет щитом ислама и мечом Алжира, дисциплинированной, верной и непоколебимой."
 ALG_nation_energy_independence: "Национальная энергетическая независимость"
 ALG_nation_energy_independence_desc: "Полностью взяв под контроль внутренние энергетические ресурсы, мы освободимся от зависимости от внешних источников."
 ALG_international_outreach: "Международная исламская просветительская деятельность"
 ALG_international_outreach_desc: "Мы протянем руку исламскому миру, налаживая связи с движениями и странами, разделяющими наше видение."
 ALG_regional_leadership: "Региональное руководство"
 ALG_regional_leadership_desc: "Алжир заявит о себе как о политическом, религиозном и экономическом лидере в Северной Африке и за ее пределами."
 ALG_technological_renaissance: "Технологический ренессанс"
 ALG_technological_renaissance_desc: "Вера и наука не враги. Мы возглавим новую эру технологического прогресса, руководствуясь исламской этикой."
 ALG_islamic_coalition: "Сформируйте Исламскую коалицию"
 ALG_islamic_coalition_desc: "Единство уммы должно быть восстановлено посредством сотрудничества. Алжир возглавит коалицию исламских стран на пути к взаимному процветанию."
 ALG_grand_strategy: "Великая стратегия"
 ALG_grand_strategy_desc: "Наша страна сейчас сильна в военном, экономическом и духовном плане. Пришло время наметить долгосрочную стратегию развития нашей цивилизации."
 ALG_final_salvation: "Окончательное спасение"
 ALG_final_salvation_desc: "Заключительный этап нашего пути к созданию общества, полностью руководствующегося божественным законом и нравственной силой."
 FIS_rust_belt_rejuvenation: "Восстановление Ржавого пояса"
 FIS_rule_to_perfection: "Правило, ведущее к совершенству"
 FIS_new_islamic_architecture: "Новая исламская архитектура"
 FIS_prioritize_military_industries: "Приоритет отдается военной промышленности."
 FIS_industrialize_the_umma: "Индустриализировать умму"
 ALG_fis_win: "Победа Исламского Фронта Спасения"
 ALG_fis_win_desc: "Благодаря настойчивости, единству и божественному руководству Исламский фронт спасения одержал победу над своими противниками. Предстоящий путь – это путь духовного управления и обновления. Для Алжира начинается новая глава, определяемая верой, справедливостью и волей Аллаха."
 ALG_fis_win_tt: "§YРазблокирует дерево фокусов «Фронт исламского спасения» (FIS)§!"
 alg_politics_news.1.t: "Абдалла Джабалла основывает ФЖД"
 alg_politics_news.1.d: "Абдалла Джабалла, бывший лидер Движения за национальные реформы (Ислах) и основатель партии «Эннахда», объявил о создании новой политической партии — Фронта за справедливость и развитие (ФЗР). Вдохновленный турецкой Партией справедливости и развития (АКП), ФЗР стремится объединить исламские принципы с политической умеренностью и национальным развитием. Движение ставит перед собой цель восстановить доверие общественности к исламистской политике, делая акцент на справедливости, реформах и этичном управлении в пост-военный период в Алжире."
 alg_politics_news.1.a: "На политическую арену Алжира выходит новое исламистское движение."
 algerian.1.t: "Запрос Алжира на инвестиции в инфраструктуру"
 algerian.1.d: "Правительство Алжира обратилось к нам с предложением о финансировании строительства дорог, соединяющих фермы с рынками, и сельской инфраструктуры. Эти инвестиции улучшат распределение сельскохозяйственной продукции и производственные мощности в Алжире, а также позволят нам расширить наше политическое и экономическое влияние. Однако эта инициатива потребует финансового вклада из нашей казны."
 algerian.1.a: "Профинансируйте инфраструктурный проект"
 algerian.1.b: "Отклонить запрос"
 algerian.4.t: "Соглашение о сотрудничестве в сфере инфраструктуры одобрено."
 algerian.4.d: "Тунис согласился поддержать нашу инициативу по развитию инфраструктуры \"от фермы до рынка\". Инвестиции укрепят нашу сельскую экономику и промышленный потенциал, а также улучшат двусторонние отношения."
 algerian.4.a: "Шаг вперед для нашей экономики"
 algerian.5.t: "Финансирование инфраструктурных проектов отклонено"
 algerian.5.d: "Тунис отказался финансировать предложенную нами инфраструктурную инициативу. Без иностранной поддержки строительство дорог, соединяющих фермы с рынками, и связанных с этим проектов будет отложено."
 algerian.5.a: "Мы справимся сами."
 algeria_news.30.t: "Восстание Чёрной весны"
 algeria_news.30.d: "После нескольких лет беспорядков в Кабильском регионе вам предстоит решить, как реагировать на растущие требования берберского населения."
 algeria_news.30.a: "Предоставить кабилям полную независимость"
 algeria_news.30.b: "Предоставить кабилам автономию"
 algeria_news.30.c: "Подавить восстание"
 algeria_news.30_a_tt: "Выбрав этот путь, вы создадите независимое кабильское государство. Повысится стабильность, увеличится политическая власть."
 algeria_news.30_b_tt: "Выбор автономии предоставляет кабилам ограниченное самоуправление (Барбаха). Стабильность умеренно повышается, и они получают политическую власть."
 algeria_news.30_c_tt: "Подавление кабилов снизит стабильность и поддержку войны, но вы получите некоторую политическую власть."
 AlgeriaFocusEvents.43.t: "Приглашение на Совет исламских миров"
 AlgeriaFocusEvents.43.d: "Руководство [Root.GetName] получило официальное приглашение присоединиться к Совету исламских миров. Членство укрепит экономическое сотрудничество между исламскими странами, откроет новые торговые возможности и усилит наше общее политическое единство. Однако вступление может отдалить нас от неисламских экономических блоков."
 AlgeriaFocusEvents.43.a: "Вступите в Совет"
 AlgeriaFocusEvents.43.b: "Отклонить приглашение"
 AlgeriaFocusEvents.41.t: "Приглашение на Совет исламских миров"
 AlgeriaFocusEvents.41.d: "Алжир официально пригласил нас присоединиться к Совету исламских миров. Предложение акцентирует внимание на экономическом сотрудничестве, политической координации и укреплении связей между исламскими странами. Принятие приглашения может повысить наш региональный авторитет, в то время как отказ может обострить отношения."
 AlgeriaFocusEvents.41.a: "Это хорошая идея."
 AlgeriaFocusEvents.41.b: "Нам это неинтересно"
 AlgeriaFocusEvents.411.t: "Ирак отклонил приглашение"
 AlgeriaFocusEvents.411.d: "Правительство Ирака вежливо отклонило наше приглашение присоединиться к Совету исламских миров, сославшись на стратегические соображения и национальные приоритеты."
 AlgeriaFocusEvents.411.a: "К сожалению, но принято к сведению."
 AlgeriaFocusEvents.42.t: "Приглашение на Совет исламских миров"
 AlgeriaFocusEvents.42.d: "Мы получили официальный ответ относительно нашей инициативы по расширению Совета исламских миров. Приглашенная страна рассматривает вопрос о том, следует ли ей в экономическом и политическом плане присоединиться к Совету исламских миров."
 AlgeriaFocusEvents.42.a: "Приветствуйте их в Совете"
 AlgeriaFocusEvents.42.b: "Они отказались"
 AlgeriaFocusEvents.421.t: "Приглашение отклонено"
 AlgeriaFocusEvents.421.d: "Приглашенная страна отказалась от участия в Совете исламских миров. Наши дипломатические усилия придется перенаправить в другое русло."
 AlgeriaFocusEvents.421.a: "Очень хорошо"
 AlgeriaFocusEvents.81.t: "Приглашение в альянс CIW"
 AlgeriaFocusEvents.81.desc: "Мы получили приглашение присоединиться к альянсу «Совет исламских миров». Предложение обещает расширение сотрудничества и взаимной поддержки, хотя и может потребовать уступок взамен."
 AlgeriaFocusEvents.81.a: "Только с гарантиями взамен."
 AlgeriaFocusEvents.81.b: "Категорически нет"
 ALG_power_struggle_resistance_dominant: "§RНарод открыто бросает вызов режиму.§!"
 ALG_power_struggle_army_dominant: "§BВоенные жестко контролируют ситуацию§!"
 ALG_power_struggle_resistance_rising: "§YНа общественное давление против истеблишмента усиливается.§!"
 ALG_power_struggle_army_rising: "§YВоенные вновь утверждают свой контроль над властью.§!"
 ALG_power_struggle_stable: "§WХрупкое равновесие сохраняется§!"
 ALG_west_alignment_tt: "Формализовать стратегическое партнерство с Соединенными Штатами и углубить связи с НАТО и ЕС. Это предоставляет доступ к западным технологиям и инвестициям, но может привести к обострению отношений с Китаем и Россией."
 ALG_china_alignment_tt: "Углублять сотрудничество с Китаем в рамках инициативы «Один пояс и один путь». Ожидаются крупные инвестиции в инфраструктуру и рост торговли, но западные державы будут проявлять осторожность."
 alg_crackdown.1.t: "В Алжире вспыхнули протесты"
 alg_crackdown.1.d: "Арест оппозиционных деятелей спровоцировал уличные демонстрации. Протестующие требуют политических реформ и прекращения репрессий."
 alg_crackdown.1.a: "Подавляем протесты."
 alg_crackdown.1.b: "Освободите часть задержанных."
 alg_crackdown.2.t: "Общенациональные забастовки и демонстрации"
 alg_crackdown.2.d: "Запрет оппозиционных партий спровоцировал массовое движение, напоминающее протесты «Хирак». Страна парализована."
 alg_crackdown.2.a: "Развернуть армию."
 alg_crackdown.2.b: "Начать диалог и отменить запрет."
 democratic_reforms: "Процесс демократических реформ"
 ALG_healthcare_success_tt: "Наши реформы в сфере здравоохранения улучшат общественное здоровье и уменьшат количество жалоб."
 ALG_healthcare_failure_tt: "Неспособность провести реформу здравоохранения усилит общественное недовольство и укрепит политические позиции военных."
 ALG_education_success_tt: "Реформа образования модернизирует наш рынок труда и снизит уровень недовольства."
 ALG_education_failure_tt: "Кризис в сфере образования продолжается. Недовольство общественности нарастает."
 ALG_unemployment_success_tt: "Программы создания рабочих мест позволят снизить безработицу и стабилизировать ситуацию в стране."
 ALG_unemployment_failure_tt: "Неспособность решить проблему безработицы спровоцирует забастовки и беспорядки."
 ALG_tamazgha.1.t: "Приглашение от Тамазга"
 ALG_tamazgha.1.d: "Правительство [FROM.GetName], теперь переименованное в «Тамазга», обратилось к нам с предложением о создании нового регионального альянса, основанного на общем амазигском наследии и культурном сотрудничестве. Они утверждают, что эта конфедерация обеспечит взаимное экономическое развитие, безопасность и отказ от устаревших панарабских структур, таких как Лига арабских государств.\n\nХотя некоторые в нашем правительстве рассматривают это как историческую возможность, другие ставят под сомнение намерения и долгосрочные цели «Тамазги»."
 ALG_tamazgha.1.a: "Мы вступим в Конфедерацию Тамазга."
 ALG_tamazgha.1.b: "Это не наша борьба."
 ALG_election_time_idea: "Подготовка к следующим выборам"
 ALG_casablanca_decisions: "Инициатива «Касабланка»"
 ALG_casablanca_decisions_desc: "Дипломатические варианты оказания давления на Марокко в отношении Западной Сахары через Африканский союз или международные каналы."
 ALG_casablanca_mission_tt: "Начните миссию «Касабланкская инициатива». Для этого сначала нужно выбрать подход. Миссия длится 180 дней и дает низкий/средний/высокий результат."
 ALG_casablanca_mission_desc: "Начать ограниченную по времени дипломатическую кампанию. От ее исхода зависит, сможет ли давление Африканского союза снять претензии Марокко или (при наличии значительного успеха) лишить его основных территорий."
 ALG_casablanca_approach_tt: "Выберите стратегический подход для Касабланской инициативы. Можно выбрать только один подход; затем начните выполнение задания, чтобы провести кампанию."
 ALG_casablanca_approach_great_powers: "Придворная жизнь великих держав"
 ALG_casablanca_approach_great_powers_desc: "Тратьте политическую власть на ухаживание за крупными державами (США / Испания / Россия). Наибольший шанс оказать решающее давление на АС, но дорогостоящий и политически рискованный."
 ALG_casablanca_approach_regional: "Только региональный фокус"
 ALG_casablanca_approach_regional_desc: "Опирайтесь на региональных партнеров и избегайте влияния крупных держав. Это дешевле и менее рискованно, но с меньшей вероятностью приведет к решающим результатам."
 ALG_casablanca_approach_mixed: "Смешанная стратегия"
 ALG_casablanca_approach_mixed_desc: "Сочетание регионального и международного давления. Сбалансированные затраты и шансы."
 ALG_morocco.2.t: "Давление Африканского союза и ООН на Марокко"
 ALG_morocco.2.d: "После дипломатической кампании Алжира в Африканском союзе и ООН Марокко сталкивается с международным давлением в отношении Западной Сахары. Выполнит ли королевство требования или окажет сопротивление и рискует подвергнуться санкциям?"
 ALG_morocco.2.a: "Подчиняться под давлением"
 ALG_morocco.2.b: "Сопротивляйтесь давлению, рискуйте санкциями."
 Algeria_events.5.t: "Успешная кампания по борьбе с браконьерством"
 Algeria_events.5.desc: "Благодаря нашим скоординированным усилиям за последние месяцы были взяты под защиту сотни находящихся под угрозой исчезновения животных. Это не только сократило незаконную охоту, но и помогло сохранить хрупкие пустынные экосистемы, замедлив последствия опустынивания в пострадавших регионах."
 Algeria_events.5.a: "Отличный"
 Algeria_events.6.t: "Неудачная кампания по борьбе с браконьерством"
 Algeria_events.6.desc: "Несмотря на наши попытки защитить дикую природу, браконьеры продолжают свою деятельность в обычном режиме. Пустынная экосистема по-прежнему находится под угрозой, и наша кампания практически не оказала влияния на сдерживание опустынивания или незаконной охоты."
 Algeria_events.6.a: "Все эти усилия потрачены впустую!"
 ALG_ethnic_arab_display: "Арабы: [?ALG_ethnic_arab]%"
 ALG_ethnic_kabyle_display: "Кабиле: [?ALG_ethnic_kabyle]%"
 ALG_kabyle_content: "Кабильское сотрудничество"
 ALG_kabyle_content_desc: "Кабильцы, обладающие традиционно высоким уровнем образования, с энтузиазмом вносят свой вклад в национальное развитие и научные исследования."
 ALG_kabyle_discontent: "Движение за автономию Кабиля"
 ALG_kabyle_discontent_desc: "Кабильские активисты организуют протесты, требуя признания тамазигтского народа и большей региональной автономии. Тень «Черной весны» нависает над регионом."
 ALG_kabyle_unrest: "Кабильский кризис"
 ALG_kabyle_unrest_desc: "В Кабильском регионе разгорается открытое восстание. Протесты, забастовки и гражданское неповиновение парализуют регион. Необходимы срочные меры."
 ALG_black_spring_happened: "Произошла Черная весна"
 ALG_has_conducted_census: "Провела национальную перепись населения."
 ALG_ethnic_system_active: "Учреждение по делам этнических меньшинств"
 ALG_can_enact_ethnic_policy: "Может принять новую этническую политику"
 algeria_power_balance: "Алжирская политическая борьба"
 algeria_old_guard: "Le Pouvoir (Старая гвардия)"
 algeria_reformists: "Движение Хирак (реформисты)"
 algeria_compromise_range: "Хрупкий компромисс"
 algeria_compromise_range_desc: "Ни одна из сторон не доминирует. Сохраняется напряженная тупиковая ситуация, поскольку обе стороны стремятся к преимуществу."
 old_guard_leaning: "Влияние старой гвардии"
 old_guard_leaning_desc: "Военное ведомство начинает восстанавливать свое традиционное доминирование."
 old_guard_partial_control: "Консолидация старой гвардии"
 old_guard_partial_control_desc: "Газета Le Pouvoir усиливает свою хватку. Голоса реформаторов оттесняются на второй план."
 old_guard_strong_control: "Авторитарный дрейф"
 old_guard_strong_control_desc: "Аппарат безопасности доминирует в политической жизни. Демократические институты разрушаются."
 old_guard_full_control: "Военное превосходство"
 old_guard_full_control_desc: "Ле Пувуар контролирует Алжир железной рукой. Гражданские свободы строго ограничены."
 reformists_leaning: "Реформистские порывы"
 reformists_leaning_desc: "Гражданское общество становится смелее. Дух Хирака возрождается."
 reformists_gaining_ground: "Импульс реформ"
 reformists_gaining_ground_desc: "Реформаторское движение набирает силу. Старая гвардия изо всех сил пытается сохранить контроль."
 reformists_strong_momentum: "Демократический подъем"
 reformists_strong_momentum_desc: "В общественном дискурсе доминируют реформаторы. Реальные перемены кажутся возможными."
 reformists_victory: "Демократический переход"
 reformists_victory_desc: "Алжир поддерживает гражданское правление и плюрализм. Влияние Ле Пувуар сломлено."
 ALG_political_struggle: "Алжирская политическая борьба"
 ALG_political_struggle_desc: "Битва между старой гвардией и реформаторами определит будущее Алжира.\nТекущий баланс: [ALG_power_struggle_state]\nВоенный контроль: [ALG_army_grip_text]\nОбщественное недовольство: [ALG_grievance_text]"
 ALG_power_struggle_state: "Политическая ситуация"
 ALG_boost_reformists_tt: "Направьте ресурсы политикам-реформаторам и группам гражданского общества.\nСмещает баланс в сторону реформаторов на §G+0.15§!."
 ALG_boost_old_guard_tt: "Укрепление поддержки среди военных ветеранов и силовых структур.\nСмещение баланса в сторону старой гвардии на §R-0.15§!."
 ALG_rally_students_tt: "Мобилизация студенческих движений и молодежных активистов в поддержку реформ.\nСмещение баланса в сторону реформаторов на §G+0.08§!."
 ALG_mobilize_veterans_tt: "Объединение ветеранов войны за независимость и отставных офицеров.\nСмещение баланса в сторону старой гвардии на §R-0.08§!."
 ALG_bribe_elites_tt: "Использование патронажа для обеспечения лояльности элиты.\nСмещает баланс в сторону старой гвардии на §R-0.05§!.\nОбходится казначейству в §R30§!. Рискует подпитывать коррупцию."
 ALG_compromise_tt: "Выступая посредником в сделке по разделению власти между реформистами и старой гвардией.\nСдвигает баланс сил к центру на §W±0.08§!."
 ALG_media_campaign_reform_tt: "Запустить медиакампанию, продвигающую демократические ценности.\nСмещает баланс в сторону реформистов на §G+0.05§!."
 ALG_security_crackdown_tt: "Уполномочить силы безопасности подавлять инакомыслие.\nСмещает баланс в сторону старой гвардии на §R-0.05§!."
 ALG_world_tension_security_tt: "Глобальная нестабильность оправдывает усиление аппарата безопасности.\nСдвиг баланса в сторону старой гвардии на §R-0.08§!."
 ALG_world_tension_high_security_tt: "Серьезная глобальная напряженность требует чрезвычайных мер безопасности.\nСдвиг баланса в сторону старой гвардии на §R-0.12§!."
 ALG_crackdown_momentum_tt: "Наша политика жестких мер укрепляет позиции старой гвардии.\nСмещает баланс в сторону старой гвардии на §R-0.10§!."
 ALG_reconciliation_momentum_tt: "Наш подход к примирению усиливает голоса реформаторов.\nСмещает баланс в сторону реформаторов на §G+0.10§!."
 ALG_oil_patronage_tt: "Используйте доходы от нефти для финансирования патронажных сетей.\nСдвигает баланс в сторону старой гвардии на §R-0.06§!.\nОбходится казначейству в §R25§!, но повышает стабильность."
 ALG_economic_reforms_tt: "Внедрить меры экономической либерализации и повышения прозрачности.\nСмещает баланс в сторону реформистов на §G+0.08§!."
 ALG_elite_patronage: "Элитные сети покровительства"
 ALG_elite_patronage_desc: "Мы покупаем стабильность посредством патронажа, но это усугубляет коррупцию и истощает ресурсы."
 alg_politics.10.t: "Компромиссные переговоры"
 alg_politics.10.d: "Представители обеих фракций провели тайную встречу. Компромисс достигнут, но будут ли обе стороны его соблюдать?"
 alg_politics.10.a: "Примите соглашение"
 alg_politics.10.b: "Отвергните и продолжайте борьбу."
 alg_politics.20.t: "Реформисты захватывают власть"
 alg_politics.20.d: "Реформистское движение достигло критической массы. Старая гвардия стоит перед выбором: уйти в отставку или бороться."
 alg_politics.20.a: "Принять демократический переход"
 alg_politics.20.b: "Военные не сдадутся"
 alg_politics.21.t: "Военный переворот неминуем."
 alg_politics.21.d: "Генералы укрепили свою власть и стремятся оттеснить на второй план гражданских реформаторов."
 alg_politics.21.a: "Принять военную власть"
 alg_politics.21.b: "Защитите реформаторское движение"
 alg_politics.22.t: "Тени над Алжиром"
 alg_politics.22.d: "Силовые структуры становятся все более наглыми. Алжир движется к авторитаризму. Как нам на это реагировать?"
 alg_politics.22.a: "Безопасность должна быть на первом месте."
 alg_politics.22.b: "Снизьте напряжение, пока не стало слишком поздно."
 alg_politics.23.t: "Ветра перемен"
 alg_politics.23.d: "Реформаторское движение набирает силу. Но Ле Пувуар по-прежнему командует силами безопасности. Как нам действовать дальше?"
 alg_politics.23.a: "Продвигать реформы"
 alg_politics.23.b: "Притормозите, чтобы избежать обратной реакции."
 ALG_political_truce: "Политическое перемирие"
 ALG_political_truce_desc: "Между реформаторами и старой гвардией существует хрупкий компромисс."
 ALG_tamazight_integration_process: "Процесс интеграции тамазигитов"
 ALG_tamazight_integration_process_desc: "Официальное признание языка тамазигт внедряется во всех государственных учреждениях. Хотя это в значительной степени умиротворило регионы, бюрократические изменения и корректировка национальной идентичности вызывают временный период трений на пути к полной социальной сплоченности."
 ALG_auto.1.t: "Скандал в автомобильной промышленности"
 ALG_auto.1.desc: "Всплыли подробности широко распространенной коррупции в автомобильной промышленности Алжира. Многочисленные иностранные партнерства, включая Renault, BMW и Mercedes, оказались замешаны в схемах подкупа и мошеннических операциях с импортом. Общественность возмущена и требует принятия мер."
 ALG_auto.1.a: "Начать полномасштабное расследование"
 ALG_auto.1.b: "Замалчьте эту историю."
 ALG_auto.2.t: "Реакция на автомобильный скандал"
 ALG_auto.2.desc: "После расследования скандала нам необходимо решить, как в дальнейшем регулировать импорт автомобилей. Полный запрет станет сильным сигналом, но нанесет ущерб нашей экономике. Частичные ограничения представляют собой компромиссное решение."
 ALG_auto.2.a: "Ввести полный запрет на импорт."
 ALG_auto.2.b: "Ввести частичные ограничения"
 ALG_auto.2.c: "Не предпринимать никаких действий в отношении импорта"
 ALG_auto.3.t: "Компания Fiat предлагает партнерство."
 ALG_auto.3.desc: "Итальянский автопроизводитель Fiat обратился к нам с предложением о создании производственных мощностей в Алжире. Они видят возможности на нашем рынке после введения импортных ограничений. Это может оживить наш автомобильный сектор."
 ALG_auto.3.a: "Принять предложение Fiat"
 ALG_auto.3.b: "Договоритесь о более выгодных условиях."
 ALG_auto.3.c: "Отклонить предложение"
 ALG_auto.4.t: "Восстановление автомобильного сектора"
 ALG_auto.4.desc: "После нашей взвешенной реакции на скандал автомобильный сектор начинает стабилизироваться. Отечественные производители проявляют интерес к расширению, а иностранные компании продолжают обращаться к нам."
 ALG_auto.4.a: "Поддержка отечественных производителей"
 ALG_auto.4.b: "Рассматривайте предложения из-за рубежа"
 ALG_auto.5.t: "Fiat принимает наши условия."
 ALG_auto.5.desc: "Нашим переговорщикам удалось добиться успеха. Компания Fiat согласилась на более выгодные условия, включая дополнительные инвестиции и передачу технологий. Это значительная победа для алжирской промышленности."
 ALG_auto.5.a: "Отличные новости!"
 ALG_auto.6.t: "Fiat отклонил предложение о пересмотре условий."
 ALG_auto.6.desc: "Компания Fiat отклонила наши требования о более выгодных условиях. Они настаивают на том, что их первоначальное предложение более чем справедливо. Мы должны решить, принять ли их условия или полностью отказаться от сделки."
 ALG_auto.6.a: "Примите исходные условия."
 ALG_auto.6.b: "Откажитесь от сделки"
 ALG_corruption_auto_scandal: "Коррупционный скандал в автомобильной промышленности"
 ALG_corruption_auto_scandal_desc: "Раскрытие широко распространенной коррупции в нашей автомобильной промышленности подорвало доверие общественности. Иностранные партнеры дистанцируются от нас, пока продолжаются расследования. Наше промышленное производство и политический капитал понесли значительный ущерб."
 ALG_corruption_auto_scandal_coverup: "Замалчиваемый автомобильный скандал"
 ALG_corruption_auto_scandal_coverup_desc: "Мы пытались замять освещение скандала в автомобильной промышленности. Хотя непосредственный ущерб минимизирован, зарубежные разведывательные службы знают о нашем обмане, а у внутренних оппозиционных групп есть против нас аргументы. Правда еще может выйти наружу."
 ALG_import_ban_penalty: "Запрет на импорт автомобилей"
 ALG_import_ban_penalty_desc: "Вследствие коррупционного скандала был введен полный запрет на импорт автомобилей. Хотя это и является серьезным сигналом против иностранной эксплуатации, это серьезно нарушило цепочки поставок и промышленное производство. Потребители сталкиваются с дефицитом и ростом цен."
 ALG_import_restrictions_light: "Ограничения на импорт автомобилей"
 ALG_import_restrictions_light_desc: "Введены частичные ограничения на импорт автомобилей. Такой взвешенный подход позволяет сохранить некоторые торговые отношения, одновременно смягчая общественное недовольство коррупционным скандалом. Экономические последствия управляемы, но все же ощутимы."
 ALG_4g_rollout_tt: "§GАлжир запустил общенациональную мобильную сеть 4G:§!\n- Высокоскоростной мобильный интернет\n- Улучшенная связь между бизнес-партнерами\n- Расширение цифровых услуг"
 ALG_4g_coverage_basic: "Базовое покрытие 4G"
 ALG_4g_coverage_basic_desc: "Наша сеть 4G функционирует, но покрытие ограничено крупными городскими центрами. Необходимы дальнейшие инвестиции в инфраструктуру."
 ALG_4g_coverage_moderate: "Покрытие 4G — умеренное."
 ALG_4g_coverage_moderate_desc: "Покрытие 4G теперь распространяется на большинство городов и населенных пунктов. Предприятия и граждане получают выгоду от улучшенной связи."
 ALG_4g_coverage_good: "Покрытие 4G — хорошее."
 ALG_4g_coverage_good_desc: "На большей части территории Алжира обеспечено хорошее покрытие 4G. Цифровая экономика процветает, и производительность труда растет."
 ALG_4g_coverage_excellent: "Покрытие 4G — отличное."
 ALG_4g_coverage_excellent_desc: "Общенациональное покрытие 4G достигнуто! Алжир теперь является региональным лидером в области мобильной связи. Заложен фундамент для развития 5G."
 algerian_event.51.t: "Алжирский космический аппарат успешно приземлился на Луне!"
 algerian_event.51.desc: "Алжирское космическое агентство (ASAL) совершило исторический прорыв! Наш лунный посадочный модуль успешно совершил мягкую посадку на поверхность Луны, став пятым государством в истории, которому это удалось.\n\n Посадка транслировалась в прямом эфире по всей стране, и миллионы алжирцев с трепетом наблюдали за тем, как наш космический аппарат приземлился недалеко от южного полюса Луны. Ученые в центре управления в Алжире ликовали, когда телеметрия подтвердила успешную посадку.\n\nЭто достижение ставит Алжир в один ряд с СССР, США, Китаем и Индией в элитном клубе стран, способных осуществить мягкую посадку на Луну. Это кульминация десятилетий инвестиций в нашу космическую программу и свидетельство превращения Алжира в крупную космическую державу.\n\n Весь мир с восхищением наблюдает за тем, как на Луне водружается бело-зеленый флаг."
 algerian_event.51.a: "Огромный шаг вперед для Алжира!"
 ALG_missile_leverage: "Рычаг ракет"
 ALG_missile_leverage_desc: "Наши отношения с Китаем предоставляют возможность приобретения передовых ракетных технологий. Используя наши дипломатические связи и стратегическое положение, мы можем договориться о передаче крылатых ракет наземного базирования и мобильных пусковых установок. Это значительно повысит потенциал сдерживания Алжира."
 ALG_build_nuclear_reactor_tt: "§GСтроительство ядерного реактора: §!\n- Создание возможностей для гражданской атомной энергетики\n- Снижение зависимости от ископаемого топлива\n- Подготовка ученых и инженеров-ядерщиков\n- Основа для передовых ядерных исследований"
 ALG_election_pending: "Ожидаются национальные выборы"
 ALG_opposition_reforms_1: "Реформы оппозиции: свобода СМИ"
 ALG_opposition_reforms_1_desc: "Оппозиционное правительство начало свою программу реформ, гарантируя свободу СМИ. Теперь свободная пресса привлекает правительство к ответственности и информирует общественность."
 ALG_opposition_reforms_2: "Реформы оппозиции: система правосудия"
 ALG_opposition_reforms_2_desc: "Опираясь на реформы в сфере СМИ, оппозиционное правительство реформировало судебную систему. Теперь независимые суды обеспечивают справедливость для всех алжирцев и борются с коррупцией."
 ALG_opposition_reforms_3: "Оппозиционные реформы: Образование"
 ALG_opposition_reforms_3_desc: "Программа реформ оппозиции продолжается, включая крупные инвестиции в образование. Модернизированная система готовит алжирскую молодежь к предстоящим вызовам."
 ALG_opposition_reforms_4: "Новая эра для Алжира"
 ALG_opposition_reforms_4_desc: "Комплексная программа реформ оппозиции завершена. Алжир превратился в современное, демократическое и процветающее государство. Свободные СМИ, независимые суды, качественное образование и экономические возможности определяют эту новую эпоху."
 ALG_fis_movement: "Исламское движение спасения"
 ALG_fis_movement_desc: "ФИС (Федерация исламского правосудия) сплотила алжирский народ своим посланием об исламской демократии, социальной справедливости и борьбе с коррупцией. Мечети служат центрами общественной жизни, предоставляя социальные услуги, которые правительство игнорировало. Поддержка населения растет с каждым днем."
 ALG_fln.1.t: "Коррупционный скандал сотрясает Алжир."
 ALG_fln.1.desc: "Журналисты-расследователи раскрыли сеть коррупции, охватывающую всю политическую элиту Алжира. Банковские выписки показывают, что миллионы были переведены из государственных средств на частные счета. В деле замешаны, по всей видимости, несколько сторон, включая членов нашего собственного Фронта национального освобождения (ФНО).\n\nСкандал разразился достоянием общественности, и мы не можем его игнорировать. Доказательства неопровержимы, но то, как мы отреагируем, может либо стабилизировать, либо дестабилизировать всю политическую систему. Мы должны тщательно обдумать наши действия."
 ALG_fln.1.a: "Забудьте эту историю"
 ALG_cover_up_corruption_tt: "§RЗамять скандал: §!\n• Значительно возросла коррупция\n• Незначительная потеря политической власти\n• Репутация ФЛН немного пострадала\n• Стабильность пока сохранена\n\n§7\"Что люди не знают, им не повредит.\"§!"
 ALG_fln.1.b: "Вините оппозиционные партии"
 ALG_blame_others_tt: "§YОбвинение оппозиционных партий: §!\n• Коррупция усиливается\n• Оппозиционные партии сильно пострадали\n• Фронт национального освобождения получает некоторую поддержку\n• Потеряна некоторая стабильность\n\n§7\"Настоящие преступники здесь!\"§!"
 ALG_fln.1.c: "Пусть правда выйдет наружу"
 ALG_expose_all_tt: "§GРазоблачение всей коррупции: §!\n• Все стороны пострадали (включая Фронт национального освобождения)\n• Значительная потеря стабильности\n• Высокая цена политической власти\n• НО уровень коррупции снижается\n• Усиление антикоррупционной активности (бонус за 1 год)\n\n§7\"Народ заслуживает правды.\"§!"
 ALG_fln.1.e: "Начать полномасштабную антикоррупционную кампанию"
 ALG_anti_corruption_campaign_tt: "§GЗапуск антикоррупционной кампании:§!\n• Все пострадавшие стороны (включая ФНО)\n• Высокие казначейские издержки (§R-15§!)\n• Значительные издержки политической власти (§R-100§!)\n• Однако уровень коррупции значительно снижается.\n• §GПостоянные антикоррупционные реформы§!\n• Достижение долгосрочной стабильности\n\n§7\"Мы полностью искореним этот рак!\"§!"
 ALG_anti_corruption_momentum: "Антикоррупционный импульс"
 ALG_anti_corruption_momentum_desc: "Разоблачение коррупции вызвало общественный спрос на реформы. Хотя это и болезненный момент, проявление прозрачности создало импульс для позитивных перемен."
 ALG_anti_corruption_reforms: "Антикоррупционные реформы"
 ALG_anti_corruption_reforms_desc: "В правительстве были внедрены комплексные меры по борьбе с коррупцией. Прозрачные закупки, независимые аудиторы и защита лиц, сообщающих о нарушениях, сокращают объемы взяточничества и восстанавливают доверие общественности."
 ALG_fln.2.t: "Коррупционный скандал в компании Sonatrach"
 ALG_fln.2.desc: "В государственной нефтяной компании Алжира «Сонатрах» разразился масштабный коррупционный скандал. Расследование выявило хищение миллиардов через фиктивные контракты и офшорные счета. В деле замешаны высокопоставленные руководители и иностранные партнеры.\n\nОбщественность требует ответов. Как мы отреагируем?"
 ALG_fln.2.a: "Скройте это"
 ALG_fln.2.b: "Расследуйте коррупцию."
 ALG_fln.2.c: "Вините оппозицию"
 ALG_fln.3.t: "Пробуждение Хирака"
 ALG_fln.3.desc: "Миллионы алжирцев вышли на улицы в рамках массового движения, требуя перемен. Протесты «Хирак» объединили людей всех слоев общества — молодых и старых, светских и религиозных.\n\n\"Yetnahaw Ga3!\" («Они все должны уйти!») — этот лозунг разносится по каждому городу.\n\nСтарый порядок дрожит. Народ обрел свой голос."
 ALG_fln.3.a: "Народ высказался."
 ALG_grievance_increase_5_tt: "§YЖалобы народа:§! +5"
 ALG_cover_up_scandal: "Сокрытие скандала"
 ALG_cover_up_scandal_desc: "Коррупционный скандал в компании Sonatrach замалчивается, но слухи продолжают распространяться. Иностранные разведывательные службы знают о сокрытии правды, и она грозит всплыть на поверхность в любой момент."
 ALG_anti_corruption_probe: "Расследование по борьбе с коррупцией"
 ALG_anti_corruption_probe_desc: "Ведется тщательное расследование коррупции в компании Sonatrach. Хотя это и нарушает привычный ход дел, расследование восстанавливает доверие общественности и выявляет коррумпированных чиновников."
 ALG_shift_blame: "Вину переложили на оппозицию."
 ALG_shift_blame_desc: "Правительство успешно перенаправило общественное недовольство по поводу скандала с компанией Sonatrach на оппозиционные партии. Хотя это и эффективная пропаганда, такое отвлечение внимания никак не решает проблему коррупции, лежащую в основе скандала."
 ALG_mass_protests: "Массовые протесты"
 ALG_mass_protests_desc: "Движение «Хирак» вывело миллионы людей на улицы по всей Алжиру. Экономическая деятельность нарушена, поскольку люди требуют фундаментальных перемен. Старый порядок пошатнулся."
 ALG_FLN_chosen: "Выбранный путь ФЛН"
 ALG_fln_opp_path: "Оппозиционный путь ФЛН"
 ALG_domestic_development_focus: "Фокус на внутреннем развитии"
 ALG_domestic_development_focus_desc: "Алжир предпочел инвестировать в собственное развитие, а не в иностранную экспансию. Инфраструктурные проекты, промышленное развитие и социальные программы превращают страну в современное, процветающее государство."
 ALG_middle_east_expansion: "Расширение на Ближний Восток"
 ALG_middle_east_expansion_desc: "Наши армии движутся на Ближний Восток. Войска хорошо снабжены и воодушевлены перспективами славы и завоеваний."
 ALG_de_arabisation_effect_TT: "§YПолитика деарабизации:§!\n\n§G Возрождение берберского языка§!\n  Тамазигт становится одним из двух официальных языков.\n\n§G Культурное признание§!\n  Амазигская идентичность отмечается на национальном уровне\n\n§G Реформа образования§!\n  В школах преподают историю берберов.\n\n§RПоследствия:§!\n  - Поддержка арабских националистов\n  - Отношения с Лигой арабских государств\n  +Региональная стабильность Кабиля"
 ALG_civil_reforms_1: "Защита гражданских прав"
 ALG_civil_reforms_1_desc: "В Алжире установлены основные гарантии гражданских прав. Граждане пользуются большей свободой, и заложен фундамент для дальнейших реформ."
 ALG_civil_reforms_2: "Гражданские права и гендерное равенство"
 ALG_civil_reforms_2_desc: "Опираясь на реформы в области гражданских прав, Алжир добился прогресса в обеспечении гендерного равенства. Женщины все чаще выходят на рынок труда, что способствует повышению производительности и экономическому росту."
 ALG_civil_reforms_3a: "Гражданские реформы: Свобода прессы"
 ALG_civil_reforms_3a_desc: "Программа реформ в Алжире теперь включает в себя свободу прессы. Независимые СМИ привлекают правительство к ответственности, а гражданские права и гендерное равенство продолжают преобразовывать общество."
 ALG_civil_reforms_3b: "Гражданские реформы: независимость судебной власти"
 ALG_civil_reforms_3b_desc: "Программа реформ в Алжире теперь включает в себя независимую судебную систему. Справедливые суды борются с коррупцией, а гражданские права и гендерное равенство продолжают преобразовывать общество."
 ALG_civil_reforms_4: "Полномасштабные реформы гражданского общества"
 ALG_civil_reforms_4_desc: "Алжир завершил масштабные реформы гражданского общества. Гражданские права, гендерное равенство, свобода прессы, независимость судебной системы и расширение прав и возможностей организаций гражданского общества превратили Алжир в современную демократию."
 ALG_gov_reforms_1: "Инициатива цифрового правительства"
 ALG_gov_reforms_1_desc: "Алжир начал цифровизацию государственных услуг. Онлайн-платформы улучшают качество предоставления государственных услуг и снижают неэффективность бюрократии."
 ALG_gov_reforms_2: "Реформы государственной службы"
 ALG_gov_reforms_2_desc: "Опираясь на цифровые технологии, Алжир реформировал государственные услуги. Граждане пользуются более быстрыми и эффективными государственными услугами."
 ALG_gov_reforms_3a: "Антикоррупционные реформы"
 ALG_gov_reforms_3a_desc: "В результате антикоррупционной кампании в Алжире были очищены государственные учреждения. Восстановлены прозрачность и подотчетность."
 ALG_gov_reforms_3b: "Система электронного управления"
 ALG_gov_reforms_3b_desc: "Алжирский портал электронного правительства предоставляет гражданам беспрепятственный доступ к государственным услугам в режиме онлайн. Эффективность бюрократической работы значительно повысилась."
 ALG_gov_reforms_4: "Современное административное государство"
 ALG_gov_reforms_4_desc: "В Алжире создана полностью модернизированная, эффективная и прозрачная система государственного управления. Цифровые услуги, меры по борьбе с коррупцией и оптимизация бюрократии определяют новую администрацию."
 ALG_african_union_engagement_full_tt: "§GВзаимодействуйте с Африканским союзом:§!\n\n§YПоследствия для всех государств-членов Африканского союза:§!\n• §G+25§! Мнение об Алжире\n• §G+2%§! Алжирское влияние\n\nАлжир укрепляет свои позиции в качестве ведущего голоса в африканских делах."
 ALG_mend_ties_with_rabat: "Наладить отношения с Рабатом"
 ALG_mend_ties_with_rabat_desc: "Алжирско-марокканская граница закрыта с 1994 года. Конфликт в Западной Сахаре, Песчаная война 1963 года и расстановка сил в период холодной войны нанесли глубокие раны нашим народам.\n\nОднако нас объединяет общее амазигское и арабское наследие, общая борьба против колониализма и общие надежды на будущее наших народов. Возможно, пришло время оставить прошлое позади и построить новые отношения с Королевством Марокко."
 ALG_our_east_brothers: "Наши восточные братья"
 ALG_our_east_brothers_desc: "Алжир и Тунис бок о бок сражались против французского колониализма. Тунисская земля укрывала алжирских беженцев и бойцов Фронта национального освобождения во время нашей войны за независимость.\n\n Это братство необходимо укреплять. Вместе Алжир и Тунис могут стать ядром объединенного Магриба и привести Северную Африку к процветанию."
 ALG_black_spring: "Чёрная весна"
 ALG_black_spring_desc: "18 апреля 2001 года Массинисса Герма, молодой студент из Кабилии, был застрелен внутри жандармерии в Бени-Дуале. Его смерть спровоцировала крупнейшие протесты в Кабилии со времен обретения независимости, в результате которых более 100 человек были убиты силами безопасности. Началась Черная весна."
 ALG_black_spring_tt: "§HНачало Черной весны§!\nСмерть Массиниссы Гермах вызывает массовые протесты по всей Кабилии. Более 100 протестующих убиты жандармерией.\n\n§YТребования Кабилии:§!\n- Справедливость для погибших\n- Вывод жандармерии\n- Признание тамазигта\n- Прекращение «хогра» (презрения)"
 ALG_negotiate_with_arrouch: "Вести переговоры с Аррухом"
 ALG_negotiate_with_arrouch_desc: "Аррух (сельские советы) объединились в скоординированное движение, представляющее требования кабилов. Вместо конфронтации мы будем вести диалог с этими традиционными структурами."
 ALG_negotiate_arrouch_tt: "§HДвижение Арруча§!\nТрадиционные собрания кабильских деревень объединились, чтобы выдвинуть свои требования. Переговоры могут принести мир.\n\n§YКлючевые требования Арруча:§!\n- Признание платформы Эль-Ксер\n- Права на язык тамазигт\n- Экономическое развитие\n- Прекращение военного присутствия"
 ALG_recognize_tamazight_2002: "Тамазигт: национальный язык"
 ALG_recognize_tamazight_2002_desc: "8 апреля 2002 года, после напряженных переговоров, тамазигт будет признан национальным языком Алжира — историческая уступка берберской идентичности."
 ALG_tamazight_national_tt: "§HТамазайт становится национальным языком§!\nИсторический момент – Тамазайт становится национальным языком Алжира.\n\n§YЗначение: §!\n – Первое признание берберской идентичности\n Поправка к конституции\n – В школах можно преподавать тамазайт\n §GМайор Кабиль победа§!"
 ALG_address_hogra: "Обратитесь к Хогре"
 ALG_address_hogra_desc: "Необходимо решить проблему Хогры — презрения и унижения, которые испытывают кабилы со стороны государства. Инвестиции, рабочие места и уважение заменят пренебрежение и злоупотребления."
 ALG_address_hogra_tt: "§HПокончим с Хогрой§!\n«Хогра» — систематическое презрение, проявляемое к кабилам, — будет решаться следующим образом:\n\n- Инвестиции в инфраструктуру Кабилии\n- Программы создания рабочих мест\n- Прекращение дискриминационных практик\n- Уважение к достоинству кабилов"
 ALG_amazigh_cultural_revival: "Возрождение берберской культуры"
 ALG_amazigh_cultural_revival_desc: "Инвестиции в берберские культурные учреждения, музеи и образовательные программы позволят сохранить и прославить наследие берберов, существовавшее еще до прихода арабов."
 ALG_amazigh_revival_tt: "§HA Культурное возрождение берберов §!\n- Основана Академия берберов\n- Финансируются берберские музеи\n- Поддерживаются культурные фестивали\n- Продвигается письменность тифинаг"
 ALG_yennayer_national_holiday: "Национальный праздник Йеннайера"
 ALG_yennayer_national_holiday_desc: "В декабре 2017 года президент Бутефлика объявил Йеннайер — амазигский Новый год — национальным праздником. Теперь 12 января будет отмечаться по всей Алжире."
 ALG_yennayer_tt: "§HЙеннайер становится национальным праздником§!\nБерберский Новый год (12 января) теперь является официальным праздником Алжира.\n\n§YИсторическое признание:§!\n- Празднование доисламского наследия\n- Укрепление национального единства\n- §GПовышение удовлетворенности Кабилами§!"
 ALG_tamazight_official_2016: "Тамазигт: официальный язык"
 ALG_tamazight_official_2016_desc: "Поправка к конституции 2016 года повышает статус тамазигта с «национального» до «официального», ставя его на один уровень с арабским языком."
 ALG_tamazight_official_tt: "§HТамазигт становится официальным языком§!\n§WПоправка к Конституции 2016 года:§!\n- Тамазигт приравнивается к арабскому языку\n- Все правительственные документы двуязычны\n- Берберский язык во всех школах\n- §GКрупная конституционная победа§!"
 ALG_berber_integration_complete: "Объединенные многообразием"
 ALG_berber_integration_complete_desc: "Благодаря диалогу, признанию и инвестициям Алжир разрешил кабильский вопрос. Алжирцы-арабы и берберы едины в своем стремлении."
 ALG_integration_complete_tt: "§HВопрос Кабиля решен§!\nАлжир успешно интегрировал свое берберское население благодаря:\n- Признанию языка\n- Культурным инвестициям\n- Экономическому развитию\n- Уважению и диалогу\n\n§GНациональное единство достигнуто!§!"
 ALG_crush_the_uprising: "Подавить восстание"
 ALG_crush_the_uprising_desc: "«Черная весна» угрожает национальному единству. Жандармерия восстановит порядок, а сепаратистские элементы будут нейтрализованы."
 ALG_crush_uprising_tt: "§HПуть подавления§!\nПримените силу, чтобы положить конец протестам и сохранить территориальную целостность Алжира.\n\n§Y Преимущества:§!\n - Сохранение всей территории\n - Никаких уступок сепаратистам\n - Военный контроль\n\n§R Издержки:§!\n - Международная критика\n - Глубокое недовольство кабилов\n - Продолжающееся сопротивление"
 ALG_gendarmerie_reinforcement: "Подкрепление жандармерии"
 ALG_gendarmerie_reinforcement_desc: "Для поддержания порядка в Кабилии будут направлены дополнительные подразделения жандармерии, чтобы предотвратить будущие беспорядки."
 ALG_gendarmerie_tt: "§HРазвертывание сил безопасности§!\n- Усилено присутствие жандармерии\n- Протесты отслеживаются\n- Задержаны ключевые активисты\n- Порядок поддерживается силой"
 ALG_arabization_policy: "Политика арабизации"
 ALG_arabization_policy_desc: "Арабский язык является языком Алжира. Необходимо активизировать программы арабизации в Кабилии для противодействия сепаратистской берберистской идеологии."
 ALG_arabization_1_tt: "§HУсиление арабизации§!\n- Обязательное преподавание только на арабском языке\n- Тамазигт подавлен\n- Продвижение исламской идентичности\n- Противодействие берберистской идеологии\n\n§RКабилии будут глубоко возмущены.§!"
 ALG_ban_mak: "Запретить МАК"
 ALG_ban_mak_desc: "В мае 2021 года Движение за самоопределение Кабилии (МАК), возглавляемое Ферхатом Мехенни, будет признано террористической организацией и запрещено."
 ALG_ban_mak_tt: "§HMAK признана террористической организацией§!\nДвижение за самоопределение Кабилии запрещено:\n- Ферхат Мехенни объявлен террористом\n- Сторонники MAK арестованы\n- Сепаратистская деятельность криминализирована\n\n§RОжидается международная критика§!"
 ALG_accuse_foreign_interference: "Обвинить иностранные руки"
 ALG_accuse_foreign_interference_desc: "Сепаратистское движение MAK не является органическим образованием — оно финансируется и поддерживается иностранными державами, стремящимися дестабилизировать Алжир. Марокко и другие страны должны быть разоблачены."
 ALG_foreign_interference_tt: "§HОбвинение иностранных держав§!\nМАК обвиняют в том, что она является иностранным ставленником:\n- Марокко обвиняют в финансировании МАК\n- Внешние заговоры против Алжира\n- Национальное единство против врагов\n\n§RДипломатическая напряженность возрастет§!"
 ALG_mak_israel_connection: "Связь МАК-Израиль"
 ALG_mak_israel_connection_desc: "Встреча Ферхата Мехенни с израильскими официальными лицами доказывает, что МАК — это сионистский проект, направленный на разделение арабского мира. Необходимо разоблачить эту связь."
 ALG_mak_israel_tt: "§HMAK-Разоблачение связи с Израилем§!\n- MAK назван сионистским проектом\n- Израиль обвиняется в дестабилизации\n- Получена поддержка Лиги арабских государств\n- Мобилизованы антиизраильские настроения\n\n§YВнутренняя поддержка §Gувеличивается§!§!\n§RОтношения с Израилем будут разрушены§!"
 ALG_kabylie_pacified: "Кабилия успокоилась"
 ALG_kabylie_pacified_desc: "Благодаря операциям по обеспечению безопасности и политическим репрессиям Кабилия взята под контроль. Сепаратистская угроза локализована."
 ALG_kabylie_pacified_tt: "§HКабили под контролем§!\n- MAK разгромлен\n- Сепаратизм криминализирован\n- Силы безопасности контролируют ситуацию\n- Национальное единство обеспечено\n\n§YНо недовольство тлеет.§!"
 ALG_el_kseur_platform: "Примите условия платформы El-Kseur."
 ALG_el_kseur_platform_desc: "Платформа Эль-Ксер, разработанная Аррушем 11 июня 2001 года, содержит 15 требований справедливости и прав. Мы примем ее в качестве основы для переговоров."
 ALG_el_kseur_tt: "§H Принять платформу Эль-Ксер §!\n15 требований включают:\n- Справедливость для жертв Черной весны\n- Вывод жандармерии\n- Официальный статус тамазигтов\n- Прекращение хогры\n- Экономическое развитие\n- Демократические реформы\n\n§R Требуются радикальные уступки§!"
 ALG_withdraw_gendarmerie: "Вывести жандармерию"
 ALG_withdraw_gendarmerie_desc: "Одно из главных требований Эль-Ксера — вывод ненавистной жандармерии из Кабилии и замена её местной полицией."
 ALG_withdraw_gendarmerie_tt: "§HВывод жандармерии§!\n- Военизированные формирования покидают Кабилию\n- Местная полиция берет на себя командование\n- Военное присутствие сокращено\n- Выполнено главное требование Кабилии\n\n§RВоенные будут недовольны§!"
 ALG_trial_responsible_officers: "Суд над ответственными должностными лицами"
 ALG_trial_responsible_officers_desc: "Сотрудники полиции, ответственные за гибель людей во время «Черной весны», предстанут перед правосудием. Этот беспрецедентный шаг признает государственные преступления против кабилов."
 ALG_trial_officers_tt: "§HПривлечение к ответственности виновных офицеров§!\n- Офицеры предстанут перед судом за убийства\n- Семьи жертв получат компенсацию\n- Государство признает преступления\n- Историческая ответственность\n\n§RВоенные будут в ярости§!\n§GМеждународное одобрение повышается§!"
 ALG_secular_berber_identity: "Светская берберская идентичность"
 ALG_secular_berber_identity_desc: "Кабилия исторически была более светским регионом, чем остальная часть Алжира. Признание светской берберской идентичности бросает вызов арабо-исламскому определению алжирской государственности."
 ALG_secular_berber_tt: "§HПризнание светской амазигской идентичности§!\n- Празднование доисламского наследия\n- Защита светских ценностей\n- Гарантия свободы вероисповедания\n- Противостояние исламистскому нарративу\n\n§RИсламисты будут против этого§!"
 ALG_mak_dialogue: "Диалог с МАК"
 ALG_mak_dialogue_desc: "Начать диалог с сепаратистским движением MAK Ферхата Мехенни. Это рискует легитимизировать сепаратизм, но может стать единственным путем к миру."
 ALG_mak_dialogue_tt: "§HОткрытый диалог с MAK§!\nПереговоры с сепаратистами:\n- Ферхат Мехенни участвует\n- Обсуждается самоопределение\n- Изучается вопрос автономии\n- Вопрос независимости обсуждается\n\n§RЧрезвычайно спорный вопрос§!\n§RРиск легитимизации сепаратизма§!"
 ALG_reject_separatism: "Отвергнуть сепаратизм"
 ALG_reject_separatism_desc: "При уважении прав берберов территориальная целостность Алжира не подлежит обсуждению. Единство в многообразии, а не разделение — вот ответ."
 ALG_reject_separatism_tt: "§HЕдинство в многообразии§!\n- Сепаратизм отвергнут\n- Права берберов гарантированы\n- Территориальная целостность сохранена\n- Многообразный, но единый Алжир"
 ALG_kabyle_autonomy_statute: "Устав Кабильской Автономии"
 ALG_kabyle_autonomy_statute_desc: "Официальный закон об автономии Кабилии — самоуправление в местных делах при сохранении ее принадлежности к Алжиру. Исторический компромисс."
 ALG_autonomy_statute_tt: "§HКабили получает автономию§!\n- Создан региональный парламент\n- Тамазигт признан официальным языком\n- Полномочия по местному налогообложению\n- Предоставлена культурная автономия\n\n§YКабили остается частью Алжира§!"
 ALG_federal_algeria: "Федеративный Алжир"
 ALG_federal_algeria_desc: "Алжир преобразуется в федеративную республику, при этом Кабилия станет первым автономным регионом. Другие регионы могут последовать этому примеру."
 ALG_federal_algeria_tt: "§HАлжир становится федеративным государством.§!\n- Принята федеральная конституция\n- Предоставлена региональная автономия\n- Кабилия в качестве модели\n- Децентрализованная власть\n— Единство через федерализм"
 ALG_united_secular_algeria: "Объединенный Светский Алжир"
 ALG_united_secular_algeria_desc: "Единый, светский Алжир, уважающий все идентичности — арабские и берберские, мусульманские и светские. Многообразие — наша сила."
 ALG_united_secular_tt: "§HОбъединенный светский Алжир§!\n— светское государство\n— уважение ко всем идентичностям\n— отсутствие сепаратизма\n— отсутствие исламизма\n— современная демократия"
 ALG_release_kby_autonomous_tt: "§YОсвободить Кабилию как автономный регион§!"
 ALG_black_spring_spirit: "Беспорядки Черной весны"
 ALG_black_spring_spirit_desc: "Убийство Массиниссы Гермаха вызвало самые масштабные протесты со времен обретения независимости. Кабилия пылает яростью против государства."
 ALG_arrouch_negotiations: "Переговоры Арруха"
 ALG_arrouch_negotiations_desc: "Правительство ведет переговоры с движением Арруча. Теперь традиционные сельские советы представляют интересы Кабилии."
 ALG_tamazight_national_language: "Тамазигтский национальный язык"
 ALG_tamazight_national_language_desc: "Тамазигт признан национальным языком Алжира — важный шаг на пути к признанию берберского языка."
 ALG_tamazight_official_language: "Тамазигтский — официальный язык"
 ALG_tamazight_official_language_desc: "Конституция 2016 года признала тамазигт официальным языком, приравняв его к арабскому. Это историческое достижение для защиты прав берберов."
 ALG_addressing_kabyle_grievances: "Рассмотрение жалоб кабилов"
 ALG_addressing_kabyle_grievances_desc: "Правительство инвестирует в Кабилию и решает проблему многолетней запущенности и «хогра» (пренебрежения)."
 ALG_amazigh_cultural_institutions: "Амазигские культурные учреждения"
 ALG_amazigh_cultural_institutions_desc: "Инвестиции в берберские культурные учреждения способствуют сохранению и популяризации амазигского наследия Алжира."
 ALG_united_algeria: "Объединенный Алжир"
 ALG_united_algeria_desc: "Благодаря диалогу и уважению Алжир объединил свое арабское и берберское население. Кабильский вопрос решен."
 ALG_kabyle_crackdown: "Репрессии в Кабилии"
 ALG_kabyle_crackdown_desc: "Силовые структуры подавляют протесты в Кабилии. Порядок восстанавливается силой."
 ALG_gendarmerie_deployed: "Развернутое жандармерий"
 ALG_gendarmerie_deployed_desc: "Подразделения жандармерии размещены по всей Кабилии, поддерживая порядок и пресекая инакомыслие."
 ALG_forced_arabization: "Принудительная арабизация"
 ALG_forced_arabization_desc: "В Кабилии усиливается политика арабизации. Берберская идентичность подавляется в угоду арабо-исламскому национализму."
 ALG_mak_banned: "MAK Запрещено"
 ALG_mak_banned_desc: "Движение за самоопределение Кабилии признано террористической организацией. Сепаратизм теперь криминализирован."
 ALG_foreign_hands_narrative: "Повествование из чужих рук"
 ALG_foreign_hands_narrative_desc: "Правительство обвиняет иностранные державы, особенно Марокко и Израиль, в кабильском сепаратизме. Внешние враги объединяют нацию."
 ALG_mak_terrorist_designation: "MAK — террористическая организация"
 ALG_mak_terrorist_designation_desc: "МКК и Ферхат Мехенни объявлены террористическими организациями, связанными с Израилем. Сепаратистская угроза представлена как сионистский заговор."
 ALG_kabylie_under_control: "Кабилия под контролем"
 ALG_kabylie_under_control_desc: "Кабилия находится под контролем правительства посредством силы и политических репрессий. Но под поверхностью тлеет недовольство."
 ALG_el_kseur_negotiations: "Переговоры в Эль-Ксеуре"
 ALG_el_kseur_negotiations_desc: "Правительство приняло платформу Эль-Ксер в качестве основы для переговоров с Кабилией."
 ALG_secular_amazigh_movement: "Светское амазигское движение"
 ALG_secular_amazigh_movement_desc: "В стране формируется светская берберская идентичность, бросающая вызов арабо-исламскому определению алжирской государственности."
 ALG_mak_negotiations: "Переговоры MAK"
 ALG_mak_negotiations_desc: "Правительство ведет беспрецедентный диалог с сепаратистским движением МАК. Будущее Кабилии висит на волоске."
 ALG_unity_within_diversity: "Единство в многообразии"
 ALG_unity_within_diversity_desc: "Алжир принимает свое многообразие – арабское и берберское, мусульманское и светское – сохраняя при этом национальное единство. Сепаратизм отвергается."
 ALG_federal_republic: "Федеративная Республика"
 ALG_federal_republic_desc: "Алжир стал федеративной республикой, Кабилия — первым автономным регионом. Власть децентрализована, но единство сохранено."
 ALG_secular_united_nation: "Светская Организация Объединенных Наций"
 ALG_secular_united_nation_desc: "Алжир стал единым, светским государством, уважающим все идентичности и отвергающим как сепаратизм, так и религиозный экстремизм."
 KBY_autonomous_kabylie: "Автономная Кабилия"
 KBY_autonomous_kabylie_desc: "Кабилия добилась автономии в составе Алжира. Она обладает самоуправлением в местных делах, оставаясь при этом частью государства."
 KBY_federal_partner: "Федеральный партнер"
 KBY_federal_partner_desc: "Как федеральный партнер Алжира, Кабилия пользуется полной автономией и равноправным участием в алжирской федерации."
 ALG_kabyle_autonomy: "Путь к автономии Кабиля"
 ALG_kabyle_suppressed: "Путь подавления Кабилии"
 ALG_kabyle_independence: "Путь независимости Кабиля"
 ALG_black_spring_triggered: "Черный пружинный спусковой механизм"
 ALG_kabyle_issue_resolved: "Проблема Кабилии решена."
 ALG_became_federal: "Алжир стал федеративным государством."
 ALG_secular_path_complete: "Светский путь завершен"
 human_rights_violation: "Нарушения прав человека"
 human_rights_progress: "Прогресс в области прав человека"
 accused_of_interference: "Обвинение во вмешательстве"
 accused_of_terrorism_support: "Обвиняется в поддержке терроризма"
 anti_israel_stance: "Антиизраильская позиция"
 ALG_bribe_malian_generals: "Подкуп малийских генералов"
 ALG_bribe_malian_generals_desc: "На малийскую военную хунту можно оказывать влияние посредством тщательного распределения средств. Подкупая ключевых генералов, Алжир может получить рычаги влияния на принятие решений в Бамако и обеспечить свои интересы в Сахеле."
 ALG_isolate_mali_regime: "Изолировать режим Мали"
 ALG_isolate_mali_regime_desc: "Военный режим в Бамако дестабилизировал регион и угрожает туарегскому населению. Алжир будет стремиться изолировать хунту на международной арене, позиционируя себя как законного посредника в кризисе в Сахеле."
 ALG_isolate_mali_tt: "§HИзолировать малийский режим§!\nИспользуйте дипломатическое давление и каналы Африканского союза, чтобы осудить военную хунту.\n\n§YПреимущества:§!\n- Региональное руководство Алжира\n- Поддержка туарегов возросла\n- Мали ослаблена\n- Получено влияние AU\n\n§WИсход:§!\nАлжир становится ключевым посредником в делах Сахеля."
 ALG_au_condemns_mali_tt: "§YАфриканский союз осуждает малийский режим§!\nВсе члены Африканского союза снижают оценку Мали."
 ALG_malian_general_network: "Малийская генеральная сеть"
 ALG_malian_general_network_desc: "Сеть подкупленных малийских генералов предоставляет Алжиру разведывательную информацию и оказывает влияние на военную хунту в Бамако."
 ALG_sahel_mediator: "Посредник в Сахеле"
 ALG_sahel_mediator_desc: "Алжир стал главным дипломатическим посредником в конфликтах в Сахеле. Наш голос имеет вес в региональных делах."
 MAL_international_isolation: "Международная изоляция"
 MAL_international_isolation_desc: "Военный режим сталкивается с международным осуждением и изоляцией. Торговля нарушена, иностранная помощь приостановлена, и правительство изо всех сил пытается сохранить контроль."
 ALG_bribed_our_generals: "Подкупили наших генералов"
 ALG_supported_our_cause: "Поддержали наше дело"
 AU_condemned_regime: "AU осуждает режим"
 ALG_bribed_mali_generals: "Подкупили малийских генералов"
 ALG_isolated_mali: "Изолированный режим Мали"
 ALG_dziri_unlock_tt: "§YТребуется одно из следующих заданий: §!\n- Завершено §HВосстановить надежду§!\n- Завершено §HСопротивление власти§!\n- Завершено §HВоенный переворот§!"
 ALG_requires_democratic_or_neutral_tt: "Требуется правительство §HДемократическое§! или §HНейтральное§!"
 ALG_requires_authoritarian_or_neutral_tt: "Требуется правительство §HAuthoritarian§! или §HNeutral§!."
 ALG_not_gender_equality_tt: "§RНесовместимо с целью обеспечения гендерного равенства§!"
 ALG_not_suppressed_kabyle_tt: "§RНедоступно, если функция Kabylie была отключена§!"
 ALG_migration_event_required_tt: "§YРазблокируется событием «Миграционный кризис» §!"
 ALG_drug_event_required_tt: "§YРазблокируется событием «Наркотический кризис» §!"
 ALG_dziri_tt: "§GРазблокирована ветвь «Алжирское общество»: §!\n\nВыберите, как формировать алжирское общество — прогрессивное или традиционное, открытое или закрытое."
 ALG_dziri_unlocks_tt: "§YОткрывает ветку «Общество»: §!\n- Путь гражданского общества (демократический/нейтральный)\n- Путь традиций (авторитарный/нейтральный)\n- Права берберов (демократический/нейтральный)\n- Реагирование на наркотики (запускается событием)\n- Реагирование на миграцию (запускается событием)"
 ALG_open_civil_society_tt: "§GОткрытое гражданское общество:§!\n\n- Неправительственные организации и благотворительные фонды процветают\n- Участие в демократических процессах растет\n- Фонд прогрессивных реформ"
 ALG_constitutionalize_rights_tt: "§GКонституционные права:§!\n\n- Защищены основные свободы\n- Укрепление верховенства права\n- Международное одобрение"
 ALG_integration_policy_tt: "§GИнтеграционные программы:§!\n\n- Мигранты становятся продуктивными гражданами\n- Увеличение численности рабочей силы\n- Социальная сплоченность"
 ALG_unlocks_migration_branch_tt: "§YРазблокирует ответ на миграцию Branch§!\n(При срабатывании события миграции)"
 ALG_migration_problems_tt: "§YМиграционный кризис:§!\n\nНа юг Алжира наводняют мигранты из стран Африки к югу от Сахары. Вам предстоит выбрать, как на это отреагировать."
 ALG_migration_choice_tt: "§YВыбор:§!\n- §GПолитика открытых дверей§! - Приветствуем мигрантов\n- §RЗакрытые границы§! - Обеспечьте безопасность границы"
 ALG_open_door_tt: "§GПолитика открытых дверей: §!\n\n- Приветствуем мигрантов и беженцев\n- Увеличение численности рабочей силы\n- Некоторая потеря стабильности\n- Гуманитарная репутация"
 ALG_closed_borders_tt: "§RЗакрытые границы:§!\n\n- Обеспечение безопасности границы\n- Повышение стабильности\n- Снижение иностранного влияния\n- Замедление роста населения"
 ALG_expand_berber_rights_tt: "§GРасширение прав берберов:§!\n\n- Празднование культуры амазигов\n- Повышение удовлетворенности кабилов\n- Преимущества разнообразия для исследований"
 ALG_drug_problem_tt: "§YНаркотический кризис:§!\n\nНезаконный оборот наркотиков из Марокко и Сахеля породил проблемы наркомании. Вам предстоит выбрать, как на это реагировать."
 ALG_drug_choice_tt: "§YВыбор:§!\n- §GДекриминализация§! - Подход, основанный на здоровье\n- §RУжесточение наказаний§! - Подход правоохранительных органов"
 ALG_relax_restrictions_tt: "§GДекриминализация наркотиков:§!\n\n- Рассматривать наркоманию как проблему здравоохранения\n- Сократить численность заключенных\n- Сохраняется некоторое влияние мафии\n- Снижена международная критика"
 ALG_tighten_punishments_tt: "§RУжесточение мер против наркотиков:§!\n\n- Жесткие наказания для дилеров\n- Снижение влияния мафии\n- Увеличение поддержки войны\n- Некоторая потеря стабильности"
 ALG_traditions_matter_tt: "§GТрадиционные ценности:§!\n\n- Сохранение алжирских обычаев\n- Пропагандируются религиозные ценности\n- Сопротивление влиянию Запада"
 ALG_unlocks_conservative_path_tt: "§YОткрывает консервативный социальный путь§!"
 ALG_censor_internet_tt: "§YЦензор Интернета:§!\n\n- Блокировка иностранной пропаганды\n- Контроль потока информации\n- Снижение иностранного влияния\n- Небольшое замедление исследований"
 ALG_restrict_women_tt: "§YТрадиционные гендерные роли:§!\n\n- Женщинам рекомендуется оставаться дома\n- Рождаемость может увеличиться\n- Сокращение численности персонала\n- Западная критика"
 ALG_marriage_subsidies_tt: "§GСубсидии на брак: §!\n\n- Правительство оплачивает свадьбы\n- Стимулируется рост населения\n- Расходы казначейства\n- Продвигаются традиционные ценности"
 ALG_open_civil_society_idea: "Открытое гражданское общество"
 ALG_open_civil_society_idea_desc: "В Алжире развито активное гражданское общество с действующими НПО, благотворительными организациями и общественными объединениями, вносящими вклад в общественную жизнь."
 ALG_constitutionalize_rights_idea: "Конституционные права"
 ALG_constitutionalize_rights_idea_desc: "Основные права закреплены в конституции, защищая граждан Алжира и укрепляя верховенство права."
 ALG_integration_policy_idea: "Интеграционная политика"
 ALG_integration_policy_idea_desc: "Алжир активно занимается интеграцией мигрантов и беженцев, предоставляя им языковую подготовку и возможности для получения гражданства."
 ALG_migration_crisis: "Миграционный кризис"
 ALG_migration_crisis_desc: "Волны мигрантов из стран Африки к югу от Сахары перегрузили пограничные пункты и вызвали социальную напряженность."
 ALG_welcome_migrants: "Политика открытых дверей"
 ALG_welcome_migrants_desc: "Алжир принимает мигрантов и беженцев, оказывая гуманитарную помощь и поддержку в процессе интеграции."
 ALG_refugees_maintained: "Управляемое население беженцев"
 ALG_refugees_maintained_desc: "В Алжире населении, состоящим из беженцев, налажено эффективное управление, обеспечены надлежащие условия и реализуются программы интеграции."
 ALG_drug_crisis: "Наркотический кризис"
 ALG_drug_crisis_desc: "Незаконный оборот наркотиков и наркомания стали серьезными проблемами, создающими дополнительную нагрузку на правоохранительные органы и системы здравоохранения."
 ALG_traditions_matter_idea: "Традиционные ценности"
 ALG_traditions_matter_idea_desc: "В Алжире пропагандируются традиционные ценности, включая семью, веру и общность. Западному культурному влиянию оказывается сопротивление."
 ALG_censored_internet_idea: "Цензурированный интернет"
 ALG_censored_internet_idea_desc: "Правительство контролирует доступ в интернет, блокируя иностранную пропаганду и аморальный контент."
 ALG_women_role_idea: "Традиционные гендерные роли"
 ALG_women_role_idea_desc: "Женщин призывают придерживаться традиционных ролей домохозяек и матерей. Участие женщин в рабочей силе сократилось."
 ALG_marriage_subsidies_idea: "Субсидии на брак"
 ALG_marriage_subsidies_idea_desc: "Правительство субсидирует браки, помогая молодым парам оплачивать свадьбы и поощряя создание семей."
 restricts_women_rights: "Ограничивает права женщин"
 ALG_migration_flood: "Активен миграционный кризис"
 ALG_drugs: "Наркотический кризис активен"
 ALG_mediterranean_games_preparation: "Подготовка к Средиземноморским играм"
 ALG_mediterranean_games_preparation_desc: "Оран преображается к Средиземноморским играм 2022 года. Строительные бригады работают круглосуточно над олимпийским комплексом, новыми стадионами и деревней для спортсменов. Вся страна поддерживает это историческое событие, поскольку Алжир готовится принять на своих берегах представителей 26 стран."
 ALG_more_infra: "Расширение инфраструктуры"
 ALG_more_infra_desc: "Для поддержки экономического роста Алжиру необходима значительная модернизация инфраструктуры. Новые дороги, железные дороги и коммунальные сети соединят населенные пункты и облегчат торговлю по всей стране."
 TT_ALG_SECULAR_DISCONTENT_MODIFIER: "§RНедовольство секуляристов растет.§!\nПрогрессивно настроенные и светские алжирцы выступают против религиозной политики."
 TT_ALG_ISLAMIST_SATISFACTION_MODIFIER: "§GПоддержка исламистов растет§!\nРелигиозные консерваторы одобряют эти меры."
 ALG_more_relation_better: "§HОни есть§! §Gболее вероятно, что присоединится§! §Hесли у нас есть§! §GЛучшие отношения!§!"
 algerian_military_dismantling: "Военный демонтаж"
 algerian_military_dismantling_desc: "Алжирская армия подвергается систематическому расформированию. Техника списывается, подразделения расформировываются, офицеры уходят в отставку. Некогда могущественная Алжирская национальная народная армия — лишь тень своего былого величия."
 algerian_student_exchanges: "Программы студенческого обмена"
 algerian_student_exchanges_desc: "Алжирские студенты обучаются за рубежом в зарубежных университетах, а иностранные студенты приезжают в Алжир. Эти обмены способствуют установлению связей, передаче знаний и подготовке следующего поколения алжирских специалистов."
 ALG_boost_reformists: "Поддержка реформаторов"
 ALG_boost_old_guard: "Усиление Старой гвардии"
 ALG_rally_students: "Объединить студентов"
 ALG_mobilize_veterans: "Мобилизация ветеранов"
 ALG_bribe_elites: "Взяточная элита"
 ALG_seek_compromise: "Ищите компромисс"
 ALG_media_campaign_reform: "Реформа медиакампаний"
 ALG_security_crackdown: "Ужесточение мер безопасности"
 ALG_world_tension_security: "Мировая напряженность, безопасность"
 ALG_world_tension_high_security: "Мировая напряженность, высокий уровень безопасности"
 ALG_path_crackdown_momentum: "Импульс к ужесточению мер"
 ALG_path_reconciliation_momentum: "Импульс к примирению"
 ALG_oil_patronage: "Покровительство нефтяной отрасли"
 ALG_economic_reforms: "Экономические реформы"
 ALG_ter_oboronaup_start: "Территориальная оборона"
 ALG_internalup_start: "Внутренние войска"
 ALG_MAJLIS_WATANI_SHAABI_DESC: "Народное национальное собрание является нижней палатой алжирского парламента. В рамках этой системы исполнительная власть сосредоточена в руках собрания, а не единого президента, что создает подлинную парламентскую республику, где избранные представители коллективно управляют страной."
 ALG_a_new_algeria_tt: "Коррупционная сеть Бутефлики ликвидирована. Украденные ими богатства конфискованы, имущество продано, а возвращенные средства возвращены в государственную казну."
 FIS_faction_middle_east_available_tt: "По крайней мере, одна суннитская страна на Ближнем Востоке должна иметь о нас мнение выше 70 и проводить интервенционистскую внешнюю политику."
 FIS_faction_asia_available_tt: "По крайней мере, одна суннитская страна в Азии должна иметь о нас мнение выше 70 и проводить интервенционистскую внешнюю политику."
 ALG_4g_upgrade_decisions_tt: "Открывает возможность принятия решений о модернизации национальной инфраструктуры сети 4G."
 ALG_environmental_campaign_no_space_tt: "Свободных слотов для строительства не найдено. Вместо этого внутреннее влияние было усилено благодаря кампании в средствах массовой информации по защите окружающей среды."
 ALG_grand_mufti_rule_djaballah_tt: "Абдалла Джабалла будет назначен новым главой государства, что привнесет в управление Алжиром консервативное исламистское направление."
 ALG_grand_mufti_rule_ulema_tt: "Для определения религиозного лидера Алжира будет проведено совещание с Советом улемов, в результате которого развернется выбор между враждующими клерикальными фракциями."
 ALG_revivify_non_aligned_movement_t: "Алжир будет работать над активизацией Движения неприсоединения, позиционируя себя в качестве ведущего представителя стран, не входящих в блоки великих держав."
 TT_ALG_REDUCE_TAXES_5: "Ставка налога на население будет снижена на 5%, что облегчит бремя для низших слоев населения и укрепит поддержку среди крестьянства."
 ALG_east_west_highway: "Шоссе Восток-Запад"
 ALG_east_west_highway_desc: "Автомагистраль Восток-Запад станет экономической основой Алжира, соединив основные населенные пункты от Аннабы до Тлемсена и значительно улучшив внутреннюю торговлю и транспортную доступность."
 ALG_future_national_policy1: "Страна на перепутье"
 ALG_future_national_policy1_desc: "Будущее Алжира остается неопределенным. Решения, принятые в ближайшие годы, определят характер государства, его ценности, его союзников и его место в мире."
 ALG_hassi_massoud_exploitation_desc: "Нефтяное месторождение Хасси-Мессауд — одно из крупнейших в Африке. Инвестируя в его полную разработку, Алжир может значительно увеличить добычу нефти и обеспечить себе долгосрочные доходы от энергоносителей."
 ALG_north_south_highway_desc: "Транссахарская автомагистраль, соединяющая северное побережье с южным регионом, откроет доступ к обширным внутренним территориям Алжира, что позволит добывать ресурсы и сократит региональное неравенство."
 ALG_black_decade_lesson2_idea: "Уроки темного десятилетия II"
 ALG_black_decade_lesson2_idea_desc: "Реформы вооруженных сил основаны на болезненных уроках гражданской войны. Алжирская армия лучше подготовлена к противодействию внутренним угрозам без применения неизбирательного насилия."
 ALG_black_decade_lesson3_idea: "Уроки темного десятилетия III"
 ALG_black_decade_lesson3_idea_desc: "Десятилетие реформ преобразило доктрину безопасности Алжира. Борьба с экстремизмом теперь прочно укоренилась в военной культуре, существуют специализированные подразделения и разведывательные сети, специально созданные для предотвращения будущих восстаний."
 ALG_decline_of_tourism1: "Восстановление туристического сектора"
 ALG_decline_of_tourism1_desc: "Самый сильный спад миновал. Целенаправленные инвестиции и улучшение условий безопасности начинают привлекать туристов обратно к историческим достопримечательностям Алжира и средиземноморскому побережью."
 ALG_destroyed_agriculture_two: "Поврежденный сельскохозяйственный сектор"
 ALG_destroyed_agriculture_two_desc: "Сохраняющаяся нестабильность продолжает препятствовать восстановлению сельского хозяйства. Поля остаются непродуктивными, и сельские общины с трудом возвращаются к нормальной сельскохозяйственной деятельности."
 ALG_destroyed_agriculture_three: "Реконструкция сельского хозяйства"
 ALG_destroyed_agriculture_three_desc: "В сельскохозяйственном секторе ведутся работы по восстановлению. Обрабатываются новые районы, постепенно восстанавливается инфраструктура для возобновления производства продуктов питания."
 ALG_family_centric_2: "Семья в основе общества II"
 ALG_family_centric_2_desc: "Усиление акцента на традиционных семейных структурах привело к формированию социальной политики, основанной на консервативном представлении о семье как о фундаменте алжирского общества."
 ALG_hydroelectric_power_plants_upgraded2_idea: "Развитая гидроэлектроэнергетическая сеть"
 ALG_hydroelectric_power_plants_upgraded2_idea_desc: "Вторая волна модернизации гидроэнергетической инфраструктуры Алжира значительно расширила мощности по хранению энергии и повысила надежность энергосистемы по всей стране."
 ALG_mastering_atom_2: "Освоение Атома II"
 ALG_mastering_atom_2_desc: "Ядерная программа Алжира продвинулась до стадии обогащения урана, что вызывает международную озабоченность. Страна теперь способна производить оружейный материал, хотя заключительный этап еще не предпринят."
 ALG_mastering_atom_3: "Освоение Атома III"
 ALG_mastering_atom_3_desc: "Алжир успешно разработал потенциал ядерного оружия. Теперь страна входит в число мировых ядерных держав, что кардинально меняет региональный баланс сил."
 ALG_riot_police_1: "Подразделение быстрого реагирования «Аль-Сайка»"
 ALG_riot_police_1_desc: "Для подавления протестов и поддержания порядка в городских центрах создано специальное подразделение полиции по борьбе с беспорядками, прошедшее специальную подготовку. Их присутствие служит сдерживающим фактором для гражданских волнений."
 ALG_riot_police_2: "Расширение развертывания Аль-Сайки"
 ALG_riot_police_2_desc: "Подразделение полиции по борьбе с массовыми беспорядками было сокращено и реорганизовано после критики со стороны общественности по поводу чрезмерного применения силы. Его полномочия были сужены, а надзор усилен."
 ALG_riot_police_3: "Элитный отряд «Аль-Сайка»"
 ALG_riot_police_3_desc: "Подразделение «Аль-Сайка» было расширено и профессионализировано, превратившись в элитное подразделение внутренней безопасности, способное к быстрому развертыванию в любой точке страны."
 ALG_science_idea_two: "Алжирский научный ренессанс II"
 ALG_science_idea_two_desc: "Опираясь на первую волну научных инвестиций, Алжир создал сеть научно-исследовательских учреждений и международных партнерств, которые ускоряют технологическое развитие."
 ALG_air_reform_desc: "Начался первый этап реформ в ВВС Алжира, в рамках которого модернизируется структура командования и обновляется парк устаревающих самолетов."
 ALG_air_reform2_desc: "Второй этап реформы военно-воздушных сил предусматривает внедрение передовых программ обучения и усовершенствованных процедур технического обслуживания, что повышает боеготовность."
 ALG_air_reform3_desc: "Военно-воздушные силы Алжира были существенно модернизированы. Были сформированы новые эскадрильи, оснащенные современными самолетами, что значительно улучшило противовоздушную оборону и способность к проецированию силы."
 ALG_air_reform4_desc: "Программа реформирования военно-воздушных сил завершена. В настоящее время Алжир располагает одними из самых боеспособных военно-воздушных сил на африканском континенте."
 ALG_algerian_tourism_desc: "В Алжире активно развивается туристический сектор: инвестиции в инфраструктуру гостиничного бизнеса и международные маркетинговые кампании привлекают посетителей к богатому культурному и природному наследию страны."
 ALG_army_reform_desc: "Начата масштабная программа реформ, направленная на модернизацию алжирской армии, улучшение стандартов подготовки, материально-технического обеспечения и командной структуры."
 ALG_army_reform_mass_army_desc: "Алжир формирует крупную регулярную армию, способную к проведению продолжительных операций, отдавая приоритет живой силе и механизированной пехоте перед специализированными подразделениями."
 ALG_army_reform_mass_army2_desc: "Масштабная армейская реформа вступила во вторую фазу, в рамках которой улучшенная логистика и бронетанковая поддержка повышают боеспособность сухопутных войск Алжира."
 ALG_army_reform_mass_army3_desc: "Доктрина массовой армии Алжира полностью устоялась. Крупные общевойсковые формирования теперь составляют основу стратегии сухопутной обороны страны."
 ALG_army_reform_mass_army4_desc: "Программа создания массовой армии завершена. Алжир может выставить численно превосходящие сухопутные войска, поддерживаемые развитой логистической инфраструктурой."
 ALG_army_reform_specops_desc: "Алжир инвестирует в силы специального назначения, создавая элитные подразделения, обученные борьбе с терроризмом, быстрому реагированию и ведению нетрадиционной войны."
 ALG_army_reform_specops2_desc: "Программа подготовки спецназа расширилась: появились новые подразделения, обученные освобождению заложников, глубокому проникновению и операциям прямого действия."
 ALG_army_reform_specops3_desc: "Алжирские силы специального назначения достигли высокого уровня боеспособности, опираясь на многолетний опыт борьбы с повстанцами в Сахеле и на родине."
 ALG_army_reform_specops4_desc: "Программа реформирования сил специального назначения завершена. Элитные подразделения Алжира входят в число самых боеспособных в Африке, пользуясь уважением за свой опыт и оперативное мастерство."
 ALG_basic_income_support_desc: "Программа поддержки базового дохода обеспечивает финансовую защиту для беднейших граждан Алжира, сокращая бедность и смягчая последствия экономической нестабильности."
 ALG_black_decade_methods_desc: "Силовые структуры продолжают использовать жестокие методы, разработанные во время гражданской войны. Хотя такой подход эффективен в краткосрочной перспективе, он подпитывает недовольство и рискует вновь разжечь тот самый экстремизм, который они стремятся подавить."
 ALG_border_security_idea_desc: "Усиление пограничных пунктов и расширение маршрутов патрулирования повысили способность Алжира перехватывать контрабандистов, торговцев оружием и экстремистских агентов, проникающих через его обширные пустынные границы."
 ALG_childcare_reform_desc: "Внедряются новые учреждения по уходу за детьми и программы субсидирования детских садов, что облегчает семьям совмещение работы и воспитания детей."
 ALG_closed_moroccan_border_desc: "Граница с Марокко остается строго закрытой. Хотя это ограничивает трансграничную контрабанду, это также препятствует законной торговле и усугубляет дипломатический кризис между двумя странами."
 ALG_confidence_measures_idea_desc: "Комплекс мер по укреплению доверия между Алжиром и его соседями способствует снижению напряженности и открытию каналов для дипломатического диалога."
 ALG_counter_morocco_idea_desc: "Алжир активно противодействует влиянию Марокко в регионе посредством дипломатического давления, поддержки Фронта Полисарио и стратегической конкуренции за африканских союзников."
 ALG_dialogue_with_morocco_desc: "Начался осторожный диалог с Марокко, в рамках которого изучается возможность нормализации отношений и возобновления работы границы после многих лет вражды."
 ALG_education_arabization_desc: "Арабизация системы образования углубилась: преподавание на французском языке на всех уровнях заменено арабским, а исламские ценности включены в национальную учебную программу."
 ALG_food_subsidy_idea_desc: "Государственные субсидии поддерживают низкие цены на основные продукты питания, обеспечивая доступ к базовому питанию даже для самых бедных слоев населения Алжира. Однако это создает значительную нагрузку на национальный бюджет."
 ALG_foreign_arms_companies_desc: "Алжир открыл процесс закупок для иностранных производителей оружия, получив доступ к более широкому спектру военной техники, но при этом увеличив зависимость от внешних поставщиков."
 ALG_fuel_subsidy_idea_desc: "Субсидированные цены на топливо позволяют поддерживать низкие транспортные и энергетические расходы для алжирских домохозяйств и предприятий, но представляют собой серьезное бюджетное бремя, ограничивающее бюджетную гибкость правительства."
 ALG_future_army_desc: "Алжир инвестирует в военные технологии и доктрины нового поколения, выводя свои вооруженные силы на передовые позиции в области современных боевых действий."
 ALG_global_power_desc: "Алжир утвердился в качестве подлинной мировой державы, заняв место за международным столом и обладая экономическим и военным весом, способным это обеспечить."
 ALG_health_insurance_system_desc: "В стране создается национальная система медицинского страхования, которая обеспечит алжирцам доступ к медицинской помощи независимо от уровня их дохода."
 ALG_housing_support_idea_desc: "Государственные программы поддержки жилищного строительства помогают малоимущим семьям получить доступ к доступному жилью, снижая нагрузку, вызванную нехваткой жилья в городах Алжира."
 ALG_hydroelectric_power_plants_upgraded_idea_desc: "В Алжире модернизирована гидроэнергетическая инфраструктура, что позволило увеличить мощность и надежность выработки электроэнергии с использованием гидроэнергии и снизить зависимость от ископаемого топлива."
 ALG_idea_arab_diplomacy_desc: "Алжир проводит активную дипломатическую кампанию в арабском мире, позиционируя себя в качестве ключевого посредника и представителя в Лиге арабских государств и в арабском мире в целом."
 ALG_idea_parliamentary_republic_desc: "В Алжире принята парламентская республиканская система, в результате чего исполнительная власть перешла к законодательной, а форма правления стала более подотчетной."
 ALG_idea_presidential_republic_desc: "Алжир функционирует как президентская республика, где исполнительная власть сосредоточена в руках президента, избираемого народом прямым голосованием."
 ALG_idea_refoming_education_desc: "Начался первый этап реформ в сфере образования, направленных на улучшение стандартов учебных программ, подготовки учителей и доступности образования по всей стране."
 ALG_idea_refoming_education1_desc: "Второй этап реформы образования включал расширение среднего образования, улучшение профессиональной подготовки и внедрение современных методик преподавания во всех школах Алжира."
 ALG_idea_semi_presidential_republic_desc: "В Алжире полупрезидентская система власти уравновешивает власть между президентом, избираемым прямым голосованием, и премьер-министром, подотчетным парламенту."
 ALG_maghreb_cooperation_idea_desc: "Алжир работает над углублением экономического и политического сотрудничества со своими соседями по Магрибу, закладывая основу для более интегрированного североафриканского регионального блока."
 ALG_maghreb_security_idea_desc: "Общая система обеспечения безопасности с партнерами из Магриба позволяет скоординированно реагировать на терроризм, контрабанду и трансграничную нестабильность в Сахеле."
 ALG_maghreb_trade_idea_desc: "Преференциальные торговые соглашения со странами Магриба способствуют развитию внутрирегиональной торговли, снижая зависимость Алжира от европейских рынков."
 ALG_mastering_atom_desc: "Алжир инициировал тайную ядерную программу, создав исследовательскую инфраструктуру, необходимую для последующей разработки материалов оружейного качества."
 ALG_military_expansion_desc: "Алжир расширяет свои вооруженные силы, инвестирует в новое оборудование и набирает дополнительный персонал для демонстрации большей военной мощи."
 ALG_military_expansion2_desc: "Программа расширения военного присутствия вступила во вторую фазу: вводятся в строй новые бронетанковые части, артиллерийские бригады и системы противовоздушной обороны."
 ALG_military_junta_desc: "Военные взяли государство под прямой контроль. Алжиром управляет хунта генералов, легитимность которой основана на силе, а не на народном мандате."
 ALG_military_quality_initiative_desc: "Применяя подход, ориентированный на качество, а не на количество, к военной реформе, мы повышаем профессионализм, стандарты подготовки и оснащение вооруженных сил Алжира."
 ALG_military_quality_initiative2_desc: "На втором этапе инициативы по повышению качества военной подготовки были внедрены передовые методы имитационного обучения, улучшена подготовка офицеров и расширены совместные учения различных родов войск."
 ALG_modern_hospitals_desc: "Алжир создает сеть современных больниц, оснащенных новейшими медицинскими технологиями, что значительно улучшает качество медицинской помощи населению."
 ALG_natural_products_idea_desc: "Алжир продвигает свою натуральную продукцию, включая финики, оливковое масло и изделия ручной работы, на международных рынках, диверсифицируя экспортные доходы и поддерживая сельские общины."
 ALG_naval_reform_desc: "В настоящее время военно-морской флот Алжира проходит первую за десятилетия крупную реформу, направленную на улучшение технического обслуживания, подготовки кадров и боеспособности надводного флота."
 ALG_naval_reform2_desc: "В рамках второго этапа военно-морской реформы введены в строй новые фрегаты и патрульные суда, что расширяет присутствие Алжира в западном Средиземноморье."
 ALG_naval_reform3_desc: "Военно-морской потенциал Алжира был существенно модернизирован за счет улучшения противолодочной борьбы и береговой обороны."
 ALG_naval_reform4_desc: "Программа военно-морской реформы завершена. Теперь Алжир располагает современными, сбалансированными военно-морскими силами, способными проецировать свою мощь через Средиземное море и в Атлантику."
 ALG_open_border_coop_desc: "Алжир открыл свои границы для более широкого трансграничного сотрудничества со своими соседями, что облегчает торговлю, перемещение людей и совместные инфраструктурные проекты."
 ALG_pna_expansion_desc: "Национальная народная армия расширила свои логистические и административные возможности, улучшив свою способность поддерживать крупномасштабные операции на обширной территории Алжира."
 ALG_polisario_support_idea_desc: "Алжир продолжает оказывать политическую, логистическую и материальную поддержку Фронту Полисарио, поддерживая давление на Марокко в споре вокруг Западной Сахары."
 ALG_private_clinics_expansion_desc: "Частному сектору здравоохранения разрешается расширяться, предлагая более качественную помощь тем, кто может себе это позволить, и одновременно снижая нагрузку на государственную систему здравоохранения."
 ALG_private_healthcare_idea_desc: "Алжир поощряет частные инвестиции в здравоохранение, создавая параллельный частный сектор, который предлагает высококачественные услуги наряду с государственной системой."
 ALG_reactioners_desc: "Консервативные элементы в государственной бюрократии и армии сопротивляются значимым реформам, защищая интересы существующего порядка в ущерб модернизации."
 ALG_reactioners1_desc: "Реакционные силы несколько ослабли, хотя и сохраняют значительное влияние в ключевых институтах и продолжают замедлять темпы перемен."
 ALG_reactioners2_desc: "Влияние старой гвардии ослабевает. Усилия по реформированию набрали достаточный темп, чтобы преодолеть многие институциональные препятствия, которые ранее мешали прогрессу."
 ALG_reactioners3_desc: "Реакционная фракция оказалась в значительной степени оттеснена на второй план. Новое политическое соглашение отстранило многих их союзников от властных позиций."
 ALG_reactioners4_desc: "Системные реформы сломили хребет реакционному блоку. Алжирские институты все больше реагируют на требования народа, а не на интересы укоренившейся элиты."
 ALG_reactioners5_desc: "Среди старой гвардии остались лишь отдельные очаги сопротивления. Трансформация политической культуры Алжира близится к завершению."
 ALG_reactioners6_desc: "Последние остатки реакционной системы были сметены. Алжир вступил в новую эру, характеризующуюся подотчетностью и подлинной политической конкуренцией."
 ALG_reactioners7_desc: "Алжир полностью порвал со своим авторитарным прошлым. Государство теперь построено на демократических нормах и верховенстве права, а старые патронажные системы упразднены."
 ALG_sand_war_memory_idea_desc: "Память о Песчаной войне 1963 года с Марокко до сих пор влияет на военное планирование и внешнюю политику Алжира, подпитывая глубокое институциональное недоверие к намерениям Марокко."
 ALG_science_idea_desc: "Алжир инвестирует в научные исследования и разработки, создает новые лаборатории и финансирует университетские исследовательские программы для построения национальной экономики знаний."
 ALG_shipbuilding_desc: "Алжир развивает собственную судостроительную промышленность, строя предприятия, способные производить военно-морские и торговые суда, и снижая зависимость от иностранных поставщиков."
 ALG_shipbuilding2_desc: "Судостроительная отрасль достигла зрелости, и теперь внутри страны производятся более крупные и сложные суда. Алжир становится авторитетной страной в сфере морского производства."
 ALG_social_contract_idea_desc: "Правительство обновило свой социальный договор с населением, обменяв политическое попустительство на гарантированные субсидии, занятость в государственном секторе и социальные услуги."
 ALG_sonatrach_desc: "Компания Sonatrach, национальная нефтегазовая компания Алжира, остается основой национальной экономики, обеспечивая подавляющую часть экспортных доходов государства."
 ALG_state_hospitals_idea_desc: "Сеть государственных больниц обеспечивает базовый доступ к медицинской помощи всем жителям Алжира, однако хроническое недофинансирование приводит к значительным различиям в качестве медицинской помощи в зависимости от региона."
 ALG_suppressed_opposition_desc: "Политическая оппозиция подавляется с помощью сочетания правовых ограничений, контроля над СМИ и прямого запугивания. Инакомыслие загоняется в подполье, а не искореняется."
 ALG_technological_ties_desc: "Алжир заключил соглашения о передаче технологий с зарубежными партнерами, получив доступ к передовым системам и экспертным знаниям в обмен на экономические и дипломатические уступки."
 ALG_tikjda_resort_desc: "Горный курорт Тикжда в регионе Кабилия развивается как флагманский туристический центр, продвигающий экотуризм и привлекающий посетителей в Атласские горы Алжира."
 ALG_universal_healthcare_idea_desc: "В Алжире создана универсальная система здравоохранения, предоставляющая бесплатную или значительно субсидируемую медицинскую помощь всем гражданам, финансируемая за счет общих налогов и доходов от углеводородов."
 ALG_university_expansion_desc: "В Алжире создаются новые университетские кампусы, расширяя доступ к высшему образованию и выпуская выпускников, готовых к требованиям современной экономики."
 ALG_welfare_state_idea_desc: "В Алжире создана всеобъемлющая система социального обеспечения, предоставляющая жилищную поддержку, здравоохранение, образование и помощь в получении дохода, финансируемая в основном за счет доходов от нефти и газа."
 FIS_al_aqsa_faction: "Коалиция Аль-Акса"
 Algeria_desc: "Алжир"
 AlgeriaFocusEvents_desc: "События, ставшие причиной повышения осведомленности о ситуации в Алжире."
 algeria_focus_desc: "Схема развития национальной политики Алжира, охватывающая политические, экономические, военные и внешнеполитические направления."
 algerian_focus_desc: "Схема развития национальной политики Алжира, охватывающая политические, экономические, военные и внешнеполитические направления."
 algeria_power_balance_desc: "Баланс сил между гражданским правительством и военным истеблишментом, который долгое время функционировал в Алжире как государство в государстве."
 nuclear_algeria_desc: "Алжир переступил ядерный порог, обладая действующим ядерным оружием, которое коренным образом меняет его стратегическое положение в Северной Африке и более широком Средиземноморье."
 ALG_civilian_government: "Гражданское правительство"
 ALG_civilian_government_desc: "Впервые за десятилетия Алжиром управляет подлинно гражданская администрация. Военные отошли от прямого политического вмешательства, позволив избранным должностным лицам руководить страной."
 ALG_corrupt_generals: "Коррумпированные генералы"
 ALG_corrupt_generals_desc: "Высшее военное руководство погрязло в коррупции. Генералы, разбогатевшие за десятилетия покровительства, сопротивляются любым реформам, угрожающим их экономическим интересам."
 ALG_government_led_disaster: "Реагирование правительства на стихийные бедствия"
 ALG_government_led_disaster_desc: "Государство взяло на себя прямой контроль над реагированием на стихийное бедствие, задействовав государственные ресурсы в больших масштабах. Несмотря на значительные затраты и бюрократические сложности, это вмешательство приносит реальные результаты на местах."
 ALG_no_disasters_plan: "Отсутствие плана действий на случай стихийных бедствий"
 ALG_no_disasters_plan_desc: "В настоящее время в Алжире отсутствует специализированная система реагирования на стихийные бедствия. Когда случаются кризисы, отсутствие скоординированного планирования приводит к задержкам и неэффективности действий государства, что усугубляет ситуацию."
 ALG_olympic_preparation: "Программа подготовки к Олимпийским играм"
 ALG_olympic_preparation_desc: "Алжир вкладывает значительные средства в подготовку к проведению Олимпийских игр, строительство спортивной инфраструктуры мирового класса и запуск национальных программ развития легкой атлетики."
 algerian_empowered_sharia_courts: "Расширение полномочий шариатских судов"
 algerian_empowered_sharia_courts_desc: "Юрисдикция исламских судов была расширена, что дало религиозным властям большее влияние на гражданские и семейные дела и сместило правовую систему Алжира в сторону шариата."
 algerian_gulen_movement: "Движение, вдохновлённое Гюленом"
 algerian_gulen_movement_desc: "Сеть, вдохновленная движением Гюлена, внедрилась в алжирскую систему образования и гражданское общество, продвигая модернистский исламский подход и наращивая значительное влияние в государственных учреждениях."
 algerian_scientific_ventures: "Алжирские научные проекты"
 algerian_scientific_ventures_desc: "Волна совместных научных проектов с зарубежными партнерами способствует возрождению алжирских исследований, при этом новые проекты в области возобновляемой энергетики, вычислительной техники и материаловедения получают международное признание."
 hoggar_nuclear_facility_idea: "Атомная электростанция Хоггар"
 ALG_2014_oil_crash_idea_desc: "Обвал цен на нефть в 2014 году нанес сокрушительный удар по доходам Алжира от углеводородов, обнажив хрупкость его ресурсозависимой экономической модели и вынудив к болезненному сокращению государственных расходов."
 ALG_AU_pressure_idea_desc: "Африканский союз оказывает дипломатическое давление на Алжир по региональному вопросу, ограничивая его внешнеполитические возможности и осложняя отношения с соседними государствами."
 ALG_black_market_desc: "В тени государства развился процветающий черный рынок, подрывающий официальную торговую статистику, лишающий правительство налоговых поступлений и подпитывающий организованные преступные сети."
 ALG_clean_government_desc: "Новое поколение технократических чиновников привнесло в правительство большую прозрачность и подотчетность. Коррупция снижается, и доверие общественности к государственным институтам постепенно восстанавливается."
 ALG_decline_of_tourism_desc: "Туристический сектор Алжира находится в серьезном упадке. Проблемы с безопасностью, плохая инфраструктура и сложный визовый режим сделали страну непривлекательной для иностранных туристов, что наносит серьезный ущерб экономике."
 ALG_destroyed_agriculture_desc: "Сельскохозяйственный сектор Алжира опустошен конфликтом и пренебрежением. Земли остаются необработанными, сельские общины вынуждены покинуть свои дома, а зависимость от импорта продовольствия резко возросла."
 ALG_election_time_idea_desc: "Идет избирательная кампания, которая доминирует в политической повестке дня и создает как возможности, так и нестабильность, поскольку конкурирующие фракции мобилизуют свои сторонники."
 ALG_emergency_budget_desc: "Правительство активировало чрезвычайные бюджетные меры, сократив несущественные расходы и перенаправив ресурсы на преодоление острого экономического кризиса или кризиса в сфере безопасности."
 ALG_idea_joint_military_arab_desc: "Алжир вступил в совместную военную структуру с арабскими партнерами, что позволяет координировать планирование обороны, обмениваться разведывательной информацией и проводить совместные учения в регионе."
 ALG_insurgency_unleashed_desc: "Алжир целенаправленно развивает повстанческие сети в соседнем государстве, используя нерегулярные группировки для демонстрации силы и дестабилизации соперников без прямого военного вмешательства."
 ALG_national_dialogue_modifier_desc: "Процесс национального диалога объединил правительство и оппозицию, создав редкое пространство для политических переговоров и снизив непосредственный риск конфронтации."
 ALG_political_repression_desc: "Государство занимается систематическими политическими репрессиями, арестовывает активистов, подвергает цензуре СМИ и использует службы безопасности для подавления инакомыслия и поддержания контроля."
 ALG_repression_modifier_desc: "В политической сфере Алжира прокатилась волна репрессий. Оппозиционных деятелей задерживают, СМИ заставляют замолчать, а публичные демонстрации силой разгоняют."
 ALG_surveillance_state_modifier_desc: "В Алжире создана сложная внутренняя инфраструктура слежки, осуществляющая мониторинг коммуникаций и отслеживающая деятельность политических оппонентов и представителей гражданского общества."
 ALG_transparent_budget_desc: "Алжир ввел прозрачную отчетность по бюджету, публикуя подробные данные о государственных расходах и впервые сделав государственные счета доступными для независимой проверки."
 algeria_cultural_rebirth_desc: "В Алжире прокатилась мощная волна националистического культурного возрождения, которая возвышает исконное наследие и историю, одновременно вытесняя иностранное культурное влияние."
 algeria_emerging_youth_desc: "В Алжире формируется поколение политически активных молодых людей, которые с возрастающей напористостью выступают за демократические реформы и экономические возможности."
 algeria_nationalist_youth_desc: "Молодежное движение Алжира резко изменило свою позицию в сторону национализма, требуя более решительной внешней политики и прекращения того, что они считают компромиссом старой гвардии с иностранными интересами."
 hoggar_nuclear_facility_idea_desc: "В глубине гор Ахаггар, в отдаленном месте, создан научно-исследовательский центр ядерной энергетики. Его существование служит мощным сдерживающим фактором для иностранных авантюристов."
 idea_alg_empowered_parliament_desc: "Парламент Алжира получил подлинные законодательные полномочия. Теперь эта палата обладает реальной властью над бюджетом, законодательством и подотчетностью министров."
 idea_algerian_oligarchy_arrests_desc: "Арест ключевых олигархов потряс алжирскую бизнес-элиту. Хотя это и пользуется популярностью у населения, репрессии создали неопределенность, которая замораживает частные инвестиции."
 ALG_flavor_event.6.t: "кризис беженцев"
 ALG_flavor_event.6.d: "Волны беженцев захлестывают наши границы, спасаясь от конфликтов и нестабильности в соседних странах. Наша инфраструктура находится в напряженном состоянии, и наши сотрудники расходятся во мнениях относительно того, как реагировать."
 ALG_flavor_event.6.a: "Мы должны поглотить их."
 ALG_flavor_event.7.t: "Кризис незаконного оборота наркотиков"
 ALG_flavor_event.7.d: "Организованные преступные сети превратили Алжир в крупный транзитный коридор для наркотиков. Торговля наркотиками коррумпирует местные институты власти и подпитывает насилие в приграничных регионах."
 ALG_flavor_event.7.a: "Расправьтесь с торговцами людьми."
 fra_colonial.1.t: "Тень прошлого"
 fra_colonial.1.d: "Алжир официально осудил колониальное наследие Франции в стране, что вновь разжигает старые раны и накаляет общественное мнение по обе стороны Средиземноморья. Наш парламент разделился: одни требуют твердо придерживаться исторической позиции, другие видят в этом возможность для примирения."
 fra_colonial.1.a: "Защитите наши исторические достижения."
 fra_colonial.1.b: "Предложите жест примирения."
 algerian_event.51.d: "Вопреки всем ожиданиям, космическая программа Алжира совершила невероятный подвиг: наш космический аппарат успешно приземлился на Луне. Этот триумф инженерного искусства и национальной воли воодушевил алжирский народ и вознёс наш флаг к звёздам."
 ALG_aouchiche_desc: "Юсеф Аушиш — либеральный реформатор и лидер Фронта социалистических сил. Являясь ярым критиком правящей элиты, он проводил кампании, основанные на демократических реформах, гражданских свободах и экономической модернизации."
 ALG_hassani_desc: "Абделали Хассани Шериф — лидер Движения общества за мир, главной исламистской партии Алжира. Он выступает за умеренный политический ислам, соответствующий демократическим нормам и национальному примирению."
 algeria_elections.a: "Итак, решение принято."
 alg_military_rule_option: "Поддержите решение военных."
 AlgeriaPoliticalEvents.1.t: "Политическая перестройка Алжира"
 AlgeriaPoliticalEvents.1.d: "В преддверии завершения «Черного десятилетия» Алжир стоит перед решающим выбором относительно своей будущей политической ориентации. Партнерство с Западом, неприсоединение или более тесные связи с Востоком — каждый из этих путей будет иметь серьезные последствия для идентичности и стабильности страны."
 AlgeriaPoliticalEvents.1.a: "Откройте общенациональную дискуссию."
 AlgeriaPoliticalEvents.20.t: "Идеологический раскол в правительстве"
 AlgeriaPoliticalEvents.20.d: "По мере затухания конфликта внутри правительства усиливается давление с целью определения будущей политической системы Алжира. Сторонники жесткой линии требуют военного господства, умеренные выступают за примирение и реформы, а исламистские фракции призывают к свободным выборам."
 AlgeriaPoliticalEvents.20.a: "Расширить полномочия вооруженных сил."
 AlgeriaPoliticalEvents.20.b: "Стремитесь к реформам и примирению."
 AlgeriaPoliticalEvents.20.c: "Вести переговоры с исламистами."
 Algeria.8.t: "Алжир просит защиты"
 Algeria.8.d: "Правительство Алжира официально обратилось к США с просьбой о защите или гарантиях безопасности, ссылаясь на растущую региональную нестабильность. Теперь Вашингтону предстоит решить, следует ли расширить свою стратегическую защиту."
 Algeria.8.a: "Мы принимаем запрос."
 Algeria.8.b: "Мы не можем дать на это обещание."
 ALG_alignments: "Согласование внешней политики"
 KBY_alg_modifier: "Модификаторы состояния Кабиле"
 ALG_algiers_metro: "Алжирский метрополитенский коридор"
 ALG_diplomatic_outreach_west: "Дипломатические контакты с Западом"
 ALG_diplomatic_outreach_west_desc: "Отношения Алжира с Вашингтоном и его европейскими союзниками характеризуются взаимным недоверием. Последовательная дипломатическая инициатива могла бы заложить основу для более тесных экономических связей и связей в сфере безопасности с западным миром."
 ALG_diplomatic_outreach_china: "Дипломатические контакты с Китаем"
 ALG_diplomatic_outreach_china_desc: "Пекин неуклонно расширяет свое присутствие на африканском континенте. Укрепление связей с Китаем может открыть путь для значительных инвестиций в инфраструктуру и новых рынков, хотя это может осложнить отношения с западными партнерами."
 monitor_kabyle_unrest_desc: "Горный регион Кабилии постоянно является очагом напряженности. Службы безопасности должны вести тщательное наблюдение за деятельностью сопротивления в регионе, чтобы предотвратить эскалацию конфликта."
 kabyle_resistance_tooltip: "Уровень резистентности в Кабилии остается высоким."
 ALG_boost_reformists_desc: "Внутри непрозрачной политической структуры Алжира фракция технократов и модернизаторов добивается подлинных реформ. Предоставление им политического прикрытия и ресурсов могло бы сместить внутренний баланс сил в сторону открытости."
 ALG_boost_old_guard_desc: "Созданная сеть военных офицеров и ветеранов Фронта национального освобождения, которые строили государство после обретения независимости, всё больше обеспокоена темпами перемен. Подтверждение их позиций и прерогатив укрепит стабильность, но закрепит существующее положение вещей."
 ALG_rally_students_desc: "Университетские кампусы исторически являлись движущей силой политических перемен в Алжире. Организация студенческих объединений, поддерживающих реформаторскую программу, может оказывать давление снизу и изменять общественный дискурс."
 ALG_mobilize_veterans_desc: "Ветераны войны за независимость и «Черного десятилетия» обладают огромным моральным авторитетом в алжирском обществе. Объединение их вокруг существующего порядка придает легитимность позиции государства в нынешней политической борьбе."
 ALG_bribe_elites_desc: "Значительная часть властной структуры Алжира функционирует на основе неформальных сетей патронажа и благосклонности. Распределение контрактов, назначений и финансовых выгод ключевым фигурам может укрепить лояльность, хотя и усугубляет коррупцию, которая и без того разъедает государство."
 ALG_seek_compromise_desc: "В условиях затянувшихся внутренних споров нейтральная попытка посредничества может стать единственным способом предотвратить перерастание тупиковой ситуации в открытую конфронтацию. Компромисс не удовлетворит никого полностью, но может предотвратить худшее."
 ALG_media_campaign_reform_desc: "Контролируемые государством и лояльные частные СМИ могут быть направлены на создание нарратива о необходимости политического обновления. Формирование общественного мнения в пользу реформ подрывает позиции старой гвардии."
 ALG_security_crackdown_desc: "Органы безопасности можно направить на подавление протестов, независимых СМИ и групп гражданского общества, которые подпитывают реформаторское движение. Это даст время, но создаст более серьезные проблемы в будущем."
 ALG_world_tension_security_desc: "Растущая нестабильность в регионе предоставляет военному истеблишменту новые аргументы в пользу сохранения политического контроля под своим контролем. Использование этой ситуации может укрепить позиции старой гвардии."
 ALG_world_tension_high_security_desc: "В условиях региональных конфликтов, распространяющихся на границы Алжира, военные добиваются введения чрезвычайных полномочий, которые фактически отстранят от власти гражданских сторонников реформ. Кризис обеспечивает прикрытие, но приостановка политической конкуренции влечет за собой долгосрочные риски."
 ALG_path_crackdown_momentum_desc: "Жесткие меры приносят результаты. Поддержание темпа за счет дополнительных операций по обеспечению безопасности и политического давления укрепит власть старой гвардии над государством, но каждый шаг затрудняет обращение вспять этой борьбы."
 ALG_path_reconciliation_momentum_desc: "Процесс реформ набирает обороты. Продвижение дополнительных мер по укреплению доверия и политических открытий может вывести программу примирения за пределы точки невозврата."
 ALG_oil_patronage_desc: "Доходы Алжира от добычи углеводородов долгое время использовались для обеспечения социального спокойствия. Перенаправление части нефтяных доходов на целевую поддержку может обеспечить лояльность ключевых групп населения в нынешней политической борьбе."
 ALG_economic_reforms_desc: "Государственная экономика Алжира крайне неэффективна. Заслуживающий доверия пакет экономических реформ, открывающий возможности для частного предпринимательства и сокращающий бюрократические препятствия, мог бы склонить общественное мнение в сторону реформаторского лагеря."
 ALG_ter_oboronaup_start_desc: "В условиях войны Национальная гвардия призывает к формированию набранных на местном уровне подразделений территориальной обороны для удержания тыловых районов и освобождения регулярных армейских формирований для операций на передовой."
 ALG_internalup_start_desc: "В сложившейся ситуации требуется развертывание специализированных подразделений внутренней безопасности для поддержания порядка в тылу, защиты критически важной инфраструктуры и предотвращения использования противником нестабильности в тылу."
 ALG_casablanca_mission: "Добиваться заключения Касабланского соглашения"
 ALG_eliminate_GIA: "Исключить GIA"
 ALG_eliminate_GIA_desc: "Вооруженная исламская группировка когда-то представляла собой наиболее жестокое лицо повстанческого движения. Теперь, когда ее сети раздроблены, а общественная поддержка рухнула, государство приступает к ликвидации последних остатков организации и восстановлению порядка по всей стране."
 ALG_reintegration_programs: "Программы реинтеграции"
 ALG_reintegration_programs_desc: "Годы насилия оставили тысячи бывших боевиков и их сторонников разбросанными по всему алжирскому обществу. С помощью тщательно контролируемых программ реинтеграции правительство предложит путь к возвращению к гражданской жизни тем, кто готов отказаться от участия в повстанческом движении."
 ALG_strengthen_DRS: "Укрепить систему DRS"
 ALG_strengthen_DRS_desc: "Департамент разведки и безопасности сыграл решающую роль в борьбе с экстремистскими сетями в период «Черного десятилетия». Укрепление потенциала наших разведывательных служб гарантирует, что Алжир никогда больше не погрузится в подобный хаос."
 ALG_coalition_economic_program_tt: "Президентская коалиция запускает скоординированную программу экономического развития."
 ALG_governmental_transparency_tt: "Правительство обязуется проводить реформы, направленные на обеспечение прозрачности, что ослабит укоренившуюся коррупцию, но вызовет недовольство военных кругов."
 ALG_ethnic_satisfaction_critical: "§RОткрытая враждебность§!"
 ALG_ethnic_satisfaction_low: "§YГлубокая обида§!"
 ALG_ethnic_satisfaction_moderate: "§YТихое напряжение§!"
 ALG_ethnic_satisfaction_high: "§GОтносительное содержание§!"
 ALG_deep_state_map_name: "Алжир — центр власти"
 ALG_hybrid_military_governance: "Гибридное военное управление"
 ALG_hybrid_military_governance_desc: "Алжир действует в рамках гибридной системы, при которой военные сохраняют значительное политическое влияние, в то время как гражданские структуры остаются на месте."
 ALG_civil_war_brewing_added_tt: "§R£generic_warning РИСК ГРАЖДАНСКОЙ ВОЙНЫ!§!\nНеудачная попытка государственного переворота дестабилизировала Алжир."
