 EH_scientist_Jennifer_Doudna_tt: "§Y제니퍼 다우드나§!"
 EH_scientist_Jennifer_Doudna_tt_delayed: "제니퍼 다우드나는 에마뉘엘 샤르팡티에와 함께 CRISPR 유전자 편집 기술을 개척한 업적으로 유명한 생화학자입니다. CRISPR 덕분에 우리는 키메라의 유전적 구성을 더 잘 이해하고 그 약점을 공략할 방법을 찾을 수 있을지 모릅니다.\n--------------\n§Y효과:§!\n[!EH_hire_Jennifer_Doudna_button_click]\n\n§Y전제 조건:§!\n[!EH_scientist_Jennifer_Doudna_click_enabled]"
 EH_scientist_Fabiola_Gianotti_tt: "§Y파비올라 지아노티§!"
 EH_scientist_Fabiola_Gianotti_tt_delayed: "파비올라 지아노티는 이탈리아의 실험 입자물리학자이자 현 CERN 사무총장입니다. 입자물리학에 대한 전문성과 대규모 과학 협력의 경험은 차원문과 다른 차원과의 연결을 이해하려는 우리의 노력에 매우 귀중할 것입니다.\n--------------\n§Y효과:§!\n[!EH_hire_Fabiola_Gianotti_button_click]\n\n§Y전제 조건:§!\n[!EH_scientist_Fabiola_Gianotti_click_enabled]"
 EH_scientist_Lene_Hau_tt: "§Y레네 하우§!"
 EH_scientist_Lene_Hau_tt_delayed: "레네 하우는 빛을 늦추고 멈추는 획기적인 연구로 유명한 덴마크의 물리학자입니다. 양자 광학과 응집물질물리학에 대한 전문성은 차원문의 본질과 에너지 방출에 대한 통찰을 제공할 수 있습니다.\n--------------\n§Y효과:§!\n[!EH_hire_Lene_Hau_button_click]\n\n§Y전제 조건:§!\n[!EH_scientist_Lene_Hau_click_enabled]"
 EH_scientist_Emmanuelle_Charpentier_tt: "§Y에마뉘엘 샤르팡티에§!"
 EH_scientist_Emmanuelle_Charpentier_tt_delayed: "에마뉘엘 샤르팡티에는 프랑스의 미생물학자이자 생화학자입니다. 제니퍼 다우드나와 함께 CRISPR-Cas9 유전자 편집 기술을 개발했습니다. 그녀의 지식은 키메라의 생물학을 이해하고 잠재적으로 조작하려는 우리의 노력에 결정적일 것입니다.\n--------------\n§Y효과:§!\n[!EH_hire_Emmanuelle_Charpentier_button_click]\n\n§Y전제 조건:§!\n[!EH_scientist_Emmanuelle_Charpentier_click_enabled]"
 EH_scientist_Andrzej_Trautman_tt: "§Y안제이 트라우트만§!"
 EH_scientist_Andrzej_Trautman_tt_delayed: "안제이 트라우트만은 일반 상대성 이론과 블랙홀 물리학 연구로 유명한 폴란드의 이론물리학자입니다. 그의 전문성은 차원문의 근본 물리와 그것이 우리 세계에 미치는 영향을 이해하는 데 도움이 될 수 있습니다.\n--------------\n§Y효과:§!\n[!EH_hire_Andrzej_Trautman_button_click]\n\n§Y전제 조건:§!\n[!EH_scientist_Andrzej_Trautman_click_enabled]"
