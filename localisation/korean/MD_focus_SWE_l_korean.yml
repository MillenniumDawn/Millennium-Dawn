 SWE_swede_ship_idea1_desc: "유프비크의 건조대와 후네보스트란드의 복합 소재 공장이 최대 용량으로 가동되고 있습니다. 몇 주마다 선체 하나를 뽑아낼 수 있는 조선소는 국가가 조선소 건설이 필요할 때 기댈 수 있는 조선소입니다."
 SWE_ericsson_manufacturer: "에릭슨"
 SWE_ericsson_manufacturer_desc: "1876년 스톡홀름의 작업장에서 창립되었으며, 인구 천만의 나라가 전 세계가 뒤따르는 통신 표준을 정하는 이유로 지금도 남아 있습니다. 에릭슨은 전 세계 이동 통신 트래픽의 3분의 1을 실어 나르는 무선 접속망을 구축하며, 사브에 매각되기 전까지 에릭슨의 마이크로웨이브 부문은 스웨덴 방공망에 레이더를 공급했습니다."
 SWE_ericsson_manufacturer_trait: "무선 체계 유산"
 SWE_ericsson_manufacturer_mio_header_networks: "네트워크 및 구축"
 SWE_ericsson_manufacturer_mio_header_research: "연구 및 표준"
 SWE_ericsson_radio_base_stations: "무선 기지국"
 SWE_ericsson_radio_base_stations_desc: "철탑, 캐비닛, 백홀 링크. 네트워크가 존재하는지 여부를 결정하는, 화려하지 않은 하드웨어입니다."
 SWE_ericsson_mobile_core_network: "이동통신 코어망"
 SWE_ericsson_mobile_core_network_desc: "교환, 가입자 기록, 과금. 코어를 공급하는 쪽이 통신사업자를 10년 동안 고객으로 붙잡아 둡니다."
 SWE_ericsson_national_rollout: "전국 구축"
 SWE_ericsson_national_rollout_desc: "면허에 명시된 커버리지 의무는 상업적 구축을 국가 인프라로 바꿉니다."
 SWE_ericsson_export_contracts: "수출 계약"
 SWE_ericsson_export_contracts_desc: "해외 통신사업자들은 스웨덴이 국내에 구축한 기준 네트워크와 그에 따르는 유지보수 계약을 구매합니다."
 SWE_ericsson_hardened_military_links: "강화된 군용 통신 링크"
 SWE_ericsson_hardened_military_links_desc: "군을 위한 암호화되고 재밍에 강한 전송 수단으로, 민간 네트워크를 바탕으로 하되 그것 없이도 살아남도록 설계되었습니다."
 SWE_ericsson_research_laboratory: "연구소"
 SWE_ericsson_research_laboratory_desc: "프로젝트 사무소가 아닌 상설 연구 조직으로, 공급업체가 표준을 구현하는 데 그치지 않고 이끌 수 있게 해 줍니다."
 SWE_ericsson_radio_chipset_design: "무선 칩셋 설계"
 SWE_ericsson_radio_chipset_design_desc: "베이스밴드 실리콘을 자체 설계하면 의존성이 사라지고 그에 따르는 이윤을 확보할 수 있습니다."
 SWE_ericsson_standards_leadership: "표준 주도권"
 SWE_ericsson_standards_leadership_desc: "작업반 의장직을 맡는 것은 어떤 단일 입찰을 따내는 것보다 가치가 큽니다. 표준은 이미 만들 수 있는 것을 중심으로 쓰이기 때문입니다."
 SWE_ericsson_expanded_operations: "사업 확대"
 SWE_ericsson_expanded_operations_desc: "단일 주력 계약보다 많은 병행 프로그램과 이를 운영할 인력입니다."
 SWE_ericsson_signals_support_division: "통신 지원 부서"
 SWE_ericsson_signals_support_division_desc: "기지국을 판매하는 것과 같은 무선 전문 지식을 활용한, 방위 기관을 위한 조용한 작업입니다."
 SWE_ericsson_integrated_network_house: "통합 네트워크 기업"
 SWE_ericsson_integrated_network_house_desc: "실리콘, 무선, 코어, 표준이 한 지붕 아래 있습니다. 전체 스택을 입찰할 수 있는 공급업체는 전 세계에서도 드뭅니다."
 Sweden.320.t: "하나의 챔피언인가, 여럿인가"
 Sweden.320.d: "사브는 셀시우스를 흡수했고, 그와 함께 스웨덴 방위산업에 남아 있던 대부분을 품게 되었습니다. 브뤼셀은 사업 매각을 조건으로만 합병을 승인할 것이며, 문제는 그 매각이 얼마나 깊이 이루어지느냐입니다. 전체를 사브 안에 두면 인구 900만의 나라는 전투기를 만들 수 있는 단일 기업을 갖게 됩니다. 규모를 줄이면 이 정도 크기의 시장이 감당하지 못할 수도 있는 경쟁이 유지됩니다."
 Sweden.320.a: "사브를 국가 대표 기업으로 온전히 유지한다"
 Sweden.320.b: "과감히 매각하여 공급업체 기반의 경쟁을 유지한다"
 Sweden.321.t: "공장이 딸린 판매"
 Sweden.321.d: "아무도 그리펜이 저렴해서 사지는 않습니다. 사브는 현지 조립, 기술 이전, 계약의 상당 부분에 달하는 산업 참여와 같은 상쇄 조건을 붙여 판매합니다. 남아프리카공화국, 헝가리, 체코가 모두 이런 방식으로 확보되었습니다. 이 모델은 항공기를 팔아 주지만, 모든 거래는 스웨덴을 구매할 가치가 있는 국가로 만든 역량의 일부를 고객에게 넘겨줍니다."
 Sweden.321.a: "항공기뿐 아니라 산업 패키지를 판매한다"
 Sweden.321.b: "민감한 작업은 스웨덴에 남긴다"
 Sweden.322.t: "그리펜을 선택한 브라질"
 Sweden.322.d: "브라질은 라팔과 슈퍼 호넷 대신 그리펜 NG를 선택했으며, 36대를 도입하는 대신 엠브라에르가 프로그램에 참여하는 기술 이전 패키지를 받습니다. 이는 사브가 지금까지 체결한 가장 큰 수출 계약이며, 차세대 기종을 순수한 스웨덴 제품이 아니라 스웨덴-브라질 공동 제품으로 만듭니다."
 Sweden.322.a: "주문을 받고 플랫폼을 공유한다"
 Sweden.322.b: "차세대 기종을 국가 계획으로 유지한다"
 Sweden.323.t: "조선소 되찾기"
 Sweden.323.d: "코쿰스는 스웨덴의 잠수함을 건조하고 티센크루프가 이를 소유하고 있으나, 양측 관계가 파탄 나서 국가가 계약을 취소하고 관리들을 보내 조선소의 장비를 철거하게 할 정도가 되었습니다. 사브가 인수할 의향이 있습니다. 이를 실행하면 잠수함 건조가 스웨덴의 손으로 돌아오지만, 이제 다른 구매자가 없는 매도자가 정한 가격을 치러야 합니다."
 Sweden.323.a: "코쿰스를 인수하고 조선소를 본국으로 되돌린다"
 Sweden.323.b: "외국 소유주를 통해 계속 건조한다"
 Sweden.324.t: "가입 신청"
 Sweden.324.d: "스웨덴이 나토 가입을 신청했으며, 이와 함께 두 세기에 걸친 공식적 비동맹이 끝납니다. 사브에게는 고객이 바뀌는 일입니다. 상호 운용성 요건, 동맹 조달, 그리고 이미 수주 잔고를 채운 유럽의 재무장이 따라옵니다. 또한 스웨덴 항공기는 동맹이 딸려 있지 않은 유일한 선택지라는 논거도 끝납니다."
 Sweden.324.a: "동맹을 위해 생산한다"
 Sweden.324.b: "어떤 가입도 없이 구매할 수 있는 독자 노선을 유지한다"
 Sweden.325.t: "사브가 된 것"
 Sweden.325.d: "4반세기에 걸친 통합, 상쇄 조건, 브라질의 주문, 본국으로 돌아온 잠수함 조선소는 사브가 무엇인지, 그리고 인구 900만의 나라가 아직 스스로 무엇을 만들 수 있는지를 정리했습니다. 누가 항공기를 사는지, 센서가 어느 동맹에 연결되어 있는지를 말입니다."
 Sweden.325.a: "수주 잔고가 가득 찬 동맹 수출국"
 Sweden.325.b: "어떤 동맹에도 얽매이지 않는 수출국"
 Sweden.325.c: "타국 동맹 안의 전문가"
 Sweden.325.e: "대체로 스스로를 무장하는 무기고"
 SWE_saab_allied_arms_exporter: "동맹 무기 수출국"
 SWE_saab_allied_arms_exporter_desc: "사브는 재무장하기로 결정한 동맹에 전투기, 센서, 잠수함을 판매하며, 이를 건조하는 것은 스웨덴의 조선소와 조립 라인입니다. 생산 능력을 소유한다는 것은 수주 잔고가 고객 관계가 아니라 국가의 자산이라는 뜻입니다."
 SWE_saab_non_aligned_exporter: "비동맹 수출국"
 SWE_saab_non_aligned_exporter_desc: "사브는 여전히 공장이 딸린 항공기를 판매하며, 구매자는 동맹이 딸리지 않은 능력을 원하는 이들입니다. 시장은 더 작고, 독립성이 곧 상품입니다."
 SWE_saab_alliance_specialist: "동맹 전문 공급자"
 SWE_saab_alliance_specialist_desc: "사브는 동맹이 다른 곳에서 쉽게 조달할 수 없는 센서, 공중 조기경보, 잠수함을 만들고 나머지는 구매합니다. 전문화는 자리를 얻어 주지만 완전한 생산 기반까지 얻어 주지는 않습니다."
 SWE_saab_domestic_arsenal: "국내 무기고"
 SWE_saab_domestic_arsenal_desc: "사브는 주로 스웨덴을 위해, 스웨덴의 조건으로, 스웨덴의 물량만큼 생산합니다. 공학 기술은 온전히 살아남지만, 아무도 비용을 분담하지 않을 때 단가는 그대로 감당해야 합니다."
