 ENG_royal_navy_Idea5: "Marina Real Británica"
 ENG_royal_navy_Idea5_desc: "La Marina Real Británica se erige como una de las principales fuerzas marítimas del mundo, con un célebre legado que se remonta a varios siglos atrás. Reconocida por su adaptabilidad y destreza tecnológica, la Royal Navy desempeña un papel crucial en la salvaguarda de los intereses marítimos del Reino Unido y en la proyección de su poder a escala global."
 ENG_british_foregin_legion_idea: "Legión Extranjera Británica"
 ENG_british_foregin_legion_idea_desc: "Permitimos que soldados de todo el mundo se unan a las Fuerzas Armadas británicas en defensa de los intereses británicos."
 ENG_field_army_expansion_idea: "Expansión del ejército de campaña"
 ENG_field_army_expansion_idea_desc: "El ejército de campaña ampliado está diseñado para destacar en diversos entornos operativos, desde la guerra convencional hasta las misiones de mantenimiento de la paz. Esta iniciativa se alinea con la estrategia de defensa más amplia del Reino Unido, haciendo hincapié en la preparación, la movilidad y la interoperabilidad con las fuerzas aliadas. Al invertir en el crecimiento y la modernización de su ejército de campaña, el Reino Unido refuerza su compromiso de mantener una fuerza terrestre versátil y ágil, capaz de hacer frente a las amenazas cambiantes del siglo XXI."
 ENG_multi_ocean_training: "Adiestramiento multiocéano"
 ENG_multi_ocean_training_desc: "Este programa estratégico se centra en mejorar las capacidades y la preparación de la Royal Navy mediante ejercicios de adiestramiento especializados, simulaciones y escenarios del mundo real. Al exponer al personal naval a los desafíos específicos que plantean los diferentes océanos, desde el Atlántico hasta el Pacífico y más allá, esta iniciativa garantiza la adaptabilidad, la versatilidad y la eficacia de las operaciones marítimas a escala global."
 ENG_carrier_wing_procurement: "Adquisición de ala aérea para portaaviones"
 ENG_carrier_wing_procurement_desc: "La iniciativa de Adquisición ampliada de ala aérea para portaaviones subraya el compromiso del Reino Unido de reforzar las capacidades de poder aéreo de sus portaaviones de la clase Queen Elizabeth. Este esfuerzo estratégico implica la adquisición y expansión de aeronaves embarcadas, centrándose en plataformas avanzadas para mejorar el alcance operativo y la versatilidad del ala aérea del portaaviones. La iniciativa de adquisición incluye la integración de aeronaves de vanguardia, como el F-35B Lightning II, junto con activos de apoyo y reconocimiento. Esta expansión está diseñada para fortalecer las capacidades de los portaaviones, garantizando un grupo de combate de portaaviones formidable que pueda operar en todo un espectro de misiones."
 ENG_strategic_aircraft_strategy_idea: "Estrategia de aviación estratégica"
 ENG_strategic_aircraft_strategy_idea_desc: "La Estrategia de aviación estratégica tiene como objetivo garantizar que el Reino Unido mantenga una flota robusta y capaz de aeronaves estratégicas que puedan respaldar eficazmente los objetivos de la defensa nacional, contribuir a los esfuerzos de seguridad internacional y adaptarse a las amenazas emergentes en el entorno de la seguridad global."
 ENG_army_specialization_army: "Especialización del ejército"
 ENG_army_specialization_army_desc: ""
 ENG_army_specialization_air: "Especialización de la fuerza aérea"
 ENG_army_specialization_air_desc: ""
 ENG_army_specialization_navy: "Especialización naval"
 ENG_army_specialization_navy_desc: ""
 ENG_army_specialization_staff: "Especialización del estado mayor"
 ENG_army_specialization_staff_desc: ""
 ENG_auxiliary_navy1: "Flota Auxiliar de la Marina Real"
 ENG_auxiliary_navy1_desc: "El concepto de la Flota Auxiliar de la Marina Real subraya la importancia del apoyo civil en las operaciones navales, destacando los esfuerzos de colaboración entre el personal militar y civil para garantizar la eficacia y la preparación de la Royal Navy en el cumplimiento de sus responsabilidades marítimas."
 ENG_auxiliary_navy2: "Flota Auxiliar de la Marina Real"
 ENG_auxiliary_navy2_desc: "El concepto de la Flota Auxiliar de la Marina Real subraya la importancia del apoyo civil en las operaciones navales, destacando los esfuerzos de colaboración entre el personal militar y civil para garantizar la eficacia y la preparación de la Royal Navy en el cumplimiento de sus responsabilidades marítimas."
 ENG_royal_army1: "Ejército Real Británico"
 ENG_royal_army1_desc: "El Ejército Británico es la rama de guerra terrestre de las Fuerzas Armadas británicas y actúa como la principal fuerza militar de base terrestre del Reino Unido. Con una rica historia que abarca siglos, el Ejército Británico es reconocido por su profesionalidad, adaptabilidad y eficacia operativa. Integrado por soldados altamente adiestrados de diversos orígenes, el Ejército está equipado para acometer una amplia gama de misiones, incluidas operaciones de combate, misiones de mantenimiento de la paz, esfuerzos de rescate en caso de catástrofe y tareas de asistencia humanitaria."
 ENG_royal_army2: "Ejército Real Británico"
 ENG_royal_army2_desc: "El Ejército Británico es la rama de guerra terrestre de las Fuerzas Armadas británicas y actúa como la principal fuerza militar de base terrestre del Reino Unido. Con una rica historia que abarca siglos, el Ejército Británico es reconocido por su profesionalidad, adaptabilidad y eficacia operativa. Integrado por soldados altamente adiestrados de diversos orígenes, el Ejército está equipado para acometer una amplia gama de misiones, incluidas operaciones de combate, misiones de mantenimiento de la paz, esfuerzos de rescate en caso de catästrofe y tareas de asistencia humanitaria."
 ENG_royal_army3: "Ejército Real Británico"
 ENG_royal_army3_desc: "El Ejército Británico es la rama de guerra terrestre de las Fuerzas Armadas británicas y actúa como la principal fuerza militar de base terrestre del Reino Unido. Con una rica historia que abarca siglos, el Ejército Británico es reconocido por su profesionalidad, adaptabilidad y eficacia operativa. Integrado por soldados altamente adiestrados de diversos orígenes, el Ejército está equipado para acometer una amplia gama de misiones, incluidas operaciones de combate, misiones de mantenimiento de la paz, esfuerzos de rescate en caso de catástrofe y tareas de asistencia humanitaria."
 ENG_royal_airforce1: "Los fantasmas de la Royal Air Force"
 ENG_royal_airforce1_desc: "A pesar de su célebre historia, una Royal Air Force (RAF) desfasada refleja una era de equipos envejecidos y capacidades limitadas. Obstaculizado por aeronaves obsoletas e insuficientes esfuerzos de modernización, este espíritu nacional simboliza las dificultades de mantener la superioridad aérea con tecnología anticuada. Sin embargo, en medio de estas limitaciones, el legado de la RAF perdura, inspirando resiliencia y determinación para adaptarse y vencer."
 ENG_royal_airforce2: "Modernización de la Royal Air Force"
 ENG_royal_airforce2_desc: "La modernización de la Royal Air Force encarna un cambio estratégico hacia la revitalización de las capacidades del poder aéreo mediante esfuerzos integrales de modernización. Con el foco puesto en la actualización de aeronaves, la mejora de las capacidades tecnológicas y la inversión en sistemas de vanguardia, este espíritu nacional refleja un enfoque proactivo para garantizar que la RAF se mantenga a la vanguardia de la superioridad aérea en un espacio de batalla en constante evolución."
 ENG_royal_airforce3: "Royal Air Force modernizada"
 ENG_royal_airforce3_desc: "Centrada en la superioridad aérea y la respuesta rápida, la Royal Air Force modernizada representa una fuerza formidable equipada con aviones de caza de última generación y capacidades de combate avanzadas. Con cazas ágiles capaces de dominar los cielos y enfrentarse a los adversarios con una velocidad y precisión inigualables, este espíritu nacional ejemplifica el compromiso de la RAF de mantener la superioridad aérea y defender los intereses nacionales con una destreza aérea incomparable."
 ENG_royal_airforce4: "Royal Air Force modernizada"
 ENG_royal_airforce4_desc: "La Royal Air Force modernizada heralda una nueva era en la proyección del poder aéreo estratégico, caracterizada por bombarderos de última generación y capacidades de ataque de precisión. Con bombarderos avanzados equipados para misiones de largo alcance y municiones guiadas de precisión, este espíritu nacional subraya la capacidad de la RAF para lanzar ataques aéreos decisivos y precisos contra objetivos de alto valor, proyectando poder y disuadiendo a los adversarios con una exactitud sin parangón."
 ENG_royal_airforce5: "Royal Air Force modernizada"
 ENG_royal_airforce5_desc: "La Royal Air Force modernizada heralda una nueva era en la proyección del poder aéreo estratégico, caracterizada por bombarderos de última generación y capacidades de ataque de precisión. Con bombarderos avanzados equipados para misiones de largo alcance y municiones guiadas de precisión, este espíritu nacional subraya la capacidad de la RAF para lanzar ataques aéreos decisivos y precisos contra objetivos de alto valor, proyectando poder y disuadiendo a los adversarios con una exactitud sin parangón."
 ENG_airbus_expansion: "Expansión de Airbus"
 ENG_airbus_expansion_desc: "La expansión de Airbus subraya el compromiso de la empresa con la innovación, la excelencia y la satisfacción del cliente, al tiempo que contribuye al desarrollo económico, la creación de empleo y el avance tecnológico en la industria aeroespacial británica."
 ENG_homegrown_innovation: "Innovación nacional"
 ENG_homegrown_innovation_desc: "Canalizar la innovación nacional tiene como objetivo fomentar una cultura de innovación y emprendimiento dentro de los sectores aeroespacial y de la aviación del Reino Unido."
 ENG_homegrown_innovation_us1: "Colaboración de innovación aérea EE. UU.-Reino Unido"
 ENG_homegrown_innovation_us1_desc: "Estados Unidos colabora con el Reino Unido para innovar en la Fuerza Aérea."
 ENG_joint_strike_fighter_project_US1: "Colaboración de innovación aérea EE. UU.-Reino Unido"
 ENG_joint_strike_fighter_project_US1_desc: "Estados Unidos colabora con el Reino Unido para innovar en la Fuerza Aérea."
 ENG_trans_atlantic_defence: "Defensa transatlántica"
 ENG_harmony_doctrine_idea: "Doctrina de la armonía"
 ENG_harmony_doctrine_idea_desc: "La Doctrina de la armonía trata el equilibrio medioambiental como un interés nacional, alineando la influencia de la Corona en favor de la gestión de la tierra, el agua y la resiliencia climática. Impulsa al gobierno y a la industria hacia una producción sostenible, energías más limpias y una conservación a largo plazo sin sacrificar la estabilidad. Gran Bretaña prosperará viviendo dentro de sus posibilidades, y el Palacio insistirá en que la naturaleza forme parte de la política de Estado."
 ENG_abolish_devolution_TT: "¡Revertiremos todas las políticas de descentralización!\n - Esto provocará un levantamiento en [SCO.GetFlag] Escocia, [WAS.GetFlag] Gales y [NIR.GetFlag] Irlanda del Norte.\n - El sistema de descentralización dejará de estar disponible."
 ENG_annex_ireland_TT: "¡Podremos obtener núcleos (§Hcore§!) en [IRE.GetFlag] §HIrlanda§! a través de una decisión!"
 ENG_still_can_TT: "§O¡Aún podemos formar la Federación de la Commonwealth si los convertimos en estado títere por otros medios!§!"
 ENG_declares_commonwealth_federation_TT: "Declarará la §HFederación de la Commonwealth§!\n - Anexionaremos (§Hannex§!) y obtendremos núcleos (§Hcore§!) en los principales sujetos de la Commonwealth.\n - El nombre y la bandera de nuestro país cambiarán."
