 EU_join_the_euro_decision_desc: "유로화를 도입하기 위해 유럽연합 국가들은 자국 법률을 관련 유럽연합 법률에 일치시키고 경제적 수렴을 보장하도록 설계된 특정 조건들을 충족해야 합니다. 1991년 마스트리히트에서 유럽연합 회원국들이 합의한 이 요구 사항들은 수렴 기준이라고 불립니다."
