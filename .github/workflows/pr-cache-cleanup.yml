name: PR Cache Cleanup

# Removes legacy workspace caches when a PR closes.

on:
  # This job never checks out or executes PR code.
  pull_request_target:
    types: [closed]

permissions:
  actions: write

jobs:
  cleanup:
    name: Delete PR caches
    runs-on: ubuntu-latest
    steps:
      - name: Delete legacy caches scoped to this PR's merge ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="refs/pull/${{ github.event.pull_request.number }}/merge"
          cache_url="repos/${{ github.repository }}/actions/caches"
          # --paginate: a long-lived PR can hold >100 entries. The || arm
          # tolerates a delete/eviction race (404) without failing the job.
          cache_ids=$(gh api --paginate \
            "${cache_url}?ref=${ref}&per_page=100" \
            --jq '.actions_caches[].id')
          while read -r id; do
            [ -z "$id" ] && continue
            gh api -X DELETE "${cache_url}/${id}" \
              && echo "deleted cache ${id}" \
              || echo "cache ${id} already gone"
          done <<< "$cache_ids"

      # Remove legacy branch-scoped workspace bundles.
      - name: Delete workspace bundles scoped to this PR's head branch
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          # Keep contributor-controlled branch text out of the shell template.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          [ -n "$HEAD_REF" ] || exit 0
          cache_url="repos/${{ github.repository }}/actions/caches"
          # -f, not a hand-built query string: gh url-encodes the value, so a
          # branch name containing & or # cannot rewrite the request.
          cache_ids=$(gh api --paginate --method GET "$cache_url" \
            -f ref="refs/heads/${HEAD_REF}" -F per_page=100 \
            --jq '.actions_caches[]
                  | select(.key | startswith("md-workspace-")) | .id')
          while read -r id; do
            [ -z "$id" ] && continue
            gh api -X DELETE "${cache_url}/${id}" \
              && echo "deleted cache ${id}" \
              || echo "cache ${id} already gone"
          done <<< "$cache_ids"
