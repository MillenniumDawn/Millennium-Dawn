 SP_arty_0: "자주포 1965"
 SP_arty_0_desc: "With its powerful indirect fire abilities, Self-Propelled Artillery provides sustained precision strikes where it's needed on the battlefield, and far beyond visual ranges. It can be reloaded directly by its crew, and its self-propulsion makes it mobile so they can move to avoid counter-strikes by enemy artillery."
 SP_arty_desc: "자주포는 목표물을 타격하기 위해 스스로 움직일 수 있는 대포입니다. 자주포는 보통 고기동 무한궤도 차량 위에 대구경 곡사포나 야포, 박격포 혹은 로켓이나 미사일 발사대를 장착했습니다."
 SP_R_arty_0: "자주 다련장 로켓포 1965"
 SP_R_arty_0_desc: "Self-Propelled Multiple Rocket Launchers can fire fast volleys of Rockets that blanket an entire large area. They are often employed against enemy staging areas. Due to the mass devastation they cause, they have a longer minimum engagement range than regular artillery. They also have lower accuracy, and are thus unsuited for precision strikes. They require dedicated support vehicles to reload."
