 while_cartel_money_laundering_active_tt: "While the decision §Y$target_cartel_money_laundering_decision$§! is active:\nThe success rate for these decisions is impacted by the $political_influence_of_cartels$. If they have high political influence these investigations are more likely to fail.\n\n"
 while_cartel_drug_attacking_active_tt: "While the decision §Y$target_cartel_drug_running_decision$§! is active:\nThe success rate for these decisions is impacted by the $strength_of_cartels$. If they have high political influence these investigations can fail.\n\n"
 investigating_decisions_police_tt: "결정 §Y$police_investments_decision$§!(이)가 활성화 되어 있는 동안:\n§Y모든 카르텔 결정§!의 성공 가능성이 §Y15%§! 증가합니다.\n"
 investigating_decisions_military_tt: "결정 §Y$utilize_the_military_decisions$§!(이)가 활성화 되어 있는 동안:\n§Y모든 카르텔 결정§!의 성공 가능성이 §Y25%§! 증가합니다.\n"
