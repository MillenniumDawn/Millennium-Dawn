 pak_raj_border_attack_420_from_427_desc:0 "Lançar uma operação limitada através da Linha de Controle, de Jammu e Caxemira para Azad Caxemira. Um avanço bem-sucedido adiciona §Y20 de Progresso da Reivindicação§! rumo a este estado; um rechaço custa §Y10§!."
 pak_raj_border_attack_429_from_563:0 "Atacar o Punjab Oriental a partir do Punjab Central"
 pak_raj_border_attack_429_from_563_desc:0 "Avançar do Punjab Central rumo ao Punjab Oriental. Um avanço bem-sucedido adiciona §Y20 de Progresso da Reivindicação§! rumo a este estado; um rechaço custa §Y10§!."
