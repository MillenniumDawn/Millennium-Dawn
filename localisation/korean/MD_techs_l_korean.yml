 module_naval_sub_vls_cells_4: "잠수함 VLS (4셀)"
 module_naval_sub_vls_cells_4_desc: "잠수함 선체에 장착된 수직 발사관입니다. 셀 수가 발사 용량을 결정합니다. 셀이 많을수록 장착되는 미사일 탄약 적재량이 늘어나지만, 비용과 배수량도 함께 커집니다.\n\n§G설계 조언: 잠수함 VLS 셀은 잠수함의 미사일 임무 전투 능력치를 배가시킵니다. 발사대가 클수록 미사일 화력이 증가하지만 IC, 인력, 연료 사용량, 잠수함 피탐성이 더 늘어납니다.§!"
