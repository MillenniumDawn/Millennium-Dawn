 TOP_open_tt: "Open the §YDossiers§!: our intelligence files on wanted people and organizations, and the steps from finding a target to acting against it."
 TOP_select_tt: "Select this person's dossier. Changing the displayed dossier does not change an authorized operation."
 TOP_collect_tt: "Follow the established Counter-Terror intelligence for this package. This updates identification and pattern evidence from current CT intelligence and creates no separate intelligence gain. Complete Track High Value Targets in the intelligence agency to obtain a current location. The core operation requires its usual network, operative, equipment and DLC access."
 TOP_stop_tt: "Pause collection and free its slot while preserving the package and every intelligence axis. Location and pattern knowledge continue their normal decay."
 TOP_drone_tt: "Review a strike against this exact person through a native drone raid. Core raid doctrine, eligibility, launch cost, losses and victim reactions apply. The native raid result determines the physical outcome."
 TOP_capture_tt: "Review a capture of this exact person through a native special-forces raid. Core raid doctrine, eligibility, technology, basing, launch cost and engine requirements apply. Success and critical success take the person alive."
 TOP_covert_tt: "Review a covert lethal action against this exact person. Carry it out with the intelligence agency Covert Killing operation. Committed operatives, network strength, preparation and native operation outcomes govern execution; no special-forces raid units or military basing are required."
 TOP_rendition_tt: "Review a foreign capture and rendition. Use the intelligence agency Rendition operation to seize the target and bring them into our custody. The existing special-forces technology prerequisite remains; delivery commits operatives, without requiring military raid units or basing."
 TOP_partner_tt: "Request a cooperative host arrest. An explicit cooperative host reply is required. Use the intelligence agency Host-Assisted Arrest operation to coordinate local authorities. Success gives the consenting host initial custody. Intelligence-only cooperation provides reporting without capture authority."
 TOP_sabotage_tt: "Review the selected command, training or financial objective. Use established CT raids where they implement the objective, or the corresponding native facility raid for a target-specific disruption. Native results own delivery, shared losses and victim reactions. Successful disruptions cause repairable damage or temporary resource disruption without removing a person."
 TOP_novichok_tt: "Russia only. Review the authored poisoning method with its decryption and enhanced intelligence gates. Use the intelligence agency Poisoning operation. Operative commitment, preparation, risk and outcomes govern delivery without military raid units or basing."
 TOP_revoke_tt: "Withdraw this review, mandate or operation authority. The dossier remains. Also cancel the matching operation in the intelligence agency or raids view. Engine-owned equipment, operative losses and damage already incurred still apply."
 TOP_release_tt: "Release this prisoner to active-at-large status. Actionable location is cleared and person and organization pressure rise sharply. A released Iraq fugitive no longer counts as securely detained."
 TOP_transfer_tt: "Transfer custody to the recorded valid recipient. The global custodian and detention state change immediately; partner captures begin with the physical partner."
 TOP_refresh_tt: "Refresh the dossier and archive from the latest recorded intelligence."
