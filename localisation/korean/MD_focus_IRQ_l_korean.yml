 IRQ_aftermath_of_war: "전쟁의 여파"
 IRQ_aftermath_of_war_desc: "우리 국가는 여전히 전쟁의 충격에서 헤어나지 못하고 있습니다... 우리는 어떤 대가를 치르더라도 이라크를 재건해야 합니다"
