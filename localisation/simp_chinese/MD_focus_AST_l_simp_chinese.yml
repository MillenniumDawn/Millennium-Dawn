 tony_abbott_desc: "托尼的政治生涯就是一场巧妙回避批评、猛烈抨击对手的表演。作为一位能力出众、手段狠辣的反对党领袖，托尼带领该党走向了更加极右的立场，并热衷于推广他那三个字的口号。\n\n托尼出生于伦敦，在悉尼长大，信奉罗马天主教，并接受了耶稣会教育。他求学时的首要目标是成为一名神父。对服务和精神领袖的强烈渴望最终促使他回到英国，进入牛津大学深造，在投身宗教事业之前尽可能多地学习。尽管备受爱戴，他对政治的兴趣却从未消退。\n\n他经常组织集会和示威游行，这使他与牛津大学的左翼学生领袖们针锋相对，最终导致暴力冲突。回到澳大利亚后，托尼还是遵从了自己的初衷，于1984年26岁时加入了神职队伍。三年后，他承认自己“格格不入”，并意识到神职并不适合他。\n\n由于他对政治的热爱远胜于对党的忠诚，托尼加入了《公报》担任记者，最终成为自由党的新闻秘书。这位经验丰富、极具争议的党内人物如今已登上国家最高领导人的宝座。"
