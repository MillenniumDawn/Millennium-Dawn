 BOS_bnttmih_mio_trait_m84_recoilless: "Fusil sans recul M84"
 BOS_bnttmih_mio_trait_at_gun_100: "Canon antichar de 100 mm"
 BOS_bnttmih_mio_trait_mountain_gun_100: "Canon de montagne de 100 mm"
 BOS_croat_secession_crisis: "Crise de sécession croate"
 BOS_croat_secession_crisis_desc: "Les institutions d'Herceg-Bosna rédigent une législation de retrait et entraînent leurs propres unités. Si les griefs croates ne sont pas traités avant que l'impasse n'expire, le sud se sépare les armes à la main."
 BOS_dayton_two: "Règlement révisé de Dayton"
 BOS_dayton_two_desc: "Un règlement constitutionnel renégocié a échangé une autonomie plus large des entités contre la fin des combats. Cela achète la stabilité, au prix d'un centre plus lâche."
 BOS_srpska_secession_crisis_opens_tt: "La Republika Srpska ouvre une crise sécessionniste. Si elle n'est pas résolue avant la fermeture de la fenêtre, l'entité entre en guerre."
 BOS_croat_secession_crisis_opens_tt: "Herceg-Bosna ouvre une crise sécessionniste. Porter la confiance croate à Amicale avant la fermeture de la fenêtre pour garder le sud dans le pays."
 bos_srpska_reconciliation_full_tt: "La confiance serbe dans le gouvernement est réinitialisée à Hostile alors que l'entité est pleinement ramenée sous l'autorité centrale."
 bos_srpska_negotiated_autonomy_tt: "La confiance serbe dans le gouvernement est fixée à Amicale selon les termes de l'autonomie négociée."
 BOS_croat_deescalation_hint_tt: "Porter la confiance croate à Amicale via les décisions de faction pour désamorcer la crise avant son expiration."
 BOS_rotate_presidency_hint_tt: "Utiliser la décision Rotation des dirigeants pour transmettre la présidence et réinitialiser la patience de la communauté en attente."
 BOS_croat_neutrality_pact_honored_tt: "Le pacte de neutralité croate tient. Herceg-Bosna reste hors de la guerre et ne fait pas sécession."
 BOS_political.82.t: "La Republika Srpska se prépare à faire sécession"
 BOS_political.82.d: "L'assemblée de l'entité a fixé une date de retrait des institutions de l'État. Il reste une fenêtre étroite pour reculer avant que l'indépendance ne soit déclarée purement et simplement."
 BOS_political.82.a: "Trouver un moyen de désamorcer la situation"
 BOS_political.83.t: "L'Herzégovine menace de faire sécession"
 BOS_political.83.d: "Les dirigeants croates du sud s'acheminent vers la sécession, invoquant des années d'être mis en minorité. Réparer les relations maintenant est le seul moyen de les garder dans le pays."
 BOS_political.83.a: "Tendre la main à la communauté croate"
 BOS_political.84.t: "La rotation de la présidence cale"
 BOS_political.84.d: "Le siège devait changer de mains, mais la passation ne cesse d'être reportée. La communauté qui attend son tour commence à voir le retard comme délibéré."
 BOS_political.84.a: "Noter leur frustration"
 BOS_offer_amnesty: "Offrez l'amnistie"
 BOS_offer_amnesty_desc: "Étendre l'amnistie aux combattants qui déposent les armes. Cela stabilise le pied de la communauté serbe mais se lit comme une faiblesse sur le front intérieur."
 BOS_forced_requisition: "Réquisition forcée"
 BOS_forced_requisition_desc: "Saisir ravitaillement et matériel auprès des entités pour financer l'effort de guerre. Cela remplit le Trésor et durcit le ressentiment serbe."
 BOS_sign_croat_neutrality_pact: "Signer le pacte de neutralité croate"
 BOS_sign_croat_neutrality_pact_desc: "Garantir l'autonomie croate en échange de leur neutralité. Si une prise de pouvoir islamique suit, l'Herzégovine restera dans le pays plutôt que de se fragmenter."
 BOS_canton_pressure_campaign: "Campagne de pression cantonale"
 BOS_canton_pressure_campaign_desc: "Faire pression sur les cantons bosniaques et croates pour qu'ils s'alignent sur le programme central. Cela stabilise l'État au détriment de la bonne volonté des deux communautés."
 BOS_serbian_alignment_overtures: "Ouvertures d’alignement serbe"
 BOS_serbian_alignment_overtures_desc: "Approfondir les liens politiques et économiques avec Belgrade. L'influence serbe en Bosnie grandit, la communauté serbe se réchauffe au gouvernement, et la patience bosniaque s'use."
 BOS_srpska_supremacy_measures: "Mesures de suprématie serbe"
 BOS_srpska_supremacy_measures_desc: "Promouvoir les priorités nationalistes et de sécurité serbes dans la politique et les institutions du gouvernement."
 BOS_bosniak_governing_partner: "Partenaire gouvernant bosniaque"
 BOS_bosniak_governing_partner_desc: "Un partenaire bosniaque loyal stabilise la coalition et réduit les troubles."
 BOS_croat_governing_partner: "Partenaire gouvernemental croate"
 BOS_croat_governing_partner_desc: "Un partenaire croate loyal soutient la réforme économique mais réduit la souplesse de la coalition intérieure."
 BOS_srpska_governing_partner: "Partenaire gouvernant serbe"
 BOS_srpska_governing_partner_desc: "Un partenaire serbe loyal améliore la coopération de sécurité mais affaiblit le contrôle fédéral."
 BOS_reconstruction_dividends: "Dividendes de la reconstruction"
 BOS_reconstruction_dividends_desc: "Une coalition d'après-guerre qui coopère aux programmes de reconstruction peut générer des gains économiques à court terme."
 BOS_governing_partner_dividends_tt: "§GSi notre partenaire de coalition au pouvoir est loyal :§! la reconstruction verse des dividendes pendant 180 jours."
 BOS_internal_faction_balance_stability_tt: "§YConfiance communautaire :§! chaque communauté en dessous de §R25§! de confiance applique §R-15 %§! de stabilité nationale, chacune au-dessus de §G50§! accorde §G+5 %§!, chacune au-dessus de §G74§! accorde §G+10 %§!."
 BOS_internal_faction_balance_manpower_tt: "§YMain-d'œuvre communautaire :§! chaque communauté en dessous de §R25§! de main-d'œuvre applique §R-15 %§! de population recrutable, chacune au-dessus de §G50§! accorde §G+15 %§!, chacune au-dessus de §G74§! accorde §G+20 %§!."
 BOS_revanchism_peacekeepers_warning_tt: "§YNote :§! les casques bleus de l'EUFOR doivent quitter le pays avant que le Réveil national ne puisse avancer."
 BOS_national_awakening_consequences_tt: "§RCela nous engage à la guerre contre la Republika Srpska. Si nous déclarons ensuite la prise de pouvoir islamique, le gouvernement devient islamiste et l'Herzégovine fait sécession avec une partie de l'armée.§!"
 BOS_islamic_takeover_consequences_tt: "§RLe gouvernement devient islamiste et l'Herzégovine fait sécession, emportant une partie de l'armée.§!"
 BOS_eufor_withdrawal_threat: "La Bosnie exige le retrait de l'EUFOR"
 BOS_csto_accept_tt: "La Bosnie rejoint l'OTSC à nos côtés."
 BOS_csto_reject_tt: "Nous rejetons la candidature bosniaque à l'OTSC."
 BOS_euro_defence_accept_tt: "Nous étendons une garantie de défense à la Bosnie et la mission EUFOR s'achève."
 BOS_euro_defence_decline_tt: "Nous refusons de garantir la sécurité de la Bosnie."
 BOS_events.56.t: "Le bloc bosniaque pousse pour l'autorité centrale"
 BOS_events.56.d: "Les partis bosniaques au parlement d'État poussent à renforcer les institutions centrales aux dépens des entités, et attendent du gouvernement qu'il les appuie."
 BOS_events.56.a: "Soutenir la poussée centralisatrice"
 BOS_events.56.b: "Tenir la ligne sur les entités"
 BOS_events.56.c: "Financer plutôt le développement dans la Fédération"
 BOS_events.57.t: "Le Bloc croate exige des garanties des entités"
 BOS_events.57.d: "Les dirigeants croates d'Herzégovine veulent des garanties plus fermes pour la représentation croate, prévenant qu'à défaut ils bloqueront les institutions d'État."
 BOS_events.57.a: "Accommoder le bloc croate"
 BOS_events.57.b: "Refuser de nouvelles garanties"
 BOS_events.57.c: "Investir plutôt dans l'Herzégovine"
 BOS_events.58.t: "La Republika Srpska exige des compétences"
 BOS_events.58.d: "Banja Luka exige à nouveau que les compétences transférées à l'État soient rendues à l'entité, en invoquant les accords de Dayton."
 BOS_events.58.a: "Négocier un transfert limité"
 BOS_events.58.b: "Rejeter la demande sans appel"
 BOS_events.58.c: "Décentraliser les pouvoirs fiscaux vers l'entité"
 BOS_events.61.t: "Une offre chinoise pour la Republika Srpska"
 BOS_events.61.d: "Le gouvernement mené par la Srpska veut approuver un projet d'infrastructure financé par la Chine dans l'entité. Pékin y gagne un pied-à-terre, et les partis bosniaques de Sarajevo se méfient des contreparties."
 BOS_events.61.a: "Approuver le projet"
 BOS_events.61.b: "Bloquer le financement"
 BOS_events.62.t: "Une poussée pour l'autonomie fiscale"
 BOS_events.62.d: "Avec un Croate à la tête du gouvernement, les dirigeants d'Herzégovine réclament un nouveau transfert de pouvoirs fiscaux : une troisième entité en tout sauf le nom."
 BOS_events.62.a: "Décentraliser les compétences"
 BOS_events.62.b: "Garder le contrôle fiscal au centre"
 BOS_events.63.t: "Élargir le budget central"
 BOS_events.63.d: "Le gouvernement mené par les Bosniaques veut élargir le budget central, finançant des institutions d'État que les entités ont longtemps affamées. Banja Luka en voudra chaque mark convertible."
 BOS_events.63.a: "Élargir le budget"
 BOS_events.63.b: "Laisser le budget tel quel"
 BOS_events.64.t: "Les bus ne cessent de partir"
 BOS_events.64.d: "L'émigration est devenue impossible à ignorer. Des équipes entières restent vacantes et les jeunes familles vendent tout. Programmes d'emploi, bourses de rétention des jeunes, le corridor Vc et les envois de la diaspora sont les leviers pour ralentir l'exode."
 BOS_events.64.a: "Il faut garder notre peuple au pays"
 BOS_events.65.t: "Un pays qui se vide"
 BOS_events.65.d: "L'exode a atteint un paroxysme. Les cliniques ferment faute d'infirmiers et les villages sont à moitié vides. Seul un effort soutenu sur les programmes d'emploi, les bourses de rétention des jeunes, le corridor Vc et les envois de fonds fera retomber la pression."
 BOS_events.65.a: "Inverser le déclin"
 BOS_entity_competency_transfer: "Compétences des entités décentralisées"
 BOS_entity_competency_transfer_desc: "Les pouvoirs de levée de recettes ont été cédés à l'entité, achetant le calme politique au prix d'un gouvernement central plus lent et plus contesté."
 BOS_corruption_hits_weakest_tt: "§RLa communauté qui fait le moins confiance au gouvernement recule encore davantage à mesure que le scandale éclate.§!"
 BOS_eu_accession_push: "Poussée pour l’adhésion européenne"
 BOS_eu_accession_push_desc: "Le statut formel de candidat obtenu et toutes les communautés derrière la candidature, pousser l'agenda d'adhésion. Les prêteurs internationaux récompensent l'élan et la confiance dans le gouvernement réformateur monte."
 BOS_electoral_reform_package: "Paquet de réforme électorale"
 BOS_electoral_reform_package_desc: "Une fois que chaque communauté fait confiance à l'État, la structure discriminatoire de la présidence peut enfin être remplacée. Mettre fin au système de quotas ethniques retire la menace sécessionniste qui pesait sur l'ancien mandat rotatif tout en conservant ses bénéfices stabilisateurs."
 BOS_open_balkan_initiative: "Initiative Balkans ouverts"
 BOS_open_balkan_initiative_desc: "Rejoindre le marché régional mené par la Serbie pour la libre circulation des biens, du travail et des capitaux. Belgrade gagne de l'influence à Sarajevo, mais les représentants serbes saluent des liens plus étroits et les petites entreprises prospèrent."
 BOS_berlin_process_commitment: "Engagement du processus de Berlin"
 BOS_berlin_process_commitment_desc: "Ancrer la coopération régionale dans le processus de Berlin sponsorisé par l'Allemagne plutôt que dans l'orbite de Belgrade. La voie pro-européenne rassure les partenaires croates et bosniaques et ouvre la porte au financement occidental."
 BOS_confront_entity_obstruction: "Confronter l’obstruction de l’entité"
 BOS_confront_entity_obstruction_desc: "La Republika Srpska passe des années à bloquer les institutions d'État et à menacer de se retirer. Décider d'affronter l'obstruction de front ou d'acheter le calme par des concessions."
 BOS_energy_transition_strategy: "Stratégie de transition énergétique"
 BOS_energy_transition_strategy_desc: "Dépasser le clivage charbon contre hydroélectricité par des capacités renouvelables réparties dans les deux entités. Des projets partagés rassurent les communautés croate et serbe et donnent aux jeunes travailleurs une raison de rester."
 BOS_digital_diaspora_economy: "Économie de la diaspora numérique"
 BOS_digital_diaspora_economy_desc: "Relier le secteur technologique à la vaste communauté émigrée à l'étranger. Le télétravail et le retour des talents allègent la pression migratoire et gagnent les propriétaires de PME."
 BOS_census_2023: "Le recensement de 2023"
 BOS_census_2023_desc: "Mener le recensement longtemps retardé. Les résultats trancheront les disputes sur les effectifs de chaque communauté, mais le peuple que le gouvernement mettra en avant se sentira reconnu aux dépens d'un rival."
 BOS_eu_candidacy_momentum: "Dynamique des candidatures à l’UE"
 BOS_eu_candidacy_momentum_desc: "Le statut formel de candidat a dynamisé le camp réformateur et raffermi la confiance publique dans le gouvernement."
 BOS_reformed_presidency: "Présidence réformée"
 BOS_reformed_presidency_desc: "La présidence ethnique rotative a été remplacée par un système ouvert à chaque citoyen. La gouvernance est plus calme et plus légitime, et la menace constante de sécession des entités s'est levée."
 BOS_open_balkan_market: "Marché des Balkans ouverts"
 BOS_open_balkan_market_desc: "L'adhésion au marché régional a élargi les débouchés à l'export des firmes bosniaques, au prix d'un coût modeste pour la consommation intérieure."
 BOS_digital_economy_idea: "Économie numérique"
 BOS_digital_economy_idea_desc: "L'investissement dans la connectivité et le logiciel a relevé la recherche et aidé les usines à adopter des pratiques modernes."
 BOS_events.66.t: "Obstruction d'entité"
 BOS_events.66.d: "La direction de la Republika Srpska a de nouveau bloqué la législation d'État et évoqué un retrait des institutions fédérales. Le gouvernement doit répondre avant que la paralysie ne s'étende."
 BOS_events.66.a: "Adoptez une ligne dure"
 BOS_events.66.b: "Offrir des concessions"
 BOS_events.67.t: "Le recensement de 2023"
 BOS_events.67.d: "Les chiffres du recensement sont prêts à publication. Les dirigeants de chaque communauté font pression pour que leurs effectifs soient mis en avant dans les résultats officiels."
 BOS_events.67.a: "Mettre l'accent sur le décompte bosniaque"
 BOS_events.67.b: "Mettre l'accent sur le décompte croate"
 BOS_events.67.c: "Mettre l'accent sur le décompte serbe"
 BOS_confront_entity_obstruction_choice_tt: "§YOuvre un choix : affronter directement la Republika Srpska ou chercher un compromis.§!"
 BOS_hardline_rs_crisis_warning_tt: "§RSi la confiance serbe tombe sous 25 tandis que Milorad Dodik dirige la Republika Srpska, l'affrontement peut dégénérer en crise sécessionniste.§!"
 BOS_reformed_presidency_tt: "§GRemplace la présidence rotative active par la Présidence réformée, mettant fin au risque de sécession tout en conservant ses bénéfices de stabilité.§!"
 BOS_emigration_eased_energy_tt: "§GPression migratoire réduite de 5.§!"
 BOS_emigration_eased_digital_tt: "§GPression migratoire réduite de 10.§!"
 BOS_digital_diaspora_synergy_tt: "§GLes envois de la diaspora financent une nouvelle usine civile sans coût pour le Trésor.§!"
 RSK_requisition_the_mines: "Réquisitionner les mines"
 RSK_requisition_the_mines_desc: "Saisir la production des mines de l'entité pour le trésor de guerre. Les ouvriers ne nous en sauront pas gré."
 RSK_appeal_to_belgrade: "Faire appel à Belgrade"
 RSK_appeal_to_belgrade_desc: "Demander à la Serbie d'appuyer ouvertement l'entité, relevant le moral et réchauffant les relations avec Belgrade."
 HZG_war_levy: "Prélèvement de guerre en Herzégovine"
 HZG_war_levy_desc: "Imposer une levée d'urgence aux cantons pour financer la guerre. La stabilité en souffrira."
 HZG_appeal_to_zagreb: "Faire appel à Zagreb"
 HZG_appeal_to_zagreb_desc: "Demander à la Croatie de se tenir derrière l'Herzég-Bosnie, relevant le moral et réchauffant les relations avec Zagreb."
 BOS_events.68.t: "L'entité appelle"
 BOS_events.68.d: "La Republika Srpska en appelle à la Serbie pour des armes et des volontaires. Belgrade doit peser le soutien ouvert contre le risque d'une guerre plus large."
 BOS_events.68.a: "Envoyer armes et volontaires"
 BOS_events.68.b: "Nous ne pouvons pas paraître intervenir"
 BOS_events.69.t: "Réponses de Belgrade"
 BOS_events.69.d: "Les caisses serbes atteignent le front. Les soldats de l'entité reprennent cœur."
 BOS_events.69.a: "Pour le peuple serbe"
 BOS_events.70.t: "Les cantons appellent"
 BOS_events.70.d: "L'Herzég-Bosnie en appelle à la Croatie pour des armes et des volontaires afin de tenir la ligne."
 BOS_events.70.a: "Armer les cantons"
 BOS_events.70.b: "Zagreb doit rester hors de cela"
 BOS_events.71.t: "Réponses à Zagreb"
 BOS_events.71.d: "Les armes croates atteignent l'Herzég-Bosnie. Les défenseurs des cantons sont réconfortés."
 BOS_events.71.a: "Pour le peuple croate"
 RSK_serbian_support_accept_tt: "§GEnvoyer 2000 armes d'infanterie à la Republika Srpska et ouvrir le soutien de volontaires.§!"
 RSK_serbian_support_decline_tt: "§RLe soutien de guerre de la Republika Srpska diminue.§!"
 HZG_croat_support_accept_tt: "§GEnvoyer 1500 armes d'infanterie à l'Herzég-Bosnie et ouvrir le soutien de volontaires.§!"
 HZG_croat_support_decline_tt: "§RLe soutien de guerre de l'Herceg-Bosna diminue.§!"
 BOS_thermal_chinese_financing_tt: "§YPékin sera informé que le prêt est signé, et prendra en retour son influence en Bosnie.§!"
 BOS_events.72.t: "Sarajevo signe pour Tuzla"
 BOS_events.72.d: "La Bosnie a signé la ligne de crédit pour l'extension du lignite de Tuzla : 0,10 milliard hors de nos livres, et nos entrepreneurs sur le terrain. La centrale est le moindre prix. Ce que le prêt achète vraiment, c'est un siège à la table de Sarajevo, et un partenaire dans les Balkans qui nous est redevable."
 BOS_events.72.a: "Splendide."
 BOS_court_turkish_investment_tt: "§YAnkara sera informée que le marché est ouvert, et prendra en retour son influence en Bosnie.§!"
 BOS_court_gulf_investment_tt: "§YRiyad sera informé que les fonds sont les bienvenus, et prendra en retour son influence en Bosnie.§!"
 BOS_events.73.t: "Sarajevo ouvre la porte"
 BOS_events.73.d: "La Bosnie a ouvert la voie à nos entreprises de construction et à nos banques. Tronçons d'autoroute, logements, un réseau d'agences à Sarajevo. Du travail pour nos entrepreneurs et un pied-à-terre dans un pays qui nous voit encore comme parents. La parole d'Ankara portera désormais dans la Fédération."
 BOS_events.73.a: "Excellent."
 BOS_events.74.t: "Buroj Ozone trouve ses bailleurs"
 BOS_events.74.d: "Sarajevo a invité les capitaux du Golfe dans l'immobilier, le tourisme et la finance. La ville de villégiature de Trnovo est la vitrine, mais l'argent va plus loin : appartements, hôtels, et les banques qui en tiennent les papiers. Quoi que livrent les projets, le leadership musulman bosniaque se souviendra de qui a fait arriver les fonds."
 BOS_events.74.a: "Splendide."
 BOS_defeat_all_serbs: "Guerre civile en cours avec la Republika Srpska"
 BOS_croat_neutrality_pact: "Signature du pacte de neutralité croate"
 BOS_rs_crisis_resolved: "La crise de la sécession de la Republika Srpska résolue"
 BOS_third_entity_resolved: "Demande d'une troisième entité résolue"
 BOS_defence_property_registered: "Question des biens de défense réglée"
 BOS_privatization_settled: "Politique de privatisation tranchée"
 BOS_federation_grant_cooldown: "Subvention de développement de la Fédération en recharge"
 BOS_herzegovina_grant_cooldown: "Subvention de développement de l'Herzégovine en recharge"
 BOS_srpska_grant_cooldown: "Subvention de développement de la Srpska en recharge"
 BOS_loser: "Défaite bosniaque dans la guerre civile"
 BOS_sejdic_finci_ruling: "L'arrêt Sejdić-Finci rendu"