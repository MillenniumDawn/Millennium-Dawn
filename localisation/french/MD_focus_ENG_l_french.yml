 ENG_celsa_steel_idea: "Partenariat Celsa Steel"
 ENG_celsa_steel_idea_desc: "Un partenariat de long terme avec l'aciérie Celsa de Cardiff assure un flux régulier de ferraille recyclée vers l'acier neuf, améliorant nos rendements de ressources et nous donnant le levier pour pousser encore la production chaque année."
