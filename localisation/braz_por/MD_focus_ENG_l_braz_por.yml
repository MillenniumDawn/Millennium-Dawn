 raid_type_ENG_raid_nigeria: "Operação Delta Guard"
 raid_type_ENG_raid_zimbabwe: "Operação Safeguard"
 raid_type_ENG_raid_zimbabwe_desc: "O tirano que governa o Zimbábue deve ser deposto imediatamente, pois não se pode confiar nele para governar um país. Suas ações contra pessoas de origem britânica e contra o povo nativo zimbabuano demonstraram que ele não tem limites e, claramente, está disposto a cruzar os nossos."
 ENG_dartmouth_naval_college_expansion: "Expansão do Colégio Naval de Dartmouth"
 ENG_dartmouth_naval_college_expansion_desc: "A expansão do Colégio Naval de Dartmouth marca um investimento significativo em educação e treinamento marítimos no Reino Unido. Com base em sua rica tradição naval, a expansão prevê instalações de última geração, programas de treinamento avançados e maior capacidade para acomodar a crescente demanda por pessoal naval qualificado."
 ENG_type_32_frigate_guardian_class: "Fragata Type 32 Classe Guardian"
 ENG_type_32_frigate_guardian_class_desc: "A fragata Type 32 é uma fragata do Reino Unido para a Marinha Real. Foi anunciada oficialmente em novembro de 2020 pelo primeiro-ministro Boris Johnson como resultado da Revisão Integrada. Construída após as fragatas Type 26 e Type 31, o navio será de uso geral e de projeto modular, e espera-se que ajude a ampliar a frota de escolta de superfície da Marinha Real."
 ENG_charles_harmony: "Turnê da Harmonia do Príncipe Charles Britânico"
 ENG_election_unlock_tt: "§YEste foco pode ser desbloqueado quando um novo governo for formado pela eleição§!"
 ENG_army_special_operations_brigade_desc: "A Brigada de Operações Especiais do Exército representa o auge das capacidades militares do Reino Unido, dedicada a executar missões clandestinas e desafiadoras. Composta por pessoal excepcional de diferentes ramos, essa brigada de elite atua com precisão e adaptabilidade incomparáveis. Armada com tecnologia de ponta e treinamento rigoroso, a unidade está pronta para contraterrorismo, coleta de inteligência e outras operações de alto impacto, consolidando seu papel como ativo-chave no aparato de defesa e segurança do país."
 ENG_glasgow_shipbuilidng_tt: "Este efeito pode ser aprimorado concluindo §Y$ENG_refine_natural_bauxite$§!"
 ENG_refine_natural_bauxite_tt: "Isso melhorará os efeitos de §Y$ENG_glasgow_shipbuilidng$§!"
 ENG_the_queens_speech: "[ENG_the_queens_speech_focus_title]"
 ENG_the_queens_speech_desc_key: "A nação ouve de modo diferente quando a Soberana fala como voz do Estado, e não como cerimônia. No Discurso da Rainha, será declarado um novo acordo político e a agenda do governo ficará vinculada ao mandato da Coroa. A partir de hoje, as políticas terão autoridade real, e a Grã-Bretanha agirá como um reino de vontade única."
 ENG_the_kings_speech_desc_key: "A nação ouve de modo diferente quando o Soberano fala como voz do Estado, e não como cerimônia. No Discurso do Rei, será declarado um novo acordo político e a agenda do governo ficará vinculada ao mandato da Coroa. A partir de hoje, as políticas terão autoridade real, e a Grã-Bretanha agirá como um reino de vontade única."
 ENG_inner_circle_andrew.06.t: "Príncipe Andrew é Expulso da Família Real"
 ENG_inner_circle_andrew.06.a: "Ele não pode mais permanecer"
 ENG_inner_circle_philip.04.t: "O Príncipe Philip Morreu"
 ENG_inner_circle_philip.04.d: "O Príncipe Philip, Duque de Edimburgo, morreu após décadas no centro da vida pública real. Sua morte marca o fim de uma era para a monarquia e será sentida em todo o Reino Unido."
 ENG_inner_circle_philip.04.a: "A nação está de luto"
 ENG_overseas_territory: "Território Ultramarino Britânico"
 ENG_increase_dependence_alt_TT: "Aumentará a §HDependência§! em $RIGHT|+=0$"
 ENG_decrease_agitation_alt_TT: "Reduzirá a §HAgitação§! em $RIGHT|-=0$"
 ENGGetAscendedQueenTrait_tt: "[ENGQueentrait]\n\n[ENGGetAscendedQueenTrait]"
 ENG_andrew_epstein_punishment: "$ENG_prince_andrew_leader_name$ não é um membro ativo da família real"
 ENG_queen_elizabeth_class_carrier: "Porta-Aviões Classe Queen Elizabeth"
 ENG_queen_elizabeth_class_carrier_desc: "Os Porta-Aviões da Classe Queen Elizabeth foram o auge da aviação naval britânica, representando um salto transformador na capacidade de porta-aviões. Esses colossos reforçaram a projeção marítima do Reino Unido, encarnando a modernidade com sua tecnologia avançada, capacidade de aeronaves e amplo alcance operacional, fortalecendo a estatura de defesa global da nação."
 ENG_elizabeth_line_decision: "Concluir a Elizabeth Line"
 ENG_elizabeth_line_decision_desc: "Concluímos a Elizabeth Line através de Londres, ligando Heathrow, o West End, a City e Canary Wharf com trens rápidos e frequentes que cruzam a cidade, reduzindo o tempo de viagem e aumentando a produtividade."
 ENG_elizabeth_queen: "Elizabeth II"
 ENG_elizabeth_queen_trait: "Rainha"
 ENG_elizabeth_queen_idea: "$ENG_elizabeth_queen_trait$"
 ENG_elizabeth_queen_charles_andrew: "$ENG_queen_eldest$"
 ENG_elizabeth_queen_anne_edward: "$ENG_queen_middle$"
 ENG_elizabeth_queen_philip_william: "$ENG_queen_youngest$"
 ENG_elizabeth_ruling_monarch: "§Y$ENG_elizabeth_queen$§! é a atual §YMonarca Reinante§!"
 ENG_typhoon_tranche_debate: "Debate sobre o Typhoon Tranche 1"
 ENG_typhoon_tranche_debate_desc: "O Debate sobre o Typhoon Tranche 1 refere-se a discussões e análises em torno do Eurofighter Typhoon, uma aeronave de combate multifunção versátil desenvolvida por várias nações europeias. Esses debates costumam abordar diversos aspectos do Typhoon, incluindo seu desempenho, capacidades, custo-benefício e importância estratégica na guerra aérea moderna."
 ENG_silicon_glenn: "Silicon Glenn"
 ENG_silicon_glenn_tt: "§YImpulso Tecnológico Anual para $CAT_information_technology$, $CAT_internet$ ou $CAT_artificial_intelligence$§!"
 ENG_operation_excellence_desc: "Nossas Forças Armadas são uma força pequena, mas profissional e capaz, que pode ser rapidamente mobilizada em solo nacional para auxiliar o poder civil e outros departamentos governamentais quando convocada. Essa capacidade de segurança interna pode ser ampliada e apoiada para manter a Grã-Bretanha segura."
 ENG_modern_littoral_force_desc: "A Força Litorânea Moderna Britânica é uma iniciativa estratégica que enfatiza as capacidades navais em regiões costeiras. Liderada pelo Reino Unido, essa força modernizada integra tecnologias navais avançadas, embarcações versáteis e capacidade de resposta rápida para garantir o domínio marítimo em ambientes litorâneos. Com foco em agilidade e adaptabilidade, a força aumenta a capacidade do Reino Unido de salvaguardar interesses costeiros, responder a ameaças emergentes e contribuir para a estabilidade regional."
 ENG_trident_nuclear_program_desc: "O Programa Trident é a dissuasão nuclear contínua do Reino Unido no mar, empregando submarinos da classe Vanguard com mísseis balísticos Trident II D5. Essa iniciativa estratégica, gerida em instalações em Aldermaston e Burghfield, ressalta o compromisso da nação com uma capacidade de defesa ágil e potente."
 ENG_mothballing_operations: "Operações de Desativação Temporária"
 ENG_mothballing_operations_desc: "Em resposta a restrições financeiras, o governo britânico opta pelo caminho pragmático de colocar navios em reserva, decisão recebida com ressalvas pela indústria naval, em particular a BAE. Pensada para economizar recursos, a medida levanta preocupações na indústria quanto às possíveis implicações para a produção e a força de trabalho."
 ENG_modern_landing_craft_desc: "Em seu compromisso contínuo de aprimorar as capacidades navais, o Reino Unido tem buscado iniciativas de modernização, incluindo investimentos em novas lanchas de desembarque. Alinhado ao programa Future Commando Force, o Reino Unido pretende reforçar suas forças anfíbias, em particular os Fuzileiros Navais Reais, garantindo maior eficácia em operações litorâneas e anfíbias."
 ENG_mechanised_amphibious_assault_desc: "Enfatizando adaptabilidade e velocidade, o Reino Unido traça uma abrangente Doutrina de Assalto Anfíbio Mecanizado. Ancorada na sinergia entre os Fuzileiros Navais Reais e a Marinha Real, essa estratégia emprega Veículos de Assalto Anfíbio (AAVs) especializados e lanchas de desembarque para um rápido desdobramento costeiro. Comando e controle integrados, apoio aéreo e o emprego de navios de assalto anfíbio dedicados ressaltam o compromisso do Reino Unido em manter uma força formidável e versátil, garantindo prontidão para diversos cenários por meio de treinamento e exercícios rigorosos."
 ENG_strike_brigades_desc: "Em resposta às ameaças em evolução, o Reino Unido estabelece as Brigadas de Ataque Britânicas, unidades versáteis e rapidamente mobilizáveis, concebidas para operações terrestres ágeis. Compostas por infantaria, blindados e artilharia, essas brigadas encarnam o compromisso da nação com respostas militares rápidas e adaptáveis. O foco nas Brigadas de Ataque aumenta a capacidade do Reino Unido de projetar poder e responder com eficácia a desafios de segurança dinâmicos e diversos."
 ENG_carrier_group_debate_desc: "Uma parte vital de uma marinha moderna são as forças de ataque de porta-aviões. Precisamos discutir qual a melhor forma de criá-las."
 ENG_mothballing_operations_idea: "Operações de Desativação Naval"
 ENG_mothballing_operations_idea_desc: "Com o aumento das pressões financeiras, o Governo Britânico tende a colocar navios em reserva, uma medida prática com recepção mista na indústria naval, em especial na BAE. Embora vise à conservação de recursos, a decisão gera preocupações no setor, lançando uma sombra sobre a produção e a força de trabalho."
 ENG_quality_over_quantity_desc: "Guiado pelo princípio de Qualidade sobre Quantidade, o Reino Unido prioriza a excelência e a superioridade tecnológica em suas forças militares. Este espírito nacional enfatiza a aquisição de equipamentos avançados e sofisticados, garantindo uma postura de defesa formidável e tecnologicamente avançada. Ao focar na qualidade, o Reino Unido busca maximizar a eficácia de suas forças, criando uma vantagem estratégica diante dos desafios modernos."
 ENG_mothballing_operations_idea_tt: "Enquanto este espírito nacional estiver ativo, você §Rnão§! pode escolher §YFocos Nacionais Navais§! "
 ENG_mothballing_operations_negative_opinion_tt: "Modifica a §YOpinião da Indústria Marítima§! em §R-20§! enquanto tiver este espírito nacional"
 ENG_Space_Command: "Comando Espacial do Reino Unido"
 ENG_Space_Command_desc: "O Comando Espacial do Reino Unido é o líder de defesa para operações espaciais, força de trabalho espacial e capacidade espacial. É um comando conjunto, sediado em RAF High Wycombe, com pessoal da Marinha Real, do Exército Britânico e da Real Força Aérea, além de servidores civis e contratados."
 ENG_Space_Command2_desc: "O Comando Espacial do Reino Unido é o líder de defesa para operações espaciais, força de trabalho espacial e capacidade espacial. É um comando conjunto, sediado em RAF High Wycombe, com pessoal da Marinha Real, do Exército Britânico e da Real Força Aérea, além de servidores civis e contratados. Com o retorno dos famosos Casacas Vermelhas, a organização desfruta de moral mais alto e orgulho renovado."
 ENG_british_spaceports_privatized: "Espaçoportos Britânicos Privatizados"
 ENG_british_spaceports_privatized_desc: "O Reino Unido abraça uma nova fronteira na exploração espacial, privatizando espaçoportos para facilitar atividades comerciais além da Terra. Essas instalações operadas pela iniciativa privada sinalizam uma mudança rumo ao fomento da inovação e ao apoio a uma crescente indústria espacial comercial no Reino Unido."
 ENG_establish_asteroid_mining_network_mission: "Estabelecendo a Rede de Mineração de Asteroides"
 ENG_establish_asteroid_mining_network_mission_desc: "A Agência Espacial do Reino Unido está implantando plataformas orbitais e equipamentos de prospecção para iniciar operações de recursos fora da Terra."
 ENG_asteroid_mining_light_operation: "Levantamento de Prospecção"
 ENG_asteroid_mining_light_operation_desc: "Uma missão de levantamento em pequena escala implanta sondas robóticas para identificar asteroides próximos à Terra viáveis para extração."
 ENG_asteroid_mining_medium_operation: "Missão de Extração"
 ENG_asteroid_mining_medium_operation_desc: "Uma missão de extração dedicada mira depósitos de asteroides identificados, recuperando metais utilizáveis para a indústria britânica."
 ENG_asteroid_mining_heavy_operation: "Expedição de Mineração em Escala Total"
 ENG_asteroid_mining_heavy_operation_desc: "Uma operação em escala industrial completa é lançada ao cinturão de asteroides, mobilizando os ativos de mineração orbital mais avançados do Reino Unido."
 ENG_sovereign_capability_doctrine: "Doutrina de Capacidade Soberana"
 ENG_sovereign_capability_doctrine_desc: "A Grã-Bretanha se compromete a manter uma base industrial de defesa independente e de espectro completo. Os custos de transição estrutural impõem um freio de curto prazo à produção civil enquanto as fábricas se reequipam."
 ENG_consolidate_national_champions: "Consolidar os Campeões Nacionais"
 ENG_consolidate_national_champions_desc: "BAE Systems, Rolls-Royce e Babcock são designadas âncoras industriais estratégicas. Contratos governamentais, aquisições preferenciais e facilitação de exportações são direcionados a essas empresas."
 ENG_rolls_royce_raynesway_expansion: "Expansão da Rolls-Royce em Raynesway"
 ENG_rolls_royce_raynesway_expansion_desc: "A unidade de Derby, em Raynesway, que fabrica sistemas de propulsão nuclear para os submarinos da Marinha Real, recebe uma grande injeção de capital. Duas novas fábricas de armas entram em operação nas East Midlands."
 ENG_barrow_strategic_shipyard: "Estaleiro Estratégico de Barrow"
 ENG_barrow_strategic_shipyard_desc: "O estaleiro da BAE Systems em Barrow-in-Furness é designado ativo soberano protegido. Três novos estaleiros são adicionados ao complexo naval de Cumbria para garantir capacidade para a próxima classe de submarinos nucleares."
 ENG_combat_air_sovereignty: "Soberania do Combate Aéreo"
 ENG_combat_air_sovereignty_desc: "O Programa Global de Combate Aéreo define a futura capacidade de caças da Grã-Bretanha. A BAE Systems lidera a fase de projeto, com subsídios de P&D apoiados pelo governo acelerando o cronograma de desenvolvimento da plataforma."
 ENG_rolls_royce_aerospace_centre: "Centro Aeroespacial da Rolls-Royce"
 ENG_rolls_royce_aerospace_centre_desc: "Uma nova instalação de testes e produção de motores é inaugurada em Filton, Bristol, central para o desenvolvimento do sistema de propulsão de próxima geração do programa GCAP."
 ENG_munitions_strategic_reserve: "Reserva Estratégica de Munições"
 ENG_munitions_strategic_reserve_desc: "Uma auditoria de estoques expôs deficiências críticas em munições de precisão. Duas novas linhas de produção são encomendadas para reconstruir as reservas operacionais à profundidade da era da Guerra Fria."
 ENG_land_systems_sovereignty: "Soberania de Sistemas Terrestres"
 ENG_land_systems_sovereignty_desc: "Os programas Ajax e Challenger 3 definem o caminho para a produção totalmente nacional de veículos blindados. Uma nova instalação de armamentos é encomendada para apoiar o cronograma de entregas do programa."
 ENG_skills_pipeline_apprenticeship_act: "Lei do Pipeline de Competências e Aprendizagem"
 ENG_skills_pipeline_apprenticeship_act_desc: "Um pacto entre indústria e governo cria 50.000 vagas de aprendizes em engenharia de defesa, enfrentando a lacuna de competências deixada pela contração industrial pós-Guerra Fria. Mais duas instalações de produção de armas abrem à medida que a força de trabalho cresce."
 ENG_national_armaments_director: "Diretor Nacional de Armamentos"
 ENG_national_armaments_director_desc: "O cargo de Diretor Nacional de Armamentos é criado dentro do Ministério da Defesa para dar supervisão estratégica à base industrial soberana, coordenando aquisições, licenciamento de exportações e interoperabilidade com aliados."
 ENG_strategic_export_pact: "Pacto Estratégico de Exportação"
 ENG_strategic_export_pact_desc: "A BAE Systems é autorizada a concluir acordos de exportação apoiados pelo governo com Austrália, Canadá, Japão e Itália. Os arcabouços AUKUS e de Combate Aéreo Global fornecem a arquitetura diplomática."
 ENG_full_spectrum_industrial_base: "Base Industrial de Espectro Completo"
 ENG_full_spectrum_industrial_base_desc: "A Grã-Bretanha alcança autossuficiência em todos os cinco pilares industriais de defesa: submarinos, aeronaves de combate, veículos blindados, munições e armas de precisão. O complexo é formalmente designado ativo nacional estratégico."
 ENG_lean_defence_posture: "Postura de Defesa Enxuta"
 ENG_lean_defence_posture_desc: "O Ministério da Defesa adota um modelo de sinal de demanda, reduzindo os compromissos industriais domésticos e aceitando maior dependência de fornecedores aliados. A economia do Tesouro é imediata."
 ENG_value_for_money_review: "Revisão de Custo-Benefício"
 ENG_value_for_money_review_desc: "A revisão do Tribunal de Contas Nacional sobre as aquisições do Ministério da Defesa identifica estouros de custo sistemáticos. Uma renegociação abrangente dos principais contratos reduz custos unitários e elimina programas duplicados."
 ENG_mothball_strategic_yards: "Desativar Estaleiros Estratégicos"
 ENG_mothball_strategic_yards_desc: "Três instalações de estaleiros da Marinha Real passam a regime de manutenção reduzida. A economia imediata é substancial, mas a capacidade de construção naval não voltará sem investimento futuro significativo."
 ENG_cancel_legacy_programmes: "Cancelar Programas Legados"
 ENG_cancel_legacy_programmes_desc: "O Nimrod MRA4, o Sentinel R1 e seus sucessores são cancelados antes da entrega. A decisão libera capital, mas abre uma lacuna de capacidade de vigilância e patrulha marítima que levará anos para ser fechada."
 ENG_off_the_shelf_procurement: "Aquisição de Prateleira"
 ENG_off_the_shelf_procurement_desc: "A Grã-Bretanha abandona o desenvolvimento sob medida em favor de plataformas estrangeiras comprovadas. A abordagem reduz custos iniciais, mas diminui a produção industrial doméstica e estreita a base de pesquisa."
 ENG_f35_partnership_deepening: "Aprofundamento da Parceria F-35"
 ENG_f35_partnership_deepening_desc: "O Reino Unido acelera sua aquisição de F-35B para 48 células e aprofunda a integração com a cadeia de suprimentos do Joint Strike Fighter. Empresas britânicas fornecem cerca de 15 por cento de cada aeronave produzida."
 ENG_european_defence_cooperation: "Cooperação Europeia em Defesa"
 ENG_european_defence_cooperation_desc: "A Grã-Bretanha retoma parcerias bilaterais de capacidades com França, Alemanha e Itália. A pesquisa conjunta reduz redundâncias, embora a produção das fábricas de armas nacionais diminua à medida que as aquisições estrangeiras aumentam."
 ENG_smart_acquisition_reform: "Reforma de Aquisição Inteligente"
 ENG_smart_acquisition_reform_desc: "O Programa de Reforma de Aquisição de Defesa é implementado por completo. A análise de investimento inicial e a modelagem de custos ao longo da vida tornam-se obrigatórias, cortando modificações caras em fases tardias."
 ENG_dual_use_innovation: "Inovação de Uso Duplo"
 ENG_dual_use_innovation_desc: "Os mecanismos de transferência de tecnologia entre defesa e setor civil são formalizados, com empresas de eletrônica e comunicações contribuindo para os programas militares de C4ISR. Duas rodadas de subsídios à pesquisa em eletrônica são liberadas."
 ENG_naval_squeeze_efficiency: "Eficiência por Compressão Naval"
 ENG_naval_squeeze_efficiency_desc: "A Diretoria de Prontidão da Frota consolida os ciclos de manutenção em Rosyth, usando ferramental e mão de obra compartilhados para reduzir o custo por casco-mês. Uma nova instalação de estaleiro abre para absorver a carga de trabalho consolidada."
 ENG_minimum_viable_industrial_base: "Base Industrial Mínima Viável"
 ENG_minimum_viable_industrial_base_desc: "A Grã-Bretanha define o piso irredutível da capacidade de produção soberana. Abaixo desse piso, nenhum corte adicional é permitido. O compromisso estabiliza as expectativas da indústria e acalma a agitação trabalhista."
 ENG_strategic_reliance_doctrine: "Doutrina de Dependência Estratégica"
 ENG_strategic_reliance_doctrine_desc: "O Conselho de Segurança Nacional conclui que a dependência de aliados, principalmente dos Estados Unidos, é a postura de melhor custo-benefício para uma economia de médio porte. Os termos do Lend-Lease são permanentemente melhorados."
 ENG_industrial_realignment_idea: "Realinhamento Industrial de Defesa"
 ENG_industrial_realignment_idea_desc: "Recursos estão sendo redirecionados de linhas de produção civis para a de defesa. Fábricas que se reequipam para programas de armas soberanos reduzem temporariamente a produção civil."
 ENG_capability_gap_idea: "Lacuna de Capacidade"
 ENG_capability_gap_idea_desc: "O cancelamento de programas legados deixou as forças armadas sem sistemas de substituição. A prontidão operacional é reduzida até que as novas aquisições sejam concluídas."
 ENG_p125_revival: "Reativação do Programa P.125"
 ENG_p125_revival_desc: "A reativação do projeto P.125 revigorou a fabricação doméstica de caças, reduzindo o custo de produção de aeronaves leves enquanto o programa amadurece."
