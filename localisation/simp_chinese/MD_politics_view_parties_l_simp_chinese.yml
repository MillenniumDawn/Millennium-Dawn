 SIA.Nat_Autocracy_alt_desc: "（民族军国主义） - 人民国家力量党\n\n作为军方的政治工具，人民国家力量党主张加强军方在国内的影响力，并奉行以极右翼、民族主义和亲君主主义为核心的纲领，旨在服务于军政府的延续或实施。"
