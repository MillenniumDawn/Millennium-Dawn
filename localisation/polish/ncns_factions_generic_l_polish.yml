 joint_military_exercises_goal_desc: "Współczesne działania zbrojne wymagają interoperacyjności sił sojuszniczych. Dzięki wspólnym ćwiczeniom i osiągnięciu łącznego potencjału 100 w pełni wyposażonych dywizji, nasza frakcja demonstruje gotowość do reakcji na każde zagrożenie."
 economic_integration_goal_desc: "Silna gospodarka stanowi fundament każdego trwałego sojuszu. Zapewniając, by każde państwo członkowskie dysponowało co najmniej 15 fabrykami cywilnymi, budujemy bazę przemysłową niezbędną do osiągnięcia wspólnego dobrobytu i wzajemnej pomocy."
 technology_sharing_goal_desc: "Przewaga technologiczna stanowi czynnik zwielokrotniający siłę. Dzięki wspólnym programom badawczym i inwestycjom w infrastrukturę cyfrową nasza frakcja może wyprzedzić rywali i utrzymać pozycję lidera w każdej dziedzinie."
 regional_stability_goal_desc: "Siła sojuszu zależy od jego najsłabszego ogniwa. Utrzymując stabilność na poziomie powyżej 50% we wszystkich państwach członkowskich, tworzymy jednolity front, który odstrasza przed oportunistyczną agresją i wewnętrzną działalnością wywrotową."
 counter_terrorism_goal_desc: "Terroryzm nie zna granic. Utworzenie służb wywiadowczych w każdym państwie członkowskim tworzy sieć zdolną do wykrywania zagrożeń, zanim te się zmaterializują, chroniąc zarówno naszych obywateli, jak i nasze wspólne interesy."
 semiconductor_supremacy_goal_desc: "Produkcja mikroczipów to strategiczna gałąź przemysłu XXI wieku. Budując łącznie 50 fabryk mikroczipów na terenie naszej frakcji, zapewniamy sobie niezależność łańcucha dostaw oraz dominację technologiczną na nadchodzące dekady."
 strategic_resource_security_goal_desc: "Dostęp do kluczowych surowców stanowi fundament zarówno wzrostu gospodarczego, jak i gotowości militarnej. Nasza frakcja musi wspólnie wydobywać wystarczające ilości ropy, kauczuku i aluminium, aby żaden z jej członków nie był narażony na szantaż surowcowy."
 collective_cyber_defense_goal_desc: "W erze cyfrowej bezpieczeństwo kryptograficzne jest równie istotne, co fizyczne fortyfikacje. Zapewniając wszystkim państwom członkowskim dostęp do zaawansowanych możliwości szyfrowania, chronimy naszą łączność, dane wywiadowcze oraz infrastrukturę krytyczną."
 economic_powerhouse_goal_desc: "Potęga gospodarcza przekłada się bezpośrednio na wpływy geopolityczne. Gdy lider naszej frakcji osiągnie wysoki poziom PKB na mieszkańca, a każdy członek przekroczy wyznaczony próg bazowy, staniemy się blokiem gospodarczym, którego nie sposób ignorować."
 faction_gdp_per_capita_target_tt: "Lider frakcji, PKB na mieszkańca powyżej 15 i wszyscy członkowie powyżej 5"
 faction_economic_integration_idea: "Pakt Integracji Gospodarczej"
 faction_economic_integration_idea_desc: "Dzięki skoordynowanej polityce handlowej i ograniczeniu barier państwa członkowskie korzystają z lepszej współpracy gospodarczej i szybszego rozwoju."