 SIA_engage_reform_movement: "参与改革运动"
 SIA_engage_reform_movement_desc: "邀请学生联盟和改革派系坐到谈判桌前，资助青年就业计划，让镜头捕捉到握手的瞬间。街头随之平静下来。让运动参与其中也使其显得体面，前进党因此获益。"
 SIA_rural_development_package: "农村发展计划"
 SIA_rural_development_package_desc: "村庄基金、大米最低收购价、农业债务减免，以及通往区镇的新公路。国库拨出款项，就能换来一年乡村不再听信民粹机器的安宁。"
 SIA_rural_package_active: "农村发展计划"
 SIA_rural_package_active_desc: "村庄基金正在发放，最低收购价保持稳定，公路施工队也在作业。生活消费品系数略有上升，而当年乡村将由政府掌握。"
 SIA_palace_bargain: "达成宫廷交易"
 SIA_palace_bargain_desc: "以谈判解决政变。与其等待坦克，不如把宫殿和将领们本就会夺取的东西拱手相让。保皇派体制作为资深合伙人进入政府，我们党保留席位但失去主导地位，王国未发一枪便完成转向。"
 SIA_face_the_court: "面对宪法法院"
 SIA_face_the_court_desc: "将执政党的命运交由法官裁决，正如泰国二十年来所做的那样。与宫廷交易不同，这是一场由法院裁决的赌博，而非和解。要么接受解散并将权力拱手让给对手，要么以稳定和军队的耐心为代价违抗裁决。"
 SIA_pack_the_senate: "批发参议员"
 SIA_pack_the_senate_desc: "在参议院和独立机构内塞满效忠者，直到没有任何力量能制衡政府。法案在半年内畅通无阻地通过。但在将军们看来，这分明是一场明目张胆的权力攫取。"
 SIA_populist_trunk_entry_tt: "§Y[neutral_Social_L]§!是执政党。"
 SIA_royalist_trunk_entry_tt: "§Y[Nat_Autocracy_L]§!或§Y[Monarchist_L]§!是执政党。"
 SIA_democrat_trunk_entry_tt: "§Y[conservatism_L]§!是执政党。"
 SIA_telecom_excise_favor: "电信税费改革"
 SIA_telecom_excise_favor_desc: "将电信特许经营费转换为消费税，使得家族企业AIS保持领先地位，而将负担转嫁到新进企业。国库和心怀感激的企业界都会回报你。但军部会注意到，国家正为一家私利而运转。§R政变风险上升§!"
 SIA_exim_myanmar_loan: "对仰光贷款"
 SIA_exim_myanmar_loan_desc: "向缅甸军政府提供一笔条件宽松的国家贷款，而恰好，这笔贷款被指定用于购买他信家族旗下“新卫星”公司的卫星与电信服务。一项外交姿态，同时为家族企业带来一笔干净利落的合同。这是一桩将军们不会视而不见的教科书式利益冲突。§R政变风险上升§!"
 SIA_state_lottery_scheme: "政府博彩"
 SIA_state_lottery_scheme_desc: "将地下的数字赌博游戏纳入国家计划。一笔预算外的现金，可用于政治酬庸和心仪项目，深受赌客欢迎，也是每一份政变宣言中头一项就会列出的那种不受监管的资金来源。"
 SIA_democrat_machine_category: "政党机器"
 SIA_democrat_machine_category_desc: "民主党的优势在于组织架构，但他信的政治机器距离重新执政，始终只差一场农村压倒性胜利的距离。深入各个选区，稳住阵脚。\n\n§Y民粹浪潮§!：[?ROOT.SIA_pheu_thai_pressure|0]/100。该数值每周增长1点，在经济下行或稳定度下滑时加速攀升，而经济繁荣、国家安定也只能使其维持在原有水平。要将其压回，需要采取以下决议：建立依善桥头堡，或推行乡村发展计划。超过35点时，将影响稳定度与经济增长；超过70点时，代价将更加沉重。"
 SIA_constituency_machine: "经营选区"
 SIA_constituency_machine_desc: "将议员们派回各自的选区，让他们开设便民诊所、修缮排水系统、调解纠纷、记住每一个选民的名字。这是乏味的工作，却也是唯一能守住席位的方式。§Y民主党支持率上升§!，民粹浪潮得以缓解。"
 SIA_pt_pressure_increase_tt: "§R民粹浪潮 [?pt_delta|0+]§!（当前 §Y[?ROOT.SIA_pheu_thai_pressure|0]§!/100）"
 SIA_pt_pressure_decrease_tt: "§G民粹浪潮 [?pt_delta|0+]§!（当前§Y[?ROOT.SIA_pheu_thai_pressure|0]§!/100）"
 SIA_match_the_populists: "对抗民粹主义者"
 SIA_match_the_populists_desc: "既然无法击败乡村基金，那就建一个更好的。在民主党的旗帜下推行廉价医疗、债务减免和农村信贷。这会消耗国库，但也会从为泰党手中夺走这张牌。"
 SIA_expose_corruption: "揭露腐败网络"
 SIA_expose_corruption_desc: "调动反腐机构和法院，向民粹机器发起攻势——资产案件、贿选调查，以及那些已不止一次扳倒他信派政府的漫长司法战。"
 SIA_broaden_the_coalition: "扩大联盟"
 SIA_broaden_the_coalition_desc: "将部委职位分给各小党和地方豪强，以换取他们的议会席位。代价是一个纷争不断、充满权钱交易的内阁（§R联盟的诉求§!），但这也构建起一道任何单次民粹浪潮都无法突破的议会防火墙。§G民粹浪潮大幅退却。§!"
 SIA_counter_messaging: "反驳民粹主义言论"
 SIA_counter_messaging_desc: "在人们真正能听到的地方回应民粹主张——早间脱口秀、乡村广播塔、工会大厅。一次小幅推进，可重复执行，不断消磨为泰党的势头。"
 SIA_reconstruction_category: "开发已收复土地"
 SIA_reconstruction_category_desc: "在西线边疆或东盟霸权行动中夺取的领土，目前虽已掌控但尚未完成整合。对这些省份进行安抚，投入重建资金，待它们足够平静之后，便可正式将其纳入国家版图。"
 SIA_reconstruction_pacify: "安抚各省"
 SIA_reconstruction_pacify_desc: "在被占领的省份中大量派遣行政人员、安插线人并推行特赦计划。在我们控制但尚未整合的每一个省份，服从度都将提升。这是一项缓慢而耐心的工作，但它是其他一切建设的基础。"
 SIA_reconstruction_develop: "资助重建工程"
 SIA_reconstruction_develop_desc: "在收复的土地上发放用于道路、电力及公共工程的重建资金。所有控制省份的基础设施与建筑槽位均得到提升，将其纳入国家经济体系，并让民众在泰国统治下获得切身利益。"
 SIA_reconstruction_integrate: "宣布完成整合"
 SIA_reconstruction_integrate_desc: "当顺从度足够高时，占领结束，各省份成为泰国领土。我们控制的每一个平定的省份都会并入王国版图，这是任何和平会议都无法逆转的永久收益。"
 SIA_ghosts_5pct_tt: "§Y[Communist-State_L]§!拥有至少5%的支持率。"
 SIA_reform_5pct_tt: "§Y[socialism_L]§!拥有至少5%的支持率。"
 SIA_reform_trunk_entry_tt: "§Y[socialism_L]§!是执政党。"
 SIA_communist_trunk_entry_tt: "§Y[Communist-State_L]§!是执政党。"
 SIA_seize_power_gate_tt: "赢得总罢工，使政府投降，或者先投身武装斗争。"
 SIA_strike_momentum_tt: "§R罢工势头[?strike_delta|0+]§!（当前§Y[?ROOT.SIA_strike_momentum|0]§!/100）。达到100时政府将投降。"
 SIA_general_strike_category: "总罢工"
 SIA_general_strike_category_desc: "国家陷入停滞，运动正迫使政府下台。在180天期限结束前将罢工势头推进至100，政府将在和平夺权之路上投降。若未达标，军队将在政变中镇压罢工。\n\n§R罢工势头§!: [?ROOT.SIA_strike_momentum|0]/100"
 SIA_strike_mass_pickets: "大规模纠察队"
 SIA_strike_mass_pickets_desc: "将数万人推上纠察线，日复一日地占据广场。成本低廉、见效迅速——这股日常的街头力量，能让国家持续停摆，并不断推高压力。"
 SIA_strike_paralyze_transport: "瘫痪港口与铁路"
 SIA_strike_paralyze_transport_desc: "从罢工基金中拨款支持码头工人和铁路工人，直到国家的一切进出口交通完全停摆。这是我们运动所能施加的最重一击，也是维持起来代价最高的行动。"
 SIA_strike_win_the_conscripts: "赢取应征者"
 SIA_strike_win_the_conscripts_desc: "向军营派遣组织者。每一个不愿向自己人开枪的新兵，都是将军们无法依赖的变数，政府投降的日子就要临近了。"
