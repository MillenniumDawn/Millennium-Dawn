 USA_treason_event.11.o4: "Regardons à gauche, pourquoi pas"
 USA_treason_event.12.t: "République Réformée Gauche « 2008 »"
 USA_treason_event.12.d: "Bravo, vous avez battu le système — mais pour qui opter maintenant ? Les Verts écolos, les progressistes au ruban rose, et enfin les socialistes démocrates qui veulent importer la politique européenne en Amérique."
