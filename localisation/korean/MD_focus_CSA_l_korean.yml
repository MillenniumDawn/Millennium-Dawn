 CSA_decisions_war_time_mobilization_category: "전시 동원"
 CSA_decisions_war_time_mobilization_category_desc: "필요가 생기면 자원 군단을 소집하여 적어도 전선의 빈틈을 메울 수 있습니다. 전쟁이 언제 올지는 알 수 없지만, 반드시 닥치리라는 것은 알고 있기 때문입니다."
 CSA_war_time_mobilization: "1차 동원"
 CSA_war_time_mobilization_desc: "무기를 들라는 부름이 우리에게 닥쳤으며, 우리는 고향의 방어를 보장하기 위해 일어서야 합니다. 딕시의 젊은이들이여, 무기를 들어라!"
 CSA_war_second_wave_defenders: "2차 방어군"
 CSA_war_second_wave_defenders_desc: "적이 밀고 들어오고 있으므로, 또 한 차례의 방어군을 징집해야 합니다. 국가의 사기는 떨어지겠지만 병력이 필요합니다."
 CSA_war_desperate_defenders: "필사의 방어군"
 CSA_war_desperate_defenders_desc: "상황이 암울해지고 있으며, 전선을 지키기 위해 가용한 모든 인원이 필요합니다. 어쩌면, 정말 어쩌면, 아직 이길 수 있을지도 모릅니다."
 southern_republic_event.1.t: "수도 문제"
 southern_republic_event.1.d: "구 합중국의 \\"대폭동\\"의 여파 속에서, 많은 지방 주지사들이 새 공화국의 수도가 어디여야 하는지에 대한 독립적인 기구에 자신의 주를 최대한 매력적으로 보이게 하려고 분주합니다. 일부는 가능한 한 중앙에 위치해야 한다고 보아 미시시피의 메리디안 시를 최적의 선택지로 꼽습니다. 일부는 남부에서 가장 발달한 대도시권 중 하나인 애틀랜타만이 진정한 선택이라고 봅니다. 또 다른 이들은 역사적 상징성을 들어 찰스턴을 새 수도로 삼기를 원합니다. 어떤 선택이든, 더 시급한 문제들에 실제로 집중하려면 가능한 한 빨리 결정해야 합니다."
 southern_republic_event.1.o1: "방금 그런 일을 겪고 나서 미인 대회를 하고 있다니!?!"
 southern_republic_event.2.t: "위원회의 선택"
 southern_republic_event.2.d: "며칠에 걸친 논의와 자기 도시를 선택해 달라는 지방 관리들의 수많은 압력 끝에 위원회는 네 가지 뚜렷한 선택지를 내놓았습니다. 무역 중심지이자 해군 기구를 가진 뉴올리언스, 옛 남부 연합을 생각할 때 전략적으로 중앙에 위치한 미시시피의 메리디안. 그리고 남부에서 가장 발달한 대도시 거점으로 경제적으로나 통치 면에서 상식적인 선택인 애틀랜타가 있습니다. 마지막으로 찰스턴을 수도로 삼는 역사적 상징성이 있습니다. 찰스턴은 우파에게 호소력이 있을 뿐 아니라 갈수록 커지는 남부 정체성 운동에도 호소력이 있습니다. 어쨌든 위원회의 선택이 누가 무엇을 얻을지를 결정합니다."
 southern_republic_event.2.o1: "뉴올리언스가 애틀랜타를 이기는 것은 당연하다"
 southern_republic_event.2.o2: "딕시의 심장은 심장이어야 한다, 메리디안으로"
 southern_republic_event.2.o3: "애틀랜타만이 진정한 선택이다"
 southern_republic_event.2.o4: "우리의 역사가 곧 우리의 정체성이다, 찰스턴을 선택한다"
 southern_republic_event.3.t: "정치 극장"
 southern_republic_event.3.d: "남부 주들에는 자연재해에 맞먹을 만큼의 정치 파벌과 이념적 영향력이 자리 잡고 있습니다. 남부는 자연 그 자체의 재해뿐 아니라 정치적 극단의 과잉과 투쟁에 대해서도 걱정해야 합니다. 소규모 KKK 단원에서 사회주의 혁명가에 이르기까지, 지금까지 겨우 이룬 약간의 평화나마 누리려면 이 폭풍을 제대로 헤쳐 나가야 합니다."
 southern_republic_event.3.o1: "이 오합지졸은 위협이 아니다"
 southern_republic_event.3.o2: "누가 당선될 수 있는지 더 신중해야 한다"
 southern_republic_event.4.t: "안정적인 정당들"
 southern_republic_event.4.d: "정치 부흥의 여파 속에서, 누가 우리를 더 안정된 나라로 만들어 줄 수 있을지 살펴야 합니다. 극우와 극좌가 조롱하며 \\"온건파\\"라고 부르는 이들은 더 신중한 정당들임을 나타냅니다. 마라톤 같은 방식이 아니라 느긋한 산책이나 가벼운 조깅 속도로 변화를 추구하는 이들이므로, 이 정당들이 더 반항적인 성향의 다른 정당들보다 지지를 굳히도록 돕으려면 이들이 누구인지 정확히 파악해야 합니다."
 southern_republic_event.4.o1: "신중한 사람들이 있어 다행이다"
 southern_republic_event.5.t: "남부 보수당"
 southern_republic_event.5.d: "SCP는 \\"안정\\" 그룹 정당들의 큰 틀에서 상당히 온건한 정당입니다. 대체로 중도우파 정당으로서, 옛 민주당과 공화당, 그리고 그들의 온건파를 상기시키는 경향이 있습니다. 크고 빠른 변화보다 점진적인 변화를 선호하는 이 정당은, 변화가 필요하다면 민감한 주제에서 일어날 수 있는 요란한 분위기보다 더 숙고된 방식으로 다루도록 보장합니다. 사회 정책 면에서 변화는 늘 일어나고 있으나, 국가적 결속을 유지하기 위해 편안한 속도로 받아들여야 한다고 봅니다. 경제적으로는 규제 완화를 지지하지만 착취적 수단을 억제하기 위한 더 상식적인 규제에는 반대하지 않습니다."
 southern_republic_event.5.o1: "SCP가 평화를 가져온다"
 southern_republic_event.5.o2: "휘그당이 이길 것이다"
 southern_republic_event.5.o3: "PDP가 승리할 것이다"
 southern_republic_event.6.t: "딕시 휘그당"
 southern_republic_event.6.d: " WPD는 더 고전적인 자유주의 정당으로, 구파 자유주의 교리를 활용해 모두의 자유와 평등을 보장하는 안정적이고 진보하는 정부를 확보하는 것을 목표로 합니다. 기회 균등을 더 중시하는 WPD는 사회적으로 변화에 더 유연하지만, 문제가 먼저 주 및 지방 수준에서 제대로 다루어지지 않은 경우가 아니라면 정부 제재를 시행할 필요를 느끼지 않습니다. 경제적으로는 전반적인 규제를 신뢰하되 반독점, 혹은 더 일반적으로 반경쟁 관행 규제에 초점을 둡니다. 그러나 규제에 있어 이러한 \\"공정한 경기\\" 전략을 제외하면 WPD는 가능할 때마다 방임적 접근을 선호합니다."
 southern_republic_event.6.o1: "상식적인 규제는 상식에 맞는다"
 southern_republic_event.6.o2: "진정한 경쟁이 곧 진정한 기회다"
 southern_republic_event.6.o3: "경제 복합체는 반남부적이다"
 southern_republic_event.7.t: "진보 민주당"
 southern_republic_event.7.d: "PDP는 유럽의 대응 정당들처럼 더 전통적인 민주사회주의 정당으로, 민주주의의 힘을 활용해 국가 노동자들의 공정한 대우를 보장하고 온건한 사회주의를 도입하고자 합니다. 이는 사회적으로 투표 다수가 전통으로 지킬 가치가 있다고 믿는 것에 대해서만 전통적 가치를 유지하며 더 자유주의적이라는 뜻입니다. 경제적으로는 온건한 사회주의자로서, 규제의 힘으로 노동자들이 먹고 보살핌을 받게 하려 하며 국유화를 전적으로 지지하지는 않지만, 민간 부문이 지나치게 제멋대로 군다면 착취당하는 대중을 돕는 대안으로 배제하지는 않습니다."
 southern_republic_event.7.o1: "SCP가 남부의 안정을 보장한다"
 southern_republic_event.7.o2: "휘그당은 남부 스타일을 입을 것이다"
 southern_republic_event.7.o3: "PDP가 남부 사회주의를 만들 것이다"
 southern_republic_event.8.t: "딕시 연방화당"
 southern_republic_event.8.d: "FDP는 본질적으로 타협의 정당입니다. 연방의 연방 단일제 형태 정부와 훨씬 더 최소국가적인 남부 연합 정부 사이에서 만족스러운 중간 지점을 찾고자 하는 FDP는, 이 둘을 결합해 국가 전체에 평화와 질서를 유지하는 진지하고 아버지 같은 구조를 만들기를 원합니다. 사회적으로나 경제적으로나 방임적인 이 정당의 유일한 계획은 가장 가난한 지역에 중앙 자금과 서비스를 집중시켜 국가의 최하층이 나머지와 크게 뒤처지지 않도록 하는 것입니다. 많은 이들이 이를 유사 사회주의라고 맹비난하지만, FDP는 이른바 \\"존경받는 국가 의원들\\"이 정말로 유권자들을 얼마나 아끼는지, 아니면 자신들의 친구와 월급을 더 챙기는 것은 아닌지 되묻습니다."
 southern_republic_event.8.o1: "연방이라는 말은 모욕이 아니라 현실이다"
 southern_republic_event.8.o2: "SIP의 승리는 곧 남부의 승리다"
 southern_republic_event.8.o3: "SLP가 딕시를 해방할 것이다"
 southern_republic_event.9.t: "남부 정체성당"
 southern_republic_event.9.d: "SIP는 틈새 단일 쟁점 정당입니다. 사회적으로 더 무관심하여, 모든 주요 사회 문제를 전국적이 아니라 지역에서 처리하도록 합니다. 경제 면에서는 \\"고장 나지 않았으면 고치지 마라\\"는 식의 사고방식입니다. 즉 규제나 규제 완화를 시행하되, 국가 경제 안정에 진정한 문제로 인식될 때에 한합니다. 이른바 단일 쟁점으로는, SIP는 남부 정체성을 만들기 위한 현실적이고 구체적인 계획을 육성하고 보장하는 데 대부분의 관심을 쏟고 있습니다. 옛 남부 연합의 더 최소국가적인 견해와 그들의 스타일적 영감을 섞고, 지역 음식과 음악 문화를 남부 문화로 장려하는 방식입니다. 이 정당은 과거에서 벗어나 모두에게 진지하고 동등하게 남부적인 미래를 만들기를 원합니다."
 southern_republic_event.9.o1: "딕시를 해방하고 먹여 살리자"
 southern_republic_event.9.o2: "남부 사람들을 위한 남부 스타일"
 southern_republic_event.9.o3: "딕시의 가치를 위한 딕시의 자유"
 southern_republic_event.10.t: "남부 자유당"
 southern_republic_event.10.d: "SLP는 흥미로운 구성의 정당입니다. 옛 자유지상당의 잔재에 가까운 SLP는, 완전한 분권화를 돕기 위해 남부의 문화적, 정부적 가치와 자유지상주의적 색채를 타협적으로 결합하기로 했습니다. SLP 내 많은 이들은 자유지상주의 지지 혹은 정부 연합 지지로의 완전한 회귀가 연합 규약의 실패를 되풀이하는 확실한 길이라고 봅니다. 어쨌든 이 정당은 경제에 대한 정부 개입에 반대하며 사회적으로도 매우 방임적이며, 이러한 사안을 주 정부에 맡겨 지역 문제는 지역민이 처리하게 합니다. 다만 SLP는 국가의 최하층이 기회의 문을 걷어찰 수 있도록 어느 정도 발판을 갖게 하기 위해 복지와 의료 프로그램 같은 것을 두려워하지 않습니다."
 southern_republic_event.10.o1: "FDP는 통치를 이해한다"
 southern_republic_event.10.o2: "SIP가 진정한 남부 정부를 만들 것이다"
 southern_republic_event.10.o3: "남부의 자유가 곧 남부의 통치다"
 southern_republic_event.11.t: "변두리 정당들"
 southern_republic_event.11.d: "남부 공화국의 일반적인 오버턴 창 안에는, 애초에 정말 정치 정당이라 할 수 있는지 논쟁하는 이들도 있는 두 개의 뚜렷한 정당이 있습니다. 먼저 DDP, 즉 딕시 델타당이 있습니다. 철도 애호가였다가 초보 정치 지도자가 된 인물이 창당한 이 정당은 대중교통과 관련된 단일 쟁점 정당에 가까워 보입니다. 그러나 그들은 줄여서 PT라 부르는 대중교통 투자가 도시화와 국가 내 연결성에 있어 경제적 파급 효과를 낳을 것이라고 암시해 왔습니다. 한편 경제 번영당, 줄여서 PEP가 있습니다. 이 정당은 경제 발전에 초점을 맞추고 실질적인 경제 투자를 통해 국가의 수준을 끌어올린다고 자처합니다. 그들이 말하지 않는 것은 이 정당이 대규모 농업 자본과 온건한 농장주 계급 지지자들로 가득 차 있다는 점입니다. 어쨌든 PEP와 DDP 모두 그 자체로 흥미로운 세력으로 보이지만 토대를 흔들 만큼은 아닙니다."
 southern_republic_event.11.o1: "딕시의 개발자"
 southern_republic_event.11.o2: "딕시의 경제학자"
 southern_republic_event.100.t: "변화의 바람"
 southern_republic_event.100.d: "첫 선거를 앞두고, 국가의 상태는 많은 이들이 견디기에 너무 버거웠습니다. 그 결과 정치권 양쪽에서 급진주의가 고조되고 있습니다. 우파에서는 신남부연합주의자와 파시스트 등이, 좌파에서는 혁명 연합과 남부 공산주의 연합이 앞장서고 있습니다. 많은 이들은 누가 상대의 기세를 꺾을지 궁금해합니다. 당분간 파벌주의가 계속 심화된 결과는..."
 southern_republic_event.100.o1: "사회주의 선동가들이 노동력을 결집시킨다"
 southern_republic_event.100.o2: "완고한 역사적 자부심이 대중을 사로잡는다"
 southern_republic_event.101.t: "남부연합 정체성주의자들"
 southern_republic_event.101.d: "여론 조사에서 앞서 나가려 필사적인 남부연합 노동자당이 최근 남부 전통당의 도움을 구했습니다. 서로 상당히 반대되는 이 두 정당은 \\"남부연합의 꿈\\"이라는 원칙 아래 뭉쳤습니다. 정당한 남부를 세우고 옛 땅을 회복하기를 희망하는 이 정반대의 두 세력은, 신생 국가의 첫 선거 승리를 노린 도박에서 서로 끌린 듯합니다. 회복과 안정으로 가는 길에서 첫걸음이 가장 중요하기 때문입니다."
 southern_republic_event.101.o1: "통일 전선이 형성된다"
 southern_republic_event.101.o2: "농민 협회가 결성된다"
 southern_republic_event.102.t: "농본 사회"
 southern_republic_event.102.d: "주된 맞불이자 마찬가지로 절박한 혁명 연합당은 농본 연합당과 손잡는 것이 적절하다고 보았습니다. 이 둘이 함께하는 것은 완벽한 모순어법으로, 한쪽은 분명히 과두제적 대규모 농업 정당이고 다른 쪽은 볼 수 있는 한 가장 아나코공산주의에 가까운 정당이기 때문입니다. 하지만 절박한 시기에는 절박한 수단이 필요합니다. 두 정당 모두 안정되고 자족적인 사회의 진정한 기둥은 농본 사회라고 믿습니다. 단순한 조직과 대부분의 생산 노력, 조직된 노동이 식량 생산을 향하는 것이며, 삶 자체의 기본 토대를 줌으로써 사회를 빚어내는 데 이보다 좋은 방법이 있겠습니까. 어쨌든 선거가 점점 다가오며 분위기가 달아오르고 있는 만큼 이들은 강하게 밀어붙여야 합니다."
 southern_republic_event.102.o1: "남부연합 전선이 여론 조사에서 앞서간다"
 southern_republic_event.102.o2: "배불리 먹이겠다는 약속이 약속답게 성과를 내고 있다"
 southern_republic_event.200.t: "우파의 결집"
 southern_republic_event.200.d: "최근 국가 정서의 변화로 많은 이들이 우익 정당들에 가까워지고 있습니다. 이는 국가의 역사를 고려할 때 온건파와 좌파를 크게 우려하게 만듭니다. 결국 딕시 퍼스트당과 남부 연맹이 딕시 순혈 연맹 아래 하나가 되면서 우려는 정점에 달했습니다. 많은 지역민들은 이 연맹이 만들어 낼 낡은 사회 개혁의 후퇴를 두려워하고 있으며, 이는 이미 국외로의 꾸준한 이주를 낳았습니다. 신남부연합주의자와 파시스트가 뭉칠 것이라는 두려움 속에서, 많은 이들이 그 세력의 선거 승리를 막을 현실적인 대안을 찾고 있습니다."
 southern_republic_event.200.o1: "국가는 순혈을 갈망한다"
 southern_republic_event.200.o2: "잠재적 이주민들이 앞다투어 입대한다"
 southern_republic_event.201.t: "입대 증가가 낳은 반민족주의"
 southern_republic_event.201.d: "\\"극우\\"의 결집과 함께, 반대 민족주의자들이 그들에게 선언하고 조소하는 가운데, 그러한 정책의 표적이 될 많은 이들이 입대하기 시작했고 그 결과 군의 정치적 영향력이 갈수록 큰 힘을 발휘하게 되었습니다. 이에 '메리디안 가문'으로 알려진 현대 군주주의 운동이 군대와 손잡고 반민족주의 운동을 결집시켰습니다. 많은 이들은 우리가 이 길로 가야 한다면 적어도 국가에 대한 의무가 파시스트나 극단적 민족주의 지도부의 그 어떤 것보다 낫기를 바랍니다."
 southern_republic_event.201.o1: "극우 세력이 계속 싸운다"
 southern_republic_event.201.o2: "\\"왕립\\" 군대라니, 재미있겠군"
 southern_republic_event.12.t: "남부의 요구"
 southern_republic_event.12.d: "서쪽의 이웃이 우리의 복속을 요구했습니다. 이른바 약속은 텍사스 주의 독립을 남부 국가 내의 연방 동반자로서 본뜬다는 것입니다. 그들의 최종 목표가 무엇인지는 알 수 없으나, 우리가 이러한 요구를 진지하게 거절할 수 있는지는 군에 대한 우리 자신의 신뢰에 달려 있습니다."
 southern_republic_event.12.o1: "우리는 텍사스인이 먼저, 그리고 오직 텍사스인뿐이다!"
 southern_republic_event.12.o2: "시간이 더 있었더라면... 동의한다."
 southern_republic_event.13.t: "텍사스의 거절"
 southern_republic_event.13.d: "텍사스 국가는 우리의 너그러운 제안을 거절했으며, 이제 공은 우리에게 넘어왔습니다. 전면적인 분쟁과 그것이 번질 가능성을 감수할 수도 있고, 물러설 수도 있습니다. 둘 다 가능한 선택지이지만, 한쪽이 분명 더 위험이 큽니다."
 southern_republic_event.13.o1: "싸움에서 물러서는 남부인은 없다"
 southern_republic_event.13.o2: "어쩌면 우리가 조금 서둘렀는지도 모른다"
 southern_republic_event.14.t: "우리 제안을 수락한 텍사스"
 southern_republic_event.14.d: "그들의 수락으로 이제 우리는 지역 단결이라는 진정한 목표에 도달하기 위해 통일 전선으로 나아갈 수 있습니다. 물론 이 새로운 일종의 연합에 불안해하는 이들도 있겠지만, 적어도 시작입니다."
 southern_republic_event.14.o1: "얼씨구나, 진짜 먹혔다!"
 southern_republic_event.15.t: "남부의 제안"
 southern_republic_event.15.d: "남부 국가가 연방 형태의 연합이 될 것을 제안해 왔습니다. 공정한 자치를 약속하지만, 주된 목표는 새로운 지역 연합 속에서 외교 정책 면에서 단결하는 것입니다. 이는 \\"존재하지 않는다\\"는 명분으로 우리의 국제 제재를 무효화할 수 있으므로 우리 상황에 매우 유리할 수 있습니다. 그러나 우리를 이용하려는 술책일 수도 있으니, 어느 쪽이든 대응해야 합니다."
 southern_republic_event.15.o1: "우리는 아무에게나 굴복하지 않는다"
 southern_republic_event.15.o2: "제재가 사라지는 건 마음에 든다, 좋다 동의한다"
 southern_republic_event.16.t: "우리를 거절한 쿠바"
 southern_republic_event.16.d: "쿠바인들이 우리의 요구를 거부했으며, 이제 해전과 침공군 편성을 통해 장기전을 감수할 것인지가 문제입니다. 우리는 할 수 있는 것을 하겠지만, 그 가치보다 더 큰 대가가 될 수도 있습니다."
 southern_republic_event.16.o1: "전쟁에 나선다!"
 southern_republic_event.16.o2: "지금은 감당할 수 없다"
 southern_republic_event.17.t: "우리 제안을 수락한 쿠바"
 southern_republic_event.17.d: "쿠바 대표단이 우리의 제안을 수락했으며, 우리는 가까운 미래에 공정하고 안정적인 연합을 만들기 위한 통합 법률과 기준을 시작할 것입니다."
 southern_republic_event.17.o1: "술은 내가 산다!"
 southern_republic_event.18.t: "남부의 요구"
 southern_republic_event.18.d: "남부 국가가 우리를 더 큰 카리브해 연방 형태 연합에 복속시킬 것을 요구했습니다. 우리는 독특한 위치에 있는데, 상대국이 더 크지만 침공군에 대비할 수 있을 만큼 상당히 멀리 떨어져 있기 때문입니다. 하지만 그런 분쟁을 정말로 감수해야 하는지는 불투명합니다."
 southern_republic_event.18.o1: "우리는 굴복하지 않는다!"
 southern_republic_event.18.o2: "우리 시민의 목숨을 낭비할 수 없다"
 southern_republic_event.19.t: "아이티의 거절"
 southern_republic_event.19.d: "국가의 오점이 우리의 요구를 거절했으며, 이제 행동에 나서든 입을 다물든 해야 합니다. 외교 상황은 다소 긴장되어 있으며, 이성과 힘 중 무엇이 이길지 결정할 때입니다."
 southern_republic_event.19.o1: "의지의 힘이 승리한다"
 southern_republic_event.19.o2: "우리는 이 위험을 감수할 수 없다"
 southern_republic_event.20.t: "아이티의 수락"
 southern_republic_event.20.d: "그들은 우리의 요구를 받아들였으며 우리는 준비에 착수할 것입니다. 오늘은 우리나라에 좋은 날입니다."
 southern_republic_event.20.o1: "또 한 걸음 전진"
 southern_republic_event.21.t: "남부의 요구"
 southern_republic_event.21.d: "남부 국가가 우리를 더 큰 카리브해 연방 형태 연합에 복속시킬 것을 요구했습니다. 우리는 독특한 위치에 있는데, 상대국이 더 크지만 침공군에 대비할 수 있을 만큼 상당히 멀리 떨어져 있기 때문입니다. 하지만 그런 분쟁을 정말로 감수해야 하는지는 불투명합니다."
 southern_republic_event.21.o1: "우리는 굴복하지 않는다!"
 southern_republic_event.21.o2: "우리 시민의 목숨을 낭비할 수 없다"
 southern_republic_event.22.t: "도미니카 공화국의 거절"
 southern_republic_event.22.d: "국가의 오점이 우리의 요구를 거절했으며, 이제 행동에 나서든 입을 다물든 해야 합니다. 외교 상황은 다소 긴장되어 있으며, 이성과 힘 중 무엇이 이길지 결정할 때입니다."
 southern_republic_event.22.o1: "의지의 힘이 승리한다"
 southern_republic_event.22.o2: "우리는 이 위험을 감수할 수 없다"
 southern_republic_event.23.t: "도미니카 공화국의 수락"
 southern_republic_event.23.d: "그들은 우리의 요구를 받아들였으며 우리는 준비에 착수할 것입니다. 오늘은 우리나라에 좋은 날입니다."
 southern_republic_event.23.o1: "또 한 걸음 전진"
 southern_republic_event.24.t: "남부의 거래"
 southern_republic_event.24.d: "남부 국가가 우리에게 거래를 제안해 왔습니다. 연방 형태의 연합을 구성하는 대가로, 우리 섬들이 극단적인 기상 현상으로 피해를 입을 경우 물자 혹은 금전적 지원을 제공받게 됩니다. 이는 분명 재정적 부담을 덜어 주겠지만 함정일 수도 있습니다. 그렇다고 거절하면 우리가 얻는 것은 무엇일까... 어떻게 해야 할까요."
 southern_republic_event.24.o1: "지금은 받아들일 수 없다"
 southern_republic_event.24.o2: "이런 거래를 놓칠 수는 없다"
 southern_republic_event.25.t: "바하마의 거절"
 southern_republic_event.25.d: "바하마 정부 대표들이 우리의 지나치게 후한 제안을 거절했습니다. 우리는 이를 명분으로 삼을 수도 있고, 다른 방법을 찾을 수도 있습니다. 어느 쪽이든 외교 정책 목표를 놓치지 않으려면 곧 결정을 내려야 합니다."
 southern_republic_event.25.o1: "될 대로 되라, 선전포고한다"
 southern_republic_event.25.o2: "다시 접근해야 한다"
 southern_republic_event.26.t: "바하마의 수락"
 southern_republic_event.26.d: "그들은 우리의 요구를 받아들였으며 우리는 준비에 착수할 것입니다. 오늘은 우리 지역 연합을 향한 또 한 걸음입니다."
 southern_republic_event.26.o1: "섬이 정말 많다"
 southern_republic_event.27.t: "남부의 양보안"
 southern_republic_event.27.d: "남부 국가가 우리에게 제안을 해 왔습니다. 우리의 카리브해 영토를 매각하는 대가로 1000억을 지급하겠다는 것입니다. 이 섬들은 일종의 지정학적 목적에 기여하지만, 대체로 자원을 소모시키는 경향이 있습니다. 따라서 선택은 돈이 필요한가, 아니면 이 섬들이 필요한가입니다."
 southern_republic_event.27.o1: "돈이 필요하다"
 southern_republic_event.27.o2: "그 섬들은 영국 것이다!"
 southern_republic_event.28.t: "영국의 수락"
 southern_republic_event.28.d: "영국이 카리브해 섬들을 획득하려는 우리의 양보안을 수락했으며, 따라서 이 섬들의 통합은 비교적 간단한 일이 될 것입니다."
 southern_republic_event.28.o1: "그만한 가치가 충분하다"
 southern_republic_event.29.t: "영국의 거절"
 southern_republic_event.29.d: "빌어먹을 앵글로인들이 우리의 지나치게 후한 제안을 거절했습니다. 문제는 현재 외교적 사건을 감당할 여력이 없다는 점이며, 따라서 훗날을 위해 다시 접근해야 할 것입니다."
 southern_republic_event.29.o1: "젠장, 전부 망했군"
 southern_republic_event.30.t: "남부의 양보안"
 southern_republic_event.30.d: "남부 국가가 우리에게 제안을 해 왔습니다. 우리의 카리브해 영토를 매각하는 대가로 500억을 지급하겠다는 것입니다. 이 섬들은 일종의 지정학적 목적에 기여하지만, 대체로 자원을 소모시키는 경향이 있습니다. 따라서 선택은 돈이 필요한가, 아니면 이 섬들이 필요한가입니다."
 southern_republic_event.30.o1: "돈이 필요하다"
 southern_republic_event.30.o2: "그 섬들은 프랑스령으로 남을 것이다!"
 southern_republic_event.31.t: "프랑스의 수락"
 southern_republic_event.31.d: "프랑스가 카리브해 섬들을 획득하려는 우리의 양보안을 수락했으며, 따라서 이 섬들의 통합은 비교적 간단한 일이 될 것입니다."
 southern_republic_event.31.o1: "그만한 가치가 충분하다"
 southern_republic_event.32.t: "프랑스의 거절"
 southern_republic_event.32.d: "빌어먹을 프랑스어권 놈들이 우리의 지나치게 후한 제안을 거절했습니다. 문제는 현재 외교적 사건을 감당할 여력이 없다는 점이며, 따라서 훗날을 위해 다시 접근해야 할 것입니다."
 southern_republic_event.32.o1: "개구리 놈들!"
 southern_republic_event.33.t: "남부의 거래"
 southern_republic_event.33.d: "남부 국가가 우리에게 제안을 해 왔습니다. 우리의 카리브해 영토를 매각하는 대가로 250억을 지급하겠다는 것입니다. 이 섬들은 일종의 지정학적 목적에 기여하지만, 대체로 자원을 소모시키는 경향이 있습니다. 따라서 선택은 돈이 필요한가, 아니면 이 섬들이 필요한가입니다."
 southern_republic_event.33.o1: "돈이 필요하다"
 southern_republic_event.33.o2: "네덜란드 섬은 네덜란드 국민의 것이다!"
 southern_republic_event.34.t: "네덜란드의 수락"
 southern_republic_event.34.d: "네덜란드가 카리브해 섬들을 획득하려는 우리의 양보안을 수락했으며, 따라서 이 섬들의 통합은 비교적 간단한 일이 될 것입니다."
 southern_republic_event.34.o1: "그만한 가치가 충분하다"
 southern_republic_event.35.t: "네덜란드의 거절"
 southern_republic_event.35.d: "빌어먹을 나막신 놈들이 우리의 꽤 후한 제안을 거절했습니다. 문제는 현재 외교적 사건을 감당할 여력이 없다는 점이며, 따라서 훗날을 위해 이 문제에 접근해야 할 것입니다."
 southern_republic_event.35.o1: "젠장!"
 southern_republic_event.36.t: "수도 논쟁"
 southern_republic_event.36.d: "옛 공화국의 문제 중 하나는 옛 수도인 워싱턴 D.C.가 국가 대다수에게 너무 멀게 여겨졌다는 점이었습니다. 그러나 그 상징성도 무시할 수 없습니다. 따라서 새 수도를 어디에 둘지 정확히 정해야 합니다."
 southern_republic_event.36.o1: "D.C.도 충분히 괜찮았다"
 southern_republic_event.36.o2: "뉴 알링턴 계획이 좋다"
 southern_republic_event.36.o3: "마운트 컬럼비아는 충분히 중앙이다"
 southern_republic_event.36.o4: "율리시스도 괜찮을 것이다"
 southern_republic_event.37.t: "새로운 전진의 길"
 southern_republic_event.37.d: "정책이 확정되고 영향력이 확보된 지금, 우리는 나라의 새로운 모습을 선택하는 영예를 얻게 되었습니다. 물론 국명을 아메리카 연합국으로 바꾸는 데에는 합의가 이루어졌는데, 우리의 과거와 기원에 경의를 표하는 것이 마땅하기 때문입니다. 하지만 이제 문제는 깃발입니다. 딕시 퍼스트당 당원들은 버지니아 전투기를 쓰되, 우리의 위대한 남부연합이 버지니아 귀족층의 깍쟁이들만의 것이 아니므로 단순한 버지니아 전투기가 되지 않도록 색 배합을 바꾸자고 합니다. 그러나 남부 연맹 당원들은 한 걸음 더 나아가, 당원들이 한동안 사용해 온 깃발, 즉 별이 없고 중앙에 흰 원과 그 한가운데 커다란 번개 하나가 있는 단순한 버지니아 전투기를 쓰기를 원합니다. 후자는 정치적 호소력 면에서 너무 노골적이지 않느냐는 의견도 있습니다. 하지만 오히려 충분히 나아가지 못한 것이 아니냐는 의견은 더 많습니다. 결국 이 땅은 진정 우리의 땅이니까요."
 southern_republic_event.37.o1: "바뀐 색 배합이 좋다"
 southern_republic_event.37.o2: "번개가 적들에게 공포를 안길 것이다"
 southern_republic_event.38.t: "새로운 국가 표준"
 southern_republic_event.38.d: "국가 대부분이 우리의 운영 방식에 동의하는 가운데, 우리나라가 정말로 스스로를 대변하는지에 대한 전반적인 논쟁이 벌어지고 있습니다. 좌파의 다수는 국가 노동자들과의 연대라는 선례를 세우기 위해 사회주의 상징으로 깃발을 재정비하기를 원합니다. 반면 우파는 남부연합이 자신을 대표했던 마지막 깃발 중 하나를 다시 도입하여 우리나라의 기원을 더 상징적으로 되살리기를 원합니다. 이 깃발은 흰 바탕에 오른쪽에 붉은 막대가 있고 왼쪽 위 모서리에 버지니아 전투기가 놓인 옛 '피의 얼룩 깃발'입니다. 이와 함께 국명도 단순히 딕시 공화국으로 바꿔야 한다고 봅니다. 그러나 이에 대한 결정은 대중에게 달려 있습니다."
 southern_republic_event.38.o1: "사회주의 공화국으로 가자"
 southern_republic_event.38.o2: "우리는 딕시 공화국이다"
 southern_republic_event.39.t: "앞으로 나아가며"
 southern_republic_event.39.d: "분별력을 갖추고 국민이 새로 얻은 국가적 자긍심을 누리는 가운데, 이들은 좋은 일이든 나쁜 일이든 우리의 역사에 경의를 표하면서도 단결을 보여 주는 개혁을 원하고 있습니다. 따라서 이후 우리는 남부 연방이라 불리며 보니 블루 깃발을 자랑스럽게 게양할 것입니다."
 southern_republic_event.39.o1: "정말로 남부의 가족이다"
 southern_republic_event.40.t: "옛 버릇 어디 가나, 참"
 southern_republic_event.40.d: "우리의 방식이 정해지고 국민이 새로 찾은 목적에 만족하는 지금이 새로운 깃발과 이름을 내걸 적절한 때라고 생각합니다. 언젠가 그 영예를 되찾을 수도 있을 것입니다. 하지만 흔히 말하듯, 오래된 버릇은 쉽게 죽지 않습니다."
 southern_republic_event.40.o1: "언젠가는 어쩌면"
 southern_republic_event.41.t: "아르카디아의 꿈"
 southern_republic_event.41.d: "오늘 새로운 시대가 시작됩니다. 새로운 정체성과 단결의 새로운 길, 그리고 번영의 새 시대가 우리에게 닥쳐옵니다. 오늘 우리는 아르카디아 민족이 됩니다."
 southern_republic_event.41.o1: "아르카디아를 위하여!!!"
 southern_republic_event.42.t: "아르카디아 수도 논쟁"
 southern_republic_event.42.d: "신생 국가가 일어서고 새로운 장이 열립니다. 수도는 어디에 두어야 할까요."
 southern_republic_event.42.o1: "믿음직한 옛 도시로 간다"
 southern_republic_event.42.o2: "적당한 중앙의 수도가 가장 낫다"
 southern_republic_event.43.t: "민족주의자의 저항"
 southern_republic_event.43.d: "우리나라의 첫 선거에서 정당한 승리를 거둔 며칠 뒤, 플로리다 오지의 촌뜨기와 술주정뱅이들이 입에서 구토뿐 아니라 그 이상의 것을 내뱉기 시작했습니다. 이것에서 실제로 무언가가 나올 것이라고는 기대하지 않지만, \\"플로리다 남자\\"가 정말 얼마나 어리석은지 궁금해하는 이들이 많습니다."
 southern_republic_event.43.o1: "세상에, 또 이 지랄이라니"
 southern_republic_event.44.t: "커져가는 불안"
 southern_republic_event.44.d: "주 지위 \\"선포\\"라는 것이 있은 뒤로 플로리다주의 선동은 지난 며칠 사이 꾸준히 거세졌습니다. 이러한 확산으로 인해 우리의 젊은 국가가 머지않아 연방 정부나 오대호 세력, 심지어 텍사스인들과도 아닌, 우리 자국민과의 전쟁에 휘말리게 되지 않을까 하는 우려가 커지고 있습니다. 이 슬픈 현실을 깨달은 결과, 앞으로 며칠 안에 발생할 수 있는 어떤 문제에든 앞서 대비하기 위해 군수 생산을 선제적으로 확대하였습니다."
 southern_republic_event.44.o1: "신이시여, 우리 모두를 도우소서..."
 southern_republic_event.45.t: "집안싸움"
 southern_republic_event.45.d: "결국 일을 저질렀습니다. 빌어먹을 플로리다 놈들은 문제를 풀어 보려는 것이 도저히 못 해 먹을 짓이라고 판단한 모양입니다. 좋습니다, 여기서 지금 당장 끝장을 내고 플로리다를 다시 남부로 만들 것입니다. 동원령을 내리고 우리가 가진 병력을 국경으로 보내야 합니다."
 southern_republic_event.45.o1: "용광로라더니 뇌가 녹아내린 꼴이로군"
 southern_republic_event.46.t: "전쟁"
 southern_republic_event.46.d: "때가 되었습니다. 우리는 마땅히 우리의 것인 땅을 되찾을 것입니다."
 southern_republic_event.46.o1: "병력을 투입하라!"
 southern_republic_event.1000.t: "우리의 자유를 지켜라"
 southern_republic_event.1000.d: "사회주의 쓰레기들은 우리를 마르크스주의와 가난의 삶에 예속시키려 합니다. 하지만 더는 안 됩니다. 사슬을 끊고 여러분의 자유를 위해 싸우십시오!!!"
 southern_republic_event.1000.o1: "우리의 태양이 그 무엇보다 밝게 빛나리라!"
 CSA_event_native_exodus.1.t: "오클라호마의 소문"
 CSA_event_native_exodus.1.d: "우리가 나라를 정비하려 애쓰는 가운데, 오클라호마 먼 오지에서 원주민들이 가능한 때와 장소에서 떠나려 한다는 소문이 들려오고 있습니다. \\"남부\\" 국가라는 위협과 낙인은 여전히 상당히 강하게 울리고 있는데, 대부분의 원주민이 특정 구역에 몰려 살도록 강제되었던 점을 생각하면 놀랄 일도 아닙니다. 우리가 할 수 있는 일은 많지 않으며, 훗날 이것이 문제를 일으키지 않기를 바랄 뿐입니다."
 CSA_event_native_exodus.1.o1: "잠깐, 그들이 떠나면 우리가 그걸 공짜로 얻게 되는 건가?"
 CSA_event_native_exodus.2.t: "늘어나는 이주"
 CSA_event_native_exodus.2.d: "우리가 국가 통제력을 계속 공고히 하는 동안, \\"인디언 준주\\"라고만 불리는 오클라호마의 거대 보호구역에서 더욱 많은 원주민이 캔자스를 향해 북쪽으로 이주 운동을 조직해 왔습니다. 그렇게 많은 사람을 잃는 것은 슬픈 일이지만, 그만큼 재통합 노력과 해당 주의 경제 재가동이 전반적으로 훨씬 수월해질 것이라는 뜻이기도 합니다."
 CSA_event_native_exodus.2.o1: "떠나는 숫자를 우려해야 하는 것 아닌가?"
 CSA_event_native_exodus.3.t: "이주인가, 탈출인가?"
 CSA_event_native_exodus.3.d: "오클라호마에서 캔자스로 향하는 이러한 이주 흐름을 조직한 주체가 '회복 전선'이라는 단체라는 소식이 또 들어왔습니다. 현지 보고에 따르면 캔자스는 라코타 공화국이라는 새로운 정부 기구의 관할 아래 있다고는 하나, 새 수도를 둘러싼 논쟁과 재건이 우선 과제인 탓에 실질적인 노력은 대부분 북부 4개 주에 쏟아지고 있다고 합니다. 회복 전선은 캔자스가 다른 \\"식민 지배 국가들\\"로부터 떨어진 좋은 새 보금자리이며, '여섯 부족 위원회'(단체 지도부이자 거대 보호구역을 이루던 여섯 부족을 가리키는 말)가 캔자스를 필요하다면 우리가 영유권을 주장할 수 있는 더 적합하고 안정된 터전이라고 판단했다고 주장합니다. 더 많은 정보를 얻으려 하고 있지만, 이 이른바 회복 전선은 우리와 싸우기보다는 라코타 공화국이 더 상대하기 쉽다고 보고 캔자스를 자신들의 진정한 유일한 고향으로 삼으려는 것으로 보입니다."
 CSA_event_native_exodus.3.o1: "그들에게 알려 줘야 한다고 생각하나? 에이, 아니지"
 CSA_event_native_exodus.4.t: "도대체 몇 명이나 있었던 거지???"
 CSA_event_native_exodus.4.d: "오클라호마에서 이주한 인원이 최고치에 이르렀다는 소식이 또 들어왔습니다. 대규모 이주로 인해 인구가 약 7퍼센트 줄어든 것으로 추산되자, 많은 이들이 이 주의 인구에서 원주민이 실제로 얼마나 되었는지 의아해하고 있습니다. 그 수가 얼마든 캔자스의 그들에게 신의 가호가 있기를 바랍니다. 현지인들이 어떤 말썽을 부리고 있을지 누가 알겠습니까."
 CSA_event_native_exodus.4.o1: "이제 우리 문제가 아니라니 천만다행이군"
 CSA_event_native_exodus.5.t: "새로운 번영"
 CSA_event_native_exodus.5.d: "이주 인원이 사실상 멈춰 가면서 우리에게는 비워진 토지와 사업체 등이 많이 남았습니다. 따라서 이러한 토지 등을 정비하여 이 주가 아직 겪어 보지 못한 새로운 번영을 일으키는 데 쓸 수 있습니다. 이 다행스러운 사태 전환을 불러온 경위를 생각하면, 그 번영을 지켜 낼 수 있기만을 바랍니다."
 CSA_event_native_exodus.5.o1: "자, 이제 어쩌지?"
 CSA_event_native_exodus.1001.t: "이제 무슨 일이지?"
 CSA_event_native_exodus.1001.d: "새 수도를 둘러싼 논쟁이 계속되는 가운데, 남쪽에서 몇 가지 소문이 우리에게 닿기 시작했습니다. 점점 불어나는 원주민 아메리카인들이 오클라호마를 떠나 캔자스에 정착하고 있다고 합니다. 그 이유나 여기에 문제가 있는지는 알 수 없으나, 지금으로서는 문제가 아니라는 점만은 분명합니다."
 CSA_event_native_exodus.1001.o1: "문제가 되거든 그때 다시 와 주시오"
 CSA_event_native_exodus.1002.t: "또다시, 진짜로"
 CSA_event_native_exodus.1002.d: "캔자스에서 또 소식이 들어왔습니다. 더 많은 원주민이 캔자스로 넘어갔고 그 결과 개발 잠재력이 간접적으로 높아졌다고 합니다. 솔직히 나쁜 일로 들리지는 않습니다."
 CSA_event_native_exodus.1002.o1: "다시 돌아온 이유라도 있나?"
 CSA_event_native_exodus.1003.t: "맙소사, 이번엔 또 뭔가?"
 CSA_event_native_exodus.1003.d: "캔자스에서 또 소식이 나왔는데, 회복 전선이라는 단체가 캔자스주의 재건과 성장을 돕겠다는 의사를 밝혔습니다. 이는 우리 권위에 대한 가벼운 도전으로 보이지만, 그토록 빈약한 주이고 우리가 국가 대부분에 대한 통제를 공고히 하고 있는 만큼 이 선동꾼들을 진지하게 우려할 이유는 없습니다."
 CSA_event_native_exodus.1003.o1: "이제 내 일에 집중해도 되겠습니까?"
 CSA_event_native_exodus.1004.t: "그래서?"
 CSA_event_native_exodus.1004.d: "캔자스 지도부는 회복 전선이 주 재건을 돕도록 허용해 준 데 대해 감사를 표했으며, 전반적으로 상황은 꽤 평화로웠고 당분간 그럴 것으로 보입니다. 그러나 북부의 많은 이들은 그런 뜻밖의 친절이 단지 \\"선의\\"로 생기는 법은 없다며 경계하고 있습니다. 우리는 곧 대표단을 보내 우리가 무엇을 상대하고 있는 것인지 알아낼 것입니다."
 CSA_event_native_exodus.1004.o1: "감사관들을 보내라"
 CSA_focus_havana_help: "아바나 지원"
 CSA_focus_havana_help_desc: "카리브해의 가장 큰 행위자는 쿠바입니다. 다른 나라들과 어떤 성과라도 내려면 이 \\"큰손\\"을 확보해야 합니다. 필요하다면 전쟁도 불사하겠지만, 전쟁을 피할 수 있다면 지도상의 다른 작은 점들과의 전쟁을 아낄 수 있습니다."
 CSA_focus_bahaman_bargain: "바하마 흥정"
 CSA_focus_bahaman_bargain_desc: "바하마를 이루는 흩어진 섬들은 매년 닥치는 허리케인으로 인한 파괴의 위험에 끊임없이 노출되어 있습니다. 우리의 가장 큰 협상 카드는 연방 형태의 연합으로 뭉친다면 이 섬들과 주민들에게 금전적, 물질적 지원을 제공할 수 있다는 점입니다. 물론 결정은 그들에게 달렸지만, 결국에는 방법을 찾게 될 것입니다."
 CSA_focus_bahama_blast: "바하마 폭풍"
 CSA_focus_bahama_blast_desc: "이 흩어진 섬들은 걸프 연안에서 벌어질 미래 전쟁 계획을 위한 완벽한 훈련장이 될 것입니다. 그러니 경험을 쌓읍시다. 어차피 이들은 거래를 맺을 만한 의미 있는 위치에 있지도 않습니다."
 CSA_focus_gran_colombian_sub_regionalism: "대콜롬비아 하위 지역주의"
 CSA_focus_gran_colombian_sub_regionalism_desc: "연방 형태의 연합 내에 일종의 하위 지역을 만들면 우리의 새로운 지역 강국에 환원되는 지역 결속을 더 키울 수 있습니다. 전반적으로 우리는 정체성을 통한 단결의 토대를 마련하고자 합니다. 이 나라들과 하위 지역들은 한때 자랑스럽고 훌륭한 국민 국가였으며, 이를 인정하고 포용하는 것이 우리가 하나로서 함께 제대로 나아가기 위한 우리의 임무입니다."
 CSA_arcadia_path_desc: "[CSA.GetFlag]§Y아메리카 남부 공화국§!의 명칭이 §Y아르카디아§!로 바뀝니다"
 CSA_rallying_dixies_defenders: "딕시의 수호자 소집"
 CSA_rallying_dixies_defenders_desc: "모여라, 젊은이들이여! 적이 어디를 치든 응징해야 한다."
 CSA_creating_infantry_reserves: "예비대 편성"
 CSA_creating_infantry_reserves_desc: "즉응 예비대를 편성하면 적의 어떤 침공이나 앞으로 계획할 수 있는 어떤 일에도 선제적으로 대비할 수 있습니다."
 CSA_mobilizing_the_reserves: "예비대 소집"
 CSA_mobilizing_the_reserves_desc: "모여라, 젊은이들이여, 조국이 그대들을 필요로 한다. 북부나 서부 놈들이 감히 무엇을 던지든 맞서 준비하도록 하자!"
 CSA_focus_soldiers_of_nature: "자연의 병사들"
 CSA_focus_soldiers_of_nature_desc: "우리가 보유한 땅은 다양하고 풍요롭습니다. 너무나 풍요로워서 외세가 우리 땅 자체를 탐내리라는 것을 쉽게 예상할 수 있습니다. 따라서 우리는 이 다양한 땅을 이해하도록 군대를 훈련하고, 다듬고, 빚어내야 합니다. 그래야 우리 집을 지킬 뿐 아니라, 만약 그날이 온다면 우리 땅에서 전투를 몰아내어 그들의 땅과 그들의 피에서 벌어지게 할 수 있습니다."