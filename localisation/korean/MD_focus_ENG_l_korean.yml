 ENG_apollo_programme_desc: "APOLLO 계획은 국방부의 키프로스 주둔 영국군에 대한 장기 쇄신 계획입니다. RAF 아크로티리의 1960년대 여객 및 화물 터미널을 교체하고, 수백 채의 새 군인 가족 주택을 건설하며, 주권 기지 지역 전역에 학교와 의료 시설을 추가하여, 영국의 동지중해 및 중동 주요 중간 기착지로서 기지의 기능을 유지합니다."
