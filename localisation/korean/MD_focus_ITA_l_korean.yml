 ITA_additional_expenses_localisation_string: "$$[?ITA_additional_expenses_var|-3] §Y특별 지출§!로 인한 비용\n"
 ITA_restore_hegemony: "패권 회복"
 ITA_restore_hegemony_desc: "과거의 영광을 되살릴 때가 왔습니다. 이 꿈을 이루기 위한 올바른 길을 선택하기만 하면 됩니다."
 ITA_patrician_oligarchy: "귀족 올리가르히"
 ITA_patrician_oligarchy_desc: "무지한 평민들에게 나라 전체에 대한 권력을 맡길 수는 없습니다. 우리 중 가장 부유하기도 한 소수의 현명한 이들이 공화국의 운명을 결정해야 합니다."
 ITA_let_the_plebs_vote: "민주적 원로원"
 ITA_let_the_plebs_vote_desc: "과두제와 특권의 시대는 지나갔으며, 현대는 우리 중 덜 부유한 이들의 요구에도 귀를 기울일 것을 요구합니다. 그러나 낡은 대의 민주주의의 실패를 무시할 수는 없으므로, 국민은 정당에 투표할 수 있지만 그 역할은 어떤 테크노크라트가 정부를 구성할지 선택하는 것에 그칠 것입니다."
 ITA_let_the_plebs_vote_TT: "원로원이 테크노크라트 방식을 사용하는 일반 정당들에 개방됩니다."
 ITA_roma_capitale: "로마 수도시"
 ITA_roma_capitale_desc: "로마는 수십 년 동안 참담한 통치와 만성적인 비효율에 시달려 왔으며, 세계에서 가장 아름다운 도시 중 하나로서 참으로 부끄러운 일입니다. 부패, 범죄, 마피아, 엉망인 공공 서비스, 끊임없는 예산 적자 등 수많은 문제를 해결해야 이 도시가 다시 빛날 수 있습니다."
 ITA_municipalities_corruption_rome: "자치구의 부패"
 ITA_municipalities_corruption_rome_desc: "로마 대도시권은 여러 자치구로 나뉘어 있지만, 대부분은 부패와 마피아의 침투에 희생되었고 기존의 권력 구도 때문에 상황 개선이 번번이 가로막히고 있습니다. 도시를 쇄신할 기회를 얻으려면 이 악순환을 끊어야 합니다."
 ITA_casamonica_clan: "카사모니카 일가"
 ITA_casamonica_clan_desc: "카사모니카는 로마에 존재하는 로마니 문화권의 마피아 조직입니다. 주요 마피아 일가만큼의 힘과 영향력은 없지만, 라치오 지역 불법 활동의 상당 부분을 장악하고 있습니다."
 ITA_disastrous_transports_rome: "엉망인 교통 체계"
 ITA_disastrous_transports_rome_desc: "수도의 대중교통 체계는 구식이며 끝없는 문제에 시달리고 있습니다. 지하철 노선은 2개뿐이며, 지상 열차는 수가 적고 상습적으로 지연되며 안전하지 않고 지저분합니다. 도로는 관리가 부실하고 교통 체증으로 막혀 있으며, 택시 요금은 극도로 비싸고 택시 기사들은 대중교통 종사자들과 함께 정치에 상당한 영향력을 행사하여 모든 개혁을 가로막고 있습니다. 체계를 개혁할 탄탄한 기반을 마련하려면 우리의 기반시설을 정비해야 합니다."
 ITA_flaming_buses_and_referendums: "불타는 버스와 국민투표"
 ITA_flaming_buses_and_referendums_desc: "로마의 대중교통 상황은 정비 불량으로 버스가 불타는 모습을 보는 것이 드문 일이 아닐 정도로 비극적인 지경에 이르렀습니다. 로마의 대중교통 회사인 ATAC로부터 통제권을 되찾고 현재 개혁을 가로막는 권력 구도를 깨기 위해서는 국민투표가 필요합니다."
 ITA_urban_waste_management_rome: "도시 폐기물 관리"
 ITA_urban_waste_management_rome_desc: "나폴리를 비롯한 이탈리아 남부의 여러 도시처럼 로마 역시 폐기물 관리 문제를 겪고 있으며, 특히 거대한 도시에서 발생하는 양을 공공 서비스가 감당하지 못하는 것이 원인입니다. 더 많은 자원을 투입하고 그것이 평소처럼 낭비되지 않도록 해야 합니다."
 ITA_wild_boar_epidemic: "멧돼지 창궐"
 ITA_wild_boar_epidemic_desc: "관리되지 않은 막대한 양의 쓰레기로 인해 놀라울 만큼 번식력이 강한 멧돼지 개체군이 생겨나 지역 대부분을 점령했으며 종종 도시 깊숙이까지 들어오곤 합니다. 이제 쓰레기 문제가 해결되었으므로 멧돼지 문제가 다시 불거질 걱정 없이 이에 대처할 수 있습니다."
 ITA_widespread_absenteeism: "만연한 결근"
 ITA_widespread_absenteeism_desc: "로마 시의 공무원 중 매일 약 15%가 출근하지 않습니다. 전국 평균이 3%인 데 비해, 노동 인력의 25%가 특별한 돌봄이 필요한 친족을 돌본다는 명목으로 결근 허가를 받고 있습니다. 결근은 만연하고 고질적이며, 더 이상 용인할 수 없습니다."
 ITA_chronic_strikes: "만성적인 파업"
 ITA_chronic_strikes_desc: "무능과 결근에 대한 관용에도 불구하고 로마 공공 부문 노동자들은 주기적으로 파업을 벌이며, 이는 이미 상당한 특권을 누리고 있는 상황을 바꾸는 데에는 별 관심 없이 또 다른 형태의 결근이 되어 버린 지경에 이르렀습니다."
 ITA_cinecitta: "치네치타 재건"
 ITA_cinecitta_desc: "치네치타는 대부분의 텔레비전 및 영화 산업 제작이 이루어지는 로마의 구역입니다. 외국의 영향과 밀라노에서의 경쟁 심화로 중요성이 일부 줄어들었음에도, 치네치타가 전 세계에 이탈리아 문화의 등대가 될 여지는 여전히 남아 있습니다."
 ITA_a_new_industrial_center: "새로운 산업 중심지"
 ITA_a_new_industrial_center_desc: "로마는 수도임에도 불구하고 역사적으로 산업 발전 면에서 이탈리아 북부 도시들에 뒤처져 왔습니다. 이제 도시가 개혁되었으므로 더 많은 기업과 일자리를 유치할 수 있습니다."
 ITA_technocratic_governments: "테크노크라트 정부"
 ITA_technocratic_governments_desc: "큰 위기가 닥치면 불안정한 이탈리아 정계는 나라를 어려운 상황에서 이끌어낼 실제로 유능한 지도부의 필요성을 받아들여야 하는 경우가 많으며, 상황이 진정되면 정당들은 정권을 쥐기 위한 끝없는 다툼을 재개합니다."
 ITA_relinquish_power_to_the_pope: "교황에게 권력 이양"
 ITA_relinquish_power_to_the_pope_desc: "성하께 지상에 하느님의 왕국을 되살릴 권한을 드릴 때가 왔습니다. 그분이 우리 모두를 축복하시기를."
 ITA_consult_pope_on_political_matters: "정치 문제에 대해 교황에게 자문"
 ITA_consult_pope_on_political_matters_desc: "성하께서는 현명한 분이며 그분의 판단은 하느님의 인도를 받고 있으므로, 가능할 때마다 이에 의지해야 합니다."
 ITA_neutralize_russian_propaganda: "러시아 선전 무력화"
 ITA_neutralize_russian_propaganda_desc: "우리 언론 체계 안에서 처벌받지 않고 노골적인 거짓말을 쏟아내는 러시아 트롤들을 더 이상 용인할 수 없습니다."
 ITA_political_instability: "정치적 불안정"
 ITA_political_instability_desc: "이탈리아의 정치 상황은 악명 높을 만큼 불안정하여, 정부는 몇 달 만에 들어서고 무너지며 정당들은 아무런 대가 없이 이념적 입장을 바꿉니다."
 ITA_italian_media: "이탈리아 언론"
 ITA_italian_media_desc: "텔레비전은 국민 대다수가 유일한 정보원으로 의존하기 때문에 이탈리아에서 단연 가장 영향력 있는 매체입니다. 신문은 두 번째로 중요한 매체이며 여전히 매일 수백만 명의 독자에게 도달합니다. 의회의 공식 방송사인 라디오 라디칼레를 제외하면, 정치적으로 영향력이 있는 라디오는 거의 없습니다."
 ITA_italian_newspapers: "이탈리아 신문"
 ITA_italian_newspapers_desc: "텔레비전 다음으로 신문이 두 번째로 중요한 매체이며, \\"라 레푸블리카\\", \\"라 스탐파\\", \\"코리에레 델라 세라\\" 같은 거물급 신문은 매일 수십만 부를 판매합니다. 한 세기에 걸친 전통에도 불구하고 보도의 질은 크게 떨어졌으며, 기자들은 정치 및 과학 문제 모두에서 진실보다 소동과 파문을 점점 더 좇고 있습니다."
 ITA_enforce_factchecking: "팩트체크 의무화"
 ITA_enforce_factchecking_desc: "악화되는 보도 행태라는 우려스러운 추세를 멈추려면, 기사가 독립적인 기관에 의해 제대로 팩트체크되고 신문이 과학 또는 기술 뉴스에 대해 엄격한 출처에 의존하도록 해야 합니다."
 ITA_enforce_retraction: "정정 보도 의무화"
 ITA_enforce_retraction_desc: "신문이 노골적인 정치적 명예훼손 도구로 쓰이지 않도록, 허위 뉴스 유포에 대한 벌금을 높이고 보도된 뉴스가 사실이 아닌 것으로 입증되면 발행인이 신문의 구석진 곳이 아닌 눈에 띄는 방식으로 공개적으로 정정하도록 강제해야 합니다."
 ITA_media_control: "RAI에 대한 통제 강화"
 ITA_media_control_desc: "이탈리아 라디오텔레비전(RAI)은 이탈리아의 공영 방송사입니다. 새로 선출된 정당들이 회사 내 직책을 재배치하여 정부를 구성하는 모든 정당이 공정한 몫의 통제권을 갖도록 하는 것은 흔한 관행입니다."
 ITA_liberalise_television: "텔레비전 자유화"
 ITA_liberalise_television_desc: "이탈리아 공영 방송사는 만성적인 적자 상태에 있으며, 수입이 사실상 보장되어 있고 어떠한 문제도 납세자의 돈으로 메워질 수 있기 때문에 상황을 개선할 유인이 거의 없습니다. 이 썩은 체계를 청산할 때가 되었습니다."
 ITA_exploit_talk_shows: "토크쇼 활용"
 ITA_exploit_talk_shows_desc: "현대 이탈리아 문화의 초석은 토크쇼 방송 형식으로, 정치부터 연예와 스포츠까지 모든 주제를 논의하는 데 쓰입니다. 이 형식은 점차 전문가들의 유익한 토론에서 고함 경연에서 서로를 이기려 드는 시끄러운 아무개들의 다툼으로 변질되었습니다. 그들의 영향력을 활용해 우리의 정치적 필요를 더욱 충족시킬 수 있습니다."
 ITA_crack_down_on_talk_shows: "토크쇼 문화 단속"
 ITA_crack_down_on_talk_shows_desc: "토크쇼라는 텔레비전 형식은 현대 이탈리아 문화의 초석으로, 정치부터 연예와 스포츠에 이르기까지 모든 주제를 논하는 데 쓰입니다. 이 형식은 점차 전문가들의 유익한 토론에서, 서로를 이기려고 고함을 질러대는 이름 모를 사람들의 말싸움으로 전락했습니다. 명예훼손 재판을 간소화하고 사실 확인 기관을 설립해야 합니다."
 ITA_defund_radio_radicale: "라디오 라디칼레 지원 중단"
 ITA_defund_radio_radicale_desc: "라디오 라디칼레가 의회 회기를 방송하는 공공 서비스는 의회 회의록과 중복됩니다. 이 추가 비용을 줄이면 급진당에 의한 자유주의 사상의 확산도 제한할 수 있을 것입니다."
 ITA_defund_radio_radicale_decision: "라디오 라디칼레 지원 중단"
 ITA_defund_radio_radicale_decision_desc: "라디오 라디칼레가 의회 회기를 방송하는 공공 서비스는 의회 회의록과 중복됩니다. 이 추가 비용을 줄이면 급진당에 의한 자유주의 사상의 확산도 제한할 수 있을 것입니다."
 ITA_defund_radio_radicale_decision_repeal: "라디오 라디칼레 복원"
 ITA_constitutionalise_secularism_TT: "성직자 계층을 국제 은행가, 군산복합체, 산업 재벌, 농민 중 하나로 교체할 수 있습니다."
 ITA_restore_roman_borders: "로마 국경 복원"
 ITA_restore_roman_borders_desc: "로마는 부활했지만, 과거의 영토 규모와 비교하면 우리를 제국이라 부르기 어렵습니다. 우리의 고대 영토를 되찾아야 합니다."
 ITA_recover_iberia: "이베리아 수복"
 ITA_recover_iberia_desc: "이베리아는 제국에서 가장 부유하고 잘 통합된 지역 중 하나였습니다. 로마의 영광을 위해 이를 재정복할 것입니다."
 ITA_recover_britannia: "브리타니아 수복"
 ITA_recover_britannia_desc: "과거 브리타니아로 불리던 잉글랜드는 수 세기 동안 로마의 땅이었습니다. 암흑기에 로마는 이곳을 포기할 수밖에 없었으나, 마침내 그 잘못을 바로잡을 때가 왔습니다."
 ITA_fourth_shore: "제4의 해안"
 ITA_fourth_shore_desc: "파시즘 시기 제4의 해안은 이탈리아와 가장 가까운 북아프리카 지역인 튀니지와 리비아를 가리키는 표현이었습니다. 이 지역들을 이탈리아화하려는 계획을 되살릴 것입니다."
 ITA_attack_germany: "독일 패권 타파"
 ITA_attack_germany_desc: "두 차례의 세계 대전에서 패했음에도 독일은 여전히 유럽에서 가장 강력한 국가입니다. 이러한 현실이 더는 존재하지 않으며 새로운 강국이 떠올랐음을 세계에 보여줄 때입니다."
 ITA_attack_germany_spirit: "독일 패권 타파"
 ITA_attack_germany_spirit_desc: "두 차례의 세계 대전에서 패했음에도 독일은 여전히 유럽에서 가장 강력한 국가입니다. 이러한 현실이 더는 존재하지 않으며 새로운 강국이 떠올랐음을 세계에 보여줄 때입니다."
 ITA_attack_china: "중국 견제"
 ITA_attack_china_desc: "거의 한 세기에 걸친 미국의 지배 끝에, 새로운 강국들이 초강대국의 자리를 차지하기 위해 도전하고 있습니다. 중국이 미국의 진정한 경쟁자가 될 자격이 없음을 세계에 보여줄 때입니다."
 ITA_attack_china_spirit: "중국 견제"
 ITA_attack_china_spirit_desc: "거의 한 세기에 걸친 미국의 지배 끝에, 새로운 강국들이 초강대국의 자리를 차지하기 위해 도전하고 있습니다. 중국이 미국의 진정한 경쟁자가 될 자격이 없음을 세계에 보여줄 때입니다."
 ITA_carbon_tax_decision: "탄소세"
 ITA_carbon_tax_decision_desc: "이 세금은 민간 부문을 친환경 에너지로 이끌 것입니다."
 ITA_carbon_tax_decision_repeal: "탄소세 폐지"
 ITA_normalize_extraordinary_bonuses_decision: "특별 보너스 정례화"
 ITA_normalize_extraordinary_bonuses_decision_desc: "많은 \\"일회성\\" 또는 \\"특별\\" 보너스가 표준이 되거나 반복적으로 지급되고 있으며, 기존 보너스와 목적은 같지만 이름만 다른 새 보너스가 끊임없이 생겨납니다. 이러한 관행은 납세자의 돈을 쓰는 효율적인 방법은 아니지만, 인기도를 상당히 끌어올려 줍니다."
 ITA_normalize_extraordinary_bonuses_decision_repeal: "선거용 보너스 취소"
 ITA_streamline_subjects_integration: "종속국 통합 간소화"
 ITA_streamline_subjects_integration_desc: "여러 나라가 옛 로마 제국의 정당한 국경 안에 자리하고 있으며, 이들을 모두 통합하려면 비상한 노력이 필요합니다."
 ITA_streamline_propaganda_campaigns_abroad: "해외 선전 활동 간소화"
 ITA_streamline_propaganda_campaigns_abroad_desc: "여러 나라가 옛 로마 제국의 정당한 국경 안에 자리하고 있으며, 이들을 모두 다시 품으려면 비상한 노력이 필요합니다."
 ITA_eight_milion_bayonets: "800만 총검"
 ITA_eight_milion_bayonets_desc: "무솔리니는 이탈리아가 자국 영토를 지킬 800만 자루의 총검을 갖추고 있다고 말한 적이 있습니다."
 ITA_return_to_lira: "리라화로의 복귀"
 ITA_return_to_lira_desc: "유로를 쓰면 해마다 하루 덜 일하고도 하루 더 일한 만큼 벌 수 있다고 약속했지만, 그 약속은 공허했습니다. 실제로는 우리의 주권과 살인적인 인플레이션과 불안정을 누릴 권리를 빼앗아 갔을 뿐입니다."
 ITA_flat_tax_decision: "단일세율"
 ITA_flat_tax_decision_desc: "러시아의 사례를 따라 단일세율을 적용할 것입니다. 이는 주로 부유층에게 이익이 되겠지만, 그 혜택이 아래로 흘러내리기를 기대합니다. 세수 손실로 인해 의료와 사회 서비스를 이전 수준으로 유지할 자금이 부족해질 수도 있습니다."
 ITA_flat_tax_decision_repeal: "단일세율 폐지"
 ITA_crush_third_rome_spirit: "제3의 로마 분쇄"
 ITA_crush_third_rome_spirit_desc: "차르 시대에 러시아인들은 마지막 비잔티움 황제의 조카딸 한 명이 차르였다는 이유로 자신들이 제국의 후계자라고 생각했습니다. 그들은 로마가 오직 하나뿐임을 배우게 될 것입니다."
 ITA_reopen_brothels_decision: "성매매 합법화"
 ITA_reopen_brothels_decision_desc: "가난한 여성들이 범죄자들에게 착취당하도록 내버려 두는 것은 모든 도덕에 반합니다. 성매매 종사자는 다른 모든 직업과 마찬가지로 하나의 직업이어야 하며, 그에 따른 보장을 받아야 합니다."
 ITA_reopen_brothels_decision_repeal: "성매매 범죄화"
 ITA_legalize_all_drugs_decision: "모든 마약 합법화"
 ITA_legalize_all_drugs_decision_desc: "마약을 합법화하면 §t마피아§!가 마약을 팔기가 더 어려워질 것입니다. 우리가 술과 담배를 팔고 사람들이 카지노에 드나드는 것을 허용한다면, 모르핀을 시도해 보게 하지 못할 이유가 무엇이겠습니까?"
 ITA_legalize_all_drugs_decision_repeal: "강성 마약 금지"
 ITA_protect_our_traditions_decision: "전통 수호"
 ITA_protect_our_traditions_decision_desc: "우리의 가치는 \\"신, 조국, 가정\\"입니다. 좌파들이 우리나라를 파괴하거나 이슬람 사원으로 만들도록 놔두지 않겠습니다."
 ITA_protect_our_traditions_decision_repeal: "전통 수호 정책 폐지"
 ITA_repeal_law_194: "낙태 금지"
 ITA_repeal_law_194_desc: "낙태할 권리는 1978년 194호 법으로 보장되었으나, 진보 진영과 가톨릭 진영 사이에서 수십 년간 논쟁이 이어져 온 주제입니다."
 ITA_repeal_law_194_decision: "낙태 금지"
 ITA_repeal_law_194_decision_desc: "낙태할 권리는 1978년 194호 법으로 보장되었으나, 진보 진영과 가톨릭 진영 사이에서 수십 년간 논쟁이 이어져 온 주제입니다."
 ITA_repeal_law_194_decision_repeal: "낙태 권리 복원"
 ITA_banned_abortion: "낙태 금지함"
 ITA_outlaw_lgbt_behaviour: "LGBT 행위 금지"
 ITA_outlaw_lgbt_behaviour_desc: "가톨릭적 품위 의식에 따라 우리는 시민들이 부도덕한 행위에 빠지지 않도록 막아야 합니다."
 ITA_outlaw_lgbt_behaviour_decision: "LGBT 행위 금지"
 ITA_outlaw_lgbt_behaviour_decision_desc: "가톨릭적 품위 의식에 따라 우리는 시민들이 부도덕한 행위에 빠지지 않도록 막아야 합니다."
 ITA_outlaw_lgbt_behaviour_decision_repeal: "LGBT 권리 복원"
 ITA_banned_lgbt: "LGBT 금지함"
 ITA_allow_same_sex_marriage: "동성 결혼 허용"
 ITA_allow_same_sex_marriage_desc: "너무 오랫동안 LGBT 소수자들은 기독교에 느슨하게 기반을 둔 시대에 뒤떨어진 도덕관 때문에 고통받아 왔습니다. 모든 시민은 평등한 권리를 가져야 합니다."
 ITA_allow_same_sex_marriage_decision: "동성 결혼 허용"
 ITA_allow_same_sex_marriage_decision_desc: "너무 오랫동안 LGBT 소수자들은 기독교에 느슨하게 기반을 둔 시대에 뒤떨어진 도덕관 때문에 고통받아 왔습니다. 모든 시민은 평등한 권리를 가져야 합니다."
 ITA_allow_same_sex_marriage_decision_repeal: "동성 결혼 금지"
 ITA_gay_marriage: "동성 결혼을 허용함"
 ITA_allow_euthanasia: "안락사 허용"
 ITA_allow_euthanasia_desc: "많은 사람들이 남에게 강요하기를 좋아하는 왜곡된 도덕관 때문에, 불치의 상태와 질병으로 고통받는 사람들이 끝없는 고통 속에서 삶을 이어가도록 강요받고 있습니다."
 ITA_allow_euthanasia_decision: "안락사 허용"
 ITA_allow_euthanasia_decision_desc: "많은 사람들이 남에게 강요하기를 좋아하는 왜곡된 도덕관 때문에, 불치의 상태와 질병으로 고통받는 사람들이 끝없는 고통 속에서 삶을 이어가도록 강요받고 있습니다."
 ITA_allow_euthanasia_decision_repeal: "안락사 금지"
 ITA_allowed_euthanasia: "안락사를 허용함"
 ITA_protect_prisoners_rights: "수감자 권리 보호"
 ITA_protect_prisoners_rights_desc: "교도소는 과밀 상태이고 수감자들은 끔찍한 환경에서 살고 있으며, 이들이 사회에 복귀할 기회를 얻도록 하는 조치는 거의 취해지지 않고 있습니다."
 ITA_protect_prisoners_rights_decision: "수감자 권리 보호"
 ITA_protect_prisoners_rights_decision_desc: "교도소는 과밀 상태이고 수감자들은 끔찍한 환경에서 살고 있으며, 이들이 사회에 복귀할 기회를 얻도록 하는 조치는 거의 취해지지 않고 있습니다."
 ITA_protect_prisoners_rights_decision_repeal: "수감자 권리 축소"
 ITA_prisoners_rights: "수감자 권리를 보호 중"
 ITA_constitutionalise_social_rights: "사회적 권리 헌법화"
 ITA_constitutionalise_social_rights_desc: "최근의 개혁은 이탈리아에 만연했던 유해한 도덕관에 오랫동안 맞서 싸워 온 사람들에게 절실히 필요했던 권리를 부여했습니다. 이 성과를 헌법에 명문화하여 지켜내야 합니다."
 ITA_constitutionalise_social_rights_TT: "이미 획득한 권리가 폐지되는 것을 막을 수 있습니다."
 ITA_ban_nuclear_power_decision: "원자력 발전 금지"
 ITA_ban_nuclear_power_decision_desc: "이탈리아인들은 1987년 국민투표에서 모든 형태의 원자력 에너지를 폐지하기로 투표했으며, 이는 지금도 그들의 뜻입니다."
 ITA_ban_nuclear_power_decision_repeal: "원자력 발전 금지 해제"
 ITA_encourage_renewables_decision: "재생 에너지 장려"
 ITA_encourage_renewables_decision_desc: "지금은 21세기입니다. 화력 발전소를 폐쇄하십시오. 우리에게는 바람과 태양과 물이 있으며, 그 밖의 것은 필요하지 않습니다."
 ITA_encourage_renewables_decision_repeal: "재생 에너지 장려 중단"
 ITA_ban_gmos_decision: "GMO 금지"
 ITA_ban_gmos_decision_desc: "인공 식품을 금지하고 다시 자연적이고 건강한 식품을 재배하기 시작해야 합니다."
 ITA_ban_gmos_decision_repeal: "GMO 금지 해제"
 ITA_tax_the_rich_decision: "부자에게 과세하라!"
 ITA_tax_the_rich_decision_desc: "부유세를 적용하여 부유층에게서 더 거두어 우리나라의 덜 유복한 이들에게 나누어 주어야 합니다."
 ITA_tax_the_rich_decision_repeal: "부유층 추가 과세 취소"
 ITA_raise_minimum_wage_decision: "최저임금 인상"
 ITA_raise_minimum_wage_decision_desc: "노동조합의 단체협약이 적용되지 않는 노동자를 보호하려면 보편적인 최저임금이 필요합니다."
 ITA_raise_minimum_wage_decision_repeal: "최저임금 인하"
 ITA_protect_migrant_rights_decision: "이민자들의 권리를 보호하라"
 ITA_protect_migrant_rights_decision_desc: "이탈리아인들은 과거에 오랜 기간 이주민이었고 지금도 그렇습니다. 자국이 안전하고 편안한 삶을 살 만한 기회를 충분히 주지 못해 다른 나라로 떠나는 것이 어떤 기분인지 알고 있을 것입니다... 이들을 도와주고, 포퓰리즘 선전이 이러한 기억을 지우도록 놔두지 마십시오."
 ITA_protect_migrant_rights_decision_repeal: "이주민 권리 폐지"
 ITA_widespread_expropriation_decision: "광범위한 수용"
 ITA_widespread_expropriation_decision_desc: "각자 능력에 따라, 각자 필요에 따라라는 말은 단순한 구호가 아닙니다."
 ITA_widespread_expropriation_decision_repeal: "수용 중단"
 ITA_redistribution_decision: "부의 재분배"
 ITA_redistribution_decision_desc: "소수 부유층의 이익으로 다수의 고통을 정당화할 수는 없습니다. 사람들은 마땅히 받아야 할 것을 받게 될 것입니다."
 ITA_abolish_capitalist_media_decision: "자본주의 선전 폐지"
 ITA_abolish_capitalist_media_decision_desc: "기존 언론은 이윤과 소유주의 이익을 위해 일하는 기업일 뿐입니다. 우리는 노동자가 소유하는 새로운 언론을 만들 것입니다."
 ITA_abolish_capitalist_media_decision_repeal: "언론 독립 복원"
 ITA_silence_defeatists_decision: "패배주의자 침묵시키기"
 ITA_silence_defeatists_decision_desc: "새 헌법을 받아들이기를 거부하는 자들에게는 적절한 재교육이 필요합니다."
 ITA_silence_defeatists_decision_repeal: "선전 활동 중단"
 ITA_safeguard_the_revolution_decision: "혁명 수호"
 ITA_safeguard_the_revolution_decision_desc: "새 헌법을 기초하는 것만으로는 충분하지 않았습니다. 이제 프롤레타리아 독재를 수립할 때입니다."
 ITA_safeguard_the_revolution_decision_repeal: "민주주의 복원"
 ITA_northern_league: "북부동맹"
 ITA_northern_league_desc: "'레가 노르드'는 1991년에 창당되어 지역 자치, 파다니아 분리주의 또는 연방주의를 옹호하는 한편 남부인에 대한 차별을 부추겼습니다. 북부동맹의 주요 구호는 '로마가 우리를 약탈한다'였습니다."
 ITA_lega_nord_populism: "동맹"
 ITA_lega_nord_populism_desc: "살비니가 집권한 이후 북부동맹은 포퓰리즘 우익 정당으로 탈바꿈했습니다. 북부동맹의 주요 관심사는 불법 이민과의 싸움, 반세계화, 유럽회의주의, 가톨릭의 전통 가치 수호이며, 대외적으로는 러시아 및 세계 각국의 다른 우익 정당들과 긴밀한 관계를 누리고 있습니다."
 ITA_fiamma_tricolore: "삼색불꽃"
 ITA_fiamma_tricolore_desc: "삼색불꽃당은 1995년 이탈리아 사회운동이 삼색불꽃과 국민동맹의 두 부문으로 분리될 때 창당되었으며, 전자가 더 극단적인 분파였습니다. 파시즘에서 강한 영감을 받은 이 당은 자본주의와 공산주의를 공공연히 비판하며, 대신 \\"제3의 길\\"의 재현을 추구합니다."
 ITA_building_amnesty_decision: "건축 사면"
 ITA_building_amnesty_decision_desc: "과거 많은 정부가 그랬듯이, 규정을 바꾸어 수많은 불법 건축물을 합법으로 만들 수 있습니다. 이는 해당 건물의 모든 거주자들 사이에서 분명 인기를 끌 것입니다. 이 결정을 후회하는 일이 없기를 바랍니다."
 ITA_stop_building_abuse_decision: "불법 건축 근절"
 ITA_stop_building_abuse_decision_desc: "불법 건축은 세수를 줄일 뿐만 아니라 범죄 조직의 영향력을 키우고, 무엇보다 심각한 안전 문제를 일으킵니다. 이는 활성 단층선과 화산 위에 자리한 나라에게 우려스러운 일입니다."
 ITA_lower_taxes_on_jobs: "고용 세금 인하"
 ITA_lower_taxes_on_jobs_desc: "세금과 관료제 때문에 직원을 합법적으로 고용하는 일은 많은 기업에게 감당할 수 없을 만큼 비싸지는 경우가 많습니다. 세금을 낮추고 절차를 간소화하면 신고하지 않은 노동의 만연한 사용과 싸우는 데 도움이 될 것입니다."
 ITA_simplify_tax_code: "세법 간소화"
 ITA_simplify_tax_code_desc: "세법은 전 세계적으로 복잡하기로 악명이 높으며, 이탈리아의 세법은 그중에서도 단연 최악에 속합니다. 간소화는 사람들이 세법을 준수하도록 장려할 수 있습니다."
 ITA_enforce_electronic_payments: "전자 결제 의무화"
 ITA_enforce_electronic_payments_desc: "전자 결제는 추적 가능성을 높이고 미신고 거래를 막아 주므로 그 사용을 의무화해야 합니다."
 ITA_increase_checks: "단속 강화"
 ITA_increase_checks_desc: "새로운 세법이 실제로 적용되도록 하려면, 잠재적 탈세자들이 단속이 언제든 현실적으로 가능하다고 느끼도록 재무 경찰의 무작위 단속을 늘려야 합니다."
 ITA_fiscal_amnesty: "재정 사면"
 ITA_fiscal_amnesty_desc: "미신고 금액의 일부를 대가로 과거의 비행을 눈감아 주면, 상당한 규모의 미납 세금을 회수할 수 있고, 무엇보다 과거의 탈세자들이 깨끗한 상태에서 세법을 준수하기 시작할 현실적인 기회를 얻도록 할 수 있습니다."
 ITA_hydrogeological_safety_liguria: "리구리아의 수리지질 안전"
 ITA_hydrogeological_safety_liguria_desc: "리구리아는 아름다운 지역이며, 특히 동부의 유명한 '친퀘 테레'가 그렇습니다. 그러나 최근 몇 년간 수리지질학적 불안정에 시달려, 홍수와 산사태가 경관을 황폐화하고 관광업에 큰 피해를 주고 있습니다."
 ITA_protect_local_food_products: "지역 식품 보호"
 ITA_protect_local_food_products_desc: "이름난 이탈리아 제품 다수가 원조를 닮은 이탈리아풍 이름을 내세워 시장에 넘쳐나는 저품질 값싼 모조품과 부당하게 경쟁해야 합니다."
 ITA_integrate_mountain_territories: "산악 지역 통합"
 ITA_integrate_mountain_territories_desc: "이탈리아 영토의 상당 부분은 산과 계곡, 구릉으로 이루어져 있습니다. 이러한 지형은 아름답지만 거주에 어려움을 초래하며 특별한 관심과 자원을 필요로 합니다."
 ITA_encourage_gmos_decision: "GMO 장려"
 ITA_encourage_gmos_decision_desc: "우리 대학들은 매우 유망한 유전학 연구를 하고 있습니다. 우리의 반동적인 사회는 그들의 날개를 충분히 꺾어 왔으며, 이제 이 흥미로운 새 분야에서 실험하도록 허용할 때입니다."
 ITA_encourage_gmos_decision_repeal: "GMO 장려 중단"
 ITA_abolish_the_provinces: "도 폐지"
 ITA_abolish_the_provinces_desc: "이탈리아는 1948년 새 헌법으로 레조네(주)를 새로운 행정 단계로 도입했으나, 이후 이 새로운 기관들의 권한은 기존 도(프로빈차)의 권한과 겹쳐 왔습니다. 게다가 주와 도는 과세 권한이 거의 없어 정책 비용을 중앙 정부에 의존합니다. 수년간 이는 재정 책임의 심각한 결여와 만연한 적자로 이어졌습니다."
 ITA_block_municipalities_obstructionism: "지자체 훼방 차단"
 ITA_block_municipalities_obstructionism_desc: "님비 위원회의 강점은 지방 행정에 부여된 막대한 권한을 활용하여, 중앙 정부가 개입하더라도 사업을 막을 수 있다는 점입니다."
 ITA_limit_rebound_of_responsibilities: "책임 전가 제한"
 ITA_limit_rebound_of_responsibilities_desc: "지방 행정은 지자체, 산악 공동체, 도, 주 사이에서 책임을 끊임없이 떠넘기는 과정 덕분에 사업을 끝없이 지연시킬 수 있었습니다."
 ITA_close_nimby_committees: "님비 위원회 해산"
 ITA_close_nimby_committees_desc: "우리의 개혁으로 님비 위원회가 약화되었으니, 이 기회를 잡아 기존 위원회들을 영구히 해산할 수 있습니다."
 ITA_safeguard_teachers_privileges: "교사 특권 수호"
 ITA_safeguard_teachers_privileges_desc: "교사와 학교 체계 전반은 여전히 국내 최대 규모의 유권자층 중 하나이므로, 무능한 교수를 해고하거나 그들의 방식을 평가하는 등의 터무니없는 발상으로 그들을 분노하게 해서는 절대 안 됩니다."
 ITA_introduce_meritocracy: "학교 능력주의 도입"
 ITA_introduce_meritocracy_desc: "교사들은 너무나 높은 수준의 보호를 받아 무능이 명백한데도 학교장이 해고조차 할 수 없습니다. 교실에 나타나 필요한 서류 작업만 채우고 자기 일에만 신경 써도 아무런 불이익이 없으며, 상당수의 교수들이 이러한 상황을 이용합니다."
 ITA_increase_teachers_salary: "교사 급여 인상"
 ITA_increase_teachers_salary_desc: "교사나 교수라는 직업은 안정과 평온을 많이 보장하지만 금전적으로는 보상이 크지 않아, 다른 곳에서 안정적인 일자리를 찾기 힘든 저숙련자를 끌어들이는 경향이 있습니다. 급여를 인상하면 직업의 매력과 그것을 얻기 위한 경쟁이 높아져 더 숙련된 인재를 끌어들일 수 있습니다."
 ITA_increase_english_teaching: "영어 교육 개선"
 ITA_increase_english_teaching_desc: "현대 세계에서 필수임에도 이탈리아의 영어 지식 수준은 극히 부진합니다. 이탈리아인은 평균적으로 영어 실력에서 유럽의 또래보다 적어도 한 세대, 어쩌면 그 이상 뒤처져 있습니다. 학교의 영어 교육 방식을 개선하는 것이 상황을 개선하는 유일한 방법입니다."
 ITA_reform_private_schools: "사립학교 개혁"
 ITA_reform_private_schools_desc: "이탈리아의 많은 사립학교는 현재 부유한 가정 자녀들의 보관소 역할을 하며, 돈을 내면 실제 성과와 무관하게 졸업장을 받습니다. 사립학교가 양질의 교육을 제공하는 동시에 공공 재정의 부담을 덜도록 이 체계를 개혁하는 것이 시급합니다."
 ITA_encourage_private_schools: "사립학교 장려"
 ITA_encourage_private_schools_desc: "사립학교는 비용을 낮춰 공교육 체계의 부담을 줄이는 데 도움이 될 수 있습니다. 이러한 기관의 상당수가 거의 아무런 기준도 없이 돈을 받고 졸업장이나 학위를 내주고 있다는 사실은 눈감아 줄 수 있습니다."
 ITA_school_mass_hiring: "교사 대량 채용"
 ITA_school_mass_hiring_desc: "모든 교육 단계의 교사 중 상당수가 불안정하고 보호가 비교적 미비한 비정규 계약으로 고용되어 있습니다. 이들에게 적절한 안정적 계약을 주면 교육의 질이 개선될 수 있고, 교사들의 감사도 얻을 수 있을 것입니다."
 ITA_cash_bonus_to_18_year_olds: "18세 현금 보너스"
 ITA_cash_bonus_to_18_year_olds_desc: "이탈리아는 나머지 문명 세계가 젊은이들에게 제공하는 것과 같은 기회를 제공하지 못합니다. 이를 보상하기 위해 갓 졸업한 고등학생들에게 현금 보너스를 줄 수 있습니다. 결국 납세자의 돈을 무차별적으로 퍼붓는다고 해결되지 않을 문제가 어디 있겠습니까?"
 ITA_shift_taxation_from_income_to_property: "소득세에서 재산세로 과세 전환"
 ITA_shift_taxation_from_income_to_property_desc: "소득과 수익에 과세하는 것은 재산에 과세하는 것보다 경제 성장에 훨씬 부정적인 영향을 미치므로, 경제 성장을 촉진하기 위해 징수 우선순위를 전환해야 합니다."
 ITA_increase_competition: "경제 경쟁 촉진"
 ITA_increase_competition_desc: "이탈리아의 경제 경쟁은 상당히 부족하여, 기업들이 비효율에도 불구하고 아주 작은 규모로도 생존할 수 있습니다. 우리 기업의 질, 혁신 역량, 경제 성장을 개선하려면 더 경쟁적인 환경이 필요합니다."
 ITA_marginalize_labour_unions_TT: "노동조합을 국제 은행가, 군산복합체, 산업 재벌, 농민 중 하나로 교체할 수 있습니다."
 ITA_reintroduce_baby_pensions_decision: "베이비 연금 재도입"
 ITA_reintroduce_baby_pensions_decision_desc: "이른바 \\"베이비 연금\\"은 경제적으로 터무니없어 보일 수 있습니다. 노동자가 14.5년간 기여금을 내고 40년간 연금을 받는다는 것은 논리적이라 하기 어렵습니다. 그러나 그 노동자는 국가의 비용으로 살 수 있게 해 준 이에게 분명 감사할 것입니다."
 ITA_reintroduce_baby_pensions_decision_repeal: "베이비 연금 중단"
 ITA_recalculate_baby_pensions_decision: "베이비 연금 재산정"
 ITA_recalculate_baby_pensions_decision_desc: "우리의 연금 체계는 지속 가능성을 높이기 위해 최근 변경되었으나, 수많은 퇴직자들이 14년 6개월 1일만 일하고도 30대 중반에 은퇴할 수 있었던 터무니없는 옛 제도(악명 높은 베이비 연금)를 이용했습니다. 이 연금들을 새 제도로 재산정해야 합니다."
 ITA_recalculate_baby_pensions_decision_repeal: "기존 베이비 연금 복원"
 ITA_Quota_100_decision: "쿼타 100"
 ITA_Quota_100_decision_desc: "은퇴 연령 요건을 낮추면 신규 노동자를 위한 자리가 더 많이 생길 것입니다. 이미 흔들리는 우리 제도에 부담이 되겠지만 수혜자들은 크게 환영할 것입니다."
 ITA_Quota_100_decision_repeal: "쿼타 100 폐지"
 ITA_increase_pension_age_requirements_decision: "연금 연령 요건 상향"
 ITA_increase_pension_age_requirements_decision_desc: "연금 수급 연령 요건을 높이면 노동자가 평생 제도에 납부하는 기여금을 늘릴 수 있고, 동시에 연금을 받을 것으로 예상되는 기간을 줄여 제도의 막대한 비용을 절감할 수 있습니다."
 ITA_increase_pension_age_requirements_decision_repeal: "연금 연령 요건 하향"
 ITA_legalize_light_drugs_decision: "합법화하라"
 ITA_legalize_light_drugs_decision_desc: "주로 대마초인 가벼운 마약 소비는 보건상 매우 사소한 문제로 입증되었으며, 소비를 제한하려는 우리의 시도는 어차피 처참하게 실패하여 법 집행 기관의 값비싼 시간 낭비와 법원의 엄청난 적체만을 초래했습니다. 이제 이러한 사실을 인정하고 합법화할 때입니다."
 ITA_legalize_light_drugs_decision_repeal: "가벼운 마약 합법화 폐지"
 ITA_simplify_legal_code: "법전 간소화"
 ITA_simplify_legal_code_desc: "모든 개혁은 기존 법전 위에 쌓이지만, 기존 부분을 조정하여 개선하는 대신 새로운 부분이 끝없이 추가됩니다. 그 결과 법전의 복잡성이 시민과 기업의 준수 능력을 직접적으로 저해합니다."
 ITA_reduce_judgement_times: "재판 기간 단축"
 ITA_reduce_judgement_times_desc: "이탈리아에서는 사소한 사건조차 해결에 10년이 걸릴 수 있으며, 이는 관련 시민들에게 큰 스트레스의 원인이고 사건의 보상을 기대하는 기업에게도 큰 문제입니다."
 ITA_impose_better_checks_on_magistrates: "판사 감독 강화"
 ITA_impose_better_checks_on_magistrates_desc: "판사들은 동료들의 감시만 받고 있으며, 이러한 상황은 서로를 감싸 문제가 해결되지 못하게 만들 수 있습니다. 사법 체계의 기능을 개선하려면 감독 제도를 확대해야 합니다."
 ITA_refound_IRI_decision: "IRI 부활"
 ITA_refound_IRI_decision_desc: "IRI(Instituto per la Ricostruzione Industriale / 산업재건공사)가 폐쇄를 앞두고 있습니다. 이 결정을 되돌려 경제에 대한 우리의 개입을 통합하는 강력한 옛 도구를 유지할 수 있습니다."
 ITA_refound_IRI_decision_repeal: "IRI 폐쇄"
 ITA_sell_government_shares_in_companies_decision: "정부 보유 기업 지분 매각"
 ITA_sell_government_shares_in_companies_decision_desc: "정부는 많은 이탈리아 기업에 상당한 지분을 보유하고 있으며, 이를 매각하면 절실히 필요한 자금을 회수하는 동시에 정부의 간섭을 줄이고 경제적 자유를 늘릴 수 있습니다."
 ITA_sell_government_shares_in_companies_decision_repeal: "민영화 기업 재매입"
 ITA_privatize_water_distribution: "상수도 민영화"
 ITA_privatize_water_distribution_desc: "이탈리아의 상수도 기반시설은 무너져 가고 있으며, 수집된 물의 절반 이상이 손실되고 곳곳에서 누수가 발생합니다. 상황을 개선할 유인은 거의 없고 책임지는 사람도 없습니다. 체계에 책임성과 경쟁을 도입하려면 이 부문을 민영화해야 합니다."
 ITA_privatize_water_distribution_decision: "상수도 민영화"
 ITA_privatize_water_distribution_decision_desc: "이탈리아의 상수도 기반시설은 무너져 가고 있으며, 수집된 물의 절반 이상이 손실되고 곳곳에서 누수가 발생합니다. 상황을 개선할 유인은 거의 없고 책임지는 사람도 없습니다. 체계에 책임성과 경쟁을 도입하려면 이 부문을 민영화해야 합니다."
 ITA_privatize_water_distribution_decision_repeal: "상수도 국유화"
 ITA_private_water: "상수도를 민영화함"
 ITA_privatize_museum_system: "박물관 민영화"
 ITA_privatize_museum_system_desc: "이탈리아는 어느 나라보다 역사 유물, 고고학 유적, 기념비적 건축물의 밀도가 높지만, 이탈리아 박물관은 관광객 유치에서 유럽의 동료들에 뒤처져 있습니다. 다른 많은 분야와 마찬가지로 이 유적들의 운영은 감시를 거의 받은 적이 없으며, 그 결과 시대에 맞춰 적응하거나 경쟁력을 갖출 유인이 없습니다."
 ITA_privatize_museum_system_decision: "박물관 민영화"
 ITA_privatize_museum_system_decision_desc: "이탈리아는 어느 나라보다 역사 유물, 고고학 유적, 기념비적 건축물의 밀도가 높지만, 이탈리아 박물관은 관광객 유치에서 유럽의 동료들에 뒤처져 있습니다. 다른 많은 분야와 마찬가지로 이 유적들의 운영은 감시를 거의 받은 적이 없으며, 그 결과 시대에 맞춰 적응하거나 경쟁력을 갖출 유인이 없습니다."
 ITA_privatize_museum_system_decision_repeal: "박물관 국유화"
 ITA_private_museums: "박물관을 민영화함"
 ITA_further_protect_workers_rights_decision: "노동자 권리 개선"
 ITA_further_protect_workers_rights_decision_desc: "무기한 계약 노동자는 이미 이탈리아에서 가장 보호받는 범주이지만, 퇴직자와 더불어 여전히 가장 큰 유권자층이므로 이들을 달래는 것은 지지율을 높게 유지하는 손쉬운 득표 전략입니다."
 ITA_further_protect_workers_rights_decision_repeal: "새 노동자 권리 철회"
 ITA_save_struggling_companies_decision: "부실 기업 구제"
 ITA_save_struggling_companies_decision_desc: "경쟁력 없는 기업의 생존을 보장하는 일은 결코 저렴하지 않지만, 선거가 오면 노동자와 노동조합은 누가 자신들의 일자리를 구했는지 분명 기억할 것입니다."
 ITA_save_struggling_companies_decision_repeal: "부실 기업 구제 중단"
 ITA_let_companies_fail_decision: "기업 도산 방치"
 ITA_let_companies_fail_decision_desc: "상당한 비중을 지닌 기업이 파산 직전에 놓일 때마다 이탈리아 국가나 지방 행정은 일자리를 지키기 위해 폐업을 막아 왔습니다. 이 값비싼 관행은 정치적 이득이 크지만 경제의 효율성을 크게 떨어뜨립니다. 더 생산적인 기업이 시장 점유율을 차지할 수 있도록 기업이 무너지게 두어야 합니다."
 ITA_let_companies_fail_decision_repeal: "기업 도산 방치 정책 폐지"
 ITA_strengthen_citizenship_income: "시민 소득 강화"
 ITA_strengthen_citizenship_income_desc: "채용 자체를 위한 채용은 행정 효율을 크게 떨어뜨리는 불편한 결과를 낳았습니다. \\"도움이 필요한\\" 사람들에게 직접 돈을 이전함으로써 이를 해결할 수 있을지도 모릅니다. 우리는 법령으로 빈곤을 폐지할 것입니다."
 ITA_citizenship_income_decision: "시민 소득"
 ITA_citizenship_income_decision_desc: "채용 자체를 위한 채용은 행정 효율을 크게 떨어뜨리는 불편한 결과를 낳았습니다. \\"도움이 필요한\\" 사람들에게 직접 돈을 이전함으로써 이를 해결할 수 있을지도 모릅니다. 우리는 법령으로 빈곤을 폐지할 것입니다."
 ITA_citizenship_income_decision_repeal: "시민 소득 취소"
 ITA_claim_tunisia: "튀니지 영유권 주장"
 ITA_claim_tunisia_desc: "튀니지는 우리가 움직여 제4의 해안 계획의 일부로 영유하기 전에 프랑스에 점령되었습니다. 이제 다시 시도할 기회가 생겼습니다."
 ITA_claim_lybia: "리비아 재확보"
 ITA_claim_lybia_desc: "우리는 수십 년간 우리 식민지였던 리비아를 해방하기 위해 튀르크와 힘겹게 싸웠습니다. 리비아를 제4의 해안에 통합하려는 우리의 계획을 재개해야 합니다."
 ITA_claim_eritrea: "에리트레아 재확보"
 ITA_claim_eritrea_desc: "에리트레아는 우리가 떠나도록 강요받은 뒤 참담한 상황에 놓였으며, 우리의 통치를 복원하는 것은 그들에게 선물이 될 것입니다."
 ITA_claim_somalia: "소말리아 재확보"
 ITA_claim_somalia_desc: "소말리아는 우리가 떠나도록 강요받은 뒤 참담한 상황에 놓였으며, 우리의 통치를 복원하는 것은 그들에게 선물이 될 것입니다."
 ITA_claim_ethiopia: "에티오피아 재확보"
 ITA_claim_ethiopia_desc: "에티오피아는 우리가 떠나도록 강요받은 뒤 참담한 상황에 놓였으며, 우리의 통치를 복원하는 것은 그들에게 선물이 될 것입니다."
 ITA_oil_deal_egypt: "이집트 석유 거래"
 ITA_oil_deal_egypt_desc: "이집트는 수에즈 운하 덕분에 우리 물자, 특히 이집트에서도 생산되는 석유의 상당 부분이 지나가는 필수적인 경유지입니다. 이집트와 유리한 무역 협정을 확보해야 하며, 우리의 군사력이 그 조건을 최대한 유리하게 만들어 줄 것입니다."
 ITA_gulf_black_gold: "페르시아만 석유 거래"
 ITA_gulf_black_gold_desc: "페르시아만 국가들은 우리의 전쟁 산업에 필수적인 상당한 양의 석유를 생산합니다."
 ITA_levant_oil_deal: "레반트 석유 거래"
 ITA_levant_oil_deal_desc: "시리아와 이라크는 석유 대량 생산국이며, 석유가 이탈리아로 자유롭게 흘러들도록 보장하는 상호 무역 협정은 양측 모두에게 이익이 될 것입니다."
 ITA_persian_oil_deal: "이란 석유 거래"
 ITA_persian_oil_deal_desc: "이란은 주요 석유 생산국이며, 그 에너지 자원은 우리의 늘어나는 수요에 필수적일 것입니다."
 ITA_demand_carniola: "카르니올라 요구"
 ITA_demand_carniola_desc: "'이스트리아, 피우메, 달마티아는 슬로베니아도 크로아티아도 아니다.' 지중해를 지배하려면 이탈리아는 발칸을 장악해야 합니다. 우리는 이웃들이 새로 그려진 국경을 받아들이도록 강요할 것이며, 그러지 않으면 막을 수 없는 우리 군대가 힘으로 국경을 다시 그릴 것입니다."
 ITA_demand_dalmatia: "달마티아 요구"
 ITA_demand_dalmatia_desc: "'이스트리아, 피우메, 달마티아는 슬로베니아도 크로아티아도 아니다.' 지중해를 지배하려면 이탈리아는 발칸을 장악해야 합니다. 우리는 이웃들이 새로 그려진 국경을 받아들이도록 강요할 것이며, 그러지 않으면 막을 수 없는 우리 군대가 힘으로 국경을 다시 그릴 것입니다."
 ITA_reclaim_ionian_islands: "이오니아 제도 요구"
 ITA_reclaim_ionian_islands_desc: "코르푸와 자킨토스 같은 이오니아 제도는 수 세기 동안 이탈리아의 땅이었으며, 우리는 이를 되찾아야 합니다."
 ITA_our_grisons: "이탈리아계 스위스 수복"
 ITA_our_grisons_desc: "티치노와 그라우뷘덴은 스위스의 이탈리아어권 지역이며, 독일인이나 프랑스인과 함께하기보다 동포와 함께하는 편이 훨씬 나을 것입니다."
 ITA_our_corsica: "코르시카 수복"
 ITA_our_corsica_desc: "코르시카는 지리적으로 이탈리아에 속하며 수 세기 동안 제노바의 통치를 받았습니다. 우리 본토 지역의 통일을 마침내 완성할 때입니다."
 ITA_our_nizza: "니스 수복"
 ITA_our_nizza_desc: "니스는 리소르지멘토 시기에 사부아와 함께 어리석게도 프랑스에 양도되었습니다. 마침내 우리의 통일을 완성하기 위해 이를 되찾을 때입니다."
 ITA_recover_alps: "알프스 지역 수복"
 ITA_recover_alps_desc: "알프스 지역은 제국의 중심지인 이탈리아 반도의 핵심적인 자연 방벽입니다. 이탈리아를 지키기 위해 이를 수복하는 것이 시급합니다."
 ITA_attack_on_america_spirit: "미국 공격"
 ITA_attack_on_america_spirit_desc: "미국은 우리나라의 침공과 제2차 세계 대전에서의 이탈리아 몰락의 배후에 있었습니다. 이후 이탈리아는 쇠퇴하기만 했으나, 이제 우리는 세계 열강 사이에서 마땅한 자리를 되찾았습니다. 따라서 마침내 복수할 때입니다. 워싱턴을 불태우고, 로마의 후손들의 진정한 힘을 미국인들에게 보여줍시다!"
 ITA_pax_romana: "팍스 로마나"
 ITA_pax_romana_desc: "로마의 마지막 운명이 마침내 손에 닿을 곳에 있으며, 우리는 온 지구를 제국의 독수리 아래 영원히 통일할 것입니다."
 ITA_diplomatic_focus_TT: "이 중점의 설명에서 이 분기의 다른 나라들에 제안할 수 있는 거래의 효과를 확인할 수 있습니다."
 ITA_strive_for_neutrality: "중립을 추구"
 ITA_strive_for_neutrality_desc: "역사는 제국이 번개같이 무너질 수 있으며 너무 성급하게 한쪽을 택하는 것이 위험할 수 있음을 보여 주었습니다."
 ITA_industrial_cooperation_with_japan: "일본과의 산업 협력"
 ITA_industrial_cooperation_with_japan_desc: "이탈리아와 일본은 모두 국제 무역과 수출을 지향하는 강력한 제조업 부문을 갖고 있습니다. 협력은 양측 모두에게 이익이 될 것입니다."
 ITA_security_cooperation_with_mexico: "멕시코와의 안보 협력"
 ITA_security_cooperation_with_mexico_desc: "멕시코는 우리와 마찬가지로 카르텔이라는 강력한 범죄 조직의 역사를 갖고 있습니다. 이 조직들은 마약 밀수에 있어 우리 마피아와 자주 협력합니다. 그들과 협력하면 이 불법 거래를 약화시키는 데 도움이 될 것입니다."
 ITA_trade_deal_with_australia: "오스트레일리아와 친교"
 ITA_trade_deal_with_australia_desc: "오스트레일리아에는 상당한 이탈리아계 공동체가 있으며 원자재의 주요 수출국이므로, 무역 협정은 양국 모두에게 큰 이익이 될 수 있습니다."
 ITA_trade_deal_with_canada: "캐나다와 친교"
 ITA_trade_deal_with_canada_desc: "캐나다는 원자재의 주요 수출국이며 이탈리아 식품 수출에 대한 수요가 큽니다. 무역 협정은 양국 모두에게 큰 이익이 될 수 있습니다."
 ITA_befriend_india: "인도와 친교"
 ITA_befriend_india_desc: "인도는 머지않아 지구상에서 인구가 가장 많은 나라가 될 것이며, 주요 행위자가 되는 것은 불가피하므로 지금 친교를 맺는 것이 현명합니다."
 ITA_befriend_north_african_countries: "북아프리카 국가들과 친교"
 ITA_befriend_north_african_countries_desc: "지중해 반대편은 북아프리카 국가들이 장악하고 있으며, 유럽으로 건너오려는 이주민 문제에서 협력하려면 이들과 친교를 맺는 것이 현명합니다."
 ITA_befriend_south_african_countries: "남아프리카 국가들과 친교"
 ITA_befriend_south_african_countries_desc: "아프리카는 풍요의 땅이며, 이 광물 자원은 우리 산업에 전략적으로 중요합니다. 우리 기업이 우선적으로 접근할 수 있도록 협상하는 것이 현명합니다."
 ITA_befriend_israel: "이스라엘과 친교"
 ITA_befriend_israel_desc: "이스라엘은 농업, 수자원 관리, 무기 등 많은 분야에서 최첨단 기술을 보유한 극도로 발전한 나라이며, 그들과의 협력에서 분명 이익을 얻을 수 있습니다."
 ITA_befriend_israel_TT: "가뭄 발생 가능성이 줄어듭니다."
 ITA_befriend_taiwan: "대만 및 한국과 친교"
 ITA_befriend_taiwan_desc: "대만과 한국은 프로세서를 비롯한 많은 기술 제품의 제조를 선도하는 국가입니다."
 ITA_attempt_join_sco: "SCO 가입"
 ITA_attempt_join_sco_desc: "우리는 한동안 나토 밖에 있었으며, 갑작스러운 동맹 변경은 이웃들의 우정을 얻지 못했습니다. 앞으로 수십 년간 우리의 외교 정책 변화를 굳건히 하기 위해 새로운 동맹들과 함께 SCO에 공식적으로 가입해야 합니다. 이탈리아는 용과 함께합니다!"
 ITA_use_force_decision: "이민 중단"
 ITA_use_force_decision_desc: "통제되지 않는 이민은 악순환입니다. 중산층이 가난한 나라를 떠나 부유한 나라의 하층민이 되고, 현지 하층민의 생존을 위협합니다. 이는 그들의 출신국이 떠난 사람들의 빈자리로 고통받게 하고, 더 많은 사람이 부유한 나라로 떠나게 하여 효과를 키웁니다. 우리는 이 순환에 맞서 싸워야 합니다."
 ITA_use_force_decision_repeal: "이주민 거부 중단"
 ITA_encourage_immigration_decision: "이민 장려"
 ITA_encourage_immigration_decision_desc: "이민은 낮은 출생률과 저임금 노동자 부족을 포함한 우리의 많은 문제를 해결해 줍니다. 이탈리아가 더 많은 이민자를 받아들이는 것이 경제적으로 바람직합니다."
 ITA_encourage_immigration_decision_repeal: "이민 장려 중단"
 ITA_ius_soli: "출생지주의"
 ITA_ius_soli_desc: "출생지주의는 한 국가의 영토에서 태어난 모든 사람이 국적 또는 시민권을 얻는 권리입니다."
 ITA_ius_soli_spirit: "출생지주의"
 ITA_ius_soli_spirit_desc: "출생지주의는 한 국가의 영토에서 태어난 모든 사람이 국적 또는 시민권을 얻는 권리입니다."
 ITA_ius_soli_decision: "출생지주의"
 ITA_ius_soli_decision_desc: "출생지주의는 한 국가의 영토에서 태어난 모든 사람이 국적 또는 시민권을 얻는 권리입니다."
 ITA_ius_soli_decision_repeal: "출생지주의 폐지"
 ITA_ius_scholae: "수학지주의"
 ITA_ius_scholae_desc: "수학지주의는 이탈리아에서 교육 과정을 마친 이민자 자녀에게 시민권을 부여하는 정책을 일컫는 이름입니다."
 ITA_ius_scholae_spirit: "수학지주의"
 ITA_ius_scholae_spirit_desc: "수학지주의는 이탈리아에서 교육 과정을 마친 이민자 자녀에게 시민권을 부여하는 정책을 일컫는 이름입니다."
 ITA_ius_scholae_decision: "수학지주의"
 ITA_ius_scholae_decision_desc: "수학지주의는 이탈리아에서 교육 과정을 마친 이민자 자녀에게 시민권을 부여하는 정책을 일컫는 이름입니다."
 ITA_ius_scholae_decision_repeal: "수학지주의 폐지"
 ITA_encourage_births: "출산 장려"
 ITA_encourage_births_desc: "경제적 장려와 여성의 전통적 역할에 대한 지원은 이민에 의존하지 않고도 출산을 촉진하고 인구 고령화를 되돌리는 데 도움이 될 것입니다."
 ITA_encourage_births_decision: "출산 장려"
