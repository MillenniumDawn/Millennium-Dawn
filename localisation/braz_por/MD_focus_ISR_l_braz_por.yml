 israel_knesset_category: "Knesset de [ISR.GetNameWithFlag]"
 israel_knesset_category_desc: "Gerencie a legislação, as coalizões e o procedimento parlamentar no §4Knesset§!. Aprove leis, satisfaça os parceiros de coalizão e mantenha a maioria de trabalho do governo."
 ISR_knesset_desc_loc: "  O §4Knesset§! é a câmara de representantes (o parlamento) de [ISR.GetNameWithFlag], e \n  tem quatro funções principais: §YAprovar leis§! - o §4Knesset§! tem a única \n  autoridade para aprovar leis - supervisionar o trabalho do governo, eleger o \n  §YPresidente§! de [ISR.GetNameWithFlag] e o controlador do Estado, e deliberar sobre \n  questões de Estado por meio das comissões do §4Knesset§! e do trabalho da\n  Assembleia.\n\n  Para §Ymanter nosso governo§!, devemos §9criar coalizões§! e satisfazer as\n  necessidades dos membros de nossa coalizão, o que também nos dará mais apoio e\n  mais possibilidades de alterar as leis orçamentárias. Nosso apoio e popularidade\n  no §4Knesset§! são representados pela quantidade de cadeiras que temos nele."
