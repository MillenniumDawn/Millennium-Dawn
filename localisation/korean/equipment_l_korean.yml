 CZE_AS_Fighter1: "MiG-21F-13"
 CZE_AS_Fighter1_desc: "MiG-21를 아에로에서 체코 공군의 요구에 생산한 것으로 무장과 비행성능이 향상되었습니다."
 CZE_AS_Fighter2: "아에로 L-23ML"
 CZE_AS_Fighter2_desc: "체코 항공우주 회사들의 합작 개발 계획의 결과물입니다."
 CZE_AS_Fighter3: "아에로 L-39J G/C"
 CZE_AS_Fighter4: "아에로 L-41 볼라프카"
 CZE_AS_Fighter4_desc: "볼라프카는 마하 2.5 이상의 속도를 내는 공중우세기로, 시계외 교전용 무장을 탑재하고 있습니다."
 CZE_AS_Fighter5: "Let-47 오르제슈니크"
 CZE_AS_Fighter5_desc: "Let-47은 추력 편향 엔진으로 엄청난 속도를 낼 수 있으며, 센서를 통해서 적보다 먼저 위치를 알아낼 수 있습니다."
 CZE_AS_Fighter6: "아에로 L-72 블라슈토프카"
 CZE_AS_Fighter6_desc: "블라슈토프카는 모듈식 소프트웨어 설계를 적용한 초음속 순항(슈퍼크루즈) 스텔스 공중우세기입니다. 이 소프트웨어는 핵심 코드와 다양한 무기 제조업체에서 제공한 모듈식 코드가 결합된 형태로 구성되어 있어, 각 무기 시스템 요소가 고유의 목적에 맞춰 개별적으로 코딩될 수 있습니다. 덕분에 소프트웨어 업데이트가 수월해지며 호환성 문제도 거의 발생하지 않습니다."
 CZE_AS_Fighter7: "Let-80 오렐"
 CZE_AS_Fighter7_desc: "Orel is optionally manned, directed-energy-weapons morphing and shapeshifting Air Superiority Fighter with Artificial Intelligence pilot."
