 nsb_heavy_atgm_tech_1: "ATGM lourd de 1ère génération"
 nsb_heavy_atgm_tech_1_desc: "Les missiles antichars guidés (ATGM) lourds étaient les premiers développements de la technologie des missiles conçus pour engager et détruire les véhicules blindés. Ces systèmes utilisaient généralement un guidage manuel vers la ligne de visée (MCLOS), obligeant les opérateurs à diriger manuellement le missile vers la cible tout au long de son vol. Cette méthode exigeait une formation approfondie et exposait les opérateurs aux tirs ennemis pendant le guidage du missile."
