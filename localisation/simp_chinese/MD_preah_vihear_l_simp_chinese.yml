 preah_vihear_news.4.t: "在柏威夏取得决定性胜利"
 preah_vihear_news.4.d_sia: "泰国在柏威夏寺旷日持久的对峙中取得决定性胜利，迫使柬埔寨做出屈辱的外交让步。虽然没有领土易手，但曼谷方面宣称此次对峙是国家的胜利。"
 preah_vihear_news.4.d_cbd: "柬埔寨在柏威夏寺旷日持久的对峙中取得决定性胜利，迫使泰国做出屈辱的外交让步。虽然没有领土易手，但金边方面宣称此次对峙是国家的胜利。"
 preah_vihear_news.4.o1: "这场竞争暂时告一段落。"
 SIA_preah_vihear_vindicated: "柏威夏平反"
 SIA_preah_vihear_vindicated_desc: "泰国已经获得了寺庙建筑群周围有争议的土地，政府正在享受以自己的方式解决长期边界争端的政治红利。"
 SIA_preah_vihear_humiliation: "柏威夏羞辱"
 SIA_preah_vihear_humiliation_desc: "柬埔寨现在控制了柏威夏周围的争议地区，这一损失在政治上引起了各界的共鸣，被认为是外交和武力的双重失败。"
 CBD_preah_vihear_vindicated: "柏威夏平反"
 CBD_preah_vihear_vindicated_desc: "柬埔寨已经控制了寺庙群周围的争议地区，政府正在享受长期边界争端按照其自身条件解决所带来的政治红利。"
 CBD_preah_vihear_humiliation: "柏威夏羞辱"
 CBD_preah_vihear_humiliation_desc: "泰国现在控制了柏威夏周围的争议地区，这一损失在政治上引起了各界的强烈反响，被认为是外交和武力的双重失败。"
 preah_vihear_observers: "印尼边境观察员"
 preah_vihear_observers_desc: "在东盟斡旋下，印尼的非武装观察员驻扎在柏威夏边境，监视停火协议的违反情况，并为两国政府提供一些掩护，使争端得以缓和。"