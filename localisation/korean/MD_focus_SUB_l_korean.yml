 ural_event.48.d: "그들이 우리의 투자 협정 제안에 동의했습니다."
 ural_event.48.a: "좋군"
 URA_revoult_yugra_TT: "§Y[KHM.GetNameWithFlag]§!(이)가 §Y[SOV.GetNameWithFlag]§!에 맞서 §R봉기§!하여 우리의 §G괴뢰국§!이 됩니다."
 URA_revoult_ymao_TT: "§Y[YAM.GetNameWithFlag]§!(이)가 §Y[SOV.GetNameWithFlag]§!에 맞서 §R봉기§!하여 우리의 §G괴뢰국§!이 됩니다."
 URA_revoult_region_TT: "§Y페름, 첼랴빈스크, 쿠르간, 오렌부르크§! 등의 지역에서 §R혁명§!이 시작됩니다. §Y[SOV.GetNameWithFlag]§!에 §R선전포고§!합니다."
 URA_referendum_yugra_TT: "우리는 §Y[KHM.GetNameWithFlag]§!에서 주민투표를 실시합니다. 과반수가 우리 체제 가입에 찬성하면 청원이 연방 정부로 전달되며, 연방 정부가 이들을 우리 체제에 포함할지 결정합니다."
 URA_referendum_yamao_TT: "우리는 §Y[YAM.GetNameWithFlag]§!에서 주민투표를 실시합니다. 과반수가 우리 체제 가입에 찬성하면 청원이 연방 정부로 전달되며, 연방 정부가 이들을 우리 체제에 포함할지 결정합니다."
