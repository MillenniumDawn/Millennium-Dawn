 tooltip_remove_productivity_from_state: "§WLa productivité de cet État sera §Rdiminuée§! de §R$PRODUCTIVITY_AMOUNT$§! points.\n §!"
 UKR_develop_t64_strazh_desc: "Le BMPT « Strazh » était un véhicule expérimental ukrainien d'appui aux chars développé sur châssis de T-64.\nLe projet a été développé conjointement par l'usine blindée de Jytomyr, l'usine blindée de Kyiv et la holding d'État Artem, et présenté en 2017.\nLa tourelle d'origine du T-64 a été remplacée par le module de combat téléopéré ukrainien « Douplet », donnant au véhicule un rôle complètement différent de celui du char d'origine.\nLe projet visait à fournir un appui-feu lourdement protégé tout en utilisant des châssis T-64 existants et de l'équipement de combat développé en Ukraine.\n« Strazh » est resté un projet expérimental et n'a pas été adopté en grande série, §Gmais nous pouvons changer cela, n'est-ce pas ?§!"
 UKR_develop_t72amt_desc: "Le T-72AMT était une modernisation ukrainienne du T-72A développée par l'usine blindée de Kyiv pour les forces armées d'Ukraine.\nLa modernisation a introduit le moteur V-84-1, un équipement de vision nocturne amélioré, la visée 1K13 et le système de blindage réactif ukrainien « Nij ».\nLe char a également reçu un équipement de communications moderne et le système de navigation SN-3003 « Basalt », tandis que des éléments du train de roulement ont été améliorés avec des composants développés pour le T-80.\nLa visée 1K13 permettait au char modernisé d'employer le système d'arme guidée « Kombat ».\nLe T-72AMT visait une façon relativement économique de rapprocher les T-72 existants des exigences opérationnelles ukrainiennes modernes."
 UKR_modernize_zsu_23_4m_a1_spaa_desc: "Le ZSU-23-4M-A1 « Rokatch » est une modernisation ukrainienne du canon antiaérien automoteur soviétique ZSU-23-4 « Chilka ».\nLa modernisation remplace l'équipement de conduite de tir et d'observation obsolète par un système numérique moderne, améliorant la capacité du véhicule à détecter et suivre les cibles aériennes.\nLe système conserve les quatre canons automatiques de 23 mm tout en recevant une électronique améliorée et quatre missiles antiaériens à courte portée.\nCes changements améliorent nettement l'efficacité au combat du ZSU-23-4 contre les cibles volant bas."
 UKR_modernize_s125_spaa_desc: "Le S-125-2D est une modernisation ukrainienne du système de missiles surface-air soviétique S-125.\nLa modernisation vise à remplacer des composants électroniques obsolètes et à améliorer la résistance du système à la guerre électronique et aux contre-mesures modernes.\nLe radar et l'équipement de guidage sont modernisés, tandis que le système reçoit des capacités améliorées de détection, de poursuite et d'engagement des cibles aériennes.\nLa modernisation vise à prolonger la vie opérationnelle du S-125 tout en améliorant son efficacité sur le champ de bataille moderne."
 UKR_modernize_s125m_spaa_desc: "Le S-125M était un programme de modernisation ukrainien visant à prolonger la durée de service et les capacités du système de défense aérienne soviétique S-125 « Petchora ».\nLe programme a été mené par des entreprises de défense ukrainiennes dont KB Loutch et Radionix, le travail portant sur la modernisation du missile et de l'équipement de guidage et de conduite de tir.\nLa modernisation comprenait des missiles 5V27D améliorés et le radar FCR-125, remplaçant des éléments importants de l'équipement d'origine soviétique.\nLe projet S-125M a fourni à l'Ukraine un moyen de prolonger nettement la vie utile des S-125 existants sans développer un complexe de défense aérienne entièrement nouveau."
 UKR_modernize_kvadrat_spaa_desc: "Le 2K12M1-2L « Kvadrat-2L » est une modernisation ukrainienne du système de missiles surface-air soviétique 2K12M1 « Kouba ».\nLa modernisation remplace un certain nombre de composants électroniques obsolètes par du matériel moderne de fabrication ukrainienne.\nLe système reçoit des capacités radar et de conduite de tir améliorées, augmentant sa capacité à détecter, suivre et engager des cibles aériennes.\nLa modernisation vise à prolonger la durée de service des 2K12M1 restants tout en améliorant leur efficacité contre les menaces modernes."
 UKR_develop_t38_stylet_spaa_desc: "Le T-38 « Stylet » est un système de missiles surface-air à courte portée ukrainien développé par l'usine Arsenal avec des partenaires biélorusses.\nLe système utilise le missile T382 et est conçu pour engager avions, hélicoptères, missiles de croisière et autres cibles aériennes volant bas.\nLe complexe est monté sur un châssis chenillé, lui offrant une grande mobilité et la capacité d'opérer aux côtés d'unités mécanisées.\nLe développement du T-38 fournit à l'Ukraine un remplaçant moderne des Osa soviétiques à courte portée vieillissants."
 UKR_modernize_rk10_spaa_desc: "Le RK-10 est un missile guidé antiaérien ukrainien développé comme alternative aux missiles vieillissants des systèmes de défense aérienne à courte portée d'époque soviétique.\nIntégrer le RK-10 au système Strela-10 permettrait à ses lanceurs d'utiliser un missile plus récent tout en conservant le véhicule et l'infrastructure de lancement existants.\nLe nouveau missile offre des capacités d'engagement améliorées et permet au système de rester opérationnel sans dépendre de munitions soviétiques de plus en plus obsolètes.\nCette modernisation prolongerait la durée de service de la flotte Strela-10 tout en augmentant son efficacité au combat."
 UKR_develop_kentavr_spaa_desc: "Le ZRAK « Kentavr » était un concept ukrainien de nouveau système antiaérien automoteur développé comme évolution du projet « Pereach » antérieur.\nLe projet a été redessiné autour de deux canons automatiques jumelés de 40 mm, remplaçant le concept antérieur basé sur un canon antiaérien de 57 mm, tout en conservant une composante missile et un équipement de conduite de tir dédié.\nLe concept « Kentavr » visait à combiner la détection radar des cibles avec un système de conduite de tir électro-optique, permettant au véhicule d'engager des cibles aériennes au canon comme au missile.\nLe système était prévu autour d'un châssis chenillé dérivé de la plateforme de char ukrainienne prospective développée par le bureau d'études Morozov de Kharkiv dans le cadre du programme « Molot »/« Bokser »."
 UKR_modernize_planes_category: "Moderniser nos aéronefs de combat"
 UKR_modernize_planes_category_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_main\n\n\n\n\n\n\n\n\nNous pouvons consacrer du temps et de l'argent à rechercher et tester des modernisations pour les aéronefs et hélicoptères d'époque soviétique utilisés par notre force aérienne. Et quand du temps aura passé et que nous aurons gagné de l'expérience — nous pourrons même tenter de construire des conceptions nationales uniques."
 UKR_modernize_su25_m1_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_su25m1_for_tooltip\n\n\n\n\n\n\n\n\nLe Su-25M1 est une modernisation ukrainienne de l'aéronef soviétique d'appui rapproché Su-25.\nLa modernisation introduit une navigation, des communications et un équipement de ciblage améliorés tout en conservant la cellule et les capacités d'armement existantes de l'aéronef.\nLes systèmes améliorés accroissent la précision des armes non guidées et permettent à l'aéronef d'opérer plus efficacement dans des conditions de combat modernes.\nLa modernisation prolonge aussi la vie opérationnelle de la flotte ukrainienne de Su-25."
 UKR_modernize_su27_1m_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_su271m_for_tooltip\n\n\n\n\n\n\n\n\nLe Su-27-1M est une modernisation ukrainienne du chasseur soviétique Su-27.\nLe programme introduit des systèmes de navigation, de communication, d'identification et électroniques de bord améliorés pour accroître l'efficacité de combat de l'aéronef.\nL'avionique améliorée offre une meilleure conscience situationnelle et améliore la capacité de l'aéronef à employer des armes modernes.\nLa modernisation permet au Su-27 de rester en service tout en réduisant les limitations imposées par son équipement d'origine de l'ère soviétique."
 UKR_modernize_mig29_mu2_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_mig29mu1_for_tooltip\n\n\n\n\n\n\n\n\nLe MiG-29MU2 est une modernisation ukrainienne du chasseur soviétique MiG-29 développée par l'usine d'État de réparation aéronautique de Lviv.\nLa modernisation s'appuie sur le programme MU1 antérieur et introduit des améliorations plus étendues de l'avionique, de la navigation et des systèmes de ciblage de l'aéronef.\nL'aéronef reçoit des capacités améliorées pour employer des armes guidées et non guidées modernes contre des cibles aériennes comme terrestres.\nLe programme MU2 vise à transformer le MiG-29 en un aéronef de combat multirôle plus capable."
 UKR_modernize_mig29_mu1_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_mig29mu2_for_tooltip\n\n\n\n\n\n\n\n\nLe MiG-29MU1 est une modernisation ukrainienne du chasseur soviétique MiG-29.\nLe programme introduit une électronique de bord améliorée et un système modernisé d'alerte radar et de navigation.\nL'équipement amélioré accroît la conscience situationnelle du pilote et permet à l'aéronef d'opérer plus efficacement dans des conditions de combat modernes.\nLa modernisation MU1 sert aussi d'étape intermédiaire vers des améliorations plus étendues du MiG-29."
 UKR_develop_an_bfv_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_an_bfv_development_for_tooltip\n\n\n\n\n\n\n\n\nL'aéronef de chasse Antonov proposé était un projet conceptuel pour le développement d'un aéronef de combat de conception ukrainienne.\nLe projet visait à utiliser l'expérience de l'Ukraine en conception et production aéronautiques pour créer un chasseur moderne sans s'appuyer entièrement sur des dessins étrangers.\nL'aéronef incorporerait une avionique, des armes et des solutions aérodynamiques modernes tout en étant adapté aux capacités de l'industrie aéronautique ukrainienne.\nBien que le projet soit resté au stade de proposition, son développement pourrait fournir le fondement d'une future génération d'aéronefs de combat ukrainiens."
 UKR_develop_bm21_k: "Développer le LRM §YBM-21K§!"
 UKR_develop_bm21_k_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_bm21k_for_tooltip\n\n\n\n\n\n\n\n\nLe BM-21K est une modernisation ukrainienne du système de lance-roquettes multiple soviétique BM-21 « Grad ».\nLe système est monté sur un châssis de camion ukrainien KrAZ moderne et reçoit un équipement de navigation, de communication et de conduite de tir amélioré.\nLa modernisation améliore la mobilité du système et permet aux équipages de préparer et de conduire les missions de tir plus efficacement.\nLe BM-21K offre un moyen relativement peu coûteux de moderniser la large flotte ukrainienne de lanceurs Grad de l'ère soviétique."
 UKR_develop_bastion03: "Développer le LRM §Y'Bastion-03'§!"
 UKR_develop_bastion03_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_bastion03_for_tooltip\n\n\n\n\n\n\n\n\nLe « Bastion-03 » est un système de lance-roquettes multiple ukrainien développé comme modernisation du BM-27 « Ouragan » soviétique par l'usine de réparation de Chepetivka.\nLe système est basé sur un châssis de camion moderne.\nLa modernisation améliore la mobilité et réduit le temps nécessaire pour préparer le lanceur au tir.\nLe Bastion-03 permettrait à l'Ukraine de continuer à utiliser les roquettes existantes de 220 mm tout en remplaçant le châssis vieillissant de l'ère soviétique."
 UKR_develop_Vilkha: "Développer une nouvelle génération MLRS §Y'Vilkha'§!"
 UKR_develop_Vilkha_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_vilkha_for_tooltip\n\n\n\n\n\n\n\n\nLe « Vilkha » est un système de lance-roquettes multiple ukrainien développé à partir du BM-30 « Smerch » soviétique par le bureau d'études Luch.\nLe projet remplace les roquettes non guidées d'origine par de nouveaux missiles guidés équipés d'un système de guidage ukrainien.\nLe système est conçu pour offrir une précision considérablement améliorée tout en conservant le haut potentiel destructeur et la portée d'un LRPM lourd.\nLe développement du Vilkha représente une transition de l'artillerie-roquettes non guidée de l'ère soviétique vers des capacités de frappe de précision modernes."
 UKR_develop_bureviy: "Développer un MLRS de nouvelle génération §Y'Bureviy'§!"
 UKR_develop_bureviy_desc: "\n\n\n\n\n\n£GFX_UKR_desctext_modernize_sov_bastion03_for_tooltip\n\n\n\n\n\n\n\n\nLe « Bureviy » est un système de lance-roquettes multiple ukrainien conçu comme remplacement moderne de la famille vieillissante du BM-27 « Ouragan ».\nLe système est monté sur un châssis moderne Tatra T815-7T3R2T et incorpore des systèmes numériques de conduite de tir et de navigation.\nLe Bureviy est conçu pour utiliser les roquettes Smerch existantes de 220 mm ainsi que des munitions plus récentes de développement ukrainien.\nLa combinaison d'électronique moderne, d'une mobilité améliorée et de la compatibilité avec les munitions existantes fait du système une modernisation pratique de l'artillerie-roquettes de l'Ukraine."
 UKR_modernize_mi24pu1: "Développer une modernisation du §YMi-24PU1§!"
 UKR_modernize_mi24pu1_desc: "Le Mi-24PU-1 est une modernisation ukrainienne du Mi-24P développée par l'usine de réparation aéronautique de Konotop « Aviakon » avec des entreprises de l'industrie de défense ukrainienne.\nL'hélicoptère a reçu des moteurs TV3-117VMA-SBM1V-02 plus puissants de Motor Sich, une avionique et un équipement de navigation modernisés, et des systèmes pour opérer avec de l'équipement de vision nocturne.\nLa modernisation a aussi intégré le système de protection Adros KT-01AV, le système de visée laser FPM-01KV et une visée ASP-17VPM-V améliorée.\nLe programme a impliqué des entreprises dont Motor Sich, Adron, TsKB Arsenal et l'usine d'instruments d'Izium, les versions ultérieures utilisant aussi de l'équipement électro-optique ukrainien.\nLe Mi-24PU-1 a donc combiné une grande révision de l'hélicoptère d'origine avec de nouveaux moteurs, avionique, protection et systèmes de visée ukrainiens."
 UKR_develop_nota_desc: "L'objet 477A1 Nota est un char de bataille principal expérimental soviétique avancé doté d'une tourelle inhabitée, d'un compartiment équipage isolé et d'un puissant canon principal de 152 mm."
 UKR_modernize_nota_desc: "L'objet 477A1 « Nota » est un développement ukrainien du projet soviétique de char de bataille principal avancé objet 477 « Molot ».\nLa conception incorpore un compartiment équipage lourdement protégé, un compartiment de combat inhabité et un armement principal puissant.\nLa modernisation introduirait une électronique, des systèmes de protection et d'autres composants actualisés tout en adaptant la conception aux technologies disponibles pour l'industrie de défense ukrainienne.\nBien que le projet n'ait jamais atteint la production de masse, un développement ultérieur pourrait fournir la base d'un char de bataille principal ukrainien avancé."
 ukr_history.63.t: "L'arrestation de Ioulia Tymochenko"
 ukr_history.63.d: "L'ancienne vice-Première ministre chargée du carburant et de l'énergie a été emmenée à la prison de Loukianivska pour des accusations de contrebande de gaz et de faux documents datant de ses années aux Systèmes énergétiques unis. Elle a été limogée en janvier après s'être attaquée aux schémas de troc du secteur, et l'affaire a été ouverte en quelques semaines. Un tribunal jugera la détention illégale et la libérera au bout de quarante-deux jours ; d'ici là elle n'est plus une ministre en froid avec le président, mais le visage de l'opposition à lui."
 ukr_history.63.a: "So be it."
 UKR_reorganize_navy_finish_project_133: "Finish the construction of §G2 §YProject 133§! patrol ships§! for Coast Guards"
 UKR_reorganize_navy_finish_project_133_desc: "\n\n\n\n\n\n£UKR_desctext_project_133_for_tooltip\n\n\n\n\n\n\n\n\nWe can allocate some budget in order to finally finish the prolonged production of §G2§! of Soviet-designed 'Project 133' patrol ships for our Coast Guards."
 UKR_reorganize_navy_finish_11451_construction_flag: " Completed event §YFinish construction of 2 'Project 11451' corvettes§! with any selected option"
 ukraine_reorganize_navy_finish_project_133.1.name: "Finish construction of 2 'Project 133' patrol ships for Coast Guards"
 ukraine_reorganize_navy_finish_project_133.1.desc: "We have examined 2 hulls of 'Project 133' patrol ships for Coast Guards, 'BG53 'Polissia' and BG54 'Slobozhanshchyna', and now can select the best suited direction we will move forward in our decision on their fate.\n\nWe can either invest more money and finish extensive repair of both ships or scrap the worse condition ship, BG54 'Slobozhanshchyna', and use parts from it to rebuild BG53 'Polissia' faster."
 ukraine_reorganize_navy_finish_project_133.1.a: "Finish both ships"
 ukraine_reorganize_navy_finish_project_133.1.b: "Cannibalize 'Slobozhanshchyna' to finish 'Polissia'"
 ukraine_reorganize_navy_built_simferopol_recon_ship_program_over_flag: "We have finished construction of Simferopol recon ship"
 ukr_economy_rate.1.t: "NBU Cuts the Discount Rate by 1%"
 ukr_economy_rate.1.d: "The National Bank of Ukraine has lowered its discount rate, citing slowing price growth and a stabilising hryvnia. Commercial banks are expected to follow with cheaper credit lines, and foreign funds that had written Ukraine off after 1998 are quietly returning to the market. Industry, starved of working capital for a decade, may finally be able to borrow at rates that do not consume the entire margin."
 ukr_economy_rate.1.a: "Somewhat cheaper money"
