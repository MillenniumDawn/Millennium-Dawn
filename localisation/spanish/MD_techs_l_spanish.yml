 OLV: "Vehículo de lanzamiento orbital (OLV)"
 OLV_desc: "Un vehículo de lanzamiento o cohete portador es un vehículo propulsado por cohetes utilizado para llevar una carga útil desde la superficie de la Tierra al espacio, generalmente a la órbita terrestre o más allá."
 OLV1: "OLV 1965"
 OLV1_desc: "Un vehículo de lanzamiento o cohete portador es un vehículo autopropulsado por cohetes que se utiliza para transportar una carga útil desde la superficie de la Tierra al espacio, generalmente a la órbita terrestre o más allá.\n\nVehículo de lanzamiento orbital (OLV 1965):\n§YLanzamiento espacial§!:\nMasa de carga útil: §Y2000§! kg | Fiabilidad: §Y60%§!\n§YProducción§!:\nPrecio por unidad: $§Y0.006§! mil millones | Industria civil por unidad: §Y2§! | Días de producción por unidad: §Y240§!"
 OLV2: "OLV 1975"
 OLV2_desc: "Un vehículo de lanzamiento o cohete portador es un vehículo autopropulsado por cohetes que se utiliza para transportar una carga útil desde la superficie de la Tierra al espacio, generalmente a la órbita terrestre o más allá.\n\nVehículo de lanzamiento orbital (OLV 1975):\n§YLanzamiento espacial§!:\nMasa de carga útil: §Y4000§! kg | Fiabilidad: §Y65%§!\n§YProducción§!:\nPrecio por unidad: $§Y0.008§! mil millones | Industria civil por unidad: §Y2§! | Días de producción por unidad: §Y260§!"
 OLV3: "OLV 1985"
 OLV3_desc: "Un vehículo de lanzamiento o cohete portador es un vehículo autopropulsado por cohetes que se utiliza para transportar una carga útil desde la superficie de la Tierra al espacio, generalmente a la órbita terrestre o más allá.\n\nVehículo de lanzamiento orbital (OLV 1985):\n§YLanzamiento espacial§!:\nMasa de carga útil: §Y6000§! kg | Fiabilidad: §Y70%§!\n§YProducción§!:\nPrecio por unidad: $§Y0.01§! mil millones | Industria civil por unidad: §Y2§! | Días de producción por unidad: §Y280§!"
 OLV4: "OLV 1995"
 OLV4_desc: "Un vehículo de lanzamiento o cohete portador es un vehículo autopropulsado por cohetes que se utiliza para transportar una carga útil desde la superficie de la Tierra al espacio, generalmente a la órbita terrestre o más allá.\n\nVehículo de lanzamiento orbital (OLV 1995):\n§YLanzamiento espacial§!:\nMasa de carga útil: §Y8000§! kg | Fiabilidad: §Y75%§!\n§YProducción§!:\nPrecio por unidad: $§Y0.014§! mil millones | Industria civil por unidad: §Y2§! | Días de producción por unidad: §Y300§!"
 OLV5: "OLV 2005"
 OLV5_desc: "Un vehículo de lanzamiento o cohete portador es un vehículo autopropulsado por cohetes que se utiliza para transportar una carga útil desde la superficie de la Tierra al espacio, generalmente a la órbita terrestre o más allá.\n\nVehículo de lanzamiento orbital (OLV 2005):\n§YLanzamiento espacial§!:\nMasa de carga útil: §Y12000§! kg | Fiabilidad: §Y80%§!\n§YProducción§!:\nPrecio por unidad: $§Y0.028§! mil millones | Industria civil por unidad: §Y2§! | Días de producción por unidad: §Y320§!"
 OLV6: "OLV 2015"
 OLV6_desc: "Un vehículo de lanzamiento o cohete portador es un vehículo autopropulsado por cohetes que se utiliza para transportar una carga útil desde la superficie de la Tierra al espacio, generalmente a la órbita terrestre o más allá.\n\nVehículo de lanzamiento orbital (OLV 2015):\n§YLanzamiento espacial§!:\nMasa de carga útil: §Y16000§! kg | Fiabilidad: §Y85%§!\n§YProducción§!:\nPrecio por unidad: $§Y0.06§! mil millones | Industria civil por unidad: §Y2§! | Días de producción por unidad: §Y340§!"
 part_reusable_OLV6: "modificación parcialmente reutilizable"
 part_reusable_OLV6_desc: "Los sistemas de lanzamiento parcialmente reutilizables son sistemas de lanzamiento de etapas múltiples en los que algunas etapas regresan a la Tierra y se utilizan de nuevo. Recuperar el acelerador (booster) recorta el coste y el tiempo de construcción de cada cohete que producimos."
 OLV7: "OLV 2025"
 OLV7_desc: "Un vehículo de lanzamiento o cohete portador es un vehículo autopropulsado por cohetes que se utiliza para transportar una carga útil desde la superficie de la Tierra al espacio, generalmente a la órbita terrestre o más allá.\n\nVehículo de lanzamiento orbital (OLV 2025):\n§YLanzamiento espacial§!:\nMasa de carga útil: §Y20000§! kg | Fiabilidad: §Y90%§!\n§YProducción§!:\nPrecio por unidad: $§Y0.12§! mil millones | Industria civil por unidad: §Y2§! | Días de producción por unidad: §Y360§!"
 full_reusable_OLV7: "modificación totalmente reutilizable"
 full_reusable_OLV7_desc: "Los vehículos de lanzamiento totalmente reutilizables son sistemas donde cada componente de etapa regresa a la Tierra y puede volarse de nuevo. Retirar por completo el hardware desechable multiplica el ahorro en costes y tiempos de construcción en todo el programa de lanzamientos."
 OLV8: "OLV 2035"
 OLV8_desc: "Un vehículo de lanzamiento o cohete portador es un vehículo autopropulsado por cohetes que se utiliza para transportar una carga útil desde la superficie de la Tierra al espacio, generalmente a la órbita terrestre o más allá.\n\nVehículo de lanzamiento orbital (OLV 2035):\n§YLanzamiento espacial§!:\nMasa de carga útil: §Y24000§! kg | Fiabilidad: §Y95%§!\n§YProducción§!:\nPrecio por unidad: $§Y0.24§! mil millones | Industria civil por unidad: §Y2§! | Días de producción por unidad: §Y380§!"
 full_reusable_OLV8: "modificación totalmente reutilizable"
 full_reusable_OLV8_desc: "Una rápida rotación entre vuelos, la renovación interna y una cadena de suministro madura eliminan las últimas ineficiencias de una flota reutilizable, recortando aún más los costes y tiempos de construcción."
 ballistic_missile: "Misiles Balísticos"
 ballistic_missile_desc: "Ballistic missiles are a type of missile that uses projectile motion to deliver warheads on a target. The weapons are powered through a brief explosive and large expenditure of fuel and force and the majority of the flight is unpowered. Some missiles are short-range ballistic missile (SRBMs) which remain within the Earth's atmosphere while the largest of these missiles are capable of orbital flight and spend the majority of their flight outside of the atmosphere."
 cruise_missile: "Misiles de Crucero"
 cruise_missile_desc: "Un misil de crucero es un misil guiado autopropulsado no tripulado que mantiene el vuelo mediante sustentación aerodinámica durante la mayor parte de su trayectoria de vuelo. Los misiles de crucero están diseñados para transportar una gran carga útil a largas distancias con gran precisión. Los misiles de crucero modernos son capaces de viajar a altas velocidades subsónicas, supersónicas o hipersónicas, son autónomos y pueden volar en una trayectoria no balística a una altitud extremadamente baja."
 TEL_launched_missiles: "Misiles lanzados por TEL"
 TEL_launched_missiles_desc: "§Y2 TEL§! (transportador lanzador) con §Y1 Lanzador§! por §YBatería§! (2x1)."
