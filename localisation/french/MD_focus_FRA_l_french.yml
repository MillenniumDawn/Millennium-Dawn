 FRA_corporate_systems_events.25.d: "Après plus d'une décennie d'intégration, France Télécom est prête à adopter Orange comme nom de l'ensemble du groupe. Une identité mondiale unifiée offre de la clarté, bien que la France puisse préserver une marque intérieure ou stratégique distincte."
