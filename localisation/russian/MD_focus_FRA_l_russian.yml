 FRA_alstom_manufacturer: "Алстом"
 FRA_alstom_manufacturer_desc: "Компания Alstom, переименованная из GEC Alsthom на Парижской бирже 1998 года, производит во Франции локомотивы, высокоскоростные поезда, вагоны метро, ​​трамваи и системы железнодорожной сигнализации. В результате государственной реструктуризации в 2004 году и продажи энергетического подразделения компании General Electric в 2015 году компания стала заниматься исключительно железнодорожным транспортом; приобретение Bombardier Transportation в 2021 году сделало её крупнейшим производителем подвижного состава за пределами Китая."
 FRA_alstom_manufacturer_trait: "Промышленная база подвижного состава"
 FRA_alstom_manufacturer_trait_desc: "Бельфор, Ла-Рошель, Райхсхоффен, Креспен, Ле-Крезо и Орнан образуют полную цепочку поставок железнодорожных комплектующих внутри Франции, охватывающую тяговое оборудование, кузова, тележки, окончательную сборку и сигнализацию, без использования иностранных компонентов."
 FRA_alstom_branch_high_speed: "Высокоскоростная программа"
 FRA_alstom_branch_urban_transit: "Городской транспорт"
 FRA_alstom_branch_freight_logistics: "Грузовые и логистические железнодорожные перевозки"
 FRA_alstom_tgv_duplex: "TGV Дуплекс"
 FRA_alstom_tgv_duplex_desc: "Двухэтажный поезд TGV Duplex был введен в эксплуатацию в 1996 году и стал стандартным высокоскоростным поездом на перегруженной трассе Париж-Лион, перевозя на 40 процентов больше пассажиров в одном поезде без удлинения платформ."
 FRA_alstom_belfort_power_cars: "Белфорт Пауэр Карс"
 FRA_alstom_belfort_power_cars_desc: "Завод в Бельфоре производит тяговые головки для всех французских высокоскоростных составов. После заключения контракта с компанией Avelia Horizon три четверти его работы сосредоточены в рамках одной программы, что концентрирует затраты и риски в одном цехе."
 FRA_alstom_avelia_horizon: "Авелия Горизонт"
 FRA_alstom_avelia_horizon_desc: "Заказанный компанией SNCF в 2018 году поезд TGV пятого поколения сохраняет двухэтажную компоновку, но укорачивает силовые вагоны, увеличивая вместимость на двадцать процентов при снижении стоимости одного места и, как утверждается, на двадцать процентов сокращая потребление энергии."
 FRA_alstom_avelia_liberty: "Авелия Либерти"
 FRA_alstom_avelia_liberty_desc: "Вариант с откидным кузовом, построенный для Северо-восточного коридора Amtrak, стал первым высокоскоростным поездом Alstom, экспортированным в Соединенные Штаты. Задержки с сертификацией оказались дорогостоящими, но этот заказ позволил компании закрепиться на рынке, ранее закрытом для французского подвижного состава."
 FRA_alstom_la_rochelle_assembly: "Ассамблея Ла-Рошеля"
 FRA_alstom_la_rochelle_assembly_desc: "Завод в Ла-Рошели занимается сборкой пассажирских вагонов для семейства Avelia и проектированием трамваев Citadis. Это крупнейший работодатель на железнодорожном предприятии на Атлантическом побережье, где отрабатываются новые технологии изготовления кузовов перед их внедрением на других заводах."
 FRA_alstom_citadis_tramway: "Трамвай Цитадис"
 FRA_alstom_citadis_tramway_desc: "Низкопольный модульный трамвай Citadis, запущенный в 2000 году, стал стандартным европейским трамваем, поставляемым более чем в шестьдесят городов. Его стандартизированные модули позволяют проектировать и поставлять трамваи для всей сети без необходимости разработки индивидуального проекта."
 FRA_alstom_metropolis_metro: "Метрополис Метро"
 FRA_alstom_metropolis_metro_desc: "Семейство Metropolis включает в себя как беспилотные, так и обычные вагоны метро на единой платформе, размером от легких автоматизированных челночных составов до восьмивагонных магистральных составов. Серийное производство позволяет снизить себестоимость единицы продукции по сравнению с индивидуальными проектами национальных производителей."
 FRA_alstom_urbalis_cbtc: "Урбалис CBTC"
 FRA_alstom_urbalis_cbtc_desc: "Urbalis — это система управления движением поездов от Alstom, основанная на связи, позволяющая управлять поездами без машиниста и обеспечивать интервалы движения менее девяноста секунд. Разработанная в Креспене и Вильербане, она является сигнальным уровнем, лежащим в основе большинства контрактов компании по автоматизированному метрополитену."
 FRA_alstom_innovia_automated_transit: "Инновационный автоматизированный транспорт"
 FRA_alstom_innovia_automated_transit_desc: "Автоматизированная система перевозки пассажиров Innovia, унаследованная от компании Bombardier, соединяет терминалы аэропортов и густонаселенные городские районы. Благодаря коротким составам и фиксированной направляющей, это самый экономичный способ увеличить пропускную способность существующих железнодорожных путей."
 FRA_alstom_grand_paris_express: "Гранд Париж Экспресс"
 FRA_alstom_grand_paris_express_desc: "Крупнейший транспортный проект в Европе включает в себя четыре автоматизированные линии метро и двести километров путей вокруг Парижа. Компания Alstom поставляет подвижной состав и системы сигнализации, а программа гарантирует пропускную способность городской транспортной сети на десятилетие."
 FRA_alstom_prima_locomotives: "Локомотивы Prima"
 FRA_alstom_prima_locomotives_desc: "Семейство электрических и дизельных грузовых локомотивов Prima, построенных в Бельфоре начиная с 2001 года, заменило устаревший парк SNCF и было экспортировано в Марокко, Сирию и Китай. Они являются основной рабочей лошадкой как для французских железнодорожных грузовых перевозок, так и для военных железнодорожных перевозок."
 FRA_alstom_prima_h4_hybrid: "Prima H4 Hybrid"
 FRA_alstom_prima_h4_hybrid_desc: "Маневровый локомотив H4 сочетает в себе дизель-генераторные установки и аккумуляторную батарею, что позволяет сократить расход топлива при работе на сортировочных станциях примерно вдвое и обеспечивает бесшумное движение внутри депо и сортировочных пунктов."
 FRA_alstom_atlas_ertms: "Атлас ERTMS"
 FRA_alstom_atlas_ertms_desc: "Atlas — это разработка компании Alstom, реализующая европейскую систему управления железнодорожным движением, заменяющую несовместимые национальные системы сигнализации единым континентальным стандартом. Оборудование для поездов и придорожное оборудование производится на заводе Crespin."
 FRA_alstom_coradia_ilint: "Coradia iLint"
 FRA_alstom_coradia_ilint_desc: "Первый региональный поезд на водородных топливных элементах поступил в коммерческую эксплуатацию в 2018 году, курсируя по неэлектрифицированным ответвлениям железных дорог, единственным выбросом которого была вода. Это устраняет необходимость прокладки контактной сети над маршрутами, капитальные затраты на которые никогда не оправдали бы себя."
 FRA_alstom_bombardier_transportation: "Транспортная компания Bombardier"
 FRA_alstom_bombardier_transportation_desc: "Завершенная в январе 2021 года после того, как Европейская комиссия заблокировала слияние с Siemens Mobility, сделка по приобретению Bombardier Transportation удвоила заводы и портфель заказов Alstom, сделав компанию вторым по величине производителем рельсового транспорта в мире."
 FRA_crusade_time: "Верните себе наше имение"
 FRA_crusade_time_desc: "Будь то возвращение земель наших франкских предков или отвоевание Святой Земли, нам в любом случае придётся противостоять силам Европы и Ближнего Востока. Пришло время вступить в войну."
 FRA_vigipirate_surveillance: "План Виджипирата"
 FRA_vigipirate_surveillance_desc: "Для защиты наших граждан от потенциальных террористических атак нам необходимо проявлять большую осторожность и быть более бдительными."
