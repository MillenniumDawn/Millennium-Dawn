 border_war_training_failure.1.t:0 "Acidente de Treinamento"
 border_war_training_failure.1.d:0 "Um acidente durante os exercícios de campo deixou vários soldados feridos e levantou questões sobre a segurança operacional."
 border_war_training_failure.1.a:0 "Revisar o exercício"
 border_war_training_failure.2.t:0 "Acidente de Armas Combinadas"
 border_war_training_failure.2.d:0 "Uma colisão durante o treinamento de armas combinadas danificou equipamentos e feriu vários soldados."
 border_war_training_failure.2.a:0 "Suspender o treino"
 border_war_tension_failure.1.t:0 "Ação de Fronteira Rechaçada"
 border_war_tension_failure.1.d:0 "As forças rivais responderam à última provocação com fogo preciso, custando vidas e perturbando os preparativos locais."
 border_war_tension_failure.1.a:0 "Recuar"
 border_war_operation_blocked.1.t:0 "Operação Cancelada"
 border_war_operation_blocked.1.d:0 "A posse, o controle, a presença de tropas ou as condições diplomáticas mudaram antes de os preparativos terminarem. A operação foi cancelada sem gastar progresso."
 border_war_operation_blocked.1.a:0 "Entendido"
 border_war_outcome.1.t:0 "Avanço Bem-Sucedido"
 border_war_outcome.1.d:0 "Nossas forças prevaleceram no último confronto e ganharam impulso rumo ao seu objetivo local."
 border_war_outcome.1.a:0 "Consolidar a posição"
 border_war_outcome.2.t:0 "Operação Rechaçada"
 border_war_outcome.2.d:0 "As forças rivais repeliram o ataque e reduziram nosso impulso em torno do estado disputado."
 border_war_outcome.2.a:0 "Reavaliar o plano"
 border_war_outcome.3.t:0 "Impasse na Fronteira"
 border_war_outcome.3.d:0 "O confronto terminou sem resultado decisivo, custando parte do nosso impulso local."
 border_war_outcome.3.a:0 "Manter a linha"
 pak_raj_border_claim.1.t:0 "Uma Exigência Territorial"
 pak_raj_border_claim.1.d_420:0 "[FROM.GetNameDefCap] usou repetidas vitórias locais para exigir Azad Caxemira. A concessão transferiria o estado e reduziria a tensão. A recusa abriria uma crise mais ampla."
