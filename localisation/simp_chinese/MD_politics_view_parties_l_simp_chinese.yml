 ITA.possibile_loc_key_desc: ""
 ITA.articolo_uno_loc_key: "£ITA_Articolo_Uno 第一条"
 ITA.articolo_uno_loc_key_desc: ""
 ITA.sinistra_italiana_loc_key: "£ITA_Sinistra_Italiana 意大利左翼"
 ITA.sinistra_italiana_loc_key_desc: ""
 ITA.Neutral_Libertarian: "£generic_Neutral_Libertarian_small Bonino List"
 ITA.Neutral_Libertarian_desc: "即使从名字上看，激进党并不是一个传统的政党，因为它不参加选举。相反，他们决定将重点放在通过其他方式解决问题的运动上。但是，与此同时，为了具体的选举，在党内环境中出现了许多专门的选举名单。激进党支持经济自由、和平主义和进步思想，主要反对禁酒主义、政府干预以及争取堕胎和离婚等社会权利。"
 ITA.fare_loc_key: "£ITA_Fare 采取行动阻止衰退"
 ITA.fare_loc_key_desc: ""
 ITA.radicali_loc_key: "£ITA_Radicali 激进的意大利人"
 ITA.radicali_loc_key_desc: ""
 ITA.Neutral_Communism: "£ITA_neutral_communism 重建共产党"
 ITA.Neutral_Communism_desc: "共产主义复兴党是1991年意大利共产党垮台后出现的众多政党之一。与新的意大利共产党不同，它公开反对斯大林主义、反法西斯主义和和平主义。它认为，共产主义革命的目标能够而且必须通过和平和民主的方式实现。"
 ITA.Neutral_green: "£ITA_non_aligned_greens 绿党联合会"
 ITA.Neutral_green_desc: "绿党联合会是一个环保主义、社会民主主义和和平主义政党，成立于1986年以应对切尔诺贝利核事故。与世界上许多绿党一样，它生来就有保护环境的崇高意图，此后发起了许多反科学和破坏环境的斗争，例如反对核能或垃圾焚烧炉的斗争，直接助长了“邻避”行为。它相信保护环境的唯一关键是扭转无休止增长的范式，因此接受了一种独特的反资本主义和反全球主义观点。"
