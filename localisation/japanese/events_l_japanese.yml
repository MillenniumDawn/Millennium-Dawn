 influence.51.a_tt: "どの装備を送るか決めることができる！"
 influence.51.b_tt: "考え直そう。我々には銃が必要だ！"
 influence.54.t: "自動影響力行使 月間報告"
 influence.54.d: "[?nations_influenced|0] have been successfully influenced on [GetDateText]. The following nations have been influenced from our ongoing influence efforts:\n[auto_influence_target_display]"
 influence.54.a: "了解、ありがとう！"
 econvent.11.t: "大手金融機関が破綻"
 econvent.11.d: "大手金融機関が破綻したというニュースが世間を駆け巡っている。メディアは大騒ぎとなり、不安が広がっている。政府に対して対応を求める声が上がっており、さらなる危機の到来が懸念されている。我々はどうすべきだろうか？"
 econvent.11.a: "大きすぎて潰せない……"
 econvent.11.b: "ただのビジネスだ……"
 econvent.12.t: "[FROM.GetName] Financial Crisis Ripples"
 econvent.12.d: "The recent crisis in [FROM.GetName] has caused much strife in our nation as the effects of their crisis are felt in our nation. Our interconnected economies are now both suffering from the weight of this crisis."
 econvent.12.a: "Issue relief funds."
 econvent.12.b: "The market above all."
 sco.12.t: "[FROM.GetName]が$SHANGHAI_PACT$を結成！"
 sco.12.d: "[FROM.GetName]は、[USA.GetFactionName]に対抗するために$SHANGHAI_PACT$を結成した。我々は既に[FROM.GetAdjective]の影響を強く受けており、さらにSCOの一員であるため、この新しい派閥への加盟を余儀なくされている。"
 sco.12.a: "了解"
 korea.38.t: "Korea asks us to withdraw our troops in Japan and Korea"
 korea.38.d: "Korea made a formal request to us today for the withdrawal of our troops in Japan and Korea."
 korea.38.a: "We will not accede to their unreasonable demands."
 korea.38.b: "Well, maybe it's time for the soldiers to go home......"
 SouthSudan.2.t: "東部におけるスーダン反乱軍"
 SouthSudan.2.d: "スーダンでの紛争の間、エリトリアは複数の反乱グループを自国内に匿い、彼らが東部の我が国領土を攻撃するのを許してきた。これらの反乱軍は「東部戦線」と名乗り、[SSU.GetNameDef]と同盟を結んでいるようだ。この同盟により、彼らはより大規模な攻撃を行うことが可能となり、その目標は我が国の貿易拠点であるポートスーダンを奪取することにある。"
 SouthSudan.2.a: "エリトリアを呪ってやる！"
 SouthSudan.3.t: "Sudanese Rebels In The Blue Nile"
 SouthSudan.3.d: "With the rise of Mengistu back into power in [ETH.GetName], he has once again started supporting the SPLA. By finding anti-government sympathisers among Sudanese refugees living in [ETH.GetName], he together with the SPLA have armed those people and sent them across the border into the Blue Nile."
 SouthSudan.3.a: "エチオピアを呪ってやる！"
 SouthSudan.4.a: "Send our army across the border!"
 SouthSudan.4.b: "We can't risk it"
 SouthSudanNews.2.a: "興味深い"
