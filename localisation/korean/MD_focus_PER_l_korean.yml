 PER_move_to_baharestan: "마즐리스를 바하레스탄으로 이전"
 PER_move_to_baharestan_desc: "최근 우리 정부는 마즐리스 건물의 위치를 두고 상당히 갈팡질팡해 왔으며, 의회 내 효율성을 높이기 위해 더 나은 장소를 정해 그곳에 정착할 때가 되었습니다."
 PER_dissolve_the_parliament: "마즐리스 해산"
 PER_dissolve_the_parliament_desc: "현재로서는 마즐리스가 [PER.GetFlag] 이란 국가를 번영으로 제대로 이끄는 능력이 없음이 입증되었습니다. 마즐리스를 해산하고 새로운 선거를 실시하면 [PER.GetFlag] 이란 국민이 새로운 대표를 선택하게 할 수 있습니다 \n§W-----------------------------------------------------------------§!\n이 결정은 활성화 후 §H8년§! 동안 §R사용할 수 없습니다§!"
 PER_reschedule_session: "다음 토론 일정 재조정"
 PER_reschedule_session_desc: "우리나라는 신속한 개혁을 정당화하기 위한 대표들의 제안이 절실히 필요합니다. 마즐리스에 다음 토론을 계획보다 2개월 앞당겨 시작하도록 요청하겠습니다.\n§W-----------------------------------------------------------------§!\n이 결정은 활성화 후 §H2년§! 동안 §R사용할 수 없습니다§!"
 PER_accept_constitutionalists_proposal: "£PER_liberalism  £PER_Western_Autocracy   자유주의 블록의 제안"
 PER_accept_constitutionalists_proposal_desc: "\n블록 구성원:\n- 이란 자유주의자\n- 입헌주의자\n§W-----------------------------------------------------------------§!\n자유주의 블록의 제안을 받아들임으로써 우리는 일반 국민에 대한 대우에 참정권을 박탈당했다고 느끼는 이란 사회의 모든 부문이 그간 절실히 찾아 헤맸던 희망을 찾을 수 있도록 [PER.GetFlag] 이란을 개혁할 수 있습니다.\n§W-----------------------------------------------------------------§!\n이 결정은 활성화 후 §H다음 토론§!에서 §R사용할 수 없으나§!, 그다음 토론에서 다시 잠금 해제됩니다."
 PER_accept_west_conservatives_proposal: "£PER_Neutral_conservatism   £PER_conservatism   온건 보수 블록의 제안"
 PER_accept_west_conservatives_proposal_desc: "\n블록 구성원:\n- 민족전선\n- 이란 보수주의자\n§W-----------------------------------------------------------------§!\n온건 보수 블록의 제안을 받아들임으로써 우리는 일부 혁명적 가치에 반대하는 반동 세력이 마침내 국가에 도입되는 새로운 변화를 받아들일 수 있도록 [PER.GetFlag] 이란을 개혁할 수 있습니다.\n§W-----------------------------------------------------------------§!\n이 결정은 활성화 후 §H다음 토론§!에서 §R사용할 수 없으나§!, 그다음 토론에서 다시 잠금 해제됩니다."
 PER_accept_socialist_proposal: "£PER_socialism  £PER_Neutral_Communism   사회주의 블록의 제안"
 PER_accept_socialist_proposal_desc: "\n블록 구성원:\n- 이란당\n- 공산 노동자당\n§W-----------------------------------------------------------------§!\n사회주의 블록의 제안을 받아들임으로써 우리는 노동 계급이 우리의 새로운 정부 및 가치와 따뜻한 절충점을 찾을 수 있도록 [PER.GetFlag] 이란을 개혁할 수 있습니다.\n§W-----------------------------------------------------------------§!\n이 결정은 활성화 후 §H다음 토론§!에서 §R사용할 수 없으나§!, 그다음 토론에서 다시 잠금 해제됩니다."
 PER_accept_radical_leftist_proposal: "£PER_communism  £PER_anarchist_communism   극좌 블록의 제안"
 PER_accept_radical_leftist_proposal_desc: "\n블록 구성원:\n- 투데당\n- 인민 무자헤딘 기구 (MEK)\n§W-----------------------------------------------------------------§!\n극좌 블록의 제안을 받아들임으로써 우리는 국가가 현재의 반좌파적 입장과 가치에서 급격히 벗어나도록 [PER.GetFlag] 이란을 개혁할 수 있습니다.\n§W-----------------------------------------------------------------§!\n이 결정은 활성화 후 §H다음 토론§!에서 §R사용할 수 없으나§!, 그다음 토론에서 다시 잠금 해제됩니다."
 PER_accept_neo_islamist_proposal: "£PER_autocracy  £generic_Mod_Vilayat_e_Faqih_small   투쟁적 이슬람주의 블록의 제안"
 PER_accept_neo_islamist_proposal_desc: "\n블록 구성원:\n- 곰 신학교 교사회\n- 이슬람 혁명수비대 (IRGC)\n§W-----------------------------------------------------------------§!\n투쟁적 이슬람주의 블록의 제안을 받아들임으로써 우리는 국가가 이슬람주의적 과거로 되돌아가고 또 다른 친정권 우호 국가권을 재건하도록 [PER.GetFlag] 이란을 개혁할 수 있습니다.\n§W-----------------------------------------------------------------§!\n이 결정은 활성화 후 §H다음 토론§!에서 §R사용할 수 없으나§!, 그다음 토론에서 다시 잠금 해제됩니다."
 PER_accept_moderate_islamist_proposal: "£PER_Neutral_Muslim_Brotherhood  £PER_neutral_Social   온건 이슬람주의 블록의 제안"
 PER_accept_moderate_islamist_proposal_desc: "\n블록 구성원:\n- 희망의 녹색 길\n- 이란 자유 운동\n§W-----------------------------------------------------------------§!\n온건 이슬람주의 블록의 제안을 받아들임으로써 우리는 사회에 남아 있는 강경파와 떠오르는 세속 계층 사이에서 국가가 적절한 절충점을 찾을 수 있도록 [PER.GetFlag] 이란을 개혁할 수 있습니다.\n§W-----------------------------------------------------------------§!\n이 결정은 활성화 후 §H다음 토론§!에서 §R사용할 수 없으나§!, 그다음 토론에서 다시 잠금 해제됩니다."
 PER_accept_libertarian_proposal: "£PER_Neutral_Autocracy  £generic_Neutral_Libertarian_small   자유지상주의 블록의 제안"
 PER_accept_libertarian_proposal_desc: "\n블록 구성원:\n- 재시작당\n- 자유지상주의자\n§W-----------------------------------------------------------------§!\n자유지상주의 블록의 제안을 받아들임으로써 우리는 시장이 더 자유로워지고 정부 규제에 덜 얽매이도록 [PER.GetFlag] 이란을 개혁할 수 있습니다.\n§W-----------------------------------------------------------------§!\n이 결정은 활성화 후 §H다음 토론§!에서 §R사용할 수 없으나§!, 그다음 토론에서 다시 잠금 해제됩니다."
 PER_accept_green_proposal: "£PER_Neutral_green   녹색 블록의 제안"
 PER_accept_green_proposal_desc: "\n블록 구성원:\n- 이란 녹색당\n§W-----------------------------------------------------------------§!\n녹색 블록의 제안을 받아들임으로써 우리는 이란인들이 후세대를 위해 나라를 보존할 수 있도록 환경이 우선시되게 [PER.GetFlag] 이란을 개혁할 수 있습니다.\n§W-----------------------------------------------------------------§!\n이 결정은 활성화 후 §H다음 토론§!에서 §R사용할 수 없으나§!, 그다음 토론에서 다시 잠금 해제됩니다."
 PER_accept_corporate_proposal: "£generic_oligarchism_small   기업 블록의 제안"
 PER_accept_corporate_proposal_desc: "\n블록 구성원:\n- 이란 과두 세력\n§W-----------------------------------------------------------------§!\n기업 블록의 제안을 받아들임으로써 우리는 기업에 대한 규제가 사실상 사라지고 기업이 정부의 간섭을 거의 받지 않고 운영될 수 있도록 [PER.GetFlag] 이란을 개혁할 수 있습니다.\n§W-----------------------------------------------------------------§!\n이 결정은 활성화 후 §H다음 토론§!에서 §R사용할 수 없으나§!, 그다음 토론에서 다시 잠금 해제됩니다."
 PER_accept_monarchist_proposal: "£PER_Nat_Populism_small  £PER_monarchism   군주주의 블록의 제안"
 PER_accept_monarchist_proposal_desc: "\n블록 구성원:\n- 범이란주의당\n- 팔라비 왕조\n§W-----------------------------------------------------------------§!\n군주주의 블록의 제안을 받아들임으로써 우리는 국가가 외세로부터 독립을 수호하는 데 집중하고 국민에게 더욱 민족주의적인 가치를 다시 불어넣는 데 집중하도록 [PER.GetFlag] 이란을 개혁할 수 있습니다.\n§W-----------------------------------------------------------------§!\n이 결정은 활성화 후 §H다음 토론§!에서 §R사용할 수 없으나§!, 그다음 토론에서 다시 잠금 해제됩니다."
 PER_accept_ultra_nationalist_proposal: "£PER_fascism_alt   극단적 민족주의 블록의 제안"
 PER_accept_ultra_nationalist_proposal_desc: "\n블록 구성원:\n- 이란 왕국 의회 (톤다르)\n§W-----------------------------------------------------------------§!\n극단적 민족주의 블록의 제안을 받아들임으로써 우리는 국가가 모든 이슬람적 이상을 버리고 지역 초강대국, 나아가 세계적 초강대국으로서 다시 자리매김하도록 [PER.GetFlag] 이란을 개혁할 수 있습니다. \n§W-----------------------------------------------------------------§!\n이 결정은 활성화 후 §H다음 토론§!에서 §R사용할 수 없으나§!, 그다음 토론에서 다시 잠금 해제됩니다."
 PER_accept_artesh_proposal: "£PER_military_junta   군부 블록의 제안"
 PER_accept_artesh_proposal_desc: "\n블록 구성원:\n- 아르테시 (군대)\n§W-----------------------------------------------------------------§!\n군부의 제안을 받아들임으로써 우리는 국가가 군대와 그 확장, 그리고 어떤 수단을 써서라도 이루어지는 현대화에 더 많은 비중을 두도록 [PER.GetFlag] 이란을 개혁할 수 있습니다. \n§W-----------------------------------------------------------------§!\n이 결정은 활성화 후 §H다음 토론§!에서 §R사용할 수 없으나§!, 그다음 토론에서 다시 잠금 해제됩니다."
 PER_accept_reformists_proposal: "£PER_Mod_Vilayat_e_Faqih   개혁파 블록의 제안"
 PER_accept_reformists_proposal_desc: "\n블록 구성원:\n- 개혁파 \n§W-----------------------------------------------------------------§!\n개혁파의 제안을 받아들임으로써 우리는 더 큰 개인의 자유와 외부 세계와의 연결을 원하는 젊은 세대를 달랠 수 있도록 개혁할 수 있습니다. \n§W-----------------------------------------------------------------§!\n이 결정은 활성화 후 §H다음 토론§!에서 §R사용할 수 없으나§!, 그다음 토론에서 다시 잠금 해제됩니다."
 PER_accept_principalists_proposal: "£PER_Vilayat_e_Faqih   원칙주의 블록의 제안"
 PER_accept_principalists_proposal_desc: "\n블록 구성원:\n- 원칙주의자 \n§W-----------------------------------------------------------------§!\n원칙주의자의 제안을 받아들임으로써 우리는 국가가 샤리아 법에 대한 더 엄격한 해석을 고수하고, 호메이니 아야톨라가 제시한 혁명적 가치의 지침을 한 마디 한 마디 그대로 따르도록 개혁할 수 있습니다.\n§W-----------------------------------------------------------------§!\n이 결정은 활성화 후 §H다음 토론§!에서 §R사용할 수 없으나§!, 그다음 토론에서 다시 잠금 해제됩니다."
 PER_purging_the_remnants: "잔재 정리"
 PER_purging_the_remnants_desc: "마즐리스는 이슬람 공화국 정권의 남은 잔재를 약화하는 것을 지지한다고 의결했습니다. 우리는 그들의 영향력을 약화하고 선전을 퍼뜨릴 모든 기회를 약화하는 임무를 맡았습니다."
 PER_turning_the_clock_forward: "시계를 앞으로 돌리다"
 PER_turning_the_clock_forward_desc: "마즐리스는 더 큰 국가적 단합 의식을 만들기 위해 국가 기관의 세속화를 지지한다고 의결했습니다."
 PER_deep_pockets_deeper_ties: "두둑한 주머니, 더 깊은 유대"
 PER_deep_pockets_deeper_ties_desc: "마즐리스는 전 세계 경제 강국들과 새로운 유대를 구축하는 것을 지지한다고 의결했으며, 우리나라가 각국 정부와 무역 협정을 체결하도록 장려했습니다."
 PER_the_shift_never_ends: "교대는 끝나지 않는다"
 PER_the_shift_never_ends_desc: "마즐리스는 새로운 일자리 창출과 실업률을 20% 아래로 낮추려는 집중적인 노력을 지지한다고 의결했습니다."
 PER_clean_records: "티끌 하나 없는 기록"
 PER_clean_records_desc: "마즐리스는 우리 정부의 부패와 맞서 싸울 것을 의결했으며, 경제 둔화를 일으키는 요인들을 처리한 후 경제를 세계 다른 나라들과 동등한 수준으로 끌어올릴 새로운 방법을 찾도록 했습니다."
 PER_is_this_thing_on: "이거 켜져 있나요?"
 PER_is_this_thing_on_desc: "마즐리스는 더 나은 네트워크 기반시설을 구축하여 국가 동부를 디지털화하고, 남부 호르모즈간 오스탄(주)에 더 많은 사무직 일자리를 창출할 것을 의결했습니다."
 PER_disparity_has_no_place_here: "격차는 설 자리가 없다"
 PER_disparity_has_no_place_here_desc: "마즐리스는 격차가 존재하는 오스탄(주)에 새로운 기반시설을 건설할 것을 의결했으며, 정부에 해당 지역에 적절한 시설을 건설하도록 요구했습니다."
 PER_iran_is_full: "이란은 만원이다"
 PER_iran_is_full_desc: "마즐리스는 [PER.GetFlag] 이란으로 유입되는 원치 않는 난민을 막는 방편으로 시스탄 발루체스탄 국경에 즉시 새로운 장벽을 건설할 것을 의결했습니다."
 PER_the_green_pastures: "푸른 초원"
 PER_the_green_pastures_desc: "마즐리스는 현대화 노력과 과거의 일정한 질서를 유지하는 것 사이에서 균형을 맞추는 방편으로, 국가의 비옥한 지역에 있는 농민들을 위한 새로운 농업 시설을 즉시 건설할 것을 의결했습니다."
 PER_safety_security_stability: "안전, 보안, 안정"
 PER_safety_security_stability_desc: "마즐리스는 이란 국민에게 안전과 보안, 안정을 다시 가져다주기 위해 경찰력에 대한 재정 지원을 늘리기 시작할 것을 의결했습니다."
 PER_our_left_hand: "우리의 왼손"
 PER_our_left_hand_desc: "마즐리스는 과거 우리가 크게 영향을 미쳤던 국가들에 대한 일정한 통제권을 유지하기 위해 [IRQ.GetFlag] 이라크, [SYR.GetFlag] 시리아, [KUR.GetFlag] 쿠르디스탄에 대한 영향력을 행사하기 시작할 것을 의결했습니다."
 PER_the_socialist_threat: "사회주의자의 위협"
 PER_the_socialist_threat_desc: "마즐리스는 사회주의 단체와 그 이념이 [PER.GetFlag] 이란의 국익에 매우 확실한 위협이 된다고 의결했으며, 따라서 우리는 그들의 활동을 최대한 단속해야 합니다."
 PER_the_arteries_of_iran: "이란의 동맥"
 PER_the_arteries_of_iran_desc: "마즐리스는 우리가 '[PER.GetFlag] 이란의 동맥'을 보살피고, 필요한 시설을 만들어 [PER.GetFlag] 이란 경제의 심장부로 더 많은 석유를 공급해야 한다고 의결했습니다."
 PER_chess: "체크메이트"
 PER_chess_desc: "마즐리스는 우리가 외세로부터 국익을 지킬 수 있고 이웃 국가들에 우리의 국익을 행사할 수 있음을 세계에 보여주어야 한다고 의결했습니다."
 PER_productive_minds: "생산적인 두뇌"
 PER_productive_minds_desc: "마즐리스는 우리가 국가의 생산성을 높이고, 학생들이 제대로 된 교육을 받을 수 있도록 학업 능력을 지원해야 한다고 의결했습니다."
 PER_open_hearts: "열린 마음"
 PER_open_hearts_desc: "마즐리스는 이민자들이 들어와 정착할 수 있도록 국가 동부에 더욱 안전하고 안정적인 환경을 조성해야 한다고 의결했습니다."
 PER_centers_of_innovation: "혁신 센터"
 PER_centers_of_innovation_desc: "마즐리스는 시라즈와 에스파한에 새로운 혁신 센터를 세울 것을 의결했습니다. 이렇게 하면 수도 바로 바깥에 있는 오스탄(주)들을 신속하게 현대화할 수 있습니다."
 PER_green_feel_to_paper: "종이에 느껴지는 푸른 감촉"
 PER_green_feel_to_paper_desc: "마즐리스는 우리의 경제 정책이 장기적으로 유지할 가치가 있음을 증명하는 방편으로, 국가 부채와 맞서 싸우고 가능한 한 빨리 금리를 낮춰야 한다고 의결했습니다."
 PER_eyes_on_the_future: "미래를 주시하다"
 PER_eyes_on_the_future_desc: "마즐리스는 공항을 최첨단 레이더 기술을 갖추도록 개선할 것을 의결했습니다. 또한 마즐리스는 컴퓨팅 작업을 수행하는 새로운 방법의 연구를 시작하도록 요구했습니다."
 PER_rights_of_workers: "노동자의 권리"
 PER_rights_of_workers_desc: "마즐리스는 국내 노동조합에 힘을 실어줌으로써 노동자들을 위한 더 나은 근로 조건을 도입할 것을 의결했습니다."
 PER_the_lights_shine_bright: "불은 계속 켜져 있다"
 PER_the_lights_shine_bright_desc: "마즐리스는 전력을 생산하기 위한 새로운 재생 에너지 시설을 건설하고 최소 80 GW의 발전 할당량을 충족할 것을 의결했습니다."
 PER_no_place_for_fascists: "파시스트의 설 자리는 없다"
 PER_no_place_for_fascists_desc: "마즐리스는 급진적 이념에 맞선 싸움을 시작하고 더욱 건설적이고 안전한 이란을 증진할 것을 의결했습니다."
 PER_old_friends: "오랜 친구들"
 PER_old_friends_desc: "마즐리스는 러시아와 그 긴밀한 동맹국들에 대한 영향력을 행사하고 경쟁에 나설 것을 의결했습니다. 이를 통해 우리는 이 지역에서 영향력을 확대하고 해당 국가에 로비 조직을 구축할 수 있습니다."
 PER_the_pride_of_kordestan: "쿠르데스탄의 자부심"
 PER_the_pride_of_kordestan_desc: "마즐리스는 시간이 지나며 부족해진 일자리를 보충하기 위해 쿠르데스탄 지역에 새로운 공장을 건설할 것을 명하였습니다."
 PER_health_knowledge_and_prosperity: "건강, 지식, 번영"
 PER_health_knowledge_and_prosperity_desc: "마즐리스는 국민의 생활 여건을 선진국 수준으로 끌어올리기 위해 건강, 지식, 번영의 원칙을 도입할 것을 명하였습니다."
 PER_puppet_kurdistan: "쿠르드인 보호"
 PER_puppet_kurdistan_desc: "마즐리스는 서부에 있는 쿠르드 민족과 그들의 자치국을 어떤 수단을 써서라도 보호해야 한다고 명하였습니다."
 PER_help_the_kurds: "양날의 망치"
 PER_help_the_kurds_desc: "마즐리스는 쿠르드인에게 가했던 학대를 만회하기 위해 우리나라의 쿠르드 지역에 새로운 기반시설을 건설할 것을 명하였습니다."
 PER_kermanshahs_supply: "케르만샤의 산소"
 PER_kermanshahs_supply_desc: "마즐리스는 케르만샤 지역으로 흘러드는 보급이 부족한 점을 보완하기 위해 이곳에 새로운 보급 기지를 설치할 것을 명하였습니다."
 PER_military_loyalty: "군의 충성 확보"
 PER_military_loyalty_desc: "마즐리스는 아르테시와 국내 정치에서의 군 내부 로비 세력에 대한 숙청을 명하였습니다. 군의 정치 개입이 해롭고 잠재적으로 위험하다고 판단하였기 때문입니다."
 PER_our_old_leverage: "과거의 영향력"
 PER_our_old_leverage_desc: "마즐리스는 한때 자랑스럽게 행사했던 레반트 일부 국가들에 대한 영향력을 '복원'할 것을 명하였습니다."
 PER_our_thorns: "우리의 가시"
 PER_our_thorns_desc: "마즐리스는 우리나라와 군을 향한 모든 적대 행위를 억지하기 위해 새로운 미사일 시설을 건설할 것을 명하였습니다."
 PER_explosive_deterrent: "폭발적 억지력"
 PER_explosive_deterrent_desc: "마즐리스는 잠재적 가해자들을 억지하기 위해 가용한 모든 시설을 동원하여 핵탄두를 제조할 것을 명하였습니다."
 PER_a_return_to_the_past: "과거로의 일격"
 PER_a_return_to_the_past_desc: "마즐리스는 우리나라를 보다 보수적이고 이슬람적인 법률로 이끄는 개혁을 단행할 것을 명하였습니다."
 PER_righteous_roads: "의로운 도로"
 PER_righteous_roads_desc: "마즐리스는 종교색이 짙은 곰 주와 호라산 주에 새로운 시설을 건설할 것을 명하였습니다."
 PER_firm_hand_of_the_law: "법의 단호한 손길"
 PER_firm_hand_of_the_law_desc: "마즐리스는 우리의 능력이 의문의 여지가 없음을 국민에게 입증함으로써 법에 대한 신뢰를 다시 회복해야 한다고 명하였습니다."
 PER_demand_our_payments: "대가 요구"
 PER_demand_our_payments_desc: "마즐리스는 이라크에 마땅히 받아야 할 배상금을 요구할 것을 명하였습니다. 이를 통해 추가 자금을 국민에게 재투자할 수 있습니다."
 PER_nuclear_activities: "핵 활동"
 PER_nuclear_activities_desc: "마즐리스는 국내 핵 역량을 강화하기 위해 새로운 원자로를 건설하는 것이 전적으로 우리의 권리라고 명하였습니다."
 PER_the_mediator: "중재자"
 PER_the_mediator_desc: "마즐리스는 오만과 그 지역 내 활동에 지정학적으로 더 많은 관심을 기울여야 한다고 명하였습니다."
 PER_take_flight: "비상"
 PER_take_flight_desc: "마즐리스는 공항의 품질 관리를 개선하고 공항을 더 현대적이고 안전하게 개선할 것을 명하였습니다."
 PER_the_SCO: "상하이의 친구들"
 PER_the_SCO_desc: "마즐리스는 중국의 친구들과의 관계를 개선하고, 우리나라의 생활 기반시설과 산업을 보다 저렴하게 개선하는 방법으로서 상하이 협력 기구에 가입해야 한다고 명하였습니다."
 PER_economic_disturbance: "경제적 혼란"
 PER_economic_disturbance_desc: "마즐리스는 우리나라가 기본적인 경제 수준에서 기능하는 능력을 갉아먹고 있는 IRGC 반군을 처리해야 한다고 명하였습니다."
 PER_the_tax_haven: "조세 피난처"
 PER_the_tax_haven_desc: "마즐리스는 개인과 기업의 성장을 위한 더 나은 경제 여건을 조성하기 위해 모든 주체에 대한 세금을 10% 이하로 낮춰야 한다고 명하였습니다."
 PER_money_everywhere: "어디에나 있는 돈"
 PER_money_everywhere_desc: "마즐리스는 국제 투자 보유분을 늘리고 우리나라와 우리 경제가 세계 경제에 더욱 적극적으로 관여해야 한다고 명하였습니다."
 PER_right_to_bear_arms: "무기 소지의 권리"
 PER_right_to_bear_arms_desc: "마즐리스는 일반 시민의 무기 소지 권리를 보장하는 법안을 통과시켜야 한다고 명하였습니다. 이 법안은 재시작당이 주도하고 있습니다."
 PER_exploiting_competition: "기생충 착취"
 PER_exploiting_competition_desc: "마즐리스는 우리의 번영에 기대어 이득을 보는 일부 국가들에 대해 경제 성장을 앞서 나가기 시작해야 한다고 명하였습니다."
 PER_controlling_competition: "경쟁 통제"
 PER_controlling_competition_desc: "마즐리스는 경제 문제에서 경쟁자들이 우리에게 도전하지 못하도록 저지할 새로운 방법을 찾기 시작해야 한다고 명하였습니다."
 PER_renewable_capitals: "재생 가능한 수도"
 PER_renewable_capitals_desc: "마즐리스는 오염에 맞서기 위해 주요 도시에 재생 에너지 시설을 건설할 것을 명하였습니다."
 PER_nuclear_fumes: "핵 연기"
 PER_nuclear_fumes_desc: "마즐리스는 국가 에너지가 보다 재생 가능한 원천으로 전환되는 것을 돕기 위해 원자력 발전소 건설에 착수해야 한다고 명하였습니다."
 PER_farms_over_factories: "공장보다 농장"
 PER_farms_over_factories_desc: "마즐리스는 기존에 계획된 공장 대신 새로운 농업 부지 조성을 우선해야 한다고 명하였습니다. 공장이 농장보다 환경에 더 해롭다고 판단되었기 때문입니다."
 PER_the_electric_grid: "전력망 강화"
 PER_the_electric_grid_desc: "마즐리스는 국내 일부 지역에서 발생하는 정전을 막기 위해 전력망을 강화하도록 배터리 단지를 더 건설해야 한다고 명하였습니다."
 PER_oil_warehouses: "검은 황금"
 PER_oil_warehouses_desc: "마즐리스는 이란의 '검은 황금'이라 불리는 석유를 저장할 새로운 시설을 건설해야 한다고 명하였습니다."
 PER_priority_treatment: "우선 대우"
 PER_priority_treatment_desc: "마즐리스는 해당 지역의 안정도와 높은 생산성을 확보하기 위해 석유 자원이 있는 주를 더 높은 우선순위로 대우해야 한다고 명하였습니다."
 PER_look_the_other_way: "눈감아주기"
 PER_look_the_other_way_desc: "마즐리스는 기업이 산업을 확장하며 급성장할 수 있도록, 사업을 운영하려는 기업에 대한 과세에 있어 눈감아주어야 한다고 명하였습니다."
 PER_open_borders_more_workers: "열린 국경, 더 많은 노동자"
 PER_open_borders_more_workers_desc: "마즐리스는 우리나라로 유입될 수 있는 노동자의 증가를 허용하기 위해 국경을 개방해야 한다고 명하였습니다."
 PER_intervention_in_the_east: "동부 개입"
 PER_intervention_in_the_east_desc: "마즐리스는 [TAL.GetFlag] 탈레반에 맞서 싸우기 위해 [AFG.GetFlag] 아프가니스탄에 [PER.GetFlag] 이란군을 파병해야 한다고 명하였습니다."
 PER_lessons_of_white_revolution: "백색 혁명의 결실"
 PER_lessons_of_white_revolution_desc: "마즐리스는 백색 혁명과 같이 국민에게 '번영과 근대성의 시대'를 열어주어야 한다고 명하였습니다."
 PER_brother_nations: "형제 국가"
 PER_brother_nations_desc: "마즐리스는 [AFG.GetFlag] 아프가니스탄과 [TAJ.GetFlag] 타지키스탄에 대한 우리의 영향력을 재확립해야 한다고 명하였습니다."
 PER_fight_against_evil: "악과의 싸움"
 PER_fight_against_evil_desc: "마즐리스는 레바논 남부에 있는 범죄자들에 맞서 전쟁을 벌여야 한다고 명하였습니다."
 PER_our_lost_jewel: "도난당한 보석"
 PER_our_lost_jewel_desc: "마즐리스와 그 의장이 [BHR.GetFlag] 바레인을 '도난당한 보석'으로 규정하였으므로, 가능한 한 빨리 바레인 전체를 되찾아야 한다고 명하였습니다."
 PER_the_lions_jungle: "사자의 정글"
 PER_the_lions_jungle_desc: "마즐리스는 외세의 영향으로부터 완전한 독립을 달성해야 한다고 명하였으며, 마즐리스 의장은 [PER.GetFlag] 이란과 그 영토를 '사자의 정글, 오직 사자만의 것'이라고 선언하였습니다."
 PER_prosperity_of_the_people: "국민의 번영"
 PER_prosperity_of_the_people_desc: "마즐리스는 국민의 소득이 지역 기준의 평균 중간값을 충족하도록 보장해야 한다고 명하였습니다. [PER.GetFlag] 이란인이 다른 이들보다 적게 버는 시대는 끝나야 합니다."
 PER_insurgencies_nowhere: "동부 해결책"
 PER_insurgencies_nowhere_desc: "마즐리스는 '동부 분쟁'에 대한 해결책을 찾아야 한다고 명하였으며, 극단적 민족주의자들은 국경에서 격화되는 분쟁을 끝내기 위한 이란의 개입을 지지한다고 선언하였습니다."
 PER_jobs_in_the_arms_industry: "무기 산업의 일자리"
 PER_jobs_in_the_arms_industry_desc: "마즐리스는 국민을 위한 새로운 일자리를 찾아야 한다고 명하였으며, 확장 가능한 분야 중 하나가 무기 산업입니다."
 PER_clear_skies: "맑은 하늘"
 PER_clear_skies_desc: "마즐리스는 외국 항공기가 우리 모르게 침입하는 것을 막기 위해 새로운 대공 체계를 구축해야 한다고 명하였습니다."
 PER_sound_of_marching_boots: "행군하는 군화 소리"
 PER_sound_of_marching_boots_desc: "마즐리스는 현재 우리 군의 규모를 최소 400,000명까지 늘려야 한다고 명하였습니다."
 PER_endless_stockpiles: "끝없는 비축"
 PER_endless_stockpiles_desc: "마즐리스는 MBT 전차의 비축량을 늘리고, 일부의 묘사보다 우리가 더 강하다는 것을 국민에게 입증해야 한다고 명하였습니다."
 PER_calm_waters: "길들여진 바다"
 PER_calm_waters_desc: "마즐리스는 이 지역에서 우리 해군력의 성장을 촉진하기 위해 새로운 해군 시설을 건설해야 한다고 명하였습니다."
 PER_national_connection: "국가 연결망"
 PER_national_connection_desc: "마즐리스는 전국에 새로운 네트워크를 구축해야 한다고 명하였습니다."
 PER_friends_from_across: "해외의 친구들"
 PER_friends_from_across_desc: "마즐리스는 국가 무역을 증진하기 위해 SCO에 가입해야 한다고 명하였습니다."
 PER_booming_economy: "호황 경제"
 PER_booming_economy_desc: "마즐리스는 무슨 일이 있어도 국민에게 경제적 번영을 가져다주어야 한다고 명하였습니다."
 PER_safe_flight: "안전한 비행"
 PER_safe_flight_desc: "마즐리스는 항공 기반시설을 개선하고 국민에게 이로운 적절한 시설을 구축해야 한다고 명하였습니다."
 PER_seagulls_screech: "갈매기의 울음"
 PER_seagulls_screech_desc: "마즐리스는 국제 무역을 개선하기 위한 더 나은 항만 접근성을 확보하고자 남부에 새로운 항구를 건설할 것을 명하였습니다."
 PER_brothers_to_the_east: "동쪽의 형제들"
 PER_brothers_to_the_east_desc: "마즐리스는 우리와 공통 언어를 공유하는 국가들에서의 입지를 늘려야 한다고 명하였습니다."
 PER_investments_everywhere: "도처의 투자"
 PER_investments_everywhere_desc: "마즐리스는 상당한 금액을 투자하고 그 투자를 1년간 유지해야 한다고 명하였습니다."
 PER_those_in_need: "도움이 필요한 이들"
 PER_those_in_need_desc: "마즐리스는 더 빈곤한 주를 가리키는 '도움이 필요한 이들'의 시설, 기반시설, 생활 여건을 개선해야 한다고 명하였습니다."
 PER_a_place_for_all: "모두를 위한 곳"
 PER_a_place_for_all_desc: "마즐리스는 이주민이 더 많이 몰리기 시작한 지역에 새로운 기반시설을 구축하여 이들의 삶의 질을 개선하고 이란을 모두를 위한 곳으로 만들어야 한다고 명하였습니다."
 PER_productive_promises: "생산적인 약속"
 PER_productive_promises_desc: "마즐리스는 국민에게 더 많은 일자리를 가져다주겠다는 약속을 이행하기 위해 더 많은 사람을 위한 일자리 기회를 창출해야 한다고 명하였습니다."
 PER_faith_in_the_government: "정부에 대한 신뢰"
 PER_faith_in_the_government_desc: "마즐리스는 정부에 대한 신뢰를 회복해야 한다고 명하였으며, 그 방법 중 하나는 부패를 근절하는 것입니다."
 PER_breaks_for_the_needy: "서민을 위한 감면"
 PER_breaks_for_the_needy_desc: "마즐리스는 안정적인 수입을 유지하기 위해 개인에게는 세금 감면을 도입하는 한편 기업에 대한 규제와 세금을 강화해야 한다고 명하였습니다."
 PER_industrialization_of_rural_areas: "농촌 산업화"
 PER_industrialization_of_rural_areas_desc: "마즐리스는 그동안 별다른 관심을 받지 못한 농촌 지역을 산업화해야 한다고 명하였습니다."
 PER_meddling_in_conflicts: "분쟁 개입"
 PER_meddling_in_conflicts_desc: "마즐리스는 튀르키예와 그리스 사이에서 벌어지는 분쟁에 대한 정보를 늘려야 한다고 명하였습니다."
 PER_passive_aggressive_competition: "수동적 공격 경쟁"
 PER_passive_aggressive_competition_desc: "마즐리스는 국민의 정치 참여를 증진해야 한다고 명하였으며, 그 방법 중 하나는 우리 전선의 인기도를 높이는 것입니다."
 PER_new_energy: "새로운 에너지"
 PER_new_energy_desc: "마즐리스는 국민의 가정, 기업, 자동차에 동력을 공급할 새로운 에너지원을 창출해야 한다고 명하였습니다."
 PER_a_thriving_economy: "번창하는 경제"
 PER_a_thriving_economy_desc: "마즐리스는 부채에 맞서고 금리를 더 유리한 수준으로 낮춰야 한다고 명하였습니다."
 PER_intervention_in_afghanistan: "아프가니스탄 개입"
 PER_intervention_in_afghanistan_desc: "마즐리스는 [TAL.GetFlag] 탈레반에 맞서 싸우기 위해 [AFG.GetFlag] 아프가니스탄에 [PER.GetFlag] 이란군을 파병해야 한다고 명하였습니다."
 PER_developing_the_capital: "수도 개발"
 PER_developing_the_capital_desc: "마즐리스는 해당 지역 국민의 사기를 높이기 위해 수도 테헤란의 개발에 착수해야 한다고 명하였습니다."
 PER_syrian_hand: "시리아의 손"
 PER_syrian_hand_desc: "마즐리스는 어떤 수단을 써서라도 시리아 정부를 우리의 영향력 아래에 두어야 한다고 명하였습니다."
 PER_the_armys_suppliers: "군의 수익"
 PER_the_armys_suppliers_desc: "마즐리스는 장비 제조에서 나오는 수익을 늘리기 위해 군의 산업 역량을 강화해야 한다고 명하였습니다."
 PER_ease_of_prayer: "의로움의 길"
 PER_ease_of_prayer_desc: "마즐리스는 종교 및 성지와 도시 안팎의 도로와 기반시설을 개선해야 한다고 명하였습니다."
 PER_our_rightful_money: "마땅한 우리의 돈"
 PER_our_rightful_money_desc: "마즐리스는 1980년대 전쟁의 결과로 이라크가 오랫동안 우리에게 빚지고 있는 배상금을 요구해야 한다고 명하였습니다."
 PER_enemies_on_a_leash: "우리 손에 매인 적"
 PER_enemies_on_a_leash_desc: "마즐리스는 적국의 정부와 경제를 통제함으로써 적들을 우리의 목줄에 묶어두어야 한다고 명하였습니다."
 PER_fighting_foreigners: "외세와의 싸움"
 PER_fighting_foreigners_desc: "마즐리스는 지역 국가들의 독립을 방해하려는 외세와 맞서 싸워야 하며, 요르단에서의 그들의 영향력을 낮춰야 한다고 명하였습니다."
 PER_aiding_the_farmer: "농촌 확장"
 PER_aiding_the_farmer_desc: "마즐리스는 농촌 지역을 확장해야 하며, 특히 더 좋고 현대적인 농장을 건설해야 한다고 명하였습니다."
 PER_fueling_our_revolution: "혁명에 연료를 공급하라"
 PER_fueling_our_revolution_desc: "마즐리스는 '혁명에 연료를 공급'하기 위해 석유 기반시설을 개선해야 한다고 명하였습니다."
 PER_outnumbering_the_enemy: "적을 압도하라"
 PER_outnumbering_the_enemy_desc: "마즐리스는 더 많은 병력을 자랑함으로써 적들의 통계가 상대적으로 열세로 보이도록 모든 적을 압도해야 한다고 명하였습니다."
 PER_safety_with_stability: "안정을 통한 안전"
 PER_safety_with_stability_desc: "마즐리스는 보안을 강화함으로써 국내의 안전과 안정도를 확보해야 한다고 명하였습니다."
 PER_national_deterrents: "국가 억지력"
 PER_national_deterrents_desc: "마즐리스는 적들이 공격하기 전에 다시 한번 생각하도록 막기 위해 새로운 억지력을 창출해야 한다고 명하였습니다."
 PER_exploiting_our_proxies: "대리 세력 활용"
 PER_exploiting_our_proxies_desc: "마즐리스는 수익을 모을 다른 방법을 찾아야 한다고 명하였으며, 일부 의원들은 우리가 대리 세력을 많이 보유한 국가에서 그 자금을 얻는 방안을 암시하였습니다."
 PER_productive_state: "생산적인 국가"
 PER_productive_state_desc: "마즐리스는 우리나라가 세계의 다른 일부 국가들에 크게 뒤처져 있으므로 생산성 할당량을 달성해야 한다고 명하였습니다."
 PER_debate_now: "진행 중인 토론..."
 PER_doing_proposal: "제안을 선택함"
 PER_start_the_revolution: "[PER.GetLeader]의 사임 요구"
