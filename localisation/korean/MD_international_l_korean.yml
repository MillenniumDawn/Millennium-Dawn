 call_pmc_back_sov_desc: "This will allow us to get our boys home, however we would have to pay compensation for contract termination with each country."
 pmc_category: "민간 군사 기업 (PMC)"
 pmc_category_tracker_desc: "§YPrivate Military Companies§!.\n\n§GRent§! your own §Yprivate army!§!\n§YCompanies§! §Gloyal§! to us,\n or ones we control directly will give us §Y20%§! §Gdiscount§! on their services.\n\n[PMC_max_available]\n§YCurrent list of PMC's§!:\n[PMC_Header_blackwater][PMC_Header_wagner][PMC_Header_aegis][PMC_Header_constellis][PMC_Header_md]"
 pmc_local_management: "지역 민병대"
 pmc_local_management_desc: "지역 민간 군사 기업. 지방 기업들은 항상 20% 할인이 가능합니다.\n최대 7개 까지 확장 가능합니다. 품질 개선은 최대 4개 까지 가능합니다.\n\n[PMC_max_available]\n[PMC_local_header]"
 form_local_pmc: "지역 민간군사기업 형성"
 open_blackwater_desc: "블랙워터는 전직 해군 특수부대 장교 에릭 프린스가 1996년 12월 26일에 설립한 미국의 민간 군사 기업입니다. 블랙워터와 그 전신 기업들은 미국 연방 정부에 계약 경비 서비스를 제공합니다. 2003년부터는 중앙정보국에도 서비스를 제공해 왔습니다."
 open_aegis_desc: "이지스 디펜스 서비시스는 아프가니스탄, 아랍에미리트, 이라크, 사우디아라비아, 리비아, 소말리아, 모잠비크에 해외 사무소를 둔 영국의 민간 군사 및 민간 경비 기업입니다. 미국에 본사를 둔 이지스 LLC를 포함하는 이지스 그룹 계열사의 일부입니다. 이 회사는 이전에 민간 군사 기업 샌드라인 인터내셔널의 CEO였던 팀 스파이서, 기업가 제프리 데이, 그리고 전직 투자 은행가인 마크 불러프와 도미닉 암스트롱이 2002년에 설립했습니다."
 open_constellis_desc: "콘스텔리스는 복잡한 위험 관리 산업 분야에서 최고의 브랜드, 자산, 인력을 결합하고자 했던 운영자 및 투자자 집단에 의해 2010년에 설립되었습니다. 규정 준수와 운영 우수성의 문화를 장려하며, 콘스텔리스 계열사는 트리플 캐노피, 올리브 그룹, 디벨롭먼트 이니셔티브를 비롯해 기존 계열사인 센테라, 아카데미, AMK9, 옴니플렉스, 스트래티직 소셜, 에든버러 인터내셔널을 포함하는 업계 선도자들의 글로벌 팀으로 성장했습니다."
 get_constellis_light_infantry_desc: "경보병과 포병 지원으로 구성된 여단 규모의 부대로, 험난한 지형에 적합하며 다른 육군 편제보다 훨씬 저렴합니다."
 get_aegis_light_infantry_desc: "경보병과 포병 지원으로 구성된 여단 규모의 부대로, 험난한 지형에 적합하며 다른 육군 편제보다 훨씬 저렴합니다."
 get_blackwater_heavy_mech_infantry_desc: "기계화 보병 부대는 경보병-차량화 부대에 대해 매우 강력합니다. 또한 방어 면에서도 경보병 및 차량화 보병보다 강합니다. 가격은 비싸지만 이 부대의 전투력이 그 값을 만회해 줄 것입니다."
 get_blackwater_special_infantry_desc: "특수 보병 병력, 즉 코만도는 숙련된 병사들로 이루어진 강력한 부대입니다. 특히 산악 지대에서 방어에 매우 유용할 수 있습니다. 경량 사단도 손쉽게 격파할 수 있습니다. 가격은 매우 비싸지만 흥미로운 특징이 많습니다."
 get_constellis_mech_infantry_desc: "기계화 보병 부대는 경보병-차량화 부대에 대해 매우 강력합니다. 또한 방어 면에서도 경보병 및 차량화 보병보다 강합니다. 가격은 비싸지만 이 부대의 전투력이 그 값을 만회해 줄 것입니다."
 get_blackwater_mech_infantry_desc: "기계화 보병 부대는 경보병-차량화 부대에 대해 매우 강력합니다. 또한 방어 면에서도 경보병 및 차량화 보병보다 강합니다. 가격은 비싸지만 이 부대의 전투력이 그 값을 만회해 줄 것입니다."
 get_constellis_mot_infantry_desc: "강력하며 경량 표적을 타격하고 파괴하는 데 적합한 사단입니다. 가격은 경보병 부대보다 높지만 그보다 더 강력합니다."
 get_blackwater_mot_infantry_desc: "강력하며 경량 표적을 타격하고 파괴하는 데 적합한 사단입니다. 가격은 경보병 부대보다 높지만 그보다 더 강력합니다."
 get_blackwater_light_infantry_desc: "경보병과 포병 지원으로 구성된 여단 규모의 부대로, 험난한 지형에 적합하며 다른 육군 편제보다 훨씬 저렴합니다."
