l_braz_por:
 balkan_news.1.t: "Karadžić condenado por genocídio"
 balkan_news.1.d: "O Tribunal de Haia considerou Radovan Karadžić culpado de genocídio em Srebrenica e de crimes contra a humanidade em toda a Bósnia, condenando-o a quarenta anos de prisão. Duas décadas após Dayton, o líder dos sérvios da Bósnia durante a guerra foi julgado pelo tribunal que a sua própria guerra desencadeou."
 balkan_news.1.a: "O veredicto é lido em voz alta em Sarajevo."
 balkan_news.1.b: "Um veredicto contra todos os sérvios, dizem alguns."
 balkan_news.1.c: "Justiça, tardia"
 balkan_news.2.t: "Prisão perpétua para Karadžić"
 balkan_news.2.d: "A câmara de apelações rejeitou o recurso de Radovan Karadžić e aumentou sua pena para prisão perpétua, considerando a pena original de quarenta anos inadequada para a gravidade de seus crimes. Esta é a palavra final sobre o homem que liderou a República Sérvia durante a guerra."
 balkan_news.2.a: "Haia encerra o caso."
 balkan_news.3.t: "Mladić condenado por genocídio"
 balkan_news.3.d: "O tribunal condenou Ratko Mladić por genocídio, crimes de guerra e crimes contra a humanidade, sentenciando-o à prisão perpétua. O ex-general gritou com os juízes e teve de ser retirado do tribunal antes do término da leitura da sentença. Em Srebrenica, as mães dos mortos assistiram em silêncio."
 balkan_news.3.a: "As respostas gerais finalmente."
 balkan_news.4.t: "Suicídio no Tribunal"
 balkan_news.4.d: "Momentos depois de os juízes confirmarem sua sentença de vinte anos, o general croata bósnio Slobodan Praljak declarou que não era um criminoso de guerra e ingeriu um frasco de veneno diante das câmeras. Ele morreu poucas horas depois. A câmara de apelações confirmou as condenações de todos os seis ex-líderes da Herzeg-Bósnia, constatando uma organização criminosa conjunta que se estendia até Zagreb."
 balkan_news.4.a: "Ele recusou a justiça do tribunal."
 balkan_news.4.b: "Um final sombrio para o último caso do tribunal."
 balkan_news.5.t: "Recurso de Mladić rejeitado"
 balkan_news.5.d: "Juízes das Nações Unidas confirmaram a condenação de Ratko Mladić por genocídio e sua sentença de prisão perpétua, encerrando o último grande caso decorrente da guerra da Bósnia. Um quarto de século após Srebrenica, o acerto de contas judicial com a guerra está completo. O acerto de contas político, não."
 balkan_news.5.a: "O arquivo se encerra."
 CRO_nat_populism_gain_tt: "§RA direita nacionalista ganha apoio.§!"
 balkan_news.6.t: "Declaração do Mundo Sérvio"
 balkan_news.6.d: "Belgrado e Banja Luka adotaram conjuntamente uma declaração de treze páginas sobre a unificação dos territórios sérvios sob um Conselho Superior Permanente para a Cooperação Sérvia-República Srpska. A declaração carece de força legal, mas é repleta de intenções."
 balkan_news.6.a: "Um mecenas que vale a pena ter."
 balkan_news.6.b: "A autoridade de Sarajevo se deteriora ainda mais."
 balkan_news.6.c: "Notícias da vizinhança"
 balkan_news.7.t: "EUFOR Doubles Down"
 balkan_news.7.d: "Days after Russian tanks crossed into Ukraine, the EU has roughly doubled EUFOR Althea's garrison in Bosnia and Herzegovina, flying in reserve troops as a hedge against spillover instability."
 balkan_news.7.a: "A reassuring show of resolve"
 balkan_news.7.b: "A precaution taken elsewhere"
 balkan_news.8.t: "Erdoğan Rallies Sarajevo"
 balkan_news.8.d: "Barred from campaigning across Western Europe, Erdoğan has held his only European rally of the race in Sarajevo, drawing thousands and meeting SDA's Bakir Izetbegović. Dodik calls it interference."
 balkan_news.8.a: "A friend Sarajevo can count on"
 balkan_news.8.b: "A rally in someone else's country"
 balkan_news.9.t: "Lavrov's Sarajevo Visit"
 balkan_news.9.d: "Sergey Lavrov has visited Sarajevo, greeted at the airport by Dodik alone. No Bosnian flag was raised for the occasion. He left with a centuries-old Orthodox icon whose origins trace back to Luhansk, a gift Kyiv wants explained."
 balkan_news.9.a: "Republika Srpska's own foreign policy"
 balkan_news.9.b: "A visit like any other"