 terror.135.d: "테러리스트들이 [FROM.GetFlag]을(를) 공격했습니다. 이는 매우 비극적인 사건이며, 우리는 이에 대한 대응을 마련해야 합니다. 테러리스트들이 제멋대로 날뛰도록 방치해서는 안 됩니다."
