 ukr_modernize_sov_equipment_old_small_arms_issue_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_old_small_arms_issue_for_tooltip\n\n\n\n\n\n\n\n\n§W전쟁이 닥쳤고 동원된 병력에게는 무기가 필요합니다. 우리 보관소에는 §R소련§! 시절의 초기형 칼라시니코프 소총, 소총, 카빈, 기관단총, 무반동포, 휴대용 미사일이 아직 남아 있습니다.§!"
