l_russian:
 STALKER.170.t: "Вторая катастрофа"
 STALKER.170.d: "Над Чернобыльской станцией небо озарила вспышка, и приборы вокруг старой зоны отчуждения сошли с ума. Учёные, остававшиеся внутри, называют это аварией в программе под названием «Проект X». Правительство очерчивает новый периметр. Несколько из них уже ушли на юг, в болота."
 STALKER.170.a: "Перекрыть дорогу."
 STALKER.171.t: "Большой выброс"
 STALKER.171.d: "По Зоне прошёл выброс, крупнее любого, зафиксированного с 2006 года. Сталкеры, застигнутые на открытой местности, погибли. С болот группировка «Чистое Небо» сообщает, что Зона отвечает кому-то, кто всё идёт на север."
 STALKER.171.a: "Болота ответят за себя сами."
 STALKER.172.t: "«Чистое Небо» идёт на станцию"
 STALKER.172.d: "Лебедев считает, что сталкер по прозвищу Стрелок — причина, по которой Зона продолжает бушевать, и отправил Шрама на север, чтобы остановить его. «Чистое Небо» собирается на болотах для штурма станции. Торговец на Кордоне скупает весь антирад на дороге, бар полон тех, кто не собирается идти дальше, а бункеры экологов задраили двери."
 STALKER.172.a: "Поддержать «Чистое Небо» и остановить Стрелка."
 STALKER.172.a_tt: "«Чистое Небо» остаётся на болотах. Стрелок не доходит до центра в 2012 году."
 STALKER.172.b: "Не мешать штурму."
 STALKER.172.b_tt: "Влияние «Чистого Неба» падает до §R0§!. Шрам выживает. Стрелок доходит до центра в 2012 году, не помня собственного имени."
 STALKER.172.c: "Помочь Стрелку пройти."
 STALKER.172.c_tt: "Влияние «Чистого Неба» падает до §R0§!. Шрам выживает. Стрелок доходит до центра в 2012 году, уже зная, что там."
 STALKER.173.t: "После штурма"
 STALKER.173.d_spared: "«Чистое Небо» развернуло Стрелка до того, как он дошёл до станции. Лебедев держит остатки группировки на болотах, Шрам всё ещё с ними. Центр Зоны затих."
 STALKER.173.d_marked: "Штурм станции накрыл выброс. «Чистое Небо» уничтожено. Шрам вышел один. Стрелка вытащили из центра без памяти, и на Кордоне его узнают как Меченого."
 STALKER.173.d_helped: "«Чистое Небо» погибло на дороге к станции. Шрам вышел один. Стрелок прошёл и по-прежнему помнит своё имя."
 STALKER.173.a: "Зона хранит свои тайны."
 STALKER.174.t: "Операция «Фарватер»"
 STALKER.174.d_open: "Север Зоны открыт. Армия отправила пять вертолётов к Припяти, чтобы закрепиться у станции, и ни один не вышел на связь. Майор Александр Дегтярёв на месте их падения. Бункеры экологов хотят вывезти своих людей до следующего выброса."
 STALKER.174.d_closed: "Армия отправила вертолёты к Припяти, хотя Выжигатель мозгов всё ещё работает. Они упали внутри Зоны. Майор Александр Дегтярёв ищет экипажи. Бункеры экологов хотят вывезти своих людей, а закрепиться у станции не удастся."
 STALKER.174.d_massacre: "Армия отправила вертолёты к станции, которую всё ещё удерживает «Монолит». Экипажи погибли, а «Монолит» уже движется к обломкам. Майор Александр Дегтярёв просит разрешения вывести всех, кто ещё жив."
 STALKER.174.a: "Эвакуировать учёных."
 STALKER.174.a_open_tt: "Влияние экологов растёт на §G8§!. Влияние военных растёт на §G5§!, а сдерживание — на §G5§!."
 STALKER.174.a_closed_tt: "Влияние экологов растёт на §G5§!. Вертолёты потеряны: влияние военных падает на §R5§!. Сдерживание растёт на §G5§!."
 STALKER.174.b: "Закрепиться в Припяти."
 STALKER.174.b_tt: "Влияние военных растёт на §G10§!, экологов — на §G5§!, сдерживание — на §G5§!. Армия удерживает плацдарм в Припяти."
 STALKER.174.c: "Похоронить операцию."
 STALKER.174.c_open_tt: "Влияние военных падает на §R5§!. Активность растёт на §R5§!."
 STALKER.174.c_closed_tt: "Влияние военных падает на §R10§!. Активность растёт на §R5§!."
 STALKER.174.e: "Спасти кого сможем."
 STALKER.174.e_tt: "Влияние военных падает на §R10§!. «Монолит» получает §R10§!, а активность растёт на §R5§!."
 STALKER.175.t: "Отчёты по «Фарватеру»"
 STALKER.175.d_evacuate_open: "Учёные выведены из бункеров, а в отчёте Дегтярёва сказано, что экипажи вертолётов погибли в аномалиях к северу от Припяти. Армия всё ещё на месте."
 STALKER.175.d_evacuate_closed: "Дегтярёв вывел учёных. У вертолётов не было шансов против Выжигателя мозгов, а выжившие экипажи идут на юг."
 STALKER.175.d_foothold: "Люди полковника Ковальского удерживают квартал в Припяти. В отчёте Дегтярёва сказано, что вертолёты погибли в аномалиях, и плацдарм — всё, что осталось от операции."
 STALKER.175.d_bury_open: "Операцию «Фарватер» вычеркнули из сводок. Вертолёты числятся потерянными из-за погоды, а отчёт Дегтярёва заперт в ящике."
 STALKER.175.d_bury_closed: "Операцию «Фарватер» вычеркнули из сводок. Вертолёты забрал Выжигатель, а по официальной версии они вообще не вылетали."
 STALKER.175.d_massacre: "Со станции не вернулось ничего, кроме радиовызова. «Монолит» удерживает обломки, а Дегтярёву приказано прекратить поиски."
 STALKER.175.a: "Подшить отчёт."
 STALKER.176.t: "Устав для Зоны"
 STALKER.176.d_scar: "Государство хочет создать для Зоны научный институт НИИЧАЗ под руководством директора Далина и частный полк для охраны порядка в ней. Этим полком, «Вартой», командовал бы полковник Коршунов. У Шрама, ушедшего из «Чистого Неба», теперь свои люди. Они называют себя «Искрой» и не примут «Варту» молча.\n\n[STALKER_field_yantar_history]"
 STALKER.176.d: "Государство хочет создать для Зоны научный институт НИИЧАЗ под руководством директора Далина и частный полк для охраны порядка в ней. Этим полком, «Вартой», командовал бы полковник Коршунов.\n\n[STALKER_field_yantar_history]"
 STALKER.176.a: "Учредить НИИЧАЗ и ввести «Варту»."
 STALKER.176.a_scar_tt: "Влияние «Варты» вырастет как минимум до §Y15§!. Влияние «Искры» вырастет как минимум до §Y10§!."
 STALKER.176.a_tt: "Влияние «Варты» вырастет как минимум до §Y15§!."
 STALKER.176.b: "Оставить Зону под армией."
 STALKER.176.b_scar_tt: "Влияние военных растёт на §G10§!. Влияние «Искры» вырастет как минимум до §Y10§!. «Варта» не учреждается."
 STALKER.176.b_tt: "Влияние военных растёт на §G10§!. «Варта» не учреждается."
 STALKER.177.t: "НИИЧАЗ"
 STALKER.177.d_charter_scar: "НИИЧАЗ получил устав, а «Варта» полковника Коршунова заняла дороги, которые раньше патрулировала только армия. В ответ «Искра» Шрама собирает сталкеров, которые хотят, чтобы Зону оставили в покое."
 STALKER.177.d_charter: "НИИЧАЗ получил устав, а «Варта» полковника Коршунова заняла дороги, которые раньше патрулировала только армия."
 STALKER.177.d_army_scar: "Правительство отказало НИИЧАЗ в полку. Периметр останется за армией. «Искра» Шрама остаётся в Зоне и к армии не присоединилась."
 STALKER.177.d_army: "Правительство оставило Зону под армией. У НИИЧАЗ нет своего полка."
 STALKER.177.a: "У Зоны новые хозяева."
 STALKER.161.t: "Стрелок доходит до центра"
 STALKER.161.d: "Сталкер, которого на Кордоне зовут Стрелком, прошёл Выжигатель мозгов и добрался до центра Зоны в [STALKER_zone_name]. Он намерен отключить О-Сознание. «Монолит» уже выдвигается, чтобы его остановить, а военные хотят перекрыть дорогу, пока ни один из них не довёл дело до конца."
 STALKER.161.d_marked: "Потерявший память сталкер, которого на Кордоне звали Меченым, вспомнил имя Стрелок. Стрелок прошёл Выжигатель мозгов и добрался до центра Зоны в [STALKER_zone_name]. Он намерен отключить О-Сознание. «Монолит» уже выдвигается, чтобы его остановить, а военные хотят перекрыть дорогу, пока ни один из них не довёл дело до конца."
 STALKER.161.d_remembers: "Стрелок прошёл Выжигатель мозгов и добрался до центра Зоны в [STALKER_zone_name]. Он уже знает, что там. Он намерен отключить О-Сознание. Торговец на Кордоне говорит, что «Чистое Небо» погибло, пытаясь провести его туда. «Монолит» выдвигается, чтобы его остановить, а военные хотят перекрыть дорогу."
 STALKER.161.a: "Пусть отключит О-Сознание."
 STALKER.161.a_tt: "«Монолит» теряет до §G40§! влияния. Активность растёт на §R15§!, сдерживание падает до §R10§!, а число сталкеров растёт на §Y10§!. Стрелок выживает и остаётся противником Зоны."
 STALKER.161.b: "Остановить его у Выжигателя мозгов."
 STALKER.161.b_tt: "Стоит §R50§! политической власти. Влияние военных и сдерживание растут на §G15§! каждое, а «Монолит» получает §R5§!. Стрелок не возвращается."
 STALKER.161.c: "Оставить его О-Сознанию."
 STALKER.161.c_tt: "«Монолит» получает §R20§! влияния. Активность падает до §G10§!, а сдерживание растёт на §G5§!. Стрелок не возвращается самим собой."
 STALKER.162.t: "Центр Зоны"
 STALKER.162.d_turned_back: "Стрелок так и не дошёл до станции. Год назад «Чистое Небо» развернуло его на болотах, и центр остаётся закрытым."
 STALKER.162.d_shutdown_marked: "Меченый вспомнил имя Стрелок в центре Зоны и отключил О-Сознание. Внешние посты «Монолита» затихли. Выбросы — нет."
 STALKER.162.d_shutdown_remembers: "Стрелок дошёл до центра, зная, что там О-Сознание, и отключил его. Внешние посты «Монолита» затихли. Выбросы — нет."
 STALKER.162.d_shutdown: "Стрелок дошёл до центра Зоны и отключил О-Сознание. Внешние посты «Монолита» затихли. Выбросы — нет."
 STALKER.162.d_stopped: "Армия развернула Стрелка до того, как он дошёл до станции. Выжигатель мозгов всё ещё работает, а «Монолит» по-прежнему удерживает центр."
 STALKER.162.d_taken: "Стрелок вошёл в центр и не вышел. Патрули «Монолита» снова движутся на юг, а Зона затихла так, что этому никто не верит."
 STALKER.162.a: "Зона всё ещё здесь."
 STALKER.200.a: "Разрешить первое задание."
 STALKER.200.a_tt: "Открывает расследование за 25 политической власти продолжительностью 60 дн."
 STALKER.200.b: "Оставить дело нераскрытым."
 STALKER.200.b_tt: "Закрыть кампанию без наград. Бандиты получают 10 влияния; можно начать следующую кампанию."
 STALKER.200.t: "Янтарь: безмолвная экспедиция"
 STALKER.200.d: "Изыскательская группа перестала отвечать экологам на Янтаре. Её последние приборы ни в чём не сходились: чистая дорога, смертельный уровень радиации и голоса на неиспользуемом канале. Учёные хотят получить сопровождение, чтобы забрать оборудование, пока его не забрала другая группа."
 STALKER.201.a: "Подготовить спасательное задание."
 STALKER.201.a_tt: "Открывает полевую операцию за 50 политической власти продолжительностью 60 дн."
 STALKER.201.t: "Вешки изыскателей"
 STALKER.201.d: "Сопровождение находит вешки, оставленные двумя разными группами. Одни ведут к пропавшему лагерю, другие идут по более безопасному гребню. Уцелевший техник настаивает, что целью были приборы, а не пропавшие люди."
 STALKER.202.a: "Поделиться находками с экологами."
 STALKER.202.a_tt: "Учёные получают 10 влияния, эксплуатация растёт на 5. Сохранённые данные помогут при решении о НИИЧАЗ в 2018 году."
 STALKER.202.b: "Закрыть маршрут и засекретить показания."
 STALKER.202.b_tt: "Сдерживание растёт на 10, эксплуатация падает на 5. Данные остаются засекреченными."
 STALKER.202.c: "Передать проект под военный надзор."
 STALKER.202.c_tt: "Военные получают 10 влияния, учёные теряют 5. Доступ гражданских ограничен."
 STALKER.202.t: "Отчёт с Янтаря"
 STALKER.202.d: "Полученные показания могут направлять дальнейшие исследования, но публикация маршрута заманит больше сталкеров в те же аномалии. Экологи, командование периметра и их военное сопровождение — все просят передать им отчёт."
 STALKER_field_name_1: "Янтарь: безмолвная экспедиция"
 STALKER.203.a: "Разрешить первое задание."
 STALKER.203.a_tt: "Открывает расследование за 25 политической власти продолжительностью 60 дн."
 STALKER.203.b: "Оставить дело нераскрытым."
 STALKER.203.b_tt: "Закрыть кампанию без наград. Бандиты получают 10 влияния; можно начать следующую кампанию."
 STALKER.203.t: "Армейские склады: спорная дорога"
 STALKER.203.d: "«Долг» винит «Свободу» в пропаже колонны снабжения. «Свобода» утверждает, что блокпост направил её на бандитскую дорогу. Обе предлагают проводников и обе требуют власти над маршрутом, прежде чем следующая колонна выйдет с Армейских складов."
 STALKER.204.a: "Подготовить спасательное задание."
 STALKER.204.a_tt: "Открывает полевую операцию за 50 политической власти продолжительностью 60 дн."
 STALKER.204.t: "Следы у блокпоста"
 STALKER.204.d: "Стреляные гильзы и подделанные документы колонны подрывают первые версии обеих группировок. Груз увели после пересменки патруля. Есть время обезопасить следующую колонну, если кто-то возьмёт на себя ответственность за её проход."
 STALKER.205.a: "Договориться о совместном проходе."
 STALKER.205.a_tt: "«Долг» и «Свобода» получают по 5 влияния; активность падает на 5. Обеспеченный проход уменьшает потерю сдерживания в 2022 году на 5."
 STALKER.205.b: "Поручить дорогу «Долгу»."
 STALKER.205.b_tt: "«Долг» получает 10 влияния; «Свобода» и бандиты теряют по 5. Обеспеченный проход уменьшает потерю сдерживания в 2022 году на 5."
 STALKER.205.c: "Разрешить сопровождение «Свободы»."
 STALKER.205.c_tt: "«Свобода» получает 10 влияния; «Долг» и бандиты теряют по 5. Обеспеченный проход уменьшает потерю сдерживания в 2022 году на 5."
 STALKER.205.t: "Дорожное соглашение"
 STALKER.205.d: "Колонна доходит до складов. Её сопровождение может оставить дорогу одной группировке или устроить соглашение о проходе, которое ни одна группировка не сможет обеспечить в одиночку. Сталкеры, доставившие груз, просят лишь об одном: чтобы блокпосты перестали меняться без предупреждения."
 STALKER_field_name_2: "Армейские склады: спорная дорога"
 STALKER.206.a: "Разрешить первое задание."
 STALKER.206.a_tt: "Открывает расследование за 25 политической власти продолжительностью 60 дн."
 STALKER.206.b: "Оставить дело нераскрытым."
 STALKER.206.b_tt: "Закрыть кампанию без наград. Бандиты получают 10 влияния; можно начать следующую кампанию."
 STALKER.206.t: "Рыжий лес: вернувшийся патруль"
 STALKER.206.d: "Патруль, пропавший в Рыжем лесу, вернулся без одного бойца и с двумя версиями одной и той же ночи. На найденной рации — позывной наёмников. Бойцы помнят, что получали приказы от собственного командования на частоте, которую оно никогда не использовало."
 STALKER.207.a: "Подготовить спасательное задание."
 STALKER.207.a_tt: "Открывает полевую операцию за 50 политической власти продолжительностью 60 дн."
 STALKER.207.t: "Голос не на том канале"
 STALKER.207.d: "Первый опрос обнаруживает записанный приказ среди всплесков пси-помех. Наёмники шли по приборам патруля, а не по его маршруту. Вторая группа должна забрать брошенный регистратор, пока оставшийся свидетель снова не изменил показания."
 STALKER.208.a: "Защитить свидетелей и сохранить запись."
 STALKER.208.a_tt: "Сталкеры получают 10 влияния, наёмники теряют 5. Запись снижает стоимость одной зачистки MDST до 50 политической власти для владельца Зоны."
 STALKER.208.b: "Изучить регистратор под научным надзором."
 STALKER.208.b_tt: "Учёные получают 10 влияния, активность растёт на 5. Даёт один бонус 25% к исследованию электроники и одну зачистку MDST со скидкой."
 STALKER.208.c: "Уничтожить материалы и скрыть потери."
 STALKER.208.c_tt: "Сдерживание растёт на 10, сталкеры теряют 5 влияния. Показания свидетелей нельзя использовать против MDST."
 STALKER.208.t: "Улики из Рыжего леса"
 STALKER.208.d: "Регистратор уцелел. Его голоса помогут следователю распознать скомпрометированный канал, но живым свидетелям нужна защита. Командование периметра предлагает закрыть дело; учёные просят изучить его, пока содержимое не исчезло в очередном секретном архиве."
 STALKER_field_name_3: "Рыжий лес: вернувшийся патруль"
 STALKER_field_investigate: "Расследовать полевой отчёт"
 STALKER_field_investigate_desc: "Выделить на задание 25 политической власти. Оно длится 60 дн. и переходит вместе с исходной Зоной при смене контроля. Отчёт поступит текущему владельцу при следующем ежемесячном обновлении."
 STALKER_field_recover: "Отправить спасательное задание"
 STALKER_field_recover_desc: "Выделить на задание 50 политической власти. Оно длится 60 дн. и переходит вместе с исходной Зоной при смене контроля. Отчёт поступит текущему владельцу при следующем ежемесячном обновлении."
 STALKER_field_supplies: "Сопровождать научные грузы"
 STALKER_field_supplies_desc: "Потратить 25 политической власти на 60-дневное сопровождение научных грузов. По завершении: учёные и сдерживание растут на 5 каждое. Следующее сопровождение откроется через 180 дн. Не даёт исследований и наград в последующих кампаниях."
 STALKER_field_patrol: "Патрулировать спорную дорогу"
 STALKER_field_patrol_desc: "Потратить 25 политической власти на 60-дневное патрулирование. По завершении: бандиты и активность падают на 5 каждое. Соглашение добавляет 5 «Долгу» и 5 «Свободе»; поддержка одной группировки добавляет ей 5 и отнимает 5 у соперника. Следующий патруль откроется через 180 дн. Не даёт исследований и наград в последующих кампаниях."
 STALKER_field_campaign_category: "Полевые кампании в Зоне"
 STALKER_field_campaign_category_desc: "[STALKER_field_campaign_name]\n[STALKER_field_assignment_status]\nОтчёты и завершённые итоги остаются за исходной Зоной. Одновременно может выполняться только одно полевое задание. Незавершённые досье закрываются без бонусов подготовки, когда начинается битва 2022 года."
