 is_able_to_use_nuclear_strikes_tac_tt: "Nasza §Ydoktryna użycia broni jądrowej§! dopuszcza §Ytaktyczne użycie w pierwszej kolejności§! lub §Ypełne użycie§! naszego §Yarsenału jądrowego§! w przypadku, gdy zostaniemy zaatakowani jako pierwsi."
 disable_raid_notifs_TT: "§CUwaga:\n- Powiadomienia o najazdach można wyłączyć w menu decyzji §H'[ROOT.GetFlag][ROOT.GetAdjective] Raport o wpływach zagranicznych'§!\n- Nadal będziesz otrzymywać powiadomienia o najazdach na nasze własne terytorium§!"
 raid_type_counter_terror_hvt_raid: "Antyterrorystyczna operacja uderzeniowa przeciwko celowi o wysokim znaczeniu"
 raid_type_counter_terror_hvt_raid_desc: "Przeprowadza rajd w celu zabicia lub schwytania członków wytypowanej organizacji terrorystycznej."
 raid_type_counter_terror_cache_raid: "Nalot na skrytkę z bronią terrorystów"
 raid_type_counter_terror_cache_raid_desc: "Przeprowadza nalot w celu zniszczenia składu broni organizacji terrorystycznej."
