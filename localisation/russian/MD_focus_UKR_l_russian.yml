 ukr_modernize_sov_equipment_storage_sale.6.name: "§Y[FROM.GetNameWithFlag]§! предлагает нам §Y2К11 «Круг»§!"
 ukr_modernize_sov_equipment_storage_sale.6.desc: "§Y[FROM.GetNameWithFlag]§! предлагает нам хранящиеся зенитные комплексы §Y2К11 «Круг»§!. Дивизион состоит из трёх батарей по девять пусковых установок.\n\n§Y2К11 «Круг»§! на украинских складах: §Y[?FROM.ukraine_has_2k11_stockpile|0]§!"
