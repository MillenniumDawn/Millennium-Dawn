 sp_thorium_nuclear_fuel_idea: "토륨 핵연료"
 sp_wireless_power_grid_expansion_idea: "무선 전력망 확장"
 sp_improved_synthetic_diamonds_idea: "합성 다이아몬드 개발 쇄신"
 scientist_trait_genius: "천재"
 scientist_trait_genius_desc: "비할 데 없는 혁신으로 과학 기술의 한계를 넓혀 가는 선구적인 두뇌입니다. 한 세대에 한 번 나올까 말까 한 재능입니다."
 scientist_trait_brilliant_theorist: "우수한 이론가"
 scientist_trait_brilliant_theorist_desc: "추상적인 개념과 이론에 통달하여 군사 전략과 과학 연구에 혁명을 일으킬 수 있는 인재입니다."
 scientist_trait_gifted_engineer: "타고난 공학자"
 scientist_trait_gifted_engineer_desc: "타고난 재능을 지닌 기술자로, 다양한 분야에 걸친 복잡한 기술적 문제를 해결하는 데 능숙합니다."
 scientist_trait_bright: "영리함"
 scientist_trait_bright_desc: "날카롭고 두뇌 회전이 빠른 과학자로, 새로운 개념을 파악하고 이를 효율적으로 응용하는 데 뛰어납니다."
 scientist_trait_fast_learner: "빠른 학습자"
 scientist_trait_fast_learner_desc: "새로운 과제에 빠르게 적응하며, 동료들보다 빨리 배우고 다양한 과학 분야에서 두각을 나타냅니다."
 scientist_trait_resourceful: "수완가"
 scientist_trait_resourceful_desc: "자원이 부족하거나 상황이 절박할 때에도 언제나 창의적인 해결책을 찾아냅니다."
 scientist_trait_nuclear_specialist: "핵 전문가"
 scientist_trait_nuclear_specialist_desc: "원자 연구의 최전선에 있는 물리학자로, 핵분열과 연쇄 반응 연구에 깊이 몰두하고 있습니다."
 scientist_trait_civilian_technology_expert: "민간 연구 전문가"
 scientist_trait_civilian_technology_expert_desc: "민간 부문을 겨냥한 기술 개발의 전문가입니다."
 scientist_trait_energy_expert: "에너지 생산 전문가"
 scientist_trait_energy_expert_desc: "여러 에너지 기업에서 경력을 쌓은 베테랑으로, 새로운 에너지 생산 방식을 개발할 수 있습니다."
 scientist_trait_telecommunications_expert: "통신 전문가"
 scientist_trait_telecommunications_expert_desc: "손에 전화기를 쥐고 태어난 사람으로, 당신이 가진 모든 기기에서 포르노를 볼 수 있게 만드는 방법을 찾는 데 정통한 전문가입니다."
 scientist_trait_naval_vessels_specialist: "Naval Hull Specialist"
 scientist_trait_naval_vessels_specialist_desc: "드론정부터 초대형 항공모함에 이르기까지 군함 선체 설계에 특화된 전문가입니다."
 scientist_trait_stealth_specialist: "스텔스 함선 전문가"
 scientist_trait_stealth_specialist_desc: "레이더와 소나 신호를 최소화한 함선 개발에 특화되어 있습니다."
 scientist_trait_avionics_specialist: "항공기 전문가"
 scientist_trait_avionics_specialist_desc: "공기역학과 항공기 설계 전문가로, 하늘을 지배할 우수한 기체, 엔진, 설계를 개발할 수 있습니다."
 scientist_trait_missile_specialist: "미사일 전문가"
 scientist_trait_missile_specialist_desc: "미사일 기술에 특화되어 있으며, 탄도 미사일 및 유도 미사일 계획의 추진 원리에 집중합니다."
 scientist_trait_space_specialist: "우주 열성론자"
 scientist_trait_space_specialist_desc: "인류의 목표를 지구 너머로 넓히는 데 평생을 바친 사람입니다."
 scientist_trait_aircraft_engine_expert: "추진체 전문가"
 scientist_trait_aircraft_engine_expert_desc: "제트 및 피스톤 추진의 권위자로, 엔진과 군용 항공기 적용에 관한 연구를 발전시킵니다."
 scientist_trait_autonomous_plane_expert: "무조종사 기체 전문가"
 scientist_trait_autonomous_plane_expert_desc: "아무도 조종하지 않아도 날 수 있게 만드는 일의 전문가입니다."
 scientist_trait_armored_specialist: "장갑차량 전문가"
 scientist_trait_armored_specialist_desc: "장갑차량 플랫폼과 차체 설계에 특화된 노련한 기술자입니다."
 scientist_trait_infantry_specialist: "보병 전문가"
 scientist_trait_infantry_specialist_desc: "소형 화기와 그 운용 및 설계에 특화된 전문가입니다."
 scientist_trait_mechsuit_specialist: "메카 슈트 전문가"
 scientist_trait_mechsuit_specialist_desc: "타이탄폴을 너무 많이 한 누군가입니다."
 sp_improved_space_solar_farms_idea: "우주 기반 태양광 발전소"
 sp_afv_double_cannons: "쌍열포"
 sp_afv_double_cannons_desc: "일반적으로 우리의 경장갑 전투 차량은 보통 자동포 한 문으로 무장합니다. 그러나 두 문의 포를 나란히 장착하는 체계를 만들 수 있을지도 모릅니다."
 sp_afv_double_cannons_reward_improved_autoloader: "개량형 자동 장전기"
 sp_afv_double_cannons_reward_improved_autoloader_desc: "쌍열포 재장전 체계를 연구하던 중, 우리 기술자들이 전차용 개량형 자동 장전기를 개발했습니다."
 sp_coilgun_memes: "보병용 코일건"
 sp_coilgun_memes_desc: "우리 전차의 레일건 기술에 \\"애들이 줄었어요\\" 식 축소를 적용하면, 보병에게 마하 헤수스급 속도로 날아가는 텅스텐 탄자의 힘을 쥐여 줄 수 있습니다. \n미친 개발자를 부추기지 마십시오. 이런 짓은 하루 저녁이면 해치우니까요."
 sp_multipurpose_warhead: "다목적 탄두"
 sp_multipurpose_warhead_desc: "우리에게는 전차를 상대하는 미사일과 항공기를 상대하는 미사일이 있습니다. 하지만 미사일이 양쪽 모두에 효과를 낼 수 있다면 어떨까요? 그러면 위급할 때 대전차 미사일과 대공 미사일을 원래 목표가 아닌 대상에게도 사용할 수 있습니다."
 sp_supercarrier_1: "초기 슈퍼 항공모함"
 sp_supercarrier_1_desc: "확장된 갑판 공간과 그 크기의 함선을 건조할 수 있는 능력은 우리의 장거리 전력 투사에 결정적일 것입니다."
 sp_supercarrier_2: "후기 슈퍼 항공모함"
 sp_supercarrier_2_desc: "원자력 엔진의 추가로 더 큰 동력은 더 큰 함선과 넓은 갑판 공간을 의미합니다."
 sp_stealth_technology: "스텔스 실험"
 sp_stealth_technology_desc: "적에 대한 우위를 점하려면 우리 전투기가 레이더에 덜 탐지되도록 만드는 방법을 찾아내야 합니다."
 sp_arsenal_bird: "아스널 버드"
 sp_aresnal_bird_desc: "완전 자율 항공기, 원자력 항공기 엔진, 첨단 비행 통제 체계의 개발로, 드론 공군 전체를 싣고 다닐 수 있는 항공기를 만들 수 있습니다. 이 항공기는 극도로 비싸지만 공중전 체계의 정점이 될 것입니다."
 sp_multipurpose_warhead_reward_improved_warhead: "개량형 탄두"
 sp_multipurpose_warhead_reward_improved_warhead_desc: "대전차 미사일에 대공 성능을, 대공 미사일에 대전차 성능을 더하는 방법을 모색하던 중, 우리 기술자들이 한 종류의 미사일 전반의 성능을 개선하는 방법을 알아냈습니다."
 sp_multipurpose_warhead_reward_improved_warhead_at: "대전차 성능 향상"
 sp_multipurpose_warhead_reward_improved_warhead_aa: "대공 성능 향상"
 sp_emp_warhead: "향상된 전자전"
 sp_emp_warhead_desc: "전차와 항공기 모두 EMP 무기의 영향을 줄일 수 있는 전자전 대응 수단을 갖추고 있습니다. 플랫폼마다 구조가 다르므로, 우리는 한 종류의 표적에만 효과적으로 집중할 수 있습니다."
 sp_emp_warhead_reward_improved_warhead_at: "지상 표적 우선시"
 sp_emp_warhead_reward_improved_warhead_aa: "항공 표적 우선시"
 sp_fire_support_land_drone_reward_improved_communication_desc: "드론의 효율적인 통제 방식을 개발하던 중, 우리 기술자들이 개선된 무선 통신 방식을 개발했습니다. 이 성과는 민간 또는 군사 분야 어느 쪽에든 활용할 수 있습니다."
 sp_double_shot_rifle_tt: "모든 §Y특수 부대§! 병력의 §Y방어§!와 §Y돌파§!를 §G5%§! 증가시킵니다\n"
 sp_double_shot_rifle_tech: "2연발 소총"
 sp_ground_fireandforget: "발사 후 망각 대전차 유도 미사일"
 sp_ground_fireandforget_desc: "전자 장비의 소형화로 이제 미사일이 열 고정을 통해 스스로 목표를 향해 자동 유도될 수 있습니다."
 sp_modern_air_electronics: "현대 항공 전자기술"
 sp_modern_air_electronics_desc: "공중 레이더, 조종석 및 기타 체계를 위한 새로운 세대의 전자 장비 발전입니다."
 sp_future_air_electronics: "미래 항공 전자기술"
 sp_future_air_electronics_desc: "스마트 AI, 레이저 체계, 나노기술의 최신 기술을 융합한 고효율 항공 장비입니다."
 sp_modern_air_weapons: "스마트 항공 무기"
 sp_modern_air_weapons_desc: "스마트 표적 지정, 무기 탑재 밀리미터파 레이더, 발사 후 락온. 미래 전장의 길을 여는 새로운 세대의 무기입니다."
 sp_future_air_weapons: "AI 향상 항공 무기"
 sp_future_air_weapons_desc: "이전 세대의 공중 미사일과 센서를 AI 프로세서와 더욱 정밀한 탐지 및 표적 지정 체계로 강화합니다."
 sp_hypersonic_missile: "초음속 미사일"
 sp_hypersonic_missile_desc: "극초음속 미사일은 우리 전략 미사일 전력에 불과 얼마 전까지만 해도 불가능하다고 여겨진 속도로 적 영토 깊숙이 타격할 수 있는 능력을 부여할 것입니다."
 sp_hypersonic_missile_tt: "§Y극초음속 미사일 기술§! 잠금 해제"
 sp_naval_generic_reward_army_xp_1: "아이디어 흐름의 변화"
 sp_naval_generic_reward_army_xp_2: "아이디어의 물결"
 sp_naval_generic_reward_army_xp_3: "혁신의 쓰나미!"
 sp_emp_warhead_reward_improved_warhead: "전자 무기"
 sp_emp_warhead_reward_improved_warhead_desc: "전자 장비는 공중전에서 우리에게 우위를 가져다줄 수 있습니다."
 sp_helicopter_project_desc: "자동차나 다른 차량을 설계하는 것과 마찬가지로, 헬리콥터를 설계하고 제작하려면 이러한 특수 차량을 국내에서 생산할 수 있는 현지 지식이 필요합니다. 우리만의 버전을 개발할 때까지 몇 가지 설계 실험을 수행해야 합니다."
 sp_helicopter_project: "헬리콥터 설계 실험"
 sp_helicopter_project_tt: "다음 §Y기술 계열§!이 잠금 해제됩니다:\n- §Y수송 헬리콥터§!\n- §Y공격 헬리콥터§!\n"
 sp_air_generic_reward_army_xp_1: "신선한 바람"
 sp_air_generic_reward_army_xp_2: "혁신의 바람"
 sp_air_generic_reward_army_xp_3: "변화의 바람"
 sp_tank_stealth_armor_early: "초기 스텔스 장갑"
 sp_tank_stealth_armor_early_desc: "전차를 보호할 뿐만 아니라 더 나은 은폐 성능도 제공하는 장갑을 만들면, 기갑 이론의 정수를 받아들일 수 있습니다. 즉, 피격을 막는 것보다 피격되지 않는 것이 낫다는 것입니다."
 sp_electronic_government: "전자 정부"
 sp_electronic_government_desc: "국가의 효율을 극대화하려면 시민들이 집에서 편안하게 정부에 접속하고 상호작용할 수 있어야 합니다. 이는 시민들의 인터넷 활용 능력을 높이고 정부 지출을 천문학적으로 낮은 수준까지 줄여 줄 것입니다."
 sp_tank_nera_armor: "중량 NERA 복합 장갑"
 sp_tank_nera_armor_desc: "열화 우라늄 삽입재 같은 더 무겁고 저항력이 높은 장갑을 생산하기 위해 첨단 소재를 연구할 수 있습니다"
 sp_aircraft_project_bba_tt: "다음 §Y기술 계열§!이 잠금 해제됩니다:\n- §Y경량 기체§!\n- §Y중형 기체§!\n- §Y대형 기체§!\n- §Y공격 헬리콥터§!\n- §Y수송 헬리콥터§!\n"
 sp_aircraft_project_non_bba_tt: "다음 §Y기술 계열§!이 잠금 해제됩니다:\n- §Y전투기§!\n- §Y근접 항공 지원기§!\n- §Y폭격기§!\n- §Y무인 전투기§!\n- §Y경전투기§!\n"
 sp_space_weapons: "우주 기반 무기"
 has_completed_space_program_tt: "특별 프로젝트 완료: §Y$sp_space_program$§!"
 has_completed_space_weapons_tt: "특별 프로젝트 완료: §Y$sp_space_weapons$§!"
 sp_microchip_production: "마이크로칩 생산 연구소"
 sp_microchip_production_desc: "연산 공정의 소형화를 실험하고 이를 대규모로 만드는 법을 익힘으로써, 우리는 현대식 무기와 장비에 사용할 마이크로칩을 직접 생산할 수 있게 될 것입니다."
 sp_composite_production: "복합재 생산 연구소"
 sp_composite_production_desc: "제련, 혼합 및 기타 화학적 방법과 함께 새로운 기술을 실험함으로써, 현대적이고 선진적인 복합 소재를 만드는 방법을 개선할 수 있습니다."
 sp_recon_land_drone: "지상 정찰 드론"
 sp_recon_land_drone_desc: "현대 지상전은 갈수록 정보 우위와 조기 위협 탐지에 의존합니다. 지상군과 함께 전용 정찰 드론을 배치하면 전통적인 척후 방식을 훨씬 뛰어넘어 상황 인식 범위를 넓힐 수 있습니다. 이러한 투자는 더 빠른 의사 결정, 향상된 협조, 그리고 직접 교전이 벌어지기 전에 전장에 대한 더 명확한 그림을 가능하게 합니다."
 sp_smart_bullets: "스마트 탄환"
 sp_smart_bullets_desc: "유도 및 표적 지정 기술의 발전은 전장의 가장 작은 요소에까지 영향을 미치기 시작하고 있습니다. 보병과 지원 화기에 스마트 탄약을 투자함으로써 복잡한 전투 환경에서의 정확도와 효율을 높이고자 합니다."
 sp_recon_drone_land: "지상 정찰 드론 체계"
 sp_recon_drone_land_desc: "전장에서 무인 항공기가 널리 사용되면서, 지상 정찰 드론은 지상군에 전선에 대한 지속적인 실시간 정보를 제공합니다. 전투 부대 가까이에서 작전하는 이 드론은 인원을 직접적인 위험에 노출시키지 않고도 상황 인식, 표적 식별, 협조를 향상시킵니다."
 sp_airless_tires: "에어리스 타이어"
 sp_airless_tires_desc: "기동성은 특히 가혹하고 예측할 수 없는 환경에서 현대 지상 작전의 핵심 요소로 남아 있습니다. 군용 차량에 에어리스 타이어 기술을 도입하면 정비 부담을 줄이고 펑크로 인한 취약성을 없앨 수 있습니다. 이 투자는 작전 신뢰성을 높여 악조건에서도 우리 군이 기동을 이어 갈 수 있게 합니다."
 sp_exoskeletal_engine_tank: "외골격 엔진 체계"
 sp_exoskeletal_engine_tank_desc: "기존 엔진은 중앙 축과 원판에 의존하며 무게, 응력, 효율에 고유한 한계가 있습니다. 회전 블레이드를 드럼 로터 구조 안에 지지하는 외골격 엔진 설계를 탐구함으로써 무게를 줄이고 신뢰성을 높이며 소형 고출력 추진의 새로운 가능성을 열고자 합니다."
 sp_nuclear_engine_tank: "원자력 엔진 체계"
 sp_nuclear_engine_tank_desc: "증가하는 연료 수요와 늘어난 작전 거리는 기존 기갑 병참에 점점 더 큰 부담을 주고 있습니다. 중량 지상 차량용 원자력 엔진 체계를 탐구함으로써 보급선 의존도를 줄이면서 장기적인 기동성을 유지하고자 합니다."
 sp_light_walker_tank_chassis: "경량 워커 전차 차체"
 sp_light_walker_tank_chassis_desc: "기존 궤도 차량이 제약받는 파괴된 지형, 잔해, 도시 장애물을 통과하도록 설계된 경량 이족 장갑 차체입니다. 높은 실루엣과 복잡한 작동 장치가 정비와 신뢰성 문제를 일으키지만, 경량 워커 플랫폼은 보병과 드론의 적절한 지원을 받으면 밀집한 도시와 험지에서 탁월한 기동성을 제공할 수 있습니다."
 sp_drone_lrs: "드론 발사 로켓 체계"
 sp_drone_lrs_desc: "기존 로켓 탄약을 대량의 소모성 드론으로 대체하는 이 발사 체계는 넓은 지역에 걸쳐 군집 기반 화력을 투사합니다. 전개된 드론은 흩어져 정찰, 타격, 체공 공격을 수행하며, 지상군이 적 방어를 포화시키고 비행 중 목표에 적응하며 기존 미사일 탄두에 의존하지 않고 압박을 유지할 수 있게 합니다."
 sp_heavy_walker_tank_chassis: "중량 워커 전차 차체"
 sp_heavy_walker_tank_chassis_desc: "초기 워커 개념을 바탕으로, 중량 이족 장갑 플랫폼은 두꺼운 장갑 방호와 관절식 기동성을 결합하여 기존 중전차가 통과할 수 없는 지형을 돌파합니다. 더 느리고 기계적으로 복잡하지만, 이 차량들은 전면 내구성과 안정적인 무기 플랫폼을 중시하여 밀집한 도시와 험준한 환경에서 돌파 작전을 지원할 수 있습니다."
 sp_walker_tank_chassis: "워커 전차 차체"
 sp_walker_tank_chassis_desc: "장갑차량 설계와 관절식 다리 기반 기동성을 결합한 워커 전차 차체는 기존 궤도 플랫폼이 고전하는 지형에서 작전하도록 고안되었습니다. 장애물을 넘고 울퉁불퉁한 지면을 이동함으로써 이 차량들은 도시, 산악, 심하게 파괴된 환경에서 향상된 유연성을 제공하지만, 기계적 복잡성과 정비 요구가 증가합니다."
 sp_hover_suspension: "호버 서스펜션 체계"
 sp_hover_suspension_desc: "기존 궤도 주행 장치를 양력을 발생시키는 호버 체계로 대체함으로써 장갑 수송차는 지면을 가로지르는 대신 지표면 위를 이동할 수 있게 됩니다. 이를 통해 차량은 지면 접촉을 줄인 채 진흙, 눈, 물, 잔해를 통과할 수 있어 기동성과 배치 유연성이 향상되지만, 새로운 동력 및 정비 요구가 생깁니다."
 sp_magneto_explosive_munition: "자기유체역학 폭발 탄약"
 sp_magneto_explosive_munition_desc: "중장갑 차량은 더욱 발전된 대전차 무기의 개발을 계속 이끌고 있습니다. 자기유체역학 폭발 탄약을 탐구함으로써 우리 유도 미사일의 관통력과 교란 효과를 높이고자 합니다."
 sp_drone_torpedoes: "드론 어뢰"
 sp_drone_torpedoes_desc: "해전은 빠르게 진화하고 있으며, 기존 어뢰로는 더 이상 현대적 위협에 충분하지 않습니다. 드론 기반 어뢰 체계에 투자함으로써 수중에서의 타격력을 높이고자 합니다. 이 신형 어뢰는 독립적인 표적 추적과 적응형 교전이 가능하여, 우리 함대가 대잠 및 해군 작전에서 주도권을 유지할 수 있게 합니다."
 sp_anti_drone_laser_modules: "대드론 레이저 모듈"
 sp_anti_drone_laser_modules_desc: "해상에서 드론과 정밀 유도 탄약의 사용이 늘어나면서 해군 방공을 재고해야 하는 상황이 되었습니다. 함선에 레이저 기반 대드론 체계를 통합하면 기존 무기가 따라올 수 없는 속도와 정확도로 이러한 위협에 대응할 수 있습니다."
 sp_mineclearing_drone: "드론 소해 체계"
 sp_mineclearing_drone_desc: "기뢰는 여전히 해상 작전에 대한 가장 끈질기고 비용 효율적인 위협 중 하나입니다. 대기뢰전 임무를 무인 드론 체계로 전환함으로써 승조원의 위험을 줄이는 동시에 소해 작전의 속도와 범위를 향상시킬 수 있습니다."
 sp_naval_recon_drone: "해군 정찰 드론"
 sp_naval_recon_drone_desc: "해상 전역이 점점 더 붐비고 분쟁이 잦아지면서 해상에서 상황 인식을 유지하는 일이 갈수록 복잡해지고 있습니다. 전용 해군 정찰 드론에 투자함으로써 유인 플랫폼의 한계를 넘어 감시 범위를 확장합니다. 이 체계는 함대가 위협을 더 일찍 탐지, 추적, 대응할 수 있게 하여 더 충실한 정보에 기반한 지휘 결정과 더 큰 작전 유연성을 보장합니다."
 sp_drone_submarine: "드론 잠수함"
 sp_drone_submarine_desc: "수중전은 단순한 화력만이 아닌 지속성과 부인 가능성으로 옮겨 가고 있습니다. 무인 잠수함 플랫폼을 개발하면 승조원이나 고가 자산을 위험에 빠뜨리지 않고 수중에서 지속적인 존재감을 유지할 수 있습니다. 이 드론 잠수함은 재래식 확전의 문턱 아래에서 작전하며 핵심 해역을 감시, 교란, 경합할 수 있게 해 줍니다."
 sp_modern_sail_ships: "현대식 보조 돛 선박"
 sp_modern_sail_ships_desc: "증가하는 에너지 수요와 늘어난 해군 병참 부담으로 우리 지원 함대의 운용 방식을 재평가해야 하는 상황입니다. 일부 함선에 현대식 보조 돛 설계를 다시 도입함으로써 작전 신뢰성을 유지하면서 연료 소비를 줄일 수 있습니다."
 sp_drone_patrol_boat: "드론 초계정"
 sp_drone_patrol_boat_desc: "연안 보안과 해상 순찰 임무는 제한된 인력과 확대되는 작전 수요로 갈수록 한계에 부딪히고 있습니다. 무인 초계정을 배치하면 더 큰 전함을 투입하지 않고도 핵심 연안 및 근해 해역에 상시 존재감을 유지할 수 있습니다. 이 플랫폼은 저강도 위협을 더 효율적이고 유연하게 감시, 억제, 대응할 수 있게 해 줍니다."
 sp_drone_corvette: "드론 초계함"
 sp_drone_corvette_desc: "해전 양상이 더 분산되고 위험도가 높아지면서 소형 수상 전투함의 역할이 재고되고 있습니다. 무인 또는 선택적 유인 초계함 플랫폼에 투자함으로써 승조원을 불필요한 위험에 노출시키지 않고 전력을 투사하고 제해권을 유지할 수 있습니다."
 sp_rail_gun_naval_battery: "해군 레일건 포대"
 sp_rail_gun_naval_battery_desc: "초기 레일건 개념은 단발의 강력한 일격에 초점을 맞췄지만, 진화하는 해전은 지속적이고 유연한 화력을 요구합니다. 다연장 레일건 포대를 개발함으로써 더 높은 발사 속도와 향상된 표적 포화 능력으로 나아갑니다."
 sp_nuclear_torpedoes: "핵 어뢰"
 sp_nuclear_torpedoes_desc: "해군 억제력이 수중 우위로 옮겨 감에 따라 재래식 탄두만으로는 더 이상 충분하지 않을 수 있습니다. 핵무장 어뢰를 개발함으로써 광대한 해역을 거부하고 고가치 해군 편대에 결정적으로 대응할 수 있는 무기를 확보합니다."
 sp_fusion_reactor_engine: "핵융합로 엔진"
 sp_fusion_reactor_engine_desc: "현대 해군 체계의 증가하는 전력 수요는 기존 추진 및 에너지 생산을 한계로 몰아가고 있습니다. 함선에 핵융합 기반 원자로 엔진을 투자함으로써 지속 항해 능력을 해치지 않고 첨단 무기, 센서, 추진을 뒷받침하고자 합니다. 이 프로젝트는 새로운 세대의 고에너지 해군 플랫폼의 토대를 마련하여 해상에서의 장기적 작전 우위를 보장합니다."
 sp_naval_swarm_module: "해군 군집 드론 발사 체계"
 sp_naval_swarm_module_desc: "수상함에 모듈식 발사 체계를 통합함으로써 해군 플랫폼은 정찰, 전자전, 타격 임무를 위해 다수의 자율 드론을 전개할 수 있게 됩니다. 이 군집 체계는 함선의 센서 범위를 확장하고 적의 방어를 압도하며, 모함이 직접 교전에 노출되지 않고도 유연한 전력 투사를 제공합니다."
 sp_radar_jamming_module: "해군 레이더 재밍 체계"
 sp_radar_jamming_module_desc: "적 레이더 체계를 교란하고 성능을 저하시키도록 설계된 첨단 전자전 장비를 운용함으로써 수상함은 해상에서 자신의 실제 위치와 움직임을 감출 수 있습니다. 이 재밍 체계는 표적 획득과 사격 통제를 방해하여 적 센서의 효율을 떨어뜨리고 해전 중 생존성을 높입니다."
 sp_anti_torpedo_module: "해군 대어뢰 체계"
 sp_anti_torpedo_module_desc: "날아오는 수중 위협을 탐지, 식별, 무력화하도록 설계된 전용 대어뢰 방어 장비를 운용함으로써 수상함은 항행 및 전투 작전 중 현대 어뢰가 가하는 위험을 줄일 수 있습니다. 이 체계는 신속한 소나 추적, 자동 대응 수단 전개, 요격 솔루션을 결합하여 충돌 전에 유도를 교란하고 어뢰를 격파함으로써 분쟁 해역에서의 생존성을 향상시킵니다."
 sp_anti_ship_drone_missile: "대함 드론 미사일"
 sp_anti_ship_drone_missile_desc: "해상 타격 능력은 갈수록 사거리, 정밀도, 생존성으로 결정됩니다. 드론 기반 대함 미사일 체계를 개발함으로써 유인 항공기의 위험을 줄이면서 적 함선을 위협하는 능력을 확장할 수 있습니다."
 sp_hover_helicopter_engine: "호버링 가능 헬리콥터 엔진"
 sp_hover_helicopter_engine_desc: "도시 환경과 제한된 지형은 회전익 항공에 새로운 요구를 부과하고 있습니다. 호버링이 가능한 엔진 체계를 개발함으로써 복잡한 작전 중 저속 안정성과 수직 제어를 향상시키고자 합니다."
 sp_hypersonic_engine: "극초음속 추진 체계"
 sp_hypersonic_engine_desc: "제공권은 갈수록 속도, 도달 거리, 방어된 공역을 돌파하는 능력에 의해 좌우됩니다. 극초음속 추진 체계에 투자함으로써 기존 항공기 성능의 한계를 넘어서고자 합니다."
 sp_awacs_project: "공중 경보 통제 체계"
 sp_awacs_project_desc: "현대 항공 작전이 점차 복잡해짐에 따라 공중 조기경보통제기는 선진 공군의 핵심 능력이 되었습니다. 강력한 레이더 어레이와 지휘 체계를 장기 체공 항공기 플랫폼에 탑재함으로써 이를 실현합니다."
 sp_fiber_drones: "광섬유 유도 드론"
 sp_fiber_drones_desc: "무인 체계와 전자전이 급속히 발전하면서 광섬유 유도 드론이 재밍과 신호 간섭에 대응하는 해법으로 등장했습니다. 무선 통신 대신 물리적인 광섬유 링크로 제어 신호를 전달하므로, 이 드론은 경합 환경에서도 안정적으로 작동하며 탑재 장비를 정밀하게 제어할 수 있습니다."
 sp_air_railguns: "공대공 레일건"
 sp_air_railguns_desc: "더 빠른 교전 속도와 더 긴 요격 사거리를 끊임없이 추구한 끝에, 공대공 레일건이 기존 미사일 체계의 대안으로 제안되었습니다."
 sp_air_railguns_helicopter: "헬리콥터 레일건"
 sp_air_railguns_helicopter_desc: "소형 전자기포를 회전익 플랫폼에 통합하면, 헬리콥터는 원래 더 무거운 항공기나 지상 체계가 필요했던 강화된 표적을 관통할 수 있는 초고속 사격을 가할 수 있습니다."
 sp_space_artillery: "궤도 화력 지원"
 sp_space_artillery_desc: "우주 기반 체계가 현대전에 점점 더 통합됨에 따라, 우주에서 지상 표적을 정밀 타격하는 수단으로서 궤도 화력 지원이라는 개념이 등장했습니다."
 sp_air_pdl: "점방어 레이저"
 sp_air_pdl_desc: "고속 미사일과 포화 공격의 위협이 커짐에 따라, 항공기 탑재 점방어 레이저는 빛의 속도로 날아오는 위협을 요격하는 수단을 제공합니다. 고에너지 레이저 체계를 항공기 플랫폼에 탑재하면 비행 중인 미사일을 교전 및 무력화할 수 있어, 한정된 요격 미사일 재고에 대한 의존도를 줄이고 경합 공역에서의 생존성을 높일 수 있습니다."
 sp_air_helicopter_drone_control: "헬리콥터 드론 통제"
 sp_air_helicopter_drone_control_desc: "완전한 드론 통제 구조를 회전익 플랫폼에 통합하면 헬리콥터는 무인 정찰 및 타격 자산을 위한 공중 지휘 노드로 탈바꿈합니다. 이 접근법은 일상적인 노출 임무에 승무원을 투입해야 할 위험을 줄이는 동시에 전장 전반의 협조, 표적 지정, 작전 템포를 향상시킵니다. 다만 첨단 항전 장비, 보안 데이터링크, 추가적인 전력 및 냉각 용량이 필요하므로 배치 비용이 많이 듭니다."
 sp_air_gunship_railcannons: "건십 레일캐논"
 sp_air_gunship_railcannons_desc: "이 프로젝트는 대형 레일캐논 어레이를 전용 건십 기체에 탑재하여, 지속적인 전자기 사격으로 표적을 찢어발길 수 있는 항공기를 만들어 냅니다. 극단적인 포구 속도와 정밀한 사격 통제 덕분에 재래식 화기가 반응하기도 전에 드론, 항공기, 지상 부대를 격파할 수 있습니다. 그러나 막대한 비용이 들며, 체계를 가동 상태로 유지하려면 탁월한 전력 생산, 첨단 냉각, 고급 소재가 필요합니다."
 sp_deep_sea_mining: "심해 채굴"
 sp_deep_sea_mining_desc: "산업과 기술의 수요가 커지면서 기존 자원 공급망에 대한 압박이 갈수록 커지고 있습니다. 심해 채굴 역량에 투자함으로써, 우리는 기존 채굴 구역 너머에 있는 핵심 광물에 대한 접근권을 확보하고자 합니다."
 sp_agriculture_drone: "농업용 드론 체계"
 sp_agriculture_drone_desc: "늘어나는 인구를 먹여 살리면서 효율을 유지하는 것은 핵심적인 전략 과제가 되고 있습니다. 첨단 농업용 드론 체계를 도입하면 개선된 모니터링, 정밀 처리, 자동화를 통해 영농 방식을 현대화할 수 있습니다."
 sp_vertical_farming: "수직 농업"
 sp_vertical_farming_desc: "도시화와 토지 부족은 식량 생산에 접근하는 방식을 바꾸어 놓고 있습니다. 수직 농업에 투자함으로써 우리는 농업 생산을 날씨와 지리에 덜 의존하는 통제된 고밀도 환경으로 옮깁니다."
 sp_robotic_humanoid: "가정용 로봇 도우미"
 sp_robotic_humanoid_desc: "일상생활이 기술과 더욱 긴밀하게 통합되면서 휴머노이드 로봇이 가정에서 사람들을 돕게 될 가능성이 커지고 있습니다. 가정용 로봇 도우미를 개발하여 집안 관리, 돌봄, 개인 보조와 같은 일상 업무를 지원하는 것이 우리의 목표입니다."
 sp_robotic_surgery: "로봇 수술"
 sp_robotic_surgery_desc: "의료 체계는 고령화와 증가하는 의료 수요로 인해 점점 더 큰 압박을 받고 있습니다. 로봇 보조 수술의 활용을 확대함으로써 정밀도를 높이고, 회복 기간을 단축하며, 첨단 시술을 더 널리 이용할 수 있도록 하고자 합니다."
 sp_smart_grid: "스마트 그리드 인프라"
 sp_smart_grid_desc: "에너지 소비의 증가와 첨단 기술의 통합은 국가 전력망에 새로운 요구를 하고 있습니다. 스마트 그리드 인프라에 투자하면 전력 분배를 더 잘 관리하고, 수요와 공급의 균형을 맞추며, 체계적 비효율을 줄일 수 있습니다."
 sp_equipment_recycling: "군 장비 재활용 프로그램"
 sp_equipment_recycling_desc: "노후화되었거나 손상된 군 장비를 회수, 재생, 재활용하는 종합 프로그램입니다. 퇴역 플랫폼에서 핵심 자재와 부품을 회수함으로써 군대는 산업 부담을 줄이고 보급 회복력을 높이며, 장기전 중에 발생하는 생산 손실을 부분적으로 상쇄할 수 있습니다."
 sp_epigenetic_reprogramming: "후성유전학적 재프로그래밍"
 sp_epigenetic_reprogramming_desc: "DNA 염기서열을 바꾸지 않고 유전자 발현을 변화시켜 군 인력의 신체적 회복력, 인지 능력, 회복 속도를 높이는 것을 목표로 하는 생물의학 연구 프로그램입니다. 훈련 효율과 전투 준비 태세에서 장기적인 이점을 얻을 수 있는 반면, 윤리적 우려를 불러일으키며 엄격한 규제 감독이 필요합니다."
 sp_nuclear_energy: "원자로"
 sp_nuclear_energy_desc: "원자로는 폭탄의 재료를 생산하는 데 유용합니다. 그러나 생산되는 에너지의 양은 대신 민간 및 군사 산업에 전력을 공급할 수도 있습니다."
 sp_nuclear_bomb: "핵분열 폭탄 프로젝트"
 sp_nuclear_bomb_desc: "핵분열 과정을 이용해 원자에 저장된 에너지를 종말적인 한순간에 방출하는 폭탄입니다. 이러한 무기를 우리 무기고에 갖추고 있다면, 누가 감히 우리에게 맞서겠습니까?"
 sp_amws_combat_system: "AMWS-21 전투 체계"
 sp_zamws_advanced_mws: "XAMWS-24 첨단 다중 무기 체계"
 sp_xciws_close_in_weapon_system: "XCIWS-2B 근접 방어 무기 체계"
 sp_close_range_battle_halberd: "Type-77 근접전용 미늘창"
 sp_great_sword: "BWS-3 그레이트 소드"
 special_project_consumer_costs_high: "비밀 자원 조달"
 special_project_consumer_costs_high_desc: "정부가 막대한 양의 물자를 겉보기에는 무해해 보이는 장소로 빼돌리고 있다는 소문이 은밀히 속삭여집니다. 일부는 그 자원이 비밀 연구 개발 프로젝트에 소비되고 있다고 주장하지만, 이를 확인해 줄 구체적인 증거는 거의 없습니다..."
 special_project_consumer_costs_medium: "비밀 자원 조달"
 special_project_consumer_costs_medium_desc: "$special_project_consumer_costs_high_desc$"
 special_project_consumer_costs_low: "비밀 자원 조달"
 special_project_consumer_costs_low_desc: "$special_project_consumer_costs_high_desc$"
 sp_tag_eh_portal_research: "차원문 연구 프로젝트"
 sp_tag_eh_mech_research: "메카 연구 프로젝트"
 sp_tag_eh_portal_research_speed_factor: "$sp_tag_eh_portal_research$ 속도"
 sp_tag_eh_mech_research_speed_factor: "$sp_tag_eh_mech_research$ 속도"
 sp_biofuel_e10_blend: "E10 에탄올 혼합"
 sp_biofuel_e10_blend_desc: "에탄올을 석유에 10% 농도로 혼합하는 것은 전 세계 수십억 대의 차량에 쓰이고 있는 검증된 상용 기술입니다. E10 생산 기반시설을 표준화하면 수입 화석 연료에 대한 의존도가 줄고, 농업 잉여분이 에너지 구성으로 흘러들며, 기존 정유 및 유통망을 약간만 개조하면 됩니다."
 sp_biofuel_flexfuel_butanol: "플렉스퓨얼 및 부탄올 합성"
 sp_biofuel_flexfuel_butanol_desc: "표준화된 에탄올 혼합을 토대로, 이 계획은 두 가지 경로를 병행하여 추진합니다. 플렉시블 연료 엔진은 E85 및 이와 유사한 고에탄올 혼합물을 허용하여 차량 호환성을 혼합 비율과 분리합니다. 바이오부탄올은 더 높은 에너지 밀도와 휘발유에 더 가까운 냉시동 성능을 제공하지만, 대규모 생산은 아직 해결되지 않은 공학적 과제로 남아 있습니다. 계획이 성공한다면 우리의 정유 부문은 세계 시장을 앞서게 될 것입니다."
 sp_nuclear_bomb_tt: "§Y핵폭탄§! 건조 능력을 잠금 해제합니다."
 sp_caterpillar_3512b: "캐터필러 3512B 디젤 엔진"
 sp_caterpillar_3512b_desc: "캐터필러 3512B는 선박, 발전, 중장비 등 다양한 용도에 널리 사용되어 온 강력하고 신뢰할 수 있는 디젤 엔진입니다. 견고한 설계와 높은 성능 덕분에 남극의 혹독한 환경에서 장비에 동력을 공급하는 데 이상적인 선택입니다."
 sp_premium_living_quarters: "고급 생활 시설"
 sp_premium_living_quarters_desc: "이 고급 생활 시설은 남극에 주둔하는 인원에게 향상된 안락함과 편의 시설을 제공하여 만족도와 기지 생산성을 높입니다."
 sp_drone_surface_combatant: "자율 수상 전투함"
 sp_drone_surface_combatant_desc: "승조원 모집과 유지가 어려워지면서 대형 수상 전투함이 자동화를 중심으로 재설계되고 있습니다. 선택적 유인 호위함과 구축함은 첨단 전자 장비 의존도가 높아지는 대신 적은 인력으로도 원양 존재감을 유지할 수 있게 합니다."
 sp_space_program: "우주 프로그램"
 sp_space_program_desc: "모두가 우주로 가고 싶어 합니다. 폴란드만 빼고요. 폴란드는 우주로 갈 수 없습니다."
 sp_space_weapons_desc: "한때 공상 과학 소설에나 등장하던 이야기였지만, 우리 과학자들은 마침내 진공 상태의 우주 공간에서 사용할 수 있는 공격용 인공위성 및 기타 병기들의 설계를 시작했습니다. 이러한 무기들을 운용할 수 있게 되면 우리의 방어력뿐만 아니라 공격력 또한 강화될 것이며, 우주 공간의 적대 세력을 요격, 교란 및 차단할 수 있게 될 것입니다."
 sp_CNRP: "탄소 나노튜브 강화 폴리머"
 sp_CNRP_desc: "탄소 나노튜브 격자를 항공우주용 복합재에 삽입하면 기존 탄소 섬유보다 더 강하고 가벼운 기체 소재를 얻을 수 있습니다. 중량 절감은 곧바로 항속 거리와 탑재량, 구조 내구성의 향상으로 이어집니다."
