 APC_1: "БТР 1965 года"
 APC_1_desc: "Бронетранспортёры — бронированные машины, предназначенные для доставки в бой отделения солдат, которые затем спешиваются и сражаются в пешем порядке. Они защищают солдат, но, как правило, собственные боевые возможности у них ограничены. Пехоту, перевозимую на БТР, называют механизированной пехотой."
