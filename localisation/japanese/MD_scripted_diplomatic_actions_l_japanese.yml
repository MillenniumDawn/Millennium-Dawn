 OFFER_CIV_GNSS_ACCESS_TITLE: "民間GNSSへのアクセス権を提供"
 OFFER_CIV_GNSS_ACCESS_ACTION_DESC: "民間衛星測位ネットワークへのアクセスを拡大し、彼らの航法・物流インフラを支援する。本助成には技術統合支援、データ共有プロトコル、互換性のある受信システム調整が含まれる。このアクセスにより、輸送、緊急対応、民間インフラ開発における運用効率の向上が促進される。承諾された場合、彼らは我々の§Y民間衛星測位システムネットワーク§!へのアクセス権を獲得する。"
 OFFER_CIV_GNSS_ACCESS_LOC: "民間衛星測位システムへのアクセス提供を打診する"
 OFFER_CIV_GNSS_ACCESS_RECIEVER_LOC: "彼らは民間衛星測位システムネットワークへのアクセス権の提供を申し出ている。"
 OFFER_CIV_GNSS_ACCESS_ACCEPTED_TITLE: "提案が受諾された！"
 OFFER_CIV_GNSS_ACCESS_ACCEPTED_DESC: "彼らは我々の民間衛星測位システムネットワークの恩恵を受けることになる。"
 OFFER_CIV_GNSS_ACCESS_REJECTED_TITLE: "提案は拒否された"
 OFFER_CIV_GNSS_ACCESS_REJECTED_DESC: "我々の民間衛星測位システムネットワークへのアクセス権提供の申し出は拒否された。"
 OFFER_CIV_GNSS_ACCESS_SELECTABLE_TT: "[ROOT.GetNameWithFlag]の§Y民間衛星測位システムレベル§!は、ゼロより大きく、少なくとも[PREV.GetNameWithFlag]のレベルと同等以上でなければならない。"
 REVOKE_CIV_GNSS_ACCESS_TITLE: "民間GNSSへのアクセス権を剥奪"
 REVOKE_CIV_GNSS_ACCESS_ACTION_DESC: "民間衛星測位ネットワークへのアクセス権を停止し、全アップリンク認証情報を無効化する。本措置により、データ共有プロトコルが断絶され、当システムとの統合が停止されるため、彼らの航法・兵站・緊急対応能力に重大な支障をきたす可能性がある。これは関係悪化を示すとともに、彼らの活動に実質的な影響を及ぼす。彼らは我々の§Y民間衛星測位システムネットワーク§!へのアクセス権を全て喪失する。"
