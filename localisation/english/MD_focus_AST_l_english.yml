ast_political_decisions: "Political Decisions"
ast_political_decisions_desc: "Our ability to run the nation requires us to occasionally roll up the sleeves and grease up some palms. Whether that's industry giants or those closer to the government, what we do behind the scenes keeps the country going. It's not honest work, but it's a lot."
ast_approach_the_unions: "Approach the Unions"
ast_approach_the_unions_desc: "None of us like dealing with the unions, but if we're to make any headroom in the industry, compromise has to be made. Our efforts on reform depend on it."
ast_manufacturer_subsidies: "Manufacturer Subsidies"
ast_manufacturer_subsidies_desc: "Subsidies are like the WD40 for production plants. When some of them aren't running so smooth you whip out the subsidies, and hope they slide back into shape."
ast_cabinet_reshuffle: "Cabinet Reshuffle"
ast_cabinet_reshuffle_desc: "Lately the cabinet has been lagging behind the party line. Some are simply ill-fit for the job, while others are downright insubordinate. Fortunately we can use one of the few powers we have as party leader. By reshuffling the cabinet we can place some of our more favorable picks front and centre, and remove those less inclined to aid us."
ast_loosen_gambling_restrictions: "Loosen Gambling Restrictions"
ast_loosen_gambling_restrictions_desc: "A vice among many Australians is gambling. It inhabits almost every veign of of our economy in one way or another. In recent years our policies have come down hard on the industry, but we can loosen some of the restrictions slightly to see some short term gains, and make everyone happy."
ast_revisit_zoning_laws: "Revisit Zoning Laws"
ast_revisit_zoning_laws_desc: "Currently state government and local councils dictate the 'what, where and how' when building on property. Recently property developers have been hounding us to lift some of the restraints. Revisiting the guidelines could eleviate some of these concerns."
cdep: "Community Development Employment Projects"
cdep_desc: "The original program came to be out of a desire for Indigenous communities to be able to plan and construct development projects themselves. The program continued well enough, but we can increase the scope of projects by sending government specialists and increasing the funding available."
nielns: "National Indigenous English Literacy and Numeracy Strategy"
nielns_desc: "Aboriginal and Torres Strait Islander literacy rates have slumped in recent years, which combined with already poor attendance rates is looking like a recipe for disaster. If we work with the schools to develop programs to help the students it could change a lot of lives."
fam_violence_proj: "Family Violence Prevention Projects"
fam_violence_proj_desc: "Family violence was the ugly truth that few politicians wanted to touch in the 90s. New evidence-based approaches have made the process more clinical, and less a policy liability, so funding them is an easy step for us."
construct_recon_place: "Construct the Reconciliation Place"
construct_recon_place_desc: "A number of urban landscape proposals have been drafted and propped on our desk for approval. Chief among them is the Reconciliation Place in Canberra. If approved it could be a wonderful testimony to our efforts."
repatriate_remains: "Repatriate Indigenous Remains"
repatriate_remains_desc: "It's no secret that British museums house a number of pilfered items from other countries. Among them includes human remains. A number of Indigenous groups have petitioned for the remains to be returned to Australia for burial."
mabo_referendum: "State of Reconciliation Amendment"
mabo_referendum_desc: "Amending the constitution formally include a Statement of Reconciliation in the constitution's preamble, recognising Indigenous Australian rights their land."
ast_walk_the_journey_tt: "Programs and actions relating to our reconciliation effort will unlocked in the Political §2Decisions§! tab."
mabo_vibe_tt: "The State of Reconciliation Amendment will become available in §2decisions§!."
ast_strong_in_difference_1_ast: "Managed Multiculturalism"
the_lucky_country_ast: "The Lucky Country"
the_lucky_country_ast_desc: "Years of expanding mining operations and a lack of innovation in other sectors has made us reliant on our export economy. Our conglomerates must dig deep and take their fill if we are to thrive here. Either that or something must change."
wind_power_grants_ast: "Wind Power Grants"
