 SER.Neutral_Autocracy: "£SER_emerging_reactionary 塞尔维亚统一委员会"
 SER.Neutral_Autocracy_icon: "£SER_emerging_reactionary"
 SER.Neutral_Autocracy_desc: "中立专制主义 - 塞尔维亚统一委员会是一个小民族主义政党，由‘阿尔坎’泽利科·拉兹纳托维奇创立，他是‘塞尔维亚志愿卫队’准军事组织的领导人，也是整个巴尔干地区最强大的犯罪头目。他因反人类罪被联合国通缉，并在2000年的前几周被谋杀。新任党魁鲍里斯拉夫·佩莱维奇从来不擅长政治。"
 SER.Neutral_Autocracy_alt: "£SER_western_liberal_alt 塞尔维亚进步党"
 SER.Neutral_Autocracy_alt_icon: "£SER_western_liberal_alt"
 SER.Neutral_Autocracy_alt_desc: "塞尔维亚进步党是一个民粹主义中右翼政党，由塞尔维亚激进党中较为温和的成员创立。"
 HPR.Autocracy: "£HPR_Autocracy 自由共和国"
 HPR.Autocracy_icon: "£HPR_Autocracy"
 HPR.Autocracy_desc: "专制主义 - 自由共和国是哈尔科夫人民共和国领导人创建的一个主要政党。它倡导捍卫哈尔科夫的俄罗斯人民和文化，并全力支持融入俄罗斯。"
 HPR.Nat_Fascism: "£HPR_nationalist_fascism 民族布尔什维克"
 HPR.Nat_Fascism_icon: "£HPR_nationalist_fascism"
 HPR.Nat_Fascism_desc: "法西斯主义 - 国家布尔什维克是一个遍布哈尔科夫人民共和国境内的恐怖组织网络，与俄罗斯国家布尔什维克党密切相关。他们的目标是接管政府并建立俄罗斯民族国家。"
 HPR.Nat_Autocracy: "£HPR_nationalist_military_junta 共和国民兵"
 HPR.Nat_Autocracy_icon: "£HPR_nationalist_military_junta"
 HPR.Nat_Autocracy_desc: "军政府 - 哈尔科夫人民共和国共和民兵是哈尔科夫人民共和国的官方武装部队，为保卫哈尔科夫领土而创建。"
 CUB.Western_Autocracy: "£CUB_western_autocracy 古巴共产党 - §C亲西方派§!"
 CUB.Western_Autocracy_icon: "£CUB_western_autocracy"
 CUB.Western_Autocracy_desc: "古巴共产党内，除了卡斯特罗和切·格瓦拉思想的支持者外，还有同情该国亲西方路线的党员。 但他们的想法比较温和，不包括古巴制度和政策的协调变革。"
