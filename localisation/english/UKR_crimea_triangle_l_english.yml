 UKR_crimean_bop_central_asia_phase_1: "§YCentral Asian§! Repatriation - §YWave 1§!"
 UKR_crimean_bop_central_asia_phase_1_desc: "§WFinance the 1. phase of organized §YCrimean Tatar§! repatriation from consenting Central Asian partners to §Y[669.GetName]§!.§!\n\n§YBudget:§! §R$360 million§!\n§YDuration:§! 180 days\n§YMaximum migration:§! §G+5,000 residents§! in §Y[669.GetName]§! and an equivalent decrease in the source states.\n§YMaximum political effect:§! §G+5 influence points§! influence: §YCrimean Tatars§!; §R−5 influence points§! influence: [SOV.GetFlag] §Y[SOV.GetName]§!.\n\n§YRequires at least one eligible partner to consent.§! §LMigration and influence scale with the eligible partners at completion. The budget is fixed.§!"
 UKR_crimean_bop_asia_mission_stage_1: "Repatriation from §YCentral Asia§! - Wave 1"
 UKR_crimean_bop_asia_mission_stage_1_desc: "§WAn organized return of §YCrimean Tatar§! families to §Y[669.GetName]§! is underway with the consent of participating Central Asian governments.§!\n\n§YDuration:§! 180 days\n§GExpected arrivals:§! up to 5,000 residents\n§YMaximum influence:§! §G+5 influence points§! to §YCrimean Tatars§! / §R−5 influence points§! to [SOV.GetFlag] §Y[SOV.GetNameDef]§!.\n§LThe arrival count can be reduced by state-population safeguards. Diplomatic consent and relative influence are checked again before completion.§!"
 UKR_crimean_bop_central_asia_phase_2: "§YCentral Asian§! Repatriation - §YWave 2§!"
 UKR_crimean_bop_central_asia_phase_2_desc: "§WFinance the 2. phase of organized §YCrimean Tatar§! repatriation from consenting Central Asian partners to §Y[669.GetName]§!.§!\n\n§YBudget:§! §R$600 million§!\n§YDuration:§! 240 days\n§YMaximum migration:§! §G+7,000 residents§! in §Y[669.GetName]§! and an equivalent decrease in the source states.\n§YMaximum political effect:§! §G+7 influence points§! influence: §YCrimean Tatars§!; §R−7 influence points§! influence: [SOV.GetFlag] §Y[SOV.GetName]§!.\n\n§YRequires at least one eligible partner to consent.§! §LMigration and influence scale with the eligible partners at completion. The budget is fixed.§!"
