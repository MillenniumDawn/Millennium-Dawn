 battleship_hull_1: "Casco de acorazado de 1965"
 battleship_hull_1_desc: "Los buques de superficie son el componente principal de la flota y realizan todas las funciones marítimas de la flota tradicional."
 battle_cruiser_hull_1: "Casco de crucero de batalla de 1965"
 battle_cruiser_hull_1_desc: "Los buques de superficie son el componente principal de la flota y realizan todas las funciones marítimas de la flota tradicional."
