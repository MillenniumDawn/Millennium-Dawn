 CZE_airborneform_idea: "Reforma Aeroterrestre"
 CZE_SLO_economic_aid: "Ajuda Econômica"
 CZE_SLO_economic_aid_desc: "O reforço industrial exige muitos fundos. Nosso vizinho está com dificuldades, então vamos ajudá-lo com algum dinheiro."
 CZE_SLO_regional_dominance: "Domínio Regional"
 CZE_SLO_regional_dominance_desc: "Somos melhores que nosso vizinho. Dividir o poder com eles seria problema demais para nós; temos de tomar a iniciativa."
 CZE_SLO_demand_zaolzie: "Exigir Zaolzie"
 CZE_SLO_demand_zaolzie_desc: "A Polônia reivindicou esta região décadas atrás. Foi injusto, mas não se preocupe. Traremos Zaolzie de volta às nossas terras!"
 CZE_catch_up_with_new_technology_hidden_flag: "§GReduz em §Y10§! dias o tempo de pesquisa dos §YLaboratórios Škoda§! por [?CZE_catch_up_with_new_technology_hidden_flag:days_left|Y] dias§!"
 CZE_coherent_political_goals_shortcut: "Árvore Política"
 CZE_a_soldier_and_a_politician_shortcut: "Ramo de Petr Pavel"
 CZE_bohemia_shortcut: "Economia + Škoda"
 CZE_foreign_training_shortcut: "Militar"
 CZE_SLO_re_integration_project_shortcut: "Árvore Compartilhada da Tchecoslováquia"
 CZE_social_committee: "Comitê Social"
 CZE_social_committee_desc: "Um dos órgãos da UE para assuntos sociais e econômicos. Uma de suas funções é aconselhar outros órgãos da UE. Se for suficientemente influenciado por alguns comunistas, pode trazer mudanças inesperadas às decisões da União Europeia."
 CZE_social_committee_idea: "§RKSČM§! - Comitê Social"
 CZE_642_name: "Kraj Královecký"
 CZE_a_soldier_and_a_politician_warning_TT: "§RTodo este ramo desaparecerá se Petr Pavel deixar de estar alinhado com [CZE.GetName]§!"
 CZE_prague_castle_renovation_decisions: "Reforma do Castelo de Praga"
 CZE_prague_castle_renovation_decisions_desc: "O Castelo de Praga é a residência oficial do Presidente da República Tcheca. É um dos maiores castelos do mundo e um símbolo do nosso país. O castelo foi modernizado segundo os padrões atuais, então é hora de reformá-lo mais uma vez e torná-lo um lugar digno do nosso novo rei."
 CZE_first_renovation: "Mudar o Gabinete Presidencial"
 CZE_second_renovation: "Preparar os Aposentos Reais"
 CZE_third_renovation: "Ampliar o Salão"
 CZE_last_renovation: "Preparar os Quartos"
 CZE_SLO_monarchy_reunite: "Reunir-se à Eslováquia"
 CZE_SLO_monarchy_reunite_desc: "Não faz muito tempo, éramos um país unido. Agora o rei Karl von Habsburg quer promulgar algumas políticas comuns com a Eslováquia para concretizar a reunificação em alguns anos."
 CZE_SLO_common_border_controls: "Padronizar os Controles de Fronteira"
 CZE_SLO_mutual_investments: "Investimentos Mútuos"
 CZE_SLO_joint_military_exercises_1: "Participar dos Conflitos da OTAN"
 CZE_SLO_joint_military_exercises_2: "Doutrinas de Exército Comuns"
 CZE_SLO_common_diplomacy: "Diplomacia Comum com a União Europeia"
 CZE_SLO_border_removal_1: "Acabar com a Divisão Pela Diplomacia"
 CZE_SLO_border_removal_2: "Acabar com a Divisão Pela Força"
 CZE_target_monarchy_intromission: "Influência em Grupos Pró-monarquistas Estrangeiros"
 CZE_AUS_expand_the_pressure: "Continuar Financiando os Grupos Pró-monarquistas Austríacos"
 CZE_HUN_expand_the_pressure: "Continuar Financiando os Grupos Pró-monarquistas Húngaros"
 CZE_AUS_return_of_archduke: "Preparar o Retorno do Arquiduque"
 CZE_AUS_prepare_the_media: "Preparar a Mídia"
 CZE_AUS_support_promonarchists: "Apoiar Civis Pró-monarquistas"
 CZE_AUS_reform_one_castle: "Reformar um Castelo para o Arquiduque"
 CZE_the_prague_conference_category: "A Conferência de Praga"
 CZE_the_prague_conference_category_desc: "Como Áustria e Hungria são monarquias novamente, é hora de unir nossas nações e criar uma nova união. A Conferência de Praga será o primeiro passo rumo à unificação das nossas nações. O que será o nosso futuro agora depende das nossas escolhas."
 CZE_joint_land_exercises: "Exercícios Conjuntos do Exército"
 CZE_joint_land_exercises_desc: "Cada exército escolheu uma estratégia diferente; agora podemos treinar contra todas elas e descobrir suas fraquezas para evitá-las."
 CZE_joint_air_exercises: "Exercícios Aéreos Conjuntos"
 CZE_joint_air_exercises_desc: "Aviões e drones são fundamentais na guerra moderna, portanto é vital aprimorar e escolher os melhores aviões e pilotos para a guerra aeroterrestre."
 CZE_share_common_knowledge_in_naval_tactics: "Compartilhar Conhecimento Comum em Táticas Navais"
 CZE_share_common_knowledge_in_naval_tactics_desc: "Devemos preparar uma nova unidade para investigar táticas navais, a fim de sermos capazes de compreender e contra-atacar os inimigos com mais conhecimento do que eles."
 CZE_share_military_intel: "Compartilhar Inteligência Militar"
 CZE_share_military_intel_desc: "A inteligência é fundamental na guerra moderna; devemos compartilhar todas as informações que nossas agências de espionagem possuem."
 CZE_share_military_breakthroughs: "Compartilhar Avanços Militares"
 CZE_common_education_plan: "Plano de Educação Comum"
 CZE_common_education_plan_desc: "A diferença entre todos os nossos sistemas educacionais é um obstáculo para os estudantes que querem estudar nos outros 2 países; devemos impulsionar um sistema educacional comum que facilite a escolha do local de estudo."
 CZE_common_police_action_plan: "Plano de Ação Policial Comum"
 CZE_common_police_action_plan_desc: "As forças policiais locais devem ser capazes de capturar todos os criminosos, não importa onde estejam se escondendo."
 CZE_common_welfare_plan: "Plano de Bem-Estar Comum"
 CZE_common_welfare_plan_desc: "Integrar todas as vantagens do nosso plano de bem-estar ajudará todos os cidadãos dos três países"
 CZE_unify_the_nations: "Unificar as Nações"
 CZE_unify_the_nations_desc: "A Conferência de Praga ajudou a incluir leis e tratados fundamentais para os três governos; agora queremos controlar os governos austríaco e húngaro, embora eles possam decidir o próprio futuro."
 CZE_joint_foreing_embassies: "Unificar as Embaixadas no Exterior"
 CZE_joint_foreing_embassies_desc: "Com a possível anexação ou integração da Áustria e da Hungria, devemos reorganizar todas as nossas embaixadas no exterior para reduzir custos e evitar a duplicação de serviços."
 CZE_shared_foreign_treaties: "Compartilhar Tratados Internacionais"
 CZE_shared_foreign_treaties_desc: "Com a possível anexação ou integração da Áustria e da Hungria, devemos tentar melhorar alguns de todos os nossos antigos tratados."
 CZE_create_a_plan_for_monarchies: "Criar um Plano para as Monarquias Europeias"
 CZE_create_a_plan_for_monarchies_desc: "No último século, as monarquias perderam o poder que um dia tiveram. Portanto, devemos apoiar nossos companheiros reis na Europa, a fim de garantir nossa independência e impedir que grupos políticos radicais cheguem ao poder."
 CZE_shared_debt: "Unificar a Dívida"
 CZE_shared_debt_desc: "Na hipotética anexação ou integração da Áustria e da Hungria, devemos tentar tirar proveito de parte de suas dívidas, para obter bons juros e quitar algumas das mais caras."
 CZE_civilian_investment_in_rural_areas: "Investimentos nas Áreas Rurais"
 CZE_civilian_investment_in_rural_areas_des: "Algumas áreas rurais foram deixadas de lado por anos, enquanto as principais áreas industriais explodiram: devemos melhorar essas áreas para produzir uma fonte confiável de alimentos, em caso de possíveis sanções ou outros tipos de problemas."
 CZE_infrastructure_of_an_empire: "A Infraestrutura de um Império"
 CZE_infrastructure_of_an_empire_desc: "Um bom império deve ser conectado adequadamente; em caso de guerra, precisamos ser capazes de levar rapidamente todas as nossas tropas e equipamentos ao outro lado do império."
 CZE_skoda_learnings: "Compartilhar os Aprendizados da Škoda"
 CZE_skoda_learnings_desc: "Nossa experiência com a Škoda nos ajudou a melhorar tanto a qualidade quanto a quantidade dos bens produzidos. Talvez devêssemos pressionar alguns fabricantes a adotar algumas dessas técnicas em suas linhas de produção"
 CZE_the_kings_congress: "Criar o Conselho do Rei"
 CZE_the_kings_congress_desc: "O rei deve organizar um conselho para se concentrar nos principais problemas de todos os cidadãos. Isso nos ajudará a melhorar a qualidade de vida de todos os nossos cidadãos e poderá ajudar na integração da Hungria e da Áustria"
 CZE_unify_the_nations_2: "Unificar as Nações"
 CZE_fidesz_problem: "O Problema com o Fidesz"
 CZE_fidesz_problem_desc: "Desde a fundação do partido, o Fidesz ampliou sua influência por toda a Hungria. Se quisermos estabelecer um governo pró-Habsburgo, temos de reduzir a influência dele sobre o povo húngaro. \n\nNestas decisões você pode diminuir a popularidade do partido; se tiver espiões e uma rede de espionagem, reduzirá ainda mais a popularidade. No entanto, se a Hungria tiver um espião fazendo contrainteligência, a redução de popularidade será menor. Qualquer decisão em que haja esse aumento/diminuição terá uma dica especial com o valor exato de cada ação."
 CZE_prepare_national_spies: "Preparar a Agência Nacional de Espionagem"
 CZE_prepare_national_spies_desc: "Antes de fazer qualquer coisa na política da Hungria, primeiro precisamos estabelecer uma agência para coordenar nossos agentes e preparar as operações"
 CZE_infiltrate_in_young_sphere: "Infiltrar-se na Ala Jovem"
 CZE_infiltrate_in_young_sphere_desc: "Talvez um ponto fraco na organização nacional do partido esteja entre os mais jovens"
 CZE_infiltrate_in_the_national_party: "Infiltrar-se no Partido Nacional"
 CZE_infiltrate_in_the_national_party_desc: "Precisamos criar algumas conexões no partido nacional para reduzir a influência em todo o país."
 CZE_pressure_low_level_politicians: "Pressionar Políticos de Baixo Escalão"
 CZE_pressure_low_level_politicians_desc: "Alguns dos políticos das cidades podem aceitar alguma pressão para se voltar contra o próprio partido"
 CZE_pressure_high_level_politicians: "Subornar Políticos de Alto Escalão"
 CZE_pressure_high_level_politicians_desc: "Com a quantia certa de dinheiro, podemos subornar alguns dos políticos de alto escalão."
 CZE_bucarest_meeting: "A Reunião de Bucareste"
 CZE_bucarest_meeting_desc: "Hoje discutimos com os romenos como nos comportar diante do nosso inimigo comum, a Hungria. Com uma boa quantidade de novos projetos e políticas para fortalecer um ao outro, podemos ser mais fortes do que a Hungria e preservar a paz na região"
 CZE_create_fake_media: "Campanha de Notícias Falsas"
 CZE_create_fake_media_desc: "Nossa melhor arma contra o governo húngaro é a sua população. Com algumas notícias falsas, podemos minar sua estabilidade e seu poder"
 CZE_anti_hungarian_association: "Apoiar Grupos Anti-Húngaros"
 CZE_anti_hungarian_association_desc: "Devemos dar voz aos grupos contrários ao governo húngaro."
 CZE_weaknesses_of_the_republic: "Colaboração Policial"
 CZE_weaknesses_of_the_republic_desc: "Podemos trocar informações policiais sobre cidadãos húngaros importantes e descobrir seu comportamento."
 CZE_free_movement: "Promulgar Políticas de Imigração Comuns"
 CZE_free_movement_desc: "Se permitirmos a livre circulação entre nossos países, ajudaremos ambas as economias a crescer."
 CZE_ukraine_investments: "Investir na Infraestrutura da Ucrânia"
 CZE_ukraine_investments_desc: "A Ucrânia é um dos países mais importantes para a Hungria. Com algum investimento, poderemos pressionar seu governo a aprovar leis anti-húngaras"
 CZE_rebuild_the_railway_in_ROM: "Melhorar as Ferrovias Soviéticas na Romênia"
 CZE_rebuild_the_railway_in_ROM_desc: "Algumas das antigas ferrovias soviéticas foram abandonadas; devemos tentar recuperá-las e melhorar as existentes."
 CZE_rebuild_the_railway_in_CZE: "Melhorar as Ferrovias Soviéticas na Tchecoslováquia"
 CZE_rebuild_the_railway_in_CZE_desc: "Algumas das antigas ferrovias soviéticas foram abandonadas; devemos tentar recuperá-las e melhorar as existentes."
 CZE_e58_development: "Melhorar a Rodovia E58"
 CZE_e58_development_desc: "Com a melhoria da E58, conectaremos nossos países e, assim, melhoraremos a circulação de pessoas e mercadorias."
 CZE_share_military_knowledge: "Compartilhar Conhecimento Militar"
 CZE_share_military_knowledge_desc: "Devemos compartilhar algumas táticas militares e informações sobre o exército húngaro e outros inimigos."
 CZE_pressure_nato: "Pressionar a OTAN a Expulsar a Hungria"
 CZE_pressure_nato_desc: "Nos últimos anos, a OTAN aumentou o número de membros. Um deles, a Hungria, não está cumprindo os objetivos e, neste momento, a OTAN é um obstáculo à nossa expansão."
 CZE_joint_military_exercises: "Exercícios Militares Conjuntos"
 CZE_joint_military_exercises_desc: "Os exercícios militares melhorarão nossas capacidades contra inimigos estrangeiros."
 CZE_sabotage_infrastructure: "Sabotar a Infraestrutura Húngara"
 CZE_sabotage_infrastructure_desc: "Devemos tentar sabotar parte da infraestrutura húngara para descobrir como reagirão."
 CZE_learn_modern_naval_strategies: "Compartilhar Conhecimento Naval Moderno"
 CZE_learn_modern_naval_strategies_desc: "Atualmente nosso país não tem acesso ao mar e, portanto, desconhecemos algumas das táticas navais atuais. No entanto, os romenos têm muita experiência com combate e táticas navais; podemos tentar descobrir algumas delas."
 CZE_monarchy_event.1.t: "República Tcheca busca apoio"
 CZE_monarchy_event.1.d: "O partido monarquista da República Tcheca busca apoio da nossa família Habsburgo. Eles querem saber se podem contar com a nossa ajuda no futuro, caso consigam restaurar a monarquia na República Tcheca."
 CZE_monarchy_event.1.a: "Os Habsburgos devem se ajudar"
 CZE_monarchy_event.1.b: "A monarquia é um sistema ultrapassado"
 CZE_monarchy_event.2.t: "Habsburgos de [FROM.GetName] apoiam a Koruna Česká"
 CZE_monarchy_event.2.d: "A família Habsburgo de [FROM.GetName] ajudará o nosso partido monarquista a aumentar a popularidade da monarquia em nossa região, caso tenhamos sucesso nas eleições. Isso também aproxima nossos países, pois tanto o nosso partido quanto os Habsburgos começarão reuniões frequentes para discutir o futuro da família."
 CZE_monarchy_event.2.a: "Ótimo!"
 CZE_monarchy_event.3.t: "Habsburgos de [FROM.GetName] se recusam a apoiar a Koruna Česká"
 CZE_monarchy_event.3.d: "A família Habsburgo de [FROM.GetName] é cética quanto aos nossos planos ambiciosos de restaurar a monarquia na República Tcheca e em toda a região. Eles rejeitaram a oferta de ajuda da Koruna Česká."
 CZE_monarchy_event.3.a: "Isso não é bom"
 CZE_monarchy_event.4.t: "Monarquistas tchecos escolhem a democracia"
 CZE_monarchy_event.4.d: "O partido tcheco Koruna Česká decidiu abandonar a ideia de restaurar a monarquia na República Tcheca. Eles escolheram a democracia e se preparam atualmente para as próximas eleições presidenciais."
 CZE_monarchy_event.4.a: "É realmente o fim da monarquia"
 CZE_monarchy_event.5.t: "Migração em massa para a Silésia"
 CZE_monarchy_event.5.d: "Após assumirmos o controle da região da Silésia, tchecos e eslovacos começam a migrar para ela. Eles buscam uma vida melhor e oportunidades de emprego, especialmente na indústria de mineração."
 CZE_monarchy_event.5.a: "Vamos começar!"
 CZE_monarchy_event.6.t: "O fim da migração para a Silésia"
 CZE_monarchy_event.6.d: "Após muitos meses, a migração para a Silésia parece estar se estabilizando. Muitos tchecos e eslovacos encontraram novos empregos para si e suas famílias. A região vai se tornando aos poucos cada vez mais tcheca."
 CZE_monarchy_event.6.a: "Estabilidade, enfim"
 CZE_monarchy_event.7.t: "A questão dos poloneses na região da Silésia"
 CZE_monarchy_event.7.d: "A Silésia pertenceu à Polônia por muito tempo. Há muitos poloneses que não estão nada satisfeitos com o fato de tchecos e eslovacos estarem tomando conta de sua região. Precisamos decidir o que fazer com eles antes que a situação se agrave."
 CZE_monarchy_event.7.a: "Manter os poloneses na Silésia"
 CZE_monarchy_event.7.b: "Deportar os poloneses para a Polônia"
 CZE_monarchy_event.8.t: "A questão da região da Silésia"
 CZE_monarchy_event.8.d: "A Silésia é atualmente controlada pela Polônia. Se quisermos recuperar esse território, precisamos fazer um compromisso. Se concordarmos em dividir a região da Silésia com a Polônia, talvez consigamos manter boas relações."
 CZE_monarchy_event.8.a: "Vamos ficar com a Baixa Silésia"
 CZE_monarchy_event.8.b: "Vamos ficar com a Alta Silésia"
 CZE_monarchy_event.8.c: "Tudo para nós!"
 CZE_monarchy_event.9.t: "Tchecoslováquia exige a Baixa Silésia"
 CZE_monarchy_event.9.d: "A Tchecoslováquia exigiu de nós o estado da Baixa Silésia. Felizmente, ele não é tão rico em recursos quanto a região da Alta Silésia. Podemos aceitar essa oferta e ajudar nossos países a se desenvolverem juntos, já que a Tchecoslováquia afirma que investirá seu dinheiro no desenvolvimento adicional de ambos os estados silesianos."
 CZE_monarchy_event.9.a: "Tudo bem"
 CZE_monarchy_event.9.b: "De jeito nenhum"
 CZE_monarchy_event.10.t: "Tchecoslováquia exige a Alta Silésia"
 CZE_monarchy_event.10.d: "A Tchecoslováquia exigiu de nós o estado da Alta Silésia. Essa região é rica em recursos e não podemos nos dar ao luxo de perdê-la. Devemos pensar duas vezes antes de responder a essa oferta, mas eles prometem ajudar nossos países a se desenvolverem juntos, já que a Tchecoslováquia afirma que investirá seu dinheiro no desenvolvimento adicional de ambos os estados silesianos."
 CZE_monarchy_event.10.a: "Tudo bem"
 CZE_monarchy_event.10.b: "De jeito nenhum"
 CZE_monarchy_event.11.t: "Tchecoslováquia exige ambos os estados da Silésia"
 CZE_monarchy_event.11.d: "A Tchecoslováquia exigiu de nós ambos os estados silesianos. É uma jogada muito ousada da parte deles, alegando que esses estados estão historicamente ligados ao seu território."
 CZE_monarchy_event.11.a: "Tudo bem, podem levar"
 CZE_monarchy_event.11.b: "Se eles querem, que nos declarem guerra!"
 CZE_monarchy_event.12.t: "Polônia se recusa a dividir a Silésia"
 CZE_monarchy_event.12.d: "A Polônia se recusou a dividir a região da Silésia com a Tchecoslováquia. Eles não estão dispostos a abrir mão de nenhuma parte de seu território. A situação está se agravando e as relações entre nossos países estão se deteriorando."
 CZE_monarchy_event.12.a: "Chega de diplomacia"
 CZE_monarchy_event.13.t: "República Tcheca retira as Joias da Coroa"
 CZE_monarchy_event.13.d: "A liderança tcheca decidiu retirar as Joias da Coroa dos cofres da Catedral de São Vito, em Praga. É um ato simbólico para mostrar ao mundo que a República Tcheca está pronta para restaurar a monarquia no país. Os preparativos para a coroação do novo monarca estão prestes a começar; falta só mais um acontecimento significativo."
 CZE_monarchy_event.13.a: "Depois de todo esse tempo... Continuam lindas."
 CZE_monarchy_event.14.t: "Família real Habsburgo prepara um novo evento"
 CZE_monarchy_event.14.d: "A família real Habsburgo tcheca está preparando um evento em cooperação com o governo tcheco. Eles querem mostrar ao mundo que estão prontos para restaurar a monarquia na República Tcheca. O evento será realizado em Praga e contará com a presença de muitos convidados importantes de toda a Europa."
 CZE_monarchy_event.14.a: "Então começa"
 CZE_monarchy_event.15.t: "Começa a reforma do Castelo de Praga"
 CZE_monarchy_event.15.d: "Os Habsburgos decidiram reformar o Castelo de Praga, que é a residência oficial do presidente tcheco. A reforma será feita de modo a preservar o caráter histórico do castelo, mas também torná-lo mais adequado às necessidades de uma monarquia moderna. A reforma custará muito dinheiro, mas é necessária para mostrar que a monarquia está pronta para voltar ao poder."
 CZE_monarchy_event.15.a: "Mãos à obra!"
 CZE_monarchy_event.16.t: "Comunistas detêm os Habsburgos!"
 CZE_monarchy_event.16.d: "Depois que o partido comunista KSČM venceu as últimas eleições, eles decidiram impedir os Habsburgos de restaurar a monarquia na República Tcheca. Alegam que a monarquia é um sistema ultrapassado, sem lugar no mundo moderno. Os Habsburgos estão furiosos com a situação sem saída, pois os comunistas decidiram suspender as reformas até decidirem o que fazer com esse projeto."
 CZE_monarchy_event.16.a: "Droga!"
 CZE_monarchy_event.17.t: "O castelo está pronto para receber a família real"
 CZE_monarchy_event.17.d: "Agora, depois de todas as modificações que fizemos, o castelo enfim se mostra digno de um novo rei. Suas paredes, antes em ruínas, foram restauradas à antiga glória, e os salões ecoam não o silêncio, mas a promessa de uma nova era. Portanto, devemos preparar cada aposento, polir cada pedra e acender cada tocha, pois em breve o rei chegará e deve ser recebido com a honra e a grandeza que seu reinado merece."
 CZE_monarchy_event.17.a: "Preparem o castelo para a chegada da família real!"
 CZE_monarchy_event.18.t: "Família Habsburgo se muda para o Castelo de Praga"
 CZE_monarchy_event.18.d: "A família real está satisfeita em ver as reformas concluídas. Enfim, o castelo se ergue renovado em seu esplendor. Com tudo no lugar, a família real pode agora dar início a seu grande evento, confiante de que o cenário reflete a dignidade e a herança de sua linhagem."
 CZE_monarchy_event.18.a: "Que o evento comece com honra!"
 CZE_monarchy_event.19.t: "O presidente se curva ao novo rei"
 CZE_monarchy_event.19.d: "No meio do discurso do rei em seu glamoroso evento, a visão do presidente da república se curvando ao rei deixou todos os presentes atônitos. Esse momento sinaliza o alvorecer de uma nova era para os tchecos e um capítulo decisivo na história real."
 CZE_monarchy_event.19.a: "O que vem a seguir?"
 CZE_monarchy_event.20.t: "O presidente da República Tcheca se curva a Karl von Habsburg"
 CZE_monarchy_event.20.d: "Uma imagem impressionante do presidente tcheco se curvando a Karl von Habsburg está se espalhando como pólvora; isso pode ser um precedente para a restauração dos Habsburgos na Tchéquia."
 CZE_monarchy_event.20.a: "O presidente deve renunciar após essa atitude."
 CZE_monarchy_event.20.b: "Só esperamos o melhor para o povo tcheco."
 CZE_monarchy_event.21.t: "O presidente tcheco renuncia"
 CZE_monarchy_event.21.des: "Após a imagem espantosa do evento do rei, o presidente teve de renunciar. Agora, o apoio público ao rei aumentou desde as últimas eleições, então talvez ele se torne o próximo presidente da república."
 CZE_monarchy_event.21.a: "O rei pode nos dar um futuro melhor"
 CZE_monarchy_event.21.b: "O rei tcheco é amigo do governo da Áustria"
 CZE_monarchy_event.21.c: "O rei tcheco é amigo do governo da Hungria"
 CZE_monarchy_event.21.d: "Esperamos o melhor para nossos velhos amigos"
 CZE_monarchy_event.21.e: "Esperamos o melhor para o povo tcheco"
 CZE_monarchy_event.23.t: "A Aliança Real"
 CZE_monarchy_event.23.d: "Hoje, os representantes diplomáticos da Tchecoslováquia nos trouxeram uma proposta de aliança. Eles preferem criar um novo pacto de defesa que possa se concentrar em objetivos mais específicos do que os atuais."
 CZE_monarchy_event.23.a: "Gostamos da ideia."
 CZE_monarchy_event.23.b: "Estamos bem por enquanto."
 CZE_monarchy_event.24.t: "A Conferência de Praga"
 CZE_monarchy_event.24.d: "Hoje os negociadores da Áustria, da Hungria e da Tchecoslováquia se reuniram em Praga para estabelecer leis comuns que melhorem as economias e o bem-estar das pessoas dos três países."
 CZE_monarchy_event.24.a: "Seremos mais unidos do que nunca"
 CZE_monarchy_event.24.b: "Esta é uma boa ideia"
 CZE_monarchy_event.25.t: "[FROM.GetName] recusou nossa proposta de aliança"
 CZE_monarchy_event.25.d: "Eles recusaram gentilmente nossa proposta de aliança, provavelmente por preocupações com seu futuro status em [FROM.GetName]."
 CZE_monarchy_event.25.a: "Isso foi inesperado"
 CZE_AUS_monarchy_event.1.t: "Potências estrangeiras estão influenciando nossa política"
 CZE_AUS_monarchy_event.1.d: "Hoje, algumas de nossas agências de defesa nacional notificaram um aumento de fundos para grupos pró-monarquistas. No momento estamos investigando quem apoia esses grupos, mas o principal apoio pode ser o rei da Tchéquia."
 CZE_AUS_monarchy_event.1.a: "Não podemos interferir agora"
 CZE_AUS_monarchy_event.3.t: "Uma proposta real dos tchecos"
 CZE_AUS_monarchy_event.3.d: "Na semana passada, Sua Majestade recebeu uma carta do rei Karl von Habsburg. Ele enfatizou a urgência de um evento real com todas as monarquias da Europa para discutir um objetivo comum. Ele também quer se encontrar com o rei da Bélgica, embora não saibamos por quê, e agora devemos dar uma resposta a ele."
 CZE_AUS_monarchy_event.3.a: "Prepararemos um evento real com todos"
 CZE_AUS_monarchy_event.3.b: "Queremos paz e democracia na Europa, não reis absolutistas."
 CZE_AUS_monarchy_event.4.t: "Um evento real na Inglaterra"
 CZE_AUS_monarchy_event.4.d: "Recebemos um convite para um evento real no Palácio de Buckingham. Sabemos também que algumas outras monarquias comparecerão, então talvez seja uma oportunidade para discutir nossos problemas."
 CZE_AUS_monarchy_event.4.a: "Vamos discutir assuntos importantes com todas as famílias reais da Europa"
 CZE_AUS_monarchy_event.4.b: "O rei não comparecerá, pois atualmente está no exílio."
 CZE_AUS_monarchy_event.5.t: "Um evento real na Inglaterra"
 CZE_AUS_monarchy_event.5.d: "Hoje é um novo dia para a Europa, e devemos decidir se seguiremos as ideias de Karl von Habsburg ou manteremos o status quo."
 CZE_AUS_monarchy_event.5.a: "Gostamos da mudança"
 CZE_AUS_monarchy_event.5.b: "Abolimos o absolutismo por um motivo"
 CZE_AUS_monarchy_event.6.t: "Uma carta secreta de Karl von Habsburg"
 CZE_AUS_monarchy_event.6.d: "Recebemos uma carta com notícias surpreendentes. A carta trata da relutância da família real do Reino Unido em se reunir com alguns monarcas, como o tcheco. Mesmo assim, ele quer uma reunião secreta para discutir assuntos sérios e nos convidou a visitá-lo em seu novo palácio em Praga."
 CZE_AUS_monarchy_event.6.a: "Faremos uma visita real a Praga"
 CZE_AUS_monarchy_event.7.t: "Estamos prontos para enviar o arquiduque a Praga"
 CZE_AUS_monarchy_event.7.d: "Após a visita real do rei tchecoslovaco, consideramos que o arquiduque está pronto para viajar a Praga onde, com a ajuda de Karl von Habsburg, começará seu retorno à Áustria."
 CZE_AUS_monarchy_event.7.a: "O voo está pronto para partir"
 CZE_AUS_monarchy_event.8.t: "A chegada do arquiduque a Praga"
 CZE_AUS_monarchy_event.8.d: "Após meses de preparação, o arquiduque está pronto para retornar à Áustria. Mas antes disso, devemos aumentar sua popularidade para garantir um retorno bem-sucedido."
 CZE_AUS_monarchy_event.8.a: "Enviar nossos melhores especialistas em manipulação social"
 CZE_AUS_monarchy_event.9.t: "O governo não é capaz de manter a estabilidade"
 CZE_AUS_monarchy_event.9.d: "Após muitos protestos nas maiores cidades da Áustria, os pró-monarquistas conquistaram apoio suficiente para paralisar o país. O presidente federal renunciou hoje e as eleições serão realizadas o mais rápido possível."
 CZE_AUS_monarchy_event.9.a: "Os monarquistas vencerão a eleição, mesmo sem ter os votos"
 CZE_AUS_monarchy_event.10.t: "Karl von Habsburg emitiu uma carta de protesto"
 CZE_AUS_monarchy_event.10.d: "O presidente federal recebeu um pedido do rei da Tchecoslováquia. Ele quer recuperar algumas das propriedades históricas da casa Habsburgo-Lorena. No entanto, a maioria das propriedades é usada atualmente pelo governo e não pode ser devolvida neste momento. Podemos propor um pagamento alternativo como compensação, ou podemos recusar suas exigências."
 CZE_AUS_monarchy_event.10.a: "Talvez devêssemos ser amigáveis com nossos vizinhos"
 CZE_AUS_monarchy_event.10.c: "Não apoiamos monarquistas, somos uma República"
 CZE_AUS_monarchy_event.11.t: "Monarquistas nas altas esferas"
 CZE_AUS_monarchy_event.11.d: "Surgiram rumores sobre a infiltração de monarquistas nos altos escalões do nosso governo, o que significa que os grupos monarquistas provavelmente começarão a influenciar nossa política. A cada dia eles reúnem mais apoio e se tornará quase impossível detê-los."
 CZE_AUS_monarchy_event.11.a: "A República está começando a se desestabilizar"
 CZE_AUS_monarchy_event.13.t: "Os monarquistas tomaram o poder na Áustria"
 CZE_AUS_monarchy_event.13.d: "O povo paralisou a Áustria; ninguém sabe por quê, mas a maioria da população entrou em greve. A maioria dessas greves tinha o objetivo de restabelecer os monarquistas na Áustria, acabando com a República. Alguns dos membros remanescentes do governo austríaco afirmaram que o governo tchecoslovaco está por trás desses protestos. A única coisa que sabemos é que hoje o arquiduque assumirá o poder do governo federal, tendo prometido mais estabilidade e um futuro melhor para aqueles que a República esmagou."
 CZE_AUS_monarchy_event.13.a: "Esperamos o melhor para o povo e para o novo governo"
 CZE_AUS_monarchy_event.14.t: "As monarquias estão se reunindo na Inglaterra"
 CZE_AUS_monarchy_event.14.d: "Acabamos de receber um convite para o evento real que solicitamos aos britânicos. Esperamos que as negociações terminem como esperamos."
 CZE_AUS_monarchy_event.14.a: "Preparem o avião agora"
 CZE_AUS_monarchy_event.15.t: "A família real britânica recusou"
 CZE_AUS_monarchy_event.15.d: "Isso foi inesperado; teremos que contatar a família real belga por outros meios, talvez uma carta secreta seja a melhor opção"
 CZE_AUS_monarchy_event.15.a: "O rei aceitou, tragam caneta e papel agora"
 CZE_AUS_monarchy_event.16.t: "A conclusão da reunião real"
 CZE_AUS_monarchy_event.16.d: "Graças à liderança de Karl von Habsburg, temos um caminho claro pelos próximos anos. O objetivo é claro: levar os sentimentos monarquistas às instituições europeias. Como família real britânica, pressionaremos nossos políticos a aprovar leis relacionadas aos nossos interesses reais ou aos das outras monarquias."
 CZE_AUS_monarchy_event.16.a: "Vamos começar a pressionar os políticos agora"
 CZE_AUS_monarchy_event.17.t: "O evento das monarquias europeias"
 CZE_AUS_monarchy_event.17.d: "Após a mudança inesperada de governo no Reino Unido e o exílio da família real britânica, preparamos um evento seguro para todas as monarquias em Praga. O objetivo é discutir como avançaremos os interesses de todas as monarquias europeias, como ampliar nossa influência nas instituições europeias e como lidar com inimigos comuns."
 CZE_AUS_monarchy_event.18.t: "Um evento real em Praga"
 CZE_AUS_monarchy_event.18.d: "Hoje é um novo dia para a Europa, e devemos decidir se seguiremos as ideias de Karl von Habsburg ou manteremos o status quo."
 CZE_AUS_monarchy_event.18.a: "Gostamos da mudança"
 CZE_AUS_monarchy_event.18.b: "Abolimos o absolutismo por um motivo"
 CZE_AUS_monarchy_event.20.t: "A chegada do arquiduque a Praga"
 CZE_AUS_monarchy_event.20.d: "Após o exílio forçado, o arquiduque chegou a Praga. Ninguém sabe onde ele esteve, mas depois do anúncio do evento real celebrado há algum tempo, ele julgou que Praga era uma cidade segura para ele e sua família"
 CZE_AUS_monarchy_event.20.a: "Levem-no ao rei, eles precisam conversar"
 CZE_AUS_monarchy_event.21.t: "O governo austríaco aceita"
 CZE_AUS_monarchy_event.21.d: "Recebemos o primeiro pagamento como compensação pelas propriedades que a república nos roubou."
 CZE_AUS_monarchy_event.21.a: "Dinheiro extra é sempre um bom sinal"
 CZE_AUS_monarchy_event.23.t: "O governo austríaco recusa"
 CZE_AUS_monarchy_event.23.d: "Nosso diplomata na Áustria anunciou que o governo austríaco não está disposto a pagar nada à família Habsburgo e que essas propriedades sempre pertenceram ao governo, não à família real."
 CZE_AUS_monarchy_event.23.a: "Maldição!"
 CZE_SLO_monarchy_event.1.t: "Políticas comuns com a Eslováquia"
 CZE_SLO_monarchy_event.1.d: "Após muita reflexão, selecionamos algumas políticas que podemos estabelecer. Em caso de reunificação, essas políticas ajudarão depois dela."
 CZE_SLO_monarchy_event.1.a: "O rei irá considerá-las"
 CZE_HUN_monarchy_event.1.t: "Pró-monarquistas preparam revoltas"
 CZE_HUN_monarchy_event.1.d: "Nosso serviço nacional de inteligência detectou uma grande quantia de dinheiro chegando a grupos pró-monarquistas em nosso país. Nossos especialistas não sabem o motivo desse aumento nem de onde vem o dinheiro, provavelmente de alguma monarquia da Europa. No momento, eles estão buscando a origem"
 CZE_HUN_monarchy_event.1.a: "Os especialistas cuidarão bem disso"
 CZE_HUN_monarchy_event.3.t: "O problema do Fidesz"
 CZE_HUN_monarchy_event.3.d: "Os grupos pró-monarquistas nos contataram para explicar o problema atual com o partido governante da Hungria. O Fidesz ganhou poder significativo desde sua fundação em 1988. Isso é um problema para nossos interesses, então teremos que lidar com eles primeiro se quisermos colocar um Habsburgo no governo húngaro."
 CZE_HUN_monarchy_event.3.a: "Vamos fazer algumas conexões"
 CZE_HUN_monarchy_event.4.t: "Apoio à oposição"
 CZE_HUN_monarchy_event.4.d: "Como os pró-monarquistas apoiam a restauração monárquica, nossa agência nacional de inteligência tem investigado o governo tchecoslovaco. Hoje descobrimos que alguns dos partidos de oposição receberam dinheiro deles. No entanto, não podemos interferir, pois isso poderia levar a uma instabilidade massiva e poderíamos perder as próximas eleições."
 CZE_HUN_monarchy_event.4.a: "Talvez possamos vazar algumas informações para a mídia"
 CZE_HUN_monarchy_event.5.t: "As eleições húngaras"
 CZE_HUN_monarchy_event.5.d: "As eleições acabaram e os resultados estão prontos para ser anunciados. Quem será o novo líder do nosso país?"
 CZE_HUN_monarchy_event.5.a: "O novo Miniszterelnök é ..."
 CZE_HUN_monarchy_event.6.t: "Quem é o novo líder húngaro?"
 CZE_HUN_monarchy_event.6.d: "O governo húngaro anunciou o fim das eleições que manipulamos. No entanto, não divulgaram os resultados, então não sabemos quem é o novo primeiro-ministro."
 CZE_HUN_monarchy_event.6.a: "Talvez tenham descoberto a manipulação"
 CZE_HUN_monarchy_event.7.t: "As eleições foram manipuladas"
 CZE_HUN_monarchy_event.7.d: "Antes de anunciar o fim das eleições, o governo já sabia que uma potência estrangeira as vinha manipulando. No entanto, as agências nacionais estão trabalhando para descobrir os nomes daqueles que ajudaram o manipulador estrangeiro a alcançar seus objetivos."
 CZE_HUN_monarchy_event.7.a: "Destinaremos todos os recursos aos investigadores"
 CZE_HUN_monarchy_event.7.b: "Não incomodaremos os investigadores"
 CZE_HUN_monarchy_event.7.c: "Não queremos que os investigadores descubram nossa própria manipulação"
 CZE_HUN_monarchy_event.9.t: "As agências húngaras estão investigando nossa manipulação"
 CZE_HUN_monarchy_event.9.d: "O governo anunciou uma grande investigação sobre a manipulação das últimas eleições. Eles já sabem que uma potência estrangeira manipulou as eleições, mas querem ter todas as informações sobre aqueles que executaram a operação."
 CZE_HUN_monarchy_event.9.a: "Isso é muito ruim"
 CZE_HUN_monarchy_event.8.t: "As agências húngaras estão investigando nossa manipulação"
 CZE_HUN_monarchy_event.8.d: "O governo anunciou o início da investigação sobre a manipulação das últimas eleições. O governo não divulgou nada sobre a investigação e apenas declarou que todas as agências estão trabalhando nela."
 CZE_HUN_monarchy_event.8.a: "Ajudaremos todos os nossos colaboradores a escapar do governo húngaro"
 CZE_HUN_monarchy_event.10.t: "As agências húngaras estão investigando nossa manipulação"
 CZE_HUN_monarchy_event.10.d: "O governo não publicou o resultado das eleições, e agora a mídia está pressionando o governo húngaro a publicá-lo. Alguns de nossos agentes infiltrados enviaram informações sobre outra manipulação nas eleições. Se essa informação for verdadeira, talvez o governo húngaro nunca descubra a nossa manipulação"
 CZE_HUN_monarchy_event.10.a: "Isso é perfeito"
 CZE_HUN_monarchy_event.11.t: "Partidos monarquistas querem uma investigação mais secreta"
 CZE_HUN_monarchy_event.11.d: "O primeiro-ministro recebeu uma petição para tornar todas as investigações mais reservadas. Eles afirmam que essas investigações devem ser mantidas em segredo e, portanto, apenas as pessoas necessárias devem saber delas."
 CZE_HUN_monarchy_event.11.a: "Talvez tenham razão, quanto menos pessoas souberem, melhores os resultados"
 CZE_HUN_monarchy_event.11.b: "Não aceitaremos essa manipulação de nossas investigações"
 CZE_HUN_monarchy_event.12.t: "Os monarquistas estão manipulando a investigação"
 CZE_HUN_monarchy_event.12.d: "Nossos membros nos partidos monarquistas húngaros nos informaram sobre uma petição ao primeiro-ministro. Eles querem reduzir o número de pessoas que trabalham na investigação para poder subornar esses agentes. O primeiro-ministro aceitou a proposta e alguns dos grupos monarquistas começaram a subornar esses agentes."
 CZE_HUN_monarchy_event.12.a: "A investigação investigará sem os investigadores"
 CZE_HUN_monarchy_event.13.t: "Os monarquistas não conseguem manipular a investigação"
 CZE_HUN_monarchy_event.13.d: "Nossos membros nos partidos monarquistas húngaros nos informaram sobre uma petição ao primeiro-ministro. Eles querem reduzir o número de pessoas que trabalham na investigação para poder subornar esses agentes. No entanto, o primeiro-ministro rejeitou a proposta, de modo que a investigação pode permanecer totalmente transparente."
 CZE_HUN_monarchy_event.13.a: "Tentamos com o governo, vamos tentar com a mídia"
 CZE_HUN_monarchy_event.14.t: "O povo nos culpa pela manipulação"
 CZE_HUN_monarchy_event.14.d: "Uma conta revelou documentos falsos com o logotipo do governo húngaro. Nesses documentos, explica-se como a manipulação ocorrerá e como combater a mídia. A mídia tradicional transmitiu e publicou informações sobre eles e a maioria agora exige uma aparição do primeiro-ministro."
 CZE_HUN_monarchy_event.14.a: "O primeiro-ministro não comparecerá e esses documentos são falsos"
 CZE_HUN_monarchy_event.15.t: "Uma manipulação completa da mídia"
 CZE_HUN_monarchy_event.15.d: "Os documentos falsos que elaboramos são perfeitos. A mídia tradicional os está transmitindo e exigindo uma aparição do primeiro-ministro. No entanto, o primeiro-ministro recusou e declarou que os documentos são falsos, o que só aumentou a desconfiança no governo."
 CZE_HUN_monarchy_event.15.a: "Enviaremos as informações a mais canais nacionais"
 CZE_HUN_monarchy_event.15.b: "Perfeito, agora podemos comemorar com os criadores dos documentos"
 CZE_HUN_monarchy_event.16.t: "Corrupção no governo"
 CZE_HUN_monarchy_event.16.d: "Os investigadores quase concluíram a investigação. No entanto, durante a investigação, encontraram documentos que apontam para uma manipulação governamental; não queríamos que essa informação vazasse para a mídia, mas alguém acabou de vazá-los."
 CZE_HUN_monarchy_event.16.a: "Aceitar a acusação e demitir alguns membros do governo"
 CZE_HUN_monarchy_event.16.b: "Negar a acusação"
 CZE_HUN_monarchy_event.17.t: "Membros deixam o partido"
 CZE_HUN_monarchy_event.17.d: "Após negarmos a corrupção no governo, alguns de nossos antigos amigos no partido saíram. O governo está prestes a colapsar internamente, e talvez alguns de nossos ministros renunciem."
 CZE_HUN_monarchy_event.17.a: "Foi uma decisão ruim"
 CZE_HUN_monarchy_event.18.t: "A investigação interna foi concluída"
 CZE_HUN_monarchy_event.18.d: "Após a descoberta da corrupção no governo, alguns dos membros de mais alto escalão do partido pressionaram por uma investigação externa. A empresa responsável pela investigação concluiu que não houve corrupção no partido. No entanto, esperamos que alguns dos atuais ministros renunciem devido a esse caso inaceitável de corrupção."
 CZE_HUN_monarchy_event.18.a: "Estamos aguardando as renúncias"
 CZE_HUN_monarchy_event.19.t: "Governo húngaro envolvido em um caso de corrupção"
 CZE_HUN_monarchy_event.19.d: "Hoje recebemos notícias de um escândalo no governo húngaro. Nesse caso, ninguém do nosso governo esteve envolvido, mas isso ajuda nossos amigos na Hungria a chegar ao poder o mais rápido possível."
 CZE_HUN_monarchy_event.19.a: "Só mais um passo"
 CZE_HUN_monarchy_event.20.t: "O governo húngaro envolvido em um caso de corrupção massivo"
 CZE_HUN_monarchy_event.20.d: "As notícias que recebemos são excelentes. Atualmente, o governo húngaro perdeu todo o apoio interno. Isso é ótimo para nossos interesses no país. Agora talvez possamos pressionar um pouco mais e colocar um rei Habsburgo no poder."
 CZE_HUN_monarchy_event.20.a: "Pelos Habsburgos"
 CZE_HUN_monarchy_event.21.t: "Membros do governo húngaro renunciam"
 CZE_HUN_monarchy_event.21.d: "Após os escândalos de corrupção no governo húngaro, alguns ministros renunciaram para estabilizar a situação e manter o apoio dos membros do partido. O partido anunciou os resultados de uma auditoria externa confirmando que a corrupção afetou apenas membros do governo. No entanto, o povo perdeu a confiança no governo e aguarda um novo partido que ofereça melhores promessas."
 CZE_HUN_monarchy_event.21.a: "Vamos aumentar nossa popularidade"
 CZE_HUN_monarchy_event.22.t: "O relatório final da investigação"
 CZE_HUN_monarchy_event.22.d: "A investigação foi concluída, mas os investigadores não encontraram nada sobre a operação. Portanto, o relatório afirmou que os resultados da eleição eram absolutamente válidos e que o governo tentou permanecer no poder sem apoio popular. O primeiro-ministro não fez nenhuma declaração sobre a investigação."
 CZE_HUN_monarchy_event.22.a: "O governo está tentando abolir nossa democracia"
 CZE_HUN_monarchy_event.23.t: "O relatório final sobre as eleições húngaras"
 CZE_HUN_monarchy_event.23.d: "Nossa operação foi um sucesso absoluto. A investigação não encontrou nenhuma pista de nosso envolvimento nas manipulações. O melhor é que declararam que o governo tentou rejeitar os resultados."
 CZE_HUN_monarchy_event.23.a: "Talvez os Habsburgos possam lhes dar alguma estabilidade"
 CZE_HUN_monarchy_event.24.t: "O governo tchecoslovaco pede as propriedades dos Habsburgos"
 CZE_HUN_monarchy_event.24.d: "Hoje, Karl von Habsburg, chefe da casa Habsburgo, exigiu a devolução das propriedades que confiscamos após o exílio deles. Atualmente, a maioria das propriedades está em uso e não podemos devolvê-las neste momento."
 CZE_HUN_monarchy_event.24.a: "Oferecer uma compensação monetária"
 CZE_HUN_monarchy_event.24.b: "Estamos colaborando com os Habsburgos e precisamos dessas propriedades"
 CZE_HUN_monarchy_event.24.c: "Somos uma república e essas propriedades pertencem à república"
 CZE_HUN_monarchy_event.25.t: "O governo húngaro oferece uma compensação monetária"
 CZE_HUN_monarchy_event.25.d: "O governo húngaro declarou precisar dessas propriedades, porém propôs uma compensação monetária. Talvez essa nova renda nos ajude a influenciar o governo deles e a reivindicar essas propriedades quando um partido aliado estiver no poder."
 CZE_HUN_monarchy_event.25.a: "Aceitar a proposta"
 CZE_HUN_monarchy_event.26.t: "O governo húngaro recusa"
 CZE_HUN_monarchy_event.26.d: "O governo húngaro expressou sua posição: são uma república e todas as propriedades dos Habsburgos pertencem à república desde 1921."
 CZE_HUN_monarchy_event.26.a: "Desestabilizar a nação"
 CZE_HUN_monarchy_event.27.t: "A reunião de Bucareste"
 CZE_HUN_monarchy_event.27.d: "O governo tchecoslovaco propôs uma reunião bilateral para tratar do problema húngaro. Esta pode ser uma chance de ganhar mais influência na região e aumentar nosso poder internacional."
 CZE_HUN_monarchy_event.27.a: "Estamos prontos para negociar com os tchecoslovacos."
 CZE_HUN_monarchy_event.29.t: "Os tchecoslovacos estão tentando manipular nossa política"
 CZE_HUN_monarchy_event.29.d: "O governo tchecoslovaco criou uma nova agência nacional de espionagem. Nossos especialistas esperam um aumento no número de novos espiões em nosso país. Se quisermos manter nossa estabilidade política, devemos designar alguns de nossos agentes para realizar contrainteligência."
 CZE_HUN_monarchy_event.29.a: "Enviem-nos para proteger nosso país!"
 CZE_HUN_monarchy_event.31.t: "Manipulação no comércio húngaro"
 CZE_HUN_monarchy_event.31.d: "Uma das maiores conquistas da reunião de Bucareste foi a manipulação do comércio húngaro com a Rússia. Atualmente, bloqueamos algumas das ferrovias ucranianas que se conectam à Hungria. Se oferecermos uma porcentagem da renda desse comércio, eles podem nos ajudar a estabelecer um bloqueio contra a Hungria."
 CZE_HUN_monarchy_event.31.a: "Quanto menos, melhor"
 CZE_HUN_monarchy_event.31.b: "Negociar apenas com os países com conexões diretas"
 CZE_HUN_monarchy_event.31.c: "Vamos bloquear todas as suas fronteiras"
 CZE_HUN_monarchy_event.32.t: "Uma oferta estranha do governo tchecoslovaco"
 CZE_HUN_monarchy_event.32.d: "Eles nos pediram para bloquear ou reduzir todo o comércio de e para a Hungria. Em troca, nos darão uma porcentagem da renda do bloqueio."
 CZE_HUN_monarchy_event.32.a: "É uma situação em que todos ganham"
 CZE_HUN_monarchy_event.33.b: "Perdemos com esse acordo, avisaremos a Hungria"
 CZE_HUN_monarchy_event.36.t: "Potências estrangeiras manipulando nosso comércio"
 CZE_HUN_monarchy_event.36.d: "Hoje, os russos nos alertaram sobre uma proposta estranha que os tchecoslovacos lhes ofereceram. Pediram a manipulação do nosso comércio em troca de parte da renda dessa manipulação. Analisamos todo o comércio que acreditamos ter sido manipulado e agora devemos tomar uma atitude."
 CZE_HUN_monarchy_event.36.a: "Declarar guerra a todos os países que não são da OTAN"
 CZE_HUN_monarchy_event.36.b: "Há inimigos demais para combater"
 CZE_HUN_monarchy_event.37.t: "O arquiduque chega a Budapeste"
 CZE_HUN_monarchy_event.37.d: "Os funcionários do Aeroporto Internacional Ferenc Liszt de Budapeste detectaram a chegada do arquiduque à Hungria. Eles aguardam uma resposta oficial sobre como lidar com ele."
 CZE_HUN_monarchy_event.37.a: "Se todos os seus documentos estiverem corretos, deixem-no entrar"
 CZE_HUN_monarchy_event.37.b: "Ele nunca entrará na Hungria"
 CZE_HUN_monarchy_event.38.t: "Os pró-monarquistas organizaram revoltas"
 CZE_HUN_monarchy_event.38.d: "Após a chegada do arquiduque a Budapeste, alguns dos grupos monarquistas mais influentes organizaram revoltas exigindo a renúncia do primeiro-ministro. O arquiduque não declarou nada sobre sua disposição de governar a Hungria caso os monarquistas cheguem ao poder."
 CZE_HUN_monarchy_event.38.a: "Deixem-nos protestar, o primeiro-ministro não renunciará"
 CZE_HUN_monarchy_event.39.t: "Pró-monarquistas contra a decisão de não permitir a entrada do arquiduque na Hungria"
 CZE_HUN_monarchy_event.39.d: "Os monarquistas descobriram que bloqueamos a entrada do arquiduque na Hungria. Todos eles estão organizando revoltas contra o governo, e esperamos que sejam muito significativas."
 CZE_HUN_monarchy_event.39.a: "Preparar a polícia para conter as revoltas"
 CZE_HUN_monarchy_event.40.t: "A morte do arquiduque José"
 CZE_HUN_monarchy_event.40.d: "Na noite passada, o arquiduque José da dinastia Habsburgo faleceu. O funeral está planejado para Madri, onde ele viveu por muitos anos."
 CZE_HUN_monarchy_event.40.a: "Temos que nomear um novo rei para o nosso governo"
 CZE_HUN_monarchy_event.40.b: "Que descanse em paz"
 CZE_HUN_monarchy_event.41.t: "O novo rei da Hungria"
 CZE_HUN_monarchy_event.41.d: "Após longa deliberação e com a aprovação de alguns membros da dinastia Habsburgo, decidimos nomear Viktor Orbán como o novo rei da Hungria. Karl von Habsburg quer padronizar as leis tanto na Tchecoslováquia quanto na Hungria, e Viktor Orbán é a melhor opção para alcançar esse objetivo."
 CZE_HUN_monarchy_event.41.a: "Preparar a coroação"
 CZE_HUN_monarchy_event.42.t: "O fim da reunião de Bucareste"
 CZE_HUN_monarchy_event.42.d: "Melhoramos nossas relações com a Romênia e promulgamos leis comuns para beneficiar ambos os países. Agora é hora de nos preparar para enfrentar a Hungria e, sem ela, alcançar o domínio regional."
 CZE_HUN_monarchy_event.42.a: "Uma nova era começou"
 CZE_HUN_monarchy_event.43.t: "Romênia e Tchecoslováquia nos pressionam!"
 CZE_HUN_monarchy_event.43.d: "Os representantes de ambos os países contataram o secretário-geral da OTAN para expulsar a Hungria da organização. O secretário da OTAN nos contatou para decidirmos o que fazer."
 CZE_HUN_monarchy_event.43.a: "Expulsar a Hungria, ela nunca ajudou a organização"
 CZE_HUN_monarchy_event.43.b: "Não aceitamos pressão de nenhum país"
 CZE_HUN_monarchy_event.44.t: "O governo perdeu o controle"
 CZE_HUN_monarchy_event.44.d: "Após muitas semanas de protestos, muitos policiais aderiram às greves e o governo perdeu o poder de controlá-los. O ministro responsável pela polícia renunciou e há rumores de que alguns outros ministros também renunciarão."
 CZE_HUN_monarchy_event.44.a: "O governo está se desmoronando"
 CZE_HUN_monarchy_event.45.t: "Os monarquistas chegaram ao poder"
 CZE_HUN_monarchy_event.45.d: "Os grupos monarquistas venceram as eleições e agora podem promulgar uma nova constituição para remover as ideias republicanas do governo húngaro. Por ora, devemos escolher um novo primeiro-ministro."
 CZE_HUN_monarchy_event.45.a: "O primeiro-ministro será o futuro novo rei"
 CZE_prague_conference_event.1.t: "Exercícios conjuntos do exército"
 CZE_prague_conference_event.1.d: "O governo tchecoslovaco propôs exercícios conjuntos do exército com a participação dos exércitos tchecoslovaco, austríaco e húngaro. Esta será uma ótima oportunidade para melhorar nossas relações com as novas monarquias e mostrar ao mundo nosso poder militar compartilhado. Após 45 dias de treinamento, certamente ganharemos uma quantidade significativa de experiência e aprimoramento da doutrina terrestre."
 CZE_prague_conference_event.1.a: "Ótima ideia!"
 CZE_prague_conference_event.2.t: "Exercícios aéreos conjuntos"
 CZE_prague_conference_event.2.d: "O governo tchecoslovaco acha que nossa força aérea não está devidamente preparada para a guerra moderna. Eles sugerem exercícios aéreos conjuntos entre nossos países. Após 45 dias de treinamento, certamente ganharemos uma quantidade significativa de experiência e aprimoramento da doutrina aérea."
 CZE_prague_conference_event.2.a: "Tudo que melhore nossa força aérea é bem-vindo"
 CZE_prague_conference_event.3.t: "Intercâmbio de conhecimento naval"
 CZE_prague_conference_event.3.d: "Nossos países podem não ter grande experiência em guerra naval, mas ainda assim podemos aprender muito uns com os outros. O governo tchecoslovaco propôs um intercâmbio de conhecimento naval entre nossos países. Após 45 dias de discussão, certamente ganharemos uma quantidade significativa de experiência e aprimoramento da doutrina naval. Quem sabe quando isso será útil?"
 CZE_prague_conference_event.3.a: "Claro, por que não"
 CZE_prague_conference_event.4.t: "[CZE.GetName] quer compartilhar inteligência militar"
 CZE_prague_conference_event.4.d: "O governo [CZE.GetAdjectiveCap] está disposto a compartilhar inteligência militar conosco. Isso nos permitirá melhorar nossas capacidades militares e obter vantagem sobre nossos inimigos. No entanto, devemos ter cuidado para não compartilhar informações demais que possam ser usadas contra nós no futuro. Após 45 dias de discussão, certamente ganharemos uma quantidade significativa de experiência e aprimoramento da inteligência militar."
 CZE_prague_conference_event.4.a: "Um pouco arriscado, mas tudo bem"
 CZE_prague_conference_event.5.t: "[CZE.GetName] quer compartilhar avanços militares"
 CZE_prague_conference_event.5.d: "Nossos países vão bem sozinhos, mas, se quisermos ficar à frente da concorrência, precisamos compartilhar nossos avanços militares uns com os outros. O governo [CZE.GetAdjectiveCap] está disposto a compartilhar conosco seus mais recentes avanços militares. Após 45 dias de discussão, certamente ganharemos um aprimoramento significativo em avanços militares."
 CZE_prague_conference_event.5.a: "Excelente plano"
 CZE_prague_conference_event.6.t: "[CZE.GetName] planeja integrar programas educacionais"
 CZE_prague_conference_event.6.d: "O governo [CZE.GetAdjectiveCap] planeja integrar programas educacionais entre nossos países. Isso nos permitirá compartilhar conhecimento e melhorar nossos sistemas educacionais. Após 45 dias de discussão, certamente ganharemos um impulso significativo à pesquisa nacional e à produtividade."
 CZE_prague_conference_event.6.a: "Rumo ao futuro brilhante!"
 CZE_prague_conference_event.7.t: "[CZE.GetName] amplia nossa cooperação entre forças policiais"
 CZE_prague_conference_event.7.d: "Há países que não apoiam nossa prosperidade e bem-estar. Ao ampliar nossa cooperação com as forças policiais [CZE.GetAdjectiveCap], poderemos proteger melhor nossos cidadãos e manter a ordem em nossa sociedade. Após 45 dias de discussão, certamente ganharemos um impulso significativo à segurança nacional."
 CZE_prague_conference_event.7.a: "Vamos manter nossos países seguros"
 CZE_prague_conference_event.8.t: "[CZE.GetName] busca melhores condições de vida"
 CZE_prague_conference_event.8.d: "O governo [CZE.GetAdjectiveCap] busca maneiras de melhorar as condições de vida de seus cidadãos e dos nossos. Trabalhando juntos, podemos encontrar soluções para problemas comuns e criar um futuro melhor para nosso povo. Após 45 dias de discussão, certamente ganharemos um impulso significativo ao desenvolvimento nacional e à estabilidade."
 CZE_prague_conference_event.8.a: "Claro"
 CZE_prague_conference_event.9.t: "[CZE.GetName] finaliza a Conferência de Praga"
 CZE_prague_conference_event.9.d: "A Conferência de Praga foi um grande sucesso. Alcançamos todos os nossos objetivos e fortalecemos nossos laços com o governo [CZE.GetAdjectiveCap]. A conferência nos permitiu compartilhar conhecimento, melhorar nossas capacidades militares e criar um futuro melhor para nosso povo. Devido aos recentes sucessos do governo tchecoslovaco, eles decidiram assumir a liderança de nosso grupo e tomar em suas mãos as responsabilidades de desenvolvimento de nossas nações. Perderemos parte da independência, mas ganharemos muito em troca."
 CZE_prague_conference_event.9.a: "Finalmente chegou a hora"
 CZE_prague_conference_event.9.b: "Eles se saíram muito bem, mas não o bastante para abrirmos mão da nossa independência"
 CZE_prague_conference_event.10.t: "[FROM.GetName] aceita nossas condições"
 CZE_prague_conference_event.10.d: "O governo [FROM.GetAdjectiveCap] aceitou nossas condições de independência limitada. A Conferência de Praga foi um grande sucesso para eles, que esperam trabalhar conosco no futuro."
 CZE_prague_conference_event.10.a: "Ótimo!"
 CZE_prague_conference_event.11.t: "[FROM.GetName] rejeita nossas condições"
 CZE_prague_conference_event.11.d: "O governo [FROM.GetAdjectiveCap] rejeitou nossas condições de independência limitada. Eles não estão prontos para abrir mão de sua soberania e buscam outras formas de cooperar conosco. Teremos que encontrar outra maneira de trabalhar juntos."
 CZE_prague_conference_event.11.a: "O quê?!"
 CZE_prague_conference_event.12.t: "O plano de unificação começa"
 CZE_prague_conference_event.12.d: "Hoje começaram nossos planos de unificar as embaixadas no exterior. A maioria de nossos diplomatas de alto escalão será realocada ou dispensada. Esperamos que apenas os melhores diplomatas dos três países permaneçam em seus cargos, o que pode nos ajudar a firmar bons tratados com outros países no futuro."
 CZE_prague_conference_event.12.a: "A diplomacia leva tempo"
 CZE_prague_conference_event.13.t: "A reassinatura dos tratados"
 CZE_prague_conference_event.13.d: "Reassinamos muitos tratados; isso pode não ser um problema, mas muitos de nossos diplomatas no exterior ficaram sobrecarregados com a papelada e começaram a aprovar acordos bastante ruins com outros países. Essa medida não foi a certa, mas esperamos refazê-la quando nos consolidarmos como uma nação única"
 CZE_prague_conference_event.13.a: "Esses diplomatas deveriam ser demitidos!"
 CZE_prague_conference_event.14.t: "O caminho a seguir por Karl von Habsburg"
 CZE_prague_conference_event.14.d: "O rei da Tchecoslováquia nos procurou novamente para reconsiderarmos nossa situação geopolítica. Ele estabeleceu uma série de objetivos comuns que todos os monarcas da Europa devem alcançar, e também forneceu alguns truques para superar as dificuldades que podemos ter no processo"
 CZE_prague_conference_event.14.a: "Uma boa oferta que não devemos recusar"
 CZE_prague_conference_event.14.b: "Alinhamo-nos firmemente com a visão democrática da Europa"
 CZE_prague_conference_event.15.t: "A questão da dívida"
 CZE_prague_conference_event.15.d: "Temos o prazer de anunciar a solução para o problema da dívida dos três países. Muitos investidores questionavam a capacidade do rei de pagar a dívida. Hoje o ministro da economia anunciou uma série de medidas para integrar toda a dívida em um fundo comum. Parte da dívida será quitada quando todos os países se reunirem, mas uma parte muito maior permanecerá como dívida compartilhada.\n Com esse anúncio, alguns investidores passaram a investir nos três países na esperança de obter bom retorno com a unificação deles"
 CZE_prague_conference_event.15.a: "Todos deveriam investir em nosso país"
 CZE_prague_conference_event.16.t: "A infraestrutura rural"
 CZE_prague_conference_event.16.d: "Devido à sua pouca importância no PIB de nossos países, deixamos as áreas rurais com infraestrutura obsoleta. Agora, com este plano, melhoraremos tanto o PIB dessas áreas quanto uma rota alternativa para o transporte terrestre."
 CZE_prague_conference_event.16.a: "Devemos focar na área rural tchecoslovaca"
 CZE_prague_conference_event.16.b: "Devemos focar na infraestrutura mais obsoleta"
 CZE_prague_conference_event.17.t: "Melhorias na Škoda"
 CZE_prague_conference_event.17.d: "Dedicamos bastante verba e tempo à descoberta de novas formas de melhorar tanto os carros quanto sua fabricação. Portanto, devemos implementar todas essas técnicas em algumas marcas locais de automóveis, tanto na Hungria quanto na Áustria"
 CZE_prague_conference_event.17.a: "Esperávamos melhorar ainda mais"
 CZE_prague_conference_event.17.b: "Esperávamos produzir mais"
 CZE_prague_conference_event.17.c: "Queremos melhorar tanto os projetos quanto a produção"
 CZE_prague_conference_event.20.t: "[FROM.GetName] aceita nossas condições"
 CZE_prague_conference_event.20.d: "O governo [FROM.GetAdjectiveCap] aceitou nossas condições de integração. A Conferência de Praga foi um grande sucesso para todos."
 CZE_prague_conference_event.20.a: "Ótimo!"
 CZE_prague_conference_event.21.t: "[FROM.GetName] rejeita nossas condições"
 CZE_prague_conference_event.21.d: "O governo [FROM.GetAdjectiveCap] rejeitou nossas condições de integração. Eles não estão prontos para abrir mão de sua soberania e buscam outras formas de cooperar conosco. Teremos que encontrar outra maneira de trabalhar juntos."
 CZE_prague_conference_event.21.a: "Mostrarei a eles o caminho mais rápido para a integração"
 CZE_the_end_of_czech_communism_tt: "Proíbe o §RKSČM§!\n\nSe o §RKSČM§! tiver mais de §Y30%§! de popularidade:\n §R-5%§! de §Yestabilidade\n §R-75§! de poder político§!"
 CZE_monarchist_past: "Passado Monarquista"
 CZE_monarchist_past_desc: "A República Tcheca tem uma longa história de monarquia, com o último rei governando até 1918. A ideia de restaurar a monarquia ainda está presente na mente de alguns cidadãos, e o crescente interesse pelos Habsburgos e outras famílias reais é um sinal disso. A questão é se devemos abraçar esse passado ou seguir em frente com uma nova visão de futuro."
 CZE_koruna_ceska_program: "Programa Koruna Česká"
 CZE_koruna_ceska_program_desc: "O Programa Koruna Česká visa restaurar a soberania e a independência da República Tcheca promovendo o uso da coroa tcheca como moeda nacional. Seu programa busca a restauração da monarquia tcheca com a Casa de Habsburgo-Lorena. O partido foi fundado em 1990."
 CZE_democratic_feudalism: "Feudalismo Democrático"
 CZE_democratic_feudalism_desc: "As pessoas não seguirão o rei apenas por ele ser o rei. Precisamos criar um sistema em que o rei seja eleito pelo povo, mas ainda tenha o poder de governar. Isso garantirá que nossa monarquia seja diferente da antiga e seja mais bem recebida no mundo moderno."
 CZE_strive_from_the_democratic_system: "Buscar Algo Além do Sistema Democrático"
 CZE_strive_from_the_democratic_system_desc: "A velha monarquia era um sistema em que o rei tinha poder absoluto. E essa forma de governo durou séculos. Então por que não tentar de novo? Com apoio suficiente dos Habsburgos na Hungria e na Áustria, podemos conquistar grande apoio para nossa causa. O povo seguirá o rei mais uma vez, e o rei levará o país à prosperidade."
 CZE_promote_presidential_elections: "Promover Eleições Presidenciais"
 CZE_promote_presidential_elections_desc: "Os outros Habsburgos não ficarão felizes com nossa decisão de apoiar as eleições presidenciais, mas temos que fazê-lo. O povo precisa escolher seu líder. Não deixaremos o antigo sistema de monarquia voltar, mas criaremos um novo, com o rei escolhido pelo povo."
 CZE_limited_eu_trust_koruna_ceska: "Confiança Limitada na UE"
 CZE_limited_eu_trust_koruna_ceska_desc: "A União Europeia é uma ótima ideia, mas não é perfeita. Precisamos ter cuidado com nossa confiança na UE e garantir que nossos interesses sejam protegidos. Há outros partidos em nosso país que compartilham essa visão, então vamos trabalhar juntos."
 CZE_cooperation_with_ods: "Cooperação com o ODS"
 CZE_cooperation_with_ods_desc: "O ODS compartilha nossa visão de confiança limitada na UE e de aspirações democráticas. Podemos trabalhar juntos para alcançar nossos objetivos comuns."
 CZE_cooperation_with_kdu_csl: "Cooperação com o KDU-ČSL"
 CZE_cooperation_with_kdu_csl_desc: "O KDU-ČSL é atualmente o partido mais antigo da República Tcheca. Eles compartilham nossos valores cristãos e o sistema familiar tradicional. Com esses valores sociais, podemos cooperar pelo bem maior."
 CZE_parliamentary_cooperation: "Cooperação Parlamentar"
 CZE_parliamentary_cooperation_desc: "O sucesso da reunião com outros partidos abre caminho para mais cooperação no parlamento. Com o apoio do ODS e do KDU-ČSL, podemos superar os comunistas e os social-democratas e fazer nossas vozes serem ouvidas."
 CZE_integrate_with_democratic_countries: "Integrar-se aos Países Democráticos"
 CZE_integrate_with_democratic_countries_desc: "Os países democráticos são liderados pelo presidente, então nosso \"rei\" terá que se adaptar a esse sistema. Se os outros países aceitarem essas condições, poderemos começar a nos integrar a eles."
 CZE_trust_in_the_old_system: "Confiança no Sistema Antigo"
 CZE_trust_in_the_old_system_desc: "As pessoas precisam saber que nossa visão monarquista não é pior que a atual e que podemos levar o país à prosperidade. Não deixaremos o antigo sistema de monarquia voltar, mas criaremos um novo, com reis escolhidos pelo povo."
 CZE_prepare_a_new_president: "Preparar um Novo Presidente"
 CZE_prepare_a_new_president_desc: "Hoje em dia a palavra presidente soa melhor que a palavra rei, então, para não causar mal-entendidos, prepararemos um novo presidente. Para nós, ele será o rei do nosso país, mas para o povo, ele será um presidente."
 CZE_seek_support_from_hungary: "Buscar Apoio da Hungria"
 CZE_seek_support_from_hungary_desc: "A Hungria é um país com longa história de monarquia, e os Habsburgos têm fortes laços com a família real húngara. Podemos buscar o apoio deles em nossos esforços para restaurar a monarquia na República Tcheca."
 CZE_seek_support_from_austria: "Buscar Apoio da Áustria"
 CZE_seek_support_from_austria_desc: "O apoio dos Habsburgos austríacos terá um impacto significativo em nossos esforços para restaurar a monarquia em nosso país. Se reunirmos as famílias Habsburgo, poderemos criar uma aliança forte que nos ajudará a alcançar nossos objetivos."
 CZE_promote_the_traditional_family_system: "Promover o Sistema Familiar Tradicional"
 CZE_promote_the_traditional_family_system_desc: "O sistema familiar tradicional é a base de nossa sociedade. Precisamos promovê-lo e garantir que seja respeitado e protegido. Os Habsburgos têm uma longa história de promoção do sistema familiar tradicional, pois o viam como um símbolo de estabilidade e uma poderosa ferramenta nas decisões políticas."
 CZE_old_way_of_country_management: "Antiga Forma de Gerir o País"
 CZE_old_way_of_country_management_desc: "A antiga forma de gerir o país é a forma como os Habsburgos governavam. É um sistema em que o rei tem poder absoluto e o povo deve seguir suas ordens. Esse sistema já provou ser eficaz no passado, então seguiremos os passos de nossos ancestrais."
 CZE_attack_kscm: "Atacar o KSČM"
 CZE_attack_kscm_desc: "Esses comunistas já mostraram o quão destrutivo é seu sistema, não só para o nosso país, mas para o mundo todo. Não os deixaremos governar de novo e faremos tudo para destruir sua influência em nosso país."
 CZE_attack_cssd: "Atacar o ČSSD"
 CZE_attack_cssd_desc: "O ČSSD, companheiro do KSČM, apoia publicamente suas ações. Os amigos de nossos inimigos são nossos inimigos."
 CZE_christian_and_protestant_values: "Valores Cristãos e Protestantes"
 CZE_christian_and_protestant_values_desc: "Em contraste com a visão de mundo dos Habsburgos, podemos conectar os valores católicos e protestantes para criar um Estado multirreligioso forte. Isso nos ajudará a unir o povo e criar uma base sólida para nossa nova monarquia, onde todos serão respeitados e protegidos, independentemente de sua religião."
 CZE_multi_religious_state: "Estado Multirreligioso"
 CZE_multi_religious_state_desc: "Afinal, os Habsburgos eram puramente católicos, sem consideração por outras religiões. Mas isso foi há centenas de anos. Hoje, se mostrarmos às pessoas que podemos respeitar outras religiões, poderemos criar um país ainda maior do que o do reinado dos Habsburgos."
 CZE_petr_nohel: "Petr Nohel"
 CZE_petr_nohel_desc: "Petr Nohel é heraldista, genealogista e teólogo. Ele trata da genealogia e da heráldica de famílias nobres, especialmente de dinastias reinantes e antigas dinastias reinantes. Também se ocupa de questões de educação e ensino superior em geral."
 CZE_vaclav_srb: "Václav Srb"
 CZE_vaclav_srb_desc: "Václav Srb foi aprovado no Exame Estadual de Intérprete-Tradutor em francês, italiano e russo, o que lhe permitiu viver como guia turístico. Em 1991, fundou sua própria agência de viagens, a Praga Magica. Seu talento social e grande envolvimento em nosso partido certamente farão dele um grande líder do nosso país no futuro."
 CZE_radim_spacek: "Radim Špaček"
 CZE_radim_spacek_desc: "Radim Špaček não é apenas um político, mas também um biólogo que estudou métodos matemáticos de processamento de dados em pesquisa experimental na Faculdade de Letras da Universidade Carolina. Sua rica experiência política e conhecimento do mundo nos ajudarão a criar um futuro melhor para nosso país."
 CZE_the_end_of_czech_communism: "O Fim do Comunismo Tcheco"
 CZE_the_end_of_czech_communism_desc: "Nosso país sofreu o bastante com o regime comunista. Vamos deter os comunistas de uma vez por todas."
 CZE_decentralization_of_the_economy: "Descentralização da Economia"
 CZE_decentralization_of_the_economy_desc: "Uma economia centralizada demais é vulnerável à corrupção e à ineficiência. Precisamos descentralizar nossa economia e dar mais poder às regiões. Isso nos ajudará a criar uma economia mais eficiente e eficaz."
 CZE_the_question_of_the_silesia_region: "A Questão da Região da Silésia"
 CZE_the_question_of_the_silesia_region_desc: "Parte da região da Silésia foi tomada pela Polônia após a Primeira Guerra Mundial. Essa região é rica em recursos naturais e tem grande potencial de desenvolvimento. Precisamos encontrar uma forma de trazê-la de volta ao nosso país e torná-la novamente parte da nossa nação."
 CZE_get_czechs_and_slovaks_closer_to_eachother: "Aproximar Tchecos e Eslovacos"
 CZE_get_czechs_and_slovaks_closer_to_eachother_desc: "A recriação da Tchecoslováquia foi uma ótima ideia, mas ainda há muito trabalho a fazer. Precisamos finalmente reunir nossas nações para fortalecer nossa posição no mundo."
 CZE_regional_development: "Desenvolvimento Regional"
 CZE_regional_development_desc: "A República Tcheca é um país com grande potencial de desenvolvimento. Precisamos investir em nossas regiões e torná-las mais atraentes para investidores. Isso nos ajudará a criar novos empregos e melhorar a qualidade de vida em nosso país."
 CZE_claims_on_silesia: "Reivindicações sobre a Silésia"
 CZE_claims_on_silesia_desc: "Então a Polônia decidiu não nos devolver nossa região da Silésia. Bem, a diplomacia nem sempre é a melhor forma de resolver problemas. Tomaremos à força o que é nosso, se necessário."
 CZE_invest_in_new_roads: "Investir em Novas Estradas"
 CZE_invest_in_new_roads_desc: "A Polônia decidiu compartilhar a Silésia conosco, então vamos mostrar que foi uma boa decisão. Investiremos em novas estradas e infraestrutura para tornar essa região mais atraente para investidores e turistas. Isso melhorará ambos os países."
 CZE_history_is_what_keeps_us_together: "A História É o Que Nos Mantém Unidos"
 CZE_history_is_what_keeps_us_together_desc: "Tchecos e eslovacos têm uma longa história de cooperação e amizade. Precisamos construir sobre essa história e criar um forte laço entre nossas nações. Isso nos ajudará a criar um futuro melhor para ambos os países."
 CZE_repopulate_silesia_with_czechs_and_slovaks: "Repovoar a Silésia com Tchecos e Eslovacos"
 CZE_repopulate_silesia_with_czechs_and_slovaks_desc: "A Silésia é novamente parte do nosso país, mas a população ainda é majoritariamente polonesa. Precisamos repovoar essa região com tchecos e eslovacos para criar um território forte e unido."
 CZE_increase_power_of_the_royal_family: "Aumentar o Poder da Família Real"
 CZE_increase_power_of_the_royal_family_desc: "Lidamos com o problema da Silésia e com a sociedade dividida. Com essas questões resolvidas, a nova família real mostrou à Europa que é capaz de governar o país. Agora precisamos aumentar seu poder e fazer dela um símbolo da nossa nação."
 CZE_more_independent_regions: "Regiões Mais Independentes"
 CZE_more_independent_regions_desc: "As regiões são dependentes demais do governo central. Precisamos dar a elas mais poder e autonomia para tomarem suas próprias decisões."
 CZE_expand_local_industry: "Expandir a Indústria Local"
 CZE_expand_local_industry_desc: "Com as novas estradas na Silésia, agora podemos nos concentrar em expandir a indústria local. A Silésia é rica em recursos naturais e tem grande potencial de desenvolvimento, por isso devemos desenvolvê-la ainda mais."
 CZE_grants_for_farmers: "Subsídios para Agricultores"
 CZE_grants_for_farmers_desc: "Os agricultores são a espinha dorsal da nossa economia. Precisamos apoiá-los e ajudá-los a expandir seus negócios. Os subsídios os ajudarão a investir em novos equipamentos e tecnologia, o que melhorará sua produtividade e competitividade."
 CZE_dust_off_the_crown_jewels: "Tirar o Pó das Joias da Coroa"
 CZE_dust_off_the_crown_jewels_desc: "Depois de tantos anos de pó sobre as joias reais, talvez seja a hora de recuperá-las e devolvê-las ao brilho glorioso que um dia tiveram."
 CZE_prepare_for_the_coronation: "Preparar um Evento Especial"
 CZE_prepare_for_the_coronation_desc: "O rei precisa encontrar apoio em todos os partidos do país, então a melhor opção pode ser preparar um evento real"
 CZE_rule_of_karl_of_habsburg: "A Coroação de Karl von Habsburg"
 CZE_rule_of_karl_of_habsburg_desc: "Após essa série inesperada de eventos, a popularidade de Karl von Habsburg aumentou graças às suas promessas de estabilidade e economia."
 CZE_two_nations_one_crown: "Duas Nações sob Uma Coroa"
 CZE_two_nations_one_crown_desc: "O rei quer se reunir com nossos velhos amigos, mas nossa reputação não é boa. Talvez, se adotarmos algumas políticas comuns, possamos nos reunir e, assim, formar novamente a Tchecoslováquia"
 CZE_austrian_monarchists: "Monarquistas Austríacos"
 CZE_austrian_monarchists_desc: "Os austríacos faziam parte do império austro-húngaro; só esperamos que compreendam os problemas de sua democracia e instalem um líder Habsburgo para resolvê-los."
 CZE_hungarian_monarchists: "Monarquistas Húngaros"
 CZE_hungarian_monarchists_desc: "Os húngaros faziam parte do império austro-húngaro; só esperamos que descubram a tirania do partido político Fidesz e se tornem um país mais livre com um rei Habsburgo."
 CZE_royal_alliance: "Aliança Real"
 CZE_royal_alliance_desc: "A partir de agora, a Europa tem outro país com um rei Habsburgo, portanto devemos unir forças para nos defender de nossos inimigos."
 CZE_seperation_of_powers: "Separação de Poderes"
 CZE_seperation_of_powers_desc: "Desde a queda do império austro-húngaro, nossos países tomaram caminhos diferentes; devemos tentar deixar essas diferenças de lado e nos reunir mais uma vez, resolvendo os problemas que tivemos. Mas primeiro devemos estabelecer algumas leis para ajudar em sua integração"
 CZE_the_new_austro-hungary_project: "O Projeto da Nova Áustria-Hungria"
 CZE_the_new_austro-hungary_project_desc: "Desde a queda do império austro-húngaro, nossos países tomaram caminhos diferentes, e todos eles, com exceção da Tchecoslováquia, resultaram em um Estado ruim. Queremos anexá-los para controlar e melhorar todas as suas fraquezas. Mas primeiro devemos estabelecer algumas leis para ajudar na integração."
 CZE_reach_to_the_house_of_habsburg-lorraine: "Reivindicar as Propriedades da Casa de Habsburgo-Lorena"
 CZE_reach_to_the_house_of_habsburg-lorraine_desc: "Após a proclamação da república austríaca, a maioria das propriedades dos Habsburgos foi confiscada. Agora, com um rei Habsburgo, pressionaremos o governo deles a devolvê-las."
 CZE_gain_influence_in_the_austrian_government: "Ganhar Influência no Governo Austríaco"
 CZE_gain_influence_in_the_austrian_government_desc: "Agora que temos alguns grupos civis se mobilizando contra o governo, podemos tentar pressionar mais e introduzir alguns pró-monarquistas no governo federal. Este é só mais um passo para colocar um rei Habsburgo na Áustria."
 CZE_encourage_british_royal_family_support: "Preparar um Evento com Todas as Monarquias Europeias"
 CZE_encourage_british_royal_family_support_desc: "A Europa está se unindo, mas as casas reais têm objetivos e problemas diferentes. Devemos organizar uma reunião para falar sobre todos esses problemas e seguir um caminho comum para superá-los. Talvez devamos insistir com a família real britânica para que seja realizada na Inglaterra."
 CZE_visit_belgium: "Visita Real à Bélgica"
 CZE_visit_belgium_desc: "Após a reunião real, o próximo passo é convencer o príncipe da Bélgica a reivindicar seu direito ao trono austríaco; a visita é apenas uma cortesia para preparar seu retorno, primeiro a Praga e, quando o povo austríaco estiver pronto, à Áustria."
 CZE_initiate_the_return_of_the_archduke_lorenz_of_austria-este: "Iniciar o Retorno do Arquiduque Lorenz"
 CZE_initiate_the_return_of_the_archduke_lorenz_of_austria-este_desc: "Após uma visita incrível à Bélgica e negociações perfeitas com o príncipe, podemos começar a preparar uma campanha nas redes sociais para ampliar o apoio entre o povo da Áustria."
 CZE_kingdom_of_austria: "O Reino da Áustria."
 CZE_kingdom_of_austria_desc: "Conseguimos, o povo manifestou o desejo de ter um rei, só precisamos enviar o arquiduque à Áustria. No momento a república está se desmoronando, então não terá poder algum contra o seu retorno e, talvez, sua chegada seja o golpe final em sua queda."
 CZE_the_problem_with_fidesz: "O Problema do Fidesz"
 CZE_the_problem_with_fidesz_desc: "O Fidesz ganhou muita popularidade entre o povo húngaro; se queremos estabelecer um Habsburgo na Hungria, temos que destruir a popularidade do Fidesz."
 CZE_support_the_opposition: "Apoiar a Oposição"
 CZE_support_the_opposition_desc: "Com a queda inicial do Fidesz, temos que fortalecer nosso partido e a oposição."
 CZE_manipulate_the_elections: "Manipular as Eleições"
 CZE_manipulate_the_elections_desc: "O lance final contra o Fidesz e os partidos democráticos: temos que garantir que o partido do rei ganhe votos suficientes para formar um governo."
 CZE_meeting_with_romania: "A Reunião de Bucareste"
 CZE_meeting_with_romania_desc: "Devemos discutir com o governo romeno assuntos importantes sobre segurança e cooperação. Devemos concentrar nossos esforços em nosso inimigo comum, a Hungria."
 CZE_visit_archduke_joseph_arpad: "A Visita do Arquiduque José Árpád"
 CZE_visit_archduke_joseph_arpad_desc: "Se conseguirmos que o arquiduque chegue à capital, ganharemos apoio suficiente e um rei para coroar na Hungria."
 CZE_kingdom_of_hungary: "Reino da Hungria"
 CZE_kingdom_of_hungary_desc: "Tudo está pronto para a coroação, o povo aprovou a monarquia e não gosta do governo atual, só precisamos enviar a ordem."
 CZE_manipulate_hungarian_trade_with_russia: "Manipular o Comércio Húngaro"
 CZE_manipulate_hungarian_trade_with_russia_desc: "Um dos principais parceiros comerciais é a Rússia, vista como inimiga pela Europa; talvez, se tentarmos manipular esse comércio, possamos ficar com uma parte dele sem que ninguém reclame."
