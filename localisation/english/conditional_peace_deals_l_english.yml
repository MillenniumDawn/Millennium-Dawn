 CPD_annex_state_button_TT_CONCESSION: "Concede States"

 CPD_annex_state_button_TT_DELAYED_DEMAND: "We can §YDemand States§! from our opponent and directly annex these states into our nation."
 CPD_annex_state_button_TT_DELAYED_CONCESSION: "We can §YConcede States§! that we own to the enemy in an effort to conclude our conflict."

 # Make Puppet Localization
 CPD_make_puppet_button_TT: "[CPD_MAKE_PUPPET_TT_LOC]"
 CPD_make_puppet_button_TT_DELAYED: "[CPD_MAKE_PUPPET_TT_DELAYED_LOC]"

 CPD_make_puppet_button_TT_DEMAND: "Create Puppet Government"
 CPD_make_puppet_button_TT_CONCESSION: "Concede Puppet Government"

 CPD_make_puppet_button_TT_DELAYED_DEMAND: "We can create a §YPuppet Government§! in the demanded states that is loyal to us."
 CPD_make_puppet_button_TT_DELAYED_CONCESSION: "We can allow a §YPuppet Government§! in the offered states that is loyal to the enemy."

 # Demilitarize State Localization
 CPD_demilitarise_state_button_TT: "[CPD_DEMILITARISE_TT_LOC]"
 CPD_demilitarise_state_button_TT_DELAYED: "[CPD_DEMILITARISE_TT_DELAYED_LOC]"

 CPD_demilitarise_state_button_TT_DEMAND: "Demand Demilitarisation of States"
 CPD_demilitarise_state_button_TT_CONCESSION: "Propose Demilitarisation of States"

 CPD_demilitarise_state_button_TT__DELAYED_DEMAND: "We can demand §YDemilitarisation§! within a state, preventing the opposing military from operating there."
 CPD_demilitarise_state_button_TT__DELAYED_CONCESSION: "We can concede §YDemilitarisation§! within a state, preventing our military from operating there."

 # Liberate in State Localization
 CPD_liberate_in_state_button_TT: "[CPD_LIBERATE_TT_LOC]"
 CPD_liberate_in_state_button_TT_DELAYED: "[CPD_LIBERATE_TT_DELAYED_LOC]"

 CPD_liberate_in_state_button_TT_DEMAND: "Liberate States"
 CPD_liberate_in_state_button_TT_CONCESSION: "Grant Independence"

 CPD_liberate_in_state_button_TT_DELAYED_DEMAND: "We can §YLiberate States§! by returning them to the country with rightful ownership as an independent nation."
 CPD_liberate_in_state_button_TT_DELAYED_CONCESSION: "We can §YGrant Independence§! to states we own, releasing them to the country with rightful ownership as an independent nation."

