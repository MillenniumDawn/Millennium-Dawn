 ROM_ukr_cede_tt: "§YUkraine will hand over every Romanian core state it holds§!"
 ROM_ukr_refuse_tt: "§RWe will gain a war goal to take our stolen lands by force§!"
 ROM_core_compliance_tt: "Unlocks the §YRomanianization§! decisions. Western Banat, Southern Dobruja and the Partium can each be made Romanian cores once that state reaches §Y80%§! compliance."
