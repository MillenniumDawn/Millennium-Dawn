 china_news.43.t: "Китай объявляет стратегию для Корейского полуострова"
 china_news.43.d: "Китайская Народная Республика объявила о формировании официальной стратегической позиции в отношении Корейского полуострова. Председатель Си Цзиньпин заявил, что Китай больше не будет вести корейскую политику через неопределённость."
 china_news.43.a: "Принять к сведению заявление"
