 MD_artc_exercise_operations: "合成兵种野战演习"
 MD_artc_exercise_operations_desc: "将旅级部队部署到训练区域，从头到尾演练陆军的作战构想，涵盖从机动接敌到扩张战果及补给的全过程。"
 MD_artc_ex_operations_short: "陆军作战理论专精提升90天"
 MD_artc_exercise_dedicated: "作战训练中心轮换"
 MD_artc_exercise_dedicated_desc: "部队轮流进入战斗训练中心，在仪器化条件下与专业假想敌部队对抗。每次交战都会通过详细的战后报告进行复盘。"
 MD_artc_ex_dedicated_short: "专职学说精通度提升90天"
 MD_artc_exercise_training: "实弹训练周期"
 MD_artc_exercise_training_desc: "营队通过分级实弹训练计划进行从单兵武器资格认证到连级合成兵种射击场的一系列演练。"
 MD_artc_ex_training_short: "训练学说精通度提升90天"
 MD_artc_exercise_leadership: "指挥所演习"
 MD_artc_exercise_leadership_desc: "师和军司令部部署其指挥所并展开模拟战役。参谋人员演练命令拟制、战斗跟踪以及在压力下移交指挥权。"
 MD_artc_ex_leadership_short: "领导学说精通度提升90天"
 MD_artc_exercise_technology: "实验部队试验"
 MD_artc_exercise_technology_desc: "一个指定的实验编队将在实战中测试新型传感器、网络和武器。其发现将影响整个军队如何采用新装备。"
 MD_artc_ex_technology_short: "科技学说精通度提升90天"
 MD_artc_exercise_structure: "编队战备演习"
 MD_artc_exercise_structure_desc: "部队全面动员并接到短时间通知后部署，以检验陆军编成结构在快速部署中的表现。"
 MD_artc_ex_structure_short: "组织学说精通度提升90天"
 MD_artc_staff_college_name: "指挥与参谋学院"
 MD_artc_staff_college_short: "每位陆军指挥官都会积累经验，并且可能会获得新的特质。"
 MD_artc_staff_college_cooldown: "指挥与参谋培训课程正在进行中"
 MD_artc_staff_college_cooldown_desc: "野战军官正在参加指挥与参谋学院的学习。本期学员毕业后，下一期课程随即开始。"
 MD_artc_senior_course_name: "高级指挥官课程"
 MD_artc_senior_course_short: "一位陆军元帅获得一级技能提升，若无符合条件的元帅，则由一位将军获得。"
 MD_artc_senior_course_cooldown: "高级指挥官课程正在进行中"
 MD_artc_senior_course_cooldown_desc: "将军们正在完成为军团和集团军级指挥的高级指挥训练。本期学员毕业后，下一期课程随即开始。"
 MD_artc_rnd_liaison_name: "陆军研发联络官"
 MD_artc_rnd_liaison_short: "获得一个陆战突破点。"
 MD_artc_rnd_liaison_cooldown: "陆军研发联络官激活"
 MD_artc_rnd_liaison_cooldown_desc: "陆军军官被派往陆战研究机构，将作战经验转化为研发需求。"
 MD_artc_academy_name: "战斗训练计划"
 MD_artc_academy_short: "解锁学院精神，提升演习效果。"
