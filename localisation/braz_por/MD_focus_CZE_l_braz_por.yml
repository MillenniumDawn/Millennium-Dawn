 CZE_engine_tech: "Motor R4 a Gasolina Aprimorado"
 CZE_engine_tech_2: "Motor V6 a Gasolina Avançado"
 CZE_engine_tech_2_desc: "Motores em V costumam ser melhores que os do tipo R. Vale mencionar, porém, que consomem mais combustível, o que pode ser um problema em caso de guerra, mas precisamos equipar nossos veículos com o melhor possível."
 CZE_engine_tech_3: "Motor a Gasolina TSI Aprimorado"
 CZE_engine_tech_3_desc: "Nossa mais nova versão do motor TSI oferece velocidade máxima maior que os motores TDI, mas ao custo de maior consumo de combustível."
 CZE_engine_tech_4: "Motor Diesel TDI Aprimorado"
 CZE_engine_tech_4_desc: "O novo motor TDI é pior que sua alternativa TSI, mas também consome menos combustível, então valeu o nosso tempo de pesquisa."
 CZE_engine_tech_5: "Motor R4 a Gasolina Moderno"
 CZE_engine_tech_5_desc: "Hora de alcançar um nível completamente novo de tecnologia de motores. Esta é a melhor versão do R4 que já criamos. Oferece enorme potência com um custo de construção muito menor que as invenções da concorrência."
 CZE_engine_tech_6: "Motor V6 a Gasolina Turboalimentado"
 CZE_engine_tech_6_desc: "Outra melhoria de alta tecnologia, com atributos um pouco piores que o nosso segundo projeto, mas com consumo de combustível muito reduzido."
 CZE_engine_tech_7: "Motor Diesel V12 Estendido"
 CZE_engine_tech_7_desc: "Os motores Tatra se encaixam perfeitamente em nossos tanques. A nova versão V12 dará grande apoio às nossas forças terrestres."
 CZE_engine_tech_8: "Motor Diesel ISX15"
 CZE_engine_tech_8_desc: "Os problemas desses motores são o alto custo de produção e o consumo de combustível. Mas suas capacidades são muito superiores às dos motores R4 ou V6 padrão."
 CZE_engine_tech_9: "Motor Diesel X12 Sobrealimentado"
 CZE_engine_tech_9_desc: "É melhor mirar na máxima produtividade. Este projeto exigirá que produzamos mais combustível e recursos, mas aumentará muito o desempenho de nossos tanques."
 CZE_engine_tech_10: "Motor Diesel X12 Mais Leve"
 CZE_engine_tech_10_desc: "Não podemos arcar com custos tão altos de produção e manutenção, então manteremos os motores mais novos o mais baratos possível. Ainda é uma grande conquista para a empresa Tatra."
 CZE_el_engine_tech: "Motor Elétrico de Nova Geração Inicial"
 CZE_el_engine_tech_desc: "Quem disse que a Škoda não é capaz de produzir motores elétricos por conta própria? É o primeiro teste dessa tecnologia, mas os efeitos podem ser muito úteis para pesquisas futuras."
 CZE_el_engine_tech_2: "Motor Elétrico de Alta Tensão"
 CZE_el_engine_tech_2_desc: "Precisamos reduzir um pouco a confiabilidade para liberar todo o potencial dessa tecnologia. O mais novo motor elétrico é muito caro de produzir, mas a monstruosa quantidade de potência e o custo muito baixo de combustível valem o investimento."
