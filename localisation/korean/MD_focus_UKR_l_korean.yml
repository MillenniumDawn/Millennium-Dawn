 ukraine_modernize_sov_equipment_btr_60_modernization_bulgaria_overhaul_cost_full_tt: "정비 비용: §R0.07십억§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_bulgaria_overhaul_cost_known_tt: "정비 비용: §R0.03십억§!, 우리 공장이 이미 §YBTR-60D§! 작업에 익숙하기 때문입니다"
 ukraine_modernize_sov_equipment_btr_60_modernization.10.name: "§YBTR-60PB§! 지원을 요청한 우크라이나"
 ukraine_modernize_sov_equipment_btr_60_modernization.10.desc: "§Y[From.GetNameWithFlag]§!이(가) 전쟁에 군사 원조로 쓰겠다며 창고에 보관 중인 구형 §YBTR-60PB§! §Y[?FROM.ukraine_bul_btr60_offer_amount|0]§!대를 요청했습니다. 넘겨주면 돌려받을 수 없습니다."
 ukraine_modernize_sov_equipment_btr_60_modernization.10.a: "넘겨준다"
 ukraine_modernize_sov_equipment_btr_60_modernization.10.b: "요청을 거절한다"
 ukraine_modernize_sov_equipment_btr_60_modernization.10_accept_tt: "창고에 보관 중인 §YBTR-60PB§! §Y[?FROM.ukraine_bul_btr60_offer_amount|0]§!대를 §Y[From.GetNameWithFlag]§!에 §R제공§!합니다."
 ukraine_modernize_sov_equipment_btr_60_modernization.11.name: "§Y[From.GetNameWithFlag]§!이(가) 보내온 §YBTR-60PB§!"
 ukraine_modernize_sov_equipment_btr_60_modernization.11.desc: "§Y[From.GetNameWithFlag]§!이(가) 우리가 요청한 §YBTR-60PB§! §Y[?ukraine_bul_btr60_offer_amount|0]§!대를 제공하기로 했습니다."
 ukraine_modernize_sov_equipment_btr_60_modernization.11.a: "반가운 소식이군"
 ukraine_modernize_sov_equipment_btr_60_modernization.12.name: "요청을 거절한 §Y[From.GetNameWithFlag]§!"
 ukraine_modernize_sov_equipment_btr_60_modernization.12.desc: "§Y[From.GetNameWithFlag]§!은(는) 더 이상 §YBTR-60PB§!를 제공하지 않을 것입니다. 인도는 여기서 끝납니다."
 ukraine_modernize_sov_equipment_btr_60_modernization.12.a: "아쉽군"
 ukraine_rada.3.name: "우크라이나의 집에 모인 다수파"
 ukraine_rada.3.desc: "의원 237명이 본회의장을 걸어 나와 길 건너 우크라이나의 집에서 따로 등록을 마쳤습니다. 좌파가 여전히 의사당과 연단, 전자 투표판을 쥐고 있기에, 새로 형성된 친대통령 다수파는 건물 밖에서 표결을 진행해 의장 올렉산드르 트카첸코와 그의 공산당 소속 부의장 아담 마르티뉵의 해임을 의결했습니다. 트카첸코는 이를 쿠데타라고 부르며 자리를 지키고, 자신이 통제할 수 없는 회의는 개회를 거부하고 있습니다. 이제 베르호우나 라다의 두 쪽이 저마다 의회를 자처하고 있으며, 우리가 어느 쪽을 인정하느냐에 따라 그쪽이 곧 의회가 됩니다."
 ukraine_rada.4.name: "의장석에 앉은 이반 플류시"
 ukraine_rada.4.desc: "다수파가 이반 플류시를 베르호우나 라다 의장으로 선출했습니다. 그는 1991년 독립을 의결한 의회를 이끌었던 인물이며, 누구의 후보인지는 의심할 여지가 없습니다. 진짜 전리품은 그의 제1부의장에게 돌아갔습니다. 사회민주당의 빅토르 메드베드추크가 이제 의사 일정과 위원회 명단, 모든 표결의 시점을 좌우합니다. 좌파는 달리 할 수 있는 일이 없어 의사당으로 돌아왔고, 1년째 묶여 있던 법안들도 마침내 표결에 부칠 수 있게 되었습니다."
 ukraine_rada.5.name: "연대의 출범과 두 원내 교섭단체의 소멸"
 ukraine_rada.5.desc: "교섭단체 등록부가 단 하루 오후 만에 새로 짜였습니다. 페트로 포로셴코는 의원 17명을 모아 '연대'라는 새 그룹을 만들었고, 올렉산드르 트카첸코의 농민당과 파블로 라자렌코의 흐로마다에 남아 있던 이들은 둘 다 최소 인원에 미달해 사라졌습니다. 소속이 없는 의원이 30명가량 되며, 위원회 자리를 내줄 수 있는 쪽이면 누구든 이들을 구애하고 있습니다. 의사당에서 달라진 것은 산술뿐이지만, 이 의회에서는 산술이 곧 정치입니다."
 ukraine_rada.6.name: "무소속 그룹의 해체"
 ukraine_rada.6.desc: "무소속 그룹이 더 이상 하나의 그룹인 척하기를 그만두었습니다. 소속 의원들은 등록된 이름의 편의 말고는 아무것도 그들을 묶어 두지 못했고, 위원회 자리가 다수파 안에서 배분되는 지금은 밖에 남아 있을 이유가 없습니다. 대부분은 올렉산드르 볼코우의 지역 부흥당으로, 일부는 우크라이나 노동당으로 갔으며, 몇몇은 어디에도 가지 않았습니다. 의사당의 그룹은 하나 줄었고, 다수파는 셈에 넣을 수 있는 표가 조금 늘었습니다."
 ukraine_rada.7.name: "전 우크라이나 국민투표"
 ukraine_rada.7.desc: "유권자의 81%가 투표했고, 모든 문항이 80%가 넘는 찬성으로 통과되었습니다. 이제 대통령은 의회가 다수파를 구성하지 못하거나 예산을 제때 통과시키지 못하면 베르호우나 라다를 해산할 수 있고, 의원들은 면책 특권을 잃으며, 의석은 450석에서 300석으로 줄고, 지역을 대표하는 상원이 신설됩니다. 결과는 구속력이 있지만 그것만으로는 쓸모가 없습니다. 이를 헌법에 명문화할 수 있는 것은 의원들뿐이기 때문입니다. 그 의원들은 방금 국민 5분의 4에게서, 그들의 의석과 면책 특권을 우리가 거두어 갈 수 있다는 통보를 받았습니다."
 ukraine_rada.8.name: "정당이 된 우크라이나 노동당"
 ukraine_rada.8.desc: "세르히 티히프코와 이호르 샤로프를 중심으로 한 의원 그룹이 정당으로 등록했습니다. 오늘 아침까지 우크라이나 노동당은 의원 그룹 등록부의 한 줄이자 드니프로페트로우스크 지역 공장장들의 전화번호부일 뿐이었습니다. 오늘부터는 당헌과 당대회, 지역 지부를 갖추었고, 이 셋을 모두 활용할 생각입니다. 지금껏 의원 개개인의 선거운동에 하나씩 들어가던 자금이 이제 하나의 조직으로 흘러 들어가며, 그 비용을 당원으로 치르는 쪽은 국민민주당입니다."
 ukraine_rada.9.name: "원내 교섭단체를 얻은 사과당"
 ukraine_rada.9.desc: "미하일로 브로드스키가 마침내 필요한 서명을 모았고, 사과당은 베르호우나 라다에 자기 교섭단체를 갖게 되었습니다. 이 당의 의원들은 올해 대부분 다수파의 밖에서 다수파와 함께 표결해 왔으나, 이제는 안에서, 위원회를 나누는 자리에 앉아 그렇게 하게 됩니다. 소상공인으로 이뤄진 작은 교섭단체이며, 이들이 요구하는 대가는 자리가 아니라 규제 완화입니다."
 ukraine_rada.10.name: "지역당"
 ukraine_rada.10.desc: "우크라이나 지역 부흥당이 더 작은 정당 네 곳과 통합 당대회를 열고 '지역당'이라는 새 이름으로 거듭났습니다. 세무 당국 수장 미콜라 아자로프가 당수를 맡고, 볼로디미르 리박은 지도부에 남으며, 도네츠크 공장장들은 자금을 계속 쥡니다. 강령은 하나도 바뀌지 않았습니다. 중앙에 맞선 지역, 키이우의 은행에 맞선 산업이라는 기조 그대로입니다. 다만 이름이 이제 투표용지에 찍을 만큼 짧아졌고, 이름을 바꾼 이유도 바로 그것입니다."
 ukraine_rada.13.name: "산업가들의 정부"
 ukraine_rada.13.desc: "아나톨리 키나흐가 총리로 인준되었습니다. 그는 10년 동안 우크라이나 산업가·기업인 연합을 이끌어 왔으며 공장장들이 밀어 올린 후보입니다. 개혁 프로그램도 없고, 에너지 중개업자들과 다툴 일도 없으며, 누군가를 감사하다가 낭패를 본 전임자의 전철을 밟을 생각도 없습니다. 유셴코 문제로 와해되었던 다수파는 아무도 두려워하지 않는 인물을 중심으로 다시 모였고, 대통령은 자신의 정부를 되찾았습니다."
 ukraine_rada.14.name: "티모셴코 블록"
 ukraine_rada.14.desc: "2월 야권의 절반이 모여 대통령의 사퇴를 요구하던 구국 포럼으로 시작한 모임이 선거 블록으로 탈바꿈했습니다. 핵심은 '조국당'이며, 3월에 감옥에서 나온 마흔 살의 여성이 그 이름이자 얼굴입니다. 이 블록에는 정부가 압류하려 들지 않은 자금이 없고, 이들을 방송해 줄 텔레비전도 없습니다. 그러나 시위가 아니라 선거운동을 위해 조직된 야권의 유일한 세력입니다."
 ukraine_gongadze.1.name: "우크라인스카 프라우다의 탐사 보도"
 ukraine_gongadze.1.desc: "인쇄기도 허가도 없이 직원 여섯 명이 꾸리는 인터넷 신문이, 다른 매체들이 싣지 않는 것을 보도하는 나라 유일의 간행물이 되었습니다. 게오르히 곤가제와 우크라인스카 프라우다는 에너지 부문 민영화와 지역 방송국의 소유주, 그리고 그 둘 모두에 서명하는 사람들에 관한 연재를 내고 있습니다. 이 건물 안에서 새로울 것이 있는 내용은 하나도 없습니다. 새로운 것은 그것이 기록되고, 날짜가 붙고, 모뎀만 있으면 누구나 볼 수 있다는 점입니다. 세무 당국 수장은 편집실이 방문을 각오해야 하느냐고, 묻는 듯 아닌 듯 물어 왔습니다."
 ukraine_gongadze.2.name: "압박의 여파"
 ukraine_gongadze.2.desc: "조사관들이 다녀갔고, 서버는 한 번 압수되었다가 반환되었으며, 신문은 여전히 발행되고 있습니다. 곤가제는 미행당하고 있으니 그 사실을 기록에 남겨 달라는 공개서한을 검찰총장에게 보냈고, 키이우 주재 모든 대사관에도 사본을 보냈습니다. 그를 조용하게 만들라는 지시를 받은 자들은 이제 어디까지 해도 되는지 알고 싶어 하며, 그 답을 문서로는 한 줄도 남지 않는 방식으로 듣기를 원합니다."
 ukraine_gongadze.3.name: "새로운 폭로의 물결"
 ukraine_gongadze.3.desc: "무시하는 것으로는 통하지 않았습니다. 다음 연재는 이미 예고되었습니다. 지난 대선 캠페인의 자금 조달 내역으로, 계좌와 중개인의 이름까지 거론됩니다. 내무부의 평가는 구두로만 전달되었을 뿐 어디에도 기록되지 않았는데, 그 기자가 더 이상 성가신 존재가 아니라 체제에 대한 위협이 되었다는 것입니다. 여기에 답하는 방법은 두 가지가 있고, 둘 다 이 자리에 있는 모든 사람이 가장 먼저 떠올리는 그것은 아닙니다."
 ukraine_gongadze.4.name: "침묵한 기자"
 ukraine_gongadze.4.desc: "연재는 나오지 않았습니다. 곤가제는 기사를 멈추고 전화를 끊은 채 키이우를 떠났습니다. 동료들은 프라하라고 하고, 어머니는 모른다고 합니다. 신문은 다른 사람들이 다른 주제를 쓰며 계속 발행되고 있고, 에너지 민영화 기사는 1면에서 사라졌습니다. 시신도 없고, 녹음 테이프도 없으며, 천막이 가득 들어찬 광장도 없습니다. 그 대신 이 나라 모든 편집자들에게는, 멈추지 않는 이들이 어떻게 되는지에 대한 아주 분명한 이해가 생겼습니다."
 ukraine_gongadze.5.name: "잠적한 기자"
 ukraine_gongadze.5.desc: "그는 글쓰기를 멈췄고, 그것이 목적이었으며, 지시를 내린 자들은 모두 성공이라고 윗선에 보고했습니다. 그러나 그는 일을 멈추지 않았습니다. 6주 동안 남의 집을 전전하며 전에는 공개하지 못한 문서들을 모으고 있고, 자신이 있는 곳을 아는 동료 두 사람에게는 다음 기사가 중요한 기사가 될 것이라고 말하고 있습니다. 그를 겁주라는 지시를 받은 자들은 이제 겁주기가 통하지 않았다는 통보를 받았습니다."
 ukraine_yushchenko.1.name: "대열을 이탈한 총리"
 ukraine_yushchenko.1.desc: "광장에 천막이 여전히 서 있는 가운데 총리가 인터뷰를 했습니다. 그는 시위대를 극단주의자라고 부르지 않고, 대통령실을 변호하지도 않으며, 국가가 자국민에게 무력을 써서는 안 된다고 두 번이나 말했습니다. 그의 사무실은 이것이 정치적 발언이 아니었다고 주장하지만, 전국의 모든 신문이 정치적 발언으로 실었습니다. 라다의 다수파를 뒷받침하는 기업 집단들은 오전 내내 이 정부가 누구의 정부냐고 묻고 다녔습니다."
 ukraine_yushchenko.2.name: "세 사람의 서한"
 ukraine_yushchenko.2.desc_summoned: "그는 왔고, 들었고, 그 자리에서는 아무것도 동의하지 않았습니다. 그래서 대통령실은 공동 서한을 작성했습니다. 대통령, 라다 의장, 총리가 서명할 이 서한은 시위 운동을 우크라이나식 국가사회주의라고 부르고, 주동자들을 한 사람을 몰아내려고 나라를 불태울 자들이라고 규정합니다. 플류시는 오늘 서명합니다. 중요한 것은 세 번째 서명입니다. 누구든 그것이 있으면 놀랄 유일한 서명이기 때문입니다."
 ukraine_yushchenko.2.desc_ignored: "그에게는 아무 말도 전달되지 않았고, 그 역시 더 이상 아무 말도 하지 않았습니다. 대통령실은 이를 동의로 간주하기로 했습니다. 대통령과 라다 의장, 총리의 공동 서한이 작성되었는데, 시위 운동을 우크라이나식 국가사회주의라고 부르는 내용입니다. 플류시는 오늘 서명합니다. 유셴코에게 서명할 의향이 있는지는 아직 아무도 묻지 않았으며, 초안은 답이 뻔하다는 듯 그의 비서실로 넘어갔습니다."
 ukraine_yushchenko.3.name: "닫힌 문 뒤에서"
 ukraine_yushchenko.3.desc: "총리 문제는 신문 지면에서 키이우 교외의 한 식당 방으로 옮겨 갔습니다. 그 식탁에 앉은 이들이 그를 몰아내려는 이유는 시위 때문이 아닙니다. 그가 에너지 시장의 물물교환 방식을 끝내고, 연금 체불액을 현금으로 지급하기 시작했으며, 어느 회사가 누구의 권한으로 어떤 세금을 면제받는지 따져 묻기 시작했기 때문입니다. 이들은 마음만 먹으면 언제든 라다에서 그럴 표를 갖고 있습니다. 오늘 밤 논의하는 것은 그 대가가 얼마이며 누가 치르느냐입니다."
 ukraine_yushchenko.4.name: "대통령실의 결단"
 ukraine_yushchenko.4.desc: "이번 주 안에 답해야 합니다. 그를 유임시키면 지시를 따르지 않는 정부와, 자기 내각조차 다잡지 못하는 대통령실, 그리고 앙심으로 제멋대로 표결하기 시작할 라다 다수파를 떠안게 됩니다. 그를 내보내면 야권에 나라에서 가장 인기 있는 인물을, 그것도 실직 상태로 잃을 것 없이, 누구도 빼앗을 수 없는 명성과 함께 안겨 주게 됩니다. 제3의 답은 없으며, 그를 내보내고 싶어 하는 이들도 있다는 척하기를 이미 그만두었습니다."
 ukraine_gongadze.6.name: "타라샤 숲의 시신"
 ukraine_gongadze.6.desc: "마을 주민들이 타라샤 인근 숲의 얕은 무덤에서 머리 없는 시신을 발견했고, 현지 검시관은 키이우에 알리기 전까지 6주 동안 이를 보관했습니다. 장신구는 그의 것이고, 한 손의 부상은 그가 예전에 골절당한 자리와 일치하며, 동료들이 남은 유해를 확인했습니다. 검찰총장은 유해가 신원 불명 남성의 것이며 감식이 계속되고 있다고 발표했습니다. 아무도 그를 믿지 않으며, 본인도 누군가 믿어 주기를 기대하는 것 같지는 않습니다."
 ukraine_sc.1.name: "대법원과 분쟁 선거구"
 ukraine_sc.1.desc: "소선거구에 관한 이의 제기 300건 이상이 대법원에 접수되었습니다. 판사들은 스스로 선거 결과를 무효화할 수 없으며 그것은 중앙선거관리위원회만 할 수 있다고 두 차례 밝혔고, 위원회는 이미 몇몇 선거구의 투표를 취소해 7월에 재투표가 치러집니다. 참관인들은 법원에 어느 정도 독립성이 있다고 평가하지만, 의혹 속에 집계된 투표는 집계된 채로 남습니다."
 ukraine_sc.1.a: "위원회가 결정할 일이다."
 ukraine_sc.1.b: "이의 제기를 충분히 심리하게 하라."
 ukraine_stay.0.name: "총리 블록"
 ukraine_stay.0.desc: "총리는 내년 총선에 선거 블록을 이끌고 나서겠다고 선언했으며, 그러면서도 내각은 그대로 유지할 생각이라고 밝혔습니다. 민족민주 성향과 자유주의 성향의 정당 열 곳이 이미 후보 명부를 놓고 협상하고 있습니다. 자신을 임명한 대통령실에 맞서 선거운동을 벌이는 정부 수반은 기억에 없으며, 대통령실은 이를 성가신 일로 볼지 선전포고로 볼지 아직 정하지 못했습니다."
 ukraine_stay.0.a: "블록을 묵인한다."
 ukraine_stay.0.b: "블록과 내각 중 하나를 고르게 한다."
 ukraine_stay.1.name: "선거에서 살아남은 총리"
 ukraine_stay.1.desc: "유셴코의 블록이 정당 명부 투표에서 약 23%로 1위를 차지했고, 이를 이끈 총리는 여전히 흐루셰우스코호 거리의 집무실에 있습니다. 친대통령 그룹들은 블록보다 의사당에서 더 많은 의석을 차지하고 있고 야권의 나머지 의석은 공산당이 쥐고 있어서, 대통령실은 이것이 어떤 동거가 될지 아직 정하지 못했습니다. 대통령은 의장직과 다수파가 정리되기 전까지, 통제할 수 없는 내각과 해임할 여유가 없는 총리 사이에서 선택해야 합니다."
 ukraine_stay.1.a: "그를 유임시키되 내각은 대통령실이 계속 장악한다."
 ukraine_stay.1.b: "그를 유임시키고 그가 요구하는 대로 내각을 구성하게 한다."
 ukraine_stay.2.name: "총리에 맞선 다수파"
 ukraine_stay.2.desc: "우크라이나 노동당과 산업가당, 우크라이나 지역당, 통합 사회민주당(SDPU(o)), 유럽의 선택, 민주 주도, 국민민주당 등 교섭단체와 그룹 아홉 곳이 스스로를 의회 다수파로 선언했습니다. 총리는 여기에 속하지 않으며 아무도 그의 의견을 묻지 않았습니다. 내각을 지지하지 않는 다수파는 내각의 앞날에 대한 물음표이며, 대통령실은 이에 답을 내놓을 수도, 문제가 커지도록 둘 수도 있습니다."
 ukraine_stay.2.a: "다수파를 총리를 압박할 지렛대로 쓴다."
 ukraine_stay.2.b: "다수파를 내각에서 떼어 놓는다."
 ukraine_stay.3.name: "불신임안"
 ukraine_stay.3.desc: "다수파가 유셴코 내각에 대한 불신임안을 발의했습니다. 통과에는 226표가 필요하며, 다수파 교섭단체들이 대부분을 채울 수 있고, 그가 끝낸 물물교환 방식을 잊지 않은 공산당이 나머지를 채울 수 있습니다. 대통령은 표결을 요구하지도, 금지하지도 않았습니다."
 ukraine_stay.3.a: "다수파를 동원해 그를 해임한다."
 ukraine_stay.3.b: "불신임안이 부결되게 둔다."
 ukraine_rada.15.name: "도네츠크 주지사, 총리가 되다"
 ukraine_rada.15.desc: "쿠치마 대통령이 아나톨리 키나흐를 해임하고 도네츠크주 주지사 빅토르 야누코비치를 지명했습니다. 라다는 필요한 226표보다 겨우 8표 많은 234표로 그를 인준했습니다. 도네츠크 세력이 내각에 대거 진입하며, 미콜라 아자로프는 며칠 안에 제1부총리 자리에 앉게 됩니다."
 ukraine_rada.15.desc_removed: "빅토르 유셴코가 물러난 뒤 대통령은 도네츠크주 주지사 빅토르 야누코비치를 지명했습니다. 라다는 필요한 226표보다 겨우 8표 많은 234표로 그를 인준했습니다. 도네츠크 세력이 내각에 대거 진입하며, 미콜라 아자로프는 며칠 안에 제1부총리 자리에 앉게 됩니다."
 ukraine_rada.15.a: "라다가 야누코비치를 인준한다."
 ukraine_rada.15.b: "첫 표결이 부결되어 절충안이 될 인물이 필요하다."
 ukraine_reform03.1.name: "대통령의 개혁안"
 ukraine_reform03.1.desc: "대통령이 자신의 정치 개혁안을 법안 3207호로 라다에 보냈습니다. 의회 권한을 강화하고 언젠가는 다수파가 내각을 구성하게 한다고 약속하지만, 누구의 임기도 줄이지 않습니다. 공산당 대표는 '우리 우크라이나'조차 마음에 드는 구석을 찾을지 모른다고 이미 말했는데, 이는 대통령실이 누군가 해 주기를 바란 바로 그 발언입니다."
 ukraine_reform03.1.desc_stay: "대통령이 자신의 정치 개혁안을 법안 3207호로 라다에 보냈습니다. 의회 권한을 강화하고 언젠가는 다수파가 내각을 구성하게 한다고 약속하지만, 누구의 임기도 줄이지 않습니다. 유셴코가 여전히 총리인 상황에서 '우리 우크라이나'는 협상 테이블의 양쪽에 모두 앉아 있습니다. 소속 장관들은 이 초안을 옹호해야 하고, 교섭단체는 반대표를 던져야 하는 처지입니다."
 ukraine_reform03.1.a: "대통령 법안을 라다로 보낸다."
 ukraine_reform03.1.b: "먼저 모로즈, 시모넨코와 협상한다."
 ukraine_reform03.2.name: "메드베드추크-시모넨코 법안"
 ukraine_reform03.2.desc: "빅토르 메드베드추크와 페트로 시모넨코가 법안 4105호를 등록했습니다. 대통령은 2004년에는 짧은 임기로 직선제를 통해 선출하고, 2006년부터는 의회가 선출한다는 내용입니다. 보름 뒤에는 같은 결과로 가는 두 번째 경로로서 거의 똑같은 쌍둥이 법안인 4180호가 등록되었습니다. 우리 우크라이나, 사회당, 티모셴코 블록은 이를 대통령실과 공산당 지도부 사이의 거래로 보고 있으며, 공산당은 대통령직의 위상을 깎아내릴 기회로 보고 있습니다."
 ukraine_reform03.2.a: "4105호 법안을 지지한다."
 ukraine_reform03.2.b: "대통령의 3207호 법안만을 유일한 수단으로 유지한다."
 ukraine_reform03.3.name: "헌법재판소, 4105호 법안에 통과 판정"
 ukraine_reform03.3.desc: "헌법재판소는 4105호 법안이 인권을 제한하거나, 독립을 위협하거나, 1년 안에 부결된 개정안을 다시 추진하는 개정을 금지한 조항에 저촉되는지 검토했고, 이를 막을 만한 사유를 찾지 못했습니다. 한 달 뒤에는 쌍둥이 법안인 4180호에 대해서도 같은 의견을 내놓을 예정입니다. 야권은 재판관들에게 가능한 한 가장 좁은 질문이 주어졌고, 재판관들이 가장 좁은 답을 내놓았을 뿐이라고 말합니다."
 ukraine_reform03.3.a: "이 의견서를 라다로 가져간다."
 ukraine_reform03.3.b: "쌍둥이 법안 4180호도 재판소로 보낸다."
 ukraine_reform03.4.name: "의장실의 공산당원"
 ukraine_reform03.4.desc: "공산당 원내 교섭단체의 아담 마르티뉴크가 헨나디 바실리예우의 후임으로 제1부의장에 선출되었습니다. 비판하는 쪽은 이 자리가 정치개혁에 대한 공산당 표의 대가라고 말하고, 공산당은 그 정도 규모의 교섭단체가 마땅히 받아야 할 자리일 뿐이라고 말합니다. 어느 쪽이든 4년 동안 대통령에게 반대표를 던져 온 정당이 이제 대통령의 복도에 사무실을 갖게 되었습니다."
 ukraine_reform03.4.a: "공산당에 의장 자리를 내준다."
 ukraine_reform03.4.b: "거래를 거부한다."
 ukraine_reform03.5.name: "거수로 한 표결"
 ukraine_reform03.5.desc: "혼란스러운 회기 끝에 다수파는 의장석에서 거수로 센 276표로 4105호 법안이 예비 승인되었다고 선언합니다. 공산당이 다수파와 함께 찬성표를 던져 야권의 공동 입장이 깨졌고, 우리 우크라이나, 사회당, 티모셴코 블록은 시모넨코가 올리가르흐와 손을 잡았다고 비난합니다. 최종 표결에는 300표가 필요합니다."
 ukraine_reform03.5.a: "법안이 승인되었다고 선언한다."
 ukraine_reform03.5.b: "기록 표결을 요구한다."
 ukraine_ccourt.1.name: "두 건의 청원"
 ukraine_ccourt.1.desc: "의원 53명과 47명이 각각 낸 두 건의 청원을 통해, 한 사람이 대통령직을 연이어 두 번 넘게 맡지 못하도록 한 조항을 해석해 달라고 헌법재판소에 요청했습니다. 질문은 신중하게 다듬어졌고 수혜자도 분명합니다. 대통령의 첫 임기는 옛 헌법 아래에서 치러졌고, 1996년 헌법 조문은 이를 어떻게 셀지 밝히지 않았기 때문입니다. 재판소는 이번 달에는 아무것도 결정하지 않겠지만, 청원서를 쓴 사람들은 재판소가 무엇이라고 답해야 하는지 정확히 알고 있습니다."
 ukraine_ccourt.1.a: "의원들이 청원을 이어가게 둔다."
 ukraine_ccourt.1.b: "대통령실이 재판관들에게 사전 작업을 하도록 한다."
 ukraine_ccourt.1.c: "의원들에게 청원을 철회하라고 지시한다."
 ukraine_ccourt.2.name: "재판관들의 심의"
 ukraine_ccourt.2.desc: "헌법재판소는 두 번째 개혁 법안을 통과시킨 바로 그날 대통령 임기 사건을 다룹니다. 주심은 바실 님첸코 재판관입니다. 키이우에서는 재판관들에게 전화가 가고 있고, 만찬이 마련되고 있으며, 몇몇은 다른 곳에 급한 볼일이 생겼다는 말이 돌고 있습니다. 재판소 대변인들은 아무 말도 하지 않습니다."
 ukraine_ccourt.2.a: "재판소를 가만히 둔다."
 ukraine_ccourt.2.b: "재판관들을 압박한다."
 ukraine_ccourt.4.name: "재판소, 문을 닫다"
 ukraine_ccourt.4.desc: "헌법재판소는 대통령의 첫 임기가 산입된다고 판결했습니다. 헌법은 누구든 연이어 두 번까지만 허용하며, 재판관들은 1999년부터 세야 할 이유가 없다고 보았습니다. 대통령은 내년 선거에 출마할 수 없습니다. 대통령실에는 이길 수 있고 믿을 만한 후계자를 찾을 시간이 약 10개월밖에 없으며, 보험으로 마련했던 정치개혁이 이제 계획의 전부가 되었습니다."
 ukraine_ccourt.4.a: "판결을 받아들이고 후계자를 찾는다."
 ukraine_ccourt.4.b: "선거 전에 정치개혁을 밀어붙인다."
 ukraine_ccourt.5.name: "재판소, 판단을 피하다"
 ukraine_ccourt.5.desc: "헌법재판소는 의원들이 요청한 해석을 내놓기를 거부하고 절차상의 이유로 청원서를 돌려보냈습니다. 문제는 해결되지 않았습니다. 대통령이 출마할 수 있는지 없는지 정해지지 않았고, 키이우의 모든 정치인이 저마다 어느 쪽인지에 대한 가설을 갖고 있습니다. 이 불확실성은 야권이 이를 따져 묻기 시작하기 전까지만 대통령실에 유리합니다."
 ukraine_ccourt.5.a: "불확실성이 우리에게 유리하게 작용하게 둔다."
 ukraine_ccourt.5.b: "라다에 해결을 요청한다."
 ukraine_ccourt.6.name: "대통령의 대답"
 ukraine_ccourt.6.desc: "재판소가 문을 열었고, 모두가 조용히 묻던 질문이 이제 공공연하게 제기됩니다. 그는 출마할 것인가? 대통령은 1년 내내 방문객들에게 그 문으로 걸어 들어가지 않겠다고 말해 왔고, 1년 내내 사람들은 걸어 들어갈 작정인 사람이라면 바로 그렇게 말할 것이라고 수군거렸습니다. 키이우의 모든 진영이 후보를 정하기 전에 그의 대답을 기다리고 있습니다."
 ukraine_ccourt.6.a: "나는 출마하지 않겠습니다."
 ukraine_ccourt.6.b: "계속 추측하게 내버려 둔다."
 ukraine_ccourt.6.c: "후보로 등록한다."
 ukraine_rada.16.name: "9개 교섭단체 다수파"
 ukraine_rada.16.desc: "산업가들과 함께하는 노동 우크라이나, 우크라이나 지역당, SDPU(o), 유럽의 선택, 민주 이니셔티브, 인민민주당 등 9개 교섭단체와 의원 그룹이 선언문에 서명하고 스스로를 의회 다수파라고 부르고 있습니다. 230여 명의 서명은 예산을 통과시키기에는 충분하지만 무엇이든 개정하기에는 턱없이 부족합니다. 내각은 과도 내각이며, 선언문에 서명한 이들은 다음 내각을 누가 이끌어야 하는지 자신들에게 물어올 것으로 기대합니다."
 ukraine_rada.16.a: "다수파가 정부를 지명하게 한다."
 ukraine_rada.16.b: "내각은 대통령이 임명할 몫이다."
 ukr_history.11.desc_premier: "곤가제 실종 2주기를 맞아 야권이 지지자들을 다시 거리로 불러냈습니다. 티모셴코, 모로즈, 시모넨코가 같은 연단에 섰고, 네 번째 인물이 섰을 빈자리가 남아 있습니다. 유셴코는 여전히 총리이며 그의 블록은 광장에 나오지 않았습니다. 주최 측은 그가 자리를 택했다고 말하고, 그의 측근들은 광장이야말로 정부 수반이 설 수 없는 유일한 곳이라고 말합니다. 흐레샤티크 거리에는 다시 천막이 세워지고 있습니다."
 ukr_history.5.desc_late: "내각이 무너졌습니다. 계산은 다수파가 꾸려진 이후 늘 그래 왔듯 똑같았습니다. 공산당은 시장 개혁에 반대표를 던졌고, 기업 집단들은 에너지 부문의 물물교환 방식을 끝낸 인물에게 반대표를 던졌으며, 둘을 합치면 필요한 226표를 넘었습니다. 나라 역사상 가장 인기 있던 총리는 명성을 고스란히 지킨 채 물러납니다. 그 명성을 잃을 자리조차 남지 않은 채로 말입니다."
 ukraine_ccourt.7.name: "두 명의 권력 후보"
 ukraine_ccourt.7.desc: "대통령이 등록했고, 두 해 동안 후계자로 키워 온 총리도 등록했습니다. 행정 자원은 두 사람을 동시에 뒷받침할 수 없습니다. 주지사는 한 후보에게는 자기 주를 몰아줄 수 있어도 두 후보에게는 그럴 수 없으며, 전국의 모든 주지사가 지금 어느 쪽인지 통보받기를 기다리고 있습니다. 총리의 선거운동 자금을 댄 도네츠크 사람들은 아직까지는 정중하게, 자신들이 도대체 무엇에 돈을 댄 것인지 묻고 있습니다."
 ukraine_ccourt.7.a: "총리가 사퇴한다. 권력 후보는 한 명이다."
 ukraine_ccourt.7.b: "사퇴하고, 우리가 키운 사람이 출마하게 한다."
 ukraine_ccourt.8.name: "침묵의 해가 끝나다"
 ukraine_ccourt.8.desc: "대통령은 1년 동안 세 번째 임기에 대한 질문에 어깨만 으쓱해 왔고, 그 어깨짓 때문에 친대통령 진영의 다른 모든 후보가 1년 동안 제자리에 얼어붙어 있었습니다. 곧 등록이 마감됩니다. 마감 후에는 대답이 해석이 아닌 기록의 문제가 되며, 누구의 선거운동에 자금을 대고 있는지 알고 싶어 기다려 온 사람들도 다른 모두와 같은 방식으로 알게 될 것입니다."
 ukraine_ccourt.8.a: "분명하게 말한다. 그는 후보가 아니다."
 ukraine_ccourt.8.b: "등록한다. 넉 달이면 충분하다."
 ukraine_ccourt.9.name: "후계자 없는 승계"
 ukraine_ccourt.9.desc: "대통령은 투표용지에 오르지 않습니다. 독립 이후 처음으로 이 기구가 다른 사람을 업고 가야 한다는 뜻입니다. 총리에게는 주지사들과 세무 당국, 국영 방송이 있지만, 위임할 수 없는 그 무엇은 전혀 없습니다. 기구가 자기 자신을 위해 일할 때만큼 후계자를 위해서도 열심히 움직일지는 곧 공개적으로 시험대에 오릅니다."
 ukraine_ccourt.9.a: "모든 것을 총리 뒤로 모은다."
 ukraine_ccourt.9.b: "유력 가문들이 직접 그를 밀어 올리게 한다."
 ukraine_operatives.1.name: "새 내부보안 책임자"
 ukraine_operatives.1.desc: "안드리 나우모프가 감시자를 감시하는 부서인 보안국(SBU) 내부보안국장에 임명되었습니다. 그는 젊고 인맥이 넓으며 대통령 측근들의 신임을 받고 있습니다. 내부보안 부서는 정보국이 운영하는 모든 담당관과 정보원, 작전을 알고 있습니다. 이 부서를 이끄는 사람은 SBU의 정보 활동도 이끌 수 있습니다."
 ukraine_operatives.1.a: "그에게는 대통령의 신임이 있다."
 ukraine_operatives.2.name: "내부보안 책임자의 도주"
 ukraine_operatives.2.desc: "안드리 나우모프가 예고 없이 나라를 떠났습니다. SBU 내부의 배신자를 잡는 임무를 맡은 사람이 출근 몇 시간 전에 국경을 넘었고, 그가 무엇을 가지고 나갔는지는 아무도 알지 못합니다. 그가 알고 있던 모든 정보원, 그가 심사한 모든 요원, 그가 승인한 모든 작전은 이제 노출된 것으로 간주해야 합니다. 정보기관은 앞으로 1년 동안 한 사람이 얼마나 큰 피해를 입힐 수 있었는지 파악하게 될 것입니다."
 ukraine_operatives.2.a: "그가 손댄 것은 모두 노출된 것으로 간주한다."
 ukraine_operatives.3.name: "국방정보총국(HUR)의 새 수장"
 ukraine_operatives.3.desc: "키릴로 부다노우는 경력 내내 국방정보총국의 특수목적부대에서 복무했고, 상당 기간을 적진 후방 작전에 보냈습니다. 이제 30대의 나이로, 우크라이나 군사정보기관의 지휘를 제안받은 역대 최연소 장교가 되었습니다. 그는 보고만 하는 총국이 아니라 행동하는 총국을 원합니다."
 ukraine_operatives.3.a: "그에게 총국을 맡긴다."
 ukraine_operatives.4.name: "부다노우, 반코바 거리로 옮기다"
 ukraine_operatives.4.desc: "대통령이 키릴로 부다노우에게 국방정보총국을 떠나 대통령실을 맡아 달라고 요청했습니다. 이제 전쟁은 반코바 거리에서 지휘되며, 적의 계획을 누구보다 잘 아는 사람이 대응을 결정하는 사람 곁에 앉게 됩니다. 정보는 이전 어느 때보다 빠르게 대통령에게 닿을 것이며, 정보기관들은 더 높은 대가를 치르고 더 많은 정보를 내놓아야 할 것입니다."
 ukraine_operatives.4.a: "그를 반코바로 데려온다."
 UKR_naumov_defection: "내부보안 인사의 망명"
 UKR_naumov_defection_desc: "전 SBU 내부보안국장이 해외로 도주했습니다. 그가 알던 모든 정보원과 작전을 확인하기 전까지는 정보기관이 자체 조직망을 믿을 수 없습니다."
 UKR_budanov_presidential_office: "대통령실의 부다노우"
 UKR_budanov_presidential_office_desc: "전 군사정보 수장이 대통령실을 이끌고 있습니다. 정보기관들은 대통령에게 직접 접근할 수 있으며, 예산도 그에 걸맞게 지원받습니다."
 UKR_reactivate_sov_category: "보관 중인 소련제 장비"
 UKR_reactivate_sov_category_desc: "\n\n\n\n\n\n£UKR_desctext_reactivate_sov_main\n\n\n\n\n\n\n\n\n§W지금 우리 보관 기지에는 §R소련§!제 전차, 장갑차량, 정찰차량 등 수백 대의 장비가 §R녹슨 채§! 대기하고 있습니다.\n우리의 현지 §Y설계국§!, §Y군산복합기구(MIO)§!, §Y수리 공장§!은 충분히 쓸 만한 현대화 계획을 개발해 이 장비들을 우리 군용이나 수출용으로 재생산할 수 있습니다.\n지금은 매력적으로 보이지 않더라도, 시간과 자금과 노력을 들이면 이를 다시 §G쓸 만한 군사 자산§!으로 되살릴 수 있습니다.\n\n아래 목록은 현재 보관 중인 장비를 보여 줍니다.\n§!"
