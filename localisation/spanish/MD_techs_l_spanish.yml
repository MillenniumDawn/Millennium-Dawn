 module_naval_anti_ship_drone_torpedoes_1: "Torpedo en red I"
 module_naval_anti_ship_drone_torpedoes_1_desc: "Los torpedos dron en red permiten realizar ataques a distancia segura (standoff) con una asignación mínima de personal, lo que permite a las flotas proyectar su letalidad sin exponer a las tripulaciones. Su espoleta inteligente y la selección del punto de mira maximizan las probabilidades de causar daños catastróficos al contacto, haciendo que los impactos críticos sean mucho más probables. Los materiales avanzados, la electrónica y los sistemas de propulsión necesarios elevan los costes generales de recursos.\n\n§GConsejo de diseño: Los torpedos dron proporcionan ataque de torpedos y guerra antisubmarina al tiempo que mejoran la probabilidad de impacto de los torpedos y reducen drásticamente las necesidades de mano de obra. Son ideales para diseños de ataque precisos y con tripulación reducida, pero requieren cantidades crecientes de microchips.§!"
