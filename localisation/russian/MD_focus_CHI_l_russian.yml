 CHI_bri_africa_engagement_desc: "Накопленный балл участия в инициативе «Один пояс и один путь» для Африки; необходим наряду с выполнением заданий в рамках ФОКАК для разблокирования итогового фокуса «Китайско-африканский век»."
 CHI_bri_centralasia_engagement_desc: "Накопленный показатель вовлечённости в инициативу «Один пояс и один путь» для Центральной Азии; учитывается при начислении бонусов за участие в коридоре «Экономического пояса Шёлкового пути»."
 CHI_bri_defaulted_projects_desc: "Количество проектов, в которых получатель не выполнил условия кредита; это обусловливает выбор между реструктуризацией задолженности и изъятием активов."
 CHI_bri_europe_engagement_desc: "Накопленный показатель участия в инициативе «Один пояс и один путь» для Европы; необходим для поддержания механизма «17+1» и получения бонусов за развитие транспортной инфраструктуры в Европе на поздних этапах игры."
 CHI_bri_latam_engagement_desc: "Накопленный показатель участия в инициативе «Один пояс и один путь» для Латинской Америки; доступ к нему открывается после завершения инфраструктурных проектов в Венесуэле, Эквадоре, Бразилии, Аргентине и Боливии."
 CHI_bri_meast_engagement_desc: "Накопленный показатель вовлечённости в инициативу «Один пояс и один путь» для Ближнего Востока; влияет на темпы внедрения расчётов в «нефтяных юанях»."
 CHI_bri_monthly_income_desc: "Ежемесячный доход в юанях, получаемый от действующих проектов в рамках инициативы «Один пояс и один путь», до применения мультипликатора доходности."
 CHI_bri_pacific_engagement_desc: "Взаимодействие Китая с островными государствами Тихого океана: дипломатическое признание, концессии в сфере рыболовства и эксплуатации морского дна, а также договоренности в области безопасности."
 CHI_bri_predatory_score_desc: "Показывает, насколько активно мы применяли тактику использования долгового рычага и конфискации активов; высокие показатели открывают путь к реализации «доктрины Хамбантоты» и увеличивают возможности перехода от дефолта к конфискации."
 CHI_bri_project_slots_desc: "Максимальное количество проектов в рамках инициативы «Один пояс и один путь», которыми Китай может управлять одновременно"
 CHI_bri_returns_multiplier_desc: "Коэффициент, применяемый к обратным потокам проекта; увеличен за счёт активной деятельности секретарей IC и завершения ряда фокусов."
 CHI_bri_seasia_engagement_desc: "Накопленный показатель вовлечённости в инициативу «Один пояс и один путь» для Юго-Восточной Азии; влияет на возможность принятия решений в рамках сотрудничества «Ланьцан — Меконг»."
 CHI_bri_southasia_engagement_desc: "Накопленный показатель вовлечённости в инициативу «Один пояс и один путь» для Южной Азии; влияет на скорость повышения уровня и размер бонусов для партнёров из Южной Азии."
 CHI_bri_winwin_score_desc: "Позволяет отслеживать, насколько последовательно мы применяем льготные и реформированные условия кредитования; высокие показатели открывают возможности для дипломатии в сфере реструктуризации долга и укрепляют доверие со стороны получателей помощи."
 CHI_Buffer_State_Doctrine: "Доктрина буферного государства"
 CHI_Buffer_State_Doctrine_desc: "Северная Корея выступает в качестве стратегического буфера между нами и союзными США силами в Южной Корее. Укрепляя эту роль, мы гарантируем, что Пхеньян останется прочно в нашей сфере влияния и что ни одна враждебная держава не сможет закрепиться на нашей границе."
 CHI_chinese_aggression_display: "$CHI_chinese_aggression$: [?CHI_chinese_aggression]"
 CHI_collective_leadership_active_desc: "Семь мужчин за одним столом. Общая линия — это то, что эти семь мужчин согласятся назвать общей линией."
 CHI_Dandong_Lifeline: "Дандунская линия жизни"
 CHI_Dandong_Lifeline_desc: "На долю Дандуна приходится подавляющая часть внешней торговли Северной Кореи, и торговые потоки проходят на наших условиях. Восстановление и расширение этого канала снабжения обеспечивает Пхеньяну экономический «кислород», одновременно укрепляя наше влияние на режим."
 CHI_Enforce_Sanctions_Compliance: "Обеспечить соблюдение санкций"
 CHI_Enforce_Sanctions_Compliance_desc: "По-настоящему обеспечивая соблюдение международных санкций в отношении Северной Кореи, мы демонстрируем нашу приверженность делу нераспространения и завоевываем доверие со стороны США и Японии. Пхеньян будет недоволен, но наш авторитет в международном сообществе укрепится."
 CHI_focus_tree: "Дерево фокусов Китая"
 CHI_Fortress_of_the_East: "Крепость Востока"
 CHI_Fortress_of_the_East_desc: "Превращение Северной Кореи в неприступное буферное государство способствует укреплению нашей стратегической глубины. Мы поддерживаем доктрину полной военной готовности, которая делает любое наступление на Пхеньян непомерно затратным для тех, кто мог бы попытаться его осуществить."
