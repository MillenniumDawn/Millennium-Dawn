 MD_antarctica_news.1.t: "[FROM.GetName] Solicita Adesão ao Tratado da Antártica"
 MD_antarctica_news.1.d: "[FROM.GetName] solicitou a adesão ao Tratado da Antártica, sinalizando uma potencial mudança em sua política externa e em seu compromisso com a conservação ambiental. O Tratado da Antártica é um acordo internacional que regulamenta o uso da Antártica para fins pacíficos e pesquisas científicas, ao mesmo tempo em que protege o ecossistema único do continente. O pedido de adesão de [FROM.GetName] foi recebido com reações calorosas pela comunidade internacional: alguns elogiam a medida como um passo positivo em direção à cooperação global, enquanto outros expressam ceticismo sobre as intenções de [FROM.GetName] e seu compromisso com os princípios do tratado. O processo de candidatura levará um mês para ser concluído."
 MD_antarctica_news.1.a: "O Tempo dirá"
 MD_antarctica_news.1.b: "Já estava na hora"
 MD_antarctica_news.2.t: "[FROM.GetName] Adere ao Tratado da Antártica"
 MD_antarctica_news.2.d: "Hoje, em [GetDateText], [FROM.GetName] aderiu oficialmente ao Tratado da Antártica, tornando-se membro do acordo internacional que regulamenta o uso da Antártica para fins pacíficos e pesquisas científicas. Ao ingressar no tratado, [FROM.GetName] comprometeu-se a defender os princípios de conservação ambiental e cooperação internacional na Antártica. Essa medida foi recebida com reações positivas pela comunidade global, com muitos elogiando [FROM.GetName] por seu compromisso em proteger o ecossistema único da Antártica e promover a colaboração pacífica entre as nações."
 MD_antarctica_news.2.a: "Outro Membro"
 MD_antarctica_news.2.b: "Vamos ao trabalho!"
 MD_antarctica_news.3.t: "[FROM.GetName] Esforça-se para Sair do Tratado da Antártica"
 MD_antarctica_news.3.d: "[FROM.GetName] decidiu hoje deixar o Tratado da Antártica. A Comissão para a Conservação dos Recursos Vivos Marinhos Antárticos (CCAMLR) está dando a eles 2 anos para desmantelar quaisquer estações de pesquisa que possuam na Antártica e evitar quaisquer atividades proibidas, como exploração de recursos ou presença militar. A decisão de deixar o tratado foi recebida com reações mistas por parte da comunidade internacional: alguns expressam desapontamento e preocupação com as potenciais consequências para o meio ambiente e a cooperação global, enquanto outros apoiam o direito de [FROM.GetName] de tomar suas próprias decisões em relação ao seu envolvimento em acordos internacionais. O processo de saída do tratado levará 2 anos para ser concluído."
 MD_antarctica_news.3.a: "Que pena!"
 MD_antarctica_news.3.b: "Nós temos melhores coisas para fazer"
 MD_antarctica_news.4.t: "[FROM.GetName] Deixa o Tratado da Antártica"
 MD_antarctica_news.4.d: "[MD_antarctica_news_4_desc]"
 MD_antarctica_news.4.a: "O Tratado Está Enfraquecido"
 MD_antarctica_news.4.b: "Tanto faz"
 MD_antarctica_news_4_desc_1: "Após 2 anos de saída do Tratado da Antártica, [FROM.GetName] deixou oficialmente o acordo internacional que regulamenta o uso da Antártica para fins pacíficos e pesquisas científicas. Apesar dos avisos, [FROM.GetName] deixou o tratado mantendo uma Estação de Pesquisa na Antártica, o que provocou uma resposta global dos membros do tratado, incluindo potenciais sanções e reações diplomáticas negativas."
 MD_antarctica_news_4_desc_2: "Após 2 anos de saída do Tratado da Antártica, [FROM.GetName] deixou oficialmente o acordo internacional que regulamenta o uso da Antártica para fins pacíficos e pesquisas científicas. [FROM.GetName] desmantelou com sucesso todas as estações de pesquisa na Antártica e evitou quaisquer atividades proibidas, como a exploração de recursos ou presença militar, o que ajudou a mitigar potenciais consequências para o meio ambiente e a cooperação global."
 MD_antarctica_news.5.t: "Utilidades de Circuito Aberto Detectadas na Estação Antártica [FROM.GetAdjective]"
 MD_antarctica_news.5.d: "Durante a missão de observação recente, observadores do Tratado detectaram o uso de utilidades de circuito aberto em uma das estações de pesquisa antárticas [FROM.GetAdjective]. Isso é uma violação do Tratado da Antártica, que proíbe qualquer atividade que possa causar danos ambientais ou perturbar o ecossistema da Antártica. A detecção de utilidades de circuito aberto levantou preocupações entre os membros do Tratado e pode levar a consequências diplomáticas."
 MD_antarctica_news.5.a: "Algumas pessoas precisam economizar"
 MD_antarctica_news.5.b: "Bem"
 MD_antarctica_news.6.t: "Atividades de Laboratório Ilegais Detectadas na Estação Antártica [FROM.GetAdjective]"
 MD_antarctica_news.6.d: "Durante a missão de observação recente, observadores do Tratado detectaram atividades laboratoriais ilegais em uma das estações de pesquisa antárticas [FROM.GetAdjective]. Esse comportamento é inaceitável e uma clara violação do Tratado da Antártica. As Partes Consultivas do Tratado abordarão esta questão e tomarão as medidas apropriadas para garantir a proteção do ecossistema único da Antártica e a integridade do tratado."
 MD_antarctica_news.6.a: "Isso é inaceitável"
 MD_antarctica_news.6.b: "Nós temos que fazer alguma coisa sobre isso"
 MD_antarctica_news.7.t: "Pesquisa de Armas Nucleares Detectada na Estação Antártica [FROM.GetAdjective]"
 MD_antarctica_news.7.d: "Durante a missão de observação recente, observadores do Tratado detectaram pesquisas de armas nucleares em uma das estações de pesquisa antárticas [FROM.GetAdjective]. Esta é uma violação grave do Tratado da Antártica, que proíbe qualquer atividade militar ou qualquer atividade que possa causar danos ambientais ou perturbar o ecossistema da Antártica. Usar uma estação de pesquisa pacífica para a construção e testes de armas nucleares é um ato ultrajante que ameaça a segurança de todo o mundo. As Partes Consultivas do Tratado tomarão medidas imediatas e decisivas para abordar esta questão e responsabilizar os culpados por suas ações. A comunidade internacional deve se unir para condenar esse comportamento e garantir que a Antártica continue sendo um ambiente pacífico e protegido para a pesquisa científica e a cooperação."
 MD_antarctica_news.7.a: "Isso é um absurdo!"
 MD_antarctica_news.7.b: "Era mais importante"
 MD_antarctica_news.8.t: "[FROM.GetName] Has Breached Antarctic Treaty Too Many Times"
 MD_antarctica_news.8.d: "After multiple breaches of the Antarctic Treaty, [FROM.GetName] has reached a critical point where the Consultative Parties of the Treaty has decided to remove them from the treaty and impose severe diplomatic consequences. The repeated violations of the treaty's principles and regulations have undermined the integrity of the agreement and threatened the protection of Antarctica's unique ecosystem. The Consultative Parties of the Treaty will take decisive action to ensure that [FROM.GetName] is held accountable for their actions and that the Antarctic Treaty remains a strong and effective framework for international cooperation and environmental conservation."
 MD_antarctica_news.8.a: "They bring it on themselves"
 MD_antarctica_news.8.b: "This is too much"
 MD_antarctica_news.9.t: "Heavy Winds Across Antarctica"
 MD_antarctica_news.9.d: "Heavy winds have been reported across Antarctica, affecting research stations. The Consultative Parties of the Treaty are monitoring the situation and providing support to ensure the safety of personnel and the integrity of ongoing research. The observer missions are temporarily suspended until the weather conditions improve."
 MD_antarctica_news.9.a: "Not good"
 MD_antarctica_news.10.t: "[FROM.GetName] Begins Construction of Antarctic Research Station"
 MD_antarctica_news.10.d: "[FROM.GetName] has begun construction of a new Antarctic research station, signaling their commitment to scientific research and environmental conservation in the region. The construction of the station is expected to take several months, and the Consultative Parties of the Treaty will closely monitor the progress to ensure that it complies with the principles and regulations of the Antarctic Treaty."
 MD_antarctica_news.10.a: "Splendid!"
 MD_antarctica.1.t: "Observer Mission Incoming"
 MD_antarctica.1.d: "[FROM.GetName] has dispatched Treaty observers to inspect one of our Antarctic research stations. The mission is expected to arrive in §Y7 days§!."
 MD_antarctica.1.a: "We will await their arrival"
 MD_antarctica.3.t: "Observer Mission Report: Open-Loop Utilities Detected"
 MD_antarctica.3.d: "The Treaty observers have completed their inspection of our Antarctic research station and have reported the detection of Open-Loop Utilities usage. This is a violation of the Antarctic Treaty and may lead to diplomatic consequences. The Consultative Parties of the Treaty requested action to replace the utilities with more environmentally friendly options."
 MD_antarctica.3.a: "We have to get rid of that"
 MD_antarctica.4.t: "Observer Mission Report: Illegal Laboratory Activities Detected"
 MD_antarctica.4.d: "The Treaty observers have completed their inspection of our Antarctic research station and have reported the detection of illegal laboratory activities. The Consultative Parties will not bring further consequences, if we cease all illegal activities in our station."
 MD_antarctica.4.a: "We have to do something about it"
 MD_antarctica.5.t: "Observer Mission Report: Nuclear Weapon Research Detected"
 MD_antarctica.5.d: "The Treaty observers have completed their inspection of our Antarctic research station and have reported the detection of nuclear weapon research. This is a severe violation of the Antarctic Treaty and will result in immediate diplomatic consequences. The Consultative Parties of the Treaty will take decisive action to address this issue and hold those responsible accountable for their actions, demanding immediate cessation of all nuclear research activities in our station."
 MD_antarctica.5.a: "We have to get rid of that immediately!"
 MD_antarctica.6.t: "Antarctic Treaty Breach: Too Many Violations"
 MD_antarctica.6.d: "Dear [ROOT.GetLeader],\n\nWe regret to inform you that your nation, [ROOT.GetName], has breached the Antarctic Treaty too many times, with a total of [?antarctica_station_reports] violations. As a result, the Consultative Parties of the Treaty have decided to remove [ROOT.GetName] from the treaty withing 2 years and impose severe diplomatic consequences. The repeated violations of the treaty's principles and regulations have undermined the integrity of the agreement and threatened the protection of Antarctica's unique ecosystem. We urge you to take this matter seriously and remove the research station, before the membership is revoked.\n\nSincerely,\nThe Consultative Parties of the Antarctic Treaty"
 MD_antarctica.6.a: "We have brought this on ourselves"
 MD_antarctica.7.t: "Impose Embargo on [FROM.GetName]?"
 MD_antarctica.7.d: "Due to the recent detection of nuclear weapon research in one of [FROM.GetAdjective] Antarctic research stations, the Consultative Parties of the Antarctic Treaty are considering imposing an embargo on [FROM.GetName]. This would involve restricting trade and diplomatic relations with [FROM.GetName] in response to their violation of the treaty's principles and regulations."
 MD_antarctica.7.a: "They have to pay for their actions"
 MD_antarctica.7.b: "It's not worth it"
 MD_antarctica.9.t: "Antarctic Station Module Damaged"
 MD_antarctica.9.d: "A module at one of our Antarctic research stations has been damaged by a blizzard. Engineers are preparing repairs and will start as soon as weather conditions improve.\n\nRepairs begin when the blizzard ends (§Y[?global.antarctica_blizzard_days_remaining|0]§! days of blizzard remaining) and take §Y14§! days to complete. You can see the remaining time on the station view and in the damaged module tooltip."
 MD_antarctica.9.a: "Damn weather!"
 MD_antarctica.10.t: "Dismantle of the annexed country Antarctic Research Station"
 MD_antarctica.10.d: "Due to annexation of the country with a Research Station, the station has been dismantled."
 MD_antarctica.10.a: "Okay"
 ANT_nukes_research_discovered_idea: "Antarctic Station Nuclear Weapon Research Discovered"
 ANT_nukes_research_discovered_idea_desc: "This country violated the principle of a total ban on military research in Antarctica by conducting research related to nuclear weapons."
 antarctica_small_treaty_admin_cost_1: "Antarctic Small Treaty Administration"
 antarctica_small_treaty_admin_cost_1_desc: "This country has signed one Antarctic small treaty (CCAS or CCAMLR), increasing administrative overhead for political action."
 antarctica_small_treaty_admin_cost_2: "Expanded Antarctic Treaty Administration"
 antarctica_small_treaty_admin_cost_2_desc: "This country has signed both Antarctic small treaties (CCAS and CCAMLR), requiring broader treaty administration and compliance resources."
 ANT_kicked_from_treaty_idea: "Kicked From Antarctic Treaty"
 ANT_kicked_from_treaty_idea_desc: "Due to repeated violations of the Antarctic Treaty, this country has been excluded from the agreement and cannot rejoin for the next two years."
 ANT_illegal_extraction_idea: "Antarctic Illegal Resource Extraction"
 ANT_illegal_extraction_idea_desc: "Our relations with other countries are worse because we are among the few who do not want to trade valuable resources to preserve a nice view of an icy wasteland. They care too much about that frozen block."
 ANT_military_training_idea: "Antarctic Illegal Military Training"
 ANT_military_training_idea_desc: "There is no better place to prepare our soldiers for a winter offensive than Antarctica."
