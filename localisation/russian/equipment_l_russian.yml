 MR_Fighter1: "МЦИ 3-го поколения"
 MR_Fighter1_desc: "Многоцелевые истребители — это рабочая лошадка любых военно-воздушных сил. Они могут выполнять любую задачу или миссию, но, как следствие, их конструкция является результатом ряда компромиссов, из-за которых они хуже справляются с каждой из этих задач, чем любой специализированный истребитель."
