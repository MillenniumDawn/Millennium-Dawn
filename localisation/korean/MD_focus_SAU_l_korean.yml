 SAU_events.317.b: "공군: 시계 외 교전"
 SAU_events.317.c: "공군: 방공 교리"
 SAU_events.317.desc: "사우디 전투기 조종사들에게 승리하는 법을 어떻게 가르쳐야 합니까? 각각의 길은 지속적인 맞교환이며, 한 방향에서는 우리를 강하게 하고 다른 방향에서는 약하게 합니다.\n\n§Y선택지에 마우스를 올리면 그것이 무엇을 부여하고 무엇을 요구하는지 정확히 볼 수 있습니다.§!"
 SAU_events.317.t: "레드 플래그 공중전 훈련"
 SAU_events.318.a: "AWACS: 공중전 통제"
 SAU_events.318.b: "AWACS: 합동 지상 연결"
 SAU_events.318.c: "AWACS: 조기경보망"
 SAU_events.318.desc: "E-3 함대는 전투를 어떻게 형성해야 합니까? 각각의 길은 지속적인 맞교환이며, 한 방향에서는 우리를 강하게 하고 다른 방향에서는 약하게 합니다.\n\n§Y선택지에 마우스를 올리면 그것이 무엇을 부여하고 무엇을 요구하는지 정확히 볼 수 있습니다.§!"
 SAU_events.318.t: "AWACS 전투 관리 훈련"
 SAU_events.319.a: "정밀 유도 무기: 정밀 타격"
 SAU_events.319.b: "정밀 유도 무기: 방공망 제압"
 SAU_events.319.c: "정밀 유도 무기: 전장 차단"
 SAU_events.319.desc: "왕국은 스마트 무기를 어떻게 운용할 것입니까? 각각의 길은 지속적인 맞교환이며, 한 방향에서는 우리를 강하게 하고 다른 방향에서는 약하게 합니다.\n\n§Y선택지에 마우스를 올리면 그것이 무엇을 부여하고 무엇을 요구하는지 정확히 볼 수 있습니다.§!"
 SAU_events.319.t: "정밀 타격 교리 과정"
 SAU_events.32.a: "그들의 돈을 받는다."
 SAU_events.32.b: "절대 안 된다. 호르무즈에서 숨이 막히게 두라."
 SAU_events.32.d: "리야드의 오랜 라이벌이 자국 석유를 우리 영토를 거쳐 바다로 보내려 합니다. 그들은 통과 수수료를 후하게 지불할 것입니다. 자존심은 자존심이지만, 국고는 비어 있습니다."
 SAU_events.32.t: "사우디의 제안"
 SAU_events.320.a: "개혁: 급진 계획"
 SAU_events.320.b: "개혁: 체계적 증강"
 SAU_events.320.c: "개혁: 외국 계약업체"
 SAU_events.320.desc: "개혁이 시작됩니다. 얼마나 강하게 밀어붙일 것입니까? 각각의 길은 지속적인 맞교환이며, 한 방향에서는 우리를 강하게 하고 다른 방향에서는 약하게 합니다.\n\n§Y선택지에 마우스를 올리면 그것이 무엇을 부여하고 무엇을 요구하는지 정확히 볼 수 있습니다.§!"
 SAU_events.320.t: "1단계: 개혁 계획 개시"
 SAU_events.321.a: "병과: 기갑 주먹"
 SAU_events.321.b: "병과: 화력"
 SAU_events.321.c: "병과: 전문 보병"
 SAU_events.321.desc: "현대적 군대를 이끌 병과는 무엇입니까? 각각의 길은 지속적인 맞교환이며, 한 방향에서는 우리를 강하게 하고 다른 방향에서는 약하게 합니다.\n\n§Y선택지에 마우스를 올리면 그것이 무엇을 부여하고 무엇을 요구하는지 정확히 볼 수 있습니다.§!"
 SAU_events.321.t: "2단계: 병과 현대화"
 SAU_events.322.a: "태세: 전력 투사"
 SAU_events.322.b: "태세: 전략적 억제"
 SAU_events.322.c: "태세: 본토 방어"
 SAU_events.322.desc: "현대화가 완료되었습니다. 왕국은 어떤 태세를 취할 것입니까? 각각의 길은 지속적인 맞교환이며, 한 방향에서는 우리를 강하게 하고 다른 방향에서는 약하게 합니다.\n\n§Y선택지에 마우스를 올리면 그것이 무엇을 부여하고 무엇을 요구하는지 정확히 볼 수 있습니다.§!"
 SAU_events.322.t: "3단계: 완전한 현대식 군대 달성"
 SAU_events.33.a: "유럽으로 가는 다리가 된다."
 SAU_events.33.b: "러시아를 자극하지 않겠다."
 SAU_events.33.d: "사우디아라비아가 자국 송유관을 유럽까지 이어 달라고 요청했습니다. 우리는 걸프 석유가 서방으로 가는 관문지기가 되어 모든 배럴마다 통행료를 거둘 수 있지만, 모스크바는 이에 고마워하지 않을 것입니다."
 SAU_events.33.t: "유럽으로 가는 길"
 SAU_events.330.a: "미국산을 구매한다: M1A2 에이브럼스"
 SAU_events.330.b: "무기 공급처를 다변화한다"
 SAU_events.330.c: "국내 무기 산업을 구축한다"
 SAU_events.330.d: "국가근위대를 확장한다"
 SAU_events.330.desc: "걸프전은 우리 군대가 왕국을 홀로 방어하기에 얼마나 준비되어 있지 않은지를 낱낱이 드러냈습니다. 사우디 왕립 육군은 재건되어야 하지만, 누구의 무기로, 어떤 방향으로 재건할 것입니까?"
 SAU_events.330.t: "육군 재건"
 SAU_events.331.a: "프랑스 호위함: 사와리 계획"
 SAU_events.331.b: "미국 함정과 훈련"
 SAU_events.331.c: "연안 방어 및 초계정"
 SAU_events.331.d: "외양 해군을 지향한다"
 SAU_events.331.desc: "아라비아만에서 홍해에 이르기까지 왕국은 두 개의 긴 해안선과 세계의 석유 생명선을 지켜야 합니다. 어떤 함대를 건설할 것입니까?"
 SAU_events.331.t: "두 바다를 위한 해군"
 SAU_events.332.a: "미국의 이글: 피스 선 계획"
 SAU_events.332.b: "영국 제트기: 알 야마마 거래"
 SAU_events.332.c: "러시아의 힘: MIG-31"
 SAU_events.332.desc: "공군은 왕국의 첫 번째 방패이자 가장 예리한 검입니다. 사우디 왕립 공군은 어떤 길을 따라야 합니까?"
 SAU_events.332.t: "제공권 장악"
 SAU_events.333.a: "미국: M1A2 에이브럼스"
 SAU_events.333.b: "러시아: T-90"
 SAU_events.333.c: "프랑스: 르클레르"
 SAU_events.333.d: "독일: 레오파르트 2"
 SAU_events.333.desc: "군대에는 현대식 주력 전차가 필요합니다. 어느 강대국에서 구매할 것입니까? 아니면 국내에서 생산할 것입니까? 이 선택이 왕국이 누구에게 의존하게 될지를 결정합니다."
 SAU_events.333.t: "주력 전차 선정"
 SAU_events.334.a: "미사일을 테헤란에 겨눈다"
 SAU_events.334.b: "침묵의 억제력으로 보유한다"
 SAU_events.334.c: "미사일 무기고를 확장한다"
 SAU_events.334.desc: "전략 미사일군은 왕국에 최후의 수단이 되는 무기를 제공합니다. 어떤 태세를 취해야 합니까?"
 SAU_events.334.t: "전략적 억제력"
 SAU_events.335.a: "국내 테러 대응"
 SAU_events.335.b: "해외 전력 투사"
 SAU_events.335.c: "서방 특수 부대와 함께 훈련한다"
 SAU_events.335.desc: "우리 특수 부대는 준비되어 있습니다. 그 칼날을 어디로 향하게 하시겠습니까?"
 SAU_events.335.t: "특수 부대 교리"
 SAU_events.336.a: "미국 호위함(MMSC)"
 SAU_events.336.b: "러시아 호위함(고르시코프)"
 SAU_events.336.c: "프랑스 호위함(사와리)"
 SAU_events.336.d: "독일 호위함(MEKO)"
 SAU_events.336.desc: "해군은 두 바다를 지킬 현대식 호위함이 필요합니다. 누구의 조선소에서 건조할 것입니까? 아니면 직접 건조할 것입니까?"
 SAU_events.336.t: "호위함 공급처 선정"
 SAU_events.337.a: "상륙 강습 부대"
 SAU_events.337.b: "연안 및 도서 방어"
 SAU_events.337.c: "GCC 신속 대응 임무"
 SAU_events.337.desc: "새로운 해병대에는 임무가 필요합니다. 어떤 임무를 맡겨야 합니까?"
 SAU_events.337.t: "해병대"
 SAU_events.338.a: "F-15를 최대한 많이 구매한다"
 SAU_events.338.b: "균형 잡힌 공군을 유지한다"
 SAU_events.338.c: "조종사 훈련에 투자한다"
 SAU_events.338.desc: "피스 선 계획으로 F-15 이글이 왕국에 도입되었습니다. 어디까지 확대해야 합니까?"
 SAU_events.338.t: "피스 선"
 SAU_events.34.a: "값비싼 타격이다."
 SAU_events.34.d: "파괴 공작원들이 서쪽 지중해로 향하는 송유관을 공격했습니다. 석유 흐름이 멈췄고, 재건될 때까지 이 경로는 상실되었습니다."
 SAU_events.34.t: "레반트 송유관 절단"
 SAU_events.340.a: "공세적 공군 교리"
 SAU_events.340.b: "방어적 공중 방패"
 SAU_events.340.c: "통합 GCC 공군 사령부"
 SAU_events.340.desc: "항공 작전 사령부가 공군을 통합합니다. 어떤 교리가 이를 이끌어야 합니까?"
 SAU_events.340.t: "제공권 장악"
 SAU_events.341.a: "서방의 도움을 받아 공격적으로 현대화한다"
 SAU_events.341.b: "균형 잡히고 절제된 증강"
 SAU_events.341.c: "국내 치안과 충성을 우선시한다"
 SAU_events.341.desc: "군대가 재창설되었으므로 왕국은 전체적인 방향을 정해야 합니다. 군대를 어떤 모습으로 만들 것입니까?"
 SAU_events.341.t: "군대의 태세"
 SAU_events.342.a: "미국: M109 팔라딘"
 SAU_events.342.b: "러시아: 2S19 므스타-S"
 SAU_events.342.c: "프랑스: CAESAR"
 SAU_events.342.d: "독일: PzH 2000"
 SAU_events.342.desc: "야포는 기갑 전력과 보조를 맞추어야 합니다. 누구의 자주포를 배치할 것입니까? 아니면 직접 생산할 것입니까?"
 SAU_events.342.t: "자주포 선정"
 SAU_events.343.a: "미국: M270 MLRS"
 SAU_events.343.b: "러시아: BM-30 스메르치"
 SAU_events.343.desc: "집중된 로켓 사격은 적의 진격을 분쇄할 수 있습니다. 누구의 발사기를 도입할 것입니까? 아니면 직접 생산할 것입니까?"
 SAU_events.343.t: "로켓포 선정"
 SAU_events.344.a: "판매를 승인한다."
 SAU_events.344.b: "요청을 거절한다."
 SAU_events.344.desc: "사우디아라비아가 미국산 전투기 구매를 요청했습니다. 판매를 승인하면 리야드의 우리 방위 산업에 대한 의존이 깊어질 것입니다."
 SAU_events.344.t: "사우디의 미국산 전투기 요청"
 SAU_events.345.a: "판매를 승인한다."
 SAU_events.345.b: "요청을 거절한다."
 SAU_events.345.desc: "사우디아라비아가 영국산 전투기 구매를 요청했습니다. 판매를 승인하면 수익성 높은 방위 협력 관계가 강화될 것입니다."
 SAU_events.345.t: "사우디의 영국산 전투기 요청"
 SAU_events.346.a: "판매를 승인한다."
 SAU_events.346.b: "요청을 거절한다."
 SAU_events.346.desc: "사우디아라비아가 러시아산 전투기 구매를 요청했습니다. 판매를 승인하면 걸프에서 중요한 신규 시장이 열릴 것입니다."
 SAU_events.346.t: "사우디의 러시아산 전투기 요청"
 SAU_events.347.a: "판매를 승인한다."
 SAU_events.347.b: "요청을 거절한다."
 SAU_events.347.desc: "사우디아라비아가 M1A2 에이브럼스 전차의 대량 구매를 요청했습니다. 이 판매는 왕국을 미국의 병참 및 훈련에 더욱 밀접하게 묶어 둘 것입니다."
 SAU_events.347.t: "사우디의 미국산 전차 요청"
 SAU_events.348.a: "판매를 승인한다."
 SAU_events.348.b: "요청을 거절한다."
 SAU_events.348.desc: "사우디아라비아가 T-90 전차의 대량 구매를 요청했습니다. 이 거래는 러시아 산업이 전통적으로 서방 시장이던 곳에 발판을 마련하게 해 줄 것입니다."
 SAU_events.348.t: "사우디의 러시아산 전차 요청"
 SAU_events.349.a: "판매를 승인한다."
 SAU_events.349.b: "요청을 거절한다."
 SAU_events.349.desc: "사우디아라비아가 르클레르 전차 구매를 요청했습니다. 판매를 승인하면 프랑스와 왕국의 방위 관계가 깊어질 것입니다."
 SAU_events.349.t: "사우디의 프랑스산 전차 요청"
 SAU_events.35.a: "할 수 있는 것은 재건한다."
 SAU_events.35.d: "유럽으로 가는 우리 송유관이 끊겼습니다. 파괴 공작원들이 핵심 구간을 폭파했고, 석유는 더 이상 서방에 닿지 않습니다. 오늘 밤 모스크바는 한숨을 돌립니다."
 SAU_events.35.t: "유럽 송유관 절단"
 SAU_events.350.a: "판매를 승인한다."
 SAU_events.350.b: "요청을 거절한다."
 SAU_events.350.desc: "사우디아라비아가 레오파르트 2 전차 구매를 요청했습니다. 판매를 승인하면 독일의 방위 수출이 걸프로 확대될 것입니다."
 SAU_events.350.t: "사우디의 독일산 전차 요청"
 SAU_events.351.a: "판매를 승인한다."
 SAU_events.351.b: "요청을 거절한다."
 SAU_events.351.desc: "사우디아라비아가 미국 조선소에 사우디 왕립 해군을 위한 현대식 호위함 건조를 요청했습니다. 이 계약은 리야드와의 해군 협력을 심화시킬 것입니다."
 SAU_events.351.t: "사우디의 미국산 호위함 요청"
 SAU_events.352.a: "판매를 승인한다."
 SAU_events.352.b: "요청을 거절한다."
 SAU_events.352.desc: "사우디아라비아가 러시아 조선소에 사우디 왕립 해군을 위한 현대식 호위함 건조를 요청했습니다. 이 계약은 러시아 군함을 위한 새로운 걸프 시장을 열어 줄 것입니다."
 SAU_events.352.t: "사우디의 러시아산 호위함 요청"
 SAU_events.353.a: "판매를 승인한다."
 SAU_events.353.b: "요청을 거절한다."
 SAU_events.353.desc: "사우디아라비아가 프랑스 조선소에 사우디 왕립 해군을 위한 현대식 호위함 건조를 요청했습니다. 이 계약은 리야드와의 오랜 방위 관계를 이어 줄 것입니다."
 SAU_events.353.t: "사우디의 프랑스산 호위함 요청"
 SAU_events.354.a: "판매를 승인한다."
 SAU_events.354.b: "요청을 거절한다."
 SAU_events.354.desc: "사우디아라비아가 독일 조선소에 사우디 왕립 해군을 위한 현대식 군함 건조를 요청했습니다. 이 계약은 걸프에서의 독일 방위 관계를 강화할 것입니다."
 SAU_events.354.t: "사우디의 독일산 군함 요청"
 SAU_events.360.a: "§H국부 펀드를 설립한다.§! 횡재를 저축하여 미래를 위해 투자한다."
 SAU_events.360.b: "§H대형 초대형 사업에 자금을 댄다.§! 현금을 국내의 공장과 도시에 쏟아붓는다."
 SAU_events.360.c: "§H국민에게 분배한다.§! 보조금과 보너스로 충성과 평온을 산다."
 SAU_events.360.d: "원유 가격이 배럴당 $ 25에서 §G$ 140§!를 넘어섰습니다. 오일 달러가 왕국이 셀 수 있는 속도보다 빠르게 국고로 쏟아져 들어옵니다. §Y2003~2008년의 횡재§!는 한 세대에 한 번 있는 기회이며, 이를 어떻게 쓰느냐가 수십 년간 왕국을 규정할 것입니다. 평의회는 §L저축할 것인가, 그것으로 건설할 것인가, 나눌 것인가§!를 논의합니다."
 SAU_events.360.t: "§H석유 호황§!"
 SAU_events.361.a: "§R터무니없는 타격이다!§!"
 SAU_events.361.b: "새로운 공급처를 찾아 견뎌 낸다."
 SAU_events.361.d: "리야드가 우리에 대한 아랍 석유 금수 조치에 동참했습니다. 유조선은 걸프에서 놀고 있고, 정유소는 바닥을 드러내고 있으며, 주유소 가격은 통제 불능으로 치솟고 있습니다. 공장은 멈췄고 운전자들은 몇 시간씩 줄을 서고 있습니다.\n\n사우디는 우리의 지역 정책이 바뀔 때까지 밸브가 닫혀 있을 것이라고 말합니다. 금수 조치가 유지되는 한 우리 경제는 압박을 느낄 것입니다."
 SAU_events.361.t: "§R사우디아라비아의 우리 석유 차단§!"
 SAU_events.362.a: "§G석유는 우리의 검이다.§!"
 SAU_events.362.b: "§R우리는 이 폭풍을 견뎌 낼 것이다.§!"
 SAU_events.362.c: "위험한 확전이다."
 SAU_events.362.d: "§H1973년§!의 재현처럼, 사우디아라비아 왕국이 서방과 이스라엘의 친구들에 대한 석유 선적 금수를 선포했습니다. §L미국, 영국, 프랑스, 독일, 네덜란드§!는 이제 연료 부족, 배급제, 폭등하는 가격에 직면해 있습니다.\n\n아랍과 이슬람 세계 전역에서 군중이 리야드의 도전을 환영합니다. 서방 수도에서는 정부들이 대체 공급처를 찾아 분주히 움직이며 경기 침체를 경고합니다. 한때 단순한 상품이었던 석유는 국정 운영의 무기가 되었습니다."
 SAU_events.362.t: "§H사우디아라비아의 석유 무기 사용§!"
 SAU_events.363.a: "§Y배럴은 언제나 부른다.§! (§R석유 의존도 +2§!)"
 SAU_events.363.d: "왕국이 다각화를 추진하는 동안에도 원유의 중력은 놓아주지 않습니다. 모든 부처, 모든 예산 항목, 모든 손쉬운 오일 달러가 경제를 다시 배럴 쪽으로 끌어당깁니다. 기득권, 값싼 에너지, 그리고 가장 저항이 적은 길이 모두 한 방향으로 작용합니다.\n\n끊임없는 노력 없이는 왕국은 다시 석유 의존으로 미끄러져 갑니다."
 SAU_events.363.t: "§R석유의 인력§!"
 SAU_events.370.a: "§G시장 개혁을 수용한다.§! 민간 부문이 주도하게 한다."
 SAU_events.370.b: "§R기존 질서를 보호한다.§! 변화는 기다릴 수 있다."
 SAU_events.370.d: "경제부의 기술 관료들은 §L규제 완화, 민영화, 시장 개방§!을 촉구합니다. 보수 원로들은 너무 빨리 움직이면 왕국이 기반으로 삼은 사회 계약이 풀어질 것이라고 경고합니다. 평의회는 방향을 보여야 합니다."
 SAU_events.370.t: "§H경제 변화§!"
 SAU_events.371.a: "§G여성의 기회를 확대한다.§! 경제는 모든 인재를 필요로 한다."
 SAU_events.371.b: "§R전통적 역할을 지킨다.§! 가족 구조를 보존한다."
 SAU_events.371.d: "교육받은 새로운 세대의 사우디 여성들이 일하기를 원하며, 경제도 이들을 필요로 합니다. 개혁가들은 개발되지 않은 인재를 보고, §L울라마§!와 보수적인 가문은 넘어서는 안 될 선을 봅니다."
 SAU_events.371.t: "§H노동 현장의 여성§!"
 SAU_events.372.a: "§G개방적 접근을 허용한다.§! 왕국은 세계로부터 숨을 수 없다."
 SAU_events.372.b: "§R걸러 내고 검열한다.§! 공중도덕을 지킨다."
 SAU_events.372.d: "위성 텔레비전과 초기 인터넷이 외국의 사상을 사우디의 거실에 쏟아붓습니다. 자유주의자들은 세계를 향한 개방을 환영하고, 전통주의자들은 국가가 신자들에게 닿는 것을 걸러 내야 한다고 요구합니다."
 SAU_events.372.t: "§H위성 안테나와 인터넷§!"
 SAU_events.373.a: "§G그들의 권한을 제한한다.§! 순찰을 억제한다."
 SAU_events.373.b: "§R그들의 임무를 재확인한다.§! 미덕은 강제되어야 한다."
 SAU_events.373.d: "§L미덕 장려 위원회§!는 거리를 순찰하며 복장, 기도, 남녀 혼합을 단속합니다. 도시 거주민과 기업은 그들의 권력에 불만을 품고, 성직자들은 그들을 국가의 영혼을 지키는 수호자로 여깁니다."
 SAU_events.373.t: "§H종교 경찰§!"
 SAU_events.380.a: "기존의 이자 부과 계좌를 허용한다."
 SAU_events.380.b: "엄격한 리바 금지 - 샤리아가 최우선이다."
 SAU_events.380.c: "공적으로는 수쿠크, 사적으로는 실용적 이자."
 SAU_events.380.d: "왕국은 이자 금지인 §L리바§!에 대한 입장을 정해야 합니다. §L세속 개혁가§!들은 기존의 이자 부과 계좌가 외국 자본을 유치하고 은행업을 현대화한다고 주장합니다. §L원로 학자 평의회§!는 샤리아에 부합하는 엄격한 금지를 요구합니다. §H혼합§! 방식은 대중에게는 수쿠크를 허용하고, 문을 닫은 뒤에는 비공식적 이자를 허용합니다."
 SAU_events.380.t: "§H표준화 이자법§!"
 SAU_events.381.a: "현대식 부분 지급준비 - 안정을 희생한 성장."
 SAU_events.381.b: "자산 담보만 허용 - 안정적이지만 더 느리다."
 SAU_events.381.c: "중간 수준의 지급준비 요건."
 SAU_events.381.d: "은행은 예금 1리얄당 얼마만큼의 신용을 창출할 수 있습니까? §L서방 모델§!은 §H부분 지급준비 은행업§!을 사용하며, 10:1의 레버리지로 더 많은 신용, 더 많은 성장, 더 큰 위험을 낳습니다. §L이슬람식 대안§!은 §H완전한 자산 담보§!를 요구하며, 모든 대출이 실물 자산에 연결되므로 더 느리지만 안정적입니다. §H혼합§! 방식은 중간 수준의 지급준비 요건을 정합니다."
 SAU_events.381.t: "§H부분 지급준비 의무§!"
 SAU_events.382.a: "가벼운 규제 - 파생상품과 선물을 허용한다."
 SAU_events.382.b: "엄격한 금지 - 가라르도 도박도 없다."
 SAU_events.382.c: "규제된 파생상품만 - 균형 잡힌 접근."
 SAU_events.382.d: "왕국은 §L투기, 파생상품, 선물§!을 얼마나 엄격하게 규제해야 합니까? §L서방의 시각§!은 이를 필수적인 위험 관리 수단으로 봅니다. §L이슬람의 시각§!은 이를 §L가라르§!(과도한 불확실성)로 규탄하며 도박과 다를 바 없다고 봅니다. §H혼합§! 방식은 규제된 파생상품만 허용합니다."
 SAU_events.382.t: "§H반투기 지침§!"
 SAU_events.383.a: "기존 이자 기반의 은행 간 시장."
 SAU_events.383.b: "무라바하 기반의 이슬람식 은행 간 시장."
 SAU_events.383.c: "혼합 - 둘 다 운용하되 분리한다."
 SAU_events.383.d: "은행이 서로 대출할 때 어떤 조건으로 합니까? §L서방 모델§!은 §H기존 금리 회랑§!(LIBOR 방식)을 사용합니다. §L이슬람식 대안§!은 은행 간 자금 흐름을 자산 담보 원가 가산 금융인 §H무라바하§!를 통해 처리합니다. §H혼합§! 방식은 부문별로 둘 다 허용합니다."
 SAU_events.383.t: "§H은행 간 대출 규약§!"
 SAU_events.384.a: "SAMA - 독립적인 세속 규제 기관."
 SAU_events.384.b: "SAMA + 구속력 있는 거부권을 가진 샤리아 평의회."
 SAU_events.384.c: "혼합 - 두 개의 병렬 구조."
 SAU_events.384.d: "누가 왕국의 은행을 감독합니까? §L서방 모델§!은 §LSAMA§!(사우디아라비아 통화청)를 §H독립적인 기술 관료 규제 기관§!으로 만듭니다. §L이슬람식 대안§!은 SAMA에 §H샤리아 감독 평의회§!를 결합시키며, 이 평의회는 구속력 있는 거부권을 가진 성직자들입니다. §H혼합§! 방식은 두 개의 병렬 구조입니다."
 SAU_events.384.t: "§H은행 통제법§!"
 SAU_events.385.a: "엄격한 정통주의 - 타협은 없다."
 SAU_events.385.b: "실용주의 - 세계 이슬람 금융 시장을 주도한다."
 SAU_events.385.d: "왕국은 §H이슬람 금융§!에 전면적으로 헌신합니다. 그런데 얼마나 엄격하게 할 것입니까? §L엄격한 정통주의§!는 타협 없이 모든 거래가 샤리아의 축복을 받으며, §L울라마§!의 무조건적인 지지와 여러 세대에 걸친 안정을 얻습니다. §L실용적 이슬람 방식§!은 세계 이슬람 금융 허브로서 §L말레이시아§!, §L인도네시아§!, §L이란§!, §L걸프§!의 이슬람 자본을 끌어들이며, 영향력을 위해 순수성을 어느 정도 희생합니다."
 SAU_events.385.t: "§H이슬람 금융의 보루§!"
 SAU_events.386.a: "완전한 앵글로색슨식 - 모든 금융 상품 허용."
 SAU_events.386.b: "점진적 - 샤리아의 외피를 두른 서방식 관행."
 SAU_events.386.d: "왕국은 전통과 결별하고 금융 부문을 §H세속화§!합니다. §L완전한 앵글로색슨식§! 길은 §H파생상품§!, §H채권§!, §H신용 거래§! 등 모든 서방의 금융 상품을 도입하여 외국 자본을 최대한 끌어들이지만 §L울라마§!를 격분시킵니다. §L점진적§! 길은 서방의 관행 위에 샤리아의 외피를 유지하며, 수익은 줄어드는 대신 반발도 줄어듭니다."
 SAU_events.386.t: "§G금융의 세속화§!"
 SAU_events.39.a: "폭풍이 터졌다."
 SAU_events.39.d: "사우디와 연합군 전투기들이 대규모 항공 작전으로 후티가 장악한 예멘 전역의 목표물을 타격했습니다. 리야드는 인정받는 정부를 복원하고 이란의 지원을 받는 운동을 격퇴하겠다는 의사를 선언했습니다. 중동이 숨을 죽이고 있습니다."
 SAU_events.39.t: "결정적 폭풍 작전 개시"
 SAU_events.390.a: "리야드에 대한 판매를 승인한다"
 SAU_events.390.b: "요청을 거절한다"
 SAU_events.390.d: "사우디아라비아 왕국이 우리의 가장 뛰어난 수출용 전투기인 F-15 스트라이크 이글의 구매를 공식 요청했습니다. 리야드는 핵심 걸프 동맹이자 주요 무기 고객입니다. 판매를 승인하시겠습니까?"
 SAU_events.390.t: "사우디의 요청: F-15 스트라이크 이글"
 SAU_events.391.a: "반가운 소식이다."
 SAU_events.391.d: "미국이 F-15 스트라이크 이글을 왕국에 판매하는 데 동의했습니다. 거래는 성사되었으며, 사우디 왕립 공군은 곧 최고의 미국제 전투기를 운용하게 됩니다."
 SAU_events.391.t: "워싱턴의 F-15 거래 승인"
 SAU_events.392.a: "차질이다."
 SAU_events.392.d: "미국이 현 시점에서 F-15 판매를 거절했습니다. 얼마 뒤에 요청을 다시 제기할 수 있습니다."
 SAU_events.392.t: "워싱턴의 거절"
 SAU_events.393.a: "수출을 승인한다"
 SAU_events.393.b: "요청을 거절한다"
 SAU_events.393.d: "사우디아라비아가 알 살람 계획에 따라 유로파이터 타이푼을 요청했습니다. 컨소시엄의 파트너로서 독일은 리야드에 대한 수출을 승인하시겠습니까?"
 SAU_events.393.t: "사우디의 요청: 유로파이터 타이푼"
 SAU_events.394.a: "반가운 소식이다."
 SAU_events.394.d: "컨소시엄이 유로파이터 타이푼을 왕국에 수출하는 데 동의했습니다. 알 살람 계획이 이제 진행될 수 있습니다."
 SAU_events.394.t: "타이푼 거래 승인"
 SAU_events.395.a: "차질이다."
 SAU_events.395.d: "유럽 측이 당분간 타이푼 수출을 거절했습니다. 나중에 다시 시도할 수 있습니다."
 SAU_events.395.t: "타이푼 거래 거절"
 SAU_events.396.a: "리야드에 대한 판매를 승인한다"
 SAU_events.396.b: "요청을 거절한다"
 SAU_events.396.d: "사우디아라비아 왕국이 알 야마마 계획을 확대하여 개량형 토네이도 GR4를 구매하기를 원합니다. 리야드는 수십 년간 영국 산업의 충실한 고객이었습니다. 판매를 승인하시겠습니까?"
 SAU_events.396.t: "사우디의 요청: 토네이도 GR4"
 SAU_events.397.a: "반가운 소식이다."
 SAU_events.397.d: "영국이 확대된 알 야마마 협정에 따라 토네이도 GR4를 왕국에 공급하는 데 동의했습니다. 우리의 타격 비행대는 걸프에서 부러움의 대상이 될 것입니다."
 SAU_events.397.t: "런던의 토네이도 거래 승인"
 SAU_events.398.a: "차질이다."
 SAU_events.398.d: "영국이 현 시점에서 토네이도 거래의 확대를 거절했습니다. 얼마 뒤에 요청을 다시 제기할 수 있습니다."
 SAU_events.398.t: "런던의 거절"
 SAU_events.399.a: "수출을 승인한다"
 SAU_events.399.b: "요청을 거절한다"
 SAU_events.399.d: "사우디아라비아가 견고한 다국적 공격기인 파나비아 토네이도 IDS를 요청했습니다. 컨소시엄의 파트너로서 이탈리아는 리야드에 대한 수출을 승인하시겠습니까?"
 SAU_events.399.t: "사우디의 요청: 파나비아 토네이도"
 SAU_events.4.a: "반가운 소식이다."
 SAU_events.4.d: "[FROM.GetNameDefCap](이)가 우리의 제안을 수락했습니다. 이제 협정을 진전시킬 수 있습니다."
 SAU_events.4.t: "제안을 수락한 [FROM.GetNameDefCap]"
 SAU_events.40.a: "봉쇄: 정권을 고립시켜 숨통을 조인다."
 SAU_events.40.b: "신중한 긴장 완화: 일단은 열기를 식힌다."
 SAU_events.40.c: "전시 태세: 그가 하기 전에 먼저 타격한다."
 SAU_events.40.d: "사담은 여전히 바그다드를 통치하고 있으며, 쿠웨이트와 카프지의 기억이 걸프 위에 드리워져 있습니다. 왕국은 그가 다시 도박을 결심하기 전에, 이 위험한 이웃을 어떻게 다룰지 정해야 합니다."
 SAU_events.40.t: "사담의 그림자"
 SAU_events.400.a: "반가운 소식이다."
 SAU_events.400.d: "이탈리아가 파나비아 토네이도 IDS를 왕국에 수출하는 데 동의했습니다. 컨소시엄은 소중한 신규 운용국을 환영합니다."
 SAU_events.400.t: "로마의 토네이도 거래 승인"
 SAU_events.401.a: "차질이다."
 SAU_events.401.d: "이탈리아가 당분간 토네이도 수출을 거절했습니다. 나중에 다시 시도할 수 있습니다."
 SAU_events.401.t: "로마의 거절"
 SAU_events.5.a: "차질이다."
 SAU_events.5.d: "[FROM.GetNameDefCap](이)가 우리의 제안을 거부했습니다. 양국 관계가 악화될 것입니다."
 SAU_events.5.t: "제안을 거부한 [FROM.GetNameDefCap]"
 SAU_events.56.a: "베이징에서 회담을 개최한다."
 SAU_events.56.b: "이것은 우리의 분쟁이 아니다."
 SAU_events.56.d: "사우디아라비아가 리야드와 테헤란 사이의 중재를 요청했습니다. 걸프 양안이 모두 우리에게 석유를 팔고 있으며, 두 나라의 분쟁은 우리가 의존하는 모든 유조선을 위협합니다. 회담을 개최하면 베이징은 이 지역에서 없어서는 안 될 강국으로 올라서게 될 것입니다."
 SAU_events.56.t: "리야드의 요청"
 SAU_events.57.a: "협정에 서명한다."
 SAU_events.57.b: "그들과는 자리를 함께하지 않겠다."
 SAU_events.57.d: "중국이 우리를 베이징으로 초청하여 사우디아라비아와 협정에 서명하자고 합니다. 관계 복원, 대사관 재개설, 대리전의 유혈 종식입니다. 사우디는 이미 동의했습니다. 펜이 우리를 기다리고 있습니다."
 SAU_events.57.t: "베이징으로의 초청"
 SAU_events.58.a: "새로운 장이 열린다."
 SAU_events.58.d: "중국의 중재 아래 왕국과 이슬람 공화국이 서명했습니다. 대사관이 다시 문을 열고, 대리 세력들은 잠잠해지며, 걸프는 숨을 돌립니다. 경쟁은 끝나지 않았지만 칼은 칼집에 꽂혔습니다."
 SAU_events.58.t: "베이징 협정"
 SAU_events.59.a: "그렇다면 어쩔 수 없다."
 SAU_events.59.d: "회담은 시작되기도 전에 무너졌습니다. 경쟁은 계속되고, 걸프는 여전히 위험한 상태로 남습니다."
 SAU_events.59.t: "중재 실패"
 SAU_events.6.a: "회랑에 참여한다."
 SAU_events.6.b: "제안을 거절한다."
 SAU_events.6.d: "사우디아라비아가 수에즈 운하를 우회하여 걸프를 거쳐 인도와 유럽을 잇는 무역로인 인도-중동-유럽 경제 회랑을 제안합니다."
 SAU_events.6.t: "[SAU.GetFlag] 인도-중동-유럽 회랑 [RAJ.GetFlag]"
 SAU_events.60.a: "군이 헤즈볼라를 향해 움직인다."
 SAU_events.60.b: "레바논은 리야드를 위해 피를 흘리지 않을 것이다."
 SAU_events.60.d: "사우디의 자금이 우리 군대를 재건했고, 사우디의 소총이 군 무기고를 채우고 있습니다. 이제 리야드가 대가를 요구합니다. 헤즈볼라에 맞서 국가 안의 국가를 무너뜨리라는 것입니다. 군은 그 어느 때보다 준비되어 있습니다. 레바논이 그 시도에서 살아남을지는 또 다른 문제입니다."
 SAU_events.60.t: "리야드의 위임"
 SAU_events.61.a: "남부에 질서가 돌아온다."
 SAU_events.61.d: "베이루트가 레바논 남부에 대한 국가 권위를 회복하려 함에 따라 레바논군 종대가 남쪽으로 진군하고 있습니다. 수십 년간 국가 안의 국가와 나란히 살아온 정부가 재건된 군대에 무력으로 헤즈볼라를 무장 해제하라고 명령했습니다. 걸프 수도들은 박수를 보내고, 테헤란은 이를 저항에 대한 반역이라 부릅니다."
 SAU_events.61.t: "헤즈볼라를 향해 움직이는 레바논군"
 SAU_events.63.a: "증거가 말해 준다."
 SAU_events.63.d: "사우디아라비아가 후티의 무기고를 이란으로 추적하는 미사일 파편, 선적 목록, 감청된 통신으로 이루어진 자료 일체를 아랍 연맹에 제출했습니다. 아랍 수도들은 이례적인 단합으로 호응하고 있으며, 테헤란의 부인은 귀 기울이는 이가 거의 없습니다."
 SAU_events.63.t: "예멘에서의 이란 개입을 폭로한 자료"
 SAU_events.64.a: "거리가 술렁인다."
 SAU_events.64.d: "테헤란에서 베이루트에 이르기까지 군중이 저항의 축 정부들에 맞서 거리로 나서고 있습니다. 시위대의 불만은 지역적인 것이지만, 관측통들은 그 자금에서 뚜렷한 걸프의 억양이 느껴진다고 지적합니다. 축은 외국의 손을 탓하고, 외국의 손은 모든 것을 부인합니다."
 SAU_events.64.t: "저항의 축을 휩쓴 시위"
 SAU_events.65.a: "움마의 주소는 하나다."
 SAU_events.65.d: "이슬람 세계가 사우디의 초청으로 가장 신성한 도시에 모였으며, 이란 대표단도 다른 이들과 함께 자리했습니다. 문 닫힌 방 안에서 무엇이 결정되든, 그 이미지는 분명합니다. 움마가 모일 때 그것은 메카에서 모이며, 리야드가 상석에 앉는다는 것입니다."
 SAU_events.65.t: "메카 정상회의"
 SAU_events.67.a: "베이징에서의 악수."
 SAU_events.67.d: "몇몇만이 가능하다고 믿었던 의식에서 사우디아라비아와 이란이 수년간의 경쟁 끝에 외교 관계를 복원하는 협정을 베이징에서 체결했습니다. 대사관이 다시 문을 열고 대리전은 잠잠해질 것입니다. 중국이 이 거래를 중재했으며, 워싱턴에 보내는 메시지는 분명합니다. 중동에 새로운 중재자가 나타났다는 것입니다."
 SAU_events.67.t: "베이징 협정"
 SAU_events.68.a: "들어 본다."
 SAU_events.68.b: "논의할 것이 없다."
 SAU_events.68.d: "제3국 수도의 중개자들을 통해 사우디아라비아가 이스라엘이 관계 정상화 회담에 응할 의사가 있는지 타진하고 있습니다. 아직 어떤 조건도 거론되지 않았습니다. 귀를 기울일 것인지가 문제입니다."
 SAU_events.68.t: "리야드의 은밀한 접근"
 SAU_events.69.a: "진전이다."
 SAU_events.69.d: "이스라엘의 답변이 예상보다 우호적으로 돌아왔습니다. 협의 경로는 유지되고, 회담은 조금씩 진전됩니다."
 SAU_events.69.t: "텔아비브의 긍정적 신호"
 SAU_events.7.a: "협력 관계를 수락한다."
 SAU_events.7.b: "제안을 거절한다."
 SAU_events.7.d: "리야드가 사우디 텔레콤 컴퍼니와 한국 인프라를 중심으로 한 전략적 투자 협력을 제안합니다. 양국은 서로의 시장에 접근할 수 있게 됩니다."
 SAU_events.7.t: "[SAU.GetFlag] 사우디-한국 협력 [KOR.GetFlag]"
 SAU_events.70.a: "실망스럽다."
 SAU_events.70.d: "이스라엘의 답변이 짧고 냉랭하게 돌아왔습니다. 협의 경로는 막혔고, 회담도 함께 희미해집니다."
 SAU_events.70.t: "차가운 답신"
 SAU_events.71.a: "1967년 경계를 받아들인다. 평화를 위한 국가."
 SAU_events.71.b: "1967년 경계는 불가능하다."
 SAU_events.71.d: "사우디아라비아가 아랍 평화 구상을 공식 제안했습니다. 1967년 경계에 따른 독립 팔레스타인 국가를 대가로 한 승인, 대사관, 무역, 그리고 아랍 세계 전체와의 평화입니다. 이는 지금까지 제시된 것 중 가장 큰 보상이지만, 이스라엘이 수십 년간 거부해 온 대가를 요구합니다."
 SAU_events.71.t: "아랍 평화 구상"
 SAU_events.72.a: "거래를 받아들인다."
 SAU_events.72.b: "돈이 문제가 아니다."
 SAU_events.72.d: "사우디 협상단이 투자 기금, 영공 개방, 기술 회랑, 그리고 걸프 최대 시장에 대한 접근권으로 협상 조건을 더 유리하게 만듭니다. 리야드와의 평화는 이전의 어떤 평화와도 다른 수익을 가져다줄 것입니다."
 SAU_events.72.t: "걸프의 부"
 SAU_events.73.a: "국가를 위한 평화. 역사적이다."
 SAU_events.73.d: "사우디아라비아와 이스라엘이 리야드 합의에 서명했습니다. 이스라엘이 사우디아라비아와 요르단이 보장하는 1967년 경계의 독립 팔레스타인 국가를 수용하는 대가로 관계를 완전히 정상화하는 내용입니다. 한 세대 동안 외면받아 온 아랍 평화 구상이 단 하루 오후 만에 중동의 지도를 다시 그렸습니다."
 SAU_events.73.t: "리야드 합의"
 SAU_events.74.a: "옛 경계가 돌아온다."
 SAU_events.74.d: "리야드와 텔아비브 사이의 회담이 합의 없이 끝났습니다. 이스라엘은 팔레스타인 국가를 받아들이려 하지 않았고, 사우디아라비아는 그 요구를 철회하려 하지 않았습니다. 한 세대 만에 가장 대담했던 외교적 개방은 문이 쾅 닫히는 소리와 함께 막을 내립니다."
 SAU_events.74.t: "사우디-이스라엘 회담 결렬"
 SAU_events.75.a: "금세기의 도박."
 SAU_events.75.d: "아무 조건도, 팔레스타인 국가도, 사전 경고도 없이 사우디아라비아가 이스라엘을 승인하고 완전한 외교 관계를 맺었습니다. 워싱턴은 축하하고, 텔아비브는 환호하며, 아랍 민심은 불타오릅니다. 두 성지의 수호자가 금세기의 도박을 감행했습니다."
 SAU_events.75.t: "사우디아라비아의 이스라엘 승인"
 SAU_events.76.a: "기회는 지나갔다."
 SAU_events.76.d: "이스라엘과의 회담은 시간이 다했습니다. 너무 많은 문제가 너무 오래 열려 있었고, 기회는 지나갔습니다. 대표단은 조용히 짐을 꾸리고, 옛 경계가 지도에 돌아옵니다."
 SAU_events.76.t: "닫히는 창"
 SAU_events.77.a: "합의를 준비한다."
 SAU_events.77.d: "이스라엘이 거래를 현실로 만들 만큼 우리의 조건을 충분히 수용했습니다. 남은 것은 서명과 역사서입니다."
 SAU_events.77.t: "회담의 돌파구"
 SAU_events.79.a: "회담을 개시한다."
 SAU_events.79.b: "논의할 것이 없다."
 SAU_events.79.d: "워싱턴과 암만을 통해 사우디아라비아가 최고위급에서 공개적으로 관계 정상화를 논의할 준비가 되었다는 소식이 전해졌습니다. 대가는 높을 것이며 회담은 전 세계가 지켜볼 것입니다. 그러나 이처럼 큰 아랍의 손이 내밀어진 적은 없었습니다."
 SAU_events.79.t: "리야드의 타진"
 SAU_events.8.a: "방위 조약에 서명한다."
 SAU_events.8.b: "조약을 거절한다."
 SAU_events.8.d: "중동 전역에서 긴장이 고조되는 가운데 사우디아라비아가 파키스탄과의 상호 방위 조약을 제안합니다. 이 협정은 양국에 대한 보장과 군사적 접근권을 포함합니다."
 SAU_events.8.t: "[SAU.GetFlag] 사우디-파키스탄 방위 조약 [PAK.GetFlag]"
 SAU_events.80.a: "상상할 수 없던 일이 일정에 올랐다."
 SAU_events.80.d: "리야드와 텔아비브가 이를 확인했습니다. 관계 정상화에 관한 공식 회담이 시작되었습니다. 대표단은 이미 비행 중입니다. 지구상의 모든 외무부가 중동에 대한 전제를 다시 그리고 있으며, 이 거래의 모든 적대자들은 저마다의 시계를 돌리기 시작했습니다."
 SAU_events.80.t: "사우디-이스라엘 회담 개시"
 SAU_events.81.a: "그들의 거절이 곧 그들의 답이다."
 SAU_events.81.d: "텔아비브는 협상을 시작하는 것조차 거절했습니다. 타진은 도착하자마자 죽었고, 전 세계 앞에 내밀어진 왕국의 손은 허공에 매달려 있습니다. 이번 세대에는 거래가 없을 것입니다."
 SAU_events.81.t: "이스라엘의 회담 거부"
 SAU_events.82.a: "콘크리트와 유리로 지어진 미래."
 SAU_events.82.d: "기한이 도래했고, 모든 예측과 달리 왕국은 해냈습니다. 네옴은 홍해 위에서 빛나고, 리야드는 새롭게 탈바꿈했으며, 한때 유정 탑만 서 있던 곳에 관광객이 도착합니다. 사우디아라비아는 원유에 의존하지 않는 미래를 스스로 사들였습니다."
 SAU_events.82.t: "비전 2030 달성"
 SAU_events.83.a: "약속의 날이 왔다."
 SAU_events.83.d: "2030년이 되었고, 비전은 대부분 지어지지 않았습니다. 반쯤 완공된 탑들이 사막에서 녹슬고 있고, 약속된 도시들은 텅 비어 있으며, 수천억 달러를 쏟아붓고도 보여 줄 것이 거의 없습니다. 이를 공상이라 불렀던 비평가들은 승리의 행진을 하고 있으며, 사람들은 귀를 기울이고 있습니다."
 SAU_events.83.t: "애물단지들"
 SAU_events.84.a: "손실 처리한다."
 SAU_events.84.d: "비전의 또 다른 대표 사업이 완공되지 못한 채 기한을 넘겼습니다. 계약업체들에게는 대금이 지급되고, 크레인은 철거되며, 언론은 헤드라인을 얻습니다. 자본은 빠져나가고, 의심은 조금 더 퍼져 나갑니다."
 SAU_events.84.t: "기한을 넘긴 사업"
 SAU_events.88.a: "계승은 이미 의문에 부쳐졌다"
 SAU_events.88.d: "파흐드 빈 압둘아지즈 알사우드 국왕이 서거했습니다. 10년 전 뇌졸중으로 쓰러진 그는 이복동생 압둘라가 섭정으로 통치하는 동안 명목상으로만 재위했으며, 이제 압둘라가 자신의 권리로 왕좌에 오릅니다. 그러나 압둘라 자신도 여든을 넘겼고, 사우드 가문의 마즐리스 곳곳에서 왕자들은 이미 누가 그의 뒤를 이을지 저울질하고 있습니다.\n\n§Y압둘라 국왕의 후계를 둘러싼 경쟁이 이제 시작됩니다. 왕세자 결정을 확인하십시오.§!"
 SAU_events.88.t: "파흐드 국왕 서거"
 SAU_events.89.a: "왕관이 넘어간다"
 SAU_events.89.d: "압둘라 빈 압둘아지즈 알사우드 국왕이 서거했습니다. 10년 동안 사우드 가문의 왕자들은 누가 그의 뒤를 이을지를 놓고 저울질하고 흥정했습니다. 그 문제는 더 이상 미룰 수 없으며, 가장 큰 영향력의 몫을 장악한 왕자가 국왕으로 선포될 것입니다.\n\n§Y살만 빈 압둘아지즈:§! [?SAU_salman_share|0]%\n§Y무함마드 빈 나이프:§! [?SAU_mbn_share|0]%\n§Y무타입 빈 압둘라:§! [?SAU_mutaib_share|0]%"
 SAU_events.89.t: "압둘라 국왕 서거"
 SAU_events.9.a: "협력 관계를 수락한다."
 SAU_events.9.b: "제안을 거절한다."
 SAU_events.9.d: "사우디아라비아가 중국과의 전략적 투자 협력을 제안합니다. 이 협정은 중국의 인프라 사업을 확대하고 걸프에서 베이징의 입지를 강화할 것입니다."
 SAU_events.9.t: "[SAU.GetFlag] 사우디-중국 전략적 협력 [CHI.GetFlag]"
 SAU_events.90.a: "왕관과 함께 선다"
 SAU_events.90.b: "왕국을 폐지한다"
 SAU_events.90.d: "아랍 세계를 휩쓴 열병이 왕국으로 넘어왔습니다. 군중이 동부 주와 헤자즈 도시들의 거리를 메우고 절대 통치의 종식을 요구하고 있습니다. 무타윈은 주저하고, 국가근위대는 명령을 기다리며, 사우드 가문은 힘으로 국민에게 응답할지 옛 질서가 무너지게 둘지 결정해야 합니다."
 SAU_events.90.t: "왕국에 닿은 아랍의 봄"
 SAU_events.91.a: "지금 봉쇄한다"
 SAU_events.91.b: "협상 카드로 쥐고 있는다"
 SAU_events.91.b.tt: "§Y해협 봉쇄§! 결정은 원하는 때에 해협을 폐쇄할 수 있도록 계속 사용할 수 있습니다."
 SAU_events.91.d: "전쟁이 걸프에 닿았습니다. 우리의 미사일 포대와 고속 공격정은 세계 석유의 5분의 1이 통과해야 하는 동맥인 호르무즈 해협을 따라 대기하고 있습니다. 지금 해협을 막아 세계 경제를 무릎 꿇릴 수도 있고, 적들에게 위협을 드리운 채 원하는 순간에 봉쇄할 수도 있습니다."
 SAU_events.91.t: "호르무즈 해협을 봉쇄하시겠습니까?"
 SAU_events.92.a: "이슬람 공화국을 선포한다"
 SAU_events.92.b: "아라비아 공화국을 유지한다"
 SAU_events.92.d: "시아파 운동이 우세한 가운데 제헌 의회는 공화국이 어떤 국가가 될지 결정해야 합니다. 종교적 권위에 기반한 이슬람 공화국인지, 세속적인 아라비아 공화국인지입니다."
 SAU_events.92.t: "공화국의 성격"
 SAU_events.93.a: "이란의 저항의 축에 가담한다"
 SAU_events.93.b: "독립적인 반제국주의 전선을 구축한다"
 SAU_events.93.d: "테헤란이 새로운 시아파 공화국에 손을 내밀었습니다. 강경파는 선택해야 합니다. 최고 지도자의 수호 아래 이란의 저항의 축 안에 자리를 잡을 것인지, 어떤 외국 수도에도 응답하지 않는 독립 전선을 구축할 것인지입니다."
 SAU_events.93.t: "저항의 축"
 SAU_events.94.a: "전선에 가담한다"
 SAU_events.94.b: "초청을 거절한다"
 SAU_events.94.d: "아라비아 공화국이 저항의 축에 맞서는 대항 깃발을 올리며, 우리 나라에 테헤란과 결별하고 리야드가 이끄는 독립 전선에 가담하라고 요구합니다."
 SAU_events.94.t: "아라비아의 초청"
 SAU_events.95.a: "아랍 코민테른에 가입한다"
 SAU_events.95.b: "거리를 둔다"
 SAU_events.95.d: "붉은 아라비아가 아랍 세계의 노동자와 혁명가들에게 하나의 깃발 아래 단결하라고 호소합니다."
 SAU_events.95.t: "아랍 코민테른"
 SAU_events.96.a: "붉은 새벽이 밝아 온다"
 SAU_events.96.d: "붉은 깃발이 리야드 위에 나부끼고 있습니다. 사우드 가문은 쓸려 나갔고, 아라비아 인민공화국이 선포되어 혁명을 아랍 세계 전역으로 확산시키겠다고 맹세합니다."
 SAU_events.96.t: "아라비아 인민공화국"
 SAU_events.97.a: "그렇게 선포되었다"
 SAU_events.97.d: "제헌 의회가 법학자의 후견과 신앙인들의 통치에 기반한 아라비아 이슬람 공화국을 선포했습니다."
 SAU_events.97.t: "아라비아 이슬람 공화국"
 SAU_events.98.a: "위험한 균열이다"
 SAU_events.98.d: "아라비아가 이란의 후견을 거부하고 자신의 반제국주의 전선을 이끌기 위해 테헤란과 결별했습니다. 시아파 세계는 두 개의 경쟁하는 저항의 중심으로 갈라졌습니다."
 SAU_events.98.t: "축의 분열"
 SAU_events.99.a: "이 일에 대해 답을 해야 할 것이다"
 SAU_events.99.d: "리야드가 축과 결별하고 우리의 동맹들을 빼내 갔습니다. 테헤란은 저항에 대한 이 배신에 어떻게 응답할지 결정해야 합니다."
 SAU_events.99.t: "사우디의 분열"
 Among_Major_powers_close: "§G강대국과의 회담이 종료되었습니다§!"
 Among_Major_powers_close_east: "§G동방 블록과의 회담이 종료되었습니다§!"
 Among_Major_powers_close_west: "§G서방 블록과의 회담이 종료되었습니다§!"
 Among_Major_powers_open: "§G강대국과의 회담이 열려 있습니다§!"
 Among_Major_powers_open_east: "§G동방 블록과의 회담이 열려 있습니다§!"
