l_korean:
 Solomon_Islands.1.t: "수도 인근에서 무장 단체 결성"
 Solomon_Islands.1.d: "말라이타인에 대한 적대 행위가 늘어나는 데 대응해 무장 조직 말라이타 이글 포스가 이사타부 자유 운동에 맞서기 위해 결성되었습니다. 두 단체 사이에 이미 충돌이 시작되었으며, 우리 경찰 병력 일부가 MEF 편에 가담했다는 보고도 있습니다. 이 단체를 현재 베테랑 정치인 앤드루 노리가 이끌고 있다는 점도 좋지 않은데, 이 때문에 대중의 눈에 불행하게도 상당한 신뢰성을 얻고 있습니다."
 Solomon_Islands.1.a: "상황은 계속 나빠지기만 한다."
 Solomon_Islands.2.t: "포위된 호니아라"
 Solomon_Islands.2.d: "호니아라의 정치 상황이 한계점에 이르렀습니다. 수개월간 여러 집단 사이에 민족 간 충돌이 이어진 끝에, 준군사 경찰 병력의 일부에게 지원을 받은 것으로 알려진 말라이타 이글 포스 대원들이 수도 주변의 주요 전략 거점을 장악했습니다. \n\n우리가 가진 제한된 정보에 따르면 이들은 총리를 사임시키기 위해 이쪽으로 향하고 있습니다. 이들을 막을 수단이 마땅치 않은 만큼, 우리의 유일한 선택지는 남아 있는 이사타부 자유 운동 세력과 거래를 맺어 무장 세력을 몰아내는 것입니다. 양측의 긴장을 더 악화시킬 뿐일 수도 있지만, 쿠데타는 막을 수 있을지도 모릅니다."
 Solomon_Islands.2.a: "선택의 여지가 없다."
 Solomon_Islands.2.b: "그들을 몰아내자."
 Solomon_Islands.3.t: "평화의 약속"
 Solomon_Islands.3.d: "정부가 기능을 할 수 있는 수준으로 복원되었지만, 수도 섬 안에서는 여전히 공격이 흔히 일어나고 있습니다. 오스트레일리아 정부와의 연줄을 통해 국외 중립 지역에서 평화 회담을 여는 방안이 논의되었습니다. 제안된 장소 중 하나가 타운즈빌입니다. 말라이타 이글 포스와 이사타부 자유 운동 대표들이 참석해 불만을 풀고, 이러한 충돌이 다시 일어나지 않도록 하는 조항을 마련하기를 기대합니다."
 Solomon_Islands.3.a: "가치 있는 노력이다."
 Solomon_Islands.4.t: "솔로몬 제도 평화 회담"
 Solomon_Islands.4.d: "솔로몬 제도의 외교관들이 현지 주 정부들과 여러 무장 단체 사이의 평화 회담을 중재해 달라고 요청하며 우리를 찾아왔습니다. \n\n99년의 민족 간 충돌 이후 서부 주들에서 말라이타인에 대한 차별이 심해졌습니다. 긴장은 수도 주변의 폭력적인 충돌로 번졌고, 이어 전임 지도자가 축출되었습니다. 우리는 이미 제도에 상당한 존재감을 가지고 있으며, 그래서 그들이 우리에게 중재를 요청한 것으로 보입니다."
 Solomon_Islands.4.a: "안정을 지킬 수만 있다면 무엇이든."
 Solomon_Islands.4.b: "우리가 상관할 일이 아니다."
 Solomon_Islands.5.t: "폭풍"
 Solomon_Islands.5.d: "우리가 섬 전역에서 지켜 온 취약한 평화가 무너졌습니다. 수개월간 이어진 정치적 약탈, 사라지는 자금, 텅 빈 초소는 이제 문 앞에 닥친 폭풍의 전조일 뿐이었습니다. 무장 충돌이 이전보다 훨씬 큰 규모로 되돌아와 시골과 마을 곳곳을 전면적인 전장으로 바꾸어 놓고 있습니다. 전국의 기업이 문을 닫았고, 집을 떠나야 했던 수천 명이 이제 나라를 떠나 피난하고 있습니다. \n\n우리는 내전 직전까지 와 있습니다. 가장 가까운 동맹인 오스트레일리아를 시작으로 이웃 나라들에 즉각적인 개입을 요청하는 것이 최선일지도 모릅니다. 그들의 주둔은 분명 우리의 독립성을 약화시키겠지만, 선택지가 거의 없는 만큼 우리의 앞날은 암울해 보입니다."
 Solomon_Islands.6.t: "오스트레일리아, 개입 작전 승인"
 Solomon_Islands.6.d: "오스트레일리아 정부가 우리의 호소에 진지하게 응답하여 나라의 안정을 돕기 위한 개입군을 보내겠다고 약속했습니다. 곧 임무 부대 편성을 시작할 예정이며, 외교관들이 우리 측과 만나 작전을 조율할 계획입니다. 예상되는 조치에는 경찰과 군 병력이 섞인 2000명 규모의 인력과 우리를 돕기 위해 파견될 건설 팀이 포함됩니다."
 Solomon_Islands.6.a: "아직 희망은 있을지도 모른다."
 Solomon_IslandsNews.1002.t: "솔로몬 제도의 무장 쿠데타"
 Solomon_IslandsNews.1002.d: "솔로몬 제도의 총리 바르톨로뮤 울루파알루가 어제 말라이타 이글 포스로 알려진 무장 단체에 총구를 겨눈 채 인질로 붙잡혀 사임을 강요당했습니다. \n\n이번 쿠데타는 정부가 섬 수도 호니아라에서 벌어진 일련의 긴장 고조를 억제하지 못하고, 결국 말라이타 이글 포스와 이사타부 자유 운동의 충돌로 이어진 뒤에 일어났습니다. 지난 18개월 동안 민족 간 전투로 약 60명이 숨졌으며, 제도에는 이주 위기가 발생했습니다. 쿠데타 주도 세력은 이제 자신들이 호니아라의 유일한 권위라고 주장하고 있습니다."
 Solomon_IslandsNews.1002.a: "다가오는 폭풍"
 SOL_Lead_to_hostilities_TT: "§R긴장이 고조될 것입니다.§!"
 SOL_IFM: "이사타부 자유 운동"
 Solomon_Islands.0.t: "고조되는 호니아라의 민족 갈등"
 Solomon_Islands.0.d: "과달카날에서 말라이타 이주민들이 부당한 대우를 받으면서 제도 전역에서 민족 간 마찰이 계속 불붙고 있습니다. 이사타부 자유 운동으로 알려진 집단 때문에 이미 수천 명의 말라이타인이 집을 버리고 피난해야 했으며, 주 안으로 자유롭게 드나들지 못하도록 수도 주변에 도로 봉쇄선이 설치되었습니다. \n\n우리 경찰은 압도당했거나 매수된 듯 보이므로, 우리는 상황이 더 걷잡을 수 없이 커지지 않기만을 바라며 지켜볼 수밖에 없습니다."
 Solomon_Islands.0.a: "곧 다 잠잠해질 것이다."
 Solomon_Islands.3.b: "시간 낭비일 뿐이다."
 solomon_islands.5.a: "도움을 요청한다."
 solomon_islands.5.b: "우리 힘으로 해결해야 한다."
 Solomon_Islands.7.t: "바다 건너의 침묵"
 Solomon_Islands.7.d: "오스트레일리아 정부가 우리의 개입 요청을 거절하여, 다가오는 폭풍에는 우리 힘만으로 맞서야 하게 되었습니다."
 Solomon_Islands.7.a: "우리는 정말 혼자다."
 Solomon_Islands.8.t: "실패한 개입"
 Solomon_Islands.8.d: "개입이 명백히 실패로 끝난 것을 보고 오스트레일리아군은 손실을 줄이기로 하고 제도에서 철수하기 시작했습니다. 나라를 지킬 병력이 우리에게 충분하지 않으므로, 우리는 또 한 번의 위기로 빠져들 가능성이 매우 높습니다. 온갖 노력에도 불구하고 우리는 피할 수 없는 사태를 막아 내지 못했습니다."
 Solomon_Islands.8.a: "제도 위로 어둠이 내린다"
 SOL_worsening_ethnic_tensions_TT: "민족 갈등이 §R악화됩니다§!"
 SOL_munda_accords: "문다 협정"
 SOL_munda_accords_desc: "90년대에 갈등이 고조된 이후, 국내 이주 증가로 빚어진 긴장을 완화하기 위한 일련의 조항이 도입되었습니다. 이 협정은 실업 상태의 부랑자가 주 경계를 넘어 이동하는 것을 제한하고, 말라이타인을 출신 주로 송환하도록 강제하며, 외국인의 토지 취득을 막습니다."
 SOL_western_logging_efforts: "서부 주 벌목 사업"
 SOL_western_logging_efforts_desc: "서부 주의 상업적 벌목은 빠르게 우리의 가장 수익성 높은 산업이 되어 수출의 대부분을 차지하고 지역 경제의 기둥 역할을 하고 있습니다. 그러나 최근 그 성공이 일자리를 찾아 제도 곳곳에서 몰려드는 이주민을 끌어들였습니다. 그 결과 이 지역의 이주민 위기가 한층 심각해지고 있습니다."
 SOL_aftermath_of_the_tensions: "갈등의 여파"
 SOL_aftermath_of_the_tensions_desc: "1999년 협정으로 여러 문화적 분쟁이 더 널리 인정받고 합법적인 해결 경로를 얻게 되었지만, 제도에는 여전히 위태로운 평화가 이어지고 있습니다. 정부의 상태를 장악하고 국내의 이주 문제를 해결하지 못하면, 또 다른 위기가 닥치는 것을 막지 못할 수도 있습니다. \n§W--------------§!\n안정도가 §Y70%§!보다 높고 부패 수준이 §Y(3) 완만한 부패§! 이상이면 이 국가 정신이 §G제거됩니다§!."
 SOL_agreement_with_the_gangs: "갱단과의 합의"
 SOL_agreement_with_the_gangs_desc: "이사타부 자유 운동과의 거래로 꼭 필요했던 숨 돌릴 여유를 얻었지만, 그 대가로 악명 높은 범죄자 수십 명이 거리로 풀려났습니다. 경찰은 이제 급증한 범죄에 대처해야 하며, 국민의 신뢰는 사상 최저 수준으로 떨어졌습니다."