 sp_caseless_ammunition: "무탄피 탄약"
 sp_caseless_ammunition_desc: "발사체와 추진제를 하나의 몸체에 통합함으로써 탄약의 무게와 생산 비용을 줄일 수 있습니다."
 sp_fire_support_land_drone: "화력 지원 드론"
 sp_fire_support_land_drone_desc: "우리는 공중 드론을 보유하고 있지만, 지상 기반 드론을 개발하여 보병의 사용 가능한 화력을 높일 수 있습니다."
 sp_tactical_augmented_reality: "전술적 증강 현실"
 sp_tactical_augmented_reality_desc: "전장 병사들의 시야에 실시간 정보를 제공할 수 있는 웨어러블 비전 장치를 만들면 전투 효율성을 확실하게 향상 시킬 수 있습니다."
 sp_double_shot_rifle: "2연발 소총"
 sp_double_shot_rifle_desc: "특수부대의 교전 시 목표는 짧은 시간 동안 정확한 사격을 빠르게 퍼붓는 것입니다. 특수부대들을 위한 특수한 무기를 개발함으로써 이를 달성할 수 있습니다."
 sp_experimental_exoskeleton: "실험적인 외골격"
 sp_experimental_exoskeleton_desc: "외골격은 착용자의 능력을 높이기 위한 기계식 슈트입니다. 속도, 힘, 반응 시간의 향상 형태로 나타날 수 있습니다. 군사용 슈트를 개발하면 우리 병사들이 더 효과적으로 싸울 수 있을 것입니다."
 sp_active_camouflage: "능동 위장"
 sp_active_camouflage_desc: "위장은 병사를 숨기는 데 유용하지만, 안타깝게도 보통 예상 전투 환경 사이의 절충안입니다. 주변 지형에 적응하는 위장을 설계할 수 있다면 우리 병사들은 적에게 거의 보이지 않게 될 것입니다."
 sp_truck_modular_seating: "트럭에 맞춤 좌석 탑재"
 sp_truck_modular_seating_desc: "트럭으로 수송될 때 우리 병사들은 대개 적재함에 자유롭게 앉습니다. 모든 트럭에 들어맞는 모듈식 좌석 배치를 개발해야 합니다. 그러면 병력 수송이 더 질서정연해지고 하차도 더 효율적이 될 것입니다."
 sp_utility_vehicle_electric_engines: "트럭 전기 엔진"
 sp_utility_vehicle_electric_engines_desc: "전기 엔진은 오래전부터 존재해 왔으며 민간 시장에서 인기를 얻고 있습니다. 우리 군용 차량에도 이 엔진을 개발하여 연료 의존도를 줄일 수 있을 것입니다."
 sp_armoured_vehicle_project: "기갑 전투 체계 실험"
 sp_armoured_vehicle_project_desc: "자국산 장갑차량을 생산하려면 다양한 차량 설계를 실험하는 데 시간과 노력을 들여야 합니다."
 sp_armoured_vehicle_project_tt: "§Y주력 전차 차체§!, §Y보병전투차 차체§!, §Y경전차 차체§!, §Y자주포 차체§!, §Y자주 대공포 차체§!를 연구할 수 있게 됩니다"
 sp_tank_support_drones: "전차용 지원 드론"
 sp_tank_support_drones_desc: "드론은 전장에서 점점 더 흔해지고 있습니다. 우리 전차는 시야가 제한적이므로 전차에 드론 통제 센터를 통합하고 발사 가능한 드론을 장비하는 것이 합리적일 수 있습니다. 이렇게 하면 전차 조종수가 전장을 훨씬 더 잘 살필 수 있습니다."
 sp_tank_support_drones_2: "전차용 전투 드론"
 sp_tank_support_drones_2_desc: "감시 외에도 전차 전투 드론은 목표를 식별하고 표시할 수 있으며, 폭약이나 탑재 무기로 특정 목표와 직접 싸울 수도 있습니다."
 sp_active_protection_systems: "능동 방어 체계"
 sp_active_protection_systems_desc: "전차를 연막으로 숨기는 것만으로는 충분하지 않습니다. 날아오는 미사일과 관통체를 파괴하는 요격 체계를 전차에 통합해야 합니다."
 sp_tank_electric_engine: "전차 전기 동력 계통"
 sp_tank_electric_engine_desc: "기존의 전기 동력 팩은 전차의 보조 장치만 가동할 수 있었습니다. 충분한 투자가 뒷받침된다면 전차 전용 완전 전기식 동력 계통을 구축할 수 있을 것입니다."
 sp_tank_aa_launchers: "전차 장착 지대공미사일"
 sp_tank_aa_launchers_desc: "전차는 일반적으로 공중 목표에 취약하며 이에 대한 방호 수단이 제한적입니다. 전차가 대전차 유도 미사일을 발사하는 것은 이미 검증된 방식이지만, 대공 미사일도 발사하게 할 수 있을지도 모릅니다."
 sp_tank_self_sharpening_ammo: "스스로 날카로워지는 탄환"
 sp_tank_self_sharpening_ammo_desc: "특정한 열처리를 통해 텅스텐 관통체의 미세 구조를 개선하여 관통 중 탄의 내구성을 높일 수 있습니다."
 sp_tank_thermal_camo: "열감지 불가 탄환"
 sp_tank_thermal_camo_desc: "특수 코팅과 은폐 장치로 차량의 열 신호를 낮추어 열상 카메라와 열추적 미사일에 훨씬 탐지되기 어렵게 만들 수 있습니다."
 sp_tank_chameleon_camo: "위장 탄환"
 sp_tank_chameleon_camo_desc: "특수 장갑판으로 차량의 뒤쪽 풍경을 보이는 면에 투영하여 차량이 배경을 흉내 내도록 만들 수 있습니다."
 sp_super_heavy_tank_turrets: "초중전차 포탑"
 sp_super_heavy_tank_turrets_desc: "전차에 더 무거운 무장을 장비하려면 더 큰 포탑을 만들 수 있는 현실적인 방법을 찾아야 합니다."
 sp_double_barrel_cannons: "이중포 전차"
 sp_double_barrel_cannons_desc: "포신이 두 개인 전차를 만들려는 시도는 여러 차례 있었지만 비효율적이라는 이유로 폐기되었습니다. 효율적인 장전 기구를 개발할 수 있다면 두 문의 포를 모두 활용할 수 있을지도 모릅니다."
 sp_railgun_cannon: "레일건"
 sp_railgun_cannon_desc: "레일건은 전기가 흐르는 두 개의 금속 레일을 이용해 자성 탄자를 포신을 따라 추진시킵니다. 이를 통해 재래식보다 작은 탄자로도 폭발 물질 없이 막대한 피해를 입힐 수 있습니다."
 sp_railgun_cannon_2: "위상 레일건"
 sp_railgun_cannon_2_desc: "플라즈마 레일건은 고체 탄자 대신 전자기력으로 플라즈마 기체 입자를 고속으로 가속합니다. 목표에 명중하면 엄청난 열과 운동 에너지가 발생할 뿐만 아니라 플라즈마가 전자기 복사를 방출하여 전자 장비를 교란합니다."
 sp_tank_based_laser_main_cannons: "레이저 특화 주포"
 sp_tank_based_laser_main_cannons_desc: "강력하게 집중된 레이저를 만들 수 있는 대형 에너지 무기를 만들면, 사실상 무엇이든 관통할 수 있는 주력 전차용 무기를 만들 수 있습니다."
 sp_tank_based_laser_point_defense: "전차 레이저 점방어"
 sp_tank_based_laser_point_defense_desc: "능동 방호 체계 외에도, 전차를 향해 날아오는 미사일을 파괴하는 소형 레이저 무기를 개발할 수 있습니다."
 sp_automatic_twin_barrel_mortar_turret: "자동 쌍열 박격포"
 sp_automatic_twin_barrel_mortar_turret_desc: "박격포 포탑은 오래된 기술이지만, 한 포탑에 박격포 두 문을 장착하면 훨씬 높은 발사 속도와 여러 발의 동시 착탄을 달성할 수 있습니다."
 sp_naval_vessel_project: "해군 군함 실험"
 sp_naval_vessel_project_desc: "일곱 바다(또는 우리 집 뒷마당 수영장)를 항해하려면 실험적인 전함 개발에 자원을 투입해야 합니다."
 sp_naval_vessel_project_tt: "§Y초계함 선체§!, §Y호위함 선체§!, §Y구축함 선체§!, §Y순양함 선체§!, §Y헬기 운용함 선체§!, §Y항공모함 선체§!, §Y공격 잠수함 선체§!, §Y미사일 잠수함 선체§!를 연구할 수 있게 됩니다"
 sp_stealth_corvette: "스텔스 초계함"
 sp_stealth_corvette_desc: "소형 스텔스 초계함은 적 함선에 탐지되지 않고 적대 세력과 싸울 수 있는 능력을 확장하는 훌륭한 선택입니다."
 sp_stealth_frigate: "스텔스 호위함"
 sp_stealth_frigate_desc: "일부 호위함의 설계 방향이 바뀌기 시작했습니다. 호위함이 가장 유리한 위치에 있도록 스텔스 설계에 투자하는 것이 최선이라고 판단했습니다."
 sp_stealth_destroyer: "스텔스 구축함"
 sp_stealth_destroyer_desc: "다양한 제조사가 새로운 물결의 해군 기술을 개발하기 시작했지만 성과는 없었습니다. 우리는 구축함이 탐지를 거의 받지 않도록 하여, 적이 우리 함대가 인근에 있음을 알기 훨씬 전에 타격할 수 있도록 이 신기술을 후원해야 합니다."
 sp_medium_naval_nuclear_engines: "해군 핵 공학"
 sp_medium_naval_nuclear_engines_desc: "원자로와 원자력이 발명된 후 우리는 해군 함선에 원자력 엔진을 탑재할 가능성을 탐구하고 조사하기 시작했습니다. 이는 건선거에서 보내는 시간을 최소화할 것입니다"
 sp_advanced_ballistic_propulsion_systems: "첨단 탄도 추진 체계"
 sp_advanced_ballistic_propulsion_systems_desc: "일부 첨단 탄도 추진 체계의 발명은 우리 과학자들로 하여금 \\"만약에?\\"라는 질문을 숙고하게 했습니다. 이들은 전자기 추진 같은 방식을 이용해, 전에 없던 속도로 탄자를 발사할 수 있는 무기를 만들려는 새로운 형태의 탄도 추진 체계를 개발하기 시작했습니다."
 sp_rail_gun_naval_cannons: "레일건 해군 함포"
 sp_rail_gun_naval_cannons_desc: "레일건 포는 전자기 추진을 이용해 탄자를 공중으로 추진시켜 엄청난 속도로 피해를 입힙니다. 탄자 자체에는 폭발물이 들어 있지 않으며, 이 강렬한 속도를 이용해 장갑을 뚫고 나갑니다."
 sp_aircraft_project: "항공기 실험"
 sp_aircraft_project_desc: "항공기는 설계와 제작에 첨단 산업이 필요한 고도로 기술적인 장비입니다. 자국산 항공기를 가지려면 실험을 거쳐야 합니다."
 sp_experimental_engines: "실험적 엔진 유형"
 sp_experimental_engines_desc: "여러 집단의 연구 개발 팀에 제안된 다양한 실험적 엔진 유형이 있습니다. 엔진과 실험적 유형의 실험에 투자하면 공중에서 적에 대한 기술적 우위를 얻을 수 있습니다."
 sp_nuclear_engines: "항공기 원자력 엔진"
 sp_nuclear_engines_desc: "대규모 원자력 엔진의 소형화와 항공모함 등에 대한 원자력 엔진 배치에서 여러 차례 성공을 거둔 후, 과학자들은 항공기에 탑재할 수 있는 더 작은 원자력 엔진을 설계하고 개발하기 시작했습니다. 이는 항공기에 연료를 실어야 하는 요건을 없앨 것입니다. 더 먼 곳까지 배치할 수 있고, 적이 착륙해야 하는 동안에도 우리 항공기를 하늘에 더 효과적으로 유지할 수 있게 됩니다."
 sp_solar_engines: "태양 엔진"
 sp_solar_engines_desc: "실험적 엔진 유형의 개발이 시작되면서 태양광 엔진이 또 하나의 제안된 엔진 유형으로 대두되었습니다. 항공기 동체에 태양광 엔진을 장착하거나 기체에 통합하여, 항공기가 비행 중 하늘에서 자동으로 동력을 얻도록 합니다."
 sp_scramjet_engines: "스크렘 제트 엔진"
 sp_scramjet_engines_desc: "스크램제트는 램제트의 변형입니다. 유입 공기를 아음속으로 감속하는 대신, 스크램제트는 초음속 상태에서 공기에 점화합니다. 이를 통해 항공기는 훨씬 더 높은 속도를 낼 수 있습니다."
 sp_ramjet_engines: "터보렘제트 엔진"
 sp_ramjet_engines_desc: "일반 터보제트와 달리 램제트는 터빈이 아닌 운동을 통해 공기를 흡입합니다. 이는 더 효율적이고 단순한 엔진을 만들지만, 저속에서 항공기의 운용을 제한합니다."
 sp_fully_autonomous_computers_framework: "완전 자율 컴퓨터 체계"
 sp_fully_autonomous_computers_framework_desc: "자율 공군을 만드는 첫걸음을 내딛으려면 자율 컴퓨터의 기초를 실험하고 만들어야 합니다."
 sp_fully_autonomous_fighters: "완전 자동화 전투기"
 sp_fully_autonomous_fighters_desc: "컴퓨터가 완전히 조종하는 전투기는 조종사의 생명을 온전히 지킬 수 있게 하며, 손실을 보충하기 위해 긴 훈련 과정에 의존할 필요도 없어집니다."
 sp_fully_autonomous_bombers: "완전 자동화 폭격기"
 sp_fully_autonomous_bombers_desc: "컴퓨터가 완전히 조종하는 폭격기는 조종사의 생명을 온전히 지킬 수 있게 하며, 손실을 보충하기 위해 긴 훈련 과정에 의존할 필요도 없어집니다."
 sp_fusion_reactors: "핵융합로"
 sp_fusion_reactors_desc: "핵융합로는 핵분열이 아닌 핵융합을 이용해 전기를 생산하는 원자로입니다. 핵융합은 흔히 원자로의 미래로 여겨지며, 핵연료 킬로그램당 거의 네 배에 달하는 에너지를 생산할 수 있습니다."
 sp_space_based_solar_farms: "우주 기반 태양광 발전소"
 sp_space_based_solar_farms_desc: "태양광 에너지의 지상 활용은 널리 퍼져 있고 어디에서나 볼 수 있는 기술입니다. 이제 풍력이나 수력 에너지만큼 흔해져 핵심 에너지원 중 하나가 되었습니다. 늘어나는 에너지 수요를 충족하기 위해, 다양한 크기의 위성 등을 통해 우주에 태양광 패널 어레이를 건설하고 지구로 에너지를 송신하자는 구상이 제기되었습니다."
 sp_improved_based_solar_farms: "개량형 우주 기반 태양광 발전소"
 sp_improved_based_solar_farms_desc: "더 나은 광전지와 기반 기술의 개선 같은 추가적인 변화를 도입하면 태양광 발전소의 효율을 한층 더 높일 수 있습니다."
 sp_improved_maglev_trains: "자기부상 열차"
 sp_improved_maglev_trains_desc: "기존 자기부상열차를 개선하고 이에 집중하는 것은 우리나라와 우리 경제의 미래를 위해 필수적입니다. 이 열차는 인프라만 뒷받침된다면 수송이 거의 순식간에 이루어지는 미래의 핵심입니다."
 sp_construction_exoskeletons: "건설용 외골격"
 sp_construction_exoskeletons_desc: "건설용 외골격은 크레인, 지게차 등 차량을 대체하기 위해 개발된 소형, 중형, 대형 외골격의 집합체로, 단 한 명의 조작원으로 운용할 수 있습니다. 이 기술 덕분에 우리의 건설 공학은 수십 년을 앞서 나가게 되었으며, 건설은 믿기 어려울 만큼 효율적이고 비용 효과적으로 바뀌었습니다."
 sp_thorium_nuclear_fuel: "토륨 핵 연료"
 sp_thorium_nuclear_fuel_desc: "핵연료로서의 토륨은 풍부한 매장량과 높은 출력 덕분에 폭넓은 상업적 이용을 위해 꾸준히 연구되고 추구되어 왔습니다. 우리 원자로에 사용할 안정적이고 기능적인 원자로와 핵연료를 개발하는 것은 우리나라의 원자로와 전력망에 막대한 이점이 될 것입니다."
 sp_wireless_power_grid_expansion: "무선 전력망 확장"
 sp_wireless_power_grid_expansion_desc: "중거리 및 장거리 무선 전력 전송 도관을 더 많이 도입하도록 전력망을 확장하면, 유지해야 할 인프라가 줄어들어 에너지 손실을 없애는 동시에 발전량을 늘릴 수 있을 것입니다."
 sp_improved_synthetic_diamonds: "개량형 합성 다이아몬드"
 sp_improved_synthetic_diamonds_desc: "합성 다이아몬드의 생산과 공정을 더 비용 효과적이고 생산적으로 확장하면 점점 더 많은 산업이 인공 다이아몬드로 전환할 것입니다. 인공 다이아몬드로의 전환은 의료 용품, 컴퓨터 부품 및 그 밖의 많은 분야의 가격을 크게 낮출 것입니다."
 sp_atmospheric_water_recycling: "대기 중 물 재활용"
 sp_atmospheric_water_recycling_desc: "대기 중의 물을 재활용하는 능력을 갖추고 발전시키면 이전에는 농업 개발이 불가능하다고 여겨졌던 지역에서도 농사를 지을 수 있게 됩니다. 또한 토양이나 지역 대수층에서 물을 끌어오는 더 공격적인 방식에 의존할 필요 없이 물을 정화할 수 있게 됩니다."
 sp_space_program_tt: "다음 §Y기술 계통§!을 해제합니다:\n- §Y위성항법시스템(GNSS)§!\n- §Y통신위성(COMSAT)§!\n- §Y첩보위성(SPYSAT)§!\n- §Y궤도 발사체(OLV)§!\n"
 sp_space_weapons_tt: "다음 §Y기술 계통§!을 해제합니다:\n- §Y공격용 인공위성§!"
 sp_nuclear_warhead_program: "핵탄두 프로그램"
 sp_nuclear_warhead_program_desc: "핵탄두 개발의 복잡성은 수많은 시련과 고난 가운데 하나입니다. 대규모 파괴가 가능한 탄두를 만드는 일은 공학, 기계, 물리학의 위업일 뿐만 아니라, 타인의 파괴를 초래하려는 인류 의지의 증거이기도 한 위업입니다."
 sp_nuclear_warhead_program_tt: "다음 §Y핵 상태§!를 잠금 해제합니다.\n- §Y핵보유국 (방어적)§!\n- §Y핵보유국 (공세적)§!\n"
 sp_missile_project: "미사일 실험"
 sp_missile_project_desc: "실제 항공기를 감당할 수 없을 때 미사일은 저렴한 대안이 될 수 있습니다. 추가적인 공격 능력을 확보하기 위해 (로켓 과학이 아닌) 미사일 과학에 투자해야 합니다."
 sp_missile_project_tt: "§Y대륙간 탄도 미사일§!, §Y중거리 탄도 미사일§!, §Y지상 발사 순항 미사일§!, §Y지대공 미사일§!을 연구할 수 있게 됩니다."
