 SAU_rep_shia_const_republic_2:0 "The Federal Welfare State"
 SAU_rep_shia_const_republic_2_desc:0 "Build out the institutions of the constitutional republic: a federal welfare state that binds the communities together through shared prosperity and the rule of law."
 SAU_rep_shia_islamic_republic_2:0 "The Revolutionary State"
 SAU_rep_shia_islamic_republic_2_desc:0 "Forge the Islamic Republic into a disciplined revolutionary state, its institutions, militias, and clergy fused into a single instrument of the resistance."
 SAU_rep_shia_republic_end:0 "The Republic Endures"
 SAU_rep_shia_republic_end_desc:0 "Whichever road it took, the Shia republic has consolidated its hold on Arabia. The provisional order gives way to a permanent state, ready to take its place among the powers of the region."
 SAU_com_red_guard_1:0 "Regularize the Red Guard"
 SAU_com_red_guard_1_desc:0 "Forge the revolutionary militias into a professional Red Army, with standardized equipment, trained officers, and a war industry to arm them."
 SAU_com_red_guard_1_tt:0 "A regular Red Army: war support, military industry, and a stockpile of equipment."
 SAU_com_red_guard_2:0 "The People's Militia"
 SAU_com_red_guard_2_desc:0 "Keep the revolution in the hands of the people, arming every worker and peasant as a militiaman ready to defend the republic."
 SAU_com_red_guard_2_tt:0 "A mass people's militia: war support, conscription, and a flood of manpower."
 SAU_republic_provisional_government_1:0 "Convene the National Assembly"
 SAU_republic_provisional_government_1_desc:0 "The provisional government throws the new republic open to its parties. The road ahead forks between the movements that toppled the old order."
 SAU_republic_provisional_government_4:0 "The Arab Ba'ath Party"
 SAU_republic_provisional_government_4_desc:0 "Hand the republic to the Arab Socialist Ba'ath Party, the secular pan-Arab nationalists who dream of a single united Arab nation."
 SAU_nda_state:0 "The National Democratic Assembly"
 SAU_baath_state:0 "The Arab Ba'ath"
 SAU_baath_state_tt:0 "§YUnity, freedom, socialism.§!\n\nThe party is the vanguard of the Arab nation, fusing officer and worker, fellah and student into a single revolutionary will. Every frontier is but a waystation on the road to one Arab homeland."
 SAU_baath_growth_tt:0 "§GForges the Arab Ba'ath§! — the revolution's hold over the state deepens with every step won."
 SAU_republic_provisional_government_4_gtt:0 "§YThe Arab Ba'ath grows:§!\n§G+1% Political Power Gain, +1% Stability§!"
