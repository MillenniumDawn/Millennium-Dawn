 TAJ_emomali_rahom_desc: "エモマリ・ラフモンはタジキスタンの長期にわたる大統領であり、1992年から権力を握っている。彼はソビエト連邦の崩壊とタジク内戦（1992-1997）の勃発後に頭角を現し、その間にイスラム主義者や民主化勢力を含む様々な反対派閥を打ち負かすことによって支配を固めた。ラフモンは高度に中央集権化された権威主義的な政府を維持し、しばしば弾圧を用いて政治的異議やメディアの自由を抑圧してきた。ラフモンの下で、タジキスタンはロシアの緊密な同盟国であり続け、経済的課題に苦しみ、特にロシアにおける海外のタジク人移民労働者からの送金に大きく依存してきた。彼の政権はまた、タジクのアイデンティティと言語の促進を通じて国民的統一を促進し、ロシアの文化的影響から距離を置く一方で、国内の急進的なイスラム運動とも戦う努力によって特徴づけられてきた。"
 TAJ_emomali_rahom_desc2: "エモマリ・ラフモンはタジキスタンの長期にわたる大統領であり、1992年から権力を握っている。彼はソビエト連邦の崩壊とタジク内戦（1992-1997）の勃発後に頭角を現し、その間にイスラム主義者や民主化勢力を含む様々な反対派閥を打ち負かすことによって支配を固めた。ラフモンは高度に中央集権化された権威主義的な政府を維持し、しばしば弾圧を用いて政治的異議やメディアの自由を抑圧してきた。ラフモンの下で、タジキスタンはロシアの緊密な同盟国であり続け、経済的課題に苦しみ、特にロシアにおける海外のタジク人移民労働者からの送金に大きく依存してきた。彼の政権はまた、タジクのアイデンティティと言語の促進を通じて国民的統一を促進し、ロシアの文化的影響から距離を置く一方で、国内の急進的なイスラム運動とも戦う努力によって特徴づけられてきた。"
 TAJ_badakhshan_resistance_dynamic_modifier_desc: "タジク内戦（1992-1997）を通じて、ゴルノ・バダフシャンは、タジキスタンからのより大きな自治権または完全な独立を主張する反対勢力の拠点となった。戦後も、バダフシャンの多くの人々は中央政府に異議を唱え続け、より多くの政治的自由と経済的権利を要求した。地元住民の不満は、地域の自治権を弱体化させながらタジク多数派の利益を優先すると認識されている政府による政治的排除と無視の感覚に起因する。"
