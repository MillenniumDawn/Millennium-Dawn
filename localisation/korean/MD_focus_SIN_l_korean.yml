l_korean:
 GOH_CHOK_TONG_DESC: "고촉통은 1991년 총리로 처음 선출되었으며 여유 있는 과반을 확보하며 승리했습니다. 통의 총리 취임과 총리로서의 초기 시절에는 이례적인 일이 많았습니다. 고촉통은 1990년 후반 리콴유가 물러난 뒤 총리가 되었고, 곧바로 조기 총선을 소집했습니다. 이는 인민행동당의 압승으로 끝났고 고촉통이 새로운 위임을 확보하는 계기가 되었습니다.\n\n그러나 그는 전임자 리콴유만큼 두드러지는 인물은 아닙니다. 고촉통은 도시 안의 '작은 보헤미아'를 지지하는 정책으로 진전을 이루었습니다."
 SIN_government_of_singapore: "싱가포르의 연대 세력"
 SIN_government_of_singapore_desc: "[SIN.GetName] is at a crossroads. We sit at the mouth of one of the world's most profitable maritime routes. We are one of the world's foremost financial centres, and the mass expansion we have experienced in the past few decades is unprecedented globally. This has also brought about the interest of many forces abroad.\n"
 SIN_replace_centralized_education_system: "중앙 교육 시스템 도입"
 SIN_replace_centralized_education_system_desc: "중앙집권식 교육 제도는 좋은 약속이었습니다. 그 혜택을 계속 누리려면 이 정책을 복원하는 것이 불가피할 수 있습니다."
 SIN_repeal_centralized_education_system: "중앙 교육 시스템 폐지"
 SIN_repeal_centralized_education_system_desc: "교육 제도는 폐지되어야 합니다. 싱가포르에 걸맞지 않으며, 교육을 통제하는 것은 더 큰 공익을 저해할 뿐입니다."
 SIN_singaporean_foreign_aid_target_decisions: "[FROM.GetNameWithFlag]에 해외 원조 패키지 제공"
 SIN_singaporean_foreign_aid_target_decisions_desc: "[FROM.GetNameWithFlag]에 대한 대외 원조 패키지를 전달하면 관계가 개선되며, 어려움을 겪는 그들의 경제에도 도움이 될 것입니다."
 western_alignment_title: "§H서방파§!"
 neutral_alignment_title: "§H중립파§!"
 eastern_alignment_title: "§H동방파§!"
 western_clique_strength: "§C[?SIN.party_pop_array^1|%1]§!"
 eastern_clique_strength: "§C[?SIN.party_pop_array^7|%1]§!"
 neutral_clique_strength: "§C[?SIN.party_pop_array^13|%1]§!"
 SIN_western_pressure_tt: "[conservatism_L] 지지\n\n§C서방파§!는 미국 및 다른 서방 강대국들과의 협력을 지속할 것입니다."
 SIN_western_pressure_delayed_tt: "§Y전제 조건:§!\n[!western_pressure_click_enabled]\n§Y효과:§!\n[!western_pressure_click]"
 SIN_eastern_pressure_tt: "[Autocracy_L] 지지\n\n§G동방파§!는 중국과 러시아, 그리고 다른 주요 신흥국 관점 강대국과의 연대를 지속할 것입니다.\n"
 SIN_eastern_pressure_delayed_tt: "§Y전제 조건:§!\n[!eastern_pressure_click_enabled]\n§Y효과:§!\n[!eastern_pressure_click]"
 SIN_neutrality_pressure_tt: "[Neutral_Autocracy_L] 지지\n\n§R비동맹파§!는 외세의 개입 없이 ASEAN과 싱가포르의 지위에 집중합니다. 세 파벌 중 가장 거대합니다."
 SIN_fund_western_clique_tt: "Fund [conservatism_L]\n\nFunding [conservatism_L] is a surefire way to ensure they remain as the leading clique for our policy."
 SIN_fund_western_clique_delayed_tt: "§Y전제 조건:§!\n[!fund_western_clique_click_enabled]\n§Y효과:§!\n[!fund_western_clique_click]\n"
 SIN_fund_eastern_clique_tt: "Fund [Autocracy_L]\n\nFunding the [Autocracy_L] will allow us to pursue more aggressive policies. Perhaps sliding some funding their way is a way of encouraging their rise to power.\n"
 SIN_fund_eastern_clique_delayed_tt: "§Y전제 조건:§!\n[!fund_eastern_clique_click_enabled]\n§Y효과:§!\n[!fund_eastern_clique_click]\n"
 SIN_fund_neutral_clique_tt: "Fund [Neutral_Autocracy_L]\n\nMoving ourselves away from either clique will allow us to truly achieve self-governance.\n"
 SIN_fund_neutral_clique_delayed_tt: "§Y전제 조건:§!\n[!fund_neutral_clique_click_enabled]\n§Y효과:§!\n[!fund_neutral_clique_click]\n"
 SIN_applied_support_clique: "최근 파벌을 지지하지 않음 (남은 일수: [?SIN_applied_support_clique:days_left|Y0])"
 SIN_funded_a_clique_flag: "최근 파벌을 원조하지 않음 (남은 일수: [?SIN_funded_a_clique_flag:days_left|Y0])"
 singaporean_alignment_help_button_tt: "§Y싱가포르의 연대 도움말§!"
 SIN_government_help_tooltip_tt: "도움이 필요하면 클릭하세요!"
 SIN_expand_the_entreport_decision_categories: "Expand the Entrepot"
 SIN_expand_the_entreport_decision_categories_desc: "싱가포르는 세계에서 가장 중요한 항구 중 하나입니다. 이 도시는 수 세기 동안 동서 무역의 생명줄 위에 서 왔으며, 중계무역항의 화신이 되었습니다. 이를 확장하는 것이 싱가포르가 국가로서 계속 성장하는 길일지도 모릅니다.\n\n"
 SIN_facilitate_trade_expansion: "Facilitate Trade Expansion with [FROM.GetNameWithFlag]"
 SIN_facilitate_trade_expansion_desc: "[FROM.GetNameWithFlag]와(과)의 무역을 확대하면 양국 모두에 추가적인 이익과 번영이 찾아올 것입니다. 다른 나라들과의 무역을 계속 확대하면 우리의 영향력과 번영을 더욱 넓힐 수 있으며, 이어서 경제를 계속 성장시켜 아시아와 태평양에서 우리의 이익을 증진하는 데 도움이 될 것입니다."
 SIN_extend_finance_western_projects: "경제 계획 확장"
 SIN_extend_finance_western_projects_desc: "프로젝트에 대한 세제 혜택과 금융 혜택을 연장하는 것은 앞으로도 순이익이 될 것입니다."
 SIN_repeal_decentralization_protocol_decision: "분권화된 협약 폐지"
 SIN_repeal_decentralization_protocol_decision_desc: "최근 통과시킨 분권화 법령이 우리 정부가 유지하기에 너무 부담스러워졌습니다."
 SIN_enact_decentralization_protocol_decision: "분권화 협약 제정"
 SIN_enact_decentralization_protocol_decision_desc: "최근 폐지된 분권화 의정서가 여전히 안건에 남아 있습니다. 다시 시행해야 하겠습니까?"
 SIN_riau_islands_crisis_mission: "리아우 제도 위기"
 SIN_riau_islands_crisis_mission_desc: "리아우 제도를 둘러싼 최근의 대화가 격화되고 있습니다. 우리가 물러서지 않으면 전쟁이 발발할 가능성이 높습니다."
 SIN_repeal_the_migrant_worker_policy: "이민 노동자 정책 폐지"
 SIN_repeal_the_migrant_worker_policy_desc: "이주 노동자 정책을 폐지하면 우리나라 안에서 계속 커지는 분열 문제 일부를 완화하는 데 도움이 될 것입니다."
 SIN_entrepot_trade: "말라카의 수출입항 (Entrepôt)"
 SIN_entrepot_trade_desc: "식민지 시절부터 싱가포르의 지정학적 위치는 그들을 세계 무역의 중심지로 만들었습니다. 이들은 말라카의 해협에서 세계에서 가장 전략적으로 중요한 항로에 위치하고 있습니다. 우리가 동방과 서방 사이의 무역 흐름을 통제하면 할수록, 우리의 이윤은 더욱 늘어날 것입니다.\n"
 SIN_singaporean_bull: "싱가포르의 강세장"
 SIN_singaporean_bull_desc: "싱가포르 경제가 호황을 누리고 있습니다. 이 팽창을 계속 유지하는 것이 필수적입니다!\n\n결정을 통해 경제를 확장하고 이 변동치의 지속 시간을 늘릴 수 있습니다. 다만 이를 여러 번 반복하면 지나치게 공격적인 성장으로 인해 시장 붕괴가 일어날 수 있습니다.\n"
 SIN_precious_metal_trade_boom: "귀금속 무역"
 SIN_precious_metal_trade_boom_desc: "동아시아의 귀금속 무역은 싱가포르를 거쳐 흐릅니다. 이 금속의 흐름을 독점하면 큰 수익이 되며, 동아시아 무역의 중심지로서 우리의 입지를 강화해 줄 것입니다.\n"
 SIN_support_for_the_workers: "노동자에게 권력을"
 SIN_support_for_the_workers_desc: "노동자는 우리 경제에서 가장 중요한 톱니바퀴입니다. 정부가 국민을 돌보지 않는다는 비난은 터무니없습니다. 이러한 인식을 바꾸고 노동자들에게 힘을 실어 주어야 합니다!\n"
 SIN_support_for_the_business: "친기업 기조"
 SIN_support_for_the_business_desc: "싱가포르의 기업인들은 지원받아야 합니다. 기업과 사업에 힘을 실어 주는 것은 국가 전체의 경제 성장을 이끕니다."
 SIN_centralized_education_idea: "중앙집권식 교육 제도"
 SIN_centralized_education_idea_desc: "싱가포르의 교육 제도는 중앙집권적이며 집권 연합의 면밀한 감독을 받습니다. 이는 더 효과적인 교육 방식을 제공하지만 교육 비용을 천문학적으로 늘렸습니다."
 SIN_reeducation_idea: "재교육 캠페인"
 SIN_reeducation_idea_desc: "우리 군은 통제를 유지하고 있지만 여전히 저항 세력이 남아 있습니다. 재교육 캠페인을 시행할 때입니다."
 SIN_migrant_workers: "이주 노동자"
 SIN_migrant_workers_desc: "싱가포르를 거쳐 가는 노동자의 상당수는 이주 노동자입니다. 이들은 더 높은 싱가포르의 임금을 좇아 일하며 번 돈을 고국으로 보냅니다. 이는 현지 말레이계, 중국계, 인도계 주민들과, 현지 싱가포르인보다 이 노동력을 선호하는 기업주들 양쪽 모두에게 아픈 부분입니다."
 SIN_trade_influence_idea: "우리의 무역 영향력"
 SIN_trade_influence_idea_desc: "무역 영향력을 널리 행사할수록 국내에는 더 많은 자원이 돌아올 뿐입니다."
 SIN_global_investment_idea: "글로벌 투자"
 SIN_global_investment_idea_desc: "세계 각국의 펀드와 증권에 더 많이 투자하는 것이 우리를 계속 앞으로 나아가게 할 것입니다."
 SIN_defence_strategy_loc: "방어 전략"
 SIN_defence_strategy_loc_desc: "우리의 방어 전략은 가능한 한 오래 버티도록 짜여 있습니다."
 SIN_loose_censorship_idea: "경미한 검열법"
 SIN_medium_censorship_idea: "중간 수준의 검열법"
 SIN_harsh_censorship_idea: "가혹한 검열법"
 SIN_extreme_censorship_idea: "극단적 검열법"
 SIN_police_funding_expenditure: "경찰 예산 증액"
 SIN_police_funding_expenditure_desc: "경찰력에 더 투자하면 정치적 반체제 인사와 외국 첩자를 색출하는 데 도움이 됩니다."
 SIN_finance_western_projects_idea: "자금 지원 프로젝트"
 SIN_finance_western_projects_idea_desc: "서방 프로젝트에 대한 자금 지원이 늘어날수록 자체 투자도 늘어납니다."
 SIN_singaporean_special_treatment: "특별 대우"
 SIN_singaporean_special_treatment_desc: "정치적 지배에는 지속적인 노력이 필요합니다. 정치 활동 확대와 방어적 표류를 통해 인민행동당의 권력 장악을 강화하면 정부의 입지가 확고해집니다."
 SIN_anti_opposition_laws_idea: "반야당법"
 SIN_anti_opposition_laws_idea_desc: "야당을 억압하는 것은 안정된 통치를 유지하는 데 필수적입니다. 정치적 경쟁자에 대한 통제를 강화하면 권력이 공고해지고 국가를 불안정하게 하는 도전을 막을 수 있습니다."
 SIN_conservative_singapore_idea: "보수적 싱가포르"
 SIN_conservative_singapore_idea_desc: "안정은 진보의 토대입니다. 보수적인 통치 방식은 기존 정치 질서를 강화하고 싱가포르의 사회적 결속을 보호합니다."
 SIN_singaporean_identity_idea: "싱가포르 정체성"
 SIN_singaporean_identity_idea_desc: "통합된 국가 정체성은 외세의 영향력에 맞선 싱가포르의 가장 큰 방어책입니다. 싱가포르의 가치와 주권을 강화하면 사회적 결속과 회복력이 높아집니다."
 SIN_spy_agency_expansion_idea: "첩보 기관 확장"
 SIN_spy_agency_expansion_idea_desc: "첩보 기관과 그 역량을 확장하면 전 세계로 더 멀리 영향력을 투사할 수 있습니다."
 SIN_global_diplomacy_idea: "글로벌 외교"
 SIN_global_diplomacy_idea_desc: "외교 정책에 압력을 가하는 것이 국가가 나아갈 길입니다."
 SIN_economic_champion_idea: "경제 챔피언"
 SIN_economic_champion_idea_desc: "우리는 결코 큰 나라가 아닙니다. 그러나 우리의 경제력은 태평양과 인도양에서 우위를 차지하는 방향으로 우리를 이끌 것입니다."
 SIN_the_invasion_of_sumatra_idea: "수마트라 침공"
 SIN_the_invasion_of_sumatra_idea_desc: "수마트라는 말라카 해협 바로 건너편에 있습니다. 이 섬을 정복하여 우리나라에 영광을 가져올 때입니다."
 SIN_the_invasion_of_malaysia_idea: "말레이시아 침공"
 SIN_the_invasion_of_malaysia_idea_desc: "말레이시아 정부는 약하므로 타도되어야 합니다."
 SIN_expanded_freight_transport: "화물 운송 확대"
 SIN_expanded_freight_transport_desc: "화물 운송을 확대하면 추가 자금을 얻을 수 있을 것입니다."
 SIN_decentralize_the_government_idea: "정부 분권화"
 SIN_decentralize_the_government_idea_desc: "싱가포르의 본질은 영원히 고도로 중앙집권화된 국가일 것입니다."
 SIN_administrative_reforms_idea: "행정 개혁"
 SIN_administrative_reforms_idea_desc: "더 유능한 관료 조직은 효과적인 통치의 열쇠입니다. 행정 개혁은 국가의 효율성과 정부가 자신의 의제를 이행하는 능력을 높입니다."
 SIN_economic_reform_idea: "경제 개혁"
 SIN_economic_reform_idea_desc: "경제적 효율성이 국력을 이끕니다. 비용을 낮추고 생산성을 높이는 개혁은 싱가포르가 세계 시장에서 경쟁력을 유지하게 합니다."
 SIN_setting_our_sights_idea: "목표 설정"
 SIN_setting_our_sights_idea_desc: "싱가포르는 세계 무대에서 행동할 준비를 갖추어야 합니다. 군을 원정 작전에 대비시키고 병참상의 제약을 줄이면 국경 너머로 힘을 투사할 수 있습니다."
 SIN_liberties_for_stability_idea: "안정을 위한 자유"
 SIN_liberties_for_stability_idea_desc: "나라와 정부의 안정을 위해 시민적 자유의 일부를 내주는 것이 때로는 필요하다는 점은 분명합니다."
 SIN_singaporean_trade_strength: "무역에서 나오는 힘"
 SIN_singaporean_trade_strength_desc: "주요 무역 허브로서 싱가포르의 입지는 광범위한 무역망을 구축함으로써만 더욱 강화될 수 있습니다. 무역 협정을 추가로 체결하는 것은 나라가 번영하는 데 도움이 될 뿐입니다.\n\n§C힌트: 무역 협정을 추가로 체결하면 해외 영향력 변동치와 관료 비용이 증가합니다. 또한 관세로 추가 수입을 얻게 됩니다.§!\n"
 SIN_the_republic_tt: "§Y[SIN.GetNameWithFlag]§!은(는) 사실상의 일당 국가로 운영됩니다. 집권 정당인 인민행동당에 맞서는 대부분의 정당은 금지되었거나 선거 참여가 허용되지 않습니다. 일부는 선거 참여가 허용되지만 그 수는 극히 적습니다. 다양한 정치 이념의 실질적 내용은 인민행동당 내부의 파벌에서 나옵니다. 상대해야 할 주요 파벌은 세 개입니다.\n- [conservatism_L]\n- [Autocracy_L]\n- [Neutral_Autocracy_L]\n\n각 파벌은 저마다의 정책을 지지합니다. [conservatism_L]이(가) 이 셋 중 가장 두드러지며, 상황이 바뀌지 않는 한 체제 내 다수파 역할을 할 것입니다.\n"
 SIN_centralized_education_idea_tt: "§Y$education_budget$§!을(를) §Y$edu_03$§! 아래로 낮출 수 없습니다.\n"
 SIN_centralized_education_idea_trigger_tt: "§Y$SIN_centralized_education_idea$§!이(가) 시행되는 동안 §Y[SIN.GetNameWithFlag]§!은(는) §Y$education_budget$§!을(를) §Y$edu_03$§!보다 낮출 수 없습니다.\n"
 SIN_tariff_income_tt: "활발한 무역 협정 체결: [?SIN.signed_trade_agreements|Y0]\n관세 수입: $$[?SIN_tariff_income|+3]\n"
 SIN_singaporean_aid_tooltip: "다른 나라와 §Y무역 협정§!을 하나 체결할 때마다 그 나라 §Y국내총생산(GDP)§!의 §G5%§!에 해당하는 §Y대외 원조 패키지§!를 보낼 수 있습니다.\n\n현재 체결된 무역 협정: [?SIN.signed_trade_agreements|Y0]\n"
 SIN_decentralize_the_government_idea_trigger_tt: "§Y$SIN_decentralize_the_government_idea$§!이(가) 시행되는 동안 §Y[SIN.GetNameWithFlag]§!은(는) §Y$bureaucracy$§!을(를) §Y$bureau_03$§!보다 높일 수 없습니다.\n"
 SIN_decentralize_the_government_idea_tt: "§Y$bureaucracy$§!을(를) §Y$bureau_03$§! 위로 올릴 수 없습니다.\n"
 SIN_strength_of_trade_agreements_mechanic_tt: "§Y[SIN.GetNameWithFlag]§!은(는) 이 중점을 선택하는 즉시 §Y$SIN_singaporean_trade_strength$§! 메커니즘을 얻습니다. 다른 나라와 무역 협정을 더 많이 체결할수록 관세 수입이 $$§G0.075§! 십억의 비율로 늘어나고, 무역 협정이 늘어날수록 $foreign_influence_modifier$도 §G2%§!의 비율로 증가합니다. 반대로 $bureaucracy_cost_multiplier_modifier$ 또한 §R2%§!의 비율로 증가합니다.\n\n"
 SIN_encourage_migration_tt: "§Y외국인 노동자 폭동§!이 §R악화§!됩니다.\n"
 SIN_encourage_migration_worse_tt: "§Y외국인 노동자 폭동§!이 더욱 §R악화§!됩니다.\n"
 SIN_tiger_of_the_peninsula: "반도의 호랑이"
 SIN_tiger_of_the_peninsula_desc: "싱가포르는 아시아의 네 마리 호랑이 국가들 중 하나입니다. 앞으로 다가오는 미래에 우리는 반드시 이 경제적 위치를 유지해야만 합니다.\n"
 SIN_business_is_booming: "호황을 맞은 사업"
 SIN_business_is_booming_desc: "싱가포르의 사업이 호황을 누리고 있습니다! 시장의 흐름을 이어 가며 위대한 싱가포르의 호황을 유지해야 할 때입니다!"
 SIN_expand_the_entrepot: "중계무역항 확장"
 SIN_expand_the_entrepot_desc: "싱가포르는 고대부터 말라카 해협의 최남단 출구에 자리하여 아시아와 세계 나머지 지역을 잇는 무역의 거대한 중계항이자 중심 허브가 되었습니다. 우리의 핵심 경제적 이익을 지키기 위해 중계무역항을 계속 확장하는 것이 우리에게 최선입니다.\n"
 SIN_bankers_of_asia: "아시아의 은행가"
 SIN_bankers_of_asia_desc: "최근 몇 년간 싱가포르는 홍콩, 상하이, 도쿄에 필적하는 금융 허브가 되었습니다. 낮은 세금과 기업 유인책 덕분에 그 성장은 갈수록 빨라졌습니다. 우리는 아시아의 은행가라는 위상을 유지해야 합니다.\n"
 SIN_build_the_safety_net: "중앙적립기금 지원"
 SIN_build_the_safety_net_desc: "중앙적립기금(CPF)은 싱가포르 국민에게 추가적인 혜택을 제공하기 위한 대응책으로 만들어졌습니다. 이는 국가의 주된 복지 제도로 운영되어 젊은이, 빈곤층, 노인에게 혜택을 제공함으로써 이들의 삶의 질이 일정하게 유지되도록 합니다. 어쩌면 CPF에 추가 재원을 제공하는 것도 해볼 만한 사업일 것입니다."
 SIN_the_singaporean_bull: "싱가포르의 황소"
 SIN_the_singaporean_bull_desc: "글로벌 금융 위기 이후 지난 몇 해 동안의 우리의 성장은 인상적이었습니다. 강세장을 유지하고 싱가포르의 황소가 계속 먹이를 먹고 돌진하도록 해야 합니다.\n"
 SIN_mouth_of_malay: "말레이의 입구"
 SIN_mouth_of_malay_desc: "말라카 해협은 세계의 주요 해상 운송로 중 하나입니다. 이곳의 입지 덕분에 인도네시아 군도를 빠르게 통과할 수 있고, 선박이 인도양에서 태평양으로 향하는 동안 비교적 방해받지 않고 운항할 수 있습니다. 싱가포르는 해협의 입구에 자리하고 있으며 이 위치 덕분에 중계무역 사업을 확장할 수 있었고 지금도 성장을 촉진하고 키우는 데 도움이 되고 있습니다. 우리는 이 위치를 지키며 무역의 중심으로 남아야 합니다.\n"
 SIN_extreme_financing: "당 자금 모집"
 SIN_extreme_financing_desc: "인민행동당은 싱가포르의 모든 분야에 폭넓은 연줄을 가지고 있습니다. 호의나 이 나라에서의 더 큰 권리를 대가로 그 자원 일부를 동원해 자유롭게 쓸 수 있는 자금을 확보해야 합니다.\n"
 SIN_human_rights: "싱가포르의 인권"
 SIN_human_rights_desc: "싱가포르는 이 지역에서 민주주의와 자유의 등대이지만, 우리 제도에는 특히 노동자의 권리 분야에서 여전히 몇 가지 결함이 있습니다. 경제와 생활 수준이 발전함에 따라 국민의 권리와 시민적 자유 역시 발전해야 합니다."
 SIN_entice_foreign_investment: "해외 투자 유치"
 SIN_entice_foreign_investment_desc: "우리 경제는 무엇보다 세계 나머지 지역과의 무역 위에 세워졌으며, 이는 여전히 경제 안정의 핵심입니다. 그러나 지난 수십 년간 새로운 경제 강국이 부상한 만큼, 이제 세계의 어느 지역과 협력 관계를 확대할지 결정해야 합니다."
 SIN_continue_the_rise: "상승세 지속"
 SIN_continue_the_rise_desc: "최근의 경제 성장은 많은 새로운 혜택을 가져옵니다. 이 성장을 장려하고 더 오래 이어 가도록 하여 더욱 많은 혜택을 누려야 합니다!"
 SIN_labour_rights: "노동자의 권리"
 SIN_labour_rights_desc: "우리의 개혁에도 불구하고 노동자들은 여전히 기업에 의해 억압받고 있다고 느낍니다. 사업주들과 새로운 협약을 맺어 노동자에게 더 나은 근로 조건을 보장하고 국내 노동조합에 더 많은 자유를 주어야 합니다."
 SIN_eyeing_the_west: "서방을 주시하며"
 SIN_eyeing_the_west_desc: "미국과 유럽은 결국 자본주의와 자유의 등대입니다. 서방과 더 나은 관계를 확보하는 것은 우리에게 더 안정적이고 다양한 시장에 대한 접근을 보장합니다."
 SIN_sino_singaporean_discussion: "중국-싱가포르 협의"
 SIN_sino_singaporean_discussion_desc: "중국의 급속한 경제 발전은 중국을 우리 경제의 훌륭한 새 파트너로 만들며, 싱가포르에서 서방 열강의 영향력을 줄일 기회이기도 합니다. 아시아의 두 강국이 새 세기를 위한 새로운 우정을 맺을 때입니다."
 SIN_the_worker: "노동자에게 권력을"
 SIN_the_worker_desc: "이제 노동자 계급의 문화를 받아들이고 노동조합을 자유롭고 힘 있게 만들 때입니다. 새로운 노동법과 더 나은 근로 조건으로 우리 국민의 생산성은 높아질 것입니다."
 SIN_the_business: "기업 우대"
 SIN_the_business_desc: "노동자에게 더 나은 근로 조건과 미래에 대한 더 나은 보장을 주는 것은 필요하지만, 그들에게 너무 많은 경제적 권력을 주는 것은 위험합니다. 기업과 기업인들은 시장이 어떻게 돌아가는지, 그 안에서 어떻게 최대 이윤을 끌어내는지 압니다. 그들은 여전히 우리 경제 정책과 방향의 중추가 되어야 합니다."
 SIN_expand_the_maritime_industry: "해양 산업 확장"
 SIN_expand_the_maritime_industry_desc: "해상 무역 허브임에도 불구하고, 민간 선박과 군용 선박 모두에서 우리의 국내 조선 생산 능력은 부족합니다. 선박 생산을 늘리기 위해 새로운 조선소를 짓기 시작해야 합니다."
 SIN_expand_the_shipyards: "이스턴 퍼시픽 해운 강화"
 SIN_expand_the_shipyards_desc: "혁신과 탁월함에 대한 헌신에 힘입어, 우리는 단지 우리의 입지를 강화하는 데 그치지 않고 해운의 미래를 새로 빚어내고 있습니다. 우리의 전략적 비전은 머스크 같은 업계 거인에 맞서는 세계적 선두 주자가 되도록 우리를 이끕니다. 우리는 최첨단 기술에 투자하고, 운영을 최적화하며, 전 세계로 영역을 넓혀 비할 데 없는 서비스와 효율성을 제공하고 있습니다. 이스턴 퍼시픽 해운이 업계 표준을 세우는 미래를 향한 항해에 함께하십시오."
 SIN_machinery_improvements: "싱가포르 기계 회사 투자"
 SIN_machinery_improvements_desc: "산업 기계 산업을 확장하면 산업 단지를 계속 가동하고 수익을 내는 데 도움이 됩니다. 또한 이 제품을 지역 내 산업화가 덜 된 나라들에 수출할 기회도 얻게 됩니다."
 SIN_precious_metal_trade: "데구사 무역"
 SIN_precious_metal_trade_desc: "데구사 골트한델 GmbH는 독일 데구사 은행의 무역 부문입니다. 이들을 초청해 싱가포르에 새로운 영업 거점을 세우게 하면 우리의 금 채굴 사업을 시작하는 데 그들의 도움을 받을 수 있습니다."
 SIN_port_of_singapore: "물류 수송선단 증강"
 SIN_port_of_singapore_desc: "이스턴 퍼시픽 해운은 단순한 해운 회사가 아니라 업계를 재편하는 힘입니다. 우리는 기반시설을 강화하고, 선단을 확대하며, 운영을 최적화하여 세계적 선두 주자가 되려 합니다. 우리의 비전은 분명합니다. 업계 거인들에 필적하고 세계 해운의 탁월함에 새로운 표준을 세우는 것입니다."
 SIN_restrict_the_market: "시장 제한"
 SIN_restrict_the_market_desc: "자유 시장과 낮은 세금을 유지해 온 우리의 오랜 방식에 반하는 일이기는 하지만, 국내 산업이 시장에서 경쟁하고 살아남을 기회를 얻도록 외국 금속 및 건설 회사에 일정한 제한과 규제가 필요합니다."
 SIN_total_defence: "총체적 방위"
 SIN_total_defence_desc: "총체적 방위는 싱가포르의 포괄적 방위 전략의 명칭입니다. 총체적 방위 체계는 싱가포르 사회의 여섯 가지 핵심 축, 즉 군사, 민간, 경제, 사회, 심리, 디지털 방위를 아우릅니다. 이 전체적인 전략은 1980년대와 1990년대에 효과적임이 입증되었습니다."
 SIN_st_kinetics_investments: "ST 키네틱스"
 SIN_st_kinetics_investments_desc: "ST 엔지니어링은 소총과 기관단총에서 장갑 수송차와 보병 전투차에 이르기까지 우리 육군에 공급하는 싱가포르 방위군의 유일한 국내 공급업체입니다. 이 회사의 제조 공장 규모를 확장하면 더 많은 국산 장비를 더 짧은 시간에 군에 공급할 수 있습니다."
 SIN_city_defenses: "도시 방어"
 SIN_city_defenses_desc: "우리나라는 면적이 매우 작기 때문에 영토 한 뼘 한 뼘을 지키는 것이 우리에게 극히 중요한 문제입니다. 잠재적인 적이 수도에 이르기 전에 그 진격을 저지할 더 나은 기회를 얻으려면 나라 전역에 새로운 방어선을 구축해야 합니다."
 SIN_singaporean_armor: "싱가포르 기갑"
 SIN_singaporean_armor_desc: "우리 군이 기술적으로 부족한 몇 안 되는 분야 중 하나가 기갑전입니다. 우리는 현대적인 외국 전차 모델을 도입해 연구하고, 결국 실전 배치에 적합한 국산 주력 전차를 개발해야 합니다."
 SIN_outsourced_military_industry: "군수 산업 외주"
 SIN_outsourced_military_industry_desc: "우리나라의 크기와 적은 인구 때문에 군수 산업 역량에는 한계가 있습니다. 따라서 다른 나라에 생산 라인을 두거나, 외국 생산업체가 돈을 받고 자신들의 산업 역량 일부를 우리에게 제공하도록 할 수 있습니다."
 SIN_shorad_anti_air: "단거리 대공 방어 체계"
 SIN_shorad_anti_air_desc: "단거리 대공 방어(SHORAD) 체계는 우리 병사와 산업 역량을 노리는 저고도 항공기에 효과적입니다. 더 가볍지만 더 빠른 적 폭격기에 대해 더 큰 전술적 우위를 얻으려면 새로운 대공 포대를 도입해야 합니다."
 SIN_mechanized_combined_arms: "기계화 합동 병종"
 SIN_mechanized_combined_arms_desc: "합동 병종 교리를 채택한 이래 우리는 대부분의 일반 보병을 기계화 보병으로 전환했습니다. 새로운 전차 모델이 개발됨에 따라, 전차를 더 잘 따라가고 전장에 도착하는 우리 병사들을 더 잘 보호하도록 새로운 장갑 전투 차량 모델도 개발해야 합니다."
 SIN_expanded_military_research: "군사 연구 확대"
 SIN_expanded_military_research_desc: "군과 산업 역량이 확대됨에 따라, 우리 군이 최고의 기술 발전을 따라가도록 연구 개발 센터도 확대해야 합니다."
 SIN_arms_exporter: "무기 수출국"
 SIN_arms_exporter_desc: "국내 군수 산업이 확대되면 현대 장비의 잉여분이 생기며, 이를 다른 나라에 수출하여 수익을 얻을 수 있습니다."
 SIN_defensive_force: "방어적 군대"
 SIN_defensive_force_desc: "우리 군의 주된 목표는 하나, 조국을 지키는 것입니다. 따라서 우리 고위 지휘부와 초급 장교들은 더 나은 방어 전략을 구사하도록 훈련받아야 합니다."
 SIN_entrenched_singapore: "참호를 갖춘 도시국가"
 SIN_entrenched_singapore_desc: "나라의 방어선에 필요한 2단계 확장으로, 첫 방어선을 잃은 뒤에도 우리가 여전히 기회를 가질 수 있도록 합니다."
 SIN_punching_above_our_weight: "체급을 뛰어넘는 힘"
 SIN_punching_above_our_weight_desc: "첫눈에 외국인들은 싱가포르가 약하고 적의 침략에 취약하다고 생각할 수 있지만, 우리의 영광스러운 군대가 움직이는 모습을 보면 놀랄 것입니다. 조국이여 영원하라!"
 SIN_sinister_ideas: "불온한 생각"
 SIN_sinister_ideas_desc: "군은 더 많은 것을 얻기 위해 가장자리를 파고들고 있습니다. 정부는 약하며, 거드름 피우는 외교관들과 관료들이 하지 못하는 일에서 군이 우리를 이끌 수 있습니다."
 SIN_a_new_march: "새로운 행군"
 SIN_a_new_march_desc: "정부에 충성하는 군대가 수도 주변에 일종의 방어선을 구축하기 시작했습니다. 힘겨운 시기입니다."
 SIN_military_politicians: "군인 정치인"
 SIN_military_politicians_desc: "쿠데타가 성공했습니다. 장성단이 정부의 핵심 직위에 앉기 시작했습니다."
 SIN_propaganda_campaigns: "선전 캠페인"
 SIN_propaganda_campaigns_desc: "국민은 여전히 자신들이 대표권을 누릴 자격이 있다는 생각을 버리지 않았습니다. 대표권은 병역을 통해 얻는 것입니다. 이를 그들의 얄팍한 머리에 주입하십시오."
 SIN_reeducation: "재교육된 싱가포르"
 SIN_reeducation_desc: "싱가포르의 새로운 군사 정권으로의 전환이 마무리되었습니다. 쿠데타는 정리되었고, 이제 위대한 전진의 행군을 새로 시작할 때입니다."
 SIN_the_republic: "\"공화국\""
 SIN_the_republic_desc: "The Republic of Singapore was established in 1965 during the decolonization of the British Empire. It was formerly a part of the Federation of Malaysia but split apart to become the modern-day nation of Singapore. Its ruling party the People's Action Party has remained firmly in control over the nation's government for the past forty years as it has effectively established itself as a one-party state."
 SIN_centralized_education: "중앙집권식 교육"
 SIN_centralized_education_desc: "싱가포르의 교육은 대부분 정부 차원에서 이루어지지만 소규모의 지역 선택권도 일부 존재합니다. 이 다면적인 제도를 없애면 우리 국민의 교육이 어떤 모습이어야 하는지를 더 효과적으로 선택할 충분한 기회가 생길 것입니다."
 SIN_decentralize_the_government: "분권화 의정서"
 SIN_decentralize_the_government_desc: "방위군에 집중하고 싱가포르 방위군에 자금을 쏟아붓는 것은 언제나 안전한 선택입니다. 이는 우리 국경과 해역을 우리를 해치려는 자들로부터 안전하게 지켜 줄 것입니다."
 SIN_reinforce_the_state: "국가 강화"
 SIN_reinforce_the_state_desc: "국가를 강화하는 것은 행정 개혁을 통과시키기 위한 첫걸음입니다."
 SIN_reform_the_monetary_system: "통화 제도 개혁"
 SIN_reform_the_monetary_system_desc: "싱가포르의 통화 제도를 개혁하면 더 큰 경제 발전이 가능해질 것입니다."
 SIN_military_budget_amendment: "국방 예산 개정"
 SIN_military_budget_amendment_desc: "국방 예산을 늘리면 우리 군과 동남아시아에서의 입지를 한층 더 개선할 수 있을 것입니다."
 SIN_faith_in_the_establishment: "체제에 대한 신뢰"
 SIN_faith_in_the_establishment_desc: "국민은 우리 정부를 신뢰합니다. 그 신뢰를 계속 활용하여 싱가포르 국민을 위해 옳은 일을 하는 것이 무엇보다 중요합니다."
 SIN_administrative_reforms: "행정 개혁"
 SIN_administrative_reforms_desc: "관료적 형식주의를 없애고 행정 절차를 최적화하면 정부의 성과가 개선될 것입니다."
 SIN_economic_equality: "경제적 평등"
 SIN_economic_equality_desc: "우리 국민에게 경제적 평등을 제공하는 것은 필수입니다."
 SIN_the_status_quo: "선거의 정체"
 SIN_the_status_quo_desc: "싱가포르의 선거 과정은 정체되어 있습니다. 인민행동당은 계속해서 나라를 철권으로 틀어쥐고 있습니다."
 SIN_electoral_reform: "절차 개혁"
 SIN_electoral_reform_desc: "우리의 선거 절차는 조작되어 있으며, 더 많은 제3당 인사를 의회에 들이는 것이 새로운 내일을 향한 과정의 시작이 될 것입니다."
 SIN_defence_strategy: "방어 전략"
 SIN_defence_strategy_desc: "단순한 문제입니다. 방어가 우리의 최우선 과제입니다."
 SIN_conservative_singapore: "보수적 싱가포르"
 SIN_conservative_singapore_desc: "진보는 허울입니다. 싱가포르는 보수주의로 나아갈 때 가장 좋은 모습입니다."
 SIN_anti_corruption_measures: "반부패 조치"
 SIN_anti_corruption_measures_desc: "나라의 부패를 줄이는 것은 국민과 국가에 영구적인 이익이 될 것입니다."
 SIN_fair_and_free: "공정하고 자유롭게"
 SIN_fair_and_free_desc: "선거가 공정하고 자유롭도록 보장하는 것이 새로운 싱가포르의 열쇠입니다."
 SIN_support_the_opposition: "야당 지원"
 SIN_support_the_opposition_desc: "직관에 반하게 들리겠지만, 정부에 맞서는 야당을 지원하는 것은 앞으로 나아가기 위한 결정적인 디딤돌입니다."
 SIN_expand_the_total_defence_strategy: "총체적 방위 전략 확대"
 SIN_expand_the_total_defence_strategy_desc: "총체적 방위 전략은 수립 이후 수십 년간 우리에게 완벽하게 기여했습니다. 이 전략을 확대하는 것은 우리가 할 수 있는 최선의 일 중 하나입니다."
 SIN_maintain_singapore: "우리의 싱가포르 유지"
 SIN_maintain_singapore_desc: "안정은 끊임없이 바뀌는 새 정부를 내놓는 것보다 훨씬 더 진보적입니다."
 SIN_increase_police_funding: "경찰 예산 증액"
 SIN_increase_police_funding_desc: "우리가 도시국가인 만큼 경찰력은 정부 내에서 가장 중요한 조직 중 하나입니다. 경찰에 투자하고 배정된 예산을 늘리는 것은 결국 모든 국민에게 도움이 됩니다."
 SIN_encourage_the_multi_party_system: "다당제 장려"
 SIN_encourage_the_multi_party_system_desc: "소수 정당에 대한 제약을 풀고 정부에 대한 더 큰 참여를 장려하는 것이 바로 나아갈 길입니다."
 SIN_liberalization: "자유화"
 SIN_liberalization_desc: "정치 영역의 자유화는 선택지 중 하나입니다."
 SIN_autocracy_for_democracy: "민주주의를 위한 전제주의"
 SIN_autocracy_for_democracy_desc: "전제주의야말로 민주주의를 위한 가장 완벽한 수단입니다."
 SIN_new_singapore: "새로운 싱가포르"
 SIN_new_singapore_desc: "싱가포르의 선거 장벽을 낮추는 것이 새로운 싱가포르의 첫걸음입니다."
 SIN_impose_harder_censorship: "가혹한 검열 시행"
 SIN_impose_harder_censorship_desc: "적절성 심사를 거치지 않은 어떤 매체도 싱가포르에서 유통되지 않을 것입니다. 더 가혹한 검열에는 대가가 따르지만 안정이 무엇보다 우선입니다."
 SIN_greater_control: "더 큰 통제"
 SIN_greater_control_desc: "국민과 그들의 삶에 대해 점점 더 큰 통제력을 행사하는 것이 앞으로 나아가는 길입니다."
 SIN_liberties_for_stability: "안정을 위한 자유"
 SIN_liberties_for_stability_desc: "국가의 안정을 위해 국민이 자유를 조금쯤 양보할 수 있지 않겠습니까?"
 SIN_expand_freedom_of_press: "언론의 자유 확대"
 SIN_expand_freedom_of_press_desc: "나라의 언론 자유는 우리의 전제주의적 과거에서 벗어나기 위해 필수입니다."
 SIN_grant_lgbtq_rights: "성소수자 권리 수용"
 SIN_grant_lgbtq_rights_desc: "싱가포르는 역사적으로 성소수자에 대한 엄격한 법을 유지해 왔습니다. 이러한 법을 현대화하면 인권이 개선되고 싱가포르가 국제 기준에 부합하게 될 것입니다."
 SIN_address_human_rights: "인권 침해 문제 해결"
 SIN_address_human_rights_desc: "사회적 화합을 유지하고 국제적 의무를 이행하려면 이주 노동자와 저소득층 공동체 사이의 인권 침해 문제를 해결해야 합니다."
 SIN_the_alignment: "싱가포르의 노선"
 SIN_the_alignment_desc: "우리 당의 노선이 결국 우리의 미래를 결정할 것입니다."
 SIN_western_identity: "서방 정체성"
 SIN_western_identity_desc: "더 서방 중심적인 정책과 대외 외교를 추구하면 중국의 손아귀와 동방 블록의 영향력을 피할 수 있습니다. 올바른 길을 걷기 위해서는 이 논리를 계속 밀어붙이는 것이 필수입니다."
 SIN_singapore_alone: "Singapore Alone"
 SIN_singapore_alone_desc: "싱가포로는 역사적으로 친서방 이념에 대해 중립적인 태도를 지속적으로 유지해왔습니다. 우리가 계속해서 이런 입장을 취한다면 동남아시아에서 우리의 입장을 강력하게 유지할 수 있을 겁니다."
 SIN_strength_in_asia: "아시아의 강자"
 SIN_strength_in_asia_desc: "외교 정책을 수정할 때입니다. 스스로를 최전선에 내세우는 것이 승리를 확보해 줄 것입니다. 싱가포르는 새로운 아시아의 강자가 될 것입니다. 새로운 위치를 찾는 낙담한 이들을 위한 지도자가 될 것입니다."
 SIN_soften_citizenship: "시민권 요건 완화"
 SIN_soften_citizenship_desc: "싱가포르의 시민권 요건은 통과하기 어렵기로 악명이 높습니다. 이 요건을 완화하면 인구가 계속 더욱 늘어날 것입니다."
 SIN_allow_foreign_media: "외국 언론 허용"
 SIN_allow_foreign_media_desc: "외국 언론이 싱가포르에서 완전히 금지된 적은 없습니다. 그러나 엄격한 규제를 준수해야 하며, 이로 인해 일부 사이트가 싱가포르에서 접근이 차단되는 문제가 있습니다. 이 가혹한 규제 중 일부를 완화하면 더 많은 매체가 도시국가 안에서 허용되고 노출될 수 있습니다."
 SIN_strength_in_straits: "해협에서의 힘"
 SIN_strength_in_straits_desc: "말라카 해협에 걸터앉은 싱가포르의 전략적 위치는 도시국가에 세계 무역 흐름에 대한 독특한 영향력을 부여합니다. 이 위치를 최대한의 잠재력까지 활용하는 것이 우리의 장기적 안보와 번영의 열쇠입니다."
 SIN_nationalize_foreign_companies: "외국 기업 국유화"
 SIN_nationalize_foreign_companies_desc: "국내의 외국 기업들은 정부의 더 강력한 손길 없이는 영업하기에 적합하지 않습니다. 이 기업들을 국유화하고 이들의 업무에 대한 전적인 통제권을 확보해야 합니다."
 SIN_return_from_flawed_democracy: "결함 있는 민주주의에서의 복귀"
 SIN_return_from_flawed_democracy_desc: "싱가포르가 결함 있는 민주주의에서 벗어날 때입니다. 국민은 자신이 지지하는 정당에 투표할 권리를 누릴 자격이 있습니다."
 SIN_finance_western_projects: "서방 프로젝트 자금 지원"
 SIN_finance_western_projects_desc: "서방 국가들이 우리나라에 구축할 프로젝트와 구상을 제안하고 있습니다. 그러나 이 프로젝트의 자금을 대는 책임은 우리에게 있습니다."
 SIN_singaporean_identity: "싱가포르 정체성"
 SIN_singaporean_identity_desc: "싱가포르의 정체성은 분명합니다. 우리의 정체성이 사라지지 않도록 하는 것이 중요합니다."
 SIN_befriend_the_sco: "상하이협력기구와 친교"
 SIN_befriend_the_sco_desc: "상하이협력기구 회원국들과 친교를 맺는 것은 매우 유익할 것입니다."
 SIN_anti_opposition_laws: "반야당법"
 SIN_anti_opposition_laws_desc: "어떤 대가를 치르더라도 야당이 집권하지 못하도록 보장하는 법을 통과시키는 것이 필수입니다."
 SIN_european_democracy: "유럽식 민주주의"
 SIN_european_democracy_desc: "유럽식 민주주의를 받아들이면 더 많은 정당이 우리 의회에 대표를 두게 될 것입니다."
 SIN_greater_ties_with_europe: "유럽과의 유대 강화"
 SIN_greater_ties_with_europe_desc: "유로존 및 유럽과의 더 깊은 유대는 우리에게 더 큰 번영과 힘을 가져다줄 것입니다. 런던보다 더 강한 금융 부문이 되고자 한다면 이를 더욱 밀어붙여야 합니다."
 SIN_the_pap: "인민행동당"
 SIN_the_pap_desc: "인민행동당은 작은 도시국가의 지배 정당입니다. 당의 지배를 확고히 하면 우리 도시의 안정을 얻고 유지할 수 있습니다."
 SIN_the_chinese_media_model: "중국식 언론 모델"
 SIN_the_chinese_media_model_desc: "중국의 방식을 본받을 때입니다. 중국식 언론 모델을 이곳 싱가포르에 시행할 때입니다."
 SIN_harsher_state: "더 가혹한 국가"
 SIN_harsher_state_desc: "인민행동당과 군에 맞서는 모든 정당을 금지하면 안정된 체제가 보장될 것입니다."
 SIN_global_initiative: "글로벌 구상"
 SIN_global_initiative_desc: "나라가 새로운 글로벌 구상에 나설 때입니다. 싱가포르여 영원하라."
 SIN_singapore_on_the_rise: "떠오르는 싱가포르"
 SIN_singapore_on_the_rise_desc: "소프트 파워는 해외에서 우리의 힘과 영향력을 행사하는 새로운 방식입니다."
 SIN_pressure_the_south_asian_seas: "남아시아 해역 압박"
 SIN_pressure_the_south_asian_seas_desc: "싱가포르 군은 싸움을 간절히 원하고 있습니다. 새로운 싱가포르 제국이 성장하고 팽창할 것입니다."
 SIN_operation_enticement: "유인 작전"
 SIN_operation_enticement_desc: "우월한 정보기관을 활용하여 여러 나라가 우리의 정치 이념에 더 가까워지도록 유인할 수 있습니다."
 SIN_political_maneuvering: "정치적 책략"
 SIN_political_maneuvering_desc: "정치적 책략과 영합은 어떤 대화에서든 원하는 것을 얻어 내는 훌륭한 방법입니다."
 SIN_demand_special_treatment: "경제 우선순위"
 SIN_demand_special_treatment_desc: "이 도시에서는 경제가 전부입니다. 번영을 유지하지 못한다면 우리가 마땅히 누릴 위대함에 결코 도달하지 못할 것입니다."
 SIN_economic_champion: "경제 챔피언"
 SIN_economic_champion_desc: "싱가포르의 경제력은 나라의 크기를 훨씬 뛰어넘습니다. 무역 지배력과 금융 감각을 활용하여 도시국가는 동남아시아 최고의 경제 강국이 되는 것을 목표로 합니다."
 SIN_demand_malaysian_concessions: "군사력 수여"
 SIN_demand_malaysian_concessions_desc: "군과 군사 기반시설에 투자하면 더 큰 팽창주의가 가능해질 것입니다."
 SIN_the_archipelago: "군도"
 SIN_the_archipelago_desc: "리아우 제도는 차지하기에 무르익었습니다. 인도네시아인들은 이 섬들을 계속 보유하는 것이 그들에게 이롭다는 사실을 단지 모를 뿐입니다."
 SIN_prioritize_diplomacy: "외교 우선"
 SIN_prioritize_diplomacy_desc: "갈등보다 외교를 우선시하는 것은 필수입니다. 이는 해외에서 우리의 영향력을 밀어붙여 싱가포르의 우위를 각인시키는 수단입니다."
 SIN_condemn_aggression: "공격적인 행위 규탄"
 SIN_condemn_aggression_desc: "다른 나라를 괴롭히는 어떤 국가 행위자의 침략이든 규탄하는 것이 이제 공식 정책입니다."
 SIN_require_unfair_treaties: "동남아시아 은행"
 SIN_require_unfair_treaties_desc: "다른 나라들의 자산을 보유하는 것은 우리에게 힘을 실어 줄 뿐입니다."
 SIN_nationalistic_rise: "민족주의의 부상"
 SIN_nationalistic_rise_desc: "우리 해안에 밀려드는 밀물이 이상한 것을 싣고 오기 시작합니다. 나라 안의 민족주의가 정치의 전면에 나서기 시작했습니다. 싱가포르의 거리에서 새로운 함성이 들리기 시작합니다."
 SIN_seize_the_peninsula: "반도 장악"
 SIN_seize_the_peninsula_desc: "말레이 반도를 침공하면 자원 지원과 팽창할 수 있는 수많은 다양한 기회를 얻게 됩니다. 반도를 장악하는 것이 위대함을 향한 첫걸음입니다."
 SIN_invade_sumatra: "수마트라 침공"
 SIN_invade_sumatra_desc: "수마트라에는 온갖 종류의 자원이 풍부하고 인구도 많습니다. 그들은 자카르타보다 우리 정부에 더 가깝습니다. 섬을 점령하고 인도네시아에 대한 앞으로의 정복을 준비하십시오."
 SIN_singapore_for_peace: "평화를 위한 싱가포르"
 SIN_singapore_for_peace_desc: "전쟁은 무익한 노력입니다. 싱가포르는 오직 세상에 영원한 평화를 이루기를 추구합니다."
 SIN_economic_empire: "경제 제국"
 SIN_economic_empire_desc: "우리의 제국은 일어서겠지만 통상적인 의미에서는 아닙니다. 나라는 전국에 걸쳐 경제적 지배의 제국을 건설하기 시작할 것입니다."
 SIN_set_our_sights: "목표 설정"
 SIN_set_our_sights_desc: "추가 정복과 팽창주의를 모색하는 데 목표를 둘 때입니다. 시선을 해외로 향하십시오."
 SIN_restrict_migration: "이주 노동자 제한"
 SIN_restrict_migration_desc: "이주 노동자의 입국을 제한하면 그 일자리를 국민에게 돌릴 수 있습니다."
 SIN_encourage_migration: "이주 장려"
 SIN_encourage_migration_desc: "이주 노동자는 우리 건설과 노동의 중추입니다. 이러한 이주를 장려하는 것이 필수입니다."
 SIN_singaporeans_first: "싱가포르인 우선"
 SIN_singaporeans_first_desc: "싱가포르 국민이 무엇보다 최우선입니다."
 SIN_restrictive_citizenship: "이주 노동자 종식"
 SIN_restrictive_citizenship_desc: "이주 노동자를 더욱 제한하고 현지 인구에 더 의존하는 데 계속 집중할 수 있을 것입니다."
 SIN_import_cheap_labour: "저임금 노동력 수입"
 SIN_import_cheap_labour_desc: "싱가포르의 노동력은 이주 노동자를 들여오는 것보다 훨씬 비쌉니다. 이주 노동자는 훨씬 적은 비용으로 더 많은 일을 해내고 유지할 수 있습니다."
 SIN_singapore_south_east_asia: "동남아시아의 무역 허브"
 SIN_singapore_south_east_asia_desc: "싱가포르는 동서양 사이의 주요 금융 및 무역 항구입니다. 필수적인 말라카 해협에 자리한 만큼, 더 많은 무역이 싱가포르를 거치도록 하는 것은 싱가포르 자신과 주변 국가들에게 번영만을 가져다줄 것입니다."
 SIN_asean_commentary: "아세안 논평"
 SIN_asean_commentary_desc: "아세안 회원국들과의 대화는 더 큰 공익에 기여할 뿐입니다. 이들을 위한 더 많은 지원을 준비하면 지역 협력과 연합 내 싱가포르의 입지가 강화될 것입니다."
 SIN_expand_trade_with_india: "인도와의 무역 확대"
 SIN_expand_trade_with_india_desc: "인도는 남아시아 지역에서 가장 큰 상품 수입국이자 수출국 중 하나입니다. 인도와 적절히 배분된 무역로를 확보하면 더 많은 수입과 이윤을 거둘 수 있습니다."
 SIN_south_asian_countries: "남아시아 국가들"
 SIN_south_asian_countries_desc: "다른 남아시아 국가들과의 관계를 개선하면 우리의 경제력이 성장할 수 있습니다."
 SIN_influence_the_members: "회원국에 영향력 행사"
 SIN_influence_the_members_desc: "친싱가포르 선전물을 준비해 아세안 회원국들 사이에 퍼뜨리면 우리가 선두를 유지할 수 있을 것입니다."
 SIN_trade_with_sri_lanka: "스리랑카와의 무역"
 SIN_trade_with_sri_lanka_desc: "스리랑카와 싱가포르의 무역은 전체 무역 협정 가운데 작은 갈래이지만, 싱가포르에서 스리랑카로 가는 무역은 그럼에도 수익성이 높습니다."
 SIN_singaporean_foreign_aid: "싱가포르 대외 원조"
 SIN_singaporean_foreign_aid_desc: "무역 협정을 맺은 나라들을 위한 대외 원조 패키지를 준비하는 것은 우리 친구와 동맹의 네트워크에 이로울 뿐입니다."
 SIN_madagascan_trade_routes: "마다가스카르 무역로"
 SIN_madagascan_trade_routes_desc: "싱가포르와 마다가스카르는 식민지 시절에도 수년간 역사적으로 우호적인 관계를 유지해 왔습니다. 오늘날 양국은 건전하고 수익성 있는 무역 관계를 맺고 있습니다."
 SIN_the_philippines: "필리핀"
 SIN_the_philippines_desc: "싱가포르의 최대 무역 상대국 중 하나인 필리핀과 싱가포르는 많은 분야에서 협력을 누립니다. 아세안에서 서로에게 재정적, 정치적 지원을 제공합니다."
 SIN_demand_asean_concessions: "아세안에 양보 요구"
 SIN_demand_asean_concessions_desc: "싱가포르가 마땅히 대접받아야 할 나라로 대접받을 때입니다. 양보와 특별 대우를 요구하는 것이 우리의 의지가 일어서는 길입니다."
 SIN_control_the_straits: "해협 장악"
 SIN_control_the_straits_desc: "해협에서 우리의 힘을 밀어붙이고 해협을 장악하는 것이 영광으로 가는 길입니다."
 SIN_global_free_trade: "세계 자유 무역"
 SIN_global_free_trade_desc: "이웃 나라들과의 개선된 무역 관계와 정치적 접근은 더 많은 무역을 뜻하며, 이는 결국 우리에게 더 많은 돈을 뜻합니다."
 SIN_dictate_trade_agreements: "무역 협정 주도"
 SIN_dictate_trade_agreements_desc: "무역 협정을 작성하는 것은 싱가포르가 될 것입니다."
 SIN_strong_arm_the_asean: "아세안에 강압 행사"
 SIN_strong_arm_the_asean_desc: "아세안의 팔을 더욱 뒤로 꺾는 것은 연합 내에서 싱가포르의 입지를 더욱 확고하게 보장합니다."
 SIN_japanese_free_trade_agreement: "일본 자유무역협정"
 SIN_japanese_free_trade_agreement_desc: "일본과 무역 협정을 체결하는 것은 전략적으로 중요합니다."
 SIN_usa_singaporean_agreements: "미국-싱가포르 협정"
 SIN_usa_singaporean_agreements_desc: "미국과 싱가포르는 과거에 무역 및 금융 협정을 포함해 여러 무역 협정을 체결했습니다."
 SIN_singaporean_trade_influence: "싱가포르 무역 영향력"
 SIN_singaporean_trade_influence_desc: "무역 영향력을 확대하는 것은 우리의 경제력을 공고히 하는 확실한 방법입니다."
 SIN_pressure_the_japanese: "일본 자산 국유화"
 SIN_pressure_the_japanese_desc: "일본은 우리나라 안에 상당한 자산을 가지고 있습니다. 그 자산을 몰수해 정부 아래에 두면 우리 나라를 제대로 운영할 수 있습니다."
 SIN_global_investment: "글로벌 투자"
 SIN_global_investment_desc: "글로벌 투자를 많이 추진할수록 우리 경제는 더 강해집니다. 이 길을 유지하고 해외에 더 깊은 투자를 밀어붙인다면 이익이 갈수록 늘어나는 것을 보게 될 것입니다."
 SIN_regional_investment: "확대된 글로벌 투자"
 SIN_regional_investment_desc: "새로운 투자 계획들은 수익을 냈습니다. 더 많은 투자를 추구하는 것은 도시에 이익이 될 뿐입니다."
 SIN_expand_foreign_reserve: "외환 보유고 확대"
 SIN_expand_foreign_reserve_desc: "해외 금고가 다소 비어 있으므로, 국민으로부터 더 많은 자금을 끌어내 보유고를 확대하는 것이 국가에 도움이 될 것입니다."
 singapore.0.t: "동남아시아의 호랑이"
 singapore.0.d: "우리는 동남아시아에서 지리적으로 가장 중요한 위치 중 한 곳에 자리하고 있습니다. 무역이 우리를 통해 자유롭게 흐르며, 우리는 점차 세계 최대의 금융 중심지 중 하나로 성장했습니다. 이제 싱가포르가 그 이름에 걸맞게 살아가며 마땅히 되어야 할 호랑이가 될 때입니다!"
 singapore.0.a: "그들이 우리의 포효를 듣게 될 것이다"
 singapore.3.t: "새로운 싱가포르의 행군"
 singapore.3.d: "우리 군이 도시의 거리를 행진하며 각계각층의 지지를 규합하고 있습니다. 장갑차와 중무장한 군 부대들이 의회 건물 밖에 배치되었습니다. 의회 건물 앞에 모인 군중 사이로 고무적인 연설이 울려 퍼졌습니다. 병력 일부가 건물 문을 통과해 들어서자 환호와 야유가 뒤섞였습니다. 군은 의회 건물을 돌아다니며 정치인과 관료들을 억류했습니다.\n\n새 정부는 어떻게 나아가야 합니까? 군은 인민행동당이 새 정부와 결탁하도록 허용해야 합니까?"
 singapore.3.a: "군이 권력을 장악한다"
 singapore.3.b: "인민행동당과의 결탁"
 singapore.4.t: "싱가포르 군의 행군"
 singapore.4.d1: "싱가포르 군이 도시국가를 장악했으며, 이제 나머지 정부와 저항 세력에 대한 완전한 통제권을 신속히 확보하고 있습니다. [SIN.GetLeader]이(가) 이제 도시에 대한 정부의 완전한 통제권을 쥐고 있습니다."
 singapore.4.d2: "인민행동당 일부 파벌과 군의 결탁으로 싱가포르의 정권 교체가 가능해졌습니다. 군과 인민행동당의 소수 파벌이 의회를 장악했으며 이제 정부를 구성할 준비를 하고 있습니다."
 singapore.4.a: "싱가포르의 새로운 행보"
 singapore.5.t: "싱가포르, [627.GetName] 요구"
 singapore.5.d: "리아우 제도는 싱가포르 해안 바로 앞에 있는 섬들의 연쇄입니다. 이곳에는 싱가포르가 빠르게 바닥나고 있는 천연자원과 건축 부지가 있습니다. 그러나 이 섬들은 수 세기 동안 우리의 것이었던 곳입니다. 이 전략적으로 중요한 섬 연쇄를 양보해야 합니까?"
 singapore.5.a: "섬을 양보한다"
 singapore.5.b: "요구를 거부한다"
 singapore.6.t: "섬을 양보한 인도네시아"
 singapore.6.d: "인도네시아가 [627.GetName]을(를) 우리에게 양보했습니다. 이는 싱가포르와 싱가포르 국민에게 큰 승리입니다."
 singapore.6.a: "환상적이다"
 singapore.7.t: "양보를 거부한 인도네시아"
 singapore.7.d: "인도네시아가 섬 연쇄의 양보를 거부했습니다. 우리는 물러서거나 사태를 확대할 수 있습니다."
 singapore.7.a: "리아우 제도 위기가 시작된다"
 singapore.8.t: "주인이 바뀌는 리아우 제도"
 singapore.8.d: "인도네시아가 싱가포르 정부에 섬들을 양보했습니다."
 singapore.8.a: "흥미로운 전개로군."
 singapore.9.t: "리아우 제도 위기의 시작"
 singapore.9.d: "인도네시아가 싱가포르 정부의 요구를 거절했습니다. 동남아시아에 드리운 이 위협에서 정확히 무슨 일이 벌어질지는 시간이 말해 줄 것입니다."
 singapore.9.a: "걱정스럽다"
 singapore.101.t: "싱가포르항공 006편"
 singapore.101.d: "몇 시간 전, 싱가포르항공 006편이 추락하여 탑승객 179명 중 81명이 사망했습니다. 대만 당국자들이 타이베이 현장에서 사고 원인을 조사하고 남은 생존자들의 구조 작업을 수행하고 있습니다."
 singapore.101.a: "항공사를 조사한다"
 singapore.101.b: "누가 신경 쓰나?"
 singapore.101.c: "희생자들에게 구호 기금을 보낸다"
 singapore.101.e: "공항 복구를 위해 대만에 자금을 보낸다"
 singapore.102.t: "싱가포르 주재 대사관 공격 음모"
 singapore.102.d: "싱가포르 경찰이 미국, 영국, 오스트레일리아, 이스라엘 대사관을 폭파하려는 제마 이슬라미야의 음모를 적발했습니다. 이 음모는 몇 주 전 한 정보원의 제보를 토대로 발각되었습니다. 이 공격 음모와 관련하여 15명이 체포되었습니다."
 singapore.102.a: "조직을 처형한다"
 singapore.102.b: "종신형"
 singapore.103.t: "페드라 브랑카 분쟁"
 singapore.103.d: "페드라 브랑카는 말레이시아 영해 안에 있는 작은 화강암 바위섬으로, 싱가포르가 관리하는 등대가 서 있습니다. 이 섬의 주권을 둘러싼 사소한 분쟁과 논의는 90년대에 국제사법재판소 소송으로 이어졌습니다. 거의 10년이 지나, 여러 차례의 논의와 법정 심리를 거쳐 페드라 브랑카 분쟁이 마침내 마무리되고 있습니다. 페드라 브랑카의 등대와 섬은 확고히 싱가포르에 속합니다."
 singapore.103.a: "외교의 영광스러운 날"
 singapore.104.t: "열대성 폭풍 바메이"
 singapore.104.d: "열대성 폭풍 바메이가 도시를 가로질러 지나갔습니다. 도시의 사회기반시설은 대체로 영향을 받지 않았으나, 공항에는 경미한 피해가 있었고 항공 관제에 차질이 생겼습니다."
 singapore.104.d1: "폭풍 바메이가 말레이 반도를 휩쓸고 지나갔습니다. 쿠알라룸푸르에서 몇 킬로미터 떨어진 싱가포르 인접 지역 곳곳이 홍수와 쓰러진 나무로 피해를 입었습니다."
 singapore.104.a: "피해를 복구한다"
 singapore.104.b: "추가 구호를 시행한다"
 singapore.105.t: "에스플러네이드 극장"
 singapore.105.d: "오늘은 에스플러네이드 극장이 성대하게 문을 여는 날입니다. 이곳은 1,600석 규모의 콘서트홀과 공연 예술을 위한 2,000석 규모의 극장으로 이루어져 있습니다. 에스플러네이드는 도시의 문화 발전을 도모하기 위해 문화예술부가 건립을 의뢰했습니다."
 singapore.105.a: "극장을 방문한다"
 singapore.105.b: "행사를 몇 개 계획한다"
 singapore.106.t: "사스 바이러스 발병"
 singapore.106.d: "비교적 새로운 질병이 지난 한 주 동안 우리 병원들을 뚫고 들어왔습니다. 사스 바이러스가 탄톡셍 병원에서 발병하여 수백 명에게 퍼졌습니다. 이 바이러스는 발병 직후 신속히 억제되어 영향이 최소화되었습니다. 억제되기 전까지 여러 명의 사망자가 발생했습니다."
 singapore.106.a: "병원에 자금을 지원한다"
 singapore.106.b: "봉쇄를 시작한다"
 singapore.106.c: "마스크는 패배자들이나 쓰는 것"
 singapore.107.t: "바이오폴리스 연구 센터 개소"
 singapore.107.d: "바이오폴리스는 원노스 부오나 비스타에 문을 연 생물의학 연구 개발 센터입니다. 이곳은 싱가포르 국립대학교 및 다른 주요 연구 개발 센터들과 매우 가깝습니다. 이 캠퍼스는 도시의 생물의학 연구 개발 활동을 위한 공간을 제공하는 데 전념합니다."
 singapore.107.a: "과학에 멋진 날"
 singapore.107.b: "연구 센터에 보조금을 더 지급한다"
 singapore.108.t: "사임하는 고촉통"
 singapore.108.d: "고촉통이 총리직에서 물러나 지도자의 직분을 리셴룽에게 넘기기로 결정했습니다. 리셴룽은 전 총리 리콴유의 아들이며 직업 정치인입니다. 고촉통에서 리셴룽으로의 권력 이양은 싱가포르 통치에 새로운 선례를 세울 것입니다."
 singapore.108.a: "위대한 지도자가 물러나다"
 singapore.109.t: "니콜 고속도로 붕괴"
 singapore.109.d: "오늘 일찍 MRT 노선을 위한 터널이 붕괴하는 건설 사고가 발생했습니다. 터널의 지지 구조물이 무너져 니콜 고속도로의 6개 차선에 걸쳐 피해가 번졌습니다. 이 붕괴로 사망자 4명과 비치명적 부상자 3명이 보고되었습니다."
 singapore.109.a: "건설사를 조사한다"
 singapore.109.b: "아무것도 하지 않는다"
 singapore.109.c: "유족에게 자금을 지급하고 감독을 강화한다"
 singapore.110.t: "마리나 베이 수상 무대"
 singapore.110.d: "마리나 베이 수상 무대가 올해 도시의 스포츠 행사와 기타 행사를 개최하기 위해 공식 개장했습니다. 원래는 임시로 의도된 시설이었지만 점차 상설 시설이 되어 가는 것으로 보입니다."
 singapore.110.a: "수상 무대 예산을 삭감한다"
 singapore.110.b: "추가 행사를 후원한다"
 singapore.110.c: "문화 만세!"
 singapore.111.t: "아프리카인 두 명 처형"
 singapore.111.d: "아프리카인 두 명이 마약 밀수 혐의로 처형 대기 중입니다. 관용을 호소하는 국제 사회의 탄원은 침묵으로 응답받았고, 싱가포르는 도시에 마약을 들여오는 자들을 처형한다는 정책을 이어 갔습니다. 이는 도시에 존재하는 권위주의의 또 다른 표명입니다. 이 두 사람에게 관용을 베풀어야 합니까?"
 singapore.111.a: "관용을 베푼다"
 singapore.111.b: "법은 법이다"
 singapore.112.t: "싱가포르 그랑프리"
 singapore.112.d: "싱가포르 그랑프리는 1973년 포뮬러 리브르 경주 이후 개최된 적이 없습니다. 올해 그랑프리가 싱가포르 도시로 돌아왔습니다. 싱가포르 관광청은 그랑프리를 계속 열고 싱가포르를 F1 경주의 순환 일정에 복귀시키기 위해 5년 계약을 체결하기로 결정했습니다."
 singapore.112.a: "F1은 범죄와 마약을 불러온다."
 singapore.112.b: "훌륭하다! 도시에 행사가 더 많아진다!"
 singapore.113.t: "마스 슬라맛 카스타리 탈주"
 singapore.113.d: "제마 이슬라미야 싱가포르 지부의 우두머리로 지목된 마스 슬라맛 카스타리가 오늘 휘틀리 로드 구치소에서 탈주했습니다. 실제 탈주 경위는 미궁에 싸여 있습니다. 당시 카스타리의 가족이 면회를 와 있었고, 그는 화장실에 가겠다고 요청했습니다. 그는 간수들에게서 달아나 결국 탈출했습니다. 구르카 부대, 경찰, 군 모두 그를 찾지 못했습니다."
 singapore.113.a: "경찰의 실패"
 singapore.114.t: "자치 50주년"
 singapore.114.d: "1965년, 싱가포르는 말레이시아 연방에서 분리되었습니다. 올해로 분리된 지 50년이 되었으며, 싱가포르는 이제 반세기의 자치를 기념할 수 있게 되었습니다. 싱가포르와 전 세계 모든 소국에게 멋진 날입니다."
 singapore.114.a: "사자의 도시는 여전히 강하다"
 singapore.115.t: "시티 하베스트 교회 사건"
 singapore.115.d: "시티 하베스트 교회 사건은 21세기 초 이래 싱가포르 최대의 형사상 신탁 위반 사건입니다. 창립자 콩 히는 핵심 교회 지도자들의 도움을 받아 약 5천만 싱가포르 달러를 횡령한 혐의로 유죄 판결을 받았습니다. 약 2천4백만 달러는 그의 아내의 팝 음악 경력에 자금을 대기 위해 가짜 채권에 투자되었습니다. 이 자금 유용으로 수많은 사람이 체포되었고 사기 및 회계 위조로 유죄 판결을 받았습니다."
 singapore.115.a: "한몫 챙기러 개입한다"
 singapore.115.b: "정의의 날"
 singapore.116.t: "앨런 셰이드레이크 유죄 판결"
 singapore.116.d: "앨런 셰이드레이크는 싱가포르 사법 제도를 비방한 혐의로 법정모독죄 유죄 판결을 받은 영국인 작가입니다. 그가 펴낸 '싱가포르 정의, 피고석에 서다'는 싱가포르 사법 제도를 공격하고 비판했습니다. 국제적으로는 앨런을 석방해야 한다는 의견이 보편적으로 받아들여지고 있습니다. 어떻게 대응해야 합니까?"
 singapore.116.a: "앨런을 석방한다"
 singapore.116.b: "더 가혹한 처벌을 내린다"
 singapore.116.c: "배심원단의 판단에 따른다"
 singapore.117.t: "중국인 버스 기사 파업"
 singapore.117.d: "25년 만에 처음으로 벌어진 파업으로 인종 간 긴장이 오늘 정점에 달했습니다. 이민자 출신 중국인 버스 기사들이 말레이시아인 및 싱가포르인 동료들과 비교한 차별에 맞서 싸우고 있습니다. 그들은 동료들보다 30퍼센트 적은 급여를 받는다고 주장합니다. 이 영향으로 도시의 대중교통이 마비되고 많은 싱가포르인에게 순손실을 입히고 있습니다."
 singapore.117.a: "구르카를 투입한다"
 singapore.117.b: "지원금을 지급한다"
 singapore.117.c: "아무것도 하지 않는다"
 singapore.118.t: "리틀 인디아 폭동"
 singapore.118.d: "이 폭동은 싱가포르 리틀 인디아의 레이스 코스 로드와 햄프셔 로드 교차로에서 발생한 치명적인 사고 이후 시작되었습니다. 특수작전사령부와 구르카 부대 소속 경찰관들이 폭동 진압을 위해 투입되었습니다. 더 강경하게 대응해야 합니까, 아니면 평소대로 파견을 진행하도록 두어야 합니까?"
 singapore.118.a: "군이 투입된다"
 singapore.118.b: "경찰의 치명적 무력 사용을 허용한다"
 singapore.118.c: "아무것도 하지 않는다"
 singapore.119.t: "외국인 노동자 폭동"
 singapore.119.d: "이주 노동자에 대한 시민권 요건을 완화하겠다는 정부의 선택은 막중한 대가를 불러왔습니다. 싱가포르인들이 정부에 맞서 더 격렬한 파업과 폭동을 시작했습니다. 우리는 어떻게 대응해야 합니까?"
 singapore.119.a: "내 행동의 결과다"
 singapore.120.t: "반이주 노동자 시위"
 singapore.120.d: "정부는 이주 노동자의 시민권 요건에 대한 제한을 완화하여 도시의 인구를 늘리는 새 계획을 내놓았습니다. 이는 이론상 도시국가로의 이주를 늘리겠지만, 싱가포르에서 태어난 국민에게 부담을 줄 수 있습니다. 수천 명이 거리로 나와 평화적으로 시위했습니다. 우리의 입장에서 물러서야 합니까?"
 singapore.120.a: "한 걸음 물러선다"
 singapore.120.b: "계속 이 길을 간다"
 singapore.121.t: "중앙적립기금 명예훼손"
 singapore.121.d: "싱가포르 총리 [SIN.GetLeader]이(가) 블로거 로이 응엥을 그의 비판을 이유로 고소했습니다. 도시가 온라인 비평가를 상대로 법적 소송을 제기한 것은 이번이 처음입니다. 이 블로그는 중앙적립기금(CPF) 자금 운용 방식과 관련해 [SIN.GetLeader]에게 부정이 있다고 암시했습니다. CPF는 싱가포르 도시의 중앙 퇴직 저축 제도로 모든 사람이 의무적으로 가입해야 합니다. 비평가를 억눌러야 합니까, 아니면 글을 올리도록 두어야 합니까?"
 singapore.121.a: "글을 올리도록 둔다"
 singapore.121.b: "투옥한다"
 singapore.122.t: "MRT 노선 건설"
 singapore.122.d: "MRT 노선은 기존 이스트 웨스트 선의 혼잡을 완화하기 위해 제안된 대용량 화물 노선으로, 싱가포르 동부 해안의 창이에서 시작될 예정입니다. 이 노선은 파시르 리스, 호강, 앙모키오 등 주요 동부 도시를 지나갑니다. 노선은 길이 50킬로미터로 계획되었으며 2030년에 개통될 예정입니다. 도시는 대략 570억 달러의 비용을 부담하게 됩니다. 그러나 이 노선은 물자 처리량 증가로 800억 달러 이상의 순이익을 낼 것입니다."
 singapore.122.a: "사업을 거부한다"
 singapore.122.b: "사업을 승인한다"
 singapore.123.t: "리콴유의 서거"
 singapore.123.d: "싱가포르의 초대 총리 리콴유가 오늘 서거했습니다. 리콴유는 거의 한 달간 투병한 중증 폐렴으로 별세했습니다. [SIN.GetLeader]이(가) 이 상실을 설명하는 공식 발표를 내놓았습니다. 앞으로 몇 주 안에 국가가 비용을 부담하는 장례식이 준비되기 시작합니다. 도시 곳곳에서 수천 명이 장례식에 참석할 것으로 예상됩니다."
 singapore.123.a: "싱가포르의 영웅"
 singapore.124.t: "제마 이슬라미야 용의자 무장 세력"
 singapore.124.d: "테러 조직 제마 이슬라미야의 용의자 15명이 오늘 체포되었습니다. 이들은 무기와 현금 등 다수의 물품을 소지하고 있었으며, 싱가포르 정부를 겨냥한 모종의 공격을 준비 중이었던 것으로 보입니다. 어떻게 처리하시겠습니까?"
 singapore.124.a: "처형한다"
 singapore.124.b: "종신형에 처한다"
 singapore.125.t: "금서 축소"
 singapore.125.d: "싱가포르는 뜻밖에도 금서로 지정된 출판물을 257권에서 17권으로 줄이기로 결정했습니다. 이번 변경으로 일부 공산주의 및 성인 주제 도서가 허용되지만, 여호와의 증인 출판물에 대한 금지는 유지됩니다. 해제 대상 도서에는 \\"패니 힐\\"이나 \\"대장정\\" 등이 포함되어 있습니다."
 singapore.125.a: "모두 해제한다"
 singapore.125.b: "의회의 판단이 옳다"
 singapore.126.t: "방글라데시 남성 8명 체포"
 singapore.126.d: "내무부는 오늘 방글라데시 남성 8명을 체포했습니다. 이들은 방글라데시 정부를 전복시킬 목적으로 방글라데시에서 테러 공격을 감행하려던 방글라데시 이슬람 국가(ISB)와 연루된 혐의를 받고 있습니다. 싱가포르를 공격할 계획은 없었던 것으로 확인되었습니다."
 singapore.126.a: "사형을 선고한다"
 singapore.126.b: "방글라데시로 송환한다"
 singapore.127.t: "할리마 야콥 반대 시위"
 singapore.127.d: "최근 대통령 선거 이후 싱가포르 시민들이 거리로 나섰습니다. 할리마 야콥은 단독 후보로 출마하여 당선되었고, 이에 시민들은 그가 부패한 상황 속에서 권력을 잡았다고 믿고 있습니다. 다른 대통령 후보 4명이 신청했으나 모두 탈락했습니다. 이 도시국가에서 당국의 권력이 너무 오랫동안 견제받지 않고 행사되고 있다는 불만입니다."
 singapore.127.a: "근거 없는 주장이다"
 singapore.127.b: "선거 부정 여부를 조사한다"
 singapore_alignment_help.0.t: "싱가포르의 연대 도움말"
 singapore_alignment_help.0.d: "The Singaporean Alignment mechanic is intended to simulate the divide between the three different cliques within the £SIN_conservatism People's Action Party (PAP). The interactions below allow you to sway the alignment of the party. A different alignment will allow you to make unique decisions and event choices throughout your gameplay as Singapore. The scripted GUI itself has tooltips explaining what each of the actions do."
 singapore_alignment_help.0.a: "알겠다"
 singapore_elections.0.t: "[GetYear]년 선거 종료"
 singapore_elections.0.desc: "위대한 도시국가 싱가포르에 또 한 해가 지나고 또 한 번의 선거가 치러졌습니다."
 singapore_elections.0.a: "친서방 파벌이 승리했다"
 singapore_elections.0.b: "신흥국 파벌이 승리했다"
 singapore_elections.0.c: "비동맹 파벌이 승리했다"
 singapore_elections.0.d: "선거 종료"
 SIN_the_arms_export_idea: "무기 수출국"
 SIN_the_arms_export_idea_desc: "싱가포르는 세계 최대 무기 수출국이자 군수품 생산국 중 하나입니다. 이 나라는 군사 생산에서 거의 완전한 자급자족을 이루고 있으며, 따라서 그 잉여분을 전 세계 다른 나라들에 수출합니다."
 singapore.119.b: "이주법을 폐지한다"
 SIN_bankers_of_asia_idea_1: "동남아시아의 은행가"
 SIN_bankers_of_asia_idea_1_desc: "싱가포르는 동남아시아 은행 부문의 주요 강자이며, 따라서 우리는 이를 활용해야 합니다."
 SIN_energy_efforts: "에너지 대책"
 SIN_energy_efforts_desc: "우리 도시의 미래는 가장 중요한 기반시설의 안전성 위에서 번영합니다. 에너지는 우리가 해결하고 확보해야 하는 그런 문제 중 하나이며, 그래야 우리 아이들의 아이들이 결코 걱정하지 않아도 됩니다."
 SIN_fossil_power_plants: "화석 연료 발전소 확장"
 SIN_fossil_power_plants_desc: "도시의 화석 연료 발전소를 확장하면 우리가 직면할 수 있는 연이은 문제 일부를 상쇄하는 데 도움이 될 것입니다."
 SIN_fossil_fuel_efficiency: "발전소 효율 개선"
 SIN_fossil_fuel_efficiency_desc: "화석 연료 발전소의 효율을 개선하는 것은 한정된 우리의 자원에 매우 유익할 수 있습니다."
 SIN_reinforce_our_infrastructure: "전력 기반시설 보강"
 SIN_reinforce_our_infrastructure_desc: "전력 기반시설을 보강하면 우리의 전력망이 결코 고장 나지 않도록 하는 데 도움이 될 수 있습니다."
 SIN_nuclear_reactor: "최초의 원자로"
 SIN_nuclear_reactor_desc: "원자력 발전 건설의 가치를 인정하는 나라로 자리매김할 때입니다."
 LEE_HSIEN_LOONG_DESC: "현 싱가포르 총리인 리셴룽은 2004년 취임한 이래 국가의 궤적을 형성하는 데 중추적인 역할을 해 왔습니다. 인민행동당(PAP)의 핵심 인사인 그의 지도력은 경제 다변화, 기술 혁신, 사회 결속에 대한 집중으로 특징지어집니다. 그는 중요한 사회기반시설 개발을 총괄하여 금융, 기술, 무역의 글로벌 허브로서 싱가포르의 입지를 강화했습니다. 그의 행정부는 또한 장기적 지속 가능성을 우선시하여 기후 변화에 대응하고 사회적 포용을 증진했습니다. 리셴룽이 강조한 실용적 정책과 싱가포르의 안정을 유지하겠다는 의지는 복잡한 지역적, 세계적 도전을 헤쳐 나가는 데 핵심적이었습니다. 그는 21세기의 복잡성 속에서 경제 성장, 사회 진보, 국가 안보에 초점을 맞추며 계속해서 싱가포르를 이끌고 있습니다. 싱가포르 지도자로서의 유산은 아직 쓰이고 있는 중이지만, 국가의 경제적, 사회적 발전에 대한 그의 공헌은 부인할 수 없습니다."
 LAWRENCE_WONG_DESC: "최신 총리인 로런스 웡입니다. 그의 지도력은 경제 성장과 사회적 복지의 균형을 맞추는 실용적인 통치 방식으로 특징지어집니다. 그는 기술 혁신이 싱가포르를 새로운 높이로 끌어올릴 잠재력을 지녔음을 인식하고 이를 옹호합니다. 웡의 관심은 경제를 넘어 확장되며, 그는 사회 화합과 포용을 우선시하여 모든 싱가포르인이 국가의 진보로부터 혜택을 받도록 합니다. 그의 정책은 지속 가능한 발전에 대한 의지를 반영하며, 이는 앞으로 여러 세대에 걸친 싱가포르의 번영을 보장합니다. 그는 협력을 장려하며 국내외에서 강력한 파트너십을 구축합니다. 웡의 비전은 핵심 가치를 지키면서도 변화를 받아들이는 회복력 있고 번영하는 싱가포르입니다. 그의 지도력은 신뢰를 불러일으키며 싱가포르를 역동적인 세계 속 안정과 진보의 등대로 자리매김시킵니다. 그는 사회적 이동성의 옹호자로서 모두에게 기회를 보장합니다. 그의 명확한 소통 방식은 투명성과 신뢰를 키우며, 더 밝은 미래라는 공통의 비전 아래 국민을 하나로 묶습니다. 그의 지도 아래 싱가포르는 국가 생활의 모든 측면에서 혁신을 포용하고 탁월함을 추구하며 글로벌 리더로서의 여정을 이어 갑니다. 그는 지속 가능한 성장과 영속적인 번영의 미래로 싱가포르를 인도하는 선견지명 있는 지도자입니다."
 SIN_education_efforts: "교육 노력"
 SIN_education_efforts_desc: "싱가포르의 교육 제도는 엄격한 기준과 혁신 중시로 명성이 높은 세계적 선도 사례입니다. 유아 교육부터 고등 교육 기관에 이르기까지, 이 제도는 고도로 숙련되고 적응력 높은 인력을 육성하는 것을 우선시합니다. 사회기반시설과 교사 양성에 대한 지속적인 투자는 제도가 혁신의 최전선에 남아 21세기 경제의 변화하는 요구에 적응하도록 보장합니다. 이러한 총체적 접근 덕분에 싱가포르는 교육적 우수성의 최전선을 유지하며 전 세계에서 꾸준히 최상위 순위를 기록하고 있습니다."
 gateway_to_asia: "아시아의 관문"
 gateway_to_asia_desc: "말라카 해협에 자리한 도시국가의 전략적 입지는 이 나라의 세계적 영향력을 가늠하게 합니다. 동서를 오가는 무역이 이 중요한 길목을 지나가며, 수천 개의 기업이 이 도시에 지역 본부를 두고 있습니다.\n\n기업 친화적인 환경과 탁월한 입지 덕분에 싱가포르는 자기 체급을 훨씬 뛰어넘는 존재감을 발휘합니다."
 SIN_lee_kuan_yew_legacy: "리콴유의 유산"
 SIN_lee_kuan_yew_legacy_desc: "리콴유의 선견지명 있는 지도력은 싱가포르를 현대 국가로 탈바꿈시켰습니다. 그는 실용적인 경제 정책으로 유례없는 성장을 이끌었고 싱가포르를 세계적인 금융 허브로 자리매김시켰습니다. 사회 복지에 대한 그의 헌신은 적정 가격의 주택과 양질의 의료를 보장하는 한편 강한 국가 정체성을 길렀습니다. 교육과 기술에 대한 전략적 투자는 고도로 숙련된 인력을 길러 내 싱가포르의 기술 발전을 이끌었습니다. 리콴유의 유산은 그의 탁월한 기획력과 국가 건설에 대한 변치 않는 헌신의 증거로 남아, 싱가포르의 발전과 번영에 지울 수 없는 흔적을 남겼습니다."
 SIN_temasek_holdings: "테마섹 홀딩스"
 SIN_temasek_holdings_desc: "테마섹 홀딩스(프라이빗) 리미티드는 싱가포르 국영 다국적 투자 회사입니다. 1974년 6월 25일에 설립되었으며, 장기 포트폴리오 구성의 네 가지 핵심 구조적 추세인 디지털화, 지속 가능한 생활, 소비의 미래, 수명 연장에 따라 적극적인 주주 및 투자자로서 활동합니다. 테마섹의 다양한 포트폴리오는 여러 부문에 걸쳐 있으며, 특히 소비재, 미디어 및 기술, 생명과학 및 농식품, 비은행 금융 서비스에 중점을 둡니다."
 SIN_reform_singapore_urban_redevelopment_authority_idea: "싱가포르 도시재개발청"
 SIN_reform_singapore_urban_redevelopment_authority_idea_desc: "도시재개발청(URA)은 싱가포르를 활기찬 현대적 대도시로 탈바꿈시키는 데 핵심적인 역할을 해 왔습니다. 핵심 정부 기관으로서 URA는 도서 국가 전역의 토지 이용 계획, 개발 전략, 지속 가능한 성장에 대해 막강한 권한을 행사합니다. 그 포괄적인 권한은 간척지를 번성하는 공동체로 전략적으로 개발하는 일을 포함한 토지 관리의 모든 측면에 걸쳐 있습니다. 지속 가능성과 지역사회 참여에 대한 헌신을 통해 URA는 싱가포르의 눈부신 도시적 성공 신화를 계속 이끌고 있습니다."
 SIN_singapore_masterplan_idea: "싱가포르 마스터플랜"
 SIN_singapore_masterplan_idea_desc: "싱가포르 마스터플랜의 영향력은 세계적 수준의 대중교통망에서 푸르른 녹지 공간에 이르기까지 도시국가의 도시 경관 구석구석에 스며 있습니다. 이 포괄적인 청사진은 싱가포르의 지속 가능한 발전의 초석이 되어 토지 이용, 사회기반시설, 도시 설계에 관한 전략적 결정을 이끕니다. 미래 지향적인 접근을 통해 마스터플랜은 싱가포르가 도시적 우수성의 세계적 본보기이자 앞으로의 세대에게도 활기차고 살기 좋은 도시로 남도록 보장합니다."
 gateway_to_asia_income: "추가 수입: $$§G[?gateway_to_asia_income|+3]§!, 세계 GDP에 비례하여 증가"
 temasek_dividend_income: "테마섹 배당 수입: $§G0.250§!"
 singapore_military: "싱가포르 군"
 singapore_military_desc: "싱가포르 군은 강력한 해군, 기술적으로 앞선 육군, 능숙한 공군을 결합한 막강한 방위군입니다. 국가 정보기관들은 국가 안보를 지키는 핵심적인 전략적 통찰을 제공합니다. 우주 기반 위성 기술에 대한 전략적 투자는 감시 및 통신 능력을 더욱 강화하여 싱가포르의 방위 범위를 미래로 확장합니다. 이 포괄적이고 기술적으로 정교한 군대는 갈수록 복잡해지는 지정학적 환경 속에서도 국가의 주권과 안보를 보장합니다."
 SIN_unlocks_balance_of_power_tt: "§Y세력 균형§! 메커니즘 $SIN_power_balance$을(를) 잠금 해제합니다.\n"
 SIN_renewable_energy: "재생 에너지 대책"
 SIN_renewable_energy_desc: "미래 지향적인 접근으로 유명한 나라 싱가포르는 재생 에너지 분야에서 상당한 진전을 이루고 있습니다. 에너지 수요를 충족하고 기후 변화를 완화해야 하는 이중 과제에 직면한 도서 국가는 다변화된 에너지 구성을 적극적으로 추구하고 있습니다. 대규모 태양광 발전소와 옥상 설치가 갈수록 흔해지면서 태양광이 선두에 서 있습니다. 정부는 연구 개발에 막대하게 투자하며 수상 태양광 패널과 에너지 저장 솔루션 같은 혁신 기술을 탐색하고 있습니다. 태양광 외에도 싱가포르는 지열 에너지를 비롯한 다른 재생 에너지원을 조사하고, 수력 자원을 활용하기 위한 지역 협력을 모색하고 있습니다. 과제가 남아 있지만, 야심 찬 재생 에너지 목표와 앞으로의 세대를 위해 더 깨끗하고 푸른 미래를 만들겠다는 헌신에서 싱가포르의 지속 가능성에 대한 의지가 분명히 드러납니다. 이 의지는 단지 세계적 압력에 대한 대응이 아니라 싱가포르의 장기적인 경제 및 환경 안보를 위한 전략적 필수 과제입니다."
 SIN_aapowerlink: "오스트레일리아-아시아 전력 연결망"
 SIN_aapowerlink_desc: "오스트레일리아-아시아 전력 연결망(AAPowerLink)은 세계 최대의 태양광 발전소, 세계 최대의 배터리, 세계 최장의 해저 전력 케이블을 포함하도록 계획된 전력 기반시설 사업 제안입니다. 초기 계획은 오스트레일리아 노던 준주에 새로 지을 태양광 발전소가 최대 20기가와트의 전력을 생산할 것으로 예측했으며, 그 대부분은 4,300km(2,700마일) 길이의 3GW 고압 직류 송전선을 통해 싱가포르에, 이후에는 인도네시아에도 수출될 예정이었습니다. 대형 배터리는 하루 동안 일조량이 달라지는 데 따른 전력 공급 편차를 평준화하기 위해 에너지를 저장합니다. AAPowerLink는 오스트레일리아 기업 선 케이블이 개발했으며, 초기에는 앤드루 포레스트와 마이크 캐넌브룩스가 후원했습니다."
 SIN_EDU_education_effort: "교육 노력"
 SIN_EDU_education_effort_desc: "싱가포르의 교육 제도는 엄격한 기준과 혁신 중시로 명성이 높은 세계적 선도 사례입니다. 유아 교육부터 고등 교육 기관에 이르기까지, 이 제도는 고도로 숙련되고 적응력 높은 인력을 육성하는 것을 우선시합니다. 사회기반시설과 교사 양성에 대한 지속적인 투자는 제도가 혁신의 최전선에 남아 21세기 경제의 변화하는 요구에 적응하도록 보장합니다. 이러한 총체적 접근 덕분에 싱가포르는 교육적 우수성의 최전선을 유지하며 전 세계에서 꾸준히 최상위 순위를 기록하고 있습니다."
 SIN_EDU_nanyang_technological_university: "난양 공과대학교(NTU)"
 SIN_EDU_nanyang_technological_university_desc: "난양 공과대학교(NTU)는 최첨단 연구와 탄탄한 산학 협력으로 알려진 또 하나의 선도적인 싱가포르 대학입니다. 혁신과 기술에 대한 집중은 여러 부문에 수많은 돌파구와 기여를 가져왔습니다. NTU의 지속 가능성에 대한 헌신과 활기찬 캠퍼스 환경은 전 세계 학생과 연구자들에게 선망받는 목적지가 되게 합니다."
 SIN_EDU_university_patent_and_journal: "대학 연구 지원"
 SIN_EDU_university_patent_and_journal_desc: "대학의 특허 및 학술지 연구를 지원하는 것은 혁신과 경제 성장을 이끄는 데 필수적입니다. 연구 투자는 획기적인 발견으로 이어질 뿐 아니라 지적 호기심과 협력의 문화를 키웁니다. 이 지원은 싱가포르가 세계적으로 경쟁력을 유지하고 최고의 연구자와 인재를 끌어들이도록 보장합니다. 그 결과로 나오는 특허와 출판물은 국가 발전에 크게 기여합니다."
 SIN_EDU_south_east_asia_education_center: "아세안 교육 센터"
 SIN_EDU_south_east_asia_education_center_desc: "싱가포르는 동남아시아 전역의 학생들에게 양질의 교육과 훈련 기회를 제공하는 아세안 지역의 선도적 교육 허브가 되기를 열망합니다. 이 구상은 지역 협력을 증진하고 지역 전체의 인적 자본을 강화합니다. 세계적 수준의 교육에 대한 접근을 제공함으로써 싱가포르는 아세안 국가들의 전반적인 발전과 번영에 기여하는 것을 목표로 합니다."
 SIN_singapore_armed_forces: "싱가포르 군"
 SIN_singapore_armed_forces_desc: "싱가포르 군은 고도로 효과적이고 시의적절한 방위군으로 남기 위해 끊임없이 변혁합니다. 진화하는 위협과 기술 발전에 적응하며 싱가포르 군(SAF)은 장비, 훈련, 전략을 지속적으로 현대화합니다. 이러한 혁신에 대한 의지 덕분에 싱가포르 군은 끊임없이 변하는 세계 정세 속에서 국가 안보를 지키는 강력하고 유연한 방패로 남습니다. 첨단 무기부터 정교한 사이버전 능력에 이르기까지, SAF의 현대화 노력은 국익을 수호하는 데 있어 군의 효과성이 지속되도록 보장합니다."
 SIN_navy: "싱가포르 해군(RSN)"
 SIN_navy_desc: "우리 육군과 마찬가지로 해군의 주된 목표도 싱가포르의 해안을 방어하는 것입니다. 따라서 우리의 해군 교리는 해안선을 더 잘 지킬 수 있도록 소형 함정을 중심으로 세워져야 합니다."
 SIN_navy_corvettes: "초계함"
 SIN_navy_corvettes_desc: "현대의 초계함은 민첩하고 기술적으로 앞선 군함으로, 첨단 센서와 무기를 갖추어 진화하는 위협 속에서도 해양 우위를 보장합니다. 이는 연안 방어와 힘의 투사에 필수적입니다."
 SIN_navy_frigate: "호위함"
 SIN_navy_frigate_desc: "호위함은 정교한 대잠수함 및 대공 능력을 갖춘, 해군력의 상당한 도약을 나타냅니다. 호위함의 다재다능함과 강화된 화력은 강력한 해군 주둔을 유지하고 국익을 수호하는 데 필수적입니다."
 SIN_navy_carrier: "항공모함"
 SIN_navy_carrier_desc: "항공모함은 국력의 강력한 상징으로, 공격과 방어 작전 모두를 위해 다양한 항공기를 배치할 수 있는 이동식 공군 기지를 제공합니다. 항공모함으로의 전환은 세계적 힘의 투사에 대한 국가의 의지를 반영합니다."
 SIN_navy_naval_exercise: "일일 해군 훈련"
 SIN_navy_naval_exercise_desc: "엄격한 일일 해군 훈련은 싱가포르 수병들의 기량을 갈고닦아 어떤 해상 위협에도 대응할 최고의 준비 태세를 보장합니다. 다양한 시나리오를 아우르는 이 훈련은 높은 숙련도와 대비 태세를 유지시킵니다."
 SIN_navy_efficient_sailor: "유능한 수병"
 SIN_navy_efficient_sailor_desc: "유능한 싱가포르 수병은 고도로 훈련되고 적응력이 뛰어나며 기술에 능숙합니다. 엄격한 훈련과 실전 경험으로 단련된 그들의 기량은 싱가포르의 해양 이익을 수호하는 데 필수적입니다."
 SIN_army: "싱가포르군"
 SIN_army_desc: "사람들의 마음속에는 여전히 큰 의문이 남아 있습니다. 우리 군을 소규모이지만 현대적이고 전문적인 군대로 전환해야 할까요, 아니면 이웃 나라들의 규모를 따라잡기 위해 군 인력을 늘려야 할까요?"
 SIN_army_military_resilience: "군의 회복력"
 SIN_army_military_resilience_desc: "싱가포르 군의 회복력은 고도로 훈련된 인원, 첨단 기술, 유연한 전략에서 나옵니다. 이는 주권에 대한 어떤 위협도 견디고 극복할 수 있는 국가의 능력을 보장합니다."
 SIN_army_army_daily_activity: "육군의 일일 활동"
 SIN_army_army_daily_activity_desc: "싱가포르 병사의 하루는 강도 높은 체력 단련, 무기 취급, 전술 훈련, 모의 훈련으로 채워집니다. 이러한 끊임없는 준비는 어떤 지상 침공에도 맞서 방어할 육군의 대비 태세를 보장합니다."
 SIN_army_foreign_intervention: "해외 개입"
 SIN_army_foreign_intervention_desc: "싱가포르의 방위 전략은 견고한 동맹과 파트너십을 포함하여 외부 위협에 대한 효과적인 대응을 가능하게 합니다. 우호국과의 협력은 지역 안보 과제를 다루는 능력을 향상시킵니다."
 SIN_army_expand_special_operation_force: "특수작전군(SOF) 확대"
 SIN_army_expand_special_operation_force_desc: "특수작전군을 확대하는 것은 싱가포르 방위 전략의 핵심입니다. SOF의 독보적인 능력은 비대칭 위협에 맞서 정밀하고 결정적인 행동을 가능하게 하여 국익을 수호합니다."
 SIN_air_force: "싱가포르 공군(RSAF)"
 SIN_air_force_desc: "전차 및 기계화 부대를 확대한 뒤, 이제 우리는 낡은 항공기를 개량하고 우리 요구에 더 잘 맞는 새로운 국산 기종을 생산할 역량을 갖추었습니다."
 SIN_air_force_helicopter: "헬리콥터"
 SIN_air_force_helicopter_desc: "현대의 헬리콥터는 병력 수송과 수색 구조에서 대잠수함전에 이르기까지 다양한 임무에 쓰이는 다목적 플랫폼입니다. 헬리콥터의 다재다능함과 첨단 능력은 현대 군사 작전에 필수적입니다."
 SIN_air_force_fighter: "전투기"
 SIN_air_force_fighter_desc: "스텔스 기술, 첨단 센서, 향상된 기동성은 현대 전투기의 특징으로, 공중 우세를 제공하고 공중 위협에 대한 효과적인 방어를 보장합니다. 전투기의 속도와 정밀성은 국방에 필수적입니다."
 SIN_air_force_drone: "드론"
 SIN_air_force_drone_desc: "드론은 다용도성, 저렴한 가격, 첨단 감시 능력으로 전쟁을 바꾸고 있습니다. 정찰, 감시, 표적 타격에 쓰이는 드론은 현대 군대에 매우 귀중한 자산입니다."
 SIN_air_force_pilot_daily_exercise: "조종사 일일 훈련"
 SIN_air_force_pilot_daily_exercise_desc: "매일의 비행 시뮬레이션과 엄격한 훈련은 싱가포르 공군 조종사들을 최고의 기량으로 유지시킵니다. 이 훈련은 그들을 다양한 시나리오에 대비시켜 싱가포르 영공의 공중 우세를 보장합니다."
 SIN_air_force_efficient_pilot: "유능한 조종사"
 SIN_air_force_efficient_pilot_desc: "싱가포르 공군 조종사들은 매우 유능하며 첨단 항공기와 무기를 능숙하게 다룹니다. 그들의 정밀함과 기량은 싱가포르 영공을 지키고 힘을 투사하는 데 필수적입니다."
 SIN_air_force_pilot_fast_learner: "빠른 학습 조종사"
 SIN_air_force_pilot_fast_learner_desc: "새로운 기술과 전술에 빠르게 적응하는 능력은 싱가포르 공군 조종사에게 매우 중요합니다. 이는 그들이 공중전의 최전선에 남아 공중 우세를 유지하도록 보장합니다."
 SIN_air_force_malacca_traits_air_superiority: "말라카 제공권"
 SIN_air_force_malacca_traits_air_superiority_desc: "말라카 해협 지역의 공중 우세를 유지하는 것은 싱가포르 방위에 무엇보다 중요합니다. 첨단 전투기와 견고한 대공 방어 체계는 핵심 해상 교통로와 국익을 보호하는 데 필수적입니다."
 SIN_SID_intelligence: "보안·정보국(SID)"
 SIN_SID_intelligence_desc: "싱가포르의 보안 및 정보 기관들은 국가 안보의 최전선에서 활동하며, 최첨단 기술과 고도로 숙련된 요원을 동원해 위협에 대응하고 국익을 수호합니다. 이들의 경계는 안정을 유지하고 싱가포르의 주권을 지키는 데 매우 중요합니다."
 SIN_SID_overseas_operation: "해외 요원"
 SIN_SID_overseas_operation_desc: "싱가포르의 해외 요원들은 전 세계에서 은밀하게 활동하는 고도로 훈련된 전문가로, 핵심 정보를 수집하고 국가에 대한 잠재적 위협을 예의주시합니다. 그들의 활동은 싱가포르의 안보가 국경 너머까지 미치도록 보장합니다."
 SIN_SID_intelligent_agile_transformation: "지능형 민첩 혁신"
 SIN_SID_intelligent_agile_transformation_desc: "싱가포르의 정보 공동체는 민첩한 혁신을 받아들여 진화하는 위협과 기술 발전에 빠르게 적응합니다. 이 역동적인 접근은 국가의 정보 능력이 글로벌 안보의 최전선에 남도록 보장합니다."
 SIN_SSA_space_agency: "싱가포르 우주청(SSA)"
 SIN_SSA_space_agency_desc: "싱가포르 우주청(SSA)은 싱가포르의 우주 기술 발전을 선도하며, 혁신을 이끌고 국가 안보와 경제 성장을 위한 역량을 개발합니다. 이들의 노력은 싱가포르의 미래를 지키는 데 매우 중요합니다."
 SIN_SSA_satellite_imagery: "위성 영상 활용"
 SIN_SSA_satellite_imagery_desc: "싱가포르는 위성 영상을 활용해 정보 능력을 강화하며, 전략 기획, 보안 감시, 재난 대응을 위한 실시간 통찰을 제공합니다. 이 기술은 역동적인 세계에서 결정적인 이점을 제공합니다."
 SIN_SSA_space_technology_effort: "우주 개발 노력"
 SIN_SSA_space_technology_effort_desc: "싱가포르의 지속적인 우주 개발 투자는 정보 기반시설을 강화하여 감시, 통신, 전략 기획에서 결정적인 우위를 제공합니다. 이 노력은 국가 안보와 지역 안정에 매우 중요합니다."
 SIN_nuclear_weapon_for_defence: "방어용 핵무기"
 SIN_nuclear_weapon_for_defence_desc: "우리는 평화를 옹호하지만 주권에 대한 의지는 흔들림이 없습니다. 핵 억제력을 배치할 가능성은 공격성에 관한 것이 아니라 우리의 생존을 보장하기 위한 것입니다. 이는 검이 아니라 방패이며, 우리 섬나라 조국에 대한 침략을 꾀하는 모든 나라에 보내는 강력한 메시지입니다. 싱가포르를 공격하는 대가는 너무나 클 것입니다. 우리의 방어는 우리 국민, 우리의 미래, 우리의 독립에 대한 약속입니다. 우리는 나라를 지킬 준비가 되어 있습니다. 평화에 대한 우리의 헌신은 우리 자신과 미래를 지키려는 결의와 같은 무게입니다. 이것은 위협이 아니라 약속입니다."
 SIN_reform_singapore_urban_redevelopment_authority: "도시재개발청(URA)"
 SIN_reform_singapore_urban_redevelopment_authority_desc: "싱가포르 도시재개발청(URA): 미래를 빚다. URA는 지속 가능한 도시 개발을 총괄 설계하며, 전략적인 토지 이용 계획과 사회기반시설 개발을 통해 싱가포르의 장기적 번영을 보장합니다. 번영하는 미래를 위한 미래 지향적 접근입니다."
 SIN_economic_planning: "경제 계획"
 SIN_economic_planning_desc: "싱가포르의 경제 계획은 지속 가능한 성장과 번영에 초점을 맞춘 역동적인 과정입니다. 상업, 산업, 주거 개발을 수용하기 위한 전략적 토지 이용 배분을 포함합니다. 여기에는 해외 투자 유치, 혁신과 기업가 정신 육성, 현대 경제의 요구를 충족할 숙련 인력 양성이 포함됩니다. 목표는 양질의 일자리를 제공하고 전반적인 생활 수준을 향상시키는 견고하고 경쟁력 있는 경제를 만드는 것입니다."
 SIN_social_need_planning: "사회적 수요 계획"
 SIN_social_need_planning_desc: "싱가포르의 사회적 수요 계획은 시민의 복지를 우선시합니다. 이는 교육, 의료, 주택, 사회 지원 체계에 초점을 맞춘 다양한 구상을 아우릅니다. 전략적인 토지 이용은 필수 서비스와 편의시설의 제공을 보장하여 활기차고 포용적인 공동체를 만듭니다. 계획 과정은 인구 구성, 접근성, 경제적 부담 가능성 같은 요소를 고려하여 모든 주민이 자원과 기회에 공평하게 접근하도록 보장합니다."
 SIN_environment_planning: "환경 계획"
 SIN_environment_planning_desc: "싱가포르의 환경 계획은 나라의 푸르고 깨끗한 경관을 유지하는 데 필수적입니다. 개발과 환경 보전의 균형을 맞추기 위한 세심한 토지 이용 관리를 수반합니다. 여기에는 자연 서식지 보존, 지속 가능한 관행 장려, 녹색 사회기반시설 투자가 포함됩니다. 궁극적인 목표는 생물 다양성을 뒷받침하고, 대기와 수질을 개선하며, 모두의 전반적인 삶의 질을 높이는 지속 가능하고 회복력 있는 환경을 만드는 것입니다."
 SIN_singapore_masterplan: "싱가포르 마스터플랜"
 SIN_singapore_masterplan_desc: "이 계획의 영향력은 효율적인 대중교통 체계에서 풍부한 녹지 공간에 이르기까지 싱가포르 도시 경관의 모든 면에서 뚜렷이 드러납니다. 이는 장기적 비전과 지속 가능한 도시 개발에 대한 나라의 헌신을 보여 주는 증거이며, 싱가포르가 진보의 등대이자 전 세계 도시의 모범으로 남도록 보장합니다."
 SIN_expand_changi_airport_area_phase1: "창이 공항 지역 확장 1단계"
 SIN_expand_changi_airport_area_phase1_desc: "세계적인 항공 허브인 싱가포르 창이 공항이 확장 중입니다! 이 야심 찬 사업의 1단계는 땅을 간척하여 싱가포르의 영토를 늘립니다. 이 전략적 조치는 공항의 수용력을 높여 무역과 관광을 촉진하는 동시에 국토 부족 문제를 해결합니다. 성장과 발전에 대한 싱가포르의 혁신적인 접근을 보여 주는 증거입니다."
 SIN_expand_changi_airport_area_phase2: "창이 공항 지역 확장 2단계"
 SIN_expand_changi_airport_area_phase2_desc: "창이 공항 지역 확장 2단계는 국내의 공간 또는 토지를 늘리기 위한 싱가포르의 구상입니다. 이 사업은 공항의 수용력과 시설을 강화하여 늘어나는 항공 여행 수요를 뒷받침하고 이 지역의 핵심 항공 허브로서 싱가포르의 입지를 굳히는 것을 목표로 합니다."
 SIN_expand_changi_bay: "창이 만 확장"
 SIN_expand_changi_bay_desc: "싱가포르의 전략적 간척 사업인 창이 만 확장이 진행 중입니다. 이 구상은 도서 국가에 귀중한 땅을 더하여 개발과 성장을 위한 흥미로운 기회를 만들어 냅니다. 이 사업은 싱가포르의 국토 부족을 해소할 뿐 아니라 사회기반시설, 주택, 경제 팽창을 위한 새로운 가능성을 열어 줄 것을 약속합니다. 자원을 관리하고 미래를 확보하는 싱가포르의 혁신적 접근을 보여 주는 증거입니다. 더 밝은 내일을 향한 대담한 걸음입니다!"
 SIN_ubin_island_development: "우빈 섬 개발"
 SIN_ubin_island_development_desc: "엄밀히 말해 간척은 아니지만, 풀라우 우빈 개발은 싱가포르의 이용 가능한 공간을 넓히는 독특한 접근을 제시합니다. 이 사업은 섬의 자연미를 보존하는 것과 새로운 여가 공간 및 사회기반시설을 조성하는 것 사이의 균형을 맞추며 지속 가능한 개발에 초점을 둡니다. 도시 개발과 더불어 환경적 지속 가능성에 대한 싱가포르의 헌신을 보여 주는 증거이며, 자연과 진보를 모두 우선시하는 색다른 확장 모델을 제시합니다."
 SIN_long_island_coastal_defence: "롱 아일랜드 해안 방어"
 SIN_long_island_coastal_defence_desc: "싱가포르의 롱 아일랜드 해안 방어 구상은 이스트 코스트 공원 앞바다에서 800헥타르의 땅을 간척하는 것을 목표로 합니다. 이 전략 사업은 해수면 상승에 대한 해안 보호를 강화할 뿐 아니라 주거 및 여가 개발의 새로운 기회도 만듭니다. 지속 가능하고 회복력 있는 미래를 향한 대담한 걸음입니다!"
 SIN_tekong_island_expansion: "테콩 섬 확장"
 SIN_tekong_island_expansion_desc: "싱가포르의 테콩 섬 확장 사업은 국토 공간의 제약을 해결하기 위해 땅을 간척하는 중대한 사업입니다. 이 전략적 조치는 섬의 크기를 늘릴 뿐 아니라 다양한 개발의 잠재력도 열어 싱가포르의 전반적인 성장과 경제적 기회에 기여합니다. 토지 관리에 대한 싱가포르의 혁신적 접근과 번영하는 미래를 확보하려는 의지를 보여 주는 증거입니다."
 SIN_reclamation_sanyongkong_island: "사농콩 섬 간척"
 SIN_reclamation_sanyongkong_island_desc: "싱가포르의 사농콩 섬 전략적 간척 사업이 진행 중이며, 도서 국가에 귀중한 땅을 더하고 있습니다. 이 구상은 개발과 성장의 흥미로운 기회를 만들고, 싱가포르의 국토 부족을 해소하며, 사회기반시설, 주택, 경제 팽창의 새로운 가능성을 열어 줍니다. 자원을 관리하고 미래를 확보하는 싱가포르의 혁신적 접근을 보여 주는 증거입니다. 더 밝은 내일을 향한 대담한 걸음입니다!"
 SIN_tekong_kechil_island_development: "테콩 께칠 섬 개발"
 SIN_tekong_kechil_island_development_desc: "테콩 섬 확장은 단순한 간척 이상으로 싱가포르의 미래에 대한 전략적 투자입니다. 이 야심 찬 사업은 국토 부족을 해결하는 동시에 경제 성장과 발전의 기회를 만들어 냅니다. 섬의 크기를 늘림으로써 싱가포르는 다양한 용도의 귀중한 땅을 확보하고 세계적 선도 허브로서의 입지를 더욱 강화합니다."
 SIN_tekong_island_development: "테콩 섬 개발"
 SIN_tekong_island_development_desc: "싱가포르의 테콩 섬 확장은 미래를 향한 대담한 비전을 상징합니다. 이 전략 사업은 단순히 땅을 늘리는 것이 아니라 새로운 가능성을 만드는 것입니다. 늘어난 면적은 다양한 개발의 문을 열어 싱가포르의 경제 성장에 기여하고 사회기반시설을 향상시킵니다. 자원 관리에 대한 싱가포르의 혁신적 접근과 진보에 대한 변함없는 의지를 보여 주는 증거입니다."
 SIN_sajahat_island_reclamation: "사자핫 섬 간척"
 SIN_sajahat_island_reclamation_desc: "싱가포르의 사자핫 섬 전략적 간척 사업이 진행 중이며, 도서 국가에 귀중한 땅을 더하고 있습니다. 이 구상은 개발과 성장의 흥미로운 기회를 만들고, 싱가포르의 국토 부족을 해소하며, 사회기반시설, 주택, 경제 팽창의 새로운 가능성을 열어 줍니다. 자원을 관리하고 미래를 확보하는 싱가포르의 혁신적 접근을 보여 주는 증거입니다."
 SIN_psa_pasir_panjang_terminal_devlopment: "PSA 파시르 판장 터미널 개발"
 SIN_psa_pasir_panjang_terminal_devlopment_desc: "PSA 파시르 판장 터미널 개발은 싱가포르의 항만 기반시설을 탈바꿈시켜 세계 무역을 위한 더 효율적이고 견고한 관문을 만들고 있습니다. 이 확장은 처리 능력을 크게 늘려 더 큰 선박과 더 많은 화물량을 감당합니다. 이는 선도적 해양 허브로서의 입지를 유지하고, 경제 성장을 이끌며, 세계 무역 중심지로서의 미래를 확보하겠다는 싱가포르의 의지를 강조하는 전략적 투자입니다."
 SIN_jurong_island_reclamation_project: "주롱 섬 간척 사업"
 SIN_jurong_island_reclamation_project_desc: "싱가포르의 주롱 섬 간척 사업은 세계적 석유화학 허브로서 섬의 수용력을 확대하기 위한 전략 구상입니다. 이 확장은 새로운 시설과 사회기반시설을 위한 결정적인 공간을 제공하여 산업의 성장을 촉진하고 해당 부문의 선두 주자로서 싱가포르의 입지를 강화합니다. 경제 발전에 대한 싱가포르의 미래 지향적 접근과 세계 에너지 시장의 주요 참여자로서 미래를 확보하겠다는 의지를 보여 주는 증거입니다."
 SIN_psa_pasir_panjang_terminal_devlopment_phase_2: "PSA 파시르 판장 터미널 개발 2단계"
 SIN_psa_pasir_panjang_terminal_devlopment_phase_2_desc: "싱가포르의 PSA 파시르 판장 터미널 개발은 대담한 의지의 표명입니다. 이 야심 찬 확장은 단순히 처리 능력을 늘리는 것이 아니라 선도적인 세계 해양 허브로서의 싱가포르의 미래를 확보하는 일입니다. 최첨단 사회기반시설에 투자함으로써 싱가포르는 국제 무역의 핵심 주체로서의 입지를 다지고, 경제 번영을 이끌며, 세계 무대에서의 지속적인 성공을 보장합니다."
 SIN_jurong_island_development_project: "주롱 섬 개발 사업"
 SIN_jurong_island_development_project_desc: "싱가포르의 주롱 섬 개발 사업은 섬을 석유화학 및 화학 산업의 세계적 거점으로 탈바꿈시키는 전략 구상입니다. 이 야심 찬 사업은 면적을 늘려 제조, 연구, 혁신을 위한 활기찬 허브를 만듭니다. 싱가포르의 경제적 미래를 확보하고 세계 시장의 선두 주자로서의 입지를 강화하는 대담한 걸음입니다. 이는 단순한 토지 개발이 아니라 국가 건설입니다."
 SIN_semakau_island_reclamation_project: "스마카우 섬 간척 사업"
 SIN_semakau_island_reclamation_project_desc: "싱가포르의 스마카우 섬 전략적 간척 사업이 진행 중이며, 도서 국가에 귀중한 땅을 더하고 있습니다. 이 구상은 개발과 성장의 흥미로운 기회를 만들고, 싱가포르의 국토 부족을 해소하며, 사회기반시설, 주택, 경제 팽창의 새로운 가능성을 열어 줍니다."
 SIN_tuas_reclamation_project_phase_1: "투아스 간척 사업 1단계"
 SIN_tuas_reclamation_project_phase_1_desc: "싱가포르 투아스 간척 사업의 1단계가 진행 중이며, 국토 면적을 넓히고 미래 성장을 위한 토대를 만들고 있습니다. 이 전략 구상은 여러 부문에 새로운 기회를 만들고, 토지 제약을 해소하며, 경제 발전을 촉진할 것입니다."
 SIN_tuas_dock_development_project_phase_1: "투아스 부두 개발 사업 1단계"
 SIN_tuas_dock_development_project_phase_1_desc: "투아스 부두 개발 사업 1단계는 싱가포르의 항만 기반시설을 탈바꿈시켜 세계 무역을 위한 더 크고 효율적인 관문을 만들고 있습니다. 이 야심 찬 확장은 처리 능력을 크게 늘려 더 큰 선박과 더 많은 화물량을 감당합니다."
 SIN_tuas_reclamation_project_phase_2: "투아스 간척 사업 2단계"
 SIN_tuas_reclamation_project_phase_2_desc: "싱가포르 투아스 간척 사업 2단계는 단순한 국토 확장 이상으로 미래 성장의 토대입니다. 이 야심 찬 사업은 핵심 사회기반시설을 위한 귀중한 땅을 만들어 내고, 경제적 기회를 늘리며, 싱가포르의 미래를 확보하고 있습니다."
 singapore.128.t: "사임하는 리셴룽"
 singapore.128.d: "거의 20년간 키를 잡아 온 싱가포르 총리 리셴룽이 물러날 예정입니다. 경제 성장, 사회 진보, 세계 무대에서의 국가의 지속적인 안정으로 점철된 그의 재임이 이제 막을 내리고 있습니다. 이 전환은 나라가 새로운 지도자의 시대를 준비하는 만큼 싱가포르 역사에서 중요한 순간입니다. 리의 유산은 앞으로 수년간 폭넓은 분석과 논의의 대상이 되어 싱가포르의 미래 궤적에 관한 서사를 형성할 것이 틀림없습니다. 그의 퇴임은 한 시대의 끝을 의미하는 동시에 새로운 장의 시작을 알리며, 싱가포르의 견고한 통치 체계와 승계 계획을 보여 줍니다. 나라는 새로운 지도부 아래에서 순조로운 전환과 지속적인 진보를 기대합니다."
 singapore.128.a: "또 한 명의 위대한 지도자가 물러나다"
 SIN_power_balance: "§Y싱가포르의 국익§!"
 SIN_power_balance_desc: "싱가포르의 국익은 싱가포르 우선주의와 세계적 관여 사이의 복합적인 상호작용입니다. 국가는 국민의 복지와 경제적 안정을 최우선으로 삼으며, 이는 싱가포르 우선 정책의 핵심 원칙이지만, 동시에 국제 협력과 영향력의 중요성도 인식하고 있습니다. 이러한 접근은 싱가포르의 세계 지배를 추구하는 것이 아니라 전략적인 균형 잡기에 가깝습니다. 싱가포르는 경제력과 지정학적 위치를 활용하여 세계 무대에서 자국의 이익을 확보하고, 궁극적으로 국내외에서 안정적이고 번영하는 환경을 조성하는 것을 목표로 합니다. 이러한 섬세한 접근은 국가의 장기적인 안보와 번영을 보장합니다."
 SIN_external_focus_left_side: "§C싱가포르 세계 지배§!"
 SIN_external_focus_left_side_desc: "야망으로 가득 찬 국가 싱가포르는 세계 무대에서 자국의 규모를 훨씬 뛰어넘는 영향력을 발휘합니다. 금융과 무역의 중심지로 번영하는 경제력은 부인할 수 없습니다. 외교적으로는 복잡한 지정학적 파고를 능숙하고 정교하게 헤쳐 나가며 전 세계에 걸쳐 굳건한 관계를 구축합니다. 군사 강국은 아니지만 싱가포르의 전략적 방위 접근법은 자국의 안보와 안정을 보장하며 지역 평화에 기여합니다. 혁신, 교육, 지속 가능성에 대한 헌신은 세계적 지도국으로서의 입지를 굳히고, 정책에 영향을 미치며 미래를 형성합니다. 싱가포르의 영향력은 단지 느껴지는 데 그치지 않고 존중받고, 찬사를 받으며, 본보기가 됩니다."
 SIN_internal_focus_right_side: "§2싱가포르 우선§!"
 SIN_internal_focus_right_desc: "미래지향적 접근으로 알려진 국가 싱가포르는 안전하고 번영하는 미래를 보장하기 위해 내부 발전을 최우선으로 삼습니다. 교육은 무엇보다 중요하며, 고도로 숙련된 인력을 양성하고 혁신을 이끕니다. 식량 안보는 핵심 과제로서 자급자족과 회복탄력성을 보장합니다. 기술 발전을 적극 수용하여 싱가포르를 혁신의 최전선으로 끌어올립니다. 또한 국가는 외부 영향에 대한 회복력을 우선시하여 자국의 가치와 이익을 지킵니다. 물론 국방 역시 최우선 과제로 남아 있으며 국민의 안전과 안보를 보장합니다. 이러한 내부 기둥에 대한 싱가포르의 헌신은 강력하고 지속 가능한 미래의 토대를 마련하며, 그 미래에서 싱가포르는 계속 번영하며 세계에 기여할 것입니다."
 SIN_mid_range: "균형 잡힌 국익"
 SIN_mid_range_desc: "§g싱가포르의 성공 신화는 상충하는 우선순위를 능숙하게 조율해 온 능력의 증거입니다. 교육, 기술 발전, 견고한 국방을 통해 내부의 힘을 우선시하는 '싱가포르 우선' 정책은 세계적 영향력에 대한 야망과 서로 배타적이지 않습니다. 오히려 경제적 번영, 사회적 안정, 기술 혁신이라는 강력한 내부 토대가 세계 무대에서 영향력을 투사하는 싱가포르의 능력에 동력을 제공합니다. 이러한 균형 잡힌 접근은 대외적 야망이 안전하고 회복력 있는 국가에 의해 뒷받침되도록 하여, 싱가포르가 자국을 지키면서도 세계적 이익을 효과적으로 추구할 수 있게 합니다. 이는 계산된 위험과 적재적소의 투자를 바탕으로 한 전략으로서, 국내외 목표 모두에 대한 실용적 접근을 보여줍니다.§!"
 SIN_phase1_left_side_range: "§C말라카 해협 지배§!"
 SIN_phase1_left_side_range_desc: "§g싱가포르는 세계에서 가장 붐비는 항로 중 하나인 말라카 해협에 대한 영향력을 장악함으로써 동남아시아의 핵심 해상 거점으로 자리매김합니다. 전략적 항만 운영, 해상 안보, 무역 촉진을 통해 싱가포르는 지역 통제와 경제력의 토대를 마련합니다.§!"
 SIN_phase2_left_side_range: "§CASEAN 지배§!"
 SIN_phase2_left_side_range_desc: "§g해상 지도력을 기반으로 싱가포르는 경제 통합, 기술 리더십, 외교적 관여를 통해 ASEAN 전역으로 영향력을 확대합니다. 동남아시아 협력의 중심 거점으로 자리매김함으로써 싱가포르는 신뢰받는 목소리이자 지역 현안의 핵심 의사결정자가 됩니다.§!"
 SIN_phase3_left_side_range: "§C아시아 지배§!"
 SIN_phase3_left_side_range_desc: "§g싱가포르는 경제 대국 및 신흥 강국들과 굳건한 유대를 맺으며 더 넓은 아시아 무대에 오릅니다. 혁신, 금융 서비스, 사상적 리더십을 통해 동서양을 잇는 가교가 되어, 아시아의 미래를 형성하는 작지만 강력한 영향력자가 됩니다.§!"
 SIN_phase4_left_side_range: "§C대국 지배§!"
 SIN_phase4_left_side_range_desc: "§g이 단계에서 싱가포르는 작은 규모에도 불구하고 세계적 영향력을 지닌 도시국가로서 강대국으로 인정받습니다. 디지털 거버넌스, 지속 가능성, 전략적 선견지명 분야의 기준을 세우고, 주요 국제 체제의 형성에 참여하며 대륙을 넘어 존중을 받습니다.§!"
 SIN_phase5_left_side_range: "§C세계 지배§!"
 SIN_phase5_left_side_range_desc: "§g싱가포르의 비전은 세계적 지도국이 되는 것으로 절정에 이릅니다. 탁월함, 혁신, 청렴이라는 가치를 통해 싱가포르는 전 세계 기구에서 소프트 파워와 정책 영향력을 행사합니다. 세계적 현안을 주도하며 협력, 신뢰, 미래지향적 리더십의 기조를 전 세계에 제시합니다.§!"
 SIN_phase1_right_side_range: "§2싱가포르 국민의, 싱가포르 국민을 위한 정치§!"
 SIN_phase1_right_side_range_desc: "§g싱가포르의 여정은 국민에 뿌리를 둔 굳건한 토대에서 시작됩니다. 정책은 시민의 요구에 귀를 기울여 형성되며, 신뢰와 참여를 키워 나갑니다. 이 단계는 포용적 발전, 공평한 기회 접근, 그리고 싱가포르인에 의한, 모든 싱가포르인을 위한 국가를 건설하는 데 중점을 둡니다.§!"
 SIN_phase2_right_side_range: "§2싱가포르인이라는 자긍심의 정신§!"
 SIN_phase2_right_side_range_desc: "§g모든 시민이 싱가포르인임을 자랑스럽게 여기는 깊은 국가 정체성이 함양됩니다. 공유된 가치, 국민 교육, 문화적 자긍심이 강조됩니다. 이 단계는 정서적 회복력, 단결, 소속감을 길러 싱가포르의 생활 방식을 내부로부터 지켜냅니다.§!"
 SIN_phase3_right_side_range: "§2단결의 힘§!"
 SIN_phase3_right_side_range_desc: "§g싱가포르는 국민이 함께 설 때 번영합니다. 이 단계는 사회적 결속을 강화하고, 공동체를 이어주며, 지원 망을 보강합니다. 공중 보건, 교육, 식량 안보에 대한 투자는 누구도 소외되지 않도록 하여, 외부 충격에 맞설 준비가 된 안정적인 사회를 확보합니다.§!"
 SIN_phase4_right_side_range: "§2행동으로 하나 된 국민§!"
 SIN_phase4_right_side_range_desc: "§g싱가포르는 전략적 도전에 대응하기 위해 하나로 동원됩니다. 기술 혁신에서 국방 태세에 이르기까지 모든 시민, 부문, 기관이 역할을 맡습니다. 이 단계는 민첩한 정책, 민관 협력, 외부 압력에 대한 조율된 국가적 대응을 통해 국가 대비 태세를 최우선으로 삼습니다.§!"
 SIN_phase5_right_side_range: "§2싱가포르 우선§!"
 SIN_phase5_right_side_range_desc: "§g싱가포르는 세계와 교류하면서도 자국의 이익을 굳건히 지킵니다. 국가 주권, 경제적 회복력, 안보는 어떤 대가를 치르더라도 보호됩니다. 이 단계는 의사결정에서 싱가포르인이 최우선 순위로 남도록 보장하며, 국가의 독립과 존엄, 세계 무대에서의 지속적 성공을 지켜냅니다.§!"
 SIN_BOP_promote_singapore_asian_value: "싱가포르식 아시아적 가치 전파"
 SIN_BOP_promote_singapore_asian_value_desc: "싱가포르의 관료제 효율성과 공공 정책 모델을 확산시키기 위한 소프트 외교 캠페인입니다."
 SIN_BOP_establish_asean_innovation_hub: "ASEAN 혁신 허브 설립"
 SIN_BOP_establish_asean_innovation_hub_desc: "싱가포르를 ASEAN 기술 혁신 및 연구의 거점으로 만들어 지적·경제적 영향력을 확대합니다."
 SIN_BOP_expand_global_diplomatic_footprint: "세계 외교망 확대"
 SIN_BOP_expand_global_diplomatic_footprint_desc: "아프리카, 중동, 중남미에 더 많은 대사관과 영사관을 개설하여 외교의 영향 범위를 넓힙니다."
 SIN_BOP_maintenance_no1_strongest_world_passport: "세계 최강 여권 1위 유지"
 SIN_BOP_maintenance_no1_strongest_world_passport_desc: "모든 국가와의 관계와 외교를 유지하여 싱가포르 여권이 세계 최강 여권 1위 자리를 지키도록 합니다."
 SIN_BOP_found_singapore_strategic_investment_authority: "싱가포르 전략투자청(SSIA) 설립"
 SIN_BOP_found_singapore_strategic_investment_authority_desc: "국부펀드를 통한 해외 투자를 늘려 지정학적 입지를 강화합니다."
 SIN_BOP_establish_singapore_armed_forces_training_partnerships: "싱가포르군 훈련 협력 체결"
 SIN_BOP_establish_singapore_armed_forces_training_partnerships_desc: "브루나이와 대만의 싱가포르군 프로그램과 같이 우호국과의 군사 훈련 협력을 추진합니다."
 SIN_BOP_build_global_tech_corridor: "글로벌 기술 회랑 구축"
 SIN_BOP_build_global_tech_corridor_desc: "선진국 및 개발도상국과의 기술 협력을 통해 디지털 우위를 확립합니다."
 SIN_BOP_host_asia_global_security_summit: "아시아 글로벌 안보 정상회의 개최"
 SIN_BOP_host_asia_global_security_summit_desc: "싱가포르를 국제 안보 회의의 상설 개최지로 자리매김시킵니다."
 SIN_BOP_launch_smart_southeast_asia_initiative: "\\"스마트 동남아시아\\" 구상 출범"
 SIN_BOP_launch_smart_southeast_asia_initiative_desc: "인접국에 디지털 및 스마트 시티 기반시설을 공급하여 경제적 영향력을 강화합니다."
 SIN_BOP_initiate_maritime_silk_reconnect: "해상 실크로드 재연결 추진"
 SIN_BOP_initiate_maritime_silk_reconnect_desc: "싱가포르를 인도·태평양의 주요 해상 무역 허브로 만듭니다."
 SIN_BOP_fund_regional_think_tanks: "지역 싱크탱크 지원"
 SIN_BOP_fund_regional_think_tanks_desc: "타국의 연구 기관에 자금을 지원하여 친싱가포르적 지역 여론을 형성합니다."
 SIN_BOP_establish_singaporean_cultural_institutes_abroad: "해외 싱가포르 문화원 설립"
 SIN_BOP_establish_singaporean_cultural_institutes_abroad_desc: "괴테 인스티튜트나 영국문화원과 같이 싱가포르의 가치와 문화를 세계에 전파합니다."
 SIN_BOP_secure_overseas_port_access_agreements: "해외 항만 이용 협정 확보"
 SIN_BOP_secure_overseas_port_access_agreements_desc: "해외 항만에서의 군사 및 민간 물류 이용을 위한 전략적 협정을 체결합니다."
 SIN_BOP_launch_global_green_finance_diplomacy: "글로벌 녹색 금융 외교 추진"
 SIN_BOP_launch_global_green_finance_diplomacy_desc: "녹색 금융 허브로서의 싱가포르의 위상을 활용하여 아시아의 ESG 기준을 주도합니다."
 SIN_BOP_singapore_citizenship_journey_program: "싱가포르 시민권 취득 프로그램"
 SIN_BOP_singapore_citizenship_journey_program_desc: "타국 출신자가 합법적으로 국적을 바꾸어 싱가포르인이 될 수 있는 기회를 엽니다."
 SIN_BOP_reclaim_throne_tiger_of_the_peninsula: "반도의 호랑이 왕좌 탈환"
 SIN_BOP_reclaim_throne_tiger_of_the_peninsula_desc: "전략적이고 독립적이며 실용적인 접근으로 새로운 아시아 질서를 형성하기 위한 적극적인 지역 외교 정책입니다."
 SIN_BOP_gold_card_visas_for_billionaire_program: "억만장자 골드카드 비자 프로그램"
 SIN_BOP_gold_card_visas_for_billionaire_program_desc: "억만장자에게 이중 국적을 제공하고 투자의 문을 열어 싱가포르의 사업 잠재력을 개방하는 골드카드 비자 프로그램입니다."
 SIN_BOP_overseas_intelligence_activity: "해외 정보 활동 강화"
 SIN_BOP_overseas_intelligence_activity_desc: "상반된 견해를 가지고 싱가포르를 위협하는 국가들로부터 국가의 회복력을 유지하기 위함입니다."
 SIN_BOP_promote_singapore_business_environment: "싱가포르 기업 환경 홍보"
 SIN_BOP_promote_singapore_business_environment_desc: "사기와 부패가 없는 깨끗한 싱가포르 기업 환경과 투명한 관료 체계를 홍보합니다."
 SIN_BOP_scholarship_for_bachelor_master_and_doctoral_education: "학사·석사·박사 교육 장학금"
 SIN_BOP_scholarship_for_bachelor_master_and_doctoral_education_desc: "공학 및 미래 직업에 필요한 기술을 위한 고등 교육을 무상으로 제공합니다."
 SIN_BOP_national_skills_future_movement: "국가 스킬스퓨처 운동"
 SIN_BOP_national_skills_future_movement_desc: "국가 노동력을 위한 직업 훈련과 평생 학습에 투자합니다."
 SIN_BOP_enhance_cpf_and_housing_grants: "CPF 및 주택 보조금 확충"
 SIN_BOP_enhance_cpf_and_housing_grants_desc: "시민을 위한 연금 기금과 주택 보조금을 늘립니다."
 SIN_BOP_local_enterprise_growth_scheme: "지역 기업 성장 계획"
 SIN_BOP_local_enterprise_growth_scheme_desc: "국내 중소기업이 내수 시장에서 성장할 수 있도록 지원하는 구상입니다."
 SIN_BOP_boost_birth_rate_incentive_package: "출산율 제고 인센티브 패키지"
 SIN_BOP_boost_birth_rate_incentive_package_desc: "젊은 가정을 위한 재정적 인센티브와 아동 수당을 제공합니다."
 SIN_BOP_green_singapore_movement: "녹색 싱가포르 운동"
 SIN_BOP_green_singapore_movement_desc: "청정 에너지, 녹지 공간, 국내 녹색 정책에 투자합니다."
 SIN_BOP_public_transport_excellence_scheme: "대중교통 우수성 계획"
 SIN_BOP_public_transport_excellence_scheme_desc: "모든 사회 계층이 인터넷과 기술에 접근할 수 있도록 보장합니다."
 SIN_BOP_national_food_resilience_strategy: "국가 식량 회복력 전략"
 SIN_BOP_national_food_resilience_strategy_desc: "국내 식량 공급원을 다변화하고 공급망 안보를 확보합니다."
 SIN_BOP_cybersecurity_for_citizens_initiative: "시민 사이버 보안 구상"
 SIN_BOP_cybersecurity_for_citizens_initiative_desc: "디지털 리터러시 및 개인정보 보호 캠페인입니다."
 SIN_BOP_support_local_talent_first_act: "자국 인재 우선 지원법"
 SIN_BOP_support_local_talent_first_act_desc: "전략 분야 고용에서 자국 노동자를 우선하는 규정입니다."
 SIN_BOP_singaporean_culture_preservation_fund: "싱가포르 문화 보존 기금"
 SIN_BOP_singaporean_culture_preservation_fund_desc: "현대화 속에서 지역 문화와 전통 공동체를 지원합니다."
 SIN_BOP_financial_wellness_national_campaign: "금융 건전성 국가 캠페인"
 SIN_BOP_financial_wellness_national_campaign_desc: "모든 시민을 위한 금융 이해 교육 및 재무 관리 프로그램입니다."
 SIN_BOP_give_incentives_for_domestic_companies: "국내 기업 인센티브 제공"
 SIN_BOP_give_incentives_for_domestic_companies_desc: "생산성 향상을 위한 재정적 인센티브를 제공하여 세수 증대로 이어지게 합니다."
 SIN_BOP_fight_foreign_influence: "외국 영향력 대응"
 SIN_BOP_fight_foreign_influence_desc: "경제적으로 식민화하려는 국내의 외국 영향력에 맞서 싸웁니다."
 SIN_BOP_masterplan_for_land_allocation: "토지 배분 마스터플랜"
 SIN_BOP_masterplan_for_land_allocation_desc: "한정된 토지 자원 문제에 정면으로 대응합니다. 고밀도의 지속 가능한 개발을 우선시하며 주거, 상업, 녹지 공간의 균형을 맞춥니다. 전략적 토지 이용은 효율을 극대화하여 소중한 자연 유산을 보존하면서도 미래 성장을 위한 최적의 배분을 보장합니다. 이 계획은 싱가포르의 살기 좋은 환경과 경제 경쟁력을 유지하는 데 필수적입니다."
 SIN_BOP_masterplan_for_civilian_industry_development: "민간 산업 개발 마스터플랜"
 SIN_BOP_masterplan_for_civilian_industry_development_desc: "혁신과 고부가가치 산업의 육성에 중점을 둡니다. 외국인 투자를 전략적으로 유치하고 자국 인재를 양성함으로써 견실하고 다각화된 경제를 구축하는 것을 목표로 합니다. 이 계획은 핵심 부문의 성장을 뒷받침하고 기술 발전을 촉진하여, 한정된 토지 여건에서도 싱가포르가 혁신과 기업가 정신의 세계적 거점으로 남도록 보장합니다."
 SIN_BOP_masterplan_for_miliatary_industry_development: "군수 산업 개발 마스터플랜"
 SIN_BOP_masterplan_for_miliatary_industry_development_desc: "국방 분야의 자립과 기술 발전을 우선시합니다. 한정된 토지를 고려하여 이 계획은 효율적인 자원 배분과 전략적 파트너십에 중점을 두어 국가 안보를 보장합니다. 최첨단 기술을 개발하고 숙련된 인력을 양성하여 우리의 방위 역량이 견고하고 미래의 위협에 적응할 수 있도록 합니다."
 SIN_BOP_masterplan_for_naval_yard_development: "조선소 개발 마스터플랜"
 SIN_BOP_masterplan_for_naval_yard_development_desc: "효율적인 기반시설과 기술 혁신에 중점을 두어 한정된 공간이라는 과제에 대응합니다. 이 계획은 우리의 해군 역량이 최신 수준을 유지하도록 보장하여 국가 안보와 해양 이익을 뒷받침합니다. 전략적 확장과 현대화를 통해 공간 활용을 최적화하고 지속 가능한 방식을 도입합니다."
 SIN_BOP_masterplan_for_offices_development: "사무 공간 개발 마스터플랜"
 SIN_BOP_masterplan_for_offices_development_desc: "한정된 토지 면적 내에서 효율적이고 지속 가능한 업무 공간 해법이 필요하다는 과제에 대응합니다. 이 계획은 사무 공간을 주거 및 상업 지역과 통합하는 고밀도 복합 개발을 장려합니다. 스마트 빌딩 기술과 녹색 구상을 우선시하여, 토지 이용을 최적화하고 지속 가능성을 증진하면서도 활기차고 생산적인 업무 환경을 조성합니다."
 SIN_singapore_problem: "싱가포르의 지리적 문제"
 SIN_singapore_problem_desc: "싱가포르는 천연자원 부족, 토지 부족, 물 위기, 시민을 위한 주택 부족 등 다수의 지리적 난제에 직면해 있습니다."
 singapore.76.t: "미국산 항공기 구매"
 singapore.76.d: "싱가포르가 국방을 위한 항공기를 구하고자 우리에게 접근했습니다."
 singapore.76.a: "구매에 동의한다"
 singapore.76.b: "구매를 거절한다"
 singapore.77.t: "미국산 군사 장비 구매"
 singapore.77.d: "싱가포르가 자국 군을 위해 각종 무기와 소화기를 구매하고자 우리에게 접근했습니다."
 singapore.77.a: "구매에 동의한다"
 singapore.77.b: "구매를 거절한다"
 SIN_gold_market_standard: "싱가포르 금 시장 표준"
 SIN_gold_market_standard_desc: "싱가포르 금 시장 표준(SGMS)은 최고 수준의 품질과 순도를 보장하여 투자자의 신뢰를 담보합니다. 정교한 기반시설과 강력한 법체계의 뒷받침 속에서, 싱가포르를 통한 금 투자는 비할 데 없는 안전성과 유동성을 제공합니다."
 SIN_army_infantry_equipment: "보병 장비"
 SIN_army_infantry_equipment_desc: "현대 보병 장비는 경량이고 적응성 높으며 기술적으로 앞선 장구를 우선시하여 병사의 생존성과 전투 효율을 높입니다. 경량 소재와 첨단 통신 체계는 작전 효율을 향상시킵니다."
 SIN_neutrality_pressure_delayed_tt: "§Y전제 조건:§!\n[!reduce_foreign_pressure_click_enabled]\n§Y효과:§!\n[!reduce_foreign_pressure_click]\n"
 SIN_tuas_business_area_development: "투아스 상업 지구 개발"
 SIN_tuas_business_area_development_desc: "이는 미래를 위한 전략적 비전입니다. 이 야심 찬 사업은 싱가포르의 산업 역량을 확대하여 물류와 제조를 위한 현대적이고 효율적인 허브를 만듭니다. 싱가포르의 경제적 미래를 확보하고 무역과 혁신의 세계적 선두 주자로서의 입지를 강화하는 대담한 걸음입니다."
 SIN_world_diplomacy_effort: "세계 외교 노력"
 SIN_world_diplomacy_effort_desc: "더 큰 강국들에 둘러싸인 소국인 싱가포르의 안보는 외교에 달려 있습니다. 우리는 세계와의 교류에 전력을 다하고, 도시국가의 안전과 번영을 지켜줄 관계를 구축할 것입니다."
 SIN_go_west: "서방으로"
 SIN_go_west_desc: "싱가포르는 서방 강국들과의 유대를 심화할 것입니다. 그들의 시장, 자본, 안보 보장은 무역 국가에게 가장 믿을 만한 발판을 제공합니다."
 SIN_go_east: "동방으로"
 SIN_go_east_desc: "싱가포르는 아시아 이웃 국가들과 동방의 부상하는 강국들로 눈을 돌릴 것입니다. 지역과의 긴밀한 제휴는 무역과 투자, 그리고 우리 대륙 문제에 대한 발언권을 약속합니다."
 SIN_go_third_world_country: "개발도상국의 선두에 서다"
 SIN_go_third_world_country_desc: "싱가포르는 개발도상국의 대의를 옹호할 것입니다. 이들 가운데 지도자가 되면 국가 규모를 훨씬 넘어서는 영향력을 지니게 되며, 많은 이들의 벗이 되면 누구에게도 얽매이지 않게 됩니다."
 SIN_free_active_politic: "자유롭고 적극적인 외교 정책"
 SIN_free_active_politic_desc: "싱가포르는 블록 제휴에 얽매이지 않고 오직 국익에 따라 움직이는 독립적인 외교 정책을 추구할 것입니다. 우리는 모두와 교류하되 누구에게도 종속되지 않습니다."
 SIN_nautral_army: "중립 군대"
 SIN_nautral_army_desc: "중립국 싱가포르에도 신뢰할 만한 방위력은 필요합니다. 싱가포르군은 억지력을 중심으로 군살 없이 전문적으로 편성되어, 어떤 침략이든 감히 시도하기엔 너무 값비싼 대가를 치르게 만들 수 있어야 합니다."
 SIN_ally_with_nato: "주요 비NATO 동맹국이 되기"
 SIN_ally_with_nato_desc: "싱가포르는 주요 비NATO 동맹국으로서 NATO 강국들과의 긴밀한 방위 협력을 공식화할 것입니다. 이들의 안보 우산은 정회원국의 의무 없이도 도시국가에 대한 모든 위협에 맞서는 강력한 보장을 제공합니다."
 SIN_join_brics: "BRICS 가입"
 SIN_join_brics_desc: "싱가포르는 BRICS에 가입하여 세계 질서를 재편하는 신흥 경제국들과 운명을 함께할 것입니다. 그들 속의 한 자리는 곧 미래에 대한 지분입니다."
 SIN_join_brics_faction: "BRICS 세력 가입"
 SIN_join_brics_faction_desc: "싱가포르는 경제적 파트너십을 넘어 BRICS 강국들과 공식 동맹을 맺을 것입니다. 도시국가는 자국의 안보를 부상하는 다극 블록에 결속시킵니다."
 SIN_join_sco: "SCO 가입"
 SIN_join_sco_desc: "싱가포르는 상하이 협력 기구에 가입할 것입니다. 회원국 자격은 도시국가를 베이징과 모스크바가 주도하는 유라시아 안보 및 경제 질서에 결속시킵니다."
 SIN_navy_sailor_fast_learner: "빠른 학습자"
 SIN_navy_sailor_fast_learner_desc: "싱가포르 해군은 승조원을 위한 속성 훈련에 투자합니다. 기량을 빠르게 익힌 수병들은 소규모 함대를 날카로운 함대로 탈바꿈시킵니다."
 SIN_navy_sailor_daily_activity: "일일 훈련"
 SIN_navy_sailor_daily_activity_desc: "끊임없는 훈련은 함대의 준비 태세를 유지시켜 줍니다. 항해술, 피해 통제, 포술에 대한 일상적인 훈련은 싱가포르 해군이 결코 준비되지 않은 상태로 기습당하지 않도록 보장합니다."
 SIN_ri_invest_to_malaysia: "말레이시아에 투자"
 SIN_ri_invest_to_malaysia_desc: "싱가포르는 코즈웨이 너머 말레이시아로 투자를 돌릴 것입니다. 가장 가까운 이웃 국가와의 긴밀한 경제적 유대는 공동의 번영과 보다 안정적인 국경을 가져옵니다."
 SIN_ri_invest_to_indonesia: "인도네시아에 투자"
 SIN_ri_invest_to_indonesia_desc: "싱가포르는 인도네시아의 광대하고 성장하는 경제에 자본을 쏟아부을 것입니다. 이 군도는 무시하기에는 너무 큰 시장이며 너무 가까운 이웃입니다."
 SIN_ri_invest_to_thailand: "태국 투자"
 SIN_ri_invest_to_thailand_desc: "싱가포르는 태국에 대한 투자를 확대하여 동남아시아 대륙부에서의 입지를 다지고 지역 무역의 유대를 심화할 것입니다."
 SIN_gi_invest_to_europian_union_country: "유럽 연합에 투자"
 SIN_gi_invest_to_europian_union_country_desc: "싱가포르는 보유 자금을 유럽 연합 시장으로 돌릴 것입니다. 세계 최대의 단일 시장에 대한 접근은 투자금을 여러 배로 보상해 줄 것입니다."
 SIN_gi_invest_to_csto_nation: "CSTO 국가 투자"
 SIN_gi_invest_to_csto_nation_desc: "싱가포르는 CSTO 국가들로 자본을 확장할 것입니다. 유라시아의 새로운 시장은 도시국가의 경제적 영향 범위를 다변화하고, 경쟁국들이 닫아 둔 문을 열어줍니다."
 SIN_gi_invest_to_africa_nation: "아프리카에 투자"
 SIN_gi_invest_to_africa_nation_desc: "싱가포르는 아프리카 대륙에서 기회를 모색할 것입니다. 빠르게 성장하는 경제에 대한 조기 투자는 도시국가를 경쟁자들보다 앞서 나가게 합니다."
 SIN_efr_invest_to_america: "미국 투자"
 SIN_efr_invest_to_america_desc: "싱가포르는 외환 보유고를 미국에 투입할 것입니다. 세계에서 가장 깊고 유동성이 풍부한 시장은 도시국가의 자산에 수익과 안정성을 모두 제공합니다."
 SIN_efr_invest_to_swiss: "스위스에 투자"
 SIN_efr_invest_to_swiss_desc: "싱가포르는 외환 보유고를 스위스로 돌릴 것입니다. 스위스 금융의 안정성은 신중한 무역 국가의 저축이 자리 잡기에 자연스러운 보금자리입니다."
 SIN_deepen_western_defense: "서방과의 방위 유대 심화"
 SIN_deepen_western_defense_desc: "싱가포르는 서방 파트너들과의 합동 훈련, 정보 공유, 무기 조달을 확대할 것입니다. 긴밀한 협력은 먼 동맹에 얽히지 않으면서도 도시국가의 안보를 굳건히 해줍니다."
 SIN_neutral_army: "중립 군대"
 SIN_neutral_army_desc: "싱가포르 군은 정복이 아니라 억제와 영토 방위를 위해 만들어졌습니다. 소규모이지만 잘 훈련된 병력이 세심한 계획의 뒷받침을 받아, 이웃 나라들을 놀라게 하지 않으면서 도시국가를 안전하게 지킵니다."
 singapore.129.t: "제야레트남, 심장마비로 사망"
 singapore.129.d: "오랜 기간 야당 인사였던 J. B. 제야레트남이 몇 시간 전 심장마비로 사망했습니다. 야당은 노동자당의 사랑받던 지도자이자 인민행동당에 맞서고 싱가포르 정부의 더 큰 정치적 자유를 위해 적극적으로 운동해 온 저명한 지도자를 잃은 데 대해 애도하고 있습니다. 더 많은 야당 인사가 그 자리를 메우기 시작하는 것은 시간문제입니다."
 singapore.129.a: "유족을 위해 기도한다."
 SIN_harsher_state_tt: "[conservatism_L], [Autocracy_L], [Neutral_Autocracy_L], [Nat_Autocracy_L]을(를) 제외한 모든 정당을 금지합니다.\n"
 SIN_energy_efforts_idea: "에너지 대책"
 SIN_energy_efforts_idea_desc: "우리 도시의 미래는 가장 중요한 기반시설의 안전성 위에서 번영합니다. 에너지는 우리가 해결하고 확보해야 하는 그런 문제 중 하나이며, 그래야 우리 아이들의 아이들이 결코 걱정하지 않아도 됩니다."
 SIN_pro_lgbtqa_stance_idea: "성소수자 지지 입장"
 SIN_pro_lgbtqa_stance_idea_desc: "우리 정부는 성소수자를 지지하는 입장을 취했습니다."
