 BOS_politicized_army: "정치화된 군대"
 BOS_srpska_lead_government_desc: "스릅스카 주도 연립은 정치체 기관을 수호하고 동방의 협력국을 추구한 뒤, 협력적 연방주의와 정치적 우위 중 하나를 선택할 것입니다."
 BOS_expand_federalization_desc: "정치체의 권한을 강화하면 지방 기관을 보호하는 동시에 보스니아의 외교 및 국방 정책의 일관성을 유지할 수 있습니다."
 BOS_politicized_army_desc: "정치체에 대한 충성과 정치적 임명은 여전히 군대를 분열시키고 있습니다. 점진적 통합은 전문적인 국가 기관을 만들어 낼 수 있습니다."
 BOS_anti_government_demonstrations: "반정부 시위"
 BOS_politicized_army_idea: "정치화된 군대"
 BOS_politicized_army_idea_desc: "병립하는 충성 관계, 정치적 임명, 분리된 전시 전통이 국가 지휘를 방해합니다. 연이은 개혁을 통해 군대를 전문적인 기관으로 바꿔 놓을 수 있습니다."
 BOS_aggressive_nation: "공격적 태세"
 BOS_aggressive_nation_desc: "국가는 전쟁 목표를 추구하기 위해 공격적인 군사 태세를 취했습니다."
