 ALG_oil_focused_energy_small_profit_desc: "A Argélia decidiu utilizar seus recursos petrolíferos inexplorados para se tornar autossuficiente na produção de energia. Embora barato e de fácil acesso, o petróleo não é a abordagem mais ecológica."
