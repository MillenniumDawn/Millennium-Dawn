 UKR_develop_kentavr_spaa: "Develop §YZRAK 'Kentavr'§!"
 UKR_develop_2s22: "Develop §Y2S22§! SP Artillery System"
 UKR_develop_2s22_desc: "\n\n\n\n\n\n£UKR_desctext_2s22_for_tooltip\n\n\n\n\n\n\n\n\nThe 2S22 'Bohdana' is a Ukrainian 155 mm self-propelled howitzer, developed by Kramatorsk Heavy Machine Tool Building Plant to provide the Ukrainian Armed Forces with modern NATO-standard artillery capabilities.\nThe system is mounted on a wheeled chassis, providing high operational mobility and allowing it to rapidly change firing positions after engaging the enemy.\nThe 155 mm gun is capable of employing standard NATO artillery ammunition, significantly increasing the range and firepower available to Ukrainian artillery units.\nIts automated fire-control and navigation systems allow the crew to rapidly determine firing data and engage targets with greater accuracy.\nThe development of the 'Bohdana' represents a major step in the modernization of Ukrainian artillery and the transition toward NATO-standard weapon systems."
 UKR_modernize_su25_m1: "Modernize §YSu-25§! strike aircraft"
 UKR_modernize_su27_1m: "Modernize §YSu-27§! fighter aircraft"
 UKR_modernize_mig29_mu2: "Modernize §YMiG-29 variant MU2§! fighter aircraft"
 UKR_modernize_mig29_mu1: "Modernize §YMiG-29 variant MU1§! fighter aircraft"
 UKR_develop_an_lbl: "Develop a Proposed §YAntonov Light Aircraft§!"
 UKR_develop_an_lbl_desc: "\n\n\n\n\n\n£UKR_desctext_an_lbl_development_for_tooltip\n\n\n\n\n\n\n\n\nThe Antonov Light Aircraft is a proposed light aircraft designed by the Antonov Design Bureau that is expected to be close to Yak-130. It is intended for use in various roles, including training and reconnaissance.The aircraft is expected to feature advanced avionics, a lightweight airframe, and efficient engines to provide excellent performance and fuel efficiency."
 UKR_develop_an_bfv: "Develop a Proposed §YAntonov Fighter Aircraft§!"
 ukraine_develop_2s22.1.name: "Develop §Y2S22 'Bohdana'§! SPG"
 ukraine_develop_2s22.1.desc: "As we speak, technology advances further, and our weapons stays the same.\nWe need to develop our own new SPG for our forces"
 ukraine_develop_2s22.1.a: "Provide basic amount of funds"
 ukraine_develop_2s22.1.b: "Provide extensive amount of funds"
 ukraine_develop_2s22.2.name: "KrZVV has developed a project of a new SPG"
 ukraine_develop_2s22.2.desc: "We have checked and are sure now, that KrZVV did create a new SPG project for our military.\nHowever, due to insufficient funds we provided, they were not able to create new barrel and had to use old soviet one instead."
 ukraine_develop_2s22.2.a: "Ok, let's start the production!"
 ukraine_develop_2s22.3.name: "KrZVV has developed a project of a new SPG"
 ukraine_develop_2s22.3.desc: "We have checked and are sure now, that KrZVV did create a new SPG project for our military.\nMoreover, due to additional funds we provided, they developed devery aspect of the SPG from scratch, new and strong!."
 ukraine_develop_2s22.3.a: "Great, let's start the production!"
 UKR_develop_stuhna_p_atgm: "Develop §YRK-2 'Stuhna-P'§!"
 UKR_develop_stuhna_p_atgm_desc: "The Stugna-P, known by its export version Skif, is a Ukrainian anti-tank guided missile (ATGM) system developed in the early 2010s by the Luch Design Bureau.\nThe Stugna-P is designed to destroy modern armored targets with combined carried or monolithic armor, including explosive reactive armor (ERA).\nStugna-P can attack both stationary and moving targets.\nThey can attack from both long range up to 5 kilometres in the daytime and close range to 100 metres."
 UKR_develop_corsar_atgm: "Develop §YRK-3 'Corsar'§!"
 UKR_develop_corsar_atgm_desc: "The RK-3 Corsar is a Ukrainian light portable anti-tank guided missile developed by Luch State Kyiv Design Bureau.\nThe Corsar is likely to replace Soviet era anti-tank systems such as the 9M113 Konkurs and 9K111 Fagot.\nt is intended to destroy stationary and moving armored targets. It can also be used against emplacements, light-armored objects and helicopters.\nFiring can be carried out from the mount as well as from a trench parapet. A method of guidance is laser beam riding."
 UKR_modernize_stuhna_p_atgm: "Modernize §YRK-2 'Stuhna-P'§!"
 UKR_modernize_stuhna_p_atgm_desc: "We can further modernize the Stugna-P ATGM complex, to better stay in touch with current threats."
 UKR_develop_bulava_atgm: "Develop §Y'Bulava'§!"
 UKR_develop_bulava_atgm_desc: "Future ATGM complex with fire-and-forget capabilities.\nAll information is classified at the moment."
 UKR_develop_stuhna_p_flag: "Completed decision Develop RK-2 Stuhna-P"
 UKR_develop_corsar_flag: "Completed decision Develop RK-3 Corsar"
 UKR_develop_kba27: "Develop KBA-27 self-propelled Artillery"
 UKR_develop_kba27_desc: "The KBA-27 is a Ukrainian 152 mm howitzer derived from the Soviet 2A61 Pat-B. An experimental variant mounted the gun on a PTS-2 amphibious transporter, combining heavy artillery firepower with high mobility and amphibious capabilities. Further development could transform this prototype into a viable self-propelled artillery system."
 UKR_modernize_stuhna_p_flag: "Completed decision Modernize RK-2 Stuhna-P"
 UKR_develop_baryer_s: "Develop §Y'Baryes-S'§!"
 UKR_develop_baryer_s_desc: "The Baryer-S is a Ukrainian anti-tank guided missile (ATGM) system developed by the Luch Design Bureau based on the Shturm-S ATGM.\nThe Baryer-S is designed to destroy modern armored targets with combined carried or monolithic armor, including explosive reactive armor (ERA)."
