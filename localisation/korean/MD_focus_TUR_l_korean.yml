 TT_TUR_ALIGN_AZERBAIJAN: "\n[AZE.GetName]의 동맹 가능성은 §G높음§!으로 고정됩니다\n\n다음의 경우 [AZE.GetName]의 동맹 가능성이 높아집니다:\n §G-그들이 국가주의 관점을 따르고 있음§!\n\n다음의 경우 [AZE.GetName]의 동맹 가능성이 낮아집니다:\n §R-그들이 비동맹 관점을 따르고 있음\n -이미 다른 이들과 동맹 중임§!\n"
 TT_TUR_ALIGN_IRAN: "\n[PER.GetName]의 동맹 가능성은 §G높음§!으로 고정됩니다\n\n다음의 경우 [PER.GetName]의 동맹 가능성이 낮아집니다:\n §R-그들이 비동맹 관점을 따르고 있음\n -이미 다른 이들과 동맹 중임§!\n"
 TT_TUR_ALIGN_IRAQ: "\n[IRQ.GetName]의 동맹 가능성은 §G높음§!으로 고정됩니다\n\n다음의 경우 [IRQ.GetName]의 동맹 가능성이 낮아집니다:\n §R-그들이 서방 관점을 따르고 있음\n -이미 다른 이들과 동맹 중임§!\n"
 TT_TUR_ALIGN_SYRIA: "\n[SYR.GetName]의 동맹 가능성은 §R낮음§!으로 고정됩니다\n\n다음의 경우 [SYR.GetName]]의 동맹 가능성이 높아집니다:\n §G-그들이 하타이를 수복하여 통제중임\n -그들이 하타이의 영유권을 재주장함§!\n\n다음의 경우 [SYR.GetName]의 동맹 가능성이 낮아집니다:\n §R-그들이 비동맹 관점을 따르고 있지 않음\n -이미 다른 이들과 동맹 중임\n -그들이 쿠르디스탄 노동자당 (PKK)를 지원 중임§!"
 TT_TUR_ALIGN_SYRIA_DEMANDS: "§Y\n시리아는 하타이의 상태에 대해 재조사를 요구할지도 모릅니다§!"
 TUR_through_troubles: "위기를 견뎌라"
 TUR_through_troubles_desc: "튀르키예는 현재 경제 위기를 겪고 있습니다. 우리는 정부가 이를 헤쳐 나갈 수 있음을 국민에게 확신시켜야 합니다."
 TUR_conservative_victory: "보수주의의 승리"
 TUR_conservative_victory_desc: "보수주의자들이 선거에서 승리했으며, 이슬람의 더 보수적인 요소들을 튀르키예에 들여오기 시작할 수 있습니다."
 TUR_gulenist_victory: "귤렌의 승리"
 TUR_gulenist_victory_desc: "귤렌주의자들이 부패한 AKP 당원들을 몰아냈습니다. 이는 민주주의의 위대한 승리입니다."
 TUR_peace_with_religious_leaders: "종교 지도자와의 평화"
 TUR_peace_with_religious_leaders_desc: "귤렌주의가 매우 특정한 형태의 이슬람을 설파하기는 하나, 튀르키예의 종교 지도자들을 고려하는 것이 중요합니다. 우리는 모든 종파가 자유롭게 가르침을 전파할 수 있도록 허용해야 합니다."
 TUR_gulenist_schools: "귤렌식 학교"
 TUR_gulenist_schools_desc: "교육은 페툴라흐 귤렌의 핵심 원칙 중 하나입니다. 올바른 교육은 정신을 건강하게 유지하고 사람들이 올바른 사상을 따르도록 합니다."
 TUR_modern_islam: "현대 이슬람"
 TUR_modern_islam_desc: "이슬람은 서구의 가치 및 민주주의와 완벽하게 양립할 수 있습니다. 우리는 신에 대한 믿음이 우리를 더 나은, 더 이해심 많은 사람으로 만든다는 것을 세계에 증명해야 합니다."
 TUR_mobilising_the_movement: "귤렌의 움직임을 통한 지원"
 TUR_mobilising_the_movement_desc: "귤렌 운동은 전 세계에 구성원이 있습니다. 우리의 네트워크는 우리에게 활용할 수 있는 많은 자원을 제공할 것입니다."
 TUR_interfaith_dialogue: "종교 간 대화"
 TUR_interfaith_dialogue_desc: "귤렌은 우리에게 다른 종교를 이해하라고 가르칩니다. 이슬람이 뒤처지지 않도록 세계의 다른 주요 종교들과 좋은 관계를 맺는 것이 중요합니다. 우리는 비이슬람 국가의 성직자들과 외교적 대화를 가져야 합니다."
 TUR_gulenist_funds: "귤렌의 자금"
 TUR_gulenist_funds_desc: "귤렌주의 조직은 다양한 재단과 기업에 수십억 달러 가치를 보유하고 있습니다. 우리는 정권을 돕기 위해 이 자금을 동원해야 합니다."
 TUR_gulenist_economists: "귤렌 (Gülen) 경제학자"
 TUR_gulenist_economists_desc: "대규모 국제 전문가 집단에서 인력을 충원하여, 경제 운영 방법에 대해 정부에 자문할 전문 경제학자들을 고용할 수 있습니다."
 TUR_gulenist_information: "귤렌의 정보원"
 TUR_gulenist_information_desc: "우리의 방대한 네트워크를 활용하면 외국에 대한 정보를 더 쉽게 수집할 수 있습니다."
 TUR_gulenist_education: "귤렌식 교육"
 TUR_gulenist_education_desc: "교육에 집중하는 것이 튀르키예를 앞으로 나아가게 하는 열쇠가 될 것입니다."
 TUR_the_great_mediator: "위대한 중재자"
 TUR_the_great_mediator_desc: "페툴라흐 귤렌은 위대한 지도자이자 학자이며 외교관입니다. 그는 평화의 사람이며 오직 세계의 평화와 번영만을 바랍니다."
 TUR_approach_tradition: "전통에 다가서라"
 TUR_approach_tradition_desc: "우리의 승리는 사람들이 전통을 갈망한다는 것을 보여 주었습니다. 우리는 이슬람 세계가 르네상스를 겪고 있으며 곧 지구상의 지배적인 문화가 될 것임을 보여 주어야 합니다."
 TUR_reduce_freedom_of_press: "언론의 자유 축소"
 TUR_reduce_freedom_of_press_desc: "이른바 '자유 언론'은 이슬람을 비방하고 언론의 추악한 세속주의 사상을 퍼뜨리는 도구에 불과합니다. 이들의 활동 능력을 제한해야 하며, 필요하다면 폐쇄해야 합니다."
 TUR_mobilise_the_faithful: "귤렌 충성파 동원"
 TUR_mobilise_the_faithful_desc: "귤렌 운동은 방대하며 수많은 구성원을 보유하고 있습니다. 우리는 구성원들이 튀르키예로 이주하도록 장려해야 합니다."
 TUR_convert_radicals: "급진파 개종"
 TUR_convert_radicals_desc: "귤렌이 가르치는 이슬람이 유일하게 올바른 이슬람의 형태입니다. 이에 동의하지 않는 이들이 많으며, 그들은 뿌리 뽑혀야 합니다."
 TUR_beacon_of_islam: "위대한 학자"
 TUR_beacon_of_islam_desc: "페툴라흐 귤렌은 가장 위대한 이슬람 학자이며, 그의 가르침은 전 세계에 알려질 것입니다. 물론 보수적인 이슬람을 설파하는 데에는 약간의 부작용이 따를 수도 있겠지만..."
 TUR_economic_reforms: "경제 개혁"
 TUR_economic_reforms_desc: "경제는 엉망이며 우리는 이를 신속히 개선해야 합니다. 현재 경제는 외국인 투자에 크게 의존하고 있으며, 이는 우리가 바꿔야 할 부분입니다."
 TUR_increase_unemployment_insurance: "실업 보험 확대"
 TUR_increase_unemployment_insurance_desc: "경제 위기로 많은 튀르키예인이 일자리를 잃었습니다. 정부 예산에 큰 타격을 주겠지만, 사람들이 살아갈 수 있도록 실업 급여를 늘려야 합니다. 이는 또한 경제에 소액의 자금을 주입하여 소비를 늘릴 것으로 기대됩니다."
 TUR_small_imf_loans: "소규모 국제통화기금 대출"
 TUR_small_imf_loans_desc: "IMF가 114억 달러의 소규모 대출을 제안했습니다. 많은 분석가들은 이 금액으로는 튀르키예 경제를 돕기에 턱없이 부족하다고 지적하지만, IMF로부터 더 얻어낼 수 있을지는 의문입니다."
 TUR_large_imf_loans: "대규모 국제통화기금 대출"
 TUR_large_imf_loans_desc: "더 많은 양보를 한다면 IMF와 협상하여 더 큰 규모의 대출을 받을 수 있을지도 모릅니다."
 TUR_reduce_foreign_investors: "투자자들의 의존도 감소"
 TUR_reduce_foreign_investors_desc: "튀르키예 경제의 대부분은 지속적인 외국인 투자와 다른 나라로부터의 자본 유입에 기반하고 있습니다. 우리는 정부 자금을 경제에 투입하고 해외 시장에 대한 의존도를 줄여야 합니다."
 TUR_more_foreign_investors: "투자자들의 의존도 확대"
 TUR_more_foreign_investors_desc: "우리는 다른 나라들로부터 더 많은 자본을 얻기 위해 외국인 투자자를 적극 활용해야 합니다."
 TUR_sell_government_companies: "공기업 매각"
 TUR_sell_government_companies_desc: "추가 수입을 얻기 위해 현재 튀르키예 국가가 소유한 일부 기업을 매각해야 합니다."
 TUR_loosen_industrial_regulations: "산업 규제 완화"
 TUR_loosen_industrial_regulations_desc: "성장을 촉진하기 위해 산업에 부과한 규제를 완화해야 합니다. 이는 분명 경제를 활성화할 것입니다."
 TUR_economic_crisis_over: "경제 위기 회복 방안"
 TUR_economic_crisis_over_desc: "튀르키예 국가가 경제적으로 번영하기를 기대한다면 가능한 한 빨리 경제 회복 계획을 수립해야 합니다. 그렇지 않으면 국민의 생명과 일자리를 위험에 빠뜨리게 되며, 우리는 그렇게 막대한 손실을 감당할 수 없습니다."
 TUR_western_development: "서부 개발"
 TUR_western_development_desc: "우리나라 주요 도시 대부분이 서부에 있고 국민이 더 높은 생활 수준을 기대하는 만큼 서부를 발전시켜야 합니다."
 TUR_centeral_development: "중앙 개발"
 TUR_centeral_development_desc: "우리의 수도 앙카라는 나라의 중앙에 위치해 있습니다. 우리의 정치 체제가 정당성의 기반을 가질 수 있도록 그곳과 주변 도시들의 생활 환경을 개선해야 합니다."
 TUR_eastern_development: "동부 개발"
 TUR_eastern_development_desc: "우리는 너무 오랫동안 동부 지방을 방치해 왔으며, 그곳 사람들은 더 나은 대우를 받을 자격이 있습니다. 그곳의 기반시설을 개선하면 농촌 주민들에게 훨씬 더 큰 도움이 될 것입니다."
 TUR_southern_attention: "남쪽에 집중"
 TUR_southern_attention_desc: "동부와 마찬가지로 우리나라 남부도 어느 정도 잊혀 왔습니다. 경제가 번영하려면 남부에 대한 투자가 필요합니다."
 TUR_the_industries: "\"산업\""
 TUR_the_industries_desc: "우리의 산업 부문은 이웃 나라와 동맹국에 뒤처지기 시작했으며, 이를 바꿔야 합니다. 튀르키예 기업들이 스스로 잘해 나갈 수 있도록 예산의 일부를 할당할 것입니다."
 TUR_bereket: "베레케트 에너지"
 TUR_bereket_desc: "베레케트는 튀르키예 국민에게 청정하고 재사용 가능한 에너지를 공급하며, 앞으로도 계속 그래야 합니다. 추가 자금 지원은 그들이 확장하고 성장할 수 있게 해 줄 것입니다."
 TUR_petroli_anonim: "터키 석유 연합 (TPAO) 국영 석유 기업"
 TUR_petroli_anonim_desc: "페트롤레리 아노님은 1954년에 설립되어 튀르키예 석유 부문에서 많은 성과를 이루었습니다. 우리는 우리 자신과 세계 나머지 지역을 위해 더 많은 석유를 생산하는 데 산업의 초점을 옮겨야 합니다."
 TUR_the_factories: "\"공장\""
 TUR_the_factories_desc: "우리의 공장은 낡고 구식이 되어 비효율적이 되어 가고 있습니다. 나라의 북서부에 위치한 새 공장은 상황을 훨씬 더 개선해 줄 것이며, 더 많은 사람들이 그곳에서 일하도록 이주시킬 수 있습니다."
 TUR_kipas_textile: "키파스 (Kipas) 면직"
 TUR_kipas_textile_desc: "크파시 섬유는 우리나라에서 가장 품질 좋은 직물을 생산하며, 우리 경제에 다른 나라에 수출할 수 있는 것을 제공합니다."
 TUR_arkas_shipping: "아르카스 (Arkas) 배송"
 TUR_arkas_shipping_desc: "아르카스는 전 세계로 화물을 운송하는 국영 해운 회사입니다. 우리가 해야 할 일은 매우 분명합니다. 그들이 문제없이 계속 이곳저곳을 오갈 수 있도록 새로운 조선소를 마련해 주는 데 집중해야 합니다."
 TUR_the_people: "\"사회 기반\""
 TUR_the_people_desc: "경제를 개선하면서 우리가 경제를 개선하는 이유인 국민을 잊어서는 안 됩니다. 국민은 생활 수준을 높일 국가적 차원의 개선이 필요합니다."
 TUR_hakarri_trabzone_railway: "하카리 - 트라브존 철도"
 TUR_hakarri_trabzone_railway_desc: "우리나라 동부에 사는 사람들을 위해 하카리와 트라브존을 연결할 것입니다. 이렇게 하면 그들은 여행을 떠나고 싶을 때 트라브존 항구를 오갈 수 있습니다."
 TUR_istanbul_airport: "터키 항공 확장"
 TUR_istanbul_airport_desc: "튀르키예 항공은 국내에서 운영되는 우리의 항공사이며, 우리는 이들을 위해 새로운 공항 몇 곳의 건설을 시작할 것입니다. 우리 국민은 튀르키예 항공기를 이용한다는 것을 알면서 튀르키예 국내외를 쉽게 여행할 수 있을 것입니다."
 TUR_the_neighbors: "\"이웃들\""
 TUR_the_neighbors_desc: "우리를 둘러싼 이웃 나라들은 경제 위기를 해결하는 데 결정적일 것입니다. 우리는 투자를 통해 영향력과 양국 간 경제적 유대를 얻을 것입니다."
 TUR_look_west: "서쪽의 이웃들"
 TUR_look_west_desc: "서쪽 이웃인 그리스와 불가리아는 경제 면에서 상당한 어려움을 겪어 왔습니다. 그러므로 부상하는 경제 거점인 이들에게 투자하는 것이 현명할 것입니다."
 TUR_look_east: "동쪽의 이웃들"
 TUR_look_east_desc: "동쪽 이웃인 이란, 아르메니아, 조지아는 모두 경제 성장과 붕괴를 겪었습니다. 그들의 경제가 좀 더 성장하도록 돕기 위해 이들 나라에 투자할 것입니다."
 TUR_the_military: "\"군대\""
 TUR_the_military_desc: "군대는 우리 경제를 유지하는 데 상당히 중요할 것입니다. 부디 그들이 우리를 권력에서 몰아내기 위해 쿠데타를 시도하지 않기를 바랄 뿐입니다."
 TUR_fix_samsites: "Repair SAM Sites"
 TUR_fix_samsites_desc: "우리나라의 지대공 미사일 기지들이 노후하기 시작했습니다. 제대로 작동하기를 기대한다면 수리해야 합니다."
 TUR_ministry_of_defense_repairs: "국방부 요구 충족"
 TUR_ministry_of_defense_repairs_desc: "국방부는 우리에게 더 많은 군수 산업을 개방해 달라고 요청해 왔으며, 오늘 우리는 바로 그것을 허락할 것입니다."
 TUR_funds_for_tubitak_sage: "국립방산연구원 (TUBITAK Sage)"
 TUR_funds_for_tubitak_sage_desc: "투비탁 사게는 우리나라의 방위 산업 연구 개발 기관입니다. 우리 군사 기술을 최신으로 유지하려면 그들에게 추가 시설을 제공해야 합니다."
 TUR_stage_two: "2 단계"
 TUR_stage_two_desc: "우리는 마침내 경제 계획의 2단계에 진입합니다. 이 단계에서 우리는 경제 부양을 확대하고 통치를 중앙집권화할 것입니다."
 TUR_economic_stimulation: "경제적 자극"
 TUR_economic_stimulation_desc: "우리는 경제가 인위적이 아닌 자연스럽게 돌아가고 성장하도록 추가 자금을 경제에 투입할 것입니다."
 TUR_national_power_grid: "국가 전력망 확장"
 TUR_national_power_grid_desc: "우리나라 인구가 증가하면서 전기를 사용하는 사람이 늘어나 전력망이 제대로 작동하지 못하고 정전이 늘어나고 있습니다. 전력망을 확장하면 전국의 모든 가정에 안정적인 전력을 공급할 수 있을 것입니다."
 TUR_the_budgets: "예산 조정"
 TUR_the_budgets_desc: "우리는 무엇을 우선시해야 하고 무엇을 우선시하지 않아도 되는지 확인하기 위해 예산을 개정해야 합니다."
 TUR_funds_for_social_spending: "사회 복지 우선"
 TUR_funds_for_social_spending_desc: "우리 국민, 특히 은퇴자와 장애인은 생활을 이어 가기 위해 정부 자금에 의존합니다. 우리는 그들이 어려울 때 돕는 것을 우선시해야 합니다."
 TUR_funds_for_healthcare: "의료 체계 우선"
 TUR_funds_for_healthcare_desc: "당연히 사람들은 병에 걸릴 것입니다. 의료비 지출을 우선시하여 도움이 필요한 이들이 파산하지 않고도 위급한 상황에서 벗어날 수 있도록 해야 합니다."
 TUR_funds_for_tubitak_mam: "국립환경에너지연구원 (TUBITAK Mam)"
 TUR_funds_for_tubitak_mam_desc: "투비탁 맘은 국내에서 운영되는 연구 센터이며, 우리는 이들을 활용하여 국민의 건강과 복지를 위한 저렴하면서도 효과적인 새로운 해법을 찾아야 합니다."
 TUR_stage_three: "3 단계"
 TUR_stage_three_desc: "3단계에서는 우리 경제를 지식 기반 경제로 전환하는 것을 우선시할 것입니다. 이렇게 하면 국민이 좋은 돈을 벌기 위해 제대로 된 교육을 받도록 동기가 부여될 것입니다."
 TUR_research_grants: "연구 승인 "
 TUR_research_grants_desc: "우리는 과학자와 학생들이 일상생활의 새로운 해법을 찾을 수 있도록 연구 보조금을 지급할 것입니다. 이렇게 하면 그 어느 때보다 빠르게 현대화할 수 있으며, 우리의 기술 역량을 확대할 수 있습니다."
 TUR_energy_research: "에너지 연구"
 TUR_energy_research_desc: "경제 계획 1단계에서 우리는 에너지 부문의 효율을 높이기 위해 에너지 기업에 자금을 지원했습니다. 그러나 이제 필요한 곳에서 비용을 줄일 수 있도록 이 에너지를 공급하고 생산하는 새로운 방법을 찾아야 합니다."
 TUR_industrial_research: "산업 연구"
 TUR_industrial_research_desc: "우리는 매일 더 많이 생산하기를 원하며, 그러기 위해 상품을 생산하는 새로운 방법을 찾아야 합니다."
 TUR_electronic_research: "전자기 연구"
 TUR_electronic_research_desc: "전 세계가 디지털로 나아가고 있으며 튀르키예도 예외일 수 없습니다. 우리는 새로운 기술을 연구하고 이를 돕기 위한 몇몇 새 기업을 출범시킬 것입니다."
 TUR_tubitak_space: "국립항공우주연구원 (TUBITAK Space)"
 TUR_tubitak_space_desc: "투비탁 스페이스는 국내에서 운영되는 우리의 우주 기술 연구소가 될 것이며, 우주로 나아갈 때가 오면 우리가 앞서 나가는 데 크게 기여할 것입니다."
 TUR_sattelite_development: "Satellite Development"
 TUR_sattelite_development_desc: "새로운 기술이 사람들 간의 연결성이라는 새 시대를 열어 감에 따라, 우리 국민이 세계와 연결될 수 있도록 새로운 위성 기술을 개발할 것입니다."
 TUR_gokturk_launch: "Goktürk Satellite Launch"
 TUR_gokturk_launch_desc: "우리는 괵튀르크-1A 위성을 우주로 발사할 것이며, 이는 고화질의 지구 영상을 얻는 데 도움이 되어 국민과 군대 모두에게 기여할 것입니다."
 TUR_funds_for_tai: "터키 항공우주 산업 확장"
 TUR_funds_for_tai_desc: "국민에게 더 많은 일자리를 제공하려면 튀르키예 항공우주산업이 확장을 시작해야 합니다. 우리는 이를 군사화하여 우주전 기술을 생산하기 시작할 것입니다."
 TUR_asteroid_mining_missions: "소행성 채굴 임무"
 TUR_asteroid_mining_missions_desc: "지구의 자원을 아낄 수 있도록 귀금속과 자원을 얻기 위한 소행성 채굴을 시작할 것입니다."
 TUR_drilling_technology: "채굴 기술"
 TUR_drilling_technology_desc: "소행성 채굴을 시작했으니, 더 크고 단단한 소행성을 채굴하기 위한 새로운 굴착 기술이 필요합니다."
 TUR_launching_facilities: "발사 시설"
 TUR_launching_facilities_desc: "소행성 임무를 발사하려면 새로운 발사 시설이 필요합니다. 현재 보유한 시설은 낡아서 무너지고 구식이 되어 가고 있으며, 새 시설이 필수적입니다."
 TUR_mission_to_moon: "달의 튀르크"
 TUR_mission_to_moon_desc: "우리는 튀르키예 우주비행사를 훈련하고 달 탐사 임무를 위한 우주선을 준비할 것입니다."
 TUR_stage_four: "4 단계"
 TUR_stage_four_desc: "경제 계획의 마지막이자 최종 단계인 4단계는 국내 정책과 국민의 일상생활에 초점을 맞출 것입니다."
 TUR_peoples_education: "The People's Education"
 TUR_peoples_education_desc: "교육은 결정적일 것입니다. 국민이 글을 읽고 쓸 수 있도록 교실에 있어야 합니다."
 TUR_the_security_of_people: "모두의 안전"
 TUR_the_security_of_people_desc: "국민이 안전하다고 느끼지 못한다면 어떻게 그들이 경제에 참여하기를 기대할 수 있겠습니까?"
 TUR_destroying_corruption: "부패 철폐"
 TUR_destroying_corruption_desc: "우리 경제 부문에는 나라를 개선하는 데 쓰일 수 있었던 돈을 자기 몫으로 챙기는 부패한 자들이 있습니다."
 TUR_the_great_economy: "위대한 터키의 경제"
 TUR_the_great_economy_desc: "마침내 우리는 수년 전 목표했던 것을 이루었습니다. 피와 땀과 눈물로 마침내 위대한 튀르키예 경제를 달성했습니다!"
 TUR_tubitak: "터키 과학 기술 연구 위원회 산업 증진"
 TUR_tubitak_desc: "우리는 경제를 더욱 개선할 수 있도록 새로운 산업 기술 연구를 포함하도록 투비탁을 확대할 것입니다."
 TUR_turkish_agriculture: "터키의 농업"
 TUR_turkish_agriculture_desc: "우리나라의 상당 부분이 농업과 도시화된 농경지로 운영됩니다. 그러므로 농민과 노동자들에게 실용적인 기술을 제공하는 노력을 두 배로 늘려야 합니다."
 TUR_turkish_mining: "터키의 광업"
 TUR_turkish_mining_desc: "우리는 상당히 괜찮은 광업을 보유하고 있으며, 이는 우리 공장과 시장에 자재를 공급하는 데 도움이 될 수 있습니다."
 TUR_expansion_of_fuel_industries: "연료 공업 확장"
 TUR_expansion_of_fuel_industries_desc: "우리가 점점 더 산업화되고 기계화됨에 따라 연료 산업의 확장은 장기적으로 우리에게 유익할 수 있습니다."
 TUR_bridge_to_europe: "유럽을 향한 다리"
 TUR_bridge_to_europe_desc: "우리는 유럽으로 가는 다리이며, 이 때문에 그들에게 재정적으로 매우 중요합니다. 우리는 세계에서의 우리 위치를 활용하여 가능한 한 많은 돈을 벌어야 합니다."
 TUR_taek: "터키 원자력에너지청 (TAEK)"
 TUR_taek_desc: "튀르키예 원자력 당국, 다른 이름으로 TAEK는 튀르키예 내 원자력 발전의 개발을 계획하고 확립하는 임무를 맡고 있습니다."
 TUR_double_steel_efforts: "복강철 생산"
 TUR_double_steel_efforts_desc: "우리는 강철과 금속의 대규모 수출국이며, 더 많이 수출하여 더 많은 돈을 벌 수 있도록 노력을 두 배로 늘려야 합니다."
 TUR_togg: "토그 (TOGG) 자동차"
 TUR_togg_desc: "TOGG는 튀르키예 자동차 그룹(Türkiye'nin Otomobili Girişim Grubu)의 약자입니다. 이는 우리나라 안의 전기차 제조사이며, 정부가 새 시설로 이들을 지원하는 것이 최선입니다."
 TUR_textiles_ethiopia: "에티오피아의 터키 면직물"
 TUR_textiles_ethiopia_desc: "우리는 에티오피아에서 소규모 섬유 공장을 운영하고 있으나, 경제적 영향력을 확대할 수 있도록 규모를 두 배로 늘리는 것이 더 낫습니다."
 TUR_standardize_construction_regulations: "건설 규제 정책"
 TUR_standardize_construction_regulations_desc: "우리의 건설 규정은 제각각이어서 불안정한 건물이 만들어지고 이는 다시 재난으로 이어집니다. 규정을 강화하고 표준화하여 전국에서 통일되게 만들어야 합니다."
 TUR_telecommunications_authority: "통신 위원회"
 TUR_telecommunications_authority_desc: "통신청, 즉 ICTA는 표준화된 통신 센터와 통신선을 구축하는 임무를 맡고 있습니다."
 TUR_tighten_housing_regulation: "주택 정책"
 TUR_tighten_housing_regulation_desc: "우리나라 주택의 40% 이상이 표준 규정을 충족하지 못하고 있으며, 우리는 이를 바꿔야 합니다. 의무 점검을 실시하고 필요한 모든 것을 수리할 것입니다."
 TUR_the_mafia: "마피아"
 TUR_the_mafia_desc: "마피아는 꽤 오랫동안 우리에게 문제를 일으켜 왔으며, 진정한 안정을 원한다면 우리나라에서 그들의 영향력을 서서히 제거하기 시작하는 것이 최선입니다."
 TUR_end_of_organized_crime: "조직범죄"
 TUR_end_of_organized_crime_desc: "조직범죄는 튀르키예에서 매우 흔하며, 사실 지금 그 어느 때보다 기승을 부리고 있습니다. 조직범죄와 범죄자들을 표적으로 삼아 그들이 일상생활을 방해하고 통치를 어렵게 만드는 일을 멈추도록 해야 합니다."
 TUR_combat_their_influence: "영향력 공격"
 TUR_combat_their_influence_desc: "우리 청년들이 끝없는 범죄의 삶에 가담하는 것을 막기 위해 마피아의 영향력에 맞서 싸워야 합니다."
 TUR_begin_arrests: "체포 시작"
 TUR_begin_arrests_desc: "우선순위가 높은 범죄자 명단은 현재 상당히 짧지만, 최소한 우리가 알고 있는 현재 용의자들을 체포하는 것부터 시작해야 합니다. 어쩌면 그들을 심문하여 더 많은 자들을 찾아낼 수 있을지도 모릅니다."
 TUR_anti_mafia_initiative: "반마피아 캠페인"
 TUR_anti_mafia_initiative_desc: "마피아 가입을 단념시키는 캠페인을 벌이면 수많은 생명을 구할 수 있습니다."
 TUR_awareness_campaigns: "학교 차원의 교육"
 TUR_awareness_campaigns_desc: "어린 나이부터 반마피아 정서를 심는 것이 절실하며, 학교에서 프로그램을 시작함으로써 이를 달성할 수 있습니다."
 TUR_tighten_police_training: "경찰 훈련 향상"
 TUR_tighten_police_training_desc: "우리 경찰은 때때로 전문성이 부족하며, 이를 위해 훈련을 강화해야 합니다."
 TUR_install_cctv: "신형 CCTV"
 TUR_install_cctv_desc: "슬프게도 범죄자들을 현행범으로 잡을 유일한 방법은 감시인 듯합니다. 일부 반발이 있더라도 우리에게는 이렇게 하는 것 외에 선택지가 없습니다."
 TUR_tighten_border_patrol: "국경 순찰 확대"
 TUR_tighten_border_patrol_desc: "범죄자들이 외부에서 마약과 불법 물품을 들여오고 있으며, 이는 우리의 국경 순찰이 효과적이지 않다는 분명한 증거입니다. 다른 국경에서 들어오는 불법 물품의 흐름을 줄이기 위해 국경 순찰을 강화할 것입니다."
 TUR_assistance_to_iraq: "이라크에 지원"
 TUR_assistance_to_iraq_desc: "이라크는 현재 범죄에 시달리고 있으며, 그 상당수는 마약과 관련되어 있습니다. 우리는 그들이 마약 문제를 통제할 수 있도록 전문 지식을 제공할 수 있습니다."
 TUR_only_getting_started: "이제 시작이다"
 TUR_only_getting_started_desc: "우리는 이제 막 시작했을 뿐입니다. 정부가 우리 조직에 장악되었으니, 이제 지역을, 그리고 궁극적으로 세계를 우리의 의제, 즉 마피아의 의제에 더 잘 맞도록 만들어 갈 수 있습니다."
 TUR_contact_italian_mafia: "이탈리아 마피아와 접촉"
 TUR_contact_italian_mafia_desc: "이탈리아 마피아는 이탈리아에서 제멋대로 날뛰고 있으며, 정부는 그들을 억제하는 데 그다지 효과적이지 않았습니다. 우리는 그들의 입지를 강화할 수 있도록 지원과 도움을 제공할 수 있습니다."
 TUR_utilize_gray_wolves: "회색 늑대들과 동맹"
 TUR_utilize_gray_wolves_desc: "회색 늑대단은 과거에 우리를 도왔으며, 그러므로 이제 그들과 손잡고 나라를 통치하는 데 참여시킬 수 있습니다."
 TUR_start_global_campaign: "국제적 캠페인"
 TUR_start_global_campaign_desc: "우리의 일은 아직 끝나지 않았으며, 국제적으로 나아가야 합니다. 마피아의 손길은 무한해질 것이고, 우리는 혼란으로부터 이익을 얻을 것입니다."
 TUR_defund_police: "경찰 자금 축소"
 TUR_defund_police_desc: "경찰은 우리에게 충성스럽지 않으며, 그러므로 우리에 맞서 싸우는 능력을 억제해야 합니다. 이들의 자금을 삭감하고 무기를 우리 것으로 압수하여 이를 달성할 것입니다."
 TUR_invite_landowners: "지주 초대"
 TUR_invite_landowners_desc: "지주들은 부유한 엘리트이며, 그들과 적이 되는 대신 손을 잡아야 합니다. 우리는 그들의 지지를 얻을 수 있고, 친구가 되어 더 많은 돈을 벌 수 있습니다."
 TUR_take_out_iran: "이란 장악"
 TUR_take_out_iran_desc: "이란을 제거한다면 훨씬 더 많은 나라에 접근할 수 있게 됩니다. 우리는 이란을 침공하여 우리의 영향력을 아시아 깊숙이 수출하는 거점으로 삼을 것입니다."
 TUR_central_asia: "중앙아시아를 향해"
 TUR_central_asia_desc: "중앙아시아 시장은 마피아의 상품을 팔기에 무르익었습니다. 우리는 이 시장들을 개방하여 이익을 낼 것입니다."
 TUR_the_armed_forces_of_turkiye: "터키군"
 TUR_the_armed_forces_of_turkiye_desc: "튀르키예 군, 다른 이름으로 TSK는 튀르키예의 영토 보전과 국민을 보호하는 임무를 맡고 있습니다."
 TUR_ground_force: "육군"
 TUR_ground_force_desc: "육군은 지상에서 발로 뛰며 나라의 국경 안에서 전쟁을 수행하는 이들입니다. 지상군은 주로 보병과 기계화 부대로 구성됩니다."
 TUR_battery_bases: "이동식 미사일 발사대"
 TUR_battery_bases_desc: "우리의 TEL 포대 무기고가 낡아 가고 있으며 고장도 드물지 않습니다. 유연한 발사 체계를 확보하기 위해 가능한 한 빨리 새 포대를 건설해야 합니다."
 TUR_fortify_east: "동부 요새화"
 TUR_fortify_east_desc: "우리나라 동부는 가장 많은 혼란을 겪었습니다. 내부 저항에서 적군의 침공에 이르기까지, 동부를 요새화하지 않는 것은 어리석은 일일 것입니다."
 TUR_fortify_west: "서부 요새화"
 TUR_fortify_west_desc: "우리나라 서부는 동부보다 안전하지만 결코 확신할 수 없습니다. 이웃 나라들과의 긴장 고조로 상황이 까다로워졌으며, 그러므로 어떠한 위험도 감수할 수 없습니다."
 TUR_silos: "새로운 격납고"
 TUR_silos_desc: "현재 우리는 미사일 사일로가 없으며, 강대국이 되기를 기대한다면 몇 기를 건설해야 합니다. 건설은 즉시 시작될 것이며, 적들이 멀리 떨어져 있도록 세계에 이를 알릴 것입니다!"
 TUR_sam_sites: "영공 확보"
 TUR_sam_sites_desc: "지대공 미사일 기지는 필요할 경우 우리 영공을 봉쇄하는 데 결정적일 것입니다. 현대 제트기의 특성상 항상 우리 항공기에 의존해 이들을 격추할 수는 없으므로, 상당수의 지대공 미사일 기지가 필요합니다."
 TUR_abm_bases: "탄도 요격 미사일 기지"
 TUR_abm_bases_desc: "우리가 미사일 사일로를 확보하고 상당한 거리에서 미사일을 발사할 능력을 갖추었으므로, 같은 능력을 가진 다른 나라들도 경계해야 합니다. 적 미사일을 제때 격추할 수 있도록 탄도탄 요격 미사일 기지를 건설해야 합니다."
 TUR_the_soldiers: "장병들"
 TUR_the_soldiers_desc: "우리 병사들이 곧 우리 군대입니다. 전투에서 만반의 준비를 갖추도록 그들에게 최신식의 최첨단 기술을 갖춰 주어야 합니다!"
 TUR_tanks: "신형 전차"
 TUR_tanks_desc: "유럽 전체가 전차 비축량을 현대화하고 있으며, 튀르키예도 그래야 합니다. 최고의 기술자들에게 우리나라가 앞으로 수년간 사용할 수 있는 현대식 전차를 설계하게 할 것입니다."
 TUR_afvs: "보병전투차량"
 TUR_afvs_desc: "지상 전투는 보병전투차와 장갑차 같은 장갑 보병 차량으로 옮겨 가고 있습니다. 우리도 적응하여 같은 길을 가야 합니다."
 TUR_troop_carriers: "병력수송장갑차"
 TUR_troop_carriers_desc: "우리 병사들에게는 전장에 안전하고 신속하게 도달할 방법이 필요합니다. 장갑차는 이를 달성하기 위해 우리가 생산할 수 있는 최고의 장비입니다."
 TUR_mandatory_draft_woman: "여성 장병"
 TUR_mandatory_draft_woman_desc: "성별에 관계없이 모두가 우리 군에서 복무해야 합니다. 여성은 사회의 절반을 차지하는데, 그렇다면 왜 징병법에서 그들을 배제해야 합니까?"
 TUR_other_use_woman: "Women in the Research Sector"
 TUR_other_use_woman_desc: "연구 분야에서는 추가 인력이 필요하며, 우리 여성들은 군에서 활발히 복무하고 있지 않으므로 그들을 교육하여 우리 병력을 위한 최첨단 기술을 만들도록 하는 것이 최선입니다."
 TUR_new_artillery: "포병 비축고 현대화"
 TUR_new_artillery_desc: "우리의 야포 비축량이 무너지기 시작했습니다. 야포는 역사를 통틀어 군대가 시작하기도 전에 공격을 감행하는 수단임이 꾸준히 증명되어 왔으므로 이는 계속되어서는 안 됩니다!"
 TUR_the_airforce: "The Turkish Air Force"
 TUR_the_airforce_desc: "튀르키예 공군은 튀르키예 군의 항공 부문이며, 주로 전투 시 튀르키예의 제공권을 유지하는 임무를 맡는 동시에 튀르키예의 영공을 보전합니다."
 TUR_expand_jet_program: "국산 제트기 계획"
 TUR_expand_jet_program_desc: "제트기는 이제 항공 전투의 핵심입니다. 타국에 대한 의존도를 줄일 수 있도록 국산 항공기를 만드는 방법을 연구하기 시작해야 합니다."
 TUR_air_superiority: "공중우세기"
 TUR_air_superiority_desc: "If we don't have air superiority, then we don't have anything. Developing air superiority fighters should be a very high priority as we are able to guarantee our close air support's safety."
 TUR_cas: "근접항공지원기"
 TUR_cas_desc: "현대 전투에서 지상군이 적과 싸우는 데 도움을 받기 위해 항공 지원을 요청하는 것은 드문 일이 아닙니다. 그러므로 튀르키예는 국내 생산을 위한 새로운 근접 항공 지원 기술을 개발해야 합니다."
 TUR_open_drone_research: "드론 & 헬리콥터"
 TUR_open_drone_research_desc: "다른 항공기에 가려지는 경우가 많지만, 드론과 헬리콥터는 특히 지상의 병력에게 전투에서 결정적일 수 있습니다."
 TUR_new_helicopters: "새로운 헬리콥터"
 TUR_new_helicopters_desc: "헬리콥터는 필요할 때 병사들과 인력을 전장으로 또는 전장 밖으로 매우 신속하게 수송하는 데 도움이 될 수 있으며, 이러한 필요를 간과하는 것은 우리의 실수가 될 것입니다."
 TUR_baryaktars: "Bayraktars"
 TUR_baryaktars_desc: "우리는 상당한 거리에서 적 표적을 제거할 수 있는 국산 드론을 개발해야 합니다. 바이락타르가 바로 그 일을 할 것입니다!"
 TUR_purchase_from_others: "항공기 시장 탐색"
 TUR_purchase_from_others_desc: "국산 항공기를 개발하기 위해 우리 경제에 너무 큰 부담을 줄 수는 없으므로, 동방과 서방으로부터 일부를 구매하는 것도 고려해야 합니다."
 TUR_british_jets: "영국 제공 전투기"
 TUR_british_jets_desc: "영국 공군은 오랫동안 존재해 왔으며 그들의 항공기는 상당히 잘 늙어 왔습니다. 그들로부터 항공기를 구매하는 것은 현명한 결정일 것입니다."
 TUR_american_jets: "미국 다목적기"
 TUR_american_jets_desc: "미국은 세계의 초강대국이며 현재 가장 뛰어난 공군을 자랑합니다. 이는 사실상 그들로부터 다목적 항공기를 구매하는 것이 우리에게 가장 이롭다는 뜻입니다."
 TUR_russian_jets: "러시아 타격 전투기"
 TUR_russian_jets_desc: "러시아인들은 타격 전투기에 관해 전문가들이며, 우리에게 일부 기체를 기꺼이 팔겠다고 합니다.. 대가를 치르면 말입니다."
 TUR_chinese_jets: "중국 폭격기"
 TUR_chinese_jets_desc: "현재 우리 공군에는 폭격기가 부족하지만 중국은 그렇지 않습니다. 뒤처지지 않도록 그들로부터 몇 기를 구매할 수 있습니다."
 TUR_the_navy: "터키 해군"
 TUR_the_navy_desc: "튀르키예 해군은 튀르키예 군의 해상 부문이며, 그 기원은 1081년까지 거슬러 올라갑니다."
 TUR_upgrade_bosphorus_fleet: "보스포루스 함대 개선"
 TUR_upgrade_bosphorus_fleet_desc: "보스포루스 함대는 주로 구식 호위함과 초계함으로 이루어져 있어, 전쟁 시 더 크고 진보된 함선들에게 쉽게 전멸당할 수 있습니다."
 TUR_frigate_upgrades: "호위함 개선"
 TUR_frigate_upgrades_desc: "우리는 상당히 많은 수의 호위함을 보유하고 있으나 그리 진보된 것은 아닙니다. 전투에서 버틸 수 있도록 그중 일부를 개량해야 합니다."
 TUR_fortify_istanbul: "이스탄불 요새화"
 TUR_fortify_istanbul_desc: "이스탄불은 보스포루스와 가깝기 때문에 항상 폭격과 공격의 위험에 놓여 있습니다. 적 함대가 통과하려 한다면 이스탄불은 그들이 공격하고 파괴할 가장 가까운 주요 도시가 될 것입니다."
 TUR_new_corvettes: "신형 초계함"
 TUR_new_corvettes_desc: "우리는 초계함이 많지 않으며, 그 때문에 기존 함대의 개량에 대해 크게 걱정하지 않고 새로운 모델을 연구하고 제작할 수 있습니다."
 TUR_bosphorus_taxation: "Exercises with the Marines"
 TUR_bosphorus_taxation_desc: "언제든 해상 침공에 대비할 수 있도록 튀르키예 해병대와 훈련을 실시해야 합니다."
 TUR_mediteranean_fleet: "Mediterranean Fleet"
 TUR_mediteranean_fleet_desc: "지중해 함대는 에게해에 간섭하지 않고도 우리나라가 외부로 나갈 수 있도록 보장하는 함대이므로 우선순위가 매우 높습니다."
 TUR_new_submarine: "신형 잠수함"
 TUR_new_submarine_desc: "적 함선을 아래에서 기습할 수 있도록 잠수함이 필요합니다."
 TUR_new_cruisers: "신형 순양함"
 TUR_new_cruisers_desc: "순양함은 항공모함을 제외하면 보통 함대에서 가장 큰 함선이므로 우리가 배치할 수 있는 가장 중요한 함선 중 하나라고 할 수 있습니다."
 TUR_new_heli_pads: "Aircraft Carriers"
 TUR_new_heli_pads_desc: "강대국들은 세계 무대에서 자신들의 지배력을 과시하기 위해 새로운 항공모함을 건조하기 시작했습니다. 우리도 똑같이 해야 하며, 우리만의 항공모함 건조를 시작해야 합니다!"
 TUR_tcg_anadolu_plans: "이스탄불 호위함 배치"
 TUR_tcg_anadolu_plans_desc: "우리는 TCG 이스탄불이라는 최첨단 호위함을 건조해 왔으며, 배치할 준비가 되었습니다!"
 TUR_navy_regulations: "해군 정책 강화"
 TUR_navy_regulations_desc: "양보다 질이 중시되어야 하며, 그러므로 해군을 위한 새 함선을 생산할 때의 규정을 강화해야 합니다."
 TUR_tsk_coup: "정계의 군부 (TSK)"
 TUR_tsk_coup_desc: "우리 국민은 이슬람주의 이념과 그들의 위험한 정치적 견해에 휩쓸릴 심각한 위험에 처해 있습니다. TSK는 튀르키예 공화국의 이상을 지키는 일을 믿고 맡길 수 있는 유일한 집단입니다."
 TUR_crush_kurdish_resistance: "쿠르드 저항군 박멸"
 TUR_crush_kurdish_resistance_desc: "효과적인 전술을 사용하여 쿠르드 저항 세력이 회복하기 어려운 수준까지 분쇄할 것입니다."
 TUR_crush_radicalism: "쿠르드 급진화"
 TUR_crush_radicalism_desc: "급진주의는 이 나라의 몰락을 가져올 것이며, 그러므로 즉시 분쇄해야 합니다."
 TUR_upgrading_mili_infrastructure: "군수 산업 개선"
 TUR_upgrading_mili_infrastructure_desc: "우리의 군수 산업은 최근 상당히 부족했으며, 제대로 된 장비를 배치하려면 이를 어느 정도 강화해야 합니다."
 TUR_subdue_kurdish_independence: "동부의 작전"
 TUR_subdue_kurdish_independence_desc: "아르메니아인과 조지아인은 이미 CSTO에 속해 있거나 잠재적인 CSTO 회원국입니다. 그들이 그 기구에 가입하는 것을 막기 위한 작전을 수행해야 합니다."
 TUR_root_out_ulama: "울라마 근절"
 TUR_root_out_ulama_desc: "울라마는 세속적이고 비이슬람주의적인 튀르키예를 보기를 원하지 않으며, 우리의 몰락을 기도하고 있을 가능성이 높습니다. 그들이 관직에 있다면 그 자리에서 숙청하고 해양 복합 기업들로 대체할 것입니다."
 TUR_ban_islamist_parties: "정계에서 이슬람 금지"
 TUR_ban_islamist_parties_desc: "이전 정부들이 해결하지 못한 한 가지 문제는 우리 정치에서 이슬람주의자들이 부상한 것입니다. 우리나라가 위험한 이념으로부터 안전하도록 이들 모두의 선거 참여를 즉시 금지해야 합니다."
 TUR_military_conglomorates: "군수 복합기업"
 TUR_military_conglomorates_desc: "TSK가 튀르키예 정치에서 부상함에 따라 많은 군수 기업이 정부에서 더 많은 대표성을 갖도록 압박해 왔습니다. 우리는 이를 쉽게 허용할 수 있으나, 산업 복합 기업들을 소외시키는 대가를 치러야 합니다."
 TUR_train_foreign_troops: "의용군 훈련"
 TUR_train_foreign_troops_desc: "우리 군은 다른 나라의 군대를 문제없이 훈련시킬 능력이 있습니다. 이를 수행하면 영향력과 경험을 얻을 수 있습니다."
 TUR_secularist_dominance: "세속주의 우세"
 TUR_secularist_dominance_desc: "세속주의는 역사적으로 그래야 했던 것처럼 우리 정치를 지배할 것입니다. 우리나라는 처음부터 의도된 길을 따르게 될 것입니다.."
 TUR_reform_mit: "터키 국가정보부 (MIT) 개혁"
 TUR_reform_mit_desc: "MIT는 우리나라의 정보기관이며, 우리 군의 의제에 더 잘 맞도록 개혁이 필요합니다."
 TUR_new_airbases: "새로운 영공 규제"
 TUR_new_airbases_desc: "공군에 대한 새로운 규정을 통과시키면 조종사들이 적절한 훈련을 받고 전투 중 올바른 전략을 사용하도록 확실히 보장할 수 있습니다."
 TUR_cooperate_mit: "터키 국가정보부 (MIT) 활용"
 TUR_cooperate_mit_desc: "MIT에서 활동하는 우리의 자산과 요원들을 활용하면 우리 군이 정보와 자료를 수집하는 데 유용할 수 있습니다."
 TUR_military_dominance: "군사적 패권"
 TUR_military_dominance_desc: "체제에 대한 새로운 법률, 변화, 개편을 통해 군대가 튀르키예 정치의 모든 측면에 대해 패권과 통제권을 갖게 되었습니다."
 TUR_our_society: "터키의 사회"
 TUR_our_society_desc: "튀르키예 사회는 끊임없이 변화하며 새로운 무언가로 진화하고 있습니다. 정부의 역할은 일정한 제약으로 인해 이 문제에서 보통 제한적이지만, 개입해야 했던 때가 있었고 정책을 바꾸기 위해 개입해야 할 때도 있을 것입니다."
 TUR_mit: "터키 국가정보부 (MIT)"
 TUR_mit_desc: "MIT는 국가의 정부와 정책을 내외부의 위협으로부터 보호하는 임무를 맡은 우리나라의 정보기관입니다."
 TUR_domestic_focus: "국내 우선"
 TUR_domestic_focus_desc: "MIT는 위험한 사상을 퍼뜨려 정부를 전복하려는 불순 세력과 같은 국내 위협으로부터 나라를 보호하는 데 집중해야 합니다."
 TUR_foreign_focus: "해외 우선"
 TUR_foreign_focus_desc: "사람들은 자기 나라에 해를 끼치기를 결코 원하지 않을 것이므로, MIT는 국경 밖의 위협을 우려해야 합니다."
 TUR_disaster_relief: "재난 대비 계획"
 TUR_disaster_relief_desc: "현재 우리에게는 재난 계획이 없으며, 이는 우리가 시민을 보호하고 도울 준비가 되어 있지 않음을 의미합니다."
 TUR_charity_based: "자선 주도 체계 확립"
 TUR_charity_based_desc: "자선 단체가 재난이 닥쳤을 때 우리 국민을 지원해 줄 것이므로 지출을 상당히 줄일 수 있습니다."
 TUR_government_reliant: "정부 주도 체계 확립"
 TUR_government_reliant_desc: "재난이 닥쳤을 때 국민을 돕는 것은 정부의 일이며, 지출이 늘어나더라도 마찬가지입니다."
 TUR_migration_problems: "이주 문제"
 TUR_migration_problems_desc: "우리는 이주민이 나라로 유입되는 문제를 항상 안고 있었습니다.. 하지만 그들의 고국에서의 문제가 끝난 뒤 그들을 어떻게 해야 할지는 알지 못했습니다."
 TUR_open_door_policy: "개방 정책"
 TUR_open_door_policy_desc: "문호 개방 정책을 택함으로써 들어오는 이주민을 활용해 나라를 개선하고 발전시킬 수 있습니다."
 TUR_closed_borders: "국경을 폐쇄"
 TUR_closed_borders_desc: "국경을 닫기만 하면 나라로 들어오는 이주민을 완전히 없앨 수 있으며, 따라서 우리의 문제도 끝납니다."
 TUR_drug_problem: "마약 문제"
 TUR_drug_problem_desc: "때로는 의료 목적으로 마약이 필요하지만, 일부 개인이 이 제도를 악용하여 위험한 결과를 초래하는 유흥 목적으로 사용하는 것을 막지는 못합니다."
 TUR_tighten_punishments: "강경한 입장"
 TUR_tighten_punishments_desc: "핑계가 무엇이든 의료 목적 외에 마약을 사용하는 모든 사람을 범죄자로 처벌할 것입니다."
 TUR_relax_restrictions: "유연한 입장"
 TUR_relax_restrictions_desc: "국민이 유흥 목적으로 마약을 사용하고 싶어 한다 해도 우리가 왜 신경 써야 합니까? 어쩌면 약간의 위험이 있더라도 원하는 대로 하도록 두어야 할지도 모릅니다."
 TUR_rising_nationalism: "국가주의 성장"
 TUR_rising_nationalism_desc: "민족주의는 좋은 것이지만 지나치면 나쁠 수 있습니다. 나라 안의 민족주의는 소수 집단 간에 문제와 싸움을 일으켰습니다."
 TUR_utilize_it: "국가주의 활용"
 TUR_utilize_it_desc: "우리는 민족주의를 우리에게 유리하게 활용할 것이며, 이렇게 하면 적은 튀르키예 국민이 전쟁 시 가만히 앉아 있지 않을 것임을 알게 될 것입니다."
 TUR_combat_it: "국가주의에 대항"
 TUR_combat_it_desc: "우리나라 국경 안에서 더 이상의 불안정을 감수할 수 없으므로 민족주의에 맞서 싸워야 합니다."
 TUR_turkish_medias: "언론"
 TUR_turkish_medias_desc: "우리 언론은 상당히 커지고 있으며, 나라에서 기술의 사용이 계속 늘어남에 따라 언론은 우리의 정책과 정당 인기도에 상당한 영향을 미칠 수 있습니다."
 TUR_deal_with_journalists: "기자"
 TUR_deal_with_journalists_desc: "물론 언론인들은 모든 언론 뒤에 있는 힘입니다. 의견을 내놓는 것은 그들이며, 그들의 의견은 때때로 이로움보다 해로움이 더 클 수 있습니다."
 TUR_passive_aggressive_approach: "수동-공격적인 접근"
 TUR_passive_aggressive_approach_desc: "저기 기자 선생님.. 어젯밤 제 머리 모양에 대해 하신 말씀이 별로 마음에 들지 않았는데, 표현을 조금만 바꿔 주실 수 있겠습니까..? 물론 제가 억지로 어떻게 하지는 않겠습니다만, 제 지지자들은.. 글쎄요, 가끔 꽤 거칠어질 수 있어서요."
 TUR_no_restrictions: "제한 없음"
 TUR_no_restrictions_desc: "제대로 기능하는 민주주의에서는 모든 사람이 원하는 것을 말할 권리가 있습니다. 언론인들도 이 점에서 다르지 않을 것입니다."
 TUR_close_kurdish_medias: "쿠르드 언론 폐쇄"
 TUR_close_kurdish_medias_desc: "쿠르드 언론을 폐쇄함으로써 PKK의 세력을 제한할 수 있고, 따라서 어떤 정보가 퍼지는지에 대한 우리의 통제를 공고히 할 수 있습니다. 다만 그들이 다소 불쾌해할 수 있습니다."
 TUR_sponsor_kurdish_medias: "쿠르드 언론 허용"
 TUR_sponsor_kurdish_medias_desc: "쿠르드인들에게 우리가 평화롭게 공존할 수 있음을 보여 주면 그들은 입장을 누그러뜨리고 우리 정부에 덜 공격적이 될 것입니다."
 TUR_combat_cybercrime: "터키의 사이버공간"
 TUR_combat_cybercrime_desc: "일부 개인이 범죄와 불법 활동에 사용할 수 있으므로 튀르키예 사이버 공간에서 벌어지는 일을 조사해야 합니다."
 TUR_heavy_fines: "자유로운 사이버 공간"
 TUR_heavy_fines_desc: "인터넷에는 그 안에서 벌어지는 일을 감독하고 관리하는 사람들이 꽤 많습니다. 그렇다면 더 나은 일에 쓸 수 있는 경찰 자원을 왜 이를 위해 낭비해야 합니까."
 TUR_heavy_sentences: "사이버 공간 감시"
 TUR_heavy_sentences_desc: "범죄자들이 우리 몰래 범죄를 저지르는 허점으로 인터넷을 이용할 수 있으므로, 인터넷을 감독하지 않고 방치할 위험을 감수할 수 없습니다!"
 TUR_kurdish_problems: "쿠르드와의 갈등"
 TUR_kurdish_problems_desc: "우리는 튀르키예의 통제에서 벗어난 독립 쿠르디스탄을 위해 싸우는 PKK와 우리나라 동부에서 상당한 투쟁을 벌이고 있습니다. 이는 우리의 영토 보전을 완전히 파괴할 것이므로 일어나서는 안 됩니다."
 TUR_mediation: "중재"
 TUR_mediation_desc: "때로는 폭력이 답이 아닙니다. 중재가 PKK에 접근하여 그들이 우리와 평화롭게 공존하도록 만드는 최선의 방법일 것입니다."
 TUR_relax_security_laws: "동부의 보안 규제 완화"
 TUR_relax_security_laws_desc: "우리가 적대적이지 않음을 보여 주는 방법으로 쿠르드 지방의 보안법을 완화해야 합니다. 그러면 그들도 우리에 대한 공격성을 누그러뜨릴 것입니다."
 TUR_withdraw_all_troops: "군의 움직임 제한"
 TUR_withdraw_all_troops_desc: "병력 이동을 제한함으로써 PKK에게 우리가 더 이상 그들과 싸우지 않을 것임을 보여 줄 것입니다."
 TUR_open_dialogue_pkk: "담화 분위기 형성"
 TUR_open_dialogue_pkk_desc: "대화를 확립함으로써 튀르키예와 PKK 양측 모두의 이익에 부합하는 해법을 마련할 수 있습니다."
 TUR_track_two_diplomacy: "민간 관계 중심의 트랙 2 외교 (Track Two Diplomacy)"
 TUR_track_two_diplomacy_desc: "유명 인사들이 우리의 대의를 대표하도록 하면 아마도 우리 협상안에 대한 그들의 의견에 영향을 줄 수 있을 것입니다."
 TUR_direct_talks: "직접적인 대화"
 TUR_direct_talks_desc: "중요한 조건을 협상하려는 마당에 숨바꼭질을 할 필요는 없습니다. 우리 대표와 그들의 대표가 직접 회담을 가질 것입니다."
 TUR_third_party_mediators: "제 3의 중재자"
 TUR_third_party_mediators_desc: "우리 정부와 PKK 사이의 불신 때문에 제3자를 불러 분쟁 중재를 맡기는 것이 최선입니다."
 TUR_peshmerga_stance: "쿠르드군 (Peshmerga) 초대"
 TUR_peshmerga_stance_desc: "PKK가 지역의 일부가 될 때를 대비하여 페슈메르가를 초청해 관계를 안정시킬 수 있을지도 모릅니다."
 TUR_pkk_peshmerga_talks: "대화 추구"
 TUR_pkk_peshmerga_talks_desc: "페슈메르가와 회담을 추진함으로써 PKK와 페슈메르가는 국경 분쟁으로 인한 큰 충돌 없이 평화롭게 공존할 수 있습니다."
 TUR_maintain_animosity: "적대감 유지"
 TUR_maintain_animosity_desc: "적대감을 유지함으로써 우리는 공격할 정당한 명분을 가지게 되므로 국경 분쟁을 손쉽게 처리할 수 있습니다."
 TUR_relax_policing_laws: "치안 규제 완화"
 TUR_relax_policing_laws_desc: "PKK와의 외교에서 최근 이룬 돌파구 덕분에 전국의 치안법을 완화할 수 있으며, 이로써 지출을 대폭 줄일 수 있습니다."
 TUR_federalize_turkish_kurdistan: "Federalization of Diyarbakir"
 TUR_federalize_turkish_kurdistan_desc: "우리나라의 쿠르디스탄 지방을 연방화할 것입니다. 이는 우리와 PKK 양측의 이익에 가장 부합할 것입니다. 우리는 그들과 그 지역에 대해 일정 수준의 통제를 유지하되, 그들도 일정 수준의 자치를 얻게 될 것입니다."
 TUR_the_endless_war: "끝나지 않는 전쟁"
 TUR_the_endless_war_desc: "PKK와의 전쟁은 우리의 수많은 의견 차이가 거듭 증명했듯이 외교적으로 해결될 수 없습니다. 우리는 PKK와 무력으로 싸우고 튀르키예의 패권을 재확립하려는 노력을 두 배로 늘릴 것입니다."
 TUR_form_eastern_security_corp: "Eastern Security Corps"
 TUR_form_eastern_security_corp_desc: "우리나라 동부의 위험 지역을 방어한다는 특수한 목적으로 새로운 부대들이 훈련되고 무장될 것입니다."
 TUR_redouble_army_training: "군 훈련 배가"
 TUR_redouble_army_training_desc: "우리 군대는 훈련이 필요하며, 지금 그 어느 때보다 절실합니다. PKK에 대한 싸움을 강화하는 만큼 훈련이 부족한 병력을 전투에 투입하는 것은 어리석은 일입니다."
 TUR_international_campaign: "해외의 지원 요청?"
 TUR_international_campaign_desc: "PKK를 제거하는 데 외국의 지원을 고려해야 할 수도 있습니다. 하지만 그렇게 한다면 외국의 영향력이 우리나라로 들어오는 문을 열 위험이 있습니다."
 TUR_call_on_iranian_help: "이란의 지원 요청"
 TUR_call_on_iranian_help_desc: "이란인들은 쿠르드 독립을 억제하기 위해 여러 차례 전쟁을 치렀으며, 이제는 반군이 쓰는 모든 움직임과 전술을 알고 있습니다. 어쩌면 그들에게 연락하여 쿠르드인들과의 싸움에서 우리를 지원할 의향이 있는지 알아볼 수 있습니다."
 TUR_self_sufficiency: "혼자서"
 TUR_self_sufficiency_desc: "우리의 문제와 싸우는 데 누구에게도 의지할 수 없습니다. 우리 스스로, 그것도 홀로 해내야 합니다. 도움을 받는 것이 항상 답은 아닙니다."
 TUR_call_on_american_help: "미국의 도움 요청"
 TUR_call_on_american_help_desc: "미국인들이 우리에게 약간의 지원을 빌려줄 의향이 있을 수도 있지만, 복잡한 정치 체제와 개입 여부를 둘러싼 분열 때문에 그리 오래 지속되지는 않을 가능성이 높습니다. 그래도 그들이 주는 지원이 변화를 만들어 내기를 기대해 봅시다."
 TUR_criminalize_pkk: "쿠르디스탄 노동자당 (PKK)의 세계적인 범죄화"
 TUR_criminalize_pkk_desc: "PKK는 우리나라에서 한동안 범죄 조직으로 규정되어 왔지만, 그들은 범죄 조직으로 규정되지 않은 다른 나라에서 안전한 피난처를 찾아 공격을 계획하고 조율할 시간을 벌고 있습니다. 우리나라뿐 아니라 모든 나라에서 이들이 범죄 조직으로 규정되도록 하는 임무에 착수해야 합니다."
 TUR_focus_east_anatolia: "Operation in Diyarbakir"
 TUR_focus_east_anatolia_desc: "PKK 활동의 중심지 중 하나인 디야르바키르는 인근 지방의 일상생활을 방해하기 시작했습니다. 우리는 이 지방에서 PKK를 완전히 소탕하기 위한 작전을 실시할 것입니다."
 TUR_focus_van: "반 지역에서의 작전"
 TUR_focus_van_desc: "PKK 활동의 중심지 중 하나인 반은 인근 지방의 일상생활을 방해하기 시작했습니다. 우리는 이 지방에서 PKK를 완전히 소탕하기 위한 작전을 실시할 것입니다."
 TUR_hightened_security: "치안 강화"
 TUR_hightened_security_desc: "PKK와의 싸움을 계속하고 우리나라를 파괴하려는 그들의 계획을 저지할 수 있도록 국내 보안 태세를 강화할 것입니다."
 TUR_the_fight_goes_on: "계속되는 충돌"
 TUR_the_fight_goes_on_desc: "싸움은 계속되고 있으며, 앞으로도 계속될 것이고, 이미 수십 년째 이어져 왔습니다. PKK의 모든 병사를 붙잡지 않고서는 완전히 제거할 수 없지만, 한동안은 그들을 제압할 수 있습니다."
 TUR_forward_with_social_democracy: "사회 민주주의와 함께 나아가라"
 TUR_forward_with_social_democracy_desc: "튀르키예의 미래는 사회민주주의와 서구의 가치에 의해 결정될 것입니다."
 TUR_approach_the_eu: "유럽연합에 접근"
 TUR_approach_the_eu_desc: "오랜 서구화 과정이 튀르키예를 유럽 연합에 서서히 가까워지게 했습니다. 우리는 EU와의 통합 정책을 계속하여 궁극적으로 정회원국이 되어야 합니다."
 TUR_kemalist_social_democracy: "케말주의적 사회민주주의"
 TUR_kemalist_social_democracy_desc: "§Y[socialism_L]§!은 에제비트가 좌익 가치를 민족 문화 유산과 연결하기 위해 만든 용어인 '민주 좌파'라는 개념을 대표합니다. 다시 말해, 현대 튀르키예의 상황에 맞게 케말주의에 민주사회주의를 접목한 것입니다. 우리 정당은 좌익 유권자와 케말주의 유권자 모두를 끌어들일 수 있습니다."
 TUR_repair_relations_with_left: "좌파와의 관계 완화"
 TUR_repair_relations_with_left_desc: "튀르키예의 좌익과 사회주의자들은 감히 쿠르드인을 지지했다는 이유로 수십 년 동안 악마화되어 왔습니다. 사람들은 이념에 관계없이 자유롭게 의견을 표명할 수 있어야 합니다. 우리는 더 많은 정당에 정치 무대를 개방하기 위해 노력해야 합니다."
 TUR_disarmament_program: "군비 축소 계획"
 TUR_disarmament_program_desc: "우리의 혼란스러운 역사는 우리가 군대에 지나치게 많은 권력을 주었음을 보여 줍니다. 우리는 군사비 지출을 줄이고 우리 자신의 문제에 더 집중해야 합니다."
 TUR_improve_workers_rights: "노동자 권리 향상"
 TUR_improve_workers_rights_desc: "튀르키예의 노동법은 재정비되어야 합니다. 공무원에게 자신의 근무 환경에 대해 단체 교섭을 할 권리를 부여해야 합니다. 또한 동료에 비해 부당하게 대우받았다고 느끼는 모든 공무원은 국가를 상대로 소송을 제기할 수 있게 될 것입니다."
 TUR_protect_the_unions: "노동 조합 보호"
 TUR_protect_the_unions_desc: "정치적 동기를 가진 파업에 대한 현행 제한과, 노동자 파업으로 발생한 모든 피해에 관한 노동조합의 책임을 없애야 합니다. 또한 노동조합, 협회, 연합의 대표 위원회인 ESK(경제사회위원회)에 헌법적 보호를 부여해야 합니다."
 TUR_appease_conglomerate: "복합 기업에 귀를 기울여라"
 TUR_appease_conglomerate_desc: "산업 복합 기업은 이 나라의 근간이며, 그들의 신뢰를 얻을 수 있다면 노동자들의 신뢰도 쉽게 얻을 수 있을 것입니다."
 TUR_banking_reform: "은행 개혁"
 TUR_banking_reform_desc: "튀르키예의 은행 부문은 개혁이 시급합니다. 부패가 만연하며, 은행은 최근 경기 침체의 주요 원인 중 하나입니다."
 TUR_invest_in_iett: "이스탄불 전기 트램 및 터널 (IETT)에 투자"
 TUR_invest_in_iett_desc: "이스탄불 전기 전차 및 터널 공사는 이스탄불 지역에서 운영되는 교통 회사입니다. 우리 당원 중 일부는 이 회사와 연줄이 있으며, 이스탄불의 교통망을 개선하기 위해 그들과 협력해야 합니다."
 TUR_legacy_of_ecevits: "뷜렌트 에제비트의 유산"
 TUR_legacy_of_ecevits_desc: "뷜렌트 에제비트와 그의 아내 라흐산은 튀르키예에서 사회민주주의 운동을 만드는 데 모두 크게 기여했습니다. 그들의 유산은 기려져야 합니다."
 TUR_increase_central_bank_autonomy: "중앙은행의 자주권 확대"
 TUR_increase_central_bank_autonomy_desc: "중앙은행의 자율성을 높임으로써 정치인들의 간섭 없이 경제가 흐르도록 할 수 있습니다."
 TUR_harsh_stance_pkk: "쿠르디스탄 노동자당 (PKK)에 대한 가혹한 입장"
 TUR_harsh_stance_pkk_desc: "PKK는 문제를 일으키는 것 외에는 아무것도 하지 않으며, 이 문제에 대해 더 강경한 입장을 취해야 합니다."
 TUR_abolition_of_death_penalty: "사형제 폐지"
 TUR_abolition_of_death_penalty_desc: "사형제는 우리나라의 발목을 잡고 있으며, 현대적이고 안정적인 국가가 되는 것을 막고 있습니다. 우리는 민주주의 국가이며, 그 가치와 인권을 지켜야 합니다."
 TUR_subsidise_military: "군부 보조금"
 TUR_subsidise_military_desc: "군대는 우리가 키프로스를 정복하도록 도왔으며, 그리스의 영향력이 키프로스에 미치지 못하게 하려면 우리 군이 올바른 일을 하리라 믿어야 합니다."
 TUR_ataturks_heirs: "아타튀르크의 후계자"
 TUR_ataturks_heirs_desc: "§Y[conservatism_L]§!은 아타튀르크 자신이 창당한 정당입니다. 튀르키예를 현대화하여 진정한 유럽 국가로 만드는 것이 우리의 운명입니다."
 TUR_national_chief: "국민지도자의 유산"
 TUR_national_chief_desc: "가장 최근의 §Y[conservatism_L]§! 대통령인 이스메트 이뇌뉘는 '민족 지도자'라는 칭호를 받았습니다. 이 칭호는 데니즈 바이칼에게도 매우 잘 어울립니다."
 TUR_unban_head_scarves: "머리쓰개 재합법화"
 TUR_unban_head_scarves_desc: "더 많은 보수 성향 유권자를 끌어들이기 위해 머릿수건 금지를 해제해야 합니다. 결국 서구적 이상의 일부는 종교의 자유이기 때문입니다."
 TUR_maintain_hijab_ban: "Maintain Headscarf Ban"
 TUR_maintain_hijab_ban_desc: "히잡에 관한 우리의 법을 바꿀 이유는 전혀 없습니다. 보수 세력이 분노하거나 불쾌해하는 것은 중요하지 않으며, 중요한 것은 튀르키예 공화국과 그 세속적 이상을 보존하는 것입니다."
 TUR_reform_village_institutes: "Recreate Village Institutes"
 TUR_reform_village_institutes_desc: "1940년대에 집권한 §Y[conservatism_L]§! 정부는 우수한 학생을 선발하여 교사로 교육함으로써 농촌 지역의 교육을 개선하려는 목적으로 마을 학교를 세웠습니다. 이 학교에서 가르친 기술의 상당수는 매우 실용적이었고, 많은 학교가 농장과 작업장을 운영했습니다. 가장 가난한 지역조차 스스로를 교육할 수 있도록 이 학교들을 되살려야 합니다."
 TUR_expand_shipping_industry: "어업 지원"
 TUR_expand_shipping_industry_desc: "어업을 지원하면 농촌 주민과 그들의 소규모 사업에 도움이 되며, 이는 장기적으로 나라에도 도움이 될 것입니다."
 TUR_deradicalisation_program: "온건화 프로그램"
 TUR_deradicalisation_program_desc: "데니즈 바이칼은 테러리즘에 단호히 반대하는 인물입니다. 우리는 더 보수적인 구성원들은 용인하되, 극단주의적 요소는 가려내야 합니다."
 TUR_increase_education_spending: "교육 개혁"
 TUR_increase_education_spending_desc: "부교수로서 데니즈 바이칼은 교육의 중요성을 알고 있습니다. 그는 1965년 §Y[conservatism_L]§!의 선거 패배에 대한 논문을 쓴 뒤 정치에 입문했습니다."
 TUR_increase_funds_to_resources: "에너지자원청 원조"
 TUR_increase_funds_to_resources_desc: "튀르키예는 더 많은 자원이 필요합니다. 튀르키예의 해외 자원 의존도를 낮출 방법을 찾을 수 있도록 에너지자원부에 보조금을 지급해야 합니다."
 TUR_chp_move_right: "우파로의 변화"
 TUR_chp_move_right_desc: "수년간 데니즈 바이칼은 더 보수적이고 이슬람주의적인 정책을 취하며 §Y[conservatism_L]§!을 정치 스펙트럼의 더 오른쪽으로 옮겨 왔습니다. 많은 기존 지지자들이 이것이 당의 원래 의도와 맞지 않는다고 느껴 이 때문에 당을 떠났습니다. 우리는 그런 사람들이 필요하지 않습니다. 튀르키예는 변했고, 좌익 정치가 설 자리는 없습니다."
 TUR_chp_move_left: "좌파로의 변화"
 TUR_chp_move_left_desc: "수년간 데니즈 바이칼은 더 보수적이고 이슬람주의적인 정책을 취하며 §Y[conservatism_L]§!을 정치 스펙트럼의 더 오른쪽으로 옮겨 왔습니다. 많은 기존 지지자들이 이것이 당의 원래 의도와 맞지 않는다고 느껴 이 때문에 당을 떠났습니다. 우리는 이 방향을 되돌려 뿌리로 돌아가야 합니다."
 TUR_increase_social_security_spending: "사회 안전 확대"
 TUR_increase_social_security_spending_desc: "사회보장기구에는 추가 자금이 필요할 수 있습니다."
 TUR_invest_in_is_bank: "이스뱅크 (İşbank) 은행에 투자"
 TUR_invest_in_is_bank_desc: "이시바크는 여러 나라에 지점을 둔 튀르키예 최대의 상업 은행입니다. 국가는 추가적인 재정 안정을 위해 이 은행의 지분 일부를 매입해야 합니다."
 TUR_curtail_corruption: "부패 축소"
 TUR_curtail_corruption_desc: "부패는 튀르키예 국가의 가장 큰 약점 중 하나입니다. 많은 정치인들이 정치 체제를 사익을 위해 이용하고 있으며, 부패한 행태를 보게 된다면 이를 공개적으로 지적하는 것을 두려워해서는 안 됩니다."
 TUR_remove_article_158: "158조 제거"
 TUR_remove_article_158_desc: "158조는 튀르키예 대통령을 모욕하는 것을 형사 범죄로 규정하고 있습니다. 이 조항은 비판자와 풍자가들의 입을 막는 데 사용되어 왔으며, 대통령을 사실상 건드릴 수 없는 존재로 만듭니다. 이러한 것은 민주주의에 어울리지 않으므로 이 조항은 폐지되어야 합니다."
 TUR_deport_refugees: "난민 추방"
 TUR_deport_refugees_desc: "다수의 난민은 시민과 경제에 부담이 됩니다. 이 사람들을 고향으로 돌려보내야 합니다. 결국 모든 사람은 자신이 태어난 곳에서 살기를 원합니다."
 TUR_religious_tolerance: "종교적 허용 전도"
 TUR_religious_tolerance_desc: "튀르키예에는 많은 종교적 소수 집단이 있으며, 많은 정치인들이 이 소수 집단 출신입니다. 이들의 삶의 질을 높여야 합니다."
 TUR_approach_grey_wolves: "회색 늑대에 접촉"
 TUR_approach_grey_wolves_desc: "회색 늑대단은 우익 성향이 강한 인구로부터 많은 지지를 얻는 극단적 민족주의 조직입니다. 그들과의 관계를 가깝게 하면 그 지지자 중 일부를 얻을 수 있습니다."
 TUR_businessmans_turkey: "사업가들을 위한 터키"
 TUR_businessmans_turkey_desc: "튀르키예는 너무 오랫동안 부패한 정부에 의해 속박되어 왔습니다. 이제 튀르키예 국민에게 경제적, 사회적 자유를 가져다줄 때입니다."
 TUR_abolish_constitutional_court: "Abolish the Constitutional Court"
 TUR_abolish_constitutional_court_desc: "헌법재판소는 정치에 지나치게 종속되어 있으며, 구성원이 의회의 영향을 너무 쉽게 받습니다. 그 대신 대통령이 추천하고 의회가 인준한 구성원이 종신으로 재직하는 대법원을 설립할 것입니다."
 TUR_privatization_drive: "치안과 복지의 민영화"
 TUR_privatization_drive_desc: "국가가 사회보장이나 의료에 관여할 필요는 없습니다. 이는 재단과 민간 조직을 통해 더 잘 처리될 수 있습니다. 물론 가입한 모든 보험에 대해 소폭의 세금 감면이 제공될 것입니다."
 TUR_security_reform: "치안 개혁"
 TUR_security_reform_desc: "튀르키예에는 범죄가 만연해 있으며 이를 막아야 합니다. 헌병대는 농촌 경찰로 재편될 것이며, 모든 보안 인력의 급여 수준이 상당한 수준으로 유지되도록 보장할 것입니다. 경찰은 현장에서 도움이 될 최신 기술 혁신을 받게 될 것입니다."
 TUR_military_reform: "군사 개혁"
 TUR_military_reform_desc: "우리는 효율적이고 소규모의 첨단 기술 병력을 갖추는 데 집중해야 합니다. 사람들을 대규모로 징집하여 군대에 넣을 필요가 없습니다. 또한 군수 산업은 민영화되어야 하며, 국가는 더 이상의 군수 산업 투자 인수를 추진해서는 안 됩니다."
 TUR_stern_commitment_to_nato: "NATO에 대한 확고한 헌신"
 TUR_stern_commitment_to_nato_desc: "나토는 자유주의 세계 질서를 지킬 수 있는 유일한 존재입니다. 튀르키예는 세계 평화를 지키기 위해 나토와 그와 유사한 다른 모든 동맹을 확고하게 지지해야 합니다."
 TUR_reduce_government_oversight: "정부 감시 축소"
 TUR_reduce_government_oversight_desc: "국가는 경제에 대한 간섭을 완전히 중단해야 합니다. 국가의 임무는 오직 자유 시장을 보장하는 것입니다. 우리는 지금과 같은 거대한 관료 군단이 필요하지 않으며, 대신 최소한의 인원만 활용해야 합니다."
 TUR_tax_reform: "세금 개혁"
 TUR_tax_reform_desc: "은행과 기타 금융 기관은 성장을 촉진하기 위해 모든 세금을 면제받고 민간 기업으로 운영되어야 합니다. 또한 국민의 삶을 개선하기 위해 모든 세금을 10% 안팎으로 낮춰야 합니다."
 TUR_liberalise_trade: "무역 자유화"
 TUR_liberalise_trade_desc: "현재의 무역 제한은 모두 철폐되어야 합니다. 모든 관세를 없앰으로써 튀르키예의 무역 상황뿐 아니라 이웃 나라들의 무역 상황도 개선할 수 있습니다. 또한 모든 항구와 부두를 민영화하여 더 효율적으로 사용해야 합니다."
 TUR_agricultural_reform: "농업 개혁"
 TUR_agricultural_reform_desc: "우리 농업의 일부는 여전히 상당히 낙후되어 있습니다. 기계화에 투자하고 생산자와 구매자 모두에게 세금 인센티브를 제공해야 합니다. 또한 농민들이 상품 가격에 대한 실시간 자료를 확보하여 생산을 최적화하고 농업 폐기물과 과잉 생산을 줄일 수 있도록 농업에 기술을 접목해야 합니다."
 TUR_business_cities: "상업도시"
 TUR_business_cities_desc: "도시는 나라의 경제 거점입니다. 도시는 비싸지만 가능성이 클수록 비용도 커지는 것은 당연합니다. 이를 염두에 두면, 대도시에 살기에 너무 가난하다면 더 저렴한 주택이 있는 지역으로 이주해야 합니다. 도시의 가치에서 이익을 얻으려면 부동산세도 개혁해야 하는데, 현재의 형태로는 회피하기가 매우 쉽기 때문입니다."
 TUR_new_supply: "새로운 교차구역"
 TUR_new_supply_desc: "도시들이 점점 더 서로 연결됨에 따라, 사람들이 타고 내릴 새로운 역을 세워야 합니다."
 TUR_destroy_totalitarian_education: "전체주의 교육 박멸"
 TUR_destroy_totalitarian_education_desc: "중앙집권적 교육은 권위주의 시대의 잔재에 불과합니다. 교육은 교육과정을 자유롭게 선택할 자유가 있는 민간 조직에 맡겨져야 합니다. 교육은 처음 8년만 의무여야 하며, 교육비는 당연히 은행의 저리 대출로 충당됩니다."
 TUR_return_of_socialism: "사회주의 복원"
 TUR_return_of_socialism_desc: "강경 좌익 정당은 튀르키예에서 수십 년 동안 죽어 있었지만, 마침내 일어나 권력을 잡는 데 성공했습니다! 이것이 혁명입니다!"
 TUR_strong_state_for_people: "인민를 위한 강력한 국가"
 TUR_strong_state_for_people_desc: "국민은 자신들을 이끌 강력한 국가를 누릴 자격이 있습니다. 정부를 믿는 이들은 보상받을 것입니다."
 TUR_peoples_power: "인민의 힘"
 TUR_peoples_power_desc: "정부는 국민을 위한, 국민에 의한 것이어야 합니다. 코뮌에서 국가에 이르기까지 행정의 모든 단계에 농민과 국민을 민주적으로 참여시켜야 합니다."
 TUR_destroy_old_regime: "과거의 정권을 부숴라"
 TUR_destroy_old_regime_desc: "행정부에서 낡고 부패한 정권의 잔재를 모두 쓸어내고 새롭게 시작해야 합니다!"
 TUR_mixed_economy: "혼합경제"
 TUR_mixed_economy_desc: "경제가 잘 돌아가려면 민간 부문과 공공 부문 사이의 협력이 필요합니다. 사악한 자본주의적 경향을 뿌리 뽑으면서도 국민이 경제적으로 독립적으로 활동할 여지를 남겨 두어야 합니다."
 TUR_state_owned_economy: "국가 소유 경제"
 TUR_state_owned_economy_desc: "자본주의는 우리 사회에서 근절되어야 합니다. 오직 국가와 지역 코뮌만이 산업을 운영하기에 적합합니다."
 TUR_rent_to_production_economy: "자영업으로부터 시작되는 생산 경제"
 TUR_rent_to_production_economy_desc: "민간 부문을 두는 것도 중요하지만, 경제에 대한 진정한 통제권이 국민의 손에 남아 있도록 국민이 사업체와 주거 시설을 소유하도록 장려하고 지원해야 합니다."
 TUR_land_reform: "토지개혁"
 TUR_land_reform_desc: "지주는 인류의 재앙입니다. 튀르키예에는 농민의 자유를 가로막는 낙후되고 심지어 봉건적인 구조가 여전히 많이 남아 있습니다. 우리나라의 토지 소유 방식을 완전히 개혁해야 합니다."
 TUR_heavy_agricultural_subsidies: "강력한 농업 원조"
 TUR_heavy_agricultural_subsidies_desc: "우리는 WTO의 규칙을 깨고 농민들에게 저렴한 연료, 쉽고 저리인 대출, 기계를 제공함으로써 농업 부문에 대규모 보조금을 지급하기 시작해야 합니다."
 TUR_machinery_tractor_parks: "기계 트랙터 공장 단지"
 TUR_machinery_tractor_parks_desc: "농기계를 생산, 정비, 판매할 수 있는 트랙터 단지를 설치해야 합니다. 이 모든 것은 전국의 중앙 집중식 장소에서 이루어질 것입니다. 이는 우리 농업을 크게 현대화하고 기계화하는 데 도움이 될 것입니다."
 TUR_communal_farming: "공동체 농업"
 TUR_communal_farming_desc: "공동 영농은 우리 농장의 효율을 높이는 최선의 방법입니다. 이윤에 초점을 맞춘 대기업 운영 농장 대신 지역 소비를 위한 대규모 영농을 더 늘릴 것입니다."
 TUR_cut_global_trade: "해외 무역 축소"
 TUR_cut_global_trade_desc: "튀르키예의 자원은 오직 튀르키예만을 위해 남겨 두어야 하며, 세계주의적 제국주의자들에게 도둑맞아서는 안 됩니다. 우리나라에 필수적인 자원이 우리 손에 남도록 보장해야 합니다."
 TUR_prioritise_backwards_regions: "오지 지역 우선"
 TUR_prioritise_backwards_regions_desc: "경제 투자는 오랫동안 국가에 의해 방치되어 온 더 농촌적이고 인구가 희박한 지역에 집중되어야 합니다. 시골은 이 나라의 근간입니다."
 TUR_urban_humanism: "도시의 인본주의"
 TUR_urban_humanism_desc: "우리의 도시는 자본주의 기계의 톱니바퀴 역할을 하는 사람들을 위한 차가운 콘크리트 덩어리가 되지 않도록 다시 설계되어야 합니다. 도시 지역은 노동자가 번영할 수 있도록 더 자연스럽게 설계되어야 합니다."
 TUR_equal_distribution: "동등한 분배"
 TUR_equal_distribution_desc: "지역 정치에서 편애를 해서는 안 됩니다. 이는 나라에 불화만 일으킬 것입니다. 우리는 주와 지역의 필요에 따라 지역에 집중할 것입니다."
 TUR_greatest_productive_force: "인민이 가장 위대한 생산력이다"
 TUR_greatest_productive_force_desc: "오직 사람에게 집중함으로써만 우리나라를 앞으로 나아가게 할 수 있습니다. 삶, 사업, 사회의 모든 측면과 모든 것은 사람에게서 비롯됩니다."
 TUR_clamp_down_on_kurdish_culture: "쿠르드 정통성 탄압"
 TUR_clamp_down_on_kurdish_culture_desc: "쿠르드인은 그들이 원하든 원하지 않든 튀르키예 민족의 일부입니다. 우리는 CIA가 자금을 대는 이 테러리스트들에게 한 치도 물러서지 않을 것입니다."
 TUR_federal_republic: "연방화된 공화국"
 TUR_federal_republic_desc: "튀르키예의 모든 민족 집단은 자결권과 자치권, 원한다면 완전한 독립에 이르기까지 가질 권리가 있어야 합니다. 소수 집단을 악마화하는 것은 강력한 국가를 만들지 못합니다. 모두를 위해 알레비파에게 어느 정도의 자치를 부여하는 데 동의해야 합니다."
 TUR_appease_kurds: "쿠르드와의 타협"
 TUR_appease_kurds_desc: "우리는 수십 년간 쿠르드인과 싸워 왔지만 아무 성과도 얻지 못했습니다. 이제 무기를 내려놓고 그들에게 더 평화적으로 접근할 때입니다. 결국 그들은 평화롭게 살기만을 원합니다."
 TUR_the_turkish_nation: "튀르크의 국가"
 TUR_the_turkish_nation_desc: "튀르키예는 튀르크 민족의 나라입니다. 이는 단지 민족적 튀르크인만을 뜻하는 것이 아니라, 튀르키예의 모든 시민이 튀르크인이며 분할될 수 없는 튀르키예 공화국의 일부라는 뜻입니다. 우리는 적들이 우리 국민 사이에 불화를 심어 우리를 분열시키도록 내버려 두지 않을 것입니다."
 TUR_detach_state_from_religion: "종교와 국가의 분리"
 TUR_detach_state_from_religion_desc: "튀르키예는 세속 국가로 세워졌으나, 최근 몇 년간 공화국의 이 핵심 원칙이 훼손되었습니다. 국가에서 종교의 모든 측면을 단절해야 합니다. 공립학교에서의 종교 교육 금지, 국가의 종교 단체 자금 지원 금지, 공공 건물에서의 종교적 이미지 금지가 그것입니다. 사람들은 원하는 것을 숭배할 자유가 있으나, 국가는 그러한 하찮은 개념 위에 있습니다."
 TUR_recognise_minorities: "소수자 인식"
 TUR_recognise_minorities_desc: "우리는 튀르키예가 서로 다른 많은 민족으로 이루어져 있다는 사실을 인정해야 합니다. 모든 시민에게 튀르크 정체성이라는 관념을 강요하려는 것은 의미가 없습니다. 모든 사람은 튀르크인이든 아니든 튀르키예의 시민입니다."
 TUR_leverage_diaspora: "세계의 유대인에게 영향"
 TUR_leverage_diaspora_desc: "서방 강대국들은 우리가 아르메니아인에 대한 집단학살을 저질렀다고 비난하고 있습니다. 이는 제국주의자들이 저지른 명백한 거짓말입니다. 우리는 해외 동포를 활용하여 서방 국가들의 정치에 영향을 미쳐 우리에 대한 그들의 태도를 바꾸도록 해야 합니다."
 TUR_commit_to_gender_equality: "성평등에 대한 헌신"
 TUR_commit_to_gender_equality_desc: "튀르키예의 남녀 평등은 형편없는 수준입니다. 여성에 대한 폭력을 줄이고 여성에게 직장에서 더 많은 기회를 제공하며, 교육과 정치에서의 참여를 늘리는 데 전념해야 합니다."
 TUR_revolutionary_education: "혁명적 교육"
 TUR_revolutionary_education_desc: "교육 개선에 집중해야 합니다. 접근성을 높이는 것만으로는 충분하지 않으며, 학생들이 횃불을 이어받을 수 있도록 혁명적 사상을 가르치는 것도 접목해야 합니다."
 TUR_free_education: "무상교육"
 TUR_free_education_desc: "교육은 모두에게 완전히 무상이어야 합니다. 이는 국가의 안녕을 위한 기본적인 필수 요소입니다."
 TUR_increase_peoples_welfare: "인민의 복지 증대"
 TUR_increase_peoples_welfare_desc: "국민이 건강하도록 하는 것은 무엇보다 중요합니다. 또한 실업자, 노인, 장애인이라 하더라도 우리나라에서 굶주리는 사람이 없도록 해야 합니다."
 TUR_leave_NATO: "NATO를 떠나라"
 TUR_leave_NATO_desc: "나토는 제국주의자들이 세계를 통제하기 위한 도구에 불과합니다. 우리는 그러한 기구의 일원이 되어서는 안 됩니다."
 TUR_anti_west_sentiment: "반서방 정서"
 TUR_anti_west_sentiment_desc: "서방은 중동에 끊임없이 간섭하고 있습니다. 언젠가 타락한 미국을 무너뜨릴 신흥국들과 다시 보조를 맞춰야 합니다."
 TUR_balanced_approach: "균형잡힌 접근"
 TUR_balanced_approach_desc: "국제 외교는 위험할 수 있습니다. 신중하게 나아가야 하지만, 우리의 목표는 튀르키예를 간섭하는 모든 외세로부터 독립시키는 것이어야 합니다."
 TUR_deterrent_national_defence: "국방의 저지력"
 TUR_deterrent_national_defence_desc: "우리 군대는 어떤 제국주의자도 감히 우리를 간섭하지 못하도록 억지력으로 작용할 만큼 강력해야 합니다."
 TUR_destruction_of_fascists: "파시스트의 붕괴"
 TUR_destruction_of_fascists_desc: "군대, 경찰, MIT는 허물어져 국민이 제공하는 대안으로 대체되어야 하는 파시스트 조직에 불과합니다."
 TUR_pacifist_initiatives: "평화주의 위원회"
 TUR_pacifist_initiatives_desc: "우리는 분쟁을 해결할 때 평화적인 접근에 의존해야 합니다. 국민을 위해 모든 제국주의적 구상을 중단시켜야 합니다."
 TUR_invest_in_police: "치안에 투자"
 TUR_invest_in_police_desc: "국민이 안전하다고 느낄 수 있도록 강력한 보안 체계를 갖춰야 합니다. 우리 경찰이 최선을 다하려면 좋은 장비와 좋은 급여가 필요합니다."
 TUR_national_democratic_revolution: "국가 민주주의 혁명"
 TUR_national_democratic_revolution_desc: "우리는 아타튀르크가 시작한 민족 민주 혁명을 계속해야 합니다. 우리는 혁명의 전위이며, 튀르키예를 현대로 이끌 것입니다."
 TUR_heavy_military_investment: "강력한 군사 투자"
 TUR_heavy_military_investment_desc: "우리는 튀르키예를 외세로부터 보호해야 합니다. 군대가 미래의 전투에 대비할 수 있도록 중공업에 대규모로 투자해야 합니다."
 TUR_shutdown_christian_missionaries: "기독교 전파 차단"
 TUR_shutdown_christian_missionaries_desc: "국내에서 활동하는 기독교 선교사들은 서방 제국주의자들의 첩자에 불과합니다. 그들을 나라에서 몰아내고 설교를 금지해야 합니다."
 TUR_form_anti_imperialist_vanguard: "반제국주의 선봉대 형성"
 TUR_form_anti_imperialist_vanguard_desc: "서방, 특히 미국은 중동에 끊임없이 간섭하고 있습니다. 미국의 거대한 중동 구상을 저지하기 위해 중동의 반제국주의자 연합을 결성해야 합니다."
 TUR_vanguard_approach_azerbaijan: "아제르바이잔 접근"
 TUR_vanguard_approach_azerbaijan_desc: "아제르바이잔은 튀르키예의 오랜 동맹입니다. 결국 우리는 종교, 유산, 정치적 목표를 공유합니다. 우리는 그들에게 서방 제국주의를 규탄해 달라고 요청해야 합니다."
 TUR_vanguard_reclaim_azerbaijan_territory: "아제르바이잔에 대한 영토의 무결성 주장"
 TUR_vanguard_reclaim_azerbaijan_territory_desc: "아르메니아는 소련으로부터 독립한 뒤 아르메니아계 주민을 보호한다는 구실로 아제르바이잔의 일부를 점령했습니다. 이 점령은 이제 10년이 넘게 이어지고 있습니다. 아르메니아에 해당 지역에서 철수하라고 요구하고, 그렇지 않으면 대가를 치르게 할 때입니다!"
 TUR_vanguard_approach_iran: "이란에 접근"
 TUR_vanguard_approach_iran_desc: "이란은 오랫동안 미국에 의해 억압당하고 비방받아 왔습니다. 그들은 틀림없이 거대한 사탄에 맞선 공동 전선에 관심을 가질 것입니다."
 TUR_vanguard_pressure_northern_cyprus: "북키프로스에 압박"
 TUR_vanguard_pressure_northern_cyprus_desc: "북키프로스는 우리가 지지하기 때문에 존재할 뿐입니다. 우리는 그들의 정부에 상당한 영향력을 가지고 있으며, 우리가 허락하기 때문에 그들이 존재한다는 점을 강조해야 합니다."
 TUR_vanguard_negotiate_with_syria: "시리아와 협상"
 TUR_vanguard_negotiate_with_syria_desc: "우리는 시리아와 매우 험난한 역사를 가지고 있습니다. 한때 그들은 PKK가 자국 영토 안에서 활동하도록 허용했으며, 프랑스가 우리에게 하타이 지역을 준 것에 대해 우리를 용서한 적이 없습니다. 그러나 어쩌면 우리가 친구가 될 수 있는 방법이 있을지도 모릅니다."
 TUR_vanguard_annex_northern_cyprus: "북키프로스 협상"
 TUR_vanguard_annex_northern_cyprus_desc: "북키프로스에는 튀르크인이 가득합니다. 이러한 이유로 북키프로스를 우리와 훨씬 더 가깝게 만들어야 합니다. 사실 섬 전체가 튀르키예의 일부여야 합니다."
 TUR_vanguard_unify_iraq: "이라크와 연대"
 TUR_vanguard_unify_iraq_desc: "이라크인들은 지난 몇 년간 제멋대로 날뛰고 있으며, 우리는 이를 해결하고 그들을 우리와 보조를 맞추게 해야 합니다."
 TUR_scientific_socialism: "과학적 사회주의"
 TUR_scientific_socialism_desc: "EMEP의 과학적 사회주의 방식이 앞으로 나아갈 최선의 길입니다. 강력한 반자본주의, 분권화, 불간섭주의의 길이 튀르키예에 가장 번영을 가져다줄 것입니다."
 TUR_unlimited_workers_rights: "제한없는 여성의 권리"
 TUR_unlimited_workers_rights_desc: "튀르키예의 노동자들은 수십 년간 억압받아 왔습니다! 더 이상은 안 됩니다! 이제 사슬을 끊고 튀르키예를 노동자의 낙원으로 만들 때입니다!"
 TUR_adherent_defence: "방어 지지론자"
 TUR_adherent_defence_desc: "우리 군대는 다른 사람들을 진압하는 데 사용되어서는 안 됩니다. 군대의 임무는 우리 국민을 보호하는 것이며, 오직 그것뿐입니다."
 TUR_shut_down_imperialists: "제국주의자를 처단하라"
 TUR_shut_down_imperialists_desc: "우리의 현재 정부 모델은 자본주의적 이상에 기반하고 있습니다. 이 모든 것은 순전히 터무니없는 것입니다. 우리는 통화 체계를 완전히 개편해야 합니다. 다른 강대국들은 우리가 그들에게 돈을 '빚지고' 있다고 말하지만, 우리의 부채는 버튼 하나로 지워질 것입니다."
 TUR_retreat_from_cyprus: "키프로스에서 후퇴"
 TUR_retreat_from_cyprus_desc: "튀르키예는 키프로스에 있을 이유가 없습니다. 그것은 튀르키예 제국주의의 잔재에 불과합니다. 섬의 주민들, 튀르크인과 그리스인 모두가 스스로 운명을 결정해야 합니다."
 TUR_devrimci_yol: "혁명의 길 (Devrimci Yol)"
 TUR_devrimci_yol_desc: "데브림치 욜은 '혁명의 길'을 뜻하며, 노동조합을 강조하는 튀르키예식 마르크스-레닌주의입니다. §W[anarchist_communism_L]§!의 많은 구성원들이 80년대에 이 운동에 참여했습니다. 데브림치 욜의 사상은 경쟁자들의 외래 공산주의보다 우월하며 다른 것들 위에 올려져야 합니다."
 TUR_committees_of_resistance: "저항 위원회"
 TUR_committees_of_resistance_desc: "우리는 나라를 휩쓰는 우익적 풍조에 맞서 스스로를 방어하기 위해 저항 위원회를 구성해야 합니다. 이 집단들은 거리를 순찰하며 회색 늑대단이라 불리는 테러리스트들을 추적할 것입니다."
 TUR_committees_of_production: "생산 위원회"
 TUR_committees_of_production_desc: "생산 위원회는 노동자와 공장을 효율적인 단위로 조직하는 것을 도울 것이며, 이 위원회들은 제조 과정을 독립적으로 통제할 것입니다."
 TUR_empower_unions: "조합의 권력 강화"
 TUR_empower_unions_desc: "노동자의 권리를 완전히 보호할 수 있도록 노동조합에 힘을 실어 주어야 합니다. 노동자에게 목소리를 부여할 때에만 우리의 말이 진실해질 것입니다."
 TUR_strike_pakistan: "파키스탄 공격"
 TUR_strike_pakistan_desc: "파키스탄 정부는 모든 형태의 사회주의를 거부하는 듯하며, 우리 정부에 대해 적극적으로 비판해 왔습니다. 그들의 입을 영원히 다물게 할 때입니다."
 TUR_strike_arabia: "아라비아 해방"
 TUR_strike_arabia_desc: "사우디인들은 다른 이념들과 그다지 잘 어울리지 못하는 듯합니다. 그러므로 우리가 그렇게 만들어야 합니다."
 TUR_islamist_victory: "이슬람의 승리"
 TUR_islamist_victory_desc: "튀르키예 국민은 이슬람을 진정으로 따르는 더 보수적인 정부를 갈망해 왔습니다. 이제 마침내 그것을 얻었습니다."
 TUR_lower_taxes_for_exports: "수출세 인하"
 TUR_lower_taxes_for_exports_desc: "튀르키예는 강력한 경제를 가지고 있으나 수출에는 번거로운 관료적 절차가 많습니다. 국제 무역을 지금보다 훨씬 쉽게 만들어야 합니다."
 TUR_form_new_stock_markets: "새로운 주식 시장 형성"
 TUR_form_new_stock_markets_desc: "현재 증권 거래소는 이스탄불에서만 운영되고 있습니다. 이는 튀르키예의 다른 지역에 사는 사람들에게서 참여 기회를 크게 박탈합니다. 더 많은 지방 거래소를 설립하여 이스탄불 거래소와 연결해야 합니다."
 TUR_energy_investments: "에너지 투자"
 TUR_energy_investments_desc: "튀르키예의 해외 에너지 수입 의존도를 낮춰야 합니다."
 TUR_subsidise_farming: "농업 원조"
 TUR_subsidise_farming_desc: "튀르키예에는 비옥한 토지가 넓게 펼쳐져 있으나 농업 생산량은 사상 최저 수준입니다. 안정적이고 효율적인 식량 공급을 보장하기 위해 농민에게 보조금을 지급해야 합니다."
 TUR_increase_oil_gas_production: "석유 및 가스 생산 증대"
 TUR_increase_oil_gas_production_desc: "튀르키예는 자체 공급량이 있음에도 석유와 천연가스를 대량으로 수입하고 있습니다. 자급자족을 높이기 위해 석유 및 천연가스 생산 시설에 투자해야 합니다."
 TUR_turkish_highways: "터키의 고속도로"
 TUR_turkish_highways_desc: "튀르키예는 아시아와 유럽을 잇는 연결 다리입니다. 그러나 튀르키예를 가로지르는 도로망은 상태가 좋지 않으며 개선되어야 합니다."
 TUR_uphold_family_values: "가정의 가치 유지"
 TUR_uphold_family_values_desc: "전통적 가족 가치가 서방으로부터 공격받고 있습니다. 전통적 가치를 장려하고 이러한 전통에 적대적인 자료가 언론에 존재하지 않도록 보장하는 단체를 설립해야 합니다."
 TUR_security_through_police_and_welfare: "경찰과 복지를 통한 치안"
 TUR_security_through_police_and_welfare_desc: "국민에게 안전을 제공하려면 경찰에 자금을 지원하는 것만으로는 충분하지 않습니다. 사람들이 생존을 위해 범죄에 의지하는 상황에 처하지 않도록 사회 지출도 늘려야 합니다."
 TUR_judicial_reform: "사법 개혁"
 TUR_judicial_reform_desc: "우리의 사법 제도는 낡았으며 현대 사회와 동떨어져 있습니다. 제도 전체를 개혁하고 부패한 판사들을 제거해야 합니다."
 TUR_remove_electoral_treshold: "Remove Electoral Threshold"
 TUR_remove_electoral_treshold_desc: "튀르키예는 세계에서 가장 높은 선거 득표율 장벽을 가지고 있습니다. 정당이 의회에서 의석을 얻으려면 최소 10%의 득표율이 필요합니다. 이는 비민주적이며 집권당의 권력을 공고히 하는 데에만 기여합니다. 이 제한을 완전히 철폐해야 합니다."
 TUR_increase_military_funding: "군사 원조 확대"
 TUR_increase_military_funding_desc: "튀르키예 민족은 포위당한 상태이며 스스로를 방어하려면 강력한 군대가 필요합니다. 자금을 늘리고 새로운 인원을 모집해야 합니다."
 TUR_concentrate_domestic_equipment: "국내 장비에 집중"
 TUR_concentrate_domestic_equipment_desc: "튀르키예 군대는 튀르키예산 장비를 사용해야 합니다. 현재 우리는 이른바 '동맹국'들이 공급하는 장비에 지나치게 의존하고 있습니다."
 TUR_military_rnd_projects: "R&D 프로젝트"
 TUR_military_rnd_projects_desc: "국산 장비를 생산하는 것에 더해, 외국에서 구매한 무기를 대체할 국산 무기 체계를 개발해야 합니다."
 TUR_remove_military_from_politics: "정계에서 군부 배제"
 TUR_remove_military_from_politics_desc: "민주 국가에서 군대가 이토록 큰 권력을 쥐고 있다는 것은 비정상적입니다. 군대가 끊임없이 정치에 간섭하지 못하도록 법률을 제정하고 헌법을 개정해야 합니다."
 TUR_islamic_nato: "이슬람주의 NATO"
 TUR_islamic_nato_desc: "NATO가 우리에게 안보를 제공하고 있으나, NATO 회원국들은 중동에 대한 완전한 무관심을 드러냈습니다. 그들이 안정과 번영을 제공하지 못한다면 우리가 그 책무를 떠맡아야 합니다. 우리는 지중해 조약 기구, 즉 MTO라는 독자적인 군사 동맹을 결성할 것입니다."
 TUR_invite_iraq: "이라크 초대"
 TUR_invite_iraq_desc: "이라크가 서서히 안정을 되찾기 시작하고 있으며 상호 협력은 우리에게 큰 이익이 될 것이므로 이라크를 우리 동맹에 초청해야 합니다."
 TUR_invite_syria: "시리아 초대"
 TUR_invite_syria_desc: "시리아가 우리 나라 바로 남쪽에 있다는 것은 우리가 매우 취약하다는 뜻입니다. 시리아를 우리 세력에 초청하는 것은 우리의 안보와 안전을 보장하는 훌륭한 방법이 될 것입니다."
 TUR_invite_egypt: "이집트 초대"
 TUR_invite_egypt_desc: "이집트는 떠오르는 강국이며, 그만한 규모의 인구를 가진 만큼 우리 동맹은 사실상 무엇이든 이룰 수 있을 것입니다."
 TUR_assistance_to_bulgaria: "불가리아 지원"
 TUR_assistance_to_bulgaria_desc: "불가리아가 기반시설을 발전시키도록 지원해야 하며, 그렇게 하면 우리가 불가리아 국경 너머에서 더 쉽게 투자를 진행할 수 있을 것입니다."
 TUR_islamic_economic_cooperation: "이슬람 경제 협력"
 TUR_islamic_economic_cooperation_desc: "많은 무슬림 국가가 돈에 파묻혀 있으면서도 그 돈을 무의미한 일에 쓰고 있습니다. 우리의 자원을 모아 공동 경제 사업에 투입하기 위한 경제 동맹을 결성해야 합니다."
 TUR_condemn_china: "중국 비난"
 TUR_condemn_china_desc: "중국이 자국 내 무슬림 원주민을 대하는 방식은 혐오스러우며 규탄받아야 합니다."
 TUR_improve_relations_with_egypt: "이집트와  관계 개선"
 TUR_improve_relations_with_egypt_desc: "튀르키예는 과거의 충돌 때문에 이집트와 불안정한 역사를 가지고 있습니다. 우리는 이제 모두 같은 편이며, 이집트인들에게 이토록 냉담해서는 안 됩니다."
 TUR_investments_in_iraq: "이라크 친선"
 TUR_investments_in_iraq_desc: "이라크는 과거에 우리와 이상적이지 못한 관계였으나, 서로 가까워지는 것이 최선입니다. 이라크의 기반시설에 투자하여 그들의 신뢰를 얻을 수 있습니다."
 TUR_work_together_with_BSEC: "흑해 경제 협력 기구 (BSEC)와 함께"
 TUR_work_together_with_BSEC_desc: "BSEC(흑해 경제 협력 기구)는 흑해 주변의 번영을 도모하기 위한 기구입니다. 이 기구는 흑해 연안 국가들과 발칸 남부의 일부 국가들로 구성되어 있습니다. 더 큰 이익을 위해 이들 국가와 협력해야 합니다."
 TUR_fixing_ideals: "이념의 정비"
 TUR_fixing_ideals_desc: "수십 년간 이어진 케말주의 이념과 통치로 인해 우리의 이상은 파괴되었습니다. 그러나 이를 복원하기에 늦지 않았습니다. 우리는 잘못을 바로잡고 국가를 전통주의와 이슬람주의로 되돌려 놓을 것입니다."
 TUR_anti_lgbtq: "혼인법 규제를 절반으로 완화"
 TUR_anti_lgbtq_desc: "우리 사회가 서구의 이상을 중심으로 돌아가지 않도록 해야 합니다. 우리는 전통적 혼인법을 더욱 강화하고 전통주의를 무엇보다 우선하여 시행할 것입니다."
 TUR_supporting_islamists: "The Ulema's Voice"
 TUR_supporting_islamists_desc: "울라마가 우리나라의 국정에 의견을 낼 수 있도록 허용할 것입니다. 그들에게 발언권을 주면 우리 국가는 정의와 순결의 길로 나아갈 것입니다."
 TUR_natural_medicine: "자연의 약재"
 TUR_natural_medicine_desc: "자연 의학이 최고의 의학입니다. 미화된 실험실 제조 의약품은 몸에 이로움보다 해로움이 더 큰 성분을 사용할 수 있으므로 버려야 합니다."
 TUR_new_era: "새로운 시대"
 TUR_new_era_desc: "이 지역에 새로운 시대가 열릴 것입니다. 억압과 불의가 없는 평화와 안정의 시대입니다."
 TUR_ally_palestine: "팔레스타인 연대"
 TUR_ally_palestine_desc: "팔레스타인은 1940년대 후반부터 이스라엘의 점령 아래 있습니다. 이제 팔레스타인과 제대로 된 관계를 맺고 지지를 보여 줄 때입니다."
 TUR_talks_with_iran: "이란과의 대화"
 TUR_talks_with_iran_desc: "이란은 팔레스타인의 완전한 해방과 이스라엘 체제의 전복을 촉구해 왔습니다. 우리는 이란과 회담을 열어 종교적 차이에도 불구하고 이 문제에 대한 공통점을 찾을 수 있는지 살펴볼 것입니다."
 TUR_freeing_palestine: "팔레스타인 해방"
 TUR_freeing_palestine_desc: "이스라엘 점령자들로부터 팔레스타인인들을 해방할 때입니다. 이스라엘인들은 팔레스타인과 레반트에 고통과 불의만을 가져왔으며, 이제 이에 맞서 행동할 때가 되었습니다!"
 TUR_shia_dominance: "시아파 점령"
 TUR_shia_dominance_desc: "튀르키예의 알레비파, 알라위파, 자파리파가 함께 뭉쳐 튀르키예 수니파의 억압을 끊어야 할 때입니다."
 TUR_alevi_political_shift: "알레비의 정치적 우세"
 TUR_alevi_political_shift_desc: "튀르키예의 정치적 수도를 알레비파가 우세한 중앙 아나톨리아 지역으로 옮겨야 합니다. 이것이 우리의 권력 기반을 확보하는 최선의 방법입니다."
 TUR_repair_relations_with_alawites: "알라위트와 관계 개선"
 TUR_repair_relations_with_alawites_desc: "하타이에 거주하는 알라위파와 시리아의 정치 엘리트는 흔히 알레비파와 혼동됩니다. 둘은 유사한 점이 있으나 종파가 시작된 시기가 서로 다르며 알라위파는 주로 아랍인입니다. 알라위파가 알레비파를 '아랍인의 억압자'로 여겨 왔기에 역사적 마찰이 있었습니다. 이러한 적대감은 해소되어야 합니다."
 TUR_invest_in_alevis: "알레비스에 투자"
 TUR_invest_in_alevis_desc: "튀르키예의 알레비파 대부분은 튀르키예 서부보다 경제적 번영을 훨씬 덜 누려 온 동부 아나톨리아에 살고 있습니다. 이제 알레비파도 부를 나눌 때입니다."
 TUR_invest_in_alawites: "알라위트에 투자"
 TUR_invest_in_alawites_desc: "알레비파와 마찬가지로 알라위파도 이전 정부들로부터 경제적으로 소외되어 왔습니다. 우리는 같은 실수를 반복하지 않을 것입니다."
 TUR_unite_alawites: "알라위트 통합"
 TUR_unite_alawites_desc: "튀르키예는 프랑스로부터 하타이 지역을 부당하게 빼앗아 알라위파를 두 개의 서로 다른 국가로 갈라놓았습니다. 이 지역을 시리아에 돌려주고 모든 알라위파를 하나의 정부 아래 통합해야 합니다."
 TUR_utilise_alawite_military_experience: "알라위트의 군사적 경험 활용"
 TUR_utilise_alawite_military_experience_desc: "시리아에서는 군 지휘부의 상당 부분이 알라위파로 구성되어 있습니다. 충성스러운 장교단을 갖추기 위해 우리 군에도 비슷한 방식을 도입해야 합니다."
 TUR_break_syrian_dependancy_iran: "시리아-이란 관계 공격"
 TUR_break_syrian_dependancy_iran_desc: "시리아가 이란에 덜 의존하고 우리에게 더 의존하도록 만들어야 합니다. 그런 이유로 시리아 내에서 이란이 영향력을 행사하는 능력을 공격할 것입니다."
 TUR_arm_iraqi_shias: "이라크 시아파 해방"
 TUR_arm_iraqi_shias_desc: "이라크인들은 시아파 인구가 제대로 대표되지 못하는 체제 아래에서 살고 있습니다. 우리는 이를 바꿀 것이며, 그들을 해방하여 현재 그들이 놓인 억압 체제에서 벗어나게 할 것입니다."
 TUR_arm_saudi_rebels: "헤즈볼라 점령"
 TUR_arm_saudi_rebels_desc: "헤즈볼라는 레바논 전체를 장악하려 하거나, 최소한 레바논에 대한 군사적 통제를 행사하려 해 왔습니다. 우리는 레바논을 튀르키예의 보호령으로 삼을 것이므로, 이란의 대리 세력이 이를 이루도록 두지 않을 것입니다."
 TUR_anti_iran_diplomacy: "이란의 교리 제한"
 TUR_anti_iran_diplomacy_desc: "시리아군에는 이란을 드나든 고문이 많았습니다. 그 때문에 양측의 훈련 및 전투 방식이 매우 유사하며, 우리가 이란과 전쟁을 하게 되면 우리의 전술이 예측 가능해져 문제가 생길 것입니다."
 TUR_turkey_syria_union: "터키-시리아 연방"
 TUR_turkey_syria_union_desc: "우리와 시리아 모두 사람들이 항상 서로 혼동하는 종교적 소수파가 통치하고 있으므로, 우리의 힘을 합쳐 정치적 연합을 만드는 것이 어떻겠습니까? 고립된 종파로서는 이 지역의 수니파 영향력에 저항할 가능성이 없습니다."
 TUR_ottoman_revival: "오스만의 부활"
 TUR_ottoman_revival_desc: "수 세기 전 가장 위대한 제국 중 하나였던 §G오스만§!이 돌아왔습니다. 그러나 오늘날 정치 지형은 §H크게 변했으며§!, 고조된 §H민족주의§! 정서로 인해 제국의 재통합은 §R누구에게나 벅찬 과제§!가 되었습니다. 이러한 이유로 §G새로운 오스만 국가§!는 §H옛 영토§!의 주민들에게 더 나은 삶을 제공할 수 있음을 증명할 방법을 찾아야 합니다. 우리가 달래야 할 지역은 §H세 곳§!, 즉 중동, 레반트, 발칸입니다. 각 지역에는 우리가 §H지지를 높일 수 있는§! §H여러 국가§!가 있으며, 이들 국가 중 어느 곳에서든 §H지지율 100%§!에 도달하면 §H중핵을 획득§!하고 그 주민들의 신뢰를 얻을 수 있습니다.\n\n§R중동§!에서의 현재 지지율은 다음과 같습니다.\n\n[IRQ.GetFlag]이라크: §Y[?osman_iraq|%]§!\n\n[SYR.GetFlag]시리아: §Y[?osman_syria|%]§!\n\n[KUW.GetFlag]쿠웨이트: §Y[?osman_kuwait|%]§!\n\n§R레반트§!에서의 현재 지지율은 다음과 같습니다.\n\n[JOR.GetFlag]요르단: §Y[?osman_jor|%]§!\n\n[ISR.GetFlag][PAL.GetFlag]이스라엘/팔레스타인: §Y[?osman_isr|%]§!\n\n[LEB.GetFlag]레바논: §Y[?osman_leb|%]§!\n\n[HEJ.GetFlag]헤자즈: §Y[?osman_sau|%]§!\n\n§R발칸§!에서의 현재 지지율은 다음과 같습니다.\n\n[GRE.GetFlag]그리스: §Y[?osman_gre|%]§!\n\n[BUL.GetFlag]불가리아: §Y[?osman_bul|%]§!\n\n[FYR.GetFlag]마케도니아: §Y[?osman_fyr|%]§!"
 TUR_pan_turkic_dream: "범 투르크의 야망"
 TUR_pan_turkic_dream_desc: "위대한 우리 국가는 새로운 §C범튀르크의 꿈§!을 그려 왔습니다. 우리는 §H튀르크 국가 기구§!를 튀르크 국가들 사이에서 지지와 영향력을 얻는 수단으로 활용하여, 이들이 하나의 국가로서 우리와 합류하도록 서서히 이끌 것입니다. 이에 성공한다면 우리는 세계의 강대국으로 평가받을 수 있을 만큼 국가를 성장시킬 수 있을 것입니다. §H튀르크 연합에 가입할 자격이 있는 튀르크 국가들은 우리에 대한 관계가 높을수록 가입할 가능성이 더 큽니다!§!"
 TUR_domestic_politics_category: "터키 국내 정치"
 TUR_economy_category: "경제 위기"
 TUR_mafia_category: "터키 마피아"
 TUR_mafia_category_desc: "튀르키예 마피아는 마약 거래, 살인, 사기 등 온갖 범죄를 저지르며 꽤 오랫동안 활동해 왔습니다. 그러나 최근 몇 년간 그들은 점점 더 정치적으로 변해 왔으며, 일부 정당이 그들과 거래를 한 사실이 적발되어 서서히 그들에게 정당성을 부여하고 있습니다.\n\n §Y마피아 영향력§!은 §H마피아§!가 국가에 행사하는 전반적인 영향력을 나타냅니다. 영향력이 §H60§! 이상이면 우리 내부 파벌의 지도부나 군을 상대로 정치적 암살을 실행할 수 있게 됩니다. 또한 §H마피아§!는 우리에게 막대한 자금 손실을 입히는데, 영향력이 높을수록 더 많은 사람이 사기와 세금 관련 범죄를 저지를 수 있기 때문입니다. 아울러 영향력이 §H60§!에 도달하면 §H마피아 영향력§!이 §R2주마다 1씩 증가§!합니다. 특정 사건을 방치하거나 §H마피아§!를 상대할 때 잘못된 선택을 하면 이런 일이 벌어질 수 있습니다. 우리는 그들의 은신처를 급습하거나, 경찰 예산을 늘리거나, 심지어 정당 인기도를 유지하여 국민이 그들의 선전에 영향받지 않도록 함으로써 §H마피아 영향력§!에 대응할 수 있습니다. 또한 §H마피아 영향력§!을 §H30§! 미만으로 낮추면 수배 중인 §H마피아§! 범죄자들을 체포할 수 있으며, 결국 §H마피아§!를 완전히 근절할 수 있습니다.\n\n§H마피아 영향력§!: §R[?TUR.TUR_mafia_influence]§!"
 TUR_conduct_anti_mafia_raid: "반 마피아 작전 시행"
 TUR_conduct_anti_mafia_raid_desc: "마피아를 소탕하는 데 도움이 되는 작전을 수행하면 그들의 영향력을 빠르게 줄일 수 있으나, 비용이 매우 많이 듭니다."
 TUR_arrest_mafia_west: "Arrest Mafia members in Western Turkey"
 TUR_arrest_mafia_central: "터키 서부의 마피아 체포"
 TUR_arrest_mafia_south: "터키 남부의 마피아 체포"
 TUR_arrest_mafia_east: "터키 동부의 마피아 체포"
 TUR_victory_over_mafia: "§P마피아 근절§!"
 TUR_mafia_influence_mechanic: "세계적 임무"
 TUR_mafia_influence_mechanic_desc: "§P튀르키예 마피아§!는 단순한 국내 조직폭력배 집단 그 이상임을 스스로 입증했습니다. §H튀르키예 마피아는 전 세계에 연줄과 영향력을 가지고 있으며§!, 특정 지역에서는 그 정도가 더욱 큽니다. 튀르키예 디아스포라를 이용해 튀르키예 마피아는 다른 국가들에 대한 §H지지§!와 §H영향력§!을 얻고, 이를 이용해 새로운 §P마피아 대리 세력§!을 세울 수 있습니다. 이렇게 하면 §H튀르키예 마피아§!는 전 세계 정부를 뒤에서 조종하고, 경우에 따라서는 §R전복§!시킬 수도 있습니다.\n\n아래 표시된 것처럼 특정 국가에서 §H마피아 영향력이 높을수록§! 그들의 통제력도 커집니다. 마피아 영향력이 §R낮으면§! 마피아는 과감한 행동을 §R할 수 없습니다§!. 그러나 §H마피아 영향력이 높으면§! 선택지가 §G훨씬 많아집니다§!.\n\n§H영국에서의 영향력§!: §G[?mafia_uk|%]§!\n§H독일에서의 영향력§!: §G[?mafia_germany|%]§!\n§H네덜란드에서의 영향력§!: §G[?mafia_holland|%]§!\n§H오스트레일리아에서의 영향력§!: §G[?mafia_australia|%]§!\n§H벨기에에서의 영향력§!: §G[?mafia_belgium|%]§!\n\n색 없음 - 낮은 영향력\n§Y노란색§! - 일부 영향력\n§R빨간색§! - 막대한 영향력\n"
 TUR_start_eng_operations: "영국에서 작전 시작"
 TUR_close_eng_operations: "영국에서 작전 종료"
 TUR_boost_british_firms: "영국 기업 지원"
 TUR_fund_ira: "분리주의 원조"
 TUR_sow_division: "Sow division within politics"
 TUR_shatter_the_kingdom: "§P왕국을 분쇄하라§!"
 TUR_start_ger_operations: "독일의 작전 시작"
 TUR_close_ger_operations: "독일의 작전 종료"
 TUR_gray_wolves_networks: "회색 늑대 네트워크 확장"
 TUR_commit_vehicle_rob: "Smuggle out German vehicles"
 TUR_attack_german_politics: "부패한 정치인 색출"
 TUR_take_german_industries: "§P주요 산업 부문 통제§!"
 TUR_take_german_industries_desc: "독일 정치의 높은 부패 수준 덕분에 우리는 중요한 산업 부문을 우리의 필요에 맞게 쉽게 장악할 수 있습니다."
 TUR_start_hol_operations: "네덜란드에서 작전 시작"
 TUR_close_hol_operations: "네덜란드에서 작전 종료"
 TUR_establish_drug_networks_rotterdam: "마약 네트워크 확장"
 TUR_decrease_policing_holland: "치안 자금 공격"
 TUR_largest_drug_network: "§P대규모 마약 허브 설립§!"
 TUR_start_aus_operations: "호주에서 작전 시작"
 TUR_close_aus_operations: "호주에서 작전 종료"
 TUR_boost_honoured_society: "공경의 사회 분열"
 TUR_target_aussie_welfare: "호주 삶의 기준 공격"
 TUR_spread_hatred_indonesia: "Start rumours between Indonesia and Australia"
 TUR_watch_the_conflict: "§P호주의 보물 훔치기§!"
 TUR_watch_the_conflict_desc: "우리의 연줄과 영향력을 이용해 오스트레일리아의 귀금속을 빼돌려 우리의 물자로 사용할 것입니다."
 TUR_start_bel_operations: "벨기에에서 작전 시작"
 TUR_close_bel_operations: "벨기에에서 작전 종료"
 TUR_fund_bel_mafia: "벨기에 범죄자 장악"
 TUR_steal_crucial_info: "과학 데이터 훔치기"
 TUR_strings_in_belgian_govt: "벨기에 정계와의 연줄"
 TUR_our_puppets: "§P중요 벨기에 연구자들의 도피§!"
 TUR_our_puppets_desc: "벨기에의 중요한 연구자들을 빼내 오면 그들을 튀르키예에서 우리의 이익을 위해 활용할 수 있습니다."
 TUR_hire_gulenist_economic_advisors: "귤렌 경제 조언가 고용"
 TUR_hire_gulenist_economic_advisors_desc: "전 세계의 방대한 전문가 풀에서 경제 전문가를 고용해 경제 운영에 관해 정부에 조언하도록 할 수 있습니다."
 TUR_employ_gulenist_informants: "귤렌 정보원 고용"
 TUR_employ_gulenist_informants_desc: "귈렌주의자들은 전 세계에 퍼져 있습니다. 정보원을 고용하면 정보를 더 쉽게 수집할 수 있습니다."
 TUR_hire_gulenist_educators: "귤렌 교육자 고용"
 TUR_hire_gulenist_educators_desc: "전 세계에 있는 저명한 귈렌주의 학자들을 많이 고용하면 교육 효과를 크게 높일 수 있습니다."
 TUR_recall_gulenists: "다시 귤렌과 함께"
 TUR_recall_gulenists_desc: "귈렌주의자들을 튀르키예로 초청하여 조국을 위해 봉사하게 해야 합니다."
 TUR_call_out_ozkan: "부총리 외즈칸을 공개 비난하라"
 TUR_call_out_ozkan_desc: "[ROOT.GetLeader]을(를) 권좌에서 끌어내리려는 시도를 한 배신자 외즈칸을 규탄해야 합니다. 그러나 그가 사임을 강요당하면 새로운 정당을 창당하려 할 위험이 있습니다."
 TUR_ban_fazilet_partisi: "§W[Conservative_L]§! 금지"
 TUR_ban_fazilet_partisi_desc: "§W[Conservative_L]§!은 이슬람주의 정당이며, 세속 튀르키예 국가에는 이러한 정당이 있을 자리가 없습니다. 당원 다수는 이미 이전에 지금은 금지된 이슬람주의 정당들에서 활동한 바 있습니다. §W[Conservative_L]§!을 금지해도 당원들이 새로운 정당을 만들 것이므로 지속적인 효과는 없겠지만, 어느 정도 파벌 분열을 일으키고 전반적으로 반대 세력을 약화시킬 수는 있습니다."
 TUR_big_crash_coming: "큰 충격으로부터 회복"
 TUR_big_crash_coming_desc: "2013년 이후 우리 경제는 크게 악화되었으며 이는 우리를 불황으로 끌고 갈 것입니다."
 TUR_sell_reserves: "보유고 판매"
 TUR_sell_reserves_desc: "보유고를 매각하면 대폭락을 늦출 수 있습니다."
 TUR_imf_program: "IMF 프로그램으로부터 복귀"
 TUR_imf_program_desc: "IMF 프로그램은 2001년부터 2008년까지 튀르키예의 경제 계획이었으며 이 기간 경제는 빠르게 성장했습니다. 에르도안은 \\"오늘 대출을 받는 자는 내일 돈의 명령을 받는다\\"라고 말하며 IMF가 위험하다고 선언했고, 이에 IMF 프로그램은 취소되었으며 튀르키예는 IMF로부터 빌린 모든 부채를 상환했습니다."
 TUR_law_reform: "정책 개혁"
 TUR_law_reform_desc: "법률을 개혁하고 법원을 독립시키는 것은 경제를 바로잡는 중요한 단계이지만, AKP와 관련된 부패 스캔들이 발생할 수 있습니다."
 TUR_reestablish_village_institutes: "마을 기관 재설립"
 TUR_reestablish_village_institutes_desc: "마을 학교는 주민들이 운영하는 지역 교육 기관으로, 농촌 지역 사람들에게 다양한 기술을 가르칩니다."
 TUR_incentivise_modern_farming: "현대적 농업 장려"
 TUR_incentivise_modern_farming_desc: "농민과 농산물 구매자에게 세금 면제를 부여해야 합니다. 또한 농업 과정에 기술을 더 긴밀하게 도입해야 합니다."
 TUR_heavily_subsidise_agriculture: "막대한 농업 지원금"
 TUR_heavily_subsidise_agriculture_desc: "강력한 농업 부문을 갖추려면 농민에게 막대한 보조금을 지급해야 합니다."
 TUR_encourage_communal_farming: "공동체 농업 장려"
 TUR_encourage_communal_farming_desc: "대기업이 운영하는 대규모 농장을 밀어내기 위해 공동 영농을 장려해야 합니다."
 TUR_implement_revolutionary_education: "혁명적 교육 도입"
 TUR_implement_revolutionary_education_desc: "사람들이 올바른 생각을 유지하도록 혁명 교육을 교육 제도에 도입해야 합니다."
 TUR_migrants: "이민법 개정"
 TUR_migrants_desc: "인접 국가들의 혼란으로 인해 사람들이 대거 유입되고 있으므로 이민법을 검토해야 합니다."
 TUR_mit_decision: "터키 국가정보부 (MIT) 개혁"
 TUR_mit_decision_desc: "국가 안보 기관인 MIT는 우리의 새로운 방침에 더 잘 부합하도록 개편되어야 합니다."
 TUR_disaster_decision: "재난구조위원회 설립"
 TUR_disaster_decision_desc: "지진과 자연재해가 도처에서 발생하고 있으며, 가능한 한 빨리 이에 대처할 방법을 마련해야 합니다."
 TUR_nationalist_rise: "터키 민족주의 부상"
 TUR_nationalist_rise_desc: "민족주의가 항상 나쁜 것은 아니지만 지나치면 문제입니다. 우리나라가 그러한 경우로, 현재 국경 내에서 민족 간 갈등을 일으키고 있습니다."
 TUR_drug_problems_decision: "마약 문제"
 TUR_drug_problems_decision_desc: "튀르키예를 드나드는 마약이 많습니다. 이는 우리와 이웃 나라, 그리고 국민에게 문제를 일으킵니다."
 TUR_redesign_bosphorus: "보스포루스 해협 재설계"
 TUR_redesign_bosphorus_desc: "보스포루스 해안은 현대적인 고층 건물로 가득 차 있으며 역사적 건축물 상당수가 완전히 사라졌습니다. 이 지역의 개발을 제한하고 옛 아름다운 모습으로 되돌려야 합니다. 해안은 모든 이스탄불 시민이 시간을 보낼 수 있는 공간이 될 것입니다."
 TUR_establish_shia_dominance: "시아파 장악"
 TUR_establish_shia_dominance_desc: "튀르키예에서 가장 큰 종교적 소수 집단 중 하나는 인구의 10%에서 20%를 차지하는 알레비파(아랍의 알라위파와 혼동하지 마십시오)입니다. 알레비파는 여러 차례 학살의 표적이 되었으며, 튀르키예 정부는 이들을 지배적인 수니파와 구별되는 종교 집단으로 지정하려 하지 않았습니다. 엄밀히 말해 공식적인 시아파는 아니지만 알레비파는 이란의 전 아야톨라 루홀라 호메이니에 의해 시아파로 규정되었습니다. 많은 알레비파 역시 스스로를 시아파로 여깁니다. 우리는 튀르키예에서 수니파의 지배를 깨뜨려야 합니다."
 TUR_greek_issues: "친구인가, 적인가?"
 TUR_greek_issues_desc: "한때 우리의 역사적 속주였던 그리스는 NATO 때문에 우리와 동맹을 맺도록 강요받았습니다. 그러나 동맹에도 불구하고 수많은 분쟁 때문에 양국 관계는 조금도 나아지지 않았습니다."
 TUR_cypriot_troubles: "키프로스 갈등"
 TUR_cypriot_troubles_desc: "우리가 북부에 군대를 투입한 이래로 키프로스는 끝없는 분쟁의 섬이 되었습니다. 그리스는 이 문제로 계속 떠들어 왔고, 이 섬나라에서 우리가 얻은 성과를 무너뜨리려는 것으로 보입니다. 이에 적절히 대처해야 합니다."
 TUR_direct_involvement: "직접 개입"
 TUR_direct_involvement_desc: "NATO를 탈퇴했으므로 튀르키예의 영향력을 행사하는 데 부과되던 여러 제약에서 더 이상 구속받지 않습니다. 이는 우리가 능력을 제한할 필요 없이 키프로스에 직접 개입할 수 있다는 뜻입니다."
 TUR_demand_british_withdrawal: "독일의 철수 요구"
 TUR_demand_british_withdrawal_desc: "영국은 역사적으로 모든 일에 참견해 왔으나 최근 몇 년간 그들의 제국은 무너지고 있습니다. 그러나 키프로스는 예외였습니다. 영국은 여전히 아크로티리에 주둔하고 있으며, 우리가 필연적으로 남쪽으로 확장할 때 문제를 일으킬 것입니다."
 TUR_bring_the_north_to_fold: "터키와의 통합"
 TUR_bring_the_north_to_fold_desc: "북키프로스인은 튀르크인이며 또 다른 튀르크 국가가 존재할 이유가 없습니다. 우리는 그들의 정부에 우리 정부에 합류하도록 요구하고 튀르크 민족을 통합할 것입니다."
 TUR_history_repeated: "한 번 시작한 일은 끝을 봐라"
 TUR_history_repeated_desc: "우리가 시작한 일을 끝내야 합니다. 남쪽으로 진격하지 않기로 한 참담한 결정 이후 키프로스는 둘로 나뉘었습니다. 그리스가 좋아하든 말든 우리는 군대를 동원하여 키프로스 나머지 지역에 대한 두 번째 침공을 수행해야 합니다!"
 TUR_indirect_involvement: "간접적 관여"
 TUR_indirect_involvement_desc: "공화국으로서 우리는 내키는 대로 분쟁을 일으킬 수 없으며 더 자제해야 합니다. 따라서 키프로스에 관해서는 더 간접적인 접근을 택하고 북키프로스의 정당한 정부를 지지할 것입니다."
 TUR_provide_military_training: "군사 훈련 제공"
 TUR_provide_military_training_desc: "불가피한 충돌에 대비하여 북키프로스의 민병대를 훈련시키기 위해 튀르키예군에서 일부 전문가를 파견할 것입니다."
 TUR_fund_militias: "키프로스 민병대 원조"
 TUR_fund_militias_desc: "민병대에게 어느 정도 훈련을 제공했으므로, 이제 그들이 남키프로스를 되찾는 데 충분한 역량을 갖추었다고 판단하고 안심하고 무기와 추가 자금을 제공할 수 있습니다."
 TUR_great_uprising: "게임을 시작하지!"
 TUR_great_uprising_desc: "우리는 남키프로스인에 맞선 북키프로스 민병대를 훈련하고 자금을 지원하고 무장시키는 데 성공했으므로, 이제 북키프로스인이 우리의 전쟁을 대신 치르는 것을 느긋하게 지켜볼 수 있습니다."
 TUR_path_of_compromise: "협상의 길"
 TUR_path_of_compromise_desc: "이웃 나라와 또다시 끝없는 분쟁을 시작하지 않는 편이 낫습니다. 오히려 화해하고 우호를 강화하는 것이 더 현명합니다."
 TUR_withdraw_support_cyprus: "터키의 지원 철회"
 TUR_withdraw_support_cyprus_desc: "우리는 더 이상 북키프로스 정부를 지지하지 않을 것이며, 남키프로스 정부를 유일한 키프로스 국가 정부로 인정할 것입니다."
 TUR_support_one_cyprus: "한 키프로스의 이야기"
 TUR_support_one_cyprus_desc: "우리는 하나의 키프로스라는 개념을 공개적으로 지지할 것이며, 키프로스를 분단 상태로 유지해 온 수십 년간의 정치를 뒤집을 것입니다!"
 TUR_peaceful_unification: "평화적인 통일?"
 TUR_peaceful_unification_desc: "우리는 북키프로스 정부에 남키프로스 정부와 합류하도록 정중히 요청할 것입니다. 평화적으로 말입니다..."
 TUR_acquire_agean: "에게해 요구"
 TUR_acquire_agean_desc: "이제 우리는 국익을 포기하는 한이 있더라도 타협할 의지가 있음을 그리스에 공식적으로 보여 주었으므로, 에게해를 튀르키예의 통제 아래로 넘겨 달라고 정중히 요청할 것입니다."
 TUR_aegan_dispute: "에게해 분쟁"
 TUR_aegan_dispute_desc: "에게해 섬들은 제1차 세계 대전 종전 이후 그리스가 통제해 왔으며, 이는 튀르키예 민족에게 참담한 결과를 안겼습니다. 우리가 이 섬들에 대해 역사적 영유권을 주장해 왔음에도 그리스 정부는 우리에게 부분적인 통제권을 주는 것조차 주저하고 있으며, 이는 무력으로 이를 달성할 방법을 찾아야 한다는 뜻입니다."
 TUR_crete_rebellion: "크레타 민족주의 유발"
 TUR_crete_rebellion_desc: "크레타 주민들이 그리스의 통제 아래에서 점령당했다고 느끼게 만들 수 있다면, 에게해가 아니더라도 무언가를 얻을 수 있을 것입니다."
 TUR_arm_crete_national_army: "크레다 국군 창설"
 TUR_arm_crete_national_army_desc: "언젠가 그리스의 침공이 닥친다면 스스로를 방어할 수 있기를 바라며 크레타 국민군을 창설할 것입니다."
 TUR_smuggle_trucks: "트럭 밀수"
 TUR_smuggle_trucks_desc: "크레타 국민군은 소형 화기와 포병만으로는 운용될 수 없으며 트럭이 필요합니다. 그들이 준비를 갖출 수 있도록 트럭을 제공할 것입니다."
 TUR_let_the_games_begin: "Cretan Independence!"
 TUR_let_the_games_begin_desc: "오늘은 크레타가 마침내 그리스로부터의 독립을 선언하고 튀르키예의 보호령이 되는 날입니다!"
 TUR_fortify_coast: "아테네를 향한 선전"
 TUR_fortify_coast_desc: "그리스 텔레비전 방송국을 매수하여 그리스인을 겨냥한 선전을 공개적으로 방송하기 시작할 것입니다. 이는 서서히 그리스를 불안정하게 만들고 분쟁 시 우리에게 우위를 가져다줄 것입니다."
 TUR_border_pictures: "부패 정치인 색출"
 TUR_border_pictures_desc: "부패한 그리스 정치인들의 주머니는 깊으며, 곧 튀르키예의 돈으로 채워지기 시작할 것입니다. 우리는 그들의 선거 제도를 조종하여 우리가 원하는 정당에 영향력을 행사할 수 있기 때문입니다."
 TUR_last_second_upgrades: "그들의 산업을 파괴하라"
 TUR_last_second_upgrades_desc: "이제 우리는 그리스 국가에 대해 어느 정도 영향력을 가지고 있으므로, 아테네에서 그들과 마주쳤을 때 그들이 더 약해져 있도록 그들의 산업을 파괴하기 시작할 수 있습니다!"
 TUR_siege_of_greece: "아테네는 5분만에"
 TUR_siege_of_greece_desc: "튀르키예의 장갑 부대와 보병이 아테네로 진입하여 그들의 땅에 초승달 깃발을 게양하는 데는 오랜 시간이 걸리지 않을 것입니다!"
 TUR_operation_sledgehammer: "에르케네콘(Ergenekon)의 심판"
 TUR_operation_sledgehammer_desc: "The AKP has been eyeing the presidential office for quite some time now... And it won't be too long before they get what they have been so patiently waiting for."
 TUR_purge_army: "군대 재편성"
 TUR_purge_army_desc: "단 5일이라도 더 오래 권력을 유지할 아주 작은 가능성이라도 원한다면, 지출을 삭감하는 한이 있더라도 군 전체를 재편해야 합니다!"
 TUR_reorganize_army: "슬레지해머 작전"
 TUR_reorganize_army_desc: "슬레지해머 작전이 시작될 것이며, 작전이 끝나면 우리는 이를 우리가 직면한 정치적 반대 세력을 숙청하는 수단으로 사용할 수 있습니다."
 TUR_purge_judges: "사법부 개혁"
 TUR_purge_judges_desc: "우리나라의 사법 체계 내에는 귈렌주의 동조자가 많으며, 우리 체계가 부패하여 우리에게 맞서게 될 것이므로 이를 방치할 수 없습니다."
 TUR_judges_become_criminals: "마지막 숙청"
 TUR_judges_become_criminals_desc: "이제 사법 제도 전체를 개혁하고 제도 내의 잠재적 귈렌주의자들을 모두 해임했으므로, 우리는 큰 저항 없이 마침내 그들을 기소할 수 있습니다. 또한 국민이 그 결과를 알 수 있도록 이 재판들을 공개적으로 방송할 것입니다."
 TUR_party_of_development_and_justice: "정의와 개발의 정당?"
 TUR_party_of_development_and_justice_desc: "우리는 정의개발당이지만 그 약속을 이행할지는 알 수 없습니다. 우리 앞에는 매우 긴 길이 놓여 있으며, 시간이 흐르면서 그 길을 닦아 나가야 할 것입니다."
 TUR_zero_problems_policy: "\"제로 프라블럼 (Zero Problems)\" 정책"
 TUR_zero_problems_policy_desc: "우리는 대립 대신 협력과 외교를 최우선에 두고 이웃 나라들과 \\"문제 제로\\" 정책을 추진할 것입니다."
 TUR_economic_cooperation_iran: "이란과 브로커 거래"
 TUR_economic_cooperation_iran_desc: "이란의 경제는 수십 년간 직면해 온 제재로 인해 투자가 절실히 필요합니다. 일부 튀르키예 기업이 이란 영토에 진출하도록 접촉하면 양국 모두에 이익이 됩니다. 우리는 영향력을 얻고 그들은 투자를 받기 때문입니다."
 TUR_mediate_nagarno_karabakh: "카라바흐 분쟁의 중재"
 TUR_mediate_nagarno_karabakh_desc: "우리의 가까운 친구인 아제르바이잔은 양국 사이의 작은 영토를 두고 아르메니아와 싸워 왔습니다. 이 분쟁은 불필요하며, 모두가 만족하도록 양측 간의 회담을 중재할 수 있을지도 모릅니다."
 TUR_promote_turkish_interests_syria: "시리아에서 혼란 종용"
 TUR_promote_turkish_interests_syria_desc: "남쪽 시리아의 전반적인 불안정은 우리가 더 큰 영향력을 얻기 위해 그들을 이용할 수 있는 절호의 기회를 주었습니다."
 TUR_legalize_kurdish_language: "쿠르드어 합법화"
 TUR_legalize_kurdish_language_desc: "쿠르드어는 수년간 튀르키예에서 금지되어 왔으며, 아나톨리아에서 튀르크의 우위를 보존하려면 그대로 두는 편이 아마도 최선일 것입니다. 하지만 그 대가는 무엇입니까? 우리는 스스로를 공화국이라 부르면서도 한 민족의 모국어 사용 권리를 박탈하고 있지 않습니까?"
 TUR_open_hostilities_with_greece: "난민 활용"
 TUR_open_hostilities_with_greece_desc: "우리는 주요 난민 목적지이며 그 때문에 많은 난민 인구를 가지고 있습니다. 이를 우리에게 유리하게 이용하여 국경 너머 그리스로 보내 불안정과 혼란을 일으킬 수 있습니다."
 TUR_side_with_azerbaijan_against_armenia: "아제르바이잔 지원"
 TUR_side_with_azerbaijan_against_armenia_desc: "아제르바이잔은 카라바흐의 정당한 소유자이며 아르메니아는 이를 알아야 합니다. 충돌의 위험이 있더라도 우리는 아제리인을 공개적으로 지지하고 그들이 추가 행동에 나서도록 힘을 실어 줄 것입니다!"
 TUR_a_new_barrier: "완충지대"
 TUR_a_new_barrier_desc: "시리아의 쿠르드인이 우리의 주권을 위협하고 있습니다. 우리와 시리아 사이에 즉시 완충 지대를 설정해야 합니다!"
 TUR_tighten_kurdish_restrictions: "쿠르드 법 강화"
 TUR_tighten_kurdish_restrictions_desc: "우리가 무엇을 하든 쿠르드인은 계속 말썽을 일으킵니다. 우리는 손이 묶인 것으로 보이며, 그들이 우리에게 문제를 일으키는 것을 멈출 때까지 제한을 강화하는 수밖에 없습니다."
 TUR_erdonomics: "에르도안 경제"
 TUR_erdonomics_desc: "Erdonomics is the wave of economic reforms brought forth by Recep Tayyip Erdogan and his party. There are several ways this can go, good, bad, or terrible, but it all comes down to how the policy is pursued"
 TUR_cheaper_credit: "금리, 그게 뭔데?"
 TUR_cheaper_credit_desc: "솔직히, 진짜 그게 필요하긴 한가?"
 TUR_dont_fix_what_isnt_broken: "망가지지 않았다면 고치지 말라"
 TUR_dont_fix_what_isnt_broken_desc: "튀르키예 경제는 현재 상태로도 충분히 잘 돌아가고 있으며 더 이상 손댈 필요가 없습니다. 그러지 않으면 경제 붕괴의 위험을 무릅쓰게 될 수 있습니다."
 TUR_digitalization_of_turkey: "터키의 디지털화"
 TUR_digitalization_of_turkey_desc: "새로운 기술과 새 시대의 지식으로 21세기에 발맞춰 나아가야 합니다. 그렇지 않으면 뒤처질 것입니다."
 TUR_lift_tv_restrictions: "TV 제한 철회"
 TUR_lift_tv_restrictions_desc: "튀르키예 텔레비전에는 많은 검열이 부과되어 있습니다. 이를 해제하고 오래전에 박탈된 자유를 허용하는 것이 우리에게 가장 이롭습니다."
 TUR_return_to_tradition: "전통으로의 회귀"
 TUR_return_to_tradition_desc: "우리는 우리의 뿌리이자 근원인, 이슬람으로 돌아가야만 합니다. 보수주의만이 터키를 문제있는 외부의 사회가 우리나라에 투영되는 것을 막을 수 있습니다!"
 TUR_islamic_politics: "새로운 조언가"
 TUR_islamic_politics_desc: "우리 내각은 지도부를 잘못된 길로 이끄는 무능한 고문들로 가득 차 있습니다. 경제든 정책이든 새로운 고문을 찾아야 할 때입니다."
 TUR_imams_in_office: "총리 해고"
 TUR_imams_in_office_desc: "우리 나라의 민주주의가 발전하고 개혁될 수 있도록 총리직을 폐지해야 합니다."
 TUR_mosque_funding: "모스크 장악"
 TUR_mosque_funding_desc: "우리나라의 보수 세력을 설득하려면 모스크의 지지가 필요하며, 이는 결국 농촌 주민들로부터 더 많은 지지를 얻게 해 줄 것입니다."
 TUR_islamic_society: "우리 사회의 이슬람"
 TUR_islamic_society_desc: "우리 사회에서 이슬람의 역할을 재평가합시다. 우리는 어떤 방법으로든 우리나라에서 이슬람 교육을 확대해야 합니다."
 TUR_expand_diyanet_role: "종교부"
 TUR_expand_diyanet_role_desc: "종교청은 앞으로 매우 유용할 것이며, 우리의 권력이 국가 전역에 넓게 미치도록 우리 사회에서 종교청의 역할을 확대할 수 있습니다."
 TUR_strings_in_judiciary: "연줄을 활용하라"
 TUR_strings_in_judiciary_desc: "우리 운동은 사법 제도 내에서 많은 지지를 받고 있으며.. 이를 우리에게 유리하게 활용하여 AKP를 서서히, 그러나 확실하게 뿌리 뽑을 수 있습니다."
 TUR_connections_in_army: "군 내부의 동조자"
 TUR_connections_in_army_desc: "방대한 지지 기반 덕분에 군 내부의 연줄을 이용해 그들을 우리 편으로 만들고 잠재적인 쿠데타를 방지할 수 있습니다."
 TUR_suspicious_generals_resign: "의혹있는 장성들의 사임 압박"
 TUR_suspicious_generals_resign_desc: "현재 TSK에는 수상한 장군들이 많이 활동하고 있습니다. 이들 중 일부를 사임시킬 수 있으며, 그렇게 하면 저항 없이 군의 모든 부문에 대한 통제권을 공고히 할 수 있습니다."
 TUR_cracks_in_akp: "정의개발당 (AKP) 지도부의 균열"
 TUR_cracks_in_akp_desc: "AKP 지도부를 공개적으로 비난하고 그들의 당 내부에 불안정을 조성할 것입니다. 이는 분명히 그들의 인기를 떨어뜨리겠지만, 거의 확실히 시위가 일어나는 분위기도 조성할 것입니다."
 TUR_mobilize_diaspora: "온 세상의 유대인들과 함께"
 TUR_mobilize_diaspora_desc: "다른 나라에 있는 디아스포라를 이용해 우리 정부의 정당성을 확보할 수 있습니다."
 TUR_service_to_the_community: "공동체에 대한 우리의 헌신"
 TUR_service_to_the_community_desc: "히즈메트는 말 그대로 봉사, 즉 공동체에 대한 봉사를 의미합니다. 우리는 이 이상을 지켜 나가고 우리 사회를 더 나은 방향으로 개선하기 시작해야 합니다."
 TUR_attack_the_left: "좌파를 공격하라"
 TUR_attack_the_left_desc: "좌파는 반이슬람 이념으로 우리 나라를 망치려 할 것입니다. 우리는 그들의 정당성을 공격하고 대중 앞에서 그들의 평판을 떨어뜨려야 합니다."
 TUR_attack_the_right: "우파를 공격하라"
 TUR_attack_the_right_desc: "우익은 이 나라의 종말이 될 것입니다. 그들은 우리나라를 세계로부터 고립시킬 것이기 때문입니다. 그들의 행동은 튀르키예를 이웃 나라와의 끝없는 분쟁으로 끌고 갈 수도 있습니다!"
 TUR_ally_fp: "미덕당 (FP)의 운명"
 TUR_ally_fp_desc: "미덕당(FP)은 우리가 집권하기 전에 금지되었으며, 뿔뿔이 흩어진 당원과 단체가 상당히 많습니다. 그중 일부와는 협상할 수 있을 것입니다."
 TUR_clean_energy_shift: "친환경으로의 변화"
 TUR_clean_energy_shift_desc: "지구에 큰 도움을 주어야 하며, 우리나라를 청정 에너지로 전환함으로써 이를 이룰 수 있습니다. 청정 에너지를 사용하면 필요한 연료를 국가에 공급하는 동시에 환경을 오염으로부터 보호할 수 있습니다."
 TUR_international_community: "국제적 공동체"
 TUR_international_community_desc: "물론 우리의 주된 관심은 튀르키예에 있지만, 전 세계를 더 나은 곳으로 만들 의무도 있습니다."
 TUR_condemn_gulf_monarchies: "사우디 군주제 비난"
 TUR_condemn_gulf_monarchies_desc: "안타깝게도 사우디는 우리 단체를 테러 조직으로 지정함으로써 공격적인 길을 택했습니다. 우리는 이러한 공격성을 용납할 수 없다는 점을 그들에게 보여 주어야 합니다."
 TUR_support_kosovo: "코소보 지지"
 TUR_support_kosovo_desc: "코소보는 한동안 세르비아의 점령 아래 있었으며, 같은 무슬림으로서 우리는 그들이 더 이상 이러한 피해를 입도록 두고 볼 수 없습니다."
 TUR_fatih_university: "신학 대학"
 TUR_fatih_university_desc: "파티흐 대학교 교직원 중에는 귈렌주의 동조자가 많습니다. 우리는 그들에게 추가 자금을 제공하고 귈렌의 가르침을 널리 퍼뜨릴 것입니다."
 TUR_strengthen_private_sector: "Strengthen Gülenist Businesses"
 TUR_strengthen_private_sector_desc: "현재 많은 기업이 귈렌주의자들에 의해 소유되고 운영되고 있으며, 이는 우리에게 국가 내에서 큰 이점을 줍니다. 이들에게 자금을 지원하고 입지를 강화하면 가까운 미래에 우리에게 크게 도움이 될 것입니다."
 TUR_gulenist_medias: "귤렌의 언론 지원"
 TUR_gulenist_medias_desc: "집회를 열지 않고도 귈렌의 메시지를 전파할 새로운 방법을 찾아야 합니다."
 TUR_zaman_media_group: "자만 (Zaman) 미디어 그룹의 디지털화"
 TUR_zaman_media_group_desc: "자만 미디어 그룹은 우리 정부와 매우 긴밀하게 협력하는 신문사입니다. 이들에게 약간의 지원을 제공하면 디지털로 전환하여 페툴라흐 귈렌의 메시지를 널리 퍼뜨리는 데 도움이 될 수 있습니다."
 TUR_gulenist_charity: "귤렌의 기금"
 TUR_gulenist_charity_desc: "이슬람의 주요 기둥 중 하나는 자선입니다. 우리 운동은 이를 잊지 않을 것이며 가난하고 궁핍한 이들을 돕는 새로운 자선 단체를 설립하는 데 전념할 것입니다."
 TUR_kimse_yok_mu: "자선단체 “거기 누구 있어요? (Kimse Yok Mu?)”"
 TUR_kimse_yok_mu_desc: "'거기 아무도 없습니까?'는 도움이 필요한 사람들을 도울 새로 설립된 귈렌주의 자선 단체 중 하나의 이름입니다."
 TUR_cultural_centers: "복합 기업에 귀를 기울여라"
 TUR_cultural_centers_desc: "산업 재벌들은 우리 정부 내에서 큰 영향력을 가지고 있으며 우리 정치에 매우 쉽게 영향을 미칠 수 있습니다. 그들을 달래는 것이 최선의 선택이며, 이는 그들로 인해 앞으로 생길 골칫거리를 막아 줄 수 있습니다."
 TUR_right_wing_victory: "우익의 승리"
 TUR_right_wing_victory_desc: "MHP가 선거에서 승리를 확보했으며, 튀르키예를 다른 나라들에 공격적인 정책을 취하는 극단적 민족주의 국가로 탈바꿈시킬 것입니다. 일부는 튀르키예가 이웃 나라들을 서서히 압박하면서 곧 국제적 불량배가 될 것을 우려합니다.."
 TUR_crack_down_secularists: "세속주의를 무너트려라"
 TUR_crack_down_secularists_desc: "세속주의자들은 무엇이 나라에 이로운지 모르는 사람들입니다. 그들은 \\"개인의 자유\\"를 외치며 울부짖을 뿐이며 대체로 반이슬람적 관점을 가지고 있습니다. 우리는 그들이 전국적으로 세력을 얻는 능력을 파괴하고 그들이 만든 변화를 되돌려야 합니다!"
 TUR_crack_down_foreign_influence: "해외 영향력을 짓밟아라"
 TUR_crack_down_foreign_influence_desc: "외국인들이 우리를 대신해 튀르키예를 운영하려 하고 있습니다! 그들을 즉시 몰아내고 우리가 직접 나라를 운영해야 합니다."
 TUR_crack_down_corruption: "부패를 척결하라"
 TUR_crack_down_corruption_desc: "부패한 정치인들은 우리 국가를 느리게 만들며, 국가가 제 기능을 하지 못하면 뒤처지게 됩니다. 부패한 정치인들을 숙청하는 것만이 우리가 앞으로 나아갈 유일한 길입니다."
 TUR_crackdown_kurdish_resistance: "쿠르디스탄 노동자당의 저항을 분쇄하라"
 TUR_crackdown_kurdish_resistance_desc: "PKK는 우리에게 상당한 문제를 일으키고 있습니다.. 솔직히 말해 그들을 더 공격적으로 상대해야 할 것입니다."
 TUR_demand_return_of_suspects: "용의자 송환 요구"
 TUR_demand_return_of_suspects_desc: "다른 나라에는 많은 PKK 조직원이 있습니다. 우리는 이들 국가에 해당 인물들을 즉시 추방하도록 요구하여 재판을 열고 그들의 영향력을 제한할 것입니다."
 TUR_the_threat_abroad: "대외의 위협"
 TUR_the_threat_abroad_desc: "해외에는 중대한 위협이 있으며 우리는 그 사이에 끼어 있습니다. 우리나라의 동쪽과 서쪽에는 우리를 파괴하려고 필사적으로 애쓰는 적들이 있습니다."
 TUR_eastern_nuisance: "동부의 소란"
 TUR_eastern_nuisance_desc: "이란과 러시아는 수 세기 동안 우리의 역사적 적이었습니다. 하지만 오늘날 그들은 가면을 쓰고 우리의 친구인 척하고 있으며, 이는 용납할 수 없습니다! 우리는 그들을 배제하고 그들이 제자리를 찾게 만드는 행동을 추진할 것입니다."
 TUR_fight_russian_influence: "러시아의 영향력을 반격하라"
 TUR_fight_russian_influence_desc: "러시아는 우리 정치와 이웃 나라들의 정치에 영향을 미치려 하고 있습니다. 우리가 가장 먼저 할 일은 이 영향력에 우리 자신의 영향력으로 맞서는 것입니다."
 TUR_hamper_the_ayatollahs: "이란의 성장을 저해하라"
 TUR_hamper_the_ayatollahs_desc: "이란은 전진하고 있으며 매우 빠르게 성장하고 있습니다. 가능한 한 빨리 그들의 능력을 저지해야 합니다."
 TUR_balkan_pests: "발칸의 해충들"
 TUR_balkan_pests_desc: "우리는 역사적으로 발칸을 소유했으며, 그때는 매우 평화로웠습니다. 그러나 발칸 전쟁 중에 우리는 발칸을 잃었습니다. 하지만 오늘 우리는 발칸을 되찾을 것이며, 크나큰 자부심을 가지고 되찾을 것입니다!"
 TUR_thrace_becomes_one: "하나되는 트라키아"
 TUR_thrace_becomes_one_desc: "트라키아는 둘로 나뉘어 한쪽은 우리 영토에, 다른 한쪽은 그리스에 있습니다. 어찌하여 이래야 합니까? 우리는 트라키아 주민들이 초승달과 별이라는 하나의 깃발 아래 통합되도록 할 것입니다."
 TUR_campaign_against_athens: "불가리아 재수복"
 TUR_campaign_against_athens_desc: "불가리아는 우리에게서 떨어져 나간 수많은 빌라예트 중 하나입니다. 그들을 되찾아 튀르키예 민족과 다시 한번 통합하는 것이 우리의 의무입니다."
 TUR_end_of_elections: "공화국의 최후"
 TUR_end_of_elections_desc: "오늘 이 날, 튀르키예 공화국은 사라질 것입니다. 우리 국민은 이른바 \\"선출된 정부\\"라는 구실 아래 억압당하고 세뇌당해 왔습니다. 우리 국민은 수십 년간 케말주의 체제에 의해 잘못 인도되고, 거짓말을 들었으며, 조종당해 왔습니다."
 TUR_pan_turkey: "범 튀르크의 여명"
 TUR_pan_turkey_desc: "오늘날 튀르크어를 사용하는 민족들은 여러 영토로 나뉘어 있습니다. 일부는 이곳 튀르키예에, 일부는 캅카스에, 또 다른 일부는 중앙아시아에 있습니다. 튀르크의 꿈은 잊히지 않을 것이며, 민족은 다시 한번 하나가 될 것입니다."
 TUR_a_new_empire: "매우 굶주린 늑대여.."
 TUR_a_new_empire_desc: "튀르크의 늑대는 수십 년 동안 굶주려 더 이상 울부짖지 못합니다. 그러나 이는 바뀔 것입니다. 세계는 튀르키예 민족이 자신들과 그 국민을 위해 세계를 나누어 가지는 것을 보며 떨게 될 것입니다."
 TUR_ottoman_politics: "[ROOT.TUR_ottomanism_name]"
 TUR_ottoman_politics_desc: "[ROOT.TUR_ottomanism_name_desc]"
 TUR_nine_light_name: "“아홉개의 불빛” 교리"
 TUR_nine_light_name_desc: "구광 교리는 튀르크 민족주의와 이슬람에 기반을 두고 있습니다. 이는 모두를 위한 선이라는 이상을 대표하며, 우리 당은 이에 크게 영향을 받았습니다."
 TUR_ottomanism_name: "오스만 정책"
 TUR_ottomanism_name_desc: "우리 조상들은 아무 문제 없이 통치할 수 있었으며, 이는 성공하려면 그들의 발자취를 따라야 한다는 뜻일 뿐입니다."
 TUR_a_new_army: "특수전 사령부 (OKK) 예산 개정"
 TUR_a_new_army_desc: "예, 예니체리는 멋졌지만 어쩌면 더 새로운 것을 시도해 볼 수 있을 것입니다. 우리는 특수 부대 사령부, 즉 외젤 쿠브베틀레르 코무타느르으에 대한 자금 지원을 늘릴 것입니다."
 TUR_return_to_sunni_dominance: "돌아온 수니파의 장악"
 TUR_return_to_sunni_dominance_desc: "우리는 이슬람의 뿌리에서 너무 멀리 벗어났습니다. 모든 동포에게 수니파를 장려함으로써 옛 방식을 되살릴 것입니다."
 TUR_supporting_conservatives: "보수적 기관 지지"
 TUR_supporting_conservatives_desc: "우리는 일당 국가가 되겠지만 다른 보수 단체에도 자금을 지원하여, 반드시 우리를 지지하지는 않는 사람들도 우리의 이념과 가치를 지지할 수 있도록 할 것입니다."
 TUR_osman_alliance: "오스만의 권력 강화"
 TUR_osman_alliance_desc: "새로운 튀르키예 초강대국을 건설하려는 우리의 꿈에는 어느 정도 정당성이 있어야 합니다. 오스만 왕가에 연락하여 우리 정부에 합류하도록 하고 오래전에 잃어버린 제국의 영광을 되살리도록 힘을 실어 줄 수 있습니다!"
 TUR_turkish_relations: "터키의 외교 관계"
 TUR_turkish_relations_desc: "우리는 유럽과 아시아 사이의 중심에 있어 우리와의 외교는 매우 중요합니다. 하지만 우리도 누구와 손잡을지 결정할 권리가 있습니다. 서방은 수십 년간 우리를 지지해 왔지만 이제 동방도 같은 일을 하려 하고 있습니다.."
 TUR_eastern_alignment: "동구권과의 연대"
 TUR_eastern_alignment_desc: "NATO는 모든 이점을 가지고 있었지만, 동방보다 훨씬 많은 면에서 우리의 통치와 문화를 바꾸도록 강요했습니다. 그러므로 우리의 독립과 문화를 지키기 위해서는 동방과 공식적인 관계를 모색하는 것이 최선입니다."
 TUR_military_coop_india: "인도와의 군사 협력"
 TUR_military_coop_india_desc: "인도와의 장기적인 군사 협력은 우리에게 이익이 될 수 있습니다. 양국 군대가 함께 훈련하고 연습하도록 함으로써 새로운 전술과 전략을 배우는 동시에 두 나라를 더 가깝게 만들 수 있습니다."
 TUR_support_belt_road_china: "일대일로 지지"
 TUR_support_belt_road_china_desc: "일대일로 구상은 전 세계에 제대로 된 기반시설을 구축하기 위해 중국이 주도하는 대규모 기반시설 계획입니다. 우리가 왜 이러한 구상에 반대해야 합니까?"
 TUR_schools_in_pakistan: "파키스탄 학교 지원"
 TUR_schools_in_pakistan_desc: "파키스탄은 제대로 된 교육 기반시설이 절실히 필요하며, 사람들이 배울 수 있는 새로운 학교를 지어 이를 제공할 수 있습니다."
 TUR_turkstream_russia_pipeline: "터키스트림 (Turkstream) - 러시아 간 파이프라인"
 TUR_turkstream_russia_pipeline_desc: "튀르크스트림 송유관은 러시아에서 튀르키예로 이어지는 천연가스 파이프라인입니다. 이 파이프라인은 서유럽 일부 지역에 많은 천연가스를 공급할 것이며 경제에 도움이 되는 데 결정적일 수 있습니다."
 TUR_afghan_roads: "아프가니스탄의 도로"
 TUR_afghan_roads_desc: "아프가니스탄은 수십 년간 이어진 내전으로 인해 제대로 기능하는 도로가 거의 없습니다. 아프가니스탄 시민들이 문제 없이 이동할 수 있도록 우리가 일부 도로를 건설해 줄 수 있습니다."
 TUR_mutual_tourism_indonesia: "인도네시아 관광업"
 TUR_mutual_tourism_indonesia_desc: "인도네시아와 관광 프로그램을 수립하면 두 나라 경제 모두 새로운 방문자와 관광객으로부터 이익을 얻을 수 있습니다."
 TUR_provide_aid_yemen: "예멘의 공항"
 TUR_provide_aid_yemen_desc: "예멘에는 적절한 공항이 필요하며, 우리나라의 전문가들을 통해 이를 제공할 수 있습니다."
 TUR_industrial_investments_egypt: "이집트 노동자 고용"
 TUR_industrial_investments_egypt_desc: "우리 공장에서 이집트 노동자들을 대규모로 고용할 수 있습니다. 이렇게 하면 비용을 절감하는 동시에 이집트 사람들에게 일자리 기회를 제공할 수 있습니다."
 TUR_religious_tourism_saudi: "사우디의 종교 관광"
 TUR_religious_tourism_saudi_desc: "사우디아라비아는 국경 안에 이슬람에서 가장 신성한 장소 중 하나를 두고 있습니다. 그러므로 우리 국민이 그곳으로 더 안전하고 빠르게 여행할 수 있도록 사우디와 일부 협상을 해야 합니다."
 TUR_investments_in_qatar: "카타르 군사 기지"
 TUR_investments_in_qatar_desc: "군사적으로 더 가까워질 수 있도록 카타르에 자국 내 군사 기지를 설립하도록 허용해 달라고 요청할 것입니다. 또한 지역 내 다른 위협으로부터 카타르를 보호하려 할 수도 있습니다."
 TUR_western_alignment: "서방과의 연대 지속"
 TUR_western_alignment_desc: "서방과 수년간 우정을 쌓아 왔는데 왜 다른 것을 찾으러 나서야 합니까? 우리의 외교 정책에 급격한 변화가 없도록 서방과의 제휴를 유지하는 것이 최선입니다."
 TUR_counter_terror_with_us: "대테러 투자"
 TUR_counter_terror_with_us_desc: "중동 지역이 더 안전하고 안정되도록 중동에서의 디테러 작전에서 미국을 지원할 것입니다."
 TUR_archeology_coop_italy: "이탈리아와의 고고학적 협력"
 TUR_archeology_coop_italy_desc: "우리는 수백 년 전으로 거슬러 올라가는 이탈리아와의 역사적 유대를 가지고 있지만, 우리 땅 아래에 묻힌 보물을 아직 다 발견하지 못했습니다. 이탈리아의 고고학 전문가들을 불러 그것을 발굴하도록 도움을 청할 것입니다!"
 TUR_encourage_migration_germany: "독일로부터의 이민자 장려"
 TUR_encourage_migration_germany_desc: "많은 우리 국민이 독일로 갔지만 독일인들은 그렇게 하지 않았습니다. 우리나라가 용광로 같은 국가가 될 수 있도록 독일인들에게 이민자를 보내 달라고 요청할 것입니다."
 TUR_sports_diplomacy_brazil: "브라질과의 스포츠 외교"
 TUR_sports_diplomacy_brazil_desc: "브라질인들은 축구를 사랑하며 우리도 그렇습니다. 그러므로 브라질과 스포츠 외교를 추진하고 그들이 우리나라에서 친선 경기를 치르도록 할 것입니다."
 TUR_join_business_councils_morocco: "Joint Business Councils with Morocco"
 TUR_join_business_councils_morocco_desc: "모로코와 공동 비즈니스 협의회를 설립하면 양국 모두에 크게 도움이 됩니다. 우리 기업들이 서로 협력하고 확장할 수 있기 때문입니다."
 TUR_humanitarian_help_australia: "호주의 인도주의적 전문가"
 TUR_humanitarian_help_australia_desc: "오스트레일리아는 온갖 종류의 재난을 겪으며, 최근 우리도 많은 재난을 겪고 있습니다. 오스트레일리아인들의 도움을 받으면 만약의 사태가 일어나더라도 조금 더 대비할 수 있습니다."
 TUR_great_east: "위대한 동방이여"
 TUR_great_east_desc: "우리 조직인 대동방 이슬람 습격자 전선은 튀르키예 민족에게 역사적인 변화를 가져오겠다고 맹세합니다. 우리는 더 이상 제국주의 이념에 얽매이지 않을 것이며, 끝까지 인내할 것입니다!"
 TUR_dismantle_the_republic: "공화국을 분쇄하라"
 TUR_dismantle_the_republic_desc: "이제 우리가 권력을 쥐었으므로 공화국은 필요하지 않습니다. 공화국은 최대한 빨리 해체되어야 하며 군은 숙청되어야 합니다!"
 TUR_ties_with_saud: "사우디와 연대"
 TUR_ties_with_saud_desc: "우리나라와의 관계를 유지하는 데 관심을 가질 나라는 많지 않지만 사우디는 다릅니다. 그들은 우리와 비슷한 이념을 공유하므로 관계를 유지할 수 있으며, 이를 통해 우리 정부는 일정 수준의 국제적 정당성을 유지할 수 있습니다."
 TUR_islamic_legacy: "이슬람의 유산"
 TUR_islamic_legacy_desc: "이슬람은 우리나라에서 매우 오랜 역사를 가지고 있으며 이를 잊어서는 안 됩니다. 우리는 이를 이념적 목적을 위해 우리에게 유리하게 활용할 것입니다."
 TUR_combat_imperialism: "제국주의와 대적"
 TUR_combat_imperialism_desc: "제국주의적 신념과 이념이 한때 위대했던 우리 국가 전체에 스며들었습니다. 이러한 이상에 맞서 싸우는 것이 우리나라를 옛 영광으로 되돌리는 최선의 방법입니다."
 TUR_ban_kemalism: "세속주의 정당 금지"
 TUR_ban_kemalism_desc: "이 나라를 망친 것은 세속주의입니다. 세속주의자들은 이슬람을 몰아냄으로써 자신들의 신념을 국가에 강요할 수 있었지만, 더 이상은 그럴 수 없을 것입니다!"
 TUR_demand_hejaz: "헤자즈 요구"
 TUR_demand_hejaz_desc: "사우디는 이슬람 세계의 많은 중요한 도시에 대한 영유권을 주장하며, 그 도시들은 대부분 헤자즈에 위치해 있습니다. 충돌을 피하려면 이 영토에 대한 통제권을 우리 정부에 넘기라고 요구할 것입니다."
 TUR_sharia_mandate: "샤리아 통치"
 TUR_sharia_mandate_desc: "우리나라는 이슬람의 원칙, 오직 이슬람의 원칙에 의해서만 인도될 것입니다. 샤리아 법이 다시 시행되어 우리 국가가 다시 순결하고 올바르게 될 것입니다."
 TUR_one_banner_one_people: "하나의 휘장 아래 하나된 우리"
 TUR_one_banner_one_people_desc: "우리 국민은 하나의 깃발, 이슬람의 깃발 아래 통합될 것입니다. 여러 언어를 허용하여 우리나라에 민족적 분열을 만들 필요는 없습니다."
 TUR_legalize_languages: "수많은 민족들이 하나의 휘장 아래"
 TUR_legalize_languages_desc: "우리 국민은 원하는 언어를 자유롭게 말할 수 있습니다. 국가에서 여러 언어의 사용을 금지함으로써 우리 땅에 민족적 분열을 일으켜서는 안 됩니다."
 TUR_crack_down_shiism: "시아파 교리 제한"
 TUR_crack_down_shiism_desc: "시아파에 제한을 가하는 한이 있더라도 모든 사람이 수니파로 동화되도록 해야 합니다. 시아파의 관행을 공공장소에서 금지하고 시아파의 개종을 장려하는 캠페인에 자금을 지원할 것입니다."
 TUR_return_of_caliphate: "칼리프의 복원"
 TUR_return_of_caliphate_desc: "칼리파국은 반드시 돌아와야 하며 돌아올 것입니다. 필요하다면 전쟁과 정복을 통해서라도 칼리파국이 다시 한번 재통합되도록 할 것입니다. 이 지역은 더 이상 문제가 되지 않을 것입니다."
 TUR_gender_differations: "성별 분리"
 TUR_gender_differations_desc: "남성과 여성을 위한 별도의 시설을 만들어야 합니다. 버스 정류장이든 학교든 직장이든 종교적 목적을 위해 남성과 여성은 분리되어야 합니다!"
 TUR_enforce_dress_code: "의복에 대한 규제"
 TUR_enforce_dress_code_desc: "우리는 엄격한 복장 규정을 시행하여 국가를 순결과 올바름의 길로 이끌 것입니다. 국민이 부적절하게 옷을 입는다면 어떻게 영적인 진전을 기대할 수 있겠습니까?"
 TUR_westard: "서방을 향한 확장"
 TUR_westard_desc: "오스만은 약했으며 칼리파국의 서부를 잃었습니다. 우리는 이를 바꿀 것이며, 자부심과 강력한 힘으로 되찾을 것입니다."
 TUR_southward: "남쪽을 향해"
 TUR_southward_desc: "아랍 반란과 아랍 민족주의의 부상으로 오스만이 아랍인들을 통제하기 어려워졌습니다. 그러나 우리 정부의 부상과 우리의 강력한 힘으로 이러한 일이 다시는 일어나지 않도록 하겠습니다."
 TUR_eastward: "동쪽을 향해"
 TUR_eastward_desc: "동쪽은 러시아인이나 페르시아인에게 빼앗겼습니다. 그러나 오늘날 캅카스는 독립해 있지만 그리 오래가지는 못할 것입니다."
 TUR_african_holdings: "아프리카에서의 영향력"
 TUR_african_holdings_desc: "유럽인들과 그들의 식민지 야망으로 인해 오스만의 아프리카 영토를 잃었습니다. 안타깝게도 그들은 유럽인들 때문에 아프리카에서 오랫동안 영토를 확장하거나 유지하지 못했지만, 이제는 아무도 우리를 막지 못합니다."
 TUR_turkish_intervention: "터키의 개입주의"
 TUR_turkish_intervention_desc: "튀르키예는 전 세계 여러 분쟁에 개입해 왔으며 이는 튀르키예의 군사력과 영향력을 외부로 투사하는 데 도움이 되었습니다. 다른 나라의 내부 분쟁에 개입함으로써 우리는 그 전쟁의 결과가 우리에게 더 유리해지도록 영향을 줄 수 있습니다."
 TUR_intervene_syrian_civilwar: "시리아 내전"
 TUR_intervene_syrian_civilwar_desc: "시리아는 혼란에 빠졌으며, 우리나라와 매우 가깝기 때문에 방관자로서 가만히 지켜보는 것은 어리석은 일입니다."
 TUR_back_assad: "아사드 지원"
 TUR_back_assad_desc: "아사드는 시리아의 정당한 지도자이며 다른 모든 이는 비합법적인 것으로 간주되어야 합니다!"
 TUR_back_fsa: "자유 시리아군 지원"
 TUR_back_fsa_desc: "자유 시리아군은 매우 정의로운 대의, 민주주의를 위해 싸우고 있습니다. 우리는 그들이 승리하고 시리아 국민에게 자유의 기쁨을 가져다 줄 수 있도록 가능한 모든 방법으로 그들을 지원해야 합니다!"
 TUR_intervene_afghan_war: "아프간 내전"
 TUR_intervene_afghan_war_desc: "아프가니스탄은 꽤 오랫동안 내전 상태에 있으며 크게 변한 것이 없습니다. 어쩌면 우리가 결과를 우리에게 유리하도록 움직일 수 있을지도 모릅니다.."
 TUR_a_new_stance: "새로운 입장"
 TUR_a_new_stance_desc: "탈레반은 매우 오랫동안 자국에 대한 외세의 영향과 개입을 몰아내기 위해 싸워 왔으며, 우리가 개입하여 그들을 막는 것은 우리의 몫이 아닙니다. 대신 우리는 그들의 대의를 지지하고 그들이 외세의 착취로부터 나라를 해방할 수 있도록 병력을 강화해야 합니다."
 TUR_northern_cause: "북부 동맹과 함께"
 TUR_northern_cause_desc: "북부 동맹은 사악한 탈레반을 아프가니스탄에서 몰아내기 위해 끈질기게 노력해 왔습니다. 탈레반은 아프가니스탄에 폭정, 불의, 억압만을 가져올 것이며, 우리는 북부 동맹이 탈레반을 물리치도록 도와야 합니다!"
 TUR_intervene_iraq_war: "이라크 개입"
 TUR_intervene_iraq_war_desc: "이라크의 혼란을 이용함으로써 매우 오랫동안 보류되어 온 우리의 특정 목표를 달성할 수 있을 것입니다.."
 TUR_peacekeepers: "평화유지 임무"
 TUR_peacekeepers_desc: "이라크 상황이 이미 꽤 나쁘므로 더 이상 불길을 키우지 않는 것이 우리에게 최선입니다. 대신 북부의 마을과 도시에 평화 유지군을 보내 이라크 국민이 전쟁에서 잠시 숨을 돌리도록 돕는 방안을 택해야 합니다."
 TUR_conduct_operation: "작전 개시"
 TUR_strike_pkk_bases: "쿠르디스탄 노동자당 (PKK) 영향력 제압"
 TUR_arrest_members: "쿠르디스탄 노동자당 (PKK) 용의자 체포"
 TUR_attack_on_media: "쿠르디스탄 노동자당 (PKK)에 부정적인 선전"
 TUR_allow_pkk_bases: "쿠르디스탄 노동자당 합법화"
 TUR_forbid_pkk_bases: "쿠르디스탄 노동자당 (PKK) 금지"
 TurkicConfederation.1.t: "투르크 연방으로 우리를 초대하는 터키"
 TurkicConfederation.1.d: "튀르키예 정부가 우리에게 접근하여 새로 설립된 튀르크 연합에 가입할 것을 요청했습니다. 가입하면 분명 통합되겠지만, 우리는 주권 국가로서의 지위를 잃게 될 것입니다.."
 TurkicConfederation.1.a: "투르크인들은 하나다!"
 TurkicConfederation.1.b: "함께하지 않는 것이 좋겠다…"
