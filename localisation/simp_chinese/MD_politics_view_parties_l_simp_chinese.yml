 TNZ.Nat_Autocracy_icon: "£TNZ_nat_autocracy"
 SHA.Autocracy_desc: " (专制/阿拉伯社会主义者) - 具有马克思主义根源的撒哈拉维武装组织\n\n波利萨里奥阵线由撒哈拉民族主义者瓦利·穆斯塔法·赛义德于1973年5月创立。波利萨里奥阵线随即对西班牙在西撒哈拉的殖民统治发动武装斗争。1975年西班牙撤军后，冲突形势发生转变，该地区随后被摩洛哥和毛里塔尼亚占领。作为回应，波利萨里奥阵线于1976年2月宣布成立撒哈拉阿拉伯民主共和国，并对两国发动游击战。1979年，在军事压力下，毛里塔尼亚被迫撤军，战争仅剩下与摩洛哥的对抗，直至1991年联合国斡旋达成停火协议。\n\n\n\n"
 SHA.Neutral_Autocracy: "£SHA_Autocracy_small2 (KS)  - 波利萨里奥阵线"
 SHA.Neutral_Autocracy_icon: "£SHA_Autocracy_small2"
 SHA.Neutral_Autocracy_desc: "(不结盟专制) - 波利萨里奥阵线（又称烈士之翼）\n\n波利萨里奥阵线“烈士之翼”是主流波利萨里奥阵线的一个异议派别。该组织以波利萨里奥阵线创始人瓦利·穆斯塔法·赛义德（烈士）的名字命名，主张改变战略和领导层，并批评自1991年停火以来政治进展缓慢。他们的基地主要在欧洲，与主流波利萨里奥阵线不同，他们呼吁采取更激进的措施来打破西撒哈拉冲突的外交僵局。他们没有军事力量，而是以政治反对派运动的形式运作。\n\n"
 SHA.Nat_Autocracy: "£generic_Nat_Autocracy_small (SPLA)  - 撒哈拉人民解放军"
 SHA.Nat_Autocracy_desc: "（军政府） - 撒哈拉阿拉伯民主共和国武装力量。\n\n撒哈拉人民解放军是波利萨里奥阵线和西撒哈拉民主联盟的官方军事力量。撒哈拉人民解放军成立的目的是为了开展武装斗争，它在最初反对西班牙殖民统治的游击战中发挥了核心作用，随后在1975年西撒哈拉分裂后，又与摩洛哥和毛里塔尼亚军队展开了斗争。撒哈拉人民解放军主要以阿尔及利亚境内的难民营为据点，在摩洛哥隔离墙（又称“隔离墙”）沿线与摩洛哥军队交战，直至1991年停火。撒哈拉人民解放军至今仍是西撒哈拉民主联盟的常备军，负责保卫隔离墙以东的解放区。\n\n"
