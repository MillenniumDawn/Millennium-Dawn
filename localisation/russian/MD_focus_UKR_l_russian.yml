 ukraine_develop_btr4.1.name: "Выбор боевой роли для БТР-4"
 ukraine_develop_btr4.1.desc: "Мы можем выбрать желаемую роль для этой техники — более легкий и дешевый БТР или более дорогой и тяжело вооруженный БМП.\nНаше решение повлияет на то, какими батальонами будут оснащены БТР-4: механизированными или бронированными.\nПри желании у нас будет возможность производить практически один и тот же тип техники, но в противоположном исполнении."
 ukraine_develop_btr4.1.a: "БТР"
 ukraine_develop_btr4.1.b: "БМП"
 ukraine_develop_btr4.2.name: "Выбор основного вооружения для БТР-4 в роли БТР"
 ukraine_develop_btr4.2.desc: "Мы можем выбрать желаемое основное вооружение для БТР-4.\nЕсли мы хотим сократить производственные затраты, мы можем выбрать пулемет, но если мы хотим максимизировать его боевую эффективность, мы можем выбрать один из нескольких доступных более тяжелых модулей вооружения."
 ukraine_develop_btr4.2.a: "Только пулемет"
 ukraine_develop_btr4.2.b: "Модуль вооружения"
 ukraine_develop_btr4.3.name: "Выбор боевого модуля для БТР-4 в роли БТР"
 ukraine_develop_btr4.3.desc: "Мы можем выбрать желаемый модуль вооружения для БТР-4.\n\n§YБМ-1Б 'Грим'§! вооружение: 1x 30-мм автоматическая пушка, 1x 30-мм автоматический гранатомет, 1x 7.62-мм спаренный пулемет, 4x противотанковых ракеты 9P135M 'Конкурс' или 'Барьер'.\n\n§YКБА-105 'Шквал'§! вооружение: 1x 30-мм автоматическая пушка, 1x 7.62-мм спаренный пулемет, 4x противотанковых ракеты 9P135M 'Конкурс' или 'Барьер' (опционально 1x 30-мм автоматический гранатомет с уменьшением количества противотанковых ракет до 2).\n\n§YBAU Вооружение 23x2§!: 2 автоматические пушки калибра 23x152 мм, 1 спаренный пулемет калибра 7.62 мм."
 ukraine_develop_btr4.3.a: "БМ-1Б 'Хрим'"
 ukraine_develop_btr4.3.b: "КБА-105 «Шкваль»"
 ukraine_develop_btr4.3.c: "БАУ 23x2"
 ukraine_develop_btr4.4.name: "Выбор двигателя для БТР-4 в роли БТР"
 ukraine_develop_btr4.4.desc: "Мы можем выбрать желаемый двигатель для БТР-4.\n\n§Y3ТД-3§!: украинский 2-тактный 3-цилиндровый дизельный двигатель мощностью 500 л.с.\n\n§YDeutz BF6M1015CP§!: немецкий 4-клапанный 6-цилиндровый дизельный двигатель мощностью 442 л.с.\n\n§YIveco Cursor 10-430§!: итальянский 24-клапанный 6-цилиндровый дизельный двигатель мощностью 430 л.с."
 ukraine_develop_btr4.4.a: "3ТД-3"
 ukraine_develop_btr4.4.b: "Deutz BF6M1015CP"
 ukraine_develop_btr4.4.c: "Iveco Cursor 10-430"
 ukraine_develop_btr4.5.name: "Выбор двигателя для БТР-4 в роли БТР"
 ukraine_develop_btr4.5.desc: "Мы можем выбрать желаемый двигатель для БТР-4.\n\n§Y3ТД-3§!: украинский 2-тактный 3-цилиндровый дизельный двигатель мощностью 500 л.с.\n\n§YDeutz BF6M1015CP§!: немецкий 4-клапанный 6-цилиндровый дизельный двигатель мощностью 442 л.с.\n\n§YIveco Cursor 10-430§!: итальянский 24-клапанный 6-цилиндровый дизельный двигатель мощностью 430 л.с."
 ukraine_develop_btr4.5.a: "3ТД-3"
 ukraine_develop_btr4.5.b: "Deutz BF6M1015CP"
 ukraine_develop_btr4.5.c: "Iveco Cursor 10-430"
 ukraine_develop_btr4.6.name: "Выбор боевого модуля для БТР-4 в роли БМП"
 ukraine_develop_btr4.6.desc: "Мы можем выбрать желаемый модуль вооружения для БТР-4.\n\n§YБМ-1Б 'Грим'§! вооружение: 1x 30-мм автоматическая пушка, 1x 30-мм автоматический гранатомет, 1x 7.62-мм спаренный пулемет, 4x противотанковых ракеты 9P135M 'Конкурс' или 'Барьер'.\n\n§YКБА-105 'Шквал'§! вооружение: 1x 30-мм автоматическая пушка, 1x 7.62-мм спаренный пулемет, 4x противотанковых ракеты 9P135M 'Конкурс' или 'Барьер' (опционально 1x 30-мм автоматический гранатомет с уменьшением количества противотанковых ракет до 2).\n\n§YBAU Вооружение 23x2§!: 2 автоматические пушки калибра 23x152 мм, 1 спаренный пулемет калибра 7.62 мм."
 ukraine_develop_btr4.6.a: "БМ-1Б 'Хрим'"
 ukraine_develop_btr4.6.b: "КБА-105 «Шкваль»"
 ukraine_develop_btr4.6.c: "БАУ 23x2"
 ukraine_develop_btr4.7.name: "Выбор двигателя для БТР-4 в роли БМП"
 ukraine_develop_btr4.7.desc: "Мы можем выбрать желаемый двигатель для БТР-4.\n\n§Y3ТД-3§!: украинский 2-тактный 3-цилиндровый дизельный двигатель мощностью 500 л.с.\n\n§YDeutz BF6M1015CP§!: немецкий 4-клапанный 6-цилиндровый дизельный двигатель мощностью 442 л.с.\n\n§YIveco Cursor 10-430§!: итальянский 24-клапанный 6-цилиндровый дизельный двигатель мощностью 430 л.с."
 ukraine_develop_btr4.7.a: "3ТД-3"
 ukraine_develop_btr4.7.b: "Deutz BF6M1015CP"
 ukraine_develop_btr4.7.c: "Iveco Cursor 10-430"
 ukraine_develop_btr4.8.name: "Тестовая программа для БТР «БТР-4»"
 ukraine_develop_btr4.8.desc: "Мы можем выбрать продолжительность и сложность предпроизводственных испытаний БТР-4.\n\nМы можем разработать базовую программу, сэкономив деньги и время, или же создать обширную, которая потребует больше ресурсов, но позволит выявить и устранить некоторые проблемы, проявляющиеся при мелкосерийном производстве. Их устранение может привести к повышению надежности машины в полномасштабном производстве."
 ukraine_develop_btr4.8.a: "Базовые тесты"
 ukraine_develop_btr4.8.b: "Расширенные тесты"
 ukraine_develop_btr4.9.name: "Тестовая программа для БТР «БТР-4»"
 ukraine_develop_btr4.9.desc: "Мы можем выбрать продолжительность и сложность предпроизводственных испытаний БТР-4.\n\nМы можем разработать базовую программу, сэкономив деньги и время, или же создать обширную, которая потребует больше ресурсов, но позволит выявить и устранить некоторые проблемы, проявляющиеся при мелкосерийном производстве. Их устранение может привести к повышению надежности машины в полномасштабном производстве."
 ukraine_develop_btr4.9.a: "Базовые тесты"
 ukraine_develop_btr4.9.b: "Расширенные тесты"
 ukraine_develop_btr4.10.name: "Программа испытаний БМП «БТР-4»"
 ukraine_develop_btr4.10.desc: "Мы можем выбрать продолжительность и сложность предсерийных испытаний БТР-4.\n\nМы можем разработать базовую программу, сэкономив деньги и время, или же создать обширную, которая потребует больше ресурсов, но позволит выявить и устранить некоторые проблемы, проявляющиеся при мелкосерийном производстве. Их устранение может привести к повышению надежности машины в полномасштабном производстве."
 ukraine_develop_btr4.10.a: "Базовые тесты"
 ukraine_develop_btr4.10.b: "Расширенные тесты"
 ukraine_develop_btr4.11.name: "Запуск производства БТР-4 в роли БТР"
 ukraine_develop_btr4.11.desc: "Мы завершили все ранее согласованные испытания и наконец можем начать серийное производство бронетранспортера БТР-4."
 ukraine_develop_btr4.11.a: "Окончательно"
