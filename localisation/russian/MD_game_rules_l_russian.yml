 RULE_AI_STARTING_POLITICAL_POWER_500_DESC: "Добавит 500 политической власти всем странам ИИ."
 RULE_AI_STARTING_POLITICAL_POWER_1000: "1000 политической власти"
 RULE_AI_STARTING_POLITICAL_POWER_1000_DESC: "Добавит 1000 политической власти всем странам ИИ."
 RULE_EUROPEAN_VOTING_COOLDOWN_LIMIT: "Перезарядка голосования в Европейском союзе"
 RULE_OPTION_EU_SIXTY: "60 дней"
 RULE_OPTION_EU_SIXTY_DESC: "Перезарядка голосования в Европейском парламенте и Европейском совете будет установлен на шестьдесят дней вместо стандартных ста восьмидесяти дней."
 RULE_OPTION_EU_NINETY: "90 дней"
 RULE_OPTION_EU_NINETY_DESC: "Перезарядка голосования в Европейском парламенте и Европейском совете будет установлен на девяносто дней вместо стандартных ста восьмидесяти дней."
 RULE_OPTION_EU_ONE_HUNDRED_EIGHTY: "180 дней"
 RULE_OPTION_EU_ONE_HUNDRED_EIGHTY_DESC: "Перезарядка голосования в Европейском парламенте и Европейском совете будет установлено по умолчанию на сто восемьдесят дней."
 RULE_OPTION_EU_TWO_HUNDRED_TEN: "210 дней"
 RULE_OPTION_EU_TWO_HUNDRED_TEN_DESC: "Перезарядка голосования в Европейском парламенте и Европейском совете будет установлен на двести десять дней вместо стандартных ста восьмидесяти дней."
 UKR_VINTRENKO: "Витренко"
 UKR_VINTRENKO_DESC: "Наталии Витренко §8Прогрессивная социалистическая партия§! Она выдвигает программу, в которой сочетаются православие, ностальгия по советской эпохе и собственная позиция в женской политике. Украина резко выступает против Запада и воспринимает европейское предложение как акт враждебности."
 UKR_NATIONALISTS: "Украинский национализм"
 UKR_NATIONALISTS_DESC: "Наследники §8Украинская повстанческая армия§! Захватить власть и перестроить государство на основе националистических традиций. Украина противостоит Москве, не дожидаясь разрешения Запада, а русскоязычные регионы управляются, а не привлекаются к себе."
 UKR_DEMOCRATIC: "Демократическая Украина"
 UKR_DEMOCRATIC_DESC: "Украина придерживается прозападной линии и организует всё государство вокруг вступления в Европейский союз и НАТО. Киев становится восточной окраиной западного блока, и Москва рассматривает это как потерю, которую необходимо компенсировать."
 UKR_COMMUNISM: "Коммунистическая Украина"
 UKR_COMMUNISM_DESC: "Он §8Коммунистическая партия Украины§! Он выигрывает спор о незавершенном переходном процессе и возвращает республику. Киев работает над восстановлением Советского Союза, а не над его освобождением."
 UKR_SOCIALISM: "Социалистическая Украина"
 UKR_SOCIALISM_DESC: "Социалистическая партия Украины (§8Socialist Party of Ukraine§!) приходит к власти и перестраивает страну на основе перераспределения и государственной собственности, не прибегая к старому красному флагу. Олигархи теряют власть, и Киев держится на расстоянии от Брюсселя и Москвы."
 UKR_YUSHENKO: "Ющенко"
 UKR_YUSHENKO_DESC: "Оранжевый лагерь занимает пост президента при Викторе Ющенко и управляет страной, опираясь на принципы реабилитации, языка и пути на Запад. Украина давит на Европу и Соединенные Штаты, а газ, который её нагревает, становится оружием в руках Москвы."
 UKR_YANUK: "Янукович"
 UKR_YANUK_DESC: "Виктор Янукович и §8Партия регионов§! Удержать государство и направить его обратно к Москве. Европейское соглашение остается неподписанным, и восток и запад страны управляются как соперничающие избирательные округа."
 RULE_ALLOW_RELEASE_NATIONS_UKRAINE_FEDERALIZE_TOOLTIP: "§Y[ROOT.GetNameDefCap]§! может не освободить эту страну, если вы не §Yфедерализуете§! Украину."
 LBA_AI_BEHAVIOR: "@LBA Ливия"
 RULE_OPTION_LBA_GRAND_MUFTI: "Правила Великого Муфтия"
 RULE_OPTION_LBA_GRAND_MUFTI_DESC: "А §8Великий Муфтий§! Назначается новый правитель, и религиозное право ставится выше государственного устройства. В конечном итоге муфтий приходит к власти, создавая салафитское королевство и устанавливая строгое исламское правление на всей территории Ливии."
 RULE_OPTION_LBA_KINGDOM: "Королевство Сенусси"
 RULE_OPTION_LBA_KINGDOM_DESC: "Королевская семья возвращается домой и получает компенсацию, а §8Сенусси§! Монархия восстанавливается до абсолютного господства. Ливия отказывается от своей республики, и корона приостанавливает выборы на неопределенный срок."
 RULE_ALLOW_RELEASE_NATIONS_RUSSIA_SUBJECT_RF_TOOLTIP: "§RНЕДОСТУПЕН§!"
 RULE_OPTION_EU_ONE_HUNDRED_TWENTY: "120 дней"
 RULE_OPTION_EU_ONE_HUNDRED_TWENTY_DESC: "Срок голосования в Европейском парламенте и Европейском совете будет установлен на сто двадцать дней вместо стандартных ста восьмидесяти дней."
 RULE_INTERNAL_FACTION_TICK_AMOUNT: "§YВнутренняя фракция§! Мнение Ежемесячная сумма тика"
 RULE_OPTION_IF_POINT_10: "0.10 Мнение ежемесячно"
 RULE_OPTION_IF_POINT_10_DESC: "Ежемесячный рейтинг тиков §YВнутренней фракции§! будет установлен на 0,10 вместо значения по умолчанию 0,50. Пользовательские достижения Millennium Dawn будут отключены с этой настройкой."
 RULE_OPTION_IF_POINT_25: "0.25 Мнение ежемесячно"
 RULE_OPTION_IF_POINT_25_DESC: "Ежемесячный рейтинг тиков §YВнутренней фракции§! будет установлен на 0,25 вместо значения по умолчанию 0,50. Пользовательские достижения Millennium Dawn будут отключены с этой настройкой."
 RULE_OPTION_IF_POINT_50: "0.50 Мнение ежемесячно"
 RULE_OPTION_IF_POINT_50_DESC: "Ежемесячная ставка тика мнения §YВнутренней фракции§! будет установлена ​​на уровне по умолчанию 0,50"
 RULE_OPTION_IF_POINT_75: "0.75 Мнение ежемесячно"
 RULE_OPTION_IF_POINT_75_DESC: "Ежемесячный рейтинг тиков §YВнутренней фракции§! будет установлен на 0,75 вместо значения по умолчанию 0,50. Пользовательские достижения Millennium Dawn будут отключены с этой настройкой."
 RULE_OPTION_GREAT_COLLAPSE: "Великий Коллапс"
 RULE_OPTION_GREAT_COLLAPSE_AI_DESC: "Военные расходы времен холодной войны пережили врага, против которого они были созданы, а десятилетие протестов и репрессий закончилось общенациональной забастовкой железнодорожников, парализовавшей федеральное правительство. Соединенные Штаты рухнули под собственной тяжестью, и штаты остались предоставлены сами себе."
 USB_AI_BEHAVIOR: "Свободные Штаты @USB"
 RULE_OPTION_REVANCHIST_PATH: "Возвращая судьбу"
 RULE_OPTION_REVANCHIST_PATH_AI_DESC: "Остатки федеральной системы подталкивают свободные штаты к стремлению вернуть себе всю континентальную территорию Соединенных Штатов. Каждый сосед на старой американской карте становится претензией, ожидающей своего часа. §RИ этот путь существует только в том случае, если правление Соединенных Штатов будет установлено на период после «Эпохи Объединенных Наций» или «Великого краха».§!."
 RULE_OPTION_ISOLATION_PATH: "Великое закрытие"
 RULE_OPTION_ISOLATION_PATH_AI_DESC: "Американская мечта списана со счетов, и свободные штаты закрывают дверь перед миром, которому, как им кажется, они больше ничего не должны. Прежние обязательства Вашингтона утрачивают силу, и восточное побережье остается в покое. §RИ этот путь существует только в том случае, если правление Соединенных Штатов будет установлено на период после «Эпохи Объединенных Наций» или «Великого краха».§!."
 RULE_OPTION_ARCADIA_PATH: "Восточная идентичность"
 RULE_OPTION_ARCADIA_PATH_AI_DESC: "Преданность федеральному правительству ослабевает, и свободные штаты создают новые §8Восточная идентичность§! Вместо того чтобы оплакивать распад союза, Восточное побережье становится самостоятельным государством, а не его остатками. §RИ этот путь существует только в том случае, если правление Соединенных Штатов будет установлено на период после «Эпохи Объединенных Наций» или «Великого краха».§!."
 CSA_AI_BEHAVIOR: "@CSA Южная Республика"
 RULE_OPTION_A_SOUTHERN_AMERICA_PATH: "Южная Америка"
 RULE_OPTION_A_SOUTHERN_AMERICA_PATH_AI_DESC: "Южная Республика сохраняет верность старой американской идее и стремится восстановить союз под собственным флагом. Она позиционирует себя как законный преемник Соединенных Штатов, а не как отколовшаяся от них страна. §RИ этот путь существует только в том случае, если правление Соединенных Штатов будет установлено на период после «Эпохи Объединенных Наций» или «Великого краха».§!."
 RULE_OPTION_GOLDEN_CIRCLE_PATH: "Золотой Круг"
 RULE_OPTION_GOLDEN_CIRCLE_PATH_AI_DESC: "Республика возрождает «Золотой круг» (§8Golden Circle§!), старый план Конфедерации по созданию империи вокруг Мексиканского залива и Карибского моря. Южная Республика смотрит на юг в поисках своего будущего, а её соседи оказываются в чьей-то сфере влияния (§R) и этот путь возможен только в том случае, если правление Соединенных Штатов будет установлено на период после «Объединенной эры» или «Великого краха» (§!)."
 RULE_OPTION_SOUTHERN_ARCADIA_PATH: "Восточная идентичность"
 RULE_OPTION_SOUTHERN_ARCADIA_PATH_AI_DESC: "Не желая нести ни американское, ни конфедеративное наследие, республика строит новую идентичность на основе своего каджунского и креольского наследия. Побережье Мексиканского залива становится самостоятельным государством, а не государством-преемником кого-либо из его потомков. §RИ этот путь существует только в том случае, если правление Соединенных Штатов будет установлено на период после «Эпохи Объединенных Наций» или «Великого краха».§!."
 RULE_OPTION_THE_FLORIDA_UPRISING_PATH: "Восстание во Флориде"
 RULE_OPTION_THE_FLORIDA_UPRISING_PATH_AI_DESC: "Южные националисты отвергают результаты выборов во Флориде и берутся за оружие против правительства, которое они называют украденным. Молодая республика разрывается на части в первые годы своего существования. §RИ этот путь существует только в том случае, если правление Соединенных Штатов будет установлено на период после «Эпохи Объединенных Наций» или «Великого краха».§!."
 CAS_AI_BEHAVIOR: "@CAS Каскадия"
 RULE_OPTION_ROCKY_MOUNTAIN_RESISTANCE_PATH: "Сопротивление Скалистых гор"
 RULE_OPTION_ROCKY_MOUNTAIN_RESISTANCE_PATH_AI_DESC: "Власти Олимпии передают управление беспорядками в северной части штата Айдахо местным шерифам, а §8Сопротивление Скалистых гор§! Они перерастают их, пока горные графства не восстают за независимость. Каскадии приходится бороться с отделением в своей собственной глубинке. §RИ этот путь существует только в том случае, если правление Соединенных Штатов будет установлено на период после «Эпохи Объединенных Наций» или «Великого краха».§!."
 RULE_OPTION_PEACE_IN_OUR_TIME_PATH: "Мир В Наше Время"
 RULE_OPTION_PEACE_IN_OUR_TIME_PATH_AI_DESC: "Олимпия направляет на восток специальное следственное подразделение, чтобы возглавить борьбу с сопротивлением, и приказ возвращается до тех пор, пока §8Сопротивление Скалистых гор§! Руководство само распускает движение. Каскадия выходит из кризиса невредимой и спокойной. §RИ этот путь существует только в том случае, если правление Соединенных Штатов будет установлено на период после «Эпохи Объединенных Наций» или «Великого краха».§!."
 LKT_AI_BEHAVIOR: "@LKT Лакота"
 RULE_OPTION_RECLAMATION_FRONT_WAR_PATH: "Война за фронт восстановления"
 RULE_OPTION_RECLAMATION_FRONT_WAR_PATH_AI_DESC: "Аудитор, присланный из столицы, сталкивается с §8Фронт восстановления§! Он действует по собственной инициативе, и встреча заканчивается открытым разрывом. Канзас милитаризируется под эгидой Фронта, и лакота вступает с ним в войну. §RИ этот путь существует только в том случае, если правление Соединенных Штатов будет установлено на период после «Эпохи Объединенных Наций» или «Великого краха».§!."
 RULE_OPTION_RECLAMATION_FRONT_PEACE_PATH: "Фронт по восстановлению мира"
 RULE_OPTION_RECLAMATION_FRONT_PEACE_PATH_AI_DESC: "Второй этап расследования опровергает самые резкие сообщения о... §8Фронт восстановления§!И правительства двух стран ведут переговоры вместо того, чтобы вооружаться. Лакота и Фронт строят общий экономический и социальный союз на основе примирения. §RИ этот путь существует только в том случае, если правление Соединенных Штатов будет установлено на период после «Эпохи Объединенных Наций» или «Великого краха».§!."
 GAME_RULE_nato_disabled: "§YНАТО§! Отключено через игровое правило"
 RULE_OPTION_HISTORICAL_PRESIDENTS: "Исторические президенты США"
 RULE_OPTION_HISTORICAL_PRESIDENTS_AI_DESC: "На каждых выборах побеждает тот президент, который действительно одержал победу, и партии меняют Белый дом в соответствии с реальным графиком. Американская политика следует за прошлым, а не за случайностью, и ее союзники могут планировать свою деятельность, исходя из этого."
 RULE_GOD_OF_WAR: "Мод «God of War»"
 RULE_GOD_OF_WAR_NO: "Выключенный"
 RULE_GOD_OF_WAR_YES: "Включенный"
 RULE_GOD_OF_WAR_NO_DESC: "ИИ будет использовать стандартную конфигурацию."
 RULE_GOD_OF_WAR_YES_DESC: "ИИ будет использовать продвинутые шаблоны и некоторые уловки."
 RULE_OPTION_ALL_AHEAD_SLOW: "Все вперед медленно"
 RULE_OPTION_ALL_AHEAD_SLOW_AI_DESC: "Включите это игровое правило, чтобы гарантировать, что ИИ не разрушит США. Это фактически исключает фактор случайности в неисторическом режиме ИИ."
 RULE_OPTION_SECOND_COAL_WARS: "Вторая угольная война"
 RULE_OPTION_SECOND_COAL_WARS_AI_DESC: "Свободные государства отвергают возрождение §8Объединенный профсоюз шахтеров§! Любое возобновление работы шахт в Западной Вирджинии приводит к бунтам в угольных шахтах и ​​провозглашению независимости штата. Вторая угольная война открывает фронт в Аппалачах. §RИ этот путь существует только в том случае, если правление Соединенных Штатов будет установлено на период после «Эпохи Объединенных Наций» или «Великого краха».§!."
 NEN_AI_BEHAVIOR: "@NEN Новый Английский"
 RULE_OPTION_GREEN_MOUNTAIN_REBELLION: "Восстание Зеленой Горы"
 RULE_OPTION_GREEN_MOUNTAIN_REBELLION_AI_DESC: "Национальное правительство отказывает Вермонту в просьбе перенести резиденцию правительства в Монпелье и позволяет недовольству нарастать. §8Зелёная гора§! В округах вспыхивают беспорядки, и Новой Англии приходится подавлять восстание в одном из своих штатов. §RИ этот путь существует только в том случае, если правление Соединенных Штатов будет установлено на период после «Эпохи Объединенных Наций» или «Великого краха».§!."
 RULE_OPTION_THE_OTHER_NEW_CAPITAL: "Другая новая столица"
 RULE_OPTION_THE_OTHER_NEW_CAPITAL_AI_DESC: "В столице мало кто настолько заинтересован в том, чтобы спорить из-за адреса, поэтому правительство удовлетворяет требование Вермонта и переезжает в Монпелье. Новая Англия ничего не тратит на этот спор и продолжает довольствоваться своими северными штатами. §RИ этот путь существует только в том случае, если правление Соединенных Штатов будет установлено на период после «Эпохи Объединенных Наций» или «Великого краха».§!."
 RULE_ALLOW_CONDITIONAL_PEACE_DEAL: "Разрешить условные мирные соглашения"
 RULE_OPTION_CONDITIONAL_PEACE_DEAL_YES_DESC: "Позволит государствам, находящимся в состоянии войны, использовать скриптованное дипломатическое действие §YУсловные мирные соглашения§!, которое позволит государствам подписывать мирные соглашения, не требующие полной капитуляции ни одной из сторон."
 RULE_OPTION_CONDITIONAL_PEACE_DEAL_NO_DESC: "Запрещает государствам использовать скриптованное дипломатическое действие §YУсловные мирные соглашения§!, что заставит государства пережить тотальную войну, чтобы достичь состояния мира."
 RULE_PEACE_PROPOSAL_BLOCKED_TT: "Пока §YУсловные мирные соглашения§! активированы, это будет заблокировано. Используйте вместо этого §Y$CPD_OFFER_CONDITIONAL_PEACE_TITLE$§!"
 RULE_ALLOW_WORLD_WAR: "Железнодорожная мировая война"
 RULE_ALLOW_ENABLE_WORLD_WAR: "Разрешить железнодорожную мировую войну"
 RULE_ALLOW_ENABLE_WORLD_WAR_YES_DESC: "Эта опция ограничит элементы песочницы в Millennium Dawn и подтолкнет мир к мировой войне к определенному году, как и в других модах.\n\nНастоятельно рекомендуется играть в историческом режиме и отключить опцию «Войны долгов ИИ»."
 RULE_ALLOW_ENABLE_WORLD_WAR_NO: "Отключить железнодорожную мировую войну"
 RULE_ALLOW_ENABLE_WORLD_WAR_NO_DESC: "Millennium Dawn останется в своей обычной форме — мод-песочница."
 RULE_ENABLE_INVESTMENT_COLLAPSE_LOCK: "Включить блокировку банкротства инвестиций"
 RULE_ENABLE_INVESTMENT_COLLAPSE_LOCK_NO_DESC: "Вы можете отправлять инвестиции в страны, пока у вас активна миссия «Ожидается банкротство»."
 RULE_ENABLE_INVESTMENT_COLLAPSE_LOCK_YES_DESC: "Вы больше не можете отправлять инвестиции в страны, пока у вас активна миссия «Ожидается банкротство»."
 RULE_SYRIA_ARAB_SPRING_CHOICE_DEFAULT_DESC: "Сирия нормально оценит вариант «Арабской весны»."
 RULE_SYRIA_ARAB_SPRING_CHOICE_HISTORICAL_CIVIL_WAR_DESC: "Сирия позаботится о том, чтобы ей пришлось сделать выбор, если Арабская весна развяжет историческую гражданскую войну."
 RULE_SYRIA_ARAB_SPRING_CHOICE_HISTORICAL_ISIS_SPAWN_DESC: "Сирия всегда будет делать выбор во время Арабской весны, чтобы гарантировать появление исторического «Исламского государства» (ИГИЛ). Это также гарантирует начало исторической гражданской войны."
 RULE_SYRIA_ARAB_SPRING_CHOICE: "Выбор поведения Сирии во время Арабской весны"
 RULE_HISTORIC_EVENTS: "Запуск исторических событий"
 RULE_HISTORIC_EVENTS_NO: "Исторические события будут запускаться случайным образом. Это стандартная настройка игры."
 RULE_HISTORIC_EVENTS_YES: "Исторические события не будут происходить случайным образом. Большинство событий по-прежнему будут происходить случайным образом, однако некоторые события гарантированно произойдут в течение месяца, соответствующего их исторической дате, чтобы уменьшить вероятность их значительной задержки. Это не означает, что игра будет идеально исторической. Это лишь помогает сместить её в историческое русло."
 RULE_ALLOW_MD_ANNEX: "Включите функцию очистки границ"
 RULE_OPTION_MD_ANNEX_NO_DESC: "На послевоенные границы это никак не повлияет, и они останутся такими, какими были определены на конференции."
 RULE_OPTION_MD_ANNEX_YES_DESC: "После заключения мирного соглашения, если существует несколько экземпляров одного и того же тега, все оставшиеся теги будут интегрированы в тот, у которого самый могущественный повелитель. Сила повелителей будет определяться их могуществом и национальным духом. Ликвидация последствий войны может занять до 14 дней."
 RULE_DISABLE_CSTO: "Отключить ОДКБ"
 RULE_YES_DISABLE_CSTO_DESC: "ОДКБ будет отключена при загрузке игры."
 RULE_NO_DISABLE_CSTO_DESC: "ОДКБ останется фракцией."
 RULE_DISABLE_MUSLIM_BROTHERHOOD_CIVIL_WAR: "Отключите гражданскую войну «Братьев-мусульман»"
 RULE_YES_DISABLE_MUSLIM_BROTHERHOOD_CIVIL_WAR_DESC: "Гражданская война «Братьев-мусульман» будет прекращена."
 RULE_NO_DISABLE_MUSLIM_BROTHERHOOD_CIVIL_WAR_DESC: "Гражданская война «Братьев-мусульман» будет продолжена."
 RULE_SYRIA_ARAB_SPRING_CHOICE_HISTORICAL_CIVIL_WAR: "Историческая гражданская война в Сирии"
 RULE_SYRIA_ARAB_SPRING_CHOICE_HISTORICAL_ISIS_SPAWN: "Порождение ИГИЛ"
 RULE_OPTION_SWE_PRO_WESTERN: "Идти на запад"
 RULE_OPTION_SWE_PRO_WESTERN_AI_DESC: "Швеция отказывается от двухвековой политики неприсоединения и занимает свое место в НАТО и в центре Европейского союза. Балтийское море становится союзническим, а северные подходы России оказываются закрытыми."
 RULE_OPTION_SWE_RED_SWEDEN: "Республика Швеция"
 RULE_OPTION_SWE_RED_SWEDEN_AI_DESC: "Шведские левые полностью захватывают Риксдаг, упраздняют монархию и провозглашают республику. Социальное государство выходит за рамки социал-демократии и переходит в государственную собственность, а Швеция перестает быть для кого-либо образцом нейтралитета."
 RULE_DISABLE_AI_INFLUENCE_PUPPETING: "Отключить влияние ИИ на марионетку"
 RULE_YES_DISABLE_AI_INFLUENCE_PUPPETING_DESC: "ИИ не сможет подчинять себе другие страны посредством системы влияния."
 RULE_NO_DISABLE_AI_INFLUENCE_PUPPETING_DESC: "ИИ сможет подчинять себе другие страны с помощью системы влияния."
 RULE_ALLOW_MP_ENHANCEMENTS: "Мультиплеерные улучшения"
 RULE_NOT_ALLOW_MP_ENHANCEMENTS_DESC: "Не позволит механике MP ускорить игру. Не рекомендуется для одиночной игры."
 RULE_ALLOW_MP_ENHANCEMENTS_DESC: "Ускорьте игру с помощью механики MP. Кроме того, теперь каждая страна может создавать фракции, минуя требование о рейтинге силы."
 RULE_DISABLE_WESTERN_OUTLOOK_FEATURES: "Отключить функции агрессивного влияния для западной ориентации"
 RULE_YES_DISABLE_WESTERN_OUTLOOK_FEATURES: "Отключает агрессивные западные функции, такие как влияние через переворот или создание марионеток."
 RULE_INTERNAL_FACTION_COST_REDUCTION: "Снижение внутренних затрат фракции"
 RULE_DISABLE_INTERNAL_FACTION_COST_REDUCTION_DESC: "Затраты на смену внутренних фракций будут по умолчанию."
 RULE_ENABLE_INTERNAL_FACTION_COST_REDUCTION_DESC: "Затраты на смену внутренних фракций будут снижены, что позволит всем странам это делать (если только у них нет специального ограничения). §RЕсли столкнётесь с некорректными фокусами или чем-то ещё — ответственность на вас.§!"
 RULE_OPTION_EU_ONE: "1 День"
 RULE_OPTION_EU_ONE_DESC: "§RДля целей тестирования.§! Период ожидания голосования Европейского парламента и Европейского совета будет установлен на 1 день вместо стандартных 180 дней."
 RULE_ALLOW_FORCING_A_WHITE_PEACE: "Разрешить навязавание мира"
 RULE_YES_FORCING_A_WHITE_PEACE: "Позволяет вам навязать белый мир нации, которая ведет наступательную войну."
 RULE_NO_FORCING_A_WHITE_PEACE: "Не позволяет вам навязать белый мир стране, которая ведет наступательную войну."
 RULE_OPTION_IF_POINT_00: "0.00 Мнение ежемесячно"
 RULE_OPTION_IF_POINT_00_DESC: "Ежемесячный рейтинг тиков §YВнутренней фракции§! будет установлен на 0,00 вместо значения по умолчанию 0,50. Пользовательские достижения Millennium Dawn будут отключены с этой настройкой."
 RULE_ENABLE_ENERGY_LOAD_SHARING: "Включить распределение энергетической нагрузки"
 RULE_ENABLE_ENERGY_LOAD_SHARING_DESC: "Позволяет системе распределения энергетической нагрузки покупать и продавать энергию в близлежащих странах в условиях дефицита энергии."
 RULE_DISABLE_ENERGY_LOAD_SHARING_DESC: "Отключает систему распределения энергетической нагрузки для покупки и продажи энергии в близлежащих странах в случае дефицита энергии."
 RULE_INCOME_FROM_ENERGY_LOAD_SHARING: "Доход от распределения энергетической нагрузки"
 RULE_OPTION_ELS_POINT_10: "$0,10 за ГВт"
 RULE_OPTION_ELS_POINT_10_DESC: "Цена за ГВТ будет установлена на уровне $ 0,10 за ГВТ"
 RULE_OPTION_ELS_POINT_25: "$ 0,25 за ГВТ"
 RULE_OPTION_ELS_POINT_25_DESC: "Цена за ГВТ будет установлена на уровне $ 0,25 за ГВТ"
 RULE_OPTION_ELS_POINT_50: "$ 0,50 за ГВТ"
 RULE_OPTION_ELS_POINT_50_DESC: "Цена за ГВТ будет установлена на уровне $ 0,50 за ГВТ"
 RULE_OPTION_ELS_POINT_75: "$ 0,75 за ГВТ"
 RULE_OPTION_ELS_POINT_75_DESC: "Цена за ГВТ будет установлена на уровне $ 0,75 за ГВТ"
 RULE_OPTION_COM_WARRIOR_KING: "Воинственный король"
 RULE_OPTION_COM_WARRIOR_KING_DESC: "Роберт Денард возвращается на острова в последний раз, и §8Президентская гвардия§! Он без единого выстрела передает ему дворец. Коморские острова перестают быть страной с армией и превращаются в страну, сдающую флаг в аренду, продавая своих наемников по всей Африке."
 RULE_OPTION_COM_MILITARY_DICTATORSHIP: "Полковник остаётся"
 RULE_OPTION_COM_MILITARY_DICTATORSHIP_DESC: "Азали сохраняет за собой пост президента, который он занял в военной форме, возвращает острова под власть Морони и позволяет ротации власти сойти на нет, прежде чем она коснется кого-либо еще. Коморские острова выпадают из орбиты влияния Франции и обращаются к Пекину и Африканскому союзу за признанием, которого Париж больше не предлагает."
 RULE_INVEST_DEFAULT_GAIN_1_5: "1.5%"
 RULE_INVEST_DEFAULT_GAIN_1_5_DESC: "Опция по умолчанию. +1,5% влияния каждый раз, когда кто-то принимает ваши инвестиции."
 SOL_AI_BEHAVIOR: "@SСТАРЫЕ Соломоновы Острова"
 RULE_OPTION_SOL_DYNAMIC: "Динамическое поведение"
 RULE_OPTION_SOL_DYNAMIC_AI_DESC: "Соломоновы острова ориентируются на сложившиеся условия, оценивая, кто пытается завоевать их расположение, как ведут себя провинции и идет ли история по сценарию. Ни одна игра не сводит Хониару с тем или иным путем."
 RULE_OPTION_AUSTRALIAN_PEACE: "Вмешательство и амнистия"
 RULE_OPTION_AUSTRALIAN_PEACE_AI_DESC: "@SOL Соломоновы Острова будут участвовать в мирном процессе при поддержке своего крупнейшего сторонника.  \nПРИМЕЧАНИЕ: @AST Австралия является @SOL крупнейшим сторонником Соломоновых Островов на момент начала игры."
 RULE_OPTION_SOLOMON_BILL_FAILS_RASTA_COUP: "Апрельское коммюнике Провалилось - Переворот Раста"
 RULE_OPTION_SOLOMON_BILL_FAILS_RASTA_COUP_AI_DESC: "Бартоломео Улуфаалу не смог выполнить Мундские соглашения, §8Движение за свободу Исатабу§! возвращается к войне, и §8Малаита Игл Форс§! Его смещает Джимми Лусибеа. Острова переходят под контроль командира ополчения, и Австралия обнаруживает на своих северных подходах вооруженное, несостоявшееся государство."
 RULE_OPTION_AST_REJECTS_TEE_REBEL: "Государственный переворот"
 RULE_OPTION_AST_REJECTS_TEE_REBEL_AI_DESC: "Региональные власти не вмешиваются, и Эндрю Те'е принимает командование. §8Движение за свободу Исатабу§! Поле было в полном распоряжении. Соломоновы острова погрузились в гражданскую войну, и малаитские поселенцы с Гуадалканала были массово изгнаны."
 RULE_DISABLE_GDP_GRAPH: "Отключить график ВВП"
 RULE_NO_RULE_DISABLE_GDP_GRAPH_DESC: "Включает систему построения графиков ВВП"
 RULE_YES_RULE_DISABLE_GDP_GRAPH_DESC: "Отключает систему построения графиков ВВП. Это может помочь повысить производительность для машин более низкого класса."
 RULE_ENABLE_AI_USING_ATTACHES: "Разрешить ИИ использовать §Yатташе§!"
 RULE_ENABLE_AI_USING_ATTACHES_YES_DESC: "Позволяет ИИ использовать §Yатташе§! через дипломатические действия"
 RULE_ENABLE_AI_USING_ATTACHES_NO_DESC: "Запрещает ИИ использовать §Yатташе§! через дипломатические действия"
 RULE_OPTION_THE_GREAT_REBELLION: "Великое восстание"
 RULE_OPTION_THE_GREAT_REBELLION_AI_DESC: "Враждующие группы интересов раскалывают страну, в то время как избиратели теряют интерес к тому, чтобы им противостоять, а оспариваемый подсчет голосов с невероятно малым отрывом окончательно подрывает веру общественности в результат. В Соединенных Штатах вспыхивает открытое восстание из-за выборов, которые никто не хочет признавать."
 RULE_FUTURISTIC_SPECIAL_PROJECTS: "Футуристический Спецпроект"
 RULE_ALLOWED_DISABLE_FUTURISTIC_SPECIAL_PROJECTS_DESC: "Все специальные проекты будут доступны для исследования"
 RULE_OPTION_DISABLED: "Отключенный"
 RULE_DISABLE_DISABLED_FUTURISTIC_SPECIAL_PROJECTS_DESC: "Футуристический спецпроект будет недоступен"
 MD_CUSTOM_SCENARIO_RULES: "Пользовательские сценарии"
 RULE_EVENT_HORIZON_SCENARIO: "Сценарий горизонта событий"
 RULE_EVENT_HORIZON_DEFAULT: "Деактивирован"
 RULE_EVENT_HORIZON_DEFAULT_DESC: "Сценарий \"Горизонт событий\" не будет активен."
 RULE_EVENT_HORIZON_BLITZ: "Блиц - 2001"
 RULE_EVENT_HORIZON_BLITZ_DESC: "Сценарий «Горизонт событий» начнется в 2001 году.\n\n§HПРИМЕЧАНИЕ:§! После того как мегагосударства сформируют §Y«Горизонт событий»§!, вы потеряете текущее дерево фокусов, и оно будет заменено деревом фокусов, соответствующим сценарию."
 RULE_EVENT_HORIZON_CASUAL: "Повседневный стиль - 2012"
 RULE_EVENT_HORIZON_CASUAL_DESC: "Сценарий «Горизонт событий» начнется в 2012 году.\n\n§HПРИМЕЧАНИЕ:§! После того как мегагосударства сформируют §Y«Горизонт событий»§!, вы потеряете текущее дерево фокусов, и оно будет заменено деревом фокусов, соответствующим сценарию."
 RULE_EVENT_HORIZON_DELAYED: "Отложенный - 2020"
 RULE_EVENT_HORIZON_DELAYED_DESC: "Сценарий «Горизонт событий» стартует в 2020 году.\n\n§HПРИМЕЧАНИЕ:§! После того как мегагосударства сформируют §Y«Горизонт событий»§!, вы потеряете текущее дерево фокусов, и оно будет заменено деревом фокусов, соответствующим сценарию."
 RULE_AI_EU_END_GAME_PATHS: "Включить искусственный интеллект для Путей завершения игры"
 RULE_AI_YES_EU_END_GAME_PATHS: "Искусственному интеллекту разрешено следовать по конечным игровым путям Европейского союза, таким как Европейская федерация или Соединенные Штаты Европы."
 RULE_AI_NO_EU_END_GAME_PATHS: "Искусственному интеллекту не разрешается следовать по конечным игровым путям Европейского союза, таким как Европейская федерация или Соединенные Штаты Европы."
 GRN_AI_BEHAVIOR: "@GRN Гренландия"
 RULE_OPTION_GRN_SCANDINAVIAN_SERENITY: "Скандинавская безмятежность"
 RULE_OPTION_GRN_CONTINENTAL_HEGEMONY: "Континентальная Гегемония"
 RULE_DISABLE_COUP_CONTEST: "Отключить события конкурса переворотов"
 RULE_YES_DISABLE_COUP_CONTEST_DESC: "§RОтключает§! цепочку событий §H«конфликт из-за переворота»§!. Крупные иностранные инфлюенсеры §Rне§! будут получать уведомления или возможность отреагировать на переворот в стране, в которую они инвестируют. Используйте эту функцию, если хотите, чтобы ИИ не допускал эскалации опосредованных конфликтов."
 RULE_NO_DISABLE_COUP_CONTEST_DESC: "§GEnables§! the §Hcoup contest§! event chain. Когда в стране происходит успешный переворот, крупнейшие иностранные влиятельные лица (а второе по величине, если их влияние превышает §H20%§!) получают уведомление и могут выбрать способ реагирования: осудить, ввести санкции, поддержать оппозицию или вмешаться военным путем. Гражданские войны, следующие за переворотом, также запускают соответствующее событие поддержки старого режима."
 RULE_REMOVE_MICRO_STATES_TINY: "Крошечные нации (микросостояния)"
 RULE_REMOVE_MICRO_STATES_TINY_DESC: "Удаляются только абсолютно маленькие страны (Монако, Сан-Марино и др.) и островные государства Карибского бассейна."
 RULE_REMOVE_MICRO_STATES_SMALLER: "Малые нации"
 RULE_REMOVE_MICRO_STATES_SMALLER_DESC: "Удаляет крошечные страны плюс чуть более крупные, такие как Бутан, Гамбия и Джибути."
 RULE_REMOVE_MICRO_STATES_INSIGNIFICANT: "Расширенное удаление"
 RULE_REMOVE_MICRO_STATES_INSIGNIFICANT_DESC: "Удаляет все более мелкие страны, а также дополнительные страны, такие как Лаос, Суринам и Гайана, для максимального повышения производительности."
 RULE_ENABLE_RESOURCE_STORAGE_SYSTEM: "Включить §YСистему хранения ресурсов§!"
 RULE_OPTION_ENABLE_RESOURCE_STORAGE_SYSTEM: "Включает §Yсистему хранения ресурсов§!, позволяющую хранить сырье. Отключите эту функцию, если у вас возникают большие задержки в работе. Вы ничего существенного не потеряете."
 RULE_OPTION_DISABLE_RESOURCE_STORAGE_SYSTEM: "Отключает §Yсистему хранения ресурсов§!, позволяя вам хранить сырье."
 RULE_CARRIER_ONLY_RAIDS: "Разрешить налеты только на авианосец"
 RULE_CARRIER_ONLY_RAIDS_NO: "Отключает только рейды авианосца. Это не влияет на возможность использовать рейды авианосцев, но если у вас часто возникают проблемы с авианосцами, когда они перемещаются с авианосца на авиабазы."
 RULE_CARRIER_ONLY_RAIDS_YES: "Разрешает налеты только на авианосец. Это дубликат других рейдов, который допускает использование только стартовых точек авианосца."
 RULE_RAID_DOCTRINE_REACH: "Применяйте Доктрину Reach при рейдах"
 RULE_RAID_DOCTRINE_REACH_NO: "Отключает проверку на соответствие доктрине вмешательства при организации набегов. Игроки (и ИИ) могут готовить набеги на любую видимую цель, независимо от внешнеполитической доктрины. Проверки на состояние войны, общественное мнение и принадлежность к фракции по-прежнему действуют."
 RULE_RAID_DOCTRINE_REACH_YES: "Поведение по умолчанию. Доктрины вмешательства ограничивают выбор целей для набегов: §YИзоляционизм§! не допускает набегов в мирное время, §YМестная безопасность§! не допускает набегов в мирное время, §YОграниченный интервенционизм§! требует наличия соседей, а §YРегиональный интервенционизм§! требует, чтобы цели находились на том же континенте. Война всегда обходит эти ограничения."
 RULE_ALLOW_CPD_AI_OFFERS: "Разрешить ИИ предлагать условный мир"
 RULE_OPTION_CPD_AI_OFFERS_YES_DESC: "Позволит ИИ-государствам, находящимся в состоянии войны, периодически оценивать текущие конфликты и предлагать §Yусловные мирные соглашения§! в тех случаях, когда они считают, что война проиграна или зашла в тупик. Повелители также будут вести переговоры от имени подданных, на которых наложены ограничения."
 RULE_OPTION_CPD_AI_OFFERS_NO_DESC: "Запрещает государствам с искусственным интеллектом самостоятельно заключать §Yусловные мирные соглашения§!. Игроки по-прежнему могут предлагать соглашения вручную с помощью дипломатических действий."
 RULE_EU_EXPANSION_FOCUS: "Поведение ЕС"
 RULE_EU_EXP_NO: "По умолчанию"
 RULE_EU_EXP_NO_DESC: "Стандартное поведение ЕС"
 RULE_EU_EXP_YES: "Курс на расширение"
 RULE_EU_EXP_YES_DESC: "ЕС будет отдавать приоритет законам о расширении"
 RULE_FREE_FACTORIES_AMOUNT: "Бесплатные фабрики для игроков"
 RULE_FREE_FACTORIES_AMOUNT_OFF: "Выкл."
 RULE_FREE_FACTORIES_AMOUNT_OFF_DESC: "В начале игры игроки не получают бесплатных фабрик."
 RULE_FREE_FACTORIES_AMOUNT_ONE: "1 гражданский + 1 военный"
 RULE_FREE_FACTORIES_AMOUNT_ONE_DESC: "В начале игры каждый игрок-человек получает 1 гражданский завод, расположенный за пределами территории, и 1 военный завод, расположенный за пределами территории."
 RULE_FREE_FACTORIES_AMOUNT_TWO: "2 гражданских + 2 военных"
 RULE_FREE_FACTORIES_AMOUNT_TWO_DESC: "В начале игры каждый игрок-человек получает 2 внебазовых гражданских и 2 внебазовых военных завода."
 RULE_FREE_FACTORIES_AMOUNT_THREE: "3 гражданских + 3 военных"
 RULE_FREE_FACTORIES_AMOUNT_THREE_DESC: "В начале игры каждый игрок-человек получает 3 внебазовых гражданских и 3 внебазовых военных завода."
 RULE_FREE_FACTORIES_AMOUNT_FIVE: "5 гражданских + 5 военных"
 RULE_FREE_FACTORIES_AMOUNT_FIVE_DESC: "В начале игры каждый игрок-человек получает 5 внебазовых гражданских и 5 внебазовых военных заводов."
 RULE_OPTION_DEN_EUROSCEPTIC: "Выход из Союза"
 RULE_OPTION_DEN_SOCIALIST: "Красный флаг над Кристиансборгом"
 RULE_OPTION_DEN_MONARCHIST: "Корона восстановлена"
 RULE_OPTION_DEN_NATIONALIST: "Дания для датчан"
 RULE_OPTION_NRY_CHRISTIAN_PEOPLES: "Христианский центр"
 RULE_OPTION_NRY_PROGRESS: "Норвегия для норвежцев"
 RULE_OPTION_MNT_SERBIAN_UNION: "Сербский национализм"
 RULE_OPTION_MNT_SERBIAN_UNION_DESC: "§8Сербские националистические партии§! Прийти к власти, возвысить сербскую культуру и авторитет Православной Церкви, а также привести Черногорию в экономическое и политическое единство с Сербией и Россией. Путь Черногории завершается политическим союзом с Сербией, что отменяет независимость, достигнутую поколением ранее."
 RULE_OPTION_MNT_NEUTRAL_HARBOUR: "Вооруженный нейтралитет"
 RULE_OPTION_MNT_NEUTRAL_HARBOUR_DESC: "Правительство Джукановича отвергает как интеграцию в ЕС/НАТО, так и сербско-российскую коалицию, вместо этого объявляя постоянный вооруженный нейтралитет по швейцарской модели. Свободный порт Черногории становится торговым центром, открытым для всех блоков, используя свое стратегическое положение на Адриатике для получения максимальной коммерческой выгоды."
 SWI_NATO_EU: "Евроатлантическая интеграция"
 SWI_NATO_EU_DESC: "Швейцария откажется от нейтралитета, вступит в НАТО и выдвинет свою кандидатуру в Европейский союз. Если НАТО не будет существовать, оно останется в одиночестве и распустит федерацию."
 SWI_NEUTRAL: "Вооруженный нейтралитет"
 SWI_NEUTRAL_DESC: "Швейцария сохраняет свой вооруженный нейтралитет и избегает любых возможных союзов. Берн торгует со всеми сторонами и выступает посредником между ними, отказываясь быть в чьей-либо колонне."
 RULE_FICTIONAL_CONTENT: "Вымышленный и мемный контент"
 RULE_FICTIONAL_CONTENT_NO_DESC: "§YDefault§!. Шуточный и неисторический контент отключен, включая покупку Аляски Лихтенштейном и восстановление Священной Римской империи, возрождение Скифии Южной Осетией, приход Тесака к власти на Кубе, случайные абсурдные события и различные пасхальные яйца, разбросанные по всему моду."
 RULE_FICTIONAL_CONTENT_YES_DESC: "Мод включает в себя шуточный и неисторический контент, в том числе покупку Аляски Лихтенштейном и восстановление Священной Римской империи, возрождение Скифии Южной Осетией, приход Тесака к власти на Кубе, случайные абсурдные события и различные пасхальные яйца, разбросанные по всему моду."
 RULE_PLAYER_INSTANT_JUSTIFICATION: "Обоснование цели мгновенной войны (только для игроков)"
 RULE_YES_PLAYER_INSTANT_JUSTIFICATION_DESC: "Каждый игрок-человек начинает с национальным духом §YCase for War§!, предоставляющим §G-100%§! время для достижения цели войны. Искусственный интеллект его не получает."
 RULE_NO_PLAYER_INSTANT_JUSTIFICATION_DESC: "Для обоснования целей войны всем требуется обычное время."
 RULE_OPTION_JAP_HISTORICAL: "Исторический"
 BOS_AI_BEHAVIOR: "@BOS Босния и Герцеговина"
 SIA_AI_BEHAVIOR: "@SIA Таиланд"
 RULE_OPTION_SIA_DEFAULT_AI_DESC: "§8Тай Рак Тай§! и его преемники доминируют на выборах, в то время как демократы и дворец оспаривают их решения, а генералы возвращают себе власть всякий раз, когда этого не делают суды. Таиланд остается союзником Вашингтона по договору, не возглавляя ничего, и оставляет свои старые ирредентистские претензии на прежнем месте."
 RULE_OPTION_SIA_PAN_THAI: "Пан-Тай (Большой Таиланд)"
 RULE_OPTION_SIA_PAN_THAI_AI_DESC: "Таиланд перевооружается и настаивает на своих претензиях, от которых он отказался в отношении Лаоса, Камбоджи и северных малайских штатов. Бангкок становится гегемоном материковой части Юго-Восточной Азии, и его соседи соответственно вооружаются."
 RULE_OPTION_SIA_SEATO_LEADER: "Лидер SEATO"
 RULE_OPTION_SIA_SEATO_LEADER_AI_DESC: "Таиланд восстанавливается §8СЕАТО§! и объединяет Юго-Восточную Азию в оборонный пакт, управляемый из Бангкока, а не из Вашингтона. Регион получает собственный порядок безопасности, и великим державам приходится иметь с ним дело как с единым блоком."
 RULE_OPTION_SIA_ALT_HISTORY: "Альтернативная история"
 RULE_OPTION_SIA_ALT_HISTORY_AI_DESC: "Таиланд идёт по коммунистическому пути, отдаляясь от Вашингтона и Запада. Он не будет отстаивать ирредентистские претензии и не будет создавать СЕАТО."
 RULE_AFG_TALIBAN_INSURGENCY_INTENSITY: "@AFG Восстание талибов"
 RULE_AFG_TALIBAN_INSURGENCY_DEFAULT: "Исторический"
 RULE_AFG_TALIBAN_INSURGENCY_DEFAULT_DESC: "Восстание талибов то усиливается, то ослабевает с обычной для них скоростью."
 RULE_AFG_TALIBAN_INSURGENCY_WEAK: "Содержит"
 RULE_AFG_TALIBAN_INSURGENCY_WEAK_DESC: "Талибан восстанавливается вдвое медленнее. Работа по борьбе с повстанцами приносит результаты, и Афганистан вполне может искоренить повстанческое движение."
 RULE_AFG_TALIBAN_INSURGENCY_RELENTLESS: "Безжалостный"
 RULE_AFG_TALIBAN_INSURGENCY_RELENTLESS_DESC: "Талибан восстанавливает страну в полтора раза быстрее. Сохранение целостности страны становится постоянной задачей, а не проблемой, которую решают один раз."
 RULE_AFG_NORTHERN_ALLIANCE_UPRISING: "@AFG Восстание Северного Альянса"
 RULE_AFG_NORTHERN_ALLIANCE_UPRISING_ALLOWED_DESC: "Если талибы одержат победу в гражданской войне, то через несколько месяцев Северный альянс возродится под руководством Исмаила Хана, или же под руководством Ахмада Масуда с 2020 года."
 RULE_AFG_NORTHERN_ALLIANCE_UPRISING_BLOCKED_DESC: "Победа талибов окончательна. Второй фронт на севере не откроется."
 RULE_OPTION_FRA_COMMUNE: "Французская коммуна"
 RULE_OPTION_FRA_COMMUNE_DESC: "Он §8Французская коммунистическая партия§! А радикальные левые сломили Пятую республику и провозгласили Французскую коммуну. Франция покинула западный лагерь и выбрала революционную линию, которая встревожила каждую столицу континента."
 RULE_OPTION_FRA_KINGDOM: "Королевство Франция"
 RULE_OPTION_FRA_KINGDOM_DESC: "Роялистский переворот положит конец Республике и коронует претендента из династии Бурбонов или Орлеанистов королем Франции. Восстановленная монархия отвернется от Брюсселя и возобновит старые распри со своими соседями."
 RULE_OPTION_FRA_EMPIRE: "Французская империя"
 RULE_OPTION_FRA_EMPIRE_DESC: "Бонапартистский переворот положил конец Республике и провозгласил новую Французскую империю. Империя преследует континентальные амбиции, которые противопоставляют её Германии и Великобритании."
 VEN_AI_BEHAVIOR: "@VEN Венесуэла"
 RULE_VEN_CHAVISMO_CONTINUES: "Чавизм продолжается"
 RULE_VEN_CHAVISMO_CONTINUES_DESC: "Боливарианский социализм продолжает существовать при §8Объединенная социалистическая партия§!При этом миссии финансируются, а нефтяная промышленность прочно находится в руках государства. Каракас продолжает финансировать боливарианский проект по всей Латинской Америке, а Вашингтон продолжает рассматривать его как проблему."
 RULE_VEN_OPPOSITION_STATIST: "Оппозиция, монополистическая модель"
 RULE_VEN_OPPOSITION_STATIST_DESC: "Демократическая оппозиция приходит к власти, но оставляет господствующие высоты и государственную нефтяную компанию на прежнем месте. Венесуэла меняет правительство, не меняя экономику, и расстановка сил в регионе практически не меняется."
 RULE_VEN_OPPOSITION_LIBERTARIAN: "Оппозиция, модель свободного рынка"
 RULE_VEN_OPPOSITION_LIBERTARIAN_DESC: "Демократическая оппозиция приходит к власти и открывает экономику для иностранного и внутреннего капитала посредством масштабной дерегуляции и приватизации. Венесуэла возвращается к западному экономическому порядку, а боливарианский блок теряет своего спонсора."
 RULE_VEN_MILITARY_JUNTA: "Военная хунта"
 RULE_VEN_MILITARY_JUNTA_DESC: "Офицерский корпус захватывает дворец и устанавливает националистический авторитарный режим, никому не подотчетный. Венесуэла направляет свою армию на внешнее пространство, и ее соседи обнаруживают, что граничат с экспансионистским государством."
 ALG_AI_BEHAVIOR: "@ALG Алжир"
 RULE_OPTION_ALG_HISTORICAL: "Годы Бутефлики"
 RULE_OPTION_ALG_HISTORICAL_DESC: "Президентство завершает «Черное десятилетие» амнистией и собирает... §8Фронт национального освобождения§! и его союзников, стоящих за ним, до тех пор, пока §8Хирак§! Марши вынуждают старика уйти. Алжир остается опорой арабской и африканской дипломатии, в то время как генералы оставляют последнее слово за собой."
 RULE_OPTION_ALG_LE_POUVOIR: "«Власть сохраняется»"
 RULE_OPTION_ALG_LE_POUVOIR_DESC: "Президентство никогда не освобождается от влияния генералов, и §8le pouvoir§! отвечает §8Hirak§! арестами, а не реформами. Алжир сохраняет гражданский фасад, в то время как силовые структуры решают все за его пределами."
 RULE_OPTION_ALG_HIRAK_DEMOCRACY: "Хирак побеждает"
 RULE_OPTION_ALG_HIRAK_DEMOCRACY_DESC: "Еженедельные марши не ограничиваются президентской резиденцией, и движение §8Hirak§! сокрушает олигархов и разрушает власть. Алжир принимает подлинно гражданскую конституцию и становится первой настоящей демократией в Магрибе."
 RULE_OPTION_ALG_MILITARY_JUNTA: "Генералы берут власть в свои руки."
 RULE_OPTION_ALG_MILITARY_JUNTA_DESC: "Он §8Armée nationale populaire§! Он кладёт конец притворству, приостанавливает действие конституции и полностью регулирует Алжир. Страна замыкается в себе, а её соседи обнаруживают на своей границе государство-гарнизон."
 RULE_OPTION_ALG_ISLAMIST: "Исламистский Алжир"
 RULE_OPTION_ALG_ISLAMIST_DESC: "Движение за мир (§8Movement of Society for Peace§! и §8Ennahda§!) побеждает на выборах, а не в партизанском движении, и строит исламскую республику посредством парламента, судов и мечети. Алжир становится голосом политического ислама в Северной Африке."
 RULE_OPTION_ALG_FIS_UPRISING: "Фронт Спасения возвращается"
 RULE_OPTION_ALG_FIS_UPRISING_DESC: "Он §8Исламский фронт спасения§! Оно так и не было сдержано и заявило о победе на выборах, которую у него отвоевала армия. «Черное десятилетие» закончилось на условиях повстанцев, и Алжир стал базой для вооруженного исламизма в Сахеле."
 ETH_AI_BEHAVIOR: "@ETH Эфиопия"
 RULE_OPTION_ETH_HISTORICAL: "Исторический"
 RULE_OPTION_ETH_HISTORICAL_DESC: "Эфиопия укрепляет свою Федеративную Демократическую Республику за счет прогресса в здравоохранении, образовании и свободе вероисповедания. Коалиция §8EPRDF§! поддерживает политическую преемственность, одновременно углубляя взаимодействие с Африканским союзом."
 RULE_OPTION_ETH_MONARCHIST_RESTORATION: "Возвращение короны"
 RULE_OPTION_ETH_MONARCHIST_RESTORATION_DESC: "Эфиопия восстанавливает §8Королевский совет Эфиопии§! и приглашает Зеру Якоба Амху Селассие на трон. Имперская власть вновь утверждается, роль парламента уменьшается, и возрождаются претензии на Эритрею."
 RULE_CORPORATE_HISTORY: "История компании"
 RULE_CORPORATE_HISTORY_FULL: "Полный"
 RULE_CORPORATE_HISTORY_FULL_DESC: "В разделе «История компаний» представлены выбранные отраслевые направления на этапах их исторического развития. Это стандартный режим работы."
 RULE_CORPORATE_HISTORY_OUTCOMES_ONLY: "Только результаты"
 RULE_CORPORATE_HISTORY_OUTCOMES_ONLY_DESC: "История корпорации незаметно прослеживает исторический путь и его долгосрочные национальные последствия, не показывая выбранные события и не присуждая за них разовые награды."
 RULE_CORPORATE_HISTORY_OFF: "Выключенный"
 RULE_CORPORATE_HISTORY_OFF_DESC: "В разделе «История компании» не создаются никакие штаты и не составляются графики мероприятий. Содержание, относящееся к странам происхождения, остается неизменным."
 RULE_OPTION_ARM_PEOPLES_PARTY: "Народная партия возвращается"
 RULE_OPTION_HOL_HISTORICAL: "Исторический"
 RULE_OPTION_HOL_HISTORICAL_DESC: "§8Труд§! передает страну в руки §8Христианские демократы§! после шока в Фортейне §8Либералы§! хранить это целое поколение, и §8Партия за свободу§! и §8Демократы 66§! следуют по очереди. Нидерланды остаются опорой НАТО и Европейского союза в рамках каждой из этих коалиций."
 RULE_OPTION_HOL_WESTERN_MONARCHY: "Реставрация апельсинов"
 RULE_OPTION_HOL_WESTERN_MONARCHY_DESC: "Восстановленный штатгальтерат управляет страной через Корону, в то время как §8Генеральные государства§! сохраняет контроль над кошельком, и вновь созданная компания §8Вест-Индская компания§! Это возвращает Нидерланды в Атлантику. Суринам и Гайана возвращаются под голландское правление, ситуация в Карибском бассейне улучшается благодаря помощи и посольствам, а Люксембург, Ирландия и Англия связаны с Домом Оранских личной унией."
 RULE_OPTION_HOL_NATIONALIST_MONARCHY: "Воинственная корона"
 RULE_OPTION_HOL_NATIONALIST_MONARCHY_DESC: "Королевская прерогатива восстановлена, выборы приостановлены, и §8Голландская Ост-Индская компания§! Восстанавливается как орудие завоевания в Индийском океане. Цейлон, мыс Доброй Надежды и Батавия отвоевываются силой, а Люксембургу, Ирландии и Англии предъявляются ультиматумы вместо брачных контрактов."
 RULE_OPTION_HOL_NVU: "Nederlandse Volks-Unie"
 RULE_OPTION_HOL_NVU_DESC: "Нидерландское народное объединение (§8Nederlandse Volks-Unie§!) вырастает из маргинального лагеря, совершает марш на Бинненхоф и перестраивает экономику в соответствии с корпоративистскими и автаркическими принципами, подавляя оппозицию. Страна объединяется, и Нидерланды заявляют о своем лидерстве в германской Европе против Франции и Великобритании."
 IND_AI_BEHAVIOR: "@IND Индонезия"
 RULE_OPTION_IND_HISTORICAL: "Исторический"
 RULE_OPTION_IND_HISTORICAL_DESC: "Индонезия укрепляет республику Реформаси за счет §8Партия национального пробуждения§!Борясь с религиозным экстремизмом и выступая посредником в конфликте на Молуккских островах, а не принимая чью-либо сторону. Благодаря антикоррупционным институтам и поддержке Запада, Индонезия становится стабильным демократическим центром в Юго-Восточной Азии."
 RULE_OPTION_IND_ISLAMIST: "Исламская Индонезия"
 RULE_OPTION_IND_ISLAMIST_DESC: "Религиозная радикализация распространяется бесконтрольно, поскольку §8Фронт защитников ислама§! Уличная активность переходит в захват государства. Индонезия распадается на шариатскую республику, которая выдвигает территориальные и идеологические претензии к своим соседям и утверждает господство на территории собственного архипелага."
 RULE_OPTION_MD_RANDOM_PATH: "Случайный путь"
 RULE_OPTION_MD_RANDOM_PATH_DESC: "В начале игры ИИ случайным образом выбирает один из путей развития страны: исторический или альтернативный. Какой именно путь он выбрал, остаётся от вас скрытым."
 RULE_OPTION_MD_NO_PATH: "Нет пути"
 RULE_OPTION_MD_NO_PATH_DESC: "Искусственный интеллект не следует никакому заранее заданному сценарию и свободно выбирает свои приоритеты по мере развития игры. Его поведение меняется от запуска к запуску."
 RULE_OPTION_ITA_HISTORICAL: "Исторический"
 RULE_OPTION_ITA_HISTORICAL_DESC: "Питание попеременно переключается между §8Демократическая партия§! и §8Forza Italia§! Италия остается в составе блока, а также в НАТО и Европейском союзе. Ее правительство тратит деньги на борьбу с организованной преступностью, государственный долг, южный вопрос и собственную администрацию, а не на укрепление границ страны."
 RULE_OPTION_ITA_ROMAN_RESTORATION: "Восстановление Римской империи"
 RULE_OPTION_ITA_ROMAN_RESTORATION_DESC: "§8Fratelli d'Italia§! и национально-правые силы растут до тех пор, пока не одерживают победу на выборах, распускают парламент и коронуют императора над восстановленным Римом. Затем Италия начинает претендовать на старые имперские провинции одну за другой, от африканского побережья до Британии."
 RULE_OPTION_ITA_MARCH_ON_ROME: "Второй поход на Рим"
 RULE_OPTION_ITA_MARCH_ON_ROME_DESC: "Это же движение приходит к власти, но сохраняет республику, устанавливая на своем посту... §8фашистский§! Правительство в Риме. Италия отстаивает свои ирредентистские претензии на Адриатическое море и Альпы, не стремясь к вступлению в состав империи."
 RULE_OPTION_ITA_EASTERN_TURN: "Повернитесь на восток."
 RULE_OPTION_ITA_EASTERN_TURN_DESC: "§8Rifondazione Comunista§! и §8Partito dei Comunisti Italiani§! Восстановить итальянских левых и вывести страну из НАТО. Италия налаживает отношения с Москвой и Пекином и стремится к месту в Шанхайской организации сотрудничества."
 RULE_OPTION_JAP_HISTORICAL_DESC: "Он §8Либеральные демократы§! Сохранение парламента, сохранение союза с Вашингтоном, а нормализация отношений с Силами самообороны происходит лишь в той мере, в какой этого требует враждебное окружение. Япония списывает свои проблемные кредиты, принимает законы против обвала рождаемости и кризиса кароши, и оставляет в силе статью девять."
 RULE_OPTION_JAP_RETURN_OF_THE_EMPIRE: "Возвращение империи"
 RULE_OPTION_JAP_RETURN_OF_THE_EMPIRE_DESC: "Партия «Восстановление» (§8Restoration Party§!) вырастает из националистического правого крыла, пока не будет восстановлена ​​власть и статья девять не будет отменена. Япония перевооружается, создавая флот открытого моря, и силой возвращает себе Курильские острова, Корею, Тайвань и старую сферу влияния в Тихом океане."
 RULE_OPTION_TUR_HISTORICAL: "Исторический ИИ"
 RULE_OPTION_TUR_HISTORICAL_DESC: "Банковский кризис разрушает §8Партия добродетели§!и §8Партия справедливости и развития§! Отколовшаяся от него страна берет верх. Турция прибегает к неоосманской дипломатии на Ближнем Востоке и Балканах, в то время как президентская власть постепенно превосходит по своим размерам парламент."
 RULE_OPTION_TUR_KEMALIST_GUARD: "Стражи кемализма"
 RULE_OPTION_TUR_KEMALIST_GUARD_DESC: "Исламистов запрещают до того, как они смогут перегруппироваться, и §8светская республика§! Сплачивается за Генеральным штабом. Турция остается привязанной к НАТО и решает курдский вопрос с помощью армии, а не путем реформ."
 RULE_OPTION_TUR_GREY_WOLVES: "Серые Волки"
 RULE_OPTION_TUR_GREY_WOLVES_DESC: "Он §8националистические правые§! Турция побеждает в выборах, завершает выборы и коронует султана над восстановленным Османским государством. Турция продолжает отстаивать свои претензии на территории Фракии, Кавказа и тюркского мира."
 RULE_OPTION_TUR_HIZMET: "Движение «Хизмет»"
 RULE_OPTION_TUR_HIZMET_DESC: "Сеть §8Gülenist§! унаследовала обломки Партии Добродетели и управляет государством через суды, полицию и школы, а не через избирательные урны. Турция пропагандирует умеренный ислам за рубежом, в то же время незаметно подрывая собственные институты."
 RULE_OPTION_TUR_TURKISH_LEFT: "Возвращение турецких левых"
 RULE_OPTION_TUR_TURKISH_LEFT_DESC: "Голоса противников истеблишмента склоняются в сторону §8революционные левые§! Вместо исламистов Турция выходит из НАТО, признает свои меньшинства и позиционирует себя как антиимпериалистический авангард в регионе."
 RULE_OPTION_TUR_GREAT_EAST: "Великий Восток"
 RULE_OPTION_TUR_GREAT_EAST_DESC: "Партия Добродетели приходит к власти, дестабилизирует Генеральный штаб, а затем радикализируется и превращается в... §8салафит§! Движение, которое приводит к роспуску республики. Турция провозглашает халифат и расширяется во всех возможных направлениях."
 RULE_OPTION_ENG_HISTORICAL: "Исторический"
 RULE_OPTION_ENG_HISTORICAL_DESC: "§8Труд§! правит при Блэре и Брауне до §8Консерваторы§! вступить в должность и передавать пост премьер-министра по цепочке лидеров, пока лейбористы не вернутся к власти под руководством Стармера. Великобритания выходит из Европейского союза, сохраняет альянс с Америкой и удерживает Союз в целостности."
 RULE_OPTION_ENG_RISE_OF_BRITAIN: "Возвышение Британии"
 RULE_OPTION_ENG_RISE_OF_BRITAIN_DESC: "Британия сохраняет парламентскую демократию и восстанавливает империю путем покупок, а не завоеваний, покупая прессу, партии и министерства своих бывших колоний. Правительства от Карибского бассейна до Тихого океана снова подчиняются Лондону без единого выстрела."
 RULE_OPTION_CHI_HISTORICAL: "Великое Возрождение"
 RULE_OPTION_CHI_HISTORICAL_DESC: "Он §8Шанхайская клика§! передает партию в руки §8Туанпай§! И соглашение с Туаньпаем с Си Цзиньпином, в свою очередь, лишает Гонконг автономии. Пекин отстаивает свои претензии в Южно-Китайском море и по другую сторону пролива, не вступая за них в войну."
 RULE_OPTION_CHI_HEGEMON: "Восстановленное Срединное царство"
 RULE_OPTION_CHI_HEGEMON_DESC: "Модель §8Chongqing§! приводит Бо Силая к лидерству, а модели §8Wolf Warriors§! получают возможность действовать досрочно. Китай силой осваивает гималайскую границу, подчиняет Бутан, Непал и Индию и захватывает Тайвань."
 RULE_OPTION_CHI_PEACEFUL_RISE: "Мирный подъем"
 RULE_OPTION_CHI_PEACEFUL_RISE_DESC: "Цзэн Цинхун наследует машину Цзяна, и §8Шанхайские технократы§! Придерживаться курса Дэн Сяопина. Принцип «Одна страна, две системы» соблюдается, Тибет и Синьцзян управляются на основе законов, а не военных кампаний, а воссоединение обсуждается за столом переговоров."
 RULE_OPTION_BHR_HISTORICAL: "Хартия Аль-Халифа"
 RULE_OPTION_BHR_HISTORICAL_DESC: "Корона покупает мир с помощью национальной хартии и выборной палаты, а затем разрывает §8Молодежная коалиция, 14 февраля§! После заполнения кольцевой развязки на место прибудут саудовские броненосцы. Бахрейн остается портом американского флота и самым надежным клиентом Эр-Рияда."
 RULE_OPTION_BHR_DAY_OF_RAGE: "День Ярости"
 RULE_OPTION_BHR_DAY_OF_RAGE_DESC: "§8Al-Wefaq§! удерживает кольцевую развязку до тех пор, пока шиитское большинство наконец не сможет избраться в правительство, в котором ему всегда отказывали. Бахрейн отказывается от монархии в пользу республики и подчиняется Тегерану, а не Эр-Рияду."
 RULE_OPTION_BHR_CROWNED_DEMOCRACY: "Конституционная сделка"
 RULE_OPTION_BHR_CROWNED_DEMOCRACY_DESC: "Корона легализует §8Wa'ad§! и его соперников, передавая управление подлинному парламенту, удерживая трон над спорами, а не в них. Бахрейн становится первой функционирующей демократией в Персидском заливе, так и не покинув западный лагерь."
 RULE_OPTION_BOT_HISTORICAL: "Партия BDP продолжает существовать"
 RULE_OPTION_BOT_HISTORICAL_DESC: "Демократическая партия Ботсваны (§8Botswana Democratic Party§!) передает президентский пост от одного своего представителя другому и выигрывает все выборы, в которых участвует, а доходы от продажи алмазов идут на финансирование школ, клиник и борьбу со СПИДом. Ботсвана демонстрирует тихий успех континента, оставаясь неприсоединившейся и платежеспособной страной, готовой открыто говорить то, о чем не решаются ее соседи."
 RULE_OPTION_BOT_POLITICAL_RAINBOW: "Зонтик раскрывается"
 RULE_OPTION_BOT_POLITICAL_RAINBOW_DESC: "Оппозиция прекращает раскалывать голоса избирателей и объединяется вокруг §8Зонт за демократические перемены§!, разрывая хватку §8Демократическая партия Ботсваны§! Эта тенденция сохраняется с момента обретения независимости. В Ботсване впервые происходит смена правительства, и Южная Африка получает доказательство того, что освободительную партию можно сместить с должности путем голосования."
 RULE_OPTION_BOT_KGOSIKGOLO: "Коронация Кгосикголо"
 RULE_OPTION_BOT_KGOSIKGOLO_DESC: "§8Dikgosi§! превращают Палату вождей из консультативного органа в центр власти и назначают одного из своих вождей верховным вождем над всей страной. Выборы уступают место традиционной монархии, и образцовая демократия континента перестает быть чем-то, что соседи больше не признают."
 BLR_AI_BEHAVIOR: "@BLR Беларусь"
 RULE_OPTION_BLR_HISTORICAL: "Последний диктатор Европы"
 RULE_OPTION_BLR_HISTORICAL_DESC: "Александр Лукашенко сажает в тюрьму своих соперников, привязывает экономику к рублю и разрушает §8Революция джинсов§! с отрядами по борьбе с беспорядками. Беларусь остается ближайшим союзником Москвы и самым изолированным правительством в Европе."
 RULE_OPTION_BLR_EUROPEAN_BELARUS: "Европейская Беларусь"
 RULE_OPTION_BLR_EUROPEAN_BELARUS_DESC: "Андрей Санников избран президентом на следующий срок. §8Европейская Беларусь§! кампания и отвлекает страну от рубля и направляет её к Брюсселю. Беларусь подаёт заявку на вступление в НАТО и Европейский союз, а Россия теряет позиции, на которые рассчитывала к западу от Смоленска."
 RULE_OPTION_BLR_TIKHANOVSKAYA: "Тихановская революция"
 RULE_OPTION_BLR_TIKHANOVSKAYA_DESC: "Лукашенко правил безраздельно целое поколение, пока украденные выборы не привели к власти Светлану Тихановскую. §8Координационный совет§! ОМОН не может прорваться. Беларусь поворачивает на запад гораздо позже своих соседей, российские подразделения уже находятся на границе."
 RULE_OPTION_BLR_POPULAR_FRONT: "Национальное возрождение"
 RULE_OPTION_BLR_POPULAR_FRONT_DESC: "Зианон Пазняк несет §8Белорусский народный фронт§! Беларусь пришла к власти, проводя программу белорусскизации, чистки советских чиновников и возрождая память о Великом княжестве. Беларусь обращается против Москвы и предъявляет претензии на каждого соседа, который когда-то подчинялся Вильнюсу."
 RULE_OPTION_BLR_NATIONAL_BOLSHEVIKS: "Национал-большевистское восстание"
 RULE_OPTION_BLR_NATIONAL_BOLSHEVIKS_DESC: "Национал-большевики (§8National biggers§!) выходят на улицы, а затем и в государство, восстанавливая советский порядок за счет трудовой армии и партийного ополчения. Беларусь вооружается против Польши, Украины и стран Балтии с благословения Москвы."
 RULE_OPTION_BLR_LITBEL: "Возрождение Литбела"
 RULE_OPTION_BLR_LITBEL_DESC: "Он §8Коммунистическая партия Беларуси§! Возвращается к власти и делает старую Литовско-Белорусскую республику своим основополагающим проектом. Беларусь возвращает Литву и Латвию в социалистический союз, используя своё влияние там, где это возможно, и силу там, где это невозможно."
 RULE_OPTION_BLR_OLIGARCHY: "Сделка олигарха"
 RULE_OPTION_BLR_OLIGARCHY_DESC: "Сергей Хайдукевич и §8Либерально-демократическая партия§! Беларусь обменивает идеологию Лукашенко на более откровенный бизнес, продавая доступ к Москве по максимально выгодной цене. Беларусь остается в орбите влияния России, но рассматривает Союзное государство как договор, а не как кредо."
 RULE_OPTION_BOS_HISTORICAL: "Дейтонский орден"
 RULE_OPTION_BOS_HISTORICAL_DESC: "Председательство, осуществляемое на ротационной основе, проходит под международным наблюдением, и §8Партия демократического действия§! Вместо того чтобы победить своих сербских и хорватских соперников, Босния делит государство с ними. Она восстанавливается под прикрытием миротворцев НАТО и европейских стран и приближается к Брюсселю, так и не определив, что представляет собой страна."
 RULE_OPTION_BOS_SRPSKA_PARTNERSHIP: "Српска занимает кресло"
 RULE_OPTION_BOS_SRPSKA_PARTNERSHIP_DESC: "Он §8Альянс независимых социал-демократов§! Босния побеждает на президентских выборах и направляет Сараево в сторону Белграда и Москвы, сохраняя при этом федерацию в целости. Босния выходит из орбиты влияния Запада по соглашению, а не силой, и Россия получает второй плацдарм на Балканах."
 RULE_OPTION_BOS_SRPSKA_UNION: "Сербская Первая"
 RULE_OPTION_BOS_SRPSKA_UNION_DESC: "Он §8Сербская демократическая партия§! Централизует всю страну под управлением Баня-Луки и ведет переговоры об объединении с Сербией. Босния входит в состав более крупного сербского государства, и ее соседи узнают о перекройке карты."
 RULE_OPTION_BOS_ISLAMIST_REVIVAL: "Боснийское пробуждение"
 RULE_OPTION_BOS_ISLAMIST_REVIVAL_DESC: "Недовольство боснийцев перерастает в религиозное возрождение, и §8Национальное пробуждение§! республика перевооружается, чтобы закончить войну на своих условиях. Босния отправляет миротворцев домой и обращается против своих образований, а затем и против своих соседей."
 RULE_OPTION_BOS_WORKERS_STATE: "Рабочие советы"
 RULE_OPTION_BOS_WORKERS_STATE_DESC: "Массовая безработица влечет за собой §8Рабочий фронт§! этнические партии отходят на второй план, и промышленность Боснии переходит в ведение советов людей, которые в ней работают. Государство становится светским и самоуправляемым, не подчиняясь ни Брюсселю, ни Белграду."
 RULE_OPTION_BRA_HISTORICAL: "Годы Лулы"
 RULE_OPTION_BRA_HISTORICAL_DESC: "Он §8Рабочая партия§! В конце концов, он выигрывает президентские выборы и сочетает денежные выплаты бедным с традиционными методами финансирования, пока расследование коррупции не ослабляет позиции левых и не передает президентский дворец бывшему армейскому капитану. Бразилия превращается в популярную среднюю державу, которая спорит с Вашингтоном, не покидая его орбиты."
 RULE_OPTION_BRA_BROAD_FRONT: "Новая Бразилия"
 RULE_OPTION_BRA_BROAD_FRONT_DESC: "Он §8Рабочая партия§! управляет посредством широкой коалиции с §8Бразильское демократическое движение§! и более мелким левым, и отвечает на коррупционные скандалы реформами, а не отступлением. Бразилия остается конституционной демократией и становится опорой Южной Америки, которая больше не смотрит на север в поисках разрешения."
 RULE_OPTION_BRA_SOCIALIST_REPUBLIC: "Красная Республика"
 RULE_OPTION_BRA_SOCIALIST_REPUBLIC_DESC: "Он §8Рабочая партия§! Бразилия прекращает разделять власть, поглощает своих левых соперников и перестраивает государство вокруг себя. Бразилия провозглашает социалистическую республику и экспортирует эту модель каждому соседу, готовому ее принять."
 RULE_OPTION_BRA_LIBERALS: "Либеральный порядок"
 RULE_OPTION_BRA_LIBERALS_DESC: "Он §8Бразильская социал-демократическая партия§! Бразилия сохраняет за собой занимаемый ею пост президента и доводит до конца политику приватизации и таргетирования инфляции. Бразилия становится самой открытой экономикой на континенте и самым надежным партнером Америки к югу от экватора."
 RULE_OPTION_BRA_SOCIAL_DEMOCRATS: "Социал-демократы"
 RULE_OPTION_BRA_SOCIAL_DEMOCRATS_DESC: "Партия социал-демократов Бразилии (§8Brazilian Social Democracy Party§!) правит вместе с Демократической рабочей партией (§8Democratic Labour Party§!) и отходит от рыночных принципов в сторону государства развития с минимальным уровнем социального обеспечения. Бразилия тратит средства на промышленность и образование, а не на проценты по кредитам, и дистанцируется как от Вашингтона, так и от Пекина."
 RULE_OPTION_BRA_MILITARY_RULE: "Республика Капитана"
 RULE_OPTION_BRA_MILITARY_RULE_DESC: "Социал-либеральная партия §8§! захватывает президентский пост, прославляет старую диктатуру и распускает конгресс, стоявший у нее на пути. Бразилия снова управляется указами из казарм и выдвигает свои претензии против социалистических правительств на своих границах."
 RULE_OPTION_BRA_MONARCHY: "Империя восстановлена"
 RULE_OPTION_BRA_MONARCHY_DESC: "Он §8монархист§! Возрождение превращает националистическое президентство в коронацию, и династия Орлеан-Браганса возвращается на трон, пустовавший более века. Бразилия отменяет выборы, возвращает себе старую провинцию Сисплатина и снова подчиняется короне."
 RULE_OPTION_ARM_HISTORICAL: "Карабахский клан"
 RULE_OPTION_ARM_HISTORICAL_DESC: "Ветераны Карабахской войны занимают пост президента уже два десятилетия. §8Республиканская партия Армении§!до тех пор, пока улицы окончательно не отдадут страну в руки... §8Сторона гражданского договора§!Армения сохраняет зависимость от Москвы в вопросах своей безопасности, одновременно споря с Баку из-за горных районов."
 RULE_OPTION_ARM_TER_PETROSIAN: "Первый президент возвращается"
 RULE_OPTION_ARM_TER_PETROSIAN_DESC: "Он §8Армянский национальный конгресс§! Возвращается президент-основатель, которого генералы свергли, а карабахцы так и не получают своей очереди. Армения меняет горы на открытые границы и нормальные отношения со своими соседями."
 RULE_OPTION_ARM_PEOPLES_PARTY_DESC: "Он §8Народная партия Армении§! Армения выживает после выстрела в камере и получает государство, которого ей не хватало. Армения восстанавливает промышленность и планирование на основе советских принципов и становится самым надежным партнером Москвы на Кавказе."
 RULE_OPTION_ARM_TSARUKYAN: "Республика олигархов"
 RULE_OPTION_ARM_TSARUKYAN_DESC: "§8Процветающая Армения§! Парламент полностью покупается, и страной управляют из имения бизнесмена, а не из президентского дворца. Армения становится богатой, коррумпированной и продается той столице, которая предложит наибольшую цену."
 RULE_OPTION_ARM_UNITED_STATES: "Соединенные Штаты Армении"
 RULE_OPTION_ARM_UNITED_STATES_DESC: "Партия «Наследие» (§8Heritage Party§!) и диаспора переписывают республику, превращая её в федерацию, где место зарезервировано для каждого армянина, живущего за границей. Армения смотрит в будущее не из Москвы, а из Лос-Анджелеса и Бейрута."
 RULE_OPTION_ARM_FOUNDING_PARLIAMENT: "Парламент-основатель"
 RULE_OPTION_ARM_FOUNDING_PARLIAMENT_DESC: "Ветераны Карабаха из §8Sasna Tsrer§! захватывают республику, которую считают украденной, и управляют ею как гарнизоном. Армения вытесняет российские базы и просит Запад гарантировать ее существование."
 RULE_OPTION_ARM_MONARCHY: "Корона восстановлена"
 RULE_OPTION_ARM_MONARCHY_DESC: "Союз Мелик Армении (§8Meliq Union of Armenia§!) положил конец республике и впервые за шесть веков возвел в Ереване короля. Армения управляет страной посредством престола и церкви и претендует на все провинции, когда-либо принадлежавшие ее старым царствам."
 RULE_OPTION_ARM_DASHNAK_LEFT: "Дашнакский социализм"
 RULE_OPTION_ARM_DASHNAK_LEFT_DESC: "Социалистическое крыло Армянской революционной федерации (§8Armenian Revolutionary Federation§!) одерживает победу внутри партии и восстанавливает республику на основе её основополагающих принципов. Армения национализирует владения олигархов и выступает против империи везде, где её обнаруживает."
 RULE_OPTION_ARM_DASHNAK_RIGHT: "Наследие федаев"
 RULE_OPTION_ARM_DASHNAK_RIGHT_DESC: "Националистическое крыло §8Армянская революционная федерация§! Армения захватывает партию и правит от имени горных бойцов. Армения вооружается за утраченные земли и не скрывает своего желания вернуть их."
 RULE_OPTION_BUL_HISTORICAL: "Дорога в Брюссель"
 RULE_OPTION_BUL_HISTORICAL_DESC: "Союз демократических сил (§8Union of Democratic Forces§!) объединяет валютный совет и программу реформ, и каждое последующее правительство оставляет эти две заявки на рассмотрении. Болгария вступает в НАТО, а затем в Европейский союз, что обеспечивает альянсу самую спокойную границу на Балканах."
 RULE_OPTION_BUL_TSARIST_RESTORATION: "Царь возвращается"
 RULE_OPTION_BUL_TSARIST_RESTORATION_DESC: "Изгнанник §8Дом Саксен-Кобург-Гота§! Болгария возвращается домой не только с постом премьер-министра, но и собирает вокруг себя националистов, поддерживающих корону, и правит от своего имени. Болгария меняет западные требования на обещанные ей в Сан-Стефано границы, а ее соседи обнаруживают, что македонский вопрос вновь открыт."
 RULE_OPTION_BUL_RED_BALKAN: "Мечта Красных Балкан"
 RULE_OPTION_BUL_RED_BALKAN_DESC: "Он §8Коммунистическая партия Болгарии§! восстает из обломков переходного периода и занимает ведущую позицию. §8Болгарская социалистическая партия§! Болгария не станет возвращать свои земли. Она ищет друзей в Москве и Пекине и приступает к созданию социалистической федерации на Балканах."
 RULE_OPTION_CAN_HISTORICAL: "Исторический"
 RULE_OPTION_CAN_HISTORICAL_DESC: "Либеральная партия Канады (§8Liberal Party§!) управляет страной из центра, сохраняет оба основополагающих языка в федеративном аппарате и отвечает Квебеку законом о ясности, а не уступками. Канада остается в НАТО и Североамериканской торговой зоне и сохраняет статус самого стабильного соседа Вашингтона."
 RULE_OPTION_CAN_FRENCH_CANADA: "Французская Канада"
 RULE_OPTION_CAN_FRENCH_CANADA_DESC: "Партия §8Bloc Québécois§! превращает языковой конфликт в федеральную программу, делает французский язык единственным языком государства и переносит столицу в Квебек. Англоязычная Канада оказывается в меньшинстве в собственной столице, и союз держится вместе на законных основаниях, а не на согласии."
 RULE_OPTION_CAN_ARMED_NEUTRALITY: "Истинный Север в одиночестве"
 RULE_OPTION_CAN_ARMED_NEUTRALITY_DESC: "Канада выходит из НАТО, прекращает свои внешнеполитические пристрастия и направляет сэкономленные средства на развитие внутренней экономики и самодостаточной оборонной промышленности. Северный фланг альянса затихает, и Вашингтон теряет вторую армию на собственном континенте."
 RULE_OPTION_CAN_NATIONALIST: "Националистический переворот"
 RULE_OPTION_CAN_NATIONALIST_DESC: "§8Canada First§! приходит к власти, опираясь на обломки конституционного порядка, приостанавливает выборы и предоставляет Квебеку и резервациям чрезвычайные полномочия. Канада обращается против собственного континента, и самая длинная в мире незащищенная граница укрепляется с севера."
 RULE_OPTION_CAN_EASTERN_REALIGNMENT: "Арктический мост"
 RULE_OPTION_CAN_EASTERN_REALIGNMENT_DESC: "Оттава выходит из НАТО и продает свои арктические маршруты, порты и ресурсы Москве и Пекину, а не Вашингтону. Канада становится северной оконечностью российско-китайской сферы влияния, и Соединенные Штаты осознают наличие соперника на собственном континенте."
 RULE_OPTION_DEN_HISTORICAL: "Годы Фога"
 RULE_OPTION_DEN_HISTORICAL_DESC: "§8Венстре§! и §8Социал-демократы§! Между ними происходит обмен Кристиансборгом, в то время как Дания сохраняет свои права на отказ от участия в еврозоне, отклоняет предложение о введении евро и отправляет солдат на Балканы, в Ирак и Афганистан. Копенгаген становится самым охотно выступающим небольшим союзником Вашингтона в Европе и позволяет Союзу укрепляться без него."
 RULE_OPTION_DEN_EUROPEAN_UNION: "В самом сердце Европы"
 RULE_OPTION_DEN_EUROPEAN_UNION_DESC: "Он §8Социал-либералы§! и §8Социал-демократы§! Провести второй референдум и потратить средства, полученные от отказа Дании от участия в выборах, на приобретение места в центре Евросоюза. Крона уступит место евро, и Копенгаген будет привязан к Берлину и Парижу, а не к Вашингтону."
 RULE_OPTION_DEN_EUROSCEPTIC_DESC: "Он §8Датская народная партия§! Это заставляет старые партии задать вопрос, который они постоянно откладывают, и Дания выходит из Шенгенской зоны, а затем и из самого Европейского союза. Сотрудничество в сфере обороны между странами Северной Европы занимает место Брюсселя, и остальной части Скандинавии предлагается выбрать сторону."
 RULE_OPTION_DEN_SOCIALIST_DESC: "Он §8Красно-зеленый альянс§! А профсоюзы превращают государство всеобщего благосостояния в рабочее государство и ставят советы выше Фолькетинга. Дания выходит из союза и Союза, ищет друзей на востоке и предлагает остальной части Севера революцию."
 RULE_OPTION_DEN_MONARCHIST_DESC: "Суд перестаёт притворяться, что он выполняет церемониальную функцию, и §8Датская народная партия§! Проводит дело короны через парламент, потерявший терпение страны. Монарх возвращает себе полномочия, отнятые конституцией, и Гренландия и Фарерские острова оказываются под полным контролем Копенгагена."
 RULE_OPTION_DEN_NATIONALIST_DESC: "Датская народная партия (§8Danish People's Party§!) берет правительство, которое она всегда лишь поддерживала, и делает иммиграцию и пограничный контроль всей политической жизнью Дании. Дания выходит из альянса и Северного совета и начинает выдвигать требования, которые не поднимала со времен Средневековья."
 COM_AI_BEHAVIOR: "@COM Коморские острова"
 RULE_OPTION_COM_HISTORICAL: "Союз Коморских островов"
 RULE_OPTION_COM_HISTORICAL_DESC: "Азали Ассумани меняет военную форму на избирательную урну, на каждом острове появляется свой президент, и президентство в Африканском союзе переходит от одного острова к другому, а войска Африканского союза отбирают Анжуан у его полковника. §8Конвенция о возобновлении Коморских островов§! сначала одерживает победу, а затем мирно теряет власть, и архипелаг наконец прекращает саморазрушение."
 RULE_OPTION_COM_ORANGE_PARTY: "Оранжевое восхождение"
 RULE_OPTION_COM_ORANGE_PARTY_DESC: "Партия Мохамеда Дауду «Оранжевые» (§8Orange Party§!) берет Морони под свой контроль и управляет архипелагом как технократической державой, сформированной по заслугам, разрушая сети торговли людьми и профессионализируя министерства. Коморские острова позиционируют себя для западного капитала как единственное микрогосударство в Индийском океане, чьей документации можно доверять."
 RULE_OPTION_COM_ISLAMIC_REPUBLIC: "Арабская Республика"
 RULE_OPTION_COM_ISLAMIC_REPUBLIC_DESC: "Комитеты мечети выдвинули Ахмеда Абдаллу Мохамеда Самби президентом, и §8Баасистское движение§! Острова преобразуются в арабскую республику. Порты национализируются, Дамаск и Багдад заменяют Париж, а Коморские острова становятся голосом Лиги арабских государств в Мозамбикском проливе."
 RULE_OPTION_CUB_HISTORICAL: "Исторический"
 RULE_OPTION_CUB_HISTORICAL_DESC: "Фидель передает президентство своему брату и §8Партия коммуниста Кубы§! Остров остается под контролем одной партии, выдавая лицензии на мелкую торговлю и одновременно заигрывая с Каракасом и Москвой за нефть. Эмбарго сохраняется, особый период так и не заканчивается, и Гавана остается неуклюжим исключением в полушарии Вашингтона."
 RULE_OPTION_CUB_PRO_WESTERN_REFORM: "Фидель открывает остров для посещения"
 RULE_OPTION_CUB_PRO_WESTERN_REFORM_DESC: "Кастро самостоятельно демонтирует плановую экономику, выдавая лицензии банкам, восстанавливая церковь и разрабатывая конституцию, допускающую конкурирующие партии под эгидой... §8прозападное крыло Коммунистической партии§!Гавана урегулирует вопрос о Гуантанамо с Вашингтоном, признает Тайбэй и в итоге начинает проводить учения совместно с НАТО."
 RULE_OPTION_CUB_DIAZ_CANEL: "Оттепель Диаса-Канеля"
 RULE_OPTION_CUB_DIAZ_CANEL_DESC: "Мигель Диас-Канель занимает президентский дворец, опередив Рауля, снимает запрет с партии §8Unión Liberal Cubana§! и назначает первые выборы с участием нескольких партий после революции. Цензура демонтирована, иностранный капитал возвращается, и Куба без единого выстрела становится обычной карибской республикой."
 RULE_OPTION_CUB_NEW_SOCIALISM: "Вторая революция"
 RULE_OPTION_CUB_NEW_SOCIALISM_DESC: "Диас-Канель отказывается от первоначального плана, восстанавливает однопартийное государство вокруг более молодого руководства и открыто торгует с Пхеньяном. Куба вступает в ОДКБ и возвращает России её базы, размещая российский гарнизон в девяноста милях от Флориды."
 RULE_OPTION_CUB_NATIONALIST: "Куба для кубинцев"
 RULE_OPTION_CUB_NATIONALIST_DESC: "Он §8Кубинская фаланга§! Гавана захватывает государство, проводит чистки как среди коммунистов, так и среди демократов и перестраивает армию вокруг молодежного трудового корпуса. Затем Гавана заявляет права на весь бассейн как на свое исконное право, и Гаити, Ямайка и перешеек аннексируются один за другим."
 RULE_OPTION_CUB_RESTORED_REPUBLIC: "Республика восстановлена"
 RULE_OPTION_CUB_RESTORED_REPUBLIC_DESC: "Он §8Социал-революционно-демократическая партия Кубы§! Приходит к власти, освобождает политических заключенных и переписывает конституцию, создавая многопартийный парламент. Затем Куба приглашает своих соседей в Карибскую федерацию вместо того, чтобы завоевывать их."
 RULE_OPTION_CZE_HISTORICAL: "Исторический"
 RULE_OPTION_CZE_HISTORICAL_DESC: "Он §8Чешские социал-демократы§! и §8Гражданско-демократическая партия§! Они обмениваются государственными услугами между собой, пока страна вступает в НАТО и Европейский союз, а компания Škoda превращает Млада-Болеслав в экспортный центр. Прага отправляет своих солдат на Балканы и в Афганистан и становится комфортным, ничем не примечательным членом западного блока."
 RULE_OPTION_CZE_COMMUNISM: "Возвращение коммунистов"
 RULE_OPTION_CZE_COMMUNISM_DESC: "Он §8Коммунистическая партия Богемии и Моравии§! Превращая гнев по поводу приватизации в правящее большинство, Чешская Республика направляет внимание министерств на тех, кто продал заводы. Она выходит из НАТО, налаживает отношения с Москвой и Пекином и вновь поднимает вопросы о границе, которые, как считали ее соседи, были урегулированы."
 RULE_OPTION_CZE_MONARCHY_KING: "Корона Габсбургов"
 RULE_OPTION_CZE_MONARCHY_KING_DESC: "§8Koruna Česká§! превращается из диковинки в крупнейшую партию, извлекает из хранилища королевские драгоценности и приглашает Карла фон Габсбурга к себе домой для коронации. Чешские земли вновь становятся королевством и начинают объединять Вену и Будапешт в монархический блок по всей Центральной Европе."
 RULE_OPTION_CZE_MONARCHY_PRESIDENT: "Коронованная Республика"
 RULE_OPTION_CZE_MONARCHY_PRESIDENT_DESC: "§8Koruna Česká§! убеждает страну вернуться к старому порядку, но сохраняет избирательную урну, устанавливая монархическую главу государства, избираемого путем выборов, а не по крови. Чешская Республика сохраняет свой парламент и европейских партнеров, одновременно перестраивая свою экономику вокруг престола, церкви и региона."
 RULE_OPTION_FIJ_HISTORICAL: "Исторический"
 RULE_OPTION_FIJ_HISTORICAL_DESC: "Армия смещает избранных должностных лиц. §8Объединенная партия Фиджи§! правительство устанавливает на его месте администрацию, поддерживаемую военными. На островах восстанавливается стабильность, но окончательная власть остается за казармами, а выборы откладываются."
 RULE_OPTION_FIJ_COUP_AVERTED: "Переворот предотвращен"
 RULE_OPTION_FIJ_COUP_AVERTED_DESC: "Противостояние между правительством и армией разрешается до того, как оно успевает кого-либо свергнуть, и §8Лейбористская партия Фиджи§! Фиджи приходит к власти, имея мандат от левоцентристских сил. Примирение и государственные инвестиции возглавляют повестку дня, и Фиджи сохраняет гражданское правительство, от которого отказались соседи."
 RULE_OPTION_FIJ_MILITARY_JUNTA: "Республика офицеров"
 RULE_OPTION_FIJ_MILITARY_JUNTA_DESC: "Радикалы в §8Вооруженные силы Фиджи§! пойти дальше требований переворота и формализовать открытое военное правление, объединив полицию с армией в условиях военного положения. Политика управляется из казарм, и в Тихоокеанском регионе появляется открыто милитаризированное государство в самом центре морских путей."
 RULE_OPTION_FIJ_RESTORED_KINGDOM: "Корона восстановлена"
 RULE_OPTION_FIJ_RESTORED_KINGDOM_DESC: "Великий Совет вождей (§8Great Council of Chiefs§!) преодолевает кризис и воссоздает Фиджи как королевство под властью избранного монарха. В основе государства лежат обычаи вождей, а коренное население решает этнический вопрос на своих собственных условиях."
 RULE_OPTION_FIJ_TECHNOCRACY: "Управление с помощью инженеров"
 RULE_OPTION_FIJ_TECHNOCRACY_DESC: "Совет инженеров, планировщиков и администраторов берет страну под свой контроль и управляет ею на основе технократической конституции. Партийная политика уступает место автоматизации и промышленному планированию, и Фиджи стремится превзойти по развитию экономику всех стран региона."
 RULE_OPTION_FIJ_EARLY_JUNTA: "Казармы переезжают раньше времени"
 RULE_OPTION_FIJ_EARLY_JUNTA_DESC: "Кризис с заложниками в новом тысячелетии так и не удалось локализовать, и §8Вооруженные силы Фиджи§! Захватить страну целиком, пока парламент еще находится в осаде. Милитаризованное общество закаляется на годы раньше срока, и регион наблюдает, как привычка к государственным переворотам укореняется гораздо раньше."
 RULE_OPTION_FIJ_EARLY_KINGDOM: "Корона возвращается раньше времени"
 RULE_OPTION_FIJ_EARLY_KINGDOM_DESC: "Кризис с заложниками в новом тысячелетии завершился §8Великий Совет вождей§! Возведение избранного короля на престол вместо возвращения к республиканской форме правления. Монархия восстанавливается на целое политическое поколение раньше, и второй кризис, который мог бы последовать, так и не происходит."
 RULE_OPTION_FRA_SOCIALIST: "Возвращение социалистов"
 RULE_OPTION_FRA_SOCIALIST_DESC: "Он §8Социалистическая партия§! Франция занимает Елисейский дворец и управляет страной, расширяя социальные программы, сокращая рабочее время и проводя более мягкую политику в отношении государственных расходов. Франция остается в НАТО и Европейском Союзе, но выступает за социальную Европу, а не за чисто либеральную."
 RULE_OPTION_FRA_LIBERAL: "Либеральный центр"
 RULE_OPTION_FRA_LIBERAL_DESC: "Центристская партия §8UDF§! и её преемница §8La République En Marche§! управляют страной, проводя политику дерегулирования, трудовой реформы и углубления европейского федерализма. Франция сильнее любой другой крупной державы стремится к созданию единого Союза."
 RULE_OPTION_FRA_GAULLIST: "Возрождение голлистского движения"
 RULE_OPTION_FRA_GAULLIST_DESC: "Он §8Собрание за Францию§! Возрождает голлистский суверенитет, ослабляя роль Франции как лидера НАТО и настаивая на независимой ядерной политике. Франция сохраняет свое место в Европейском альянсе, но отказывается следовать примеру Вашингтона."
 RULE_OPTION_FRA_GREEN: "Зелёная Республика"
 RULE_OPTION_FRA_GREEN_DESC: "§8Les Verts§! и их преемник §8Europe Écologie Les Verts§! приходят к власти и направляют государство к экологическому переходу, переосмысливая как атомную энергетику, так и тяжелую промышленность. Франция жертвует частью экономического роста ради того, чтобы стать самым громким голосом защитников окружающей среды в Европе."
 RULE_OPTION_FRA_FRANCE_UNBOWED: "Франция Непоколебимая"
 RULE_OPTION_FRA_FRANCE_UNBOWED_DESC: "§8La France Insoumise§! Франция приводит к власти радикальных левых, обещая Шестую республику и разрыв с европейской фискальной ортодоксией. Франция выступает против правил Союза и ищет партнеров за пределами западного блока."
 RULE_OPTION_FRA_NATIONAL_RALLY: "Национальный митинг"
 RULE_OPTION_FRA_NATIONAL_RALLY_DESC: "Он §8Национальный фронт§! и его преемник §8Национальное собрание§! Франция одержит полную победу на выборах в республику и будет править, придерживаясь политики ограничения иммиграции и национальных преференций. Франция будет добиваться выхода из ЕС из Брюсселя и сближаться с Москвой."
 RULE_OPTION_GRN_HISTORICAL: "Исторический"
 RULE_OPTION_GRN_HISTORICAL_DESC: "Гренландия получает самоуправление от Дании и направляет свои усилия на освоение земель, рыболовство, добычу полезных ископаемых и государственные услуги, а не на зарубежные авантюры. Арктика остается спокойной, а скандинавские соседи Гренландии сохраняют свои границы."
 RULE_OPTION_GRN_SCANDINAVIAN_SERENITY_DESC: "Гренландия объединяет Исландию, Фарерские острова, Данию, Норвегию, Швецию и Финляндию в один город. §8Северный Союз§!Затем маршрут останавливается на берегу Балтийского моря. Скандинавия говорит в один голос, и европейский порядок в целом остается таким, каким он был."
 RULE_OPTION_GRN_CONTINENTAL_HEGEMONY_DESC: "Гренландия перевозит свои §8Северный Союз§! на юг и восток до §8Замороженная Федерация§! Раскинулся по большей части Европы. Столицы континента подчиняются Нууку, и старый европейский порядок рухнул."
 RULE_OPTION_GRE_HISTORICAL: "Исторический"
 RULE_OPTION_GRE_HISTORICAL_DESC: "§8Новая демократия§! Афины выводят Грецию из долгового кризиса, используя политику жесткой экономии и евро, сокращая бюджет до минимума еще до начала восстановления. Афины еще глубже интегрируются в Европейский союз и НАТО, объединяя Кипр, Израиль и Францию ​​в единый фронт на востоке Средиземноморья."
 RULE_OPTION_GRE_COMMUNIST: "Красный Акрополь"
 RULE_OPTION_GRE_COMMUNIST_DESC: "В результате краха государство переходит в ведение... §8Коммунистическая партия Греции§!Греция принимает новую конституцию, национализирует банки и формирует Красную армию. Греция выходит из НАТО и организует коммунистический блок на Балканах, отстаивая свои претензии на Болгарию, Албанию, Северную Македонию, Сербию и Румынию."
 RULE_OPTION_GRE_NATIONALIST: "Золотая Заря"
 RULE_OPTION_GRE_NATIONALIST_DESC: "«Золотая Заря» (§8Golden Dawn§!) приходит к власти, переживая тот же крах, хоронит республику под диктатурой метаксиста и заставляет замолчать прессу и оппозицию. Греция возрождает «Великую идею» и предъявляет территориальные претензии к Албании, Болгарии, Северной Македонии и Турции."
 RULE_OPTION_GRE_MULTIPOLAR: "Поворот на восток"
 RULE_OPTION_GRE_MULTIPOLAR_DESC: "Республика выживает, но обращается против Европейского союза, налаживая отношения с Россией, Китаем и Ираном и продавая Пирей китайскому капиталу. Греция вступает в БРИКС и выходит из НАТО, меняя свое место в западном лагере на место в многополярном порядке."
 RULE_OPTION_GEO_HISTORICAL: "Исторический"
 RULE_OPTION_GEO_HISTORICAL_DESC: "Революция роз смела всё §8Союз граждан Грузии§! Михаил Саакашвили резко сближает страну с НАТО и Западом. Грузия проигрывает войну с Россией из-за отколовшихся республик, а затем мирным путем передает власть. §8Грузинская мечта§!."
 RULE_OPTION_GEO_SHEVARDNADZE_WEST: "Шеварднадзе выстоял"
 RULE_OPTION_GEO_SHEVARDNADZE_WEST_DESC: "Эдуард Шеварднадзе подавляет оппозицию, а не уступает ей, и §8Союз граждан Грузии§! Это позволяет стране оставаться на западном курсе, избегая революции. Грузия, тем не менее, остается авторитарным государством, заигрывающим с Брюсселем и Вашингтоном."
 RULE_OPTION_GEO_PRO_RUSSIAN: "Уступка Москве"
 RULE_OPTION_GEO_PRO_RUSSIAN_DESC: "Он §8Союз граждан Грузии§! Грузия заключает соглашение с Кремлем, оставляя российские базы на месте, а вопрос о отколовшихся республиках решается на условиях Москвы. Грузия переходит в Содружество Независимых Государств и выходит из западного лагеря."
 RULE_OPTION_GEO_NATIONALIST: "Возвращение Мхедриони"
 RULE_OPTION_GEO_NATIONALIST_DESC: "Возрожденные военизированные формирования §8Mkhedrioni§! захватывают власть в государстве, и Грузия стремится к созданию Великой Грузии, не зависящей ни от одного из блоков. Армения, Азербайджан и отколовшиеся республики становятся не соседями, а мишенями."
 RULE_OPTION_GEO_COMMUNIST: "Советская Республика восстановлена"
 RULE_OPTION_GEO_COMMUNIST_DESC: "Объединенная коммунистическая партия Грузии (§8United Communist Party of Georgia§!) возвращается к власти путем голосования или революции и вновь провозглашает Советскую республику. Грузия обращается к Армении и Азербайджану с целью восстановления Закавказской федерации."
 RULE_OPTION_GEO_UNITED_NATIONAL_MOVEMENT: "Национальное движение держится"
 RULE_OPTION_GEO_UNITED_NATIONAL_MOVEMENT_DESC: "История идет своим чередом к войне и последовавшему за ней урегулированию, но Саакашвили... §8Объединенное национальное движение§! Грузия сохраняет президентский пост, а не теряет его. Грузия усиливает свои позиции в отношении членства в НАТО и отвечает Москве открытой враждебностью."
 RULE_OPTION_GEO_GEORGIAN_PATRIOTS: "Альянс Патриотов"
 RULE_OPTION_GEO_GEORGIAN_PATRIOTS_DESC: "Послевоенное урегулирование происходит так, как происходит, а затем... §8Альянс Патриотов§! Грузия одерживает победу, опираясь на националистическую и социально-консервативную платформу. Грузия отворачивается от Брюсселя и возвращается на восток."
 RULE_OPTION_GEO_UNITED_GEORGIA: "Между Востоком и Западом"
 RULE_OPTION_GEO_UNITED_GEORGIA_DESC: "Послевоенное урегулирование происходит так, как происходит, а затем... §8Объединенная Грузия§! Грузия приходит к власти, проводя целенаправленную многовекторную внешнюю политику. Вместо того чтобы выбирать между ними, Грузия уравновешивает интересы Европейского союза, России и своих соседей."
 RULE_OPTION_GER_HISTORICAL: "Исторический"
 RULE_OPTION_GER_HISTORICAL_DESC: "Он §8Социал-демократическая партия§! правит в коалиции с §8Зелень§! и проталкивает трудовые реформы Хартца против собственной базы, а затем передает канцелярию в руки §8Христианско-демократический союз§! Для долгосрочного существования широкой коалиции Германия остается в составе НАТО и управляет Европейским союзом из своего центра."
 RULE_OPTION_GER_LIBERAL: "Либеральная Республика"
 RULE_OPTION_GER_LIBERAL_DESC: "Он §8Свободная демократическая партия§! Германия выходит из роли младшего партнера и выводит страну на путь свободных рынков, дерегулирования, приватизированной обороны и цифрового государства. Германия укрепляет свои связи с НАТО и открывает свои границы для тех, кто занимает лидирующие позиции в ее рейтинговой системе."
 RULE_OPTION_GER_POPULIST: "Альтернатива поднимается"
 RULE_OPTION_GER_POPULIST_DESC: "§8The Alternative§! выходит из маргинального круга и занимает позицию правительства по вопросам иммиграции, ислама, евроскептицизма и сомнений в отношении климата. Германия сближается с Москвой, одновременно разбирая Европейский союз изнутри."
 RULE_OPTION_ETH_DERG_RESTORATION: "Возвращение Дерга"
 RULE_OPTION_ETH_DERG_RESTORATION_DESC: "Эфиопия реабилитирует Менгисту Хайле Мариама и восстанавливает коммунистическое правление. §8Народная Демократическая Республика Эфиопия§!Страна поддерживает Китай и стремится к панафриканской коммунистической солидарности."
 RULE_OPTION_EST_HISTORICAL: "Исторический"
 RULE_OPTION_EST_HISTORICAL_DESC: "Партия реформ §8§! проводит радикальную дерегуляцию и вводит единое налогообложение, одновременно создавая цифровое государство на основе национальной онлайн-идентичности. Эстония вступает в НАТО и Европейский союз в качестве западного опорного пункта в Прибалтике и постоянного противовеса российскому влиянию."
 RULE_OPTION_EST_CONSERVATIVE: "Традиционная Эстония"
 RULE_OPTION_EST_CONSERVATIVE_DESC: "§8Исамаа§! Эстония вкладывает значительные средства в образование и благополучие семей, одновременно предоставляя льготные налоговые льготы для бизнеса и реализуя целевые программы по трудоустройству. Она сохраняет западный и проевропейский подход, но в социальном плане замыкается на себе, ужесточая иммиграционную политику и ставя сохранение культуры выше космополитизма."
 RULE_OPTION_EST_SOCIAL_DEMOCRATIC: "Скандинавская модель"
 RULE_OPTION_EST_SOCIAL_DEMOCRATIC_DESC: "Он §8Социал-демократическая партия§! Эстония строит социальное государство скандинавского типа на основе минимальной заработной платы, расширения прав и возможностей профсоюзов и государственных инвестиций в промышленность. Она сохраняет западную ориентацию, но присоединяется к Европе как социальная демократия, отстаивающая права трудящихся и равенство на рабочем месте."
 RULE_OPTION_EST_CENTRIST: "Восточное равновесие"
 RULE_OPTION_EST_CENTRIST_DESC: "Он §8Центристская партия§! Эстония отказывается от атлантической ориентации, возобновляет торговлю с Россией и налаживает отношения с русскоязычным меньшинством, одновременно добиваясь объединения с Латвией и Литвой. Эстония становится нейтральным мостом между Востоком и Западом, а Прибалтика теряет своего самого убежденного сторонника НАТО."
 RULE_OPTION_EST_NATIONALIST: "Эстония Первая"
 RULE_OPTION_EST_NATIONALIST_DESC: "§8ЭКРЕ§! Эстония захватывает власть, конфискует государственные ресурсы и очищает от общественной жизни проевропейские партии и их сторонников. Эстония выходит из европейской интеграции, активно перевооружается и предъявляет претензии на Латвию, Литву, Финляндию и Швецию, превращая Балтийский регион в очаг напряженности."
 CHE_AI_BEHAVIOR: "@CHE Чечня"
 RULE_OPTION_CHE_HISTORICAL: "Исторический"
 RULE_OPTION_CHE_HISTORICAL_DESC: "Вторая война заканчивается §8Ичкерия§! Чечня была разрушена, и республика вновь вошла в состав России под властью Кадыровых. Чечня обменяла независимость на деньги на восстановление и стала самым надежным инструментом Москвы на Кавказе."
 RULE_OPTION_CHE_CALIPHATE: "Кавказский Эмират"
 RULE_OPTION_CHE_CALIPHATE_DESC: "иностранный §8моджахеды§! Оттеснить светских сепаратистов и править тем, что осталось от республики, по шариату. Чечня становится убежищем для §8аль-Каида§! а также отправная точка для джихада на Кавказе и в самой России."
 RULE_OPTION_CHE_CAUCASUS_CONFEDERATION: "Конфедерация Кавказа"
 RULE_OPTION_CHE_CAUCASUS_CONFEDERATION_DESC: "Светские офицеры нарушают §8исламисты§! и восстановить Ичкерию как ядро ​​союза народов Северного Кавказа. Чечня опирается на Анкару и Баку, чтобы не допустить проникновения Москвы в горы."
 RULE_OPTION_CHE_WESTERN_ALIGNMENT: "Признание со стороны Запада"
 RULE_OPTION_CHE_WESTERN_ALIGNMENT_DESC: "Он §8исламисты§! Их вытесняют, и республика тратит свою независимость на то, чтобы добиваться признания в западных столицах, а не у союзников в горах. Чечня обеспечивает себе выживание демократическими регалиями и местом за столом переговоров с Европой."
 RULE_OPTION_CHE_SOCIALIST_CAUCASUS: "Красный Кавказ"
 RULE_OPTION_CHE_SOCIALIST_CAUCASUS_DESC: "§8Салман Радуев§!Фракция захватывает республику и объединяет ислам с советским порядком, который еще помнят горы. Чечня провозглашает Кавказскую социалистическую республику и заключает с Москвой соглашение на равных условиях, а не в качестве подданного."
 RULE_OPTION_IND_PARTY_OF_STRUGGLE: "Партия борьбы"
 RULE_OPTION_IND_PARTY_OF_STRUGGLE_DESC: "Он §8Индонезийская демократическая партия борьбы§! Индонезия приходит к власти как крупнейшая светская и националистическая сила страны, защищая религиозные меньшинства в спорных регионах и продвигая Панчасилу против радикализации. Индонезия переориентирует свою дипломатию на восток, в сторону Китая и России, одновременно создавая левонационалистический бастион по всему архипелагу."
 RULE_OPTION_IND_DEMOCRAT_PARTY: "Технократическое президентство"
 RULE_OPTION_IND_DEMOCRAT_PARTY_DESC: "Генерал-реформатор собирает технократических профессионалов в §8Демократическая партия§!Индонезия, отдавая приоритет экономическому росту, институциональной стабильности и доверию инвесторов, по-прежнему твердо ориентируется на Запад, являясь образцом профессионального и компетентного управления в Юго-Восточной Азии."
 RULE_OPTION_IND_UNITED_DEVELOPMENT: "Объединенный фронт развития"
 RULE_OPTION_IND_UNITED_DEVELOPMENT_DESC: "Он §8Объединенная партия развития§!Индонезия, укоренившаяся в сетях исламского истеблишмента Нового порядка, захватывает государство и управляет им посредством патронажа, личных связей и консенсуса элиты, а не путем структурных реформ. Индонезия сохраняет свою связь с Западом, в то время как исламская идентичность углубляется благодаря неформальным властным структурам и транзакционной политике."
 RULE_OPTION_IND_PROSPEROUS_JUSTICE: "Движение за процветающую справедливость"
 RULE_OPTION_IND_PROSPEROUS_JUSTICE_DESC: "Он §8Партия процветающей справедливости§!Исламистское движение, отличающееся дисциплинированностью и построенное на борьбе с коррупцией и мобилизации населения на местах, захватывает власть и разрушает патронажные сети, существовавшие со времен Реформации. Враждебно настроенная к западному влиянию и социально консервативная, Индонезия ориентируется на Восток как независимый игрок, находящийся вне как либерального порядка, так и старой элиты."
 RULE_OPTION_JAP_NORMAL_NATION: "Нормальная нация"
 RULE_OPTION_JAP_NORMAL_NATION_DESC: "Либеральные демократы §8§! сокращают финансирование, предусмотренное статьей девять, до тех пор, пока Силы самообороны не будут внесены в конституцию как армия, подобная любой другой. Япония перевооружается внутри американского альянса и начинает отвечать Пекину и Пхеньяну от своего имени."
 RULE_OPTION_JAP_SOCIAL_DEMOCRACY: "Вторая послевоенная"
 RULE_OPTION_JAP_SOCIAL_DEMOCRACY_DESC: "Демократическая партия Японии (§8Democratic Party§!) сломила консервативное господство в парламенте и правит страной, опираясь на прозрачность, трудовое законодательство и открытые двери для иностранных рабочих. Япония тратит свои силы на рождаемость, офисных работников и коррупцию, пережившую экономический пузырь, а не на развитие региона."
 RULE_OPTION_JAP_PACIFIST: "Конституция мира"
 RULE_OPTION_JAP_PACIFIST_DESC: "Он §8Социал-демократы§! Принятие решения парламентом на основании обещания, что статья девять будет выполнена в точности, приведет к прекращению экспорта оружия, ликвидации военных баз и, наконец, Сил самообороны. Япония разорвет договор о безопасности с Вашингтоном и окажется безоруженной между Китаем и Кореей."
 RULE_OPTION_HKG_HISTORICAL: "Исторический"
 RULE_OPTION_HKG_HISTORICAL_DESC: "Он §8пропекинский лагерь§! сохраняет курс Специального административного района на развитие Пекина, восстанавливая его. §8Законодательный совет§! В окружении патриотов внедряется патриотическое воспитание в школах, а кантонская гражданская жизнь приходит в упадок. За этим следуют его деньги: Гонконг становится офшорным центром юаня и финансистом... §8Пояс и дорога§!и §8Район Большого залива§! проглатывает то, что §8Основной закон§! обещано."
 RULE_OPTION_HKG_INDEPENDENCE: "Наша собственная нация"
 RULE_OPTION_HKG_INDEPENDENCE_DESC: "Гонконг разрывает марионеточный режим, пишет собственную конституцию и формирует армию и авианосный флот для её защиты. Затем он выдвигает ирредентистские претензии на дельту Жемчужной реки, бросая вызов Пекину, требуя от него ответа за провинцию Гуандун."
 RULE_OPTION_HKG_BRITISH: "Снова под короной"
 RULE_OPTION_HKG_BRITISH_DESC: "Гонконг выходит из-под китайского суверенитета и просит Лондона вернуть его себе, предоставляя Соединенному Королевству права на размещение гарнизона и присоединяясь к... §8АУКУС§! Обмен информацией и законодательное закрепление всеобщего избирательного права и независимой судебной системы. §8Содружество§! Наличие государства у границ Китая дает Западу демократический плацдарм, который Пекин десятилетиями пытался закрыть."
 RULE_OPTION_HKG_CITY_STATE: "Свободный город"
 RULE_OPTION_HKG_CITY_STATE_DESC: "Гонконг переписывает §8Основной закон§! Обладая собственной властью, она содержит береговые силы обороны вместо армии и является финансовой столицей Восточной Азии. Не подчиняясь ни одному блоку, она торгует как с Пекином, так и с Вашингтоном и не отчитывается ни перед одним из них."
 EGY_AI_BEHAVIOR: "@EGY Египет"
 RULE_OPTION_EGY_HISTORICAL: "Исторический"
 RULE_OPTION_EGY_HISTORICAL_DESC: "Египет управляет §8Национальная демократическая партия§! пока площадь не опустеет, передаст один срок §8«Братья-мусульмане»§!а затем возвращает президентский пост своим генералам. Мир с Израилем сохраняется, американская помощь продолжает поступать, и Каир выступает в защиту арабского порядка, а не против него."
 RULE_OPTION_EGY_BROTHERHOOD: "Братство держится"
 RULE_OPTION_EGY_BROTHERHOOD_DESC: "Египет сохраняет свою избранную палату §8«Братья-мусульмане»§! Правительство подкупает чиновников вместо того, чтобы проводить чистки, и пишет исламистскую конституцию, которую суды не могут отменить. Каир сближается с Анкарой, Дохой и Хамасом, а монархии Персидского залива воспринимают его как угрозу."
 RULE_OPTION_EGY_PAN_ARAB: "Наследники Насера"
 RULE_OPTION_EGY_PAN_ARAB_DESC: "Египет возвращает §8Национальный фронт§! Приходит к власти, национализирует господствующие высоты и возрождает Объединенную Арабскую Республику. Каир налаживает отношения с Дамаском, Багдадом и Триполи, но отворачивается от Вашингтона."
 RULE_OPTION_EGY_SALAFIST: "Салафитский поворот"
 RULE_OPTION_EGY_SALAFIST_DESC: "Египет выставляет §8Партия Аль-Нур§! В президентском дворце приостанавливают выборы и устанавливают правление на основе религиозных законов. Шариат управляет коптами как защищенным меньшинством, а Синайская кампания превращается в священную войну."
 RULE_OPTION_EGY_COPTIC: "Коптское господство"
 RULE_OPTION_EGY_COPTIC_DESC: "Египет захвачен §8Коптская церковь§! и его союзников из числа мирян, которые претендуют на фараонское наследие над арабским. Каир защищает христиан от Палестины до Ассирии и оказывается изолированным в собственном регионе."
 HEZ_AI_BEHAVIOR: "@HEZ Хезболла"
 RULE_OPTION_HEZ_HISTORICAL: "Исторический"
 RULE_OPTION_HEZ_HISTORICAL_DESC: "§8Hezbollah§! участвует в выборах как партия, сохраняет §8Taabia§! партизанскую армию, с которой воевала против Израиля, и поддерживает §8Ливанская вооруженная сила§! вместо того, чтобы заменить ее. Она воюет вместе с Дамаском, §8Иракскими шиитскими ополчениями§! и §8Houthis§!, оставаясь при этом государством в составе ливанского государства."
 RULE_OPTION_HEZ_LAND_OF_GOD: "Земля Божья"
 RULE_OPTION_HEZ_LAND_OF_GOD_DESC: "§8Hezbollah§! отделяется от Ливана и создает признанное исламское государство на юге страны и в районе Бекаа, налаживая отношения с союзниками и повышая уровень жизни в управляемых им деревнях. Оно формирует экспедиционные силы и внешнюю разведывательную службу, превращая ливанскую фракцию в самостоятельную региональную силу."
 RULE_OPTION_HEZ_CONQUER_LEBANON: "Мастера Ливана"
 RULE_OPTION_HEZ_CONQUER_LEBANON_DESC: "§8Hezbollah§! вооружает перебежчиков из §8Ливанцевских Вооруженных Сил§! и захватывает Ливан открытой войной, а не путем голосования. Финансирование кампании осуществляется иранскими деньгами, заводами и дорогами, а также аннексируется в Исламскую Республику, подотчетную Тегерану."
 RULE_OPTION_HEZ_GLOBAL_RESISTANCE: "Экспортируйте революцию"
 RULE_OPTION_HEZ_GLOBAL_RESISTANCE_DESC: "§8Hezbollah§! удерживает свои позиции в Ливане и вкладывает деньги в зарубежные сети, от §8Исламского движения§! в Западной Африке до диаспоры и маршрутов картелей, идущих из Венесуэлы. Она создает ячейки и ополчения внутри самой Северной Америки, распространяя войну далеко за пределы Леванта."
 IRQ_AI_BEHAVIOR: "@IRQ Ирак"
 RULE_OPTION_IRQ_HISTORICAL: "Исторический"
 RULE_OPTION_IRQ_HISTORICAL_DESC: "Ирак находится под властью Саддама Хусейна. §8Партия Баас§! до тех пор, пока американское вторжение не свергнет режим; затем из Багдада будет править оккупационное правительство, а власть перейдет к шиитским религиозным партиям. §8Исламский дава§!Ирак в итоге становится республикой, спонсируемой США, но тем не менее попадает в дипломатическую орбиту Ирана."
 RULE_OPTION_IRQ_BAATHIST_STATE: "Партия Баас продолжает существовать"
 RULE_OPTION_IRQ_BAATHIST_STATE_DESC: "Он §8Партия Баас§! переживает американское вторжение, прорывает режим санкций, улаживает вопрос о преемственности внутри семьи и возобновляет свои претензии на Кувейт, курдские регионы и иранский Хузестан. Персидский залив живет рядом с нерушимой связью. §8баасисты§! Ирак оказывает давление на своих соседей и заявляет о своих панарабских амбициях."
 RULE_OPTION_IRQ_SHIA_THEOCRACY: "Правление юристов"
 RULE_OPTION_IRQ_SHIA_THEOCRACY_DESC: "Шиитские клерикальные партии и §8Организация Бадр§! Захватить постоккупационное государство и построить республику, управляемую юристами, союзными Тегерану. Багдад становится западным центром иранской оси, простирающейся до Дамаска и Бейрута."
 RULE_OPTION_IRQ_SADRIST: "Прилив садристов"
 RULE_OPTION_IRQ_SADRIST_DESC: "Движение Муктады ас-Садра (§8Muqtada al-Sadr§!) зарождается в трущобах Багдада, вытесняет американцев и правит как шиитская популистская и иракская националистическая сила, которая отвергает иранское и американское покровительство. Ирак замыкается в себе и становится враждебным ко всем иностранным покровителям."
 RULE_OPTION_IRQ_SECULAR_REPUBLIC: "Светская Республика"
 RULE_OPTION_IRQ_SECULAR_REPUBLIC_DESC: "Светская оппозиция §8Иракский национальный конгресс§! и §8Иракское национальное соглашение§! Создает конституцию, ставящую во главу угла секту и этническую принадлежность, и сохраняет единство государства как арабской республики, а не как религиозной. Ирак возвращается к арабскому порядку как светское государство, ориентированное на Запад."
 RULE_OPTION_IRQ_COMMUNIST: "Социалистический Ирак"
 RULE_OPTION_IRQ_COMMUNIST_DESC: "Он §8Иракская коммунистическая партия§! выходит из-под земли, где оно обитало с тех пор, как §8баасисты§! Проводит чистки, завоевывает расположение рабочих, женщин и курдов и устанавливает республику. Ирак становится социалистическим государством посреди нефтяных монархий."
 RAJ_AI_BEHAVIOR: "@RAJ Индия"
 RULE_OPTION_RAJ_HISTORICAL: "Исторический"
 RULE_OPTION_RAJ_HISTORICAL_DESC: "Индия поочередно передает власть между §8Бхаратия Джаната Парти§! и §8Индийский национальный конгресс§!поддержание экономической либерализации и приверженность §8БРИКС§! и многополярную, неприсоединившуюся внешнюю политику. Индия поддерживает связи как с Вашингтоном, так и с Москвой, одновременно утверждая себя в качестве важного игрока в развивающемся мире."
 RULE_OPTION_RAJ_GREATER_INDIA: "Великая Индия"
 RULE_OPTION_RAJ_GREATER_INDIA_DESC: "К власти приходит националистический фронт «Хиндутва», устанавливающий внутри страны индуистское большинство, сохраняя при этом кастовую иерархию и лишая меньшинства защиты. Индия прибегает к автаркии, изоляции и территориальным претензиям на Непал, Бутан и Бангладеш, создавая авторитарный общеиндийский режим."
 RULE_OPTION_RAJ_RED_REPUBLIC: "Красная Республика"
 RULE_OPTION_RAJ_RED_REPUBLIC_DESC: "Он §8Коммунистическая партия Индии§! Индия приходит к власти, национализирует экономику и возвращается к пятилетнему планированию, одновременно сближаясь с Китаем и отказываясь от претензий на Аксай-Чин. Индия экспортирует революцию по всей Южной Азии, становясь радикальным социалистическим авангардом в регионе."
 RULE_OPTION_RAJ_PEOPLES_FRONT: "Народный фронт"
 RULE_OPTION_RAJ_PEOPLES_FRONT_DESC: "Он §8Партия Бахуджан Самадж§! и §8Самаджвади Парти§! Индия формирует коалицию далитов и социалистов, демонтирует кастовые привилегии и перераспределяет богатство в обществе. Индия строит социальное государство по скандинавскому образцу, сохраняя при этом свою неприсоединительную внешнюю политику."
 RULE_OPTION_RAJ_WESTERN_ALIGNMENT: "Союзник Запада"
 RULE_OPTION_RAJ_WESTERN_ALIGNMENT_DESC: "Индия сближается с Францией и Израилем, становясь крупным союзником США вне НАТО и углубляя военное и торговое сотрудничество с Вашингтоном. Индия признает Тайвань и в конечном итоге вступает в НАТО, укрепляя свои позиции в западном альянсе."
 RULE_OPTION_LBA_HISTORICAL: "Исторический"
 RULE_OPTION_LBA_HISTORICAL_DESC: "Каддафи подавляет §8Ливийская исламская боевая группировка§!Ливия отказывается от своей программы вооружений и ведет переговоры о выходе из-под действия международных санкций. В конечном итоге режим падает под натиском восстания, и Ливия переходит под контроль военного лидера, командующего войсками. §8Ливийская национальная армия§!."
 RULE_OPTION_LBA_ISLAMIC_CALIPHATE: "Исламский халифат"
 RULE_OPTION_LBA_ISLAMIC_CALIPHATE_DESC: "Каддафи терпит §8Ливийская исламская боевая группировка§!, который убивает его и устанавливает салафитское государство. Ливия становится базой для джихада в Сахеле, дестабилизируя Чад, Нигер, Нигерию, Алжир, Мали и Мавританию."
 RULE_OPTION_LBA_LIBYAN_REPUBLIC: "Ливийская Республика"
 RULE_OPTION_LBA_LIBYAN_REPUBLIC_DESC: "Ливия пересматривает «Зеленую книгу», расширяет полномочия народных конгрессов и легализует политические партии. Государство трансформируется в президентскую республику, где на смену прямой демократии Каддафи приходит конкурентная политика."
 RULE_OPTION_LBA_ANTI_COLONIAL_UNION: "Антиколониальный союз"
 RULE_OPTION_LBA_ANTI_COLONIAL_UNION_DESC: "Каддафи остаётся и строит §8Антиколониальный союз§!Ливия, вооружая повстанческие движения по всей Африке и на Ближнем Востоке, становится центром революционных движений, дестабилизируя своих соседей и сея хаос на двух континентах."
 RULE_OPTION_LBA_UNITED_ARAB_REPUBLIC: "Объединенная Арабская Республика"
 RULE_OPTION_LBA_UNITED_ARAB_REPUBLIC_DESC: "Каддафи остаётся и сотрудничает с §8Баасисты§! построить §8Объединенная Арабская Республика§!Ливия превращается в панарабское государство, простирающееся от Мавритании до Йемена, что меняет геополитику арабского мира."
 RULE_OPTION_LBA_UNITED_STATES_OF_AFRICA: "Соединенные Штаты Африки"
 RULE_OPTION_LBA_UNITED_STATES_OF_AFRICA_DESC: "Каддафи остаётся и стремится к континентальному господству §8Соединенные Штаты Африки§! с ним во главе государства. Ливия становится столицей африканской сверхдержавы, что трансформирует весь политический порядок континента."
 ISR_AI_BEHAVIOR: "@ISR Израиль"
 RULE_OPTION_ISR_HISTORICAL: "Исторический"
 RULE_OPTION_ISR_HISTORICAL_DESC: "§8Likud§! захватывает страну после провала мирных переговоров, подавляет вторую интифаду за разделительным барьером и выводит поселенцев из Газы. Израиль остается привязанным к Вашингтону, нормализует отношения с арабскими странами Персидского залива и рассматривает Иран как угрозу, определяющую все остальное."
 RULE_OPTION_ISR_PEACE_PROCESS: "Лагерь мира"
 RULE_OPTION_ISR_PEACE_PROCESS_DESC: "Партия §8Labour§! управляет страной совместно с §8Meretz§! и арабскими партиями и всерьез ведет переговоры о создании двух государств. Палестинская автономия вооружена как партнер, а не как подозреваемый, а сектору Газа предоставляются действующий порт и аэропорт."
 RULE_OPTION_ISR_SECULAR_CENTRE: "Светский центр"
 RULE_OPTION_ISR_SECULAR_CENTRE_DESC: "§8Yesh Atid§!, §8Blue and White§! и §8New Hope§! выводят страну и возвращают религию из-под контроля государства. Суды защищены, призыв на военную службу переписан, а Израиль сближается с Европой и ОЭСР."
 RULE_OPTION_ISR_GREATER_ISRAEL: "Великий Израиль"
 RULE_OPTION_ISR_GREATER_ISRAEL_DESC: "§8Otzma Yehudit§! и §8Religious Zionism§! захватывают власть и разрушают остатки Ословского соглашения. Поселения консолидируются и аннексируются, статус-кво на Храмовой горе переписывается, и армия наносит удар на север, прежде чем на нее нанесут удар."
 RULE_OPTION_ISR_LOOK_EAST: "Повернитесь на восток."
 RULE_OPTION_ISR_LOOK_EAST_DESC: "А §8Ликуд§! Правительство отходит от Вашингтона, сдавая в аренду порт Хайфы китайским операторам и продавая оружие и технологии Пекину. Израиль склоняется к Москве, а не к Киеву, и западный альянс, который гарантировал это, начинает выглядеть условным."
 RULE_OPTION_MNT_HISTORICAL: "Исторический"
 RULE_OPTION_MNT_HISTORICAL_DESC: "Фракция §8Đukanović§! ведет Черногорию в ЕС и НАТО, одновременно укрепляя олигархический контроль над государственными институтами и экономикой. Черногория становится небольшой страной, ориентированной на Запад, институты которой остаются тесно связанными с организованной преступностью и сетями политического патронажа."
 RULE_OPTION_MNT_EUROPEAN_REFORM: "Реформистский путь"
 RULE_OPTION_MNT_EUROPEAN_REFORM_DESC: "Демократические и социал-демократические партии свергают олигархов и добиваются вступления в ЕС, проводя при этом агрессивные антикоррупционные реформы и ликвидируя патронажные сети. Черногория становится подлинной либеральной демократией, где государственные институты функционируют без организованной преступности и олигархического господства."
 RULE_OPTION_MNT_MONARCHIST_RESTORATION: "Реставрация монархии"
 RULE_OPTION_MNT_MONARCHIST_RESTORATION_DESC: "Черногорский §8монархисты и традиционалисты§! Черногория стремится восстановить династию Петровичей-Ньегошей и утвердить православное христианство в качестве государственной религии. Вместо интеграции в европейские структуры Черногория проводит ориентированную на Россию, церковно-центрированную реставрацию."
 RULE_OPTION_MNT_SOCIALIST_REVIVAL: "Социалистическое возрождение"
 RULE_OPTION_MNT_SOCIALIST_REVIVAL_DESC: "А §8коммунистическое и неоюгославское движение§! Черногория захватывает власть, национализирует экономику по титовскому образцу и способствует восстановлению панъюгославских политических структур. Она пытается возродить югославскую федерацию за счет своей территории, стремясь объединить южнославянские народы под социалистическим правлением."
 RULE_OPTION_PER_HISTORICAL: "Исторический"
 RULE_OPTION_PER_HISTORICAL_DESC: "Исламская Республика существует под властью Верховного Лидера, при этом президентский пост переходит от реформистского к княжескому лагерю и обратно. Иран является опорой Оси Сопротивления, продвигает свою ядерную программу через каждый раунд санкций и проецирует свою силу через союзные ополчения от Ливана до Йемена."
 RULE_OPTION_PER_RESTORATION: "Павлиний трон"
 RULE_OPTION_PER_RESTORATION_DESC: "Изгнанник §8Конституционалистская партия§! приносит §8Пахлави§! Династия возвращается домой и коронует Резу Пахлави II над светским королевством. Клерикальный порядок свергается, и Иран поворачивает на Запад, отказываясь от сети марионеток, которую он строил целое поколение."
 RULE_OPTION_PER_IRANIC_FEDERATION: "Иранская федерация"
 RULE_OPTION_PER_IRANIC_FEDERATION_DESC: "Паниранская партия (§8Pan-Iranist Party§!) приходит к власти и стремится объединить иранские народы Таджикистана, Курдистана, Азербайджана и Белуджистана в единую федерацию. Иран становится центром новой иранской сферы влияния, и границы каждого соседа, владеющего иранскими землями, оказываются под вопросом."
 RULE_OPTION_PER_MOJAHEDIN: "Народные моджахеды"
 RULE_OPTION_PER_MOJAHEDIN_DESC: "Моджахеды-е Халк (§8Mojahedin-e Khalq§!) возвращаются из ссылки под руководством Марьям Раджави и захватывают государство у духовенства. Иран провозглашается народной республикой, не имеющей никакого отношения к старой революции, и его внешняя политика восстанавливается с нуля."
 RULE_OPTION_PER_FREEDOM_MOVEMENT: "Движение за свободу"
 RULE_OPTION_PER_FREEDOM_MOVEMENT_DESC: "Движение за свободу Ирана (§8Freedom Movement of Iran§!) унаследовало обломки клерикального правления и построило светскую конституционную республику, оставив веру на усмотрение личной совести. Революционная гвардия была отстранена от политики и бизнеса, и Иран вновь открылся Западу как обычное государство."
 RULE_OPTION_PER_NATIONAL_FRONT: "Национальный фронт"
 RULE_OPTION_PER_NATIONAL_FRONT_DESC: "Он §8Национальный фронт§! Возвращается в качестве наследника Моссадега и восстанавливает Иран на основе светского национализма и нефти, растраченной революцией. Он придерживается политики неприсоединения, не сближаясь ни с Вашингтоном, ни с Москвой, и возвращает технократов к работе."
 RULE_OPTION_PER_GREEN_MOVEMENT: "Зелёное движение"
 RULE_OPTION_PER_GREEN_MOVEMENT_DESC: "Он §8Зеленое движение§! Мир-Хоссейн Мусави приходит к власти, обещая, что результаты голосования наконец-то будут подсчитаны. Иран остается исламской республикой, но подотчетен своему электорату, а регион лишается Верховного лидера как источника информации."
 RULE_OPTION_PER_MONTAZERI: "Республика Монтазери"
 RULE_OPTION_PER_MONTAZERI_DESC: "Реформистское духовенство вокруг §8Великий аятолла Монтазери§! Верните семинарии у сторонников жесткой линии и наконец ответьте за тюрьмы. Вера сохранит свое место в штате, хотя и смягчена человеком, который всю свою жизнь осуждал то, что делалось от ее имени."
 RULE_OPTION_PER_AHMADINEJAD: "Возвращение Ахмадинеджада"
 RULE_OPTION_PER_AHMADINEJAD_DESC: "Махмуд Ахмадинеджад (§8Mahmoud Ahmadinejad§!) собирает радикальных популистов, выплачивает пособия бедным из нефтяного бюджета и бросает вызов всему миру, предлагая остановить его. «Басидж» и «Ансар-е Хезболла» становятся государственным оружием внутри страны, а конфронтация за рубежом становится не ценой, а целью."
 RULE_OPTION_PER_GHALIBAF: "Орден Галибафа"
 RULE_OPTION_PER_GHALIBAF_DESC: "§8Мохаммед Багер Галибаф§! правит как командующий, который добивается результатов, обменивая политическую свободу на дороги, порядок и эффективность. Революционная гвардия сохраняет свою бизнес-империю, пресса — под контролем, а Тегеран добивается от Москвы капитала для финансирования своих проектов."
 RULE_OPTION_PER_MASHAEI: "Иранская школа Машаи"
 RULE_OPTION_PER_MASHAEI_DESC: "§8Esfandiar Rahim Mashaei§! ставит интересы нации выше веры и проповедует Иран, которому не нужно духовенство, стоящее между ним и Богом. Семинарии как политическая сила разрушены, и государство экспортирует иранский национализм, а не шиитский ислам."
 RULE_OPTION_PER_WORKERS_REPUBLIC: "Рабочая Республика"
 RULE_OPTION_PER_WORKERS_REPUBLIC_DESC: "Он §8Партия Туде§! Иранские левые возвращаются из изгнания и провозглашают рабочую республику. Духовенство и Корпус стражей исламской революции распускаются одновременно, и Иран ищет союзников среди оставшихся в мире социалистических государств."
 RULE_OPTION_PER_ARTESH: "Директорат Артеш"
 RULE_OPTION_PER_ARTESH_DESC: "Организация §8Artesh§! распускает остатки гражданского правительства и управляет страной через собственное управление, состоящее из собственных офицеров. Идеология уступает место грубым государственным интересам, и Иран взаимодействует со своими соседями как солдат, а не как революционер."
 RULE_OPTION_HOL_OPEN_VERDICT: "Открытый вердикт"
 RULE_OPTION_HOL_OPEN_VERDICT_DESC: "В Нидерландах используется тот же парламентский подход, но ничего не планируется заранее: коалицию формирует та партия, которая победит на выборах. §8популисты§! Включая. Его союзники никогда точно не знают, с каким правительством в Гааге им придется иметь дело в следующий раз."
 RULE_OPTION_NIG_HISTORICAL: "Исторический"
 RULE_OPTION_NIG_HISTORICAL_DESC: "Он §8Народно-демократическая партия§! Нигерия удерживает федеральный центр, поддерживая непрочное религиозное равновесие между севером и югом, в то время как амнистия, а не насилие, урегулирует ситуацию в дельте Нигера. Нигерия остается опорой Западной Африки, экспортируя миротворцев, а не создавая нестабильность."
 RULE_OPTION_NIG_SOCIAL_DEMOCRACY: "Социал-демократическая Нигерия"
 RULE_OPTION_NIG_SOCIAL_DEMOCRACY_DESC: "Он §8Всенигерийская народная партия§! Это ослабляет влияние правящей партии и направляет федерацию к развитию государственной промышленности, общественного здравоохранения и широкой системы социальной защиты. В Абудже, ориентированной на перераспределение доходов, нефтяные доходы тратятся внутри страны, а иностранные инвесторы ищут возможности в других регионах."
 RULE_OPTION_NIG_CHRISTIAN_NATION: "Христианская Нигерия"
 RULE_OPTION_NIG_CHRISTIAN_NATION_DESC: "Абуджа отменяет шариат в северных штатах и ​​перестраивает федеральное правительство вокруг... §8церковь§!, вербуя христианские ополчения против сопротивляющихся проповедников. Север умиротворяется силой, а не путем переговоров, и мусульманские соседи Нигерии становятся холодными."
 RULE_OPTION_NIG_CALIPHATE: "Западноафриканский халифат"
 RULE_OPTION_NIG_CALIPHATE_DESC: "Шариат распространяется из северных штатов до §8Боко Харам§! Вместо того чтобы бороться с правительством, Нигерия занимает выжидательную позицию, и федеративная республика уступает место халифату. Соседи Нигерии сталкиваются с экспансионистским исламским государством, обладающим крупнейшей армией в Западной Африке."
 RULE_OPTION_BRM_HISTORICAL: "Исторический"
 RULE_OPTION_BRM_HISTORICAL_DESC: "Он §8Национальная лига за демократию§! вступает в должность, в то время как §8Татмадау§! Мьянма сохраняет зарезервированные места и министерства обороны, а рохинджа подвергаются давлению, а не изгнанию. Мьянма остается в составе АСЕАН, этнические восстания продолжаются, и генералы не теряют ничего, что не могли бы вернуть."
 RULE_OPTION_BRM_BEACON_OF_DEMOCRACY: "Маяк демократии"
 RULE_OPTION_BRM_BEACON_OF_DEMOCRACY_DESC: "Он §8Национальная лига за демократию§! Упраздняет конституционную роль военных и строит федеративное государство с этнической автономией и гражданством рохинджа. Мьянма становится многоэтнической федеративной демократией и переходит к региональному партнерству."
 RULE_OPTION_BRM_AN_IRON_FIST: "Железный кулак"
 RULE_OPTION_BRM_AN_IRON_FIST_DESC: "Он §8Татмадау§! Мьянма ужесточает военное правление и подавляет оппозицию, подавляет этнические восстания и отвергает международное давление в пользу демократических реформ. Мьянма выходит из АСЕАН, изгоняет рохинджа и вступает в конфронтацию со своими соседями."
 RULE_OPTION_NRY_HISTORICAL: "Исторический"
 RULE_OPTION_NRY_HISTORICAL_DESC: "Центристская коалиция уступает место, и партия §8Labour§! возвращает себе власть, направляя нефтяной фонд на социальное государство и сохраняя Норвегию в составе альянса. Осло строит свою карьеру на мирных переговорах и помощи в развитии, оставаясь вне Европейского союза, к которому присоединились его соседи."
 RULE_OPTION_NRY_CHRISTIAN_PEOPLES_DESC: "Он §8Христианская народная партия§! Норвегия сохраняет пост премьер-министра и закрепляет в национальной политике принципы семейной морали, помощь в развитии и щедрую квоту на беженцев. Норвегия проводит учения совместно с альянсом, но держится на расстоянии от Брюсселя, принимая мигрантов, которых не могут принять ее южные соседи."
 RULE_OPTION_NRY_PROGRESS_DESC: "Партия прогресса §8§! выходит из оппозиции и тратит нефтяные богатства на снижение налогов, больничные палаты и уход за пожилыми людьми, а не на иностранную помощь. Норвегия централизует экономику, ужесточает иммиграционное законодательство и становится более холодной по отношению к скандинавским соседям, которые когда-то на нее рассчитывали."
 RULE_OPTION_NKO_HISTORICAL: "Исторический"
 RULE_OPTION_NKO_HISTORICAL_DESC: "Младшего сына Ким Чен Ира готовят в качестве преемника, и он наследует государство, а §8Трудовая партия Кореи§! подтверждает свой контроль над генералами, прежде чем принять решение §8Бёнджин§!Боеголовки и товары народного потребления одновременно. Династия держится, торговцев терпят, но им никогда не доверяют, а полуостров остается замороженным там, где его оставило перемирие."
 RULE_OPTION_NKO_KIM_JONG_NAM: "Наследник реформаторов"
 RULE_OPTION_NKO_KIM_JONG_NAM_DESC: "Изгнанный старший брат одерживает победу в борьбе за престолонаследие и меняет ход событий. §8Трудовая партия Кореи§! к открытию по китайскому образцу, торговле §8Чучхе§! для создания специальных экономических зон, совместных предприятий и, в конечном итоге, голосования. Пхеньян обменивает изоляцию на инвестиции, а у Сеула наконец-то появляется сосед, с которым он может вести переговоры."
 RULE_OPTION_NKO_MILITARY_JUNTA: "Генералы берут власть в свои руки."
 RULE_OPTION_NKO_MILITARY_JUNTA_DESC: "Генеральный штаб отказывает обоим наследникам Кима и захватывает власть сам, сохраняя за собой контроль над ситуацией. §8Сонгун§! и чистка семей, которые перестали быть полезными. Китайская торговля обеспечивает страну продовольствием, в то время как армия не подчиняется ни одной партии, и каждый сосед должен планировать свою деятельность с учетом ядерного государства, управляемого солдатами."
 RULE_OPTION_POL_HISTORICAL: "Исторический"
 RULE_OPTION_POL_HISTORICAL_DESC: "Польша завершает переходный период под руководством посткоммунистических левых, вступает в Европейский союз, а затем передает страну в руки... §8Право и справедливость§!Варшава, которая правит в противовес Москве и оказывает давление на Вашингтон, становится самым громким голосом на Востоке в НАТО и постоянным источником раздражения для Берлина и Брюсселя."
 RULE_OPTION_POL_CIVIC_PLATFORM: "Годы гражданской платформы"
 RULE_OPTION_POL_CIVIC_PLATFORM_DESC: "§8Гражданская платформа§! контролирует правительство и ставит будущее Польши на карту, опираясь на евро, немецкие инвестиции и связанные с ними средства. Варшава становится самым надежным партнером Брюсселя в регионе и при этом сохраняет свою позицию по отношению к Москве."
 RULE_OPTION_POL_WALESA: "Возвращение Валенсы"
 RULE_OPTION_POL_WALESA_DESC: "Христианские демократы §8§! несут Леха Валенсу обратно в президентский дворец в память о «Солидарности». Польша остается в НАТО и тратит свои кредиты на восстановление армии, а не на следование европейскому мейнстриму."
 RULE_OPTION_POL_KORWIN_COMMONWEALTH: "Корвин и Содружество"
 RULE_OPTION_POL_KORWIN_COMMONWEALTH_DESC: "Януш Корвин-Микке и Союз реальной политики §8§! сводят государство к его основам и заигрывают с Литвой, Беларусью и Украиной как с равными. Возрождающееся Содружество растет между Германией и Россией, не выходя при этом из западного альянса."
 RULE_OPTION_POL_KORWIN_EAST: "Корвин поворачивает на восток"
 RULE_OPTION_POL_KORWIN_EAST_DESC: "Януш Корвин-Микке и Союз реальной политики §8§! улаживают старые счета Польши, напрямую взаимодействуя с Москвой и Минском. Варшава выходит из западного лагеря, заявляет свои претензии на Львов и занимает свое место в ОДКБ."
 RULE_OPTION_POL_FALANGA: "Возвышение Фаланги"
 RULE_OPTION_POL_FALANGA_DESC: "Уличные ополчения и единый националистический фронт несут §8Фаланга§! Из периферии в правительство. Польша выходит из Европейского союза и НАТО, чтобы стать конфессиональным, милитаризованным государством, которое дестабилизирует всех своих соседей."
 RULE_OPTION_POL_RED_DREAM: "Красная мечта"
 RULE_OPTION_POL_RED_DREAM_DESC: "Вторая революция ставит §8Польская социалистическая партия§! Польша берет на себя управление и хоронит приватизацию переходного периода. Польша разрывает отношения с Западом, приостанавливает выборы и перестраивается в рабочую республику."
 RULE_OPTION_POL_PEOPLES_ARMY: "Народная армия"
 RULE_OPTION_POL_PEOPLES_ARMY_DESC: "Сторонники жесткой линии §8Союз польских коммунистов§! Воспользоваться преимуществами революции и восстановить Народную армию как основу государства. Польша становится гарнизоном нового восточного блока и смотрит на Запад с открытой враждебностью."
 RULE_OPTION_ROM_HISTORICAL: "Исторический"
 RULE_OPTION_ROM_HISTORICAL_DESC: "Он §8Социал-демократическая партия§! Под руководством Илиеску и Настасе Румыния борется с повсеместной коррупцией, создавая новое антикоррупционное управление, одновременно приватизируя промышленность и восстанавливая экономику. Румыния вступает в НАТО, а затем и в Европейский союз, укрепляя свои позиции как западная демократия, основанная на институтах, а не на культе личности."
 RULE_OPTION_ROM_NATIONAL_LIBERAL: "Либеральная Республика"
 RULE_OPTION_ROM_NATIONAL_LIBERAL_DESC: "Он §8Национальная либеральная партия§! Румыния приходит к власти, выступая за плоскую шкалу налогообложения, либерализацию рынка и децентрализацию, чтобы высвободить частное предпринимательство и индивидуальную инициативу. Румыния строит европейскую идентичность на либеральных принципах свободного рынка и интегрируется в западные страны глубже, чем это позволяла бы ее социал-демократическая альтернатива."
 RULE_OPTION_ROM_PEASANT_PARTY: "Христианские демократы удерживают"
 RULE_OPTION_ROM_PEASANT_PARTY_DESC: "Он §8Христианско-демократическая национальная крестьянская партия§! Она переживает крах Демократической конвенции и сохраняет сельскую местность в центре румынской политики, делая акцент на сельских инвестициях, аграрном возрождении и религиозном консерватизме. Реституция земель возвращает собственность тем, кого коммунисты лишили её, предоставляя фермерам страны возможность участвовать в новом порядке."
 RULE_OPTION_ROM_DEMOCRATIC_PARTY: "Партия Европы"
 RULE_OPTION_ROM_DEMOCRATIC_PARTY_DESC: "Он §8Демократическая партия§! Под руководством Бэсеску политический центр смещается, а затем социал-демократическое и консервативное крыло страны объединяются в единую откровенно проевропейскую партию. Европейская интеграция становится определяющей целью румынской политики, подчиняя все остальные интересы работе по присоединению к Западу."
 RULE_OPTION_ROM_RESTORED_MONARCHY: "Корона возвращается"
 RULE_OPTION_ROM_RESTORED_MONARCHY_DESC: "Демократический съезд восстанавливает свою структуру, проводит референдум по вопросу монархии и §8Король Михаил I§! Возвращается на трон, восстанавливая символическую власть короны после пятидесяти лет коммунизма. Руководство Румынии заявляет о древнем праве короны на царствование над всеми румынами, включая тех, кто проживает в Молдове, Украине и за их пределами."
 RULE_OPTION_ROM_GREATER_ROMANIA: "Великая Румыния"
 RULE_OPTION_ROM_GREATER_ROMANIA_DESC: "Корнелиу Вадим Тюдор §8Партия «Великая Румыния»§! Румыния захватывает президентский пост и превращает службы безопасности и прессу в инструменты партийного государства, укрепляя власть посредством страха и пропаганды. Румыния добивается насильственного воссоединения всех румынских земель, угрожая Молдове, Венгрии, Болгарии, Украине и Сербии и превращая регион в очаг напряженности."
 SOV_AI_BEHAVIOR: "@SOV Россия"
 RULE_OPTION_SOV_HISTORICAL: "Исторический"
 RULE_OPTION_SOV_HISTORICAL_DESC: "Россия восстанавливает вертикаль власти под §8Единая Россия§!Это приводит к подчинению олигархов и превращает энергетические богатства в восстановленную позицию великой державы. Соседние страны сталкиваются с государством, которое захватывает Крым, поддерживает республики Донбасса и в конечном итоге наступает на Украину силой."
 RULE_OPTION_SOV_OLIGARCHS: "Республика олигархов"
 RULE_OPTION_SOV_OLIGARCHS_DESC: "Те, кто купил Россию в ходе приватизации, сохраняют её, и §8олигархи§! Они управляют государством как холдинговой компанией для собственных активов. Иностранный капитал находит все двери открытыми, в то время как армия и государственный бюджет вынуждены оплачивать эту схему."
 RULE_OPTION_SOV_LIBERAL_REFORM: "Либеральный поворот"
 RULE_OPTION_SOV_LIBERAL_REFORM_DESC: "§8Yabloko§! и §8Union of Right Forces§! выигрывают спор о будущем России и восстанавливают её суды, прессу и экономику по западным образцам. Москва обменивает рычаги влияния на своих соседей на партнёрство с Европой и Соединёнными Штатами."
 RULE_OPTION_SOV_COMMUNIST_REVIVAL: "Красное Возрождение"
 RULE_OPTION_SOV_COMMUNIST_REVIVAL_DESC: "Он §8Коммунистическая партия Российской Федерации§! Россия приходит к власти, обещая отменить приватизацию и вернуть советские республики в состав Евросоюза. Ренационализация внутри страны и возрождение восточного блока за рубежом вновь ставят Россию во главе конкурирующего лагеря."
 RULE_OPTION_SOV_NATIONALIST: "Великая Россия"
 RULE_OPTION_SOV_NATIONALIST_DESC: "Он §8Либерально-демократическая партия§! Наживаясь на недовольстве, она приходит к власти и нацеливается на каждую границу, которую, по ее мнению, Россия имеет в своем распоряжении. От Балтики до Центральной Азии соседи становятся не государствами, с которыми нужно иметь дело, а претензиями, которые необходимо отстаивать."
 RULE_OPTION_SOV_NATIONAL_BOLSHEVIK: "Национал-большевистский орден"
 RULE_OPTION_SOV_NATIONAL_BOLSHEVIK_DESC: "Он §8Национал-большевики§! Красный и коричневый цвета сливаются в революционное государство, не подчиняющееся ни либералам, ни олигархам. Россия силой захватывает российские земли и рассматривает постсоветские границы как временное оскорбление."
 RULE_OPTION_SOV_MEDVEDEV_HARDLINE: "Железный президент"
 RULE_OPTION_SOV_MEDVEDEV_HARDLINE_DESC: "Дмитрий Медведев отказывается вернуть президентский пост и строит собственное государство безопасности поверх унаследованного. Тандем распадается на глазах у общественности, и приближенные к его предшественнику люди вытесняются из российской политики."
 RULE_OPTION_SOV_MEDVEDEV_LIBERAL: "Оттепель Медведева"
 RULE_OPTION_SOV_MEDVEDEV_LIBERAL_DESC: "Дмитрий Медведев воплощает свою программу модернизации в жизнь, ослабляя контроль спецслужб и привлекая западные технологии и капитал. Россия либерализуется внутри страны и смягчает свою политику за рубежом, и силовики окончательно проигрывают спор."
 RULE_OPTION_SAU_HISTORICAL: "Исторический"
 RULE_OPTION_SAU_HISTORICAL_DESC: "Он §8Дом Саудов§! Саудовская Аравия сохраняет трон благодаря непрерывной преемственности, тратит доходы от нефти на диверсификацию экономики, снижая зависимость от нефти, и поддерживает отношения в сфере безопасности с США, сдерживая Иран до тех пор, пока Пекин не выступит посредником в потеплении отношений. Саудовская Аравия остается опорой Персидского залива и старшим партнером каждой монархии вдоль его берегов."
 RULE_OPTION_SAU_KHALEEJI_UNION: "Союз стран Персидского залива"
 RULE_OPTION_SAU_KHALEEJI_UNION_DESC: "Королевство превращает Совет сотрудничества стран Персидского залива из площадки для дискуссий в единое государство, сначала с общей валютой и единым управлением, а затем в политический союз под эгидой Эр-Рияда. Более мелкие монархии Персидского залива полностью поглощаются и перестают существовать как независимые страны."
 RULE_OPTION_SAU_FAISALITE_KINGDOM: "Реставрация Фейсалита"
 RULE_OPTION_SAU_FAISALITE_KINGDOM_DESC: "Реакционное течение в королевской семье одерживает победу в борьбе за престолонаследие и восстанавливает... §8Ваххабитские улемы§! Королевство стремится вернуть себе власть, которой оно обладало при короле Фейсале, и вытесняет иностранные деньги и иностранные базы из страны. Королевство либо полностью закрывает свои границы, либо становится третьим полюсом, возглавляющим мусульманский мир в противостоянии обеим сверхдержавам."
 RULE_OPTION_SAU_MILITARY_RULE: "Офицерский переворот"
 RULE_OPTION_SAU_MILITARY_RULE_DESC: "Регулярная армия, испытывающая нехватку средств, в то время как Национальная гвардия сохраняет свои привилегии, свергает короля и правит страной через... §8Верховный Военный Совет§!Эти офицеры правят в странах Персидского залива, где уже не знают, кто говорит от имени Эр-Рияда, и их власть держится лишь до тех пор, пока им удается покупать легитимность."
 RULE_OPTION_SAU_BAATHIST_REPUBLIC: "Арабская Социалистическая Республика"
 RULE_OPTION_SAU_BAATHIST_REPUBLIC_DESC: "После исчезновения монархии §8Арабская партия Баас§! Захватывает республику, национализирует господствующие высоты и восстанавливает армию как авангард арабского единства. Иностранные гарнизоны получают уведомление по всему полуострову, и каждая арабская столица приглашается в состав единого государства."
 RULE_OPTION_SAU_ISLAMIC_REPUBLIC: "Шиитская Республика"
 RULE_OPTION_SAU_ISLAMIC_REPUBLIC_DESC: "Долго подавляемые §8Шиитские партии§! Жители Восточной провинции наследуют республику и выбирают между конституционным урегулированием и путем Хомейна. Крупнейшие нефтяные месторождения Персидского залива меняют сторону, и Тегеран обретает союзника, которого искал десятилетиями."
 RULE_OPTION_SAU_PEOPLES_REPUBLIC: "Красная Республика"
 RULE_OPTION_SAU_PEOPLES_REPUBLIC_DESC: "Он §8Коммунистическая партия§! Захватывает республику, полностью национализирует нефтяные месторождения и превращает полуостров в базу для революции по всему арабскому миру. Эр-Рияд либо заключает соглашение с Москвой, либо возглавляет неприсоединившийся блок, и монархии Персидского залива осознают наличие врага на своей границе."
 RULE_OPTION_SAU_PARLIAMENTARY_REPUBLIC: "Демократический эксперимент"
 RULE_OPTION_SAU_PARLIAMENTARY_REPUBLIC_DESC: "Он §8Национальное демократическое собрание§! побеждает на учредительных выборах и разрабатывает либеральную конституцию с выборным Меджлисом, независимой судебной системой и свободной прессой. Запад получает свою первую арабскую демократию в Персидском заливе, и каждая соседняя монархия должна объяснить, почему она ею не является."
 PMR_AI_BEHAVIOR: "@PMR Приднестровье"
 RULE_OPTION_PMR_HISTORICAL: "Исторический"
 RULE_OPTION_PMR_HISTORICAL_DESC: "Тирасполь остается в руках Игоря Смирнова и его преемников, унаследовавших республику, обменивая переговоры с Кишиневом на еще большую зависимость от российского газа, рублей и миротворцев. Днестровский конфликт остается замороженным, и Молдова не получает ничего, что можно было бы назвать урегулированием."
 RULE_OPTION_PMR_DEMOCRATIC: "Мосты в Кишинев"
 RULE_OPTION_PMR_DEMOCRATIC_DESC: "Приднестровье передает власть своим §8либералы§!Россия демонтирует военный аппарат безопасности и ведет переговоры о возвращении в состав федеративного союза Молдовы. Москва теряет свои позиции на Днестре, а Европейский союз получает установленную границу."
 RULE_OPTION_PMR_REPUBLICAN: "Республиканский поворот"
 RULE_OPTION_PMR_REPUBLICAN_DESC: "Партия §8Republic§! выводит Тирасполь на путь честного управления, поддержки малого бизнеса и независимости, не подотчетной никому. Приднестровье перестает быть российским гарнизоном и начинает стремиться к статусу государства."
 RULE_OPTION_PMR_COMMUNIST: "Красное знамя восстановлено"
 RULE_OPTION_PMR_COMMUNIST_DESC: "Коммунистическая партия §8§! возвращается к власти в Тирасполе, национализирует владения шерифа и возобновляет дело о возрождении Молдавской ССР. Кишинев сталкивается с соседом, который хочет вернуть свою территорию, а не урегулировать спор."
 RULE_OPTION_PMR_MONARCHIST: "Корона на Днестре"
 RULE_OPTION_PMR_MONARCHIST_DESC: "Монархисты §8monarchists§! коронуют монарха на Днестре и восстанавливают Приднестровье как последний сохранившийся фрагмент имперской России. Тирасполь меняет советскую ностальгию на двор, гвардию и претензию на прежнюю легитимность."
 RULE_OPTION_PMR_MILITARY_JUNTA: "Генеральская республика"
 RULE_OPTION_PMR_MILITARY_JUNTA_DESC: "Генерала Александра Лебедя отзывают из Красноярска, чтобы он возглавил республику, которую защищал, и §8офицеры 14-й армии§! Он забирает с собой министерства. Приднестровье вооружается против Кишинева и Бухареста, вместо того чтобы ждать разрешения Москвы."
 RULE_OPTION_PMR_UKRAINIAN: "Навстречу Киеву"
 RULE_OPTION_PMR_UKRAINIAN_DESC: "Тирасполь высылает своих российских покровителей, приглашает украинских офицеров и администраторов на их место и выносит вопрос о присоединении к Украине на референдум. Днестр перестает быть западным форпостом России и становится восточной границей Киева."
 SWI_AI_BEHAVIOR: "@SWI Швейцария"
 RULE_OPTION_SIN_HISTORICAL: "Historical"
 RULE_OPTION_SIN_HISTORICAL_DESC: "The §8People's Action Party§! keeps its unbroken hold on the island, passes the premiership from Goh Chok Tong to Lee Hsien Loong and then to Lawrence Wong, and pairs a hard defence with a foreign policy of talking everyone down. Singapore stays the rich, armed and non-aligned broker of Southeast Asia, friendly to Washington and open to Beijing."
 RULE_OPTION_SIN_OPPOSITION_VICTORY: "The Opposition Wins"
 RULE_OPTION_SIN_OPPOSITION_VICTORY_DESC: "Electoral reform loosens the §8People's Action Party§! grip and the §8Workers' Party§! rides a wave of liberalisation into government. Singapore turns into a Western-style democracy that leans on NATO and Europe, and the region loses its model of managed one-party rule."
 RULE_OPTION_SIN_LOOK_EAST: "Look East"
 RULE_OPTION_SIN_LOOK_EAST_DESC: "The §8People's Action Party§! nationalises foreign assets, adopts the Chinese media model and takes the island into the Shanghai Cooperation Organisation and BRICS. Singapore becomes an economic champion in Beijing's orbit, and the straits it commands stop being neutral water."
 RULE_OPTION_SIN_MASTER_OF_THE_STRAITS: "Master of the Straits"
 RULE_OPTION_SIN_MASTER_OF_THE_STRAITS_DESC: "The hardliners inside the §8People's Action Party§! ban the opposition, put the army first and turn the city state's wealth into claims on Johor and the Riau Islands. Singapore starts dictating terms in the straits it depends on, and Malaysia and Indonesia find a small neighbour ready to fight for them."