 france_md.555.t: "政治路线指南"
 france_md.555.d: "政治树中的大多数路线都可以通过让它们在2002年大选中获胜，或在随后的选举中手动选出它们上台来解锁。然而，某些路线出于现实性和逻辑性的考量起初是无法进入。你可以通过遵循以下指南来进入这些路线：\n波拿巴主义与保皇主义路线：选举国民阵线/国民联盟（民族民粹主义）。完成“关注不安全感”国策，将会触发一个事件，其中某个激进派系向你提供帮助。允许他们壮大势力，并让他们发动政变将你赶下台，你便能使波拿巴主义者或保皇主义者上台。\n法兰西公社路线过程相同：完成“改革而非革命”国策，并让极端分子将你赶下台。\n不屈法国路线：选举社会党（西方社会主义）。完成“与工会切割”国策。这将触发社会党的崩溃，并解锁不屈法国路线。\n其他政党更迭散布于各类事件之中，但目前它们仅具装饰性。"
 france_md.555.a: "谢谢你的指导。"
 france_md.556.t: "成功解散"
 france_md.556.d: "大会不再真正反映我们的公民对我们国家的期望。解散议会向我们的同胞们展示了政府的情况本来可以变得多么糟糕。他们选择我们而不是极端分子，这是正确的选择。"
 france_md.556.a: "那真是个好主意"
