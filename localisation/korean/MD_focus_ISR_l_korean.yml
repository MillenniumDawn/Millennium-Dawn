 ukr_acc_irdo: "§Y[UKR.GetNameWithFlag]§!에 대공 체계 2기를 §G$3.25 Billion§!에 수출하겠습니다."
 israel_military.1.t: "키랴에서의 브리핑"
 israel_military.1.d: "추후 작성"
 israel_military.1.a: "좋아"
 israel_military.2.t: "와인가드 위원회"
 israel_military.2.d: "추후 작성"
 israel_military.2.a: "기동국의 실책부터 검토하자."
 israel_military.2.b: "차라리 작전 부서의 실책을 먼저 검토하자."
 israel_military.3.t: "기동국 검토"
 israel_military.3.d: "추후 작성"
 israel_military.3.a: "소규모 집중 교전을 선호한다."
 israel_military.3.b: "전격적인 공세로 돌아가야 한다."
 israel_military.4.t: "작전 부서 검토"
 israel_military.4.d: "추후 작성"
 israel_military.4.a: "더 작은 군대에 도박을 걸 여유는 없다."
 israel_military.4.b: "영리하지만 작은 군대가 다른 대안보다 낫다."
 israel_military.5.t: "전략 부서와의 회의"
 israel_military.5.d: "추후 작성"
 israel_military.5.a: "북쪽을 주시해야 한다."
 israel_military.5.b: "남쪽을 주시해야 한다."
 ISR_speak_to_malal: "말알과 대화하기"
 ISR_speak_to_malal_desc: "새 세기의 이스라엘은 우리의 안보를 유지하기 위해 매우 신중하고 섬세한 외교 정책을 펼쳐야 합니다."
 ISR_usa_china_balance: "줄타기"
 ISR_usa_china_balance_desc: "미국 및 중국과 이스라엘의 관계는 현재 최고조에 달해 있습니다. 이제 새롭게 열린 기회를 어떻게 활용할지 결정해야 합니다."
 ISR_balance_favor_america: "오랜 동맹"
 ISR_balance_favor_america_desc: "미국은 우리의 가장 오래된 동맹국입니다. 미국과의 경제 협력이 우리가 내릴 수 있는 가장 이성적인 선택입니다."
 ISR_balance_favor_china: "실크로드의 유산"
 ISR_balance_favor_china_desc: "변화하는 현대의 정치 지형에서, 중국을 우대하는 것이 우리 경제에 이로울 수 있습니다."
 ISR_joint_development_zone: "공동 경제 개발 그룹"
 ISR_joint_development_zone_desc: "미국-이스라엘 공동경제개발그룹(JEDG)은 이스라엘과 미국이 매년 개최하는 양자 회의로, 양국의 경제 상황과 이스라엘 정부가 취할 수 있는 경제 개혁 방안을 논의하기 위한 것입니다."
 ISR_visa_free_request: "비자 면제 프로그램 가입"
 ISR_visa_free_request_desc: "비자 면제 프로그램은 특정 국가의 시민이 비자 없이 90일 이내의 관광 또는 사업 목적으로 미국을 방문할 수 있도록 허용합니다. 프로그램 참가국은 항공편 탑승 전에 유효한 전자여행허가 승인을 보유하는 등 특정 요건을 충족해야 합니다."
 ISR_defence_pact_usa: "방위 조약 제안"
 ISR_defence_pact_usa_desc: "미국과의 방위 협정을 재검토하고, 아마도 협력을 심화해야 합니다."
 ISR_china_arm_shipments: "정교한 무기 수출"
 ISR_china_arm_shipments_desc: "우리의 무기를 판매하겠다고 제안함으로써 국방 분야에서 중국과 협력할 수 있습니다."
 ISR_israel_china_innovation_conference: "이스라엘-중국 혁신 회의 포럼"
 ISR_israel_china_innovation_conference_desc: "중국-이스라엘 혁신 협력 공동위원회는 양국 간 고위급 정부 대 정부 메커니즘을 구축하기 위한 이스라엘 외무부의 구상입니다."
 ISR_haifa_port_lease: "하이파 항구 임대 허용"
 ISR_haifa_port_lease_desc: "하이파 항구의 임대를 허용하는 것은 우리와 중국 모두에게 이로울 수 있으며 양국 간 무역을 촉진할 것입니다."
 ISR_cyrus_accords: "느헤미야의 꿈"
 ISR_cyrus_accords_desc: "아르타크세르크세스가 예언자 느헤미야를 예루살렘에 보내 성벽을 보수하게 했을 때, 그는 유대인들에게 키루스가 한 약속을 다시 확인해 주었을 뿐 아니라 페르시아 민족과 이스라엘의 아들들 사이에 수 세기에 걸친 우정을 굳건히 했습니다. 아야톨라들은 아무리 감추려 해도 우리의 절멸을 추구함으로써 자국민의 뜻을 거스르고 있습니다. 우리는 새롭고 더 나은 시대를 바라며 이란 국민을 지원할 것입니다."
 ISR_cyrus_accords_sign: "키루스 협정 서명"
 ISR_cyrus_accords_sign_desc: "이란이 아야톨라들의 폭압적인 체제에서 해방된 후, 우리는 양국 간에 새로운 조약을 체결해야 합니다."
 ISR_cyrus_promise: "벤 우시엘의 복수"
 ISR_cyrus_promise_desc: "1500여 년 전, 느헤미야 벤 우시엘은 이스라엘 국가 이전 유대인 국가 수립의 마지막 시도를 말살하기 위한 구실로 페르시아 샤 호스로 2세에 의해 티레에서 희생되었습니다. 이제 우리가 성지로 돌아온 이상, 우시엘의 희생을 잊지 않을 것입니다. 이란과 그 지도자들은 유대 국가에 대한 존립적 위협이며, 그것이 사실인 한 그들은 편히 잠들지 못할 것입니다."
 ISR_iran_command: "전략 및 제3권역 총국"
 ISR_iran_command_desc: "전략 및 제3권역 총국은 이스라엘의 제3권역 적(국경을 맞대지 않은 적), 그중에서도 특히 이란과 관련된 이스라엘 국방군의 활동을 집중시키기 위해 설치됩니다. 이 때문에 총국은 '이란 사령부'라는 별칭으로도 불립니다. 총국은 소장에 해당하는 알루프 계급의 이스라엘 국방군 고위 장교가 이끕니다."
 ISR_cyber_defence_unit: "사이버 방어 여단 창설"
 ISR_cyber_defence_unit_desc: "우리는 물리적 안보 영역뿐 아니라 사이버 공간에서도 스스로를 방어할 수 있어야 합니다."
 ISR_cyber_attack_iran: "보복성 사이버 공격 제안"
 ISR_cyber_attack_iran_desc: "이란 정부 기관을 사이버 공격하여, 그들의 사악한 계획이 한 조각도 우리의 감시망을 벗어나지 않도록 해야 합니다."
 ISR_operation_olympic_games: "올림픽 게임 작전"
 ISR_operation_olympic_games_desc: "미국과 함께 이란 핵시설을 겨냥한 사이버 교란 방식의 공동 사보타주 작전을 수행해야 합니다."
 ISR_deniable_drone_strikes: "고도화된 부인 가능 드론 공습"
 ISR_deniable_drone_strikes_desc: "우리는 부인 가능한 드론 공습을 수행하며 많은 경험을 쌓았습니다. 이 경험을 활용하여 드론 공습 방식을 개선할 것입니다."
 ISR_supply_the_pjaks: "기멜 계획 실행"
 ISR_supply_the_pjaks_desc: "이란에는 흥미로운 국내 문제가 하나 있습니다. 바로 쿠르드족의 PJAK 운동입니다. 이념적 입장은 상당히 다르지만, 그들의 투쟁을 지원함으로써 우리는 많은 이득을 얻을 수 있습니다..."
 ISR_accept_diplomacy: "최대 압박 포기"
 ISR_accept_diplomacy_desc: "새로운 회담에서 좋은 협상 입장을 찾음으로써 이란의 야망을 달래 보아야 합니다."
 ISR_strike_with_america: "공동 작전 압박"
 ISR_strike_with_america_desc: "이란의 핵 위협을 제거하기 위해 공동 작전을 수행해야 합니다."
 ISR_strike_alone: "영원히 칼을 삼키다"
 ISR_strike_alone_desc: "우리의 존립을 위협하며 머리 위에 걸린 칼을 끊어내는 것은 오로지 우리 스스로의 의무입니다."
 ISR_invite_rajavi: "마리암 라자비와의 면담"
 ISR_invite_rajavi_desc: "마리암 라자비는 이란의 저명한 좌익 야당 지도자 마수드 라자비의 아내입니다. 어쩌면 그들의 지지를 얻어 보아야 할지도 모릅니다..."
 ISR_invite_pahlavi: "레자 팔라비와의 면담"
 ISR_invite_pahlavi_desc: "이란에 대한 전복 활동의 정당성을 확보하려면, 이란 전 샤의 아들인 레자 팔라비를 만나 그의 지지를 얻어야 합니다."
 ISR_support_iranian_protesters: "이란 시위대 지원"
 ISR_support_iranian_protesters_desc: "이란의 정치 지형을 불안정하게 만들고 반체제 시위대를 지원해야 합니다..."
 ISR_steal_the_nuclear_archive: "이란 핵 기록 탈취"
 ISR_steal_the_nuclear_archive_desc: "우리 요원들은 이미 테헤란에 잠입하여 특수 군사 시설 진입 명령을 기다리고 있습니다. 우리는 그들의 행동을 직접 조율하고 세부 사항에 주의를 기울여야 합니다."
 ISR_bct_pipleine_azerbaijan: "바쿠-트빌리시-제이한 수입"
 ISR_bct_pipleine_azerbaijan_desc: "아제르바이잔과의 관계 강화는 우리 경제와 이란에 대응하는 역량에 매우 이로울 수 있습니다."
 ISR_tavor_arm_shipments: "타보르 무기 수출"
 ISR_tavor_arm_shipments_desc: "아제르바이잔 군에 타보르 소총을 공급함으로써 이익을 얻고 양국 간 유대도 강화할 수 있습니다."
 ISR_uvda_airlift: "우브다 공수"
 ISR_uvda_airlift_desc: "항공 작전과 착륙을 위한 기반을 확보해야 합니다. "
 ISR_sitalchay_airbase_lease: "시탈차이 공군기지 임차"
 ISR_sitalchay_airbase_lease_desc: "이란의 침략을 더욱 저지하고 아제르바이잔과 비밀 협정을 맺기 위해, 아제르바이잔이 시탈차이 공군기지를 우리에게 임대해 주어야 할 수 있습니다."
 ISR_mossads_door: "모사드의 문"
 ISR_mossads_door_desc: "아제르바이잔은 양국 간의 적대감에도 불구하고 이란 내에 막대한 연줄을 가지고 있습니다. 정치적 차이에도 불구하고 양국 국민은 서로의 영토를 오가며 상업적 관계도 발전하고 있습니다. 아마도 아제르바이잔은 우리 요원들이 이란에 들어가는 거점으로 자국을 사용할 기회를 줄 것입니다."
 ISR_karabakh_victory: "카라바흐 승리"
 ISR_karabakh_victory_desc: "우리의 노력에 일부 힘입어, 카라바흐는 마침내 이란의 대리 세력으로부터 해방되었습니다. 승리는 우리의 것입니다!"
 ISR_reconsider_caucasus_position: "역사 속 우리의 역할 재고"
 ISR_reconsider_caucasus_position_desc: "우리는 역사로부터 배우고 아르메니아와 아르메니아 국민에게 다시 접근해야 합니다. 양측의 역사는 많은 유사점을 보여 주며, 우리는 이를 부정해서는 안 됩니다."
 ISR_recognize_arm_genocide: "아르메니아 집단학살 인정"
 ISR_recognize_arm_genocide_desc: "유대인은 아르메니아인과 마찬가지로 과거에 민족에 대한 박해라는 같은 운명을 겪었습니다. 튀르키예와의 관계가 악화되더라도 아르메니아인의 고난을 인정해야 합니다."
 ISR_syunik_air_base: "시우니크 공군기지 임차"
 ISR_syunik_air_base_desc: "우리나라가 공격받을 경우에 대비하여 아르메니아에 비밀리에 협력해 달라고 요청해야 합니다. 우리의 계획이 성공하려면 공군기지가 구축되어야 합니다."
 ISR_armenia_mossad_door: "모사드의 열린 창"
 ISR_armenia_mossad_door_desc: "공동의 이란 위협에 맞서 협력해 달라고 아르메니아에 요청해야 합니다. 그들이 동의한다면, 우리 첩보원들은 그들의 국경을 통해 이란에 잠입할 것입니다."
 ISR_airlift_support_armenia: "아라라트 산 작전"
 ISR_airlift_support_armenia_desc: "아르메니아와 군사적으로 협력하고 최신 드론을 공급해야 합니다."
 ISR_recognize_artsakh: "아르차흐 문제에 대한 우리의 입장"
 ISR_recognize_artsakh_desc: "이제 아르차흐 문제에 대한 최종 입장을 마침내 선언할 때가 되었습니다. 이는 아르메니아와 아르차흐에 대한 우리의 영향력을 크게 높일 것입니다."
 ISR_influence_caucasus: "알렉산드로스의 관문 체크메이트"
 ISR_influence_caucasus_desc: "우리를 그다지 좋아하지 않는 국가들을 포함하여, 코카서스 전역에 강력한 연줄을 구축하고 영향력과 무역 관계를 확대해야 합니다."
 ISR_free_trade_geo: "이스라엘-조지아 자유무역협정"
 ISR_free_trade_geo_desc: "양국의 경제적 이익을 위해 자유무역협정을 체결하고 양국 간 경제 관계를 증진해야 합니다."
 ISR_mil_cyb_geo: "군사 역량 수출"
 ISR_mil_cyb_geo_desc: "비교적 평화로운 조지아와의 군사 협력은 남코카서스에 영향력을 행사하려는 우리의 장기 계획에 매우 이로울 수 있습니다."
 ISR_approach_georgia: "조지아에 접근"
 ISR_approach_georgia_desc: "조지아는 우리나라와의 협력에 늘 어느 정도 관심을 보여 온 국가 중 하나입니다. 그들과 친교를 맺도록 노력해야 합니다."
 ISR_balance_favor_ukraine: "우크라이나산 밀 수입"
 ISR_balance_favor_ukraine_desc: "우크라이나에는 세계 최대 규모의 유대인 디아스포라 중 하나가 있습니다. 무역 관계를 증진하기 위해 곡물을 구매하라는 그들의 관대한 제안을 거절할 수 없습니다."
 ISR_balance_favor_russia: "러시아산 밀 수입"
 ISR_balance_favor_russia_desc: "러시아와의 우호 관계를 매우 반긴다는 점을 보여 주기 위해, 협력의 첫걸음으로 그들에게서 곡물을 구매할 수 있습니다."
 ISR_russian_military_coordination: "러시아 군사 조율"
 ISR_russian_military_coordination_desc: "러시아와의 관계를 증진하기 위해 양국 간 군사 협력을 제안할 수 있습니다."
 ISR_honor_the_red_army: "붉은 군대에 경의를"
 ISR_honor_the_red_army_desc: "우리 민족은 제2차 세계 대전에서 나치의 위협에 맞서 함께 싸웠습니다. 우리는 형제애의 역사를 지키고 붉은 군대를 기려야 합니다!"
 ISR_cede_sergeys_courtyard: "세르게이 안뜰 협정"
 ISR_cede_sergeys_courtyard_desc: "러시아 부지는 예루살렘 중심부에서 가장 오래된 구역 중 하나로, 대규모 러시아 정교회 성당, 러시아 소유의 세르게이 안뜰, 예루살렘 주재 러시아 총영사관 부지가 있으며, 과거 순례자 숙소였던 부지도 있습니다. 이 중 일부는 이스라엘 정부 건물로 쓰이고 있고, 그중 하나에는 지하 수감자 박물관이 들어서 있습니다."
 ISR_part_of_the_russian_world: "러시아 세계의 일부"
 ISR_part_of_the_russian_world_desc: "러시아와의 관계를 증진하고 상호 이익을 얻기 위해 EAEU와 자유무역협정을 체결해야 할 수도 있습니다."
 ISR_ukrainian_foreign_workers: "우크라이나 외국인 노동자"
 ISR_ukrainian_foreign_workers_desc: "우크라이나와의 경제 협력의 일환으로 우크라이나 노동자들을 우리나라에 초청할 수 있습니다. 어쩌면 양측 모두에게 이로울 수 있습니다."
 ISR_ukrainian_refugees: "샤케드 제안"
 ISR_ukrainian_refugees_desc: "우크라이나와의 유대는 이제 강력하지만, 우리는 우크라이나에 있는 디아스포라가 이스라엘로 돌아오는 것을 지원해야 합니다."
 ISR_visit_central_asia: "중앙아시아 순방"
 ISR_visit_central_asia_desc: "이제 중앙아시아 국가들과의 관계를 개선할 때가 되었습니다."
 ISR_red_color_systems: "체바 아돔 체계 수출"
 ISR_red_color_systems_desc: "오늘날 우크라이나의 정치 상황을 고려하면, 우리의 조기경보 레이더 체계를 그들에게 수출하는 것이 선견지명일 수 있습니다."
 ISR_deliver_kipot_barzel_to_ukraine: "북부 하늘 협정"
 ISR_deliver_kipot_barzel_to_ukraine_desc: "우크라이나와의 유대를 확고히 하기 위한 다음 단계는 아이언 돔을 우크라이나에 수출하는 것입니다."
 ISR_travel_to_europe: "유럽 순방"
 ISR_travel_to_europe_desc: "미국을 제외하면 유럽 국가들이 우리의 가장 가까운 무역 및 군사 파트너입니다. 이들과의 관계를 개선해야 합니다."
 ISR_germany_relations: "국가이성 강화"
 ISR_join_oecd: "OECD 지원"
 ISR_join_oecd_desc: "경제협력개발기구는 경제 발전과 세계 무역을 촉진하기 위해 1961년에 설립된 정부 간 기구입니다. 회원국들은 스스로를 민주주의와 시장경제에 헌신하는 국가라고 규정하며, 이 기구는 정책 경험을 비교하고, 공통의 문제에 대한 해답을 모색하고, 모범 사례를 확인하며, 회원국의 국내 및 국제 정책을 조율하는 장을 제공하는 포럼입니다."
 ISR_germany_relations_desc: "독일과의 과거의... 문제에도 불구하고, 현대 독일 정부는 과거의 행위를 사과하였으며 우리 민족에게 우정을 선언했습니다."
 ISR_kosovo_question: "발칸 정책 재고"
 ISR_kosovo_question_desc: "무슬림이 다수인 코소보를 지지함으로써 이슬람 세계 전반으로부터 외교적 이익을 얻을 수 있습니다. 그뿐 아니라 서방과 연대한 코소보는 서방 열강에 유리한 방향으로 우리의 이미지를 개선하는 데 도움이 될 수 있습니다."
 ISR_approach_singapore: "싱가포르에 대한 새로운 사절단"
 ISR_approach_singapore_desc: "싱가포르는 극동 아시아에서 우리의 가장 오래되고 가까운 동맹국 중 하나입니다. 군사 협력 협정을 갱신하고 공동의 노력을 심화해야 합니다."
 ISR_approach_mynamar: "타킨 누의 유산"
 ISR_approach_mynamar_desc: "미얀마는 우리를 가장 먼저 승인하고 우호 관계를 수립한 국가 중 하나였습니다. 이 유익한 우정을 계속 이어 가야 합니다!"
 ISR_state_visit_to_india: "인도 국빈 방문"
 ISR_state_visit_to_india_desc: "인도는 중동의 이슬람 침략에 맞서는 우리의 가장 가까운 군사 및 정치 파트너 중 하나입니다. 양국 간 우호 관계를 증진해야 합니다."
 ISR_promote_after_army_trips: "전역 후 인도 여행"
 ISR_promote_after_army_trips_desc: "인도는 경제의 관광 부문을 활성화하기를 열망하고 있습니다. 우리 병사들을 위한 전역 후 인도 여행을 마련함으로써 인도를 도울 수 있습니다."
 ISR_arm_exports_to_india: "인도 무기 수출"
 ISR_arm_exports_to_india_desc: "인도 군 당국은 우리의 군사 제품에 매우 큰 관심을 가질 수 있습니다. 우리 무기를 판매하겠다고 제안해 봅시다."
 ISR_ashdod_port: "아슈도드 항구 임대 허용"
 ISR_ashdod_port_desc: "인도는 오랫동안 아슈도드 항구 이용에 관심을 가져 왔습니다. 이를 우리의 상호 이익을 위해 활용할 수 있습니다."
 ISR_joint_space_program: "우주 프로그램 협력"
 ISR_joint_space_program_desc: "이스라엘-인도 공동 우주 프로그램은 우주 탐사의 한계를 넓히려는 양국의 변치 않는 의지를 보여 주는 증거입니다."
 ISR_make_in_india: "메이크 인 인디아"
 ISR_make_in_india_desc: "상호 이익을 얻기 위해 인도와의 무역 관계를 확대해야 합니다. 최근 발표된 인도의 새로운 경제 프로그램은 이를 위한 좋은 기회입니다."
 ISR_salinization_support_india: "물 기술 지원 제공"
 ISR_salinization_support_india_desc: "인도도 과거의 우리와 마찬가지로 물 정수 문제를 안고 있습니다. 이를 활용하여 인도에 대한 영향력을 더 높일 수 있습니다."
 ISR_iran_international: "이란 인터내셔널 유치"
 ISR_iran_international_desc: "이란 인터내셔널은 이란 국민을 대상으로 대항 선전을 펼치는 페르시아어 뉴스 매체입니다."
 ISR_plan_bet: "베트 계획 실행"
 ISR_plan_bet_desc: "이란의 사악한 계획에 대응하고 이라크 시아파를 견제하기 위해, 쿠르드족의 사실상 국가와 민족 민병대를 지원해야 합니다."
 ISR_indian_imports: "이스라엘-인도 무역 증진"
 ISR_speak_to_staff: "마트칼과 대화하기"
 ISR_speak_to_staff_desc: "우리나라는 적들에게 둘러싸여 있습니다. 군에 대한 비집중적인 접근 방식을 감당할 여유가 없습니다."
 ISR_women_corps: "여군단 해체"
 ISR_women_corps_desc: "여군이 성별이 아닌 직무에 따라 개별 부대의 지휘를 받을 수 있도록 여군단을 해체해야 합니다."
 ISR_yohalam: "요할람"
 ISR_yohalam_desc: "이 부대는 이스라엘 국방군 내 성희롱 방지 정책을 시행하고, 국방군 참모총장과 국방군 참모부 포럼에 양성 평등 기회 증진 및 여군 복무 최적화에 관해 조언하는 임무를 맡습니다."
 ISR_unite_courses: "장교 과정 통합"
 ISR_unite_courses_desc: "장교 교육 체계를 일원화하기 위해 여군과 남군의 장교 과정을 통합해야 합니다."
 ISR_netzah_yehuda: "네차 예후다 대대"
 ISR_netzah_yehuda_desc: "이전에 나할 하레디로 알려졌던 제97 네차 예후다 대대는 이스라엘 국방군 키르 여단 소속 대대입니다. 이 부대의 목적은 할라하를 엄격히 준수하는 종교적 신념에 부합하는 환경을 조성함으로써 하레디 유대인 남성이 이스라엘 군에서 전투병으로 복무할 수 있게 하는 것입니다."
 ISR_karakal: "카라칼 대대"
 ISR_karakal_desc: "제33 카라칼 대대는 이스라엘 국방군의 보병 전투 대대로, 이스라엘 군 파란 여단에 속한 남녀 병사가 함께 구성된 세 개의 완전 전투 부대 중 하나입니다."
 ISR_army_builds_society: "암 보네 차바 보네 암"
 ISR_army_builds_society_desc: "군대는 우리 사회를 건설하며 국가 체제의 핵심입니다!"
 ISR_gsharim: "그샤림"
 ISR_gsharim_desc: "그샤림 프로그램은 우리 병사들이 국방군에서 전역한 후 학점을 취득할 수 있도록 해야 합니다."
 ISR_titkadmu: "미트카드민 베차할"
 ISR_titkadmu_desc: "티트카드무는 자폐 스펙트럼 병사를 위해 고안된 군 프로그램입니다. 이들 청년을 일반 사회에 통합하려는 국방군의 비전의 일환으로, MPOTP는 지휘 인력이 스펙트럼 병사와 함께 일하는 방법을 훈련하고 돕는 프로그램을 설계했습니다. 또한 스펙트럼 병사가 군 생활에 성공적으로 적응하도록 돕는 프로그램도 설계했습니다."
 titkadmu_idea: "티트카드무"
 ISR_fill_our_stocks: "비축량 채우기"
 ISR_fill_our_stocks_desc: "가능한 한 빨리 비축량을 채워야 합니다. 따라서 여러 무기상과 접촉하여 우리 군을 위한 무기를 구매해야 합니다."
 ISR_merkava_focus: "메르카바"
 ISR_merkava_focus_desc: "메르카바는 이스라엘 국방군이 사용하는 주력 전차 시리즈로 국방군 기갑군단의 근간입니다."
 ISR_mafat: "마팟 창설"
 ISR_mafat_desc: "국방연구개발국(DDR&D)은 국방 기술을 위한 혁신적 개념의 개발을 책임지고, 국방 기술과 관련된 이스라엘 국방부의 단기 및 장기 프로젝트를 관리하며, 군사 및 방어 기술의 연구 개발을 위한 전문 기술 기관으로서 기능하고, 연구 개발 분야에서 국제 파트너와 협력하며, 국방 기관의 차세대 인력과 기술 전문가를 양성하는 임무를 맡습니다."
 ISR_military_industry: "선도적인 무기 생산국이 되다"
 ISR_military_industry_desc: "무기 생산을 우리 경제의 가장 큰 부문 중 하나로 만들어야 합니다."
 ISR_eitan: "에이탄"
 ISR_eitan_desc: "에이탄은 이스라엘 국방부 산하 메르카바 및 장갑차 총국이 개발한 장갑 전투 차량으로, 이스라엘 국방군에서 사용 중인 노후화된 M113 장갑 병력 수송차를 대체하기 위한 것입니다."
 ISR_pere: "페레"
 ISR_pere_desc: "페레는 전차로 위장한 이스라엘의 대전차 미사일 운반차입니다. 이스라엘 국방군에서 정밀 포병 역할로 복무하고 있습니다."
 ISR_barak_tank: "바락 도입"
 ISR_barak_tank_desc: "바락 전차는 획기적인 기술을 도입하여 기갑군단 병사들에게 독보적인 방어 및 공격 능력을 제공하고 기동성을 크게 향상시킵니다."
 ISR_winegrad_commission: "위노그라드 위원회 청문회"
 ISR_winegrad_commission_desc: "위노그라드 위원회는 이스라엘 정부가 임명한 조사 위원회로, 은퇴한 판사 엘리야후 위노그라드가 위원장을 맡아 레바논 전쟁을 조사하고 교훈을 도출했습니다."
 ISR_unit_as_etrog: "에트로그로서의 부대"
 ISR_multi_facid_manuevers: "다면 여단"
 ISR_tenufa_project: "트누파 프로젝트"
 ISR_tenufa_project_desc: "트누파 계획은 아직 이스라엘 내각의 공식 승인을 받지 못했으며 다년도 예산 합의에도 명문화되어 있지 않습니다."
 ISR_gideon_plan: "기드온 계획"
 ISR_gideon_plan_desc: "기드온 계획에는 두 가지 목적이 있습니다. 첫째, 삭감을 피하고 실제로는 복지, 교육, 보건 및 기타 모든 국가적 필수 분야를 희생시키면서 국방 예산을 한 번 더 증액하는 것입니다."
 ISR_flash_formations: "플래시 편대"
 ISR_flash_formations_desc: "지상군 운용의 효율성을 높이기 위해 플래시 편대를 활용해야 합니다."
 ISR_lightning_campaign: "치고 빠지기"
 ISR_lightning_campaign_desc: "우리 병력은 신속한 기습과 부대 교대를 준비해야 하며, 이는 특히 도시 지역에서 우리에게 이점이 될 것입니다."
 ISR_prioritize_givati: "기바티 우선"
 ISR_prioritize_givati_desc: "제84 기바티 여단은 1947년에 창설된 이스라엘 국방군 보병 여단입니다. 1948년 전쟁 중 하메츠, 바락, 플레셰트 작전에서 팔레스타인 마을 점령에 가담했습니다."
 ISR_ghost_units: "888 유령 부대"
 ISR_ghost_units_desc: "888 부대는 제99 보병 사단 내의 복합 특수 작전 임무부대입니다. 이들을 우선시하여 하나의 독립 부대로 분리해야 합니다."
 ISR_urban_warfare: "도시전 대비"
 ISR_urban_warfare_desc: "이제 도시 환경이 포함될 수 있는 모든 전쟁 시나리오에 대비할 수 있도록 최종 준비를 해야 합니다."
 ISR_paphos_drill: "파포스 전쟁 연습"
 ISR_paphos_drill_desc: "북부 전선을 위한 산악전 경험을 더 쌓기 위해 키프로스와 함께 훈련해야 합니다."
 ISR_operating_to_victory: "승리를 향한 작전 교리"
 ISR_operating_to_victory_desc: "부분적인 해결책이 아니라 승리를 향해 작전해야 합니다!"
 ISR_prioritize_golani: "골라니 쉘리"
 ISR_prioritize_golani_desc: "골란 고원을 방어해야 할 우리의 주요 방어 구역으로 우선시해야 합니다."
 ISR_focus_on_the_battalion: "그두드 중시"
 ISR_focus_on_the_battalion_desc: "대대는 북부의 적들에 맞서는 우리의 방패가 될 것이므로 최우선 순위가 되어야 합니다."
 ISR_mountain_warfare: "산악전 대비"
 ISR_mountain_warfare_desc: "이제 우리 군은 북부 전선에서의 모든 전쟁과 산악 작전에 대비해야 합니다."
 ISR_focus_air: "이스라엘 공군"
 ISR_focus_air_desc: "이스라엘 공군은 이스라엘 국방군의 항공 및 우주전 병과로 운용됩니다. 이스라엘 독립 선언 직후인 1948년 5월 28일에 창설되었습니다."
 ISR_focus_navy: "이스라엘 해군"
 ISR_focus_navy_desc: "국가의 안전을 보장하기 위해 우리의 해양 안보에도 집중해야 합니다."
 ISR_focus_ground_forces: "이스라엘 지상군"
 ISR_focus_ground_forces_desc: "이스라엘 지상군은 이스라엘 국방군의 지상 병력입니다. 사령관은 소장 계급의 지상군 사령관이며 '마지'라 불리고, 참모총장에게 예속됩니다."
 ISR_extend_standing_period: "복무 기간 연장"
 ISR_extend_standing_period_desc: "조종사는 전쟁 중에 소집되는 '계절' 노동자가 되어서는 안 됩니다. 이들의 복무 기간을 연장하고 정치 참여를 제한할 것입니다."
 ISR_shorten_standing_period: "복무 기간 단축"
 ISR_shorten_standing_period_desc: "예비군을 대규모로 훈련하기 위해 훈련 기간을 단축해야 합니다."
 ISR_shorten_flight_course: "비행 과정 개편"
 ISR_shorten_flight_course_desc: "공군 인력의 훈련 과정을 개편해야 합니다. 훈련에 더 많은 시간이 필요하겠지만 이들을 더욱 전문적으로 만들 것입니다."
 ISR_small_but_professional: "소수 정예"
 ISR_small_but_professional_desc: "우리 공군의 장교는 수는 적되 장기 복무해야 합니다."
 ISR_miller_case: "밀러 사건 이행"
 ISR_miller_case_desc: "1994년, 한 용감한 젊은 여성이 제도에 도전하여 이스라엘 국방군에서 가장 엘리트인 부대 중 하나에 들어갈 기회를 요구했습니다. 남아프리카 출신인 앨리스 밀러는 여섯 살에 가족과 함께 이스라엘로 이주했습니다. 밀러는 항상 항공에 열정이 있었습니다. 고등학교를 마친 후 민간 조종사 면허를 취득하고 항공우주공학 학위를 추구했습니다. 23세에 그녀는 명망 높은 조종사 과정에 입대할 권리를 주장하며 군을 상대로 소송을 제기했습니다. 역사적인 표결에서 이스라엘 대법원은 여성 지원자의 항공 과정 입학 금지가 위헌이라고 판결했습니다."
 ISR_begin_doctrine: "베긴 독트린 강화"
 ISR_operation_orchard: "틀을 깬 작전"
 ISR_operation_orchard_desc: "시리아 데이르에조르 지역의 알키바르 부지로 불리는 핵 원자로 의심 시설에 공습을 가해야 합니다."
 ISR_prevent_iranian_nukes: "장미 여왕 작전"
 ISR_prevent_iranian_nukes_desc: "이제 이란이 이미 핵무기를 보유했거나 취득하기 직전이라는 사실을 확실히 알고 있습니다. 이 과정을 늦춰야 합니다."
 ISR_prevent_libyan_nukes: "모래 폭풍 작전"
 ISR_prevent_libyan_nukes_desc: "리비아 정부가 우리에게 적대적이며 핵무기를 개발하거나 구매하려 한다면, 핵 시설을 폭격하여 그들의 공격을 막아야 합니다."
 ISR_prevent_iraqi_nukes: "최종 승부 작전"
 ISR_prevent_iraqi_nukes_desc: "이라크 정부가 우리에게 적대적이며 핵무기를 개발하거나 구매하려 한다면, 핵 시설을 폭격하여 그들의 공격을 막아야 합니다."
 ISR_war_between_the_wars: "전쟁 사이의 전선"
 ISR_war_between_the_wars_desc: "이란 체제에 대항하려면 이란과 하이브리드전을 벌여, 가장 먼 전선에서 그들에 맞서야 합니다."
 ISR_villa_in_the_jungle: "정글 속의 빌라에서"
 ISR_villa_in_the_jungle_desc: "시리아를 조종하여 이란군을 자국 영토에서 철수시키고, 나아가 시리아를 인질 동맹국으로 만들 수 있을지도 모릅니다..."
 ISR_expand_lamdan: "정보 라학에 의존"
 ISR_expand_lamdan_desc: "공군의 모든 정보 수집을 LAMDAN에 맡겨야 합니다."
 ISR_researchers_with_idi: "IDI 기지에 연구원 배치"
 ISR_researchers_with_idi_desc: "우리 군의 현재 전술과 필요 사항에 대한 정보를 더 얻기 위해 군 연구원들을 IDI 기지에 배치해야 합니다."
 ISR_shuffle_squadrons: "비행대 인사 개편"
 ISR_shuffle_squadrons_desc: "공군 병사들이 만든 정치 단체에 인사 개편을 단행해야 합니다. 이는 그들의 정치적 충성을 보장할 것입니다."
 ISR_research_department_focus: "키랴 수호"
 ISR_research_department_focus_desc: "키랴 부서가 길롯 부서에 대해 우위를 점하도록 보장해야 합니다."
 ISR_aman_info_focus: "글릴롯 수호"
 ISR_aman_info_focus_desc: "길롯 부서가 키랴 부서에 대해 우위를 점하도록 보장해야 합니다."
 ISR_balance_hatam_aman_focus: "정보의 예술가들"
 ISR_balance_hatam_aman_focus_desc: "키랴와 길롯이 좋아하지 않더라도 둘 사이의 균형을 보장해야 합니다."
 ISR_brothers_squadrons: "형제의 비행대"
 ISR_brothers_squadrons_desc: "예비군은 병사와 달리 정치에 참여할 수 있습니다. 가장 두드러지는 사례는 사법 개혁 반대 운동을 이끈 그들의 단체 '형제들의 무기(Brothers in Arms)'입니다."
 ISR_brothers_in_arms_air: "형제자매의 무기"
 ISR_brothers_in_arms_air_desc: "여성 장교가 우리 단체에 가입하도록 허용하고, 가입할 수 있는 남녀 공군 병사의 수를 늘려야 합니다."
 ISR_sion_sead: "시온 SEAD"
 ISR_sion_sead_desc: "적 방공망 제압에 대비하고, 이러한 작전을 수행할 수 있도록 더 많은 첨단 드론을 생산해야 합니다."
 ISR_kochav: "고도화된 드론 생산"
 ISR_kochav_desc: "우리의 역량으로 드론을 생산하고 잠재적으로 수출하여 더 많은 자금과 힘을 얻어야 합니다."
 ISR_prioritize_ramat_david: "라마트 다비드 우선"
 ISR_prioritize_ramat_david_desc: "라마트 다비드에 공군기지를 건설한다면 우리나라의 남부 지역을 방어할 수 있습니다."
 ISR_prioritize_nevatim: "네바팀 우선"
 ISR_prioritize_nevatim_desc: "지리적 위치 때문에 네바팀에 공군기지를 건설하는 것을 우선시해야 합니다."
 ISR_raam: "라암"
 ISR_raam_desc: "공격과 요격의 이중 임무를 수행하는 장거리 전투기입니다. 중동 지역에서 동급 최고로 평가받는 이 항공기는 1998년 1월에 취역하여 이스라엘 공군의 주력기가 되었습니다. 라암은 맥도넬 더글러스(현 보잉)가 이스라엘을 위해 특별히 설계한 F-15E 스트라이크 이글의 특별 사양입니다. 엄청난 탑재량과 고도화된 체계 덕분에, 밤낮을 가리지 않고 모든 기상 조건에서 저고도로 장거리 종심 타격을 대량의 무장을 싣고 수행할 수 있습니다."
 ISR_sufa: "수파"
 ISR_sufa_desc: "'수파(Sufa, 폭풍)'라는 별칭을 가진 F-16I는 이스라엘 공군의 요구 사항에 맞춰 재설계 및 맞춤 개조된 F-16 버전입니다. F-16I는 미 공군이 운용하는 기체들을 포함하여, 다른 모든 F-16 파생형과는 차별화된 기종입니다."
 ISR_snunit: "스누닛"
 ISR_snunit_desc: "그로프 G 120은 독일의 2인승 훈련기입니다. 이스라엘 공군에서 조종사 훈련용으로 활발히 사용되고 있습니다."
 ISR_lavi: "라비"
 ISR_lavi_desc: "IAI 라비는 IAI가 제작한 시제 전투기입니다. 이 프로젝트는 종료되었으나, 다른 나라의 일부 전투기 개발 사업은 라비 개발 과정에서 이루어진 연구의 성과를 활용하고 있습니다."
 ISR_adir: "아디르 인수"
 ISR_adir_desc: "이스라엘의 록히드 마틴 F-35 라이트닝 II 도입은 이스라엘 정부가 자국 공군을 위해 F-35I \"아디르(Adir)\"를 도입하기로 한 협정의 결과물입니다. 2017년 12월, 최초 9대의 F-35가 이스라엘 공군에 실전 배치되어 운용을 시작했습니다."
 ISR_repair_the_atalefs: "아탈레프 정비"
 ISR_repair_the_atalefs_desc: "유로콥터 AS565 팬서 아탈레프는 민간용 유로콥터 AS365 도팽의 군용형인 프랑스의 다목적 헬리콥터입니다. 팬서는 공중 지원, 전투 강하, 지상 표적 대응, 대잠 방어, 수색 및 구조, 사상자 후송 등 광범위한 임무에 사용됩니다."
 ISR_yassur: "야수르"
 ISR_yassur_desc: "CH-53 시 스탤리언(시코르스키 S-65)은 미국 제조사 시코르스키 에어크래프트가 설계하고 제작한 미국의 대형 수송 헬리콥터 계열입니다."
 ISR_yanshuf: "얀슈프"
 ISR_yanshuf_desc: "시코르스키 UH-60 블랙호크는 시코르스키 에어크래프트가 제조한 4엽 로터, 쌍발 엔진의 중형 다목적 군용 헬리콥터입니다. 시코르스키는 1972년 미 육군의 다목적 전술 수송기 체계(UTTAS) 경쟁에 S-70 설계를 제출했습니다."
 ISR_saraph: "사라프 인수"
 ISR_saraph_desc: "보잉 AH-64 아파치는 미국의 쌍발 터보샤프트 공격 헬리콥터로, 후륜식 착륙 장치와 2인 승무원을 위한 직렬 조종석을 갖추고 있습니다."
 ISR_unit_669: "669 부대"
 ISR_air_officers: "비행을 위한 선별"
 ISR_air_officers_desc: "전문 조종사만을 공군 병사와 장교로 선발해야 합니다. 다만 이러한 정책 변경은 크네세트의 승인이 필요할 수 있습니다."
 ISR_air_reservists: "현상 유지"
 ISR_air_reservists_desc: "속성 훈련을 받은 예비군이 우리 공군의 핵심이 되는 전략을 강화해야 합니다."
 ISR_aerospace_industries_focus: "이스라엘 항공우주산업"
 ISR_aerospace_industries_focus_desc: "이스라엘 항공우주산업(IAI)은 이스라엘의 주요 항공우주 및 항공기 제조업체로, 군사용과 민간용 모두를 위한 항공 및 우주 체계를 생산합니다."
 ISR_ilan_ramon: "일란 라몬의 비행"
 ISR_ilan_ramon_desc: "일란 라몬은 이스라엘의 전투기 조종사이자 최초의 이스라엘 우주비행사입니다. 그는 우주에 가는 최초의 이스라엘인이 될 것입니다. 모든 것이 순조롭기를 바랍시다."
 ISR_air_defence_pact: "방공 협정"
 ISR_spaceil: "스페이스IL 설립"
 ISR_spaceil_desc: "스페이스IL은 과학과 과학 교육을 진흥하기 위해 활동하는 비영리 단체입니다. 그러나 스페이스IL은 다양한 우주선을 우주로 발사하고, 나아가 달에 착륙할 계획도 가지고 있습니다."
 ISR_bereshit: "창세기 탐사선 발사"
 ISR_bereshit_desc: "베레시트 1호를 발사하여 달에 도달시키고 스페이스IL의 새로운 출발점을 마련해야 합니다!"
 ISR_project_samson: "삼손 프로젝트"
 ISR_project_samson_desc: "삼손 옵션은 이스라엘의 상당 부분을 침공하거나 파괴한 군대를 보유한 국가에 대해, 최후의 수단으로 핵무기를 이용한 대규모 보복을 가하는 이스라엘의 억제 전략입니다."
 ISR_ofek_satellites: "오펙 준비"
 ISR_ofek_satellites_desc: "오펙은 이스라엘 정찰 위성 시리즈의 명칭입니다. 대부분의 오펙 위성은 지중해 연안에 위치한 이스라엘의 팔마힘 공군기지에서 샤비트 발사체에 실려 발사되었습니다. 저궤도 위성은 90분마다 지구를 한 바퀴 돕니다."
 ISR_davids_sling: "다윗의 물매"
 ISR_davids_sling_desc: "이전에 매직 완드로도 알려졌던 다윗의 물매는 적 항공기, 드론, 전술 탄도 미사일, 중장거리 로켓 및 순항 미사일을 요격하도록 설계된 이스라엘 국방군의 군사 체계입니다."
 ISR_magic_wand: "매직 완드"
 ISR_magic_wand_desc: "매직 완드는 향후 다윗의 물매 프로젝트의 기반이 될 미사일 시제품의 명칭입니다."
 ISR_jericho_missile: "예리코 개량"
 ISR_jericho_missile_desc: "예리코는 1960년대부터 이스라엘이 개발하여 배치한, 느슨하게 연관된 탄도 미사일 계열에 붙여진 통칭입니다."
 ISR_arrow: "애로 시험"
 ISR_arrow_desc: "애로 또는 헤츠는 MIM-104 패트리어트 지대공 미사일보다 탄도 미사일에 더 효과적인 미사일 방어 체계를 요구한 이스라엘의 필요에 부응하기 위해 설계된 탄도탄 요격 미사일 계열입니다."
 ISR_iron_dome: "아이언 돔"
 ISR_iron_dome_desc: "아이언 돔은 라파엘 어드밴스드 디펜스 시스템즈와 이스라엘 항공우주산업이 개발한 이스라엘의 전천후 기동 방공 체계입니다. 이 체계는 4~70킬로미터 거리에서 발사되어 이스라엘 인구 밀집 지역을 향하는 궤적을 가진 단거리 로켓과 포탄을 요격하고 파괴하도록 설계되었습니다."
 ISR_reconsider_lebanese_policy: "레바논 정책 재고"
 ISR_reconsider_lebanese_policy_desc: "레바논과 헤즈볼라에 대한 우리의 입장을 재고하고 마침내 북부의 문제를 해결해야 합니다..."
 ISR_accept_the_equation: "그의 등식 수용"
 ISR_accept_the_equation_desc: "직접적으로 나서지 말고 시리아 내의 헤즈볼라만 공격해야 합니다. 그래야 레바논의 상황이 확대되지 않고 더욱 신중한 조치를 취할 수 있습니다..."
 ISR_reject_the_equation: "그의 등식 거부"
 ISR_reject_the_equation_desc: "테러리스트들이 강요하는 규칙에 굴복해서는 안 됩니다! 이 골칫거리를 지도에서 지우기 위해 헤즈볼라를 직접 공격할 것입니다!"
 ISR_premptive_strike_lebanon: "그들을 석기 시대로 돌려보내자"
 ISR_premptive_strike_lebanon_desc: "우리는 오랫동안 헤즈볼라의 존재를 견뎌 왔습니다. 이제 그들 모두를 석기 시대로 돌려보낼 때입니다!"
 ISR_sponser_insurgets_lebanon: "소리 없는 손"
 ISR_sponser_insurgets_lebanon_desc: "미래의 전쟁에서 성공을 보장하기 위해 레바논 내의 친이스라엘 단체들을 지원해야 합니다..."
 ISR_recon_planes_lebanon: "머리 위로 나서다"
 ISR_recon_planes_lebanon_desc: "우리의 정찰기를 레바논 상공에 띄우면 그들의 영공을 이용할 수 있습니다."
 ISR_northern_shield: "북방 방패 작전"
 ISR_northern_shield_desc: "헤즈볼라는 때가 되면 우리 국경에 침투하기 위해 깊은 터널을 파 왔습니다. 이를 막아야 합니다."
 ISR_fortify_har_dov: "하르 도브 요새화"
 ISR_fortify_har_dov_desc: "헤즈볼라와의 국경을 요새화하고 전면전에 대비해야 합니다."
 ISR_prepare_radwan: "갈릴리 수호"
 ISR_prepare_radwan_desc: "라드완 부대에 침투하여 그들의 조직을 악화시켜야 합니다."
 ISR_hold_him_accountable: "책임 추궁"
 ISR_hold_him_accountable_desc: "하마스가 헤즈볼라에 우리를 향한 미사일 공격의 거점을 제공하도록 요청하고 있습니다. 이에 대한 책임을 물어야 합니다."
 ISR_speak_to_cabinet: "내각과의 회의"
 ISR_speak_to_cabinet_desc: "우리나라는 팔레스타인과 헤즈볼라와 관련된 많은 문제를 안고 있습니다. 가능한 행동 방침을 논의하기 위해 긴급 내각 회의를 소집해야 합니다."
 ISR_intifada_darkest_hour: "베콜 도르 바도르"
 ISR_intifada_darkest_hour_desc: "유월절의 유명한 유대 시편에는 이렇게 쓰여 있습니다. '세대마다 그들이 우리를 멸하려고 일어나나, 하나님께서 그들의 손에서 우리를 구하신다.' 모든 주요 도시에서 버스가 폭파되고 수백 명의 이스라엘인이 쓰러진 지금, 이는 유대 민족을 덮친 또 하나의 세대일 뿐입니다. 이번이 마지막이 되도록 합시다."
 ISR_rely_on_shabac: "샤박에 의존"
 ISR_rely_on_shabac_desc: "샤박은 아만, 모사드와 함께 이스라엘 정보 공동체의 3대 주요 기관 중 하나입니다."
 ISR_rely_on_8200: "ISNU에 의존"
 ISR_rely_on_8200_desc: "8200 부대는 비밀 작전, 신호 정보 수집과 암호 해독, 방첩, 사이버전, 군사 정보, 감시를 책임지는 이스라엘 국방군 정보 병과 소속 부대입니다."
 ISR_establish_tzamams: "차맘 설치"
 ISR_establish_tzamams_desc: "정보기관들이 협력하고 활동을 조율할 수 있도록 차맘을 설치해야 합니다."
 ISR_recover_josephs_tomb: "요셉의 무덤의 운명"
 ISR_recover_josephs_tomb_desc: "유대인들이 장갑차를 타고 나블루스의 요셉의 무덤을 계속 방문하도록 허용할지 여부를 결정해야 합니다."
 ISR_operation_noahs_ark: "노아의 방주 나포"
 ISR_operation_noahs_ark_desc: "이란은 선박을 통해 팔레스타인에 무기를 전달하는 계획을 꾸몄습니다. 이를 선제적으로 저지해야 합니다."
 ISR_operation_defensive_shield: "호마트 마게헨 작전"
 ISR_operation_defensive_shield_desc: "우리는 서안지구에 다시 진입하여 테러의 위협을 직접 뿌리 뽑아야 합니다. 아라파트는 우리를 돕지 않기로 선택했습니다."
 ISR_operation_city_wall: "이르 호마 작전"
 ISR_operation_city_wall_desc: "팔레스타인은 우리의 단순한 지원만을 받는 조건으로 자체적으로 대테러 작전을 수행하기로 동의했습니다. 어떻게 될지 지켜봅시다..."
 ISR_nohal_shakhen: "이웃 절차"
 ISR_nohal_shakhen_desc: "이웃 절차란 체포 작전 중, 수배자가 머무르고 있다고 추정되는 집에 이웃 주민을 보내 그 집을 나가 안으로 들어가서 안에 있는 모든 사람에게 밖으로 나오라고 부르게 하는 것입니다."
 ISR_refuse_nohal: "절차 거부"
 ISR_refuse_nohal_desc: "테러리스트를 상대하는 경우라 할지라도 모든 비인도적 절차를 거부해야 합니다."
 ISR_disentanglement_plan: "분리 계획"
 ISR_disengagement_plan: "철수 계획"
 ISR_disengagement_plan_desc: "가자 지구의 이스라엘 정착촌과 서안지구의 이스라엘 정착촌 네 곳이 일방적으로 철거됩니다. 이스라엘 정착민과 군은 가자 지구 내부에서 철수하며, 군 병력은 국경을 따라 재배치됩니다."
 ISR_economic_borders: "번영의 국경"
 ISR_economic_borders_desc: "우리와 팔레스타인 사이에 경제적 국경을 만들어 무역과 상호 투자를 증진해야 합니다."
 ISR_construct_the_wall_settlements: "정착촌 포함"
 ISR_construct_the_wall_settlements_desc: "서안지구 주변에 장벽을 건설해야 하며, 우리의 정착촌도 포함해야 합니다."
 ISR_construct_the_wall_no_settlements: "서안지구 장벽 건설"
 ISR_construct_the_wall_no_settlements_desc: "정착촌을 포기해서는 안 되지만, 장벽은 우리 본토를 법적인 팔레스타인 및 서안지구와 분리해야 합니다."
 ISR_propose_hudna: "후드나 제안"
 ISR_propose_hudna_desc: "가자 지구를 경제적으로 봉쇄하기 전에, 가자의 미래 번영을 위한 자금이 두둑한 좋은 제안을 해 보면 어떨까요. 어쩌면 통할지도 모릅니다... 아마도."
 ISR_blockade_gaza: "격리 조치"
 ISR_blockade_gaza_desc: "테러리스트들이 우리 국경을 넘지 못하도록 가자 지구를 봉쇄해야 합니다. 가자를 포위하고 향후의 충돌에 대비해야 합니다..."
 ISR_gaza_uprising: "가자 봉기"
 ISR_gaza_uprising_desc: "급진주의자들이 가자를 장악했습니다. 지금 당장 조치를 취해야 합니다."
 ISR_question_gazan_workers: "가자의 저임금 노동력"
 ISR_question_gazan_workers_desc: "가자의 저임금 노동자들이 이스라엘에서 일하도록 장려하고, 가자 지구의 급진 정권에는 이익이 돌아가지 않도록 해야 합니다."
 ISR_ships_not_pass: "선박은 통과할 수 없다"
 ISR_ships_not_pass_desc: "외국 선박은 가자 지구로 통과할 수 없습니다. 가자의 테러리스트들에게 물자를 공급하는 가자 자유 선단의 민간 선박 여섯 척을 급습해야 합니다."
 ISR_egypt_joint_blockade: "이집트와의 협상"
 ISR_egypt_joint_blockade_desc: "어쩌면 이집트가 우리와 함께 가자 지구를 봉쇄하도록 설득해 볼 수 있습니다."
 ISR_limit_fishing_rights: "가자 어업 구역 제한"
 ISR_limit_fishing_rights_desc: "봉쇄를 강화하기 위해 가자의 어업 구역을 제한해야 합니다."
 ISR_qatari_dollars_yes: "후원자의 돈가방 허용"
 ISR_qatari_dollars_yes_desc: "단기 휴전의 대가로 가자 테러리스트들의 후원자들이 그들에게 급여를 보내도록 허용해야 합니다."
 ISR_qatari_dollars_no: "도하 외면"
 ISR_qatari_dollars_no_desc: "가자로 돈이 흘러 들어가서는 안 됩니다. 적어도 우리가 막을 수 있는 한도 내에서는 그렇습니다."
 ISR_saudi_donations: "사우디 제안 수락"
 ISR_emirati_donations: "에미리트 제안 수락"
 ISR_gazan_casinos: "알레만 제안"
 ISR_gazan_casinos_desc: "가자 지구를 새로운 라스베이거스로 만들어 보아야 합니다. 수익이 흘러들고 도시가 번영하기를..."
 ISR_gazan_port: "가자 항구 개발"
 ISR_gazan_port_desc: "새로운 가자 개발 계획의 첫 단계 중 하나로, 가자에 새 항구를 건설해야 합니다."
 ISR_gazan_airport: "가자 공항 건설"
 ISR_gazan_airport_desc: "새로운 관광객 유입에 대비하여 가자에 새 공항을 건설해야 합니다."
 ISR_little_singapore: "작은 싱가포르"
 ISR_little_singapore_desc: "가자는 중동의 새로운 작은 싱가포르가 될 것입니다."
 ISR_shalit_agreement: "우리 아이를 집으로"
 ISR_shalit_agreement_desc: "가자 정부에 인질로 잡혀 있는 이스라엘 포로와 관련한 제안을 논의해야 합니다..."
 ISR_jericho_walls: "예리코의 성벽을 무너뜨려라"
 ISR_jericho_walls_desc: "예리코의 성벽을 무너뜨리고 가자로 진입하여 이 골칫거리를 단번에 끝내야 합니다..."
 ISR_operation_sea_of_mercy: "얌 하라하밈 작전"
 ISR_operation_sea_of_mercy_desc: "우리의 인내심은 너무 오랫동안 시험받아 왔습니다. 때가 왔습니다."
 ISR_jenin_situation: "쇼베르 갈림 작전"
 ISR_jenin_situation_desc: "서안지구의 테러 기반 시설에 대한 작전을 개시하며, 정부는 필요한 모든 것을 사용할 수 있는 전권과 허가를 우리에게 부여했습니다."
 ISR_daniel_lions_cage: "사자 굴 속의 다니엘"
 ISR_daniel_lions_cage_desc: "팔레스타인은 너무 오랫동안 우리에게 골칫거리였습니다. 이제 이 문제를 마침내 단번에 해결할 때가 되었습니다."
 ISR_tear_down_oslo: "오슬로 협정 폐기"
 ISR_tear_down_oslo_desc: "오슬로 협정은 우리의 힘을 막으려는 족쇄일 뿐입니다! 이 어리석은 협정을 파기하고 강경한 조치를 시작해야 합니다!"
 ISR_disarm_the_palestinian_forces: "파타 당국 무장 해제"
 ISR_disarm_the_palestinian_forces_desc: "마침내 서안지구에 진입하여 팔레스타인 자치정부를 무장 해제하고 이 이야기에 종지부를 찍어야 합니다."
 ISR_strangle_jenin: "제닌 압박"
 ISR_strangle_jenin_desc: "우리 군이 주도하는 제한적인 작전을 서안지구에서 수행할 준비를 해야 합니다."
 ISR_restore_palestinian_authority: "서안지구 질서 회복"
 ISR_restore_palestinian_authority_desc: "국제법을 준수하며 서안지구의 질서를 회복해야 합니다."
 ISR_arm_their_security_services: "팔레스타인 보안 기관 무장"
 ISR_arm_their_security_services_desc: "팔레스타인은 대테러 노력에서 우리와 협력하기로 동의했습니다. 이제 공동 작전을 수행하기 위해 그들의 보안 기관을 무장시켜야 합니다."
 ISR_restart_negotiations: "파타 정통성 부여"
 ISR_restart_negotiations_desc: "파타는 팔레스타인에서 유일한 협력적 정부이므로 파타에 정통성을 부여하고 지원해야 합니다."
 ISR_deligitimize_abbas: "반압바스 선전"
 ISR_deligitimize_abbas_desc: "마흐무드 압바스의 정통성을 부정하고 그에 대한 선전 활동을 시작해야 합니다."
 ISR_deal_with_nablus: "나블루스 포위"
 ISR_deal_with_nablus_desc: "팔레스타인 지하디스트들이 나블루스의 카스바를 장악하고 있습니다. 이곳을 급습하여 테러리스트들을 체포해야 합니다."
 ISR_focus_on_the_clusters: "정착촌 단지 중시"
 ISR_focus_on_the_clusters_desc: "두 국가 해법을 지지하고 정착촌 단지에 집중해야 합니다."
 ISR_the_enclave_settlements: "규제법"
 ISR_the_enclave_settlements_desc: "서안지구에서 더 고립된 정착촌에 집중하고, 정착촌 지원을 위해 보다 강경한 수단을 추진해야 합니다."
 ISR_yesha_council: "예샤 평의회 결성"
 ISR_yesha_council_desc: "예샤 평의회는 서안지구 유대인 정착촌 지방 의회들의 연합 조직으로, 히브리어 약어 '예샤'로 알려져 있습니다."
 ISR_settlement_amona: "아모나 합법화"
 ISR_settlement_amona_desc: "아모나 토지 사유화 문제를 어떻게 처리할지 결정해야 합니다."
 ISR_settlement_evyatar: "에비아타르 수호"
 ISR_settlement_evyatar_desc: "안보부와 정착민들이 에비아타르를 두고 협상 중입니다. 입장을 정하고 아마도 문제를 해결해야 합니다."
 ISR_settlement_homesh: "호메시 예시바 수호"
 ISR_settlement_homesh_desc: "이제 호메시 예시바를 어떻게 할지 결정해야 합니다."
 ISR_samarian_wine: "사마리아 와인"
 ISR_samarian_wine_desc: "쇼므론은 이스라엘 최대의 와인 산지로, 샤론 평원, 카르멜 산, 라마트 므나셰를 포함한 하이파 항구 남쪽의 해안 지대로 구성됩니다."
 ISR_expand_gush_etzion: "구시 에치온 확장"
 ISR_expand_gush_etzion_desc: "구시 에치온은 서안지구의 예루살렘과 베들레헴 바로 남쪽에 있는 유다 산지에 위치한 이스라엘 정착촌 단지입니다."
 ISR_ariel_industrial_zone: "아리엘 산업 지구"
 ISR_ariel_industrial_zone_desc: "아리엘은 이스라엘 점령지의 일부인 서안지구 중부에 시 의회 형태로 조직된 이스라엘 정착촌으로, 그린 라인에서 동쪽으로 약 20킬로미터, 요르단 국경에서 서쪽으로 34킬로미터 떨어져 있습니다."
 ISR_edumim_tourist_mall_center: "말레 아두밈 설계 도시"
 ISR_edumim_tourist_mall_center_desc: "말레 아두밈은 예루살렘에서 동쪽으로 7킬로미터 떨어진 서안지구의 도시형 이스라엘 정착촌으로, 시 의회 형태로 조직되어 있습니다."
 ISR_support_our_pmcs: "우리 PMC 지원"
 ISR_support_our_pmcs_desc: "PMC는 이미 전 세계에서 그 실용성과 유용성을 입증했습니다. 방어와 적대 세력에 대한 대리전을 위해 우리만의 PMC를 만들어야 합니다."
 ISR_keep_them_checked: "PMC 견제"
 ISR_keep_them_checked_desc: "우리만의 민간 군사 기업을 가지게 된 것은 기쁜 일이지만, 군 내의 반란과 무질서를 막기 위해 이들을 신중하게 통제하는 것이 필요합니다."
 ISR_jewish_outer_heaven: "유대인의 아우터 헤븐"
 ISR_jewish_outer_heaven_desc: "PMC를 통제하는 것은 그들의 입지를 악화시킬 뿐입니다. 그들을 뒤쫓으면 그들의 독립성이 떨어지게 되고, 이는 그들이 효율성을 잃게 된다는 뜻입니다."
 ISR_tavor: "TAR-21"
 ISR_tavor_desc: "TAR-21은 이스라엘 웨폰 인더스트리즈가 제조하는 현대 이스라엘의 5.56x45mm 돌격소총 모델입니다."
 ISR_IWI_com: "IWI"
 ISR_IWI_com_desc: "IWI는 무기의 개발, 생산 및 판매를 전문으로 하는 이스라엘의 민간 기업입니다. 이 회사는 국영 군수 기업 이스라엘 밀리터리 인더스트리즈 소속이던 마겐 공장이 민영화된 후 설립되었습니다. 주요 제품 소비처는 이스라엘 정보기관과 이스라엘 국방군입니다."
 ISR_fab_defense: "FAB 디펜스"
 ISR_fab_defense_desc: "이스라엘 기업 FAB 디펜스는 50년 동안 소형 화기용 액세서리와 튜닝 제품을 개발하고 제조해 왔으며, 현재 국제 무대에서 선도적인 위치를 차지하고 있습니다. 제품을 개발할 때 이 회사의 기술자들은 경찰과 군 같은 이스라엘 법 집행 기관의 경험과 요구를 적극 활용하며, 전 세계의 SWAT 부대와도 긴밀히 협력하고 있습니다."
 ISR_ak_alfa: "AK 알파 프로젝트"
 ISR_ak_alfa_desc: "칼라시니코프 콘체른과의 협력을 통해 우리 군을 위한 새로운 무기를 만들 수 있으며, 무기 개발에 관한 러시아의 경험도 배울 수 있습니다."
 ISR_gideon_plan_idea: "기드온 계획"
 ISR_tenufa_project_idea: "트누파 프로젝트"
 ISR_paphos_drills_1: "파포스 전쟁 연습"
 ISR_civillian_exports: "민수용 수출"
 ISR_civillian_exports_desc: "우리 무기의 일부를 민간 시장에 수출해야 합니다. 장기적으로 많은 수익을 가져다줄 것입니다."
 civ_guns_exports: "민수용 무기 수출"
 ISR_Labour: "아보다"
 ISR_barak_tree: "에후드 바라크"
 ISR_dawn_of_a_new_day: "새로운 날의 여명"
 ISR_dawn_of_a_new_day_desc: "새천년이 시작되었으며, 미래가 우리에게 무엇을 가져다줄지 알기 위해 과거의 문제들을 해결해야 합니다. 우리는 한동안 남레바논을 점령해 왔으며, 이제 이 구상의 운명을 결정해야 합니다."
 ISR_south_lebanon_repatriation_act: "레바논 병사 송환법"
 ISR_south_lebanon_repatriation_act_desc: "우리는 프랑스에 어느 정도 영향력이 있고 레바논은 프랑스의 옛 식민지이므로, 레바논 병사들이 그곳으로 이주하도록 할 수 있습니다."
 ISR_south_lebanon_fighters_act: "남레바논 전투원법"
 ISR_south_lebanon_fighters_act_desc: "헤즈볼라가 집권할 경우 박해를 두려워하는 레바논 기독교인들이 이스라엘로 이주할 수 있도록 허용해야 합니다."
 ISR_herzog_declaration: "헤르조그 선언"
 ISR_herzog_declaration_desc: "정부는 크네세트에서 남레바논 병력 철수에 관한 협상을 시작해야 합니다. 이는 여론을 진정시킬 약간의 시간을 벌어 줄 것입니다."
 ISR_abandon_ansar_prison: "안사르 교도소의 운명"
 ISR_abandon_ansar_prison_desc: "안사르 교도소에는 90년대에 우리가 포로로 잡은 헤즈볼라의 병사와 테러리스트가 가득합니다. 이곳을 어떻게 처리할지 결정해야 합니다."
 ISR_withdraw_from_the_security_belt: "우리 아이들을 집으로"
 ISR_withdraw_from_the_security_belt_desc: "우리 병력을 본국으로 복귀시켜 국민의 요구를 충족해야 합니다."
 ISR_camp_david_2000: "캠프 데이비드 회담"
 ISR_camp_david_2000_desc: "팔레스타인, 이스라엘, 미국의 지도자들이 완전한 평화 협정의 가능성을 논의하기 위해 캠프 데이비드에서 만나기로 합의했습니다."
 ISR_talk_to_sharon: "샤론 설득"
 ISR_talk_to_sharon_desc: "아리엘 샤론이 성전산을 방문하지 않도록 설득해야 합니다. 이는 긍정적인 결과를 가져오지 못할 위험한 모험입니다."
 ISR_respond_with_caution: "신중한 대응"
 ISR_respond_with_caution_desc: "최근의 소요 사태에 신중하게 대응해야 하며, 어쩌면 샤론에게 그의 행동에 대한 대가를 치르게 해야 합니다."
 ISR_dont_show_weakness: "약점을 보이지 마라"
 ISR_dont_show_weakness_desc: "내부의 적들에게 약점을 보여서는 안 됩니다. 시위는 진압되어야 합니다!"
