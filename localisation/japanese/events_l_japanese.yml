 MD_character_army.1.t: "[FROM.GetName] is killed in action"
 MD_character_army.1.d: "After commanding [FROM.GetHersHis] forces to retreat, it seems [FROM.GetRank] [FROM.GetName] was caught under fire from enemy units, and was killed on duty. [FROM.GetHersHisCap] body is recovered, and a state funeral is on the way."
 MD_character_army.1.a: "A loss for the nation."
 MD_character_army.2.t: "[FROM.GetName] is killed in action"
 MD_character_army.2.d: "After securing another victory, it seems [FROM.GetRank] [FROM.GetName] was attacked by regrouping units of the enemy, and was killed on duty. [FROM.GetHersHisCap] body is recovered, and a state funeral is on the way."
 MD_character_army.2.a: "A loss for the nation."
 civil_war_debuff.1.t: "軍の立て直し"
 civil_war_debuff.1.d: "The initial shock of the civil war sent our nation into complete chaos. We lost contact with some of our military units and our commanders, our supply depots stopped responding and we didn't even know where our enemy was. The fronts have now stabilised and it is a bit more clear who is on whose side, but many challenges still remain.\n\nOur military is composed of veterans and volunteers, with no clear picture of the chain of command. We are struggling with supplying our troops and establishing direct supply routes. We also don't have a clear picture of battles that have been fought and what tactics our enemy is using. What should we do first?"
 civil_war_debuff.1.a: "指揮系統を明確にする必要がある！"
 civil_war_debuff.1.b: "武器が必要だ。大量の武器が。"
 civil_war_debuff.1.c: "全て記録しろ！敵を研究するんだ。"
 civil_war_debuff.2.t: "軍の立て直し"
 civil_war_debuff.2.d: "長い間、軍は混乱した状況にあったが、ようやく状況が改善してきた。軍の大まかな位置や状況が把握でき、いくつかの補給線を確保することに成功した。ただし、軍全体の一体性は依然として欠けていて、多くの部隊や民兵が中央指令から独立して行動している。\n\n軍には指揮系統があるものの、責任や権限が必ずしも尊重されていない。武器の供給はある程度安定しているが、多くの部隊が独自の補給品に頼っている。また、部隊全体で共通の戦術が定義されていない。改善するためには何を優先すべきだろうか？"
 civil_war_debuff.2.a: "部隊は自分たちの任務と指揮者を明確に把握する必要がある"
 civil_war_debuff.2.b: "バラバラの軍需調達は許されない"
 civil_war_debuff.2.c: "部隊に野戦マニュアルを配布しよう"
 civil_war_debuff.3.t: "軍の立て直し"
 civil_war_debuff.3.d: "The confusion in our military is starting to disappear. The way our soldiers act is starting to resemble an actual military now. Some minor problems still remain.\n\nThere exists some duplicate commands where commanders' authorities overlap. Military procurement orders sometimes disappear, and the money intended for them ends up outside of the troops. We are losing a lot of field experience and trainers as soldiers are discharged without documentation and casualties are not properly tracked. What should we try to improve?"
 civil_war_debuff.3.a: "司令部を明確にし、内部紛争を解決せよ。"
 civil_war_debuff.3.b: "軍需品の購入のために汚職と闘う。"
 civil_war_debuff.3.c: "Set up a process for passing down field experience."
 civil_war_debuff.4.t: "軍の立て直し"
 civil_war_debuff.4.d: "我々はかなり回復してきている。いくつかの小さな問題が残っているが、我が軍は内戦前の姿に近づいている。ほんのいくつかの組織改革が軍隊を再び完全なものにするはずである。\n\n依然として軍隊に完全に統合されていないいくつかの民兵が存在する。我々が購入し生産している装備の一部は互換性がない。最高司令部は戦争からの戦闘経験を分析するための追加物資を要求している。改善するためには何を優先すべきだろうか？"
 civil_war_debuff.4.a: "残りの民兵を統合せよ。"
 civil_war_debuff.4.b: "装備備蓄を統一せよ。"
 civil_war_debuff.4.c: "最高司令部に追加の将校を割り当てよ。"
 civil_war_debuff.5.t: "軍の立て直し"
 civil_war_debuff.5.d: "成し遂げた。非効率的な軍隊の改革を始めてから2年、我々は内戦によって引き起こされた損害を克服した。我々は今、内部ではなく、外部の脅威から我々を守るための軍隊を再び取り戻した。"
 civil_war_debuff.5.a: "[ROOT.GetNameDef]にとって素晴らしき日だ！"
 protests.1.t: "Rising Tensions"
 protests.1.d: "The public unrest is growing due to dissatisfaction with government spending. Protests are becoming more frequent and radicalized. The administration must choose between taking a firm stance or attempting to appease the masses."
 protests.1.a: "Ignore them"
 protests.1.b: "Enforce Order"
 protests.1.c: "交渉開始だ"
 protests.2.t: "政治力闘争"
 protests.2.d: "国民の不満が高まる中、政治的な駆け引きはより不安定になっている。このような状況では、過激化が進む危険を冒して政治力を守るか、より深刻な結果を招くかもしれない賭けに出るかの選択が求められる。"
 protests.2.a: "賽を投げろ"
 protests.2.b: "現状を保つ"
 protests.2.c: "交渉開始だ"
 protests.3.t: "指導力の危機"
 protests.3.d: "抗議活動が続く中、与党の支持率は揺らいでいる。政府は、権力を強化するか弱体化させるかの分岐点に立たされている。この決断の結果は、国の政治情勢に長期的な影響を及ぼす可能性がある。"
 protests.3.a: "抗議活動を無視する"
 protests.3.b: "過激派を解散させる"
 protests.3.c: "交渉開始だ"
 protests.4.t: "Foreign Meddling"
 protests.4.d: "As domestic unrest grows, foreign powers are taking interest. The government must decide between accepting foreign influence as it is or trying to control foreign agents."
 protests.4.a: "Don't make hasty moves"
 protests.4.b: "Find every last one of them"
 protests.4.c: "交渉開始だ"
 protests.5.t: "Stalled Progress"
 protests.5.d: "The protests are causing a significant slowdown in construction projects nationwide. The administration must choose between mitigating the effects for a shorter duration or attempting to pacify the protestors, risking longer delays."
 protests.5.a: "This will surely stop in a few days"
 protests.5.b: "Now police will have some work"
 protests.5.c: "交渉開始だ"
 protests.6.t: "軍需生産の危機"
 protests.6.d: "拡大する不安が軍需生産に影響を及ぼしており、政府は重要な決断を迫られている。生産を維持するための措置を強行するべきか、それとも抗議活動の緩和を試みて、結果的に生産危機を悪化させる可能性を受け入れるべきか？"
 protests.6.a: "彼らはすぐに戻ってくるだろう"
 protests.6.b: "武力で生産を維持する"
 protests.6.c: "交渉開始だ"
 protests.10.t: "Nation on the Brink"
 protests.10.d: "Public unrest has reached a critical level. The government's decision now may either lead to further destabilization or an even more radicalized populace. The situation is dire."
 protests.10.a: "This will go over"
 protests.10.b: "Suppress at All Costs"
 protests.10.c: "彼らの要求を受け入れよう。"
 protests.11.t: "Political Turmoil"
 protests.11.d: "The political landscape is now in chaos. A choice between a significant loss of political power or a risky play with even greater potential losses must be made. The stakes are higher than ever."
 protests.11.a: "This will go over"
 protests.11.b: "National guard to the rescue"
 protests.11.c: "彼らの要求を受け入れよう。"
 protests.12.t: "Collapse of Trust"
 protests.12.d: "Trust in the ruling party is eroding rapidly. A pivotal decision that may further diminish the party's popularity or risk a total collapse of political authority awaits. The nation watches with bated breath."
 protests.12.a: "This will go over"
 protests.12.b: "Use force"
 protests.12.c: "彼らの要求を受け入れよう。"
 protests.13.t: "Grinding Halt"
 protests.13.d: "Construction nationwide is severely affected. With the stakes raised, the government must decide between a drastic reduction in speed for a sustained period or a potentially catastrophic negotiation with protestors."
 protests.13.a: "We can't address that right now"
 protests.13.b: "Enforce the work"
 protests.13.c: "彼らの要求を受け入れよう。"
 protests.14.t: "War Machine Faltering"
 protests.14.d: "With military production in crisis, the government faces an agonizing choice. They must either enforce measures that will drastically affect output for an extended period or gamble with even more significant consequences."
 protests.14.a: "We cant address that right now"
 protests.14.b: "Where is my national guard?"
 protests.14.c: "彼らの要求を受け入れよう。"
 protests.20.t: "The Breaking Point"
 protests.20.d: "Years of unrest, dissatisfaction, and failed negotiations have culminated in a moment of national catastrophe. What began as a murmur of discontent has grown into a deafening cry for revolution, and the streets are now filled with the clamor of conflict. Despite attempts to quell the unrest, reconcile differences, and restore order, the government's efforts have proved fruitless. The people's trust has eroded, and their patience has worn thin. The nation stands divided, and the fabric of society is torn asunder. Neighbors turn against neighbors, and former friends become foes as lines are drawn and sides are chosen. The protestors have taken up arms, and the air is thick with the tension of impending battle. A new chapter in the nation's history is about to be written, and the ink is blood. The civil war begins."
 protests.20.a: "Brace for Conflict"
 econvent.13.t: "高債務による企業流出問題"
 econvent.13.d: "我が国の高い債務対GDP比率が、国内企業の閉鎖や国外への移転を引き起こしている。債務を削減することが急務だ。さもなければ、さらなる産業の流出を目の当たりにするかもしれない。"
 econvent.13.a: "企業の流出を許可する"
 econvent.13.b: "企業を買収する"
 econvent.14.t: "民間投資家が民需産業に投資"
 econvent.14.d: "A number of private investors have decided to invest in a new Civilian Industry within the nation. The new upstart factory will bring jobs and more prosperity to our nation. The additional construction and production capacity will certainly help in getting us moving economically speaking."
 econvent.14.a: "素晴らしい！"
 econvent.15.t: "Private Investors Invest in Office Parks"
 econvent.15.d: "A group of private investors have decided to invest in a number of smaller scale third-party services"
 econvent.15.a: "Amazing!"
 taiwan.13.b: "我々は決して後退しない"
 hongkong_news.1.t: "香港、大規模抗議デモ発生"
 hongkong_news.1.d: "中国政府が、香港の行政長官選挙で普通選挙を実施する可能性を排除したことを受け、香港で大規模な抗議デモが発生している。[HKG.GetLeader]は、香港政府として平和的かつ合法的な意見表明の権利を尊重するものの、暴力や無秩序は容認できないと表明した。中国の対応は依然として不透明であり、[CHI.GetLeader]は現時点で今回の事態についてコメントを発表していない。"
 hongkong_news.1.d_limit: "中国政府が、「行政長官の普通選挙を認めるが、その候補者は事前に政府の承認を受けなければならない」と決定したことを受け、香港で大規模な抗議デモが発生している。[HKG.GetLeader]は、香港政府として平和的かつ合法的な意見表明の権利を尊重するが、暴力や無秩序は容認できないと強調した。中国の対応は依然として不透明であり、[CHI.GetLeader]はこの問題についていまだコメントを出していない。"
 hongkong_news.1.d_reunification: "中国政府が「2047年に香港の特別な地位を失わせ、完全に中国の支配下に置く」と発表したことを受け、香港で大規模な抗議デモが発生している。[HKG.GetLeader]は、香港政府として平和的かつ合法的な意見表明の権利を尊重するが、暴力や無秩序は容認できないと述べた。中国の対応は依然として不透明であり、[CHI.GetLeader]はこの決定に関する抗議デモについていまだコメントを発表していない。"
 hongkong_news.1.d_annexed: "中国政府が香港を強引に併合したことを受け、香港で大規模な抗議デモが発生している。[HKG.GetLeader]は、香港政府として平和的かつ合法的な意見表明の権利を尊重するが、暴力や無秩序は容認できないと声明を発表した。中国の対応は依然として不透明であり、[CHI.GetLeader]はこの問題についていまだコメントを出していない。"
 hongkong_news.1.a: "興味深い進展だ"
 hongkong_news.1.b: "我々にとって悪いニュースだ。"
 hongkong_news.2.t: "香港抗議活動の収束"
 hongkong_news.2.d: "Protests in the Hong Kong Special Administrative Region against recent Chinese actions have gradually declined in recent days and have virtually come to a stop. Police operations in the Chinese territory have met with no resistance, and many who had previously taken to the streets have returned to their homes. What this means for the relationship between China and a troubled territory that holds significantly different political values from the former remains to be seen. Perhaps one indicator for what is to come was a banner left by protesters in a prominent location in the city center which read \"We will be back\"."
 hongkong_news.2.a: "興味深い進展だ"
 hongkong_news.2.b: "彼らは自分たちの大義が無駄だと理解している"
 hongkong_news.3.t: "香港で抗議活動が拡大"
 hongkong_news.3.d: "香港における中国の行動に対する抗議活動が急速に拡大し、規模や戦術の面で新たな段階に突入したと、多くの分析者が一致している。この新たなエスカレーションに対し、中国政府および香港政府がどのように対応するのかは未だ不明だが、両政府の関係者は抗議活動が自身の利権に与える影響にますます不満を募らせているとされる。一方、抗議者たちは、中国および香港政府が彼らの要求に応えるまで引き下がることを拒んでいる。"
 hongkong_news.3.a: "香港の人々は沈黙を保たないだろう……"
 hongkong_news.3.b: "身のためを思えば、大人しく家にいるだろう！"
 taiwan.15.t: "ストライキ継続"
 korea.8.t: "Radical Korean Movement Gains Popularity"
 korea.8.d: "Economic inequality in the Republic of Korea has contributed to growing dissatisfaction among the country's lower classes. Thousands of online activists have begun calling for greater equality through the establishment of community-level autonomy throughout the ROK. While the movement is leaderless and therefore lacks a central, clear message, the majority of its members seem to desire an abolition of the Korean state and the chaebols that it is tied to in favor of a system that distributes political and economic power among directly elected community-level representatives.\n\nThis new ideology, which rejects the foundational ideologies of both the ROK and the DPRK, represents a significant departure from the traditional politics of the South Korean radical left, which has either promoted leftist policies within South Korea's existing political system or called for the establishment of a North Korean-style state."
 korea.8.a: "Something is afoot in the ROK..."
 korea.9.t: "Rebels in the South Request Our Support"
 korea.9.d: "Representatives of the Korean National Liberation Movement seeking to overthrow the government in the South have come to us requesting an alliance so as to open up a new front along the DMZ."
 korea.9.a: "We will join their struggle!"
 korea.9.b: "We will watch from the sidelines."
 JUCHE_FACTION: "朝鮮反帝国主義戦線"
 korea.10.t: "South Korea requests that we end our protection of the North"
 korea.10.d: "For quite some time now South Korea has endeavored to show that it is no longer a country beholden to US interests. Relations between our two countries are at an all-time high, while our relations with the North have stagnated for the most part. Now a South Korean delegation has come to request an end to the defense treaty between us and the North Koreans. If we agree to their request, we will no longer come to North Korea's aid in the event of an external invasion."
 korea.10.a: "We will stand by our allies!"
 korea.10.b: "The North is not worth our protection."
 korea.11.t: "Korean Arms Companies Offer Products"
 korea.11.d: "The Republic of Korea is well known for its ability to produce high-quality weaponry at relatively affordable prices. We should consider whether to purchase some of their equipment, but our funds are not limitless so we should choose wisely."
 korea.11.a: "Purchase Korean tanks."
 korea.11.b: "Purchase Korean self-propelled artillery."
 korea.11.c: "Purchase Korean trainer jets."
 korea.11.e: "Purchase Korean assault rifles."
 korea.11.f: "Refuse offer."
 korea.12.t: "[FROM.GetName] Agrees to Arms Deal!"
 korea.12.d: "The representatives of this country have agreed to import arms from us, increasing our revenue and our international influence."
 korea.12.a: "Our international standing grows!"
 korea.13.t: "北京とソウル、日本の第二次世界大戦中の行為を共同批判"
 korea.13.d: "中国と大韓民国の政府が、日本の戦時中の行為と、それに対する完全な謝罪を拒んできた姿勢を批判する共同声明を発表した。これは異例の動きであり、多くの観察筋は、この声明がソウルによる北朝鮮への中国の支持を引き離す試みの一環であると解釈している。一方、平壌は[KOR.GetLeader]と[CHI.GetLeader]による共同非難に賛同を示しているものの、[NKO.GetLeader]は、中国がますますソウル寄りの姿勢を強めている兆候に懸念を抱いていると伝えられている。"
 korea.13.a: "我々は決して彼らの行いを忘れない。"
 korea.13.b: "彼らの批判にはうんざりだ……"
 korea.13.c: "過去の影は長く続く……"
 korea.14.t: "China Annuls Defense Treaty with North Korea"
 korea.14.d: "Following the removal of US military presence from South Korea, China has agreed to withdraw from its defense treaty with North Korea, drawing furious condemnation from Pyongyang. The move follows a long series of moves by Seoul to win China's support and demonstrate its autonomy from Washington. Some have hypothesized that now that the way is clear for forceful reunification, [KOR.GetLeader] has decided to retake the North by force."
 korea.14.a: "Our efforts have paid off."
 korea.14.b: "We have tolerated Pyongyang for too long."
 korea.14.c: "Is war on the horizon?"
 korea.15.t: "[KOR.GetLeader]が日本に賠償を要求"
 korea.15.d: "数週間にわたるソウルからの敵対的な発言と韓国の活動家による圧力を受けて、[KOR.GetLeader]は日本に対し、第二次世界大戦中の日本の戦争犯罪の生存者に賠償を支払うよう要求した。日本政府は、この問題は朴正煕による独裁政権下で韓国政府と解決済みであるとの立場を崩しておらず、予想通り賠償金の支払いを検討することを拒否した。\n\nこの問題は韓国の被害者への補償にはつながらなかったものの、[KOR.GetLeader]の政治的地位を強化し、多くの韓国人がこの極めて感情的な国家的課題のもとに結集する結果となった。"
 korea.15.a: "いつか私たちは正義を手にするだろう"
 korea.15.b: "彼らの要求は馬鹿げている！"
 korea.15.c: "この対立は解決できるのか？"
 korea.16.t: "戦争だ！"
 korea.16.d: "War has broken out between us and the North. As per our agreement with the United States, we must now hand over operational control of our armed forces to the US military."
 korea.16.a: "We must transfer control."
 korea.17.t: "The war is over"
 korea.17.d: "Peace has returned to the Korean peninsula. Now that we have returned to peacetime conditions, we can reassert control over our armed forces."
 korea.17.a: "Peace at last."
 korea.18.t: "National Assembly Elections Loom as Parties Begin Campaigning"
 korea.18.d: "With National Assembly elections coming up in about a month, we should begin boosting our party's popularity in order to facilitate a majority in the legislature for the next four years."
 korea.18.a: "Let's hope for a majority!"
 korea.21.t: "The results are in!"
 korea.21.a: "As always, it was a hard-fought election."
 korea.21.d_no: "Unfortunately, neither of the two main parties was able to gain a majority in the National Assembly. Our government will have to fight harder to win over legislators from other parties in order to pass controversial legislation."
 korea.21.d_con_loss: "Unfortunately, our party has failed to secure a majority in the National Assembly. Liberal lawmakers will refuse to pass any legislation that constrains trade unions, supports big business, or promotes antagonism to North Korea."
 korea.21.d_lib_loss: "Unfortunately, our party has failed to secure a majority in the National Assembly. Conservative lawmakers will refuse to pass any legislation that constrains big business, reforms conscription and intelligence, or promotes reconciliation with North Korea."
 korea.21.d_con_win: "Fortunately, our party has succeeded in winning a majority in the National Assembly. The legislature and executive will be able to work hand in hand in order to facilitate conservative goals such as limiting trade unions, supporting the chaebols, and staying tough on North Korea."
 korea.21.d_lib_win: "Fortunately, our party has succeeded in winning a majority in the National Assembly. The legislature and executive will be able to work hand in hand in order to facilitate liberal goals such as weakening the chaebols, reforming the security apparatus, and pursuing reunification with the North."
 korea.22.t: "統一の衝撃が表面化し始める"
 korea.22.d: "The great nation of Korea has finally been reunited, after many decades of painful separation. However, our task of reintegrating the two halves is far from over. Many on both sides of the 38th parallel are dissatisfied with the way in which reunification took place, and the economic costs of reunifying two vastly different states are quickly becoming apparent. Should we fail in our task of reunifying the country, we may face the dissolution of our new-born nation."
 korea.22.a: "今こそ、困難な部分が始まる……"
 korea.23.t: "南からの和平提案への対応"
 korea.23.d: "数週間にわたる協議を経て、我々が南からの和平提案を受け入れるかどうかを決断する時が来た。我々は南の提案の誠実さを信頼できるかどうか、そして平和条約に同意することが、将来いつか武力による統一を望む国内支持者にどのように受け取られるかを慎重に考慮しなければならない。"
 korea.23.a: "条約に同意しよう。"
 korea.23.b: "我々の間に平和など決して訪れない！"
 korea.24.t: "朝鮮和平協定が締結"
 korea.24.d: "南北朝鮮間の関係改善を受け、南の[KOR.GetLeader]と北の[NKO.GetLeader]は、不安定な休戦協定を正式な和平合意に置き換えることで合意した。この条約により、朝鮮戦争以来南北間に存在してきた敵対状態はついに終結した。両指導者は、この展開が半島を統一への道へと導くことを望むと表明したが、一部の観測筋は双方の統一推進への意欲に疑問を呈している。"
 korea.24.a: "半島には明るい未来が待っている！"
 korea.25.t: "南北協議が決裂"
 korea.25.d: "南の[KOR.GetLeader]と北の[NKO.GetLeader]による板門店での会談は、双方間の様々な意見の相違により決裂した。いくつかの合意点があったという事実は、一部の人々に将来の会談再開への希望を抱かせたが、南北朝鮮間の合意がかなり長い間実現しないことは明らかである。"
 korea.25.a: "平和はいまだ遠い……"
 korea.26.t: "韓国が統一を提案"
 korea.26.d: "南北朝鮮関係の前例のない改善を好機と捉え、南は我々の分断された国家を統一するために我々と協力することを提案している。しかし、彼らは統一の過程は南主導で行われるべきだと主張しており、この要求は我々が北で築き上げてきた独自の政治文化を脅かすものである。"
 korea.26.d1: "南北朝鮮関係の前例のない改善を好機と捉え、南は我々の分断された国家を統一するために我々と協力することを提案している。南は統一に対する我々の懸念を理解し、統一後に統一政府を樹立し、北と南双方の要素を取り入れる形で権力を分かち合うことを提案した。"
 korea.26.a: "我が国は再び一つになる！"
 korea.26.b: "この条件で統一が実現することは決してない……"
 korea.27.t: "北が統一の条件に同意！"
 korea.27.d: "長期にわたる交渉の結果、北は我々の二つの国を統一するために協力し始めることに同意した！南北関係が安定し、半島の統一が目前に迫る中、朝鮮民族の未来はかつてないほど明るく見えている！"
 korea.27.a: "素晴らしい知らせだ！"
 korea.28.t: "北が統一の条件を拒否！"
 korea.28.d: "Regrettably, [NKO.GetLeader] has chosen to put their own selfish position before that of the Korean people and rejected our offer to cooperate on reunifying the country. This rejection does not mean that we cannot make another attempt in the future, but it does mean that reunification will not occur in the near future. We must lay the groundwork to ensure that our next attempt will meet with greater success."
 korea.28.a: "朝鮮民族にとって悲しい日だ……"
 korea.29.t: "China Requests Return of Volunteer Remains"
 korea.29.d: "Beijing has formally asked us to return the remains of Chinese People's Volunteer Army personnel recovered in South Korea. Approving the request would allow the fallen soldiers to be repatriated to China."
 korea.29.a: "Approve the transfer."
 korea.29.b: "Refuse the request."
 korea.30.t: "First Volunteer Remains Returned to China"
 korea.30.d: "South Korea has transferred the first collection of Chinese People's Volunteer Army remains recovered in Gangwon and Gyeonggi provinces. Chinese and Korean representatives signed the handover documents at Incheon International Airport before a Chinese military aircraft carried the remains home."
 korea.30.a: "Honor the fallen."
 korea.31.t: "Seventh Volunteer Remains Transfer"
 korea.31.d: "South Korea has handed over 117 sets of remains recovered from Arrow Hill in the Demilitarized Zone. Chinese and South Korean officials attended the transfer ceremony at Incheon International Airport."
 korea.31.a: "Honor the fallen."
 korea.33.t: "北朝鮮の和平提案に対する我々の対応"
 korea.33.d: "After weeks of discussions, the time has come for us to decide whether we are willing to accept the North's offer of peace. We must consider whether we trust the sincerity of the North's offer, but also how agreeing a peace treaty will be perceived by those of our people who remain opposed to negotiating with the North Korean regime."
 korea.34.t: "North Korea proposes reunification"
 korea.34.d: "Seeking to capitalize on an unprecedented improvement in relations between the two Koreas, the North is offering to cooperate with us in order to reunify our divided nation. However, they are insisting that the process of reunification will be North-led, a demand that threatens the way of life that we have cultivated in the South."
 korea.34.d1: "Seeking to capitalize on an unprecedented improvement in relations between the two Koreas, the North is offering to cooperate with us in order to reunify our divided nation. The North, understanding our concerns about reunification, has offered to share power post-reunification through a unity government, incorporating elements of the South as well as the North."
 korea.35.t: "The South has agreed on our terms for reunification!"
 korea.35.d: "Following extensive negotiations, the South has agreed to begin working towards reunifying our two countries! With relations between the two Koreas stabilized and the reintegration of the peninsula on the horizon, the future of the Korean people has never looked brighter!"
 korea.36.t: "The South has refused our terms for reunification!"
 korea.36.d: "Regrettably, [KOR.GetLeader] has chosen to put their own selfish position before that of the Korean people and rejected our offer to cooperate on reunifying the country. This rejection does not mean that we cannot make another attempt in the future, but it does mean that reunification will not occur in the near future. We must lay the groundwork to ensure that our next attempt will meet with greater success."
 migrant_event.1.t: "移民スラム"
 migrant_event.1.d: "我が国の主要都市周辺の一部地域で、地元住民が「移民スラム」と呼ぶ地区が形成され始めている。これは、生活苦に陥った移民や難民が集まる地域であり、彼らは新たな生活を築こうとしたものの、低賃金や受け入れ国への同化の遅れにより、スラムに取り残されてしまっている。"
 migrant_event.1.a: "Break up the Slums"
 migrant_event.1.b: "支援を提供する"
 migrant_event.1.c: "移民受け入れ目標を引き下げる"
 migrant_event.2.t: "ナショナリストが移民政策に抗議"
 migrant_event.2.d: "ナショナリストの一団が、最近の移民流入に反対して、国内の主要都市のひとつで抗議活動を組織した。この抗議では、移民規制を強化するとともに、国内での移動もさらに管理すべきだと訴えている。"
 migrant_event.2.a: "デモを許可する"
 migrant_event.2.b: "Break up the Demonstration"
 migrant_event.3.t: "移民が暴力犯罪で告発される"
 migrant_event.3.d: "国内の特定の移民グループがさまざまな暴力犯罪に関与したとして告発され、警察は国内に新たに入国した多くの移民を逮捕した。右派の抗議者や支持者たちは、このような事態は国境を閉鎖しないことの結果だと政府に訴え始めている。我々はどのように対応すべきだろうか？"
 migrant_event.3.a: "彼らの言う通りかもしれない……"
 migrant_event.3.b: "Increase Police Funding."
 LibyaNews.1.a: "Excellent"
 Sudan.1.t: "取り残された者たち"
 Sudan.1.d: "Some of our territories on our southern border still have quite a large Christian and Animist population. Many people in those territories are upset that they have been excluded from the referendum of South Sudan. The dissent has grown larger and larger, and those people are now demanding to be joined together with [SSU.GetName], as they feel that under our government they do not get the proper representation."
 Sudan.1.a: "いいだろう、彼らはこの国には不要だ"
 Sudan.1.b: "南スーダンは正当な我らの土地だ！"
 Sudan.2.t: "[DAR.GetNameDef]との同盟？"
 Sudan.2.d: "We are not the only ones fighting against the government. There are also rebels in Darfur. Perhaps we should promise them increased representation in the future Sudanese government if they ally with us?"
 Sudan.2.a: "要請を送れ"
 Sudan.2.b: "彼らの力は必要ない"
 Sudan.2.a.tt: "彼らが受諾した場合、\n"
 Sudan.3.t: "[FROM.GetNameDef]が同盟を提案"
 Sudan.3.d: "We have been offered an alliance by [FROM.GetNameDef], as they are too fighting against the [SUD.GetAdjective] government. They promise us increased representation in the new Sudan government that they are building. What should we respond?"
 Sudan.3.a: "合意しよう"
 Sudan.3.b: "彼らの力は必要ない"
 Sudan.4.t: "[FROM.GetNameDef]が共に戦うことに同意"
 Sudan.4.d: "[FROM.GetNameDef] has agreed to form a common front against [SUD.GetLeader] together with us."
 Sudan.4.a: "素晴らしい！"
 Sudan.5.t: "[FROM.GetNameDef]が共に戦うことを拒否"
 Sudan.5.d: "[FROM.GetNameDef] has refused to form a common front against [SUD.GetLeader] together with us."
 Sudan.5.a: "彼らが損するだけだ"
 Sudan.6.t: "[FROM.GetNameDef]と[DAR.GetNameDef]が協力"
 Sudan.6.d: "[FROM.GetNameDef]と[DAR.GetNameDef]は、我々に反抗する共同戦線を構築した。"
 Sudan.6.a: "くそっ"
 SudanNews.1.d: "南コルドファンと青ナイルでの紛争が遂に終結した。[FROM.GetLeader]は戦闘の勝利を主張しているが、我が国が将来どうなるかは分からない。"
 SudanNews.2.t: "南コルドファンと青ナイルでの紛争"
 SudanNews.2.d: "After the Comprehensive Peace Agreement, some areas in [SUD.GetName] with Christian and Animist populations were left from being included in the South Sudanese independence referendum. The people living here have grown increasingly tired of the [SUD.GetAdjective] government ever since the agreement. They feel that they lack representation in the current government, and have now taken up arms against the government."
 SudanNews.2.a: "興味深い"
 SouthSudan.1.t: "南スーダン独立住民投票"
 SouthSudan.1.d: "The time has come for the South Sudanese people to vote for their independence. While some of the people living in Sudan are not happy that they have been left out of the referendum area, we have managed to encompass most of the Christian and Animist population. This will turn a new leaf in peace and prosperity for both Sudans."
 SouthSudan.1.a: "そして勝者は……"
 SouthSudan.4.t: "[FROM.GetNameDef]が支援を要請"
 SouthSudan.4.d: "Our longstanding ally, [FROM.GetLeader] has requested military help in their fight against [SUD.GetNameDef]. He has stated that without our military help, their war effort will crumble. In the late 80s, our troops were involved in the fight in Southern Sudan, but with the conflict in Congo we had to shift priorities. Congo is now dealt with, maybe we can spare something to [FROM.GetLeader]?"
 SouthSudan.5.t: "[FROM.GetNameDef]が我らを支援"
 SouthSudan.5.d: "[FROM.GetLeader]が我らを支援することに同意した。[FROM.GetAdjective]の部隊は今にも国境を越えてゆくだろう。"
 SouthSudan.5.a: "完璧だ！"
 SouthSudan.6.t: "[FROM.GetNameDef]が引き下がる"
 SouthSudan.6.d: "[FROM.GetLeader] has stated that he can't afford to help us anymore than he already has."
 SouthSudan.6.a: "くそっ"
 SouthSudan.7.t: "[FROM.GetNameDef] Willing To Cede Land"
 SouthSudan.7.d: "[SUD.GetNameDef] is currently embroiled in a civil war. The opposing faction of [SSU.GetName] has offered us a deal; They will give us complete control over the territory of the Ilemi Triangle, and in exchange we help them setup a military supply network. Should we accept their offer?"
 SouthSudan.7.a: "もちろん"
 SouthSudan.7.b: "我々は興味がない"
 SouthSudan.8.t: "[FROM.GetNameDef] Accepts Our Deal"
 SouthSudan.8.d: "[FROM.GetLeader] has agreed to take control of the Ilemi Triangle in exchange for helping us with our military."
 SouthSudan.8.a: "完璧だ！"
 SouthSudan.9.t: "[FROM.GetNameDef] Rejects Our Deal"
 SouthSudan.9.d: "[FROM.GetLeader] has rejected our offer of the Ilemi Triangle. They fear that this move would earn them some repercussions from [SUD.GetNameDef]."
 SouthSudan.9.a: "くそっ"
 SouthSudan.10.t: "コンゴの反政府勢力が国境を越える"
 SouthSudan.10.d: "We've received reports of large armed groups that have crossed the border from [DRC.GetNameDef] and have attacked the towns of Yambio and Yei. It seems that these groups have been equipped and hired by the [SUD.GetAdjective] government. The opposition of [DRC.GetName] against [UGA.GetName] has given them motivation to allow this border crossing to happen."
 SouthSudan.10.a: "忌々しいコンゴ人め！"
 SouthSudan.11.t: "Preparing For The Referendum"
 SouthSudan.11.d: "With a peace deal signed between the North and South of Sudan, both parties have begun preparing for the referendum. Current projections show that the great majority of [SSU.GetAdjective] people will vote for independence, as they are not that keen on being ruled by hardline Muslims. However, with political meddling and control over key government figures, it might be possible for the North to gain control over the South again."
 SouthSudan.11.a: "We must prepare"
 SouthSudan.11.tooltip: "The likelihood of people in South Sudan voting to stay part of Sudan is §Y[SUD.GetAdjective] Influence in [SSU.GetNameWithFlag] multiplied by 0.75§!. If [SUD.GetAdjective] Influence in [SSU.GetNameWithFlag] is §Ybelow 20%§!, the referendum will always result in §Yindependence§!."
 SouthSudan.12.t: "[FROM.GetNameDef] Becomes Independent"
 SouthSudan.12.d: "[FROM.GetName] has held their independence referendum in the territories they controlled. The results for independence were a resounding 99.83% in favour. Surprisingly, there was very little electoral violence predating the vote, and generally the elections were seen as having been fair."
 SouthSudan.12.a: "これでお別れだろう"
 SouthSudan.13.t: "[FROM.GetNameDef] Favours Unity"
 SouthSudan.13.d: "[FROM.GetName] has held their independence referendum in the territories they controlled. It was a close race but the votes for staying with Sudan won with 54% of the votes. Many South Sudanese expressed fears that trying to separate from Sudan would only reignite the civil war."
 SouthSudan.13.a: "おかえりなさい！"
 SouthSudan.14.t: "[ROOT.GetLeader]'s Helicopter Crashes"
 SouthSudan.14.d: "For the weekend, our president [ROOT.GetLeader] had gone to meet his long time ally [UGA.GetLeader]. He had not told the [SUD.GetAdjective] government about this trip, and instead had lied that he was on holiday in New Kush. [ROOT.GetLeader] however, never made it back home. On his return flight, his helicopter crashed into a mountain range in Southern Sudan killing him, six of his colleagues and seven [UGA.GetAdjective] crew members. Our government is scrambling to solve the matter of succession, but it is likely that [ROOT.GetLeader]'s deputy Salva Kiir Mayardit will take office."
 SouthSudan.14.a: "A few months after the peace? Suspicious..."
 SouthSudan.15.t: "Rumours Of A Coup"
 SouthSudan.15.d: "We have heard rumours that one of our allies during the civil war is planning to overthrow our government. We could dismiss these rumours. However, considering that our army is currently made up of dozens of smaller rebel groups, it is more than likely that somebody is trying to take the throne. What should we do?"
 SouthSudan.15.a: "Our allies are loyal"
 SouthSudan.15.b: "Purge the generals! The police! Everybody!"
 SouthSudan.15.a.tt: "If a civil war starts, the opposition will be §Ystronger§! than our side"
 SouthSudan.15.b.tt: "If a civil war starts, the opposition will be §Yweaker§! than our side"
 SouthSudan.16.t: "What's In A Name?"
 SouthSudan.16.d: "Now that we are independent, we need to decide what to name our country. Several suggestions have been collected from the public, with South Sudan being the obvious favourite. However, we could elect to choose another name"
 SouthSudan.16.a: "South Sudan is good"
 SouthSudan.16.b: "Azania, to remember our history"
 SouthSudan.16.c: "The Nile Republic is most fitting"
 SouthSudan.16.dd: "The Kush Republic is the best"
 SouthSudanNews.1.d: "The civil war in [SSU.GetNameDef] has come to an end. The war started following a power struggle between various rebel groups, only a short while after the country had finalised its business with [SUD.GetNameDef]. Perhaps now the country will be able to start rebuilding."
 SouthSudanNews.2.t: "包括和平協定"
 SouthSudanNews.2.d: "[SUD.GetAdjective]派と[SSU.GetAdjective]派が和平協定に達し、第二次スーダン内戦が終結した。政府間開発機構（IGAD）の交渉者たちの助けを借りて、双方は[SSU.GetNameDef]に[SUD.GetAdjective]政府の下で自治権を与える枠組みに合意した。また、6年以内に[SSU.GetNameDef]の完全独立についての住民投票を実施することにも合意した。この協定が、地域における何十年にもわたる民族紛争をついに解決するかもしれない。"
 SouthSudanNews.3.t.SUD: "南スーダン反政府勢力の壊滅"
 SouthSudanNews.3.t.SSU: "新たなスーダンの誕生"
 SouthSudanNews.3.d.SUD: "[SUD.GetAdjective]で続いていた民族紛争の最新の戦闘が終結し、政府が南部地域の反政府勢力を壊滅させた。この勝利により、[SUD.GetLeader]は国内のイスラム化とアラブ化をさらに推し進める自由を得たが、南部のキリスト教徒やアニミズム信仰者たちには大きな不満を引き起こしている。"
 SouthSudanNews.3.d.SSU: "最新の[SUD.GetAdjective]民族紛争がついに終結し、南スーダンの反乱勢力が政府を打倒した。前[SUD.GetAdjective]指導者[SUD.GetLeader]は逮捕され、人権侵害や戦争犯罪の罪で裁判を待っている。新政権は自由で平等なスーダンを約束しているが、多くの専門家は、指導者[SSU.GetLeader]が反乱勢力の指導者だった頃から既に反対勢力を弾圧する動きを見せていたと指摘している。"
 SouthSudanNews.3.a: "興味深い"
 SouthSudanNews.4.t.independence: "[FROM.GetNameDef]独立"
 SouthSudanNews.4.t.autonomy: "[FROM.GetNameDef]が[SUD.GetNameDef]の一地域となる"
 SouthSudanNews.4.d.independence: "[FROM.GetNameDef]は、[SUD.GetName]との和平合意に基づき独立の是非を問う住民投票を実施した。その結果、驚くべきことに98%が分離独立に賛成した。これにより、[SSU.GetName]はアフリカで最も若い国家となった。"
 SouthSudanNews.4.d.autonomy: "[FROM.GetNameDef]は、[SUD.GetName]との和平合意に基づき独立の是非を問う住民投票を実施した。その結果は僅差となったが、[SUD.GetName]との統一を支持する選択肢が53%で勝利した。[SSU.GetName]が[SUD.GetName]から分離した場合に戦争が再燃することへの懸念が、有権者を統一支持に傾けたと考えられている。それにもかかわらず、[SSU.GetName]には一定の自治が認められたが、その状況がどれほど続くかは不透明である。"
 SouthSudanNews.4.a: "興味深い"
 SouthSudanNews.5.t: "[SSU.GetNameDef]内戦"
 SouthSudanNews.5.d: "A civil war has begun in the young nation of [SSU.GetName]. Only a few years after ending their conflict with [SUD.GetName], conflict has begun again. It seems that since there is no more a common enemy for the various rebel groups, a power struggle has started between the various groups."
 SouthSudanNews.5.a: "興味深い"
 war_in_darfur_threat: "ダルフール紛争"
 Darfur.2.t: "ダルフール反乱軍がゴロを襲撃"
 Darfur.2.d: "A group of rebels belonging to the Darfur Liberation Front and Justice and Equality Movement have attacked the small town of Golo, the headquarters of the Jebel Marra district, just south of Kabkabiya. The attack was preceded by smaller skirmishes against local police stations, army outposts and military convoys. The rebels are tired of [SUD.GetLeader]'s Arabisation policies in the region, and are demanding they step down."
 Darfur.2.a: "くそっ"
 Darfur.3.t: "ダルフール反乱軍がチャド国境を封鎖"
 Darfur.3.d: "A group of rebels belonging to the Darfur Liberation Front and Justice and Equality Movement have occupied the border town of Tine near the Chadian border. In the process, they captured a large amount of weapons and supplies. The rebels are trying to create a connection to Chad, where many tribes that are sympathetic to the Darfuri cause live."
 Darfur.3.a: "くそっ"
 Darfur.4.t: "ダルフール反乱軍がエル・ファーシルを襲撃"
 Darfur.4.d: "At early morning, a group of Darfur Liberation Front and Justice and Equality Movement rebels attacked the sleeping garrison at El Fasher. In the next few hours, several military aircraft had been destroyed at the local airbase, leaving 75 soldiers dead and 32 captured. The rebels also managed to capture a major general, who was the commander of the air base. This has been a major setback for our military, and several military units have abandoned their posts fearing attacks from the rebels."
 Darfur.4.a: "くそっ"
 DarfurNews.1.t: "ダルフール紛争勃発"
 DarfurNews.1.d: "[SUD.GetAdjective]政府による数十年にわたる強制的なアラブ化政策がついに限界点に達した。反政府勢力であるダルフール解放戦線と正義平等運動の2つのグループが、低強度の反乱から本格的な戦争へと対立をエスカレートさせた。これらの反乱勢力を[SUD.GetName]が対処できるかどうかは、時間が明らかにするだろう。"
 DarfurNews.1.a: "興味深い"
 DarfurNews.2.t: "[DAR.GetNameDef]が自治権を認められる"
 DarfurNews.2.d: "[DAR.GetAdjective]反乱勢力と[SUD.GetAdjective]政府軍は何年にもわたる紛争の末、双方が和平協定に合意した。[DAR.GetName]は[SUD.GetName]の下で限定的な自治権を与えられ、差別から守られることとなった。この協定を[SUD.GetLeader]が順守するかどうかは、時間が経たなければ分からない。"
 DarfurNews.2.a: "興味深い"
 DarfurNews.3.t: "[DAR.GetNameDef]の独立"
 DarfurNews.3.d: "After years of conflict between the [DAR.GetAdjective] rebels and [SUD.GetAdjective] government forces, the [DAR.GetAdjective] forces have managed to come out on top. After successful incursions from Darfur into Sudan proper, the [SUD.GetAdjective] government had no options but to give concessions to the [DAR.GetAdjective] rebels. The nation of [DAR.GetName] has now been given full independence, but time will tell whether [SUD.GetName] is just using this as an opportunity to rebuild their forces."
 DarfurNews.3.a: "興味深い"
 corruption.16.t: "Corruption Increased"
 corruption.16.d: "Spies and agents from another country have meddled in our country increasing the rating of corruption in our country. It comes from a variety of sources such as targeted bribes, negotiations and well-placed subversive agents in the country."
 corruption.16.a: "Unfortunate"
 Israel.1111.t: "Rumours of a 3rd Intifada"
 Israel.1111.d: "The influential Palestinian Islamist group Hamas has called for a new uprising against Israel, starting on Friday. Speaking in Gaza on Thursday, Hamas' leader Ismail Haniyeh said, \"We should call for and we should work on launching an intifada in the face of the Zionist enemy.\" He also said, \"We want the uprising to last and continue to let Trump and the occupation regret this decision.\""
 Israel.1111.a: "Uh oh..."
 Israel.1112.t: "Israel threatens war"
 Israel.1112.d: "Due to our frozen conflict with Israel in the Golan Heights they have threatened to declare war on us unless we revoke our claim!"
 Israel.1112.a: "Revoke our claim in the Golan"
 Israel.1112.b: "戦争だ！"
 restart_boardcross_expenditure: "Restarts all expenditure across the board"
 god_of_war_event.1.t: "Up For A Challenge?"
 god_of_war_event.1.d: "Normally, apart from most basic buffs, AI in MD does not cheat. It goes for RP-style designs for vehicles and divisions, but with this option, AI WILL CHEAT.\nIt would create equipment and divisions out of thin air, and will try harder to resist against the player generally. It won't be Endsieg experience, AI is made to challenge the player, not overwhelm you.\n\nP.S. You still don't get bragging rights after beating this AI."
 god_of_war_event.1.a: "Bring it!"
 god_of_war_event.1.b: "Also make AI focus on me more!"
 md4.21.t: "[FROM.GetName]-[Root.GetName] EAEU Integration"
 md4.21.d: "[FROM.GetNameDef] is asking us to allow them into EAEU. We will have priority to export to and import from them and will economically integrate into each other further."
 md4.21.a: "署名する！"
 md4.21.b: "拒否する。"
 md4.22.t: "[FROM.GetNameDef] Has Signed Our Accession into EAEU!"
 md4.22.d: "[FROM.GetNameDef] has accepted our offer to allow us into EAEU."
 md4.22.a: "It will make both of us prosperous!"
 md4.23.t: "[FROM.GetNameDef] Has Refused our offer to allow us into EAEU."
 md4.23.d: "[FROM.GetNameDef] has refused our offer to sign a free trade agreement."
 md4.23.a: "They fear our superior products!"
 EUR_idea_eacu_cooperation: "EAEU Cooperation"
 EUR_idea_eacu_cooperation_desc: "The Eurasian Customs Union (originally the Eurasian Economic Community), promotes economic ties between most of the post-Soviet states. The union imposes a common external tariff on all goods entering the union, and acts as one singular entity when producing trade deals and negotiations."
 EUR_idea_eacu_cooperation_2: "EAEU Integrated Cooperation"
 EUR_idea_eacu_cooperation_2_desc: "The Eurasian Customs Union (originally the Eurasian Economic Community), promotes economic ties between most of the post-Soviet states. The union imposes a common external tariff on all goods entering the union, and act as one singular entity when producing trade deals and negotiations."
 influence.1.c: "GDPの15％を経済援助として送る"
 influence.1.e: "考え直そう、彼らには不要だ。"
 Cameroon.2.t: "The Boat Wreck"
 Cameroon.2.d: "A boat carrying 150 passengers were on their way from the Nigerian port of Oron to Gabon's port of Gentil when their boat capsized. It is estimated that over one hundred of the passengers have died and the rest are in critical condition clinging to flotsam from the shipwreck. Local fishermen and Cameroonian authorities out of the city of Kribi are scouring the waves and water for additional survivors as we speak but the situation is looking more and more bleak...\n\nWe can offer to pay for the medical bills of the survivors or we can choose to have a day of prayer for the souls of the dead and the recovery of the survivors."
 Cameroon.2.a: "We should pay for the medical bills"
 Cameroon.2.b: "A day of prayer is in order"
 world_war.1.t: "規定路線の世界大戦が有効"
 world_war.1.d: "伝統的にMillennium Dawnはサンドボックス指向のMODであり、他のMODのように世界大戦をレールロードする手法からは距離を置いてきました。このオプションは、コミュニティの一部が求める「戦争指向のゲームプレイスタイル」への渇望を満たすために用意されました。このゲームルールはMDの理念を踏まえて作成されており、プレイヤーがどの陣営を選択するかによって世界大戦の発端となるシナリオが変化します。戦争は2014年頃に開始されるため、プレイヤーには戦争への準備期間が与えられます。"
 world_war.1.a: "了解"
 world_war.2.t: "中国、台湾に進攻"
 world_war.2.d: "人民解放軍は、中華民国に対する作戦を開始すると発表し、これは中国内戦の継続を示すものである。我々の諜報機関が察知していなかったわけではないが、中国はアメリカ合衆国による報復の可能性を前にして自制心を示すと信じる理由があった。"
 world_war.2.a: "[CHI.GetName]は我々のレッドラインを越えた"
 world_war.2.b: "Asian problems are the Asians' problems"
 world_war.3.t: "アメリカ、中国に介入"
 world_war.3.d: "[USA.GetLeader] today announced that he has ordered the United States military to prepare for a full-scale mobilization against [CHI.GetName]. This comes following Chinese attacks against Taiwan, and the continuation of the Chinese civil war. Though China has given its reasons for the invasion, the United States has stated that the main purpose for this intervention is to show that the 'United States will always back their allies, regardless of the aggressor'. Fears are circulating that this intervention would lead to further escalation in the region, with some dubbing this as the start of the Third World War."
 world_war.3.a: "心配だ。"
 world_war.4.t: "中国で足を取られるアメリカ"
 world_war.4.d: "ワシントンの帝国主義者たちは、中国の我々のパートナーに対する作戦を開始した。これを踏まえれば、我々の目の前には絶好の機会がある。彼らが中国に気を取られている間に、我々はかつて我々のものであったもの、すなわち朝鮮半島全体を取り戻すことができる。"
 world_war.4.a: "このような機会を逃すわけにはいかない"
 world_war.4.b: "リスクが高すぎる"
 world_war.5.t: "アジアでの紛争がエスカレート"
 world_war.5.d: "The war in Asia has escalated, with the North Korean government attacking the Republic of Korea in a bid to reunite the entirety of the Korean peninsula under DPRK rule. This move by the Democratic People's Republic of Korea has prompted Japan to respond by sending troops to the Republic of Korea, sparking the start of a much grander war than anticipated. The world is watching with bated breath, as the war which started with China has now quickly engulfed the majority of Eastern Asia. Nations across the globe, particularly in Europe and Africa, are condemning the violence in Asia amidst fears of an additional theater of war opening in Europe as a result of the chaos and instability present in the world today."
 world_war.5.a: "第三次世界大戦が始まった"
 world_war.6.t: "朝鮮半島での戦争"
 world_war.6.d: "朝鮮民主主義人民共和国は、大韓民国に対して違法に宣戦布告することで、この地域の戦争をエスカレートさせた。この行動は、我々が何十年にもわたって守り続けてきた秩序を脅かしており、我々の国民の間でも行動を求める声が高まっている。我々は友好国と我々の威信を守るため、何らかの形で韓国を支援しなければならない。"
 world_war.6.a: "朝鮮民主主義人民共和国は今日、重大な過ちを犯した"
 world_war.6.b: "我々は関与できない"
 world_war.7.t: "ロシア、西へ進軍"
 world_war.7.d: "ロシア政府は西へ進軍し、ウクライナに対する全面戦争を開始した。この拡張により、ヨーロッパ大陸の運命が不透明であることから、我が軍の司令部と同盟国は大きな懸念を抱いている。そして、ロシアに対してヨーロッパが食い尽くされるべきパイではないと示すまでは、その運命は不透明なままだろう。"
 world_war.7.a: "Russia has taken it too far this time"
 world_war.7.b: "戦争を起こすことはできない"
 world_war.8.t: "ヨーロッパでの戦争"
 world_war.8.d: "Following Russian incursions into Ukraine, NATO forces were seen moving into Ukraine to confront Russian forces. Reports of aerial and naval skirmishes are already popping up, signaling the start of a greater war in Europe. International organizations throughout the world have begun dubbing this conflict as the Third World War, as NATO forces are currently engaged with Russian forces throughout Europe. Almost every nuclear armed nation is currently at war with one another, and fears of a nuclear exchange continue to grow. No one knows whether the world will end, but one thing is for certain, the next world order will most certainly ensure that it will not be a multi-polar one."
 world_war.8.a: "歴史は再び書かれる"
 world_war.9.t: "世界における我々の野望"
 world_war.9.d: "今日、アメリカ、中国、日本は互いに大規模な紛争に突入している。ヨーロッパ諸国も戦争に関与している中、我々の政府はヨーロッパが東方へ拡大し、我々の国境へ迫る可能性をますます懸念している。軍司令部は、将来のヨーロッパによる奇襲攻撃を防ぐため、ウクライナへ進軍することを提案している。"
 world_war.9.a: "彼らの助言に耳を傾けよう"
 world_war.9.b: "推測に基づく戦争の危険は冒せない"
 world_war.10.t: "中東で戦争勃発"
 world_war.10.d: "Following several Iranian strikes on Israel, the IDF has called upon its allies to topple and dismantle the government in Iran. This world changing event is just another part of a greater war which experts have dubbed as the third world war, with now yet another theater of war coming about. The rivalry between Iran and Israel is not something new, having started after the Islamic Revolution of Iran in 1979. It is not known whether Iran possesses nuclear weapons, but there are fears of a potential nuclear exchange between the Axis of Resistance and Israel. It is currently unknown whether any third parties are going to involve themselves in such a conflict, but what is indeed known is that this war could see the potential destruction of the middle east and global oil markets."
 world_war.10.a: "どこか安全な場所はあるのか？"
 world_war.11.t: "The Liberation of Quds"
 world_war.11.d: "With America and the rest of the world's great powers distracted in a war of attrition, we finally have ample opportunity to strike Israel and bring about the end of the Zionist regime. Such an attack could see the destruction of our two states, but it is now, or never."
 world_war.11.a: "攻撃せよ！"
 world_war.11.b: "戦争を起こすことはできない"
 taiwan.17.t: "新首都の選定"
 taiwan.17.d: "勝利の果実を味わう今、我々は行政の首都を大陸側へ移転することを検討し始めなければならない。台北は中国本土の主要人口圏からあまりにも遠く、国家を効果的に統治する能力が次第に低下してきている。ゆえに、我々の新たな首都は……"
 taiwan.17.a: "北京"
 taiwan.17.b: "上海"
 taiwan.17.c: "重慶"
 taiwan.17.d1: "現状維持、台北"
 taiwan.17.e: "南京"
 city_captured.12.t: "バイドア陥落"
 city_captured.12.d: "[FROM.GetName]軍は最後の防衛線を突破し、戦略的要衝であるバイドアを占領した。同市は包囲され、短時間ながら激しい小競り合いの末に制圧された。街は廃墟と化したが、彼らはこの激戦の成果を夜を通して祝うことだろう。"
 city_captured.12.a: "興味深い"
 city_captured.13.t: "キスマヨ陥落"
 city_captured.13.d: "[FROM.GetName] forces breached the final defences and captured the strategic city of Kismayo, which was encircled and overrun following a brief but intense skirmish. Though the city is in ruins, they'll celebrate this hard-fought battle throughout the night."
 city_captured.13.a: "興味深い"
 city_captured.14.t: "ガルカイヨ陥落"
 city_captured.14.d: "[FROM.GetName]軍は最後の防衛線を突破し、戦略的要衝であるガルカイヨを占領した。同市は包囲され、短時間ながら激しい小競り合いの末に制圧された。街は廃墟と化したが、彼らはこの激戦の成果を夜を通して祝うことだろう。"
 city_captured.14.a: "興味深い"
 taiwan.18.t: "チップ大競争"
 taiwan.18.d: "As we move into the 2000s, our superiority of microchip production is coming under threat. The People's Republic of China are beginning to expand their microchip production industry, in an attempt to surpass our production capability. We must stay ahead in order to protect our position on the global stage."
 taiwan.18.a: "我々は勝つ！"
 systems.1.t: "Millennium Dawnへようこそ"
 systems.1.d: "Welcome to Millennium Dawn! Thank you for downloading and playing the mod. If you're new, we recommend exploring the various menus to familiarize yourself with the features. Menus typically can be opened via buttons at the top of the various screens. Need help? Join our Discord community where we're happy to assist you with any questions or issues. You can report bugs in-game using \"Report An Issue\" in the pause menu or through our Discord channels.\n\nImportant Information:\n- Fuel is negative on game start due to power plants and population consumption. Look at the Energy UI in the Construction Menu for more details.\n- Historical focus =/= historical outcomes. We use the historical focus option to encourage the AI to make the most historical possible choice in given choices and options. This is not a guarantee for a historical game."
 systems.1.a: "了解"
 protests.100.t: "Protests Erupt Outside the Capital"
 protests.100.d: "Mass demonstrations have taken hold in a major region outside the capital. Security officials warn that the unrest could spread unless the government restores public confidence."
 protests.100.a: "Contain the unrest"
 protests.101.t: "報告: 抗議活動が拡大！"
 protests.101.d: "Protests have spread into another non-capital region. Local authorities are struggling to restore order as the movement gains new supporters."
 protests.101.a: "急いで行動しなければ！"
 protests.103.t: "報告: 抗議活動が解散し、平穏が戻る"
 protests.103.d: "Public demonstrations have lost their momentum, and local authorities report that affected regions have returned to normal. The nationwide protest movement appears to be over."
 protests.103.a: "素晴らしい"
 protests.104.t: "抗議者が産業施設に放火！"
 protests.104.d: "状況報告\n\n[ROOT.GetLeader]閣下宛\n\n抗議者が複数の産業施設に放火した模様であり、緊迫した治安状況が生じています。現在、被害を受けた建物をどのように扱うか決定する必要があります。\n\n署名\n- 内部治安総局"
 protests.104.a: "取り壊せ、修復は不可能だ"
 protests.104.b: "政府資金を使って再建を開始する"
 protests.105.t: "抗議者がオフィス団地に放火！"
 protests.105.d: "状況報告\n\n[ROOT.GetLeader]閣下宛\n\n抗議者が複数のオフィス団地に放火した模様であり、緊迫した治安状況が生じています。現在、被害を受けた建物をどのように扱うか決定する必要があります。\n\n署名\n- 内部治安総局"
 protests.105.a: "取り壊せ、修復は不可能だ"
 protests.105.b: "政府資金を使って再建を開始する"
 protests.106.t: "抗議者が軍需工場に放火！"
 protests.106.d: "状況報告\n\n[ROOT.GetLeader]閣下宛\n\n抗議者が複数の軍需工場に放火した模様であり、緊迫した治安状況が生じています。現在、被害を受けた建物をどのように扱うか決定する必要があります。\n\n署名\n- 内部治安総局"
 protests.106.a: "取り壊せ、修復は不可能だ"
 protests.106.b: "政府資金を使って再建を開始する"
 protests.200.t: "報告: 抗議活動の兆候"
 protests.200.d: "Situation Report\n\nAddressed to their excellency, [ROOT.GetLeader]\n\nRecently, our intelligence agency and security forces have caught wind of plans for a national revolt. This is due to recent developments within our country, creating a clique of dissatisfied people. It is alleged that these people are starting to form groups in order to topple our government.\n\n Signed,\n - Internal Security Directorate"
 protests.200.a: "迅速に行動しなければならない"
 influence.5.d1: "Call in Albionis, we're going in"
 recognition.71.t: "The General Assembly Vote Has Passed"
 recognition.71.d: "The General Assembly has voted to admit us to the United Nations. After years of diplomatic effort, our seat is secured."
 recognition.71.a: "[THIS.GetName] takes its seat."
 recognition.72.t: "The General Assembly Vote Has Failed"
 recognition.72.d: "The General Assembly has fallen short of the votes needed to admit us. Our bid for UN membership has stalled for now."
 recognition.72.a: "A setback for our diplomacy."
 recognition.73.t: "General Assembly Rejects [FROM.GetName]'s Bid"
 recognition.73.d: "The General Assembly has voted against the admission of [FROM.GetNameDef] as a member state. The bid has stalled."
 recognition.73.a: "The vote is recorded."
 recognition.12.t: "[FROM.FROM.GetName]、安全保障理事会の勧告を求める"
 recognition.12.d: "[FROM.FROM.GetName] has petitioned the Security Council for a recommendation to the General Assembly, over the objection of [FROM.GetName]. The Council must now cast its vote."
 recognition.12.a: "賛成票を投じる"
 recognition.12.b: "反対票を投じる"
 recognition.12.c: "棄権する"
 recognition.15.t: "Vote on [FROM.FROM.GetName] UN Membership"
 recognition.15.d: "With the Security Council's recommendation secured, the question of admitting [FROM.FROM.GetName], opposed by [FROM.GetName], now falls to the General Assembly."
 recognition.15.a: "賛成票を投じる"
 recognition.15.b: "反対票を投じる"
 recognition.15.c: "棄権する"
 recognition.121.t: "安全保障理事会が[FROM.GetName]の国連加盟を勧告"
 recognition.121.d: "The Security Council has issued a recommendation in favor of admitting [FROM.GetName] to the United Nations. The matter now passes to the General Assembly."
 recognition.121.a: "A vote moves forward."
 recognition.122.t: "Security Council Rejects [This.GetName]'s Bid"
 recognition.122.d: "The Security Council has voted against recommending [This.GetName] to the General Assembly. The membership bid stops at this stage."
 recognition.122.a: "The bid stalls."
 UNSC.1.t: "[?global.current_sc_vote_nation.GetName]にすべての攻勢戦争の終結を迫る決議"
 UNSC.1.d: "[?global.current_sc_vote_nation.GetName]に対し、現在行っているすべての攻勢的な紛争を終結させるよう圧力をかける決議が、安全保障理事会に提出されている。もしこの決議が可決されれば、[?global.current_sc_vote_nation.GetName]は進行中のすべての攻勢的な紛争を解決するために210日の猶予を与えられる。それを果たせなかった場合、最終的にそれらすべての紛争を終結させるまで、制裁を科されることになる。\n\n$unsc_vote_pass_tt$"
 UNSC.1.a: "賛成"
 UNSC.1.b: "反対"
 UNSC.1.c: "棄権"
 UNSC.2.t: "[?global.current_sc_vote_nation.GetName]に対する国際連合安全保障理事会の制裁"
 UNSC.2.d: "A Resolution to establish UNSC sanctions against [?global.current_sc_vote_nation.GetName] is before the Security Council. If the vote passes, [?global.current_sc_vote_nation.GetName] will be sanctioned until they no longer are an offensive threat to global peace, or until the Security Council removes the sanctions against them.\n\n$unsc_vote_pass_tt$"
 UNSC.3.t: "[?global.current_sc_vote_nation.GetName]への国外義勇軍の派遣制限"
 UNSC.3.d: "[?global.current_sc_vote_nation.GetName]への国外からの義勇軍派遣を阻止する決議案が安全保障理事会に提出されている。この決議案が可決された場合、採決後に[?global.current_sc_vote_nation.GetName]へ義勇軍を派遣したいかなる国も、義勇軍を撤退させるか、あるいは紛争が終結するまで制裁を課されることになる。\n\n$unsc_vote_pass_tt$"
 UNSC.4.t: "[?global.current_sc_vote_nation.GetName]に対する武器禁輸措置"
 UNSC.4.d: "[?global.current_sc_vote_nation.GetName]に対する武器禁輸措置を導入する決議案が安全保障理事会に提出されている。この決議案が可決された場合、[?global.current_sc_vote_nation.GetName]は現在行っているすべての攻勢戦争を終結させるまで、国際市場から武器を購入することができなくなる。\n\n$unsc_vote_pass_tt$"
 UN.6.t: "[?global.current_ga_vote_nation.GetNameWithFlag]の国連安全保障理事会理事国入りを承認？"
 UN.6.d: "国際連合総会は現在、安全保障理事会の次期理事国を承認するための投票を行っている。指名されたすべての国は総会の承認を受ける必要があり、[?global.next_year]年1月1日から始まる2年間の任期を務めることになる。\n\n$un_ga_vote_requires_2_3_tt$"
 UN.6.a: "賛成票を投じる"
 UN.6.b: "反対票を投じる"
 UN.6.c: "棄権する"
 UN.7.t: "Establish Non-Binding Sanctions Against [?global.current_ga_vote_nation.GetNameWithFlag]"
 UN.7.d: "[?global.current_ga_vote_nation.GetNameWithFlag] has conducted a military strike against a foreign nation. In response, they have requested that the §BUnited Nations§! sanction [?global.current_ga_vote_nation.GetNameWithFlag] for the next year as a punishment for this action. If we vote in the affirmative, we will agree to bring sanctions against [?global.current_ga_vote_nation.GetNameWithFlag].\n\n$un_ga_vote_requires_majority$"
 UN.8.t: "Decrease the UN General Operating Budget"
 UN.8.d: "[?global.current_ga_vote_nation.GetNameWithFlag] has put forward a proposal to decrease the General Operating Budget for the next year. The decrease would be by 0.01% of GDP. The current contribution rate is [?global.general_operating_budget_contribute_percent|%]. The decrease to the rate would take place at the start of the next UN fiscal year, and would affect all UN Aid programs.\n\n$un_ga_vote_requires_2_3_tt$"
 UN.9.t: "Increase the UN General Operating Budget"
 UN.9.d: "[?global.current_ga_vote_nation.GetNameWithFlag] has put forward a proposal to increase the General Operating Budget for the next year. The increase would be by 0.01% of GDP. The current contribution rate is [?global.general_operating_budget_contribute_percent|%]. The increase to the rate would take place at the start of the next UN fiscal year, and would affect all UN Aid programs.\n\n$un_ga_vote_requires_2_3_tt$"
 UN.10.t: "決議: 貧困削減"
 UN.10.d: "[?global.current_ga_vote_nation.GetNameWithFlag] has proposed a non-binding resolution calling on all member states to adopt measures aimed at reducing poverty. Nations that vote in favor will commit to policies that improve stability at the cost of increased consumer goods spending.\n\n$un_ga_vote_requires_majority$"
 UN.11.t: "決議: 食料安全保障"
 UN.11.d: "[?global.current_ga_vote_nation.GetNameWithFlag] has proposed a non-binding resolution calling on all member states to prioritize food security and agricultural development. Nations that vote in favor will commit to boosting agricultural output at the cost of reduced industrial capacity.\n\n$un_ga_vote_requires_majority$"
 UN.12.t: "決議: 世界保健イニシアティブ"
 UN.12.d: "[?global.current_ga_vote_nation.GetNameWithFlag] has proposed a non-binding resolution calling on all member states to invest in global health initiatives. Nations that vote in favor will benefit from reduced healthcare costs at the expense of increased consumer goods spending.\n\n$un_ga_vote_requires_majority$"
 UN.13.t: "決議: 教育イニシアティブ"
 UN.13.d: "[?global.current_ga_vote_nation.GetNameWithFlag] has proposed a non-binding resolution calling on all member states to increase investment in education. Nations that vote in favor will benefit from faster research and reduced education costs, but at the expense of slower construction.\n\n$un_ga_vote_requires_majority$"
 UN.14.t: "決議: クリーンエネルギー移行"
 UN.14.d: "[?global.current_ga_vote_nation.GetNameWithFlag] has proposed a non-binding resolution calling on all member states to accelerate the transition to clean energy. Nations that vote in favor will receive incentives for renewable energy construction but face penalties to fossil fuel infrastructure and factory output.\n\n$un_ga_vote_requires_majority$"
 UN.15.t: "決議: 経済成長"
 UN.15.d: "[?global.current_ga_vote_nation.GetNameWithFlag] has proposed a non-binding resolution calling on all member states to adopt policies that promote economic growth. Nations that vote in favor will benefit from increased productivity and factory output, but at the cost of reduced political power and increased consumer goods spending.\n\n$un_ga_vote_requires_majority$"
 UN.16.t: "決議: インフラ開発"
 UN.16.d: "[?global.current_ga_vote_nation.GetNameWithFlag] has proposed a non-binding resolution calling on all member states to invest in infrastructure development. Nations that vote in favor will benefit from faster infrastructure and civilian factory construction, but at the cost of slower arms factory construction and increased consumer goods spending.\n\n$un_ga_vote_requires_majority$"
 UN.17.t: "決議: 格差縮小"
 UN.17.d: "[?global.current_ga_vote_nation.GetNameWithFlag] has proposed a non-binding resolution calling on all member states to adopt measures to reduce inequality. Nations that vote in favor will benefit from improved stability, but at the cost of reduced political power and increased consumer goods spending.\n\n$un_ga_vote_requires_majority$"
 UN.18.t: "決議: 気候行動"
 UN.18.d: "[?global.current_ga_vote_nation.GetNameWithFlag] has proposed a non-binding resolution calling on all member states to take aggressive action on climate change. Nations that vote in favor will receive incentives for renewable energy but face significant penalties to fossil fuel plants and factory output.\n\n$un_ga_vote_requires_majority$"
 UN.19.t: "決議: 平和と制度"
 UN.19.d: "[?global.current_ga_vote_nation.GetNameWithFlag] has proposed a non-binding resolution calling on all member states to strengthen peaceful institutions and governance. Nations that vote in favor will benefit from increased political power and drift defense, but at the cost of slower arms factory construction and increased consumer goods spending.\n\n$un_ga_vote_requires_majority$"
 UN.20.t: "決議: 貿易提携"
 UN.20.d: "[?global.current_ga_vote_nation.GetNameWithFlag] has proposed a non-binding resolution calling on all member states to strengthen international trade partnerships. Nations that vote in favor will benefit from improved trade relations, but at the cost of reduced political power.\n\n$un_ga_vote_requires_majority$"
 UN.21.t: "決議: デジタル発展"
 UN.21.d: "[?global.current_ga_vote_nation.GetNameWithFlag] has proposed a non-binding resolution calling on all member states to invest in digital infrastructure and development. Nations that vote in favor will benefit from faster internet, microchip, and research development, but at the cost of increased consumer goods spending and slower infrastructure construction.\n\n$un_ga_vote_requires_majority$"
 UN.410.t: "決議: 貧困削減"
 UN.410.d: "The §BUnited Nations§! §YGeneral Assembly§! has passed a non-binding resolution on §YPoverty Reduction§!. Although we did not vote in favor of this resolution, we may still choose to accept and implement it.\n\nShould we agree to follow this resolution?"
 UN.410.a: "Accept the Resolution"
 UN.410.b: "Reject the Resolution"
