 AFG.liberalism_2017: "£AFG_liberalism_2017 阿富汗绿色趋势"
 AFG.liberalism_2017_icon: "£AFG_liberalism_2017"
 AFG.liberalism_2017_desc: "（自由大西洋主义） - 阿富汗绿色趋势，又称“Rawand-e Sabz-e Afghanistan”，是一个反塔利班的阿富汗民族主义与亲民主政党。该运动由前阿富汗情报负责人阿姆鲁拉·萨利赫创立，最初是一场推动民主、反对塔利班的草根运动。"
 AFG.Mod_Vilayat_e_Faqih_1: "£generic_Mod_Vilayat_e_Faqih_small 阿富汗真主党（温和派）"
 AFG.Mod_Vilayat_e_Faqih_desc_1: "（什叶派伊斯兰主义） - 阿富汗真主党成立于1980年，但直到2005年才注册为政党，其根源在于受1979年伊朗革命影响的人士。随着伊斯兰革命的巩固，伊朗开始支持各类兴起的民兵或政治团体，这些团体大多宣誓效忠阿亚图拉。阿富汗真主党参与了阿富汗内战，在战争中与苏联军队和民主共和国政府作战。内战结束后，该组织逐渐开始缓和立场，转向一个倡导阿富汗什叶派民众权利的团体，而非寻求伊朗式的全面伊斯兰革命。"
 AFG.Vilayat_e_Faqih_1: "£generic_Vilayat_e_Faqih_small 阿富汗真主党"
 AFG.Vilayat_e_Faqih_desc_1: "（霍梅尼主义） - 阿富汗真主党成立于1980年，但直到2005年才注册为政党，其根源在于受1979年伊朗革命影响的人士。随着伊斯兰革命的巩固，伊朗开始支持各类兴起的民兵或政治团体，这些团体大多宣誓效忠阿亚图拉。阿富汗真主党参与了阿富汗内战，在战争中与苏联军队和民主共和国政府作战。内战结束后，该组织逐渐开始缓和立场，转向一个倡导阿富汗什叶派民众权利的团体，而非寻求伊朗式的全面伊斯兰革命。"
