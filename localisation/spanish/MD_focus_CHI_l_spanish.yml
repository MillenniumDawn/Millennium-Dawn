 CHI_nuke_general: "General nuclear"
 CHI_nuke_general_desc: "El general Tsing Shi Tao es la principal autoridad del EPL en guerra nuclear y radiológica. Aboga por integrar capacidades nucleares tácticas directamente en operaciones convencionales, una doctrina que le ha valido tanto respeto como controversia dentro del Estado Mayor."
 CHI_special_weapons_general: "Comandante de armas especiales"
 CHI_special_weapons_general_desc: "La general Leang es una de las comandantes superiores más versátiles del EPL, combinando experiencia en sistemas de armas avanzados con la doctrina de artillería convencional. Considerada una prodigio dentro del Estado Mayor, es conocida por su habilidad para integrar tecnología de vanguardia en operaciones de armas combinadas."
 CHI_tank_general: "General de tanques"
 CHI_tank_general_desc: "El general Kwai se encuentra entre los más destacados comandantes de guerra blindada del EPL, conocido por su uso agresivo de formaciones de tanques pesados y su convicción de que la potencia de fuego abrumadora decide las batallas antes de que el enemigo pueda responder."
