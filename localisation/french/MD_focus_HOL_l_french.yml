 HOL_asml_tsmc_group: "Alliance technologique ASML-TSMC"
 HOL_asml_tsmc_group_desc: "L'alliance technologique ASML-TSMC représente la pointe de la recherche et de la production de semi-conducteurs. En combinant l'expertise néerlandaise en lithographie et le leadership taïwanais en fabrication, ce partenariat vise à dominer le paysage technologique mondial, assurant un accès inégalé aux microprocesseurs avancés et à l'innovation."
 HOL_willem_alexander_army_captain: "Général de brigade royale"
 HOL_willem_alexander_navy_captain: "Commandant de la Marine royale"
 HOL_willem_alexander_airforce_captain: "Commodore de la Royal Air"
 HOL_groningen_quake_reduce_tt: "Changement mensuel du séisme à Groningue : §G-10%§!"
 HOL_groningen_quake_end_tt: "§GMet fin aux séismes induits à Groningue.§!"
 HOL_groningen.1.t: "Le sol bouge à Groningue"
 HOL_groningen.1.d: "Des années d'extraction gazière continue ont déstabilisé le sous-sol de Groningue. Le premier séisme induit majeur a frappé, fissurant des maisons et endommageant les infrastructures. Tant que les puits pomperont, les secousses reviendront."
 HOL_groningen.1.a: "Nous gérerons les conséquences"
 HOL_groningen.2.t: "Séisme à Groningue"
 HOL_groningen.2.d: "Le sol a encore bougé, fissurant des maisons et endommageant les infrastructures à travers la province tandis que les secousses induites se poursuivent."
 HOL_groningen.2.a: "Réparer les dégâts"
 HOL_soft_power_doctrine: "Doctrine du soft power"
 HOL_soft_power_doctrine_desc: "Les Pays-Bas exercent une influence au-delà de leur taille via l'aide au développement, le leadership européen et la projection mondiale de leur expertise en eau et logistique. Formaliser cela en doctrine canalise le capital politique vers une influence étrangère durable."
 HOL_development_cooperation_ministry: "Ministère de la Coopération au développement"
 HOL_development_cooperation_ministry_desc: "Les Pays-Bas restaurent le financement complet de leur ministère de la coopération au développement, historiquement l'un des contributeurs d'APD les plus généreux par rapport au PIB. Les flux d'aide visent à bâtir des partenariats de long terme avec les gouvernements bénéficiaires plutôt qu'à extraire des concessions politiques."
 HOL_global_development_partnerships: "Partenariats de développement mondiaux"
 HOL_global_development_partnerships_desc: "Les ambassades néerlandaises et les attachés au développement étendent les programmes à travers l'Afrique, l'Asie, le Moyen-Orient et l'Amérique latine. Les gouvernements bénéficiaires enregistrent le caractère constant et non coercitif de l'aide néerlandaise comme une marque de crédibilité."
 HOL_untied_aid_program: "Programme d'aide non liée"
 HOL_untied_aid_program_desc: "Les Pays-Bas s'engagent à une aide au développement déliée, ce qui signifie que les nations bénéficiaires peuvent se procurer biens et services sur les marchés ouverts. Cette approche approfondit la bienveillance et élargit l'influence néerlandaise au-delà de ce que la conditionnalité bilatérale pourrait obtenir."
 HOL_humanitarian_leadership: "Leadership humanitaire"
 HOL_humanitarian_leadership_desc: "Les Pays-Bas se positionnent au centre du droit humanitaire international et de la réponse aux crises, s'appuyant sur le rôle de La Haye comme siège de la Cour internationale de justice et de la Cour pénale internationale. Ce standing international isole la politique étrangère néerlandaise des pressions de la tension mondiale."
 HOL_humanitarian_leadership_name: "Leadership humanitaire"
 HOL_humanitarian_leadership_name_desc: "En tant qu'hôte des cours internationales, les Pays-Bas exercent une autorité morale qui stabilise la politique intérieure et leur permet d'engager des forces à l'étranger avec bien moins de friction diplomatique."
 HOL_eu_single_market_champion: "Champion du marché unique européen"
 HOL_eu_single_market_champion_desc: "Les Pays-Bas figurent constamment parmi les États membres de l'UE les plus engagés à approfondir le marché unique, notamment dans les services, le commerce numérique et la régulation financière. Les diplomates néerlandais font activement pression au sein des institutions européennes pour lever les barrières restantes."
 HOL_frugal_four_leadership: "Leadership frugal à quatre"
 HOL_frugal_four_leadership_desc: "Avec l'Autriche, le Danemark et la Suède, les Pays-Bas mènent le bloc fiscalement conservateur au sein de l'UE, insistant sur la discipline budgétaire et la conditionnalité des réformes pour les dépenses conjointes. Cette coordination amplifie l'influence néerlandaise dans les négociations fiscales européennes bien au-delà de ce que le levier bilatéral seul pourrait procurer."
 HOL_european_strategic_autonomy: "Autonomie stratégique européenne"
 HOL_european_strategic_autonomy_desc: "Les Pays-Bas défendent une identité européenne plus forte en matière de défense et de politique étrangère, soutenant la boussole stratégique de l'UE et contribuant aux capacités conjointes. Les diplomates néerlandais bâtissent des coalitions parmi les partenaires européens pour orienter le bloc vers des postures stratégiques plus indépendantes."
 HOL_water_diplomacy_initiative: "Initiative de diplomatie de l'eau"
 HOL_water_diplomacy_initiative_desc: "Des ingénieurs hydrauliques néerlandais et des experts de Deltares sont déployés via un programme diplomatique formel vers des pays sujets aux inondations et à la pénurie d'eau en Afrique, Asie et Amérique latine. Les travaux du Delta et l'approche néerlandaise de la gestion intégrée de l'eau servent de modèles de référence, bâtissant des relations techniques et politiques durables."
 HOL_gateway_to_europe: "Porte d'entrée de l'Europe"
 HOL_gateway_to_europe_desc: "Rotterdam est le plus grand port d'Europe et Schiphol l'un de ses premiers hubs aériens. Les Pays-Bas tirent parti de cette centralité logistique comme atout diplomatique, accueillant des missions commerciales et positionnant les infrastructures néerlandaises comme point d'entrée privilégié pour les partenaires cherchant l'accès aux marchés européens."
 HOL_global_trade_facilitation: "Facilitation du commerce mondial"
 HOL_global_trade_facilitation_desc: "Les diplomates néerlandais défendent un commerce ouvert et fondé sur des règles à travers les marchés alignés sur l'Occident et non alignés. Des accords bilatéraux de facilitation commerciale, adossés à la capacité de transit de Rotterdam et aux services financiers néerlandais, étendent la portée commerciale et politique des Pays-Bas."
 HOL_dutch_soft_power_powerhouse: "Puissance de soft power néerlandaise"
 HOL_dutch_soft_power_powerhouse_desc: "Les Pays-Bas ont systématiquement cultivé leur réputation de partenaire fiable, principiel et capable en matière de développement, de leadership européen et de commerce. Leur soft power dépasse désormais ce que leur population et leur poids militaire laisseraient prévoir, accordant une influence politique persistante dans les forums internationaux."
 HOL_development_partner_opinion: "Partenaire de développement néerlandais"
 HOL_water_partnership_opinion: "Partenariat néerlandais pour l'eau"
 HOL_eu_leadership_opinion: "Leadership néerlandais dans l’UE"
 HOL_mocro.1.t: "Un narco-État, à un mot près ?"
 HOL_mocro.1.d: "La cocaïne afflue par Rotterdam, des réseaux criminels enracinés dans le milieu de la ville blanchissent des milliards, et une série d'assassinats a frappé témoins, avocats et un journaliste. Les commentateurs demandent ouvertement si les Pays-Bas cèdent du terrain au crime organisé."
 HOL_mocro.1.a: "Affronter la menace à l'État de droit"
 HOL_mocro.1.b: "La menace est exagérée"
 HOL_mocro.2.t: "Prise record de cocaïne à Rotterdam"
 HOL_mocro.2.d: "Les douaniers ont intercepté des tonnes de cocaïne cachées dans un conteneur de fruits. Les enquêteurs soupçonnent des dockers corrompus, les soi-disant extracteurs, d'avoir guidé l'envoi à travers le port."
 HOL_mocro.2.a: "Renforcer les douanes au port"
 HOL_mocro.2.b: "L'envoi passe"
 HOL_mocro.3.t: "Un avocat abattu par balles"
 HOL_mocro.3.d: "Un avocat de la défense lié à un grand procès du crime organisé a été abattu en plein jour. L'assassinat est un assaut direct contre le système judiciaire et a horrifié le public."
 HOL_mocro.3.a: "Assurer la protection de l'État aux témoins"
 HOL_mocro.3.b: "Nous ne pouvons pas protéger tout le monde"
 HOL_mocro.4.t: "Réseau crypté fissuré"
 HOL_mocro.4.d: "La police a percé un réseau de téléphones chiffrés utilisé par des organisations criminelles, récoltant des millions de messages sur le trafic, le blanchiment et des assassinats planifiés."
 HOL_mocro.4.a: "Agir sur les messages interceptés"
 HOL_mocro.4.b: "Nous n'avons pas les effectifs pour suivre chaque piste"
 HOL_mocro.5.t: "L'argent sale dans la pierre"
 HOL_mocro.5.d: "Les enquêteurs ont tracé des profits de drogue blanchis dans l'immobilier, les restaurants et les petites entreprises à travers le pays. Démêler la propriété sera lent et politiquement sensible."
 HOL_mocro.5.a: "Saisir les avoirs"
 HOL_mocro.5.b: "Fermer les yeux"
 HOL_mocro.6.t: "Une génération perdue"
 HOL_mocro.6.d: "Des recruteurs attirent des adolescents de quartiers en difficulté dans le trafic de drogue avec de l'argent facile et du statut, tandis qu'une sous-culture juvénile violente glorifie la vie de gangster."
 HOL_mocro.6.a: "Financer la prévention et les programmes jeunesse"
 HOL_mocro.6.b: "Répondre par une répression dure"
 HOL_mocro.7.t: "Corruption dans le port"
 HOL_mocro.7.d: "Une enquête interne a découvert des douaniers, des dockers et des policiers à la solde des réseaux criminels. Les extirper risque de paralyser les opérations du port."
 HOL_mocro.7.a: "Purger les officiels corrompus"
 HOL_mocro.7.b: "Il n'y a pas de preuve sur laquelle agir"
 HOL_mocro.8.t: "Le procès Marengo rend son verdict"
 HOL_mocro.8.d: "Après des années de procédure sous sécurité extraordinaire, le tribunal a condamné les chefs du syndicat criminel le plus notoire du pays. C'est une victoire historique pour l'État de droit."
 HOL_mocro.8.a: "Justice est faite"
 VVD_Leader_Wilders: "§YGeert Wilders§! est le chef du VVD £HOL_western_liberal"
 HOL_wilders_vvd_firebrand: "Le brandon des médias"
 HOL_wilders_vvd_firebrand_desc: "Sa présence incessante dans la presse et au parlement tient les rivaux sur la défensive et durcit le parti face aux pressions extérieures."
 HOL_voice_of_the_discontented: "Voix des mécontents"
 HOL_voice_of_the_discontented_desc: "Il parle pour les électeurs que les autres ignorent, les liant au parti tout en protégeant le pays des ingérences étrangères."
 HOL_asylum_clampdown: "Répression des demandes d'asile"
 HOL_asylum_clampdown_desc: "Des règles d'entrée plus strictes et des procédures plus rapides réduisent fortement les nouvelles arrivées, allégeant la pression sur le logement et le marché du travail."
 HOL_politics.82.t: "Arrêt d'asile"
 HOL_politics.82.d: "Les centres d'accueil débordent et le public exige une action. Wilders presse pour la réponse la plus dure possible à l'afflux d'asile."
 HOL_politics.82.a: "Imposer un plafond légal strict"
 HOL_politics.82.b: "Ordonner des expulsions massives"
 HOL_politics.83.t: "Le débat sur l'intégration"
 HOL_politics.83.d: "Wilders impose un débat national sur l'islam, l'intégration et l'identité néerlandaise. Le parti doit décider jusqu'où pousser."
 HOL_politics.83.a: "Mandat cours d'assimilation"
 HOL_politics.83.b: "Défendre la liberté d'expression et affronter"
 HOL_politics.84.t: "Ambassade à Jérusalem"
 HOL_politics.84.d: "Fervent défenseur d'Israël, Wilders exhorte le gouvernement à reconnaître Jérusalem et à y transférer l'ambassade des Pays-Bas. Washington applaudirait, mais les capitales de la région mettent en garde contre les conséquences."
 HOL_politics.84.a: "Déplacer l'ambassade à Jérusalem"
 HOL_politics.84.b: "Garder l'ambassade à Tel-Aviv"
 HOL_polder_model: "Le modèle Polder"
 HOL_polder_model_desc: "Le modèle du polder est la tradition néerlandaise de prise de décision politique par consensus, où gouvernement, employeurs et syndicats négocient des accords généraux plutôt que d'imposer des décisions. Ancré dans des siècles de gestion coopérative de l'eau, il privilégie le compromis et les coalitions stables, conférant à la vie politique néerlandaise résilience et crédibilité diplomatique, au prix de réformes plus lentes et plus réfléchies."
 HOL_politics.85.t: "La France rejoint le partage"
 HOL_politics.85.d: "Paris a accepté notre proposition et pressera la Belgique pour un référendum sur son avenir. Les bases du partage sont posées. Nous pouvons désormais faire avancer l'affaire via nos décisions Belgique."
 HOL_politics.85.a: "Parfait"
 BNL_aswf_frigates_remaining_tt: "Moins de quatre frégates ASWF ont été livrées"
 BNL_lay_down_aswf_frigate: "Poser une frégate ASWF"
 BNL_lay_down_aswf_frigate_desc: "Le programme de frégates de lutte anti-sous-marine est un effort belgo-néerlandais pour remplacer les frégates vieillissantes des classes Karel Doorman et Wielingen par quatre coques modernes, deux pour la marine royale néerlandaise et deux pour la composante navale belge. Construit autour d'une coque silencieuse, d'un sonar remorqué et d'un hélicoptère ASM embarqué, chaque navire est mis en cale aux chantiers Damen sur un cycle complet avant de rejoindre la flotte."
 BNL_aswf_capability_update: "Mise à jour des capacités à mi-vie de l'ASWF"
 BNL_aswf_capability_update_desc: "Les quatre frégates ASM étant en service, le bureau de programme binational autorise une modernisation de mi-vie. Propulsion améliorée, suite sonar, cellules de défense aérienne renforcées et installation hélicoptère rénovée maintiennent la classe compétitive face aux menaces sous-marines modernes jusqu'à la fin de sa vie."
 HOL_deploy_islands_commando: "Déployer des commandos sur les îles extérieures"
 HOL_gulden_reintroduced: "§Y[HOL.GetNameWithFlag]§! A réintroduit le $gulden$ comme monnaie nationale"
 HOL_marinestudie_tt: "Les nouveaux §Ychefs de la marine§! peuvent recevoir le trait §Y$HOL_navy_moderniser_leader$§! lors d'une promotion."
 HOL_navy_moderniser_leader: "Modernisateur naval"
 HOL_nationalist_populism_modifier: "Netherlands First"
 HOL_FAD_GER_declined: "§Y[GER.GetNameWithFlag]§! a quitté le projet"
 HOL_FAD_construction: "Construction du futur défenseur aérien"
 HOL_FAD_construction_desc: "Nos chantiers construisent les frégates de défense aérienne Future Air Defender. Quand le programme s'achève, les navires terminés sont commissionnés directement dans la flotte."
 HOL_FAD_delay_reduced_tt: "Un nouveau partenaire raccourcit le temps de construction restant"
 HOL_FAD_ger_withdrew_tt: "Le retrait de l'Allemagne retarde la construction restante"
 HOL_military.038.t: "Les Pays-Bas doivent décider de leur futur défenseur aérien"
 HOL_military.038.d: "Le Future Air Defender s'est heurté à des coûts en hausse et à des exigences divergentes, et les chantiers ont besoin de davantage d'argent pour tenir le calendrier. Le Bundestag doit décider s'il augmente sa part de financement ou se retire du programme."
 HOL_military.038.a: "Invest more and build two ships"
 HOL_military.038.b: "Seek new partners in Scandinavia"
 HOL_ing_group_upgrades_tt: "Expansions internationales d'ING : §Y[?HOL_ing_group_upgrades|0]§!/3"
 HOL_daf_organization: "DAF (Van Doorne's Automobiel Fabriek)"
 HOL_werkspoor_equipment_manufacturer_mio_header_diesel_locomotive_program: "Programme de locomotives diesel"
 HOL_werkspoor_equipment_manufacturer_mio_header_industrial_diversification: "Diversification industrielle"
 BEL_sabiex_international_tank_manufacturer_mio_header_m113_heritage: "M113 Héritage"
 BEL_sabiex_international_tank_manufacturer_mio_header_wheeled_armour: "Armure à roues"
 BEL_sabiex_international_tank_manufacturer_mio_header_logistics_fleet: "Flotte Logistique"
 Pim_Fortuyn_Alive: "§YPim Fortuyn§! est en vie"
 HOL_wilders_party_created: "Parti pour la liberté créé"
 HOL_D66_in_progress_flag: "Focus D66 en cours"
 HOL_SGP_in_progress_flag: "Focus SGP en cours"
 HOL_GL_in_progress_flag: "Focus GroenLinks en cours"
 HOL_failed_declaring_war_voc: "Échec à déclarer la guerre pour la VOC"
 HOL_suriname_accepted_infrastructure: "Accord d'infrastructure du Suriname accepté"
 HOL_accepted_FRA_carrier: "Assistance transporteur français acceptée"
 HOL_claim_german_leadership_tt: "Les revenus du gouvernement dépassent les dépenses du gouvernement."
 HOL_voc_india_christian_tt: "L'opinion de la communauté chrétienne sur le gouvernement indien est inférieure à 50 %."
 HOL_asml_high_na_innovation_monopoly: "Monopole de l’innovation à forte NA"
 HOL_asml_high_na_innovation_monopoly_desc: "ASML combine une production EUV mature, un leadership High-NA et un réseau de fournisseurs résilient. La recherche et la capacité de service néerlandaises soutiennent sa position unique en lithographie avancée."
 HOL_asml_resilient_european_tooling_network: "Réseau d'outillage européen résilient"
 HOL_asml_resilient_european_tooling_network_desc: "ASML ancre un réseau européen diversifié de fournisseurs de précision et d'équipes de service sur site. Fiabilité et support client convertissent la demande d'équipement en revenus d'exportation durables."
 HOL_asml_neutral_global_lithography_utility: "Utilitaire de lithographie globale neutre"
 HOL_asml_neutral_global_lithography_utility_desc: "ASML sert des clients qualifiés à travers les blocs politiques selon une politique d'allocation commercialement neutre. Un accès large soutient les partenariats de recherche et les revenus d'exportation."
 HOL_asml_strategic_western_gatekeeper: "Gardien stratégique de l'Occident"
 HOL_asml_strategic_western_gatekeeper_desc: "La politique de licences néerlandaise concentre l'accès aux systèmes avancés parmi les partenaires stratégiques. La politique renforce le levier national tout en rétrécissant la portée commerciale d'ASML."
 HOL_asml_commercial_tooling_champion: "Champion de l'outillage commercial"
 HOL_asml_commercial_tooling_champion_desc: "ASML reste un fournisseur mondial d'équipements rentable sans atteindre l'un des résultats stratégiques plus spécialisés. Sa position de recherche et d'exportation bénéficie encore à l'économie néerlandaise."
 HOL_asml_backlog_pressure_moderate: "Carnet d’outils élevé"
 HOL_asml_backlog_pressure_moderate_desc: "Une forte demande de lithographie alourdit les charges de service et d'ingénierie tout en soutenant les revenus d'exportation d'équipements."
 HOL_asml_backlog_pressure_severe: "Retard important dans les outils"
 HOL_asml_backlog_pressure_severe_desc: "Un carnet de commandes exceptionnel booste les revenus d'équipement mais détourne les ingénieurs de la recherche et de la qualification clients."
 HOL_asml_events.1.t: "S'engager dans l'EUV"
 HOL_asml_events.1.d: "Au début du siècle, ASML doit décider si la lithographie ultraviolette extrême mérite un investissement soutenu malgré des problèmes non résolus de source et d'optique. La décision façonnera l'horizon de recherche de l'entreprise."
 HOL_asml_events.1.a: "S'engager sur le long horizon"
 HOL_asml_events.1.a_tt: "Leadership en lithographie : §G+1§!\nMaturité EUV : §G+1§!"
 HOL_asml_events.1.b: "Équilibrer l'EUV et les plateformes actuelles"
 HOL_asml_events.1.b_tt: "Résilience des fournisseurs : §G+2§!\nDiversification des clients : §G+1§!"
 HOL_asml_events.2.t: "Consolider le programme EUV"
 HOL_asml_events.2.d: "Le travail de prototype a révélé à quel point sources EUV, optiques, platines et logiciels dépendent les uns des autres. ASML peut consolider le programme ou prioriser les livraisons clients plus proches."
 HOL_asml_events.2.a: "Unifier le programme de développement"
 HOL_asml_events.2.a_tt: "Maturité EUV : §G+1§!\nRésilience des fournisseurs : §G+1§!"
 HOL_asml_events.2.b: "Protéger les livraisons en cours"
 HOL_asml_events.2.b_tt: "Diversification de la clientèle : §G+2§!\nMaturité EUV : §R-1§!"
 HOL_asml_events.3.t: "Premiers outils EUV Alpha"
 HOL_asml_events.3.d: "Les premiers systèmes de démonstration alpha d'ASML font passer l'EUV des composants de laboratoire à des outils intégrés. Les machines restent expérimentales, et les priorités d'ingénierie détermineront ce que les prototypes enseigneront."
 HOL_asml_events.3.a: "Outils alpha intégrés Push"
 HOL_asml_events.3.a_tt: "Leadership en lithographie : §G+1§!\nMaturité EUV : §G+2§!"
 HOL_asml_events.3.b: "Prioriser la fiabilité des prototypes"
 HOL_asml_events.3.b_tt: "Maturité EUV : §G+1§!\nRésilience des fournisseurs : §G+2§!"
 HOL_asml_events.4.t: "Acquérir BRION"
 HOL_asml_events.4.d: "La lithographie computationnelle peut aider les clients à prédire comment masques et conditions de procédé affectent les motifs imprimés. Acquérir BRION intégrerait ces modèles aux scanners d'ASML."
 HOL_asml_events.4.a: "Intégrer l'expertise de BRION"
 HOL_asml_events.4.a_tt: "Leadership en lithographie : §G+1§!\nDiversification de la clientèle : §G+1§!"
 HOL_asml_events.4.b: "Développer la capacité en interne"
 HOL_asml_events.4.b_tt: "Leadership en lithographie : §G+1§!\nContrôle stratégique : §G+1§!"
 HOL_asml_events.5.t: "Intégrer la métrologie YieldStar"
 HOL_asml_events.5.d: "La métrologie YieldStar peut relier les performances du scanner aux mesures prises sur des wafers de production. ASML doit décider s'il faut mettre l'accent sur le contrôle de procédé intégré ou un modèle de service plus large."
 HOL_asml_events.5.a: "Intégrer les données scanner et métrologie"
 HOL_asml_events.5.a_tt: "Maturité EUV : §G+1§!\nRésilience des fournisseurs : §G+1§!"
 HOL_asml_events.5.b: "Construire un modèle de service de métrologie"
 HOL_asml_events.5.b_tt: "Diversification de la clientèle : §G+2§!\nRésilience des fournisseurs : §G+1§!"
 HOL_asml_events.6.t: "Livrer le NXE:3100"
 HOL_asml_events.6.d: "Samsung est prêt à recevoir un NXE:3100 d'ASML, le premier système EUV proposé à un client. La livraison peut approfondir l'apprentissage client, tandis qu'un travail de laboratoire supplémentaire pourrait réduire le risque technique avant un déploiement plus large."
 HOL_asml_events.6.a: "Livrer le système à Samsung"
 HOL_asml_events.6.a_tt: "Maturité EUV : §G+1§!\nDiversification de la clientèle : §G+1§!"
 HOL_asml_events.6.b: "Étendre la validation en laboratoire"
 HOL_asml_events.6.b_tt: "Maturité EUV : §G+2§!\nDiversification de la clientèle : §R-1§!"
 HOL_asml_events.7.t: "Programme de co-investissement clients"
 HOL_asml_events.7.d: "ASML demande aux grands clients de co-investir dans la capacité de recherche nécessaire à la lithographie de nouvelle génération. Samsung peut être invité à participer, ou l'entreprise néerlandaise peut préserver le contrôle par un financement interne."
 HOL_asml_events.7.a: "Inviter Samsung à participer"
 HOL_asml_events.7.a_tt: "Diversification de la clientèle : §G+1§!\nContrôle stratégique : §G+1§!\nSamsung reçoit un événement de réponse négociée lorsque la Corée est disponible."
 HOL_asml_events.7.b: "Financer le programme en interne"
 HOL_asml_events.7.b_tt: "Contrôle stratégique : §G+2§!\nDiversification des clients : §R-1§!"
 HOL_asml_events.8.t: "Intégrer Cymer"
 HOL_asml_events.8.d: "L'ingénierie des sources lumineuses de Cymer est centrale au débit et à la disponibilité EUV. Intégrer le fournisseur dans ASML peut améliorer la coordination, tandis qu'une stratégie de sources diversifiées préserverait davantage de redondance externe."
 HOL_asml_events.8.a: "Intégrer les équipes sources de Cymer"
 HOL_asml_events.8.a_tt: "Maturité EUV : §G+1§!\nRésilience des fournisseurs : §G+2§!"
 HOL_asml_events.8.b: "Maintenir un travail de source diversifié"
 HOL_asml_events.8.b_tt: "Résilience des fournisseurs : §G+2§!\nMaturité EUV : §G+1§!"
 HOL_asml_events.9.t: "Préparer le NXE:3400"
 HOL_asml_events.9.d: "La génération NXE:3400 doit transformer les performances EUV en un système adapté à la production en volume. ASML peut accélérer la commercialisation ou utiliser une montée plus lente pour protéger la fiabilité."
 HOL_asml_events.9.a: "Préparer le déploiement commercial"
 HOL_asml_events.9.a_tt: "Maturité EUV : §G+1§!\nDiversification de la clientèle : §G+1§!"
 HOL_asml_events.9.b: "Utilisez une rampe conservatrice"
 HOL_asml_events.9.b_tt: "Résilience des fournisseurs : §G+2§!\nMaturité EUV : §G+1§!"
 HOL_asml_events.10.t: "Validation commerciale EUV"
 HOL_asml_events.10.d: "L'EUV devient une technologie de production dans les fonderies de pointe. ASML peut se concentrer sur les performances du système ou étendre l'organisation de service nécessaire pour soutenir une base installée croissante."
 HOL_asml_events.10.a: "Valider la plateforme commerciale"
 HOL_asml_events.10.a_tt: "Leadership en lithographie : §G+1§!\nMaturité EUV : §G+1§!"
 HOL_asml_events.10.b: "Faites évoluer le service client en premier"
 HOL_asml_events.10.b_tt: "Diversification de la clientèle : §G+2§!\nRésilience des fournisseurs : §G+1§!"
 HOL_asml_events.11.t: "Le centième système EUV"
 HOL_asml_events.11.d: "Le centième système EUV expédié par ASML marque une forte hausse de la base installée. L'entreprise doit accompagner la croissance de production avec pièces de rechange, ingénieurs de terrain et support client."
 HOL_asml_events.11.a: "Étendre le service avec les livraisons"
 HOL_asml_events.11.a_tt: "Résilience des fournisseurs : §G+2§!\nDiversification des clients : §G+1§!"
 HOL_asml_events.11.b: "Prioriser le volume de livraison"
 HOL_asml_events.11.b_tt: "Diversification de la clientèle : §G+2§!\nRésilience des fournisseurs : §R-1§!"
 HOL_asml_events.12.t: "Livrer le premier système High-NA"
 HOL_asml_events.12.d: "Le premier système EUV High-NA d'ASML introduit une ouverture numérique plus grande et une nouvelle génération de défis d'intégration de procédé, et Intel le veut en premier. Une livraison précoce peut prouver le leadership technique ou soutenir un pilote client plus large."
 HOL_asml_events.12.a: "Livrer le premier système complet"
 HOL_asml_events.12.a_tt: "Leadership en lithographie : §G+1§!\nMaturité EUV : §G+2§!"
 HOL_asml_events.12.b: "Élargir le pilote client"
 HOL_asml_events.12.b_tt: "Maturité EUV : §G+1§!\nDiversification de la clientèle : §G+2§!"
 HOL_asml_events.13.t: "Ouvrir le laboratoire High-NA d'imec"
 HOL_asml_events.13.d: "ASML et imec ouvrent un laboratoire High-NA conjoint où clients et fournisseurs peuvent tester matériaux, masques et flux de procédé. L'installation peut mettre l'accent sur la validation partagée ou le contrôle propriétaire."
 HOL_asml_events.13.a: "Ouvrir le laboratoire conjoint"
 HOL_asml_events.13.a_tt: "Résilience des fournisseurs : §G+1§!\nDiversification des clients : §G+1§!"
 HOL_asml_events.13.b: "Gardez la validation propriétaire"
 HOL_asml_events.13.b_tt: "Leadership en lithographie : §G+1§!\nContrôle stratégique : §G+2§!"
 HOL_asml_events.14.t: "Élargir les contrôles à l'exportation avancés"
 HOL_asml_events.14.d: "Le gouvernement néerlandais étend les contrôles sur les équipements avancés de fabrication de semi-conducteurs, ce qui signifie en pratique décider à qui ASML peut vendre. Les licences peuvent suivre une politique de sécurité stratégique ou conserver une allocation plus large parmi les clients qualifiés."
 HOL_asml_events.14.a: "Adopter des licences stratégiques"
 HOL_asml_events.14.a_tt: "Contrôle stratégique : §G+3§!\nFixe la posture de marché Licences stratégiques."
 HOL_asml_events.14.b: "Préserver l’allocation ouverte"
 HOL_asml_events.14.b_tt: "Diversification client : §G+1§!\nContrôle stratégique : §R-2§!\nFixe la posture de marché Allocation ouverte aux clients."
 HOL_asml_events.15.t: "Évaluer la position stratégique d'ASML"
 HOL_asml_events.15.d: "Les choix accumulés d'ASML définissent désormais sa position en lithographie avancée, coordination des fournisseurs, service client et licences d'exportation. Cette évaluation finale est une synthèse de jouabilité plutôt qu'une mesure historique."
 HOL_asml_events.15.a: "Trancher l'issue stratégique d'ASML"
 HOL_asml_events.15.a_tt: "Applique exactement un aboutissement ASML selon les cinq scores d'entreprise bornés."
 HOL_asml_technology_threshold_tt: "Requiert un Leadership en lithographie supérieur à 7 et une Maturité EUV supérieure à 5."
 HOL_conservative_society_modifier: "Conservative Society"