 IP_TITLE: "Siły ideologiczne"
 IP_communist_category_desc: "[IP_communist_powers]"
 IP_socialist_category_desc: "[IP_socialist_powers]"
 IP_conservative_category_desc: "[IP_conservative_powers]"
 IP_liberal_category_desc: "[IP_liberal_powers]"
 IP_autocrat_category_desc: "[IP_autocrat_powers]"
 IP_monarchist_category_desc: "[IP_monarchist_powers]"
 IP_fundamentalist_symbol_desc: "[IP_fundamentalist_powers]"
 IP_communist_category_desc_delayed: "§L Komuniści zazwyczaj wyznają pewną odmianę marksizmu-leninizmu lub pokrewną ideologię. Jako zwolennicy gospodarki sterowanej przez państwo, łatwiej przeprowadzają uprzemysłowienie dzięki nacjonalizacji zagranicznych przedsiębiorstw oraz realizacji planów pięcioletnich. Mogą również skuteczniej wzmacniać własną orientację ideologiczną przy użyciu szpiegów. §!"
 IP_socialist_category_desc_delayed: "§L Socjaliści łączą elementy kapitalizmu rynkowego i państwowego z progresywizmem. Często koncentrują się na kierowaniu wszelkich działań rządu do wewnątrz kraju. Socjalistom łatwo jest poprawić sytuację wewnętrzną państwa dzięki polityce socjalnej oraz interwencjonizmowi gospodarczemu. §!"
 IP_conservative_category_desc_delayed: "§L Konserwatyści zazwyczaj chcą, aby kraj pozostał w niezmienionym kształcie, a nawet dążą do wycofania niektórych bardziej postępowych rozwiązań prawnych. Konserwatyzmowi często towarzyszą również elementy nacjonalizmu oraz głębokie przekonania religijne. Dzięki temu państwa konserwatywne łatwiej utrzymują stabilność polityczną i narodową, gdyż radykalne zmiany należą tam do rzadkości. §!"
 IP_liberal_category_desc_delayed: "§L Liberałowie zazwyczaj propagują idee wolności, choć niektóre partie przyjmują bardziej postępowe (socjalliberalne) podejście do poszczególnych kwestii. Fundamentem większości partii liberalnych jest koncepcja wolnego rynku przy bardzo ograniczonej ingerencji państwa. §!"
 IP_autocrat_category_desc_delayed: "§L Autokraci polegają na władzy „silnych ludzi” (a w rzadkich przypadkach – kobiet o takim statusie), by rządzić krajem. Demagodzy nie boją się stosować wątpliwych metod i zakulisowych układów, aby osiągnąć swoje cele. Autokratom łatwiej jest tolerować wysoki poziom korupcji i sprawować władzę nad narodem twardą ręką. §!"
 IP_monarchist_category_desc_delayed: "§L Monarchiści opierają swoje rządy na rodowodzie i chwale. Skupienie władzy w rękach jednej rodziny ma swoje zalety. Rodzina ta zapewnia władzę, a monarchowie potrafią inspirować swój lud. §!"
 IP_fundamentalist_symbol_desc_delayed: "§L Fundamentaliści to zagorzali konserwatyści wyznający radykalną lub ultrakonserwatywną odmianę islamu. Ich głównym celem jest szerzenie tych konserwatywnych poglądów również w innych krajach. §!"
