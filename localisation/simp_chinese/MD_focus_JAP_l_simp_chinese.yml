 Japan_economy.33.t: "The Probe Resumes"
 Japan_economy.33.d: "The review found what reviews find. A new lead has been appointed, the files have been returned, and the investigation resumes with the wind rather more against it than before. The firms have had six months to prepare, and they have used them."
 Japan_economy.33.a: "重新开始"
 Japan_economy.34.t: "The Register Is Clean"
 Japan_economy.34.d: "The last of the insolvent borrowers has been wound up. It took years, and the cost was paid in bankruptcies, in unemployment, and in a government that spent most of its political capital insisting the pain was necessary. What is left behind is an economy where credit goes to firms that can repay it, and where a balance sheet means what it says."
 Japan_economy.34.a: "It was worth the price."
 Japan_economy.35.t: "Nothing Failed"
 Japan_economy.35.d: "The insolvent names are gone from the register. None of them went bankrupt. They were absorbed into larger groups by ministry arrangement, and the larger groups now carry the duplicated plants, the duplicated laboratories, and the staff who were told on a Friday that they worked for a competitor on the Monday. No jobs were lost and nothing was admitted. Japan's industry is consolidated, stable, and slower than it was."
 Japan_economy.35.a: "The arrangement held."
 JAP_subaru_tank_manufacturer_header_systems_resilience: "系统韧性"