l_french:
 fiji_influence_defense_through_chaos: "Influencer la défense par le chaos"
 fiji_influence_defense_through_chaos_desc: "Les Fidji sont indépendantes depuis les années 1970, mais malheureusement, cette indépendance n'a pas apporté la gloire et la paix que nous aurions espérées. Des coups d'État civils et militaires et des tensions ethniques rampantes ont conduit le pays à être en pause par rapport à la plupart des autres pays du monde. Cependant, le chaos s'accompagne d'une sorte de barrière naturelle, car les nations étrangères sont trop prudentes pour perdre des actifs dans une région aussi petite à cause de ce chaos. Par conséquent, nous avons une défense nationale plus élevée que prévu contre les influences étrangères, une épée à double tranchant, certes, mais qui, pour le moment, joue en notre faveur."
 fiji_militarized_society: "Société militarisée"
 fiji_militarized_society_desc: "Le chaos et la violence du coup d'État de 2000 ont laissé une cicatrice sur le peuple. C'est la haine et la honte. Forte de cette cicatrice, une nouvelle génération a rejoint l'armée, contribuant ainsi à la création et à la popularité d'une junte militaire comme forme de leadership. Cela a ouvert la voie à la détermination et au devoir, où l'armée est la société et la société est l'armée."
 fiji_society_of_the_elected_king: "Société du Roi Élu"
 fiji_society_of_the_elected_king_desc: "Avec sa démonstration de force et sa mission fondamentale de défendre la nation, son histoire et son engagement à maintenir l'ordre public de manière juste, nombreux sont ceux qui ont perçu la lumière extrêmement trouble dont la Maison de Suva est sortie. Le choc subi par le peuple fidjien a laissé une impression qu'aucun gouvernement civil n'avait pu produire depuis l'indépendance. Nombreux sont ceux qui ont donc manifesté leur soutien et cherché à collaborer avec le nouveau système, même s'ils ne l'approuvent pas totalement."
 fiji_ostracized_commonwealth_member: "Membre du Commonwealth ostracisé"
 fiji_ostracized_commonwealth_member_desc: "Le chaos qui règne dans notre pays nous place en désaccord avec le reste du Commonwealth. Si nous bénéficions du pouvoir supplémentaire que cela nous confère sur le plan international, nous ne percevons pas pleinement la réalité des choses en raison de la tension interne qui pèse sur les membres étrangers. Mais nous accepterons au moins ce que nous pouvons."
 fiji_foreign_scientist_imports: "Importations de scientifiques étrangers"
 fiji_foreign_scientist_imports_desc: "Avec quelques mesures incitatives clés, nous pouvons attirer des esprits scientifiques aux Fidji avec la promesse d’un budget et, par exemple, de vacances permanentes loin de chez eux."
 fiji_pacific_exchange_and_investment_society: "Commission P.I.E.S."
 fiji_pacific_exchange_and_investment_society_desc: "La Pacific Investment & Exchange Society est une association et un groupe de relations internationales. Se présentant davantage comme un country club régional, elle nous permet d'attirer des investisseurs et d'exporter notre propre marque sur notre petite part du marché mondial."
 fiji_depoliticized_military: "Armée dépolitisée"
 fiji_depoliticized_military_desc: "Grâce à des échanges ténus avec l'armée, un accord a été conclu pour maintenir la séparation entre l'armée et le corps politique civil. Cet accord simple mais ferme pourrait ouvrir la voie à des réformes ultérieures visant à mieux faire des Fidji une petite puissance, certes régionale, mais néanmoins régionale."
 fiji_cohesive_integrations_act: "Loi sur les intégrations cohésives"
 fiji_cohesive_integrations_act_desc: "Nous cherchons à découvrir le monde qui nous entoure, à tisser des liens plus étroits avec nos semblables et à élargir nos horizons pour le bien de notre peuple et de ceux qui aspirent à ce bien."
 fiji_independence_sustainment_act: "Loi sur le maintien de l'indépendance"
 fiji_independence_sustainment_act_desc: "Suivant l'exemple américain et celui des pays du Moyen-Orient, nous cherchons à créer notre propre esprit d'indépendance. Car si notre nation est engloutie dans les machinations du monde, nous finirons par l'emporter contre toute attente."
 fiji_importing_ideas_exporting_ideals: "Importer des idées, exporter des idéaux"
 fiji_importing_ideas_exporting_ideals_desc: "Notre île est petite, mais nos ambitions sont grandes. Nous ne changerons peut-être pas fondamentalement le monde, mais nous pouvons néanmoins jouer un rôle important dans les affaires internationales. Notre R&D sera efficace et ciblée, ce qui nous permettra d'explorer de nouveaux domaines plus rapidement et par petites vagues. Cela renforcera l'attrait de notre nation auprès des puissances étrangères."
 fiji_pieces_for_the_peace: "Pièces pour la paix"
 fiji_pieces_for_the_peace-desc: "Grâce à notre nouvelle stabilité, nous pouvons désormais mieux chercher de l'aide et des opportunités auprès d'autres personnes dans le monde. Même s'il nous reste encore du chemin à parcourir, c'est un grand pas en avant, c'est le moins qu'on puisse dire."
 fiji_the_fijian_dream: "Le rêve fidjien"
 fiji_the_fijian_dream_desc: "J'ai un rêve : celui de voir ceux qui ont été mis à l'écart, méprisés et complètement abandonnés par la société se relever et regarder vers le haut, se dire : « Ce n'est pas la fin, mais plutôt un nouveau départ. » Ce rêve peut et doit se réaliser, et ce sera l'avenir de ceux qui portent le drapeau fidjien."
 fiji_building_tall_within_something_small: "Construire grand dans quelque chose de petit"
 fiji_building_tall_within_something_small_desc: "La loi sur la construction en hauteur est assez trompeuse pour quelqu'un qui ne la connaît pas. Ce projet de loi impose une forme d'automatisation de base, à laquelle notre population devrait être habituée et habituée. En comprenant ce principe, nous pouvons construire beaucoup sur une surface plus petite, rendant ainsi notre île plus efficace et, par conséquent, plus compétitive sur la scène internationale."
 fiji_new_foreign_image: "Nouvelle image étrangère"
 fiji_new_foreign_image_desc: "Notre peuple n'étant plus constamment en lutte, en fuite ou sans abri, le monde qui nous entoure commence à s'émerveiller. Notre île a connu une véritable transformation ces dernières années et, grâce à de réels efforts, des résultats tangibles sont obtenus."
 fiji_foriegn_advisory_board: "Conseil consultatif étranger"
 fiji_foriegn_advisory_board_desc: "Le Conseil consultatif étranger (FAB) est un groupe de conseillers civils et militaires qui renforceront et aideront notre nation à se mettre sur la bonne voie. Certains pourraient se demander si cela compromettrait l'indépendance de notre nation face aux forces extérieures. Soyez assurés que nous avons anticipé cette préoccupation, car ces conseillers étrangers seront de nouveaux citoyens de notre nation. Grâce aux incitations gouvernementales et au rachat de ces personnes par leurs propres pays, nous pouvons nous attendre à un impact limité de l'extérieur, tout en renforçant notre propre pays."
 fiji_national_rotc_program: "Programme national ROTC"
 fiji_national_rotc_program_desc: "Grâce à la mise en place du programme national de formation des officiers de réserve au sein du système éducatif national, nous pourrons enseigner l'unité, le leadership, l'innovation et le travail d'équipe aux générations futures. Les répercussions sur la stabilité nationale et sur l'éthique générale de notre peuple et de notre esprit seront considérables."
 fiji_expanded_ministry_of_science: "Ministère des Sciences élargi"
 fiji_expanded_ministry_of_science_desc: "En accordant la priorité au développement des technologies, nous pouvons accueillir de nombreuses avancées dans le domaine des applications civiles et militaires. Ainsi, malgré les coûts, nous devons chercher à améliorer notre position globale si nous voulons véritablement assurer l'avenir de notre nation."
 fiji_citizen_soldiers_amendment: "Amendement sur les citoyens-soldats"
 fiji_citizen_soldiers_amendment_desc: "Nous ne sommes pas un État avec une armée, mais plutôt une armée avec un État. Les idées de nationalisme dans le passé ont toujours été abusées par de mauvais acteurs pour atteindre des objectifs et ambitions personnels. Eh bien, plus maintenant. Par décret constitutionnel, nous établissons l'idée de ce qu'est le nationalisme fidjien, ce que signifie être fidjien et comment on peut véritablement vivre une vie dont on est fier."
 fiji_fijian_general_staff: "État-major général fidjien"
 fiji_fijian_general_staff_desc: "Le parlement militaire est essentiellement un grand état-major. Le mélange des affaires gouvernementales et militaires dans une chaîne de commandement unifiée signifie que la planification et la coordination des besoins, tant militaires que civils, peuvent être comprises et traitées à des vitesses dont aucun des deux côtés individuels ne rêverait. Mais nous devons être conscients du rôle que joue cet État-major général, car on peut perdre de vue ses objectifs entouré d'une telle concentration de pouvoir."
 fiji_research_institute_of_fiji: "Institut de recherche des Fidji"
 fiji_royal_engineers_program: "Programme des Royal Engineers"
 fiji_royal_engineers_program_desc: "Ce programme hybride limité, qui mélange les forces de travail civiles dans des projets gouvernementaux et, plus spécifiquement, militaires, est une fondation sur laquelle construire. Cela crée une ligne de base contrôlée qui empêche nos citoyens de tomber trop bas, car la pensée de tout perdre peut semer le chaos dans l'esprit et la prise de décision de beaucoup. Ce programme sera là comme un phare d'espoir pour ceux qui tombent, pour montrer que nous sommes là pour les aider à se relever."
 fiji_economic_planning_board: "Conseil de planification économique"
 fiji_economic_planning_board_desc: "Le CPE est une branche gouvernementale de la croissance économique. Bien que le secteur privé puisse encore s'amuser, pour ces prêcheurs anti-communistes craignant Dieu, ce ministère gouvernemental est plutôt une branche d'investissement indépendante. Cela vise à guider et lancer de nouvelles initiatives gouvernementales qui deviendront privées une fois la stabilité assurée. En bref, le CPE démarre des choses, le secteur privé les poursuit, espérons-le, à perpétuité."
 fiji_pacific_economics_exchange_commission: "Commission des échanges économiques du Pacifique"
 fiji_pacific_economics_exchange_commission_desc: "La CEÉP est une entreprise régionale conjointe pour mieux étendre notre influence et notre coopération avec les nations de notre région du monde. Bien que l'accent principal soit économique et politique, un à-côté d'enseignements militaires permettrait un bénéfice général pour tous ceux qui y participent."
 fiji_titles_by_election: "Titres par élection"
 fiji_titles_by_election_desc: "Les Titres par élection sont une exigence constitutionnelle selon laquelle le processus démocratique doit être préservé et que le peuple peut voter pour choisir sa prochaine noblesse supposée. Ce ne sera plus un conte de fées au coucher ; maintenant, vous pouvez vraiment dire que vous aussi pouvez être reine ou roi."
 fiji_institute_of_automation: "Institut fidjien de l'automatisation"
 fiji_institute_of_automation_desc: "L'IFA est le fondement de ce qui sera bientôt connu sous le nom de Programme Paradis de la Recherche. L'objectif est essentiellement de transformer l'île en une immense installation de recherche et de développement et de montrer au monde que vous pouvez profiter du soleil tout en laissant libre cours à l'imagination et à la créativité pour percer les mystères de la réalité elle-même."
 fiji_institute_of_resource_development: "Institut fidjien du développement des ressources"
 fiji_institute_of_resource_development_desc: "L'IFDR est une autre étape marquante dans le développement du Programme Paradis de la Recherche. Dédiant son existence à l'extraction, au raffinement et à la synthèse des ressources à leur plus grand potentiel connu. Oui, notre île est petite, mais cela ne signifie pas que nous n'avons rien à notre disposition. Ainsi, cet institut sera un point clé pour assurer les approvisionnements domestiques et leur croissance là où c'est possible."
 fiji_institute_of_energy_development: "Institut du développement énergétique"
 fiji_institute_of_energy_development_desc: "L'IDE se concentrera sur le développement de manières plus efficaces et productives de produire de l'énergie. Ce département pourrait également travailler en collaboration avec l'IFDR pour mieux intégrer la cohésion entre notre énergie et notre économie."
 fiji_technocratic_military: "Armée technocratique"
 fiji_technocratic_military_desc: "Bien que notre île soit petite, nos cerveaux ne le sont pas. Cette compréhension nous permet de consacrer une bonne partie de nos capacités de R&D à renforcer nos forces militaires. Nous n'avons toujours pas l'économie pour une aviation moderne, mais au moins nous pouvons mieux spécialiser nos forces navales et terrestres."
 fiji_research_paradise_program: "Programme Paradis de la recherche"
 fiji_research_paradise_program_desc: "L'aboutissement de nos efforts de recherche extensifs a créé un nouveau paradis pour la recherche et le développement dans son ensemble. L'île a été transformée en un paradis, non seulement pour les vacanciers étrangers, mais pour la communauté scientifique dans sa totalité. Ici, nous pouvons coordonner les avancées nationales et étrangères dans les domaines que nous connaissons et dans de nouveaux domaines que nous pourrions même découvrir. L'avenir est véritablement maintenant."
 fijian_homelessness_crisis: "Crise des sans-abri"
 fijian_homelessness_crisis_desc: "Avec l'instabilité politique dans la nation, le gouvernement a totalement manqué d'actions correctives et décisives pour affronter la crise croissante du sans-abrisme. Alors que le nouveau millénaire commence, beaucoup se demandent si le gouvernement peut réellement résoudre ce problème grandissant qui plague la nation. Néanmoins, le temps dira si le gouvernement peut non seulement prendre soin de la nation, mais aussi commencer à prendre soin de lui-même."
 fijian_emigration_crisis: "Crise de l'émigration massive"
 fijian_emigration_crisis_desc: "L'instabilité politique, le changement climatique et la montée des tensions ethniques ont poussé les Fidji à se rendre compte qu'il valait mieux quitter cette petite île. Il appartient au nouveau gouvernement de poser les bases d'un avenir meilleur, mais face à tant d'obstacles, le gouvernement des Fidji parviendra-t-il à résister à l'épreuve du temps ?"
 fijian_military: "L'armée fidjienne"
 fijian_military_desc: "Tout au long de l'indépendance de l'île, l'armée fidjienne a été une bonne force d'autodéfense. Cependant, même avec son implication limitée dans les missions étrangères, l'armée fidjienne n'a que peu ou pas d'expérience. Alors que l'île entre dans l'ère moderne et que de nouveaux troubles politiques sont à craindre, nombreux sont ceux qui se demandent combien de temps encore l'armée devra-t-elle encore maintenir la paix."
 fijian_economic_condition: "L'économie fidjienne"
 fijian_economic_condition_desc: "Malgré une population et une superficie modestes, l'économie fidjienne est bien diversifiée. L'industrie minière excelle dans l'extraction de ressources comme le cuivre, l'or et l'argent. Les industries secondaires incluent la production de ciment et la construction navale. Dans l'ensemble, l'économie fidjienne a une base relativement solide sur laquelle travailler, et alors que le nouveau millénaire commence, il revient au gouvernement de diversifier davantage l'économie en se lançant dans de nouvelles industries comme la haute technologie et le développement de logiciels."
 fijian_ethnic_tensions: "Tensions indo-fidjiennes"
 fijian_ethnic_tensions_desc: "Depuis l'indépendance, l'île de Fidji a connu une croissance assez modeste de sa population. Cependant, l'inconvénient de cette notion est que la grande majorité des personnes migrant à Fidji sont d'origine indienne. Bien que pour la plupart cela ne signifie rien, malheureusement, pour un bon nombre de Fidjiens ethniques, cela ressemble à un remplacement et à une mise à l'écart. Tout au long de l'histoire récente de l'île avec l'indépendance, ces tensions n'ont fait que croître dramatiquement ; il revient au gouvernement de Fidji de résoudre cela avant que quelque chose de grave ne se produise... ignorez les nombreux coups d'État qui jalonnent l'histoire de la nation, s'il vous plaît."
 fiji_2000_coups_over: "Un retour à la paix"
 fiji_post_coup_political_shift: "Les allégeances changent"
 fiji_fast_tracked_military_junta: "§8La longue marche vers l'amélioration a commencé§!"
 fiji_fast_tracked_monarchy: "§0Une couronne de force fait une couronne du peuple§!"
 fiji_2006_coup_avoided: "§PA évité le coup d'État de 2006§!"
 fiji_2006_coup_historical: "§lLe coup d'État militaire réussit§!"
 fiji_2006_coup_military_junta: "§8L'Homme Banane est tombé§!"
 fiji_2006_coup_monarchist_era: "§0La Maison de Suva a gagné§!"
 fiji_2006_coup_technocracy: "§tLe Conseil technate prend le contrôle§!"
 fiji_news.1.t: "Des nationalistes kidnappent des officiels gouvernementaux"
 fiji_news.1.d: "Le 19 mai 2000, des membres du mouvement politique pro-fidjien connu sous le nom de i-Taukei ont pris en otage des membres clés du gouvernement nouvellement élu, en majorité indo-fidjien. Le Premier ministre et plusieurs responsables clés du gouvernement ont été pris en otage dans le bâtiment du parlement, les membres de i-Taukei étant pratiquement barricadés à l'intérieur. Des négociations sont en cours pour extraire les otages sans perte de vies humaines."
 fiji_news.1.o1: "Pourquoi devons-nous nous battre les uns contre les autres ?"
 fiji_news.2.t: "Un gouvernement intérimaire créé"
 fiji_news.2.d: "Suite aux événements et à une impasse dans les négociations avec les rebelles, le président Kamisese Mara a déclaré l'état d'urgence et a formé un gouvernement continu à partir des membres du gouvernement actuel non capturés, alors que d'autres sont toujours retenus en otage. Les tensions sont élevées, car la police locale et les Forces militaires de la République de Fidji (RFMF) sont débordées, tentant de maintenir un cordon défaillant autour du Parlement tout en gérant les protestations croissantes et les troubles civils, alors que des manifestants ont ciblé plusieurs commerces indo-fidjiens à Suva."
 fiji_news.2.o1: "Ne pouvons-nous rien faire !?"
 fiji_news.3.t: "Une autorité perdue provoque un coup d'État militaire"
 fiji_news.3.d: "Alors que les restes du gouvernement civil ont prouvé leur incapacité à exercer réellement l'autorité exécutive, le commandant des RFMF, Frank Bainimarama, a renversé le gouvernement en place et instauré le sien. Leur première action a été d'établir la loi martiale, leur donnant plus de liberté pour gérer les énormes troubles civils."
 fiji_news.3.o1: "Et c'est reparti"
 fiji_news.3.o2: "L'armée résoudra cela"
 fiji_news.4.t: "Échange de tirs au Parlement"
 fiji_news.4.d: "Suite au coup d'État militaire, la constitution de 1997 a été révoquée, les négociations ont échoué et l'armée a lancé un ultimatum. Les puissances étrangères ont imposé une série de sanctions : Fidji a été exclu du Commonwealth, plusieurs nations ont interdit les produits fidjiens et les équipes sportives fidjiennes ont été bannies. Ces réactions étaient dues à l'idée de céder aux demandes des rebelles. Le 12 juin, l'armée a tiré des coups de semonce sur le véhicule de George Speight, bien que Speight affirme qu'il s'agissait d'une tentative d'assassinat ratée. Les négociations se poursuivent et davantage d'otages ont été libérés. Avec les troubles civils qui se calment et des perspectives d'espoir, beaucoup se demandent combien de temps cela durera encore."
 fiji_news.4.o1: "S'il vous plaît, mettez fin à cette violence insensée"
 fiji_news.5.t: "L'armée s'accorde avec les rebelles ?"
 fiji_news.5.d: "Le 3 juillet 2000, Bainimarama a nommé Laisenia Qarase comme Premier ministre, à la tête d'un gouvernement entièrement composé de Fidjiens indigènes. Speight, furieux de cette décision, a vu une fusillade éclater au Parlement le lendemain, blessant cinq personnes. Le chaos s'est intensifié, et les rebelles ont organisé plusieurs incidents à travers le pays. Les soldats de la caserne Sukunaivalu à Labasa se sont mutinés et ont déclaré leur soutien à Speight. Des propriétaires terriens locaux ont pris le contrôle du barrage de Monasavu, coupant l'électricité à Suva. Le 8, des rebelles ont bloqué la route entre Suva et Nadi et ont pris d'assaut un poste de police à Korovou, prenant 30 otages. À la prison de Naboro, 50 détenus se sont révoltés, prenant des gardes en otage."
 fiji_news.5.o1: "À quoi pense Bananarama !?!"
 fiji_news.6.t: "La fin du coup d'État"
 fiji_news.6.d: "Tout au long des mois de juin et juillet, des négociations semi-continuelles ont traversé la nation alors qu'une réforme du gouvernement civil était discutée sans relâche. Peu à peu, de plus en plus d'otages ont été libérés, les rebelles quittant le bâtiment du Parlement et se déplaçant hors de la zone de la capitale. Finalement, le 26 juillet, Speight et son porte-parole Joe Nata ont été arrêtés près d'un point de contrôle militaire après avoir proféré des menaces contre le nouveau président et évoqué une guerre civile. Peu après, l'armée a pris d'assaut le quartier général des rebelles, arrêtant 369 rebelles supplémentaires. Le coup d'État civil a été déclaré terminé ; peu de temps après, George Speight a été jugé pour trahison et condamné à mort."
 fiji_news.6.o1: "La paix enfin... mais à quel prix ?"
 fiji_news.7.t: "Fidji Uni remporte la victoire"
 fiji_news.7.d: "La Constitution de 1997 de Fidji exigeait que des élections générales pour la Chambre des représentants aient lieu au moins une fois tous les cinq ans. Le président par intérim, Ratu Joni Madraiwiwi, a émis une proclamation le 2 mars 2006, effective à partir du 27 mars, dissolvant le Parlement. Le mandat parlementaire précédent devait expirer le 1er octobre 2006. Le décret des élections a été émis le 28 mars ; les candidats ont déposé leurs candidatures le 11 avril et publié leurs listes de préférences le 13, tandis que l'inscription des électeurs s'est clôturée le 4 avril. Les élections générales ont eu lieu à Fidji entre le 6 et le 13 mai 2006. Le gouvernement sortant Soqosoqo Duavata ni Lewenivanua (SDL), dirigé par le Premier ministre Laisenia Qarase, a été réélu pour un troisième mandat. L'opposition principale était le Parti travailliste, dirigé par Mahendra Chaudhry, ainsi que plusieurs autres partis mineurs."
 fiji_news.7.o1: "Tout va bien comme sur des roulettes."
 fiji_news.8.t: "Exigences militaires"
 fiji_news.8.d: "Le 16 octobre 2006, le commandant des RFMF, le commodore Bainimarama, a lancé un ultimatum au gouvernement pour répondre à neuf exigences ou démissionner d'ici le 1er décembre. Ces neuf exigences portaient principalement sur la nécessité de traduire en justice les instigateurs du coup d'État de 2000 ; de retirer toute manœuvre politique qui aggraverait les inégalités économiques basées sur des motifs raciaux ; de refuser l'intervention d'une autorité étrangère (nommant spécifiquement le commissaire de police Andrew Hughes, un Australien) ; d'abandonner les poursuites judiciaires concernant les déclarations militaires antérieures de l'année et de répondre officiellement aux préoccupations sur les dépenses gouvernementales et la gouvernance interne. Une semaine et demie plus tard, le 31 octobre 2006, l'armée a organisé des exercices autour de Suva et fermé les casernes de la ville. L'armée a déclaré que ces exercices n'étaient pas menaçants."
 fiji_news.8.o1: "Nous refusons une telle populace"
 fiji_news.8.o2: "§PSauvons la face pour l'instant§!"
 fiji_news.9.t: "Le gouvernement du coup d'État militaire"
 fiji_news.9.d: "Alors que le gouvernement contestait les exigences de l'armée, le commodore Frank Bainimarama a initié un coup d'État qui a renversé le gouvernement, qualifié de menace pour la stabilité sociale et ethnique. Les développements ont été rapides et précis, montrant que l'armée semble unie dans cette entreprise suivant la volonté du commodore. Mais certains questionnent la validité de cette action, et d'autres encore pensent que l'armée a d'autres plans. Bien que peu de choses soient connues, beaucoup espèrent que nous pourrons vraiment voir la paix de notre vivant."
 fiji_news.9.o1: "Est-ce vraiment suffisant ?"
 fiji_news.9.o2: "§lLa stabilité est revenue§!"
 fiji_news.10.t: "Les membres du coup s'agitent"
 fiji_news.10.d: "Avec le récent coup d'État établissant le commodore Frank Bainimarama comme leader de facto de la nation, beaucoup se demandent maintenant ce qui attend vraiment Fidji. Certains membres influents du coup semblent s'agiter pour une position plus ferme sur la manière dont la nation est gouvernée. L'un d'eux a déclaré que les querelles mesquines liées aux troubles ethniques étaient le plus grand fiasco que la nation ait eu à endurer, sans parler de se déchirer pour cela. Pour l'instant, le monde entier pose les yeux sur la nature instable que cette petite île du Pacifique endure."
 fiji_news.10.o1: "§8L'armée est notre salut§!"
 fiji_news.10.o2: "N'avons-nous pas assez souffert ?"
 fiji_news.11.t: "Les vieilles idées attisent le factionnalisme"
 fiji_news.11.d: "Le factionnalisme croissant au sein de la junte militaire a vu une montée d'anciennes idées avec une nouvelle saveur. La faction connue sous le nom de Maison de Suva semble vouloir créer une monarchie élective, une sorte de titres anciens avec des principes nouveaux. Plutôt que de lier le titre au sang, les idées d'élections et le principe de la démocratie resteraient présents. Cette hybridation du monarchisme avec l'électoralisme démocratique serait la base fondamentale de leur plateforme. L'un des membres de la faction a même déclaré : « Maintenant, vous pouvez dire à votre fils ou votre fille que si vous travaillez assez dur et poursuivez vos objectifs dans la vie, vous aussi pourriez être prince, princesse, ou peut-être même roi ou reine. » Beaucoup sont incertains quant à cette proposition, mais elle semble séduire le conseil des chefs et l'héritage tribal du peuple de l'île."
 fiji_news.11.o1: "Quel conte de fées"
 fiji_news.11.o2: "§0Eh bien... ça pourrait être un bel élan pour l'ego§!"
 fiji_news.12.t: "Déstabilisation du coup d'État"
 fiji_news.12.d: "Avec le coup d'État qui s'éternise et de nombreuses factions maintenant contestées par la population générale, beaucoup se demandent ce qui sortira de cette pause complète de la nation. Des rumeurs parlent d'une faction en formation appelée le Conseil technate, qui semble faire partie du discret Parti de la technocratie de Fidji. Mais de nombreux mouvements de protestation contre l'appareil du coup souhaitent simplement passer à autre chose, avec des pancartes réclamant de plus en plus que le Parti travailliste de Fidji prenne les rênes, étant donné qu'il a terminé deuxième aux résultats des élections. Qui cédera en premier ?"
 fiji_news.12.o1: "§tLe Conseil prend le pouvoir§!"
 fiji_news.12.o2: "§PLe peuple en a assez§!"
 fiji_news.400.t: "Zélotes militaires"
 fiji_news.400.d: "Avec le chaos causé par le coup d'État, certains membres du personnel militaire ont adopté une approche agressive injustifiée, défiant ouvertement les souhaits du commodore Frank Bainimarama. Les tensions montent et la cohésion au sein de l'armée commence à se désintégrer."
 fiji_news.400.o1: "Que Dieu nous aide"
 fiji_news.401.t: "Les rumeurs d'un raid se multiplient"
 fiji_news.401.d: "Récemment, des rumeurs circulent selon lesquelles une secte de la junte militaire, sous des leaders plus radicaux, a élaboré un plan pour prendre d'assaut le bâtiment du Parlement et éliminer les otages. Le commodore a été vu en train de chercher frénétiquement ces officiers radicaux pour éviter une crise nationale inédite depuis le premier coup d'État des années 1980. Le temps dira si les têtes froides ou le chaos régneront sur le pays."
 fiji_news.401.o1: "§8Je crois entendre des coups de feu ?§!"
 fiji_news.401.o2: "§lC'est étrangement calme aujourd'hui.§!"
 fiji_news.401.o3: "§0Quel est ce tumulte que j'entends ?§!"
 fiji_news.402.t: "Le massacre de Suva"
 fiji_news.402.d: "Le chaos ravage la nation alors que des tirs et une attaque sur la situation des otages ont entraîné 15 morts, 27 blessés et une panique massive à travers le pays. Dans le chaos de cet événement d'une semaine, des sources indiquent que le commodore Frank Bainimarama a été retrouvé mort dans un convoi lourdement endommagé. Personne ne revendique la mort du commodore, et les opinions divergent sur la question de savoir s'il méritait vraiment de mourir ou non. Quoi qu'il en soit, c'est une route vers la récupération qui coûtera cher à la nation."
 fiji_news.402.o1: "Pouvons-nous vraiment guérir de cela ?"
 fiji_news.403.t: "Avancer"
 fiji_news.403.d: "Cela a été une aventure longue et assez fastidieuse de reconstruire la nation après les troubles du coup d'État de 2000. Mais des cendres est né un phénix, et cet oiseau majestueux s'élèvera. Nous pouvons maintenant nous concentrer sur la construction à partir des fondations posées devant nous et regarder non seulement notre petite île, mais aussi le monde qui nous entoure."
 fiji_news.403.o1: "Le voyage ne fait que commencer."
 fiji_news.500.t: "La lutte pour le pouvoir s'intensifie"
 fiji_news.500.d: "Des unités militaires ont été soudainement rappelées du cordon déjà lamentable autour du bâtiment du Parlement. Des sources rapportent que des coups de feu et des crissements de pneus ont été entendus près des faubourgs de Suva même. Beaucoup se demandent ce qui a causé un changement aussi drastique dans l'appareil du contre-coup militaire face à ce qui restait du gouvernement civil. De plus, le leader ethno-nationaliste initial qui a déclenché le coup d'État a lancé des appels pressants pour négocier avec lui, menaçant de conséquences en cas d'inaction. Nous espérons avoir bientôt des nouvelles de ce qui s'est passé."
 fiji_news.500.o1: "Avons-nous encore une nation ?"
 fiji_news.501.t: "Les résultats sanglants sont là"
 fiji_news.501.d: "En contraste frappant avec le monde moderne dans lequel nous vivons, il s'avère qu'une secte volatile de l'armée a tendu une embuscade au convoi du commodore et a ensuite forcé le conseil des chefs à légaliser la Maison de Suva. Cette ascension sanglante a conduit la nation à devenir une monarchie, malgré son histoire d'indépendance vis-à-vis d'une monarchie. Une récente interview avec un supposé membre du Conseil de la Maison a déclaré : « Nous cherchons à avoir une règle ferme, juste et divine sur la nation. Oui, nous instaurons une forme de loi martiale jusqu'à ce que les ethno-nationalistes soient maîtrisés, mais nous n'avons pas l'intention d'abolir les élections. » Beaucoup sont sceptiques quant à ces affirmations, mais une vaste majorité souhaite simplement que le chaos cesse. Nous verrons quel sera le résultat final de cette couronne née du sang."
 fiji_news.501.o1: "Y a-t-il même une roue à prendre !?!"
 fiji_news.502.t: "Une nouvelle ère"
 fiji_news.502.d: "Avec le processus de reconstruction essentiellement terminé, les cicatrices quelque peu guéries et la nation capable de se concentrer sur l'avenir, la Maison de Suva s'est engagée à comprendre pleinement et à développer la nation et son peuple. Consciente des défis à venir, la population, bien que toujours hésitante, a néanmoins développé un sentiment d'apaisement en voyant la vie revenir à la normale... même si cette normalité n'est pas considérée comme « normale » en soi."
 fiji_news.502.o1: "Un nouveau chapitre, un nouveau départ."
 Rear_Admiral_Villiame_Naupoto_desc: "Villiame Naupoto était un officier naval fidjien qui, dans le chaos du coup d'État de 2006, rejoignit une faction de militaristes plus vocaux. Cette faction au sein du coup d'État évincerait et isolerait Frank, surnommé « Bananaman ». En conséquence de ce changement, le coup d'État, initialement respectueux de la constitution, s'est transformé en une véritable junte militaire. Bien que le contre-amiral Naupoto soit un visage nouveau sur la scène politique, il n'est pas un homme aveugle pour autant ; ainsi, le peuple se demande comment il guidera la nation et ses habitants vers des temps meilleurs."
 Laisenia_Qarase_desc: "Laisenia Qarase fut un candidat de compromis établi lors du coup d'État de 2000. Ni trop à gauche, ethniquement fidjien, ni trop à droite pour l'époque, il remporta les élections anticipées de 2001 et, de manière surprenante, celles de 2006 également. Cependant, en 2006, ses vues et son parti s'étaient davantage alignés sur une politique pro-fidjienne ethnique ; certaines propositions de lois controversées durant son mandat de 2006 créèrent la crise constitutionnelle qui conduisit au coup d'État militaire de 2006."
 Mahendra_Chaudhry_desc: "Mahendra Chaudhry était le chef élu du premier gouvernement à majorité ethnique indo-fidjienne des Fidji en 2000. Cependant, un agitateur d'un mouvement ethno-nationaliste a décidé de prendre les choses en main et de kidnapper le gouvernement élu. Après les événements du coup d'État, le Parti uni des Fidji a été créé et officiellement élu lors des élections anticipées qui ont suivi. Mahendra Chaudhry a tenté une nouvelle fois de briguer le poste de Premier ministre lors des élections générales de 2006."
 Dr_Padma_Narsey_Lal_desc: "Padma Narsey Lal, née en 1951, étudia à l'Université du Pacifique Sud, où elle obtint une maîtrise en sciences, écologie et biochimie. Elle fut la première femme gujarati à fréquenter cette université. En 1971, elle reçut la première médaille d'or de l'Université du Pacifique Sud. Elle compléta également une maîtrise en études des ressources et de l'environnement à l'Université nationale australienne et un doctorat en agriculture et économie des ressources à l'Université d'Hawaï à Manoa. Padma Lal débuta comme fonctionnaire pour le gouvernement fidjien avant d'occuper des postes de recherche et de gestion de la recherche. Elle a été conseillère en développement durable au Secrétariat du Forum des îles du Pacifique et conseillère technique en chef au Bureau régional océanien de l'Union internationale pour la conservation de la nature. Lal a également occupé des postes élevés au sein du gouvernement australien, notamment au Centre australien pour la recherche agricole internationale."
 King_Sitiveni_I_desc: "Sitiveni Rabuka, désormais officiellement titré Roi Sitiveni Ier de la Maison de Suva, est le membre principal et, selon certains, potentiellement le fondateur de la Maison de Suva. Rabuka s'est forgé un nom et un héritage grâce à sa carrière politique et militaire, étant impliqué d'une manière ou d'une autre dans presque tous les coups d'État que la nation a connus. Stabilité, Ordre, Paix... Ces trois piliers sont ce que Rabuka a cherché à maintenir, et avec ce nouveau chemin, beaucoup se demandent s'il peut créer un véritable héritage."
 King_Sitiveni_II_desc: "Jioji Konrote, désormais officiellement titré Roi Sitiveni II de la Maison de Suva, est un ancien major général et politicien élu par le peuple lors du premier cycle électoral de l'ère post-coup. Le nom Sitiveni est un symbole dans le conseil de la couronne, représentant l'un des membres principaux et, selon certains, potentiellement le fondateur de la Maison de Suva, Sitiveni Rabuka. Avec cette convention de nommage établie comme précédent, beaucoup se demandent si les leaders suivants adopteront ce symbole ou chercheront peut-être à marquer leur propre empreinte dans ce jeu numéroté."
 fiji_focus: "Priorités nationales fidjiennes"
 fiji_research_institute_of_fiji_desc: "L'IRF est le pinacle de l'identité de notre nation. En utilisant des investissements modérément généralisés dans la recherche et les innovations dans tous les domaines, nous pourrons mettre notre nom sur la carte et attirer les communautés scientifiques étrangères. Cela exposera notre nation à des technologies plus rapidement et nous donnera un jeu de cartes à distribuer à ceux qui voudraient jouer à nos jeux."
 FIJ_focus_the_1999_general_election: "Les élections générales de 1999"
 FIJ_focus_the_1999_general_election_desc: "En 1999 se tinrent les élections générales fidjiennes qui organisèrent le nouveau gouvernement, le Parti travailliste fidjien emportant la majorité des sièges au parlement. La principale opposition, le SVT ou Soqosoqo ni Vakavulewa ni Taukei, prit la 2e place. La dynamique était celle d'un Parti travailliste centre-gauche face à un SVT centre-droit. En 3e place toutefois, le FAP ou Fijian Association Party. Groupe dissident du SVT, il était considéré, ironiquement, plus à droite, à prédominance ethnique fidjienne ; un changement de direction mena toutefois à un adoucissement connu du parti, qui forma une alliance électorale avec le FLP."
 FIJ_focus_assessing_the_national_situation: "Évaluer la situation nationale"
 FIJ_focus_assessing_the_national_situation_desc: "Malgré la promesse de la nouvelle élection, il nous faut prendre nos marques et comprendre ce qu'il faut chercher et réparer. Les soubresauts de l'indépendance de notre belle nation ont été faits de luttes politiques et de coup après coup, après coup... Aussi devons-nous faire vite, sous peine de retomber dans le même bourbier."
 FIJ_focus_increased_security: "Renforcer les forces de l'ordre à Suva"
 FIJ_focus_increased_security_desc: "La capitale est mal à l'aise : nous craignons que davantage de violences ethniques ne visent ceux qui y ont des commerces, vus comme plus exposés depuis l'élection récente d'un gouvernement à majorité indo-fidjienne."
 FIJ_focus_the_2000_debacle: "Le fiasco de 2000"
 FIJ_focus_the_2000_debacle_desc: "Au tournant du siècle, l'île de Fidji fut frappée par un coup ethno-nationaliste. La tentative fut finalement réprimée par un contre-coup de l'armée, mais depuis, la confiance dans le gouvernement civil est au plus bas. Le parti au pouvoir et même l'opposition doivent désormais voir s'ils peuvent rendre l'espoir aux peuples de Fidji."
 FIJ_focus_isolated_terror_attacks: "Attaques nationalistes"
 FIJ_focus_isolated_terror_attacks_desc: "Malgré l'arrestation de Speight, la violence des rebelles continua. Le 31 juillet, des partisans de Speight terrorisèrent le village de Dreketi, prenant 30 otages. Les soldats mutinés de la caserne Sukunaivalu ne se rendirent pas pendant six semaines. Le 8 août, des rebelles tendirent une embuscade à une patrouille militaire, tuant un soldat et un policier, et en blessant trois autres."
 FIJ_focus_military_disunity: "Mutinerie militaire"
 FIJ_focus_military_disunity_desc: "Le 2 novembre 2000, des soldats de l'unité de guerre contre-révolutionnaire fidèles à Speight se mutinèrent à la caserne Queen Elizabeth, retenant des officiers en otage pour destituer le commandant militaire Frank Bainimarama. Deux soldats furent tués et dix blessés lorsque l'armée reprit la caserne. Quatre des rebelles furent torturés et tués par des soldats loyaux dans la foulée."
 FIJ_focus_political_legitimacy: "Légitimité solidifiée"
 FIJ_focus_political_legitimacy_desc: "Le 15 novembre, la Haute Cour de Fidji déclara le gouvernement intérimaire illégal. Mara demeurait le président légitime ; le Parlement n'avait pas été dissous mais seulement suspendu, et devait désormais être reconvoqué ; et par implication, Chaudhry demeurait le Premier ministre légitime. Mara démissionna ensuite officiellement, sa démission étant antidatée au 29 mai."
 FIJ_focus_political_stagnation: "Impasse politique"
 FIJ_focus_political_stagnation_desc: "Après le rétablissement de la constitution de 1997 et ensuite du gouvernement élu de 1999, la nation fut étrangement mise en pause. Le gouvernement, qui avait été pris en otage, terrorisé jusqu'à la démission et ainsi de suite, se retrouvait soudain soi-disant normal. Si la nation est apaisée, les principaux ministres et membres ne le sont pas : certains se demandent s'ils peuvent vraiment garder le pouvoir après un tel épilogue."
 FIJ_focus_political_challenge: "Le défi de Qarase"
 FIJ_focus_political_challenge_desc: "Le gouvernement Qarase fit appel du jugement de la Haute Cour. Le 1er mars 2001, la Cour d'appel de Fidji confirma la décision de la Haute Cour rétablissant la constitution. Le gouvernement accepterait le jugement et relancerait la campagne pour l'élection de 2001."
 FIJ_focus_2001_elections: "Les élections générales fidjiennes de 2001"
 FIJ_focus_2001_elections_desc: "La décision de tenir de nouvelles élections pour repartir à zéro vit ces scrutins se tenir en août et septembre 2001. Ils furent tendus après la contestation du gouvernement élu de 1999, le parti majoritaire étant le Parti travailliste fidjien, qui s'opposait au gouvernement issu du coup de Laisenia Qarase, membre du principal parti d'opposition. Le Parti fidjien uni ou Soqosoqo Duavata ni Lewenivanua (SDL) fut formé sous Qarase lorsqu'il fut assermenté Premier ministre pendant le coup de 2000. Ledit parti absorba l'essentiel de ce qui restait du Fijian Association Party et une majorité de l'Alliance démocratique chrétienne, ainsi que d'autres groupes conservateurs, créant une sorte de grand parti de coalition conservateur. Au final, le SDL remporta une victoire majoritaire, posant le cadre de la gestion post-coup de la nation."
 FIJ_focus_post_coup_cleanup: "Nettoyage après le coup d’État"
 FIJ_focus_post_coup_cleanup_desc: "Dans l'après-coup, les dégâts matériels sont considérables et le secteur de la capitale, Suva, est un vrai chaos. Il faut investir pour tout nettoyer rapidement si nous voulons repartir d'une page blanche et avancer vers nos objectifs."
 FIJ_focus_early_community_programs: "Programmes communautaires précoces"
 FIJ_focus_early_community_programs_desc: "Il nous faut reconstruire la volonté du peuple de travailler ensemble : nous sommes tous citoyens de Fidji et devons accepter de vivre les uns avec les autres. Pour montrer que le coup n'est pas la réalité des choses, nous créerons des programmes d'unité. Ils montreront que villes et communautés sont faites pour se rassembler, non pour se déchirer."
 FIJ_focus_head_start_cooperatives: "Programmes coopératifs Head Start"
 FIJ_focus_head_start_cooperatives_desc: "Les générations plus âgées se déchirant, c'est à la plus jeune de recoller les morceaux. Pour cela, il faut tôt inculquer dans nos écoles un sens de l'unité familiale : qu'on soit Fidjien ou Indo-Fidjien, nous sommes tous là pour travailler ensemble à un meilleur demain."
 FIJ_focus_softer_situational_training_programs: "Programmes de formation situationnelle plus doux"
 FIJ_focus_softer_situational_training_programs_desc: "Les tensions ethniques étant vives, il faut introduire une réforme policière. Pour éviter un retour de bâton « laxiste », cette réforme est en réalité un nouveau programme de formation des forces de l'ordre. Le programme est conçu autour des litiges civils entre groupes et de la façon dont les agents peuvent gérer la situation sans sembler favoriser un camp."
 FIJ_focus_service_guarantee_citizenship: "Le service garantit la citoyenneté !"
 FIJ_focus_service_guarantee_citizenship_desc: "Il nous faut créer un sentiment de fierté nationale ; pour cela, nous pouvons recourir à l'armée, et peut-être aider à faire venir de nouveaux peuples pour diversifier notre île au-delà des seuls Fidjiens et Indo-Fidjiens. Nous créerons donc un programme service-citoyenneté au sein de l'armée. Un peu de financement supplémentaire et de quoi occuper personnellement le haut commandement devraient nous aider dans un monde post-coup. Alors souvenez-vous : ils font leur part. Et vous ? Rejoignez dès aujourd'hui les Forces militaires de la République de Fidji !"
 FIJ_focus_the_universal_retirement_program: "Le programme universel de retraite"
 FIJ_focus_the_universal_retirement_program_desc: "Le PUR sera un fonds de retraite global que le gouvernement créera et versera à tout citoyen ayant atteint l'âge et déposé une demande de retraite ou d'autres prestations sociales associées. Nous espérons relever et égaliser le plancher pour tous les citoyens, au bénéfice de la nation tout entière."
 FIJ_focus_the_national_care_initiative: "L'initiative nationale de soins"
 FIJ_focus_the_national_care_initiative_desc: "L'INS sera le début du plancher de notre système de santé. Les traitements de base liés aux accidents du quotidien et assimilés seront librement accessibles à tous les citoyens. Nous espérons que les soins donnés montreront aux citoyens qui composent notre nation qu'ils sont pris en charge, et qu'ils nous donneront une vraie chance de vraiment améliorer la vie telle que nous la connaissons."
 FIJ_focus_soup_kitchens_act: "Loi sur les soupes populaires"
 FIJ_focus_soup_kitchens_act_desc: "Avec la hausse du sans-abrisme, les tensions ethniques et les départs de l'île, il faut des solutions radicales. Un programme d'État établissant des soupes populaires stratégiques pour aider tous ceux qui sont sans abri ou dans un état critique rassemblera le peuple. Ce n'est pas autant que nous l'espérions, mais c'est le fondement d'une véritable initiative caritative à travers la nation."
 FIJ_focus_police_fairness_act: "Loi sur l'équité policière"
 FIJ_focus_police_fairness_act_desc: "La scène est dressée et tous les projecteurs sont sur la sécurité et le traitement du peuple : nos forces de l'ordre doivent être mieux mises en œuvre et ne plus passer pour une bande de vauriens. L'organisation et les régimes de déploiement de la police seront réévalués pour plus d'équité, tant dans les zones de forte criminalité que dans celles que les habitants voient comme négligées."
 FIJ_focus_fijian_corps_of_engineers: "Corps fidjien des ingénieurs"
 FIJ_focus_fijian_corps_of_engineers_desc: "L'établissement de la branche FCE des RFMF sera une initiative dirigée pour que l'armée, en temps de paix, aide au développement intérieur. Cela peut signifier rénover l'infrastructure militaire existante, mais aussi soutenir des chantiers civils d'ouvrages publics — eau, routes, rail et autres infrastructures qui font tourner la nation."
 FIJ_focus_early_education_standards_act: "Loi sur les normes de l'éducation précoce"
 FIJ_focus_early_education_standards_act_desc: "La LSEE est un texte budgétaire qui allouera des fonds aux niveaux d'enseignement précoce. Ces fonds iront à un mélange de salaires enseignants, de nouveaux manuels et de standardisation du matériel et de l'équipement dont les classes ont besoin pour chaque matière fondamentale. Ce financement sera réparti équitablement entre toutes les écoles de type élémentaire, l'espoir étant que les nouvelles générations auront une meilleure compréhension et, arrivées au collège, ressentiront un défi plus doux. Cela devrait poser le cadre de financements futurs pour remonter progressivement et améliorer globalement les normes éducatives de la nation."
 FIJ_focus_targeted_medical_imports: "Importations médicales ciblées"
 FIJ_focus_targeted_medical_imports_desc: "Par un financement dédié, nous dresserons une liste de priorités d'équipements médicaux, de médicaments nécessaires et de fournitures de base pour créer un inventaire de référence afin que notre infrastructure médicale fonctionne aussi efficacement que possible. Cela devrait lancer un processus d'encouragement, là où c'est possible, du développement médical intérieur, pour ne pas rester étranglés par les chaînes d'approvisionnement mondiales."
 FIJ_focus_fiji_food_securities_program: "Programme fidjien de sécurité alimentaire"
 FIJ_focus_fiji_food_securities_program_desc: "Le PSFF est un programme de type banque alimentaire où les citoyens les plus touchés peuvent réclamer ces prestations et acheter les denrées nécessaires à la survie de leur foyer pour un mois. Cela devrait relever le plancher et atténuer le seuil de pauvreté et le problème d'émigration toujours croissant que la nation continue de vivre."
 FIJ_focus_domestic_savings_initiative: "L'initiative d'épargne intérieure"
 FIJ_focus_domestic_savings_initiative_desc: "L'IEI sera un programme dédié conçu comme une sorte de caisse de guerre pour le gouvernement. Cette prétendue caisse ne sera utilisée qu'en temps de crise économique ou pour des programmes ciblés visant à soulager des situations devenues hors de portée des autorités locales. De telles mesures permettront à Fidji de paraître mieux gérée et plus attrayante aux regards étrangers, alors que notre situation n'est pas des plus invitantes. Néanmoins, nous prévaudrons et entrerons dans le nouveau millénaire avec une vigueur inédite depuis plus de trente ans d'indépendance."
 FIJ_focus_fijian_economic_diversity_initiative: "L'initiative de diversité économique fidjienne"
 FIJ_focus_fijian_economic_diversity_initiative_desc: "L'IDEF est un plan conceptuel général selon lequel, au cours des prochaines décennies, la nation de Fidji devrait avoir un premier sens d'autarcie, dans la mesure de ses moyens. On sait peu de choses, en vérité, sur les ressources sur lesquelles nous nous tenons, mais avec les tensions ethniques, les départs et une armée et une population peu enthousiastes envers le corps gouvernemental, nous avons trop de problèmes pour nous y consacrer pleinement. Dans cet esprit, nous avons gardé l'espoir d'atteindre le but dans les prochaines décennies, mais c'est au peuple de voir si nous pouvons tenir et viser ces objectifs."
 FIJ_focus_rebuild_suva_initiative: "Initiative de reconstruction de Suva"
 FIJ_focus_rebuild_suva_initiative_desc: "L'I.R.S. est un paquet d'aide économique mutuellement convenu aux citoyens de Suva, qui ont le plus souffert pendant les trois mois de coup. Pillage et émeutes de masse ont détruit une multitude de biens et de moyens d'existence : nous devons les aider à se remettre sur pied."
 FIJ_focus_early_business_management: "Programme de gestion d'entreprise précoce"
 FIJ_focus_early_business_management_desc: "Le PGE est une initiative gouvernementale pour encourager la prochaine génération d'hommes et de femmes d'affaires de notre nation. Il s'agira de cours dédiés et d'une formation de type stage en situation pour comprendre comment gérer, diriger et saisir ce que signifie réellement être propriétaire d'une entreprise. Nous espérons relancer le développement de notre économie à mesure que de nouveaux prêts sont contractés et que de nouveaux biens et services sont produits et vendus."
 FIJ_focus_startup_investment_program: "Programme d'investissement dans les start-up"
 FIJ_focus_startup_investment_program_desc: "Le PID sera un programme dédié de prêts de financement pour les nouveaux entrepreneurs et leurs rêves. Si une telle entreprise peut engendrer de mauvais crédits, nous chercherons toutefois à utiliser une part dédiée du budget national pour permettre une conduite détachée. Ainsi, si une entreprise financée échoue, cela n'entraînera aucun coût supplémentaire pour le contribuable."
 FIJ_focus_start_mining_survey_program: "Démarrer les programmes d'enquête minière"
 FIJ_focus_start_mining_survey_program_desc: "Nous lancerons plusieurs programmes de prospection pour identifier les ressources dont nous disposons et où nous en sommes réellement pour instituer notre programme d'autarcie limitée."
 FIJ_focus_importing_mining_equipment: "Importation d'équipement minier"
 FIJ_focus_importing_mining_equipment_desc: "Avec les récentes prospectives minières que nous avons proposées, il faudra soutenir ces nouvelles entreprises. Dans cet esprit, nous dresserons une liste prioritaire d'équipements miniers cruciaux, de matériaux et de matériel nécessaire pour nos mineurs. Ces gens sont le cœur de la diversification de notre économie dans son ensemble."
 FIJ_focus_increased_core_industries: "Augmentation des industries de base"
 FIJ_focus_increased_core_industries_desc: "Le regard de notre nation étant tourné vers notre plan à 20 ans, nous devrions investir pour étendre nos industries de base. La sylviculture et la construction navale ont été un atout assez fort, mais nous incluons aussi des spécificités du secteur minier liées au ciment."
 FIJ_focus_solidifying_precious_metals: "Solidifier les métaux précieux"
 FIJ_focus_solidifying_precious_metals_desc: "L'extraction et l'exportation d'or et d'argent sont un aspect crucial de nos importations. Étendre ces sous-secteurs améliorera grandement notre ratio de déficit commercial à l'import-export. Étendre cela permettra la croissance de nos revenus commerciaux pour renforcer ce que nous pouvons importer. Un cycle de croissance a commencé."
 FIJ_focus_establishing_fijian_manufacturing: "Établir une fabrication fidjienne"
 FIJ_focus_establishing_fijian_manufacturing_desc: "L'établissement d'une base manufacturière robuste signifie que nous pouvons diversifier notre portefeuille économique. Désormais, lorsque nous importons, nous pouvons utiliser cette base pour diversifier les usages de ces importations et mieux tirer parti de nos exportations."
 FIJ_focus_economic_relief_fund: "Fonds de relance économique"
 FIJ_focus_economic_relief_fund_desc: "Le FRE est un filet de sécurité établi : si la nation traverse des temps durs ou si des conditions économiques font qu'un secteur s'effondre soudain ou frôle la chute libre, les entreprises du secteur touché peuvent demander un sauvetage organisé. Ces soi-disant sauvetages seront négociés dans le cadre du budget alloué au FRE. Avec un tel fonds, nous espérons endiguer le reflux si des forces extérieures affectent notre économie."
 FIJ_focus_balanced_trading_budget: "Budget commercial équilibré"
 FIJ_focus_balanced_trading_budget_desc: "Alors que la nation s'extrait d'une économie pseudo-agraire et désindustrialisée vers un nouvel âge de diversité et de prospérité, il faut veiller à ce que ce que nous prenons n'outrepasse pas ce que nous espérons exporter. Aussi devons-nous réellement équilibrer le budget à des intervalles presque trimestriels, voire semi-trimestriels ; avec le temps, nous affinerons notre économie et en augmenterons l'efficacité et l'effectivité globales."
 FIJ_focus_early_adoption_tech_sector_investments: "Adoption précoce de l'investissement dans le secteur technologique"
 FIJ_focus_early_adoption_tech_sector_investments_desc: "Avec la montée de ce qu'on appelle l'internet, buzz et tendance dont les marchés mondiaux semblent obsédés, il est de notre devoir de répondre. Aussi affinerons-nous notre industrie manufacturière et nos exportations pour y inclure ces nouveaux produits et services que le secteur technologique semble générer."
 FIJ_focus_the_motorway_improvement_act: "La loi d'amélioration des autoroutes"
 FIJ_focus_the_motorway_improvement_act_desc: "Le Parlement a adopté un projet finançant des travaux de mise à jour dédiés aux principales routes de la nation. Le texte est vu comme un moyen de mieux accueillir la hausse du fret et d'accroître l'accès de nouvelles entreprises et industries potentielles à mesure que notre économie croît. Si certains rejettent la hausse des dépenses, d'autres espèrent que c'est une autre pierre vers notre avenir de nation."
 FIJ_focus_the_new_millennia_tax_reform_act: "La loi de réforme fiscale post-coup"
 FIJ_focus_the_new_millennia_tax_reform_act_desc: "Le Parlement a récemment adopté la loi RFPC, un texte qui réforme la perception fiscale sur les entreprises et la population dans son ensemble d'une façon qui, on l'espère, sera plus équitable pour les plus pauvres et la population ethnique fidjienne, qui semble former une large part de notre population frappée par la pauvreté."
 FIJ_focus_domestic_energy_initiative: "Initiative énergétique nationale"
 FIJ_focus_domestic_energy_initiative_desc: "L'IED est un programme d'étude, de prospection et de planification. Notre île est relativement petite : il faut donc en avoir le plus pour notre argent en matière de production énergétique. Dans cet esprit, nous avons trouvé une bonne source de pétrole intérieur à extraire ; ce faisant, nous intégrerons aussi une forme précoce d'industrie pétrochimique comme extension et lien direct à l'extraction de ressources. Cela devrait faire des merveilles pour la planification future."
 FIJ_focus_domestic_resource_diversity: "Programme de diversification des ressources nationales"
 FIJ_focus_domestic_resource_diversity_desc: "Le Parlement a créé le programme DRD, une initiative gouvernementale pour étendre et éventuellement diversifier nos ressources intérieures et les volumes extraits. Pendant l'essentiel de l'indépendance de notre belle île, nous étions connus pour l'or et l'argent ; toutefois, des prospectives récentes et des avancées technologiques ont révélé des gisements de taille décente de ressources clés comme le fer, le cuivre et même le pétrole. Nous espérons à l'avenir largement capitaliser sur ces débuts encore infantiles d'extraction."
 FIJ_focus_the_2006_general_election: "L'élection générale de 2006"
 FIJ_focus_the_2006_general_election_desc: "Des élections générales se tinrent à Fidji entre le 6 et le 13 mai 2006. Le gouvernement sortant du Soqosoqo Duavata ni Lewenivanua (SDL), mené par le Premier ministre Laisenia Qarase, s'opposait à la principale contre-force, le Parti travailliste de Fidji, mené par Mahendra Chaudhry, ainsi qu'à plusieurs autres partis mineurs."
 FIJ_focus_subtle_ethnic_illusions: "Illusions ethniques subtiles"
 FIJ_focus_subtle_ethnic_illusions_desc: "Notre réélection assurée et les tables du pouvoir basculant en notre faveur, il nous faut solidifier l'hégémonie de notre peuple sur l'île. Cela se heurterait à une opposition ouverte et même à de l'hostilité : nous adopterons donc une approche plus subtile, en amont d'un vrai changement."
 FIJ_focus_drafting_the_reconciliation_bill: "Rédiger le projet de loi de réconciliation"
 FIJ_focus_drafting_the_reconciliation_bill_desc: "Le projet de loi de réconciliation verra un certain nombre de petites concessions rendues à la population ethnique fidjienne ; l'un de nos points principaux est de revenir sur le coup de 2000 et de tourner une nouvelle page en accordant l'amnistie aux participants du coup et aux membres emprisonnés. Nous espérons que cela donnera au public une compréhension plus juste et plus vraie : nous faisons tous des erreurs et ne devons pas être définis uniquement par elles."
 FIJ_focus_assessing_the_farmland_leases: "Évaluer les baux agricoles"
 FIJ_focus_assessing_the_farmland_leases_desc: "Les baux de terres agricoles à la population indo-fidjienne, compensation de l'ancienne Royal Sugar Refining Company sous le régime colonial, sont bien dépassés. Nous nous accrochons au passé en perpétuant une telle pratique : nous étudierons donc un texte pour y remédier proprement."
 FIJ_focus_labour_party: "Le FLP remporte le remaniement post-coup d’État"
 FIJ_focus_labour_party_desc: "Le PUF a cédé à toutes les exigences de l'armée, par crainte de représailles et d'un passage à l'acte légitime de la menace de coup. Une élection surprise s'ensuivit, menant à l'élection d'un gouvernement majoritaire FLP. Avec l'armée indirectement de notre côté et une sorte de page blanche par-dessus le marché, nous pouvons vraiment changer les choses pour le mieux."
 FIJ_focus_turning_down_the_heat: "Baisser la température"
 FIJ_focus_turning_down_the_heat_desc: "Le nouveau gouvernement aux commandes et un consensus avec l'armée établi, nous avons désormais une page blanche. Le quasi-point d'ébullition des tensions ethniques qui a culminé dans le fiasco de 2006 s'est calmé et nous pouvons commencer à mieux intégrer nos communautés. Même si nos effectifs diminuent avec le temps, nous pouvons poser le cadre d'un nouvel âge de paix pour l'île."
 FIJ_focus_simmering_national_fears: "Craintes nationales à petit feu"
 FIJ_focus_simmering_national_fears_desc: "Beaucoup fuient encore la nation en masse et il faut agir. Par des redéploiements budgétaires dans la santé et les programmes sociaux, nous pouvons encourager les nouvelles générations à ne pas fuir, en leur montrant que l'espoir est là et que nous sommes là pour elles."
 FIJ_focus_setting_to_boil_new_economic_plans: "Porter à ébullition de nouveaux plans économiques"
 FIJ_focus_setting_to_boil_new_economic_plans_desc: "L'économie stagne, ou croît à un rythme qui paraît pratiquement stagnant si quelqu'un songeait seulement à éternuer sur un marché mondial. Il faut donc monter le feu sous nos initiatives économiques et chercher à bâtir à la fois connexité et stabilité économique, une sorte de plan d'autarcie à nous, si l'on veut."
 FIJ_focus_a_path_of_healing: "Un chemin de guérison"
 FIJ_focus_a_path_of_healing_desc: "La tempête passée, les idées rassemblées et l'organisation en place, nous nous occuperons désormais de la situation intérieure, qui absorbera probablement l'essentiel de l'administration."
 FIJ_focus_foreign_outreach: "Ouverture à l'étranger"
 FIJ_focus_foreign_outreach_desc: "L'instabilité de notre nation paraissant désormais plus stable aux yeux des puissances étrangères, nous pouvons chercher à obtenir et à accorder des investissements et voir où trouver notre place dans ce monde qui est le nôtre."
 FIJ_focus_farmers_investment_division: "Division d'investissement agricole"
 FIJ_focus_farmers_investment_division_desc: "Les agriculteurs semblent avoir causé une bonne part du tumulte sur cette belle île. Aussi devons-nous créer une division équilibrée d'investissement agricole et d'agriculture au sein du gouvernement, capable de répondre à tous les besoins : un agriculteur est un agriculteur, ils ont tous besoin d'aide."
 FIJ_focus_fijian_redevelopment_fund_phase_one: "Fonds de redéveloppement fidjien Phase 1"
 FIJ_focus_fijian_redevelopment_fund_phase_one_desc: "Le FRF, ou Fonds de réaménagement fidjien, est une initiative gouvernementale de longue haleine qui cherchera à résoudre plusieurs problèmes via un point focal de développement économique. Ces plans seront complets et échelonnés de la meilleure façon possible pour assurer la stabilité nationale en ces temps tendus auxquels nous n'avons jamais été étrangers."
 FIJ_focus_ministry_of_scientific_development: "Ministère du développement scientifique"
 FIJ_focus_ministry_of_scientific_development_desc: "Le MdDS sera un secteur dédié du gouvernement ; avec cette dédicace, ses objectifs principaux seront de dénicher les esprits brillants et les potentiels futurs esprits de la nation, et de pouvoir rechercher et développer non seulement de nouvelles technologies, mais aussi la façon d'élever l'éducation de notre peuple."
 FIJ_focus_reforming_trade_initiatives: "Réformer les initiatives commerciales"
 FIJ_focus_reforming_trade_initiatives_desc: "Notre île recèle de nombreuses ressources inexploitées ; puisque nous devons diversifier notre économie, il faut pouvoir exporter autant qu'importer. Renégocier les termes commerciaux et chercher à vendre au plus offrant potentiel nous permettra d'attirer davantage de capitaux pour mieux nos plans d'avenir."
 FIJ_focus_pulling_in_foreign_scientist: "Attirer des scientifiques étrangers"
 FIJ_focus_pulling_in_foreign_scientist_desc: "Nos esprits les plus brillants partent : il faut l'arrêter tout de suite. Si nous pouvons convaincre des scientifiques étrangers de lancer des départements de recherche et de créer une base ici, cela aidera non seulement le développement de la nation, mais dissuadera aussi ceux qui voudraient partir."
 FIJ_focus_overhauling_the_tax_code: "Refondre le code fiscal"
 FIJ_focus_overhauling_the_tax_code_desc: "Le code fiscal fédéral est un chaos : des décennies de coups, de gouvernements changeants et d'aller-retour entre pro-Fidjiens ethniques et pro-Indo-Fidjiens ont fait un gâchis et une grande inefficacité. Il faut le reprendre de zéro et ne laisser aucune place à la mention de l'ethnicité. Le code fiscal est pour la stabilité monétaire de la nation, non pour choisir des favoris parmi nos citoyens."
 FIJ_focus_domestic_iron_development: "Développement du fer national"
 FIJ_focus_domestic_iron_development_desc: "Avec les avancées récentes des technologies de prospection géologique, nous avons pu découvrir des gisements de minerai de fer que nous pouvons utiliser à l'intérieur et exporter. Cet approvisionnement devrait nous laisser une petite marge de manœuvre pour aider les projets de développement intérieur."
 FIJ_focus_expanding_upon_domestic_energy_sources: "Expansion des sources d'énergie nationales"
 FIJ_focus_expanding_upon_domestic_energy_sources_desc: "Notre île, bien que petite, est bourrée d'une foule de ressources naturelles différentes. Ce sont ces mêmes ressources qui nous permettront non seulement de sécuriser la situation intérieure, mais aussi de regarder vers la maison régionale dans laquelle nous vivons."
 FIJ_focus_human_resources_fund: "Fonds des ressources humaines"
 FIJ_focus_human_resources_fund_desc: "Avec le développement de notre économie, il nous faut aussi au moins les gens pour y travailler. Aussi devons-nous chercher à ramener nos citoyens partis à l'étranger, et aussi à attirer ceux qui cherchent une opportunité : avec assez d'incitations, nous pouvons leur montrer une vraie opportunité."
 FIJ_focus_pacific_exchange_and_investment_society: "Société pacifique d'investissement et d'échange"
 FIJ_focus_pacific_exchange_and_investment_society_desc: "On dit qu'on ne peut avoir le beurre et l'argent du beurre, mais qu'en est-il des PIES ? La société en question sera une belle façade pour se mêler à la région du Pacifique et mieux nous affirmer parmi nos concurrents bien plus grands."
 FIJ_focus_phase_two_development_fund: "Fonds de développement des Fidji, phase 2"
 FIJ_focus_phase_two_development_fund_desc: "La phase 1 a été un peu trouble, mêlée à d'autres focuses, mais il faut avancer avec un vrai plan. Le plan est d'attirer l'investissement étranger, de prioriser la croissance intérieure et d'équilibrer importations et exportations de notre nation pour garder un fort niveau d'indépendance économique et étrangère."
 FIJ_focus_security_through_community: "Sécurité par la communauté"
 FIJ_focus_security_through_community_desc: "Les efforts de police sont tendus sous le système rigide ; notre nouveau système permet davantage d'implication communautaire. Ces programmes organiseront les locaux pour qu'ils soient plus en phase les uns avec les autres, donneront aux citoyens le pouvoir d'arrestation citoyenne et permettront l'expansion des commissariats locaux par l'engagement communautaire."
 FIJ_focus_the_care_balance_act: "La loi d'équilibre des soins"
 FIJ_focus_the_care_balance_act_desc: "La LES est un texte qui passera au crible l'appareil de santé et de soins sociaux du pays et tentera d'équilibrer et de refondre les points qui fâchent."
 FIJ_focus_the_military_reform_bill: "Le projet de réforme militaire"
 FIJ_focus_the_military_reform_bill_desc: "Le projet parlementaire n° M253 est un texte de négociation : par la dépolitisation de l'armée, le financement sera augmenté pour permettre davantage de formes intérieures de programmes d'entraînement. Ainsi que de plus gros chèques pour nos hommes et femmes qui risquent leur vie pour défendre notre nation et son peuple. C'est un début, mais il n'y a pas grand espoir quant à l'investissement militaire."
 FIJ_focus_foreign_construction_contracts: "Contrats de construction étrangers"
 FIJ_focus_foreign_construction_contracts_desc: "Attirer les investissements étrangers doit commencer par les entreprises, pas seulement par les dirigeants des pays. En concentrant l'aide des entrepreneurs intérieurs sur les chantiers, nous pouvons attirer de nouvelles idées, de nouveaux matériaux et une nouvelle vague de gens qui peuvent vivre sur l'île."
 FIJ_focus_education_investment_package: "Paquet d'investissement éducatif"
 FIJ_focus_education_investment_package_desc: "Le PIE est une hausse dédiée des budgets d'éducation et de R&D pour nous aider à gagner du terrain par rapport à nos voisins régionaux. De là, nous pourrons chercher de nouvelles formes plus efficaces de ressources et de méthodes de production."
 FIJ_focus_foreign_medical_expos: "Salons médicaux étrangers"
 FIJ_focus_foreign_medical_expos_desc: "S'organiser avec des institutions médicales du monde entier devrait nous permettre d'investir réellement dans la santé et le bien-être de notre peuple, leurs attributs mentaux et physiques et les modes de vie qu'ils tentent d'avoir."
 FIJ_focus_phase_three_development_funds: "Fonds de développement des Fidji, phase 3"
 FIJ_focus_phase_three_development_funds_desc: "Nous sommes sur la route de la grandeur, les amis. En nous concentrant sur les vrais problèmes et en apaisant les clivages du passé, nous avons mis notre nation sur le chemin de la croissance plutôt que de la destruction. Il faut redoubler et poursuivre cette méthode de gouvernance pour assurer l'avenir de notre nation et désormais de notre mode de vie."
 FIJ_focus_cohesive_integrations_act: "Loi sur les intégrations cohésives"
 FIJ_focus_cohesive_integrations_act_desc: "Notre terre natale étant comprise, il nous faut chercher à comprendre nos voisins du Pacifique. Comprendre leur culture, leur peuple et leurs sociétés nous permet de mieux travailler avec ces gens à l'avenir."
 FIJ_focus_resource_securities_initiative: "Initiative de sécurisation des ressources"
 FIJ_focus_resource_securities_initiative_desc: "L'ISR est une institution dédiée de sécurité d'État et diplomatique qui travaillera à chercher des ressources intérieures et étrangères pour le développement de notre nation et le bénéfice de ceux qui les fournissent."
 FIJ_focus_military_baseline_act: "Loi de socle militaire"
 FIJ_focus_military_baseline_act_desc: "Par nos objectifs de prospérité et d'investissement en nous-mêmes et chez les autres, une réalité criante devient de plus en plus apparente. Aussi devons-nous créer un socle de préparation de nos services armés et, avec cela, permettre à notre nation et à ses partenaires de ressentir la sûreté et la sécurité que les petits comme nous méritent des plus grandes nations."
 FIJ_focus_independence_sustainment_act: "Loi sur le maintien de l'indépendance"
 FIJ_focus_independence_sustainment_act_desc: "Par l'organisation de nos peuples en bandes locales, unissant les communautés non seulement comme unités autonomes mais comme une part de la plus grande tarte nationale fidjienne. Nous cherchons à créer une atmosphère de défi et d'autodétermination : avec la Chine et tant de nations plus grandes plus... consentantes en quête de gain, nous devons rester vigilants en ces temps incertains."
 FIJ_focus_modern_industrialism_act: "Loi sur l'industrialisme moderne"
 FIJ_focus_modern_industrialism_act_desc: "La LMI est un texte qui cherche à mieux rationaliser la façon dont les industries de production sont agencées et à mieux augmenter l'efficacité globale desdites industries. En retour, nous relèverons les normes dont notre peuple pourra jouir dans la vie."
 FIJ_focus_food_of_tomorrow: "La nourriture de demain"
 FIJ_focus_food_of_tomorrow_desc: "Notre île est petite : il nous faut donc chercher à obtenir plus avec moins. Aussi dédierons-nous une aile du département général de R&D à sécuriser les bases de la vie pour notre peuple."
 FIJ_focus_progressive_taxes_progressive_gains: "Impôts progressifs pour une société progressive"
 FIJ_focus_progressive_taxes_progressive_gains_desc: "Par cette réforme fiscale, nous cherchons à mieux équilibrer les formes d'imposition selon les revenus générés. En équilibrant les niveaux d'imposition, nous veillons à ce que personne ne distancie massivement un autre simplement parce qu'il aurait soi-disant réussi par ses propres moyens. Nous pourrons désormais utiliser ce nouvel équilibre de recettes pour offrir à chacun un meilleur style de vie et réinvestir non seulement dans l'économie, mais dans le peuple et cette nation tout entière."
 FIJ_focus_united_fiji_installed: "L'armée installe un gouvernement modéré du PUF"
 FIJ_focus_united_fiji_installed_desc: "Le gouvernement résistant aux exigences de l'armée, le commodore Frank Bainimarama a lancé un coup et a cherché à installer un modéré du Parti fidjien uni. La plupart voient ce nouveau gouvernement comme des yes-men nommés par l'armée ; certains espèrent toutefois que cela réinitialisera le retour de bâton législatif sur le fil du rasoir que la crise constitutionnelle a récemment causé."
 FIJ_focus_resetting_ethnic_legislations: "Réinitialiser la législation ethnique"
 FIJ_focus_resetting_ethnic_legislations_desc: "En réduisant et, faute de meilleurs mots, en réinitialisant les projets et lois qui semblent avoir fait basculer l'équilibre ethnique, nous pouvons les ramener à une position plus neutre pour une approche plus posée de la situation."
 FIJ_focus_slashing_biased_taxes: "Réduire les impôts biaisés"
 FIJ_focus_slashing_biased_taxes_desc: "Les gouvernements du passé ont œuvré contre la notion de paix pour notre île. L'un des principaux problèmes était le code fiscal et ses nombreuses sous-entendus subtils qui aident des peuples ethniques spécifiques au détriment d'autres : nous commencerons à les tailler."
 FIJ_focus_jobs_initiative: "Initiative pour l'emploi"
 FIJ_focus_jobs_initiative_desc: "Par un paquet de dépenses publiques complet, nous investirons dans la création d'initiatives d'emploi. Cela aidera à donner un emploi à quiconque, partout où c'est possible, et posera une nouvelle norme d'égalité pour notre nation."
 FIJ_focus_fijian_resource_development_program: "Programme fidjien de développement des ressources"
 FIJ_focus_fijian_resource_development_program_desc: "Le PDRF pilotera le développement et l'extraction des ressources. Un tel programme sera transformé en ministère et sera donc davantage vu pour le mieux de la nation que pour celui de groupes spécifiques. L'essentiel : les terres où l'on trouve des ressources précieuses relèveront désormais de la propriété de l'État, et les entreprises auront une copropriété dans l'extraction et le traitement desdites ressources. Le plan est de favoriser l'unité nationale par le développement de la prospérité."
 FIJ_focus_health_not_wealth_act: "Loi Santé plutôt que richesse"
 FIJ_focus_health_not_wealth_act_desc: "La loi SPS est un texte qui réformera certaines lois du travail clés, nous permettant de mieux équilibrer et de créer plus d'équité dans l'environnement du quidam. En créant de nouvelles normes de travail et en égalisant ou carrément en vidant de vieilles réglementations défuntes, nous permettons à notre peuple de travailler plus malin, de mieux bâtir et de vivre ensemble plus longtemps."
 FIJ_focus_fiji_more_than_just_water: "Fidji, plus que de l'eau"
 FIJ_focus_fiji_more_than_just_water_desc: "Notre île a une histoire affreuse, très apparente dans les actes et le standing actuel de notre belle nation vis-à-vis d'une grande part du monde. Sachant cela, il nous faut chercher ce que les étrangers pensent de notre nation et gagner les cœurs et les esprits. Montrer que nous pouvons changer, et que notre île est plus qu'une publicité d'eau."
 FIJ_focus_researching_new_trades: "Rechercher de nouveaux métiers"
 FIJ_focus_researching_new_trades_desc: "Par de généreux investissements en R&D liés aux biens et services commerciaux, et à l'obtention desdits biens et services, notre nation atteindra des sommets jamais imaginés."
 FIJ_focus_unity_through_service: "L'unité par le service"
 FIJ_focus_unity_through_service_desc: "L'armée a été la plus grande part dans le maintien de notre société. En fin de compte, il faut reconnaître que la force par l'unité est ce qui fait avancer cette nation. Aussi, après des négociations équilibrées avec les chefs militaires, avons-nous un plan complet pour mieux investir dans l'armée, son personnel, et permettre une meilleure séparation des autorités civiles et militaires. Nous ne pouvons nous permettre un autre coup de 2000."
 FIJ_focus_peace_for_piece: "La paix pour un morceau"
 FIJ_focus_peace_for_piece_desc: "Par la paix chez nous, nous obtenons des morceaux à l'étranger. Désormais, notre île voyant un niveau de stabilité inédit depuis des années, de nombreuses nations sont plus disposées à commercer, à vacancer et à travailler avec nous. Cela devrait nous permettre de mieux voir l'avenir et de poser notre revendication dans la région."
 FIJ_focus_low_income_work_houses: "Maisons de travail à faible revenu"
 FIJ_focus_low_income_work_houses_desc: "Logements à bas revenu créés par l'État. Un projet dédié qui peut nous aider à sortir les gens de la rue vers des foyers et des emplois. Le coût sera un peu élevé, certes ; toutefois, pour assurer sûreté, sécurité et prospérité, il faut comprendre le vrai coût de ne pas le faire."
 FIJ_focus_funding_a_new_sector: "Financer un nouveau secteur"
 FIJ_focus_funding_a_new_sector_desc: "De nouvelles prospectives géologiques nous ont permis de déterminer une zone assez vaste pour une exploitation de minerai de fer de bas grade. Avoir cet approvisionnement intérieur renforcera la diversification de l'économie et cherchera à ramener davantage d'opportunités là où c'est possible."
 FIJ_focus_finding_homes_abroad: "Trouver un logement à l'étranger"
 FIJ_focus_finding_homes_abroad_desc: "Certains de nos sans-abri sont étonnamment fort bien élevés et ont des compétences sociales qui pourraient servir à la nation. Aussi accueillerons-nous et embaucherons-nous ces membres sous-évalués de notre société et étendrons-nous le ministère des Affaires étrangères. En s'appuyant sur les temps rudes qu'ils ont connus comme point d'intérêt, ils devraient mieux parler aux gens ordinaires des nations étrangères. Ainsi montrer au monde l'idée du rêve fidjien."
 FIJ_focus_evaluating_military_requirements: "Évaluer les exigences militaires"
 FIJ_focus_evaluating_military_requirements_desc: "Techniquement, une armée ne contribue en rien à l'économie. Les sans-abri non plus, d'ailleurs. Donc si nous pouvions relever artificiellement le plancher en ajustant simplement les normes et exigences pour réellement rejoindre l'armée, alors nous pourrions réduire le sans-abrisme, augmenter notre défense nationale et, par-dessus le marché, accroître le commandement et le savoir de notre armée, car il y aura exposition à de plus grandes unités. Tout le monde gagne à la fin."
 FIJ_focus_reorganizing_homeless_shelters: "Réorganiser le refuge pour sans-abri"
 FIJ_focus_reorganizing_homeless_shelters_desc: "L'état de certains de nos programmes sociaux est vraiment choquant. Il faut réorganiser le financement et la structure de ces lieux pour qu'ils soient plus efficaces dans le nombre de personnes qu'ils peuvent accueillir confortablement."
 FIJ_focus_naval_primacy_expected: "Primauté navale attendue"
 FIJ_focus_naval_primacy_expected_desc: "Notre nation est une nation insulaire : pour avoir un véritable impact sur notre région d'influence, il faut réellement investir dans notre marine."
 FIJ_focus_synthetics_centric_research: "Recherche centrée sur les synthétiques"
 FIJ_focus_synthetics_centric_research_desc: "Notre île a une foule de ressources naturelles ; le problème, c'est qu'à l'échelle du globe, nous sommes nettement insuffisants. Sachant ce problème clé, nous pouvons chercher l'avenir des ressources. En pionniers de la technologie synthétique, nous pourrions établir nos propres formes d'autarcie limitée, telles que le globe n'en a pas réellement vues. Une petite note de bas de page, mais pour nous, c'est néanmoins une fière déclaration de notre nation."
 FIJ_focus_streamlining_tax_code_expansions: "Rationalisation des extensions du code des impôts"
 FIJ_focus_streamlining_tax_code_expansions_desc: "Le projet parlementaire T:101A rationalisera le processus et les types d'impôts pouvant être levés sur la nation dans son ensemble. Nous espérons qu'en créant une norme connue, nos entreprises et notre population encourageront un développement qui, s'il peut contourner ces impôts, augmentera aussi indirectement les impôts levés."
 FIJ_focus_building_tall: "Loi sur la construction en hauteur"
 FIJ_focus_building_tall_desc: "L'espace limité et la nation petite, il faut tirer le plus de l'espace que nous avons. Dans cet esprit, nous cherchons le nouveau socle moderne auquel notre peuple doit s'accoutumer. L'automatisation est l'avenir, que nous l'aimions vraiment ou non ; mais plutôt que de simplement remplacer les gens, il faut intégrer les gens aux machines. Étendre notre capacité productive et rendre notre île bien plus efficace que la plupart n'oseraient même y penser."
 FIJ_focus_promoting_a_frugal_lifestyle: "Promouvoir un mode de vie frugal"
 FIJ_focus_promoting_a_frugal_lifestyle_desc: "L'espace est limité et les options rares pour développer notre île. Il faut un véritable égard à la préservation de la beauté naturelle de notre terre si nous voulons garder le soi-disant climat de destination insulaire pour les touristes. Aussi notre peuple doit-il comprendre qu'il faut jouir de la vie telle qu'elle est, chercher le bon dans ce qu'il a, plutôt que de toujours s'inquiéter de ce qu'il pourrait soi-disant avoir. Laissons le matérialisme aux Américains : ce ne sera pas la voie des Fidjiens."
 FIJ_focus_exploiting_corporatism: "Exploiter le corporatisme"
 FIJ_focus_exploiting_corporatism_desc: "Notre nation a quantité d'entreprises locales et étrangères par lesquelles nous générons une part significative du PIB. Toutefois, les tendances de la nature humaine montrent qu'elles veulent le pouvoir et l'argent. Nous pouvons l'exploiter en nous rapprochant et en prenant soi-disant des pots-de-vin et ainsi de suite, mais en réalité utiliser cet argent comme une sorte de caisse de guerre. Financer des programmes qui manquent un peu en dehors des sessions budgétaires, maintenir la paix en cas de possible retournement économique, et tout ce qui est possible. Bien sûr, ils finiront probablement par le comprendre, mais profitons-en tant que ça dure."
 FIJ_focus_neutral_selectivism: "Sélectivisme neutre"
 FIJ_focus_neutral_selectivism_desc: "Les gros chiens du Pacifique, les États-Unis d'Amérique et la République populaire de Chine. Ces deux nations finiront par se cogner un peu trop fort : aussi devons-nous être cordiaux sans chercher de faveurs. Les États-Unis sont plus susceptibles d'investir, mais il faut tourner cela de façons que la Chine voudra surpasser. Jouer les top dogs pendant qu'ils construisent indirectement le underdog, pour ainsi dire."
 FIJ_focus_innovations_sector: "Start-ups du secteur des innovations"
 FIJ_focus_innovations_sector_desc: "Sans réelle abondance de matières premières, il faut nous brancher sur d'autres marchés qui parlent au monde qui change. Nos start-up technologiques poseront le socle de notre percée dans les industries tech, nous permettant de vendre des logiciels précieux et d'autres produits aux plus offrants."
 FIJ_focus_employment_commission: "Commission de l'emploi"
 FIJ_focus_employment_commission_desc: "Le projet 5436, aussi connu comme la loi Embaucher tout le monde, est un texte qui établira le département de l'Emploi. La Commission de l'emploi cherchera des initiatives financées par l'État où des emplois peuvent être directement financés et soutenus pour garantir à ceux qui n'ont pas d'emploi la véritable opportunité d'en avoir un. Le coût serait plus élevé au début, mais avec le temps il serait compensé par de nouvelles recettes fiscales et les revenus des nouvelles entreprises créées."
 FIJ_focus_limited_fijian_naval_expansion: "Expansion navale fidjienne limitée"
 FIJ_focus_limited_fijian_naval_expansion_desc: "Notre commerce et nos eaux doivent être défendus. Quelques vedettes lance-torpilles ne suffisent vraiment pas à garantir une vraie défense. Il faut créer une véritable expansion limitée et défensive de notre marine pour assurer la sécurité de notre île. Personnel et équipement doivent être standardisés et améliorés avec le savoir que nous avons des missions intérieures et étrangères auxquelles nous avons pris part."
 FIJ_focus_education_budget_expansion: "Expansion du budget de l'éducation"
 FIJ_focus_education_budget_expansion_desc: "Par une expansion du budget de l'éducation, nous pouvons chercher à améliorer la compréhension par notre peuple du monde plus vaste autour de nous et à apporter de nouvelles opportunités à mesure que les générations passent."
 FIJ_focus_balancing_budgets: "Équilibrer les budgets"
 FIJ_focus_balancing_budgets_desc: "Nous avons vu notre nation se développer et s'efforcer, mais aussi une tendance au service budgétaire. Pour être un vrai modèle de croissance, il faut être flexible budgétairement et comprendre que nous pouvons équilibrer là où surviennent dépassements et manques."
 FIJ_focus_industrial_expansion: "Expansion industrielle"
 FIJ_focus_industrial_expansion_desc: "Notre chômage est au plus bas historique et, mieux encore, nos tendances d'émigration aussi. Il faut parrainer une expansion industrielle pour poursuivre cette tendance providentielle de l'histoire de notre nation."
 FIJ_focus_revitalization_of_foreign_perception: "Revitalisation de l'image à l'étranger"
 FIJ_focus_revitalization_of_foreign_perception_desc: "Les progrès que notre nation a faits pour une meilleure image, non seulement pour notre peuple mais pour le monde plus vaste autour de nous. Savourons vraiment cet âge nouveau pour notre paisible paradis insulaire."
 FIJ_focus_extracting_the_future: "Extraire l'avenir"
 FIJ_focus_extracting_the_future_desc: "De nouvelles technologies de prospection géologique, d'exploitation minière et de techniques d'extraction nous ont permis d'élargir la compréhension des ressources disponibles que nous pouvons réellement extraire. Si certains ne sont pas franchement ravis d'étendre les opérations minières, c'est néanmoins une part clé qui étend et maintient notre cycle de développement économique stable et régulier."
 FIJ_focus_wealthcare_act: "Loi sur la prospérité sanitaire"
 FIJ_focus_wealthcare_act_desc: "Avec la croissance rapide de la richesse dans notre nation, il n'est que juste que notre peuple mérite les soins et l'accès aux prestations médicales et post-retraite dont disposent des nations près de cent fois plus grandes. Avec quelques investissements et des achats d'équipement et de personnel, nous créerons les soins auxquels notre nation aspire depuis près de décennies."
 FIJ_focus_military_radicals_force_a_junta: "Des radicaux militaires installent une junte"
 FIJ_focus_military_radicals_force_a_junta_desc: "Sous une pression interne massive, le commodore a été forcé d'installer une junte. Avec cette triste nouvelle, le trouble s'est abattu sur la nation, mais les nationalistes se rassemblent pour créer l'ordre avec l'armée."
 FIJ_focus_martial_law_window: "Minuterie de la loi martiale"
 FIJ_focus_martial_law_window_desc: "Nous rétablirons l'ordre dans le pays, et nous nous engagerons aussi à stabiliser la nation pendant que nous évaluons notre situation. Cette loi martiale interdira les voyages vers et depuis les nations étrangères pour une durée, en raison du principe d'un problème d'émigration qui s'aggrave. Beaucoup n'aimeront pas cela, mais il faut endurer."
 FIJ_focus_merging_police_forces: "Fusion des forces de police"
 FIJ_focus_merging_police_forces_desc: "La distinction entre police militaire et police civile est un gaspillage de ressources et un doublement de commandements. Aussi intégrerons-nous les deux forces, les placerons-nous sous une structure de type militaire et assurerons-nous l'objectif unifié de protéger notre nation et son peuple en temps de désordre et d'anarchie."
 FIJ_focus_militarized_politics: "Une politique militarisée"
 FIJ_focus_militarized_politics_desc: "La structure gouvernementale est une bonne organisation ; avec un peu d'affinage et en militarisant l'appareil tout entier, nous pouvons vraiment redresser cette nation comme une machine bien huilée. Après tout, qu'est-ce qu'un parlement sinon la version civile d'une réunion d'état-major ou d'une salle de planification ?"
 FIJ_focus_weathering_the_political_storm: "Traverser la tempête politique"
 FIJ_focus_weathering_the_political_storm_desc: "Nous ne sommes pas encore tout à fait sortis d'affaire, mais il nous faut néanmoins relâcher notre emprise sur les excès de contrôle. Le monde nous est déjà profondément hostile en raison de l'autoritarisme que nous incarnons en tant que junte militaire. Aussi levons-nous l'interdiction de voyager et la loi martiale ; à côté, nous adoptons notre première réforme officielle post-chaos du coup, la loi de soins limités. Ce texte réduira les coûts et les excès directs qui parasitent notre champ médical en ce moment ; espérons que ce geste fera tourner quelques têtes de façon positive."
 FIJ_focus_transparency_in_requirements: "Loi sur les exigences de transparence"
 FIJ_focus_transparency_in_requirements_desc: "La LTR est une refonte extensive de la transparence dans l'élaboration des règles et des exigences des lois civiles et militaires. Cela affecte aussi la transparence des exigences, par exemple comment les gens peuvent obtenir des emplois dans la société civile, ou comment se font promotions et responsabilités dans la société militaire."
 FIJ_focus_fijian_service_means_fijian_respect: "Service fidjien, respect fidjien"
 FIJ_focus_fijian_service_means_fijian_respect_desc: "Mettre à jour et faire passer directement le message du code de conduite réduira les vieilles rancunes. En augmentant les peines et en montrant non seulement sur le papier mais dans la pratique que ceux qui servent Fidji sont Fidji elle-même. En favorisant ce lien de type familial, nous cherchons à unir notre peuple et à jeter les influences de l'ancien monde."
 FIJ_focus_constitutional_safeguard: "Sauvegarde constitutionnelle"
 FIJ_focus_constitutional_safeguard_desc: "Notre peuple ne fait pas confiance au système : c'est ledit système qu'il faut lui faire confiance. Aussi adopterons-nous un amendement qui stipule et fait un crime national du traitement injuste des citoyens fidjiens dans leur ensemble, quelles que soient leurs origines ethniques. Par ce décret, nous espérons panser des décennies de conflits qui ont déchiré cette nation."
 FIJ_focus_foreign_advisors: "Conseil des conseillers étrangers"
 FIJ_focus_foreign_advisors_desc: "Le monde semblant contre nous, il nous faut réellement montrer que nous voulons bien faire pour notre peuple et pour le bénéfice mutuel de ceux qui nous entourent. Aussi, avec un vaste conseil consultatif civil et militaire créé pour nous aider à reconstruire notre nation, pouvons-nous chercher de nouvelles frontières de croissance pour notre belle nation insulaire."
 FIJ_focus_building_upon_our_civilian_base: "Bâtir sur notre base civile"
 FIJ_focus_building_upon_our_civilian_base_desc: "L'économie est petite par rapport à notre population, sans parler d'une foule de problèmes liés à ce manque d'économie dans l'ensemble. Aussi un investissement dirigé pour accroître cette base industrielle nous permettra-t-il de faire travailler le peuple pour la nation, ses objectifs, et les uns pour les autres."
 FIJ_focus_starting_domestic_arms_companies: "Lancer des entreprises d'armement nationales"
 FIJ_focus_starting_domestic_arms_companies_desc: "L'armée fidjienne n'est pas connue pour... vraiment quoi que ce soit, maintenant que j'y pense. Il faut changer cela, et le meilleur point de départ serait de voir se former des entreprises d'armement intérieures dans notre nation et de créer une identité militaire fidjienne unique. Nous ne serons jamais comparés aux États-Unis, à l'Allemagne et ainsi de suite, mais nous pouvons certainement nous faire connaître dans la région où nous vivons."
 FIJ_focus_bringing_jobs_back_to_fiji: "Ramener les gens et les emplois aux Fidji"
 FIJ_focus_bringing_jobs_back_to_fiji_desc: "Notre peuple quitte encore notre nation, que ce soit pour étudier, travailler ou autre : nous souffrons toujours de l'émigration qui nous frappe. Aussi devons-nous investir plus directement et plus précisément dans les problèmes qui causent un tel exode."
 FIJ_focus_establishing_the_university_of_fiji: "Fonder l'université de Fidji"
 FIJ_focus_establishing_the_university_of_fiji_desc: "L'éducation... ce pilier fondamental de la société doit être l'un de nos principaux axes quand on considère l'avenir de notre nation et de notre peuple. Ce pilier a des applications civiles et militaires qui, à leur tour, seront mises en œuvre au maximum."
 FIJ_focus_fijian_care_act: "Loi fidjienne de soins nationaux"
 FIJ_focus_fijian_care_act_desc: "La LNCF est un programme pour réinjecter dans des programmes qui touchent notre population ayant vécu sa vie. Contrairement à tout le ferveur émotionnel du théâtre politique, les plus âgés causent plus de problèmes qu'ils n'oseraient même y penser. Aussi, si nous pouvons les tenir tranquilles par un confort de vie post-retraite et ainsi de suite, nous pourrons mieux évaluer les besoins de la population active."
 FIJ_focus_increase_funding_for_the_fcoe: "Augmenter le financement du CGF"
 FIJ_focus_increase_funding_for_the_fcoe_desc: "Le socle de notre hybridation civile et militaire est le Corps du génie fidjien. Il faut augmenter son financement pour permettre une expansion de la branche afin de mieux servir les applications militaires et civiles."
 FIJ_focus_deboning_healthcare_excesses: "Désossage des excès de soins de santé"
 FIJ_focus_deboning_healthcare_excesses_desc: "Qui l'aurait cru : si l'on a des programmes non contrôlés et non supervisés à cause de décennies de chaos politique et de changements constants de gouvernement, la corruption et l'argent perdu seraient quelque peu rampants. Une refonte complète et pratiquement un redémarrage de notre réseau de santé s'imposent. Ce faisant, nous pouvons créer une page blanche qui expiera les changements auxquels nous faisons face et la réalité que notre nation est vraiment sur sa propre voie de rétablissement."
 FIJ_focus_national_rotc_curriculum: "Programme ROTC national"
 FIJ_focus_national_rotc_curriculum_desc: "Dans des lieux comme les États-Unis, certaines écoles ont un programme géré par une branche militaire qui enseigne aux élèves des leçons de leadership applicables au monde civil, via une structure organisée militairement. C'est l'avenir et le point principal du système scolaire dont nous avons besoin. Dès le collège, toutes les écoles suivront ce format et les élèves de la nation, selon leurs années de promotion, seront organisés en soi-disant « unités ». En favorisant le savoir de la communauté, du leadership et de l'innovation par le travail d'équipe, nous cherchons à créer un avenir que notre jeunesse puisse vraiment comprendre et pour lequel elle soit préparée."
 FIJ_focus_barracks_housing_initiative: "Initiative de logement en caserne"
 FIJ_focus_barracks_housing_initiative_desc: "La loi ICL sera une nouvelle façon d'aborder les manques de logements dans la nation. Les sans-abri pourront résider dans une unité de logement de type caserne avec d'autres dans des dispositions similaires. Dans un tel environnement, ils pourront se remettre sur pied par un programme d'emplois et une routine de type militaire afin de réinstiller cette initiative chez ceux qui croient que le système les a laissés de côté. Ils graviront les revenus par ce programme de type instruction de base jusqu'à pouvoir obtenir un emploi hors du programme et un foyer hors du complexe de caserne."
 FIJ_focus_resource_extractions_act: "Loi sur l'extraction des ressources"
 FIJ_focus_resource_extractions_act_desc: "La LER priorisera ceux qui sont sans abri et/ou aussi dans le système pénal pour chercher un emploi comme moyen de gagner leur vie et de bien faire en développant la nation. Par cette loi, nous cherchons à comprendre et à étendre les ressources dont nous pouvons disposer à l'intérieur."
 FIJ_focus_expand_the_fcoe: "Étendre le Corps du génie fidjien"
 FIJ_focus_expand_the_fcoe_desc: "Avec le besoin croissant de nouvelles infrastructures, de logements et de l'économie dans son ensemble, il faut étendre la clé de voûte de notre pont. Cette clé de voûte étant le Corps du génie fidjien, ou CGF. Cette expansion verra une approche plus rapide et plus complète du développement, à mesure que davantage de ressources et d'effectifs commencent à être alloués à cette sous-branche de l'armée."
 FIJ_focus_tax_rebalancing_act: "Loi de rééquilibrage fiscal"
 FIJ_focus_tax_rebalancing_act_desc: "Le parlement militaire a adopté la loi de rééquilibrage fiscal, selon laquelle un aperçu général du code fiscal actuel sera examiné individuellement et nous permettra de corriger des impôts absurdes levés sur ceux qui ont été mis à la rue."
 FIJ_focus_expanding_the_ministry_of_science: "Élargir le ministère des Sciences"
 FIJ_focus_expanding_the_ministry_of_science_desc: "Notre nation décroche non seulement parce que notre territoire est petit, mais surtout parce que nous n'innovons pas vraiment. Nous cherchons l'aide étrangère, comme avec la création de notre conseil consultatif étranger. Plus maintenant : nous montrerons au monde que nous pouvons aller quelque part, et pour cela nous investirons massivement dans notre ministère des Sciences et dans les capacités de recherche et de développement technologique de la nation."
 FIJ_focus_soldiers_lifestyle_act: "Loi sur le mode de vie du soldat"
 FIJ_focus_soldiers_lifestyle_act_desc: "Le parlement a jugé bon d'adopter un décret qui fixe le vrai plancher d'un niveau de vie standard. Ce plancher est celui du soldat moyen de nos forces armées. Cela crée une compréhension nationale et générationnelle de ce dont notre peuple jouit, aux dépens de ce que d'autres ne peuvent pas."
 FIJ_focus_the_citizen_soldiers_act: "Loi sur les citoyens-soldats"
 FIJ_focus_the_citizen_soldiers_act_desc: "Le parlement a adopté la loi sur les citoyens-soldats, un amendement constitutionnel selon lequel chaque citoyen est soldat de la nation et chaque soldat est citoyen de la nation. Cet amendement déclare essentiellement que ceux qui servent Fidji sont eux-mêmes fidjiens, et que l'idée d'être fidjien n'est pas une pseudo-science raciale ou ethnique que certains voudraient brandir. Être fidjien, c'est la dévotion à la nation et à ses idées."
 FIJ_focus_energizing_the_nation: "Énergiser la nation"
 FIJ_focus_energizing_the_nation_desc: "Pour équilibrer correctement les besoins militaires et civils, il nous faudra étendre notre réseau énergétique. Un réseau stable et un approvisionnement en carburant prouveront notre stabilité et notre prévoyance pour le chemin à venir."
 FIJ_focus_naval_industrialism: "Industrialisme naval"
 FIJ_focus_naval_industrialism_desc: "Nous sommes une nation insulaire : il est naturel de orienter la production militaire vers les navires. Comment séduire des puissances étrangères comme l'Amérique, l'Australie et d'autres si nous n'étions qu'une base militaire glorifiée ?"
 FIJ_focus_energy_diversity_act: "Loi sur la diversité énergétique"
 FIJ_focus_energy_diversity_act_desc: "La loi sur la diversité énergétique imposera la diversification de notre réseau afin de mieux nous défendre contre les exploiteurs étrangers. Mettre tous nos œufs dans le même panier énergétique, c'est la recette du chaos si la nation est attaquée sous quelque forme que ce soit."
 FIJ_focus_mining_the_future: "Miner l'avenir"
 FIJ_focus_mining_the_future_desc: "Nous savons que nous avons nos propres ressources : nous devrions les utiliser pour améliorer la nation et empêcher l'ingérence extérieure dans les besoins économiques de base."
 FIJ_focus_naval_priorities: "Priorités navales"
 FIJ_focus_naval_priorities_desc: "Nous voulons un recrutement militaire robuste et équilibré, mais nous savons aussi que nous sommes littéralement une île. Les hausses de financement iront donc davantage vers la marine que vers les autres armes, sans trop toutefois, pour éviter des rivalités interarmes malsaines."
 FIJ_focus_civilian_air_training: "Formation aérienne civile"
 FIJ_focus_civilian_air_training_desc: "Nous savons que notre histoire avec une force aérienne est assez rude. Mais le passé ne doit pas dicter le présent, encore moins notre avenir. Nous utiliserons donc des programmes d'entraînement et des appareils civils pour poser les premiers pas de notre arme aérienne. Ce sera lent, mais nécessaire pour survivre à l'âge moderne."
 FIJ_focus_prussia_of_the_pacific: "La Prusse du Pacifique"
 FIJ_focus_prussia_of_the_pacific_desc: "Notre État incarne aujourd'hui une nation de type prussien. Fusionner les modes de vie civil et militaire en une machine cohérente a ouvert un âge nouveau pour Fidji. Nous sommes petits mais fiers, nous bâtissons haut et parlons fort : nous sommes une puissance régionale et ferons entendre notre voix comme toute autre nation."
 FIJ_focus_monarchist_acendence: "Ascendant monarchiste"
 FIJ_focus_monarchist_acendence_desc: "Les luttes internes de l'armée ont ouvert la voie juste de notre nation. Frères et sœurs de Fidji, nous sommes unis sous Dieu et sous la bannière de Fidji. Nous sommes maîtres de notre destin : la démocratie s'est révélée trop instable. Il faut donc transiger et créer une société nouvelle, nationaliste, militairement forte, où être fidjien n'est pas seulement une affaire d'ethnicité."
 FIJ_focus_the_kingdoms_quarrels: "Les querelles du Royaume"
 FIJ_focus_the_kingdoms_quarrels_desc: "La situation politique est au mieux tendue, au pire absurde et décrépite. Il faut rassembler un cabinet, formaliser le gouvernement et évaluer les plus grands problèmes de la nation."
 FIJ_focus_the_kingdoms_economy: "L'économie du Royaume"
 FIJ_focus_the_kingdoms_economy_desc: "Pour aller quelque part dans ce monde, il nous faut une vraie économie. La diversité est le point principal ; le point d'appui, c'est d'avoir les bonnes personnes pour ladite économie. Dans l'ensemble, il nous faudra chercher autour de nous."
 FIJ_focus_the_ethnic_divides: "Les divisions ethniques"
 FIJ_focus_the_ethnic_divides_desc: "Les divisions ethniques de la nation remontent au début du colonialisme anglais, lorsque de nombreux sujets coloniaux d'Inde furent importés à Fidji pour travailler dans les plantations et compagnies sucrières qui remplissaient les caisses anglaises. Cette division et cette migration forcée sont très tendues depuis l'indépendance dans les années 1970. Ce doit être l'une de nos plus grandes priorités, si nous voulons réellement rester au pouvoir."
 FIJ_focus_police_standards_act: "Loi sur les normes policières"
 FIJ_focus_police_standards_act_desc: "Le parlement a adopté un projet qui refond les normes des forces de police de Fidji. Tous les codes de conduite seront polis et reformulés pour insister sur le fait que, quelle que soit la situation, toute action doit être évaluée équitablement. Aucun acte d'agression ne doit avoir lieu contre un civil ou un citoyen de Fidji, sauf menace en cours contre les personnes ou les biens. Ces mesures mettront les choses sur la bonne voie."
 FIJ_focus_sponsored_emigration_deals: "Offres d'émigration sponsorisées"
 FIJ_focus_sponsored_emigration_deals_desc: "Coûteux à court terme, ces accords d'émigration sponsorisée avec les Indiens ethniques accéléreront à long terme la stabilité — même par des moyens peu orthodoxes. Nous pourrions réduire et indirectement homogénéiser la nation, et travailler avec ceux qui veulent vraiment rester. Chacun a un prix, mais chacun a aussi un choix."
 FIJ_focus_hiring_practices_act: "Loi sur les pratiques d'embauche"
 FIJ_focus_hiring_practices_act_desc: "Un projet de loi a standardisé le langage et réaffirmé les lois antidiscriminatoires. Le peu que nous avions laissait trop de failles : égaliser le terrain de jeu arrêtera l'exploitation et la discrimination de tous les citoyens de notre nation."
 FIJ_focus_equal_standard_care_act: "Loi sur un niveau de soins égal"
 FIJ_focus_equal_standard_care_act_desc: "La loi sur le standard égal de soins est un plancher juridique : tous les soins, médicaux ou sociaux, publics ou privés, doivent avoir le même niveau de base. Qu'on soit malade ou à la retraite, les citoyens de cette nation doivent être soignés, quelle que soit leur ethnicité."
 FIJ_focus_redrafting_the_constitution: "Refondre la Constitution"
 FIJ_focus_redrafting_the_constitution_desc: "Il y a longtemps qu'une vraie refonte de la Constitution n'a pas eu lieu. Nous devons poser la structure gouvernementale pour gouverner, et les fondations d'égalité et de libertés sociales sur lesquelles bâtir, sous peine de nous effondrer plus tard."
 FIJ_focus_addressing_the_brain_drain: "Combattre la fuite des cerveaux"
 FIJ_focus_addressing_the_brain_drain_desc: "Notre nation se coûte à elle-même rien qu'en existant. Nos gens fuient vers de meilleures opportunités et un meilleur niveau de vie. Pour grandir, il faut investir et soigner la nation et son peuple."
 FIJ_focus_establishing_the_reseach_and_development_ministry: "Créer le ministère de la R&D"
 FIJ_focus_establishing_the_reseach_and_development_ministry_desc: "La création et la formalisation du ministère de la Recherche et du Développement, ou simplement ministère de la Recherche, sera un pilier fondamental. Donner une tête à l'éducation et à l'innovation nationales permet de mieux organiser, financer et, bien, innover."
 FIJ_focus_employment_assistance_programs: "Programmes d'aide à l'emploi"
 FIJ_focus_employment_assistance_programs_desc: "Le chômage et la peur de voir la vie s'arrêter après un revers poussent les gens à partir. Il faut des programmes de prévention pour aider temporairement les citoyens à changer d'emploi : une petite allocation pour le mois où les factures retardent, des bourses d'emploi pour trouver plus vite — des dispositifs qui lissent le passage entre emploi et chômage sans donner le sentiment que la vie s'arrête."
 FIJ_focus_specializing_medical_research: "Spécialiser la recherche médicale"
 FIJ_focus_specializing_medical_research_desc: "Nous ne sommes pas nombreux : chaque vie dans cette nation vaut d'autant plus. Une part significative de notre R&D doit pionnier les technologies médicales. Oui, cela coûtera, mais notre peuple doit être le mieux soigné si nous voulons vraiment tirer le plein potentiel de notre population."
 FIJ_focus_expanding_education_funding: "Augmenter le financement de l'éducation"
 FIJ_focus_expanding_education_funding_desc: "Accroître l'investissement général dans le système éducatif crée de nouvelles générations de citoyens plus instruits. Les savoirs acquis serviront à développer la nation et notre avenir."
 FIJ_focus_creating_the_research_institute_of_fiji: "Créer l'Institut de recherche de Fidji"
 FIJ_focus_creating_the_research_institute_of_fiji_desc: "L'IRF sera la fierté du développement scientifique dans l'océan Pacifique. Notre investissement et notre volonté d'innover donneront envie à nos gens de rester, de s'améliorer et d'améliorer la nation. Nous pourrons aussi user de cette institution comme levier de soft power militaire et de projection nationale."
 FIJ_focus_reviewing_the_housing_crisis: "Examiner la crise du logement"
 FIJ_focus_reviewing_the_housing_crisis_desc: "Dans le monde occidental développé, une crise du logement, c'est l'effondrement du marché des actifs. Chez nous, c'est la hausse du sans-abrisme. Malgré une population faible, nous avons un problème de sans-abri comparable à certains pays d'Afrique. Comprendre cette réalité terrifiante nous permettra d'agir avec décision et, peut-être, d'empêcher qu'une telle cascade se reproduise — ou du moins à cette échelle."
 FIJ_focus_increased_homeless_shelter_funding: "Augmentation du financement des refuges pour sans-abri"
 FIJ_focus_increased_homeless_shelter_funding_desc: "Nos programmes pour sans-abri n'ont pas le financement nécessaire pour soigner ceux qui en ont besoin. Un investissement direct permettra une meilleure qualité de prise en charge jusqu'à ce qu'ils se relèvent."
 FIJ_focus_royal_engineers_program: "Programme des ingénieurs royaux"
 FIJ_focus_royal_engineers_program_desc: "Le PRE ouvrira un marché d'emplois civils au sein du corps du génie de l'armée. Cette aile civile servira aux travaux publics, aux chantiers sponsorisés par l'État, etc. L'idée est un emploi plancher : si quelqu'un est au chômage et risque de perdre son logement et sa vie entière, nos citoyens auront un sol dur sous les pieds, sans chute libre dans des abîmes dont ils craignent de ne pas revenir."
 FIJ_focus_young_business_leaders_program: "Programme des jeunes chefs d'entreprise"
 FIJ_focus_young_business_leaders_program_desc: "Le programme JLE est une initiative gouvernementale pour inspirer et aider les futurs chefs d'entreprise. Tout le monde peut posséder et diriger une affaire, mais ceux qui le veulent vraiment peuvent rejoindre le JLE. En enseignant les compétences commerciales et en accordant des prêts sans perte remboursables, nous créons un environnement positif pour former les piliers économiques de demain."
 FIJ_focus_resource_development_initiative: "Initiative de développement des ressources"
 FIJ_focus_resource_development_initiative_desc: "L'IDR est un fer de lance gouvernemental pour diversifier nos ressources nationales. Nos options sont limitées, nous sommes une île. Cela ne veut pas dire que nous n'avons rien de valeur : au contraire, un bon mélange de minerais et de minéraux permet une économie diversifiée. Mais pour garder l'avantage, il nous faut davantage de ressources vraiment locales."
 FIJ_focus_new_economic_planning_board: "Nouveau conseil de planification économique"
 FIJ_focus_new_economic_planning_board_desc: "Le CPE aidera urbanistes et investisseurs, étrangers et nationaux, à établir une économie nouvelle et en expansion. Cela attirera des capitaux et nous permettra un soft power limité en soutenant des entreprises étrangères et en exportant nos produits."
 FIJ_focus_ensuring_a_steeling_future: "Assurer un avenir prometteur"
 FIJ_focus_ensuring_a_steeling_future_desc: "Développer et obtenir de l'acier en quantités suffisantes dans des mains nationales nous permet essentiellement de fonctionner. L'acier est l'une des matières premières du monde moderne. Assurer un approvisionnement intérieur préserve une forme d'indépendance économique."
 FIJ_focus_phase_one_business_development: "Développement des entreprises, phase 1"
 FIJ_focus_phase_one_business_development_desc: "Les premiers résultats de notre revitalisation économique prennent vie : nous pourrons bientôt nous prélasser dans la prospérité."
 FIJ_focus_oiling_our_nation: "Huiler la nation"
 FIJ_focus_oiling_our_nation_desc: "Par des prospections et recherches approfondies, nous avons pu consacrer notre plan à un approvisionnement pétrolier intérieur. Pierre angulaire de l'âge moderne, nous sécuriserons notre avenir et nos besoins énergétiques et pétrochimiques."
 FIJ_focus_diversifying_the_naval_industries: "Diversifier les industries navales"
 FIJ_focus_diversifying_the_naval_industries_desc: "Nous avons une industrie navale forte, mais il faut diversifier et permettre l'expansion des industries civiles et militaires sur l'île. Nous devons revendiquer un petit droit à sécuriser le sol national et notre compétitivité."
 FIJ_focus_rubber_banding_the_nation: "Caoutchouter la nation"
 FIJ_focus_rubber_banding_the_nation_desc: "Grâce à des percées dans les technologies synthétiques, nous avons pu assurer un approvisionnement intérieur conséquent en caoutchouc à partir d'un stock limité de caoutchouc naturel. Cela coûtera un peu plus, mais à long terme ce sursaut nous rapprochera autant que possible de l'autarcie."
 FIJ_focus_phase_two_business_development: "Développement des entreprises, phase 2"
 FIJ_focus_phase_two_business_development_desc: "Des investissements continus pour la croissance des entreprises et l'expansion de l'économie nous permettront sans aucun doute de croître à un rythme régulier."
 FIJ_focus_pacific_economics_exchange_commission: "Commission pacifique d'échange économique"
 FIJ_focus_pacific_economics_exchange_commission_desc: "Notre incursion dans la reconnaissance régionale — et le fait d'être un peu un casse-tête pour les puissances qui se disputent le Pacifique — sera notre couronnement. La Commission d'échange économique du Pacifique est un outil de coopération entre notre nation et d'autres de la région. Le but est de favoriser la coopération et l'unité entre nous et les autres nations insulaires, au moins pour établir un statu quo large en matière de soft power."
 FIJ_focus_royal_military_expansion_program: "Programme royal d'expansion militaire"
 FIJ_focus_royal_military_expansion_program_desc: "Une expansion et un financement généraux de l'armée nous permettront d'élargir la sécurité intérieure et les missions de soutien à l'étranger. Avec la montée de l'armée, nous pourrons aussi inculquer un sens du devoir et de l'honneur envers la nation et son peuple, formant les générations à venir."
 FIJ_focus_royal_military_contracts: "Contrats militaires royaux"
 FIJ_focus_royal_military_contracts_desc: "Les CMR seront un programme d'incitation à la production d'armes nationale. Ce n'est pas de quoi crier au miracle, mais cela nous permettra d'approvisionner correctement l'armée, d'améliorer l'entraînement et de réduire le temps nécessaire pour former."
 FIJ_focus_royal_fijian_dream: "Le rêve fidjien royal"
 FIJ_focus_royal_fijian_dream_desc: "Le rêve fidjien royal, c'est penser le passé selon les normes du présent. Une réaffirmation de la déclaration constitutionnelle : la pierre angulaire de notre démocratie sera conservée, mais les noms des charges et titres changeront simplement. Est-ce un peu de panache cosmétique ? Oui. Cela dévalue-t-il nos engagements envers la nation et son peuple ? Certainement pas. Parfois un petit coup d'ego fait des merveilles pour ceux qui ne se confient pas toujours en eux-mêmes."
 FIJ_focus_technate_council_emerges: "Le conseil du Technat émerge"
 FIJ_focus_technate_council_emerges_desc: "À Fidji, de nombreux experts techniques de premier plan ont étudié à l'étranger. Le conseil du Technat est un groupe respecté d'économistes, de scientifiques et d'autres experts techniques qui se sont regroupés en un bloc de pouvoir. Dans le chaos et le factionnalisme apparemment sans fin, le conseil a usé de ses connexions et de son influence pour soumettre les chefs de faction, directement ou indirectement. Il a pris la direction de la nation et s'efforcera de faire de Fidji un modèle d'ingéniosité et d'innovation humaines."
 FIJ_focus_a_technocratic_constitution: "Une constitution technocratique"
 FIJ_focus_a_technocratic_constitution_desc: "Le fondement de toute technocratie est que le corps gouvernant agit pour le mieux de l'espèce, non d'une sous-catégorie. Nous prévoyons donc de refondre la Constitution et de créer la première constitution technocratique. Les points principaux se préciseront au fil de la rédaction, mais l'essentiel est déjà clair : nous nous appelons Fidjiens et avons un État-nation nommé Fidji ; désormais tout humain sous l'autorité de cette nation sera traité comme un égal. Les humains sont des humains : nous sommes l'espèce et devons travailler ensemble pour solidifier l'avenir et le progrès de notre espèce."
 FIJ_focus_human_treatment_amendment: "Amendement sur le traitement humain"
 FIJ_focus_human_treatment_amendment_desc: "L'amendement sur le traitement humain affirme clairement que tout membre de l'espèce humaine, quelle que soit sa variation, sera traité comme un humain. Tout acte injuste de nuire à un autre membre de l'espèce en raison de croyances, d'apparence ou d'identité personnelle, dans les limites scientifiques connues, sera puni sévèrement selon le code pénal."
 FIJ_focus_voting_requirements_amendment: "Modification des exigences de vote"
 FIJ_focus_voting_requirements_amendment_desc: "L'amendement sur les conditions de vote est une réponse simple à l'âge démocratique moderne. L'âge du vote sera 18 ans, l'âge légal de l'âge adulte et de la responsabilité personnelle. Tous les citoyens enregistrés pourront voter, pour empêcher des adversaires étrangers d'exploiter l'ouverture d'une démocratie directe. Les votes se feront via un site gouvernemental, à domicile, sur téléphone ou dans un bâtiment administratif. Les électeurs devront saisir leur numéro d'identité de citoyen afin d'empêcher le double vote et d'autres fraudes."
 FIJ_focus_working_standards_amendment: "Modification des normes de travail"
 FIJ_focus_working_standards_amendment_desc: "L'amendement sur les normes de travail couvre la nouvelle direction que nous voulons donner à la nation. La stipulation principale est l'analyse et la mise en œuvre immédiates du planning rotatif, plus connu comme le 4 & 4. Quatre heures par jour, quatre jours par semaine, sera la semaine de travail standard. Le déploiement prendra du temps, mais ce format assure un emploi maximal, la rétention et le bonheur des travailleurs."
 FIJ_focus_funding_our_future: "Financer notre avenir"
 FIJ_focus_funding_our_future_desc: "Le cœur de notre voyage technocratique est d'assurer que les générations futures apprennent de façon adaptative les savoirs du monde et au-delà. Certains apprennent visuellement, d'autres par la pratique. C'est une échelle glissante : si nous ne glissons pas avec elle, nous créerons une caste et ne ferons que les blesser en négligeant comment ils peuvent apprendre et s'adapter."
 FIJ_focus_growing_our_manufacturing_base: "Développer notre base manufacturière"
 FIJ_focus_growing_our_manufacturing_base_desc: "Pour un avenir de progrès, il faut grandir, comme nation et comme économie. Ce point lancera un focus dédié à la croissance économique, avec un pilier d'appui dans le développement et l'investissement sociaux."
 FIJ_focus_building_the_institute_of_automation: "Bâtir l'Institut d'automatisation"
 FIJ_focus_building_the_institute_of_automation_desc: "Le PPR, ou programme paradis de la recherche, lancera notre nation et notre espèce vers l'avenir dont nous spéculons. En commençant par l'Institut d'automatisation, nous dédierons innovations et recherches à mieux automatiser et intégrer de nouvelles technologies pour construire, produire et créer. En produisant plus, moins cher et plus vite, nous espérons offrir partout où c'est possible un niveau de vie inédit depuis l'après-guerre."
 FIJ_focus_dedicated_welfare_funding: "Financement social dédié"
 FIJ_focus_dedicated_welfare_funding_desc: "Si nous voulons des citoyens productifs et coopératifs, il faut aussi en prendre soin. Le respect est une rue à double sens et, indépendamment de l'impact émotionnel, nous sommes tous membres de la même espèce : par décret constitutionnel, nous devons prendre soin les uns des autres."
 FIJ_focus_tech_industrial_investments: "Investissements industriels technologiques"
 FIJ_focus_tech_industrial_investments_desc: "Notre compréhension de l'économie mondiale montre clairement que les industries technologiques sont le cœur du jeu. Nous pouvons y entrer et l'intégrer au programme paradis de la recherche."
 FIJ_focus_institute_for_resource_development: "Institut de développement des ressources"
 FIJ_focus_institute_for_resource_development_desc: "L'IDR consacrera sa recherche à l'extraction, au raffinage et aux synthétiques. Cette dédicace posera le socle de l'autarcie économique et montrera au monde que nous pouvons créer un meilleur demain."
 FIJ_focus_institute_for_energy_development: "Institut de développement énergétique"
 FIJ_focus_institute_for_energy_development_desc: "La création de l'IDE visera de nouvelles façons de produire de l'énergie, plus efficaces et plus productives. Cette extension du programme paradis de la recherche aidera à sécuriser davantage d'indépendance énergétique vis-à-vis des puissances étrangères."
 FIJ_focus_labour_corps: "Corps du travail"
 FIJ_focus_labour_corps_desc: "Le Corps du travail est une initiative gouvernementale pour organiser et prioriser le développement et la construction de nouveaux travaux publics et d'infrastructures. Cette organisation civile de type militaire nous permettra de construire à des vitesses qu'aucune nation développée normale n'atteindrait, grâce à l'organisation, à la simplification des réglementations et à la façon dont nous attaquons les besoins et les réglons."
 FIJ_focus_labour_prison_program: "Programme de travail carcéral"
 FIJ_focus_labour_prison_program_desc: "Le PPT est une philosophie de réhabilitation du système pénal. Les détenus recevront les soins de base. Tous pourront s'inscrire au programme où ils auront un emploi dédié pour gagner des crédits énergétiques, échangeables contre des « améliorations » rendant leur détention plus supportable. Une fois les améliorations achetées, selon l'infraction, ils pourront échanger des crédits pour réduire leur peine. Le taux sera d'abord biaisé pour les retenir, mais le but est d'encourager la réhabilitation par le travail et de préparer le retour en société."
 FIJ_focus_increasing_domestic_steel: "Augmentation de l'acier domestique"
 FIJ_focus_increasing_domestic_steel_desc: "Par des prospections et recherches approfondies, nous avons percé dans le développement de la production d'acier intérieure. Ce n'est pas beaucoup, mais c'est un bon point de départ vers plus d'autosuffisance."
 FIJ_focus_technocratic_militarism: "Militarisme technocratique"
 FIJ_focus_technocratic_militarism_desc: "Un principe unificateur dans l'histoire de notre espèce est le devoir et l'honneur envers la patrie et ceux qui la servent. Nous devons consacrer une bonne note de R&D à l'amélioration de l'armée. Cela ne nous mettra pas au niveau de la France ou de l'Allemagne, mais nous pourrions au moins émuler une mini-armée américaine. On peut rêver… on peut rêver."
 FIJ_focus_research_paradise_program: "Programme paradis de la recherche"
 FIJ_focus_research_paradise_program_desc: "Après près de trois ans de développement, nous pouvons enfin lancer notre but ultime. Le programme paradis de la recherche sera une pierre angulaire de la communauté scientifique mondiale et, grâce à un financement massif, créera un hub de type vacances pour chercheurs de tous domaines, afin d'étudier, d'expérimenter et d'explorer. Nous créerons un monde où les STEM ne sont pas seulement l'avenir, mais aussi agréables qu'un séjour de vacances."
 FIJ_focus_promoting_domestic_energy_synthetics: "Promouvoir les synthétiques énergétiques nationaux"
 FIJ_focus_promoting_domestic_energy_synthetics_desc: "Des percées dans les synthétiques ont produit un approvisionnement pétrolier intérieur croissant. Il fera croître l'économie : utilisable pour l'énergie, il propulsera aussi nos industries pétrochimiques."
 FIJ_focus_technocratic_health_act: "Loi sanitaire technocratique"
 FIJ_focus_technocratic_health_act_desc: "Le conseil a adopté la LST, un projet qui élargit globalement le système de santé. Nous pourrons mieux soigner l'ensemble de la population. Pour bâtir en hauteur, il faut la population, en taille et en motivation."
 FIJ_focus_industrial_diversity_act: "Loi sur la diversité industrielle"
 FIJ_focus_industrial_diversity_act_desc: "La LDI voit la diversification accrue de l'économie civile. Grâce aux efforts continus du complexe d'instituts, nous avons vraiment développé la nation."
 FIJ_focus_family_care_act: "Loi sur les soins familiaux"
 FIJ_focus_family_care_act_desc: "Ce décret pose que, pour une cohésion sociale saine, la famille, quelle que soit sa composition, est la clé de voûte de toute société. Il faut donc restructurer les programmes sociaux pour soutenir cette clé de voûte et garder forte la structure de notre société."
 FIJ_focus_research_plan_alchemy: "Plan de recherche Alchimie"
 FIJ_focus_research_plan_alchemy_desc: "Notre plan le plus ambitieux à ce jour. Le plan de recherche Alchimie coûtera environ un tiers de notre PIB, mais nous croyons avoir les bases extrêmes pour tenter la réorganisation moléculaire. En termes clairs, ce serait proche de l'alchimie elle-même. Cette techno serait extrêmement volatile et coûteuse ; si nous y parvenons, nous débloquerions la forme la plus vraie d'autarcie économique."
 FIJ_focus_research_plan_armory: "Plan de recherche Arsenal"
 FIJ_focus_research_plan_armory_desc: "Notre armée doit être à la hauteur des avancées civiles. Nous ne pouvons pas mettre toutes nos meilleures inventions sur le terrain, mais nous pouvons au moins élever le standard auquel nos personnels combattent et survivent. Cela coûtera décemment ; les résultats serviront la sécurité nationale."
 FIJ_focus_research_plan_biomedical: "Plan de recherche biomédicale"
 FIJ_focus_research_plan_biomedical_desc: "Le plan Bio-Med propulse nos technologies et machines biologiques et médicales vers des niveaux qui, nous l'espérons, allongeront l'espérance de vie de vingt ans. Prothèses, avancées en génie génétique : les plus âgés resteraient plus sains et plus forts malgré l'âge. Nous voulons être un parapluie et vraiment couvrir nos citoyens d'un âge nouveau d'innovations biomédicales."
 FIJ_focus_naval_innovations: "Innovations navales"
 FIJ_focus_naval_innovations_desc: "Notre armée n'est pas que l'armée de terre : un département interne dédié aux innovations navales est le seul moyen pour Fidji de régner sur ses eaux nationales."
 FIJ_focus_expansion_of_welfare_programs: "Expansion des programmes de protection sociale"
 FIJ_focus_expansion_of_welfare_programs_desc: "Diversifier nos types de programmes sociaux permettra une attention variée à de nombreux problèmes persistants du nouvel âge."
 FIJ_focus_research_plan_synthetic: "Plan de recherche Synthétique"
 FIJ_focus_research_plan_synthetic_desc: "Le plan Synthétique est une approche globale pour affiner notre programme de synthétiques et conjurer un approvisionnement intérieur de produits de type caoutchouc. Au prix d'importations limitées de caoutchouc et d'investissements de recherche accrus, nous pouvons attendre un coup de pouce à nos matrices économiques et sociétales. Encore un pas…"
 FIJ_focus_civilian_corp_of_engineers: "Corps Civil Des Ingénieurs"
 FIJ_focus_civilian_corp_of_engineers_desc: "Le CCG est une extension civile du corps du génie fidjien. Le but est de distinguer et prioriser les travaux civils et militaires. Les deux groupes peuvent toutefois s'unir si besoin, avec des applications militaires indirectes."
 FIJ_focus_research_plan_autarky: "Plan de recherche Autarcie"
 FIJ_focus_research_plan_autarky_desc: "Après des années de recherche, de planification et d'investissements, nous avons enfin une vraie percée, qui solidifie notre autarcie économique presque au maximum. Nous pouvons désormais tout accomplir : les étoiles ne sont peut-être plus la limite."
 FIJ_focus_research_plan_feast: "Plan de recherche Festin"
 FIJ_focus_research_plan_feast_desc: "Pour soutenir notre croissance comme espèce et comme société, il faut fournir les bases de la vie. L'une d'elles est la nourriture : elle assure la stabilité sociale, la croissance démographique et un avantage de soft power. Nous pouvons trouver des moyens d'accroître l'aide étrangère ciblée et de mener le monde contre la pauvreté et l'insécurité alimentaire. Fidji deviendra une pierre angulaire de l'unité mondiale."
 FIJ_focus_research_plan_nucleus: "Plan de recherche Noyau"
 FIJ_focus_research_plan_nucleus_desc: "L'avenir est vraiment maintenant. Tant d'avancées ont été faites en génie nucléaire qu'il est pathétique que les tactiques de peur l'emportent encore sur les réalités évidentes de la production d'énergie. Nous fixerons donc, à un coût majeur, le nouveau standard mondial d'un réacteur vraiment efficace, productif, et susceptible de produire plus que la zone qu'il dessert. Ce standard le plus sûr pourrait faire honte à toute nation au passé nucléaire douteux. Pour la technocratie, l'avenir dont notre espèce a besoin, mais qu'elle semble ne pas vouloir."