 ITA_modify_article_18: "제18조 개정"
 ITA_modify_article_18_desc: "노동자 헌장 제18조는 고용주가 직원을 해고하기 극히 어렵게 만들었고 우리의 고용 시장은 그에 따라 피해를 입었습니다. 이를 개정하면 야당으로부터 \\"강제 노동\\"과 \\"노예제\\"라는 비난이 분명 쏟아지겠지만, 실제로는 상식에 불과합니다."
 ITA_modify_article_18_decision: "제18조 개정"
 ITA_modify_article_18_decision_desc: "노동자 헌장 제18조는 고용주가 직원을 해고하기 극히 어렵게 만들었고 우리의 고용 시장은 그에 따라 피해를 입었습니다. 이를 개정하면 야당으로부터 \\"강제 노동\\"과 \\"노예제\\"라는 비난이 분명 쏟아지겠지만, 실제로는 상식에 불과합니다."
