 JAP_subaru_tank_manufacturer_header_systems_resilience: "Résilience des systèmes"
 JAP_howa_machinery_materiel_manufacturer_header_service_rifle_evolution: "Évolution du fusil de service"
 JAP_howa_machinery_materiel_manufacturer_header_support_weapons_accessories: "Armes d'appui et accessoires"
 JAP_nec_materiel_manufacturer_header_light_wings: "Ailes légères"
 JAP_nec_materiel_manufacturer_header_air_defense_shield: "Bouclier de défense aérienne"
 JAP_toshiba_materiel_manufacturer_header_rail_systems: "Systèmes ferroviaires"
 JAP_toshiba_materiel_manufacturer_header_air_defense_systems: "Systèmes de défense aérienne"
 JAP_mitsubishi_shipbuilding_naval_manufacturer_header_patrol_convoy_vessels: "Navires de patrouille et de convoi"
 JAP_mitsubishi_shipbuilding_naval_manufacturer_header_frigates_destroyers: "Frégates et destroyers"
 JAP_mitsubishi_shipbuilding_naval_manufacturer_header_submarines: "Sous-marins"
 JAP_kawasaki_shipbuilding_naval_manufacturer_header_submarine_excellence: "Excellence sous-marine"
 JAP_kawasaki_shipbuilding_naval_manufacturer_header_container_vessel_efficiency: "Efficacité des navires porte-conteneurs"
 JAP_ihi_corporation_naval_manufacturer_header_flagship_core_systems: "Systèmes de base phares"
 JAP_ihi_corporation_naval_manufacturer_header_projecting_presence: "Projection de la présence"
 JAP_jmu_corporation_naval_manufacturer_header_escort_combatants: "Combattants d’escorte"
 JAP_jmu_corporation_naval_manufacturer_header_flight_ops_sea_control: "Opérations aériennes et contrôle maritime"
 JAP_jmu_corporation_naval_manufacturer_header_carrier_aviation: "Transporteur aérien"
 senbu_occupation_law_fake_idea: "Administration de pacification Senbu"
 senbu_occupation_law_fake_idea_desc: "Les officiers des affaires civiles dirigent les districts occupés par les notables locaux plutôt que par les commandants de garnison, restaurant marchés, écoles et distribution de riz avant d'exiger de la production. La conformité croît régulièrement et l'exigence de garnison reste basse, mais la main légère laisse à la résistance organisée plus d'espace qu'un régime punitif."
 JAP_sabotaged_russians: "Installations russes sabotées"
 JAP_usa_trade_pressure: "Pression commerciale américaine"
 JAP_article_nine_balance_of_power_category: "Article neuf"
 JAP_article_nine_balance_of_power_category_desc: "La renonciation à la guerre dans l'article neuf de la constitution n'est pas une question réglée mais un argument courant entre le cabinet, les tribunaux, l'alliance américaine et le public. Chaque réinterprétation déplace l'équilibre entre une posture strictement défensive et une armée normale."
 JAP_cool_japan_doctrine_desc: "Le design japonais n'est pas étrange parce qu'il a échoué à coller à une norme étrangère. Il est étrange parce qu'il a été fait pour des clients japonais par des gens qui n'ont jamais une seule fois considéré l'alternative, et c'est précisément ce qui le rend digne d'être acheté. Le ministère cesse d'emballer la culture comme vitrine du matériel et commence à exporter la différence elle-même.\n\n§RCette voie conserve §Y$JAP_galapagos_syndrome$§! de façon permanente.§! Seule §Y$JAP_world_integration$§! le retire, et les deux sont mutuellement exclusives : le Japon converge vers les normes du monde, ou vend au monde les siennes."
 JAP_galapagos_sphere_modifier: "Sphère culturelle"
 JAP_galapagos_sphere_modifier_desc: "Le ministère tient un décompte trimestriel des pays où l'influence japonaise atteint vingt pour cent ou plus et traite le total comme un chiffre d'exportation à part entière. Chaque pays de la liste élargit l'audience qui achète déjà le design japonais sans qu'on lui demande de le comprendre d'abord, ce qui vaut quelque chose aux délégations commerciales et davantage encore aux firmes qui les suivent. Le décompte se fait une fois par trimestre et le rendement bouge avec lui. Une sphère qui cesse de croître cesse de payer."
 JAP_galapagos_sphere_tt: "§YSphère culturelle§! : [?JAP_galapagos_sphere_count|Y0] pays portant §G20 %§! d'influence japonaise ou plus, décomptés chaque trimestre une fois la §Ydoctrine Cool Japan§! adoptée. Le rendement monte de moitié avec §Y$JAP_electronics_superpower$§! et d'un quart supplémentaire avec §Y$JAP_home_electronics$§!."
 JAP_cool_japan_sphere_payout_tt: "Chaque trimestre le ministère compte les pays où l'§Yinfluence§! japonaise atteint §G20 %§! ou plus et rapporte le total comme §Ysphère culturelle§!. Chacun ajoute §G+1 %§! d'§Yinfluence étrangère§! et §G+0,2 %§! de §Yretour sur investissement§!, versés par la §Ysphère culturelle§! et croissant à mesure que la sphère s'élargit. §Y$JAP_electronics_superpower$§! relève encore le rendement de moitié, et §Y$JAP_home_electronics$§! le relève d'un quart supplémentaire.\n-------------\nCela ne touche pas la §Ydérive de la recherche§!. La doctrine achète de la portée à l'étranger ; elle ne ferme pas l'écart de normes au pays."
 JAP_creative_industries_office: "Bureau de promotion des industries créatives"
 JAP_creative_industries_office_desc: "Le ministère de l'Économie, du Commerce et de l'Industrie dresse le Bureau de promotion des industries créatives pour traiter animation, design, mode et alimentation comme secteurs d'exportation plutôt que comme culture. Le Cool Japan Fund suit avec cinquante milliards de yens et un mandat de co-investir plutôt que de subventionner, prenant des parts dans des surfaces de vente outre-mer, des plateformes de streaming asiatiques et des aventures de distribution qu'aucun conseil japonais n'aurait approuvées seul. Les officiels font de mauvais capital-risqueurs et le Fonds affiche des années de pertes, mais il prend la première perte sur les projets que le capital privé suit ensuite."
 JAP_visit_japan_campaign: "Campagne Visitez le Japon"
 JAP_visit_japan_campaign_desc: "La campagne Visit Japan est relancée derrière une cible qu'aucun ministère ne croit : quarante millions de visiteurs étrangers par an. Le gouvernement assouplit le régime des visas pour les voyageurs asiatiques, exonère cosmétiques et médicaments de la taxe à la consommation en caisse, et commercialise le pays sur les parts de lui-même qui ne se traduisent pas. Rien du Japon n'est rendu moins japonais pour le vendre."
 JAP_content_export_offensive: "Offensive d'exportation culturelle"
 JAP_content_export_offensive_desc: "La loi fondamentale sur la propriété intellectuelle et la loi de promotion des contenus inscrivent animation, jeux et manga dans le statut comme actifs stratégiques, et l'industrie traite encore son public outre-mer comme une piraterie à tolérer tandis que des traducteurs amateurs font la distribution. Le gouvernement construit plutôt le canal légal : sortie simultanée, sous-titrage professionnel, et ayants droit qui négocient en bloc plutôt qu'un studio à la fois. Le marché outre-mer est déjà la plus grande moitié des recettes de l'anime, et presque rien n'en est collecté."
 JAP_washoku_to_the_world: "Le washoku au monde"
 JAP_washoku_to_the_world_desc: "Le washoku inscrit sur la liste du patrimoine culturel immatériel de l'UNESCO, le gouvernement promeut non un plat mais une pratique : l'ingrédient de saison, l'arrangement, la table du Nouvel An. L'instinct antérieur du ministère était de le policer, et le schéma de certification des restaurants japonais authentiques outre-mer a été abandonné dès que la presse étrangère l'a baptisé police des sushis. Les california rolls et le ramen de Bangkok vendent plus de riz, de soja et de saké japonais qu'aucune inspection n'aurait jamais pu, et la cible d'exportation de mille milliards de yens repose sur ce commerce."
 JAP_japan_house_network: "Le réseau Japan House"
 JAP_japan_house_network_desc: "Le programme JET a envoyé des milliers de jeunes étrangers dans les écoles et mairies japonaises et les a renvoyés chez eux fluents, et ils siègent désormais dans des ministères des Affaires étrangères, des cabinets d'avocats et des rédactions. Japan House donne à ce réseau une porte d'entrée : une galerie, une bibliothèque, une boutique et un restaurant sur une rue chère à São Paulo, Los Angeles et Londres, gérés par le ministère des Affaires étrangères et délibérément vides de drapeaux et de déclarations politiques. Les candidatures aux cours de japonais ont triplé dans chaque ville après l'ouverture."
 JAP_gross_national_cool: "Cool national brut"
 JAP_gross_national_cool_desc: "Le syndrome de Galápagos reste : les spécifications demeurent japonaises et la dérive de la recherche continue. Ce que les ministères ont construit à la place, c'est un pays qui gagne à l'étranger par ce que lui seul peut faire, les studios, les cuisines, les maisons de jeux, les bureaux de design, et les millions qui viennent chaque année simplement pour regarder. L'isolement n'a jamais été guéri, seulement mis au travail."
 JAP_cool_japan_spirit_kept_tt: "Le §Ysyndrome de Galápagos§! §Reste en place§!. Le Japon a choisi de vendre sa différence plutôt que de la guérir"
 JAP_electronics_anchor_bonus_tt: "§YSuperpuissance de l'électronique§! : le matériel japonais porte le contenu japonais sur chaque marché, et le retour croît avec lui"
 JAP_world_integration: "Intégration au monde"
 JAP_world_integration_desc: "Le Japon cesse d'être une île. Les normes sont réécrites sur le brouillon de quelqu'un d'autre, les barèmes tarifaires baissent, les ministères cessent de demander si une offre étrangère est appropriée, et le capital qui a passé trente ans à contourner ce pays commence à y entrer. Ce qui est livré, c'est la protection elle-même, le marché captif qui rendait les biens de consommation bon marché et le mur contre l'influence étrangère qu'aucun rival n'a jamais gravi, et les firmes japonaises doivent désormais gagner un marché qu'elles possédaient."
 JAP_structural_reform_zones: "Zones spéciales de réforme structurelle"
 JAP_structural_reform_zones_desc: "Plutôt que d'argumenter le code réglementaire ligne à ligne contre les ministères qui l'ont écrit, le gouvernement laisse une préfecture ou une ville demander à être exemptée d'une règle puis prouver que le ciel ne tombe pas. Des agriculteurs brassent sous le volume minimum national, des sociétés par actions gèrent des écoles et louent des terres agricoles, et les zones stratégiques nationales spéciales pointent le même instrument sur Tokyo pour la finance, Fukuoka pour les règles d'emploi des start-up, et le Kansai pour les essais médicaux. C'est de la déréglementation au détail plutôt qu'en gros, et c'est la seule méthode qui ait jamais réellement bougé quelque chose."
 JAP_corporate_governance_code: "Le code de gouvernance d'entreprise"
 JAP_corporate_governance_code_desc: "Le rapport Ito met un chiffre sur l'échec : huit pour cent de rendement des fonds propres est le minimum qu'une entreprise japonaise doit franchir pour valoir le capital qu'elle consomme, et la plupart ne le franchissent pas. Le code de gérance dit aux fonds de pension et aux assureurs de voter leurs actions comme des propriétaires plutôt que comme des invités, et le code de gouvernance d'entreprise suit en termes de « se conformer ou expliquer ». Les administrateurs externes montent vers un tiers du conseil et les participations croisées commencent à se vendre, ce qui ne rend pas les firmes japonaises étrangères tant que lisibles à quiconque veut acheter une action."
 JAP_economic_partnership_agreements: "Accords de partenariat économique"
 JAP_economic_partnership_agreements_desc: "L'agriculture détient le veto sur la politique commerciale japonaise depuis la guerre, et les exportateurs perdent désormais des appels d'offres face aux firmes coréennes sur la seule ligne tarifaire. Le Japon clôt le plus grand accord bilatéral que l'une ou l'autre partie ait jamais signé avec l'Union européenne, puis prend la présidence du Partenariat transpacifique après le départ de Washington, suspendant les clauses américaines plutôt que de les supprimer. Le RCEP suit et place le Japon, la Chine et la Corée du Sud dans un même cadre commercial pour la première fois, le riz étant protégé dans chacun d'eux."
 JAP_open_capital_markets: "Ouvrir les marchés de capitaux"
 JAP_open_capital_markets_desc: "Mesuré à la taille de son économie, le Japon porte moins de capital étranger que presque tout pays développé, retenu par les participations croisées, une information illisible, et quarante ans d'officiels traitant une offre étrangère comme un problème à gérer. Les réparations sont peu glorieuses et presque entièrement administratives : des bureaux Invest Japan au JETRO pour accompagner une firme étrangère dans l'immatriculation, des résultats publiés en anglais le jour où ils paraissent en japonais, et une piste de résidence par points pour les personnes qu'une filiale étrangère doit déplacer ici pour ouvrir tout court. La question des personnes dans sa forme pleine appartient à §Y$JAP_an_open_nation$§!, et celle-ci est la plus étroite de savoir si le capital peut trouver la porte."
 JAP_the_third_opening: "La troisième ouverture"
 JAP_the_third_opening_desc: "Le Japon abandonne les dernières protections qui en faisaient une économie à part. Le gouvernement ouvre le marché intérieur à la concurrence étrangère, réécrit ses normes sur des brouillons internationaux, et laisse le capital étranger acheter aux mêmes termes que le capital japonais. Le marché captif et le mur contre l'influence extérieure sont tous deux livrés pour un pays qui commerce comme un signataire parmi d'autres."
 JAP_an_open_nation_bonus_tt: "§Y$JAP_an_open_nation$§! : un pays déjà ouvert aux peuples du monde a bien moins à argumenter lorsqu'il s'ouvre au capital du monde"
 JAP_zombie_report_credible_tt: "L'enquête a produit au moins un §Yrapport partiel§!"
 JAP_zombie_investigation_concluded_tt: "L'enquête a §Yconclu§!, quoi qu'elle ait trouvé"
 JAP_zombie_case_files_up_1_tt: "$JAP_case_files$: $RIGHT|+=1$"
