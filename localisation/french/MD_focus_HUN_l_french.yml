l_french:
 HUN_karpatalja_question_category: "La question de la Karpatalja"
 HUN_annex_karpatalja: "Répondre à l'appel de la Karpatalja"
 HUN_annex_karpatalja_desc: "L'autorité de l'Ukraine en Transcarpatie s'est effondrée. Les conseils hongrois locaux demandent à Budapest de reconnaître une union, et plus personne à Kiev n'est là pour dire non."
 HUN_karpatalja_ultimatum: "Ultimatum à Kiev"
 HUN_karpatalja_ultimatum_desc: "La minorité hongroise de Karpatalja a attendu un siècle la réunion avec la mère patrie. Kiev devrait la céder en silence, ou la perdre par la force."
 HUN_karpatalja_integration_category: "Administration de Karpatalja"
 HUN_701_return: "Retour de la Karpatalja"
 HUN_701_return_desc: "La Karpatalja fut perdue à Trianon. La conformité de la province étant assurée, nous pouvons rendre la réunion permanente."
 HUN_karpatalja_autonomy: "Administration de Karpatalja"
 HUN_karpatalja_autonomy_desc: "Gouverner la Karpatalja par des conseils locaux achète la bienveillance et accélère son intégration, au prix d'une main plus lente sur les cordons de la bourse et de la patience du public pour cet arrangement."
 HUN_ukr_cede_tt: "§YL'Ukraine cédera la Karpatalja§!"
 HUN_ukr_refuse_tt: "§RNous obtiendrons un but de guerre pour prendre la Karpatalja par la force§!"
 hungary_karpatalja.1.t: "Les conseils de Karpatalja"
 hungary_karpatalja.1.d: "Kiev étant incapable de projeter son autorité si loin de la capitale, les assemblées locales de Transcarpatie ont voté pour chercher l'union avec la Hongrie. Budapest n'est que trop disposée à y consentir."
 hungary_karpatalja.1.a: "Accueillez-les à la maison"
 hungary_karpatalja.2.t: "Gouverner Karpatalja"
 hungary_karpatalja.2.d: "La Karpatalja est hongroise sur la carte. En faire une administration fonctionnelle est une autre affaire, et le gouvernement doit décider de la lourdeur de la main à employer."
 hungary_karpatalja.2.a: "Règle par l'intermédiaire des conseils locaux"
 hungary_karpatalja.2.b: "Administration directe depuis Budapest"
 hungary_karpatalja.10.t: "Budapest réclame Karpatalja"
 hungary_karpatalja.10.d: "La Hongrie a lancé un ultimatum : céder la Transcarpatie, ou en affronter les conséquences. Le gouvernement doit décider comment répondre."
 hungary_karpatalja.10.a: "Céder la province"
 hungary_karpatalja.10.b: "Rejeter l'ultimatum"
 hungary_karpatalja.11.t: "Kyiv refuse"
 hungary_karpatalja.11.d: "L'Ukraine a rejeté nos exigences sur la Karpatalja. Si nous voulons la province, nous devrons la prendre nous-mêmes."
 hungary_karpatalja.11.a: "Se préparer à la guerre"