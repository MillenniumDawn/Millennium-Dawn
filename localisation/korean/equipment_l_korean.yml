 CAN_IFV_3_desc: "LAV III는 제너럴 다이내믹스의 자회사로 온타리오주 런던에 본사를 둔 제너럴 다이내믹스 랜드 시스템즈 캐나다(GDLS-C)가 제작한 경장갑차(LAV) 장갑 수송차 계열의 3세대 차량입니다. 1999년에 처음 배치되었으며 캐나다군과 뉴질랜드군 모두의 주력 기계화 보병 차량입니다."
