 indonesia.56.t: "서파푸아에서의 재난!"
 indonesia.56.d: "서파푸아 주민에 대한 우리의 지원 실패로 인해 항공 사고가 발생하여 지방 공항이 큰 피해를 입었습니다!"
 indonesia.56.a: "충분히 막을 수 있었다!"
 indonesia.57.t: "Disaster in Sulawesi!"
 indonesia.57.d: "술라웨시에 적절한 인프라를 구축하지 못한 탓에 여러 건물이 붕괴하여 많은 국민이 목숨을 잃었습니다"
 indonesia.57.a: "충분히 막을 수 있었다!"
 indonesia.58.t: "서파푸아에서의 재난!"
 indonesia.58.d: "서파푸아에 대한 적절한 관리를 제공하지 못한 탓에 우리 군수 공장 한 곳이 무너져 내리는 사고가 발생했습니다"
 indonesia.58.a: "충분히 막을 수 있었다!"
 indonesia.59.t: "파푸아에서의 재난!"
 indonesia.59.d: "서파푸아의 인프라를 제대로 갖추지 못한 탓에 산업 재해가 발생하여 여러 군수 생산 시설이 피해를 입었습니다"
 indonesia.59.a: "충분히 막을 수 있었다!"
 indonesia.61.t: "동 자와에서의 재난!"
 indonesia.61.d: "동자바 주민에 대한 우리의 지원 실패로 인해 기업 사고가 발생하여 사무용 건물 한 곳이 폐쇄되었습니다!"
 indonesia.61.a: "충분히 막을 수 있었다!"
 indonesia.62.t: "수도에서의 재난!"
 indonesia.62.d: "수도가 있는 서자바 주민에 대한 우리의 지원 실패로 인해 산업 공장 한 곳이 무너져 내리는 사고가 발생했습니다"
 indonesia.62.a: "충분히 막을 수 있었다!"
 indonesia.63.t: "하늘에서의 재난!"
 indonesia.63.d: "적절한 항공 장비를 제공하지 못한 탓에 우리 항공편 중 한 대에서 기술적 결함이 발생하여 많은 사람이 목숨을 잃었습니다!"
 indonesia.63.a: "충분히 막을 수 있었다!"
 indonesia.64.t: "수도에서의 재난!"
 indonesia.64.d: "수도가 있는 서자바 주민에 대한 우리의 지원 실패로 인해 여러 산업 공장이 무너져 내리는 사고가 발생했습니다"
 indonesia.64.a: "충분히 막을 수 있었다!"
 indonesia.988.t: "새로운 수도를 위한 준비"
 indonesia.988.d: "일본으로부터 받은 모든 조언과 지원을 바탕으로, 우리는 수도를 자카르타에서 옮기기 위한 준비를 시작하기로 결론을 내렸습니다. 새 수도는 동부 보르네오에 위치할 것이며 건설 계획이 즉시 시작될 것입니다!"
 indonesia.988.a: "계속 나아가자"
 indonesia.888.t: "새로운 실크로드"
 indonesia.888.d: "중국과의 최근 회담이 방금 종료되었습니다. 그들은 우리의 협력 관계와, 단기간에 인도네시아의 산업을 무에서 유로 끌어올린 역량을 칭찬했습니다. 아직 할 일이 많지만 중국 주석들은 우리나라를 칭찬하며 우리에게 \\"21세기 실크로드\\"라는 칭호를 붙였습니다."
 indonesia.888.a: "매우 자랑스럽군"
