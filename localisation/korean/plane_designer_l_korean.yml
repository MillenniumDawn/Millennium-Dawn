 spec_countermeasures_5: "초첨단 레이저 하드킬 체계"
 spec_countermeasures_5_desc: "모든 미사일 위협으로부터 보호하는 하드킬 대응 수단입니다.\n\n§G설계 힌트: 항공기의 방공 능력치를 전반적으로 높이고 레이더 우위도 높입니다. 항공기에는 특히 스텔스 모듈이 없는 경우 최소한 하나의 대응 수단 모듈을 장착하는 것이 권장됩니다.§!"
