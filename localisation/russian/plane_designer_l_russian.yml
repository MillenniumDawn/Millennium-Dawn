 gen_7_light: "Лёгкий самолёт 7-го поколения"
 gen_7_light_desc: "Самолеты 7-го поколения — это сверхсовременные экспериментальные технологии воздушного боя. Их проектирование и производство обходятся дорого, и они включают в себя передовые стелс-материалы, авионику, беспилотных пилотов, высокоточные системы вооружения и многое другое."
 gen_8_light: "Лёгкий самолёт 8-го поколения"
 gen_8_light_desc: "Самолеты 8-го поколения представляют собой передовые экспериментальные технологии воздушного боя. Их проектирование и производство обходятся дорого, и они включают в себя передовые стелс-материалы, авионику, беспилотных летательных аппаратов-ведомых, высокоточные системы вооружения и многое другое."
