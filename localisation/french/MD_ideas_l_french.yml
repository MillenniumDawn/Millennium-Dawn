 corruption_decreased_adm_spending: "Gestion administrative corrompue"
 corruption_decreased_adm_spending_desc: "L'administration de notre gouvernement est corrompue, mais cela nous permet de « réduire » certaines dépenses de côté."
 corruption_decreased_police_spending: "Administration policière corrompue"
 corruption_decreased_police_spending_desc: "Quelques changements dans le système devraient permettre à notre police de fonctionner avec un budget plus petit, ce qui nous donnerait plus de marge de manœuvre pour faire ce que nous voulons."
 corruption_decreased_mil_spending: "Gestion du complexe de défense corrompue"
 corruption_decreased_mil_spending_desc: "Des personnes bien placées aux postes de pouvoir dans notre industrie de défense nous permettront de négocier des conditions plus favorables."
 corruption_decreased_edu_spending: "Gestion de l'éducation corrompue"
 corruption_decreased_edu_spending_desc: "L'éducation n'est qu'un outil pour le gouvernement. Il est temps d'exploiter cet outil et de récupérer une partie de l'argent que nous avons gaspillé dans ce domaine."
 corruption_decreased_health_spending: "Gestion des services de santé corrompue"
 corruption_decreased_health_spending_desc: "De toute façon, les soins de santé sont une chaîne de Ponzi."
 corruption_decreased_social_spending: "Gestion des services sociaux corrompue"
 corruption_decreased_social_spending_desc: "Aide sociale? Ils n'ont pas besoin d'une aide sociale efficace, il est temps de réduire les financements!"
 corruption_civ_construction: "Projets de construction civile"
 corruption_civ_construction_desc: "Supprimer certaines formalités administratives et regarder ailleurs devrait permettre la construction de bâtiments qui n'auraient pas dû l'être."
 corruption_mil_construction: "Projets de construction militaire"
 corruption_mil_construction_desc: "Nous devrions lancer davantage de fabrication militaire et peut-être la donner à un ami ou deux."
 corruption_construction_buff_idea: "Projets de construction"
 corruption_military_prod_buff_idea: "Projets de production militaire"
 corruption_resource_buff_idea: "Projets d'exportation de ressources"
 post_war_recovery_effort: "Effort de redressement d'après-guerre"
 fuel_structure_building_efforts: "Assurer une réserve nationale de carburant"
 civil_war_disorganised_military_1: "Militaires incontrôlables"
 civil_war_disorganised_military_1_desc: "The start of the civil war has left us out of contact with our military. We are not sure who is on whose side, where our supply depots are located or who even supplies weapons to us anymore.\n\n§RWhen this national spirit expires, the situation will improve slightly.§!\n\nCurrent military status:\n§YUncontrolled§!\nChaotic\nConfused\nDisorganised\nDisorderly"
 civil_war_disorganised_military_2: "Militaires chaotiques"
 civil_war_disorganised_military_2_desc: "Même si nous nous sommes remis du choc initial de la guerre civile, la situation reste assez chaotique, avec des chaînes de commandement confuses et une logistique mal gérée.\n\n§RLorsque cette idée expirera, la situation s'améliorera légèrement.§!\n\nStatut militaire actuel:\nIncontrôlable\n§YChaotique§!\nConfus\nDisorganisé\nDésordonné"
 civil_war_disorganised_military_3: "Militaires confus"
 civil_war_disorganised_military_3_desc: "Nous avons organisé nos forces armées en quelque chose de plus qu'un simple groupe hétéroclite de volontaires. Cependant, le leadership fait toujours défaut et nos militaires ont tendance à agir sans stratégie ni objectifs majeurs.\n\n§RLorsque cette idée expirera, la situation s'améliorera légèrement.§!\n\nStatut militaire actuel:\nIncontrôlable\nChaotique\n§YConfus§!\nDisorganisé\nDésordonné"
 civil_war_disorganised_military_4: "Militaires désorganisés"
 civil_war_disorganised_military_4_desc: "Le pire de la confusion initiale s'est dissipé et notre armée agit désormais comme une véritable armée.\n\n§RLorsque cette idée expirera, la situation s'améliorera légèrement.§!\n\nStatut militaire actuel:\nIncontrôlable\nChaotique\nConfus\n§YDisorganisé§!\nDésordonné"
 civil_war_disorganised_military_5: "Militaires désordonnés"
 civil_war_disorganised_military_5_desc: "Notre armée a presque retrouvé son statut professionnel d'avant la guerre civile. Le plus grand défi à l'heure actuelle consiste à combiner et à intégrer toutes les différentes milices que nous avons rassemblées en cours de route.\n\n§RLorsque cette idée expirera, la situation s'améliorera légèrement.§!\n\nStatut militaire actuel:\nIncontrôlable\nChaotique\nConfus\nDisorganisé\n§YDésordonné§!"
 generic_increased_military_support: "Soutien militaire renforcé"
 full_control_of_hormuz_idea_TT: "Revenu supplémentaire: $§G0.800§!"
 idea_generic_reaching_to_the_global_market: "Atteindre le marché mondial"
 idea_generic_reaching_to_the_global_market_desc: "S'adresser au marché mondial et rendre nos investissements plus rentables et plus rapides ne fera qu'apporter plus de profits à notre nation."
 idea_generic_the_manpower_solution: "La solution de main d'œuvre"
 idea_generic_the_manpower_solution_desc: "If we can encourage more people into our workforce, we can have all of the country's economic sectors improved."
 idea_generic_worker_productivity: "Productivité par habitant améliorée"
 idea_generic_worker_productivity_desc: "Nos travailleurs sont extrêmement productifs et, grâce aux récentes améliorations technologiques, nous devrions continuer à encourager ce changement et ce pivot dans notre pays."
 MNC_city_of_casino: "La ville du casino pour les riches"
 MNC_city_of_casino_desc: "Monaco est affectueusement surnommée en Europe la « ville des casinos » en raison de ses nombreux casinos. En particulier, les casinos de Monaco s'adressent aux riches, tandis que la ville est un terrain de jeu pour les milliardaires et les riches."
 naval_power_of_the_continent: "Puissance navale du continent"
 naval_power_of_the_continent_desc: "Nous possédons la plus grande puissance navale de notre continent et nous représentons actuellement la plus grande puissance navale de notre continent. Quelqu’un peut nous dépasser en supposant sa §Yeffectif naval déployé§! est plus grand que le nôtre."
 OAU_member: "Membre de l'Organisation de l'Unité Africaine"
 OAU_member_desc: "L'Organisation de l'unité africaine (OUA) a été fondée en 1963 par les pays africains alors indépendants. L'objectif de l'organisation était d'encourager l'intégration politique et économique de l'Afrique et de lutter contre le colonialisme et le néocolonialisme. Cependant, l'organisation est restée essentiellement un \"centre de discussion\", car aucun département militaire, judiciaire ou politique commun n'a été établi entre les États. En 1999, sous l'impulsion du dirigeant libyen Mouammar Kadhafi, les membres de l'OUA ont signé la déclaration de Syrte, avec l'intention de remplacer l'OUA par l'Union Africaine d'ici 2002, afin de créer enfin une organisation capable d'unifier le continent africain."
 SHA_libyan_education: "Éducation libyenne"
 SHA_libyan_education_desc: "La Libye est un ardent défenseur de l'indépendance sahraouie depuis les années 1980. L'une des principales façons dont la Libye soutient le Front Polisario est de fournir une éducation à de nombreux jeunes sahraouis. Cela permet à notre peuple d'accéder à l'éducation que les marocains nous refusent."
 idea_overlord_subsidies: "Subventions du suzerain"
 idea_overlord_subsidies_desc: "The subsidies our overlord is providing us for our economic benefit are causing us to slowly lose our autonomy as we become slowly more reliant on them for our economy."
 SUD_humiliated_army: "Armée humiliée"
 SUD_humiliated_army_desc: "The recent raid by Darfuri rebels at El Fasher has been a major military and psychological hit to the Sudanese Army. A much smaller group of rebels managed to destroy several aircraft, kill multiple soldiers and capture a major general who was a commander of an air base. It will take time before the army can recover from this."
 CHI_highspeed_railway_construction: "Construction d'une ligne ferroviaire à grande vitesse en Chine"
 CHI_highspeed_railway_construction_desc: "La Chine est une région très peuplée et les déplacements sont fréquents. La demande de trains à grande vitesse est donc très forte. Le développement de ces trains améliorera considérablement les conditions de transport du pays."
 idea_focus_import_additional_military_equipment: "Importer du matériel militaire supplémentaire"
 idea_focus_import_additional_military_equipment_desc: "Il est temps de commencer à importer du matériel militaire supplémentaire, sinon nous serons vaincus sur le champ de bataille à cause d'un manque d'équipement."
 political_power_bonus_desc: "Des améliorations spécifiques et une réduction des formalités administratives permettront à l’administration de prendre des décisions politiques supplémentaires et de modifier la législation."
 CIS_member_state_idea: "Membre de la CEI"
 CIS_member_state_idea_desc: "The Commonwealth of Independent States (CIS) is a regional intergovernmental organization in Eurasia. It was formed following the dissolution of the Soviet Union in 1991. It covers an area of 20,368,759 km2 and has an estimated population of 246,200,194. The CIS encourages cooperation in economic, political, and military affairs and has certain powers relating to the coordination of trade, finance, lawmaking, and security, including cross-border crime prevention."
