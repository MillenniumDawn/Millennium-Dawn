 JAP_diplomacy.11.t: "Запрос США о переинтерпретации статьи 9"
 JAP_diplomacy.11.d: "Правительство Соединённых Штатов обратилось к нам с официальным запросом о дальнейшем переинтерпретировании статьи 9 нашей Конституции. Вашингтон утверждает, что региональная безопасность ухудшилась настолько, что Япония должна взять на себя большую долю коллективной обороны. Принятие их запроса откроет дверь для более широкого понимания самообороны и более тесного военного сотрудничества, но это не обойдётся без внутренней полемики."
 JAP_diplomacy.11.a: "Принять запрос США"
 JAP_diplomacy.11.b: "Мы не можем принять этот запрос"
 JAP_diplomacy.12.t: "Япония отказывается переинтерпретировать статью 9"
 JAP_diplomacy.12.d: "Токио сообщил нам, что в настоящее время не готов к дальнейшей переинтерпретации статьи 9. Опасения по поводу общественного мнения, конституционных ограничений и политической стабильности привели японское правительство к отказу. Теперь нам нужно решить, уважать ли их решение или усилить дипломатическое и военное давление."
 JAP_diplomacy.12.a: "Уважим их решение"
 JAP_diplomacy.12.b: "Увеличим давление на Японию"
 JAP_diplomacy.13.t: "Япония соглашается на переинтерпретацию статьи 9"
 JAP_diplomacy.13.d: "Токио заявил о своей поддержке изменения уровня толкования статьи 9 и о намерении стать более активным партнером в сфере обороны."
 JAP_diplomacy.13.a: "Наконец-то"
 JAP_diplomacy.14.t: "Давление США на статью 9"
 JAP_diplomacy.14.d: "После нашего отказа расширить толкование статьи 9 Соединённые Штаты тихо начали усиливать дипломатическое и военное давление на наше правительство. Альянсные консультации, брифинги в СМИ и закулисные послания говорят об одном и том же: Вашингтон ожидает, что Япония возьмёт на себя больше ответственности. Мы можем стоять твёрдо или тихо скорректировать свою позицию."
 JAP_diplomacy.14.a: "Мы будем стоять твёрдо"
 JAP_diplomacy.14.b: "Тихо скорректируем позицию"
 JAP_diplomacy.15.t: "Япония принимает под давлением"
 JAP_diplomacy.15.d: "После периода обострённого дипломатического и стратегического давления Токио сообщил, что готов сблизиться с нашей позицией по статье 9. При этом публично утверждая, что пацифистские принципы Японии остаются неизменными, правительство теперь расширило толкование самообороны в соответствии с нашими ожиданиями."
 JAP_diplomacy.15.a: "Отлично"
 JAP_diplomacy.17.t: "Тарифы США на японские товары"
 JAP_diplomacy.17.d: "Соединённые Штаты объявили новый пакет тарифов, нацеленных на ключевой японский экспорт, ссылаясь на экономические дисбалансы и внутреннее политическое давление. Меры подаются как способ «выравнять условия», но в Токио это широко рассматривается как политически мотивированный шаг, который обострит как нашу экономику, так и более широкий альянс."
 JAP_diplomacy.17.a: "Нам придётся адаптироваться к этой новой реальности"
 JAP_diplomacy.18.t: "Япония просит отмены тарифов"
 JAP_diplomacy.18.d: "Токио официально попросил нас снять тарифы, введённые в отношении японских товаров. Японские представители намекают, что правительство может быть готово углубить сотрудничество в сфере безопасности и продвинуться дальше в оборонной политике в обмен. Мы должны решить, превратить ли этот экономический спор в стратегическую возможность или сохранить давление."
 JAP_diplomacy.18.a: "Снять тарифы в обмен на безопасность"
 JAP_diplomacy.18.b: "Отказать и оставить тарифы"
 JAP_diplomacy.19.t: "Тарифы сняты, требуются уступки по безопасности"
 JAP_diplomacy.19.d: "Соединённые Штаты согласились снять тарифы на японский экспорт, но только в рамках более широкого понимания по безопасности и обороне. На практике это означает, что Япония ожидает дальнейшего расширения толкования статьи 9, углубления военного сотрудничества с Вашингтоном и принятия большей роли в региональной безопасности."
 JAP_diplomacy.19.a: "Ради экономики и альянса мы примем это бремя"
 JAP_diplomacy.20.t: "США отказываются снять тарифы"
 JAP_diplomacy.20.d: "Наш официальный запрос об отмене тарифов США был отклонён. Вашингтон утверждает, что меры останутся в силе, ссылаясь на внутреннее политическое давление и неразрешённые разногласия по безопасности. Внутри страны растёт недовольство экспортёров и бизнес-лидеров, а стратеги предупреждают, что спор может ещё больше осложнить альянс."
 JAP_diplomacy.20.a: "Пока придётся вытерпеть давление"
 JAP_diplomacy.21.t: "Япония просит возобновления гарантий безопасности"
 JAP_diplomacy.21.d: "Японское правительство официально запросило возобновление или усиление гарантий безопасности от Соединённых Штатов. Токио утверждает, что региональная ситуация ухудшилась и что более чёткие обязательства США помогут стабилизировать положение. В частной беседе японские чиновники признают, что дальнейшие изменения толкования статьи 9 возможны, если Вашингтон готов дать явные гарантии."
 JAP_diplomacy.21.a: "Восстановить гарантии в обмен на более глубокие обязательства"
 JAP_diplomacy.21.b: "Отказать в продлении гарантий"
 JAP_diplomacy.22.t: "Гарантии безопасности восстановлены"
 JAP_diplomacy.22.d: "Соединённые Штаты согласились возобновить и уточнить свои гарантии безопасности Японии. В обмен Вашингтон ожидает, что Токио сделает дополнительные шаги по расширению толкования статьи 9 и возьмёт на себя большую долю региональной безопасности. Альянс становится сильнее, но внутренняя дискуссия о наших пацифистских принципах усилится."
 JAP_diplomacy.22.a: "Ради безопасности мы примем это обязательство"
 JAP_diplomacy.23.t: "США отказываются от более сильных гарантий"
 JAP_diplomacy.23.d: "Наш запрос о возобновлении или усилении гарантий безопасности был отклонён. Соединённые Штаты настаивают, что существующие договорённости достаточны и что внутренние политические ограничения не позволяют идти дальше. Внутри Японии этот отказ подпитает опасения по поводу нашей долгосрочной безопасности и надёжности альянса."
 JAP_diplomacy.23.a: "Тогда нам нужно пересмотреть собственный путь"
 JAP_diplomacy.24.t: "Япония просит прекратить морское давление США"
 JAP_diplomacy.24.d: "Токио официально запросил у нас сокращение или прекращение усиленного морского присутствия и давления вокруг ключевых морских путей и узлов. Японские официальные лица утверждают, что нынешняя позиция рискует эскалацией и подрывает внутреннюю поддержку альянса. В частном порядке они сообщают, что дальнейшие изменения толкования статьи 9 возможны, если мы ослабим свою позицию."
 JAP_diplomacy.24.a: "Прекратить морское давление в обмен на безопасность"
 JAP_diplomacy.24.b: "Сохранить наше давление вокруг Японии"
 JAP_diplomacy.25.t: "Морское давление ослаблено, обязательства углублены"
 JAP_diplomacy.25.d: "Соединённые Штаты согласились ослабить своё усиленное морское присутствие вокруг наших морских путей в обмен на более глубокие обязательства Японии по безопасности. На практике это означает ещё один шаг в расширении толкования статьи 9 и увеличении нашей роли в региональной безопасности. Альянс кажется сильнее, но внутренняя дискуссия о нашем пацифистском облике станет только жестче."
 JAP_diplomacy.25.a: "Ради стабильности мы соблюдём эту сделку"
 JAP_diplomacy.26.t: "США отказываются прекратить морское давление"
 JAP_diplomacy.26.d: "Наш запрос на ослабление или прекращение усиленного присутствия ВМС США вокруг наших морских путей был отклонён. Вашингтон настаивает, что нынешняя позиция необходима в свете региональных угроз. Дома этот отказ усилит как страхи вовлечения в более широкий конфликт, так и призывы ещё сильнее укрепить собственную оборону."
 JAP_diplomacy.26.a: "Тогда нам придётся адаптироваться под давлением"
 JAP_diplomacy.28.t: "Проблемы проектирования лунной «Кагуя»"
 JAP_diplomacy.28.d: "Амбициозная лунная миссия «Кагуя» сталкивается с серьёзными проблемами проектирования. Ключевые системы оказываются сложнее, чем ожидалось, от наведения и управления питанием до тепловой защиты. Инженеры утверждают, что дополнительные финансирование и время позволят переработать критические компоненты и повысить надёжность, но стоимость этого уже вызывает вопросы в кабинете министров."
 JAP_diplomacy.28.a: "Вложимся в перепроектирование и сохраним график"
 JAP_diplomacy.28.b: "Держим расходы под контролем и принимаем более длинный срок"
 JAP_diplomacy.29.t: "Уязвимости связи «Кагуя»"
 JAP_diplomacy.29.d: "По мере продолжения испытаний программа «Кагуя» выявляет слабые места в глубоко космических коммуникациях и каналах передачи данных. Целостность сигнала, пропускная способность и устойчивость к помехам все ниже целевых показателей. Специалисты предлагают новые антенны, модернизированные наземные станции и более надёжное шифрование, но эти улучшения потребуют дополнительных политических и финансовых ресурсов."
 JAP_diplomacy.29.a: "Модернизировать коммуникационную архитектуру"
 JAP_diplomacy.29.b: "Продолжить со старой системой и надеяться на лучшее"
 JAP_diplomacy.30.t: "Новые задержки миссии «Кагуя»"
 JAP_diplomacy.30.d: "Технические неурядицы, проблемы интеграции и конфликтующие сроки запуска инфраструктуры снова заставили отложить лунную миссию «Кагуя». Хотя основные системы остаются многообещающими, проект всё больше воспринимается как медленный и проблемный. Учёные настаивают, что терпение окупится, но внимание публики начинает ослабевать."
 JAP_diplomacy.30.a: "Принять задержку и двигаться к Луне"
 JAP_diplomacy.31.t: "«Кагуя» достигает лунной поверхности"
 JAP_diplomacy.31.d: "После лет доработок проекта, модернизации связи и трудных задержек миссия «Кагуя» наконец добилась успеха. Японское оборудование теперь работает на поверхности и вокруг Луны, передавая высококачественные изображения и бесценные научные данные. Это достижение демонстрирует высокотехнологические возможности Японии и открывает новые пути для развития спутников, дальнего космоса и стратегических космических приложений."
 JAP_diplomacy.31.a: "Отпразднуем «Кагую» как триумф японских технологий"
 jap_kaguya_satellite_invest_tt: "§GПотому что мы вложились в лучший дизайн корабля, мы получили:§!"
 jap_kaguya_rocketry_invest_tt: "§GПотому что мы вложились в лучшую связь с кораблём, мы получили:§!"
 JAP_diplomacy.32.t: "Аномалия программного обеспечения наведения"
 JAP_diplomacy.32.d: "Инженеры марсианской миссии сообщают о повторяющейся аномалии в программном обеспечении наведения. Хотя проблема пока не критична, она может перерасти в серьёзные ошибки навигации, если её не устранить. Тщательное исправление потребует ресурсов с других проектов и может повлиять на общий график."
 JAP_diplomacy.32.a: "Перенаправить ресурсы и решить это правильно"
 JAP_diplomacy.32.b: "Принять задержки и исправлять постепенно"
 JAP_diplomacy.33.t: "Название марсианской колонии"
 JAP_diplomacy.33.d: "Япония обеспечила постоянный плацдарм на Марсе. С вводом в строй модулей обитания и поселением первых долгосрочных экипажей наступает символическое решение: официальное имя и характер колонии."
 JAP_diplomacy.33.a: "«Аматэрасу», сияющий символ единства"
 JAP_diplomacy.33.b: "«Кагуцучи», пылающая индустриальная кузница"
 JAP_diplomacy.33.c: "«Цукуёми», спокойная обсерватория во тьме"
 JAP_diplomacy.33.e: "«Сусаноо», штурмовой боевой форпост"
 JAP_diplomacy.68.t: "Япония требует Сахалин"
 JAP_diplomacy.68.d: "Япония предъявила формальное требование о возвращении Сахалина. Принятие снизит напряжение, но будет воспринято как унизительная уступка."
 JAP_diplomacy.68.a: "Принять требование"
 JAP_diplomacy.68.b: "Отказать решительно"
 JAP_diplomacy.69.t: "Сахалин возвращён"
 JAP_diplomacy.69.d: "Москва приняла наше требование. Сахалин теперь находится под японской администрацией. Правительство представит это как доказательство возвращения имперского порядка."
 JAP_diplomacy.69.a: "Историческая корректировка"
 JAP_diplomacy.70.t: "Россия отказывается"
 JAP_diplomacy.70.d: "Москва отказалась выполнить наше требование по Сахалину. Мы можем проглотить обиду, испытать Россию ограниченным пограничным конфликтом или перейти к полной войне."
 JAP_diplomacy.70.a: "Пока отступить"
 JAP_diplomacy.70.b: "Развязать пограничную войну"
 JAP_diplomacy.70.c: "Объявить тотальную войну"
 JAP_diplomacy.71.t: "Япония требует Северные Курилы"
 JAP_diplomacy.71.d: "Япония предъявила формальное требование о возвращении Северных Курил. Принятие снизит напряжение, но будет воспринято как унизительная уступка."
 JAP_diplomacy.71.a: "Принять требование"
 JAP_diplomacy.71.b: "Отказать решительно"
 JAP_diplomacy.72.t: "Северные Курилы возвращены"
 JAP_diplomacy.72.d: "Москва приняла наше требование. Северные Курилы теперь находятся под японской администрацией. Правительство представит это как доказательство возвращения имперского порядка."
 JAP_diplomacy.72.a: "Историческая корректировка"
 JAP_diplomacy.73.t: "Россия отказывается"
 JAP_diplomacy.73.d: "Москва отказалась выполнить наше требование по Северным Курилам. Мы можем проглотить обиду, испытать Россию ограниченным пограничным конфликтом или перейти к полной войне."
 JAP_diplomacy.73.a: "Пока отступить"
 JAP_diplomacy.73.b: "Развязать пограничную войну"
 JAP_diplomacy.73.c: "Объявить тотальную войну"
 JAP_diplomacy.74.t: "Япония требует Южные Курилы"
 JAP_diplomacy.74.d: "Япония предъявила формальное требование о возвращении Южных Курил. Принятие снизит напряжение, но будет воспринято как унизительная уступка."
 JAP_diplomacy.74.a: "Принять требование"
 JAP_diplomacy.74.b: "Отказать решительно"
 JAP_diplomacy.75.t: "Южные Курилы возвращены"
 JAP_diplomacy.75.d: "Москва приняла наше требование. Южные Курилы теперь находятся под японской администрацией. Правительство представит это как доказательство возвращения имперского порядка."
 JAP_diplomacy.75.a: "Историческая корректировка"
 JAP_diplomacy.76.t: "Россия отказывается"
 JAP_diplomacy.76.d: "Москва отказалась выполнить наше требование по Южным Курилам. Мы можем проглотить обиду, испытать Россию ограниченным пограничным конфликтом или перейти к полной войне."
 JAP_diplomacy.76.a: "Пока отступить"
 JAP_diplomacy.76.b: "Развязать пограничную войну"
 JAP_diplomacy.76.c: "Объявить тотальную войну"
 JAP_diplomacy.77.t: "Токио предлагает соглашение"
 JAP_diplomacy.77.d: "После того как Курильские острова и Сахалин перешли под контроль Японии, Токио быстро приступил к превращению военных успехов в формальное урегулирование конфликта. Японские дипломаты обратились к Москве с предложением положить конец конфликту, утверждая, что война уже решила этот вопрос и дальнейшие боевые действия лишь отсрочат неизбежное.\nИх предложение предельно простое: мир в обмен на официальное признание Россией контроля Японии над Курильскими островами и Сахалином. По мнению Токио, это практическое соглашение, призванное стабилизировать регион и предотвратить дальнейшую эскалацию войны. Теперь решение за нами. Принять новую реальность и положить конец войне или отклонить предложение и продолжить борьбу."
 JAP_diplomacy.77.a: "Принять соглашение."
 JAP_diplomacy.77.b: "Отклонить. Война продолжается."
 JAP_diplomacy.78.t: "Соглашение принято"
 JAP_diplomacy.78.d: "Предложение принято, и орудия начинают затихать. Приказы отданы на разъединение, дипломатические каналы вновь открываются, и война сводится к набору пунктов и координат.\n\nСеверные острова передаются как цена мира, и каждой стороне теперь предстоит продать результат своей публике. Кампания заканчивается, но память о ней не исчезнет."
 JAP_diplomacy.78.a: "Пусть будет так. Пусть чернила заменят кровь."
 JAP_diplomacy.79.t: "Соглашение отклонено"
 JAP_diplomacy.79.d: "Ответ с другой стороны — твёрдое «нет». Не будет ни подписей, ни признания, ни передышки.\n\nТокио неверно оценило нашу решимость, и конфликт продолжится до тех пор, пока одна сторона не утратит способность сопротивляться. Если мир придёт, он будет навязан."
 JAP_diplomacy.79.a: "Тогда мы сражаемся дальше."
 JAP_diplomacy.80.t: "Москва ищет выход"
 JAP_diplomacy.80.d: "После японских успехов на севере российские дипломаты сигнализируют о готовности закончить бои прежде, чем ситуация станет ещё хуже. Посыл прагматичен: остановить кровотечение, заморозить линии и не допустить, чтобы война поглотила больше ресурсов, чем любая из сторон может оправдать.\n\nПредложение — это прямой мир, обмен продолжающейся эскалации на немедленное прекращение вражды. Нам предстоит решить, принять несовершенное урегулирование или продолжать накапливать преимущество."
 JAP_diplomacy.80.a: "Принять мир."
 JAP_diplomacy.80.b: "Нет. Мы продолжаем."
 JAP_diplomacy.81.t: "Токио принимает мир"
 JAP_diplomacy.81.d: "Япония соглашается на условия, выбрав окончание войны вместо её расширения. Решение непопулярно в частях страны, и цена ощущается дома, когда доверие падает, а общество задаётся вопросом, зачем вообще начался этот конфликт.\n\nБелый мир объявлен, и территориальные уступки оформляются. Поле боя затихает, но политическая цена сохранится."
 JAP_diplomacy.81.a: "Мы проглотим это и вытерпим."
 JAP_diplomacy.82.t: "Токио отказывается"
 JAP_diplomacy.82.d: "Япония отклоняет предложение и даёт понять, что не примет соглашение, написанное из слабости. Бои продолжатся, и ставки с каждой неделей растут.\n\nЕсли мир придёт, его не предложат. Его придётся взять."
 JAP_diplomacy.82.a: "Пусть будет так."
 JAP_unlock_sikhalin_raid_tt: "Открывает возможность §Yрейда сил специального назначения§! в регионе §Y$STATE_691$§!"
 JAP_diplomacy.83.t: "Победа в Южных Курилах"
 JAP_diplomacy.83.d: "Японские войска одержали верх в Южных Курилах, вытеснив российские подразделения и захватив контроль над спорной территорией. Итог мал на карте, но громок по смыслу: Япония может взять то, что считает своим, и удержать под давлением.\n\nФлаг поднят, гарнизон закрепился, и Токио готовит следующий шаг. Москва этого не забудет."
 JAP_diplomacy.83.a: "Обезопасить острова."
 JAP_diplomacy.84.t: "Поражение в Южных Курилах"
 JAP_diplomacy.84.d: "Пограничный бой в Южных Курилах сложился не в нашу пользу. Российское сопротивление удержалось, и наши силы были вынуждены отойти под огнём, оставив вопрос суверенитета нерешённым и наше командование под прицелом.\n\nМы вынесли болезненные уроки. Следующая операция будет лучше спланирована, лучше снабжена и труднее остановима."
 JAP_diplomacy.84.a: "Учиться на поражении."
 JAP_diplomacy.85.t: "Неудача в Южных Курилах"
 JAP_diplomacy.85.d: "Российские войска не смогли удержать Южные Курилы перед решительным японским натиском. Немедленная тактическая потеря остра, а политический знак ещё острее: граница уязвима, и противник готов заплатить, чтобы её изменить.\n\nМоскве придётся решить, эскалировать ли конфликт или принять унизительный новый факт на земле."
 JAP_diplomacy.85.a: "Горький урок."
 JAP_diplomacy.86.t: "Южные Курилы удержаны"
 JAP_diplomacy.86.d: "Российские войска выиграли пограничный бой и закрепили Южные Курилы, отбросив японские части и восстановив контроль по линии. Операция демонстрирует готовность и способность быстро наказать нарушение.\n\nТокио может назвать это временной неудачей, но посыл ясен. Острова не будут сданы дёшево."
 JAP_diplomacy.86.a: "Удержать линию."
 JAP_diplomacy.87.t: "Победа в Северных Курилах"
 JAP_diplomacy.87.d: "Япония добилась прорыва в Северных Курилах, вынудив российские части отступить и оставив острова под нашим контролем. Операция доказывает, что даже отдалённый рельеф можно захватить, когда план, время и решимость совпадают.\n\nОккупация начинается немедленно. Транспорт идёт, укрепления растут, и северный рубеж переписывается действием."
 JAP_diplomacy.87.a: "Укрепиться и готовиться."
 JAP_diplomacy.88.t: "Поражение в Северных Курилах"
 JAP_diplomacy.88.d: "Северные Курилы выдержали нашу атаку. Бой был жесток, условия хуже, и российские силы сумели затормозить наше наступление и вынудить отступление.\n\nМы возвращаемся с опытом, оплаченный кровью и усталостью. В следующий раз мы придём не неподготовленными."
 JAP_diplomacy.88.a: "Мы адаптируемся."
 JAP_diplomacy.89.t: "Потеря в Северных Курилах"
 JAP_diplomacy.89.d: "Россия выбила нас из позиций в Северных Курилах после успешной японской операции. Потеря — не только территориальная, она психологическая: расстояние и погода больше не надёжная защита.\n\nТребуется ответ, но ответный удар несёт свои риски. Ситуация быстро ухудшается."
 JAP_diplomacy.89.a: "Это недопустимо."
 JAP_diplomacy.90.t: "Северные Курилы удержаны"
 JAP_diplomacy.90.d: "Российские силы отразили вторжение и удержали Северные Курилы, отбросив японские подразделения и восстановив контроль в тяжёлых условиях. Оборона закалила доктрину и повысила уверенность у командования.\n\nЕсли Япония хочет эти острова, ей придётся вложить гораздо больше, чем в пограничный бой."
 JAP_diplomacy.90.a: "Сохранять готовность."
 JAP_diplomacy.91.t: "Россия отвечает на Сахалине"
 JAP_diplomacy.91.d: "Японские действия на Сахалине вызвали немедленную реакцию Москвы. Российское руководство оформляет это как прямой вызов суверенитету и даёт понять, что больше не потерпит дальнейших продвижений без последствий.\n\nКризис сейчас разворачивается по двум путям: эскалация в открытую войну или принудительное давление с помощью экономических мер и морских ограничений. В любом случае градус уже выше спокойной дипломатии."
 JAP_diplomacy.91.a: "Это станет войной."
 JAP_diplomacy.91.b: "Удушим их эмбарго и блокадой."
 JAP_diplomacy.92.t: "Россия отвечает на захват Сахалина"
 JAP_diplomacy.92.d: "Сахалин сменил хозяина, и Москве теперь предстоит решить, как ответить на унижение так близко к дому. Война будет дорогой, но отказ от ответа откроет дверь для новых потерь и ослабит авторитет государства.\n\nРоссия может выбрать эскалацию и попытаться силой вернуть утраченный результат или согласиться на временный мир, который остановит бой, но потребует возврата Сахалина. Решение определит следующий этап конфликта."
 JAP_diplomacy.92.a: "Мы вернём это силой."
 JAP_diplomacy.92.b: "Навязать соглашение. Сахалин должен быть возвращён."
 JAP_diplomacy.94.t: "Токио требует протектората"
 JAP_diplomacy.94.d: "Формальная нота приходит из Японии, лишённая дипломатии и тяжёлая намерением. Сеулу предлагается выбор, поданный как стабильность: принять надзор Японии над внешней политикой и безопасностью, выровнять институты по направлению Токио и избежать разрушительного столкновения.\n\nПосыл ясен. Япония больше не просит сотрудничества, она диктует условия. Отказ будет воспринят как неповиновение, а неповиновение вызовет последствия."
 JAP_diplomacy.94.a: "У нас нет выбора, кроме как принять."
 JAP_diplomacy.94.b: "Отказаться. Корея не склонится."
 JAP_diplomacy.95.t: "Южная Корея сдаётся"
 JAP_diplomacy.95.d: "Сеул принимает условия, выбирая выживание вместо суверенитета. Соглашения подписаны под давлением, советники прибывают, и внешняя позиция государства складывается в стратегическую конструкцию Японии.\n\nВойна заканчивается, но начинается другой вид борьбы. Корея остаётся на карте, но её курс уже не свой."
 JAP_diplomacy.95.a: "Установить протекторат."
 JAP_diplomacy.96.t: "Южная Корея бросает вызов Токио"
 JAP_diplomacy.96.d: "Сеул отвергает ультиматум и заявляет, что его суверенитет не на продажу. Отказ превращает кризис из принуждения в конфронтацию, и Токио теперь имеет все основания утверждать, что проблему можно решить только силой.\n\nЕсли Япония хотела подчинения, она получила вызов вместо этого."
 JAP_diplomacy.96.a: "Тогда мы навяжем свою волю."
 JAP_diplomacy.97.t: "Токио выдвигает ультиматум Пхеньяну"
 JAP_diplomacy.97.d: "Япония направила ультиматум Пхеньяну, предлагая будущее сдерживания под надзором или будущее разрушения под бомбами. Условия прямы: уступить внешнюю политику и стратегическую автономию под направление Токио, принять контроль за мерами безопасности и подчиниться структуре, предназначенной не дать Северу снова стать угрозой.\n\nДля режима это унижение. Для Японии это управление риском. Вопрос в том, выберет ли Пхеньян выживание или неповиновение."
 JAP_diplomacy.97.a: "Принять. Сохранить государство любой ценой."
 JAP_diplomacy.97.b: "Отклонить. Мы не поддадимся."
 JAP_diplomacy.98.t: "Пхеньян сдаётся"
 JAP_diplomacy.98.d: "Против ожиданий Север принимает условия. Режим сохраняет свои символы, но свобода действий сломлена: японский надзор переписывает границы, безопасность и внешние связи.\n\nБои прекращаются, и северная половина полуострова становится контролируемым буфером. Угроза нейтрализована, и у Токио появляется рычаг, который ему не легко отпустить."
 JAP_diplomacy.98.a: "Установить протекторат."
 JAP_diplomacy.99.t: "Пхеньян бросает вызов Токио"
 JAP_diplomacy.99.d: "Пхеньян отвергает ультиматум и выбирает неповиновение, рассчитывая, что страх и эскалация защитят режим. Отказ превращает кризис в испытание воли, и Токио теперь имеет оправдание сказать, что Север можно усмирить только силой.\n\nПолуостров готовится к войне. Следующее сообщение будет не заметкой, а огнём."
 JAP_diplomacy.99.a: "Тогда мы сами уничтожим угрозу."
 JAP_diplomacy.101.t: "Токио требует подчинения Тайваня"
 JAP_diplomacy.101.d: "Япония направила в Тайбэй прямой запрос: принять протекторат и передать координацию внешней политики и обороны под надзор Токио или столкнуться с изоляцией и силой. Предложение упаковано как безопасность и стабильность, обещая защиту от внешних угроз в обмен на политическое послушание.\n\nЗа формальным языком скрывается простое сообщение. Остров слишком важен, чтобы оставить его независимым, и Япония намерена решать его будущее."
 JAP_diplomacy.101.a: "Принять условия. Избежать катастрофы."
 JAP_diplomacy.101.b: "Отклонить. Тайвань не подчинится."
 JAP_diplomacy.102.t: "Тайбэй принимает"
 JAP_diplomacy.102.d: "Тайвань принимает ультиматум, выбирая выживание и преемственность вместо открытого конфликта. Новые соглашения привязывают его внешнюю позицию к Японии, советники прибывают, а стратегические решения тихо смещаются в сторону Токио.\n\nВойна заканчивается, но суверенитет сужается до того, что позволяет протекторат. Остров остаётся, но его курс уже не полностью свой."
 JAP_diplomacy.102.a: "Установить протекторат."
 JAP_diplomacy.103.t: "Тайбэй отказывается"
 JAP_diplomacy.103.d: "Тайвань отвергает требование Японии и отказывается обменять автономию на обещание защиты. Решение превращает дипломатическое давление в кризис силы, и Токио теперь имеет основание утверждать, что остров можно обеспечить только завоеванием.\n\nПролив становится разломом. Следующий шаг будет не переговорами, а мобилизацией."
 JAP_diplomacy.103.a: "Тогда мы возьмём то, что нам нужно."
 JAP_diplomacy.105.t: "Токио требует протектората на Филиппинах"
 JAP_diplomacy.105.d: "Япония выдвинула Маниле требование, оставляющее мало места для недоразумений. Принять протекторат, согласовать внешнюю политику и оборонное планирование с Токио и разрешить японский контроль ключевых мер безопасности или столкнуться с последствиями отказа.\n\nПредложение подано как стабильность и защита, но его цель — контроль над морскими путями и воротами между океанами. Филиппины теперь должны выбрать между подчинением и противостоянием."
 JAP_diplomacy.105.a: "Принять. Сохранить нацию от уничтожения."
 JAP_diplomacy.105.b: "Отказаться. Нас не будут править из Токио."
 JAP_diplomacy.106.t: "Манила сдаётся"
 JAP_diplomacy.106.d: "Филиппинское правительство принимает условия Японии. Соглашения подписаны, советники прибывают, а внешняя позиция страны входит в японскую морскую конструкцию.\n\nБои заканчиваются, но цена — суверенитет. Архипелаг остаётся, но стратегические решения будут приниматься при наблюдении Токио."
 JAP_diplomacy.106.a: "Установить протекторат."
 JAP_diplomacy.107.t: "Манила бросает вызов Токио"
 JAP_diplomacy.107.d: "Филиппины отвергают ультиматум и отказываются обменять независимость на обещание защиты. Отказ превращает принуждение Японии в проверку силы, и Токио теперь имеет все оправдания заявить, что архипелаг должен быть обеспечен оружием.\n\nМорские пути сжимаются, флоты начинают демонстрировать мощь, и регион готовится к войне. Следующий шаг не будет дипломатическим."
 JAP_diplomacy.107.a: "Тогда мы захватим архипелаг."
 JAP_diplomacy.109.t: "Ультиматум проливов"
 JAP_diplomacy.109.d: "Японская нота приходит с спокойным тоном неизбежности. Куала-Лумпуру предлагается протекторат, который связывает внешнюю политику и координацию безопасности с направлением Токио, оправдывая это как цену стабильности в регионе, где морские пути и узлы решают выживание.\n\nЭто не просьба. Япония намерена командовать проливом, и от Малакки ожидают подчинения. Согласие обещает защиту, отказ вызывает полный вес морского принуждения."
 JAP_diplomacy.109.a: "Принять. Мы не можем бороться с потоком."
 JAP_diplomacy.109.b: "Отказаться. Наш суверенитет не продаётся."
 JAP_diplomacy.110.t: "Куала-Лумпур преклоняется перед Восходящим Солнцем"
 JAP_diplomacy.110.d: "Малайзия принимает условия, торгуя стратегической независимостью за немедленное выживание. Соглашения подписаны, представительства связи прибывают, и Токио получает ключи от коридоров, соединяющих два океана.\n\nВойна заканчивается, но цена ясна. Малайя остаётся целой, но её внешняя позиция теперь движется в тени Японии."
 JAP_diplomacy.110.a: "Установить протекторат."
 JAP_diplomacy.111.t: "Малайя отвергает Указ о проливах"
 JAP_diplomacy.111.d: "Малайзия отвергает ультиматум и отказывается позволить Токио диктовать своё будущее. Это решение превращает давление Японии в противостояние за самый ценный морской коридор региона.\n\nТокио не потерпит непокорности в проливах. Если Малайя не подчинится по договору, Япония будет добиваться подчинения силой."
 JAP_diplomacy.111.a: "Тогда мы захватим проливы."
 JAP_diplomacy.113.t: "Указ об архипелаге"
 JAP_diplomacy.113.d: "Токио предъявило требование Джакарте, направленное в самое сердце независимости Индонезии. Предложение представляет собой протекторатную структуру, передающую внешнюю политику и стратегическую безопасность под японский контроль, оправдывая это как единственный способ обеспечить стабильность на островных цепях, связывающих два океана.\n\nЯзык вежлив, но намерение абсолютно. Япония хочет видеть индонезийский архипелаг не как суверенного партнёра, а как управляемый коридор. Согласие означает безопасность под тенью, отказ — то, что тень станет бурей."
 JAP_diplomacy.113.a: "Примем. Мы не выдержим морской блокады."
 JAP_diplomacy.113.b: "Откажемся. Индонезия не будет управляемой."
 JAP_diplomacy.114.t: "Джакарта принимает Указ"
 JAP_diplomacy.114.d: "Индонезия принимает условия и подчиняется новой морской реальности. Японские миссии прибывают, чтобы контролировать координацию безопасности, права на базы и внешнее выравнивание, превращая архипелаг в управляемый коридор внутри стратегической сферы Токио.\n\nВойна заканчивается, но независимость сужается до разрешённого. Острова остаются индонезийскими формально, но их курс теперь определяется японской властью."
 JAP_diplomacy.114.a: "Установить протекторат."
 JAP_diplomacy.115.t: "Индонезия бросает вызов Указу об архипелаге"
 JAP_diplomacy.115.d: "Джакарта отвергает требование Японии и отказывается обменять суверенитет на обещания стабильности. Отказ превращает давление в противостояние, и Токио теперь рассматривает независимость Индонезии как препятствие, которое следует устранить, а не как факт, который стоит уважать.\n\nМоря вокруг архипелага накаляются. Если Индонезия не уступит по договору, Япония будет стремиться обеспечить соблюдение силой."
 JAP_diplomacy.115.a: "Тогда мы захватим коридоры."
 JAP_diplomacy.117.t: "Выбор Тонкина"
 JAP_diplomacy.117.d: "Токио предъявило требование Ханою, призванное закрепить Вьетнам в японском морском порядке. Предложение представляет собой протекторат почти что по сути: согласовать внешнюю политику, принять японский контроль за безопасностью и разрешить стратегический доступ, превращающий побережье Вьетнама в продолжение досягаемости Японии.\n\nСообщение преподносится как защита от больших хищников, но это также поводок. Вьетнам должен решить, принять ли выживание в условиях ограничения или сопротивляться и вызвать войну, которая развернётся вдоль его берегов."
 JAP_diplomacy.117.a: "Примем. Пока уступим."
 JAP_diplomacy.117.b: "Откажемся. Вьетнам не будет связан."
 JAP_diplomacy.118.t: "Ханой принимает условия Токио"
 JAP_diplomacy.118.d: "Вьетнам принимает ультиматум. Соглашения подписаны, прибывают офицеры связи, и Япония получает решающее влияние на внешнее выравнивание Вьетнама и его прибрежную безопасность.\n\nВойна заканчивается, но независимость сужается. Вьетнам остаётся, но его стратегическая позиция теперь движется в рамках, написанных в Токио."
 JAP_diplomacy.118.a: "Установить протекторат."
 JAP_diplomacy.119.t: "Ханой отвергает выбор Тонкина"
 JAP_diplomacy.119.d: "Вьетнам отвергает требование Японии и отказывается обменять суверенитет на обещание безопасности. Отказ превращает принуждение в противостояние, и Токио теперь рассматривает Вьетнам как барьер, который следует устранить из своего регионального проекта.\n\nПобережье становится линией фронта. Если Вьетнам не подчинится по договору, Япония будет стремиться добиться подчинения силой."
 JAP_diplomacy.119.a: "Тогда мы займём побережье."
 JAP_diplomacy.121.t: "Ультиматум Меконга"
 JAP_diplomacy.121.d: "Японская делегация прибывает с предложением, которое скорее напоминает вердикт, чем дипломатию. Камбодже предлагают защиту под контролем Токио, с координацией внешней политики и мерами безопасности, включёнными в региональную систему Японии.\n\nПодача — стабильность, инвестиции и безопасность от более сильных соседей. Реальность — подчинение. Пномпень должен выбрать, принять ли охраняемое будущее или рискнуть стать полем боя за отказ."
 JAP_diplomacy.121.a: "Согласиться. Выживание важнее."
 JAP_diplomacy.121.b: "Отказаться. Камбоджа не сдастся."
 JAP_diplomacy.122.t: "Пномпень принимает"
 JAP_diplomacy.122.d: "Камбоджа принимает условия и отдаёт стратегическую автономию, чтобы избежать войны, которую не сможет выиграть. Новые соглашения связывают страну с направлением Японии, и советники Токио быстро закрепляют ключевые министерства и точки доступа.\n\nБои заканчиваются, не успев начаться. Камбоджа остаётся формально суверенной, но её путь теперь ограничен японской мощью."
 JAP_diplomacy.122.a: "Установить протекторат."
 JAP_diplomacy.123.t: "Камбоджа отвергает ультиматум Меконга"
 JAP_diplomacy.123.d: "Пномпень отвергает требование Японии и отказывается сдавать своё будущее под внешнее надзор. Отказ превращает давление в противостояние, и Токио теперь рассматривает Камбоджу как слабое звено, которое нужно привести в порядок.\n\nДипломатия провалилась. Если Камбоджа не примет эту структуру, Япония будет пытаться навязать её силой."
 JAP_diplomacy.123.a: "Тогда мы заставим подчиниться."
 JAP_diplomacy.125.t: "Директива внутренней части Меконга"
 JAP_diplomacy.125.d: "Япония предъявила требование Вьентьяну, направленное на закрепление тихой глубины за берегом. Предложение представляет собой протекторатную структуру, связывающую Лаос со стратегическим направлением Токио и передающую координацию внешней политики и безопасности под японский надзор.\n\nПредложение подаётся как развитие и защита. Смысл ясен: коридоры, реки и границы будут управляться в интересах более широкой сферы Японии. Лаосу нужно решить, принять директиву или рискнуть сопротивлением."
 JAP_diplomacy.125.a: "Согласиться. Мы не можем стоять в одиночку."
 JAP_diplomacy.125.b: "Откажемся. Лаос не будет под диктовку."
 JAP_diplomacy.126.t: "Вьентьян принимает"
 JAP_diplomacy.126.d: "Лаос принимает условия Японии, выбирая выживание и стабильность вместо войны, которую он не потянет. Соглашения подписаны, созданы координационные офисы, и Лаос включается в региональную структуру Токио как контролируемый тыл.\n\nБои заканчиваются, но автономия сжимается. Лаос остаётся, но его стратегические выборы теперь движутся в пределах, установленных Японией."
 JAP_diplomacy.126.a: "Установить протекторат."
 JAP_diplomacy.127.t: "Лаос отвергает директиву"
 JAP_diplomacy.127.d: "Вьентьян отвергает требование Японии и отказывается сдавать своё будущее под внешний надзор. Отказ превращает принуждение в противостояние, и Токио теперь рассматривает Лаос не как партнёра, а как препятствие для контроля коридора.\n\nЕсли Лаос не примет эту структуру по договору, Япония будет стремиться навязать её силой."
 JAP_diplomacy.127.a: "Тогда мы заставим их подчиниться."
 JAP_diplomacy.129.t: "Ультиматум южного якоря"
 JAP_diplomacy.129.d: "Токио предъявило ультиматум Канберре, рассматривая Австралию не как далёкий континент, а как ключевую точку южного Тихого океана. Условия жёсткие: принять протекторат, согласовать внешнюю политику и оборонное планирование с Японией, и разрешить размещение баз и доступ, которые запрут южный Тихий океан в досягаемости Токио.\n\nПредложение замаскировано стабильностью и гарантированной безопасностью. В реальности это стратегическая капитуляция. Австралии нужно решить, принять ли жизнь в японской тени или готовиться оспаривать океан самостоятельно."
 JAP_diplomacy.129.a: "Согласиться. Мы не можем выиграть войну за Тихий океан."
 JAP_diplomacy.129.b: "Отказаться. Австралия не склонится."
 JAP_diplomacy.130.t: "Канберра принимает условия якоря"
 JAP_diplomacy.130.d: "Австралия принимает ультиматум Японии, выбирая немедленное выживание вместо континентальной войны, которую не может себе позволить. Соглашения подписаны, стратегический доступ предоставлен, и Япония получает южный якорь, который позволит доминировать в более широком океане.\n\nПушки затихают, но баланс в Тихом океане меняется за одну ночь. Австралия остаётся на карте, но её стратегические решения теперь движутся в пределах, установленных в Токио."
 JAP_diplomacy.130.a: "Установить протекторат."
 JAP_diplomacy.131.t: "Австралия отвергает ультиматум"
 JAP_diplomacy.131.d: "Канберра отвергает требование Японии и отказывается передать независимость континента иностранному мандату. Отказ превращает давление Токио в прямой вызов, и Япония теперь рассматривает Австралию как последнее препятствие на пути к тихоокеанскому порядку под своим контролем.\n\nБорьба за океан неизбежна. Если Австралия не примет эти рамки по договору, Япония попытается навязать их силой."
 JAP_diplomacy.131.a: "Тогда мы обеспечим юг силой."
 JAP_diplomacy.133.t: "Требование Тасмановой линии"
 JAP_diplomacy.133.d: "Токио предъявило требование Веллингтону, направленное на закрытие последнего открытого фланга в южном Тихом океане. Предложение представляет собой протекторатную структуру, связывающую внешнюю политику и оборонную позицию Новой Зеландии с направлением Японии, оправдывая это как цену стабильности в океане, который перестраивается силой.\n\nЯзык говорит о защите и партнёрстве, но структура — контроль. Новая Зеландия должна выбрать между ограниченным миром в японской тени или войной за независимость через море."
 JAP_diplomacy.133.a: "Согласиться. Мы выдержим и выживем."
 JAP_diplomacy.133.b: "Отказаться. Мы не будем поглощены."
 JAP_diplomacy.134.t: "Веллингтон принимает Тасмановую линию"
 JAP_diplomacy.134.d: "Новая Зеландия принимает условия Японии, меняя стратегическую автономию на прекращение враждебных действий. Соглашения подписаны, обеспечен доступ, и Токио получает надёжный южный форпост для формирования более широкого океана.\n\nВойна заканчивается, но независимость сужается. Новая Зеландия остаётся, но её внешнее положение теперь движется в пределах, очерченных в Токио."
 JAP_diplomacy.134.a: "Установить протекторат."
 JAP_diplomacy.135.t: "Веллингтон отвергает требование"
 JAP_diplomacy.135.d: "Новая Зеландия отвергает ультиматум Японии и отказывается сдавать своё будущее иностранному мандату. Отказ превращает давление в противостояние, и Токио теперь рассматривает независимость Веллингтона как угрозу своему южному периметру.\n\nТихий океан размежёвывается на линии фронта. Если Новая Зеландия не примет эту структуру по договору, Япония попытается навязать её силой."
 JAP_diplomacy.135.a: "Тогда мы займём южный форпост."
 JAP_diplomacy.137.t: "Ультиматум Ираватийских ворот"
 JAP_diplomacy.137.d: "Токио предъявило требование Нейпьидо, направленное на закрепление Мьянмы как сухопутного моста между океанами. Условия представляют собой протекторат: согласовать внешнюю политику с Японией, принять японский надзор за безопасностью и предоставить доступ, необходимый для контроля коридоров от Бенгальского залива до Юго-Восточной Азии.\n\nПредложение преподносится как стабильность и развитие. Правда — стратегический захват. Мьянма должна решить, принять ли контролируемый мир или столкнуться с войной, которая превратит её врата в поля боя."
 JAP_diplomacy.137.a: "Примем. Мы не выдержим этого давления."
 JAP_diplomacy.137.b: "Откажемся. Нас не сведут к коридору."
 JAP_diplomacy.138.t: "Мьянма принимает условия ворот"
 JAP_diplomacy.138.d: "Мьянма принимает ультиматум Японии, обменивая стратегическую автономию на прекращение враждебных действий и обещание порядка. Соглашения подписаны, миссии связи прибывают, и Япония получает решающую роль в внешнем выравнивании Мьянмы и её позиции безопасности.\n\nБои заканчиваются, но цена — суверенитет. Мьянма остаётся, но её врата теперь служат региональной конструкции, написанной в Токио."
 JAP_diplomacy.138.a: "Установить протекторат."
 JAP_diplomacy.139.t: "Мьянма отвергает ультиматум"
 JAP_diplomacy.139.d: "Найпьидо отвергает требование Японии и отказывается сдавать своё будущее под внешний надзор. Отказ превращает давление в противостояние, и Токио теперь считает Мьянму препятствием для контроля коридора, которое нужно привести в порядок.\n\nЕсли Мьянма не примет эти рамки по договору, Япония попытается навязать их силой. Ворота будут взяты под контроль так или иначе."
 JAP_diplomacy.139.a: "Тогда мы займём ворота."
 JAP_diplomacy.141.t: "Ультиматум Северных нагорий"
 JAP_diplomacy.141.d: "Япония направила своё внимание на Качин, суровые северные нагорья, контролирующие перевалы, ресурсы и подходы к более широкой области. Требование Токио подаётся как защита и признание, но структура — это протекторат: согласоваться с Японией во внешних вопросах, принять надзор за безопасностью и позволить стратегический доступ, который закрепляет границу.\n\nДля Качина это выбор между номинальной автономией и реальным уничтожением. Согласие предлагает щит. Отказ приглашает войну, которая будет вестись в горах и деревнях."
 JAP_diplomacy.141.a: "Согласиться. Нам нужен покровитель ради выживания."
 JAP_diplomacy.141.b: "Отказаться. Мы не поменяем одного хозяина на другого."
 JAP_diplomacy.143.t: "Качин принимает японскую защиту"
 JAP_diplomacy.143.d: "Качин принимает условия, выбирая выживание и стабильность вместо боя, который он не сможет выдержать в одиночку. Соглашения подписаны, созданы представительства связи, и Япония получает твёрдую опору в северных нагорьях и их стратегических коридорах.\n\nКонфликт заканчивается, но свобода Качина сокращается до разрешённого. Горы остаются, но их будущее теперь связано с Токио."
 JAP_diplomacy.143.a: "Установить протекторат."
 JAP_diplomacy.144.t: "Качин отвергает ультиматум"
 JAP_diplomacy.144.d: "Качин отвергает требование Японии и отказывается подчиняться внешнему мандату. Отказ превращает принуждение в противостояние, и Токио теперь рассматривает нагорья как проблему безопасности, которую нужно решить силой.\n\nЕсли Качин не примет защиту по договору, Япония установит контроль силой оружия. Горы не останутся нейтральными."
 JAP_diplomacy.144.a: "Тогда мы займём нагорье."
 JAP_diplomacy.145.t: "Требование Шанского коридора"
 JAP_diplomacy.145.d: "Япония направила свои условия властям Уа, нацелившись на пограничные земли, через которые проходят контрабандные пути, горные перевалы и артерии внутренних районов. Предложение представлено как признание и защита, но это протекторат: согласовать внешнюю политику с Токио, принять японский надзор за безопасностью и предоставить доступ для закрепления коридора.\n\nДля Уа выбор жесток. Подчиниться и сохранить местную власть под новой крышей, или отказаться и столкнуться с войной, которая не пожалеет ни гор, ни милиций."
 JAP_diplomacy.145.a: "Примем. Лучше щит, чем уничтожение."
 JAP_diplomacy.145.b: "Откажемся. Мы не будем поглощены."
 JAP_diplomacy.146.t: "Уа принимает японскую защиту"
 JAP_diplomacy.146.d: "Уа принимает условия Японии, меняя стратегическую независимость на выживание и формальное признание под сильным покровителем. Прибывают группы связи, маршруты обеспечиваются, и пограничные земли включаются в региональную структуру Японии.\n\nБоевые действия заканчиваются, но автономия сужается. Уа сохраняет местную власть, но его внешнее направление теперь подчиняется Токио."
 JAP_diplomacy.146.a: "Установить протекторат."
 JAP_diplomacy.147.t: "Уа отвергает требование"
 JAP_diplomacy.147.d: "Уа отвергает ультиматум Японии и отказывается ставить свои территории под иностранный надзор. Отказ превращает давление в противостояние, и Токио теперь рассматривает пограничные земли как неконтролируемый разрыв в своей коридорной стратегии.\n\nЕсли Уа не примет эту структуру по договору, Япония наложит контроль силой. Горы будут оспорены."
 JAP_diplomacy.147.a: "Тогда мы обеспечим коридор."
 JAP_diplomacy.148.t: "Ультиматум Шанских ворот"
 JAP_diplomacy.148.d: "Япония предъявила своё требование властям Южного Шанского государства, нацелившись на нагорные маршруты, соединяющие глубинку с более широкой регионом. Предложение является рамками протектората: согласовать внешние связи с Токио, принять японский надзор за безопасностью и разрешить стратегический доступ для обеспечения дорог, перевалов и путей снабжения.\n\nПредложение обещает защиту и признание. Смысл же — контроль. Южный Шан должен решить, принять ли управляемое будущее под зонтом Японии или рискнуть войной, ведущейся по его холмам и долинам."
 JAP_diplomacy.148.a: "Примем. Мы не можем позволить себе уничтожение."
 JAP_diplomacy.148.b: "Откажемся. Нас не сведут к коридору."
 JAP_diplomacy.149.t: "Южный Шан сдаётся"
 JAP_diplomacy.149.d: "Южное Шанское государство принимает условия Японии. Создаются представительские офисы, маршруты обеспечиваются, и регион включается в стратегию коридора Токио как контролируемые ворота, а не как независимый актор.\n\nБои заканчиваются, но автономия сжимается. Местная власть остаётся, но стратегическое направление теперь отвечает перед Японией."
 JAP_diplomacy.149.a: "Установить протекторат."
 JAP_diplomacy.150.t: "Южный Шан отвергает ультиматум"
 JAP_diplomacy.150.d: "Южное Шанское государство отвергает требование Японии и отказывается ставить своё будущее под иностранный надзор. Отказ превращает давление в противостояние, и Токио теперь рассматривает регион как опасный разрыв в своём стратегическом периметре.\n\nЕсли Южный Шан не примет эту структуру по договору, Япония навяжет её силой. Ворота будут обеспечены."
 JAP_diplomacy.150.a: "Тогда мы займём ворота силой."
 JAP_diplomacy.151.t: "Мандат Салуина"
 JAP_diplomacy.151.d: "Япония обратила взгляд на государство Карен, где речные долины и пограничные маршруты могут открыть или закрыть южные подходы. Требование Токио подано как защита и признание, но это структура протектората: согласовать внешние связи с Японией, принять надзор за безопасностью и предоставить доступ, который закрепит коридор Салуина.\n\nПредложение обещает стабильность в регионе с разрозненной властью. Цена — послушание. Государство Карен должно выбрать между охраняемым миром под зонтом Японии или войной, которая выжжёт его переходы и поселения."
 JAP_diplomacy.151.a: "Принять. Мы доживём до завтра."
 JAP_diplomacy.151.b: "Отказаться. Нас не будут править."
 JAP_diplomacy.152.t: "Государство Карен сдаётся"
 JAP_diplomacy.152.d: "Государство Карен принимает условия Японии, обменивая стратегическую автономию на выживание и прекращение немедленного давления. Прибывают миссии связи, маршруты обеспечиваются, и регион входит в периметр Токио как контролируемый коридор, а не как независимый актор.\n\nКонфликт заканчивается, но границы свободы сжимаются. Власть Карен остаётся местной, но стратегическое направление теперь отвечает перед Японией."
 JAP_diplomacy.152.a: "Установить протекторат."
 JAP_diplomacy.153.t: "Государство Карен отклоняет мандат"
 JAP_diplomacy.153.d: "Государство Карен отвергает требование Японии и отказывается передать своё будущее под иностранный надзор. Отказ превращает принуждение в конфронтацию, и Токио теперь рассматривает переходы Салуина как стратегическую проблему, которую нужно решить силой.\n\nЕсли государство Карен не примет структуру по договору, Япония введёт её оружием. Коридор будет обеспечен."
 JAP_diplomacy.153.a: "Тогда мы займём переходы."
 JAP_diplomacy.154.t: "Требование за якорь Палау"
 JAP_diplomacy.154.d: "Токио направило своё требование на Палау, небольшое государство на большом куске океана. Условия поданы как защита и гарантированное процветание, но это структура протектората: согласовать внешнюю политику с Японией, принять надзор за безопасностью и предоставить права базирования, которые превратят Палау в императорский передовой якорь.\n\nПредложение обещает безопасность от политических и военных штормов. Цена — суверенитет. Палау должно выбрать между подчинением под Восходящим Солнцем и боем, который оно не выдержит против морской мощи великой державы."
 JAP_diplomacy.154.a: "Принять. Лучше протектор, чем могила."
 JAP_diplomacy.154.b: "Отказаться. Мы не уступим свою независимость."
 JAP_diplomacy.155.t: "Палау принимает японскую защиту"
 JAP_diplomacy.155.d: "Палау принимает условия Японии. Соглашения подписаны, доступ предоставлен, и острова становятся дисциплинированным узлом в сети портов и аэродромов Токио.\n\nКризис заканчивается без боя, но перемены реальны. Палау остаётся по названию, но его внешнее направление теперь следует японскому компасу."
 JAP_diplomacy.155.a: "Установить протекторат."
 JAP_diplomacy.156.t: "Палау отвергает требование"
 JAP_diplomacy.156.d: "Палау отвергает японский ультиматум и отказывается обменять суверенитет на обещания защиты. Отказ превращает давление Токио в вопрос силы, и Япония теперь рассматривает острова как незащищённый разрыв в своём океанском периметре.\n\nЕсли Палау не примет структуру по договору, Япония введёт контроль оружием. Якорь будет обеспечен."
 JAP_diplomacy.156.a: "Тогда мы займём якорную стоянку."
 JAP_diplomacy.157.t: "Ультиматум микронезийской цепи"
 JAP_diplomacy.157.d: "Япония выдвинула требование Микронезии, рассматривая острова не как разбросанные общины, а как цепочку опорных точек через центральный Тихий океан. Предложение подано как защита и инвестиции, но структура — это протекторат: согласовать внешнюю политику с Токио, принять надзор за безопасностью и предоставить доступ, который превращает острова в контрольные точки для флота и авиации Японии.\n\nСообщение простое. Эти воды будут организованы под одной властью. Микронезия должна выбрать между управляемым миром под зонтом Японии или столкновением, которое она не сможет выдержать."
 JAP_diplomacy.157.a: "Принять. Мы не можем противостоять приливу."
 JAP_diplomacy.157.b: "Отказаться. Мы не станем аванпостом."
 JAP_diplomacy.158.t: "Микронезия принимает цепочку"
 JAP_diplomacy.158.d: "Микронезия принимает условия Японии. Соглашения подписаны, доступ предоставлен, и острова становятся контролируемым коридором портов, аэродромов и наблюдательных узлов в морском периметре Токио.\n\nКризис заканчивается без боя, но суверенитет сужается. Микронезия остаётся, но её внешнее направление теперь следует японскому стратегическому компасу."
 JAP_diplomacy.158.a: "Установить протекторат."
 JAP_diplomacy.159.t: "Микронезия отвергает ультиматум"
 JAP_diplomacy.159.d: "Микронезия отвергает требование Японии и отказывается передать своё будущее под иностранный надзор. Отказ превращает давление в конфронтацию, и Токио теперь рассматривает цепь островов как разрыв в своей тихоокеанской сети, который нужно закрыть.\n\nЕсли Микронезия не примет структуру по договору, Япония введёт контроль силой. Цепочка будет обеспечена."
 JAP_diplomacy.159.a: "Тогда мы займём эти опорные точки."
 JAP_diplomacy.160.t: "Требование аванпоста Науру"
 JAP_diplomacy.160.d: "Токио направило требование Науру, рассматривая остров как фиксирующий штырь на карте, который всё ещё может обеспечить наблюдение, дозаправку и охват через открытое море. Предложение подано как защита и гарантированная поддержка, но это структура протектората: согласовать внешнюю политику с Японией, принять надзор за безопасностью и предоставить доступ, который превращает Науру в императорский аванпост.\n\nДля Науру выбор суров. Подчиниться и выжить под крылом большей державы или отказаться и рискнуть стать полем боя, подтверждающим правоту Японии."
 JAP_diplomacy.160.a: "Принять. Мы не можем стоять в одиночестве."
 JAP_diplomacy.160.b: "Отказаться. Нас не сведут к промежуточной точке."
 JAP_diplomacy.161.t: "Науру принимает японскую защиту"
 JAP_diplomacy.161.d: "Науру принимает условия Японии. Соглашения подписаны, доступ предоставлен, и остров становится небольшим, но важным узлом в тихоокеанской сети Токио.\n\nКризис заканчивается без боя, но суверенитет сужается. Науру остаётся, но его внешнее направление теперь следует японской стратегической линии."
 JAP_diplomacy.161.a: "Установить протекторат."
 JAP_diplomacy.162.t: "Науру отвергает требование"
 JAP_diplomacy.162.d: "Науру отвергает японский ультиматум и отказывается обменять независимость на обещания защиты. Отказ превращает давление в конфронтацию, и Токио теперь рассматривает остров как незащищённый разрыв в своём океанском периметре.\n\nЕсли Науру не примет структуру по договору, Япония введёт контроль силой. Аванпост будет обеспечен."
 JAP_diplomacy.162.a: "Тогда мы займём остров."
 JAP_diplomacy.163.t: "Ультиматум экваториальной линии"
 JAP_diplomacy.163.d: "Япония выдвинула требование Кирибати, государства, разбросанного по экватору, как метки на карте навигатора. Предложение Токио подано как защита и развитие, но структура — это протекторат: согласовать внешнюю политику с Японией, принять надзор за безопасностью и предоставить доступ, превращающий Кирибати в цепочку контрольных точек для наблюдения и морского охвата.\n\nСообщение простое. В новом тихоокеанском порядке нет пустых пространств. Кирибати должно выбрать между подчинением под зонтом Японии или противостоянием державе, которая намерена владеть морскими путями."
 JAP_diplomacy.163.a: "Принять. Мы не можем противостоять новому хозяину океана."
 JAP_diplomacy.163.b: "Отказаться. Мы не будем поглощены империей."
 JAP_diplomacy.164.t: "Кирибати принимает экваториальную линию"
 JAP_diplomacy.164.d: "Кирибати принимает условия Японии. Соглашения подписаны, доступ предоставлен, и разбросанные атоллы становятся тихим, но ценным элементом тихоокеанской сети Токио.\n\nКризис заканчивается без боя, но суверенитет сужается. Кирибати остаётся, но его внешнее направление теперь следует японскому компасу."
 JAP_diplomacy.164.a: "Установить протекторат."
 JAP_diplomacy.165.t: "Кирибати отвергает ультиматум"
 JAP_diplomacy.165.d: "Кирибати отвергает японский ультиматум и отказывается передать своё будущее под иностранный надзор. Отказ превращает давление в конфронтацию, и Токио теперь рассматривает экваториальную цепь как разрыв в своём морском периметре.\n\nЕсли Кирибати не примет структуру по договору, Япония введёт контроль силой. Линия будет обеспечена."
 JAP_diplomacy.165.a: "Тогда мы займём цепь."
 JAP_diplomacy.166.t: "Требование бастиона атоллов"
 JAP_diplomacy.166.d: "Токио выдвинуло требование Маршалловым островам, рассматривая атоллы как естественные форты, где могут размещаться аэродромы, логистика и средства контроля моря. Предложение подано как защита и гарантированная поддержка, но это структура протектората: согласовать внешнюю политику с Японией, принять надзор за безопасностью и предоставить доступ, который превращает Маршаллы в бастионы центрального тихоокеанского периметра Японии.\n\nСообщение ясно. Эти острова не останутся нейтральными точками на карте. Маршаллы должны выбрать между управляемым миром под зонтом Японии или войной, ведущейся за кораллы и ВПП."
 JAP_diplomacy.166.a: "Принять. Мы не выживем в осаде."
 JAP_diplomacy.166.b: "Отказаться. Мы не станем крепостью для другой державы."
 JAP_diplomacy.167.t: "Маршалловы острова сдаются"
 JAP_diplomacy.167.d: "Маршалловы острова принимают условия Японии. Соглашения подписаны, доступ предоставлен, и атоллы становятся дисциплинированными бастионами в океанской сети Токио.\n\nКризис заканчивается без боя, но суверенитет сужается. Маршаллы остаются, но их внешнее направление теперь следует плану Токио."
 JAP_diplomacy.167.a: "Установить протекторат."
 JAP_diplomacy.168.t: "Маршаллы отвергают требование"
 JAP_diplomacy.168.d: "Маршалловы острова отвергают японский ультиматум и отказываются передать своё будущее под иностранный надзор. Отказ превращает давление в конфронтацию, и Токио теперь рассматривает атоллы как незащищённый разрыв в своей центрально-тихоокеанской линии обороны.\n\nЕсли Маршаллы не примут структуру по договору, Япония введёт контроль силой. Бастионы будут обеспечены."
 JAP_diplomacy.168.a: "Тогда мы займём атоллы."
 JAP_diplomacy.169.t: "Ультиматум рифовой линии"
 JAP_diplomacy.169.d: "Япония предъявила требование Тувалу, тонкой цепочке рифов, которая всё ещё имеет значение в океане, измеряемом дальностью и пунктами дозаправки. Токио предлагает защиту и поддержку, но структура — это протекторат: согласовать внешнюю политику с Японией, принять надзор за безопасностью и предоставить доступ, который превращает Тувалу в контрольную точку в южном периметре Японии.\n\nСообщение жестоко в своей простоте. В оспариваемом Тихом океане не будет нейтральных островов. Тувалу должно выбрать между подчинением под зонтом Японии или противостоянием, которое утопит маленькое государство в войне великих держав."
 JAP_diplomacy.169.a: "Принять. Мы не выдержим шторма стали."
 JAP_diplomacy.169.b: "Отказаться. Мы не отдадим наш флаг."
 JAP_diplomacy.170.t: "Тувалу принимает японскую защиту"
 JAP_diplomacy.170.d: "Тувалу принимает условия Японии. Соглашения подписаны, доступ предоставлен, и острова становятся тихим узлом в морской сети Токио.\n\nКризис заканчивается без боя, но суверенитет сужается. Тувалу остаётся, но его внешнее направление теперь следует плану Токио."
 JAP_diplomacy.170.a: "Установить протекторат."
 JAP_diplomacy.171.t: "Тувалу отвергает ультиматум"
 JAP_diplomacy.171.d: "Тувалу отвергает японский ультиматум и отказывается обменять независимость на обещания защиты. Отказ превращает давление в конфронтацию, и Токио теперь рассматривает рифовую линию как незащищённый разрыв в своей южной цепи.\n\nЕсли Тувалу не примет структуру по договору, Япония введёт контроль силой. Точка будет обеспечена."
 JAP_diplomacy.171.a: "Тогда мы займём острова."
 JAP_diplomacy.172.t: "Ультиматум соломоновой барьеры"
 JAP_diplomacy.172.d: "Токио предъявило требование Соломоновым островам, рассматривая цепь как естественный барьер, который может запечатать юго-западный Тихий океан. Предложение подано как защита и развитие, но структура — это протекторат: согласовать внешнюю политику с Японией, принять надзор за безопасностью и предоставить базы, которые превратят Соломоны в укреплённый экран морского периметра Японии.\n\nСообщение ясно. Эти острова либо будут служить порядку Японии, либо будут рассматриваться как вражеский плацдарм. Соломоны должны выбрать между подчинением под Восходящим Солнцем или войной, ведущейся через джунгли, аэродромы и узкие моря."
 JAP_diplomacy.172.a: "Принять. Мы не выживем под блокадой."
 JAP_diplomacy.172.b: "Отказаться. Мы не станем крепостью для другой империи."
 JAP_diplomacy.173.t: "Соломоны сдаются"
 JAP_diplomacy.173.d: "Соломоновы острова принимают условия Японии. Соглашения подписаны, доступ предоставлен, и цепь становится дисциплинированным барьером портов, аэродромов и патрульных зон под руководством Токио.\n\nКризис заканчивается без боя, но суверенитет сужается. Соломоны остаются, но их внешнее выравнивание теперь следует плану Токио."
 JAP_diplomacy.173.a: "Установить протекторат."
 JAP_diplomacy.174.t: "Соломоны отвергают ультиматум"
 JAP_diplomacy.174.d: "Соломоновы острова отвергают требование Японии и отказываются передать своё будущее под иностранный надзор. Отказ превращает давление в конфронтацию, и Токио теперь рассматривает цепь как опасный разрыв в своей юго-западной тихоокеанской сети.\n\nЕсли Соломоны не примут структуру по договору, Япония введёт контроль силой. Барьер будет обеспечен."
 JAP_diplomacy.174.a: "Тогда мы займём цепь."
 JAP_diplomacy.175.t: "Ультиматум бастиона Новой Гвинеи"
 JAP_diplomacy.175.d: "Япония предъявила требование Папуа-Новой Гвинее, рассматривая остров как континентальный бастион, который может доминировать на подходах между Юго-Восточной Азией и Тихим океаном. Предложение подано как защита и гарантированная поддержка, но это структура протектората: согласовать внешнюю политику с Японией, принять надзор за безопасностью и предоставить базы, которые превратят Новую Гвинею в крепость воздушной мощи, логистики и передовой обороны.\n\nПосыл оставляет мало сомнений. Япония намерена закрепить здесь южный театр. Папуа-Новая Гвинея должна выбрать между подчинением под щитом Японии или войной, которая превратит её берега и высокогорья в линии фронта."
 JAP_diplomacy.175.a: "Принять. Мы не можем позволить себе стать полем боя."
 JAP_diplomacy.175.b: "Отказаться. Нас не будут делать крепостью для другой державы."
 JAP_diplomacy.176.t: "Порт-Морсби принимает"
 JAP_diplomacy.176.d: "Папуа-Новая Гвинея принимает условия Японии. Соглашения подписаны, доступ предоставлен, и остров становится дисциплинированным бастионом в южном периметре Токио, построенном вокруг аэродромов, портов и логистических узлов.\n\nКризис заканчивается без боя, но суверенитет сужается. Папуа-Новая Гвинея остаётся, но её стратегическое направление теперь следует плану японской крепости."
 JAP_diplomacy.176.a: "Установить протекторат."
 JAP_diplomacy.177.t: "Папуа-Новая Гвинея отвергает ультиматум"
 JAP_diplomacy.177.d: "Папуа-Новая Гвинея отвергает требование Японии и отказывается передать своё будущее под иностранный надзор. Отказ превращает давление в конфронтацию, и Токио теперь рассматривает остров как ключевое препятствие на пути к обеспечению южного театра.\n\nЕсли Папуа-Новая Гвинея не примет структуру по договору, Япония введёт контроль силой. Бастион будет взят."
 JAP_diplomacy.177.a: "Тогда мы займём бастион."
 JAP_diplomacy.178.t: "Требование цепи Южного Тихого океана"
 JAP_diplomacy.178.d: "Токио предъявило требование Вануату, рассматривая острова как ещё одно звено цепи, которое может запечатать юго-западный Тихий океан. Предложение подано как защита и помощь в развитии, но это структура протектората: согласовать внешнюю политику с Японией, принять надзор за безопасностью и предоставить доступ, который превращает Вануату в контрольную точку для патрулей, дозаправки и регионального контроля.\n\nСообщение ясно. Япония строит периметр остров за островом. Вануату должно выбрать между управляемым миром под Восходящим Солнцем или столкновением, которое оно не сможет выдержать."
 JAP_diplomacy.178.a: "Принять. Мы не можем сражаться с империей на море."
 JAP_diplomacy.178.b: "Отказаться. Мы не будем поглощены."
 JAP_diplomacy.179.t: "Вануату принимает японскую защиту"
 JAP_diplomacy.179.d: "Вануату принимает условия Японии. Соглашения подписаны, доступ предоставлен, и острова становятся тихим, но полезным узлом в южном периметре Токио.\n\nКризис заканчивается без боя, но суверенитет сужается. Вануату остаётся, но его внешнее направление теперь следует японской стратегической линии."
 JAP_diplomacy.179.a: "Установить протекторат."
 JAP_diplomacy.180.t: "Вануату отвергает требование"
 JAP_diplomacy.180.d: "Вануату отвергает японский ультиматум и отказывается обменять независимость на обещания защиты. Отказ превращает давление в конфронтацию, и Токио теперь рассматривает острова как незащищённый разрыв в своей юго-западной тихоокеанской цепи.\n\nЕсли Вануату не примет структуру по договору, Япония введёт контроль силой. Звено будет обеспечено."
 JAP_diplomacy.180.a: "Тогда мы займём острова."
 JAP_diplomacy.181.t: "Ультиматум ключевого камня Южного Тихого океана"
 JAP_diplomacy.181.d: "Япония предъявила требование Фиджи, рассматривая острова как узел, который может поддержать флотскую логистику и авиационные операции по широкой дуге Южного Тихого океана. Предложение подано как защита и гарантированная поддержка, но это структура протектората: согласовать внешнюю политику с Японией, принять надзор за безопасностью и предоставить базы, которые превратят Фиджи в ключевой камень южного периметра Японии.\n\nПосыл неоспорим. Япония не ищет друзей, она строит порядок. Фиджи должно выбрать между управляемым миром под зонтом Японии или противостоянием, которое решится морской мощью."
 JAP_diplomacy.181.a: "Принять. Мы не можем позволить себе стать примером."
 JAP_diplomacy.181.b: "Отказаться. Фиджи не подчинится."
 JAP_diplomacy.182.t: "Фиджи принимает условия ключевого камня"
 JAP_diplomacy.182.d: "Фиджи принимает японский ультиматум. Соглашения подписаны, доступ предоставлен, и острова становятся центральным узлом южнотихоокеанской сети Токио из портов, аэродромов и патрульных зон.\n\nКризис заканчивается без боя, но суверенитет сужается. Фиджи остаётся, но его внешнее направление теперь следует плану Токио."
 JAP_diplomacy.182.a: "Установить протекторат."
 JAP_diplomacy.183.t: "Фиджи отвергает ультиматум"
 JAP_diplomacy.183.d: "Фиджи отвергает требование Японии и отказывается передать своё будущее под иностранный надзор. Отказ превращает давление в конфронтацию, и Токио теперь рассматривает острова как последний разрыв в южном периметре, который намерено закрыть.\n\nЕсли Фиджи не примет структуру по договору, Япония введёт контроль силой. Ключевой камень будет обеспечен."
 JAP_diplomacy.183.a: "Тогда мы займём узел."
 JAP_diplomacy.184.t: "Ультиматум самоанской линии"
 JAP_diplomacy.184.d: "Токио предъявило требование Самоа, рассматривая острова как поворотный пункт между центральным Тихим океаном и южными подходами. Предложение подано как защита и гарантированная поддержка, но это структура протектората: согласовать внешнюю политику с Японией, принять надзор за безопасностью и предоставить доступ, превращающий Самоа в контрольную точку в расширяющемся океанском периметре Японии.\n\nСообщение прямое. Япония проводит линии по морю, и Самоа стоит на одной из них. Согласие предлагает безопасность под большей державой, отказ рискует стать уроком, который убедит других."
 JAP_diplomacy.184.a: "Принять. Мы выживем, даже если придётся подчиниться."
 JAP_diplomacy.184.b: "Отказаться. Самоа не склонится."
 JAP_diplomacy.185.t: "Самоа принимает японскую защиту"
 JAP_diplomacy.185.d: "Самоа принимает японский ультиматум. Соглашения подписаны, доступ предоставлен, и острова становятся тихим, но полезным узлом в тихоокеанской сети Токио.\n\nКризис заканчивается без боя, но суверенитет сужается. Самоа остаётся, но его внешнее направление теперь следует японской стратегической линии."
 JAP_diplomacy.185.a: "Установить протекторат."
 JAP_diplomacy.186.t: "Самоа отвергает ультиматум"
 JAP_diplomacy.186.d: "Самоа отвергает требование Японии и отказывается обменять независимость на обещания защиты. Отказ превращает давление в конфронтацию, и Токио теперь рассматривает острова как незащищённый разрыв в своём океанском периметре.\n\nЕсли Самоа не примет структуру по договору, Япония введёт контроль силой. Линия будет обеспечена."
 JAP_diplomacy.186.a: "Тогда мы займём острова."
 JAP_diplomacy.187.t: "Требование тонганской короны"
 JAP_diplomacy.187.d: "Токио предъявило требование Тонге, королевству, чьи гавани и морские пути лежат на южной дуге Тихого океана. Предложение подано как защита и партнёрство, но это структура протектората: согласовать внешнюю политику с Японией, принять надзор за безопасностью и предоставить доступ, который превращает Тонгу в контрольную точку в расширяющемся морском периметре Японии.\n\nСообщение ясно. Япония строит океанский порядок, в котором нет места независимым разворотам. Тонга должна выбрать между охраняемым миром под японской тенью или противостоянием, решаемым флотами."
 JAP_diplomacy.187.a: "Принять. Мы сохраним корону, пусть и под тенью."
 JAP_diplomacy.187.b: "Отказаться. Тонга не подчинится."
 JAP_diplomacy.188.t: "Тонга принимает японскую защиту"
 JAP_diplomacy.188.d: "Тонга принимает условия Японии. Соглашения подписаны, доступ предоставлен, и королевство становится дисциплинированным узлом в южной сети Токио.\n\nКризис заканчивается без боя, но суверенитет сужается. Тонга остаётся, но её внешнее направление теперь следует японской стратегической линии."
 JAP_diplomacy.188.a: "Установить протекторат."
 JAP_diplomacy.189.t: "Тонга отвергает требование"
 JAP_diplomacy.189.d: "Тонга отвергает японский ультиматум и отказывается поставить своё будущее под иностранный надзор. Отказ превращает давление в конфронтацию, и Токио теперь рассматривает королевство как незащищённый разрыв в своей южной дуге.\n\nЕсли Тонга не примет структуру по договору, Япония введёт контроль силой. Точка будет обеспечена."
 JAP_diplomacy.189.a: "Тогда мы займём острова."
 JAP_diplomacy.190.t: "Уведомление Вашингтону: вывод из Тихого океана"
 JAP_diplomacy.190.d: "Токио направило Вашингтону официальное требование о передаче ключевых американских тихоокеанских островов. Посыл прям: иностранные плацдармы в океанском периметре Японии больше не терпимы, и эти форпосты должны быть уступлены, чтобы предотвратить дальнейшую эскалацию.\n\nТребование подано как шанс избежать войны, но это также проверка решимости. Принять и уступить опорные точки власти, или отказаться и рисковать превратить Тихий океан в поле боя между гигантами."
 JAP_diplomacy.190.a: "Принять передачу."
 JAP_diplomacy.190.b: "Отказаться. Тихий океан — не их, чтобы на него претендовать."
 JAP_diplomacy.191.t: "Вашингтон сдаёт форпосты"
 JAP_diplomacy.191.d: "Против ожиданий Соединённые Штаты принимают требование. Острова передаются, базы эвакуируются, и морской периметр Японии расширяется одним ударом.\n\nКризис заканчивается без войны, но смысл ясен. Великая держава отступила, и баланс в Тихом океане смещается в сторону Токио."
 JAP_diplomacy.191.a: "Обезопасить острова."
 JAP_diplomacy.192.t: "Вашингтон отказывается"
 JAP_diplomacy.192.d: "Соединённые Штаты отвергают требование Японии и отказываются уступить свои тихоокеанские плацдармы. Отказ превращает японский ультиматум в прямую конфронтацию держав, и у Японии теперь есть и оправдание, и мотив добиваться форпостов силой.\n\nТихий океан сжимается до линий фронта. Если эти острова не будут переданы по договору, их возьмут войной."
 JAP_diplomacy.192.a: "Тогда мы отнимем их силой."
 JAP_diplomacy.193.t: "Ультиматум Парижу: Тихий океан должен быть очищен"
 JAP_diplomacy.193.d: "Токио направило Парижу официальное требование передать тихоокеанские островные владения Франции. Нота обёрнута в вежливый язык, но её смысл неоспорим: далёкие империи больше не будут держать плацдармы внутри океанского периметра Японии.\n\nЯпония предлагает узкий путь избежать эскалации. Франция может уйти с чернилами и подписями, или отказаться и принять, что спор будет решаться флотами, а не дипломатами."
 JAP_diplomacy.193.a: "Принять передачу."
 JAP_diplomacy.193.b: "Отказаться. Францию не вытолкнут."
 JAP_diplomacy.194.t: "Париж выводит свои силы из Тихого океана"
 JAP_diplomacy.194.d: "Франция принимает требование Японии. Флаги спускают, гарнизоны выводят, и острова переходят под контроль Токио.\n\nКризис заканчивается без войны, но посыл раздаётся по всему миру. Япония не договаривается о сфере, она её обеспечивает."
 JAP_diplomacy.194.a: "Обезопасить острова."
 JAP_diplomacy.195.t: "Париж отказывается"
 JAP_diplomacy.195.d: "Франция отвергает ультиматум Японии и отказывается сдать свои тихоокеанские владения. Отказ превращает требование Токио в прямую конфронтацию, и у Японии теперь есть основание утверждать, что эти острова следует завоевать силой.\n\nОкеан становится уже, когда великие державы сталкиваются. Если Франция не отступит по договору, Япония попытается изгнать её войной."
 JAP_diplomacy.195.a: "Тогда мы займём их."
 JAP_diplomacy.196.t: "Уведомление Лондону: уступить тихоокеанское владение"
 JAP_diplomacy.196.d: "Токио направило Лондону официальное требование передать оставшееся тихоокеанское островное владение Британии. Нота говорит о региональной стабильности и конце далёкого вмешательства, но её цель ясна: Япония намерена очистить океан от чужих флагов, который теперь претендует патрулировать.\n\nБритании предлагают выбор между упорядоченным выводом и ненужной войной вдали от дома. Принять — и дело завершится на бумаге. Отказаться — и Тихий океан станет ещё одним театром, где империи проверяют волю друг друга."
 JAP_diplomacy.196.a: "Принять передачу."
 JAP_diplomacy.196.b: "Отказаться. Британию не выдавят."
 JAP_diplomacy.197.t: "Лондон отступает"
 JAP_diplomacy.197.d: "Соединённое Королевство принимает требование Японии. Территория передаётся, флаг спускается, и Токио добавляет ещё один кусок к своему принудительному морскому периметру.\n\nКризис заканчивается без войны, но символика тяжела. Старая морская держава уступила землю, и притязания Японии на Тихий океан становятся смелее с каждой уступкой."
 JAP_diplomacy.197.a: "Обезопасить территорию."
 JAP_diplomacy.198.t: "Лондон отвергает требование"
 JAP_diplomacy.198.d: "Великобритания отвергает ультиматум Японии и отказывается сдать своё тихоокеанское владение. Отказ превращает требование Токио в прямой вызов, и у Японии теперь есть и мотив, и предлог захватить территорию силой.\n\nДипломатия исчерпала себя. Если Британия не отступит по договору, Япония попытается убрать её войной."
 JAP_diplomacy.198.a: "Тогда мы займём это."
 JAP_diplomacy.199.t: "Японские каналы расширяются в Пхеньяне"
 JAP_diplomacy.199.d: "Японская политика в отношении Севера вступила в новую фазу. Через посредников, разведывательные контакты и тщательно управляемое давление Токио открыло каналы внутри нашей политической среды, которые прежде были ограничены или закрыты.\n\nЭто не означает доверия и не означает согласия. Это означает, что у Японии теперь есть временная возможность влиять на решения, воздействовать на фракции и испытывать нашу решимость как изнутри, так и извне."
 JAP_diplomacy.199.a: "Мы будем внимательно следить за этими каналами."
 JAP_diplomacy.200.t: "Сахалин и Курилы потеряны"
 JAP_diplomacy.200.d: "Российские войска вновь полностью взяли под контроль Сахалин и Курильские острова, отменив все достижения кампании. Операция провалилась, и Токио больше не может поддерживать усилия. Единственный оставшийся вариант — перемирие.\n\nПровал повлечёт за собой последствия. Доверие общественности к военной оценке правительства пошатнулось, и политическая цена этой авантюры будет ощущаться годами."
 JAP_diplomacy.200.a: "У нас нет выбора, кроме как принять поражение."
 JAP_failed_sakhalin_war: "Последствия войны за Сахалин"
 JAP_failed_sakhalin_war_desc: "Провал военной кампании за Сахалин и Курильские острова оставил глубокие шрамы на политической сцене Японии. Доверие к стратегической компетентности правительства подорвано, военный дух пострадал, а дипломатические последствия продолжают ограничивать внешнеполитические возможности Токио."
 JAP_mars_colony1: "Колония Марс «Аматэрасу»"
 JAP_mars_colony1_desc: "Названная в честь Аматэрасу, богини солнца, освещающей небеса, колония Марс «Аматэрасу» стала сияющим символом единства и лидерства Японии. Её присутствие вдохновляет уверенность дома и уважение за рубежом."
 JAP_mars_colony2: "Колония Марс «Кагуцучи»"
 JAP_mars_colony2_desc: "Названная в честь Кагуцучи, бога огня, колония Марс «Кагуцучи» построена вокруг печей, перерабатывающих заводов и тяжёлой промышленности. Её задача понятна: превращать марсианскую руду и энергию в силу для японских заводов."
 JAP_mars_colony3: "Колония Марс «Цукуёми»"
 JAP_mars_colony3_desc: "Названная в честь Цукуёми, бога луны и ночи, колония Марс «Цукуёми» служит тихой обсерваторией и исследовательским комплексом. Из её лабораторий и приборов данные поступают обратно в Японию, углубляя научное понимание."
 JAP_mars_colony4: "Колония Марс «Сусаноо»"
 JAP_mars_colony4_desc: "Названная в честь Сусаноо, бога штормов, колония Марс «Сусаноо» оформлена как суровый форпост на границе. Учебные полигоны и экспериментальные полигоны делают её горнилом для японских вооружённых сил и доктрин."
 JAP_american_pressure_article_nine: "Под давлением американских тарифов"
 JAP_JP_USA_SOFA_1: "Рамочное соглашение SOFA между США и Японией"
 JAP_JP_USA_SOFA_1_desc: "Силы США в Японии действуют в рамках Соглашения о статусе пребывания войск, которое защищает большинство военнослужащих от японских судов и налогов и даёт США широкий контроль над своими базами. Местная полиция, губернаторы и жители вынуждены жить в условиях правил, согласованных в Вашингтоне и Токио, и каждая жалоба на преступление, аварию или шум возле базы проходит через процедуры SOFA, прежде чем Япония может вмешаться."
 JAP_maritime_heavy_industry_corridor: "Коридор морской тяжёлой промышленности"
 JAP_maritime_heavy_industry_corridor_desc: "Япония развивает непрерывный пояс судостроительных предприятий, сталелитейных заводов и морских инженерных фирм вдоль ключевых прибрежных регионов. Концентрация инвестиций в этом коридоре увеличивает возможности по строительству и обслуживанию военных кораблей, подводных лодок и вспомогательных судов, укрепляя промышленный фундамент флота."
 JAP_moon_base_completed: "Лунная база «Кагуя» создана"
 JAP_usa_article_nine_refused: "Изменение толкования статьи 9 отклонено"
 JAP_diplomacy_shortcut: "Дипломатия"
 JAP_political: "Политика"
 JAP_economy: "Экономика"
 JAP_military: "Военное"
 JAP_monarchism: "Монархизм"
 JAP_great_east_japan_earthquake_shortcut: "Великое землетрясение Восточной Японии"
 JAP_article_nine_remove_flag: "Статья 9 была отменена"
 JAP_usa_article_nine_accepted: "Изменение толкования статьи 9 принято"
 JAP_tokyo_startup_special_zone: "Спецзона стартапов Токио"
 JAP_tokyo_startup_special_zone_desc: "Мы сосредоточим усилия по дерегулированию, поддержке венчурного капитала и стимулированию инвестиций в столичном регионе Токио, чтобы способствовать созданию и коммерциализации стартапов."
 JAP_tokyo_startup_special_zone_idea: "Спецзона стартапов Токио"
 JAP_tokyo_startup_special_zone_idea_desc: "Токио был объявлен специальной зоной регуляторных реформ для поддержки стартапов, венчурного капитала и создания новых предприятий. Сосредоточив дерегулирование, доступ к инвестициям и поддержку коммерциализации в столичном регионе, правительство стремится превратить ограниченные реформы в ощутимый двигатель роста."
 JAP_kansai_medical_special_zone: "Медицинская инновационная зона Кансай"
 JAP_kansai_medical_special_zone_desc: "Мы создадим в регионе Кансай специальную зону для инноваций в области медицины, ухода за больными и медико-биологических наук, что позволит ускорить привлечение частных инвестиций и практическую реализацию проектов."
 JAP_kansai_medical_special_zone_idea: "Медицинская инновационная зона Кансай"
 JAP_kansai_medical_special_zone_idea_desc: "Регион Кансай развивается как особая зона для инноваций в области медицины, ухода за больными и медико-биологических наук благодаря гибкому регулированию и целенаправленным инвестициям."
 JAP_kyushu_logistics_special_zone: "Специальная логистическая и портовая зона Кюсю"
 JAP_kyushu_logistics_special_zone_desc: "Мы оптимизируем логистику и портовые процедуры на Кюсю, укрепляя торговые потоки и повышая эффективность региональной промышленности."
 JAP_kyushu_logistics_special_zone_idea: "Специальная логистическая и портовая зона Кюсю"
 JAP_kyushu_logistics_special_zone_idea_desc: "Кюсю был определен как зона логистической и портовой реформы с целью повышения эффективности торговли и региональной взаимосвязи. Упрощенные процедуры, приоритетное развитие инфраструктуры и смягчение регулирования призваны укрепить экспортный потенциал и сделать регион более привлекательной базой для промышленности и торговли."
 JAP_expand_special_zones_nationwide: "Расширить действие специальных зон по всей стране."
 JAP_expand_special_zones_nationwide_desc: "Результаты, достигнутые в отдельных стратегических зонах, будут распространены на всю страну, превратив регуляторную реформу из ограниченного исключения в более широкую основу для экономического роста."
 JAP_tokyo_startup_special_zone_active: "Выполнено §Y$JAP_tokyo_startup_special_zone$§!"
 JAP_kansai_medical_special_zone_active: "Выполнено §Y$JAP_kansai_medical_special_zone$§!"
 JAP_kyushu_logistics_special_zone_active: "Выполнено §Y$JAP_kyushu_logistics_special_zone$§!"
 JAP_expand_special_zones_nationwide_done: "Выполнено §Y$JAP_expand_special_zones_nationwide$§!"
 JAP_japanese_economy_decisions: "Укоренившийся дефицит спроса"
 JAP_japanese_economy_decisions_desc: "Два десятилетия падения цен приучили японские домохозяйства и фирмы ждать. Зарплаты стоят на месте, компании копят деньги вместо того, чтобы вкладывать их, и каждая иена стимулов уходит в сбережения, а не в расходы. Экономика не рушится — она просто отказывается двигаться.\n\n§YЧто можно сделать§!\nРешения ниже — это рычаги спроса. Объявление целевого уровня цен, снижение налога на потребление, прямые выплаты домохозяйствам, финансирование государственных вложений и стимулирование покупок товаров длительного пользования — каждое из них повышает §Yпрогресс восстановления спроса§!. Фокусы ветки спроса открывают эти рычаги, а §Y$JAP_active_public_investment$§! и §Y$JAP_improvement_private_investment_climate$§! добавляют к нему напрямую.\n\n§YПрогресс восстановления спроса§!: [?JAP_demand_recovery_progress|0] / 100\n\n§GПороги§!\n§G30§!: §Y$JAP_entrenched_demand_shortfall_idea_1$§! смягчается до §Y$JAP_entrenched_demand_shortfall_idea_2$§!.\n§G60§!: смягчается ещё раз, до §Y$JAP_entrenched_demand_shortfall_idea_3$§!.\n§G85§!: национальный дух снимается, и экономический рост Японии ускоряется.\n\n§RВнимание§!: этот прогресс никогда не убывает, но и сам по себе не растёт. Не принимайте решений — и Япония останется в застое навсегда."
 JAP_entrenched_demand_shortfall_idea_2: "Медленное восстановление спроса"
 JAP_entrenched_demand_shortfall_idea_2_desc: "Более чёткие целевые показатели цен и поддержка домохозяйств вывели экономику из её худшей фазы, но восстановление остаётся хрупким. Потребление и инвестиции в некоторых сферах улучшаются, однако недостаточно сильно, чтобы поднять всю страну. Спрос возвращается, но осторожность всё ещё сдерживает экономику.\n-------------\nВы можете §Gсмягчить§! последствия этого национального духа, используя решения в §Y$JAP_japanese_economy_decisions$§!, чтобы повысить §YПрогресс восстановления спроса§! как минимум до §G60§!!"
 JAP_entrenched_demand_shortfall_idea_3: "Сохраняющееся давление на спрос"
 JAP_entrenched_demand_shortfall_idea_3_desc: "Меры правительства по стимулированию потребления продвинули экономику вперёд, но осторожность, оставшаяся после долгих лет стагнации, всё ещё глубоко укоренилась. Домохозяйства и предприятия действуют активнее, чем раньше, однако для самоподдерживающегося восстановления всё ещё необходим последний толчок. Японская экономика находится на пороге выхода из стагнации, но ещё не смогла полностью освободиться от неё.\n-------------\nВы можете §Gудалить§! этот национальный дух, используя решения в §Y$JAP_japanese_economy_decisions$§!, чтобы повысить §YПрогресс восстановления спроса§! как минимум до §G85§!!."
 JAP_declaration_price_target: "Объявите целевую цену"
 JAP_declaration_price_target_desc: "Экономику тормозит не только слабый спрос. Убеждение в том, что цены и заработная плата никогда не изменятся, держит домохозяйства и фирмы в состоянии осторожности. Четко определенная целевая цена – это заявление о том, что государство больше не будет мириться со стагнацией как с нормой, и это первый шаг к тому, чтобы освободиться от замороженных ожиданий."
 Japan_economy.17.t: "Целевая цена достигнута."
 Japan_economy.17.d: "То, что когда-то казалось невозможным, начало происходить. Цены растут так, что люди больше не могут это игнорировать. Самое важное изменение — не сама цифра, а растущее ощущение того, что стагнация не вечна. Это чувство начинает ослаблять осторожность как домохозяйств, так и компаний."
 Japan_economy.17.a: "Атмосфера изменилась."
 Japan_economy.18.t: "Целевая цена не оправдала ожиданий."
 Japan_economy.18.d: "Целевой показатель не привел к реальным результатам, и начинают распространяться сомнения в обещании правительства остановить спад. Домохозяйства снова проявляют осторожность, а компании занимают выжидательную позицию перед лицом слабого спроса. Доверие к восстановлению явно подорвано, и над экономикой Японии вновь воцаряется гнетущее настроение."
 Japan_economy.18.a: "Восстановить уверенность непросто."
 JAP_price_target_mission: "Перспективы роста цен"
 JAP_price_target_mission_desc: "Объявить целевой показатель недостаточно. Мы должны продемонстрировать видимые признаки роста цен в отведенное время и убедить страну в том, что перемены действительно начались."
 JAP_cash_transfers_households: "Прямая поддержка домохозяйств"
 JAP_cash_transfers_households_desc: "Когда тревога по поводу будущего сильна, восстановление экономики не начинается само по себе. Государство должно напрямую передать покупательную способность домохозяйствам. Поддержка, направленная на группы населения с низким и средним уровнем дохода, с большей вероятностью приведет к реальному потреблению, немедленно стимулируя внутренний спрос."
 JAP_cash_transfers_households_decision: "Выплаты домохозяйствам с низким и средним уровнем дохода"
 JAP_cash_transfers_households_decision_desc: "Окажите поддержку группам населения, которые с наибольшей вероятностью потратят эти средства, и напрямую стимулируйте рост спроса."
 JAP_temporary_tax_cuts: "Временные налоговые льготы"
 JAP_temporary_tax_cuts_desc: "Временное снижение налогов дает домохозяйствам повод тратить деньги сейчас, ускоряя отложенные покупки и придавая спросу ощутимый импульс в условиях стагнирующей экономики."
 JAP_temporary_consumption_tax_cut: "Временное снижение налога на потребление"
 JAP_temporary_consumption_tax_cut_desc: "Создайте повод для покупок прямо сейчас и превратите отложенное потребление в импульс для восстановления экономики."
 JAP_active_public_investment: "Агрессивные государственные инвестиции"
 JAP_active_public_investment_desc: "Если частные фирмы сохранят осторожность, правительство должно будет само создать спрос, направляя деньги в местную экономику и создавая рабочие места. Государственные инвестиции восстанавливают ощущение того, что движение наконец-то возобновилось."
 JAP_active_public_investment_decision: "Порядок государственных инвестиций"
 JAP_active_public_investment_decision_desc: "Создавайте спрос посредством государственных мер и восстанавливайте приток денежных средств в местную экономику и занятость."
 JAP_improvement_private_investment_climate: "Улучшение инвестиционного климата для частного сектора"
 JAP_improvement_private_investment_climate_desc: "Одних только государственных расходов недостаточно для завершения восстановления. Необходимо вселить в компании уверенность, чтобы они снова начали инвестировать, и снизить неопределенность в отношении будущего. Для устойчивого восстановления необходимо, чтобы предприятия перешли от оборонной промышленности к расширению."
 JAP_focus_improving_investment_climate: "Уделите внимание улучшению инвестиционного климата."
 JAP_focus_improving_investment_climate_desc: "Правительство уделяет первостепенное внимание созданию более благоприятной среды для инвестиций в бизнес. Политический капитал тратится на координацию, убеждение и институциональные реформы, оставляя меньше места для других краткосрочных инициатив."
 Japan_economy.02.t: "Улучшение инвестиционного климата для частного сектора."
 Japan_economy.02.d: "Предприятия начинают понимать, что постоянная оборонительная позиция означает упущенные возможности. Неопределенность сохраняется, но часть препятствий для новых инвестиций начинает спадать. Впервые восстановление экономики, похоже, больше не будет определяться исключительно государством."
 Japan_economy.02.a: "Частный сектор начинает оживать."
 JAP_stimulating_demand_durable_goods: "Стимулировать спрос на товары длительного пользования"
 JAP_stimulating_demand_durable_goods_desc: "Товары длительного пользования, такие как автомобили, бытовая техника и жилье, могут значительно обогатить экономику, как только спрос начнет расти. Однако во времена стагнации эти покупки часто откладываются в первую очередь. Возобновление их производства придало бы восстановлению видимый импульс и вернуло бы давно утраченное ощущение жизненной энергии."
 JAP_stimulating_demand_durable_goods_decision: "Кампания по стимулированию покупок товаров длительного пользования"
 JAP_stimulating_demand_durable_goods_decision_desc: "Поощряйте крупные покупки, которые откладывались годами, и придайте восстановлению экономики видимый импульс."
 Japan_economy.22.t: "Спрос на товары длительного пользования показывает признаки восстановления"
 Japan_economy.22.d: "Крупные покупки, которые откладывались годами, наконец-то начинают возвращаться. Спрос на товары длительного пользования оказывает широкое влияние на смежные сектора, и это также признак того, что домохозяйства становятся хотя бы немного более оптимистичными в отношении будущего. Восстановление начинает проявляться не только в данных, но и в атмосфере повседневной жизни."
 Japan_economy.22.a: "Позволить этому импульсу распространиться."
 JAP_strict_audits_banks: "Строгие проверки банков"
 JAP_strict_audits_banks_desc: "Многолетние задержки привели к тому, что проблемы банковской системы стали менее заметными, в то время как финансовая нестабильность продолжает нарастать. Первый шаг заключается в том, чтобы вывести опасные проблемные кредиты из тени и заставить банки посмотреть правде в глаза. Это будет болезненно, но без этой боли невозможно достичь подлинного восстановления."
 Japan_economy.23.t: "Опцион пут Shinsei"
 Japan_economy.23.d: "Пункт договора полностью соответствует действительности. Каждый кредит, который покупатели сочтут потерявшим пятую часть своей стоимости, возвращается в Корпорацию страхования депозитов по номинальной цене, а государство покрывает разницу. Банк не совершил ничего противозаконного. Он изучил договор внимательнее, чем чиновники, которые его составляли, и эти чиновники до сих пор находятся на своих рабочих местах."
 Japan_economy.23.a: "Опубликуйте контракт и укажите имя подписавшего его лица."
 Japan_economy.24.t: "Крах компании Sogo"
 Japan_economy.24.d: "Эту цепочку невозможно спасти, и все, кто консультирует министра, это знают. Вопрос лишь в том, будет ли она ликвидирована в суде, где имена кредиторов и чиновников, которые им потакали, будут публично названы, или же реструктуризация будет проведена за закрытыми дверями с тихим списанием государственной доли долга."
 Japan_economy.24.a: "Пусть дело провалится в открытом суде."
 JAP_injection_public_funds: "Государственное вливание капитала"
 JAP_injection_public_funds_desc: "Нереалистично требовать от ослабленных банков как покрытия убытков, так и возобновления кредитования без оказания им государственной поддержки. Чтобы сохранить доверие к самой финансовой системе, государство должно выступить в качестве последней инстанции и прервать цепь банкротств. Это решение является политически сложным, но уклониться от него практически невозможно."
 Japan_economy.25.t: "Mycal"
 Japan_economy.25.d: "Главный банк группы рефинансировал ее каждый год с момента окончания «пузыря», а теперь заявил министерству, что больше этого делать не будет. Поставщики из региона Кансай, которые никогда не имели дел ни с кем другим, уже звонят в свои префектурные отделения. Какое бы решение ни было принято на этой неделе, в регионе это будет воспринято как заявление о том, остаются ли прежние договоренности в силе."
 Japan_economy.25.a: "Пусть всё обанкротится, и проведите аудит банка, который это финансировал."
 JAP_new_lenders: "Привлечь новых кредиторов"
 JAP_new_lenders_desc: "Если существующие банки по-прежнему будут придерживаться оборонительной осторожности, кредитный поток останется слабым. Необходимо стимулировать выход на рынок новых кредиторов, чтобы устранить «узкое место» в самой финансовой системе. Конкуренция и новые каналы притока капитала могут частично восстановить утраченную японской финансовой системой гибкость."
 JAP_new_lenders_idea: "Рост числа новых кредиторов"
 JAP_new_lenders_idea_desc: "Начинают появляться новые источники кредитования помимо традиционных банков. Финансовый застой еще не полностью преодолен, но открываются новые пути для движения капитала в экономике."
 JAP_protection_deposits: "Ввести защиту вкладов"
 JAP_protection_deposits_desc: "Как только вкладчики начинают сомневаться в безопасности своих сбережений, банковский кризис становится реальностью. Поэтому государство должно недвусмысленно дать понять, что вклады будут защищены. Одно только это не сможет полностью восстановить доверие, но все же может стать той преградой, которая не даст панике перерасти в коллапс."
 Japan_economy.26.t: "Resona"
 Japan_economy.26.d: "Исключив отложенные налоговые активы, коэффициент достаточности капитала рухнет. Аудиторы отказываются подписывать документы, что само по себе беспрецедентно, и у правительства есть дни, а не недели. Два триллиона иен компенсируют убытки банка, и государство становится его владельцем. Отказ означает первое крупное банкротство банка в стране со времен войны, и никто не может сказать, где этому придет конец."
 Japan_economy.26.a: "Вложить средства и сместить весь совет директоров."
 JAP_rehabilitation_small_medium_enterprises: "Кредитная система защиты для малого бизнеса"
 JAP_rehabilitation_small_medium_enterprises_desc: "Избавление от проблемных кредитов рискует привести малые и средние предприятия к финансовым трудностям, а вместе с ними и к банкротству. Банки обязаны поддерживать кредитование жизнеспособных МСП, в то время как схемы реструктуризации финансирования контролируют ужесточение кредитной политики, создавая барьер на пути к краху местной экономики."
 JAP_rehabilitation_small_medium_enterprises_idea: "Сосредоточиться на стабильности кредитования МСП"
 JAP_rehabilitation_small_medium_enterprises_idea_desc: "Политические ресурсы направляются на обеспечение надзора, координацию и поддержку реструктуризации, чтобы не допустить, чтобы урегулирование проблемных кредитов привело к перекрытию кредитования малых и средних предприятий. Это имеет жизненно важное значение для защиты местной экономики, однако оставляет меньше возможностей для действий в других сферах."
 Japan_economy.27.t: "Банк Асикага"
 Japan_economy.27.d: "Правительство префектуры, ее фирмы и значительная часть домохозяйств не пользуются услугами других банков. Выводы экспертов однозначны: банк неплатежеспособен и находится в таком состоянии уже некоторое время. Временная национализация защищает каждого вкладчика и лишает всех акционеров, многие из которых являются местными компаниями, которые были обязаны владеть акциями в качестве условия предоставления собственных кредитов."
 Japan_economy.27.a: "Национализируйте компанию и сведите доходы акционеров к нулю."
 Japan_economy.28.t: "Daiei"
 Japan_economy.28.d: "Корпорация «Возрождение» готова взять компанию, заменить совет директоров и продать то, что можно продать. Основатель создал эту компанию из руин войны, и у него есть друзья в партии, которые помнят её. Они просят ещё об одном рефинансировании, и просят об этом громко."
 Japan_economy.28.a: "Передайте это Корпорации по возрождению."
 Japan_economy.29.t: "Отчеты Kanebo"
 Japan_economy.29.d: "Двести миллиардов йен прибыли, которая так и не была получена, отражена в отчетности за пять лет и каждый раз подписывается одной и той же аудиторской фирмой. Привлечь компанию к ответственности несложно. Привлечение к ответственности ее аудиторов показало бы каждой аудиторской фирме в Японии, что их подпись — это скорее обязательство, чем формальность, и заставило бы перечитывать множество других отчетов."
 Japan_economy.29.a: "Привлечь компанию к уголовной ответственности и отстранить от должности ее аудиторов."
 Japan_economy.30.t: "Федерация прекращает свою деятельность."
 Japan_economy.30.d: "Давление спало. Федерация не отозвала свои возражения, но прекратила выступать против расследования, а наиболее активные члены замолчали. Это не согласие. Это решение о том, что борьба больше не стоит тех затрат, которые она им обходится."
 Japan_economy.30.a: "Нам понравится тишина, пока она длится."
 Japan_economy.31.t: "Федерация выполняет свои обещания."
 Japan_economy.31.d: "Планы капитальных затрат во всех компаниях-членах были отложены, и каждая из них ссылается на неопределенность. Объявленное сегодня утром замораживание найма преподносится как мера предосторожности. Это недвусмысленный посыл, и он таков, ведь нет закона, который мог бы обязать компанию инвестировать."
 Japan_economy.31.a: "Они добились своего."
 Japan_economy.06.t: "Компании оказывают сопротивление"
 Japan_economy.06.d: "Как только аудиторы запрашивают реальные цифры, начинается лоббирование. Отраслевые федерации предупреждают о массовых банкротствах и потере рабочих мест, а лояльные бюрократы советуют проявить терпение. Банки предпочли бы сообщать об убытках в удобное для них время, если вообще сообщат. Мы можем заставить их, мы можем позволить им предоставить нам то, что они выберут, или мы можем решить, что это никогда не стоило затраченных усилий."
 Japan_economy.06.a: "Запросить книги повесткой в суд"
 Japan_economy.07.t: "Банк на грани краха"
 Japan_economy.07.d: "Аудит выявил региональный банк, погрязший в проблемных кредитах. Если обнародовать весь баланс, паника может распространиться; если же раскрыть информацию сдержанно, коррупция останется полускрытой, но рынки сохранят спокойствие. В любом случае расследование продолжается."
 Japan_economy.07.a: "Принудительное полное раскрытие информации"
 Japan_economy.08.t: "Результаты исследования опубликованы."
 Japan_economy.08.d: "Отчет отправляется в типографию. Его содержание полностью зависит от того, что удалось обнаружить аудиторам: каталог неплатежеспособных фирм и должностных лиц, которые их покрывали, частичный отчет с засекреченными именами или документ, занимающий несколько сотен страниц и не содержащий обвинений в адрес кого-либо. В любом случае, его прочтет общественность, а также те, кому обещали прозрачные рынки западного образца."
 Japan_economy.08.a: "Опубликуйте всё это и пусть общественность оценит."
 Japan_economy.09.t: "Утечка информации из министерства."
 Japan_economy.09.d: "Фирмы знали, какие аудиторы приедут и в какое утро. За выходные опустели картотеки, и два директора внезапно стали недоступны по делам за границей. Кто-то в министерстве сообщает им об этом, и все присутствующие в этом зале могут догадаться, кто это, потому что его перевели сюда из банка, который он защищает, и вернут туда после выхода на пенсию."
 Japan_economy.09.a: "Смирись с поражением и двигайся дальше."
 Japan_economy.10.t: "Федерация выдвигает ультиматум"
 Japan_economy.10.d: "Бизнес-федерация представила парламенту собственные данные: отложенные инвестиции, замороженный набор персонала, подорванное доверие — и все это списано на результаты расследования. За вежливостью скрывается недвусмысленный посыл: нужно свернуть эту деятельность, иначе члены федерации обнаружат, что не могут ничего гарантировать, пока сохраняется неопределенность."
 Japan_economy.10.a: "Пусть они изложат свою точку зрения публично."
 Japan_economy.11.t: "Прокурор падает"
 Japan_economy.11.d: "Провалилось не расследование. Провалился главный прокурор, имевший членство в гольф-клубе, которое он не задекларировал, полученное от фирмы из его собственного списка, и газета, опубликовавшая фотографии, на которых он принимает это членство. Министр подал в отставку, чтобы взять на себя ответственность. Расследование приостановлено до проверки, что, как все понимают, означает до момента, когда общественность перестанет обращать на него внимание."
 Japan_economy.11.a: "Мы утратили инициативу."
 JAP_expectation_of_being_rewarded: "Ожидание вознаграждения"
 JAP_expectation_of_being_rewarded_desc: "Для восстановления экономики необходимо вернуть веру в то, что усилия будут вознаграждены повышением заработной платы и уровня жизни. Без роста заработной платы стимул остается временным, и только это ожидание превращает восстановление в самоподдерживающееся."
 JAP_wage_negotiations: "Вести переговоры о повышении заработной платы"
 JAP_wage_negotiations_decision: "Восстановить доверие к росту заработной платы и не допустить, чтобы восстановление спроса стало лишь временным всплеском стимулирования."
 Japan_economy.12.t: "Переговоры о заработной плате с бизнесом"
 Japan_economy.12.d: "Если восстановление спроса должно стать самоподдерживающимся, заработная плата также должна расти. Однако бизнес остаётся обеспокоенным будущими рисками и давлением на прибыль. Теперь правительство должно решить, насколько решительно ему следует добиваться повышения оплаты труда."
 Japan_economy.12.a: "Стимулировать повышение заработной платы."
 Japan_economy.12.b: "Оказать давление."
 Japan_economy.12.c: "Оставить это частному сектору."
 Japan_economy.14.t: "Рост заработной платы достигает целевого показателя"
 Japan_economy.14.d: "Заработные платы наконец-то начали заметно расти. Важно не только само увеличение доходов, но и возвращение более глубокого ощущения того, что усилия вновь могут быть вознаграждены. Эта смена настроений начинает превращать вялое потребление в нечто более сильное и устойчивое."
 Japan_economy.14.a: "Восстановление становится реальностью."
 Japan_economy.15.t: "Рост заработной платы не достигает целевого показателя"
 Japan_economy.15.d: "Рост заработной платы не достиг поставленной цели, но усилия не были напрасными. Предприятия по-прежнему проявляют осторожность, однако необходимость повышения заработной платы сейчас осознается шире, чем раньше. Этот шаг вперед небольшой, но он всё же важен для преодоления прежней атмосферы застоя."
 Japan_economy.15.a: "Мы продолжим развивать это."
 Japan_economy.12_a_TT: "Вероятность достижения целевого уровня роста заработной платы составляет §Y50 на 50§!"
 Japan_economy.12_b_TT: "Вероятность достижения целевого уровня роста заработной платы является §Gвысокой§!"
 Japan_economy.12_c_TT: "Вероятность достижения целевого уровня роста заработной платы является §Rнизкой§!"
 JAP_wage_negotiations_TT: "§YПрогресс восстановления спроса§! увеличится, но его значение будет зависеть от исхода §Yпереговоров о заработной плате§!"
 JAP_glorious_decade_desc: "Не откладывая решение проблем, лежащих в основе стагнации, мы будем параллельно восстанавливать финансовый сектор, бизнес и спрос. При этом мы будем противостоять последствиям снижения рождаемости и «поколения ледникового периода занятости» и, уделяя особое внимание реформам системы труда и инвестициям в человеческий капитал, будем стремиться к достижению баланса между обеспечением благополучия домохозяйств и укреплением потенциала роста."
 JAP_inflation_target_desc: "Правительство и центральный банк четко обозначат направление политики по поддержке экономики, а также условия, при которых она будет сохраняться. Снизив неопределенность в отношении будущего и ослабив «выжидательную» позицию домохозяйств и предприятий, мы создадим более благоприятные условия для роста потребления и инвестиций."
 JAP_diplomacy.34.d: "В целях укрепления системы финансовой безопасности региона правительство Японии предложило расширить соглашение о валютных свопах с нашей страной в рамках «Чиангмайской инициативы». Обеспечение ликвидности в кризисные периоды может помочь успокоить рынки и способствовать экономической стабильности.\n\nСтоит ли нам принять это предложение и принять участие в укреплении финансового сотрудничества?"
 JAP_diplomacy.40.d: "Правительство Японии предложило нашей стране сотрудничество в рамках программы «Качественная официальная помощь в целях развития» (ODA) в сферах образования, развития человеческого потенциала и научных исследований в качестве поддержки, осуществляемой в координации с местными компаниями и учреждениями. Данное сотрудничество будет способствовать укреплению профессиональной подготовки и институционального потенциала, содействуя модернизации промышленности и инновациям. Принятие этого предложения также усилит влияние Японии в рамках АСЕАН.\n\nСтоит ли нам принять это предложение и укрепить человеческий капитал, а также научно-исследовательскую и опытно-конструкторскую деятельность?"
 JAP_diplomacy.41.d: "[FROM.GetName] одобрили предложение Японии о сотрудничестве в рамках программы «Качественная ОПР» в сферах образования, развития кадрового потенциала и научных исследований. По мере развития взаимодействия с местными компаниями и учреждениями будут укрепляться институциональный потенциал и технологическая база этой страны, что будет способствовать устойчивому росту. Данное соглашение, несомненно, усилит влияние Японии в рамках АСЕАН."
 JAP_diplomacy.42.d: "[FROM.GetName] сообщила, что отклонит предложение о сотрудничестве в рамках «качественной ОПР» в сферах образования, развития кадрового потенциала и научных исследований. По всей видимости, данная страна уделяет приоритетное внимание внутренним задачам и институциональной подготовке, однако это не означает, что она отвергает само предложение. Япония должна учитывать обстоятельства другой страны, сохраняя при этом открытыми каналы для диалога."
 JAP_diplomacy.49.d: "Правительство Японии выступило с предложением создать «Японско-тайваньскую платформу знаний по обеспечению готовности к стихийным бедствиям» для обмена опытом и наработками в сфере ликвидации последствий стихийных бедствий, исходя из нашей общей уязвимости перед стихийными бедствиями. Путем стандартизации обмена информацией, проведения совместных учений и разработки процедур восстановления планируется укрепить потенциал реагирования на чрезвычайные ситуации и ускорить восстановительные работы. Ожидается, что в случае реализации этого сотрудничества удастся сократить ущерб и ускорить восстановление."
 JAP_diplomacy.50.d: "Правительство Японии выступило с инициативой «Сотрудничество между Японией и Тайванем в сфере высоких технологий», которая предусматривает налаживание связей между научно-исследовательскими учреждениями и частными компаниями Японии и Тайваня с целью развития совместных исследований в области передовых гражданских технологий. Благодаря совместному использованию исследовательских ресурсов, ведению совместных разработок и содействию обмену инженерами планируется ускорить инновационный процесс, а также повысить производительность и конкурентоспособность промышленности. Если это сотрудничество укоренится, оно станет основой для долгосрочного роста в секторах гражданских технологий обеих стран."
 JAP_diplomacy.56.t: "Проект культурного сотрудничества «Китайская культурная сфера»"
 JAP_diplomacy.56.d: "Правительство Японии выступило с предложением о реализации проекта культурного сотрудничества между Японией и Китаем, направленного на укрепление культурных связей в рамках «китайской культурной сферы», имеющей общие исторические корни. Посредством академических обменов, культурных инициатив и сотрудничества в сфере СМИ и образования ставится цель сделать общие ценности и исторические связи более заметными и использовать их в качестве культурного буфера, защищающего от внешнего влияния. Ожидается, что реализация этой концепции также укрепит «мягкую силу», способствующую формированию более благоприятного международного имиджа."
 JAP_diplomacy.59.d: "Правительство Японии выступило с предложением о реализации «Инициативы по региональному деловому обмену», направленной на институционализацию деловых контактов на местном уровне и содействие сотрудничеству между региональными компаниями Японии и Южной Кореи. Посредством мероприятий по налаживанию деловых контактов, совместных выставок, согласования цепочек поставок, а также обмена технологиями и ноу-хау планируется оживить региональную экономику и ускорить рост гражданских отраслей. Если эта структура укоренится, расширится практическое сотрудничество, не зависящее в чрезмерной степени от руководства центрального правительства, что укрепит промышленные сети, движимые частным сектором."
 JAP_historical.20010426.d: "Ёсиро Мори объявил об отставке с поста премьер-министра, пробыв на этой должности всего один год. Его рейтинг одобрения снизился, а разрыв между ним и общественностью, символом которого стали его высказывание о «божественной нации» и его действия в связи с инцидентом с судном «Эхиме Мару», только углубился.\n\nПреемником Мори на посту лидера ЛДП был избран Дзюнъитиро Коидзуми, привлекший внимание всей страны своим смелым заявлением о «разрушении ЛДП» и проведший яркую, широко освещаемую кампанию. Ожидания общественности были высоки, и он одержал убедительную победу на региональных выборах.\n\nОбладая стилем и сценическим обаянием, которые резко отличались от традиций старой Либерально-демократической партии, Коидзуми, вступив в должность премьер-министра, поднял знамя «реформ».\nОднако что может возникнуть из руин, которые он поклялся разрушить, пока никто не знает."
 JAP_historical.20060926.d: "Премьер-министр Дзюничиро Коидзуми, возглавлявший правительство на протяжении более пяти лет, объявил о намерении уйти в отставку по истечении срока своих полномочий в качестве председателя ЛДП. Хотя Коидзуми публично заявлял о своём желании уйти в отставку по окончании срока полномочий, общественная поддержка его оставалась высокой, и многие в партии продолжали призывать к продлению его пребывания на посту.\n\nМежду тем в рядах ЛДП в качестве главного претендента на преемственность выдвинулся Синдзо Абэ, который стремительно продвинулся по карьерной лестнице и в молодом возрасте занял пост генерального секретаря кабинета министров. Благодаря своей молодости, известности, политическому происхождению и символическому статусу фигуры «после Коидзуми» он пользовался широкой поддержкой во всех слоях партии.\n\nКто лучше подходит для того, чтобы вести страну вперёд: опытный действующий лидер или новый лидер, готовый передать эстафету следующему поколению? Пришло время принять решение."
 JAP_historical.20070926.d: "Премьер-министр Синдзо Абэ неожиданно объявил о намерении уйти в отставку, сославшись на растущие трудности в управлении правительством. С момента его вступления в должность прошел всего один год. На фоне череды министерских скандалов основы его администрации были серьезно пошатнуты.\nВ связи с его отставкой некоторые члены Либерально-демократической партии (ЛДП) выступили за привлечение бывшего главы кабинета министров Ясуо Фукуды, заявив, что «для восстановления доверия общественности необходимо новое лицо». Однако многие по-прежнему решительно выступают за то, чтобы Абэ остался на посту.\n\nЯпония сейчас находится в состоянии политической нестабильности. Настало время решить, кто возглавит страну."
 JAP_historical.20080924.d: "Премьер-министр Ясуо Фукуда неожиданно провел пресс-конференцию в Кабинете премьер-министра, чтобы объявить о своей отставке.\n\nВ ходе пресс-конференции он заявил: «Ради благополучия людей я надеюсь, что новая команда будет проводить политику», продемонстрировав спокойное отношение к смене руководства. Однако, поскольку он не объяснил четко причины своей отставки, это заявление вызвало у многих граждан недоумение и неуверенность.\nВ ответ на это Либерально-демократическая партия быстро приступила к подготовке к выборам лидера. Генеральный секретарь Таро Асо стал ведущим кандидатом, быстро заручившись поддержкой различных фракций партии. Тем не менее, небольшая группа представителей внутри партии по-прежнему призывает Фукуду остаться на посту.\n\nЧтобы преодолеть политический застой, нужны ли стране перемены? Или в данный момент для Японии важнее стабильность? Пришло время принять решение."
 JAP_focus_renewable_energy_decision_repeal: "Отмена приоритета возобновляемых источников энергии"
 JAP_focus_renewable_energy_decision_repeal_desc: "Отказ от обязательств по развитию возобновляемой энергетики знаменует собой сдвиг в политике, отход от инвестиций в солнечную и ветровую энергетику, что позволит правительству перенаправить ресурсы на другие приоритетные направления в энергетике."
 JAP_focus_thermal_power_decision_repeal: "Отмена приоритета электростанций, работающих на ископаемом топливе"
 JAP_focus_thermal_power_decision_repeal_desc: "Отмена расширения электростанций, работающих на ископаемом топливе, знаменует собой сдвиг в политике от инвестиций в угольную, нефтяную и газовую энергетику, что позволит правительству перенаправить ресурсы на другие приоритетные направления в энергетике."
 JAP_historical.121006001.t: "2000 Тотторийское землетрясение"
 JAP_historical.121006001.d: "Япония состоит из вулканических архипелагов, плавающих на Огненном кольце. Это означает, что японцы постоянно сталкиваются с мощными землетрясениями. Это не изменилось в прошлом тысячелетии и не изменится в следующем.\n\n13:30, 6 октября 2000 года — землетрясение магнитудой 7.3 и силой 6+ по шкале JMA произошло на западе префектуры Симане. Оно нанесло серьёзный ущерб дорогам и домам и вызвало толчки в отдалённых регионах, таких как Осака и Фукуока. Особенно сильно землетрясение ощущалось в Кобе — впервые со времени Великого землетрясения Хансин-Аважи 1995 года."
 JAP_historical.disaster_help: "Помогите им сейчас!"
 JAP_historical.disaster_leave: "Оставьте их. Они восстановятся сами."
 JAP_historical.130210001.t: "Катастрофа «Эхимэ-Мару»"
 JAP_historical.130210001.d: "9 февраля 2001 года учебное судно «Эхимэ-Мару», принадлежащее рыболовному училищу, было протаранено и потоплено подводной лодкой [USA.GetName] Greeneville. На борту «Эхимэ-Мару» находились 35 японских студентов и преподавателей; судно затонуло, 9 человек погибло.\n\nПока представители обоих правительств собирают информацию об этой трагедии, премьер-министр [Root.GetLeader] отдыхает, играя в гольф.\n\nКонечно, он должен немедленно прервать отпуск и вернуться в Токио, не так ли?"
 JAP_historical.130210001.oA: "Вернуться в Токио сейчас!"
 JAP_historical.130210001.oB: "Подождите! Ещё один удар..."
 JAP_historical.130324001.t: "2001 Геёское землетрясение"
 JAP_historical.130324001.d: "15:27, 24 марта 2001 года землетрясение магнитудой 6.7 и силой 6- по шкале JMA произошло на западе префектуры Хиросима. Двое человек погибли, 288 получили ранения. Город Курэ, ближайший к эпицентру, понёс наибольшие разрушения. С другой стороны, многие местные власти смогли уменьшить ущерб, поскольку их города приняли контрмеры после Великого землетрясения Хансин-Аважи 1995 года и землетрясения в Симане прошлого года. Основной ущерб был причинён разрушением водопроводных труб и обрушением поверхности склонов гор."
 JAP_historical.9130901001.t: "Пожар в здании Кабукичо"
 JAP_historical.9130901001.d: "Перед рассветом 1 сентября 2001 года здание \"Myojo 56 Building\" в Кабукичо, районе Синдзюку в Токио, загорелось, и пожар унёс жизни 44 человек, посетивших зал для игры в маджонг и стриптиз-клуб, отравившись угарным газом. По данным пожарной службы, сначала огонь был небольшим, но взорвался эффектом обратной тяги, когда сотрудник, заметивший возгорание, открыл дверь. В докладе также говорится, что пожарные сигнализации были закрыты потолком или отключены из-за неисправности, поэтому раннее тушение не состоялось. Имеются также сообщения, что персонал здания не направил посетителей к эвакуации. Тем временем столичная полиция совместно с пожарной службой обнаружила, что газовая труба была повреждена ненормально. Хотя причина пожара до сих пор не установлена — случайный инцидент или поджог, — ясно, что недостаток культуры пожарной безопасности сделал ситуацию хуже."
 JAP_historical.9130901001.oA: "Надеемся, больше никогда не увидим пожара хуже этого."
 JAP_historical.131201001.t: "Рождение её светлости принцессы Айко"
 JAP_historical.131201001.d: "1 декабря 2001 года в больнице Императорского дворца родилась дочь наследного принца Нарухито и его супруги Масако. Она, первая рожденная императорская принцесса третьего тысячелетия, получила имя Айко, взятое из учения Менция, классической китайской конфуцианской книги. Также её светлость принцесса Айко — внучка Его Величества императора Акихито. Это событие стало самым счастливым с момента рождения Его Светлости принца Фумихито Акисино-но-Мия в 1965 году, и почти вся страна праздновала. Затем 20 000 человек, включая политиков и знаменитостей, кричали «Бандзай» у Императорского дворца. С другой стороны, некоторые опасались, что это может поставить под угрозу нынешнюю линию Императорской семьи. Принцесса-консорт Масако уже была слишком взросла, чтобы рожать ребёнка, поэтому рождение второго могло быть опасным. И если принцесса Айко вырастет, она может стать матрилатеральной императрицей «как последняя императорская семья», поскольку разница в возрасте между двумя принцами — Нарухито и Фумихито — велика. Но это нарушило бы Императорский домовой закон: на Императорский трон допускается только патрилатеральная линия. В конце концов все начали спорить о поправке к Императорскому домовому закону, чтобы допустить матрилатеральную императрицу."
 JAP_historical.131201001.oA: "Бандзай!"
 JAP_historical.150526001.t: "2003 прибрежное землетрясение в Мияги"
 JAP_historical.150526001.d: "26 мая 2003 г., 18:24 — Землетрясение магнитудой 7,1 (6 баллов по шкале JMA) произошло недалеко от границы префектур Мияги и Иватэ. Обширные районы региона Тохоку сильно пострадали: разрушены эстакады Синкансэна и произошли оползни в горах, но никто не погиб. Цунами в это время ощущалось очень мягко, словно рябь. Несмотря на эти сообщения, землетрясение почувствовали многие люди, от Хоккайдо до Канто."
 JAP_historical.150726001.t: "2003 второе подряд землетрясение в Мияги"
 JAP_historical.150726001.d: "26 июля 2003 года — целых четыре землетрясения подряд ударили по северной части префектуры Мияги в течение дня! Самое сильное зафиксировало магнитуду 6.4 и силу 6+ в 7:13 утра, а даже самое слабое — магнитуду 5.1 и силу 5-. Эти землетрясения нанесли ущерб не только сотням домов, но и военно-воздушной базе Сил самообороны Матсушима. Это был очень неприятный день, но, к счастью, никто не погиб."
 JAP_historical.150926001.t: "2003 землетрясение на Хоккайдо"
 JAP_historical.150926001.d: "4:50 утра, 26 сентября 2003 г. — У берегов южного Хоккайдо произошло землетрясение магнитудой 8,0 (6 баллов по шкале JMA). Лишь несколько городов сильно пострадали от землетрясения, но вскоре они осознали ужасающие последствия. Землетрясение вызвало разжижение грунта в засыпанной прибрежной зоне и пожар на нефтехранилищах. Кроме того, на восточное побережье Восточной Японии обрушилось огромное цунами, погибли два человека."
 JAP_historical.161023001.t: "Землетрясение в Тюэцу, Ниигата, 2004 год"
 JAP_historical.161023001.d: "17:56, 23 октября 2004 г. — В Ниигате произошло землетрясение магнитудой 6,8, что соответствует 7-й шкале. Это был первый случай, когда землетрясение было зафиксировано по шкале JMA 7 после пересмотра, проведенного после землетрясения в Хансине в 1995 году. В Ямакоси все дороги были разрушены оползнями, и все жители оказались заперты в деревне. Поезд, следовавший по линии Синкансэн Дзёэцу, сошел с рельсов из-за толчка, но никто не погиб. Однако в результате землетрясения погибли 68 человек."
 JAP_historical.170320001.t: "2005 фукуокское землетрясение"
 JAP_historical.170320001.d: "10:53 утра, 20 марта 2005 г. — Землетрясение магнитудой 7,0 (6 баллов по шкале JMA) произошло у берегов города Фукуока. В Северном Кюсю зафиксировано меньше землетрясений, и это было самое сильное с 1922 года. На острове Генкай в городе Фукуока около 700 человек эвакуировались, а десять решили остаться для обеспечения связи и патрулирования в случае стихийного бедствия. В центре Фукуоки разбито большинство окон, осколки упали на тротуар и ранили двух пешеходов. Землетрясение потрясло не только Цусиму, но и Корею и Китай. Один человек погиб в результате землетрясения."
 JAP_historical.170425001.t: "Крушение поезда на линии Фукуросимаяма"
 JAP_historical.170425001.d: "В 9:18 утра 25 апреля 2005 года поезд скоростного трамвая на линии Фукутияма (также известной как линия Такарадзука) компании JR West сошел с рельсов на крутом повороте в городе Амагасаки, префектура Хёго, и врезался в первый этаж расположенного неподалеку многоквартирного дома.\nПоезд состоял из семи вагонов, хотя в первоначальных сообщениях ошибочно утверждалось, что их было только шесть, поскольку головной вагон полностью застрял в здании. Расследование показало, что поезд вошел в поворот на скорости приблизительно 116 км/ч (72 мили в час), несмотря на то, что разрешенная скорость на этом участке составляла 70 км/ч (43 мили в час). Чрезмерная скорость, вероятно, стала причиной схода с рельсов из-за центробежной силы.\nВодитель погиб в аварии, но показания кондуктора из заднего вагона указывали на то, что экипаж, возможно, пытался компенсировать задержку примерно в 90 секунд. Позже стало известно, что в компании существовали строгие внутренние дисциплинарные меры даже за незначительные операционные ошибки. Эти меры включали в себя перевоспитание, переписывание правил компании от руки и другие корректирующие действия, истоки которых восходят к приватизации Японских национальных железных дорог (JNR) во время правления Накасонэ.\nК счастью, приближавшийся навстречу скоростной поезд смог совершить экстренную остановку из-за заблокированного пути, избежав вторичного столкновения. Однако, поскольку авария произошла в час пик утром, поезд был переполнен. В общей сложности погибли 107 человек, 562 получили ранения, что делает эту железнодорожную катастрофу самой смертоносной в послевоенной истории Японии. Некоторые медицинские специалисты отметили, что несколько пассажиров, возможно, погибли не сразу в результате столкновения, а позже из-за синдрома сдавливания, возникшего в результате длительного сжатия."
 JAP_historical.180906001.t: "Рождение его светлости принца Хисахито"
 JAP_historical.180906001.d: "6 сентября 2006 года в частной больнице в Минaми-Азабу родился сын принца Фумихито и его супруги Кико. Он, первый рожденный императорский принц в третьем тысячелетии, был назван Хисахито, что означает «Хиса» — «в расслабленном состоянии» и «Хито» — по императорской традиции Хэйанского периода. Он родился с помощью кесарева сечения в частной больнице, а не в Императорском дворце; это был первый такой случай в императорской истории. Это событие было воспринято как легитимное продолжение мужской линии престолонаследия, а также как рождение новой императорской семьи. После рождения мальчика спор о поправке к Императорскому домовому закону стал постепенно утихать."
 JAP_historical.180906001.oA: "Бандзай!"
 JAP_historical.190216001.t: "«Потерянная пенсия»"
 JAP_historical.190216001.d: "В 1997 году Агентство социального страхования Японии (SIA) приступило к объединению индивидуальных пенсионных дел в рамках единой системы «Базового пенсионного номера». Однако в 2006–2007 годах агентство обнаружило около 50 миллионов пенсионных записей, которые остались несопоставленными или содержали несоответствия из-за ошибок, допущенных при переносе бумажных документов в цифровой формат.\nНекоторые из этих отсутствующих записей касались нынешних получателей пенсий, что вызвало опасения по поводу того, что люди могли получать неверные суммы выплат. Кроме того, по имеющимся данным, некоторые записи были утеряны или ошибочно удалены при попытках обновить пенсионные данные работников.\nВ ответ на это [JAP.GetRulingParty] создало специальную рабочую группу для расследования данного вопроса и предложило принять чрезвычайное законодательство, чтобы оказать помощь пострадавшим. Тем не менее оппозиционные партии подвергают правительство резкой критике, а уровень недовольства населения остается высоким."
 JAP_historical.190216001.oA: "Какая катастрофа!"
 JAP_historical.190325001.t: "2007 землетрясение в Ното"
 JAP_historical.190325001.d: "9:41 утра 25 марта 2007 года — сильное землетрясение магнитудой 6.9 поразило регион Хокурику. По шкале JMA толчок оценён как 6+ в городе Вадзима, префектура Исикава, и это было самое сильное землетрясение с начала сейсмических наблюдений в 1922 году. Эпицентр, согласно сообщениям, находился в районе, где до сих пор не обнаружено разлома. Толчки достигли от префектуры Хоккайдо до префектуры Коти и вызвали цунами высотой 20 см (7,87 дюйма). Землетрясение унесло жизнь одного человека при обрушении каменной фонарной конструкции, ранило 356 человек и повредило более 30 000 зданий и домов."
 JAP_historical.190716001.t: "2007 прибрежное землетрясение в Чуэцу"
 JAP_historical.190716001.d: "10:13 утра 16 июля 2007 года — ещё одно землетрясение магнитудой 6.8 потрясло префектуру Ниигата. По шкале JMA оно оценивалось как 6+ в нескольких городах, но на АЭС Касивадзаки-Карива оно было неофициально вычислено как 7. Цунами также вызвано толчком и было зарегистрировано на 1 м (3,28 фута) в городе Касивадзаки. Землетрясение напрямую и вторично убило 15 человек, ранило 2 346 человек и повредило более 34 000 зданий, включая 1 331 разрушенный дом. На упомянутой АЭС Касивадзаки-Карива возник пожар, но тушение было задержано на два часа из-за ошибки в передаче сообщений на ранней стадии пожаротушения, что привело к утечке радиоактивных веществ, хотя она была в экологически незначимом уровне. Это землетрясение произошло всего через 4 месяца после землетрясения в Ното и через 3 года после разрушительного землетрясения Хансин 2004 года в Ниигате."
 JAP_historical.200614001.t: "2008 землетрясение внутри Иватэ-Мияги"
 JAP_historical.200614001.d: "8:43 утра 14 июня 2008 года — сильное землетрясение магнитудой 7.2 произошло под префектурой Иватэ. По шкале JMA оно оценивалось как 6+ в городах Курихара, префектура Мияги, и Осу, префектура Иватэ. Несмотря на то, что землетрясение было внутренним, толчки силой более 3 баллов были зарегистрированы от Хоккайдо до региона Канто. Это толчок, как редкое явление, повредил несколько зданий, но вызвал множество оползней и в итоге убил 17 человек, тяжело ранил 70 и ещё 356 получили лёгкие травмы, а 6 человек остались пропавшими без вести. Поступали сообщения об обрушении моста и повреждении культурных памятников."
 JAP_historical.210811001.t: "2009 землетрясение в заливе Суруга"
 JAP_historical.210811001.d: "5:07 утра 11 августа 2009 года — большое землетрясение магнитудой 6.5 произошло в заливе Суруга, убив одного человека и ранив 319. Толчок вызвал цунами высотой 40 см (1,31 фута). По шкале JMA землетрясение оценивалось как 6- во многих районах префектуры Сидзуока, были повреждены 8 678 домов и несколько исторических зданий, но ни один дом полностью не разрушен. Регион Токай, включающий префектуру Сидзуока, считается ключевой опасной зоной будущего Великого землетрясения Токай-Тонанкай и цунами, поэтому жители готовились: эвакуировались, укрепляли мебель и укрепляли свои дома и здания. Это было причиной меньшего числа жертв и ущерба по сравнению с масштабом толчка. Тем не менее были сообщения о повреждении заводов, чайных плантаций и автомагистрали Томеи."
 JAP_diplomacy.16.t: "Японский тупик"
 JAP_diplomacy.16.d: "Токио продолжает сопротивляться расширению толкования статьи 9. Вашингтон должен решить, насколько далеко он готов зайти и какой ценой."
 JAP_diplomacy.16.a: "Оставьте этот вопрос. Наши другие интересы в регионе имеют приоритет."
 JAP_diplomacy.16.b: "Отменяем наши гарантии безопасности для Японии."
 JAP_diplomacy.16.c: "Ввести торговые пошлины на японский экспорт."
 JAP_diplomacy.16.e: "Установить морскую блокаду Японии."
 JAP_asteroid_mining_network_established: "Создана сеть для добычи ресурсов на астероидах для [JAP.GetNameWithFlag]"
 JAP_asteroid_mining_operation_active: "В настоящее время проводится операция по добыче полезных ископаемых на астероиде."
 JAP_claiming_taiwan_tt: "Это выдвигает японские претензии на все островные государства Тайваня одновременно. После того, как претензии будут обоснованы, завершите фокус, требующий от Тайваня подчинения."
 JAP_improvement_private_investment_climate_idea: "Улучшение инвестиционного климата для частного сектора"
 JAP_improvement_private_investment_climate_idea_desc: "Одних только государственных расходов недостаточно для завершения восстановления. Необходимо вселить в компании уверенность, чтобы они снова начали инвестировать, и снизить неопределенность в отношении будущего. Для устойчивого восстановления необходимо, чтобы предприятия перешли от оборонной промышленности к расширению."
 JAP_demographic_crisis: "Беспрецедентные меры в условиях кризиса"
 JAP_demographic_crisis_desc: "Агентство по делам детей и семей Японии координирует общеправительственные меры реагирования на демографический спад: стимулирование рождаемости, мобилизация женской рабочей силы или иммиграционная реформа. Парламент придерживается только одного пути. Каждый из них оплачивается в разной форме: денежные пособия, сокращение рабочей силы или культурные преобразования."
 JAP_demographic_crisis_tt: "Это знаменует начало ответных мер Японии на демографический спад. Три последующие стратегии являются взаимоисключающими."
 JAP_traditionalist_backlash_opposition_tt: "§RРеакция традиционалистов:§! Недовольство консерваторов отступлением традиционной семьи усиливает националистическую оппозицию."
 JAP_traditionalist_backlash_stability_tt: "§RРеакция традиционалистов:§! Консервативный гнев по поводу отступления традиционной семьи подрывает стабильность."
 JAP_japan_belongs_to_the_japanese: "Япония принадлежит японцам"
 JAP_japan_belongs_to_the_japanese_desc: "Япония повысит рождаемость за счет семейных пособий, стимулов к увеличению рождаемости и культурного обновления. Государство обязуется постоянно финансировать социальное обеспечение независимо от того, увеличится ли рождаемость. Этот путь обменяет финансовую неопределенность, связанную с сокращением рождаемости, на уверенность в необратимых социальных выплатах."
 JAP_pronatalist_turn: "Инициатива «Плюс один»"
 JAP_pronatalist_turn_desc: "Япония запустит масштабную кампанию по поощрению деторождения как приоритета гражданского общества, вдохновившись стратегией «Плюс один» начала 2000-х годов. С помощью налоговых льгот, публичных информационных кампаний и культурного признания многодетных семей государство изменит общественное отношение к многодетным семьям, одновременно предоставляя конкретную поддержку, которая сделает родительство более доступным и привлекательным."
 JAP_national_revival_campaign: "Инициатива по возрождению региона"
 JAP_national_revival_campaign_desc: "Япония направит инвестиции в регионы, возрождая местные сообщества, которые пришли в упадок из-за оттока молодежи в Токио. Создавая рабочие места, улучшая инфраструктуру и восстанавливая доверие к провинциальной Японии, мы стремимся укрепить семьи за пределами мегаполисов и замедлить концентрацию населения, которая усугубляет упадок сельской местности. Сильные регионы — это основа для стабильных семей и устойчивой рождаемости."
 JAP_three_generation_household: "Домохозяйство из трёх поколений"
 JAP_three_generation_household_desc: "Япония будет субсидировать семьи, состоящие из трех поколений, посредством налоговых льгот и поддержки в жилищном вопросе, возрождая практику, при которой бабушки и дедушки обеспечивают уход за детьми и пожилыми людьми без рыночной заработной платы. Государство перекладывает расходы на социальное обеспечение на семьи, сокращая собственные расходы. Уход на дому – это уход, за который государство не платит."
 JAP_homeland_production_drive: "Монозукури дома"
 JAP_homeland_production_drive_desc: "Япония усилит свою приверженность развитию отечественного производства, инвестируя в автоматизацию и обучение рабочей силы, чтобы максимизировать производительность при сокращающейся численности рабочей силы. Вместо переноса производства за границу или найма мигрантов Япония следует традиции монодзукури — искусству качественного изготовления вещей. Компромисс заключается в энергетической нагрузке и повышении издержек."
 JAP_incentivize_large_families: "Расширенное пособие на ребенка"
 JAP_incentivize_large_families_desc: "В Японии будет расширена программа детского пособия «дзидо театэ», предусматривающая щедрые денежные выплаты, размер которых будет увеличиваться с каждым дополнительным ребенком. Сделав родительство более доступным, государство снимает ограничивающее условие для размера семьи. После закрепления в законе это пособие станет постоянной льготой, которую ни одно будущее правительство не осмелится сократить."
 JAP_state_family_mandate: "Семья как государственный императив"
 JAP_state_family_mandate_desc: "В Японии создание семьи будет предписано посредством трудового законодательства, пенсионных программ и социальных коммуникаций, подталкивающих женщин к материнству, а мужчин — к родительству. Это дешевый способ: государство тратит мало средств, при этом принуждая граждан к деторождению. Цена — легитимность и недовольство."
 JAP_a_nation_reborn: "Возрожденная нация"
 JAP_a_nation_reborn_desc: "Уровень рождаемости стабилизировался и начал расти, материнство почитается, а региональные сообщества оживляются. Япония обратила вспять демографический спад благодаря устойчивым инвестициям, способствующим росту рождаемости. Два десятилетия пособий, жилищных субсидий и ухода за пожилыми людьми превратились в льготы, которые ни одно будущее правительство не сможет сократить."
 JAP_womenomics: "Женская экономика"
 JAP_womenomics_desc: "Япония мобилизует женщин во всех секторах экономики, устраняя барьеры, обеспечивая уход за детьми и меняя корпоративную культуру. Это высвободит производственные мощности и налоговые поступления без увеличения рождаемости. Государство должно создать и укомплектовать систему ухода за детьми, и консервативная Япония воспримет это как нападение на семью."
 JAP_eliminate_daycare_waitlists: "Инициатива «Ноль детей в списке ожидания»"
 JAP_eliminate_daycare_waitlists_desc: "Япония будет реализовывать План обеспечения безопасности воспитания детей, расширяя сеть детских садов, центров дневного ухода и учреждений послешкольного обслуживания до тех пор, пока не будут устранены очереди. Значительные инвестиции в заработную плату работников и строительство учреждений снимают ограничивающие факторы для участия женщин в рабочей силе. Эти учреждения должны быть обеспечены персоналом и финансированием на постоянной основе."
 JAP_reform_spousal_tax_deduction: "Снести стену в 1,03 миллиона йен"
 JAP_reform_spousal_tax_deduction_desc: "Япония отменит «обрыв» в виде налоговых вычетов для супругов, составляющий 1,03 миллиона иен, и пересмотрит пороговые значения для социального страхования, лежащие в его основе. Это устранит препятствие для работы на полную ставку, которое приковало миллионы женщин к работе на неполный рабочий день. Снос этого барьера откроет доступ к большому количеству опытных и образованных женщин для работы на полную ставку."
 JAP_normalize_parental_leave: "Кампания Икумен"
 JAP_normalize_parental_leave_desc: "В Японии будет запущена кампания «Икумен», гарантирующая оплачиваемый отпуск по уходу за ребенком обоим родителям и оказывающая давление на мужчин, чтобы они его использовали. Когда отцы становятся основными опекунами, женщины перестают быть заложницами материнства, и бремя распределяется между ними. Компании понесут убытки в виде снижения объемов производства, и поколение офисных работников не собирается молча уступать."
 JAP_women_in_management: "Инициатива 2020-30"
 JAP_women_in_management_desc: "Япония будет стремиться к достижению цели к 2020-30 годам: три из десяти руководящих должностей должны занимать женщины. Закон о содействии участию и продвижению женщин на рабочем месте устанавливает обязательные целевые показатели для корпораций и государственного сектора, обеспечивает раскрытие информации и поощряет компании, возглавляющие этот процесс. Женщины будут обладать значительной властью в каждом совете директоров и государственном ведомстве."
 JAP_family_first_model: "Реформа стиля работы: путь к семье"
 JAP_family_first_model_desc: "Движение за реформу стиля работы будет отдавать приоритет семейному пути: гибкий график, возможность работать неполный рабочий день и расширенные пособия на детей позволят женщинам оставаться на рынке труда, не жертвуя при этом возможностью материнства. Этот путь предполагает снижение общего объема производства для сохранения карьеры и возможности иметь детей, делая ставку на то, что социальная стабильность и умеренное демографическое восстановление важнее максимального экономического роста."
 JAP_career_first_model: "Реформа стиля работы: карьерный путь"
 JAP_career_first_model_desc: "Движение за реформу стиля работы ставит во главу угла карьерный рост: никакого гибкого графика, никакой работы на неполный рабочий день, а подлинное равенство в продвижении по службе и оплате труда. Женщины конкурируют на равных условиях за каждую должность, максимизируя экономический эффект и женский доход. Это усложняет материнство, и рождаемость будет снижаться, поскольку многие выбирают амбиции вместо семьи."
 JAP_a_society_where_women_thrive: "Общество, где женщины процветают"
 JAP_a_society_where_women_thrive_desc: "Структурные барьеры рухнули, и женщины работают на всех уровнях, обладая подлинным равенством и правом выбора, что способствует расширению как рабочей силы, так и налоговой базы. Чего реформы так и не добились, так это увеличения числа детей. Япония работает и зарабатывает больше, но всё ещё сокращается, поддерживаемая системой ухода за детьми и образования, которую государство должно финансировать вечно."
 JAP_open_japan: "Открытая Япония"
 JAP_open_japan_desc: "Япония будет систематически привлекать иностранных рабочих посредством миграционных соглашений, иммиграции по профессиональным навыкам и визовой реформы, чтобы восполнить дефицит рабочей силы. Это позволит устранить нехватку рабочей силы в течение нескольких лет, а не десятилетий, обеспечив полную занятость и финансовую стабильность пенсионных фондов. Культурная идентичность окажется под угрозой, сообщества меняются быстрее, чем это позволяет общественное мнение, и каждый шаг вызовет националистическую реакцию."
 JAP_labor_migration_pact: "Двусторонние соглашения о мобильности рабочей силы"
 JAP_labor_migration_pact_desc: "Япония формализует двусторонние соглашения о трудоустройстве с соседними странами, расширив программу технической стажировки и заключив новые взаимные соглашения для привлечения работников в строительство, сельское хозяйство, сестринский уход и производство. Эти соглашения заключаются быстро и эффективно: десятки тысяч работников могут быть приняты на работу в течение нескольких месяцев, заполняя критически важные вакансии и стабилизируя занятость в секторах, которые в противном случае сократились бы или полностью исчезли."
 JAP_points_based_immigration: "Программа для высококвалифицированных специалистов"
 JAP_points_based_immigration_desc: "Япония введет балльную систему для высококвалифицированных специалистов, присуждая баллы за квалификацию, опыт работы, знание языка и наличие предыдущего места жительства. Инженеры, медсестры, исследователи и специалисты в области финансов занимают высокооплачиваемые должности и смягчают препятствия для экономического роста. Приезжие квалифицированные специалисты привозят с собой семьи и рассчитывают на международное образование, расходы на которое государство берет на себя в обмен на исследовательский потенциал, который оно не смогло бы приобрести иным способом."
 JAP_integration_programs: "Платформа интеграции Tabunka Kyosei"
 JAP_integration_programs_desc: "Япония будет инвестировать в активную интеграцию (табунка кёсэй) посредством языковых курсов, общественных центров и программ получения постоянного вида на жительство для трудовых мигрантов и их семей. Новоприбывшие, получившие инструменты для интеграции, будут создавать меньше препятствий и вносить более существенный вклад. Языковое обучение, образование и социальное обеспечение семей мигрантов станут постоянной статьей бюджетных расходов, компенсирующей затраты на обеспечение правопорядка в условиях неконтролируемой миграции."
 JAP_multicultural_society: "Многокультурное общество"
 JAP_multicultural_society_desc: "Япония предоставляет мигрантам и их детям правовой статус, право на участие в гражданской жизни и признание их культуры как полноправных членов национального сообщества. Это глубокий разрыв с исторической замкнутостью, превращающий потенциальную неприязнь в чувство принадлежности и поддерживающий социальную стабильность. Полные гражданские и социальные права для миллионов новых японцев — это дорогостоящие, постоянные права, которые больше не будут оплачиваться из образовательных и социальных фондов."
 JAP_guest_worker_system: "Расширение программы выдачи виз для квалифицированных специалистов."
 JAP_guest_worker_system_desc: "Япония расширит программу виз для квалифицированных специалистов (tokutei gino), позволяющую привлекать работников по срочным контрактам в строительстве, сельском хозяйстве, сфере ухода за больными и на производстве. Они приезжают, выполняют работу и возвращаются домой по окончании контракта, заполняя нехватку рабочей силы без сложностей, связанных с постоянной иммиграцией. Это создает постоянно меняющееся население с минимальной защитой и без участия в жизни общества, а поддержание порядка становится постоянными издержками для бизнеса."
 JAP_an_open_nation: "Открытая нация"
 JAP_an_open_nation_desc: "Население Японии стабилизировалось и выросло за счет миграции, превратив моноэтническую страну в многокультурную. Экономическая стабильность и пенсионная обеспеченность сохранены, но чувство этнической однородности подорвано, и старшее поколение оплакивает уходящую нацию. Уровень полицейской деятельности, образования и социального обеспечения для населения, численность которого увеличилась быстрее, чем были созданы соответствующие институты, останется на высоком уровне еще на протяжении целого поколения."
 JAP_economic_sectors: "Экономические сектора Японии"
 JAP_economic_sectors_desc: "От укоренившихся в стране сельскохозяйственных, лесных и рыболовных угодий до обрабатывающей промышленности, сферы услуг и передовых технологий — мы будем использовать сильные стороны Японии во всей промышленной сфере. Поддерживая внутреннюю занятость и производственные мощности, мы будем балансировать между экспортной конкурентоспособностью и инвестициями в новые перспективные области, продвигая нашу промышленную базу в следующую эпоху."
 JAP_agricultural_revitalization: "Возрождение первичных отраслей промышленности"
 JAP_agricultural_revitalization_desc: "Министерство сельского хозяйства, лесного хозяйства и рыболовства впервые за четверть века пересматривает Основной закон, объединяя все три сектора в единую национальную стратегию продовольственной безопасности. Поскольку средний возраст фермеров приближается к семидесяти годам, а поля в сельской местности приходят в упадок, эта интеграция становится основой для восстановления сельских районов и всех последующих реформ."
 JAP_corporate_farm_consolidation: "Земельные банки и конец Гентана"
 JAP_corporate_farm_consolidation_desc: "Банки консолидации сельскохозяйственных земель объединяют разрозненные участки в более крупные хозяйства, а отмена квоты на выращивание риса сорта гентан положит конец полувековой практике выплаты фермерам компенсаций за оставление полей под паром. Механизация и рыночная дисциплина повысят производительность, но мелкие семейные фермеры, неспособные конкурировать, будут вытеснены с земли."
 JAP_revitalize_rural_communities: "Стратегия регионального возрождения"
 JAP_revitalize_rural_communities_desc: "Под эгидой программы «Чихо Сосэй» правительство поддерживает сельское хозяйство в отдаленных районах посредством прямых выплат и направляет городские средства обратно в деревни через местный налог, привлекая молодые семьи к поселению там, где поля в противном случае превратились бы в дикую местность. Рост здесь происходит медленнее, чем корпоративная консолидация, но он поддерживает жизнь в сельской местности."
 JAP_smart_rice_farming: "Разумное сельское хозяйство и искусство саке"
 JAP_smart_rice_farming_desc: "Япония сочетает традиции выращивания риса с интеллектуальным сельским хозяйством: спутниковая навигация, дроны и рисовые поля с датчиками позволяют сокращающейся и стареющей рабочей силе обрабатывать больше земли меньшим количеством рук. Премиальные бренды, такие как Koshihikari, и глобальный спрос на японское саке доставляют урожай на столы как внутри страны, так и за рубежом."
 JAP_premium_wagyu_brand: "Бренд экспорта вагю"
 JAP_premium_wagyu_brand_desc: "Опираясь на защищенные географические указания и закон, защищающий генетику вагю от контрабанды, Япония развивает эту породу, превращая ее в премиальный экспортный товар, цена которого определяется происхождением и качеством, а не объемом производства. Лучшие рестораны мира будут подавать японскую говядину."
 JAP_sustainable_fisheries: "Реформа Закона о рыболовстве"
 JAP_sustainable_fisheries_desc: "Реформа Закона о рыболовстве 2018 года, первая за семьдесят лет, устанавливает научно обоснованные квоты на вылов и поощряет ответственное рыболовство, одновременно направляя инвестиции в аквакультуру — от разведения голубого тунца до выращивания прибрежных моллюсков. Устойчивое состояние морей обеспечит функционирование прибрежных городов и снабжение страны продовольствием."
 JAP_forestry_revival: "Налог на охрану лесной окружающей среды"
 JAP_forestry_revival_desc: "Благодаря финансированию за счет налога на охрану лесной окружающей среды, Япония проводит прореживание и повторную посадку заброшенных плантаций кедра и кипариса, механизирует лесозаготовку и продвигает использование клееного бруса, чтобы отечественная древесина возвращалась на строительные площадки. Возрождение лесного сектора возвращает рабочие места в горные деревни и превращает долгое время простаивавший ресурс в национальную силу."
 JAP_pharmaceutical_powerhouse: "Преодоление задержки в получении наркотиков"
 JAP_pharmaceutical_powerhouse_desc: "Третий по величине фармацевтический рынок Японии занимают компании Takeda, Astellas, Daiichi Sankyo и Chugai, однако растущее отставание в поставках лекарств приводит к тому, что пациенты годами ждут лекарств, доступных за рубежом. Правительство упрощает процедуру утверждения PMDA и поддерживает биотехнологии и регенеративную медицину, превращая зрелую отрасль в двигатель высокодоходного роста."
 JAP_rural_revitalization: "Шестая индустриализация"
 JAP_rural_revitalization_desc: "В рамках шестой индустриализации, рокудзи сангёка, производители сельскохозяйственной продукции также перерабатывают и продают то, что производят. Проживание на фермах, фирменные региональные продукты питания и прямые продажи потребителям превращают испытывающие трудности деревни в привлекательные места, привлекая молодые семьи обратно на землю как наиболее надежную опору в условиях демографического спада."
 JAP_agricultural_construction_drive: "Сельскохозяйственная строительная кампания"
 JAP_agricultural_construction_drive_desc: "Согласованные общенациональные усилия по началу строительства новых сельскохозяйственных угодий и объектов сельской инфраструктуры при наличии политической воли и субсидий, ускоряющие строительство по всей сельской местности."
 JAP_automotive_industry: "Колеса нации"
 JAP_automotive_industry_desc: "Семь японских производителей в совокупности собирают восемь миллионов автомобилей в год, обеспечивая примерно каждое двенадцатое рабочее место в Японии, включая производство комплектующих, дилеров и грузоперевозки. От сборочных цехов в Айти до экспортных причалов в Йокогаме Япония будет защищать свои позиции крупнейшего в мире экспортера автомобилей."
 JAP_lean_production_system: "Производственная система Toyota"
 JAP_lean_production_system_desc: "Производственная система Toyota сформировала современное производство благодаря принципам «точно в срок», дзидока и кайдзен, направленным на устранение муда (недостатков), что позволило японским заводам производить больше автомобилей с меньшим количеством дефектов и меньшими запасами, чем любой конкурент. Япония распространит принципы бережливого производства во всей промышленности, обучая поколение видеть потери там, где другие их не видят."
 JAP_keiretsu_supplier_network: "Веб-сайт поставщиков Keiretsu"
 JAP_keiretsu_supplier_network_desc: "За каждым готовым автомобилем стоит пирамида поставщиков, связанных многолетним доверием: Denso, Aisin, Toyota Industries и тысячи более мелких предприятий, каждое из которых является мастером своего дела благодаря дисциплине монодзукури. Япония будет укреплять эти связи кейрецу и гарантировать выживание поставщиков второго и третьего уровня, делая устойчивость цепочки поставок стратегическим активом."
 JAP_precision_machine_tools: "Роботы, которые строят автомобили"
 JAP_precision_machine_tools_desc: "FANUC и Yaskawa доминируют на мировом рынке промышленных роботов, а Yamazaki Mazak, DMG Mori и Okuma устанавливают стандарты в области прецизионных станков. По мере старения и сокращения численности рабочей силы Япония будет вкладывать значительные средства в робототехнику и мехатронику, сохраняя за собой роль предприятия, оснащающего заводы по всему миру."
 JAP_domestic_champions: "Lexus Standard"
 JAP_domestic_champions_desc: "Компания Lexus доказала, что Япония может бросить вызов немецким производителям автомобилей класса люкс на их собственной территории, и этот урок с тех пор распространился по всей отрасли. Япония будет развивать ценность бренда, основанную на своих инженерных разработках, и стремиться к высокорентабельным сегментам, конкурируя на качестве и престиже, а не только на цене."
 JAP_hybrid_powertrains: "Гибридная революция"
 JAP_hybrid_powertrains_desc: "Prius доказал, что Япония может рисковать там, где другие опасаются, объединив бензиновый двигатель и электромотор, не требуя при этом сети зарядных станций, которой в мире еще не было. Япония будет и дальше двигаться по этому гибридному пути, совершенствуя его в прагматичный мост между нефтяной эрой и тем, что нас ждет в будущем."
 JAP_battery_electric_shift: "Электромобильная авантюра на батарейках"
 JAP_battery_electric_shift_desc: "Nissan Leaf стал первым электромобилем массового производства, однако с тех пор Япония наблюдает, как конкуренты стремительно развивают производство автомобилей исключительно на аккумуляторных батареях. Чтобы наверстать упущенное, правительство выделяет значительные средства на программы по разработке твердотельных элементов питания и создает волну отечественных гигафабрик, благодаря чему самая ценная часть автомобиля производится внутри страны."
 JAP_hydrogen_society: "На пути к водородному обществу"
 JAP_hydrogen_society_desc: "Седан Mirai на топливных элементах и «Основная водородная стратегия» описывают концепцию, согласно которой автомобили, грузовики, дома и электростанции работают на самом распространенном элементе во Вселенной, не выделяя ничего, кроме воды. Япония построит сеть заправочных станций и поддержит производителей топливных элементов, рассматривая водород как сугубо японский ответ на вопрос о прекращении использования двигателей внутреннего сгорания."
 JAP_automotive_superpower: "Мобильная сверхдержава"
 JAP_automotive_superpower_desc: "Японии не придётся выбирать один-единственный путь в будущее. Освоив одновременно гибридные технологии, аккумуляторные батареи и топливные элементы, и сохранив при этом лучшие в мире производственные мощности и сеть поставщиков, Япония обеспечит себе место транспортной сверхдержавы столетия."
 JAP_automotive_retooling_drive: "Переоснащение сборочной линии"
 JAP_automotive_retooling_drive_desc: "Национальная программа по переоснащению и модернизации автомобильных сборочных линий, перепланировке заводов для производства автомобилей следующего поколения при условии наличия инвестиций и политической воли."
 JAP_battery_gigafactory_program: "Программа создания гигафабрики по производству аккумуляторов"
 JAP_battery_gigafactory_program_desc: "Целенаправленные усилия по созданию отечественных гигафабрик по производству аккумуляторов, быстрое наращивание мощностей по производству элементов питания, чтобы «сердце» электромобиля производилось внутри страны, а не импортировалось."
 JAP_motorcycle_kingdom: "Королевство Двух Колес"
 JAP_motorcycle_kingdom_desc: "Honda, Yamaha, Kawasaki и Suzuki производят подавляющее большинство мотоциклов с двигателями внутреннего сгорания в мире, от городских мотоциклов с низкой рамой, которыми пользуются сотни миллионов людей в Юго-Восточной Азии, до литровых супербайков, доминирующих в MotoGP и World Superbike. Япония будет инвестировать в заводы по производству мотоциклов и защищать свое инженерное лидерство, которое не позволяет конкурентам, стремящимся к японским двигателям, отставать на целое поколение."
 JAP_kei_car_mobility: "Нация кей-каров"
 JAP_kei_car_mobility_desc: "Почти две пятых новых автомобилей, продаваемых в Японии, относятся к классу кей-каров — малолитражкам с объемом двигателя не более 660 куб. см, что предусмотрено налоговым кодексом, разработанным для более бедных стран. По мере старения населения за пределами городов, кей-кары становятся последним практическим способом для пенсионеров добраться до клиники или магазина. Япония сохранит доступные цены и высокое качество автомобилей класса кей-каров, поддерживая мобильность там, где больше не ходят поезда."
 JAP_jdm_soft_power: "Gran Turismo Nation"
 JAP_jdm_soft_power_desc: "Skyline GT-R, Supra и RX-7 стали мировыми иконами автомобильной культуры благодаря таким аниме, как Initial D и франшизе Gran Turismo, которые привили целому поколению игроков любовь к японскому значку JDM. Япония будет развивать этот экспорт имиджа наряду с металлургией, поддерживая тюнинговые мастерские, культуру горных гонок и наследие автоспорта, которые делают японские спортивные автомобили объектами всеобщего обожания."
 JAP_export_wharves: "Экспортные причалы"
 JAP_export_wharves_desc: "Примерно половина всех автомобилей, собранных в Японии, поступает на автовозы в Йокогаме, Нагое или Кобе, откуда затем отправляется в порты по всему миру, что делает Японию крупнейшим в мире экспортером автомобилей. Правительство расширит причалы, сортировочные станции и парк автовозов, обеспечивающих бесперебойный поток этих автомобилей."
 JAP_automotive_export_drive: "Программа стимулирования экспорта автомобильной продукции"
 JAP_automotive_export_drive_desc: "Временная общенациональная инициатива по расширению мощностей сборочных и экспортных заводов, предусматривающая увеличение смен и производственных площадей на автомобильных и комплектующих заводах в период полной загрузки портфеля экспортных заказов."
 JAP_electronics_revitalization: "Возрождение электроники и полупроводников"
 JAP_electronics_revitalization_desc: "Японская электронная промышленность была вытеснена с рынков, которые она когда-то доминировала, конкурентами из Кореи, Тайваня и Китая. В рамках стратегии возрождения полупроводниковой отрасли, проводимой Министерством экономики, торговли и промышленности Японии (METI), государство мобилизует сохранившиеся сильные стороны в области материалов, инструментов и точного машиностроения для восстановления конкурентоспособности. Прежнее господство в производстве микросхем можно восстановить, если сейчас начнутся инвестиции."
 JAP_semiconductor_materials: "Мастера материалов и оборудования"
 JAP_semiconductor_materials_desc: "Япония никогда не теряла контроля над цепочкой поставок микросхем: Tokyo Electron доминирует в производстве оборудования для осаждения и травления, Shin-Etsu и SUMCO поставляют кремниевые пластины по всему миру, а JSR и Tokyo Ohka контролируют рынок фоторезистов. Правительство наращивает инвестиции в этот сегмент, в результате чего каждое зарубежное предприятие зависит от японских материалов и японского оборудования."
 JAP_rapidus_moonshot: "«Лунный прорыв Рапидус»"
 JAP_rapidus_moonshot_desc: "Компания Rapidus, поддерживаемая Toyota, Sony и государством, стремится построить завод по производству полупроводниковых чипов с точностью до двух нанометров в городе Читосе на Хоккайдо в партнерстве с IBM и imec. Ни одна японская компания уже много лет не осваивала передовые технологии, и разрыв с TSMC исчисляется миллиардами. Если ей это удастся, Япония мгновенно вернется на передовые позиции в отрасли."
 JAP_foundry_partnership: "Партнерство литейного завода Кумамото"
 JAP_foundry_partnership_desc: "В то время как Rapidus рискует, используя передовые технологии, JASM в Кумамото сотрудничает с TSMC и Sony для производства зрелых технологических узлов для автомобилей и датчиков. Это более низкий потолок, чем амбициозные проекты, и нижний предел для экономики: чипы, производимые внутри страны в больших объемах, для отраслей, которые не могут позволить себе дефицит."
 JAP_semiconductor_sovereignty: "Суверенитет полупроводников"
 JAP_semiconductor_sovereignty_desc: "Дизайнерские бюро, производители инструментов, поставщики материалов и заводы по производству полупроводников объединены в самоподдерживающуюся внутреннюю экосистему. В эпоху экспортного контроля и узких мест Япония больше не будет зависеть от иностранной доброй воли в отношении кремниевых компонентов, на которых держится ее экономика."
 JAP_home_electronics: "Призрак Галапагосских островов"
 JAP_home_electronics_desc: "«Галапагосский синдром» оставил японскую бытовую электронику блестящей на родине, но непригодной для продажи за рубежом, а кнопочные телефоны в стиле «гара-кей» устарели в тот же момент, когда появился смартфон. Sharp, Sony и Panasonic были вытеснены с рынков, которые когда-то доминировали. Государство поддерживает то, что осталось, сохраняя сборочные линии и ремесла, пока отрасль не встанет на ноги."
 JAP_gaming_powerhouse: "Игровая держава"
 JAP_gaming_powerhouse_desc: "Консоли Nintendo входят в число самых продаваемых за всю историю, PlayStation от Sony является основой глобальной империи, а Capcom, Sega, Square Enix и Bandai Namco поставляют программное обеспечение для обеих компаний. Правительство расширяет инвестиции в студии и оборудование, а также расширяет кадровый резерв, благодаря чему Япония остается в центре интерактивных развлечений."
 JAP_rights_and_licensing_regime: "Права и лицензирование за рубежом"
 JAP_rights_and_licensing_regime_desc: "Аниме, манга, игры и музыка продвигают имидж Японии дальше, чем любое посольство, и инициатива Cool Japan существует для того, чтобы превратить этот охват в доход. Государство инвестирует в распространение, перевод и управление правами, чтобы творческая продукция приносила доход за рубежом, а не утекала туда. Каждая лицензия подписывается в соответствии с иностранным договорным правом и иностранными стандартами вещания, и индустрия усваивает это на практике, заключая сделки одну за другой."
 JAP_broadband_nation: "Страна на волоконно-оптической сети"
 JAP_broadband_nation_desc: "Компания NTT и её конкуренты проложили оптоволокно до домов, когда большая часть мира ещё использовала медные кабели, обеспечив Японии одну из самых быстрых и дешёвых сетей связи в мире. Правительство расширяет высокоскоростные оптоволоконные сети в последние недостаточно охваченные услугами долины и острова, чтобы ни один уголок страны не был отрезан от цифровой экономики."
 JAP_beyond_5g: "На пути к технологиям за пределами 5G"
 JAP_beyond_5g_desc: "Япония оказалась в стороне от войны смартфонов и не намерена упускать возможности, предоставляемые технологией Beyond 5G. Государство финансирует исследовательские консорциумы и открытые сетевые архитектуры, от сетей радиодоступа до оптических магистралей, поэтому японские компании сами определяют условия развития сетей 2030-х годов, а не просто покупают их."
 JAP_electronics_superpower: "Электронная сверхдержава вновь"
 JAP_electronics_superpower_desc: "Материалы, заводы на Хоккайдо и Кюсю, консоли и волоконно-оптическая инфраструктура теперь составляют всю электронную архитектуру. Старый мастер кремниевой эры пробился обратно на передовые позиции. Сеулу, Тайбэю и Шанхаю предстоит считаться с возвращением Японии."
 JAP_energy_resource_strategy: "Стратегический энергетический план"
 JAP_energy_resource_strategy_desc: "Министерство экономики, торговли и промышленности координирует реализацию Базового плана развития энергетики в таких областях, как производство электроэнергии, устойчивость энергосистемы и обеспечение безопасности ресурсов, чтобы защитить страну от энергетических потрясений. От атомной энергетики до возобновляемых источников энергии и стратегических резервов, это ведомство направляет всю государственную структуру на обеспечение бесперебойного электроснабжения и бесперебойной работы металлургических заводов."
 JAP_renewable_energy_expansion: "Революция в сфере тарифов на электроэнергию, вырабатываемую из возобновляемых источников"
 JAP_renewable_energy_expansion_desc: "Тарифы на электроэнергию, вырабатываемую из возобновляемых источников, высвобождают солнечные электростанции по всему Кюсю и ветряные электростанции у берегов Акиты, а стандарты энергоэффективности Top Runner сокращают потери энергии на каждом бытовом приборе и производственной линии. Kyocera и Sharp переходят на рынок солнечной энергии. Солнце и ветер никогда не будут заморожены."
 JAP_power_grid_stabilization: "Никогда больше в темноте"
 JAP_power_grid_stabilization_desc: "Новые преобразователи частоты и межсистемные соединения объединяют страну в единую устойчивую систему, преодолевая разрыв в 50 герц на востоке и 60 герц на западе, который когда-то разделял энергосистему. Энергетическим компаниям предписано поддерживать резервные мощности и выбирать, какая энергия — солнечная, тепловая или накопительная — будет использоваться для реагирования на каждый возникающий скачок напряжения."
 JAP_resource_security_initiative: "Обеспечьте устойчивость основных структур промышленности."
 JAP_resource_security_initiative_desc: "Национальная стратегия в области ресурсов охватывает стратегические запасы, зарубежные горнодобывающие предприятия, переработку отходов и исключительную экономическую зону, и все это направлено на защиту промышленности от эмбарго. Министерства направляют сталь, нефть и редкие металлы на заводы, которые в них больше всего нуждаются, превращая зависимость от импорта в управляемую устойчивость."
 JAP_hydroelectric_power: "Используйте возможности горных рек"
 JAP_hydroelectric_power_desc: "Крутые, питаемые дождевой водой реки Японии приводят в движение надежные турбины, а гидроаккумулирующие электростанции, такие как Каннагава, накапливают дешевую ночную электроэнергию для вечернего пика. Модернизированные плотины позволяют увеличить выработку электроэнергии за счет уже имеющейся в стране инфраструктуры. Поток чистой, внутренней и постоянной воды."
 JAP_hydroelectric_power_TT: "Увеличение выработки гидроэлектроэнергии в §Y[613.GetName]§!, §Y[615.GetName]§! и §Y[616.GetName]§! на §G25%§!"
 JAP_geothermal_development: "Огонь под островами"
 JAP_geothermal_development_desc: "Японская организация по безопасности металлов и энергетики финансирует геотермальную разведку от острова Хатидзёдзима до высокогорья Аппи, несмотря на возражения национальных парков и владельцев горячих источников. Электростанции с бинарным циклом обеспечивают постоянное электроснабжение днем и ночью независимо от погоды, используя тепло Тихоокеанского огненного кольца для питания энергосистемы."
 JAP_geothermal_development_TT: "Увеличение выработки геотермальной энергии в §Y[609.GetName]§!, §Y[616.GetName]§! и §Y[617.GetName]§! на §G25%§!"
 JAP_nuclear_restart: "Перезапустите реакторы"
 JAP_nuclear_restart_desc: "В рамках политики «зеленой трансформации» правительство возвращает в строй атомные электростанции из Сендая на Кюсю на обширный комплекс Касивадзаки-Карива в Японском море. Регуляторы строги, а общественность насторожена, но расчеты энергетической безопасности беспощадны. Атом снова должен нести основную нагрузку.\n-------------\nВозобновляет работу атомной энергетики и открывает §YПрограмму перезапуска реактора§!, в рамках которой каждая станция возвращается в строй по очереди. Сендай, Иката и кластер Фукуи могут быть запущены одновременно; более сложные участки будут запущены по мере завершения работ по регулированию и получению разрешений."
 JAP_nuclear_regulatory_compliance: "Соответствует новым стандартам безопасности."
 JAP_nuclear_regulatory_compliance_desc: "Станции, претендующие на перезапуск, должны соответствовать самым строгим в мире стандартам Управления по ядерному регулированию: сейсмо- и цунамиустойчивость, обязательные средства обеспечения безопасности и проверка, не дающая никаких гарантий. Эта работа медленная и чрезвычайно дорогостоящая, и это единственный путь к созданию действующего парка станций. Станция, прошедшая все необходимые проверки, работает лучше, чем раньше.\n-------------\nСнимает национальный дух §YУжесточение стандартов ядерной безопасности§! и открывает перезапуск в Генкай, Онагава и Симане."
 JAP_local_consent_accords: "Заручиться местным согласием"
 JAP_local_consent_accords_desc: "Для перезапуска требуется не только одобрение регулирующего органа, поскольку губернаторы префектур и принимающие муниципалитеты обладают фактическим правом вето, а районные суды и раньше выносили судебные запреты. Кагосима и Эхиме разрешили перезапуск в Сендае и Икате благодаря согласованным соглашениям с принимающими сообществами, предусматривающим гранты, рабочие места и терпеливое доверие местных жителей. Система субсидирования обходится дорого, и именно она делает возможными самые сложные перезапуски.\n-------------\nОткрывается перезапуск в Томари и Касивадзаки-Карива, двух самых сложных объектах в стране."
 JAP_restart_flagship_fleet: "Топливный цикл Роккашо"
 JAP_restart_flagship_fleet_desc: "Завод по переработке ядерного топлива в Роккасё, префектура Аомори, замыкает топливный цикл, извлекая плутоний и уран из отработанного топлива для использования в новых реакторах. Япония располагает отделенным плутонием и имеет потенциал для его дальнейшего обогащения, и этот факт Пекин, Сеул и Пхеньян ни разу не упустили из виду.\n-------------\nСоседи Японии будут смотреть на эти запасы §Rс неодобрением§!."
 JAP_decommissioning_authority: "Длительное отключение"
 JAP_decommissioning_authority_desc: "Безопасный демонтаж всего парка реакторов занимает десятилетия, требует сокращения числа инженеров-ядерщиков и управления площадкой еще долго после вывода реакторов из эксплуатации. Общественность вздохнула с облегчением, а финансовое положение – нет. Каждый стареющий парк реакторов в мире сталкивается с той же проблемой, и страна, которая первой освоит эту работу, сможет продать свой опыт всем остальным.\n-------------\nОткрывается проект преобразователя частоты, межсистемного соединения Хоккайдо и водородного проекта в Кобе."
 JAP_lng_bridge_supply: "Мост ископаемых"
 JAP_lng_bridge_supply_desc: "Сжиженный природный газ и уголь заполняют пробел, образовавшийся после простоя реакторов, что делает Японию крупнейшим в мире импортером СПГ. Газовые электростанции в Футцу и Сенбоку можно быстро построить и эксплуатировать на полную мощность, но каждая партия оплачивается в иностранной валюте. Разница покрывается счетом за электроэнергию для домохозяйств.\n-------------\nМост, и притом §Rдорогостоящий§!. Проект совместного сжигания аммиака — вот как Япония в итоге сойдёт с него."
 JAP_renewable_acceleration: "Солнце, ветер и вода"
 JAP_renewable_acceleration_desc: "Аукционы по продаже электроэнергии от морских ветроэлектростанций в зонах Акита и Тиба, крупномасштабные солнечные электростанции и пересмотренные правила подключения к сети приводят к более быстрому росту доли возобновляемых источников энергии, чем это когда-либо удавалось достичь с помощью одного лишь тарифа на электроэнергию, вырабатываемую в сети. Тем не менее, сохраняются ограничения, связанные с нестабильностью и состоянием сети, а самый дешевый киловатт-час по-прежнему остается тем, который Япония научилась не использовать."
 JAP_fusion_energy_program: "Более широкий подход"
 JAP_fusion_energy_program_desc: "Япония отказалась от размещения проекта ITER и в обмен на это выбрала более широкий подход: ускоритель термоядерных материалов и международный исследовательский центр в Роккасё, а также токамак JT-60SA в Нака. Сверхпроводящие катушки, гиротроны и длительная подготовка в области физики плазмы — вот что стало результатом этой сделки.\n-------------\nНезависимо от того, перезапустятся реакторы или будут сворачиваться, аргументы в пользу термоядерного синтеза остаются в силе. Это единственная ставка на развитие энергетики, которую §Yни один из путей не исключает§!."
 JAP_national_energy_security: "Нация, движимая силой"
 JAP_national_energy_security_desc: "Стабильное и устойчивое энергоснабжение (восстановленная базовая нагрузка или сеть, использующая возобновляемые источники энергии и системы хранения), основанное на научно-исследовательской базе, охватывающей период после ядерного деления. Энергетическая безопасность становится фундаментом всей экономики."
 JAP_monarchy_resource_anchor_tt: "Эффекты §Y$JAP_rare_earth_resilience$§! будут улучшены."
 JAP_reactors_recommissioned_tt: "Закрытые реакторы §Grecommissioned§! могут снова начать вырабатывать электроэнергию."
 JAP_national_energy_security_tt1: "После возобновления работы §Y6§! из §Y8§! реакторных площадок (в настоящее время §Y[?JAP_reactor_sites_online|0]§!):"
 JAP_national_energy_security_tt2: "С §Y6§! из §Y8§! реализованных проектов по «зелёной» трансформации (в настоящее время §Y[?JAP_gx_projects_completed|0]§!):"
 JAP_national_energy_security_tt3: "Не достигнув ни одной из этих целей:"
 JAP_minamitori_deep_sea: "Грязь Минамитори"
 JAP_minamitori_deep_sea_desc: "На морском дне в пределах исключительной экономической зоны Японии вокруг Минамиторисимы находятся редкоземельные иловые породы в концентрациях, не встречающихся больше нигде на планете, под водой на глубине более пяти тысяч метров. JOGMEC и Токийский университет финансируют буровой трубопровод и испытания по подъему, которые позволят вообще осуществить добычу. Если удастся поднять ил, Япония перестанет зависеть от единственного иностранного поставщика металлов, необходимых для ее магнитов и двигателей."
 JAP_national_petroleum_stockpile: "Пополните национальные резервы"
 JAP_national_petroleum_stockpile_desc: "Японская организация по безопасности металлов и энергетики расширяет стратегический нефтяной резерв, хранящийся на прибрежных нефтехранилищах в Сибуши, Киире и Томакомаи, добавляя соляные пещеры и наземные силосы. Увеличение резерва обеспечивает стране страховку на несколько месяцев на случай закрытия Ормузского пролива. Полный бак – это тихая энергия."
 JAP_grid_battery_storage: "Энергетическая сеть будущего"
 JAP_grid_battery_storage_desc: "Компании GS Yuasa и Panasonic, ветераны литий-ионной эры, переориентируют свои элементы на крупномасштабное хранение энергии в энергосистемах, а государственные субсидии обеспечивают установку батарей рядом с подстанциями. В сочетании с более интеллектуальной энергосетью системы хранения энергии сглаживают пики и заполняют спады. Сохраненные в полдень электроны освещают город в сумерках."
 JAP_urban_mining: "Добывайте руду в городах"
 JAP_urban_mining_desc: "На своих заводах в Наосиме и Онахаме компания Mitsubishi Materials извлекает золото, медь и редкие металлы из электронного лома, поступающего со всего мира. Медали Олимпийских игр в Токио были отчеканены из переработанного металла. То, что страна выбрасывает, она переплавляет заново."
 JAP_horizontal_recycling: "Металл без конца"
 JAP_horizontal_recycling_desc: "Горизонтальная переработка возвращает алюминий и сталь к их первоначальному состоянию, замыкая цикл между пунктом приема металлолома и прокатным станом. Компании UACJ и Kobe Steel строят линии сортировки и рафинирования, которые обеспечивают переработку алюминиевых и стальных деталей в промышленных масштабах. Тонна, остающаяся в обращении, – это тонна, которая никогда больше не будет импортирована."
 JAP_nankai_methane_hydrate: "Огненный лед Нанкайской впадины"
 JAP_nankai_methane_hydrate_desc: "Японская организация по безопасности металлов и энергетики направляет свои исследовательские суда на разработку коммерческого метода добычи метановых гидратов, содержащихся в Нанкайской впадине у побережья Тихого океана. Япония провела там первое в мире испытание по добыче на шельфе, однако инженерные решения остаются непроверенными, а экономическая целесообразность – крайне сложной задачей. Если ледовая обстановка поддастся, Японии больше никогда не придется просить газ."
 JAP_model_competition: "Восточноазиатская конкуренция в электронике"
 JAP_model_competition_desc: "Японская электронная промышленность находится в неустанной конкуренции со своими соседями. Samsung и SK Hynix доминируют в производстве памяти, TSMC владеет передовым бизнесом по производству микросхем, а китайские заводы поднимаются по технологической лестнице шаг за шагом при поддержке практически бездонного государственного фонда. Каждое продвижение конкурента — это потерянный рынок, сокращенная прибыль, поколение инженеров, переманиваемых за границу. Только устойчивые инвестиции сдерживают это давление; если оно ослабнет, а конкуренция усилится, почва уйдёт из-под ног Японии.\n-------------\nПоднятие §YElectronics Resilience§! над конкурентным давлением ослабляет и в конечном итоге устраняет этот национальный дух. См. §Y$JAP_technological_isolation_category$§! для текущих данных."
 JAP_consumer_electronics_drive: "Направление потребительской электроники"
 JAP_consumer_electronics_drive_desc: "Временная мера, направленная на поддержание работы производственных линий бытовой электроники на внутреннем рынке, обеспечение функционирования заводов, поставщиков и квалифицированных специалистов по сборке в период кризиса."
 JAP_foundry_localization: "Программа локализации литейного производства"
 JAP_foundry_localization_desc: "Целенаправленные усилия по локализации цепочки поставок литейного производства, развертыванию оборудования, материалов и подготовке квалифицированных специалистов вокруг новых заводов, чтобы отечественное производство микросхем могло быстро нарастить темпы."
 JAP_electronics_export_offensive: "Наступление на экспорт электроники"
 JAP_electronics_export_offensive_desc: "Разработать скоординированную программу субсидирования, торговых миссий и совместных маркетинговых мероприятий для возвращения доли рынка у иностранных конкурентов, а также вложить значительные средства в укрепление позиций Японии в мировой торговле электроникой."
 JAP_electronics_resilience_up_tt: "§YElectronics Resilience§! против иностранной конкуренции: $RIGHT|+=0$"
 JAP_CHI_chip_rivalry: "Соперничество в полупроводниковой отрасли"
 JAP_electronics.1.t: "Азиатские претенденты приближаются"
 JAP_electronics.1.d: "Квартальные показатели выглядят мрачно в Токио. Samsung и SK Hynix увеличили отрыв в сегменте памяти, портфель заказов TSMC переполнен, а китайские литейные заводы выигрывают контракты, которые раньше автоматически доставались Японии. Аналитики открыто говорят о структурном упадке японского сектора электроники. Руководители компаний в Кавасаки и Осаке знают правду: конкуренты больше не догоняют, а вырываются вперед."
 JAP_electronics.1.a: "Мы не уступим рынок без борьбы."
 JAP_electronics.2.t: "Китай выходит на передовые рубежи"
 JAP_electronics.2.d: "Эта новость обрушилась как сокрушительный удар. Китайские заводы, поддерживаемые Национальным фондом интегральных схем и не остановившиеся перед многолетними западными санкциями, достигли передового уровня в производстве логических микросхем, до которого могут дотянуться лишь немногие компании в мире. Последнее комфортное предположение японской промышленности о том, что материковый Китай отстает на поколение, исчезло. Граница продвинулась, и Японии предстоит решить, принять ли вызов или остаться позади."
 JAP_electronics.2.a: "Граница сдвинулась. Мы должны ответить."
 JAP_electronics.3.t: "Япония возвращает себе корону Кремниевой долины"
 JAP_electronics.3.d: "Вопреки всем ожиданиям, ситуация изменилась. Японские заводы поставляют продукцию в больших объемах, японские материалы остаются незаменимыми, а японский дизайн и контент пользуются уважением во всем мире. Соперники в Сеуле, Тайбэе и Шанхае никуда не исчезли, но впервые за целое поколение именно они теперь оглядываются назад. Долгое отступление закончилось; Япония снова конкурирует с позиции силы."
 JAP_electronics.3.a: "Япония вновь занимает лидирующие позиции в отрасли."
 JAP_electronics.4.t: "Япония возвращается на передовые позиции в полупроводниковой отрасли."
 JAP_electronics.4.d: "На заводах от Хоккайдо до Кюсю, в исследовательских лабораториях, игровых студиях и волоконно-оптических траншеях, Япония совершила возрождение, которое мало кто считал возможным. Страна, которую десять лет назад списывали со счетов как угасающего лидера электронной эры, пробилась обратно на передовые позиции и дала понять, что намерена там оставаться. Баланс в восточноазиатской технологической гонке изменился, и каждая столица от Сеула до Вашингтона пересматривает свои планы."
 JAP_electronics.4.a: "Замечательное возрождение."
 JAP_demographic_pressure_modifier: "Демографическое давление"
 JAP_demographic_pressure_modifier_desc: "Япония — одно из старейших и наиболее быстро сокращающихся обществ в мире, где смертность превышает рождаемость, а численность трудоспособного населения резко сокращается. Этот кризис создает нагрузку на рабочую силу, поддерживающую производство, доводит бюджеты социального обеспечения и здравоохранения до предела, подрывает финансовую стабильность и испытывает на прочность социальные структуры. Япония сталкивается с взаимосвязанными проблемами по шести направлениям (население, рабочая сила, стабильность, безработица, расходы на здравоохранение и социальные издержки). Последовательные, многогранные реформы в области семейной политики, политики занятости и иммиграции могут облегчить это бремя и вывести страну на путь к стабильному или растущему населению."
 JAP_economy_modifier: "Японская экономика"
 JAP_economy_modifier_desc: "Общий двигатель экономического обновления Японии. По мере того как сменяющие друг друга правительства сталкиваются с демографическим спадом и растущей конкуренцией со стороны Кореи, Китая и Тайваня, реформы затрагивают все столпы экономики: поля и рыболовство, обеспечивающие страну продовольствием, автопроизводители и станкостроительные предприятия, являющиеся опорой экспорта, лидеры полупроводниковой и электронной промышленности, стремящиеся выйти из стагнации, стремление обеспечить энергоснабжение и критически важные ресурсы для архипелага, практически лишённого собственных, и железнодорожные магистрали, соединяющие острова. Каждое достижение здесь даёт накопительный эффект, повышая производительность, эффективность заводов и научных исследований, одновременно изменяя требования, которые Япония предъявляет к своей промышленности, ресурсам и энергосистеме."
 JAP_political_modifier: "Коккай"
 JAP_political_modifier_desc: "Реформы, предпринятые в ответ на демографический кризис, меняют национальную политику, открывая страну для миграции и одновременно проверяя на прочность социальную сплоченность и стабильность нации, не привыкшей к переменам."
 JAP_f15_programe_desc: "Флот истребителей F-15J, выпускаемых по лицензии компанией Mitsubishi, проходит поэтапную модернизацию: на самолетах, которые стоит сохранить, устанавливаются новые радары, бортовые компьютеры и дисплеи кабины, а для остальных оптимизируется цепочка поставок. Ускоряются исследования в области истребительной и аэрокосмической техники, а производство легких и средних самолетов обходится дешевле."
 JAP_submarine_modernization_idea_desc: "Дизель-электрический флот переходит на воздухонезависимые силовые установки, а позже — на литий-ионные элементы, что позволяет увеличить дальность плавания под водой без реактора. Компании Kawasaki и Mitsubishi поочередно строят корпуса на верфи в Кобе, что обеспечивает компетентность двух верфей и снижает себестоимость единицы продукции."
 JAP_carrier_aviation_desc: "Морская авиация с неподвижным крылом возвращается в состав японского флота впервые с 1945 года. Проводится переоценка вертолетоносцев, изучаются авиационные корабли, палубные покрытия и лифты для самолетов с коротким взлетом, и всерьез начинается доктринальная работа по эксплуатации авиагруппы авианосца."
 JAP_keen_sword_operation_idea_desc: "Эти проводимые раз в два года совместные учения с Соединенными Штатами позволяют Морским силам самообороны отработать маневры флота, десантные операции и учения по противовоздушной обороне в масштабах, недоступных им в одиночку. Экипажи возвращаются более подготовленными, а полученные уроки сохраняются и после учений."
 JAP_nuclear_power_program: "Долгосрочная ядерная программа"
 JAP_nuclear_power_program_desc: "Пятьдесят два реактора обеспечивают примерно треть электроэнергии страны, а Долгосрочная программа Комиссии по атомной энергии обязывает Японию к замкнутому топливному циклу, основанному на переработке ядерного топлива на АЭС Роккасё. Эксплуатационные характеристики превосходны, но процесс принятия решений застопорился. Авария на АЭС JCO в Токаимуре унесла жизни двух рабочих и подорвала доверие общественности к отрасли и регулирующим органам, а в марте 2000 года правительство поставило на пересмотр планы строительства всех двадцати предлагаемых станций. Поскольку город Маки отклонил проект своего реактора на референдуме, ни одна префектура не может рассчитывать на принятие нового места для строительства."
 JAP_nuclear_local_consent: "Местные соглашения о согласии"
 JAP_nuclear_local_consent_desc: "Губернаторы префектур и муниципалитеты, принимающие объекты, были вновь вовлечены в процесс посредством обязательных соглашений о безопасности, распределения доходов и права предварительных консультаций по возобновлению работы. Право вето, которое на протяжении целого поколения тормозило строительство атомных электростанций в Японии, было отменено в результате переговоров, а не преодолено, и энергетические компании снова могут планировать новые мощности."
 JAP_consolidate_national_defense_framework_cancel_tt: "Заканчивается, как только бонус §YСтатьи 9§! к §Yстабильности§! ослабнет и штрафы к §Yподдержке войны§! и §Yпопуляции, способной к набору§! будут полностью отработаны"
 JAP_modernize_joint_command_cancel_tt: "Действие заканчивается после того, как полностью будут отработаны штрафы §YСтатьи 9§! к §Yприобретению опыта в армии, воздухе и на флоте§!, §Yкомандной власти§! и §Yзатратам на офицеров§!."
 JAP_normalize_defense_procurement_mission: "Нормализация систем оборонных закупок"
 JAP_normalize_defense_procurement_mission_desc: "Расширение оборонных обязанностей создало значительную нагрузку на существующие системы закупок и промышленного производства. Благодаря тщательной реформе, долгосрочному планированию и более тесной координации с промышленностью Япония стремится нормализовать оборонные закупки и снизить неэффективность переходного периода."
 JAP_normalize_defense_procurement_cancel_tt: "Заканчивается, как только штрафы §YСтатьи 9§! к §Yатаке армии§! и §Yобороне армии§! будут полностью отработаны, а бонусы к §Yатаке на основную территорию§! и §Yобороне основной территории§! ослабнут"
 JAP_establish_asteroid_mining_network_mission: "Создание сети добычи полезных ископаемых на астероидах"
 JAP_establish_asteroid_mining_network_mission_desc: "Япония создает свою первую сеть по добыче полезных ископаемых на астероидах, размещая орбитальные платформы и развертывая разведочное оборудование, поскольку начинают формироваться планы по освоению ресурсов за пределами Земли."
 JAP_reactor_restart_category: "Программа перезапуска реактора"
 JAP_reactor_restart_category_desc: "Пятьдесят четыре реактора когда-то обеспечивали треть электроэнергии Японии. После 2011 года все они были отключены, и их возвращение — это не единое решение, а кампания, проводимая поэтапно, станция за станцией, префектура за префектурой. Каждый перезапуск требует многолетней проверки нормативных требований, согласия губернатора, подотчетного напуганным избирателям, и законопроекта о сейсмоусилении, исчисляющегося сотнями миллиардов иен. В результате страна получает самую дешевую базовую электроэнергию за всю свою историю.\n\nКаждый завершенный перезапуск §Gпостоянно улучшает§! Японская атомная энергетика позволяет снизить затраты на содержание флота атомных электростанций."
 JAP_restart_sendai: "Перезапуск Сендая"
 JAP_restart_sendai_desc: "Два энергоблока с водой под давлением компании Kyushu Electric на АЭС Сацумасэндай в Кагосиме первыми в стране соответствовали новым стандартам безопасности, а в августе 2015 года энергоблок № 1 станции Сендай стал первым японским реактором, начавшим выработку электроэнергии почти за два года. Это стало возможным благодаря согласию губернатора Ито; защитную дамбу, фильтрованный вентиляционный канал и центр управления чрезвычайными ситуациями обеспечили безопасность."
 JAP_restart_ikata: "Перезапустить Иката"
 JAP_restart_ikata_desc: "Электростанция компании Shikoku Electric расположена на узком полуострове Садамисаки в префектуре Эхиме, в нескольких километрах от берега проходит Срединная тектоническая линия. Третий энергоблок возобновил работу в 2016 году, и с тех пор его работа неоднократно приостанавливалась и возобновлялась по решению судов соседних префектур. Ни одна электростанция в Японии не иллюстрирует лучше, что получение лицензии от регулирующего органа — это лишь половина дела."
 JAP_restart_takahama_ohi: "Перезапустите кластер Фукуи."
 JAP_restart_takahama_ohi_desc: "В префектуре Фукуи сосредоточено наибольшее количество реакторов в стране. Энергоблоки компании Kansai Electric в Такахаме, Охи и Михаме десятилетиями обеспечивали электроэнергией промышленность Осаки и Кобе, и некоторые из них уже настолько старые, что для их эксплуатации более сорока лет потребовалось отдельное и спорное расширение. Возобновление работы всего энергоблока одним махом восстановит электроснабжение промышленного центра страны."
 JAP_restart_genkai: "Перезапустить Генкай"
 JAP_restart_genkai_desc: "Электростанция компании Kyushu Electric в префектуре Сага возобновила работу в 2018 году после модернизации, в ходе которой было построено одно из первых специализированных средств безопасности, соответствующих новым правилам. На электростанции Генкай также размещается японская плютермальная электростанция, работающая на смешанном оксидном топливе, которое замыкает часть контура между реакторами и перерабатывающим заводом в Роккасё."
 JAP_restart_onagawa: "Перезапустить Онагаву"
 JAP_restart_onagawa_desc: "Онагава в префектуре Мияги находилась ближе к эпицентру землетрясения 2011 года, чем Фукусима-Дайичи, и её четырнадцатиметровая берегоукрепительная стена выдержала. Жители города разместились в собственном спортивном зале станции. Возобновление работы второго энергоблока в 2024 году стало первым перезапуском кипящего водо-водяного реактора того же типа, что и на Дайичи, и это был самый веский аргумент в пользу запуска."
 JAP_restart_shimane: "Завершите строительство энергоблока №3 АЭС Симане"
 JAP_restart_shimane_desc: "Атомная электростанция компании Chugoku Electric — единственная в Японии атомная электростанция, расположенная в пределах префектурного центра, на окраине самого Мацуэ. Третий энергоблок был построен, но так и не был введен в эксплуатацию, оставаясь недостроенным и простаивающим на протяжении длительного периода простоя. Его ввод в эксплуатацию — это вовсе не перезапуск, а первый шаг, и накопленный в ходе строительства опыт не будет утрачен."
 JAP_restart_tomari: "Перезапустите Томари"
 JAP_restart_tomari_desc: "Три энергоблока компании Hokkaido Electric на АЭС Томари — единственная атомная электростанция на северном острове, и их потеря оставила Хоккайдо в зависимости от узкой межсетевой линии и устаревающих тепловых мощностей, что болезненно продемонстрировало отключение электроэнергии по всему острову в 2018 году. Сейсмическая переоценка площадки затянулась более чем на десятилетие. Восстановление АЭС Томари — это то, что восстанавливает энергосистему Хоккайдо."
 JAP_restart_kashiwazaki_kariwa: "Перезапуск Кашивазаки-Карива"
 JAP_restart_kashiwazaki_kariwa_desc: "Семь энергоблоков на побережье Ниигаты делают эту атомную электростанцию крупнейшей из когда-либо построенных. Она также принадлежит компании TEPCO, которая потеряла Фукусиму, и губернаторы Ниигаты годами отказываются забывать об этом. Нарушения безопасности на объекте на некоторое время лишили компанию права на эксплуатацию. Если удастся восстановить Касивадзаки-Карива, то ничто в этом флоте не останется недостижимым."
 JAP_gx_transition_category: "Зеленая трансформация"
 JAP_gx_transition_category_desc: "Японии без реакторов придётся искать источники энергии где-то ещё, а архипелагу не хватает всего, кроме ветра, тепла и инженеров. Решение — «зелёная трансформация»: плавучие турбины на слишком большой глубине для якорной стоянки, вулканическое тепло под северными горами, наконец-то созданная энергосеть, преодолевающая разрыв между 50 и 60 герцами, и, прежде всего, национальный талант использовать меньше ресурсов, чем кто-либо считал возможным.\n\nКаждый завершенный проект §Gпостоянно улучшает§! Япония либо сократит производство возобновляемой энергии, либо снизит национальный спрос, а также навсегда закроет реакторы в регионе."
 JAP_gx_goto_floating_wind: "Перейти к плавучим морским ветропаркам"
 JAP_gx_goto_floating_wind_desc: "Дно у берегов Японии имеет слишком крутой уклон для стационарных фундаментов, используемых в Северном море, поэтому амбиции страны в области морской ветроэнергетики основаны на плавучих платформах, пришвартованных в глубоководных районах. Комплекс платформ у островов Гото в Нагасаки является полигоном для испытаний этой технологии, а верфи, которые когда-то строили танкеры, — естественное место для изготовления корпусов."
 JAP_gx_tohoku_geothermal: "Геотермальный кластер Тохоку"
 JAP_gx_tohoku_geothermal_desc: "Япония обладает третьими по величине геотермальными запасами на Земле, но практически не использует их, поскольку доступ к ним ограничен границами национальных парков и владельцами горячих источников, которые опасаются, что бурение отнимет у них воду. В 2024 году в Иватэ была запущена первая крупная геотермальная электростанция «Аппи» — первая за десятилетия. Там, где есть вулканы, есть энергия, и она течет как в темноте, так и в тишине."
 JAP_gx_kanto_setsuden: "Кампания Сэцудена"
 JAP_gx_kanto_setsuden_desc: "Летом после катастрофы Токио просто стал потреблять меньше электроэнергии. В офисах приглушили свет и отказались от галстуков, заводы перенесли смены на выходные, и столица прошла пик без предсказанных всеми отключений. Система «Сэцудэн» должна была стать экстренной мерой. Став постоянной благодаря строительным нормам, промышленным стандартам и программе «Топ Раннер», она стоит больше, чем электростанция, и обходится в разы дешевле."
 JAP_gx_frequency_converter: "Расширение частотного преобразователя"
 JAP_gx_frequency_converter_desc: "В Токио используется частота в пятьдесят герц, потому что в 1890-х годах там закупили немецкие генераторы, а в Осаке — шестьдесят, потому что там закупили американские. Столетие спустя две половины страны по-прежнему не могут свободно делить электроэнергию, и в 2011 году запад мог передавать на восток лишь один гигаватт, в то время как Токио оставался без света. Расширение преобразовательных подстанций в Сакуме, Син-Синано и Хигаси-Симидзу наконец-то позволяет объединить две энергосистемы в одну национальную."
 JAP_gx_hokkaido_hvdc: "Межсетевой соединитель Хоккайдо"
 JAP_gx_hokkaido_hvdc_desc: "Хоккайдо обладает лучшими ветровыми ресурсами в Японии, но при этом является страной с наименьшим числом населения, использующего эти ресурсы. Такое сочетание приводит к ограничению работы ветротурбин, в то время как Хонсю использует импортный газ. Высоковольтная линия постоянного тока вдоль побережья Японского моря доставляет северный ветер туда, где он необходим, и, кроме того, она обеспечила бы электроснабжение во время общеостровного отключения электроэнергии в 2018 году."
 JAP_gx_kobe_hydrogen: "Водородная цепочка поставок в Кобе"
 JAP_gx_kobe_hydrogen_desc: "В 2022 году в Кобе пришвартовался первый в мире танкер для перевозки сжиженного водорода, завершив цепочку поставок, идущую от австралийских месторождений бурого угля до терминала на острове Порт-Айленд. Водород сгорает без углерода и накапливает выработанное турбинами топливо, которое пока не может быть использовано энергосетью, и компания Kawasaki Heavy потратила десять лет на строительство танкеров, резервуаров и турбин для его транспортировки."
 JAP_gx_hekinan_ammonia: "Совместное сжигание аммиака"
 JAP_gx_hekinan_ammonia_desc: "Угольная электростанция в Хекинане, префектура Айти, является крупнейшей в стране, и компания JERA подает аммиак в ее котлы наряду с углем, сначала в соотношении 1:5, а затем постепенно увеличивая его концентрацию. Аммиак переносит водород в форме, с которой суда и трубопроводы уже умеют работать, и позволяет существующему парку тепловых электростанций сжигать меньше топлива без демонтажа и перестройки."
 JAP_gx_shikoku_solar_storage: "Солнечная энергетика и накопители Сикоку"
 JAP_gx_shikoku_solar_storage_desc: "На Сикоку самое интенсивное солнечное излучение в Японии, а энергосеть настолько мала, что выработку солнечной энергии в полдень приходится ограничивать из-за нехватки места для её размещения. Сочетание крупномасштабных солнечных электростанций с аккумуляторными батареями позволяет перенести избыток энергии с полуденного пика на вечерний, что представляет собой разницу между существующей на бумаге возобновляемой мощностью и фактически используемой возобновляемой энергией."
 JAP_rubber_butadiene_branch_decision: "Бутадиеновый каучук"
 JAP_rubber_butadiene_branch_decision_desc: "Натуральный каучук может быть сокращен, нормирован или его цена может снизиться, и Япония не может допустить существования этого рычага. Мы расширим производство синтетического каучука на основе бутадиена, чтобы обеспечить поставки шин, уплотнений и критически важных компонентов для промышленности и вооруженных сил."
 JAP_demand_south_kuril_reject_tt: "Мы можем открыть §Yпограничную войну§! из-за §Y$STATE_1168$§!, или §Rобъявить войну [SOV.GetName]§!, чтобы захватить Северные территории силой"
 JAP_demand_north_kuril_reject_tt: "Мы можем открыть §Yпограничную войну§! из-за §Y$STATE_1168$§!, или §Rобъявить войну [SOV.GetName]§!, чтобы захватить Северные территории силой"
 JAP_demand_sakhalin_reject_tt: "Мы можем разблокировать §YРейд спецназа§! на §Y$STATE_691$§!, или §Rобъявить войну [SOV.GetName]§!, чтобы захватить Северные территории силой"
 JAP_claiming_philippines: "Заявить права на Филиппинский архипелаг"
 JAP_claiming_philippines_desc: "Филиппинский архипелаг контролирует подходы к западной части Тихого океана и морские пути, обеспечивающие нашу промышленность. Мы официально заявим о своих правах и ясно дадим понять, что эти острова находятся в стратегической сфере Японии, независимо от того, одобрят это другие или нет. После этого регион поймет, что наш военно-морской флот намерен решать, кто будет проходить через эти воды."
 JAP_demographic_emergency_taskforce: "Снижение рождаемости: реагирование на чрезвычайные ситуации"
 JAP_demographic_emergency_taskforce_desc: "В ответ на демографический коллапс правительство создало общеправительственную оперативную группу по чрезвычайным ситуациям, аналогичную структуре Агентства по делам детей и семей и координирующую оперативное развертывание ресурсов во всех соответствующих министерствах. Политическое внимание приковано к проблеме, бюрократические барьеры преодолеваются, и становится возможным активное проведение политических экспериментов. Этот период интенсивной работы и мобилизации носит временный характер; после 730 дней непрерывных усилий чрезвычайная обстановка спадает, и процесс принятия решений возвращается к обычным институциональным моделям, хотя сами реформы продолжаются."
 JAP_increase_birth_budget: "Чрезвычайное пособие на ребенка, удвоенное"
 JAP_increase_birth_budget_desc: "Япония вложит экстренные средства из казначейства в систему детских пособий, удвоив прямые денежные выплаты семьям с детьми. Эти незамедлительные и заметные расходы окажут поддержку молодым семьям и продемонстрируют приверженность государства родительству, повысив рождаемость в краткосрочной перспективе. Долгосрочные затраты будут значительными, увеличив постоянный бюджет на выплаты, но демографические дивиденды оправдывают расходы, пока рождаемость остается низкой."
 JAP_child_care_subsidies: "Всеобщее бесплатное дошкольное образование и уход за детьми"
 JAP_child_care_subsidies_desc: "В соответствии с политикой, принятой в октябре 2019 года, Япония сделает дошкольное образование и уход за детьми бесплатными для всех семей, отменив плату за обучение в яслях и дошкольных учреждениях. Субсидирование устраняет серьезный барьер для трудоустройства родителей, освобождая лиц, осуществляющих уход за детьми, в первую очередь матерей, от необходимости возвращаться на работу и позволяя семьям с ограниченным доходом иметь больше детей. Программа дорогостоящая, но обеспечивает как рост занятости, так и умеренное улучшение рождаемости."
 JAP_invest_in_robotics: "Движение за автоматизацию общества 5.0"
 JAP_invest_in_robotics_desc: "Япония ускорит реализацию стратегии «Новая робототехника» 2015 года, субсидируя промышленную автоматизацию, искусственный интеллект и робототехнику для компенсации нехватки рабочей силы. Заменив человеческий труд в строительстве, производстве и логистике машинами, Япония сможет поддерживать объем производства при меньшем количестве рабочей силы. Стратегия капиталоемка, но эффективна, однако вытеснение низкоквалифицированных работников может первоначально привести к росту безработицы, прежде чем появятся новые рабочие места в сфере эксплуатации и технического обслуживания."
 JAP_fertility_ivf_program: "Страхование экстракорпорального оплодотворения"
 JAP_fertility_ivf_program_desc: "В Японии расширят страховое покрытие экстракорпорального оплодотворения (ЭКО) и вспомогательных репродуктивных технологий, сделав лечение доступным для всех подходящих пар независимо от уровня дохода. Начиная с 2022 года, страховые субсидии устранят экономический барьер на пути к лечению бесплодия, позволяя парам, которые в противном случае остались бы бездетными, иметь детей. Влияние на рождаемость будет значительным, но бремя расходов системы здравоохранения резко возрастет, оказывая давление на государственные финансы."
 JAP_family_housing_construction: "Программа доступного жилья для семей"
 JAP_family_housing_construction_desc: "Япония профинансирует масштабное строительство доступного жилья для семей, предназначенного для семей с детьми. Высокие цены на землю и жилье являются серьезным препятствием для создания семьи; субсидируемое строительство снижает финансовый порог для молодых пар, желающих вступить в брак и завести детей. Программа требует значительных капиталовложений, но она стабилизирует общество, предлагая молодым семьям реальный путь к собственному жилью и демонстрируя приверженность государства их будущему."
 JAP_marriage_support_program: "Инициатива поддержки молодоженов"
 JAP_marriage_support_program_desc: "Япония будет субсидировать молодоженов, предоставляя им жилищные гранты и услуги по подбору партнеров, включая финансирование программ «конкацу» (поиск брачных партнеров) и платформ для подбора партнеров на основе искусственного интеллекта. Государство также будет сотрудничать с местными органами власти в организации мероприятий по подготовке к свадьбе на уровне общин. Снижая финансовые и социальные барьеры, связанные с заключением брака, программа способствует увеличению рождаемости с меньшими финансовыми затратами, чем одни лишь стимулы к деторождению, хотя эффект от нее невелик."
 JAP_raise_retirement_age: "Закон о стабилизации занятости пожилых людей"
 JAP_raise_retirement_age_desc: "В Японии будет постепенно повышаться официальный пенсионный возраст до 70 лет, что позволит продлить обязательные отчисления с заработной платы и отложить получение права на пенсию. После принятия закона в 2021 году государство будет стимулировать работодателей удерживать работников старшего возраста и настаивать на продолжении трудовой деятельности после традиционного 65-летнего стажа. Это политически болезненно, работники недовольны дополнительными годами работы, и правительству придется потратить политический капитал, чтобы добиться принятия закона, но при этом напрямую увеличится численность рабочей силы и снизится пенсионное бремя."
 JAP_silver_employment_initiative: "Центры управления персоналом Silver"
 JAP_silver_employment_initiative_desc: "Япония создаст и профинансирует центры по трудоустройству для пожилых людей старше 65 лет (Silver Human Resource Centers) в каждом крупном городе, предлагая им частичную занятость, переподготовку и наставничество. Эти центры будут сводить опытных пенсионеров с работодателями, нуждающимися в гибкой рабочей силе в сфере уборки, охраны, ухода за детьми и административной работы. Программа является недорогой, сохраняет достоинство и позволяет увеличить производительность труда без повышения обязательного пенсионного возраста, снижая уровень безработицы при умеренных затратах."
 JAP_preventive_health_program: "Инициатива по повышению ожидаемой продолжительности здоровой жизни"
 JAP_preventive_health_program_desc: "Япония будет инвестировать в профилактическую медицину для всего населения: субсидируемые обследования, вакцинация, консультации по образу жизни и раннее вмешательство при хронических заболеваниях. Поддерживая здоровье и функциональную независимость стареющего населения на более длительный срок, государство сокращает годы, проведенные в дорогостоящих отделениях интенсивной терапии и домах престарелых. Программа носит чисто профилактический характер (не лечение болезней, а их предотвращение) и приносит высокую отдачу в виде снижения затрат на здравоохранение, поскольку пожилые люди остаются активными и самостоятельными до 80 лет."
 JAP_elderly_care_reform: "Модернизация системы долгосрочного ухода"
 JAP_elderly_care_reform_desc: "Япония планирует реструктурировать систему страхования долгосрочного ухода, перейдя от стационарного (дома престарелых) ухода к интегрированному уходу на уровне общины: помощь на дому, дневные центры, местные клиники и поддержка семьи вместо дорогостоящих стационарных учреждений. Сократив зависимость от дорогостоящих учреждений и мобилизовав общины, государство сократит бюджеты здравоохранения и социального обеспечения. Переход будет сопряжен с трудностями: некоторые потеряют предпочитаемый стационарный уход, а администрация столкнется с административными проблемами в период изменений, но долгосрочная экономия будет существенной."
 Japan.105.t: "Провозглашение Империи"
 Japan.105.d: "Прокламация лежит на столе кабинета министров в черновике, рядом с ней печать, а дата оставлена незаполненной. Больше ничего восстанавливать не нужно: дом стоит, обряды соблюдаются, Тайный совет заседает. Неясна только формулировка.\n\nПервым говорит министр армии. Империя измеряется на континенте, в количестве сформированных дивизий и удержанных позиций, и прокламация должна это отражать. Министр флота отвечает, не повышая голоса. Япония — островное государство, живущее своими морскими путями, и штандарт, поднятый над флотом, будет правильно прочитан в каждом порту от Владивостока до Сингапура. Оба мужчины замолкают и смотрят на трон."
 Japan.105.a: "£JAP_EMPIRE_flag     Сила Империи заключается в её армиях."
 Japan.105.b: "£JAP_EMPIRE_NAVAL_flag     Сила Империи — на воде."
 JAP_american_pressure_article_nine_desc: "Вашингтон связал торговый вопрос с оборонным. Угрозы повышениями тарифов и использование ресурсов применяются для того, чтобы подтолкнуть Токио к более широкой военной роли, и до тех пор, пока этот вопрос не будет урегулирован, Япония ведет переговоры с позиции более слабой стороны."
 JAP_jsw_tank_mio_trait_ladle_refining: "Очистка стали с помощью ковшей"
 JAP_jsw_tank_mio_trait_muroran_arc_furnace: "Электродуговые печи Муроран"
 JAP_jsw_tank_mio_trait_high_tensile_plate: "Высокопрочная прокатка листового металла"
 JAP_jsw_tank_mio_trait_scrap_recycling: "Линия по переработке металлолома"
 JAP_jsw_steel_modifier: "Японский сталелитейный завод"
 JAP_jsw_steel_modifier_desc: "Каждый заказ, размещенный на заводе Japan Steel Works, — это заказ, размещенный на заводе Muroran. Печи, в которых отливаются стволы и броневые плиты, — это те же самые печи, которые снабжают верфи, строительные компании и автопроизводителей, и каждый контракт, обеспечивающий их работу на полную мощность, снижает зависимость страны от импортной стали. То, что оборонный бюджет покупает в виде оружейной стали, экономика в целом получает в тоннах."
 JAP_zombie_companies: "Компании-зомби"
 JAP_zombie_companies_desc: "Многолетняя политика снисходительности позволила убыточным, чрезмерно задолженным фирмам выжить за счет дешевых кредитов, связывая капитал, рабочую силу и управленческий персонал, которые необходимы для более здоровых отраслей. Пока эти фирмы не будут реструктурированы или ликвидированы, страдают строительство, производительность и поступления от корпоративного налога.\n-------------\nВоспитание §YПрогресс корпоративной реструктуризации§! открывает §Y$JAP_restructure_next_tranche$§! решение, которое постепенно смягчает этот национальный дух. См. §Y$JAP_corporate_reform_category$§! по текущим показателям."
 JAP_ykk_group: "Группа YKK"
 JAP_ykk_group_desc: "Компания Yoshida Kogyo производит примерно половину всех молний в мире, около семи миллиардов в год, на своих заводах в более чем семидесяти странах. Компания самостоятельно обрабатывает латунь, прядет собственный полиэстер, смешивает собственные красители и производит станки для сборки готовых застежек-молний — вертикальная интеграция, которая не оставляет ничего вне контроля над продуктом. Военные закупки составляют небольшую, но очень требовательную долю этого бизнеса, поскольку застежка на бронежилете, разгрузочном жилете или камуфляжной куртке — это первый компонент, выходящий из строя в полевых условиях. Японские программы по производству униформы и защитного снаряжения опираются на поставщика, который может самостоятельно доработать ремни, покрытие или коррозионностойкий сплав, вместо того чтобы ждать субподрядчика."
 JAP_karoshi_crisis: "Кризис Кароши"
 JAP_karoshi_crisis_desc: "Хроническая переработка изматывает японскую рабочую силу. Чрезмерные неоплачиваемые сверхурочные — культура «сабису дзангё» — ведут к инсультам, сердечной недостаточности и самоубийствам среди служащих, а измотанные семьи откладывают рождение детей. Страдают стабильность, производительность и исследования, растут расходы на здравоохранение и социальную сферу, а население год за годом сокращается.\n-------------\nФокусы реформ и трудовые кампании повышают $JAP_worker_wellbeing$. При §G30§! и §G60§! открывается решение §Y$JAP_enforce_next_reforms$§!, которое смягчает этот национальный дух на одну ступень; фокус в конце выбранной ветки снимает его навсегда. Пока проблема японских §Yкомпаний-зомби§! не решена, каждая кампания даёт вдвое меньше. Текущие показатели — в разделе §Y$JAP_corporate_reform_category$§!."
 JAP_karoshi: "Кароши"
 JAP_karoshi_desc: "Правительство объявило кароши (неуход на работе) национальным кризисом: работники погибают от переутомления, инсульта и сердечной недостаточности за рабочим столом, а также совершают самоубийства после ста часов работы в месяц. Смерть сотрудницы Dentsu Мацури Такахаши вновь вывела эту проблему на национальный уровень и стоила президенту компании его должности. Теперь государству предстоит решить, насколько далеко оно будет вмешиваться в ситуацию на рабочем месте, чтобы сделать работу приемлемой."
 JAP_corporate_laws: "Реформирование Закона о трудовых стандартах"
 JAP_corporate_laws_desc: "Правительство выбирает законодательный путь, закрывая лазейку в статье 36 посредством Закона о реформе стиля работы и заменяя соглашения о гибком графике жесткими потолками, соблюдение которых контролируется усиленной Инспекцией по стандартам труда. Для достижения этой цели необходимо бороться с работодателями и лобби сторонников гибкого графика работы на каждом этапе работы комитетов в парламенте. Это наиболее всеобъемлющий из трех вариантов решения проблемы, и его реализация занимает больше всего времени."
 JAP_cultural_change: "Противостояние культуре переутомления"
 JAP_cultural_change_desc: "Правительство строит свою кампанию на культурных ценностях, а не на законодательстве: в рамках акции «Премиум-пятница» работники раз в месяц уходят домой раньше, на рабочем месте внедряется проверка психического здоровья, а ежегодный «Белый документ Кароши» позволяет работодателям и рекрутерам видеть тела умерших. Ничто из этого не затрагивает негласное правило, согласно которому добросовестные сотрудники уходят только после того, как уйдет начальник отдела. Этот путь предполагает, что отношение Японии к работе изменится снизу, на каждом рабочем месте и в каждой семье."
 JAP_keiretsu_pact: "Переговоры с Кейрецу"
 JAP_keiretsu_pact_desc: "Государство ведет прямые переговоры с группами предприятий и федерацией работодателей «Кэйданрен»: управляемые реформы в обмен на стабильность, сохранение пожизненной занятости и защиту обремененных долгами фирм от сбоев. Никакие законы не принимаются, и ни одна компания не подвергается публичному осуждению, потому что уступки обмениваются на предсказуемость. Это самый медленный путь к реформам и тот, который меньше всего меняет корпоративную Японию."
 JAP_overtime_cap: "Статья 36. Потолок"
 JAP_overtime_cap_desc: "Соглашение о сокращении рабочего времени, поданное в бюро по трудоустройству, превращает установленную законом сорокачасовую рабочую неделю в рекомендацию, а Закон о реформе стиля работы закрывает этот пробел. Сорок пять часов сверхурочной работы в месяц и триста шестьдесят в год становятся установленным законом пределом, никогда не превышающим ста часов в месяц, при этом за этими цифрами стоят уголовные наказания, а не административные указания. Эти цифры соответствуют «линии кароши», которую Министерство здравоохранения, труда и социального обеспечения использует при определении того, был ли инсульт или самоубийство вызваны работой."
 JAP_mandatory_paid_leave: "Пять дней, которые должен взять работник"
 JAP_mandatory_paid_leave_desc: "Обязательство перевернуто: работодатель, предоставляющий десять или более дней отпуска, теперь должен обеспечить фактическое использование как минимум пяти из них, самостоятельно определяя даты, если работник отказывается это сделать. Японские работники испытывают недостаток не столько в отпуске, сколько в разрешении на его использование, и едва ли половина предоставленного отпуска когда-либо используется. Та же поправка заимствует европейский рабочий интервал — одиннадцать часов отдыха между сменами, — хотя и лишь как обязанность приложить усилия."
 JAP_labour_inspection_offices: "Инспекция по соблюдению трудовых стандартов"
 JAP_labour_inspection_offices_desc: "Правительство финансирует Инспекцию по соблюдению трудовых стандартов не для консультирования, а для обеспечения соблюдения законодательства: увеличение числа инспекторов, проведение судебно-бухгалтерской экспертизы для выявления фальсифицированных табелей учета рабочего времени, из-за которых сто часов сверхурочной работы на бумаге превращаются в двадцать, и готовность к судебному преследованию. Несколько тысяч инспекторов не могут контролировать шестьдесят миллионов работников, поэтому большинство нарушений выявляется только после смерти человека и найма адвоката его семьей. Министерство уже публикует названия фирм, нарушающих закон, а сама компания Dentsu была осуждена после смерти Мацури Такахаси."
 JAP_karoshi_prevention_act: "Закон о предотвращении кароши"
 JAP_karoshi_prevention_act_desc: "Парламент принимает Закон о содействии профилактическим мерам против Кароши, обязывающий государство проводить исследования смертей от переутомления, публиковать ежегодный «Белый документ» и придерживаться целевых показателей, по которым можно оценивать результаты: менее пяти процентов работников работают по 60 часов в неделю, 70 процентов фактически использованного оплачиваемого отпуска, обеспечение психического здоровья на каждом предприятии. Цель состоит в том, чтобы обнародовать эти цифры, поскольку в противном случае их можно было бы упустить из виду. Тот же пакет предусматривает исключение для высококвалифицированных специалистов, освобождающее от правил рабочего времени самых высокооплачиваемых работников, — исключение, которое, как ожидают профсоюзы, будет расширено."
 JAP_end_of_karoshi: "Страна, где работа не убивает"
 JAP_end_of_karoshi_desc: "Потолок сверхурочных держится, потому что инспекторы приходят без предупреждения, а за ними следуют прокуроры; отпуск берут, потому что этого требует закон, а работник по контракту рядом с вами получает столько же, сколько и вы. Фирмы, способные выжить лишь за счёт неоплачиваемых часов, ликвидированы, а не подпёрты вечно пролонгируемыми кредитами, так что никому больше не приходится оправдываться тем, что выживание не оставляет выбора. Япония по-прежнему будет много работать, но она перестала считать изнеможение доказательством преданности.\n-------------\nТребуется, чтобы проблема §Yяпонских компаний-зомби§! была полностью решена, §Y$JAP_karoshi_crisis$§! уже смягчён до последней стадии, а $JAP_worker_wellbeing$ составляло не менее §G85§!. Выполнение этого фокуса навсегда снимает кризис кароши."
 JAP_premium_friday: "Премиум-пятница"
 JAP_premium_friday_desc: "Министерство экономики, торговли и промышленности запускает акцию «Премиум-пятница» совместно с компанией Keidanren: в последнюю пятницу каждого месяца сотрудники уходят с работы в три часа и проводят вечер в магазинах, а не за своими рабочими столами. Время выбрано неудачно, поскольку в конце месяца закрываются счета и подсчитываются квоты, и лишь немногие фирмы с энтузиазмом следуют этой акции. Сохраняется прецедент, когда государство устанавливает час и призывает всю страну прекратить работу."
 JAP_ikumen_project: "Проект Икумен"
 JAP_ikumen_project_desc: "Министерство здравоохранения, труда и социального обеспечения проводит кампанию «икумен», чтобы воспитание ребенка стало чем-то, чем можно восхищаться, а не чем-то, что нужно объяснять. Японский отпуск по уходу за ребенком на бумаге является одним из самых щедрых в мире: год частично оплачивается, но почти никто им не пользуется, потому что мужчина, который подает заявление, – это тот, чьи коллеги выполняют его работу, а начальник отдела помнит о нем. Пересмотренный закон предусматривает четыре недели в течение восьми недель после рождения ребенка, которые можно разделить и о которых просто уведомляют, – порог достаточно низкий, чтобы нерешительный отец мог им воспользоваться."
 JAP_stress_check_programme: "Проверка уровня стресса"
 JAP_stress_check_programme_desc: "В соответствии с поправками к Закону о промышленной безопасности и охране труда, каждое предприятие с численностью персонала в пятьдесят и более человек обязано проводить ежегодную психологическую самооценку. Это первый случай, когда государство обязало японские фирмы спрашивать своих сотрудников об их самочувствии. Работник, получивший низкий балл, может запросить консультацию врача и корректировку своих обязанностей, но результаты остаются за самим работником, и руководитель ничего не видит без его согласия. Это защищает личность и снижает эффективность инструмента, поэтому от фирм с численностью персонала менее пятидесяти человек требуется лишь приложить усилия."
 JAP_telework_normalization: "Работа из любой точки мира"
 JAP_telework_normalization_desc: "Правительство назначает своего первого министра цифровой трансформации и открывает Цифровое агентство, отменяя требование о наличии печати ханко в подавляющем большинстве административных процедур. Удаленная работа стала случайностью не из-за отсутствия технологий, а потому что для контрактов требовалась резная печать, а бланки по-прежнему приходили по факсу, поэтому кто-то должен был находиться в здании и держать печать. Вопрос в том, переживет ли это чрезвычайную ситуацию, остается открытым, поскольку компании вернули своих сотрудников на рабочие места, которые, как оказалось, им не нужны."
 JAP_ending_service_zangyo: "Окончание сверхурочной работы"
 JAP_ending_service_zangyo_desc: "Sabisu zangyo — это отработанный час, который так и не был зафиксирован, и он предоставляется бесплатно, поскольку рабочий день измерялся на основе самодекларации, и сотрудник знал, какое значение ожидал от него начальник отдела. Реформа направлена скорее против арифметики, чем против культуры: работодатели должны устанавливать часы работы объективными методами, с помощью считывателей карт или времени входа в систему, а разница между двумя записями является доказательством. Министерство публикует данные о взысканных ежегодно десятках миллиардов иен невыплаченной заработной платы, и каждая из этих фирм была поймана с поличным, а не являлась исключением."
 JAP_ending_compulsory_nomikai: "Дополнительный Номикай"
 JAP_ending_compulsory_nomikai_desc: "Процедура «номикай» носит добровольный характер в том смысле, что приглашение сформулировано в форме вопроса, и сотрудник, дважды отказавшийся, говорит о себе то, что никакая оценка его работы не зафиксирует. Закон о предотвращении злоупотреблений властью затрагивает этот вопрос сбоку, впервые определяя злоупотребления властью на рабочем месте в японском законодательстве и обязывая каждую компанию иметь процедуру рассмотрения жалоб и защищать заявителя. Целое поколение молодых работников уже перестало ходить на такие мероприятия, и закон настиг их."
 JAP_work_to_live: "Работа, чтобы жить"
 JAP_work_to_live_desc: "Рабочее время фиксирует автомат, и оно совпадает с тем, что было на самом деле; отпуск берут, потому что это ничего не стоит, а отцы оформляют отпуск на недели после рождения ребёнка и возвращаются за тот же стол с теми же перспективами. Ничего из этого не было завоёвано одним лишь законом, потому что дело никогда не было в законе: дело было в том, чего ждёт рабочее место, когда никто ничего не контролирует. Япония по-прежнему много работает — и перестала путать это с работой на износ.\n-------------\nТребуется, чтобы проблема §Yяпонских компаний-зомби§! была полностью решена, §Y$JAP_karoshi_crisis$§! уже смягчён до последней стадии, а $JAP_worker_wellbeing$ составляло не менее §G85§!. Выполнение этого фокуса навсегда снимает кризис кароши."
 JAP_corporate_reform_category: "Корпоративная реформа Японии"
 JAP_corporate_reform_category_desc: "Японский корпоративный сектор страдает двумя взаимосвязанными болезнями. Банки поддерживают жизнь убыточных, закредитованных фирм, бесконечно пролонгируя им кредиты и тем самым запирая капитал и работников, нужных более здоровым отраслям. Те же фирмы покупают лояльность неоплачиваемыми сверхурочными, и итог — кароши, смерть от переработки. Ни одну болезнь не вылечить до конца, пока сохраняется другая.\n\n§YКомпании-зомби§!\n§YПрогресс корпоративной реструктуризации§!: [?JAP_corporate_restructuring_progress|0] / 100\nРеструктуризация ползёт со скоростью §R+0,25 в месяц§!, пока расследование не закрыто и не выбрано решение. Затем §Y$JAP_controlled_downsize$§! быстро ликвидирует фирмы, §Y$JAP_forced_mergers$§! поглощает их вдвое медленнее, а качество доклада ускоряет оба варианта. Банковские фокусы и программы восстановления ниже дают разовые прибавки.\n§RПрогресс замирает на 84§!, пока не выбрано решение.\n§GПороги§!\n§G30§! и §G60§!: открывается решение §Y$JAP_restructure_next_tranche$§! ниже, и каждое его применение смягчает §Y$JAP_zombie_companies$§! на одну ступень.\n§G85§!: фокус в конце выбранной ветки убирает проблему навсегда — §Y$JAP_the_lost_decade_ends$§! или §Y$JAP_consolidated_japan_inc$§!, хотя второй вариант оставляет неизгладимый след.\n§RПредупреждение§!: §Y$JAP_keiretsu_pact$§! замедляют ежемесячный прирост.\n\n§YКризис Кароши§!\n$JAP_worker_wellbeing$: [?JAP_karoshi_wellbeing|0] / 100\nФокусы реформ на выбранной ветке напрямую повышают благополучие работников, а трудовые кампании ниже подпитывают его, пока вы продолжаете за них платить.\n§GПороги§!\n§G30§! и §G60§!: открывается решение §Y$JAP_enforce_next_reforms$§! ниже, и каждое его применение смягчает §Y$JAP_karoshi_crisis$§! на одну ступень.\n§G85§!: фокус в конце выбранной ветки убирает кризис навсегда — §Y$JAP_end_of_karoshi$§!, §Y$JAP_work_to_live$§! или §Y$JAP_the_bargain_kept$§!. Каждый из них также требует, чтобы кризис сначала был смягчён до последней стадии.\n§RПредупреждение§!: каждая кампания даёт §R4§! вместо §G8§!, пока действуют §Y$JAP_zombie_companies$§!, а одни только фокусы ветки не доведут вас до §G85§!.\n\n§GПодсказка§!: §Y$JAP_a_society_where_women_thrive$§! вдвое снижает расходы казны на кампании §Y$JAP_cultural_change$§!."
 JAP_premium_friday_campaign: "Продвигайте Премиум-пятницу"
 JAP_premium_friday_campaign_desc: "Профинансируйте очередной раунд рекламной кампании министерства и сопутствующие скидки для розничных продавцов, а также окажите давление на федерацию работодателей, чтобы она убедила своих членов закрываться раньше. Фирмы, которые выключат свет в три часа, будут сфотографированы в этот момент."
 JAP_ikumen_campaign: "Проведите кампанию «Икумен»"
 JAP_ikumen_campaign_desc: "Разместите информацию об отцах, находящихся в отпуске по уходу за ребенком, на плакатах, в рекламе министерства и на телевидении, а также публикуйте данные о количестве таких отцов по каждой компании, чтобы низкий уровень использования отпуска стал проблемой при наборе персонала. Цель состоит в том, чтобы сделать подачу заявления на отпуск обычным явлением, а не смелым шагом."
 JAP_mental_health_campaign: "Кампания по охране психического здоровья на рабочем месте"
 JAP_mental_health_campaign_desc: "Продлить срок ежегодной проверки уровня стресса для компаний с численностью персонала ниже пятидесяти человек, субсидировать услуги врачей-профпатологов для фирм, слишком малых для того, чтобы содержать собственного специалиста, и обеспечить надлежащий штат сотрудников на линиях психологической поддержки. Скрининг эффективен только в том случае, если на другом конце линии находится человек, готовый помочь."
 JAP_no_overtime_day_campaign: "Объявить день без сверхурочной работы"
 JAP_no_overtime_day_campaign_desc: "Назовите любой будний день, выключите свет в офисе в назначенное время и отправьте начальников отделов домой первыми, потому что никто из младших не уходит раньше своего начальника. Грубая, наглядная и единственная версия инструкции, которая когда-либо работала."
 JAP_karoshi_resolved: "Кризис Кароши в Японии полностью урегулирован."
 JAP_keidanren_charter: "Хартия баланса между работой и личной жизнью"
 JAP_keidanren_charter_desc: "Правительство, профсоюз Keidanren и компания Rengo подписывают Хартию баланса между работой и личной жизнью и приводят в ней конкретные цифры: вдвое сократить долю работников с шестидесятичасовой рабочей неделей, использовать каждый день оплачиваемого отпуска, поднять долю мужчин, берущих отпуск по уходу за ребенком, с нынешних низких однозначных процентов. Документ не имеет юридической силы и не предусматривает никаких санкций, только ежегодный публичный обзор в совете, где бизнес выступает на равных. В Японии рабочее время никогда не сокращалось в результате судебных разбирательств, но оно сокращается, когда компаниям приходится объяснять друг другу эти цифры."
 JAP_shunto_offensive: "Весеннее наступление"
 JAP_shunto_offensive_desc: "Кабинет министров напрямую присоединяется к весенней кампании по повышению заработной платы, оказывая давление на профсоюз «Кейданрен» с целью повышения базовой заработной платы вместо бонусов и подкрепляя это требование налоговыми льготами для компаний, которые его выполнят. Критики называют это «канмин шунто» — переговорами, управляемыми правительством, — и утверждают, что раунд переговоров по заработной плате, проводимый из канцелярии премьер-министра, вовсе не является коллективными переговорами. Пока базовая заработная плата не повысится, работник продолжает работать сверхурочно, чтобы оплачивать ипотеку, независимо от установленного потолка."
 JAP_health_management_stocks: "Управление здоровьем и производительностью труда"
 JAP_health_management_stocks_desc: "Министерство и Токийская фондовая биржа начинают присваивать акциям компании, занимающиеся вопросами здоровья и производительности труда, подразумевая, что здоровье персонала — это капитальные затраты, а не социальное обеспечение. Сертификация, лежащая в её основе, «Белая пятёрка» (White 500), является намеренной противоположностью чёрному списку компаний и основана на выводе о том, что истощённые работники производят меньше и обходятся дороже, чем отдохнувшие. Компании предоставляют собственные данные о рабочем времени и состоянии здоровья, чтобы получить этот значок, а те, кто не может ответить на эти вопросы, — акционерам и новым сотрудникам."
 JAP_morning_shift_system: "Утренняя смена"
 JAP_morning_shift_system_desc: "Иточу, сого-сёся в центре старого кейрецу, запрещает работу после десяти вечера и вместо этого платит дополнительную плату за работу в ранние утренние часы. Причина скорее коммерческая, чем гуманная: трейдер, сидящий за своим столом с девяти утра предыдущего дня, неправильно оценивает товары, а вечерние часы — наименее продуктивные в течение дня. Вечерние сверхурочные часы резко сократились, общее количество отработанных часов уменьшилось, прибыль осталась на прежнем уровне, а рождаемость в фирме выросла, что поставило в неловкое положение всех конкурентов, которые считали сокращение рабочего времени непозволительным."
 JAP_job_based_employment: "Принят на работу, а не в компанию."
 JAP_job_based_employment_desc: "В Японии трудоустройство основано на членстве: работник принимается в компанию, а не на должность, его ротация происходит по усмотрению фирмы без четко определенных обязанностей, и именно с этого начинается неограниченный рабочий день. Hitachi, Fujitsu, KDDI и Shiseido теперь публикуют фактические описания должностей с оплатой, зависящей от роли, а Keidanren признала, что пожизненное трудоустройство невозможно. Государство финансирует переподготовку кадров на триллион иен, поэтому эти изменения воспринимаются скорее как возможность, чем как предательство."
 JAP_the_bargain_kept: "Сделка состоялась"
 JAP_the_bargain_kept_desc: "Рабочие часы сокращаются, потому что промышленные группы подсчитали, что переработки обходятся им дороже, чем приносят, — и, подсчитав, действуют быстрее, чем их мог бы заставить любой комитет парламента. Перекрёстное владение акциями сохраняется, главные банки остаются в центре своих групп, а производительность, высвобожденная более коротким днём, уходит в лаборатории, а не в требования о повышении зарплат. Государство берёт на себя то, чего не покрывает сделка: счета медицинского страхования за уже сломленных работников и снисходительность, позволяющую неплатёжеспособным фирмам держаться на плаву.\n-------------\nТребуется, чтобы проблема §Yяпонских компаний-зомби§! была полностью решена, §Y$JAP_karoshi_crisis$§! уже смягчён до последней стадии, а $JAP_worker_wellbeing$ составляло не менее §G85§!. Выполнение этого фокуса навсегда снимает кризис кароши."
 JAP_demand_recovery_progress_tt: "§YПрогресс восстановления спроса§!: $RIGHT|+=0$"
 JAP_corporate_restructuring_progress_tt: "§YПрогресс корпоративной реструктуризации§!: $RIGHT|+=0$"
 Japan_economy.32.t: "Окружной суд приостановил перезапуск."
 Japan_economy.32.d: "Окружной суд вынес постановление, блокирующее перезапуск ядерного реактора, сославшись на нерешенные вопросы сейсмической безопасности и планирования эвакуации вблизи станции. Решение не является окончательным, но оно приостанавливает возобновление работы реактора на время рассмотрения апелляции. Местные жители и антиядерные группы воспользовались этим решением, а энергетические компании предупреждают о последствиях длительного простоя мощностей."
 Japan_economy.32.a: "Оспорьте это в апелляционных судах."
 Japan_economy.32.b: "Укрепить местные гарантии безопасности."
 JAP_zombie_firms_investigation: "Расследуйте деятельность компаний-зомби."
 JAP_zombie_firms_investigation_desc: "Банки продлевали кредиты неплатежеспособным заемщикам, а перекрестное владение акциями позволяло руководителям скрываться друг за другом. Теперь аудиторы вносят данные в бухгалтерские книги, называют фирмы, выживающие только за счет бессрочных кредитов, и обнародуют финансовые показатели."
 JAP_zombie_firms_investigation_TT: "Начинается расследование. Материалы дела формируются через §Y$JAP_zombie_investigation_category$§!, и фирмы будут оказывать сопротивление."
 JAP_zombie_investigation_idea: "Расследование деятельности фирмы-зомби"
 JAP_zombie_investigation_idea_desc: "Аудиторы тщательно изучают бухгалтерские книги обанкротившихся компаний. Неопределенность сотрясает залы заседаний советов директоров и замедляет работу офисов, пока идет расследование."
 Japan_economy.06.b: "Пусть банки сами отчитываются."
 Japan_economy.07.b: "Сдержать распространение радиоактивных осадков"
 JAP_zombie_investigation_western_pop_TT: "Публикация информации о снисходительности дискредитирует прозападный реформистский блок: §RПопулярность Либеральной партии падает§!"
 JAP_controlled_downsize: "Контролируемое сокращение штата"
 JAP_controlled_downsize_desc: "Программа финансовой ревитализации применяет более строгие методы оценки активов и дисконтированного денежного потока, вынуждая государственный капитал вкладываться в балансы компаний, которые не могут существовать самостоятельно. Неплатежеспособные фирмы ликвидируются, заводы закрываются, освобождая рабочих, запертых внутри этих «ходячих мертвецов», и возвращая их к жизни."
 JAP_complete_downsizing: "Полное сокращение экономики"
 JAP_complete_downsizing_desc: "Ликвидация завершена. Теперь кредиты поступают фирмам, которые могут их погасить, земельные участки продаются по ценам, отражающим их использование, а руководство больше не оценивает успех по численности персонала. Это та экономика, которую обещали реформаторы: меньше на бумаге, но гораздо сильнее в бухгалтерском учете."
 JAP_venture_capital_funds: "Венчурные фонды"
 JAP_venture_capital_funds_desc: "Корпорация Innovation Network Corporation of Japan вкладывает государственный капитал в частные стартапы, сопоставляя венчурный риск с государственной поддержкой. Японские домохозяйства располагают огромными сбережениями, которые почти никогда не доходят до основателя, и именно так этот капитал перемещается."
 JAP_infrastructure_investments: "Инвестиции в инфраструктуру"
 JAP_infrastructure_investments_desc: "В «Фундаментальном плане национальной устойчивости» Министерство земли, инфраструктуры, транспорта и туризма обязуется обновить мосты, тоннели и берегозащитные сооружения, построенные в десятилетия бурного экономического роста, большинство из которых эксплуатируются уже более пятидесяти лет. Государственные строительные работы, если они выполняются должным образом, являются артериями индустриальной страны."
 JAP_growth_tax_reform: "Изменения в налоговой системе для стимулирования экономического роста"
 JAP_growth_tax_reform_desc: "Япония долгое время несла одно из самых тяжелых корпоративных бремен в развитом мире. Последовательные реформы снизили эффективную ставку примерно с 37% до 20%, расширив налоговую базу, одновременно снизив ставку и поощряя фирмы, которые повышают заработную плату и инвестируют внутри страны. Компания, которая постоянно работает на прибыль, ценится казначейством больше, чем та, которая ее накапливает."
 JAP_startup_education_programs: "Образовательные программы для новых компаний"
 JAP_startup_education_programs_desc: "Программы EDGE и EDGE-NEXT внедряют обучение предпринимательству в национальные университеты, а офисы по лицензированию технологий превращают патенты лабораторий в компании. Выпускник Токийского или Токийского технологического института должен рассматривать создание собственной фирмы как карьеру, а не как позор, о котором нужно рассказывать родителям."
 JAP_retirement_reform: "Реформа пенсионного обеспечения"
 JAP_retirement_reform_desc: "Пересмотренный Закон о стабилизации занятости пожилых людей обязывает работодателей обеспечивать рабочие места для лиц в возрасте до семидесяти лет. Пожилые люди здоровы, квалифицированы и полны энтузиазма, и сохранение их в рабочей силе облегчает пенсионное бремя, одновременно возвращая накопленный за десятилетия опыт на заводские рабочие места."
 JAP_forced_mergers: "Слияние"
 JAP_forced_mergers_desc: "Вместо того чтобы позволить слабым фирмам обанкротиться, министерство сводит их с сильными: оно определяет границы, банки предоставляют капитал, и никому не нужно признавать поражение. «Зомби» исчезают из реестра, а несчастные инженеры, дублирующие друг друга заводы и презираемые новые хозяева остаются."
 JAP_megabank_consolidation: "Консолидация мегабанков"
 JAP_megabank_consolidation_desc: "В Японии проблемные городские банки объединяются в три мегабанка: Mizuho, Sumitomo Mitsui и Mitsubishi UFJ. В результате слияний десятилетний период невозвратных кредитов оказывается скрытым в слишком больших балансах, чтобы его можно было подвергнуть сомнению, и появляются кредитные учреждения, банкротство которых ни одно правительство не может себе позволить."
 JAP_industrial_revitalization_corp: "Корпорация по возрождению промышленности"
 JAP_industrial_revitalization_corp_desc: "Корпорация промышленного возрождения Японии скупает проблемные долги и берет под свой контроль испытывающие трудности фирмы, среди сорока одной из которых она проводит реструктуризацию, — Daiei и Kanebo. Государственный механизм реструктуризации может диктовать условия, перераспределять долги и незаметно снижать долю акционеров способами, на которые не осмелился бы ни один частный кредитор."
 JAP_national_champion_mergers: "Национальный чемпион по слияниям"
 JAP_national_champion_mergers_desc: "METI объединяет убыточные подразделения конкурирующих компаний и называет получившуюся сумму победителем: Renesas — из подразделений по производству микросхем NEC, Hitachi и Mitsubishi Japan Display, и Display — из подразделений по производству панелей Sony, Toshiba и Hitachi. Вопрос о том, приведут ли три проблемных подразделения к созданию одной здоровой компании, остается открытым."
 JAP_keiretsu_cross_shareholding: "Перекрестное владение акциями Keiretsu"
 JAP_keiretsu_cross_shareholding_desc: "Мотиай, сеть взаимосвязанных акционерных компаний, представляет собой тихую архитектуру корпоративной Японии, и все проведенные до настоящего времени реформы пытались ее распутать. Вместо этого правительство затягивает узлы, защищая конгломераты от инвесторов-активистов и враждебных поглощений. Рабочие места остаются в безопасности, как и все посредственные руководители."
 JAP_employment_preservation_pact: "Пакт о сохранении рабочих мест"
 JAP_employment_preservation_pact_desc: "Принцип «пожизненной занятости» (sushin koyo) никогда не был законом, а представлял собой соглашение между фирмой, профсоюзом и государством, поддерживаемое субсидиями на адаптацию. Правительство фиксирует это: ни один работник не теряет работу в результате слияния компаний. Страна покупает социальный мир и платит за него заводами, которые никогда не смогут закрыться."
 JAP_consolidated_japan_inc: "Consolidated Japan Inc."
 JAP_consolidated_japan_inc_desc: "Последняя из слабых фирм подписывается в реестре слияний, и реестр закрывается. Чемпионы огромны, министерство может нарисовать карту промышленности на одном листе, а иностранные конкуренты относятся к ней с настороженным уважением, подобающим любому гиганту. Внутри дублирующие заводы все еще работают, а недовольные инженеры по-прежнему уходят в шесть.\n-------------\nЭтот фокус §Gустраняет§! §Y$JAP_zombie_companies$§! и §Y$JAP_fusion_restructuring$§!, которые появились в результате слияний, и навсегда оставляет §Y$JAP_consolidated_conglomerates$§!."
 JAP_venture_capital_funds_decision: "Финансирование Инновационного фонда"
 JAP_venture_capital_funds_decision_desc: "Вкладывать государственные средства в фонды наряду с частными управляющими при условии, что управляющие выберут наиболее успешные проекты. Гарантировать год целенаправленных исследовательских работ в новых компаниях."
 JAP_infrastructure_investments_decision: "Начало работ по реконструкции промышленного пояса Тюбу."
 JAP_infrastructure_investments_decision_desc: "Направить гражданские строительные мощности на обновление дорог, мостов и инженерных сетей промышленной зоны Тюбу. Эти работы позволят временно остановить работу заводов и значительно улучшат инфраструктуру региона."
 JAP_growth_tax_reform_decision: "Снизьте корпоративный тариф"
 JAP_growth_tax_reform_decision_desc: "Снизьте эффективную ставку корпоративного налога на год и позвольте компаниям оставлять себе большую часть заработанных денег. Потребительские цены снизятся, поскольку компании передадут часть этих льгот домохозяйствам."
 JAP_startup_education_programs_decision: "Финансируйте программу поддержки стартапов в университете."
 JAP_startup_education_programs_decision_desc: "Создать факультеты предпринимательства и офисы по лицензированию технологий в национальных университетах, превратив лабораторные исследования в коммерческие предприятия и ускорив наши промышленные исследования."
 JAP_retirement_reform_decision: "Расширить программу гарантированного трудоустройства до семидесяти лет"
 JAP_retirement_reform_decision_desc: "Субсидируйте работодателей, которые удерживают квалифицированных работников после достижения ими традиционного пенсионного возраста. Накопленный за десятилетия опыт остается на заводском конвейере еще на год."
 JAP_rail_modernization: "Модернизация железных дорог"
 JAP_rail_modernization_desc: "Скоростные поезда Токайдо Синкансэн являются основой самой разветвленной железнодорожной сети в мире, а подвижной состав, системы сигнализации и станции обновляются линия за линией. Железные дороги остаются основой индустриальной экономики, которая не может позволить себе их крах."
 JAP_shinkansen_network_expansion: "Расширение сети скоростных поездов Синкансэн"
 JAP_shinkansen_network_expansion_desc: "В соответствии с Законом о развитии национальной сети скоростных железных дорог Синкансэн, сменявшие друг друга правительства продвигали высокоскоростные магистрали от центра Токайдо в сторону Хокурику, Кюсю и Хоккайдо. Ускорение этих проектов позволит интегрировать отдаленные префектуры в национальную экономику и сократить пути поставок между островами."
 JAP_chuo_shinkansen_maglev: "Маглев Тюо-синкансэн"
 JAP_chuo_shinkansen_maglev_desc: "Линия Тюо Синкансэн — это сверхпроводящая линия магнитной левитации компании JR Central, соединяющая Токио, Нагою и Осаку. Линия серии L0 установила мировой рекорд скорости на железной дороге — 603 км/ч. Государственная поддержка включает в себя разработку прототипа и глубокое прокладывание тоннелей для самой быстрой коммерческой железной дороги в истории."
 JAP_freight_modal_shift: "Смена способа перевозки грузов"
 JAP_freight_modal_shift_desc: "Японская грузовая железная дорога возглавляет процесс переориентации грузоперевозок с автомобильных грузовиков на железнодорожный транспорт, чему способствуют знак Eco Rail Mark и стандартизация 31-футовых контейнеров. Перевозка большего количества грузов по железной дороге сокращает выбросы, смягчает нехватку водителей и укрепляет производственную цепочку поставок."
 JAP_station_city_model: "Модель города-вокзала"
 JAP_station_city_model_desc: "Компания JR East превратила крупные терминалы в самостоятельные коммерческие города, развив торговые комплексы, известные как экинака, и высотные здания вокруг станций Синагава, Сибуя и Токио. Концентрация офисных и торговых помещений в транспортных узлах повышает стоимость земли и производительность в центре города."
 JAP_regional_line_preservation: "Сохранение региональных железнодорожных линий"
 JAP_regional_line_preservation_desc: "В условиях сокращения населения в сельской местности и уменьшения пассажиропотока компания JR West и некоммерческие железнодорожные предприятия изо всех сил пытаются сохранить местные линии в рабочем состоянии. Вместо того чтобы отказываться от развития железнодорожных перевозок в сельской местности, мы будем субсидировать развитие местных железных дорог, сохраняя доступ к транспортным ресурсам и мобильность для регионов, которые обходят стороной основные магистрали."
 JAP_port_rail_intermodal: "Портовые и железнодорожные интермодальные перевозки"
 JAP_port_rail_intermodal_desc: "Политика создания международных стратегических портовых узлов концентрирует контейнерные перевозки в портовых кластерах Кэйхин и Хансин. Расширение железнодорожных путей на причалах и внутренних терминалов напрямую связывает порты с грузовой сетью, обеспечивая перегрузку контейнеров с судов на поезда без простоя автотранспорта."
 JAP_green_logistics_network: "Сеть экологически чистой логистики"
 JAP_green_logistics_network_desc: "Экологичная логистическая сеть, включающая электрифицированные железные дороги, аккумуляторные и водородные локомотивы, а также консолидированные распределительные центры, способствует декарбонизации перемещения товаров по всей стране в стремлении к углеродной нейтральности."
 JAP_rail_technology_exports: "Экспорт железнодорожных технологий"
 JAP_rail_technology_exports_desc: "Японские высокоскоростные железные дороги — флагманский экспортный товар. Поезда, созданные на базе технологии E5, лежат в основе линии Мумбаи-Ахмедабад в Индии, модель 700T используется на Тайваньской высокоскоростной железной дороге, а пакеты финансирования JICA обеспечивают внедрение технологий Синкансэн по всему миру. Получение этих контрактов распространяет наши стандарты и наше влияние."
 JAP_global_rail_superpower: "Глобальная железнодорожная сверхдержава"
 JAP_global_rail_superpower_desc: "Благодаря скоростной железной дороге Chuo Shinkansen, ведущей в Осаку, и экспорту товаров по всему миру, Япония является бесспорным лидером в области высокоскоростных железных дорог. Эпоха магнитной левитации начинается внутри страны и распространяется за ее пределы, являясь непреходящим символом японского инженерного искусства."
 JAP_chuo_shinkansen_program: "Программа скоростных поездов «Тюо Синкансэн»"
 JAP_chuo_shinkansen_program_desc: "Целенаправленные национальные усилия по созданию прототипа сверхпроводящей магнитной левитации ускоряют реализацию нашего специального проекта по созданию магнитной левитации."
 JAP_high_speed_line: "Высокоскоростная линия"
 JAP_high_speed_line_desc: "Новый коридор для скоростных поездов Синкансэн повышает региональную производительность, ускоряет местное строительство и расширяет возможности снабжения."
 JAP_rail_category: "Железнодорожный сектор"
 JAP_hokuriku_shinkansen_extension: "Хокурику Синкансэн: от Канадзавы до Цуруги"
 JAP_hokuriku_shinkansen_extension_desc: "Участок, продленный до станции Хокурику Синкансэн от Канадзавы до Цуруги, был открыт в 2024 году и соединил побережье Японского моря с национальной сетью высокоскоростных поездов."
 JAP_nishi_kyushu_shinkansen: "Ниси Кюсю Синкансэн"
 JAP_nishi_kyushu_shinkansen_desc: "Открытие маршрута Ниси-Кюсю — Нагасаки, действующего с 2022 года, позволит включить западную часть Кюсю в сеть скоростных поездов Синкансэн."
 JAP_sanyo_shinkansen_upgrade: "Модернизация скоростного поезда Санё Синкансэн"
 JAP_sanyo_shinkansen_upgrade_desc: "Внедрить подвижной состав N700S и модернизировать магистраль Осака-Хаката для повышения скорости и надежности."
 JAP_tohoku_shinkansen_upgrade: "Тохоку Синкансэн 320 км/ч"
 JAP_tohoku_shinkansen_upgrade_desc: "Запуск поездов серии E5 со скоростью 320 км/ч на магистрали Тохоку позволит сократить время в пути из Токио в Аомори."
 JAP_hokkaido_shinkansen_sapporo: "Хоккайдо Синкансэн: продолжение Саппоро"
 JAP_hokkaido_shinkansen_sapporo_desc: "Пробурить туннели и поднять виадуки для прокладки линии Синкансэн от Син-Хакодатэ-Хокуто до Саппоро."
 JAP_shikoku_shinkansen: "Сикоку Синкансэн"
 JAP_shikoku_shinkansen_desc: "Реализация давно запланированной базовой линии, впервые обеспечивающей высокоскоростную железную дорогу на острове Сикоку."
 JAP_plutonium_stockpile_concern: "Отделенный запас плутония"
 JAP_galapagos_syndrome: "Галапагосский синдром"
 JAP_galapagos_syndrome_desc: "Япония создала целостный технологический мир внутри своих границ, а затем обнаружила, что не может экспортировать ничего из этого. Ее мобильные сети работали на PDC, в то время как остальная часть планеты стандартизировала GSM, поэтому ни один телефон отечественного производства не мог продаваться за границей, а ни один телефон иностранного производства — здесь. Интернет появился через i-mode, а платежи — через FeliCa, каждый из которых на годы опережал все зарубежное и был несовместим со всем зарубежным. Внутренняя сертификация, спецификация JIS и закупки через кейрецу сделали все остальное, наполнив внутренний рынок продуктами, разработанными для клиента, которого нет нигде больше. 120 миллионов потребителей достаточно, чтобы поддерживать отрасль, и совсем чуть-чуть недостаточно, чтобы вытолкнуть её вовне.\n-------------\nЭтот национальный дух не ослабевает сам по себе. §RСкорость исследований§! неуклонно снижается, пока Япония остаётся закрытой, — временные меры лишь замедляют этот процесс, но никогда не обращают его вспять. Удаляет его только путь §YИнтеграция с миром§!, доведённый до §G85§! §YОткрытости§!. См. §Y$JAP_technological_isolation_category$§! по текущим показателям."
 JAP_galapagos_modifier: "Галапагосский дрейф"
 JAP_galapagos_modifier_desc: "Пошаговый анализ того, насколько Япония отдалилась от мира, с которым торгует. Уровень научных исследований немного снижается с каждым месяцем, пока страна придерживается собственных стандартов, и чем дальше она отходит от стандартов, используемых ее клиентами, тем быстрее происходит это отклонение. Временные меры замедляют этот процесс. Остановить его может только подлинная интеграция."
 JAP_galapagos_resolved: "Япония вышла из своей изоляции на Галапагосских островах."
 JAP_galapagos_syndrome_focus: "Галапагосский вопрос"
 JAP_galapagos_syndrome_focus_desc: "Внутренний рынок Японии прибылен и сокращается, будучи защищен стандартами, которые исключают страну из всех остальных. Министерство обсуждает, является ли решением конвергенция, то есть пересмотр стандартов в соответствии с мировыми требованиями, или коммерциализация, продажа самих этих отличий. Частичные меры замедляют развитие исследований, но ни одна из них не решает лежащую в их основе проблему."
 JAP_technological_isolation_category: "Галапагосские острова и война электроники"
 JAP_technological_isolation_category_desc: "Японская промышленность доводила продукты до совершенства только для Японии: превосходные телефоны, стандарты и сервисы, которыми никто за пределами внутреннего рынка не мог пользоваться, тогда как остальной мир стандартизировался вокруг чужих решений. Та же замкнутость теперь делает японскую полупроводниковую отрасль уязвимой, пока Китай поднимается по технологической лестнице.\n\n§YГалапагосский синдром§!\n§YОткрытость§!: [?JAP_galapagos_openness|0] / 100\nМиссия §Y$JAP_galapagos_drift_review_mission$§! раз в тридцать дней сообщает о дрейфе и показывает точное значение до его применения. Чем ниже открытость, тем сильнее отстают исследования: при §G100§! штрафа нет вовсе, а хуже §R-15%§! он не бывает.\n§GПовышение открытости§!: основную часть дают фокусы интеграции, остальное — фокусы электроники. Две кампании ниже добавляют ещё немного, но лишь замедляют дрейф. Вылечить синдром они не могут.\n§GУдаление§!: только ветка §Y$JAP_world_integration$§! снимает §Y$JAP_galapagos_syndrome$§!, и лишь после того, как открытость превысит §G85§!. Ветка §Y$JAP_cool_japan_doctrine$§! сознательно сохраняет дух и вместо этого обращает культурный охват Японии во влияние.\n\n§YКонкуренция в электронике§!\n§YКонкурентное давление§!: [?JAP_electronics_pressure|0] / 3\n§YУстойчивость электроники§!: [?JAP_electronics_resilience|0]\nДавление начинается с §R1§!, растёт до §R2§!, когда Корея и Тайвань вырываются вперёд (с 2008 года или раньше, если Китай поднимется по полупроводниковой лестнице), и до §R3§!, когда Китай выходит на передний край. Разность давления и устойчивости определяет, какой уровень духа §Y$JAP_model_competition$§! испытывает Япония. Сравняйте устойчивость с давлением — и дух снимается; позвольте давлению снова превысить устойчивость — и дух вернётся.\n§GПовышение устойчивости§!: её дают полупроводниковые фокусы, каждый из которых ждёт технологии «Производство микрочипов IV», а экспортное наступление ниже добавляет по единице в год, пока устойчивость не достигнет §G5§!.\n§GУдаление§!: §Y$JAP_electronics_superpower$§! навсегда завершает конкуренцию."
 JAP_international_standards_adjustment: "Корректировка международных стандартов"
 JAP_international_standards_adjustment_desc: "Японская промышленность разрабатывает собственные стандарты: PDC для мобильной связи и ISDB для вещания, и каждый из них изолирует внутренний рынок от мира GSM и DVB. Правительство направляет инженеров в рабочие группы ISO и IEC, которые не могут устранить расхождения в одночасье, но включают японские имена в проекты, которые через десять лет будут читать все остальные страны. Цена этого приходится платить внутри страны: каждый раз, когда принимается новый пункт, пересматриваются правила тестирования на соответствие."
 JAP_english_business_environment: "Английская деловая среда"
 JAP_english_business_environment_desc: "Японские менеджеры не могут укомплектовывать персоналом свои собственные зарубежные дочерние компании на языке, на котором составлены контракты. Правительство поддерживает корпоративные программы обучения английскому языку и эксперимент Rakuten, в рамках которого английский стал рабочим языком одной из японских фирм и который высмеивался до получения результатов. Это приводит к многолетней потере производительности, в то время как руководители отделов учатся вести совещания на втором языке, а некоторые из них так и не научатся."
 JAP_international_standards_adjustment_campaign: "Финансирование делегаций по стандартам"
 JAP_international_standards_adjustment_campaign_desc: "Оплатите еще одну ротацию инженеров в рабочие группы ISO, IEC и ITU, а также покройте расходы на внутренние испытания на соответствие, которые проводятся после каждого пункта, на который Япония соглашается. Делегации возвращаются домой с проектами, и у промышленности есть год на адаптацию перед следующей редакцией. Прекратите их финансирование, и места достанутся кому-нибудь другому."
 JAP_english_business_environment_campaign: "Субсидировать корпоративные программы изучения английского языка."
 JAP_english_business_environment_campaign_desc: "Оплачивайте языковую подготовку, которую фирмы-члены не хотели оплачивать самостоятельно: штатные преподаватели, сдача экзамена TOEIC в рабочее время и командировки в зарубежные офисы для всех, кто успешно сдал экзамен. Пока сотрудники учатся, производительность труда снижается. Фирмы, которые продолжают работать в этом направлении, перестают нуждаться в переводчике в офисе."
