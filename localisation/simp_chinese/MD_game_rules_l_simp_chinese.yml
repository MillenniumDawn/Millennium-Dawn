 RULE_OPTION_COM_WARRIOR_KING_DESC: "罗伯特·德纳尔最后一次回到科摩罗群岛，§8总统卫队§!兵不血刃地将宫殿拱手让给了他。科摩罗不再是一个拥有军队的国家，而变成了一支可以出租国旗的军队，向非洲各地贩卖雇佣兵。"
 RULE_OPTION_COM_MILITARY_DICTATORSHIP: "上校留驻"
 RULE_OPTION_COM_MILITARY_DICTATORSHIP_DESC: "阿扎利保住了他身着军装就任的总统职位，将科摩罗群岛重新置于莫罗尼的统治之下，并任由轮值制度在其他人之前终止。科摩罗逐渐脱离法国的势力范围，转而寻求北京和非洲联盟的承认，以取代巴黎不再提供的认可。"
 RULE_INVEST_DEFAULT_GAIN_1_5: "1.5%"
 RULE_INVEST_DEFAULT_GAIN_1_5_DESC: "默认选项。只要对方接受投资，你就会获得1.5%的影响力。"
 SOL_AI_BEHAVIOR: "@SOL 所罗门群岛"
 RULE_OPTION_SOL_DYNAMIC: "动态行为"
 RULE_OPTION_SOL_DYNAMIC_AI_DESC: "所罗门群岛的决策取决于其所处环境，它会权衡各方势力的示好、各省的行动以及历史的走向。没有哪两场比赛会让霍尼亚拉走上完全相同的道路。"
 RULE_OPTION_AUSTRALIAN_PEACE: "干预与特赦"
 RULE_OPTION_AUSTRALIAN_PEACE_AI_DESC: "@SOL 所罗门群岛将在其最大影响力国家的支持下，推进和平进程。\n注意： @AST 澳大利亚是 @SOL 所罗门群岛在游戏开始时影响力最大的国家。"
 RULE_OPTION_SOLOMON_BILL_FAILS_RASTA_COUP: "四月公报失败 - 拉斯特政变"
 RULE_OPTION_SOLOMON_BILL_FAILS_RASTA_COUP_AI_DESC: "巴塞洛缪·乌卢法阿卢未能促成《蒙达协议》的签署，§8伊萨塔布自由运动§!重燃战火，吉米·卢西巴亚领导的§8马拉伊塔雄鹰部队§!将其赶下台。群岛落入一名民兵指挥官之手，澳大利亚在其北部边境发现了一个武装的失败国家。"
 RULE_OPTION_AST_REJECTS_TEE_REBEL: "蒂的政变"
 RULE_OPTION_AST_REJECTS_TEE_REBEL_AI_DESC: "没有地区强权介入，安德鲁·蒂独自掌控了§8伊萨塔布自由运动§!。所罗门群岛陷入内战，瓜达尔卡纳尔岛上的马拉伊坦定居者遭到大规模驱逐。"
 RULE_DISABLE_GDP_GRAPH: "禁用GDP图表"
 RULE_NO_RULE_DISABLE_GDP_GRAPH_DESC: "启用GDP图表系统"
 RULE_YES_RULE_DISABLE_GDP_GRAPH_DESC: "禁用GDP图表系统。这可能有助于提高低端机器的性能。"
 RULE_ENABLE_AI_USING_ATTACHES: "启用AI使用§Y随员§!"
 RULE_ENABLE_AI_USING_ATTACHES_YES_DESC: "允许AI在外交行动中使用§Y随员§!"
 RULE_ENABLE_AI_USING_ATTACHES_NO_DESC: "禁止AI在外交行动中使用§Y随员§!"
 RULE_OPTION_THE_GREAT_REBELLION: "大叛乱"
 RULE_OPTION_THE_GREAT_REBELLION_AI_DESC: "相互敌对的利益集团撕裂着国家，选民们也逐渐失去了阻止他们的兴趣。一场充满争议、票数差距微乎其微的计票最终摧毁了公众对选举结果的信任。美国陷入了一场无人承认的选举的公开叛乱。"
 RULE_FUTURISTIC_SPECIAL_PROJECTS: "未来主义特别项目"
 RULE_ALLOWED_DISABLE_FUTURISTIC_SPECIAL_PROJECTS_DESC: "所有特殊项目都将向研究人员开放。"
 RULE_OPTION_DISABLED: "禁止"
 RULE_DISABLE_DISABLED_FUTURISTIC_SPECIAL_PROJECTS_DESC: "未来主义特别项目将不可用"
