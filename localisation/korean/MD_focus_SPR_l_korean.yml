 SPR_idea_the_icmm_2: "ICMM"
 SPR_idea_the_icmm_2_desc: "우리는 자국 광업 및 금속 산업의 지속 가능한 발전 성과를 높이기 위해 국제광업금속위원회(ICMM)를 초청했습니다."
 SPR_idea_spanish_wind_farms_1: "스페인 풍력 단지"
 SPR_idea_spanish_wind_farms_1_desc: "남부 알바세테 인근에 풍력 단지를 건설하여 재생 에너지를 확보하고 오염을 줄이고 있습니다."
 SPR_idea_spanish_wind_farms_2: "확장된 스페인 풍력 단지"
 SPR_idea_spanish_wind_farms_2_desc: "남부 알바세테 인근에 풍력 단지를, 북부 해안을 따라 해상 풍력 단지를 건설하여 더 많은 재생 에너지를 확보하고 오염을 한층 더 줄이고 있습니다."
 SPR_idea_spanish_wind_farms_3: "최대화된 스페인 풍력 단지"
 SPR_idea_spanish_wind_farms_3_desc: "남부 알바세테 인근에 풍력 단지를, 북부 해안과 북부 고지대 전역에 해상 및 육상 풍력 단지를 건설하여 이제 영토 내의 이상적인 바람 흐름을 모두 활용하고 있습니다."
 SPR_idea_nuclear_energy_expansion_1: "원자력 에너지 확대"
 SPR_idea_nuclear_energy_expansion_1_desc: "우리는 원자력 에너지 산업의 확대를 시작했습니다. 화석 연료 의존도를 줄이려면 필수적인 조치이지만 모두가 이를 반기는 것은 아닙니다."
