 approval_rating_TOOLTIP_DELAYED: "Это отражает разницу [?government_coalition_differential|%1] с последними выборами, когда правящие партии получили [?government_coalition_strength_elect|%1] голосов.\n\nТекущие эффекты:\n§Y£stability_texticon  Стабильность§!: [?ROOT.gov_pop_stability_factor|%+]\n§Y£political_power_texticon  Прирост политической власти§!: [?ROOT.gov_pop_political_power_factor|%+]\n§Y£drift_defence_texticon  Защита от дрейфа идеологии§!: [?ROOT.gov_pop_drift_defence_factor|%+]"
 generic.Western_Autocracy: "£generic_Western_Autocracy_small Прозападные автократы"
 generic.Western_Autocracy_desc: "Прозападная автократия охватывает широкий спектр недемократических, авторитарных идеологий, согласующихся с геополитическими интересами Западного полушария."
 generic.Western_Autocracy_icon: "£generic_Western_Autocracy_small"
 generic.conservatism: "£generic_conservatism_small Консерваторы"
 generic.conservatism_desc: "Консерватизм охватывает широкий спектр умеренных правых идеологий, отстаивающих важность традиционной культуры, единства и стабильного образа жизни. Консерваторы обычно выступают против государственного вмешательства в социальные и экономические дела и часто считают, что меньшее регулирование приведёт к большей социальной мобильности населения."
 generic.conservatism_icon: "£generic_conservatism_small"
 generic.liberalism: "£generic_liberalism_small Либералы"
 generic.liberalism_desc: "Либерализм — центристская идеология, продвигающая права личности и ставящая свободу выше расширения государственной власти. Либералы обычно поддерживают прогрессивную социальную политику в рамках свободного рынка и свободной торговли с остальным миром."
 generic.liberalism_icon: "£generic_liberalism_small"
 generic.socialism: "£generic_socialism_small Социал-демократы"
 generic.socialism_desc: "Социал-демократия охватывает широкий спектр левых идеологий, отстаивающих экономическую и социальную справедливость в большей степени, чем большинство ветвей либерализма. Социал-демократы стремятся гуманизировать капитализм, чтобы сдерживать неравенство, угнетение и способствовать демократии."
 generic.socialism_icon: "£generic_socialism_small"
 generic.anarchist_communism: "£generic_anarchist_communism_small Левые радикалы"
 generic.anarchist_communism_desc: "Левый радикализм — широкий спектр ультралевых идеологий, обычно выступающих за конец капитализма и глобализации. Хотя некоторые могут поддерживать вооружённое сопротивление, многие считают себя просто «левее» социал-демократов и приемлют либеральную демократию."
 generic.anarchist_communism_icon: "£generic_anarchist_communism_small"
 generic.Conservative: "£generic_Conservative_small Реакционеры"
 generic.Conservative_desc: "Реакционеры — широкий спектр ультраправых идеологий, чьи цели идут дальше умеренных консерваторов. Реакционеры обычно верят в идеализированную версию прошлого и стремятся восстановить былое величие нации через реваншистскую и ирредентистскую идеологию и агрессивную военную политику."
 generic.Conservative_icon: "£generic_Conservative_small"
 generic.Autocracy: "£generic_Autocracy_small Автократы"
 generic.Autocracy_desc: "Автократия охватывает широкий спектр недемократических, авторитарных политических систем, где один правитель или группа привилегированных элит контролирует всю политическую власть."
 generic.Autocracy_icon: "£generic_Autocracy_small"
 generic.Mod_Vilayat_e_Faqih: "£generic_Mod_Vilayat_e_Faqih_small Умеренные шиитские революционеры"
 generic.Mod_Vilayat_e_Faqih_desc: "Умеренные шиитские революционеры — спектр правых шиитских приверженцев, которые придерживаются строгого толкования шиитского ислама, но поддерживают большее политическое многообразие, чем их более радикальные собратья. Несмотря на это, они в основном поддерживают сохранение теократии."
 generic.Mod_Vilayat_e_Faqih_icon: "£generic_Mod_Vilayat_e_Faqih_small"
 generic.Vilayat_e_Faqih: "£generic_Vilayat_e_Faqih_small Жёсткие шиитские революционеры"
 generic.Vilayat_e_Faqih_desc: "Жёсткие шиитские революционеры — спектр ультраправых и милитаристских шиитских приверженцев, придерживающихся строгого толкования шиитского ислама. Они в основном негативно относятся к суннитам и стремятся обеспечить сохранение шиитского ислама в теократическом государстве."
 generic.Vilayat_e_Faqih_icon: "£generic_Vilayat_e_Faqih_small"
 generic.Kingdom: "£generic_Kingdom_small Салафизм, лояльный истеблишменту"
 generic.Kingdom_icon: "£generic_Kingdom_small"
 generic.Kingdom_desc: "Некоторые направления салафитской мысли, такие как ваххабизм и мадхализм, выступают за сохранение статус-кво вместо радикальной революции и вооружённого джихада. Эти салафиты разделяют фундаменталистские и нетерпимые взгляды кутбистских джихадистов, но обычно отвергают насилие и поддерживают существующие правительства. Их покладистость делает их популярными среди авторитарных арабских государств, опасающихся угрозы, которую более политизированные течения исламизма представляют для их власти."
 generic.Caliphate: "£generic_Caliphate_small Салафитский джихадизм"
 generic.Caliphate_icon: "£generic_Caliphate_small"
 generic.Caliphate_desc: "Салафитский джихадизм — ультрастрогая, ультраконсервативная и фундаменталистская ветвь исламской политической идеологии, вдохновлённая учением Сайида Кутба. Они стремятся завоевать все исламские земли и править ими через своё жёсткое толкование исламского права. Они не признают другие формы ислама и религиозные меньшинства и не остановятся ни перед чем для достижения своих целей."
 generic.Neutral_Muslim_Brotherhood: "£muslim_brotherhood_small Умеренные исламисты"
 generic.Neutral_Muslim_Brotherhood_icon: "£muslim_brotherhood_small"
 generic.Neutral_Muslim_Brotherhood_desc: "Умеренный исламизм — широкий спектр исламских политических движений, стремящихся установить демократическое государство в рамках исламского права."
 generic.Neutral_Autocracy: "£generic_Neutral_Autocracy_small Неприсоединившиеся автократы"
 generic.Neutral_Autocracy_icon: "£generic_Neutral_Autocracy_small"
 generic.Neutral_Autocracy_desc: "Автократия охватывает широкий спектр недемократических, авторитарных идеологий, где вся власть сосредоточена в руках одного правителя."
 generic.Neutral_conservatism: "£generic_Neutral_conservatism_small Консерваторы"
 generic.Neutral_conservatism_icon: "£generic_Neutral_conservatism_small"
 generic.Neutral_conservatism_desc: "Консерватизм охватывает широкий спектр умеренных правых идеологий, отстаивающих важность традиционной культуры, единства и стабильного образа жизни. Консерваторы обычно выступают против государственного вмешательства в социальные и экономические дела и часто считают, что меньшее регулирование приведёт к большей социальной мобильности населения."
 generic.oligarchism: "£generic_oligarchism_small Олигархи"
 generic.oligarchism_icon: "£generic_oligarchism_small"
 generic.oligarchism_desc: "Олигархия — структура власти, при которой контроль находится в руках избранной группы политических и экономических элит. Олигархии обычно по своей природе недемократичны и авторитарны."
 generic.Neutral_Libertarian: "£generic_Neutral_Libertarian_small Либертарианцы"
 generic.Neutral_Libertarian_icon: "£generic_Neutral_Libertarian_small"
 generic.Neutral_Libertarian_desc: "Либертарианство — широкий спектр политических идеологий и движений, ставящих свободу в качестве основного принципа. Либертарианцы обычно поддерживают ограниченное государственное вмешательство во все аспекты социальной, политической и экономической жизни в большей степени, чем консерваторы."
 generic.Neutral_green: "£generic_Neutral_green_small Зелёные"
 generic.Neutral_green_icon: "£generic_Neutral_green_small"
 generic.Neutral_green_desc: "Зелёная политика или экополитика — широкий спектр левых движений, отстаивающих ненасилие, социальную справедливость, прямую демократию и защиту окружающей среды."
 generic.neutral_Social: "£generic_neutral_Social_small Социалистические демократы"
 generic.neutral_Social_icon: "£generic_neutral_Social_small"
 generic.neutral_Social_desc: "Идеология социалистической демократии относится к левым идеологиям, отстаивающим экономическую и социальную справедливость. Работая в рамках капитализма, они стремятся к масштабному перераспределению богатства для сдерживания неравенства. Они продвигают социальное государство и выступают за более строгое регулирование частного бизнеса."
 generic.Neutral_Communism: "£generic_Neutral_Communism_small Коммунисты"
 generic.Neutral_Communism_icon: "£generic_Neutral_Communism_small"
 generic.Neutral_Communism_desc: "Коммунизм в широком смысле обозначает идеологию, выступающую за конец капиталистической системы ради создания общего рабочего рая. В действительности коммунистические государства сохраняют капиталистические экономические системы и часто по своей природе недемократичны."
 generic.Nat_Populism: "£generic_Nat_Populism_small Правые популисты"
 generic.Nat_Populism_icon: "£generic_Nat_Populism_small"
 generic.Nat_Populism_desc: "Правый популизм — специфическая ветвь популистской идеологии, стремящаяся дать власть народу против воспринимаемых элит, контролирующих общество. Правые популисты обычно поддерживают антиглобализацию, протекционизм, нативизм, национализм и выступают против иммиграции."
 generic.Nat_Fascism: "£generic_Nat_Fascism_small Фашисты"
 generic.Nat_Fascism_icon: "£generic_Nat_Fascism_small"
 generic.Nat_Fascism_desc: "Фашизм — форма авторитарного ультранационализма с милитаристским оттенком. Фашизм стремится установить однопартийное государство во главе с единственным лидером, обладающим абсолютной властью, и поддерживает насилие и агрессивную экспансию для содействия национальному возрождению."
 generic.Nat_Autocracy: "£generic_Nat_Autocracy_small Военная хунта"
 generic.Nat_Autocracy_icon: "£generic_Nat_Autocracy_small"
 generic.Nat_Autocracy_desc: "Военные хунты — правительства, возглавляемые комитетом военных лидеров. Военные хунты часто по своей природе недемократичны и авторитарны и в самом широком смысле могут считаться формой военной диктатуры или стратократии."
 generic.Monarchist: "£generic_Monarchist_small Монархисты"
 generic.Monarchist_icon: "£generic_Monarchist_small"
 generic.Monarchist_desc: "Монархическая идеология относится к абсолютным монархиям."
