 ast_political_decisions: "政治决议"
 ast_political_decisions_desc: "为了治理国家，我们有时不得不撸起袖子，贿赂一些人。无论是行业巨头还是政府要员，我们在幕后所做的一切都在维持着国家的运转。这并非正当的劳动，但工作量巨大。"
 ast_approach_the_unions: "联系工会"
 ast_approach_the_unions_desc: "我们都不喜欢和工会打交道，但如果想在行业内获得任何回旋余地，就必须做出妥协。我们的​​改革努力就取决于此。"
 ast_manufacturer_subsidies: "制造商补贴"
 ast_manufacturer_subsidies_desc: "补贴就像生产工厂的润滑剂。当某些工厂运转不畅时，你就拿出补贴，希望它们能恢复正常运转。"
 ast_cabinet_reshuffle: "内阁改组"
 ast_cabinet_reshuffle_desc: "近来，内阁成员的行动一直落后于党的路线。有些人根本不胜任这份工作，有些人则公然违抗命令。幸运的是，作为党的领导人，我们拥有为数不多的权力之一。通过改组内阁，我们可以把一些我们更倾向的人放在核心位置，把那些不太愿意帮助我们的人撤换掉。"
 ast_loosen_gambling_restrictions: "放宽赌博限制"
 ast_loosen_gambling_restrictions_desc: "赌博是许多澳大利亚人的恶习。它以各种方式渗透到我们经济的几乎每一个角落。近年来，我们的政策对赌博业采取了严厉的打击措施，但我们可以稍微放松一些限制，以获得一些短期收益，并让大家都满意。"
 ast_revisit_zoning_laws: "重新审视分区法规"
 ast_revisit_zoning_laws_desc: "目前，州政府和地方议会负责规定土地上建筑的“内容、地点和方式”。最近，房地产开发商一直敦促我们取消一些限制。重新审视这些指导方针或许能够缓解他们的一些担忧。"
 cdep: "社区发展就业项目"
 cdep_desc: "该项目的初衷是希望原住民社区能够自主规划和建设发展项目。项目进展顺利，但我们可以通过派遣政府专家和增加资金投入来扩大项目规模。"
 nielns: "国家原住民英语读写和计算能力战略"
 nielns_desc: "近年来，原住民和托雷斯海峡岛民的识字率大幅下降，再加上原本就低的入学率，情况堪忧。如果我们与学校合作，制定帮助学生的计划，就能改变许多人的命运。"
 fam_violence_proj: "家庭暴力预防项目"
 fam_violence_proj_desc: "在90年代，家庭暴力是一个丑陋的真相，很少有政客愿意触及。如今，基于新证据的方法使处理过程更加专业化，也减少了政策上的顾虑，因此，为我们提供资金支持对我们来说是顺理成章的。"
 construct_recon_place: "建设和解场所"
 construct_recon_place_desc: "我们已经拟定了一系列城市景观改造方案，并提交到我们的办公桌上等待审批。其中最重要的是堪培拉的和解广场。如果获得批准，这将是对我们努力的绝佳证明。"
 repatriate_remains: "归还原住民遗骸"
 repatriate_remains_desc: "英国博物馆收藏了大量从其他国家掠夺的物品，这已不是什么秘密。其中包括人类遗骸。一些原住民团体已请愿要求将这些遗骸归还澳大利亚安葬。"
 mabo_referendum: "和解状态修正案"
 mabo_referendum_desc: "正式修改宪法，在宪法序言中加入和解声明，承认澳大利亚原住民对其土地的权利。"
 ast_walk_the_journey_tt: "与我们的和解工作相关的计划和行动将在政治§2决议§!选项卡中解锁。"
 mabo_vibe_tt: "和解状态修正案将在各项§2决议§!中予以公布。"
