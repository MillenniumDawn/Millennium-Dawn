 aus_cyclone.1.t: "Cyclone Ului Hits Queensland"
 aus_cyclone.1.d: "One of the more severe cyclones we've seen has made landfall in Queensland, causing state-wide infrastructural damage and leaving over 60,000 homes without power for days. The cyclone passed over the Solomon Islands and maintained a category 3 before dissipating. Given the advanced warnings, most were evacuated from the areas in advance, however, one death has been reported. \n\nNational Emergency services and the ADF have since been deployed to repair the damage and bring the power back online."
 aus_cyclone.1.a: "A tragedy nonetheless."
