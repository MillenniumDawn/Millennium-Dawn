 farm_automation_grants_ast: "농장 자동화 지원금"
 hung_parliament_ast: "과반 없는 의회"
 hung_parliament_ast_desc: "1940년 이후 처음으로 오스트레일리아는 과반 정당이 없는 의회를 겪고 있습니다. 어느 정당도 정부를 구성할 만한 의석을 확보하지 못했으며, 우리의 72석을 76석으로 만들 필요한 지지를 협상으로 얻기 전까지는 사실상 입법 교착 상태입니다."
 hung_parliament_ast_2: "불안정한 연립"
 hung_parliament_ast_2_desc: "정부를 구성하기는 했지만 존재하는 연립은 이상적이지 않습니다. 불만을 품은 당원과 예측 불가능한 무소속 의원으로 채워져 있어, 정책 통과에 실패하면 출범 초기의 정부가 일찍 막을 내릴 수도 있습니다."
 diplomacy_tightrope_ast: "외교의 줄타기"
 diplomacy_tightrope_ast_desc: "우리는 미국과는 깊은 안보·국방 동맹을 유지하면서 중국과는 안정적인 무역 상호의존을 추구하는 복잡한 균형 잡기를 하고 있습니다. 둘 중 하나를 선택하도록 강요받지 않는 것이 우리가 버텨 온 방법입니다."
 non_permanent_unsc_member: "UN 안보리 비상임이사국"
 non_permanent_unsc_member_desc: "국제연합 안전보장이사회는 비상임이사국 10개국을 2년 임기로 선출합니다. 이들 국가는 결의안을 제출하고 표결을 주재할 수 있습니다."
 gloves_off_diplomacy_ast: "장갑을 벗은 외교"
 consuls_of_peace_idea_ast: "평화의 영사들"
 the_australian_century_tt: "§Y현재 승인을 기다리는 신규 광산 제안 여러 건을 신속 처리합니다.§!"
 kevin_rudd_desc: "아시아 지정학 전문가이자 TV 단골 출연자인 케빈 러드는 어느덧 노동 운동의 새로운 얼굴이 되었습니다. 하워드의 안정성과 국가가 요구하는 개혁의 약속을 동시에 아우를 수 있는 인물인 러드는, 당의 이해관계를 조율하면서도 대중의 호감을 잃지 않는 재능을 보여 주었습니다. \n\n고프 휘틀럼의 개혁 덕분에 러드는 대학에 진학할 수 있었고, 그 교육을 바탕으로 1981년 외무부에 들어갔습니다. 이는 젊은 노동당원을 길러 낸 지원이자, 그가 경력 내내 활용해 온 경험이었습니다. 이후 당내에서 빠르게 올라섰고, 노동당의 '회전문' 시대의 일원으로서 냉혹한 정치에 낯설지 않습니다. 그러나 그의 낙관주의는 당을 새롭게 세우도록 그를 이끌었습니다. \n\n당의 호소력을 넓히고 수십 년간 당을 정체시킨 파벌주의를 바로잡으려는 이 퀸즐랜드 출신 인물이 이제 키를 잡았습니다. 15세에 입당한 이래 우상으로 삼아 온 자리이며, 그 자리에 걸맞게 임무를 다하려 합니다."
