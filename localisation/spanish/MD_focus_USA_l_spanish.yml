 USA_ban_election_fraud: "Detener los eventos de fraude electoral"
 USA_ban_election_fraud_desc: "El Congreso ilegaliza el robo de elecciones. La opción de fraude ya no aparecerá en las elecciones presidenciales. Dejaremos de ver los eventos de fraude electoral mientras esto permanezca activo."
 USA_allow_election_fraud: "Permitir los eventos de fraude electoral"
 USA_allow_election_fraud_desc: "El Congreso deroga la prohibición del fraude electoral. Las elecciones presidenciales se pueden volver a robar. Empezaremos a ver de nuevo los eventos de fraude electoral."
 department_of_state.201.t: "Afganistán nos pide que regresemos"
 department_of_state.201.d: "Los talibanes están recuperando el terreno que dejamos atrás. [AFG.GetLeader] nos ha pedido que enviemos a nuestras tropas de vuelta y retomemos la misión antes de que caiga Kabul."
 department_of_state.201.a: "No los abandonaremos"
 department_of_state.201.b: "Afganistán debe valerse por sí mismo"
 department_of_state.202.t: "Los estadounidenses se niegan a regresar"
 department_of_state.202.d: "Washington ha rechazado nuestra solicitud. Sus tropas no regresarán y debemos mantener la línea del frente contra los talibanes por nuestra cuenta."
 department_of_state.202.a: "Entonces lucharemos solos"
 usa.204.t: "Avioneta se estrella contra el Bank of America Plaza"
 usa.204.d: "Varios meses después de los atentados terroristas, un joven de 15 años robó una avioneta ligera en Tampa, Florida, y la estrelló deliberadamente contra el Bank of America Plaza. Según los informes, el incidente estuvo inspirado en los atentados. Nadie dentro del edificio resultó muerto ni herido; el joven piloto fue la única víctima mortal."
 usa.204.a: "Un eco perturbador de los atentados"
 raid_type_raid_baath_desc: "Las fuerzas especiales rastrean y capturan a los altos líderes del partido Baaz que siguen prófugos en Irak, desmantelando los restos del antiguo régimen."