 ANTCONF_integrate_puerto_rico_desc: "プエルトリコは長きにわたってアメリカ合衆国の領土であった。米国の保護があることを誇っているが、重要な領土ではない。プエルトリコの人口は約400万人で、カリブ海に浮かぶ大きな島の一つだ。アンティル連合にとって、統合される国家の中では最小である。しかしこの地域の活気ある文化と観光業は、大連合に大きな利益をもたらすだろう。"
