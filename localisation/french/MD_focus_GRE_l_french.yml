 GRE_lose_20_gain_20: "Les §Hchypriotes turcs§! §Rperdront§! §H20 en force !§!"
 TUR_CYP_incite_riot_TT: "Les §Hchypriotes turcs§! disposent d'une force de §H50 %§! ou plus"
 TUR_GRE_support: "Les §Hchypriotes grecs§! disposent d'une force de §H5 %§! ou plus."
 TUR_has_100_strength: "Les §Hchypriotes turcs§! disposent d'une force de §H50 %§! ou plus."
 GRE_has_100_strength: "Les §Hchypriotes grecs§! disposent d'une force de §H100 %§!."
 GRE_ICBC: "Emprunter à la BICC"
 GRE_ICBC_desc: "La Banque industrielle et commerciale de Chine est prête à nous prêter de l'argent sous la table pour garantir notre coopération avec la République populaire."
 GRE_chi_real_estate: "Investissements immobiliers chinois"
 GRE_chi_real_estate_desc: "Les chinois ont manifesté leur intérêt pour l'achat de logements dans toute la Grèce.\n\nIl s'agit là d'une initiative que nous devrions encourager et dont nous devrions tirer parti."
 GRE_chi_investments: "Investissements chinois"
 GRE_chi_investments_desc: "La Chine est intéressée par de vastes projets dans toute la Grèce. Ces projets peuvent donner un nouveau souffle à des secteurs de l'économie que nous n'avons pas les moyens d'améliorer nous-mêmes."
 GRE_piraeus: "Faire une offre pour le Pirée"
 GRE_piraeus_desc: "La surenchère du port du Pirée a été discutée par les membres du gouvernement et il semble que dans le contexte de la crise de la dette, cela nous permettra d'alléger la pression qui pèse sur nous."
 GRE_piraeus_corruption: "Restreindre la Chine"
 GRE_piraeus_corruption_desc: "Les projets d'expansion de la Chine en Grèce constituent un danger pour notre indépendance vis-à-vis de son influence. Sous l'égide du Conseil central de l'archéologie, nous pouvons stopper net tous les projets d'expansion de la Chine."
 GRE_chi_investments_piraeus: "Investissements chinois près du Pirée"
 GRE_chi_investments_piraeus_desc: "Les Chinois se sont montrés très intéressés par des investissements dans les zones situées autour du port du Pirée. Certains soulignent que ce projet pourrait être dangereux pour notre indépendance vis-à-vis de l'étranger, mais cela est tout à fait absurde."
 GRE_chi_nationwide_investments: "Investissements chinois au niveau national"
 GRE_chi_nationwide_investments_desc: "Le bénéfice de permettre à la Chine d'investir librement dans notre pays est immense, nous devons permettre aux chinois d'investir comme ils l'entendent."
 GRE_invest_elliniko: "Investir dans Ellinikó"
 GRE_invest_elliniko_desc: "Ellinikó est une zone périurbaine d'Athènes qui pourrait être considérée comme négligée par les projets de revitalisation que nous avons lancés ailleurs. Cette zone est d'autant plus importante qu'il s'agit d'une plaque tournante pour les touristes."
 GRE_unemployed: "Les chômeurs"
 GRE_unemployed_desc: "En gérant soigneusement le chômage, nous pouvons faire en sorte que les personnes qui perdent leur emploi en raison de la crise de la dette ne se retrouvent pas sans l'argent nécessaire pour assurer leur niveau de vie de base."
 GRE_glass_cannon_economics: "Économie du canon de verre"
 GRE_glass_cannon_economics_desc: "Notre économie et nos citoyens constatent les avantages d'une économie saine. En dépensant leur argent, ils contribuent à la croissance de notre pays.\n\nÀ condition que rien de §Rfâcheux§! ne vienne perturber l'économie."
 GRE_strength: "Force économique grecque"
 GRE_strength_desc: "La Grèce est une nation résiliente, tout comme son économie. Nous sommes une nation aux forces multiples et aux secteurs d'activité variés. En promouvant ces industries et les entreprises locales, nous pouvons garantir une économie saine pour les années à venir."
 GRE_pharma: "Exportations pharmaceutiques"
 GRE_pharma_desc: "La Grèce est un pays prolifique dans le domaine du commerce pharmaceutique. Il s'agit de notre deuxième industrie d'exportation après le raffinage du pétrole. L'exportation de ces produits représente 20 % des bénéfices de l'industrie. En outre, comme nous exportons ces produits à l'échelle internationale, les problèmes économiques nationaux n'affecteront pas la capacité des gens à les acheter à l'étranger."
 GRE_construction_mat: "Matériaux de construction"
 GRE_construction_mat_desc: "Notre pays produit une grande quantité de matériaux de construction que nous pourrions utiliser pour développer notre propre économie industrielle."
 GRE_austerity: "Campagnes d'austérité"
 GRE_austerity_desc: "Le déficit public est inévitable et si nous n'agissons pas rapidement, l'économie sera encore plus mal en point qu'elle ne l'est aujourd'hui. §RCela provoquera des émeutes dans tout le pays§!, mais si nous contenons l'agitation, nous pourrons peut-être reprendre le contrôle de notre situation financière."
 GRE_turn_century: "Le tournant du siècle"
 GRE_turn_century_desc: "À l'aube de ce nouveau millénaire, beaucoup de choses sont incertaines, la politique et l'économie sont en question. Il nous appartient de guider notre nation dans cette nouvelle ère."
 GRE_golden_dawn: "Aube dorée"
 GRE_golden_dawn_desc: "Le parti d'extrême droite Aube dorée est un parti politique basé sur les idéaux du nationalisme et a des sympathies pour les mouvements nationalistes à travers l'Europe. Beaucoup ont critiqué l'Aube dorée comme étant une organisation néo-nazie et criminelle, mais ces personnes sont des menteurs. L'Aube dorée est la seule voie à suivre pour la Grèce, et nous devons veiller à ce qu'elle prenne la tête de la nation."
 GRE_subtle_propaganda_campaigns: "Campagnes de propagande subtile"
 GRE_subtle_propaganda_campaigns_desc: "Le peuple doit apprendre la vérité sur les objectifs de l'Aube dorée et sur la façon dont les démocrates ont détruit ce pays, le plongeant dans le chaos."
 GRE_open_youth_front: "Ouvrir le front de la jeunesse"
 GRE_open_youth_front_desc: "Les gouvernements démocratiques ont malheureusement laissé la jeunesse de notre pays sans avenir. Nous devons donc gagner la confiance des jeunes pour réussir à prendre les rênes du pays."
 GRE_influence_police: "Influencer la police"
 GRE_influence_police_desc: "Si nous parvenons à obtenir le soutien de la police, nous obtiendrons davantage de soutien de la part du public et nous pourrons plus facilement faire face aux traîtres politiques."
 GRE_committee_national_memory: "Comité de la mémoire nationale"
 GRE_committee_national_memory_desc: "Nous devons honorer les grands héros nationalistes qui ont combattu et sont morts pour notre nation, en rappelant au peuple leurs principes, afin que nous puissions tous nous unir dans un même but."
 GRE_form_golden_dawn_death_legions: "Former les légions de la mort de l'Aube dorée"
 GRE_form_golden_dawn_death_legions_desc: "Les légions de la mort de l'Aube dorée seront notre principale unité paramilitaire. Elles seront chargées de nettoyer les rues des traîtres, de faire respecter l'ordre et de défendre le pays contre ses ennemis en cas de besoin."
 GRE_glorify_regime_of_colonels: "Glorifier la dictature des colonels"
 GRE_glorify_regime_of_colonels_desc: "De 1967 à 1974, la Grèce a été dirigée par la Junte grecque, plus connue sous le nom de « dictature des colonels ». Sous la dictature des colonels, la Grèce a connu une croissance économique rapide, ainsi qu'une stabilité interne et une immense armée qui protégeait le pays. C'est pourquoi nous devons rappeler à la population les réalisations des colonels."
 GRE_golden_greece: "Exiger des élections immédiates"
 GRE_golden_greece_desc: "Le temps est venu de diriger ce pays après avoir recueilli le soutien de la majorité de la population. Nous exigerons des élections de la part du gouvernement corrompu afin de lui montrer qui devrait vraiment être aux commandes."
 GRE_fund_elam: "Financement important du FPN"
 GRE_fund_elam_desc: "Le FPN, ou Front populaire national, est le parti frère de l'Aube dorée à Chypre. En lui fournissant plus de fonds qu'il n'en a jamais rêvé, nous pouvons au moins nous assurer d'être populaires auprès des chypriotes grecs."
 GRE_revive_megali_idea: "Raviver la Grande Idée"
 GRE_revive_megali_idea_desc: "La Grande Idée était le concept d'une grande nation grecque composée d'anciens territoires grecs, tels que l'Épire du Nord et les zones côtières de la Turquie. Notre destin est de faire revivre la Grande Idée et de rendre nos ancêtres fiers."
 GRE_censor_media: "Censurer les médias"
 GRE_censor_media_desc: "Avant que nous ne prenions le pouvoir, les médias étaient des menteurs et des traîtres qui colportaient la propagande pro-démocrate. Maintenant que nous sommes au pouvoir, nous remplacerons les mensonges des démocrates par nos propres médias contrôlés par l'État, qui ne publieront que la vérité."
 GRE_one_religion: "Religion unique"
 GRE_one_religion_desc: "Le christianisme orthodoxe est notre religion d'État et un élément important de notre patrimoine. Nous devons par tous les moyens mettre davantage l'accent sur notre religion."
 GRE_oppress_political_opposition: "Opprimer l'opposition politique"
 GRE_oppress_political_opposition_desc: "Nous devons éradiquer les traîtres qui ont vendu notre pays, ainsi que tous ceux qui sont anti-grecs. L'Aube dorée débarrassera la Grèce de sa cinquième colonne."
 GRE_army_first: "Politiques de priorité à l'armée"
 GRE_army_first_desc: "En adoptant des politiques qui donnent la priorité à notre armée et à son expansion, nous pouvons nous assurer que même sans le soutien du citoyen grec moyen, nous garderons le contrôle. Bien sûr, cela n'arrivera jamais."
 GRE_economic_control: "Contrôle économique"
 GRE_economic_control_desc: "Les gouvernements précédents ont veillé à détruire l'économie en faisant exploser la dette de la Grèce. Pour éviter que cela ne se reproduise, nous devons renforcer notre contrôle direct sur l'économie."
 GRE_anti_migrant_policies: "Politiques anti-migrants"
 GRE_anti_migrant_policies_desc: "Les immigrés prennent des ressources qui pourraient être mieux utilisées par les grecs. Nous ne pouvons pas les laisser continuer à dégrader notre Grèce natale."
 GRE_metaxism: "Metaxisme"
 GRE_metaxism_desc: "Nous sommes très influencés par le régime de Metaxás, en particulier par les politiques qu'il a soutenues, telles que le corporatisme, les avantages pour la classe ouvrière et la supériorité du peuple grec. La seule chose que nous devons supprimer, c'est le sentiment anti-impérialiste de Metaxás."
 GRE_depart_ecomomic_migrants: "Départ des migrants économiques"
 GRE_depart_ecomomic_migrants_desc: "Maintenant que nous avons commencé à promulguer des lois anti-migrants, nous devons commencer à expulser les migrants économiques vers leur pays."
 GRE_metaxas_policies: "Politiques metaxistes"
 GRE_metaxas_policies_desc: "Ioánnis Metaxás, qui a pris le pouvoir à la suite du coup d'État du 4 août 1936, est une grande source d'inspiration pour l'Aube dorée. Il a été l'un des plus grands dirigeants que la Grèce ait jamais eus, car il a porté le peuple grec à la gloire et a résisté aux puissances de l'Axe lors de la Seconde Guerre mondiale. Nous devrions revoir ses politiques pour lui rendre hommage."
 GRE_dissolve_plutocracy: "Dissoudre la ploutocratie"
 GRE_dissolve_plutocracy_desc: "Depuis trop longtemps, notre économie est exploitée par les régimes démocratiques et les étrangers. Il est temps de détruire ce système une fois pour toutes."
 GRE_increase_agricultural_production: "Augmenter la production agricole"
 GRE_increase_agricultural_production_desc: "L'agriculture est depuis longtemps le secteur le plus important et le plus performant de Grèce. Nous devons le rendre encore plus fort en investissant dans le secteur agricole."
 GRE_exploit_and_export: "Exploiter et exporter"
 GRE_exploit_and_export_desc: "Notre pays regorge de ressources naturelles inexploitées et nous devons agir rapidement pour les extraire au profit du pays."
 GRE_revise_national_debt: "Réviser la dette nationale"
 GRE_revise_national_debt_desc: "Les démocrates ont réussi à porter la dette grecque à 300 milliards de dollars. Cela pose des problèmes à l'économie. Il est donc nécessaire de négocier, afin de se débarrasser de cette énorme dette."
 GRE_nationalize_resources: "Nationaliser les ressources"
 GRE_nationalize_resources_desc: "Actuellement, de nombreuses entreprises étrangères détiennent des ressources naturelles dans notre pays. C'est inacceptable. Nous saisirons tous les actifs étrangers en Grèce."
 GRE_trade_agreements: "Accords commerciaux"
 GRE_trade_agreements_desc: "La puissance commerciale de la Grèce est très faible, car nous ne sommes pas assez compétitifs dans le monde moderne. Nous conclurons des accords commerciaux afin d'exporter nos produits vers davantage de pays."
 GRE_nationalize_banks: "Nationaliser les banques"
 GRE_nationalize_banks_desc: "Dans le cadre de notre programme de contrôle économique, les banques doivent être nationalisées par l'État, car elles détiennent des actifs précieux que nous devons exploiter."
 GRE_force_germany_to_pay_debt_taken_from_occupation: "Remboursement forcé des dettes d'occupation allemandes"
 GRE_force_germany_to_pay_debt_taken_from_occupation_desc: "L'occupation allemande de la Grèce pendant la Seconde Guerre mondiale a été très brutale, les allemands ayant détruit une grande partie de la Grèce. Ils nous doivent 300 milliards de dollars de réparations qui n'ont jamais été remboursées et nous allons aujourd'hui le leur rappeler."
 GRE_russia: "Commerce avec la Russie"
 GRE_russia_desc: "La Russie est un allié historique, puisque nous sommes tous deux des pays chrétiens orthodoxes, et qu'elle nous a aidés à maintes reprises au cours de l'histoire, nous devons donc accroître nos relations commerciales avec les russes."
 GRE_china: "Commerce avec la Chine"
 GRE_china_desc: "Bien que son idéologie soit différente, la Chine soutient des régimes nationalistes comme le nôtre, elle est une puissance commerciale mondiale et nous devons renforcer nos liens économiques avec elle."
 GRE_iran: "Commerce avec l'Iran"
 GRE_iran_desc: "Même si l'Iran n'a pas grand-chose en commun avec notre pays, nous partageons de nombreux objectifs similaires et nous devrions cultiver la coopération entre nous."
 GRE_of_continents_seas: "Une Grèce à deux continents et cinq mers"
 GRE_of_continents_seas_desc: "Notre marine était autrefois la plus puissante, mais ce n'est plus le cas aujourd'hui. Toutefois, nous la reconstruirons pour qu'elle retrouve sa gloire d'antan."
 GRE_resolve_naming_dispute: "Résoudre le débat autour du nom"
 GRE_resolve_naming_dispute_desc: "Le différend sur le nom de la Macédoine est une question tellement triviale qu'il suffit d'annexer la Macédoine du Nord pour le résoudre."
 GRE_strike_albania: "Attaquer l'Albanie"
 GRE_strike_albania_desc: "L'Albanie est connue pour maltraiter la minorité grecque présente à l'intérieur de ses frontières. L'annexion est la solution la plus simple."
 GRE_strike_bulgaria: "Attaquer la Bulgarie"
 GRE_strike_bulgaria_desc: "Le rôle de la Grèce dans le développement de la Bulgarie en tant que pays « civilisé » est indéniable, les missionnaires byzantins ont développé la première langue littéraire des peuples slaves, qui allait devenir la langue bulgare. Cette « guerre » est davantage une unification de frères perdus de vue depuis longtemps."
 GRE_greater_greece: "Grande Grèce"
 GRE_greater_greece_desc: "La Grèce a été le centre d'un grand nombre des nations les plus puissantes de l'histoire, et nous déshonorerions un tel héritage en ne le perpétuant pas."
 GRE_great_greece: "Superbe Grèce"
 GRE_great_greece_desc: "Nous n'emprunterons pas la voie belliciste qui a conduit à la disparition des plus grands empires de l'histoire."
 GRE_agriculture_focus: "Priorité à l'agriculture"
 GRE_agriculture_focus_desc: "L'agriculture est l'un des éléments les plus forts de l'économie grecque, car nous fournissons une grande partie des produits tels que l'huile d'olive. Nous devons investir davantage dans l'agriculture afin de pouvoir exporter pleinement nos produits vers le reste du monde."
 GRE_greater_state_control: "Renforcement du contrôle économique de l'État"
 GRE_greater_state_control_desc: "L'État doit intervenir pour obtenir un plus grand contrôle économique sur l'État et la population."
 GRE_kke: "PCG"
 GRE_kke_desc: "Le PCG (Parti communiste grec) est un parti d'extrême gauche qui se fonde sur les idées du marxisme-léninisme et s'oppose fermement à l'impérialisme étranger. Il veut éliminer les inégalités et garantir les droits des travailleurs, et s'engage à créer une véritable société socialiste. Nous devons tous nous rallier au PCG pour guider notre nation vers l'avenir !"
 GRE_communist_education: "Éducation communiste"
 GRE_communist_education_desc: "Les jeunes esprits sont les plus impressionnables. Instiller les valeurs fondamentales du communisme à la jeune génération tout en enseignant aux étudiants de niveau universitaire la gloire de l'égalité pourrait grandement faire avancer notre cause."
 GRE_labour_focus_unions: "Contacter les syndicats"
 GRE_labour_focus_unions_desc: "Les syndicats seront très heureux d'avoir un gouvernement disposé non seulement à coopérer, mais aussi à accéder à leurs demandes. Nous veillerons à ce que leur influence ne s'étende pas au-delà de notre arrivée au pouvoir afin d'éviter les §Rconflits d'intérêts§!."
 GRE_failures_capitalism: "Échecs du capitalisme"
 GRE_failures_capitalism_desc: "Le capitalisme ne nous offre plus la richesse infinie qu'il nous avait promise. Il est temps que nous fassions notre propre chemin pour qu'une telle crise ne se reproduise plus jamais ! §RL'effet de cette priorité varie en fonction de l'ampleur de la crise de la dette.§!"
 GRE_working_class: "La classe ouvrière"
 GRE_working_class_desc: "La classe ouvrière, où les rêves naissent et meurent. Nous pouvons leur promettre qu'ils seront bien traités et qu'ils recevront le crédit qu'ils méritent pour avoir été le fondement du nouvel État communiste."
 GRE_communist_propaganda: "Machine de propagande"
 GRE_communist_propaganda_desc: "Grâce à notre influence grandissante, nous pouvons nous permettre de déclencher la machine de propagande sur la Grèce. Bien que l'entretien monétaire soit élevé, cette propagande n'est pas à négliger, elle sera extrêmement efficace pour convertir la population grecque."
 GRE_prepare_government: "Préparer un gouvernement"
 GRE_prepare_government_desc: "En mettant en place un gouvernement au sein de notre parti politique, nous assurons une transition efficace qui nous permet d'agir sur nos objectifs plus rapidement que nos rivaux ne peuvent se rassembler. Cela coûtera cher, mais compte tenu de nos chances de gagner, c'est un pari bien placé."
 GRE_damn_market: "Au diable le libre marché"
 GRE_damn_market_desc: "Nous sommes en mesure de porter le coup de grâce aux capitalistes. Avec le pouvoir de la propagande de notre côté, nous pouvons porter le coup fatal à l'économie de marché et, ce faisant, usurper le trône de la démesure sur lequel siègent les capitalistes !"
 GRE_election_com: "Exiger des élections immédiates"
 GRE_election_com_desc: "Camarades, le moment est venu ! Tous les efforts que nous avons déployés pour créer un nouvel État libre ont abouti à ce moment ! \n\n§RNous ferons en sorte que le gouvernement du peuple gouverne pendant encore 1000 ans !§!"
 GRE_com_democratic: "Communisme démocratique"
 GRE_com_democratic_desc: "La forme la plus authentique du communisme est celle qui permet au travailleur moyen d'élire son chef au gouvernement, les priver de ce droit est une trahison de la nature communiste."
 GRE_com_authoritarian: "Communisme autoritaire"
 GRE_com_authoritarian_desc: "Le peuple est trop facilement trompé par des mensonges et des promesses arbitraires qui ne l'affecteraient pas, même si elles étaient tenues. Il est tout simplement trop risqué de laisser un public facilement manipulable décider de l'avenir de la Grèce, c'est trop dangereux."
 GRE_handle_bankers: "Manipuler les banquiers"
 GRE_handle_bankers_desc: "Les capitalistes n'ont pas leur place dans un État communiste. Nous devons redistribuer immédiatement leurs richesses mal acquises."
 GRE_com_constitutionalism: "Constitutionnalisme communiste"
 GRE_com_constitutionalism_desc: "Nous rédigerons une nouvelle constitution afin de garantir que personne ne perturbera jamais le droit de vote des citoyens, entre autres. Cela dit, le chef de l'État aura moins de pouvoir."
 GRE_government_purge: "Purge gouvernementale"
 GRE_government_purge_desc: "Nous prendrons le contrôle total du gouvernement et nous nous établirons comme le seul parti autorisé à gouverner la Grèce. Les fascistes se cachent partout et travaillent à l'effondrement de l'utopie que nous nous efforçons de créer !"
 GRE_curtail_corruption: "Réduire la corruption"
 GRE_curtail_corruption_desc: "Notre montée en puissance a créé un vide que le peuple ne demande qu'à combler. Nous devons veiller à ce que notre gouvernement reste pur et au service du peuple."
 GRE_promote_local: "Promouvoir les entreprises locales"
 GRE_promote_local_desc: "Les États communistes modernes ont malheureusement besoin d'incorporer des concepts capitalistes dans l'État pour assurer leur survie. Les entreprises locales constituent la colonne vertébrale de l'économie et, pour réaliser nos rêves, nous devons renforcer cette ossature."
 GRE_investment_effort: "Investissements dans les infrastructures"
 GRE_investment_effort_desc: "Nous devons investir dans les infrastructures à travers le pays pour nous assurer que nous avons la capacité de maintenir une production accrue de ressources."
 GRE_subsidize_farmers: "Subventionner les agriculteurs"
 GRE_subsidize_farmers_desc: "Le déclin des exploitations agricoles européennes est dû à de nombreux facteurs, mais l'un des plus importants est que la concurrence avec les États-Unis est très difficile. Nous devons aider nos agriculteurs à mettre un terme à leur déclin continu."
 GRE_abandon_army: "Abandonner l'armée"
 GRE_abandon_army_desc: "L'armée est actuellement un fardeau pour l'État. Les chances qu'une telle force soit utilisée sont faibles, il est donc logique de commencer à restructurer et à réduire les effectifs de l'armée si nécessaire."
 GRE_reorganize_army: "Réorganiser l'armée"
 GRE_reorganize_army_desc: "L'armée actuelle fait encore preuve d'une loyauté embarrassante à l'égard de l'ancienne constitution."
 GRE_silence_press: "Faire taire la presse"
 GRE_silence_press_desc: "Nous sommes des libérateurs, pas des tyrans. Si les médias ont subi un trop grand lavage de cerveau pour s'en rendre compte, nous devons prendre les choses en main."
 GRE_extend_education: "Étendre l'éducation"
 GRE_extend_education_desc: "Nos citoyens ne méritent que ce qu'il y a de mieux en matière d'éducation, afin que nous disposions d'une réserve de personnes bien formées pour occuper des emplois plus avancés."
 GRE_com_resources: "Exploitation des ressources naturelles"
 GRE_com_resources_desc: "Une fois l'infrastructure nécessaire mise en place, nous pouvons nous concentrer sur l'expansion de l'exploitation de nos ressources naturelles."
 GRE_farmer_tax: "Réductions d'impôts pour les agriculteurs"
 GRE_farmer_tax_desc: "Nous devons accorder des exonérations fiscales à nos agriculteurs, non seulement pour encourager davantage de personnes à rejoindre la profession, mais aussi pour veiller à ce qu'ils réalisent des bénéfices plus importants, ce qui leur permettra d'étendre leur croissance grâce à des méthodes de production plus efficaces et même à des terres."
 GRE_new_army: "Une nouvelle armée"
 GRE_new_army_desc: "Nous avons réformé notre armée au point qu'elle a été remplacée par les forces de police en matière de sécurité intérieure. Cependant, comment pouvons-nous exercer une influence sans une véritable force armée pour soutenir notre parole ? Même si elle ne sera pas utilisée, nous devrions commencer à construire une nouvelle armée adaptée à la nouvelle Grèce."
 GRE_red_army: "Une armée rouge"
 GRE_red_army_desc: "Nous veillerons à ce que l'esprit communiste soit présent dans les rangs de la nouvelle armée rouge. Ce fanatisme idéologique sera à notre avantage car il créera une armée loyale à l'État et une armée qui se battra jusqu'au bout pour préserver le socialisme en Grèce."
 GRE_pacify_unions: "Apaiser les syndicats"
 GRE_pacify_unions_desc: "Nous avons donné aux syndicats un pouvoir tel qu'ils perturbent l'État à de multiples niveaux pour des choses de plus en plus insignifiantes. Si notre parti se consacre au peuple, celui-ci a besoin d'une économie qui fonctionne pour trouver du travail, et nous devons donc demander aux syndicats de renoncer avant de leur interdire d'interférer légalement."
 GRE_purge_unions: "Purger les syndicats"
 GRE_purge_unions_desc: "Les syndicats se sont montrés incapables de faire preuve de retenue ou de loyauté, notre courtoisie ne va pas plus loin."
 GRE_militarist_education: "Éducation militariste"
 GRE_militarist_education_desc: "En introduisant l'éducation militaire dans nos programmes d'études, nous pouvons faire en sorte que l'ensemble de la population soit apte à participer à un appel sous les drapeaux en cas de circonstances extrêmes."
 GRE_balkan_diplomacy: "Diplomatie des Balkans"
 GRE_balkan_diplomacy_desc: "Il est temps de réaliser nos véritables ambitions. La Grèce a prospéré sous le communisme et, bien que nous ne soyons pas considérés comme slaves, nous suivons toujours la religion orthodoxe et nous sommes situés dans les Balkans. Peut-être que notre neutralité culturelle assurera la stabilité d'un tel État : \n\nUn État gréco-slave."
 GRE_balkan_hegemony: "Hégémonie balkanique"
 GRE_balkan_hegemony_desc: "Les deux dernières tentatives de création d'un tel État ont échoué. Toutefois, l'unification a toujours été tentée par la voie diplomatique plutôt que par la force. Si nous n'avons jamais eu la force de conquérir les autres États balkaniques, à quoi bon essayer de les unir ? Nous ne doutons pas que nous puissions maintenir un tel État par le biais de la diplomatie interne, cependant, il s'agit simplement d'écarter d'abord les conflits inévitables."
 GRE_constitution: "La Constitution..."
 GRE_constitution_desc: "La Constitution est la dernière chose dont nous devons nous occuper avant de nous consolider au pouvoir et de reconstruire la Grèce telle que nous la concevons."
 GRE_european_communists: "Communistes européens"
 GRE_european_communists_desc: "Le communisme a laissé des traces dans les Balkans, depuis la fin de l'URSS et la chute du bloc communiste. Peut-être qu'avec suffisamment de pouvoir et quelques manœuvres, nous pourrons rallumer le flambeau laissé par nos camarades. Tout ce dont nous avons besoin, c'est d'une étincelle pour allumer le feu."
 GRE_bulgaria: "Amener la révolution en Bulgarie"
 GRE_bulgaria_desc: "La Bulgarie, qui était autrefois une nation communiste prospère, s'est perdue après l'effondrement de l'URSS. En lui donnant une autre nation à admirer et à suivre, nous devrions pouvoir permettre au communisme de s'implanter à nouveau."
 GRE_albania: "Amener la révolution en Albanie"
 GRE_albania_desc: "L'Albanie est une nation qui a connu de nombreuses difficultés. Il suffit de lui accorder une protection et une aide au développement économique pour gagner les cœurs et les esprits du peuple albanais tout en respectant, dans une certaine mesure, sa souveraineté."
 GRE_macedonia: "Amener la révolution en Macédoine"
 GRE_macedonia_desc: "La Macédoine faisait autrefois partie de la Yougoslavie et bénéficiait du même communisme que la Serbie. Toutefois, après l'éclatement de la Yougoslavie et en raison d'idées fausses sur le plan culturel, elle a abandonné la voie du communisme. La dissipation de ces idées fausses permettra à la population de soutenir à nouveau un gouvernement socialiste."
 GRE_serbia: "Amener la révolution en Serbie"
 GRE_serbia_desc: "La Serbie a été le centre de la Yougoslavie sous le régime communiste. Si les serbes ont adopté une idéologie nationaliste, certains nourrissent encore des sympathies communistes, et le pays est une cible parfaite pour l'expansion de la révolution."
 GRE_romania: "Amener la révolution en Roumanie"
 GRE_romania_desc: "La Roumanie est riche en ressources et en puissance militaire. L'extension de la révolution à ce pays montrerait certainement au monde que le communisme s'est réinstallé dans les Balkans."
 GRE_dictatorship: "Le début de la dictature"
 GRE_dictatorship_desc: "Une fois nos ennemis vaincus, nous pourrons enfin commencer à diriger la nation comme elle aurait toujours dû l'être."
 GRE_cypriot_question: "La question chypriote"
 GRE_cypriot_question_desc: "Les tensions ont atteint un point culminant, nous devons agir maintenant. §RCeci nous conduira à la guerre avec la Turquie et ses alliés§! ; cependant, si nous prenons le contrôle de Chypre dans les 30 jours tout en conservant la majeure partie de notre territoire principal, nous pourrons peut-être signer un traité de paix."
 GRE_turkish_trade: "Commerce turc"
 GRE_turkish_trade_desc: "L'une des meilleures façons de promouvoir de bonnes relations entre deux nations est de coopérer économiquement l'une avec l'autre. En encourageant le commerce avec la Turquie, les deux pays en bénéficieront gratuitement."
 GRE_settle_eez_dispute: "Régler le différend sur la ZEE"
 GRE_settle_eez_dispute_desc: "Le conflit sur la zone économique exclusive n'a pas de raison d'être. Tant que nous favorisons le libre-échange entre nos zones économiques exclusives et que nous nous répartissons équitablement les ressources, nous pourrions enfin mettre un terme à ce conflit inutile."
 GRE_increased_privatization: "Privatisations accrues"
 GRE_increased_privatization_desc: "L'augmentation de la privatisation du secteur industriel grec pourrait être bénéfique au renforcement de notre industrie, à la création de nouvelles opportunités d'emploi et au renforcement de l'économie grecque dans son ensemble."
 GRE_leadership: "Gouvernance éternelle"
 GRE_leadership_desc: "Notre dirigeant Nikólaos Michaloliákos a réussi à unir le peuple grec et à créer la société grecque parfaite. Michaloliákos et le parti Aube dorée doivent diriger la Grèce à vie."
 GRE_new_greece_old_ways: "Nouvelle Grèce, vieilles méthodes"
 GRE_new_greece_old_ways_desc: "Pendant des décennies, nous avons été dirigés par des gouvernements qui ont plongé notre pays dans le chaos. Aujourd'hui, le peuple grec exige un changement, afin que nous puissions revenir à l'époque où nous étions réputés dans le monde entier.\n§RParce que nous consacrons du temps à consolider le pouvoir du nouveau gouvernement, nous souffrirons plus longtemps de la crise économique, mais nous serons en mesure d'y faire face plus rapidement lorsque nous contrôlerons l'économie.§!"
 GRE_draft_youth_wing: "Enrôler l'aile de la jeunesse"
 GRE_draft_youth_wing_desc: "Comme nous avons obtenu davantage de soutien de la part des jeunes, nous devrions les organiser en groupes paramilitaires, afin qu'ils puissent défendre le pays contre les ennemis de la révolution."
 GRE_foreign_relations: "Relations étrangères"
 GRE_foreign_relations_desc: "L'établissement de relations avec les pays étrangers est l'une des clés d'une politique réussie. Nous devrons choisir l'un ou l'autre camp concernant diverses questions."
 GRE_dev_cyp: "Développer Chypre"
 GRE_the_hellenic_republic: "La République hellénique"
 GRE_the_hellenic_republic_desc: "Malgré les troubles auxquels nous sommes confrontés, nous ne devons pas abandonner les idéaux de la démocratie et nous tourner vers la tyrannie pour résoudre nos problèmes, car cela reviendrait à trahir chaque homme et chaque femme en Grèce."
 GRE_discredit_eu: "Discréditer l'Union européenne"
 GRE_discredit_eu_desc: "Pour préserver nos idéaux, nous devons montrer aux citoyens les vraies valeurs de la démocratie et dénoncer le radicalisme comme une menace pour la liberté."
 GRE_support_eu: "Soutenir l'Union européenne"
 GRE_support_eu_desc: "L'Union européenne promeut la coopération entre les nations, les valeurs démocratiques, dénonce le radicalisme et souhaite une Europe pacifique. La Grèce devrait renforcer ses liens avec l'Union européenne."
 GRE_dominant_party_desc: "Comme dans toutes les nations démocratiques, les partis jouent un rôle important dans la politique de notre pays et nous devrons choisir judicieusement le parti qui guidera notre pays vers l'avenir."
 GRE_dominant_party: "Le parti dominant"
 GRE_new_democracy: "Nouvelle démocratie"
 GRE_new_democracy_desc: "Le parti de centre-droit « Nouvelle démocratie », qui a fait preuve de compétence dans tous ses gouvernements et dont l'idéal est de maintenir nos traditions, est le parti le plus apte à diriger la Grèce."
 GRE_socialist_coalition: "COGARA"
 GRE_socialist_coalition_desc: "Les principaux partis grecs ont laissé tomber le pays et l'ont plongé dans une catastrophe économique, tout en divisant notre société. La Grèce a besoin d'un nouveau parti pour guider son peuple vers l'avant, et nous nous rallierons au parti de gauche COGARA, qui défend le peuple et s'oppose aux politiques des gouvernements précédents."
 GRE_economic_liberalism: "Libéralisme économique"
 GRE_economic_liberalism_desc: "Le libéralisme économique doit être notre priorité si nous voulons renforcer l'économie grecque. Il nous permet d'accroître les échanges commerciaux et d'offrir à nos citoyens des avantages économiques plus importants, tels que des possibilités d'emploi."
 GRE_anti_migration_policies: "Politiques anti-migratoires"
 GRE_anti_migration_policies_desc: "Ces dernières années, la Grèce a attiré un grand nombre de migrants. Si notre gouvernement tolère les migrants qui viennent en Grèce à la recherche d'opportunités économiques, ce sont les migrants illégaux qui nous préoccupent, car leur nombre augmente lentement et nous devrons mettre en place des restrictions plus sévères."
 GRE_counter_radicals: "Contrer les radicaux"
 GRE_counter_radicals_desc: "Les partis radicaux en Grèce gagnent lentement en popularité et leur principal objectif est de détruire l'idéologie que notre nation a créée : la démocratie. Ces partis sont également considérés par beaucoup comme des organisations criminelles en raison des attaques spécifiques organisées contre certains groupes. Si nous voulons maintenir la démocratie, nous devrons contrer l'influence des partis radicaux."
 GRE_increase_corruption_measures: "Mesures anti-corruption"
 GRE_increase_corruption_measures_desc: "La Grèce connaît depuis longtemps un problème de corruption qui s'étend à tous les secteurs de l'administration et qui a créé de nombreux problèmes pour l'État. Si nous voulons créer une meilleure administration, nous devrons éradiquer la corruption au sein du gouvernement."
 GRE_increase_industrial_privatization: "Augmenter les privatisations"
 GRE_increase_industrial_privatization_desc: "Le système public grec est l'un des plus grands secteurs de la Grèce. Cela a créé un problème pendant un certain temps, car le secteur privé grec est relativement faible. Il y a peu de concurrence par rapport à d'autres pays. Si nous voulons développer notre économie, nous devrons nous éloigner du secteur public et nous tourner vers le secteur privé."
 GRE_reinforce_justice: "Renforcer le système judiciaire"
 GRE_reinforce_justice_desc: "Dans de nombreuses régions de notre pays, la criminalité est répandue en raison de l'absence d'une application adéquate de la loi. Notre gouvernement devra renforcer le système judiciaire afin de réduire le taux de criminalité en Grèce."
 GRE_begin_changing_education_system: "Réformes du système éducatif"
 GRE_begin_changing_education_system_desc: "Le système éducatif grec est loin d'être à la hauteur de celui des autres pays européens en termes d'écoles, de financement et d'opportunités pour les personnes moins qualifiées. Si nous voulons disposer d'un système éducatif moderne, nous devrons mettre en œuvre des réformes radicales et créer un meilleur environnement pour nos enfants."
 GRE_worker_rights: "Droits des travailleurs"
 GRE_worker_rights_desc: "Dans le cadre de nos politiques, nous renforcerons les droits des travailleurs afin de réduire les inégalités pour tous les travailleurs et travailleuses en Grèce."
 GRE_question_eu_policies: "Questionner les politiques de l'UE"
 GRE_question_eu_policies_desc: "Si nous pensons que l'Union européenne est bénéfique, un grand nombre de ses politiques sont inacceptables, comme le renforcement du contrôle économique. Tant que ces politiques existeront, l'Union européenne ne nous apportera aucun avantage."
 GRE_left_united: "La gauche unie"
 GRE_left_united_desc: "Notre parti est composé de plusieurs branches de la gauche, ce qui a créé des problèmes au sein de notre parti pendant de nombreuses années. C'est pourquoi nous devons renforcer l'unité de notre parti, afin de pouvoir véritablement unir la gauche."
 GRE_support_the_public_sector: "Soutien au secteur public"
 GRE_support_the_public_sector_desc: "Le secteur public est le plus important en Grèce et emploie un nombre considérable de personnes. Le renforcement et la modernisation du secteur public pourraient également créer de nouvelles opportunités d'emploi et renforcer le soutien à notre gouvernement."
 GRE_remind_the_failures_of_pasok_and_new_democracy: "Les échecs du MOSOP et de Nouvelle démocratie"
 GRE_remind_the_failures_of_pasok_and_new_democracy_desc: "Nous devons rappeler au peuple grec les échecs du MOSOP et de Nouvelle démocratie, qui ont réussi à accroître les inégalités économiques et sociales, à porter la dette extérieure à 300 milliards de dollars, à créer une crise de la dette et à augmenter les taux de corruption. Ils doivent comprendre que le peuple grec n'a pas oublié leurs échecs."
 GRE_encourage_agricultural_growth: "Encourager la croissance agricole"
 GRE_encourage_agricultural_growth_desc: "L'agriculture est de loin le secteur le plus important et le plus solide de notre économie et bon nombre de nos exportations vers d'autres pays sont des produits agricoles tels que l'huile d'olive. L'augmentation du financement de l'agriculture stimulera notre économie et accroîtra les exportations vers d'autres pays."
 GRE_the_greek_crisis: "Solution à la crise de la dette"
 GRE_the_greek_crisis_desc: "Notre économie, en raison du montant massif de la dette, est proche de l'effondrement. Des mesures drastiques doivent donc être prises pour sauver l'économie grecque."
 GRE_enact_austerity_measures: "Adopter des mesures d'austérité"
 GRE_enact_austerity_measures_desc: "L'adoption de mesures d'austérité pourrait sauver notre économie de l'effondrement, mais ces mesures ne seront pas considérées comme légitimes par la population."
 GRE_reduce_education: "Réduire les fonds pour l'éducation"
 GRE_reduce_education_desc: "Dans le cadre de notre programme d'austérité, il est nécessaire de réduire le financement du système éducatif afin d'économiser les fonds nécessaires à la reprise économique. Cela réduira malheureusement l'efficacité du système éducatif grec, mais cela aidera notre pays à terme."
 GRE_reduce_health: "Réductions des dépenses de santé"
 GRE_reduce_health_desc: "Les sommes consacrées au système de santé grec sont trop importantes pour notre économie. Si nous réduisons les fonds alloués aux soins de santé, cela pourrait potentiellement aider notre économie, mais cela aurait pour conséquence d'aggraver les conditions d'hospitalisation de nos concitoyens."
 GRE_reduce_welfare: "Réduction des aides sociales"
 GRE_reduce_welfare_desc: "Notre pays a beaucoup investi dans l'aide sociale, qui a certes amélioré la qualité de vie de nos citoyens, mais qui a aussi réduit les fonds nécessaires au renforcement de notre économie. Pour sauver l'économie, nous devons mettre fin à l'État-providence qui a fait la réputation de notre pays."
 GRE_reduce_army: "Réduire les dépenses militaires"
 GRE_reduce_army_desc: "Ces dernières années, la nécessité d'augmenter le financement de l'armée a perdu de son intérêt, car notre pays ne partira pas en guerre de sitôt. Il serait donc judicieux de retirer une partie des fonds destinés à l'armée afin de renforcer des secteurs plus importants de notre économie."
 GRE_recovery: "Relance économique"
 GRE_recovery_desc: "Après des décisions difficiles et des mesures d'austérité sévères, notre pays a réussi à stopper le déclin économique et à réduire sa dette massive. Espérons que notre pays deviendra aussi grand qu'il l'était à l'époque des empires."
 greece.1.t: "Indignation face aux nouvelles politiques d'austérité"
 greece.1.d: "Aujourd'hui, le gouvernement grec a mis en œuvre de nouvelles mesures d'austérité pour se conformer au plan de sauvetage de la dette de l'UE. Il s'en est suivi une vague d'indignation de la part de la population, qui a brandi des pancartes telles que « L'austérité est anti-grecque ». Ces émeutes ne font qu'aggraver la situation de la Grèce et l'on peut supposer qu'il ne s'agit que de la partie émergée de l'iceberg."
 greece.1.a: "J'ai un mauvais pressentiment..."
 greece.2.t: "Des émeutes dans les rues !"
 greece.2.d: "Aujourd'hui, les manifestations à Athènes ont tourné à la violence après que la police a tenté de contenir la foule de plus en plus nombreuse. Des gaz lacrymogènes et des balles en caoutchouc ont été utilisés pour tenter d'empêcher la foule de causer davantage de dégâts, et bien que la foule se soit finalement retirée, les tensions sont toujours présentes."
 greece.2.a: "Ce sont eux qui ont commencé !"
 greece.3.t: "Les tensions s'aggravent"
 greece.3.d: "Les foules se sont agrandies et manifestent de plus en plus de mécontentement. Il ne fait aucun doute que la situation n'a fait qu'empirer."
 greece.3.a: "Comment cela a-t-il pu arriver ?"
 greece.4.t: "L'Aube dorée appelle à des élections en Grèce"
 greece.4.d: "Après avoir bénéficié d'un soutien croissant, le parti politique d'extrême droite Aube dorée a demandé au gouvernement d'organiser des élections, une demande que le gouvernement grec a acceptée en raison du soutien important de la population et de la pression interne exercée par le gouvernement. Le parti Aube dorée devrait l'emporter car il bénéficie d'un soutien important et a menacé de prendre des mesures de représailles contre le gouvernement si ce dernier ne l'autorisait pas à gagner."
 greece.4.a: "Une nouvelle aube pour la Grèce"
 greece.4.b: "Intéressant"
 greece.5.t: "Le PCG appelle à des élections en Grèce"
 greece.5.d: "Après avoir obtenu le soutien de la majorité de la classe ouvrière grecque et de plusieurs personnalités politiques, le PCG (Parti communiste grec) a appelé le gouvernement à organiser des élections, ce que le gouvernement grec a accepté étant donné que le PCG avait obtenu un soutien massif et que le gouvernement subissait des pressions de la part de nombreux politiciens pour organiser des élections. Le PCG devrait remporter les élections car il bénéficie d'un soutien majoritaire au sein de la population. Un porte-parole du parti a déclaré que si le parti n'était pas autorisé à organiser des élections, la classe ouvrière lancerait un soulèvement pour renverser le gouvernement."
 greece.5.a: "Travailleurs de Grèce, levez-vous !"
 greece.5.b: "Intéressant"
 greece.6.t: "La Grèce se rapproche de la droite"
 greece.6.d: "Après des tensions politiques et une crise économique et migratoire, la population grecque s'est lassée des gouvernements démocratiques et en est venue à soutenir le parti d'extrême droite Aube dorée. Le parti Aube dorée s'oppose aux politiques économiques du gouvernement, est fortement anti-gauche et anti-immigration et a promis au peuple grec d'éliminer tous les problèmes de la société grecque."
 greece.6.a: "La Grèce se relèvera"
 greece.6.b: "Intéressant"
 greece.7.t: "La Grèce se rapproche de la gauche"
 greece.7.d: "Après les politiques économiques dures mises en place par le récent gouvernement grec, le chômage a augmenté et la classe ouvrière grecque exige des mesures contre le gouvernement grec. La classe ouvrière s'est ralliée au parti d'extrême gauche PCG (Parti communiste grec). Le PCG s'oppose au chômage et aux violations des droits des travailleurs, tout en soutenant les politiques anti-occidentales et en organisant constamment des émeutes composées de travailleurs pour faire pression sur le gouvernement grec."
 greece.7.a: "Travailleurs de Grèce, votre libération arrive"
 greece.7.b: "Intéressant"
 greece.12.t: "Aléxis Tsípras devient le meneur de COGARA"
 greece.12.d: "Le 10 août 2008, le parti de gauche COGARA a élu Aléxis Tsípras, 33 ans, à la tête du parti, ce qui fait de lui l'un des plus jeunes dirigeants de parti politique de l'histoire de la Grèce."
 greece.12.a: "Félicitations"
 greece.13.t: "Émeutes en Chypre du Nord"
 greece.13.d: "Des émeutes armées ont éclaté en Chypre du Nord contre le programme grec de promotion d'une Chypre unifiée. Ces émeutes ont manifestement été organisées par les autorités turques, mais leur animosité a définitivement fait reculer la façon dont nous sommes perçus."
 greece.13.a: "Quelle horreur !"
 greece.14.t: "Les syndicats apportent leur soutien"
 greece.14.d: "Notre récent assaut contre la constitution nous a valu une opposition politique considérable. Les syndicats ont offert leur soutien en échange de plus de pouvoir. Avons-nous vraiment le choix ?"
 greece.14.a: "Nous n'avons pas le choix."
 greece.15.t: "Les syndicats exigent davantage de concessions"
 greece.15.d: "Les syndicats nous rendent à nouveau visite, mais ce n'est pas leur soutien qu'ils nous offrent cette fois, c'est leur soutien qu'ils menacent de nous retirer si nous ne leur concédons pas encore plus de pouvoir."
 greece.15.a: "Les salauds !"
 greece.16.t: "Des fondations fissurées"
 greece.16.d: "Il est de plus en plus difficile de dormir chaque nuit, car le pays est en train de se désintégrer. Les villes les plus au nord subissent des attaques organisées qui ont fait des centaines de victimes de part et d'autre. Nous ne pourrons pas les retenir longtemps avec une telle force.\n\n§RIl est inutile d'essayer de les contenir dans le nord. Nous devons concentrer nos troupes sur la défense d'Athènes et de ses environs. Je vous donne rendez-vous sur la ligne de front.§!"
 greece.16.a: "Je veux les généraux ici, maintenant !"
 greece.17.t: "Le temps presse"
 greece.17.d: "Nos prédictions étaient justes : les rebelles du nord se sont organisés en armée, mais ils ne semblent pas aussi agressifs que nous l'avions imaginé... \nAttendez, je dois prendre ça... \nOui. \nOui.\nVous êtes sûr ?\n\n...Putain."
 greece.17.a: "« Il semble qu'il y ait de multiples tentatives de percer nos lignes. »"
 greece.18.t: "La Grèce offre le Pirée"
 greece.18.d: "Le port du Pirée a récemment fait l'objet d'un appel d'offres de la part du gouvernement grec dans le but de trouver des fonds pour faire face à la crise de la dette. L'ajout du Pirée à notre collection serait une initiative plus qu'intéressante et ouvrirait la voie à d'autres projets en Grèce et en Europe, ce qui nous permettrait d'étendre notre influence dans la région."
 greece.18.a: "Envoyez l'offre la plus élevée."
 greece.18.b: "Notre désintérêt pour un tel projet ne peut être exprimé par des mots."
 greece.19.t: "La Chine fait une offre pour le Pirée"
 greece.19.d: "Les chinois ont montré de l'intérêt pour le port du Pirée et ont par la suite fait une offre considérable pour obtenir les droits exclusifs sur le port, qu'ils ont remportée. Ce que la Chine décide de faire avec le port à l'avenir lui appartient, toutefois, nous avons également la possibilité d'empêcher la Chine d'agrandir le port ou de lancer d'autres projets si nous estimons que cela est dangereux."
 greece.19.a: "Un pacte avec le diable."
 greece.20.t: "La Chine n'est pas intéressée par le Pirée"
 greece.20.d: "Malgré tous nos efforts, le gouvernement chinois a rejeté notre proposition sans sourciller."
 greece.20.a: "Pour le meilleur ou pour le pire, je ne saurais le dire."
 greece.22.t: "Les tensions liées à l'austérité se dissipent"
 greece.22.d: "C'est généralement une journée « calme » pour la Grèce, car les manifestations contre l'austérité semblent s'être arrêtées pour l'instant. Peut-être s'agit-il simplement de l'épuisement d'une protestation constante, peut-être s'agit-il d'autre chose."
 greece.22.a: "Dieu merci."
 greece.23.t: "L'Énosis, enfin !"
 greece.23.d: "Après des décennies de troubles, de séparations et d'anxiété quant aux liens familiaux et aux relations entre les uns et les autres, les conférences sur l'Énosis ont porté leurs fruits.\n\nLes chypriotes grecs font la fête dans les rues, les chypriotes turcs ont été suffisamment apaisés et les britanniques semblent quelque peu satisfaits des arrangements que nous avons trouvés.\n\nIl reste cependant une question persistante : que faire d'Akrotiri et de Dhekelia ?"
 greece.23.a: "Demandons le contrôle complet"
 greece.23.b: "Permettre à la RAF de conserver ses bases"
 greece.24.t: "Le gouvernement grec veut récupérer Akrotiri !"
 greece.24.d: "Ayant atteint ses objectifs d'Énosis, le gouvernement grec est venu nous demander de restituer les bases d'Akrotiri et de Dhekelia... devrions-nous les laisser retourner sous la domination grecque ?"
 greece.24.a: "Ce serait une erreur de ne pas le faire !"
 greece.24.b: "Pas question !"
 greece.25.t: "Le gouvernement grec nous autorise à rester à Chypre !"
 greece.25.d: "Après avoir atteint son objectif d'Énosis, le gouvernement grec s'est rendu compte que la restitution d'Akrotiri et de Dhekelia serait un inconvénient pour tous, heureusement nous n'aurons pas à déplacer nos troupes de ce territoire."
 greece.25.a: "Un bon coup de pouce !"
 GRE_tax_relief_for_businessman: "Allégements fiscaux pour les entrepreneurs"
 GRE_tax_relief_for_businessman_desc: "Nous devons aider financièrement les entreprises qui ont été laissées à leur sort par les politiques de nos administrations précédentes, et nous réduirons donc leurs impôts."
 istanbul_renamed: "Istanbul rebaptisée"
 GRE_9833_name: "Constantinople"
 GRE_constantinople_not_istanbul: "Constantinople, pas Istanbul"
 GRE_constantinople_not_istanbul_desc: "Istanbul était Constantinople\nMaintenant, c'est Istanbul, pas Constantinople\nIl y a longtemps que Constantinople n'est plus là\nMaintenant, c'est un délice turc par une nuit de pleine lune"
 GRE_gain_10_strength: "§HChypriotes grecs§! §GGAINENT§! §H10 de force !§!"
 GRE_lose_10_gain_10: "§HChypriotes turcs§! §RPERDENT§! §H10 de force !§!"
 GRE_austerity_idea: "Tensions liées à l’austérité"
 GRE_austerity_idea_desc: "Alors que nous poursuivons la mise en œuvre des mesures d'austérité, le mécontentement du peuple grec s'accroît. Ce mécontentement s'amplifie et pourrait bien mener à des émeutes si nous n'agissons pas rapidement. Plus la situation s'aggrave, plus elle risque de dégénérer en une situation bien plus grave."
 GRE_please_south_desc: "En continuant à satisfaire les Chypriotes grecs, nous pouvons garantir qu’ils seront plus enclins à nous soutenir dans notre quête d’unification de Chypre et, en fin de compte, dans l’objectif d’Enosis."
 GRE_please_north_desc: "Il souligne que les Chypriotes turcs ne sont ni grecs ni chypriotes. Ce sont des colonisateurs et des envahisseurs qui doivent être chassés de Chypre."
 TUR_CYP_incite_riot_desc: "Il est temps que nous commencions à inciter aux émeutes dans le sud de Chypre pour garantir que les Grecs ne puissent pas gagner en influence politique dans la région."
 TUR_CYP_propaganda_north_desc: "Renforcer et diffuser la propagande auprès des Chypriotes du Nord afin de s’assurer qu’ils ne soient pas influencés par les Grecs est essentiel à notre succès dans la région."
 TUR_CYP_propaganda_south_desc: "Renforcer et diffuser la propagande auprès des Chypriotes du Sud afin de s’assurer qu’ils ne soient pas influencés par les Grecs est essentiel à notre succès dans la région."
 TUR_attack_CYP_strength_desc: "En attaquant la force chypriote-grecque, nous pouvons nous assurer qu’elle ne gagne pas d’influence politique dans la région."
 GRE_attack_turkish_strength_desc: "En attaquant la force chypriote-turque, nous pouvons nous assurer qu’elle ne gagne pas d’influence politique dans la région."
 GRE_nato_pressure_turkey_accept_tt: "Les alliés qui soutiennent la Grèce apaisent la tension en Égée et créent une dynamique sur Chypre, augmentant la chance que la Turquie recule dans le mois."
 GRE_nato_pressure_turkey_reject_tt: "Les alliés qui refusent n'ajoutent aucun poids diplomatique, ce qui rend la Turquie moins susceptible de céder."
 GRE_hellenic_economy: "L'économie hellénique"
 GRE_hellenic_economy_desc: "L'économie grecque est dans une situation difficile. Dette croissante, chômage et question de l'entrée dans la zone euro pèsent tous. Pourtant, nous avons une marine marchande forte, une position stratégique et un tourisme qui attire des millions de visiteurs chaque année. Tirons le meilleur de ce que nous avons."
 GRE_debt_mounts: "La dette s'accumule"
 GRE_debt_mounts_desc: "Notre dette a gonflé jusqu'à près de 300 milliards de dollars, l'une des plus élevées par habitant au monde. Les intérêts dévorent une énorme part du budget, laissant peu de place à l'investissement. Les banquiers étrangers s'impatientent et l'UE veut des réponses. Il faut agir avant que cela n'empire."
 GRE_debt_mounts_req_tt: "Notre §Yratio de dette unifié§! est supérieur à §Y90%§! (Actuel §Y[?GRE_unified_debt_ratio|-1%]§!)"
 GRE_brics_membership_req_tt: "Le score d'alignement oriental est supérieur à 7"
 GRE_pillar_of_the_west_req_tt: "L'engagement occidental est supérieur à 3"
 GRE_aegean_assertiveness_event_tt: "§YDans 90 jours, la Turquie répondra à nos patrouilles en Égée.§!"
 GRE_cyprus_gas_crisis_event_tt: "§RLes tensions étant déjà élevées, le forage provoquera une réaction navale turque en quelques jours.§!"
 GRE_greek_bonds: "Retour sur les marchés obligataires"
 GRE_greek_bonds_desc: "Athènes est hors de prix pour l'emprunt de long terme depuis la crise, laissant le Trésor dépendant des bons à court terme et des décaissements des créanciers. Une émission de référence à dix ans, commercialisée par l'Agence de gestion de la dette publique auprès de fonds européens et américains, testerait si les investisseurs sont prêts à prêter à nouveau à la Grèce à des conditions normales."
 GRE_solve_evasion: "Résoudre l'évasion fiscale"
 GRE_solve_evasion_desc: "Des milliards de recettes se perdent chaque année dans l'évasion fiscale. Si nous renforçons le recouvrement, investissons dans de meilleures technologies et réprimons les comptes offshore, nous pourrons boucher les failles et remettre le budget sur les rails."
 GRE_convert_to_euro: "Passer à l'euro"
 GRE_convert_to_euro_desc: "L'euro est à la fois une opportunité et un risque. L'adopter lie notre économie à celle de l'Europe, plus de stabilité que la drachme n'en a jamais eue, mais nous perdons le contrôle de notre politique monétaire. À nous de juger si le compromis en vaut la peine."
 GRE_skouries_mines: "Mines de Skouries"
 GRE_skouries_mines_desc: "Le gisement cuivre-or de Skouries en Chalcidique est l'un des plus grands d'Europe. Des sociétés étrangères veulent les droits d'extraction et promettent emplois et richesses. Les écologistes s'y opposent. Il faudra décider ce qui compte le plus."
 GRE_local_manufacturing: "Fabriqué en Grèce"
 GRE_local_manufacturing_desc: "L'industrie manufacturière grecque s'est réduite à une poignée de secteurs : agroalimentaire, ciment, aluminium, pharmacie et construction navale sur la côte de Perama. Une préférence nationale dans les marchés publics, associée à des incitations d'investissement au titre de la loi sur le développement, donnerait aux usines survivantes les carnets de commandes nécessaires pour réembaucher."
 GRE_military_industrial: "L'industrie d'armement hellénique"
 GRE_military_industrial_desc: "Elliniki Viomichania Oplon et sa sœur Pyrkal arment les soldats grecs depuis la guerre froide, mais des décennies de propriété d'État les ont laissées endettées, avec des lignes à l'arrêt. Des subventions ciblées et durables pourraient maintenir les fours, assurer un approvisionnement national en munitions et armes légères, et fusionner les deux en un seul fabricant compétitif plutôt qu'un fardeau perpétuel pour le Trésor."
 GRE_agriculture_sector: "L'épine dorsale des campagnes"
 GRE_agriculture_sector_desc: "Près d'un Grec sur cinq tire encore sa vie de la terre, des oliveraies du Péloponnèse aux champs de coton de Thessalie. Pourtant le secteur vieillit, morcelé en minuscules parcelles, et dépend de Bruxelles pour ses subventions au titre de la PAC. Soutenir nos agriculteurs tout en poussant irrigation, coopératives et machines modernes garderait les olives de Kalamata, la feta et l'Assyrtiko sur les tables du monde."
 GRE_power_corporations: "La Public Power Corporation"
 GRE_power_corporations_desc: "Depuis un demi-siècle, la Public Power Corporation d'État, DEI, a maintenu l'éclairage en brûlant le lignite des fosses de Ptolemaida et Megalopolis. Ce charbon est bon marché mais sale, et notre dépendance au pétrole et au gaz importés nous expose à chaque choc au Moyen-Orient. Moderniser le réseau, étendre le réseau gazier de DEPA et construire de nouvelles centrales ferait de ces services l'épine dorsale stratégique de la nation."
 GRE_austerity_measures: "Mesures d'austérité"
 GRE_austerity_measures_desc: "Les créanciers exigent des pensions réduites, des impôts plus élevés et la suppression d'avantages. Sans austérité, la faillite ; avec elle, la colère publique. Manifestations et grèves sont inévitables. Il n'y a pas de choix faciles."
 GRE_debt_refactoring: "Restructuration stratégique de la dette"
 GRE_debt_refactoring_desc: "Les adjudications d'obligations nous ont acheté du temps, mais ce n'est pas assez. Les créanciers s'impatientent et les intérêts vident le Trésor. Il faut restructurer notre dette : renégocier les termes, allonger les maturités, et montrer à nos partenaires que nous donner de l'air, c'est nous permettre de les rembourser vraiment."
 GRE_ilarionas_hydro: "Hydroélectrique d'Ilarionas"
 GRE_ilarionas_hydro_desc: "La rivière Ilarionas, dans le nord de la Grèce, a un énorme potentiel hydroélectrique. L'hydroélectricité est propre, renouvelable et disponible à la demande, contrairement au solaire ou à l'éolien. Ce projet pourrait alimenter des centaines de milliers de foyers."
 GRE_telecomms: "Investissements OTE"
 GRE_telecomms_desc: "Des millions de Grecs dans les villages insulaires et les bourgs de montagne n'ont toujours pas d'accès fiable au téléphone et à internet. Un investissement d'État dans OTE pourrait relier ces zones au reste du pays, donnant aux agriculteurs l'accès aux marchés et aux étudiants l'accès aux universités."
 GRE_new_railways: "Revitalisation de la ligne ferroviaire Athènes-Thessalonique"
 GRE_new_railways_desc: "Le corridor Athènes-Thessalonique est l'épine dorsale de la Grèce continentale, mais la ligne est douloureusement lente. Du matériel roulant moderne et une voie modernisée pourraient réduire de moitié les temps de trajet et donner un vrai coup de pouce à l'économie provinciale."
 GRE_highway_initiatives: "Prolonger les autoroutes AX"
 GRE_highway_initiatives_desc: "Les montagnes qui divisaient jadis les cités-États isolent encore les communautés et nuisent au commerce. Le réseau d'autoroutes AX proposé traverserait le Pinde et relierait la côte ouest à la Thessalie. Ce sera cher, mais les bénéfices économiques pourraient en valoir la peine."
 GRE_hellas_gold: "Approfondir les mines de Kassandra"
 GRE_hellas_gold_desc: "Le district minier de Kassandra a d'importantes réserves de chrome encore incomplètement exploitées. Approfondir les opérations existantes et investir dans l'équipement d'extraction mettrait cette richesse sur le marché et réduirait notre dépendance aux importations."
 GRE_euboea_bauxite_deposits: "Gisements de bauxite d'Eubée"
 GRE_euboea_bauxite_deposits_desc: "L'Eubée a d'importants gisements de bauxite, minerai principal de l'aluminium. Une extraction à grande échelle pourrait alimenter notre base industrielle et réduire les importations coûteuses."
 GRE_industrial_lignite_mining: "Le bassin de Ptolemaida"
 GRE_industrial_lignite_mining_desc: "Les champs de lignite à ciel ouvert autour de Ptolemaida et Amyntaio en Macédoine-Occidentale alimentent la Public Power Corporation depuis un demi-siècle. Étendre l'excavation et ajouter une usine de liquéfaction ferait du bassin une source de combustible nationale plutôt qu'un district charbonnier vieillissant."
 GRE_rare_element_prospecting: "Prospecter le sous-sol hellénique"
 GRE_rare_element_prospecting_desc: "Les porphyres or-cuivre de Chalcidique, la ceinture de bauxite du Parnasse et du Péloponnèse, et les latérites de nickel d'Eubée ne sont que les gisements cartographiés. Une enquête géologique nationale de l'IGME, adossée à des licences d'exploration, identifierait la prochaine génération de sites d'extraction."
 GRE_transport_sector: "Routes, rails et ferries"
 GRE_transport_sector_desc: "Un pays d'îles et de montagnes vit ou meurt par son transport. Les cars KTEL serpentent dans les cols, les ferries bleu et blanc recousent l'Égée, et les bus et trolleybus de l'OASA portent Athènes au travail chaque matin. Renouveler les parcs vieillissants, étendre les lignes vers les banlieues et tisser route, rail et mer en un seul réseau titré laisserait les marchandises atteindre le marché et les travailleurs leurs emplois."
 GRE_vintage_wines: "Les millésimes de Grèce"
 GRE_vintage_wines_desc: "Les Grecs pressaient le raisin avant que Rome ne soit fondée, et pourtant le monde ne connaît encore notre vin que comme du retsina bon marché en carafe de taverne. C'est faire injure à l'Assyrtiko volcanique de Santorin, au Xinomavro puissant de Naoussa et à l'Agiorgitiko rubis de Némée. Investir dans la mise en bouteille de domaine, les labels d'origine protégée et l'œnotourisme pourrait enfin placer les millésimes grecs aux côtés des grands noms de France et d'Italie."
 GRE_tobacco_plantations: "Tabac Oriental"
 GRE_tobacco_plantations_desc: "La feuille Basma séchée au soleil de Macédoine et de Thrace a parfumé les meilleurs mélanges du monde pendant des générations, et des maisons comme Papastratos au Pirée en ont tiré fortune. Le tabagisme occidental recule, mais la demande perdure dans les Balkans et au Moyen-Orient, et des milliers de petits exploitants autour de Kavala et Xanthi dépendent encore de la récolte. Il faut soutenir les planteurs tout en aidant ceux qui le peuvent à se tourner vers de nouvelles cultures."
 GRE_gas_oil_plants: "Les raffineries de l'Attique"
 GRE_gas_oil_plants_desc: "Les raffineries qui ceignent le golfe Saronique, Hellenic Petroleum à Aspropyrgos et Elefsina et Motor Oil Hellas à Agioi Theodoroi, traitent le brut qui fait tourner la Grèce et la moitié des Balkans. Mais les unités plus anciennes sont fatiguées et leurs marges s'amenuisent. Une nouvelle capacité de craquage, une désulfuration plus propre et un stockage étendu assureraient notre place de pôle de raffinage de la Méditerranée du Sud-Est."
 GRE_trim_the_fat: "Couper dans le gras"
 GRE_trim_the_fat_desc: "Le gouvernement est devenu pléthorique et inefficace. Les ministères sont surstaffés, les contrats vont aux amis et à la famille, et la paperasse étouffe tout. Il faut maigrir en coupant le gaspillage, en automatisant où c'est possible, et en rendant les gens responsables."
 GRE_debt_swaps: "Partenaires d’échange de dettes"
 GRE_debt_swaps_desc: "Échanger notre dette contre des obligations libellées en devises étrangères pourrait réduire notre exposition à la volatilité. Cela exige de bons partenaires bancaires et un peu d'ingénierie financière, mais c'est une façon de gérer la dette avec moins de retombées politiques."
 GRE_debt_swap_initial_tt: "§G50 milliards§! de dette nationale seront transférés au partenaire choisi à un taux d'intérêt de §G3%§!."
 GRE_debt_swap_accepted_opinion: "Swap de dette accepté"
 GRE_debt_swap_rejected_opinion: "Échange de dettes rejeté"
 GRE_olympic_airways: "Compagnies aériennes olympiques"
 GRE_olympic_airways_desc: "Fondée par Aristote Onassis, Olympic Airways fut jadis la fierté de l'aviation grecque. La compagnie a peiné ces dernières années mais le nom pèse encore. Relancer le transporteur pourrait faire venir les touristes et les fidéliser."
 GRE_trainose: "TrainOSE"
 GRE_trainose_desc: "Le système ferroviaire grec, jadis négligé, a repris vie. TrainOSE exploite voyageurs et fret reliant Athènes à Thessalonique, le Péloponnèse au continent. En étendant les lignes, améliorant les horaires et investissant dans le matériel roulant, nous pouvons faire du rail une vraie alternative."
 GRE_cotton_plantations: "Plantations de coton"
 GRE_cotton_plantations_desc: "Le coton grec de Thessalie et de Macédoine est parmi les meilleurs au monde. Fibres solides et excellente qualité en font un atout pour le textile. Soutenir nos cotonniers et investir dans la fabrication pourrait ramener cette industrie où elle devrait être."
 GRE_fisheries_expansion: "Les richesses de l'Égée"
 GRE_fisheries_expansion_desc: "La Grèce débarque plus de daurades et de bars d'élevage qu'aucune nation d'Europe, ses cages alignées le long des golfes abrités de l'Ionienne et de l'Égée. Mais les stocks sauvages s'effondrent sous la surpêche, la pollution et les chalutiers qui poussent au-delà de la frontière maritime. Étendre l'aquaculture, renouveler la flotte côtière et faire respecter des quotas honnêtes garderait en vie pêcheurs et poissons."
 GRE_aegean_wind_banks: "Exploiter le Meltemi"
 GRE_aegean_wind_banks_desc: "Chaque été le Meltemi dévale les Cyclades, l'un des vents les plus réguliers d'Europe. Des turbines alignées sur les îles et les crêtes du continent pourraient verser de l'électricité propre dans le réseau et briser notre dépendance au pétrole et au charbon importés. Le plus grand prix est l'interconnexion qui relierait enfin les générateurs diesel des îles au réseau national."
 GRE_resolution_crisis: "Crise de résolution"
 GRE_resolution_crisis_desc: "Nous gérons la crise depuis trop longtemps au lieu de la résoudre vraiment. Il est temps d'un vrai plan qui traite à la fois dette, croissance, banques et réforme. Ce ne sera pas facile, mais c'est la seule voie. Achever cette focalisation clôt la crise de la dette pour de bon, il faut donc d'abord maîtriser notre dette : intérêts sous 8 % et dette/PIB sous 50 %."
 GRE_urban_railways: "Étendre le métro d'Athènes"
 GRE_urban_railways_desc: "Le métro d'Athènes a transformé la capitale avant les Jeux de 2004, mais des quartiers entiers restent hors de portée, Thessalonique attend depuis des décennies sa propre ligne, et le Proastiakos suburban rail n'effleure que son potentiel. Creuser de nouveaux tunnels, prolonger le tram jusqu'à la côte et relier les villes allégerait le trafic étouffant, dissiperait le smog et relèverait le quotidien de millions de personnes."
 GRE_ionian_solar: "Solaire Ionien"
 GRE_ionian_solar_desc: "Les îles ioniennes reçoivent beaucoup de soleil. Installer des fermes solaires à Corfou, Leucade et Zante nous permettrait d'en tirer parti et de réduire notre dépendance aux fossiles importés."
 GRE_tourism_boom: "Vivez votre mythe en Grèce"
 GRE_tourism_boom_desc: "Des plages de Crète à la caldeira de Santorin et aux ruelles blanchies de Mykonos, la Grèce attire des dizaines de millions de visiteurs chaque année, et le tourisme gagne déjà près d'un cinquième de tout ce que l'économie produit. Une poussée coordonnée de l'Organisation nationale du tourisme sur le marketing, la capacité aéroportuaire et la connectivité insulaire pourrait transformer ce raz-de-marée saisonnier en un vrai pilier de la richesse nationale."
 GRE_tourism_boom_event_TT: "§YUne saison record provoque un débat sur l'affectation de l'argent.§!"
 GRE_mass_tourism: "Soleil, sable et forfaits"
 GRE_mass_tourism_desc: "Remplir les charters de Manchester et Düsseldorf, border les côtes de resorts tout compris, et laisser les foules affluer par millions. Le tourisme de volume inonde le Trésor et maintient un salaire d'été à portée de chaque insulaire, mais il assèche les aquifères de Mykonos, ensevelit les falaises de Santorin sous les croisiéristes, et use la patience de ceux qui y vivent vraiment."
 GRE_premium_tourism: "Yachts et resorts de luxe"
 GRE_premium_tourism_desc: "Moins d'invités, chacun payant bien plus et marchant bien plus léger. Orienter vers les resorts cinq étoiles, le voyage culturel et archéologique, et les marinas de superyachts de l'Ionienne protège les îles fragiles et la marque grecque. Les arrivées en tête d'affiche peuvent monter plus lentement, mais l'argent qui reste derrière va plus profond."
 GRE_diaspora_remittances: "Courtiser la diaspora"
 GRE_diaspora_remittances_desc: "Des millions de Grecs à l'étranger, de Melbourne à Chicago, gardent des liens avec la patrie. Canaliser leurs économies et leurs envois de fonds dans l'économie transforme le sentiment en capital."
 GRE_diaspora_remittances_event_TT: "§YLa diaspora répond à l'appel à l'investissement.§!"
 GRE_reverse_brain_drain: "Inverser la fuite des cerveaux"
 GRE_reverse_brain_drain_desc: "La crise a envoyé une génération d'ingénieurs, médecins et chercheurs grecs à l'étranger. Des allègements fiscaux, des financements de recherche et de vrais emplois peuvent les ramener, eux et leur expertise, au pays."
 GRE_eu_cohesion_funds: "Fonds de cohésion de l'UE"
 GRE_eu_cohesion_funds_desc: "Comme l'un des membres les moins riches de l'Union, la Grèce est bénéficiaire net des fonds structurels et de cohésion. Tirer chaque euro offert finance routes, ports et développement régional."
 GRE_recovery_resilience_facility: "Facilité pour la reprise et la résilience"
 GRE_recovery_resilience_facility_desc: "La Facilité pour la reprise et la résilience post-pandémie canalise des dizaines de milliards vers la transition verte et numérique. Bien dépensée, c'est le plus grand programme d'investissement de l'histoire grecque moderne."
 GRE_recovery_facility_event_TT: "§YBruxelles débloque la première tranche, et Athènes doit décider à quelle vitesse la dépenser.§!"
 GRE_infrastructure_cofinancing: "Cofinancement des infrastructures"
 GRE_infrastructure_cofinancing_desc: "L'argent européen couvre l'essentiel de la facture, l'argent grec le reste. Autoroutes, lignes de métro et réseaux cofinancés se construisent pour une fraction du coût national."
 GRE_deterrence_posture: "Posture de dissuasion"
 GRE_forward_posture_mod: "Posture agressive vers l'avant"
 GRE_defense_partner: "Partenaire de défense"
 GRE_naval_partner: "Partenaire naval"
 GRE_strong_naval_partner: "Partenaire naval proche"
 GRE_defense_exporter: "Exportateur de défense"
 GRE_f35_partner: "Partenaire du programme F-35"
 GRE_aegean_encroachment: "Empiétement égéen"
 GRE_refused_debt_call_opinion: "Demande de remboursement de la dette refusée"
 GRE_debt_forgiven_opinion: "Dette remise"
 GRE_debt_fully_repaid_opinion: "Dette entièrement remboursée"
 GRE_forgave_debt_opinion: "A pardonné notre dette"
 GRE_economy_modifier: "Économie hellénique"
 GRE_debt_crisis_category: "La crise de la dette [GRE.GetAdjective]"
 GRE_debt_crisis_category_desc: "Malgré notre croissance économique, notre dette continue de gonfler, que ce soit par des dépenses publiques inefficaces, des obligations arrivant à maturité ou des déficits budgétaires réguliers. Il faut faire face à notre dette avant qu'elle ne devienne une crise, ou en faire un outil pour assurer notre prospérité dans le nouveau millénaire.\n\nRatio PIB-dette actuel : [?debt_ratio|%Y]\n§YDette détenue par les créanciers§! actuelle : $$[?GRE_total_creditor_debt|0]\n"
 GRE_austerity_tension_mission: "Tensions d'austérité"
 GRE_austerity_tension_mission_desc: "Les coupes et hausses d'impôts ont mis le peuple en colère. Nous devons ramener notre ratio de dette unifié sous §Y75%§! pour mettre fin aux tensions. Chaque fois que le temps expire, les manifestations empirent, et si elles débordent à leur pic, le pays bascule dans une crise de la dette complète."
 GRE_debt_crisis_mission: "La crise de la dette [GRE.GetAdjective]"
 GRE_debt_crisis_mission_desc: "L'austérité a échoué et les marchés ont perdu foi en nous. Nous devons ramener notre ratio de dette unifié sous §Y75%§! par des coupes et en transférant la dette aux créanciers étrangers. Chaque fois que le temps expire, le gouvernement en paie le prix, et notre échec risque d'entraîner toute la zone euro avec nous."
 GRE_austerity_placate_decision: "Apaiser les manifestants"
 GRE_austerity_placate_decision_desc: "Les démarches du gouvernement et des aides ciblées peuvent atténuer la frustration publique. Réduire la pression visible de l'austérité devrait aider à rétablir la stabilité et faire redescendre les tensions."
 GRE_slash_public_spending_decision: "Tailler dans les dépenses publiques"
 GRE_slash_public_spending_decision_desc: "Des coupes générales dans les ministères, la masse salariale publique et les pensions. Les comptes auront meilleure mine, mais le peuple sentira chaque euro. Réduit notre dette nationale de §Y5%§!."
 GRE_emergency_tax_hikes_decision: "Hausses d’impôts d’urgence"
 GRE_emergency_tax_hikes_decision_desc: "Augmenter la TVA et l'impôt sur le revenu pour boucher le trou budgétaire. Les recettes sont réelles, tout comme la colère contre le parti au pouvoir. Réduit notre dette nationale de §Y4%§!."
 GRE_privatization_drive_decision: "Vague de privatisations"
 GRE_privatization_drive_decision_desc: "Mettre aux enchères les actifs d'État, des ports aux services publics, à qui paiera. Un gain unique que les syndicats ne pardonneront pas de sitôt. Réduit notre dette nationale de §Y8%§!."
 GRE_unified_ratio_below_75_tt: "Notre §Yratio de dette unifié§! est inférieur à §Y75%§! (Actuel §Y[?GRE_unified_debt_ratio|-1%]§!)"
 GRE_buys_mission_time_tt: "§GAjoute 30 jours à la mission de dette active§!"
 GRE_austerity_mission_active: "\nLa tension d'austérité actuelle est de §R[gre_austerity_tension]§!"
 GRE_generic_decisions_category: "Décisions politiques de [GRE.GetNameWithFlag]"
 GRE_generic_decisions_category_desc: "Décisions politiques disponibles au gouvernement grec."
 GRE_rename_istanbul_desc: "Constantinople étant sous contrôle grec, le gouvernement restaure officiellement le nom historique de la ville. Le changement de nom a une profonde signification culturelle et remonte le moral national."
 GRE_archipelago_air_base_rapid_repair: "Programme de réparation rapide des bases aériennes"
 GRE_archipelago_air_base_rapid_repair_desc: "Mettre en place des équipes de réparation dédiées et du matériel prépositionné sur les bases aériennes insulaires permet de réparer plus vite les dégâts des frappes ennemies, maintenant notre puissance aérienne opérationnelle."
 GRE_archipelago_anti_air_rapid_repair: "Protocoles d'entretien des batteries anti-aériennes"
 GRE_archipelago_anti_air_rapid_repair_desc: "Des équipes de maintenance mobiles sur les sites de défense aérienne insulaires, avec pièces standardisées et formation, nous laisseraient restaurer plus vite les batteries endommagées et garder le réseau de défense aérienne intact."
 GRE_archipelago_bunker_repair_protocols: "Corps de réparation des fortifications de l'île"
 GRE_archipelago_bunker_repair_protocols_desc: "Des unités du génie spécialisées à travers l'archipel, axées sur la restauration rapide des bunkers. Les fortifications endommagées peuvent retrouver pleinement leur efficacité rapidement."
 GRE_archipelago_naval_base_repair_protocols: "Initiative d'entretien des bases navales"
 GRE_archipelago_naval_base_repair_protocols_desc: "Des matériaux de réparation prépositionnés et des techniciens qualifiés dans les installations navales insulaires permettent de réparer plus vite les infrastructures portuaires et de maintenir les opérations maritimes."
 GRE_archipelago_coastal_obstacle_network: "Réseau d'obstacles côtiers"
 GRE_archipelago_coastal_obstacle_network_desc: "Obstacles sous-marins, champs de mines et barrières sur les zones de débarquement potentielles rendraient bien plus difficile à tout assaut naval ennemi d'atteindre nos côtes."
 GRE_archipelago_supply_disruption: "Refus d’approvisionnement du territoire central"
 GRE_archipelago_supply_disruption_desc: "Une perturbation logistique planifiée sur nos cœurs insulaires rendrait plus difficile à tout occupant ennemi de maintenir ses lignes d'approvisionnement ou d'exploiter les ressources locales."
 GRE_archipelago_coastal_battery_expansion: "Programme d'extension des batteries côtières"
 GRE_archipelago_coastal_battery_expansion_desc: "Étendre nos installations d'artillerie côtière au-delà de ce que le terrain permet normalement. La géographie insulaire ne doit pas limiter notre capacité à défendre le rivage."
 GRE_archipelago_island_fortress_expansion: "Programme d'extension des forteresses insulaires"
 GRE_archipelago_island_fortress_expansion_desc: "Financer des travaux du génie pour construire des bunkers au-delà des limites de terrain actuelles. Nos îles peuvent soutenir des fortifications plus fortes que ne le supposait la doctrine actuelle."
 GRE_archipelago_attrition_doctrine: "Doctrine d'usure de l'archipel"
 GRE_archipelago_attrition_doctrine_desc: "Codifier des tactiques qui utilisent le terrain insulaire pour saigner toute force attaquante. Les unités ennemies à découvert subiraient une usure plus élevée et un harcèlement constant depuis nos positions préparées."
 GRE_archipelago_supply_interdiction: "Opérations d’interdiction d’approvisionnement des îles"
 GRE_archipelago_supply_interdiction_desc: "Former et positionner des unités pour refuser activement aux forces ennemies l'accès aux ressources locales. Tout ennemi opérant sur nos îles verrait ses sources d'approvisionnement systématiquement coupées."
 GRE_archipelago_missile_battery_expansion: "Extension de la défense antimissile insulaire"
 GRE_archipelago_missile_battery_expansion_desc: "Un financement supplémentaire pour construire des sites de défense antimissile au-delà des limites de terrain normales à travers l'archipel. Plus d'investissement du génie nous permet de dépasser les restrictions habituelles du terrain."
 GRE_archipelago_air_defense_expansion: "Réseau de défense aérienne étendu"
 GRE_archipelago_air_defense_expansion_desc: "Relever le plafond de construction des installations antiaériennes au-dessus des limites de terrain standard. Même les plus petites îles pourraient obtenir une couverture de défense aérienne dense."
 GRE_archipelago_decision_active: "Un programme de défense de l'archipel est déjà en cours"
 GRE_archipelago_set1_A_chosen: "Programme de réparation rapide des bases aériennes achevé"
 GRE_archipelago_set1_B_chosen: "Protocoles d'entretien des batteries anti-aériennes terminés"
 GRE_archipelago_set2_A_chosen: "Le Corps de réparation des fortifications de l'île est terminé"
 GRE_archipelago_set2_B_chosen: "Initiative d'entretien des bases navales achevée"
 GRE_archipelago_set3_A_chosen: "Réseau d'obstacles côtiers terminé"
 GRE_archipelago_set3_B_chosen: "Refus d'approvisionnement du territoire central terminé"
 GRE_archipelago_set4_A_chosen: "Programme d'extension des batteries côtières achevé"
 GRE_archipelago_set4_B_chosen: "Programme d'extension des forteresses insulaires achevé"
 GRE_archipelago_set5_A_chosen: "Doctrine d'usure de l'archipel achevée"
 GRE_archipelago_set5_B_chosen: "Opérations d'interdiction d'approvisionnement des îles terminées"
 GRE_archipelago_set6_A_chosen: "Extension de la défense antimissile insulaire achevée"
 GRE_archipelago_set6_B_chosen: "Réseau de défense aérienne étendu achevé"
 GRE_lie_about_financial_records_decision: "Ajuster favorablement les dossiers financiers"
 GRE_lie_about_financial_records_decision_desc: "Malgré notre croissance économique constante, notre monnaie dépassée et d'autres maux économiques nous empêchent de finaliser nos accords économiques avec l'Union européenne."
 GRE_negotiate_debt_swap_deals_decision: "Négocier des accords d’échange de dettes"
 GRE_negotiate_debt_swap_deals_decision_desc: "Ouvrir des négociations avec une puissance étrangère pour restructurer notre dette par des swaps de devises. En transférant nos obligations à la banque centrale d'une autre nation, nous pourrons trouver des conditions de remboursement plus favorables."
 GRE_defer_payments_decision: "Différer les paiements ciblés"
 GRE_defer_payments_decision_desc: "Plutôt que de payer d'avance les programmes économiques, reporter les coûts sur notre dette nationale. Cela préserve le Trésor au prix d'obligations croissantes."
 GRE_do_not_defer_payments_decision: "Reprendre les paiements directs"
 GRE_do_not_defer_payments_decision_desc: "Cesser de reporter les coûts et revenir à payer les programmes économiques directement sur le Trésor."
 CYP_NCY_diplomatic_category: "Pourparlers sur la réunification de Chypre"
 GRE_brit_5_TT: "§GGain de 5 en soutiens britanniques§!"
 GRE_brit_30_TT: "§GGain de 30 en soutiens britanniques§!"
 GRE_unification_TT: "Une fois cette étape franchie, une conférence mensuelle sera organisée, au cours de laquelle des progrès pourront être accomplis, sous réserve d'approbation."
 PER_presidential_decisions_only_one_is_available_TT: "Une seule de ces décisions peut être prise à la fois."
 GRE_homelessness_crisis_category: "La crise des sans-abri athénienne"
 GRE_homelessness_crisis_category_desc: "Après le séisme de 1999 à Athènes, des milliers de citoyens grecs sont sans abri. Aide et réparations sont en cours dans la ville, mais nous pouvons choisir d'accélérer l'initiative pour achever la réparation des quartiers urbains et résidentiels."
 GRE_reconstruction_efforts_in_athens_decision: "Financer des efforts de reconstruction supplémentaires à Athènes"
 GRE_reconstruction_efforts_in_athens_decision_desc: "Le séisme a gravement endommagé Athènes. Immeubles effondrés, infrastructures endommagées, quartiers entiers réduits en ruines. Les premières réparations ont commencé mais les fonds de secours ne suffisent pas. Diriger des fonds supplémentaires vers la reconstruction accélérerait l'effort."
 GRE_issue_relief_funds_to_victims_decision: "Verser des fonds de secours aux victimes du séisme"
 GRE_issue_relief_funds_to_victims_decision_desc: "Au-delà des destructions physiques, le séisme a laissé de nombreuses familles sans rien. Économies anéanties, commerces détruits, blessés. Verser des fonds de secours directs aux victimes fournirait une aide immédiate : nourriture, vêtements, logement temporaire et le minimum pour commencer à reconstruire."
 GRE_petition_turkey_for_support_decision: "Solliciter le soutien de [TUR.GetName]"
 GRE_petition_turkey_for_support_decision_desc: "Solliciter [TUR.GetNameWithFlag] pour un soutien à notre relèvement post-séisme. Espérons qu'ils trouveront en leur cœur de nous soutenir dans le besoin."
 GRE_cypriot_TT: "§YChypre§! déclare la guerre à §YChypre du Nord§!"
 GRE_debt_crisis_experienced_tt: "Nous avons affronté la §Rcrise de la dette§!"
 GRE_joining_the_euro_interest_rate_tt: "Modifie les conditions de §Y$EU_join_the_euro_decision$§! :\n- Condition de §Ytaux d'intérêt§! à §Y6.5%§! au lieu de §Y3.5%§!\n"
 GRE_defer_payments_decision_tt: "Nous permet de reporter le paiement des actions futures (ex. décisions, focalisations) sur notre §Ydette nationale§! ou un §Ycréancier étranger§! au lieu de payer en cash."
 GRE_golden_visa_deals: "Les Golden Visas"
 GRE_golden_visa_deals_desc: "Le programme Golden Visa offre un permis de séjour de cinq ans à tout investisseur engageant une somme éligible dans l'immobilier ou les affaires [GRE.GetAdjective]. Les acheteurs fortunés hors UE ont montré un fort intérêt, fournissant une ligne directe de capitaux étrangers vers le marché intérieur."
 GRE_targeted_pension_reforms: "Des réformes ciblées des retraites"
 GRE_targeted_pension_reforms_desc: "Le système de pensions absorbe une part disproportionnée du PIB. Des réformes ciblées qui resserrent l'éligibilité, réduisent les abus de retraite anticipée et basculent les pensions complémentaires vers un modèle capitalisé allégeront la charge fiscale sans vider entièrement le filet de sécurité."
 GRE_merchant_marine: "La marine marchande"
 GRE_merchant_marine_desc: "La Grèce exploite la plus grande flotte marchande du monde sous les pavillons de l'Union des armateurs grecs, l'un des lobbies industriels les plus puissants d'Athènes. Les armateurs et leurs familles contrôlent deux cinquièmes du tonnage et font affluer 7-8 % du PIB dans les comptes nationaux via salaires, impôts et droits portuaires. Renforcer leur position concurrentielle maintient ce dynamo en marche."
 GRE_tonnage_tax_regime: "Préserver la taxe au tonnage"
 GRE_tonnage_tax_regime_desc: "Les familles d'armateurs bénéficient depuis longtemps d'un régime de taxe au tonnage favorable qui maintient rentables les navires sous pavillon grec et décourage le changement de pavillon. Maintenir ce régime préserve les recettes qui transitent par les ports et chantiers grecs, gardant en vie les chantiers de Skaramangas, Elefsina et Neorion."
 GRE_tax_the_shipowners: "Taxer les magnats de la marine"
 GRE_tax_the_shipowners_desc: "Les magnats de la marine ont longtemps échappé au fardeau fiscal qui pèse sur les Grecs ordinaires. Démanteler le régime de taxe au tonnage et taxer directement les armateurs extraierait un gain unique important pour le Trésor, même si le changement de pavillon reste une menace constante."
 GRE_shipbuilding_revival: "Relancer les chantiers navals grecs"
 GRE_shipbuilding_revival_desc: "Les chantiers de Skaramangas, Elefsina et Neorion ont jadis construit la flotte marchande qui a apporté la richesse à la Grèce. Restaurer leur capacité par des subventions et contrats ciblés ramènerait l'emploi dans les chantiers et assurerait un approvisionnement national en coques modernes."
 GRE_pdo_exports: "Exportations premium d’origine protégée"
 GRE_pdo_exports_desc: "Olives de Kalamata, huile d'olive extra-vierge, feta et vin Assyrtiko sont mondialement reconnus. Investir dans les labels d'appellation d'origine protégée et le marketing premium sort ces produits de la concurrence de commodité et commande de meilleurs prix sur les marchés internationaux."
 GRE_recapitalize_banks: "Recapitaliser les banques"
 GRE_recapitalize_banks_desc: "Les quatre banques systémiques grecques ont accumulé des billions de prêts non performants pendant la crise. Le Fonds hellénique de stabilité financière pourrait injecter du capital frais par une recapitalisation forcée, restaurant leur capacité à prêter et stabilisant le système financier à un coût fiscal important."
 GRE_hercules_scheme: "Le dispositif de protection des actifs Hercules"
 GRE_hercules_scheme_desc: "Le dispositif HAPS titrise les prêts non performants hors des bilans des banques, débloquant leur capacité de prêt et abaissant le coût du crédit pour les entreprises et ménages."
 GRE_privatize_banks: "Rendre les banques au secteur privé"
 GRE_privatize_banks_desc: "Vendre les participations de l'État dans les banques recapitalisées à des investisseurs privés attirerait une forte demande des entreprises et une source majeure de recettes fiscales. Le vote de confiance du marché signalerait aussi le retour de la Grèce à la normale."
 GRE_state_bank_control: "Garder les banques dans les mains de l'État"
 GRE_state_bank_control_desc: "Conserver la propriété d'État des banques nous permet d'orienter leurs prêts vers la construction intérieure, l'industrie et les secteurs stratégiques sans pression actionnariale pour le profit. Le coût politique de la propriété publique est compensé par le contrôle de l'allocation du crédit."
 GRE_nationalist_takeover_TT: "Le peuple grec exige de nouvelles élections !\n\nAssurez-vous d'avoir suffisamment de poids politique en réserve pour cela. Si vous §Rne parvenez pas§! à élire et à former un gouvernement, vous §Rdevrez organiser de nouvelles élections extraordinaires§! pour donner du pouvoir à l'§Y[Nat_Fascism_L]§!."
 GRE_dev_cyp_desc: "Chypre a souffert de décennies de division et de sous-investissement. L'île étant désormais sous souveraineté grecque, nous pouvons commencer à développer ses infrastructures, son économie et ses institutions au niveau du continent."
 GRE_decrease_taxes: "Baisser les impôts"
 GRE_decrease_taxes_desc: "Le peuple grec ne doit pas être pressuré par une fiscalité élevée. De plus, baisser les impôts pourrait réduire l'évasion fiscale, un gros problème dans notre pays."
 GRE_eastern_neighborhood: "Quartier Est"
 GRE_eastern_neighborhood_desc: "La Grèce doit définir sa relation avec ses plus proches voisins, la Turquie et l'île divisée de Chypre. La façon dont nous engagerons les deux façonnera la région pour une génération."
 GRE_turkey_rapprochement: "Rapprochement avec la Turquie"
 GRE_turkey_rapprochement_desc: "La Grèce et la Turquie ont plus en commun que ni l'une ni l'autre ne l'admet. Un dialogue structuré sur le commerce, la migration et l'Égée peut réduire les tensions et ouvrir une voie vers une coexistence stable."
 GRE_turkey_confrontation: "Faire face aux ambitions turques"
 GRE_turkey_confrontation_desc: "Les violations répétées de l'espace aérien grec et les provocations en Égée par la Turquie ne peuvent rester sans réponse. La Grèce prendra une position ferme et rassemblera ses alliés pour résister à de nouvelles empiètements."
 GRE_aegean_dialogue: "Dialogue égéen"
 GRE_aegean_dialogue_desc: "Un canal formel de dialogue sur les droits et frontières en Égée réduit le risque d'escalade accidentelle et pose les bases d'un accord maritime durable."
 GRE_migration_cooperation: "Coopération migratoire"
 GRE_migration_cooperation_desc: "Coordonner la politique migratoire avec la Turquie est essentiel pour gérer le flux de réfugiés à travers l'Égée. Une responsabilité partagée signifie moins de crises des deux côtés."
 GRE_greco_turkish_trade: "Accord commercial gréco-turc"
 GRE_greco_turkish_trade_desc: "Étendre le commerce bilatéral réduit l'incitation à la confrontation politique. L'interdépendance économique entre Grèce et Turquie sert les intérêts des deux peuples."
 GRE_nato_pressure_turkey: "Pression de l'OTAN sur la Turquie"
 GRE_nato_pressure_turkey_desc: "La Grèce s'appuiera sur sa position au sein de l'OTAN pour tenir la Turquie responsable des violations des normes de l'alliance. Nos alliés doivent reconnaître que la stabilité en Méditerranée orientale exige la retenue turque."
 GRE_aegean_assertiveness: "Assertivité égéenne"
 GRE_aegean_assertiveness_desc: "La marine grecque augmentera patrouilles et exercices dans les eaux contestées pour affirmer la souveraineté sur le plateau continental et l'espace aérien de l'Égée."
 GRE_aegean_deterrence: "Dissuasion égéenne"
 GRE_aegean_deterrence_desc: "Investir dans la défense côtière et les forces de réaction rapide envoie un signal clair : la Grèce est prête à défendre son territoire contre toute incursion."
 GRE_enosis_campaign: "Campagne Enosis"
 GRE_enosis_campaign_desc: "La Grèce lance une campagne diplomatique et culturelle pour renforcer les liens avec la communauté chypriote grecque et promouvoir l'idéal d'une réunification éventuelle avec la mère patrie."
 GRE_cypriot_economic_integration: "Intégration économique chypriote"
 GRE_cypriot_economic_integration_desc: "Approfondir les liens commerciaux et financiers entre la Grèce et la République de Chypre rend la réunification économiquement attractive et renforce l'influence grecque sur l'île."
 GRE_northern_outreach: "Sensibilisation au Nord"
 GRE_northern_outreach_desc: "La Grèce tend la main aux Chypriotes turcs du nord, offrant des incitations économiques et des échanges culturels pour montrer que la réunification sert leurs intérêts autant que ceux de quiconque."
 GRE_british_bases_accord: "Accord sur les bases britanniques"
 GRE_british_bases_accord_desc: "Le Royaume-Uni conserve deux zones de bases souveraines à Chypre. Un accord avec Londres assure la neutralité britannique (ou un soutien actif) à tout futur processus de réunification."
 GRE_cyprus_gas_exploitation: "Exploitation du gaz à Chypre"
 GRE_cyprus_gas_exploitation_desc: "D'importantes réserves de gaz naturel ont été découvertes au sud de Chypre. La Grèce s'emploie à développer ces champs conjointement, créant des enjeux économiques partagés sur une île unifiée."
 GRE_confederation_framework: "Cadre confédéral"
 GRE_confederation_framework_desc: "La Grèce propose un modèle de confédération formel qui préserve l'autonomie des communautés tout en unissant l'île sous une seule souveraineté, un cadre que les deux communautés peuvent accepter."
 GRE_cyprus_reunification: "Réunification de Chypre"
 GRE_cyprus_reunification_desc: "Avec une dynamique chypriote portant un large soutien dans les deux communautés, une tension égéenne assez basse pour que la Turquie n'intervienne pas, l'accord sur les bases britanniques obtenu, et le cadre confédéral pleinement détaillé, le moment de réunir l'île est enfin venu."
 GRE_force_enosis: "Forcer la question"
 GRE_force_enosis_desc: "La négociation a échoué et l'île est une poudrière. Plutôt que d'attendre un règlement qui ne viendra jamais, Athènes pousse l'Enosis au bord, défiant le Nord d'agir. Si la direction chypriote turque de Nicosie frappe la première, la République de Chypre aura tout le droit de réunir l'île par la force."
 GRE_aegean_tension_high_TT: "§BTension en mer Égée supérieure à §H50§!§!"
 GRE_recognize_unified_cyprus: "Reconnaître la République unifiée de Chypre"
 GRE_recognize_unified_cyprus_desc: "Les forces de Nicosie ont submergé le Nord. La partition qui a marqué l'île pendant un demi-siècle est terminée. Athènes reconnaît formellement une seule République de Chypre alignée sur la Grèce et l'aide à intégrer le territoire."
 GRE_western_alignment: "Alignement occidental"
 GRE_western_alignment_desc: "La Grèce réaffirme sa place au centre de la diplomatie occidentale. Membre fondateur de l'OTAN, entrée tôt dans l'UE, et ancre naturelle de la Méditerranée orientale, Athènes s'emploie à convertir son poids géographique en engagements politiques contraignants, lançant une campagne d'ouverture bilatérale et multilatérale qui se mesurera en engagement occidental."
 GRE_franco_hellenic_pact: "Partenariat stratégique franco-hellénique"
 GRE_franco_hellenic_pact_desc: "S'appuyant sur le partenariat stratégique de septembre 2021 signé à Athènes, la Grèce poursuit un cadre bilatéral complet avec la France, couvrant industrie de défense, alignement de politique étrangère et sécurité en Méditerranée orientale. Paris est le partenaire senior le plus disposé en Europe ; le lier plus étroitement est la pierre angulaire de toute posture occidentale crédible."
 GRE_eastmed_trilateral: "Trilatérale de la Méditerranée orientale"
 GRE_eastmed_trilateral_desc: "La Grèce, Israël et Chypre officialisent leur coopération trilatérale de longue date : exercices navals conjoints, partage du renseignement et position coordonnée sur la sécurité en Méditerranée orientale. L'arrangement transforme trois capitales amies en un seul bloc stratégique face au bassin levantin."
 GRE_eu_political_anchor: "Membre fondateur de l’UE"
 GRE_eu_political_anchor_desc: "La Grèce réaffirme son identité de membre fondateur du projet européen. En prenant une voix de premier plan à Bruxelles, sur la cohésion, l'élargissement, la politique étrangère commune, Athènes convertit des décennies d'adhésion en poids politique actuel."
 GRE_strategic_partnership_treaty: "Clause de défense mutuelle de l'article 2"
 GRE_strategic_partnership_treaty_desc: "La Grèce pousse le partenariat franco-hellénique à sa conclusion : une clause de défense mutuelle contraignante calquée sur l'article 5, codifiée en traité. La France devient la première puissance européenne liée par traité à défendre le territoire grec, ancrant un changement permanent de l'ordre de sécurité méditerranéen."
 GRE_eastmed_gas_forum: "Membre du Forum sur le gaz EastMed"
 GRE_eastmed_gas_forum_desc: "La Grèce officialise son rôle au sein du Forum gazier EastMed aux côtés de Chypre, Israël, l'Égypte, l'Italie, la Jordanie et la Palestine. Le cadre institutionnel ancre la coopération énergétique régionale, assure un accès commercial préférentiel à la marine marchande grecque, et donne à Athènes un siège permanent à la table diplomatique de la Méditerranée orientale."
 GRE_3plus1_dialogue: "Dialogue stratégique 3+1"
 GRE_3plus1_dialogue_desc: "La Grèce, Chypre et Israël officialisent le dialogue 3+1 avec les États-Unis, un format adossé au Département d'État couvrant sécurité énergétique, coopération maritime et contre-terrorisme. L'arrangement donne à Washington un canal structuré vers le trilatéral East-Med et couronne l'architecture régionale par l'engagement américain."
 GRE_eu_strategic_compass: "Boussole stratégique de l'UE"
 GRE_eu_strategic_compass_desc: "La Grèce devient une avocate vocale de la Boussole stratégique de l'UE, poussant l'autonomie stratégique européenne, une intégration PESCO plus profonde et un pilier européen au sein de l'OTAN. Athènes s'aligne sur Paris et Berlin en matière de défense continentale, échangeant une adhésion discrète contre un rôle actif de façonnage."
 GRE_pillar_of_the_west: "Pilier de l'Occident"
 GRE_pillar_of_the_west_desc: "Le travail des années porte ses fruits. La Grèce n'est plus la périphérie de la diplomatie occidentale, mais l'une de ses pierres angulaires. La profondeur de l'héritage, mesurée par l'engagement occidental accumulé pendant la campagne, détermine à quel point Athènes est ancrée dans cette structure."
 GRE_regional_diplomacy: "Diplomatie régionale"
 GRE_regional_diplomacy_desc: "La Grèce est un pilier des Balkans et doit entretenir de fortes relations avec tous ses voisins. La stabilité de la région est indissociable de la sécurité et de la prospérité de la Grèce."
 GRE_prespa_implementation: "Mise en œuvre de l'accord de Prespa"
 GRE_prespa_implementation_desc: "L'accord de Prespa a résolu un litige de plusieurs décennies sur le nom de la Macédoine du Nord. La Grèce met désormais pleinement en œuvre ses obligations, normalisant les relations et ouvrant la porte à un commerce élargi."
 GRE_albania_minority: "Droits de la minorité albanaise"
 GRE_albania_minority_desc: "Une importante minorité grecque vit dans le sud de l'Albanie. La Grèce poursuit un dialogue constructif sur les droits des minorités, utilisant la question comme base d'un engagement bilatéral plus profond plutôt que d'une confrontation."
 GRE_egypt_maritime: "Partenariat maritime égyptien"
 GRE_egypt_maritime_desc: "La Grèce et l'Égypte signent un accord de délimitation maritime en Méditerranée orientale, créant un cadre juridique pour le développement énergétique conjoint et excluant les revendications turques de la zone."
 GRE_italy_mediterranean_axis: "Axe Italie-Méditerranée"
 GRE_italy_mediterranean_axis_desc: "L'Italie est le premier partenaire commercial de la Grèce dans l'UE, avec plus de douze milliards d'euros d'échanges annuels. Un partenariat formel élargit la coopération en énergie, transport et défense à travers la Méditerranée centrale."
 GRE_balkan_energy_corridor: "Corridor énergétique balkanique"
 GRE_balkan_energy_corridor_desc: "L'interconnexion gazière Grèce-Bulgarie et le terminal flottant d'Alexandroupolis transforment la Grèce en un hub de transit énergétique critique. Un nouveau gazoduc vers la Macédoine du Nord étend ce réseau plus profondément dans les Balkans."
 GRE_mediterranean_energy_hub: "Hub énergétique méditerranéen"
 GRE_mediterranean_energy_hub_desc: "Avec le FSRU d'Alexandroupolis et le terminal de Revithoussa à pleine capacité, la Grèce se positionne comme la principale porte GNL de l'Europe, remplaçant la dépendance aux gazoducs russes par un approvisionnement maritime depuis la Méditerranée orientale et au-delà."
 GRE_gulf_strategic_partners: "Partenaires stratégiques du Golfe"
 GRE_gulf_strategic_partners_desc: "La Grèce établit un Conseil suprême de coopération stratégique avec l'Arabie saoudite et approfondit les liens de défense et d'investissement avec les Émirats. Capitaux du Golfe et coopération militaire affluent en Méditerranée orientale."
 GRE_balkans_eu_advocacy: "Balkans Plaidoyer auprès de l’UE"
 GRE_balkans_eu_advocacy_desc: "S'appuyant sur l'engagement du sommet de Thessalonique de 2003, la Grèce défend l'adhésion des Balkans occidentaux à l'UE. En tant que membre le plus établi de la région, la Grèce gagne un levier de soft power sur la Serbie, l'Albanie et la Macédoine du Nord."
 GRE_imec_gateway: "Passerelle IMEC"
 GRE_imec_gateway_desc: "Le corridor économique Inde-Moyen-Orient-Europe désigne Le Pirée comme son terminus européen. D'énormes investissements portuaires et logistiques transforment la Grèce centrale en un nœud commercial transcontinental reliant l'Asie à l'Europe."
 GRE_se_european_pillar: "Pilier de l’Europe du Sud-Est"
 GRE_se_european_pillar_desc: "La Grèce ciment son rôle de hub indispensable de l'Europe du Sud-Est : porte énergétique, patron des Balkans, ancre commerciale méditerranéenne, et terminus de corridor reliant trois continents."
 GRE_eastern_alignment: "Pivoter vers l’Est"
 GRE_eastern_alignment_desc: "Après une décennie d'austérité de la Troïka et de tutelle atlantiste, Athènes regarde vers l'est. La Grèce cultivera des relations parallèles avec la Russie, la Chine, l'Iran et les Balkans orthodoxes, et avec le temps se refaçonnera en ancre méditerranéenne du monde multipolaire."
 GRE_strategic_autonomy: "Autonomie stratégique"
 GRE_strategic_autonomy_desc: "La Grèce n'a pas à choisir un seul maître. Un membre de l'OTAN qui achète encore du gaz russe, courtise les capitaux du Golfe et de la Chine, et médie entre rivaux peut extraire des concessions de chaque côté. Athènes trace une voie multi-vectorielle, redevable à aucun bloc et utile à tous."
 GRE_strategic_autonomy_event_TT: "§YUn débat s'ouvre sur la manière d'user de la position non-alignée de la Grèce.§!"
 GRE_russia_outreach: "Ouvrir des canaux avec Moscou"
 GRE_russia_outreach_desc: "La Grèce s'approche discrètement du Kremlin avec une offre : contrats gaziers de long terme, accès portuaire élargi pour le shipping russe, et signaux politiques plus chauds. La réponse de Moscou donnera le ton d'un nouveau partenariat méditerranéen."
 GRE_china_outreach: "Engager Pékin"
 GRE_china_outreach_desc: "Des envoyés grecs se rendent à Pékin pour un engagement plus profond : financement industriel, télécoms, infrastructure. L'acquisition du Pirée par la Chine a déjà prouvé le modèle. Athènes propose désormais de l'étendre à toute l'économie grecque."
 GRE_iran_outreach: "Ouverture vers Téhéran"
 GRE_iran_outreach_desc: "La Grèce, longtemps sensible aux griefs iraniens sur les sanctions, propose discrètement un cadre de troc et d'énergie hors SWIFT. Le geste est provocateur à Bruxelles et Washington, mais lucratif si Téhéran accepte."
 GRE_orthodox_outreach: "Fraternité orthodoxe"
 GRE_orthodox_outreach_desc: "Athènes convoque un sommet avec Belgrade, Nicosie et Erevan, forgeant un alignement culturel et politique de l'Europe orthodoxe. La diplomatie du Patriarcat devient un art de gouverner, bâtissant un bloc régional qui ne répond ni à Bruxelles ni à Washington."
 GRE_russia_milcoop: "Pourparlers de défense helléno-russes"
 GRE_russia_milcoop_desc: "Suite au partenariat énergétique, Athènes propose une coopération de défense formelle avec Moscou : exercices conjoints, modernisation des S-300 PMU2, et partage du renseignement. Le signal politique à l'OTAN est sans équivoque."
 GRE_china_bri_anchor: "Ancre des Nouvelles routes de la soie"
 GRE_china_bri_anchor_desc: "La Grèce s'offre comme ancre européenne des Nouvelles routes de la soie, étendant l'empreinte de COSCO, ouvrant de nouvelles zones franches en Attique, et intégrant la logistique grecque aux chaînes d'approvisionnement chinoises."
 GRE_iran_med_corridor: "Corridor de la Méditerranée orientale"
 GRE_iran_med_corridor_desc: "Athènes propose un corridor énergétique Iran-Grèce, acheminant brut et GNL via des intermédiaires de pays tiers pour contourner les sanctions occidentales. Si Téhéran accepte, la Grèce devient la fenêtre de l'Iran sur l'Europe."
 GRE_orthodox_security: "Pacte de sécurité orthodoxe"
 GRE_orthodox_security_desc: "Le Conseil orthodoxe officialise un pacte de défense : entraînement partagé, coopération de renseignement et consultation politique permanente. La Serbie, Chypre et l'Arménie rejoignent la Grèce dans un bloc discret mais sans équivoque."
 GRE_brics_membership: "Rejoignez les BRICS+"
 GRE_brics_membership_desc: "La Grèce adhère formellement au cadre BRICS+ comme premier membre européen. La rupture avec l'OTAN est désormais complète ; en échange, Athènes gagne un accès préférentiel à la Nouvelle banque de développement, au système de règlement yuan-rouble, et un siège à la table multipolaire."
 GRE_multipolar_anchor: "Ancre du monde multipolaire"
 GRE_multipolar_anchor_desc: "La Grèce se déclare ancre du nouvel ordre multipolaire. L'alliance atlantique est renoncée, l'Union européenne est quittée, et une république méditerranéenne de trois continents (eurasien, levantin, africain) naît depuis Athènes."
 GRE_eastern_outreach: "Sensibilisation à l'Est"
 GRE_eastern_outreach_desc: "Athènes a commencé à cultiver des partenaires hors de l'alliance atlantique. La bande passante diplomatique s'oriente vers l'est, et l'autonomie de politique commerciale s'élargit, mais les capitales occidentales surveillent de près."
 GRE_eurasian_partner: "Partenaire eurasien"
 GRE_eurasian_partner_desc: "La Grèce est désormais un partenaire eurasien reconnu. Les capitaux de Moscou, Pékin et Téhéran souscrivent l'industrie grecque, tandis que l'opinion occidentale se durcit. Le chemin du retour se rétrécit."
 GRE_brics_anchor: "Ancre des BRICS"
 GRE_brics_anchor_desc: "La Grèce siège à la table BRICS+. L'alliance atlantique n'est plus qu'un souvenir ; la Méditerranée est une mer multipolaire. Athènes parle avec l'autorité d'une charnière continentale."
 GRE_orthodox_defense_pact: "Pacte de défense orthodoxe"
 GRE_orthodox_defense_pact_desc: "Un pacte de défense permanent de l'Europe orthodoxe : exercices conjoints, doctrine partagée et renseignement mis en commun avec Belgrade, Nicosie et Erevan."
 GRE_iran_barter_framework: "Troc de style INSTEX"
 GRE_iran_barter_framework_desc: "Le commerce gréco-iranien transite par une chambre de compensation en troc hors SWIFT, contournant les sanctions et ouvrant les marchés iraniens aux exportateurs grecs."
 GRE_iran_med_corridor_idea: "Corridor énergétique de Méditerranée orientale"
 GRE_iran_med_corridor_idea_desc: "Le brut et le GNL iraniens arrivent en Europe via un corridor ancré en Grèce. La capacité de raffinage s'étend, les réserves de carburant montent, et Athènes devient un goulet énergétique régional."
 GRE_diplomacy_category: "Diplomatie grecque"
 GRE_host_putin_summit: "Organiser un sommet russe"
 GRE_host_putin_summit_desc: "Inviter le président russe à Athènes pour un sommet bilatéral de haut niveau. Des portefeuilles commerciaux sont signés, des photos mises en scène, et les ambassades occidentales froncent les sourcils."
 GRE_cosco_pier_expansion: "Agrandissement de la jetée COSCO"
 GRE_cosco_pier_expansion_desc: "Cofinancer une nouvelle phase de l'expansion COSCO du Pirée. Une usine civile s'engage sur le projet pendant trois mois ; en retour, l'Attique gagne un créneau d'infrastructure permanent."
 GRE_instex_iran_barter: "Exploiter le canal de troc iranien"
 GRE_instex_iran_barter_desc: "Traiter une tranche de commerce gréco-iranien via la chambre de compensation en troc, rafraîchissant le cadre et récompensant les marchands qui le font vivre."
 GRE_orthodox_patriarchate_summit: "Convoquer le Conseil orthodoxe"
 GRE_orthodox_patriarchate_summit_desc: "Accueillir le sommet du Patriarcat à Athènes, réunissant les dirigeants serbes, chypriotes et arméniens pour une consultation ecclésiastique et politique."
 GRE_retry_russia_outreach: "Rapprocher Moscou"
 GRE_retry_russia_outreach_desc: "Après le précédent rejet, les diplomates grecs préparent une proposition révisée et rouvrent les canaux avec le Kremlin."
 GRE_retry_russia_milcoop: "Proposer à nouveau des pourparlers de défense"
 GRE_retry_russia_milcoop_desc: "Renouveler la proposition de coopération de défense helléno-russe avec des termes plus généreux et un signalement plus discret."
 GRE_retry_china_outreach: "Réapprocher Pékin"
 GRE_retry_china_outreach_desc: "Envoyer un nouvel envoyé à Pékin porteur de termes révisés et d'une nouvelle série de garanties d'investissement."
 GRE_retry_china_bri_anchor: "Reproposer le rôle d'ancre des Nouvelles routes de la soie"
 GRE_retry_china_bri_anchor_desc: "Réviser l'offre d'ancre des Nouvelles routes de la soie avec des concessions plus larges sur la logistique, la propriété et l'alignement politique."
 GRE_retry_iran_outreach: "Réengager Téhéran"
 GRE_retry_iran_outreach_desc: "Après le refus initial de Téhéran, Athènes rouvre des pourparlers discrets par l'intermédiaire de pays tiers."
 GRE_retry_iran_med_corridor: "Reproposer le corridor méditerranéen"
 GRE_retry_iran_med_corridor_desc: "Réviser la proposition de corridor de Méditerranée orientale avec de nouvelles options de routage qui réduisent encore l'exposition iranienne à l'application des sanctions occidentales."
 GRE_retry_orthodox_outreach: "Reconvoquer le sommet orthodoxe"
 GRE_retry_orthodox_outreach_desc: "Rétablir les relations après l'échec du sommet initial et rappeler les ministres des Affaires étrangères orthodoxes à Athènes."
 GRE_retry_orthodox_security: "Reproposer le pacte de sécurité"
 GRE_retry_orthodox_security_desc: "Renouveler le pacte de sécurité orthodoxe avec des engagements révisés sur le partage du renseignement et les rotations d'exercices."
 greece.530.t: "Proposition énergétique grecque"
 greece.530.d: "Athènes propose un partenariat énergétique et commercial complet : contrats gaziers de long terme, concessions portuaires pour le shipping russe, et un réalignement discret de la politique étrangère grecque vers Moscou. Le ministre hellénique des Affaires étrangères attend une réponse."
 greece.530.a: "Une ouverture bienvenue. Signe."
 greece.530.b: "Athènes ne peut tenir ses promesses. Refuser."
 greece.531.t: "Moscou accepte le partenariat"
 greece.531.d: "Le Kremlin accepte la proposition grecque. Des portefeuilles commerciaux sont échangés, un accord bilatéral amélioré est signé, et le gaz russe commence à affluer à des conditions favorables. Athènes a son premier partenaire oriental."
 greece.531.a: "Bienvenue dans la nouvelle politique étrangère hellénique."
 greece.532.t: "Moscou décline"
 greece.532.d: "Le Kremlin décline poliment l'ouverture grecque. Sans garanties fermes qu'Athènes quitte l'alliance atlantique, Moscou n'a aucun intérêt à prendre des risques politiques. Le revers est réel, mais la porte n'est pas fermée."
 greece.532.a: "Se regrouper et réessayer."
 greece.533.t: "Proposition de coopération de défense grecque"
 greece.533.d: "Athènes propose un cadre de défense helléno-russe formel : exercices conjoints, soutien à la modernisation des S-300 PMU2, et partage du renseignement. Moscou pèse le prix politique contre le contrecoup diplomatique de l'OTAN."
 greece.533.a: "Un alignement historique. Accepter."
 greece.533.b: "La Grèce est toujours membre de l'OTAN. Refuser."
 greece.534.t: "Moscou accepte les pourparlers de défense"
 greece.534.d: "Le ministère russe de la Défense accepte une coopération formelle. Des officiers grecs se rendent à Moscou pour l'entraînement ; des ingénieurs russes arrivent à la base navale de Salamine. Le bonus de doctrine terrestre est important, tout comme le coût politique."
 greece.534.a: "La coopération d'armement helléno-russe commence."
 greece.535.t: "Moscou refuse les pourparlers de défense"
 greece.535.d: "Moscou refuse, citant les obligations OTAN persistantes de la Grèce. Tant qu'Athènes n'aura pas quitté l'alliance atlantique, ou du moins signalé une intention crédible de le faire, il n'y aura pas de coopération de défense formelle."
 greece.535.a: "Noter l'exigence d'un plus grand engagement."
 greece.536.t: "L'approche grecque envers Pékin"
 greece.536.d: "Athènes s'approche de Pékin avec une proposition d'engagement économique approfondi : télécoms, financement d'infrastructure et intégration plus large aux Nouvelles routes de la soie. Le ministère chinois des Affaires étrangères prend la proposition en examen."
 greece.536.a: "Un ajustement naturel. Approuver."
 greece.536.b: "Les coûts politiques l'emportent sur les bénéfices. Refuser."
 greece.537.t: "Pékin accepte"
 greece.537.d: "La direction chinoise entérine le partenariat. Les capitaux d'État commencent à affluer dans des projets industriels et télécoms grecs, et l'influence grecque dans les calculs de Pékin monte de façon mesurable."
 greece.537.a: "Le partenariat sino-hellénique s'approfondit."
 greece.538.t: "Pékin décline"
 greece.538.d: "Pékin temporise : Athènes, dit-on, ne peut offrir ce qui est déjà assuré par des canaux plus discrets. Les diplomates grecs rentrent les mains vides mais non découragés."
 greece.538.a: "Réévaluer et réessayer."
 greece.539.t: "Proposition d'ancrage grecque de la BRI"
 greece.539.d: "Athènes s'offre comme ancre européenne des Nouvelles routes de la soie : concessions COSCO étendues, zones franches en Attique, et alignement politique sur les questions indo-pacifiques. Le prix est élevé, mais le lot aussi."
 greece.539.a: "Une ancre d'ambition historique. Accepter."
 greece.539.b: "Les termes ne sont pas encore acceptables. Refuser."
 greece.540.t: "Pékin entérine l'ancre des Nouvelles routes de la soie"
 greece.540.d: "La Chine désigne formellement la Grèce comme ancre des Nouvelles routes de la soie. Les chantiers se mobilisent ; les capitaux inondent l'Attique ; une usine civile supplémentaire s'élève dans la région capitale, l'investissement chinois souscrivant l'industrie grecque."
 greece.540.a: "La Grèce est le terminus européen des Nouvelles routes de la soie."
 greece.541.t: "Pékin refuse le rôle d'ancre"
 greece.541.d: "Pékin refuse la désignation formelle d'ancre, jugeant la volatilité politique grecque trop élevée pour s'engager à cette échelle. Athènes doit démontrer un alignement plus ferme avant que l'offre ne soit renouvelée."
 greece.541.a: "Les termes devront être revus."
 greece.542.t: "Ouverture grecque vers Téhéran"
 greece.542.d: "Un envoyé grec à Téhéran propose un cadre de troc et de commerce hors SWIFT, conçu pour contourner les sanctions occidentales et ouvrir les marchés iraniens aux exportateurs grecs. Le Conseil suprême de sécurité nationale débat de l'offre."
 greece.542.a: "Un partenaire européen bienvenu. Accepter."
 greece.542.b: "Athènes parle pour l'Occident. Refuser."
 greece.543.t: "Téhéran accepte le cadre"
 greece.543.d: "Téhéran accepte. La chambre de compensation en troc est établie à Athènes, et les exportateurs grecs gagnent un accès préférentiel aux marchés iraniens. Les capitales occidentales ne sont pas amusées."
 greece.543.a: "La première entrée européenne dans le système iranien."
 greece.544.t: "Téhéran décline"
 greece.544.d: "Téhéran refuse. La Grèce, observe le ministre iranien des Affaires étrangères, est encore un État de l'OTAN, et tout cadre serait vulnérable aux sanctions secondaires américaines dès son activation."
 greece.544.a: "Démontrer d'abord notre indépendance"
 greece.545.t: "Proposition de corridor méditerranéen grec"
 greece.545.d: "Athènes propose le corridor de Méditerranée orientale : brut et GNL iraniens acheminés via des intermédiaires de pays tiers vers des terminaux grecs, puis vers l'Europe. Le côté iranien pèse le gain contre les représailles américaines."
 greece.545.a: "Le corridor est un prix stratégique. Accepter."
 greece.545.b: "L'exposition est trop grande. Refuser."
 greece.546.t: "Téhéran entérine le corridor"
 greece.546.d: "Téhéran entérine le corridor. Le brut iranien commence à arriver dans les ports grecs ; la capacité de raffinage s'étend en Attique et Béotie. La Grèce devient un goulet énergétique méditerranéen, et Téhéran un bénéficiaire discret."
 greece.546.a: "Le corridor énergétique de Méditerranée orientale est ouvert."
 greece.547.t: "Téhéran refuse le corridor"
 greece.547.d: "Téhéran refuse, citant la contre-pression américaine sur les États intermédiaires. Le corridor est mis de côté ; les deux capitales y reviendront lorsque les conditions le permettront."
 greece.547.a: "Attendre un moment plus propice."
 greece.548.t: "Athènes convoque le Conseil orthodoxe"
 greece.548.d: "Athènes propose une consultation politique permanente parmi les États orthodoxes d'Europe : Serbie, Chypre, Arménie et au-delà. La diplomatie du Patriarcat est offerte comme couverture ; l'art de gouverner est la vraie intention."
 greece.548.a: "Une fraternité en retard. Accepter."
 greece.548.b: "Les risques l'emportent sur les gains. Refuser."
 greece.549.t: "Belgrade entérine le Conseil"
 greece.549.d: "Belgrade entérine la proposition, et Nicosie suit. Le Conseil orthodoxe se réunit à Athènes avec les ministres des Affaires étrangères grec, serbe et chypriote. Un bloc discret mais sans équivoque s'est formé."
 greece.549.a: "Un bloc orthodoxe est né."
 greece.550.t: "Belgrade décline"
 greece.550.d: "Belgrade refuse, citant la crainte de provoquer Bruxelles et de compliquer l'adhésion serbe à l'UE. Le projet orthodoxe est retardé, pas mort."
 greece.550.a: "Patience. Le moment viendra."
 greece.551.t: "Proposition de pacte de sécurité grec"
 greece.551.d: "Athènes propose de formaliser le bloc orthodoxe en un pacte de défense : entraînement partagé, renseignement mis en commun et consultation politique permanente. Belgrade pèse le lot contre la réaction inévitable de Bruxelles."
 greece.551.a: "Le pacte nous fortifie tous. Accepter."
 greece.551.b: "Belgrade ne peut le risquer. Refuser."
 greece.552.t: "Pacte de défense orthodoxe signé"
 greece.552.d: "Belgrade, Nicosie et Erevan rejoignent Athènes pour formaliser le pacte de défense orthodoxe. Les exercices conjoints commencent ; les canaux de renseignement s'ouvrent ; un pôle européen discret est apparu sur la carte."
 greece.552.a: "Une architecture de sécurité orthodoxe est établie."
 greece.553.t: "Belgrade refuse le pacte"
 greece.553.d: "Belgrade refuse le pacte formel, jugeant le coût diplomatique trop élevé tant que les négociations d'adhésion à l'UE sont actives. Le bloc orthodoxe demeure, mais informel."
 greece.553.a: "Poursuivre par d'autres moyens."
 greece.554.t: "Bienvenue dans les BRICS+"
 greece.554.d: "Les dirigeants BRICS+ accueillent formellement la Grèce comme premier membre européen de l'alliance. Des envoyés russes, chinois, indiens et iraniens arrivent à Athènes pour la cérémonie d'adhésion. Le chapitre atlantique est clos."
 greece.554.a: "Athènes siège à la table multipolaire."
 greece.555.t: "La Grèce ancre le monde multipolaire"
 greece.555.d: "La Grèce a formellement renoncé à l'alliance atlantique et à l'Union européenne, se déclarant ancre du nouvel ordre multipolaire. La république méditerranéenne de trois continents a été proclamée depuis Athènes. Le monde se réarrange en conséquence."
 greece.555.a: "L'avenir hellénique a commencé."
 greece.555.b: "L'Occident a perdu son flanc méditerranéen."
 greece.555.c: "Un nouveau pôle a émergé. À noter soigneusement."
 CYP_seek_greek_union: "Chercher l'union avec la Grèce"
 CYP_seek_greek_union_desc: "La République de Chypre poursuit des initiatives diplomatiques formelles pour renforcer les liens avec la Grèce, vers une union politique éventuelle."
 CYP_appeal_to_un: "En appeler aux Nations unies"
 CYP_appeal_to_un_desc: "Chypre porte la question de la réunification devant les Nations unies, cherchant une légitimité internationale pour un règlement qui serve la communauté chypriote grecque."
 CYP_economic_incentive_north: "Incitations économiques pour le Nord"
 CYP_economic_incentive_north_desc: "Chypre étend des offres économiques aux communautés chypriotes turques du nord, démontrant que la réunification apporte des bénéfices tangibles à tous les habitants de l'île."
 NCY_seek_turkish_union: "Chercher l'union avec la Turquie"
 NCY_seek_turkish_union_desc: "Chypre du Nord approfondit les liens politiques et économiques avec la Turquie, avançant la perspective d'une unification formelle sous direction turque."
 NCY_recognition_campaign: "Campagne de reconnaissance internationale"
 NCY_recognition_campaign_desc: "Chypre du Nord lance une campagne diplomatique pour une reconnaissance internationale plus large, légitimant son gouvernement aux yeux de la communauté des nations."
 GRE_aegean_defense_posture: "Posture de défense égéenne"
 GRE_aegean_defense_posture_desc: "Une préparation accrue et des forces déployées en avant tiennent l'armée hellénique en alerte élevée. Chaque interception, chaque patrouille, chaque exercice signale que le territoire grec sera défendu."
 GRE_cypriot_integration_idea: "Intégration économique chypriote"
 GRE_cypriot_integration_idea_desc: "Une intégration économique profonde avec la République de Chypre, y compris union douanière et harmonisation bancaire, renforce les liens commerciaux et génère des recettes d'impôt sur les sociétés durables pour les deux économies."
 GRE_north_macedonian_ties: "Liens avec la Macédoine du Nord"
 GRE_north_macedonian_ties_desc: "Des relations normalisées avec Skopje après l'accord de Prespa ont ouvert de nouveaux canaux diplomatiques dans les Balkans, générant une bienveillance qui se traduit en levier politique."
 GRE_chinese_investment: "Investissements chinois dans les infrastructures"
 GRE_chinese_investment_desc: "Les capitaux d'État chinois financent des projets d'infrastructure et de construction industrielle à travers la Grèce, accélérant des programmes que le budget intérieur ne peut couvrir seul."
 GRE_lng_gateway: "Passerelle GNL"
 GRE_lng_gateway_desc: "La Grèce s'est positionnée comme le principal point de débarquement de GNL de l'Europe, fournissant une énergie indépendante des gazoducs aux partenaires régionaux."
 GRE_balkan_advocate: "Défenseur de l'UE dans les Balkans"
 GRE_balkan_advocate_desc: "En tant que principale championne de l'UE pour l'adhésion des Balkans occidentaux, la Grèce exerce une influence de soft power croissante sur ses voisins du nord."
 GRE_imec_terminus: "Terminus européen IMEC"
 GRE_imec_terminus_desc: "La désignation du Pirée comme terminus européen du corridor économique Inde-Moyen-Orient-Europe apporte d'importantes recettes de transit et des investissements d'infrastructure."
 GRE_regional_pillar: "Pilier de l'Europe du Sud-Est"
 GRE_regional_pillar_desc: "La Grèce a obtenu le rôle de hub indispensable du voisinage de l'Europe du Sud-Est, projetant son influence via l'énergie, le commerce et les canaux diplomatiques."
 GRE_epirus_cultural_ties: "Liens culturels de l'Épire"
 GRE_epirus_cultural_ties_desc: "Un cadre formel de droits des minorités avec Tirana a stabilisé les communautés hellénophones du sud de l'Albanie, transformant un irritant de longue date en un atout diplomatique discret."
 GRE_italo_hellenic_axis: "Axe italo-hellénique"
 GRE_italo_hellenic_axis_desc: "Une politique industrielle coordonnée et des programmes de chantiers partagés avec Rome ont tiré Athènes et la péninsule italienne dans un même espace économique méditerranéen."
 GRE_balkan_gas_transit: "Transit du gaz des Balkans"
 GRE_balkan_gas_transit_desc: "L'expansion du gazoduc IGB achemine le gaz caspien et de Méditerranée orientale via le territoire grec vers les Balkans élargis, générant des recettes de transit durables."
 GRE_gulf_capital_inflow: "Entrée de capitaux dans le Golfe"
 GRE_gulf_capital_inflow_desc: "Les fonds souverains de la péninsule arabique se sont engagés dans l'industrie et la logistique grecques, accélérant la formation de capital."
 GRE_eez_delimitation: "Accord de délimitation de la ZEE"
 GRE_eez_delimitation_desc: "Un accord bilatéral de zone économique exclusive avec Le Caire donne aux coques grecques des couloirs clairs à travers la Méditerranée orientale."
 greece.500.t: "Mort de Stephen Saunders"
 greece.500.d: "L'attaché de défense britannique Stephen Saunders a été assassiné à Athènes par l'organisation terroriste 17-Novembre. L'attaque éhontée a suscité une condamnation internationale et mis une pression énorme sur les services de sécurité grecs pour démanteler le groupe."
 greece.500.a: "Réprimer le terrorisme intérieur"
 greece.500.b: "Coopérer avec le renseignement international"
 greece.501.t: "Procès de l'organisation révolutionnaire"
 greece.501.d: "Les membres capturés du 17-Novembre sont jugés à Athènes. Après des décennies à échapper à la justice, la direction du groupe est poursuivie pour une série d'assassinats et d'attentats. Le procès est un moment charnière du contre-terrorisme grec."
 greece.501.a: "Prononce des peines sévères"
 greece.501.b: "Saisir l'occasion de réformer les services de sécurité"
 greece.502.t: "Manifestations contre la guerre au terrorisme"
 greece.502.d: "D'énormes manifestations anti-guerre ont éclaté à travers la Grèce en réponse à l'invasion de l'Irak. Des dizaines de milliers de personnes sont descendues dans les rues d'Athènes et de Thessalonique, reflétant une opposition publique profonde à la campagne menée par les États-Unis."
 greece.502.a: "Autoriser les manifestations pacifiques"
 greece.502.b: "Restreindre les manifestations pour maintenir l'ordre"
 greece.503.t: "Accident du vol 522 d'Helios Airways"
 greece.503.d: "Le vol Helios Airways 522 s'est écrasé près de Grammatiko après avoir volé en pilote automatique comme un vol fantôme, tuant les 121 passagers et membres d'équipage. La tragédie, causée par un défaut de pressurisation, a soulevé de graves questions sur la surveillance de la sécurité aérienne en Grèce."
 greece.503.a: "Lancer des réformes en matière de sécurité aérienne"
 greece.503.b: "Observer une journée nationale de deuil"
 greece.504.t: "Manifestations kurdes à Athènes"
 greece.504.d: "Des membres de la diaspora kurde à Athènes ont organisé de grandes manifestations en faveur des droits kurdes. Les protestations ont attiré l'attention d'Ankara, qui voit d'un œil soupçonneux tout soutien à l'activisme kurde à l'étranger."
 greece.504.a: "Laisser les manifestations se poursuivre"
 greece.504.b: "Disperser la foule"
 greece.505.t: "Manifestations contre la crise à Gaza"
 greece.505.d: "Des manifestations pro-palestiniennes ont éclaté dans les villes grecques en réponse à la crise croissante à Gaza. Les manifestants demandent au gouvernement une position plus ferme contre les opérations militaires et une aide humanitaire."
 greece.505.a: "Exprimer notre solidarité avec les manifestants"
 greece.505.b: "Appeler à la retenue et aux solutions diplomatiques"
 greece.506.t: "Incendies de forêt en Grèce en 2007"
 greece.506.d: "Des incendies dévastateurs ont balayé le Péloponnèse et l'Eubée, tuant des dizaines de personnes et détruisant des villages entiers. Les feux ont exposé des faiblesses critiques des capacités de réponse aux catastrophes de la Grèce et suscité la colère publique face à la gestion de la crise par le gouvernement."
 greece.506.a: "Mobiliser les ressources d’urgence"
 greece.506.b: "Demander une assistance internationale"
 greece.507.t: "Décès d'Alexandros Grigoropoulos"
 greece.507.d: "Alexandros Grigoropoulos, quinze ans, a été abattu par un policier dans le quartier d'Exarchia à Athènes. La fusillade a déclenché les pires émeutes que la Grèce ait vues depuis des décennies, avec des destructions généralisées dans les grandes villes."
 greece.507.a: "Poursuivre les officiers responsables"
 greece.507.b: "Déployer les forces antiémeutes pour rétablir l'ordre"
 greece.508.t: "Incendies de forêt en Grèce en 2009"
 greece.508.d: "Une autre saison d'incendies dévastateurs a frappé la Grèce, ravageant les forêts et menaçant des localités en Attique et dans l'est du Péloponnèse. Malgré les leçons de 2007, l'infrastructure de lutte contre l'incendie du pays reste trop tendue."
 greece.508.a: "Investir dans les infrastructures de prévention des incendies"
 greece.508.b: "Concentrer les secours sur les communautés touchées"
 greece.509.t: "Aube dorée entre au Parlement"
 greece.509.d: "Le parti d'extrême droite Aube dorée a obtenu des sièges parlementaires pour la première fois, capitalisant sur la fureur publique face à l'austérité et à la crise économique. Leur rhétorique ouvertement nationaliste et violente a alarmé les institutions démocratiques à travers l'Europe."
 greece.509.a: "Surveiller de près leurs activités"
 greece.509.b: "Les ignorer comme un mouvement marginal"
 greece.510.t: "Formulaires du Parti grec de la solution"
 greece.510.d: "Le présentateur Kyriakos Velopoulos a fondé le parti Solution grecque, le positionnant comme une alternative conservatrice-nationaliste. Le parti séduit les électeurs désillusionnés à la fois par la droite traditionnelle et la frange d'extrême droite."
 greece.510.a: "Reconnaître le nouveau paysage politique"
 greece.510.b: "Considérez-les comme des populistes"
 greece.511.t: "Mort de Pavlos Fyssas"
 greece.511.d: "Le rappeur antifasciste Pavlos Fyssas a été poignardé à mort par un membre d'Aube dorée à Keratsini. Le meurtre a provoqué une indignation nationale et intensifié les appels au gouvernement à agir de façon décisive contre le réseau violent du parti."
 greece.511.a: "Réprimer Aube dorée"
 greece.511.b: "Appeler au calme et au respect de la procédure"
 greece.512.t: "Procès des membres d'Aube dorée"
 greece.512.d: "La direction d'Aube dorée est jugée dans ce qui est devenu la plus grande affaire pénale contre un parti politique de l'histoire européenne. Les chefs d'accusation incluent la direction d'une organisation criminelle, le meurtre et de multiples agressions visant immigrés et opposants politiques."
 greece.512.a: "Réclamer les peines maximales"
 greece.512.b: "Laisser la justice suivre son cours"
 greece.513.t: "Séisme majeur en mer Égée"
 greece.513.d: "Un puissant séisme a frappé l'est de l'Égée près de Lesbos, causant d'importants dégâts et des victimes. La Turquie a aussi été touchée, ouvrant une rare fenêtre de coopération bilatérale pour les secours entre les deux voisins."
 greece.513.a: "Lancer un effort national de secours"
 greece.513.b: "Coopérer avec la Turquie pour les secours"
 greece.514.t: "Feux de forêt en Attique en 2018"
 greece.514.d: "Des incendies catastrophiques ont balayé l'est de l'Attique, tuant plus d'une centaine de personnes dans la station balnéaire de Mati. C'est la catastrophe d'incendie la plus meurtrière de l'histoire grecque, exposant des défaillances systémiques de la planification d'urgence et de la protection civile."
 greece.514.a: "Rénover les systèmes de protection civile"
 greece.514.b: "Fournir une aide immédiate aux victimes"
 greece.515.t: "Un autre tremblement de terre à Athènes"
 greece.515.d: "Un séisme a frappé près d'Athènes, endommageant des bâtiments et provoquant une alarme généralisée dans la capitale. Si les victimes sont limitées, l'événement a relancé le débat sur la résilience sismique des infrastructures vieillissantes de la Grèce."
 greece.515.a: "Renforcer les codes du bâtiment"
 greece.515.b: "Fournir des secours d’urgence"
 greece.517.t: "Séisme majeur en mer Égée"
 greece.517.d: "Un puissant séisme a frappé l'est de l'Égée près de Lesbos, causant d'importants dégâts et des victimes. La Turquie a aussi été touchée, ouvrant une rare fenêtre de coopération bilatérale pour les secours entre les deux voisins."
 greece.517.a: "Mobiliser les efforts de secours"
 greece.518.t: "Feux de forêt en Attique en 2018"
 greece.518.d: "Des incendies catastrophiques ont balayé l'est de l'Attique, tuant plus d'une centaine de personnes dans la station balnéaire de Mati. C'est la catastrophe d'incendie la plus meurtrière de l'histoire grecque, exposant des défaillances systémiques de la planification d'urgence et de la protection civile."
 greece.518.a: "Commencer l'intervention d'urgence"
 greece.519.t: "Un autre tremblement de terre à Athènes"
 greece.519.d: "Un séisme a frappé près d'Athènes, endommageant des bâtiments et provoquant une alarme généralisée dans la capitale. Si les victimes sont limitées, l'événement a relancé le débat sur la résilience sismique des infrastructures vieillissantes de la Grèce."
 greece.519.a: "Coordonner les services d'urgence"
 greece.620.t: "Une question d'union"
 greece.620.d: "Athènes a formellement invité la République de Chypre à achever la confédération et à se réunir à l'État hellénique. La décision appartient à Nicosie."
 greece.620.a: "Rejoindre l'union hellénique"
 greece.620.b: "Rester une république indépendante"
 greece.621.t: "La question du Nord"
 greece.621.d: "La proposition grecque s'étend au nord de l'île. La réunification sous Athènes dissoudrait l'administration septentrionale séparée et placerait son territoire dans l'État hellénique."
 greece.621.a: "Accepter la réunification"
 greece.621.b: "Rejeter la proposition"
 greece.630.t: "Un appel d'Athènes"
 greece.630.d: "La Grèce a demandé à la Turquie d'aider à soulager la crise du logement qui pèse sur ses villes. Une coopération allégerait le fardeau d'Athènes et marquerait un rare moment de bonne volonté entre les deux voisins."
 greece.630.a: "Étendre le support"
 greece.630.b: "Refuser d'intervenir"
 greece.631.t: "L’aide turque arrive"
 greece.631.d: "L'aide et le soutien à la construction turcs ont commencé à affluer en Grèce, allégeant le pire de la pénurie de logements et adoucissant les relations à travers l'Égée."
 greece.631.a: "Une main bienvenue"
 greece.632.t: "Pas d'aide d'Ankara"
 greece.632.d: "La Turquie a refusé de s'impliquer dans les problèmes de logement de la Grèce. Athènes doit gérer la crise seule."
 greece.632.a: "Nous tenons seuls"
 greece.641.t: "Une saison record"
 greece.641.d: "L'été a battu tous les records d'arrivées. Les hôtels sont pleins, les aéroports débordent, et les recettes affluent. La question est de savoir qui bénéficie de la manne."
 greece.641.a: "Réinvestir dans les îles"
 greece.641.b: "Laisser les opérateurs le garder"
 greece.642.t: "La diaspora répond"
 greece.642.d: "L'appel aux Grecs de l'étranger a trouvé un écho. Promesses d'investissement et envois de fonds affluent des communautés du monde entier, désireuses de voir la patrie se relever."
 greece.642.a: "Lancer un fonds souverain pour la diaspora"
 greece.642.b: "Compléter les envois par des allègements fiscaux"
 greece.643.t: "Bruxelles ouvre les vannes"
 greece.643.d: "La première tranche de financements de relance a été approuvée. Des dizaines de milliards sont en chemin, conditionnés aux réformes et à la capacité de la Grèce à réellement dépenser l'argent à temps."
 greece.643.a: "Lancer les projets en priorité"
 greece.643.b: "Dépensez-le avec soin"
 greece.650.t: "La doctrine multi-vectorielle"
 greece.650.d: "Athènes a déclaré qu'elle traitera avec l'Est et l'Ouest de la même façon, selon ses propres termes. Le cabinet débat de la meilleure façon de transformer cette indépendance en levier."
 greece.650.a: "Diversifier nos partenaires énergétiques et commerciaux"
 greece.650.b: "Positionner la Grèce comme médiateur régional"
 greece_military.01.t: "Création des Systèmes de défense helléniques"
 greece_military.01.d: "Pyrkal et l'industrie d'armement hellénique ont fusionné en une seule entreprise d'État, Hellenic Defence Systems. La consolidation vise à rationaliser les achats, standardiser la production et reconstruire la capacité industrielle de défense intérieure sous une seule structure de direction."
 greece_military.01.a: "Un champion national est né"
 greece_military.02.t: "La marine grecque défie nos eaux"
 greece_military.02.d: "La Grèce a achevé sa stratégie des eaux souveraines et revendique désormais ouvertement les eaux contestées de l'Égée et de Crète. Leur expansion navale est un défi direct à notre position en Méditerranée orientale."
 greece_military.02.a: "Étendre la flotte"
 greece_military.02.b: "Déposer une protestation diplomatique"
 greece.516.t: "Le mouvement nationaliste gagne du terrain"
 greece.516.d: "Les nationalistes ELAM soutenus par la Grèce étendent leur influence sur notre île. Leur rhétorique appelle à l'union avec la Grèce et a trouvé un public réceptif chez une partie de la population. Nous pouvons tolérer leur présence ou réprimer au prix de troubles publics."
 greece.516.a: "Laissez-les fonctionner"
 greece.516.b: "Réprimer le mouvement"
 greece_debt.1.t: "Le partenaire du swap de dette"
 greece_debt.1.desc: "Les factures continuent d'arriver et le Trésor de se réduire. Notre ministre des Finances a proposé d'échanger des portions de notre dette en euros contre des devises étrangères via la banque centrale d'une nation partenaire. Le nouveau détenteur facturerait des intérêts, mais à des taux négociables et à des conditions plus amicales que nos créanciers actuels. L'Inde, la Russie, la Chine ou la BCE pourraient servir de partenaire, mais chacune a son prix politique."
 greece_debt.1.a: "Peut-être la roupie"
 greece_debt.1.b: "Peut-être le rouble"
 greece_debt.1.c: "Le yuan pourrait être un bon choix"
 greece_debt.1.e: "Rester le cap"
 GRE_debt_swap_accept_tt: "§GS'ils acceptent :§! ils achètent une part de notre dette, devenant un créancier auquel nous versons des intérêts, allégeant notre bilan maintenant en échange de paiements réguliers plus tard."
 GRE_debt_counter_refund_tt: "Nous déclinons la contre-offre. Le capital avancé par le créancier potentiel est remboursé intégralement."
 greece_debt.2.a: "Nous devons décliner"
 greece_debt.2.b: "Nous prendrons leur dette"
 GRE_homelessness_crisis_idea: "La crise des sans-abri athénienne"
 GRE_homelessness_crisis_idea_desc: "Le séisme d'Athènes a laissé des milliers de personnes sans abri, dormant dans les parcs. Les services sociaux sont débordés et des campements s'étendent dans la capitale. Plus nous tardons à agir, plus cela empire."
 GRE_the_drachma_idea: "La drachme"
 GRE_the_drachma_idea_desc: "Opérer hors de la zone euro signifie que nous gérons la drachme seuls. L'instabilité monétaire et des coûts d'emprunt plus élevés pèsent sur l'économie, mais une drachme plus faible maintient les exportations grecques compétitives et relève les recettes sur les marchés internationaux."
 GRE_solving_tax_evasion_idea: "Boucher les failles fiscales"
 GRE_solving_tax_evasion_idea_desc: "Boucher les failles fiscales nous permettra d'éliminer les écarts, mais exigera de nombreux comités et une réévaluation de notre code fiscal national."
 GRE_tax_evasion_idea: "Évasion fiscale effrénée"
 GRE_tax_evasion_idea_desc: "L'évasion fiscale est profondément ancrée dans la vie fiscale grecque et draine les recettes de l'État. Sans l'argent pour financer les services de base et les réformes, l'État est coincé."
 GRE_bonds_issued_idea: "Obligations à court terme à taux élevé"
 GRE_bonds_issued_idea_desc: "Nous avons émis des obligations à court terme à taux élevé. L'injection de liquidités aide maintenant, mais les rendements élevés seront un fardeau jusqu'à l'échéance."
 GRE_pyrkal_merge: "§YPyrkal§! a fusionné avec l'§Yindustrie d'armement hellénique§!"
