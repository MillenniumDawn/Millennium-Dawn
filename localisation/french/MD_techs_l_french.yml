 anti_infantry_tank_ammo_1: "Munitions anti-infanterie du début de la guerre froide"
 anti_infantry_tank_ammo_1_desc: "Munitions spécialisées conçues pour engager et neutraliser efficacement les cibles d'infanterie au début de la guerre froide. Ces obus sont optimisés pour la fragmentation et l'effet de zone, maximisant leur impact contre le personnel ennemi."
 anti_vehicle_tank_ammo_1: "Munitions anti-véhicule du début de la guerre froide"
 anti_vehicle_tank_ammo_1_desc: "Munitions développées au début de la guerre froide pour contrer les véhicules ennemis. Ces obus offrent une pénétration renforcée, leur permettant d'engager et d'endommager efficacement chars et VTT."
 anti_infantry_tank_ammo_2: "Munitions anti-infanterie de la guerre froide"
 anti_infantry_tank_ammo_2_desc: "Munitions avancées développées pendant la guerre froide pour engager et neutraliser efficacement l'infanterie. Ces obus offrent une fragmentation et un effet de zone améliorés."
 anti_vehicle_tank_ammo_2: "Munitions anti-véhicule de la guerre froide"
 anti_vehicle_tank_ammo_2_desc: "Munitions spécialisées conçues pendant la guerre froide pour contrer les véhicules ennemis. Ces obus ont une pénétration renforcée contre chars et VTT."
