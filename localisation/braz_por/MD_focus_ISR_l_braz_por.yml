 ISR_intifada_desc: "Desde que os colonos sionistas chegaram à Palestina no fim do século XIX, as tensões entre os imigrantes judeus e a população palestina frequentemente resultaram em surtos de violência entre as duas comunidades. Após a criação de Israel, grupos palestinos e até indivíduos lançaram ataques contra interesses israelenses, um fenômeno que persistiu apesar da assinatura dos Acordos de Oslo. Isso se deve à ampla insatisfação palestina com a contínua construção de assentamentos israelenses na Cisjordânia e com a recusa de Israel em compartilhar o controle de Jerusalém, entre outras queixas. Esses ataques contribuíram para uma sensação de insegurança em Israel e para o apoio a forças políticas de linha dura.\n§W--------------§!\nEste espírito nacional é reavaliado toda semana com base na situação de segurança na Palestina enquanto a Palestina permanecer nossa subordinada. Ele §GMelhorará§! conforme nossos focos acalmarem a situação e §RPiorará§! conforme a agitação e a hostilidade palestina crescerem. Será §RRemovido§! se a Palestina deixar de existir ou se formarmos a Isratina."
