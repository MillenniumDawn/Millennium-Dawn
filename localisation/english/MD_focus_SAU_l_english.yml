 SAU_events.317.desc: "How should Saudi fighter pilots be taught to win? Each path is a lasting trade-off - it makes us stronger one way and weaker another.\n\n§YHover an option to see exactly what it grants and costs.§!"
 SAU_events.317.t: "Red Flag Air Combat Training"
