 CYBER_OFFENSE_TT_DELAYED: "Détermine l'efficacité des opérations offensives. Augmente les chances de succès de toutes les attaques cyber."
 CYBER_TARGET_DEFENSE_TT_DELAYED: "Plus la §Ycybersécurité§! d'une nation cible est élevée, plus il sera difficile de mener des opérations réussies sans d'abord briser, ou partiellement briser, leurs méthodes de chiffrement."
