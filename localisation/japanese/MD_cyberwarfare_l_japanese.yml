 cyber_infra_tracking_complete_tt: "インフラ攻撃が完了した。我々の工作員は敵の重要インフラに対する継続的な攻撃を終了した。"
 cyber_crit_tracking_complete_tt: "致命の一撃作戦が完了した。我々の部隊は標的の最重要システムに対して優先度の高い攻撃を実行した。"
 cyber_sigint_surveillance_tracking_complete_tt: "シギント監視作戦が終了した。我々の傍受チームは標的からの通信情報収集を終了した。"
 cyber_radar_spoofing_tracking_complete_tt: "レーダー欺瞞作戦が完了した。我々の電子戦チームは敵の航空監視ネットワークへの妨害を終了した。"
 cyber_election_interference_tracking_complete_tt: "選挙干渉作戦が完了した。我々の影響工作部隊は敵の選挙プロセスを標的とした秘密作戦を終了した。"
 cyber_industrial_espionage_tracking_complete_tt: "産業スパイ作戦が完了した。我々の工作員は敵から標的となる研究開発データを抽出した。"
 cyber_comms_intercept_tracking_complete_tt: "通信傍受作戦が完了した。我々のチームは敵の指揮統制ネットワークへの継続的な侵入を終了した。"
 cyber_financial_system_attack_tracking_complete_tt: "金融システム攻撃が完了した。我々の部隊は敵の銀行および決済インフラを標的とした作戦を終了した。"
 cyber_logistics_disruption_tracking_complete_tt: "兵站妨害作戦が完了した。我々の工作員は敵の補給網および流通システムに対する作戦を終了した。"
 cyber_sleeper_network_tracking_complete_tt: "休眠ネットワークの設置が完了した。我々のチームは将来の起動に備え、敵ネットワーク内に持続的なアクセスツールを埋め込んだ。"
 cyber_deception_campaign_tracking_complete_tt: "欺瞞作戦が完了した。我々の工作員は敵の情報分析官を誤導するための偽旗作戦を終了した。"
 cyber_zero_day_strike_tracking_complete_tt: "ゼロデイ攻撃が完了した。我々の部隊は敵の重要システムにおける未公開の脆弱性に対して高影響の攻撃を実行した。"
 cyber_network_hardening_active: "ネットワークが強化された"
 cyber_network_hardening_active_desc: "我々のサイバーセキュリティチームは認証システムを強化し、既知の脆弱性を修正し、重要なアクセス経路を分離した。これらの防御が維持されている限り、外部からの侵入は大幅に成功しにくくなる。"
 cyber_counter_intrusion_active: "対侵入掃討"
 cyber_counter_intrusion_active_desc: "Analysts are actively hunting for foreign presence in our networks: combing logs, isolating anomalous processes, and removing persistent implants. Operational security awareness is heightened across all government systems."
 cyber_attribution_hunt_active: "帰属追跡が進行中"
 cyber_attribution_hunt_active_desc: "デジタルフォレンジックチームは攻撃経路の再構築と実行主体の特徴の記録を進めている。収集された情報は防御を強化し、適切な対応策を講じるための根拠となる。"
 MD_cyber.201.t: "侵入排除完了"
 MD_cyber.201.d: "我々の対侵入チームが掃討を完了した。外部のアクセスツール、監視用マルウェア、持続的バックドアは特定され除去された。我々のネットワークはクリーンな状態である。"
 MD_cyber.201.a: "よくやった。警戒を続けろ。"
 MD_cyber.202.t: "Sweep Complete: Networks Clear"
 MD_cyber.202.d: "我々の対侵入チームがすべての重要システムの掃討を終えた。外部のアクセスツールや監視マルウェアは検出されなかった。ネットワークは安全とみられる。"
 MD_cyber.202.a: "監視を維持しろ。"
 MD_cyber.1.t: "作戦成功"
 MD_cyber.1.d: "Our cyber teams successfully executed the operation. No trace was left behind. The target has no indication of our involvement."
 MD_cyber.1.a: "素晴らしい働きだ。"
 MD_cyber.2.t: "外国からの侵入を検知"
 MD_cyber.2.d: "Our security teams have identified signs of an external cyber intrusion. The attackers masked their origin effectively. We cannot determine who is responsible."
 MD_cyber.2.a: "防御を強化しろ。"
 MD_cyber.3.t: "[?disp_name_agressor.GetNameWithFlag]によるサイバー攻撃を特定"
 MD_cyber.3.d: "情報機関が[?disp_name_agressor.GetNameWithFlag]による最近のサイバー侵入を追跡した。攻撃は意図的かつ標的を絞ったものであった。我々は正式な外交抗議を行った。"
 MD_cyber.3.a: "侵略を非難する。"
 MD_cyber.4.t: "作戦中止"
 MD_cyber.4.d: "我々のサイバーチームは標的のシステム内に安定した足場を築くことができなかった。いかなる行動も取る前に作戦は中止された。さらなる準備が必要である。"
 MD_cyber.4.a: "再編成し、状況を再評価せよ。"
 MD_cyber.11.t: "GPS信号の障害"
 MD_cyber.11.d: "軍部隊から衛星航法システムの広範な障害が報告されている。前線の指揮官は効果的な連携に苦しんでいる。外部からの信号妨害攻撃が疑われる。"
 MD_cyber.11.a: "予備航法に切り替えろ。"
 MD_cyber.12.t: "金融ネットワークが侵害された"
 MD_cyber.12.d: "Banks, exchanges, and payment processors are reporting cascading system failures. The disruption is not accidental. Our analysts believe foreign operatives have targeted our financial infrastructure."
 MD_cyber.12.a: "被害を隔離し封じ込めろ。"
 MD_cyber.13.t: "情報空間が侵入された"
 MD_cyber.13.d: "ソーシャルメディアとニュースネットワークに組織的な偽情報が大量に流入している。政府に対する国民の信頼は低下している。我々の分析官はこれを外国による影響工作と見ている。"
 MD_cyber.13.a: "対抗言説運動を開始しろ。"
 MD_cyber.14.t: "重要インフラが攻撃を受けている"
 MD_cyber.14.d: "発電所、交通拠点、通信拠点で同時多発的な障害が発生している。技術者は制御システムを通じた意図的な破壊工作の兆候を報告している。これは事態の重大な悪化である。"
 MD_cyber.14.a: "国家非常事態を宣言しろ。"
 MD_cyber.15.t: "壊滅的なサイバー攻撃"
 MD_cyber.15.d: "Every critical system in the country has been hit simultaneously: financial networks, power grids, military communications, and supply chains. The scale and precision of the attack is unprecedented. The nation is crippled."
 MD_cyber.15.a: "持てるもの全てを動員せよ。"
 MD_cyber.16.t: "通信が侵害された"
 MD_cyber.16.d: "外国の工作員が我々の暗号化された通信チャネルに侵入した。機密性の高い通信が敵対的な国家主体によって監視されている可能性が高い。"
 MD_cyber.16.a: "通信封鎖を実施しろ。"
 MD_cyber.17.t: "レーダー網が混乱"
 MD_cyber.17.d: "Our air defense radar networks are returning false readings. Ghost contacts are overwhelming operators. Enemy aircraft may be exploiting the confusion."
 MD_cyber.17.a: "予備の探知プロトコルに切り替えろ。"
 MD_cyber.18.t: "外国からの影響力工作を検知"
 MD_cyber.18.d: "我が国の国内政治情勢を標的とした、組織的な外国による影響工作の証拠が明らかになった。ソーシャルメディアを通じて偽情報が拡散し、国民の分断を深めている。"
 MD_cyber.18.a: "外国の干渉を非難する。"
 MD_cyber.19.t: "研究ネットワークが侵害された"
 MD_cyber.19.d: "国家研究所および防衛関連企業から機密研究データと産業設計が盗まれた。盗難の全容は現在も調査中だ。"
 MD_cyber.19.a: "すべての機密システムを監査しろ。"
 MD_cyber.110.t: "指揮ネットワークへの侵入"
 MD_cyber.110.d: "我々の軍事および外交の通信網が侵入された。敵工作員が命令や機密通信をリアルタイムで傍受している。"
 MD_cyber.110.a: "侵害されたすべての通信網を排除しろ。"
 MD_cyber.111.t: "中央銀行システムが攻撃を受けている"
 MD_cyber.111.d: "我々の中央銀行および主要な金融決済インフラが継続的なサイバー攻撃を受けている。取引処理は停止し、通貨市場は急速に不安定化している。"
 MD_cyber.111.a: "金融非常事態を宣言しろ。"
 MD_cyber.112.t: "軍事供給網が混乱"
 MD_cyber.112.d: "前線兵站を管理する指揮統制ソフトウェアが複数の部門で停止した。システム全体に混乱が波及する中、前線の部隊からは物資不足の報告が相次いでいる。"
 MD_cyber.112.a: "手動の補給手順に切り替えろ。"
 MD_cyber.113.t: "持続的な侵入を検知"
 MD_cyber.113.d: "我々のセキュリティ部門は、重要ネットワークインフラの深部に埋め込まれた休眠アクセス拠点を発見した。これらのマルウェアは高度に洗練されており、長期間活動していた可能性が高い。"
 MD_cyber.113.a: "ネットワーク全体の監査を開始しろ。"
 MD_cyber.114.t: "指揮情報が侵害された"
 MD_cyber.114.d: "我々の情報機関は、捏造された通信信号や虚偽の通信を用いた体系的な作戦を確認した。軍司令官は意図的に汚染された情報に基づいて行動していた可能性がある。"
 MD_cyber.114.a: "通信検証任務部隊を設置しろ。"
 MD_cyber.115.t: "ゼロデイ攻撃"
 MD_cyber.115.d: "未知の脆弱性を悪用した精密サイバー攻撃が、我々の最も重要なシステムを同時に襲った。産業制御システム、電力インフラ、防衛ネットワークのすべてが影響を受けている。"
 MD_cyber.115.a: "国家サイバー緊急プロトコルを発動しろ。"
 cyber_propaganda_ops_malus: "情報空間が侵入された"
 cyber_propaganda_ops_malus_desc: "組織的な外国の偽情報キャンペーンが、政府および制度への信頼を低下させ、政治的な成果を阻害し、国家の結束を損なっている。"
 cyber_gps_jamming_malus: "GPSシステムが妨害された"
 cyber_gps_jamming_malus_desc: "外国のサイバー工作員が我々の軍用衛星航法インフラを侵害し、部隊間の連携と戦況把握能力を著しく低下させた。"
 cyber_economic_disruption_malus: "金融ネットワークが侵害された"
 cyber_economic_disruption_malus_desc: "継続的な外国のサイバー攻撃により、我々の銀行システム、決済ネットワーク、産業生産が損なわれている。経済回復には時間を要する。"
 cyber_infrastructure_damage_malus: "インフラの損害"
 cyber_infrastructure_damage_malus_desc: "外国のサイバー攻撃により、我が国の重要インフラに甚大な損害が生じ、物流、建設、物資供給が阻害されている。"
 cyber_critical_strike_malus: "壊滅的なサイバー攻撃"
 cyber_critical_strike_malus_desc: "壊滅的な大規模サイバー攻撃により、産業インフラ、通信、供給網が同時に機能不全に陥った。復旧には長い時間がかかり、苦難の道のりとなるだろう。"
 cyber_sigint_surveillance_malus: "監視されている通信"
 cyber_sigint_surveillance_malus_desc: "外国の工作員が我々の暗号化通信インフラに侵入した。機密性の高い通信が監視されている可能性が高く、政治的な連携行動が妨げられている。"
 cyber_radar_spoofing_malus: "レーダー網が侵害された"
 cyber_radar_spoofing_malus_desc: "外国のサイバー工作員が我々の防空レーダー網に偽の反応を送り込み、探知・迎撃能力を低下させている。"
 cyber_election_interference_malus: "外国による影響工作が活発化"
 cyber_election_interference_malus_desc: "組織的な外国による偽情報キャンペーンが国民の信頼を損ない、国内の政治的分断を深めている。"
 cyber_industrial_espionage_malus: "研究ネットワークが侵害された"
 cyber_industrial_espionage_malus_desc: "国家研究所および防衛関連企業から機密研究データと産業設計が盗まれ、開発計画に支障をきたしている。"
 cyber_comms_intercept_malus: "指揮ネットワークが侵害された"
 cyber_comms_intercept_malus_desc: "我々の軍事および外交の通信が侵入され、作戦上の安全性が低下し、連携に支障をきたしている。"
 cyber_financial_system_attack_malus: "金融インフラが攻撃を受けている"
 cyber_financial_system_attack_malus_desc: "中央銀行および決済インフラへの継続的な攻撃により、経済全体に連鎖的な機能不全が生じている。"
 cyber_logistics_disruption_malus: "軍事供給網が混乱"
 cyber_logistics_disruption_malus_desc: "前線兵站を管理する指揮統制ソフトウェアが侵害され、前線の部隊で物資不足が発生している。"
 cyber_sleeper_network_malus: "持続的なネットワーク侵入"
 cyber_sleeper_network_malus_desc: "外国工作員が重要ネットワークの深部に休眠アクセス拠点を設置し、機密システムへの持続的な低レベルのアクセスを維持している。"
 cyber_deception_campaign_malus: "指揮情報が汚染された"
 cyber_deception_campaign_malus_desc: "我々の司令官は捏造された信号や虚偽の通信に基づいて行動していた。軍事的な連携と状況認識能力は著しく低下している。"
 cyber_zero_day_strike_malus: "ゼロデイ攻撃"
 cyber_zero_day_strike_malus_desc: "機密のゼロデイ脆弱性を悪用した壊滅的な精密攻撃が、我々の最重要産業およびインフラシステムを同時に襲った。"
 upgrade_establish_cyber_operations_division: "サイバー作戦部門"
 upgrade_establish_cyber_operations_division_desc: "機関内に専用のサイバー作戦部門を設立し、基礎的なデジタル戦能力を提供する。この部門により、我々は§Yサイバー戦争§!作戦を実行する能力を解放する。"
 upgrade_offensive_cyber_operations: "攻勢サイバー戦争"
 upgrade_offensive_cyber_operations_desc: "高度な持続的脅威ツールキットやゼロデイ脆弱性研究によって部門を拡張し、より高度な作戦を可能にする。"
 upgrade_cyber_warfare_operational_planning: "全領域サイバー司令部"
 upgrade_cyber_warfare_operational_planning_desc: "この部門を、強固な目標に対して複雑な多方面作戦を調整できる、完全に統合されたサイバー司令部へと発展させる。"
 upgrade_defensive_cyber_operations: "防御サイバー戦争"
 upgrade_defensive_cyber_operations_desc: "自国ネットワークの強化、侵入検知、およびデジタル上の痕跡の隠蔽に特化した専用の防御チームを構築する。"
 upgrade_cyber_elite: "ゼロデイ兵器庫"
 upgrade_cyber_elite_desc: "世界でも最も堅牢なシステムさえ突破可能な、高度なゼロデイ攻撃手法を極秘裏に開発し、備蓄する。"
 cyber_offense_power_modifier: "攻勢サイバー戦争"
 cyber_offense_power_modifier_desc: "我々の攻勢サイバー戦争作戦の強さを決定づける値。"
 cyber_defense_rating_modifier: "防御サイバー戦争"
 cyber_capability_modifier: "サイバー戦争能力"
 cyber_attribution_bonus_modifier: "サイバー帰属ボーナス"
