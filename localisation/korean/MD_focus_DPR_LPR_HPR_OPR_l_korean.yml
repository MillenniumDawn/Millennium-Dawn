 LPR_mgb_desc: "공화국 내부에서 시민들의 평화와 안녕을 지킬 우리 자체의 부처를 창설할 것입니다."
 LPR_anti_gibdd: "반LGBT"
 LPR_anti_gibdd_desc: "이러한 소수자 집단의 대표자들이 우리 공화국에 들어오는 것을 허용하지 않을 것입니다"
 LPR_anti_ukrain: "반우크라이나 활동"
