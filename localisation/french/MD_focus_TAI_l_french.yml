l_french:
 TAI_legacy_of_1949: "Héritage de 1949"
 TAI_legacy_of_1949_desc: "La fin de la guerre civile chinoise en 1949 a vu le Guomindang nationaliste (KMT) et ses partisans fuir vers la province insulaire de Taïwan. L'héritage de cet événement, combiné à un mouvement taïwanais local et nativiste, a conduit à un fort rejet de la réunification avec le continent par la majorité des citoyens taïwanais."
 TAI_the_great_chip_empire: "Le grand empire de la puce"
 TAI_the_great_chip_empire_desc: "Ayant tiré parti de la production de semi-conducteurs et de microprocesseurs dès son enfance, et en étant un investissement plus attractif que d'autres nations, Taïwan s'est catapultée à l'avant-garde de l'industrie. Par une production bon marché et efficace, et de grandes exportations vers les nations occidentales, Taïwan a équilibré son économie et sa sécurité nationale sur le fait d'être le fournisseur de microprocesseurs du monde occidental, et demeure un leader de l'industrie par une innovation constante et régulière."
 TAI_flight_crew_strike: "Grève de l'Union des Stewards et Hôtesses de l'Air de Taoyuan"
 TAI_flight_crew_strike_desc: "Aucun résultat ! Pas d'arrêt !"
 USA_tsmc_access_modifier: "Accès à TSMC"
 USA_tsmc_access_modifier_desc: "L'industrie américaine bénéficie d'un accès fiable à l'écosystème des semi-conducteurs de Taïwan. L'avantage est suspendu si Taïwan cesse d'exister, perd le contrôle de Taipei, entre en guerre avec les États-Unis ou restreint les exportations de semi-conducteurs."
 TAI_tsmc_trade_benefits_tier_1_tt: "Le développement de TSMC augmente les §YRessources par usine§! à §G+1§! pour §YTaïwan§! et les §YÉtats-Unis§!. L'avantage américain exige un accès continu à Taïwan."
 TAI_tsmc_trade_benefits_tier_2_tt: "Le développement de TSMC augmente les §YRessources par usine§! à §G+2§! pour §YTaïwan§! et les §YÉtats-Unis§!. L'avantage américain exige un accès continu à Taïwan."
 TAI_tsmc_trade_benefits_tier_3_tt: "Le développement de TSMC augmente les §YRessources par usine§! à §G+3§! pour §YTaïwan§! et les §YÉtats-Unis§!. L'avantage américain exige un accès continu à Taïwan."
 TAI_foxconn_ev_pipeline: "Pipeline EV sans volume"
 TAI_foxconn_ev_pipeline_desc: "Les véhicules de référence et les programmes partenaires créent des options d'ingénierie, mais les produits validés et les clients solvables restent rares. Le capital est engagé avant que des volumes fiables n'arrivent."
 TAI_foxconn_factory_behind_brand: "L'usine derrière la marque"
 TAI_foxconn_factory_behind_brand_desc: "Hon Hai/Foxconn transforme les conceptions des clients en production reproductible par l'outillage, les achats, l'ingénierie des procédés, les tests et la logistique. Son énorme débit reste contraint par des marges minces et des clients puissants."
 TAI_foxconn_factory_city_production: "Production Usine-Ville"
 TAI_foxconn_factory_city_production_desc: "Des réseaux de fournisseurs denses, des dortoirs, des transports et des services industriels permettent des montées en cadence rapides. Concentrer le travail et la vie quotidienne dans quelques campus magnifie aussi les risques de main-d'œuvre et de perturbation."
 TAI_foxconn_resilient_manufacturing_network: "Réseau de fabrication résilient"
 TAI_foxconn_resilient_manufacturing_network_desc: "Un réseau Construire, Exploiter, Localiser relie des pôles régionaux qualifiés tout en conservant une capacité continentale précieuse. La redondance améliore l'accès au marché et la reprise de crise, au prix d'une coordination permanente."
 taiwan.300.a: "Construire le réseau continental le plus dense"
 taiwan.300.b: "Poursuivre notre propre marque au lieu de construire pour les autres"
 taiwan.300.d: "En 2000, Hon Hai/Foxconn, basée à Taïwan, est devenue un fabricant d'électronique établi avec un système de production continental en expansion rapide. La direction doit décider si elle continue à construire à grande échelle pour les marques des autres, ou si elle dépense le même capital pour en établir une à elle."
 taiwan.300.t: "L'usine derrière la marque"
 taiwan.301.a: "Élever les normes et automatiser avec prudence"
 taiwan.301.b: "Tenir la ligne sur les coûts et déplacer la production vers l'intérieur"
 taiwan.301.d: "Un groupe de décès de travailleurs au campus Foxconn de Longhua à Shenzhen et des rapports de détresse ont attiré l'attention sur les horaires, la rémunération, la sécurité et la vie dans le système de ville-usine. Les causes sont contestées, mais le besoin d'une réponse institutionnelle ne l'est pas."
 taiwan.301.t: "La crise du travail de Shenzhen"
 taiwan.302.a: "Concentrer le système de lancement à Zhengzhou"
 taiwan.302.b: "Construire plusieurs nœuds de production intérieurs"
 taiwan.302.d: "Zhengzhou offre à Foxconn des infrastructures, un soutien au recrutement et assez d'espace pour un immense campus de production intérieur. Le projet peut créer une capacité extraordinaire de lancement d'iPhone tout en approfondissant la dépendance à un client, un lieu et un environnement politique."
 taiwan.302.t: "Ville iPhone"
 taiwan.303.a: "Mener la recapitalisation de Sharp"
 taiwan.303.b: "Préserver un partenariat stratégique"
 taiwan.303.d: "Sharp a besoin d'un partenaire de recapitalisation, tandis que Foxconn veut l'expertise des écrans, des ingénieurs et une relation plus étroite sur les composants. Le contrôle apporterait un redressement japonais difficile plutôt qu'un transfert instantané de technologie."
 taiwan.303.t: "Sharp au bord du gouffre"
 taiwan.304.a: "S'engager dans le projet du Wisconsin"
 taiwan.304.b: "Réduire le projet avant la construction"
 taiwan.304.d: "Washington a répondu à la proposition de Foxconn. L'entreprise doit maintenant décider si le soutien disponible justifie l'engagement complet, ou si le projet doit être raboté avant le premier coup de pioche."
 taiwan.304.t: "L'engagement du Wisconsin"
 taiwan.305.a: "Un réseau de fabrication qu'aucun choc isolé ne peut briser"
 taiwan.305.b: "Un fournisseur pour l'ère du véhicule électrique"
 taiwan.305.c: "Une ville-usine bâtie autour d'un seul lancement de produit"
 taiwan.305.e: "L'usine derrière la marque de tout le monde"
 taiwan.305.d: "Les racks d'IA complets combinent cartes, accélérateurs, alimentation, refroidissement, câbles et une validation système exigeante, et Nvidia veut que Foxconn les assemble. Un quart de siècle d'échelle, de crise et de diversification a déjà décidé quel genre de fabricant arrive à ce travail."
 taiwan.305.t: "L'usine d'IA"
 taiwan.310.t: "Douze pouces à travers le krach"
 taiwan.310.d: "L'effondrement des semi-conducteurs a vidé des salles blanches qui ont coûté des milliards à construire, et une fab TSMC ne gagne rien tant qu'elle est oisive. La transition 300 mm réduirait le coût de chaque wafer, mais seulement après des années d'outils, d'intégration et de travail patient sur les rendements. Construire la Fab 12 maintenant, c'est la construire dans un marché qui a cessé d'acheter."
 taiwan.310.a: "Financer la montée en 300 mm à travers le creux"
 taiwan.310.b: "Préserver les liquidités jusqu’au retour de la demande"
 taiwan.311.t: "Des plans sans trahison"
 taiwan.311.d: "Les clients de TSMC ont besoin de kits de conception, de bibliothèques, d'outils et de données de qualification pour construire quoi que ce soit sur notre procédé, et chacun d'eux concurrence les autres. La plateforme d'innovation ouverte leur remettrait à tous les mêmes matériaux sans remettre à aucun le design d'un rival. La confiance est le produit que l'on fabrique ici."
 taiwan.311.a: "Publier les kits et ouvrir la plateforme"
 taiwan.311.b: "Garder chaque relation client strictement bilatérale"
 taiwan.312.t: "L'ancre mobile"
 taiwan.312.d: "Apple veut plus de capacité de pointe pour l'A8 que la plupart des autres clients de TSMC réunis, et paiera pour la réserver des années à l'avance. Ce volume financerait le nœud suivant à lui seul. Il ferait aussi tourner les fortunes de la fonderie sur le cycle produit d'une seule entreprise."
 taiwan.312.a: "Réserver la capacité de pointe au client ancre"
 taiwan.312.b: "Tenir la ligne sur la neutralité de fonderie"
 taiwan.313.t: "Arizona : une assurance à un prix"
 taiwan.313.d: "Washington veut des wafers de pointe fabriqués sur le sol américain, est prêt à aider à les payer, et c'est TSMC qu'on interroge. Une annonce n'est pas une fab : les outils, les ingénieurs, l'eau et les clients doivent tous arriver avant le premier wafer qualifié, et chacun coûte plus cher en Arizona qu'à Hsinchu. L'assurance est réelle, et la prime aussi."
 taiwan.313.a: "S'engager sur les fabs à l'étranger"
 taiwan.313.b: "Garder la pointe sur l'île"
 taiwan.314.t: "Les puces sont le goulot"
 taiwan.314.d: "Constructeurs automobiles, marques grand public et clients informatiques enchérissent tous pour une production TSMC qui n'existe pas, et leurs gouvernements ont commencé à passer les appels eux-mêmes. Laisser l'État fixer l'allocation achèterait un considérable capital de sympathie dans des capitales qui comptent. Cela dirait aussi à chaque client qu'une file qu'il ne voit pas décide désormais de sa place."
 taiwan.314.a: "Laisser l'État diriger l'allocation"
 taiwan.314.b: "Garder l'allocation commerciale"
 taiwan.315.t: "La contrainte CoWoS"
 taiwan.315.d: "Le wafer n'est plus la partie difficile. Les accélérateurs ont besoin d'un packaging avancé, de mémoire empilée et de substrats avant de valoir quoi que ce soit, et la capacité CoWoS de TSMC est loin d'être suffisante. Construire cette capacité transforme une fonderie de wafers en quelque chose de plus grand, et nous place dans des métiers que nos propres clients occupent actuellement."
 taiwan.315.a: "Faire du packaging avancé un métier"
 taiwan.315.b: "Rester une pure fonderie de plaquettes"
 taiwan.316.t: "Quel genre de fonderie avons-nous bâtie ?"
 taiwan.316.d: "Vingt-cinq ans de nœuds, de creux, de clients ancre et de premières pierres à l'étranger ont tranché ce qu'est TSMC, ce que l'île fabrique réellement, et qui décide où cela va."
 taiwan.316.a: "Une fonderie que l'État dirige"
 taiwan.316.b: "Un réseau allié de confiance"
 taiwan.316.c: "Une fonderie de systèmes, pas un atelier de wafers"
 taiwan.316.e: "Une fonderie pure play, et rien d'autre"
 TAI_tsmc_state_directed_foundry: "Fonderie dirigée par l'État"
 TAI_tsmc_state_directed_foundry_desc: "L'allocation passe par le ministère avant de passer par le bureau des ventes, et la file est une affaire de politique. La capacité répond d'abord aux intérêts de l'île et ensuite à ses clients, et les clients l'ont remarqué."
 TAI_tsmc_trusted_allied_foundry_network: "Réseau de fonderies alliées de confiance"
 TAI_tsmc_trusted_allied_foundry_network_desc: "Arizona, Kumamoto et Dresde ont été qualifiés et ont tourné, si bien que la pointe n'est plus un seul point sur une seule île. Cela coûte plus par wafer que de tout concentrer chez soi, et cela achète quelque chose que la concentration n'a jamais pu."
 TAI_tsmc_systems_foundry_platform: "Plateforme de fonderie de systèmes"
 TAI_tsmc_systems_foundry_platform_desc: "Wafers, packaging, mémoire empilée et tests partent désormais comme un seul produit qualifié. La fonderie vend la capacité finie plutôt que la couche en dessous, là où la contrainte s'était de toute façon déplacée."
 TAI_tsmc_disciplined_pure_play_foundry: "Fonderie Pure Play disciplinée"
 TAI_tsmc_disciplined_pure_play_foundry_desc: "Pas de marques, pas de produits, pas de concurrence avec ceux qui nous achètent. La discipline qui a fait fonctionner le modèle est le modèle, et elle a été gardée exactement telle quelle."
 taiwan.320.t: "Acer sépare la marque de l'usine"
 taiwan.320.d: "Acer construisant les ordinateurs des autres et vendant les siens sur les mêmes rayons est un conflit que les clients lisent sur une facture. Séparer la fabrication sous Wistron laisserait chaque moitié chasser le business que l'autre lui coûtait. Cela coupe aussi l'entreprise en deux au moment où elle est enfin grande."
 taiwan.320.a: "Séparer la marque de l'usine"
 taiwan.320.b: "Conserver un seul fabricant intégré"
 taiwan.321.t: "La question x86 se règle"
 taiwan.321.d: "Des années de litiges entre VIA Technologies et Intel sur les jeux d'instructions et les chipsets se terminent par une licence croisée de dix ans plutôt que par une victoire en tribunal. Les termes garantissent le droit de VIA de continuer à construire, selon des conditions écrites par l'opérateur historique. Un troisième vendeur x86 reste juridiquement possible et commercialement improbable."
 taiwan.321.a: "Transiger et sécuriser la licence"
 taiwan.321.b: "Tenir pour de meilleures conditions"
 taiwan.322.t: "Une république de joueurs"
 taiwan.322.d: "Les acheteurs de composants qui choisissent leurs propres cartes mères paieront une prime pour des pièces qui s'annoncent. Le lancement par ASUS d'une ligne dédiée Republic of Gamers gagnerait des marges que le business de commodité ne voit jamais, et cela exige marketing, support et design qu'un fournisseur de composants n'a jamais eu à faire."
 taiwan.322.a: "Construire la marque premium"
 taiwan.322.b: "Restez fournisseur de composants"
 taiwan.323.t: "La seconde séparation"
 taiwan.323.d: "Le même conflit qui a scindé Acer scinde maintenant son rival : la marque ne peut croître tant que l'usine sert les concurrents de la marque. Détacher le bras de fabrication crée l'un des plus grands fabricants sous contrat de la terre. Cela cède aussi l'usine qui a rendu la marque possible."
 taiwan.323.a: "Détacher le bras de fabrication"
 taiwan.323.b: "Garder marque et usine ensemble"
 taiwan.324.t: "Un petit PC pour tous"
 taiwan.324.d: "Le netbook qu'ASUS a lancé avec l'Eee PC est devenu la catégorie qui se vend le plus vite en informatique, et chaque fabricant taïwanais peut construire un portable bon marché, léger et sous-alimenté d'ici le week-end. Les marges sont terribles et les volumes énormes. Si c'est l'avenir de l'industrie ou une mode qui habitue les clients à n'attendre rien n'est pas encore clair."
 taiwan.324.a: "Poursuivre la transition mobile"
 taiwan.324.b: "Défendre les marges du desktop"
 taiwan.325.t: "L'étau des marges"
 taiwan.325.d: "Les téléphones ont pris le volume, les marques ont pris les rayons, et Acer, ASUS et les autres fabricants de l'île se concurrencent pour ce qui reste d'un marché en contraction. Coordonner l'industrie d'en haut les empêcherait de se sous-cotter. Cela voudrait aussi dire décider, dans un ministère, lequel d'entre eux mérite de survivre."
 taiwan.325.a: "Coordonner l'industrie d'en haut"
 taiwan.325.b: "Laisser le marché la consolider"
 taiwan.326.t: "L'écosystème informatique de Taiwan évalué"
 taiwan.326.d: "Un quart de siècle de scissions, de spin-offs, de marques premium et de guerres de prix a tranché ce que sont Acer, ASUS, Quanta et le reste de l'industrie informatique de l'île : dont le nom est sur la boîte, et dont l'usine est derrière."
 taiwan.326.a: "Un écosystème informatique à spectre complet"
 taiwan.326.b: "Une centrale de systèmes de marque"
 taiwan.326.c: "Un Commonwealth à composante mondiale"
 taiwan.326.e: "Un resserrement des marges auquel personne n’a échappé"
 TAI_pc_full_spectrum_computing_ecosystem: "Écosystème informatique à spectre complet"
 TAI_pc_full_spectrum_computing_ecosystem_desc: "Composants, fabrication sous contrat et marques finies ont été gardés dans une industrie coordonnée plutôt que laissés à se déchirer. L'île construit chaque couche d'un ordinateur et décide entre elles délibérément."
 TAI_pc_branded_systems_powerhouse: "Centrale de systèmes de marque"
 TAI_pc_branded_systems_powerhouse_desc: "Les noms sur les boîtes sont taïwanais et ils commandent une prime, une position qu'aucun fournisseur de composants ne tient jamais. Les marques se tiennent par l'attention, et l'attention se loue plutôt qu'elle ne s'acquiert."
 TAI_pc_global_component_commonwealth: "Composante mondiale Commonwealth"
 TAI_pc_global_component_commonwealth_desc: "Presque chaque ordinateur vendu quelque part contient des pièces construites ici, sous le nom de quelqu'un d'autre. Les volumes sont extraordinaires et les marges appartiennent à qui met le badge."
 TAI_pc_fragmented_margin_squeeze: "Compression de marge fragmentée"
 TAI_pc_fragmented_margin_squeeze_desc: "Trop d'entreprises capables ont chassé le même marché en contraction et se sont sous-cotées jusqu'au bout. L'ingénierie n'a jamais cessé d'être bonne ; les prix n'ont jamais cessé de baisser."