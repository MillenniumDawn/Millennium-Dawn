 GEO_armenian_proposal_com: "아르메니아에 대한 제안"
 GEO_money_from_outside_desc: "최근의 무역 협상이 결실을 맺어 조지아는 세계무역기구 가입을 마무리하고 있습니다. WTO 정회원이 되면 경제 발전이 가능해지고 우리나라에 이로운 유리한 무역 협정을 맺을 수 있게 됩니다."
 GEO_transit_tax_desc: "이민자들에게서 돈을 걷으면 어떻게 될까요?"
 GEO_tax_reforms_desc: "좋은 세제 개혁을 하고 그 돈으로 우리나라를 성장시킬 수 있습니다."
 GEO_tax_amnisty_2004_desc: "우리나라에는 탈세자가 많아서 나라를 운영할 자금이 부족합니다. 그들에 대한 기소를 취하하여 다시 안심하고 세금을 내게 하면 훨씬 더 많은 돈을 얻을 수 있습니다!"
 GEO_ask_west_for_help_desc: "유럽 연합과 그 안의 우리 친구에게 손을 내밀면 그들이 지원해 주도록 설득해 볼 수 있습니다."
 GEO_kulev_terminal_desc: "석유 터미널을 건설하는 데 돈을 쓰고, 더 많은 돈을 돌려받을 것입니다!"
 GEO_polminmeet_desc: "폴란드와 협력하면 유럽에서의 외교 활동을 더욱 진전시킬 수 있고, 해외에서 늘어나는 우방 목록도 넓힐 수 있습니다."
 geo_misc.11.t: "조지아 SSR 제안"
 geo_misc.11.d: "조지아 사회주의자들이 우리 두 나라의 통합에 관한 합의를 제안합니다. 어떻게 해야 합니까?"
 geo_misc.11.a: "붉은 가면을 쓴 자본가들이 우리를 노예로 삼지 못할 것이다!"
 geo_misc.11.b: "어쩌면 붉은 10월을 위해서라면..."
 GEO_flag_cis_incr_stuff: "CIS/러시아와의 무역을 늘리면 이 결정을 내릴 수 없게 됩니다!"
