 antarctica_join_ccamlr_effect_tt: "Rejoindre la §YCCAMLR§!.\nAugmente les productions de laboratoire concernées de §G+20 %§! (multiplicateur), et non par des valeurs plates :\n- production de §Yrecherche sous-marine§!\n- production de §Yrecherche de modules navals§!\n- production de détection navale\nExemple : §Y+6 %§! de recherche sous-marine devient §G+7,2 %§!."
