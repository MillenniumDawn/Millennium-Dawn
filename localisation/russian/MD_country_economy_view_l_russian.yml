 military_factory_employment_button_tt: "§YЗанятость на военных заводах§!"
 military_factory_employment_button_delayed_tt: "Когда у нас больше рабочих мест, чем работников, в некоторых случаях может быть полезно увеличивать или уменьшать количество работников, распределённых по секторам (фабрики/офисы), чтобы освободить рабочую силу для других отраслей.\n\nПолитическая власть: §R-20§!\n\n£click_left §YL ЛКМ§! — увеличить уровень занятости военных фабрик.\n£click_right §YR ПКМ§! — уменьшить его.\n\nТекущий целевой уровень занятости: §Y[?ROOT.military_factory_employment_var|%]§!"
