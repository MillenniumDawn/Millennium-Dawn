 israel_economy.13.d: "Agora aderimos ao Programa de Isenção de Vistos."
 israel_economy.13.a: "Ótimo!"
 israel_economy.14.t: "Os EUA Discordam."
 israel_economy.14.d: "Eles não concordaram."
 israel_economy.14.a: "Argh..."
