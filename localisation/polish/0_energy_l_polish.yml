 toggle_fossil_fuel_power_plant_generation_tt: "§YPrzełącz produkcję prądu elektrowni na paliwa kopalne§!\nPrzełącza produkcję prądy naszych §Yelektrowni na paliwa kopalne§!. Pozwoli nam to skupić się wyłącznie na źródłach energii odnawialnej lub strategicznie obniżyć zużycie paliwa przez nasze elektrownie."
 toggle_fossil_fuel_power_plant_generation_delayed_tt: "§YEfekty:§!\n[!toggle_fossil_fuel_power_plant_generation_click]"
 toggle_fossil_fuel_power_plant_generation_one_tt: "Uruchom §Yprodukcję prądu przez elektrownie na paliwa kopalne§!"
 toggle_fossil_fuel_power_plant_generation_two_tt: "Odetnij §Yelektrownie na paliwa kopalne od produkcji prądu§!"
 toggle_nuclear_power_plant_generation_tt: "§YPrzełącz produkcję prądu elektrowni atomowych§!\nPrzełącza produkcję energii przez §Yelektrownie atomowe§!. Pozwoli nam to skupić się na innych metodach produkcji energii i zaoszczędzić na zużyciu paliwa nuklearnego dla przyszłego wykorzystania."
