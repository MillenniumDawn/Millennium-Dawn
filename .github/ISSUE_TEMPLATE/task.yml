name: Task
description: An update, system, or graphics task for Millennium Dawn.
title: "[TASK] "
type: task
body:
  - type: dropdown
    id: worktype
    attributes:
      label: Work type
      options:
        - Update
        - System
        - GFX
    validations:
      required: true
  - type: dropdown
    id: region
    attributes:
      label: Region
      description: Pick Other for work that is not tied to one region.
      options:
        - Africa
        - Latin America
        - East Asia
        - Middle East
        - Europe
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What the task is and what done looks like.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Screenshots, references, and related issues.
