 UKR_crimean_bop_open_central_asia_talks: "Request §YCentral Asian§! Repatriation Agreements"
 UKR_crimean_bop_open_central_asia_talks_desc: "§WAsk [UZB.GetFlag] §Y[UZB.GetName]§!, [KAZ.GetFlag] §Y[KAZ.GetName]§!, [KYR.GetFlag] §Y[KYR.GetName]§!, [TAJ.GetFlag] §Y[TAJ.GetName]§! and [TRK.GetFlag] §Y[TRK.GetName]§! to approve the organized return of §YCrimean Tatar§! families to §Y[669.GetName]§!.§!\n\n§YPreparation:§! 30 days; §R25 Political Power§!\n§GAll five approvals§! are needed before a repatriation wave can begin. §RRefusal§! by any country unlocks a separately funded renegotiation.\n§LEach government checks the [UKR.GetFlag] Ukrainian minimum diplomatic share and the [SOV.GetFlag] Russian 3:1 limit independently.§!"
 UKR_crimean_bop_initial_talks_mission: "§YCentral Asian§! Repatriation Negotiations"
 UKR_crimean_bop_initial_talks_mission_desc: "§W[UKR.GetFlag] §Y[UKR.GetNameDef]§! is negotiating repatriation agreements with Central Asian countries.§!\n\n§YDuration:§! 30 days. §GAcceptance§! records a separate consent for each country. §RRefusal§! unlocks country-specific renegotiation.\n§LNo major resettlement funds are spent until a repatriation wave is started.§!"
 UKR_crimean_bop_renegotiate_uzbekistan_repatriation: "Renew Repatriation Negotiations with [UZB.GetFlag] §Y[UZB.GetName]§!"
 UKR_crimean_bop_renegotiate_uzbekistan_repatriation_desc: "§WThe government of [UZB.GetFlag] §Y[UZB.GetName]§! has §Rrejected§! the proposed return of §YCrimean Tatar§! families to §Y[669.GetName]§!. After the refusal, [UKR.GetFlag] §Y[UKR.GetNameDef]§! can offer further compensation and guarantees.§!\n\n§YAdditional cost:§! §R[?UKR_crimean_bop_uzbekistan_repatriation_renegotiation_cost|2] billion USD§! and §R35 Political Power§!\n§YNegotiation time:§! 60 days\n§YMinimum [UKR.GetFlag] §Y[UKR.GetAdjective]§! influence in [UZB.GetFlag] §Y[UZB.GetName]§!:§! §G12%§!\n§YMaximum Russian influence:§! [SOV.GetFlag] §Y[SOV.GetNameDef]§! must have §Gno more than three times§! the [UKR.GetFlag] §Y[UKR.GetAdjective]§! share.\n§RThe payment does not override diplomatic influence requirements.§! A renewed refusal triggers §R180 days§! of cooldown; each retry increases the money price by §R50%§!."
 UKR_crimean_bop_renegotiate_uzbekistan_repatriation_mission: "Renewed Negotiations with [UZB.GetFlag] §Y[UZB.GetName]§!"
 UKR_crimean_bop_renegotiate_uzbekistan_repatriation_mission_desc: "§W[UKR.GetFlag] §Y[UKR.GetNameDef]§! has offered additional financial support to [UZB.GetFlag] §Y[UZB.GetName]§! to enable the return of §YCrimean Tatars§! to §Y[669.GetName]§!.§!\n\n§YDuration:§! 60 days\n§GSuccess:§! the country confirms its consent. §RFailure:§! negotiations may be repeated after a cooldown; funds are not returned."
