 module_aa_missiles_1: "Misiles antiaéreos I"
 module_aa_missiles_1_desc: "Early ship-based anti-aircraft missiles provide basic long-range defense against enemy aircraft. While limited in speed and targeting, they extend a vessel's protective envelope beyond traditional guns.\n\n§GDesigner Hint: This module provides anti-aircraft and armor stats, at the cost of increased IC costs.§!"
 module_aa_missiles_2: "Misiles antiaéreos II"
 module_aa_missiles_2_desc: "Los misiles antiaéreos mejorados cuentan con tiempos de reacción más rápidos, mejores sistemas de guía y un alcance incrementado, optimizando la capacidad de la flota para contrarrestar las amenazas aéreas modernas.\n\n§GConsejo de diseño: Este módulo proporciona estadísticas de defensa antiaérea y blindaje, a costa de un mayor coste de capacidad industrial (IC).§!"
 module_aa_missiles_3: "Misiles antiaéreos III"
 module_aa_missiles_3_desc: "Los misiles antiaéreos modernos integran buscadores avanzados y capacidades de anticontramedidas electrónicas, permitiendo una interceptación fiable de aeronaves rápidas y de baja observabilidad (sigilo).\n\n§GConsejo de diseño: Este módulo proporciona estadísticas de defensa antiaérea y blindaje, a costa de un mayor coste de capacidad industrial (IC).§!"
 module_aa_missiles_4: "Misiles antiaéreos IV"
 module_aa_missiles_4_desc: "Los sistemas de misiles antiaéreos altamente avanzados utilizan sensores en red y un control de tiro automatizado, lo que permite el combate simultáneo contra múltiples objetivos aéreos.\n\n§GConsejo de diseño: Este módulo proporciona estadísticas de defensa antiaérea y blindaje, a costa de un mayor coste de capacidad industrial (IC).§!"
 module_aa_missiles_5: "Misiles antiaéreos V"
 module_aa_missiles_5_desc: "Los misiles antiaéreos de próxima generación enfatizan el combate de largo alcance, una maniobrabilidad superior y la resistencia a la guerra electrónica, fortaleciendo significativamente la defensa aérea de la flota.\n\n§GConsejo de diseño: Este módulo proporciona estadísticas de defensa antiaérea y blindaje, a costa de un mayor coste de capacidad industrial (IC).§!"
 module_aa_missiles_6: "Misiles antiaéreos VI"
 module_aa_missiles_6_desc: "Los misiles antiaéreos del futuro cercano representan la cúspide de la defensa aérea naval, combinando puntería asistida por IA, velocidad extrema y anticontramedidas avanzadas para derrotar las amenazas aéreas más sofisticadas.\n\n§GConsejo de diseño: Este módulo proporciona estadísticas de defensa antiaérea y blindaje, a costa de un mayor coste de capacidad industrial (IC).§!"
 module_aa_missiles_7: "Misiles antiaéreos VII"
 module_aa_missiles_7_desc: "Los sistemas de misiles antiaéreos hiperavanzados representan la cúspide de la defensa aérea naval, combinando puntería asistida por IA, velocidad extrema y anticontramedidas avanzadas para derrotar las amenazas aéreas más sofisticadas.\n\n§GConsejo de diseño: Este módulo proporciona estadísticas de defensa antiaérea y blindaje, a costa de un mayor coste de capacidad industrial (IC).§!"
 module_aa_missiles_8: "Misiles antiaéreos VIII"
 module_aa_missiles_8_desc: "Los sistemas de misiles antiaéreos ultraavanzados representan la cúspide de la defensa aérea naval, combinando puntería asistida por IA, velocidad extrema y anticontramedidas avanzadas para derrotar las amenazas aéreas más sofisticadas.\n\n§GConsejo de diseño: Este módulo proporciona estadísticas de defensa antiaérea y blindaje, a costa de un mayor coste de capacidad industrial (IC).§!"
