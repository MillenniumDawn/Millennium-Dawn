l_english:
 # Operation Blue Tiger milestone 7: Cross-Strait Tension meter
 OBT_cross_strait_category: "Cross-Strait Relations"
 OBT_cross_strait_category_desc: "Beijing's pressure and Taipei's response move one shared measure, §YCross-Strait Tension§!. Higher stages harden the island's resolve but cost it trade and political capital; calm pays both sides. Pressure is not control: no stage forces war, annexation or capitulation."
 OBT_strait_meter_title: "CROSS-STRAIT TENSION: §Y[?CHI.CHI_taiwan_strait_tension|0]§!/100 · [OBT_strait_stage_name]"
 OBT_strait_meter_tt: "§YCross-Strait Tension§! is shared by Beijing and Taipei. It rises with coercion, blockades and provocations, and falls with dialogue, trade and restraint.\n\n§GCalm§! 0-19   §YFriction§! 20-39   §OCoercion§! 40-59   §RCrisis§! 60-79   §RBrink§! 80-100\n\n§YModifiers now in force§! (updated at the start of each month):\n[OBT_strait_active_effects]\n\nNo stage starts a war, annexes Taiwan or forces it to capitulate."
 OBT_strait_stage_calm: "Calm"
 OBT_strait_stage_calm_colored: "§GCALM§!"
 OBT_strait_label_calm: "[OBT_strait_label_calm_text]"
 OBT_strait_label_calm_on: "§GCALM§!"
 OBT_strait_label_calm_off: "§gCalm§!"
 OBT_strait_stage_calm_tt: "§GCalm§! (0-19)\n$OBT_strait_effects_calm$"
 OBT_strait_effects_calm: "§YChina§!: §G+2%§! stability, §G+5%§! political power, §G+5%§! trade opinion, §G+2%§! factory output\n§YTaiwan§!: §G+2%§! stability, §G+5%§! political power, §G+5%§! trade opinion, §G+2%§! factory output"
 OBT_strait_stage_friction: "Friction"
 OBT_strait_stage_friction_colored: "§YFRICTION§!"
 OBT_strait_label_friction: "[OBT_strait_label_friction_text]"
 OBT_strait_label_friction_on: "§YFRICTION§!"
 OBT_strait_label_friction_off: "§gFriction§!"
 OBT_strait_stage_friction_tt: "§YFriction§! (20-39)\n$OBT_strait_effects_friction$"
 OBT_strait_effects_friction: "§YChina§!: §G+1%§! political power, §R-2%§! trade opinion\n§YTaiwan§!: §R-2%§! trade opinion, §G+2%§! war support"
 OBT_strait_stage_coercion: "Coercion"
 OBT_strait_stage_coercion_colored: "§OCOERCION§!"
 OBT_strait_label_coercion: "[OBT_strait_label_coercion_text]"
 OBT_strait_label_coercion_on: "§OCOERCION§!"
 OBT_strait_label_coercion_off: "§gCoercion§!"
 OBT_strait_stage_coercion_tt: "§OCoercion§! (40-59)\n$OBT_strait_effects_coercion$"
 OBT_strait_effects_coercion: "§YChina§!: §R-1%§! stability, §R-2%§! political power, §R-5%§! trade opinion, §G+2%§! army organization, §G+5%§! army experience gain, §G+5%§! navy experience gain\n§YTaiwan§!: §R-2%§! political power, §R-3%§! trade opinion, §G+3%§! war support, §G+2%§! army defense, §G+2%§! recruitable population, §G+5%§! anti-air damage"
 OBT_strait_stage_crisis: "Crisis"
 OBT_strait_stage_crisis_colored: "§RCRISIS§!"
 OBT_strait_label_crisis: "[OBT_strait_label_crisis_text]"
 OBT_strait_label_crisis_on: "§RCRISIS§!"
 OBT_strait_label_crisis_off: "§gCrisis§!"
 OBT_strait_stage_crisis_tt: "§RCrisis§! (60-79)\n$OBT_strait_effects_crisis$"
 OBT_strait_effects_crisis: "§YChina§!: §R-3%§! stability, §R-5%§! political power, §R-10%§! trade opinion, §R+2%§! consumer goods, §G+3%§! army organization, §G+10%§! army experience gain, §G+10%§! navy experience gain\n§YTaiwan§!: §R-2%§! stability, §R-4%§! political power, §R-6%§! trade opinion, §R+2%§! consumer goods, §G+5%§! war support, §G+4%§! army defense, §G+4%§! recruitable population, §G+10%§! anti-air damage"
 OBT_strait_stage_brink: "Brink"
 OBT_strait_stage_brink_colored: "§RBRINK (!)§!"
 OBT_strait_label_brink: "[OBT_strait_label_brink_text]"
 OBT_strait_label_brink_on: "§RBRINK§!"
 OBT_strait_label_brink_off: "§gBrink§!"
 OBT_strait_stage_brink_tt: "§RBrink§! (80-100)\n$OBT_strait_effects_brink$"
 OBT_strait_effects_brink: "§YChina§!: §R-5%§! stability, §R-10%§! political power, §R-15%§! trade opinion, §R+4%§! consumer goods, §G+5%§! army organization, §G+15%§! army experience gain, §G+15%§! navy experience gain\n§YTaiwan§!: §R-4%§! stability, §R-6%§! political power, §R-10%§! trade opinion, §R+4%§! consumer goods, §G+8%§! war support, §G+5%§! army defense, §G+6%§! recruitable population, §G+15%§! anti-air damage"
 OBT_strait_line_calm: "§YStage:§! [OBT_strait_stage_name]   Rises to §YFriction§! at §Y20§!."
 OBT_strait_info_calm: "§GCalm§!\n\n§YEffects§!\n$OBT_strait_effects_calm$\n\n§YDecisions§!\nNo crisis decisions are needed. Trade talks and quiet diplomacy keep the peace.\n\n§YMoving the meter§!\nCoercion, blockades, warnings, patrol surges and readiness raise tension. Hotlines, quiet channels, trade talks, incentives and reaffirming the status quo lower it."
 OBT_strait_line_friction: "§YStage:§! [OBT_strait_stage_name]   Rises to §OCoercion§! at §Y40§! · falls to §GCalm§! below §Y20§!."
 OBT_strait_info_friction: "§YFriction§!\n\n§YEffects§!\n$OBT_strait_effects_friction$\n\n§YDecisions§!\nTaiwan can brief Washington. Trade talks remain open.\n\n§YMoving the meter§!\nCoercion, blockades, warnings, patrol surges and readiness raise tension. Hotlines, quiet channels, trade talks, incentives and reaffirming the status quo lower it."
 OBT_strait_line_coercion: "§YStage:§! [OBT_strait_stage_name]   Rises to §RCrisis§! at §Y60§! · falls to §YFriction§! below §Y40§!."
 OBT_strait_info_coercion: "§OCoercion§!\n\n§YEffects§!\n$OBT_strait_effects_coercion$\n\n§YDecisions§!\nCrisis hotlines open for both sides. Taiwan can raise readiness. Trade talks remain open.\n\n§YMoving the meter§!\nCoercion, blockades, warnings, patrol surges and readiness raise tension. Hotlines, quiet channels, trade talks, incentives and reaffirming the status quo lower it."
 OBT_strait_line_crisis: "§YStage:§! [OBT_strait_stage_name]   Rises to §RBrink§! at §Y80§! · falls to §OCoercion§! below §Y60§!."
 OBT_strait_info_crisis: "§RCrisis§!\n\n§YEffects§!\n$OBT_strait_effects_crisis$\n\n§YDecisions§!\nTaiwan can declare a §YBlue Tiger Emergency§! without a blockade. Trade talks close; warnings and patrol surges remain possible.\n\n§YMoving the meter§!\nCoercion, blockades, warnings, patrol surges and readiness raise tension. Hotlines, quiet channels, trade talks, incentives and reaffirming the status quo lower it."
 OBT_strait_line_brink: "§YStage:§! [OBT_strait_stage_name]   The highest stage · falls to §RCrisis§! below §Y80§!."
 OBT_strait_info_brink: "§RBrink§!\n\n§YEffects§!\n$OBT_strait_effects_brink$\n\n§YDecisions§!\nBeijing can §Yprepare a contingency war goal§!; war still needs a declaration. Warnings and patrol surges are exhausted.\n\n§YMoving the meter§!\nCoercion, blockades, warnings, patrol surges and readiness raise tension. Hotlines, quiet channels, trade talks, incentives and reaffirming the status quo lower it."
 OBT_strait_stage_line: "[OBT_strait_stage_line_text]"
 OBT_strait_stage_info_tt: "[OBT_strait_stage_info_text]"
 OBT_strait_at_least_friction_tt: "Cross-Strait Tension is at least §YFriction§! (20)"
 OBT_strait_at_least_coercion_tt: "Cross-Strait Tension is at least §OCoercion§! (40)"
 OBT_strait_at_least_crisis_tt: "Cross-Strait Tension is at least §RCrisis§! (60)"
 OBT_strait_at_least_brink_tt: "Cross-Strait Tension is at §RBrink§! (80)"
 OBT_strait_at_most_coercion_tt: "Cross-Strait Tension is below §RCrisis§! (60)"
 OBT_strait_at_most_crisis_tt: "Cross-Strait Tension is below §RBrink§! (80)"
 OBT_ind_chi_trust: "Cross-Strait Trust: §Y[?CHI.CHI_TAI_trust|0]§! ([?global.OBT_d_trust|+=0])"
 OBT_ind_us_support: "U.S. Support for Taiwan: §Y[?CHI.CHI_taiwan_us_support|0]§! ([?global.OBT_d_ussupport|-=0])"
 OBT_ind_chi_burden: "Taiwan Blockade Burden: §Y[?TAI.TAI_blockade_burden|0]§! ([?global.OBT_d_burden|0])"
 OBT_ind_chi_ptn: "Taipei's Will to Negotiate: §Y[?TAI.TAI_pressure_to_negotiate|0]§! ([?global.OBT_d_ptn|+=0])"
 OBT_ind_tai_ptn: "Pressure to Negotiate: §Y[?TAI.TAI_pressure_to_negotiate|0]§! ([?global.OBT_d_ptn|-=0])"
 OBT_ind_tai_burden: "Blockade Burden: §Y[?TAI.TAI_blockade_burden|0]§! ([?global.OBT_d_burden|-=0])"
 OBT_ind_us_confidence: "U.S. Confidence in Taipei: §Y[?TAI.TAI_us_confidence|0]§! ([?global.OBT_d_usconf|+=0])"
 OBT_ind_identity: "Taiwan-Centered Identity: §Y[?TAI.TAI_taiwanese_identity|0]§! ([?global.OBT_d_identity|0])"
 OBT_ind_chi_trust_tt: "§YCross-Strait Trust§!: how far Beijing and Taipei trust each other.\n§GRises§! with hotlines, quiet channels, incentives and trade talks.\n§RFalls§! with pressure and broken talks.\n\nThe number in brackets is the change over the last month."
 OBT_ind_us_support_tt: "§YU.S. Support for Taiwan§! is Washington's commitment to deterring Beijing.\n§RRises§! when China escalates or Taipei briefs Washington.\nIt is §Ynot§! the same as U.S. Confidence in Taipei.\n\nThe number in brackets is the change over the last month."
 OBT_ind_us_confidence_tt: "§YU.S. Confidence in Taipei§! is Washington's trust in Taiwan's government.\n§GRises§! with restraint, hotlines and keeping promises.\n§RFalls§! with provocations and first strikes.\nIt is §Ynot§! the same as U.S. Support for Taiwan.\n\nThe number in brackets is the change over the last month."
 OBT_ind_chi_burden_tt: "§YTaiwan Blockade Burden§!: how hard a blockade is hitting Taiwan's economy after its preparations. Above 40 it pushes Taipei toward talks.\n\nThe number in brackets is the change over the last month."
 OBT_ind_burden_tt: "§YBlockade Burden§!: how hard a blockade is hitting our economy after reserves, rationing and shipping guarantees are counted.\n§RRises§! with blockades. §GFalls§! with preparations and when the blockade lifts.\n\nThe number in brackets is the change over the last month."
 OBT_ind_chi_ptn_tt: "§YTaipei's Will to Negotiate§! (our estimate of Taiwan's Pressure to Negotiate). Above 70, with a real blockade burden, Taipei may seek staged talks. It can leave them at every stage; it never capitulates automatically.\n\nThe number in brackets is the change over the last month."
 OBT_ind_ptn_tt: "§YPressure to Negotiate§!: how strongly the public wants talks with Beijing.\n§RRises§! under blockade. §GFalls§! with stability, preparations and American support.\nA high value can open staged talks, which we can leave at every stage; it never forces capitulation.\n\nThe number in brackets is the change over the last month."
 OBT_ind_identity_tt: "§YTaiwan-Centered Identity§!: how strongly the public identifies with Taiwan rather than China. Beijing's coercion tends to raise it; reaffirming the status quo and trade talks lower it.\n\nThe number in brackets is the change over the last month."
 OBT_strait_stage_CHI: "Cross-Strait Tension"
 OBT_strait_stage_TAI: "Cross-Strait Tension"
 OBT_CHI_crisis_hotline: "Open the Crisis Hotline"
 OBT_CHI_crisis_hotline_desc: "A direct line between the two capitals lets officials talk before an incident becomes a war."
 OBT_CHI_quiet_channel: "Quiet Channel to Taipei"
 OBT_CHI_quiet_channel_desc: "Intermediaries carry private messages across the Strait without either side losing face."
 OBT_CHI_stern_warning: "Issue a Stern Warning"
 OBT_CHI_stern_warning_desc: "A public warning to the authorities in Taipei. It will please nationalists at home and alarm Washington."
 OBT_CHI_patrol_surge: "Surge Coast Guard Patrols"
 OBT_CHI_patrol_surge_desc: "More ships, closer to Taiwan's waters, more often. It trains our crews and costs us abroad."
 OBT_CHI_economic_incentives: "Offer Economic Incentives"
 OBT_CHI_economic_incentives_desc: "Preferential terms for Taiwanese farmers, firms and investors make the mainland harder to refuse."
 OBT_CHI_prepare_contingency: "Prepare a Taiwan Contingency"
 OBT_CHI_prepare_contingency_desc: "Draw up the political and military case for war. It gives us a war goal; it does not declare war, and every capital will see it."
 OBT_TAI_crisis_hotline: "Use the Crisis Hotline"
 OBT_TAI_crisis_hotline_desc: "Call Beijing directly to stop an incident from escalating. Washington welcomes the restraint."
 OBT_TAI_reaffirm_status_quo: "Reaffirm the Status Quo"
 OBT_TAI_reaffirm_status_quo_desc: "A public statement that Taiwan seeks neither independence nor unification today. It calms the Strait and frustrates our own base."
 OBT_TAI_cross_strait_trade_talks: "Reopen Cross-Strait Trade Talks"
 OBT_TAI_cross_strait_trade_talks_desc: "Talks on trade and investment lower the temperature, at the price of deeper dependence on the mainland."
 OBT_TAI_raise_readiness: "Raise Readiness"
 OBT_TAI_raise_readiness_desc: "Cancel leave, disperse aircraft and man the coastal defenses. Beijing will call it a provocation."
 OBT_TAI_civil_defense_drill: "Nationwide Civil Defense Drill"
 OBT_TAI_civil_defense_drill_desc: "Air-raid sirens, shelters and supply points across the island: a rehearsal for the day we hope never comes."
 OBT_TAI_brief_washington: "Brief Washington"
 OBT_TAI_brief_washington_desc: "Share our intelligence on Beijing's pressure with the United States to strengthen its commitment to deterrence."
 OBT_CHI_crisis_hotline_tt: "§GLowers§! Cross-Strait Tension by §G10§! and raises trust with Taipei."
 OBT_CHI_quiet_channel_tt: "§GLowers§! Cross-Strait Tension by §G5§! and raises trust with Taipei."
 OBT_CHI_stern_warning_tt: "§RRaises§! Cross-Strait Tension by §R6§!. Washington's support for Taiwan grows, and so does Taiwanese identity."
 OBT_CHI_patrol_surge_tt: "§RRaises§! Cross-Strait Tension by §R10§!. Trains our navy, costs money and raises U.S. support for Taiwan."
 OBT_CHI_economic_incentives_tt: "§GLowers§! Cross-Strait Tension by §G6§!. Costs money, builds trust and deepens Taiwan's dependence on the mainland."
 OBT_CHI_prepare_contingency_tt: "Gives a §Ywar goal§! against Taiwan. It does §Rnot§! declare war. Costs stability and raises U.S. support for Taiwan."
 OBT_TAI_crisis_hotline_tt: "§GLowers§! Cross-Strait Tension by §G8§!. Washington's confidence in Taipei rises."
 OBT_TAI_reaffirm_status_quo_tt: "§GLowers§! Cross-Strait Tension by §G5§!. Frustrates the identity-minded base."
 OBT_TAI_cross_strait_trade_talks_tt: "§GLowers§! Cross-Strait Tension by §G6§!. Builds trust, at the price of deeper dependence on the mainland."
 OBT_TAI_raise_readiness_tt: "§RRaises§! Cross-Strait Tension by §R3§!. Costs money; better organization and defense for 120 days."
 OBT_TAI_civil_defense_drill_tt: "§RRaises§! Cross-Strait Tension by §R2§!. Costs money; raises stability, war support and national coordination."
 OBT_TAI_brief_washington_tt: "§RRaises§! Cross-Strait Tension by §R3§!. U.S. support for Taiwan grows."
 obt_strait.1.t: "Tension Rises in the Strait"
 obt_strait.1.d1: "Relations with Taipei have cooled into open friction. Our diplomats and theirs trade sharper words, and the business community is starting to notice."
 obt_strait.1.d2: "Our pressure on Taipei is now unmistakable. Every exercise and every statement is read in Taipei, Tokyo and Washington as coercion."
 obt_strait.1.d3: "The Strait has entered a crisis. Foreign navies are watching, markets are nervous, and the cost to our own economy is rising."
 obt_strait.1.d4: "The Strait stands at the brink. One miscalculation could start a war that no one in Beijing has formally decided to fight."
 obt_strait.1.a: "Press the advantage."
 obt_strait.1.b: "Hold our position."
 obt_strait.1.c: "Signal restraint."
 obt_strait.2.t: "The Strait Cools"
 obt_strait.2.d0: "Cross-Strait relations are calm. Trade flows, tourists cross and the generals on both sides are quiet."
 obt_strait.2.d1: "The worst of the confrontation has passed. Relations remain cool, but the danger of a clash has eased."
 obt_strait.2.d2: "The crisis has eased into steady pressure. We have room to choose our next step."
 obt_strait.2.d3: "We have stepped back from the brink, though the Strait remains in crisis."
 obt_strait.2.a: "Bank the calm."
 obt_strait.2.b: "Remind Taipei of our resolve."
 obt_strait.3.t: "Pressure Across the Strait"
 obt_strait.3.d1: "Beijing's tone has hardened and cross-Strait relations have slipped into friction. The public is uneasy but calm."
 obt_strait.3.d2: "Beijing is now openly coercing us: exercises near our waters, warnings to our partners, pressure on our businesses."
 obt_strait.3.d3: "The Strait is in crisis. Shipping insurers are raising rates, and Washington is asking what we intend to do."
 obt_strait.3.d4: "The Strait stands at the brink. Our forces are on alert, and the world is watching both capitals."
 obt_strait.3.a: "Stand firm."
 obt_strait.3.b: "Call for calm and dialogue."
 obt_strait.3.c: "Consult Washington."
 obt_strait.4.t: "The Strait Eases"
 obt_strait.4.d0: "Relations with the mainland are calm. Ferries run full, investors are confident and the coast guard has a quiet season."
 obt_strait.4.d1: "The confrontation has eased into friction. The pressure has not gone away, but the danger has passed for now."
 obt_strait.4.d2: "Beijing's pressure continues, but the crisis atmosphere has lifted."
 obt_strait.4.d3: "We have stepped back from the brink, though the Strait remains in crisis."
 obt_strait.4.a: "Reopen the channels."
 obt_strait.4.b: "Stay vigilant."
