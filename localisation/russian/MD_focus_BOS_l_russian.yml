 BOS_motor_influence_tt: "Иностранный производитель получит §Rвлияние§! на Боснию в обмен на инвестиции."
 BOS_union_serbia_accept_tt: "Сербия включает в свой состав Боснию и берет под контроль ее вооруженные силы."
 BOS_union_serbia_reject_tt: "Босния сохраняет независимость, а отношения с Сербией ухудшаются."
 BOS_military_supplies_accept_tt: "Одна из стран, отреагировавших на ситуацию, отправила в Боснию пехотное оружие."
 BOS_military_supplies_reject_tt: "Отреагировавшая страна может сохранить свои запасы, что ухудшит отношения с Боснией."
 BOS_turkish_supplies_accept_tt: "Турция отправила в Боснию 2500 единиц пехотного оружия из своих запасов."
 BOS_albanian_supplies_accept_tt: "Албания отправила в Боснию 750 единиц пехотного вооружения из своих запасов."
 BOS_military_supplies_decline_tt: "Босния не получит от нас никакого оборудования и воспримет отказ негативно."
 BOS_civil_war_over: "Гражданская война в Боснии закончилась."
 civil_war_focus: "В гражданской войне"
 BOS_air_chief: "Штаб ВВС Боснии"
 BOS_air_chief_desc: "Объединённый штаб ВВС координирует немногочисленную боевую авиацию Боснии, транспортные вертолёты и потребности в наземной поддержке."
 novica_simic: "Новица Симич"
 novica_simic_desc: "Высокопоставленный боснийский сербский командир сосредоточил свои усилия на территориальной обороне и поддержании боевой готовности."
 cvjetko_savic: "Цвьетко Савич"
 cvjetko_savic_desc: "Офицер, настроенный на реформы и сосредоточенный на восстановлении послевоенной командной структуры Боснии."
 novak_dukic: "Новак Джукич"
 novak_dukic_desc: "Опытный полевой командир, подходящий для проведения специальных операций и работы в труднопроходимой местности."
 miladin_milojcic: "Миладин Милойчич"
 miladin_milojcic_desc: "Офицер штаба, специализирующийся на маневрировании, мобильности и оперативном планировании."
 anto_jelec: "Анто Елеч"
 anto_jelec_desc: "Боснийский хорват, командир с опытом оборонительных операций и организации войск."
 senad_masovic: "Сенад Машович"
 senad_masovic_desc: "Профессиональный офицер, специализирующийся на стандартах подготовки и интеграции в вооруженные силы."
 BOS_operation_althea: "Операция «Алтея»"
 BOS_operation_althea_desc: "Операция «Алтея» — это миссия Европейского союза, сменившая SFOR в 2004 году. Она поддерживает Дейтонское соглашение и передает ответственность за безопасность боснийским институтам."
 BOS_draft_EUFOR: "Проект EUFOR"
 BOS_draft_EUFOR_desc: "Замените истекающий мандат возглавляемой НАТО миссии SFOR миротворческой миссией под руководством ЕС."
 BOS_demand_eufor_withdrawal: "Требовать выхода EUFOR"
 BOS_demand_eufor_withdrawal_desc: "Сократить международное военное присутствие и проверить, сможет ли Босния обеспечить независимую внутреннюю безопасность."
 BOS_SFOR_title: "Силы стабилизации в Боснии и Герцеговине"
 BOS_SFOR_title_desc: "Возглавляемые НАТО Силы стабилизации обеспечивают выполнение военных положений Дейтонского соглашения и поддерживают послевоенную безопасность Боснии. Их мандат может быть продлен во время кризиса или сокращен по мере восстановления национальных институтов."
 BOS_peacekeeper_oversight: "Надзор за миротворцами"
 BOS_peacekeeper_oversight_desc: "Европейские миссии остаются в Боснии, в то время как реформы отстают от потребностей внутренней безопасности."
 BOS_civil_war_operations: "Операции в период Гражданской войны"
 BOS_civil_war_operations_desc: "Необходимо координировать экстренные действия военного времени в зонах конфликта, пока в Боснии продолжается гражданская война."
 BOS_rotating_presidency: "Ротационный президентский пост"
 BOS_rotating_presidency_desc: "Председательство в Боснии поочередно занимают представители боснийцев, хорватов и сербов. Такой порядок ограничивает доминирование одной группы, но частая смена власти может препятствовать принятию законов.\n\nОтношение сербов: [ROOT.BOS_srpska_attitude]\nОтношение боснийцев: [ROOT.BOS_bosniak_attitude]\nОтношение хорватов: [ROOT.BOS_croat_attitude]"
 BOS_more_sfor: "Запросить продление срока SFOR"
 BOS_more_sfor_desc: "Обратитесь к НАТО с просьбой продлить мандат SFOR на период, пока Босния остается политически или экономически нестабильной."
 BOS_lower_sfor: "Запросите сокращение времени SFOR"
 BOS_lower_sfor_desc: "Сократить мандат SFOR, поскольку боснийские институты готовятся взять на себя полную ответственность за безопасность."
 BOS_attack_upon_nato_desc: "Боснийские вооруженные силы находятся в крайне невыгодном оперативном положении по отношению к членам НАТО."
 BOS_sfor_vol_troops: "Обязательства волонтеров SFOR"
 BOS_sfor_vol_troops_desc: "Участники миротворческих операций смогут оперативно перебросить добровольцев в случае возобновления гражданской войны в Боснии."
 BOS_SER_vol_troops: "Обязательство Сербии по добровольцам"
 BOS_SER_vol_troops_desc: "Сербия может оперативно перебросить добровольцев для поддержки Республики Сербской в случае возобновления конфликта в Боснии."
 BOS_idea_muslim_nationalism: "Мобилизованный мусульманский национализм"
 BOS_idea_muslim_nationalism_desc: "Религиозный национализм поддерживает мобилизацию и иностранное вмешательство, одновременно укрепляя режим против политических изменений."
 BOS_idea_srpska_supremacy: "Верховенство Республики Сербской"
 BOS_idea_srpska_supremacy_desc: "Институты Республики Сербской доминируют в государстве и определяют его ресурсную политику, но разделение власти фактически прекратилось."
 BOS_dominant_entity_idea: "Господствующее образование"
 BOS_dominant_entity_idea_desc: "Контроль Республики Сербской над центральным государством стабилизирует правительство и укрепляет его позиции против иностранного политического влияния."
 BOS_workers_front_idea: "Рабочий фронт"
 BOS_workers_front_idea_desc: "Организованное рабочее движение стало независимой политической силой. Его мобилизация укрепляет правительство, одновременно подрывая существующие институты."
 BOS_workers_compact: "Национальный профсоюзный договор"
 BOS_workers_compact_desc: "Государство гарантировало права работников и социальные выплаты в обмен на мирные условия труда и увеличение операционных расходов."
 BOS_worker_managed_economy: "Экономика, управляемая работниками"
 BOS_worker_managed_economy_desc: "Рабочие советы делят полномочия с руководителями предприятий. Эта система увеличивает налоговые поступления, но первоначально нарушает промышленное производство."
 BOS_mechanical_modernization: "Механическая модернизация"
 BOS_mechanical_modernization_desc: "Современное оборудование и техническая подготовка превратили рабочее самоуправление в более производительную промышленную модель."
 BOS_workers_republic_idea: "Рабочая Республика"
 BOS_workers_republic_idea_desc: "Делегаты советов руководят государством и его промышленностью. Устоявшийся социалистический порядок ускоряет строительство и государственное управление."
 BOS_idea_prepping_an_offensive: "Подготовленное наступление"
 BOS_idea_prepping_an_offensive_desc: "Накопленные запасы и подробные штабные планы временно улучшают оперативную готовность."
 BOS_idea_commence_the_offensives: "Наступательный импульс"
 BOS_idea_commence_the_offensives_desc: "Вооружённые силы брошены в скоординированное наступление на всём фронте гражданской войны."
 BOS_idea_rally_the_troops: "Сплоченные войска"
 BOS_idea_rally_the_troops_desc: "Резервные формирования и местные новобранцы обеспечивают общественную поддержку военных усилий."
 BOS_idea_mobilize_the_nation: "Национальная мобилизация"
 BOS_idea_mobilize_the_nation_desc: "Экстренная мобилизация ускоряет военные операции и производство лицензионной пехотной техники."
 BOS_idea_dig_in: "Подготовленные оборонительные меры"
 BOS_idea_dig_in_desc: "Инженерные войска и полевые подразделения оперативно готовят оборонительные позиции."
 BOS_idea_fight_or_perish: "Сражайся или погибни"
 BOS_idea_fight_or_perish_desc: "Правительство задействует дополнительные людские ресурсы, чтобы предотвратить поражение в гражданской войне."
 BOS_idea_national_sentiment: "Военные национальные настроения"
 BOS_idea_national_sentiment_desc: "Государственная пропаганда поддерживает мобилизацию националистов на протяжении всего конфликта."
 BOS_religious_identity_idea: "Религиозная идентичность"
 BOS_religious_identity_idea_desc: "Правительство определяет государственность через исламские институты и религиозно-националистическую программу."
 BOS_low_police_budget: "Низкий бюджет полиции"
 BOS_low_police_budget_desc: "Сокращение финансирования полиции снижает текущие расходы, но ослабляет меры государства по борьбе с организованной преступностью."
 BOS_bosniak_balkan_aspiration_desc: "Боснийские войска мобилизованы для сохранения государства и разгрома сербских и хорватских отколовшихся армий."
 BOS_srpska_balkan_aspiration_desc: "Республика Сербская мобилизована для разгрома центрального правительства Боснии и противостоящих хорватских сил."
 BOS_croat_balkan_aspiration_desc: "Боснийско-хорватские войска мобилизованы для защиты своей территории от боснийских и сербских армий."
 BOS_police_high_desc: "Увеличение финансирования полиции улучшает правоприменение и политический контроль, но сопряжено со значительными финансовыми затратами."
 BOS_air_doctrine_review: "Пересмотр авиационной доктрины"
 BOS_air_doctrine_review_desc: "Временные штабные исследования и учения ускоряют внедрение практической воздушной доктрины."
 BOS_internal_investment_desc: "Внутренние инвестиционные стимулы поддерживают гражданскую промышленность, одновременно сокращая долю продукции, отвлекаемой от продуктивного использования."
 BOS_crime_increase_desc: "Слабое правоприменение позволило организованной преступности расшириться, что привело к росту административных расходов и издержек для потребителей."
 BOS_idea_mechanization_of_the_army: "Механизированная армия"
 BOS_idea_mechanization_of_the_army_desc: "Бронированная техника и мобильное планирование обеспечивают небольшой боснийской армии более широкий оперативный охват при приемлемых затратах на персонал."
 BOS_idea_transportation_methods: "Современный армейский транспорт"
 BOS_idea_transportation_methods_desc: "Стандартные служебные автомобили и транспортные вертолеты снижают стоимость и сложность военной логистики."
 BOS_idea_the_land_fleet: "Интегрированный механизированный парк"
 BOS_idea_the_land_fleet_desc: "Единые семейства транспортных средств позволяют поддерживать сбалансированный состав сил из транспортных машин и бронетранспортёров без чрезмерных затрат на закупку."
 BOS_idea_aerial_dominance: "Воздушное превосходство"
 BOS_idea_aerial_dominance_desc: "Босния инвестирует в повышение боеготовности истребителей, качества пилотов и тесную координацию с сухопутными войсками."
 BOS_idea_air_defence_initiative: "Инициатива противовоздушной обороны"
 BOS_idea_air_defence_initiative_desc: "Наземные системы противовоздушной обороны и наблюдения обеспечивают надежную защиту городам, базам и полевым формированиям."
 BOS_idea_apc_armament: "Бронетранспортеры"
 BOS_idea_apc_armament_desc: "Стандартизированные бронетранспортеры повышают защиту пехоты и мобильность при общевойсковых операциях."
 BOS_idea_main_battle_line: "Современная противотанковая доктрина"
 BOS_idea_main_battle_line_desc: "Мобильные противотанковые силы позволяют Боснии противостоять более тяжёлым формированиям, не содержа дорогостоящий танковый парк."
 BOS_idea_boots_on_the_ground: "Армия, в основе которой лежит пехота"
 BOS_idea_boots_on_the_ground_desc: "Подготовленная пехота и обученные резервисты составляют ядро оборонительных сил, адаптированных к рельефу местности и бюджету Боснии."
 BOS_eu_development_loans: "Кредиты ЕС на развитие"
 BOS_eu_development_loans_desc: "Европейские кредиты финансируют реконструкцию и смягчают потребительскую нагрузку, но условия погашения предусматривают более высокую процентную ставку и делают Боснию более уязвимой для внешнего влияния."
 BOS_election_stimulus: "Расходы в предвыборный год"
 BOS_election_stimulus_desc: "Экстренные расходы, выделяемые в преддверии выборов, стабилизируют семейные бюджеты и повышают доверие населения к правительству."
 BOS_reconstruction_drive: "Национальная кампания по реконструкции"
 BOS_reconstruction_drive_desc: "Скоординированная программа восстановления ускоряет строительство по всей стране и постепенно восстанавливает доверие населения к государству."
 BOS_national_mobilization: "Национальная рамочная программа мобилизации"
 BOS_national_mobilization_desc: "Чётко определённые обязанности резервистов расширяют резерв обученных людских ресурсов, а подготовленные планы обороны означают, что любая оккупированная боснийская территория будет оказывать оккупанту гораздо более ожесточённое сопротивление."
 BOS_idea_detain_ratko_mladic: "Ратко Младич задержан"
 BOS_idea_detain_ratko_mladic_desc: "Сотрудничество с международными организациями, занимающимися вопросами правосудия, повысило доверие Запада к институтам Боснии."
 BOS_idea_civilian_training: "Расширенная подготовка резервистов"
 BOS_idea_civilian_training_desc: "Временная национальная программа подготовки кадров готовит резервистов к мобилизации и территориальной обороне."
 BOS_idea_post_war_clean_up: "Программа послевоенной очистки"
 BOS_idea_post_war_clean_up_desc: "Скоординированные работы по очистке и восстановлению временно ускоряют инвестиции в пострадавшие населенные пункты."
 BOS_pro_bosnia: "Формирование правительства, поддерживаемого боснийцами"
 BOS_pro_bosnia_desc: "Правительство, поддерживаемое боснийцами, руководит государственными учреждениями и снижает расходы на национальное управление."
 BOS_pro_srpska: "Формирование правительства, поддерживаемого сербами"
 BOS_pro_srpska_desc: "Правительство, поддерживаемое сербами, руководит государственными учреждениями и уделяет приоритетное внимание сотрудничеству в сфере безопасности с Республикой Сербской."
 BOS_civil_war_recovery: "Восстановление после Гражданской войны"
 BOS_civil_war_recovery_desc: "Возобновление гражданской войны нанесло ущерб производству, подорвало доверие населения и снизило способность Боснии привлекать партнеров."
 BOS_post_war_efforts: "Усилия по послевоенному восстановлению"
 BOS_post_war_efforts_desc: "Налоговые поступления и меры стимулирования реконструкции способствуют временному всплеску послевоенных инвестиций."
 BOS_milorad_dodik_idea: "Милорад Додик"
 BOS_milorad_dodik_idea_desc: "Политическая сеть Милорада Додика препятствует работе центральных институтов, одновременно укрепляя автономию Республики Сербской."
 BOS_farming_improvements: "Улучшения в сельском хозяйстве"
 BOS_farming_improvements_desc: "Современное оборудование и более безопасные земли повышают урожайность сельскохозяйственных культур и стабильность в сельской местности."
 BOS_farming_powerhouse: "Мощный сельскохозяйственный центр"
 BOS_farming_powerhouse_desc: "В настоящее время продуктивный сельскохозяйственный сектор обеспечивает доходы сельского населения, рост численности населения и налоговую базу."
 BOS_mining_development: "Развитие горнодобывающей промышленности"
 BOS_mining_development_desc: "Модернизированные шахты увеличивают добычу ресурсов и объемы облагаемой налогом местной деятельности."
 BOS_mining_industry: "Горнодобывающая промышленность"
 BOS_mining_industry_desc: "Консолидированные инвестиции позволили создать более крупный и эффективный горнодобывающий сектор."
 BOS_lumber_harvesting_idea: "Заготовка древесины"
 BOS_lumber_harvesting_idea_desc: "Инвестиции в лесное хозяйство и деревообработку расширяют добычу природных ресурсов в сельских районах и увеличивают налогооблагаемую деятельность."
 BOS_dayton_accords_desc: "Дейтонское соглашение сдерживает экспансию и ограничивает военное противостояние с Сербией и Хорватией, в то время как в Боснии сохраняется мир."
 BOS_land_mine_removal_efforts_desc: "Группы по разминированию снижают бремя загрязнения земель для здоровья населения и экономическое бремя, но для реализации этой программы необходимо постоянное финансирование."
 BOS_trade_deal_with_russia: "Торговое соглашение между Сараево и Москвой I"
 BOS_trade_deal_with_russia_desc: "Ограниченное соглашение с Россией способствует инвестициям и снижает потребительские издержки, одновременно усиливая политическое влияние Востока."
 BOS_trade_deal_with_russia_expanded: "Торговое соглашение между Сараево и Москвой II"
 BOS_trade_deal_with_russia_expanded_desc: "Расширение торговли и кредитования с Россией углубляет экономическое сотрудничество и политическую ориентацию Боснии на Восток."
 BOS_trade_deal_with_eu: "Торговое соглашение ЕС I"
 BOS_trade_deal_with_eu_desc: "Ограниченное соглашение с Европейским союзом снижает потребительские издержки и способствует демократической и финансовой интеграции."
 BOS_trade_deal_with_eu_expanded: "Соглашение ЕС о торговле II"
 BOS_trade_deal_with_eu_expanded_desc: "Расширение доступа к европейским рынкам и кредитам укрепляет экономическую ориентацию Боснии на Запад."
 BOS_trade_with_nato: "Пакет помощи НАТО"
 BOS_trade_with_nato_desc: "Партнеры по НАТО предоставляют экономическую помощь, которая снижает непосредственные издержки и способствует политической интеграции с Западом."
 BOS_trade_with_usa: "Совместный торговый договор США с Боснией"
 BOS_trade_with_usa_desc: "Двустороннее соглашение с Соединенными Штатами способствует увеличению объемов производства энергоносителей, расширению доступа потребителей к ним и укреплению политической ориентации на Запад."
 BOS_gov_old_name: "Парламентская ассамблея Боснии"
 BOS_islamic_revolt: "Восстание боснийских моджахедов"
 BOS_islamic_upper: "Боснийский халифат"
 bos_workers_republic: "Рабочая Республика Босния и Герцеговина"
 BOS_events.1.t: "Боснийская гражданская война"
 BOS_events.1.d: "Республика Сербская провозгласила независимость, и в Боснии возобновилась гражданская война. Центральное правительство должно разгромить отколовшиеся силы, иначе страна рискует быть окончательно разделена."
 BOS_events.1.a: "Защитим Боснию и Герцеговину"
 BOS_events.1.b: "Поддержите Республику Сербскую"
 BOS_events.2.t: "Хорваты провозгласили независимость"
 BOS_events.2.d: "Боснийско-хорватские лидеры в Герцеговине провозгласили независимость, в то время как страна уже разделена войной. Центральное правительство должно восстановить контроль на юге, не отказываясь от фронта против Республики Сербской."
 BOS_events.2.a: "Восстановить территориальную целостность страны."
 BOS_events.2.b: "Встаньте на сторону хорватских сепаратистов."
 BOS_events.4.t: "Конец войны"
 BOS_events.4.d: "Правительство восстановило контроль над Боснией и Герцеговиной, положив конец возобновившейся гражданской войне. Теперь можно начинать демобилизацию, восстановление и политическое примирение."
 BOS_events.4.a: "Полная реинтеграция"
 BOS_events.4.b: "Автономия, достигнутая путем переговоров"
 BOS_events.4.c: "Передать надзор международной администрации."
 BOS_events.59.t: "Противостояние перерастает в войну"
 BOS_events.59.d: "Сепаратистский кризис затянулся без урегулирования. Республика Сербская провозгласила полную независимость, и страна снова находится в состоянии войны."
 BOS_events.59.a: "Удержать страну от распада силой"
 BOS_events.60.t: "Герцеговина отделяется"
 BOS_events.60.d: "Поскольку соглашение не было достигнуто, хорватские лидеры в Герцеговине провозгласили независимость и взяли в руки оружие против Сараево."
 BOS_events.60.a: "Восстановить контроль на юге"
 BOS_events.11.t: "Прибыло иностранное оружие"
 BOS_events.11.d: "Региональный партнер поставил нашим войскам пехотное вооружение. Эта поставка усилит линию фронта и укрепит отношения в тылу."
 BOS_events.11.a: "Распределить оружие"
 BOS_events.12.t: "Фермерская забастовка"
 BOS_events.12.d: "Фермеры, столкнувшиеся с низкими ценами, небезопасными землями и слабой государственной поддержкой, начали общенациональную забастовку. Их организаторы требуют инвестиций в сельское хозяйство и изменения экономической политики."
 BOS_events.12.a: "Принять смену правительства"
 BOS_events.12.b: "Вести переговоры с фермерами."
 BOS_events.13.t: "Соглашение с бастующими"
 BOS_events.13.d: "Правительство и лидеры забастовки пришли к соглашению, охватывающему заработную плату, защиту прав работников и будущие переговоры. Соглашение прекращает текущие протесты, но обязывает государство к новым обязательствам."
 BOS_events.13.a: "Соблюдайте соглашение"
 BOS_events.14.t: "Забастовка шахтеров"
 BOS_events.14.d: "Шахтеры остановили производство, требуя более безопасных условий труда, стабильной заработной платы и сокращения рабочих смен. Забастовка распространяется на населенные пункты, зависящие от этой отрасли."
 BOS_events.14.a: "Принять смену правительства"
 BOS_events.14.b: "Вести переговоры с шахтерами."
 BOS_events.9.t: "Босния запрашивает поставки оружия"
 BOS_events.9.d: "[FROM.GetName] запросил пехотное вооружение для своей гражданской войны. Помощь расширит наше влияние на Балканах, но оборудование должно поступать из наших собственных резервов."
 BOS_events.9.a: "Отправьте оружие"
 BOS_events.9.b: "Сохраним наши запасы"
 BOS_events.34.t: "Босния стремится стать членом ОДКБ"
 BOS_events.34.d: "[FROM.GetName] подал заявку на вступление в ОДКБ. Членство расширило бы действие альянса на Западные Балканы, но также могло бы перенести туда неразрешенные споры Боснии."
 BOS_events.34.a: "Принять Боснию"
 BOS_events.34.b: "Отклонить заявку"
 BOS_events.35.t: "Членство в ОДКБ одобрено"
 BOS_events.35.d: "Россия одобрила нашу заявку. Теперь Босния разделяет обязательства ОДКБ по коллективной обороне."
 BOS_events.35.a: "Примите на себя обязательства"
 BOS_events.36.t: "Членство в ОДКБ отклонено"
 BOS_events.36.d: "Россия отклонила наше предложение и отказалась распространить действие альянса на Балканы."
 BOS_events.36.a: "Пересмотреть нашу политику в отношении Востока."
 BOS_events.15.t: "Предложение Боснии о сотрудничестве в сфере вооружений"
 BOS_events.15.d: "[FROM.GetName] предложил соглашение об оборонно-промышленном сотрудничестве, запросив лицензии на производство сербских самолетов и винтовок. Более тесные военные связи свяжут Сараево с Белградом, хотя некоторые в Боснии будут недовольны такой зависимостью."
 BOS_events.15.a: "Выдать лицензии на производство"
 BOS_events.15.b: "Отклонить запрос"
 BOS_events.16.t: "Белград выдаёт лицензии на производство оружия"
 BOS_events.16.d: "Сербия одобрила передачу лицензий на производство. Теперь боснийские заводы могут выпускать продукцию сербской разработки, хотя просербские настроения среди боснийских общин вызвали волнения."
 BOS_events.16.a: "Начать лицензионное производство"
 BOS_events.17.t: "Белград отказывается"
 BOS_events.17.d: "Сербия отклонила предложение о сотрудничестве в сфере вооружений, не желая делиться своей оборонной промышленностью на таких условиях."
 BOS_events.17.a: "Поищите в другом месте."
 BOS_events.18.t: "Приглашение к инвестициям в Боснию"
 BOS_events.18.d: "[FROM.GetName] приглашает иностранных автопроизводителей разместить производство в стране. Строительство завода откроет новый рынок и расширит наше коммерческое влияние на экономику Боснии."
 BOS_events.18.a: "Построить завод в Боснии"
 BOS_events.18.b: "Отклонить приглашение"
 BOS_events.19.t: "Иностранный автопроизводитель инвестирует"
 BOS_events.19.d: "[FROM.GetName] даёт согласие построить завод в Боснии. Инвестиции создадут рабочие места и приведут к притоку капитала, хотя правительство страны-производителя получит плацдарм в нашей промышленной политике."
 BOS_events.19.a: "Приветствуем инвестиции!"
 BOS_events.20.t: "В инвестициях отказано"
 BOS_events.20.d: "[FROM.GetName] пока отказался от инвестиций в автомобильную промышленность Боснии."
 BOS_events.20.a: "Обратитесь к другому производителю."
 BOS_events.21.t: "Босния стремится закупить винтовки"
 BOS_events.21.d: "[FROM.GetName] желает приобрести партию современного немецкого пехотного оружия. Продажа принесёт твёрдую валюту и расположение Сараево."
 BOS_events.21.a: "Одобрить продажу"
 BOS_events.21.b: "Отказаться от продажи"
 BOS_events.22.t: "Немецкие винтовки доставлены"
 BOS_events.22.d: "Германия одобрила продажу. Партия современного пехотного оружия уже направляется на наши склады."
 BOS_events.22.a: "Распределить оружие"
 BOS_events.23.t: "Германия отклонила продажу"
 BOS_events.23.d: "Берлин в настоящее время отказался продавать Боснии пехотное оружие."
 BOS_events.23.a: "Найдите другого поставщика"
 BOS_events.24.t: "Босния хочет закупить российские винтовки"
 BOS_events.24.d: "[FROM.GetName] желает приобрести крупную партию российского пехотного оружия. Этот заказ станет выгодной сделкой для российской промышленности."
 BOS_events.24.a: "Одобрить продажу"
 BOS_events.24.b: "Отказаться от продажи"
 BOS_events.25.t: "Российские винтовки доставлены"
 BOS_events.25.d: "Россия одобрила продажу. Крупная партия пехотного оружия уже в пути на наши склады."
 BOS_events.25.a: "Распределить оружие"
 BOS_events.26.t: "Россия отклонила продажу"
 BOS_events.26.d: "Москва в настоящее время отказалась продавать Боснии пехотное оружие."
 BOS_events.26.a: "Найдите другого поставщика"
 BOS_political.4.t: "Послевоенные выборы в Боснии"
 BOS_political.4.d: "Первые национальные выборы в Боснии и Герцеговине в новом столетии определят, какая коалиция возглавит хрупкие послевоенные институты страны."
 BOS_political.4.a: "Сохраним правительство под руководством боснийцев."
 BOS_political.4.a_tt: "§YПартия демократического действия§! возглавит правительство. Следующая президентская ротация перейдёт к представителю сербов."
 BOS_political.4.b: "Поддержите коалицию во главе с сербами."
 BOS_political.4.b_tt: "§YАльянс независимых социал-демократов§! возглавит коалицию с §YСербской демократической партией§!. Следующая президентская ротация перейдёт к представителю хорватов."
 BOS_political.20.t: "Урегулирование после гражданской войны"
 BOS_political.20.d: "Война окончена. Босния и Герцеговина вновь объединена под единым управлением, и первоочередная задача — стабилизация государства и ликвидация бывших фракций."
 BOS_political.20.a: "Создать Великую Республику Сербскую"
 BOS_political.20.b: "Создать правительство под руководством хорватов."
 BOS_political.20.c: "Воссоединение Боснии под контролем Сараево"
 BOS_political.1.t: "Послевоенное государство"
 BOS_political.1.d: "Босния и Герцеговина вступает в новое столетие с подорванными институтами, раздробленной властью и незавершенным процессом восстановления. Правительству предстоит решить, какая часть власти должна остаться за субъектами."
 BOS_political.1.a: "Задать облик нового государства"
 BOS_political.2.t: "Расширенная автономия образований"
 BOS_political.2.d: "Правительство передало дополнительные внутренние полномочия Герцеговине и Республике Сербской, сохранив при этом единую внешнюю и оборонную политику. Босния теперь функционирует как более свободная федерация."
 BOS_political.2.a: "Реализовать соглашение"
 BOS_political.3.t: "Федеральное воссоединение"
 BOS_political.3.d: "Расширение автономии привело к дублированию юрисдикций в смешанных сообществах и ослаблению общих служб. Руководители образований согласились на воссоединение в рамках федерального соглашения, которое сохраняет местное представительство."
 BOS_political.3.a: "Воссоединить федерацию"
 BOS_political.5.t: "Финансовый кризис"
 BOS_political.5.d: "Глобальный финансовый кризис привел к сокращению экспорта, ужесточению кредитной политики и подтолкнул боснийских работодателей к увольнениям. Для восстановления потребуется скоординированная фискальная и промышленная политика."
 BOS_political.5.a: "Разработать программу восстановления"
 BOS_political.6.t: "Милорад Додик"
 BOS_political.6.d: "Милорад Додик укрепил свои позиции в Республике Сербской и сделал автономию субъектов центральным элементом своей политической программы. Его растущая сеть контактов осложнит любые попытки укрепить национальные институты."
 BOS_political.6.a: "Сараево должно ответить"
 BOS_political.8.t: "Спор о сегрегации перерос в насилие"
 BOS_political.8.d: "Конфликт по поводу интеграции сербских и боснийских школьников перерос в марш к зданию муниципального собрания. Акты вандализма и нападения на предприятия, принадлежащие вернувшимся беженцам, вынудили полицию вмешаться."
 BOS_political.8.a: "Разногласия остаются глубокими."
 BOS_political.9.t: "Миротворцы планируют сокращение численности войск"
 BOS_political.9.d: "НАТО объявило о сокращении своего миротворческого присутствия в Боснии в связи с улучшением ситуации с безопасностью. Местные лидеры расходятся во мнениях относительно готовности национальных сил принять на себя эту миссию."
 BOS_political.9.a: "Оцените нашу готовность."
 BOS_political.10.t: "Доклад фиксирует нападения на прессу"
 BOS_political.10.d: "В новом докладе зафиксирован рост угроз и нападений на боснийских журналистов в 2002 году. В значительной степени в запугивании обвиняются националистические организации и местные политические покровители."
 BOS_political.10.a: "Защитить независимую журналистику"
 BOS_political.11.t: "Николич приговорён к 23 годам лишения свободы"
 BOS_political.11.d: "Суд приговорил боснийского сербского офицера Драгана Николича к 23 годам тюремного заключения за преступления, совершенные в лагере для интернированных Сушица. Приговор возобновил политические споры по поводу ответственности за преступления, совершенные во время войны."
 BOS_political.11.a: "Справедливость должна восторжествовать."
 BOS_political.13.t: "Возвращение беженцев достигло новых высот"
 BOS_political.13.d: "По мере улучшения ситуации с безопасностью и восстановления жилья все больше перемещенных лиц возвращаются на родину. Местные власти должны предоставлять услуги и защищать возвращающихся в населенных пунктах, где сохраняется напряженность военного времени."
 BOS_political.13.a: "Поддержите их возвращение"
 BOS_political.14.t: "Сильные холода обрушились на беженцев и вернувшихся"
 BOS_political.14.d: "Сильные морозы обрушились на общины беженцев и возвращающихся жителей Боснии и Герцеговины. Местные организации и Организация Объединенных Наций испытывают трудности с обеспечением населения топливом для отопления, жильем и продовольствием."
 BOS_political.14.a: "Мобилизация экстренной помощи"
 BOS_political.15.t: "Взрыв повредил могилу Алии Изетбеговича"
 BOS_political.15.d: "В Сараево взрывное устройство повредило могилу бывшего президента Алии Изетбеговича. Нападение вызвало общественное возмущение и возобновило опасения по поводу политически мотивированного насилия."
 BOS_political.15.a: "Расследуйте нападение."
 BOS_political.17.t: "Наводнения в Юго-Восточной Европе"
 BOS_political.17.d: "Рекордные осадки привели к затоплению городов, повреждению инфраструктуры и оползням по всей Боснии и в соседних государствах. Службам экстренной помощи предстоит длительная работа по оказанию помощи и восстановлению."
 BOS_political.17.a: "Координировать оказание помощи при стихийных бедствиях"
 BOS_events.55.t: "Умер Алия Изетбегович"
 BOS_events.55.d: "Бывший президент Алия Изетбегович скончался от осложнений сердечного заболевания. Его смерть завершает важную главу в боснийской политике и борьбе Боснии и Герцеговины за независимость."
 BOS_events.55.a: "Почтите его наследие."
 BOS_events.55.b: "Государство должно двигаться вперед."
 BOS_political.21.t: "Босния просит гарантий"
 BOS_political.21.d: "[FROM.GetName] обратился к нам с просьбой гарантировать его независимость в связи с передачей EUFOR ответственности за обеспечение безопасности боснийским институтам."
 BOS_political.21.a: "Дать гарантии Боснии"
 BOS_political.21.b: "Отказаться от обязательств"
 BOS_political.22.t: "Босния предлагает объединиться"
 BOS_political.22.d: "Возглавляемое Республикой Сербской правительство в [FROM.GetName] предложило войти в состав Сербии. Принятие этого предложения означало бы передачу территории и вооружённых сил Боснии нашему государству."
 BOS_political.22.a: "Одобрить объединение"
 BOS_political.22.b: "Сохранить отдельные государства"
 BOS_zivko_radisic: "Живко Радишич"
 BOS_ante_jelavic: "Анте Елавич"
 BOS_halid_genjac: "Халид Генджак"
 BOS_sulejman_tihic: "Сулейман Тихич"
 BOS_mirko_sarovic: "Мирко Шарович"
 BOS_dragan_covic: "Драган Чович"
 BOS_haris_silajdzic: "Харис Силайджич"
 BOS_nebojsa_radmanovic: "Небойша Радманович"
 BOS_zeljko_komsic: "Желько Комшич"
 BOS_bosnia_random: "Новый представитель боснийцев займет пост председателя на ротационной основе."
 BOS_serb_random: "Новый представитель сербов займёт пост председателя на ротационной основе."
 BOS_croat_random: "Новый представитель хорватов займёт пост председателя на ротационной основе."
 BOS_events.45.a: "Начать переговоры"
 BOS_events.45.d: "Государственные служащие присоединились к трудовым протестам и потребовали стабильной заработной платы, коллективных переговоров и прекращения назначений по протекции."
 BOS_events.45.t: "Забастовка в государственном секторе"
 BOS_events.46.a: "Движение распространяется"
 BOS_events.46.d: "Демонстрации распространились с рабочих мест на центры городов: профсоюзы координируют свои требования поверх границ между образованиями."
 BOS_events.46.t: "Общенациональные протесты трудящихся"
 BOS_events.47.a: "Защита государственных учреждений"
 BOS_events.47.d: "Конфликт у здания правительства перерос в насилие. Лидеры профсоюзов обвиняют провокаторов, а сотрудники служб безопасности требуют предоставления чрезвычайных полномочий."
 BOS_events.47.t: "Протесты перерастают в насилие"
 BOS_events.48.a: "Признать новое правительство"
 BOS_events.48.d: "Старая коалиция утратила контроль над парламентом. Теперь поддерживаемый рабочими кабинет министров претендует на полномочия по реорганизации государства и экономики."
 BOS_events.48.t: "Рабочие приходят в правительство"
 BOS_eu_accession: "Вступление в Европейский Союз"
 BOS_eu_accession_desc: "Для вступления необходимо закрывать переговорные главы одну за другой. Каждый шаг требует согласия всех трёх государствообразующих групп, и Республика Сербская может затормозить процесс, если её руководство проявит враждебность."
 BOS_eu_judicial_reform: "Закрыть главу о судебной системе"
 BOS_eu_judicial_reform_desc: "Привести судебную процедуру, апелляционный пересмотр и независимость прокуратуры в соответствие со стандартами, установленными при вступлении в ЕС."
 BOS_eu_anti_corruption_commitments: "Принять на себя обязательства по борьбе с коррупцией"
 BOS_eu_anti_corruption_commitments_desc: "Необходимо придерживаться контролируемых ЕС стандартов по борьбе с коррупцией. Брюссель не откроет эту главу, пока сохраняется серьезная проблема захвата государства."
 BOS_eu_market_alignment: "Приблизиться к Единому рынку"
 BOS_eu_market_alignment_desc: "Внедрить стандарты ЕС в отношении продукции, таможенные процедуры и правила конкуренции. Соблюдение этих стандартов обходится дорого, но открывает доступ к финансированию, выделяемому на подготовку к вступлению в ЕС."
 BOS_eu_candidate_status: "Получение статуса кандидата"
 BOS_eu_candidate_status_desc: "Обращение в Европейский совет с просьбой признать Боснию и Герцеговину официальным кандидатом на членство."
 BOS_eu_open_negotiations: "Открыть переговоры о вступлении"
 BOS_eu_open_negotiations_desc: "Начать официальные переговоры о членстве с Европейской комиссией. Ожидать сопротивления со стороны Баня-Луки по мере расширения обязательств на государственном уровне."
 BOS_eu_sign_accession_treaty: "Подпишите Договор о присоединении"
 BOS_eu_sign_accession_treaty_desc: "Завершить переговоры и подписать договор о вступлении. Для получения членства по-прежнему требуется официальная заявка в Европейский Союз."
 BOS_treasury_5_tt: "Казначейство располагает как минимум £treasury 5.0"
 BOS_treasury_2_tt: "Казначейство располагает как минимум £treasury 2.0"
 BOS_judiciary_meets_eu_standards_tt: "Судебная система соответствует критериям для вступления в ЕС."
 BOS_anti_corruption_framework_tt: "Действует контролируемая ЕС система борьбы с коррупцией."
 BOS_market_aligned_with_eu_tt: "Внутреннее регулирование соответствует единому рынку."
 BOS_recognized_eu_candidate_tt: "Босния и Герцеговина признана кандидатом на членство в ЕС."
 BOS_eu_application_open_tt: "Босния и Герцеговина теперь может подать заявку на членство в Европейском союзе."
 BOS_economic_development: "Экономическое развитие"
 BOS_economic_development_desc: "Иностранные инвестиции, приватизация и программы восстановления послевоенной экономики.\n Сети патронажа на уровне организаций контролируют назначения, контракты и значительную часть экономики. Их демонтаж происходит медленно и вызывает недовольство групп, получающих от них прибыль."
 BOS_court_turkish_investment: "Привлечь турецкие инвестиции"
 BOS_court_turkish_investment_desc: "Откройте двери для турецких строительных фирм и банков. Деньги Анкары хлынут внутрь, а вместе с ними и турецкое влияние в Сараево."
 BOS_court_gulf_investment: "Привлечь инвестиции из Залива"
 BOS_court_gulf_investment_desc: "Привлечение фондов стран Персидского залива в недвижимость, туризм и финансы. Это пополнит казну, стабилизирует обстановку и укрепит позиции Эр-Рияда в Боснии."
 BOS_rapid_privatization: "Быстрая приватизация"
 BOS_rapid_privatization_desc: "Продавайте государственные предприятия как можно быстрее тем, кто готов их купить. Эти продажи пополняют казну и увеличивают объём производства, но такие сделки подпитывают коррупцию и дестабилизируют рынок труда."
 BOS_transparent_privatization: "Прозрачная приватизация"
 BOS_transparent_privatization_desc: "Продажа государственных предприятий через проверенные, открытые тендеры. Выручка меньше, а процесс медленнее, но коррупция падает, и доверие общественности сохраняется."
 BOS_thermal_plant_chinese_financing: "Тепловая электростанция, финансируемая Китаем"
 BOS_thermal_plant_chinese_financing_desc: "Взять китайский кредит на расширение электростанции, работающей на буром угле. Производство сразу же увеличивается, но вместе с этим приходят долг и влияние Пекина."
 BOS_hydro_refurbishment: "Модернизировать гидроэлектростанции"
 BOS_hydro_refurbishment_desc: "Необходимо модернизировать устаревшие плотины и турбины на реках Неретва и Дрина. Первоначальные затраты реальны, но надежное электроснабжение стабилизирует отрасль."
 BOS_end_brcko_supervision: "Прекратить надзор над Брчко"
 BOS_end_brcko_supervision_desc: "Свернуть международный надзорный режим над районом Брчко и полностью передать его местным учреждениям. Республика Сербская немедленно проверит новую систему на практике."
 BOS_police_restructuring: "Реорганизовать полицию"
 BOS_police_restructuring_desc: "Объединение разрозненной полиции в рамках государственного аппарата является предварительным условием ЕС для более тесных связей. Республика Сербская возмущена потерей контроля."
 BOS_anti_corruption_investigations: "Антикоррупционные расследования"
 BOS_anti_corruption_investigations_desc: "Направьте государственных прокуроров против укоренившихся сетей патронажа. Коррупция снизится, но государствообразующая группа, чьи чиновники будут привлечены к ответственности, станет проявлять недовольство."
 BOS_judicial_appointments: "Деполитизировать назначения судей"
 BOS_judicial_appointments_desc: "Передайте контроль над назначением судей от партийного руководства независимому совету."
 BOS_depoliticized_judiciary_tt: "Назначение судей не зависит от партийного контроля."
 BOS_public_procurement_reform: "Реформа государственных закупок"
 BOS_public_procurement_reform_desc: "Ввести открытые тендеры на государственные контракты. Открытие отчётности требует первоначальных затрат и разрушает ряд удобных договорённостей."
 BOS_transparent_procurement_tt: "Государственные контракты заключаются посредством открытых тендеров."
 BOS_diaspora_investment_drive: "Инвестиционная кампания диаспоры"
 BOS_diaspora_investment_drive_desc: "Пригласить бизнес-ассоциации диаспоры к софинансированию государственных проектов и разместить разовый выпуск облигаций среди вкладчиков-эмигрантов."
 BOS_dual_citizenship_outreach: "Информационно-просветительская работа по вопросам двойного гражданства"
 BOS_dual_citizenship_outreach_desc: "Упростите процедуры получения двойного гражданства и консульскую регистрацию, чтобы эмигранты сохраняли формальные связи со страной. Большая зарегистрированная диаспора будет отправлять больше денег домой."
 BOS_expanded_dual_citizenship_tt: "Доходы от денежных переводов диаспоры вырастут на 20%"
 BOS_diaspora_return_program: "Программа возвращения диаспоры"
 BOS_diaspora_return_program_desc: "Финансирование грантов на переселение и трудоустройство семей, возвращающихся из-за границы. Это дорого, но стране люди нужны больше, чем деньги."
 BOS_treasury_1_tt: "Казначейство располагает как минимум £treasury 1.0"
 BOS_dayton_pressure: "Дейтон под давлением"
 BOS_dayton_pressure_desc: "Республика Сербская бросает вызов государственным институтам и угрожает отделением. Сараево может уступить автономию, обратиться к Высокому представителю с просьбой навязать соглашение или добиваться международного арбитража."
 BOS_concede_to_srpska_demands: "Уступить требованиям образования"
 BOS_concede_to_srpska_demands_desc: "Верните оспариваемые полномочия Республике Сербской. Кризис закончится ценой потери центральной власти."
 BOS_invoke_bonn_powers: "Применить Боннские полномочия"
 BOS_invoke_bonn_powers_desc: "Обратитесь к Высокому представителю с просьбой ввести спорный закон своим решением и отстранить препятствующих должностных лиц. Эффективно, но вызовет глубокое недовольство в Баня-Луке."
 BOS_request_international_arbitration: "Запрос на международный арбитраж"
 BOS_request_international_arbitration_desc: "Передайте спор на рассмотрение международному арбитражу. Это медленный и дорогостоящий процесс, но он положит конец противостоянию, не принося выгоды ни одной из сторон."
 BOS_phase_out_ohr_supervision: "Свернуть надзор Высокого представителя"
 BOS_phase_out_ohr_supervision_desc: "При стабильных отношениях между образованиями провести переговоры о передаче оставшихся полномочий Высокого представителя национальным институтам."
 BOS_dayton_pressure_decisions_available_tt: "Меры реагирования на кризис доступны в решениях категории «Дейтон под давлением»"
 BOS_eu_candidate: "Кандидат на членство в ЕС"
 BOS_eu_candidate_desc: "Статус кандидата предоставляет Боснии и Герцеговине официальный путь к членству, регулярную отчетность о ходе работы и упрощение отношений с государствами-членами."
 BOS_eu_negotiations: "Переговоры о вступлении в ЕС"
 BOS_eu_negotiations_desc: "Переговорные главы открыты, и техническая помощь ЕС поступает в государственные учреждения, что ускоряет административную и инфраструктурную работу."
 BOS_eu_accession_treaty: "Договор о вступлении в ЕС подписан"
 BOS_eu_accession_treaty_desc: "Договор о присоединении подписан, и идет процесс ратификации. Рынки рассматривают членство как устоявшееся, а государственный аппарат работает в соответствии с четкими указаниями."
 BOS_eu_accession_funds: "Предвступительная помощь"
 BOS_eu_accession_funds_desc: "Фонды Инструмента содействия вступлению в ЕС финансируют инфраструктуру, административный потенциал и позволяют получать более дешевые государственные заимствования."
 BOS_republika_srpska_secession_crisis: "Кризис отделения"
 BOS_republika_srpska_secession_crisis_desc: "Республика Сербская бойкотирует государственные учреждения и готовит законопроекты для референдума. Иностранные покровители выжидают подходящего момента, пока продолжается противостояние."
 BOS_ohr_supervision: "Надзор Высокого представителя"
 BOS_ohr_supervision_desc: "Высокий представитель напрямую применяет Боннские полномочия. Навязанные решения обеспечивают функционирование государства, но отодвигают на второй план выборные институты."
 BOS_national_reconciliation: "Национальное примирение"
 BOS_national_reconciliation_desc: "Все три государствообразующие группы поддерживают общегосударственное правительство. Сотрудничество между образованиями стало обыденностью, а не исключением."
 BOS_political.24.t: "Статус кандидата присвоен"
 BOS_political.24.d: "Европейский совет официально признал Боснию и Герцеговину кандидатом на членство. Это решение является наградой за многолетние реформы и обязывает Брюссель ежегодно отчитываться о достигнутом прогрессе."
 BOS_political.24.a: "Европейское будущее"
 BOS_political.25.t: "Баня-Лука блокирует переговоры"
 BOS_political.25.d: "Делегаты от Республики Сербской покинули зал заседаний государственного парламента, отказавшись ратифицировать рамочное соглашение о переговорах, если компетенции субъектов не будут гарантированы в письменной форме."
 BOS_political.25.a: "Договориться об их возвращении"
 BOS_political.25.b: "Ратифицировать без них"
 BOS_political.26.t: "Раскрылся скандал в сфере закупок"
 BOS_political.26.d: "Журналисты опубликовали контракты, связывающие высокопоставленных чиновников образований с фальсифицированными государственными тендерами. Эта сеть охватывает министерства, государственные предприятия и, по меньшей мере, одну правящую партию."
 BOS_political.26.a: "Преследовать сеть в судебном порядке"
 BOS_political.26.b: "Забудьте эту историю"
 BOS_political.27.t: "Республика Сербская угрожает отделением"
 BOS_political.27.d: "В законодательном собрании Баня-Луки назначено голосование по вопросу выхода из государственных институтов, и его руководство открыто обсуждает референдум о независимости."
 BOS_political.27.a: "Государство должно отреагировать."
 BOS_political.28.t: "Противостояние обостряется"
 BOS_political.28.d: "Прошло несколько месяцев бойкота без достижения соглашения. Институты образований теперь действуют так, будто государственная власть необязательна, а умеренные силы со всех сторон потеряли позиции."
 BOS_political.28.a: "Опасный прецедент"
 BOS_diaspora_remittances: "Денежные переводы диаспоры"
 BOS_diaspora_remittances_desc: "Деньги, отправляемые домой боснийцами, работающими за границей, составляют примерно десятую часть ВВП. Они поступают в домохозяйства во всех частях страны, в том числе туда, куда государственный бюджет не доходит никогда."
 BOS_diaspora_returnees: "Возвращающаяся диаспора"
 BOS_diaspora_returnees_desc: "Гранты на переселение помогают семьям вернуться из Германии, Австрии и Скандинавии. Они приезжают со сбережениями, навыками и детьми."
 BOS_nato_interoperability: "Совместимость с НАТО"
 BOS_nato_interoperability_desc: "Совместные учения, стандарты альянсов и программы «Партнерство ради мира» восстанавливают вооруженные силы по западному образцу."
 BOS_political.29.t: "Деньги диаспоры возвращаются домой"
 BOS_political.29.d: "Инвестиционная кампания завершилась получением обязательств от владельцев бизнеса из диаспоры в Европе и Северной Америке. Суммы скромны по международным меркам, но они поступают в муниципалитеты, которые иностранные инвесторы игнорируют."
 BOS_political.29.a: "Приветствуем новости!"
 BOS_political.30.t: "Караджич под стражей"
 BOS_political.30.d: "Новости из Белграда в течение часа распространились по Сараево. Радован Караджич, военный лидер боснийских сербов, арестован и ему грозит перевод в Гаагу. Ассоциации выживших и семьи жертв проводят тихие бдения от Сараево до Сребреницы. В Баня-Луке царит более мрачная атмосфера."
 BOS_political.30.a: "Опоздали на тринадцать лет"
 BOS_political.31.t: "Младич под стражей"
 BOS_political.31.d: "Ратко Младич, командующий армией, совершившей резню в Сребренице, был арестован на ферме на севере Сербии. Для матерей жертв Сребреницы арест положил конец шестнадцатилетнему ожиданию. По другую сторону линии разграничения между образованиями некоторые до сих пор называют его защитником."
 BOS_political.31.a: "Справедливость восторжествовала в Лазарево"
 BOS_political.32.t: "Решение по делу Сейдича-Финчи"
 BOS_political.32.d: "Европейский суд по правам человека постановил, что конституционные правила этнической принадлежности нарушают Европейскую конвенцию. Дерво Сейдич и Якоб Финчи, активист из числа рома и лидер еврейской общины, не могут баллотироваться в Президиум, поскольку не принадлежат ни к одному из трёх государствообразующих народов. Хорватские партии добавляют, что нынешнее устройство позволяет другим избирать за них их члена Президиума. Для реализации этого решения необходимы конституционные изменения, которые никто не горит желанием обсуждать."
 BOS_political.32.a: "Изменить Дейтонское соглашение — легче сказать, чем сделать"
 BOS_sejdic_finci_ruling_tt: "§YСтрасбург вынес решение против конституционных правил этнической принадлежности. Судебная реформа, учитывающая это решение, будет иметь дополнительный вес в Брюсселе.§!"
 BOS_sejdic_finci_addressed_tt: "§GРеформа направлена на устранение последствий решения по делу Сейдича-Финчи и удовлетворяет давнее требование Брюсселя.§!"
 BOS_serbia_reaction_tt: "Сербия примет решение о том, поддерживать ли Республику Сербскую."
 BOS_croatia_reaction_tt: "Хорватия решит, поддерживать ли Герцег-Боснию."
 BOS_political.33.t: "EUFOR берёт на себя миссию"
 BOS_political.33.d: "На церемонии в лагере Бутмир возглавляемые НАТО Силы стабилизации официально передали свою миссию Европейскому союзу. Операция «Алтея» наследует войска, базы и мандат Сил стабилизации в рамках соглашения «Берлин плюс». Для большинства боснийцев единственное видимое изменение — это флаг на рукаве."
 BOS_political.33.a: "В Бутмире меняют флаги"
 BOS_political.34.t: "Первая перепись населения после войны"
 BOS_political.34.d: "Переписчики начали первую перепись населения с 1991 года. Каждый вопрос, касающийся этнической принадлежности, языка и вероисповедания, является предметом споров, и Республика Сербская уже заявила, что не примет методику подсчета граждан, проживающих за границей. За этими анкетами скрывается вопрос, который никто не задает вслух: кто еще здесь остался?"
 BOS_political.34.a: "Подсчитайте, что осталось"
 BOS_political.35.t: "Тузла горит"
 BOS_political.35.d: "Протесты, начавшиеся у обанкротившихся заводов в Тузле, распространились на Сараево, Зеницу и Мостар. Правительственные здания горят, а толпы скандируют не этнические лозунги, а требуют рабочих мест и привлечения к ответственности за мошенничество при приватизации. Формируются гражданские пленумы, чтобы напрямую донести свои требования до кантональных правительств."
 BOS_political.35.a: "Удовлетворить требования пленумов"
 BOS_political.35.b: "Сначала восстановите порядок."
 BOS_political.36.t: "Заявка подана в Брюсселе"
 BOS_political.36.d: "Председатель Совета министров передал заявку Боснии на членство в Европейском союзе в голландское председательство в Совете. До получения статуса кандидата еще предстоят годы адаптации, но, по крайней мере на бумаге, заявка обязывает все уровни власти двигаться в одном направлении."
 BOS_political.36.a: "Путь будет долгим."
 BOS_political.37.t: "Высокий представитель запретил отрицание геноцида"
 BOS_political.37.d: "Одним из своих последних действий на посту уходящий Высокий представитель ввёл уголовные наказания за отрицание геноцида в Сребренице и прославление военных преступников. В Баня-Луке вспыхнули беспорядки. Лидеры образования объявили решение недействительным, объявили бойкот государственных учреждений и открыто заявили о намерении вернуть то, что Дейтон отдал."
 BOS_political.37.a: "Закон распространяется на всех."
 BOS_political.37.b: "Не допускайте вмешательства государства."
 BOS_political.38.t: "Баня-Лука голосует за выход"
 BOS_political.38.d: "Ассамблея субъекта Республики Сербской поручила своему правительству вывести Республику Сербскую из состава государственной армии, налоговой службы и судебной системы в течение шести месяцев. Выводы пока носят декларативный характер, но в них простым языком обозначен путь к роспуску. Посольства готовят заявления, а гарантов Дейтонского соглашения спрашивают, какова по-прежнему ценность соглашения."
 BOS_political.38.a: "Обратиться к гарантам"
 BOS_political.38.b: "Дождитесь, пока Баня-Лука моргнёт."
 BOS_political.40.t: "Косово провозгласило независимость"
 BOS_political.40.d: "Приштина провозгласила независимость от Сербии. Это заявление разделяет Боснию: боснийские и хорватские лидеры склоняются к признанию, в то время как Республика Сербская предупреждает, что это создаст прецедент для ее собственного отделения."
 BOS_political.40.a: "Высказаться в поддержку самоопределения"
 BOS_political.40.b: "Отклонить одностороннее заявление"
 BOS_political.40.c: "Сохраняйте нейтралитет, чтобы сохранить единство государства."
 BOS_political.41.t: "Скопление мигрантов в Уна-Сане"
 BOS_political.41.d: "Тысячи людей, перемещающихся по маршруту через Западные Балканы, оказались заблокированы вблизи хорватской границы. Власти кантона Уна-Сана заявляют, что лагеря переполнены и они не могут справиться с ситуацией в одиночку."
 BOS_political.41.a: "Запросить помощь Европейского союза"
 BOS_political.41.b: "Ужесточить охрану границы и ликвидировать лагеря"
 BOS_political.42.t: "Соглашение об ассоциации с Европой"
 BOS_political.42.d: "Босния и Герцеговина подписала Соглашение о стабилизации и ассоциации с Европейским союзом. Это первый договорной шаг на долгом пути к членству."
 BOS_political.42.a: "Важный шаг на пути к Европе"
 BOS_political.43.t: "Государственный налог на добавленную стоимость"
 BOS_political.43.d: "Единый НДС на общегосударственном уровне заменяет старую разрозненную систему налогов с продаж в образованиях. Сбор централизован, а доходы распределяются через единый национальный счёт."
 BOS_political.43.a: "Внедрить единый налог"
 BOS_political.43.b: "Пусть образования сохранят собственные ставки"
 BOS_political.44.t: "«Апрельский пакет»"
 BOS_political.44.d: "Согласованный пакет конституционных поправок укрепил бы центральное государство и упростил бы работу президентской власти. В Палате представителей не хватает двух голосов."
 BOS_political.44.a: "Потратить политический капитал на реформы"
 BOS_political.44.b: "Пусть пакет провалится"
 BOS_political.45.t: "Переговоры в Бутмире"
 BOS_political.45.d: "Американские и европейские посредники собрали лидеров партий на базе под Сараево, чтобы преодолеть конституционный тупик. Предложения требуют от образований передать полномочия государству."
 BOS_political.45.a: "Взаимодействуйте с посредниками."
 BOS_political.45.b: "Защитить прерогативы образований"
 BOS_political.46.t: "Статус округа Брчко под вопросом"
 BOS_political.46.d: "Республика Сербская угрожает вывести своих чиновников из объединенных институтов Брчкоского района, самоуправляемого коридора, переданного под государственный контроль после войны."
 BOS_political.46.a: "Защитить общий статус района."
 BOS_political.46.b: "Уступите позиции, чтобы сохранить мир."
 BOS_political.47.t: "Мостар без правительства"
 BOS_political.47.d: "Хорватская и боснийская партии не могут договориться о городском уставе, и в Мостаре уже много лет не проводятся полноценные местные выборы. Разделённый город плывёт по течению без городского совета."
 BOS_political.47.a: "Ввести единый устав города"
 BOS_political.47.b: "Оставить партии в их противостоянии"
 BOS_political.48.t: "Исход ускоряется"
 BOS_political.48.d: "Автобусы и бюджетные авиарейсы из Сараево, Тузлы и Баня-Луки ходят переполненными в одном направлении. Молодые выпускники, рабочие и целые семьи уезжают в Германию, Австрию и Хорватию быстрее, чем государство успевает их заменять."
 BOS_political.48.a: "Поручить подготовить доклад о причинах"
 BOS_political.48.b: "Отмахнитесь от этого как от обычной мобильности в эпоху ЕС."
 BOS_political.49.t: "Комшич получает хорватское место в Президиуме"
 BOS_political.49.d: "Желько Комшич получил хорватское место в Президиуме благодаря голосам боснийского большинства, победив Драгана Човича из HDZ. Города с хорватским большинством объявляют его нежеланным гостем, а Загреб протестует против результата, который отвергает его собственная община."
 BOS_political.49.a: "Многоэтнический мандат, завоеванный честным путем"
 BOS_political.49.b: "Хорватские избиратели оказались в меньшинстве, их голоса не были представлены."
 BOS_political.50.t: "Программный тупик НАТО"
 BOS_political.50.d: "Министры СНСД отказываются разрешить государству представить в НАТО ежегодную национальную программу, а без нее Совет министров не может сформироваться. Проходят месяцы, а правительства до сих пор нет."
 BOS_political.50.a: "Отправьте программу в любом случае."
 BOS_political.50.b: "Вместо этого предложите программу реформ с новым названием."
 BOS_political.51.t: "Правительство, наконец!"
 BOS_political.51.d: "Спустя четырнадцать месяцев после выборов Совет министров принес присягу. В Сараево снова сформировалось правительство, купленное на компромиссе, позволяющем сохранить лицо, но никто им полностью не доволен."
 BOS_political.51.a: "Возвращение к работе"
 BOS_political.52.t: "Высокий представитель без мандата"
 BOS_political.52.d: "Кристиан Шмидт вступил в должность Высокого представителя, но Совет Безопасности ООН так и не одобрил его назначение. Россия, Китай и руководство Республики Сербской воспользовались этим пробелом, чтобы объявить его полномочия нелегитимными."
 BOS_political.52.a: "В Сараево всё идёт своим чередом."
 BOS_political.53.t: "Реформы, введённые на выборах"
 BOS_political.53.d: "После закрытия избирательных участков Высокий представитель, используя свои Боннские полномочия, ввёл поправки к конституции Федерации и закону о выборах, расширив Палату народов и установив сроки формирования правительств. Критики называют это навязанной конституцией; HDZ — давно назревшей мерой."
 BOS_political.53.a: "Прагматичное решение, каким бы путём оно ни пришло"
 BOS_political.53.b: "Нелиберальное превышение полномочий"
 BOS_political.53.c: "Не вмешивайтесь в спор."
 BOS_political.54.t: "Баня-Лука отменяет власть суда"
 BOS_political.54.d: "Собрание образования приняло законы, объявляющие, что решения Конституционного суда Боснии и Герцеговины не применяются в Республике Сербской, и запрещающие публикацию решений Высокого представителя в официальном вестнике образования. Теперь власть Сараево заканчивается на линии разграничения между образованиями."
 BOS_political.54.a: "Оспорьте это всеми доступными каналами."
 BOS_political.54.b: "Переждать"
 BOS_hr_legitimacy_disputed_tt: "§RРеспублика Сербская признает решения Высокого представителя недействительными, что усугубляет кризис.§!"
 BOS_political.55.t: "Брюссель открывает переговоры"
 BOS_political.55.d: "Спустя восемь лет после подачи Боснией заявки Европейский совет согласился начать переговоры о вступлении. Путь к членству еще долог, но впервые он проходит через Брюссель, а не в обход него."
 BOS_political.55.a: "Отметьте это знаменательное событие"
 BOS_political.55.b: "Сбавьте обороты в праздновании"
 BOS_political.57.t: "Додик осуждён и лишён права занимать должности"
 BOS_political.57.d: "Суд Боснии и Герцеговины признал Милорада Додика виновным в неподчинении решениям Высокого представителя и запретил ему занимать государственные должности. Государственным институтам Республики Сербской предстоит решить, принять ли это решение или проигнорировать его."
 BOS_political.57.a: "Решение остается в силе."
 BOS_political.57.b: "Никто не будет указывать Республике Сербской, кто ею руководит"
 BOS_reject_third_entity_demand: "Отклонить требование о третьем образовании"
 BOS_reject_third_entity_demand_desc: "Исключить возможность реструктуризации Федерации в отдельное образование с хорватским большинством. Боснийские партии вздохнули с облегчением; хорватские партии называют это доказательством того, что Сараево никогда не прислушается."
 BOS_concede_partial_croat_autonomy: "Предоставить частичную автономию хорватам"
 BOS_concede_partial_croat_autonomy_desc: "Это дает кантонам с хорватским большинством расширенное самоуправление, но без создания полноценного третьего образования. Это отвечает основной претензии HNS, но ценой создания еще одного уровня управления для координации."
 BOS_register_defence_property: "Зарегистрировать оборонное имущество как государственную собственность"
 BOS_register_defence_property_desc: "Передача военных объектов, на которые до сих пор претендуют эти структуры, в собственность государства является предварительным условием, выдвинутым НАТО для активации Плана действий по членству."
 BOS_request_nato_waiver: "Запросить освобождение от требований НАТО"
 BOS_request_nato_waiver_desc: "Попросите НАТО полностью отменить условие о передаче оборонной собственности, вместо того чтобы ждать согласия Республики Сербской. Это работает, и Баня-Лука не забывает, кто обратился с такой просьбой."
 BOS_activate_map: "Активировать План действий по членству"
 BOS_activate_map_desc: "После решения имущественного вопроса следует приступить к реализации Плана действий НАТО по членству и начать формальный путь к вступлению."
 BOS_expand_arms_exports: "Расширить экспорт боеприпасов и вооружений"
 BOS_expand_arms_exports_desc: "Поддержите связанные с государством оружейные заводы, поскольку они наращивают экспорт покупателям по всей Европе и за ее пределами. Портфель заказов полон, и споры о том, куда в конечном итоге попадут грузы, тоже не утихают."
 BOS_gulf_investment_delivered_tt: "§GBuroj Ozone начинает строительство в соответствии с графиком§!"
 BOS_gulf_investment_stalled_tt: "§RBuroj Ozone застрял, не выполнив и малой части обещанного§!"
 BOS_host_sarajevo_film_festival: "Провести Сараевский кинофестиваль"
 BOS_host_sarajevo_film_festival_desc: "Поддержите крупнейший в Юго-Восточной Европе кинофестиваль, предоставив государственные средства и организационные возможности. Каждое лето он привлекает в Сараево туристов и представителей прессы, поддерживая культурный статус города на высоком уровне по сравнению с соседними городами."
 BOS_federation_development_grant: "Грант на развитие федерации"
 BOS_federation_development_grant_desc: "Финансирование из казначейства направляется на развитие инфраструктуры в кантонах Федерации с преимущественно боснийским населением. Боснийская община приветствует эти инвестиции, хотя Республика Сербская рассматривает их как проявление фаворитизма."
 BOS_herzegovina_development_grant: "Грант развития Герцеговины"
 BOS_herzegovina_development_grant_desc: "Финансирование дорог и коммунальных услуг в Герцеговине, где большинство населения составляют хорваты. Хорватские лидеры воспринимают это как признание, в то время как боснийцы недовольны тем, что деньги поступают в националистические центры."
 BOS_srpska_development_grant: "Грант на развитие Республики Сербской"
 BOS_srpska_development_grant_desc: "Направление средств государственного бюджета на инфраструктуру Республики Сербской. Этот жест завоевывает расположение сербов, но боснийцы возмущены тем, что поощряют образование, которое постоянно угрожает уйти."
 BOS_croat_grievance: "Хорватская политическая обида"
 BOS_croat_grievance_desc: "Хорватские партии заявляют, что хорватское место в Президиуме было определено голосами боснийцев, а не хорватов, и требуют избирательной системы, в которой общину нельзя перевесить голосами извне."
 BOS_third_entity_demand: "Федеральная реструктуризация"
 BOS_third_entity_demand_desc: "Кантоны с хорватским большинством обладают расширенным самоуправлением, достигнутым ценой усложнения управления государственным аппаратом."
 BOS_contested_high_representative: "Спорный мандат Высокого представителя"
 BOS_contested_high_representative_desc: "Высокий представитель вступил в должность без одобрения Совета Безопасности ООН. Республика Сербская рассматривает этот пробел как разрешение игнорировать его решения, и любое применение Боннских полномочий теперь влечёт за собой не только политическую борьбу, но и борьбу за легитимность."
 BOS_map_participant: "План действий по членству в НАТО"
 BOS_map_participant_desc: "В рамках Плана действий по членству, который является официальным путем к окончательному вступлению в НАТО, боснийские офицеры проходят обучение и планируют свою деятельность совместно со своими коллегами из НАТО."
 BOS_arms_export_boom: "Бум экспорта вооружений"
 BOS_arms_export_boom_desc: "Связанные с государством оружейные заводы работают на полную мощность, выполняя заказы как под калибры НАТО, так и под калибры Варшавского договора. От этого выигрывает казна, а заодно разгорается спор о том, до кого на самом деле доходят эти поставки."
 BOS_brain_drain_1: "Массовая эмиграция"
 BOS_brain_drain_1_desc: "С момента введения безвизового режима сотни тысяч людей покинули страну, и среди них непропорционально много образованных и молодых людей. Этот разрыв ощущается в учебных заведениях, клиниках и на заводах."
 BOS_brain_drain_eased_tt: "§GВозвращающиеся семьи облегчают проблему массовой эмиграции.§!"
 BOS_economic_reconstruction: "Восстановить экономику"
 BOS_economic_reconstruction_desc: "Послевоенная Босния так и не завершила восстановление. Спустя поколение государству по-прежнему необходима последовательная экономическая программа, а не ситуативная приватизация и получение иностранных займов по одному."
 BOS_reform_agenda_adoption: "Принять программу реформ"
 BOS_reform_agenda_adoption_desc: "Необходимо придерживаться программы социально-экономических реформ, установленной ЕС в качестве условия для возобновления процесса вступления в ЕС. Судебные и рыночные реформы будут продвигаться быстрее, как только Брюссель сможет представить официальный план."
 BOS_growth_plan_negotiations: "Провести переговоры о Плане роста"
 BOS_growth_plan_negotiations_desc: "Начать переговоры о получении средств из Фонда реформ и экономического роста ЕС. Деньги есть, но условия их предоставления тоже реальны."
 BOS_corridor_vc_northern_construction: "Постройте Северный коридор"
 BOS_corridor_vc_northern_construction_desc: "Продолжается строительство коридора Vc через Добой, Зеницу и Сараево. Это крупнейший инфраструктурный проект страны со времен войны, финансируемый в основном из Брюсселя."
 BOS_corridor_vc_southern_construction: "Продлить коридор на юг"
 BOS_corridor_vc_southern_construction_desc: "Продлите автомагистраль до Мостара, сократив разрыв между промышленным севером Федерации и её обращённым к Адриатике югом."
 BOS_corridor_vc_opening: "Открыть коридор Vc"
 BOS_corridor_vc_opening_desc: "Перережьте ленточку на завершенном участке дороги от венгерской границы до порта Плоче. Это наиболее наглядный результат двух десятилетий развития, финансируемого ЕС."
 BOS_east_energy_partnership: "Привлечь китайское финансирование энергетики"
 BOS_east_energy_partnership_desc: "Необходимо опираться на государственные кредиты и подрядчиков Китая, чтобы поддерживать работу и расширять угольные электростанции страны, независимо от того, во сколько обойдется это в вопросе вступления в ЕС."
 BOS_west_energy_partnership: "Привести энергетическую политику в соответствие с политикой ЕС."
 BOS_west_energy_partnership_desc: "Направить инвестиции на гидроэнергетику и модернизацию энергосетей, финансируемую ЕС, а не на строительство новых угольных электростанций, чтобы энергетический сектор оставался в рамках европейских правил государственной помощи."
 BOS_defense_industry_revival: "Возобновить работу оборонных заводов"
 BOS_defense_industry_revival_desc: "Окажите государственную поддержку заводам по производству боеприпасов Igman Konjic и Unis Ginex, которые когда-то снабжали половину Югославии, а теперь работают далеко не на полную мощность."
 BOS_arms_industry_capacity_expansion: "Расширение производственных мощностей"
 BOS_arms_industry_capacity_expansion_desc: "Переоборудование оружейных заводов для одновременной работы на линиях производства боеприпасов калибра НАТО и Варшавского договора — именно такое сочетание позволяет продавать боснийские боеприпасы практически в любой точке мира."
 BOS_defense_export_drive: "Стремитесь к экспортному буму!"
 BOS_defense_export_drive_desc: "Поддержите заводы, которые наращивают объемы производства для экспортных рынков, открывшихся благодаря возобновлению спроса за рубежом. Портфель заказов полон и продолжает пополняться."
 BOS_national_jobs_program: "Запуск национальной программы по созданию рабочих мест"
 BOS_national_jobs_program_desc: "Финансируйте создание рабочих мест и обучение на родине, чтобы дать сотням тысяч людей, покинувших страну с начала безвизового режима, повод задуматься о том, чтобы остаться или вернуться."
 BOS_youth_retention_initiative: "Инвестируйте в удержание молодежи"
 BOS_youth_retention_initiative_desc: "Расширить программу трудоустройства за счет грантов и поддержки в сфере жилья, направленных непосредственно на молодых выпускников и специалистов рабочих профессий, составляющих основную часть оттока населения."
 BOS_brain_drain_reversed_tt: "§GПроблема массовой эмиграции решена§!"
 BOS_corridor_vc_trade_boost: "Коридор Vc открыт"
 BOS_corridor_vc_trade_boost_desc: "Завершённая автомагистраль сокращает время доставки грузов по всей стране и до побережья Адриатики, упрощая торговлю с остальной Европой."
 BOS_defense_industrial_base: "Восстановленная оборонно-промышленная база"
 BOS_defense_industrial_base_desc: "Заводы Igman Konjic и Unis Ginex работают почти на прежних мощностях, хотя дополнительный объем производства по-прежнему конкурирует с продукцией гражданского назначения, выпускаемой теми же заводами."
 BOS_jobs_program_idea: "Национальная программа создания рабочих мест"
 BOS_jobs_program_idea_desc: "Создание рабочих мест за счет государственного финансирования дает работникам повод остаться, а не стоять в очереди на автобус, направляющийся в Германию."
 BOS_youth_retention_idea: "Гранты на удержание молодежи"
 BOS_youth_retention_idea_desc: "Жилищные и карьерные гранты, предназначенные для молодых выпускников, позволяют некоторым из них оставаться в стране достаточно долго, чтобы создать здесь семьи и начать карьеру."
 BOS_mostar_industrial_decline: "Закрытие Мостарского плавильного завода"
 BOS_mostar_industrial_decline_desc: "Алюминиевый завод, который когда-то был крупнейшим потребителем электроэнергии в Федерации, стоит без дела, а экономика Мостара испытывает нехватку нескольких тысяч рабочих мест, которые он не смог восполнить."
 BOS_mostar_industrial_revival: "Мостар под новым руководством"
 BOS_mostar_industrial_revival_desc: "Стратегический инвестор взял под свой контроль работу Мостарского плавильного завода, возобновив производство на сокращенной, но работоспособной мощности."
 BOS_zenica_industrial_decline: "Сворачивание работы металлургического завода в Зенице"
 BOS_zenica_industrial_decline_desc: "Доменная печь, которая более века была основой экономики Зеницы, остыла, и регион теряет тысячи рабочих мест."
 BOS_zenica_industrial_revival: "Зеница перешла под новое руководство."
 BOS_zenica_industrial_revival_desc: "Покупатель приобрел металлургический завод в Зенице, сохранив часть прежнего персонала под новым руководством."
 BOS_eu_growth_plan_tranche: "Получить транш по Плану роста ЕС"
 BOS_eu_growth_plan_tranche_desc: "Запросите следующую выплату из Фонда реформ и экономического роста ЕС. Коррупция, превышающая установленный порог, или правительство, слишком нестабильное для ведения переговоров, приведут к лишению транша."
 BOS_political.58.t: "Мостарский плавильный завод закрывается."
 BOS_political.58.d: "Завод Aluminij Mostar, крупнейший потребитель электроэнергии в Федерации, отключён от электроснабжения из-за долга перед энергокомпанией в сотни миллионов. Glencore отказалась от сделки по поглощению несколько месяцев назад, и перезапуск плавильного завода такого размера после полной остановки может оказаться вообще невозможным."
 BOS_political.58.a: "Пусть завод закроется"
 BOS_political.58.b: "Привлечь стратегического инвестора"
 BOS_political.59.t: "Доменная печь в Зенице остыла"
 BOS_political.59.d: "Компания ArcelorMittal остановила доменную печь на своем металлургическом заводе в Зенице, предприятии, которое более века являлось основой экономики города. Слабый спрос в Европе и высокие затраты на энергоносители сделали эксплуатацию линии нерентабельной."
 BOS_political.59.a: "Пусть печь остается холодной"
 BOS_political.59.b: "Найти нового владельца"
 BOS_political.60.t: "Проект 7-го энергоблока в Тузле сорвался"
 BOS_political.60.d: "Строительство угольной электростанции в Тузле, финансируемой Китаем, официально прекращено. Государственная гарантия по кредиту нарушила правила ЕС о государственной помощи еще несколько лет назад, и правительство наконец подтвердило то, о чем Брюссель говорил ранее. Компания China Gezhouba настаивает на выполнении контракта в любом случае."
 BOS_political.60.a: "Примите отмену"
 BOS_political.60.b: "Оспорить расторжение контракта"
 BOS_political.61.t: "Безвизовые поездки в Европу"
 BOS_political.61.d: "ЕС отменил краткосрочные шенгенские визы для владельцев боснийских биометрических паспортов. Впервые со времен войны для въезда в ЕС достаточно предъявить паспорт на границе."
 BOS_political.61.a: "Отметьте это знаменательное событие"
 BOS_political.61.b: "Предупреждение: куда ведет эта дорога"
 BOS_visa_era_emigration_tt: "§YБезвизовый режим для поездок в ЕС сделал выезд из страны проще, чем когда-либо.§!"
 BOS_political.62.t: "Гражданский момент выборов 2010 года"
 BOS_political.62.d: "Многонациональная Социал-демократическая партия Златко Лагумджии впервые со времён войны возглавила голосование в Федерации, а Союз независимых социал-демократов (СНСД) Милорада Додика одержал убедительную победу в Республике Сербской. Теперь шести партиям предстоит сформировать правительство, в котором ни одна из сторон не сможет доминировать."
 BOS_political.62.a: "Развивайте достигнутый прорыв в сфере гражданского общества."
 BOS_political.62.b: "Пусть образования стоят на своём."
 BOS_political.63.t: "Коалиция, опоздавшая на шестнадцать месяцев."
 BOS_political.63.d: "Спустя шестнадцать месяцев после закрытия избирательных участков коалиция из шести партий наконец сформировала Совет министров. Большую часть этого времени ушло только на то, чтобы договориться о том, кто возглавит его."
 BOS_political.63.a: "Возвращаемся к управлению"
 BOS_paralysis_lifted_tt: "§GПаралич формирования правительства преодолён§!"
 BOS_political.64.t: "Возвращение националистов"
 BOS_political.64.d: "Партия СДА вернула себе статус крупнейшей партии в Федерации, Драган Чович занимает хорватское место в Президиуме, а Додик с небольшим перевесом удержал Республику Сербскую. Многоэтнический эксперимент 2010 года практически провалился."
 BOS_political.64.a: "Старые блоки вернулись не просто так."
 BOS_political.64.b: "Снова попробовать гражданский путь"
 BOS_political.65.t: "Мостар снова голосует"
 BOS_political.65.d: "После решения Европейского суда, вынудившего Сараево пойти на этот шаг, и после того, как Изетбегович и Чович приняли новый городской устав, в Мостаре впервые за двенадцать лет состоялись местные выборы. В разделённом городе наконец-то появился выборный городской совет."
 BOS_political.65.a: "Новый мандат для города"
 BOS_political.65.b: "Хрупкое перемирие, и ничего больше."
 BOS_political.66.t: "Закон Республики Сербской об иностранных агентах"
 BOS_political.66.d: "Спустя несколько дней после вынесения обвинительного приговора Додику парламент образования в спешке принял закон, обязывающий финансируемые из-за рубежа НПО и независимые СМИ регистрироваться в качестве иностранных агентов и сообщать о каждом пожертвовании. ОБСЕ и Венецианская комиссия называют это откатом в развитии гражданского общества."
 BOS_political.66.a: "Осудить репрессии"
 BOS_political.66.b: "Республика Сербская отвечает сама себе"
 BOS_political.67.t: "Ордер, который никто не будет исполнять."
 BOS_political.67.d: "Додик проигнорировал национальный ордер на арест и ордер Интерпола, проехав через Белград и Израиль в Москву. Когда органы государственной безопасности попытались арестовать его на территории Республики Сербской, этому воспрепятствовала полиция образования."
 BOS_political.67.a: "Осуществить арест"
 BOS_political.67.b: "Дайте конфликту утихнуть."
 BOS_rs_police_standoff_tt: "§RПолиция Республики Сербской защищает Додика от ареста, что усугубляет кризис.§!"
 BOS_political.68.t: "Досрочные выборы на пост Додика"
 BOS_political.68.d: "После того, как избирательная комиссия лишила Додика президентского кресла, в Республике Сербской состоялись досрочные президентские выборы. Верный член СНСД Синиша Каран и претендент от СДС Бранко Блануша финишировали с разницей всего в три процента."
 BOS_political.68.a: "Машина СНСД выстояла"
 BOS_political.68.b: "Оппозиция прорывается"
 BOS_political.69.t: "Решение по делу Любича"
 BOS_political.69.d: "Конституционный суд отменил гарантию наличия как минимум одного делегата от каждой этнической группы от каждого кантона в Палате народов Федерации. У парламента нет большинства, чтобы принять замену, поэтому избирательное законодательство остаётся замороженным."
 BOS_political.69.a: "Предупреждаю, что это ещё аукнется."
 BOS_political.69.b: "Запомните это и двигайтесь дальше."
 BOS_political.49.d_ljubic: "Желько Комшич получил хорватское место в Президиуме благодаря голосам боснийского большинства, победив Драгана Човича из HDZ. Тот же пробел в избирательном законодательстве, который Конституционный суд оставил открытым в решении по делу Любича два года назад, теперь лежит в основе аргументации HDZ о том, что хорватских избирателей всегда можно переголосовать. Города с хорватским большинством объявляют его нежелательной персоной, а Загреб протестует против результата, который отвергает его собственная община."
 BOS_political.70.t: "Взрыв в полицейском участке Бугойно"
 BOS_political.70.d: "В Бугойно самодельная бомба взорвалась в полицейском участке, в результате чего один офицер погиб и шестеро получили ранения. Салафитская ячейка, стоящая за этим взрывом, является первой крупной внутренней джихадистской сетью, с которой страна столкнулась со времен войны."
 BOS_political.70.a: "Считать это изолированной ячейкой"
 BOS_political.70.b: "Бить тревогу по поводу радикализации"
 BOS_counter_radicalization_available_tt: "§YТеперь доступно решение по противодействию радикализации§!"
 BOS_political.71.t: "Стрельба у посольства США"
 BOS_political.71.d: "Боевик из ваххабитского анклава Горня Маоча выпустил более ста пуль по американскому посольству в Сараево, прежде чем полицейский снайпер его обезвредил. Проблема радикализации в стране перестала быть исключительно внутренней проблемой."
 BOS_political.71.a: "Примите дипломатические последствия"
 BOS_political.71.b: "Потребовать ответов по поводу анклавов"
 BOS_salafi_enclave_decision_available_tt: "§YРешение о наблюдении за салафитскими анклавами теперь доступно.§!"
 BOS_political.72.t: "Нападение на полицейский участок в Зворнике"
 BOS_political.72.d: "Вооруженный мужчина убил полицейского на полицейском участке в Зворнике в Республике Сербской, после чего сам был застрелен. Это первое исламистское нападение на территории сербского образования. Некоторые из его известных сообщников воевали в Сирии."
 BOS_political.72.a: "Угроза не признаёт границ между образованиями"
 BOS_political.73.t: "Вашингтон вводит санкции против сети Додика"
 BOS_political.73.d: "Министерство финансов США ввело санкции против Милорада Додика и расширило круг лиц, связанных с его семьёй и сетью покровительства, сославшись на коррупцию и умышленное препятствование выполнению Дейтонских соглашений. Это самый жёсткий инструмент принуждения со стороны Запада, направленный против Республики Сербской на сегодняшний день."
 BOS_political.73.a: "Запоздалая подотчетность"
 BOS_political.73.b: "Нападение на саму Республику Сербскую"
 BOS_sanctions_deepen_crisis_tt: "§RСанкции усугубляют продолжающийся кризис отделения Республики Сербской.§!"
 BOS_political.74.t: "Бебилюция"
 BOS_political.74.d: "Парламент допустил прекращение действия закона о гражданском удостоверении личности из-за тупиковой ситуации, в результате чего новорожденные месяцами обходятся без идентификационных номеров, паспортов и медицинских карт. После того, как тяжелобольной младенец умер, ожидая лечения за границей, в Сараево прошли марши десяти тысяч человек — крупнейшая гражданская акция протеста со времен войны."
 BOS_political.74.a: "Обещание быстрого решения проблемы."
 BOS_political.74.b: "Пусть парламент сам разберется."
 BOS_political.75.t: "Босния вышла на чемпионат мира"
 BOS_political.75.d: "Победа со счётом 1:0 в Литве вывела Боснию и Герцеговину на её первый чемпионат мира в качестве независимого государства. На несколько недель команда Эдина Джеко заставила всю страну болеть за одно и то же."
 BOS_political.75.a: "Страна, объединенная, пусть и ненадолго."
 BOS_political.81.t: "Соглашение SAA наконец вступает в силу."
 BOS_political.81.d: "Спустя девять лет после подписания Соглашение о стабилизации и ассоциации вступило в силу. Оно возобновляет европейский путь, который был приостановлен на годы, и закладывает основу для программы реформ, которая сейчас формируется в Совете министров."
 BOS_political.81.a: "Новое начало с Брюсселем"
 BOS_political.77.t: "Авиакомпания B&H Airlines окончательно приостановила свою деятельность."
 BOS_political.77.d: "Правительство Федерации ликвидировало национального авиаперевозчика B&H Airlines из-за долгов, которые тот никогда не смог бы погасить. Впервые с момента обретения независимости в стране нет национальной авиакомпании."
 BOS_political.77.a: "Отпусти ситуацию"
 BOS_political.77.b: "Выручите его"
 BOS_political.78.t: "Объявлено о проекте Buroj Ozone"
 BOS_political.78.d: "Дубайская компания Buroj Property Development представила планы строительства курортного города стоимостью 4,3 миллиарда евро в Трново, недалеко от Сараево, обещая создать тысячи рабочих мест. Капитал стран Персидского залива как никогда ранее присматривается к секторам недвижимости и туризма Боснии."
 BOS_political.78.a: "Приветствуем это объявление!"
 BOS_political.76.t: "ТЭС EFT Stanari введена в эксплуатацию"
 BOS_political.76.d: "Тепловая электростанция «Станари» мощностью 300 мегаватт, расположенная недалеко от Баня-Луки, введена в коммерческую эксплуатацию. Это первая новая тепловая электростанция, построенная в Боснии после войны. Республика Сербская теперь имеет собственный стабильный источник электроэнергии, финансируемый и построенный на китайские деньги."
 BOS_political.76.a: "Гордость Республики Сербской"
 BOS_political.80.t: "Первый Сараевский прайд"
 BOS_political.80.d: "Около двух тысяч человек прошли маршем по Сараево в рамках первого в истории страны прайда — Сараево стало последней из бывших югославских столиц, где он прошёл. Небольшая контракция собралась под лозунгом «традиционных ценностей», но марш прошёл без насилия."
 BOS_political.80.a: "Гарантировать защиту участников марша"
 BOS_political.80.b: "Государству держаться в стороне"
 BOS_political.79.t: "Наводнения и оползни погребли Ябланицу"
 BOS_political.79.d: "Внезапные наводнения и оползни обрушились на центральную и южную Боснию, став самой страшной катастрофой в стране за последнее десятилетие. Наиболее сильно пострадала Донья-Ябланица, где селевой поток засыпал дома и унес жизни десятков людей."
 BOS_political.79.a: "Обращение за помощью солидарности со стороны ЕС"
 BOS_political.79.b: "Восстановим сами"
 BOS_pass_jmbg_law: "Принять закон JMBG"
 BOS_pass_jmbg_law_desc: "Провести через парламент новый закон об удостоверении личности гражданина взамен утратившего силу, положив конец перерыву в регистрации, из-за которого новорождённые остаются без документов, удостоверяющих личность."
 BOS_jmbg_law_passed_tt: "§GПринят новый закон об удостоверении личности гражданина, и протесты утихли§!"
 BOS_counter_radicalization_program: "Запустить программу противодействия радикализации"
 BOS_counter_radicalization_program_desc: "Финансирование направлено на информационно-просветительскую работу и мониторинг салафитских сетей, стоящих за недавним взрывом, с целью частичного устранения ущерба внутренней безопасности."
 BOS_monitor_salafi_enclaves: "Следите за салафитскими анклавами."
 BOS_monitor_salafi_enclaves_desc: "Необходимо установить постоянное наблюдение за такими деревнями, как Горня Маоча. Это улучшит выявление нарушений и позволит боснийским общинам, проживающим там, точно понять, как государство к ним относится."
 BOS_repatriate_foreign_fighters: "Репатриировать и привлечь к ответственности иностранных боевиков."
 BOS_repatriate_foreign_fighters_desc: "Верните на родину граждан, воевавших на стороне ИГИЛ в Сирии и Ираке, и привлеките их к ответственности по закону о борьбе с терроризмом 2014 года. Реинтеграция обходится дорого, и не каждое дело заканчивается благополучно."
 BOS_reintegration_success_tt: "§GВернувшиеся успешно реинтегрированы§!"
 BOS_reintegration_relapse_tt: "§RНекоторые вернувшиеся вновь сблизились с радикальными сетями§!"
 BOS_government_formation_paralysis: "Паралич формирования правительства"
 BOS_government_formation_paralysis_desc: "Ни одна коалиция не набирает достаточно мест для формирования Совета министров. Министерства функционируют на временных бюджетах, пока партии ведут переговоры."
 BOS_civil_society_crackdown: "Репрессии против гражданского общества"
 BOS_civil_society_crackdown_desc: "Закон Республики Сербской об иностранных агентах обязывает НПО и независимые СМИ регистрироваться, отчитываться о своём финансировании и самостоятельно маркировать свои материалы. Как наблюдательные организации, так и доноры сворачивают своё присутствие в этом образовании."
 BOS_domestic_terror_threat_1: "Внутренняя террористическая угроза"
 BOS_domestic_terror_threat_1_desc: "Небольшая, но активная салафитская сеть действует в основном вне поля зрения государства, вербуя сторонников из нескольких изолированных общин."
 BOS_counter_radicalization_measures: "Меры по противодействию радикализации"
 BOS_counter_radicalization_measures_desc: "Информационно-просветительские программы и расширенный мониторинг постепенно разрушают сети, которые привели к взрыву в Бугойно."
 BOS_salafi_enclave_monitoring: "Мониторинг салафитского анклава"
 BOS_salafi_enclave_monitoring_desc: "Службы безопасности постоянно следят за Горней Маочей и подобными общинами. Благодаря этому удаётся раскрывать больше заговоров, чем раньше, но ценой доверия жителей районов, за которыми ведётся наблюдение."
 BOS_foreign_fighter_reintegration: "Реинтеграция иностранных бойцов"
 BOS_foreign_fighter_reintegration_desc: "Осуждённых и освобождённых в рамках программы репатриации вернувшихся направляют на работу и уводят от сетей, которые завербовали их в первый раз."
 BOS_eufor_deterrence: "Усиление EUFOR"
 BOS_eufor_deterrence_desc: "Увеличенный гарнизон EUFOR Althea служит наглядным напоминанием о том, что у мира в Боснии есть внешние гаранты, и этот факт давит на любого в Баня-Луке, кто задумывается о сецессии."
 BOS_eufor_deterrence_tt: "§YУсиленное присутствие EUFOR снижает риск попытки отделения Республики Сербской.§!"
 BOS_jmbg_crisis: "Кризис JMBG"
 BOS_jmbg_crisis_desc: "Новорожденные остаются без документов, удостоверяющих личность, в то время как парламент не может согласовать закон о замене удостоверения личности гражданина. Чем дольше затягивается этот процесс, тем масштабнее становятся протесты."
 BOS_world_cup_unity: "Лихорадка чемпионата мира"
 BOS_world_cup_unity_desc: "Выход национальной сборной на свой первый чемпионат мира подарил повод для радости боснийцам, хорватам и сербам."
 BOS_stanari_plant_online: "Электростанция «Станари» запущена"
 BOS_stanari_plant_online_desc: "Построенная в Китае угольная электростанция «Станари» обеспечивает бесперебойную подачу электроэнергии в энергосистему Республики Сербской, являясь первой новой тепловой электростанцией, построенной в стране со времен войны."
 BOS_national_carrier_pride: "Гордость Национального перевозчика"
 BOS_national_carrier_pride_desc: "Субсидируемый государством национальный авиаперевозчик продолжает летать — небольшой повод для гордости в стране, которая в ином случае осталась бы без него с 2015 года."
