l_braz_por:
 RULE_ZOMBIE_DIFFICULTY: "Dificuldade do Modo de Jogo Zumbi"
 RULE_ZOMBIE_DIFFICULTY_NORMAL: "Normal"
 RULE_ZOMBIE_DIFFICULTY_NORMAL_DESC: "Os zumbis têm 4 milhões de zumbis no início do jogo."
 RULE_ZOMBIE_DIFFICULTY_HARD: "Difícil"
 RULE_ZOMBIE_DIFFICULTY_HARD_DESC: "Os zumbis têm 9 milhões de zumbis no início do jogo."
 RULE_ZOMBIE_DIFFICULTY_EXTREME: "Extremo"
 RULE_ZOMBIE_DIFFICULTY_EXTREME_DESC: "Os zumbis têm 13.5 milhões de zumbis no início do jogo."
 RULE_ZOMBIE_DIFFICULTY_INSANE: "Insano"
 RULE_ZOMBIE_DIFFICULTY_INSANE_DESC: "Os zumbis têm 37 milhões de zumbis e bônus de ataque e defesa no início do jogo."
 RULE_ZOMBIE_GAME_MODE: "Habilitar Modo de Jogo Zumbi"
 RULE_ZOMBIE_GAME_MODE_NO_DESC: "O modo de jogo Zumbi não irá ser habilitado."
 RULE_ZOMBIE_GAME_MODE_YES_DESC: "O modo Zombi irá ser habilitado. Todos os outros conteúdos do Millennium Dawn irá continuar existir, então mantenha isso em mente. Se você quiser jogar como Zumbi inicie como India."
 zombie: "Virus Zumbi"
 zombie_desc: "O vírus transforma humanos inofensivos em monstros."
 zombie_0: "Virus Zumbi"
 zombie_0_desc: "O vírus transforma humanos inofensivos em monstros."
 Zombie: "Zumbis!"
 Zombie_desc: "O único propósito de um zumbi é comer humanos."
 better_instincts: "Melhores Instintos"
 better_instincts_desc: "Os zumbis desenvolveram métodos de abate mais eficientes."
 shock_and_zombie_awe: "Pânico em Massa"
 shock_and_zombie_awe_desc: "O pânico está se instalando entre a população. Ninguém poderia estar preparado para os zumbis e a rapidez com que eles sobrepujaram as posições militares. Defesas desesperadas desmoronam à medida que a confiança na sobrevivência se esvai."
 zombie.1.t: "O Vírus se espalha por Inglaterra"
 zombie.1.d: "O Canal da Mancha não é páreo para a praga implacável. Refugiados infectados dão à costa nas falésias brancas de Dover, e as ruas movimentadas de Londres caem em um silêncio assustador enquanto o vírus rasga o coração do Império. A fortaleza insular da Grã-Bretanha se transforma em uma prisão à medida que os mortos começam a caminhar."
 zombie.1.a: "Reconhecer a Pandemia"
 zombie.2.t: "O Vírus se espalha por Islândia"
 zombie.2.d: "O Mar da Irlanda não serve de barreira contra a praga dos mortos-vivos. Barcos de pesca retornam ao porto carregando mais do que apenas a pesca, e as vilas costeiras calam-se uma a uma. A infecção se espalha para o interior a partir de Dublin e Cork, consumindo a Ilha Esmeralda em uma onda de cadáveres cambaleantes."
 zombie.2.a: "Reconhecer a Pandemia"
 zombie.3.t: "O Vírus se espalha para os Estados Unidos"
 zombie.3.d: "Apesar das medidas de quarentena desesperadas, refugiados infectados fugindo da Europa trouxeram a praga através do Atlântico. As principais cidades portuárias da Costa Leste relatam surtos, e a infecção se espalha para o oeste com uma velocidade aterrorizante. O sonho americano se transforma em um pesadelo de mortos-vivos."
 zombie.3.a: "Reconhecer a Pandemia"
 zombie.4.t: "O Vírus se espalha para o Japão"
 zombie.4.d: "A Terra do Sol Nascente agora enfrenta um exército que não conhece honra nem piedade. Relatórios chegam aos \"borbotões\" de Tóquio, Osaka e outros centros populacionais à medida que as cidades densamente povoadas se transformam em armadilhas mortais. Templos antigos e arranha-céus modernos caem igualmente diante da maré implacável dos infectados."
 zombie.4.a: "Reconhecer a Pandemia"
 zombie.5.t: "O Vírus se espalha para Austrália"
 zombie.5.d: "O vasto oceano oferece apenas uma trégua temporária. Navios de carga transportando tripulantes infectados chegam a Sydney e Melbourne, e o surto rasga o continente. Até mesmo o árido Outback oferece pouco refúgio contra a praga que se espalha, enquanto a última fortaleza insular da humanidade começa a cair."
 zombie.5.a: "Reconhecer a Pandemia"
 zombie.6.t: "O Vírus se espalha por Nova Zelândia"
 zombie.6.d: "As ilhas remotas que serviram de inspiração para a Terra-média agora enfrentam um apocalipse próprio. A infecção chega por via aérea e marítima, espalhando-se por Wellington e Auckland. O isolamento da Nova Zelândia, antes sua maior defesa, agora significa que não há para onde fugir."
 zombie.6.a: "Reconhecer a Pandemia"
 zombie.7.t: "O Vírus se espalha pelas Filipinas"
 zombie.7.d: "A infecção varre o arquipélago filipino como uma tempestade tropical. Sobreviventes pulando de ilha em ilha carregam a praga de Luzon a Mindanao, e os milhares de ilhas que antes forneciam barreiras naturais agora se tornam bolsões isolados de horror sem esperança de fuga."
 zombie.7.a: "Reconhecer a Pandemia"
 zombie.8.t: "A horda de Zumbi"
 zombie.8.d: "Os mortos caminham sobre a Terra. A horda de zumbis irrompeu pelo subcontinente indiano e está consumindo rapidamente nossa população por meio de infecção e predação direta. Especialistas batizaram o conflito de \"O Surto\", mas a guerra pela sobrevivência humana apenas começou. Países desesperados já estão fechando suas fronteiras."
 zombie.8.a: "Mobilizar Contra a Horda"
 zombie.8.b: "Aceitar o Destino da Humanidade"
 zombie.9.t: "[FROM.GetName] Pede Ajuda contra os Zumbis"
 zombie.9.d: "[FROM.GetName] solicitou assistência e está tentando alistar todas as grandes nações para conter o Surto. Atenderemos ao chamado ou priorizaremos nossa própria sobrevivência?"
 zombie.9.a: "Juntar-se a Coalizão"
 zombie.9.b: "Prioritize Our Survival"
 RULE_ZOMBIE_JOINING_FACTION_GAME_MODE: "Anti-Zombie Coalition Joining Faction"
 RULE_ZOMBIE_JOINING_FACTION_NORMAL: "Default Faction Behavior"
 RULE_ZOMBIE_JOINING_FACTION_NORMAL_DESC: "The faction behavior is the default for the game mode."
 RULE_ZOMBIE_JOINING_FACTION_NO_MAJORS: "No Majors"
 RULE_ZOMBIE_JOINING_FACTION_NO_MAJORS_DESC: "No majors will join the Anti-Zombie Coalition."
 RULE_ZOMBIE_JOINING_FACTION_ALL_MAJORS: "All Majors join the Coalition"
 RULE_ZOMBIE_JOINING_FACTION_ALL_MAJORS_DESC: "All majors join the Anti-Zombie Coalition."
 zombie.10.t: "Outbreak!"
 zombie.10.d: "The Zombie virus has spread to our lands and is now spreading throughout [?var:random_outbreak_state.GetName]. The severity of the outbreak remains unknown."
 zombie.10.a: "Mobilize the Troops"
 zombie.11.t: "Outbreak in [FROM.GetName]"
 zombie.11.d: "An outbreak has erupted in [FROM.GetName] and continues to worsen rapidly. The Zombie virus spreads with terrifying speed, and the situation may represent the beginning of the end."
 zombie.11.a: "Monitor the Situation"
 zombie.11.b: "Prepare for the Worst"
 RULE_ZOMBIE_SPAWN_LOCATION: "Zombie Spawn Location"
 RULE_ZOMBIE_SPAWN_INDIA: "India (Default)"
 RULE_ZOMBIE_SPAWN_INDIA_DESC: "The Zombie Horde spawns in India as normal."
 RULE_ZOMBIE_SPAWN_AFRICA: "Central Africa"
 RULE_ZOMBIE_SPAWN_AFRICA_DESC: "The Zombie Horde spawns in Central Africa (Congo region), opening a new front that threatens Europe and the Middle East earlier."
 RULE_ZOMBIE_SPAWN_EAST_ASIA: "East Asia"
 RULE_ZOMBIE_SPAWN_EAST_ASIA_DESC: "The Zombie Horde spawns on the Chinese coast, immediately threatening East Asia, Japan, and the Pacific."
 RULE_ZOMBIE_SPAWN_MULTIPLE: "Multiple Locations"
 RULE_ZOMBIE_SPAWN_MULTIPLE_DESC: "The Zombie Horde spawns simultaneously in India, Central Africa, and East Asia with smaller initial forces at each location."
 RULE_ZOMBIE_COALITION_ENABLED: "Anti-Zombie Coalition Faction"
 RULE_ZOMBIE_COALITION_ENABLED_YES: "Enabled (Default)"
 RULE_ZOMBIE_COALITION_ENABLED_YES_DESC: "The Anti-Zombie Coalition forms normally. Major powers will be invited to join the fight against the Zombie Horde."
 RULE_ZOMBIE_COALITION_ENABLED_NO: "Disabled"
 RULE_ZOMBIE_COALITION_ENABLED_NO_DESC: "The Anti-Zombie Coalition will not form. Nations must survive the outbreak on their own without an organised coalition."
 RULE_ZOMBIE_COALITION_DELAY: "Zombie Spawn Delay"
 RULE_ZOMBIE_COALITION_DELAY_NONE: "No Delay (Default)"
 RULE_ZOMBIE_COALITION_DELAY_NONE_DESC: "The Zombie Horde spawns immediately at the start of the game."
 RULE_ZOMBIE_COALITION_DELAY_ONE_YEAR: "1 Year"
 RULE_ZOMBIE_COALITION_DELAY_ONE_YEAR_DESC: "The Zombie Horde spawns after a one-year countdown, giving nations time to prepare before the outbreak begins."
 RULE_ZOMBIE_COALITION_DELAY_TWO_YEARS: "2 Years"
 RULE_ZOMBIE_COALITION_DELAY_TWO_YEARS_DESC: "The Zombie Horde spawns after a two-year countdown, giving nations significant time to build up their economies and militaries."
 RULE_ZOMBIE_COALITION_DELAY_THREE_YEARS: "3 Years"
 RULE_ZOMBIE_COALITION_DELAY_THREE_YEARS_DESC: "The Zombie Horde spawns after a three-year countdown, giving nations extensive preparation time before the outbreak begins."
 zombie_runner: "Runner Strain"
 zombie_runner_desc: "A faster, more aggressive mutation of the zombie virus. Runners move in swarms and overwhelm defenses through sheer speed and volume.\n\n§GDesigner Hint: Runners provide high Speed and strong Soft Attack in a narrow formation. Use them to exploit gaps and overrun infantry, but their low Organization, weak Defense, and negligible anti-armor capability make sustained combat costly.§!"
 zombie_runner_0: "Runner Strain"
 zombie_runner_0_desc: "A faster, more aggressive mutation of the zombie virus. Runners move in swarms and overwhelm defenses through sheer speed and volume."
 zombie_brute: "Brute Strain"
 zombie_brute_desc: "A heavily mutated strain that produces larger, more resilient zombies. Brutes absorb tremendous punishment and crash through defensive lines.\n\n§GDesigner Hint: Brutes provide high Defense, Breakthrough, Strength, and more Hard Attack than other zombie strains. Use them as slow assault troops against hardened positions, but their low Speed, wide Combat Width, and very large Manpower requirement limit mobility and numbers.§!"
 zombie_brute_0: "Brute Strain"
 zombie_brute_0_desc: "A heavily mutated strain that produces larger, more resilient zombies. Brutes absorb tremendous punishment and crash through defensive lines."
 zombie.12.t: "The Virus Spreads to Nigeria"
 zombie.12.d: "The plague has leapt across the continent. Port cities along the Gulf of Guinea report mass casualties as the infected swarm inland from the coast. Nigeria's vast population and dense urban centres make it fertile ground for the spreading horror. West Africa may never be the same."
 zombie.12.a: "Acknowledge the Threat"
 zombie.13.t: "The Virus Spreads to Brazil"
 zombie.13.d: "A Amazônia não oferece nenhuma barreira. A infecção surge em São Paulo e no Rio de Janeiro simultaneamente, devorando as maiores cidades da América do Sul com uma velocidade assustadora. Milhões de civis em pânico entopem as rodovias em direção ao interior, carregando o vírus consigo sem saber."
 zombie.13.a: "Reconhecer a Ameaça"
 zombie.14.t: "O Vírus se espalha pela Turquia"
 zombie.14.d: "Com os pés em dois continentes, a Turquia se torna a ponte entre a infecção oriental e a Europa. Pandemias irrompem em Istambul e Ancara enquanto as autoridades se esforçam para conter o que rapidamente se torna incontrolável. O Bósforo, antes símbolo de conexão, agora carrega apenas a morte."
 zombie.14.a: "Reconhecer a Ameaça"
 zombie.15.t: "A Horda Evolui"
 zombie.15.d: "The virus is changing. Scouts report a new breed of infected among our ranks: faster, more savage variants that move in packs, and larger, more resilient specimens that shrug off small arms fire. The horde grows more dangerous by the day."
 zombie.15.a: "Reconhecer a Evolução"
 ZOM_cure_developed: "Protótipo da Cura Zumbi"
 ZOM_cure_developed_desc: "Nossos cientistas desenvolveram uma cura experimental para o vírus zumbi. Distribuída através das cadeias de suprimentos da coalizão, a vacina concede a todas as forças que combatem os mortos-vivos uma nítida vantagem em combate."
 ZOM_research_cure: "Desenvolver a Cura"
 ZOM_research_cure_desc: "A maior ameaça que a humanidade já enfrentou exige o nosso maior esforço científico. Ao unirmos nossos recursos e conhecimentos, poderemos ser capazes de desenvolver uma cura ou vacina que possa virar a maré desta guerra. Após a conclusão, todas as nações que combatem a Horda de Zumbis receberão um bônus de combate."
 ZOM_establish_safe_zones: "Estabelecer Zonas Seguras"
 ZOM_establish_safe_zones_desc: "Designar e fortificar zonas seguras para civis a fim de proteger os não combatentes e manter a ordem pública. Corredores de evacuação organizados e abrigos fortificados comprarão tempo e estabilizarão a frente interna."
 ZOM_develop_a_cure: "Desenvolver a Cura"
 ZOM_develop_a_cure_desc: "Financiar e concluir a decisão \"Desenvolver uma Cura\". Com o sucesso, todas as nações que combatem a Horda de Zumbis recebem um bônus de combate contra os mortos-vivos."
 ZOM_protect_civilian_population: "Proteger a População Civil"
 ZOM_protect_civilian_population_desc: "Manter a estabilidade acima de 60% para garantir a segurança civil e a coesão social."
 ZOM_global_mobilization: "Mobilização Global"
 ZOM_global_mobilization_desc: "Expanda a Coalizão Anti-Zumbi para pelo menos 8 nações membros."
 ZOM_defeat_the_zombie_horde: "Derrotar a Horda Zumbi"
 ZOM_defeat_the_zombie_horde_desc: "Eliminar a Horda Zumbi e finalizar a ameaça a humanidade."
 the_horde_spreads: "A Horda se espalha"
 ZOM_apocalypse_countdown_1yr: "A Pandemia se aproxima"
 ZOM_apocalypse_countdown_1yr_desc: "Relatos de um patógeno misterioso estão surgindo em todo o globo. Agências de inteligência estimam que falta um ano para que a situação se torne insustentável."
 ZOM_apocalypse_countdown_2yr: "A Pandemia se aproxima"
 ZOM_apocalypse_countdown_2yr_desc: "Relatos perturbadores vindos de regiões remotas descrevem um patógeno diferente de tudo o que já se viu antes. Especialistas acreditam que temos dois anos para nos preparar antes que ele atinja massa crítica."
 ZOM_apocalypse_countdown_3yr: "A Pandemia se aproxima"
 ZOM_apocalypse_countdown_3yr_desc: "Incidentes isolados de violência inexplicada e reanimação foram relatados. Cientistas estimam que faltam três anos para que o vírus mude para sua forma final e imparável."
 zombie_capitulation.1.t: "O Dragão Vermelho Falha"
 zombie_capitulation.1.d: "The most populous nation on Earth has been consumed. China's vast armies, its Great Wall, its billion-strong population. None of it mattered. Beijing fell in days, Shanghai in hours. The sheer density of China's cities turned them into slaughterhouses, and now over a billion corpses march under the banner of the Horde. If China could not hold, what hope remains for the rest of us?"
 zombie_capitulation.1.a: "Aceitar a Derrota"
 zombie_capitulation.1.b: "Preparar-se para o Pior"
 zombie_capitulation.2.t: "Rússia Derrotada"
 zombie_capitulation.2.d: "O maior país da Terra sucumbiu à praga dos mortos-vivos. A extensão infindável de tundra congelada e florestas densas da Rússia, antes considerada uma fortaleza natural contra a Horda, mostrou-se inútil contra um inimigo que não sente frio, não se cansa e não para. As defesas de Moscou desmoronaram e o Kremlin permanece em silêncio. A Horda agora domina um território que se estende da Europa até o Pacífico."
 zombie_capitulation.2.a: "Aceitar a Derrota"
 zombie_capitulation.2.b: "Preparar-se para o Pior"
 zombie_capitulation.3.t: "Estados Unidos Derrotados"
 zombie_capitulation.3.d: "The last superpower has fallen. The United States, with all its military might, its nuclear arsenal, and its oceans of separation, could not stop the tide. The Eastern Seaboard was overrun first, then the heartland, and finally the holdouts in the Rockies went silent. The Stars and Stripes no longer flies over Washington. For many, this marks the true end of human civilization as it was known."
 zombie_capitulation.3.a: "Aceitar a Derrota"
 zombie_capitulation.3.b: "Preparar-se para o Pior"
 zombie_countdown_decision_category: "Zombie Apocalypse Countdown"
 zombie_countdown_decision_category_desc: ""
 zombie_coalition_decision_category: "The Horde Decisions"
 zombie_coalition_decision_category_desc: ""
 zombie.8.d.africa: "The dead walk the Earth. The Zombie Horde has erupted in Central Africa and is rapidly consuming our population through infection and direct predation. Experts have named the conflict \"The Outbreak\", but the war for human survival has only begun. Already, desperate nations are closing their borders."
 zombie.8.d.east_asia: "The dead walk the Earth. The Zombie Horde has emerged on the Korean Peninsula and is rapidly consuming our population through infection and direct predation. Experts have named the conflict \"The Outbreak\", but the war for human survival has only begun. Already, desperate nations are closing their borders."
 zombie.8.d.multiple: "The dead walk the Earth. The Zombie Horde has erupted simultaneously across three continents, striking India, Central Africa, and the Korean Peninsula at once, rapidly consuming our population through infection and direct predation. Experts have named the conflict \"The Outbreak\", but the war for human survival has only begun. Already, desperate nations are closing their borders."
 zombie_capitulation.4.t: "The Outbreak Ends"
 zombie_capitulation.4.d: "Against all expectations, humanity has prevailed. The Zombie Horde has been broken. Its territories liberated, its swarms destroyed, the last of the infected put to rest. Cities scarred by the apocalypse begin the long work of rebuilding. The world has changed forever, but it endures."
 zombie_capitulation.4.a: "Humanity Endures"
 ZOM_hold_the_line: "Hold the Line"
 ZOM_hold_the_line_desc: "Keep control of your capital until the Zombie Horde evolves. If your seat of government still stands after the first wave breaks, hope endures."
 ZOM_sanctuary: "Sanctuary"
 ZOM_sanctuary_desc: "Establish five Safe Zones to shelter the survivors. Walls, order, and a place to run are the only refuge left to the living."
 ZOM_sanctuary_completed_tt: "Establish 5 §YSafe Zones§!"
 ZOM_reclaim_the_cradle: "Reclaim the Cradle"
 ZOM_reclaim_the_cradle_desc: "Capture the heart of the outbreak: the Zombie Horde's capital. Burn out the nest where the plague was born."
 ZOM_total_eradication: "Total Eradication"
 ZOM_total_eradication_desc: "Destroy the Zombie Horde and develop a cure for the infection. Victory in the field means little while the contagion still spreads in the blood."
 ZOM_against_all_odds: "Against All Odds"
 ZOM_against_all_odds_desc: "Defeat the Zombie Horde on Extreme or Insane difficulty. Against overwhelming numbers, humanity refused to fall."
 zombies: "Zombie Horde"
 zombies_desc: "A mass of infected bodies driven forward by hunger and instinct.\n\n§GDesigner Hint: Zombie Hordes provide large, rapidly trained frontline formations with strong recovery and heavy Soft Attack. Use them to overwhelm defenders through mass, but their low Organization, poor anti-armor capability, and large Manpower requirement make each horde unwieldy.§!"