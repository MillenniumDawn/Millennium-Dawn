 MAC.Neutral_Autocracy_icon: "£MAC_Neutral_Autocracy"
 MAC.Neutral_Autocracy_desc: "澳门工会联合总会是澳门一个亲北京的劳工和政治团体。它是该市最大和最有影响力的工人团体，在43个相关工会中拥有50,000多名成员。"
