 ISR_war_between_wars_doctrine_desc: "Nossa doutrina de guerra híbrida contra a rede regional do Irã fornece a margem política e operacional para sustentar ataques e incursões encobertos."
 israel_economy.300.t: "O Inverno das Telecomunicações"
 israel_economy.300.d: "O mercado de operadoras para o qual os fabricantes de equipamentos israelenses venderam durante o boom parou de fazer pedidos. A ECI é o campeão nacional mais evidente do setor e está perdendo dinheiro; duas empresas menores de banda larga sem fio propõem se fundir em vez de fracassarem separadamente. O Estado pode deixar a reestruturação seguir seu curso ou colocar dinheiro no campeão que já tem."
 israel_economy.300.a: "Deixar o setor se consolidar sozinho"
 israel_economy.300.b: "Apoiar a ECI como campeã nacional"
 israel_economy.301.t: "A Garantia da Fab 2"
 israel_economy.301.d: "A Tower Semiconductor está construindo a única fábrica avançada de semicondutores que Israel possuiria por completo e não consegue financiar a conclusão. Garantias estatais colocariam dinheiro público por trás de uma fundição que concorre com empresas muito maiores. Recusar deixa o país com casas de projeto, engenheiros e nenhum wafer próprio."
 israel_economy.301.a: "Garantir a fábrica"
 israel_economy.301.b: "Continuar sem fábrica e financiar os projetistas"
 israel_economy.302.t: "Quanto Vale a M-Systems"
 israel_economy.302.d: "A SanDisk ofereceu 1,55 bilhão de dólares pela M-Systems, cujos engenheiros inventaram a unidade removível hoje vendida em todas as lojas. A venda seria a maior saída de uma empresa de tecnologia israelense já registrada. Insistir em vez disso na propriedade nacional significa encontrar o capital dentro do país e dizer não aos fundadores."
 israel_economy.302.a: "Deixar a venda ser concluída"
 israel_economy.302.b: "Pressionar por escala de propriedade israelense"
 israel_economy.303.t: "Os Campi"
 israel_economy.303.d: "A Intel, a Microsoft, o Google e as outras fabricantes estrangeiras de chips e empresas de software querem expandir seus centros de pesquisa em Israel e querem subsídios para isso. Os campi em Haifa e Herzliya empregam milhares de engenheiros e pagam bem, e cada um deles pertence a outra pessoa. O mesmo dinheiro poderia financiar empresas que permaneceriam israelenses e seriam menores por anos."
 israel_economy.303.a: "Cortejar os campi estrangeiros"
 israel_economy.303.b: "Financiar campeões nacionais em vez disso"
 israel_economy.304.t: "A Venda da Interconexão"
 israel_economy.304.d: "Uma empresa americana de placas gráficas ofereceu 6,9 bilhões de dólares pela Mellanox, cuja interconexão liga os processadores da maioria dos maiores computadores do mundo. É a última empresa de propriedade israelense de peso real em silício para data centers. Bloquear a venda significa que o Estado encontra o dinheiro para mantê-la e explica o motivo aos acionistas."
 israel_economy.304.a: "Permitir a venda"
 israel_economy.304.b: "Bloquear e manter a interconexão"
 israel_economy.305.t: "No Que o Setor se Transformou"
 israel_economy.305.d: "Um quarto de século decidindo o que manter e o que deixar ir definiu o destino da ECI, da M-Systems e dos campi estrangeiros: o que Israel fabrica, o que apenas projeta e quanto de cada coisa ainda possui."
 israel_economy.305.a: "Silício soberano"
 israel_economy.305.b: "A fundição e a saída"
 israel_economy.305.c: "O soberano do projeto"
 israel_economy.305.e: "Nação startup"
 ISR_electronics_sovereign_silicon: "Silício Soberano"
 ISR_electronics_sovereign_silicon_desc: "Israel possui as fábricas e manteve as empresas que projetam para elas. A produção é modesta perto dos gigantes, mas nada dela pode ser desligado por uma decisão tomada em outro lugar."
 ISR_electronics_foundry_and_exit: "A Fundição e a Saída"
 ISR_electronics_foundry_and_exit_desc: "Há wafers saindo de fábricas israelenses e as empresas que tornaram o país famoso pertencem a donos na Califórnia. Valia a pena proteger a manufatura e valia a pena vender as casas de projeto, e as duas avaliações compensaram."
 ISR_electronics_design_sovereign: "O Soberano do Projeto"
 ISR_electronics_design_sovereign_desc: "Sem fábricas, e a arquitetura é israelense. Os wafers são comprados de quem quiser vender, e a propriedade intelectual dentro deles responde a Tel Aviv."
 ISR_electronics_startup_nation: "Nação Startup"
 ISR_electronics_startup_nation_desc: "Os engenheiros estão entre os melhores do mundo e quase tudo o que constroem acaba sendo comprado por alguém no exterior. O país vive dos lucros, dos centros de pesquisa e da próxima geração de fundadores."
 ISR_infrastruc_problems_desc: "A rede ferroviária e rodoviária de Israel ficou para trás em relação a décadas de rápido crescimento populacional. O corredor de Jerusalém, o Negev e a Galileia dependem de rodovias congestionadas e de ferrovias lentas, parcialmente de via única, o que eleva os custos de construção e limita quanto desenvolvimento novo cada distrito consegue absorver.\n§W--------------§!\nEste modificador de estado será §RRemovido§! dos estados afetados se concluirmos o foco §Y$ISR_high_speed_tel_aviv_jerusalem$§!, §Y$ISR_negev_trains$§! ou §Y$ISR_galilee_railways$§!."
 jordanian_waqf_authprity_desc: "Desde a Guerra dos Seis Dias, e como formalizado no tratado de paz de 1994 com a Jordânia, a dotação religiosa jordaniana (Waqf) administra a Mesquita de Al-Aqsa e o complexo do Monte do Templo. O arranjo mantém Amã envolvida no status quo de Jerusalém, mas também ancora uma autoridade religiosa estrangeira na cidade e em sua população muçulmana.\n§W--------------§!\nEste modificador de estado será §RRemovido§! se concluirmos o foco §Y$ISR_temple_mount_saudi$§! ou §Y$ISR_amend_status_quo$§!."
 ISR_operation_failed_pal_tt: "Se a operação §Rfalhar§!, o §YHamas§! tomará a Palestina e se tornará um subordinado israelense."
 israel.92.e: "O Hamas assume o controle."
