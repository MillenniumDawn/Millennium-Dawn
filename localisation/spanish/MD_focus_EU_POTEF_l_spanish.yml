 EDU_major_non_EU_ally_desc: "Para alcanzar la autonomía estratégica necesaria para defender sus intereses colectivos, responder a los conflictos y crisis externos y proyectar seguridad en su vecindad, los estados miembros de la §YUnión Europea§! han decidido formar la §YUnión Europea de Defensa (UED)§! como alianza militar. La EDU, creada originalmente para la defensa de Europa, se ha aliado con otros países no pertenecientes a la UE para defender sus intereses comunes y mantener la paz."
