 UKR_yanuk_premier_idea: "야누코비치 정부"
 UKR_hur_reform: "HUR 개혁"
 UKR_hur_reform_desc: "효율성과 타국에 대한 영향력 행사 기회를 높이기 위해 국방정보총국 개혁을 시작할 때입니다."
 UKR_hur_opearational_support: "HUR 작전 지원"
 UKR_hur_opearational_support_desc: "HUR는 현재 정보 제공과 전선에서의 자체 부대 운용을 통해 진행 중인 작전을 지원하고 있습니다."
 UKR_hur: "국방정보총국"
 UKR_hur_desc: "HUR는 우리의 외교 정책에 활용할 수 있는 광범위한 권한과 역량을 갖추고 있습니다."
 UKR_hur_battalions: "우크라이나 HUR 대대"
 UKR_hur_battalions_desc: "우크라이나 HUR 대대는 우크라이나 지휘부의 명령에 따라 우리 편에서 전투에 참여하며, 전투가 끝나면 우리 군에서 떠날 것입니다."
 UKR_hur_decision_category: "국방정보총국"
 UKR_hur_decision_category_desc: "\n\n\n\n\n\n£UKR_desctext_hur \n\n\n\n\n\n\n\n\n우크라이나 국방부 국방정보총국은 우크라이나 정부의 군사 정보 기관입니다. 이는 우크라이나군 총참모부가 아닌 국방부의 부서입니다. 이 부처의 도움으로 우리는 인접국에서 다양한 파괴 공작을 수행하고, 파괴 대대를 이용한 출격도 할 수 있을 것입니다.\n\n\n\n현재 HUR 작전 포인트: [?hur_points]"
