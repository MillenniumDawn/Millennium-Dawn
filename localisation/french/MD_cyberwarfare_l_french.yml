 cyber_op_slot_0_counter_intrusion_tracking: "Balayage de contre-intrusion actif"
 cyber_op_slot_0_counter_intrusion_tracking_desc: "Nos équipes défensives mènent un balayage actif de tous les réseaux critiques, traquant points d'accès étrangers, outils d'intrusion cachés et charges persistantes. Le balayage s'achèvera sous 30 jours."
