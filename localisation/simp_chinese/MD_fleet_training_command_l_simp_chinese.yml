 MD_ftc_exercise_capital: "航母和水面舰艇群演习"
 MD_ftc_exercise_capital_desc: "航母打击群的训练和水面作战演练。飞行甲板循环、防空协调和海上补给等作业也同时进行演练。"
 MD_ftc_ex_capital_short: "主力舰作战理论专精提升90天"
 MD_ftc_exercise_escort: "护航演习"
 MD_ftc_exercise_escort_desc: "护卫舰、轻型护卫舰和巡逻艇进行护航和反潜演习。海上演练内容包括声呐操作、直升机协调和编队保持。"
 MD_ftc_ex_escort_short: "护航作战理论专精提升90天"
 MD_ftc_exercise_submarine: "潜艇演习"
 MD_ftc_exercise_submarine_desc: "潜艇部队进行巡逻和鱼雷发射演习。艇员们演练静默航行、规避水面护航舰艇以及协同攻击。"
 MD_ftc_ex_submarine_short: "潜艇作战理论专精提升90天"
 MD_ftc_exercise_operations: "舰队战备演习"
 MD_ftc_exercise_operations_desc: "全舰队范围内的战备周期涵盖指挥控制、后勤保障和损管。舰艇接受训练，以维持远离母港的作战行动。"
 MD_ftc_ex_operations_short: "海军行动理论专精提升90天"
 MD_ftc_staff_course_name: "参谋课程"
 MD_ftc_staff_course_short: "每位海军指挥官都会积累经验，并且可能会获得新的特质。"
 MD_ftc_staff_course_cooldown: "参谋培训课程正在进行中"
 MD_ftc_staff_course_cooldown_desc: "海军参谋人员正在参加舰队参谋课程。下一期课程将在本期学员毕业后开课。"
 MD_ftc_flag_officer_course_name: "高级军官课程"
 MD_ftc_flag_officer_course_short: "一名海军指挥官的技能等级得到提升。"
 MD_ftc_flag_officer_course_cooldown: "高级军官培训课程正在进行中"
 MD_ftc_flag_officer_course_cooldown_desc: "高级军官正在完成晋升将级指挥官的训练。这期课程结束后，即可开始新一期课程。"
 MD_ftc_rnd_liaison_name: "海军研发联络官"
