 ukraine_revolution.30.t: "Conseil suprême de Crimée"
 ukraine_revolution.30.d: "Le Conseil suprême de Crimée teste les limites de l'autorité de Kiev. Faut-il autoriser un référendum sur le statut de la péninsule ou dissoudre le conseil ?"
 ukraine_revolution.30.a: "Autoriser un référendum"
 ukraine_revolution.30.b: "Dissoudre le conseil"
 ukraine_revolution.31.t: "Moscou intervient"
 ukraine_revolution.31.d: "Kiev a ouvert une question de statut en Crimée. Moscou peut accepter un arrangement d'autonomie ukrainienne ou garantir un référendum de son cru."
 ukraine_revolution.31.a: "Accepter l'autonomie ukrainienne"
 ukraine_revolution.31.b: "Garantir le référendum"
 ukraine_revolution.32.t: "Le référendum de Crimée"
 ukraine_revolution.32.d: "Le référendum a mis l'avenir de la Crimée entre les mains de Moscou. Nous devons décider si nous reconnaissons un protectorat russe ou si nous absorbons directement la péninsule."
 ukraine_revolution.32.a: "Créer un protectorat russe"
 ukraine_revolution.32.b: "Annexer directement la Crimée"
 ukraine_revolution.33.t: "Moscou répond"
 ukraine_revolution.33.d: "Kiev a dissous le conseil de Crimée. Moscou doit décider s'il répond par la pression ou s'il se retire."
 ukraine_revolution.33.a: "Exercer une pression diplomatique"
 ukraine_revolution.33.b: "Se retirer"
 ukraine_revolution.40.t: "Avenir politique de Donetsk"
 ukraine_revolution.40.d: "La région de Donetsk exige un mot direct sur son gouvernement. Kiev doit choisir entre un règlement négocié, une répression ou une nouvelle république autonome."
 ukraine_revolution.40.a: "Négocier l’autonomie locale"
 ukraine_revolution.40.b: "Dissoudre le conseil"
 ukraine_revolution.40.c: "Autoriser une République de Donetsk"
 ukraine_revolution.40.e: "Laisser le Donbass se soulever les armes à la main"
 ukraine_revolution.41.t: "Avenir politique de Louhansk"
 ukraine_revolution.41.d: "Les conseils de Louhansk suivent l'exemple de Donetsk. Leurs revendications peuvent être contenues par le compromis, la force ou la reconnaissance d'une république."
 ukraine_revolution.41.a: "Négocier l’autonomie locale"
 ukraine_revolution.41.b: "Réprimer le mouvement"
 ukraine_revolution.41.c: "Autoriser une République de Louhansk"
 ukraine_revolution.42.t: "Avenir politique de la Crimée"
 ukraine_revolution.42.d: "Le statut de la Crimée est de nouveau contesté alors que le pays est déjà sous tension. Kiev peut reconnaître l'autonomie locale, dissoudre le conseil ou s'en remettre au processus de Crimée sous surveillance."
 ukraine_revolution.42.a: "Négocier l’autonomie locale"
 ukraine_revolution.42.b: "Dissoudre le conseil"
 ukraine_revolution.42.c: "Utiliser le processus de Crimée"
 ukraine_revolution.43.t: "Conseil de Kharkiv"
 ukraine_revolution.43.d: "Les politiciens régionaux de Kharkiv testent les limites de l'autorité de Kiev. Le gouvernement doit décider s'il négocie, réprime le conseil ou tolère une administration locale."
 ukraine_revolution.43.a: "Négocier l’autonomie locale"
 ukraine_revolution.43.b: "Réprimer le conseil"
 ukraine_revolution.43.c: "Tolérer une administration locale"
 ukraine_revolution.44.t: "Conseil de Zaporijjia"
 ukraine_revolution.44.d: "Zaporijjia exige des garanties pour ses institutions locales. Un compromis peut calmer la région, tandis que la répression peut étendre la crise."
 ukraine_revolution.44.a: "Négocier l’autonomie locale"
 ukraine_revolution.44.b: "Réprimer le conseil"
 ukraine_revolution.44.c: "Tolérer une administration locale"
 ukraine_revolution.45.t: "Les conseils du Sud"
 ukraine_revolution.45.d: "Kherson et Mykolaïv s'organisent autour de revendications de contrôle local. Leurs conseils peuvent être intégrés à un règlement ou poussés à une opposition ouverte."
 ukraine_revolution.45.a: "Négocier l’autonomie locale"
 ukraine_revolution.45.b: "Réprimer les conseils"
 ukraine_revolution.45.c: "Tolérer les administrations locales"
 ukraine_revolution.46.t: "Avenir politique d'Odessa"
 ukraine_revolution.46.d: "Le conseil d'Odessa pèse l'autonomie contre une rupture directe avec Kiev. La république d'Odessa existante est disponible si le gouvernement perd le contrôle."
 ukraine_revolution.46.a: "Négocier l’autonomie locale"
 ukraine_revolution.46.b: "Réprimer le conseil"
 ukraine_revolution.46.c: "Autoriser une République d’Odessa"
 ukraine_revolution.47.t: "Avenir politique de Dnipro"
 ukraine_revolution.47.d: "La région industrielle de Dnipro exige une voix dans le nouvel ordre politique. Kiev peut négocier, réprimer le conseil ou laisser émerger la république de Dnipro existante."
 ukraine_revolution.47.a: "Négocier l’autonomie locale"
 ukraine_revolution.47.b: "Réprimer le conseil"
 ukraine_revolution.47.c: "Autoriser une République du Dniepr"
 ukraine_revolution.48.t: "Conseil de Soumy"
 ukraine_revolution.48.d: "Les autorités locales de Soumy demandent des garanties contre les décisions prises à Kiev. Un conseil négocié est la voie la moins disruptive, mais la répression et la reconnaissance restent possibles."
 ukraine_revolution.48.a: "Négocier l’autonomie locale"
 ukraine_revolution.48.b: "Réprimer le conseil"
 ukraine_revolution.48.c: "Tolérer une administration locale"
 ukraine_revolution.49.t: "L'avenir de la Novorossia"
 ukraine_revolution.49.d: "Les républiques participantes se sont consolidées en Novorossia. Kiev doit décider s'il la reconnaît comme sujet autonome ukrainien, accepte une confédération indépendante, ou combat pour son territoire."
 ukraine_revolution.49.a: "Reconnaître un sujet autonome ukrainien"
 ukraine_revolution.49.b: "Acceptez une confédération indépendante"
 ukraine_revolution.49.c: "Combattre pour le territoire"
 ukraine_revolution.50.t: "Un congrès mémorable"
 ukraine_revolution.50.d: "Le congrès de Severodonetsk est entré dans la mémoire politique de la région. Sa demande d'une voix dans les décisions de Kiev façonne encore les institutions de la république."
 ukraine_revolution.50.a: "Consigner l'héritage"
 ukraine_revolution.51.t: "Les conseils deviennent des institutions"
 ukraine_revolution.51.d: "La vague des conseils régionaux a fait son temps. Certains ont été contenus, d'autres sont devenus des républiques, mais chacun a laissé une marque durable sur le règlement post-Maïdan."
 ukraine_revolution.51.a: "Une nouvelle carte politique"
 ukraine_revolution.52.t: "Une République prend forme"
 ukraine_revolution.52.d: "La première république régionale s'est dotée d'un gouvernement propre. Son avenir dépendra de la capacité de l'administration locale à survivre à la crise qui l'a créée."
 ukraine_revolution.52.a: "Tenir la ligne"
 ukraine_revolution.53.t: "La longue ombre de la Crimée"
 ukraine_revolution.53.d: "Le règlement de 2004 en Crimée a enfin été consigné dans l'ordre politique. La décision n'a pas mis fin à tous les litiges, mais elle a donné au statut de la péninsule une histoire qu'on ne peut ignorer."
 ukraine_revolution.53.a: "Se souvenir du règlement"
 ukraine_revolution.54.t: "Une colonie novorossiyane"
 ukraine_revolution.54.d: "Le règlement novorossien a modifié l'équilibre entre Kiev, les républiques régionales et Moscou. Le nouvel arrangement sera jugé à ce qu'il préserve, et pas seulement à ce qu'il revendique."
 ukraine_revolution.54.a: "Conserver le dossier"
 ukraine_revolution.55.t: "Territoire Libre"
 ukraine_revolution.55.d: "Des militants anarchistes au sein de la direction du nouvel État affirment que Novorossia est un nom emprunté qui ne signifie rien pour le peuple de Houliaïpole. Ils veulent faire revivre la bannière de Nestor Makhno et appeler la terre par son nom : un territoire libre."
 ukraine_revolution.55.a: "Adopter le Territoire libre"
 ukraine_revolution.55.b: "Garder le nom Novorossia"
 ukraine_regions.13.t: "Le pacte de Kharkiv"
 ukraine_regions.13.d: "La Russie propose de prolonger le bail de la flotte de la mer Noire à Sébastopol en échange d'une remise sur le gaz naturel."
 ukraine_regions.13.a: "Signer le pacte"
 ukraine_regions.13.b: "Refuser le pacte"
 ukraine_regions.14.t: "L'affaire Tymochenko"
 ukraine_regions.14.d: "L'ancienne Première ministre Ioulia Tymochenko est poursuivie pour l'accord gazier de 2009 avec la Russie. Les procureurs veulent son arrestation."
 ukraine_regions.14.a: "Arrêtez-la"
 ukraine_regions.14.b: "Laissez-la tranquille"
 ukraine_regions.15.t: "La loi sur les langues régionales"
 ukraine_regions.15.d: "Un projet de loi accordant un statut régional au russe et à d'autres langues minoritaires a franchi la Rada. Le voter plairait au Sud-Est et fâcherait les nationalistes de l'Ouest."
 ukraine_regions.15.a: "Adopter la loi"
 ukraine_regions.15.b: "Rejeter la loi"
 ukraine_our_ukraine.10.t: "Le sommet de Bucarest"
 ukraine_our_ukraine.10.d: "Au sommet de l'OTAN à Bucarest, l'Allemagne et la France ont bloqué un plan d'action pour l'adhésion de l'Ukraine. La porte de l'alliance reste ouverte en nom, mais aucun chemin pour la franchir n'a été fixé."
 ukraine_our_ukraine.10.a: "Continuez à courtiser l’OTAN"
 ukraine_our_ukraine.10.b: "Dénoncer le camouflet"
 UKR_hur_can_attack: "Le gouvernement soutient les opérations du HUR, la réforme du HUR est achevée, et au moins une unité du HUR a été levée"
 UKR_YUSHENKO_PATH: "Voie Iouchtchenko sélectionnée par règle de jeu"
 UKR_YANUK_PATH: "Voie Ianoukovytch sélectionnée par règle de jeu"
 UKR_political_tension_tt: "La tension politique changera de §Y[?tension_change|0]§! (tension politique actuelle : §Y[?UKR.UKR_political_tension|0]§!)."
 UKR_seuar_balance: "Lutte pour l’autonomie du SEUAR"
 UKR_seuar_balance_desc: "La lutte entre les institutions de Kiev et le mouvement d'autonomie du Sud-Est ukrainien déterminera si la crise de 2004 reste politique ou produit une nouvelle république."
 UKR_seuar_kyiv_control: "Contrôle de Kyiv"
 UKR_seuar_autonomy_side: "Mouvement pour l'autonomie"
 UKR_seuar_negotiated_center: "Impasse négociée"
 UKR_seuar_negotiated_center_desc: "Ni Kiev ni le mouvement d'autonomie n'a obtenu un avantage décisif."
 UKR_seuar_kyiv_advantage: "Kyiv gagne du terrain"
 UKR_seuar_kyiv_advantage_desc: "Les contre-manifestations et la pression de l'État commencent à contenir le mouvement d'autonomie."
 UKR_seuar_kyiv_dominance: "Dominance de Kyiv"
 UKR_seuar_kyiv_dominance_desc: "Le mouvement d'autonomie est proche de l'effondrement sous une pression coordonnée de l'État."
 UKR_seuar_autonomy_advantage: "L’autonomie gagne du terrain"
 UKR_seuar_autonomy_advantage_desc: "Le mouvement d'autonomie s'organise plus vite que Kiev ne peut le contenir."
 UKR_seuar_autonomy_dominance: "Dominance de l'autonomie"
 UKR_seuar_autonomy_dominance_desc: "Le mouvement d'autonomie a assez de soutien pour exiger une république autonome formelle."
 UKR_separatist_crisis_category: "Crise séparatiste"
 UKR_separatist_crisis_category_desc: "[UKR.GetFlag]L'§YUkraine§! doit contenir les conseils régionaux et les mouvements séparatistes sans transformer chaque litige local en guerre."
 UKR_separatist_fund_negotiations: "Financer les négociations régionales"
 UKR_separatist_fund_negotiations_desc: "Dépenser les fonds du Trésor pour des médiateurs locaux et des concessions avant que les conseils ne deviennent des républiques."
 UKR_separatist_internal_security: "Déployer la sécurité intérieure"
 UKR_separatist_internal_security_desc: "Utiliser les forces de sécurité intérieure pour tenir les bâtiments gouvernementaux et contenir les organisateurs séparatistes."
 UKR_separatist_recognize_councils: "Reconnaître les conseils autonomes"
 UKR_separatist_recognize_councils_desc: "Reconnaître l'autorité des conseils en échange de leur conformité et de la fin de la confrontation immédiate."
 UKR_novorossiya_form: "Consolider Novorossiya"
 UKR_novorossiya_form_desc: "Rassembler les républiques participantes et les conseils soutenus sous le tag Novorossia existant."
 UKR_novorossiya_recognize: "Reconnaître l'autonomie de la Novorossiya"
 UKR_novorossiya_recognize_desc: "Accepter la Novorossia comme sujet autonome ukrainien tant qu'elle reste en paix et contrôle du territoire."
 UKR_separatist_crisis_active_tt: "La vague des républiques régionales de 2014 est active."
 UKR_separatist_treasury_tt: "Le Trésor doit contenir assez de fonds pour cette action."
 SOV_backed_seuar: "La Russie a soutenu le mouvement SEUAR"
 UKR_crimea_2004_resolution: "Le processus de statut de la Crimée de 2004 a commencé"
 UKR_crimea_2004_pending: "Le référendum de Crimée de 2004 est en attente"
 UKR_crimea_2004_departed: "La Crimée a quitté l'Ukraine en 2004"
 UKR_orange_2004_started: "La crise politique de 2004 a commencé"
 UKR_orange_2004_resolved: "La crise politique de 2004 a été résolue"
 CRM_2004_content_unlocked: "L'administration de Crimée de 2004 est active"
 UKR_provisional_republic_focus_setup: "L'administration de la république provisoire est active"
 UKR_crimea_2004_status: "Régler le statut de la Crimée"
 UKR_crimea_2004_status_desc: "Le Conseil suprême de Crimée défie Kiev tandis que Moscou soutient le mouvement d'autonomie du Sud-Est. Décider comment traiter la Crimée avant que la crise ne s'élargisse."
 SOV_seuar_intervention_category: "Soutenir le Sud-Est"
 SOV_seuar_intervention_category_desc: "Moscou peut influencer la lutte d'autonomie du Sud-Est ukrainien, au risque de transformer une crise politique en guerre."
 UKR_seuar_counter_protests: "Soutenir les contre-manifestations locales"
 UKR_seuar_counter_protests_desc: "Soutenir des manifestations locales qui rejettent le mouvement d'autonomie et rétablissent l'influence de Kiev."
 UKR_seuar_internal_troops: "Déployer les troupes intérieures"
 UKR_seuar_internal_troops_desc: "Utiliser les troupes du ministère de l'Intérieur pour sécuriser les bâtiments publics et faire pression sur le mouvement d'autonomie."
 UKR_seuar_special_operations: "Mener les opérations SBU-HUR"
 UKR_seuar_special_operations_desc: "Utiliser le renseignement et les opérations spéciales pour perturber le mouvement d'autonomie. Cela augmente le risque d'intervention russe."
 UKR_seuar_reintegrate: "Offrir un compromis constitutionnel"
 UKR_seuar_reintegrate_desc: "Offrir à la SEUAR un compromis constitutionnel et la réintégrer à l'Ukraine."
 UKR_seuar_force: "Forcer la question de l'autonomie"
 UKR_seuar_force_desc: "Mettre fin par la force à l'arrangement d'autonomie. Cela peut provoquer une guerre frontalière et une intervention russe."
 SOV_seuar_fund_movement: "Financer le mouvement d'autonomie"
 SOV_seuar_fund_movement_desc: "Fournir un soutien politique et financier aux organisateurs de la SEUAR."
 SOV_seuar_suborn_units: "Unités locales suborn"
 SOV_seuar_suborn_units_desc: "Encourager les unités ukrainiennes locales à bloquer les ordres ou à se ranger du côté du mouvement d'autonomie."
 SOV_seuar_send_volunteers: "Envoyer des bénévoles"
 SOV_seuar_send_volunteers_desc: "Envoyer des volontaires des régions frontalières pour défendre le mouvement d'autonomie."
 UKR_seuar_active_tt: "La lutte d'autonomie de la SEUAR est active."
 UKR_seuar_treasury_tt: "Le Trésor doit contenir assez de fonds pour cette action."
 SOV_seuar_treasury_tt: "Le Trésor doit contenir assez de fonds pour cette action."
 UKR_pro_russian_support_30_tt: "La Russie détient au moins §Y30 %§! d'influence sur l'Ukraine"
 UKR_seuar_counter_protests_tt: "Fait basculer la lutte d'autonomie vers Kiev de §R0.10§! et coûte de la stabilité."
 UKR_seuar_internal_troops_tt: "Coûte §R3§! au Trésor, fait basculer la lutte vers Kiev de §R0.15§!, et coûte de la stabilité."
 UKR_seuar_special_operations_tt: "Coûte §R5§! au Trésor, fait basculer la lutte vers Kiev de §R0.08§!, et coûte de la stabilité."
 UKR_seuar_reintegration_tt: "La SEUAR sera réintégrée. L'Ukraine gagne de l'influence russe et la tension baisse de §G15§!."
 UKR_seuar_force_tt: "La SEUAR deviendra indépendante et une guerre frontalière limitée commencera."
 UKR_seuar_intervention_risk_tt: "L'intervention russe devient possible si la guerre continue."
 UKR_seuar_no_intervention_tt: "Moscou peut rester en dehors du conflit."
 SOV_seuar_fund_movement_tt: "Coûte §R5§! au Trésor et fait basculer la lutte vers l'autonomie de §G0.10§!."
 SOV_seuar_suborn_units_tt: "Coûte §R4§! au Trésor, fait basculer la lutte vers l'autonomie de §G0.12§!, et augmente l'escalade."
 SOV_seuar_send_volunteers_tt: "Coûte §R8§! au Trésor, fait basculer la lutte vers l'autonomie de §G0.18§!, et augmente l'escalade."
 UKR_prp_provisional_administration: "Établir une administration provisoire"
 UKR_prp_provisional_administration_desc: "La nouvelle république a besoin d'une administration fonctionnelle avant que la crise ne se durcisse en division permanente."
 UKR_prp_local_security: "Organiser la sécurité locale"
 UKR_prp_local_security_desc: "Des comités de sécurité locaux peuvent réduire le désordre sans transformer chaque litige politique en guerre."
 UKR_prp_volunteer_forces: "Lever des forces bénévoles"
 UKR_prp_volunteer_forces_desc: "Des volontaires défendront la république tant que ses institutions et ses forces régulières restent inéprouvées."
 UKR_prp_utilities_repair: "Réparer les services publics et les routes"
 UKR_prp_utilities_repair_desc: "Réparer le réseau de transport et de services publics reconnectera les communautés qui dépendent du gouvernement provisoire."
 UKR_prp_emergency_economy: "Stabiliser l'économie d'urgence"
 UKR_prp_emergency_economy_desc: "Une petite base industrielle et une production d'urgence peuvent maintenir l'approvisionnement de la république pendant la transition."
 UKR_prp_constitutional_choice: "Choisissez un règlement constitutionnel"
 UKR_prp_constitutional_choice_desc: "Les institutions provisoires doivent décider si elles sont un pont vers Kiev, un partenaire de Moscou, ou le fondement d'un État séparé."
 UKR_prp_negotiate_kyiv: "Négocier avec Kiev"
 UKR_prp_negotiate_kyiv_desc: "Un règlement direct avec Kiev peut protéger les institutions locales tout en évitant une nouvelle confrontation armée."
 UKR_prp_seek_moscow_support: "Solliciter le soutien de Moscou"
 UKR_prp_seek_moscow_support_desc: "Moscou peut fournir un soutien diplomatique, mais accepter son appui façonnera l'alignement futur de la république."
 UKR_prp_independent_republic: "Proclamer une République indépendante"
 UKR_prp_independent_republic_desc: "Le gouvernement provisoire peut mettre fin à son statut subordonné et accepter les risques de se tenir seul."
 UKR_prp_regional_union: "Bâtir une union régionale"
 UKR_prp_regional_union_desc: "Travailler avec le règlement Novorossia existant plutôt que de créer un autre tag concurrent."
 DRP_pivdenmash_rearmament: "Redémarrer Pivdenmash"
 DRP_pivdenmash_rearmament_desc: "Les anciennes usines de fusées et de machines lourdes de Youjmach peuvent encore produire des armes, si quelqu'un est prêt à rouvrir ses ateliers."
 DRP_industrial_mobilization: "Mobiliser l'industrie de Dnipro"
 DRP_industrial_mobilization_desc: "La base industrielle de l'ère soviétique de Dnipro peut être tournée vers les besoins de la république, au détriment de ce qui reste de production civile."
 DRP_dnieper_logistics: "Logistique sécurisée sur le fleuve Dniepr"
 DRP_dnieper_logistics_desc: "Le fleuve a toujours transporté les marchandises de la région. Reconstruire ses débarcadères et ses routes d'accès maintient ce trafic sous le contrôle de la république."
 DRP_kolomoisky_purge: "Purger le réseau Kolomoïsky"
 DRP_kolomoisky_purge_desc: "Le réseau de patronage de l'oligarque traverse encore l'administration locale et les affaires. L'extirper ouvre la voie aux hommes de la république."
 DRP_state_security_consolidation: "Consolider la sécurité d'État"
 DRP_state_security_consolidation_desc: "Un véritable service de sécurité, responsable devant la république et non devant la faction qui contrôle un district donné, se fait attendre."
 DRP_moscow_alignment: "S'aligner sur Moscou"
 DRP_moscow_alignment_desc: "Formaliser des liens militaires et économiques avec Moscou échange l'indépendance d'action contre un patron qui ne laissera pas tomber la république."
 UKR_seuar_autonomy_movement: "Mouvement pour l'autonomie SEUAR"
 UKR_seuar_autonomy_movement_desc: "Un mouvement d'autonomie du Sud-Est conteste l'autorité de Kiev. Son avenir dépend de l'équilibre entre organisateurs locaux et pression de l'État."
 UKR_western_crisis_idea: "Gouvernement de l'Ukraine occidentale"
 UKR_western_crisis_idea_desc: "Les oblasts de l'ouest refusent de reconnaître l'élection frauduleuse et ont proclamé leur propre gouvernement. L'impasse paralyse la politique nationale jusqu'à ce que Kiev règle la question occidentale."
 UKR_constitutional_compromise_idea: "Compromis constitutionnel"
 UKR_constitutional_compromise_idea_desc: "Le règlement constitutionnel qui a mis fin à la crise d'autonomie décentralise un véritable pouvoir vers les régions. Il calme le Sud-Est au prix d'un gouvernement central plus faible."
 ukraine_kuchma.14.t: "Protestations dans le Sud-Est"
 ukraine_kuchma.14.d: "Après l'élection, des activistes du sud-est rejettent le règlement de Kiev et organisent le Maïdan bleu. Le mouvement menace de transformer une crise électorale en crise régionale."
 ukraine_kuchma.14.a: "La situation se dégrade"
 ukraine_kuchma.15.t: "Maïdan bleu en Ukraine"
 ukraine_kuchma.15.d: "Le Maïdan bleu demande à Moscou de reconnaître sa demande d'autonomie régionale. Le Kremlin doit décider s'il accorde un poids politique au mouvement."
 ukraine_kuchma.15.a: "Soutenir le mouvement autonomiste"
 ukraine_kuchma.15.b: "We Shouldn't Interfere"
 ukraine_kuchma.16.t: "Gouvernement du Sud-Est"
 ukraine_kuchma.16.d: "Le Maïdan bleu a formé un gouvernement de coordination et affirme que Kiev ne représente plus le sud-est. Les responsables locaux demandent un règlement politique formel."
 ukraine_kuchma.16.a: "Envoyez la police là-bas de toute urgence"
 ukraine_kuchma.17.t: "La révolution bleue"
 ukraine_kuchma.17.d: "Des délégués du Maïdan bleu proclament un projet d'autonomie de l'Ukraine du Sud-Est. Le mouvement cherche désormais un congrès plutôt qu'une déclaration immédiate d'indépendance."
 ukraine_kuchma.17.a: "La tempête a commencé"
 ukraine_kuchma.18.t: "Manifestations en Galicie"
 ukraine_kuchma.18.d: "L'élection contestée a poussé des activistes de l'ouest dans les rues. Des heurts avec la police menacent de transformer la crise présidentielle en une confrontation constitutionnelle plus large."
 ukraine_kuchma.18.a: "La situation se dégrade"
 ukraine_kuchma.19.t: "Maïdan rouge en Ukraine"
 ukraine_kuchma.19.d: "Des activistes galiciens exigent une élection honnête et demandent à la Pologne si elle soutiendra leur campagne politique. Un endossement étranger pourrait approfondir la crise."
 ukraine_kuchma.19.a: "Soutenir les forces démocratiques"
 ukraine_kuchma.19.b: "We Shouldn't Interfere"
 ukraine_kuchma.20.t: "Le gouvernement de l'Ukraine occidentale"
 ukraine_kuchma.20.d: "Des activistes de l'ouest ont formé un comité de coordination politique et refusent d'accepter le règlement électoral de Kiev. La confrontation reste politique, mais le pays devient plus difficile à gouverner."
 ukraine_kuchma.20.a: "Envoyez la police là-bas de toute urgence"
 ukraine_kuchma.21.t: "La révolution rouge"
 ukraine_kuchma.21.d: "Le Maïdan rouge annonce une campagne de résistance contre le gouvernement prorusse à Kiev. La crise reste une lutte politique, non un nouveau pays."
 ukraine_kuchma.21.a: "La tempête a commencé"
 ukraine_revolution.1.t: "La révolution orange commence"
 ukraine_revolution.1.d: "La crise électorale a atteint son point de rupture. Si le gouvernement n'agit pas, les protestations se propageront avant la fin de l'année."
 ukraine_revolution.1.a: "Ouvrir le Maïdan orange"
 ukraine_revolution.10.t: "Le congrès de Severodonetsk"
 ukraine_revolution.10.d: "Des délégués du Sud-Est ukrainien se sont réunis à Severodonetsk. Ils peuvent se limiter à un congrès historique, ou demander un processus d'autonomie formel."
 ukraine_revolution.10.a: "Tenir le congrès"
 ukraine_revolution.10.b: "Demander l'autonomie"
 ukraine_revolution.11.t: "La lutte pour l'autonomie"
 ukraine_revolution.11.d: "Le mouvement d'autonomie et Kiev ont passé des mois à se disputer le contrôle du Sud-Est. L'équilibre détermine désormais si le mouvement est réprimé, négocié, ou se voit accorder une république formelle."
 ukraine_revolution.11.a: "Trancher la lutte"
 ukraine_revolution.12.t: "SEUAR proclame son autonomie"
 ukraine_revolution.12.d: "Le congrès du Sud-Est a exigé une république autonome formelle. Kiev doit décider s'il reconnaît la nouvelle République autonome ukrainienne du Sud-Est."
 ukraine_revolution.12.a: "Reconnaître la république"
 ukraine_revolution.13.t: "Un compromis constitutionnel"
 ukraine_revolution.13.d: "Le mouvement d'autonomie est resté à l'intérieur de l'Ukraine, mais ses institutions séparées deviennent difficiles à soutenir. Un compromis constitutionnel pourrait rétablir un État ukrainien unique."
 ukraine_revolution.13.a: "Réintégrer SEUAR"
 ukraine_revolution.14.t: "Le cessez-le-feu de la SEUAR"
 ukraine_revolution.14.d: "Les combats entre l'Ukraine et la SEUAR ont épuisé les deux camps. Un cessez-le-feu laisserait la nouvelle république indépendante, mais le conflit pourrait continuer."
 ukraine_revolution.14.a: "Acceptez un cessez-le-feu"
 ukraine_revolution.14.b: "Poursuivre la guerre"
 ukraine_revolution.15.t: "Moscou envisage une intervention"
 ukraine_revolution.15.d: "L'usage de la force par l'Ukraine a porté le conflit de la SEUAR à l'attention de Moscou. Le Kremlin doit décider s'il rejoint la guerre."
 ukraine_revolution.15.a: "Maudits Russes !"
 ukraine_revolution.15.b: "Rester hors de la guerre"
 ukraine_revolution.16.t: "La guerre frontalière de la SEUAR"
 ukraine_revolution.16.d: "Kiev a rejeté l'arrangement d'autonomie et a ordonné à ses forces de mettre fin au statut séparé de la SEUAR. La décision risque de transformer la crise constitutionnelle en guerre."
 ukraine_revolution.16.a: "Mettre fin à l'autonomie"
 ukraine_revolution.17.t: "La question occidentale"
 ukraine_revolution.17.d: "Le gouvernement autoproclamé de l'Ukraine occidentale refuse toujours de reconnaître l'élection frauduleuse. Des mois d'impasse ont laissé à Kiev le choix entre concessions et force."
 ukraine_revolution.17.a: "Négocier avec l'Ouest"
 ukraine_revolution.17.b: "Réprimer"
 ukraine_revolution.20.t: "La décision d'association"
 ukraine_revolution.20.d: "L'accord d'association avec l'Union européenne est prêt pour une décision politique. Le suspendre peut mettre la rue en mouvement, tandis que le signer pourrait reporter la crise."
 ukraine_revolution.20.a: "Suspendre l'accord"
 ukraine_revolution.20.b: "Signer l'accord"
 ukraine_revolution.21.t: "L'accord reconsidéré"
 ukraine_revolution.21.d: "Des mois après la signature de l'accord d'association, les tensions politiques ont continué de monter. Le gouvernement doit désormais affronter les conséquences de son choix."
 ukraine_revolution.21.a: "Affronter les conséquences"
 UKR_seuar_sov_support_tt: "L'influence russe sur l'Ukraine augmentera, et le mouvement d'autonomie continuera."
 UKR_seuar_sov_decline_tt: "Moscou ne s'engagera pas auprès du mouvement d'autonomie."
 UKR_western_poland_support_tt: "L'influence de la Pologne sur l'Ukraine augmentera, et le mouvement politique occidental continuera."
 UKR_western_poland_decline_tt: "La Pologne ne s'engagera pas auprès du mouvement politique occidental."
 UKR_crimea_2004_permit_tt: "Le Conseil suprême de Crimée organisera un référendum de statut. Moscou décidera de sa réponse."
 UKR_crimea_2004_restrain_tt: "La Crimée restera en Ukraine en tant que république autonome."
 UKR_crimea_2004_underwrite_tt: "Moscou garantira la sécession de la Crimée vis-à-vis de l'Ukraine."
 UKR_amber_wars_category: "Les guerres de l'ambre"
 UKR_amber_wars_category_desc: "[UKR.GetFlag]§YL'Ukraine§! ferme les yeux tandis que des creuseurs dépouillent les forêts de pins de Volhynie pour l'ambre, et que les officiels locaux pèsent leur part des profits contre le coût d'une répression."
 UKR_amber_crackdown: "Réprimer les creuseurs"
 UKR_amber_crackdown_desc: "Envoyer la police et la Garde nationale dans les champs d'ambre pour vider les fosses illégales, saisir le matériel et arrêter les creuseurs. Cela n'éteindra pas le commerce pour de bon, mais cela achète à l'État un peu de calme et de recettes fiscales."
 UKR_amber_tolerate: "Tolérer le creusement"
 UKR_amber_tolerate_desc: "Laisser les officiels locaux continuer de prélever leur part officieuse et laisser les creuseurs tranquilles. L'argent circule, mais aussi le ressentiment envers un État qui n'apparaît que pour prendre sa part."
 ukraine_amber.1.t: "La République des Kopach se proclame"
 ukraine_amber.1.d: "Alors que l'autorité de l'État en Volhynie est déjà vidée par la guerre, une bande de creuseurs d'ambre et de caïds locaux déclare les fosses autour de Klesiv leur affaire. Ils l'appellent la République des Kopach, d'après le mot ukrainien pour creuseur, et posent un checkpoint sur la route de Sarny."
 ukraine_amber.1.a: "En prendre note et passer à autre chose"
 UKR_amber_resentment: "Amber Rush Anarchie"
 UKR_amber_kopach_truce: "La trêve des creuseurs"
 ukraine_amber.2.t: "La République des Kopach se dissout"
 ukraine_amber.2.d: "La république autoproclamée des creuseurs n'avait jamais eu de gouvernement à proprement parler, seulement un checkpoint et une grille de tarifs. L'ambre facile s'épuisant et la nouveauté passée, les caïds reprennent tranquillement le creusement sans le drapeau."
 ukraine_amber.2.a: "Reconnu"
 UKR_strategic_industry_chinese_capital_corridor: "Couloir de la capitale chinoise"
 UKR_strategic_industry_chinese_capital_corridor_desc: "Les capitaux chinois et l'accès aux marchés ancrent l'investissement dans les moteurs et la fabrication avancée. Le corridor apporte l'échelle, au prix de préoccupations plus aiguës de transfert de technologies et de contrôle."
 UKR_strategic_industry_independent_distributed_industry: "Industrie distribuée indépendante"
 UKR_strategic_industry_independent_distributed_industry_desc: "Un réseau d'entreprises nationales, de centres de réparation et d'ateliers dispersés donne à l'Ukraine une production résiliente et une adaptation rapide. Il excelle dans la continuité en temps de guerre, même s'il ne peut reproduire toutes les fonctions de l'industrie lourde."
 UKR_strategic_industry_renewed_post_soviet_integration: "Intégration post-soviétique renouvelée"
 UKR_strategic_industry_renewed_post_soviet_integration_desc: "La réouverture des chaînes d'approvisionnement orientales reconnecte les usines ukrainiennes aux marchés, composants et normes familiers. L'efficacité revient, avec une exposition stratégique renouvelée."
 UKR_strategic_industry_western_integrated_defense_industry: "Industrie de défense intégrée à l'Occident"
 UKR_strategic_industry_western_integrated_defense_industry_desc: "Les entreprises nationales et les entreprises stratégiques d'État sont liées aux normes occidentales, à l'investissement, aux réseaux de réparation et aux partenariats de production. L'intégration élargit les marchés et l'accès aux approvisionnements tout en liant la modernisation à la coopération alliée."
 ukraine_tech.300.a: "Préserver les combinats stratégiques"
 ukraine_tech.300.b: "Privatiser les combinats et laisser le marché décider"
 ukraine_tech.300.d: "L'indépendance a laissé à l'Ukraine Antonov, Motor Sich, Yuzhmash et les bureaux d'études autour d'eux, mais pas le marché complet ni le réseau de fournisseurs qui les avaient soutenus. Garder ensemble spécialistes et installations exigera des choix que l'État peut à peine se permettre."
 ukraine_tech.300.t: "L'héritage sans marché"
 ukraine_tech.301.a: "Conserver le réseau de moteurs postsoviétique"
 ukraine_tech.301.b: "Financer un écosystème de moteurs indépendants"
 ukraine_tech.301.d: "Ivchenko-Progress conçoit les moteurs, Motor Sich les fabrique. Le complexe lié de Zaporijjia tourne encore sur des marchés et fournisseurs hérités, forçant un choix entre garder ce réseau vivant et payer pour en construire un indépendant."
 ukraine_tech.301.t: "Des moteurs pour un empire disparu"
 ukraine_tech.302.a: "Miser davantage sur les réseaux hérités"
 ukraine_tech.302.b: "Diversifier prudemment les contrats"
 ukraine_tech.302.d: "Les commandes russes de moteurs Motor Sich et de cellules Antonov font tourner les usines, pourtant le même réseau contrôle composants, certification et clients. La diversification coûte cher maintenant, mais la dépendance amplifiera toute rupture future."
 ukraine_tech.302.t: "Les liens qui enchaînent"
 ukraine_tech.303.a: "Couper net la chaîne d'approvisionnement russe"
 ukraine_tech.303.b: "Garder ce qui fonctionne encore via des intermédiaires"
 ukraine_tech.303.d: "La rupture politique a tranché les relations industrielles russes sur lesquelles Antonov, Motor Sich et Youjmach étaient bâtis. Le choc immédiat reflète l'exposition acceptée plus tôt, et les entreprises survivantes doivent reconstruire fournisseurs, normes et marchés sous pression."
 ukraine_tech.303.t: "La rupture"
 ukraine_tech.304.a: "Bloquer la vente et garder Motor Sich ukrainien"
 ukraine_tech.304.b: "Permettre le contrôle chinois"
 ukraine_tech.304.d: "Des investisseurs liés à la Chine cherchent le contrôle de Motor Sich, mêlant propriété privée, capital étranger, technologie aéronautique et sécurité nationale en un seul litige. Les usines de Motor Sich sont stratégiques, mais ce n'est pas la même institution que le bureau d'études Ivchenko-Progress."
 ukraine_tech.304.t: "À qui appartient Motor Sich ?"
 ukraine_tech.305.a: "Un arsenal à nous, bâti sous le feu"
 ukraine_tech.305.b: "Un corridor pour le capital chinois"
 ukraine_tech.305.c: "Une industrie de défense intégrée à l'Ouest"
 ukraine_tech.305.e: "Intégration post-soviétique renouvelée"
 ukraine_tech.305.d: "Un quart de siècle de privatisations, de rupture, de capital étranger et de guerre à grande échelle a tranché ce qu'il est advenu d'Antonov, Motor Sich et Youjmach, et ce qui les a remplacés. Ce qui a survécu, ce qui a été bâti sous le feu, et à qui cela répond désormais décident ce que l'Ukraine peut fabriquer pour elle-même."
 ukraine_tech.305.t: "Ce qu'est devenue l'industrie ukrainienne"
 UKR_party_regions_inauguration: "Inauguration de Ianoukovitch"
 UKR_party_regions_inauguration_desc: "Il est temps de l'investiture de notre nouveau président."
 ukraine_tech.305.f: "Une industrie indépendante et dispersée"
 ukraine_tech.306.t: "La Mriya brûle"
 ukraine_tech.306.d: "Les troupes russes ont pris l'aéroport Antonov de Hostomel dès les premières heures, et l'An-225 Mriya, le plus grand avion jamais construit et la seule chose dont l'industrie ukrainienne était célèbre, a brûlé dans son hangar. Youjmach est à portée d'artillerie à Dnipro. La production peut être morcelée et déplacée vers l'ouest, dans de plus petits ateliers et sous terre, au prix de toutes les économies d'échelle autour desquelles les combinats étaient bâtis. Ou les usines peuvent continuer de travailler là où elles sont."
 ukraine_tech.306.a: "Disperser la production vers l'ouest et sous terre"
 ukraine_tech.306.b: "Garder les usines en activité là où elles sont"
 ukraine_tech.307.t: "Quatre millions de drones"
 ukraine_tech.307.d: "Le cluster Brave1 a transformé des ateliers de garage en pipeline d'achat, et l'Ukraine construit désormais plus de drones d'attaque en un mois que la plupart des armées n'en détiennent. Rheinmetall et Baykar veulent tous deux des coentreprises sur le sol ukrainien, qui apporteraient capital, normes et carnets de commandes OTAN. L'État peut tout verser dans la base nationale de drones et de missiles qu'il possède déjà, ou céder une part pour s'intégrer à la production alliée."
 ukraine_tech.307.a: "Financer la base souveraine de drones et de missiles"
 ukraine_tech.307.b: "Prendre les coentreprises et les carnets alliés"
 UKR_strategic_industry_wartime_drone_arsenal: "Arsenal de drones en temps de guerre"
 UKR_strategic_industry_wartime_drone_arsenal_desc: "L'Ukraine construit ses propres drones et missiles dans des centaines d'ateliers dispersés qu'aucune frappe unique ne peut fermer. La capacité est nationale, l'itération se mesure en semaines, et personne d'autre ne détient un veto sur ce qui est construit."
 UKR_lahuna_recon_ship_idea_1: "Navire de reconnaissance Simferopol"
 UKR_lahuna_recon_ship_idea_1_desc: "Une coque qui ressemble à un bateau de pêche, à l'écoute de tout ce qui se trouve à l'horizon."
 UKR_lahuna_recon_ship_idea_2: "Navire de reconnaissance Simferopol"
 UKR_lahuna_recon_ship_idea_2_desc: "Une coque qui ressemble à un bateau de pêche, à l'écoute de tout, même au-delà de l'horizon."
 UKR_lahuna_recon_ship_idea_3: "Navire de reconnaissance Simferopol"
 UKR_lahuna_recon_ship_idea_3_desc: "Une coque spécialement construite qui ressemble à un navire civil, à l'écoute de tout ce qui se trouve à l'horizon."
 UKR_lahuna_recon_ship_idea_4: "Navire de reconnaissance Simferopol"
 UKR_lahuna_recon_ship_idea_4_desc: "Une coque spécialement construite qui ressemble à un navire civil, à l'écoute de tout, même au-delà de l'horizon."
 UKR_lahuna_recon_ship: "Suite de capteurs de classe Lahuna"
 UKR_reorganize_navy_category: "Réorganiser la marine ukrainienne"
 UKR_reorganize_navy_category_desc: "\n\n\n\n\n\n£UKR_desctext_reorganize_navy\n\n\n\n\n\n\n\n\nCes décisions aideront à réorganiser et améliorer notre marine. Cependant, certains choix peuvent avoir des effets négatifs imprévus."
 UKR_reorganize_navy_finish_ternopil_construction: "Terminer la construction de la corvette §GTernopil §YProjet 1124MU§!"
 UKR_reorganize_navy_finish_ternopil_construction_desc: "Allouer un budget pour achever enfin la construction de la corvette §Y'Ternopil'§! de type Projet 1124MU."
 UKR_reorganize_navy_choose_future_corvette: "Choisir le futur type de corvette principale"
 UKR_reorganize_navy_choose_future_corvette_desc: "Nous pouvons définir la taille et le type préférables pour nos futures corvettes, véritables bêtes de somme de notre marine."
 UKR_reorganize_navy_build_project_58250_corvette: "Lancer la production des corvettes §YProjet 58250§! §GClasse 'Volodymyr Velykyi'§!"
 UKR_reorganize_navy_build_project_58250_corvette_desc: "\n\n\n\n\n\n£UKR_desctext_for_tooltip_project_58250\n\n\n\n\n\n\n\n\nLa classe §Y'Volodymyr Velykyi'§! est une série de corvettes polyvalentes commandées pour la marine ukrainienne. Plus grandes qu'une corvette classique mais plus petites qu'une frégate, elles représentent l'avenir de notre flotte de surface."
 UKR_reorganize_navy_restore_1124: "Examiner §G2 corvettes §YProjet 1124§! pour une réactivation possible"
 UKR_reorganize_navy_restore_1124_desc: "Tenter de remettre en service les corvettes §Y'Sumy'§! et §Y'Kherson'§!, sabotées par la partie russe lors du partage de la flotte en 1997."
 UKR_reorganize_navy_buy_lithuanian_1124: "Exprimer le souhait d'acheter §G2 corvettes §YProjet 1124§! à la Lituanie"
 UKR_reorganize_navy_buy_lithuanian_1124_desc: "Requête diplomatique pour acquérir les corvettes §YF11 'Žemaitis'§! et §YF12 'Aukštaitis'§!. Bien qu'anciennes, elles sont de même type que celles que nous opérons déjà, facilitant l'entretien mais réduisant les fonds pour des navires neufs."
 UKR_reorganize_navy_maintain_1135: "Entretenir les §G3 frégates §YProjet 1135§!"
 UKR_reorganize_navy_maintain_1135_desc: "Financer la remise en service des frégates §Y'Sevastopol'§!, §Y'Mykolayiv'§! et §Y'Dnipropetrovsk'§! reçues lors du partage de la flotte de la mer Noire mais laissées à l'abandon faute de moyens."
 UKR_reorganize_navy_maintain_1241: "Maintenir le §G3 §YProjet 1241§! petites corvettes§!"
 UKR_reorganize_navy_maintain_1241_desc: "\n\n\n\n\n\n£UKR_desctext_project_1241_for_tooltip\n\n\n\n\n\n\n\n\nNous pouvons financer notre marine pour assurer une maintenance correcte et remettre en service actif 3 de nos petites corvettes du « projet 1241 ».\nEn 1997, lors du partage de la flotte de la mer Noire, l'Ukraine a reçu 4 corvettes de type « projet 1241 » dans 2 rôles différents : 2 vedettes lance-missiles, §YU155 « Nikopol »§! et §YU156 « Kremenchuk »§!, et 2 petites corvettes ASM : §YU207 « Oujhorod »§! et §YU208 « Khmelnytskyï »§!. Seule la vedette lance-missiles §YU155 « Nikopol »§! a été transférée en bon état ; les 3 autres bâtiments ont été livrés en état de non-prêt au combat et, faute de fonds pour les réparations et le rétablissement de la préparation technique, ils ne sont toujours pas en service actif."
 UKR_reorganize_navy_maintain_641_submarine: "Entretenir le sous-marin §GZaporijjia §YProjet 641§!"
 UKR_reorganize_navy_maintain_641_submarine_desc: "Allouer des fonds pour remplacer les batteries et réparer notre unique sous-marin, l'§YU01 'Zaporijjia'§!."
 UKR_reorganize_navy_finish_11451: "Terminer la construction de §G2 corvettes §YProjet 11451§!"
 UKR_reorganize_navy_finish_11451_desc: "Les corvettes §YU201 'Lviv'§! (finie à 95%) et §YU203 'Luhansk'§! (finie à 60%) attendent sur les cales de Féodossia depuis la chute de l'URSS. Il est temps de décider de leur sort."
 UKR_reorganize_navy_finish_ukrayina: "Terminer la construction du croiseur §GUkrayina§! §YProjet 1164§!"
 UKR_reorganize_navy_finish_ukrayina_desc: "Le croiseur §Y'Ukrayina'§! est un navire inachevé de classe Slava transféré à l'Ukraine en 1993. Le terminer montrerait notre véritable puissance navale en mer Noire, mais le coût sera colossal."
 UKR_reorganize_navy_finish_ternopil_construction_flag: " Décision achevée Achever la construction de la §Gcorvette§! §Yprojet 1124MU§! §GTernopil§!"
 UKR_reorganize_navy_funded_project_58250_corvette_development_flag: " Événement achevé §YPriorité aux corvettes polyvalentes§! avec l'option §GAllouons un budget§!"
 UKR_reorganize_navy_not_funded_project_58250_corvette_development_flag: " Événement achevé §YPriorité aux corvettes polyvalentes§! avec l'option §RRéduisons nos dépenses§!"
 UKR_reorganize_navy_developed_project_58250_corvette_development_flag: " Événement achevé §YConstruire les corvettes de classe projet 58200 « Haïdouk-21 »§!"
 UKR_reorganize_navy_repair_rivne: "Réparer le grand navire de débarquement §GRivne§! §YProjet 1171§!"
 UKR_reorganize_navy_repair_rivne_desc: "\n\n\n\n\n\n£UKR_desctext_rivne_lst_for_tooltip\n\n\n\n\n\n\n\n\nNous pouvons financer notre marine pour entretenir correctement et remettre en service actif le grand navire de débarquement §YU762 « Rivne »§! du « projet 1171 ».\nLe 10 avril 1994, un camp militaire dans le port pratique du port maritime d'Odessa a été saisi de force par une compagnie d'assaut aéroporté ukrainienne de Bolhrad, où se trouvaient le « Ilya Azarov » du « projet 1171 » et le BDC SDK-137 du « projet 773 », et le 18 avril 1994, par un acte unilatéral, le navire a été accepté dans la marine des forces armées d'Ukraine.\nMalheureusement, faute de fonds pour les réparations et le rétablissement de la préparation technique, le plus grand navire est devenu inutilisable comme plateforme de BDC, a été reclassé en transport militaire de marchandises sèches et est actuellement en non-prêt au combat.\nNous pouvons allouer des fonds pour procéder à la réparation du navire et le ramener en service actif comme BDC ou au moins comme navire de soutien."
 UKR_reorganize_navy_repair_support_ships: "Réparer §G4§! navires de §Ysoutien§! et de §Yréparation§!, actuellement en non-prêt au combat"
 UKR_reorganize_navy_repair_support_ships_desc: "\n\n\n\n\n\n£UKR_desctext_support_ships_for_tooltip\n\n\n\n\n\n\n\n\nNous pouvons financer notre marine pour entretenir correctement et remettre en service actif quelques navires de soutien, comme le grand pétrolier de mer §YU757 « Makiïvka »§!, le pétrolier moyen §YU758 « Kertch »§!, le petit pétrolier §YU759 « Bakhmach »§! et l'atelier flottant §Y« Olviya »§!.\nEn 2000, les quatre navires cités n'étaient plus utilisés comme unités actives faute de fonds pour les réparations et le rétablissement de la préparation technique, et furent bientôt désarmés."
 UKR_reorganize_navy_build_lahuna_recon_ship: "Projet §YLahuna§! : un navire de §Yreconnaissance§!"
 UKR_reorganize_navy_build_lahuna_recon_ship_desc: "\n\n\n\n\n\n£UKR_desctext_simferopol_recon_for_tooltip\n\n\n\n\n\n\n\n\nLa marine veut un navire de renseignement d'origine électromagnétique et n'a pas d'argent pour un bâtiment conçu à cet effet. Kouznia na Rybalskomu a une coque de chalutier, une cale et quatre décennies d'expérience à construire encore et encore le même bateau de 1 220 tonnes.\n\nCinquante-cinq mètres, 29 hommes d'équipage, 7 200 milles d'autonomie, vingt-huit jours en mer. Son arme, c'est la ferme d'antennes."
 UKR_lahuna_needs_kuznya_tt: "Nous devons contrôler le chantier naval de Kyiv"
 UKR_lahuna_needs_black_sea_port_tt: "Nous devons posséder un port de mer Noire pour la recevoir"
 UKR_lahuna_progress_tt: "Les progrès de la construction de Lahuna augmentent"
 ukraine_reorganize_navy_restore_1124.1.name: "Réactivation de 2 corvettes 'Projet 1124'"
 ukraine_reorganize_navy_restore_1124.1.desc: "Nous avons examiné les coques de deux corvettes du 'Projet 1124', le 'Soumy' et le 'Kherson'. Nous devons maintenant décider de leur sort.\nNous pouvons soit investir davantage pour réactiver les deux navires, soit démanteler le 'Kherson', dont l'état est plus préoccupant, afin d'utiliser ses pièces pour remettre en service le 'Soumy' plus rapidement."
 ukraine_reorganize_navy_restore_1124.1.a: "Réactiver les deux vaisseaux"
 ukraine_reorganize_navy_restore_1124.1.b: "Cannibaliser le Kherson pour réactiver le Soumy"
 ukraine_reorganize_navy_choose_future_corvette.1.name: "Programme de la future corvette ukrainienne"
 ukraine_reorganize_navy_choose_future_corvette.1.desc: "Nous sommes arrivés à un point où le choix du futur bourreau de travail de notre flotte ne peut plus être reporté.\nNous pouvons choisir parmi plusieurs conceptions nationales, mais la décision principale porte sur le type de corvette sur lequel concentrer nos ressources : des corvettes légères de 700 tonnes, des corvettes standard de plus de 1 200 tonnes ou des corvettes polyvalentes lourdes de plus de 2 000 tonnes."
 ukraine_reorganize_navy_choose_future_corvette.1.a: "Corvettes légères"
 ukraine_reorganize_navy_choose_future_corvette.1.b: "Corvettes standards"
 ukraine_reorganize_navy_choose_future_corvette.1.c: "Corvettes polyvalentes"
 ukraine_reorganize_navy_choose_future_corvette.2.name: "Priorité aux petites corvettes"
 ukraine_reorganize_navy_choose_future_corvette.2.desc: "Nous avons choisi l'option la moins coûteuse et allons procéder avec la classe 'Muson' comme nouvel ajout à la flotte.\nSélectionnons le nombre de navires à construire."
 ukraine_reorganize_navy_choose_future_corvette.2.a: "16 navires (4x4)"
 ukraine_reorganize_navy_choose_future_corvette.2.b: "12 navires (4x3)"
 ukraine_reorganize_navy_choose_future_corvette.2.c: "8 navires (2x4)"
 ukraine_reorganize_navy_choose_future_corvette.3.name: "Priorité aux corvettes standard"
 ukraine_reorganize_navy_choose_future_corvette.3.desc: "Nous avons choisi l'option la plus équilibrée et allons procéder avec des corvettes de taille standard.\nSélectionnons la classe exacte de navires à construire."
 ukraine_reorganize_navy_choose_future_corvette.3.a: "Projet 58200 Classe « Hayduk-21 »"
 ukraine_reorganize_navy_choose_future_corvette.3.b: "Classe 'Mistral-1500T'"
 ukraine_reorganize_navy_choose_future_corvette.3.c: "Classe « Mirazh »"
 ukraine_reorganize_navy_choose_future_corvette.4.name: "Priorité aux corvettes polyvalentes"
 ukraine_reorganize_navy_choose_future_corvette.4.desc: "Nous avons choisi l'option la plus puissante et allons procéder avec de grandes corvettes polyvalentes.\nIl s'agira des corvettes de classe Projet 58250 'Volodymyr Velykyi'.\nMalheureusement, nous n'avons pas de modèle finalisé pour le moment, nous devrons donc allouer du temps et de l'argent pour la recherche."
 ukraine_reorganize_navy_choose_future_corvette.4.a: "Allouons le budget"
 ukraine_reorganize_navy_choose_future_corvette.4.b: "Réduisons nos dépenses"
 ukraine_reorganize_navy_choose_future_corvette.5.name: "Construire les corvettes de classe 'Hayduk-21'"
 ukraine_reorganize_navy_choose_future_corvette.5.desc: "Suite à notre appel d'offres indépendant, nous avons sélectionné la classe Projet 58200 'Hayduk-21'.\nSélectionnons le nombre de navires à construire."
 ukraine_reorganize_navy_choose_future_corvette.5.a: "12 navires (4x3)"
 ukraine_reorganize_navy_choose_future_corvette.5.b: "8 navires (4x2)"
 ukraine_reorganize_navy_choose_future_corvette.5.c: "6 navires (2x3)"
 ukraine_reorganize_navy_choose_future_corvette.6.name: "Construire les corvettes de classe 'Mistral-1500T'"
 ukraine_reorganize_navy_choose_future_corvette.6.desc: "Suite à notre appel d'offres indépendant, nous avons sélectionné la classe 'Mistral-1500T'.\nSélectionnons le nombre de navires à construire."
 ukraine_reorganize_navy_choose_future_corvette.6.a: "12 navires (4x3)"
 ukraine_reorganize_navy_choose_future_corvette.6.b: "8 navires (4x2)"
 ukraine_reorganize_navy_choose_future_corvette.6.c: "6 navires (2x3)"
 ukraine_reorganize_navy_choose_future_corvette.7.name: "Construire les corvettes de classe 'Mirazh'"
 ukraine_reorganize_navy_choose_future_corvette.7.desc: "Suite à notre appel d'offres indépendant, nous avons sélectionné la classe 'Mirazh'.\nSélectionnons le nombre de navires à construire."
 ukraine_reorganize_navy_choose_future_corvette.7.a: "12 navires (4x3)"
 ukraine_reorganize_navy_choose_future_corvette.7.b: "8 navires (4x2)"
 ukraine_reorganize_navy_choose_future_corvette.7.c: "6 navires (2x3)"
 ukraine_reorganize_navy_choose_future_corvette.8.name: "Construire les corvettes de classe 'Volodymyr Velykyi'"
 ukraine_reorganize_navy_choose_future_corvette.8.desc: "Suite à notre appel d'offres indépendant, nous avons sélectionné la classe Projet 58250 'Volodymyr Velykyi'.\nSélectionnons le nombre de navires à construire."
 ukraine_reorganize_navy_choose_future_corvette.8.a: "10 navires (2x5)"
 ukraine_reorganize_navy_choose_future_corvette.8.b: "8 navires (2x4)"
 ukraine_reorganize_navy_choose_future_corvette.8.c: "4 navires (2x2)"
 ukraine_reorganize_navy_buy_lithuanian_1124.1.name: "Résultats de la réunion avec la Lituanie\nconcernant l'achat de 2 corvettes 'Projet 1124'"
 ukraine_reorganize_navy_buy_lithuanian_1124.1.desc: "Suite à notre réunion avec nos collègues lituaniens concernant l'achat potentiel de 2 corvettes du 'Projet 1124', les résultats sont globalement positifs, la Lituanie étant favorable à cette décision.\nToutefois, ils doivent consulter la Russie pour obtenir l'approbation de cette vente et évaluer les conséquences possibles pour leur pays.\nNous faisons face à un choix : offrir plus d'argent et des opportunités commerciales pour les convaincre d'ignorer l'avis de Moscou, ou attendre l'issue naturelle de leurs consultations."
 ukraine_reorganize_navy_buy_lithuanian_1124.1.a: "Nous essaierons de les convaincre"
 ukraine_reorganize_navy_buy_lithuanian_1124.1.b: "Nous attendrons"
 ukraine_reorganize_navy_buy_lithuanian_1124.2.name: "Second tour des négociations avec la Lituanie\nconcernant l'achat des corvettes"
 ukraine_reorganize_navy_buy_lithuanian_1124.2.desc: "Les négociations précédentes n'ayant pas permis d'obtenir le résultat escompté, nous avons décidé d'intensifier nos efforts.\nÀ l'issue de ce second tour, nous avons convenu de l'achat de 2 corvettes aux conditions suivantes : expansion du commerce bilatéral, accord de fourniture d'acier et de charbon, compensation financière pour l'achat d'un nouveau navire pour la flotte lituanienne et transfert de certaines technologies militaires qui leur étaient auparavant inaccessibles.\nAcceptons-nous ces termes ?"
 ukraine_reorganize_navy_buy_lithuanian_1124.2.a: "Oui, bien sûr"
 ukraine_reorganize_navy_buy_lithuanian_1124.2.b: "Non, c'est inabordable"
 ukraine_reorganize_navy_buy_lithuanian_1124.3.name: "Résultats des consultations lituano-russes\nconcernant la vente des corvettes"
 ukraine_reorganize_navy_buy_lithuanian_1124.3.desc: "Nos partenaires lituaniens ont mené les négociations avec la partie russe concernant la vente de deux corvettes de conception soviétique.\nMalheureusement, la Russie a refusé la vente aux conditions initialement prévues, mais a exprimé le souhait de mener des consultations supplémentaires avec nous.\nDeux options s'offrent à nous : abandonner l'idée ou entamer des négociations avec la Russie selon ses propres termes."
 ukraine_reorganize_navy_buy_lithuanian_1124.3.a: "Abandonner l'achat de corvettes"
 ukraine_reorganize_navy_buy_lithuanian_1124.3.b: "Mener des négociations avec la Russie"
 ukraine_reorganize_navy_buy_lithuanian_1124.4.name: "Résultats des négociations ukraino-russes\nconcernant l'achat des corvettes"
 ukraine_reorganize_navy_buy_lithuanian_1124.4.desc: "Nous avons mené des négociations difficiles mais nécessaires avec la Russie. Malheureusement, ils ont parlé en position de force et nous n'avions aucun levier.\nLa Russie a posé un ultimatum pour autoriser la vente par la Lituanie : allocation d'espaces supplémentaires pour la flotte de la mer Noire à Sébastopol, ralentissement de notre rapprochement avec l'UE, renforcement du commerce bilatéral et compensations financières directes à la Russie.\nAcceptons-nous ces termes ?"
 ukraine_reorganize_navy_buy_lithuanian_1124.4.a: "Abandonner l'idée"
 ukraine_reorganize_navy_buy_lithuanian_1124.4.b: "Accepter les conditions de la Russie"
 ukraine_reorganize_navy_buy_lithuanian_1124.5.name: "Finalisation de l'accord d'achat des corvettes lituaniennes"
 ukraine_reorganize_navy_buy_lithuanian_1124.5.desc: "Nous avons enfin accepté toutes les conditions et pouvons procéder à l'achat et au transfert des navires.\nEn signe de respect pour les anciens propriétaires, nous avons accepté de nommer les navires 'Bratslav' et 'Volodymyr', en l'honneur de villes importantes du territoire ukrainien ayant jadis fait partie de l'État commun, le Grand-duché de Lituanie, de Ruthénie et de Samogitie."
 ukraine_reorganize_navy_buy_lithuanian_1124.5.a: "Super!"
 ukraine_reorganize_navy_maintain_1135.1.name: "Entretien de 3 frégates 'Projet 1135'"
 ukraine_reorganize_navy_maintain_1135.1.desc: "Nous avons examiné les coques des frégates 'Sébastopol', 'Mykolaïv' et 'Dnipropetrovsk'. Nous devons décider de leur avenir.\nNous pouvons soit investir pour réparer les trois navires, soit nous concentrer sur les plus modernes et performants."
 ukraine_reorganize_navy_maintain_1135.1.a: "Entretenir les 3 navires"
 ukraine_reorganize_navy_maintain_1135.1.b: "N'entretenir que « Sébastopol » et « Mykolaïv »"
 ukraine_reorganize_navy_maintain_1135.1.c: "N'entretenir que le plus moderne, « Sébastopol »"
 ukraine_reorganize_navy_finish_11451.1.name: "Achever la construction de 2 corvettes 'Projet 11451'"
 ukraine_reorganize_navy_finish_11451.1.desc: "Nous avons examiné les coques des corvettes 'Lviv' et 'Louhansk'.\nNous pouvons investir pour achever la construction des deux navires ou démanteler le 'Louhansk' pour terminer le 'Lviv' plus rapidement."
 ukraine_reorganize_navy_finish_11451.1.a: "Terminez les deux navires"
 ukraine_reorganize_navy_finish_11451.1.b: "Cannibaliser le Louhansk pour achever le Lviv"
 ukraine_reorganize_navy_maintain_1241.1.name: "Entretenir 3 petites corvettes 'Projet 1241'"
 ukraine_reorganize_navy_maintain_1241.1.desc: "Nous avons examiné 3 coques de nos petites corvettes du « projet 1241 », la vedette lance-missiles U156 « Kremenchuk » et les petites corvettes ASM U207 « Oujhorod » et U208 « Khmelnytskyï ».\nNous pouvons désormais choisir la direction la plus adaptée pour décider de leur sort.\nNous pouvons soit investir davantage et réparer les 3 navires, soit nous concentrer sur celui qui a le plus de chances d'être réparé."
 ukraine_reorganize_navy_maintain_1241.1.a: "Entretenir les 3 navires"
 ukraine_reorganize_navy_maintain_1241.1.b: "Maintenir uniquement le U208 'Khmelnytskyi'"
 ukraine_reorganize_navy_maintain_1241.2.name: "Achèvement de la réparation du bateau lance-missiles U156 Kremenchouk"
 ukraine_reorganize_navy_maintain_1241.2.desc: "Nous avons achevé la réparation de la vedette lance-missiles U156 « Kremenchuk » et elle est désormais prête au service actif.\nNous poursuivrons maintenant la réparation des petites corvettes ASM U207 « Oujhorod » et U208 « Khmelnytskyï »."
 ukraine_reorganize_navy_maintain_1241.2.a: "Super, continuons"
 ukraine_reorganize_navy_maintain_1241.3.name: "Achèvement de la réparation de la petite corvette ASM U207 Oujhorod"
 ukraine_reorganize_navy_maintain_1241.3.desc: "Nous avons achevé la réparation de la petite corvette ASM U207 « Oujhorod » et elle est désormais prête au service actif.\nNous redoublerons maintenant d'efforts pour finir la réparation de la petite corvette ASM U208 « Khmelnytskyï »."
 ukraine_reorganize_navy_maintain_1241.3.a: "Super, continuons"
 ukraine_reorganize_navy_maintain_1241.4.name: "Achèvement de la réparation de la petite corvette ASM U208 Khmelnytskyï"
 ukraine_reorganize_navy_maintain_1241.4.desc: "Nous avons achevé la réparation de la petite corvette ASM U208 « Khmelnytskyï » et elle est désormais prête au service actif.\nLes 4 petites corvettes du « projet 1241 » sont désormais en service actif."
 ukraine_reorganize_navy_maintain_1241.4.a: "Parfait, tous les navires sont prêts"
 ukraine_reorganize_navy_maintain_1241.5.name: "Achèvement de la réparation de la petite corvette ASM U208 Khmelnytskyï"
 ukraine_reorganize_navy_maintain_1241.5.desc: "Grâce au cannibalisme de pièces sur 3 autres petites corvettes du « projet 1241 », nous avons achevé plus tôt que prévu la réparation de la petite corvette ASM U208 « Khmelnytskyï ». Elle est désormais prête au service actif."
 ukraine_reorganize_navy_maintain_1241.5.a: "Good!"
 ukraine_reorganize_navy_maintain_641_submarine.1.name: "Sous-marin 'Zaporizhzhia' - recherche de batteries"
 ukraine_reorganize_navy_maintain_641_submarine.1.desc: "L'examen du 'Zaporizhzhia' révèle l'ampleur des travaux. Le problème majeur est l'absence de batteries : sans elles, le sous-marin est immobile.\nNous pouvons demander à la Russie de nous vendre des batteries en stock, chercher en Europe (notamment en Grèce) ou ordonner à notre industrie locale d'en développer un modèle national."
 ukraine_reorganize_navy_maintain_641_submarine.1.a: "Acheter à la Russie"
 ukraine_reorganize_navy_maintain_641_submarine.1.b: "Chercher en Europe"
 ukraine_reorganize_navy_maintain_641_submarine.1.c: "Développer au niveau national"
 ukraine_reorganize_navy_maintain_641_submarine_batteries_from_RUS_flag: "Événement §Y'Sous-marin Zaporizhzhia - recherche de batteries'§! terminé avec l'option §RAcheter à la Russie§!"
 ukraine_reorganize_navy_maintain_641_submarine_batteries_from_GRE_flag: "Événement §Y'Sous-marin Zaporizhzhia - recherche de batteries'§! terminé avec l'option §BChercher en Europe§!"
 ukraine_reorganize_navy_maintain_641_submarine.2.name: "Sous-marin 'Zaporizhzhia' - achat de batteries"
 ukraine_reorganize_navy_maintain_641_submarine.2.desc: "Nous avons enfin conclu un accord. Après le versement des acomptes, la livraison a été effectuée dans les délais convenus.\nNous pouvons maintenant remercier notre partenaire et poursuivre les réparations."
 ukraine_reorganize_navy_maintain_641_submarine.2.a: "Merci la Russie, poursuivre la réparation"
 ukraine_reorganize_navy_maintain_641_submarine.2.b: "Merci la Grèce, poursuivre la réparation"
 ukraine_reorganize_navy_maintain_641_submarine.3.name: "Sous-marin 'Zaporizhzhia' - développement local des batteries"
 ukraine_reorganize_navy_maintain_641_submarine.3.desc: "Développer localement des batteries pour le 'Zaporizhzhia' ne fut pas aisé. Nous y sommes parvenus, bien que les coûts soient plus élevés que prévu.\nQuoi qu'il en soit, nous pouvons poursuivre la remise en état du sous-marin."
 ukraine_reorganize_navy_maintain_641_submarine.3.a: "Nous avons atteint cette étape, poursuivre la réparation"
 ukraine_reorganize_navy_maintain_641_submarine.4.name: "Sous-marin 'Zaporizhzhia' - fin des réparations"
 ukraine_reorganize_navy_maintain_641_submarine.4.desc: "Les nouvelles batteries sont installées et l'équipement est révisé. Nous pouvons lancer les essais en mer.\nNous pouvons choisir un programme de base pour économiser des ressources ou un programme étendu pour identifier et résoudre les problèmes résiduels."
 ukraine_reorganize_navy_maintain_641_submarine.4.a: "Commencer les essais en mer de base"
 ukraine_reorganize_navy_maintain_641_submarine.4.b: "Commencer des essais en mer prolongés"
 ukraine_reorganize_navy_maintain_641_submarine_extended_sea_trials_bonus: "Fiabilité accrue suite aux essais en mer étendus du 'Zaporizhzhia'"
 ukraine_reorganize_navy_maintain_641_submarine.5.name: "Sous-marin 'Zaporizhzhia' - mise en service"
 ukraine_reorganize_navy_maintain_641_submarine.5.desc: "Achats, remplacements, entretiens et essais sont terminés. Le 'Zaporizhzhia' est enfin prêt à intégrer pleinement la marine ukrainienne !"
 ukraine_reorganize_navy_maintain_641_submarine.5.a: "Enfin !"
 ukraine_reorganize_navy_finish_ukrayina.1.name: "Achever le croiseur 'Ukrayina' - Problèmes d'équipements manquants"
 ukraine_reorganize_navy_finish_ukrayina.1.desc: "Sous le contrôle direct de notre président, nous avons enfin pris la décision d'achever la construction du croiseur 'Ukrayina', de la classe soviétique 'Projet 1164'.\nNous avons examiné la coque et dressé une liste complète des équipements manquants.\nNous devons maintenant franchir une nouvelle étape et décider de la marche à suivre : demander à la Russie l'autorisation d'acquérir les équipements d'origine (principalement les systèmes ASM et SAM) ou contacter les pays occidentaux pour étudier la possibilité de les remplacer par leurs équivalents.\nVeuillez noter que vous devez avoir une opinion d'au moins 40+ de la part des États-Unis ou 25+ de la part de la France pour solliciter de l'équipement occidental.\n\n\n§GIl s'agit de l'étape 1 sur §R3§!, §R4§! ou §R6§!§!"
 ukraine_reorganize_navy_finish_ukrayina.1.a: "Rester sur l'équipement russe d'origine"
 ukraine_reorganize_navy_finish_ukrayina.1.b: "Examiner un éventuel remplacement occidental"
 ukraine_reorganize_navy_finish_ukrayina.2.name: "Achever le croiseur 'Ukrayina' - Achat d'équipement russe"
 ukraine_reorganize_navy_finish_ukrayina.2.desc: "Ayant choisi de conserver la conception soviétique originale pour l'achèvement de l' 'Ukrayina', nous avons entamé des négociations avec la Russie pour l'acquisition des composants manquants.\nCela nous demandera beaucoup d'argent et de temps pour recevoir les éléments requis.\n\n\n§GIl s'agit de l'étape 2 sur 3§!"
 ukraine_reorganize_navy_finish_ukrayina.2.a: "Nous paierons et attendrons"
 ukraine_reorganize_navy_finish_ukrayina.3.name: "Achever le croiseur 'Ukrayina' - Équipement russe reçu"
 ukraine_reorganize_navy_finish_ukrayina.3.desc: "Enfin, les composants nécessaires ont été fournis par la Russie. Nous pouvons commencer le processus d'installation et terminer la construction. Espérons que cela ne prendra pas une éternité.\n\n\n§GIl s'agit de l'étape finale§!"
 ukraine_reorganize_navy_finish_ukrayina.3.a: "Lancer la production"
 ukraine_reorganize_navy_finish_ukrayina.4.name: "Achever le croiseur 'Ukrayina' - Remplacer les missiles"
 ukraine_reorganize_navy_finish_ukrayina.4.desc: "Nous pouvons explorer toutes les variantes d'équipements occidentaux sur le marché pour remplacer les missiles antichars soviétiques P-500 'Granit' et les missiles surface-air S-300F 'Fort' manquants.\nNous devons choisir parmi plusieurs options possibles.\n\n\n§GIl s'agit de l'étape 2 sur §R4§! ou §R6§!§!"
 ukraine_reorganize_navy_finish_ukrayina.4.a: "Choisissez les missiles américains"
 ukraine_reorganize_navy_finish_ukrayina.4.b: "Choisissez les missiles français"
 ukraine_reorganize_navy_finish_ukrayina.4.c: "Choisissez les missiles suédois"
 ukraine_reorganize_navy_finish_ukrayina.5.name: "Achever le croiseur 'Ukrayina' - Missiles américains"
 ukraine_reorganize_navy_finish_ukrayina.5.desc: "Ayant sélectionné les États-Unis comme fournisseur des nouveaux missiles pour le croiseur 'Ukrayina', nous avons entamé des négociations pour acquérir des missiles antinavires RGM-84D Harpoon Block 1C et des missiles surface-air RIM-66M-2 Block IIIA.\nCela nécessitera des investissements et du temps conséquents.\n\n\n§GIl s'agit de l'étape 3 sur §R4§!§!"
 ukraine_reorganize_navy_finish_ukrayina.5.a: "Nous paierons et attendrons"
 ukraine_reorganize_navy_finish_ukrayina.6.name: "Achever le croiseur 'Ukrayina' - Missiles français"
 ukraine_reorganize_navy_finish_ukrayina.6.desc: "Ayant sélectionné la France comme fournisseur des nouveaux missiles pour le croiseur 'Ukrayina', nous avons entamé des négociations pour acquérir des missiles antinavires Exocet MM40 Block 2 et des missiles surface-air Aster 30 Block 2.\nCela nécessitera des investissements et du temps conséquents.\n\n\n§GIl s'agit de l'étape 3 sur §R4§!§!"
 ukraine_reorganize_navy_finish_ukrayina.6.a: "Nous paierons et attendrons"
 ukraine_reorganize_navy_finish_ukrayina.7.name: "Achever le croiseur 'Ukrayina' - Missiles antinavires suédois"
 ukraine_reorganize_navy_finish_ukrayina.7.desc: "Ayant sélectionné la Suède comme fournisseur des nouveaux missiles antinavires RBS 15 Mk. III pour le croiseur 'Ukrayina', nous avons entamé des négociations pour leur acquisition.\nCela nécessitera des investissements et du temps conséquents.\n\n\n§GIl s'agit de l'étape 3 sur §R6§!§!"
 ukraine_reorganize_navy_finish_ukrayina.7.a: "Nous paierons et attendrons"
 ukraine_reorganize_navy_finish_ukrayina.8.name: "Achever le croiseur 'Ukrayina' - Remplacer les missiles surface-air"
 ukraine_reorganize_navy_finish_ukrayina.8.desc: "Après la sélection des missiles antinavires suédois ultra-modernes, nous devons encore choisir quel équipement remplacera les missiles surface-air soviétiques S-300F 'Fort'.\nDeux options s'offrent à nous.\n\n\n§GIl s'agit de l'étape 4 sur §R6§!§!"
 ukraine_reorganize_navy_finish_ukrayina.8.a: "Choisissez le bloc américain RIM-66M-2 IIIA"
 ukraine_reorganize_navy_finish_ukrayina.8.b: "Choisissez le French Aster 30 Bloc 2"
 ukraine_reorganize_navy_finish_ukrayina.9.name: "Achever le croiseur 'Ukrayina' - SAM RIM-66 américains"
 ukraine_reorganize_navy_finish_ukrayina.9.desc: "Ayant sélectionné les États-Unis comme fournisseur pour les nouveaux missiles surface-air du croiseur 'Ukrayina', nous avons entamé des négociations pour leur acquisition.\n\n\n§GIl s'agit de l'étape 5 sur §R6§!§!"
 ukraine_reorganize_navy_finish_ukrayina.9.a: "Nous paierons et attendrons"
 ukraine_reorganize_navy_finish_ukrayina.10.name: "Achever le croiseur 'Ukrayina' - SAM Aster 30 français"
 ukraine_reorganize_navy_finish_ukrayina.10.desc: "Ayant sélectionné la France comme fournisseur pour les nouveaux missiles surface-air du croiseur 'Ukrayina', nous avons entamé des négociations pour leur acquisition.\n\n\n§GIl s'agit de l'étape 5 sur §R6§!§!"
 ukraine_reorganize_navy_finish_ukrayina.10.a: "Nous paierons et attendrons"
 ukraine_reorganize_navy_finish_ukrayina.11.name: "Achever le croiseur 'Ukrayina' - Tous les équipements reçus"
 ukraine_reorganize_navy_finish_ukrayina.11.desc: "Tous les composants requis ont été fournis par les producteurs conformément aux termes convenus. Nous pouvons enfin commencer l'installation et achever la construction.\n\n\n§GIl s'agit de l'étape finale§!"
 ukraine_reorganize_navy_finish_ukrayina.11.a: "Lancer la production"
 ukraine_reorganize_navy_repair_rivne.1.name: "Réparation du BDC « Rivne » — Choisir la voie"
 ukraine_reorganize_navy_repair_rivne.1.desc: "Due to current status of 'Rivne' LST, we have to make a decision on how to proceed with the repair and maintenance of this ship.\nWe can either invest more money and repair it fully to it's original LST shape or just focus on the most critical systems to make it operational as a support transport ship."
 ukraine_reorganize_navy_repair_rivne.1.a: "Réparation en LST"
 ukraine_reorganize_navy_repair_rivne.1.b: "Réparation comme navire de soutien"
 ukraine_reorganize_navy_repair_rivne.2.name: "La réparation du Rivne en chaland de débarquement est terminée"
 ukraine_reorganize_navy_repair_rivne.2.desc: "Ayant choisi de réparer le « Rivne » comme navire de débarquement à part entière, nous avons achevé toutes les réparations et l'entretien requis et il est désormais prêt au service actif."
 ukraine_reorganize_navy_repair_rivne.2.a: "Super!"
 ukraine_reorganize_navy_repair_rivne.3.name: "La réparation du « Rivne » comme navire de soutien est achevée"
 ukraine_reorganize_navy_repair_rivne.3.desc: "Ayant choisi de réparer le « Rivne » comme navire de soutien, nous avons achevé toutes les réparations et l'entretien requis et il est désormais prêt au service actif."
 ukraine_reorganize_navy_repair_rivne.3.a: "Super!"
 ukraine_reorganize_navy_repair_support_ships.1.name: "Réparation des navires de soutien — Choisir la voie"
 ukraine_reorganize_navy_repair_support_ships.1.desc: "Due to current status of our support ships, we have to make a decision on how to proceed with the repair and maintenance of these ships.\nWe can either invest more money and repair all 4 of them or prioritize based on their importance and available funds."
 ukraine_reorganize_navy_repair_support_ships.1.a: "Nous en avons besoin de tous"
 ukraine_reorganize_navy_repair_support_ships.1.b: "1 de soutien et 1 de réparation"
 ukraine_reorganize_navy_repair_support_ships.1.c: "Nous ne pouvons en financer qu'1"
 ukraine_reorganize_navy_repair_support_ships.2.name: "Réparation des navires de soutien — Les 4 navires seront réparés"
 ukraine_reorganize_navy_repair_support_ships.2.desc: "Ayant décidé de réparer les 4 navires de soutien, il est temps de choisir la voie préférée.\nNous pouvons soit fournir à tous des chantiers dédiés actuellement à la disposition du gouvernement, et les réparer sans trop investir, soit investir davantage et les réparer plus vite en recourant à des chantiers privés supplémentaires."
 ukraine_reorganize_navy_repair_support_ships.2.a: "N'utiliser que les chantiers gouvernementaux"
 ukraine_reorganize_navy_repair_support_ships.2.b: "Payer des chantiers privés"
 ukraine_reorganize_navy_repair_support_ships.3.name: "Réparation des navires de soutien — 1 de soutien et 1 de réparation seront réparés"
 ukraine_reorganize_navy_repair_support_ships.3.desc: "Ayant décidé de réparer 1 navire de soutien et 1 navire de réparation, il est temps de choisir la voie préférée.\nNous pouvons soit fournir aux deux des chantiers dédiés actuellement à la disposition du gouvernement, et les réparer sans trop investir, soit investir davantage et les réparer plus vite en recourant à des chantiers privés supplémentaires."
 ukraine_reorganize_navy_repair_support_ships.3.a: "N'utiliser que les chantiers gouvernementaux"
 ukraine_reorganize_navy_repair_support_ships.3.b: "Payer des chantiers privés"
 ukraine_reorganize_navy_repair_support_ships.4.name: "Réparation des navires de soutien — Un seul navire sera réparé"
 ukraine_reorganize_navy_repair_support_ships.4.desc: "Ayant décidé de ne réparer qu'1 navire de soutien, il est temps de choisir la voie préférée.\nNous pouvons soit lui fournir un chantier dédié actuellement à la disposition du gouvernement, et le réparer sans trop investir, soit investir davantage et le réparer plus vite en recourant à un chantier privé supplémentaire."
 ukraine_reorganize_navy_repair_support_ships.4.a: "N'utiliser que le chantier gouvernemental"
 ukraine_reorganize_navy_repair_support_ships.4.b: "Payer un chantier privé"
 ukraine_reorganize_navy_repair_support_ships.5.name: "Réparation des navires de soutien - Les 4 navires sont réparés"
 ukraine_reorganize_navy_repair_support_ships.5.desc: "Ayant achevé la réparation des 4 navires de soutien, ils sont désormais prêts au service actif et peuvent fournir le soutien nécessaire à notre flotte."
 ukraine_reorganize_navy_repair_support_ships.5.a: "Super!"
 ukraine_reorganize_navy_repair_support_ships.6.name: "Réparation des navires de soutien — 1 de soutien et 1 de réparation sont réparés"
 ukraine_reorganize_navy_repair_support_ships.6.desc: "Ayant achevé la réparation d'1 navire de soutien et d'1 navire de réparation, ils sont désormais prêts au service actif et peuvent fournir le soutien nécessaire à notre flotte."
 ukraine_reorganize_navy_repair_support_ships.6.a: "Super!"
 ukraine_reorganize_navy_repair_support_ships.7.name: "Réparation des navires de soutien - un seul navire est réparé"
 ukraine_reorganize_navy_repair_support_ships.7.desc: "Ayant achevé la réparation d'un seul navire de soutien, il est désormais prêt au service actif et peut fournir le soutien nécessaire à notre flotte."
 ukraine_reorganize_navy_repair_support_ships.7.a: "Super!"
 ukraine_reorganize_navy_built_simferopol_recon_ship.1.name: "Simferopol — Une coque sur la cale de Rybalskyï"
 ukraine_reorganize_navy_built_simferopol_recon_ship.1.desc: "Le chantier en a mis sur cale 347 depuis 1971 et connaît les plans par cœur. Il y a un 502EM inachevé sur les voies en ce moment — un bateau de pêche, mais un bateau de pêche avec le déplacement, l'autonomie et l'endurance dont nous avons besoin.\n\nL'alternative est de poser une quille neuve aux mêmes plans 502EM plutôt que d'achever une abandonnée. Le chantier serait ravi. Le ministère des Finances non."
 ukraine_reorganize_navy_built_simferopol_recon_ship.1.a: "Convertir la coque de chalutier."
 ukraine_reorganize_navy_built_simferopol_recon_ship.1.b: "Poser une quille neuve aux mêmes plans."
 ukraine_reorganize_navy_built_simferopol_recon_ship.1.c: "La marine a des besoins plus urgents."
 ukraine_reorganize_navy_built_simferopol_recon_ship.2.name: "Simferopol — Avec quoi elle écoute"
 ukraine_reorganize_navy_built_simferopol_recon_ship.2.desc: "La coque est la partie bon marché. Le navire, ce sont ses antennes, et la question est de savoir à qui appartiennent les antennes.\n\nNos propres instituts peuvent construire le complexe passif — reconnaissance radio-technique sur plusieurs bandes, classification, goniométrie. Cela prendra plus longtemps et ce sera à nous. Un paquet ELINT occidental arriverait intégré, testé et cher, et il viendrait avec des ficelles."
 ukraine_reorganize_navy_built_simferopol_recon_ship.2.a: "Aménager un complexe domestique."
 ukraine_reorganize_navy_built_simferopol_recon_ship.2.b: "Acheter un pack ELINT occidental."
 ukraine_reorganize_navy_built_simferopol_recon_ship.3.name: "Simferopol — Descendre le Dnipro"
 ukraine_reorganize_navy_built_simferopol_recon_ship.3.desc: "Elle quitte les voies à Rybalskyï. Maintenant la partie délicate : le chantier est à Kyiv, la flotte est en mer Noire, et entre les deux six cents kilomètres de fleuve avec des ponts au-dessus.\n\nLa réponse sûre est un dock flottant tout le chemin jusqu'à Kherson et au-delà. La réponse bon marché est de la descendre sur son propre fond et d'espérer que le tirant d'eau et les gabarits aériens suffisent."
 ukraine_reorganize_navy_built_simferopol_recon_ship.3.a: "La déplacer dans un dock flottant."
 ukraine_reorganize_navy_built_simferopol_recon_ship.3.b: "La faire descendre sur sa propre coque."
 ukraine_reorganize_navy_built_simferopol_recon_ship.4.name: "Simferopol — Échoué sur le Dnipro"
 ukraine_reorganize_navy_built_simferopol_recon_ship.4.desc: "Elle est coincée en aval de Kherson avec des avaries à l'appareil propulsif et un équipage de livraison très embarrassé. Le chantier dit que ça peut se réparer. Le chantier dit toujours ça."
 ukraine_reorganize_navy_built_simferopol_recon_ship.4.a: "Payer les réparations."
 ukraine_reorganize_navy_built_simferopol_recon_ship.4.b: "La laisser à Kherson."
 ukraine_reorganize_navy_built_simferopol_recon_ship.5.name: "Simferopol - Transfert terminé"
 ukraine_reorganize_navy_built_simferopol_recon_ship.5.desc: "Nous avons enfin descendu notre plus récent navire de reconnaissance le Dnipro sans aucun accident ! Nous pouvons désormais commencer l'entraînement d'équipage, et ensuite — enfin utiliser cet atout naval précieux à notre profit."
 ukraine_reorganize_navy_built_simferopol_recon_ship.5.a: "Enfin !"
 UKR_modernize_sov_category: "Moderniser l'équipement d'héritage soviétique"
 UKR_modernize_sov_category_desc: "Nous pouvons investir du temps et des ressources dans la recherche, les essais et la mise en œuvre de modernisations de notre matériel d'époque soviétique. En améliorant les conceptions existantes avec des technologies modernes, nous pouvons prolonger leur durée de service et renforcer leurs capacités de combat. Ces programmes nous permettent de tirer le meilleur parti du vaste arsenal hérité de l'Union soviétique tout en l'adaptant progressivement aux exigences de la guerre moderne."
 UKR_develop_domestic_category: "Développer des systèmes d’armes nationaux"
 UKR_develop_domestic_category_desc: "Nous pouvons investir du temps et des ressources dans la recherche et le développement de nos propres systèmes d'armes modernes. En nous appuyant sur l'expertise d'ingénierie et les traditions industrielles de l'Ukraine, nous pouvons créer un matériel taillé pour les besoins de nos forces armées. Bâtir une industrie de défense nationale renforcera nos capacités militaires et réduira notre dépendance aux fournisseurs étrangers."
 UKR_modernize_bmp1u: "Rechercher le BMP-1U 'Shkval'"
 UKR_modernize_bmp1u_desc: "Une modernisation limitée du BMP-1 remplaçant la tourelle d'origine par le module téléopéré KBA-105 Shkval."
 UKR_modernize_bmp1m: "Rechercher le BMP-1M"
 UKR_modernize_bmp1m_desc: "Évolution du BMP-1U dévoilée en 2011.\nLa différence principale est l'utilisation du tourelleau téléopéré Shkval-A doté du système Barrier ATGM à longue portée et d'un nouveau système de visée Tandem-2."
 UKR_modernize_bmp1um: "Rechercher le BMP-1UM"
 UKR_modernize_bmp1um_desc: "Modernisation complète de 2015 remplaçant le moteur par un diesel 3TD-2 de 400 ch et améliorant l'ergonomie arrière avec une rampe."
 UKR_modernize_bmp1umd: "Rechercher le BMP-1UMD"
 UKR_modernize_bmp1umd_desc: "Évolution du BMP-1UM dotée d'un moteur Deutz plus fiable et silencieux de 330 ch."
 UKR_modernize_bmp1ts: "Rechercher le BMP-1TS"
 UKR_modernize_bmp1ts_desc: "Le BMP-1TS est une variante développée par NVK Techimpex, utilisant le module téléopéré Spys avec le système de contrôle de tir Syntez et une caméra thermique."
 UKR_modernize_bmp_m1s: "Rechercher le BMP-M1S"
 UKR_modernize_bmp_m1s_desc: "Conversion du BMP-1 avec une puissance de feu accrue, une meilleure protection et un moteur allemand Deutz, utilisant le module de combat 'Stylet'."
 UKR_modernize_bmp1m_praktyka: "Rechercher le BMP-1M 'Praktyka'"
 UKR_modernize_bmp1m_praktyka_desc: "Présenté par NVO Praktyka en 2021, ce BMP-1 modernisé dispose d'équipements modernes, d'une caisse légèrement surélevée et du module de combat 'Spys-Syntez'."
 UKR_modernize_bmp1u_flag: " Décision terminée §YRechercher le BMP-1U§!"
 UKR_modernize_bmp1m_flag: " Décision terminée §YRechercher le BMP-1M§!"
 UKR_modernize_bmp1um_flag: " Décision terminée §YRechercher le BMP-1UM§!"
 UKR_modernize_bmp1umd_flag: " Décision terminée §YRechercher le BMP-1UMD§!"
 UKR_modernize_mt_lbr6: "Rechercher le MT-LBR6"
 UKR_modernize_mt_lbr6_desc: "VCI léger sur châssis MT-LB doté du module ZTM-1 et d'une protection renforcée par un revêtement en Kevlar et des écrans anti-cumulatifs."
 UKR_modernize_mt_lbmsh: "Rechercher le MT-LBMSh"
 UKR_modernize_mt_lbmsh_desc: "VCI léger sur châssis MT-LB doté du module de combat 'Shkval' (canon de 30 mm, mitrailleuse, missiles Barrier et lance-grenades)."
 UKR_modernize_mt_lbr7: "Rechercher le MT-LBR7"
 UKR_modernize_mt_lbr7_desc: "Similaire au LBR6 mais équipé du module de combat 'Shturm' et de missiles Konkurs-M."
 UKR_modernize_mt_lb_at: "Rechercher le MT-LB-AT"
 UKR_modernize_mt_lb_at_desc: "Modification du MT-LB équipée d'une plateforme rotative blindée armée d'une mitrailleuse DShKM de 12,7 mm."
 UKR_modernize_mt_lb_t_23_2: "Rechercher le MT-LB-T-23-2"
 UKR_modernize_mt_lb_t_23_2_desc: "Option de modernisation équipée d'un bouclier blindé et utilisant le ZU-23-2 comme armement principal."
 UKR_modernize_mt_lbr6_flag: " Décision terminée §YRechercher le MT-LBR6§!"
 UKR_modernize_mt_lbr7_flag: " Décision terminée §YRechercher le MT-LBR7§!"
 UKR_modernize_mt_lbrmsh_flag: " Décision terminée §YRechercher le MT-LBMSh§!"
 UKR_modernize_brdm_2ld: "Rechercher le BRDM-2LD"
 UKR_modernize_brdm_2ld_desc: "Le BRDM-2LD est une modernisation ukrainienne du BRDM-2 (dotée de trappes de débarquement latérales et d'un moteur diesel SMD-21-08 de fabrication nationale).\nLe développement du véhicule a débuté dans le cadre du programme de R&D 'Bulb' en 1999 par le bureau d'études Morozov de Kharkiv, tandis que les travaux de modernisation ont été réalisés par l'usine de réparation mécanique de Mykolaïv.\nLors des essais sur le terrain, il a été constaté que l'installation du moteur diesel permettait d'augmenter la capacité tout-terrain dans des conditions difficiles et d'accroître l'autonomie sur route de 25% (passant de 750 à 1000 km) grâce à une réduction significative de la consommation de carburant."
 UKR_modernize_brdm_2m: "Rechercher le BRDM-2M"
 UKR_modernize_brdm_2m_desc: "Le BRDM-2M est une modernisation ukrainienne du BRDM-2. Identique au BRDM-2LD, mais conservant un moteur à essence standard.\nAinsi, les modifications concernent principalement l'ajout de trappes de débarquement latérales.\nProduit par l'usine de réparation mécanique de Mykolaïv."
 UKR_modernize_brdm_2dp: "Rechercher le BRDM-2DP"
 UKR_modernize_brdm_2dp_desc: "Modification légère dotée de portes latérales et de filets anti-cumulatifs."
 UKR_modernize_brdm_2vepr: "Rechercher le BRDM-2 'Vepr'"
 UKR_modernize_brdm_2vepr_desc: "Le BRDM-2 'Vepr' est une modernisation proposée par la société VEPR.\nLa visibilité est améliorée par des vitres blindées, le plancher est renforcé et les roues latérales ont été remplacées par de véritables portes de débarquement.\nL'armement est renforcé par une mitrailleuse de poupe à la place de l'hydrojet supprimé, et un lance-grenades automatique peut être installé à la proue."
 UKR_modernize_brdm_2l1: "Rechercher le BRDM-2L1"
 UKR_modernize_brdm_2l1_desc: "Modernisation proposée par Mykolaïv avec de nouvelles radios ukrainiennes et des pneus sans chambre à pression ajustable."
 UKR_modernize_brdm_2di: "Rechercher le BRDM-2DI 'Khazar'"
 UKR_modernize_brdm_2di_desc: "Basé sur l'expérience en Irak, ce véhicule dispose d'un moteur diesel IVECO de 138 ch, d'une caméra thermique et d'une trappe de débarquement supplémentaire."
 UKR_modernize_brdm_2t1: "Rechercher le BRDM-2T mod. 2012"
 UKR_modernize_brdm_2t1_desc: "Le BRDM-2T mod. 2012 est une modernisation ukrainienne du BRDM-2 développée par NVK Techimpex.\nDans cette version proposée en 2012, la différence majeure résidait dans le remplacement du moteur : le moteur essence GAZ-41 a été remplacé par un moteur diesel 4 cylindres en ligne D245.30E2 (permettant de réduire les risques d'incendie et la consommation), en plus d'une révision majeure du véhicule."
 UKR_modernize_brdm_2t2: "Rechercher le BRDM-2T mod. 2013"
 UKR_modernize_brdm_2t2_desc: "Le BRDM-2T mod. 2013 est une évolution proposée par NVK Techimpex.\nEn plus du moteur D245.30E2, le véhicule a été équipé d'une radio R-173, de feux de gabarit de BTR-70 et de nouveaux pneus sans chambre à air.\nLes roues auxiliaires ont été supprimées pour installer des trappes latérales trapézoïdales. La tourelle a été retirée au profit d'une installation comprenant une mitrailleuse NSVT de 12,7 mm et une PKT de 7,62 mm."
 UKR_modernize_brdm_2t3: "Rechercher le BRDM-2T mod. 2015"
 UKR_modernize_brdm_2t3_desc: "Cette variante de 2015 conserve la tourelle standard du BRDM-2 mais adopte des trappes rectangulaires type BRDM-2LD, une nouvelle boîte à cinq vitesses, des pneus Rosava R20 et une protection interne anti-fragmentation composée de cinq couches de Kevlar."
 UKR_modernize_brdm_2i: "Rechercher le BRDM-2I"
 UKR_modernize_brdm_2i_desc: "Modernisation avec un moteur diesel ISUZU de 156 ch et l'intégration du système Barrier ATGM."
 UKR_modernize_bkm_hekkon: "Rechercher le BKM 'Hekkon'"
 UKR_modernize_bkm_hekkon_desc: "Le BKM 'Hekkon' est l'une des options ukrainiennes pour la modernisation du véhicule blindé soviétique BRDM-2.\nDéveloppé en 2016 à l'initiative du groupe 'Azov' (devenu 'Arey'), il a été construit sur fonds propres.\nLe moteur essence GAZ-41 a été remplacé par un moteur diesel General Motors de 215 ch. Le blindage a été renforcé et le véhicule peut désormais transporter 9 personnes.\nLe modèle de démonstration possède une tourelle modifiée avec une mitrailleuse NSVT de 12,7 mm et une PKT de 7,62 mm."
 UKR_modernize_brm_manhust: "Rechercher le BRM 'Manhust'"
 UKR_modernize_brm_manhust_desc: "Le BRM 'Manhust' est une modification du BRDM-2 de l'usine de Mykolaïv où presque tous les composants sont ukrainiens.\nLe volume interne est nettement augmenté et la protection frontale est renforcée par des plaques additionnelles.\nIl est équipé d'un module de combat robotisé armé d'une mitrailleuse de 14,5 mm et d'une de 7,62 mm."
 UKR_modernize_brdm_2ld_flag: " Décision terminée §YRechercher le BRDM-2LD§!"
 UKR_modernize_brdm_2m_flag: "Décision achevée : §YDévelopper le BRDM-2M§!"
 UKR_modernize_brdm_2di_flag: " Décision terminée §YRechercher le BRDM-2DI 'Khazar'§!"
 UKR_modernize_brdm_2t1_flag: " Décision terminée §YRechercher le BRDM-2T mod. 2012§!"
 UKR_modernize_brdm_2t2_flag: " Décision terminée §YRechercher le BRDM-2T mod. 2013§!"
 UKR_modernize_bkm_hekkon_flag: " Décision terminée §YRechercher le BKM 'Hekkon'§!"
 UKR_modernize_brm_manhust_flag: " Décision terminée §YRechercher le BRM 'Manhust'§!"
 UKR_modernize_btr_60m: "Rechercher le programme de modernisation §YBTR-60M§!"
 UKR_modernize_btr_60m_desc: "\n\n\n\n\n\n£UKR_desctext_btr60m_for_tooltip_modernization\n\n\n\n\n\n\n\n\nLe §YBTR-60M§! est une modification ukrainienne du §YBTR-60PB§! développée par le KMDB.\nUn moteur diesel UTD-20 (300 ch) est installé.\nL'usine de Mykolaïv en a produit un prototype."
 UKR_modernize_btr_60m_choose_module: "Choisir l'arme principale pour le §YBTR-60M§! modernisé"
 UKR_modernize_btr_60m_choose_module_desc: "Nous pouvons décider de l'armement principal exact qui sera utilisé par notre transport de troupes §YBTR-60M§! modernisé."
 UKR_modernize_btr_60mk: "Rechercher le programme de modernisation §YBTR-60MK§!"
 UKR_modernize_btr_60mk_desc: "Le BTR-60MK est une proposition de la société KORT, équipée de deux moteurs diesel Cummins et d'un blindage additionnel.\nL'armement peut être remplacé par un module de combat de 1000 kg armé d'une mitrailleuse de 14,5 mm et d'un lance-grenades AGS-17."
 UKR_modernize_btr_60pb_t: "Rechercher le §YBTR-60PB-T§!"
 UKR_modernize_btr_60pb_t_desc: "Modernisation par NVK Techimpex incluant l'installation du module de combat BM-23-2, le remplacement des moteurs essence par des moteurs diesel et de nouveaux équipements électriques."
 UKR_modernize_otaman_8x8: "Rechercher l'§Y'Otaman' 8x8§!"
 UKR_modernize_otaman_8x8_desc: "Plateforme moderne de NVO Praktyka basée sur une modernisation profonde des châssis BTR-60/70, avec moteur à l'avant et protection STANAG niveau II."
 UKR_modernize_btr_60m_khorunzhyi: "Rechercher le §YBTR-60M 'Khorunzhyi'§!"
 UKR_modernize_btr_60m_khorunzhyi_desc: "Le BTR-60M Khorunzhyi est un véhicule de NVO Praktyka, constituant une modernisation profonde du BTR-60PB.\nLa caisse est en acier blindé moderne (niveau STANAG 4) et la disposition interne est totalement revue : moteur à l'avant droit, pilote à l'avant gauche et compartiment de débarquement spacieux à l'arrière."
 UKR_modernize_btr_60m_flag: " Décision terminée §YRechercher le BTR-60M§!"
 UKR_modernize_otaman_8x8_flag: " Décision terminée §YRechercher l'Otaman 8x8§!"
 UKR_modernize_btr_70m: "Rechercher le BTR-70M"
 UKR_modernize_btr_70m_desc: "Modification réalisée par le bureau Morozov pour les unités de maintien de la paix.\nLes moteurs essence sont remplacés par un diesel multi-carburant UTD-20 provenant du BMP-1, et les trappes latérales adoptent le style du BTR-80."
 UKR_modernize_btr_70m_kba2: "Rechercher le BTR-70M-KBA-2"
 UKR_modernize_btr_70m_kba2_desc: "Version équipée d'un module de combat armé d'un canon automatique KBA-2 de 30 mm."
 UKR_modernize_btr_70m_hrim: "Rechercher le BTR-70M 'Hrim'"
 UKR_modernize_btr_70m_hrim_desc: "Cette variante remplace la tourelle standard par le module de combat BM-1B 'Hrim' (canon de 30 mm, lance-grenades et système antichar Barrier)."
 UKR_modernize_btr_7: "Rechercher le BTR-7 'Zakhysnyk'"
 UKR_modernize_btr_7_desc: "Équipé de deux moteurs Iveco Tector de 150 ch chacun et d'un module de combat BUG stabilisé incluant canon, mitrailleuse, lance-grenades et missiles antichars Barrier."
 UKR_modernize_btr_70t: "Rechercher le BTR-70T"
 UKR_modernize_btr_70t_desc: "Modernisation par NVK Techimpex dotée de deux moteurs diesel D245.30E2 totalisant 312 ch et de nouvelles trappes de type BTR-80."
 UKR_modernize_varan: "Rechercher le 'Varan'"
 UKR_modernize_varan_desc: "Modernisation radicale du BTR-70 avec une toute nouvelle caisse, un moteur à l'avant et un module de combat Spys."
 UKR_modernize_btr_70m_flag: " Décision terminée §YRechercher le BTR-70M§!"
 UKR_modernize_btr_70m_kba2_flag: " Décision terminée §YRechercher le BTR-70M-KBA-2§!"
 UKR_modernize_btr_70m_hrim_flag: " Décision terminée §YRechercher le BTR-70M 'Hrim'§!"
 UKR_modernize_btr_70t_flag: " Décision terminée §YRechercher le BTR-70T§!"
 UKR_modernize_btr_80_kba2: "Rechercher le BTR-80-KBA-2"
 UKR_modernize_btr_80_kba2_desc: "Modernisation par le bureau Morozov installant un moteur diesel UTD-20 et un canon KBA-2 de 30 mm, augmentant l'efficacité au tir et l'autonomie."
 UKR_modernize_btr_80m_hrim: "Rechercher le BTR-80M 'Hrim'"
 UKR_modernize_btr_80m_hrim_desc: "Installation du module de combat BM-1B 'Hrim' sur un châssis de BTR-80."
 UKR_modernize_btr_80up: "Rechercher le BTR-80UP"
 UKR_modernize_btr_80up_desc: "Programme conjoint polono-ukrainien pour un appel d'offres en Irak, incluant une protection renforcée et de nouveaux moteurs de 300 ch."
 UKR_modernize_btr_80t: "Rechercher le BTR-80T"
 UKR_modernize_btr_80t_desc: "Modernisation par NVK Techimpex avec un moteur turbocompressé de 303 ch, une boîte à 8 vitesses et le module BM-23-2."
 UKR_modernize_btr_80_kba2_flag: " Décision terminée §YRechercher le BTR-80-KBA-2§!"
 UKR_modernize_btr_80m_hrim_flag: " Décision terminée §YRechercher le BTR-80M 'Hrim'§!"
 UKR_modernize_t55_5tdf: "Rechercher le T-55-5TDF"
 UKR_modernize_t55_5tdf_desc: "À déterminer"
 UKR_modernize_t55_5tdf_flag: " Décision terminée §YRechercher le T-55-5TDF§!"
 UKR_modernize_t55agm: "Modernisation T-55AGM"
 UKR_modernize_t55agm_desc: "Le T-55AGM est une modernisation ukrainienne du char T-55.\nLe char est équipé d'un diesel 5TDF de 700 ch, qui lui permet d'atteindre 60 km/h sur route et 40 km/h en tout-terrain.\nIl est également équipé d'un nouveau système de conduite de tir, comprenant un télémètre laser, un calculateur balistique et une visée thermique.\nLa protection blindée a été améliorée par l'installation de blindage réactif explosif Nij."
 UKR_modernize_t55agm_flag: "Décision terminée : §Ymoderniser les T-55AGM§!"
 UKR_modernize_t55m8_a2_tifon_ii: "T-55M8-A2 Tifon 2"
 UKR_modernize_t55m8_a2_tifon_ii_desc: "Le T-55M8-A2 Tifon 2 est une modernisation ukrainienne du char T-55 pour le Pérou.\nLe char est équipé d'un diesel 5TDF de 700 ch, qui lui permet d'atteindre 60 km/h sur route et 40 km/h en tout-terrain.\nIl est également équipé d'un nouveau système de conduite de tir, comprenant un télémètre laser, un calculateur balistique et une visée thermique.\nLa protection blindée a été améliorée par l'installation de blindage réactif explosif Nij."
 UKR_develop_t64bm_bulat: "Rechercher le T-64BM 'Bulat'"
 UKR_develop_t64bm_bulat_desc: "Le T-64BM 'Bulat' est une modernisation ukrainienne portant le T-64B au standard du T-84.\nÉquipé d'un blindage réactif Nizh, du missile 9K120 Refleks (code OTAN AT-11 Sniper), de la conduite de tir 1A45 Irtysh, du viseur chef TKN-4S, du viseur antiaérien PZU-7, de la vision nocturne TPN-4E Buran-E et d'un moteur 6TDF de 1 000 ch (735 kW).\nLe T-64BM 'Bulat' est la modernisation la plus récente datant de 2004."
 UKR_develop_t64e: "Rechercher le T-64E"
 UKR_develop_t64e_desc: "Le T-64E est un char de combat principal expérimental ukrainien qui constitue une modernisation profonde du T-64.\nDéveloppé à l'usine de réparation de blindés de Kharkiv (KhBTRZ).\nPar rapport aux modifications précédentes du T-64, ce char a considérablement amélioré sa puissance de feu, sa mobilité et sa protection.\nLe coût du T-64E était d'environ 1,12 million de dollars par unité en 2011."
 UKR_develop_t64bv_1: "Rechercher le T-64BV-1"
 UKR_develop_t64bv_1_desc: "Le T-64BV-1 (également connu sous le nom de T-64B1M/T-64BM1M) est une version simplifiée de la modernisation des chars T-64B1 créée en 2014 à l'usine de blindés de Kharkiv.\nLe char dispose d'une protection ERA 'Nizh' intégrée, qui renforce la tourelle, la partie frontale de la caisse et les flancs.\nUne niche pour les munitions et l'équipement est installée à l'arrière de la tourelle.\nUn moteur 5TDF équipe le char.\nC'est une option simplifiée et moins coûteuse pour la modernisation du 'Bulat'."
 UKR_develop_t64bv_2017: "Rechercher le T-64BV mod. 2017"
 UKR_develop_t64bv_2017_desc: "Le T-64BV mod. 2017 est la modernisation actuelle de la série T-64, visant à inclure une nouvelle imagerie thermique pour tout l'équipage, supprimer le projecteur infrarouge Luna et inclure le viseur nocturne ukrainien TPN-1-TPV.\nIl intègre des modules de blindage réactif 'Nizh' conçus pour remplacer ceux des tourelles T-64BV, une unité de navigation satellite en réseau SN-4215 et une radio numérique Lybid K-2RB (sous licence Motorola) assurant des communications sécurisées sur 70 km."
 UKR_develop_t64bv_2022: "Rechercher le T-64BV mod. 2022"
 UKR_develop_t64bv_2022_desc: "Le T-64BV mod. 2022 est la toute dernière modernisation de la série T-64. Le char dispose de nouvelles unités de surveillance et de visée de troisième génération et est équipé d'une nouvelle mitrailleuse lourde Snipex Laska K-2 de 12,7 mm.\nIl dispose de stations radio modernes et de systèmes de communication internes et externes répondant pleinement aux normes de l'OTAN.\nLes réservoirs de carburant extérieurs sont désormais protégés par des plaques d'acier de 12 mm."
 UKR_develop_t64_krab: "Rechercher le T-64 'Krab'"
 UKR_develop_t64_krab_desc: "Le T-64 'Krab' est un travail de recherche et développement sur la modernisation du char T-64B (T-64BV).\nLes études de conception sont réalisées par le bureau d'études Morozov de Kharkiv.\nLe travail a commencé en 2016.\nL'installation d'un moteur 6TD d'une puissance de 1 200 ch était prévue sur le T-64.\nAfin d'installer un moteur plus volumineux que celui de série, la caisse du T-64 standard doit être modifiée."
 UKR_develop_t_rex: "Rechercher le 'T-Rex'"
 UKR_develop_t_rex_desc: "Le 'T-Rex' est un concept de char de combat principal ukrainien annoncé en 2016 par le groupe d'ingénierie Arey.\nLe char serait basé sur le T-64 et disposerait d'une tourelle inhabitée.\nLes trois membres d'équipage seraient assis dans une capsule blindée à l'avant de la caisse, d'où ils contrôleraient à distance le canon, le chargeur automatique et les mitrailleuses.\nLe T-Rex pèserait 39 tonnes et serait équipé d'un canon de 125 mm.\nLe blindage utiliserait les systèmes réactifs 'Nizh' et 'Duplet'.\nLa presse ukrainienne affirmait que ses capacités dépasseraient celles de l'Oplot et du Bulat tout en étant plus rentable."
 UKR_develop_t64bm2_bulat: "Rechercher le T-64BM2 'Bulat'"
 UKR_develop_t64bm2_bulat_desc: "Le T-64BM2 (parfois appelé 'Bulat' ou 'Kedr' dans les médias) est une modernisation du char T-64 dans le cadre du programme 'Kedr'.\nC'est un démonstrateur technologique, c'est-à-dire un travail de recherche sur la remotorisation des chars de type T-64 avec le moteur 6TD-1, impliquant une refonte complète du compartiment moteur et de la transmission."
 UKR_develop_t64bm_bulat_flag: "Décision terminée §YRechercher le T-64BM 'Bulat'§!"
