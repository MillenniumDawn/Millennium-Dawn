l_simp_chinese:
 ghana.1.t: "西多哥兰宣布主权"
 ghana.1.d: "几周来，沃尔特地区的道路两旁竖立着欢迎游客来到“西多哥兰”的标语，但没有人看到是谁举起这些标语的。 1956年投票反对与黄金海岸合并的埃威运动的继承人西多哥兰复兴阵线现在宣布前英属多哥兰为主权国家，并要求在联合国主持下进行谈判。地区首领都沉默了。我们的安全部门承认他们没有预见到这一切的发生。"
 ghana.1.a: "向该地区派遣一支由军警人员组成的联合行动队伍。"
 ghana.1.b: "通过沃尔特地区酋长院进行公开对话。"
 ghana.1.c: "几个路标。不用理会它们。"
 ghana.2.t: "沃尔特地区各地发生袭击事件"
 ghana.2.d: "在发布五百名新兵训练照片十二小时后，分离主义分子在黎明前发动袭击。他们闯入军火库，冲进阿韦伊梅和梅佩的警察局，释放了所有在押人员，并抢走了步枪和警用皮卡。三名警官被扣为人质，其中包括地区指挥官。通往该地区的所有道路都被成堆的沙子和燃烧的轮胎封锁，两家广播电台落入分离主义分子手中，警方被勒令在二十四小时内撤离。"
 ghana.2.a: "搜查该地区，缴获武器，将嫌疑人押送至阿克拉。"
 ghana.2.b: "与酋长和国土研究小组进行公开会谈。"
 ghana.2.c: "宣布沃尔特地区进入紧急状态。"
 ghana.3.t: "沃尔特地区陷入沉寂"
 ghana.3.d: "道路畅通无阻，分离主义分子视频中承诺的四千名“龙”并未出现。数十名嫌疑人被关押在阿克拉，地区酋长院已将该运动斥为犯罪组织，军队在12月大选期间一直守卫着各个投票站。剩下的问题，将由法院裁决。"
 ghana.3.a: "以叛国罪起诉主谋。"
 ghana.3.b: "像2019年那样，准予保释，然后继续前进。"
 ghana.4.t: "龙之归来"
 ghana.4.d: "视频中的人物并非虚构。一些自称“西多哥兰之龙”的小型武装团伙已从多哥越境返回，在东部地区伏击了一支警察巡逻队，并在霍霍抢劫了一家银行分行。去年曾与该组织划清界限的沃尔特地区领导人如今却表示，逮捕和突袭行动反而为其招募了新成员。"
 ghana.4.a: "追捕他们，从边境到边境。"
 ghana.4.b: "大赦，以及沃尔特地区发展方案。"
 ghana.5.t: "沃尔特崛起"
 ghana.5.d: "这一次，旗帜高高飘扬。武装龙军控制了霍城和通往多哥边境的道路，地区行政官员已经逃离，“复兴阵线”宣布将保卫西多哥兰。我们的正规军在营房里严阵以待，而仓促组建的志愿民兵则向该地区进发。"
 ghana.5.a: "那我们就把它收回去。"
 ghana.6.t: "解决沃尔特问题"
 ghana.6.d: "民兵之间持续了三个月的小规模冲突已经使沃尔特河沿岸的村庄空无一人，而霍市的医院也挤满了人。龙无法夺取这个国家，我们也无法让该地区在枪口下爱我们。酋长们提出达成和解，将军们则提出结束解决方案。"
 ghana.6.a: "用武力解决它。"
 ghana.6.b: "加纳境内的沃尔特自治区。"
 ghana.6.c: "民兵已经解决了这个问题。"
 ghana.7.t: "沃尔特协议"
 ghana.7.d: "与地区酋长议会的两轮会谈取得了突袭行动无法企及的成果。“国土研究小组”放弃了武装斗争，“复兴阵线”的招募人员已经返回家园，酋长们向阿克拉提交了一份草案：一份关于沃尔特地区自治的法令，该地区位于加纳境内，并在加纳国旗下运作。"
 ghana.7.a: "签署区域自治章程。"
 ghana.7.b: "感谢各位酋长，别再碰宪法了。"
 ghana_news.1.t: "加纳沃尔特地区分离主义分子袭击警察"
 ghana_news.1.d: "西多哥兰复兴阵线武装分子袭击了加纳东部的一处军火库和两座警察局，封锁了通往沃尔特地区的道路，并宣布前英属多哥兰为主权国家。作为非洲最稳定的民主国家之一，加纳首都阿克拉正在权衡应对措施。"
 ghana_news.1.a: "一个由来已久的边界问题再次浮出水面。"
 ghana_news.2.t: "加纳沃尔特地区的民兵战争"
 ghana_news.2.d: "加纳志愿民兵与自称“西多哥兰龙”的武装组织之间爆发冲突，后者控制着霍城和通往多哥边境的道路。双方均未投入正规军，但沃尔特地区已成战区，难民正涌入多哥境内。"
 ghana_news.2.a: "加纳原本被认为是比较稳定的国家。"
 ghana_news.3.t: "加纳解决了沃尔特问题"
 ghana_news.3.d: "西多哥兰危机已经结束。沃尔特地区的枪声已经平息，分离主义领导人也已四散而去。和平能否持续，取决于该地区最终获得的承诺。"
 ghana_news.3.a: "沃尔特地区恢复了和平。"