 Egypt.1.t: "이집트 정치"
 Egypt.1.d: "이집트는 고대의 경이와 현대의 복잡함이 공존하는 땅입니다. 장엄한 기자의 피라미드에서 북적이는 카이로의 거리까지, 이 나라는 역사와 문화가 생생하게 엮인 직물입니다.\n\n이 시기 이집트는 거의 20년간 집권해 온 호스니 무바라크 대통령의 통치하에 있습니다. 정치 지형은 강력한 중앙 집권적 권위가 특징이며, 무바라크의 국민민주당이 권력의 고삐를 단단히 쥐고 있습니다.\n\n겉으로는 안정된 듯 보이지만, 그 이면에는 불만의 기류와 정치 개혁을 요구하는 목소리가 흐르고 있습니다. 야당과 활동가들은 현상 유지에 도전하며 더 큰 정치적 자유와 경제적 평등을 주장합니다.\n\n이러한 배경 속에서 이집트 국민은 전통과 현대성이 얽힌 복잡한 지형을 헤쳐 나가며, 풍부한 유산을 존중하는 동시에 진보를 위해 노력합니다. 나일 강은 수천 년 동안 그래 왔듯 흐르며, 빠르게 변화하는 세계에서 자신의 자리를 찾는 한 국가의 희망과 열망을 실어 나릅니다."
 Egypt.1.a: "Interesting."
 Egypt.24.t: "신규 남성복 컬렉션"
 Egypt.24.d: "타운 팀 섬유 회사의 최신 남성복 컬렉션을 소개합니다. 현대적인 스타일과 시대를 초월한 세련미의 융합입니다. 세심하게 엄선된 이 컬렉션은 현대 남성성의 정수를 구현하며, 캐주얼에서 격식 있는 자리까지 매끄럽게 넘나드는 다양한 의류를 제공합니다.\n각 의류에서 고급 원단, 정밀한 재단, 혁신적인 디자인의 조화로운 어우러짐을 발견해 보십시오. 전문성이 묻어나는 깔끔하게 재단된 셔츠부터 힘들이지 않은 듯 세련된 캐주얼웨어까지, 타운 팀 남성복 컬렉션은 비할 데 없는 품질과 편안함으로 여러분의 옷장을 한 단계 끌어올리도록 만들어졌습니다."
 Egypt.24.a: "매우 편하다!"
 EGY_broken_economy_idea: "무너진 경제"
 EGY_broken_economy_idea_desc: "오늘날 이집트는 심각한 경제적 혼란에 빠져 있습니다. 빈곤과 인종적 격차가 흔하며 계속 커지고 있습니다.\n\n§Y경제 정책 중점§!을 완료하면 경제를 §G바로잡을§! 수 있습니다. §Y빈민가를 정리§!하면 국가 정신을 완전히 §G제거§!할 수 있습니다."
