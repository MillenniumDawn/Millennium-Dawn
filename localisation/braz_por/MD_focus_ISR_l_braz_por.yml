 israel_economy.32.a: "Muito Lamentável."
 israel_economy.33.t: "Reunião Diplomática Israel-[BRM.GetName]"
 israel_economy.33.d: "Mianmar e Israel tiveram recentemente uma reunião diplomática, sinalizando um passo notável rumo ao fortalecimento das relações bilaterais entre as duas nações. A reunião, marcada por cordialidade e respeito mútuo, abordou uma ampla gama de temas de cooperação diplomática, econômica e tecnológica. Ambos os países expressaram grande interesse em ampliar a colaboração em diversos setores, incluindo agricultura, defesa e saúde. Esse intercâmbio diplomático reforça o compromisso de Mianmar e Israel em estreitar laços e explorar caminhos para parcerias mutuamente benéficas nos próximos anos."
 israel_economy.33.a: "Ótimo!"
 israel_economy.34.t: "Negociações de Apoio da OCDE"
 israel_economy.34.d: "A OCDE aceitou nossa proposta de apoio. Agora precisamos escolher o que pedir a eles."
