l_english:
 MDRC_mandate: "A State Worth Rebuilding"
 MDRC_mandate_desc: "A minister can sign an order in Kinshasa without changing a single classroom, barracks or river landing beyond the capital. Years of war have left an army of competing commands, a fragmented market and a state whose reach is uncertain. A national reconstruction council will name these problems openly and establish three reform programmes. Their temporary national penalties can be progressively reduced and removed through the political, economic and military branches. A budget event lets us choose a one-year administrative, construction, or rural-recovery programme. Assign a responsible ministry to each reconstruction commitment. Publishing an honest inventory exposes inherited failures but establishes a common basis for accountability. Additional effects: -1 stability percentage points; +25 political power. Each reform immediately improves Congolese Public Accounts; its exact changes and ongoing costs are listed in the effects."
 MDRC_dialogue: "The Inter-Congolese Dialogue"
 MDRC_dialogue_desc: "Give provincial leaders, churches, civic associations and the armed opposition a forum to debate the future of the Republic. Dialogue is the first step toward a durable political settlement. A settlement negotiated only by the strongest armed factions would leave the grievances of ordinary communities unanswered. Provincial delegations must have room to discuss representation, security and the distribution of public resources before the next government is chosen. The dialogue also creates a 210-day Public Mandate: +3% stability and +5% political-power gain. Maintain a permanent secretariat for civic and provincial delegations. Staffing spends political capital but preserves channels for implementing agreements. Additional effects: -15 political power; Ceasefire Liaison Network for 180 days, including its listed upkeep. Each reform immediately improves Congolese Administrative Accountability; its exact changes and ongoing costs are listed in the effects."
 MDRC_transition: "An Inclusive Transition"
 MDRC_transition_desc: "Create a transitional administration capable of choosing a constitutional settlement. The political routes ahead are mutually exclusive. Temporary offices need defined responsibilities and a timetable, otherwise the transition risks becoming a permanent contest for appointments. This administration will prepare the institutions through which competing visions of the Republic can be turned into governing programmes. A Transitional Secretariat adds +4% construction speed and +5% political-power gain for one year while the permanent settlement is negotiated. Replace overlapping transitional commissions with a common register of ministerial duties. Reassigning authority creates uncertainty while specialists reconcile accounts. Additional effects: -1 stability percentage points; Treasury Reconstruction Team for 180 days, including its listed upkeep. Each reform immediately improves Congolese Administrative Accountability; its exact changes and ongoing costs are listed in the effects."
 MDRC_republic: "A Western-Aligned Republic"
 MDRC_republic_desc: "The Western governing outlook must already be in power before this political programme can begin. Develop a distinct set of national institutions through the branches below. This focus preserves the current ruling party and does not install a new government. Publish the legal-reform timetable and invite constitutional advisers. Opening closed institutions creates uncertainty while cooperation supports the settlement. Additional effects: -1 stability percentage points; reciprocal +25 opinion with BEL only when those countries exist and are at peace with DRC. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects."
 MDRC_constitutional: "A Constitution Under Construction"
 MDRC_constitutional_desc: "The constitution has constrained the executive, but the institutions that defend it still need resources and authority. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_civil_oversight: "Civilian Oversight"
 MDRC_civil_oversight_desc: "The armed forces answer to public institutions. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_commission: "An Independent Electoral Commission"
 MDRC_commission_desc: "Fund voter registration and provincial electoral offices so that an election can be more than an announcement from the capital. An accurate register requires trained staff, secure records and procedures that rural voters can actually use. Electoral officials must answer to published rules rather than whichever provincial authority controls the road to the registration centre. Completing the electoral register upgrades the civic spirit to +2% stability and +2% political-power gain. Provincial electoral offices will share a verified register independent of patronage. Auditing requires resources before it earns public trust. Additional effects: -10 political power; Treasury Reconstruction Team for 180 days, including its listed upkeep; one 20% computing research bonus. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects."
 MDRC_constitution: "The Constitutional Referendum"
 MDRC_constitution_desc: "Bind the presidency to a written constitution and protect the assembly from arbitrary dissolution. A durable constitutional bargain must tell citizens who exercises power, how that power is limited and how a government can be replaced. The referendum gives this framework a public mandate that cannot rest on a presidential decree alone. The constitutional government spirit now replaces the electoral-register stage, turning temporary electoral administration into a permanent institutional settlement. Publish accessible constitutional editions and require ministers to explain their legal powers. The referendum divides opinion but clarifies the authority behind reform. Additional effects: -1 stability percentage points; +35 political power. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects."
 MDRC_courts: "Courts Beyond Kinshasa"
 MDRC_courts_desc: "Pay magistrates, reopen courthouses and publish judicial appointments. Accessible justice reduces the price citizens pay to corrupt intermediaries. For a resident far from Kinshasa, justice depends on a clerk, a magistrate and records that survive the next change of officials. Reopening these institutions will make property disputes and complaints against the administration matters of law rather than bargaining power. Alongside the corruption reduction, provincial justice upgrades the constitutional spirit to +6% political-power gain and adds +2% production-efficiency growth. Recover diverted administrative fees and publish provincial case schedules. Constitutional reform must have practical value for ordinary litigants. Additional effects: +0.1 treasury; Treasury Reconstruction Team for 180 days, including its listed upkeep. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects."
 MDRC_free_press: "Protect the Independent Press"
 MDRC_free_press_desc: "Give journalists legal protection and publish public tenders. Scrutiny may be uncomfortable, but it gives reform a constituency. Provincial radio, local newspapers and independent reporting can expose failures that official reports conceal. Public access to contracts and legal protection for journalists will make the reconstruction programme answerable to the communities it is meant to serve. Public Accountability replaces the judicial stage, increasing political-power gain to +8% and production-efficiency growth to +3% while retaining its constitutional stability benefit. Protect access to budgets and prevent retaliation against lawful reporting. Disclosures initially damage confidence before accountability rebuilds it. Additional effects: -1 stability percentage points; reciprocal +25 opinion with FRA only when those countries exist and are at peace with DRC. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects."
 MDRC_civilian: "Civilian Supremacy"
 MDRC_civilian_desc: "Bring military appointments and procurement before parliamentary committees. Oversight must reach beyond ceremonial approval of the defence budget. Civilian institutions will review appointments and spending while preserving a clear operational chain of command, so that loyalty to the Republic becomes more important than loyalty to a patron. A one-year procurement review adds +8% production-efficiency growth alongside the permanent Civilian Oversight spirit. Give parliamentary committees procurement accounts through a staffed military liaison office. Oversight gains information without breaking operational command. Additional effects: +15 command power; Treasury Reconstruction Team for 180 days, including its listed upkeep. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects."
 MDRC_ballot: "A Peaceful Transfer of Power"
 MDRC_ballot_desc: "The first successful transfer of office is a stronger guarantee than any speech promising it. Election officials, judges, opposition leaders and the security services must all accept that losing an election does not mean losing a place in the Republic. This completes the constitutional-government spirit, raising its bonuses to 8% stability and 10% political-power gain. The final republican settlement replaces Public Accountability and retains all mature constitutional benefits, now including +4% production-efficiency growth. Publish handover procedures for ministries, commands and records. Peaceful succession strengthens confidence in long-term agreements. Additional effects: Active Diplomatic Missions for 365 days, including its listed upkeep; reciprocal +25 opinion with USA only when those countries exist and are at peace with DRC. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects."
 MDRC_continuity: "Emerging-Bloc Reconstruction"
 MDRC_continuity_desc: "The Emerging governing outlook must already be in power before this political programme can begin. Develop a distinct set of national institutions through the branches below. This focus preserves the current ruling party and does not install a new government. Require ministries to follow published production priorities. Redirecting resources disrupts established interests while concentrating assistance. Additional effects: -1 stability percentage points; Industrial Rehabilitation for 180 days, including its listed upkeep. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects."
 MDRC_executive: "The Reconstruction Presidency"
 MDRC_executive_desc: "Central direction speeds construction, but concentration of authority weakens public trust."
 MDRC_governors: "Appoint Reliable Governors"
 MDRC_governors_desc: "Make provincial executives responsible for revenue and security targets set by the presidency. Appointments will come with specific obligations for public accounts, road access and administrative coverage. A governor who cannot explain where funds went will no longer be able to substitute a declaration of loyalty for evidence of effective government. Responsible Governors replaces the initial mandate with +4% political-power gain and +3% construction speed. Governors will submit comparable revenue and delivery reports. Removing contradictory channels recovers public money. Additional effects: -10 political power; +0.1 treasury. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects."
 MDRC_presidency: "The Reconstruction Presidency"
 MDRC_presidency_desc: "Centralize project approval to push a national development programme through fragmented institutions. Separate ministries often promise projects that depend on each other without sharing a timetable or budget. A presidential reconstruction office will coordinate these commitments, accepting the political cost of centralization in exchange for faster execution of national priorities. The Reconstruction Presidency now upgrades the governors stage into the established executive office, preserving the benefits and tradeoff of centralized reconstruction. Coordinate engineering, transport and procurement through a presidential office. Central direction unsettles officials losing discretionary authority. Additional effects: -1 stability percentage points; Reconstruction Works for 180 days, including its listed upkeep. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects."
 MDRC_patronage: "Discipline the Patronage Networks"
 MDRC_patronage_desc: "Require loyal officials to submit accounts and remove those who divert reconstruction budgets. Connections may secure an appointment, but they cannot be allowed to guarantee immunity from audit. The presidency will demand usable accounts from its own supporters, beginning with those offices responsible for procurement and the distribution of reconstruction funds. The internal audit also upgrades the executive spirit to +7% construction speed and adds +2% production-efficiency growth while retaining its political modifiers. Audit coalition-connected firms and reclaim payments for abandoned work. Enforcing standards against allies consumes political capital. Additional effects: -15 political power; +0.15 treasury. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects."
 MDRC_guard: "Reorganize the Presidential Guard"
 MDRC_guard_desc: "Professional training and reliable pay make the guard a disciplined reserve rather than another private army. A force charged with protecting national institutions must be capable of acting within them. Standardized training, reliable pay and a defined reserve role will make the guard more dependable while reducing the temptations created by privileged access to political power. A one-year readiness programme grants +4% division organization recovery and +1 percentage point of reinforcement rate, alongside army experience and command power. Require the guard to join army exercises and report through national command. Its personnel become a usable reserve rather than an isolated formation. Additional effects: +15 army experience; Frontier Readiness Exercises for 180 days, including its listed upkeep. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects."
 MDRC_delivery: "Legitimacy Through Delivery"
 MDRC_delivery_desc: "Tie provincial budgets to completed roads, functioning clinics and teachers actually present in schools. The government will publish practical measures of success that can be checked outside a ministerial office. A reopened clinic or a paid teacher should carry more political weight than another announcement that a province has been allocated a development budget. Delivery Contracts upgrades the executive spirit to +9% construction speed and +3% production-efficiency growth without removing its centralized-government tradeoff. Inspect completed schools and clinics before crediting governors. Citizens should encounter functioning services rather than ceremonial openings. Additional effects: +1 stability percentage points; Community Health for 180 days, including its listed upkeep. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects."
 MDRC_compact: "A New Presidential Compact"
 MDRC_compact_desc: "Governors and ministries must know what the presidency expects and what it will deliver in return. Replace improvised bargains with a common programme of regional investment and accountable targets. This upgrades the executive spirit to 10% construction speed and 12% political-power gain, while retaining its 3% stability penalty. The mature presidential compact replaces Delivery Contracts and adds +4% production-efficiency growth to its established construction and political-power benefits. Ratify a common industrial programme and publish regional obligations. Technical cooperation supports a settlement based on economic delivery. Additional effects: Industrial Rehabilitation for 365 days, including its listed upkeep; reciprocal +25 opinion with CHI only when those countries exist and are at peace with DRC. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects."
 MDRC_federal: "A Non-Aligned Federal Congo"
 MDRC_federal_desc: "The Non-Aligned governing outlook must already be in power before this political programme can begin. Develop a distinct set of national institutions through the branches below. This focus preserves the current ruling party and does not install a new government. Negotiate responsibilities before devolving budgets. Liaison teams manage friction created by redistributing authority. Additional effects: -1 stability percentage points; Ceasefire Liaison Network for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects."
 MDRC_federalism: "A Provincial Revenue Settlement"
 MDRC_federalism_desc: "Predictable revenue reduces regional grievances and supports local infrastructure. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_assemblies: "Elected Provincial Assemblies"
 MDRC_assemblies_desc: "Let communities choose representatives with authority over local services. Provincial representatives should debate priorities in public instead of treating local budgets as extensions of private negotiations in the capital. Elected assemblies will give communities a place to challenge spending decisions and demand explanations from their own administrators. Provincial Budget Offices replace the initial compact with +3% stability and +6% infrastructure construction speed. Publish assembly procedures and provide budget access. Elections matter when representatives can inspect the services they oversee. Additional effects: -10 political power; +1 stability percentage points. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects."
 MDRC_revenue: "A Provincial Revenue Formula"
 MDRC_revenue_desc: "Publish a predictable formula for distributing mining and customs receipts. A mineral-producing province, an agricultural district and a major city have different needs, but each needs a predictable public budget. Publishing a common formula will make transfers easier to defend and harder to manipulate through political threats. The revenue formula now replaces Provincial Budget Offices with the established federal revenue-settlement spirit, preserving its stronger stability and infrastructure benefits. Create a clearing office for national and provincial transfers. Receipts must not be promised to several administrations simultaneously. Additional effects: +0.1 treasury; Treasury Reconstruction Team for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects."
 MDRC_local_audit: "Provincial Audit Chambers"
 MDRC_local_audit_desc: "Decentralization must not decentralize impunity. Establish independent audit chambers in every province. Giving provinces authority over money also creates new opportunities to conceal its disappearance. Local audit chambers will scrutinize contracts and publish findings so that decentralization creates accountable government rather than merely moving the location of corruption. Accountable Provinces also upgrades the federal spirit to +12% infrastructure construction speed and adds +2% political-power gain alongside the corruption reduction. Compare contracts and refer disputed transfers to a common panel. Local autonomy carries verifiable financial responsibilities. Additional effects: -10 political power; +0.15 treasury. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects."
 MDRC_languages: "Services in Local Languages"
 MDRC_languages_desc: "Train administrators to provide essential services in the languages their citizens use. A form that citizens cannot understand is an obstacle to government even when an office is open. Training local staff and making essential information accessible will reduce dependence on intermediaries and make public administration more familiar to the people using it. Accessible Government replaces the audit stage, raising infrastructure construction speed to +14% and political-power gain to +3% while preserving federal stability. Raises the actual Millennium Dawn literacy rate by 1 percentage point, up to 100%, and updates its education modifiers. Train clerks to explain legal and financial documents locally. Administrative language should not prevent access to services. Additional effects: +1 stability percentage points; Treasury Reconstruction Team for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects."
 MDRC_municipal: "Municipal Development Funds"
 MDRC_municipal_desc: "Give towns modest funds for markets, drainage and reliable public records. Small urban projects often fail because no authority has a clear budget to maintain them. Dedicated municipal funds will allow local councils to plan practical improvements to markets and services without waiting for every repair to become a national project. Municipal engineering exchanges provide one +50% industry research bonus in addition to the existing development funds. Require project accounts and maintenance plans for municipal grants. Towns need assets they can operate after construction teams depart. Additional effects: -10 political power; Reconstruction Works for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects."
 MDRC_unity_diversity: "Unity Through Diversity"
 MDRC_unity_diversity_desc: "Provincial autonomy will endure only if citizens can see public services improve without the country pulling apart. Ratify the revenue settlement, settle administrative boundaries and make interprovincial cooperation routine. The final federal spirit provides stronger stability and infrastructure construction, plus a modest general construction bonus. The mature federal settlement replaces Accessible Government and now includes +4% political-power gain alongside its established stability and construction benefits. Maintain interregional consultation and cross-border cooperation. Federal institutions give the Republic a common diplomatic voice. Additional effects: Active Diplomatic Missions for 365 days, including its listed upkeep; reciprocal +25 opinion with CNG only when those countries exist and are at peace with DRC. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects."
 MDRC_restoration: "The Nationalist State Programme"
 MDRC_restoration_desc: "The Nationalist governing outlook must already be in power before this political programme can begin. Develop a distinct set of national institutions through the branches below. This focus preserves the current ruling party and does not install a new government. Review the administrative, industrial and defence capabilities required for preparedness. Reallocating authority creates friction before responsibilities become clear. Additional effects: -1 stability percentage points; +15 command power. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects."
 MDRC_service: "National Reconstruction Service"
 MDRC_service_desc: "Paid service mobilizes labour and reserves, with an opportunity cost to industry."
 MDRC_sovereignty: "A Charter of Sovereignty"
 MDRC_sovereignty_desc: "Declare that public office and national resources serve the Congolese state. Sovereignty must mean more than a flag above an office whose accounts and decisions nobody can inspect. The charter will define public obligations around control of national resources, service to citizens and the independence of Congolese institutions. The Mobilization Charter upgrades that programme to +5% mobilization speed, +0.4 percentage points of recruitable population and +2% division defence. Register strategic contracts and responsible officials. Independent decisions require accurate information about public obligations. Additional effects: -10 political power; Treasury Reconstruction Team for 180 days, including its listed upkeep. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects."
 MDRC_national_service: "National Reconstruction Service"
 MDRC_national_service_desc: "Organize paid reconstruction service and reserve training under a national administration. Reconstruction needs organized labour, but coercion and indefinite service would deepen public resentment. The programme will use defined terms, pay and practical training to connect national mobilization with useful work and a recognized place in civilian life. National Reconstruction Service now replaces the charter stage, establishing the existing manpower and defensive benefits together with its economic cost. Combine paid civil works with registered reserve training. An organized intake supplies personnel while engineers undertake reconstruction. Additional effects: +2000 available manpower; Reconstruction Works for 180 days, including its listed upkeep. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects."
 MDRC_clean_hands: "The Clean Hands Campaign"
 MDRC_clean_hands_desc: "Audit the assets of senior officials and prosecute diversion of public money. The campaign will begin where officials have the greatest discretion over contracts, appointments and public property. Removing protected intermediaries will disrupt established political networks, but the state cannot demand sacrifice from citizens while tolerating diversion at the top. An audited national service also upgrades division defence to +3.5% and adds +2% political-power gain while retaining its recruitment benefit and industrial cost. Recover assets diverted through senior procurement networks. Applying the campaign to influential supporters consumes political capital. Additional effects: -15 political power; +0.15 treasury. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects."
 MDRC_national_academy: "A National Cadre Academy"
 MDRC_national_academy_desc: "Train administrators and officers in a common programme of public service. Officers and administrators should understand the same basic rules for public accounts, lawful authority and interregional cooperation. A common training programme will try to replace isolated circles of loyalty with a cadre that can serve across provincial boundaries. The academy provides one +50% infantry research bonus alongside its experience and administrative rewards. Raises the actual Millennium Dawn literacy rate by 1 percentage point, up to 100%, and updates its education modifiers. Teach staff planning, accounts and technical administration together. Officers and civilian officials need shared evidence to coordinate policy. Additional effects: +15 army experience; Research Partnerships for 180 days, including its listed upkeep. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects."
 MDRC_strategic_reserve: "A Strategic National Reserve"
 MDRC_strategic_reserve_desc: "Build a reserve of funds and personnel to weather pressure from abroad. Emergency decisions are easier to impose on a country that has no reserves of money or trained personnel. Setting resources aside will give the government time to respond to pressure without immediately abandoning its reconstruction commitments or seeking another patron. The Prepared National Reserve upgrades the service spirit to +1.2 percentage points of recruitable population and +4% defence, with -2% supply consumption and its existing political and industrial modifiers. Audit emergency stores and exercise release procedures. Fuel reserves need a tested command plan to become usable policy. Additional effects: +15000 fuel (subject to storage capacity); +15 command power. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects."
 MDRC_sovereign_state: "A Sovereign State"
 MDRC_sovereign_state_desc: "The new government must now show that national service and centralized authority can survive beyond a moment of crisis. Combine reserve organization with a permanent reconstruction programme. The final sovereign-state spirit strengthens defence, recruitment and construction, while retaining the industrial cost of mobilizing so many citizens for state service. The mature sovereign programme replaces the prepared reserve and retains -2% supply consumption and +2% political-power gain alongside its established manpower, defence and construction benefits. Coordinate frontier administration, diplomacy and defensive exercises. Neighbours should understand the institutions responsible for security. Additional effects: Frontier Readiness Exercises for 365 days, including its listed upkeep; reciprocal +25 opinion with AGL only when those countries exist and are at peace with DRC. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects."
 MDRC_administration: "Professional Administration"
 MDRC_administration_desc: "A trained civil service improves the execution of public policy. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_public_service: "A Professional Public Service"
 MDRC_public_service_desc: "Whichever constitutional settlement prevails, recruitment and promotion must reward competence. Adopt a common civil-service statute. Teachers, revenue officers and engineers need careers that survive changes in political leadership. A common statute will make qualifications, promotion and pay legible across ministries, turning the administration from a collection of appointments into a more durable public institution. A national records-modernization programme provides one +50% computing research bonus alongside the permanent professional administration. Connect competitive recruitment, common qualifications and an audited payroll. Recoveries from duplicate appointments fund professional development. Additional effects: +0.15 treasury; Research Partnerships for 365 days, including its listed upkeep. Each reform immediately improves Congolese Administrative Accountability; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focuses:\nComplete §Yany one§! of: §Y$MDRC_JK_republic_settlement$§!, §Y$MDRC_JK_continuity_settlement$§!, §Y$MDRC_JK_federal_settlement$§!, §Y$MDRC_JK_nationalist_consolidation$§!, §Y$MDRC_JK_religious_settlement$§!, §Y$MDRC_LDK_state$§!."
 MDRC_accounts: "Reconstruct the Public Accounts"
 MDRC_accounts_desc: "Begin with an inventory of revenue, obligations and missing records. This is a prerequisite for credible debt negotiations. A budget cannot guide policy if arrears, customs receipts and ministerial obligations are recorded in separate or incomplete books. Reconstructing the accounts will reveal what the state actually owns, what it owes and which promises it can afford to keep. One 25% computing research bonus supports digitizing the recovered public accounts. Recover provincial tax ledgers and introduce a common reporting calendar. Treasury analysts will reconcile duplicated claims before new obligations are accepted. Additional effects: +25 political power; one 25% information technology research bonus. Each reform immediately improves Congolese Public Accounts; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_mandate$§!."
 MDRC_procurement: "Publish Public Procurement"
 MDRC_procurement_desc: "Competitive tenders and a public register of contracts can reduce leakage before new investment begins. A reconstruction contract is an obligation to deliver a usable service, not simply permission to receive public money. Publishing tenders and award criteria will allow competing firms and affected communities to challenge arrangements that would otherwise remain invisible. Transparent tenders also fund a one-year works programme with +6% construction speed. Record beneficial ownership and establish a process for challenging tenders. Contractors benefiting from discretionary awards will resist initial enforcement. Additional effects: -1 stability percentage points; Treasury Reconstruction Team for 270 days, including its listed upkeep. Each reform immediately improves Congolese Public Accounts; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_accounts$§!."
 MDRC_debt_review: "Reconcile the Debt Register"
 MDRC_debt_review_desc: "Identify disputed obligations and negotiate a limited write-down. This provides relief without erasing the legacy debt burden. Creditors must be able to distinguish recognized obligations from disputed claims and missing documentation. A reconciled register gives our negotiators a defensible basis for limited relief while keeping future borrowing tied to obligations the treasury can actually monitor. A follow-up settlement offers another 1 debt reduction for 0.5 treasury, or a one-year treasury oversight programme and 25 political power. Separate verified obligations from disputed claims and secure the records supporting negotiations. Debt relief must not conceal new unpaid domestic bills. Additional effects: +20 political power; one 25% encryption research bonus. Each reform immediately improves Congolese Public Accounts; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_procurement$§!."
 MDRC_development: "A National Development Plan"
 MDRC_development_desc: "The accounts are finally usable and public tenders are no longer private arrangements. Decide what reconstruction is supposed to achieve before signing another concession or announcing another megaproject. This focus removes the remaining Disconnected Markets recovery penalty and opens two competing industrial models: private investment corridors or public control of strategic mining. A planning event grants one 50% research bonus in construction, energy, or agriculture. Compare projects by maintenance costs, employment and provincial access. Ministries must surrender discretionary spending while the national plan is reconciled. Additional effects: -1 stability percentage points; Treasury Reconstruction Team for 365 days, including its listed upkeep. Each reform immediately improves Congolese Public Accounts; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_debt_review$§!."
 MDRC_investment: "Investment Corridors"
 MDRC_investment_desc: "Private capital speeds construction, while concessions constrain state revenue choices. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_market: "Open Investment Corridors"
 MDRC_market_desc: "Welcome outside capital under published concessions and enforceable labour standards. This approach favors rapid construction. Outside capital can bring equipment and expertise faster than the treasury can supply them alone. The government will offer dependable rules and selected investment corridors, accepting that concessions must be carefully negotiated if rapid construction is to benefit domestic businesses. The first concession tenders add +6% construction speed for one year alongside the permanent investment spirit. Require published concessions and audited domestic-supplier agreements. Rapid opening provides finance but unsettles firms protected by informal arrangements. Additional effects: -1 stability percentage points; one 25% construction research bonus. Each reform immediately improves Congolese Industrial Value Chains; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_development$§!."
 MDRC_enterprise_idea: "Domestic Supplier Networks"
 MDRC_enterprise_idea_desc: "Local firms retain more of the value created by investment. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_contracts: "Renegotiate Mining Contracts"
 MDRC_contracts_desc: "Replace opaque side agreements with published royalties and enforceable development commitments. Royalties are only part of a concession: infrastructure obligations, subcontracting and the treatment of local communities also matter. Reopening negotiations will seek agreements the public can inspect and the administration can enforce throughout the life of a project. One 50% excavation research bonus supports independently verified mineral surveys. Create a contract-review office staffed by engineers, accountants and labour inspectors. Standard royalty and maintenance clauses help domestic suppliers plan ahead. Additional effects: +30 political power; one 25% production lines research bonus. Each reform immediately improves Congolese Industrial Value Chains; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_market$§!."
 MDRC_enterprise: "Congolese Enterprise Funds"
 MDRC_enterprise_desc: "Reserve credit and training for domestic suppliers so that investment reaches beyond the concession gates. A mine can operate for years while buying almost everything from suppliers outside its surrounding economy. Finance and training for Congolese firms will help local workshops, transporters and service businesses compete for contracts that turn extraction into broader employment. Supplier training grants one 50% production-line research bonus. Pair enterprise credit with accounting assistance and independent certification. Favour firms that document deliveries, maintain machinery and train local workers. Additional effects: Treasury Reconstruction Team for 270 days, including its listed upkeep; one 25% computing research bonus. Each reform immediately improves Congolese Industrial Value Chains; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_contracts$§!."
 MDRC_export_hub: "An Export Manufacturing Hub"
 MDRC_export_hub_desc: "A concession can export raw minerals for decades without creating a broader industrial economy. Require supplier contracts, invest in light manufacturing and connect firms to the Atlantic gateway. Alongside a civilian factory, this focus upgrades Investment Corridors to 10% construction speed and 8% production-efficiency growth, retaining its political-power tradeoff. Export workshops receive a one-year rehabilitation programme with +4% factory output and +6% production-efficiency growth. Unlocks Expand the Matadi Export Park, a separately funded one-time project costing 2 treasury and 75 political power. Complete one civilian factory in Bas-Congo. Organize inspection laboratories, freight documentation and shared maintenance around the export park. Formal standards initially burden informal producers. Additional effects: -1 stability percentage points; one 25% infrastructure research bonus. Each reform immediately improves Congolese Industrial Value Chains; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_enterprise$§!."
 MDRC_public_mines: "Strategic Public Mining"
 MDRC_public_mines_desc: "Public mining retains resources but slows new construction. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_state_mines: "Public Control of Strategic Mines"
 MDRC_state_mines_desc: "Bring strategic extraction under public supervision. State control prioritizes domestic processing over immediate access to outside capital. Public ownership only creates lasting value when the enterprise can account for its costs and maintain technical competence. Strategic supervision will seek to retain more benefits at home, while recognizing that a larger state role also makes investment decisions slower. A public geological survey grants one 50% excavation research bonus. Place strategic assets under public technical supervision. Reorganizing management disrupts contracts, so public control needs a credible maintenance and investment plan. Additional effects: -2 stability percentage points; one 25% industry research bonus. Each reform immediately improves Congolese Industrial Value Chains; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_development$§!."
 MDRC_royalties: "National Royalty Fund"
 MDRC_royalties_desc: "Predictable investment supports the civilian economy. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_gecamines: "Rebuild Gecamines"
 MDRC_gecamines_desc: "Restore technical capacity and a transparent treasury at the public mining enterprise. Restoring the enterprise requires reliable accounts, maintained equipment and technical staff whose advice can survive political pressure. The government will begin with the capacity to manage existing operations before asking the company to carry every ambition of the national development plan. The enterprise receives one year of industrial rehabilitation: +4% factory output and +6% production-efficiency growth. Rebuild Gecamines around audited operating accounts and engineering apprenticeships. Technical independence requires production information rather than simply replacing the board. Additional effects: +25 political power; one 25% production lines research bonus. Each reform immediately improves Congolese Industrial Value Chains; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_state_mines$§!."
 MDRC_smelters: "Domestic Processing Capacity"
 MDRC_smelters_desc: "Invest in workshops and processing plants close to the Katanga mineral belt. Moving further along the mineral value chain requires workshops, stable inputs and practical links to the southern production belt. A modest processing base will give Congolese industry experience in work that has too often taken place after raw materials leave the country. One 50% industry research bonus improves domestic processing methods. Unlocks Expand the Katanga Processing Works, a separately funded one-time project costing 2 treasury and 75 political power. Complete one civilian factory in Katanga. Couple processing plants to energy audits and specialist maintenance teams. Domestic processing retains value but initially competes for skilled labour and dependable utilities. Additional effects: -1 stability percentage points; one 25% energy efficiency research bonus. Each reform immediately improves Congolese Industrial Value Chains; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_gecamines$§!."
 MDRC_royalty_fund: "A National Royalty Fund"
 MDRC_royalty_fund_desc: "Public ownership is not enough if royalties disappear into the next emergency. Establish a published fund for reinvestment and give technical managers a reliable programme of domestic processing. The mature public-mining spirit adds 12% resource gain and 6% factory output, with a continuing 3% construction-speed penalty. The first funded projects also receive +6% construction speed for one year. Publish the fund investment mandate and separate operating revenue from long-term capital. Independent reporting protects projects from discretionary withdrawals. Additional effects: Treasury Reconstruction Team for 365 days, including its listed upkeep; one 25% computing research bonus. Each reform immediately improves Congolese Industrial Value Chains; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_smelters$§!."
 MDRC_value_chain: "Beyond the Raw-Material Economy"
 MDRC_value_chain_desc: "Combine extraction, processing and domestic suppliers in a diversified industrial strategy. Extraction alone leaves the economy exposed to decisions made far from the communities producing its wealth. Connecting mines with processors, local suppliers and technical training will make national development depend on a wider range of skills and productive activity. One 50% robotics research bonus supports the next stage of industrial diversification. Connect mining, processing, repair workshops and manufacturers through common standards. Diversification requires firms that can develop products beyond one export commodity. Additional effects: +50 political power; one 25% composites research bonus. Each reform immediately improves Congolese Industrial Value Chains; its exact changes and ongoing costs are listed in the effects. Unlocks Commission an Industrial Modernization Review: a funded repeatable programme costing 1.5 treasury and 80 political power, with a 730-day cooldown.\n\n§W--------------§!\nRequired earlier focuses:\nComplete §Yany one§! of: §Y$MDRC_export_hub$§!, §Y$MDRC_royalty_fund$§!."
 MDRC_electricity: "Reliable Industrial Power"
 MDRC_electricity_desc: "Grid rehabilitation raises factory output. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_market_idea: "Integrated Domestic Market"
 MDRC_market_idea_desc: "A connected market rewards domestic production. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_river: "Restore Congo River Transport"
 MDRC_river_desc: "Repair landing stages and freight-handling facilities to reconnect communities along the river. River transport can connect settlements that would otherwise wait on expensive road projects. Repairing freight facilities and landing stages will concentrate on dependable links and maintenance, allowing commerce along the Congo to resume as a regular service rather than an improvised journey. One 50% infrastructure research bonus supports river landing stages and freight links. Unlocks Congo River Storage Cooperatives, a separately funded one-time project costing 0.75 treasury and 50 political power. Complete one agricultural district in Bandundu. Register landing stages and seasonal maintenance requirements. Freight planning will connect river communities to national procurement. Additional effects: +20 political power; one 25% construction research bonus. Each reform immediately improves Congo Basin Utilities; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_accounts$§!."
 MDRC_matadi: "The Matadi-Kinshasa Corridor"
 MDRC_matadi_desc: "Modernize the capital region transport corridor before committing to more expensive national links. A functioning connection between the Atlantic gateway and the capital is essential to the movement of equipment and civilian goods. Improvements will address the practical bottlenecks along this corridor before the government commits to extending similar promises across the entire country. One 50% construction research bonus supports the corridor beyond its first infrastructure improvement. Unify freight paperwork and publish inspection schedules along the Matadi-Kinshasa corridor. Coordinated records reduce contradictory instructions from different offices. Additional effects: Treasury Reconstruction Team for 270 days, including its listed upkeep; one 25% information technology research bonus. Each reform immediately improves Congo Basin Utilities; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_river$§!."
 MDRC_rail: "Reconnect the Katanga Workshops"
 MDRC_rail_desc: "Restore freight workshops and feeder connections around the southern industrial belt. Track alone cannot move freight when workshops lack parts and trained crews. The southern rehabilitation programme will connect maintenance capacity with feeder routes and industrial customers, making the Katanga transport network useful to the production it is meant to serve. The revised delivery supplies 100 utility vehicles. Research bonuses and institutional rewards are shown separately below. Train workshop staff to maintain standard vehicles and share spare-parts records with civilian freight operators. Practical maintenance also improves army transport. Additional effects: +10 army experience; one 25% production lines research bonus. Each reform immediately improves Congo Basin Utilities; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_matadi$§!."
 MDRC_inga: "Rehabilitate the Inga Network"
 MDRC_inga_desc: "Repair existing generation and transmission capacity before promising a megaproject. The new capacity is represented by MD renewable-energy infrastructure. Large generating ambitions mean little to a factory facing repeated interruptions today. The immediate programme will concentrate on rehabilitation and the networks needed to deliver usable electricity, treating dependable service as the foundation for any later expansion around Inga. One 50% renewable-energy research bonus supports further rehabilitation. Complete one renewable-energy infrastructure level in Bas-Congo. This national-focus project is funded through its reconstruction programme; no treasury balance is required to begin it. Introduce scheduled maintenance, outage notices and engineering inspections. Planned interruptions cause disruption now but make long-term service dependable. Additional effects: -1 stability percentage points; one 25% electrification research bonus. Each reform immediately improves Congo Basin Utilities; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_rail$§!."
 MDRC_grid: "A Grid That Reaches Industry"
 MDRC_grid_desc: "Extend dependable power to industrial consumers and reduce costly interruptions. A power plant does not create a productive industrial district unless transmission and distribution work with it. Connecting factories to more dependable supply will reduce the need for improvised alternatives and make production schedules less vulnerable to interruptions. One 50% energy-efficiency research bonus complements the permanent industrial-power spirit. This national-focus project is funded through its reconstruction programme; no treasury balance is required to begin it. Coordinate industrial demand with distribution maintenance and storage planning. Factories need dependable schedules rather than isolated emergency arrangements. Additional effects: +25 political power; one 25% battery storage research bonus. Each reform immediately improves Congo Basin Utilities; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_inga$§!."
 MDRC_telecom: "Connect the Provincial Capitals"
 MDRC_telecom_desc: "Build telecommunications capacity for commerce, education and public administration. A provincial administration should not need a physical journey to exchange basic records with the capital. Improved communications will help public offices, businesses and educational institutions work across distance, while creating another reason to maintain dependable civilian infrastructure. One 50% internet-access research bonus develops provincial communications services. Complete one internet-station level in Bandundu. Space for the additional level must be available. This national-focus project is funded through its reconstruction programme; no treasury balance is required to begin it. Establish security and maintenance standards for provincial communications offices. Reliable networks need trained operators and protected records. Additional effects: +25 political power; one 25% encryption research bonus. Each reform immediately improves Congo Basin Utilities; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_grid$§!."
 MDRC_integration: "An Integrated Domestic Market"
 MDRC_integration_desc: "Transport and communications allow firms to sell across provincial boundaries. A farmer, a workshop and an urban customer must be able to find each other beyond the nearest administrative boundary. Bringing transport and communications together will allow provincial economies to support one another instead of remaining isolated markets with expensive outside connections. The integrated market supports a two-year industrial rehabilitation programme with +4% factory output and +6% efficiency growth. Bring transport, electricity and communications into a shared service calendar. Provincial institutions must identify disruptions and coordinate repairs across boundaries. Additional effects: Treasury Reconstruction Team for 365 days, including its listed upkeep; one 25% mobile networks research bonus. Each reform immediately improves Congo Basin Utilities; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_telecom$§!."
 MDRC_education: "Teachers Back in the Classroom"
 MDRC_education_desc: "Regular salaries and reopened classrooms rebuild the base for technical learning. Trained staff support productivity growth but require additional administrative expenditure."
 MDRC_farms: "Support Smallholder Agriculture"
 MDRC_farms_desc: "Repair rural storage and extension services instead of treating agriculture as an afterthought. Rural development begins with the practical problems between planting a crop and receiving payment for it. Storage, advice and dependable access to markets will help smallholders retain more of their output and participate in a wider domestic food economy. One 50% agricultural research bonus helps extension services develop better farming practices. Give extension teams demonstration plots, crop records and cooperative links. Agricultural support should leave knowledge behind when initial grants are spent. Additional effects: +25 political power; one 25% genetics research bonus. Each reform immediately improves Provincial Livelihood Services; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_accounts$§!."
 MDRC_food: "Reopen Rural Markets"
 MDRC_food_desc: "Local roads and secure markets reduce the distance between farmers and urban consumers. Urban consumers and rural producers both lose when insecurity and unreliable transport break the link between them. Reopening local markets will focus on predictable access and basic commercial services so that agricultural recovery reaches towns as well as farms. A two-year rural-recovery programme adds +3% stability and +10% agricultural-district construction speed. Standardize market receipts and help cooperatives manage distribution. Better records secure payment for smallholders and identify shortages. Additional effects: Treasury Reconstruction Team for 270 days, including its listed upkeep; one 25% infrastructure research bonus. Each reform immediately improves Provincial Livelihood Services; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_farms$§!."
 MDRC_schools: "Pay the Teachers"
 MDRC_schools_desc: "Regular salaries and usable classrooms restore confidence in public education. A new school building is of little use if teachers must leave their posts to find another income. Regular salaries and working classrooms will make attendance worthwhile for staff and pupils, restoring the daily routines on which a skilled generation depends. One 25% information-technology research bonus supports teacher training and educational administration. This national-focus project is funded through its reconstruction programme; no treasury balance is required to begin it. Raises the actual Millennium Dawn literacy rate by 2 percentage points, up to 100%, and updates its education modifiers. Create verified teacher registers and a published process for correcting unpaid salaries. Administrators must distinguish occupied posts from names on a list. Existing literacy gains remain. Additional effects: +25 political power; one 25% computing research bonus. Each reform immediately improves Congolese Teaching and Technical Standards; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_food$§!."
 MDRC_clinics: "Provincial Health Networks"
 MDRC_clinics_desc: "Equip clinics and train staff to bring routine care closer to families. Public health is often decided by whether a nearby facility has trained staff and essential supplies when they are needed. Provincial networks will prioritize dependable routine services and referral links, giving communities visible evidence that reconstruction reaches beyond the major cities. A two-year community-health campaign adds a further +3% stability while new staff are trained. This national-focus project is funded through its reconstruction programme; no treasury balance is required to begin it. Link clinic inventories, training placements and distribution routes. Shared records reveal missing staff and interruptions in routine care. Additional effects: +25 political power; one 25% information technology research bonus. Each reform immediately improves Provincial Livelihood Services; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_schools$§!."
 MDRC_universities: "Revive the Universities"
 MDRC_universities_desc: "Support laboratories, engineering departments and technical colleges. Technical recovery needs institutions that can train engineers, administrators and researchers within the country. Restoring laboratories and teaching capacity will connect higher education with practical national needs while preserving the longer-term work that cannot be measured by immediate construction targets. The new research capacity receives one 50% computing research bonus. This national-focus project is funded through its reconstruction programme; no treasury balance is required to begin it. Raises the actual Millennium Dawn literacy rate by 1 percentage point, up to 100%, and updates its education modifiers. Accredit engineering courses and connect laboratories to utilities and industry. University recovery should produce specialists who can maintain the rebuilt institutions. Additional effects: +35 political power; one 25% electrification research bonus. Each reform immediately improves Congolese Teaching and Technical Standards; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_clinics$§!."
 MDRC_technical: "Technical Scholarships"
 MDRC_technical_desc: "A restored university should supply more than diplomas. Place engineering students in power stations and workshops, connect vocational colleges with domestic manufacturers and support research that firms can use. This upgrades the education spirit to 5% research speed and adds production-efficiency growth, alongside the existing industry research bonuses. One 50% electrification research bonus complements the existing industrial scholarships. Raises the actual Millennium Dawn literacy rate by 1 percentage point, up to 100%, and updates its education modifiers. Recognize practical qualifications earned in workshops, utilities and maintenance units. Certification lets experienced workers move between civilian and military services. Additional effects: +10 army experience; one 25% utility vehicles research bonus. Each reform immediately improves Congolese Teaching and Technical Standards; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_universities$§!."
 MDRC_social_contract: "A Developmental Social Contract"
 MDRC_social_contract_desc: "Make improvements in everyday life the measure of national reconstruction. Citizens asked to accept taxes and national institutions should see that contribution return in useful services. A development programme anchored in education, health and rural livelihoods will make public confidence depend on shared improvements rather than promises of distant prosperity. A permanent Funded Social Compact adds +3% stability and +3% political-power gain. Publish provincial service standards and the evidence used to assess them. Communities should distinguish delivery failures from unfunded promises and receive documented responses. Additional effects: +50 political power; one 25% computing research bonus. Each reform immediately improves Provincial Livelihood Services; its exact changes and ongoing costs are listed in the effects. Unlocks Fund a Public-Service Delivery Cycle: a funded repeatable programme costing 1 treasury and 75 political power, with a 730-day cooldown.\n\n§W--------------§!\nRequired focuses: satisfy §Yevery§! line below:\nComplete §Y$MDRC_technical$§!.\nComplete §Y$MDRC_literacy_complete$§!."
 MDRC_fardc_idea: "FARDC: One Chain of Command"
 MDRC_fardc_idea_desc: "A common command structure has ended the worst fragmentation. Infantry standards and staff training will turn this national force into a more capable fighting army. Maintaining the programme adds military spending, while organized support improves recovery."
 MDRC_army_audit: "Audit the Armed Forces"
 MDRC_army_audit_desc: "Some formations exist only on a pay list; others fight under a commander whose authority comes from wartime loyalty rather than national appointment. Inspectors must visit units, record weapons and establish who actually serves. The register will not win battles by itself, but it replaces An Army of Separate Commands with a less severe penalty and makes later reforms possible. The revised delivery supplies 600 infantry-equipment units. Research bonuses and institutional rewards are shown separately below. Reconcile battalion returns with depot inventories and establish a common readiness report. The audit must reveal what units can actually sustain in the field. Additional effects: +8 army experience; +5 command power. Each reform immediately improves FARDC Sustainment Service; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_mandate$§!."
 MDRC_payroll: "End the Ghost Payroll"
 MDRC_payroll_desc: "A soldier who cannot rely on the treasury will rely on a commander, a roadblock or a local patron. Pay verified personnel directly and reconcile every unit return against the new register. This reform lowers corruption and replaces the remaining army penalty with a milder one. A reliable paymaster is the foundation for a reliable chain of command. The revised delivery supplies 50 command-and-control equipment sets. Research bonuses and institutional rewards are shown separately below. Restore verified personnel to their units and link pay records to the national chain of command. Reliable salaries must produce reliable unit administration. Additional effects: +1500 available manpower; +5 command power. Each reform immediately improves FARDC Sustainment Service; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_army_audit$§!."
 MDRC_fardc: "Build a National Army"
 MDRC_fardc_desc: "Unit names alone cannot turn former rivals into a national army. Establish regional commands under a common headquarters, require shared training and make promotion depend on service beyond a commander own network. The last fragmentation penalty is replaced by FARDC: One Chain of Command, granting 5% division organization and 3% division defence. The revised delivery supplies 1,000 infantry-equipment units, 75 command-and-control equipment sets. Research bonuses and institutional rewards are shown separately below. Create common readiness reports, maintenance requests and reinforcement priorities. National command needs working procedures as well as a unified name. Additional effects: +12 army experience; +10 command power. Each reform immediately improves FARDC Sustainment Service; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_payroll$§!."
 MDRC_professional_idea: "Professional Volunteer Force"
 MDRC_professional_idea_desc: "Longer training and a smaller professional cadre favour tactical quality over rapid mobilization."
 MDRC_professional: "A Professional Volunteer Force"
 MDRC_professional_desc: "A professional force must be paid to train even when there is no battle tomorrow. Select experienced cadres, retain capable non-commissioned officers and give units time to rehearse their tasks. The result adds 5% division organization and 4% attack, with faster experience gain. Its deliberate tradeoff is a 10% longer training period. The revised delivery supplies 400 infantry-equipment units. Research bonuses and institutional rewards are shown separately below. Establish specialist courses and dependable service records for professional retention. A smaller volunteer force depends on keeping experienced personnel. Additional effects: +15 army experience; +1000 available manpower. Each reform immediately improves FARDC Sustainment Service; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_fardc$§!."
 MDRC_territorial_idea: "Territorial Defence"
 MDRC_territorial_idea_desc: "Provincial reserves know their ground and strengthen local defence. Their shorter training limits offensive flexibility."
 MDRC_territorial: "Territorial Defence"
 MDRC_territorial_desc: "The Republic is too large for a small expeditionary force to guard every road and district. Build provincial reserves around common national standards and mobilization plans. This route increases recruitable manpower and gives 7% division defence, but its less specialized formations suffer a 2% attack penalty. Choose a force designed to hold ground. The revised delivery supplies 1,000 infantry-equipment units. Research bonuses and institutional rewards are shown separately below. Register a reserve intake and harmonize provincial training calendars. The initial call-up disrupts civilian routines but creates a usable reserve. Additional effects: +3000 available manpower; -1 stability percentage points. Each reform immediately improves FARDC Sustainment Service; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_fardc$§!."
 MDRC_logistics_idea: "A Common Army Supply Service"
 MDRC_logistics_idea_desc: "Common depots and maintenance schedules keep units supplied and shorten recovery after hard fighting. Maintaining the programme adds military spending, while organized support improves recovery."
 MDRC_logistics: "Supply Before Offensives"
 MDRC_logistics_desc: "A well-trained battalion that arrives without fuel, food or serviceable radios is still an ineffective battalion. Consolidate depots, standardize inventories and assign accountable maintenance officers. A common supply service reduces division supply consumption by 8% and improves organization recovery by 5%, making the army more useful between battles as well as during them. The revised delivery supplies 150 utility vehicles. Research bonuses and institutional rewards are shown separately below. Standardize fuel handling and convoy planning between central depots and field formations. Efficient transport reduces emergency dependence on requisition. Additional effects: +5000 fuel (subject to storage capacity); +10 command power; one 25% fuel efficiency research bonus. Each reform immediately improves FARDC Sustainment Service; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focuses:\nComplete §Yany one§! of: §Y$MDRC_professional$§!, §Y$MDRC_territorial$§!."
 MDRC_staff: "Joint Staff College"
 MDRC_staff_desc: "Operational planning, staff exercises and common communications improve command and the timely arrival of reserves. Maintaining the programme adds military spending, while organized support improves recovery."
 MDRC_infantry: "Modern Infantry Training"
 MDRC_infantry_desc: "Prepare common drills for patrols, fire control, communications and casualty replacement. Units will rehearse together before they are expected to fight together. This upgrades the national army spirit to 8% division organization, 5% attack and 5% defence, with a small organization-recovery bonus. These benefits replace the earlier stage rather than stacking with it. The revised delivery supplies 2,000 infantry-equipment units. Research bonuses and institutional rewards are shown separately below. Trial protective equipment alongside small-unit exercises. Training should reduce preventable losses as well as improve marksmanship. Additional effects: +10 army experience; one 25% body armor research bonus. Each reform immediately improves FARDC Sustainment Service; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_logistics$§!."
 MDRC_arsenal: "Kinshasa Arsenal Workshops"
 MDRC_arsenal_desc: "The first task of a Congolese arsenal is not an impressive prototype: it is a repaired weapon, an inspected spare part and a production order delivered on time. Reopen workshops around Kinshasa and connect them to a modest arms factory. Domestic Military Workshops improve production-efficiency growth and its ceiling while providing a base for later procurement. The revised delivery supplies 1,000 infantry-equipment units. Research bonuses and institutional rewards are shown separately below. Train production supervisors and inspection teams. Repair capacity becomes dependable when workshops can repeat a standard to schedule. Additional effects: +8 army experience; one 25% production lines research bonus. Each reform immediately improves FARDC Sustainment Service; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_infantry$§!."
 MDRC_engineers: "Combat Engineers"
 MDRC_engineers_desc: "The river crossing, the repaired culvert and the properly prepared defensive position can decide a campaign in difficult terrain. Train engineering companies and give them a recognized place in operational plans. A permanent engineer-corps spirit adds 4% division defence and two points of maximum entrenchment, alongside practical army experience. The revised delivery supplies 75 utility vehicles, 50 command-and-control equipment sets. Research bonuses and institutional rewards are shown separately below. Issue a common field manual for defensive works, route repair and obstacle reporting. Engineering support must be planned with the formations it serves. Additional effects: +10 command power; one 25% fortifications research bonus. Each reform immediately improves FARDC Sustainment Service; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_arsenal$§!."
 MDRC_academy: "A Joint Staff College"
 MDRC_academy_desc: "A national army needs officers who can plan beyond their own formation. The staff college will conduct map exercises, teach logistics and prepare joint orders for operations across several regions. The final army spirit provides 10% division organization, 8% attack, 8% defence and 5% organization recovery. Staff training also raises command capacity and reinforcement rate. Implementation: Staff exercises add 20 command power immediately. One 50% command-and-control equipment research bonus supports the headquarters modernization programme. Make staff-college exercises test mobilization, depot support and inter-service coordination together. The final course connects separate reforms into a maintained readiness system. Additional effects: +20 army experience; +20 command power. Each reform immediately improves FARDC Sustainment Service; its exact changes and ongoing costs are listed in the effects. Unlocks Conduct Joint Staff Exercises: a funded repeatable programme costing 0.5 treasury and 60 political power, with a 365-day cooldown.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_engineers$§!."
 MDRC_air_idea: "Sustainable Congolese Air Service"
 MDRC_air_idea_desc: "Reliable training, maintenance and an operational reserve give the air service a lasting foundation."
 MDRC_airfields: "Rehabilitate Military Airfields"
 MDRC_airfields_desc: "Runways are only part of an airfield. Repair workshops, fuel handling and instruction rooms around the capital, then establish an air training command. The project adds airfield capacity and an initial spirit that improves air experience gain while reducing accidents. Later crew and service reforms upgrade this same spirit. The revised delivery supplies 50 utility vehicles. Research bonuses and institutional rewards are shown separately below. Register fuel stores, ground vehicles and maintenance crews. Rehabilitation must leave behind a service capable of operating the facilities. Additional effects: +4000 fuel (subject to storage capacity); +5 command power. Each reform immediately improves Congolese Air Service Support; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_logistics$§!."
 MDRC_aircrew: "Train Aircrews and Ground Crews"
 MDRC_aircrew_desc: "A pilot depends on the mechanic who signs off an engine and the instructor who recognizes an unsafe habit. Fund both professions, establish maintenance records and retain qualified technicians. Replacing the training-command spirit with Qualified Air and Ground Crews reduces accidents further and adds a modest agility bonus. Implementation: A training allocation supplies 5,000 fuel, subject to storage capacity, and one 50% light-aircraft research bonus supports evaluating affordable training and combat platforms. Introduce recurrent flying courses and incident reporting. Training reduces the pressure to learn unfamiliar aircraft through operational accidents. Additional effects: +20 air experience; +5000 fuel (subject to storage capacity). Each reform immediately improves Congolese Air Service Support; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_airfields$§!."
 MDRC_air_defence: "Organize Air Defence"
 MDRC_air_defence_desc: "Establish procedures for air warning, dispersal and protection of critical facilities. Protecting important facilities requires warning, coordination and an understanding of when aircraft and ground systems can respond. The programme will establish that organization alongside physical defences, making air security a practiced system rather than a collection of separate purchases. The revised delivery supplies 36 legacy anti-air equipment units. Research bonuses and institutional rewards are shown separately below. Connect air-defence units to the air service through recognition and reporting procedures. Affordable field systems protect dispersed facilities. Additional effects: +10 air experience; +10 command power; one 25% manpads research bonus. Each reform immediately improves Congolese Air Service Support; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_aircrew$§!."
 MDRC_air_service: "A Sustainable Air Service"
 MDRC_air_service_desc: "Aircraft bought for a single emergency often become unusable when their support contracts end. Protect recurrent training and maintenance budgets, keep instructors in service and plan purchases around what we can sustain. The final air-service spirit provides 5% air agility, 15% fewer accidents and 10% greater air-experience gain. Implementation: The permanent service receives one 50% avionics research bonus and one 50% aircraft-engine research bonus, giving it a practical modernization programme beyond its national spirit. Adopt funded maintenance schedules and retain qualified technical personnel. Sustainable operations matter more than an unsupported aircraft inventory. Additional effects: +25 air experience; +10000 fuel (subject to storage capacity). Each reform immediately improves Congolese Air Service Support; its exact changes and ongoing costs are listed in the effects. Unlocks Fund Air-Service Readiness: a funded repeatable programme costing 0.5 treasury and 60 political power, with a 365-day cooldown.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_air_defence$§!."
 MDRC_river_idea: "Coordinated River Patrols"
 MDRC_river_idea_desc: "An organized patrol service secures internal supply movements and coordinates its operations."
 MDRC_waterways: "Secure the Waterways"
 MDRC_waterways_desc: "Much of the Republic moves by water, and a landing can matter more than a road junction. Establish small patrol crews with clear civilian liaison duties and practical navigation training. The first naval spirit creates a permanent source of naval-experience growth; the maritime school and patrol reforms will improve it. The revised delivery supplies 50 command-and-control equipment sets. Research bonuses and institutional rewards are shown separately below. Register river patrol stations alongside civilian landing points. A shared navigation picture makes patrol activity useful to ordinary transport. Additional effects: +10 navy experience; +2500 fuel (subject to storage capacity). Each reform immediately improves Congo Basin Navigation Service; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_logistics$§!."
 MDRC_maritime: "A Maritime Training School"
 MDRC_maritime_desc: "A permanent school at the Atlantic gateway can train the officers and technicians needed by both coastal and inland services. Replace improvised instruction with a regular curriculum, chart work and maintenance courses. The upgraded naval spirit improves coordination and naval-experience gain. Implementation: The school provides one 50% naval-engine research bonus and one 50% naval-radar research bonus, training the technical service needed to maintain and navigate future vessels. Train technical ratings and navigators in common communications procedures. The school must support maintenance of the vessels actually available. Additional effects: +15 navy experience; one 25% naval electronics research bonus. Each reform immediately improves Congo Basin Navigation Service; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_waterways$§!."
 MDRC_patrols: "Coordinated River Patrols"
 MDRC_patrols_desc: "Patrols must answer to a schedule and a common authority, not merely appear when a local commander requests them. Coordinate naval crews, port officials and army transport officers. The final river-service spirit reduces national supply consumption by 3%, improves naval coordination by 5% and raises naval-experience gain by 10%. The revised delivery supplies 50 command-and-control equipment sets. Research bonuses and institutional rewards are shown separately below. Create a joint desk for patrol reports, port administration and repair schedules. Connected stations cover the river system more effectively than isolated detachments. Additional effects: +20 navy experience; +10 command power. Each reform immediately improves Congo Basin Navigation Service; its exact changes and ongoing costs are listed in the effects. Unlocks Coordinate River and Coastal Exercises: a funded repeatable programme costing 0.25 treasury and 50 political power, with a 365-day cooldown.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_maritime$§!."
 MDRC_diplomacy: "Return to Regional Diplomacy"
 MDRC_diplomacy_desc: "Rebuild a diplomatic service that can negotiate from a clear national mandate. Foreign governments need to know whether a Congolese delegation can speak for a settled policy. Rebuilding the diplomatic service will give embassies clear instructions and the expertise to connect security, trade and reconstruction instead of negotiating each in isolation. A permanent diplomatic service reduces improve-relations maintenance costs by 5%; later regional focuses upgrade it. Reopen working contact with the neighbouring Congo and assign permanent staff to regional files. The foreign ministry needs institutional memory between summits. Additional effects: reciprocal +25 opinion with CNG only when those countries exist and are at peace with DRC. Each reform immediately improves Kinshasa Regional Cooperation Secretariat; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_mandate$§!."
 MDRC_neighbours: "Consult the Southern Neighbours"
 MDRC_neighbours_desc: "Maintain practical relations with Angola, Zambia and Zimbabwe. Practical cooperation with southern neighbours can keep transport links and political channels open even when wider alignments are contested. Consultations will concentrate on shared interests and predictable relations, preserving room for the Republic to choose its own longer-term diplomatic course. Permanent regional liaison offices upgrade the diplomatic spirit to -10% improve-relations maintenance cost and +3% trade opinion. Extend consultation to Tanzania and coordinate technical discussions across southern and eastern corridors. Routine contact helps resolve transport disputes. Additional effects: reciprocal +25 opinion with TNZ only when those countries exist and are at peace with DRC. Each reform immediately improves Kinshasa Regional Cooperation Secretariat; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_diplomacy$§!."
 MDRC_west: "A Western Partnership"
 MDRC_west_desc: "Seek technical cooperation and investment from the United States, France and Belgium without committing to a military bloc. Commercial access and professional exchanges can support reconstruction without making every Congolese policy dependent on approval abroad. The government will pursue a Western partnership around defined projects and institutions while keeping decisions on military commitments separate from economic cooperation. A one-year delegation programme adds -15% improve-relations maintenance cost and +5% trade opinion. Broaden Western cooperation through German and British technical contacts. A diversified network provides more than one source of training and advice. Additional effects: reciprocal +25 opinion with GER, ENG only when those countries exist and are at peace with DRC. Each reform immediately improves Kinshasa Regional Cooperation Secretariat; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_neighbours$§!."
 MDRC_western_training: "Western Training Missions"
 MDRC_western_training_desc: "Host professional exchanges and civilian oversight seminars. Visiting missions are most useful when their lessons can be taught again by Congolese instructors. Exchanges will therefore concentrate on professional education, maintenance and civilian oversight, so that expertise remains after the delegation returns home. The revised delivery supplies 75 command-and-control equipment sets. Research bonuses and institutional rewards are shown separately below. Existing agreements, stored equipment and domestic instructors can sustain the programme if formal relations later change. Evaluate battalion support equipment and build a domestic instructor cadre. Agreements should leave skills that remain when visiting personnel depart. Additional effects: +10 army experience; one 25% support weapons research bonus. Each reform immediately improves Kinshasa Regional Cooperation Secretariat; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_west$§!."
 MDRC_credit: "Export Credit Agreements"
 MDRC_credit_desc: "Use export guarantees to support civilian imports and reconstruction. Civilian firms often need equipment before their production can generate the income to pay for it. Export guarantees and negotiated credit support will help bridge that gap, with imports tied to practical reconstruction needs rather than a new round of prestige purchases. One 50% construction research bonus accompanies the civilian credit package. Prepare credit projects around realistic energy and maintenance requirements. Productive capacity must remain usable after financing is agreed. Additional effects: Reconstruction Works for 180 days, including its listed upkeep; one 25% energy efficiency research bonus. Each reform immediately improves Kinshasa Regional Cooperation Secretariat; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_western_training$§!."
 MDRC_standards: "Transparent Investment Standards"
 MDRC_standards_desc: "Align tendering with published standards to attract long-term investment. Investors need consistent rules, while citizens need assurance that consistency is not simply protection for favored contractors. Published tendering and disclosure standards will give both sides a way to evaluate agreements and challenge arrangements that undermine long-term confidence. Applying production standards grants one year of +4% factory output and +6% production-efficiency growth. Standardize concession obligations and procurement reports. Transparent records make international cooperation easier to supervise domestically. Additional effects: Treasury Reconstruction Team for 180 days, including its listed upkeep. Each reform immediately improves Kinshasa Regional Cooperation Secretariat; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_credit$§!."
 MDRC_east: "An Eastern Partnership"
 MDRC_east_desc: "Seek commercial and technical ties with China and Russia while retaining control over domestic policy. Chinese and Russian cooperation may offer equipment, technical experience and different financing options for reconstruction. Agreements will be assessed against Congolese priorities, with the government seeking useful partnerships while retaining responsibility for the obligations they create. A one-year delegation programme adds -15% improve-relations maintenance cost and +5% trade opinion. Create permanent liaison desks for Chinese and Russian partnerships. Consistent documentation helps negotiate maintenance and training commitments. Additional effects: reciprocal +25 opinion with CHI, SOV only when those countries exist and are at peace with DRC. Each reform immediately improves Kinshasa Regional Cooperation Secretariat; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_neighbours$§!."
 MDRC_equipment_mission: "Technical Equipment Missions"
 MDRC_equipment_mission_desc: "Host technical exchanges focused on maintenance and logistics. A maintenance system matters more than the appearance of an equipment inventory. Technical exchanges will train Congolese personnel to understand, service and manage their tools, making procurement useful over its working life rather than only on the day it arrives. The revised delivery supplies 1,200 infantry-equipment units. Research bonuses and institutional rewards are shown separately below. Existing agreements, stored equipment and domestic instructors can sustain the programme if formal relations later change. Require missions to train personnel in inspection, servicing and ammunition compatibility. Equipment remains useful only when support can be maintained. Additional effects: +10 army experience; one 25% artillery research bonus. Each reform immediately improves Kinshasa Regional Cooperation Secretariat; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_east$§!."
 MDRC_infrastructure_credit: "Infrastructure Credit"
 MDRC_infrastructure_credit_desc: "Accept a limited reconstruction loan. Funds received increase the treasury and debt by the same amount. Borrowing can bring a useful project forward, but it cannot turn an obligation into free money. The proposed credit will provide immediate funds while adding an equal debt commitment, placing the responsibility for repayment alongside the benefits of accelerated construction. One 50% infrastructure research bonus supports projects financed by the loan; its treasury and debt obligations remain. Publish a construction schedule and mobilize engineers for the loan programme. Initial works disrupt local routines, and the original loan still adds debt. Additional effects: -1 stability percentage points; Reconstruction Works for 180 days, including its listed upkeep. Each reform immediately improves Kinshasa Regional Cooperation Secretariat; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_equipment_mission$§!."
 MDRC_joint_ventures: "Publish the Joint-Venture Accounts"
 MDRC_joint_ventures_desc: "Require joint ventures to disclose obligations and payments before further expansion. A joint venture can hide future liabilities behind impressive construction announcements. Public accounts will identify what each partner contributes and what the state has promised, allowing further cooperation to rest on obligations that can be understood and managed. One 50% production-line research bonus brings technical follow-through to the joint ventures. Use published accounts to settle outstanding joint-venture fees and establish common reporting. Better records improve investment supervision. Additional effects: +0.25 treasury; one 25% computing research bonus. Each reform immediately improves Kinshasa Regional Cooperation Secretariat; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_infrastructure_credit$§!."
 MDRC_nonaligned: "African Non-Alignment"
 MDRC_nonaligned_desc: "Build working partnerships across Africa and avoid dependence on a single great-power sponsor. African cooperation can give the Republic partners without requiring exclusive dependence on a distant sponsor. The government will pursue practical exchanges across the continent, treating diplomatic flexibility as a way to preserve national choice while building useful relationships. A one-year delegation programme adds -15% improve-relations maintenance cost and +5% trade opinion. Build African cooperation around practical relations with Angola and the neighbouring Congo. Non-alignment should create negotiating room rather than isolation. Additional effects: reciprocal +25 opinion with AGL, CNG only when those countries exist and are at peace with DRC. Each reform immediately improves Kinshasa Regional Cooperation Secretariat; its exact changes and ongoing costs are listed in the effects. This diplomatic route also supports the Congolese regional-union decisions unlocked by A Regional Voice. Millennium Dawn's shared African Union institutions are a separate focus branch: use the MD African Union sidebar shortcut to find Birth Of The African Union and its original MD progression.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_neighbours$§!."
 MDRC_african_training: "African Staff Exchanges"
 MDRC_african_training_desc: "Share experience with regional armed forces and civilian institutions. Regional partners face practical problems of distance, resources and institutional development that can inform our own reforms. Staff exchanges will compare experience and build professional contacts, allowing lessons to travel between armies without requiring a common military bloc. The revised delivery supplies 100 utility vehicles. Research bonuses and institutional rewards are shown separately below. Existing agreements, stored equipment and domestic instructors can sustain the programme if formal relations later change. Exchange experience in difficult terrain, observation and maintenance. Regional courses should produce instructors able to adapt lessons to Congolese units. Additional effects: +10 army experience; one 25% night vision research bonus. Each reform immediately improves Kinshasa Regional Cooperation Secretariat; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_nonaligned$§!."
 MDRC_south_south: "South-South Development Cooperation"
 MDRC_south_south_desc: "Arrange technical assistance and modest funding for local development. Development cooperation need not begin with the most expensive project or the largest outside delegation. Modest technical assistance and focused funding can support local capabilities, helping institutions learn from partners whose experience is closer to the conditions they face. One 50% agricultural research bonus accompanies development assistance. Direct cooperation toward extension services and rural repair facilities. Practical programmes provide benefits before larger investments mature. Additional effects: Rural Recovery for 180 days, including its listed upkeep. Each reform immediately improves Kinshasa Regional Cooperation Secretariat; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_african_training$§!."
 MDRC_mediation: "A Congolese Mediation Service"
 MDRC_mediation_desc: "Train diplomats to maintain channels between governments even when relations deteriorate. A government that keeps channels open can help prevent disputes from closing every other avenue of cooperation. Training a mediation service will give the Republic diplomats able to listen, carry proposals and maintain credibility when relations between neighbours become difficult. A one-year liaison programme adds +3% stability and +10 maximum command power while diplomatic channels mature. Maintain civilian diplomatic channels with Rwanda and Uganda wherever peace permits. Mediation requires repeated contact and credible administrative support. Additional effects: reciprocal +25 opinion with RWA, UGA only when those countries exist and are at peace with DRC. Each reform immediately improves Kinshasa Regional Cooperation Secretariat; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_south_south$§!."
 MDRC_regional_trade: "Regional Trade Corridors"
 MDRC_regional_trade_desc: "Build practical trade relationships regardless of the foreign-policy orientation chosen in Kinshasa. Congolese businesses need dependable access to neighbouring markets regardless of the preferred great-power partner of the cabinet. Practical corridor agreements will concentrate on the movement of goods and commercial information, creating interests that can survive a change in diplomatic fashion. Trade missions support a one-year industrial programme with +4% factory output and +6% production-efficiency growth. Link corridor negotiations to navigation, freight handling and construction standards. Commerce requires compatible land and river transport procedures. Additional effects: +5 navy experience; one 25% construction research bonus. Each reform immediately improves Congo Basin Navigation Service; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focuses:\nComplete §Yany one§! of: §Y$MDRC_standards$§!, §Y$MDRC_joint_ventures$§!, §Y$MDRC_mediation$§!."
 MDRC_customs: "Joint Customs Procedures"
 MDRC_customs_desc: "Reduce delays through compatible documentation and exchanges between border services. Unclear paperwork and conflicting procedures can delay goods even where the road itself is open. Border services will work toward compatible documents and predictable treatment, reducing opportunities for arbitrary obstruction and making legitimate trade easier to distinguish from evasion. Joint customs upgrades the regional diplomatic spirit to +6% trade opinion and +2% production-efficiency growth, retaining its diplomatic cost reduction. Unlocks Build the Matadi Customs Service Centre, a separately funded one-time project costing 1 treasury and 50 political power. Complete one office-sector building in Bas-Congo. Reconcile uncollected fees and improve port-office records through joint documentation. Customs reform should support legitimate transport rather than arbitrary tolls. Additional effects: +0.25 treasury. Each reform immediately improves Congo Basin Navigation Service; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_regional_trade$§!."
 MDRC_regional_voice: "A Regional Voice"
 MDRC_regional_voice_desc: "Use economic recovery and consistent diplomacy to restore the Republic standing in Africa. A stronger diplomatic position grows from consistent conduct as well as economic weight. By connecting reconstruction with practical regional cooperation, the Republic can seek a greater voice in African affairs and offer partners something more durable than another declaration. The final diplomatic institution provides -15% improve-relations maintenance cost, +8% trade opinion, and +3% production-efficiency growth. Give the cooperation secretariat a lasting mandate for African consultations. Regional initiatives can now outlast individual diplomatic visits. Additional effects: +50 political power; reciprocal +25 opinion with SAF, TNZ only when those countries exist and are at peace with DRC. Each reform immediately improves Kinshasa Regional Cooperation Secretariat; its exact changes and ongoing costs are listed in the effects. Reveals the United States of Central Africa and African Union decisions in Regional Unions and Integration. Unmet political and territorial requirements are shown on each decision. Formation preserves puppets. Unlocks Host a Regional Reconstruction Summit: a funded repeatable programme costing 0.5 treasury and 75 political power, with a 365-day cooldown.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_customs$§!."
 MDRC_war_council: "Confront the Congo War"
 MDRC_war_council_desc: "The war has fragmented authority and drawn neighbouring states into Congolese affairs. Choose between a negotiated settlement and military reunification. The government must decide what outcome it is seeking before ordering another campaign or entering another conference. A national war council will bring military and civilian assessments together, setting the terms on which negotiations or armed reunification can proceed. The revised delivery supplies 75 command-and-control equipment sets. Research bonuses and institutional rewards are shown separately below. Reconcile regional reports and identify verified personnel available for national service. A common situation picture is necessary under either conflict strategy. Additional effects: +10 command power; +1000 available manpower. Each reform immediately improves Eastern Frontier Command System; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_mandate$§!."
 MDRC_negotiations: "Revive the Lusaka Process"
 MDRC_negotiations_desc: "Invite neighbouring belligerents to a ceasefire. Each government may accept or reject; talks do not guarantee a settlement. A ceasefire is a proposal to an opponent, not an instruction that the opponent must obey. Renewing the process will test whether neighbouring belligerents see value in stopping the fighting, while preserving the need to settle the separate question of national reunification. A one-year ceasefire liaison network adds +3% stability and +10 maximum command power; foreign acceptance remains a separate decision. Prepare a civilian negotiating secretariat and publish the issues requiring agreement. Talks carry a short political cost before a settlement delivers benefits. Additional effects: -1 stability percentage points; +25 political power. Each reform immediately improves Great Lakes Civilian Recovery Authority; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_war_council$§!."
 MDRC_ddr_idea: "Reintegration Programme"
 MDRC_ddr_idea_desc: "Demobilization eases the social cost of war. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_observers: "Support International Observers"
 MDRC_observers_desc: "Provide liaison teams and access for ceasefire monitoring. Agreements need a means of communicating incidents before every accusation becomes a new offensive. Liaison teams and access for observers will help maintain that channel, although monitoring alone cannot force governments or armed formations to abandon their political objectives. The revised delivery supplies 75 utility vehicles. Research bonuses and institutional rewards are shown separately below. Standardize observer incident reports and local response channels. Useful monitoring requires records and follow-up rather than symbolic presence. Additional effects: +10 command power; one 25% computing research bonus. Each reform immediately improves Great Lakes Civilian Recovery Authority; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_negotiations$§!."
 MDRC_sun_city: "The Sun City Negotiations"
 MDRC_sun_city_desc: "Offer the rebel administrations representation in a reunited Republic. An integration offer requires peace with DRC and an administration that is independent or already a subject of DRC; a foreign subject cannot accept. Each administration may accept or refuse. Acceptance transfers its territory and armed forces to the Republic; refusal transfers nothing. Decisions allow renewed offers after a cooldown. A two-year reconciliation programme adds +4% stability and +3% political-power gain while integration is negotiated. Prepare budgets and staffing for administrations that voluntarily rejoin the Republic. Civil servants must turn agreements into functioning public authority. Additional effects: +1 stability percentage points; Treasury Reconstruction Team for 180 days, including its listed upkeep. Each reform immediately improves Great Lakes Civilian Recovery Authority; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_observers$§!."
 MDRC_ddr: "Disarmament and Reintegration"
 MDRC_ddr_desc: "Finance civilian reintegration and common training for former combatants. A former fighter needs an alternative livelihood as well as an order to surrender a weapon. A two-year civilian livelihoods programme adds +3% stability and +10% agricultural construction speed alongside the reintegration spirit. This national-focus project is funded through its reconstruction programme; no treasury balance is required to begin it. Direct reintegration toward civilian documentation and sustainable livelihoods. Demobilization reduces the political momentum behind continued mobilization. Additional effects: -2 war-support percentage points; +2 stability percentage points. Each reform immediately improves Great Lakes Civilian Recovery Authority; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_sun_city$§!."
 MDRC_reunification: "Reunification by Force"
 MDRC_reunification_desc: "Prepare to defeat the rebel administrations. War goals are granted only against existing independent rebel states outside our faction; declarations remain a player decision. Military victory must lead to a territory the state can actually administer. Preparations will therefore link campaign objectives to logistics and future civilian authority; the government will receive the means to pursue war, but must still decide when and whether to declare it. The revised delivery supplies 1,200 infantry-equipment units. Research bonuses and institutional rewards are shown separately below. Establish unified operational planning before military reunification. Mobilization disrupts civilian life and maintained command institutions have recurring costs. Additional effects: +10 army experience; -2 stability percentage points. Each reform immediately improves Eastern Frontier Command System; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_war_council$§!."
 MDRC_western_front: "Secure the Western Approaches"
 MDRC_western_front_desc: "Prioritize logistics and command coordination before advancing into rebel-held territory. Advancing into rebel-held territory without dependable communications and supply would exchange one exposed line for another. Western preparations will emphasize command coordination and the routes needed to support units, giving operations a practical foundation before objectives are expanded. The revised delivery supplies 125 utility vehicles. Research bonuses and institutional rewards are shown separately below. Rehearse supply movements and reinforcement schedules for the western approaches. Operational plans must fit available transport and fuel. Additional effects: +10 army experience; +5000 fuel (subject to storage capacity). Each reform immediately improves Eastern Frontier Command System; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_reunification$§!."
 MDRC_eastern_front: "Coordinate the Eastern Front"
 MDRC_eastern_front_desc: "Train staff to coordinate difficult operations across the eastern provinces. Distance and difficult access make isolated operations especially vulnerable to failure. A coordinated eastern command will train its staff to connect military movements with supply and intelligence, so that separate units contribute to a common campaign rather than competing for resources. The revised delivery supplies 75 command-and-control equipment sets. Research bonuses and institutional rewards are shown separately below. Improve observation and liaison across difficult eastern terrain. Better reports allow coordination without assuming unlimited mobility. Additional effects: +3000 fuel (subject to storage capacity); +10 command power; one 25% night vision research bonus. Each reform immediately improves Eastern Frontier Command System; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_western_front$§!."
 MDRC_amnesty: "A Conditional Amnesty"
 MDRC_amnesty_desc: "Offer rank-and-file fighters a route back to civilian life while rebuilding a unified chain of command. Treating every former combatant as permanently excluded would leave the country with too many reasons to return to war. A conditional amnesty will distinguish opportunities for reintegration from an unrestricted promise of immunity, connecting reconciliation with a restored public order. A two-year return and reconciliation programme adds +4% stability and +3% political-power gain. Give officials common procedures for conditional amnesties and documentation. Reconciliation shifts attention away from permanent wartime mobilization. Additional effects: +2 stability percentage points; -2 war-support percentage points. Each reform immediately improves Great Lakes Civilian Recovery Authority; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_eastern_front$§!."
 MDRC_territorial_integrity: "Restore Territorial Integrity"
 MDRC_territorial_integrity_desc: "The rebel states must no longer exist, and the Republic must own and control its core territory before declaring reunification complete. A declaration from the capital cannot substitute for actual authority in the provinces. The government will recognize reunification only when the separate rebel administrations are gone and Congolese core territory is both owned and controlled by the Republic. Reunification begins a two-year reconstruction programme with +6% construction speed. Replace emergency arrangements with a public-administration recovery schedule. Reunification must establish responsibilities in every returned province. Additional effects: +40 political power; +10 command power. Each reform immediately improves Great Lakes Civilian Recovery Authority; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focuses:\nComplete §Yany one§! of: §Y$MDRC_ddr$§!, §Y$MDRC_amnesty$§!."
 MDRC_ituri: "Community Mediation in Ituri"
 MDRC_ituri_desc: "Support local dispute resolution and restore civil administration in Ituri. Security in Ituri must be accompanied by officials and community mechanisms capable of handling everyday disputes. Restoring access and civil administration will give local mediation a practical foundation, so that the return of the state is measured by more than a military presence. One 25% agricultural research bonus supports local livelihoods alongside mediation and road repairs. This national-focus project is funded through its reconstruction programme; no treasury balance is required to begin it. Reopen local records and mediation offices alongside road repairs. Transparent administration prevents disputes from being captured by armed intermediaries. Additional effects: Treasury Reconstruction Team for 180 days, including its listed upkeep. Each reform immediately improves Great Lakes Civilian Recovery Authority; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_territorial_integrity$§!."
 MDRC_kivu: "Reopen the Kivu Roads"
 MDRC_kivu_desc: "Restore access to markets and public services in North and South Kivu. A reopened road can reconnect a town to food, trade and public services, but only if access remains dependable. The Kivu reconstruction programme will treat those links as civilian infrastructure to be maintained, helping communities move beyond the emergency geography of war. One 50% infrastructure research bonus supports continued rebuilding beyond the first road repairs. This national-focus project is funded through its reconstruction programme; no treasury balance is required to begin it. Coordinate road maintenance with markets and service routes. Provincial teams need engineering standards they can sustain. Additional effects: +5 command power; one 25% construction research bonus. Each reform immediately improves Great Lakes Civilian Recovery Authority; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_ituri$§!."
 MDRC_traceability: "Traceable Mineral Supply Chains"
 MDRC_traceability_desc: "Require documented mineral purchases and transparent payments to reduce the rewards of armed extraction. Mineral purchases become harder to exploit when buyers must explain where supplies came from and who was paid. Documentation and transparent transactions will reduce the room for hidden intermediaries, linking economic recovery with the effort to weaken incentives for armed extraction. One 25% computing research bonus supports auditable mineral records. Reconcile mineral purchases with declared receipts and secure the reporting system. Traceability should create auditable payments and fewer opportunities for diversion. Additional effects: +0.25 treasury; one 25% encryption research bonus. Each reform immediately improves Great Lakes Civilian Recovery Authority; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_kivu$§!."
 MDRC_returnees: "A Future for Returning Families"
 MDRC_returnees_desc: "Restore public services and support the return of displaced communities. Returning home is only the first step for a family whose services and livelihood have been disrupted. Restored administration and basic public provision will help communities rebuild daily routines, making return a sustainable choice rather than another stage of displacement. A two-year community-health campaign adds +3% stability during the restoration of local services. Unlocks Resettle Kivu Farming Cooperatives, a separately funded one-time project costing 0.75 treasury and 50 political power. Complete one agricultural district in South Kivu. Pair restored documentation and health services with agricultural extension. Return programmes must restore livelihoods without treating civilians as recruits. Additional effects: +2 stability percentage points; one 25% agriculture research bonus. Each reform immediately improves Great Lakes Civilian Recovery Authority; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_traceability$§!."
 MDRC_borders: "A Great Lakes Border Settlement"
 MDRC_borders_desc: "A border arrangement must be more useful than another communique. Establish regular contacts, common reporting procedures and practical cooperation over crossings and trade. The diplomatic programme adds stability and construction benefits, while offering renewed ceasefires where fighting continues. Peace still requires the other governments to accept. A two-year border delegation programme adds -15% improve-relations maintenance cost and +5% trade opinion alongside the permanent settlement spirit. Give the border settlement a permanent civilian follow-up office. A sustained negotiated frontier reduces emphasis on military escalation. Additional effects: -2 war-support percentage points; +35 political power. Each reform immediately improves Great Lakes Civilian Recovery Authority; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_territorial_integrity$§!."
 MDRC_deterrence: "Deterrence on the Eastern Frontier"
 MDRC_deterrence_desc: "A restored frontier can be defended without claiming that every neighbour must become part of Congo. Maintain prepared positions, reliable communications and a reserve able to respond to a crisis. Eastern Deterrent adds 5% division defence and one entrenchment point at a 3% political-power cost; optional confrontation decisions remain a separate choice. The revised delivery supplies 800 infantry-equipment units, 100 utility vehicles. Research bonuses and institutional rewards are shown separately below. Maintain frontier exercises rather than relying on emergency mobilization. Readiness has recurring military costs and a civilian-productivity trade-off. Additional effects: +20 command power; +2 war-support percentage points. Each reform immediately improves Eastern Frontier Command System; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_territorial_integrity$§!."
 MDRC_peace_dividend: "The Peace Dividend"
 MDRC_peace_dividend_desc: "Reunification cannot be measured only by the absence of rebel flags. Roads must remain open, returning families must find public services and the government must be able to fund civilian projects without another military emergency. Reaching peace completes the regional recovery programme and releases a final reconstruction grant. Two-year construction and rural programmes add +6% construction speed, +10% agricultural construction speed, and +3% stability. Unlocks Refit the Katanga Maintenance Workshops, a separately funded one-time project costing 1.5 treasury and 75 political power. Complete one military factory in Katanga. Turn the end of emergency mobilization into civilian reconstruction. The recovery authority retains an administrative budget while supporting confidence and production. Additional effects: +2 stability percentage points; one 25% construction research bonus. Each reform immediately improves Great Lakes Civilian Recovery Authority; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired focuses: satisfy §Yevery§! line below:\nComplete §Y$MDRC_returnees$§!.\nComplete §Yany one§! of: §Y$MDRC_borders$§!, §Y$MDRC_deterrence$§!."
 MDRC_renaissance_idea: "The Congolese Renaissance"
 MDRC_renaissance_idea_desc: "Reconstruction has become a durable national project. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_renaissance: "The Congolese Renaissance"
 MDRC_renaissance_desc: "Effective institutions, a diversified economy, a professional military and restored territorial integrity allow the Republic to plan beyond the next crisis. The measure of renewal is whether institutions can keep working when the next crisis arrives. Political settlement, industrial recovery, professional armed forces and peace will together give the Republic a foundation for ambitions that extend beyond survival and immediate reconstruction. A final policy event lets us choose a two-year research, industrial, or public-works programme alongside the permanent renaissance spirit. Consolidate audits, qualifications and provincial reporting into a permanent national review process. A modest implementation fund supports evidence-based institutional renewal. Additional effects: +75 political power; +0.25 treasury; one 25% artificial intelligence research bonus. Each reform immediately improves Congolese Public Accounts; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired focuses: satisfy §Yevery§! line below:\nComplete §Y$MDRC_public_service$§!.\nComplete §Y$MDRC_value_chain$§!.\nComplete §Y$MDRC_integration$§!.\nComplete §Y$MDRC_social_contract$§!.\nComplete §Y$MDRC_academy$§!.\nComplete §Y$MDRC_air_service$§!.\nComplete §Y$MDRC_patrols$§!.\nComplete §Y$MDRC_regional_voice$§!.\nComplete §Y$MDRC_peace_dividend$§!."
 MDRC_technical_bonus: "Congolese Technical Scholarships"
 MDRC_army_fragmented: "An Army of Separate Commands"
 MDRC_army_fragmented_desc: "Wartime formations answer to overlapping chains of command. Payroll fraud, interrupted supply and incompatible training make coordinated operations unreliable. The army-reform branch replaces this spirit in stages.\n§W--------------§!\n This national spirit will §GImprove§! if we complete the §Y$MDRC_army_audit$§! focus. It will be §RRemoved§! if we complete the §Y$MDRC_LDK_land_forces$§! focus."
 MDRC_army_registered: "A Force on the Register"
 MDRC_army_registered_desc: "The army now knows which units exist, but its officers still struggle to make them fight together. Verified payrolls and a national training system are the next steps.\n§W--------------§!\n This national spirit will §GImprove§! if we complete the §Y$MDRC_payroll$§! focus."
 MDRC_army_paid: "Soldiers with a Paymaster"
 MDRC_army_paid_desc: "Reliable pay has weakened commanders dependence on private revenue. Unit training and operational coordination remain uneven.\n§W--------------§!\n This national spirit will §GImprove§! if we complete the §Y$MDRC_fardc$§! focus."
 MDRC_army_drilled: "FARDC: Common Battle Drills"
 MDRC_army_drilled_desc: "Regular formations share communications procedures, fire-control drills and standards for replacing casualties. Tactical cohesion now supports both offensive and defensive operations."
 MDRC_army_integrated: "FARDC: An Integrated Fighting Force"
 MDRC_army_integrated_desc: "A trained staff can sustain operations across several regions and coordinate infantry, engineers and support services. A difficult reform has produced a national army with practical combat capability."
 MDRC_state_fragile: "A Republic on Paper"
 MDRC_state_fragile_desc: "Orders from Kinshasa do not reliably become services in the provinces. Weak records and competing authorities make reconstruction expensive and political legitimacy fragile. Reporting and oversight improve production-efficiency growth while adding administrative expenditure.\n§W--------------§!\n This national spirit will §GImprove§! if we complete the §Y$MDRC_JK_transition$§! focus. It will be §RRemoved§! if we complete the §Y$MDRC_LDK_consolidate$§! focus."
 MDRC_state_transition: "A Negotiated Transition"
 MDRC_state_transition_desc: "A national framework exists, but its institutions remain provisional. A constitutional settlement and professional administration can turn this fragile bargain into durable public authority. Reporting and oversight improve production-efficiency growth while adding administrative expenditure.\n§W--------------§!\n This national spirit will be §RRemoved§! if we complete the §Y$MDRC_public_service$§! focus."
 MDRC_economy_dislocated: "Disconnected Markets"
 MDRC_economy_dislocated_desc: "Broken distribution links and uncertain public procurement prevent domestic firms from operating at their potential. An accountable development plan can remove these barriers. Reporting and oversight improve production-efficiency growth while adding administrative expenditure.\n§W--------------§!\n This national spirit will §GImprove§! if we complete the §Y$MDRC_procurement$§! focus. It will be §RRemoved§! if we complete the §Y$MDRC_LDK_development$§! focus."
 MDRC_economy_recovering: "Recovery Under Supervision"
 MDRC_economy_recovering_desc: "Published tenders and reconstructed accounts have begun to restore confidence. The remaining obstacle is choosing a coherent development programme. Reporting and oversight improve production-efficiency growth while adding administrative expenditure.\n§W--------------§!\n This national spirit will be §RRemoved§! if we complete the §Y$MDRC_development$§! focus."
 MDRC_engineer_corps: "The Congolese Engineer Corps"
 MDRC_engineer_corps_desc: "Trained engineering companies prepare field positions and keep military routes usable. Maintaining the programme adds military spending, while organized support improves recovery."
 MDRC_arsenal_idea: "Domestic Military Workshops"
 MDRC_arsenal_idea_desc: "A small domestic workshop network maintains production runs and reduces dependence on hurried procurement. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_air_school: "Reopened Air Training Command"
 MDRC_air_school_desc: "Scheduled training and basic maintenance reduce avoidable accidents while rebuilding the air service. Maintaining the programme adds military spending, while organized support improves recovery."
 MDRC_aircrew_idea: "Qualified Air and Ground Crews"
 MDRC_aircrew_idea_desc: "Qualified crews, instructors and maintenance personnel can use aircraft more effectively and sustain regular training."
 MDRC_river_school: "A River Patrol Cadre"
 MDRC_river_school_desc: "Boat crews, mechanics and liaison officers are learning to work as one service. Maintaining the programme adds military spending, while organized support improves recovery."
 MDRC_river_officers: "The Matadi Maritime School"
 MDRC_river_officers_desc: "A permanent school trains officers and coordinates patrols with port authorities. Maintaining the programme adds military spending, while organized support improves recovery."
 MDRC_constitutional_mature: "A Republic That Can Change Governments"
 MDRC_constitutional_mature_desc: "Independent institutions have made a peaceful transfer of power credible."
 MDRC_executive_mature: "The Presidential Development Compact"
 MDRC_executive_mature_desc: "A durable executive bargain accelerates construction and administration while retaining a cost to public trust."
 MDRC_federalism_mature: "A Federation of Working Provinces"
 MDRC_federalism_mature_desc: "Capable provincial governments share resources without surrendering their place in the Republic."
 MDRC_service_mature: "The Sovereign Reconstruction State"
 MDRC_service_mature_desc: "National service and centralized administration support defence and domestic construction, at a continuing cost to industry."
 MDRC_investment_mature: "Competitive Investment Corridors"
 MDRC_investment_mature_desc: "Published concessions and domestic supplier contracts have turned external investment into a reliable industrial programme."
 MDRC_public_mines_mature: "An Integrated Public Mining Sector"
 MDRC_public_mines_mature_desc: "Technical management and domestic processing retain more resource value inside the country, while state financing remains slower."
 MDRC_technical_education: "A Network of Technical Colleges"
 MDRC_technical_education_desc: "University laboratories, vocational courses and industry placements turn public education into practical technical capacity. Trained staff support productivity growth but require additional administrative expenditure."
 MDRC_clinic_network: "A Provincial Health Network"
 MDRC_clinic_network_desc: "Functioning clinics and medical supply routes improve confidence in the everyday work of the state. Trained staff support productivity growth but require additional administrative expenditure."
 MDRC_western_mission: "Western Professional Training Mission"
 MDRC_western_mission_desc: "Officer exchanges emphasize flexible staff procedures and professional unit training. Maintaining the programme adds military spending, while organized support improves recovery."
 MDRC_eastern_mission: "Eastern Equipment and Maintenance Mission"
 MDRC_eastern_mission_desc: "Technical assistance prioritizes efficient use of established equipment and practical firepower. Maintaining the programme adds military spending, while organized support improves recovery."
 MDRC_african_mission: "African Staff Exchanges"
 MDRC_african_mission_desc: "Regional experience emphasizes holding ground and operating with modest logistical resources. Maintaining the programme adds military spending, while organized support improves recovery."
 MDRC_postwar_settlement: "The Great Lakes Settlement"
 MDRC_postwar_settlement_desc: "Border cooperation and a demobilized interior allow the state to spend political capital on reconstruction. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_border_deterrence: "An Eastern Deterrent"
 MDRC_border_deterrence_desc: "Permanent border preparation strengthens defensive readiness, but supporting the posture absorbs administrative attention."
 MDRC_political_public_mandate: "A Public Mandate for Reconstruction"
 MDRC_political_public_mandate_desc: "Civic delegations have given the reconstruction council a limited window of public confidence. The mandate lasts 210 days; it supplements, rather than removes, the Republic underlying institutional problems. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_political_transition_secretariat: "The Transitional Secretariat"
 MDRC_political_transition_secretariat_desc: "A temporary joint secretariat coordinates ministry budgets and reconstruction priorities. Its 365-day mandate provides construction and administrative momentum while a permanent political settlement is chosen. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_political_procurement_review: "Civilian Procurement Review"
 MDRC_political_procurement_review_desc: "Parliamentary committees are reviewing defence procurement and publishing delivery schedules. This 365-day programme improves production-efficiency growth while the permanent civilian oversight framework remains in force. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_political_guard_readiness: "Presidential Guard Readiness Programme"
 MDRC_political_guard_readiness_desc: "A 365-day programme of joint training and readiness inspections makes the guard available as a disciplined reserve. It improves organization recovery and reinforcement without creating another permanent army institution. Maintaining the programme adds military spending, while organized support improves recovery."
 MDRC_civic_charter: "Republican Institutions: Civic Charter"
 MDRC_civic_charter_desc: "A public commitment to competitive government begins the republican institutional programme. Electoral registration, constitutional guarantees, provincial courts and free reporting progressively replace this spirit. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_civic_register: "Republican Institutions: The Electoral Register"
 MDRC_civic_register_desc: "Verified registration and a professional election administration make national political participation more credible. This stage replaces the civic charter and will be upgraded by constitutional and judicial reform. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_civic_courts: "Republican Institutions: Justice in the Provinces"
 MDRC_civic_courts_desc: "Constitutional government now reaches provincial courts and public records. A modest improvement in administrative productivity accompanies the inherited constitutional guarantees."
 MDRC_civic_press: "Republican Institutions: Public Accountability"
 MDRC_civic_press_desc: "Courts, electoral records and a protected press allow citizens to question official performance. These institutions retain constitutional benefits while improving the practical accountability of public administration."
 MDRC_executive_appointments: "Executive Institutions: A Reconstruction Mandate"
 MDRC_executive_appointments_desc: "The presidency has concentrated reconstruction authority but still needs offices capable of carrying out its decisions. Provincial appointments and accountable project management will develop this programme in stages. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_executive_governors: "Executive Institutions: Responsible Governors"
 MDRC_executive_governors_desc: "Provincial executives now work to common reconstruction targets. The programme links political authority to project delivery and provides an initial improvement in construction coordination. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_executive_audited: "Executive Institutions: An Audited Presidency"
 MDRC_executive_audited_desc: "Presidential reconstruction funds are subject to internal audit. The centralized system retains its political tradeoffs but executes projects with less leakage and clearer responsibilities."
 MDRC_executive_delivery: "Executive Institutions: Delivery Contracts"
 MDRC_executive_delivery_desc: "Governors and ministries receive published project schedules and are assessed against delivery. Construction coordination improves without removing the political cost of centralized presidential authority."
 MDRC_federal_compact: "Federal Institutions: A Provincial Compact"
 MDRC_federal_compact_desc: "A constitutional commitment to provincial authority begins the federal programme. Elected assemblies, revenue rules and accessible administration will progressively replace this initial arrangement. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_federal_assemblies: "Federal Institutions: Provincial Budget Offices"
 MDRC_federal_assemblies_desc: "Provincial assemblies can scrutinize local budgets and coordinate basic infrastructure priorities. This stage turns constitutional autonomy into working administrative capacity. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_federal_audits: "Federal Institutions: Accountable Provinces"
 MDRC_federal_audits_desc: "Independent audit chambers support the provincial revenue settlement. Transparent local accounts improve administrative capacity while retaining the stability and infrastructure benefits of federalism."
 MDRC_federal_access: "Federal Institutions: Accessible Government"
 MDRC_federal_access_desc: "Provincial administration now combines revenue rights, independent audits and services that communities can understand. Greater access strengthens the practical work of the federal settlement."
 MDRC_municipal_methods_bonus: "Municipal Engineering and Planning"
 MDRC_sovereign_emergency: "Sovereign Institutions: An Emergency Directorate"
 MDRC_sovereign_emergency_desc: "The new government is organizing a national mobilization programme. It provides an initial readiness benefit but does not yet possess the trained reserve or reconstruction service promised by its charter. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_sovereign_charter: "Sovereign Institutions: A Mobilization Charter"
 MDRC_sovereign_charter_desc: "The charter defines responsibilities for recruitment and national readiness. Its initial manpower framework will be developed into a more capable reconstruction and reserve service."
 MDRC_sovereign_audit: "Sovereign Institutions: Accountable National Service"
 MDRC_sovereign_audit_desc: "Auditors have clarified the personnel and financial responsibilities of national service. The mobilization system retains its economic cost while gaining more dependable administration and defensive readiness."
 MDRC_sovereign_reserve: "Sovereign Institutions: A Prepared National Reserve"
 MDRC_sovereign_reserve_desc: "The national service now maintains a trained reserve with identified supply responsibilities. Its stronger defensive capacity remains tied to the economic burden of maintaining mass mobilization."
