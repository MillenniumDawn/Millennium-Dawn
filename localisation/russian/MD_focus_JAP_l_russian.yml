 JAP_mitsubishi_ship_mio_trait_submarine_research: "Отдел исследований экспорта подводных лодок"
 JAP_choice: "Политическая перезагрузка"
 JAP_choice_desc: "В условиях затяжной стагнации и институциональной усталости доверие к политике пошатнулось, а необходимость реформ только нарастала. Для того чтобы страна двигалась вперед, она должна сначала определить четкий курс управления и создать основу для принятия решений."
 JAP_left: "Левое крыло Японии"
 JAP_left_desc: "Цель политики – не только экономический рост, но и защита средств к существованию и достоинства людей. Мы обеспечим прозрачность и будем строго контролировать власть имущих, укрепим переговорные позиции трудящихся и систему социальной защиты, а также сократим неравенство и нестабильность. Проводя политику, не игнорирующую права человека, и продвигая переход к устойчивой энергетике, мы стремимся к перестройке японского общества."
 JAP_left_TT: "§YВы можете значительно повысить рейтинг одной из левых партий!\nОднако, если это будет правящая партия, прирост останется небольшим.§!"
 JAP_information_disclosure: "Укрепить раскрытие информации"
 JAP_information_disclosure_desc: "Для восстановления доверия к политике и государственному управлению мы будем обеспечивать полное раскрытие информации и усиливать процесс создания, хранения и публикации официальных документов. Это позволит устранить почву для коррупции и сговора, сделать политические решения более прозрачными и облегчить продвижение реформ."
 JAP_left_party_TT: "Должно выполняться одно из следующих условий:\n§Y$JAP.liberalism$§! у власти.\n§Y$JAP.liberalism_alt$§! у власти.\n§Y$JAP.neutral_Social$§! у власти.\n§Y$JAP.Neutral_Communism$§! у власти.\n§Y$JAP.anarchist_communism$§! у власти.\n"
 JAP_management_documents: "Строгое обращение с официальными документами."
 JAP_management_documents_desc: "Мы будем систематизировать и сохранять записи о политических решениях, историю административных процедур и документы, хранящиеся в государственных учреждениях, в соответствии с единым стандартом, одновременно укрепляя систему управления. Предотвращая разрозненность документов и ненадлежащее обращение с ними, а также повышая проверяемость и административную преемственность, мы стремимся повысить надежность и практическую эффективность государственных операций."
 JAP_digital_archiving: "Цифровое архивирование официальных документов"
 JAP_digital_archiving_desc: "Мы оцифруем официальные документы и будем управлять ими централизованно, чтобы упростить процедуры поиска, обмена и сохранения. Отказавшись от бумажной документации, мы сократим административную нагрузку и управленческие расходы, а также ограничим государственные затраты."
 JAP_independent_audits: "Полный независимый аудит"
 JAP_independent_audits_desc: "Мы обеспечим полную независимость аудиторских органов и создадим систему надзора, свободную от вмешательства политиков или бюрократии. Облегчив раннее выявление сговора и нарушений, мы продвинем усилия по борьбе с коррупцией, а восстановив доверие к политике, укрепим движущую силу реализации политики."
 JAP_eliminating_amakudari: "Искоренить амакуда́ри"
 JAP_eliminating_amakudari_desc: "Мы прекратим практику амакуда́ри, которая легко порождает сговор между бюрократами и корпорациями, и нанесем скальпель по укоренившимся лоббистским интересам. Повысив прозрачность в назначениях и усилив конкуренцию, мы ограничим коррупцию, одновременно снижая неэффективность и повышая производительность."
 JAP_disclosure_of_political_funding: "Полное раскрытие политического финансирования"
 JAP_disclosure_of_political_funding_desc: "Мы будем полностью раскрывать движение политических средств и делать доноров и расходы максимально прозрачными. Это сократит пространство для непрозрачных денег в политике и продвинет антикоррупционные усилия, одновременно усилив устойчивость к операциям влияния иностранных акторов."
 JAP_protecting_human_rights: "Защита прав человека"
 JAP_protecting_human_rights_desc: "Мы поставим защиту достоинства и прав каждого человека в основу государственного управления. Исправляя дискриминацию и несправедливое обращение и строя общество, в котором люди могут жить спокойно, мы укрепим внутреннюю сплоченность и стабильность."
 JAP_same_sex_partnerships: "Легализовать однополые партнёрства"
 JAP_same_sex_partnerships_desc: "Мы официально признаем однополые пары и создадим систему, которая снижает повседневные неудобства в таких сферах, как медицинское согласие, жильё и наследование. Уважая разнообразные формы семьи и уменьшая социальные разногласия, мы укрепим внутреннюю стабильность."
 JAP_employment_disabilities: "Расширить занятость людей с инвалидностью"
 JAP_employment_disabilities_desc: "Мы создадим условия, при которых люди смогут работать независимо от инвалидности, и расширим поддержку занятости и разумные приспособления на рабочем месте. Расширяя возможности для трудоустройства, мы укрепим рабочую силу, а через поощрение социальной активности внесем вклад во внутреннюю стабильность."
 JAP_prevent_domestic_violence: "Меры по предотвращению домашнего насилия"
 JAP_prevent_domestic_violence_desc: "Мы усилим профилактику и раннее выявление домашнего насилия, а также расширим консультативные службы и защитную поддержку. Разорвав цикл насилия и снизив незащищенность и жестокость в семье, мы повысим социальную стабильность."
 JAP_protecting_labor_union: "Защита прав профсоюзов"
 JAP_protecting_labor_union_desc: "Мы четко гарантируем права профсоюзов и создадим условия, в которых коллективные переговоры и консультации между трудом и управлением могут проводиться надлежащим образом. Отражая голоса рабочих в институтах и корпоративном управлении, мы будем способствовать стабильности занятости и условий труда."
 JAP_subcontracto: "Покончить с давлением на субподрядчиков"
 JAP_subcontracto_desc: "Мы будем бороться с несправедливыми требованиями о снижении цен, задержками платежей и односторонними изменениями условий договоров, навязываемыми субподрядчикам, и создадим справедливую торговую среду. Защищая доходную базу малого и среднего бизнеса, мы укрепим здоровье всей цепочки поставок и внесем вклад в социальную стабильность."
 JAP_pressure_wage_increases: "Давление на повышение заработной платы"
 JAP_pressure_wage_increases_desc: "Мы будем поощрять компании повышать зарплаты и увеличивать доходы домохозяйств. Поддерживая потребление и снижая неуверенность в повседневной жизни, мы укрепим социальную стабильность и будем стремиться к доброкачественному экономическому циклу."
 JAP_regulation_temporary_agency_work: "Ужесточить регулирование временной работы через агентства"
 JAP_regulation_temporary_agency_work_desc: "Мы ограничим злоупотребление временной агентской рабочей силой и будем продвигать стабильность занятости и лучшие условия труда. Ставя на первое место безопасную долгосрочную рабочую среду вместо краткосрочной эффективности, мы укрепим социальную стабильность."
 JAP_ban_non_regular_employment: "Запретить нерегулярную занятость"
 JAP_ban_non_regular_employment_desc: "Мы реформируем практики занятости, основанные на нерегулярной работе, и перейдем к системе, в которой каждый может получить стабильную занятость и справедливое отношение. Сократив неуверенность в повседневной жизни и сдержав социальное расслоение, мы укрепим национальную стабильность."
 JAP_redistribution: "Отдать приоритет перераспределению"
 JAP_redistribution_desc: "Мы перейдем к политике, которая ставит в приоритет исправление неравенства доходов и экономической незащищенности, более щедро распределяя ресурсы тем, кто нуждается в поддержке. За счет перераспределения мы сократим социальное расслоение, повысим чувство безопасности людей и будем стремиться к стабильному управлению."
 JAP_reducing_medical_costs: "Снизить расходы на медицину из собственного кармана"
 JAP_reducing_medical_costs_desc: "Мы снизим расходы на медицину из собственного кармана и построим систему, в которой люди смогут получать необходимое лечение без колебаний. Смягчая финансовые тревоги для домохозяйств и сдерживая рост различий в здравоохранении, мы укрепим социальную стабильность."
 JAP_care_workers: "Улучшить оплату и условия труда соцработников"
 JAP_care_workers_desc: "Мы улучшим заработную плату и условия труда работников социальной сферы и будем способствовать набору и удержанию кадров. Укрепляя непрерывность ухода, снижая нагрузку на семьи и поддерживая участие в рабочей силе, мы внесем вклад в социальную стабильность."
 JAP_housing_support: "Расширить жилищную поддержку"
 JAP_housing_support_desc: "Мы расширим жилищную поддержку, чтобы снизить нагрузку на аренду и помочь людям обеспечить стабильное жилье. Смягчая жилищную незащищенность и поддерживая стабильность повседневной жизни, мы сократим социальное расслоение и укрепим внутреннюю стабильность."
 JAP_student_loans: "Снизить бремя студенческих кредитов"
 JAP_student_loans_desc: "Мы снизим бремя погашения студенческих кредитов и снизим барьеры для получения высшего образования и переквалификации. Продвигая развитие человеческого капитала как инвестицию в будущее, мы поддержим прогресс в исследованиях и технологиях."
 JAP_nuclear_phaseout: "Прощай, атом!"
 JAP_nuclear_phaseout_desc: "Вместо того чтобы рисковать, ожидая следующего землетрясения, страна позволяет реакторам закрываться по истечении срока действия лицензий и направляет высвободившиеся средства на повышение энергоэффективности и возобновляемые источники энергии. Этот путь обходится дороже в краткосрочной перспективе и безопаснее в долгосрочной. Никакая волна у побережья не создаст угрозы повторения Фукусимы.\n-------------\nОстановить весь атомный флот и открыть §YПрограмму «Зелёная трансформация»§!, которая компенсирует потерянную выработку электроэнергии за счёт производства, которое Японии больше не нужно импортировать, и покрытия спроса, который ей больше не нужно удовлетворять. Каждый проект также навсегда демонтирует реакторы в своём регионе."
 JAP_leading_disarmament: "Возглавить дипломатию разоружения"
 JAP_leading_disarmament_desc: "Мы сделаем разоружение и деэскалацию столпами нашей внешней политики и будем добиваться региональной стабильности через диалог и укрепление доверия. Мы будем ставить в приоритет решения, не зависящие от силы, и работать над улучшением отношений с другими странами."
 JAP_restricting_arms_exports: "Ограничить экспорт оружия"
 JAP_restricting_arms_exports_desc: "Мы ограничим экспорт вооружений и четко обозначим дипломатическую позицию, менее склонную разжигать военную напряженность. Ставя в приоритет разоружение и укрепление доверия, мы продвинем диалог ради региональной стабильности."
 JAP_principle_of_no_armed_forces: "Подтвердить принцип отсутствия вооружённых сил"
 JAP_principle_of_no_armed_forces_desc: "Мы подтвердим принцип отсутствия вооружённых сил и ясно заявим о подходе к управлению, который не опирается на военную мощь. Мы поставим пацифизм в основу нашей политики и подчеркнем безопасность через дипломатию и международное сотрудничество."
 JAP_abrogating_us_japan_security_treaty: "Отменить Японо-американский договор о безопасности"
 JAP_abrogating_us_japan_security_treaty_desc: "Мы выйдем из системы безопасности Япония–США и перейдём к независимой политике безопасности, не зависящей от Соединённых Штатов. Это расширит свободу нашей внешней политики и более ясно утвердит наш суверенитет и независимость."
 JAP_dissolving_sdf: "Распустить Силы самообороны"
 JAP_dissolving_sdf_desc: "Мы распустим Силы самообороны и перейдём к управлению, не зависящему от военной мощи. Перенаправив ресурсы и усилия, ранее потраченные на оборону, в гражданский сектор, мы сосредоточим внимание на укреплении промышленности и основ повседневной жизни и ускорим внутреннее развитие."
 JAP_army_delete_TT: "§RВсе сухопутные силы будут расформированы!§!"
 JAP_right: "Правое крыло Японии"
 JAP_right_desc: "Мы делаем упор на возможность государства и общественный порядок, продвигая более сильную общественную безопасность, реагирование на кризисы и внешнюю и оборонную политику, которая ставит национальные интересы на первый план. Мы стремимся к росту через регуляторную реформу и возрождение деловой активности, и хотим перестроить страну на основе традиций и общинных ценностей."
 JAP_right_TT: "§YВы можете значительно повысить рейтинг одной из правых партий!\nОднако, если это будет правящая партия, прирост останется небольшим.§!"
 JAP_strengthen_military_power: "Политика укрепления военной мощи"
 JAP_strengthen_military_power_desc: "С учётом изменений в обстановке безопасности мы ясно установим укрепление нашей оборонительной позиции как национальную политику. Усилив сдерживание, мы предотвратим угрозы до того, как они материализуются, и продемонстрируем нашу приверженность защите общественной безопасности и национального суверенитета."
 JAP_right_party_TT: "Должно выполняться одно из следующих условий:\n§Y$JAP.conservatism$§! у власти.\n§Y$JAP.socialism$§! у власти.\n§Y$JAP.Neutral_conservatism$§! у власти.\n§Y$JAP.Neutral_conservatism2$§! у власти.\n§Y$JAP.Neutral_conservatism3$§! у власти.\n§Y$JAP.Neutral_conservatism4$§! у власти.\n§Y$JAP.Neutral_Libertarian$§! у власти.\n§Y$JAP.Nat_Populism$§! у власти.\n"
 JAP_allow_overseas_deployment: "Разрешить зарубежные развертывания Сил самообороны"
 JAP_allow_overseas_deployment_desc: "Учитывая международную обстановку и сотрудничество с союзниками, мы ясно сформулируем политику, допускающую зарубежные развертывания Сил самообороны. Участвуя в международных миссиях, мы укрепим сдерживание и влияние, а также будем более активно защищать национальные интересы и безопасность."
 JAP_international_missions: "Правовая основа для международных миссий"
 JAP_international_missions_desc: "Мы создадим правовую базу и процедуры для участия в международных миссиях, вырабатывая систему, в которой Силы самообороны могут действовать по единым правилам. Это сократит неопределённость на местах и обеспечит более надёжное выполнение международного сотрудничества."
 JAP_revising_use_weapons: "Пересмотреть правила использования оружия"
 JAP_revising_use_weapons_desc: "Мы пересмотрим стандарты и процедуры применения оружия с учётом реалий международных миссий и реагирования на кризисы. Чётко определив пределы полномочий и ответственность, необходимые для выполнения задач, мы создадим систему, в которой Силы самообороны смогут адекватно защищать себя и других."
 JAP_exclusive_defense: "Сохранение исключительно оборонительной позиции"
 JAP_exclusive_defense_desc: "Мы будем строго придерживаться исключительно оборонительной позиции как руководящего принципа нашей безопасности, ясно ограничивая использование оборонительных возможностей рамками предотвращения нападений на нашу страну. Сохраняя сдерживание, мы избежим чрезмерного военного расширения и продемонстрируем позицию, менее склонную к обострению напряжённости с соседями."
 JAP_exclusive_defense_TT: "§YЭтот национальный фокус приближает баланс сил к уровню 2!§!"
 JAP_collective_self_defense: "Политика допуска коллективной самообороны"
 JAP_collective_self_defense_desc: "Исходя из того, что нападения на союзников могут прямо угрожать нашей безопасности, мы ясно сформулируем политику, допускающую осуществление коллективной самообороны. Это укрепит сдерживание, эффективность союзов и построит более проактивную систему безопасности."
 JAP_prioritizing_order: "Приоритет порядку"
 JAP_prioritizing_order_desc: "Мы поставим общественный порядок и безопасность на первое место в управлении. Ценя правила и ответственность и поддерживая общественную безопасность и стабильное управление, мы восстановим основы нации."
 JAP_strengthen_public_security: "Всеобъемлющий план общественной безопасности"
 JAP_strengthen_public_security_desc: "Мы проведём полный обзор системы общественной безопасности и разработаем комплексный план по оборудованию, персоналу и информационной координации. Оптимизируя работу на местах и укрепляя возможности полиции, мы усилим сдерживание преступности и обеспечим социальную стабильность."
 JAP_against_organized_crime: "Ужесточение мер против организованной преступности"
 JAP_against_organized_crime_desc: "Мы усилим борьбу с организованной преступностью и продвинем меры по перекрытию каналов финансирования и расширению следственного потенциала. Восстановив внутреннюю безопасность, мы укрепим стабильность общества и создадим систему, менее уязвимую к проникновению и влиянию внешних акторов."
 JAP_against_terrorist_financing: "Меры против финансирования терроризма"
 JAP_against_terrorist_financing_desc: "Мы будем строго контролировать потоки финансирования и полностью применять системы, прерывающие каналы денег террористическим организациям и экстремистским группам. Укрепляя координацию между финансовыми органами и следственными службами, мы защитим внутреннюю безопасность и повысим устойчивость к внешнему влиянию, одновременно укрепляя общественную стабильность."
 JAP_counter_espionage: "Создание антишпионской системы"
 JAP_counter_espionage_desc: "Мы укрепим контрмеры против разведывательной деятельности и создадим систему защиты секретной информации и усиленного контроля. Сдерживая проникновение и скрытые операции внешних акторов и защищая национальное принятие решений, мы обеспечим внутреннюю стабильность."
 JAP_strengthening_cabinet: "Укрепление полномочий кабинета"
 JAP_strengthening_cabinet_desc: "Мы усилим цепочку командования и координацию Кабинета для повышения скорости и согласованности принятия решений. Создав систему, способную быстро действовать при кризисе и по ключевым политике, мы укрепим решающее руководство в государственном управлении."
 JAP_cabinet_personnel_bureau: "Бюро по кадровым вопросам Кабинета"
 JAP_cabinet_personnel_bureau_desc: "Мы создадим систему, в которой Кабинет централизованно контролирует кадровые вопросы, укрепляя прозрачность и контроль над назначениями на высшие должности. Продвигая нужных людей на нужные позиции, мы оптимизируем работу бюрократии и повысим способность правительства реализовывать политику."
 JAP_breaking_down_bureaucratic_siloing: "Ликвидация бюрократических силосов"
 JAP_breaking_down_bureaucratic_siloing_desc: "Мы реформируем разрозненное администрирование между министерствами и укрепим обмен информацией и межведомственную координацию. Сократив дублирование процедур и узкие места, мы упростим работу госаппарата и ускорим реализацию общественных инвестиций и проектов."
 JAP_policy_evaluation_and_kpis: "Введение оценки политики и KPI"
 JAP_policy_evaluation_and_kpis_desc: "Мы введём систему оценки и ключевые показатели эффективности, чтобы результаты политики проверялись измеримыми данными. Пересматривая малоэффективные меры и концентрируя ограниченные ресурсы на наиболее значимых областях, мы повысим административную эффективность и увеличим экономическую продуктивность."
 JAP_national_security_council: "Создание Совета национальной безопасности"
 JAP_national_security_council_desc: "Мы централизуем информацию и принятие решений по безопасности в Кабинете и создадим систему, позволяющую оперативно и последовательно принимать решения. Укрепляя возможности реагирования на кризисы и координацию с союзниками и профильными агентствами, мы усилим сдерживание."
 JAP_emergency_powers: "Положение о чрезвычайных полномочиях"
 JAP_emergency_powers_desc: "В подготовке к чрезвычайным ситуациям, таким как крупные катастрофы или вооружённые нападения, мы уточним полномочия и процедуры, необходимые в чрезвычайных условиях. Сохраняя контроль в мирное время, мы ускорим реагирование на кризисы и укрепим цепочку командования, обеспечив национальную стабильность и оборонную готовность."
 JAP_regulatory_reform: "Рост через регуляторную реформу"
 JAP_regulatory_reform_desc: "Мы пересмотрим нормы и процедуры, снизим административные барьеры и будем стимулировать деловую активность и инвестиции. Сделав проще запуск новых предприятий и развитие объектов, мы ускорим темпы экономического роста."
 JAP_postal_privatization: "Приватизация почты"
 JAP_postal_privatization_desc: "Мы продвинем приватизацию почтовых услуг, изменив систему под управлением государства для повышения эффективности госаппарата. Внедрение рыночных принципов должно усилить деловую активность и налоговую базу, но реформа также может вызвать сильное сопротивление и усилить политические разногласия."
 JAP_postal_privatization_TT: "§YСработает событие, где вам предстоит решить, проводить ли досрочные выборы!§!"
 JAP_second_wave_privatization: "Вторая стадия приватизации"
 JAP_second_wave_privatization_desc: "Мы продолжим реформы приватизации и пересмотрим роль государственного сектора и работу общественных услуг. Сократив административную неэффективность и стимулировав инвестиции и деловую активность, мы оживим экономику."
 JAP_special_zones: "Национальные стратегические специальные зоны"
 JAP_special_zones_desc: "Мы создадим регуляторные исключения в отдельных зонах и интенсивно будем продвигать вход бизнеса и новые инвестиции. Продвигая демонстрационные проекты и коммерциализацию за пределами существующих институциональных барьеров, мы ускорим рост за счёт частной инициативы и оживим местную экономику."
 JAP_expansion_regulatory_reform_zones: "Расширение зон реформ"
 JAP_expansion_regulatory_reform_zones_desc: "Мы масштабируем результаты, достигнутые в специальных зонах, по всей стране, превращая регуляторную реформу из регионального исключения в национальный стандарт. Снизив барьеры для входа и инвестиций, мы будем стимулировать новые предприятия и способствовать экономическому обновлению по всей стране."
 JAP_new_market_entry: "Содействие входу на новые рынки"
 JAP_new_market_entry_desc: "Мы снизим барьеры для входа и поддержим предпринимательство и запуск новых бизнесов. Стимулируя конкуренцию и инновации, мы увеличим продуктивность и укрепим налоговую базу."
 JAP_new_technologies: "Поддержка новых технологий"
 JAP_new_technologies_desc: "Мы активно поддержим внедрение и коммерциализацию новых технологий, ускоряя исследовательскую работу и промышленное обновление. Развивая новые сектора роста, мы укрепим национальную конкурентоспособность."
 JAP_key_industries_back_home: "Возвращение стратегических отраслей"
 JAP_key_industries_back_home_desc: "Мы построим систему, обеспечивающую стабильное внутреннее производство критически важных отраслей, укрепим цепочки поставок и повысим самодостаточность в ключевых секторах. Стимулируя внутренние инвестиции, мы укрепим промышленную базу и создадим структуру, менее уязвимую к международным изменениям."
 JAP_economic_security: "Обеспечение экономической безопасности"
 JAP_economic_security_desc: "Мы пересмотрим поставки критических материалов и ключевых отраслей, а также управляем рисками в технологиях, капитале и информации, чтобы создать экономическую безопасность. Это усилит национальную самодостаточность и устойчивую конкурентоспособность компаний, поддерживая стабильный рост."
 JAP_patriotic_education: "Патриотическое образование"
 JAP_patriotic_education_desc: "Мы будем продвигать образование, подчеркивающее историю, культуру и гражданскую ответственность нации, укрепляя социальное единство и чувство общих норм. Создавая основу, менее подверженную внешнему влиянию, мы усилим внутреннюю стабильность."
 JAP_fundamentals_of_education: "Переосмысление основ образования"
 JAP_fundamentals_of_education_desc: "Мы пересмотрим цели и стандарты образования и заново определим в качестве национальной политики развитие академических способностей, фундаментальных знаний и практических навыков. Уделяя приоритет инвестициям в образование, мы укрепим основы для развития человеческого капитала и исследований."
 JAP_dotoku_education: "Образование по дотоку"
 JAP_dotoku_education_desc: "Мы увеличим внимание к дотоку-образованию и будем формировать в школьном обучении ценности гражданственности, ответственности и внимательности к другим. Укрепляя социальные нормы и углубляя сплочённость в местных сообществах, мы внесём вклад в внутреннюю стабильность."
 JAP_national_flag_and_anthem: "Уважение флага и гимна"
 JAP_national_flag_and_anthem_desc: "Мы ясно подтвердим уважение к флагу и национальному гимну, укрепляя чувство национальной принадлежности и общественного единства. Это усилит сплочённость в кризисные периоды и создаст основу, менее подверженную внешнему влиянию."
 JAP_family_policy: "Укрепление семейной политики"
 JAP_family_policy_desc: "Мы будем уважать ценности домохозяйств и семей и расширим меры, поддерживающие воспитание детей и повседневную жизнь. Создавая среду, в которой семьи могут строиться с уверенностью, мы укрепим демографическую основу будущего и внесём вклад в социальную стабильность."
 JAP_glorious_decade: "К десятилетию процветания"
 JAP_inflation_target: "Прояснение обязательств по политике"
 JAP_down_long_term_interest_rates: "Снижение долгосрочных ставок"
 JAP_down_long_term_interest_rates_desc: "Мы будем поддерживать низкие и стабильные долгосрочные процентные ставки, снижая стоимость финансирования для предприятий и домохозяйств. Поддерживая инвестиции, обновление капитала и покупку жилья, тем самым укрепляя спрос и стимулируя экономику, мы также создадим условия для восстановления налоговых поступлений."
 JAP_special_inspection_banks: "Специальные проверки банков"
 JAP_special_inspection_banks_desc: "Чтобы восстановить устойчивость финансовой системы, мы проведём тщательное исследование активов банков. Прояснив реальное положение проблемных кредитов и прекратив отсрочку убытков и непрозрачное ведение дел, мы создадим опору для остановки цепной реакции кредитной тревоги и ужесточения кредитования."
 JAP_bank_supervision: "Укрепление банковского надзора"
 JAP_bank_supervision_desc: "Вместо того чтобы рассматривать проверки и корректирующие меры как разовое действие, мы постоянно укрепим надзорную систему. Применяя раскрытие информации и корпоративное управление и предотвращая повторение слабого управления рисками и непрозрачности, мы стабилизируем доверие к финансовой системе."
 JAP_business_assessment: "Объективная оценка бизнеса"
 JAP_business_assessment_desc: "Чтобы точно определить способности и риски компаний, мы объективно оценим прибыльность и перспективы. Не опираясь на поддержание фирм искусственно, мы выделим области, требующие реструктуризации, от тех, которые следует перестроить, и подготовим почву для притока капитала и талантов в сектора роста."
 JAP_corporate_debt_restructuring: "Реструктуризация корпоративного долга"
 JAP_corporate_debt_restructuring_desc: "Мы решим проблему чрезмерной долговой нагрузки и обеспечим время и свободу действий для восстановления. Отказавшись от состояния, когда фирмы поглощены процентными платежами и выплатами, и направив ресурсы на инвестиции, занятость и трансформацию бизнеса, мы разорвём цепь стагнации."
 JAP_corporate_revitalization: "Оживление корпораций"
 JAP_corporate_revitalization_desc: "Мы выведем реструктуризацию на новый уровень и восстановим корпоративные основы как финансово, так и операционно. Решая проблему чрезмерных нагрузок и неэффективности и выводя компании в положение, где они могут предпринимать инвестиции, нанимать и повышать зарплаты, мы укрепим восстановление, основанное на частном секторе."
 JAP_expectations_escaping_deflation: "Восстановление ожиданий роста"
 JAP_expectations_escaping_deflation_desc: "Урегулировав проблемные кредиты и списав чрезмерную задолженность, мы переключим фокус экономики с «обороны» на «нападение». Если компании возобновят инвестиции, исследования и разработки, а также в персонал, и домохозяйства обретут более ясное видение будущего, то с большей вероятностью закрепится благоприятный цикл роста производительности и заработной платы. Мы заложим фундамент, необходимый для полного восстановления конкурентоспособности."
 JAP_promoting_labor_mobility: "Содействие мобильности рабочей силы"
 JAP_promoting_labor_mobility_desc: "Мы создадим условия, при которых талантам станет легче переходить в сектора роста и продвигать перераспределение рабочей силы. Снизив барьеры для смены работы и повторного трудоустройства и поддерживая повышение квалификации, мы ускорим обновление отраслей и повысим производительность."
 JAP_competition_service_sector: "Содействие конкуренции в сфере услуг"
 JAP_competition_service_sector_desc: "Мы будем стимулировать вход и конкуренцию в сектор услуг и исправлять неэффективность и жёсткость цен, которые способствуют стагнации. Пересмотрев регулирование и устоявшиеся практики, мы улучшим деловую среду и сместимся к рынку, где лучшие услуги выбираются легче."
 JAP_revitalization_economy: "Оживление экономики Японии"
 JAP_revitalization_economy_desc: "Мы продвинули восстановление финансовой системы и корпоративного сектора и наметили путь к восстановлению спроса и повышению зарплат. Устраняя причины стагнации одну за другой и создавая среду, в которой домохозяйства и бизнес яснее видят будущее, мы закрепим импульс роста."
 JAP_equal_pay_for_equal_work: "Равная оплата за равный труд"
 JAP_equal_pay_for_equal_work_desc: "Закон о неполной занятости и срочных трудовых договорах обязывает работодателей обосновывать каждую разницу в оплате труда и льготах между штатными и внештатными работниками, или же отменяет ее. Четыре из десяти японских работников являются внештатными, сидят за одними и теми же столами за ничтожную часть почасовой оплаты, без премий, пенсионных выплат и без надежды на работу следующей весной. Компании теряют резерв дешевой рабочей силы, на который они полагались десятилетиями, и миллионы людей, которые никогда не могли планировать на год вперед, наконец-то могут это сделать."
 JAP_diplomacy: "Японская дипломатия"
 JAP_diplomacy_desc: "Восстановление связей с миром и переопределение роли Японии в международном сообществе."
 JAP_diplomacy_idea_TT: "§YПо мере продвижения по дипломатическому дереву к этому национальному духу будут добавляться дополнительные модификаторы!§!"
 JAP_friendship_asean: "Улучшение отношений с АСЕАН"
 JAP_friendship_asean_desc: "Правительство Японии будет работать над улучшением отношений со странами АСЕАН, продвигая восстановление доверия и диалог. Для Японии АСЕАН — незаменимый партнёр как в экономике, так и в сфере безопасности, и его единство и стабильность определят будущее всего региона."
 JAP_not_asean_war_TT: "Есть по крайней мере одна страна с национальным духом «Член АСЕАН», и Япония не находится в состоянии войны ни с одной страной, имеющей национальный дух «Член АСЕАН»."
 JAP_chiang_mai: "Инициатива Чиангмай"
 JAP_chiang_mai_desc: "Через Инициативу Чиангмай Япония укрепляет региональное финансовое сотрудничество, поддерживая экономическую стабильность и сплочённость стран АСЕАН."
 JAP_quantitative_oda: "Количественная ОДА"
 JAP_quantitative_oda_desc: "Через масштабные инвестиции ОДА в ключевую инфраструктуру, такую как транспорт, порты и энергетика, Япония поддерживает экономический рост АСЕАН и региональную связанность."
 JAP_qualitative_oda: "Качественная ОДА"
 JAP_qualitative_oda_desc: "Партнёрствуя с местными предприятиями и институтами, Япония продвигает развитие человеческого капитала и демократических ценностей, усиливая своё влияние в АСЕАН."
 JAP_security_south_china_sea: "Позиция безопасности в Южно-Китайском море"
 JAP_security_south_china_sea_desc: "Опираясь на доверие стран АСЕАН, Япония инициирует создание рамочного соглашения о нейтральной и мирной морской безопасности в Южно-Китайском море."
 JAP_away_dependence: "Оттолкнуться от зависимости от США"
 JAP_away_dependence_desc: "Япония начинает заново оценивать природу своих давних связей, стремясь расширить стратегические варианты и автономию. В экономике, технологиях и безопасности мы следуем курсу, сформированному нашим собственным видением будущего."
 JAP_development_production: "Создание внутренних производственных цепочек"
 JAP_development_production_desc: "Чтобы обеспечить национальную оборону самостоятельно, мы создадим внутреннюю систему, способную производить оружие и материалы внутри Японии."
 JAP_japanese_doctrine: "Формирование японской доктрины"
 JAP_japanese_doctrine_desc: "Мы установим независимую японскую доктрину безопасности, позволяющую гибко реагировать на нашу собственную стратегическую среду."
 JAP_recalling_researchers: "Возврат зарубежных исследователей"
 JAP_recalling_researchers_desc: "Университеты и национальные лаборатории предлагают ускоренные программы трудоустройства, модернизированные объекты и конкурсные гранты, чтобы остановить длительный отток талантливых специалистов. Цель состоит в том, чтобы восстановить отечественный научно-исследовательский потенциал, вернув японских ученых из Соединенных Штатов домой."
 JAP_japanese_cloud: "Облако Касумигасэки"
 JAP_japanese_cloud_desc: "Создать государственное «облачное хранилище Касумигасеки», управляемое японскими провайдерами и размещенное на отечественных серверах. Министерства и ключевые ведомства перенесут свои системы на эту общую платформу, чтобы сократить расходы, стандартизировать безопасность и обеспечить национальный контроль над конфиденциальными данными."
 JAP_base_okinawa: "Переговоры о выводе войск США с Окинавы"
 JAP_base_okinawa_desc: "Для повышения автономии безопасности Японии начнутся переговоры о выводе войск США, дислоцированных на Окинаве."
 JAP_enhancement_exercises: "Расширенные совместные учения"
 JAP_enhancement_exercises_desc: "Углубить интеграцию с силами США за счёт более крупных и частых совместных манёвров. Морские, воздушные и сухопутные части отработают общие процедуры, связи и логистику, чтобы в реальном кризисе обе стороны могли двигаться, сражаться и снабжать себя как единая скоординированная сила."
 JAP_education_jap_usa: "Совместные образовательные программы Японии и США"
 JAP_education_jap_usa_desc: "Чтобы углубить взаимопонимание между Японией и Соединёнными Штатами, мы реализуем совместные образовательные программы и студенческие обмены. Обучаясь дисциплине Японии и предпринимательскому духу США, эта инициатива воспитает новое поколение международно мыслящих лидеров и укрепит двустороннее доверие."
 JAP_culture_technology: "Японо-американский обмен в сфере технологий и культуры"
 JAP_culture_technology_desc: "Укрепим связи между японскими фирмами и американскими технополисами, связывая университетские лаборатории и студии с партнёрами из Силиконовой долины, Сиэтла и Лос-Анджелеса. Инженеры, дизайнеры и творцы будут перемещаться туда и обратно на совместные проекты, объединяя американское ноу-хау платформ с японским оборудованием, играми и анимацией."
 JAP_dual_use: "Сотрудничество в области двойного назначения"
 JAP_dual_use_desc: "Япония и США углубят сотрудничество в технологиях двойного назначения, применимых как в гражданской, так и в военной сферах. Через взаимодействие промышленности и академии это партнёрство ускорит НИОКР и опытно-конструкторские работы, повышая общий технологический прогресс."
 JAP_okinawa_development: "Совместный проект развития Окинавы"
 JAP_okinawa_development_desc: "Для стимулирования экономического роста Окинавы и региональной интеграции Япония и США будут сотрудничать в рамках проекта развития инфраструктуры. Улучшая транспортные сети, логистику и общественные объекты, эта инициатива призвана повысить местный рост и открыть новые возможности для японско-американского сотрудничества."
 JAP_informal_cooperation: "Неформальная рамочная система сотрудничества"
 JAP_informal_cooperation_desc: "Несмотря на отсутствие формальных дипломатических отношений, Япония и Тайвань развили практическое и значимое сотрудничество. Через взаимодействие в сфере реагирования на бедствия, технологического обмена и гражданских контактов создаётся взаимовыгодная основа."
 JAP_disaster_countermeasure_cooperation: "Платформа обмена знаниями по чрезвычайным ситуациям Япония–Тайвань"
 JAP_disaster_countermeasure_cooperation_desc: "Учитывая общую уязвимость перед стихийными бедствиями, Япония и Тайвань создают совместную платформу для обмена опытом и уроками в сфере реагирования на катастрофы. Это сотрудничество повысит устойчивость и восстановительные возможности обеих стран."
 JAP_tai_high_technology: "Японо-тайваньское высокотехнологичное партнёрство"
 JAP_tai_high_technology_desc: "Японские и тайваньские научные учреждения и частные компании объединяют усилия для совместной работы в передовых гражданских технологиях. Это партнёрство направлено на ускорение инноваций и повышение производительности в отраслях обеих стран."
 JAP_tai_tourist_visa: "Смягчение визового режима для туристов"
 JAP_tai_tourist_visa_desc: "Чтобы дополнительно поощрять въездной туризм из Тайваня, Япония облегчит визовые процедуры. Увеличение народных обменов и туризма поможет стимулировать экономику и укрепить взаимопонимание."
 JAP_tai_international_student: "Расширение программ учебного обмена"
 JAP_tai_international_student_desc: "Япония расширит возможности тайваньских студентов учиться в своих университетах. Эта инициатива нацелена на углубление академических и культурных связей и подготовку будущих лидеров, способных связать два общества."
 JAP_tai_senkaku: "Установить морские переговоры с Тайванем"
 JAP_tai_senkaku_desc: "Спор вокруг островов Сенкаку влияет на права рыболовства, морскую безопасность и все переговоры в Восточно-Китайском море. Япония открывает каналы диалога и проводит практические консультации для снижения напряженности на воде, не уступая при этом ни в чем в вопросе суверенитета. Она скорее управляет конфликтом, чем разрешает его."
 JAP_dprk_national_policy: "Доктрина Северного полуострова"
 JAP_dprk_national_policy_desc: "Северная Корея остаётся ближайшей искрой у наших берегов и самым непредсказуемым игроком на полуострове. Мы сформируем единый национальный курс в отношении Пхеньяна, синхронизируя дипломатию, разведку и готовность в единую доктрину. Выбранное направление определит условия безопасности в Северо-Восточной Азии."
 JAP_dprk_maximum_pressure: "Максимальное давление на Пхеньян"
 JAP_dprk_maximum_pressure_desc: "Северная Корея понимает силу влияния, а не добрую волю. Мы ужесточим исполнение санкций, расширим морской мониторинг и скоординируем дипломатическое давление, чтобы ограничить маневренное пространство Пхеньяна для эскалации. Цель проста: повысить цену каждой провокации до тех пор, пока режим не будет вынужден пересмотреть расчёт."
 JAP_dprk_missile_defense: "Многоуровневая противоракетная оборона"
 JAP_dprk_missile_defense_desc: "Северная угроза измеряется не днями, а минутами. Мы укрепим многоуровневую сеть ПРО на суше, море и в воздухе, чтобы защитить наши города, порты и командные центры от внезапной атаки. Надёжный щит лишит Пхеньян возможности запугивать нас издалека."
 JAP_dprk_trilateral_training: "Трёхсторонние учения на полуострове"
 JAP_dprk_trilateral_training_desc: "Безопасность на полуострове не может основываться только на декларациях. Совместные учения с Южной Кореей и США улучшат готовность, совместимость и реагирование на кризисы в самой опасной точке региона. Совместные тренировки показывают, что агрессия встретит скоординированный ответ."
 JAP_dprk_korean_defense_treaty: "Японо-корейское оборонное соглашение"
 JAP_dprk_korean_defense_treaty_desc: "Полуостров и Японский архипелаг разделяют одну линию фронта. Формальное оборонное соглашение с Южной Кореей объединит обмен разведданными, планирование на случай непредвиденных ситуаций и взаимные обязательства по безопасности в прочные рамки. Старые обиды остаются, но стратегическая необходимость требует более крепкой основы."
 JAP_dprk_conditional_engagement: "Условный канал к Пхеньяну"
 JAP_dprk_conditional_engagement_desc: "Одно лишь давление не может справиться со всем кризисом. Мы откроем контролируемый дипломатический канал с Северной Кореей, привязанный к строгим условиям относительно ракетных испытаний, военных инцидентов и региональной дестабилизации. Диалог не заменит сдерживание, но может предотвратить просчёты."
 JAP_dprk_normalization_framework: "Дорожная карта нормализации"
 JAP_dprk_normalization_framework_desc: "Стабильная Северо-Восточная Азия требует не только постоянного управления кризисами. Мы установим поэтапную рамку нормализации с Северной Кореей, связывая дипломатический прогресс с проверяемыми обязательствами по безопасности и региональными гарантиями. Любое урегулирование должно быть постепенным, исполнимым и основанным на взаимности."
 JAP_dprk_support_unification: "Поддержать объединённый полуостров"
 JAP_dprk_support_unification_desc: "Разделение Кореи формировало безопасность Восточной Азии поколениями, но это не обязательно должно быть навсегда. Мы поддержим мирный путь к объединению Кореи через дипломатию, координацию с партнёрами и планирование региональной стабильности. Если полуостров будет перестроен, Япония должна помочь сформировать порядок, который последует за этим."
 JAP_history_education: "Прозрачность исторического образования"
 JAP_history_education_desc: "Мы должны смотреть историческим фактам прямо в лицо, пересматривая учебные материалы и методические указания. Прозрачное историческое образование — первый шаг к укреплению доверия с нашими соседними странами."
 JAP_statement: "Заявление [ROOT.GetLeader]"
 JAP_statement_desc: "Чтобы выразить ясную позицию ответственности и сожаления по поводу исторических событий, правительство выпустит новое официальное заявление. Эта инициатива направлена на содействие примирению с пострадавшими странами и продвижение отношений, ориентированных на будущее, на основе взаимного доверия."
 JAP_intellectual_platform: "Трёхсторонняя историческая платформа"
 JAP_intellectual_platform_desc: "При посредничестве ООН Япония, Китай и Южная Корея совместно спланируют и создадут музеи и цифровые архивы для передачи памяти о войне будущим поколениям. Япония окажет финансовую поддержку, позиционируя эту инициативу как глобальный символ мира и примирения."
 JAP_intellectual_platform_TT: "§YЕсли обе страны примут соглашение, всем трём нациям будет предоставлен национальный дух, увеличивающий §Gстабильность§!§!"
 JAP_chi_friendship: "Улучшение отношений с Китаем"
 JAP_chi_friendship_desc: "Чтобы стабилизировать отношения Японии и Китая, японское правительство продолжит диалог и будет работать над продвижением взаимопонимания и урегулированием трений. Китай — соседняя страна с существенным влиянием на региональный порядок и экономику, и улучшение отношений напрямую связано с безопасностью и процветанием Японии."
 JAP_chi_accept_intellectual_platform: "Китай согласился на создание Японо-Китайско-Корейской исторической платформы."
 JAP_chi_trade_support: "Поддержка реформы торговой системы Китая"
 JAP_chi_trade_support_desc: "Предоставить техническую и институциональную поддержку реформе и модернизации торговой системы Китая. Это облегчит выход японским компаниям и укрепит влияние Японии в регионе."
 JAP_chi_advancement_companies: "Взаимный выход предприятий на рынки"
 JAP_chi_advancement_companies_desc: "Содействовать взаимным инвестициям и выходу на рынки между японскими и китайскими предприятиями, чтобы увеличить экономическую взаимозависимость и повысить производительность."
 JAP_chi_kanji: "Проект культурного сотрудничества «Синосфера»"
 JAP_chi_kanji_desc: "Укрепляя культурные связи между странами Синосферы, этот проект подчёркивает общие ценности и исторические узы, служа культурным буфером против внешнего влияния."
 JAP_chi_temple: "Совместный проект по сохранению буддийских храмов"
 JAP_chi_temple_desc: "Сохранить буддийские храмы как общее культурное наследие через сотрудничество Японии и Китая. Этот проект повышает их ценность как туристических объектов и подтверждает исторические связи между двумя странами."
 JAP_chi_senkaku: "Управление спором о Сенкаку"
 JAP_chi_senkaku_desc: "Напряженность вокруг островов Сенкаку напрямую связана с общими японо-китайскими отношениями и стабильностью Восточно-Китайского моря. Сохраняя нашу позицию в отношении суверенитета, необходимо создать дипломатическую структуру управления, чтобы избежать случайных столкновений. Давайте официально установим каналы для диалога и, сдерживая трения на море, продолжим переговоры в благоприятной для нашей страны обстановке."
 JAP_kor_friendship: "Улучшение отношений с Южной Кореей"
 JAP_kor_friendship_desc: "В направлении будущих отношений Японии и Южной Кореи японское правительство будет работать над восстановлением доверия и продолжением диалога. Южная Корея — один из важнейших соседей Японии, напрямую связанный с региональной стабильностью и экономикой, и улучшение отношений расширит возможности и влияние Японии."
 JAP_kor_accept_intellectual_platform: "Южная Корея согласилась на создание Японо-Китайско-Корейской исторической платформы."
 JAP_kor_accelerator: "Токийско-сеульский акселератор"
 JAP_kor_accelerator_desc: "В Токио и Сеуле создаётся совместная акселерационная программа для поддержки и развития стартапов, укрепляя инновации и экономическое сотрудничество между двумя столицами."
 JAP_kor_local_companies: "Инициатива обмена местными компаниями"
 JAP_kor_local_companies_desc: "Содействует сотрудничеству региональных компаний, ускоряя рост и развитие гражданской промышленности на местном уровне."
 JAP_kor_cultural_exchange: "Культурный обмен"
 JAP_kor_cultural_exchange_desc: "Продвигая культурный обмен, закладывается основа для более глубокого взаимопонимания и влияния на общественное мнение между двумя народами."
 JAP_kor_aging: "Японо-корейская рабочая группа по стареющему обществу"
 JAP_kor_aging_desc: "Создана совместная японо-корейская рабочая группа для решения общей проблемы старения общества, с проведением ежемесячных обсуждений по выработке совместных политик."
 JAP_kor_liancourt_rocks: "Управление спором о Такэсиме"
 JAP_kor_liancourt_rocks_desc: "Спор о Такэсиме (Докдо) является важным нерешённым вопросом, который может повлиять на общие отношения Японии и Южной Кореи. При твёрдом соблюдении позиции нашей страны мы создадим рамки для диалога и практических консультаций, чтобы избежать случайных трений и эскалации дипломатической напряжённости. Это снимет ограничения на переговоры с Южной Кореей по вопросу Такэсима (Докдо)."
 JAP_approaching_russia: "Сближение с Россией"
 JAP_approaching_russia_desc: "Для обеспечения геополитической стабильности и надёжного доступа к ресурсам мы проводим дипломатическую линию на улучшение отношений с Россией, сосредоточив внимание на сотрудничестве в энергетике, инфраструктуре и торговле."
 JAP_sov_far_east_development: "Инициатива Дальнего Востока"
 JAP_sov_far_east_development_desc: "Используя опыт Японии по оживлению регионов в холодных условиях Хоккайдо, эта инициатива продвигает развитие в российском Дальнем Востоке через инвестиции в инфраструктуру и иностранный капитал."
 JAP_sov_saakhalin: "Сахалин II"
 JAP_sov_saakhalin_desc: "Чтобы обеспечить стабильный доступ к ископаемому топливу, Япония усиливает иностранные инвестиции в энергетический проект «Сахалин II» в сотрудничестве с Россией."
 JAP_sov_logistics_corridor: "Логистический коридор Япония — Европа"
 JAP_sov_logistics_corridor_desc: "Мы построим наземный логистический коридор, соединяющий Японию и Европу через Россию. Используя российские железные дороги и автомагистрали, мы стремимся сократить время перевозок и обеспечить стабильный доступ к европейским рынкам."
 JAP_sov_it_corridor: "Цифровой коридор через Россию"
 JAP_sov_it_corridor_desc: "В сотрудничестве с японскими ИТ-компаниями в России создаются инфраструктура, такая как центры обработки данных и волоконно-оптические линии, формируя цифровую торговую сеть, объединяющую Европу, Центральную Азию и Россию."
 JAP_sov_kuril_islands: "Управление спором о Северных территориях"
 JAP_sov_kuril_islands_desc: "Вопрос Северных территорий остаётся нерешённым и затрагивает саму основу японско-российских отношений. При твёрдом отстаивании позиции нашей страны мы создадим рамки дипломатических переговоров и практических консультаций, чтобы избежать закрепления конфронтации. При осторожном ведении отношений с Россией мы снимем ограничения на переговоры по вопросу Северных территорий."
 JAP_defensive_foundations: "Основы обороны"
 JAP_defensive_foundations_desc: "Япония укрепляет базовую оборонную позицию Сил самообороны, сосредоточившись на защите территории, реагировании на кризисы и сдерживании, оставаясь в рамках строго оборонительного толкования Статьи 9."
 JAP_jgsdf: "Укрепить СВР Японии"
 JAP_jgsdf_desc: "Силы самообороны сухопутных войск Японии усиливают свои оборонительные возможности за счёт улучшенной мобильности, подготовки и готовности. Эти меры гарантируют, что сила сможет защищать Родину, действуя строго в рамках существующих правовых и стратегических ограничений."
 JAP_type_x_mbt: "Основной боевой танк Type 10"
 JAP_type_x_mbt_desc: "Type 10 — это шаг вперёд в японской бронетанковой технологии: он легче, быстрее и специально создан для быстрого развёртывания по сложному японскому рельефу. Расширяя производство и готовя экипажи для этой передовой платформы, СВР Японии укрепляет способность быстро реагировать на угрозы внутри страны."
 JAP_type_manouvre_combat_vehicle: "Боевой манёвренный автомобиль Type 16"
 JAP_type_manouvre_combat_vehicle_desc: "Боевой манёвренный автомобиль Type 16 обеспечивает высокомобильную огневую поддержку силам быстрого реагирования. Его колёсная компоновка позволяет СВР Японии быстро перемещать подразделения по архипелагу, укрепляя удалённые регионы без опоры на тяжёлую бронетанковую логистику."
 JAP_wheeled_howitzer: "Колёсный гаубичный комплекс Type 19"
 JAP_wheeled_howitzer_desc: "Новое поколение мобильной артиллерии Type 19 сочетает современные системы управления огнём с возможностью быстрого переброса. Его колёсное шасси обеспечивает гибкую поддержку оборонительных операций по разрозненным и гористым территориям Японии."
 JAP_chu_sam: "Расширить сеть Type 03 Chu-SAM"
 JAP_chu_sam_desc: "Япония усиливает свою ПВО, вводя дополнительные батареи Type 03 Chu-SAM. Эти современные зенитные ракетные комплексы средней дальности повышают защиту от воздушных вторжений и бесшовно интегрируются с национальной системой раннего предупреждения и слежения."
 JAP_type_atgm: "Усилить противотанковые ракетные подразделения"
 JAP_type_atgm_desc: "СВР Японии оснащает свои пехотные и разведывательные элементы улучшенными противотанковыми управляемыми ракетными системами, включая обновлённые модели Type 01 и Type 96. Эти модернизации гарантируют, что сухопутные силы смогут противостоять современным бронетанковым угрозам в любом оборонительном сражении."
 JAP_central_readiness_force: "Расширить Центральные силы готовности"
 JAP_central_readiness_force_desc: "Центральные силы готовности развиваются в гибкое командование быстрого развертывания, способное реагировать на чрезвычайные ситуации по всей Японии. Улучшая совместную подготовку, мобильность и координацию с региональными армиями, мы обеспечиваем возможность сухопутным подразделениям быстро усиливать ключевые районы."
 JAP_civil_protection_act: "Внедрить рамки гражданской защиты"
 JAP_civil_protection_act_desc: "Новые меры гражданской защиты формализуют сотрудничество между Силами самообороны, местными властями, полицией и экстренными службами. Чёткие правовые процедуры эвакуации, реагирования на кризисы и защиты инфраструктуры укрепляют способность Японии защищать население как при бедствиях, так и при инцидентах безопасности."
 JAP_maritime_self_defence_force: "Укрепить Силы морской самообороны"
 JAP_maritime_self_defence_force_desc: "Силы морской самообороны укрепляются за счёт улучшенной подготовки, обслуживания и систем поддержки для поддержания высокоинтенсивных операций на море. Укрепляя эскортные группы, патрульный потенциал и морскую логистику, Япония сможет надёжнее охранять жизненно важные морские пути и прибрежные воды."
 JAP_amphibious_rapid_deployment: "Подготовить бригаду амфибийного быстрого развертывания"
 JAP_amphibious_rapid_deployment_desc: "Создано специализированное амфибийное соединение быстрого развертывания для реагирования на кризисы на удалённых островах Японии. Сочетая пехоту, броню и морской транспорт, эта бригада обучена укреплять, обеспечивать безопасность и при необходимости возвращать ключевую территорию вдоль морских рубежей Японии."
 JAP_atago_destroyer: "Ввести в строй современные эсминцы Aegis"
 JAP_atago_destroyer_desc: "Новые эсминцы с системой Aegis вводятся в строй, обеспечивая мощные возможности ПВО, борьбы с подводными лодками и управления. Эти современные эскортные корабли формируют основу современного надводного флота Японии и значительно усиливают защиту флота и региональное сдерживание."
 JAP_keen_sword_operation: "Расширить совместные учения Keen Sword"
 JAP_keen_sword_operation_desc: "Серия учений Keen Sword расширяется за счёт более сложных морских, воздушных и наземных компонентов. Регулярные крупномасштабные манёвры с союзниками оттачивают взаимодействие, улучшают совместное командование и контроль, а также демонстрируют готовность Японии действовать эффективно в оспариваемой региональной обстановке."
 JAP_f2_multirole_defensive_enhancement: "Укрепить многоцелевой флот F-2"
 JAP_f2_multirole_defensive_enhancement_desc: "Флот F-2 получает модернизированную авионику, датчики и боевые системы для улучшения ПВО и морского удара в ближних водах. Эти усовершенствования позволяют самолётам эффективнее реагировать на региональные угрозы, сохраняя при этом преимущественно оборонительный профиль миссии."
 JAP_f15_defensive_updat_programe: "Программа оборонной модернизации F-15"
 JAP_f15_defensive_updat_programe_desc: "Истребители превосходства в воздухе F-15 Японии проходят комплексную модернизацию, включая современные радиолокаторы, комплексы радиоэлектронной борьбы и улучшенные воздух-воздух ракеты. Обновлённый парк значительно укрепляет способность Японии защищать собственное воздушное пространство от всё более способных противников."
 JAP_hyuga_class: "Ввести в строй вертолётоносцы класса Hyūga"
 JAP_hyuga_class_desc: "Вертолётоносцы класса Hyūga вводятся в полное оперативное применение как платформы управления и борьбы с подводными лодками. Их способность координировать эскортные группы и эксплуатировать несколько вертолётов значительно улучшает защиту флота и морскую ситуационную осведомлённость."
 JAP_p_maritime_patrol: "Расширить морскую патрульную авиацию"
 JAP_p_maritime_patrol_desc: "Япония инвестирует в современные самолёты морского патрулирования для наблюдения за морскими путями, обнаружения подводных лодок и поддержки поисково-спасательных операций. Усиленное патрулирование вокруг архипелага укрепляет как национальную безопасность, так и безопасность морского судоходства."
 JAP_deploy_ballistic_warning_radars: "Развернуть радиолокационные станции предупреждения о баллистических ракетах"
 JAP_deploy_ballistic_warning_radars_desc: "На дальний рубеж устанавливаются новые радиолокационные станции раннего предупреждения для обнаружения и отслеживания запусков баллистических ракет в регионе. Интегрируя эти датчики в национальную командную сеть, Япония получает важные минуты для оценки угроз, оповещения населения и координации оборонных ответных мер."
 JAP_modernize_jadge: "Модернизировать систему ПРО JADGE"
 JAP_modernize_jadge_desc: "Система Japan Aerospace Defense Ground Environment (JADGE) модернизируется за счёт улучшенных каналов передачи данных, вычислительных мощностей и интеграции с морскими и наземными датчиками. Современная сеть JADGE позволяет быстрее принимать решения и эффективнее задействовать силы ПВО."
 JAP_air_self_defence_force: "Укрепить Силы воздушной самообороны"
 JAP_air_self_defence_force_desc: "Силы воздушной самообороны расширяют программы подготовки, инфраструктуру баз и вспомогательные подразделения для работы с более высоким оперативным темпом. Эти улучшения обеспечивают Японию возможностью поддерживать непрерывное воздушное патрулирование, быстрые поднятия в воздух и сложные совместные учения по мере роста нагрузки на региональное воздушное пространство."
 JAP_article_nine_transition_comittee: "Создать Комитет по переходу обороны"
 JAP_article_nine_transition_comittee_desc: "Учреждается специальный комитет для координации перехода Японии к модернизированной позиции национальной обороны. Объединив политиков, военных планировщиков и правовых экспертов, Япония сможет управлять перераспределением полномочий и обеспечить стабильную, хорошо организованную трансформацию."
 JAP_article_nine_transition_comittee_tt: "§GМодификатор «Баланс сил» в соответствии со статьей 9 больше не сможет изменяться в зависимости от уровня интерпретации. Это теперь открывает доступ к национальным фокусам, полностью исключая действие статьи 9.§!"
 JAP_secure_public_support: "Заручиться поддержкой общества для реформ обороны"
 JAP_secure_public_support_desc: "Запущена общенациональная кампания по разъяснению эволюции оборонной политики Японии, устранению общественных опасений и укреплению доверия к новой позиции безопасности. Широкая поддержка общества обеспечивает политическую стабильность и снижает трения в период перехода."
 JAP_modernize_joint_command: "Модернизировать структуры объединённого командования"
 JAP_modernize_joint_command_desc: "Вооружённые силы интегрируют свои оперативные командования в единое объединённое звено, улучшая взаимодействие и готовность. Современное совместное планирование и единные стандарты подготовки позволяют эффективнее реагировать на сложные сценарии безопасности."
 JAP_normalize_defense_procurement: "Нормализовать системы оборонных закупок"
 JAP_normalize_defense_procurement_desc: "Япония оптимизирует оборонные закупки, расширяет промышленный потенциал и укрепляет координацию с отечественными производителями. Прозрачные, современные процедуры закупок обеспечивают своевременную и устойчивую реализацию ключевых оборонных проектов."
 JAP_formalize_national_defense: "Официально закрепить национальные оборонные возможности"
 JAP_formalize_national_defense_desc: "Япония официально кодифицирует расширенные оборонные обязанности, уточняя роли, миссии и долгосрочные стратегические цели. Когда переход завершён, вооружённые силы действуют в рамках единой концепции, разработанной для защиты национальных интересов в усложняющейся региональной обстановке."
 JAP_normalize_defense_procurement_done: "Нормализация оборонных закупок завершена"
 JAP_modernize_joint_command_done: "Модернизация объединённого командования завершена"
 JAP_consolidate_national_defense_framework_done: "Консолидация национальной оборонной структуры завершена"
 JAP_rebuild_blue_water_navy: "Восстановить флот далёкого плавания"
 JAP_rebuild_blue_water_navy_desc: "Япония готовит свой флот для продолжительных операций далеко за пределами прибрежных вод, расширяя логистику, возможности пополнения и силы сопровождения дальнего действия. Обновлённый флот далёкого плавания позволяет Японии защищать морские линии, поддерживать партнёров и реагировать на кризисы в более обширном регионе."
 JAP_carrier_aviation_tt: "[JAP_carrier_aviation_idea_desc]\n"
 JAP_carrier_aviation_development: "Программа развития палубной авиации"
 JAP_carrier_aviation_development_desc: "Создаётся специализированная программа по развитию палубной авиации, объединяющая морских истребителей, палубные операции и узкопрофильную подготовку. Формирование надёжной палубной авиации значительно расширяет дальность и гибкость флота как в сдерживании, так и в боевых действиях."
 JAP_submarine_modernization_project: "Проект модернизации подводного флота"
 JAP_submarine_modernization_project_desc: "Япония модернизирует свой подводный флот с более тихими корпусами, передовыми датчиками и современным оружием. Новое поколение ударных подводных лодок укрепляет подводное сдерживание, возможности отказа доступа и способность контролировать спорные воды."
 JAP_expand_multi_role_destroyer_fleet: "Расширить флот многоцелевых эсминцев"
 JAP_expand_multi_role_destroyer_fleet_desc: "Дополнительные многоцелевые эсминцы будут введены в строй для обеспечения ПВО, борьбы с подводными лодками и ударных возможностей в одном гибком корабле. Эти эскортные силы станут основой расширенных боевых групп на море."
 JAP_establish_joint_rapid_deployment_command: "Создать объединённое командование быстрого развертывания"
 JAP_establish_joint_rapid_deployment_command_desc: "Учреждается объединённое командование для координации быстро развертываемых сухопутных, воздушных и морских подразделений. С единой планировкой и заранее подготовленными сценариями реагирования Япония получает силу, способную быстро реагировать на кризисы в любой точке широкого стратегического окружения."
 JAP_full_defense_industrial_mobilisation: "Полная мобилизация оборонной промышленности"
 JAP_full_defense_industrial_mobilisation_desc: "Япония направляет свой промышленный потенциал, исследовательские институты и логистические сети на всесторонний план оборонного производства. Стандартизированные закупки, долгосрочные контракты и расширенные мощности позволяют стабильно выпускать корабли, машины, самолёты и современное оружие."
 JAP_long_range_strike_missile_artillery_forces: "Дальние ударные ракетные и артиллерийские силы"
 JAP_long_range_strike_missile_artillery_forces_desc: "Специализированные ракетные и артиллерийские соединения формируются для нанесения точных ударов на дальних дистанциях. Сочетая современные боеприпасы с современными системами целеуказания и управления, Япония получает возможность ставить под удар удалённые военные объекты и критическую инфраструктуру."
 JAP_expand_mechanized_brigades: "Расширить мехбригады"
 JAP_expand_mechanized_brigades_desc: "Существующие механизированные соединения укрепляются, а новые бригады формируются с современными боевыми машинами пехоты и поддерживающей бронетехникой. Это расширение повышает подвижность, защиту и способность к продолжительным наземным операциям."
 JAP_deploy_next_generation: "Развернуть боевые соединения следующего поколения"
 JAP_deploy_next_generation_desc: "Боевое построение реорганизуется вокруг техники следующего поколения, сетевых систем управления и сочетания родов войск. Эти соединения предназначены для быстрого развертывания, высокой живучести и эффективных действий в сложных условиях интенсивных боёв."
 JAP_national_defense_professionalization: "Профессионализация национальной обороны"
 JAP_national_defense_professionalization_desc: "Япония инвестирует в профессиональное военное образование, развитие карьеры и современные кадровые системы во всех видах вооружённых сил. Более способный, опытный и сплочённый корпус офицеров и унтер-офицеров повышает готовность, улучшает руководство и поддерживает долгосрочную эффективность национальной обороны."
 JAP_integrated_air_space_command: "Объединённое командование по воздуху и космосу"
 JAP_integrated_air_space_command_desc: "Создаётся объединённое командование по воздуху и космосу для координации противовоздушной обороны, раннего предупреждения, космической поддержки и наблюдения. Слияние информации с наземных радаров, воздушных датчиков и орбитальных платформ даёт Японии более чёткое представление о театре военных действий и ускоряет реакцию на новые угрозы."
 JAP_establish_long_range_strike_aviation: "Создать дальнюю ударную авиацию"
 JAP_establish_long_range_strike_aviation_desc: "Формируются специализированные дальние ударные авиационные подразделения, оснащённые современными самолётами и оружием на дальнем боевом радиусе. Эти силы обеспечивают возможность поражения критических целей на значительных дистанциях, поддерживая сдерживание и совместные операции по всему региону."
 JAP_mext_generation_air_dominance: "Воздушное превосходство следующего поколения"
 JAP_mext_generation_air_dominance_desc: "Япония ускоряет разработку истребителя следующего поколения для воздушного превосходства, сочетая стелс, передовые датчики и сетевые боевые системы. Эта программа обеспечит превосходство в воздухе в условиях всё более оспариваемого воздушного пространства на долгие годы вперед."
 JAP_advanced_missile_development: "Управление передовыми ракетными разработками"
 JAP_advanced_missile_development_desc: "Создано специализированное управление для контроля исследований, испытаний и производства передовых ракетных систем. От современных воздушных и противокорабельных вооружений до дальних высокоточных ударных комплексов — этот проект расширяет арсенал Японии и повышает эффективность всех родов войск."
 JAP_high_tech_domestic_manufacturing: "Высокотехнологичное отечественное оборонное производство"
 JAP_high_tech_domestic_manufacturing_desc: "Япония инвестирует в высокотехнологичное производство авионики, датчиков, композитных конструкций и двигательных установок. Укрепление отечественных цепочек поставок критических компонентов снижает зависимость от иностранных поставщиков и поддерживает быстрые модернизации авиационных и ракетных платформ."
 JAP_establish_japan_defense_technology_agency: "Агентство оборонных технологий Японии"
 JAP_establish_japan_defense_technology_agency_desc: "Создаётся центральное агентство оборонных технологий для координации исследований, закупок и инноваций между промышленностью, академией и вооружёнными силами. Единое руководство ускоряет циклы разработки, снижает дублирование и гарантирует, что перспективные идеи быстро переходят от лаборатории к боевым частям."
 JAP_atla_defense_technology_consolidation: "Консолидация технологий ATLA"
 JAP_atla_defense_technology_consolidation_desc: "Агентству по закупкам, технологиям и логистике (ATLA) поручается центральная роль в координации исследований, разработок и закупок для всех родов войск. Сосредоточив программы оборонных технологий под одной властью, Япония может сократить дублирование, ускорить инновации и быстрее вводить перспективные проекты в эксплуатацию."
 JAP_gifu_test_aerospace_development_center: "Испытательно-авиационно-космический центр Гифу"
 JAP_gifu_test_aerospace_development_center_desc: "Гифу превращается в ведущий центр испытаний и оценки самолётов, авионики и оружейных систем. Специальные полигоны, инструментальное воздушное пространство и инженерные команды поддерживают строгие испытания, чтобы новые разработки были полностью проверены перед поступлением в строй."
 JAP_aichi_nagoya_aerospace_defense_cluster: "Аэро-космический кластер Аити-Нагоя"
 JAP_aichi_nagoya_aerospace_defense_cluster_desc: "Регион Аити-Нагоя развивается как ведущий кластер производства авиационно-космической и оборонной техники, связывая крупных производителей, поставщиков и научно-исследовательские институты. Сосредоточенные инвестиции в этом регионе увеличивают выпуск планеров, двигателей и высокотехнологичных компонентов для военных и двойного назначения."
 JAP_kobo_maritime_heavy_industry_corridor: "Морской коридор тяжёлой промышленности Кобе"
 JAP_kobo_maritime_heavy_industry_corridor_desc: "Кобе и прилегающие прибрежные города превращаются в непрерывный морской коридор тяжёлой промышленности. Расширенные верфи, сталелитейные предприятия и морские инженерные фирмы создают мощность для строительства и обслуживания более крупного и совершенного флота и его инфраструктуры."
 JAP_nagasaki_shipyard_defense: "Интеграция обороны судоверфи Нагасаки"
 JAP_nagasaki_shipyard_defense_desc: "Крупные верфи Нагасаки теснее интегрированы в национальное оборонное планирование, выделяя дополнительную мощность для строительства эсминцев, вспомогательных судов и специализированных морских платформ. Более тесная координация между верфью и флотом сокращает сроки строительства и повышает боеготовность флота."
 JAP_kure_naval_arsenal_revival: "Возрождение морского арсенала Курэ"
 JAP_kure_naval_arsenal_revival_desc: "Исторические морские мощности Курэ возрождаются как современный комплекс судостроения и ремонта. Модернизированные доки, мастерские и логистические узлы восстанавливают роль города как ключевого центра обслуживания, ремонта и модернизации боевых кораблей."
 JAP_sasebo_fleet_support_complex: "Комплекс поддержки флота Сасэбо"
 JAP_sasebo_fleet_support_complex_desc: "Сасэбо расширяется в комплекс всесторонней поддержки флота с улучшенными мощностями ремонта, складами боеприпасов и снабженческой инфраструктурой. Его расположение в западной Японии делает его идеальным хабом для поддержки операций в близлежащих морях и ключевых морских узлах."
 JAP_yokosuka_dockyard_expansion: "Расширение доков Иокосука"
 JAP_yokosuka_dockyard_expansion_desc: "Доковые и сопутствующие объекты Иокосуки увеличиваются, чтобы обслуживать больше кораблей и более глубокие циклы обслуживания. Как одна из основных военно-морских баз Японии, расширенная Иокосука значительно повышает способность флота поддерживать боеготовность основных надводных боевых единиц."
 JAP_revitalize_defense_production: "Возродить оборонную производственную базу"
 JAP_revitalize_defense_production_desc: "Япония проводит широкомасштабную программу оживления оборонной промышленной базы, поддерживая ключевых производителей, стабилизируя долгосрочные контракты и модернизируя производственные линии. Здоровая промышленная основа позволяет стране надёжно оснащать силы и быстрее адаптироваться к новым оперативным требованиям."
 JAP_kaguya_starward_expedition: "Экспедиция Кагуя в звёзды"
 JAP_kaguya_starward_expedition_desc: "Вдохновлённая сказанием о принцессе Кагуя, которая вернулась на Луну в светящемся одеянии, Япония запускает амбициозное глубококосмическое исследование околоземных астероидов. Передовые роботизированные зонды и демонстрационные установки для добычи отправляются в космос, превращая легенду в технологию и прокладывая путь для будущей добычи ресурсов среди звёзд."
 JAP_kaguya_starward_expedition_tt: "§YНаша миссия на Луну начнётся!§!"
 JAP_tsukuyomi_lunar_program: "Лунная программа Сукуйоми"
 JAP_tsukuyomi_lunar_program_desc: "Названная в честь Сукуйоми, бога Луны японской мифологии, эта программа объединяет промышленность, исследовательские институты и космическое агентство за устойчивым лунным проектом. Орбитальные аппараты, посадочные модули и наземная инфраструктура превращают Луну из удалённого символа в реальный форпост, служащий науке, навигации и долгосрочным космическим амбициям Японии."
 JAP_amaterasu_martian_dawn: "Марсианское восхождение Аматэрасу"
 JAP_amaterasu_martian_dawn_desc: "Под именем Аматэрасу, богини восходящего солнца, Япония устремляется к красной планете. Дальние зонды, передовые двигательные установки и новаторские исследования жизнеобеспечения поддерживают новую волну марсианских экспедиций. Каждая миссия раздвигает границы человеческой изобретательности, превращая далёкий свет Марса в следующий горизонт для высокотехнологичной цивилизации Японии."
 JAP_restore_imperial_household: "Восстановить Императорский дом"
 JAP_restore_imperial_household_desc: "Императорский двор выходит из церемониального режима и переходит в национальное управление, восстанавливая институциональный потенциал и формальную роль двора. Легитимность пересматривается таким образом, что Хризантемовый трон устанавливает условия, а не ратифицирует их. Теперь каждая фракция должна выбрать сторону."
 JAP_reinstate_former_imperial_houses: "Восстановить бывшие императорские дома"
 JAP_reinstate_former_imperial_houses_desc: "Бывшие княжеские дома восстановлены, их статус восстановлен, что расширяет круг ветвей, имеющих право наследовать престол. Монархисты приветствуют это как обеспечение непрерывности линии престолонаследия, конституционалисты осуждают как политическую манипуляцию. Преемственность обеспечена в любом случае, независимо от исхода спора."
 JAP_male_line_succession_act: "Принять закон о мужской линии наследования"
 JAP_male_line_succession_act_desc: "Неопределённость наследования — стратегическая уязвимость так же, как и внутриполитический спор. Мы кодифицируем наследование по мужской линии в законе, чтобы устранить двусмысленность и обеспечить династическую преемственность на поколения. Этот шаг укрепит поддержку монархистов, но вызовет яркое сопротивление реформаторов, видящих в нём шаг назад от современной Японии."
 JAP_imperial_rites_restored: "Восстановить императорские обряды"
 JAP_imperial_rites_restored_desc: "Трон без ритуалов — это корона без веса. Мы восстановим императорские обряды как государственно признанные церемонии, подтверждая священные основы монархии и преемственность нации. Тем самым мы связываем современное государство с древней легитимностью, независимо от того, одобряет это политический класс или нет."
 JAP_recall_privy_council: "Восстановить Тайный совет"
 JAP_recall_privy_council_desc: "Парламентская политика стала громкой, мимолётной и всё больше отдаляется от долгосрочной государственной мудрости. Мы восстановим Тайный совет, чтобы предоставить Трону постоянный консультативный орган, сдержанный, опытный и верный непрерывности государства. Его возвращение будет воспринято монархистами как стабилизирующая опора и его противниками как нелегитимный центр власти."
 JAP_imperial_reform_commission: "Создать Комиссию по императорской реформе"
 JAP_imperial_reform_commission_desc: "Восстановление требует структуры, а не импровизации. Мы создадим Комиссию по императорской реформе для разработки правовой и институциональной модели обновлённой монархии и выравнивания министерств, придворных учреждений и органов безопасности вокруг единой государственной доктрины. После её созыва символизм превратится в политику, и отступление станет политически невозможным."
 JAP_imperial_audience: "Провести императорскую аудиенцию"
 JAP_imperial_audience_desc: "Стороны соберутся не как равные, а как прошения перед Троном. В тщательно построенной императорской аудиенции мы свяжем лидеров фракций с новым порядком, где избранная политика служит государству, а не командует им. Если Хризантемовый Трон должен председательствовать над современной сёгунатой, он сначала должен заставить политический класс склониться перед своей логикой."
 JAP_imperial_civic_oath: "Провозгласить императорскую гражданскую клятву"
 JAP_imperial_civic_oath_desc: "Новый порядок требует не только указов, но общего торжества. Мы провозгласим императорскую гражданскую клятву, связывающую чиновников, военнослужащих и гражданские институты с Троном как высшим источником легитимности. Так мы превратим лояльность в закон и сделаем инакомыслие предательством."
 JAP_unified_intelligence_secretariat: "Создать единый секретариат разведки"
 JAP_unified_intelligence_secretariat_desc: "Современный сёгунат не может быть слеп. Мы объединим конкурирующие службы в единый секретариат разведки, который будет отчитываться по одной цепочке командования и охранять стратегическую картину ради Трона. Это мгновенно заточит наше государственное искусство и даст соперникам повод бояться того, что теперь известно двору."
 JAP_blue_water_navy: "Построить флот далёкого плавания"
 JAP_blue_water_navy_desc: "Судьба Японии морская, и наша безопасность не может заканчиваться за горизонтом. Мы построим настоящий флот далёкого плавания, способный действовать далеко от родных берегов, защищать морские пути и проецировать силу там, где того требуют наши интересы. С флотом как стальным инструментом Трона мир научится измерять Японию по следу, который она оставляет."
 JAP_imperial_defense_council: "Создать Императорский оборонный совет"
 JAP_imperial_defense_council_desc: "Стратегию нельзя оставлять на электоральные циклы и министерские споры. Мы сформируем Императорский оборонный совет, чтобы объединить вооружённые силы, руководителей разведки и ключевые министерства под одной стратегической доктриной, привязанной к Трону. В один ход оборонная политика Японии станет последовательной и гораздо сложнее для саботажа внутри."
 JAP_rare_earth_resilience: "Имперский стратегический резерв"
 JAP_rare_earth_resilience_desc: "Имперское правительство поручает крупным торговым домам обеспечивать бесперебойность линий снабжения и создавать запасы сырой нефти и стратегических металлов на случай войны или эмбарго. Двор и министерства совместно хранят материальные ресурсы страны в доверительном управлении для короны. То, что императорское царство не может купить свободно, оно накапливает и обеспечивает собственными силами.\n-------------\nЕсли §Y$JAP_national_energy_security$§! уже достигнуто, резерв создается на надежном основании и приносит §Gдвойную§! выгоду от стратегических металлов."
 JAP_national_shipbuilding_plan: "Императорская программа расширения флота"
 JAP_national_shipbuilding_plan_desc: "Трон не удовлетворится береговой обороной; Япония будет править морями, которые определят нашу судьбу. В рамках Программы расширения Императорского флота мы нарастим мощности верфей, закрепим долгосрочные контракты на закупку военно-морских судов и обеспечим непрерывный цикл строительства от закладки киля до ввода в эксплуатацию. Когда этот план будет реализован, наши соперники не будут спорить о намерениях Японии. Они будут считать наши корпуса."
 JAP_imperial_war_cabinet: "Созвать Императорский военный кабинет"
 JAP_imperial_war_cabinet_desc: "Во время кризиса Японией нельзя управлять задержками, комитетами и партийными торгами. Мы созовём Императорский военный кабинет, чтобы централизовать власть командования и связать политическое руководство единой стратегической линией под мандатом Трона. С этого момента государство будет действовать одним голосом, и это будет голос Императора."
 JAP_russian_lost_territories: "Вернуть Северные территории"
 JAP_russian_lost_territories_desc: "Япония отстаивает свои претензии на острова и воды, находящиеся под контролем России, как суверенное требование, подкрепленное реальными рычагами влияния, а не дипломатической формальностью. Если Москва откажет, Япония должна будет решить, насколько далеко она готова зайти. Север не останется закрытым за договорами и молчанием."
 JAP_fight_china_again: "Дракон и Хризантема"
 JAP_fight_china_again_desc: "Старый конфликт никогда не был по-настоящему разрешён, он лишь был отложен договорами и сдвигами баланса. Мы подготовим нацию к новой конфронтации с Китаем, мобилизуя промышленность, вооружённые силы и общественную волю для войны, которая определит будущее региона. На этот раз Япония будет бороться не только за выживание, но и за порядок, который за этим последует."
 JAP_reclaim_pacific_rim: "Утвердить наш мандат на Тихоокеанском рубеже"
 JAP_reclaim_pacific_rim_desc: "Процветание и безопасность Японии написаны по всему Тихому океану — от морских путей до островных цепей и отдалённых узлов. Мы утвердим мандат на Тихоокеанский рубеж, рассматривая морское влияние как национальную политику, подкреплённую присутствием флота, доступом к базам и экономическим рычагом. Эпоха наблюдения за тем, как другие чертят карту, закончилась; Япония будет её формировать."
 JAP_office_for_colonialism: "Возродить Даитоа-сё"
 JAP_office_for_colonialism_desc: "Империя без администрации — это завоевание, которое разваливается под собственным весом. Мы возродим Даитоа-сё для координации управления заморскими территориями, мер безопасности и экономической интеграции под единой имперской доктриной. С одним министерством, управляющим сферой, влияние Японии перестанет быть импровизацией, оно станет управляемым, расширяемым и принудительным."
 JAP_office_for_colonialism_tt: "Открывает закон об оккупации в государствах Азии:\n"
 JAP_reclaim_south_chinese_sea: "Командовать Южными морями"
 JAP_reclaim_south_chinese_sea_desc: "Южно-Китайское море — артерия Азии, и кто контролирует его, тот контролирует поток торговли, топлива и власти. Мы выйдем, чтобы вернуть доминирование в этих водах, установив присутствие, базы и морскую мощь для принуждения любого претендента к нашей воле. Япония не будет просить доступ, она гарантирует его силой."
 JAP_reclaim_indochina: "Вернуться в Индокитай"
 JAP_reclaim_indochina_desc: "Индокитай расположился на перекрёстке Юго-Восточной Азии, где порты, ресурсы и морские пути решают, кто задаёт региональный баланс. Мы вернём его силой и политическим давлением, возвращая эти территории под стратегическое руководство Японии. Как только он будет закреплён, южный фланг нашей морской сферы станет надёжно заякоренным влиянием."
 JAP_reclaim_australia: "Южный якорь"
 JAP_reclaim_australia_desc: "Австралия — краеугольный камень южного Тихого океана, континент, который может разместить флоты, авиацию и логистику долгой войны. Мы придём к контролю над ней не рейдом и не жестом, а как к постоянному якорю нашей морской сферы. Если юг будет обеспечен, Тихий океан станет японским озером."
 JAP_reclaim_myanmar: "Обеспечить ворота Иравади"
 JAP_reclaim_myanmar_desc: "Мьянма — это сухопутный мост между Индией и Юго-Восточной Азией, контролирующий маршруты от Бенгальского залива до глубин региона. Мы вернём её посредством силы и политического давления, превратив её порты, аэродромы и коридоры в активы широкой сферы Японии. Как только ворота Иравади будут закреплены, наш южный фланг станет значительно труднее оспаривать."
 JAP_reclaim_the_pacific: "Океан как наш рубеж"
 JAP_reclaim_the_pacific_desc: "Тихий океан — не удалённая бездна, это рубеж, определяющий выживание и величие Японии. Мы вернём его через присутствие флота, островные опорные пункты и волю обеспечить морской порядок, сформированный в Токио. Когда океан станет нашим рубежом, каждый противник будет вынужден действовать в нашей тени."
 JAP_reclaim_north_korea: "Подчинить Север под руку Токио"
 JAP_reclaim_north_korea_desc: "Мы добьёмся урегулирования, которое лишит Пхеньян стратегической автономии и поставит его внешнюю политику под японский надзор. Через контролируемый доступ, гарантии безопасности и жёсткое давление на ресурсы и восстановление Север превратится из непредсказуемой угрозы в зависимый буфер. Это господство без иллюзий, и стабильность, принудительная по определению."
 JAP_reclaim_south_korea: "Навязать структуру протектората"
 JAP_reclaim_south_korea_desc: "Мы выйдем за пределы влияния и установим протекторат, который привяжет внешнюю и оборонную политику Кореи к курсу Токио. Через контролируемые соглашения, советников и рычаги влияния на ключевые институты Корея будет вынуждена принять подчинённое положение без открытой аннексии. Это современная империя, построенная на бумаге, давлении и постоянстве."
 JAP_reclaim_taiwan: "Учредить протекторат над Тайванем"
 JAP_reclaim_taiwan_desc: "Мы перейдём от влияния к контролю, установив протекторат, который привяжет оборонную и внешнюю политику Тайваня к курсу Токио. Через гарантии, права на базы и институциональное влияние остров будет обеспечен как лояльный морской бастион без необходимости открытой аннексии. Это современное имперское устройство, обеспечиваемое военно-морской мощью и политическим давлением."
 JAP_basic_reconstruction_policy: "Политика восстановления"
 JAP_basic_reconstruction_policy_desc: "После беспрецедентного разрушения, вызванного Великим землетрясением Восточной Японии, правительство должно установить основную политику восстановления. Представление национальной рамки для восстановления средств к существованию, восстановления инфраструктуры и оживления промышленности станет первым шагом к возвращению доверия общества и стабилизации страны."
 JAP_tohoku_infrastructure: "Восстановить инфраструктуру Тохоку"
 JAP_tohoku_infrastructure_desc: "Землетрясение и цунами нанесли катастрофические повреждения транспортным сетям и жизнеобеспечению Тохоку. Восстановление дорог, железных дорог и портов — первый шаг к возрождению местных сообществ и продвижению восстановления региона. Несмотря на огромные затраты и время, это нельзя откладывать."
 JAP_fishery_revival: "Восстановление агропромрыбной отрасли"
 JAP_fishery_revival_desc: "Цунами разрушило рыболовные порты и сельскохозяйственные угодья Тохоку, уничтожив бесчисленные средства к существованию. Восстановление этих секторов восстановит экономическую основу региона и обеспечит стабильное снабжение продовольствием. Эта работа важна как для местного восстановления, так и для национальной безопасности."
 JAP_tohoku_port: "Восстановить портовые функции Тохоку"
 JAP_tohoku_port_desc: "Цунами парализовало портовые сооружения и судоверфи, остановив логистику и морскую торговлю. Реконструкция оживит региональную промышленность и откроет ключевые внутренние и международные маршруты. Возвращение этих ворот имеет решающее значение для широкой экономической реконструкции Японии."
 JAP_power_supply: "Стабилизация энергоснабжения"
 JAP_power_supply_desc: "Катастрофа повредила множество энергетических объектов и линий передачи, вызвав серьёзный дефицит электроэнергии. Мы должны быстро расширить альтернативные источники и укрепить сеть, чтобы обеспечить стабильность для граждан и промышленности."
 JAP_kanto_infrastructure: "Восстановить инфраструктуру Канто"
 JAP_kanto_infrastructure_desc: "Катастрофа нанесла серьёзные повреждения региону Канто, особенно на севере, нарушив транспортные сети и городские функции. Восстановление инфраструктуры, поддерживающей столичную зону, необходимо для возрождения экономической активности и поддержания национальной стабильности. Быстрая и продуманная реконструкция обязательна."
 JAP_reconstruction_agency: "Создать агентство восстановления"
 JAP_reconstruction_agency_desc: "Чтобы ускорить и координировать восстановление после катастрофы, правительство создаст Агентство восстановления. Этот специализированный орган объединит усилия центральных и местных властей, обеспечивая эффективную реализацию планов восстановления."
 JAP_industrial_recovery: "Восстановить промышленную базу"
 JAP_industrial_recovery_desc: "Катастрофа серьёзно повредила заводы и промышленные объекты. Восстановление промышленной базы позволит вернуть рабочие места и ускорить восстановление экономики."
 JAP_funding_local_governments: "Поддержка пострадавших муниципалитетов"
 JAP_funding_local_governments_desc: "Предоставить средства местным властям в пострадавших районах для поддержки восстановления, восстановления средств к существованию и поддержания общественных услуг."
 JAP_housing_reconstruction: "Восстановление жилья для пострадавших"
 JAP_housing_reconstruction_desc: "Ускорить строительство временного жилья и долгосрочных жилых районов, чтобы переселить семьи из приютов и дать городам ясные планы постоянного переселения."
 JAP_reconstruction_completed_focus: "Реконструкция завершена"
 JAP_reconstruction_completed_focus_desc: "Отметить переход от экстренного восстановления к долгосрочному оживлению Тохоку. Основная инфраструктура восстановлена, промышленность вновь работает, и города начинают переход от выживания к росту."
 JAP_trilateral_anti_north_korea_training: "Трёхсторонняя готовность на полуострове"
 JAP_trilateral_anti_north_korea_training_desc: "Регулярные совместные учения с Южной Кореей и США выработали общий алгоритм действий на полуострове. Совместимые процедуры командования, объединённые воздушные и морские учения и координированные процедуры противоракетной обороны гарантируют, что любая провокация от Пхеньяна встретит быстрый, единый и убедительный ответ."
 JAP_dprk_policy_idea: "Проникновение японской политики"
 JAP_dprk_policy_idea_desc: "Новая корейская политика Токио открыла каналы, которых раньше не существовало. Через дипломатические контакты, закулисных посредников, экономические рычаги и разведывательную работу Япония получила временное окно для расширения своего влияния внутри политической среды Северной Кореи. Открытие хрупкое и спорное, но сейчас японское давление и присутствие в Пхеньяне имеют больше веса, чем прежде."
 JAP_entrenched_demand_shortfall_idea_1: "Затяжной спад спроса"
 JAP_entrenched_demand_shortfall_idea_1_desc: "Дефляционные ожидания и опасения по поводу будущего сдерживают расходы домохозяйств, а компании воздерживаются от инвестиций из-за слабого спроса. Заработные платы стагнируют, цены практически не меняются, и никто не хочет первым тратить деньги. Экономика Японии не рушится, но она истощается из-за паралича.\n-------------\nВы можете §Gсмягчить§! последствия этого общенационального настроения, воспользовавшись решениями из §Y$JAP_japanese_economy_decisions$§!, чтобы повысить показатель §YDemand Recovery Progress§! как минимум до §G30§!!"
 JAP_transparency_and_audit_reform_modifier: "Реформа прозрачности и аудита"
 JAP_transparency_and_audit_reform_modifier_desc: "Мы усилим раскрытие информации и управление публичными записями, снижая возможности для злоупотреблений через цифровизацию и независимые аудиты. Решая проблемы амакадари и непрозрачного политического финансирования, мы повысим административную эффективность, доверие и устойчивость к внешнему влиянию."
 JAP_protecting_human_rights_modifier: "$JAP_protecting_human_rights$"
 JAP_protecting_human_rights_modifier_desc: "$JAP_protecting_human_rights_desc$"
 JAP_worker_protection_modifier: "Защита работников"
 JAP_worker_protection_modifier_desc: "Мы обеспечим защиту средств к существованию и безопасности работников на рабочем месте, создавая условия, которые позволяют людям работать длительное время. Поддерживая более высокие зарплаты и лучшее обращение, а также снижая экономическую неуверенность, мы укрепим социальную стабильность и основы промышленности."
 JAP_redistribution_modifier: "$JAP_redistribution$"
 JAP_redistribution_modifier_desc: "$JAP_redistribution_desc$"
 JAP_leading_disarmament_idea: "$JAP_leading_disarmament$"
 JAP_leading_disarmament_idea_desc: "$JAP_leading_disarmament_desc$"
 JAP_leading_disarmament_idea_3: "Развитие как мирной нации"
 JAP_leading_disarmament_idea_3_desc: "Мы определим национальный путь, не зависящий от военной силы, и перенаправим ресурсы и таланты на гражданское развитие. Сосредоточив усилия на укреплении промышленной базы и городских функций и ускорив создание гражданских отраслей и офисных районов, мы повысим уровень жизни и стимулируем экономический рост."
 JAP_prioritizing_order_modifier: "$JAP_prioritizing_order$"
 JAP_prioritizing_order_modifier_desc: "$JAP_prioritizing_order_desc$"
 JAP_strengthening_cabinet_modifier: "$JAP_strengthening_cabinet$"
 JAP_strengthening_cabinet_modifier_desc: "$JAP_strengthening_cabinet_desc$"
 JAP_regulatory_reform_modifier: "Регуляторная реформа и стратегия роста"
 JAP_regulatory_reform_modifier_desc: "Мы укрепим внутреннюю конкурентоспособность и перейдём к системе, способной поддерживать стабильный рост. Снижая ограничения на предпринимательскую деятельность, мы задействуем динамику частного сектора для развития отраслей и занятости."
 JAP_patriotic_education_modifier: "$JAP_patriotic_education$"
 JAP_patriotic_education_modifier_desc: "$JAP_patriotic_education_desc$"
 JAP_strengthen_military_idea: "$JAP_strengthen_military_power$"
 JAP_strengthen_military_idea_desc: "$JAP_strengthen_military_power_desc$"
 JAP_jsdf_international_missions_idea1a: "Институциональная основа для международных миссий сотрудничества"
 JAP_jsdf_international_missions_idea1a_desc: "Развитие правовой базы и операционных стандартов, необходимых для международных миссий сотрудничества, продвинулось. По мере того как процедуры развертывания за границей и стандарты реагирования во время миссий становятся яснее, стабильность работы сил и согласованность принятия решений на местах улучшаются."
 JAP_constitutional_debate_idea: "Нарастающий конституционный дебат"
 JAP_constitutional_debate_idea_desc: "Крупный сдвиг в политике безопасности подорвал давние предположения о послевоенном порядке. Хотя поддержка усиления национальной обороны растёт, оппозиция тех, кто обеспокоен отходом от пацифизма, остаётся сильной, и конфликты в обществе и политической сфере усиливаются."
 JAP_f15_programe: "Программа модернизации F15"
 JAP_submarine_modernization_idea: "Программа модернизации подводного флота"
 JAP_carrier_aviation: "Восстановление авианосной авиации"
 JAP_keen_sword_operation_idea: "Учения «Кин Сворд»"
 JAP_defense_technology_agency1: "Агентство оборонных технологий Ниппон"
 JAP_defense_technology_agency1_desc: "Агентство оборонных технологий Ниппон координирует исследования, разработки и закупки между промышленностью, академическими кругами и вооружёнными силами. Объединив передовые проекты под одной стратегической концепцией, Япония ускоряет инновации, сокращает дублирование и обеспечивает, что передовые технологии быстрее доходят до передовых частей."
 JAP_diplomacy_modifier: "Дипломатия Японии"
 JAP_diplomacy_modifier_desc: "Япония делает упор на двусторонние связи с ключевыми странами, усиливая сотрудничество в экономике, безопасности и культуре. Через прагматичные партнёрства, основанные на интересах, Япония укрепляет своё присутствие на мировой арене."
 JAP_chiang_mai_initiative: "Инициатива Чиангмай"
 JAP_chiang_mai_initiative_desc: "С расширением валютных свопов с Японией государства-члены АСЕАН укрепляют устойчивость к финансовым кризисам, повышая экономическую стабильность и автономию."
 JAP_quantitative_oda_idea: "Японские инвестиции ОДА в инфраструктуру"
 JAP_quantitative_oda_idea_desc: "Официальная помощь развития Японии ускорила развитие инфраструктуры, такой как транспорт, порты и электроэнергия. Эта поддержка служит важной основой для экономического роста нашей страны."
 JAP_qualitative_oda_idea: "Японская ОДА для человеческого капитала и инноваций"
 JAP_qualitative_oda_idea_desc: "Сотрудничество с Японией принесло значительный прогресс в образовании, развитии человеческих ресурсов и исследованиях. Укрепление потенциала местных предприятий и институтов прокладывает путь к устойчивому развитию."
 JAP_security_south_china_sea_idea: "Японская роль в морской стабильности"
 JAP_security_south_china_sea_idea_desc: "Нейтральное участие Японии в морской безопасности в Южно-Китайском море помогло снизить напряжённость в регионе и защитить свободу судоходства. Оно служит надёжным стабилизирующим фактором для нашего региона."
 JAP_jap_education: "Японо-американская образовательная программа"
 JAP_jap_education_desc: "Пилотируется гибридная образовательная программа, совмещающая японскую дисциплину с американским предпринимательским духом. Взаимное изучение сильных сторон даёт важный стимул для развития будущих поколений."
 JAP_jap_education_culture: "Японо-американское культурно-образовательное сотрудничество"
 JAP_jap_education_culture_desc: "Возникает более широкое партнёрство между Японией и США, выходящее за рамки поп-культуры и передовых технологий. Развитие человеческих ресурсов углубляется через синтез японского образования с фокусом на дисциплину и американского образования с упором на креативность. Синергия культурной близости и научного сотрудничества укрепляет как общественную стабильность, так и импульс для инноваций."
 JAP_dual_use_idea: "Японо-американское сотрудничество в исследованиях двойного назначения"
 JAP_dual_use_idea_desc: "Сотрудничество Японии и США в технологиях двойного назначения усиливается. Ускоренное развитие и обмен экспертизой обещают большую конкурентоспособность в гражданской и военной сферах."
 JAP_disaster_countermeasure_cooperation_idea: "Укрепление устойчивости к бедствиям через сотрудничество"
 JAP_disaster_countermeasure_cooperation_idea_desc: "Благодаря сотрудничеству с Японией в реагировании на бедствия Тайвань значительно укрепил свою способность справляться с чрезвычайными ситуациями. Обмен знаниями и совместные программы подготовки должны снизить ущерб и ускорить восстановление."
 JAP_tai_high_technology_idea: "Японо-тайваньское партнёрство в передовых технологиях"
 JAP_tai_high_technology_idea_desc: "Совместные исследования с Японией ускоряют инновации в гражданских технологических секторах Тайваня. Совместные исследовательские ресурсы и международное сотрудничество повышают промышленную конкурентоспособность."
 JAP_tai_international_student_idea: "Поколенческий обмен с Японией"
 JAP_tai_international_student_idea_desc: "Расширение возможностей для обучения в Японии позволяет большему числу тайваньских студентов получить разнообразный академический опыт. Это способствует формированию будущих лидеров в отношениях Японии и Тайваня и расширяет международные перспективы."
 JAP_chi_kor_intellectual_platform: "Платформа диалога памяти Восточной Азии"
 JAP_chi_kor_intellectual_platform_desc: "При поддержке ООН Япония, Китай и Южная Корея запустили совместную интеллектуальную платформу для сохранения исторической памяти и углубления взаимопонимания. Эта инициатива обозначает новую международную структуру, балансирующую историческое осмысление и ориентированное на будущее сотрудничество."
 JAP_chi_trade_support_idea: "Гармонизация торговых систем"
 JAP_chi_trade_support_idea_desc: "С технической и институциональной поддержкой Японии Китай продвигает развитие торговых систем, соответствующих международным стандартам. Реформы, такие как упрощение таможенных процедур и изменения в законодательстве, способствуют институциональной модернизации."
 JAP_chi_advancement_companies_idea: "Углублённая промышленная интеграция с Японией"
 JAP_chi_advancement_companies_idea_desc: "Взаимное расширение японских и китайских компаний упрощает производственные сети и углубляет экономическую взаимозависимость между двумя странами."
 JAP_chi_kanji_idea: "Сотрудничество культурной сферы синографических символов"
 JAP_chi_kanji_idea_desc: "Через культурное сотрудничество с Японией Китай укрепляет обмен в рамках общей «синограмматической культурной сферы». Это способствует усилению мягкой силы и более благоприятному международному образу."
 JAP_chi_temple_idea: "Совместное сохранение буддийского наследия"
 JAP_chi_temple_idea_desc: "Совместно сохраняя и восстанавливая буддийские храмы и культурные достояния с Японией, Китай подтверждает ценность своего религиозного наследия и способствует развитию туризма."
 JAP_kor_accelerator_idea: "Сотрудничество акселератора Токио–Сеул"
 JAP_kor_accelerator_idea_desc: "Рамки поддержки стартапов, созданные совместно Сеулом и Токио, способствуют развитию нового поколения предпринимательства и укрепляют межгородское технологическое сотрудничество."
 JAP_kor_local_companies_idea: "Программа обмена местными предприятиями"
 JAP_kor_local_companies_idea_desc: "Через обмены между местными компаниями Кореи и Японии региональные экономики оживляются и формируются новые частные промышленные сети."
 JAP_kor_aging_idea: "Совместная рабочая группа по проблемам старения"
 JAP_kor_aging_idea_desc: "Для решения общей проблемы стареющего населения сформирована совместная рабочая группа корейских и японских экспертов для обмена политическим опытом и совершенствования мер социальной защиты."
 JAP_sov_logistics_corridor_idea: "Японо-российская евразийская логистическая сеть"
 JAP_sov_logistics_corridor_idea_desc: "В рамках сотрудничества с Японией ведётся развитие логистического коридора, соединяющего Японию и Европу через Россию. Модернизация инфраструктуры и экономическая связь усиливают геополитическое значение России."
 JAP_sov_it_corridor_idea: "Японо-российская цифровая инициатива"
 JAP_sov_it_corridor_idea_desc: "При поддержке Японии Россия расширяет свою ИТ-инфраструктуру. Партнёрство Японии и России нацелено на создание широкого цифрового коридора и базиса для глобального обмена информацией."
 JAP_territorial_disputes1: "Политические дивиденды от территориальных переговоров"
 JAP_territorial_disputes1_desc: "После определённого прогресса в давних территориальных спорах напряжённость в прилегающих водах несколько уменьшилась, и в общественном мнении растёт чувство облегчения. Снижение дипломатической неопределённости также положительно влияет на экономическую активность прибрежных регионов, поддерживая налоговую базу, связанную с рыболовством, за счёт улучшения условий ведения хозяйства."
 JAP_monarchist_shipbuilding_idea: "Имперская программа судостроения"
 JAP_monarchist_shipbuilding_idea_desc: "Империя вернется к морю как к своей естественной вотчине. В рамках Имперской программы военно-морского строительства расширяются верфи, централизуются контракты, а производство поддерживается в темпах, сопоставимых с военными, до тех пор, пока флот не сравняется с амбициями Японии. Моря, созданные от имени Императора, принадлежат Империи!"
 JAP_monarchist_shipbuilding_idea_tt: "§RЭтот национальный дух будет удалён, когда вы получите§! §Y$naval_power_of_the_continent$§!"
 JAP_restoring_imperial_household_idea: "Восстановление Императорского двора"
 JAP_restoring_imperial_household_idea_desc: "Императорский двор восстанавливается как государственный институт, а не как декоративный двор. Его офисы расширяются, протоколы формализуются, а влияние возвращается через назначения, которые сближают министерства и общество с Троном. Дом Императора снова станет тихим двигателем национального единства и направления."
 JAP_once_millennium_disaster: "Стихийное бедствие раз в тысячу лет"
 JAP_once_millennium_disaster_desc: "Великое землетрясение Восточной Японии 11 марта 2011 года стало одним из самых разрушительных бедствий в современной истории Японии. Землетрясение и цунами мгновенно разрушили инфраструктуру, отрасли и средства к существованию, погрузив нацию в глубокий кризис. Дорога к восстановлению будет долгой и тяжёлой, потребовав огромных ресурсов и времени."
 JAP_scars_earthquake_and_tsunami: "Шрамы землетрясения и цунами"
 JAP_scars_earthquake_and_tsunami_desc: "Великое землетрясение Восточной Японии и разрушительное цунами нанесли катастрофический ущерб городам, портам и прибрежным общинам Тохоку. Инфраструктура и промышленные объекты были уничтожены, что серьёзно подорвало местную производительность и средства к существованию. Восстановление займёт годы и потребует огромных ресурсов и усилий."
 JAP_scars_earthquake: "Шрамы землетрясения"
 JAP_scars_earthquake_desc: "Толчки Великого землетрясения Восточной Японии также ударили по региону Канто, сильно затронув транспортную сеть и нарушив часть промышленной базы. Даже столичный район испытал временное снижение экономической активности. Хотя разрушения не так велики, как в Тохоку, восстановление всё равно требует значительного времени и усилий."
 JAP_focus_renewable_energy_idea: "Ставка на возобновляемую энергию"
 JAP_focus_renewable_energy_idea_desc: "Опасения за ядерную безопасность заставили нас отдать приоритет возобновляемой энергетике, укрепляя долгосрочную независимость в выработке электроэнергии."
 JAP_focus_energy_TT: "Дополнительные расходы: §R0.01%§! ВВП"
 JAP_focus_thermal_power_idea: "Ставка на тепловые электростанции"
 JAP_focus_thermal_power_idea_desc: "Выбор тепловых электростанций обеспечивает стабильную выработку и быструю подачу, особенно пока ядерная безопасность остаётся национальной проблемой."
 JAP_anxiety_nuclear_power: "Общественное беспокойство о атомной энергии"
 JAP_anxiety_nuclear_power_desc: "Шок от аварии на Фукусиме-1 распространил страх и недоверие к атомной энергетике по всему обществу. Общественное сопротивление и процедурные задержки тормозят новое строительство, а политические волнения продолжаются."
 JAP_shut_down_nuclear_plants: "Закрыть все АЭС"
 JAP_shut_down_nuclear_plants_desc: "Приняв решение закрыть атомные станции, правительство напрямую ответило на страхи общества. Сопротивление остаётся, но решение широко воспринимается как приоритет безопасности, и социальное напряжение постепенно спадает."
 JAP_nuclear_strict_examination: "Ужесточение ядерных стандартов"
 JAP_nuclear_strict_examination_desc: "В ответ на аварию регулирование и проверки были радикально усилены. Новые станции и перезапуски теперь требуют дополнительных мер и долгих процедур, что замедляет развитие атомной энергетики и снижает её способность работать на прежних мощностях."
 JAP_continue_nuclear_plants: "Сохранить атомную энергетику"
 JAP_continue_nuclear_plants_desc: "Правительство решило сохранить атомную энергию, но память об аварии остаётся живой. Недоверие и протесты по поводу безопасности продолжаются, подпитывая политические конфликты и подрывая внутреннюю стабильность."
 JAP_crown_centered: "Возрождение кроноцентрической идеологии"
 JAP_crown_centered_desc: "После слов премьер-министра Мори традиционалистская и монархическая риторика начала набирать силу в некоторых кругах. Поскольку правительство показало готовность использовать этот тренд, движение, стремящееся переоценить Императорский двор как центральный принцип государства, начало приобретать ограниченное, но растущее политическое влияние."
 JAP_monarchist_modifier: "Императорская власть"
 JAP_monarchist_modifier_desc: "Трон вернулся к управлению, и государство теперь движется императорским мандатом, а не партийными торгами. Ведомства, силовые органы и промышленность выровнены под единую доктрину, которая видит Императора источником легитимности и курса."
 JAP_airforce_modifier: "[JAP_airforce_name]"
 JAP_article9_modifier: "Статья 9"
 JAP_defense_industry: "Оборонная сеть «Кёдо»"
 JAP_defense_industry_2: "Оборонная сеть «Кёдо»"
 JAP_landforce_modifier: "[JAP_landforces_name]"
 JAP_navy_modifier: "[JAP_navy_name]"
 JAP_navy_modifier_2: "[JAP_navy_name]"
 JAP_japanese_tech_agency_tt: "[JAP_defense_technology_idea_desc]\n"
 JAP_military_decision_category: "[JAP.GetAdjectiveCap] Военные"
 JAP_consolidate_national_defense_framework_mission: "Укрепить структуру национальной обороны"
 JAP_consolidate_national_defense_framework_mission_desc: "Переход к более широкому оборонному положению создал неопределённость в командных структурах, процессах планирования и юридической ответственности. Консолидируя национальную оборонную систему, Япония постепенно восстанавливает согласованность и снижает нарушения, вызванные реформой."
 JAP_modernize_joint_command_mission: "Модернизировать структуры совместного командования"
 JAP_modernize_joint_command_mission_desc: "Интеграция земли, моря, воздуха и новых областей в единую систему совместного командования требует времени, обучения и организационных изменений. По мере того как новые процедуры испытываются и совершенствуются, трения постепенно уменьшаются, а эффективность вооружённых сил Японии улучшается."
 JAP_asteroid_mining_light_operation: "Лёгкая небесная разведка"
 JAP_asteroid_mining_light_operation_desc: "Япония проводит маломасштабное исследование астероидов, призывая руководство предков, пока зонды ищут полезные руды на небесах."
 JAP_asteroid_mining_medium_operation: "Средняя миссия по божественному извлечению"
 JAP_asteroid_mining_medium_operation_desc: "Большая экспедиция отправляется глубже в пояс астероидов, черпая вдохновение из мифической символики, пока Япония ищет ценные внеземные металлы."
 JAP_asteroid_mining_heavy_operation: "Тяжёлая небесная горная экспедиция"
 JAP_asteroid_mining_heavy_operation_desc: "Запускается полномасштабная добыча астероидов, эхом отзывающаяся рассказами о небесных кузницах, когда Япония стремится добыть богатые небесные ресурсы."
 JAP_mars_mission_program_mission: "Основана колония на Марсе"
 JAP_restore_guarantee: "Требовать восстановления гарантий безопасности США"
 JAP_restore_guarantee_desc: "С ростом региональной напряжённости и сомнениями в нашей долгосрочной безопасности некоторые в правительстве считают, что нам нужно добиваться обновлённых и явных гарантий безопасности от США. Это, вероятно, потребует политических уступок по оборонной политике и толкованию Статьи 9, но может стать ценой за стратегическую стабильность."
 JAP_remove_american_blockade: "Требовать прекращения американского морского давления"
 JAP_remove_american_blockade_desc: "Усиленное присутствие ВМС США вокруг наших ключевых морских путей вызывает напряжённость дома и за рубежом. Дипломатические каналы остаются открытыми для переговоров о снижении или прекращении этого давления, но Вашингтон почти наверняка потребует более глубоких обязательств по безопасности и дальнейшего смягчения нашей позиции по Статье 9 в ответ."
 JAP_restore_trade_relations: "Стремиться к нормализации торговли с США"
 JAP_restore_trade_relations_desc: "Тарифы и целевые торговые меры, введённые США, наносят ущерб нашим экспортёрам и подрывают доверие в альянсе. Вступив в прямой диалог с Вашингтоном, мы можем нормализовать экономические отношения, но любое реальное облегчение, скорее всего, будет связано с возобновлённым сотрудничеством в области безопасности и более широким толкованием Статьи 9."
 JAP_chinese_agression_five: "Рост китайской агрессии"
 JAP_chinese_agression_five_desc: "Недавние действия Китая в регионе вызвали обеспокоенность у наших оборонных планировщиков. Хотя ситуация ещё не достигла критического уровня, тенденция очевидна: Пекин постепенно усиливает свою позицию. Политики предупреждают, что Япония должна подготовиться к возможным дальнейшим дестабилизирующим событиям."
 JAP_chinese_agression_ten: "Эскалация китайского давления"
 JAP_chinese_agression_ten_desc: "Китай усилил своё военное и геополитическое давление в регионе. Проникновения патрулей, нарушения воздушного пространства и агрессивная риторика значительно участились. Растущая частота этих инцидентов указывает на намеренную стратегию проверить решимость Японии и изменить региональный баланс."
 JAP_chinese_agression_twelve: "Тревожная китайская активность"
 JAP_chinese_agression_twelve_desc: "Последние действия Пекина отмечены тревожной эскалацией. Разведданные указывают на рост морского развертывания, военные учения у спорных вод и политические послания, направленные прямо на Японию. Ситуация становится всё более нестабильной, и требования сильного национального ответа становятся всё громче."
 JAP_chinese_agression_fourteen: "Серьёзные китайские провокации"
 JAP_chinese_agression_fourteen_desc: "Китай предпринял несколько агрессивных шагов, выходящих за рамки рутинного давления. Стратегические активы развернуты рядом с японской территорией, а вторжения в наши прилегающие воды достигли новой частоты. Оборонные чиновники предупреждают, что Японии может потребоваться пересмотреть элементы своей позиции безопасности."
 JAP_chinese_agression_sixteen: "Опасная китайская эскалация"
 JAP_chinese_agression_sixteen_desc: "Региональная ситуация становится всё более опасной. Военные манёвры Китая теперь выглядят как направленные на прямое запугивание Японии, а каналы пропаганды в Пекине приняли более жёсткий тон. Вероятность кризиса из-за просчёта резко возрастает."
 JAP_chinese_agression_eighteen: "Критическое китайское военное давление"
 JAP_chinese_agression_eighteen_desc: "Агрессивная позиция Китая достигла критической точки. Ключевые морские зоны находятся под постоянным давлением, воздушные нарушения на беспрецедентном уровне, а региональные партнёры бьют тревогу. Политики по всему Токио говорят, что Японии следует пересмотреть свою оборонную стратегию, включая толкование Статьи 9."
 JAP_chinese_agression_twenty: "Серьёзный региональный кризис: пик китайской агрессии"
 JAP_chinese_agression_twenty_desc: "Ситуация превратилась в полномасштабный региональный кризис. Китай развернул обширные военные силы вблизи японской территории, сигнализируя о готовности к дальнейшей эскалации. Угроза национальной безопасности уже не теоретическая, Япония сталкивается с прямым вызовом, который может вынудить принять исторические решения относительно военного статуса и роли Сил самообороны."
 JAP_world_tension_high: "Пересмотреть позицию безопасности"
 JAP_world_tension_high_desc: "Рост глобальной нестабильности требует, чтобы Япония пересмотрела свою оборонную политику и подготовилась к возможным сдвигам в международном порядке."
 JAP_world_tension_high2: "Подготовиться к региональным чрезвычайным ситуациям"
 JAP_world_tension_high2_desc: "Мир становится всё более опасным. Японии необходимо принять конкретные меры для обеспечения национальной безопасности и поддержания стратегической готовности."
 JAP_world_tension_high3: "Активировать меры национальной безопасности"
 JAP_world_tension_high3_desc: "Глобальная напряжённость достигла критического уровня. Японии теперь следует рассмотреть чрезвычайные меры для защиты национальных интересов и поддержания региональной стабильности."
 JAP_article_nine_protests_appeal: "Ответить на протесты за защиту"
 JAP_article_nine_protests_appeal_desc: "Широкие протесты за усиление обороны требуют более мощных военных возможностей и более жёсткой позиции безопасности. Действуя в соответствии с этими призывами и расширяя толкование Статьи 9, правительство может использовать общественное давление для оправдания более решительной национальной оборонной политики."
 JAP_article_nine_protests_appeal_tt: "§YСила протестов§! минимум §R50§!"
 JAP_article_nine_protests_appeal_tt2: "[JAP.GetName] не имеет §YЖелаемого военного закона§!"
 JAP_article_nine_military_parties: "Использовать про-военные партии"
 JAP_article_nine_military_parties_desc: "Про-военные партии внутри правительства продвигают более сильную национальную оборону и более широкое толкование Статьи 9. Согласовавшись с их повесткой, правительство может провести военные реформы и оправдать более высокий уровень боевой готовности."
 JAP_article_nine: "Толкование Статьи 9"
 JAP_article_nine_left_side: "Строгий пацифизм"
 JAP_article_nine_level_one: "Уровень I: пацифистское толкование"
 JAP_article_nine_level_two: "Уровень II: оборонительное толкование"
 JAP_article_nine_level_three: "Уровень III: совместная оборона"
 JAP_article_nine_level_four: "Уровень IV: коллективная самооборона"
 JAP_article_nine_level_five: "Уровень V: расширенная военная роль"
 JAP_article_nine_right_side: "Активная оборона"
 JAP_great_east_japan_earthquake_decision: "Путь к восстановлению"
 JAP_great_east_japan_earthquake_decision_desc: "11 марта 2011 года Великое землетрясение на востоке Японии поразило страну беспрецедентными толчками и цунами, вызвав опустошение, не виданное в современной истории. От Тохоку до Канто огромные регионы были парализованы, нарушены транспортные сети, остановлена экономическая деятельность и подорваны жизни миллионов. Сообщества и отрасли потеряли свои опоры, и страна в целом погрузилась в хаос и неопределённость.\n\nКатастрофа была не только физическим разрушением; она оставила глубокий шрам на национальной психике и заставила общество пересмотреть свои основы. Япония сейчас стоит на распутье, перед лицом огромного вызова восстановления и обновления. Восстановление разрушенных регионов, восстановление отраслей и возвращение жизни и связей людей являются неизбежной обязанностью государства.\n\nЭта работа, известная как «Путь к восстановлению», будет долгой и тяжёлой. Однако только преодолев такие испытания, Япония сможет выстроить новое будущее."
 JAP_tohoku_infrastructure_decision: "Восстановление инфраструктуры Тохоку"
 JAP_tohoku_infrastructure_decision_desc: "Шаг за шагом мы должны восстановить инфраструктуру, разрушенную землетрясением. Восстановление дорог, железных дорог и портов, основ региональных экономик и повседневной жизни, является первым шагом к восстановлению."
 JAP_kanto_infrastructure_decision: "Восстановление инфраструктуры Канто"
 JAP_kanto_infrastructure_decision_desc: "Шаг за шагом мы должны восстановить инфраструктуру, разрушенную землетрясением. Восстановление дорог, железных дорог и портов, основ региональных экономик и повседневной жизни, является первым шагом к восстановлению."
 JAP_tohoku_communication_decision: "Восстановить телекоммуникации в Тохоку"
 JAP_tohoku_communication_decision_desc: "Телекоммуникационная инфраструктура, разрушенная катастрофой, жизненно важна для восстановления и повседневной жизни. Шаг за шагом восстановление должно продолжаться, чтобы снова соединить сообщества и оживить экономику."
 JAP_kanto_communication_decision: "Восстановить телекоммуникации в Канто"
 JAP_kanto_communication_decision_desc: "Телекоммуникационная инфраструктура, разрушенная катастрофой, жизненно важна для восстановления и повседневной жизни. Шаг за шагом восстановление должно продолжаться, чтобы снова соединить сообщества и оживить экономику."
 JAP_tohoku_industrial_recovery_decision: "Возродить промышленность в Тохоку"
 JAP_tohoku_industrial_recovery_decision_desc: "Возрождение местной промышленности, остановленной из-за катастрофы, необходимо для экономического восстановления. Восстановление гражданской промышленности поможет создать рабочие места и укрепить основы производства."
 JAP_kanto_industrial_recovery_decision: "Возродить промышленность в Канто"
 JAP_kanto_industrial_recovery_decision_desc: "Возрождение местной промышленности, остановленной из-за катастрофы, необходимо для экономического восстановления. Восстановление гражданской промышленности поможет создать рабочие места и укрепить основы производства."
 JAP_domestic_policy_decision: "[JAP.GetFlag][JAP.GetAdjective] Внутренняя политика"
 JAP_focus_renewable_energy_decision: "Сосредоточиться на возобновляемой энергии"
 JAP_focus_renewable_energy_decision_desc: "На фоне растущих опасений по поводу безопасности атомной энергии больше инвестиций в солнечную, ветровую и другие возобновляемые источники предлагает путь к диверсификации энергии и снижению зависимости от импортного топлива."
 JAP_focus_thermal_power_decision: "Сосредоточиться на тепловой энергетике"
 JAP_focus_thermal_power_decision_desc: "В условиях опасений по поводу ядерной безопасности расширение угольных, нефтяных и газовых электростанций предоставляет более немедленный и надёжный источник электроэнергии для страны."
 JAP_saudi_aramco_crude_storage: "Хранение нефти Saudi Aramco"
 JAP_saudi_aramco_crude_storage_desc: "Гарантировать выделенное хранение сырой нефти через Saudi Aramco, чтобы стабилизировать поставки и снизить уязвимость перед внезапными рыночными шоками. Закрепляя долгосрочный доступ и предсказуемую доставку, Япония приобретает стратегическое пространство для манёвра."
 JAP_overseas_upstream_equity: "Скупить скважины у истока"
 JAP_overseas_upstream_equity_desc: "Компания INPEX, ведущий геологоразведчик страны, и государственные инвесторы JOGMEC приобретают доли в месторождениях от Абу-Даби до российского Дальнего Востока, защищая страну от капризов спотового рынка. Каждый баррель нефти, добытый на скважине, принадлежащей японской компании, — это баррель, который не сможет удержать ни один конкурент. Собственность — это самый надёжный источник поставок."
 JAP_kosaka_tsl_furnace: "Расширение печи Kosaka TSL"
 JAP_kosaka_tsl_furnace_desc: "Переработка так же стратегична, как и добыча. Мы расширим мощность печи Kosaka TSL, чтобы обрабатывать сложный лом и смешанные концентраты, возвращая критические металлы, которые иначе были бы потеряны."
 JAP_green_ship_recycling: "Экологичная переработка кораблей"
 JAP_green_ship_recycling_desc: "Флот не только строят, но и демонтируют, и сталь должна вернуться в страну. Мы установим стандарты и мощности экологичной переработки кораблей, чтобы безопасно и эффективно извлекать ценные материалы. Каждый выведенный из строя корпус станет ресурсом для следующего."
 JAP_bibi_world_decision: "Развертывание литейного производства Rapidus IIM-1 'Bibi World'"
 JAP_bibi_world_decision_desc: "Ускорить развертывание литейного производства Rapidus IIM-1 'Bibi World', чтобы закрепить на японской земле мощности для полупроводников следующего поколения."
 JAP_yufutsu_oil_expansion_decision: "Расширение нефтяного месторождения Yufutsu"
 JAP_yufutsu_oil_expansion_decision_desc: "Расширить месторождение Yufutsu, чтобы укрепить внутренние поставки и снизить уязвимость перед внешними перебоями."
 JAP_toray_expansion_program_decision: "Программа расширения Toray"
 JAP_toray_expansion_program_decision_desc: "Масштабировать производство передовых материалов Toray, чтобы укрепить промышленную базу Японии там, где это наиболее важно."
 JAP_teijin_aerospace_prepreg_decision: "Препрег для аэрокосмической отрасли Teijin"
 JAP_teijin_aerospace_prepreg_decision_desc: "Расширить мощность Teijin по производству аэрокосмического препрега, чтобы обеспечить композитную основу современных корпусов и высокотехнологичных оборонных систем."
 JAP_demand_south_kuril: "Требовать Южные Курилы"
 JAP_demand_south_kuril_desc: "Токио предъявит формальное требование о возвращении Южных Курил. Москва может уступить, чтобы избежать эскалации, или отказаться и рискнуть кризисом."
 JAP_demand_north_kuril: "Требовать Северные Курилы"
 JAP_demand_north_kuril_desc: "Япония потребует возвращения Северных Курил как часть более широкой программы имперского восстановления. Отказ может быть использован для оправдания дальнейшей эскалации."
 JAP_demand_sakhalin: "Требовать Сахалин"
 JAP_demand_sakhalin_desc: "Япония потребует возвращения Сахалина. Если советское правительство отвергнет требование, Токио столкнётся с выбором между сдержанностью, ограниченным конфликтом или войной."
 JAP_peaceout_russia: "Заключить мир с Россией"
 JAP_peaceout_russia_desc: "Мы добьёмся соглашения с Россией, чтобы закончить войну на наших условиях и закрепить то, что мы захватили. Это политическое решение так же важно, как и военное, фиксируя новую реальность в договорах до того, как Москва успеет перегруппироваться. Если Россия примет, боевые действия прекратятся, и карта изменится навсегда."
 JAP_claiming_south_korea: "Заявить претензию на Корею"
 JAP_claiming_south_korea_desc: "Мы представим Корею как вопрос японской безопасности и исторической прерогативы, превращая неопределённость в явную претензию. Это не жест — это заявление о том, что наш стратегический рубеж не заканчивается на проливе Цусима. После предъявления претензии каждое будущее переговоры начнутся с наших условий."
 JAP_claiming_north_korea: "Определить северный вопрос Кореи"
 JAP_claiming_north_korea_desc: "Режим в Пхеньяне — не сосед, а постоянный кризис, угрожающий нашим морям и городам. Мы формализуем японскую претензию на формирование будущего северного полуострова, рассматривая его как вопрос безопасности, который нельзя оставлять другим. После объявления Север станет проблемой, которую нужно управлять по японским условиям."
 JAP_claiming_taiwan: "Вновь подтвердить наш мандат над Тайванем"
 JAP_claiming_taiwan_desc: "Тайвань находится на стыке первой островной цепи и в горле нашей морской безопасности. Мы вновь подтвердим японский мандат над островом, представляя его статус как стратегическую необходимость, а не предмет решения далеких держав. После объявления Япония будет рассматривать будущее Тайваня как неотделимое от своего собственного."
 JAP_claiming_malaysia: "Заявить претензию на Малаку"
 JAP_claiming_malaysia_desc: "Малака расположена на ключевых проливах и маршрутах снабжения, которые определяют поток торговли и топлива в регионе. Мы предъявим формальную претензию и представим её статус как вопрос японской безопасности и морского порядка. После объявления каждое переговоры начнутся с нашей позиции."
 JAP_claiming_indonesia: "Утвердить мандат на Индонезию"
 JAP_claiming_indonesia_desc: "Индонезия контролирует острова и узкие места, связывающие Индийский и Тихий океаны. Мы утвердим мандат над архипелагом, рассматривая его морские пути и ресурсы как стратегическую необходимость для Японии. Если в регионе должен быть порядок, он будет обеспечен из Токио."
 JAP_claiming_vietnam: "Заявить интерес к Вьетнаму"
 JAP_claiming_vietnam_desc: "Вьетнам закрепляет край Южно-Китайского моря и предлагает базы, способные изменить баланс вдоль всего побережья. Мы объявим японскую претензию на интерес и ясно дадим понять, что его ориентация не будет решаться без нас. Влияние начинается с уверенности, а уверенность начинается с претензии."
 JAP_claiming_cambodia: "Расширить сферу на Камбоджу"
 JAP_claiming_cambodia_desc: "Камбоджа небольшая, но география делает её коридором, буфером и рычагом на материковой Юго-Восточной Азии. Мы расширим нашу претензию и свяжем её будущее с более широкой японской сферой. То, что на карте выглядит незначительным, может решить стабильность региона."
 JAP_claiming_laos: "Заявить претензию на междуречье Меконга"
 JAP_claiming_laos_desc: "Лаос контролирует сухопутные пути, реки и тихую глубину за побережьем. Мы заявим претензию на Меконгское междуречье как часть нашей континентальной безопасности, чтобы соперники не могли использовать его как заднюю дверь в нашу сферу. Контроль — это не только порты, это коридоры."
 JAP_claiming_australia: "Заявить претензию на Австралию"
 JAP_claiming_australia_desc: "Австралия — южный якорь Тихого океана, континент, способный принимать флоты, воздушную мощь и логистику длительной войны. Мы объявим претензию и дадим понять, что южные подходы не останутся вне стратегической досягаемости Японии. Если юг будет обеспечен, океан последует."
 JAP_claiming_new_zealand: "Заявить претензию на южных передовых"
 JAP_claiming_new_zealand_desc: "Новая Зеландия может быть далёкой, но она лежит на маршрутах, которые имеют значение, когда Тихий океан становится оспариваемым. Мы заявим претензию на южных передовых и лишим соперников безопасного тыла за пределами нашей досягаемости. Даже дальние острова становятся оружием, когда ими владеем мы."
 JAP_claiming_myanmar: "Утвердить контроль над Ирравади"
 JAP_claiming_myanmar_desc: "Мьянма — сухопутный мост между океанами и ворота вглубь региона. Мы предъявим претензию и будем рассматривать её порты, коридоры и аэродромы как стратегические активы японской сферы. Кто владеет воротами, решает, кто входит."
 JAP_demand_palau: "Требовать Палау"
 JAP_demand_palau_desc: "Палау — небольшая цепочка с большим влиянием на военно-морское планирование, предлагающая якорные стоянки, наблюдение и досягаемость. Мы потребуем её подчинения японской власти и закрепим её как передовой форпост нашего тихоокеанского порядка. Карта пишется базами, не речами."
 JAP_demand_micronesia: "Требовать Микронезию"
 JAP_demand_micronesia_desc: "Микронезия тянется через центральный Тихий океан как путеводные камни для флотов и самолётов. Мы потребуем контроль, чтобы закрепить маршруты транзита и лишить соперников плацдарма для развертывания. Однажды удержанные, эти острова превращают расстояние в преимущество."
 JAP_demand_nauru: "Требовать Науру"
 JAP_demand_nauru_desc: "Науру крошечная, но такие острова решают обзорность и доступ через широкие воды. Мы потребуем её согласования с Японией и включим её в нашу сеть форпостов. В морскую эпоху нет неважных островов."
 JAP_demand_kiribati: "Требовать Кирибати"
 JAP_demand_kiribati_desc: "Кирибати простирается через ключевые подходы, которые могут поддерживать разведку, дозаправку и перехват. Мы потребуем её подчинения японскому руководству и закрепим острова как звено в нашем более широком периметре. Тихий океан будет упорядочен звеном за звеном."
 JAP_demand_marshall_islands: "Требовать Маршалловы острова"
 JAP_demand_marshall_islands_desc: "Маршалловы острова предоставляют пространство для аэродромов, логистики и контроля над центральными тихоокеанскими маршрутами. Мы потребуем их перехода в японскую сферу и превратим их в укреплённые путевые точки для флота. Кто владеет атоллами, может формировать целый театр."
 JAP_demand_tuvalu: "Требовать Тувалу"
 JAP_demand_tuvalu_desc: "Тувалу предлагает мало земли, но предлагает присутствие, а именно присутствие решает контроль над морем. Мы потребуем согласование Тувалу и закрепим её как прослушивающий пункт и перевал в южном Тихом океане. Даже самые маленькие острова могут закрепить периметр."
 JAP_demand_solomon_islands: "Требовать Соломоновы острова"
 JAP_demand_solomon_islands_desc: "Соломоны — естественный барьер и плацдарм на юго-западе Тихого океана, идеальный для аэродромов и военно-морского прикрытия. Мы потребуем их подчинения Японии и возьмём под контроль маршруты, проходящие через них. Контроль здесь означает контроль над движением."
 JAP_demand_guinea: "Требовать Новую Гвинею"
 JAP_demand_guinea_desc: "Новая Гвинея — континентальный бастион, доминирующий над подходами между Юго-Восточной Азией и Тихим океаном. Мы потребуем её перехода и превратим её в крепость воздушной мощи, логистики и передовой обороны. С Новой Гвинеей под контролем южный театр склоняется к нашей воле."
 JAP_demand_vanuatu: "Требовать Вануату"
 JAP_demand_vanuatu_desc: "Вануату расположено на линиях, имеющих значение для пополнения запасов и проникновения в юго-западный Тихий океан. Мы потребуем её согласование с Японией и интегрируем её в нашу сеть базирования. Цепочка островов становится стеной, когда её удерживают вместе."
 JAP_demand_fiji: "Требовать Фиджи"
 JAP_demand_fiji_desc: "Фиджи — центральный узел в южной части Тихого океана, способный поддерживать флотскую логистику и авиaоперации по широкой дуге. Мы потребуем её подчинения Японии и закрепим её как ключевой элемент нашего южного периметра. Когда Фиджи наше, баланс региона меняется."
 JAP_demand_samoa: "Требовать Самоа"
 JAP_demand_samoa_desc: "Самоа расположено на маршрутах, соединяющих центральный Тихий океан с южными подходами. Мы потребуем согласование Самоа с Японией и интегрируем её порты и аэродромы в наш более широкий периметр. В океанской империи даже далёкие острова становятся решающими."
 JAP_demand_tonga: "Требовать Тонга"
 JAP_demand_tonga_desc: "Тонга предлагает стратегическую опору в южной части Тихого океана и платформу для наблюдения за движением через широкие воды. Мы потребуем её подчинения японскому руководству и закрепим её как часть нашей южной цепочки контроля. Нейтралитет — это роскошь, которую мы не позволим в наших морских путях."
 JAP_demand_american_islands: "Требовать американские острова"
 JAP_demand_american_islands_desc: "Острова, удерживаемые США, — это не просто территория, а передовые базы, проецирующие власть в наш океан. Мы потребуем их перевода или нейтрализации под японским контролем, лишая Вашингтон плацдарма у наших дверей. Если Тихий океан должен быть упорядочен, чужие опоры должны быть устранены."
 JAP_demand_french_islands: "Требовать французские острова"
 JAP_demand_french_islands_desc: "Французские владения на островах дают досягаемость, порты и дипломатическое прикрытие для иностранного присутствия в Тихом океане. Мы потребуем их подчинения Японии и включим их в нашу сеть форпостов и коридоров. Наша сфера не будет прорвана далекими империями."
 JAP_demand_british_islands: "Требовать британские острова"
 JAP_demand_british_islands_desc: "Британские островные владения — остатки старого порядка, но они всё ещё дают базы и влияние на критических маршрутах. Мы потребуем их передачи в японскую сферу и закроем ещё один разрыв в нашем морском периметре. Тихий океан будет организован под одной властью — нашей."
 JAP_imperial_procurement_standardization: "Стандартизация императорских закупок"
 JAP_imperial_procurement_standardization_desc: "Централизовать правила закупок, стандартизировать компоненты и обеспечивать общие спецификации для вооружённых сил. Цель — более быстрый выпуск, простая логистика и меньше узких мест производства."
 JAP_zaibatsu_empowerment_charter: "Хартия расширения возможностей заибатсу"
 JAP_zaibatsu_empowerment_charter_desc: "Предоставить расширенные привилегии выбранным промышленным конгломератам в обмен на обязательные производственные планы, установленные имперским правительством."
 JAP_neighborhood_associations_system: "Система соседских ассоциаций"
 JAP_neighborhood_associations_system_desc: "Восстановить всенациональную сеть местных ассоциаций для регистрации домохозяйств, координации распределения и поддержки быстрого мобилизационного реагирования. Она укрепляет социальный контроль и улучшает оперативность государства."
 JAP_state_rites_restoration: "Восстановление государственных обрядов"
 JAP_state_rites_restoration_desc: "Восстановить государственные церемонии и общественные обряды как центральный столп национальной жизни. Эта реформа укрепляет имперскую легитимность и побуждает общественное согласие с восстановленным порядком."
 JAP_national_morals_education_act: "Закон о национальной морали и образовании"
 JAP_national_morals_education_act_desc: "Стандартизировать гражданское образование вокруг долга, службы и национального единства. Школы будут использоваться для формирования дисциплины, расширения готовности и воспитания лояльности восстановленному государству."
 JAP_imperial_rescript_revival: "Возрождение императорского указа"
 JAP_imperial_rescript_revival_desc: "Возродить официальный императорский указ, чтобы закрепить легитимность государства и определить обязанности граждан. Восстановленный порядок будет представлен как возвращение к единству, долгу и национальной цели."
 JAP_north_korean_remilitarized_dmz: "Отреагировать на эскалацию КНДР на демилитаризованной зоне"
 JAP_north_korean_remilitarized_dmz_desc: "КНДР усилила позиции вдоль демилитаризованной зоны. Токио использует эту эскалацию, чтобы ужесточить позицию безопасности и расширить оперативную свободу в рамках Статьи 9."
 JAP_north_korean_increased_nuclear_testing: "Отреагировать на ядерные испытания КНДР"
 JAP_north_korean_increased_nuclear_testing_desc: "Увеличение темпа ядерных испытаний усилило региональную угрозу. Правительство будет использовать это, чтобы оправдать более жёсткое толкование Статьи 9 и ускорить меры готовности."
 JAP_north_korean_threats_to_south_korea: "Отреагировать на угрозы КНДР"
 JAP_north_korean_threats_to_south_korea_desc: "Прямые угрозы в адрес Республики Корея повышают риск более широкого конфликта, который может распространиться на зону безопасности Японии. Токио может расширить толкование Статьи 9 и усилить планирование сдерживания."
 JAP_north_korean_road_to_war: "Готовиться к маршу КНДР на войну"
 JAP_north_korean_road_to_war_desc: "Ситуация скатывается к открытому конфликту. Япония больше не может рассчитывать только на сдержанность. Пересмотренное толкование Статьи 9 позволит более жёсткое военное планирование и более быстрые варианты ответа."
 JAP_russian_agressiveness: "Отреагировать на агрессивность России"
 JAP_russian_agressiveness_desc: "Всё более напористая позиция России в Северо-Восточной Азии подрывает региональную стабильность. Токио использует усиление угрозы, чтобы укрепить сдерживание и расширить оперативную свободу в рамках Статьи 9."
 JAP_defence_russian_asian_ambitions: "Противостоять азиатским амбициям России"
 JAP_defence_russian_asian_ambitions_desc: "Амбиции Москвы в Азии угрожают безопасности Японии и балансу сил в Тихом океане. Токио ужесточит защитную позицию и расширит оперативные опции в рамках Статьи 9."
 JAP_russian_north_korean_alliance: "Готовиться к оси Россия — Северная Корея"
 JAP_russian_north_korean_alliance_desc: "Более тесное сближение России и Северной Кореи усилит давление на Японию с нескольких направлений. Токио ответит усилением сдерживания и ослаблением оставшихся ограничений по Статье 9."
 JAP_russian_pacific_naval_presence: "Реагировать на наращивание российского военно-морского присутствия в Тихом океане"
 JAP_russian_pacific_naval_presence_desc: "Военно-морская позиция России в Тихом океане становится более напористой. Япония использует это изменение, чтобы оправдать расширение морской готовности и более гибкое толкование Статьи 9."
 JAP_tookover_sikhalin_mission: "Крайний срок для возвращения утраченных территорий"
 JAP_tookover_sikhalin_mission_desc: "Время истекает. Если Россия не успеет выполнить требуемые задачи до срока, международное давление и внутреннее истощение вынудят к урегулированию. Мир будет подписан, и утраченные территории будут уступлены как цена окончания войны."
 JAP_russia_demands_peace_japan: "Мирное соглашение с Россией"
 JAP_russia_demands_peace_japan_desc: "С Курильскими островами и Сахалином теперь прочно под японским контролем, Токио выдвинул предложение закончить войну. Предложение простое и расчётливое: мир в обмен на признание Россией новой реальности на севере. Это не акт милосердия, а стратегическое урегулирование, закрепляющее наши достижения и экономя обеим нациям затраты на затяжной конфликт. Принятие приведёт к концу войны и формализует наш контроль над захваченными территориями. Отказ будет сигналом, что Москва готова продолжать войну, которую она уже не уверена, что сможет выиграть."
 JAP_russia_demands_peace_russia: "Требовать мира с Японией"
 JAP_russia_demands_peace_russia_desc: "Мы потребуем урегулирования с Японией, чтобы положить конец боевым действиям и заморозить ситуацию, прежде чем она ухудшится. Это не примирение, это ограничение ущерба, закрепляющее условия, пока у нас ещё есть рычаги, чтобы навязать исход. Если Токио откажется, мы узнаем, что они ищут победу, а не мира."
 JAP_auto_claiming_tt: "При выборе этого решения процесс будет повторяться до тех пор, пока не будут заявлены все основные государства. После этого вы сможете потребовать подчинения."
 JAP_intellectual_platform_decision: "$JAP_intellectual_platform$"
 JAP_intellectual_platform_decision_desc: "$JAP_intellectual_platform_desc$"
 JAP_declining_birthrate_category: "Агентство мер против снижения рождаемости"
 JAP_declining_birthrate_category_desc: "Демографический кризис в Японии многогранен: рождаемость отстает от смертности, доля пенсионеров ежегодно растет, а трудоспособное население сокращается, не в состоянии самовоспроизводиться. Без скоординированных действий это напряжение распространяется на предложение рабочей силы, платежеспособность пенсионных фондов, стабильность государства и экономическую жизнеспособность сельских префектур. Единого быстрого решения нет, есть только устойчивые, всеобъемлющие реформы, охватывающие множество областей политики.\n\nПредлагаемые здесь решения разработаны для работы в тандеме с демографическими направлениями. Каждое из них направлено на одно или несколько измерений кризиса (дефицит рождаемости, нехватка рабочей силы, порог безработицы, бремя расходов на здравоохранение, бремя социальных расходов или подрыв стабильности), и каждое решение автоматически прекращает свое действие после улучшения целевого состояния, предотвращая чрезмерное использование какого-либо отдельного рычага.\n\n§YПрогресс виден в §!§G$JAP_demographic_pressure_modifier$§!§Y Национальный дух: по мере завершения демографических исследований и принятия соответствующих решений, штрафные санкции, налагаемые модификатором, постепенно снижаются, приближаясь к нулю. Длительное пренебрежение позволяет давлению сохраняться или усиливаться, подрывая стабильность и экономический потенциал.§!"
 JAP_territorial_disputes: "[JAP.GetNameWithFlag] — территориальные споры"
 JAP_territorial_disputes_desc: "[JAP.GetName] в настоящее время ведет территориальные споры с соседними странами в отношении следующих трех регионов:\n\n§YСеверные территории (Южные Курильские острова)§!: [JAP.GetName] предъявляет претензии на острова Эторофу, Кунашири, Шикотан и группу островов Хабомай, расположенные к северо-востоку от Хоккайдо, утверждая, что их оккупация Советским Союзом после Второй мировой войны была незаконной, и продолжает добиваться их возвращения от [SOV.GetName]. [SOV.GetName], с другой стороны, заявляет о своём суверенитете над этими островами и осуществляет над ними фактический контроль.\n\n§YТакэсима ([KOR.GetAdjective] название: Докдо)§!: Этот остров, расположенный в море [JAP.GetName] (Восточное море), на который претендует [JAP.GetName], с 1950-х годов находится под фактическим контролем [KOR.GetName]. Этот спор по-прежнему остаётся крайне спорным вопросом между двумя странами, затрагивающим исторические интерпретации и права на рыболовство, и считается политически чувствительным.\n§YПоскольку Такэсима слишком мала, чтобы быть отображённой на карте, даже успешные переговоры не приведут к территориальным приобретениям. Однако вы всё равно сможете получить описанные ниже модификаторы!§!\n\n§YОстрова Сенкаку (китайское название: острова Дяоюй)§!: Эта группа необитаемых островков в Восточно-Китайском море находится под фактическим контролем [JAP.GetName] с 1895 года, но на них также претендуют [CHI.GetName] и [TAI.GetName]. С 1990-х годов повторяющиеся дипломатические протесты и противоречивые заявления превратили этот вопрос в потенциальную горячую точку для будущих напряжений.\n\nВсе эти споры тесно переплетены с историей, международным правом, фактическим контролем, дипломатическими отношениями и внутренним общественным мнением. Для их урегулирования необходимо укреплять связи и взаимное понимание с вовлечёнными странами.\n\n§YПодсказка: Повышение уровня поддержки со стороны целевой страны или усиление вашего влияния на неё увеличит шансы на успех переговоров!§!\n\n§YНаграда:§! Если переговоры увенчаются успехом, вы сможете получить модификаторы к §G$MODIFIER_STABILITY_FACTOR$§! и §G$agriculture_district_income_tax_modifier$§!!"
 JAP_territorial_disputes_TT: "Если переговоры увенчаются успехом, помимо разрешения территориального вопроса, вы можете получить бонусы к §G$MODIFIER_STABILITY_FACTOR$§! и §G$agriculture_district_income_tax_modifier$§!!"
 JAP_dec_negotiations_resolve_northern_territories_dispute: "Переговоры по Северным территориям"
 JAP_dec_negotiations_resolve_northern_territories_dispute_desc: "Вопрос о Северных территориях остаётся одним из наиболее значимых нерешённых вопросов в послевоенной дипломатии [JAP.GetName]-[SOV.GetName]. Принятие этого вопроса напрямую и поиск мирного решения критически важны для восстановления суверенитета [JAP.GetName] и обеспечения стабильности на Дальнем Востоке. Если будет установлено достаточное взаимное доверие и условия для переговоров, мы сможем начать формальные дипломатические переговоры с [SOV.GetName] о возвращении территорий."
 JAP_dec_negotiations_resolve_senkaku_dispute_china: "Переговоры по спору о Сэнкаку с [CHI.GetName]"
 JAP_dec_negotiations_resolve_senkaku_dispute_china_desc: "Территориальные притязания [CHI.GetName] на острова Сэнкаку стали дестабилизирующим фактором в отношениях [JAP.GetName]-[CHI.GetName]. Как сторона, осуществляющая фактический контроль над островами, [JAP.GetName] стремится решить этот вопрос дипломатически, убедив [CHI.GetName] отказаться от претензий. При наличии необходимого взаимного доверия и международного влияния мы теперь готовы начать прямые переговоры с [CHI.GetName]."
 JAP_dec_negotiations_resolve_senkaku_dispute_taiwan: "Переговоры по спору о Сэнкаку с [TAI.GetName]"
 JAP_dec_negotiations_resolve_senkaku_dispute_taiwan_desc: "Территориальные претензии [TAI.GetName] на острова Сэнкаку стали потенциальным препятствием для взаимного доверия и сотрудничества между [JAP.GetName] и [TAI.GetName]. Чтобы получить дипломатическое признание фактического контроля [JAP.GetName] над островами, мы теперь готовы вступить в мирные переговоры с [TAI.GetAdjective] властями."
 JAP_dec_negotiations_resolve_takeshima_dispute: "Переговоры по спору о Такэсиме"
 JAP_dec_negotiations_resolve_takeshima_dispute_desc: "Территориальный спор с [KOR.GetName] по поводу Такэсимы долгое время был серьёзным препятствием в отношениях [JAP.GetName]-[KOR.GetName]. Наша нация готова формально предложить территориальные переговоры [KOR.GetAdjective] правительству, стремясь разрешить его путём спокойной и искренней дипломатии."
 JAP_base_okinawa_decision: "Будущее войск США на Окинаве"
 JAP_base_okinawa_decision_desc: "Окинава остаётся домом для значительного числа военных баз США, что влияет как на систему безопасности Японии, так и на местные сообщества.\nЯпонское правительство сейчас изучает способы пересмотра текущей договорённости в стремлении к большей автономии в области безопасности и снижению регионального бремени.\nЧерез дипломатические контакты может быть найден новый баланс в американо-японских отношениях безопасности.\n\nПодсказка: §Yвлияние [JAP.GetName] на [USA.GetName]§! и §Yвлияние [USA.GetName] на [JAP.GetName]§! влияют на шанс успеха переговоров. Кроме того, вы можете повысить вероятность успеха, §Yразрешив вопрос о балансе сил по Статье 9§! или §Yповысив военные расходы до как минимум $defence_04$§!!"
 JAP_negotiation_base_okinawa: "Начать переговоры о выводе войск США из Окинавы"
 JAP_negotiation_base_okinawa_desc: "Чтобы усилить национальную автономию в области безопасности, Япония начнёт дипломатические переговоры о выводе военнослужащих США, дислоцированных на Окинаве. Этот шаг направлен на пересмотр текущих соглашений о безопасности и изучение более адаптивной схемы в свете меняющейся региональной динамики."
 Japan.101.t: "Ликвидация почтовой службы: проверка нашего мандата на практике"
 Japan.101.d: "Дебаты о приватизации почтовой службы столкнулись с сильным сопротивлением в Диете, и обсуждения становятся всё более напряжёнными. Даже внутри партии сохраняются осторожные и противоположные голоса: одни считают, что следует действовать через корректировки и поправки, другие настаивают, что сейчас время прояснить вопрос и обратиться к суждению общества.\nЕсли мы распустим Палату представителей и проведём всеобщие выборы, мы поставим реформу на прямую проверку. В то же время политический календарь быстро сместится в сторону выборов, и повышенная политическая напряжённость станет неизбежной.\n\nСтоит ли нам приступить к роспуску и общему голосованию?"
 Japan.101.a: "Распустить Палату представителей."
 Japan.101.b: "Не распускать."
 Japan.103.t: "Рост левых сил"
 Japan.103.d: "На фоне экономического застоя, нестабильности занятости и растущей обеспокоенности социальной защитой интерес к левым силам, призывающим к расширению перераспределения и поддержке средств к существованию, быстро растёт. Как вместилище недовольства устоявшейся политикой, поддержка распространяется по разным регионам, и опросы общественного мнения также начали показывать заметный рост левых партий. В предстоящей политической ситуации присутствие левых, вероятно, станет невозможно игнорировать."
 Japan.103.a: "Поток на помощь либеральным силам"
 Japan.103.b: "Рост социал-демократических сил"
 Japan.103.c: "Расширение присутствия коммунистических сил"
 Japan.103.e: "Быстрый рост левых популистских сил"
 Japan.104.t: "Рост правых сил"
 Japan.104.d: "На фоне растущей тревоги по поводу ситуации в области безопасности и растущего недоверия к политике поддержка распространится на правые силы, призывающие к поддержанию порядка, национальной самодостаточности и акценту на традиционных ценностях. Эти позиции привлекают интерес широкой аудитории избирателей, и опросы общественного мнения также начали показывать заметный рост правых партий. В предстоящей политической ситуации присутствие правых может усилиться ещё больше."
 Japan.104.a: "Расширенная поддержка консервативных сил"
 Japan.104.b: "Рост социал-демократических сил"
 Japan.104.c: "Рост реформаторско-консервативных сил"
 Japan.104.e: "Расширенная поддержка сил, ориентированных на реставрацию"
 JAP_diplomacy.01.t: "Начало переговоров по выводу войск США из Окинавы"
 JAP_diplomacy.01.d: "Десятилетиями присутствие войск США в Японии было краеугольным камнем послевоенной системы безопасности и региональной стабильности. Однако с учётом меняющихся геополитических условий, сдвигов общественного мнения и растущего интереса Японии к усилению собственных оборонных возможностей правительство решило, что необходимо пересмотреть военное присутствие США на Окинаве. Как первый шаг теперь начнутся формальные переговоры с Соединёнными Штатами."
 JAP_diplomacy.01.a: "Начать дипломатические переговоры"
 JAP_diplomacy.02.t: "Японский запрос на переговоры по выводу войск"
 JAP_diplomacy.02.d: "Японское правительство направило формальный запрос на вступление в переговоры о выводе войск США, дислоцированных на Окинаве. Предложение носит не антагонистический характер, а скорее представлено как часть более широкой переоценки оборонной позиции Японии и меняющихся потребностей безопасности. Соединённым Штатам теперь предстоит решить, как ответить, балансируя между целостностью альянса и долгосрочными стратегическими интересами в регионе."
 JAP_diplomacy.02.a: "Принять запрос"
 JAP_diplomacy.02.b: "Отклонить запрос"
 JAP_diplomacy.03.t: "Достигнуто соглашение: войска США выводятся"
 JAP_diplomacy.03.d: "После серии дипломатических обсуждений Япония и Соединённые Штаты достигли соглашения о выводе войск из Окинавы. Это знаменует ключевой момент в эволюции оборонной политики Японии и подчёркивает её стремление взять на себя большую ответственность за собственную безопасность. Хотя это означает конец существующей схемы, это также предоставляет возможность переосмысления американо-японских отношений в сфере безопасности и изучения новых форм сотрудничества в будущем."
 JAP_diplomacy.03.a: "Начинается новая глава в политике безопасности"
 JAP_diplomacy.04.t: "Переговоры провалены: вывод отклонён"
 JAP_diplomacy.04.d: "Правительство США отвергло запрос Японии на вывод войск из Окинавы. В результате действующее соглашение останется в силе. Этот исход может вызвать смешанную реакцию внутри Японии и потенциально усилить дебаты о её автономии в оборонных вопросах. Японскому правительству теперь необходимо переосмыслить свой подход, продолжая следить за общей региональной и внутренней ситуацией."
 JAP_diplomacy.04.a: "Время обдумать следующий шаг"
 JAP_diplomacy.05.t: "К будущему через единое наследие"
 JAP_diplomacy.05.d: "Японское правительство решило предложить создание трёхсторонней интеллектуальной платформы под эгидой ООН, направленной на совместное сохранение памяти и уроков прошлых войн и передачу культуры мира будущим поколениям. Проект будет включать музеи и цифровые архивы, при этом все расходы возьмёт на себя Япония. Предложение будет официально передано Китаю и Южной Корее дипломатическими каналами."
 JAP_diplomacy.05.a: "Отправить предложение"
 JAP_diplomacy.06.t: "Японское предложение: разделить память и будущее"
 JAP_diplomacy.06.d: "Японское правительство предложило под эгидой ООН создать трёхстороннюю интеллектуальную платформу с Китаем и Южной Кореей для сохранения памяти и уроков войны для будущих поколений. Инициатива включает строительство музеев и цифровых архивов, при этом все расходы возьмёт на себя Япония. Выберем ли мы сотрудничество, устремлённое в будущее, или продолжим жить в недоверии? Наше решение определит будущее памяти в Восточной Азии."
 JAP_diplomacy.06.a: "Принять предложение"
 JAP_diplomacy.06.b: "Отклонить предложение"
 JAP_diplomacy.08.t: "Трёхсторонняя интеллектуальная платформа запущена"
 JAP_diplomacy.08.d: "Китай и Южная Корея приняли предложение. Под эгидой ООН трёхсторонняя интеллектуальная платформа была официально запущена. Через совместные музеи и архивы память и уроки войны теперь будут передаваться будущим поколениям. Это может стать значимым шагом на пути к примирению и взаимопониманию."
 JAP_diplomacy.08.a: "Новый шаг к будущему"
 JAP_diplomacy.09.t: "Предложение отклонено"
 JAP_diplomacy.09.d: "К сожалению, наше предложенное интеллектуальное пространство было отклонено. Очевидно, что примирению требуется больше времени и постоянные усилия по наращиванию доверия."
 JAP_diplomacy.09.a: "Нам нужно дождаться другой возможности"
 JAP_news.01.t: "Заявление [JAP.GetLeader]: признание истории"
 JAP_news.01.d: "Сегодня японское правительство опубликовало официальное заявление премьер-министра [JAP.GetLeader], выразив глубокое сожаление и искренние извинения за прошлое колониальное господство и военные действия Японии. В заявлении подчёркнута искренняя приверженность выстраиванию перспективных дипломатических отношений и ответственному сохранению памяти истории. Речь привлекла значительное внимание как внутри страны, так и за рубежом, и, как ожидается, повлияет на будущую дипломатию в Восточной Азии."
 JAP_news.01.a: "Наша ответственность за будущее."
 JAP_news.01.b: "Будем внимательно следить за развитием событий."
 JAP_diplomacy.34.t: "Предложение расширить валютные свопы"
 JAP_diplomacy.34.a: "Принять"
 JAP_diplomacy.34.b: "Отказать на данный момент"
 JAP_diplomacy_34_TT: "§YКаждая страна АСЕАН, которая согласится, получит модификатор стабильности и улучшит §Gотношение§! к нам.§!"
 JAP_diplomacy.35.t: "Достигнуто соглашение о расширении своповой схемы"
 JAP_diplomacy.35.d: "[FROM.GetName] согласилась с предложением Японии о расширении соглашения о валютных свопах. Это еще больше укрепляет «страховочную сеть» ликвидности в кризисные времена, повышая доверие к рынку и эффективность регионального сотрудничества. Это соглашение также является явным шагом к укреплению доверия к Японии в рамках АСЕАН."
 JAP_diplomacy.35.a: "Хорошо."
 JAP_diplomacy.36.t: "Предложение отклонено"
 JAP_diplomacy.36.d: "[FROM.GetName] указала, что отклонит предложение Японии расширить валютную своп-схему. Это отражает предпочтение уделить внимание уточнению условий соглашения и процедур его функционирования, и не является критикой самого предложения. Японии следует учитывать обстоятельства другой страны, продолжая поддерживать каналы для диалога."
 JAP_diplomacy.36.a: "Понятно."
 JAP_diplomacy.37.t: "Предложение инвестировать в ключевую инфраструктуру"
 JAP_diplomacy.37.d: "Чтобы повысить региональную связанность и экономический рост, японское правительство предложило масштабные инвестиции ОДА в нашу страну с фокусом на ключевой инфраструктуре, такой как транспортные сети, порты и энергетика. Улучшение дорог, портов и электросетей укрепит основы логистики и промышленности, напрямую поддерживая рост нашей страны. Принятие предложения также увеличит влияние Японии в рамках АСЕАН.\n\nСтоит ли принять это предложение и ускорить развитие инфраструктуры?"
 JAP_diplomacy.37.a: "Принять"
 JAP_diplomacy.37.b: "Отклонить"
 JAP_diplomacy_37_TT: "§YКаждая страна АСЕАН, которая согласится, получит модификатор скорости строительства инфраструктуры. Мы внесём §R$3,5 млрд§! и получим §G2,5% влияния§! в каждой стране, принявшей предложение.§!"
 JAP_diplomacy.38.t: "Предложение об инвестировании принято"
 JAP_diplomacy.38.d: "[FROM.GetName] приняла предложение Японии об инвестициях ОДА в ключевую инфраструктуру. Продвижение улучшений транспортных сетей, портов и энергетической инфраструктуры повысит региональную связанность и экономический рост, одновременно укрепив наше присутствие. Это соглашение ещё больше укрепит влияние Японии в АСЕАН."
 JAP_diplomacy.38.a: "Хорошо."
 JAP_diplomacy.39.t: "Предложение отклонено"
 JAP_diplomacy.39.d: "[FROM.GetName] указала, что отклонит предложение Японии по инвестициям ОДА в ключевую инфраструктуру. Другая страна, по-видимому, отдаёт приоритет своим внутренним планам и институциональной подготовке, но это не означает, что она отвергает само предложение. Японии следует учитывать обстоятельства другой стороны и оставить пространство для будущего сотрудничества."
 JAP_diplomacy.39.a: "Понятно."
 JAP_diplomacy.40.t: "Предложение о сотрудничестве в области человеческого капитала и исследований"
 JAP_diplomacy.40.a: "Принять"
 JAP_diplomacy.40.b: "Отклонить"
 JAP_diplomacy_40_TT: "§YКаждая страна АСЕАН, которая согласится, получит модификаторы скорости исследований и роста производительности. Мы получим §G2,5% влияния§! в каждой стране, принявшей предложение.§!"
 JAP_diplomacy.41.t: "Предложение о сотрудничестве принято"
 JAP_diplomacy.41.a: "Хорошо."
 JAP_diplomacy.42.t: "Предложение отклонено"
 JAP_diplomacy.42.a: "Понятно."
 JAP_diplomacy.43.t: "Запрос о присоединении к морской системе безопасности Японии"
 JAP_diplomacy.43.d: "Японское правительство представило план запуска нейтральной и мирной морской системы безопасности, направленной на снижение напряжённости в Южно-Китайском море и защиту свободы судоходства, и обратилось к нашей стране с предложением присоединиться к ней. Сотрудничество в обмене информацией, морском поиске и спасении, борьбе с пиратством и совместных учениях поспособствует региональной стабильности и улучшит способности по управлению кризисами. Принятие предложения также увеличит влияние Японии в АСЕАН.\n\nСтоит ли принять это предложение и сотрудничать в рамках японской системы?"
 JAP_diplomacy.43.a: "Принять"
 JAP_diplomacy.43.b: "Отклонить"
 JAP_diplomacy_43_TT: "§YКаждая страна АСЕАН, которая согласится, получит модификатор стабильности. Мы получим §G2,5% влияния§! и улучшим отношения с каждой страной, принявшей предложение.§!"
 JAP_diplomacy.44.t: "Соглашение о присоединении к системе"
 JAP_diplomacy.44.d: "[FROM.GetName] согласилась присоединиться к предложенной Японией нейтральной и мирной морской системе безопасности. По мере продвижения сотрудничества в обмене информацией, морском поиске и спасении, борьбе с пиратством и совместных учениях можно ожидать ощутимого прогресса в региональной стабильности и защите свободы судоходства. Это соглашение укрепит доверие и влияние Японии в АСЕАН."
 JAP_diplomacy.44.a: "Хорошо."
 JAP_diplomacy.45.t: "Предложение об участии отклонено"
 JAP_diplomacy.45.d: "[FROM.GetName] указала, что она отклонит участие в предложенной Японией нейтральной и мирной морской системе безопасности. Похоже, другая страна отдаёт приоритет региональной ситуации и внутренним приоритетам, но это не означает, что она отвергает сами принципы сотрудничества. Японии следует сохранить нейтральную позицию, не обостряя напряжённость, и оставить пространство для диалога и сотрудничества."
 JAP_diplomacy.45.a: "Понятно."
 JAP_diplomacy.46.t: "Запуск совместной образовательной программы Японии и США"
 JAP_diplomacy.46.d: "Японское правительство предложило расширить совместные образовательные программы и студенческие обмены, чтобы углубить взаимопонимание и воспитать следующее поколение. Создавая рамки, в которых обе страны могут учиться друг у друга — дисциплина Японии и предпринимательский дух США — цель состоит в том, чтобы вырастить новое поколение лидеров с международным кругозором. Эта инициатива усилит связи между людьми и ещё больше укрепит доверие в альянсе."
 JAP_diplomacy.46.a: "Инвестиция в будущее."
 JAP_diplomacy.47.t: "Японо-американский обмен технологиями и культурой"
 JAP_diplomacy.47.d: "Японское правительство предложило расширить технологический и культурный обмен, связав японские университетские лаборатории, студии и корпоративные сети с партнёрами в Силиконовой долине, Сиэтле и Лос-Анджелесе. Инженеры, дизайнеры и творцы будут ездить туда и обратно для совместных проектов, стремясь сочетать американский опыт в операциях платформ с японскими сильными сторонами в аппаратном обеспечении, играх и анимации. Если культурная близость и научное сотрудничество продвинутся параллельно, это укрепит как социальную стабильность, так и импульс для инноваций."
 JAP_diplomacy.47.a: "Максимизировать синергию."
 JAP_diplomacy.48.t: "Японо-американское сотрудничество в области технологий двойного назначения"
 JAP_diplomacy.48.d: "Японское правительство предложило ещё больше укрепить сотрудничество США и Японии в областях технологий двойного назначения, которые могут применяться как в гражданских, так и в военных целях. Опираясь на взаимодействие промышленности и академии, план направлен на продвижение совместных исследований, обмен опытом и содействие обмену персоналом, ускоряя НИОКР и стимулируя общее технологическое развитие. Если это партнёрство укоренится, ожидается повышение будущей конкурентоспособности как в гражданском, так и в военном секторе."
 JAP_diplomacy.48.a: "Продвинуть совместные исследования."
 JAP_diplomacy.49.t: "Платформа знаний по готовности к бедствиям Японии и Тайваня"
 JAP_diplomacy.49.a: "Укрепим нашу устойчивость."
 JAP_diplomacy.50.t: "Усиление высокотехнологического партнёрства Японии и Тайваня"
 JAP_diplomacy.50.a: "Ускорим совместные исследования."
 JAP_diplomacy.51.t: "Расширение программ обучения в Японии"
 JAP_diplomacy.51.d: "Японское правительство предложило расширить квоты стипендий и приёмные места, чтобы увеличить возможности для тайваньских студентов обучаться в японских университетах. Эта инициатива направлена не только на углубление академических и культурных связей, но и на подготовку будущих кадров, которые могут связать наши два общества. По мере расширения обменов основа для следующего поколения, которое будет развивать отношения Японии и Тайваня, станет ещё крепче."
 JAP_diplomacy.51.a: "Инвестиция в следующее поколение."
 JAP_diplomacy.52.t: "Предложение о поддержке реформы торговой системы"
 JAP_diplomacy.52.d: "Японское правительство предложило техническое и институциональное сотрудничество для поддержки реформы и модернизации торговой системы Китая. Упрощая таможенные процедуры, цифровизируя административные операции и разрабатывая правила в соответствии с международными стандартами, цель — облегчить торговлю и повысить предсказуемость для бизнеса. Если эти реформы продвинутся, процедурная нагрузка на импорт и экспорт снизится, что уменьшит трение в экономической деятельности. Принятие этого предложения также увеличит влияние Японии в Китае.\n\nСтоит ли принять поддержку Японии и продвигать международную гармонизацию нашей торговой системы?"
 JAP_diplomacy.52.a: "Принять"
 JAP_diplomacy.52.b: "Отклонить"
 JAP_diplomacy_52_TT: "§YЕсли предложение принято, Китай получит модификатор снижения налоговой нагрузки, а мы получим §Gвлияние§! в Китае!§!"
 JAP_diplomacy.53.t: "Предложение о сотрудничестве принято"
 JAP_diplomacy.53.d: "[FROM.GetName] принял предложение Японии о технической и институциональной поддержке в реформировании и модернизации своей торговой системы. По мере упрощения таможенных процедур и совершенствования административных операций будут увеличиваться торговое содействие и предсказуемость для бизнеса, а также улучшится среда для выхода японских компаний на рынок. Это соглашение постепенно укрепит влияние Японии в Китае."
 JAP_diplomacy.53.a: "Хорошо."
 JAP_diplomacy.54.t: "Предложение отклонено"
 JAP_diplomacy.54.d: "[FROM.GetName] указал, что отклонит предложение Японии о предоставлении технической и институциональной поддержки для реформирования и модернизации своей торговой системы. Другая сторона, по-видимому, отдаёт приоритет своим политическим приоритетам и внутренней координации, но это не означает, что она отвергает саму необходимость реформ. Японии следует учитывать обстоятельства другой страны, оставляя место для диалога и сотрудничества."
 JAP_diplomacy.54.a: "Понятно."
 JAP_diplomacy.55.t: "Расширение инвестиционного сотрудничества Японии и Китая"
 JAP_diplomacy.55.d: "Японское правительство выразило намерение продвигать институциональную координацию и рамки сотрудничества для стимулирования взаимных инвестиций и выхода японских и китайских компаний на рынки друг друга. Если поток взаимных вложений ускорится, производственные сети могут быть оптимизированы и цепочки поставок сделаны более эффективными, что ожидается повысит общую промышленную продуктивность. Углубление экономической взаимозависимости также несёт риски, но оно одновременно может послужить практическим фактором стабилизации, снижая трение."
 JAP_diplomacy.55.a: "Откроем рынок и повысим эффективность."
 JAP_diplomacy.56.a: "Углубим культурную солидарность."
 JAP_diplomacy.57.t: "Японо-китайский проект по сохранению буддийских храмов"
 JAP_diplomacy.57.d: "Японское правительство предложило совместный японско-китайский проект по сохранению буддийских храмов как общего культурного наследия путём совместных работ по консервации и реставрации. Обмениваясь методиками реставрации и методами обследования и создавая кооперативную структуру защиты культурных ценностей, цель — подтвердить ценность храмов и связанных культурных активов и обеспечить их долгосрочное сохранение. Если результаты этих работ станут заметны, привлекательность культурного туризма возрастёт, и ожидаются положительные побочные эффекты для местной экономики. Это сотрудничество также может стать возможностью подтвердить исторические связи между нашими двумя странами."
 JAP_diplomacy.57.a: "Защитим наше наследие и продвинем туризм."
 JAP_diplomacy.58.t: "Токио-Сеул Акцелератор"
 JAP_diplomacy.58.d: "Японское правительство предложило создать совместную программу акселератора в Токио и Сеуле, институционализируя поддержку стартапов в обеих странах. Через помощь с привлечением средств, наставничество, сотрудничество с компаниями и университетами, а также обмен талантами между двумя городами цель — повысить вероятность успеха стартапов и укрепить технологическое сотрудничество. Если эта структура будет работать как задумано, инновации между городами ускорятся, а экономическое сотрудничество Японии и Кореи укрепится более практичным, ориентированным на результат способом."
 JAP_diplomacy.58.a: "Ускорим стартап-импульс."
 JAP_diplomacy.59.t: "Расширение регионального сотрудничества Японии и Кореи"
 JAP_diplomacy.59.a: "Дадим рост регионам."
 JAP_diplomacy.60.t: "Предложение по культурному обмену Япония — Корея"
 JAP_diplomacy.60.d: "Японское правительство предложило системно расширить культурный обмен между Японией и Южной Кореей. Через средства массовой информации, искусство, спорт, туризм и образовательные обмены цель — углубить взаимопонимание наших народов и сократить социальную дистанцию. Если обмены расширятся, они также повлияют на общественные настроения и внешнее отношение, и обе страны получат среду, в которой смогут эффективнее говорить в рамках внутренней политики друг друга.\n\nПринять ли это предложение и продвигать культурный обмен?"
 JAP_diplomacy.60.a: "Принять"
 JAP_diplomacy.60.b: "Отклонить"
 JAP_diplomacy_60_TT: "§YЕсли предложение принято, мы получим §Gвлияние§! в Корее, но Корея тоже получит §Rвлияние§! в Японии.§!"
 JAP_diplomacy_60_TT2: "§YКультурный обмен позволит нам усилить влияние в Японии, но влияние Японии внутри страны тоже возрастёт.§!"
 JAP_diplomacy.61.t: "Предложение принято"
 JAP_diplomacy.61.d: "[FROM.GetName] согласилась с предложением Японии расширить культурный обмен. По мере расширения обменов в СМИ, искусстве, спорте, туризме и образовании взаимопонимание будет углубляться, и в обеих странах могут последовать изменения общественных настроений. Через это соглашение Япония получит более сильный голос в Корее, а Корея также укрепит своё влияние в Японии."
 JAP_diplomacy.61.a: "Хорошо."
 JAP_diplomacy.62.t: "Предложение отклонено"
 JAP_diplomacy.62.d: "[FROM.GetName] указала, что отклонит предложение Японии расширить культурный обмен. Другая сторона, похоже, отдаёт приоритет учёту общественного мнения и внутренним обстоятельствам, но это не означает, что она отвергает сам культурный обмен. Японии следует сохранить каналы для диалога, оставляя пространство для продвижения взаимопонимания другими способами."
 JAP_diplomacy.62.a: "Понятно."
 JAP_diplomacy.63.t: "Японо-корейская рабочая группа по стареющему обществу"
 JAP_diplomacy.63.d: "Японское правительство предложило создать совместную рабочую группу экспертов и профильных учреждений из Японии и Южной Кореи для решения общей проблемы стареющего общества с ежемесячными консультациями по выработке совместных политик. Обмениваясь опытом по укреплению систем ухода за пожилыми, здравоохранения, поддержки занятости и проектирования общественного благополучия, цель — повысить скорость и эффективность политических мер. Если эта структура укоренится, это будет способствовать усилению социальных гарантий и долгосрочной социальной стабильности."
 JAP_diplomacy.63.a: "Движемся вперёд вместе."
 JAP_diplomacy_63_TT: "§YЮжная Корея получит модификатор роста населения.§!"
 JAP_diplomacy.64.t: "Сотрудничество в развитии холодных регионов"
 JAP_diplomacy.64.d: "Правительство Японии предложило «Инициативу для Дальнего Востока» для поддержки развития регионов с холодным климатом на российском Дальнем Востоке, опираясь на опыт Хоккайдо в возрождении таких регионов посредством инвестиций в инфраструктуру и привлечения иностранного капитала. Цель инициативы — стимулирование региональной экономической активности и повышение эффективности развития за счёт фундаментальных улучшений в транспорте, логистике и энергетике. Инициатива направлена на развитие инфраструктуры в Саха и Камчатке."
 JAP_diplomacy.64.a: "Укрепим основы Дальнего Востока."
 JAP_diplomacy.65.t: "Сахалин II"
 JAP_diplomacy.65.d: "Японское правительство заявило о намерении усилить иностранные инвестиции в энергетический проект «Сахалин II» при сотрудничестве с Россией, чтобы обеспечить стабильный доступ к ископаемым видам топлива. Если инвестиции и стабилизация операций продвинутся, непрерывность разработки улучшится, и можно ожидать расширения производственных мощностей. Сахалин останется важным узлом поставок и, вероятно, принесёт положительные эффекты региональной экономике."
 JAP_diplomacy.65.a: "Расширим производственные мощности."
 JAP_diplomacy.66.t: "Запуск сотрудничества по евразийской транспортной сети"
 JAP_diplomacy.66.d: "Японское правительство заявило о намерении продвинуть сотрудничество Японии и России для развития сухопутного логистического коридора, связывающего Японию и Европу через Россию. Используя железные дороги и магистрали, цель — сократить время перевозок и обеспечить стабильный доступ к европейским рынкам, а также ускорить модернизацию инфраструктуры вдоль коридора. Если грузопоток начнёт действовать на практике, Россия усилит своё значение евразийского узла, а экономическая связность углубится."
 JAP_diplomacy.66.a: "Ускорим развитие коридора."
 JAP_diplomacy.67.t: "Запуск сотрудничества Японии и России в IT-инфраструктуре"
 JAP_diplomacy.67.d: "Правительство Японии представило инициативу «Российский цифровой коридор», в рамках которой совместно с японскими IT-компаниями ведется работа по развитию инфраструктуры в России, такой как центры обработки данных и волоконно-оптические сети. Цель состоит в модернизации внутренней коммуникационной инфраструктуры и укреплении роли России как центра в цифровой торговой сети, связывающей Европу, Центральную Азию и Россию. Если это сотрудничество будет налажено, улучшится стабильность информационных потоков и пропускная способность сетей, а также ускорится цифровизация экономической деятельности."
 JAP_diplomacy.67.a: "Расширим инфраструктуру связности."
 JAP_historical.20110311.t: "Великое восточно-японское землетрясение"
 JAP_historical.20110311.d: "11 марта 2011 года в 14:46 сильнейшее землетрясение магнитудой 9.0 произошло у берегов Тохоку в Тихом океане. Сильнейший толчок, когда-либо зарегистрированный в Японии, сотряс обширные территории от Тохоку до Канто, а громадное цунами, последовавшее за ним, смыло прибрежные города и посёлки, оставив за собой катастрофические разрушения. Порты и рыбацкие поселения были уничтожены за мгновения, а дороги, железные дороги и аэропорты были разорваны, погрузив городские функции в хаос.\n\nСотни тысяч людей лишились жилья и искали убежище в пунктах эвакуации. Экономический ущерб колоссален: сельское хозяйство, рыболовство и промышленность, опора региональной экономики, получили сокрушительные разрушения. Одновременно задачи восстановления инфраструктуры, помощи переселенцам и восстановления отраслей и городов поставят административные возможности правительства на предельное испытание.\n\nНесмотря на эту беспрецедентную трагедию, японский народ показал стойкость и солидарность. Однако то, насколько быстро и эффективно правительство сможет отреагировать, определит стабильность и будущее нации."
 JAP_historical.20110311.a: "Мы должны мобилизовать все силы на спасение и восстановление."
 JAP_great_east_japan_earthquake_tree_tt: "§YОткрыто национальное дерево фокусов восстановления после Великого восточно-японского землетрясения!§!"
 JAP_news.02.t: "Беспрецедентное землетрясение поражает Японию"
 JAP_news.02.d: "11 марта 2011 года Японию поразило мощное землетрясение. Позднее известное как Великое восточно-японское землетрясение, это подводное землетрясение магнитудой 9.0 у побережья Тохоку вызвало катастрофические разрушения на широкой территории, приведя к десяткам тысяч погибших или пропавших без вести и нанеся неизмеримый экономический ущерб.\n\nПоследовавшее цунами смыло прибрежные города, порты и транспортные сети за считанные минуты, вынудив сотни тысяч людей эвакуироваться в укрытия. Японское общество теперь сталкивается со своим величайшим кризисом со времени послевоенной эпохи.\n\nВеликое восточно-японское землетрясение стало определяющим моментом, и весь мир наблюдает, как одна из ведущих экономик мира будет добиваться своего восстановления."
 JAP_news.02.a: "Ужасная трагедия..."
 Japan.201103111.t: "Объявление о завершении восстановления"
 Japan.201103111.d: "Прошли годы с момента великой катастрофы, завалы убраны, и города снова наполнены жизнью своих жителей. Жизни пострадавших постепенно стабилизировались, а отрасли и инфраструктура восстановлены. Сегодня правительство официально объявляет «Восстановление завершено», закрывая главу долгого периода лишений.\n\nХотя трагедия оставила глубокие шрамы, она также воспитывала стойкость и гордость, заложив основу для более светлого будущего."
 Japan.201103111.a: "Мы преодолели невзгоды!"
 Japan.201103112.t: "Прогресс в восстановлении инфраструктуры"
 Japan.201103112.d: "Часть инфраструктуры, уничтоженной катастрофой, теперь восстановлена. Транспорт и логистика постепенно возобновляются, принося небольшие, но значимые изменения в повседневную жизнь. Хотя полное восстановление ещё далеко, это ясный шаг вперёд."
 Japan.201103112.a: "Шаг вперёд."
 Japan.201103113.t: "Полное восстановление инфраструктуры"
 Japan.201103113.d: "Инфраструктура в Тохоку, разрушенная землетрясением, наконец достигла целевого уровня восстановления. Транспортные сети и логистические функции снова полностью работают, давая новый импульс местному обществу и экономике. Реконструкция достигла важной вехи."
 Japan.201103113.a: "Важная веха."
 Japan.201103114.t: "Прогресс в восстановлении инфраструктуры"
 Japan.201103114.d: "Часть инфраструктуры, уничтоженной катастрофой, теперь восстановлена. Транспорт и логистика постепенно возобновляются, принося небольшие, но значимые изменения в повседневную жизнь. Хотя полное восстановление ещё далеко, это ясный шаг вперёд."
 Japan.201103114.a: "Шаг вперёд."
 Japan.201103115.t: "Полное восстановление инфраструктуры"
 Japan.201103115.d: "Инфраструктура в Канто, разрушенная землетрясением, наконец достигла целевого уровня восстановления. Транспортные сети и логистические функции снова полностью работают, давая новый импульс местному обществу и экономике. Реконструкция достигла важной вехи."
 Japan.201103115.a: "Важная веха."
 Japan.201103116.t: "Телекоммуникации восстановлены"
 Japan.201103116.d: "Телекоммуникационная сеть в пострадавшем регионе наконец частично восстановлена. Связь для повседневной жизни и бизнеса улучшилась, принося новую надежду местной экономике и обществу."
 Japan.201103116.a: "Продолжим дальнейшее восстановление"
 Japan.201103117.t: "Телекоммуникации полностью восстановлены"
 Japan.201103117.d: "Телекоммуникационная инфраструктура в Тохоку, разрушенная землетрясением, наконец достигла целевого уровня восстановления. Когда основа для повседневной жизни и промышленности обеспечена, путь восстановления достигает важной вехи."
 Japan.201103117.a: "Отметим это как шаг вперёд"
 Japan.201103118.t: "Телекоммуникации полностью восстановлены"
 Japan.201103118.d: "Телекоммуникационная инфраструктура в Канто, разрушенная землетрясением, наконец достигла целевого уровня восстановления. Когда основа для повседневной жизни и промышленности обеспечена, путь восстановления достигает важной вехи."
 Japan.201103118.a: "Отметим это как шаг вперёд"
 Japan.201103119.t: "Возобновление местной промышленности"
 Japan.201103119.d: "Фабрики и предприятия в пострадавшем регионе возобновили работу. Хотя полное восстановление ещё далеко, возвращение рабочих мест и экономической активности даёт ощутимое ощущение прогресса."
 Japan.201103119.a: "Продолжить промышленное восстановление"
 Japan.2011031110.t: "Промышленная база полностью восстановлена"
 Japan.2011031110.d: "Промышленная база в Тохоку, разрушенная землетрясением, наконец достигла целевого уровня восстановления. С восстановленной занятостью и производственными мощностями путь реконструкции достиг важной вехи."
 Japan.2011031110.a: "Перейти к следующему этапу восстановления"
 Japan.2011031111.t: "Возобновление местной промышленности"
 Japan.2011031111.d: "Фабрики и предприятия в пострадавшем регионе возобновили работу. Хотя полное восстановление ещё далеко, возвращение рабочих мест и экономической активности даёт ощутимое ощущение прогресса."
 Japan.2011031111.a: "Продолжить промышленное восстановление"
 Japan.2011031112.t: "Промышленная база полностью восстановлена"
 Japan.2011031112.d: "Промышленная база в Канто, разрушенная землетрясением, наконец достигла целевого уровня восстановления. С восстановленной занятостью и производственными мощностями путь реконструкции достиг важной вехи."
 Japan.2011031112.a: "Перейти к следующему этапу восстановления"
 Japan.2011031150.t: "Авария на АЭС «Фукусима-1»"
 Japan.2011031150.d: "Японию поразило беспрецедентное землетрясение и цунами, и пока страна борется с последствиями, поступило ещё одно худшее сообщение. Цунами обрушилось на АЭС «Фукусима-1» в префектуре Фукусима, вызвав отказ аварийных генераторов, батарей и топливных баков и приведя к полной потере питания на объекте.\nКроме того, внутри зданий реакторов образовалось и накопилось большое количество водорода, что привело к взрывам в блоках 1, 3 и 4. Существуют опасения утечек радиоактивных материалов из повреждённых участков, и население впало в панику."
 Japan.2011031150.a: "Мы должны действовать немедленно!"
 JAP_news.03.t: "Авария на АЭС «Фукусима-1»"
 JAP_news.03.d: "После землетрясения и цунами в Японии поступило сообщение о серьёзной аварии на АЭС «Фукусима-1». Хотя реакторы остановились после толчка, цунами, как сообщается, вывело из строя аварийные генераторы и другое критически важное оборудование, что привело к полной потере питания. Охлаждение больше невозможно поддерживать, и в нескольких блоках произошли расплавы активной зоны.\nГенерация и накопление водорода также вызвали взрывы в зданиях реакторов, и высока вероятность выброса радиоактивных материалов в окружающую среду через повреждённые участки. Японское правительство старается справиться с ситуацией."
 JAP_news.03.a: "Какая ситуация..."
 Japan.2011031151.t: "Ядерная политика Японии на распутье"
 Japan.2011031151.d: "Прошел месяц после ядерной аварии, и японское правительство теперь вынуждено принять решение. Авария на «Фукусиме-1» поколебала общественное чувство ядерной безопасности до его основы. Общественное мнение разделено, деловое сообщество боится влияния на энергоснабжение, а граждане тревожатся о возможности радиационного выброса.\n\nЯпонии теперь нужно ясно определить, продолжит ли она полагаться на ядерную энергию или выберет другой путь."
 Japan.2011031151.a: "Запретить это, закрыть!"
 Japan.2011031151.b: "Нужно ввести строгие проверки."
 Japan.2011031151.c: "Продолжать как раньше!"
 JAP_territorial.01.t: "Начать переговоры по Северным территориям"
 JAP_territorial.01.d: "Территориальный спор по Северным территориям долгое время оставался нерешённым вопросом между [JAP.GetName] и [SOV.GetName] со времён окончания войны. Сейчас наша страна готова официально запросить переговоры с [SOV.GetName] для мирного урегулирования этого вопроса. Это не просто дипломатическая формальность, а важный шаг в утверждении нашего суверенитета и исторической правоты."
 JAP_territorial.01.oA: "Начнём!"
 JAP_territorial.02.t: "[JAP.GetName] запрашивает переговоры по Северным территориям"
 JAP_territorial.02.d: "Правительство [JAP.GetAdjective] направило официальный запрос об открытии переговоров по Северным территориям. Этот вопрос откладывался десятилетиями, и принятые решения повлияют как на наш международный авторитет, так и на внутреннюю политику. Будет ли компромисс означать утрату национальных интересов или приобретение международного доверия? Пришло время выбрать."
 JAP_territorial.02.oA: "Передать территорию [JAP.GetName]"
 JAP_territorial.02.oB: "Отказать. Здесь не может быть переговоров"
 JAP_territorial.03.t: "Согласие на возвращение Северных территорий"
 JAP_territorial.03.d: "Наконец-то давний вопрос Северных территорий решён. После переговоров с [SOV.GetName] достигнуто соглашение о возвращении спорных территорий. Это дипломатическая победа и историческое достижение в послевоенной истории [JAP.GetAdjective]."
 JAP_territorial.03.oA: "Историческое соглашение!"
 JAP_territorial.04.t: "Переговоры по Северным территориям зашли в тупик"
 JAP_territorial.04.d: "Правительство [SOV.GetAdjective] официально отвергло наше предложение о переговорах по возвращению Северных территорий. Несмотря на наши дипломатические усилия, соглашение не было достигнуто. Теперь нам нужно сосредоточиться на укреплении доверия и расширении влияния, чтобы подготовиться к возобновлению переговоров в будущем."
 JAP_territorial.04.oA: "В этот раз ещё слишком рано..."
 JAP_territorial.05.t: "Начать переговоры по Сэнкаку с [CHI.GetName]"
 JAP_territorial.05.d: "[JAP.GetName] в настоящее время фактически контролирует острова Сэнкаку, но [CHI.GetName] продолжает заявлять о своей суверенной претензии. Учитывая прошлые дипломатические усилия, настало время нашей стране официально вступить в переговоры с [CHI.GetAdjective] правительством в поисках мирного разрешения."
 JAP_territorial.05.oA: "Начнём!"
 JAP_territorial.06.t: "[JAP.GetName] предлагает территориальные переговоры"
 JAP_territorial.06.d: "Правительство [JAP.GetAdjective] попросило нас отказаться от нашей территориальной претензии на острова Сэнкаку. Они выступают за мирное урегулирование и региональную стабильность, и продвигают переговоры при поддержке дипломатического давления и международной поддержки. Принятие этого предложения наверняка вызовет как поддержку, так и сопротивление внутри страны и за рубежом."
 JAP_territorial.06.oA: "Откажемся от претензии и поставим стабильность региона выше."
 JAP_territorial.06.oB: "Сохраним претензию и защитим национальный суверенитет."
 JAP_territorial.07.t: "[CHI.GetName] отзывает претензию на Сэнкаку!"
 JAP_territorial.07.d: "[CHI.GetName] официально отозвало территориальную претензию на острова Сэнкаку. Долгие напряжённости в Восточно-Китайском море существенно уменьшились, и это воспринято как важная дипломатическая победа как внутри страны, так и за рубежом. Это важный первый шаг к региональной стабильности и укреплению доверия."
 JAP_territorial.07.oA: "Исторический прорыв."
 JAP_territorial.08.t: "[CHI.GetName] сохраняет претензию"
 JAP_territorial.08.d: "[CHI.GetName] объявило, что сохранит свою территориальную претензию на острова Сэнкаку. Переговоры завершились безуспешно, что подчеркнуло необходимость дальнейшего укрепления отношений и расширения международного влияния. Хотя диалог остаётся возможным, ситуация по-прежнему остаётся сложной."
 JAP_territorial.08.oA: "Возможно, пока слишком рано..."
 JAP_territorial.09.t: "Начать переговоры по Сэнкаку с [TAI.GetName]"
 JAP_territorial.09.d: "[TAI.GetName] давно заявляет о суверенитете над островами Сэнкаку на исторических и географических основаниях, в то время как [JAP.GetName] отстаивает легитимность своего фактического контроля. В попытке мирно разрешить этот давний вопрос мы представим официальное дипломатическое предложение [TAI.GetName]."
 JAP_territorial.09.oA: "Начнём!"
 JAP_territorial.10.t: "[JAP.GetName] предлагает территориальные переговоры"
 JAP_territorial.10.d: "Правительство [JAP.GetAdjective] попросило нас отказаться от претензии на острова Сэнкаку. Учитывая сложность отношений через пролив и более широкий международный контекст, для решения о принятии этого запроса потребуется осторожное взвешивание."
 JAP_territorial.10.oA: "Откажемся от претензии ради региональной стабильности."
 JAP_territorial.10.oB: "Мы должны продолжать отстаивать свой суверенитет."
 JAP_territorial.11.t: "[TAI.GetName] отзывает претензию на Сенкаку!"
 JAP_territorial.11.d: "Власти [TAI.GetAdjective] официально отозвали свою территориальную претензию на острова Сэнкаку. С разрешением одного из давних вопросов Восточно-Китайского моря отношения [JAP.GetName]-[TAI.GetName] входят в новую эпоху стабильности, вызывая надежду на более глубокое сотрудничество в будущем."
 JAP_territorial.11.oA: "Историческое соглашение."
 JAP_territorial.12.t: "[TAI.GetName] отказывается отзывать претензию"
 JAP_territorial.12.d: "[TAI.GetName] объявил, что сохранит свою территориальную претензию на острова Сэнкаку. Переговоры закончились неудачей, ясно показав, что для разрешения вопроса потребуется больше дипломатического влияния и сильное взаимное доверие."
 JAP_territorial.12.oA: "Может быть, пока слишком рано..."
 JAP_territorial.13.t: "Начать переговоры по Такэсиме с [KOR.GetName]"
 JAP_territorial.13.d: "Чтобы положить конец давнему территориальному спору по Такэсиме между [JAP.GetName] и [KOR.GetName], наше правительство предложило мирные переговоры с [KOR.GetName]. Вместо того чтобы навязывать нашу претензию в одностороннем порядке, этот шаг направлен на построение ориентированных на будущее отношений между двумя странами."
 JAP_territorial.13.oA: "Начнём!"
 JAP_territorial.14.t: "[JAP.GetName] предлагает переговоры о Докдо"
 JAP_territorial.14.d: "Правительство [JAP.GetAdjective] обратилось к нам для переговоров о суверенитете Докдо. Это крайне сложное решение с учётом общественного мнения и исторического контекста, но также важная дипломатическая оценка, которая может определить будущее отношений [JAP.GetName]-[KOR.GetName]."
 JAP_territorial.14.oA: "Приоритет улучшению отношений с [JAP.GetName] и принятие передачи."
 JAP_territorial.14.oB: "Мы не можем отказаться от нашей национальной территории."
 JAP_territorial.15.t: "[KOR.GetName] соглашается вернуть Такэсиму!"
 JAP_territorial.15.d: "В рамках усилий по улучшению отношений [JAP.GetName]-[KOR.GetName] правительство [KOR.GetAdjective] согласилось вернуть Такэсиму. Это означает конец многолетнего противостояния и открывает новую фазу доверия между двумя странами. Это момент, когда мирные дипломатические усилия принесли плоды."
 JAP_territorial.15.oA: "Историческое достижение."
 JAP_territorial.16.t: "[KOR.GetName] отклоняет переговоры по Такэсиме"
 JAP_territorial.16.d: "Правительство [KOR.GetAdjective] отклонило наш запрос о возвращении Такэсима. Решение территориального вопроса остаётся трудным, и без более сильного дипломатического влияния и взаимного доверия его будет трудно закрыть."
 JAP_territorial.16.oA: "Пока что мы должны продолжать диалог."
 JAP_renegotiation_territory: "Повторные переговоры будут возможны через год!"
 JAP_historical.20010426.t: "Йоширо Мори уходит в отставку, Дзюнитиро Коидзуми становится премьер-министром"
 JAP_historical.20010426.oA: "Реформа — немедленно!"
 JAP_historical.20060926.t: "Продолжение или преемственность?"
 JAP_historical.20060926.oA: "Дзюнитиро Коидзуми"
 JAP_historical.20060926.oB: "Синдзо Абэ"
 JAP_historical.20070926.t: "Сохранение или обновление?"
 JAP_historical.20070926.oA: "Синдзо Абэ"
 JAP_historical.20070926.oB: "Ясуо Фукуда"
 JAP_historical.20080924.t: "Тихий переход или смелый поворот?"
 JAP_historical.20080924.oA: "Ясуо Фукуда"
 JAP_historical.20080924.oB: "Таро Асо"
 Japan.01.t: "Подход традиционалистских сил"
 Japan.01.d: "По мере того как разгорается спор вокруг высказываний премьер-министра Мори, разные группы и комментаторы, утверждающие, что Императорский дом следует заново рассматривать как центр государственного порядка Японии, активизировали свою деятельность. Они обратились к правительству, заявив, что если оно яснее продемонстрирует готовность отстаивать традиции и национальный характер, они могут поддержать его, формируя общественное мнение и мобилизуя активистов снизу.\n\nОднако более тесные связи с такими силами грозят размыть границу между консервативной установкой истеблишмента и радикальным монархизмом, потенциально вызывая новую волну критики в адрес кабинета. Стоит ли воспользоваться этим предложением или держаться в стороне?"
 Japan.01.a: "Держаться в стороне."
 Japan.01.b: "Использовать их как политический рычаг."
 JAP_koizumi_appear_TT: "Мори может наслаждаться раундом гольфа, но его политическое влияние, вероятно, значительно ослабнет. Партия может скоро начать искать §Yнового лидера.§!"
 JAP_historical.20030926.t: "Слияние ДПЯ–ЛП, Либеральная партия присоединяется к Демократической партии"
 JAP_historical.20030926.d: "Движения по консолидации несистемных сил ускоряются. После повторных переговоров Демократическая партия и Либеральная партия договорились объединить главное политическое средство несистемного лагеря в единую организацию.\n\nЛиберальная партия распустится и войдёт в состав Демократической партии в форме поглощения. Это увеличит присутствие несистемного лагеря в Диете, но также может породить новые очаги напряжения, поскольку партии начнут бороться за направление политики и лидерство."
 JAP_historical.20030926.a: "Реорганизация несистемного лагеря уже началась."
 JAP_historical.20070307.t: "Тайна коммунальных расходов"
 JAP_historical.20070307.d: "В марте 2007 года на заседании бюджетного комитета Палаты советников стало известно, что политическая организация, финансирующая министра сельского хозяйства, лесного хозяйства и рыболовства Тосикацу Мацуоку, «Политический и экономический форум нового века Тосикацу Мацуоки», в своих отчетах о финансировании политической деятельности указала общие расходы на коммунальные услуги в размере приблизительно 28,8 миллионов иен за пять лет, с 2001 по 2005 год.\n\nОсобое внимание привлекло то, что «главный офис» организации располагался в здании офисов членов Палаты представителей, где вода, электричество и кондиционирование воздуха предоставляются бесплатно.\nМинистр Мацуока пояснил, что расходы включали в себя затраты на «ионизатор воды» и «электрическое отопление», но не смог дать четкого обоснования указанным суммам. На последующих заседаниях парламента он также отказался вдаваться в подробности, заявив: «В рамках этой системы никаких дополнительных объяснений не требуется».\n\nОппозиционные партии резко раскритиковали ситуацию, назвав ее потенциальным «ложным заявлением» и «злоупотреблением системой», в то время как общественное недоверие к подотчетности правительства в целом росло."
 JAP_historical.20070307.oA: "Требовать от министра полного публичного объяснения"
 JAP_historical.20070307.oB: "Защищать его до завершения расследования"
 JAP_historical.20070528.t: "Непосильное бремя"
 JAP_historical.20070528.d: "Министр сельского хозяйства, лесного хозяйства и рыболовства Тосикацу Мацуока был найден мертвым, повесившись, в своей парламентской резиденции в Акасаке, Токио. Позже полиция подтвердила, что это было самоубийство.\n\nВ течение нескольких месяцев министр Мацуока подвергался пристальному вниманию в парламенте, СМИ и общественном мнении из-за высоких расходов на коммунальные услуги, отраженных в его отчетах о финансировании политических кампаний.\n\nЭта новость потрясла общественность и вызвала более глубокие вопросы: «Был ли он единственным, кто должен был понести ответственность?» и «Была ли реакция правительства действительно адекватной?»"
 JAP_historical.20070528.oA: "Какая трагедия..."
 JAP_historical.20070801.t: "Цепочка скандалов: бремя ответственности"
 JAP_historical.20070801.d: "После смерти министра сельского хозяйства, лесного хозяйства и рыболовства Тосикацу Мацуока его преемником стал Норихико Акаги. Однако всего через два месяца Акаги был фактически вынужден уйти в отставку после того, как в его отчёте о политическом фонде были подняты несколько вопросов, включая расходы на офис, обработку пожертвований и двойное отражение квитанций его политической группы «Токюкай».\n\nС двумя подряд министрами сельского хозяйства, оказавшимися в центре скандалов за такой короткий срок, серьёзные вопросы возникли в отношении ответственности, прозрачности и надёжности назначений в кабинете. Должность министра сельского хозяйства стала считаться «проклятой», и администрация теперь находится под давлением, чтобы принять решительные меры для восстановления доверия и стабилизации руководства."
 JAP_historical.20070801.oA: "Почему это постоянно происходит? Мы должны вернуть доверие людей."
 JAP_historical.20070704.t: "Фатальная оплошность"
 JAP_historical.20070704.d: "Во время публичной лекции министр обороны Фумио Кюма сделал спорное заявление, что атомные бомбардировки Хиросимы и Нагасаки были «неизбежны».\nКомментарий был широко истолкован как оправдание бомбардировок, вызвав мощную реакцию со стороны групп выживших после атомных бомбардировок и общественности. Критика прозвучала как от правящих, так и от оппозиционных партийных законодателей, а также от местных властей. Премьер-министр Абэ официально выразил ему выговор.\nПосле этого местные лидеры и гражданские группы устроили сидячие протесты в пострадавших городах, обострив конфликт до полного политического кризиса. В итоге Кюма подал в отставку с поста министра обороны, а его сменщицей стала Юрико Коике.\n\nТо, что начиналось как «простая ошибка одного министра», превратилось в серьёзное испытание способности правительства управлять и сохранить международную репутацию."
 JAP_historical.20070704.oA: "Как правительство, мы должны выразить искреннее и глубокое сожаление."
 JAP_historical.20090808.t: "Создание Вашей партии"
 JAP_historical.20090808.d: "По мере роста ожиданий смены правительства сохраняется сильное недовольство медлительностью в принятии решений существующими партиями и негибкостью администрации. В этой атмосфере Ёсими Ватанабэ и другие выдвинули на первый план «реформы» и призвали к формированию новой политической силы, которая не будет опираться на существующую структуру.\n\nТаким образом, было объявлено о создании вашей партии. Это движение, выступающее за административную реформу и дерегулирование, расширит выбор избирателей, одновременно ускоряя перестройку и маневрирование внутри японской политики."
 JAP_historical.20090808.a: "Под знаменем реформ новая сила начинает движение."
 JAP_historical.20120928.t: "Создание Партии японских инноваций"
 JAP_historical.20120928.d: "По мере распространения недоверия к существующим партиям и недовольства политической стагнацией реформистское движение, основанное на региональной партии «Ассоциация восстановления Осаки», которая расширяла свое влияние в Осаке, начало двигаться в сторону национальной политики. Это течение, усилившее свое присутствие в региональной политике благодаря отстаиванию пересмотра местной администрации и реформы управления, должно было реорганизоваться в общенациональную политическую силу и привлечь внимание как альтернатива существующим партиям.\n\nСоздание Японской инновационной партии ознаменовало не только рождение новой партии, но и событие, которое еще больше ускорило перегруппировку оппозиции и формирование «третьей силы»."
 JAP_historical.20120928.a: "Новая реформаторская сила выходит на национальную арену."
 JAP_historical.20141128.t: "Роспуск Вашей партии"
 JAP_historical.20141128.d: "Ваша партия, успевшая заявить о себе как «третья сила», противостоящая существующим крупным партиям, всё больше испытывала трудности с поддержанием внутрипартийного единства по мере того, как разногласия в отношении управления партией и реакции на выборы постепенно углублялись.\n\nВ конце концов партия решила распустить себя, а её сопричастные депутаты разошлись по разным направлениям. Рассеивание силы, собравшейся под знаменем реформ, снова подчёркивает изменчивую природу перестройки оппозиции и, вероятно, не останется без значительного влияния на будущую политическую карту."
 JAP_historical.20141128.a: "Одна опора третьей силы закрывается."
 JAP_historical.20170925.t: "Перегруппировка оппозиции: раскол между Хоупом и конституционными демократами."
 JAP_historical.20170925.d: "Несистемные силы входят в важную фазу перестройки. Новая партия «Надежда» быстро привлекла внимание как новый реформаторский проект на фоне недовольства существующими партиями и ощущения политического застоя. Для некоторых элементов устоявшегося несистемного лагеря слияние и сотрудничество выглядели как шанс восстановить силу, но одновременно постепенно начали проявляться конфликты по направлениям политики и условиям объединения.\nСилы, корни которых уходили в бывшую Демократическую партию, не объединились в единый блок: одни слились или сотрудничали с партией «Надежда», другие сформировали Конституционно-демократическую партию и взяли независимую линию. Перестройка продвигалась, но одновременно стало яснее разделение, и структура несистемных сил была радикально перерисована."
 JAP_historical.20170925.a: "Несистемный лагерь разделился между «Надеждой» и Конституционными демократами."
 JAP_historical.20170925_TT: "§YДемократическая партия будет заменена Конституционной демократической партией!§!"
 JAP_historical.20180507.t: "Перегруппировка оппозиции: формирование Демократической партии для народа."
 JAP_historical.20180507.d: "Оппозиционные силы, реорганизованные после раскола между партией «Надежда» и Конституционно-демократической партией, продолжили дальнейшее перетасовывание. Часть бывшего лагеря Демократической партии и часть лагеря «Надежды», сохраняя точки разногласий, стремились объединиться в новую центристскую силу, а партия «Надежда» постепенно теряла вес как самостоятельная структура.\nСо временем была сформирована Демократическая партия за народ. Это также ознаменовало создание нового политического проекта, выступающего за центристскую линию, отличную от Конституционно-демократической партии, и структура оппозиции продолжит меняться."
 JAP_historical.20180507.a: "Перестройка продолжается, и облик оппозиции постоянно меняется."
 JAP_historical.20180507_TT: "§YПартия «Надежда» будет заменена Демократической партией за народ!§!"
 JAP_historical.20190401.t: "Создание Рэйва Синсэнгуми"
 JAP_historical.20190401.d: "На фоне нарастающего недоверия к существующим партиям и недовольства по поводу неуверенности в средствах к существованию Таро Ямамото и другие начали создание новой политической силы. Подчёркивая народную поддержку, не зависящую от крупных организаций, и выступая за выведение на национальную политику голосов, которые существующий политический порядок не может полностью услышать, это движение можно рассматривать как силу, ставящую в центр повседневные запросы, включая поддержку домохозяйств, расширение системы социальной защиты и пересмотр нагрузки, включая налог на потребление.\n\nСоздание Рэйва Синсэнгуми расширяет спектр вариантов внутри оппозиционных сил и одновременно становится событием, вновь подчёркивающим изменчивость политической перестройки."
 JAP_historical.20190401.a: "Новая сила снизу заявляет о выходе на национальную политику."
 JAP_historical.20220710.t: "Восхождение Сансэйто"
 JAP_historical.20220710.d: "На фоне растущего недоверия к существующим партиям и ощущения отчужденности от политического участия, Сансейто, новая политическая сила, расширившая свою поддержку за счет деятельности на местах и распространения информации, начала проявлять себя на национальной политической арене. Благодаря созданию местных организаций и собственным уникальным призывам, она все больше привлекает внимание как инструмент для привлечения тех сегментов населения, которые основные партии ранее не могли полностью охватить.\n\nПодчеркивая свою дистанцию от устоявшихся партий, «Сансейто» расширяется как новая партия, придающая большое значение участию и влиянию своих членов и сторонников. Ее позиция, выдвигающая на первый план такие вопросы, как образование, продовольствие, социальные системы и осознание суверенитета, привлекает поддержку, а также потенциально может стать фактором, способным изменить существующую партийную структуру и систему приоритетов.\n\nРост этой новой силы — это изменение, которое существующие партии не могут игнорировать, и оно также может повлиять на будущие перегруппировки оппозиции и консерваторов, а также на формирование политической повестки дня."
 JAP_historical.20220710.a: "Новая зарождающаяся сила укрепляет своё присутствие в политике."
