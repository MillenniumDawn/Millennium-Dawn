 ALG_oil_focused_energy_rich: "Nation riche en pétrole"
 ALG_oil_focused_energy_rich_desc: "L'Algérie a décidé d'exploiter ses ressources pétrolières inexploitées pour devenir autosuffisante en énergie. Bon marché et facilement accessible, le pétrole n'est toutefois pas l'approche la plus respectueuse de l'environnement."
 ALG_oil_focused_energy_rich_tt: "Revenu supplémentaire : 0,100 $ !"
 ALG_renewable_focused_energy: "Nation naissante des énergies renouvelables"
 ALG_renewable_focused_energy_desc: "L'Algérie a décidé d'exploiter son fort potentiel d'énergies renouvelables. Coûteuse et de faible densité énergétique, cette voie aidera néanmoins l'environnement."
 ALG_renewable_focused_energy_self_sufficient: "Nation autonome en énergies renouvelables"
 ALG_renewable_focused_energy_self_sufficient_desc: "L'Algérie a décidé d'exploiter son fort potentiel d'énergies renouvelables. Coûteuse et de faible densité énergétique, cette voie aidera néanmoins l'environnement."
 ALG_renewable_focused_energy_small_profit: "Nation rentable en énergies renouvelables"
