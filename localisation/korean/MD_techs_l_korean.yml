 tech_light_guns_4: "함포 2045"
 tech_light_guns_4_desc: "소구경과 대구경을 아우르는 함상 무기 체계로, 수상 표적과 항공 표적 모두와 교전할 수 있도록 설계되었습니다."
 module_naval_submarine_drone_control: "자율 잠수함 통제"
 module_naval_submarine_drone_control_desc: "자율 통제 체계는 일상적인 항법, 센서 관리, 위치 유지를 탑재 의사결정 체계에 맡겨 잠수함 운용의 승조원 부담을 줄여 줍니다.\n\n§G설계 힌트: 자율 통제는 인력 요구량을 대폭 줄이는 동시에 센서, 무기, 방호력, 속력을 전반적으로 향상시킵니다. 승조원이 적은 첨단 전투함에 적합하지만 IC와 마이크로칩 비용이 높습니다.§!"
 module_naval_patrol_boat_drone_control: "자율 경비정 통제"
 module_naval_patrol_boat_drone_control_desc: "자율 통제 체계는 일상적인 항법, 위치 유지, 센서 관리를 탑재 의사결정 논리와 원격 감독으로 처리하여 경비정이 더 적은 승조원으로 운용될 수 있게 합니다.\n\n§G설계 힌트: 자율 통제는 인력 요구량을 대폭 줄이는 동시에 센서, 무기, 방호력, 속력을 전반적으로 향상시킵니다. 승조원이 적은 첨단 전투함에 적합하지만 IC와 마이크로칩 비용이 높습니다.§!"
 module_naval_corvette_drone_control: "자율 초계함 통제"
 module_naval_corvette_drone_control_desc: "자율 통제 체계는 일상적인 항법, 센서 관리, 피해 통제 보조를 자동화하고 필요 시 원격 감독을 가능하게 하여 초계함이 더 적은 승조원으로 운용될 수 있게 합니다.\n\n§G설계 힌트: 자율 통제는 인력 요구량을 대폭 줄이는 동시에 센서, 무기, 방호력, 속력을 전반적으로 향상시킵니다. 승조원이 적은 첨단 전투함에 적합하지만 IC와 마이크로칩 비용이 높습니다.§!"
 tech_tank_nuclear_engine_1: "핵 전차 엔진 II"
 tech_tank_nuclear_engine_1_desc: "초기 핵 추진 개념은 사실상 무제한의 작전 행동 반경과 기갑 부대의 재래식 연료 병참 부담의 대폭적인 감소를 약속합니다. 그 대가는 극심한 복잡성, 무거운 차폐 요구, 막대한 생산 및 유지 비용이며, 이로 인해 엔진은 표준 부품이 아닌 전략 자산이 됩니다."
 tech_tank_nuclear_engine_2: "핵 전차 엔진 III"
 tech_tank_nuclear_engine_2_desc: "원자로 소형화의 개선과 더 안전한 격납 기술로 원자력 추진 기갑 차량은 야전에서 더욱 실용적이 되며, 중량급 플랫폼의 신뢰성과 출력이 향상됩니다. 여전히 엄청나게 비싸고 자원을 많이 소모하지만, 이러한 엔진은 기갑전을 규정하던 연료 제약 없이 지속적인 고속 작전을 가능하게 합니다."
 tech_tank_hover_suspension_1: "APC 호버 서스펜션 II"
 tech_tank_hover_suspension_1_desc: "초기 호버 서스펜션은 궤도를 양력 모듈로 대체하여 APC가 험지, 진흙, 얕은 물 위를 저항을 줄이고 더 빠른 야지 기동으로 활주할 수 있게 합니다. 이 시스템은 기동성과 승차 안정성을 향상시키지만 생산 비용이 증가하고 기존 주행 장치보다 더 많은 전력과 정비를 요구합니다."
 tech_tank_hover_suspension_2: "APC 호버 서스펜션 III"
 tech_tank_hover_suspension_2_desc: "개선된 양력 제어와 전력 효율 덕분에 호버 APC는 다양한 지형에서 더 신뢰할 수 있게 되며, 신호 급증이 줄고 고속에서의 조종성이 향상됩니다. 개선된 스커트와 안정화 장치가 먼지와 파편 문제를 제한하여, 부대가 압박 속에서도 더 빠르고 예측 가능하게 움직일 수 있습니다."
 tech_tank_hover_suspension_3: "APC 호버 서스펜션 IV"
 tech_tank_hover_suspension_3_desc: "차세대 호버 서스펜션은 고급 지형 감지 장치와 자동 균형 보정 장치를 통합하여, 시가지의 잡다한 장애물과 파괴된 지형에서도 조종 손실을 최소화하며 고속 기동할 수 있게 합니다. 더 강한 내구성과 더 똑똑한 에너지 관리 덕분에 호버 APC는 지속적인 작전 기동성을 얻지만, 이 기술은 여전히 비싸고 자원 소모가 많습니다."
 SOV_tech_landing_craft_1: "폴노츠니급 "
 SOV_tech_landing_craft_2: "로푸차급"
 SOV_tech_landing_craft_3: "주브르급 공기부양정(LCAC)"
 SOV_tech_landing_craft_4: "이반 그렌급 "
 nsb_light_nose_gun_tech_4: "최신예 기수 장착 화기"
 nsb_light_nose_gun_tech_4_desc: "전자기 방식의 기수 장착 레일건은 헬리콥터에 극도로 빠른 포구 속도와 높은 장갑 관통력을 지닌 직사 무기를 부여합니다. 경차량, 방어 시설, 저공비행 표적을 상대로 한 짧고 격렬한 교전에 탁월하지만, 막대한 전력과 견고한 냉각 장치를 필요로 합니다."
 nsb_light_nose_gun_tech_5: "초첨단 기수 장착 화기"
 nsb_light_nose_gun_tech_5_desc: "개선된 축전기, 향상된 포신 소재, 더욱 긴밀한 사격 통제 통합 덕분에 심각한 마모 없이 연속 점사가 가능해졌습니다. 이 첨단 레일건 기수 화기는 반동 부담을 줄이면서 명중률과 신뢰성을 높여, 헬리콥터를 정밀하고 살상력 높은 사격 플랫폼으로 탈바꿈시킵니다."
 nsb_light_nose_gun_tech_6: "극초첨단 기수 장착 화기"
 nsb_light_nose_gun_tech_6_desc: "차세대 설계는 전력 효율, 열 안정성, 자동 표적 지정에 중점을 두어, 기동과 전자전 압박 속에서도 레일건 사격이 효과를 유지하도록 합니다. 더 빠른 장전 주기와 더 똑똑한 탄약 처리 덕분에 헬리콥터는 지속 시간을 희생하지 않으면서도 일관되고 파괴적인 직사 화력을 퍼부을 수 있습니다."
 tech_helicopter_hover_engine_1: "호버 엔진 헬리콥터 II"
 tech_helicopter_hover_engine_1_desc: "초기 호버 엔진 통합은 기존의 로터 양력을 소형 추력 편향 장치로 대체하여, 노출된 날개 없이도 안정적인 저고도 비행을 가능하게 합니다. 이 플랫폼은 효율을 일부 희생하는 대신 생존성과 도시 환경에서의 유연성을 얻어, 탐지되기 어렵고 소화기와 파편에 덜 취약합니다."
 tech_helicopter_hover_engine_2: "호버 엔진 헬리콥터 III"
 tech_helicopter_hover_engine_2_desc: "출력 밀도와 제어 소프트웨어가 개선되어 호버 엔진 항공기는 더욱 민첩하고 조용해졌으며 의미 있는 규모의 탑재량을 운반할 수 있게 되었습니다. 향상된 열 관리와 비행 안정성 덕분에 특수 작전, 신속 침투, 분쟁 중인 도시 환경에서의 활용도가 넓어집니다."
 tech_helicopter_hover_engine_3: "호버 엔진 헬리콥터 IV"
 tech_helicopter_hover_engine_3_desc: "고도화된 호버 엔진 설계는 견고한 자동화와 센서 융합을 통해 더 긴 체공 시간, 더 큰 양력 여유, 신뢰성 높은 전천후 조종 성능을 제공합니다. 낮아진 신호 특성과 빠른 가속력으로 이 항공기는 회전익 항공기의 역할을 재정의하며, 기존 헬리콥터라면 지나치게 노출되었을 곳에서 수직 기동을 가능하게 합니다."
 nsb_drone_artillery_ammo_1: "드론 포병 탄약 II"
 nsb_drone_artillery_ammo_1_desc: "초기 드론 보조 포탄은 탑재 유도 장치와 단순한 선회 패턴을 이용해 발사 후 표적으로 수정 비행합니다. 점 표적에 대한 정확도와 효과가 높아지지만, 재래식 포탄에 비해 단가가 상승합니다."
 nsb_drone_artillery_ammo_2: "드론 포병 탄약 III"
 nsb_drone_artillery_ammo_2_desc: "개선된 탐색기와 데이터링크 덕분에 드론 탄약은 비행 중간 갱신과 재표적 지정을 받을 수 있어, 낭비되는 사격을 줄이고 이동 중이거나 시간에 민감한 표적에 대한 즉응 타격을 가능하게 합니다. 더 나은 포장과 추진 방식으로 정밀도를 희생하지 않고 사거리를 늘립니다."
 nsb_drone_artillery_ammo_3: "드론 포병 탄약 IV"
 nsb_drone_artillery_ammo_3_desc: "첨단 드론 포탄은 관측 자산 및 사격 통제망과 연동하여 신속한 표적 인계, 협동 수색, 더 영리한 종말 공격 궤적을 가능하게 합니다. 이로써 포병은 재밍과 대포병 압박 속에서도 표적을 찾아내고, 수정하며, 마무리할 수 있는 정밀 체계로 거듭납니다."
 special_project_tech_smart_grid: "스마트 그리드"
 expanded_infantry_weapons_1_desc: "다양한 역할을 하는 무기를 보병 부대에 추가하면 여러 종류의 적 부대와 싸울 때 더 많은 선택지를 제공할 수 있습니다."
 production_line_improvements_1: "생산 라인 개선 I"
 production_line_improvements_1_desc: "산업 생산 라인에 대한 초기 개선은 비효율 감소, 작업 흐름 조직 개선, 기초적인 자동화 도입에 중점을 둡니다. 이러한 변화는 생산량의 일관성을 높이고 가동 중단 시간을 줄입니다."
 improved_building_constructions_1: "공장 건설 중점 I"
 improved_building_constructions_1_desc: "산업 공장 건설의 초기 개선은 더 나은 사업 계획, 표준화된 설계, 건설 자재의 더 효율적인 사용에 중점을 둡니다."
 tech_rail_guns_5: "레일건 2060"
 tech_rail_guns_5_desc: "함대 방어용 레일건은 대용량 에너지 저장, 급속 재충전 체계, 네트워크화된 표적 데이터를 통합하여 군함이 미사일 일제 사격을 요격하고 대량의 원거리 운동 에너지 타격을 가할 수 있게 합니다."
 tech_rail_guns_6: "레일건 2075"
 tech_rail_guns_6_desc: "미래형 레일건 체계는 적응형 스마트 발사체, AI 보조 교전 통제, 함정 전체의 전력 관리를 사용하여 분쟁 해군 전투 공간 전반에서 신속하고 정밀하며 지속적인 전자기 화력 지원을 제공합니다."
 reactor11: "CFR"
 reactor11_desc: "소형 핵융합로는 고온 초전도 자석을 이용해 이전 토카막의 몇 분의 일 크기에 불과한 용기 안에 플라즈마를 가둘 수 있습니다. 작은 노심은 공장에서 제작해 모듈로 운송하므로, 핵융합 발전소를 수십 년이 아닌 수년 만에 세울 수 있으며 한때 석탄·핵분열 발전소가 있던 부지에도 들어설 수 있습니다."
 reactor12: "무중성자 핵융합"
 reactor12_desc: "무중성자 반응로는 수소와 붕소-11을 융합해 에너지의 거의 전부를 중성자가 아닌 하전 입자로 방출합니다. 중성자 충돌이 없으므로 반응로 벽은 방사능에서 대체로 자유롭고, 입자는 증기 터빈 없이 곧바로 전기로 변환됩니다. 이 연료는 중수소-삼중수소보다 훨씬 뜨거운 플라즈마가 필요해, 최근 한 세대의 자석·가열 기술이 나오기 전까지는 손이 닿지 않았습니다."
 special_forces_tech_1: "특수 작전군"
 special_forces_tech_1_desc: "특수 작전군은 어느 군대에서든 정예이며, 누구보다 길고 혹독한 훈련을 받습니다. 이들은 험난한 지형, 공수 작전, 상륙 작전의 전문가입니다. 그러나 전선 후방에서 기동성 있게 작전해야 할 수 있으므로 장비는 매우 가볍습니다."
 nsb_SP_arty_5: "자주포 2045"
 nsb_SP_arty_5_desc: "강력한 간접 사격 능력을 갖춘 자주포는 전장에서 필요한 곳에, 시야를 훨씬 넘어선 거리까지 지속적인 정밀 타격을 제공합니다. 승무원이 직접 재장전할 수 있으며, 자체 추진 능력 덕분에 기동성이 높아 적 포병의 대포병 사격을 피해 이동할 수 있습니다."
 nsb_SP_arty_6: "자주포 2055"
 nsb_SP_arty_6_desc: "강력한 간접 사격 능력을 갖춘 자주포는 전장에서 필요한 곳에, 시야를 훨씬 넘어선 거리까지 지속적인 정밀 타격을 제공합니다. 승무원이 직접 재장전할 수 있으며, 자체 추진 능력 덕분에 기동성이 높아 적 포병의 대포병 사격을 피해 이동할 수 있습니다."
 nsb_SP_arty_7: "자주포 2065"
 nsb_SP_arty_7_desc: "강력한 간접 사격 능력을 갖춘 자주포는 전장에서 필요한 곳에, 시야를 훨씬 넘어선 거리까지 지속적인 정밀 타격을 제공합니다. 승무원이 직접 재장전할 수 있으며, 자체 추진 능력 덕분에 기동성이 높아 적 포병의 대포병 사격을 피해 이동할 수 있습니다."
 nsb_SP_arty_8: "자주포 2075"
 nsb_SP_arty_8_desc: "강력한 간접 사격 능력을 갖춘 자주포는 전장에서 필요한 곳에, 시야를 훨씬 넘어선 거리까지 지속적인 정밀 타격을 제공합니다. 승무원이 직접 재장전할 수 있으며, 자체 추진 능력 덕분에 기동성이 높아 적 포병의 대포병 사격을 피해 이동할 수 있습니다."
 AA_upgrade_5: "적응형 IIR 탐색기"
 AA_upgrade_5_desc: "적응형 영상 적외선 탐색기는 디지털 표적 인식과 향상된 대응 수단 배제 능력을 결합하여, 단거리 대공 체계가 항공기와 플레어, 기만체, 드론, 배경 열원을 구별할 수 있게 합니다."
 AA_upgrade_6: "다중 스펙트럼 탐색기 배열"
 AA_upgrade_6_desc: "다중 스펙트럼 탐색기 배열은 여러 적외선 및 광학 대역을 더 빠른 탑재 처리 능력과 결합하여, 무인기, 순항 미사일, 헬리콥터와 같이 작고 빠르거나 지형에 가려진 공중 위협의 추적을 개선합니다."
 AA_upgrade_7: "네트워크 연동 센서 융합"
 AA_upgrade_7_desc: "네트워크 연동 센서 융합은 미사일 영상 장치를 외부 레이더, 광학, 전장 데이터 피드와 연결하여, 휴대용 미사일과 장갑차 탑재 대공 거치대 모두의 표적 식별과 록온 안정성을 개선합니다."
 nsb_AA_upgrade_5: "적응형 IIR 탐색기"
 nsb_AA_upgrade_5_desc: "적응형 영상 적외선 탐색기는 디지털 표적 인식과 향상된 대응 수단 배제 능력을 결합하여, 단거리 대공 체계가 항공기와 플레어, 기만체, 드론, 배경 열원을 구별할 수 있게 합니다."
 nsb_AA_upgrade_6: "다중 스펙트럼 탐색기 배열"
 nsb_AA_upgrade_6_desc: "다중 스펙트럼 탐색기 배열은 여러 적외선 및 광학 대역을 더 빠른 탑재 처리 능력과 결합하여, 무인기, 순항 미사일, 헬리콥터와 같이 작고 빠르거나 지형에 가려진 공중 위협의 추적을 개선합니다."
 nsb_AA_upgrade_7: "네트워크 연동 센서 융합"
 nsb_AA_upgrade_7_desc: "네트워크 연동 센서 융합은 미사일 영상 장치를 외부 레이더, 광학, 전장 데이터 피드와 연결하여, 휴대용 미사일과 장갑차 탑재 대공 거치대 모두의 표적 식별과 록온 안정성을 개선합니다."
 AT_upgrade_5: "네트워크형 대전차 탄약"
 AT_upgrade_5_desc: "네트워크형 대전차 탄약은 발사 후 망각 유도, 발사 후 록온 능력, 외부 표적 인계를 결합하여, 발사기가 은폐되었거나 간접적이거나 급변하는 사격 위치에서 현대식 장갑을 교전할 수 있게 합니다."
 AT_upgrade_6: "다중 스펙트럼 재표적 탄약"
 AT_upgrade_6_desc: "다중 스펙트럼 재표적 탄약은 인간 개입형 통제와 함께 적외선, 가시광선, 저조도 탐색기를 사용하여, 운용자가 이동 중인 장갑, 기만체, 가려진 표적에 대한 공격을 식별, 재지정 또는 중단할 수 있게 합니다."
 AT_upgrade_7: "능동방어 대응 공격 탄약"
 AT_upgrade_7_desc: "능동방어 대응 공격 탄약은 적응형 비행 경로, 동기화된 충돌 시점, 선택 가능한 공격 각도를 사용하여 능동 방어 체계의 요격을 줄이고 장갑의 취약 부위를 타격합니다."
 AS_upgrade_4: "AI 지원 통제"
 AS_upgrade_4_desc: "AI 체계를 도입하면 작전 효율이 향상됩니다."
 AS_upgrade_5: "AI 지원 통제 II"
 AS_upgrade_5_desc: "AI 체계를 도입하면 작전 효율이 향상됩니다."
 AS_upgrade_6: "AI 지원 통제 III"
 AS_upgrade_6_desc: "AI 체계를 도입하면 작전 효율이 향상됩니다."
 MR_upgrade_4: "AI 지원 통제"
 MR_upgrade_4_desc: "AI 체계를 도입하면 작전 효율이 향상됩니다."
 MR_upgrade_5: "AI 지원 통제 II"
 MR_upgrade_5_desc: "AI 체계를 도입하면 작전 효율이 향상됩니다."
 MR_upgrade_6: "AI 지원 통제 III"
 MR_upgrade_6_desc: "AI 체계를 도입하면 작전 효율이 향상됩니다."
 microchip_production_6: "미래 칩 생산 II"
 microchip_production_6_desc: "개선된 칩 생산은 후면 전력 공급, 정제된 트랜지스터 구조, 초기 옹스트롬급 제조 공정을 도입하여 성능을 높이는 동시에 전력 손실과 발열을 줄입니다."
 microchip_production_7: "미래 칩 생산 III"
 microchip_production_7_desc: "차세대 리소그래피, 첨단 포토레지스트, 더 엄격한 공정 관리를 통해 반도체 공장은 더 적은 결함으로 더 미세한 회로 패턴을 인쇄할 수 있으며, 수율이 개선되고 더 복잡한 고성능 프로세서가 가능해집니다."
 microchip_production_8: "미래 칩 생산 IV"
 microchip_production_8_desc: "이종 칩 생산은 칩렛 설계와 첨단 패키징을 통해 논리 회로, 메모리, 센서, 가속기를 결합하여, 특화된 부품을 강력한 모듈형 프로세서로 통합할 수 있게 합니다."
 microchip_production_9: "미래 칩 생산 V"
 microchip_production_9_desc: "3차원 반도체 제조는 활성층, 메모리, 배선을 수직으로 쌓아 연산 집적도를 크게 높이지만, 고급 냉각, 접합, 결함 관리 기술이 필요합니다."
 microchip_production_10: "미래 칩 생산 VI"
 microchip_production_10_desc: "완전 자동화된 미래의 반도체 공장은 AI가 제어하는 공정 조정, 신소재 반도체, 초고밀도 3D 집적을 활용하여 극한의 성능, 효율, 제조 정밀도를 갖춘 전략 칩을 생산합니다."
 internet_access_4: "첨단 위성 인터넷 접속"
 internet_access_4_desc: "위성이 통신과 기타 데이터 전송에서 점점 더 보편화되면서, 인터넷은 위성 접속을 활용한 서비스 중 하나가 되었고 이로써 더 많은 사람이 인터넷에 연결될 가능성이 열렸습니다."
 internet_access_5: "최첨단 위성 인터넷 접속"
 internet_access_5_desc: "위성이 통신과 기타 데이터 전송에서 점점 더 보편화되면서, 인터넷은 위성 접속을 활용한 서비스 중 하나가 되었고 이로써 더 많은 사람이 인터넷에 연결될 가능성이 열렸습니다."
 internet_access_6: "초기 양자 인터넷 접속"
 internet_access_6_desc: "초기 양자 인터넷 접속은 얽힘 분배와 양자 키 교환으로 핵심 데이터를 보호하는 양자 보안 통신 링크를 통해 제한된 연구, 군사, 정부 네트워크를 연결합니다."
 internet_access_7: "첨단 양자 인터넷 접속"
 internet_access_7_desc: "첨단 양자 인터넷 접속은 양자 중계기, 양자 메모리, 광섬유-위성 링크를 확대하여 전략 네트워크 전반에서 안전한 장거리 통신과 초기 분산 양자 센싱을 가능하게 합니다."
 internet_access_8: "최첨단 양자 인터넷 접속"
 internet_access_8_desc: "최첨단 양자 인터넷 접속은 양자 컴퓨터, 센서, 보안 통신 노드를 더 넓은 네트워크로 연결하여 분산 연산, 정밀 센싱, 복원력이 매우 높은 전략 통신을 가능하게 합니다."
 artificial_intelligence_1: "신경망 부활"
 artificial_intelligence_1_desc: "신경망은 뇌의 처리 능력을 활용해 인류를 증강한다는 이론으로 19세기 후반부터 존재해 왔습니다. 우리의 컴퓨터와 인공지능 탐구를 향상시키기 위해 이 발상을 되살려야 합니다."
 artificial_intelligence_2: "데이터 마이닝"
 artificial_intelligence_2_desc: "데이터 마이닝은 대규모 데이터베이스를 분석하여 새로운 정보를 만들어 내는 기법입니다. 이 기법은 우리의 기술 수준을 개발하고 향상시키는 능력을 높이는 데 도움이 됩니다."
 artificial_intelligence_3: "기계 학습"
 artificial_intelligence_3_desc: "기계 학습 이론 개발의 핵심은 컴퓨터 알고리즘이 경험을 통해 자동으로 향상되는 능력입니다. 이를 우리의 AI 프로토콜에 개발해 넣으면 새로운 산업 작업을 더 빨리 학습하고 연구 개발도 개선할 수 있습니다."
 artificial_intelligence_4: "사회적 기계"
 artificial_intelligence_4_desc: "사회적 기계란 인간과 기술이 상호작용하여, 어느 한쪽만으로는 불가능한 결과나 행동을 만들어 내는 환경을 말합니다."
 artificial_intelligence_5: "초기 AI 로봇공학"
 artificial_intelligence_5_desc: "로봇공학에서의 인공지능은 기계 학습과 기타 AI 형태가 최근 등장한 이래로 제한적이었습니다. 산업용 및 기타 로봇공학에 AI를 도입하면 로봇이 생산성을 높이는 데 그치지 않게 될 것입니다."
 artificial_intelligence_6: "고급 AI"
 artificial_intelligence_6_desc: "상황을 인식하고 신속하게 적응할 수 있는 더 발전된 AI는 결정적인 차이를 만들 수 있습니다."
 artificial_intelligence_7: "현대 딥러닝"
 artificial_intelligence_7_desc: "딥러닝은 기계 학습의 하위 분야로, 구조화되지 않았거나 라벨이 없는 데이터에서 비지도 학습을 할 수 있습니다. 그 내부 작동은 인간 뇌의 데이터 처리 방식을 모방하여 사물을 탐지하고 의사결정을 내리는 데 쓰이는 AI 기능입니다."
 artificial_intelligence_8: "인간 모방 AI"
 artificial_intelligence_8_desc: "인간 모방 AI는 대규모 신경망과 딥러닝을 사용해 인간과 유사한 언어, 이미지, 판단, 행동을 생성하며, 한때 인간의 직접적인 판단이 필요했던 작업을 기계가 수행하게 합니다."
 artificial_intelligence_9: "대규모 AI 훈련"
 artificial_intelligence_9_desc: "대규모 AI 훈련은 방대한 데이터셋, 전용 가속기, 분산 컴퓨팅 클러스터를 사용하여 추론, 번역, 계획, 분석, 멀티모달 인식이 가능한 파운데이션 모델을 만들어 냅니다."
 artificial_intelligence_10: "고급 자기 학습 알고리즘"
 artificial_intelligence_10_desc: "고급 자기 학습 알고리즘은 AI 체계가 시뮬레이션, 피드백, 자율적 실험을 통해 스스로 향상되게 하여, 인간의 지속적인 재훈련과 수동 규칙 설계의 필요를 줄입니다."
 artificial_intelligence_11: "범용 인공지능"
 artificial_intelligence_11_desc: "범용 인공지능은 좁은 특정 기능에 얽매이지 않고 여러 분야에 걸쳐 지식을 전이하고, 낯선 문제를 해결하며, 복잡한 작업을 인간 수준의 유연성으로 조율할 수 있습니다."
 artificial_intelligence_12: "AI 군집 지능 조율"
 artificial_intelligence_12_desc: "AI 군집 지능 조율은 다수의 특화된 AI 체계를 공유 의사결정 네트워크로 연결하여, 데이터를 교환하고 임무를 분담하며 군사, 산업, 물류 작전을 실시간으로 조율하게 합니다."
 artificial_intelligence_13: "인공 초지능"
 artificial_intelligence_13_desc: "인공 초지능은 연구, 전략, 공학, 행정 전반에서 인간 수준의 성능을 뛰어넘어, 자동화 체계가 방대한 업무량을 관리하고 인간의 통상적 능력을 넘어서는 해법을 찾아낼 수 있게 합니다."
 artificial_intelligence_14: "양자 초지능"
 artificial_intelligence_14_desc: "양자 초지능은 첨단 AI 구조와 양자 가속 연산을 결합하여, 고전적 기계 지능으로는 불가능한 초대규모 최적화, 시뮬레이션, 암호 분석, 전략 계획을 가능하게 합니다."
 robotics_1: "휴머노이드 로봇"
 robotics_1_desc: "많은 사람에게 공포의 근원이기도 한 것이 AI 기반 로봇공학이 크게 도약하는 토대이기도 합니다. 여러 '인간형' 로봇이 등장하면서, 평소 반복적이고 따분한 일상 업무였던 일부 작업은 자동화하는 편이 더 낫다는 점이 드러났습니다."
 robotics_2: "고급 산업용 로봇공학"
 robotics_2_desc: "상업용 및 산업용 로봇공학에 더욱 정교한 AI를 도입하면 우리 제품과 생산의 품질, 납품, 속도를 향상시킬 수 있습니다."
 robotics_3: "스마트 드론"
 robotics_3_desc: "드론은 보통 수 킬로미터 떨어진 곳에 있는 한두 명 이상의 인원이 조종합니다. 인공지능을 탑재하기 시작하면 필요 인력을 한 명으로 줄일 수 있고, 장차 아무도 없이 컴퓨터 체계만으로 드론을 운용할 수도 있습니다."
 robotics_4: "완전 자동화 드론"
 robotics_4_desc: "완전 자동화 드론은 한때 미래의 일이었습니다. 이제는 완전 자율 드론이 A 지점에서 B 지점으로 이동하며 물류를 비롯한 수많은 업무를 수행할 수 있습니다."
 robotics_5: "나노로봇"
 robotics_5_desc: "나노로봇은 나노미터 규모이거나 그에 가까운 작은 기계 또는 로봇이라는 개념입니다. 나노로봇은 의학을 비롯해 경우에 따라서는 해체 상황의 전투 등 여러 분야에서 활용될 수 있습니다."
 robotics_6: "의료용 나노로봇"
 robotics_6_desc: "의료 분야와 함께 사용되는 나노로봇은 특정 세포, 바이러스, 세균을 표적으로 삼아 질병이나 치명적일 수 있는 감염과 싸울 수 있습니다."
 robotics_7: "AI 제어 드론"
 robotics_7_desc: "드론은 어떤 장애물도 완벽하게 피하고 주변의 다른 기계와 통신하여 물류 효율을 극대화할 수 있습니다."
 robotics_8: "인더스트리 4.0"
 robotics_8_desc: "로봇공학은 인류의 모든 영역에 4차 산업혁명을 완전히 가져왔습니다."
 robotics_9: "고급 의료 AI 봇"
 robotics_9_desc: "이 AI들은 어떤 질병이든 치료할 수 있습니다. 나노로봇 군단을 통제하며 인간의 노화 기전과도 맞설 수 있습니다."
 robotics_10: "양자 로봇공학"
 robotics_10_desc: "로봇에 양자 컴퓨팅을 도입하면 반응 시간이 거의 즉각적으로 단축되어, 생산 사슬을 정밀하게 세부 관리할 수 있습니다."
 robotics_11: "초지능 산업 허브"
 robotics_11_desc: "이제 산업단지 전체를 단일 인공 초지능 감독자가 관리할 수 있습니다."
 printing_1: "광조형"
 printing_1_desc: "광조형은 광화학 공정을 이용해 층층이 쌓는 방식으로 모형, 시제품, 주형, 생산 부품을 만드는 데 주로 쓰이는 3D 프린팅의 한 형태입니다."
 printing_2: "초기 3D 프린터"
 printing_2_desc: "초기 3D 프린팅은 기능적 또는 심미적 시제품을 만드는 데 적합한 것으로 확인되었습니다. 이 과정을 '쾌속 시제품 제작'이라고 합니다."
 printing_3: "3D 왁스 프린터"
 printing_3_desc: "3D 왁스 프린터는 왁스와 기타 열가소성 재료를 사용합니다."
 printing_4: "대규모 3D 프린팅"
 printing_4_desc: "3D 프린팅을 훨씬 더 큰 규모로 끌어올리면 나사, 못 같은 소형 품목이나 시장에서 대체할 수 없는 정밀 품목의 생산을 효율화하고 확대할 수 있습니다."
 printing_5: "자기 복제 3D 프린터"
 printing_5_desc: "자기 복제 3D 프린터는 생산을 보조하고 생산 규모를 앞으로 확대하도록 설계되었습니다."
 printing_6: "상업적 제조"
 printing_6_desc: "상업 분야에서 3D 프린팅은 극히 제한적이었습니다. 3D 프린팅 역량을 이 분야까지 확대하면 우리가 앞으로 나아가는 능력에 크게 도움이 될 것입니다."
 printing_7: "현대 3D 프린팅"
 printing_7_desc: "3D 프린팅의 발전으로 소재를 더 강하고 효율적인 것으로 바꿀 수 있게 되었습니다."
 printing_8: "3D 프린팅 나노섬유"
 printing_8_desc: "나노섬유를 프린팅하면 나노 입자 하나하나의 수준에 이르기까지, 지금까지 생산할 수 있었던 것보다 더 강한 소재를 만들어 낼 수 있습니다."
 printing_9: "대규모 나노셀룰로스 제조"
 printing_9_desc: "나노셀룰로스 제조를 더 대규모로 확대하면 훨씬 빠른 속도로 신제품을 개발할 수 있습니다."
 printing_10: "의학용 나노셀룰로스"
 printing_10_desc: "의학에 나노셀룰로스를 활용하면 쇠약하게 만드는 질병을 앓는 환자의 생존율을 높이는 데 도움이 됩니다."
 printing_11: "건설용 프린터"
 printing_11_desc: "현장에서 직접 자재를 생산할 수 있는 프린터를 사용해 건물을 지을 수 있으며, 물류 비용이 줄어듭니다."
 printing_12: "바이오 프린팅"
 printing_12_desc: "생명공학과 3D 프린팅의 발전을 결합하면 장기 전체를 제조할 수 있습니다."
 printing_13: "미시-거시 프린터"
 printing_13_desc: "3D 프린터는 나노섬유 생산에서 건물 전체의 건설에 이르기까지 인간 생활의 모든 영역에 적용할 수 있을 만큼 다용도가 되었습니다."
 nanofibers_1: "산업용 전기방사 고분자 나노섬유"
 nanofibers_1_desc: "나노섬유의 전기방사는 나노섬유를 제작하는 가장 흔한 방법 중 하나입니다. 생산을 늘리면 더 많은 양을 더 자주 생산할 수 있습니다."
 nanofibers_2: "다중벽 탄소 나노튜브"
 nanofibers_2_desc: "나노튜브는 전기 장치의 도체, 무선 통신용 안테나, 기타 전자기 장치에 사용됩니다."
 nanofibers_3: "현대 전기방사"
 nanofibers_3_desc: "전기방사는 전기력을 이용해 하전된 고분자 용액이나 용융 고분자의 가닥을 수백 나노미터 정도의 섬유 지름까지 뽑아내는 섬유 생산 방식입니다."
 nanofibers_4: "무기 섬유 제작"
 nanofibers_4_desc: "전기방사는 대량의 나노물질을 제작하는 가장 간단하고 효과적인 기법 중 하나로 여겨지며, 다양한 무기 마이크로 섬유와 나노섬유가 전기방사로 성공적으로 제작되었습니다."
 nanofibers_5: "나노섬유의 산업적 생산"
 nanofibers_5_desc: "전기방사 나노섬유는 폭넓게 연구되어 왔으며 잠재적 활용처가 크게 입증되었습니다. 전기방사 장비, 기술적 해법, 전기방사 소재는 빠르게 상용화되고 있습니다. 전문 기업들이 전기방사용 실험실 및 산업 규모의 부품과 장치를 공급하고 있습니다."
 nanofibers_6: "의학용 나노섬유"
 nanofibers_6_desc: "나노섬유는 독특한 특성의 조합과 고유한 기능 덕분에 생의학 및 보건 분야에서 큰 잠재력을 보입니다. 나노섬유의 주요 생의학적 활용에는 여과, 의료용 직물, 상처 치유, 조직 공학 및 재생, 바이오센서, 약물 전달이 있습니다."
 nanofibers_7: "원심 방사"
 nanofibers_7_desc: "고전압 장치의 사용과 낮은 생산 속도는 나노섬유의 대규모 생산에 전기방사 기법을 쓰는 데 걸림돌이 되었습니다. 원심 방사는 다양한 소재로 나노섬유를 생산하는 효율적인 방법입니다."
 nanofibers_8: ""
 nanofibers_8_desc: ""
 nanofibers_9: ""
 nanofibers_9_desc: ""
