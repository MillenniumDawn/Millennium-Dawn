l_english:
 turkey_focus: "Turkish Focus Tree"

#Ideas
 TUR_disinflation_gamble: "The Disinflation Gamble"
 TUR_disinflation_gamble_desc: "Our economy hangs on the balance, with a peg holding it together. Overnight rates have collapsed. Shops are full of good nobody could afford just a year ago. Every bank in the country is borrowing short to buy long government paper, and the whole arrangement holds together for as long as the peg does.\n§W--------------§!\nWe can abandon the peg early in hopes of beginning the recovery process as soon as possible, or we can wait and see what happens."
 TUR_black_wednesday: "Black Wednesday - Kara Çarşamba"
 TUR_black_wednesday_desc: "Our gamble did not pay off. We are now stuck trying to figure out what to do, and there is currently no one in our government that has any idea on what could potentially reverse this disaster.\n§W--------------§!\nWe are likely to see the rise of new political opponents."
 TUR_honeymoon: "Honeymoon Phase"
 TUR_honeymoon_desc: "The Lira is going strong, and our peoples spirit is even stronger as a result."
 TUR_ahmet_sezer: "Ahmet Necdet Sezer"
 TUR_ahmet_sezer_desc: "President / Cumhurbaşkanı\n§W--------------§!\nBorn 13 September, 1941, Sezer is the Turkish president who formerly served as a judge."
 TUR_suleyman_demirel: "Süleyman Demirel"
 TUR_suleyman_demirel_desc: "President / Cumhurbaşkanı\n§W--------------§!\nBorn 1 November, 1924, Sami Süleyman Gündoğdu Demirel has been the serving President of Turkey since 1993. He formerly served as the Prime Minister seven times between 1965 and 1993."
 TUR_banking_regulation_agency: "Banking Regulation and Supervision Agency"
 TUR_banking_regulation_agency_desc: "'We'll turn this place upside down if we have to!'"
 TUR_credit_boom_tax: "Riding the Wave"
 TUR_credit_boom_tax_desc: "'We've got to get our money from somewhere, right?'"
 TUR_euphrates_dammed: "Euphrates Access Restricted"
 TUR_euphrates_dammed_desc: "The Turks have restricted access to the Euphrates, severely hampering our agricultural capabilities."
 TUR_euphrates_dammed_domestic: "Actively Damming the Euphrates"
 TUR_euphrates_dammed_domestic_desc: "We are blocking the flow of the Euphrates river going Southward, and as a result, we are facing severe political backlash from domestic and international humanitarian groups."
 TUR_defensive_positioning: "Levantine Defensive Posturing"
 TUR_defensive_positioning_desc: "The Levant region is under constant threat of attack, and it is our duty to ensure it is protected from foreign agitators."
 TUR_AZE_mountainous_exercises: "Mountainous Exercises"
 TUR_AZE_mountainous_exercises_desc: "No mountain is too big and no path is too rugged for any of our troops."
 TUR_shusha_declaration: "Shusha Declaration"
 TUR_shusha_declaration_desc: "The Shusha Declaration will is an agreement between us and our brother state to ensure strong ties and a healthy alliance."
 TUR_more_people: "More People!"
 TUR_more_people_desc: "'Come on, get on with it!'"
 TUR_harder_workers: "Hard Workers!"
 TUR_harder_workers_desc: "'I don't pay you to stand around all day!'"
 TUR_motivated_soldiers: "Motivated Soldiers!"
 TUR_motivated_soldiers_desc: "'I didn't hear no bell!'"
 

# Dynamic Modifiers
 TUR_economy_modifier: "State of the [TUR.GetAdjective] Economy"
 TUR_economy_modifier_desc: "Turkey sits astride the crossroads of two continents with a young workforce and a customs union with Europe, and yet it cannot seem to escape its own arithmetic. Chronic inflation, a mountain of short-dated public debt, and an informal sector the tax collector never reaches leave the treasury borrowing at ruinous rates from banks that survive on nothing but government paper. The agreement signed with the Fund in December closed the printing press that used to cover the difference, so every lira the budget spends must now be borrowed or taxed. Beyond the ledger, a third of the workforce still works plots too small to mechanize, barely half the country of working age looks for work at all, and every barrel and cubic metre of gas arrives by tanker or pipeline while the domestic alternative is a lignite too poor to repay the digging. The rubble of the Marmara quake still lies across the industrial heartland. Only the dams of the southeast return more than they cost. This modifier represents the current state of the Turkish economy.\n§W--------------§!\nThis national spirit will never be §RRemoved§!. However, the modifiers could gradually §GImprove§! to reflect the state of the nation's economy as more focuses, decisions, and events are completed."
 TUR_tsk_modifier: "State of the [TUR.GetAdjective] Armed Forces"
 TUR_tsk_modifier_desc: "The Türk Silahlı Kuvvetleri field the second-largest army in the Atlantic alliance, hardened by fifteen years of mountain warfare in the southeast. That hard-won experience sits atop aging hardware bought abroad under licenses that a foreign parliament can revoke on a whim, crewed by conscripts who leave the moment they become useful. The assembly halls at Akıncı and the slipways at Gölcük have proven they can build whatever they are given the drawings for, but the budget that would let them design something of their own is being eaten alive by the debt. This modifier represents the current state of the Turkish armed forces.\n§W--------------§!\nThis national spirit will never be §RRemoved§!. However, the modifiers could gradually §GImprove§! to reflect the state of the nation's armed forces as more focuses, decisions, and events are completed."
 TUR_political_modifier: "State of the [TUR.GetAdjective] Nation"
 TUR_political_modifier_desc: "A republic built on Atatürk's legacy, governed by fractious coalitions that answer as much to the generals of the National Security Council as to the ballot box. Corruption reaches from the village headman to the ministries, the Kurdish question remains unanswered, and the brightest of a young nation keep buying one-way tickets to Europe. Yet Helsinki has just named Turkey a candidate for membership, and for the first time in a generation there is a door open to the west that Ankara did not have to force. This modifier represents the current state of the Turkish nation.\n§W--------------§!\nThis national spirit will never be §RRemoved§!. However, the modifiers could gradually §GImprove§! to reflect the state of the nation's political situation as more focuses, decisions, and events are completed."

# Events
 turkish_events.1.t: "A Note For Turkey"
 turkish_events.1.d: "Hello! Thank you for checking out our Turkey content. The Turkey content has been reworked for version 2.0 to ensure an updated and engaging gameplay loop. While this tree may be slightly smaller than the pre-rework tree, please understand that this tree includes a new design philosophy that focuses on quality over quantity. In the near future (hopefully) there will be new political paths introduced that will allow for greater game variety.\n\n----------------------\n\nWe hope you enjoy playing Turkey! Make sure to leave your feedback, bug reports and questions in the Millennium Dawn Discord or Reddit.\n\n - Millennium Dawn Middle East Team"
 turkish_events.1.a: "Understood"
 turkish_events.2.t: "The Rates Collapse"
 turkish_events.2.d: "Treasury bills that yielded a hundred percent in December yield thirty-five today. Nothing has been cut, no tax has been raised, and the debt service lin in the budget has halved by itself. Everything suggests that our economy is on the upturn, and we've got some extra change lining our pockets."
 turkish_events.2.a: "Break the windfall"
 turkish_events.2.b: "Spend it generously"
 turkish_events.3.t: "Five Plus Five"
 turkish_events.3.d: "The president's term ends next month. The constitution permits only one term, so to keep him the coalition must change the constitution to two terms of five years instead of one for seven. The president himself however, has said that he'd rather stand agan than be handed extra time. He states that a man whose term is simply extended arrives to an office which is already a corpse. Polling suggests that 7/10 voters do not want to keep him at all, and the prime minister has gone on television to ask deputes to vote in the open, which hasn't gone well whatsoever."
 turkish_events.3.a: "Look for constitutional loopholes"
 turkish_events.3.b: "Let's see what the amendment gets"
 turkish_events.4.t: "Amendment Fails, Ahmet Necdet Sezer Runs for President"
 turkish_events.4.d: "The amendment has failed, and it appears that Ahmet Necdet Sezer is our runner-up for the Presidential election. He is currently being endorsed by Prime Minister [TUR.GetLeader], and he is poised to get the poplar vote in the Parliament."
 turkish_events.4.a: "Okay"
 turkish_events.5.t: "Ahmet Necdet Sezer Elected President"
 turkish_events.5.d: "Securing 63% of the vote in the third round, with 330 members in favor, Ahmet Necdet Sezer has secured political office as an independent candidate. He is a staunch secularist and seeks to promote these values however he can."
 turkish_events.5.a: "Congratulate the winner"
 turkish_events.6.t: "The Man is Right"
 turkish_events.6.d: "One of the richest men in the country went on television last night and said that more than half of Turkey's banks are finished, stating that everyone in the industry is already well aware of it. While it may be true, the law forbids such statements."
 turkish_events.6.a: "Arrest him"
 turkish_events.6.b: "Find which banks are hollow"
 turkish_events.7.t: "Someone Is Finally Allowed to Look"
 turkish_events.7.d: "As of today the Banking Regulation and Supervision Agency has the legal power to walk into any bank and open the books. They can also take over the place if they don't like what they find. Thus far, nobody has done this before. The people running it are serious, and if you let them work, they'll find things and such findings will not stay quiet."
 turkish_events.7.a: "Let them do their job"
 turkish_events.7.b: "Keep them on a leash"
 turkish_events.8.t: "Everyone Is Buying"
 turkish_events.8.d: "New car sales are up by more than half. Consumer loans are being written at rates nobody has seen in twenty years, and the shops that sell refrigerators have waiting lists. Some call this prosperity, and they're not wrong, but almost every one of those refrigerators arrived on a ship."
 turkish_events.8.a: "Let the people enjoy it"
 turkish_events.8.b: "Tax the credit boom"
 turkish_events.9.t: "The Lira Is Too Strong"
 turkish_events.9.d: "Our plan had initially predicted that the Lira would fall 20%, with inflation to follow. However, that did not happen. Instead prices this year will rise by nearly 40%. Imports will close the year near 55 billion dollars against 28 billion in exports."
 turkish_events.9.a: "Hold it, inflation will catch up"
 turkish_events.9.b: "Adjust the schedule now"
 turkish_events.10.t: "Telekom Does Not Sell"
 turkish_events.10.d: "The sale was written into the budget as a revenue months before a bidder was ever found. One consortium came to the room and then left it as it was. The law caps the foreign share, the ministry that owns the wires belongs to a coalition partner who will not part with them, and the money has already been spent on paper."
 turkish_events.10.a: "Shit, change the law and try again"
 turkish_events.10.b: "Find the revenue somewhere else"
 turkish_events.11.t: "The Ceiling"
 turkish_events.11.d: "Under the IMF program, the central bank may only create lira against foreign currency that comes in. Iti s therefore forbidden to be a lender of last resort at the exact hour one is required. Money touched 200% and this morning and by night 800%. The rule was written to make devaluation impossible, but now it is making everything else impossible too."
 turkish_events.11.a: "Break the ceiling and let them print!"
 turkish_events.11.b: "Hold the rule, let them sweat"
 turkish_events.12.t: "The Bank That Bought Too Many Bonds"
 turkish_events.12.d: "One medium-sized (Demirbank) bank holds close to a tenth of all outstanding government paper, and it bought that paper with money borrowed overnight. At three-digit overnight rates the arithmetic kills it inside a week. If it dumps the portfolio to survive it takes the price of every bond in the country down with it. "
 turkish_events.12.a: "Lend against the portfolio"
 turkish_events.12.b: "Take it over tonight"
 turkish_events.13.t: "Quiet January"
 turkish_events.13.d: "Rates have come off December's madness, and the reserves are partly rebuilt and the newspapers have thankfully moved on. This is the last month in which the exchange rate can be changed by decision rather than by collapse, with money still in the vault and no crowd outside the doors."
 turkish_events.13.a: "What's next?"
 turkish_events.14.t: "The Booklet"
 turkish_events.14.d: "The President accused the government at the security council today of smothering the corruption files. With a copy of the constitution in his hand, the president punted it at the Prime Minister. [TUR.GetLeader] stormed out in anger, telling reporters that there is 'a serious crisis'. Shortly after, the exchange fell about 14.6%."
 turkish_events.14.a: "It's all a misunderstanding!"
 turkish_events.15.t: "Black Wednesday"
 turkish_events.15.d: "A loss of confidence in the economy following a heated political clash between in the National Security Council led to a market crash earlier this week. Interest rates spiked past 1,000% overnight, and stocks on the Istanbul exchange plummeted 18% on today alone. As it stands, the Lira is worthless, and the economy is in complete chaos. This crisis started on what many are calling 'Black Wednesday'."
 turkish_events.15.a: "This can't be good"
 turkish_events.16.t: "Turkey Proposes the TurkStream Pipeline"
 turkish_events.16.d: "The Turkish government has come forward with a new proposal. In their presentation, Turkish investors and diplomats suggested building a pipeline from South Krasnodar across the Black Sea towards Edrine, and out to the Balkans. Their stated goal with this is to bypass regions of 'geopolitical tension' and to ensure a steady flow of natural gas from Russia into Turkey. We will brunt the majority of the cost, though we will also benefit substantially."
 turkish_events.16.a: "Where do we sign?"
 turkish_events.16.b: "Get this out of my sight!"
 turkish_events.17.t: "Russia Accepts TurkStream Proposal"
 turkish_events.17.d: "The Russian government has accepted the TurkStream proposal, and have also agreed to take the majority of the cost. However, some more nationalistic elements in our country have stated that this encroachment of Russian influence will hurt us in the end."
 turkish_events.17.a: "Good"
 turkish_events.18.t: "Russia Rebuffs TurkStream Proposal"
 turkish_events.18.d: "They said the Russian's were cold, though they never warned us that they would simply walk out mid-presentation. Our diplomats have stated that the Russian's had shown little interest for the time that they were there, and that it is unlikely a deal is to be made."
 turkish_events.18.a: "Okay"
 turkish_events.19.t: "Turkish Forces Mobilize Ahead of Aegean Dispute"
 turkish_events.19.d: "After months of mounting tension over the disputed ownership of the Aegean islands, the Turkish Armed Forces have announced that they are mobilizing to counter what they describe as hostile troop movements gathering across the strait. [TUR.GetLeader] has accused Greek forces of sinking several Turkish cargo ships earlier this week, though no party has come forward to claim responsibility for the attacks. NATO leadership has warned that the mobilization could prove 'fatal' for the alliance, while [GRE.GetLeader] has vowed that any assault on Greek territory would be met with retaliation of equal or greater force."
 turkish_events.19.a: "I smell blood in the air"
 turkish_events.20.t: "Agents Stage False-Flag Operation"
 turkish_events.20.d: "Our agents have Infiltrated a Greek port near the Aegean Sea. As it stands, they are waiting on our orders to initiate the operation which will see the sinking of several Turkish cargo ships. While this operation will ultimately cause harm to our own industry and our own maritime activity, it will result in the greater good of all Turk's once we settle the Aegean debate for good."
 turkish_events.20.a: "Green-light the operation"
 turkish_events.21.t: "False Flag Successful"
 turkish_events.21.d: "Our false flag mission was deemed a 'success' despite us having lost several cargo ships. We now have legitimate pretext to carry out an extended campaign against Greek forces in the Aegean. The Ministry of War has mapped out the objectives we need to accomplish to succeed. "
 turkish_events.21.a: "Good"
 turkish_events.22.t: "False Flag Failed"
 turkish_events.22.d: "Our false flag operation was not successful, and instead, it has resulted in the entire world viewing us with anger. This has resulted in strained relations with many states all across the globe, and as a result, we no longer have backing from many of our allies."
 turkish_events.22.a: "At least the Aegean is still in sight!"
 turkish_events.23.t: "Crimea in Rebellion!"
 turkish_events.23.d: "We've successfully armed Crimean rebels and have sent over advisors to help fend off the Russian offensive. Though it is unlikely that victory could be secured alone, our attache is well versed in NATO doctrine built around countering the Russian army. We've also been briefed on the possibility of being able to send over Turkish units to help fend off until a ceasefire agreement is reached with Russia."
 turkish_events.23.a: "Go, go, go!"
 turkish_events.24.t: "Crimea Revolts!"
 turkish_events.24.d: "Rumbles of a rebellion in Crimea had been going on for a few months now. Though it was not completely unexpected, several units stationed in and around the area of Sevastopol Bay were completely caught off-guard by constant shelling in the early hours of the morning. It is suspected that the Turkish state has had a hand in this movement, though it is best that we don't point any fingers to avoid a diplomatic incident. After all, this rebellion should take little to no time to put down for an army as mighty as ours."
 turkish_events.24.a: "Onwards we go!"
 turkish_events.25.t: "Orders From [TUR.capital.GetCapitalVictoryPointName]"
 turkish_events.25.d: "A letter has been sent to the TSK Chief of the General Staff reading:\n\nCommander!\n\nThe situation in Syria has reached a critical juncture. Our allies among the Syrian rebels have made considerable gains, securing large portions of the territory along our southern border. With their momentum growing, the question now falls upon the General Staff: what is to be done next? One option is to order the rebels to consolidate their positions and hold the territories they have already captured. A strong defensive line along the border would give us greater security while avoiding the risks of becoming entangled in a prolonged campaign deep within Syria. It would also allow the rebels to strengthen their administration and military capabilities in the territories under their control. The alternative is far more ambitious. We could encourage the rebels to continue their advance and launch a full assault against the Syrian regime itself. If successful, this could topple the current government and fundamentally reshape the balance of power in the region. However, such an offensive would carry considerable risks, potentially provoking greater resistance and creating an unstable political situation in the aftermath. The decision now rests with you, Commander. Shall we be content with securing our frontier, or shall we seize this opportunity and push onward until the Syrian regime is brought down?"
 turkish_events.25.a: "March to the sound of guns and drums"
 turkish_events.25.b: "Consolidate for now, we will revisit this matter in due time"
 turkish_events.26.t: "Turkey Requests We Attack Iran"
 turkish_events.26.d: "The Turkish government has requested that we launch an assault on Iranian territory to cost them some manpower and equipment. Doing so will obviously sour relations with Iran, but it will bring us closer to the Turks."
 turkish_events.26.a: "We'll do a minor incursion"
 turkish_events.26.b: "Not at this time"
 turkish_events.27.t: "PUK Forces Launch Attack Into Iran"
 turkish_events.27.d: "PUK forces have agreed to make a minor incursion into Iranian territory, causing them to lose supplies and gain some casualties."
 turkish_events.27.a: "Good"
 turkish_events.28.t: "PUK Forces Refuse Attack On Iran"
 turkish_events.28.d: "PUK forces have turned down our request at an incursion into Iranian territory. They state a lack of capacity and morale amongst units as the reason that they are holding off for now."
 turkish_events.28.a: "Okay"
 turkish_events.29.t: "Şam ve Kudüs"
 turkish_events.29.d: "In regards to the Levant region, we've got a multi-pronged agenda. However, the options at hand should not be taken all at once in order to avoid unnecessary conflict. Therefore, the cabinet has proposed that we set on one path and follow through with it. We can either structure our policy towards guaranteeing the safety of Levantine states from aggressors in the region, or to actively work towards bringing them within our sphere."
 turkish_events.29.a: "It is best we act as the guardians"
 turkish_events.29.b: "No, we must bring them into fold"
 turkish_events.30.t: "Security Cooperation With Turkey"
 turkish_events.30.d: "Our friends from the West have come to us with proposals of potential military exercises. They state that such exercises would be a great demonstration of strength, and Turkish-Azeri brotherhood. Furthermore, they've notified us that these exercises would be centered around combat in a mountainous region."
 turkish_events.30.a: "When do we start?"
 turkish_events.30.b: "We have no interest in this"
 turkish_events.31.t: "Joint Turkish - Azeri Exercises"
 turkish_events.31.d: "We've successfully conducted joint Turkish - Azeri exercises in order to prepare for any potential future conflict within the Caucasus region. Though conflicts seem unlikely in the present, it is unlikely that such calm would persist for much longer."
 turkish_events.31.a: "Good"
 turkish_events.32.t: "Azerbaijan Turns Down Military Exercises"
 turkish_events.32.d: "The Azeri government has turned down our offer to conduct joint exercises for our Rangers and Special Forces troops. The exercises were intended to prepare our troops for potential confrontations in the mountainous Caucasus region, though the Azeri government seems uninterested."
 turkish_events.32.a: "Okay"
 turkish_events.33.t: "Joint Azeri-Turkish Military Exercises"
 turkish_events.33.d: "The Azeri and Turkish armed forces have conducted military exercises intended to prepare troops for a potential conflict within the mountainous Caucasus region. While foreign governments have not commented on the training drills, it has drawn concern from neighboring states as they believe that the exercises were intended to act as a show of strength. The Turkish government stated that the exercises were intended to be nothing more than an assertment of 'brotherhood' between the two states."
 turkish_events.33.a: "Interesting"
 turkish_events.34.t: "Turkey Proposes the Shusha Declaration"
 turkish_events.34.d: "The Turkish government headed by [TUR.GetLeader] has proposed the Shusha Declaration. This agreement aims to strengthen security ties between our two nations and to create a formalized alliance that allows for us to come to the defense of one-another in the instance of an attack on one state."
 turkish_events.34.a: "Where do we sign?"
 turkish_events.34.b: "We are not interested"
 turkish_events.35.t: "Azerbaijan Signs the Shusha Declaration"
 turkish_events.35.d: "The Azeri government has formally signed the Shusha agreement, formalizing our alliance and creating articles for further cooperation in the future. The agreement has drawn criticisms from certain states, particularly from Armenia."
 turkish_events.35.a: "Good"
 turkish_events.36.t: "Azerbaijan Snubs Shusha Declaration"
 turkish_events.36.d: "The Azeri government seemed uninterested in signing the Shusha Declaration, which came as a surprise to many of our diplomats. The agreement aimed to only enhance security ties and to formalize an alliance between our states, but if the Azerbaijani's do not want that, we will not insist."
 turkish_events.36.a: "Okay"
 turkish_events.37.t: "Turkish Military Planners Arrive in [AZE.capital.GetCapitalVictoryPointName]"
 turkish_events.37.d: "Representatives from the Turkish Armed Forces have arrived in the capital today and are discussing with our highest ranking officials on ways we could potentially conduct a strike on the Karabakh region. Their representatives do not seem interested in directly intervening, however, they have floated the idea of 'Turkish peacekeepers' advancing alongside Azerbaijani troops as we move forward. The Turkish government has also stated that this conflict could see the installment of an Azeri-backed government in Armenia, allowing for a permanent settlement to the Armenian tensions that have existed for so long."
 turkish_events.37.a: "Go ahead, we're listening"
 turkish_events.37.b: "We are not interested, leave"
 turkish_events.38.t: "Azeri Troops Move Towards Armenia!"
 turkish_events.38.d: "The Azerbaijani Armed Forces have declared a total mobilization to conduct an all out attack on Armenia following the advice of our military planners. It is now our duty to support our Azeri brothers in arms with 'peacekeepers' to ensure their success."
 turkish_events.38.a: "Onwards!"
 turkish_events.39.t: "Azerbaijani Generals Seem Uninterested"
 turkish_events.39.d: "Azerbaijani generals have shown little interest in what our military planners had to say about ways to conduct a potential attack on Armenian soil."
 turkish_events.39.a: "Okay"
 turkish_events.40.t: "Turkish Representatives Request Terms for a Base"
 turkish_events.40.d: "The Turkish government has dispatched several representatives to meet with out foreign ministry to determine whether or not we can reach an agreement to allow for Turkish bases on our shores. They're willing to pay a price for it, and they're requesting full military and naval access. On top of this, the Turks are requesting that we grant them access to our airports for their fighter aircraft."
 turkish_events.40.a: "We'll work it out, but it won't be free"
 turkish_events.40.b: "No Turk will settle on our soil"
 turkish_events.41.t: "[FROM.GetName] Sends Terms"
 turkish_events.41.d: "Diplomats from [FROM.GetName] have given us a 40 page document outlining the terms and conditions pretaining to any Turkish military presence on their soil. The document states that we must invest in the country both militarily and economically before we are fully allowed to settle, and doing so requires us to spend quite a bit of cash."
 turkish_events.41.a: "It's within budget, we'll sign"
 turkish_events.41.b: "On second thought, we don't need a base"
 turkish_events.42.t: "Turkey Proposes Mining Operations"
 turkish_events.42.d: "The Turkish government has proposed that they contract out several mining companies based in Istanbul to fly out and establish mines in the Agadez region. This will mean that the Turks gain exclusive resource access to mines they establish in the Eastern Agadez, however, they have promised to give us nationalized access over mines in the Western Agadez region."
 turkish_events.42.a: "Well, at least we gain something from it"
 turkish_events.42.b: "This is colonialism at its finest!"
 turkish_events.43.t: "Turkey Seeks to Establish TURKSOM Base"
 turkish_events.43.d: "The Turkish government has requested that we cooperate in establishing a new military base labeled as TURKSOM. They claim that such a base would allow for Turkish forces to cooperate much more closely with Somalian forces, creating an environment of shared military cooperation."
 turkish_events.43.a: "Sure"
 turkish_events.43.b: "No"
 turkish_events.44.t: "Somalia Permits TURKSOM Base Construction"
 turkish_events.44.d: "The Somalian government has allowed for our forces to set-up a camp labeled TURKSOM. We will be able to have our troops stationed in the region, alongside with our navy and airforce."
 turkish_events.44.a: "Great!"
 turkish_events.45.t: "The Rise of Bahçeli"
 turkish_events.45.d: "Greeting a thunderous crowd of supporters, Devlet Bahçeli announced sweeping reforms in his national address. With the tri-crescent banner behind him, the new government pledged a constitutional overhaul strengthening the unitary state, an expanded rearmament programme built around the domestic defense industry, and deeper institutional ties with the Turkic republics of Central Asia.\n\nOpposition deputies in the Meclis have warned that the proposed judicial changes will face immediate challenge, while foreign observers noted that the address made no mention of the stalled accession talks in Brussels. Markets in Istanbul closed sharply lower."
 turkish_events.45.a: "A surprising shift"
 turkish_events.46.t: "Calling Upon the Islamic Ulema"
 turkish_events.46.d: "The Islamic Ulema have entrenched themselves in the majority of our state institutions, and as such, have been able to wield immense influence. Despite resistance from the more secular elements of our society, the Ulema are still able to rally a great number of supporters to any cause, and we must utilize their outreach for state benefits where ever we can."
 turkish_events.46.a: "We need more people!"
 turkish_events.46.b: "We need harder workers!"
 turkish_events.46.c: "We need motivated soldiers!"
 turkish_events.47.t: "A Throne Abolished"
 turkish_events.47.d: "Members of the Nationalist Movement Party held a secret meeting without informing Devlet Bahçeli ahead of time. There was a consensus that Bahçeli intended to use state resources for him and his companions personal gain, at the expense of the Turkish people. Several members of the party also raised concerns with his growing interest in suppressing individual and personal freedoms of the Turkish people in favor of shifting the state towards a more authoritarian direction. Overall, once the meeting was adjourned, there was a unified agreement that Bahçeli must be ousted. As such, party members with connections to the military were able to fabricate a warrant and have Bahçeli detained.\n\nMembers of the party have also elected a new figure-head that they deem more to be a moderate alternative to Bahçeli."
 turkish_events.47.a: "Good, now we can get on with business"

# Tooltips
 TUR_3_more_years_TT: "Süleyman Demirel will remain in office"
 TUR_1_lira_stability_TT: "§HLira Stability§!: §G+1§!"
 TUR_minus_1_lira_stability_TT: "§HLira Stability§!: §R-1§!"
 TUR_lira_joever_TT: "§RThe Lira will crash!§!"
 TUR_we_prevented_disaster_TT: "Because we maintained high §HLira Stability§!, we've averted an even worse disaster!"
 TUR_pkk_disruption_tt: "£TUR_Neutral_Communism  - The PKK may disrupt our ability to carry out our activities here!"
 TUR_turkstream_tt: "We will be able to §Hdisrupt access§! to the §HTurkStream§! pipeline!\n - This will weaken [SOV.GetFlag] §HRussian§! gas supply\n £decision_icon_small - This will be unlocked under the §HTurkish Politics§! decision tab when at war with [SOV.GetFlag] §HRussia§!"
 TUR_mavi_vatan_tt: "£decision_icon_small §YUnlocks§! decision to tax the Bosporus\n - This will be in the '§HTurkish Politics§!' decision tab"
 TUR_the_daring_dash_tt: "£attack_texticon  We will likely end up at war with [GRE.GetFlag] §HGreece§!\n - [TUR.GetFlag] §HTurkish§! operatives will attempt to start a false-flag operation\n - A mission will activate detailing our objectives"
 TUR_banned_nato_tt: "\n£text_icon_kaldanger This operation could get us expelled from NATO and barred from ever joining back"
 TUR_research_nuclear_tt: "£text_icon_kaldanger Because we haven't researched §HABWR§!:\n - There may be a chance of a nuclear accident!"
 TUR_reach_for_crimea_tt: "£attack_texticon  We will likely end up at war with [SOV.GetFlag] §HRussia§!\n - We will call on [CRM.GetFlag] Crimean diaspora to support our cause and form militias\n - We will incite a rebellion in the region and have the ability to send [TUR.GetFlag] Turkish forces to support them\n - If we succeed, [CRM.GetFlag] Crimea will become a satellite state and §HSevastopol Bay§! will be ours to utilize"
 TUR_arm_fsa_tt: "The weapons will be sent to [TUR.GetFlag] §HTurkish-aligned§! freedom fighters in the border regions of [FSA.GetFlag] §HSyria§!\n----------------------"
 TUR_assault_tt: "We will order our troops to launch an all-out assault on [SYR.GetFlag] Syria"
 TUR_consolidation_tt: "We will consolidate our protectorate zone in hopes of maintaining security"
 TUR_utilize_PUK_tt: "£decision_icon_small §YUnlocks§! decisions to utilize [PUK.GetFlag] §HPUK§! Forces\n - We can request they launch border wars on countries they border that we deem hostile!"
 TUR_wait_for_withdrawal_tt: "While this focus may appear unavailable, once the United States withdraws from Iraq you will be able to complete it!"
 TUR_do_olive_branch_tt: "In order to see the effects, complete §HOperation Olive Branch§!"
 TUR_operation_sun_tt: "£attack_texticon - We will make an incursion into [IRQ.GetFlag] §HNorthern Iraq§! to hunt for [PKK.GetFlag] §HPKK§! targets\n - We will likely engage [KUR.GetFlag] §HPeshmerga§! units in combat\n - If successful, we will temporarily create a sattelite state in [IRQ.GetFlag] §HNorthern Iraq§! and cause serious damage to [PKK.GetFlag] §HPKK§! morale"
 TUR_severe_damage_to_pkk_tt: "£TUR_Neutral_Communism  - The §HPKK§! will experience §Gheavy losses§! and set backs!\n - Around §H300§! insurgents will be killed"
 TUR_cleaner_tooltip_for_lebanon_investment_tt: "§YPossible Investment Targets§!\n§g-§! [TUR.GetFlag] [TUR.GetNameDefCap] and [LEB.GetFlag] [LEB.GetNameDefCap] will now become §YInvestment\n  Targets§! for each other"
 TUR_cleaner_tooltip_for_georgia_investment_tt: "§YPossible Investment Targets§!\n§g-§! [TUR.GetFlag] [TUR.GetNameDefCap] and [GEO.GetFlag] [GEO.GetNameDefCap] will now become §YInvestment\n  Targets§! for each other"
 TUR_euphrates_decisions_tt: "£decision_icon_small §YUnlocks§! decisions to restrict access to the §HEuphrates§! river\n - This can cause serious economic damage to countries dependant on the river\n - This can cause indirect economic losses for other states in the region"
 TUR_hunt_political_opponents_TT: "We will use security forces to §Rarrest§! our political opponents\n - The targets will primarily be of §CKemalist§! ideology\n - We will be able to advance our agenda of centralizing power\n£text_icon_kaldanger §RWARNING!§! Doing this focus may anger the §HTurkish Armed Forces§!, consult their §Hideological standing§! to see if they support the §CKemalist§! faction"
 TUR_5_gray_wolves_tt: "Ankara:\nWill deploy §H5 Grey Wolves§! units!\n - We will not be able to train, create, or destroy anymore §HGray Wolves§! units\n\n£text_icon_kaldanger The §HGray Wolves§! units can become disloyal and §Rrebel§! against us if change ideology!"
 TUR_oust_bahceli_tt: "The party will organize a palace coup against §HDevlet Bahçeli§! and replace him with a moderate!\n - This will make it easier for us to empower the §HOttoman§! dynasty"
 TUR_empower_clergy_tt: "The §HIslamic Ulema§! will grow in their influence over the state:\n - £decision_icon_small Decisions will unlock that allow us to utilize the §HIslamic Ulema§! for state benefit\n - At times, the §HIslamic Ulema§! will move to act in their own interests, and will at times reduce the modifiers from focuses, decisions, or events that they are against"
 TUR_will_enable_ottoman_tree_tt: "A new branch of focuses related to the\n£TUR_Monarchist  §HOttoman Dynasty§! will be enabled!"
 TUR_behcali_arrested_tt: "§HBahçeli§! will be put under house arrest"

# Decisions

 TUR_domestic_politics_category: "Turkish Politics"
 TUR_domestic_politics_category_desc: "Our policies are shaped by the decision of our leadership. Whenever any important policy, decision, or mission is assigned, it can be found here."
 TUR_dash_across_the_strait: "[TUR.GetFlag] [GRE.GetFlag] A Daring Dash Across the Strait"
 TUR_dash_across_the_strait_desc: "'The waves of the Aegean carry the voice of Turkish history'\n\nWith the era of humiliation finally behind us, it is time that we reclaim an important piece of the Blue Homeland. The Aegean, once a gem of the Turkish nation, is now controlled by Greek usurpers who know little of how to run a state. With due time, they shall be handed a swift defeat."
 TUR_daring_for_crimea: "[TUR.GetFlag] [CRM.GetFlag] [SOV.GetFlag] From Istanbul to Sevastopol"
 TUR_daring_for_crimea_desc: "Our reach from the coasts of the Aegean to the shores of Sevastopol will know no bounds. With the fervor of our men, and the brilliance of our military planners, we will bring the Russian menace to its knees and secure firm control over the entirety of the Black Sea."
 TUR_olive_branch: "[TUR.GetFlag] [SYR.GetFlag] Operation Olive Branch"
 TUR_olive_branch_desc: "'We are in Afrin today, tomorrow we will be in Manbij. The next day we will ensure that terrorists are cleared from the east of the Euphrates till the Iraqi border'\n\nThe Syrian matter is not one of simplicity. Rather, it is the culmination of years of burden placed on the Turkish nation. With a simple, well placed operation, we can settle this matter once and for all."
 TUR_crush_iraq: "Shattering the Iraqi Veil"
 TUR_crush_iraq_desc: "'The province of Mosul is within the national borders of the Turkish state. No one has the right to tear this place away from the motherland and give it to someone else.' - Mustafa Kemal Atatürk\n\nFor far too long, the provinces of Iraq have been separated from the Turkish nation. It is our time to finally shatter the veil of deception and take what is rightfully ours."
 TUR_operation_sun_mission: "Operation Sun"
 TUR_operation_sun_mission_desc: "Without proper measures, PKK insurgents operating out of Iraqi Kurdistan will only continue to launch attacks into the Turkish heartland. The teacher must always use the ruler to bring the unruly student into line, and as such, we will teach the terrorists a lesson that they shall never forget."
 TUR_puk_incursion_into_iran: "[PUK.GetFlag] [PER.GetFlag] Request PUK Incursion Into Iran"
 TUR_puk_incursion_into_iran_desc: "While they cannot do much damage to Iran on their, PUK forces can temporarily thwart Iranian units from fronts that are needed most, thus allowing us to cast some damage indirectly."
 TUR_euphrates_war: "Dam the Euphrates Off"
 TUR_euphrates_war_desc: "We can punish those in the Levant by damming the Euphrates river to apply real pressure and gain an advantage as we see fit."
 TUR_euphrates_war_open: "Re-Open the Euphrates"
 TUR_euphrates_war_open_desc: "We can re-open proper flow to the Euphrates to relieve pressure off of the states in the South."
 TUR_access_ulema_benefits: "Call on the Islamic Ulema"
 TUR_access_ulema_benefits_desc: "We can call upon the clerical class in our country to mobilize popular support for state benefits."

