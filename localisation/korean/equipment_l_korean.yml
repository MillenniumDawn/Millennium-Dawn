 USA_infantry_weapons_1: "M14"
 USA_infantry_weapons_1_desc: "M14 소총(공식 명칭: 미국 7.62mm 구경 M14 소총)은 7.62x51mm NATO(.308인치) 탄약을 사용하는 미국제 선택 사격 소총입니다. 1959년에 미군 표준 제식 소총으로 채택되었으며, 1961년에는 미 육군에서 M1 개런드 소총을 대체했습니다."
 VIE_infantry_weapons_1: "AKM"
 TUR_transport_helicopter_1: "벨 UH-1T 이로쿼이"
 SMA_infantry_weapons_1: "M14"
 SMA_infantry_weapons_1_desc: "M14 소총(공식 명칭: 미국 7.62mm 구경 M14 소총)은 7.62x51mm NATO(.308인치) 탄약을 사용하는 미국제 선택 사격 소총입니다. 1959년에 미군 표준 제식 소총으로 채택되었으며, 1961년에는 미 육군에서 M1 개런드 소총을 대체했습니다."
 BSH_infantry_weapons_1: "AKM"
 BSH_infantry_weapons_1_desc: "1959년에 개발된 AKM은 미하일 칼라시니코프가 개발한 AK-47 소총의 가장 흔한 현대화 변형 모델입니다. 이전 모델보다 훨씬 가볍고 자동 사격 시 정확도가 뛰어납니다."
 CRM_infantry_weapons_1: "AKM"
 CRM_infantry_weapons_1_desc: "1959년에 개발된 AKM은 미하일 칼라시니코프가 개발한 AK-47 소총의 가장 흔한 현대화 변형 모델입니다. 이전 모델보다 훨씬 가볍고 자동 사격 시 정확도가 뛰어납니다."
 TAT_infantry_weapons_1: "AKM"
 TAT_infantry_weapons_1_desc: "1959년에 개발된 AKM은 미하일 칼라시니코프가 개발한 AK-47 소총의 가장 흔한 현대화 변형 모델입니다. 이전 모델보다 훨씬 가볍고 자동 사격 시 정확도가 뛰어납니다."
 AZE_infantry_weapons_2_desc: "The AK-74 is developed from the AKM, and features significant upgrades over its predecessor. Notably, it uses 5.45mm cartridges instead of the then standard Warsaw Pact 7.62mm."
 POR_infantry_weapons_2_desc: "헤클러앤코흐 G3(게베르 3)는 7.62x51mm NATO 구경의 선택 사격식 전투소총으로, 1950년대 서독의 무기 제조업체 헤클러앤코흐(H&K)가 스페인 국영 설계 개발 기관인 CETME와 협력하여 개발했습니다. G3는 1959년부터 FN FAL/G1을 대체하여 표준 소총으로 사용되었으며, 1963년에 개량형 G3A1 모델로 업그레이드될 때까지 운용되었습니다."
 POR_infantry_weapons_3_desc: "The G3A3 is the most well known version of the G3. Designed with new Improved rear Drum sights with an improved front sight, a flash-suppressor/muzzle brake, a fixed solid plastic buttstock, and a plastic handguard that does not contact the free-floating barrel. The handguard came in a slim, ventilated version and a wide version. The latter allows for the attachment of a bipod for improved stability."
 POR_infantry_weapons_4_desc: "헤클러앤코흐 G36(게베르 36)은 5.56x45mm 구경의 돌격소총으로, 1990년대 초 독일 무기 제조업체 헤클러앤코흐에서 더 무거운 7.62x51mm G3 모델을 대체하기 위해 개발되었습니다. 1990년대 중반 독일 연방군에 채택되어 G3를 대체했으며, 이후 수출용으로도 인기를 얻어 독일, 스페인, 영국 등 여러 국가의 군대와 경찰에서 실전에 투입되었습니다."
 POR_infantry_weapons_5_desc: "G36A2 모델은 G36 모델의 개량형입니다. G36A2는 기존의 듀얼 컴뱃 사이팅 시스템의 레드닷 조준경을 대체하는, 피카티니 레일에 장착된 탈착식 자이스 RSA 반사식 레드닷 조준경을 특징으로 합니다. G36A2 업그레이드 키트에는 더 짧은 G36C 개머리판, 옵션으로 4개의 피카티니 레일을 장착할 수 있는 알루미늄 재질의 새로운 핸드가드, 그리고 오를리콘 콘트라베스 LLM01 레이저 라이트 모듈 작동 스위치가 내장된 수직형 포어그립이 포함됩니다."
 POR_infantry_weapons_6_desc: "The Heckler & Koch HK416 is a gas-operated assault rifle chambered for the 5.56x45mm NATO cartridge. It is designed and manufactured by the German company Heckler & Koch. Although the design is based on the AR-15 class of firearm, it uses a proprietary short-stroke, gas piston system from Heckler & Koch's earlier G36 family of rifles. The HK416 is also equipped with a proprietary accessory rail forearm with rails on all four sides to accommodate multiple accessories."
 LUX_infantry_weapons_2_desc: "헤클러앤코흐 G3(게베르 3)는 7.62x51mm NATO 구경의 선택 사격식 전투소총으로, 1950년대 서독의 무기 제조업체 헤클러앤코흐(H&K)가 스페인 국영 설계 개발 기관인 CETME와 협력하여 개발했습니다. G3는 1959년부터 FN FAL/G1을 대체하여 표준 소총으로 사용되었으며, 1963년에 개량형 G3A1 모델로 업그레이드될 때까지 운용되었습니다."
 LUX_infantry_weapons_3_desc: "M16A2 소총의 개발은 원래 미 해병대가 베트남 전쟁에서 XM16E1과 M16A1 소총을 사용해 얻은 전투 경험을 바탕으로 요청한 것이었습니다. 이 소총은 1982년 국방부에서 \"미군 5.56mm 소총 M16A2\"로 공식 채택되었습니다. 미 해병대는 1980년대 초중반에 이 소총을 미군 최초로 도입했으며, 미 육군은 1980년대 후반에 뒤이어 도입했습니다."
