l_french:
 Republic_of_Lakota_focus: "Priorités nationales lakotas"
 LKT_Sakakawea_capital: "A fait de §YSakakawea§! la capitale"
 LKT_Sakakawea_capital_name: "Sakakawea"
 LKT_Pierre_capital: "A fait de §YPierre§! la capitale"
 LKT_Pierre_capital_name: "Pierre"
 LKT_Fort_Nakanin_capital: "A fait de §YFort Nakanin§! la capitale"
 LKT_Fort_Nakanin_capital_name: "Fort Nakanin"
 LKT_New_Cheyenne_capital: "A fait de §YNew Cheyenne§! la capitale"
 LKT_New_Cheyenne_capital_name: "New Cheyenne"
 LKT_Old_Cheyenne_capital_name: "Old Cheyenne"
 LKT_decisions_war_time_mobilization_category: "Mobilisation en temps de guerre"
 LKT_decisions_war_time_mobilization_category_desc: "En cas de besoin, nous pouvons former une légion de volontaires pour combler les lacunes. La guerre viendra, et nous devons être prêts."
 LKT_war_time_mobilization: "1re vague de mobilisation"
 LKT_war_time_mobilization_desc: "L'appel aux armes retentit. Nous devons défendre nos foyers. Aux armes, citoyens !"
 LKT_war_second_wave_defenders: "2e vague de défenseurs"
 LKT_war_second_wave_defenders_desc: "L'ennemi avance. Nous devons lever une nouvelle vague de soldats, même au prix du moral national."
 LKT_war_desperate_defenders: "Défenseurs désespérés"
 LKT_war_desperate_defenders_desc: "La situation est critique. Tous les citoyens valides doivent tenir la ligne. Peut-être pourrons-nous encore gagner."
 LKT_ideas_economic_development_commission: "Commission de développement économique"
 LKT_ideas_economic_development_commission_desc: "Grâce à l'union entre le Front de réclamation et le gouvernement, une commission économique a été créée pour structurer notre économie. Ensemble, nous bâtissons l'avenir de notre nation."
 LKT_event.1.t: "Le chef du gouvernement"
 LKT_event.1.d: "Sans intention d'expansion vers le nord, la sécurité de notre capitale repose sur nos quatre États les plus septentrionaux : les Dakota, le Montana et le Wyoming. Certains s'y opposent, craignant un éloignement des centres de décision. Mais nous ne pouvons nous laisser distraire. Faut-il un nom traditionnel ou autochtone pour la capitale ? Les quatre États candidats se préparent à convaincre le comité."
 LKT_event.1.o1: "N'est-ce pas ce qui a causé notre effondrement ?"
 LKT_event.2.t: "Un débat crucial"
 LKT_event.2.d: "Nos quatre candidats sont divisés entre tradition et influences autochtones. Le Montana propose Fort Nakanin, inspiré des réserves nakoda et a'ananin. Le Dakota du Nord opte pour Sakakawea, du nom du fleuve. Le Dakota du Sud mise sur Pierre, facile à intégrer à un district fédéral. Enfin, le Wyoming propose New Cheyenne, remplaçant l'ancienne capitale, Old Cheyenne, symbole de renouveau."
 LKT_event.2.o1: "Sakakawea"
 LKT_event.2.o2: "Pierre"
 LKT_event.2.o3: "Fort Nakanin"
 LKT_event.2.o4: "New Cheyenne"
 LKT_event.3.t: "Audit du Sud"
 LKT_event.3.d: "Après avoir stabilisé la nation, nous enquêtons sur le « Front de réclamation », qui prétend nous aider. Qui sont ces gens qui ont quitté leurs foyers pour s'installer ici ? Nous attendons les rapports avant d'agir."
 LKT_event.3.o1: "Ça ne peut pas être si grave, non ?"
 LKT_event.4.t: "Premiers rapports"
 LKT_event.4.d: "Les résultats sont mitigés. Certains confirment que le FR est bien un groupe d'autochtones fuyant la République du Sud. Le Kansas prospère grâce à eux. Mais d'autres rapportent des activités criminelles et mafieuses. Nous devons prendre une décision lourde de conséquences."
 LKT_event.4.o1: "Des criminels, rien de plus !"
 LKT_event.4.o2: "Attendons avant de juger."
 LKT_event.5.t: "Une offre qu'ils ne peuvent refuser"
 LKT_event.5.d: "Face aux activités illégales du FR, un auditeur leur a proposé un marché : modérez vos actions et laissez le gouvernement prendre le crédit. Réponse du FR : « Nous sommes pacifiques et offensés par ces accusations. Nous ne sommes pas des gangsters. » L'auditeur a été expulsé. Nos craintes étaient fondées."
 LKT_event.5.o1: "Ils abusent de notre tolérance !"
 LKT_event.6.t: "Rassembler la nation"
 LKT_event.6.d: "L'agitation grandit au Kansas. Le FR et des dirigeants locaux se rebellent. Les États du Nord se mobilisent. Il est temps d'agir."
 LKT_event.6.o1: "Cette nation est la nôtre, pas la leur !"
 LKT_event.7.t: "Rébellion ouverte"
 LKT_event.7.d: "Les traîtres ont hissé le drapeau du Kansas et déclaré son indépendance. Organisons nos troupes avant que nos voisins ne voient notre faiblesse."
 LKT_event.7.o1: "Sonner le rassemblement !"
 LKT_event.8.t: "En guerre !"
 LKT_event.8.d: "La nation est mobilisée. Nous marchons vers le sud pour chasser ces traîtres. Assez de mensonges et de trahisons !"
 LKT_event.8.o1: "En avant !"
 LKT_event.9.t: "Ils ne nous laissent pas le choix"
 LKT_event.9.d: "Ils nous traitent de voleurs et de criminels. Nous nous défendrons, pour le Kansas et pour la vraie liberté !"
 LKT_event.9.o1: "Nous combattons pour notre liberté !"
 LKT_event.5000.t: "Enquêtes approfondies"
 LKT_event.5000.d: "Les rapports montrent que les accusations contre le FR sont infondées. Des négociations commencent pour relancer l'économie et unir le peuple."
 LKT_event.5000.o1: "Heureusement que nous avons creusé !"
 LKT_event.5001.t: "Plans futurs"
 LKT_event.5001.d: "Les investissements portent leurs fruits. L'économie se développe plus vite que prévu. Créons une commission pour garantir une croissance équilibrée."
 LKT_event.5001.o1: "Vers la prospérité !"
 LKT_event.5002.t: "La commission"
 LKT_event.5002.d: "Les négociations ont abouti à la création de la « Commission de développement économique ». Elle assurera une croissance harmonieuse pour les générations futures."
 LKT_event.5002.o1: "Unis nous resterons, divisés nous ne serons plus jamais !"
 LKT_organizing_the_farmers: "Organisation des agriculteurs"
 LKT_organizing_the_farmers_desc: "Nous n'avons pas grand-chose, mais ce que nous avons, nous devons le rallier et le préparer pour le moment où nous pourrions en avoir besoin."
 LKT_creating_infantry_reserves: "Création des réserves d'infanterie"
 LKT_creating_infantry_reserves_desc: "Assaillis par des adversaires tout autour de nous, nous devons nous attendre au pire. Créons une force de réserve prête pour que le moment venu, nous puissions être prêts pour l'ennemi."
 LKT_mobilizing_the_reserves: "Mobilisation des réserves"
 LKT_mobilizing_the_reserves_desc: "Les temps sont proches et nous devons assurer la sécurité de nos chers citoyens. Rallions les réserves et partons défendre nos foyers."
 LKT_focus_a_capital_conundrum: "Un casse-tête capital"
 LKT_focus_a_capital_conundrum_desc: "Puisque les frontières limitées qui forment notre nation nous imposent une unité solide, nous devons chercher un lieu que nous pourrons appeler notre capitale. C'est vers le nord que nous nous tournons, espérant une solution."
 LKT_focus_montana_monster: "Monstre du Montana"
 LKT_focus_montana_monster_desc: "La reconstruction a enfin commencé : notre nation doit pouvoir se servir et se nourrir avant même de penser à autre chose. L'agriculture sera donc la priorité de ces premiers jours."
 LKT_focus_montana_marvel: "La merveille du Montana"
 LKT_focus_montana_marvel_desc: "Des haillons à la richesse, ou du moins des estomacs vides aux estomacs pleins. Nous pouvons donc commencer à déployer nos services civils et municipaux pour aider à stabiliser la société dans l'État et apporter une nouvelle paix à ces terres."
 LKT_focus_northern_troubles: "Troubles du Nord"
 LKT_focus_northern_troubles_desc: "Les Dakota, comme la plupart de notre nation, sont très peu peuplés et peu développés malgré les chiffres de population de certains États. Quoi qu'il en soit, nous devons solidifier nos territoires frontaliers du nord avant que des opportunistes n'essaient de les prendre, sans parler de ceux qui tentent de partir, ce qui serait aussi une grande perte. Pour l'instant, mettons simplement une économie en marche."
 LKT_focus_our_northern_light: "Notre lumière du Nord"
 LKT_focus_our_northern_light_desc: "Avec le retour d'une stabilité économique et les débuts d'une stabilité sociale au Dakota du Nord, nous pouvons commencer à étendre les services d'urgence et civils locaux. De là, nous pourrons élargir le domaine de contrôle de notre jeune nation."
 LKT_focus_yellowstone_yelling: "Les cris de Yellowstone"
 LKT_focus_yellowstone_yelling_desc: "Les terres crient : le chaos et le danger y règnent. Nous devons lancer une initiative pour ramener la paix et le calme dans ces contrées. Il n'y a pas beaucoup de monde dans l'État, ce qui signifie encore moins de développement et de ressources. Mais le peuple doit avoir quelque chose, et nous lui donnerons de la nourriture."
 LKT_focus_worland_wonder: "La merveille de Worland"
 LKT_focus_worland_wonder_desc: "Enfin un semblant de paix a été restauré, et avec lui les services civils et autres commodités municipales peuvent revenir, ramenant la cohésion sociale à davantage de notre nation. Bientôt nous pourrons vraiment jouir d'un endroit que nous appellerons chez nous."
 LKT_focus_southern_turmoil: "Troubles du Sud"
 LKT_focus_southern_turmoil_desc: "De l'abîme du désespoir, nous ramenons à la surface ce que nous pouvons réparer. Avec une économie et de la nourriture sur les tables, nous avançons. Notre peuple a besoin de nous en ces heures de destin."
 LKT_focus_rapid_city_revival: "Renaissance rapide de la ville"
 LKT_focus_rapid_city_revival_desc: "Assez de rimes. Vous avez bâti une sorte d'économie : déployez maintenant l'administration gouvernementale et les services civils pour restaurer la cohésion sociale et reconquérir la solidarité d'une autre partie de votre nation."
 LKT_focus_industry_what_industry: "Industrie, quelle industrie ?"
 LKT_focus_industry_what_industry_desc: "Malgré ce que beaucoup aiment prétendre, nous avons bel et bien une certaine puissance industrielle… ce n'est pas grand-chose, mais c'est quelque chose. Cela nous aide au moins à stabiliser et diversifier notre composition économique."
 LKT_focus_nebraska_neck_breaker: "Coupe-cou du Nebraska"
 LKT_focus_nebraska_neck_breaker_desc: "La nation est blessée : nous devons soigner ses plaies. Restaurer une base économique permettra aux gens de se rassembler et de relancer la société telle que nous la connaissons."
 LKT_focus_from_broken_bow_to_fixed: "De l'arc brisé à l'arc réparé"
 LKT_focus_from_broken_bow_to_fixed_desc: "Les plaies se ferment mais les cicatrices restent. Il faudra du temps pour guérir pleinement et dépasser le passé, mais nous pouvons le faire, un morceau à la fois."
 LKT_focus_kansas_city_catastrophe: "Catastrophe de Kansas City"
 LKT_focus_kansas_city_catastrophe_desc: "Kansas City, Kansas : un lieu plein de gens, de choses à faire et de choses à sortir de leur contexte. Une étincelle a été allumée et la ville s'est embrasée de plus que des huées et des acclamations. Nous devons ramener ce qui a été perdu et tracer une nouvelle voie vers le renouveau."
 LKT_focus_the_kansas_city_kitty: "Le Kansas City Kitty"
 LKT_focus_the_kansas_city_kitty_desc: "Maintenant que l'économie existe, eh bien, nous pouvons reprendre le rythme. On dit que le club est ouvert dans la rue principale, et nous pourrons danser toute la nuit comme autrefois."
 LKT_focus_the_new_republic: "La nouvelle république"
 LKT_focus_the_new_republic_desc: "Des cendres de l'ancien s'élève du neuf. Nous partons maintenant à la découverte de nous-mêmes et de l'avenir que nous voulons forger."
 LKT_focus_new_elections_begin: "De nouvelles élections commencent"
 LKT_focus_new_elections_begin_desc: "Le moment est venu de poser nos fondations politiques. En tenant notre première élection nationale, nous donnons à notre peuple les moyens de tirer ses propres conclusions et de prendre en main le destin qu'il désire."
 LKT_focus_the_councils_of_authority: "Les conseils d'autorité"
 LKT_focus_the_councils_of_authority_desc: "Par un retournement intéressant, l'un des nombreux partis presque « oligarchiques » a remporté l'élection. La vraie question est maintenant de savoir ce que ces partis prévoient pour la nation. Le terme d'oligarchie est une distinction si lourde que cela ne présage rien de bon. À quoi pensait le peuple ?"
 LKT_focus_DDP_political_plan: "Le plan politique du Dakota Democracy Party"
 LKT_focus_DDP_political_plan_desc: "Au terme des premières élections, le Dakota Democracy Party a remporté la victoire. Ils prévoient maintenant de mettre en œuvre leurs politiques pour façonner la nation et son peuple en ces jours précoces et incertains."
 LKT_focus_skill_assessment_fairs: "Salons d'évaluation des compétences"
 LKT_focus_skill_assessment_fairs_desc: "Les SAF sont des événements parrainés par le fédéral, conçus pour que la population apprenne et comprenne ses compétences dans tous les domaines. Cela nous aide à employer des individus et nous donne une meilleure prise sur les talents que nous avons dans la nation."
 LKT_focus_light_industry_investment: "Investissements dans l’industrie légère"
 LKT_focus_light_industry_investment_desc: "Établir des industries limitées mais significatives donnera une exposition passive à de nouveaux métiers et emplois. Ce n'est pas grand-chose, mais c'est un travail honnête, comme on dit."
 LKT_focus_business_taxes_redraft: "Refonte des taxes professionnelles"
 LKT_focus_business_taxes_redraft_desc: "En concluant une première refonte fiscale des entreprises individuelles, nous poserons un nouveau plancher pour que nos politiques fiscales puissent réellement s'appliquer. Notre économie n'a pas beaucoup de spécificités ; alourdir trop les entreprises par des impôts d'entreprise uniformes aurait sans doute un effet négatif sur nos recettes."
 LKT_focus_education_streamlining: "Rationalisation de l'éducation"
 LKT_focus_education_streamlining_desc: "Simplifier le programme autour des fondamentaux dont les élèves ont besoin au quotidien nous permettra d'améliorer la gestion des classes, ainsi que de réformer le programme à l'avenir."
 LKT_focus_basic_arms_industry_investment: "Investissement de base dans l'industrie de l'armement"
 LKT_focus_basic_arms_industry_investment_desc: "Notre nation est clairsemée et sous-développée. Nous serons vus comme une cible facile par beaucoup, et si nous ne voulons pas l'être, pour développer de telles ambitions militaristes si tôt, nous devons en créer la raison. Nous poserons donc les bases d'une fabrication d'armes locale pour soutenir la chasse et entretenir l'armement de nos forces permanentes."
 LKT_focus_extensive_geological_surveys: "Études géologiques approfondies"
 LKT_focus_extensive_geological_surveys_desc: "Par des recherches et relevés étendus des terres perçues comme à « gisements de faible valeur », nous pouvons commencer à transformer ces dépôts minuscules en quelque chose de significatif. Ce sera coûteux au début, mais les bénéfices à long terme et la sécurité de notre indépendance nationale valent le prix."
 LKT_focus_KCK_political_plan: "Le plan politique de la KCK"
 LKT_focus_KCK_political_plan_desc: "La Kansas City Koalition est un collectif de chefs d'entreprise et de figures politiques qui veulent remettre la nation sur les rails aussi vite que raisonnablement possible. Leurs priorités sont la stabilité économique et la gestion de la population après le « Grand Effondrement »."
 LKT_focus_zoning_reforms: "Réformes de zonage"
 LKT_focus_zoning_reforms_desc: "Permettre une approche plus souple et différente du zonage traditionnel devrait rendre nos villes et villages plus adaptables aux besoins de nos citoyens et de l'économie en général."
 LKT_focus_integrated_health_plans: "Plans de santé intégrés"
 LKT_focus_integrated_health_plans_desc: "Incorporer des plans de santé obligatoires fournis dans les entreprises permettra des embauches plus souples ainsi qu'un alignement des besoins des employés sur les exigences du lieu de travail."
 LKT_focus_regulatory_cutbacks: "Réductions réglementaires"
 LKT_focus_regulatory_cutbacks_desc: "Supprimer de nombreuses réglementations fastidieuses et contre-productives permettra aux entreprises de mieux soutenir la nation et les gens qu'elles emploient."
 LKT_focus_national_employment_commission: "Commission nationale de l'emploi"
 LKT_focus_national_employment_commission_desc: "La NEC est un organisme national chargé de chercher de la main-d'œuvre intérieure et voisine étrangère pour pourvoir les emplois et bâtir une économie plus stable et équilibrée. Chasser des travailleurs étrangers sera un peu délicat, mais nos frères et sœurs du continent seront traités comme des citoyens ordinaires, le but du programme étant que l'économie ne dépasse pas la main-d'œuvre disponible."
 LKT_focus_ensuring_military_stockpiles: "Assurer les stocks militaires"
 LKT_focus_ensuring_military_stockpiles_desc: "La défense nationale est importante, mais pour réellement défendre sa nation il faut d'abord l'équipement. Une expansion avec la NEC nous permettra d'employer plus de gens dans les usines pour créer ces stocks afin que l'armée et l'armée de l'air puissent défendre notre nation d'intérêts malséants."
 LKT_focus_LTP_political_plan: "Le plan politique du LTP"
 LKT_focus_LTP_political_plan_desc: "Le Lakotan Technocratic Party est un parti de progrès et d'innovation. Axé sur l'éducation, la R&D ainsi que la création de l'environnement économique pour financer de telles entreprises, le LTP espère créer une nation qui s'efforce de faire mieux, et de trouver encore comment faire mieux."
 LKT_focus_mandatory_education_programs: "Programmes d'éducation obligatoire"
 LKT_focus_mandatory_education_programs_desc: "Les MEP sont des programmes conçus pour pousser les limites de l'éducation au-delà du simple parcours scolaire. Des programmes indépendants hors du standard encouragent de nouvelles opportunités pour les gens, quel que soit leur âge."
 LKT_focus_the_means_of_efficiency: "Les moyens de l'efficacité"
 LKT_focus_the_means_of_efficiency_desc: "Notre nation est peu peuplée et nous devons nous adapter à cette réalité. Nous devons donc saisir les moyens de l'efficacité et faire avec ce que nous avons."
 LKT_focus_ends_of_a_means: "Fins d'un moyen"
 LKT_focus_ends_of_a_means_desc: "Nous avons accès à une ressource de base : le minerai de fer. Nous pouvons le transformer en acier, pièce fondamentale du puzzle économique moderne. Nous devons donc investir lourdement dans l'extraction de cette ressource si nous voulons un véritable tremplin vers l'autosuffisance."
 LKT_focus_economic_expansion_act: "Loi sur l'expansion économique"
 LKT_focus_economic_expansion_act_desc: "Des développements industriels généraux permettront d'élargir notre base économique. Cela devrait à son tour nous permettre de constituer plus de capital pour de nouveaux investissements."
 LKT_focus_peoples_defense_act: "La loi de défense du peuple"
 LKT_focus_peoples_defense_act_desc: "La PDA est un programme de défense nationale limité qui a créé des opportunités industrielles et de sous-traitance limitées pour donner à notre nation les moyens d'équiper nos soldats."
 LKT_focus_militarized_politics_plan: "Plan de politisation militarisée"
 LKT_focus_militarized_politics_plan_desc: "La nation étant divisée sur la voie à suivre, des éléments de l'AFL, les Forces armées de Lakota, ont saisi l'initiative et ont d'une manière ou d'une autre obtenu une majorité pour gagner cette première élection. Beaucoup doutent qu'ils gagneraient une élection moins clivante ; d'autres encore sont simplement contents d'avoir une direction plutôt que d'errer dans l'inconnu."
 LKT_focus_national_conscription_period: "Période de conscription nationale"
 LKT_focus_national_conscription_period_desc: "En raison de notre population extrêmement faible par rapport à nos voisins côtiers, nous devons introduire une période de conscription obligatoire d'au moins six mois. Beaucoup désapprouveront, mais si nous voulons vraiment nous concentrer sur la défense nationale et nous préparer à toute farce des autres puissances, nous devons le faire."
 LKT_focus_military_classroom_standards: "Normes scolaires militaires"
 LKT_focus_military_classroom_standards_desc: "En incorporant des exigences simples comme la condition physique et des connaissances de base sur les formations et les petites unités, nous pouvons créer une forme souple d'instruction de base qui prépare les futurs conscrits à leur période de service obligatoire."
 LKT_focus_basic_economic_investments: "Investissements économiques de base"
 LKT_focus_basic_economic_investments_desc: "Si nous voulons une chance de nous défendre, nous devons réellement avoir les moyens de soutenir de telles entreprises. Nous créerons donc des projets d'expansion industrielle limités."
 LKT_focus_military_industrial_sector: "Secteur militaro-industriel"
 LKT_focus_military_industrial_sector_desc: "Le MIS est notre forme de complexe militaro-industriel. La différence clé est que ces usines seront polyvalentes, construites pour l'adaptabilité : elles contribueront encore à l'économie civile en temps de paix, mais pourront facilement se convertir et accélérer la production de matériel de guerre le moment venu."
 LKT_focus_less_for_more: "Moins pour plus"
 LKT_focus_less_for_more_desc: "Investir pour que moins de main-d'œuvre soit utilisée dans chaque entreprise et secteur libère davantage pour l'armée et l'expansion économique. Notre population est aussi abominablement petite par rapport au reste du continent. Nous investirons donc dans la production alimentaire, les chaînes d'approvisionnement, et saisirons les moyens de la reproduction afin que nos citoyens puissent vivre et aimer comme ils l'entendent."
 LKT_focus_general_military_improvements_funding: "Financement des améliorations militaires générales"
 LKT_focus_general_military_improvements_funding_desc: "Le GMIF est un paquet de financement robuste pour permettre à notre armée de s'améliorer selon ce que nous jugeons nécessaire pour les champs de bataille potentiels. L'air étant la plus grande menace, nous répartirons pour l'instant les investissements également entre l'armée de l'air et l'armée de terre."
 LKT_focus_the_parties_for_tradition: "Les partis pour la tradition"
 LKT_focus_the_parties_for_tradition_desc: "Un ensemble de partis du centre-droit à la droite plus franche se rassemblent pour former un bloc de vote connu comme les Partis pour la tradition. Il sera curieux de voir vers quel parti le peuple gravitra lors de la première élection de la nation."
 LKT_focus_ORP_political_plan: "Le plan politique de l'ORP"
 LKT_focus_ORP_political_plan_desc: "L'Old Republic Party s'appuie sur une plateforme de stabilité et de prudence. Cette plateforme peut être vue comme le lent et sûr qui gagne la course, et vu la situation de notre nation, beaucoup n'auraient pas voté pour eux s'ils avaient sauté le pas comme certains partis."
 LKT_focus_strategic_mechanization_act: "Loi sur la mécanisation stratégique"
 LKT_focus_strategic_mechanization_act_desc: "La surdépendance de notre économie à l'agriculture, d'une manière ou d'une autre, signifie que beaucoup de gens y sont liés. Malgré le tollé que cela peut créer, nous devons imposer une forme de mécanisation afin de mieux répartir la main-d'œuvre disponible."
 LKT_focus_better_neighbors_act: "Loi sur de meilleurs voisins"
 LKT_focus_better_neighbors_act_desc: "Le secteur économique principal étant l'agriculture, l'abondance alimentaire n'est pas rare. Nous pouvons donc inciter des « demandeurs d'asile » de nos nations voisines à relancer la population et aider à reconstruire notre économie. Les emplois ne valent rien sans des gens pour les occuper."
 LKT_focus_green_thumb_officers_act: "Loi sur les officiers à la main verte"
 LKT_focus_green_thumb_officers_act_desc: "La loi GTO est conçue pour améliorer le financement des forces de l'ordre ainsi que pour mieux répartir les ressources vers les quartiers et les moyens de subsistance des régions plus isolées."
 LKT_focus_kansas_economic_upgrade: "Modernisation économique du Kansas"
 LKT_focus_kansas_economic_upgrade_desc: "Une zone de développement importante est notre État le plus méridional, le Kansas. Malgré tout son développement, il a une dépendance agricole plus élevée que prévu. Par des investissements généreux, nous prévoyons de convertir une partie de la grande économie agricole en un mélange d'industrie légère et lourde."
 LKT_focus_better_budgeting_act: "Loi sur une meilleure budgétisation"
 LKT_focus_better_budgeting_act_desc: "La Better Budgeting Act reprend le budget de l'éducation existant et en fait un audit complet et détaillé pour mieux allouer les ressources fiscales. Nous prévoyons d'améliorer les normes éducatives en réduisant autant que possible l'incohérence que les échecs budgétaires peuvent avoir sur les élèves et le personnel."
 LKT_focus_experimental_extractions_act: "Loi sur les extractions expérimentales"
 LKT_focus_experimental_extractions_act_desc: "Notre nation manque d'une offre d'acier de base ou même d'un minerai de fer décent. Des relevés géologiques et un investissement lourd, indépendamment de la rentabilité nette, seront donc menés dans le Kansas et le Nebraska pour assurer l'accès à ce pilier de l'économie moderne."
 LKT_focus_GLP_political_plan: "Le plan politique du Great Liberal Party"
 LKT_focus_GLP_political_plan_desc: "Des politiques libérales modérées pour améliorer notre agriculture soutiendront notre nation et son peuple. Beaucoup ont voté pour le Great Liberal Party parce qu'il était vu comme un parti de progrès lent, de changements auxquels les gens pouvaient s'adapter. Seul le temps dira si cela restera vrai."
 LKT_focus_food_bank_securities_act: "La loi Food Bank Securities"
 LKT_focus_food_bank_securities_act_desc: "La loi FBS crée des obligations d'État et des obligations d'investissement privé destinées à l'achat d'aliments courants. Ces « banques alimentaires » aideront les familles à obtenir le quotidien qu'elles ne peuvent pas se permettre en temps de besoin. Les associations caritatives stables qui aident à nourrir les sans-abri et autres citoyens pauvres pourront aussi demander de tels titres, mais seront accompagnées de régulateurs fédéraux pour s'assurer que l'argent et les denrées servent aux fins prévues."
 LKT_focus_audit_commissions_act: "Loi sur les commissions d'audit"
 LKT_focus_audit_commissions_act_desc: "L'ACA, ou loi d'audit, établit une commission indépendante d'auditeurs pour s'assurer que les agences fédérales et le personnel allouent les ressources fiscales et matérielles aux fins listées. Cet organe sera composé de personnes non associées à une institution ou un parti politique, issues de la finance et de la régulation, pour garantir l'impartialité."
 LKT_focus_raw_value_act: "La loi Raw Value"
 LKT_focus_raw_value_act_desc: "Notre nation ne peut tirer qu'une valeur limitée de l'agriculture. Les gens veulent des choses, et les choses exigent des ressources minérales : nous investirons donc dans des mines d'éléments de terres rares et d'autres minéraux de haute valeur pour diversifier notre portefeuille national, faute de meilleur mot."
 LKT_focus_improving_immigration_processes: "Améliorer les processus d'immigration"
 LKT_focus_improving_immigration_processes_desc: "En investissant pour améliorer les ressources dédiées au contrôle de l'immigration et au processus général pour devenir citoyen, nous pouvons espérer un appel plus fluide et plus fort aux ressortissants étrangers. L'espoir est qu'ils choisissent notre nation comme nouveau foyer et que nous leur donnions un nouveau départ."
 LKT_focus_invest_care_act: "La loi Invest Care"
 LKT_focus_invest_care_act_desc: "Invest Care est une initiative budgétaire pour un financement plus constant des services médicaux. Avec ces efforts, nous espérons relever le moral des employés, encourager de futurs emplois, et nous assurer que les bâtiments sont aux normes et que l'équipement fonctionne. Votre santé est notre investissement : un meilleur peuple, c'est une meilleure nation."
 LKT_focus_national_defense_upgrades: "Modernisations de la défense nationale"
 LKT_focus_national_defense_upgrades_desc: "De meilleurs investissements dans l'équipement et la familiarisation du personnel avec celui-ci augmenteront notre capacité à défendre la nation contre les actes d'agression étrangers."
 LKT_focus_TTP_political_plan: "Plan politique TTP"
 LKT_focus_TTP_political_plan_desc: "Le Parti des traditions tribales est un parti semi-nativiste, mais pas au degré que beaucoup supposent. Le nativisme tient à l'idée que, si ces terres furent jadis tribales, pour avancer, préserver et survivre, nous devons nous unir en une seule nation de nombreux peuples. La tradition sert l'unité : famille, communauté et principes auxquels nous entendons rester fidèles."
 LKT_focus_defense_spending_program: "Programme de dépenses de défense"
 LKT_focus_defense_spending_program_desc: "Le DSP est un programme de dépenses conçu pour préparer la nation à une posture plus défensive. Nos terres sont à la fois ouvertes et fermées sur de vastes étendues : nous devons tirer parti de ces terrains."
 LKT_focus_families_security_stipend: "Allocation de sécurité des familles"
 LKT_focus_families_security_stipend_desc: "L'allocation familiale, comme on l'appelle, est une aide que les familles peuvent demander pour alléger les tensions économiques liées aux besoins du foyer. Nourriture, vêtements et garde d'enfants sont couverts, ainsi qu'une liste d'autres articles enregistrés sur la carte d'allocation fédérale."
 LKT_focus_food_supply_mandate: "Mandat d’approvisionnement alimentaire"
 LKT_focus_food_supply_mandate_desc: "Notre peuple vit sur des terres fertiles, qui devraient aisément nourrir ceux qui y demeurent. Nous investirons et créerons un mandat pour que nos citoyens aient toujours, autant que possible, une nourriture bon marché et de qualité à chaque repas : la survie même de la nation dépend de notre approvisionnement alimentaire."
 LKT_focus_limited_industrialization_efforts: "Efforts d’industrialisation limités"
 LKT_focus_limited_industrialization_efforts_desc: "Pour diversifier l'économie et assurer un marché de l'emploi sain et robuste, nous devons investir dans un développement industriel limité afin que nos ressources humaines soient aussi diverses que ces terres le permettent."
 LKT_focus_setting_up_new_contracts: "Mise en place de nouveaux contrats"
 LKT_focus_setting_up_new_contracts_desc: "Créer une base limitée de capacités de fabrication militaire nous donnera au moins une mesure des besoins auxquels nous pourrions faire face si la guerre éclatait sur le continent nord-américain."
 LKT_focus_strategic_mining_operations: "Opérations minières stratégiques"
 LKT_focus_strategic_mining_operations_desc: "Notre nation a des ressources, mais il faut investir assez lourdement pour obtenir des minerais plus précieux ou à plus grande portée économique. Nous investirons donc dans l'extraction de métaux précieux au Wyoming et dans des opérations limitées de métaux légers au Dakota du Sud. Ce ne sera pas grand-chose, mais un financement R&D complémentaire devrait payer à terme."
 LKT_focus_LTSP_political_plan: "Plan politique LTSP"
 LKT_focus_LTSP_political_plan_desc: "Le Parti lakotais de la tradition et de la solidarité est un parti conservateur assez générique. Axé sur la communauté et la famille pour nourrir l'unité nationale, beaucoup se demandent pourquoi ce parti et d'autres conservateurs similaires existent encore dans un état aussi fragmenté."
 LKT_focus_community_improvement_programs: "Programmes d'amélioration communautaire"
 LKT_focus_community_improvement_programs_desc: "Les PIC visent à assurer un travail de proximité et des améliorations générales pour rassembler les communautés et encourager le développement des zones plus petites ou plus rurales."
 LKT_focus_farming_expansion_efforts: "Efforts d’expansion agricole"
 LKT_focus_farming_expansion_efforts_desc: "La stabilité de notre nation repose sur l'abondance de terres fertiles : nous les développerons pour encourager notre peuple à grandir avec les champs qu'il cultive."
 LKT_focus_building_to_new_heights: "Construire vers de nouveaux sommets"
 LKT_focus_building_to_new_heights_desc: "Les secteurs des bureaux et de la tech doivent s'étendre. Pour diversifier correctement notre économie et le potentiel de nos citoyens, nous devons investir dans de nouveaux développements et dans l'éducation qui les soutient."
 LKT_focus_manufacturing_new_industries: "Fabrication de nouvelles industries"
 LKT_focus_manufacturing_new_industries_desc: "Développer la base de notre économie est fondamental pour toute expansion générale."
 LKT_focus_securing_armaments: "Sécuriser les armements"
 LKT_focus_securing_armaments_desc: "Pouvoir ravitailler nos troupes est primordial pour la défense nationale. N'attendant rien de immédiat, nous commencerons petit et développerons quelques usines pour les pénuries d'équipement de base."
 LKT_focus_natural_resources_act: "La loi sur les ressources naturelles"
 LKT_focus_natural_resources_act_desc: "Un vaste programme minier bien équilibré, destiné à révolutionner les capacités en ressources de la nation. Coûteux, il s'amortira avec le temps."
 LKT_focus_the_common_folk_progress_parties: "Les partis du progrès du peuple"
 LKT_focus_the_common_folk_progress_parties_desc: "Les partis du peuple, comme certains préfèrent appeler les formations socialistes économiques montantes, sont un groupe qui, d'une façon ou d'une autre, estime devoir gagner du terrain pour que l'« extrême droite » n'en gagne pas. Quelles que soient les excuses des responsables, beaucoup voient ces partis comme une vision plus commune de la nation, car la plupart des terres ne sont pas développées et le « grand capital » n'existe guère au sens traditionnel."
 LKT_focus_FPP_political_plan: "Le plan politique du PPA"
 LKT_focus_FPP_political_plan_desc: "Parti travailliste des agriculteurs, le Parti du progrès agricole s'appuie sur des principes socialistes démocratiques pour une nation de fermiers. Au lieu des ouvriers industriels, l'accent est mis sur l'amélioration des travailleurs agricoles. Vu la composition de notre économie, il n'est pas étonnant qu'il ait gagné l'élection."
 LKT_focus_american_asylum_act: "Loi d'asile « américaine »"
 LKT_focus_american_asylum_act_desc: "La loi triple A, comme on l'appelle, est une politique de frontières quasi ouvertes. Ceux qui peuvent prouver qu'ils ont longtemps vécu sur les territoires de l'ancienne république obtiendront l'asile. Cette reprise de la devise de la statue de la Liberté à l'est est un bon moyen d'attirer des gens et de faire croître l'économie en remplissant des emplois plus nombreux que les bras disponibles."
 LKT_focus_expanded_health_services: "Services de santé élargis"
 LKT_focus_expanded_health_services_desc: "Améliorer nos capacités sanitaires et pouvoir atteindre quiconque en un temps raisonnable assurera les taux de survie et la santé globale de nos citoyens."
 LKT_focus_fine_tuning_industrial_regulations: "Affinage de la réglementation industrielle"
 LKT_focus_fine_tuning_industrial_regulations_desc: "Même si notre économie ne repose pas lourdement sur l'industrie, nous pouvons encore prendre de l'avance en ajustant et en abrogeant par avance certaines réglementations gênantes qui ont étouffé ou blessé les citoyens de bien des nations."
 LKT_focus_more_for_more_act: "Loi plus pour plus"
 LKT_focus_more_for_more_act_desc: "Cette initiative de financement aidera à rationaliser les pratiques agricoles tout en encourageant de nouvelles fermes et industries connexes. Le « plus pour plus » tient au fait que moins de gens iront à la terre à long terme, mais les mêmes agriculteurs pourront encore participer."
 LKT_focus_farmer_jims_research_emporium: "Emporium de recherche du fermier Jim"
 LKT_focus_farmer_jims_research_emporium_desc: "Un emporium de recherche agricole aidera à former de nouvelles générations d'agriculteurs et pourra aussi servir de centre de recherche pour améliorer les produits agricoles."
 LKT_focus_steeled_veins_act: "Loi sur les veines d'acier"
 LKT_focus_steeled_veins_act_desc: "Le minerai de fer, sève de l'acier, pilier des économies et structures modernes, est sous nos pieds. Nous devons investir pour sécuriser cette ressource couramment demandée si nous voulons une économie stable et fonctionnelle."
 LKT_focus_LAS_political_plan: "Plan politique LAS"
 LKT_focus_LAS_political_plan_desc: "La Société agraire lakotaise est un mouvement collectiviste qui cherche à moderniser les politiques agraires tout en réduisant l'État de façon à rendre du pouvoir au peuple."
 LKT_focus_asylum_experiment: "Expérience d'asile"
 LKT_focus_asylum_experiment_desc: "Nous cherchons à peupler nos terres, nos fermes et la nation elle-même. Nous devons donc trouver les meilleures formes d'accueil des demandeurs d'asile et tout faire pour combler ces manques critiques."
 LKT_focus_improving_farming_methods: "Améliorer les méthodes agricoles"
 LKT_focus_improving_farming_methods_desc: "Investir dans l'amélioration des besoins économiques de base comme la production alimentaire profitera à chacun, quel que soit son milieu. Nous chercherons donc à améliorer l'agriculture de toute façon possible pour mieux alimenter le pays."
 LKT_focus_mechanized_agriculture_union: "Syndicat de l'Agriculture Mécanisée"
 LKT_focus_mechanized_agriculture_union_desc: "En unissant les secteurs industriel et agricole, nous posons le principe que ces secteurs ne peuvent fonctionner sans le progrès de l'autre. Une croissance et un développement mutuels sont donc indispensables pour une société vraiment égale."
 LKT_focus_local_farming_initiatives: "Initiatives agricoles locales"
 LKT_focus_local_farming_initiatives_desc: "Le plus grand problème de la sécurité alimentaire, ce sont les lignes d'approvisionnement. Produire en masse ne sert à rien si les denrées pourrissent avant les rayons. Nous encouragerons donc des développements plus locaux pour réduire le transport longue distance des denrées, améliorer le prix unitaire et le numéraire disponible pour les besoins de nos gens."
 LKT_focus_more_ways_to_work_the_land: "Plus de façons de travailler la terre"
 LKT_focus_more_ways_to_work_the_land_desc: "L'agriculture ne nous mènera que jusqu'à un point : les méthodes modernes exigent de prospecter les minerais. Un ensemble national équilibré de relevés géologiques, d'exploitations minières et de nouvelles usines de traitement hissera la nation à des hauteurs inédites."
 LKT_focus_the_land_of_opportunity: "La terre d'opportunités"
 LKT_focus_the_land_of_opportunity_desc: "Nos terres sont vastes, vides et prêtes à ce que des communautés y prospèrent et travaillent ensemble. Fixons un mandat d'accueil pour ceux qui cherchent un lendemain meilleur."
 LKT_focus_PNP_political_plan: "Plan politique PNP"
 LKT_focus_PNP_political_plan_desc: "Le parti pour la préservation nationale est un parti vert assez classique. Plus compromis que les plus traditionnels, le PPN vise à moderniser tout en préservant la beauté naturelle de la nation."
 LKT_focus_building_tall_not_wide: "Construire en hauteur, pas en largeur"
 LKT_focus_building_tall_not_wide_desc: "En recherchant de nouvelles formes d'efficacité industrielle, nous pouvons suivre les besoins de la société sans consommer autant de terres."
 LKT_focus_stable_economics: "Une économie stable"
 LKT_focus_stable_economics_desc: "Pour la stabilité économique, il faut équilibrer l'efficacité des usines et des autres secteurs tout en compensant un marché du travail divers. Nous devrons donc mieux investir dans les services sociaux et la planification économique."
 LKT_focus_local_food_producers: "Producteurs alimentaires locaux"
 LKT_focus_local_food_producers_desc: "Le programme PPA établit quelques fermes destinées à nourrir les populations locales. Cela abaisse fortement le coût alimentaire et encourage la dépense intérieure plutôt que l'import-export."
 LKT_focus_sufficient_tech_investments: "Des investissements technologiques suffisants"
 LKT_focus_sufficient_tech_investments_desc: "Le secteur tech de notre nation est quasi inexistant. Nous avons toutefois les ressources pour investir décemment, afin d'avoir à la fois la diversité des emplois et des ressources utilisables plus loin."
 LKT_focus_domestic_arms_production_efforts: "Efforts de production d'armement nationale"
 LKT_focus_domestic_arms_production_efforts_desc: "Notre capacité à préserver nos terres et notre peuple ne tient qu'aux capacités de nos forces. Rien ne semble imminent, mais n'avoir rien du tout n'est pas un plan."
 LKT_focus_eco_extraction_efforts: "Efforts d’éco-extraction"
 LKT_focus_eco_extraction_efforts_desc: "En affinant l'extraction des ressources, nous pouvons disposer d'un éventail vaste et divers. Les volumes directs seront toutefois très limités par notre propre retenue minière. Nous espérons obtenir plus avec moins à mesure que la technique avance."
 LKT_focus_RBP_political_plan: "Plan politique RBP"
 LKT_focus_RBP_political_plan_desc: "Le Parti du rosier cherche à faire avancer les droits des travailleurs et le pays par une industrialisation progressiste. Visant l'union du développement économique et social, le PR fera tout pour assurer stabilité et prospérité entre patrons et ouvriers."
 LKT_focus_revamped_corporate_taxes: "Impôt sur les sociétés remanié"
 LKT_focus_revamped_corporate_taxes_desc: "En refondant le code fiscal, surtout le taux d'impôt des sociétés, nous assurerons un revenu stable et ferons peser davantage l'impôt sur les entreprises et les bureaux plutôt que sur le contribuable moyen."
 LKT_focus_education_for_all: "L'éducation pour tous"
 LKT_focus_education_for_all_desc: "Élargir largement nos systèmes éducatifs et la capacité de chaque citoyen d'acquérir les savoirs du monde. Nous en tirerons des bénéfices passifs à mesure que la population s'instruit et que le niveau de base s'élève."
 LKT_focus_fixing_our_ore_deal: "Corriger notre affaire de minerai"
 LKT_focus_fixing_our_ore_deal_desc: "Le fer, l'acier : le pilier moderne de toute économie après le béton. Nous devons investir décemment dans nos propres filières d'acier pour tenir longtemps seuls. Entourés d'inconnues, faisons au moins une chose certaine."
 LKT_focus_from_fields_to_cities_act: "Loi des champs aux villes"
 LKT_focus_from_fields_to_cities_act_desc: "Des développements généraux dans nos centres ruraux et urbains permettent une expansion diversifiée du marché de l'emploi et de la qualité des postes offerts à nos citoyens."
 LKT_focus_from_it_sector_developments: "Développements du secteur informatique"
 LKT_focus_from_it_sector_developments_desc: "Un petit secteur informatique ou tech autosuffisant sera très utile pour diversifier correctement notre économie."
 LKT_focus_supplying_our_military_needs: "Satisfaire nos besoins militaires"
 LKT_focus_supplying_our_military_needs_desc: "Les besoins de base doivent toujours être couverts, civils comme militaires. Pour nous défendre contre toute incursion étrangère, nous devons développer des usines afin que la production militaire réponde à nos besoins."
 LKT_focus_new_lakotan_nationals_parties: "Nouveaux ressortissants Lakotan, partis"
 LKT_focus_new_lakotan_nationals_parties_desc: "La montée de la pensée socialiste économique, l'implosion soudaine et violente de l'ancienne république et les terres inchangées que notre nation occupe. Voilà quelques raisons pour lesquelles vous, citoyens de notre glorieuse nation, devriez voter pour l'un d'entre nous. Les Nationaux lakotais ! Rejoignez-nous pour préserver la nouvelle identité que nous avons forcée, libre de l'ingérence étrangère et de l'idéalisme marxiste ou même maoïste. Votez aujourd'hui et faites votre part !"
 LKT_focus_YIP_political_plan: "Plan politique YIP"
 LKT_focus_YIP_political_plan_desc: "Le PJI, ou Parti des jeunes industrialistes, vise la modernisation et place la prospérité au premier rang. Certains craignent qu'ils ne soient que des oligarques déguisés ; beaucoup au sein du parti privilégient la preuve des projets plutôt que le lynchage politique traditionnel."
 LKT_focus_sponsored_immigration: "Immigration parrainée"
 LKT_focus_sponsored_immigration_desc: "Nos terres sont nues, nos citoyens peu nombreux : nous devons accueillir des nouveaux venus en quête d'une vie meilleure. Un marché de l'emploi vide à remplir et des terres à coloniser à perte de vue. Telle est notre promesse à ces nouveaux pionniers."
 LKT_focus_recruiting_talent: "Recruter des talents"
 LKT_focus_recruiting_talent_desc: "D'autres moyens d'augmenter la population : offrir des débouchés aux travailleurs qualifiés. De meilleurs salaires et conditions de vie restent un bel incentive."
 LKT_focus_south_munitions: "Munitions Sud"
 LKT_focus_south_munitions_desc: "Sécuriser des chaînes locales de production militaire permettra à nos militaires de faire face à toute menace qui se dresse contre nous."
 LKT_focus_central_industries: "Industries centrales"
 LKT_focus_central_industries_desc: "On ne soutient pas une armée sans soutenir le peuple. Nous centraliserons donc les développements industriels pour mieux accommoder les déplacements vers l'emploi."
 LKT_focus_bismarck_bombs: "Bombes Bismarck"
 LKT_focus_bismarck_bombs_desc: "Davantages de manufactures militaires dans les plaines du nord nous permettront de traiter des matières plus volatiles avec des dégâts collatéraux limités en cas d'incident."
 LKT_focus_promoting_human_resources: "Promouvoir les ressources humaines"
 LKT_focus_promoting_human_resources_desc: "Les champs sont mûrs, et le peuple aussi. En incentivant la production agricole et le chemin du champ à la table, nous devons assurer des développements ciblés de l'immigration et le soutien économique pour y parvenir."
 LKT_focus_CDS_political_plan: "Plan politique CDS"
 LKT_focus_CDS_political_plan_desc: "Nationalisme géographique et isolationnisme intransigeant. Ces deux piliers portent les valeurs centrales de la « Société », et beaucoup s'y perdent. Comment n'être « nationaliste que géographiquement » ? Comment l'isolationnisme nous aiderait-il avec si peu de développement ? Quoi qu'il en soit, la Société des épandeurs avance, victorieuse aux élections."
 LKT_focus_learning_social_values: "Apprendre les valeurs sociales"
 LKT_focus_learning_social_values_desc: "Notre société est en ruine parce que le peuple ne sait plus ce qu'il doit défendre. La famille, la nation et l'esprit des terres que nous habitons sont des valeurs clés pour une société plus stable et plus juste."
 LKT_focus_character_creation_programs: "Programmes de création de personnages"
 LKT_focus_character_creation_programs_desc: "Par un mélange de programmes volontaires et obligatoires intégrant éducation et service militaire, beaucoup de nos citoyens et des générations futures seront armés du sens de la responsabilité et du devoir. Envers la nation, mais aussi envers eux-mêmes, leur famille et ceux qui leur sont chers."
 LKT_focus_supply_chains: "Chaînes d'approvisionnement"
 LKT_focus_supply_chains_desc: "Notre nation est vaste, surtout plate et dans l'ensemble assez sous-développée. Nous devons créer des lignes d'approvisionnement solides et flexibles pour la soutenir."
 LKT_focus_domestic_families_act: "Loi sur les familles nationales"
 LKT_focus_domestic_families_act_desc: "La LFD est un paquet budgétaire destiné à promouvoir et subventionner les familles plus nombreuses, donc la croissance démographique intérieure. Le talent étranger pouvant être difficile à trouver selon nos critères culturels, notre faible population ne doit jamais devenir un facteur critique de survie."
 LKT_focus_encouraging_favorable_migrants: "Encourager les migrants favorables"
 LKT_focus_encouraging_favorable_migrants_desc: "Nous devons chercher le talent et les compétences dont la nation et ses citoyens ont besoin. Notre survie n'est limitée que par nos capacités : nous devons les accroître de force."
 LKT_focus_increased_military_investments: "Investissements militaires accrus"
 LKT_focus_increased_military_investments_desc: "Nous devons veiller à ce que nos militaires soient équipés et prêts face à toute force ennemie qui s'abattrait sur nos terres."
 LKT_focus_LGF_political_plan: "Plan politique LGF"
 LKT_focus_LGF_political_plan_desc: "La Ligue des champs d'or, comme on l'appelle, est un parti que peu croyaient vainqueur, et pourtant. On ignore comment il a gagné, mais en des temps si incertains, il n'y a guère à faire. Espérons que le bien l'emporte sur le mal."
 LKT_focus_improved_food_production: "Production alimentaire améliorée"
 LKT_focus_improved_food_production_desc: "Sécuriser la nourriture de la population encourage la croissance intérieure et la stabilité sociale."
 LKT_focus_increasing_industrial_base: "Renforcement de la base industrielle"
 LKT_focus_increasing_industrial_base_desc: "Accroître notre capacité industrielle diversifie l'économie, améliore sa santé globale et offre à nos citoyens plus d'opportunités qu'ils n'en trouveraient chez nos voisins."
 LKT_focus_local_military_production: "Production militaire locale"
 LKT_focus_local_military_production_desc: "Investir dans la fabrication militaire locale nous permet de sécuriser l'équipement des forces armées et d'empêcher leur déclin. Il faudra toutefois aller plus loin pour vraiment nous défendre contre les sauvages qui convoitent nos terres."
 LKT_focus_increasing_lawful_order: "Renforcer l’ordre légal"
 LKT_focus_increasing_lawful_order_desc: "En augmentant le budget de la police et des services de sécurité, nous pourrons poursuivre toutes sortes de crimes. Ainsi resteront dans le rang les entités corporatives comme les éventuels interférents étrangers mêlés aux citoyens respectueux de la loi."
 LKT_focus_military_education_act: "Loi sur l'éducation militaire"
 LKT_focus_military_education_act_desc: "La LEM standardise l'éducation selon les lignes d'une organisation militaire. Plus d'intellectuels pour infecter la jeunesse d'idées tapageuses qui érodent les fondations de la société. Désormais : devoir, honneur, courage, respect et sacrifice. Pour le foyer, la famille et ceux que chérissent le cœur et l'esprit de tous nos citoyens."
 LKT_focus_self_mobilization: "Loi d'auto-mobilisation"
 LKT_focus_self_mobilization_desc: "La loi d'auto-mobilisation est un plan économique global pour mobiliser la nation et ses citoyens dans une sorte de « quart de stance ». Outiller l'économie pour plus d'efficacité, employer plus de monde par anticipation d'une vraie mobilisation, et accroître la conscription pour préparer mentalement et socialement la population à toute incursion hostile."
 LKT_focus_HOY_political_plan: "Plan politique HoY"
 LKT_focus_HOY_political_plan_desc: "La Maison de Yellowstone s'inscrit dans le phénomène mondial du « mouvement monarchiste moderne ». Ce courant assez divers n'a qu'un dogme : gloire au vote, non au sang. Concrètement : élargir et assouplir le vote. Suffrage universel à 18 ans, vote par classement, et transformation des charges élues en titres. Le président devient roi, un représentant devient lord, etc. Beaucoup sont perplexes, mais on se vend peu à peu l'idée d'être duc, baron ou autre simplement pour être fonctionnaire de la nation."
 LKT_focus_office_titles_act: "Loi sur les titres officiels"
 LKT_focus_office_titles_act_desc: "Standardiser les titres féodaux autour des charges du gouvernement montrera que, si l'on travaille assez dur, on peut même devenir prince ou princesse."
 LKT_focus_expanding_mining_operations: "Expansion des opérations minières"
 LKT_focus_expanding_mining_operations_desc: "Nous devons pouvoir tenir seuls. Investissons donc dans l'extraction minière des ressources dont nous sommes critiquement déficients."
 LKT_focus_farmers_primacy_act: "Loi sur la primauté des agriculteurs"
 LKT_focus_farmers_primacy_act_desc: "La sécurité alimentaire est la seule chose qui fasse une économie stable. Avec une population si petite, nous devons tout faire pour encourager sa croissance, et la nourriture est l'un des meilleurs moyens."
 LKT_focus_expanding_immigration_efforts: "Augmenter les efforts d’immigration"
 LKT_focus_expanding_immigration_efforts_desc: "L'état du monde est un numéro d'équilibriste. Certaines nations sont bonnes, d'autres passables, d'autres encore simplement mauvaises. Nous devons faire voir à nos voisins que nous sommes parmi les meilleures. Encourager l'immigration stabilise le marché de l'emploi et stimule le développement des zones gravement en retard."
 LKT_focus_improving_education_standards: "Améliorer les normes éducatives"
 LKT_focus_improving_education_standards_desc: "Nous devons élever les normes éducatives pour innover et produire biens et services avec le moins de gaspillage possible."
 LKT_focus_national_economic_investments: "Investissements économiques nationaux"
 LKT_focus_national_economic_investments_desc: "Diversifier l'économie, c'est sécuriser passivement l'indépendance nationale. En produisant un peu de tout, nous pourrons nous en servir comme marchepied pour les relations étrangères et les accords commerciaux."
 LKT_focus_industrialization_question: "La question industrielle"
 LKT_focus_industrialization_question_desc: "Les « États des Grandes Plaines », comme on appelle une bonne part des États sous notre contrôle, sont parmi les terres les moins développées de l'ancienne république, et certainement de la nouvelle. Mais nous avons un gouvernement neuf et un départ à zéro. Une question s'impose : industrialiser, ou non."
 LKT_focus_the_great_northern_railway: "Le Great Northern Railway"
 LKT_focus_the_great_northern_railway_desc: "Jadis simple rouage du Burlington Northern Santa Fe, c'est à nouveau une entreprise indépendante. En réorganisant le peu d'infrastructure disponible, nous pouvons rétablir un drapeau tombé de l'histoire ferroviaire tout en améliorant et finançant notre infrastructure naissante."
 LKT_focus_northern_bypass: "Contournement Nord"
 LKT_focus_northern_bypass_desc: "La route des terres frontalières le long de la frontière canadienne nous offrira un itinéraire alternatif pour transporter les marchandises du Montana au Dakota du Nord, sans parler des besoins de transport liés aux accords commerciaux."
 LKT_focus_great_western_mainline: "Ligne principale Great Western"
 LKT_focus_great_western_mainline_desc: "Serpenter à travers le Montana jusqu'au Wyoming nous permettra d'acheminer de grandes quantités de fret à travers les terrains vallonnés et montagneux de notre région ouest."
 LKT_focus_the_southern_extension: "L'extension sud"
 LKT_focus_the_southern_extension_desc: "Atteindre le Kansas nous permet d'acheminer des marchandises du nord des Dakotas jusqu'à cet État plus ou moins isolé, renforçant ainsi la coopération entre tous les États de notre république."
 LKT_focus_completing_the_network: "Achever le réseau"
 LKT_focus_completing_the_network_desc: "Parachever nos investissements en créant des contournements à des emplacements stratégiques nous donne des itinéraires alternatifs en cas de catastrophe naturelle, d'accident humain ou de tout ce qui pourrait endommager une ou plusieurs routes existantes."
 LKT_focus_modern_agrarian_economy: "Une économie agraire moderne"
 LKT_focus_modern_agrarian_economy_desc: "Nos terres sont vastes, fertiles et généreuses. Ce serait une honte de les laisser gâcher sous le joug toxique de l'industrialisme moderne. Nous devons revenir à des moyens plus simples et pourtant plus raffinés d'assurer notre autonomie économique. Ces terres en seront la clé : chaque parcelle sera une ferme pour nourrir le monde."
 LKT_focus_northern_farms_adaptation_act: "Loi d'adaptation des fermes du Nord"
 LKT_focus_northern_farms_adaptation_act_desc: "La LNFA est une législation pour investir dans les fermes et centres agricoles des États du nord. Investissements, financements et formation aux méthodes d'adaptation hivernale, ainsi que de nouvelles structures pour produire même au cœur de l'hiver. Serres et installations isolées et chauffées pour le bétail permettront d'être agriculteur presque toute l'année."
 LKT_focus_centralia_farms_act: "Loi sur les fermes de Centralia"
 LKT_focus_centralia_farms_act_desc: "La LFC réorganisera les fermes des États centraux sous une entité conjointe publique et privée. L'objectif est d'équilibrer la croissance et d'assurer la diversité des produits selon les capacités de chaque État. Plus grande division, près de la moitié du pays : l'intérêt partagé de la richesse privée et de la sécurité alimentaire publique justifie cette coentreprise."
 LKT_focus_southern_farming_traditions: "Traditions agricoles du Sud"
 LKT_focus_southern_farming_traditions_desc: "Dans le sud de la nation comme dans l'ancienne république, une tradition douce voulait que l'on cultive des cultures de rente. Nouvelle nation ou non, on ne saurait sous-estimer leur importance à l'export et en valeur intérieure. Nous orienterons donc le Kansas, plus stable climatiquement, vers un mélange de ces cultures."
 LKT_focus_targeted_mechanization_efforts: "Efforts de mécanisation ciblés"
 LKT_focus_targeted_mechanization_efforts_desc: "En concentrant tout effort industriel sur le secteur agricole, nous assurerons une forte hausse de productivité et une économie diversifiée sur laquelle retomber. On ne sait jamais si le temps ou un phénomène mondial tentera de nous nuire."
 LKT_focus_bio_fuel_investments: "Investissements dans les biocarburants"
 LKT_focus_bio_fuel_investments_desc: "En utilisant notre système éducatif pour diversifier et améliorer les bénéfices d'une économie agraire, nous pouvons désormais raffiner et explorer de nouvelles formes de biocarburants pour nos voitures, foyers et entreprises."
 LKT_focus_the_farmers_tax_code: "Le code fiscal de l'agriculteur"
 LKT_focus_the_farmers_tax_code_desc: "En refondant entièrement le code fiscal autour de la préservation de nos moyens de production agraires, nous assurerons la stabilité de la main-d'œuvre et pourrons investir dans les fermes et agriculteurs de demain."
 LKT_focus_funding_general_education_improvements: "Financer l'amélioration générale de l'éducation"
 LKT_focus_funding_general_education_improvements_desc: "Consacrer le budget à l'éducation préparera les générations futures à faire avancer nos besoins technologiques à mesure que la curiosité et le besoin naîtront."
 LKT_focus_bio_fuel_engineering_institute: "Institut d'ingénierie des biocarburants"
 LKT_focus_bio_fuel_engineering_institute_desc: "L'IEB est un établissement de recherche et d'enseignement supérieur dédié à l'amélioration des applications et de l'efficacité des biocarburants. Nous en ferons un pilier éducatif pour renforcer notre puissance économique."
 LKT_focus_skill_set_education_programs: "Programmes d'éducation par compétences"
 LKT_focus_skill_set_education_programs_desc: "Le PCES est une initiative de financement pour diversifier et améliorer les compétences générales que nos citoyens peuvent acquérir. Nous espérons améliorer fortement l'emploi et offrir une approche plus stable et plus complète de la croissance."
 LKT_focus_lakotan_development_fund: "Le Fonds de développement lakotais"
 LKT_focus_lakotan_development_fund_desc: "En allouant une part précise du budget, nous pourrons créer des développements ciblés pour équilibrer et mieux faire croître notre base économique."
 LKT_focus_the_fifth_revolution: "La 5e révolution industrielle"
 LKT_focus_the_fifth_revolution_desc: "Au tournant du millénaire, l'industrialisation avait déjà connu deux itérations majeures. Puis vint la troisième, l'automatisation, et la quatrième, l'IA et l'intégration informatique au-delà de l'imaginable. Nous posons maintenant la cinquième révolution : une nation de champs, quasi sans industrie, rivalisera même avec la modernisation de l'Extrême-Orient."
 LKT_focus_rushmore_revival: "Projet Rushmore Revival"
 LKT_focus_rushmore_revival_desc: "Les Dakotas sont un symbole, non seulement du nom plus neutre choisi pour notre nation, mais du cœur identitaire des terres que nous occupons. Ils doivent donc être la première priorité de notre nouvelle politique de révolution industrielle."
 LKT_focus_rocky_roads_no_more: "Projet Plus de routes cahoteuses"
 LKT_focus_rocky_roads_no_more_desc: "Le Montana et le Wyoming, qui bordent ou occupent de vastes pans des Rocheuses, sont d'une importance stratégique. Ils relient à travers la chaîne et posent des défis de développement. Des investissements complets dans l'infrastructure et l'économie s'imposent pour qu'ils ne soient pas laissés pour compte."
 LKT_focus_kansas_city_kerosene: "Projet Kérosène de Kansas City"
 LKT_focus_kansas_city_kerosene_desc: "Le Kansas et le Nebraska ont un potentiel inexploité. Avec du pétrole et du gaz naturel issus, techniquement, des origines texanes, nous pouvons propulser la nation à l'avant-garde de l'industrialisme. Par des efforts miniers coordonnés et des investissements économiques, de grandes choses sont à attendre."
 LKT_focus_rare_earth_energy_act: "Loi sur l'énergie des terres rares"
 LKT_focus_rare_earth_energy_act_desc: "Développer les mines de terres rares et étendre notre capacité énergétique intérieure nous permettra de poursuivre la croissance industrielle et de disposer d'atouts diplomatiques."
 LKT_focus_project_nebraska_namesake: "Projet homonyme du Nebraska"
 LKT_focus_project_nebraska_namesake_desc: "Le Nebraska recèle de nombreuses ressources stratégiques inexplorées à vraie échelle, ou tout simplement intactes. Nous lancerons une campagne minière et de prospection complète pour les extraire, alimenter l'industrialisation et accroître notre capital politique extérieur."
 LKT_focus_business_tax_reforms: "Réformes de la fiscalité des entreprises"
 LKT_focus_business_tax_reforms_desc: "Avec une base industrielle croissante, notre économie se diversifie. Il faut revoir et refondre le code fiscal des divers secteurs d'entreprise pour qu'il reste juste. Les citoyens pourront plus naturellement créer des startups, épargner et contribuer à l'économie comme ils l'entendent."
 LKT_focus_peoples_tax_reforms: "Les réformes fiscales du peuple"
 LKT_focus_peoples_tax_reforms_desc: "Les affaires ne vont bien que si le peuple va bien. Le code fiscal doit être simplifié, modernisé et raisonnable pour soutenir une citoyenneté en pleine industrialisation."
 LKT_focus_establishing_lakotan_institute_of_technology: "L'Institut lakotais de technologie"
 LKT_focus_establishing_lakotan_institute_of_technology_desc: "La création de l'ILT est une percée dans la R&D centralisée. Nous regroupons ressources matérielles et humaines en un lieu plus localisé. L'institution est conçue pour développer et améliorer les sciences connues au mieux des capacités de chacun."
 LKT_focus_national_investment_progrmas: "Programmes d'investissement nationaux"
 LKT_focus_national_investment_progrmas_desc: "L'économie est sur les rails et les choses s'améliorent : nous pouvons calmer le jeu et tenir un cap. Des investissements généraux de programmes budgétaires permettront à notre peuple de se spécialiser, de grandir et de s'adapter à l'économie moderne."
 LKT_focus_a_new_economy: "Une nouvelle économie"
 LKT_focus_a_new_economy_desc: "L'économie en place, nous pouvons nous concentrer sur la politique. Nous nous rapprochons d'un regard au-delà de nos affaires intérieures."
 LKT_focus_department_of_energy: "Le ministère de l'Énergie"
 LKT_focus_department_of_energy_desc: "Avoir une économie, c'est bien ; cela ne sert à rien si on ne peut pas l'alimenter. Nous établirons donc le ministère lakotais de l'Énergie pour résoudre ce problème."
 LKT_focus_fueling_agrarianism: "Alimenter l’agrarianisme"
 LKT_focus_fueling_agrarianism_desc: "L'économie nationale étant celle de la suprématie agricole, il faut adapter et faire croître l'économie énergétique. Avec de bons investissements, il n'est pas tant besoin d'étendre l'infrastructure que de développer jusqu'où le carburant va depuis les sources qui en ont le plus besoin."
 LKT_focus_fueling_tomorrows_economy: "Alimenter l’économie de demain"
 LKT_focus_fueling_tomorrows_economy_desc: "Nos besoins sont vastes, mais nos terres et ressources le sont davantage. Nous devons développer un secteur énergétique pour que nos demandes et celles de l'avenir soient assurées par des moyens intérieurs."
 LKT_focus_a_new_green_deal: "Un nouveau pacte vert"
 LKT_focus_a_new_green_deal_desc: "Le New Green Deal, ou NGD, est un schéma d'investissement énergétique complet pour développer et garantir que la seule vraie production d'énergie verte soit utilisée au mieux, selon les percées actuelles et, on l'espère, futures. Petites centrales plus efficaces, investissement limité dans le recyclage du combustible usé. Le tout, et un peu plus."
 LKT_focus_finalizing_doe_capabilities: "Finalisation des fonctionnalités du DoE"
 LKT_focus_finalizing_doe_capabilities_desc: "Le secteur énergétique désormais aligné sur nos besoins économiques, nous pouvons synergetiser les deux et propulser la nation vers l'avenir que nous créerons."
 LKT_focus_increased_funding_for_donr: "Financement accru du DoNR"
 LKT_focus_increased_funding_for_donr_desc: "En investissant davantage dans l'acquisition des ressources naturelles sous nos pieds, nous assurerons une économie plus autosuffisante, ou du moins mieux équilibrée."
 LKT_focus_massive_investments: "Des investissements massifs"
 LKT_focus_massive_investments_desc: "Pour tout obtenir, nous investirons autant que possible afin d'acquérir autant de ressources minérales différentes que possible."
 LKT_focus_need_by_need_investment_strategy: "Stratégie d'investissement au cas par cas"
 LKT_focus_need_by_need_investment_strategy_desc: "Nos efforts miniers doivent compléter l'économie principale. Nous investirons donc au ministère des Ressources naturelles au besoin, pour tenir la demande."
 LKT_focus_iron_ore_revival: "Loi de relance du minerai de fer"
 LKT_focus_iron_ore_revival_desc: "Nos gisements de fer sont inexploités au mieux, voire écourtés par d'anciennes erreurs. Ce ne sera plus le cas. Par des investissements au Dakota du Sud, au Kansas et au Montana notamment, nous étendrons les opérations existantes et rouvrirons d'anciennes, comme celle du Kansas fermée trop tôt pour des raisons environnementales. Le nettoyage coûtera, mais une production significative de fer nous donnera un approvisionnement intérieur sain de l'un des matériaux clés du monde moderne : l'acier."
 LKT_focus_bauxite_brawls_act: "Loi sur les bagarres de bauxite"
 LKT_focus_bauxite_brawls_act_desc: "Assurer à l'économie l'accès à des métaux plus flexibles permet aussi des applications civiles et militaires. Relancer, étendre et investir dans des sites miniers plus énergivores en vaudra la peine à long terme."
 LKT_focus_precious_mines_act: "Loi sur les mines précieuses"
 LKT_focus_precious_mines_act_desc: "Plusieurs États ont des gisements de terres rares (REE). Nous investirons pour ouvrir et étendre les opérations à une échelle commerciale potentielle, afin d'assurer le sommet de la diversité économique. Davantage de matériaux intérieurs, c'est davantage d'intérêt étranger."
 LKT_focus_rubber_stamp_act: "La loi du tampon caoutchouc"
 LKT_focus_rubber_stamp_act_desc: "Nous avons beaucoup de production pétrolière intérieure. Une part peut être stratégiquement réallouée aux produits chimiques de synthèse et au caoutchouc, pour le sommet de la diversité des ressources."
 LKT_focus_lakotan_military_development_board: "Conseil lakotais de développement militaire"
 LKT_focus_lakotan_military_development_board_desc: "Le CLDM vise à rationaliser le développement et à renforcer nos capacités militaires. Avec seulement deux armes à gérer, cela devrait être simple. Certains personnels jadis de la marine de l'ancienne république espèrent toutefois une marine lakotaise un jour. Pour l'heure, armée et force aérienne d'abord."
 LKT_focus_military_refinement: "Raffinement militaire"
 LKT_focus_military_refinement_desc: "Par essais et erreurs, beaucoup d'investissement en matériel et en personnel, et le temps lui-même, nous avons enfin créé au moins une arme solidifiée de nos forces pour assurer la défense nationale et la sécurité de nos citoyens et de leurs foyers."
 LKT_focus_lakotan_army_pay_standards: "Normes de rémunération de l'armée lakotan"
 LKT_focus_lakotan_army_pay_standards_desc: "Assurer une solde de qualité et la capacité de nos soldats à subvenir à leurs besoins et éventuellement à ceux de leurs proches relèvera passivement le moral. En bonus, ce dévouement accru devrait se répercuter sur les taux de rotation de l'instruction et la qualité des soldats produits."
 LKT_focus_establishing_arms_contractors: "Création d'entrepreneurs en armement"
 LKT_focus_establishing_arms_contractors_desc: "Créer une industrie d'armement dédiée pour soutenir le pilier de notre défense nationale est primordial. Nous sécuriserons le financement pour un approvisionnement régulier de nos troupes en armements de qualité."
 LKT_focus_sundance_war_college: "L'École de guerre de Sundance"
 LKT_focus_sundance_war_college_desc: "En créant un institut militaire dédié, nous préparerons futurs sous-officiers et officiers aux champs de bataille de demain. Tactique, commandement et délégation. Surtout l'adaptabilité : tout bon soldat doit comprendre que si ça peut mal tourner, ça tournera probablement mal."
 LKT_focus_butte_testing_facilities: "Installations d'essai de Butte"
 LKT_focus_butte_testing_facilities_desc: "En créant un complexe dédié d'essais et de R&D, nous assurerons la qualité croissante de nos troupes pour les conflits potentiels à venir."
 LKT_focus_research_mania: "Frénésie de recherche"
 LKT_focus_research_mania_desc: "La R&D, c'est là que ça se joue. Nous investirons lourdement dans de nouveaux armements, munitions et équipements de soutien pour que la qualité de nos troupes dépasse ceux qui voudraient nous nuire."
 LKT_focus_geneva_compliant_munitions: "Munitions « conformes » à Genève"
 LKT_focus_geneva_compliant_munitions_desc: "Nous devons bien sûr paraître bien aux yeux de la communauté internationale. Cela n'empêche pas de tester les limites. N'est-ce pas ?"
 LKT_focus_experiemental_weapons_platoon: "Peloton d'armes expérimentales"
 LKT_focus_experiemental_weapons_platoon_desc: "Le PEE sera une unité dédiée du plus large « Corps des armes expérimentales ». Cette sous-arme de l'armée désignera des pelotons de soutien pour les essais terrain et donner un coup de pouce aux unités en difficulté, sur demande. Le PEE comprendra surtout de l'armement expérimental anti-tout, adaptable aux besoins de l'armée sur un champ de bataille en mutation."
 LKT_focus_the_corps: "Le « Corps »"
 LKT_focus_the_corps_desc: "L'établissement d'un Corps des armes expérimentales nous permet d'orienter financement, instruction et essais au maximum de flexibilité. Ce nouveau corps de R&D sera le phare qui nous guidera contre tous les ennemis de nos terres."
 LKT_focus_logistical_primacy: "École de pensée de la primauté logistique"
 LKT_focus_logistical_primacy_desc: "En concentrant nos efforts sur la logistique de la guerre, nous pourrons durer plus que nos ennemis par pure attrition si les choses dégénèrent vraiment."
 LKT_focus_bread_and_butter_doctrine: "La doctrine du pain quotidien"
 LKT_focus_bread_and_butter_doctrine_desc: "En réorientant la conscience économique vers un conflit de survie, des mesures préventives de rationnement et des stocks alimentaires bien situés aideront non seulement l'armée, mais aussi toute reconstruction."
 LKT_focus_supply_heroes: "Héros du ravitaillement"
 LKT_focus_supply_heroes_desc: "Les balles ne volent pas sans ravitaillement. Quoi qu'on dise d'être un héros, chacun peut exceller dans son domaine et être le héros dont on a besoin. Nous mettrons donc en avant le Corps du ravitaillement et ouvrirons des formations distinctes d'approvisionnement et de logistique pour une cohésion maximale entre chaînes et unités servies."
 LKT_focus_logistics_corps_training_programs: "Programmes de formation du corps logistique"
 LKT_focus_logistics_corps_training_programs_desc: "Ouvrir l'armée à tous les milieux ne signifie pas forcément le front. Et un « POG » n'a pas forcément à peser sur le moral du fantassin. Nous dédierons donc une nouvelle instruction et une doctrine spécialisée à notre corps logistique pour la cohésion du front, l'efficacité des lignes et l'efficacité militaire globale."
 LKT_focus_lakotan_air_force_training_improvements: "Améliorations de l'entraînement de l'armée de l'air lakotane"
 LKT_focus_lakotan_air_force_training_improvements_desc: "Par une bonne standardisation des critères de qualification, nous espérons établir une nouvelle élite en matière d'efficacité des pilotes au combat."
 LKT_focus_fighter_priority_structure: "Structure des priorités des chasseurs"
 LKT_focus_fighter_priority_structure_desc: "L'effort organisationnel SPF vise à recentrer la fonction première de la force aérienne sur la classe des chasseurs. Instruction et composition des unités assureront la primauté des chasseurs sur l'appui au sol ou le bombardement stratégique. Le peu que nous produirons d'autre devra pouvoir voler sans être molesté là où nos chasseurs sont."
 LKT_focus_fighter_supremacy_doctrine: "Doctrine de suprématie des chasseurs"
 LKT_focus_fighter_supremacy_doctrine_desc: "Développer notre doctrine aérienne autour des chasseurs vise le contrôle total des cieux. Quoi qu'il nous manque en bombardiers ou en appui au sol, nous aurons un terrain d'essai libre grâce à une suprématie aérienne sans partage."
 LKT_focus_ground_support_priority_structure: "Structure prioritaire d'appui terrestre"
 LKT_focus_ground_support_priority_structure_desc: "L'effort organisationnel SPAS recentrera la force aérienne sur le développement et le déploiement d'appareils d'appui au sol. Même sans suprématie aérienne totale, nous pourrons harceler l'ennemi depuis l'air et assurer au moins la stabilité du front."
 LKT_focus_ground_support_supremacy_doctrine: "Doctrine de suprématie de l'appui terrestre"
 LKT_focus_ground_support_supremacy_doctrine_desc: "Prioriser l'appui au sol dans la doctrine aérienne assurera la stabilité du front et privera l'ennemi de sa capacité à combattre longtemps. Les dégâts organisationnels ne font qu'une part ; détruire ravitaillement et matériel, c'est l'empêcher de se battre."
 LKT_focus_strategic_bomber_priority_structure: "Structure prioritaire des bombardiers stratégiques"
 LKT_focus_strategic_bomber_priority_structure_desc: "L'effort organisationnel SPBS permettra à notre force aérienne de briser la volonté de combattre de l'ennemi. Industrie et infrastructure sont vitales à protéger en cas de conflit prolongé. Nous développerons donc des bombardiers stratégiques pour démolir ces machines de guerre et déchirer les rubans de routes et de rails qui permettent à l'ennemi de nous nuire."
 LKT_focus_strategic_bomber_supremacy_doctrine: "Doctrine de suprématie des bombardiers stratégiques"
 LKT_focus_strategic_bomber_supremacy_doctrine_desc: "En affinant notre doctrine aérienne autour des bombardiers stratégiques, nous anéantirons la capacité de l'ennemi à nous combattre. Sans économie ni industrie d'armement, il ne peut ni armer son peuple ni l'employer. La guerre ne sera peut-être pas rapide, mais personne ne détruira notre peuple ni ces terres que nous défendons."
 LKT_focus_clear_skies_for_all: "Ciels clairs pour tous"
 LKT_focus_clear_skies_for_all_desc: "Le raffinement de notre force aérienne sera exposé à tous. Encourager meetings aériens et lieux d'instruction ouverts au public rassurera les citoyens : notre nation aura des cieux clairs pour les jours à venir."
 LKT_focus_creating_a_real_navy: "Créer une vraie marine"
 LKT_focus_creating_a_real_navy_desc: "Le jour est enfin venu de créer une vraie marine, et non des skippers pour le rafting fluvial. Le voyage sera toutefois pénible : un fleuve n'a rien de l'océan."
 LKT_focus_early_ship_construction_efforts: "Premiers efforts de construction de navires"
 LKT_focus_early_ship_construction_efforts_desc: "Notre savoir-faire naval ne sera peut-être jamais « haut de gamme », mais nous pouvons commencer par le bas de gamme."
 LKT_focus_formalizing_naval_training_programs: "Officialisation des programmes de formation navale"
 LKT_focus_formalizing_naval_training_programs_desc: "En adoptant enfin un vrai programme d'instruction, aidé par nos nouvelles eaux côtières, nous assurerons une qualité respectable à notre personnel naval."
 LKT_focus_our_naval_priority: "Notre priorité navale"
 LKT_focus_our_naval_priority_desc: "En créant une nouvelle priorité dans le développement naval, nous posons au moins une norme sur laquelle les générations futures pourront bâtir."
 LKT_focus_naval_command_structure: "Structure de commandement naval"
 LKT_focus_naval_command_structure_desc: "L'arme navale de la FAL était une plaisanterie au mieux, une punition au pire. Avec l'acquisition de nouveaux fronts d'eau et le début de la construction de bâtiments hauturiers, il faut en faire une arme sérieuse et tangible. La formalisation de la SCLN, Structure de commandement naval lakotais, sera créée pour faciliter et établir les progrès futurs vers l'excellence navale."
 LKT_focus_gulf_dry_docking_facilities: "Installations de cale sèche du Golfe"
 LKT_focus_gulf_dry_docking_facilities_desc: "Étendre nos efforts de construction navale nous permettra d'adapter et de faire croître notre marine."
 LKT_focus_mid_atlantic_shipping_investments: "Investissements dans le transport maritime médio-atlantique"
 LKT_focus_mid_atlantic_shipping_investments_desc: "Il faut poursuivre l'expansion de notre marine si nous voulons couvrir tout ce territoire."
 LKT_focus_beyond_the_plains: "Au-delà des Plaines"
 LKT_focus_beyond_the_plains_desc: "La patrie désormais stable et prospère, il faut penser au-delà de nos frontières. Chercher ou non à s'étendre n'est pas la question : d'autres regardent déjà au-delà des leurs. Nous devons décider de notre avenir."
 LKT_focus_A_New_Destiny: "Un nouveau destin"
 LKT_focus_A_New_Destiny_desc: "Le mandat a été perdu ; ceux du continent nord-américain cherchent à le reprendre. Nous le savons par les rumeurs des terres, et nous ferons valoir notre revendication pour l'emporter. C'est notre destin, non celui de l'est ni de l'ouest."
 LKT_focus_eyeing_the_borderlands: "L'œil sur les terres frontalières"
 LKT_focus_eyeing_the_borderlands_desc: "Notre destin commence par les premiers pas hors de nos frontières. Nous devons donc faire en sorte que nos propres frontières soient là où nous les poserons."
 LKT_focus_the_pacific_shores: "Les rives du Pacifique"
 LKT_focus_the_pacific_shores_desc: "Nous aurons notre coucher de soleil baigné de la brise des côtes pacifiques. L'ouest est une distance plus courte à couvrir que l'est, du moins."
 LKT_focus_great_lakes_great_takes: "Grands Lacs, grandes prises"
 LKT_focus_great_lakes_great_takes_desc: "S'étendre vers l'est, c'est affronter des terres vastes et diverses. Nous devons comprendre et naviguer l'immensité de la région des Grands Lacs."
 LKT_focus_southern_summaries: "Résumés du Sud"
 LKT_focus_southern_summaries_desc: "Des marais aux sommets, le sud des États-Unis sera sans doute le plus difficile à traverser. Pratique, étude et instruction seront nécessaires tandis que nous chercherons à sécuriser ces terres futures."
 LKT_focus_northeastern_needs: "Besoins du Nord-Est"
 LKT_focus_northeastern_needs_desc: "Montagnes et forêts à perte de vue. Il faudra du temps et certainement de l'énergie pour affronter ces terres."
 LKT_focus_manifesting_strength_for_our_destiny: "Manifestation de force pour notre destin"
 LKT_focus_manifesting_strength_for_our_destiny_desc: "Nous devons préparer et continuer à bâtir nos forces. Le destin que nous nous sommes fixé sera nôtre en temps voulu."
 LKT_focus_operation_cascadian_calamity: "Opération Cascadian Calamity"
 LKT_focus_operation_cascadian_calamity_desc: "Notre grande croisade pour la sécurité continentale commence. Nous débutons par le plus proche de notre puissance : Cascadia. Les montagnes seront dures, mais d'excellents terrains d'instruction pour nos soldats."
 LKT_focus_operation_san_jose: "Opération San José"
 LKT_focus_operation_san_jose_desc: "Balayer la côte ouest nous permet de créer notre propre mur : l'océan Pacifique. L'étape suivante vers la sécurité continentale est assurée une fois la Californie prise."
 LKT_focus_operation_sierra_mist: "Opération Sierra Mist"
 LKT_focus_operation_sierra_mist_desc: "Sécuriser la région énergétique du sud-ouest ainsi que le reste des Rocheuses nous permettra d'établir une grande ligne défensive si quoi que ce soit percait nos rives ouest."
 LKT_focus_operation_sam_houston: "Opération Sam Houston"
 LKT_focus_operation_sam_houston_desc: "Sécuriser la plus grande identité du continent nord-américain, c'est sécuriser la volonté des divers peuples. Les Texans sont fiers et indépendants ; les tenir ouvre la voie à toute incursion vers l'est."
 LKT_focus_reorganizing_civil_services: "Réorganiser la fonction publique"
 LKT_focus_reorganizing_civil_services_desc: "Créer de nouveaux services civils standardisés nous permet de mieux gérer nos territoires et d'améliorer l'intégration pour que l'on passe les guerres récentes. Ce ne sera pas parfait, mais c'est un pas dans la bonne direction."
 LKT_focus_operation_rustic: "Opération Rustique"
 LKT_focus_operation_rustic_desc: "Notre marche vers l'est commence : la route nord offre plus de plaines, de collines et de forêts. Pas une promenade, certes, mais une bonne pratique avant l'avance sud."
 LKT_focus_operation_charleston: "Opération Charleston"
 LKT_focus_operation_charleston_desc: "Du Mississippi à l'Atlantique, nous marchons pour sécuriser la route sud et nous relier d'un océan à l'autre."
 LKT_focus_operation_north_east_corridor: "Opération Corridor Nord-Est"
 LKT_focus_operation_north_east_corridor_desc: "La dernière étape pour reprendre le mandat. Nous aurons le contrôle complet de la république continentale et notre destin... enfin, il faudra encore reconstruire, mais je m'égare."
 LKT_focus_west_coast_cleanup: "Nettoyage de la côte ouest"
 LKT_focus_west_coast_cleanup_desc: "La nation sous notre contrôle, nous pouvons nettoyer et reconstruire les terres dévastées. Le mieux est de commencer à l'ouest et de balayer vers l'est."
 LKT_focus_south_central_rebuilding: "Reconstruction du centre-sud"
 LKT_focus_south_central_rebuilding_desc: "L'ouest sécurisé, nous pouvons nous concentrer sur le reste : les États qui achèvent la moitié ouest de la nouvelle république. Les consolider ne laisse que tout ce qui est à l'est du Mississippi ; ce devrait aller vite."
 LKT_focus_mississippi_miracle: "Miracle du Mississippi"
 LKT_focus_mississippi_miracle_desc: "La marche vers l'est commence : en franchissant le Mississippi, nous pouvons reconstruire et intégrer les États du sud à la nouvelle nation."
 LKT_focus_reviving_the_rustbelt: "Renaissance de la Rust Belt"
 LKT_focus_reviving_the_rustbelt_desc: "Reconstruire et ramener la stabilité économique aux anciens États de la Rust Belt aidera à intégrer les terres comme les gens qui y vivent."
 LKT_focus_northeast_renewal: "Renouveau du Nord-Est"
 LKT_focus_northeast_renewal_desc: "La dernière étape : intégrer ces derniers États sécurisera l'unité du Pacifique à l'Atlantique."
 LKT_focus_the_second_republic: "La Seconde République"
 LKT_focus_the_second_republic_desc: "Le voyage fut long et coûteux, mais la paix est revenue et l'unité se présente à nouveau sur le continent nord-américain. Plus qu'un dernier pas pour assurer l'avenir que nous nous sommes fixé."
 LKT_focus_Containment_Plan_West: "Plan d'endiguement Ouest"
 LKT_focus_Containment_Plan_West_desc: "S'étendre est primordial pour survivre dans ce monde instable et hostile. Le nouveau monde est brisé : nous devons revendiquer une part. Le plan cambrien, ou plan de confinement vers l'ouest, vise à solidifier notre contrôle de tout ce qui est à l'ouest du Mississippi. Cela devrait renforcer et créer un sentiment de sécurité plus stable pour notre peuple."
 LKT_focus_war_plan_purple: "Plan de guerre Violet"
 LKT_focus_war_plan_purple_desc: "L'un des premiers pas pour sécuriser la moitié ouest du continent nord-américain serait de sécuriser notre flanc. Cascadia barre donc la route de nos vacances pacifiques."
 LKT_focus_war_plan_skorpion: "Plan de guerre Skorpion"
 LKT_focus_war_plan_skorpion_desc: "Sécuriser la région énergétique des États du sud-ouest boostera notre stabilité économique et nous donnera un avantage significatif sur nos rivaux de l'ouest."
 LKT_focus_war_plan_yellow: "Plan de guerre Jaune"
 LKT_focus_war_plan_yellow_desc: "Sécuriser la côte Pacifique, c'est sécuriser environ la moitié des terres de l'ouest. Nous continuerons à revendiquer notre avenir et à solidifier les bases de notre nouvelle voie."
 LKT_focus_war_plan_blue: "Plan de guerre Bleu"
 LKT_focus_war_plan_blue_desc: "Le Texas sécurise l'avant-dernière pièce du puzzle ouest que nous tentons d'assembler. L'Oklahoma serait la dernière, mais nous ignorons ce qu'impliquerait politiquement de franchir le Mississippi : ce débat peut attendre."
 LKT_focus_consolidating_the_territories: "Consolider les territoires"
 LKT_focus_consolidating_the_territories_desc: "L'ouest désormais sous notre contrôle, nous devons intégrer et modeler terres et peuples en une nouvelle nation."
 LKT_focus_pacific_pearls: "Perles du Pacifique"
 LKT_focus_pacific_pearls_desc: "Intégrer et reconstruire les États du Pacifique rouvrira beaucoup du monde au commerce et au tourisme. La revitalisation des ports et des hauts lieux touristiques est critique."
 LKT_focus_southern_sunrise: "Lever du soleil du sud"
 LKT_focus_southern_sunrise_desc: "Reconstruire le sud-ouest énergétique ainsi que le Texas, économiquement fort, donnera à la nation le coup de pouce de stabilité et de prospérité dont elle a besoin."
 LKT_focus_the_western_identity: "L'identité de l'Ouest"
 LKT_focus_the_western_identity_desc: "Avec ces terres unies, nous déclarons une nouvelle nation, un nouveau peuple et une nouvelle culture."
 LKT_focus_The_Great_Barrier_Plan: "Le Grand plan-barrière"
 LKT_focus_The_Great_Barrier_Plan_desc: "Fondamentalement, personne ne devrait avoir le contrôle direct d'autant de territoire. Changeons cela et forgeons la stabilité sur le continent nord-américain. Si nous consolidons le milieu et puppetons ou achetons la loyauté de l'est et de l'ouest, nous pourrons créer une sorte d'Union confédérale nord-américaine... il faudra sans doute un meilleur nom."
 LKT_focus_vegas_odds: "Cotes à Las Vegas"
 LKT_focus_vegas_odds_desc: "Les terres de l'union dont nous n'avons pas pleinement besoin : nous en ferons usage à notre avantage pour les acquérir en vue de l'avenir que nous cherchons."
 LKT_focus_texas_tussle: "Lutte au Texas"
 LKT_focus_texas_tussle_desc: "La formation de la Grande Barrière vise à sécuriser les États centraux du centre géographique approximatif du continent nord-américain. Ce premier pas avec le Texas préparera d'autres incursions au sud."
 LKT_focus_western_consolidation: "Consolidation occidentale"
 LKT_focus_western_consolidation_desc: "Consolider le territoire puppeté qui nous borde permet une division plus égale. D'où davantage d'incitation pour notre nouveau puppet quand nous viserons la côte Pacifique."
 LKT_focus_the_great_war: "La Grande Guerre"
 LKT_focus_the_great_war_desc: "La grande guerre continentale commencera tandis que nous sécuriserons les territoires du golfe de la République du Sud. Nous n'avons certes pas besoin des États du sud, mais leur refus de céder l'Oklahoma ne nous laisse pas le choix. En bonus, nous pourrons aussi garantir qu'aucune puissance de l'est ne s'élèvera assez pour nous défier, nous et le sud."
 LKT_focus_eastern_consolidation: "Consolidation orientale"
 LKT_focus_eastern_consolidation_desc: "La Grande Guerre continentale terminée, nous pouvons intégrer les États centraux voulus et faire comprendre aux États du sud qu'ils ne seront pas annexés purement et simplement."
 LKT_focus_cartel_cleanup: "Nettoyage des cartels"
 LKT_focus_cartel_cleanup_desc: "L'étendue sud du Grand plan-barrière, c'est d'acquérir le Mexique. Quelle meilleure justification que de nettoyer les organisations de cartels qui paralysent la nation."
 LKT_focus_reorganizing_mexican_territories: "Réorganiser les territoires mexicains"
 LKT_focus_reorganizing_mexican_territories_desc: "En divisant les territoires du Mexique, nous pouvons favoriser notre puppet de l'ouest tout en solidifiant notre pouvoir sur l'état actuel des affaires."
 LKT_focus_securing_the_western_coastline: "Sécuriser le littoral ouest"
 LKT_focus_securing_the_western_coastline_desc: "Les États du proche ouest sous contrôle et le front sud sûr, nous pouvons regarder vers l'extrême ouest, la côte Pacifique. Sécuriser ces terres nous préparera au défi final."
 LKT_focus_dividing_up_the_west: "Partager l'Ouest"
 LKT_focus_dividing_up_the_west_desc: "Les terres de l'ouest sous notre contrôle, c'est à nous de les diviser raisonnablement pour promouvoir l'unité, la coopération et l'avenir commun."
 LKT_focus_improving_the_homefront: "Améliorer le front intérieur"
 LKT_focus_improving_the_homefront_desc: "En consolidant et en rendant nos gains plus cohérents, nous préparons l'objectif final du plan. La conquête du nord ne tardera pas ; comment la traiter est une autre question."
 LKT_focus_northern_investment_opportunity: "Opportunité d'investissement dans le Nord"
 LKT_focus_northern_investment_opportunity_desc: "Nous devons coopérer avec le Canada pour que nos nations travaillent ensemble : un investissement d'infrastructure ferroviaire nous reliera mieux."
 LKT_focus_operation_polar_bear: "Opération Ours Polaire"
 LKT_focus_operation_polar_bear_desc: "Nous allons au nord, pour sécuriser le reste de notre barrière et ainsi l'avenir que nous voulons créer."
 LKT_focus_the_northern_concessions: "Les concessions du Nord"
 LKT_focus_the_northern_concessions_desc: "Le nord sécurisé, nous devons maintenant rediviser les terres et assurer la stabilité du continent nord-américain pour les générations à venir."
 LKT_focus_the_continental_confederation: "La Confédération continentale"
 LKT_focus_the_continental_confederation_desc: "Nos nations se tiennent fières et unies : le nouveau monde a vu une nouvelle unité sous l'ancien drapeau lakota, et nous forgerons ensemble un nouveau nom pour une nouvelle nation. Une nation qui unit les peuples, non les terres, sous une nouvelle identité ; et quand ils seront prêts, nous formerons une Amérique du Nord unie."
 LKT_country_flag_elections: "Les élections commencent"
 LKT_Canadian_War_Goal_Unlock: "Alors c'est la guerre"
 LKT_Prairie_Federation_desc: "La [LKT.GetFlag]§YRépublique du Lakota§! change de nom en [LKT.GetFlag]§YFédération des Prairies§!"
 LKT_Free_Fields_Society_desc: "[LKT.GetFlag]§YRépublique lakota§! change de nom pour [LKT.GetFlag]§YSociété des champs libres§!"
 LKT_Grand_Duchy_Of_Yellowstone_desc: "[LKT.GetFlag]§YRépublique de Lakota§! change de nom en [LKT.GetFlag]§YGrand-duché de Yellowstone§!"
 LKT_Second_American_Republic_desc: "[LKT.GetFlag]§YRépublique de Lakota§! change de nom en [LKT.GetFlag]§Y2e République américaine§!"
 LKT_Cambrian_Nation_desc: "[LKT.GetFlag]§YRépublique de Lakota§! change de nom en [LKT.GetFlag]§YCambria§!"
 LKT_Continental_Confederation_desc: "[LKT.GetFlag]§YRépublique de Lakota§! change de nom en [LKT.GetFlag]§YConfédération continentale§!"
 LKT_divided_we_fell: "Divisés, nous sommes tombés"
 LKT_divided_we_fell_desc: "Les cendres se sont déposées et, bien que meurtris, nous ne sommes pas vaincus par cet événement soudain et sans précédent. Il faut avancer et commencer à tenir debout."
 LKT_federal_budgets: "Budgets nationaux"
 LKT_federal_budgets_desc: "Pour aller quelque part de significatif, nous devons évaluer et adapter nos budgets à nos besoins. Réparer ce qui échoue, étendre ce qui marche — si seulement c'était si simple."
 LKT_domestic_policies: "Administration des affaires intérieures Lakotan"
 LKT_domestic_policies_desc: "La LDAA est la branche du gouvernement chargée d'évaluer et de modeler les politiques et lois nationales dans le pays. En bref, pour savoir ce qui se passe avec le peuple, voyez la LDAA."
 LKT_industrial_policies: "Département du commerce et des activités économiques"
 LKT_industrial_policies_desc: "La DCEA est responsable de l'administration et du développement de l'économie nationale. Réglementations, subventions aux entreprises et le reste sont menés par l'administration pour assurer une économie assez équilibrée et stable."
 LKT_resource_management_policies: "Département des ressources naturelles"
 LKT_resource_management_policies_desc: "Le DNR est responsable de l'emploi et de la gestion de nos ressources intérieures, humaines ou matérielles."
 LKT_tax_policies: "Département des recettes"
 LKT_tax_policies_desc: "Le DoR est responsable de la collecte et de l'application des recettes fiscales. Tout changement du code fiscal ou des conditions commerciales oblige le ministère à adapter citoyens et partenaires commerciaux pour qu'ils paient leur dû dans toute forme de commerce ou d'activité économique."
 LKT_army_service_branch: "L'Armée républicaine lakotaise"
 LKT_army_service_branch_desc: "L'ARL est l'arme principale qui défend notre nation. Les cieux peuvent être remplis de nos aviateurs : ils ne valent rien si ceux au sol ne peuvent rien contre les forces ennemies présentes."
 LKT_air_force_service_branch: "Force aérienne lakotane"
 LKT_air_force_service_branch_desc: "La FAL est chargée de sécuriser les cieux pour que nos forces terrestres et navales restent à l'abri des incursions aériennes ennemies."
 LKT_navy_service_branch: "Le Service naval lakotais"
 LKT_navy_service_branch_desc: "Le SNL est un mélange. Relégué aux seules voies d'eau notables qui serpentent dans la nation, le service naval est vu plutôt comme une plaisanterie ou un moyen bon marché de réduire le chômage."
 LKT_ideas_foreign_isolation_office: "Bureau d'isolation étrangère"
 LKT_ideas_foreign_isolation_office_desc: "Au lendemain d'un tournant si violent et apparemment impossible, notre nation est désormais... eh bien, une nation. Avec l'implosion de l'ancienne république, nous formons une république nouvelle, un pari plus sûr. Le nom de Lakota, pour plaire aux minorités autochtones, permet la stabilité et une nouvelle identité. Mais avec cet espoir, beaucoup se méfient des voisins comme de toute ingérence étrangère. C'est ce sentiment qui persiste, et pourquoi certains ont surnommé le ministère des Affaires étrangères le « ministère de l'isolement étranger », faute de véritables efforts diplomatiques du gouvernement."
 LKT_ideas_agrarian_fuel_economy: "Économie de carburant agraire"
 LKT_ideas_agrarian_fuel_economy_desc: "L'agriculture fournissant la part du lion de la production, nous devons adapter le secteur énergétique. Des investissements de recherche dans les biocarburants et des moyens de réduire le besoin de vastes appareils d'infrastructure aideront à rationaliser nos besoins énergétiques."
 LKT_ideas_a_new_green_deal: "Un New Deal vert"
 LKT_ideas_a_new_green_deal_desc: "Paquet d'investissement complet, le NGD investira dans le nucléaire et le rendra aussi efficace et pratique que les percées actuelles et futures le permettront. Petites centrales, centres de recyclage des barres usées, et davantage selon la science."
 LKT_ideas_well_rounded_energy_sector: "Secteur énergétique équilibré"
 LKT_ideas_well_rounded_energy_sector_desc: "Le ministère de l'Énergie aligné sur nos besoins économiques, nous pouvons désormais assurer un avenir stable et prospère."
 LKT_ideas_improved_rail_network: "Réseau ferroviaire amélioré"
 LKT_ideas_improved_rail_network_desc: "En investissant dans nos chemins de fer, nous avons mieux relié la nation et amélioré les lignes d'approvisionnement militaires comme civiles."
 LKT_ideas_experimental_weapons_corp: "Corps d'armes expérimentales"
 LKT_ideas_experimental_weapons_corp_desc: "Dédié aux unités de réponse les plus flexibles, le CAE se consacre à la R&D et aux essais terrain pour qu'une unité de l'armée, quand elle a besoin d'aide, l'obtienne."
 LKT_ideas_lctp: "Programme d'entraînement du corps logistique"
 LKT_ideas_lctp_desc: "Le programme LCT vise à ouvrir le recrutement à ceux qui ne sont pas faits pour le front. Pour la stabilité et l'efficacité du front, nos chaînes d'approvisionnement doivent être au mieux : nous y veillerons."
 LKT_ideas_fighter_supremacy: "Suprématie des combattants"
 LKT_ideas_fighter_supremacy_desc: "En priorisant le développement et le déploiement de chasseurs, nous posons les bases de cieux clairs, à l'abri des envahisseurs."
 LKT_ideas_ground_support_supremacy: "Suprématie du soutien au sol"
 LKT_ideas_ground_support_supremacy_desc: "En priorisant l'appui au sol, même nos manques de suprématie aérienne ne devraient pas empêcher de harceler les forces terrestres ennemies. Le front se stabilise et l'ennemi ne détruit pas nos terres."
 LKT_ideas_strategic_bomber_supremacy: "Suprématie des bombardiers stratégiques"
 LKT_ideas_strategic_bomber_supremacy_desc: "En priorisant le développement et le déploiement de bombardiers stratégiques, nous briserons la volonté et la capacité de combattre de l'ennemi. Industrie et infrastructure s'écrouleront devant nos puissants bombardiers."
 LKT_ideas_strategically_cheap: "Doctrine du bon marché stratégique"
 LKT_ideas_strategically_cheap_desc: "Des cibles plus petites sont aussi plus dures à frapper. Nous pouvons user de notre rafting fluvial et de notre peu d'expérience côtière pour concevoir de nouvelles tactiques de harcèlement pour nos navires. Il y aura des inconvénients, mais nous n'en savons pas davantage : il faut apprendre d'une façon ou d'une autre."
 LKT_ideas_naval_command_structure: "Structure de commandement naval"
 LKT_ideas_naval_command_structure_desc: "En établissant une véritable structure de commandement naval organisée, nous solidifierons encore nos efforts pour créer une vraie arme navale."
 LKT_anarchist_asylum_experiement: "Expérience d'asile anarchiste"
 LKT_anarchist_asylum_experiement_desc: "Nos terres sont vastes et sous-développées : nous devons promettre de les remplir en attirant, de loin, ceux qui cherchent un lendemain meilleur."
 LKT_ideas_standardized_civil_services: "Fonctions Publiques Standardisées"
 LKT_ideas_standardized_civil_services_desc: "Créer une forme standard d'administration civile et de services publics nous permet d'intégrer passivement les nouvelles terres. En bonus, c'est aussi un travail de proximité, plus cœurs et esprits que soumission par la force."
 LKT_ideas_the_second_american_republic: "La Seconde République américaine"
 LKT_ideas_the_second_american_republic_desc: "Les terres réunifiées et le mandat revendiqué, nous établissons sur les ruines de l'ancien la 2e République américaine."
 LKT_ideas_cultivating_a_new_identity: "Cultiver une nouvelle identité"
 LKT_ideas_cultivating_a_new_identity_desc: "Les terres à l'ouest du Mississippi sont sous notre contrôle : il faut maintenant solidifier cœurs et esprits et forger une nouvelle voie."
 LKT_ideas_securing_the_new_order: "Sécuriser le nouvel ordre"
 LKT_ideas_securing_the_new_order_desc: "Notre Grand plan-barrière poursuit sa voie vers l'achèvement : nous nous concentrons davantage sur les affaires intérieures pour en assurer la stabilité. Le continent nord-américain verra paix et prospérité par une union de nations travaillant à un but commun."
 LKT_collapse_event.1.t: "Pas grand-chose, mais juste assez"
 LKT_collapse_event.1.d: "La tempête passée et les choses se calmant, nous devons reconstruire nos États et nous réorganiser en une nouvelle nation. Mais avec si peu de développement au départ, il n'y a pas grand-chose à reconstruire. L'une des principales questions au peuple sera donc : quelle économie voulons-nous. Quoi qu'il en soit, ce n'est pas grand-chose, mais c'est un travail honnête."
 LKT_collapse_event.1.o1: "Eh bien, mettons-nous au travail, je suppose"
 LKT_nation_name_event.1.t: "Une nouvelle nation"
 LKT_nation_name_event.1.d: "Les autochtones étant si peu nombreux, nous n'avons cure de garder le nom soi-disant « sûr géographiquement et respectueux de l'histoire » de Lakota. Nous deviendrons plutôt les Grands Plaines de la nouvelle Fédération des Prairies."
 LKT_nation_name_event.1.o1: "Car ces terres sont nos terres !"
 LKT_nation_name_event.2.t: "Une nation libre ?"
 LKT_nation_name_event.2.d: "La société élue, beaucoup se demandent si c'est vraiment la page à tourner pour prévaloir dans un proche avenir. Un grand débat s'élève donc. D'un côté, ceux qui veulent prévaloir sous le prétexte de la Société des champs libres : un cadre quasi anarchiste pour tenir seuls. De l'autre, garder le statu quo et chercher de meilleures options si possible. Mais que veut le peuple ?"
 LKT_nation_name_event.2.o1: "La Société des champs libres !"
 LKT_nation_name_event.2.o2: "C'est peut-être trop tôt ?"
 LKT_nation_name_event.3.t: "Une nation royale ?"
 LKT_nation_name_event.3.d: "Surprise : la Maison de Yellowstone a été élue. Le parti promet des moyens démocratiques élargis pour le vote ainsi qu'un suffrage universel de base pour impliquer au maximum les citoyens. Seule différence : des titres féodaux seront assignés aux charges élues, changeant ainsi cosmétique le sens et l'éthos du gouvernement. Certains se demandent s'il faut vraiment transitionner la nation, ou rester le cap."
 LKT_nation_name_event.3.o1: "Nous serons le Grand-duché !"
 LKT_nation_name_event.3.o2: "Un peu trop fantaisiste pour être pratique ?"
 LKT_nation_name_event.4.t: "Établir la nouvelle République"
 LKT_nation_name_event.4.d: "La nation au bord de la reconstruction, nous devons solidifier notre mandat par l'établissement de la 2e République américaine. Des cendres de l'ancien s'élève une nouvelle voie."
 LKT_nation_name_event.4.o1: "Vive la Nouvelle République !"
 LKT_nation_name_event.5.t: "L'identité de l'Ouest"
 LKT_nation_name_event.5.d: "Les terres de l'ouest sont sous une bannière : nous déclarons une nouvelle nation. Cambria. En référence au landmark intemporel qui définit une part significative de nos terres, la chaîne des Rocheuses. Des fossiles de l'ère cambrienne s'y trouvent : nous en faisons le signe que nous sommes citoyens et peuple de Cambria. Nous défendrons et nourrirons terres et peuples jusqu'à la fin des temps."
 LKT_nation_name_event.5.o1: "Gloire à Cambria !!!"
 LKT_event.10.t: "L'« investissement mutuel »"
 LKT_event.10.d: "Le Canada n'est développé que là où il le faut : nous pourrions « l'aider » en investissant dans une connexion ferroviaire mutuelle pour mieux échanger et transporter. S'ils acceptent, pas de problème ; s'ils refusent... alors nous en aurons un."
 LKT_event.10.o1: "Espérons qu'ils acceptent"
 LKT_event.11.t: "Une offre d'investissement"
 LKT_event.11.d: "La République de Lakota nous fait une offre intéressante. Ils veulent construire un chemin de fer des Dakotas jusqu'à la ligne principale à Regina, Saskatchewan, ainsi qu'à Winnipeg, Manitoba. Cela aiderait commerce, tourisme et coopération générale. Nous n'y voyons pas vraiment de problème, mais certains au parlement y voient un faux prétexte vu les activités récentes de la république. Quelle est notre réponse ?"
 LKT_event.11.o1: "Approuver l'accord"
 LKT_event.11.o2: "Refuser poliment leur offre"
 LKT_event.111.t: "L'accord s'effondre"
 LKT_event.111.d: "Les Canadiens ont refusé notre offre : il faudra revoir la situation, car il n'y a pas d'autre voie pour l'heure."
 LKT_event.111.o1: "Est-ce des tambours que j'entends ?"
 LKT_event.12.t: "Début des travaux"
 LKT_event.12.d: "L'accord est approuvé et la construction a commencé : espérons un projet fluide, achevé d'ici la fin du mois."
 LKT_event.12.o1: "Tout selon le plan"
 LKT_event.13.t: "Ennuis sur le Great Northern"
 LKT_event.13.d: "Les équipes du projet signalent d'étranges incidents. Alors que le projet est presque fini, des membres d'équipage manquent et une animosité monte chez les nôtres contre les Lakotais. Nous ignorons ce qui se passe, mais nous soupçonnons au minimum un coup fourré."
 LKT_event.13.o1: "Je n'aime pas ce sentiment..."
 LKT_event.14.t: "Des Canadiens assoiffés de sang !?!"
 LKT_event.14.d: "Journaux et télévisions hurlent : « Des Canadiens assoiffés de sang tuent de braves Lakotais au travail », tandis que la nation s'insurge des rumeurs du récent projet ferroviaire avec le gouvernement canadien. Les choses allant mieux que prévu, nous nous en servirons pour instiguer la guerre que nous voulons plutôt que celle que nous aurions pu avoir."
 LKT_event.14.o1: "Envoyez-leur nos exigences !"
 LKT_event.15.t: "Une situation qui s'aggrave"
 LKT_event.15.d: "Les exigences lakotaises viennent d'atteindre le gouvernement : ils demandent compensation pour les vies lakotaise perdues, sous forme d'investissements industriels et du prix du projet. La somme totale avoisine 35 milliards, et beaucoup de Canadiens sont indignés des accusations contre leurs compatriotes. Une décision vraiment difficile s'impose."
 LKT_event.15.o1: "Sauver la face et simplement payer"
 LKT_event.15.o2: "Hors de question, on va leur montrer"
 LKT_event.16.t: "Un résultat inattendu"
 LKT_event.16.d: "D'une certaine façon, nous avons échoué... avec succès ? Mais ce n'est pas le vrai résultat voulu : il faut préparer le plan B."
 LKT_event.16.o1: "Organiser les troupes"
 LKT_politics.1.t: "La campagne commence"
 LKT_politics.1.d: "Partout dans la nation, des partis se forment et les gens se rassemblent derrière ceux qu'ils croient les mieux placés pour gouverner. Tandis que de petites querelles éclatent aussi parmi les plus durs, beaucoup sont impatients de voir où ira la nation."
 LKT_politics.1.o1: "À la guerre comme à l'amour, tout est permis"
 LKT_politics.2.t: "Le « Conseil des partis d'autorité »"
 LKT_politics.2.d: "Dans la confusion et la course aux voix, un ensemble de partis aux styles de direction assez proches a formé un bloc de vote. Ce soi-disant Conseil d'autorité serait, croit-on, un ensemble de partis fonctionnant comme des oligarchies. Chaque parti refuse cette référence dégradante, mais certains membres ne peuvent nier certains aspects de gestion récents. Quoi qu'il en soit, c'est au peuple de voter et de décider qui il veut à la tête de la nation."
 LKT_politics.2.o1: "DDP gagne !"
 LKT_politics.2.o2: "KCK gagne !"
 LKT_politics.2.o3: "LTP gagne !"
 LKT_politics.2.o4: "L'AFL gagne-t-elle ?"
 LKT_politics.2.o5: "Ça ne peut pas être tout le monde, qui est le suivant"
 LKT_politics.3.t: "Les partis pour la tradition"
 LKT_politics.3.d: "La tension monte : un nouveau bloc de pouvoir se forme, un ensemble de partis de droite et de centre droit tentant un bloc de vote. Ils se rassemblent autour de l'intérêt partagé de tenir les traditions, nouvelles et anciennes, des terres et de leurs peuples. Les partis pour la tradition croient que le changement peut advenir, mais sans jeter le passé pour autant. Néanmoins, c'est au peuple de voter, voter et voter pour assurer la victoire du parti qu'il souhaite."
 LKT_politics.3.o1: "ORP gagne !"
 LKT_politics.3.o2: "Le TTP gagne !"
 LKT_politics.3.o3: "LTSP gagne !"
 LKT_politics.3.o4: "Il y a sûrement d'autres options. Attendez, regardez là-bas"
 LKT_politics.4.t: "Les partis du progrès du peuple"
 LKT_politics.4.d: "Le bloc économique socialiste naissant a gagné du terrain purement pour contrer la montée des Nouveaux nationaux lakotais. Cette soi-disant dichotomie « gauche-droite » signifie que la politique de la nation se fragmente encore. Mais tandis que le vote commence et que le peuple avance selon ce qu'il croit juste, beaucoup se demandent qui sera le premier parti au pouvoir de la jeune nation."
 LKT_politics.4.o1: "Le PPA prend la tête"
 LKT_politics.4.o2: "FRF coude à coude avec la SAL"
 LKT_politics.4.o3: "PR coude à coude avec la RRA"
 LKT_politics.4.o4: "Vous avez dit qu'il y en a plus ?!"
 LKT_politics.5.t: "Les Nouveaux nationaux lakotais, partis"
 LKT_politics.5.d: "Les Nouveaux nationaux lakotais sont un mouvement pro-nationaliste montant de partis axés sur l'isolement et la préservation de la nouvelle identité avant presque tout. Beaucoup s'interrogent sur le sort des minorités, mais la plupart croient aussi que l'interconnexion du globe a provoqué la grande implosion de l'ancienne république. Certains voteront toutefois pour le nouveau bloc simplement pour contrer les partis économiques socialistes, nés plus naturellement du peu ou pas de développement des terres."
 LKT_politics.5.o1: "YIP gagne !"
 LKT_politics.5.o2: "La SDS à égalité avec la LCO"
 LKT_politics.5.o3: "La Maison gagne toujours ?"
 LKT_politics.5.o4: "C'est l'heure du retour en arrière"
 LKT_focus_metallic_bloodlines_act: "Loi sur les lignées métalliques"
 LKT_focus_metallic_bloodlines_act_desc: "Le MBA est un paquet de financement pour relancer et sécuriser la capacité de notre nation à disposer d'une offre intérieure de fer et d'acier. L'acier surtout est le second pilier de la vie d'une économie, après la main-d'œuvre et le béton."
 LKT_focus_metallic_masters: "Moyens métalliques"
 LKT_focus_metallic_masters_desc: "Poursuivre notre indépendance nationale signifie malheureusement creuser à la fois profond et goulûment. Un petit gisement de métaux légers se trouve dans le Dakota du Sud, ce qui devrait nous permettre de diversifier nos capacités économiques."
 LKT_focus_bio_fuel_prominence: "Importance des biocarburants"
 LKT_focus_bio_fuel_prominence_desc: "Par un développement infatigable des biocarburants et de l'écosystème qu'ils exigent, nous pouvons créer une énergie plus efficace et plus abondante. Cela réduira la demande globale ainsi que le coût potentiel en terres et ressources, réservées à de meilleurs besoins du peuple et de la nation."