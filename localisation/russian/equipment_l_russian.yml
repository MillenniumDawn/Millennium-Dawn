 carrier_7: "Авианосец 2045 года"
 carrier_7_desc: "Со времён окончания Второй мировой войны авиация господствует в военно-морской доктрине, а эти символы мощи зачастую являются самым ценным достоянием любой морской державы. Присутствие авианосца может решить исход сражения. Несмотря на огромное значение и влияние, авианосцы довольно плохо защищены сами по себе, поэтому их необходимо постоянно сопровождать."
