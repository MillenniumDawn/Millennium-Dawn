l_english:
 TOP_authorization.1.t: "Target Nomination: Intelligence Review"
 TOP_authorization.1.d: "Proposed method: [TOP_proposal_method_name].\nReview standard: [TOP_proposal_rigor_name].\nIntelligence confidence: [?TOP_confidence^TOP_proposal_target|0]/100.\nCivilian assurance assessment: [?TOP_proposal_civilian_assurance|0]/100.\nDetention alternative: [TOP_proposal_capture_name].\n\nThe agencies have submitted a case concerning [TOP_proposal_name] in [?TOP_proposal_state.GetName]. Reviewers must establish a credible identification, assess risks to civilians, consider whether detention is feasible, and confirm the political authority for the proposed action.\n\nStandard review requires 60 confidence and civilian assurance; enhanced review requires 80 in both. Enhanced review cannot approve a lethal method when detention is assessed feasible. A returned case can be resubmitted for capture or after further collection. The review applies to this person, method, and location only."
 TOP_authorization.1.a: "Submit the reviewed case."
 TOP_authorization.1.b: "Return the dossier for further collection."
 TOP_authorization.1.c: "Withdraw or close this nomination."
 TOP_authorization.2.t: "Target Nomination: Host-State Consultation"
 TOP_authorization.2.d: "The case concerning [TOP_proposal_name] has passed the initial review. Ministers must now settle responsibility for action in [?TOP_proposal_state.GetName]. Cooperation may provide a route to detention and reduce diplomatic damage. A unilateral proposal requires an explicit decision by our senior leadership and carries the risk of exposure and a sovereignty dispute.\n\nConsultation grants no general permission to act elsewhere. A partner operation requires affirmative consent."
 TOP_authorization.2.a: "Request consent for this operation."
 TOP_authorization.2.b: "Submit a unilateral proposal."
 TOP_authorization.2.c: "Submit the domestic case for senior approval."
 TOP_authorization.2.e: "Defer or close this proposal."
 TOP_authorization.3.t: "Request for a Targeted Operation"
 TOP_authorization.3.d: "[?TOP_incoming_actor.GetName] requests our consent for [TOP_incoming_method_name] in [?TOP_incoming_state.GetName] concerning dossier [?TOP_incoming_target|0]. The request is limited to that person, location, and proposed method. Our response does not grant standing access for other operations.\n\nConsent will return the case to the requesting government's senior leadership. Refusal may end the proposal or prompt a separate unilateral decision. A withdrawn or expired request carries no authority."
 TOP_authorization.3.a: "Consent to the specific proposal."
 TOP_authorization.3.b: "Decline or close this request."
 TOP_authorization.4.t: "Target Nomination: Senior Authorization"
 TOP_authorization.4.d: "Proposed method: [TOP_proposal_method_name].\n\nThe reviewed proposal concerning [TOP_proposal_name] in [?TOP_proposal_state.GetName] is before our senior leadership. Approval records responsibility for this specific operation and establishes a limited mandate. Intelligence, political authority, and control of the proposed location remain conditions for execution.\n\nA mandate may be revoked, and a changed or stale case must return for review. Approval does not itself establish that the target will be captured or killed. The subsequent assessment must distinguish confirmed results from unresolved reports."
 TOP_authorization.4.a: "Approve the reviewed mandate."
 TOP_authorization.4.b: "Approve and accept responsibility for unilateral action."
 TOP_authorization.4.c: "Withhold approval or close this case."
 TOP_review_pending: "An authorization review or its unresolved notification is pending."
 TOP_enhanced_review_government: "Our government applies enhanced scrutiny."
 TOP_review_lethal: "The proposal seeks a lethal outcome."
 TOP_review_valid: "The original target, method, location, political authority, intelligence, capabilities, and funding remain valid."
 TOP_review_staff_ready: "Staff review is satisfied. Standard review requires 60 intelligence confidence and civilian assurance. Enhanced review requires 80 in both, and lethal proposals require no feasible detention alternative."
 TOP_review_can_approve: "The senior review is complete and the proposal remains valid. Partner operations require consent."
 TOP_host_request_matches: "This request still matches the sender's active nomination."
 TOP_staff_review_tt: "The case advances to consultation and senior review. This does not authorize an operation."
 TOP_return_collection_tt: "Continue collecting intelligence on the original person and close this nomination. Submit a fresh proposal when the case is ready."
 TOP_host_consent_tt: "Consent applies only to the recorded person, method, and location. The requesting government must still approve the operation."
 TOP_host_refusal_tt: "A partner operation cannot proceed. Other methods require a separate senior decision accepting unilateral responsibility."
 TOP_unilateral_review_tt: "Record that host-state consent has not been obtained. Execution can cause diplomatic and domestic consequences."
 TOP_domestic_review_tt: "The case proceeds under our own jurisdiction, subject to the same intelligence and senior review requirements."
 TOP_mandate_approved_tt: "Approve a mandate lasting 91 days for the original person, method, and location. Native raids still require preparation and launch. Other methods begin their timed mission."

 TOP_review_method_drone: "a drone strike"
 TOP_review_method_capture: "a capture raid"
 TOP_review_method_covert: "covert lethal action"
 TOP_review_method_rendition: "a rendition operation"
 TOP_review_method_partner: "partner detention"
 TOP_review_method_sabotage: "sabotage"
 TOP_review_method_unknown: "an unrecorded method"
 TOP_review_enhanced: "Enhanced"
 TOP_review_standard: "Standard"
 TOP_review_capture_feasible: "Assessed feasible"
 TOP_review_capture_unavailable: "No feasible route identified"
 TOP_opportunity.1.t: "2024 Counterterrorism Review: Dispersed Networks"
 TOP_opportunity.1.d: "The annual intelligence review has brought together reporting on the militant networks already under investigation. Analysts have emphasized the challenge of dispersed leadership and connections between regional organizations.\n\nA renewed lead concerning [TOP_modern_2024_name] has been added to the dossier. Further collection and the normal authorization process are still required. This report records intelligence work already completed, and does not confirm the person's present location or fate."
 TOP_opportunity.1.a: "Keep the dossier under review."
 TOP_opportunity.2.t: "2025 Counterterrorism Review: Regional Connections"
 TOP_opportunity.2.d: "Our annual review has examined how militant organizations adapt to counterterrorism pressure and maintain links across regions. Analysts have given additional attention to African networks where our existing dossiers support it, while retaining cases that remain more urgent elsewhere.\n\nA renewed lead concerning [TOP_modern_2025_name] has been added to the dossier. Its value will depend on continued collection. Ministers have granted no operational authority through this review, and the report makes no finding about the person's current fate."
 TOP_opportunity.2.a: "Continue assessing the network."
 TOP_opportunity.3.t: "2026 Counterterrorism Review: Persistent Threats"
 TOP_opportunity.3.d: "The intelligence services have reviewed the organizations and individuals that remain active in our investigations. The possibility of cooperation among regional networks requires continued attention even when their leadership has changed. Our analysts have prioritized relevant Al-Qaeda and TTP cases where our existing intelligence supports them.\n\nA renewed lead concerning [TOP_modern_2026_name] has been placed in the dossier. This is an intelligence opportunity, not confirmation of the target's present whereabouts or authorization to act."
 TOP_opportunity.3.a: "Maintain collection and review."
