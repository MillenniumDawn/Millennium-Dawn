 NKO_trade_agreements_with_egypt_desc:0 "Formar acordos comerciais com [EGY.GetName] aprimorará a cooperação econômica. Negociaremos termos favoráveis para garantir trocas mutuamente benéficas e fortalecer nossas relações bilaterais."
 NKO_trade_agreements_with_sirya:0 "Acordos Comerciais com [SYR.GetName]"
 NKO_trade_agreements_with_sirya_desc:0 "Formar acordos comerciais com [SYR.GetName] aprimorará a cooperação econômica. Negociaremos termos favoráveis para garantir trocas mutuamente benéficas e fortalecer nossas relações bilaterais."
 NKO_trade_agreements_with_iraq:0 "Acordos Comerciais com [IRQ.GetName]"
 NKO_trade_agreements_with_iraq_desc:0 "Formar acordos comerciais com [IRQ.GetName] aprimorará a cooperação econômica. Negociaremos termos favoráveis para garantir trocas mutuamente benéficas e fortalecer nossas relações bilaterais."
 NKO_trade_agreements_with_iran:0 "Acordos Comerciais com [PER.GetName]"
 NKO_trade_agreements_with_iran_desc:0 "Formar acordos comerciais com [PER.GetName] aprimorará a cooperação econômica. Negociaremos termos favoráveis para garantir trocas mutuamente benéficas e fortalecer nossas relações bilaterais."
 NKO_trade_agreements_with_venesuela:0 "Acordos Comerciais com [VEN.GetName]"
 NKO_trade_agreements_with_venesuela_desc:0 "Formar acordos comerciais com [VEN.GetName] aprimorará a cooperação econômica. Negociaremos termos favoráveis para garantir trocas mutuamente benéficas e fortalecer nossas relações bilaterais."
 NKO_trade_agreements_with_brazilia:0 "Acordos Comerciais com [BRA.GetName]"
 NKO_trade_agreements_with_brazilia_desc:0 "Formar acordos comerciais com [BRA.GetName] aprimorará a cooperação econômica. Negociaremos termos favoráveis para garantir trocas mutuamente benéficas e fortalecer nossas relações bilaterais."
 NKO_trade_agreements_with_indonesia:0 "Acordos Comerciais com [IND.GetName]"
 NKO_trade_agreements_with_indonesia_desc:0 "Formar acordos comerciais com [IND.GetName] aprimorará a cooperação econômica. Negociaremos termos favoráveis para garantir trocas mutuamente benéficas e fortalecer nossas relações bilaterais."
 NKO_use_russian_model:0 "Usar Modelos Navais Russos"
 NKO_use_russian_model_desc:0 "Em nossa busca por uma marinha poderosa, adotaremos e adaptaremos as estratégias e os projetos navais de nossos aliados russos, impulsionando nossa frota a maiores capacidades."
 NKO_armed_to_the_teeth:0 "Armados até os Dentes"
 NKO_armed_to_the_teeth_desc:0 "Cada embarcação será equipada com o armamento mais formidável. Faremos de nossa marinha uma força indomável que inspira temor em nossos inimigos."
 NKO_heavy_cruiser_focus:0 "Foco em Cruzadores Pesados"
 NKO_heavy_cruiser_focus_desc:0 "Para projetar nosso poder pelos mares, focaremos na construção de cruzadores fortemente blindados que dominem as águas e resistam a qualquer adversário."
 NKO_the_north_korean_carrier:0 "Porta-Aviões Norte-Coreano"
 NKO_the_north_korean_carrier_desc:0 "Uma frota de porta-aviões é um símbolo de nosso poderio tecnológico. Desenvolveremos nossos próprios porta-aviões para levar a bandeira da ideologia Juche a águas distantes."
 NKO_the_korean_typhoon_class:0 "Classe Typhoon Norte-Coreana"
 NKO_the_korean_typhoon_class_desc:0 "Inspirada em poderosos submarinos de todo o mundo, nossa própria classe Typhoon reforçará nossas capacidades submarinas, uma ameaça silenciosa a quem ousar nos desafiar."
 NKO_ship_launched_cruise_missiles:0 "Mísseis de Cruzeiro Lançados de Navios"
 NKO_ship_launched_cruise_missiles_desc:0 "Nossa marinha será equipada com os mais recentes mísseis de cruzeiro lançados de navios, ampliando nosso alcance e poder para atingir alvos muito além de nossas costas."
 NKO_korean_mariens:0 "Fuzileiros Navais Norte-Coreanos"
 NKO_korean_mariens_desc:0 "Formar unidades de fuzileiros navais de elite nos permitirá conduzir operações anfíbias e assegurar o controle de locais estratégicos de forma rápida e decisiva."
 NKO_get_russian_help:0 "Buscar Assistência Militar Russa"
 NKO_get_russian_help_desc:0 "Para reforçar nossa tecnologia militar, buscaremos a ajuda da Rússia, um aliado de confiança, para nos fornecer a perícia e o equipamento necessários."
 NKO_get_chinese_help:0 "Buscar Assistência Militar Chinesa"
 NKO_get_chinese_help_desc:0 "Para reforçar nossa tecnologia militar, buscaremos a ajuda da China, um aliado de confiança, para nos fornecer a perícia e o equipamento necessários."
 NKO_our_jet:0 "Caça de Produção Nacional"
 NKO_our_jet_desc:0 "Continuaremos nossa pesquisa no campo da aviação, a fim de acelerar o recebimento dos mais recentes caças, mas já de produção nacional."
 NKO_korean_ground_forces:0 "Fortalecer as Forças Terrestres Norte-Coreanas"
 NKO_korean_ground_forces_desc:0 "Nossas forças terrestres são a espinha dorsal de nossa defesa. Investiremos em seu treinamento e equipamento, garantindo sua prontidão para qualquer batalha."
 NKO_doctrine_modernization:0 "Modernizar Nossa Doutrina"
 NKO_doctrine_modernization_desc:0 "Adotaremos uma abordagem moderna da guerra, garantindo que nossas doutrinas reflitam as realidades das táticas e estratégias militares atuais."
 NKO_implement_new_doctrine:0 "Implementar Nova Doutrina"
 NKO_implement_new_doctrine_desc:0 "Ao implementar novas estratégias, dotamos nossas forças de táticas inovadoras e maior eficácia no campo de batalha."
 NKO_superior_firepower:0 "Doutrina de Poder de Fogo Superior"
 NKO_superior_firepower_desc:0 "Focando no poder de fogo, equiparemos nossas forças para empregar força esmagadora e obter vitórias decisivas."
 NKO_keep_our_doctrine:0 "Manter Nossa Doutrina Tradicional"
 NKO_keep_our_doctrine_desc:0 "Nossa doutrina tradicional nos serviu bem. Vamos refiná-la e mantê-la, extraindo força de nosso passado e adaptando-a aos conflitos futuros."
 NKO_train_the_south:0 "Treinar para a Guerra no Sul"
 NKO_train_the_south_desc:0 "Com possíveis conflitos no Sul, devemos preparar nossas forças especificamente para esse ambiente, prontas para combater com resiliência e determinação."
 NKO_mass_assault_prevails:0 "O Assalto em Massa Prevalece"
 NKO_mass_assault_prevails_desc:0 "Nossa doutrina de força esmagadora pelo puro número continua eficaz. Manteremos nossa estratégia de assalto em massa, desgastando qualquer oposição."
 NKO_special_mass_assault:0 "Unidades Especializadas de Assalto em Massa"
 NKO_special_mass_assault_desc:0 "Para aperfeiçoar nossa estratégia de assalto em massa, desenvolveremos unidades especializadas treinadas especificamente para explorar os pontos fortes dessa tática."
 NKO_korean_iron_fist:0 "O Punho de Ferro Norte-Coreano"
 NKO_korean_iron_fist_desc:0 "Nosso poder será um punho de ferro que esmaga qualquer oposição. Por meio de treinamento e disciplina rigorosos, preparamos nossas forças para encarnar essa vontade inquebrantável."
 NKO_defend_our_skies:0 "Defender Nossos Céus"
 NKO_defend_our_skies_desc:0 "Nossas defesas aéreas devem ser formidáveis. Priorizaremos a defesa de nosso espaço aéreo, garantindo que nenhuma aeronave inimiga possa se aproximar sem ser detectada."
 NKO_defend_the_coast:0 "Defender Nossa Costa"
 NKO_defend_the_coast_desc:0 "Nossas defesas costeiras devem ser vigilantes. Fortificaremos nosso litoral, dissuadindo qualquer tentativa de invasão e protegendo nossa soberania."
 NKO_harts:0 "Táticas de Reconhecimento de Alta Altitude"
 NKO_harts_desc:0 "Adotaremos táticas avançadas de reconhecimento para monitorar os movimentos inimigos e obter informações valiosas de grandes altitudes."
 NKO_upgrade_our_radar:0 "Modernizar Nossos Sistemas de Radar"
 NKO_upgrade_our_radar_desc:0 "Para detectar ameaças à distância, aprimoraremos nossa tecnologia de radar, dando-nos um sistema de alerta antecipado contra quaisquer perigos que se aproximem."
 NKO_counter_enemy_missiles:0 "Contrapor os Mísseis Inimigos"
 NKO_counter_enemy_missiles_desc:0 "Para proteger nossa pátria, devemos desenvolver contramedidas contra mísseis inimigos, garantindo nossa segurança diante de ameaças aéreas."
 NKO_army_supply_hubs:0 "Estabelecer Centros de Suprimento do Exército"
 NKO_army_supply_hubs_desc:0 "Para sustentar nossas forças, construiremos centros de suprimento que garantam que nosso exército esteja sempre pronto e bem abastecido para operações prolongadas."
 NKO_mass_drones:0 "Produção em Massa de Drones"
 NKO_mass_drones_desc:0 "Começaremos a focar na produção em massa de drones para dar ao nosso exército os melhores drones!"
 NKO_more_zavods:0 "Investimentos em Nosso Complexo Militar-Industrial"
 NKO_more_zavods_desc: ""
 NKO_young_red_guard_idea:0 "Guardas Jovens Vermelhos"
 NKO_young_red_guard_idea1:0 "Guardas Jovens"
 NKO_army_sso:0 "Forças de Operações Especiais do Exército"
 NKO_war_university:0 "Universidade Militar Kim Il Sung"
 NKO_vpk:0 "Complexo Militar-Industrial Nacional"
 NKO_sad_army_idea:0 "Exército Popular Obsoleto"
 NKO_sad_army_idea_desc:0 "Este espírito nacional será §YAprimorado§! se concluirmos os focos de §HEspírito Militar Revolucionário§!. \n§W--------------§!\nO exército da Coreia do Norte, embora conte com um contingente significativo, depende fortemente de equipamentos e tecnologia obsoletos. Grande parte de seu arsenal consiste em tanques, artilharia e aeronaves da era soviética, com modernização limitada. Essa dependência de sistemas antigos reflete restrições de recursos e sanções internacionais, tornando o exército formidável em números, mas desafiado em eficiência e capacidade em comparação com forças armadas modernas."
 NKO_new_army_idea:0 "Novo Exército Popular Norte-Coreano"
 NKO_new_army_idea_desc:0 "O exército modernizado da Coreia do Norte combina tecnologias avançadas de produção própria com melhorias estratégicas em ativos militares-chave. Sistemas de mísseis aprimorados, drones e capacidades de guerra cibernética mostram uma mudança rumo à modernização. Embora ainda limitado por sanções, o foco em inovação e táticas de guerra assimétrica faz do exército uma força formidável na região."
 NKO_marines_idea:0 "Corpo de Fuzileiros Navais"
 NKO_unite_sport_team:0 "Equipe Olímpica Unificada"
 NKO_unite_sport_team_desc: ""
