 module_helipads_1: "Helipuertos I"
 module_helipads_1_desc: "Las instalaciones básicas de helipistas permiten a los buques de guerra operar helicópteros ligeros para misiones de reconocimiento, transporte y guerra antisubmarina limitada, expandiendo la flexibilidad operativa del navío.\n\n§GConsejo de diseño: Las helipistas mejoran la detección de submarinos, la guerra antisubmarina, la detección de superficie y el dragado de minas, al tiempo que aumentan los puntos de vida. Son ideales para escoltas ASW y buques de patrulla, pero incrementan el coste de producción, el uso de combustible, la mano de obra y la visibilidad de superficie.§!"
 module_helipads_2: "Helipuertos II"
 module_helipads_2_desc: "Los diseños mejorados de helipistas incluyen equipos de manipulación optimizados, soporte de mantenimiento y una mejor integración con los sistemas del buque, permitiendo operaciones sostenidas de helicópteros en una gama más amplia de misiones.\n\n§GConsejo de diseño: Las helipistas mejoran la detección de submarinos, la guerra antisubmarina, la detección de superficie y el dragado de minas, al tiempo que aumentan los puntos de vida. Son ideales para escoltas ASW y buques de patrulla, pero incrementan el coste de producción, el uso de combustible, la mano de obra y la visibilidad de superficie.§!"
 module_helipads_3: "Helipuertos III"
 module_helipads_3_desc: "Las instalaciones de aviación avanzadas proporcionan cubiertas de vuelo optimizadas, sistemas de soporte e integración de mando, lo que permite operar de manera eficiente múltiples helicópteros modernos para tareas de vigilancia, guerra antisubmarina y proyección de fuerzas.\n\n§GConsejo de diseño: Las helipistas mejoran la detección de submarinos, la guerra antisubmarina, la detección de superficie y el dragado de minas, al tiempo que aumentan los puntos de vida. Son ideales para escoltas ASW y buques de patrulla, pero incrementan el coste de producción, el uso de combustible, la mano de obra y la visibilidad de superficie.§!"
 module_flight_deck_1: "Cubierta de portaaviones ligero (10)"
 module_flight_deck_1_desc: "Este módulo dicta el tamaño del barco. Los portaaviones más grandes podrán albergar más aviones y tendrán una mayor integridad estructural, pero serán más fáciles de detectar y de impactar. Requieren más combustible y mano de obra, y costarán más.\n\n§GConsejo de diseño: Una cubierta de vuelo añade tamaño de cubierta, detección de portaaviones y puntos de vida, definiendo al buque como un portaaviones. Utilízala para el poder de aviación naval, pero ten en cuenta que los costes principales de producción, mano de obra, combustible y visibilidad de superficie aumentan con el tamaño de la cubierta.§!"
 module_flight_deck_2: "Cubierta de portaaviones ligero II (20)"
 module_flight_deck_2_desc: "$module_flight_deck_1_desc$"
 module_flight_deck_3: "Cubierta de portaaviones mediano (30)"
 module_flight_deck_4: "Cubierta de portaaviones mediano II (40)"
 module_flight_deck_5: "Cubierta de portaaviones grande (50)"
 module_flight_deck_6: "Cubierta de portaaviones grande II (60)"
 module_flight_deck_7: "Cubierta de superportaaviones (70)"
 module_flight_deck_8: "Cubierta de superportaaviones II (80)"
 module_flight_deck_9: "Cubierta de superportaaviones avanzado (90)"
 module_flight_deck_10: "Cubierta de superportaaviones avanzado II (100)"
 module_light_flight_deck_1: "Muelle de Transporte Anfibio"
 module_light_flight_deck_1_desc: "Los muelles de transporte anfibio proporcionan instalaciones básicas de aviación y de cubierta de abordaje para transportar tropas, vehículos y embarcaciones de desembarco. Estos barcos permiten una proyección de poder limitada y apoyan las operaciones anfibias cerca de costas hostiles.\n\n§GConsejo de diseño: Las cubiertas de vuelo ligeras sacrifican ataque de cañón en favor de tamaño de cubierta a medida que avanzan los niveles. Utiliza el muelle de transporte para potencia de fuego directa o las cubiertas de asalto posteriores para aviación embarcada.§!"
 module_light_flight_deck_2: "Asalto en Helicóptero Multipropósito"
 module_light_flight_deck_2_desc: "Las plataformas de asalto de helicópteros polivalentes expanden los diseños de transporte anfibio al enfatizar las operaciones de ala rotatoria. Las cubiertas de vuelo mejoradas y las instalaciones de mando optimizan el despliegue de tropas, el apoyo logístico y las capacidades de respuesta rápida.\n\n§GConsejo de diseño: Las cubiertas de vuelo ligeras sacrifican ataque de cañón en favor de tamaño de cubierta a medida que avanzan los niveles. Utiliza el muelle de transporte para potencia de fuego directa o las cubiertas de asalto posteriores para aviación embarcada.§!"
 module_light_flight_deck_3: "Asalto de Helicóptero de Aterrizaje"
 module_light_flight_deck_3_desc: "Los buques de asalto de helicópteros de desembarco representan navíos de asalto anfibio completamente desarrollados, capaces de sostener operaciones de helicópteros y una proyección de fuerzas coordinada. Estas plataformas permiten desembarcos anfibios a gran escala, operaciones de mando y control, y guerra expedicionaria.\n\n§GConsejo de diseño: Las cubiertas de vuelo ligeras sacrifican ataque de cañón en favor de tamaño de cubierta a medida que avanzan los niveles. Utiliza el muelle de transporte para potencia de fuego directa o las cubiertas de asalto posteriores para aviación embarcada.§!"
 module_fuel_tank: "Tanques de Combustible"
 module_fuel_tank_desc: "Tanques de combustible expandidos para permitir mayores tiempos de navegación del buque antes de tener que regresar eventualmente de su despliegue.\n\n§GConsejo de diseño: Los tanques de combustible aumentan enormemente el alcance máximo, lo que los hace útiles para patrullas y despliegues lejanos. Añaden una pequeña cantidad de coste de producción, uso de combustible, mano de obra y visibilidad de superficie.§!"
 module_esm_1: "ESM I"
 module_esm_1_desc: "Los primeros sistemas de medidas de apoyo electrónico (ESM) permiten a los buques detectar, identificar y clasificar las emisiones de radar enemigas. Estos sistemas mejoran la conciencia situacional y proporcionan una alerta temprana limitada contra amenazas hostiles.\n\n§GConsejo de diseño: Las ESM aumentan los puntos de vida y reducen la visibilidad de superficie, mejorando la supervivencia contra la detección y el ataque. Son útiles en combatientes valiosos, pero elevan el coste de producción y requieren microchips.§!"
 module_esm_2: "ESM II"
 module_esm_2_desc: "Las suites ESM mejoradas cuentan con una cobertura de frecuencia ampliada y un procesamiento de señales más rápido, mejorando la capacidad de rastrear los sensores enemigos y apoyar las contramedidas defensivas en entornos electromagnéticos complejos.\n\n§GConsejo de diseño: Las ESM aumentan los puntos de vida y reducen la visibilidad de superficie, mejorando la supervivencia contra la detección y el ataque. Son útiles en combatientes valiosos, pero elevan el coste de producción y requieren microchips.§!"
 module_esm_3: "ESM III"
 module_esm_3_desc: "Las medidas de apoyo electrónico avanzadas integran procesamiento de datos a alta velocidad y fusión de sensores en red, lo que permite una identificación precisa de amenazas, una alerta temprana optimizada y una mejor coordinación con los sistemas de combate y guerra electrónica.\n\n§GConsejo de diseño: Las ESM aumentan los puntos de vida y reducen la visibilidad de superficie, mejorando la supervivencia contra la detección y el ataque. Son útiles en combatientes valiosos, pero elevan el coste de producción y requieren microchips.§!"
 module_sub_esm_1: "ESM I"
 module_sub_esm_1_desc: "Los primeros sistemas de medidas de apoyo electrónico (ESM) permiten a los buques detectar, identificar y clasificar las emisiones de radar enemigas. Estos sistemas mejoran la conciencia situacional y proporcionan una alerta temprana limitada contra amenazas hostiles.\n\n§GConsejo de diseño: Las ESM para submarinos aumentan los puntos de vida y reducen la visibilidad de submarinos, mejorando la supervivencia y el sigilo. Son útiles para sumergibles que operan cerca de sensores enemigos, pero elevan el coste de producción y requieren microchips.§!"
 module_sub_esm_2: "ESM II"
 module_sub_esm_2_desc: "Las suites ESM mejoradas cuentan con una cobertura de frecuencia ampliada y un procesamiento de señales más rápido, mejorando la capacidad de rastrear los sensores enemigos y apoyar las contramedidas defensivas en entornos electromagnéticos complejos.\n\n§GConsejo de diseño: Las ESM para submarinos aumentan los puntos de vida y reducen la visibilidad de submarinos, mejorando la supervivencia y el sigilo. Son útiles para sumergibles que operan cerca de sensores enemigos, pero elevan el coste de producción y requieren microchips.§!"
 module_sub_esm_3: "ESM III"
 module_sub_esm_3_desc: "Advanced Electronic Support Measures integrate high-speed data processing and networked sensor fusion, allowing precise threat identification, improved early warning, and enhanced coordination with electronic warfare and combat systems.\n\n§GDesigner Hint: Submarine ESM increases Health Power and reduces Sub Visibility, improving survivability and stealth. It is useful for boats operating near enemy sensors, but raises production cost and requires Microchips.§!"
 module_analog_fire_control: "Sistema de Control de Fuego Analógico"
 module_analog_fire_control_desc: "Los sistemas analógicos de control de tiro se describen mejor como sistemas operados manualmente.\n\n§GConsejo de diseño: El control de tiro mejora el ataque de cañón, los misiles antibuque, la perforación de misiles antibuque, el ataque antiaéreo y el blindaje, haciendo que un buque armado sea más efectivo en múltiples roles. Los sistemas avanzados proporcionan mayores bonificaciones pero cuestan más capacidad industrial (IC) y microchips.§!"
 module_digital_integrated_fire_control: "Sistema de Control de Fuego Digital Integrado"
 module_digital_integrated_fire_control_desc: "Interfaces digitales integradas en los sistemas para permitir un liderazgo y mantenimiento más efectivos desde el puente del barco.\n\n§GConsejo de diseño: El control de tiro mejora el ataque de cañón, los misiles antibuque, la perforación de misiles antibuque, el ataque antiaéreo y el blindaje, haciendo que un buque armado sea más efectivo en múltiples roles. Los sistemas avanzados proporcionan mayores bonificaciones pero cuestan más capacidad industrial (IC) y microchips.§!"
 module_advanced_integrated_missile_radar_control: "Control Avanzado Integrado de Misiles y Radares"
 module_advanced_integrated_missile_radar_control_desc: "El control avanzado integrado de radar y misiles se describe mejor por la integración de misiles y radares para permitir reacciones más rápidas y precisas ante las amenazas entrantes.\n\n§GConsejo de diseño: El control de tiro mejora el ataque de cañón, los misiles antibuque, la perforación de misiles antibuque, el ataque antiaéreo y el blindaje, haciendo que un buque armado sea más efectivo en múltiples roles. Los sistemas avanzados proporcionan mayores bonificaciones pero cuestan más capacidad industrial (IC) y microchips.§!"
 module_chain_gun: "Ametralladoras de Cadena I"
 module_chain_gun_desc: "Ametralladoras ligeras de cadena abarcan desde ametralladoras de apoyo de calibre .30 hasta cañones antiaéreos de calibre .50. Estos últimos son el armamento más popular para un buque de guerra.\n\n§GConsejo de diseño: Este sistema de defensa de punto mejora el ataque antiaéreo y el blindaje al tiempo que añade un poco de puntos de vida. Es útil contra amenazas aéreas y de misiles, pero añade coste de producción, uso de combustible, mano de obra y visibilidad de superficie.§!"
 module_ciws_1: "CIWS I"
 module_ciws_1_desc: "Los primeros sistemas de armas de defensa próxima (CIWS) proporcionan una última línea de defensa contra misiles y aeronaves entrantes. Utilizando cañones automáticos guiados por radar, estos sistemas ofrecen una capacidad de defensa de punto limitada pero crucial para los buques de guerra modernos.\n\n§GConsejo de diseño: Este sistema de defensa de punto mejora el ataque antiaéreo y el blindaje al tiempo que añade un poco de puntos de vida. Es útil contra amenazas aéreas y de misiles, pero añade coste de producción, uso de combustible, mano de obra y visibilidad de superficie.§!"
 module_ciws_2: "CIWS II"
 module_ciws_2_desc: "Las mejoras en los sistemas de rastreo por radar y de control de tiro optimizan la efectividad de los sistemas de armas de defensa próxima. Tiempos de reacción más rápidos y una precisión mejorada aumentan la supervivencia contra los primeros misiles antibuque.\n\n§GConsejo de diseño: Este sistema de defensa de punto mejora el ataque antiaéreo y el blindaje al tiempo que añade un poco de puntos de vida. Es útil contra amenazas aéreas y de misiles, pero añade coste de producción, uso de combustible, mano de obra y visibilidad de superficie.§!"
 module_ciws_3: "CIWS III"
 module_ciws_3_desc: "Los CIWS de tercera generación integran sensores avanzados y puntería computarizada, lo que permite mejores alcances de combate y mayores tasas de éxito de interceptación contra amenazas supersónicas.\n\n§GConsejo de diseño: Este sistema de defensa de punto mejora el ataque antiaéreo y el blindaje al tiempo que añade un poco de puntos de vida. Es útil contra amenazas aéreas y de misiles, pero añade coste de producción, uso de combustible, mano de obra y visibilidad de superficie.§!"
 module_ciws_4: "CIWS IV"
 module_ciws_4_desc: "Los sistemas de armas de defensa próxima modernos combinan radar perfeccionado, puntería electro-óptica y armas con una mayor cadencia de tiro. Estos sistemas mejoran significativamente el rendimiento de la defensa de punto contra ataques de saturación por misiles.\n\n§GConsejo de diseño: Este sistema de defensa de punto mejora el ataque antiaéreo y el blindaje al tiempo que añade un poco de puntos de vida. Es útil contra amenazas aéreas y de misiles, pero añade coste de producción, uso de combustible, mano de obra y visibilidad de superficie.§!"
 module_ciws_5: "CIWS V"
 module_ciws_5_desc: "Las plataformas CIWS altamente automatizadas utilizan sensores en red y algoritmos de rastreo mejorados para contrarrestar misiles de de crucero avanzados y municiones guiadas de precisión con mayor fiabilidad.\n\n§GConsejo de diseño: Este sistema de defensa de punto mejora el ataque antiaéreo y el blindaje al tiempo que añade un poco de puntos de vida. Es útil contra amenazas aéreas y de misiles, pero añade coste de producción, uso de combustible, mano de obra y visibilidad de superficie.§!"
 module_ciws_6: "CIWS VI"
 module_ciws_6_desc: "Los sistemas de armas de defensa próxima de vanguardia representan la alta sofisticación de la tecnología de defensa de punto, incorporando sensores de última generación, puntería asistida por inteligencia artificial e interceptores de respuesta rápida para derrotar incluso las amenazas de misiles más avanzadas.\n\n§GConsejo de diseño: Este sistema de defensa de punto mejora el ataque antiaéreo y el blindaje al tiempo que añade un poco de puntos de vida. Es útil contra amenazas aéreas y de misiles, pero añade coste de producción, uso de combustible, mano de obra y visibilidad de superficie.§!"
 module_railgun_1: "Cañones Electromagnéticos I"
 module_railgun_1_desc: "Los primeros cañones de riel electromagnéticos utilizan potentes corrientes eléctricas para lanzar proyectiles a velocidades extremas. Aunque siguen siendo experimentales, estas armas ofrecen un alcance y una penetración excepcionales en comparación con la artillería naval convencional.\n\n§GConsejo de diseño: Los cañones de riel proporcionan un alto ataque de cañón y perforación de cañón para el bombardeo costero y enfrentamientos con buques blindados. Son útiles cuando la penetración importa, pero cuestan más capacidad industrial (IC) y recursos estratégicos que los cañones convencionales.§!"
 module_railgun_2: "Cañones Electromagnéticos II"
 module_railgun_2_desc: "Los diseños perfeccionados de cañones de riel mejoran la eficiencia energética y la durabilidad del tubo, lo que permite mayores cadencias de tiro y un funcionamiento más fiable. Estos sistemas comienzan a rivalizar con los cañones navales tradicionales en efectividad de combate sostenido.\n\n§GConsejo de diseño: Los cañones de riel proporcionan un alto ataque de cañón y perforación de cañón para el bombardeo costero y enfrentamientos con buques blindados. Son útiles cuando la penetración importa, pero cuestan más capacidad industrial (IC) y recursos estratégicos que los cañones convencionales.§!"
 module_railgun_3: "Cañones Electromagnéticos III"
 module_railgun_3_desc: "Las plataformas avanzadas de cañones de riel integran un almacenamiento de energía y sistemas de control de tiro mejorados, permitiendo ataques precisos de largo alcance contra objetivos de superficie y un combate limitado contra amenazas aéreas.\n\n§GConsejo de diseño: Los cañones de riel proporcionan un alto ataque de cañón y perforación de cañón para el bombardeo costero y enfrentamientos con buques blindados. Son útiles cuando la penetración importa, pero cuestan más capacidad industrial (IC) y recursos estratégicos que los cañones convencionales.§!"
 module_railgun_4: "Cañones Electromagnéticos IV"
 module_railgun_4_desc: "La tecnología de cañones de riel electromagnéticos de vanguardia representa un gran avance en la potencia de fuego naval, entregando proyectiles hipersónicos de alta precisión con una carga logística mínima y un potencial destructivo inigualable.\n\n§GConsejo de diseño: Los cañones de riel proporcionan un alto ataque de cañón and perforación de cañón para el bombardeo costero y enfrentamientos con buques blindados. Son útiles cuando la penetración importa, pero cuestan más capacidad industrial (IC) y recursos estratégicos que los cañones convencionales.§!"
 module_ram_1: "RAM I"
 module_ram_1_desc: "Early Rolling Airframe Missile systems provide a lightweight missile-based point-defense solution against incoming aircraft and anti-ship missiles. While limited in range and guidance sophistication, they greatly enhance a vessel's defensive capabilities.\n\n§GDesigner Hint: RAM systems provide strong Anti-Air and Armor for point defense while adding some Health Power. They are useful against air and missile threats, but cost more IC, fuel, and manpower than gun-based defenses.§!"
 module_ram_2: "RAM II"
 module_ram_2_desc: "Los perfeccionamientos en la tecnología de buscadores y en la capacidad de respuesta de los misiles optimizan la efectividad de los sistemas RAM. Una mayor fiabilidad de rastreo e interceptación permite una mejor protección contra los misiles de crucero de primera generación.\n\n§GConsejo de diseño: Los sistemas RAM proporcionan un fuerte ataque antiaéreo y blindaje para la defensa de punto al tiempo que añaden algo de puntos de vida. Son útiles contra amenazas aéreas y de misiles, pero cuestan más capacidad industrial (IC), combustible y mano de obra que las defensas basadas en cañones.§!"
 module_ram_3: "RAM III"
 module_ram_3_desc: "Los sistemas RAM de tercera generación incorporan una guía de modo dual mejorada y tiempos de reacción más rápidos, aumentando la probabilidad de impacto contra amenazas con capacidad de maniobra y supersónicas.\n\n§GConsejo de diseño: Los sistemas RAM proporcionan un fuerte ataque antiaéreo y blindaje para la defensa de punto al tiempo que añaden algo de puntos de vida. Son útiles contra amenazas aéreas y de misiles, pero cuestan más capacidad industrial (IC), combustible y mano de obra que las defensas basadas en cañones.§!"
 module_ram_4: "RAM IV"
 module_ram_4_desc: "Los lanzadores RAM modernos cuentan con buscadores avanzados y una mejor integración del control de tiro, lo que permite una defensa más eficaz contra ataques de saturación y amenazas de misiles de baja observabilidad.\n\n§GConsejo de diseño: Los sistemas RAM proporcionan un fuerte ataque antiaéreo y blindaje para la defensa de punto al tiempo que añaden algo de puntos de vida. Son útiles contra amenazas aéreas y de misiles, pero cuestan más capacidad industrial (IC), combustible y mano de obra que las defensas basadas en cañones.§!"
 module_ram_5: "RAM V"
 module_ram_5_desc: "Los sistemas RAM altamente avanzados se benefician de datos de sensores en red y algoritmos de guía perfeccionados, proporcionando una interceptación fiable de las municiones guiadas de precisión modernas en entornos de combate complejos.\n\n§GConsejo de diseño: Los sistemas RAM proporcionan un fuerte ataque antiaéreo y blindaje para la defensa de punto al tiempo que añaden algo de puntos de vida. Son útiles contra amenazas aéreas y de misiles, pero cuestan más capacidad industrial (IC), combustible y mano de obra que las defensas basadas en cañones.§!"
 module_ram_6: "RAM VI"
 module_ram_6_desc: "Las plataformas RAM de vanguardia representan la cúspide de la defensa de punto basada en misiles, integrando sistemas de guía de última generación, una resistencia mejorada a las contramedidas y capacidades de combate rápido para derrotar las amenazas aéreas más avanzadas.\n\n§GConsejo de diseño: Los sistemas RAM proporcionan un fuerte ataque antiaéreo y blindaje para la defensa de punto al tiempo que añaden algo de puntos de vida. Son útiles contra amenazas aéreas y de misiles, pero cuestan más capacidad industrial (IC), combustible y mano de obra que las defensas basadas en cañones.§!"
 module_torpedoes_1: "Torpedos ASW I"
 module_torpedoes_1_desc: "Early ASW torpedoes provide basic undersea strike capability against submarines. While limited in range and guidance, these weapons improve a ship's ability to defend against submerged threats.\n\n§GDesigner Hint: ASW Torpedoes provide strong Anti-Submarine Warfare for destroying submarines after they are detected. They are useful on dedicated escorts and hunters, but add production, fuel, and manpower costs without helping against surface ships.§!"
 module_torpedoes_2: "Torpedos ASW II"
 module_torpedoes_2_desc: "Los torpedos ASW mejorados cuentan con sistemas de propulsión y guiado acústico por sonar optimizados, aumentando la efectividad de detección y combate contra los submarinos modernos.\n\n§GConsejo de diseño: Los torpedos ASW proporcionan una fuerte guerra antisubmarina para destruir submarinos una vez detectados. Son útiles en escoltas y cazadores dedicados, pero añaden costes de producción, combustible y mano de obra sin ayudar contra buques de superficie.§!"
 module_torpedoes_3: "Torpedos ASW III"
 module_torpedoes_3_desc: "Los torpedos ASW modernos incorporan algoritmos de guía avanzados y mayores velocidades, lo que permite una interceptación más fiable de los objetivos submarinos que realizan maniobras evasivas.\n\n§GConsejo de diseño: Los torpedos ASW proporcionan una fuerte guerra antisubmarina para destruir submarinos una vez detectados. Son útiles en escoltas y cazadores dedicados, pero añaden costes de producción, combustible y mano de obra sin ayudar contra buques de superficie.§!"
 module_torpedoes_4: "Torpedos ASW IV"
 module_torpedoes_4_desc: "Los torpedos ASW altamente avanzados utilizan sensores sofisticados, una resistencia mejorada a las contramedidas y mayores alcances, permitiendo un combate eficaz contra submarinos en entornos operativos complejos.\n\n§GConsejo de diseño: Los torpedos ASW proporcionan una fuerte guerra antisubmarina para destruir submarinos una vez detectados. Son útiles en escoltas y cazadores dedicados, pero añaden costes de producción, combustible y mano de obra sin ayudar contra buques de superficie.§!"
 module_torpedoes_5: "Torpedos ASW V"
 module_torpedoes_5_desc: "Los torpedos ASW de próxima generación enfatizan los enfoques sigilosos, la asignación inteligente de objetivos y una autonomía extendida, proporcionando capacidades superiores de neutralización de amenazas bajo el mar.\n\n§GConsejo de diseño: Los torpedos ASW proporcionan una fuerte guerra antisubmarina para destruir submarinos una vez detectados. Son útiles en escoltas y cazadores dedicados, pero añaden costes de producción, combustible y mano de obra sin ayudar contra buques de superficie.§!"
 module_torpedoes_6: "Torpedos ASW VI"
 module_torpedoes_6_desc: "Los torpedos ASW de vanguardia representan la cúspide de la tecnología de guerra antisubmarina, integrando guía asistida por IA, velocidad extrema y sistemas avanzados de anticontramedidas para dominar los campos de batalla submarinos modernos.\n\n§GConsejo de diseño: Los torpedos ASW proporcionan una fuerte guerra antisubmarina para destruir submarinos una vez detectados. Son útiles en escoltas y cazadores dedicados, pero añaden costes de producción, combustible y mano de obra sin ayudar contra buques de superficie.§!"
 module_anti_ship_torpedoes_1: "Torpedos de Doble Propósito I"
 module_anti_ship_torpedoes_1_desc: "Los primeros torpedos de doble propósito proporcionan una capacidad básica de ataque tanto en la superficie como bajo el mar. Aunque tienen un alcance y una guía limitados, permiten a los buques enfrentarse tanto a submarinos como a objetivos de superficie.\n\n§GConsejo de diseño: Los torpedos de doble propósito proporcionan ataque de torpedos contra buques de superficie y guerra antisubmarina contra submarinos. Ofrecen un armamento flexible a un coste moderado de capacidad industrial (IC), pero son menos especializados que las armas ASW dedicadas.§!"
 module_anti_ship_torpedoes_2: "Torpedos de Doble Propósito II"
 module_anti_ship_torpedoes_2_desc: "Los torpedos de doble propósito mejorados cuentan con sistemas de autoguiado y propulsión perfeccionados, aumentando la precisión tanto contra amenazas submarinas como de superficie.\n\n§GConsejo de diseño: Los torpedos de doble propósito proporcionan ataque de torpedos contra buques de superficie y guerra antisubmarina contra submarinos. Ofrecen un armamento flexible a un coste moderado de capacidad industrial (IC), pero son menos especializados que las armas ASW dedicadas.§!"
 module_anti_ship_torpedoes_3: "Torpedos de Doble Propósito III"
 module_anti_ship_torpedoes_3_desc: "Los torpedos de doble propósito modernos integran una guía avanzada y una mayor velocidad, mejorando la fiabilidad de los combates contra submarinos evasivos y buques de superficie ágiles.\n\n§GConsejo de diseño: Los torpedos de doble propósito proporcionan ataque de torpedos contra buques de superficie y guerra antisubmarina contra submarinos. Ofrecen un armamento flexible a un coste moderado de capacidad industrial (IC), pero son menos especializados que las armas ASW dedicadas.§!"
 module_anti_ship_torpedoes_4: "Torpedos de Doble Propósito IV"
 module_anti_ship_torpedoes_4_desc: "Los torpedos de doble propósito altamente avanzados utilizan sensores sofisticados, un alcance extendido y resistencia a las contramedidas, permitiendo ataques efectivos en entornos marítimos complejos.\n\n§GConsejo de diseño: Los torpedos de doble propósito proporcionan ataque de torpedos contra buques de superficie y guerra antisubmarina contra submarinos. Ofrecen un armamento flexible a un coste moderado de capacidad industrial (IC), pero son menos especializados que las armas ASW dedicadas.§!"
 module_anti_ship_torpedoes_5: "Torpedos de Doble Propósito V"
 module_anti_ship_torpedoes_5_desc: "Los torpedos de doble propósito de próxima generación enfatizan los enfoques sigilosos, la asignación inteligente de objetivos y una mayor autonomía, proporcionando capacidades ofensivas y defensivas superiores tanto contra submarinos como contra buques de superficie.\n\n§GConsejo de diseño: Los torpedos de doble propósito proporcionan ataque de torpedos contra buques de superficie y guerra antisubmarina contra submarinos. Ofrecen un armamento flexible a un coste moderado de capacidad industrial (IC), pero son menos especializados que las armas ASW dedicadas.§!"
 module_anti_ship_torpedoes_6: "Torpedos de Doble Propósito VI"
 module_anti_ship_torpedoes_6_desc: "Los torpedos de doble propósito del futuro cercano representan la cumbre de la tecnología de torpedos, combinando guía asistida por IA, velocidad extrema y sistemas avanzados de anticontramedidas para dominar tanto los campos de batalla de superficie como los submarinos.\n\n§GConsejo de diseño: Los torpedos de doble propósito proporcionan ataque de torpedos contra buques de superficie y guerra antisubmarina contra submarinos. Ofrecen un armamento flexible a un coste moderado de capacidad industrial (IC), pero son menos especializados que las armas ASW dedicadas.§!"
 module_aa_guns_1: "Cañones Anti-Aéreos I"
 module_aa_guns_1_desc: "Los primeros sistemas de cañones antiaéreos proporcionan una defensa básica contra las aeronaves enemigas. Efectivos a corta distancia, ayudan a proteger los buques de los ataques aéreos, pero tienen una cadencia de tiro y una precisión de puntería limitadas.\n\n§GConsejo de diseño: Los cañones antiaéreos mejoran el ataque antiaéreo y el blindaje, haciéndolos útiles para los buques que necesitan una protección dedicada contra las aeronaves enemigas.§!"
 module_aa_guns_2: "Cañones Anti-Aéreos II"
 module_aa_guns_2_desc: "Los cañones antiaéreos mejorados cuentan con mayores cadencias de tiro y sistemas de puntería optimizados, lo que permite a los buques enfrentarse mejor a aeronaves más rápidas y maniobrables.\n\n§GConsejo de diseño: Los cañones antiaéreos mejoran el ataque antiaéreo y el blindaje, haciéndolos útiles para los buques que necesitan una protección dedicada contra las aeronaves enemigas.§!"
 module_aa_guns_3: "Cañones Anti-Aéreos III"
 module_aa_guns_3_desc: "Los cañones antiaéreos modernos incorporan estabilización y control de tiro avanzados, lo que permite un rastreo y combate fiables contra amenazas aéreas de alta velocidad y de bajo vuelo.\n\n§GConsejo de diseño: Los cañones antiaéreos mejoran el ataque antiaéreo y el blindaje, haciéndolos útiles para los buques que necesitan una protección dedicada contra las aeronaves enemigas.§!"
 module_aa_guns_4: "Cañones Anti-Aéreos IV"
 module_aa_guns_4_desc: "Los sistemas de cañones antiaéreos altamente avanzados utilizan puntería automatizada y munición perfeccionada, proporcionando una defensa eficaz contra ataques aéreos masivos y municiones guiadas de precisión.\n\n§GConsejo de diseño: Los cañones antiaéreos mejoran el ataque antiaéreo y el blindaje, haciéndolos útiles para los buques que necesitan una protección dedicada contra las aeronaves enemigas.§!"
 module_aa_guns_5: "Cañones Anti-Aéreos V"
 module_aa_guns_5_desc: "Los cañones antiaéreos de próxima generación combinan capacidad de tiro rápido, redes de sensores integradas y una precisión superior para proporcionar una defensa aérea integral contra amenazas aéreas modernas y emergentes.\n\n§GConsejo de diseño: Los cañones antiaéreos mejoran el ataque antiaéreo y el blindaje, haciéndolos útiles para los buques que necesitan una protección dedicada contra las aeronaves enemigas.§!"
 module_radar_1: "Radar I"
 module_radar_1_desc: "Los primeros sistemas de radar naval proporcionan una detección básica de amenazas aéreas y de superficie. Limitados en alcance y resolución, ofrecen una conciencia situacional fundamental para las operaciones de la flota.\n\n§GConsejo de diseño: El radar mejora la detección de superficie y la detección de submarinos, al tiempo que refuerza los misiles antibuque, el ataque de torpedos y el ataque antiaéreo. Es ideal para buques de combate de propósito general, pero cuesta más capacidad industrial (IC) y microchips que el sonar.§!"
 module_radar_2: "Radar II"
 module_radar_2_desc: "Los sistemas de radar mejorados cuentan con mayores alcances de detección y una mejor resolución de objetivos, lo que permite a los buques identificar las amenazas antes y coordinar las acciones defensivas con mayor eficacia.\n\n§GConsejo de diseño: El radar mejora la detección de superficie y la detección de submarinos, al tiempo que refuerza los misiles antibuque, el ataque de torpedos y el ataque antiaéreo. Es ideal para buques de combate de propósito general, pero cuesta más capacidad industrial (IC) y microchips que el sonar.§!"
 module_radar_3: "Radar III"
 module_radar_3_desc: "Las plataformas de radar modernas integran procesamiento de señales avanzado y rastreo automatizado, optimizando la detección de aeronaves de movimiento rápido y objetivos de superficie en entornos saturados.\n\n§GConsejo de diseño: El radar mejora la detección de superficie y la detección de submarinos, al tiempo que refuerza los misiles antibuque, el ataque de torpedos y el ataque antiaéreo. Es ideal para buques de combate de propósito general, pero cuesta más capacidad industrial (IC) y microchips que el sonar.§!"
 module_radar_4: "Radar IV"
 module_radar_4_desc: "Los sistemas de radar altamente avanzados ofrecen rastreo de múltiples objetivos, alcance mejorado y resistencia a las contramedidas electrónicas, proporcionando una conciencia situacional fiable en zonas disputadas.\n\n§GConsejo de diseño: El radar mejora la detección de superficie y la detección de submarinos, al tiempo que refuerza los misiles antibuque, el ataque de torpedos y el ataque antiaéreo. Es ideal para buques de combate de propósito general, pero cuesta más capacidad industrial (IC) y microchips que el sonar.§!"
 module_radar_5: "Radar V"
 module_radar_5_desc: "Los sistemas de radar de próxima generación combinan detección de largo alcance, puntería de precisión y una integración perfecta con los sistemas de combate a bordo, mejorando enormemente la respuesta a las amenazas en toda la flota.\n\n§GConsejo de diseño: El radar mejora la detección de superficie y la detección de submarinos, al tiempo que refuerza los misiles antibuque, el ataque de torpedos y el ataque antiaéreo. Es ideal para buques de combate de propósito general, pero cuesta más capacidad industrial (IC) y microchips que el sonar.§!"
 module_radar_6: "Radar VI"
 module_radar_6_desc: "Las plataformas de radar del futuro cercano cuentan con análisis de señales asistido por IA, detección multiespectral y rastreo avanzado de objetivos de baja observabilidad (sigilo), lo que permite una conciencia situacional marítima superior.\n\n§GConsejo de diseño: El radar mejora la detección de superficie y la detección de submarinos, al tiempo que refuerza los misiles antibuque, el ataque de torpedos y el ataque antiaéreo. Es ideal para buques de combate de propósito general, pero cuesta más capacidad industrial (IC) y microchips que el sonar.§!"
 module_radar_7: "Radar VII"
 module_radar_7_desc: "La tecnología de radar de vanguardia integra fusión de sensores en red, detección de alcance extremo y priorización automatizada de amenazas, representando la cúspide de las capacidades navales de detección y adquisición de objetivos.\n\n§GConsejo de diseño: El radar mejora la detección de superficie y la detección de submarinos, al tiempo que refuerza los misiles antibuque, el ataque de torpedos y el ataque antiaéreo. Es ideal para buques de combate de propósito general, pero cuesta más capacidad industrial (IC) y microchips que el sonar.§!"
 module_sonar_1: "Sonar I"
 module_sonar_1_desc: "Los primeros sistemas de sonar para buques proporcionan una detección básica de submarinos en las inmediaciones. Limitados en alcance y resolución, otorgan a los buques una conciencia básica bajo el mar.\n\n§GConsejo de diseño: El sonar enfatiza la detección de submarinos al tiempo que mejora la detección de superficie, los misiles antibuque y el ataque de torpedos. Es una opción rentable para buques ASW, pero proporciona un apoyo de combate menos amplio que el radar.§!"
 module_sonar_2: "Sonar II"
 module_sonar_2_desc: "Los sistemas de sonar mejorados cuentan con un alcance de detección y una resolución optimizados, lo que permite a los buques rastrear submarinos de manera más efectiva y responder a las amenazas submarinas con mayor precisión.\n\n§GConsejo de diseño: El sonar enfatiza la detección de submarinos al tiempo que mejora la detección de superficie, los misiles antibuque y el ataque de torpedos. Es una opción rentable para buques ASW, pero proporciona un apoyo de combate menos amplio que el radar.§!"
 module_sonar_3: "Sonar III"
 module_sonar_3_desc: "Las plataformas de sonar modernas incorporan procesamiento de señales y estabilización avanzados, mejorando la capacidad de detectar submarinos rápidos o evasivos en entornos marítimos complejos.\n\n§GConsejo de diseño: El sonar enfatiza la detección de submarinos al tiempo que mejora la detección de superficie, los misiles antibuque y el ataque de torpedos. Es una opción rentable para buques ASW, pero proporciona un apoyo de combate menos amplio que el radar.§!"
 module_sonar_4: "Sonar IV"
 module_sonar_4_desc: "Los sistemas de sonar altamente avanzados proporcionan detección de submarinos a largo alcance, mejor clasificación de objetivos y resistencia al ruido y a las contramedidas, optimizando las operaciones antisubmarinas de la flota.\n\n§GConsejo de diseño: El sonar enfatiza la detección de submarinos al tiempo que mejora la detección de superficie, los misiles antibuque y el ataque de torpedos. Es una opción rentable para buques ASW, pero proporciona un apoyo de combate menos amplio que el radar.§!"
 module_sonar_5: "Sonar V"
 module_sonar_5_desc: "Los sistemas de sonar de próxima generación integran múltiples bandas de frecuencia y algoritmos de rastreo automatizados, lo que permite una detección fiable de los submarinos furtivos modernos a alcances extendidos.\n\n§GConsejo de diseño: El sonar enfatiza la detección de submarinos al tiempo que mejora la detección de superficie, los misiles antibuque y el ataque de torpedos. Es una opción rentable para buques ASW, pero proporciona un apoyo de combate menos amplio que el radar.§!"
 module_sonar_6: "Sonar VI"
 module_sonar_6_desc: "Las plataformas de sonar del futuro cercano emplean análisis de señales asistido por IA y fusión de múltiples sensores, lo que permite una localización precisa de submarinos y una mejor conciencia situacional en condiciones desafiantes.\n\n§GConsejo de diseño: El sonar enfatiza la detección de submarinos al tiempo que mejora la detección de superficie, los misiles antibuque y el ataque de torpedos. Es una opción rentable para buques ASW, pero proporciona un apoyo de combate menos amplio que el radar.§!"
 module_sonar_7: "Sonar VII"
 module_sonar_7_desc: "La tecnología de sonar de vanguardia combina detección de alcance extremo, priorización de amenazas en tiempo real y una reducción avanzada de ruido, representando la cúspide de la detección submarina y la capacidad de guerra antisubmarina.\n\n§GConsejo de diseño: El sonar enfatiza la detección de submarinos al tiempo que mejora la detección de superficie, los misiles antibuque y el ataque de torpedos. Es una opción rentable para buques ASW, pero proporciona un apoyo de combate menos amplio que el radar.§!"
 module_minelaying: "Barco de Minado"
 module_minelaying_desc: "Permite el despliegue de minas marinas, dejando que los buques minen una zona marítima con explosivos submarinos.\n\n§GConsejo de diseño: El equipo de minado habilita la misión de minado y añade capacidad de minado. Es útil para controlar zonas marítimas estratégicas, pero añade coste de producción, uso de combustible, mano de obra y visibilidad de superficie.§!"
 module_mineclearing: "Barco Desactivador de Minas"
 module_mineclearing_desc: "Permite que este buque limpie las minas de una región marítima.\n\n§GConsejo de diseño: El equipo de dragado de minas habilita la misión de dragado de minas y añade capacidad de dragado de minas. Es útil para mantener abiertas las rutas marítimas importantes, pero añade coste de producción, uso de combustible y visibilidad de superficie.§!"
 module_anti_submarine_mortar: "Mortero Anti-Submarino"
 module_anti_submarine_mortar_desc: "Los morteros antisubmarinos montados en buques proporcionan una capacidad de ataque submarino a corta distancia. Efectivos para defenderse de submarinos cercanos, complementan los sistemas de sonar y torpedos.\n\n§GConsejo de diseño: Un mortero antisubmarino añade capacidad de guerra antisubmarina a un coste de producción y mano de obra muy bajo. Es útil como armamento ASW económico de corto alcance, pero no proporciona capacidad de detección por sí mismo.§!"
 module_surface_oil_power: "Motor de Combustible de Petróleo"
 module_surface_oil_power_desc: "Los primeros motores alimentados por petróleo proporcionan una propulsión fiable para buques de superficie, con velocidad y autonomía moderadas.\n\n§GConsejo de diseño: La propulsión por petróleo es un motor económico para buques que solo necesitan una velocidad y alcance máximo modestos. Es ideal para flotas costeras asequibles, pero incrementa el uso de combustible y la visibilidad de superficie.§!"
 module_surface_jet_turbine_power: "Motor de Turbina a Reacción"
 module_surface_jet_turbine_power_desc: "Los primeros motores de turbina de chorro (jet) proporcionan mejoras significativas de velocidad para los buques de superficie, sacrificando algo de eficiencia de combustible en favor del rendimiento.\n\n§GConsejo de diseño: Las turbinas de chorro proporcionan mayor velocidad y alcance máximo con menos visibilidad de superficie que los motores convencionales. Son ideales para flotas de combate regionales, pero incrementan el coste de producción y el uso de combustible.§!"
 module_surface_jet_turbine_power2: "Motor Avanzado de Turbina a Reacción"
 module_surface_jet_turbine_power2_desc: "Las turbinas de chorro perfeccionadas mejoran la potencia de salida y la eficiencia, permitiendo operaciones sostenidas a alta velocidad con una fiabilidad optimizada.\n\n§GConsejo de diseño: Las turbinas de chorro proporcionan mayor velocidad y alcance máximo con menos visibilidad de superficie que los motores convencionales. Son ideales para flotas de combate regionales, pero incrementan el coste de producción y el uso de combustible.§!"
 module_surface_jet_turbine_power3: "Motor Futurista de Turbina a Reacción"
 module_surface_jet_turbine_power3_desc: "Las turbinas de próxima generación ofrecen una velocidad, eficiencia y autonomía máximas para los combatientes de superficie modernos.\n\n§GConsejo de diseño: Las turbinas de chorro proporcionan mayor velocidad y alcance máximo con menos visibilidad de superficie que los motores convencionales. Son ideales para flotas de combate regionales, pero incrementan el coste de producción y el uso de combustible.§!"
 module_light_surface_jet_turbine_power: "Motor Ligero de Turbina a Reacción"
 module_light_surface_jet_turbine_power_desc: "Las turbinas de chorro ligeras aumentan la velocidad de los buques pequeños manteniendo un consumo de combustible manejable.\n\n§GConsejo de diseño: Las turbinas de chorro ligeras proporcionan mayor velocidad y alcance máximo con menos visibilidad de superficie que los motores diésel. Son ideales para combatientes regionales rápidos, pero incrementan el coste de producción y el uso de combustible.§!"
 module_light_surface_jet_turbine_power2: "Motor Avanzado Ligero de Turbina a Reacción"
 module_light_surface_jet_turbine_power2_desc: "Las turbinas de pequeña escala mejoradas ofrecen mayores relaciones de potencia a peso y una fiabilidad optimizada para las lanchas de ataque rápido.\n\n§GConsejo de diseño: Las turbinas de chorro ligeras proporcionan mayor velocidad y alcance máximo con menos visibilidad de superficie que los motores diésel. Son ideales para combatientes regionales rápidos, pero incrementan el coste de producción y el uso de combustible.§!"
 module_light_surface_jet_turbine_power3: "Motor Futurista Ligero de Turbina a Reacción"
 module_light_surface_jet_turbine_power3_desc: "Las turbinas de vanguardia proporcionan una velocidad y autonomía excepcionales para los combatientes de superficie ligeros modernos.\n\n§GConsejo de diseño: Las turbinas de chorro ligeras proporcionan mayor velocidad y alcance máximo con menos visibilidad de superficie que los motores diésel. Son ideales para combatientes regionales rápidos, pero incrementan el coste de producción y el uso de combustible.§!"
 module_light_surface_early_reactor_power: "Reactor de luz primitivo"
 module_light_surface_early_reactor_power_desc: "Los primeros reactores nucleares ofrecen a los buques pequeños una propulsión fiable y de gran autonomía con requisitos mínimos de reabastecimiento.\n\n§GConsejo de diseño: La propulsión nuclear ligera proporciona una alta velocidad, un alcance máximo excepcional y un funcionamiento libre de combustible. Es ideal para buques ligeros utilizados en despliegues globales, pero su construcción es extremadamente costosa.§!"
 module_light_surface_mod_reactor_power: "Reactor de luz moderno"
 module_light_surface_mod_reactor_power_desc: "Los reactores ligeros modernos aumentan la potencia de salida y la eficiencia operativa, apoyando operaciones sostenidas a alta velocidad.\n\n§GConsejo de diseño: La propulsión nuclear ligera proporciona una alta velocidad, un alcance máximo excepcional y un funcionamiento libre de combustible. Es ideal para buques ligeros utilizados en despliegues globales, pero su construcción es extremadamente costosa.§!"
 module_surface_early_reactor_power: "Reactor Temprano"
 module_surface_early_reactor_power_desc: "Los primeros reactores navales proporcionan a los combatientes de superficie una propulsión de largo alcance independiente del combustible y un rendimiento constante.\n\n§GConsejo de diseño: La propulsión nuclear proporciona una velocidad mejorada, un alcance máximo excepcional y un funcionamiento libre de combustible. Es ideal para flotas desplegadas globalmente, pero su construcción es extremadamente costosa.§!"
 module_surface_adv_reactor_power: "Reactor Avanzado"
 module_surface_adv_reactor_power_desc: "Los reactores avanzados ofrecen una mayor densidad de potencia y una eficiencia mejorada, lo que permite despliegues extendidos y buques más rápidos.\n\n§GConsejo de diseño: La propulsión nuclear proporciona una velocidad mejorada, un alcance máximo excepcional y un funcionamiento libre de combustible. Es ideal para flotas desplegadas globalmente, pero su construcción es extremadamente costosa.§!"
 module_surface_mod_reactor_power: "Reactor Moderno"
 module_surface_mod_reactor_power_desc: "Los reactores modernos combinan un alto rendimiento, eficiencia de combustible y fiabilidad para operaciones navales sostenidas.\n\n§GConsejo de diseño: La propulsión nuclear proporciona una velocidad mejorada, un alcance máximo excepcional y un funcionamiento libre de combustible. Es ideal para flotas desplegadas globalmente, pero su construcción es extremadamente costosa.§!"
 module_surface_fut_reactor_power: "Reactor de vanguardia"
 module_surface_fut_reactor_power_desc: "Los reactores de próxima generación proporcionan un rendimiento máximo, una eficiencia excepcional y una autonomía casi ilimitada para los buques de superficie más modernos.\n\n§GConsejo de diseño: La propulsión nuclear proporciona una velocidad mejorada, un alcance máximo excepcional y un funcionamiento libre de combustible. Es ideal para flotas desplegadas globalmente, pero su construcción es extremadamente costosa.§!"
 module_sub_diesel_electric_power: "Motor Diesel Eléctrico 1"
 module_sub_diesel_electric_power_desc: "Los primeros sistemas diésel-eléctricos proporcionan una propulsión básica en inmersión y en superficie para submarinos con una autonomía limitada.\n\n§GConsejo de diseño: La propulsión diésel-eléctrica ofrece un submarino asequible y dependiente de combustible con velocidad, alcance máximo y sigilo mejorados en los niveles posteriores. Es ideal para operaciones locales y regionales, pero no puede igualar la autonomía global de un reactor.§!"
 module_sub_diesel_electric_power2: "Motor Diesel Eléctrico 2"
 module_sub_diesel_electric_power2_desc: "Los sistemas diésel-eléctricos mejorados aumentan la eficiencia y la autonomía de las baterías, permitiendo operaciones sumergidas más prolongadas.\n\n§GConsejo de diseño: La propulsión diésel-eléctrica ofrece un submarino asequible y dependiente de combustible con velocidad, alcance máximo y sigilo mejorados en los niveles posteriores. Es ideal para operaciones locales y regionales, pero no puede igualar la autonomía global de un reactor.§!"
 module_sub_diesel_electric_power3: "Motor Diesel Eléctrico 3"
 module_sub_diesel_electric_power3_desc: "La propulsión diésel-eléctrica moderna proporciona mayores velocidades y una mejor autonomía en inmersión para una mayor flexibilidad táctica.\n\n§GConsejo de diseño: La propulsión diésel-eléctrica ofrece un submarino asequible y dependiente de combustible con velocidad, alcance máximo y sigilo mejorados en los niveles posteriores. Es ideal para operaciones locales y regionales, pero no puede igualar la autonomía global de un reactor.§!"
 module_sub_diesel_electric_power4: "Motor Diesel Eléctrico 4"
 module_sub_diesel_electric_power4_desc: "Los sistemas diésel-eléctricos avanzados mejoran el sigilo y la eficiencia energética, extendiendo el alcance operativo en inmersión.\n\n§GConsejo de diseño: La propulsión diésel-eléctrica ofrece un submarino asequible y dependiente de combustible con velocidad, alcance máximo y sigilo mejorados en los niveles posteriores. Es ideal para operaciones locales y regionales, pero no puede igualar la autonomía global de un reactor.§!"
 module_sub_diesel_electric_power5: "Motor Diesel Eléctrico 5"
 module_sub_diesel_electric_power5_desc: "La propulsión diésel-eléctrica de próxima generación ofrece un equilibrio óptimo de velocidad, autonomía y sigilo en inmersión para los submarinos modernos.\n\n§GConsejo de diseño: La propulsión diésel-eléctrica ofrece un submarino asequible y dependiente de combustible con velocidad, alcance máximo y sigilo mejorados en los niveles posteriores. Es ideal para operaciones locales y regionales, pero no puede igualar la autonomía global de un reactor.§!"
 module_sub_early_reactor_power: "Potencia Reactor Temprano"
 module_sub_early_reactor_power_desc: "Los primeros reactores nucleares permiten a los submarinos permanecer sumergidos por períodos prolongados, mejorando drásticamente la autonomía operativa.\n\n§GConsejo de diseño: La propulsión nuclear otorga a los submarinos una alta velocidad, un alcance máximo excepcional y un funcionamiento libre de combustible. Es ideal para despliegues globales, pero cuesta más capacidad industrial (IC) y es generalmente más fácil de detectar que la propulsión diésel-eléctrica.§!"
 module_sub_adv_reactor_power: "Potencia Reactor Avanzado"
 module_sub_adv_reactor_power_desc: "Los reactores nucleares avanzados proporcionan una mayor potencia de salida, lo que permite velocidades más rápidas y operaciones sumergidas más prolongadas.\n\n§GConsejo de diseño: La propulsión nuclear otorga a los submarinos una alta velocidad, un alcance máximo excepcional y un funcionamiento libre de combustible. Es ideal para despliegues globales, pero cuesta más capacidad industrial (IC) y es generalmente más fácil de detectar que la propulsión diésel-eléctrica.§!"
 module_sub_mod_reactor_power: "Potencia Reactor Moderno"
 module_sub_mod_reactor_power_desc: "Los reactores modernos integran una eficiencia y fiabilidad mejoradas, lo que permite operaciones sumergidas sostenidas a alta velocidad.\n\n§GConsejo de diseño: La propulsión nuclear otorga a los submarinos una alta velocidad, un alcance máximo excepcional y un funcionamiento libre de combustible. Es ideal para despliegues globales, pero cuesta más capacidad industrial (IC) y es generalmente más fácil de detectar que la propulsión diésel-eléctrica.§!"
 module_sub_fut_reactor_power: "Potencia de reactor de vanguardia"
 module_sub_fut_reactor_power_desc: "Los reactores nucleares de vanguardia ofrecen una autonomía, velocidad y capacidades de sigilo inigualables para los submarinos del futuro cercano.\n\n§GConsejo de diseño: La propulsión nuclear otorga a los submarinos una alta velocidad, un alcance máximo excepcional y un funcionamiento libre de combustible. Es ideal para despliegues globales, pero cuesta más capacidad industrial (IC) y es generalmente más fácil de detectar que la propulsión diésel-eléctrica.§!"
 module_light_helipad_1: "Helipuerto Ligero I"
 module_light_helipad_1_desc: "Las instalaciones básicas de helipistas ligeras permiten a los buques pequeños operar un helicóptero para tareas de reconocimiento y misiones ASW limitadas.\n\n§GConsejo de diseño: Las helipistas ligeras mejoran la detección de submarinos, la guerra antisubmarina, la detección de superficie y el dragado de minas a un coste menor que las helipistas completas. Son ideales para escoltas ASW pequeños, pero aun así añaden uso de combustible, mano de obra y visibilidad de superficie.§!"
 module_light_helipad_2: "Helipuerto Ligero II"
 module_light_helipad_2_desc: "Las helipistas ligeras optimizadas proporcionan un mejor soporte para las operaciones de ala rotatoria, mejorando las capacidades ASW, de vigilancia y de transporte.\n\n§GConsejo de diseño: Las helipistas ligeras mejoran la detección de submarinos, la guerra antisubmarina, la detección de superficie y el dragado de minas a un coste menor que las helipistas completas. Son ideales para escoltas ASW pequeños, pero aun así añaden uso de combustible, mano de obra y visibilidad de superficie.§!"
 module_heavy_guns_1: "Cañones Pesados I"
 module_heavy_guns_1_desc: "Los primeros sistemas de cañones pesados ofrecen a los buques de superficie una potencia de fuego de largo alcance básica contra barcos y objetivos costeros.\n\n§GConsejo de diseño: Los cañones pesados proporcionan un alto ataque de cañón y puntos de vida al buque, pero no aportan perforación de cañón. Utilízalos para el bombardeo costero y para combatir buques sin blindaje, pero ten en cuenta que implican costes sustanciales de capacidad industrial (IC), mano de obra y combustible, además de un aumento en la visibilidad.§!"
 module_heavy_guns_2: "Cañones Pesados II"
 module_heavy_guns_2_desc: "Los cañones pesados mejorados proporcionan mayores cadencias de tiro, mejor precisión y una mayor velocidad de salida del proyectil para los enfrentamientos navales.\n\n§GConsejo de diseño: Los cañones pesados proporcionan un alto ataque de cañón y puntos de vida al buque, pero no aportan perforación de cañón. Utilízalos para el bombardeo costero y para combatir buques sin blindaje, pero ten en cuenta que implican costes sustanciales de capacidad industrial (IC), mano de obra y combustible, además de un aumento en la visibilidad.§!"
 module_heavy_guns_3: "Cañones Pesados III"
 module_heavy_guns_3_desc: "Los cañones pesados modernos integran sistemas avanzados de control de tiro, estabilizadores y munición mejorada para un rendimiento de combate superior a largo alcance.\n\n§GConsejo de diseño: Los cañones pesados proporcionan un alto ataque de cañón y puntos de vida al buque, pero no aportan perforación de cañón. Utilízalos para el bombardeo costero y para combatir buques sin blindaje, pero ten en cuenta que implican costes sustanciales de capacidad industrial (IC), mano de obra y combustible, además de un aumento en la visibilidad.§!"
 module_76mm_battery: "Batería de 76mm"
 module_127mm_battery: "Batería de 127mm"
 module_100mm_battery: "Batería de 100mm"
 module_152mm_battery: "Batería de 152mm"
 module_76mm_battery_desc: "Batería naval ligera que proporciona capacidad de tiro rápido para la defensa antiaérea y de superficie a corta distancia.\n\n§GConsejo de diseño: Las baterías de cañones proporcionan ataque de cañón, ataque antiaéreo y puntos de vida para una defensa aérea y de superficie versátil. Las baterías más grandes añaden más potencia de fuego, pero también requieren más capacidad industrial (IC), combustible, mano de obra y visibilidad de superficie.§!"
 module_127mm_battery_desc: "Batería naval mediana efectiva contra objetivos de superficie y aeronaves a distancias medias.\n\n§GConsejo de diseño: Las baterías de cañones proporcionan ataque de cañón, ataque antiaéreo y puntos de vida para una defensa aérea y de superficie versátil. Las baterías más grandes añaden más potencia de fuego, pero también requieren más capacidad industrial (IC), combustible, mano de obra y visibilidad de superficie.§!"
 module_100mm_battery_desc: "Batería naval estándar que proporciona una potencia de fuego versátil contra amenazas aéreas y de superficie.\n\n§GConsejo de diseño: Las baterías de cañones proporcionan ataque de cañón, ataque antiaéreo y puntos de vida para una defensa aérea y de superficie versátil. Las baterías más grandes añaden más potencia de fuego, pero también requieren más capacidad industrial (IC), combustible, mano de obra y visibilidad de superficie.§!"
 module_152mm_battery_desc: "Batería naval pesada que ofrece un potente fuego de largo alcance contra buques y fortificaciones costeras.\n\n§GConsejo de diseño: Las baterías de cañones proporcionan ataque de cañón, ataque antiaéreo y puntos de vida para una defensa aérea y de superficie versátil. Las baterías más grandes añaden más potencia de fuego, pero también requieren más capacidad industrial (IC), combustible, mano de obra y visibilidad de superficie.§!"
 module_76mm_gun_1: "Cañón Rápido de 76mm Temprano"
 module_76mm_gun_2: "Cañón Rápido de 76mm"
 module_76mm_gun_3: "Cañón Rápido de 76mm - Munición Guiada"
 module_76mm_gun_4: "Cañón Ultrarrápido de 76mm - Munición Guiada"
 module_76mm_gun_1_desc: "Los primeros cañones de tiro rápido de 76 mm proporcionan un ataque antiaéreo básico y potencia de fuego de superficie a corta distancia.\n\n§GConsejo de diseño: Los cañones navales proporcionan ataque de cañón y ataque antiaéreo con una pequeña cantidad de puntos de vida. Son útiles como armas de doble propósito económicas, pero añaden costes de capacidad industrial (IC), combustible, mano de obra y visibilidad de superficie sin aportar perforación de cañón.§!"
 module_76mm_gun_2_desc: "Los cañones de tiro rápido de 76 mm mejorados aumentan la cadencia de fuego y la precisión para una defensa polivalente.\n\n§GConsejo de diseño: Los cañones navales proporcionan ataque de cañón y ataque antiaéreo con una pequeña cantidad de puntos de vida. Son útiles como armas de doble propósito económicas, pero añaden costes de capacidad industrial (IC), combustible, mano de obra y visibilidad de superficie sin aportar perforación de cañón.§!"
 module_76mm_gun_3_desc: "Equipados con munición guiada, estos cañones de 76 mm mejoran la probabilidad de impacto contra objetivos rápidos o en maniobra.\n\n§GConsejo de diseño: Los cañones navales proporcionan ataque de cañón y ataque antiaéreo con una pequeña cantidad de puntos de vida. Son útiles como armas de doble propósito económicas, pero añaden costes de capacidad industrial (IC), combustible, mano de obra y visibilidad de superficie sin aportar perforación de cañón.§!"
 module_76mm_gun_4_desc: "Los cañones de tiro ultrarrápido de 76 mm con munición guiada proporcionan un rendimiento antiaéreo y de superficie excepcional a distancias cortas y medias.\n\n§GConsejo de diseño: Los cañones navales proporcionan ataque de cañón y ataque antiaéreo con una pequeña cantidad de puntos de vida. Son útiles como armas de doble propósito económicas, pero añaden costes de capacidad industrial (IC), combustible, mano de obra y visibilidad de superficie sin aportar perforación de cañón.§!"
 module_127mm_guns_1: "Cañones de 127mm I"
 module_127mm_guns_2: "Cañones de 127mm II"
 module_127mm_guns_3: "Cañones de 127mm III"
 module_127mm_guns_4: "Cañones de 127mm IV"
 module_127mm_guns_1_desc: "Los primeros cañones navales de 127 mm proporcionan una potencia de fuego moderada para enfrentamientos de superficie y una capacidad antiaérea limitada.\n\n§GConsejo de diseño: Los cañones navales proporcionan ataque de cañón y ataque antiaéreo con una pequeña cantidad de puntos de vida. Son útiles como armas de doble propósito económicas, pero añaden costes de capacidad industrial (IC), combustible, mano de obra y visibilidad de superficie sin aportar perforación de cañón.§!"
 module_127mm_guns_2_desc: "Los cañones de 127 mm mejorados ofrecen una mayor cadencia de fuego y mejor precisión, aumentando la efectividad contra las amenazas navales modernas.\n\n§GConsejo de diseño: Los cañones navales proporcionan ataque de cañón y ataque antiaéreo con una pequeña cantidad de puntos de vida. Son útiles como armas de doble propósito económicas, pero añaden costes de capacidad industrial (IC), combustible, mano de obra y visibilidad de superficie sin aportar perforación de cañón.§!"
 module_127mm_guns_3_desc: "Los cañones modernos de 127 mm integran estabilización y control de tiro avanzados para enfrentamientos fiables a largo alcance.\n\n§GConsejo de diseño: Los cañones navales proporcionan ataque de cañón y ataque antiaéreo con una pequeña cantidad de puntos de vida. Son útiles como armas de doble propósito económicas, pero añaden costes de capacidad industrial (IC), combustible, mano de obra y visibilidad de superficie sin aportar perforación de cañón.§!"
 module_127mm_guns_4_desc: "Los cañones navales de 127 mm altamente avanzados proporcionan una precisión, alcance y cadencia de tiro superiores, lo que los hace eficaces tanto contra buques como contra aeronaves.\n\n§GConsejo de diseño: Los cañones navales proporcionan ataque de cañón y ataque antiaéreo con una pequeña cantidad de puntos de vida. Son útiles como armas de doble propósito económicas, pero añaden costes de capacidad industrial (IC), combustible, mano de obra y visibilidad de superficie sin aportar perforación de cañón.§!"
 tech_light_guns_1: "Cañones navales 1975"
 tech_light_guns_1_desc: "Un cañón de uso dual es un montaje de artillería naval diseñado para atacar tanto objetivos superficiales como aéreos."
 tech_light_guns_2: "Cañones navales 2000"
 tech_light_guns_2_desc: "Un cañón de uso dual es un montaje de artillería naval diseñado para atacar tanto objetivos superficiales como aéreos."
 tech_light_guns_3: "Cañones navales 2025"
 tech_light_guns_3_desc: "Un cañón de uso dual es un montaje de artillería naval diseñado para atacar tanto objetivos superficiales como aéreos."
 module_heavy_frigate_upgrade_package: "Paquete de Actualización de Fragata Pesada"
 module_heavy_frigate_upgrade_package_desc: "Aunque podemos construir fragatas, nos encontramos en un callejón sin salida respecto a las clases de buques más pesados. Se necesitarían años de material e inversiones para prepararnos para barcos más pesados como los destructores. Podríamos mejorar nuestras fragatas para que sean más competitivas contra buques de mayor tonelaje mediante la actualización y el fortalecimiento de nuestras fragatas hacia una nueva clase: la 'Fragata pesada'.\n\n§GConsejo de diseño: Este módulo clasifica a la fragata como un buque capital y mejora enormemente su ataque, protección y organización, pero incrementa drásticamente el coste de producción, la visibilidad y el consumo de combustible.§!"
