 DESIGNER_COMBATWIDTH_TOOLTIP: "Combat Width: §Y$VALUE|0$§!\n\nCombat Width tells you how much room this brigade will take up in combat.\nFor example if a combat has a total width of §Y80§! you can fit §Y4§! brigades with width of §Y20§!"
