 RAJ_islamic_ulema_invite_accept_tt:0 "§YA nação ingressa na facção Ulemá Islâmica da Índia.§!"
 RAJ_islamic_ulema_invite_reject_tt:0 "§YAs relações ruem de ambos os lados, e a nação sofre suas próprias penalidades políticas e de estabilidade.§!"
 RAJ_development_in_progress:0 "Uma Iniciativa de Desenvolvimento Integrado Já Está em Andamento"
 RAJ_pak_top_influencer_tt:0 "§Y[ROOT.GetNameWithFlag]§! é a principal fonte de influência estrangeira em §Y[PAK.GetNameWithFlag]§!"
 RAJ_seek_permanent_unsc_seat:0 "Buscar Assento Permanente no CSNU"
 RAJ_seek_permanent_unsc_seat_desc:0 "A população, o peso econômico e o papel da Índia nas operações internacionais de paz sustentam a reivindicação de representação permanente no Conselho de Segurança das Nações Unidas. Iniciaremos a campanha diplomática necessária para levar essa reivindicação ao Conselho e à Assembleia Geral."
 RAJ_enshrine_pluralism:0 "Consagrar o Pluralismo"
 RAJ_enshrine_pluralism_desc:0 "Inscrever o acordo religioso na ordem constitucional, em vez de deixá-lo à boa vontade do governo da vez. Requer a lei §YHarmonia Pluralista§! e a Harmonia Religiosa vigente. O bônus fica fixado permanentemente e a opinião comunitária deixa de causar agitação, crises separatistas ou secessão."
 RAJ_all_faiths_content:0 "Todas as fés têm uma opinião acima de §Y80§!"
 RAJ_pluralist_harmony:0 "Harmonia Pluralista"
 RAJ_pluralist_harmony_desc:0 "Pluralismo adotado a partir de uma posição de força. Todas as comunidades já apoiam o governo, de modo que a igualdade perante o Estado é vista como reconhecimento, e não como uma concessão arrancada de uma maioria ressentida."
 RAJ_pluralist_settlement:0 "Acordo Pluralista"
 RAJ_pluralist_settlement_desc:0 "O acordo religioso foi inscrito na ordem constitucional e não depende mais do governo da vez. A posição comunitária deixou de determinar a coesão da união."
 RAJ_hindus_opinion_tt:0 "Opinião §YHindu§!: $RIGHT|+=0$"
 RAJ_muslim_opinion_tt:0 "Opinião §YMuçulmana§!: $RIGHT|+=0$"
 RAJ_sikh_opinion_tt:0 "Opinião §YSikh§!: $RIGHT|+=0$"
 RAJ_christians_opinion_tt:0 "Opinião §YCristã§!: $RIGHT|+=0$"
