 UKR_module_ram_1: "Arbalet-K"
 UKR_module_ram_1_desc: "§7Arbalet-K§! is a short-range naval surface-to-air missile system developed and manufactured by the Ukrainian Luch Design Bureau. It is designed to engage jet, turboprop, and piston-engine aircraft and helicopters on head-on and pursuit courses under conditions of visual target visibility, using §7'Igla'§!-type guided surface-to-air missiles."
 UKR_module_anti_submarine_mortar: "RBU-6000 Smerch-2"
 UKR_module_anti_submarine_mortar_desc: "The RBU-6000 Smerch-2 is a 213 mm caliber Soviet anti-submarine rocket launcher, it has twelve launcher pipes in one system. The system entered service in 1960–1961 and is fitted to a wide range of Soviet-made surface vessels."
 railway_system_01: "Integrated Transportation System"
 railway_system_01_desc: "With the advent of a new wave of technology Railway systems need to be integrated with the rest of our infrastructure. Only like this it can be ensured our logistics remain intact."
 railway_system_02: "Post Conventional Railways"
 railway_system_02_desc: "The information technology of the new millennium allows logistics and infrastructure developments to move past the days of old and to run that much more smoothly."
 railway_system_04: "Early High Speed Rail"
 railway_system_04_desc: "High-Speed rails are the logical next step in logistical improvements. Using extensively planned routes and modern construction equipment can produce priority rails, allowing trains to cover longer distances, quicker."
 railway_system_05: "High Speed Rail"
 railway_system_05_desc: "While not a decisive advance in technology, further use and more expansion of existing high-speed rail networks will allow ironing out some more issues and give rail designers more experience when planning these systems."
 railway_system_06: "Modern High Speed Rail"
 railway_system_06_desc: "Modern materials, technology, communication and massive efforts in planning will bring the present high-speed network to a new level. Opening up these extensive systems to public travel will also raise the quality of life and enable the populace to be way more mobile. Of course, this also applies to armed forces."
 railway_system_08: "Early Maglev Rail"
 railway_system_08_desc: "A Maglev Train moves not under its power, like conventional trains, but instead relies on electromagnetic principles to move. Powered electromagnets can repel or attract a train above a single magnetic rail. The orientation of these magnets can then be altered to get the carriages moving. It will save a lot of space and can be maintained easily. "
 railway_system_09: "Standardised Maglev Rail"
 railway_system_09_desc: "Standardized Maglev Rail projects have proven that a successful and standardized Maglev rail can be deployed across the country with great sucess. Now, these systems will be integrated and most importantly, standardized. Nothing stands in the way of a continued and extreme expansion of both short and long-distance maglev rail."
 railway_system_11: "Improved Maglev Rail"
 railway_system_11_desc: "Advancements in maglev safety has allowed for the replacement of long-distance rail with maglev."
 railway_system_12: "High Speed Maglev Rail"
 railway_system_12_desc: "It is now possible to introduce high speed maglev across the nations."
 railway_system_13: "Subsonic Maglev Rail"
 railway_system_13_desc: "Distances across a nation have become a minor inconvenience in daily commute with almost sonic speeds."
 railway_system_15: "Supersonic Maglev Rail"
 railway_system_15_desc: "Maglev technology evolution has allowed us to travel to the other side of the planet within two hours."
 arty_upgrade_1: "Multiple Rounds Simultaneous Impact"
 arty_upgrade_1_desc: "The process of modifying launch angle and velocity for each warhead - thereby making all projectiles engage a target simultaneously"
 arty_upgrade_2: "Fire Control System"
 arty_upgrade_2_desc: "Designed to assist a ranged weapon system in targeting, tracking, and hitting its target"
 arty_upgrade_3: "Varied Propellant Charges"
 arty_upgrade_3_desc: "The amount of propellant to be fired with artillery ammunition is varied by the propellant increments - selected based upon the range to target and tactical situation"
 arty_upgrade_4: "Multiple Rounds Simultaneous Impact II"
 arty_upgrade_4_desc: "An upgraded process with higher-end components allowing for simultaneous engagement of enemy target(s)"
 arty_upgrade_5: "Bulk-Loaded Liquid Propellants"
 arty_upgrade_5_desc: "An advanced technology allowing for a simple gun design and a wider range of tactical and logistical options."
