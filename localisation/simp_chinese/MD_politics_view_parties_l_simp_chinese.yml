 KOR.conservatism_2020: "£kor_western_conservative_alt (PPP) 国民力量党"
 KOR.conservatism_2020_icon: "£kor_western_conservative_alt"
 KOR.conservatism_2020_desc: "（爱国保守主义）- 国民力量党\n\n国民力量党是韩国最大的保守党派，由自由韩国党与其他保守党派合并而成，其基础是支持大企业在韩国经济中的突出作用、怀疑左翼政治、敌视朝鲜（这与对美国的强力支持密切相关）。"
 KOR.socialism_2003: "£kor_western_social_democrat_alt (YUP)开放国民党"
 KOR.socialism_2003_icon: "£kor_western_social_democrat_alt"
 KOR.socialism_2003_desc: "（韩国自由主义） - 开放国民党\n\n左翼自由党“开放国民党”由前大国家党和民主党成员组成。该党主张自由和进步，致力于以左翼方式处理经济问题，支持工会，限制大财阀的影响。该党决心实现统一，主张与朝鲜进行谈判和接触，并谨慎地与韩国的盟友美国建立关系。"
 KOR.socialism_2008: "£kor_western_social_democrat_alt2  (UDP) 统一民主党"
 KOR.socialism_2008_icon: "£kor_western_social_democrat_alt2"
 KOR.socialism_2008_desc: "（韩国自由主义） - 统一民主党\n\n左翼自由派统一民主党（当地称为“共同民主党”）由多个自由派政党合并而成。该党主张中间派和自由派，致力于自由主义经济政策，支持中产阶级。该党决心实现统一，主张与朝鲜进行谈判和接触，并谨慎对待与韩国盟友美国的关系。"
 KOR.socialism_2011: "£kor_western_social_democrat_alt3 (DUP)民主统合党"
 KOR.socialism_2011_icon: "£kor_western_social_democrat_alt3"
 KOR.socialism_2011_desc: "（韩国自由主义） - 民主统合党\n\n左翼自由民主联合党（简称民主党）由多个自由党派合并而成，当地称之为“共同民主党”。该党立场中立且自由，致力于以自由主义的方式发展有利于中产阶级的经济。该党决心实现统一，主张与朝鲜进行谈判和接触，并谨慎地与韩国的盟友美国保持关系。"
 KOR.socialism_2014: "£kor_western_social_democrat_alt4 (DPK) 韩国民主党"
 KOR.socialism_2014_icon: "£kor_western_social_democrat_alt4"
 KOR.socialism_2014_desc: "（韩国自由主义） - 韩国民主党\n\n左翼自由民主党，又称韩国共同民主党，当地称为“共同民主党”，由多个自由党派合并而成。该党随后成为中间派和自由派，致力于采取有利于中产阶级的自由主义经济政策。该党决心实现统一，主张与朝鲜进行谈判和接触，并与韩国的盟友美国保持谨慎的关系。"
