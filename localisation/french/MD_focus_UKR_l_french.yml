 UKR_develop_t64_strazh_desc: "The BMPT 'Strazh' was an experimental Ukrainian tank-support vehicle developed on the chassis of the T-64 tank.\nThe project was developed jointly by the Zhytomyr Armoured Plant, Kyiv Armoured Plant and Artem State Holding Company and was presented in 2017.\nThe original T-64 turret was replaced by the Ukrainian 'Duplet' remotely operated combat module, giving the vehicle a completely different role from the original tank.\nThe project was intended to provide heavily protected fire support while making use of existing T-64 chassis and Ukrainian-developed combat equipment.\n' Strazh' remained an experimental project and was not adopted for large-scale production, §Gbut we can change that, right?§!"
 UKR_develop_t72amt_desc: "The T-72AMT was a Ukrainian modernization of the T-72A developed by the Kyiv Armoured Plant for the Armed Forces of Ukraine.\nThe modernization introduced the V-84-1 engine, improved night-vision equipment, the 1K13 sight and the Ukrainian 'Nizh' reactive armor system.\nThe tank also received modern communications equipment and the SN-3003 'Basalt' navigation system, while elements of the running gear were upgraded using components developed for the T-80.\nThe 1K13 sight allowed the modernized tank to employ the 'Kombat' guided weapon system.\nThe T-72AMT was intended as a relatively economical way of bringing existing T-72 tanks closer to modern Ukrainian operational requirements."
 UKR_modernize_zsu_23_4m_a1_spaa_desc: "The ZSU-23-4M-A1 'Rokach' is a Ukrainian modernization of the Soviet ZSU-23-4 'Shilka' self-propelled anti-aircraft gun.\nThe modernization replaces the outdated fire-control and observation equipment with a modern digital system, improving the vehicle's ability to detect and track aerial targets.\nThe system retains the four 23 mm autocannons while receiving improved electronics and four Short-range anti-air missiles.\nThese changes significantly improve the combat effectiveness of the ZSU-23-4 against low-flying targets."
 UKR_modernize_s125_spaa_desc: "The S-125-2D is a Ukrainian modernization of the Soviet S-125 surface-to-air missile system.\nThe modernization is intended to replace outdated electronic components and improve the system's resistance to electronic warfare and modern countermeasures.\nThe radar and guidance equipment are upgraded, while the system receives improved capabilities for detecting, tracking, and engaging aerial targets.\nThe modernization is intended to extend the operational life of the S-125 while improving its effectiveness on the modern battlefield."
 UKR_modernize_s125m_spaa_desc: "The S-125M was a Ukrainian modernization programme intended to extend the service life and capabilities of the Soviet S-125 'Pechora' air-defense system.\nThe programme was carried out by Ukrainian defense companies including KB Luch and Radionix, with work focused on modernizing the missile and the system's guidance and fire-control equipment.\nThe modernization included upgraded 5V27D missiles and the FCR-125 radar system, replacing important elements of the original Soviet-era equipment.\nThe S-125M project provided Ukraine with a way to significantly extend the useful life of existing S-125 systems without developing an entirely new air-defense complex."
 UKR_modernize_kvadrat_spaa_desc: "The 2K12M1-2L 'Kvadrat-2L' is a Ukrainian modernization of the Soviet 2K12M1 'Kub' surface-to-air missile system.\nThe modernization replaces a number of outdated electronic components with modern Ukrainian-made equipment.\nThe system receives improved radar and fire-control capabilities, increasing its ability to detect, track, and engage aerial targets.\nThe modernization is intended to extend the service life of the remaining 2K12M1 systems while improving their effectiveness against modern threats."
 UKR_develop_t38_stylet_spaa_desc: "The T-38 'Stylet' is a Ukrainian short-range surface-to-air missile system developed by the Arsenal plant together with Belarusian partners.\nThe system uses the T382 missile and is designed to engage aircraft, helicopters, cruise missiles, and other low-flying aerial targets.\nThe complex is mounted on a tracked chassis, providing it with high mobility and the ability to operate alongside mechanized units.\nThe development of the T-38 provides Ukraine with a modern replacement for aging Soviet short-range Osa systems."
 UKR_modernize_rk10_spaa_desc: "The RK-10 is a Ukrainian anti-aircraft guided missile developed as an alternative to the aging missiles used by Soviet-era short-range air-defense systems.\nIntegrating the RK-10 with the Strela-10 system would allow its launchers to use a newer missile while retaining the existing vehicle and launcher infrastructure.\nThe new missile provides improved engagement capabilities and allows the system to remain operational without relying on increasingly obsolete Soviet ammunition.\nThis modernization would extend the service life of the Strela-10 fleet while increasing its combat effectiveness."
 UKR_develop_kentavr_spaa_desc: "The ZRAK 'Kentavr' was a Ukrainian concept for a new self-propelled anti-aircraft system developed as a further evolution of the earlier 'Pereach' project.\nThe project was redesigned around two paired 40 mm automatic cannons, replacing the earlier concept based on a 57 mm anti-aircraft gun, while retaining a missile component and dedicated fire-control equipment.\nThe 'Kentavr' concept was intended to combine radar-based target detection with an electro-optical fire-control system, allowing the vehicle to engage aerial targets using both gun and missile armament.\nThe system was planned around a tracked chassis derived from the prospective Ukrainian tank platform developed by the Kharkiv Morozov Design Bureau as part of the 'Molot'/'Bokser' development programme."
 UKR_modernize_planes_category: "Modernize Our Combat Aircrafts"
 UKR_modernize_planes_category_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_main\n\n\n\n\n\n\n\n\nWe can spend time and money researching and testing the upgrades for Soviet era aircrafts and helicopters, that are being used by our Air Force. And when some time will past and we will gain some experience - we may even try to build unique domestic designs."
 UKR_modernize_su25_m1_desc: "\n\n\n\n\n\n£UKR_desctext_su25m1_modernization_for_tooltip\n\n\n\n\n\n\n\n\nThe Su-25M1 is a Ukrainian modernization of the Soviet Su-25 close air support aircraft.\nThe modernization introduces improved navigation, communications, and targeting equipment while retaining the aircraft's existing airframe and weapons capabilities.\nThe upgraded systems improve the accuracy of unguided weapons and allow the aircraft to operate more effectively in modern combat conditions.\nThe modernization also extends the operational life of Ukraine's Su-25 fleet."
 UKR_modernize_su27_1m_desc: "\n\n\n\n\n\n£UKR_desctext_su271m_modernization_for_tooltip\n\n\n\n\n\n\n\n\nThe Su-27-1M is a Ukrainian modernization of the Soviet Su-27 fighter aircraft.\nThe program introduces improved navigation, communication, identification, and onboard electronic systems to increase the aircraft's combat effectiveness.\nThe upgraded avionics provide better situational awareness and improve the aircraft's ability to employ modern weapons.\nThe modernization allows the Su-27 to remain in service while reducing the limitations imposed by its original Soviet-era equipment."
 UKR_modernize_mig29_mu2_desc: "\n\n\n\n\n\n£UKR_desctext_mig29mu1_modernization_for_tooltip\n\n\n\n\n\n\n\n\nThe MiG-29MU2 is a Ukrainian modernization of the Soviet MiG-29 fighter aircraft developed by Lviv State Aircraft Repair Plant.\nThe modernization builds upon the earlier MU1 program and introduces more extensive upgrades to the aircraft's avionics, navigation, and targeting systems.\nThe aircraft receives improved capabilities for employing modern guided and unguided weapons against both aerial and ground targets.\nThe MU2 program is intended to transform the MiG-29 into a more capable multirole combat aircraft."
 UKR_modernize_mig29_mu1_desc: "\n\n\n\n\n\n£UKR_desctext_mig29mu2_modernization_for_tooltip\n\n\n\n\n\n\n\n\nThe MiG-29MU1 is a Ukrainian modernization of the Soviet MiG-29 fighter aircraft.\nThe program introduces improved onboard electronics and a modernized radar warning and navigation system.\nThe upgraded equipment improves the pilot's situational awareness and allows the aircraft to operate more effectively in modern combat conditions.\nThe MU1 modernization also serves as an intermediate step toward more extensive upgrades of the MiG-29."
 UKR_develop_an_bfv_desc: "\n\n\n\n\n\n£UKR_desctext_an_bfv_development_for_tooltip\n\n\n\n\n\n\n\n\nThe proposed Antonov fighter aircraft was a conceptual project for the development of a Ukrainian-designed combat aircraft.\nThe project was intended to use Ukraine's experience in aircraft design and production to create a modern fighter without relying entirely on foreign designs.\nThe aircraft would incorporate modern avionics, weapons, and aerodynamic solutions while being adapted to the capabilities of the Ukrainian aviation industry.\nAlthough the project remained at the proposal stage, its development could provide the foundation for a future generation of Ukrainian combat aircraft."
 UKR_develop_bm21_k: "Develop §YBM-21K§! MLRS"
 UKR_develop_bm21_k_desc: "The BM-21K is a Ukrainian modernization of the Soviet BM-21 'Grad' multiple launch rocket system.\nThe system is mounted on a modern Ukrainian KrAZ truck chassis and receives improved navigation, communication, and fire-control equipment.\nThe modernization improves the system's mobility and allows crews to prepare and conduct fire missions more efficiently.\nThe BM-21K provides a relatively inexpensive way to modernize Ukraine's large fleet of Soviet-era Grad launchers."
 UKR_develop_bastion03: "Develop §Y'Bastion-03'§! MLRS"
 UKR_develop_bastion03_desc: "The 'Bastion-03' is a Ukrainian multiple launch rocket system developed as a modernization of the Soviet BM-27 'Uragan' by Shepetivska Repair Plant.\nThe system is based on a modern truck chassis.\nThe modernization improves mobility and reduces the time required to prepare the launcher for firing.\nThe Bastion-03 would allow Ukraine to continue using existing 220 mm rockets while replacing the aging Soviet-era chassis."
 UKR_develop_Vilkha: "Develop a new gen MLRS §Y'Vilkha'§!"
 UKR_develop_Vilkha_desc: "The 'Vilkha' is a Ukrainian multiple launch rocket system developed from the Soviet BM-30 'Smerch' by the Luch Design Bureau.\nThe project replaces the original unguided rockets with new guided missiles equipped with a Ukrainian guidance system.\nThe system is designed to provide significantly improved accuracy while retaining the high destructive potential and range of a heavy MLRS.\nThe development of Vilkha represents a transition from Soviet-era unguided rocket artillery toward modern precision strike capabilities."
 UKR_develop_bureviy: "Develop a new gen MLRS §Y'Bureviy'§!"
 UKR_develop_bureviy_desc: "The 'Bureviy' is a Ukrainian multiple launch rocket system designed as a modern replacement for the aging BM-27 'Uragan' family.\nThe system is mounted on a modern Tatra T815-7T3R2T chassis and incorporates digital fire-control and navigation systems.\nBureviy is designed to use existing 220 mm Smerch rockets as well as newer Ukrainian-developed ammunition.\nThe combination of modern electronics, improved mobility, and compatibility with existing ammunition makes the system a practical modernization of Ukraine's rocket artillery."
 UKR_modernize_mi24pu1: "Develop a §YMi-24PU1§! Modernization"
 UKR_modernize_mi24pu1_desc: "The Mi-24PU-1 is a Ukrainian modernization of the Mi-24P developed by the Konotop Aircraft Repair Plant 'Aviakon' together with Ukrainian defense-industry enterprises.\nThe helicopter received more powerful TV3-117VMA-SBM1V-02 engines from Motor Sich, modernized avionics and navigation equipment, and systems for operation with night-vision equipment.\nThe modernization also incorporated the Adros KT-01AV protection system, the FPM-01KV laser aiming system and an upgraded ASP-17VPM-V sight.\nThe programme involved companies including Motor Sich, Adron, TsKB Arsenal and the Izium Instrument and Apparatus Factory, with later versions also using Ukrainian electro-optical equipment.\nThe Mi-24PU-1 therefore combined a major overhaul of the original helicopter with new Ukrainian engines, avionics, protection and targeting systems."
 UKR_develop_nota_desc: "Object 477A1 Nota is an advanced Soviet experimental main battle tank featuring an unmanned turret, isolated crew compartment and a powerful 152 mm main gun."
 UKR_modernize_nota_desc: "Object 477A1 'Nota' is a Ukrainian development of the Soviet Object 477 'Molot' advanced main battle tank project.\nThe design incorporates a heavily protected crew compartment, an unmanned fighting compartment, and a powerful main armament.\nThe modernization would introduce updated electronics, protection systems, and other components while adapting the design to technologies available to the Ukrainian defense industry.\nAlthough the project never reached mass production, further development could provide the basis for an advanced Ukrainian main battle tank."
 ukr_history.63.t: "The Arrest of Yulia Tymoshenko"
 ukr_history.63.d: "The former deputy prime minister for fuel and energy has been taken to Lukyanivska prison on charges of gas smuggling and forged documents dating from her years at United Energy Systems. She was dismissed in January after moving against the barter schemes in the sector, and the case was opened within weeks. A court will rule the detention unlawful and release her after forty-two days; by then she is no longer a minister who fell out with the president, but the face of the opposition to him."
 ukr_history.63.a: "So be it."