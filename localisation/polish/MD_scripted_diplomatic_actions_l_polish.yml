 REVOKE_MIL_SPY_ACCESS_TITLE: "Odbierz wojskowy dostęp do SPYSAT"
 REVOKE_MIL_SPY_ACCESS_ACTION_DESC: "Należy natychmiast cofnąć wszelkie uprawnienia do korzystania z naszego systemu wojskowych satelitów rozpoznawczych i odciąć dostęp do przesyłanych przez nie tajnych danych obrazowych. Działanie to pozbawia ich kluczowych zdolności w zakresie gromadzenia danych wywiadowczych, uniemożliwia korzystanie z informacji niezbędnych do prowadzenia obserwacji i wskazywania celów, a także stanowi sygnał o fundamentalnym naruszeniu zaufania na szczeblu strategicznym. Krok ten niesie ze sobą poważne konsekwencje dla dwustronnej współpracy wywiadowczej oraz ich świadomości sytuacyjnej. Stracą oni dotychczasowy dostęp do naszej §Ywojskowej sieci satelitów rozpoznawczych§!."
