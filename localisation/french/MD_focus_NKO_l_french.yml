 NKO_the_north_korean_carrier_desc: "Développer nos propres porte-avions projetera notre puissance."
 NKO_the_korean_typhoon_class: "Classe Typhoon nord-coréenne"
 NKO_the_korean_typhoon_class_desc: "Inspirés par les sous-marins mondiaux, nos Typhoon renforceront nos capacités sous-marines."
 NKO_ship_launched_cruise_missiles: "Missiles de croisière lancés par navire"
 NKO_ship_launched_cruise_missiles_desc: "Équiper notre marine de ces missiles étendra notre portée."
 NKO_korean_mariens: "Marines nord-coréens"
 NKO_korean_mariens_desc: "Former des unités marines d'élite permettra des opérations amphibies."
 NKO_get_russian_help: "Demander l'aide militaire russe"
 NKO_get_russian_help_desc: "Obtenir l'aide de la Russie renforcera notre technologie militaire."
 NKO_get_chinese_help: "Demander l'aide militaire chinoise"
 NKO_get_chinese_help_desc: "Obtenir l'aide de la Chine renforcera notre technologie militaire."
 NKO_our_jet: "Avion de chasse domestique"
 NKO_our_jet_desc: "Développer nos propres chasseurs accélérera notre avancement aérien."
 NKO_korean_ground_forces: "Renforcer les forces terrestres nord-coréennes"
 NKO_korean_ground_forces_desc: "Investir dans nos forces terrestres assurera leur préparation au combat."
 NKO_doctrine_modernization: "Moderniser notre doctrine"
 NKO_doctrine_modernization_desc: "Adopter une approche moderne de la guerre reflétera les réalités tactiques actuelles."
 NKO_implement_new_doctrine: "Mettre en œuvre une nouvelle doctrine"
 NKO_implement_new_doctrine_desc: "Implémenter de nouvelles stratégies renforcera notre efficacité au combat."
 NKO_superior_firepower: "Doctrine de la puissance de feu supérieure"
 NKO_superior_firepower_desc: "Se concentrer sur la puissance de feu assurera des victoires décisives."
 NKO_keep_our_doctrine: "Conserver notre doctrine traditionnelle"
 NKO_keep_our_doctrine_desc: "Affiner notre doctrine traditionnelle tirera parti de nos forces passées."
 NKO_train_the_south: "S'entraîner pour la guerre au Sud"
 NKO_train_the_south_desc: "Préparer nos forces spécifiquement pour le Sud assurera notre résilience."
 NKO_mass_assault_prevails: "L'assaut de masse prévaut"
 NKO_mass_assault_prevails_desc: "Notre doctrine d'assaut de masse restera efficace."
 NKO_special_mass_assault: "Unités d'assaut de masse spécialisées"
 NKO_special_mass_assault_desc: "Développer ces unités perfectionnera notre stratégie d'assaut."
 NKO_korean_iron_fist: "Le poing de fer nord-coréen"
 NKO_korean_iron_fist_desc: "Notre puissance sera un poing de fer écrasant toute opposition."
 NKO_defend_our_skies: "Défendre notre ciel"
 NKO_defend_our_skies_desc: "Renforcer nos défenses aériennes empêchera les incursions ennemies."
 NKO_defend_the_coast: "Défendre notre côte"
