l_french:
 CYP_division_of_the_island: "L'île divisée"
 CYP_division_of_the_island_desc: "La Ligne verte coupe Chypre en deux. Chypre du Nord demeure sous occupation turque et l'autorité de la République s'arrête à une zone tampon surveillée par l'ONU. La division non résolue épuise la volonté politique et maintient une partie de la population et du territoire hors d'atteinte."
 CYP_eu_membership: "État membre de l'UE"
 CYP_eu_membership_desc: "Chypre a rejoint l'Union européenne en 2004, obtenant l'accès au marché unique, aux fonds structurels et un cadre de soutien politique des partenaires de Nicosie à Bruxelles. L'adhésion façonne la trajectoire économique de l'île et sa posture diplomatique."
 CYP_offshore_gas: "Champs de gaz de la Méditerranée orientale"
 CYP_offshore_gas_desc: "Des blocs d'exploration dans les eaux de la zone économique exclusive ont confirmé des réserves de gaz commercialement viables. Les recettes d'extraction et les contrats de licence apportent un nouveau flux de revenus et compliquent les relations avec la Turquie, qui conteste des parties de la zone."
 CYP_financial_center: "Centre financier régional"
 CYP_financial_center_desc: "Chypre s'est forgé une réputation de juridiction à faible fiscalité pour les holdings, les registres maritimes et les flux de capitaux internationaux. Le secteur apporte des revenus de services substantiels mais attire un examen sur la transparence."
 CYP_tourism_economy: "Une économie axée sur le tourisme"
 CYP_tourism_economy_desc: "Le soleil, la côte et l'Antiquité attirent des millions de visiteurs chaque année. Le tourisme est une pierre angulaire du PIB chypriote, soutenant l'hôtellerie et le commerce de détail tout en atténuant une partie de la pression des importations d'une économie tournée vers la consommation."
 CYP_foreign_investment_wave: "Campagne d'investissement étranger"
 CYP_foreign_investment_wave_desc: "Un programme actif d'incitations fiscales, de visas d'investisseur et de garanties bilatérales a ouvert une courte fenêtre d'investissement direct étranger élevé. De nouveaux capitaux affluent vers les services, l'immobilier et l'industrie légère."
 CYP_develop_offshore_gas: "Développer des champs de gaz offshore"
 CYP_develop_offshore_gas_desc: "Commander des travaux de prospection et engager des contrats de licence pour mettre en production les blocs gaziers de Méditerranée orientale. L'investissement est substantiel, mais un développement réussi fournira un flux de revenus de long terme et renforcera les revendications chypriotes sur sa zone économique exclusive."
 CYP_eu_accession_push: "Initiative d'approfondissement de l'UE"
 CYP_eu_accession_push_desc: "Chypre engage Bruxelles et des États membres clés sur une participation pleine aux processus d'intégration européenne, de la candidature Schengen à la consolidation de la zone euro. Un lobbying soutenu construit la bienveillance grecque et européenne envers la position de Nicosie sur le différend insulaire."
 CYP_bicommunal_talks: "Pourparlers bicommunautaires"
 CYP_bicommunal_talks_desc: "Inviter des représentants de Chypre du Nord à un dialogue structuré sous l'égide de l'ONU. Les progrès sont rarement spectaculaires, mais un contact soutenu maintient ouverte une voie de règlement et signale à la Grèce et à l'Europe que Nicosie agit de bonne foi."
 CYP_court_foreign_investment: "Solliciter l'investissement étranger"
 CYP_court_foreign_investment_desc: "Offrir des incitations ciblées aux entreprises étrangères qui envisagent Chypre comme base d'opérations. Le paquet initial coûte au Trésor, mais l'attraction réussie de capitaux augmente les revenus du secteur des services et élargit l'assiette fiscale pour une période limitée."
 CYP_mobilize_greek_cypriots: "Rassembler la communauté chypriote grecque"
 CYP_mobilize_greek_cypriots_desc: "Orienter des ressources de l'État vers les associations civiques, l'Église et la diaspora pour consolider le soutien à la vision de l'île de la République. Une communauté chypriote grecque confiante et organisée renforce la main de Nicosie dans la contestation de l'avenir de Chypre."
 CYP_outreach_to_north: "Tendre la main au-delà de la Ligne verte"
 CYP_outreach_to_north_desc: "Financer des projets intercommunautaires, des ouvertures commerciales et des contacts discrets avec des modérés du Nord. Chaque Chypriote turc gagné à un règlement partagé dirigé par Nicosie entame l'argument d'une partition permanente."
 NCY_mobilize_turkish_cypriots: "Rassembler la communauté chypriote turque"
 NCY_mobilize_turkish_cypriots_desc: "Mobiliser les institutions du Nord et le soutien d'Ankara pour consolider la communauté chypriote turque derrière l'existence d'un État séparé. Un Nord uni est plus difficile à absorber dans tout règlement dirigé par les Grecs."
 NCY_settler_program: "Programme de peuplement anatolien"
 NCY_settler_program_desc: "Poursuivre la politique de longue date de réinstallation de familles anatoliennes continentales au Nord. Le basculement démographique cimente le poids chypriote turc sur l'île, bien qu'il approfondisse le grief au Sud et attire les critiques internationales."
 CYP_gain_8_strength_TT: "Les §HChypriotes grecs§! §GGAIN§! §H8 de force§!"
 CYP_reduce_north_TT: "Les §HChypriotes turcs§! §RLOSE§! §H6 de force§!"
 NCY_gain_8_strength_TT: "Les §HChypriotes turcs§! §GGAIN§! §H8 de force§!"
 NCY_settler_TT: "Les §HChypriotes turcs§! §GGAIN§! §H6 de force§! et les §HChypriotes grecs§! §RLOSE§! §H4 de force§!"
 cyprus.1.t: "Confirmé : les réserves de Méditerranée orientale sont viables"
 cyprus.1.d: "Les résultats de prospection sont arrivés. Le forage dans les blocs Aphrodite et adjacents a confirmé des réserves assez importantes pour soutenir une extraction commerciale. Nicosie s'empresse de finaliser les contrats de licence. La Turquie a déposé ses objections par les canaux diplomatiques, mais le fondement juridique de notre zone économique exclusive est solide."
 cyprus.1.a: "Lancer le développement."
 cyprus.2.t: "Négociations bicommunautaires : un choix d'approche"
 cyprus.2.d: "Des délégations chypriotes grecques et chypriotes turques se sont réunies à Nicosie sous facilitation de l'ONU. L'atmosphère est prudente. Les deux parties ont des griefs en suspens et aucune n'est pressée d'offrir des concessions. La façon dont nous procédons ici façonnera le prochain cycle de négociations."
 cyprus.2.a: "S'engager de façon constructive et poser des propositions concrètes sur la table."
 cyprus.2.b: "Tenir fermement sur les positions fondamentales et refuser de bouger en premier."
 cyprus.3.t: "Chypre : un siège plus profond à la table européenne"
 cyprus.3.d: "Les officiels chypriotes sont rentrés de Bruxelles avec une position institutionnelle plus forte qu'auparavant. Les partenaires de l'UE ont reconnu l'adhésion constante de Nicosie à l'acquis et sa participation active aux structures européennes. Le standing de l'île à Bruxelles est plus élevé qu'à aucun moment depuis l'adhésion."
 cyprus.3.a: "Nous utiliserons cet élan."
 cyprus.4.t: "Ligne verte : incident dans la zone tampon"
 cyprus.4.d: "Une confrontation à l'un des postes de contrôle de la zone tampon a dégénéré en un incident diplomatique mineur. La force de maintien de la paix de l'ONU a rétabli l'ordre, mais les deux parties s'échangent des accusations. L'événement a relancé le débat à Nicosie sur la façon de traiter les provocations du Nord."
 cyprus.4.a: "Émettre une condamnation publique formelle."
 cyprus.4.b: "Le soulever via l'ONU et le tenir hors de la presse."
