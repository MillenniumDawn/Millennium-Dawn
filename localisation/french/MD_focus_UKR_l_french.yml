 UKR_party_regions_committee_economic: "Comité des réformes économiques"
 UKR_party_regions_committee_economic_desc: "Nous créerons également un autre ministère, le Comité des réformes économiques."
 UKR_party_regions_mezhyhirya: "Mejhyhiria"
 UKR_party_regions_mezhyhirya_desc: "En tant que vrai président, il faut avoir son propre abri où l'on peut se reposer des soucis et des affaires politiques."
