 SAU_succession_panel_dormant: "왕좌에는 주인이 있으며 왕위 계승은 다툼의 대상이 아닙니다. 계승 문제가 다시 불거지면 왕자들과 그 파벌들이 이곳에 표시됩니다.[ROOT.GetSAUFaisalitePanelLine][ROOT.GetSAUGrievancePanelLine]"
 SAU_succession_panel_named: "왕세자가 지명되었습니다: §H[ROOT.GetSAUCrownPrinceName]§!. 경쟁은 끝났으며, 이 합의는 국왕이 살아 있는 동안에만 유지될 것입니다.\n\n§Y국왕의 건강:§! §H[ROOT.GetSAUKingHealth]§![ROOT.GetSAUFaisalitePanelLine][ROOT.GetSAUGrievancePanelLine]"
 SAU_succession_panel_race1: "파흐드 국왕이 서거하고 압둘라 국왕이 통치하고 있으나, 그 역시 고령이어서 왕위 계승은 불안정합니다. 세 명의 왕자가 후계자로 지명되기 위해 경합하고 있습니다. 수다이리 파벌의 기수인 살만 빈 압둘아지즈, 보안 기관을 장악한 무함마드 빈 나이프, 그리고 국가방위대 사령관인 무타입 빈 압둘라입니다.\n\n한 왕자를 지지하여 왕가와 국가를 그의 뒤에 결집시키고, 경쟁자들을 약화시키십시오. 각 파벌 또한 저마다 획책하므로 영향력의 균형은 매월 바뀝니다. 압둘라 국왕이 서거하면 가장 큰 영향력 지분을 가진 왕자가 왕좌에 오릅니다.\n\n§Y살만 빈 압둘아지즈:§! [?SAU_salman_share|0]%\n§Y무함마드 빈 나이프:§! [?SAU_mbn_share|0]%\n§Y무타입 빈 압둘라:§! [?SAU_mutaib_share|0]%\n\n§Y오늘 압둘라가 서거할 경우의 왕위 계승 예정자:§! §H[ROOT.GetSAUCrownFrontrunner]§![ROOT.GetSAUFaisalitePanelLine][ROOT.GetSAUGrievancePanelLine]"
 SAU_succession_panel_race2: "살만 국왕이 통치하고 있으며, 경쟁은 두 사람과 하나의 직함으로 좁혀졌습니다. 무함마드 빈 나이프는 내무부, 대테러 업무, 그리고 워싱턴의 신뢰를 쥐고 있습니다. 무함마드 빈 살만은 경제, 국방 부처, 그리고 아버지의 귀를 쥐고 있으며, 이 가문에서는 언제나 그것이 더 큰 무게를 지녀 왔습니다.\n\n한 사람을 지지하여 국가를 그의 뒤에 결집시키고, 다른 한 사람을 약화시키십시오. 국왕이 후계자를 지명할 때 - 혹은 지명하지 못한 채 서거할 때 - 더 큰 지분을 가진 쪽이 그의 뒤를 이어 왕좌에 오릅니다.\n\n§Y무함마드 빈 살만:§! [?SAU_heir_mbs_share|0]%\n§Y무함마드 빈 나이프:§! [?SAU_heir_mbn_share|0]%\n\n§Y현재의 왕위 계승 예정자:§! §H[ROOT.GetSAUHeirFrontrunner]§!\n§Y국왕의 건강:§! §H[ROOT.GetSAUKingHealth]§![ROOT.GetSAUFaisalitePanelLine][ROOT.GetSAUGrievancePanelLine]"
