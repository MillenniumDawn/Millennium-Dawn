 CHI_infantry_weapons_2: "Тип 81"
 CHI_infantry_weapons_2_desc: "Тип 81 («Автомат Тип 81») — китайская штурмовая винтовка второго поколения с выбором режима огня, газоотводная, калибра 7,62×39 мм (создана на базе механизмов Калашникова и СКС), принятая на вооружение Народно-освободительной армии Китая (НОАК)."
