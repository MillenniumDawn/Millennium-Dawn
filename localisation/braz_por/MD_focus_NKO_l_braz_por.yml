 NKO_rebellion_korea_tt:0 "§RA insurreição§! de forças leais a nós na §YCoreia do Sul§! §Gcomeçará§!"
 NKO_print_money_tt:0 "§YEnviaremos moeda falsa a nossos inimigos para perturbar sua economia.§!\n"
 NKO_smuggles_drugs_abroad_tt:0 "§YAs drogas reduzirão a produtividade nas regiões de nossos inimigos!§!\n"
 NKO_technological_boost1_tt:0 "§YEstudar as tecnologias inimigas com a ajuda de nossos acordos no mercado negro.§!\n"
 NKO_international_sanctions_idea:0 "Sanções do CSNU"
 NKO_international_sanctions_idea_desc:0 "As sanções internacionais contra a Coreia do Norte visam sua economia, comércio e desenvolvimento militar em resposta às suas ambições nucleares e a preocupações com direitos humanos. Essas sanções restringem o acesso a moeda estrangeira, tecnologia avançada e recursos críticos, visando pressionar o regime à desnuclearização, ao mesmo tempo em que afetam significativamente sua população e estabilidade econômica."
 NKO_closed_nation:0 "Governo Totalitário"
 NKO_closed_nation_desc:0 "Para preservar a estabilidade da nação e manter nossa soberania nacional, restringimos completamente o acesso à internet e exercemos controle direto sobre todas as outras formas de mídia. A dissidência não pode ser tolerada."
 korea_russia.1.t:0 "Base Militar Russa"
 korea_russia.1.d:0 "O governo russo se oferece para instalar sua base militar em nosso território. Para nós, isso será uma excelente garantia de proteção contra os ataques de nossos vizinhos agressivos e, além disso, apenas melhorará nossa cooperação com a Rússia."
 korea_russia.1.a:0 "Concordamos"
 korea_russia.1.b:0 "Não Precisamos Disso."
 korea_russia.2.t:0 "Eles Aceitaram a Oferta"
 korea_russia.2.d:0 "O governo deles concordou com nossa proposta. Isso nos deixa muito felizes e ajuda a fortalecer nossa relação."
 korea_russia.2.a:0 "Bom"
 korea_russia.3.t:0 "Eles Recusaram a Oferta"
 korea_russia.3.d:0 "O governo russo recusou nossa generosa oferta. Talvez pensem melhor da próxima vez.."
 korea_russia.3.a:0 "Triste"
 korea_russia.4.t:0 "Usina Nuclear na Coreia do Norte"
 korea_russia.4.d:0 "O governo norte-coreano quer fechar um contrato com nossa Rosatom para a construção de uma usina em seu território; este é um passo importante para nós, porque não podemos dar energia nuclear a todos."
 korea_russia.4.a:0 "Construiremos uma Usina para Eles."
 korea_russia.4.b:0 "Não"
 korea_russia.5.t:0 "Usina Nuclear na Coreia do Norte"
 korea_russia.5.d:0 "O governo russo concordou em dar à Rosatom permissão para construir uma usina nuclear em nosso território; é hora de começar!."
 korea_russia.5.a:0 "O Átomo Norte-Coreano deve estar entrando numa nova era."
 korea_russia.6.t:0 "Novo Equipamento"
 korea_russia.6.d:0 "O Estado-Maior russo está pronto para abastecer nosso exército com seu mais recente equipamento 'Ratnik', que melhorará as características de combate de nossa infantaria."
 korea_russia.6.a:0 "Glória às Armas Russas e Norte-Coreanas"
 korea_russia.7.t:0 "Gasoduto Norte-Coreano"
 korea_russia.7.d:0 "A Coreia do Norte quer retomar o projeto do gasoduto coreano, mas com a estação final na própria Coreia do Norte. Isso fortalecerá a independência de recursos da Coreia em relação a outros países, e ganharemos outra alavanca de influência sobre eles."
 korea_russia.7.a:0 "É Hora de Construir um Gasoduto"
 korea_russia.7.b:0 "Este Projeto Não É Lucrativo para Nós"
 korea_russia.8.t:0 "Tratado de Parceria Estratégica Abrangente"
 korea_russia.8.d:0 "A Coreia do Norte foi criada pela União Soviética há muito tempo e foi apoiada por ela até seu colapso, mas agora que a política externa da Rússia mudou, a Coreia já não esperava nossa ajuda, mas as circunstâncias atuais os forçaram a recorrer a nós novamente."
 korea_russia.8.a:0 "Assinaremos um Novo Tratado"
 korea_russia.8.b:0 "Não"
 korea_russia.9.t:0 "Tratado de Parceria Estratégica Abrangente"
 korea_russia.9.d:0 "A Rússia concordou em assinar o acordo que lhe propusemos. Talvez agora o equilíbrio de poder na península coreana mude a nosso favor!"
 korea_russia.9.a:0 "Viva"
 korea_russia.10.t:0 "Tratado de Parceria Estratégica Abrangente"
 korea_russia.10.d:0 "A Rússia concordou em assinar o acordo que lhe propusemos. Talvez agora o equilíbrio de poder na península coreana mude a nosso favor!"
 korea_russia.10.a:0 "Viva"
 korea_russia.11.t:0 "Tratado de Parceria Estratégica Abrangente"
 korea_russia.11.d:0 "A Coreia do Norte foi criada pela União Soviética há muito tempo e foi apoiada por ela até seu colapso, mas agora que a política externa da Rússia mudou, a Coreia já não esperava nossa ajuda, mas as circunstâncias atuais os forçaram a recorrer a nós novamente."
 korea_russia.11.a:0 "Assinaremos um Novo Tratado"
 korea_russia.11.b:0 "Não"
 korea_russia.12.t:0 "Tratado de Parceria Estratégica Abrangente"
 korea_russia.12.d:0 "A Coreia do Norte concordou em assinar o acordo que lhe propusemos. Talvez agora o equilíbrio de poder na península coreana mude a nosso favor!"
 korea_russia.12.a:0 "Viva"
 korea_russia.13.t:0 "Tratado de Parceria Estratégica Abrangente"
 korea_russia.13.d:0 "A Coreia do Norte concordou em assinar o acordo que lhe propusemos. Talvez agora o equilíbrio de poder na península coreana mude a nosso favor!"
 korea_russia.13.a:0 "Viva"
 korea_russia.14.t:0 "A Coreia do Norte Propõe um Projeto Naval Conjunto"
 korea_russia.14.d:0 "O governo norte-coreano propõe criar um projeto conjunto no campo da marinha. A marinha norte-coreana possui atualmente apenas navios muito obsoletos, que não permitirão que sua frota ofereça forte resistência ao inimigo em caso de guerra. Eles nos pediram que patrocinássemos a criação de um projeto naval conjunto para atender às necessidades da Marinha norte-coreana."
 korea_russia.14.a:0 "Vamos Ajudá-los"
 korea_russia.14.b:0 "Não"
 korea_russia.15.t:0 "Projeto Naval Conjunto com a Rússia"
 korea_russia.15.d:0 "O governo russo concordou em criar um projeto conjunto no campo da marinha para ajudar nossa flotilha tecnicamente fraca; somos imensamente gratos a eles!"
 korea_russia.15.a:0 "Urraaaaaa"
 korea_russia.16.t:0 "[NKO.GetNameWithFlag] Quer Expandir o Comércio"
 korea_russia.16.d:0 "O governo norte-coreano quer firmar um acordo comercial conosco e pretende ampliar a cooperação com nosso país; talvez valha a pena ser cético quanto a isso, dado como é a Coreia do Norte, ou talvez não."
 korea_russia.16.a:0 "Concordamos"
 korea_russia.16.b:0 "Não"
 korea_russia.17.t:0 "Acordo Comercial com [FROM.GetName]"
 korea_russia.17.d:0 "O governo deles concordou em expandir o comércio conosco, acrescentando novos acordos que lhes oferecemos para assinar. Nossa luta contra a influência das sanções continua!"
 korea_russia.17.a:0 "Ótimo"
 korea_russia.18.t:0 "Acordo Comercial com [FROM.GetName]"
 korea_russia.18.d:0 "O governo deles recusou-se a expandir o volume de comércio entre os países e, em princípio, mostrou-se cético quanto a ampliar a cooperação conosco em qualquer área."
 korea_russia.18.a:0 "Triste"
 korea_russia.19.t:0 "A Coreia do Norte Propõe um Projeto Conjunto"
 korea_russia.19.d:0 "O governo norte-coreano está interessado em nossa indústria de aviação militar e quer criar um projeto conjunto para desenvolver um caça norte-coreano para as necessidades de seu exército. Podemos ajudá-los nisso, mas em troca fortaleceremos seriamente nossa influência sobre o país deles."
 korea_russia.19.a:0 "Vamos Ajudá-los"
 korea_russia.19.b:0 "Não"
 korea_russia.20.t:0 "Projeto Conjunto de Aeronaves com a Rússia"
 korea_russia.20.d:0 "O governo russo concordou com um projeto conjunto para criar um caça próprio para nós; agora nossa flotilha aérea terá mais poder!"
 korea_russia.20.a:0 "Urraaaaaa"
 korea_russia_news.1.t:0 "A Aliança entre [NKO.GetName] e [SOV.GetName]"
 korea_russia_news.1.d:0 "Hoje, um Tratado de Parceria Estratégica Abrangente foi assinado entre [NKO.GetName] e [SOV.GetName], envolvendo assistência econômica, política e militar entre os dois países. Parece que as duas nações agora estão mais próximas do que nunca."
 korea_russia_news.1.a:0 "Que nos temam!"
 korea_russia_news.1.b:0 "Um desenvolvimento interessante."
 korea_china.1.t:0 "A Coreia do Norte Propõe um Projeto Conjunto de Aeronaves"
 korea_china.1.d:0 "O governo norte-coreano está interessado em nossa indústria de aviação militar e quer criar um projeto conjunto para desenvolver um caça norte-coreano para as necessidades de seu exército. Podemos ajudá-los nisso, mas em troca fortaleceremos seriamente nossa influência sobre o país deles."
 korea_china.1.a:0 "Vamos Ajudá-los"
 korea_china.1.b:0 "Não"
 korea_china.2.t:0 "Projeto Conjunto de Aeronaves com a China"
 korea_china.2.d:0 "O governo chinês concordou com um projeto conjunto para criar um caça próprio para nós; agora nossa flotilha aérea terá mais poder!"
 korea_china.2.a:0 "Bom"
 korea_china.3.t:0 "Eles Recusaram a Oferta"
 korea_china.3.d:0 "O governo chinês recusou nossa generosa oferta. Talvez pensem melhor da próxima vez.."
 korea_china.3.a:0 "Triste"
 korea_china.4.t:0 "A Coreia do Norte Pede Proteção"
 korea_china.4.d:0 "O governo norte-coreano nos pediu que garantíssemos a independência de seu país, pois eles se sentem ameaçados por uma situação política tão difícil no país."
 korea_china.4.a:0 "Vamos Ajudá-los"
 korea_china.4.b:0 "Não"
 korea_china.5.t:0 "Pedido de Proteção à China"
 korea_china.5.d:0 "O Governo chinês concordou em nos oferecer garantias de nossa independência. Isso aliviará significativamente nossa situação política."
 korea_china.5.a:0 "Bom"
 korea_china.6.t:0 "Pedido de Proteção à China"
 korea_china.6.d:0 "O governo chinês recusou nossa generosa oferta. Talvez pensem melhor da próxima vez.."
 korea_china.6.a:0 "Triste"
 korea_china.7.t:0 "Ajuda na Busca de Recursos"
 korea_china.7.d:0 "O governo norte-coreano nos pede assistência em vários projetos de recursos, a fim de explorar novas reservas em seu território; naturalmente, graças a este acordo, fortaleceremos nossa influência sobre eles."
 korea_china.7.a:0 "Vamos Ajudá-los"
 korea_china.7.b:0 "Não"
 korea_china.8.t:0 "Ajuda na Busca de Recursos"
 korea_china.8.d:0 "O governo chinês concordou em ajudar com os projetos de busca de recursos"
 korea_china.8.a:0 "Bom"
 korea_china.9.t:0 "Novas Fábricas na Coreia do Norte"
 korea_china.9.d:0 "O governo norte-coreano está muito preocupado com sua situação econômica; os trabalhadores não têm onde trabalhar e novas fábricas são urgentemente necessárias para isso, então recorreram a nós para ajudar a resolver essa questão. Entendemos que isso ajudará a fortalecer a influência sobre o governo deles."
 korea_china.9.a:0 "Vamos Ajudá-los"
 korea_china.9.b:0 "Não"
 korea_china.10.t:0 "Novas Fábricas na Coreia do Norte"
 korea_china.10.d:0 "O governo chinês concordou em nos ajudar na construção de novas fábricas em nosso território."
 korea_china.10.a:0 "Bom"
 korea_china.11.t:0 "Bancos Nacionais na Coreia do Norte"
 korea_china.11.d:0 "O governo norte-coreano está preocupado com a situação econômica do país e busca qualquer meio de restaurar imediatamente a economia após os eventos passados; está convidando ativamente nossos bancos para seu país, e pretendemos dar nossa resposta."
 korea_china.11.a:0 "Vamos Ajudá-los"
 korea_china.11.b:0 "Não"
 korea_china.12.t:0 "Bancos Chineses na Coreia do Norte"
 korea_china.12.d:0 "O governo chinês permitiu que seus bancos operem em nosso país."
 korea_china.12.a:0 "Bom"
 korea_china.13.t:0 "Huawei na Coreia do Norte"
 korea_china.13.d:0 "O governo norte-coreano busca ativamente a participação da Huawei em seu país, querendo vê-la participar da economia da Coreia do Norte; este é um passo sério para nós se permitirmos que ela opere lá."
 korea_china.13.a:0 "Vamos Ajudá-los"
 korea_china.13.b:0 "Não"
 korea_china.14.t:0 "Huawei na Coreia do Norte"
 korea_china.14.d:0 "A Huawei operará em nosso território; o governo chinês aprovou uma licença para esse tipo de atividade da empresa."
 korea_china.14.a:0 "Bom"
 korea_china.15.t:0 "Nossa Base Militar na Coreia do Norte"
 korea_china.15.d:0 "Os militares norte-coreanos querem ver nossa base militar em seu território para manter a estabilidade no país em caso de um possível ataque inimigo."
 korea_china.15.a:0 "Vamos Ajudá-los"
 korea_china.15.b:0 "Não"
 korea_china.16.t:0 "Base Militar Chinesa na Coreia do Norte"
 korea_china.16.d:0 "A base militar chinesa logo estará localizada em nosso território; agora nos sentimos seguros!"
 korea_china.16.a:0 "Bom"
