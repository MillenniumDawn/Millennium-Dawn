 the_lucky_country_ast: "幸运之国"
 the_lucky_country_ast_desc: "多年来采矿业的扩张以及其他行业创新的缺乏，使我们过度依赖出口经济。如果我们想要在这里繁荣发展，我们的企业集团必须深入挖掘，攫取足够的利润。否则，就必须做出改变。"
