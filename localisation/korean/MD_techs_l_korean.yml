 module_esm_4: "전자전지원 (ESM) IV"
 module_esm_4_desc: "하이퍼 첨단 전자지원조치 체계는 고속 데이터 처리와 네트워크 센서 융합을 통합하여 정확한 위협 식별, 향상된 조기 경보, 전자전 및 전투 체계와의 강화된 협조를 가능하게 합니다.\n\n§G설계 힌트: ESM은 체력을 높이고 수상 가시성을 낮추어 탐지와 공격에 대한 생존성을 개선합니다. 가치 높은 전투함에 유용하지만 생산 비용이 증가하며 마이크로칩이 필요합니다.§!"
 module_esm_5: "전자전지원 (ESM) V"
 module_esm_5_desc: "울트라 첨단 전자지원조치 체계는 고속 데이터 처리와 네트워크 센서 융합을 통합하여 정확한 위협 식별, 향상된 조기 경보, 전자전 및 전투 체계와의 강화된 협조를 가능하게 합니다.\n\n§G설계 힌트: ESM은 체력을 높이고 수상 가시성을 낮추어 탐지와 공격에 대한 생존성을 개선합니다. 가치 높은 전투함에 유용하지만 생산 비용이 증가하며 마이크로칩이 필요합니다.§!"
 module_sub_esm_4: "전자전지원 (ESM) IV"
 module_sub_esm_4_desc: "하이퍼 첨단 전자지원조치 체계는 고속 데이터 처리와 네트워크 센서 융합을 통합하여 정확한 위협 식별, 향상된 조기 경보, 전자전 및 전투 체계와의 강화된 협조를 가능하게 합니다.\n\n§G설계 힌트: 잠수함 ESM은 체력을 높이고 잠수함 가시성을 낮추어 생존성과 은밀성을 개선합니다. 적 센서 부근에서 활동하는 잠수함에 유용하지만 생산 비용이 증가하며 마이크로칩이 필요합니다.§!"
 module_sub_esm_5: "전자전지원 (ESM) V"
 module_sub_esm_5_desc: "울트라 첨단 전자지원조치 체계는 고속 데이터 처리와 네트워크 센서 융합을 통합하여 정확한 위협 식별, 향상된 조기 경보, 전자전 및 전투 체계와의 강화된 협조를 가능하게 합니다.\n\n§G설계 힌트: 잠수함 ESM은 체력을 높이고 잠수함 가시성을 낮추어 생존성과 은밀성을 개선합니다. 적 센서 부근에서 활동하는 잠수함에 유용하지만 생산 비용이 증가하며 마이크로칩이 필요합니다.§!"
