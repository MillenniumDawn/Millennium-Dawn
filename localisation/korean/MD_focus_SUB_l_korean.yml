 kuban.1.t: "쿠반의 협력 제안"
 kuban.1.d: "쿠반은 농업 분야에서 양국 간 협력 관계를 맺고자 합니다. 그들에 따르면 이 분야에서 양국이 서로 나눌 것이 많다고 합니다. 동의하시겠습니까?"
 kuban.1.a: "물론이지!"
 kuban.1.b: "아니요"
 kuban.4.t: "벨라루스의 동의"
 kuban.4.d: "양국 간에 무역 협정이 체결되었으며, 벨라루스는 우리나라에 투자하겠다고 약속했습니다."
 kuban.4.a: "정말 훌륭한 협정이다!"
 kuban.5.t: "벨라루스의 거절"
 kuban.5.d: "그들에 따르면 이 제안에는 그들의 관심을 끌 만한 것이 없다고 합니다."
 kuban.5.a: "안타깝군"
 kuban_invest.1.t: "쿠반에 대한 투자"
 kuban_invest.1.d: "쿠반이 자국에 투자해 줄 것을 요청하고 있습니다. 쿠반에 투자하면 흑해 연안과 러시아 국경 지대에서 우리의 영향력을 강화할 수 있습니다."
 kuban_invest.1.a: "알겠다"
 kuban_invest.1.b: "아니요"
 kuban_invest.2.t: "그들의 동의"
 kuban_invest.2.d: "그들이 우리나라에 투자하기로 동의했습니다."
 kuban_invest.2.a: "좋다."
 kuban_invest.3.t: "그들의 거절"
 kuban_invest.3.d: "그들은 우리의 제안이 수익성이 없다는 구실로 우리나라에 대한 투자를 거절했습니다."
 kuban_invest.3.a: "안타깝군"
 kuban_invest.4.t: "미국의 쿠반 투자"
 kuban_invest.4.d: "쿠반이 우리 기업들에 자국 경제에 투자할 것을 제안하고 있습니다. 그 대가로 우리는 영향력을 얻고 장기적으로 쿠반과의 관계를 발전시킬 수 있습니다."
 kuban_invest.4.a: "누가 돈이라고 했지?"
 kuban_invest.4.b: "아니요"
 kuban_invest.5.t: "미국의 동의"
 kuban_invest.5.d: "미국 기업들이 이미 우리 경제에 대한 투자 계획을 수립하기 시작했습니다."
 kuban_invest.5.a: "쿠반에는 민주주의가 조금 필요하다."
 kuban_invest.6.t: "미국의 거절"
 kuban_invest.6.d: "미국이 우리 경제에 대한 투자를 거절했습니다. 그들은 우리 정치 체제의 신뢰성과 투명성을 믿지 않습니다."
 kuban_invest.6.a: "그렇다면 러시아에 연락하겠다"
 kuban_invest.7.t: "러시아의 쿠반 투자"
 kuban_invest.7.d: "쿠반이 자국 경제에 투자해 줄 것을 요청하고 있습니다. 그들에 따르면 투자 환경이 우호적이며 우리의 투자가 이를 전 세계에 보여 줄 수 있다고 합니다."
 kuban_invest.7.a: "물론이지"
 kuban_invest.7.b: "돈은 없으니 알아서 버텨라."
 kuban_invest.8.t: "러시아의 동의"
 kuban_invest.8.d: "러시아가 우리 경제에 투자하기로 동의했습니다. 러시아의 주요 기업들이 이미 우리 영토에 투자 사업을 추진할 의사를 보이고 있습니다."
 kuban_invest.8.a: "러시아는 우리의 신성한 강국, 러시아는 우리의 사랑하는 조국"
 kuban_invest.9.t: "러시아의 거절"
 kuban_invest.9.d: "그들에 따르면 현재 우리에게 투자 패키지를 배정할 자금이 충분하지 않다고 합니다."
 kuban_invest.9.a: "안타깝군"
 kuban_invest.10.t: "지하철 건설 자금을 제공하는 튀르키예 투자자"
 kuban_invest.10.d: "한 튀르키예 투자자가 크라스노다르 지하철 건설 자금을 제공하겠다고 제안하고 있습니다. 그의 자금으로 지하철을 건설할 수도 있고, 그를 속여 횡령할 수도 있으나, 이는 튀르키예와의 관계 악화로 이어질 수 있습니다."
 kuban_invest.10.b: "쿠반에는 돈이 필요하다!"
 kuban_invest.11.t: "우리를 속인 쿠반"
 kuban_invest.11.d: "쿠반의 사기꾼 일당이 지하철 건설 계획을 조작하여 우리가 마련해 준 자금을 모두 가로챘습니다."
 kuban_invest.11.a: "나쁜 놈들"
 kuban_invest.12.t: "갈리츠키의 투자"
 kuban_invest.12.d: "세르게이 갈리츠키는 러시아의 기업가이자 공인으로, 최대 소매 체인인 마그니트의 창업자이며 2018년까지 공동 소유주였습니다. 이번 천년이 시작된 이래 그는 크라스노다르와 크라스노다르 지방에 적극적으로 투자해 왔습니다. 그의 덕분에 크라스노다르 경기장, 그의 이름을 딴 공원, 크라스노다르 축구 클럽 아카데미를 비롯한 수십 곳의 공원과 건물이 건설되었습니다. 그는 러시아 연방 시민으로서 명예 증서를 수여받았습니다."
 kuban_invest.12.a: "정말 감사합니다, 세르게이!"
 kuban_invest.10.a: "크라스노다르에는 지하철이 필요하다!"
 kuban.15.t: "아디게야 문제"
 kuban.15.d: "쿠반 대표단이 아디게야 공화국을 자신들의 구성에 포함해 줄 것을 요청하고 있습니다. 그들에 따르면 이 지역은 우리보다 자신들이 관리하기가 더 쉬우며, 아디게야를 자신들의 체제 안에서 발전시키고 유지할 자금과 계획이 있다고 합니다."
 kuban.15.a: "아디게야는 쿠반이다."
 kuban.15.b: "우리 스스로도 꽤 잘 운영하고 있다."
 kuban.16.t: "아디게야를 넘겨준 러시아"
 kuban.16.d: "러시아 대표단이 아디게야 공화국을 우리에게 넘기기로 동의했습니다. 그들은 우리가 협상 중에 약속한 모든 것을 이행하기를 기대하고 있습니다."
 kuban.16.a: "좋아"
 kuban.17.t: "러시아의 거절"
 kuban.17.d: "그들은 그러한 결정이 다른 지역의 분리주의와 불만을 키울 것을 우려하여 아디게야를 넘겨주기를 거절했습니다."
 kuban.17.a: "실망스러운 좌절이다."
 kuban.14.t: "선거에서 승리한 콘드라티예프"
 kuban.14.d: "알렉산드르 트카체프의 오랜 집권 시대가 끝나고 베니아민 콘드라티예프가 쿠반의 새 수장이 됩니다. 그는 다른 정당의 가장 가까운 경쟁자들을 압도적인 격차로 물리쳤으며, 쿠반과 그 주민들의 삶에 새로운 시대가 열렸음을 알렸습니다."
 kuban.14.a: "좋아"
 kuban.18.t: "아디게야 문제"
 kuban.18.d: "쿠반이 아디게야를 자신들의 통제 아래 둘 것을 요청하고 있습니다. 그들에 따르면 이 지역을 더 잘 통제하고 지역 발전 노선을 이어 갈 수 있다고 합니다. 그 대가로 이 지역과 맞바꿀 자금과 함께 우리 기업에 대한 특혜, 우리나라에서 수입하는 상품에 대한 관세 인하를 제공할 수 있다고 하니, 우리는 이 지역을 잃더라도 쿠반에 대한 영향력을 높이고 통제를 시도할 수 있습니다."
 kuban.18.a: "이 지역을 넘겨주자"
 kuban.18.b: "아디게야는 러시아다!"
 kuban.21.t: "북캅카스 지역 문제"
 kuban.21.d: "쿠반이 북캅카스 지역들을 자신들의 통제 아래 둘 것을 요청하고 있습니다. 그들에 따르면 이 지역을 더 잘 통제하고 지역 발전 노선을 이어 갈 수 있다고 합니다. 그 대가로 이 지역과 맞바꿀 자금과 함께 우리 기업에 대한 특혜, 우리나라에서 수입하는 상품에 대한 관세 인하를 제공할 수 있다고 하니, 우리는 이 지역을 잃더라도 쿠반에 대한 영향력을 높이고 통제를 시도할 수 있습니다."
 kuban.21.a: "그들이 원하는 지역을 넘겨주자"
 kuban.21.b: "아니."
 kuban.22.t: "체첸 문제"
 kuban.22.d: "쿠반이 체첸을 자신들의 통제 아래 둘 것을 요청하고 있습니다. 그들에 따르면 이 지역을 더 잘 통제하고 지역 발전 노선을 이어 갈 수 있다고 합니다. 그 대가로 이 지역과 맞바꿀 자금과 함께 우리 기업에 대한 특혜, 우리나라에서 수입하는 상품에 대한 관세 인하를 제공할 수 있다고 하니, 우리는 이 지역을 잃더라도 쿠반에 대한 영향력을 높이고 통제를 시도할 수 있습니다."
 kuban.22.a: "이 지역을 넘겨주자"
 kuban.22.b: "체첸은 러시아다!"
 kuban.24.t: "스타브로폴 문제"
 kuban.24.d: "쿠반이 스타브로폴을 자신들의 통제 아래 둘 것을 요청하고 있습니다. 그들에 따르면 이 지역을 더 잘 통제하고 지역 발전 노선을 이어 갈 수 있다고 합니다. 그 대가로 이 지역과 맞바꿀 자금과 함께 우리 기업에 대한 특혜, 우리나라에서 수입하는 상품에 대한 관세 인하를 제공할 수 있다고 하니, 우리는 이 지역을 잃더라도 쿠반에 대한 영향력을 높이고 통제를 시도할 수 있습니다."
 kuban.24.a: "이 지역을 넘겨주자"
 kuban.24.b: "스타브로폴은 러시아다!"
 kuban.23.t: "로스토프나도누 문제"
 kuban.23.d: "쿠반이 로스토프나도누를 자신들의 통제 아래 둘 것을 요청하고 있습니다. 그들에 따르면 이 지역을 더 잘 통제하고 지역 발전 노선을 이어 갈 수 있다고 합니다. 그 대가로 이 지역과 맞바꿀 자금과 함께 우리 기업에 대한 특혜, 우리나라에서 수입하는 상품에 대한 관세 인하를 제공할 수 있다고 하니, 우리는 이 지역을 잃더라도 쿠반에 대한 영향력을 높이고 통제를 시도할 수 있습니다."
 kuban.23.a: "이 지역을 넘겨주자"
 kuban.23.b: "로스토프나도누는 러시아다!"
 kuban.19.t: "러시아의 동의"
 kuban.19.d: "러시아가 우리가 요청한 지역들을 넘겨주기로 동의했습니다. 이 지역들은 이제 공식적으로 우리의 통제 아래 있습니다."
 kuban.19.a: "훌륭해!"
 kuban.20.t: "동의하지 않은 러시아"
 kuban.20.d: "그들은 그러한 지역을 우리의 통제 아래 두는 것이 바람직하지 않다고 보며 그 결과를 우려하고 있습니다. 그들의 견해로는 이것이 자국 내 분리주의와 급진주의의 확산을 초래할 것이라고 합니다."
 kuban.20.a: "안타깝군"
 kuban.27.t: "무기 공급을 요청하는 쿠반"
 kuban.27.d: "쿠반군이 재무장을 시작했으며 최신 무기가 필요합니다. 그들은 우리에게 무기를 공급해 줄 것을 요청하고 있습니다."
 kuban.27.a: "물론이다"
 kuban.27.b: "아니요"
 kuban.28.t: "러시아의 동의"
 kuban.28.d: "러시아가 머지않아 우리에게 무기 한 묶음을 인도할 것입니다."
 kuban.28.a: "좋다"
 kuban.29.t: "러시아의 거절"
 kuban.29.d: "러시아가 우리에게 신형 무기를 공급하기를 거절했습니다. 새로운 공급처를 찾아야 합니다."
 kuban.29.a: "안타깝군"
 kuban.30.t: "카라차이-체르케시야 문제"
 kuban.30.d: "쿠반이 카라차이-체르케시야를 자신들의 통제 아래 둘 것을 요청하고 있습니다. 그들에 따르면 이 지역을 더 잘 통제하고 지역 발전 노선을 이어 갈 수 있다고 합니다. 그 대가로 이 지역과 맞바꿀 자금과 함께 우리 기업에 대한 특혜, 우리나라에서 수입하는 상품에 대한 관세 인하를 제공할 수 있다고 하니, 우리는 이 지역을 잃더라도 쿠반에 대한 영향력을 높이고 통제를 시도할 수 있습니다."
 kuban.30.a: "이 지역을 넘겨주자"
 kuban.30.b: "카라차이-체르케시야는 러시아다!"
 kuban.33.t: "투자를 요청하는 쿠반"
 kuban.33.d: "쿠반에 투자할 흥미로운 기회가 생겼습니다. 이를 통해 이 지역에서 우리의 입지를 높이고 러시아를 약화시킬 수 있습니다."
 kuban.33.a: "그렇게 하자"
 kuban.33.b: "아니요"
 kuban.31.t: "우크라이나의 동의"
 kuban.31.d: "우크라이나 정부가 우리의 제안을 승인했으며 우리나라에 투자할 자금을 이미 일부 배정했습니다. 만세!"
 kuban.31.a: "좋아"
 kuban.32.t: "우크라이나의 거절"
 kuban.32.d: "우크라이나가 우리에 대한 투자를 거부했습니다. 그들의 견해로는 우리나라에 투자에 우호적인 환경이 갖춰져 있지 않다고 합니다."
 kuban.32.a: "안타깝군"
 kuban.34.t: "무기 공급을 요청하는 쿠반"
 kuban.34.d: "쿠반군이 재무장을 시작했으며 최신 무기가 필요합니다. 그들은 우리에게 무기를 공급해 줄 것을 요청하고 있습니다."
 kuban.34.a: "물론이다"
 kuban.34.b: "아니요"
 kuban.35.t: "미국의 동의"
 kuban.35.d: "미국이 머지않아 우리에게 무기 한 묶음을 인도할 것입니다."
 kuban.35.a: "좋아"
 kuban.36.t: "미국의 거절"
 kuban.36.d: "그들은 우리의 신뢰성을 믿지 못하기 때문에 우리에게 무기를 주려 하지 않습니다."
 kuban.36.a: "안타깝군"
 kuban.37.t: "쿠반의 지위 문제"
 kuban.37.d: "지난 수년간 쿠반에서는 친우크라이나 정서가 커져 왔습니다. 이제 쿠반을 우크라이나에 통합할 기회가 생겼습니다. 쿠반 국민이 공식적으로 우리의 도움을 요청하고 있습니다. 도와야 합니까?"
 kuban.37.a: "쿠반은 우크라이나다!"
 kuban.37.b: "현 상태를 유지하자"
 kuban.38.t: "우크라이나의 동의"
 kuban.38.d: "우크라이나 정부가 우리가 그들의 일부가 되겠다는 구상을 지지했습니다. 이제 우리는 우크라이나 동포들과 다시 하나가 되었습니다!"
 kuban.38.a: "우크라이나에 영광을!"
 kuban.39.t: "우크라이나의 거절"
 kuban.39.d: "우크라이나 정부가 우리를 거절했습니다. 그들의 견해로는 이는 지나치게 위험한 조치이며 지역 내 긴장을 고조시킬 것이라고 합니다."
 kuban.39.a: "안타깝군."
 kuban.40.t: "우리의 병력 배치를 요청하는 쿠반"
 kuban.40.d: "쿠반 정부가 자국 영토를 우리 군 기지로 제공할 준비가 되어 있습니다. 그들은 러시아의 침략에 맞서 스스로를 방어하도록 도와 달라고 요청하고 있습니다."
 kuban.40.a: "물론이다"
 kuban.40.b: "아니요"
 kuban.41.t: "우크라이나의 동의"
 kuban.41.d: "우크라이나군이 추가 복무를 위해 이미 크라스노다르에 도착했습니다."
 kuban.41.a: "훌륭하다."
 kuban.42.t: "쿠반 분리 문제"
 kuban.42.d: "며칠 전 쿠반이 공식적으로 우크라이나에 합류했습니다. 이는 우리가 마침내 쿠반에 대한 영향력을 잃었다는 뜻입니다. 전쟁이든 반란이든 어떤 수단을 써서라도 쿠반을 다시 우리의 통제 아래 두어야 합니다."
 kuban.42.a: "핵심 문제는 우크라이나다. 우크라이나를 파괴하자"
 kuban.42.b: "친러시아 시민들을 일으켜 세우자"
 kuban.42.c: "그들의 선택이다"
 kuban_news.1.t: "러시아군, 쿠반에서 특별 군사 작전 개시"
 kuban_news.1.d: "오늘 아침 러시아 지도자가 우크라이나의 불법적인 러시아 이탈과 쿠반 점령을 이유로 쿠반에서의 특별 군사 작전을 선언하는 성명을 발표했습니다. 크라스노다르와 예이스크 외곽에서 이미 러시아군이 목격되었습니다. 두 나라 사이 국경에서는 러시아와 우크라이나 국경 수비대 간의 교전도 벌어지고 있습니다. 긴장은 계속 고조되고 있습니다."
 kuban_news.1.o1: "유럽에서의 새로운 전쟁"
 kuban.43.t: "남러시아 지역 주민투표"
 kuban.43.d: "[FROM.GetNameWithFlag](이)가 러시아 남부 지역들의 통합 주민투표를 실시했습니다. 주민 과반수가 이 안건에 찬성표를 던졌습니다. 우리는 이 지역을 편입할 준비가 되어 있습니까?"
 kuban.43.a: "예"
 kuban.43.b: "아니요"
 kuban.44.t: "돈바스 주민투표"
 kuban.44.d: "[FROM.GetNameWithFlag](이)가 돈바스의 통합 주민투표를 실시했습니다. 주민 과반수가 이 안건에 찬성표를 던졌습니다. 우리는 이 지역을 편입할 준비가 되어 있습니까?"
 kuban.44.a: "예"
 kuban.44.b: "아니요"
 kuban.45.t: "남러시아 지역 주민투표"
 kuban.45.d: "연방 정부가 남러시아 지역들의 우리 체제 편입을 승인했습니다."
 kuban.45.a: "좋군"
 kuban.46.t: "남러시아 지역 주민투표"
 kuban.46.d: "우크라이나 정부가 돈바스의 우리 체제 편입을 승인했습니다."
 kuban.46.a: "좋군"
 kuban.47.t: "거부된 우리의 요청"
 kuban.47.d: "그들은 우리가 제안한 지역들에서의 주민투표 실시를 거부했습니다."
 kuban.47.a: "안타깝군."
 kuban.48.t: "쿠반, 나토 가입 희망"
 kuban.48.d: "쿠반은 오랫동안 민주주의의 길을 걸어왔으며 우리와 함께 이를 수호하고자 합니다. 쿠반 정부는 나토 가입을 위한 모든 조건을 충족했으며 가입을 신청했습니다. 이를 받아들이시겠습니까?"
 kuban.48.a: "동의한다."
 kuban.48.b: "거절한다."
 kuban.49.t: "나토에 가입하는 우리"
 kuban.49.d: "우리의 가입 신청이 승인되어 이제 우리는 전 세계의 민주주의를 수호할 준비가 된 이 위대한 동맹의 일원이 되었습니다!"
 kuban.49.a: "만세!"
 KUB_unite_adyg: "아디게야"
 KUB_unite_adyg_united_russia: "아디게야"
 KUB_terskaya_sr: "테르스카야 소비에트 공화국"
 KUB_rostov_sr: "돈 소비에트 공화국"
 KUB_chechnya_sr: "체첸"
 KUB_economy_start: "쿠반 경제"
 KUB_economy_start_desc: "90년대의 참상 이후 우리 경제는 쇠퇴하고 있으며, 농업은 파괴되었고, 사람들은 휴가를 떠나지 않으며, 소득은 사실상 없고, 부패와 갱단의 횡포는 극에 달해 있습니다. 우리는 이 상황을 체계적으로 바꿔야 합니다."
 KUB_invest_tourism: "관광 부문 투자"
 KUB_invest_tourism_desc: "관광업은 쿠반 경제에서 가장 수익성이 높고 중요한 부문 중 하나입니다. 이 산업을 복구하여 다시 흑해 연안의 으뜸가는 휴양지가 되어야 합니다!"
 KUB_restore_hotel_resorts: "호텔 및 리조트 재건"
 KUB_restore_hotel_resorts_desc: "현재 우리 호텔 대부분은 소련 시절에 지어져 지금은 형편없는 상태입니다. 새로 지을 자금이 없으므로, 적절하고 정상적인 상태로 되돌려 놓아야 합니다."
 KUB_krasnodar_airbase: "크라스노다르 공항"
 KUB_krasnodar_airbase_desc: "크라스노다르처럼 크고 빠르게 성장하는 도시에는 자체 공항이 반드시 필요합니다. 남부의 수도에는 자체 공항이 있어야 합니다."
 KUB_dzhubga_sochi_highway: "주브가-소치 고속도로"
 KUB_dzhubga_sochi_highway_desc: "현재의 주브가-소치 고속도로는 급커브로 이루어져 있고 대부분 마을과 산지를 지나기 때문에 이동 시간이 크게 늘어납니다. 인구 밀집 지역을 지나지 않고 급커브도 많지 않은 유료 도로를 건설해야 합니다."
 KUB_preparation_olymic_games: "소치 올림픽 준비"
 KUB_preparation_olymic_games_desc: "2007년에 소치가 2014년 동계 올림픽을 개최한다고 발표되었습니다. 이러한 대규모 행사를 위해 우리 지역을 정상적인 상태로 끌어올려야 합니다."
 KUB_impove_don_highway: "M-4 돈 고속도로 보수"
 KUB_impove_don_highway_desc: "M-4 돈 고속도로는 중부 러시아와 남부 러시아를 잇는 가장 중요한 교통 동맥이지만 그 상태는 만족스럽지 못합니다. 새로운 세계 표준에 맞춰 도로를 현대화해야 합니다."
 KUB_restore_krasnya_polyana_resort: "크라스나야 폴랴나"
 KUB_restore_krasnya_polyana_resort_desc: "크라스나야 폴랴나 리조트는 소치의 에스토사독 마을에 있는 사계절 \\"리조트 타운\\"입니다. 2014년 소치 올림픽을 위해 건설되었으며 현재는 남부 러시아 전역에서 가장 인기 있는 휴양지 중 하나입니다."
 KUB_tourism_hub: "관광 거점"
 KUB_tourism_hub_desc: "마침내 쿠반은 이제 여러 나라 사람들이 찾는 관광 중심지가 되었습니다. 바다와 산, 이 모든 것을 사람들은 우리 쿠반에서 볼 수 있습니다."
 KUB_invest_farms: "농장 투자"
 KUB_invest_farms_desc: "우리 지역 농민들을 도움으로써 우리는 그들을 부양하고 그들의 노고에 대한 지지와 감사를 표합니다."
 KUB_support_locals: "지역 생산자 지원"
 KUB_support_locals_desc: "외국 제품을 사들이는 대신 우리가 직접 생산해야 합니다. 안락한 식량 재배에 필요한 모든 것이 있는데 다른 무엇이 필요하겠습니까."
 KUB_kuban_natural_prod: "쿠반 천연 식품"
 KUB_kuban_natural_prod_desc: "쿠반은 예로부터 맛있고 천연 그대로인 식품으로 유명했습니다. 그러나 90년대 위기 동안 그러한 명성은 사라졌습니다. 이제 그것을 되찾을 때입니다."
 KUB_update_transport_for_farms: "벨라루스와의 협력"
 KUB_update_transport_for_farms_desc: "벨라루스와 쿠반은 농업에 대한 애정으로 유명합니다. 이제 양국이 협력을 시작할 때가 되지 않았습니까?"
 KUB_update_oil_infr_desc: "석유 역시 쿠반 경제의 중요한 부문입니다. 이제 석유 인프라를 현대화할 때입니다."
 KUB_update_oil_infr: "석유 인프라 개선"
 KUB_novorossysk_port_exp: "노보로시스크 항만 확장"
 KUB_novorossysk_port_exp_desc: "노보로시스크 항만은 흑해 연안 전체에서 가장 크고 현대적인 항만 중 하나입니다. 그러나 한동안 정비 없이 방치되어 있었습니다. 다른 나라와의 무역을 위해 이를 복구해야 합니다."
 KUB_give_rus_depots: "러시아 기업에 유전 접근권 제공"
 KUB_give_rus_depots_desc: "러시아 기업 덕분에 우리 예산에 추가 자금을 확보할 수 있습니다."
 KUB_expand_anast_field: "아나스타시옙스코-트로이츠코예 유전 확장"
 KUB_expand_anast_field_desc: "아나스타시옙스코-트로이츠코예 유전은 크라스노다르 지방에서 가장 오래되고 큰 유전 중 하나이지만, 그곳에서 새로운 석유 매장지가 발견되었다고 합니다."
 KUB_establichment_of_KNGC: "일스키 정유소 건설"
 KUB_establichment_of_KNGC_desc: "일스키 정유소는 크라스노다르 지방에 위치한 석유 정제 기업으로, 남부 연방관구를 선도하는 석유 정제 회사 중 하나입니다. KNGK-INPZ는 탄화수소 원료의 수령, 저장, 가공과 함께 완제품의 도로 및 철도 출하를 수행합니다."
 KUB_reinforce_protection_of_oil_depots: "석유 기지 방어 강화"
 KUB_reinforce_protection_of_oil_depots_desc: "러시아-우크라이나 전쟁 중 쿠반의 석유 저장고는 여러 차례 공격을 받았으므로, 지역의 안전을 위해 드론과 미사일에 대한 방호를 강화할 필요가 있습니다."
 KUB_international_inv: "국제 투자"
 KUB_international_inv_desc: "자기 돈이 있으면 좋지만, 남의 돈을 받는 것도 나쁘지 않습니다."
 KUB_german_inv: "독일의 투자"
 KUB_german_inv_desc: "많은 독일 기업이 오랜 세월 쿠반에 투자해 왔습니다. 이제 다시 그들을 초청할 때입니다."
 KUB_chinese_inv: "중국의 투자"
 KUB_chinese_inv_desc: "최근 몇 년간 중국은 쿠반에 대한 투자에 관심을 보여 왔습니다. 이제 그들이 투자하도록 허용할 때입니다."
 KUB_russian_inv: "러시아의 투자"
 KUB_russian_inv_desc: "러시아는 언제나 쿠반에 막대한 자금을 투자해 왔습니다. 전통을 깨지 말고, 러시아를 기다립시다."
 KUB_usa_inv: "미국의 투자"
 KUB_usa_inv_desc: "미국은 세계 최대의 경제 대국이며 우리 지역에 대한 투자에도 관심이 있습니다."
 KUB_krasnodar_metro_case: "크라스노다르 지하철 사건"
 KUB_krasnodar_metro_case_desc: "2020년, 크라스노다르 출신의 한 무리가 지하철 건설을 구실로 튀르키예 투자자에게서 자금을 받아 낸 뒤 나중에 자기들끼리 나눠 가졌습니다."
 KUB_galitsky_inv: "갈리츠키의 투자"
 KUB_galitsky_inv_desc: "세르게이 갈리츠키는 최근 쿠반과 크라스노다르에 자금을 기부하는 후원자로 여겨지고 있습니다. 소치 인근 라자레프스코예에서 태어난 그는 고향을 저버리지 않았고, 오히려 번영시켰습니다."
 KUB_science: "쿠반 과학"
 KUB_science_desc: "쿠반의 교육과 과학은 90년대에 전반적으로 쇠퇴했습니다. 새로운 천년에 그 번영을 위해 가능한 모든 조건을 마련해야 합니다."
 KUB_update_universitets: "대학 시설 개선"
 KUB_update_universitets_desc: "대학은 모든 사람의 교육에서 가장 중요한 부분 중 하나입니다. 쿠반의 모든 대학에 새로운 장비를 도입해야 합니다."
 KUB_integrate_it_in_unik: "학교 교육과정에 IT 통합"
 KUB_integrate_it_in_unik_desc: "IT는 세계의 미래입니다. 나중에 앞서 나가려면 지금 투자해야 합니다."
 KUB_nauka_kubani: "나우카 쿠바니"
 KUB_nauka_kubani_desc: "나우카 0+는 2013년부터 매년 열리는 전러시아 과학 축제입니다. 이 축제의 주된 목표는 모든 연령대의 관객에게 과학을 보급하는 것입니다. 쿠반은 이 축제의 주요 개최지 중 하나입니다."
 KUB_industry: "쿠반 산업"
 KUB_industry_desc: "쿠반의 산업은 우리나라의 다른 모든 부문과 마찬가지로 쇠퇴하고 있습니다. 우리는 이를 복구해야 합니다."
 KUB_tihoretsk: "티호레츠크 기계 제작 공장"
 KUB_tihoretsk_desc: "크라스노다르 지방의 티호레츠크시에 위치한 대규모 궤도 장비 제작 기업입니다. 소련과 현대 러시아에서 가장 오래된 수송 기계 제작 기업 중 하나입니다. 산업용 기계와 철도 산업용 장비 생산을 전문으로 합니다."
 KUB_aomz: "아르마비르 시험 기계 제작 공장"
 KUB_aomz_desc: "석유 및 석유 정제 산업용 제품을 전문으로 하는 산업 기업입니다. 아르마비르에 위치해 있었습니다."
 KUB_durso: "아브라우-두르소"
 KUB_durso_desc: "아브라우-두르소 PJSC는 스파클링 와인 생산을 전문으로 하는 러시아 기업입니다. 아브라우-두르소 마을에 위치해 있습니다."
 KUB_abinsk: "아빈스크 전기 야금 공장"
 KUB_abinsk_desc: "아빈스크 전기 야금 공장 LLC(AEMP)는 러시아의 제철 기업이자 강철 제품 생산업체로, 크라스노다르 지방의 아빈스크시에 위치해 있습니다. 이 공장은 노보스탈-M 야금 지주회사의 일부입니다."
 KUB_slavaynsk_npz: "슬라뱐스크 ECO"
 KUB_slavaynsk_npz_desc: "슬라뱐스크 ECO는 석유 정제 기업으로, 쿠반 전역에서 가장 크고 현대적인 기업 중 하나입니다."
 KUB_develop_wb_ozon_ym: "온라인 상점 육성"
 KUB_develop_wb_ozon_ym_desc: "온라인 상점은 효율적이고 비용 효과가 높은 것으로 입증되었습니다. 따라서 우리 지역에서 그들이 성장하고 협력하도록 도와야 합니다."
 KUB_alexander_tkahcev: "알렉산드르 트카체프"
 KUB_alexander_tkahcev_desc: "알렉산드르 트카체프는 러시아의 정치인이자 국가 관료입니다. 크라스노다르 지방 행정 수반(주지사)(2001-2015)을 지냈습니다. 2000년 12월 알렉산드르 트카체프는 크라스노다르 지방 주지사 선거에서 82.14%의 득표율로 승리하여 4년 임기의 크라스노다르 지방 행정 수반(주지사)으로 선출되었습니다."
 KUB_anti_cor_fight: "비셀콥스키 농업 복합기업"
 KUB_anti_cor_fight_desc: "N.I. 트카체프 농업 복합기업은 농지 면적, 우유, 설탕, 육류 생산량에서 러시아를 선도하는 기업 중 하나인 러시아 농공 기업입니다. 알렉산드르 트카체프 일가가 소유하고 있으며, 그는 자신의 부패한 자산을 이 농업 복합기업의 자산으로 위장했습니다."
 KUB_strenght_political_power: "정치권력 강화"
 KUB_strenght_political_power_desc: "새로운 쿠반에는 강력한 지도자가 필요합니다. 따라서 쿠반에 수립된 현 체제의 정치권력을 강화할 필요가 있습니다."
 KUB_kuban_medi_edro: "쿠반 의료 재건"
 KUB_kuban_medi_edro_desc: "90년대 쿠반의 의료는 끔찍한 시기를 겪었습니다. 의사들은 떠났고, 의약품은 부족했으며, 사람들은 계속 병들었습니다. 이제 우리 의료 문제를 해결해야 할 때입니다."
 KUB_kuban_fight_bandi: "비적 소탕"
 KUB_kuban_fight_bandi_desc: "90년대에 쿠반에서는 비적 행위가 빈번한 현상이 되었습니다. 연방 도로에서 사람들이 살해당하고 강탈당했습니다. 이제 이러한 쓰레기 같은 행태를 끝내고 쿠반을 찾는 사람들의 안전을 보장해야 합니다."
 KUB_economic_revival: "경제 회복"
 KUB_economic_revival_desc: "90년대의 충격 이후, 우리는 경제를 점진적으로 재건해야 합니다."
 KUB_cooperation_with_edro: "통합 러시아와의 협력"
 KUB_cooperation_with_edro_desc: "통합 러시아는 러시아의 정당이자 러시아 연방 최대 규모의 정당입니다. 향후의 협력을 도모하기 위해 지금이야말로 이 당과 손을 잡을 적기입니다."
 KUB_accessible_environment: "국가 프로젝트 접근 가능한 환경"
 KUB_accessible_environment_desc: "접근 가능한 환경은 장애인과 이동이 불편한 시민들의 삶을 더 편하게 하고, 이들이 사회에 최대한 통합될 수 있도록 하기 위해 마련된 정부 프로그램입니다."
 KUB_kuban_education: "쿠반 교육"
 KUB_kuban_education_desc: "교육은 모든 국가의 가장 중요한 제도 중 하나입니다. 우리나라도 이를 고민해야 합니다."
 KUB_russian_mobile: "러시아 이동통신사"
 KUB_russian_mobile_desc: "러시아 이동통신사와 그들의 투자 덕분에, 많은 투자 없이도 인터넷 인프라를 빠르게 발전시킬 수 있습니다."
 KUB_new_krasnodar: "신 크라스노다르"
 KUB_new_krasnodar_desc: "신 크라스노다르는 남부 러시아 전체의 미래 남부 수도입니다. 이곳은 꿈의 도시이자 모두가 행복할 수 있는 곳이며 필요한 모든 인프라가 갖춰질 것입니다. 장차 거대 도시가 될 이곳의 모든 주민의 이익을 위해 무언가와 누군가는 희생되어야 할 것입니다."
 KUB_hotels_residents_building: "신규 호텔 및 주거 단지 건설"
 KUB_hotels_residents_building_desc: "새로운 관광객과 투자자를 유치하기 위해 새롭고 현대적이며 쾌적한 호텔과 주거 시설을 건설해야 합니다."
 KUB_kondratiev: "베니아민 콘드라티예프"
 KUB_kondratiev_desc: "베니아민 콘드라티예프는 러시아의 정치인입니다. 2015년 4월 22일 러시아 대통령령에 따라 알렉산드르 트카체프의 후임으로 크라스노다르 지방 행정 수반(주지사) 직무대행에 임명되었습니다."
 KUB_kuban_for_kubans: "쿠반인을 위한 쿠반"
 KUB_kuban_for_kubans_desc: "수천 년 동안 쿠반은 언제나 쿠반인의 땅이었습니다. 우리에게 다른 나라에서 온 이주민은 필요 없습니다. 우리에게 필요한 것은 우리의 땅과 우리의 국민입니다!"
 KUB_filtration_for_imigrants: "이주민 선별 수용소"
 KUB_filtration_for_imigrants_desc: "최근 우리 지역으로 많은 이주민이 유입되고 있으므로, 이들을 위한 특별 수용소를 설치해야 합니다. 그곳에서 이들의 적응력과 정신 상태를 검사한 뒤에야 우리 영토에 들여보낼 것입니다."
 KUB_police_control: "경찰 통제 강화"
 KUB_police_control_desc: "모든 것이 통제되고 있음을 보장하려면 이주민에 대한 경찰의 통제를 강화해야 합니다. 그래야 우리 주민이 안전할 수 있습니다."
 KUB_special_military_operation: "특별 군사 작전"
 KUB_special_military_operation_desc: "우크라이나는 자신만의 길을 택했습니다. 잘못된 길을 말입니다. 이를 바로잡을 때가 왔습니다! 브페룟, 크 포베데!"
 KUB_air_defence: "방공 강화"
 KUB_air_defence_desc: "계속되는 러시아-우크라이나 전쟁으로 인해 우크라이나군이 쿠반의 기반시설을 공격하기 시작했습니다. 우리 주민과 핵심 기반시설의 안전을 위해 우리 지역의 방공 전력을 강화해야 합니다."
 KUB_invite_cossaks: "특별 군사 작전에 참여하는 카자크"
 KUB_invite_cossaks_desc: "카자크는 호전적인 민족입니다. 따라서 특별 군사 작전의 목표를 달성하기 위해 이들이 의용 대대에 가담하도록 선동할 수 있습니다."
 KUB_port_security: "항만 방어 강화"
 KUB_port_security_desc: "우크라이나군은 수중 드론으로 유조선, 군함과 민간 선박은 물론 일반 항구까지 공격하고 있습니다. 우리의 해상 기반시설에 대한 통제와 방어를 강화해야 합니다."
 KUB_bars_batalions: "BARS 대대"
 KUB_bars_batalions_desc: "BARS-13 부대는 러시아의 특별 군사 작전에 가장 먼저 참여한 부대 중 하나이며, 러시아 연방 국방부 산하의 의용 대대입니다. BARS는 국가 전투 예비군(Battle Army Reserve of the Country)의 약자입니다."
 KUB_bars_batalions_expansion: "BARS 훈련소 확장"
 KUB_bars_batalions_expansion_desc: "BARS에 입대하려는 지원자가 많아 질 높은 지원자 훈련에 필요한 기반시설이 부족합니다. 따라서 전선에서 추가적인 문제가 생기지 않도록 최대한 빨리 기반시설을 확장해야 합니다."
 KUB_terek_batalion: "테레크"
 KUB_terek_batalion_desc: "테레크는 테레크 카자크군의 깃발 아래 창설된 카자크 대대입니다. 이 부대는 카자크와 예비역 시민, 그리고 러시아군에서 복무한 적이 없는 사람들로 구성되어 있습니다."
 KUB_cossak_batalion_yenisey: "예니세이 카자크 대대"
 KUB_cossak_batalion_yenisey_desc: "정찰 카자크 대대 예니세이는 의용 대대입니다. 체첸, 아프가니스탄, 시리아 작전의 참전 용사들이 이곳에서 복무하고 있습니다."
 KUB_kuban_batalion: "쿠반 대대"
 KUB_kuban_batalion_desc: "의용 부대 쿠반(BARS-16)은 러시아와 쿠반의 동원된 시민들로 구성된 부대입니다. BARS 부대 중 가장 큰 부대 중 하나입니다."
 KUB_don: "돈 대대"
 KUB_don_desc: "돈 대대는 특별 군사 작전에 첫날부터 참여해 온 카자크 대대입니다."
 KUB_chepega_batalion: "아타만 자하리 체페가 기념 카자크 대대"
 KUB_chepega_batalion_desc: "BARS 의용 부대 소속의 아타만 자하리 체페가 기념 카자크 대대는 흑해 카자크군의 저명한 카자크 아타만이자 러시아군 소장으로서 러시아-튀르크 전쟁에 적극 참여한 인물을 기려 명명되었습니다."
 KUB_national_debt: "국가 부채 감축"
 KUB_national_debt_desc: "막대한 국가 부채가 우리 지역의 발전을 가로막고 있습니다. 부채를 줄이기 시작해야 합니다."
 KUB_factories: "낡은 공장 복구"
 KUB_factories_desc: "우리에게는 필요한 제품을 생산할 수 있는 공장이 많이 있습니다. 하지만 안타깝게도 그 상태가 형편없습니다. 이 상황을 바로잡아야 합니다."
 KUB_industrial_policy: "쿠반 산업정책부"
 KUB_industrial_policy_desc: "쿠반 산업정책부는 쿠반 경제의 주요 부문 중 하나인 이 지역 산업의 지속 가능한 발전을 보장하기 위해 2021년에 설립되었습니다."
 KUB_remember_no_english: "외국어 간판 퇴치"
 KUB_remember_no_english_desc: "우리에게 외국어는 필요 없습니다. 러시아어만 쓰십시오!"
 KUB_rzd: "RZD와의 계약"
 KUB_rzd_desc: "러시아 철도와의 협력 관계는 더욱 커져야 합니다."
 KUB_republic_status: "새로운 공화국 지위"
 KUB_republic_status_desc: "쿠반은 상당히 독립적이고 산업화된 지역이 되었습니다. 러시아 연방의 지역 체계 안에서 쿠반의 위상을 높여야 합니다."
 KUB_adygea_que: "아디게야 문제"
 KUB_adygea_que_desc: "아디게야는 우리로부터 불법적으로 분리해 나간 쿠반의 영토입니다. 어떤 수단을 써서라도 되찾아야 합니다. 공격이든 주민투표든 상관없지만, 아디게야는 오직 우리의 것입니다!"
 KUB_molkino_training_center: "몰키노 훈련 센터"
 KUB_molkino_training_center_desc: "몰키노에 있는 PMC 바그너 기지는 세계에서 가장 크고 현대적인 이 회사의 기지입니다. 이곳을 우리 병사와 장교를 훈련하는 데 활용할 수 있습니다."
 KUB_rosgvardia: "로스그바르디야 대대"
 KUB_rosgvardia_desc: "로스그바르디야는 러시아 연방 국가근위군 활동 분야, 무기 유통 분야, 민간 경비 활동 분야, 민간 탐정 활동 분야 및 부처 외 경비 분야에서 국가 정책의 수립과 시행, 규범적·법적 규제를 담당하는 연방 집행 기관입니다."
 KUB_revive_factories_agro: "신규 농업 단지 건설"
 KUB_revive_factories_agro_desc: "쿠반은 러시아의 식량 공급원이며, 이 위상을 유지하려면 우리의 농업 단지를 복구해야 합니다."
 KUB_russian_banks_edro: "러시아 은행"
 KUB_russian_banks_edro_desc: "러시아 은행들이 서서히 우리 공화국 영토에 진출하기 시작하고 있습니다."
 KUB_russian_it_companies: "러시아 IT 기업"
 KUB_russian_it_companies_desc: "얀덱스는 같은 이름의 인터넷 검색 엔진과 인터넷 포털, 웹 서비스를 여러 나라에서 운영하는 러시아의 다국적 정보 기술 기업입니다. 러시아, 벨라루스, 카자흐스탄 시장에서 가장 두드러진 위치를 차지하고 있습니다."
 KUB_army_question: "군대 문제"
 KUB_army_question_desc: "현재의 지정학적 상황을 고려할 때, 우리 정부는 군대, 또는 최소한 영토 방위대 창설 문제를 진지하게 제기해야 합니다."
 KUB_ter_def: "영토 방위대"
 KUB_ter_def_desc: "다가올 분쟁에 대비하려면 영토 방위대를 창설하는 것이 가장 좋습니다."
 KUB_army_regular: "쿠반군"
 KUB_army_regular_desc: "정규군이야말로 우리 쿠반을 안전하게 지키는 최선의 방안입니다."
 KUB_perevooryzhenie: "재가동"
 KUB_perevooryzhenie_desc: "소련 붕괴 이후 당시에는 불필요했던 군 장비가 우리 창고에 많이 남았습니다. 그러나 이제 군대가 확장되면서 품질을 가리지 않고 군 장비가 시급히 필요합니다. 따라서 우리가 직접 새 장비를 생산할 때까지 낡은 소련제 장비를 임시로 다시 투입해야 합니다."
 KUB_revive_atom_station_project: "쿠반 원자력 발전소 계획 부활"
 KUB_revive_atom_station_project_desc: "크라스노다르 원자력 발전소(모스토프스카야 원자력 발전소라고도 함)는 크라스노다르 지방 모스토프스카야 도시형 마을의 에네르게티코프 구역, 라바강 기슭에 있는 미완공 원자력 발전소입니다. 이 계획은 쿠반 전체에 전력을 공급할 예정이었으며, 이제 우리는 이를 되살려야 합니다."
 KUB_green_energy_investments: "녹색 에너지"
 KUB_green_energy_investments_desc: "녹색 에너지는 미래 세계의 기술입니다. 쿠반의 바람을 고려하면 매우 유용한 투자가 될 것입니다."
 KUB_nationalists_start: "쿠반 민족주의"
 KUB_nationalists_start_desc: "강한 쿠반은 사람들이 자신의 전통과 조상, 위업, 문화를 존중하는 자유로운 쿠반입니다. 이것이 우리가 원하는 쿠반입니다!"
 KUB_reforms_of_kuban_const: "쿠반 헌법 개혁"
 KUB_reforms_of_kuban_const_desc: "쿠반에는 새롭고 독자적이며 정직한 법이 필요합니다."
 KUB_new_kuban_gov: "새 정부"
 KUB_new_kuban_gov_desc: "새 정부는 정직하고 공정해야 하며 자국민의 이익을 위해 모든 것을 해야 합니다. 이것이 우리가 추구하는 바입니다."
 KUB_kuban_patriotism: "애국주의"
 KUB_kuban_patriotism_desc: "애국주의는 강한 국가의 가장 중요한 부분입니다. 그것 없이는 우리는 어디로도 나아갈 수 없습니다."
 KUB_kubanisation: "쿠반화"
 KUB_kubanisation_desc: "수백 년 동안 러시아의 일부로 지내면서 사람들은 자신의 뿌리와 전통을 잊었습니다. 우리는 사람들의 기억 속에 우리 과거의 기억을 되살릴 것입니다."
 KUB_new_kuban_elite: "새로운 엘리트"
 KUB_new_kuban_elite_desc: "엘리트는 자국을 생각하는 애국적인 사람들로 구성되어야 합니다. 이들은 소박하고 정직한 쿠반인이어야 합니다."
 KUB_fight_banditism: "비적 소탕"
 KUB_fight_banditism_desc: "90년대에 쿠반에서는 비적 행위가 빈번한 현상이 되었습니다. 연방 도로에서 사람들이 살해당하고 강탈당했습니다. 이제 이러한 쓰레기 같은 행태를 끝내고 쿠반을 찾는 사람들의 안전을 보장해야 합니다."
 KUB_own_currency: "독자 통화"
 KUB_own_currency_desc: "자립하는 나라에는 자체적인 강한 통화가 필요합니다. 루블 권역에서 벗어나 독자적인 통화를 발전시켜야 합니다."
 KUB_propoganda_traditional_values: "전통 가치 선전"
 KUB_propoganda_traditional_values_desc: "전통 가치는 이상적인 쿠반 사회를 건설하는 데 가장 중요한 부분입니다."
 KUB_repress_democrats: "민주주의자 탄압"
 KUB_repress_democrats_desc: "민주주의는 인민의 지배, 즉 미국 국민의 지배입니다. 우리에게 이런 거짓 언론의 자유는 필요 없습니다. 부르주아를 타도하라!"
 KUB_purge_commies: "공산주의자 숙청"
 KUB_purge_commies_desc: "공산주의자들은 20세기에 전통과 쿠반 사회를 죽였습니다. 우리는 그들을 결코 용서하지 않을 것입니다!"
 KUB_support_domestic_production: "국내 산업 지원"
 KUB_support_domestic_production_desc: "남의 제품과 상품을 사는 대신 우리 생산자를 지원해야 합니다. 쿠반 산업은 발전해야 합니다!"
 KUB_anti_migration: "반이주 정책"
 KUB_anti_migration_desc: "우리에게 이주민도, 그들의 질서도, 그들의 규칙도 필요 없습니다. 이곳은 우리의 땅이며 우리의 규칙이 적용됩니다. 마음에 들지 않으면 짐 싸서 역으로 가 쿠반을 떠나십시오!"
 KUB_fight_corruption: "부패와의 투쟁"
 KUB_fight_corruption_desc: "부패는 모든 국가를 안에서부터 무너뜨리는 악입니다. 쿠반에서 부패의 모든 징후를 근절해야 합니다."
 KUB_social_spending: "사회 지출 확대"
 KUB_social_spending_desc: "쿠반 시민은 우리 국가의 가장 중요한 부분입니다. 따라서 그들을 위해서는 한 푼도 아껴서는 안 됩니다."
 KUB_repair_roads: "도로 보수"
 KUB_repair_roads_desc: "장기간의 경제 위기 이후 우리 기반시설은 심각한 상태에 놓여 있습니다. 안타깝게도 도로도 마찬가지입니다. 전체 도로망을 가능한 한 빨리 재건해야 합니다."
 KUB_greatness_of_kuban_people: "쿠반 국민의 위대함"
 KUB_greatness_of_kuban_people_desc: "쿠반과 쿠반 국민은 수많은 고난을 겪었습니다. 그러나 이제 우리 시민들은 우리 지역에서 밝은 미래를 확신을 가지고 기대할 수 있습니다. 쿠반의 적에게는 아니오, 쿠반의 번영에는 예!"
 KUB_revival_cossak_army: "쿠반 카자크군 재건"
 KUB_revival_cossak_army_desc: "쿠반 카자크군(쿠반 카자크 부대)은 쿠반 카자크로 구성된 행정·군사 단위로, 1860년에 편성되어 1918년까지 존속했습니다. 러시아 내전 중에 쿠반 카자크는 쿠반 인민공화국을 선포했으며 남부 전역에서 핵심적인 역할을 했습니다."
 KUB_chernomortsy: "체르노모르치"
 KUB_chernomortsy_desc: "체르노모르치는 쿠반 인민공화국에서 대부분 전직 카자크로 구성된 정치 세력입니다. 경제적으로나 정치적으로 더 강했던 흑해 카자크는 우크라이나어를 쓰는 흑해 카자크를 대표했으며 친우크라이나 성향이었습니다."
 KUB_ukr_relations: "우크라이나와의 관계 발전"
 KUB_ukr_relations_desc: "우크라이나는 결코 다투어서는 안 될 우리의 형제입니다. 이제 우리의 외교 관계를 복원할 때가 되었습니다."
 KUB_drils_ukr_army: "우크라이나군과의 훈련"
 KUB_drils_ukr_army_desc: "우크라이나군은 충분한 경험을 갖추고 있어 우리 새 군대가 새로운 것을 배우는 데 도움을 줄 수 있습니다."
 KUB_eu_cooperation: "EU와의 협력"
 KUB_eu_cooperation_desc: "EU는 역사상 가장 강력한 경제 동맹입니다. 우리의 이익을 위해 그들과의 관계를 발전시켜야 합니다."
 KUB_ukr_second_lang: "우크라이나어를 새로운 국어로"
 KUB_ukr_second_lang_desc: "우크라이나어는 쿠반 방언과 계통이 이어져 있습니다. 우리 공화국의 법에 그 지위를 명시해야 합니다."
 KUB_western_companies: "서방 기업"
 KUB_western_companies_desc: "서방 기업과의 협력은 우리 경제 발전에 막대한 잠재력을 가져다줍니다. 아시다시피 동방 기업과 달리 그들은 막대한 자본을 가지고 있습니다. 그러니 그들이 우리 땅에 들어오게 하십시오!"
 KUB_nato_weapons: "나토 무기"
 KUB_nato_weapons_desc: "나토 무기는 품질과 실용성을 겸비하고 있습니다. 우리 군을 서방 무기로 재무장해야 합니다."
 KUB_ukr_investments: "우크라이나의 투자"
 KUB_ukr_investments_desc: "우크라이나의 투자는 우크라이나와의 협력을 강화하고 우리나라의 재정 상황을 개선하는 데 도움이 될 것입니다."
 KUB_referendum_joining_ukraine: "우크라이나 가입 주민투표"
 KUB_referendum_joining_ukraine_desc: "마침내! 우크라이나와 쿠반이 재통합할 때가 왔습니다. 형제 민족이 다시 한번 하나의 국가가 될 수 있습니다. 리비우에서 소치까지 제한 없이 자동차로 갈 수 있다니, 꿈만 같습니다!"
 KUB_ukr_bases_in_kuban: "쿠반 내 우크라이나 기지"
 KUB_ukr_bases_in_kuban_desc: "감정에 너무 휩쓸릴 필요는 없습니다. 우리 지역에 우크라이나 군인이 주둔하는 것만으로도 쿠반의 안보를 보장하기에 충분합니다."
 KUB_lineitsy: "리네이치"
 KUB_lineitsy_desc: "리네이치는 쿠반 인민공화국에서 대부분 전직 카자크로 구성된 정치 세력이었습니다. 리네이치는 러시아어를 쓰는 선형 카자크를 대표했으며 하나로 분할될 수 없는 러시아를 더 지향했습니다."
 KUB_russian_mobile_operators: "러시아 이동통신사"
 KUB_russian_mobile_operators_desc: "러시아 이동통신사와 그들의 투자 덕분에, 많은 투자 없이도 인터넷 인프라를 빠르게 발전시킬 수 있습니다."
 KUB_fsb: "FSB 지원"
 KUB_fsb_desc: "FSB는 우리 국가에 해를 끼치는 모든 수상한 인물을 체포하고 구금할 수 있습니다. 우리는 또한 그들의 경험에서 배울 수 있습니다."
 KUB_rzd_coop: "RZD"
 KUB_rzd_coop_desc: "러시아 철도와의 협력 관계는 더욱 커져야 합니다."
 KUB_russian_investments: "러시아의 투자"
 KUB_russian_investments_desc: "러시아의 투자는 러시아와의 협력을 강화하고 우리 지역의 재정 상황을 개선하는 데 도움이 될 것입니다."
 KUB_russian_weapons: "러시아 무기"
 KUB_russian_weapons_desc: "러시아 무기는 실용성과 물량이 핵심입니다. 우리 군을 위해 러시아 무기를 새로 한 묶음 구입해야 합니다."
 KUB_russian_legacy: "러시아의 유산"
 KUB_russian_legacy_desc: "수백 년 동안 우리는 러시아 및 러시아 국민과 떨어져 있지 않았습니다. 우리는 위대한 러시아 사회의 일부이며 언제나 함께합니다!"
 KUB_russian_banks: "러시아 은행"
 KUB_russian_banks_desc: "러시아 은행은 세계에서 가장 신뢰할 수 있고 기술적으로 앞선 은행에 속하는데, 쿠반에 초청하지 않을 이유가 있겠습니까?"
 KUB_return_adygea: "아디게야 반환"
 KUB_return_adygea_desc: "아디게야는 우리로부터 불법적으로 분리해 나간 쿠반의 영토입니다. 어떤 수단을 써서라도 되찾아야 합니다. 공격이든 주민투표든 상관없지만, 아디게야는 오직 우리의 것입니다!"
 KUB_return_karachaevo_cherkesia: "카라차이-체르케시야 반환"
 KUB_return_karachaevo_cherkesia_desc: "카라차이-체르케시야는 지리적으로 우리의 일부여야 하며, 이는 사실입니다!"
 KUB_own_way: "독자 노선"
 KUB_own_way_desc: "마침내 통일된 카자크 국가를 세우려면 대립하는 두 진영을 하나로 통합해야 합니다."
 KUB_ter_defence: "영토 방위대"
 KUB_ter_defence_desc: "다가올 분쟁에 대비하려면 영토 방위대를 창설하는 것이 가장 좋습니다."
 KUB_meet_with_regions_heads: "러시아 남부 지역 지도자 지원"
 KUB_meet_with_regions_heads_desc: "남부 지역 지도자들과 만남으로써 전쟁이 일어날 경우에 대비한 향후 행동을 조율할 수 있습니다."
 KUB_regular_army: "정규군 창설"
 KUB_regular_army_desc: "앞으로 있을 수 있는 분쟁에 대비해 강력한 정규군이 필요하며, 지금이 그것을 창설할 때입니다."
 KUB_referendum_south: "남러시아 주민투표"
 KUB_referendum_south_desc: "21세기에는 피를 흘릴 필요가 없습니다. 국민이 어떻게 행동할지 선택하는 평화적인 주민투표를 실시하기만 하면 됩니다."
 KUB_revolt_in_south: "남러시아 혁명"
 KUB_revolt_in_south_desc: "러시아가 선거를 조작한다는 것을 알고 있으므로, 그들과 협상하는 것은 무의미합니다."
 KUB_donbass_yes: "돈바스 주민투표"
 KUB_donbass_yes_desc: "21세기에는 피를 흘릴 필요가 없습니다. 국민이 어떻게 행동할지 선택하는 평화적인 주민투표를 실시하기만 하면 됩니다."
 KUB_donbass_no: "돈바스 혁명"
 KUB_donbass_no_desc: "돈바스의 카자크여, 우리 조국을 수호하기 위해 일어서라!"
 KUB_unite_all_cossaks: "카자크 공화국 수립"
 KUB_unite_all_cossaks_desc: "루한스크에서 소치까지의 코사크들은 하나된 국가에서 살아야 한다!"
 KUB_deconservatization_own_way: "재가동"
 KUB_deconservatization_own_way_desc: "소련 붕괴 이후 당시에는 불필요했던 군 장비가 우리 창고에 많이 남았습니다. 그러나 이제 군대가 확장되면서 품질을 가리지 않고 군 장비가 시급히 필요합니다. 따라서 우리가 직접 새 장비를 생산할 때까지 낡은 소련제 장비를 임시로 다시 투입해야 합니다."
 KUB_send_volunterrs: "의용병 파견"
 KUB_send_volunterrs_desc: "동맹국이 전쟁에서 승리하려면, 우리의 승리를 위해 의용 부대를 파견해야 합니다."
 KUB_democratic_start: "민주주의 쿠반"
 KUB_democratic_start_desc: "마침내 쿠반은 개인의 자유와 인권이 최우선 가치가 되는 자유로운 민주주의 국가가 될 것입니다."
 KUB_democratic_coalition: "민주 연립"
 KUB_democratic_coalition_desc: "국가를 원활하게 통치하려면 먼저 국민의 지지를 얻어야 합니다. 다른 정당과 연합하면 이를 이루는 데 도움이 될 수 있습니다."
 KUB_human_right_and_freedoms: "인권과 자유"
 KUB_human_right_and_freedoms_desc: "앞서 밝힌 바와 같이, 인권과 자유는 여전히 우리 통치의 가장 중요한 목표입니다."
 KUB_decentalisation: "분권화"
 KUB_decentalisation_desc: "국가는 우리 중앙에 매달리거나 의존해서는 안 됩니다."
 KUB_kuban_economy_system: "새로운 쿠반 경제 체제"
 KUB_kuban_economy_system_desc: "쿠반의 옛 경제 체제는 러시아에 크게 의존했습니다. 우리의 새 국가에는 독립적인 자체 체제가 필요합니다."
 KUB_free_markets: "자유 시장, 자유로운 국민"
 KUB_free_markets_desc: "자유 시장은 사람들이 자신의 재능을 추구하도록 힘을 실어 주고, 열심히 일할 자유와 기회를 가질 자유, 심지어 실패할 자유까지 부여합니다."
 KUB_fight_cor_dems: "부패와의 전쟁"
 KUB_fight_cor_dems_desc: "부패는 과거 지도부가 퍼뜨린 악입니다. 이제 이 폐단을 멈출 때가 되었습니다."
 KUB_maternity_benefits: "출산 수당"
 KUB_maternity_benefits_desc: "이러한 수당을 통해 우리 국가의 출산율과 인구 증가를 촉진할 수 있습니다."
 KUB_freedom_of_speech: "언론의 자유"
 KUB_freedom_of_speech_desc: "자유는 부자유보다 낫습니다."
 KUB_eu_integration_dems: "EU 통합"
 KUB_eu_integration_dems_desc: "유럽 연합은 역사상 가장 훌륭하고 강력한 경제 동맹입니다. 우리 자신을 위해 그들과의 협력을 발전시켜야 합니다."
 KUB_free_economic_zone: "자유 경제 구역"
 KUB_free_economic_zone_desc: "새로운 투자자를 유치하기 위해 경제 구역을 조성할 수 있습니다."
 KUB_olighars_democrats: "올리가르히 척결"
 KUB_olighars_democrats_desc: "이제 주된 권력은 올리가르히가 아니라 쿠반 국민과 소기업에 있습니다. 구체제를 타도하라!"
 KUB_police_funding: "경찰 예산 삭감"
 KUB_police_funding_desc: "경찰력을 유지하는 데 막대한 자금이 들어가고 있지만 실제로 그들은 이를 횡령하고 있을 뿐입니다. 그러니 먼저 전문성을 입증하게 한 뒤에 돈을 요구하게 하십시오."
 KUB_it_investments: "IT 투자"
 KUB_it_investments_desc: "IT 기술이 발전하는 속도를 감안하면 앞으로 IT 없이는 살아갈 수 없습니다. 따라서 이 부문에 투자할 때가 되었습니다."
 KUB_infrastructure_investments: "기반시설 투자"
 KUB_infrastructure_investments_desc: "90년대 이후 우리 기반시설은 형편없는 상태입니다. 이제는 재건할 때가 되었습니다."
 KUB_green_energy: "녹색 에너지 투자"
 KUB_green_energy_desc: "녹색 에너지는 미래 세계의 기술입니다. 쿠반의 바람을 고려하면 매우 유용한 투자가 될 것입니다."
 KUB_opening_factories: "공장 개설"
 KUB_opening_factories_desc: "공장 발전은 가까운 시일 내 쿠반 경제의 가장 중요한 과제입니다."
 KUB_cooperation_with_russia: "러시아와의 협력"
 KUB_cooperation_with_russia_desc: "우리는 러시아와 경제적, 군사적, 문화적으로 긴밀히 연결되어 있습니다. 그런데 왜 러시아와의 관계를 망쳐야 합니까?"
 KUB_rus_banks: "러시아 은행"
 KUB_rus_banks_desc: "러시아 은행들이 서서히 우리 공화국 영토에 진출하기 시작하고 있습니다."
 KUB_military_exercises_with_russia_dems: "러시아와의 군사 훈련"
 KUB_military_exercises_with_russia_dems_desc: "러시아군은 세계에서 가장 강한 군대 중 하나입니다. 그들과 훈련을 하지 않을 이유가 있겠습니까?"
 KUB_rus_academies: "러시아 군사 학교"
 KUB_rus_academies_desc: "러시아의 군사 학교는 세계 최고입니다. 러시아에 우리 학생들을 받아 달라고 요청하고 그들의 경험에서 배울 수 있습니다."
 KUB_adygea: "아디게야 문제"
 KUB_adygea_desc: "아디게야는 언제나 쿠반의 일부였습니다. 우리는 이를 돌려주어야 하지만, 주민투표를 통해 인도적으로 해야 합니다."
 KUB_anti_russia_policy: "반러시아 정책"
 KUB_anti_russia_policy_desc: "러시아는 침략자이며 그들과의 협력은 좋은 결과로 이어지지 않을 것입니다. 우리 국민을 이에 대해 설득해야 합니다."
 KUB_embargor_russia: "러시아 금수 조치"
 KUB_embargor_russia_desc: "침략자와 교역할 필요는 없습니다. 러시아의 공격적인 정책에 대해 제재를 가할 때가 되었습니다."
 KUB_nato_membership: "나토 가입 캠페인"
 KUB_nato_membership_desc: "나토는 역사상 가장 강력한 동맹입니다. 우리 시민을 보호하기 위해 가입해야 합니다."
 KUB_invite_advisors: "나토 군사 고문 초빙"
 KUB_invite_advisors_desc: "나토 고문들이 우리 군이 그들의 표준으로 더 빠르게 전환하도록 도울 것입니다."
 KUB_military_ex_nato: "나토와의 군사 훈련"
 KUB_military_ex_nato_desc: "나토와의 훈련을 통해 그들의 전술을 이해하고 동맹과의 협력을 발전시킬 수 있습니다."
 KUB_nato_membership_dems: "나토 가입 요청"
 KUB_nato_membership_dems_desc: "나토 안의 쿠반은 꿈이 아닙니다."
 KUB_kprf_start: "쿠반 소비에트 공화국 재건"
 KUB_kprf_start_desc: "쿠반은 다시 공산주의로 나아가고 있으며, 이번에는 성공할 것입니다!"
 KUB_one_party_system: "일당 체제"
 KUB_one_party_system_desc: "말 그대로 1984입니다."
 KUB_multy_party_system: "다당 체제"
 KUB_multy_party_system_desc: "과거 체제의 실수는 소련 공산당(CPSU)에 대한 대안이 없었다는 점입니다. 이번에는 모든 것이 공정하며 권력을 선택할 수 있는 가능성이 보장될 것입니다."
 KUB_support_labors: "쿠반 노동자 지원"
 KUB_support_labors_desc: "쿠반의 노동자들은 수년간 자본가와 올리가르히의 억압 아래 있었습니다. 이제 이들이 숨 쉴 수 있게 하고 필요한 지원을 제공할 때입니다."
 KUB_patriotism_commi: "애국주의"
 KUB_patriotism_commi_desc: "애국심, 우리 지역에 대한 사랑, 당과 이념에 대한 사랑을 키워야 합니다."
 KUB_olighars_commie: "올리가르히 제거"
 KUB_olighars_commie_desc: "올리가르히는 수십 년간 쿠반 국민을 억압했습니다. 이제 그들을 억압할 때가 되었습니다."
 KUB_corruption_fight: "부패와의 투쟁"
 KUB_corruption_fight_desc: "부패는 어떤 형태든 억눌러야 합니다."
 KUB_weak_banks: "은행 약화"
 KUB_weak_banks_desc: "은행들은 소련 붕괴 때 우리 지역에서 권력을 장악했습니다. 이제 그들의 권력과 우리 사회에 대한 영향력을 약화시킬 때가 되었습니다."
 KUB_social_support: "사회적 지원"
 KUB_social_support_desc: "모든 계층의 시민이 안락한 삶을 누릴 수 있도록 사회적 지원은 확대되어 왔고 또 확대되어야 합니다."
 KUB_five_year_plan: "제1차 5개년 계획"
 KUB_five_year_plan_desc: "산업을 재건하기 위해 5개년 계획을 시작해야 합니다."
 KUB_communist_education: "새로운 공산주의 교육"
 KUB_communist_education_desc: "이제 교육의 질을 높이고 학교 교육과정을 전면 개편할 때가 되었습니다."
 KUB_new_economic_policy: "신경제정책"
 KUB_new_economic_policy_desc: "공산주의 경제 정책이 쿠반에 가장 성공적이고 공정한 정책이 될 것입니다."
 KUB_tax_reform: "세제 개혁"
 KUB_tax_reform_desc: "시민의 세금을 낮추는 것이 가장 공정한 해법입니다."
 KUB_infra_development: "기반시설 개선"
 KUB_infra_development_desc: "우리 시민은 아름답고 현대적인 도시에서 살아야 합니다."
 KUB_soviet_contst: "소비에트 헌법"
 KUB_soviet_contst_desc: "소련 시절의 헌법을 일부 조정하여 되살릴 것입니다."
 KUB_reestablich_military_complex: "군수 복합체 재건"
 KUB_reestablich_military_complex_desc: "군산복합체 없이는 오래 살아남을 수 없습니다. 군산복합체의 부활은 우리 당의 가장 중요한 과제입니다."
 KUB_revive_socialist_troops: "쿠반 소비에트 공화국군 재건"
 KUB_revive_socialist_troops_desc: "모든 나라에는 자신의 군대가 필요합니다. 우리 이념과 우리나라를 지키기 위해 우리에게도 군대가 필요합니다."
 KUB_bring_back_adygea: "아디게야 복귀"
 KUB_bring_back_adygea_desc: "아디게야의 노동자들을 다시 우리 품으로 데려와 자본주의 정부의 억압에서 해방시켜야 합니다."
 KUB_north_caucas_republics: "테르스카야 소비에트 공화국"
 KUB_north_caucas_republics_desc: "남부 러시아에 이상적인 공산주의 국가를 건설하려면 북캅카스 공화국들을 장악해야 합니다."
 KUB_donskaya_sr: "돈 소비에트 공화국"
 KUB_donskaya_sr_desc: "우리 공화국들은 서로 닮았습니다. 우리는 하나의 문화와 하나의 역사를 가지고 있으며, 하나의 국가가 되어야 합니다."
 KUB_revive_black_sea_rep: "흑해 소비에트 공화국 재건"
 KUB_revive_black_sea_rep_desc: "마침내 우리의 꿈이 이루어졌습니다. 그로즈니에서 로스토프에 이르기까지 사람들이 하나의 국가로 뭉쳤습니다."
 KUB_nationalist_in_jail: "민족주의자 투옥"
 KUB_nationalist_in_jail_desc: "민족주의자들은 우리 사회의 프롤레타리아적 조화를 어지럽힙니다."
 KUB_anti_lgbt: "반 LGBT 선전"
 KUB_anti_lgbt_desc: "LGBT는 질병입니다."
 KUB_clean_social_network: "깨끗한 소셜 네트워크"
 KUB_clean_social_network_desc: "소셜 미디어에는 반소비에트적이고 반공산주의적인 선전이 가득합니다. 이를 신속히 바로잡아야 합니다."
 KUB_revive_pioneria: "피오네리아 재건"
 KUB_revive_pioneria_desc: "피오네르 활동을 통해 청년들이 우리의 견해와 이상으로 향하게 할 수 있습니다."
 KUB_state_atheism: "국가 무신론"
 KUB_state_atheism_desc: "신은 없습니다."
 KUB_restalinisation: "재스탈린화"
 KUB_restalinisation_desc: "스탈린은 위대한 지도자이자 위대한 인물이었습니다. 우리나라를 산업 강국으로 만든 사람이 바로 그입니다. 반스탈린 선전에 대처해야 합니다."
 KUB_new_soviet_kuban: "새로운 소비에트 쿠반"
 KUB_new_soviet_kuban_desc: "새로운 소비에트 쿠반은 정의롭고 행복한 사회의 결합체이며, 자국 국가와 정부를 신뢰하고 언제나 의지할 수 있는 사회입니다."
 KUB_unite_karachaevo: "카라차이-체르케시야"
 KUB_secpmd_five_year_plan: "제2차 5개년 계획"
 KUB_secpmd_five_year_plan_desc: "제1차 5개년 계획이 훌륭한 성과를 거두었음에도, 우리는 더 잘할 수 있음을 압니다. 공산주의의 승리를 향해 전진!"
 KUB_deconservatization: "재가동"
 KUB_deconservatization_desc: "소련 붕괴 이후 당시에는 불필요했던 군 장비가 우리 창고에 많이 남았습니다. 그러나 이제 군대가 확장되면서 품질을 가리지 않고 군 장비가 시급히 필요합니다. 따라서 우리가 직접 새 장비를 생산할 때까지 낡은 소련제 장비를 임시로 다시 투입해야 합니다."
 KUB_new_academies: "신규 군사 학교"
 KUB_new_academies_desc: "전투력의 확장과 재건에 맞춰 군사 교육도 변해야 하며, 군사 학교의 수도 늘려야 합니다."
 KUB_new_batalions: "신규 대대"
 KUB_new_batalions_desc: "영토와 군대가 확장됨에 따라 우리 영토를 방어할 새로운 부대를 편성해야 합니다."
 KUB_support_commies_south_ossetia: "남오세티야 공산주의자 지원"
 KUB_support_commies_south_ossetia_desc: "남오세티야에서 충성스러운 인물들을 육성함으로써 머지않아 이곳을 우리에게 통합할 수 있을 것입니다."
 KUB_support_commies_abhazia: "압하지야 공산주의자 지원"
 KUB_support_commies_abhazia_desc: "압하지야에서 충성스러운 인물들을 육성함으로써 머지않아 이곳을 우리에게 통합할 수 있을 것입니다."
 KUB_integrate_them: "압하지야와 남오세티야 통합"
 KUB_integrate_them_desc: "마침내 남오세티야와 압하지야의 노동자들을 자본가들의 억압에서 해방시킬 수 있습니다. 만세, 동지들이여!"
 KUB_revive_our_kgb: "쿠반 KGB"
 KUB_revive_our_kgb_desc: "KGB의 도움으로 우리는 국가 내 인민의 적을 식별하고 모든 전복 활동을 진압할 수 있었습니다. 이 조직을 되도록 빨리 복원해야 합니다."
 KUB_expand_politce: "경찰 개혁"
 KUB_expand_politce_desc: "경찰이 아니라 민병대입니다."
 KUB_fight_int_agency: "국제 공작 기관 뿌리 뽑기"
 KUB_fight_int_agency_desc: "KGB가 복원되면 외국 정보기관을 위해 일하는 모든 첩보원을 소탕해야 합니다."
 KUB_revolutions_in_russian_regions: "러시아 남부 지역 혁명"
 KUB_revolutions_in_russian_regions_desc: "러시아 인민을 자본가들의 노예 상태에서 해방시켜야 합니다!"
 KUB_cossack_start: "카자크 당"
 KUB_cossack_start_desc: "\n\n\n\n\n\n£SUB_desctext_kazaks \n\n\n\n\n\n\n\n\n러시아 연방 카자크당은 2012년에 창당되었습니다. 이 당의 주요 목표와 과제는 카자크의 전통과 역사를 보존하고 수호하는 것입니다."
 KUB_cossacks_propoganda: "카자크 이념 선전"
 KUB_cossacks_propoganda_desc: "카자크에게는 위대하고 영광스러운 과거가 있습니다. 강한 카자크 국가를 세우려면 우리의 역사와 이념을 대중에게 알려야 합니다."
 KUB_new_doctrine: "새로운 교리"
 KUB_new_doctrine_desc: "우리 군에는 독자적인 새 교리가 필요합니다."
 KUB_deconservatization_cossacks: "재가동"
 KUB_deconservatization_cossacks_desc: "소련 붕괴 이후 당시에는 불필요했던 군 장비가 우리 창고에 많이 남았습니다. 그러나 이제 군대가 확장되면서 품질을 가리지 않고 군 장비가 시급히 필요합니다. 따라서 우리가 직접 새 장비를 생산할 때까지 낡은 소련제 장비를 임시로 다시 투입해야 합니다."
 KUB_cossack_officer_schoold: "카자크 장교 학교"
 KUB_cossack_officer_schoold_desc: "우리 군에는 장교가 필요하고, 장교에게는 새로운 학교가 필요합니다. 군에 충분한 장교가 확보되도록 장교 양성 기관의 수를 늘려야 합니다."
 KUB_russian_weapons_cossaks: "러시아 무기"
 KUB_russian_weapons_cossaks_desc: "러시아 무기는 실용성과 물량이 핵심입니다. 우리 군을 위해 러시아 무기를 새로 한 묶음 구입해야 합니다."
 KUB_cossaks_on_the_borders: "국경에 카자크 배치"
 KUB_cossaks_on_the_borders_desc: "카자크 분견대는 대부분의 국경 수비대보다 국경을 더 잘 지킵니다. 그런데 왜 추가 지출이 필요하겠습니까?"
 KUB_social_support_cossaks: "사회적 지원"
 KUB_social_support_cossaks_desc: "어떤 카자크든 가족이 충분한 사회 보장을 받고 있으며 국가가 이들을 돌볼 것임을 알면 더 잘, 더 용감하게 싸울 것입니다."
 KUB_cossaks_culture: "카자크 문화 장려"
 KUB_cossaks_culture_desc: "카자크에게는 그들만의 뛰어난 문화가 있습니다. 우리 시민들에게 이를 상기시켜야 합니다."
 KUB_fight_olighars_cossaks: "올리가르히와의 전쟁"
 KUB_fight_olighars_cossaks_desc: "올리가르히는 우리 국가에서 가장 더럽고 나쁜 자들입니다. 국가의 이익을 위해 이들을 완전히 제거해야 합니다."
 KUB_cossak_education: "카자크 교육"
 KUB_cossak_education_desc: "젊은 세대가 우리나라를 알고 자랑스러워할 수 있도록 교육과정에 조상들의 역사를 추가해야 합니다."
 KUB_propoganda_cossak: "카자크 선전"
 KUB_propoganda_cossak_desc: "이러한 선전을 통해 많은 사람을 우리 군으로 끌어들일 수 있습니다."
 KUB_new_people_cossack: "동원"
 KUB_new_people_cossack_desc: "우리 군에는 더 많은 인원이 필요합니다. 동원 규모를 확대해야 합니다."
 KUB_cossak_cadets: "카자크 유년 학도단"
 KUB_cossak_cadets_desc: "군에 입대하고자 하는 젊은 세대에게도 그럴 기회가 있어야 합니다. 유년 학도단을 복원해야 합니다."
 KUB_cossak_militia: "카자크 민병대"
 KUB_cossak_militia_desc: "우리나라의 거리를 완전히 통제하기 위해 도시를 순찰할 새로운 민병 부대를 도입해야 합니다."
 KUB_infra_cossack: "기반시설 개선"
 KUB_infra_cossack_desc: "우리나라에는 새롭고 현대적이며 신뢰할 수 있는 기반시설이 필요합니다."
 KUB_cis_cossack: "CIS 카자크와의 협력"
 KUB_cis_cossack_desc: "CIS 전역에는 많은 카자크가 있습니다. 이들을 의용병으로 우리 군에 끌어들일 수 있습니다."
 KUB_rus_cossack: "러시아의 카자크"
 KUB_rus_cossack_desc: "러시아 카자크 연맹은 소련 전역의 카자크 창립 모임의 결정에 따라 1990년 6월 29일 결성된 전러시아 사회 단체입니다."
 KUB_patriots_cossack: "애국주의"
 KUB_patriots_cossack_desc: "모든 사내는 카자크입니다."
 KUB_union_of_south_cossaks: "남러시아 카자크 연맹"
 KUB_union_of_south_cossaks_desc: "남러시아 카자크 연맹은 로스토프 지역, 북캅카스, 스타브로폴에 거주하는 러시아 카자크를 하나로 묶는 조직입니다."
 KUB_union_of_siberian_cossaks: "동시베리아 카자크 연맹"
 KUB_union_of_siberian_cossaks_desc: "시베리아 및 극동 카자크 연맹은 시베리아와 극동에 거주하는 러시아 카자크를 하나로 묶는 조직입니다."
 KUB_cossaks_new_millennium: "새 천년의 카자크"
 KUB_cossaks_new_millennium_desc: "카자크 문화가 부활하면서 사람들은 다시금 조상들을 기억하고 그 길을 걷게 되었습니다. 우리는 위대한 카자크의 후손이며 그들의 과업을 계속 이어 갈 것입니다!"
 KUB_new_economy_cossaks: "새로운 경제 체제"
 KUB_new_economy_cossaks_desc: "우리나라의 경제 성장을 위해 단행해야 할 개혁이 여럿 있습니다."
 KUB_benefits_cos: "카자크 혜택"
 KUB_benefits_cos_desc: "카자크는 우리 국가에서 누릴 수 있는 개혁 혜택이 확대될 자격이 있습니다. 이렇게 우리는 그들을 아끼고 있음을 보여 줍니다."
 KUB_healthcare_reform: "보건 의료 개혁"
 KUB_healthcare_reform_desc: "양질의 의료를 모두가 이용할 수 있도록 의료 개혁이 필요합니다."
 KUB_rus_mod_cossaks: "러시아 국방부와의 계약"
 KUB_rus_mod_cossaks_desc: "모스크바와 충돌 없이 계속 복무하려면 러시아 연방 국방부와 계약을 체결하는 것이 가장 논리적인 선택입니다."
 KUB_apartment_for_cossaks: "카자크 주택 지급"
 KUB_apartment_for_cossaks_desc: "충분한 햇수 동안 복무한 카자크는 장려받아야 하며 주택을 지급받아야 합니다."
 KUB_rodina_start: "로디나"
 KUB_rodina_start_desc: "로디나는 공식 등록된 러시아의 민족보수주의 정당입니다. 2003년부터 2004년까지는 선거 연합 인민애국연합 로디나라고 불렸으며, 그 후 같은 이름의 정당으로 개편되었습니다."
 KUB_liberals_fight: "자유주의자 척결"
 KUB_liberals_fight_desc: "자유주의자는 조국을 팔아넘기려는 자들입니다. 자유주의 야당을 완전히 분쇄해야 합니다."
 KUB_military_support: "군인 사회적 지원"
 KUB_military_support_desc: "우리 군은 나라의 근간입니다. 그들의 이미 힘든 임무를 돕기 위해 다양한 혜택을 사회적으로 제공하고 생활을 편하게 해 주어야 합니다."
 KUB_investments_in_vpk: "군산복합체 투자"
 KUB_investments_in_vpk_desc: "군수 공장 없이는 우리 군이 존재할 수조차 없으며, 군사 작전은 말할 것도 없습니다."
 KUB_migration_fight: "이주와의 투쟁"
 KUB_migration_fight_desc: "우리에게는 편히 살기에 충분한 우리 국민이 있으며, 외국 전문가는 필요 없습니다."
 KUB_oligharsn_fight_rodina: "올리가르히 척결"
 KUB_oligharsn_fight_rodina_desc: "올리가르히는 자유주의자와 마찬가지로 사회와 국가에 위험한 존재입니다. 그들 또한 제거되어야 합니다."
 KUB_police_funding_rodina: "경찰 예산 증액"
 KUB_police_funding_rodina_desc: "시민의 안전한 삶을 보장하기 위해 경찰력에 추가 자금을 배정해야 합니다."
 KUB_a_just_kuban: "정의로운 쿠반"
 KUB_a_just_kuban_desc: "새로운 정당, 새로운 시대, 새로운 쿠반."
 KUB_education_reform: "교육 개혁"
 KUB_education_reform_desc: "낡은 교육 제도는 우리 아이들을 망치고 있습니다. 이를 현대화하고 불필요한 과목을 없애야 합니다."
 KUB_locals_support_just: "지역 생산자 지원"
 KUB_locals_support_just_desc: "우리 땅에서 모든 것을 직접 기를 수 있는데 왜 식량을 사야 합니까."
 KUB_fight_coruuption_just: "부패와의 투쟁"
 KUB_fight_coruuption_just_desc: "올리가르히 외에도, 90년대 이래 높은 수준에 있는 부패와의 싸움을 계속해야 합니다."
 KUB_benefits_just: "사회적 지원"
 KUB_benefits_just_desc: "강한 국가는 자국민을 돌봐야 합니다."
 KUB_tax_refroms: "세제 개혁"
 KUB_tax_refroms_desc: "세금 학살은 멈춰야 합니다! 고세율을 타도하라!"
 KUB_production_growth: "생산 증대"
 KUB_production_growth_desc: "생산 속도를 높여야 합니다! 사회주의의 승리를 향해 전진!"
 KUB_new_agro: "신규 농업 단지"
 KUB_new_agro_desc: "농민들이 편안함을 느낄 수 있도록 새로운 농업 단지를 건설해야 합니다."
 KUB_free_medicine: "무상 의료"
 KUB_free_medicine_desc: "의료는 고품질이어야 하며 모두가 이용할 수 있어야 합니다!"
 KUB_kuban_science: "쿠반 과학 투자"
 KUB_kuban_science_desc: "우리 국가에는 독자적이고 강력한 자체 과학과 교육이 필요합니다!"
 KUB_just_culture: "쿠반 문화 지원"
 KUB_just_culture_desc: "정의로운 사회를 건설하려면 지역 문화와 지역 주민의 전통을 지원해야 합니다!"
 KUB_kuban_freedom_of_speech: "언론의 자유"
 KUB_kuban_freedom_of_speech_desc: "언론의 자유는 21세기 사회주의와 정의로운 사회를 건설하기 위한 가장 중요한 조건입니다."
 KUB_just_society: "정의로운 사회"
 KUB_just_society_desc: "21세기 사회주의가 승리했습니다. 쿠반의 밝은 미래를 향해 전진!"
 BSH_agriculture: "농업부"
 BSH_agriculture_desc: "농업부는 우리 공화국의 농업 지원 분야 문제를 더 잘 해결하도록 도울 것입니다."
 KUB_destroyed_agriculture: "붕괴한 농업"
 KUB_adygea_russia_tt: "이제 [SOV.GetNameWithFlag]에 - §G아디게야§!를 우리에게 넘길 것을 제안할 수 있습니다."
 KUB_minister_of_agriculture: "농업부"
 KUB_minister_of_agriculture_desc: "크라스노다르 지방에서 생산되는 제품의 생산성과 품질을 관리하고 향상시키기 위해 부처가 신설되었습니다."
 KUB_new_agriculture_complexes: "신규 농업 단지"
 KUB_new_agriculture_complexes_desc: "농민들이 편안함을 느낄 수 있도록 새로운 농업 단지를 건설해야 합니다."
 KUB_debureaucratization: "탈관료화"
 KUB_debureaucratization_desc: "관료제는 지난 세기의 유물이자 국가 발전을 늦추는 장치입니다. 관료제와 관료들 전반에 맞서 싸워야 합니다!"
 KUB_reduce_taxes_small_business: "소기업 세금 인하"
 KUB_reduce_taxes_small_business_desc: "소기업은 우리 경제의 큰 부분을 차지합니다. 우리의 상황에서는 소기업에 대한 압박과 세금을 완화할 필요가 있습니다."
 KUB_business_rus: "러시아와의 사업"
 KUB_business_rus_desc: "쿠반과 러시아는 하나이며 분리될 수 없고, 우리의 공동 사업도 마찬가지입니다!"
 KUB_nationalize_foreign_business: "외국 기업 국유화"
 KUB_nationalize_foreign_business_desc: "자본가들이 외국인을 들여보낸 탓에 이제 그들이 우리 경제의 큰 부분을 통제할 수 있게 되었습니다. 이를 끝낼 때입니다."
 KUB_stavropolskaya_sr: "스타브로폴 소비에트 공화국"
 KUB_stavropolskaya_sr_desc: "스타브로폴 소비에트 공화국은 이미 우리 대열에 있었습니다. 이제 다시 우리의 통제 아래 둘 때가 되었습니다."
 KUB_agriculture_commi: "농업 복구"
 KUB_agriculture_commi_desc: "우리 농업은 90년대에 쇠퇴했습니다. 이제 우리나라와 그 가장 중요한 부문인 농업을 재건할 때입니다."
 KUB_new_cossack_battalions: "신규 카자크 대대"
 KUB_new_cossack_battalions_desc: "필요한 인원을 모집했으므로, 우리 군 대열에서 추가로 복무할 대대를 편성해야 합니다."
 TAT_suppress_nationalists: "민족주의자 탄압"
 TAT_suppress_nationalists_desc: "민족주의는 과거의 유물입니다. 어떤 형태의 민족주의든 끔찍한 결과로 이어지기 전에 피하고 억눌러야 합니다."
 KUB_suppress_nationalists: "민족주의자 탄압"
 KUB_suppress_nationalists_desc: "민족주의는 과거의 유물입니다. 어떤 형태의 민족주의든 끔찍한 결과로 이어지기 전에 피하고 억제해야 합니다."
 KUB_military_industrial_complex: "군산복합체"
 KUB_military_industrial_complex_desc: "창고에 일정량의 장비는 있지만 현대전을 치르기에는 부족합니다. 우리의 군수 공장을 재건해야 합니다."
 KUB_bureaucracy_fight: "관료제와의 투쟁"
 KUB_bureaucracy_fight_desc: "관료제는 우리 국가의 가장 큰 문제입니다. 이를 완전히 없애야 하며, 그래야 우리 국가가 더 발전할 수 있습니다."
 TAT_constitution: "소비에트 헌법"
 TAT_constitution_desc: "소비에트 시절의 헌법을 일부 조정하여 되돌리겠습니다."
 subject_rus.127.t: "트란스니스트리아 상원의원, [MLV.GetName] 통합 제안"
 subject_rus.127.d: "프리드네스트로비예 출신 상원의원이 연방회의에 다소 이례적인 제안을 했습니다. 그가 제안한 계획에 따르면 몰도바는 트란스니스트리아 정부에 의해 통합되며, 이는 옛 몰도바 주민들의 진정한 대표가 될 트란스니스트리아 정부를 통해 이 영토들을 러시아에 통합하는 일을 크게 용이하게 할 것입니다."
 subject_rus.127.a: "그들이 하도록 두자"
 subject_rus.127.b: "터무니없다, 몰도바는 그대로 남는다"
 PMR_annex_mlv: "§Y[MLV.GetNameWithFlag]§!을(를) §Y[PMR.GetNameWithFlag]§!에 통합할 것을 제안"
 SUB_economic_integrate: "§Y[SOV.GetFlag]러시아 경제§!로의 §Y통합§!"
 SUB_sovfed_pmr_subject_economic_available_tt: "[SOV.GetFlag]§Y러시아§! £text_icon_sov_ruble §Y경제§!에 통합하려면 £text_icon_pmr_sheriff §2셰리프 홀딩§!을 §R처분§!해야 합니다."
 SUB_sovfed_pmr_subject_economic_tt: "모든 [SOV.GetFlag]§Y러시아 기업§!이 우리 경제에 통합됩니다."
 URA_communism_sklads_desc: "우리 영토에 있는 모든 무기를 우리 군을 위해 접수할 계획입니다."
 SUB_army_integrate: "§Y[SOV.GetFlag]러시아군§!으로의 §Y통합§!"
 SUB_sovfed_subject_army_tt: "우리 군대가 [SOV.GetFlag]§Y러시아군§!에 §Y통합§!됩니다."
 SUB_RussianEconomic_loc1: "\n§g러시아 경제에 통합됨§!: 러시아의 국가 대표 기업들이 본국과 동일한 조건으로 이곳에서 거래하며, 우리에게 그 가치는 모스크바에 대한 가치에 따라 오르내립니다."
 SUB_RussianArmy_loc1: "[SOV_SpaceForces_loc][SOV_Satellites_loc][SOV_FarAvia_loc][SOV_TransportAvia_loc][SOV_AirMissile_loc][SOV_AirAircraft_loc][SOV_RadioTech_loc][SOV_Rockets_loc][SOV_AntiAir_loc][SOV_Engineer_loc][SOV_Ipso_loc][SOV_Mto_loc][SOV_Railway_loc][SOV_Electronic_loc]"
 SUB_economic_integrate_yes: "§Y[SOV.GetFlag]러시아 경제§!로의 §Y통합§!"
 subject_rus.128.t: "[FROM.GetNameWithFlag], 우리 경제에 통합 중"
 subject_rus.128.d: "그들의 정부가 우리 경제로의 경제적 통합을 계속하고 있으며, 그들의 영토에 있는 우리 기업의 수와 역량이 확대되고 있습니다."
 subject_rus.128.a: "좋다"
 subject_rus.129.t: "[FROM.GetNameWithFlag], 우리 군에 통합 중"
 subject_rus.129.d: "그들의 정부가 우리 부대 간 협력을 개선하기 위해 우리 군으로의 통합을 계속하고 있습니다."
 subject_rus.129.a: "좋다"
 SUB_rusempire_governorates_create: "새 §Y총독령§! 신설"
 SUB_rusempire_governorates_annex: "새 §Y총독령§! 병합"
 SUB_rusempire_governorates_caucas_destroy: "캅카스 민족 공화국 §R해체§!"
 SUB_rusempire_governorates_other_destroy: "기타 민족 공화국 §R해체§!"
 SUB_rusempire_governorates_siberia_destroy: "시베리아 및 우랄 민족 공화국 §R해체§!"
 SUB_rusempire_governorates_povoljie_destroy: "볼가 민족 공화국 §R해체§!"
 SOV_ekb_build: "§Y예카테린부르크§!: 지역 발전 §G투자§!"
 SUB_russvoiet_republic_annex: "§Y소비에트 공화국§! 병합"
 SUB_annex_debuff: "종속국 병합의 진통"
 SUB_banditism_idea: "무자비한 도적떼"
 SOV_subject_unfluency_TT: "[SOV.GetFlag] 러시아의 §Y[ROOT.GetNameWithFlag]§! 내 §H영향력 배수§!: §R+99%§!\n"
 chechnya.29.t: "그로즈니 테러 공격"
 chechnya.29.d: "그로즈니의 디나모 경기장 귀빈석에서 테러 공격이 발생했습니다. 연단 기반에 매설된 지뢰가 폭발하여 체첸 대통령 아흐마트 카디로프와 체첸 국가평의회 의장 후세인 이사예프를 포함해 7명이 사망하고 약 80명이 부상을 입었습니다."
 chechnya.29.a: "유감입니다"
 chechnya.29.b: "다음에는 무엇이 기다리고 있는가"
 chechnya.30.t: "체첸의 운명"
 chechnya.30.d: "아흐마트 카디로프의 죽음이라는 민족적 비극이 공화국을 마비시켰지만, 앞으로 나아가야 하며 이제 누가 공화국을 계속 통치할지가 결정될 것입니다."
 chechnya.30.a: "지켜보자"
 chechnya.31.t: "공화국의 새로운 수반"
 chechnya.31.d: "체첸이 앞으로 나아갈 때이며, 조기 선거에서 공화국의 새로운 수반이 선출되었습니다."
 chechnya.31.a: "좋다"
 chechnya.32.t: "공화국의 새로운 수반"
 chechnya.32.d: "체첸 정부 내에서 아흐마트 카디로프의 아들 람잔과 현 공화국 수반 알루 알하노프 사이에 갈등이 벌어지고 있습니다. 상황이 매우 위급하여, 지금 당장 앞으로 누가 공화국을 이끌지 우리가 직접 결정해야 합니다."
 chechnya.32.a: "카디로프"
 chechnya.32.b: "알하노프"
 chechnya.33.t: "알하노프, 체첸 수반 직위 유지"
 chechnya.33.d: "러시아 정부는 람잔 카디로프의 충동을 승인하지 않고 조치를 취했으며, 알하노프는 체첸 수반직을 유지하게 됩니다."
 chechnya.33.a: "좋군"
 CHE_ichker_economys: "체첸 경제"
 CHE_ichker_economys_desc: "우리나라는 폐허가 되었으며 완전히 재건해야 하고, 어떤 길로 갈지는 우리에게 달려 있습니다."
 CHE_reviving_red_hammer: "'붉은 망치 공장' 재가동"
 CHE_reviving_red_hammer_desc: ""
 CHE_reviving_himzavod: "화학 공장 재가동"
 CHE_reviving_himzavod_desc: ""
 CHE_reviving_npz: "정유 공장 재가동"
 CHE_reviving_npz_desc: ""
 CHE_agro_return: "농공업의 부흥"
 CHE_agro_return_desc: "두 차례의 체첸 전쟁은 우리 지역의 경제를 완전히 파괴했으며, 이제 파괴된 것을 재건하기 시작할 것이고 농공업부터 시작할 것입니다."
 CHE_agro_promka: "복구 확대"
 CHE_agro_promka_desc: "두 차례 전쟁 이후 파괴된 것을 재건할 수 있는 잠재적 범위를 넓힐 수 있으며, 머지않아 우리가 캅카스 전체를 먹여 살릴 것입니다!"
 CHE_chechen_mineral: "체첸 광천수 유한회사"
 CHE_chechen_mineral_desc: "새로운 농공업 기업이 우리 경제를 확장시켰습니다."
 CHE_argun: "아르군 육가공 공장"
 CHE_argun_desc: "새로운 농공업 기업이 우리 경제를 확장시켰습니다."
 CHE_sadi: "NPF 체첸의 정원 유한회사"
 CHE_sadi_desc: "새로운 농공업 기업이 우리 경제를 확장시켰습니다."
 CHE_promka_return: "체첸 산업의 부흥"
 CHE_promka_return_desc: "우리 공장들은 러시아와의 지난 전쟁에서 파괴되었으며, 이제 이를 재건해야 하고 이는 많은 노력과 자원을 요구할 것입니다."
 CHE_loyal_govern: "체첸의 새로운 충성파 지도자"
 CHE_loyal_govern_desc: "최근의 사건들로 체첸에 대한 지도부에 급격한 변화가 생겼으며, 이제 더욱 충성스러운 지역 수반이 임명될 것입니다."
 CHE_ahmat_after: "아흐마트의 유산"
 CHE_ahmat_after_desc: "최근의 사건들로 체첸에 대한 지도부에 급격한 변화가 생겼으며, 이제 더욱 충성스러운 지역 수반이 임명될 것입니다."
 CHE_loyal_omon: "진압 경찰 책임자"
 CHE_loyal_omon_desc: "체첸의 진정한 영웅이자 조국의 참된 애국자이며, 체첸 진압 경찰과 러시아 전체의 영웅인 인물이 공화국을 안정시키기 위해 이제 공화국 수반으로 앉혀졌습니다."
 CHE_omon_zapros: "오몬 대대 배치 요청"
 CHE_omon_zapros_desc: "우리는 이치케리야 무장 세력에 대한 소탕 작전을 수행할 계획이며, 이를 위해 각 지역에서 추가 오몬 대대가 필요합니다."
 CHE_police_chechnya: "체첸의 경찰 통치"
 CHE_police_chechnya_desc: "무사가 이끄는 오몬이 점점 더 많은 공공 통제 기관을 장악하고 있으며, 오몬이 이미 공화국 전체를 완전히 통제하고 있는 듯한 느낌입니다."
 CHE_omon_guard_russia_caucas: "러시아의 캅카스 근위대"
 CHE_omon_guard_russia_caucas_desc: "공화국의 국경을 강화해야 하며, 이슬람주의자와 기타 적대 세력의 영토 공격을 막기 위해 우리는 러시아의 방패가 될 것입니다."
 CHE_omon_narcos: "마약 밀매 대처"
 CHE_omon_narcos_desc: "마약 밀매는 90년대부터 공화국에서 번성하여 우리 국민과 청년을 파괴하고 있으며, 이제 이를 처리해야 할 때입니다."
 CHE_omon_propaganda: "오몬 복무 홍보"
 CHE_omon_propaganda_desc: "체첸에서 오몬 복무는 명예로운 직업이 되어 가고 있으며, 모든 남성이 자신의 지역에서 범죄와 싸우는 데 일조하기를 원합니다."
 CHE_omon_expand: "체첸 오몬 인원 확충"
 CHE_omon_expand_desc: "지원자 수가 크게 늘어 이제 공화국의 오몬 인원을 확충할 수밖에 없게 되었습니다."
 CHE_omon_battalion: "알리 발다예프 대대"
 CHE_omon_battalion_desc: "새로운 오몬 대대는 이치케리야에 맞서 싸우다 그로즈니 전투에서 용감히 전사한 오몬 지휘관인 영웅의 이름을 따서 명명될 것입니다."
 CHE_loyal_alhanov: "알루 알하노프"
 CHE_loyal_alhanov_desc: "연방 중앙에서 임명된 전 체첸 법 집행 관리 알루 알하노프가 이제 공화국을 운영합니다."
 CHE_loyal_sb: "독자 보안 기관"
 CHE_loyal_sb_desc: "우리는 현지의 카디로프 충성파를 신뢰하지 않으며 독자적인 보안 기관을 창설할 계획입니다."
 CHE_economic_autonomy: "경제적 자치"
 CHE_economic_autonomy_desc: "우리는 언제까지나 러시아 예산의 재정 지원에 매달려 있을 수 없으므로 경제적 자치를 추구할 것입니다."
 CHE_federal_help: "연방 원조"
 CHE_federal_help_desc: "러시아 정부는 공화국의 재정 안정을 지원하기 위해 우리에게 자금 한 차례를 배정했습니다."
 CHE_federal_invest: "연방 투자"
 CHE_federal_invest_desc: "러시아 정부는 회복 중인 체첸 경제에 투자할 준비가 되어 있습니다."
 CHE_islam_univer: "쿤타 하지 러시아 이슬람 대학"
 CHE_islam_univer_desc: "쿤타 하지 러시아 이슬람 대학은 체첸 최고이자 주된 종교 교육 기관입니다. 그로즈니 중심부에 위치해 있으며 약 300명의 학생이 재학 중입니다. 요르단, 말레이시아, 아랍 에미리트, 사우디아라비아, 시리아, 이집트의 이슬람 대학을 졸업한 이들이 이 대학에서 강의합니다. 교육과정의 중요한 부분은 대학의 이름이 유래한 쿤타 하지의 유산을 연구하는 것입니다."
 CHE_social_help: "사회적 지원"
 CHE_social_help_desc: "우리 공화국의 시민들은 그 어느 때보다 사회적 지원이 필요하며, 공화국은 아직 전쟁의 후유증에서 회복하지 못했습니다."
 CHE_mashadov_parlay: "앞으로, 위로, 경제여"
 CHE_mashadov_parlay_desc: "우리는 과거의 영광에 안주할 생각이 없으며, 우리 경제의 성장은 필연적입니다."
 CHE_loyal_fsb: "정보기관의 장악"
 CHE_loyal_fsb_desc: "FSB가 자신들이 후원하는 인물을 후보로 밀었고 이제 그가 공화국 수반직을 차지했습니다."
 CHE_battalion_fsb_help: "FSB 대대 소탕 작전"
 CHE_battalion_fsb_help_desc: "우리는 이치케리야 지지자들에 대한 소탕 작전을 수행하기 위해 FSB 지도부에 빔펠 대대와 알파 대대를 배정해 달라고 요청할 계획입니다."
 CHE_fsb_shield: "이치케리야를 덮은 FSB의 방패"
 CHE_fsb_shield_desc: "FSB는 거대한 방패처럼 공화국 위에 드리운 채 점점 더 공화국을 장악하고 있습니다."
 CHE_power_up_border_troops: "FSB 국경 부대 강화"
 CHE_power_up_border_troops_desc: "모병을 확대하여 지역의 국경 부대를 강화할 계획입니다."
 CHE_narcoss: "마약 밀매 대처"
 CHE_narcoss_desc: "마약 밀매는 90년대부터 공화국에서 번성하여 우리 국민과 청년을 파괴하고 있으며, 이제 이를 처리해야 할 때입니다."
 CHE_fsb_k_spetcnaz: "FSB 특수부대 '카프카스'"
 CHE_fsb_k_spetcnaz_desc: "알파와 빔펠에 준하여, 캅카스의 분리주의자들에 효과적으로 대응하기 위해 독자적인 FSB 대대를 창설할 계획입니다."
 CHE_battalion_caucas_fsb: "새로운 FSB 대대의 탄생"
 CHE_battalion_caucas_fsb_desc: "모병 절차를 마쳤으며 정식 대대의 창설을 발표할 계획입니다."
 CHE_alhanov_again: "알루 알하노프"
 CHE_alhanov_again_desc: "연방 중앙에서 임명된 전 체첸 법 집행 관리 알루 알하노프가 이제 공화국을 운영합니다."
 CHE_alhanov_sb: "독자 보안 기관"
 CHE_alhanov_sb_desc: "우리는 현지의 카디로프 충성파를 신뢰하지 않으며 독자적인 보안 기관을 창설할 계획입니다."
 CHE_kadyrov_case: "카디로프와의 갈등"
 CHE_kadyrov_case_desc: "아흐마트 카디로프의 아들 람잔이 우리에게 매우 적극적으로 맞서고 있으며, 연방 당국이 누구에게 체첸의 통치를 맡길지를 해결하도록 그들에게 호소해야 할 때입니다."
 CHE_sb_alihanov_idea: "독자 보안 기관"
 CHE_caucas_fsb_idea: "FSB 대대 '카프카스'"
 CHE_fsb_pogranci: "FSB 국경 부대"
 CHE_omon_idea: "체첸 오몬"
 CHE_raids_chechen_legends: "체첸 레전드 소탕"
 CHE_raids_chechen_legends_desc: "우리는 공화국을 안정시키고 남아 있는 이치케리야 지지자들을 처리해야 합니다."
 CHE_fsb_idea: "FSB 감독"
 SUB_we_are_at_war: "우리는 전쟁 중이다"
 SUB_we_are_at_war_desc: "때가 왔습니다. 우리 민족이 억압자에 맞서 무기를 들었습니다. 싸울 수 있는 모든 전사를 동원해야 합니다. 우리 민족의 생존이 여기에 달려 있습니다."
 SUB_call_for_volunteers: "의용병 모집"
 SUB_call_for_volunteers_desc: "우리의 투쟁 소식이 산과 계곡에 퍼지고 있습니다. 지역 곳곳의 의용병들이 부름에 응답하여, 우리의 독립을 위해 싸우다 죽을 각오가 된 사내들로 우리 대열을 불리고 있습니다."
 SUB_smuggle_guns_from_geo: "조지아에서 무기 밀반입"
 SUB_smuggle_guns_from_geo_desc: "조지아의 남부 국경은 허술하며, 지역 내 동조자들은 기꺼이 눈감아 줄 것입니다. 우리는 저항을 이어 가기 위해 소총과 통신 장비를 은밀히 들여오는 일을 마련합니다."
 SUB_smuggle_guns_from_aze: "아제르바이잔에서 무기 밀반입"
 SUB_smuggle_guns_from_aze_desc: "아제르바이잔은 캅카스로 통하는 두 번째 밀반입 경로를 제공합니다. 그곳의 연락책은 정치적 호의의 대가로 상당량의 보병 무기와 야전 장비를 공급해 줄 수 있습니다."
 SUB_invite_grey_wolves: "회색 늑대단 초청"
 SUB_invite_grey_wolves_desc: "회색 늑대단으로 알려진 튀르키예 민족주의 조직은 러시아의 지배에 맞서 싸우는 튀르크계와 무슬림 민족들과의 연대를 오래전부터 표명해 왔습니다. 우리가 손을 내밀자 그들은 전투원과 정신적 지지로 응답했습니다."
 SUB_gain_support_from_saudis: "사우디 지원 요청"
 SUB_gain_support_from_saudis_desc: "리야드에는 캅카스에서 러시아의 영향력에 맞설 수단과 동기가 모두 있습니다. 우리 사절이 우리 투쟁의 정당성을 설득하자 사우디의 자금이 흘러들기 시작했고, 지하드를 열망하는 새로운 의용병들도 함께 도착했습니다."
 SUB_gain_support_from_qatar: "카타르 지원 요청"
 SUB_gain_support_from_qatar_desc: "카타르의 풍부한 자금력과 지정학적 영향력에 대한 욕구는 카타르를 자연스러운 후원자로 만듭니다. 은밀한 합의에 따라 카타르의 자금이 중개인을 통해 전달되어, 보급이 바닥날 때에도 우리의 저항이 이어질 수 있습니다."
 SUB_last_defense: "최후의 방어"
 SUB_last_defense_desc: "적이 사방에서 조여 오는 가운데, 우리는 민족 총동원을 선포합니다. 항복도 후퇴도 없습니다. 오직 산이 있을 뿐이며, 마지막 숨이 다할 때까지 그 산을 지킬 이들만이 있을 뿐입니다."
 SUB_start: "지역 권력 기구 수립"
 SUB_start_desc: "러시아 연방 구성 주체로서의 지위가 확인되었으므로, 효율적인 지역 행정 조직을 구성하기 시작해야 합니다. 지금 정당한 제도를 구축하면 연방 안에서 우리 민족의 이익을 추구할 기반이 마련될 것입니다."
 SUB_start_industry: "지역 산업 육성"
 SUB_start_industry_desc: "우리 경제는 연방의 다른 지역에 비해 여전히 낙후되어 있습니다. 새로운 산업 시설을 건설하고 에너지 생산을 확대하는 집중적 노력이 지속적인 번영의 토대를 마련할 것입니다."
 SUB_fight_corruption: "부패 척결"
 SUB_fight_corruption_desc: "부패는 우리 지역 관료 조직에 만연해 있으며, 일반 시민에게 돌아가야 할 자원을 사적인 주머니로 빼돌리고 있습니다. 정치적으로 고통스럽더라도, 제 기능을 하는 국가를 세우려면 본격적인 반부패 운동이 필수적입니다."
 SUB_national_battalions: "민족 대대 편성"
 SUB_national_battalions_desc: "분쟁이 코앞에 닥친 지금, 안보를 모스크바에만 의존할 수는 없습니다. 우리는 지형을 잘 알고 지켜야 할 개인적 이유가 있는 우리 민족 출신으로 의용 대대를 편성합니다."
 SUB_fight_bad_cops: "경찰 개혁"
 SUB_fight_bad_cops_desc: "경찰에 대한 국민의 신뢰는 수년간의 폭력과 비전문성 속에서 무너졌습니다. 부패한 경찰관을 해임하고 책임성 확보 조치를 도입하면 신뢰를 회복하고 우리의 가장 해로운 지역 문제 중 하나를 제거할 수 있습니다."
 SUB_fight_bandits: "비적 소탕"
 SUB_fight_bandits_desc: "무장 범죄 조직이 우리 영토 일부에서 공공연히 활동하며 기업을 갈취하고 지역 사회를 공포에 떨게 하고 있습니다. 대중의 지지를 받는 단호한 보안 작전은 질서를 회복하고 정부가 시민을 보호할 수 있음을 보여 줄 것입니다."
 SUB_infrastructure: "인프라 개선"
 SUB_infrastructure_desc: "지역 전역의 도로, 교량, 공공 설비가 방치되어 경제 활동을 막고 일상생활을 불편하게 하고 있습니다. 연방의 공동 출자 덕분에 오래 미뤄 온 인프라 재건 작업을 시작할 수 있게 되었습니다."
 SUB_cooperate_rjd: "러시아 철도와 제휴"
 SUB_cooperate_rjd_desc: "러시아 철도는 우리 지역의 생명줄이자 주요 고용주입니다. 공식 협력 협정은 인프라 투자를 가져오고 국가 경제에 대한 우리의 통합을 심화시켜, 그 과정에서 모스크바와의 유대를 강화할 것입니다."
 SUB_airport: "공항 현대화"
 SUB_airport_desc: "우리 지역 공항은 낡았고 현대 항공 수요를 감당할 설비도 갖추지 못했습니다. 개보수와 확장은 우리 지역을 무역과 관광에 개방하고, 투자자들에게 우리가 발전에 진지하다는 신호를 보낼 것입니다."
 SUB_tourism: "관광 육성"
 SUB_tourism_desc: "우리 지역의 자연미와 문화유산은 대체로 개발되지 않은 경제적 자산입니다. 목표를 정한 관광 개발 프로그램은 방문객을 끌어들이고 수익을 창출하며 숙박업과 서비스업에서 일자리를 만들어 낼 것입니다."
 SUB_free_zone: "자유 경제 구역 설치"
 SUB_free_zone_desc: "그로즈니의 전후 재건 모델을 본받아, 우리 영토 일부를 규제를 줄이고 세금 우대를 제공하는 특별 경제 구역으로 지정합니다. 국내외 투자를 유치하고 성장을 가속하는 것이 목표입니다."
 SUB_energy: "에너지 부문 육성"
 SUB_energy_desc: "우리 지하에는 수 세대에 걸쳐 지역 발전을 뒷받침할 수 있는 미개발 매장량이 있습니다. 채굴 인프라에 투자하면 수익을 창출하고 우리 국민에게 숙련된 일자리를 만들어 줄 것입니다."
 SUB_rosneft: "로스네프트와 제휴"
 SUB_rosneft_desc: "러시아의 국영 석유 대기업은 우리 지역에서 입지를 넓히기를 열망하고 있으며, 이 제휴에는 자본과 함께 모스크바의 정치적 호의도 따라옵니다. 이 거래로 우리는 독립성을 어느 정도 잃지만, 석유 채굴 투자는 이익을 가져다줄 것입니다."
 SUB_social_invest: "사회 투자 프로그램"
 SUB_social_invest_desc: "수년간의 재정 부족으로 공공 서비스는 한계에 이르렀습니다. 복지 지급액을 올리고, 주민 센터에 자금을 대고, 공공 편의 시설에 대한 접근성을 넓히는 폭넓은 사회 투자 프로그램은 삶을 실질적으로 개선하고 정치적 지지를 쌓을 것입니다."
 SUB_obrazovania: "교육 개혁"
 SUB_obrazovania_desc: "우리 학교는 재정이 부족하고 졸업생은 준비가 부족합니다. 예산 증액, 시설 개선, 교육과정 개정을 결합한 개혁 프로그램은 다음 세대의 교육 성과를 끌어올리는 긴 과업의 시작이 될 것입니다."
 SUB_selhoz: "농업 육성"
 SUB_selhoz_desc: "농업은 여전히 우리 농촌 경제의 근간이지만, 낡은 방식과 열악한 시장 접근성이 생산성을 저해하고 있습니다. 제대로 된 농업부를 설립하면 지원을 조율하고 이 부문에 마땅한 제도적 관심을 기울일 수 있습니다."
 SUB_selhoz_subsidia: "농업 보조금"
 SUB_selhoz_subsidia_desc: "농민들은 재정적 안정 없이는 현대화에 투자할 수 없습니다. 상당한 규모의 보조금 프로그램은 생산자를 시장 변동성으로부터 보호하고, 시간이 지나면서 더 나은 장비와 방식을 도입할 수 있게 해 줄 것입니다."
 SUB_selhoz_chastniki: "민간 영농 확대"
 SUB_selhoz_chastniki_desc: "국가가 통제하는 농업은 비효율적임이 입증되었습니다. 토지 소유 규정을 자유화하고 민간 소농에게 신용과 교육을 지원하면 생산성이 향상되고 농촌 공동체가 경제적 성공에 이해관계를 갖게 될 것입니다."
 SUB_medicina: "보건 의료 개혁"
 SUB_medicina_desc: "우리 지역의 보건 의료 체계는 인력과 장비가 부족하고 많은 농촌 주민이 이용하기 어렵습니다. 보건 예산을 늘리고 병원 건설과 직원 급여에 자금을 돌리면 이 격차를 좁히기 시작할 수 있습니다."
 SUB_fight_narcos: "마약과의 전쟁"
 SUB_fight_narcos_desc: "마약 밀매와 중독은 공중 보건을 해치고 범죄 조직을 키우는 심각한 사회 문제가 되었습니다. 법 집행 압력과 재활 프로그램을 결합한 조율된 캠페인은 이 위기의 공급과 수요 양쪽을 모두 겨냥할 것입니다."
 SUB_sport: "스포츠 투자"
 SUB_sport_desc: "스포츠는 언제나 우리 문화의 중심이었으며, 시설과 훈련 프로그램에 대한 투자는 운동 분야를 넘어서는 이익을 가져옵니다. 건강하고 활동적인 공동체는 더 결속력이 높고, 전국 단위의 스포츠 성과는 지역의 자부심을 높입니다."
 SUB_smi_free: "언론의 자유"
 SUB_smi_free_desc: "우리는 지역 언론에 대한 국가 통제를 느슨하게 하여 독립적인 목소리가 자유롭게 활동할 수 있도록 하기로 했습니다. 정치력 측면에서는 비싼 신호이지만, 자유 언론은 권위주의적 통치가 유지할 수 없는 대중의 신뢰와 시민 문화를 쌓아 줍니다."
 SUB_more_free_zone: "자유 경제 구역 확대"
 SUB_more_free_zone_desc: "첫 자유 구역의 성공은 이 모델의 잠재력을 보여 줍니다. 특별 경제 지위를 더 넓은 지역으로 확대하면 더 많은 투자를 끌어들이고 민주적 기업 활동을 자극하며 더 개방된 경제로의 전환을 가속할 것입니다."
 SUB_lgbt: "LGBT 권리 인정"
 SUB_lgbt_desc: "러시아의 공식 정책에 역행하여, 우리는 지역 내 LGBT 주민에게 법적 인정과 보호를 확대합니다. 이 결정은 논란이 되겠지만, 모든 시민을 위한 시민적 자유와 법치에 대한 우리의 의지를 반영합니다."
 SUB_smi_not_free: "언론 국가 통제"
 SUB_smi_not_free_desc: "우리는 통제되지 않는 언론보다 통일된 국영 언론의 목소리가 지역 결속에 더 도움이 된다고 판단합니다. 독립 언론은 길들여지며, 대중의 신뢰와 시민 담론을 대가로 정부의 정치적 입지가 강화됩니다."
 SUB_no_lgbt: "전통 가치"
 SUB_no_lgbt_desc: "우리 지역 정부는 전통적인 종교적, 문화적 가치와 확고히 뜻을 같이하며, 우리 공동체의 많은 이들이 외부에서 강요된 원치 않는 사회적 자유주의로 여기는 것을 거부합니다. 이러한 입장은 보수 지지층에서 인기가 높으며 우리의 정치적 연합을 공고히 합니다."
 SUB_zavods: "공장 건설"
 SUB_zavods_desc: "이념적 토대를 마련했으니, 이제 산업 확장이라는 구체적 과업에 착수합니다. 국가 주도로 새로운 제조 공장을 건설하면 일자리가 생기고 세수 기반이 커지며 모스크바의 예산 이전에 대한 우리의 의존이 줄어들 것입니다."
 SUB_inped_more_75_tt: "§Y분리주의§! 지지도가 현재 §Y75%§!를 넘었습니다. 종속국이 반란 직전입니다.\n"
 SUB_inped_less_75_tt: "§Y분리주의§! 지지도가 현재 §Y75%§! 미만입니다. 종속국이 아직 반란 한계선에 도달하지 않았습니다.\n"
 subject_rus.130.a: "확인했다"
 subject_rus.133.t: "이노폴리스 개장"
 subject_rus.133.d: "모스크바에서 동쪽으로 500마일 떨어진 곳에 [TAT.GetName]이(가) IT에 특화된 새로운 도시를 처음부터 건설했습니다. 볼가강 기슭에 자리한 이노폴리스는 최첨단 인프라를 자랑합니다. 이 도시에는 널찍한 사무용 건물, 새 대학, 두 곳의 첨단 인큐베이터 구역, 그리고 컨벤션과 무역 박람회를 위한 전시 시설이 들어서 있습니다."
 subject_rus.133.a: "새 천년의 진정한 도시"
 TAT_it_parks: "IT 파크"
 TAT_it_parks_desc: "수십 년 동안 우리 공화국의 경제는 석유 채굴과 중공업에 크게 의존해 왔습니다. 21세기에 우리의 미래를 보장하려면 다변화해야 합니다. 카잔과 나베레즈니예첼니에 최첨단 IT 파크를 조성하면 기술 기업에 유리한 환경을 만들고 일류 개발자를 유치하며 디지털 경제의 기반을 놓을 수 있습니다."
 TAT_project_volga: "프로젝트 '볼가'"
 TAT_project_volga_desc: "이노폴리스가 소프트웨어 및 연구 거점으로 자리 잡았으니, 다음 논리적 단계인 하드웨어 제조로 나아가야 합니다."
 TAT_it: "IT 혁신"
 BSH_develop_turism_desc: "관광 노선을 확장할 것입니다."
 URA_ugmk_meknabor_desc: "우랄메하노브르는 예카테린부르크에 있는 과학 연구소입니다. 2000년부터 UMMC 지주회사의 일부입니다. 광물 가공 분야의 과학적 개발을 수행합니다. 연구소의 전문가들은 러시아 안팎의 채굴, 가공, 금속 및 화학 기업의 설계와 과학적 지원에 참여합니다."
 CRM_pro_russ: "고향 항구로 귀환"
 CRM_pro_russ_desc: "우리는 우리의 고향 항구, 우리의 고향 집인 러시아로 돌아왔습니다. 만세!"
 CHE_assassinate_russian_president: "§Y러시아 대통령§! 암살 지시"
 CHE_armz_revol_tt: "아르메니아 공산당의 인기도가 §Y30%§!를 넘어야 함"
 CRM_2004_council_administration: "의회 조직"
 CRM_2004_council_administration_desc: "크림 최고 평의회는 우크라이나 내에서 지방 권한을 수호하기 위해 명확한 행정 구조가 필요합니다."
 CRM_2004_local_compromise: "지역 타협 확보"
 CRM_2004_local_compromise_desc: "키이우와의 실행 가능한 타협은 크림의 자치를 보존하고 반도의 정치 세력들을 진정시킬 것입니다."
 CRM_2004_economic_revival: "반도에 투자"
 CRM_2004_economic_revival_desc: "크림 인프라에 대한 소규모 투자는 새 행정부에 더 강력한 경제적 기반을 제공할 것입니다."
 MSC_mayor_modifier: "모스크바 시장"
 SOV_moscow_levels: "§Y모스크바§!: 연방 직할시"
 SOV_ekaterinburg_levels: "§Y예카테린부르크§!: 연방 직할시"
 URA_city_levels: "§Y예카테린부르크§!: 연방 직할시"
 SUB_russian_economy_modifier: "러시아 경제에 통합됨"
 SUB_russian_economy_modifier_desc: "모스크바의 국가 대표 기업들이 본국과 마찬가지로 이곳에서 활동합니다. 우리에게 그 가치는 러시아에 대한 가치에 따라 오르내립니다."
 SUB_cumchatka_organization: "캄차카 조직 개편"
 SUB_cumchatka_organization_desc: "캄차카주와 코랴크 자치구는 하나의 반도에 병렬 행정부를 운영하고 있습니다. 중복된 모든 부처는 빠듯한 동일 지역 예산에서 비용이 나가므로, 이중 지출을 멈추려면 이들을 통합하는 수밖에 없습니다."
 SUB_perm_organization: "페름 조직 개편"
 SUB_perm_organization_desc: "페름주와 코미-페르먄 자치구는 별개의 정부와 별개의 예산을 유지하고 있습니다. 이를 하나의 변경주로 통합하면 중복된 관료 체계가 사라지고 지역 산업이 이중 서류 작업에서 벗어날 수 있습니다."
 SUB_transbaikal_organization: "자바이칼 조직 개편"
 SUB_transbaikal_organization_desc: "치타주와 아긴-부랴트 자치구가 자바이칼의 권한을 두 행정부로 나누어 갖고 있습니다. 통합하면 지역의 광산과 철도를 하나의 정부가 책임지게 됩니다."
 SUB_krasnoyarsk_organization: "크라스노야르스크 조직 개편"
 SUB_krasnoyarsk_organization_desc: "타이미르 자치구와 에벤키 자치구는 이들을 둘러싼 변경주와 별도로 통치되어, 노릴스크 분지의 감독권이 세 갈래로 나뉘어 있습니다. 단일 변경주 행정부가 이 모든 것을 책임지게 될 것입니다."
 subject_rus.110.f: "유리 루시코프"
 URA_metro_modifier_desc: "노선 하나, 역 아홉 개로 이루어진 세계에서 가장 짧은 지하철 체계입니다. 코스모나프토프 대로역 너머로 추가되는 모든 역은 예카테린부르크의 혼잡한 거리의 교통량을 덜어 주며, 도로가 할 수 있는 것보다 더 빠르게 도시의 노동자들을 실어 나릅니다."
 aze_more_than_30_support_for_communists_zsr_TT: "아제르바이잔에서 공산주의자에 대한 지지율이 30%를 넘음"
