 HKG_contract_capstone_label: "La flotte de Hong Kong"
 HKG_contract_capstone_progress: "Achevez le programme de porte-avions national et mettez en service un porte-avions pour conquérir l'héritage naval de la ville."
 HKG_contract_capstone_done: "§GLa flotte de Hong Kong prend la mer — Hong Kong est une puissance navale reconnue.§!"
 HKG_contract_capstone_progress_tt: "Se déclenche une fois toute la branche de focus porte-avions achevée et que Hong Kong a construit ou conservé un porte-avions. Accorde l'esprit national §YPuissance navale de Hong Kong§!."
 HKG_contract_capstone_done_tt: "La pierre angulaire a été atteinte. L'esprit national §YPuissance navale de Hong Kong§! est actif et de meilleures conditions de contrat peuvent être négociées."
 HKG_naval_contracts_category: "Contrats d'approvisionnement naval"
 HKG_contract_solicit_contract: "Solliciter un contrat auprès de Pékin"
 HKG_contract_solicit_contract_desc: "Approchez la Commission militaire centrale et demandez une nouvelle commande de navires de guerre. Jusqu'à trois contrats peuvent courir à la fois ; plus vous en jonglez, plus Pékin accorde de délai à chacun. La classe et la récompense évoluent avec notre crédit."
 HKG_contract_deliver_destroyer: "Livrer un destructeur"
 HKG_contract_deliver_destroyer_desc: "Transférez un destroyer achevé à la marine de l'Armée populaire de libération. Il est crédité sur votre contrat de destroyer le plus urgent. Répétez jusqu'à ce que le quota de ce contrat soit atteint."
 HKG_contract_deliver_frigate: "Livrer une frégate"
 HKG_contract_deliver_frigate_desc: "Transférez une frégate achevée à la marine de l'Armée populaire de libération. Elle est créditée sur votre contrat de frégate le plus urgent. Répétez jusqu'à ce que le quota de ce contrat soit atteint."
 HKG_contract_deliver_submarine: "Livrer un sous-marin"
 HKG_contract_deliver_submarine_desc: "Transférez un sous-marin d'attaque achevé à la marine de l'Armée populaire de libération. Il est crédité sur votre contrat de sous-marin le plus urgent."
 HKG_contract_deliver_cruiser: "Livrer un croiseur"
 HKG_contract_deliver_cruiser_desc: "Transférez un croiseur achevé à la marine de l'Armée populaire de libération. Il est crédité sur votre contrat de croiseur le plus urgent."
 HKG_contract_deliver_carrier: "Livrer le porte-avions"
 HKG_contract_deliver_carrier_desc: "Transférez un porte-avions achevé à la marine de l'Armée populaire de libération et remplissez le contrat de porte-avions."
 HKG_contract_negotiate_terms: "Renégocier les conditions d'approvisionnement"
 HKG_contract_negotiate_terms_desc: "La flotte de Hong Kong établie, les chantiers de la ville commandent le respect. Pressez Pékin pour des paiements plus généreux et des délais plus longs sur tous les contrats futurs."
 HKG_contract_need_destroyer_tt: "Nous devons avoir au moins un destroyer dans notre marine à livrer"
 HKG_contract_need_frigate_tt: "Nous devons avoir au moins une frégate dans notre marine à livrer"
 HKG_contract_need_submarine_tt: "Nous devons avoir au moins un sous-marin d'attaque dans notre marine à livrer"
 HKG_contract_need_cruiser_tt: "Nous devons avoir au moins un croiseur dans notre marine à livrer"
 HKG_contract_need_carrier_tt: "Nous devons avoir un porte-avions dans notre marine à livrer"
 HKG_contract_slots_free_tt: "Nous avons un créneau de contrat libre (trois contrats au maximum peuvent courir à la fois)"
 HKG_contract_modules_tt: "Nos chantiers ont recherché au moins le palier 1 de chaque module de guerre naval essentiel : moteur, canon principal, missiles, torpilles, sonar et radar"
 HKG_contract_tt_unlock: "Débloque le système des §Ycontrats d'approvisionnement naval chinois§! : construisez des navires de guerre pour Pékin en échange de recettes du Trésor, de pouvoir politique et de croissance industrielle."
 HKG_contract_tt_solicit: "La Commission militaire centrale répondra par une offre d'approvisionnement d'ici quelques jours."
 HKG_contract_tt_accept_advance: "Recevez une avance de §G$[?HKG_contract_offer_advance|0]§! au Trésor et §G1000§! hommes, versés à la signature du contrat."
 HKG_contract_tt_accept_license: "Pékin accorde une §Olicence de production§! pour l'un de ses modèles [GetHKGContractOfferClass] établis, que nous pouvons construire directement dans nos chantiers. §YNote : il s'agit d'un modèle de service éprouvé, pas du dernier de la marine de l'Armée populaire de libération.§!"
 HKG_contract_tt_accept_onfulfil: "À la livraison de la commande complète : le solde du paiement alimente le Trésor, §G[?HKG_contract_offer_pp|0]§! de pouvoir politique et un gain de productivité industrielle sont accordés, et un bonus temporaire de recettes des chantiers commence."
 HKG_contract_tt_decline: "L'offre expire. Il n'y a pas de pénalité, et Pékin pourra en étendre une autre plus tard."
 HKG_contract_tt_deliver: "Transférez un navire à la marine de l'Armée populaire de libération, crédité sur votre contrat le plus urgent de cette classe.\n§YLe navire doit se trouver dans votre flotte de réserve. Un navire affecté à une task force ne peut pas être livré. Déplacez-le d'abord en réserve.§!"
 HKG_contract_tt_deliver_reward: "Lorsqu'un contrat est livré à quota complet : le solde du paiement alimente le Trésor, et des bonus de pouvoir politique, de productivité et de recettes des chantiers navals sont accordés."
 HKG_contract_tt_negotiate: "Tous les contrats futurs paient §G25 %§! de plus et autorisent des délais §G50 %§! plus longs."
 HKG_contract.1.t: "Une commande de Pékin"
 HKG_contract.1.d_normal: "La Commission militaire centrale de Pékin a sollicité nos chantiers avec une commande.\n\n§YCommande :§! [?HKG_contract_offer_quota|0] x [GetHKGContractOfferClass]\n§YDélai :§! [?HKG_contract_offer_deadline|0] jours\n§YPaiement :§! $[?HKG_contract_offer_funds|0] - $[?HKG_contract_offer_advance|0] et §G1000§! de main-d'œuvre versés à la signature, le reste à la livraison\n§YÀ l'achèvement :§! [?HKG_contract_offer_pp|0] de pouvoir politique, un gain durable de productivité et un bonus temporaire de recettes des chantiers\n\nLes navires doivent être construits dans nos propres chantiers et transférés à la Marine de l'Armée populaire de libération. Manquer le délai détériorera nos relations avec le continent."
 HKG_contract.1.d_license: "La Commission militaire centrale de Pékin propose un §Ocontrat de licence§!. La Marine de l'Armée populaire de libération partagera l'un de ses modèles éprouvés pour que nos chantiers le construisent sous licence.\n\n§YModèle sous licence :§! [?HKG_contract_offer_quota|0] x [GetHKGContractOfferClass]\n§YDélai :§! [?HKG_contract_offer_deadline|0] jours\n§YPaiement :§! $[?HKG_contract_offer_funds|0] - $[?HKG_contract_offer_advance|0] et §G1000§! de main-d'œuvre versés à la signature, le reste à la livraison\n§YÀ l'achèvement :§! [?HKG_contract_offer_pp|0] de pouvoir politique, un gain durable de productivité et un bonus temporaire de recettes des chantiers\n\nAccepter accorde une licence de production, nous permettant de construire directement le modèle de Pékin. §YNote : Pékin partage un modèle de service éprouvé, pas son dernier navire de guerre.§! Manquer le délai détériorera nos relations avec le continent."
 HKG_contract.1.a: "Accepter la commande"
 HKG_contract.1.b: "Refuser – nos chantiers ne sont pas prêts"
 HKG_contract.2.t: "Contrat rempli"
 HKG_contract.2.d: "Le dernier navire de la commande a été remis à la Marine de l'Armée populaire de libération. Pékin est satisfait : le paiement final de §Y$[?HKG_contract_last_payment|0]§! a été versé au Trésor, du capital politique a été libéré, et nos chantiers ont gagné leur réputation. Notre standing auprès du continent s'est élevé."
 HKG_contract.2.a: "Hong Kong construit la flotte"
 HKG_contract.3.t: "Date limite du contrat non respectée"
 HKG_contract.3.d: "Un délai de contrat est passé sans que la commande soit honorée. La Commission militaire centrale a noté l'échec de Hong Kong à tenir son engagement. Le mécontentement de Pékin pèse désormais sur nos chantiers et notre standing auprès du continent a chuté."
 HKG_contract.3.a: "Un revers malheureux"
 HKG_contract.50.t: "La flotte de Hong Kong"
 HKG_contract.50.d: "De sous-traitant à constructeur naval de premier rang : les chantiers de Hong Kong ont achevé le programme de porte-avions national et mis un porte-avions en mer. Ce qui avait commencé comme des contrats d'approvisionnement pour Pékin est devenu une industrie navale qui ne répond à personne. La flotte de Hong Kong est née, et avec elle Hong Kong prend place parmi les puissances navales."
 HKG_contract.50.a: "La ville prend la mer"
 HKG_contract_dockyard_revenue: "Dividende d'approvisionnement"
 HKG_contract_dockyard_revenue_desc: "Un contrat honoré pour Pékin maintient les chantiers de Hong Kong occupés et rentables. La construction navale génère des recettes stables tant que les carnets de commandes restent pleins."
 HKG_contract_beijing_displeasure: "Le mécontentement de Pékin"
 HKG_contract_beijing_displeasure_desc: "Hong Kong n'a pas livré une commande à temps. La Commission militaire centrale a perdu confiance dans les chantiers de la ville, et le coût politique se fait sentir dans toute l'administration."
 HKG_contract_naval_power: "Puissance navale de Hong Kong"
 HKG_contract_naval_power_desc: "Les chantiers de Hong Kong ont construit un porte-avions qui leur appartient et se sont montrés l'égal de n'importe lequel en Asie. L'industrie navale de la ville est désormais un atout stratégique permanent."
 HKG_carrier_home: "Un porte-avions pour Hong Kong"
 HKG_carrier_home_desc: "Construire un porte-avions national est le projet le plus ambitieux jamais tenté par la ville. Tout commence par les cales, les formes de radoub et la volonté politique de le mener à terme."
 HKG_carrier_construction: "Poser la quille"
 HKG_carrier_construction_desc: "Le Eastern Maritime Shipbuilding Group entame la coque du porte-avions. Le chantier mobilise toutes les cales et soudeurs que Hong Kong peut épargner."
 HKG_carrier_construction2: "Armer le porte-avions"
 HKG_carrier_construction2_desc: "La coque achevée, le porte-avions passe à l'armement. Centrale, espaces de commandement et îlot sont installés à quai."
 HKG_carrier_modules: "Intégration des systèmes de porte-avions"
 HKG_carrier_modules_desc: "Des modules de porte-avions modernes sont intégrés au dessin : catapultes, brins d'arrêt et systèmes de lutte contre les avaries, puisés dans une expérience navale chèrement acquise."
 HKG_flight_deck_limitations: "Surmonter les limites du pont d'envol"
 HKG_flight_deck_limitations_desc: "Le premier pont d'envol de Hong Kong est exigu aux normes occidentales. Les ingénieurs revoient l'agencement pour lancer et récupérer les appareils à un rythme utilisable."
 HKG_carrier_special_airwing: "Former le groupe aérien du porte-avions"
 HKG_carrier_special_airwing_desc: "Un porte-avions n'est à la hauteur que des pilotes qui en décollent. Hong Kong investit dans un groupe aérien naval dédié, formé aux opérations sur pont."
 HKG_carrier_defensive_weapons: "Suite d'autodéfense de porte-avions"
 HKG_carrier_defensive_weapons_desc: "Systèmes d'armes rapprochées, missiles de défense ponctuelle et contre-mesures électroniques sont installés pour que le porte-avions survive sans s'appuyer entièrement sur ses escortes."
 HKG_carrier_logistics: "Infrastructure de soutien aux porte-avions"
 HKG_carrier_logistics_desc: "Un porte-avions exige un port d'attache à la hauteur : quais en eaux profondes, dépôts de munitions et queue logistique pour le maintenir en mer."
 HKG_expanded_shipyards: "Agrandir les chantiers"
 HKG_expanded_shipyards_desc: "Les docks de Hong Kong sont poussés à bout. De nouvelles cales et formes de radoub accroissent la capacité de la ville à construire et réparer des navires de guerre."
 HKG_expanded_trade_capacity: "Étendre la capacité commerciale"
 HKG_expanded_trade_capacity_desc: "En tant que l'un des grands entrepôts du monde, Hong Kong investit dans le port et la capacité industrielle nécessaires pour faire transiter les marchandises par le havre."
 HKG_expanded_searoutes: "Sécuriser les routes maritimes"
 HKG_expanded_searoutes_desc: "La prospérité de Hong Kong repose sur des voies maritimes ouvertes. L'administration approfondit les liens commerciaux avec ses voisins maritimes pour les maintenir sûres."
 HKG_expanded_inland_routes: "Étendre les liaisons intérieures"
 HKG_expanded_inland_routes_desc: "Au-delà du havre, Hong Kong renforce les liaisons ferroviaires et routières qui la relient au continent et alimentent son industrie."
 HKG_offshore_industry: "Développer l’industrie offshore"
 HKG_offshore_industry_desc: "Le foncier à Hong Kong est rare et cher. La ville se tourne vers des sites gagnés sur la mer et offshore pour faire place à de nouveaux complexes industriels."
 HKG_offshore_industry2: "Développer l’industrie offshore"
 HKG_offshore_industry2_desc: "Le programme industriel offshore fait ses preuves. De nouveaux remblais et constructions poussent la base manufacturière de Hong Kong plus loin sur l'eau."
 HKG_housing_policy_modifier: "Politique du logement"
 HKG_housing_policy_modifier_desc: "Le poids cumulé des décisions de logement de Hong Kong, ressenti dans la construction, les caisses publiques et la patience de son peuple. Chaque étape du programme de logement déplace ces chiffres en mieux ou en pire."
 HKG_small_house_policy: "Réformer la Small House Policy"
 HKG_small_house_policy_desc: "La Small House Policy de l'ère coloniale accorde aux villageois indigènes des Nouveaux Territoires le droit de construire une maison basse sur des terres ancestrales. La réformer libère de vastes étendues pour un développement plus dense, mais l'establishment rural résistera à tout changement de ses privilèges hérités."
 HKG_brownfield_consolidation: "Consolider les friches"
 HKG_brownfield_consolidation_desc: "Des centaines d'hectares dans les Nouveaux Territoires sont occupés par des cours de stockage à ciel ouvert, des ferrailles et des parcs à conteneurs. Consolider ces friches en installations à plusieurs étages libère le sol pour le logement sans une seule barge de poldérisation."
 HKG_revitalise_private_market: "Revitaliser le marché privé"
 HKG_revitalise_private_market_desc: "La concurrence publique écartée, le gouvernement se tourne vers les promoteurs. Autorisations accélérées, coefficients d'occupation assouplis et incitations fiscales sont offerts pour mettre plus vite des logements privés sur le marché."
 HKG_relax_mortgage_rules: "Assouplir les règles hypothécaires"
 HKG_relax_mortgage_rules_desc: "L'autorité monétaire assouplit les ratios prêt-valeur et les seuils de tests de résistance. Les primo-accédants peuvent enfin franchir l'obstacle de l'apport, bien que les critiques mettent en garde contre l'effet de levier chargé sur les bilans des ménages."
 HKG_vacancy_tax: "Imposer une taxe sur les vacances"
 HKG_vacancy_tax_desc: "Un prélèvement punitif sur les logements neufs invendus et inoccupés. Les promoteurs ne peuvent plus distiller les unités achevées sur le marché pour maintenir les prix élevés ; l'entreposage spéculatif de logements s'achève."
 HKG_light_public_housing: "Logement public léger"
 HKG_light_public_housing_desc: "Cités préfabriquées, modulaires, bâties sur des terrains publics inoccupés comme palliatif pour les familles coincées sur la liste d'attente. Bon marché et rapides à ériger, elles achètent à l'Autorité du logement les années nécessaires à bâtir pour de bon."
 HKG_tenancy_control: "Réglementer les appartements subdivisés"
 HKG_tenancy_control_desc: "Plafonds de loyer, baux écrits obligatoires et normes minimales sont imposés aux tristement célèbres unités subdivisées de la ville. Les propriétaires perdent les mains libres ; les dizaines de milliers coincés dans des cubicles cloisonnés gagnent une mesure de protection."
 HKG_starter_homes_scheme: "Programme de maisons de démarrage"
 HKG_starter_homes_scheme_desc: "Un nouveau palier de propriété destiné aux jeunes professionnels exclus à la fois du logement public et du marché privé. Vendu sous le prix du marché avec des restrictions de revente, le dispositif reconstruit le premier barreau de l'échelle immobilière."
 HKG_artificial_islands: "Programme d'îles artificielles"
 HKG_artificial_islands_desc: "Un programme d'îles artificielles à grande échelle dans les eaux centrales, conçu pour loger des centaines de milliers de personnes et ancrer un nouveau district métropolitain. Le coût se chiffre en centaines de milliards et les objections environnementales sont féroces, mais le gain de terre utilisable est sans égal."
 HKG_northern_metropolis: "La métropole du Nord"
 HKG_northern_metropolis_desc: "Un plan de développement d'envergure pour les Nouveaux Territoires bordant Shenzhen, tissant Hong Kong dans la Grande baie. Nouvelles villes, liaisons ferroviaires et ceinture d'innovation sont prévus le long de la frontière nord."
 HKG_country_park_periphery: "Développer la périphérie des parcs de campagne"
 HKG_country_park_periphery_desc: "Les franges les moins précieuses écologiquement des parcs de campagne protégés sont ouvertes à la construction. Les conservationnistes sont atterrés par le précédent ; le gouvernement insiste que la terre est trop précieuse pour rester en jachère au milieu d'une crise du logement."
 HKG_redevelop_old_estates: "Réaménager les cités vieillissantes"
 HKG_redevelop_old_estates_desc: "Les plus anciennes cités publiques, bâties aux décennies de boom et désormais en déclin, sont démolies et reconstruites à densité moderne. Les résidents sont relogés ; le même emprise produit bien plus de logements."
 HKG_abolish_subdivided_flats: "Abolir les appartements subdivisés"
 HKG_abolish_subdivided_flats_desc: "Assez de logements neufs enfin en ligne, le gouvernement passe à l'interdiction des cubicles subdivisés et cages à lapins qui ont honte la ville pendant une génération. L'ère des tenements cloisonnés s'achève."
 HKG_urban_renewal_push: "Renforcer l'Autorité de rénovation urbaine"
 HKG_urban_renewal_push_desc: "L'Autorité de rénovation urbaine reçoit des pouvoirs d'expropriation élargis et un plus grand coffre de guerre pour raser et reconstruire les quartiers dégradés. Le vieux Kowloon et le front de mer sont refaits pâté par pâté."
 HKG_smart_city_housing: "Logement urbain intelligent"
 HKG_smart_city_housing_desc: "Les nouvelles cités sont câblées dès le sol : transport intégré, refroidissement de district et gouvernance numérique. Le parc de logements de Hong Kong devient une vitrine des ambitions de ville intelligente de la Grande baie."
 HKG_housing_for_all: "Un toit pour chaque Hongkongais"
 HKG_housing_for_all_desc: "La crise de plusieurs décennies est déclarée close. La liste d'attente est vidée, les appartements subdivisés ont disparu, et la propriété est de nouveau à portée d'une famille ordinaire. Une génération qui a grandi résignée à louer peut enfin aspirer à un foyer à soi."
 HKG_naval_contracts_category_desc: "Construisez des navires de guerre pour Pékin et livrez-les à temps pour élever le crédit de Hong Kong auprès du continent.\n§YPour livrer un navire, il doit se trouver dans votre flotte de réserve. Un navire affecté à une task force ne peut pas être livré. Déplacez-le d'abord en réserve.§!"
 HKG_contract_acquire_pearl_river: "Pétitionner pour le delta de la rivière des Perles"
 HKG_contract_acquire_pearl_river_desc: "Les chantiers de Hong Kong ont servi Pékin avec fidélité et gagné toute la confiance du continent. Usez de ce crédit pour demander à la Commission militaire centrale de céder le delta de la rivière des Perles, doublant la base industrielle de la ville."
 HKG_contract_max_standing_tt: "Notre crédit auprès du continent doit être à son maximum"
 HKG_contract_pearl_river_accept_tt: "Pékin cède le delta de la rivière des Perles à Hong Kong"
 HKG_contract_yard_slack_tt: "Nos chantiers ont une capacité de réserve pour prendre un autre contrat et encore livrer à temps"
 HKG_contract.20.t: "Une pétition de Hong Kong"
 HKG_contract.20.d: "Hong Kong a construit notre flotte sans faille et demande désormais sa propre récompense : la cession du delta de la Rivière des Perles à son administration. Les chantiers du sud alimenteraient l'industrie de la ville, et un sous-traitant loyal deviendrait une puissance régionale. Les fonds sont déjà sur la table."
 HKG_contract.20.a: "Céder le delta de la Rivière des Perles"
 HKG_contract.20.b: "Le continent ne sera pas morcelé"
 HKG_contract.21.t: "Le delta rentre au bercail"
 HKG_contract.21.d: "Pékin a accepté. Le delta de la Rivière des Perles relève désormais de Hong Kong, ses usines et cales intégrées à l'économie de la ville. Hong Kong n'est plus une île surpeuplée, mais le cœur d'une ceinture industrielle du Sud."
 HKG_contract.21.a: "Une puissance industrielle s'élève."
 HKG_contract.22.t: "Pékin décline"
 HKG_contract.22.d: "La Commission militaire centrale a refusé de céder le delta de la Rivière des Perles. L'intégrité territoriale du continent n'est pas à vendre, si loyaux que soient les chantiers. Notre paiement a été restitué."
 HKG_contract.22.a: "Nous redemanderons le moment venu"
 HKG_contract.30.t: "Échec de la livraison"
 HKG_contract.30.d: "Aucun navire n'a été transféré. Le bâtiment choisi pour la livraison est affecté à une force opérationnelle, et un navire amiral ne peut être transféré.\n§YPlacez le navire dans votre flotte de réserve, puis utilisez à nouveau la décision de livraison.§! Aucun crédit de contrat n'a été accordé."
 HKG_contract.30.a: "Le passer en réserve et réessayer"
 HKG_contract_resource_access: "Ligne d'approvisionnement du continent"
 HKG_contract_resource_access_desc: "Un contrat d'approvisionnement naval actif ouvre un accès préférentiel aux chaînes d'approvisionnement du continent. Pékin achemine des matières premières vers les chantiers de la ville à une fraction du coût habituel tant que les carnets restent pleins."
 HKG_contract_resource_access_tt: "§GLes ressources importées de Chine sont bien moins chères tant que le contrat court.§!"
 HKG_contract_shipbuilding_legacy: "Héritage de la construction navale"
 HKG_contract_shipbuilding_legacy_desc: "Chaque navire de guerre livré au continent affine les chantiers de Hong Kong. Chaque commande achevée ajoute 1 % permanent à la production des docks navals."
 HKG_mainland_resource_supply: "Approvisionnement en ressources du continent"
 HKG_mainland_resource_supply_desc: "Pékin détourne pétrole, acier, métaux légers, métaux précieux, composites et microprocesseurs du continent pour que les chantiers de la ville travaillent à ses contrats navals. Hong Kong n'en produit presque aucun, si bien que ce flux garanti rend possible la construction de navires de guerre pour le continent. L'approvisionnement ne dure que tant qu'un contrat est actif."
 HKG_mainland_resource_supply_tt: "§YCes ressources sont prélevées directement sur le stock de la Chine, et seulement tant qu'un contrat est actif.§!"
 CHI_hong_kong_resource_drain: "Ressources pour Hong Kong"
 CHI_hong_kong_resource_drain_desc: "Pétrole, acier, métaux légers, métaux précieux, composites et microprocesseurs sont acheminés vers le sud pour que les chantiers de Hong Kong travaillent à un contrat continental. Cette production détournée n'est plus disponible pour l'industrie du continent."
 CHI_hong_kong_resource_drain_tt: "§RCes ressources sont détournées vers Hong Kong tant que le contrat court.§!"
 HKG_support_the_business: "Soutenir le monde des affaires"
 HKG_support_the_business_desc: "Allègements fiscaux, déréglementation et crédit bon marché canalisent le capital de la ville droit dans les usines. La production s'envole, même si les cadeaux tendent le budget et froissent des plumes politiques."
 legco_motion_reform_status_quo: "Maintenir le statu quo électoral"
 legco_motion_reform_gradual: "Réforme électorale graduelle et ordonnée"
 legco_motion_reform_universal: "Suffrage universel"
 HKG_china_dominant_influence_tt: "§Y[CHI.GetNameWithFlag]§! est le premier influenceur dans [ROOT.GetNameWithFlag] avec plus de 80 % d'influence"