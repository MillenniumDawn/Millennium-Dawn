 SAU_prepare_defence_iraq_tt: "[IRQ.GetFlag]§HАрмия укрепляет иракскую границу. +5% к обороне Ирака во время правления Саддама.§!"
 SAU_proj_alula_done_tt: "[SAU.GetFlag]§GAlUla приветствует весь мир в Хегре. Саудовский туризм, связанный с культурным наследием, переживает расцвет.§!"
 SAU_proj_amaala_done_tt: "[SAU.GetFlag]§GAmaala принимает первых гостей. Оздоровительный туризм пускает корни на побережье Саудовской Аравии.§!"
 SAU_proj_diriyah_done_tt: "[SAU.GetFlag]§GВорота Дирии открыты. Королевство демонстрирует свою историю.§! "
 SAU_proj_green_riyadh_done_tt: "[SAU.GetFlag]§GВ зеленом Эр-Рияде приживаются молодые саженцы. Воздух в столице начинает меняться.§!"
 SAU_proj_jeddah_central_done_tt: "[SAU.GetFlag]§GЦентральный район Джидды преображает сердце старого портового города. Ворота на Красное море возрождаются.§! "
 SAU_proj_king_salman_park_done_tt: "[SAU.GetFlag]§GПарк имени короля Салмана открывает свои двери. Эр-Рияд становится немного зеленее.§! "
 SAU_proj_neom_done_tt: "[SAU.GetFlag]§GNEOM: Первые районы вырастают из пустыни. Началось строительство нового Королевства.§!"
 SAU_proj_new_murabba_done_tt: "[SAU.GetFlag]§GМукааб возвышается над Новой Мураббой. У Эр-Рияда есть своя невозможная достопримечательность.§! "
 SAU_proj_oxagon_done_tt: "[SAU.GetFlag]§GВводятся в эксплуатацию порт и заводы компании Oxagon, что формирует промышленную базу NEOM.§! "
 SAU_proj_qiddiya_done_tt: "[SAU.GetFlag]§GQiddiya распахивает свои ворота. В Эр-Рияде наконец-то появилось место для игр.§!"
 SAU_proj_red_sea_done_tt: "[SAU.GetFlag]§GПроект «Красное море» открывает свои первые курорты. Королевство теперь продает не только нефть, но и береговую линию.§!"
 SAU_proj_roshn_done_tt: "Первые жилые комплексы [SAU.GetFlag]§GROSHN переданы в собственность. Ключи получает целое поколение саудовцев.§!"
 SAU_proj_sindalah_done_tt: "[SAU.GetFlag]§GСиндала приветствует свои первые яхты. NEOM наконец-то хочет показать миру что-то новое.§!"
 SAU_proj_soudah_peaks_done_tt: "[SAU.GetFlag]§GПики Судаха открываются над облаками. Асир становится летней резиденцией королевства.§!"
