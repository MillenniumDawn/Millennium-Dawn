 ENG_scottish_referendum_pressure: "Pedidos por um Referendo Escocês"
 ENG_scottish_referendum_pressure_desc: "O Parlamento Escocês tem maioria pró-independência e a defesa da União já não é feita em lugar algum onde o público possa ouvi-la. Um projeto de lei do referendo está sendo redigido em Holyrood. Westminster tem um ano para fazer a questão constitucional parecer menos urgente do que a conta de luz, seja comprando boa vontade na Escócia, seja tornando as finanças escocesas visivelmente dependentes do Tesouro. Se a pressão ainda estiver acima de 60 quando a campanha amadurecer, a demanda se torna formal e teremos de respondê-la."
 ENG_scottish_pressure_defused_tt: "A pressão pela independência escocesa está abaixo de §G50§!"
 ENG_north_irish_referendum_pressure: "Pedidos por um Plebiscito de Fronteira"
 ENG_north_irish_referendum_pressure_desc: "Os partidos nacionalistas detêm o fiel da balança em Stormont e pressionam o Secretário de Estado a marcar uma data para um plebiscito de fronteira. A tensão sectária e a capacidade da Província de se sustentar estão ambas em jogo, e a República observa. Westminster tem um ano para reduzir os números antes que a demanda se torne formal."
 ENG_north_irish_pressure_defused_tt: "A pressão pela independência norte-irlandesa está abaixo de §G50§!"
 ENG_welsh_referendum_pressure: "Pedidos por um Referendo Galês"
 ENG_welsh_referendum_pressure_desc: "Uma maioria pró-independência no Senedd prepara um projeto de referendo próprio. A independência galesa foi por muito tempo tratada como algo pouco sério em Londres justamente porque as contas nunca fechavam; esse argumento só vale enquanto as contas ainda forem nossas para fazer. Temos um ano para reduzir a pressão antes que a demanda se torne formal."
 ENG_welsh_pressure_defused_tt: "A pressão pela independência galesa está abaixo de §G50§!"
 ENG_decommission_tension_tt: "A Tensão Sectária está abaixo de §G15§! (atualmente §Y[?ENG_north_irish_agitation|0]§!)"
 ENG_decommission_dependency_tt: "A Dependência Norte-Irlandesa está acima de §G60§! (atualmente §Y[?ENG_north_irish_dependency|0]§!)"
 ENG_decommission_unemployment_tt: "O Desemprego está abaixo de §G10%§! (atualmente §Y[?total_unemployed_percentage_display|%]§!)"
 ENG_border_poll_needs_peace_tt: "A §YCampanha Dissidente do IRA§! foi desativada"
 ENG_border_poll_nationalism_tt: "O Nacionalismo Norte-Irlandês está acima de §G55§! (atualmente §Y[?ENG_north_irish_nationalists|0]§!)"
