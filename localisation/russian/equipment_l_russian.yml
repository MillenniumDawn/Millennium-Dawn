 OMA_infantry_weapons_2_desc: "G3A3 — самая известная модификация винтовки G3. Она оснащена новыми усовершенствованными задними барабанными прицелами с улучшенной мушкой, пламегасителем/дульным тормозом, фиксированным прикладом из цельного пластика и пластиковым цевьём, не соприкасающимся со свободно вывешенным стволом. Цевьё выпускалось в узком вентилируемом и в широком исполнении. Последнее позволяет устанавливать сошки для повышения устойчивости."
 OMA_infantry_weapons_3_desc: "Разработка винтовки M16A2 была первоначально запрошена Корпусом морской пехоты США по итогам боевого опыта во Вьетнаме с XM16E1 и M16A1. Она была официально принята на вооружение Министерством обороны под обозначением «Винтовка США калибра 5,56 мм, M16A2» в 1982 году. Морская пехота стала первым видом Вооружённых сил США, принявшим её на вооружение, в начале/середине 1980-х годов, а Армия США последовала её примеру в конце 1980-х."
 OMA_infantry_weapons_4_desc: "Heckler & Koch G36 (Gewehr 36) — штурмовая винтовка под патрон 5,56x45 мм, разработанная в начале 1990-х годов немецким производителем оружия Heckler & Koch на замену более тяжёлым моделям G3 под патрон 7,62x51 мм. Она была принята на вооружение бундесвера в середине 90-х, заменив G3. С тех пор она также стала популярным экспортным товаром, и G36 состоит на вооружении военных и полицейских подразделений ряда стран, включая Германию, Испанию и Великобританию."
 OMA_infantry_weapons_5_desc: "Карабин M4 — более короткий и лёгкий вариант штурмовой винтовки M16. M4 — магазинный карабин под патрон 5,56x45 мм НАТО с воздушным охлаждением и газоотводной автоматикой с прямым воздействием пороховых газов на затворную раму. Он имеет ствол длиной 14,5 дюйма (370 мм) и телескопический приклад."
