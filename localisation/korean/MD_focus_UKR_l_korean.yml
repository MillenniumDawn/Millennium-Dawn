 UKR_equipment_develop_domestic_modernize_stuhna_p_atgm: "§YRK-2 '스투흐나-P'§! 대전차 유도 미사일 현대화"
 UKR_equipment_develop_domestic_modernize_stuhna_p_atgm_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_modernize_stuhna_p_for_tooltip\n\n\n\n\n\n\n\n\n§W§YRK-2 '스투흐나-P'§! 대전차 유도 미사일 복합체를 더욱 현대화하여 현재의 위협에 더 잘 대응할 수 있습니다.\n이번 현대화로 체계의 원격 조작 장치에 화면 밝기 조절, 통합 체계 상태 진단, 열상 장비 영상 직접 표시 등 상당한 인체공학적·기술적 개선이 이루어집니다.\n또한 실시간 지도 표시 기능을 갖춘 통합 GPS 항법이 도입되어 발사기의 교전 반경, 방향, 디지털 거리 측정 눈금자가 조작수 인터페이스에 직접 표시됩니다.\n------------------\n이 결정은 같은 장비 범주의 다음 §Y1§!개 결정을 해금하기 위한 §R선행 조건§!입니다. 이 결정을 §R건너뛰면§! 이후 결정을 완료할 기회를 §R잃게§! 됩니다.§!"
 UKR_equipment_develop_domestic_modernize_stuhna_p_atgm_flag: "완료된 결정: §YRK-2 '스투흐나-P' 대전차 유도 미사일 현대화§!"
 ukraine_equipment_develop_domestic_atgm.5.name: "RK-2M '스투흐나-PM' 대전차 유도 미사일: 개발 완료"
 ukraine_equipment_develop_domestic_atgm.5.desc: "루치 설계국의 훌륭한 사람들이 RK-2M '스투흐나-PM' 대전차 유도 미사일 개발을 마쳤으며, 이 신형 체계를 우리 [ROOT.GetFlag] [ROOT.GetAdjective] 군에 도입하기 위한 다음 단계를 선택할 수 있습니다."
 ukraine_equipment_develop_domestic_atgm.5.a: "설계만 확보한다"
 ukraine_equipment_develop_domestic_atgm.5.b: "본격적인 현대화를 개시한다"
 UKR_equipment_develop_domestic_bulava_atgm_with_tech: "§Y'불라바'§! 차세대 대전차 유도 미사일 개발"
 UKR_equipment_develop_domestic_bulava_atgm_with_tech_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_bulava_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y'불라바'§!는 발사 후 망각 능력을 갖춘 미래형 대전차 유도 미사일 복합체로 제안된 무기입니다.\n오랫동안 기다려 온 이 기능을 갖추게 되며, 기동성과 살상력도 더 뛰어나다는 소문이 있습니다.\n이제 완전히 무관한 소식을 전합니다. 신과도 같은 미국제 §Y'재블린'§! 대전차 유도 미사일 복합체를 마침내 입수해 시험하게 된 것은 우리 군 전체의 큰 영광입니다!\n------------------\n§Y[ROOT.GetFlag][ROOT.GetName]§!이(가) §Y$Anti_tank_3$§! 기술을 연구했으므로 이 결정의 요구 조건이 §G완화되었습니다§!.\n\n이 결정은 §YObject 477A1 '노타'§! 현대화의 §R선행 조건§!입니다. §Y'불라바'§! 결정 두 가지를 모두 §R건너뛰면§! 해당 결정을 완료할 기회를 §R잃게§! 됩니다.§!"
 UKR_equipment_develop_domestic_bulava_atgm_without_tech: "§Y'불라바'§! 차세대 대전차 유도 미사일 개발"
 UKR_equipment_develop_domestic_bulava_atgm_without_tech_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_bulava_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y'불라바'§!는 발사 후 망각 능력을 갖춘 미래형 대전차 유도 미사일 복합체로 제안된 무기입니다.\n오랫동안 기다려 온 이 기능을 갖추게 되며, 기동성과 살상력도 더 뛰어나다는 소문이 있습니다.\n이제 완전히 무관한 소식을 전합니다. 신과도 같은 미국제 §Y'재블린'§! 대전차 유도 미사일 복합체를 마침내 입수해 시험하게 된 것은 우리 군 전체의 큰 영광입니다!\n------------------\n§Y[ROOT.GetFlag][ROOT.GetName]§!이(가) §Y$Anti_tank_3$§! 기술을 연구하면 이 결정의 요구 조건이 크게 §G완화됩니다§!.\n\n이 결정은 §YObject 477A1 '노타'§! 현대화의 §R선행 조건§!입니다. §Y'불라바'§! 결정 두 가지를 모두 §R건너뛰면§! 해당 결정을 완료할 기회를 §R잃게§! 됩니다.§!"
 UKR_equipment_develop_domestic_bulava_atgm_flag: "완료된 결정: §Y'불라바' 차세대 대전차 유도 미사일 개발§!"
 UKR_equipment_develop_domestic_sokil_300: "§Y'소킬-300'§! 공격 드론 개발"
 UKR_equipment_develop_domestic_sokil_300_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_sokil_300_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y'소킬-300'§!은 §L루치 설계국§!이 개발한 §Y[ROOT.GetFlag]우크라이나§!제 중고도 장기체공 공격 드론입니다.\n우리 공격 헬리콥터와 같은 §Y'바리어-V'§! 대전차 유도 미사일을 탑재하며, 정찰 장비 덕분에 전선 훨씬 후방의 표적을 찾아 타격할 수 있습니다.\n------------------\n이 결정에는 완료된 §Y'바리어'§! 대전차 유도 미사일 결정이 필요합니다.§!"
 UKR_equipment_develop_domestic_kombat_konus_atgm: "§Y'콤바트'§! 및 §Y'코누스'§! 전차 발사 대전차 유도 미사일 개발"
 UKR_equipment_develop_domestic_kombat_konus_atgm_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_kombat_konus_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y'콤바트'§!는 §YT-64§!, §YT-72§!, §YT-80§!, §YT-84§! 전차의 주포로 발사하도록 §L루치 설계국§!이 개발한 §Y[ROOT.GetFlag]우크라이나§!제 125mm 대전차 유도 미사일입니다. §Y'코누스'§!는 120mm 포용 대응 모델입니다.\n둘 다 2세대 레이저 빔 라이딩 미사일로, 우리 전차가 포탄의 사거리를 훨씬 넘어서는 거리의 장갑 표적을 타격할 수 있게 해 줍니다.\n------------------\n이 결정은 전차가 주포로 유도 미사일을 발사하는 모든 전차 결정의 §R선행 조건§!입니다.§!"
 UKR_equipment_develop_domestic_kombat_konus_atgm_flag: "완료된 결정: §Y전차 발사식 대전차 유도 미사일 '콤바트'와 '코누스' 개발§!"
 UKR_equipment_develop_domestic_kombat_konus_atgm_mission: "§Y'콤바트'§!와 §Y'코누스'§!의 마지막 기회"
 UKR_equipment_develop_domestic_kombat_konus_atgm_mission_desc: "§W우리는 §Y'콤바트'§!와 §Y'코누스'§! 계획의 예정된 착수 시기를 놓쳤고, 그래서 §L루치 설계국§!이 자체 일정에 따라 전차 발사식 미사일을 완성할 것입니다. 이 임무가 끝나면 작업이 완료되며 그 비용은 국고에서 빠져나갑니다. 포로 유도 미사일을 발사하는 모든 전차 결정에는 이 미사일이 필요합니다.§!"
 ukraine_equipment_develop_domestic_atgm.13.name: "'콤바트'와 '코누스' 대전차 유도 미사일: 개발 완료"
 ukraine_equipment_develop_domestic_atgm.13.desc: "루치 설계국이 '콤바트'와 '코누스' 전차 발사식 미사일의 개발을 마쳤습니다. 이제 우리 전차 설계자들은 차량에 유도 미사일을 발사하는 포를 장착할 수 있습니다."
 ukraine_equipment_develop_domestic_atgm.13.a: "전차 설계자들에게 넘긴다"
 UKR_equipment_develop_domestic_bm3_shturm: "§YBM-3 '시투름'§! 전투 모듈 개발"
 UKR_equipment_develop_domestic_bm3_shturm_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_bm3_shturm_for_tooltip\n\n\n\n\n\n\n\n\n§W§YBM-3 '시투름'§!은 §L하르키우 모로조프 설계국§!이 병력 수송 장갑차와 보병전투차를 위해 개발한 §Y[ROOT.GetFlag]우크라이나§!의 전투 모듈입니다.\n30 mm 기관포, 동축 기관총, 자동 유탄발사기, 그리고 §Y'바리예르'§! 대전차 유도 미사일 발사기를 결합했습니다.\n------------------\n이 결정은 §YBTR-3E1§! 및 §YBTR-4§! 결정의 §R선행 조건§!입니다.§!"
 UKR_equipment_develop_domestic_bm3_shturm_flag: "완료된 결정: §YBM-3 '시투름' 전투 모듈 개발§!"
 UKR_equipment_develop_domestic_stuhna_p_vehicle: "차량 차체에 §YRK-2 '스투흐나-P'§! 탑재"
 UKR_equipment_develop_domestic_stuhna_p_vehicle_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_stuhna_p_vehicle_for_tooltip\n\n\n\n\n\n\n\n\n§W§YRK-2 '스투흐나-P'§! 발사기는 경장갑차와 MRAP에 탑재해 기동성 높은 자주 대전차 차량으로 바꿀 수 있습니다.\n승무원은 장갑의 보호를 받으며 미사일을 발사하고, 적이 응사하기 전에 사격 진지를 벗어납니다.\n------------------\n연구를 마친 차체마다 전용 차량이 하나씩 생깁니다. §Y2005§!년부터는 §Y도조르-B§!와 §Y코자크§!, §Y2015§!년부터는 §Y노바토르§!와 §Y코자크-2§!입니다. 2015년형 차체가 더 신뢰할 만합니다.§!"
 UKR_equipment_develop_domestic_stuhna_p_vehicle_chassis_tt: "§Y2005§!년형 또는 §Y2015§!년형 다목적 차량이나 MRAP 차체를 연구함"
 UKR_equipment_export_skif_buyer_money_0_2_tt: "구매국이 첫 물량 대금을 치를 £treasury §Y0.2§! 십억 이상을 보유하고 있어야 함"
 UKR_equipment_export_skif_buyer_money_0_4_tt: "구매국이 첫 물량 대금을 치를 £treasury §Y0.4§! 십억 이상을 보유하고 있어야 함"
 UKR_equipment_export_skif_buyer_money_0_1_tt: "구매국이 첫 물량 대금을 치를 £treasury §Y0.1§! 십억 이상을 보유하고 있어야 함"
 UKR_equipment_export_skif_azerbaijan: "[AZE.GetNameWithFlag]에 §Y'스키프'§! 대전차 유도 미사일 제안"
 UKR_equipment_export_skif_azerbaijan_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_skif_export_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[AZE.GetNameWithFlag]§!은(는) 자국군을 위한 현대적인 대전차 무기를 찾고 있습니다. 우리 §YRK-2 '스투흐나-P'§!의 수출형인 §Y'스키프'§!가 이 요구에 부합합니다.§!"
 UKR_equipment_export_skif_saudi_arabia: "[SAU.GetNameWithFlag]에 §Y'스키프'§! 대전차 유도 미사일 제안"
 UKR_equipment_export_skif_saudi_arabia_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_skif_export_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[SAU.GetNameWithFlag]§!은(는) 예멘 작전에 쓸 대전차 무기를 사들이고 있습니다. 우리 §YRK-2 '스투흐나-P'§!의 수출형인 §Y'스키프'§!가 이 계약을 따낼 수 있습니다.§!"
 UKR_equipment_export_skif_georgia: "[GEO.GetNameWithFlag]에 §Y'스키프'§! 대전차 유도 미사일 제안"
 UKR_equipment_export_skif_georgia_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_skif_export_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[GEO.GetNameWithFlag]§!은(는) 기갑 공격에 대한 방어를 강화하려 합니다. 우리 §YRK-2 '스투흐나-P'§!의 수출형인 §Y'스키프'§!가 이 요구에 부합합니다.§!"
 ukraine_equipment_develop_domestic_atgm.10.name: "[AZE.GetName]과(와)의 '스키프' 계약"
 ukraine_equipment_develop_domestic_atgm.10.desc: "[AZE.GetNameWithFlag]의 협상단이 우리 §Y'스키프'§! 대전차 유도 미사일을 구매하기로 합의했습니다. 첫 물량의 규모와 해당 체계를 라이선스 생산하도록 허용할지는 우리가 정할 수 있습니다."
