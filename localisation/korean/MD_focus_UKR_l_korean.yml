 ukr_modernize_sov_equipment_old_gear_orders_tt: "구매국은 우리에 대한 호감도가 §Y10§! 이상이면(이미 우리 보관 물자를 산 적이 있다면 §Y0§!) 아래 묶음 중 하나를 남은 물량 전부 사들입니다.\n• §YBRDM-1§! 정찰 장갑차\n• 견인포: §YM-46§!, §YM-30§!\n• 소화기: §YAK-47§!, §Y모신나강§!, §YSKS§!, §YSPG-9§!, §Y9K32 스트렐라-2§!\n가격은 남은 물량에 따라 달라집니다. §Y[SUD.GetNameWithFlag]§!에 판매하면 §R나토가 분노합니다§!."
