 STATS_TITLE: "Statistik"
 GDP_TOTAL: "BIP"
 GDP_TOTAL_DESC: "Unser §Y Bruttoinlandsprodukt §! (BIP) ist ein Wertmaß für alle Produkte und Dienstleistungen, die in einem Land hergestellt bzw. erbracht werden. Millennium Dawn verwendet das BIP, das um die Kaufkraftparität (PPP) angepasst wurde, da diese Kennzahl die lokalen wirtschaftlichen Bedingungen berücksichtigt und dadurch Ländervergleiche aussagekräftiger macht."
 NUM_GDP_TOTAL: "$$§Y [?ROOT.gdp_total|1] §!b"
 NUM_GDP_TOTAL_DESC: "Unser §Y BIP §! beträgt derzeit $§Y [?ROOT.gdp_total|3] §! Milliarden.\n\n Aktuelle §Y vierteljährliche BIP-Wachstumsrate §!: [?last_quarter_gdp_growth_rate|%Y].\n\n Hinweis: Je höher deine §Y Wachstumsrate des vierteljährlichen BIP §! ist, desto wahrscheinlicher ist es, dass positive wirtschaftliche Ereignisse eintreten."
 NUM_GDP_TOTAL_DELAYED_DESC: "Ungefährer Beitrag der Industriezweige in Prozent:\n§P Zivile Fabriken §!: [?ROOT.civil_fac_percent|%]\n§O Militärfabriken §!: [?ROOT.military_factory_total_percent|%]\n§B Marinewerften§!: [?ROOT.naval_factory_total_percent|%]\n§C Bürokomplexe §!: [?ROOT.office_fac_percent|%]\n§G Landwirtschaft ohne Kommerzialisierung §!: [?ROOT.agriculture_percent|%]\n§Y Kommerzialisierte Landwirtschaftsbezirke §!: [?ROOT.agriculture_district_fac_percent|%]\n§Y Mikrochipfabriken §!: [?ROOT.microchip_plant_percent|%]\n§Y Verbundwerkstofffabriken §!: [?ROOT.composite_plant_percent|%]\n§Y Synthetische Raffinerien §!: [?ROOT.synthetic_refinery_percent|%]\n§G Rohstoffförderung§!: [?ROOT.resources_percent|%]\n§Y Infrastruktur §!: [?ROOT.infrastructure_gdp_percent|%]\n§P Gesundheitswesen§!: [?ROOT.healthcare_gdp_percent|%]"
 GDP_PER_CAPITA: "BIP pro Kopf"
 GDP_PER_CAPITA_DESC: "Diese Zahl stellt unser §Y BIP pro Kopf §! bzw. §Y BIP/K §! dar. Sie beschreibt die Wirtschaftsleistung jeder einzelnen Person im Land.\n\nAktuelle §Y Wachstumsrate des vierteljährlichen BIP pro Kopf §!: [?last_quarter_gdpc_growth_rate|%Y].\n\n Hinweis: Je höher deine §Y Wachstumsrate des vierteljährlichen BIP pro Kopf §! ist, desto wahrscheinlicher ist es, dass positive wirtschaftliche Ereignisse eintreten. Gleichzeitig kann die §R Inflation §! stärker ansteigen, wenn sie nicht kontrolliert wird."
 GDP_PER_CAPITA_DELAYED_DESC: "Current impact of §YGDP per Capita§! on our nation:\nConstruction Speed: [?production_speed_buildings_factor_gdp_modifier|%+]\nMonthly Population: [?monthly_population_gdp_modifier|%+1]\nResearch Speed: [?research_speed_factor_gdp_modifier|%+]\nStability: [?stability_factor_gdp_modifier|%+]\nTotal Workforce: [?total_workforce_gdp_c_modifier_var|%+]\nFossil Powerplant Construction Speed: [?fossil_pp_construction_gdp_c_modifier_var|%+]\n"
 NUM_GDP_PER_CAPITA: "$$§Y[?ROOT.gdp_per_capita|3]§!k"
 NUM_GDP_PER_CAPITA_DESC: "Unser §Y BIP/K §! beträgt derzeit $§Y [?ROOT.gdp_per_capita|3] §! Tausend."
 PRODUCTIVITY: "Produktivität"
 PRODUCTIVITY_DESC: "Diese Zahl stellt die §Y Produktivität §! unseres Landes dar."
 NUM_PRODUCTIVITY_DELAYED_DESC: "Aktuelles monatliches Produktivitätswachstum: [?productivity_growth_scaled|3+]\n\nAuswirkungen der Produktivität:\n§YFabrikproduktion:§! [?productivity_tax_effect_display|%+1]\n§YWerftproduktion:§! [?productivity_tax_effect_display|%+1]\n§YBaugeschwindigkeit:§! [?productivity_tax_effect_display|%+1]\n§YUnternehmenssteuer:§! [?productivity_tax_effect_display|%+1]\n§Y£construction_speed_texticon §YKommerzialisierte Landwirtschaftsbezirke§! Baugeschwindigkeit:§! [?agriculture_district_output_var|%+1]"
 NUM_PRODUCTIVITY: "§Y[?ROOT.overall_productivity|3]§!"
 NUM_PRODUCTIVITY_DESC: "§Y Produktivität §! ist der Wert, der die Produktion innerhalb unseres Landes bestimmt. Der Wert ergibt sich als Gesamtwert aus der Produktivität jedes Bundesstaates, geteilt durch die Bevölkerung unseres Landes. §Y Produktivität §! wirkt als Multiplikator auf alle Quellen des Bruttoinlandsprodukts (BIP), die Unternehmenssteuer und die Produktion jeder Fabrik. Wenn deine §Y Produktivität §! höher ist als die §Y Globale durchschnittliche Produktivität §!, erhältst du größere Boni, die dein Wirtschaftswachstum und die Produktion aller deiner Gebäude steigern. Wenn sie niedriger ist, werden diese Boni zu Mali.\n\nDer Balken bleibt bei 1000 stehen, bis der globale Durchschnitt darüber steigt. Daher musst du mit dem weltweiten Wachstum Schritt halten, damit deine Boni weiter wachsen. §YProduktivität§! steigt oder fällt jeden Monat passiv. Dieses Wachstum wird durch deinen Wirtschaftszyklus, Technologien und nationale Geisteseffekte beeinflusst und zusätzlich anhand der §Y Globalen durchschnittlichen Produktivität§! skaliert. Länder unter der §Y Globalen durchschnittlichen Produktivität§! werden ein schnelleres Wachstum ihrer §YProduktivität§! erleben, während Länder über dem Durchschnitt langsamer wachsen.\n\nDie §Y Globale durchschnittliche Produktivität§! beträgt derzeit §Y[?global.average_world_productivity|3]§!\n\nUnsere §Y Produktivität§! beträgt derzeit §Y [?ROOT.overall_productivity|3]§!"
 INFLATION: "Inflation"
 INFLATION_DESC: "Diese Zahl stellt die §YInflation§! unseres Landes dar."
 NUM_INFLATION: "§Y[?ROOT.inflation_rate_var|%]§!"
 NUM_INFLATION_DESC: "§YInflation§! is the value that determines how much your nation's purchasing power is growing or decreasing in strength. The higher your inflation gets, the less purchasing power your people, and your government, have, as your money loses value. Inflation is calculated by the average of the last 4 quarters of §YQuarterly GDP/C Growth Rate§!, multiplied by your averaged §YTax Rate§!, and further adjusted by §YEconomic Cycles§!, §YPrinting Money§!, §YPolicy Rate§!, and other economic events.\n\nThe higher your average §YQuarterly GDP/C Growth Rate§! is, along with the larger your §YGDP/C§! is, the higher your inflation rate will be. Higher §YTax Rate§! will reduce inflation, while a lower rate will increase it. A Higher §YPolicy Rate§! will decrease inflation, but increase §RInterest on Debt§!, while a lower rate will do the opposite.\n\n§YEconomic Cycles§! above §YStable Growth§! will increase your §YInflation§!, simulating an increased demand for goods and spending money, while §YEconomic Cycles§! below §YStable Growth§! will decrease your §YInflation§!, simulating decreased spending money and a decreased demand for consumer goods.\n\n§YDeflation§! can occur if you end up with a negative §YInflation§! rate. §YDeflation§! can help reduce government expenses, but can also cause economic downturns, as people stop spending money as they wait for prices to fall further, potentially causing markets and businesses to §RFail§! if things deflate too much or too quickly."
 NUM_INFLATION_DELAYED_DESC: "§HLetzte 4 Quartale:§! [?ROOT.year_quarter_inflation_tracker^0|%] · [?ROOT.year_quarter_inflation_tracker^1|%] · [?ROOT.year_quarter_inflation_tracker^2|%] · [?ROOT.year_quarter_inflation_tracker^3|%]\n\nDer angezeigte Wert ist der §Ygleitende Vierquartalsdurchschnitt§! und entspricht der durchschnittlichen jährlichen Inflation. Dieser Wert wird für alle wirtschaftlichen Auswirkungen verwendet."
 POPULATION_TAX_RATE: "Einkommenssteuer der Bevölkerung"
 POPULATION_TAX_RATE_TT: "Die Bevölkerungssteuerquote umfasst alle Steuern, die der Bevölkerung auferlegt werden. Dies kann unter anderem Einkommenssteuer, Mehrwertsteuer, Verkaufssteuer und Grundsteuer umfassen.\n\n §Y Modifikatoren durch Bevölkerungssteuern:§!\n£stability_texticon Stabilität: [?stability_factor_from_population_tax|%+]"
 CORPORATE_TAX_RATE: "Unternehmenssteuer"
 CORPORATE_TAX_RATE_TT: "Die Unternehmenssteuerquote umfasst alle Steuern, die auf Unternehmen erhoben werden. Der Wert setzt sich aus Unternehmenssteuer, Arbeitgeberabgaben und weiteren Steuern zusammen.\n\n §Y Auswirkungen der Unternehmenssteuern: §! \n£consumer_goods_texticon Steuerkosten: [?consumer_goods_from_corporate_tax|%Y]\n£receiving_investment_cost_modifier_texticon §Y Kosten für ausländische Investitionen §!: [?receiving_investment_cost_form_corporate_tax|%-]\nMonatliches Produktivitätswachstum: [?productivity_growth_modifier_from_corporate_tax|+3]\n"
 CB_POLICY_RATE: "Leitzins"
 CB_POLICY_RATE_TT: "Der §Y Zentralbank-Leitzins §! ist der von der Zentralbank festgelegte Referenzzinssatz. Er bestimmt die Kosten für Kredite in der gesamten Volkswirtschaft.\n\n§Y Eine Erhöhung des Zinssatzes §! verknappt die Geldmenge, senkt dadurch die Inflation, erhöht jedoch die Kosten für Staatsschulden und bremst die wirtschaftliche Aktivität.\n§Y Eine Senkung des Zinssatzes §! fördert Kredite und Investitionen, ermöglicht jedoch einen stärkeren Anstieg der Inflation.\n\nJede Anpassung kostet §Y 25 §! £pol_power_icon und hat eine §Y 60-tägige §! Abklingzeit.\n\n§Y Aktueller Zinssatz: §! [?cb_policy_rate]%\n§Y Vierteljährliche Inflationsdämpfung: §! [?cb_policy_rate|+0]% × 0,003 pro Quartal\n§Y Zinsaufschlag für Staatsschulden: §! [?cb_policy_rate|+0]% × 0,5 Prozentpunkte auf den §Y Zinssatz §! hinzugefügt."
