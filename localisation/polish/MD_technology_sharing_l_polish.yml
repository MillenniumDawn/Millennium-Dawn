 BNL_tech_sharing_group_name: "Współpraca badawcza w ramach Beneluksu"
 BNL_tech_sharing_group_desc: "Bazując na dekadach integracji zapoczątkowanej utworzeniem Unii Gospodarczej Beneluksu, Belgia, Niderlandy i Luksemburg łączą swoje zasoby wiedzy badawczej oraz potencjał przemysłowy. Wspólne finansowanie, współdzielone laboratoria i jednolity rynek innowacji umożliwiają każdemu z partnerów korzystanie z przełomowych osiągnięć pozostałych, co przyspiesza postęp technologiczny w obrębie całej unii."
 AUKUS_Tech_Share_name: "Badania nad okrętami podwodnymi w ramach AUKUS"
 AUKUS_Tech_Share_desc: "Wielka Brytania, Stany Zjednoczone i Australia opracowują wspólny typ uderzeniowego okrętu podwodnego o napędzie jądrowym, bazując na jednolitej dokumentacji technicznej. Prace nad reaktorami, systemami sonarowymi i uzbrojeniem torpedowym są prowadzone wspólnie w zakładach w Barrow-in-Furness, stoczniach amerykańskich oraz w Osborne, dzięki czemu rozwiązania wypracowane w biurze projektowym jednego z partnerów trafiają do pozostałych dwóch."
