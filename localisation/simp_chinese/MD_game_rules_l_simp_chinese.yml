 PMR_SHERIFF: "“谢里夫”共和国"
 PMR_SHERIFF_DESC: "蒂拉斯波尔让§8谢里夫§!控股公司吞并了它所建立的那个国家，直到该公司自己的安保部门开始为共和国负责。最终，德涅斯特河沿岸共和国的统治者不再是议会，而是其最大的企业。"
 SER_AI_BEHAVIOR: "@SER 南斯拉夫"
 RULE_OPTION_MILOCEVIC_COMMI: "米洛舍维奇是个共产主义者"
 RULE_OPTION_MILOCEVIC_COMMI_AI_DESC: "斯洛博丹·米洛舍维奇顶住了对其统治的挑战，没有选择捍卫共和国残存的政权，而是带领国家重回社会主义轨道。南斯拉夫重建为社会主义联邦制国家，巴尔干地区再次拥有了马克思主义政权。"
 RULE_OPTION_MILOCEVIC_NATI: "米洛舍维奇的大塞尔维亚"
 RULE_OPTION_MILOCEVIC_NATI_AI_DESC: "斯洛博丹·米洛舍维奇幸存下来，并将国家转变为“大塞尔维亚”计划的轨道，声称所有塞尔维亚人居住的地区都属于他。南斯拉夫战争非但没有结束，反而再次爆发，所有有塞尔维亚少数民族的邻国都成为攻击目标。"
 RULE_OPTION_MILOCEVIC_FEDERATION: "米洛舍维奇的巴尔干联邦"
 RULE_OPTION_MILOCEVIC_FEDERATION_AI_DESC: "斯洛博丹·米洛舍维奇幸存下来，并重振了§8巴尔干联邦§! - 这个该地区社会主义者始终未能建立的联盟。贝尔格莱德向邻国提出加入而非征服的条件，整个半岛由此汇聚到同一屋檐下。"
 RULE_OPTION_SERBIAN_KINGDOM: "塞尔维亚王国"
 RULE_OPTION_SERBIAN_KINGDOM_AI_DESC: "米洛舍维奇被推翻，民族主义者和保皇派取而代之，§8卡拉乔尔杰维奇§!王朝重返贝尔格莱德。塞尔维亚由君主和教会统治，并以更为体面的方式追求着同样的旧诉求。"
 RULE_OPTION_SERBIAN_LIBERALS: "自由塞尔维亚"
 RULE_OPTION_SERBIAN_LIBERALS_AI_DESC: "推翻米洛舍维奇的改革者们保住了国家，并将其重建为一个自由民主国家。塞尔维亚正朝着加入欧盟的目标稳步前进，并积极解决与邻国的争端，而不是继续纠缠不清。"
 RULE_ALLOW_PLAYER_COLORED_PUPPETS: "启用千禧黎明傀儡国色彩设定"
 RULE_OPTION_MD_COLORED_PUPPETS_YES_DESC: "当该选项启用时，任何成为傀儡的国家都会自动转变为其宗主国的颜色。 （例如，如果中国傀儡印度，那么印度就会像中国一样变成红色）。"
 RULE_OPTION_MD_COLORED_PUPPETS_NO_DESC: "当禁用该选项时，国家在被傀儡时不会改变其颜色，其颜色将保持不变。"
 CUB_AI_BEHAVIOR: "@CUB 古巴"
 RULE_OPTION_GER_GREEN: "绿色总理府"
 RULE_OPTION_GER_GREEN_DESC: "§8绿党§!独立执政，并将资金用于逐步淘汰核武器、推进欧洲绿色协议和实行累进税制。德国则推动联盟东移，并与莫斯科和北京保持距离。"
 RULE_OPTION_GER_NATIONALIST: "国家民主党的统治"
 RULE_OPTION_GER_NATIONALIST_DESC: "宪政秩序崩溃，内战爆发，§8国家民主党§!趁机夺取政权，以鲜血、土地和驱逐为基础，建立起一党专政的警察国家。德国公开奉行领土收复主义，周边每一寸土地都成为其觊觎的目标。"
 RULE_OPTION_GER_SOCIALIST: "左翼崛起"
 RULE_OPTION_GER_SOCIALIST_DESC: "§8左翼党§!从联邦德国的废墟中夺取政权，将美军赶出基地，并解除了德国的武装。随后，德国强迫法国、波兰和瑞典加入工人联盟，如果拒绝，则诉诸武力。"
 RULE_OPTION_GER_MONARCHIST: "凯撒归来"
 RULE_OPTION_GER_MONARCHIST_DESC: "共和国覆灭，§8德皇§!再次加冕，建立起一个复兴的帝国。德国将瑞士、奥地利、比利时、奥斯曼和意大利的君主重新拥立回王位，并将它们联合起来，组成一个帝国集团。"
