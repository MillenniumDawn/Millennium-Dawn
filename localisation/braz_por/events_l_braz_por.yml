 isis.11302.d: "Más notícias, Califa! O chefe clérigo Abu Sufyan al-Sulami foi morto em um covarde ataque aéreo russo. Ele veio até nós da terra do Bahrein e nos deu um importante apoio religioso para o nosso Califado.\n\n                 O Califa, ele nos inspirou a todos com a bela biografia dele sobre você.\n\n                                         Que Alá aceite o martírio dele."
