consuls_of_peace_idea_ast: "Consuls of Peace"
the_australian_century_tt: "§YFast-tracks a number of proposals for new mines currently awaiting approval.§!"
kevin_rudd_desc: "Asian geopolitical expert and TV regular, Kevin Rudd has found himself the new face of the Labor movement. A character capable of juggling the stability of Howard, with the promise of the reform the nation demands, Rudd has shown a knack for balancing party interests whilst remaining in the good graces of the public. \n\nThanks to the reforms of Gough Whitlam, Rudd was able to attend university and use his education to join the Department of Foreign affairs in 1981. Experience that he's used throughout his whole career. Since then he's shot up in the party, and as a member during the revolving door era of Labor, Rudd is no stranger to cutthroat politics. Yet his optimism has pushed him to build the party anew. \n\nAttempting to broaden its appeal and correct the factionalism that has kept it stagnant for decades, the man from Queensland now holds the helm. A the position he's idolized since joining the party at 15, and one he intends to do justice."
