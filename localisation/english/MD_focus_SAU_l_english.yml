 SAU_middle_east_foregin_policy: "Middle East Policy"
 SAU_middle_east_foregin_policy_desc: "The Middle East is the kingdom's neighborhood. Every conflict, every alliance, every crisis affects Saudi security. The kingdom must lead."
 SAU_middle_east_foreign_policy_01: "GCC Leadership"
 SAU_middle_east_foreign_policy_01_desc: "Saudi Arabia leads the GCC. The smaller monarchies look to Riyadh for security and economic direction. The kingdom delivers - and dominates."
 SAU_middle_east_foreign_policy_02: "Yemen Intervention"
 SAU_middle_east_foreign_policy_02_desc: "The Yemen war consumes billions and thousands of lives. The kingdom fights the Houthis to a stalemate. Victory is elusive."
 SAU_middle_east_foreign_policy_03: "Qatar Blockade"
 SAU_middle_east_foreign_policy_03_desc: "The blockade of Qatar tests GCC unity. Three years of diplomatic warfare achieve little except demonstrating Saudi resolve."
 SAU_middle_east_foreign_policy_04: "Bahrain Protection"
 SAU_middle_east_foreign_policy_04_desc: "Bahrain is Saudi Arabia's protectorate. The King Fahd Causeway connects the islands. When Bahrain's Shia majority protests, Saudi tanks roll across."
 SAU_middle_east_foreign_policy_05: "Kuwait Alliance"
 SAU_middle_east_foreign_policy_05_desc: "Kuwait and Saudi Arabia share a border, an oil field, and a common interest in stability. The relationship is close but occasionally strained."
 SAU_middle_east_foreign_policy_06: "UAE Partnership"
 SAU_middle_east_foreign_policy_06_desc: "The UAE is Saudi Arabia's closest Gulf ally. Joint military operations, coordinated diplomacy, and shared visions of regional order."
 SAU_middle_east_foreign_policy_07: "Oman Relations"
 SAU_middle_east_foreign_policy_07_desc: "Oman maintains neutrality. The sultanate mediates between Saudi Arabia and Iran. Riyadh respects Oman's independence."
 SAU_middle_east_foreign_policy_08: "Iraq Engagement"
 SAU_middle_east_foreign_policy_08_desc: "Iraq's Shia government is close to Iran. But Saudi Arabia opens embassies, offers aid, and competes for Iraqi loyalty."
 SAU_middle_east_foreign_policy_09: "Syria Policy"
 SAU_middle_east_foreign_policy_09_desc: "Syria's civil war pits Saudi Arabia against Iran and Russia. Proxy warfare, diplomacy, and the eventual rehabilitation of Assad."
 SAU_middle_east_foreign_policy_10: "Jordan Support"
 SAU_middle_east_foreign_policy_10_desc: "Jordan is a Hashemite monarchy dependent on Saudi aid. The kingdom supports Amman financially and diplomatically."
 SAU_middle_east_foreign_policy_11: "Lebanon Influence"
 SAU_middle_east_foreign_policy_11_desc: "Lebanon is a battleground with Iran. Saudi backing for Sunni politicians confronts Iranian backing for Hezbollah. The Lebanese suffer."
 SAU_middle_east_foreign_policy_12: "Palestine Support"
 SAU_middle_east_foreign_policy_12_desc: "The Arab Peace Initiative remains the kingdom's contribution to Palestinian statehood. Aid flows to the Palestinian Authority. Rhetoric remains strong."
 SAU_middle_east_foreign_policy_13: "Egypt Bailout"
 SAU_middle_east_foreign_policy_13_desc: "Egypt's economy is on life support. Saudi billions keep it alive. The kingdom that once feared Nasser now bankrolls Cairo."
 SAU_middle_east_foreign_policy_14: "Sudan Influence"
 SAU_middle_east_foreign_policy_14_desc: "Sudan's Red Sea coast matters to Saudi Arabia. Aid, investment, and the Suakin Island deal project influence across the sea."
 SAU_middle_east_foreign_policy_15: "Libya Engagement"
 SAU_middle_east_foreign_policy_15_desc: "Libya's civil war draws in Saudi Arabia. Support for Haftar in the east. Diplomatic engagement with the UN process. The kingdom plays all sides."
 SAU_middle_east_foreign_policy_16: "Iran Confrontation"
 SAU_middle_east_foreign_policy_16_desc: "The kingdom confronts Iran across every front: Yemen, Syria, Lebanon, Iraq, and the nuclear issue. The cold war is hot."
 SAU_middle_east_foreign_policy_17: "Proxy Warfare"
 SAU_middle_east_foreign_policy_17_desc: "Saudi proxies in Syria, Yemen, and Lebanon fight Iranian proxies. The region bleeds. Riyadh and Tehran fight to the last Arab."
 SAU_middle_east_foreign_policy_18: "Nuclear Opposition"
 SAU_middle_east_foreign_policy_18_desc: "The kingdom opposes the Iranian nuclear deal. Sanctions, sabotage, and diplomatic pressure. Tehran must not get the bomb."
 SAU_middle_east_foreign_policy_19: "Iranian Containment"
 SAU_middle_east_foreign_policy_19_desc: "Contain Iran through alliances, military buildup, and economic pressure. The strategy works - until it doesn't."
 SAU_middle_east_foreign_policy_20: "Sunni Coalition"
 SAU_middle_east_foreign_policy_20_desc: "A coalition of Sunni states - Saudi Arabia, Egypt, Turkey (sometimes), Pakistan - forms to counter Iran. It is loose, informal, and effective."
 SAU_middle_east_foreign_policy_21: "Gulf Unity"
 SAU_middle_east_foreign_policy_21_desc: "The GCC unites against Iran. The smaller monarchies look to Riyadh for protection. The peninsula stands together."
 SAU_middle_east_foreign_policy_22: "Arab NATO"
 SAU_middle_east_foreign_policy_22_desc: "A NATO-style alliance of Arab states. Saudi Arabia, Egypt, UAE, Jordan, and Bahrain coordinate military planning and intelligence."
 SAU_middle_east_foreign_policy_23: "Iran Deterrence"
 SAU_middle_east_foreign_policy_23_desc: "Military buildup deters Iranian aggression. F-15s, Patriot missiles, and naval power send a clear message to Tehran."
 SAU_middle_east_foreign_policy_24: "Iran Diplomatic Offensive"
 SAU_middle_east_foreign_policy_24_desc: "The kingdom takes the Iran issue to every forum: the UN, the Arab League, the OIC. Iran is isolated diplomatically."
 SAU_middle_east_foreign_policy_25: "Iran Economic Pressure"
 SAU_middle_east_foreign_policy_25_desc: "Oil market manipulation, sanctions support, and investment competition pressure Iran economically. The kingdom uses its economic weight as a weapon."
 SAU_middle_east_foreign_policy_26: "Iran Regime Change Hope"
 SAU_middle_east_foreign_policy_26_desc: "The kingdom hopes - and occasionally works - for regime change in Tehran. MEK support, Baloch insurgency, and cyber operations all aim at weakening the Islamic Republic."
 SAU_Military_Council: "The Military Council"
 SAU_military_hub: "Modernize the Armed Forces"
 SAU_military_hub_desc: "From a tribal levy to one of the best-funded militaries on earth. The Kingdom commits to a modern, professional force - and must choose how to arm and shape it."
