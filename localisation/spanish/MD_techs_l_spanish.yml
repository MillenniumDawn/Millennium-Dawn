 module_naval_sub_vls_cells_32_desc: "$module_naval_sub_vls_cells_4_desc$"
 module_naval_sub_vls_cells_64: "VLS para submarinos (64 celdas)"
 module_naval_sub_vls_cells_64_desc: "$module_naval_sub_vls_cells_4_desc$"
 module_naval_missile_mount_single: "Montaje de misiles simple"
 module_naval_missile_mount_single_desc: "Lanzadores de canasta o de brazo orientable montados en cubierta para misiles guiados. Más ligeros y económicos que un banco VLS, pero con capacidad limitada y salvas más lentas.\n\n§GConsejo de diseño: Los montajes de misiles multiplican las estadísticas de combate en el rol de misiles del buque a un coste menor que los grandes bancos VLS. Son ideales para combatientes más ligeros, pero proporcionan menos potencia de fuego de misiles y añaden algo de uso de combustible y visibilidad de superficie.§!"
 module_naval_missile_mount_twin: "Montaje de misiles doble"
 module_naval_missile_mount_twin_desc: "$module_naval_missile_mount_single_desc$"
 module_naval_missile_mount_quad: "Montaje de misiles cuádruple"
 module_naval_missile_mount_quad_desc: "$module_naval_missile_mount_single_desc$"
 module_naval_ammo_anti_ship_1: "Carga de misiles antibuque I"
 module_naval_ammo_anti_ship_1_desc: "A magazine load centred on anti-ship cruise missiles for engaging surface combatants at long range. Requires either Missile Mounts or VLS Banks for use. Ammunition loads can also be quickly refitted to change ammo loads for mission flexibility."
 module_naval_ammo_air_defense_1: "Carga de misiles de defensa aérea I"
 module_naval_ammo_air_defense_1_desc: "A magazine load centred on area air-defense missiles, screening the ship and its consorts from aircraft and incoming missiles. Requires either Missile Mounts or VLS Banks for use. Ammunition loads can also be quickly refitted to change ammo loads for mission flexibility."
 module_naval_ammo_land_attack_1: "Carga de misiles de ataque a tierra I"
 module_naval_ammo_land_attack_1_desc: "A magazine load of land-attack cruise missiles for striking targets ashore. Requires either Missile Mounts or VLS Banks for use. Ammunition loads can also be quickly refitted to change ammo loads for mission flexibility."
 module_naval_ammo_asw_1: "Carga de misiles ASW I"
 module_naval_ammo_asw_1_desc: "A magazine load of missile-delivered torpedoes for prosecuting submarine contacts at standoff range. Requires either Missile Mounts or VLS Banks for use. Ammunition loads can also be quickly refitted to change ammo loads for mission flexibility."
 module_naval_ammo_balanced_1: "Carga de misiles equilibrada I"
 module_naval_ammo_balanced_1_desc: "A mixed magazine load balancing anti-ship, air-defense, land-attack, and anti-submarine missiles. Requires either Missile Mounts or VLS Banks for use. Ammunition loads can also be quickly refitted to change ammo loads for mission flexibility."
 module_naval_sub_ammo_anti_ship_1: "Carga de misiles antibuque para submarinos I"
 module_naval_sub_ammo_anti_ship_1_desc: "A submarine magazine load of anti-ship cruise missiles launched from vertical tubes. Requires either Missile Mounts or VLS Banks for use. Ammunition loads can also be quickly refitted to change ammo loads for mission flexibility."
 module_naval_sub_ammo_land_attack_1: "Carga de misiles de ataque a tierra para submarinos I"
 module_naval_sub_ammo_land_attack_1_desc: "A submarine magazine load of land-attack cruise missiles launched from vertical tubes. Requires either Missile Mounts or VLS Banks for use. Ammunition loads can also be quickly refitted to change ammo loads for mission flexibility."
