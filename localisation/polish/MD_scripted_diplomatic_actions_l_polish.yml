 war_condition: "Wojna"
 wargoal_condition: "Cele wojenne"
 REQUEST_MIL_GNSS_ACCESS_TITLE: "Dostęp do GNSS dla wojska"
 REQUEST_MIL_GNSS_ACCESS_ACTION_DESC: "Wniosek o uzyskanie danych dostępowych do ich szyfrowanej wojskowej sieci pozycjonowania. Uzyskanie dostępu będzie wymagało dwustronnych negocjacji traktatowych, zobowiązań do wzajemnej wymiany informacji oraz ustanowienia stopniowanych poziomów uprawnień, zależnych od potrzeb operacyjnych. W przypadku pozytywnego rozpatrzenia wniosku uzyskamy dostęp do ich §Y wojskowej satelitarnej sieci GNSS§!."
 REQUEST_MIL_GNSS_ACCESS_LOC: "Wyślij prośbę o dostęp do wojskowego GNSS"
 REQUEST_MIL_GNSS_ACCESS_RECIEVER_LOC: "Domagają się dostępu do naszej wojskowej sieci GNSS."
 REQUEST_MIL_GNSS_ACCESS_ACCEPTED_TITLE: "Dostęp przyznany!"
 REQUEST_MIL_GNSS_ACCESS_ACCEPTED_DESC: "Będziemy korzystać z ich wojskowej sieci GNSS."
 REQUEST_MIL_GNSS_ACCESS_REJECTED_TITLE: "Brak dostępu!"
 REQUEST_MIL_GNSS_ACCESS_REJECTED_DESC: "Odmówili nam dostępu do swojej wojskowej sieci GNSS."
 REQUEST_MIL_GNSS_ACCESS_SELECTABLE_TT: "Poziom §YSystemu GNSS Wojskowego§! [PREV.GetNameWithFlag] musi być większy niż zero oraz co najmniej równy poziomowi [ROOT.GetNameWithFlag]."
 OFFER_MIL_GNSS_ACCESS_TITLE: "Zaoferuj wojskowy dostęp do GNSS"
 OFFER_MIL_GNSS_ACCESS_ACTION_DESC: "Udostępnienie danych uwierzytelniających łącze w górę do naszej szyfrowanej wojskowej sieci pozycjonowania stanowi gest świadczący o partnerstwie strategicznym. Oferta ta obejmuje protokoły dostępu o zróżnicowanych uprawnieniach, odprawy dotyczące bezpieczeństwa operacyjnego oraz wsparcie w zakresie integracji z ich systemami obronnymi. Przyznanie takiego dostępu stanowi istotną inwestycję w budowanie wzajemnego zaufania i interoperacyjności. W przypadku przyjęcia propozycji, strona ta uzyska dostęp do naszej §Y wojskowej sieci satelitarnej GNSS§!."
 OFFER_MIL_GNSS_ACCESS_LOC: "Wyślij ofertę dostępu do GNSS dla wojska"
 OFFER_MIL_GNSS_ACCESS_RECIEVER_LOC: "Oferują dostęp do swojej wojskowej sieci GNSS."
 OFFER_MIL_GNSS_ACCESS_ACCEPTED_TITLE: "Oferta zaakceptowana!"
 OFFER_MIL_GNSS_ACCESS_ACCEPTED_DESC: "Będą korzystać z naszej wojskowej sieci GNSS."
 OFFER_MIL_GNSS_ACCESS_REJECTED_TITLE: "Oferta odrzucona"
 OFFER_MIL_GNSS_ACCESS_REJECTED_DESC: "Odrzucili naszą ofertę dostępu do naszej wojskowej sieci GNSS."
 OFFER_MIL_GNSS_ACCESS_SELECTABLE_TT: "§YPoziom wojskowego systemu GNSS§! [ROOT.GetNameWithFlag] musi być większa od zera i co najmniej większa lub równa poziomowi [PREV.GetNameWithFlag]."
 REVOKE_MIL_GNSS_ACCESS_TITLE: "Anuluj dostęp do systemu GNSS wojskowego."
 REVOKE_MIL_GNSS_ACCESS_ACTION_DESC: "Cofnij wszelkie dane uwierzytelniające do łącza zwrotnego naszej szyfrowanej wojskowej sieci pozycjonowania i natychmiast zakończ ich dostęp w ramach integracji systemów. Działanie to pozbawia ich kluczowych możliwości nawigacyjnych niezbędnych do prowadzenia operacji obronnych, wyłącza systemy precyzyjnego naprowadzania oraz stanowi sygnał o fundamentalnym naruszeniu zaufania strategicznego. Krok ten niesie ze sobą poważne konsekwencje dla dwustronnej współpracy w dziedzinie bezpieczeństwa oraz interoperacyjności operacyjnej. Stracą oni wszelki dostęp do naszej §Ywojskowej sieci satelitarnej GNSS§!."
 REVOKE_MIL_GNSS_ACCESS_LOC: "Odwołanie dostępu do wojskowego GNSS"
 REVOKE_MIL_GNSS_ACCESS_RECIEVER_LOC: "Odbierają im dostęp do swojej wojskowej sieci GNSS."
 REVOKE_MIL_GNSS_ACCESS_ACCEPTED_TITLE: "Anuluj dostęp do systemu GNSS wojskowego."
 REVOKE_MIL_GNSS_ACCESS_ACCEPTED_DESC: "Odbierają im dostęp do swojej wojskowej sieci GNSS."
 REQUEST_CIV_GNSS_ACCESS_TITLE: "Dostęp cywilny do GNSS"
 REQUEST_CIV_GNSS_ACCESS_ACTION_DESC: "Wnioskujemy o dostęp do ich cywilnej sieci satelitarnej pozycjonowania w celu usprawnienia nawigacji i koordynacji logistyki. Proces ten obejmuje zawarcie standardowych umów o wymianie danych, ocenę kompatybilności technicznej oraz ustanowienie protokołów transmisji danych (uplink) dla naszych systemów. Uzyskanie takiego dostępu pozwoli na zwiększenie efektywności operacyjnej w obszarze transportu, służb ratunkowych oraz zarządzania infrastrukturą. W przypadku akceptacji wniosku uzyskamy dostęp do ich §Ycywilnej sieci satelitarnej GNSS§!."
 REQUEST_CIV_GNSS_ACCESS_LOC: "Wyślij cywilną prośbę o dostęp do GNSS"
 REQUEST_CIV_GNSS_ACCESS_RECIEVER_LOC: "Domagają się dostępu do naszej cywilnej sieci GNSS."
 REQUEST_CIV_GNSS_ACCESS_ACCEPTED_TITLE: "Dostęp przyznany!"
 REQUEST_CIV_GNSS_ACCESS_ACCEPTED_DESC: "Będziemy korzystać z ich cywilnej sieci GNSS."
 REQUEST_CIV_GNSS_ACCESS_REJECTED_TITLE: "Brak dostępu!"
 REQUEST_CIV_GNSS_ACCESS_REJECTED_DESC: "Odmówili nam dostępu do swojej cywilnej sieci GNSS."
 REQUEST_CIV_GNSS_ACCESS_SELECTABLE_TT: "§YPoziom cywilnego systemu GNSS§! w [PREV.GetNameWithFlag] musi być większy od zera i co najmniej większy lub równy niż poziom w [ROOT.GetNameWithFlag]."
 OFFER_CIV_GNSS_ACCESS_TITLE: "Oferta dostępu do GNSS dla użytkowników cywilnych"
 OFFER_CIV_GNSS_ACCESS_ACTION_DESC: "Umożliwienie korzystania z naszej cywilnej sieci satelitarnego pozycjonowania w celu wsparcia ich infrastruktury nawigacyjnej i logistycznej. Wsparcie to obejmuje pomoc w integracji technicznej, protokoły wymiany danych oraz koordynację działań w zakresie kompatybilnych systemów odbiorczych. Taki dostęp sprzyja poprawie efektywności operacyjnej w obszarze transportu, reagowania kryzysowego oraz rozwoju infrastruktury cywilnej. W przypadku akceptacji wniosku zyskają oni dostęp do naszej §Ycywilnej sieci satelitarnej GNSS§!."
 OFFER_CIV_GNSS_ACCESS_LOC: "Wyślij cywilną ofertę dostępu do GNSS"
 OFFER_CIV_GNSS_ACCESS_RECIEVER_LOC: "Oferują oni dostęp do swojej cywilnej sieci GNSS."
 OFFER_CIV_GNSS_ACCESS_ACCEPTED_TITLE: "Oferta zaakceptowana!"
 OFFER_CIV_GNSS_ACCESS_ACCEPTED_DESC: "Skorzystają oni z naszej cywilnej sieci GNSS."
 OFFER_CIV_GNSS_ACCESS_REJECTED_TITLE: "Oferta odrzucona"
 OFFER_CIV_GNSS_ACCESS_REJECTED_DESC: "Odrzucili naszą ofertę dostępu do naszej cywilnej sieci GNSS."
 OFFER_CIV_GNSS_ACCESS_SELECTABLE_TT: "§YPoziom cywilnego systemu GNSS§§! w [ROOT.GetNameWithFlag] musi być wyższy niż zero i co najmniej równy lub wyższy niż poziom w [PREV.GetNameWithFlag]."
 REVOKE_CIV_GNSS_ACCESS_TITLE: "Cofnięcie cywilnego dostępu do GNSS"
 REVOKE_CIV_GNSS_ACCESS_ACTION_DESC: "Odciąć im dostęp do naszej cywilnej sieci satelitarnego pozycjonowania i anulować wszelkie uprawnienia do transmisji danych w górę (uplink). Działanie to przerywa protokoły wymiany danych, wyłącza integrację z naszymi systemami oraz może znacząco zakłócić ich zdolności w zakresie nawigacji, logistyki i reagowania kryzysowego. Taki krok sygnalizuje pogorszenie relacji i niesie za sobą praktyczne konsekwencje dla ich działań operacyjnych. Stracą oni dotychczasowy dostęp do naszej §Y cywilnej sieci satelitarnej GNSS§!."
 REVOKE_CIV_GNSS_ACCESS_LOC: "Cofnięcie dostępu do GNSS dla osób cywilnych"
 REVOKE_CIV_GNSS_ACCESS_RECIEVER_LOC: "Odbierają dostęp do swojej cywilnej sieci GNSS."
 REVOKE_CIV_GNSS_ACCESS_ACCEPTED_TITLE: "Cofnięcie cywilnego dostępu do GNSS"
 REVOKE_CIV_GNSS_ACCESS_ACCEPTED_DESC: "Odbierają dostęp do swojej cywilnej sieci GNSS."
 REQUEST_MIL_COM_ACCESS_TITLE: "Wojskowy dostęp do COMSAT"
 REQUEST_MIL_COM_ACCESS_ACTION_DESC: "Petycja o dostęp integracyjny do wojskowej infrastruktury łączności satelitarnej za pośrednictwem ustanowionych kanałów współpracy obronnej. Obejmuje to wynegocjowanie uprawnień do bezpiecznego łącza w górę, szyfrowanych protokołów transmisji oraz alokacji pasma zgodnie z surowymi wytycznymi bezpieczeństwa operacyjnego. Taki dostęp zapewnia niezawodne możliwości dowodzenia i kontroli oraz stanowi znaczące rozszerzenie strategicznej interoperacyjności. Jeśli wniosek zostanie zaakceptowany, uzyskają dostęp do naszej §YWojskowej Sieci Satelitarnej COMSAT§!."
 REQUEST_MIL_COM_ACCESS_LOC: "Wyślij wniosek o dostęp do wojskowego systemu COMSAT"
 REQUEST_MIL_COM_ACCESS_RECIEVER_LOC: "Proszą o dostęp do naszego wojskowego systemu komunikacji satelitarnej."
 REQUEST_MIL_COM_ACCESS_ACCEPTED_TITLE: "Dostęp przyznany!"
 REQUEST_MIL_COM_ACCESS_ACCEPTED_DESC: "Będziemy korzystać z ich wojskowego systemu komunikacji satelitarnej."
 REQUEST_MIL_COM_ACCESS_REJECTED_TITLE: "Brak dostępu!"
 REQUEST_MIL_COM_ACCESS_REJECTED_DESC: "Odmówili nam dostępu do ich wojskowego systemu komunikacji satelitarnej."
 REQUEST_MIL_COM_ACCESS_SELECTABLE_TT: "§YPoziom wojskowego systemu COMSAT§! w [PREV.GetNameWithFlag] musi być większy od zera i co najmniej większy lub równy niż poziom w [ROOT.GetNameWithFlag]."
 OFFER_MIL_COM_ACCESS_TITLE: "Oferta dostępu do wojskowej sieci COMSAT"
 OFFER_MIL_COM_ACCESS_ACTION_DESC: "W ramach gestu partnerstwa strategicznego należy przyznać im uprawnienia do bezpiecznego przesyłu danych w górę (uplink) w obrębie naszej infrastruktury wojskowej łączności satelitarnej. Oferta ta obejmuje stosowanie szyfrowanych protokołów transmisji, przydział dedykowanego pasma oraz wsparcie w zakresie integracji z ich systemami dowodzenia i kontroli. Taki dostęp stanowi istotną inwestycję w budowanie wzajemnego zaufania oraz interoperacyjności operacyjnej. W przypadku przyjęcia propozycji zyskamy dostęp do ich §Ywojskowej sieci łączności satelitarnej (Military COMSAT)§!."
 OFFER_MIL_COM_ACCESS_LOC: "Wyślij wojskową ofertę dostępu do COMSAT"
 OFFER_MIL_COM_ACCESS_RECIEVER_LOC: "Oferują oni dostęp do swojego wojskowego systemu komunikacji satelitarnej."
 OFFER_MIL_COM_ACCESS_ACCEPTED_TITLE: "Oferta zaakceptowana!"
 OFFER_MIL_COM_ACCESS_ACCEPTED_DESC: "Skorzystają oni z naszego wojskowego systemu komunikacji satelitarnej."
 OFFER_MIL_COM_ACCESS_REJECTED_TITLE: "Oferta odrzucona"
 OFFER_MIL_COM_ACCESS_REJECTED_DESC: "Odrzucili naszą ofertę dostępu do naszego wojskowego systemu komunikacji satelitarnej."
 OFFER_MIL_COM_ACCESS_SELECTABLE_TT: "§YPoziom systemu wojskowego COMSAT§! w [ROOT.GetNameWithFlag] musi być większy od zera i co najmniej większy lub równy niż poziom w [PREV.GetNameWithFlag]."
 REVOKE_MIL_COM_ACCESS_TITLE: "Cofnij dostęp do COMSAT dla wojska"
 REVOKE_MIL_COM_ACCESS_ACTION_DESC: "Cofnij wszelkie uprawnienia do korzystania z łącza w górę w naszej wojskowej sieci łączności satelitarnej i natychmiast zablokuj im dostęp do transmisji. Działanie to przerywa kluczowe kanały dowodzenia i kontroli niezbędne do prowadzenia przez nich działań obronnych, pozbawia ich możliwości bezpiecznej komunikacji oraz stanowi sygnał o fundamentalnym naruszeniu zaufania na szczeblu strategicznym. Taki krok niesie ze sobą poważne konsekwencje dla dwustronnej współpracy w dziedzinie bezpieczeństwa oraz zdolności do prowadzenia wspólnych operacji. Stracą oni dotychczasowy dostęp do naszej §Ywojskowej sieci łączności satelitarnej (Military COMSAT)§!."
 REVOKE_MIL_COM_ACCESS_LOC: "Wysyłanie anulowania dostępu do wojskowego systemu COMSAT"
 REVOKE_MIL_COM_ACCESS_RECIEVER_LOC: "Odbierają nam dostęp do wojskowego systemu łączności satelitarnej!"
 REVOKE_MIL_COM_ACCESS_ACCEPTED_TITLE: "Cofnij dostęp do COMSAT dla wojska"
 REVOKE_MIL_COM_ACCESS_ACCEPTED_DESC: "Odbierają nam dostęp do wojskowego systemu łączności satelitarnej!"
 REQUEST_CIV_COM_ACCESS_TITLE: "Dostęp cywilny COMSAT"
 REQUEST_CIV_COM_ACCESS_ACTION_DESC: "Wnioskujemy o dostęp do ich cywilnej sieci łączności satelitarnej w celu zwiększenia możliwości w zakresie łączności i transmisji danych. Proces ten obejmuje standardowe umowy dotyczące przepustowości, ocenę kompatybilności technicznej oraz ustanowienie protokołów łącza w górę (uplink) dla naszych systemów. Uzyskanie takiego dostępu pozwoli na usprawnienie infrastruktury komunikacyjnej na potrzeby służb państwowych, koordynacji działań ratunkowych oraz operacji zdalnych. W przypadku akceptacji wniosku uzyskamy dostęp do ich §Ycywilnej sieci satelitarnej COMSAT§!."
 REQUEST_CIV_COM_ACCESS_LOC: "Wyślij cywilną prośbę o dostęp do COMSAT"
 REQUEST_CIV_COM_ACCESS_RECIEVER_LOC: "Domagają się dostępu do naszego cywilnego systemu łączności satelitarnej."
 REQUEST_CIV_COM_ACCESS_ACCEPTED_TITLE: "Dostęp przyznany!"
 REQUEST_CIV_COM_ACCESS_ACCEPTED_DESC: "Będziemy korzystać z ich cywilnego systemu łączności satelitarnej."
 REQUEST_CIV_COM_ACCESS_REJECTED_TITLE: "Brak dostępu!"
 REQUEST_CIV_COM_ACCESS_REJECTED_DESC: "Odmówili nam dostępu do cywilnego systemu łączności satelitarnej."
 REQUEST_CIV_COM_ACCESS_SELECTABLE_TT: "§YPoziom Cywilnego Systemu COMSAT§! w [PREV.GetNameWithFlag] musi być większy niż zero i przynajmniej równy lub większy niż poziom w [ROOT.GetNameWithFlag]."
 OFFER_CIV_COM_ACCESS_TITLE: "Zaoferuj cywilny dostęp do COMSAT"
 OFFER_CIV_COM_ACCESS_ACTION_DESC: "Umożliwienie korzystania z naszej cywilnej sieci łączności satelitarnej w celu wsparcia ich infrastruktury łączności i transmisji danych. Grant ten obejmuje wsparcie w zakresie integracji technicznej, umowy dotyczące przydziału pasma oraz koordynację działań związanych z kompatybilnymi systemami naziemnymi. Taki dostęp usprawnia komunikację służb państwowych i ekip ratunkowych oraz wspiera prowadzenie działań w regionach odległych lub słabo obsługiwanych przez infrastrukturę telekomunikacyjną. W przypadku akceptacji wniosku podmioty te zyskają dostęp do naszej §Ycywilnej sieci łączności satelitarnej (Civilian COMSAT Satellite Network)§!."
 OFFER_CIV_COM_ACCESS_LOC: "Wyślij cywilną ofertę dostępu COMSAT"
 OFFER_CIV_COM_ACCESS_RECIEVER_LOC: "Oferują dostęp do swojego cywilnego systemu łączności satelitarnej."
 OFFER_CIV_COM_ACCESS_ACCEPTED_TITLE: "Oferta zaakceptowana!"
 OFFER_CIV_COM_ACCESS_ACCEPTED_DESC: "Będą korzystać z naszego cywilnego systemu łączności satelitarnej."
 OFFER_CIV_COM_ACCESS_REJECTED_TITLE: "Oferta odrzucona"
 OFFER_CIV_COM_ACCESS_REJECTED_DESC: "Odrzucili naszą ofertę dostępu do naszego cywilnego systemu łączności satelitarnej."
 OFFER_CIV_COM_ACCESS_SELECTABLE_TT: "§YPoziom cywilnego Systemu COMSAT§! w [ROOT.GetNameWithFlag] musi być większy od zera i co najmniej większy lub równy niż poziom w [PREV.GetNameWithFlag]."
 REVOKE_CIV_COM_ACCESS_TITLE: "Cofnij cywilny dostęp do COMSAT"
 REVOKE_CIV_COM_ACCESS_ACTION_DESC: "Należy odciąć im dostęp do naszej cywilnej sieci łączności satelitarnej i cofnąć wszelkie uprawnienia do transmisji w kierunku satelity (uplink). Działanie to pozbawi ich możliwości przesyłu danych oraz integracji z naszymi systemami, a także może znacząco zakłócić łączność rządową, koordynację działań ratunkowych oraz komunikację na obszarach odległych. Taki krok stanowi sygnał pogorszenia relacji i niesie ze sobą wymierne konsekwencje dla ich operacji. Stracą oni dotychczasowy dostęp do naszej §Ycywilnej sieci łączności satelitarnej§!."
 REVOKE_CIV_COM_ACCESS_LOC: "Wysyłanie anulowania dostępu do cywilnego systemu COMSAT"
 REVOKE_CIV_COM_ACCESS_RECIEVER_LOC: "Odbierają dostęp do cywilnego systemu łączności satelitarnej."
 REVOKE_CIV_COM_ACCESS_ACCEPTED_TITLE: "Cofnij cywilny dostęp do COMSAT"
 REVOKE_CIV_COM_ACCESS_ACCEPTED_DESC: "Odbierają dostęp do cywilnego systemu łączności satelitarnej."
 REQUEST_MIL_SPY_ACCESS_TITLE: "Dostęp do wojskowego SPYSAT"
 REQUEST_MIL_SPY_ACCESS_ACTION_DESC: "Wniosek o dostęp integracyjny do ich wojskowego systemu satelitów rozpoznawczych poprzez ustanowione kanały wymiany danych wywiadowczych. Obejmuje to negocjacje w sprawie dostępu do niejawnych zobrazowań, protokołów danych z nadzoru w czasie rzeczywistym oraz uprawnień do bezpiecznego pobierania danych w ramach surowych wytycznych dotyczących bezpieczeństwa operacyjnego. Uzyskanie takiego dostępu pozwala na zwiększenie świadomości strategicznej i stanowi znaczące pogłębienie współpracy wywiadowczej. W przypadku akceptacji uzyskamy dostęp do ich §YWojskowej sieci satelitów szpiegowskich SPYSAT§!."
 REQUEST_MIL_SPY_ACCESS_LOC: "Wyślij prośbę o dostęp do wojskowego SPYSAT"
 REQUEST_MIL_SPY_ACCESS_RECIEVER_LOC: "Proszą o dostęp do naszego wojskowego Systemu Satelitów Rozpoznawczych"
 REQUEST_MIL_SPY_ACCESS_ACCEPTED_TITLE: "Dostęp przyznany!"
 REQUEST_MIL_SPY_ACCESS_ACCEPTED_DESC: "Będziemy korzystać z ich wojskowego systemu satelitów rozpoznawczych."
 REQUEST_MIL_SPY_ACCESS_REJECTED_TITLE: "Brak dostępu!"
 REQUEST_MIL_SPY_ACCESS_REJECTED_DESC: "Odmówili nam dostępu do wojskowego systemu satelitarno-rozpoznawczego."
 REQUEST_MIL_SPY_ACCESS_SELECTABLE_TT: "§YMilitarny poziom systemu SPYSAT§! [PREV.GetNameWithFlag] musi być większa od zera i co najmniej większa lub równa poziomowi [ROOT.GetNameWithFlag]."
 OFFER_MIL_SPY_ACCESS_TITLE: "Zaoferuj wojskowy dostęp do SPYSAT"
 OFFER_MIL_SPY_ACCESS_ACTION_DESC: "W ramach gestu partnerstwa strategicznego należy rozszerzyć dostęp do niejawnych danych obrazowych z naszego wojskowego systemu satelitów rozpoznawczych. Zakres ten obejmuje udostępnianie danych z obserwacji w czasie rzeczywistym, bezpieczne protokoły transmisji danych z satelity na ziemię oraz wsparcie w zakresie integracji z ich infrastrukturą analizy wywiadowczej. Taki dostęp stanowi istotną inwestycję w budowanie wzajemnego zaufania oraz interoperacyjności w dziedzinie wywiadu. W przypadku przyjęcia oferty uzyskają oni dostęp do naszej §Ywojskowej sieci satelitów rozpoznawczych§!."
