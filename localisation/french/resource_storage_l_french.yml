l_french:
 RESOURCE_STORAGE_HEADER: "§YSTOCKAGE§!"
 OPEN_STORAGE_BUTTON: "Ouvrir l'interface §YStockage des ressources§!"
 OPEN_STORAGE_BUTTON_TT: "Opens the §YResource Storage§! menu where you can see how many resources are currently in your §YStrategic Resource Reserves§!\n\nNOTE: §YResource Storage§! has an engine limitation to where if you are on §YExport Economy§! or §YGlobalized Trade Economy§! you may end up sending more resources to export than to your needed production lines. If you need to start to withdraw from storage it is recommended you switch to §YMixed Economy§! or lower.\n"
 WITHDRAWAL_STATUS: "Retrait"
 TOTAL_MAX_STORAGE: "§YMax§! : [?modifier@resource_storage_max_capacity|0]"
 RESOURCE_STORAGE_WITHDRAW_ENABLED: "§GActivé§!"
 RESOURCE_STORAGE_WITHDRAW_DISABLED: "§RDésactivé§!"
 TOTAL_STORED_STEEL: "[?steel_in_storage]"
 STORED_STEEL_WITHDRAWAL_STATUS: "[STEEL_WITHDRAWAL_STATUS]"
 STEEL_STORAGE_TOTAL_TT: "§YAcier§! Stockage"
 STEEL_STORAGE_TOTAL_DELAYED_TT: "Le premier nombre en blanc est la quantité de la ressource en stock. Le second est la quantité qui entre en stock chaque jour, ou celle qui est prélevée chaque jour. Si le nombre est vert, la ressource est ajoutée. S'il est rouge, elle est retirée."
 TOTAL_STORED_LIGHT: "[?light_in_storage]"
 STORED_LIGHT_WITHDRAWAL_STATUS: "[ALUMINUM_WITHDRAWAL_STATUS]"
