l_french:
 pakistan.1.t: "Pression américaine sur les zones tribales"
 pakistan.1.d: "Les États-Unis exigent que le Pakistan mène une action militaire décisive contre les groupes militants opérant depuis les zones tribales sous administration fédérale le long de la frontière afghane. Washington a clairement fait savoir qu'une inaction continue aura des conséquences pour la relation bilatérale et l'aide militaire américaine."
 pakistan.1.a: "Lancer une opération militaire au Waziristan"
 pakistan.1.b: "Négocier plutôt avec les anciens tribaux"
 pakistan.1.c: "Refuser les exigences américaines"
 pakistan.2.t: "Le Pakistan lance une opération tribale"
 pakistan.2.d: "Le Pakistan a lancé une opération militaire contre les bastions militants dans les zones tribales, répondant à la pression américaine. L'opération vise des éléments talibans et d'al-Qaïda le long de la frontière afghane."
 pakistan.2.a: "Un développement positif"
 pakistan.3.t: "Le Pakistan refuse d'agir"
 pakistan.3.d: "Le Pakistan a refusé une action militaire décisive dans les zones tribales malgré les exigences américaines. Les militants continuent d'opérer librement le long de la frontière afghane, sapant les efforts de la coalition en Afghanistan."
 pakistan.3.a: "Couper l'aide militaire au Pakistan"
 pakistan.3.b: "Accepter leur décision pour l'instant"
 pakistan.4.t: "Représailles militantes"
 pakistan.4.d: "L'opération militaire dans les zones tribales a provoqué de féroces représailles. Des groupes militants ont lancé une vague d'attentats dans les grandes villes, visant bâtiments gouvernementaux, marchés et installations militaires. Les talibans pakistanais ont déclaré la guerre à l'État."
 pakistan.4.a: "Intensifier la répression"
 pakistan.4.b: "Chercher un cessez-le-feu avec les militants"
 pakistan.5.t: "L'aide américaine suspendue"
 pakistan.5.d: "Les États-Unis ont suspendu l'aide militaire au Pakistan en réponse au refus du gouvernement d'agir contre les militants des zones tribales. La perte du financement américain pèsera sur le budget de la défense."
 pakistan.5.a: "C'est un outrage"
 pakistan.6.t: "Progrès dans les zones tribales"
 pakistan.6.d: "Après des mois d'opérations militaires soutenues, les forces armées pakistanaises ont réalisé des progrès significatifs dans les zones tribales. Les principaux bastions militants ont été démantelés, bien que le coût humain et économique ait été sévère. La question est désormais de déclarer la victoire ou de maintenir une présence militaire permanente."
 pakistan.6.a: "Déclarer la victoire et consolider"
 pakistan.6.b: "Maintenir la présence militaire"
 PAK_waziristan_insurgency: "Insurrection du Waziristan"
 PAK_waziristan_insurgency_desc: "Les forces armées pakistanaises mènent une vaste campagne de contre-insurrection dans les zones tribales, combattant des groupes militants le long de la frontière afghane."
 PAK_suspended_american_aid: "L'aide américaine suspendue"
 PAK_suspended_american_aid_desc: "Les États-Unis ont suspendu l'aide militaire au Pakistan, pesant sur le budget de la défense et limitant les acquisitions d'armes."
 PAK_tribal_pacification: "Pacification des zones tribales"
 PAK_tribal_pacification_desc: "La campagne militaire réussie dans les zones tribales a renforcé les capacités de contre-insurrection de l'armée et restauré un degré de stabilité dans la région frontalière."
 pakistan_news.1.t: "Le Pakistan lance une opération militaire dans les zones tribales"
 pakistan_news.1.d: "Les forces armées pakistanaises ont lancé une vaste opération militaire contre les bastions talibans et d'al-Qaïda dans les zones tribales sous administration fédérale le long de la frontière afghane. L'offensive, menée sous intense pression américaine, vise des réseaux militants qui ont longtemps utilisé le terrain accidenté comme refuge."
 pakistan_news.1.a: "Nous les délogerons"
 pakistan_news.1.b: "Un pas dans la bonne direction"
 pakistan_news.1.c: "C'est noté."
 pakistan_news.2.t: "Le Pakistan proclame la victoire dans les zones tribales"
 pakistan_news.2.d: "Après une campagne militaire prolongée, le Pakistan a déclaré que les principaux bastions militants des zones tribales ont été démantelés. L'opération a coûté cher en vies et en ressources, mais le gouvernement affirme que la région frontalière est plus sûre qu'elle ne l'a été depuis des années."
 pakistan_news.2.a: "Une victoire durement gagnée"
 pakistan_news.2.b: "Nous saluons ces progrès"
 pakistan_news.2.c: "C'est noté."
