l_korean:
 inuit_nunangat_focus: "이누이트 중점계통도"
 INU_Learning_from_Crested_Ice: "크레스티드 아이스에서 배우다"
 INU_Learning_from_Crested_Ice_desc: "1950년대와 60년대에 미국은 크롬 돔이라는 작전으로 핵무기를 탑재한 B-52 스트래토포트리스 폭격기 여러 대를 북극 고위도 상공에서 운용했습니다. 1968년 스트래토포트리스 한 대가 툴레 공군기지에 착륙하려다 추락하여 환경을 오염시켰으며, 당국은 이를 은폐했습니다. 핵이라는 불장난을 하기에 앞서, 우리는 이제 과거를 돌아보고 이 사건에 담긴 윤리를 분석해야 합니다."
 INU_Buy_Spare_Parts: "예비 부품 구매"
 INU_Buy_Spare_Parts_desc: "핵 재정비 계획을 더욱 발전시키려면, 우리가 사용하려는 무기를 재현하거나 복원하기 위한 부품과 기계를 확보해야 합니다."
 INU_Project_S: "산나 계획"
 INU_Project_S_desc: "산나, 또는 세드나는 이누이트 바다의 여신이자 해양 생물의 주인의 이름입니다. 중요한 생계의 원천이라는 그녀의 역할에 경의를 표하며, 우리의 탄도 잠수함 계획에 그녀의 이름을 붙이겠습니다."
 INU_Project_Ice_Shield: "얼음 방패 계획"
 INU_Project_Ice_Shield_desc: "이제 우리의 노력을 시험대에 올릴 때입니다. 한 나라가 핵무기를 제대로 다루며 타국을 위협하는 수단이 아니라 외교의 도구로 사용할 때 무엇을 해낼 수 있는지 세계에 보여 줍시다. 우리는 이를 북극 원주민들의 이익을 지키는 데 사용할 것입니다."
 INU_Project_N: "누투이툭 계획"
 INU_Project_N_desc: "누투이툭은 북극성, 곧 폴라리스의 이름입니다. 이에 경의를 표하며 우리의 탄도 미사일 계획에 그 이름을 붙이겠습니다. 이 계획은 우리가 별에 더욱 가까이 다가가게 해 줄 것입니다."
 INU_Looking_to_the_Stars: "별을 향하여"
 INU_Atmospheric_Monitoring: "대기 관측"
 INU_Lidar_Climate_Research: "LIDAR 기후 연구"
 INU_Recover_B52_Thermonuclear_Arm: "B-52 열핵 무장 회수"
 INU_Qaanaaq_Space_base: "카나크 우주 기지"