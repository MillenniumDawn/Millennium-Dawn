l_japanese:
 TT_CURRENT_LEADER_DIES: "§R[ROOT.GetLeader]が逝去した！§!"
 md4.1.t: "[FROM.GetName]・[Root.GetName]自由貿易協定"
 md4.1.d: "[FROM.GetNameDef]は自由貿易協定を提案している。我々は彼らとの輸出入をを優先するつもりだ。"
 md4.1.a: "署名しよう！"
 md4.1.b: "拒否"
 md4.2.t: "[FROM.GetNameDef]は我々と自由貿易協定を締結"
 md4.2.d: "[FROM.GetNameDef]は自由貿易協定の締結の提案を受け入れた。直ちに施行される。"
 md4.2.a: "それは我々を繁栄させるだろう！"
 md4.3.t: "[FROM.GetNameDef]は我々との自由貿易協定への締結を拒否"
 md4.3.d: "[FROM.GetNameDef]は自由貿易協定を締結するという我々の提案を拒否した。"
 md4.3.a: "彼らは我々の優れた製品に恐れているのだろう！"
 md4.4.t: "[FROM.GetName]・[Root.GetName]軍事協力条約"
 md4.4.d: "[FROM.GetNameDef] is offering us a military cooperation treaty. We will sell them equipment at a discounted price but this will make them more likely to buy from us instead of buying from our competitors."
 md4.4.a: "署名しよう！"
 md4.4.b: "拒否"
 md4.5.t: "[FROM.GetNameDef]は我々と軍事協力条約を締結"
 md4.5.d: "[FROM.GetNameDef]は軍事協力条約に調印するという我々の提案を受け入れた。直ちに施行される。"
 md4.5.a: "これは両者を強力にするだろう"
 md4.6.t: "[FROM.GetNameDef]は我々との軍事協力条約への締結を拒否"
 md4.6.d: "[FROM.GetNameDef]は軍事協力条約を締結するという我々の提案を拒否した。"
 md4.6.a: "奴らは我々がもっと強くなるのを恐れているんだ！"
 md4.14.t: "[FROM.GetName]が服従を要求"
 md4.14.d: "[FROM.GetName]政府は、我々が彼らの支配に服従し、そして我々の支配者になることを要求してきた。"
 md4.14.a: "もちろん"
 md4.14.b: "ありえない"
 md4.15.t: "[FROM.GetName]が服従"
 md4.15.d: "[FROM.GetName]政府は我々の要求に同意し、我々の支配を受け入れた。"
 md4.15.a: "素晴らしい"
 md4.16.t: "[FROM.GetName]の抵抗"
 md4.16.d: "[FROM.GetName]政府は我々の支配要求を拒絶した。"
 md4.16.a: "くそっ"
 md4.17.t: "[FROM.GetName]が同盟を受諾"
 md4.17.d: "[FROM.GetName]政府は同盟を受け入れた"
 md4.17.a: "素晴らしい"
 md4.18.t: "[FROM.GetName]が同盟を拒否"
 md4.18.d: "[FROM.GetName]政府は我々の同盟要求を拒絶した"
 md4.18.a: "くそっ"
 md4.19.t: "[FROM.GetName]が領土を割譲"
 md4.19.d: "[FROM.GetName]政府は我々の領土割譲要求に同意した"
 md4.19.a: "素晴らしい"
 md4.20.t: "[FROM.GetName]が領土割譲を拒否"
 md4.20.d: "The Government of [FROM.GetName] have rejected our territorial demands"
 md4.20.a: "くそっ"
 generic.5.t: "[FROM.GetName]が[Root.GetName]を[FROM.GetFactionName]へ招待"
 generic.5.d.a: "近年の国際政治情勢を注意深く見るに、[alliance_inviter.GetName]は我々に友好の手を差し伸べて、我々に安全を保障し、自由と民主の原理を守るよう共に立ち上がることを求めている。[alliance_inviter.GetFactionName]の一員として、我々の人民の自由は守られるだろう。"
 generic.5.d.b: "幾度も強く同盟者が必要であると考えていたところ、[alliance_inviter.GetAdjective]は我々に[alliance_inviter.GetFactionName]への参加を進めてきた。もしこれを受け入れれば、我々の日の目のあたる居場所を見つけることができるだろう。"
 generic.5.d.c: "Our ideological allies in [alliance_inviter.GetName] have made note of our valuable contributions to the workers' cause, and this morning we received an invitation for us to join the [alliance_inviter.GetFactionName]. Standing together with other socialist republics, we could spread the revolution with renewed strength."
 generic.5.d.e: "[alliance_inviter.GetAdjective]は、我々が彼らに戦略的関心を持っていると考えているようであり、我々が共に完遂することは、イデオロギー的な違いによって分割されるべきであるよりも、より有益だと考えているようである。今朝、[alliance_inviter.GetAdjective]大使は我々が、[alliance_inviter.GetFactionName]の加盟国になるための招待状を送った。"
 generic.5.a: "彼らと共に立ち上がろう"
 generic.5.b: "数千人の死者だけで十分だ……"
 generic.5.c: "同志と共に戦おう！"
 generic.5.e: "有益な選択だな"
 generic.6.t: "[alliance_applicant.GetName]が[alliance_inviter.GetFactionName]への招待を受諾"
 generic.6.d: "[alliance_applicant.GetName]は、[alliance_inviter.GetFactionName]への加盟提案受け入れを決めた。今後、我々は生死を共にするのである。"
 generic.7.t: "[alliance_applicant.GetName]が[alliance_inviter.GetFactionName]加盟を拒否"
 generic.7.d: "[alliance_applicant.GetName]は、[alliance_inviter.GetFactionName]に参加するという提案を拒否することに決定した。我々は彼らの助けを借りずに果たさねばならない。"
 generic.7.a: "我らの助けは必要ない"
 ace_promoted.1.t: "エースパイロットの昇進"
 ace_promoted.2.t: "勇敢なエースパイロット登場"
 ace_promoted.1.d: "[Root.GetAdjective]空軍のパイロットほど勇敢でリスクを恐れない者はいない。[FROM.GetCallsign]のコールサインで知られる腕利きパイロット、[FROM.GetName] [FROM.GetSurname]は、最近の[FROM.GetMissionRegion]での作戦にて、生還したことはもとより、多くの危機的な局面で目覚ましい勝利を飾りその名を轟かせた。\n\n[FROM.GetName]の昇進は広く喧伝され、[Root.GetAdjective]魂の模範として称揚された。国民の目には、戦争は栄光というよりは地獄として映っていただろうが、多くのものが英雄の登場を喜び、その下で結束を高めている。"
 ace_promoted.1.d_major: "[Root.GetAdjective]空軍のパイロットほど勇敢でリスクを恐れない者はいない。[FROM.GetCallsign]のコールサインで知られる腕利きパイロット、[FROM.GetName] [FROM.GetSurname]は、生還したことはもとより、[FROM.GetHerHis]の[FROM.GetWing]を類まれな操縦術で乗りこなしたことでその名を轟かせた。最近、[FROM.GetName]は[FROM.GetMissionRegion]での作戦に参加し、この決定的な会戦を成功に導いた。\n\n[FROM.GetName]の昇進は広く喧伝され、[Root.GetAdjective]魂の模範として称揚された。国民の目には、戦争は栄光というよりは地獄として映っていただろうが、多くのものが英雄の登場を喜び、その下で結束を高めている。"
 ace_promoted.1.a: "危険を冒すものが勝利する"
 ace_died.1.t: "「[FROM.GetCallsign]」と呼ばれし戦闘機エース、[FROM.GetMissionRegion]で死す"
 ace_died.1.d: "[FROM.Owner.GetName]の最も有名な[FROM.GetAceType]エースの一人、[FROM.GetFullName]は[FROM.GetMissionRegion]での作戦遂行中に撃墜された。不幸なことに[FROM.GetSheHe]は長く有名人であったため、その死は[FROM.GetHerHim]を尊敬していた多くの人々をひどく意気消沈させた。\n\n我々は人々からこの出来事を隠蔽する方法があればと望んだが、[FROM.GetName]が国民に姿を見せないようになればすぐに疑惑が巻き起こる違いなかった。年月を経れば、[FROM.GetHerHis]の死は伝説の一部として、我々が抱える苦悩を超え長く語り継がれるだろう。"
 ace_died.1.d_major: "[FROM.Owner.GetName]の最も有名な[FROM.GetAceType]エースの一人、[FROM.GetFullName]が職務遂行中に墜落した。作戦報告を終えたパイロット達が目撃したところによると、[FROM.GetHerHis]の[FROM.GetWingShort]が敵の激しい対空砲火を浴びて[FROM.GetMissionRegion]に炎上墜落したそうだ。残念ながら[FROM.GetSheHe]は長く有名人であっため、[FROM.GetCallsign]の死は[FROM.GetHerHim]を尊敬していた多くの人々をひどく意気消沈させた。\n\n我々は人々からこの出来事を隠蔽する方法があればと望んだが、[FROM.GetName]が国民に姿を見せないようになればすぐに疑惑が巻き起こる違いなかった。年月を経れば、その死は伝説の一部として、我々が抱える苦悩を超え長く語り継がれるだろう。"
 ace_died.1.a: "伝説は生きていてこそ"
 ace_killed_by_ace.1.t: "戦闘機エース[FROM.GetFullName]、敵パイロットに撃墜される"
 ace_killed_by_ace.1.d: "[FROM.GetMissionRegion]から帰還したパイロットの報告によると、悪名高き'[Prev.GetCallsign]'率いる[Prev.Owner.GetAdjective]軍の飛行中隊が[FROM.GetFullName]を執拗に狙った。敵数機を迎撃し集中射撃を回避するも、'[FROM.GetCallsign]'は'[Prev.GetCallsign]'に圧倒されていた。報告によれば[FROM.GetHerHim]は裏をかかれ、燃料タンクを見事に撃ち抜かれた。[FROM.GetName] [FROM.GetSurname]の機体に火災が発生し、業火の中、[FROM.GetMissionRegion]上を螺旋状に舞い落ちていった。\n\n[FROM.GetFullName]はその類稀なる勇気と功績によって多くの人に尊敬されていた。この国民的英雄の損失は[FROM.Owner.GetAdjective]空軍に大きな打撃であり、国家全体にも計り知れない打撃だ。我々が悲嘆に暮れる中、[Prev.Owner.GetName]が[Prev.GetFullName]を英雄として祝福したことで、さらに悲しみは深まった。"
 ace_killed_by_ace.1.d_major: "Pilots returning from [FROM.GetMissionRegion] report that a squadron of [Prev.Owner.GetAdjective] aircraft led by the infamous pilot '[Prev.GetCallsign]' focused on chasing down [FROM.GetFullName]. After taking down a number of enemy aircraft and dodging several bursts from the enemy, '[FROM.GetCallsign]' was overwhelmed by '[Prev.GetCallsign]' in [Prev.GetHerHis] [Prev.GetWingShort], who reportedly outmaneuvered [FROM.GetHerHim] and ripped [FROM.GetHerHis] fuel tanks open with a clean hit. [FROM.GetName] [FROM.GetSurname]'s [FROM.GetWingShort] caught fire and went spiraling down over [FROM.GetMissionRegion] in a violent inferno.\n\n[FROM.GetFullName] has shown great courage throughout [FROM.GetHerHis] service and was looked up to by many. The loss of this national hero is a great blow to the [FROM.Owner.GetAdjective] Air Force and is a devastating blow to the nation as a whole. Knowing that while we grieve [Prev.Owner.GetName] is celebrating [Prev.GetFullName] as a hero makes the tragedy even greater."
 ace_killed_by_ace.1.a: "我々にとって計り知れない損失だ"
 ace_killed_other_ace.1.t: "エース[FROM.GetFullName]「[Prev.GetCallsign]」は敵パイロットに撃墜された"
 ace_killed_other_ace.1.d: "Our latest mission over [FROM.GetMissionRegion] was a great success for the [FROM.Owner.GetAdjective] Air Force in more than one aspect. Reports have come in highlighting [FROM.GetFullName]'s heroic deed, outwitting the [Prev.Owner.GetAdjective] pilot, [Prev.GetName] [Prev.GetSurname], known as '[Prev.GetCallsign]'. '[FROM.GetCallsign]' used [FROM.GetHerselfHimself] as bait and lured '[Prev.GetCallsign]' into a trap where the [FROM.Owner.GetAdjective] pilots were able to dive on [Prev.GetCallsign]'s squadron. '[FROM.GetCallsign]' proceeded to outmaneuver the [Prev.Owner.GetAdjective] aircraft and with a single burst sent '[Prev.GetCallsign]' spiraling from the skies of [FROM.GetMissionRegion].\n\n[Prev.GetFullName] was a feared pilot with many [FROM.Owner.GetAdjective] lives on [Prev.GetHerHis] conscience. This is a great victory and shows that when we rally behind great heroes, they perform great deeds."
 ace_killed_other_ace.1.d_major: "Our latest mission over [FROM.GetMissionRegion] was a great success for the [FROM.Owner.GetAdjective] Air Force in more than one aspect. Reports have come in highlighting [FROM.GetFullName]'s heroic deed, managing to outwit the [Prev.Owner.GetAdjective] pilot, [Prev.GetName] [Prev.GetSurname], known as '[Prev.GetCallsign]'. [FROM.GetCallsign] used [FROM.GetHerselfHimself] as bait and lured '[Prev.GetCallsign]' into a trap where the [FROM.Owner.GetAdjective] pilots were able to dive on [Prev.GetCallsign]'s squadron. '[FROM.GetCallsign]' proceeded to outmaneuver the [Prev.Owner.GetAdjective] aircraft and with a single burst sent '[Prev.GetCallsign]' spiraling from the skies of [FROM.GetMissionRegion].\n\n[Prev.GetFullName] was a feared pilot with many [FROM.Owner.GetAdjective] lives on [Prev.GetHerHis] conscience. This is a great victory and shows that when we rally behind great heroes, they perform great deeds."
 ace_killed_other_ace.1.a: "この勝利は[FROM.Owner.GetNameDef]全土で記憶されるであろう！"
 aces_killed_each_other.1.t: "戦闘機エース [FROM.GetFullName]墜落"
 aces_killed_each_other.1.d: "During the latest mission our famous [FROM.GetAceType] ace [FROM.GetFullName] ended up in a prolonged fight with the feared ace pilot, [Prev.GetFullName]. Being low on munitions and with no possibility of escape, '[FROM.GetCallsign]' maneuvered through the fire of the [Prev.Owner.GetAdjective] aircraft and proceeded to ram '[Prev.GetCallsign]'.\nBoth [FROM.GetCallsign]'s and [Prev.GetCallsign]'s aircraft were spotted going down in pieces over [FROM.GetMissionRegion].\n\nWhile it is little consolation that the [Prev.Owner.GetAdjective] menace, '[Prev.GetCallsign]', will no longer be a nuisance to us, we have lost a valued public figure and inspiration to the entire nation."
 aces_killed_each_other.1.d_major: "During the most recent aerial sortie our famous [FROM.GetAceType] ace [FROM.GetFullName] ended up in a prolonged fight with the feared ace pilot, [Prev.GetFullName]. Being low on munitions and with no possibility of escape, '[FROM.GetCallsign]' maneuvered [FROM.GetHerHis] [FROM.GetWingShort] through the fire of the [Prev.Owner.GetAdjective] aircraft and proceeded to ram '[Prev.GetCallsign]'.\nBoth [FROM.GetCallsign]'s [FROM.GetWingShort] and [Prev.GetCallsign]'s [Prev.GetWingShort] were spotted going down in pieces over [FROM.GetMissionRegion].\n\nWhile it is little consolation that the [Prev.Owner.GetAdjective] menace, '[Prev.GetCallsign]', will no longer be a nuisance to us, we have lost a valued public figure and inspiration to the entire nation."
 aces_killed_each_other.1.a: "しかしなお、我々にとって大きな損失であることに変わりはない"
 election.1.t: "総選挙"
 election.1.d: ""
 election.1.a: ""
 election.2.t: "選挙: 国民が再軍備に反対"
 election.2.d: "来たる選挙では未だ[Root.GetRulingParty]への支持が高く、人々は[Root.GetLeader]の指導力を信頼している。しかし[Root.GetName]が注力している軍事についての党方針は、大衆と、この方針を無思慮な主戦論だと考えている一部の重要な層には全く受け入れられていない。戦火はまだ我が国の国境まで至っておらず、ほとんどの人が[Root.GetName]が攻撃的な行動をとるのを見たくない。我々と国防に対する意見を同じくする他の主要な政党と協力するならば、我々の支持率が減少しても選挙後の統治を行うことはまだ可能である。"
 election.2.a: "民衆の声は聞かねばなるまい"
 election.2.b: "我々の主権を守るのが最優先だ"
 election.3.t: "選挙: 国民が再軍備を要求"
 election.3.d: "多くの有権者が、[Root.GetName]にはこの戦争に突入する準備が整っていないことや、戦争によって生じるあらゆる事柄について、懸念している。そのため、次の選挙では我が国の国境に戦争の脅威が迫っていることが争点のひとつになりそうだ。有権者は我々に、軍事力を増強し、我が国の戦争に対する備えを固めるよう求めている。今のところ[Root.GetRulingParty]が大多数の有権者から支持されているが、我々が有権者の不安を解消しなければ、さらに過激な勢力に支持を奪われる恐れがある。"
 election.3.a: "人々には安全を感じる権利がある"
 election.3.b: "多くの人はまだ外交的解決を支持している"
 election.4.t: "選挙: ファシストが政権内に？"
 election.4.d: "ナショナリストの攻撃的な声が[Root.GetName]国内で高まり、勢いづいたいくつかの政党は国家は武力によってその力を示すものだというファシスト的理念を掲げている。これらの政党のうち一つは直近の選挙で票を稼ぎ、[Root.GetRulingParty]内部では我々が政府の形成にあたり彼らと協力すべきか否かに関して議論が引き起こされていた。彼らは堂々と我が国の基盤である民主主義の理念を否定しているが、彼らが選挙に参加したという事実そのものが我々の見解に信憑性を与えているし、彼らが国民に支持されていることを認めることで彼らを暴力的行為から遠ざけることができるかもしれない。"
 election.4.a: "共産主義者よりはマシだろう！"
 election.4.b: "民主的政党の広範な連携が望ましい"
 election.5.t: "選挙: 共産主義者が政権内に？"
 election.5.d: "労働者階級の間に広がる不満と知識層に広がる急進的な動きによって[Root.GetName]における共産主義者の活動が活発になり、いつかの政党が結党されるにまで至った。直近の選挙でそのうちの一つが十分な支持を得たことを受け、[Root.GetRulingParty]の政治家たちは政権を立ち上げるにあたって彼らの支持を求めるべきか否か議論を始めた。もちろん彼らは我々の民主主義体制を資本階級による圧政と大差ないと考えているのだが、それでも彼らは求める変革を政府の転覆ではなく政府と協力することによって成すことを目指しているように思われるのだ。"
 election.5.a: "革命よりも改革だ！"
 election.5.b: "民主的政党の広範な連携が望ましい"
 election.6.t: "選挙: 民主主義勢力が少数派に"
 election.6.d: "[Root.GetName]の政治は徐々に急進的になりつつある。[Root.GetName]の代議制体制と民主主義の理念を掲げる政党がかつては広範な支持を得ていたが、今回の選挙では多くの投票者が過激な政党へと流れた。中道政党はもはやお互いの差異を棚上げにしたとしても多数派になることは叶わない。少数弱者による政権を認めないということになると、我々にはファシストか共産主義者に与する他に選択肢がない。"
 election.6.a: "ファシストと協力して[Root.GetName]を強化する"
 election.6.b: "共産主義者と連携し、社会変革を推し進めよう"
 election.6.c: "脆弱なものの、少数派内閣が望ましい"
 election.7.t: "ファシストが外交政策に影響を与える"
 election.7.d: "ファシストとの連立政権樹立を受け入れたことは我々の外交政策に影響を与えた。熱烈なナショナリズムを信奉しているにもかかわらず、外国にいる彼らの支持者は自分たち自身が[Root.GetName]国内で受けてきた影響を是としている。似通ったイデオロギーを拠り所とする全体主義国家は我々を潜在的な同盟国とみなしている。これらの国々との関係を維持することは、たとえどんなに[Root.GetRulingParty]が彼らの理念を毛嫌いしていようとも、政府を支えるファシストの支持を維持するためには必要であるかもしれない。"
 election.7.a: "大きな脅威に対抗する為、同盟国を利用しよう"
 election.7.b: "そのような友人によって、我々の敵を増やす必要はない"
 election.8.t: "共産主義者が外交政策に影響を与える"
 election.8.d: "共産主義者達は自分たちを国際的な革命の一部分であるとみなしており、我々が彼らを政府の協力者として選んだことは、多くの共産主義国の注目を集めた。共産党の代表者は、現在の我々のような従来の政権を棄ててプロレタリアートの独裁を採った国々と密接な関係を保持している。彼らからの支援を維持しておきたいなら、[Root.GetAdjective]の外交政策を策定する際には、このような関係を認識しておく必要があるかもしれない。"
 election.8.a: "我々も彼らと志を同じくするべきだろう"
 election.8.b: "[Root.GetName]崩壊への道を転がり落ちて行く"
 election.11.t: "選挙: ファシストが多数派に"
 election.11.d: "今回の選挙は、それを実現していた制度そのものにとって破壊的な結果となった。[Root.GetAdjective]の人々の多数がファシスト政党に投票し、彼らの求める選挙制度の廃止と独裁者の採用を支持したのだ。多くの者がこの独裁統治を許す発端となった、民主主義の理想への侵犯に対して武器を持って立ち上がるべきだと考えているが、一方で暴力に訴えることはファシストの理想を追認する行為にすぎないと考える者もいる。"
 election.11.a: "[Root.GetName]にとっては最悪の日だが、これが民意だ！"
 election.11.b: "我々は戦わずして自由を諦めることはない！"
 election.12.t: "選挙: 共産主義が多数派に"
 election.12.d: "今回の選挙は、前政権の統治に対する様々な反応が交差した結果、共産党の勝利に終わった。新たな指導者層は自分たちを全人民の代表であると主張する一方で、我々が大切にしてきた民主的な制度の多くを、労働者階級の支配と抑圧を狙う陰謀であるとし、真の「人民による支配」とは何であるかを議論し始めるに至った。国によっては、革命は血河が築かれることで始まってきた。[Root.GetName]では避けられたが、今後そうなる可能性はまだある。"
 election.12.a: "厄介なことだが、奴らは本当に多数派となったようだ"
 election.12.b: "奴らが全ての反対意見を封殺する前に、我々が止めなくては！"
 election.13.t: "選挙: 有力者がファシズムを支持"
 election.13.d: "とある影響力のある実業家、我々が産業生産の協力者として選んだ企業の背後にいた人物が、いくつかの政治声明を発表した。それによると議員は厄介者ぞろいだということだ。彼は公然と独裁主義的な政府を支持し、ファシストとされる他国の政権を賞賛することで、暗に[Root.GetName]がこういった支配体制に移行することで利益を得られる可能性を示唆している。この有力者とその理想を非難すれば、彼の企業との関係は気まずいものとなるかもしれない。だが彼を野放しにしておけばプロパガンダを拡める土壌を与え、[Root.GetRulingParty]の支持基盤を揺るがす結果になりかねないだろう。"
 election.13.a: "彼は自分の望むことを言うことができる。我々はそれを認める必要はない。"
 election.13.b: "我々は発展や[Root.GetName]を守る為に、ファシズムに頼る事はない"
 election.14.t: "選挙: 戦時特例"
 election.14.d: "[Root.GetName] is in a state of war. Normally, an election would be held at this time, but being in the midst of an important conflict many argue that we cannot afford to spend time on political campaigning, or a change of leadership if that should come about. Meanwhile, others claim that declaring the ongoing war a valid reason for skipping elections is the first step towards eroding [Root.GetAdjective] democracy. After all, letting military matters take precedence over the people's influence could be a slippery slope."
 election.14.a: "選挙は今まで通り開催される"
 election.14.b: "戦争中はこれらの問題に気を配らねばならない"
 election.15.t: "選挙: 政権論争"
 election.15.d: "来る選挙に向けて、国民は現在の政府に進行中の戦争を遂行するだけの手腕があるのかを疑い始めている。[Root.GetName]は大いに苦しみ続け、世論は我が国を敗北へ導いてると思われている彼らに敵対してしまっている。我が国民は戦争を最後まで見届ける決心をしているが、同時にむしろ他の政府がそれを終わらせるのを見たいと思っている。"
 election.15.a: "この信頼危機は残念なことだ"
 election.15.b: "民衆の団結を維持する為、政局を変えてみよう"
 election.16.t: "[Root.GetLeader]が民衆の支持を得ている"
 election.16.d: "With the present election, the opposition, insofar as it exists, has criticized the increasingly authoritarian reign of [Root.GetRulingParty]. They question whether the electorate has any power at all, or if it's all just for show.\n\nHowever, the support for [Root.GetLeader] appears to remain high, and although the circumstances of the election are questioned by the international community, it has not been contested domestically. It appears that even if [Root.GetName] is no longer ruled by the people, the people support their ruler... at least the ones who made it to the ballots."
 election.16.a: "一つの国民、一人の指導者"
 election.17.t: "選挙結果への疑問"
 election.17.d: "[Root.GetLeader]政権は強力に武装することによって対抗者のほとんどを黙らせてきたが、未だ最近の選挙について発言する者もおり、選挙結果の偽装と、彼らの政策に反対する議会を選ぼうという明らかな動きの黙殺について[Root.GetRulingParty]を糾弾している。\n\n政府は人々を分裂させようとする企てだとしてこれらの抗議を一蹴したが、大多数の人々が彼らの統治に対して疑念を抱いているようであること、そして対抗者が、すでに沈黙させられたとはいえ、その主張を示し続けていることは事実である。"
 election.17.a: "分裂主義者め！"
 political.1.t: "共産主義の台頭"
 political.1.d: "'While workers rise up against their oppressors around the world, those who claim to have achieved class consciousness in [Root.GetName] sit idly by and wait for change to come from within a political system so thoroughly corrupt, only revolution could save us from it!'\n\nSo speak new voices in the [Root.GetAdjective] communist movement. Referring to the rule of [Root.GetRulingParty] as a dictatorship of the bourgeoisie, they have begun calling for it to be brought out of power by any means necessary. Whether those means will come from within or without remains to be seen."
 political.1.a: "政府内にこの考えを支持するものがいるかもしれない"
 political.1.a.tt: "政府関係者が共産主義者によるクーデターを支持する可能性が増加する。"
 political.1.b: "民衆の為の運動は、民衆から支持されなければならない"
 political.1.b.tt: "民衆が共産主義蜂起を起こす可能性が増加する。"
 political.2.t: "マルクス主義者が政権に"
 political.2.d: "[Root.GetRulingParty]の方針は、急進左派の構成員を注意深く見守りつつ、革命的な社会主義に強く反対するものだが、政府の一部の人々はその可能性により寛容だ。少なくとも、共産主義者に本格的な内戦の危機にさらされない解決策を求める人々の懸念に対処する余地を見いだす。\n\n[Root.GetLeader]に忠誠を保っている人々にとっては、彼らは裏切り者に見えるかもしれないが、こうした非主流派の声は、革命が起こった場合には比較的無血な移行を確実にするものなのかもしれない。"
 political.2.a: "多くの理由から、奴らにも目を光らせておかねばなるまい"
 political.2.a.tt: "国民の支持が十分であれば、クーデターを実行できる。"
 political.3.t: "共産主義者がクーデターを決行"
 political.3.d: "共産主義革命を求める大衆運動が大きな声を用いて人々を怖がらせる一方、政治運動のある部分は静かに時を待っていた。そして今、待つことは終わった。今日、[Root.GetRulingParty]指導部や軍は準備していた全国的な反乱の通りに、[Root.GetLeader]は速やかに[Root.GetAdjective]政府要人の多くを自宅軟禁状態に置き、反乱軍との交渉に入らせた。\n\n協力を選んだ人々には新たな社会主義国家でも地位を保証するとの条件を提示したことで、秩序を維持するためという表向きの口実のもと、交渉は円滑に合意に達した。こうしてクーデターは何者も阻止に動く間もなく終結した。クーデターを阻止する力を持っていた人々は新体制によって、いまや収監されるか、追放されるか、もしくは処刑された。"
 political.3.a: "歴史の潮流が過去を吹き飛ばすだろう"
 political.4.t: "階級闘争による[Root.GetName]の分断"
 political.4.d: "共産主義革命運動は、かつては理論面においては過激な理論家の、そして実践面においては厄介者達の間で反主流的な人気を得ていたが、[Root.GetAdjective]労働者階級の間で支持を広げてきている。より多くの人々が「階級」に共鳴することを選んでいるという事実は、マルクス主義者の思想が積極的に政府を転覆させようとする者達のみならずその先まで広がっていることを示している。\n\n「[Root.GetAdjective]」こそが人々の真っ先に共鳴するものであるような時を待ち焦がれている[Root.GetRulingParty]の面々は、その展開を嘆いている。彼らの懸念は根拠の無いものではない。革命は既に進行中であるとも言え、社会の別々の水準で発生し、既に止めるにはもう手遅れかもしれない。"
 political.4.a: "人々は自身を彼らが望むように呼ぶだろう"
 political.5.t: "兵士達が共産主義パルチザンへ投降"
 political.5.d: "「資本主義者と国粋主義者は、君に前線で彼らのために君の血を流すよう命じ、労働者には関係ない紛争において兄弟同士で敵対させている！あちこちで闘っている労働者達に対して武器を取る代わりに、圧政者に対してこそ武器を取り暴君を打倒せよ！」\n\nしばしば愛国心と忠誠の砦であった軍は、[Root.GetName]で急速に広まっている共産主義者のプロパガンダに対し免疫がないことを証明した。兵士たちは投降し、彼らの国のために戦うことを拒否し、時には革命への準備と主張してパルチザン運動へ合流する者までいた。"
 political.5.a: "恐らく、彼らは単に異なる[Root.GetName]のために戦っているだけなのかもしれない。"
 political.6.t: "[GetMonth]革命"
 political.6.d: "[Root.GetName]では共産主義運動が人々の間に広がり、共産主義にとって追い風となっている。最近数ヶ月は共産党に対する大衆の支持も拡大している。だが、革命を主張する者たちは、もはやゲリラや不満を抱えた労働組合のような烏合の衆ではない。この者達が反乱を主導した場合、政権樹立も可能だろう。\n\nそれでも、今、革命を起こせば、[Root.GetName]に内戦を回避することはできない。革命家達は国を二つに割る危険性を侵してまで自分の主義を貫くべきか、それとも次の機会を待つべきか？"
 political.6.a: "歴史を作りたいのなら、今日、動くしかない！"
 political.6.b: "革命は必然である。必然は今でなくてもよい。"
 political.7.t: "ファシズムの台頭"
 political.7.d: "「あまりにも長い間、[Root.GetAdjective]の人々は無能な[Root.GetRulingParty]の支配に従ってきた！奴らは民衆の代表であると主張しているが、我々の町の秩序を守ることなど出来ていない！権力から奴らを排除することによってのみ、我々はこの国を前進させることができるのである！」\n\n[Root.GetName]においてファシストの演説者が、我々の現在の統治と政治システムに関する考えを包み隠しなく述べた。このような演説は公衆の不満に入り込み、特にこれは軍の保守的な派閥において顕著であった。"
 political.7.a: "高官の中に口に出さずとも共感を得た者がいるだろう"
 political.7.a.tt: "政府関係者がファシストによるクーデターを支持する可能性が増加する。"
 political.7.b: "若い世代が、この運動を引き継いでくれるだろう"
 political.7.b.tt: "民衆がファシストによるクーデターを支持する可能性が増加する。"
 political.8.t: "軍内のファシズムシンパ"
 political.8.d: "Several high-ranking members of the [Root.GetAdjective] military have expressed support, some privately and some openly, for the Fascist movement in [Root.GetName]. They feel the [Root.GetRulingParty] has forgotten how important force of arms is to keeping the country together, and are increasingly annoyed by the army being treated by the government as more of a tool than one of the nation's most important institutions. Some of them go as far as to suggest that a new government is needed, one that knows how to lead [Root.GetName] into the next half of the century.\n\nThis faction may not predominantly be politicians, but some of them have gained positions in the department of defense. If these developments continue, they may have sufficient political support to execute a coup."
 political.8.a: "国民精神は政府より上位にある"
 political.9.t: "ファシストによるクーデター"
 political.9.d: "幾人かがそれが来たのを見たと言っていた。以前から、ファシズムの危険性に警鐘を鳴らしていた人々、または[Root.GetName]にとって救世主になると称揚していた人々も今日、それが実現したことを知った。[Root.Capital.GetName]で軍隊が[Root.GetRulingParty]主導の政権を転覆させた。[Root.GetLeader]は行方知れずであり、国外へ亡命したとの噂もある。抵抗はほとんど無かった。\n\n新たな[Root.GetAdjective]首脳部に抵抗勢力を野放しにするつもりなど無かった。戒厳令が宣言され様々な変化が進んでいる。この後何が起こるのか誰にも分からない。"
 political.9.a: "強き国が民衆を守る為に必要なのである"
 political.10.t: "ファシストによる内戦"
 political.10.d: "民族主義的感情を復活させるファシスト運動の試みが一定の成功を収めてはいるものの、この思想に対する抵抗も根強い。現政権の転覆を企む将軍たちは、[Root.GetAdjective]国民が[Root.GetFascistParty]に抱いているらしい不信感に失望している。\n\n彼らはいずれ国民が[Root.GetLeader]に嫌気がさすと確信してはいるが、どのような行動を起こすべきかは意見が分かれている。幾人かは[Root.GetName]の敵が行動を起こす前に、計画中のクーデターを実行すべきであると主張している。しかし、民衆の支持が限られている中でそうすれば、国が内戦に突入してしまうだろう。"
 political.10.a: "権力を掴むことに躊躇するようであれば力など無意味だ"
 political.10.b: "まず初めに人々を団結させなければならない。統治はそれからだ。"
 political.11.t: "ファシスト突撃隊の結成"
 political.11.d: "政治家と軍人はファシズムでは常に結びつく。政治的活動への発展と並行して、ファシスト政党は内部と外部の脅威から身を守るために準軍事的組織を結成し始めた。内部の脅威とは彼らの政敵である。多くの人々はこの出来事が厄介だと理解しているにもかかわらず、軍事的熱狂の波は我が国軍に加わる志願者数の増加を引き起こした。\n\n活動の政治的指導者は彼らの反対者には恐れるだけの理由があると指摘した。非常に明示的な政治的要素により一部の階級で浸透した軍隊を持つことにより、[Root.GetName]の敵とファシズムの敵は非常に似通って見え始める。"
 political.11.a: "怖がるのは売国奴だけだ"
 political.12.t: "共産主義の脅威"
 political.12.d: "「[Root.GetLeader]は[Root.GetName]が安全で団結した状態であることを信じさせている。例え蛇が隣にいようともこのような嘘で洗脳された人々には驚くには値しないのだ！国民同士のことにしか興味を持たず、国外では共産主義の名の下にいくつもの国家が終わりを迎えていることから目をそむけてはならない。一体、何時から我が国はこんな状態になってしまったのか？[Root.GetRulingParty]が我々をこの脅威から守ることができるとでも？」\n\n[Root.GetName]でのファシスト運動の活発化は、共産主義革命に対する脅威からだった。ファシズムをもう一つの誤ったイデオロギーとして解散させようとする穏健派は、共産主義に対するよりも深刻な懸念であるといえる。我々に隣接する共産主義かファシスト体制のどちらかを選ばなければならないとすれば、それは明らかに後者である。彼らはこの選択を支持することを厭わないであろう。"
 political.12.a: "我々はアカの脅威に対抗する先兵だ！"
 political.13.t: "民主主義への動き"
 political.13.d: "「我々が人々の声を黙殺するようなら、どうして我々自身が[Root.GetName]の代弁者であると主張できようか。反対意見を、そして、公に批判され、選挙により追放されるのを恐れているとすれば、それはつまり、市民に嫌悪され、罵られることを恐れているということである。[Root.GetRulingParty]はそんなに自党の政策に自信が無いのか」\n\n政府内の、注意深くもだらしなく組織され、しかし情熱を持った派閥が、国敵に対する、主張の弱い政策を負かし始めている。彼らは、一般市民に、投票と地方党大会への参加により、政策決定に関わって欲しいのだ。例えそれが将来的に現在の政策目標を危うくするとしても。"
 political.13.a: "まず第一に、我々は内部的に議論する必要があるだろう"
 political.13.a.tt: "政府関係者が選挙の実施を指示する可能性が増加する。"
 political.13.b: "自らが正当だと知っているからこそ、敵がより率直に話すことを許す余裕を持てるのだ"
 political.13.b.tt: "民衆が民主主義を支持し、野党を結成する可能性が増加する。"
 political.14.t: "[Root.GetRulingParty]民主主義の議論"
 political.14.d: "驚いたことに、国民投票の要求と政権に反対するものに対する抑圧的な法案への反対が党内の討議である程度の支持を得た。[Root.GetRulingParty]の指導力はまだ疑わしいが、いくらかの有力な面々は方針転換を支持している。\n\nことによると彼らは実際にはほんの少ししか変化が起きないという自信を、彼らの反対者と同程度に持っているのかもしれないし、あるいは彼らが実は党の主張に対する裏切り者なのかもしれない。ともかく、もし大衆のそれらの変化に対する要望が実現したとしたら、[Root.GetName]のいくらかの指導者は妥協する用意ができている。"
 political.14.a: "選択は必ずしも自由と死の間にのみ存在するわけではない"
 political.14.a.tt: "政策が国民の多数から支持されるなら、政府は選挙を実施するかもしれない。"
 political.15.t: "民主主義野党の結成"
 political.15.d: "Relaxing the restrictions on what sort of anti-[Root.GetRulingParty] propaganda can be spread publicly has, predictably, led to an increase in public expressions of dissent. Organized demonstrations and pamphlets are so far found mostly in academic institutions and some of [Root.GetName]'s more unfortunate areas, but there is little doubt that the movement is spreading.\n\nThe nation's leaders are torn over the issue. [Root.GetLeader], who maintains an iron grip on party leadership, has little desire to diversify public debate. The first steps have already been taken, however, and there may be no turning back."
 political.15.a: "The movement appears to grow naturally in the absence of repression."
 political.16.t: "民衆による選挙の要望"
 political.16.d: "一度は範囲を制限された反対デモは今や広範に広がっている。人々が道へと集っていく今、[Root.GetRulingParty]はまさしく岐路に立たされている。このプロパガンダを続けさせたら、与野党ともから国民投票を求められ、我々は力を失うことだろう。我々の総意は、我々の反対勢力へも意見の多様性の確保をする道である。"
 political.16.a: "例え改革が発生しても、この反抗を鎮圧する事によって我々の強さを示すのだ"
 political.16.b: "民衆の声に耳を貸すとしよう"
 political.17.t: "[Root.GetName]での公選"
 political.17.d: "表現と集会の自由が[Root.GetName]でますます受け入れられるようになり、[Root.GetRulingParty]の党内の一部では選挙再開阻止のため、内密の協力者を改革運動家のもとへと送り込むことも行われた。[Root.GetLeader]の主張にも関わらず、民主化への動きを数ヶ月遅らせはしたが、選挙への次の段階へ進んでいるように見える。\n\nしかし全ての[Root.GetAdjective]の市民たちが民主化改革には賛成しているわけではない。党内では我々が安定した発展を確保できるまで選挙の再開を待つべきかどうかまだ議論がある。"
 political.17.a: "[Root.GetRulingParty]に忠実な者たちがこの決定を支持するだろう"
 political.17.b: "改革は選挙が開催される前により広い支援を必要としている"
 political.18.t: "ファシストたちが国民投票を要求"
 political.18.d: "急速に成長した[Root.GetAdjective]のファシスト運動は、ひとたび彼らの支配が確立されればその指導の下で国家が統一されるであろう事を期待しており、権力を掌握する前に過半数の支持が必要であると主張したことがない。しかし、彼らを公に支持するものは急激に増加しているようだ。多くのファシストが[Root.GetLeader]のことを、人々の願いを代表すると主張しながら、実際には大衆に耳を貸さない偽善者だと言っている。\n\n国民投票の要求は体制を崩壊させるための月並みな提案として[Root.GetRulingParty]によって拒絶されてきたが、これは少なくとも政治的な手段だ。我々がいま行動しなければ、ファシストは暴力的な手段をもって権力の座につくことを選ぶかもしれない。"
 political.18.a: "この忌々しい運動を抑圧せよ！"
 political.18.b: "奴らに耳を貸すな"
 political.18.c: "民衆が望むのならば、国民投票を開催しよう"
 political.19.t: "共産主義者たちが国民投票を要求"
 political.19.d: "[Root.GetName]に共産思想が根付いたのは昔のことだが、最近になって、彼は広範な支持を得るようになった。この動きは政治の理論分野を超えて実践的な分野に乗り出し、不満を持つ労働者のみならず上流の人物さえも支持に回った。これを彼らは階級意識と呼んだ。[Root.GetRulingParty]はこれを暴動の扇動、国家への反逆と呼んだ。\n\n[Root.GetLeader]が要求を実現するか彼らは疑い、一部の共産主義者は現政権を国民投票によって打ち倒すことを声高に訴えている。我々はこの巨大な動きを落ち着かせる必要がある。しくじれば必ず、彼らはよくある方法で我々を排除することになるだろう、すなわち革命である。"
 political.19.a: "反[Root.GetAdjective]活動はやめさせなければなるまい！"
 political.19.b: "混乱の元となるものは無視しよう"
 political.19.c: "国民投票は血みどろの反乱よりかはいいだろう"
 political.20.t: "民主主義者たちが国民投票を要求"
 political.20.d: "何の驚きもないが、国民が自分たちで自分たちの国を統治するという思想は、国民の間で急速に支持を広げている。もちろん、言論の自由・公開選挙・自由報道といった運動に代表される民主主義思想について、[Root.GetRulingParty]は[Root.GetLeader]政権を弱体化させる大衆迎合的な美辞麗句だとしか見ていない。\n\nしかし、民主主義思想が[Root.GetAdjective]人の間で広がっている事実を否定することはできない。真に民主的な方法で、人々は現政権の是非を問う一般国民投票の実施を求めている。黙殺することは簡単だが、これからも民主主義思想は拡大する一方だろう。平和的な革命が不可能だと国民が考えると、我々にいったい何が起こるだろうか？"
 political.20.a: "一斉検挙せよ"
 political.20.b: "いつも通り進行するだけだ"
 political.20.c: "もし国民投票を受け入れるならば、我々の遺産は引き継がれるだろう"
 political.21.t: "ファシストが[Root.Capital.GetName]を行進"
 political.21.d: "法的に権力を掌握するための手段であった国民投票が拒否されたことで、ファシストはクーデターのため、幅広い大衆からの支持と、[Root.GetAdjective]軍とのつながりとを利用することにした。[Root.GetRulingParty]はそのような関係を拒否し、誰もが知っているように[Root.GetName]を守るため最後まで戦うと主張している。"
 political.21.a: "何としてでも奴らを止めなければ！"
 political.21.b: "ファシストは真の[Root.GetName]精神を宿している！"
 political.22.t: "共産主義者達が蜂起"
 political.22.d: "After their request for a referendum was denied, the few reformers of the communist movement in [Root.GetName] rapidly lost influence to the more radical elements. With the [Root.GetRulingParty]'s refusal to acknowledge the public support for the suggested reforms, the romantic view of the revolution gradually grew more widespread and the leaders of the movement became those who could most easily start a riot. Those riots have now erupted into a full-scale civil war, with the future of the nation at stake."
 political.22.a: "我々の国を荒らした奴等を我々は許さない！"
 political.22.b: "革命の火は圧制者の血によって鎮火しなければならない！"
 political.23.t: "[Root.GetAdjective]の春"
 political.23.d: "民主主義制定の国民投票の試行は拒否され、陰で提言していた人々は救いがたいとして[Root.GetLeader]政権を却下した。[Root.GetName]の代議制の政治制度を設けるという共通の目的により団結した、反政府グループの広範な連立政権は武器を取り、[Root.GetRulingParty]が転覆するまで戦うと声明した。"
 political.23.a: "暴力的な支配を解き放て！"
 political.23.b: "ようやく、[Root.GetName]は自由となったのだ！"
 political.24.t: "ファシストへの嘲笑"
 political.24.d: "国粋主義的な誇りとそれによって過去の栄光を復活させようとする試みは、[Root.GetAdjective]の人々からの心酔を失ったようだ。その制服、軍国主義的な行動、やりすぎな演説は今や一般的には共感を得るというよりは嘲笑の対象となっており、熱烈な支持者からも見放されつつある。\n\n一度は[Root.GetRulingParty]における権力基盤の脅威と見なされた[Root.GetAdjective]のファシズムはばかげた過激思想で、我々の国の最も基本的な価値観への攻撃、すなわち彼らが崇敬の念を抱いていると主張する国への攻撃であるという見方が今では広がっている。このような言葉は政治的な指摘よりも侮辱としてふさわしいと思われる。"
 political.24.a: "道化の集団だな"
 political.25.t: "共産主義の熱が収まった"
 political.25.d: "多くの共産主義者は[Root.GetName]がいわゆる世界革命の波に飲まれる次の予定国であろうと予測していたが、赤旗と共に行った街中のストライキの数ヶ月後、この運動は完全に止んでしまったようだ。革命の原動力のはずの労働者階級は、他の国でどのように革命を成し遂げたか感銘を受けることはなく、[Root.GetLeader]政権を転覆する事に目を向けるよりも、より差し迫った問題に憂慮している。一方知識人は、迫害者の首を取れという熱心な呼び出しに対して、これは彼らの安寧な生活を混乱させる事を引き起こすために驚くほど消極的であったことも判明した。\n\n革命の話は安いビールやワインの下酒の席で続くが、それはおそらく話の種以上のものとはならないだろう。"
 political.25.a: "偽善者の集団だな"
 political.26.t: "民主化運動が停止された"
 political.26.d: "After a few months of loud opposition against [Root.GetLeader]'s regime, calling for public elections and more liberal laws on freedom of assembly and speech, the movement seems to have fallen apart. People now express more concern about the stability of [Root.GetName] if such reforms were to take place, with those who clamor for democracy being seen more as troublemakers than anything else.\n\nMore mysteriously, many of the leading figures of the movement appear to have gone missing or stopped their work suddenly. Perhaps some of them chose to go into exile when they saw the failure of their efforts. Regardless, the [Root.GetRulingParty] government denies all knowledge and involvement."
 political.26.a: "腰抜けの集団だな"
 political.27.t: "[Root.GetLeader]が中立政策を放棄"
 political.27.d_fascism: "[Root.GetRulingParty]が政権を奪取した後、[Root.GetLeader]が[Root.GetName]はもはや中立外交政策を維持しないことを宣言した。\n「この世界は絡み合い、そして複雑になってきている。我々はもはや安全な身ではない。我々はファシストの仲間と共に、敵に対して立ち上がらなければならないのだ。もし我々が立場を明確にしないのであれば、ひとり滅んでいくだけであろう」"
 political.27.d_communism: "After [Root.GetRulingParty]'s recent rise to power, [Root.GetLeader] announced that [Root.GetName] would no longer keep its Neutral Foreign Policy.\n'The world has become tangled and complex. This country has always stood on its principles and been ready to defend them. We are no longer safe on our own. Neutrality is no longer the safe haven it used to be and those who seek power in this world do not respect it. We must stand with our communist brothers against the powers that seek to oppress us. Against the bourgeois majority who wants nothing more than to keep us down. If we do not take a stand, we will perish alone.'"
 political.27.a: "[Root.GetName]の未来の為に"
 political.28.t: "[Root.GetNameDef]再統一"
 political.28.d: "The terrible civil war that has devastated our land draws to an end, and we have finally reached a political agreement. We now see eye to eye with our fellow [Root.GetAdjective]s, and together we will rebuild our great nation. The enemies that have sought to capitalize on our infighting must now face a united [Root.GetAdjective] state.\n\nThe new [Root.GetRulingIdeology] [Root.GetName] will never be divided again!"
 political.28.a: "ついに統一された！"
 THREAT_FROM_EFFECT: "行動に伴う脅威"
 war_justification.1.t: "[Root.GetLeader]、[FROM.GetName]を口撃する"
 war_justification.1.d: "「[FROM.GetName]は[FROM.GetAdjective]のものかだって？もっとましな問いかけをしよう。未来が[FROM.GetAdjective]によって定まるのか、あるいは[Root.GetNameDef]が決定するのか？だ」\n\n[Root.GetLeader]の演説は[Root.GetName]が戦争への道を歩んでいることを示唆している。政治的緊張はここ数か月で高まり、[Root.GetAdjective]の人々は戦争が避けられないことを受け入れているようだった。"
 war_justification.1.a: "未来は[Root.GetName]の手によって成る！"
 war_justification.2.t: "[Root.GetLeader]、[FROM.GetAdjective]の理想を非難"
 war_justification.2.d: "「[FROM.GetAdjective]は自由と民主主義を標榜し、平和を望むと主張している。しかし彼らが誇りとしている全ての価値は虚構にすぎない。彼らの民主主義は団結すべき人々を分断し、自由は規律の欠如を招くだけだ。我々、[Root.GetAdjective]はこれらの嘘を見抜いた……そしてこの平和、彼らの言う平和も嘘である」\n\n[Root.GetRulingParty]は[FROM.GetAdjective]国民の軟弱さを長く嘲笑ってきたが、最近は表現が攻撃的になっている。武力衝突の日は近い。"
 war_justification.2.a: "[Root.GetName]は[Root.GetLeader]の下で団結し、立ち上がる"
 war_justification.3.t: "[Root.GetLeader]、[FROM.GetAdjective]共産主義へ警告"
 war_justification.3.d: "「我々の生き方やその生のあり方そのものへの脅威で、共産主義よりも大きなものがあるだろうか？奴隷を作り、主人は作らず、全ての国家を支配し、国家そのものを廃絶し、人々とその歴史を廃絶すると脅すこの疫病よりも。我々は[FROM.GetName]を奪取し、共産主義の疫病を廃絶する」\n\n[Root.GetRulingParty]が権力を握る前から[Root.GetLeader]の共産主義者への憎しみはよく知られている。しかし、最近は[FROM.GetAdjective]政府という具体的事例に対して激化しているようだ。地球上からマルクス主義を根絶する探究はそこから始まるのかもしれない。"
 war_justification.3.a: "国家を否定する者は破滅を見るだろう"
 war_justification.4.t: "[Root.GetName]は重大な闘争へ向け準備"
 war_justification.4.d: "「[FROM.GetAdjective]人は権力を簡単には手放さない人々だ。だが彼らはまた、両国の軌道は衝突によってしか終わらないことを理解すべきだ。我々は来る闘争の心構えをする必要がある。[FROM.GetName]とは戦いなく終わらない」\n\n同じような考えを持つ[FROM.GetName]と[Root.GetName]の政府間で理解を得られる可能性は、武力で彼らの領土を奪取する作戦に取って変わられた。"
 war_justification.4.a: "歴史は我々の勝利によって記録されるだろう"
 war_justification.5.t: "[Root.GetLeader]、[FROM.GetName]に革命をもたらす"
 war_justification.5.d: "「[Root.GetName]で社会主義社会を固める一方で、多くの国では未だ専制君主の下で苦しんでいる。[FROM.GetName]では労働者の声なく、組織的でなく、社会主義の研究は[FROM.GetLeader]政権にひねり潰される。[FROM.GetAdjective]の人々のため、国際的革命の歯車が回ることが待ちきれない。革命によって我々が資本主義の抑圧を粉砕できることを証明した。同じように[FROM.Capital.GetName]の抑圧を粉砕しようではないか！」\n\n[Root.GetLeader]は[FROM.GetRulingParty]が統制している[FROM.GetName]に向けた外交的弁論による試みを全て断念した。全ての国境を根絶する使命が明確な焦点だ。"
 war_justification.5.a: "[FROM.GetAdjective]の労働者よ、解放の時は近い！"
 war_justification.6.t: "[Root.GetLeader]が[FROM.GetAdjective]の労働者援助に呼び掛け"
 war_justification.6.d: "「[FROM.GetAdjective]の人々が思っていた自由より大きな嘘はあるか？かつて農地の所有権を主張する君主や公爵の下で従属する立場から、今では工場の所有を主張する者に労働を売ることを強制されている。他の者より一人の主人を選ぶ自由など自由と呼べるものではない。同様に、彼らの指導者を選出する自由は虚偽の選択だ。さらにプロパガンダは真の社会主義者に権力を与えることを許さない。徹底的に吹き込まれている人々は[Root.GetAdjective]の介入によってのみ救われるのだ」\n\n[Root.GetLeader]は党会議で長い間、[FROM.GetName]政府に対して論争を展開した。だが、その弁論は今、公共の場でより頻繁に使っている。この衝突が平和的に解決できると信じる理由は残されている。"
 war_justification.6.a: "ブルジョワ階級の独裁政権を潰そう！"
 war_justification.7.t: "[FROM.GetAdjective]共産主義の失敗"
 war_justification.7.d: "「かつては偉大な革命家であった同志が裏切り者呼ばわりされ、革命そのものが裏切られていると見られるようになった。[FROM.GetName]での[FROM.GetRulingParty]のルールの他に何を説明するのだろうか。彼は誤った前提の下で支配できる、悪化していく労働者状況を作るため、マルクス主義の考えからの全てのヒントを放棄するのか？各国の革命の価値を自分達の権力の強化に利用し、保持しようとする理念を顧みると、少し不安に写る。我々は彼らに真の革命をもたらすべきだ」\n\n[FROM.GetAdjective]革命の初期は支持していたが、[Root.GetLeader]は発展の方法について失望の気持ちが強くなったことを表明した。[Root.GetRulingParty]は手遅れになる前に介入する必要があるだろう。"
 war_justification.7.a: "まだ彼らの社会主義への試みを救う時間は残っている"
 war_justification.8.t: "[Root.GetLeader]が[FROM.GetAdjective]ナショナリズムの倒壊を呼び掛け"
 war_justification.8.d: "「[FROM.GetName]のファシスト政権より、これ以上労働者の窮状に無縁な革命の未来にどのような社会があるというのか？国民国家の老朽化した制度に熱狂的に打ち込むことを国民に求め、近世服飾で飾りつつ残虐な古来のやり方に扮装し、必然的な労働階級の国際的勝利と称してに二者択一の未来を彼らに突きつけようとしている。彼らが我々もしくは連合国を攻撃するようになるのも単に時間の問題だ」\n\n我々と[FROM.GetAdjective]間で互いに軽蔑し合ったりしないとは誰も予想していなかったが、最近では敵意が強まった。意外に早く対立が起こりそうな状態だ。"
 war_justification.8.a: "ファシストどもに死を！"
 war_justification.9.t: "[FROM.GetName]との外交決裂"
 war_justification.9.d: "「[FROM.GetName]との対立に外交的解決を見出す試みにもかかわらず、交渉が再び分裂し、限られた選択肢しか残されていない。[FROM.GetLeader]の独裁政権はこの問題に対して、人々に責任を持たない指導者たちに典型的な不当な対応を取った。[FROM.GetAdjective]のリーダーシップの方針に大きな転換がなければ、我々には戦う以外に頼る術はない」\n\n[Root.GetRulingParty]が最初からタカ派の政策を進めていると批判する野党政治家もいる中、[Root.GetAdjective]の[FROM.GetName]への干渉が論争の的となっている。元の意図がどうあれ、突如として将来の戦争が非常に現実的かつ必然的なものとなったようだ。"
 war_justification.9.a: "時には争いの山に登る必要がある"
 war_justification.10.t: "[Root.GetLeader]が[FROM.GetName]への介入呼び掛け"
 war_justification.10.d: "'It is with heavy heart that we must confront the reality of our situation: An invasion of [FROM.GetName] may be our only recourse. It is of too great a strategic advantage to attempt any other solution in our current situation. Although we trust that neither the [Root.GetAdjective] nor the [FROM.GetAdjective] people want war, history has led us to this point and our options are limited. We can only hope that through this assertion of our military power, we can avoid further bloodshed in the future.'\n\nAlthough it is a popular theory that democracies do not go to war against other democracies, recent developments have pointed to a [Root.GetAdjective] invasion of [FROM.GetName] in the future. History may surprise us yet."
 war_justification.10.a: "いずれにせよ[FROM.GetName]は怪しげな民主主義だ"
 war_justification.11.t: "[Root.GetLeader]が赤い脅威と対話"
 war_justification.11.d: "'Without a doubt, [FROM.GetAdjective] communism is one of the greatest threats to liberty and order in this era. Relentless and ruthless, it threatens to devour not only the [FROM.GetAdjective] people's hope of a prosperous, democratic society, but that of its neighbors as well. If we do not act now, we may well see this first domino fall too late, leaving more failed social experiments in its wake. How many more need die before we intervene?'\n\nThe threat of subversive activity undermining our democracy, fueled by [FROM.GetAdjective] ambitions, has become a hotly debated topic recently. While representatives in opposition have called this a Red Scare aimed at pursuing war with [FROM.GetName], the rhetoric of the [Root.GetRulingParty] has been highly successful so far."
 war_justification.11.a: "彼らが暴力的なイデオロギーに従ったら、暴力以外でどのような反応を期待するのか？"
 war_justification.12.t: "[Root.GetLeader]、[FROM.GetAdjective]ファシズムに対峙"
 war_justification.12.d: "「近代史の中、いや歴史全体でみても[FROM.GetRulingParty]による[FROM.GetName]の専制統治より酷い暴政はなかった。人々は、我々が争いを引き起こすべきでない、[FROM.GetLeader]が条約や約定を順守すると信じるべきだと言うかもしれないが、このような人々は、ファシズム体制下で結ばれた条約は役に立たないことがわかっていない。彼ら卑劣な嘘つきにとっては力こそ正義であり、契約が記載された紙面は反対派の書物と同じように簡単に燃やされる」\n\n[FROM.GetName]との直接対決を避けることを長らく期待してきた人々は、今や[Root.GetLeader]による強力な反論に晒されている。彼はマキャベリの言葉を使って、我々は戦争を先送りすることでただ敵を有利にしているだけだ、と主張したのだ。このままだと結局、我々は先手を打つことになるだろう。"
 war_justification.12.a: "彼らがいなくなるまで我々の時代に平和はない"
 war_justification.13.t: "[Root.GetLeader]、[FROM.GetName]との戦争を要求"
 war_justification.13.d: "'Although we may be a peaceful people, our nature alone does not determine the course we must take in history. This is a time of war. For too long, the [FROM.GetAdjective] have possessed the means that we need to make it through the trials we may face, and it's apparent that they will not part with them peacefully. Despite our best efforts to build a modern state, some matters can only be settled through the old trials of battle.'\n\n[Root.GetLeader]'s hostile rhetoric towards [FROM.GetName] has gone to great lengths to justify an invasion. Some portion of the population support this course, but the decision lies in the hands of our leader."
 war_justification.13.a: "難しい決断であるが、支援すべきだろう"
 war_justification.14.t: "[Root.GetLeader]、[FROM.GetAdjective]の傲慢に異議"
 war_justification.14.d: "'[FROM.GetName] may think themselves more modern and advanced than us, but the truth is that their nation has not been tested as ours has, nor are they prepared for the threats now plain to see on the horizon. By their disdain towards us, and preventing us from seizing that which is rightfully ours, they have made us one of those threats to themselves. Their weak and divided nation will hardly resist our claims.'\n\nThe derisive opinion of [FROM.GetName] long held by the [Root.GetRulingParty] has developed from criticism to hostility. Although popular opinion is that the [FROM.GetAdjective] people want to avoid war, [Root.GetLeader] claims that their elected leaders have provoked it through their arrogance."
 war_justification.14.a: "我々の試練がどのように力強く培われたか彼には分らない"
 war_justification.15.t: "[Root.GetLeader]が[FROM.GetName]の秩序を正すことを希望"
 war_justification.15.d: "「[Root.GetAdjective]国民の精神は強い。だが全てではないが、かなり幸運だった。[FROM.GetName]は伝統を破壊したし、かなり前には正当な統治者を殺害し、葬り去った。全て偉大なマルクス主義革命の理念という名目で。この脅威に対して[Root.GetName]の強さを主張し、血に飢えた簒奪者に惑わされたこの世界の秩序を正すことが我々の義務だ」\n\n[Root.GetRulingParty]が常に共産主義に反対してきた中、[FROM.GetName]は先日のスピーチで一部から攻撃の標的にされている。[Root.GetAdjective]国家からの共産主義者の攻撃が現実の脅威であるかどうかに関わらず、[FROM.GetAdjective]共産主義への先制攻撃はすでに準備中だ。"
 war_justification.15.a: "革命で殺された人々のために復讐だ！"
 war_justification.16.t: "[Root.GetLeader]、[FROM.GetAdjective]の抑圧者を非難"
 war_justification.16.d: "「敵対者は私の統治が[FROM.GetRulingParty]による[FROM.GetName]支配と同様であると君たちを信じさせたかもしれない。これは全くの誤りである。[FROM.GetLeader]の成功は一過性の破壊的な大衆運動が他国を蹂躙し服従させようと執心した結果である一方、[Root.GetRulingParty]は抑圧に屈することの無い抵抗者として立ちはだかる。このような脅威を排除するために必要なことは何でもする覚悟だ。たとえそれが戦争を意味しようとも」\n\n[Root.GetLeader]政権は[FROM.GetAdjective]国家に対する敵視政策を採用した。我々のリーダーがどのように呼ばれようとも、ファシストこそが我らが敵の名だ。"
 war_justification.16.a: "伝統と現実主義は常に狂信と恐怖に打ち勝つだろう"
 war_justification.17.t: "[Root.GetLeader]が[FROM.GetAdjective]の主権について問いかけた"
 war_justification.17.d: "「国の境を決めるのは誰だろうか、どうやって決めるのだろうか？過去の人々がどのように[Root.GetName]の終点と[FROM.GetName]の始点を正当化したのであろうとも、我々は新しい時代に生きている。この国境線の戦略的な重要性は誇張し過ぎるということはなく、国民の安全を継続的に確保するため境界を変更することは我々の当然の権利だ」\n\n[Root.GetLeader]の最近のスピーチは、[FROM.GetName]の侵略が差し迫っていることを表している。反対意見も唱えられたが、戦争に対する国民の支持は上昇している。"
 war_justification.17.a: "この主張を後押しする必要がある！"
 war_justification.18.t: "[Root.GetLeader]が[FROM.GetName]の真意について問いかけた"
 war_justification.18.d: "「[FROM.GetName]が戦争の準備をしていることは間違いない。経済政策の変更は[FROM.GetAdjective]が平和の人々でないことが一目瞭然だ。むしろ我々に対して攻撃を行う適切な機会を待っているのだろう。[Root.GetName]が無防備の間、我々は彼らの武装を対岸の火事とするのか？もしくは我々の力を超える前にこの脅威を取り除くか？」\n\n[Root.GetRulingParty]のタカ派は[FROM.GetName]に目を向け、攻撃が最善の防御であることを主張した。彼らの着眼点は支持を得て、[Root.GetName]は戦争の準備を進めている。"
 war_justification.18.a: "少なくとも戦争を通して、この対立に終わりがくるだろう"
 war_justification.19.t: "[Root.GetLeader]が[FROM.GetAdjective]の姿勢に憤慨"
 war_justification.19.d: "「[FROM.GetAdjective]人が平和を好む国民であると想像する[Root.GetName]の素朴な市民がいるなら、彼らは現実世界とのつながりが完全に絶たれている。国境に住む者たちは、境界を越えて我々に迫ってくる敵軍を目の当たりにしており、そのような幻想を抱いている余裕などないのだ。この脅威に対し黙って座しているわけにはいかない。来る日も、来る日も[FROM.GetName]は戦争を準備している。これに対抗しないのは狂気の沙汰と言えるだろう」\n\n[FROM.GetName]の[Root.GetRulingParty]に対する敵対姿勢が日増しに明白なものになるにつれて、[FROM.GetAdjective]が我が国の領土付近に配備した軍は深刻な懸念を招いている。この状況が彼らの論争の原因なのか、それとも帰結なのかは議論の余地がある。"
 war_justification.19.a: "いずれにせよ、我々は臨戦態勢を整えねばならない"
 war_justification.20.t: "[Root.GetLeader]が[FROM.GetName]への侵略を提唱"
 war_justification.20.d: "'If we want to have the strategic advantage in the foreseeable, not to say inevitable war with [FROM.GetName], there is no room to hesitate. This is about safeguarding our children's futures and ensuring that [Root.GetName] has a place in the world tomorrow. This is a matter of devotion to our cause and the ideals we take for granted. It's time to act.'\n\nA series of rousing speeches from [Root.GetRulingParty] leaders, most prominently [Root.GetLeader], has been calling the public to support an invasion of [FROM.GetName]. The geopolitical motives behind the invasion are less prominent in the rhetoric than patriotic sentiments, but this campaign appears highly efficient in convincing the public of its necessity."
 war_justification.20.a: "国家はこの重要な意思決定の後押しをしよう"
 war_justification.201.t: "[FROM.GetLeader]、[Root.GetName]を口撃する"
 war_justification.201.d: "'Does [Root.GetName] belong to the [Root.GetAdjective]? Let us ask ourselves a better question: Does the future belong to the [Root.GetAdjective] or does it belong to [FROM.GetName]?'\n\n[FROM.GetLeader]'s speech today suggested that [FROM.GetName] is on the path to war. Political tensions have been building over the past month and it seems the [FROM.GetAdjective] people have accepted that war is inevitable. [Root.GetName] must also prepare."
 war_justification.201.a: "なぜ平和に暮らすことができないのだ？"
 war_justification.202.t: "[FROM.GetLeader]、[Root.GetAdjective]の理想を非難"
 war_justification.202.d: "「[Root.GetAdjective]は自由と民主主義を標榜し、平和を望むと主張している。しかし彼らが誇りとしている全ての価値は虚構にすぎない。彼らの民主主義は団結すべき人々を分断し、自由は規律の欠如を招くだけだ。我々、[FROM.GetAdjective]はこれらの嘘を見抜いた……そしてこの平和、彼らの言う平和も嘘である」\n\n[FROM.GetRulingParty]]は[Root.GetAdjective]国民の軟弱さを長く嘲笑ってきたが、最近は表現が攻撃的になっている。武力衝突の日は近い。"
 war_justification.202.a: "思った通り、[FROM.GetLeader]はファシストの屑だ"
 war_justification.203.t: "[FROM.GetLeader]、[Root.GetAdjective]共産主義へ警告"
 war_justification.203.d: "'Is there a bigger threat to our way of life, or indeed the way of life itself, than communism? This plague that threatens to make the slaves, not the masters, rule every nation, to abolish the nation itself, to abolish people and their history. We will take [Root.GetName] and abolish the communist plague.'\n\n[FROM.GetLeader]'s hatred of communists has been well known since before [FROM.GetRulingParty]'s rise to power, but it appears to have intensified recently in the specific case of the [Root.GetAdjective] government. Our quest to purge Marxism off the face of the Earth may start there."
 war_justification.203.a: "彼らが我れの大義を恐れているのなら、それは彼らの国民を恐れているのだ"
 war_justification.204.t: "[FROM.GetName]は重大な闘争へ向け準備"
 war_justification.204.d: "'The [Root.GetAdjective] are a people who will not part easily with power. However, they must also realize that the trajectory of our two nations can only end in a clash. We must steel ourselves for the struggle to come. For [Root.GetName] will not be taken without a fight.'\n\nThe possibility of an understanding between the similarly minded governments of [Root.GetName] and [FROM.GetName] has given way to a campaign to take their territory by force."
 war_justification.204.a: "かかってこい！"
 war_justification.205.t: "[FROM.GetLeader] Brings Revolution to [Root.GetName]"
 war_justification.205.d: "「[FROM.GetName]で社会主義社会を固める一方で、多くの国では未だ専制君主の下で苦しんでいる。[Root.GetName]では労働者の声なく、組織的でなく、社会主義の研究は[Root.GetLeader]政権にひねり潰される。[Root.GetAdjective]の人々のため、国際的革命の歯車が回ることが待ちきれない。我々が資本主義の抑圧を粉砕できることを証明した。同じように[Root.Capital.GetName]の抑圧を粉砕しようではないか！」\n\n[FROM.GetLeader]は政府による外交の試みを全て断念した。共産主義の使命は全ての国の国境の根絶であり、今や我が国のそれが主な標的となっている。"
 war_justification.205.a: "[Root.GetLeader]は革命的な日和見主義者より良い指導者だ！"
 war_justification.206.t: "[FROM.GetLeader]が[Root.GetAdjective]の労働者援助に呼び掛け"
 war_justification.206.d: "「[Root.GetAdjective]の人々が思っていた自由より大きな嘘はあるか？かつて農地の所有権を主張する君主や公爵の下で従属する立場から、今では工場の所有を主張する者に労働を売ることを強制されている。他の者より一人の主人を選ぶ自由など自由と呼べるものではない。同様に、彼らの指導者を選出する自由は虚偽の選択だ。さらにプロパガンダは真の社会主義者に権力を与えることを許さない。徹底的に吹き込まれている人々は[FROM.GetAdjective]の介入によってのみ救われるのだ」\n\n社会実験をしなくても我が国民は満足するかもしれないということを受け入れたくない、[FROM.GetName]の共産主義政権は、公然と我が国を攻撃すると脅している。この紛争が平和的に解決できると信じるに足る理由はほとんどない。"
 war_justification.206.a: "彼らが我々に強制するなら、彼らの信念を持つメリットは何があるのか？"
 war_justification.207.t: "[Root.GetAdjective]共産主義の失敗"
 war_justification.207.d: "「かつては偉大な革命家であった同志が裏切り者呼ばわりされ、革命そのものが裏切られていると見られるようになった。[Root.GetName]での[Root.GetRulingParty]のルールの他に何を説明するのだろうか。彼は誤った前提の下で支配できる、悪化していく労働者状況を作るため、マルクス主義の考えからの全てのヒントを放棄するのか？各国の革命の価値を自分達の権力の強化に利用し、保持しようとする理念を顧みると、少し不安に写る。我々は彼らに真の革命をもたらすべきだ」\n\n[Root.Capital.GetName]で[Root.GetRulingParty]の勝利は始めは支持していたが、[FROM.GetLeader]は[Root.GetLeader]の思想から疎遠になった。彼らが我々に対して社会主義ブランドを広げるため、侵略の準備を行い、紛争が段階的に拡大した。"
 war_justification.207.a: "革命が[Root.GetAdjective]国民に与える影響を彼らは理解していない"
 war_justification.208.t: "[FROM.GetLeader]が[Root.GetAdjective]ナショナリズムの倒壊を呼び掛け"
 war_justification.208.d: "「[Root.GetName]のファシスト政権より、これ以上労働者の窮状に無縁な革命の未来にどのような社会があるというのか？国民国家の老朽化した制度に熱狂的に打ち込むことを国民に求め、近世服飾で飾りつつ残虐な古来のやり方に扮装し、必然的な労働階級の国際的勝利と称してに二者択一の未来を彼らに突きつけようとしている。彼らが我々もしくは連合国を攻撃するようになるのも単に時間の問題だ」\n\n我々と[Root.GetAdjective]間で互いに軽蔑し合ったりしないとは誰も予想していなかったが、最近では敵意が強まった。[FROM.GetLeader]の演説を聞き、意外に早く対立が起こりそうな状態だ。"
 war_justification.208.a: "共産主義者に死を！"
 war_justification.209.t: "[Root.GetName]との外交決裂"
 war_justification.209.d: "「[Root.GetName]との対立に外交的解決を見出す試みにもかかわらず、交渉が再び分裂し、限られた選択肢しか残されていない。[Root.GetLeader]の独裁政権はこの問題に対して、人々に責任を持たない指導者たちに典型的な不当な対応を取った。[Root.GetAdjective]のリーダーシップの方針に大きな転換がなければ、我々には戦う以外に頼る術はない」\n\n[FROM.GetRulingParty]が最初からタカ派の政策を進めているという批判の声が野党政治家からも上がっている中、[FROM.GetAdjective]の我々への内政干渉が論争の的となっている。元の意図がどうあれ、突如として将来の戦争が非常に現実的かつ必然的なものとなったようだ。"
 war_justification.209.a: "奴らの見下すような言い方は我々への脅しにならないだろう"
 war_justification.210.t: "[FROM.GetLeader]が[Root.GetName]への介入呼び掛け"
 war_justification.210.d: "'It is with heavy heart that we must confront the reality of our situation: An invasion of [Root.GetName] may be our only recourse. It is of too great a strategic advantage to attempt any other solution in our current situation. Although we trust that neither the [FROM.GetAdjective] nor the [Root.GetAdjective] people want war, history has led us to this point and our options are limited. We can only hope that through this assertion of our military power, we can avoid further bloodshed in the future.'\n\nAlthough it is a popular theory that democracies do not go to war against other democracies, recent developments have pointed to a [FROM.GetAdjective] invasion of [Root.GetName] in the future. History may surprise us yet."
 war_justification.210.a: "[FROM.GetName]は積極的な行動を求める、とにかく怪しげな民主主義だ"
 war_justification.211.t: "[FROM.GetLeader]が赤い脅威と対話"
 war_justification.211.d: "'Without a doubt, [Root.GetAdjective] communism is one of the greatest threats to liberty and order in this era. Relentless and ruthless, it threatens to devour not only the [Root.GetAdjective] people's hope of a prosperous, democratic society, but that of its neighbors as well. If we do not act now, we may well see this first domino fall too late, leaving more failed social experiments in its wake. How many more need die before we intervene?'\n\nThe nascent worker's movement has intimidated [FROM.GetAdjective] leaders. While representatives in their opposition have called this a Red Scare aimed at pursuing war with us, the rhetoric of the [FROM.GetRulingParty] has been highly successful so far."
 war_justification.211.a: "利益を生み出す限り、資本家は戦争を作り上げるだろう"
 war_justification.212.t: "[FROM.GetLeader]、[Root.GetAdjective]ファシズムに対峙"
 war_justification.212.d: "「近代史の中、いや歴史全体でみても[Root.GetRulingParty]による[Root.GetName]の専制統治より酷い暴政はなかった。人々は、我々が争いを引き起こすべきでない、[Root.GetLeader]が条約や約定を順守すると信じるべきだと言うかもしれないが、このような人々は、ファシズム体制下で結ばれた条約は役に立たないことがわかっていない。彼ら卑劣な嘘つきにとっては力こそ正義であり、契約が記載された紙面は反対派の書物と同じように簡単に燃やされる」\n\n我々が築きつつある輝かしい社会や依拠する遺産に嫉妬し、[FROM.GetAdjective]はそれを破壊するため戦争を開始する準備をしているようだ。彼らの言う平和などそんなものでしかない。"
 war_justification.212.a: "避けられないな。片付けてしまったほうがよい。"
 war_justification.213.t: "[FROM.GetLeader]、[Root.GetName]との戦争を要求"
 war_justification.213.d: "'Although we may be a peaceful people, our nature alone does not determine the course we must take in history. This is a time of war. For too long, the [Root.GetAdjective] have possessed the means that we need to make it through the trials we may face, and it's apparent that they will not part with them peacefully. Despite our best efforts to build a modern state, some matters can only be settled through the old trials of battle.'\n\nIn a recent speech to the [FROM.GetAdjective] people the hostile rhetoric towards [Root.GetName] has intensified and [FROM.GetLeader] has gone to great lengths to justify an invasion. Some portion of the population support this course, but the decision lies in the hands of their leader."
 war_justification.213.a: "彼らは我々を敵にしたことを後悔するだろう"
 war_justification.214.t: "[FROM.GetLeader]、[Root.GetAdjective]の傲慢に異議"
 war_justification.214.d: "'[Root.GetName] may think themselves more modern and advanced than us, but the truth is that their nation has not been tested as ours has, nor are they prepared for the threats now plain to see on the horizon. By their disdain towards us, and preventing us from seizing that which is rightfully ours, they have made us one of those threats to themselves. Their weak and divided nation will hardly resist our claims.'\n\nThe derisive opinion of [Root.GetName] long held by the [FROM.GetRulingParty] has developed from criticism to hostility. Although popular opinion is that the [Root.GetAdjective] people want to avoid war, [FROM.GetLeader] claims that our elected leaders have provoked it through their arrogance."
 war_justification.214.a: "[FROM.GetAdjective]国民の平和の声は、もちろん、黙らせた"
 war_justification.215.t: "[FROM.GetLeader]が[Root.GetName]の秩序を正すことを希望"
 war_justification.215.d: "「[FROM.GetAdjective]国民の精神は強い。だが全てではないが、かなり幸運だった。[Root.GetName]は伝統を破壊したし、かなり前には正当な統治者を殺害し、葬り去った。全て偉大なるマルクス主義革命の理念という名目で。この脅威に対して[FROM.GetName]の強さを主張し、血に飢えた簒奪者に惑わされたこの世界の秩序を正すことが我々の義務だ」\n\n[FROM.GetRulingParty]が常に共産主義に反対してきた中、[Root.GetName]は先日のスピーチで一部から攻撃の標的にされている。歴史が次のステージに向かうという、彼らの国の避けられない進歩を恐れ、[Root.GetAdjective]共産主義への先制攻撃はすでに準備中だ。"
 war_justification.215.a: "我々のやってきた進歩を逆転させるには遅すぎる"
 war_justification.216.t: "[FROM.GetLeader]、[Root.GetAdjective]の抑圧者を非難"
 war_justification.216.d: "「敵対者は私の統治が[Root.GetRulingParty]による[Root.GetName]支配と同様であると君たちを信じさせたかもしれない。これは全くの誤りである。[Root.GetLeader]の成功は一過性の破壊的な大衆運動が他国を蹂躙し服従させようと執心した結果である一方、[FROM.GetRulingParty]は抑圧に屈することの無い抵抗者として立ちはだかる。このような脅威を排除するために必要なことは何でもする覚悟だ。たとえそれが戦争を意味しようとも」\n\n[FROM.GetLeader]政権は[Root.GetAdjective]国家に対する敵視政策を採用した。我々の輝かしい拡大計画は彼の国民に屈辱を与え、当然のことながら彼らは脅威を感じているようだ。"
 war_justification.216.a: "彼らが我々の力を試すなら後悔するだろう"
 war_justification.217.t: "[FROM.GetLeader]が[Root.GetAdjective]の主権について問いかけた"
 war_justification.217.d: "「国の境を決めるのは誰だろうか、どうやって決めるのだろうか？過去の人々がどのように[FROM.GetName]の終点と[Root.GetName]の始点を正当化したのであろうとも、我々は新しい時代に生きている。この国境線の戦略的な重要性は誇張し過ぎるということはなく、国民の安全を継続的に確保するため境界を変更することは我々の当然の権利だ」\n\n[FROM.GetLeader]の最近のスピーチは、[Root.GetName]の侵略が差し迫っていることを表している。反対意見も唱えられたが、戦争に対する国民の支持は上昇している。"
 war_justification.217.a: "世界は先の大戦から何も学んでいないのか？"
 war_justification.218.t: "[FROM.GetLeader]が[Root.GetName]の真意について問いかけた"
 war_justification.218.d: "「[Root.GetName]が戦争の準備をしていることは間違いない。経済政策の変更は[Root.GetAdjective]が平和の人々でないことが一目瞭然だ。むしろ我々に対して攻撃を行う適切な機会を待っているのだろう。[FROM.GetName]が無防備の間、我々は彼らの武装を対岸の火事とするのか？もしくは我々の力を超える前にこの脅威を取り除くか？」\n\n[FROM.GetRulingParty]のタカ派は[Root.GetName]に目を向け、攻撃が最善の防御であることを主張した。彼らの着眼点は支持を得て、[FROM.GetName]は戦争の準備を進めている。"
 war_justification.218.a: "これこそが正に我らが準備をせねばならない理由だ"
 war_justification.219.t: "[FROM.GetLeader]が[Root.GetAdjective]の姿勢に憤慨"
 war_justification.219.d: "'Those naïve citizens of [FROM.GetName] who imagine the [Root.GetAdjective] as a people of peace are entirely out of touch with reality. Those who live at our border do not have the luxury of such delusions, seeing their troops closing in on us just across it. This is a threat we cannot leave unanswered. With every passing day, [Root.GetName] is preparing for war. It would be madness for us not to do the same.'\n\nOur military presence close to [FROM.GetAdjective] territory has sparked increased concern, since they interpret our troop movements as proof of hostile intent. They hardly seem to have considered that their aggressive rhetoric is the reason for our defensive measures."
 war_justification.219.a: "このような脅威を前にして、銃を置くことなどできるはずがない"
 war_justification.220.t: "[FROM.GetLeader]が[Root.GetName]への侵略を提唱"
 war_justification.220.d: "'If we want to have the strategic advantage in the foreseeable, not to say inevitable war with [Root.GetName], there is no room to hesitate. This is about safeguarding our children's futures and ensuring that [FROM.GetName] has a place in the world tomorrow. This is a matter of devotion to our cause and the ideals we take for granted. It's time to act.'\n\nA series of rousing speeches from [FROM.GetRulingParty] leaders, most prominently [FROM.GetLeader], has been calling the public to support an invasion of [Root.GetName]. The geopolitical motives behind the invasion are less prominent in the rhetoric than patriotic sentiments, but this campaign appears highly efficient in convincing the public of its necessity."
 war_justification.220.a: "周到に準備をしよう。戦争になる。"
 war_justification.301.t: "[Root.GetLeader]、弱腰外交を批判"
 war_justification.301.d: "「我々は敵を攻撃するチャンスがあったが、[Root.GetRulingParty]が大目に見た。これら一連の出来事は国際的に[Root.GetName]の地位を強化する機会を逃しただけでなく、[Root.GetAdjective]国民の利益のための行動であるとする彼らの主張が空虚であることを示している。今や政策変更の時期だ」\n\n多くの人々が期待を寄せていた戦争遂行の失敗は、政治的反対勢力から辛口の批判の的となった。定められた軍事計画に従わなければ、我々が[Root.GetName]を導こうとする方向に国民を納得させるのはさらに難しいものとなるだろう。"
 war_justification.301.a: "奴らは戦争がしたいのだろうか？"
 war_justification.301.b: "党の決定に公衆の不服が入り込む余地はない"
 war_justification.301.c: "人々が[Root.GetLeader]の臆病さを非難することを許さない！"
 nuke_dropped.1.t: "[FROM.FROM.GetName]への原子爆弾投下"
 nuke_dropped.1.d: "史上初めて、そして願わくば史上最後であって欲しいが、一連の国際紛争の流れの中、核爆弾が[FROM.FROM.GetName]で爆発した。この新兵器の破滅的威力を証明するかのように、有史以来例のない規模の破壊が発生した。そして人々は、被爆地で発生した被害に対してだけでなく、核兵器の配備が進むことで人類に待ち構えている事態に対して、恐怖した。\n\n世界は息を殺して、次に訪れるものを待ち構えている。核兵器はさらなる恐怖を避けるため降伏することを[FROM.FROM.Owner.GetName]に強いるかもしれないし、核兵器使用という非人道的攻撃を行った者たちに対する反撃の決意を強めるだけかもしれない。"
 nuke_dropped.1.a: "真の意味で原子力時代が到来した"
 nuke_dropped.1.b: "[Root.GetAdjective]の人々を守る為なら我々は何でもしよう"
 nuke_dropped.2.t: "広島への原子爆弾投下"
 nuke_dropped.2.d: "「道路上はもう地獄の様でした」\n - 相川国義\n\n今日、広島市上空580mで核爆弾が起爆された。市の3分の2は瞬時に破壊された。都市は地震に耐えるよう建てられていたにも関わらず、爆風に生き残ったのはほんの少しの頑丈な建造物だけだった。\n\n原子爆弾の威力は大衆に大きく宣伝されたが、それによる犠牲者は軽視された。敵も味方もその恐怖について考えたがらなかったが、その遺物は一瞬で失われた人命と残った死の灰となるだろう。"
 nuke_dropped.2.a: "この戦争が終わるまでに、あと何発落とされるのだろうか？"
 nuke_dropped.2.b: "速やかに被爆者の救護に当たらなければならない"
 nuke_dropped.3.t: "長崎への原爆投下"
 nuke_dropped.3.d: "A nuclear bomb, originally intended for Kokura, was detonated today over Nagasaki. Weather conditions forced the planes to divert their mission, a combination of smoke, clouds and technical difficulties being deciding factors in an event that may well change history.\n\nThe effects of the bomb were contained somewhat by the city's location in a valley, but the damage is still severe. Some military installations were struck, but the catastrophic civilian losses overshadow them by far. It may take decades before we know the long-term effects of this weapon with certainty."
 nuke_dropped.3.a: "これが[FROM.Owner.GetAdjective]の降伏につながるのだろうか？"
 nuke_dropped.3.b: "長崎が犠牲にならないことを願っていたのだが"
 nuke_dropped.4.t: "ベルリンへの原爆投下"
 nuke_dropped.4.d: "Today, at [GetDateText], the German capital of Berlin was struck by a nuclear explosion. The city has suffered several attacks, in this war and the last, but all else pales in comparison to this. Not since the Thirty Years' War has Berlin seen comparable devastation - considering its growth, this was seen as an impossibility.\n\nThe Führerbunker appears to have survived the blast at least partially due to the bomb detonating away from its planned epicenter, and [FROM.Owner.GetLeader] is rumored to still be alive, if outraged. How [FROM.Owner.GetAdjective] leaders should be evacuated and if they can be protected from the fallout is another matter, however."
 nuke_dropped.4.a: "今日、私はベルリン市民で無かったことに安心したよ"
 nuke_dropped.4.b: "敵は国の心臓部を狙ってきた！"
 nuke_dropped.5.t: "ロンドンへの原爆投下"
 nuke_dropped.5.d: "A nuclear explosion has devastated the city of London today. Despite the city's anti-air defenses, [FROM.Owner.GetName] was not prepared for this attack. At [GetDateText], Big Ben chimed for the last time, having been melted by the blast. Early reports suggest Buckingham Palace has been completely leveled and the whereabouts of the royal family are currently unknown.\n\n[FROM.Owner.GetLeader] has nevertheless been confirmed to have survived and is preparing a rousing speech for the radio later today. With morale at an all-time low, the British people are in dire need of this - or a very eloquent surrender."
 nuke_dropped.5.a: "核の爆風に直面して恐れを自制し続けることは難しい"
 nuke_dropped.5.b: "神よ国王を守り給え！"
 nuke_dropped.6.t: "京都への原爆投下"
 nuke_dropped.6.d: "The city of Kyoto, a prominent [FROM.Owner.GetAdjective] industrial center, was struck today by a nuclear bomb. It is speculated that the city was chosen as a target because it has been regarded as an intellectual center.\n\nThe beauty and historical significance of Kyoto led many to assume it would be spared from the bomb, but it appears the terror of raining destruction on such a place has rather been seen as a benefit, increasing the psychological impact of the attack. The city's location in the valley somewhat limited the blast, but the old Imperial Palace and many industrial buildings have been completely destroyed."
 nuke_dropped.6.a: "遺産と美しさは、このような戦争においては何の意味もない"
 nuke_dropped.6.b: "彼らが古いものを破壊するのなら、我々は新しいものを作り上げるだろう"
 nuke_dropped.7.t: "東京への原爆投下"
 nuke_dropped.7.d: "今日、大日本帝国の心臓部に核が落とされた。帝都東京は焼夷弾の標的であることにはなっていたが、決してこの新兵器の優先目標ではなかった。それでも最終的には、新たな首都か皇居のどちらかが重要な破壊目標として加えられ、都市のすべてを焼き尽くす程の炎がいま降りかかった。\n\n[FROM.Owner.GetLeader]は生き延びていたことが報告されたが、この出来事は日本の敵がどこまでやるつもりなのかについての疑問を提起した。これで戦争が終わらないのならば、次は何処が標的になるのだろうか？まだ脅しの対象になる様なものは残っているのだろうか？"
 nuke_dropped.7.a: "これは、大日本帝国の終焉を意味するのか？"
 nuke_dropped.7.b: "天皇陛下があらせられる限り、帝国は不滅である"
 nuke_dropped.8.t: "ワシントンD.C.への原爆投下"
 nuke_dropped.8.d: "本日、アメリカ合衆国の首都で核爆弾が炸裂した。明らかにアメリカの政治的中心地と歴史的遺産を狙った攻撃によって、ホワイトハウスやキャピトル（合衆国議会議事堂の愛称）、その他多くのモニュメントやメモリアルが地上から消し去られた。この破滅的な威力の爆弾によってワシントンがこうむった被害は、一世紀前にワシントンが焼き討ちを受けた際の被害とは比べ物にならない規模だ。\n\n[FROM.Owner.GetLeader]は難を逃れたが、ワシントンを破壊されたことで国内は動揺している。アメリカは、自国こそが核兵器を使用する最初で唯一の国となることを望んでいた。しかしその望みは、今や最悪の形で砕かれた。"
 nuke_dropped.8.a: "分割すべからざる一国家に対して、分裂する一つの核"
 nuke_dropped.8.b: "灰から甦る不死鳥のように、鷲は再び飛び立つだろう"
 nuke_dropped.9.t: "ローマへの原爆投下"
 nuke_dropped.9.d: "本日ローマを襲った核爆発に、世界中の人々が衝撃を受けた。多くはローマのその歴史と芸術の宝物によって、まさかこのような無差別攻撃の対象になるとは思ってもいなかった。また、部分的に破壊されたバチカン市国と教皇の消息不明は、イタリア人のみならず世界中のカトリック信徒を恐怖させた。\n\nここ十年間のローマの急速な成長は、この攻撃によって全くの台無しとなった。全てが終われば、街は国の修復の助けになるだろうという希望は今、多くの人々と共に塵となった。"
 nuke_dropped.9.a: "Bomba Iacta Est!（核は投げられた！）"
 nuke_dropped.9.b: "ローマは一日にして戻らず……"
 nuke_dropped.10.t: "パリへの原子爆弾投下"
 nuke_dropped.10.d: "本日パリに投下された核兵器は、非常に広範囲の破壊とおびただしい数の死者を生み出した。戦争と革命の幾世期においてさえ、かつて経験したことの無い程の圧倒的な破壊に、フランスは強い衝撃を受けた。占領されるであろうという、ある種楽観的な予想をしていた多くのパリ市民は、痛ましい荒廃を前に声すらも発することができなかった。\n\nシャンゼリゼ通りに残る戦勝を祝う筈の凱旋門に、今の惨状は似つかわしくない。何十年か後には、パリは新しい街並みへと変わるだろうが、そこにはパリの市民精神も、あの華やかな時代の街並みも、全ては永遠に失われたものとなっているであろう。"
 nuke_dropped.10.a: "パリの灯は燃え尽きた"
 nuke_dropped.10.b: "昨日まで、パリは常に存在すると思っていたよ"
 nuke_dropped.11.t: "モスクワへの原爆投下"
 nuke_dropped.11.d: "幾度と無く征服が試みられ、そのことごとくを退けてきた都市モスクワが本日、核攻撃に見舞われた。爆発は[FROM.Owner.GetAdjective]指導部の中枢を直撃し、爆風によってクレムリンはほとんど完膚なきまでに破壊された。\n\n[FROM.Owner.GetLeader]はあらゆる実在ないしは架空の危機に対する恐怖と疑念を近年ますます強めていたためちょうど避難しており無事だった。しかしかように無慈悲なる敵から逃げ切るには広大な[FROM.Owner.GetName]の国土でさえ十分ではないだろう。実際このままではこの国は2種類の不毛の大地によってのみ構成されることとなるだろう。最初からそうであった土地と、敵によって作り出される土地である。"
 nuke_dropped.11.a: "核の冬によってモスクワはさらに難攻不落となってしまったのではないか？"
 nuke_dropped.11.b: "奴らは都市を全て焼き尽くすかもしれないが、それでも決して奴らに明け渡しはしない"
 nuke_dropped.12.t: "コペンハーゲンへの原爆投下"
 nuke_dropped.12.d: "今日、コペンハーゲンの市街地が核爆発に襲われた。先の大戦においてはデンマークの中立によって破壊を免れ成長を続けてきたため、首都はナポレオン戦争からこちらこのような破壊を全く経験せずに来ていた。エーレスンド海峡周辺では相当な量の死の灰が見られ、生存者はフュン島やさらに攻撃される恐れのある本土へ避難し始めている。\n\n国王クリスチャン10世は現在消息が知れず、国家の士気は攻撃によってひどく傷めつけられている。これがヨーロッパ最古の国家終焉の幕開けとなるのかどうかは、まだわからない。"
 nuke_dropped.12.a: "何かがデンマークを国ごと照らした"
 nuke_dropped.12.b: "かの都市は燃やされども未だ死せず"
 nuke_dropped.12.c: "プルトニウムによってデンマーク人共を屈従させる！"
 nuke_dropped.13.t: "ストックホルムへの原爆投下"
 nuke_dropped.13.d: "北のヴェネツィアと名高い、ストックホルムの美しい市街に、核爆弾が今日投下された。彼らの中立であろうとした最善の努力にもかかわらず、スウェーデンは国際紛争への究極の対価を支払った。将来の開発と大規模な建設計画が目指されていた、爆心地のストックホルム南中部は、今や不可逆なほどに破壊された。\n\n街の大部分は見わけもつかないほどになってしまったが、スルッセンの古い建物群は想定よりも残った。これらは街の抵抗力のモニュメントとして永久にそのまま保存されるべきだと決定された。"
 nuke_dropped.13.a: "これによって、スウェーデンの中立は思い出以外の何物でもなくなるだろう"
 nuke_dropped.13.b: "スウェーデンの虎が縞を失うものか！"
 country_capitulated.0.t: "[Root.GetName]が降伏"
 country_capitulated.0.d_positive_both_no_faction: "\n[FROM.FROM.GetLeader]は、臆病な[Root.GetAdjective]がもはや[FROM.FROM.GetAdjective]による圧倒的な軍勢の圧力に耐えることができなくなったと発表した。[Root.GetAdjective]政府は国外へ亡命した。彼らの主力は降伏し、現在は[FROM.FROM.GetName]が彼らの母国を支配している。\n他所での戦争は継続しているが、これは[FROM.FROM.GetName]の偉大な勝利である。"
 country_capitulated.0.d_positive_prev_no_faction: "\n[FROM.FROM.GetLeader]は、臆病な[Root.GetAdjective]がもはや[FROM.FROM.GetAdjective]による圧倒的な軍勢の圧力に耐えることができなくなったと発表した。[Root.GetAdjective]政府は国外へ亡命した。彼らの主力は降伏し、現在は[FROM.FROM.GetName]が彼らの母国を支配している。\n[Root.GetFactionName]との戦争は他所で継続しているが、これは[FROM.FROM.GetName]の偉大な勝利である。"
 country_capitulated.0.d_positive_prev_faction: "\n[FROM.FROM.GetLeader]は、臆病な[Root.GetAdjective]がもはや[FROM.FROM.GetAdjective]による圧倒的な軍勢の圧力に耐えることができなくなったと発表した。[Root.GetAdjective]政府は国外へ亡命した。彼らの主力は降伏し、現在は[FROM.FROM.GetName]が彼らの母国を支配している。\n[Root.GetFactionName]との戦争は他所で継続しているが、これは全[FROM.FROM.GetFactionName]の偉大な勝利である。"
 country_capitulated.0.d_negative_both_no_faction: "\n[Root.GetLeader]は、[Root.GetAdjective]はもはや占領している[FROM.FROM.GetAdjective]軍からの圧力に耐えられず、国全体が形骸化していると発表した。[Root.GetAdjective]政府は亡命した。彼らの主力は降伏し、現在は[FROM.FROM.GetName]が彼らの母国を支配している。\nこの破滅的な損失にもかかわらず、[FROM.FROM.GetName]との戦争は決して終わっていない。"
 country_capitulated.0.d_negative_prev_no_faction: "\n[Root.GetLeader]は、[Root.GetAdjective]はもはや占領している[FROM.FROM.GetAdjective]軍からの圧力に耐えられず、国全体が形骸化していると発表した。[Root.GetAdjective]政府は亡命した。彼らの主力は降伏し、現在は[FROM.FROM.GetName]が彼らの母国を支配している。\n[FROM.FROM.GetName]との戦争が続いているにもかかわらず、これは全[Root.GetFactionName]に対する不幸な痛手だ。"
 country_capitulated.0.d_negative_prev_faction: "\n[Root.GetLeader]は、[Root.GetAdjective]はもはや占領している[FROM.FROM.GetAdjective]軍からの圧力に耐えられず、国全体が形骸化していると発表した。[Root.GetAdjective]政府は亡命した。彼らの主力は降伏し、現在は[FROM.FROM.GetName]が彼らの母国を支配している。\n[FROM.FROM.GetName]と[FROM.FROM.GetFactionName]以外との戦争が続いているにもかかわらず、これは全[Root.GetFactionName]に対する不幸な痛手だ。"
 country_capitulated.0.d_neutral_both_no_faction: "\n[Root.GetAdjective]政府は亡命を余儀無くされ、その主力部隊は現在彼らの故郷を掌握している[FROM.FROM.GetName]に降伏した。\n\n[FROM.FROM.GetName]と[Root.GetName]との抗争は終わったが、[FROM.FROM.GetName]は未だ全面戦争をしており、戦闘は他の場所で続いている。"
 country_capitulated.0.d_neutral_prev_no_faction: "\nThe [Root.GetAdjective] government has gone into exile and their main forces have capitulated to [FROM.FROM.GetName], who is now in control of their home area.\n\nThe struggles in [Root.GetName] were only a small part of the conflict. The war between [FROM.FROM.GetName] and what remains of [Root.GetFactionName] continues elsewhere."
 country_capitulated.0.d_neutral_prev_faction: "\nThe [Root.GetAdjective] government has gone into exile and their main forces have capitulated to [FROM.FROM.GetName], who is now in control of their home area.\n\nThe struggles between [FROM.FROM.GetName] and [Root.GetName] were only a small part of the conflict. The war between [FROM.FROM.GetFactionName] and what remains of [Root.GetFactionName] continues elsewhere."
 country_capitulated.0.a: "素晴らしい知らせだ！"
 country_capitulated.0.b: "暗い時代が訪れた"
 country_capitulated.0.c: "見通しのつかない時代だ"
 GAME_OVER_TT: "§Rゲームプレイが終了する。§!"
 CAN_ANGERED_WORKERS: "これは人々を動揺させるだろう"
 excellent: "素晴らしい"
 unfortunate: "残念だ"
 news.2.t: "[mct_inviter.GetNameDef]・[mct_applicant.GetName]軍事協力条約"
 news.2.d: "Today [mct_inviter.GetNameDef] and [mct_applicant.GetNameDef] have signed a military cooperation treaty, strengthening their military ties."
 news.2.a: "了解"
 influence.1.t: "[FROM.GetName]への経済援助？"
 influence.1.d: "経済援助計画の策定を開始する。援助額は我が国のGDPの5％、10％、15％から選択できる。この措置により[FROM.GetName]との関係は改善され、影響力を獲得できるが、援助が有効活用される保証はない。供与額が多いほど、より大きな影響力を得られる。\n\n"
 influence.1.a: "国内総生産の5％を経済援助として送る。"
 influence.1.b: "国内総生産の10％を経済援助として送る。"
 News_influence.0.t: "[FROM.GetName]からの経済援助！"
 News_influence.0.d: "[FROM.GetName]から$$[?gift_sum]bの経済援助を受領した！これにより[Root.GetAdjective]・[FROM.GetAdjective]間関係が強化され、この援助の見返りとして、彼らは我が国における影響力を得ることとなった。"
 News_influence.0.a: "素晴らしい"
 influence.3.t: "[FROM.GetName]内のどこの影響力を標的にするか"
 influence.3.d: "[FROM.GetNameWithFlag]内のどこの影響力を攻撃すべきだろうか、あるいは彼ら国内独立度を狙うべきか?\n"
 influence.3.a: "ターゲット：[FROM.GetNameWithFlag]"
 influence.3.b: "ターゲット：[?var:FROM.influence_array^0.GetNameWithFlag]"
 influence.3.c: "ターゲット：[?var:FROM.influence_array^1.GetNameWithFlag]"
 influence.3.e: "ターゲット：[?var:FROM.influence_array^2.GetNameWithFlag]"
 influence.3.f: "引き下がろう"
 News_influence.1.t: "[FROM.GetNameWithFlag]が[FROM.FROM.GetNameWithFlag]における我々の影響力を攻撃した！"
 News_influence.1.d: "遺憾ながら、[FROM.GetLeader]が指導する[FROM.GetName]によって、[FROM.FROM.GetName]における我々の野望に手痛い一撃が加えられた。我々を締め出し、経済および政治上の権益を損ねようとする彼らの攻撃によって、[FROM.FROM.GetNameWithFlag]における我々の影響力は低下した。"
 News_influence.1.a: "野郎、[FROM.GetLeader]め！"
 News_influence.2.t: "[FROM.GetNameWithFlag]は我々の外国の影響からの独立を妨害している！"
 News_influence.2.d: "残念ながら、[FROM.GetLeader]の[FROM.GetName]による迅速な一撃が、外国の干渉を排除しようとする我々の願望に打撃を与え、我が国の主権を弱めた。外国の影響からの独立は減少した。"
 News_influence.2.a: "よくないな、[FROM.GetLeader]！"
 influence.5.t: "[FROM.GetNameWithFlag]でのクーデターを実行する？"
 influence.5.d: "親愛なる[Root.GetLeader]閣下、我々[Root.GetAdjective]諜報機関は、[FROM.GetName]がクーデターに適しているかどうか、肯定も否定もできません。\n\nしかし、我々はできる限りの能力で、結果の確率を算出しました。これらは以下の要素に基づいています:\n- 我々の影響力の大きさ\n- 我々の世界観の支持率\n- 政府の人気と安定性\n- 他のどの有力国が我々を支持する可能性が高いか\n- 影響力のあるどの国が現在の政府を支持する可能性が高いか。\n\n計画を進める場合、我々は主に地元の情報源や人脈を利用して、もっともらしい否認を維持するよう努めます。"
 influence.5.a: "クーデターを起こし、我々の世界観に従う政党を政権に就かせる。"
 influence_coup_largest_success_TT: "§Hクーデター成功§!"
 influence_coup_largest_discovered_TT: "§Rクーデター失敗§!"
 influence.5.b: "クーデターを起こし、我々の世界観に従う政党を政権に就かせる。"
 influence.5.c: "実行中の計画を中止する……今のところは。"
 News_influence.3.t: "政権交代！"
 News_influence.3.d: "Forces with [FROM.GetAdjective] backing have deposed the previous government."
 News_influence.3.a: "なんと……"
 News_influence.4.t: "政権交代が[FROM.FROM.GetNameWithFlag]を席巻する劇的な場面"
 News_influence.4.d: "[FROM.GetNameWithFlag]からの諜報活動が活発化した時期を経て、[FROM.FROM.GetName]の前政権は打倒され、前政権の多くの政府高官が拘束された。[FROM.FROM.GetRulingParty]の[FROM.FROM.GetLeader]が混乱の中で新しいリーダーとして台頭した。予想される初期の兆候としては、[FROM.FROM.GetName]による新体制が[FROM.FROM.GetRulingIdeology]と同一化し、権力の均衡が崩れることが挙げられる。"
 News_influence.4.a: "興味深い"
 News_influence.5.t: "[FROM.FROM.GetNameWithFlag]がクーデターを鎮圧し、[FROM.GetNameWithFlag]が圧力を受ける。"
 News_influence.5.d: "[FROM.FROM.GetAdjective] leader [FROM.FROM.GetLeader] was gesturing vividly from the stage as 'hostile evil forces spearheaded by [FROM.GetName]' were being blamed for today's latest escalations that saw [FROM.FROM.GetLeader] defeating a dramatic coup attempt. Though [FROM.GetAdjective] leader [FROM.GetLeader] strongly denied the accusations, it is widely known that the two leaders don't see eye to eye. With [FROM.GetAdjective]-[FROM.FROM.GetAdjective] ties at an all-time low, [FROM.FROM.GetName] vowed to the public to \"eradicate [FROM.GetAdjective] influence from [FROM.FROM.GetName]\", and otherwise double down on the [FROM.FROM.GetRulingIdeology] direction that the ruling [FROM.FROM.GetRulingParty] have been steering [FROM.FROM.GetNameWithFlag] towards."
 News_influence.5.a: "興味深い"
 News_influence.6.t: "[FROM.FROM.GetNameWithFlag]が内戦に陥るドラマ！"
 News_influence.6.d: "[FROM.FROM.GetNameWithFlag]の悲惨な光景が今日も見られる。ここ数日の抗議活動、不確実性、そして奇妙な軍の動きが銃撃戦に変わり、民間人が苦しみ、逃げ惑う。詳細は不明だが、[FROM.FROM.GetAdjective]軍の複数の部隊が[FROM.FROM.GetLeader]と[FROM.FROM.GetRulingParty]（[FROM.FROM.GetRulingIdeology]）に対する武装反対を宣言したようだ。匿名を条件にWNNに語ったある反対派指導者は、「[FROM.GetNameWithFlag]から、非合法な[FROM.FROM.GetAdjective]暴君[FROM.FROM.GetLeader]を打倒する取り組みに大きな助けを期待している」と述べた。\n\n[FROM.GetAdjective]の指導者たちは「こうした劇的な展開に驚き」を表明しているが、[FROM.GetAdjective]と[FROM.FROM.GetAdjective]の関係を注意深く観察する人々の間では、この発言の信憑性は低い。あるアナリストは状況を次のように描写している。「これは実際には[FROM.GetAdjective]が支援するクーデターの試みであり、目的を迅速に達成できず、緊張した対立状態が続き、今では完全な内戦のように見える状態にまで悪化したことは明らかだ」。特に[FROM.FROM.GetRulingIdeology]を持つ指導者らは、現時点では未確認の[FROM.GetAdjective]の関与について、外交的とは言えない発言をしている。\n\n紛争の2つの異なる側は、国内だけでなく国際的な方向性でも著しい違いを呈しており、他の国々も紛争に関与するかどうかは興味深いところだ。"
 News_influence.6.a: "焼け野原を支配するのは誰だろうか？"
 influence.51.t: "[FROM.GetName]に軍事援助を行う"
 influence.51.d: "同盟国である[FROM.GetName]は現在武力紛争中で、戦争遂行に必要な物資の供給元を探しています。彼らは我が国の小火器、歩兵車両、その他の軍需余剰品に関心を示しています。将来の紛争で彼らがそれらを我が国に対して使用する可能性もあるため、軍事装備を送る価値があるかどうかを判断すべきです。"
 influence.51.a: "そうだ、やろう！"
 influence.51.b: "よくよく考えてみると……"
 influence.52.t: "どの支援を送るかの問題"
 influence.52.d: "We can send [FROM.FROM.GetName] one of three categories of military aid. After picking the category, we will choose a §Hpackage size§! that determines the quantity, political cost, and threat generated.\n\n§HInfantry§!: small arms, light anti-tank, anti-aircraft.\n§HVehicles & Armor§!: main battle tanks, amphibious tanks, utility vehicles.\n§HModern Equipment§!: heavy anti-tank missiles, surface-to-air missiles, drones."
 influence.52.a: "§H歩兵装備§!パッケージを送る"
 influence.52.b: "§HVehicles & Armor§! Package"
 influence.52.c: "実は我々も必要なのだ"
 influence.53.t: "[FROM.GetName]からの軍事援助"
 influence.53.d: "[FROM.GetName] has offered us a package of military equipment. Should we accept or return it?"
 influence.53.a: "パッケージを受け取る"
 influence.53.c: "装備を返却する"
 econvent.1.t: "[Root.GetName]の中央銀行が住宅バブルの可能性を警告"
 econvent.1.d: "親愛なる[Root.GetLeader]閣下、誠に遺憾ながら、当社の専門家チーム（最も優秀で聡明な[Root.GetAdjective]経済学者たち）の大半が、[Root.GetAdjective]住宅市場が過熱し、破裂寸前のバブルに向かっている可能性を示す初期兆候を捉えています。将来を予測することは困難かつ骨の折れる作業であるため、専門家たちの見解が誤っている可能性も念頭に置いてください。\nもちろん、閣下に対して何をすべきか指示するなど夢にも思いませんが、今ある程度の調整を行うことは、将来全面的な危機が訪れるよりも痛みを伴わないでしょう。"
 econvent.1.a: "最悪の事態になる前に、市場を抑えよう。"
 econvent.1.b: "くだらん。[Root.GetAdjective]経済は常に安泰だ！"
 econvent.1.b_tt: "今のところ§H影響はない§!が、将来的に住宅バブルが発生するかもしれない\n"
 econvent.2.t: "住宅価格の暴落"
 econvent.2.d: "As the prices of houses and apartments have gone through the roof, especially in the last year, people have taken out larger and larger loans to afford housing, while speculators have invested heavily in property, also using loaned money. Right now, this is coming to an end, fast. The prices are dropping, and people are trying to sell like there is no tomorrow. Many of the less fortunate will be stuck with huge loans they can't repay. As people are cursing both [Root.GetLeader] and the [Root.GetAdjective] Central Bank for causing this, we must make a public statement on how we intend to handle this crisis fast."
 econvent.2.a: "市場を立ち直らせるために、名低金利資金を市場に流し込む。"
 econvent.2.b: "これは辛いことだが、住宅価格は下げざるを得なかった。"
 econvent.3.t: "株式市場の暴落"
 econvent.3.d: "住宅バブル崩壊の混乱が株式市場にも波及したようだ。今朝、上場されている[Root.GetAdjective]企業のほぼすべての株価が大幅に下落し、我が国の通貨も大きく値を下げた。午前中には一時的に取引が停止されたが、明日市場が再開された際にも改善は見込めず、誰もが株を売ろうと必死になっている。"
 econvent.3.a: "Good thing my money was placed in offshore tax havens."
 econvent.4.t: "[Root.GetAdjective]の銀行が危機に直面"
 econvent.4.d: "[Root.GetName]§RLOVE§![Root.GetLeader]カップにホットで美味しいラテアート付きエスプレッソが注がれたにもかかわらず、今日は良い日ではない。財界の大物たちとそのロビイスト、そして寄付を受けた政治家たちが[Root.GetAdjective]の政府機関に群がり、皆同じメッセージを伝えている。「救済措置が必要だ！」\n\nどうやら、住宅市場の低迷と株式市場の暴落という二重のショックは、金融セクターにはあまりに大きな打撃だったようで、投機による不良債務が積み重なりすぎており、新たな政府資金の流入が必要だ。それがなければ、広範囲にわたる破産が発生し、多くの無実の預金者が預金を失うことになる。"
 econvent.4.a: "我々は救済措置を提供する。"
 econvent.4.b: "救済措置はないが、貯蓄預金は保証する。"
 econvent.4.c: "適者生存が資本主義を偉大なものにする。"
 econvent.5.t: "[Root.GetAdjective]の消費者の支出が減少"
 econvent.5.d: "最近の報告書によると、勤勉な[Root.GetAdjective]の人が将来についてますます心配していることが浮き彫りになった。この悲観論が人々の貯蓄を増やし、全体的な消費を減少させている。このままでは、[Root.GetName]の多くの企業が縮小や閉鎖を余儀なくされるだろう。しかし、[Root.GetAdjective]の製品を主に輸出している企業は、この影響を受けない。"
 econvent.5.a: "買い物代金の一部を補助する"
 econvent.5.b: "うまくいけばこのまま終わるだろう"
 econvent.6.t: "海外での[Root.GetAdjective]製品の商品需要が低下"
 econvent.6.d: "The data is clear; the international exports of [Root.GetName] are going down. The cause, however, is being hotly debated amongst [Root.GetLeader]'s economic advisers. One theory is that we have become less competitive due to our relatively high wages, another is that our competitors have increased the quality of their products. Others feel that the decrease in demand is just due to shifting trends abroad. Whatever the cause, there is not really much we can do about this except putting it behind us and working harder in the future."
 econvent.6.a: "馬鹿な外国人め。[Root.GetAdjective]製品が最高なのだ！"
 econvent.7.t: "干ばつが[Root.GetAdjective]の農家に大惨事をもたらす"
 econvent.7.d: "普段はあまり雨が降らないのに、今期の降雨量はひどいもので、ほとんどの作物が不作に終わっている。わずかに生産された農産物はすべて、河川の残存と人工的な灌漑によるもので、悲しいことにここ[Root.GetName]ではあまり一般的ではない。農民は[Root.GetLeader]政府に援助を要求しており、都市住民は食料価格の高騰を心配している。"
 econvent.7.a: "来シーズンこそは。"
 econvent.8.t: "[Root.GetName]での飢饉！"
 econvent.8.d: "The ongoing drought has caused large parts of the countryside of [Root.GetName] to lack affordable food. Food stocks have been depleted, and a true famine is causing malnutrition, death and disease."
 econvent.8.a: "あいたたた……"
 econvent.9.t: "消費者信頼感の上昇"
 econvent.9.d: "The recent conditions within the [ROOT.GetAdjective] economy have shown that the consumers within our country now have the perfect market conditions to spend money and make investments in the future of the country. People are buying consumer goods like there is no tomorrow!"
 econvent.9.a: "素晴らしい知らせだ！"
 econvent.10.t: "株式市場の急騰"
 econvent.10.d: "[ROOT.GetAdjective]の株式市場は好況である。[ROOT.GetAdjective]の人々はまるで食料品の買い物をするかのように株を売買している。\n"
 econvent.10.a: "流れを続けろ！"
 econvent.10.a_tt: "市場にさらなる流動性を注入すると、暴落が発生した場合に壊滅的な結果を招く可能性がある。\n"
 econvent.10.b: "素晴らしい"
 econvent.10.b_tt: "市場は介入なしで通常通りの業務を継続するだろう。暴落の可能性はまだある程度存在する。\n"
 econvent.10.c: "経済の減速"
 econvent.10.c_tt: "The economy has heated up too quickly. Let's start slowing the pace by tightening up the flow of capital.\n"
 sco.1.t: "[FROM.GetName]が上海協力機構オブザーバー資格を申請"
 sco.1.d: "新たな国家が上海協力機構の議事進行を観察し、最終的には同組織の正式メンバーになることを望んでいる！"
 sco.1.a: "彼らの要求を認めぬ理由は見当たらない。"
 sco.1.b: "彼らにこの地位を与えることはできない！"
 sco.2.t: "[FROM.GetName]が上海協力機構メンバーシップの地位を申請"
 sco.2.d: "新たな国家が組織の正式メンバーになることを希望！"
 sco.2.a: "彼らの要求を認めぬ理由は見当たらない。"
 sco.2.b: "彼らにこの地位を与えることはできない！"
 sco.3.t: "[FROM.GetName]が、我が国との合同軍事演習を提案"
 sco.3.d: "SCOの加盟国であるこの国は、両国の軍事協力を強化し、信頼を高めるために合同演習を提案している。"
 sco.3.a: "これは軍にとって経験を積むためのありがたい機会だ！"
 sco.3.b: "Cooperation with [FROM.GetName] is impossible."
 sco.4.t: "[FROM.GetName]が提案を受諾！"
 sco.4.d: "The [FROM.GetAdjective] delegates have warmly received our proposal and are making preparations for our joint exercises."
 sco.4.a: "さあ試合を始めよう！"
 sco.5.t: "[FROM.GetName]が我々の提案を拒否！"
 sco.5.d: "[FROM.GetAdjective]の代表団は、我々との非常に実りある軍事演習の実施を拒否した。"
 sco.5.a: "奴らは見る目がなかったな……"
 sco.6.t: "SCOが大規模な軍事演習を開始"
 sco.6.d: "本日、[FROM.GetAdjective]軍は上海協力機構（SCO）が実施した、テロ対策演習と称されるものに数千人の兵士と共に参加した。多くの人がこの演習を、国際協力の成功例として歓迎している一方で、この最新の動きに対してあまり積極的でない反応もある。アメリカやヨーロッパのアナリストは、長距離航空機や相当な火力が投入されていることから、この演習がテロ対策の練習ではなく、西側諸国との対決のための十分な武装した予行演習であることを示唆していると指摘した。"
 sco.6.a: "これらの威嚇的な演習は我々の利益になるのか？"
 sco.6.b: "これを恐れるのはテロリストだけだ！"
 sco.6.c: "興味深い進展だ"
 sco.7.t: "[FROM.GetName]が上海協力機構に加盟"
 sco.7.d: "[FROM.GetLeader]は今日、段階的な調整プロセスを経て、上海協力機構への加盟を発表した。肯定的なオブザーバーにとってはこれをユーラシア大陸の地域経済的あるいは政治的協力の進歩であると楽観視しているが、悲観的なアナリストからは増大する中国の影響が既存の世界秩序にもたらしかねない脅威であるとして嘆かれている。"
 sco.7.a: "中国の脅威は依然として強まりつつある……"
 sco.7.b: "外交日和とはこのことだ！"
 sco.8.t: "[FROM.GetName]が上海協力機構を離脱"
 sco.8.d: "現在の[FROM.GetAdjective]政府が中国の行動を再評価した後、[FROM.GetLeader]は[FROM.GetNameDef]を上海協力機構から脱退させた。[CHI.GetLeader]はこの件についてまだコメントしていないが、中国政府系メディアは、今回の脱退が地域統合の後退を意味するとすぐに嘆いている。"
 sco.8.a: "中国の侵略により、この国は好意を失った。"
 sco.8.b: "国際協力にとって残念な日だ……"
 sco.9.t: "中国、ロシアからSCOの主導権を奪う"
 sco.9.d: "上海協力機構は、歴史的には中露共同で運営されてきた。しかし、中国はこれに不満を持ち、ロシアは組織内でより下位の立場に追いやられていると報じられている。[CHI.GetLeader]と[SOV.GetLeader]は、この権力闘争について沈黙を守っているが、ロシア当局は中国に激怒し、SCO加盟国の面前で行われた、このスラヴの巨人に対する侮辱に苦言を呈していると伝えられている。この事態がもたらす、中央アジアの覇権における地政学的な影響は、大きなものになりそうである。"
 sco.9.a: "中国はスポットライトを共有するつもりはない……"
 sco.10.t: "中国は我々にどちらかの側を選ぶよう要求している"
 sco.10.d: "ロシアと中国の分裂後、中国が引き続きCSTOと上海協力機構に加盟していることは、困難な立場に立たされている。中国は現在、中国に対し、SCOを脱退してロシアとの同盟にとどまるか、SCOにとどまってロシアを見捨てるかのいずれかを要求している。我々が下す選択は、間もなく起こるであろう2つの地域大国の対立において、ほぼ間違いなく重要な意味を持つだろう。"
 sco.10.a: "忠誠心なしには我々は何者にもなれない！"
 sco.10.b: "この沈みゆく船から脱出する時が来た……"
 sco.11.t: "[FROM.GetName]が開発支援を提供！"
 sco.11.d: "上海協力機構の支援の下、[FROM.GetAdjective]政府は、開発プロジェクトを促進するために、地元企業に必要な資金と資源を提供している。この支援は経済にとって良いニュースだが、[FROM.GetNameDef]が我が国に及ぼす影響力の度合いを増大させることになるだろう。"
 sco.11.a: "ご協力に心より感謝申し上げる。"
 taiwan.1.t: "228 手を繋いで台湾を守る"
 taiwan.1.d: "団結のデモ。約200万人が500kmの人間の鎖を作った。台湾最北端の都市、基隆の港から始まり、この鎖は台湾最南端まで続いた。このデモの目的は2つあった。台湾人は平和を願っていたが、同時に中華人民共和国が台湾の隣国を狙ってミサイルを配備していることにも抗議していた。デモの象徴性の一部、特に参加者が「中国に背を向ける」という時点で、明らかに台湾独立支持に傾いていたため、泛藍連合のメンバーは参加しなかった。彼らは数日後、台湾全土で独自の集会を開いてデモに対抗した。"
 taiwan.1.a: "犠牲者を決して忘れないようにしよう。"
 taiwan.2.t: "台風ビリス"
 taiwan.2.d: "ビリスに備えて、台湾全土のオフィスが閉鎖された。事業所の閉鎖に加え、台湾への航空便と台湾からの航空便のスケジュールが変更され、台風救援センターが設立された。土砂崩れの恐れがあるため、台湾に土砂崩れ警報が発令された。台風はまだ上陸していなかったが、迫りくる台風によって引き起こされた土砂崩れに埋もれて8月22日に台北で1人が死亡した。これがビリスによる最初の死者となった。航空便のスケジュール変更に加え、多くの空港が閉鎖され、台湾証券取引所は8月23日に閉店する予定だった。一方、病院は患者の入院に備えて診療時間を延長した。台湾の沿岸警備隊員は、致命的な波の脅威から漁業活動を規制した。高雄港は嵐の間ずっと閉鎖されていた。嵐に先立って野菜の需要が高まったため、野菜の価格は20～30パーセント上昇した。\n\nビリスは台湾にとって非常に破壊的な熱帯低気圧であった。島の農業、漁業、林業への被害は1億3,350万米ドルに上った。この台風により14人が死亡、80人が負傷した。停電は約60万世帯に悪影響を及ぼし、台湾全土で400軒の家屋が損壊した。嵐の後、数十万世帯が水不足に見舞われた。成功では、気象観測所が時速281キロメートルの突風を記録し、観測所の風速計が壊れた。済愛鎮では一件の土砂崩れで農民9人が埋もれた。嵐の間に数万人が避難し、政府が設置した避難所に移った。花蓮県東部では、強風で250軒の家屋が倒壊した。また、強風により木が倒れ、軽車両が吹き飛ばされ、道路がふさがれた。ビリスに伴う大雨により、果樹園や水田約4万ヘクタールが浸水した。ビリスが台湾を通過した後、マグニチュード5.7の地震が台湾を襲い、すでに悪化していた状況がさらに悪化した。"
 taiwan.2.a: "再建の時だ"
 taiwan.3.t: "台湾総統選挙"
 taiwan.3.d: "It's the second ever direct presidential election of the Republic of China, to elect the 10th-term President and Vice-President of the Republic of China under the 1947 Constitution. This has the potential to put an end to more than half a century of Kuomintang rule on Taiwan, since the KMT voters split in half.\n\nThough more popular and consistently ranked higher in the polls, the outspoken former Taiwan Governor James Soong failed to gain the Kuomintang's nomination. As a result, he announced his candidacy as an independent candidate. The Kuomintang responded by expelling Soong and 21 of his allies. They sued Soong for theft, alleging that as party Secretary-General, he stole millions of Taiwan dollars in cash intended for the family of the late President Chiang Ching-kuo and hid the money in the Chunghsing Bills Finance Co. Soong defended himself by saying he was acting under Lee's direction, but his story was largely unpersuasive. Initially holding a commanding lead in the polls, Soong lost by just over 300,000 votes, and the financial scandal that tarnished his image as a clean politician will likely lead to his failure.\n\nThe Democratic Progressive Party runs former Taipei Mayor Chen Shui-bian for president. Having run for the 1996 election on a radical independence platform and lost by a landslide, the DPP in May 1999 moderated its stance by issuing the \"Resolution on the Future of Taiwan.\" The resolution accepted the status quo and promoted the moderate view that Taiwan was already independent, so any formal declaration would not be urgently necessary, if at all. Also included was the pledge that any change in Taiwan's international status will have to be done through a referendum, thus alleviating the fear that, if elected, a DPP government would unilaterally declare independence without popular approval. The Chen-Lu ticket also promises to be more aggressive in fighting black gold, to provide more funding for social services, and to be more environmentally friendly, such as opposition to nuclear power."
 taiwan.3.a: "陳水扁（DPP）"
 taiwan.3.b: "連戦（KMT）"
 taiwan.3.c: "宋楚瑜（無所属）"
 taiwan.4.t: "海巡署の設立"
 taiwan.4.d: "CGAは、沿岸警備隊司令部、海洋警察局、および財政省台湾税関総局の複数の巡視船を統合したものである。CGAは、沿岸および海上法執行機関を正式に統合したものである。この組織は設立間もない機関としては大きな活躍を見せ、近い将来、数多くの捜索救助活動や密輸対策活動に参加することになる。\n\n海巡署（CGA）の沿岸警備局は、台湾、澎湖、金門、馬祖諸島、緑島、蘭嶼、東沙諸島、南沙諸島を囲む中華民国領海の法と秩序の維持、資源の保護、および沿岸地域における密輸業者や不法移民に対する第一線の防衛を担っている。CGAは行政院海洋委員会の管理下にある民間法執行機関とみなされているが、緊急時には中華民国軍の一部として組み込まれることもある。\n\n海巡署は、1人の部長と3人の副部長によって率いられ、8つの部、1つの事務所、5つのタスクフォース、海上巡視総局、沿岸巡視総局から構成されている。管轄範囲は金門島、馬祖島、澎湖島、台湾本島周辺の海域で、台湾島の15倍の広さを誇る1,819.8キロメートルの海岸線と54万平方キロメートルの「青い領域」を適切に保護している。"
 taiwan.4.a: "安全な海岸のために。"
 taiwan.5.t: "国立高雄大学が開校"
 taiwan.5.d: "The University aims to narrow the gap in education between southern and northern Taiwan and promote the economy of the southern area.\n\nThere are twenty departments in the university, including Western Languages and Literature, East Asian Language and Literature, Architecture, Creative Design, Kinesiology, Health and Leisure Studies, Law, Government and Law, Economic and Financial Law, Applied Economics, Applied Mathematics, Applied Chemistry, Electrical Engineering, Civil and Environmental Engineering, Life Sciences, and Asia-Pacific Industrial and Business Management, Traditional Arts, Finance, Information Management, and Applied physics. Among these departments, Asia-Pacific Industrial and Business Management is especially designed for cultivating industrial elites.\n\nAn unusual feature in this school is its open space. There are no walls on the boundaries of the campus. Residents who live around this school can walk to campus or exercise by using equipment in the gym. Biodiversity is also a notable characteristic of NUK. There are more than 60 sorts of fish in the pond of the Water Land Park."
 taiwan.5.a: "これは南部を助けるだろう。"
 taiwan.13.t: "桃園空港客室乗務員組合のストライキ"
 taiwan.13.d: "The Taoyuan Flight Attendants Union, representing some 2500 cabin crew from China Airlines, stage their first strike in Taiwanese aviation history. A total of 122 China Airlines-passenger flights from Taoyuan International Airport and Taipei Songshan Airport are now cancelled as a result and left 20,000 passengers stranded. The Union presented us with seven demands to accept for better working conditions."
 taiwan.13.a: "彼らの要求を受け入れよう。"
 taiwan.14.t: "ストライキ失敗"
 taiwan.14.d: "After we denied their demands the strike soon ended. Everyone is going back to work now."
 taiwan.14.a: "彼らにはチャンスがなかった"
 taiwan.15.d: "After we denied their demands the strike just got more intense. It doesn't seem the strike will end soon."
 taiwan.15.a: "少なくとも私たちは努力した"
 taiwan.16.t: "戦車が橋から落ちた"
 taiwan.16.d: "陸軍のCM-11戦車が昨日の朝、訓練から基地へ戻る途中、屏東県の小川に転落し、乗っていた兵士5人のうち3人が死亡した。運転手は軽傷を負っただけで、自力で戦車から脱出した。砲塔内にいた他の4人は、戦車がひっくり返っていたため、砲塔のハッチから脱出できなかった。"
 taiwan.16.a: "なぜこのようなことが起こったのか調査する"
 hongkong.1.t: "中国は併合の撤回を拒否した！"
 hongkong.1.d: "中国は我々の脅しを無視したため、我々は脅しを実行する以外に選択肢がなくなった。"
 hongkong.1.a: "彼らはもはや我々を恐れていないようだ。"
 hongkong.2.t: "中国が香港に軍隊を派遣"
 hongkong.2.d: "香港特別行政区での抗議活動を受けて、中国は人民解放軍の複数の部隊に香港の路上に出て「法と秩序を回復」するよう命じた。[CHI.GetLeader]は「平和的なデモ参加者」に対し、彼らは標的にされず、逮捕された者全員が国際人権法に従って扱われると保証した。しかし、香港内外の多くの人々は、中国軍がデモ参加者に対してどの程度の抑制力を発揮するかについて懐疑的な見方を示している。"
 hongkong.2.a: "卑劣な行動だ！"
 hongkong.2.b: "中国は必要なことをした。"
 hongkong.2.c: "我々の知ったことではない"
 hongkong.5.t: "イギリスは軍事行動を脅かしている！"
 hongkong.5.d: "英国は、我々が旧植民地領土を併合したことに対して、予想以上に好戦的に反応した。我々は彼らの要求に応じるかどうか検討すべきである。"
 hongkong.5.a: "これは我々が命を懸けるべき戦いではない。"
 hongkong.5.b: "かかってこい。"
 hongkong.6.t: "イギリスは我々に対して経済対策を脅迫している！"
 hongkong.6.d: "英国は、旧植民地領土の併合を撤回しなければ、我々に制裁を科すと脅すことを決めた。我々は彼らの要求に耳を傾けるかどうか検討すべきである。"
 hongkong.6.a: "対立を避けるべきだ。"
 hongkong.6.b: "彼らの脅しは意味がない！"
 hongkong.7.t: "中国は併合を撤回することに同意した"
 hongkong.7.d: "中国は明らかにイギリスの権力に畏怖の念を抱き、香港問題で譲歩した。"
 hongkong.7.a: "我々の脅しはまだ効いている！"
 korea.4.t: "中国と北朝鮮の分裂"
 korea.4.d: "中国政府系メディアにおける[NKO.GetLeader]政権への批判は、ここ数週間で劇的に増加している。これらの批判は、北朝鮮の継続的な核問題と、ここ数十年中国が行ってきたような経済自由化による国民生活の改善を北朝鮮政府が怠っていることを攻撃している。\n\n[CHI.GetLeader]はこの問題について沈黙を守っているが、これらのメディア組織は[CHI.GetLeader]の暗黙の承認がなければ、かつての緊密な同盟国に対するこのような痛烈な批判を展開することはなかっただろうと広く考えられている。多くの観察者は、これを中国の金王朝に対する不満の頂点と見ており、おそらくより安定し中国の希望に沿った代替政府の樹立を望むことの表れである可能性がある。"
 korea.4.a: "Only [CHI.GetLeader] knows where this is going..."
 korea.5.t: "会談が始まる"
 korea.5.d: "北朝鮮の第一の要求は、米国との合同軍事演習の中止である。北朝鮮は合同軍事演習を自国領土侵攻の準備とみなしている。しかし、我が国の軍部は、合同軍事演習を北朝鮮の攻撃に備えた必要な準備と広くみなしている。従って、合同軍事演習の中止に同意することは、我が国の安全を危険にさらす大きな賭けとなる。"
 korea.5.d_NKO: "南側の主な要求は、我々が核兵器実験を中止することである。南側は、核兵器実験を我々の侵略的意図の証拠とみなしている。しかし、我々の核兵器計画は、軍にとって米国の侵略に対する重要な抑止力とみなされている。さらに、計画と、その継続に必要な実験は、我々の政府の正当性を強化するのに役立つ。したがって、これらの実験の中止に同意することは、我が国と政府の安全が危険にさらされる重大な賭けとなる。"
 korea.5.a: "私たちがいくつかのリスクを冒さない限り、私たちの国は二度と元通りになることはないだろう……"
 korea.5.b: "いくつかのリスクは取るには大きすぎる。"
 korea.6.t: "朝鮮半島の和平交渉が開始"
 korea.6.d: "北朝鮮と韓国は半世紀以上にわたって、厳密には戦争状態にある。この凍結された紛争は、時折、海上の境界線や非武装地帯を挟んだ両者の衝突によって熱を帯びてきた。今、双方はこの状態に終止符を打ち、正式な平和条約を通じて朝鮮半島における緊張の段階的縮小を達成することを希望している。平和条約の交渉は、朝鮮半島の統一に向けた重要な第一歩であると広く認識されている。"
 korea.6.a: "両者は歩み寄れるのか？"
 korea.7.t: "[CHI.GetLeader] 朝鮮半島統一への支持の声"
 korea.7.d: "中国は歴史的に、米国と連携して朝鮮半島が統一される可能性を警戒してきた。そのため、観測者たちは[CHI.GetLeader]が統一をはっきりと支持すると聞いて驚いた。一部の見方では、この動きは北朝鮮指導部を不意打ちした。朝鮮半島における中国の大きな影響力を考えると、この発表は両国に交渉のテーブルに着くよう圧力をかけるものとなるだろう。"
 korea.7.a: "変化の兆しが見えているのか？"
 recognition.1.t: "[FROM.GetName] Recognizes the Breakaway"
 recognition.1.d: "[FROM.GetNameDef] has extended formal diplomatic recognition to the breakaway state on our territory. The decision is a setback for our claim to the region."
 recognition.1.a: "我々は分裂しない。"
 recognition.3.t: "[FROM.GetName] Withdraws Recognition"
 recognition.3.d: "[FROM.GetNameDef] has reversed its earlier recognition of our sovereignty. Whatever the reason, the result is the same."
 recognition.3.a: "闘いは続く"
 recognition.4.t: "[FROM.GetName] Withdraws Recognition of the Breakaway"
 recognition.4.d: "[FROM.GetNameDef] has reversed its earlier recognition of the breakaway state on our territory. One fewer capital backs their claim to sovereignty."
 recognition.4.a: "A small victory for our position."
 recognition.7.t: "[FROM.GetName]が国際連合に加盟"
 recognition.7.d: "After a sustained campaign for international recognition, [FROM.GetNameDef] has been admitted to the United Nations General Assembly as a member state."
 recognition.7.a: "Welcome to the General Assembly."
 recognition.8.t: "[FROM.GetName] Pressures Us to Recognize [pressured_to_recognize]"
 recognition.8.d: "[FROM.GetNameDef] is leveraging its influence over us to force recognition of [pressured_to_recognize]. Refusing a partner with this much leverage carries a real cost."
 recognition.8.a: "We extend recognition."
 recognition.8.b: "We refuse to recognize this regime."
 internal_faction.1.t: "軍が予算の増額を要請"
 internal_faction.1.d: "新たな国家安全保障の脅威を理由に、軍は[ROOT.GetAdjective]の国防予算の増額を要請している。この要請を承認すれば予算への圧迫が増すが、拒否すれば軍部の政府に対する評価が下がることになる。"
 internal_faction.1.a: "金を与えなければならない"
 internal_faction.1.b: "そんな出費をする余裕はない！"
 internal_faction.2.t: "一部の共産党幹部が汚職活動に関与！"
 internal_faction.2.d: "我が国の情報機関は最近、一部の共産党幹部が賄賂を受け取り、縁故主義に関与していることを発見した。国民からの信頼を保つためにも、このような行為を見過ごすわけにはいかないが、対処すれば共産党内の多くの重要な同盟者を遠ざけることになるだろう。"
 internal_faction.2.a: "見て見ぬふりをするべきだ"
 internal_faction.2.b: "彼らを見せしめにしなければならない！"
 internal_faction.3.t: "コングロマリットが減税を要求"
 internal_faction.3.d: "[ROOT.GetName]の主要コングロマリットのトップたちが、政府に対してさらなる減税を求めるロビー活動を行っている。減税を認めれば、これらコングロマリットの政府への評価は向上するが、全国的な税収は減少することになる。"
 internal_faction.3.a: "減税を認めるべきだ。"
 internal_faction.3.b: "そのような譲歩をする余裕はない。"
 isis.1.t: "イスラム国に対する勝利"
 isis.1.d: "Now that the Islamic State has been defeated, our country will no longer be plagued with Extremist propaganda produced by the Islamic State. Now we can focus on spreading our ideas in our country, and never let extremists take over again."
 isis.1.a: "素晴らしい"
 isis.2.t: "タハリール・アル＝シャームへの潜入？"
 isis.2.d: "おお、すべてのムスリムのカリフ、[Root.GetLeader]よ。我々は、あなたの公正で正当な支配を拒む卑劣な敵、タハリール・アル＝シャームの心臓部を狙うべきです。彼らは真のイスラムと栄光あるジハードの道を外れていますが、その内部には多くの優れたジハード戦士がいます。インシャーアッラー、彼らに潜入し、できるだけ多くの者を我らが偉大なカリフ国に導きましょう！"
 isis.2.a: "真の戦士たちをこの偽りのジハード集団から引き離そう！"
 isis.2.b: "いや、内部抗争の可能性は避けるべきだ"
 isis.2.a_tt: "§H潜入に失敗§!（効果なし）"
 isis.3.t: "戦士たちがダーイシュに寝返る"
 isis.3.d: "[Root.GetLeader]! The so-called \"Islamic\" State have infiltrated us, and managed to sway some of our best fighters to join their ridiculous excuse of a caliphate. We should not let this go unanswered, we should fight back and defeat these kharijites who make takfir left and right while using the Holy Qur'an as toilet paper."
 isis.3.a: "我ら正義のジハード戦士が奴らを犬のように屠る！"
 isis.3.b: "いや、この戦争で新たな戦線を開く余裕はない"
 isis.4.t: "タハリール・アル＝シャーム部隊が寝返る"
 isis.4.d: "おお、カリフよ、多くの正義と勇気を持つムワッヒドの兄弟たちが邪悪なタハリール・アル＝シャーム戦線を離れ、我々の大義に加わりました！"
 isis.4.a: "タクビール！イスラム国家のタクビール！"
 isis.4.a_tt: "Adds 2 §HJabhat al-Nusra Brigades§! in §HRaqqa§!."
 isis.5.t: "タハリール・アル＝シャームが弱さを露呈"
 isis.5.d: "おお、カリフよ、忌まわしきタハリール・アル＝シャーム戦線は我々が思っていた以上に弱体化しており、我々の潜入や最近の離反に対して何の対抗策も講じておりません。諮問戦争評議会は、この腐った残骸を犬のように屠り、その領土を奪い、我が輝かしいカリフ国に加えることを推奨しています！"
 isis.5.a: "偽りのジハード戦士どもに、ウサーマ・シェイクの真の後継者が誰であるか教えてやれ！"
 isis.5.b: "今は手を出さず、時機を待つ。"
 isis.6.t: "Remains of Tahrir al-Sham join our Caliphate"
 isis.6.d: "おお、カリフよ、勝利の甘い果汁は我らの唇に触れています。敗北が迫る中、タハリール・アル＝シャームの残党は、[Root.GetLeader]であるあなたと、拡大を続ける我がカリフ制に忠誠を誓いました。"
 isis.6.a: "真のカリフ制へ兄弟たちを歓迎しよう！"
 isisNews.1.t: "タハリール・アル＝シャームがISISと合流"
 isisNews.1.d: "シリアのイスラム主義勢力タハリール・アル＝シャームは圧力の高まりを受け、残存する部隊がISISに忠誠を誓った。彼らはシリアにおいて自分たちの原理主義的イデオロギーを押し付けるための最後の手段に出た。"
 isisNews.1.a: "神よ、我らをお救いください！"
 isis.7.t: "秘密"
 isis.7.d: "秘密"
 isis.7.a: "秘密"
 isis.1301.t: "アブ・ファティマ、連合軍の空爆で殉教"
 isis.1301.d: "Bad news, Caliph! Your good friend and fellow Iraqi deputy, Abu Fatima al-Jaheishi was bravely martyred in a cowardly airstrike by the Americans.\n\n                                               He killed many apostates.\n\n                                         May Allah accept his martyrdom."
 isis.1301.a: "ワシントンD.C.を征服して彼の敵討ちを果たす！"
 isisNews.1301.t: "ISIS指揮官、連合軍の空爆で死亡"
 isisNews.1301.d: "イラクのテロリストでありISISの上級指揮官であったアブ・ファティマ・アル＝ジャヘイシが、今日アメリカ主導の連合軍による空爆で死亡した。アブ・ファティマはアル＝バグダディの側近の一人であり、ISISが支配するイラクの地域で副指導者を務めていた。"
 isisNews.1301.a: "いい気味だ！"
 isis.1302.t: "アル＝スラミ、連合軍の空爆で殉教"
 isis.1302.d: "Bad news, Caliph! Head cleric Abu Sufyan al-Sulami has been martyred in a cowardly airstrike by the Americans. He came to us from the land of Bahrain and gave us key religious backing for our Caliphate.\n\n               O Caliph, he inspired us all with his beautiful biography of you.\n\n                                         May Allah accept his martyrdom."
 isisNews.1302.t: "ISISの首席聖職者、連合軍の空爆で死亡"
 isisNews.1302.d: "Bahraini terrorist and senior ISIS religious leader Turki al-Binali, known by his nom de guerre \"Abu Sufyan al-Sulami\", was killed today in a US-coalition airstrike. al-Binali was not important for the ISIS military effort, but was key in providing religious backing for the group, and wrote the first biography of Abu Bakr al-Baghdadi."
 isis.1303.t: "司令官、連合軍の空爆で殉教"
 isis.1303.d: "Bad news, Caliph! The Emir of our Albanian and Kosovar fighters and senior commander  Lavdrim Muhaxheri has been martyred in a cowardly airstrike by the American dogs.\n\n                                                He killed many apostates.\n\n                                         May Allah accept his martyrdom."
 isisNews.1303.t: "ISIS司令官、連合軍の空爆で死亡"
 isisNews.1303.d: "コソボ系アルバニア人のテロリストであり、ISISの高位司令官であったラヴドリム・ムハジェリが、本日アメリカ主導の連合軍の空爆で死亡した。ムハジェリはNATO側でアフガニスタンで戦った後、2012年ごろに過激化し、シリアへ渡航した。2013年にISISに参加し、シリアとイラクにおけるアルバニアおよびコソボ戦闘員の「エミール」に就任した。彼は囚人を自ら斬首する冷酷な暴漢だった。"
 isis.1304.t: "司令官、連合軍の空爆で殉教"
 isis.1304.d: "O Caliph, terrible news! Our elite military commander Gulmurod Khalimov has been martyred in a cowardly airstrike by the American dogs. Before he found his path towards us from the lands of the Tajiks, he was a high-ranking special-forces officer. His military knowledge will be sorely missed.\n\n                                                He killed many apostates.\n\n                                         May Allah accept his martyrdom."
 isisNews.1304.t: "ISIS司令官、連合軍の空爆で死亡"
 isisNews.1304.d: "タジク出身のテロリストでISISの高位司令官であるグルムロド・カリモフが、本日、アメリカ主導の連合軍による空爆で死亡した。カリモフはISISに離反する前、タジク軍の経験豊富な高位特殊部隊将校だった。"
 isis.1305.t: "司令官、連合軍の空爆で殉教"
 isis.1305.d: "O Caliph, terrible news! Our head of martyrdom-operations and key trainer of foreign Mujahid, Abdullah Ahmed al-Mashadani, has been martyred in an airstrike by the American dogs.\n\n                                                He killed many apostates.\n\n                                         May Allah accept his martyrdom."
 isisNews.1305.t: "ISIS司令官、連合軍の空爆で死亡"
 isisNews.1305.d: "イラク人テロリストでISISの上級司令官であるアブドゥラ・アハメド・アル＝マシャダーニが、今日、アメリカ主導の連合軍による空爆で死亡した。アル＝マシャダーニは、自爆攻撃作戦を指揮し、外国人ジハード戦士を訓練することでISISの戦争遂行において重要な役割を果たしていた。"
 isis.1306.t: "司令官、連合軍の空爆で殉教"
 isis.1306.d: "O Caliph, bad news! Our governor of the Central Euphrates region, Ahmed Khalal al-Juhayshi, has been martyred in an airstrike by the American dogs.\n\n                                                He killed many apostates.\n\n                                         May Allah accept his martyrdom."
 isisNews.1306.t: "ISIS司令官、連合軍の空爆で死亡"
 isisNews.1306.d: "Iraqi terrorist and senior ISIS-member, Ahmed Khalal al-Juhayshi, was killed today in a US-coalition airstrike. al-Juhayshi was not a prominent military commander, but an administrator and governor of the key Central Euphrates region for the Islamic State."
 isis.1307.t: "司令官、連合軍の空爆で殉教"
 isis.1307.d: "O Caliph, bad news! Your good friend and Chief of Logistics and Supplies, Fares Reif al-Naima, has been martyred in an airstrike by the American dogs. He was a longtime brave and loyal mujahid, fighting against the infidels and apostates since 2003.\n\n                                 He killed many for the glory of the Caliphate.\n\n                                         May Allah accept his martyrdom."
 isisNews.1307.t: "ISIS司令官、連合軍の空爆で死亡"
 isisNews.1307.d: "イラクのテロリストでありISISの高位司令官であるファレス・レイフ・アル＝ナイマが、今日、アメリカ主導の連合軍の空爆で死亡した。アル＝ナイマはイラク戦争中、アメリカ軍と戦い、その後アル＝バグダディと共にキャンプ・ブッカでアメリカ軍に拘留されていた。彼はその後、ISISの物流および補給の責任者として名を上げた。"
 isis.1308.t: "司令官、連合軍の空爆で殉教"
 isis.1308.d: "O Caliph, bad news! Abu Ahmad al-Alwani has been martyred in an airstrike by the American infidels. He was an officer in the Iraqi Army of Saddam Hussein, and helped us much with his insight once he joined the Sunni insurgency and our beloved Islamic State.\n\n                                                He killed many apostates.\n\n                                         May Allah accept his martyrdom."
 isisNews.1308.t: "ISISの司令官が連合軍の空爆により殺害された"
 isisNews.1308.d: "イラクのテロリストでISの上級司令官、アブ・アフマド・アル・アルワニが本日、米軍主導の有志連合による空爆で死亡した。アル・アルワニは、米軍に対するスンニ派の反乱に加わる前は、サダム・フセイン政権下のイラク軍の将校だった。彼はISで急速に昇進し、上級司令官の地位にまで上り詰めた。"
 isis.1309.t: "司令官、連合軍の空爆で殉教"
 isis.1309.d: "O Caliph, bad news! Abu Muhammad al-Shimali has been martyred in an airstrike by the American infidels. Coming to us from the lands of Arabia, he helped us smuggle our oil and purchase our weapons. He recruited many brave mujahid to our Caliphate, and will forever be eternally praised for his key role in organizing the 2015 Paris attacks.\n\n                                                He killed many apostates.\n\n                                         May Allah accept his martyrdom."
 isisNews.1309.t: "ISISの司令官が連合軍の空爆により殺害された"
 isisNews.1309.d: "Saudi terrorist and senior ISIS-commander, Abu Muhammad al-Shimali, was killed today in a US-coalition airstrike. al-Shimali was a key recruiter and smuggler for the Islamic State. In addition, intelligence reports suggest he was instrumental in aiding the 2015 Paris attacks."
 isis.1310.t: "司令官、連合軍の空爆で殉教"
 isis.1310.d: "おお、カリフよ、大きな災難が訪れました！我々の戦争大臣であり副司令官、アイヤード・アル＝ジュマイリーが、アメリカの異教徒の犬どもによる空爆で殉教しました。イラク人である彼は、サッダーム・フセイン政権下の高位情報将校であり、我々の情報・治安責任者としてカリフ制を内部の敵から守る知恵を発揮しました。\n\n                                                彼は多くの裏切り者を殺しました。\n\n                                         アッラーが彼の殉教を受け入れてくださいますように。"
 isisNews.1310.t: "ISIS副司令官、連合空爆で死亡"
 isisNews.1310.d: "イラクのテロリストでイスラム国の副司令官であるアヤド・アル・ジュマイリが本日、米軍連合軍の空爆で死亡した。アル・ジュマイリはサダム・フセイン政権下で上級情報将校を務め、2003年の米軍占領後にスンナ派反乱軍に加わった。彼はイスラム国の情報部と国内治安部の責任者となり、後に副司令官兼戦争大臣に昇進した。"
 isis.1311.t: "司令官、連合軍の空爆で殉教"
 isis.1311.d: "おお、カリフよ、悪い知らせです！上級司令官ハイリー・アービド・マフムード・アッ＝ターイーが、アメリカの異教徒どもによる空爆で殉教しました。イラク人である彼は、我々の軍事シューラーの一員で、即席爆発装置（IED）作戦を指揮し、敵の心に恐怖と混乱の種を植え付けました。\n\n                                                彼は多くの背教者を葬りました。\n\n                                         アッラーが彼の殉教を受け入れてくださいますように。"
 isisNews.1311.t: "ISISの司令官が連合軍の空爆により殺害された"
 isisNews.1311.d: "イラク人テロリストでありISIS上級司令官、ハイリー・アービド・マフムード・アッ＝ターイーが、今日、米連合空爆で死亡した。アッ＝ターイーはISIS軍事評議会の一員であり、即席爆発装置（IED）作戦の責任者であり、ISISが攻撃した都市に混乱を蒔いた。"
 isis.1312.t: "司令官、連合軍の空爆で殉教"
 isis.1312.d: "おお、カリフよ、悪い知らせです！あなたの友人で、顧問であり上級司令官、アブドゥル・ワーヒド・フトナイル・アフマドが、アメリカの異教徒どもによる空爆で殉教しました。イラク人である彼は、治安を担当していました。\n\n                                                彼は多くの裏切り者と背教者を追い出しました。\n\n                                         アッラーが彼の殉教を受け入れてくださいますように。"
 isisNews.1312.t: "ISISの司令官が連合軍の空爆により殺害された"
 isisNews.1312.d: "イラク人テロリストでありISIS上級司令官、アブドゥル・ワーヒド・フトナイル・アフマドが、今日、米連合空爆で死亡した。フトナイル・アフマドはアル＝バグダーディーの主要な顧問であり、国内安全保障を担当していた。"
 isis.1313.t: "司令官、連合軍の空爆で殉教"
 isis.1313.d: "おお、カリフよ、悪い知らせです！我々の上級司令官、アブー・ジハード・シシャニが、アメリカの異教徒の犬どもによる空爆で殉教しました。彼はチェチェン人の土地から我々のもとに訪れ、最後までアッラーの栄光のために勇敢に戦いました。\n\n                                                彼は多くの背教者を葬りました。\n\n                                         アッラーが彼の殉教を受け入れてくださいますように。"
 isisNews.1313.t: "ISISの司令官が連合軍の空爆により殺害された"
 isisNews.1313.d: "Chechen terrorist and senior ISIS-commander, Abu Jihad Shishani, was killed today in a US-coalition airstrike. Shishani, a Russian citizen, was second-in-command of the Caucasus Emirate terror group under the leadership of Umar Shishani. After Umar traveled to Syria and joined ISIS, Abu Jihad tried to take over the Caucasus Emirate in order to pledge its allegiance to ISIS, but ended up travelling to Syria to fight for ISIS as a senior commander too."
 isis.11301.t: "アブ・ファティマ、ロシアの空爆で殉教"
 isis.11301.d: "Bad news, Caliph! Your good friend and fellow Iraqi deputy, Abu Fatima al-Jaheishi was bravely martyred in a cowardly airstrike by the Russians.\n\n                                               He killed many apostates.\n\n                                         May Allah accept his martyrdom."
 isis.11301.a: "モスクワを征服して彼の敵討ちを果たす！"
 isisNews.11301.t: "ロシアの空爆でイスラム国司令官が死亡"
 isisNews.11301.d: "イラクのテロリストでISの上級司令官アブ・ファティマ・アル・ジャヘイシが本日、ロシア軍の空爆で死亡した。アブ・ファティマはアル・バグダディの側近であり、ISが支配するイラクの一部地域で副指導者を務めていた。"
 isisNews.11301.a: "いい気味だ！"
 isis.11302.t: "アル＝スラミ、ロシアの空爆で殉教"
 isis.11302.d: "Bad news, Caliph! Head cleric Abu Sufyan al-Sulami has been martyred in a cowardly airstrike by the Russians. He came to us from the land of Bahrain and gave us key religious backing for our Caliphate.\n\n                 O Caliph, he inspired us all with his beautiful biography of you.\n\n                                         May Allah accept his martyrdom."
