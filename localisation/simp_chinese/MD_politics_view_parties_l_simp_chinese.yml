 SHN.Neutral_Autocracy: "£SHN_Neutral_Autocracy 掸邦复辟委员会"
 SIA.conservatism: "£SIA_western_conservative (DP) - 民主党"
 SIA.conservatism_desc: "（保守自由主义）- 民主党\n\n成立于1946年的民主党是泰国历史最悠久的政党之一。该党始终坚定支持泰国的宪政体制，反对该国多次政变，并坚持温和的政治纲领，致力于在泰国构建一个更加中间派和传统派的民主愿景。"
 SIA.liberalism: "£SIA_western_liberal (CP) - 国家发展党"
 SIA.liberalism_desc: "（国家发展主义） - 国家发展党\n\n泰国共产党由前总理差猜·春哈旺于1992年创立，奉行以基础设施和省级发展为核心的技术官僚式、增长导向型纲领。该党于2004年并入泰爱泰党。"
 SIA.socialism: "£SIA_western_social_democrat (MFP) - 远进党"
 SIA.socialism_desc: "（进步主义） - 远进党\n\n远进党（前身为未来前进党，系非正式更名）是一个左翼政党，主张结束军方对泰国政策的干预，推行民主改革，并倡导广泛的进步议程。该党的纲领和政策使其与泰国建制派关系紧张，并因此遭受了不当行为的指控。"
 SIA.Caliphate: "£SIA_Caliphate (BRN) - 北大年马来国民革命阵线"
 SIA.Caliphate_desc: "（伊斯兰主义） - 正式名称为北大年马来民族革命阵线的组织，于1963年在泰国境内成立，是一个旨在争取北大年地区穆斯林人口独立的分离主义组织。尽管名义上是一个纯粹的分离主义运动，但其内部各派系信奉的信仰却五花八门，包括圣战主义、伊斯兰主义、马来民族主义，甚至还有一些曾受左翼思想影响、但现已被该党彻底摒弃的派系。此外，一些派系拒绝以和平手段实现其目标，而是试图破坏泰国在该地区的统治。"
 SIA.Neutral_conservatism: "£SIA_non_aligned_conservative (CTP) - 泰国国民党"
 SIA.Neutral_conservatism_desc: "（民族保守主义） - 泰国国民党\n\n泰国国民党成立于1974年，是一个亲军方团体，代表泰国军方内部的一个派系。在其存在的大部分时间里，该党一直是泰国第二大党。几十年来，该党的意识形态虽略有调整，但始终坚持务实、民族主义和相当保守的纲领。"
 SIA.neutral_Social: "£SIA_neutral_Social (TRT) - 泰爱泰党"
 SIA.neutral_Social_desc: "（广泛民粹主义） - 泰爱泰党\n\n泰爱泰党成立于1998年，凭借其广泛且极具吸引力的民粹主义纲领迅速崛起，其主要政策旨在应对1997年亚洲金融危机。尽管该党初期支持率飙升，并在多次选举中取得巨大胜利，但其内部派系林立的局面最终导致分裂和解散。"
 SIA.Nat_Autocracy: "£SIA_Nat_Autocracy (NCPO) - 全国维持和平秩序委员会"
 SIA.Nat_Autocracy_desc: "（民族主义军政府） - 全国维持和平秩序委员会\n\n由军方组织起来统治国家的全国维持和平秩序委员会主张更加保守的价值观，并加强军方对政治的控制 - 暂停宪法，限制国家整体的多元化。"
 SIA.Nat_Populism: "£SIA_Nat_Populism (NAP) - 新希望党"
 SIA.Nat_Populism_desc: "（新自由民粹主义） - 新希望党\n\n新希望党成立于1990年，奉行温和的民粹主义纲领，并融合了经济自由主义的元素。该党初期在选举中取得了一些成功，但1997年的亚洲金融危机重创了其选民吸引力，此后便未能保持长久的成功。"
 SIA.Monarchist: "£SIA_nationalist_monarchist 却克里王朝"
 SIA.Monarchist_desc: "（专制君主主义） - 却克里王室\n\n泰国君主制由普塔约特法·朱拉洛克（拉玛一世）于1782年建立，历经战争、殖民野心、叛乱和内部纷争，至今仍保持着大部分权力。在近代，君主制得到军方的支持，通过直接和间接的手段对政治施加影响 - 扶持政党，并游说反对对君主权力施加过多限制。"
 SIN.conservatism: "£SIN_conservatism 人民行动党 - §C西方派系§!"
 SIN.conservatism_desc: "人民行动党自1950年代后期以来一直在新加坡执政。它被许多人视为美化的寡头政治，但也为新加坡的经济繁荣做出了贡献。 人民行动党制定的政策在本质上通常是保守的，同时拒绝任何真正西方的标签。\n\n§C西方派系§! 将推动与美国等西方大国加强合作。"
 SIN.conservatism_icon: "£SIN_conservatism"
 SIN.liberalism: "£SIN_liberalism 新加坡民主党"
 SIN.liberalism_desc: "新加坡民主党将重点放在人权和不断发展的新加坡而不过度剥削新加坡人民的议程上。"
 SIN.liberalism_icon: "£SIN_liberalism"
 SIN.socialism: "£SIN_socialism 工人党"
 SIN.socialism_desc: "工人党是唯一拥有议会成员的反对党。他们认为新加坡应该更多地转向社会主义国家，同时尽量减少精英主义和唯物主义。此外，他们相信“第一世界议会”，政府对与新加坡人有关的问题负责，并允许新加坡人行使其政治参与权。\n"
 SIN.socialism_icon: "£SIN_socialism"
 SIN.Autocracy: "£SIN_conservatism 人民行动党 - §G东方派系§!"
 SIN.Autocracy_desc: "人民行动党自1950年代后期以来一直在新加坡执政。它被许多人视为美化的寡头政治，但也为新加坡的经济繁荣做出了贡献。人民行动党制定的政策在本质上通常是保守的，同时拒绝任何真正西方的标签。\n\n人民行动党的§G东方派系§!寻求与中国和俄罗斯以及其他主要新兴大国建立更紧密的联系。\n"
 SIN.Autocracy_icon: "£SIN_conservatism"
 SIN.anarchist_communism: "£SIN_anarchist_communism 新加坡人民党"
 SIN.anarchist_communism_desc: "新加坡人民党（SPP）遵循新加坡自由党的许多相同模式。他们类似于新加坡民主党；然而，他们寻求更多的让步，比如更好的工作和教育机会。\n"
 SIN.anarchist_communism_icon: "£SIN_anarchist_communism"
 SIN.Caliphate: "£generic_Caliphate_small 伊斯兰祈祷团"
 SIN.Neutral_Autocracy: "£SIN_conservatism 人民行动党 - §R不结盟集团§!"
 SIN.Neutral_Autocracy_desc: "人民行动党自1950年代后期以来一直在新加坡执政。它被许多人视为美化的寡头政治，但也为新加坡的经济繁荣做出了贡献。 人民行动党制定的政策在本质上通常是保守的，同时拒绝任何真正西方的标签。\n\n§R不结盟集团§! 主要关注在没有外国干涉的情况下屹立不倒的东南亚国家联盟和新加坡。他们通常是三个集团中最大的组成部分。\n"
 SIN.Neutral_Autocracy_icon: "£SIN_conservatism"
 SIN.Neutral_Communism: "£SIN_Neutral_Communism 民主进步党"
 SIN.Neutral_Communism_desc: "民主进步党是新加坡的另一个小党，它提倡更多的人权和财富的再分配，以消除贫困。\n"
 SIN.Neutral_Communism_icon: "£SIN_Neutral_Communism"
 SIN.Neutral_conservatism: "£generic_Neutral_conservatism_small 改革党"
 SIN.Neutral_conservatism_desc: "中立保守主义 - 改革党是新加坡经济上持自由主义立场、社会上持保守主义立场的政党。"
 SIN.Neutral_Libertarian: "£SIN_Neutral_Libertarian 新加坡第一"
 SIN.Neutral_Libertarian_desc: "新加坡第一成立于2014年初，旨在减少对廉价低技能外劳的依赖，更加优先发展本地企业，鼓励本地新加坡人就业，并最终审查导致新加坡人在新加坡工作时处于不利地位的政策.\n"
 SIN.Neutral_Libertarian_icon: "£SIN_Neutral_Libertarian"
 SIN.neutral_Social: "£SIN_neutral_Social 国家团结党"
 SIN.neutral_Social_desc: "国家团结党主张在多政治体系内加强合作，并在政治和经济上赋予人民更大的权利。\n"
 SIN.neutral_Social_icon: "£SIN_neutral_Social"
 SIN.Nat_Autocracy: "£SIN_Nat_Autocracy 新加坡武装力量"
 SIN.Nat_Autocracy_desc: "新加坡武装部队是在从马来西亚独立后不久成立的，作为世界上装备最精良、训练有素的武装部队之一，它逐渐成为人们关注的焦点。新加坡的军队主要是一支以征兵为基础的军队，有一小部分专业军人和妇女。\n"
 SIN.Nat_Autocracy_icon: "£SIN_Nat_Autocracy"
