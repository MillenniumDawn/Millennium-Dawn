l_simp_chinese:
 fiji_influence_defense_through_chaos: "通过混乱影响防御"
 fiji_influence_defense_through_chaos_desc: "斐济自1970年代以来就已独立，但不幸的是，独立并没有给我们带来我们所希望的荣耀与和平。国内和军事政变、猖獗的种族紧张局势使该国与世界上大多数国家相比基本上处于停滞状态。然而，混乱也带来了一种天然屏障，因为外国过于谨慎，不愿因为这种混乱而失去如此小地区的资产。因此，我们的国防抵御外国影响的能力高于预期，这无疑是一把双刃剑，但就目前而言，这对我们有利。"
 fiji_militarized_society: "军事化社会"
 fiji_militarized_society_desc: "2000年政变带来的混乱和暴力在国民心中留下了难以磨灭的伤痕。这伤痕是仇恨和羞耻的印记。带着这道伤痕，新一代年轻人纷纷加入军队，从而巩固了军政府作为一种领导形式的存在和影响力。这导致了一种以决心和责任为导向的思维模式，军队即社会，社会即军队。"
 fiji_society_of_the_elected_king: "当选国王协会"
 fiji_society_of_the_elected_king_desc: "随着苏瓦王室展现出强大的力量，肩负起捍卫国家、历史和维护公正法律秩序的根本责任，许多人看到了它从极其朦胧的光芒中走出来。这给斐济人民留下了自独立以来任何民选政府都未曾有过的震撼。因此，许多人表示支持，并寻求与新体制合作，即使他们可能并不完全认同。"
 fiji_ostracized_commonwealth_member: "被排斥的英联邦成员"
 fiji_ostracized_commonwealth_member_desc: "我们国家的混乱使我们与英联邦其他国家的关系变得紧张。虽然我们享受这赋予我们的国际额外权力，但由于我们的内部局势对外国成员造成的激烈影响，我们并没有看到事情的全部现实。但我们至少会拿走我们能得到的。"
 fiji_foreign_scientist_imports: "外国科学家进口"
 fiji_foreign_scientist_imports_desc: "通过一些关键的激励措施，我们可以通过预算承诺以及永久离家休假的承诺，将科学思想带到斐济。"
 fiji_pacific_exchange_and_investment_society: "太平洋投资与交流协会"
 fiji_pacific_exchange_and_investment_society_desc: "太平洋投资与交流协会是一个社会和外交关系团体。我们更像是一个区域性的乡村俱乐部，我们利用这个社会作为吸引投资者的一种方式，同时在全球蛋糕上的一小部分上输出我们自己的品牌。"
 fiji_depoliticized_military: "军队去政治化"
 fiji_depoliticized_military_desc: "经过与军方的反复交涉，双方达成了一项协议，将军队与文职政治机构分开。这项简单而坚定的谅解，或许能为斐济日后的改革打开大门，使其更好地发展成为一个虽小但具有区域影响力的大国。"
 fiji_cohesive_integrations_act: "凝聚力整合法案"
 fiji_cohesive_integrations_act_desc: "我们寻求了解周围更广阔的世界，我们寻求与同胞建立更紧密的联系。我们寻求拓展视野，为我们的人民以及那些想要改善的人谋求更好的生活。"
 fiji_independence_sustainment_act: "独立维持法案"
 fiji_independence_sustainment_act_desc: "我们效仿美国和中东国家的榜样，寻求创造我们自己的独立精神。因为如果我们的国家被世界的阴谋所吞没，我们最终将战胜困难。"
 fiji_importing_ideas_exporting_ideals: "输入想法，输出理想"
 fiji_importing_ideas_exporting_ideals_desc: "我们的岛虽小，但我们的志向却很大。我们可能无法从根本上改变世界，但我们仍然可以成为国际事务拼图中的重要组成部分。我们的研发将高效且专注，使我们能够以较小的突发速度更快地寻找新领域。 这将使我们的国家对外国列强产生巨大的吸引力。"
 fiji_pieces_for_the_peace: "和平作品"
 fiji_pieces_for_the_peace-desc: "凭借我们新发现的稳定性，我们现在可以更好地向更广阔的世界寻求帮助和机会。尽管我们还有很长的路要走，但这至少可以说是一个巨大的飞跃。"
 fiji_the_fijian_dream: "斐济之梦"
 fiji_the_fijian_dream_desc: "我有一个梦想，这个梦想是那些被社会抛弃、瞧不起、彻底抛弃的人的梦想。那些人可以在生活中昂首挺胸，那些人可以说，这不是结束，而是一个新的开始。这可以而且应该实现，并且将成为斐济国旗下人们的未来。"
 fiji_building_tall_within_something_small: "小中建高"
 fiji_building_tall_within_something_small_desc: "《高层建筑法案》对于没有背景的人来说是相当误导的。该法案规定了自动化基线形式的授权，我们的人民应该习惯并适应这种形式。了解这一原则，我们就能够在更小的区域内建设更多的建筑，从而使我们的岛屿更加高效，从而在世界舞台上更具竞争力。"
 fiji_new_foreign_image: "新对外形象"
 fiji_new_foreign_image_desc: "由于我们的人民不再不断地战斗、逃亡或无家可归，我们周围更广阔的世界已经开始转而钦佩。这些年来，我们的岛屿发生了真正的转变，因此，真正的努力就会带来真正的成果。"
 fiji_foriegn_advisory_board: "外国顾问委员会"
 fiji_foriegn_advisory_board_desc: "外国顾问委员会由众多民事和军事顾问组成，他们将加强并帮助我们的国家走上正轨。尽管许多人可能担心这是否会损害我们国家对外部势力的独立性。请放心，我们事先就考虑到了这一点，因为这些外国顾问实际上将成为我们国家的新公民。通过政府激励措施以及从他们本国买断这些人的权力，我们可以预期外部影响很小，同时反过来增强我们的内部力量。"
 fiji_national_rotc_program: "国家后备军官训练队计划"
 fiji_national_rotc_program_desc: "随着国家后备军官训练团计划在国家教育中的建立，我们将能够向我们国家的子孙后代传授团结、领导力、创新和团队合作精神。这对国家稳定以及我国人民的整体精神和精神的影响将是巨大的。"
 fiji_expanded_ministry_of_science: "扩大科学部"
 fiji_expanded_ministry_of_science_desc: "通过优先发展技术，我们可以在民用和军事应用领域取得一系列进步。因此，如果我们要真正寻求我们国家的未来，尽管要付出代价，我们也必须寻求改善我们的整体地位。"
 fiji_citizen_soldiers_amendment: "公民士兵修正案"
 fiji_citizen_soldiers_amendment_desc: "我们不是一个拥有军队的国家，而是一个拥有国家的军队。过去的民族主义思想总是被不良行为者滥用等等，以实现个人目标和野心。好吧，这一切一去不复返了。通过宪法法令，我们确立了斐济民族主义是什么、作为斐济人意味着什么以及一个人如何真正过上为自己的生活感到自豪的生活。"
 fiji_fijian_general_staff: "斐济总参谋部"
 fiji_fijian_general_staff_desc: "军事议会本质上是一个庞大的总参谋部。将政府和军事事务混合到一个统一的指挥系统中，意味着可以以任何一方都无法想象的速度理解和解决军事和民事需求的规划和协调。但我们必须意识到总参谋部所扮演的角色，因为在如此集中的权力包围下，人们可能会失去视线。"
 fiji_research_institute_of_fiji: "斐济研究所"
 fiji_royal_engineers_program: "皇家工程师计划"
 fiji_royal_engineers_program_desc: "这个有限的混合计划将文职人员融入政府，更具体地说，军事相关项目是一个基础。这创造了一个受控的底线，我们可以防止我们的公民自由落体，因为失去一切的想法可能会对许多人的思想和决策造成严重破坏。对于那些跌倒的人来说，这个计划将成为希望的灯塔，表明我们会帮助他们重新站起来。"
 fiji_economic_planning_board: "经济规划委员会"
 fiji_economic_planning_board_desc: "经济规划委员会是经济增长的政府部门。虽然私营部门仍然可以玩得开心，但对于那些令人恐惧的反共传教士来说，这个政府部门更像是一个独立的投资部门。这是为了帮助指导和启动新的政府举措，一旦稳定得到保证，这些举措将转为私人举措。简而言之，经济规划委员会开始做事，私营部门则继续做事，希望能永远持续下去。"
 fiji_pacific_economics_exchange_commission: "太平洋经济交流委员会"
 fiji_pacific_economics_exchange_commission_desc: "太平洋环境教育中心是一个区域性合作项目，旨在更好地拓展我们与本地区各国的影响力与合作。虽然其主要重点是经济和政治，但军事教学的副业将使所有参与者受益。"
 fiji_titles_by_election: "选举头衔"
 fiji_titles_by_election_desc: "选举头衔是一项宪法要求，其中民主程序得以保留，人民可以投票选出下一个所谓的贵族。这不再是睡前童话，现在你真的可以说你也可以成为女王或国王。"
 fiji_institute_of_automation: "斐济自动化研究所"
 fiji_institute_of_automation_desc: "斐济自动化研究所被称为“研究天堂计划”的基础工作。我们的目标是从根本上将岛屿转变为一个大型研发设施，并向世界展示您可以在阳光下以及想象力和创造力中找出现实本身的未知数。"
 fiji_institute_of_resource_development: "斐济资源开发研究所"
 fiji_institute_of_resource_development_desc: "斐济资源开发研究所是研究天堂计划发展的另一个标志。致力于提取、精炼和合成资源，以发挥最大的已知潜力。虽然我们的岛很小，但这并不意味着我们没有任何东西可以使用。因此，该研究所将成为确保国内供应以及如何尽可能增长国内供应的关键点。"
 fiji_institute_of_energy_development: "能源发展研究所"
 fiji_institute_of_energy_development_desc: "能源发展研究所将专注于开发更高效、更有生产力的能源生产方式。该部门还可以与斐济资源开发研究所合作，更好地整合我们的能源和经济凝聚力。"
 fiji_technocratic_military: "技术官僚军事"
 fiji_technocratic_military_desc: "虽然我们的岛屿面积不大，但我们的智慧却不容小觑。正是基于这种认识，我们才能在研发能力方面投入相当可观的资源，以增强我们的军事力量。我们目前的经济实力尚不足以拥有现代化的空军，但至少我们可以更好地发展海军和陆军的专业化能力。"
 fiji_research_paradise_program: "研究天堂计划"
 fiji_research_paradise_program_desc: "我们广泛的研究努力的顶峰为整个研究和开发创造了一个新的天堂。该岛已变成天堂，不仅是外国度假者的天堂，也是整个科学界的天堂。在这里，我们可以协调我们所了解的领域以及我们可能发现的新领域的国内外进展。未来确实就是现在。"
 fijian_homelessness_crisis: "无家可归危机"
 fijian_homelessness_crisis_desc: "由于国家政治动荡，政府在应对日益严重的无家可归危机方面完全缺乏纠正和果断的行动。新千年伊始，许多人都在质疑政府是否真的能够解决这个困扰国家的日益严重的问题。然而，时间会证明，政府不仅能够照顾好国家，甚至还能开始照顾好自己。"
 fijian_emigration_crisis: "大规模移民危机"
 fijian_emigration_crisis_desc: "随着政治不稳定、气候变化和种族紧张局势加剧，斐济的变革思想意识到最好离开这些小岛。新政府有责任为更美好的明天奠定基础，但面临如此多的困难，斐济政府能否经受住时间的考验？"
 fijian_military: "斐济军队"
 fijian_military_desc: "在整个岛屿独立期间，斐济军队一直是一支优秀的自卫力量。然而，即使参与的外国任务有限，斐济军队也几乎没有经验。随着该岛进入现代时代，人们担心会出现更多的政治动荡，许多人想知道军队还需要多少倍的时间来维持和平。"
 fijian_economic_condition: "斐济经济"
 fijian_economic_condition_desc: "尽管斐济人口和国土面积不大，但其经济结构却十分多元化。采矿业在铜、金、银等资源的开采方面表现卓越。第二产业包括水泥生产和航运业。总体而言，斐济经济拥有相对稳固的基础。随着新千年的到来，政府有责任通过拓展高科技和软件开发等新兴产业，进一步推动经济多元化发展。"
 fijian_ethnic_tensions: "印度-斐济紧张局势"
 fijian_ethnic_tensions_desc: "自独立以来，斐济岛的人口增长相当缓慢。然而，这种想法的缺点是，绝大多数移民到斐济的人都是印度裔。虽然对大多数人来说这毫无意义，但不幸的是，对相当多的斐济族人民来说，这感觉就像是替代和边缘化。纵观群岛最近的独立历史，这些紧张局势只会急剧加剧，斐济政府有责任在严重事件发生之前解决这个问题……请忽略渗透到该国历史上的几次政变。"
 fiji_2000_coups_over: "和平的归来"
 fiji_post_coup_political_shift: "忠诚正在改变"
 fiji_fast_tracked_military_junta: "§8改善的长征已经开始§!"
 fiji_fast_tracked_monarchy: "§0力量之冠，人民之冠§!"
 fiji_2006_coup_avoided: "§P已避免2006年政变§!"
 fiji_2006_coup_historical: "§l军事政变成功§!"
 fiji_2006_coup_military_junta: "§8香蕉人已经倒台§!"
 fiji_2006_coup_monarchist_era: "§0苏瓦王室获胜§!"
 fiji_2006_coup_technocracy: "§t技术官僚委员会夺取控制权§!"
 fiji_news.1.t: "民族主义者绑架政府官员"
 fiji_news.1.d: "今天早些时候，2000年5月19日，亲斐济族裔政治运动斐济人的成员劫持了新当选的、大多数是印度裔斐济人的政府的关键成员作为人质。总理和几位主要政府官员在议会大楼内被扣为人质，而斐济人成员也几乎被困在里面。谈判正在进行中，以确保在不造成人员伤亡的情况下营救人质。"
 fiji_news.1.o1: "为什么我们必须互相争斗"
 fiji_news.2.t: "临时政府成立"
 fiji_news.2.d: "事件发生以及与叛军的谈判陷入僵局后总统卡米塞塞·马拉宣布进入紧急状态，并利用目前被扣押的未被抓获的政府成员组建了一个持续政府。由于当地警察和斐济共和国军队在议会周围设置了失败的警戒线，并应对日益增长的抗议和内乱，抗议者瞄准了苏瓦的几家印度裔斐济企业，因此局势高度紧张。"
 fiji_news.2.o1: "我们就不能做点什么吗！？"
 fiji_news.3.t: "失去权威导致军事政变"
 fiji_news.3.d: "由于残余文官政府已证明其无法真正行使行政权力，斐济共和国军事部队司令弗兰克·姆拜尼马拉马已推翻现政府并建立自己的政权。他们的首要行动是实施戒严，以便获取更多权限应对大规模内乱。"
 fiji_news.3.o1: "又来了"
 fiji_news.3.o2: "军方将解决这个问题"
 fiji_news.4.t: "议会交火"
 fiji_news.4.d: "军事政变后，1997年宪法被废除，谈判破裂，军方发出最后通牒。外国势力开始对斐济实施一系列制裁，斐济被取消了英联邦成员国资格，一些国家禁止斐济商品流通，斐济体育队伍也被禁赛。这些回应源于对叛军要求的妥协。6月12日，军方向乔治·斯佩特的车辆鸣枪示警，尽管斯佩特声称这是一次未遂的暗杀行动。谈判仍在进行中，更多人质获释。随着内乱逐渐平息，局势充满希望，许多人开始怀疑这种情况还能持续多久。"
 fiji_news.4.o1: "请结束这种毫无意义的暴力"
 fiji_news.5.t: "军方同意叛军的观点？"
 fiji_news.5.d: "2000年7月3日，姆拜尼马拉马任命莱塞尼亚·卡拉塞为总理，组建了一个全部由原住民斐济人组成的政府。斯佩特对此决定极为愤怒，次日议会爆发枪战，五人受伤。混乱不断升级，叛军在全国制造了一系列事件。拉巴萨苏库奈瓦卢军营的士兵哗变，宣布支持斯佩特。当地地主占领了莫纳萨武水坝，切断了苏瓦的电力供应。8日，叛军封锁了苏瓦与楠迪之间的道路，并袭击了科罗武的一处警察局，劫持了30名人质。在纳博罗监狱，50名囚犯暴动，劫持了狱警作为人质。"
 fiji_news.5.o1: "姆拜尼马拉马在想什么！？！"
 fiji_news.6.t: "政变结束"
 fiji_news.6.d: "在整个六月和七月的几个月里，半连续的谈判将渗透到全国，人们不断地谈论文职政府的改革。最终，随着叛军离开议会大楼并从首都地区迁移，越来越多的人质将被释放。最终，7月26日，斯佩特和他的发言人乔·纳塔在两名叛军领导人对新总统和内战发出威胁后在军事检查站附近被捕。不久之后，军队袭击了叛乱分子总部，又逮捕了369名叛乱分子。就在乔治·斯佩特因叛国罪被审判并被判处死刑后不久，平民政变被宣布结束。"
 fiji_news.6.o1: "终于和平了……但代价是什么？"
 fiji_news.7.t: "斐济联合党取得胜利"
 fiji_news.7.d: "斐济1997年宪法规定，众议院大选至少每五年举行一次。2006年3月2日，代总统拉图·乔尼·马德莱维维发布公告，宣布解散议会，该公告自3月27日起生效。上届议会任期原定于2006年10月1日届满。选举令于3月28日发布；候选人于4月11日提交提名，13日公布候选人名单，选民登记于4月4日截止。2006年5月6日至13日，斐济举行大选。由总理莱塞尼亚·恩加拉塞领导的现任“杜瓦塔和莱韦尼瓦努阿”政府再次当选，开始第三届政府任期。主要反对党是马亨德拉·乔杜里领导的工党，以及其他几个小党派。"
 fiji_news.7.o1: "她走的如此坚定。"
 fiji_news.8.t: "军方要求"
 fiji_news.8.d: "2006年10月16日，斐济共和国军事部队指挥官姆拜尼马拉马准将发出最后通牒，要求政府在12月1日前满足九项要求，否则就辞职。这九项要求主要围绕将2000年政变的支持者绳之以法；撤销任何可能基于种族理由进一步加剧经济不平等的政治阴谋；拒绝外国当局的干预（并点名提到澳籍警察局长安德鲁·休斯）；撤销针对军方今年早些时候言论的法庭诉讼，并正式回应有关政府开支和内部治理的关切。一周半后的2006年10月31日，军方在苏瓦周边举行演习，并封锁了该市的军营。军方表示，这些演习不具威胁性。"
 fiji_news.8.o1: "我们拒绝这样的乌合之众"
 fiji_news.8.o2: "§P让我们暂时保住面子吧§!"
 fiji_news.9.t: "军事政变政府"
 fiji_news.9.d: "由于政府拒绝接受军方的要求，弗兰克·姆拜尼马拉马准将发动了一场政变，推翻了政府。军方声称，该政府构成了对社会与族群稳定的威胁。事态发展迅速，表明军方内部在实现准将的意志上似乎团结一致。但一些人对这一行动的正当性存有疑问，还有更多人似乎认为军方另有图谋。尽管已知信息不多，许多人仍希望我们能够真正迎来我们时代的和平。"
 fiji_news.9.o1: "这真的足够了吗？"
 fiji_news.9.o2: "§l稳定已恢复§!"
 fiji_news.10.t: "政变成员煽动"
 fiji_news.10.d: "随着最近的政变确立弗兰克·姆拜尼马拉马准将为斐济的实际领导人，许多人都在思考斐济的未来究竟会如何。政变中的一些高级成员似乎正在鼓动对国家治理采取更强硬的立场。其中一人甚至表示，种族冲突引发的琐碎争吵是斐济有史以来最大的失误，更遑论因此而四分五裂。目前，全世界都在关注这个太平洋小岛国所面临的动荡局势。"
 fiji_news.10.o1: "§8军队是我们的救世主§!"
 fiji_news.10.o2: "我们受的苦还不够多吗"
 fiji_news.11.t: "旧观念引发派系斗争"
 fiji_news.11.d: "军政府内部的派系斗争日益猖獗，旧思想中新的色彩不断涌现。被称为苏瓦王室的派系似乎想建立一个民选君主制，一种带有新原则的旧头衔。选举的理念和民主原则仍然存在，而不是将头衔与血腥联系在一起。君主制与民主选举主义的混合将成为他们政纲的基本基础。一位派系成员甚至引用了这样一句话：现在你可以告诉你的儿子或女儿，如果你足够努力并寻找人生目标，你也可以成为王子、公主，甚至国王或王后。许多人对这个提议并不确定，但它似乎确实对酋长委员会和岛上人民的部落遗产有吸引力。"
 fiji_news.11.o1: "多么的童话啊"
 fiji_news.11.o2: "§0嗯...可能是一个很好的自我提升§!"
 fiji_news.12.t: "政变破坏稳定"
 fiji_news.12.d: "政变持续发酵，民众纷纷抗议各派势力，国家陷入停滞，许多人都在思考这漫长的等待最终会带来什么。有传言称，一个名为“技术委员会”的派系正在组建，该委员会似乎隶属于斐济技术统治党这个神秘的小众政党。然而，许多反对政变机器的抗议运动都希望尽快结束，越来越多的迹象表明，斐济工党应该接任，毕竟它在选举中位列第二。究竟谁会率先屈服呢？"
 fiji_news.12.o1: "§t委员会夺权§!"
 fiji_news.12.o2: "§P人民已经受够了§!"
 fiji_news.400.t: "军事狂热者"
 fiji_news.400.d: "政变造成的混乱导致一些军方人员采取了不必要的激进做法，公然违抗弗兰克·姆拜尼马拉马准将的意愿。紧张局势不断升级，军方内部的凝聚力也开始瓦解。"
 fiji_news.400.o1: "上帝救救我们"
 fiji_news.401.t: "突袭传闻不断增加"
 fiji_news.401.d: "最近有传言称，在思想更为激进的领导人领导下，军政府的一个派别已制定了一项袭击议会大楼并救出人质的计划。人们看到，海军准将正忙着寻找这些激进军官，以防止一场自20世纪80年代第一次政变以来从未出现过的国家危机。时间会证明这片土地是由头脑冷静的人统治还是由混乱统治。"
 fiji_news.401.o1: "§8我想我听到枪声了？§!"
 fiji_news.401.o2: "§l今天出奇的安静。§!"
 fiji_news.401.o3: "§0我听到的骚动是什么？§!"
 fiji_news.402.t: "苏瓦大屠杀"
 fiji_news.402.d: "混乱摧毁了整个国家，枪声和对人质事件的突袭造成了15人死亡、27人受伤以及全国范围内的恐慌。在这场长达一周的混乱事件中，有消息称弗兰克·姆拜尼马拉马准将在一支严重受损的车队中被发现死亡。没有人声称对这位准将的死负责，关于他是否真的该死，人们的看法不一。尽管如此，这是一条将让国家付出巨大代价的复苏之路。"
 fiji_news.402.o1: "我们真的能渡过难关吗？"
 fiji_news.403.t: "继续前行"
 fiji_news.403.d: "在2000年政变带来的动荡之后，重建国家是一段漫长而艰辛的旅程。但凤凰涅槃，浴火重生，这只雄伟的飞鸟必将翱翔天际。现在，我们可以专注于巩固已有的基础，并将目光不仅投向我们的小岛，更投向我们周围的世界。"
 fiji_news.403.o1: "旅程才刚刚开始。"
 fiji_news.500.t: "权力斗争加剧"
 fiji_news.500.d: "军队突然被调离议会大楼周围本已糟糕的警戒线。消息人士称，在苏瓦郊区附近听到了枪声和轮胎的刺耳声。许多人质疑，究竟发生了什么，导致军方反政变的机构对残余的文官政府发生了如此剧烈的变化。此外，最初发动政变的民族主义领导人已发出强烈呼吁，要求与其对话，否则将承担不作为的后果。我们希望很快能得到有关此事的消息。"
 fiji_news.500.o1: "我们还有国家吗？"
 fiji_news.501.t: "血腥的结果已经到来"
 fiji_news.501.d: "与我们所处的现代世界形成鲜明对比的是，军方一个激进派别伏击了准将的车队，随后迫使酋长委员会承认苏瓦王室的合法地位。这场血腥的夺权之举，使得这个国家变成了君主制国家，尽管该国历史上曾摆脱君主制并获得独立。最近，一位据称是王室成员的人在接受采访时表示：“我们寻求对国家实行坚定、公正和敬畏上帝的统治。虽然我们正在实施某种形式的戒严令，直到民族主义者被镇压，但我们并不打算废除选举。”许多人对这些说法持怀疑态度，但绝大多数人只是希望混乱局面能够结束。让我们拭目以待，看看这顶用鲜血铸就的王冠最终会带来怎样的后果。"
 fiji_news.501.o1: "还有秩序吗？！"
 fiji_news.502.t: "新时代"
 fiji_news.502.d: "随着重建进程基本完成，伤疤有所愈合，国家能够专注于未来。苏瓦王室致力于国家及其人民的充分理解和发展。理解这一点将给人们带来挑战，尽管仍然犹豫不决，但生活已经恢复正常，他们已经产生了一种轻松感……即使这种正常本身并不被认为是“正常”。"
 fiji_news.502.o1: "新的篇章，新的开始。"
 Rear_Admiral_Villiame_Naupoto_desc: "维利亚姆·瑙波托曾是斐济海军军官，在2006年政变的混乱中，他加入了一个更为激进的军国主义派系。这个派系在政变中驱逐并孤立了弗兰克·“香蕉人”。由于这一转变，原本合乎宪法的政变如今已演变成一场彻头彻尾的军政府统治。虽然瑙波托少将是政坛新秀，但他并非一无所知，因此人们不禁要问，他将如何带领国家和人民走向更美好的未来。"
 Laisenia_Qarase_desc: "莱塞尼亚·恩加拉塞是2000年政变期间确定的妥协候选人。不太左倾，斐济人，目前也不太右倾 他随后赢得了2001年的提前选举，并令人惊讶地赢得了2006年的选举。尽管到2006年，他的观点和政党已经变得更加与斐济族裔保持一致，但他在2006年任期内提出的一些有争议的法案将引发宪法危机，从而导致2006年军方政变。"
 Mahendra_Chaudhry_desc: "2000年，马亨德拉·乔杜里当选为斐济首届以印度裔为主的政府领导人。然而，一名民族主义运动的煽动者决定自行采取行动，绑架了当选政府。政变后，联合斐济党成立，并在政变后的提前大选中正式当选。马亨德拉·乔杜里在2006年大选中再次竞选总理职位。"
 Dr_Padma_Narsey_Lal_desc: "帕德玛·纳尔西·拉尔生于1951年，毕业于南太平洋大学，获得科学、生态学和生物化学硕士学位。她是第一位就读该大学的古吉拉特邦女性。1971年，她荣获南太平洋大学首枚金质奖章。她还获得了澳大利亚国立大学资源与环境研究硕士学位和夏威夷大学马诺阿分校农业与资源经济学博士学位。帕德玛·拉尔最初在斐济政府担任公务员，之后转入研究和研究管理岗位。她曾担任太平洋岛屿论坛秘书处可持续发展顾问和国际自然保护联盟海洋区域办事处首席技术顾问。拉尔还曾在澳大利亚联邦政府担任高级职务，包括在澳大利亚国际农业研究中心任职。"
 King_Sitiveni_I_desc: "西蒂维尼·拉布卡现在被正式授予苏瓦王室国王西蒂维尼一世的头衔。领导成员和一些人认为可能是苏瓦家族的创始人。拉布卡因其政治和军事生涯而声名鹊起并留下了遗产，并以某种方式参与了该国几乎每一次政变。稳定、秩序、和平……这三大支柱是拉布卡努力保持的，通过这条新道路，许多人想知道他是否能够创造真正的遗产。"
 King_Sitiveni_II_desc: "乔吉·孔罗特现已正式被授予苏瓦王室国王西蒂维尼二世 的称号。这位前少将和政治家是在政变后时代的第一个选举周期中由人民选出的。西蒂维尼这个名字是王室议会的一个象征。其象征是一位主要成员和一些人认为可能是苏瓦家族的创始人西蒂维尼·拉布卡。随着命名惯例被设定为先例，许多人想知道以下领导者是否会选择这个符号，或者可能在数字游戏中提出自己的主张。"
 fiji_focus: "斐济国策树"
 fiji_research_institute_of_fiji_desc: "斐济研究所是我们国家身份的巅峰。通过适度覆盖投资，推动各领域的研究和创新，我们将能够提升国家声誉，并吸引外国科学界的关注。这样一来，它将使我们的国家更快地接触到科技，并为那些可能想参与我们游戏的人提供应对之策。"
 FIJ_focus_the_1999_general_election: "1999年大选"
 FIJ_focus_the_1999_general_election_desc: "1999年斐济举行大选，组建了新政府，斐济工党在议会中获得多数席位。主要反对派斐济政党将获得第二名。工党被认为是中左翼，而斐济政党被认为是中右翼。然而排在第三位的是斐济协会党。具有讽刺意味的是，斐济政党的一个分裂团体以斐济族为主，被认为更正确，但领导层的变化将导致该党众所周知的软化，因为他们将与斐济工党建立选举联盟。"
 FIJ_focus_assessing_the_national_situation: "评估国家形势"
 FIJ_focus_assessing_the_national_situation_desc: "尽管新一届选举充满希望，但我们必须先理清思路，弄清楚我们需要寻求和解决的问题是什么。我们这个美丽国家独立以来，一直饱受政治斗争和政变的困扰……因此，我们必须抓紧时间，以免重蹈覆辙，再次陷入同样的​​泥潭。"
 FIJ_focus_increased_security: "加强苏瓦执法力度"
 FIJ_focus_increased_security_desc: "首都局势动荡不安，我们担心可能会发生更多种族暴力事件，因为最近印度裔斐济人当选为多数派政府，这增加了该地区发生种族暴力事件的可能性。"
 FIJ_focus_the_2000_debacle: "2000年的崩溃"
 FIJ_focus_the_2000_debacle_desc: "世纪之交，斐济岛遭遇民族主义政变。这场未遂政变最终被军方的反政变镇压，但从那时起，人们对文官政府的信心一直处于历史最低点。现在，现任执政党甚至反对党都必须看看能否为斐济人民重拾希望。"
 FIJ_focus_isolated_terror_attacks: "民族主义者的攻击"
 FIJ_focus_isolated_terror_attacks_desc: "尽管斯佩特被捕，叛乱分子的暴力活动仍在继续。7月31日，斯佩特的支持者对德雷凯蒂村实施恐怖袭击，劫持了30名人质。在苏库奈瓦鲁兵营发生叛变的士兵六周后都没有投降。8月8日，叛乱分子伏击了一支军事巡逻队，造成一名士兵和一名警察死亡，另外还有三人受伤。"
 FIJ_focus_military_disunity: "兵变危机"
 FIJ_focus_military_disunity_desc: "2000年11月2日，忠于斯佩特的反革命战争部队的士兵在伊丽莎白女王军营叛乱中发生叛变，将军官扣为人质，试图罢黜军事指挥官弗兰克·姆拜尼马拉马。军队夺回军营时，两名士兵被杀，十人受伤。事后，四名叛乱分子被忠诚的士兵折磨并杀害。"
 FIJ_focus_political_legitimacy: "巩固合法性"
 FIJ_focus_political_legitimacy_desc: "11月15日，斐济高等法院宣布临时政府非法。马拉仍然是合法总统；议会并未解散，只是暂停，现在应该重新召开；暗示乔杜里仍然是合法总理。马拉随后正式辞职，辞职日期可追溯到5月29日。"
 FIJ_focus_political_stagnation: "政治僵局"
 FIJ_focus_political_stagnation_desc: "在1997年宪法恢复以及随后的1999年民选政府成立之后，国家奇怪地陷入了僵局。政府被扣为人质、恐吓辞职等等，现在突然恢复了所谓的正常状态。虽然国家很安心，但主要政府部长和成员却并非如此，但一些人怀疑他们是否能在这样的后果中真正保住权力。"
 FIJ_focus_political_challenge: "恩加拉塞的挑战"
 FIJ_focus_political_challenge_desc: "恩加拉塞政府对高等法院的裁决提出上诉。2001年3月1日，斐济上诉法院确认了高等法院恢复宪法的决定。政府将接受这一裁决，并希望为即将到来的2001年选举重新开始竞选活动。"
 FIJ_focus_2001_elections: "2001年斐济大选"
 FIJ_focus_2001_elections_desc: "为了重新开始，决定举行新的选举，选举定于2001年8月和9月举行。由于1999年当选政府（多数党斐济工党）与政变后由莱塞尼亚·卡拉塞领导的政府（主要反对党成员）之间存在分歧，此次选举气氛紧张。卡拉塞在2000年政变期间宣誓就任总理，并组建了联合斐济党。该党吸收了斐济协会党的大部分残余势力、基督教民主联盟的大部分成员以及其他保守派团体，形成了一个保守派大联盟。最终，联合斐济党在选举中赢得多数席位，为政变后国家的整体治理奠定了基础。"
 FIJ_focus_post_coup_cleanup: "政变后的清理"
 FIJ_focus_post_coup_cleanup_desc: "事后，苏瓦首都地区遭受了大量财产损失，一片狼藉。如果我们要从头开始并努力实现我们的目标，我们就必须投资于迅速清理问题。"
 FIJ_focus_early_community_programs: "早期社区计划"
 FIJ_focus_early_community_programs_desc: "我们必须重建人民共同努力的意愿，我们都是斐济公民，因此我们必须愿意彼此共处。为了表明政变不是现实，我们将创建团结计划。这些将表明城镇和社区应该团结起来，而不是相互分裂。"
 FIJ_focus_head_start_cooperatives: "领先合作项目"
 FIJ_focus_head_start_cooperatives_desc: "老一辈人之间互相敌视，重整旗鼓的重任就落在了年轻一代的肩上。为此，我们必须从小在学校教育中培养家庭团结的意识，让孩子们明白，无论你是斐济人还是印度裔斐济人，我们都应该携手共创美好未来。"
 FIJ_focus_softer_situational_training_programs: "软化紧张局势训练项目"
 FIJ_focus_softer_situational_training_programs_desc: "鉴于族群间紧张局势加剧，我们必须推行警务改革。为避免因执法不力而引发反弹，这项改革实际上是一项针对执法人员的全新培训计划。该计划旨在培训警员如何处理族群间的民事纠纷，避免偏袒任何一方。"
 FIJ_focus_service_guarantee_citizenship: "服役保证公民权"
 FIJ_focus_service_guarantee_citizenship_desc: "我们必须创造一种民族自豪感，因为我们可以利用军队，或许可以帮助引进新的民族，使我们的岛屿更加多样化，而不仅仅是斐济人和印裔斐济人。为此，我们将在军队内创建一项为公民服务的计划。一点额外的资金和更好的个人占据军事领导地位的东西应该对我们在政变后的世界中的整体有所帮助。所以请记住，他们正在尽自己的一份力量，你呢？今天加入斐济共和国军队！"
 FIJ_focus_the_universal_retirement_program: "全民退休计划"
 FIJ_focus_the_universal_retirement_program_desc: "全民退休计划将是一项政府设立的综合性退休基金，发放给所有已达到退休年龄并申请退休或其他相关社会福利的公民。我们希望提高并平衡所有公民的福利底线，造福整个国家。"
 FIJ_focus_the_national_care_initiative: "国家关怀计划"
 FIJ_focus_the_national_care_initiative_desc: "国家关怀计划将成为我们医疗保健系统的起点。所有公民都可以免费获得与日常事故相关的基本治疗。我们希望所给予的照顾能够向构成我们国家的公民表明他们正在受到照顾，并且他们将为我们提供真正的机会，让我们有真正的机会做一些实际的事情来改善我们所知道的生活。"
 FIJ_focus_soup_kitchens_act: "公共施膳处法案"
 FIJ_focus_soup_kitchens_act_desc: "随着无家可归者的增加、种族紧张局势和人们逃离该岛，我们必须寻求根本性的解决方案。一项政府计划建立了战略施粥所，以帮助所有无家可归或处于正常状态的人，这将使人们团结在一起。这虽然没有我们希望的那么多，但它是全国范围内真正慈善活动的基础。"
 FIJ_focus_police_fairness_act: "警察公平法案"
 FIJ_focus_police_fairness_act_desc: "鉴于形势已定，国家安全和人民福祉成为关注焦点，我们的执法部门必须得到更有效的运作，不能被视为游手好闲的流浪汉。警务组织和部署制度将重新评估，力求更加公平地兼顾高犯罪率地区和被当地居民忽视的地区。"
 FIJ_focus_fijian_corps_of_engineers: "斐济工程兵团"
 FIJ_focus_fijian_corps_of_engineers_desc: "斐济共和国军事部队下属斐济工程兵团分支机构的建立将是军队在和平时期帮助国内发展的一项直接举措。这可能意味着翻新现有的军事基础设施，但也可以用于支持水利、公路、铁路和其他使我们国家运转的基础设施等公共工程的民用建设项目。"
 FIJ_focus_early_education_standards_act: "早期教育标准法案"
 FIJ_focus_early_education_standards_act_desc: "早期教育标准法案是一项预算立法，将为早期教育水平分配资金。这笔资金将用于支付教师工资、新教科书以及标准化教室每个核心科目所需的材料和设备。这笔资金将平均分配给每一所小学类型的学校，希望新一代能够对进入中学时感受到更温和的挑战有更深入的了解。这应该为未来的资金开始增加并全面提高整个国家的教育水平奠定基础。"
 FIJ_focus_targeted_medical_imports: "有针对性的医疗进口"
 FIJ_focus_targeted_medical_imports_desc: "我们将通过专项资金，制定一份医疗设备、所需药品和基本用品的优先清单，建立基本库存，以确保我们的医疗基础设施能够尽可能高效地运转。这将开启一个鼓励尽可能发展国内医疗产业的进程，从而避免我们受制于全球供应链。"
 FIJ_focus_fiji_food_securities_program: "斐济食品安全计划"
 FIJ_focus_fiji_food_securities_program_desc: "斐济食品安全计划是一个类似食品银行的计划，受影响最严重的公民可以申请领取上述福利，并能够在几个月内购买家庭生存所需的食物。这应该会提高下限，并有助于缓解贫困线和该国不断面临的日益严重的移民问题。"
 FIJ_focus_domestic_savings_initiative: "国内储蓄计划"
 FIJ_focus_domestic_savings_initiative_desc: "国内储蓄计划将是一个专门的项目，旨在为政府提供一笔类似战争基金的资金。这笔资金仅在经济危机时期或用于开展专项和有针对性的项目，以缓解地方当局无法解决的棘手问题。这些措施将使斐济看起来管理得更好，更具吸引力，因为我们目前的状况并非完全令人满意。然而，我们必将战胜困难，以独立三十多年来前所未有的活力迈入新千年。"
 FIJ_focus_fijian_economic_diversity_initiative: "斐济经济多元化倡议"
 FIJ_focus_fijian_economic_diversity_initiative_desc: "斐济经济多元化倡议是一项总体概念计划，旨在未来二十年内，使斐济在力所能及的范围内尽早实现一定程度的自给自足。坦白说，我们对自身拥有的资源知之甚少，但由于种族矛盾、人口外流以及军方和民众对政府机构的不满，我们面临诸多问题，难以全身心投入到这项事业中。尽管如此，我们仍然希望在未来二十年内实现这一目标，但能否坚持下去并最终实现这些目标，取决于人民的努力。"
 FIJ_focus_rebuild_suva_initiative: "重建苏瓦倡议"
 FIJ_focus_rebuild_suva_initiative_desc: "重建苏瓦倡议是一项双方商定的经济援助计划，旨在向苏瓦公民提供经济援助，苏瓦居民在长达三个月的政变动荡中遭受了最严重的打击。大规模抢劫和骚乱造成大量财产损失和民生被毁，我们必须帮助他们重新站起来。"
 FIJ_focus_early_business_management: "早期商业管理项目"
 FIJ_focus_early_business_management_desc: "早期商业管理项目是一项政府倡议，旨在鼓励我们国家的下一代商业人才。这些将是专门的课程和与工作相关的实习生培训，以了解如何管理、运营和了解成为企业主的真正含义。我们希望随着新贷款的发放以及新商品和服务的生产和销售，推动我们的经济发展。"
 FIJ_focus_startup_investment_program: "创业投资计划"
 FIJ_focus_startup_investment_program_desc: "创业投资计划将是针对新企业主及其梦想的专门企业融资贷款计划。虽然这样的冒险可能会滋生不良贷款，但我们将寻求利用国家预算的专门部分来允许独立的行为方式。因此，如果投资企业确实失败，纳税人不会承担任何额外费用。"
 FIJ_focus_start_mining_survey_program: "启动采矿调查计划"
 FIJ_focus_start_mining_survey_program_desc: "我们将开始多项调查计划，以便能够确定我们拥有哪些资源，以及在实施有限的自给自足计划方面我们的真正立场。"
 FIJ_focus_importing_mining_equipment: "进口采矿设备"
 FIJ_focus_importing_mining_equipment_desc: "通过最近的采矿调查，我们建议我们需要支持此类新的努力。考虑到这一点，我们将为采矿工人制定一份重要采矿设备、材料和所需装备的优先清单。这些人是我们国家整体经济多元化的核心。"
 FIJ_focus_increased_core_industries: "增强核心产业"
 FIJ_focus_increased_core_industries_desc: "展望未来，我们国家在20年规划中的重点是投资发展国民经济支柱产业。林业和船舶业一直是我们重点关注的领域，但我们也特别关注与水泥相关的采矿业。"
 FIJ_focus_solidifying_precious_metals: "开采贵金属"
 FIJ_focus_solidifying_precious_metals_desc: "黄金和白银的开采和出口是我们出口的重要组成部分。扩大这些子行业将大大改善我们的贸易逆差率。而扩大这些子行业将促进贸易收入的增长，从而使我们能够增加进口。一个增长循环已经开启。"
 FIJ_focus_establishing_fijian_manufacturing: "建立斐济制造业"
 FIJ_focus_establishing_fijian_manufacturing_desc: "建立强大的制造基地意味着我们有能力实现经济组合多元化。现在，当我们进口东西时，我们可以使用这个基线来多样化所述进口的用途，并从我们的出口中获得更好的收益。"
 FIJ_focus_economic_relief_fund: "经济救助基金"
 FIJ_focus_economic_relief_fund_desc: "经济救助基金是一项既定的安全保障机制。当国家陷入困境或经济状况恶化导致某个行业突然崩溃或濒临崩溃时，受影响行业的企业可以申请有组织的救助。这些救助计划将在经济复苏基金的预算范围内进行协商和实施。我们希望借助这笔资金，在任何外部因素对我国经济造成冲击时，都能力挽狂澜。"
 FIJ_focus_balanced_trading_budget: "平衡的交易预算"
 FIJ_focus_balanced_trading_budget_desc: "随着国家从伪农业和非工业化经济进入多元化和繁荣的新时代，我们必须不断检查我们的进口是否超过了我们希望出口的速度。因此，我们几乎每季度甚至半季度都会研究一些实际预算平衡，在适当的时候我们将微调我们的经济，提高经济的效率和整体效益。"
 FIJ_focus_early_adoption_tech_sector_investments: "早期引入科技行业投资"
 FIJ_focus_early_adoption_tech_sector_investments_desc: "随着所谓互联网的兴起成为热门话题和趋势，全球市场似乎都在关注这一点，我们有责任做出同样的回应。因此，我们将微调我们的工业制造和出口，以纳入科技行业似乎产生的这些新产品和服务。"
 FIJ_focus_the_motorway_improvement_act: "高速公路改善法案"
 FIJ_focus_the_motorway_improvement_act_desc: "议会通过了一项法案，为国家主要道路的专门更新项目提供资金。该法案被视为随着我们的经济增长和发展，更好地适应不断增长的货运量并增加新的潜在企业和行业的准入的一种方式。虽然一些人拒绝增加支出，但另一些人则希望这是我们国家未来的又一块垫脚石。"
 FIJ_focus_the_new_millennia_tax_reform_act: "政变后税收改革法案"
 FIJ_focus_the_new_millennia_tax_reform_act_desc: "议会最近通过了政变后税收改革法案，该法案改革了企业和广大民众的税收征收方式，希望对贫困人口和斐济族人口更加公平，斐济族人口似乎占我们贫困人口的很大一部分。"
 FIJ_focus_domestic_energy_initiative: "国内能源倡议"
 FIJ_focus_domestic_energy_initiative_desc: "国内能源倡议是一项研究、调查和规划的计划。我们的岛屿相对较小，因此我们必须在能源生产方面寻求最大效益。考虑到这一点，我们已经找到了可以收获的良好国内石油来源，这样做我们还将整合早期形式的石化工业，作为资源开采的扩张和直接联系。这对于未来的规划应该会产生奇迹。"
 FIJ_focus_domestic_resource_diversity: "国内资源多元化计划"
 FIJ_focus_domestic_resource_diversity_desc: "议会制定了国内资源多元化计划，这是一项政府举措，旨在扩大我们的国内资源和开采量，并尽可能使其多样化。在我们美丽的岛屿独立的大部分时间里，我们以黄金和白银而闻名，但最近的调查和技术进步发现了规模相当大的关键资源矿藏，如铁、铜甚至石油。我们希望未来能够充分利用这些资源开采领域的初创企业。"
 FIJ_focus_the_2006_general_election: "2006年大选"
 FIJ_focus_the_2006_general_election_desc: "斐济于2006年5月6日至13日举行大选中莱塞尼亚·恩拉塞总理领导的现任斐济联合党政府将与马亨德拉·乔杜里领导的主要反对派斐济工党以及其他几个小党派对决。"
 FIJ_focus_subtle_ethnic_illusions: "微妙的民族幻想"
 FIJ_focus_subtle_ethnic_illusions_desc: "随着我们连任的确定和权力格局的变化对我们有利，我们必须寻求巩固我们人民在岛上的霸权。尽管这会遭到公开反对甚至敌意，但我们将采取更加微妙的方法，以实现真正的变革。"
 FIJ_focus_drafting_the_reconciliation_bill: "起草和解法案"
 FIJ_focus_drafting_the_reconciliation_bill_desc: "和解法案是一项向斐济族人民做出一些小让步的法案，因此我们的要点之一是回顾2000年的政变，通过对政变参与者和被监禁的成员进行特赦来开启新的一页 。我们希望这能让公众有一个公平、更真实的认识，即我们都会犯错误，因此不应仅由他们自己来定义。"
 FIJ_focus_assessing_the_farmland_leases: "评估农田租赁"
 FIJ_focus_assessing_the_farmland_leases_desc: "殖民统治时期，以租借农田作为对原殖民糖业公司损失的补偿，这种做法早已过时。我们固守旧习，延续这种做法，因此我们将着手起草相关法律，以妥善处理此类问题。"
 FIJ_focus_labour_party: "斐济工党赢得政变后的改组"
 FIJ_focus_labour_party_desc: "由于害怕遭到报复，以及担心军方会采取合法行动发动政变，斐济联合党已经屈服于军方的所有要求。因此，提前举行了选举，斐济工党赢得了多数席位。有了军方间接的支持，再加上某种程度上的“清零”，我们就可以着手真正地改变现状，让一切变得更好。"
 FIJ_focus_turning_down_the_heat: "降低热度"
 FIJ_focus_turning_down_the_heat_desc: "随着新政府的掌权以及与军方达成的共识，我们现在可以进行全新的合作。在2006年惨败中达到顶峰的种族紧张局势现在已经趋于平静，我们可以开始更好地融合我们的社区。尽管随着时间的推移，我们的人数减少，但我们可以为该岛的新和平时代奠定基础。"
 FIJ_focus_simmering_national_fears: "酝酿中的民族恐惧"
 FIJ_focus_simmering_national_fears_desc: "许多人仍在成群结队地逃离这个国家，我们必须采取行动。通过调整医疗保健和福利项目的预算，我们可以鼓励新一代人不要逃离，让他们看到我们始终与他们同在，从而给予他们希望。"
 FIJ_focus_setting_to_boil_new_economic_plans: "制定新的经济计划"
 FIJ_focus_setting_to_boil_new_economic_plans_desc: "经济要么停滞不前，要么增长速度慢得几乎看不出任何活力，仿佛全球市场哪怕出现一丝动静都难以察觉。因此，我们必须加大经济刺激力度，着眼于构建互联互通和经济稳定，这可以算是一种“我们共同的计划”。"
 FIJ_focus_a_path_of_healing: "治愈之路"
 FIJ_focus_a_path_of_healing_desc: "随着风暴的过去，我们的想法被收集起来并组织起来，我们现在将关注国内局势，这可能会消耗政府的大部分时间。"
 FIJ_focus_foreign_outreach: "对外推广"
 FIJ_focus_foreign_outreach_desc: "随着我们国家的不稳定在外国势力眼中变得更加稳定，我们可以寻求收益和投资，看看我们可以在这个世界上找到自己的位置。"
 FIJ_focus_farmers_investment_division: "农民投资处"
 FIJ_focus_farmers_investment_division_desc: "农民似乎在这个美丽的岛上引起了很多骚动。所以我们必须在政府内部设立一个均衡的农民投资和农业部门，能够照顾到所有的需求，农民就是农民，他们都需要帮助。"
 FIJ_focus_fijian_redevelopment_fund_phase_one: "斐济重建基金第一期"
 FIJ_focus_fijian_redevelopment_fund_phase_one_desc: "斐济重建基金是一项长期的政府举措，旨在通过经济发展的重点来解决多个问题。这些计划将是全面的，并以尽可能最好的方式实施，以确保在我们并不陌生的紧张时期确保国家稳定。"
 FIJ_focus_ministry_of_scientific_development: "科学发展部"
 FIJ_focus_ministry_of_scientific_development_desc: "科学发展部将成为政府的一个专门部门，凭借这种奉献精神，其主要目标将是寻找国家的聪明才智和潜在的未来思想，不仅能够研究和开发新技术，而且能够研究和开发如何提高人民的教育。"
 FIJ_focus_reforming_trade_initiatives: "改革贸易举措"
 FIJ_focus_reforming_trade_initiatives_desc: "我们的岛屿拥有许多未开发的资源，因为我们必须实现经济多元化，我们必须能够出口和进口。重新谈判贸易条款并寻求出售给最高潜在出价者将使我们能够引入更多资金来改善我们的未来计划。"
 FIJ_focus_pulling_in_foreign_scientist: "吸引外国科学家"
 FIJ_focus_pulling_in_foreign_scientist_desc: "我们最优秀的人才正在流失，我们必须立即阻止这种情况。如果我们能说服外国科学家在这里建立研究机构和基地，这不仅有助于国家发展，还能阻止他们离开。"
 FIJ_focus_overhauling_the_tax_code: "改革税法"
 FIJ_focus_overhauling_the_tax_code_desc: "联邦税法是一团糟，几十年来的政变、政府更迭以及亲民族斐济人和亲印度斐济人的反复，使我们的税法变得一团糟，效率极低。我们必须从头开始，毫不留情地提及有关种族的任何事情。税法是为了国家的货币稳定，而不是为了在我们的公民中挑选最喜欢的。"
 FIJ_focus_domestic_iron_development: "国内钢铁发展"
 FIJ_focus_domestic_iron_development_desc: "随着地质测量技术的最新进步，我们已经能够发现铁矿床，我们可以将其用于国内和出口到其他国家。这种供应应该让我们有较小的回旋余地，以帮助国内开发项目。"
 FIJ_focus_expanding_upon_domestic_energy_sources: "扩大国内能源来源"
 FIJ_focus_expanding_upon_domestic_energy_sources_desc: "我们的岛屿虽然很小，但却充满了许多不同的自然资源。正是这些资源不仅使我们能够确保国内局势，而且使我们能够看到我们所居住的地区房屋。"
 FIJ_focus_human_resources_fund: "人力资源基金"
 FIJ_focus_human_resources_fund_desc: "随着我们经济的发展，我们至少还必须有人在其中工作。因此，我们必须设法将逃亡国外的公民带回家，我们还必须设法引进那些寻求机会的人，并给予足够的激励，我们可以向他们展示真正的机会。"
 FIJ_focus_pacific_exchange_and_investment_society: "太平洋投资交流协会"
 FIJ_focus_pacific_exchange_and_investment_society_desc: "他们说鱼与熊掌不可兼得，但PIES呢？这个社团将成为我们在太平洋地区拓展人脉、增强自身实力、对抗规模远超我们的竞争对手的绝佳平台。"
 FIJ_focus_phase_two_development_fund: "斐济发展基金第二期"
 FIJ_focus_phase_two_development_fund_desc: "由于其他重点的混合，第一阶段有点混乱，但我们必须进一步制定真正的计划。该计划旨在吸引外国投资，优先考虑国内增长，平衡我国的进出口，以保持强劲的经济和外交独立性。"
 FIJ_focus_security_through_community: "通过社区实现安全"
 FIJ_focus_security_through_community_desc: "僵化的体制使警务工作捉襟见肘，而我们的新体制则允许更多社区参与。这些项目将组织当地居民更加协调一致，赋予民众公民逮捕权，并通过社区参与扩大地方警务部门的规模。"
 FIJ_focus_the_care_balance_act: "平衡关怀法案"
 FIJ_focus_the_care_balance_act_desc: "平衡关怀法案这是一项通过该国的医疗保健和社会保健机构，并试图平衡和彻底改变房间里的麻烦的法案。"
 FIJ_focus_the_military_reform_bill: "军事改革法案"
 FIJ_focus_the_military_reform_bill_desc: "M253号议会法案是一项谈判法案，旨在通过军事去政治化来增加军费，从而支持更多国内训练项目。此外，该法案还将提高那些为保卫国家和人民而冒着生命危险的男女军人的薪酬。这只是一个开始，但就军事投资而言，前景并不乐观。"
 FIJ_focus_foreign_construction_contracts: "国外建筑合同"
 FIJ_focus_foreign_construction_contracts_desc: "吸引外资必须从企业入手，而不仅仅是国家领导人。通过集中资源帮助国内承包商开展建设项目，我们可以引入新的理念、新的材料，以及一批能够在此定居的人口。"
 FIJ_focus_education_investment_package: "教育投资配套"
 FIJ_focus_education_investment_package_desc: "教育投资配套是通过专门增加教育和研发预算，以帮助我们获得与区域邻国的关系。从中我们可以寻找新的更高效的资源形式和生产方式。"
 FIJ_focus_foreign_medical_expos: "国外医疗博览会"
 FIJ_focus_foreign_medical_expos_desc: "与世界各地的医疗机构合作应该使我们能够真正投资于我们人民的健康和福祉、他们的精神和身体特征以及他们试图拥有的生活方式。"
 FIJ_focus_phase_three_development_funds: "斐济发展基金第三期"
 FIJ_focus_phase_three_development_funds_desc: "我们正走在通往伟大的路上。通过关注真正的问题并平息过去造成的分歧，我们使我们的国家走上了增长之路，而不是毁灭之路。我们必须加倍努力并继续这种治理方法，以确保我们国家的未来和现在的生活方式。"
 FIJ_focus_cohesive_integrations_act: "凝聚力整合法案"
 FIJ_focus_cohesive_integrations_act_desc: "了解我们的祖国后，我们必须努力了解我们的太平洋邻国。了解他们的文化、人民和社会使我们能够在未来更好地与这些人合作。"
 FIJ_focus_resource_securities_initiative: "资源保障计划"
 FIJ_focus_resource_securities_initiative_desc: "资源保障计划是一个专门的国家安全和外交机构，致力于为我们国家的发展寻求国内外资源，并为提供者谋取利益。"
 FIJ_focus_military_baseline_act: "军事基线法案"
 FIJ_focus_military_baseline_act_desc: "通过我们的繁荣目标以及对自己和他人的投资，一个明显的现实变得越来越明显。因此，我们必须为我们的武装部队建立基线准备状态，这样我们就可以让我们的国家及其伙伴感受到我们小人物应从大国那里得到的安全和保障。"
 FIJ_focus_independence_sustainment_act: "独立维持法案"
 FIJ_focus_independence_sustainment_act_desc: "通过将我们的人民组织成地方部落，团结各个社区，不仅使他们成为自发形成的个体，也使他们成为斐济国家大家庭的一份子。我们力求营造一种不屈不挠、自决自强的氛围。面对中国以及许多其他更强大、更有野心的国家都在追求自身利益，我们必须在当前充满不确定性的时期保持警惕。"
 FIJ_focus_modern_industrialism_act: "现代工业主义法案"
 FIJ_focus_modern_industrialism_act_desc: "现代工业主义法案旨在更好地简化生产行业的布局方式，并更好地提高上述行业的整体效率。反过来，我们将提高我们的人民享受生活的标准。"
 FIJ_focus_food_of_tomorrow: "明天的食物"
 FIJ_focus_food_of_tomorrow_desc: "我们的岛屿很小，因此我们必须寻求以少求多。因此，我们将在总研发部门设立一个部门来保障我们人民的基本生活。"
 FIJ_focus_progressive_taxes_progressive_gains: "进步社会的累进税"
 FIJ_focus_progressive_taxes_progressive_gains_desc: "通过这次税收改革，我们寻求根据所产生的收入更好地平衡税收形式。通过税收水平的平衡，我们看到没有一个人能够大幅超越另一个人，仅仅是因为他们据说是靠自己的努力而崛起。现在我们可以利用这种新的收入平衡为每个人提供更好的生活方式，不仅投资于经济，而且投资于人民和整个国家。"
 FIJ_focus_united_fiji_installed: "军方设立斐济统联合党温和政府"
 FIJ_focus_united_fiji_installed_desc: "由于政府抵制军方的要求，弗兰克·姆拜尼马拉马准将发动了政变，并打算扶植一名联合斐济党的温和派上台。多数人认为这个新政府不过是军方安插的应声虫，但也有人抱有希望，认为这将缓解近来宪法危机所引发的如履薄冰般的立法反弹。"
 FIJ_focus_resetting_ethnic_legislations: "重置种族立法"
 FIJ_focus_resetting_ethnic_legislations_desc: "通过削减开支和缺乏更好的措辞，重新制定似乎已经动摇了种族平衡的法案和法律。我们可以让他们回到更加中立的位置，以便以更加冷静的态度来应对当前的情况。"
 FIJ_focus_slashing_biased_taxes: "削减有偏见的税收"
 FIJ_focus_slashing_biased_taxes_desc: "过去的政府一直反对我们岛屿的和平理念。主要问题之一是税法及其许多微妙的强调，这些强调有助于特定民族而不是其他民族，我们将开始削减这些。"
 FIJ_focus_jobs_initiative: "就业倡议"
 FIJ_focus_jobs_initiative_desc: "通过全面的政府支出计划，我们将投资于创造就业计划。这将有助于让任何人和每个人尽可能找到工作，并为我们的国家设定新的平等标准。"
 FIJ_focus_fijian_resource_development_program: "斐济资源开发计划"
 FIJ_focus_fijian_resource_development_program_desc: "斐济资源开发计划将引领资源开发和开采。 这样的计划将转变为政府部门，因此也将更多地被视为是为了国家的进步，而不是特定群体的进步。要点是，被发现拥有宝贵资源的土地现在将归政府所有，企业将在处理上述资源的开采和加工方面拥有共同所有权。该计划旨在通过发展繁荣来促进民族团结。"
 FIJ_focus_health_not_wealth_act: "健康而非财富法案"
 FIJ_focus_health_not_wealth_act_desc: "健康而非财富法案将改革一些关键的劳动法，使我们能够在普通人的环境中更好地平衡并创造更公平的竞争。通过制定新的工作场所标准并平衡和/或彻底废除旧的和已失效的法规，我们让我们的员工能够更聪明地工作、建设得更好、生活得更长久。"
 FIJ_focus_fiji_more_than_just_water: "斐济，不仅仅是水"
 FIJ_focus_fiji_more_than_just_water_desc: "我们的岛屿有一段可怕的历史，这段历史通过我们公平的国家在世界许多国家中的行动和目前的排名非常明显。了解这一点后，我们必须了解外国人对我们国家的看法，并寻求赢得民心。表明我们可以改变，我们的岛屿不仅仅是一个水上广告。"
 FIJ_focus_researching_new_trades: "研究新交易"
 FIJ_focus_researching_new_trades_desc: "通过对与贸易商品和服务相关的研发的慷慨投资。随着获得上述商品和服务，我们的国家将达到前所未有的新高度。"
 FIJ_focus_unity_through_service: "军队大熔炉"
 FIJ_focus_unity_through_service_desc: "军队一直是维持我们社会团结的最重要部分。最终，我们必须认识到，团结的力量才是推动这个国家前进的动力。因此，通过与军事领导人的一些全面谈判，我们提出了一项全面的计划，以更好地投资于军队及其人员，并允许民事和军事当局更好地分离。我们无法再承受2000年那样的政变。"
 FIJ_focus_peace_for_piece: "和平为一"
 FIJ_focus_peace_for_piece_desc: "通过国内的和平，我们在国外取得了一些成就。现在，我们的岛屿出现了多年来未见的稳定水平，许多国家现在更愿意与我们进行贸易、度假和工作。这将使我们能够更好地预见未来并在该地区宣示我们的主张。"
 FIJ_focus_low_income_work_houses: "低收入工作住房"
 FIJ_focus_low_income_work_houses_desc: "政府创建了低收入住房。这是一个专门的项目，可以帮助我们让人们离开街道，进入家庭和工作岗位。虽然成本会有点高，但为了确保安全、保障和繁荣，我们应该了解不做这样的事情的真正成本。"
 FIJ_focus_funding_a_new_sector: "资助新部门"
 FIJ_focus_funding_a_new_sector_desc: "通过新的地质调查，我们已经能够确定适合低品位铁矿石开采作业的相当大的区域。拥有这种国内供应将促进我们的经济多元化，并在可能的情况下寻求带回更多机会。"
 FIJ_focus_finding_homes_abroad: "在海外寻找家园"
 FIJ_focus_finding_homes_abroad_desc: "我们的一些无家可归者出人意料地过于彬彬有礼，并且拥有可以用于国家利益的社交技能。因此，我们将吸纳并雇用这些社会中受重视的、技术精湛的成员，并扩大驻外办事处。利用他们所经历的困难时期作为兴趣点，他们应该能够更好地吸引国外的普通民众。现在向世界展示斐济梦的理念。"
 FIJ_focus_evaluating_military_requirements: "评估军事需求"
 FIJ_focus_evaluating_military_requirements_desc: "从技术上讲，军队不会以任何这样的方式对经济做出贡献。然而，无家可归的人也没有。因此，如果我们能够通过调整实际参军的标准和要求来人为地提高底线。然后我们就可以减少无家可归者，增强我们的国防，并提高我们的军队领导力和知识，因为我们将接触到更大的部队。最后每个人都有收获。"
 FIJ_focus_reorganizing_homeless_shelters: "重组无家可归者收容所"
 FIJ_focus_reorganizing_homeless_shelters_desc: "我们一些福利项目的现状着实令人震惊。我们必须重组这些机构的资金和结构，使其在能够有效应对的人数范围内更加高效运转。"
 FIJ_focus_naval_primacy_expected: "预期的海军主导地位"
 FIJ_focus_naval_primacy_expected_desc: "我们的国家是一个岛国，为了对我们的影响力地区产生真正的影响，我们必须真正投资于我们的海军。"
 FIJ_focus_synthetics_centric_research: "以合成材料为中心的研究"
 FIJ_focus_synthetics_centric_research_desc: "我们的岛屿拥有丰富的自然资源，但问题是，就全球而言，我们的自然资源严重不足。了解了这个关键问题，我们就能找到资源的未来。通过开创性的合成技术，我们可以建立我们自己的有限自给自足的形式，这是地球以前从未见过的。虽然是一个小脚注，但对我们来说，这仍然是我们国家的骄傲声明。"
 FIJ_focus_streamlining_tax_code_expansions: "简化税法扩展"
 FIJ_focus_streamlining_tax_code_expansions_desc: "议会法案T:101A 将简化流程以及可以向整个国家征收的税种。我们希望，通过制定一个众所周知的标准，将使我们的企业和人民能够以某种方式鼓励发展，这种方式虽然可以绕过这些税收，但也将间接增加征收的税收。"
 FIJ_focus_building_tall: "高层建筑法案"
 FIJ_focus_building_tall_desc: "鉴于我们国土面积有限，我们必须充分利用现有空间。基于此，我们寻求建立一种全新的、现代化的基础，以满足人民的需求。无论我们是否真正喜欢，自动化都是未来的发展趋势，但我们不能仅仅用自动化取代人类，而应该将人与机器融为一体。这将提升我们的生产能力，使我们的岛屿比大多数人想象的更加高效。"
 FIJ_focus_promoting_a_frugal_lifestyle: "提倡节俭的生活方式"
 FIJ_focus_promoting_a_frugal_lifestyle_desc: "我们的空间有限，在开发岛屿时我们的选择也很少。如果我们要保持所谓的游客岛屿目的地的氛围，我们就必须真正考虑保护我们土地的自然美景。因此，我们的人民必须懂得享受生活本来的样子，在他们拥有的东西中寻找美好的东西，而不是总是担心他们应该拥有什么。除了美国人的唯物主义之外，这不应该是斐济人的方式。"
 FIJ_focus_exploiting_corporatism: "利用社团主义"
 FIJ_focus_exploiting_corporatism_desc: "我们国家拥有众多本土和外资企业，它们为国家创造了可观的GDP。然而，人性使然，他们渴望权力和金钱。我们可以利用这一点，通过拉拢关系，表面上收受贿赂等等，实际上将这些资金用作某种形式的“战争基金”。用于资助那些在预算会议之外可能捉襟见肘的项目，在可能的经济衰退时期维持社会稳定，以及其他各种可能的用途。当然，他们迟早会识破我们的伎俩，但让我们趁现在还能享受这种优势的时候好好利用它吧。"
 FIJ_focus_neutral_selectivism: "中立选择性主义"
 FIJ_focus_neutral_selectivism_desc: "太平洋上的两大强国，美利坚合众国和中华人民共和国。这两个国家迟早会发生激烈的冲突，因此我们必须保持友好，但不能寻求任何好处。美国更有可能进行投资，但我们必须巧妙地利用这些投资，让中国更愿意超越我们。我们要扮演强者的角色，让他们间接地扶持弱者。"
 FIJ_focus_innovations_sector: "创新行业初创企业"
 FIJ_focus_innovations_sector_desc: "由于原材料并不丰富，我们必须开拓不同的市场，以适应不断变化的世界。我们的科技初创企业将为我们进入科技行业奠定基础，使我们能够向最高出价者出售有价值的软件和其他产品。"
 FIJ_focus_employment_commission: "就业委员会"
 FIJ_focus_employment_commission_desc: "第5436号法案，又称人人就业法案，是一项旨在设立就业部的立法。就业委员会将寻求政府资助的项目，直接为就业提供资金和支持，以确保失业者拥有真正的就业机会。初期成本较高，但随着时间的推移，新增税收和新企业带来的收入将抵消这些成本。"
 FIJ_focus_limited_fijian_naval_expansion: "斐济海军有限扩张"
 FIJ_focus_limited_fijian_naval_expansion_desc: "我们的贸易和水域必须得到保护。几艘鱼雷艇确实不足以保证真正的防御。我们必须真正扩大海军的有限防御态势，以确保我们岛屿的安全。人员和设备必须根据我们在国内外执行任务中了解到的知识进行标准化和改进。"
 FIJ_focus_education_budget_expansion: "教育预算扩张"
 FIJ_focus_education_budget_expansion_desc: "通过扩大教育预算，我们可以增进人民对周围更广阔世界的理解，并为世代相传带来新的机会。"
 FIJ_focus_balancing_budgets: "平衡预算"
 FIJ_focus_balancing_budgets_desc: "我们见证了国家的发展和繁荣，但也注意到预算方面存在一些问题。如果我们想成为真正的增长典范，就必须在预算方面保持灵活性，并明白我们可以在出现超支和短缺的地方进行平衡。"
 FIJ_focus_industrial_expansion: "工业扩张"
 FIJ_focus_industrial_expansion_desc: "我们的失业率创历史新低，最重要的是，我们的移民趋势也很低。我们必须赞助工业扩张，以延续我们国家历史上这一趋势的天意。"
 FIJ_focus_revitalization_of_foreign_perception: "外国观念的复兴"
 FIJ_focus_revitalization_of_foreign_perception_desc: "我们国家所取得的进步不仅为我们的人民，而且为我们周围的更广阔的世界树立了更好的形象。让我们真正享受这个古色古香的岛屿天堂的新时代。"
 FIJ_focus_extracting_the_future: "开采未来"
 FIJ_focus_extracting_the_future_desc: "地质测量和采矿新技术以及开采技术使我们能够扩大对我们可以真正挖掘的可用资源的了解。虽然有些人对扩大采矿业务并不感到兴奋，但这仍然是扩大和保持我们经济发展周期稳定的关键部分。"
 FIJ_focus_wealthcare_act: "财富关怀法案"
 FIJ_focus_wealthcare_act_desc: "随着我国财富的快速增长，我们的人民理应享有与人口规模几乎是我们100倍的国家同等的医疗和退休福利。通过对设备和人员进行一些投资和采购，我们将实现我国近几十年来一直努力追求的医疗服务。"
 FIJ_focus_military_radicals_force_a_junta: "军事激进派组建军政府"
 FIJ_focus_military_radicals_force_a_junta_desc: "由于巨大的内部压力，准将被迫组建军政府。不幸的消息传来，全国陷入骚乱，但民族主义者团结起来，与军队一起建立秩序。"
 FIJ_focus_martial_law_window: "戒严计时器"
 FIJ_focus_martial_law_window_desc: "我们将恢复这片土地的秩序，在评估我们的局势时，我们还将致力于国家的稳定。由于移民问题日益恶化，这项戒严令将在一段时间内禁止进出外国。很多人不喜欢这样，但我们必须忍受。"
 FIJ_focus_merging_police_forces: "合并警察部队"
 FIJ_focus_merging_police_forces_desc: "宪兵和民警的区别是资源浪费和双重指挥。因此，我们将整合这两种力量，将它们置于类似军事的结构之下，并确保在混乱和无法无天的时期保护我们的国家和人民的统一目标。"
 FIJ_focus_militarized_politics: "军事化政治"
 FIJ_focus_militarized_politics_desc: "政府结构是一个很好的组织，通过对设备进行一些微调和军事化，我们真的可以像一台运转良好的机器一样扭转这个国家。毕竟，议会只不过是平民版的总参谋部会议和/或计划室。"
 FIJ_focus_weathering_the_political_storm: "经受住政治风暴"
 FIJ_focus_weathering_the_political_storm_desc: "虽然我们尚未完全脱离险境，但我们必须放松过度管控。由于我们作为军政府所体现的威权主义，世界已经对我们深恶痛绝。因此，我们将解除旅行禁令和戒严令，同时通过政变混乱后的首个正式改革法案 - 有限医疗法案。该法案将降低医疗成本，并减少目前困扰我们医疗领域的过度支出，希望这一举措能够引起各方的积极关注。"
 FIJ_focus_transparency_in_requirements: "透明度要求法案"
 FIJ_focus_transparency_in_requirements_desc: "透明度要求法案对民事和军事法律的制定和要求进行了全面改革，提高了透明度。这也影响到诸如人们如何在民事社会中获得工作机会，以及在军事社会中如何晋升和承担责任等方面的要求透明度。"
 FIJ_focus_fijian_service_means_fijian_respect: "斐济服役，斐济尊重"
 FIJ_focus_fijian_service_means_fijian_respect_desc: "更新和直接传达行为准则将有助于减少旧怨。通过加大惩罚力度，不仅在纸面上，更要在实践中表明，为斐济服务的人就是斐济的一份子。通过培养这种以家庭为基础的纽带，我们希望团结人民，摒弃旧世界的影响。"
 FIJ_focus_constitutional_safeguard: "宪法保障"
 FIJ_focus_constitutional_safeguard_desc: "我们的人民不信任这个制度，据说我们必须让他们信任这个制度。因此，我们将通过一项修正案，规定斐济公民作为一个整体受到不公正待遇，无论种族出身如何，均构成国家犯罪。我们希望通过这项法令来弥合数十年导致这个国家四分五裂的冲突。"
 FIJ_focus_foreign_advisors: "外国顾问委员会"
 FIJ_focus_foreign_advisors_desc: "在世界似乎与我们作对的情况下，我们必须真诚地表明我们希望为我们的人民做正确的事，并为我们周围的人带来互惠互利。因此，通过成立一个广泛的民事和军事顾问委员会来帮助我们重建我们的国家，我们可以为我们美丽的岛国寻找新的增长领域。"
 FIJ_focus_building_upon_our_civilian_base: "建立在我们的平民基础上"
 FIJ_focus_building_upon_our_civilian_base_desc: "与我们的人口相比，经济规模很小，更不用说我们似乎因整体经济缺乏而面临许多问题。因此，这种旨在增加工业基础的定向投资将使我们能够让人们为国家、为国家的目标以及为彼此而工作。"
 FIJ_focus_starting_domestic_arms_companies: "创办国内军火公司"
 FIJ_focus_starting_domestic_arms_companies_desc: "现在我想起来，斐济军队并不以……真的任何东西而闻名。我们必须改变这一点，因此最好的起点是在我国境内组建国内军火公司，并创建独特的斐济军事形象。我们可能永远无法与美国、德国等国家相比，但我们肯定可以在我们所居住的地区广为人知。"
 FIJ_focus_bringing_jobs_back_to_fiji: "将人员和工作带回斐济"
 FIJ_focus_bringing_jobs_back_to_fiji_desc: "我们的人民仍然离开我们的国家，无论是为了求学、工作还是其他任何原因，我们仍然饱受人口外流之苦。因此，我们必须更加直接、精准地投资于导致这种人口外流的问题。"
 FIJ_focus_establishing_the_university_of_fiji: "创建斐济大学"
 FIJ_focus_establishing_the_university_of_fiji_desc: "教育……这个社会的基本支柱必须成为我们考虑国家和人民未来的主要关注点之一。该支柱具有民用和军事用途，反过来将得到最大程度的实施。"
 FIJ_focus_fijian_care_act: "斐济国家关怀法案"
 FIJ_focus_fijian_care_act_desc: "斐济国家关怀法案旨在重新投入到那些影响我们老年人口生活的项目中。与政治作秀中那些情绪化的言论相反，老年人造成的问题远比他们想象的要多。因此，如果我们能够让他们在退休后过上舒适的生活，从而让他们安心，我们就能更好地评估在职人口的需求。"
 FIJ_focus_increase_funding_for_the_fcoe: "增加对斐济工程兵团的资助"
 FIJ_focus_increase_funding_for_the_fcoe_desc: "我们军民混合的基石是斐济工程兵团。我们必须增加他们的资金以允许其分支的扩展，以便更好地军事和民用应用。"
 FIJ_focus_deboning_healthcare_excesses: "消除医疗保健过剩"
 FIJ_focus_deboning_healthcare_excesses_desc: "谁能想到，由于数十年的政治动荡和政府频繁更迭，一些项目缺乏监管和监督，导致腐败和资金浪费如此猖獗？我们的医疗保健系统亟需彻底重组，甚至可以说是重启。唯有如此，我们才能从零开始，弥补当前面临的种种变故，并正视国家正在经历的复苏之路。"
 FIJ_focus_national_rotc_curriculum: "国家后备军官训练队计划"
 FIJ_focus_national_rotc_curriculum_desc: "在美国等地，一些学校设有由军事部门运营的项目，该项目通过军事化的组织结构，向学生传授适用于平民世界的领导力课程。这正是我们未来教育体系的核心所在。从初中开始，所有学校都将采用这种模式，全国各年级的学生将被组织成所谓的“单元”。通过培养学生的社区意识、领导力和创新精神，我们致力于创造一个我们的青年能够真正理解并做好准备的未来。"
 FIJ_focus_barracks_housing_initiative: "军营住房倡议"
 FIJ_focus_barracks_housing_initiative_desc: "军营住房倡议将是解决该国住房短缺问题的新方法。无家可归者可以与其他具有类似性格的人一起居住在像住房单元一样的营房中。在这样的环境中，他们将能够通过就业计划和类似军事的例行公事重新站起来，以便将这种主动性重新灌输给那些认为体制已经把他们抛在后面的人。通过这种基本培训（如计划）的报价来增加收入，直到他们能够在计划之外找到工作并进入军营大楼外的家中。"
 FIJ_focus_resource_extractions_act: "资源开采法案"
 FIJ_focus_resource_extractions_act_desc: "资源开采法案将优先考虑那些无家可归者和/或在刑罚系统中的人寻求就业，以此作为谋生和通过发展国家做正确事的一种方式。通过这一行动，我们寻求了解和扩大我们在国内可以拥有的资源。"
 FIJ_focus_expand_the_fcoe: "扩大斐济工程兵团"
 FIJ_focus_expand_the_fcoe_desc: "随着新基建、住房和整个经济的需求不断增长，我们必须扩大桥梁的基石。这个基石就是斐济工程兵团。随着更多的资源和人力开始分配给军队的分支，这种扩张将带来更快、更全面的发展方法。"
 FIJ_focus_tax_rebalancing_act: "税收再平衡法案"
 FIJ_focus_tax_rebalancing_act_desc: "军事议会已经通过了税收再平衡法案，其中将对现行税法的总体概述进行单独审查，并允许我们修正对那些被赶出家门的人征收的迟钝税。"
 FIJ_focus_expanding_the_ministry_of_science: "扩大科学部"
 FIJ_focus_expanding_the_ministry_of_science_desc: "我们国家落后于世界，不仅因为我们的土地面积小，而且因为我们没有真正的创新。我们寻求外国帮助，例如成立外国顾问委员会。但仅此而已，我们将向世界展示我们可以取得一些进展，并以此为基础，我们将大力投资于我们的科学部以及我们国家研究和开发技术的整体能力。"
 FIJ_focus_soldiers_lifestyle_act: "士兵生活方式法案"
 FIJ_focus_soldiers_lifestyle_act_desc: "议会认为应该通过一项法令，为标准生活方式制定真正的底线。底线是我们武装部队中普通士兵的底线。这让全国和各代人对我们的人民确实享受到的东西建立了一种理解，而牺牲了一些人不能享受的东西。"
 FIJ_focus_the_citizen_soldiers_act: "公民士兵法案"
 FIJ_focus_the_citizen_soldiers_act_desc: "议会通过了公民士兵法案，这是一项宪法修正案，其中每个公民都是国家的士兵，每个士兵都是国家的公民。这项修正案本质上宣布那些为斐济服务的人本身就是斐济人，模棱两可地表明斐济人的想法不仅仅是某些人想要表达的一些基于伪科学的种族或民族垃圾。相反，斐济的理念或斐济人的意义在于对国家及其理念的奉献。"
 FIJ_focus_energizing_the_nation: "为国家注入活力"
 FIJ_focus_energizing_the_nation_desc: "为了适当平衡军事和民用需求，我们需要扩大我们的能源网络。拥有稳定的电网和燃料供应将证明未来的稳定性和远见。"
 FIJ_focus_naval_industrialism: "海军工业主义"
 FIJ_focus_naval_industrialism_desc: "我们是一个岛国，将军事生产重点放在海军舰艇上是理所当然的。如果我们最终只是一个徒有虚名的军事基地，又如何能吸引美国、澳大利亚等外国势力呢？"
 FIJ_focus_energy_diversity_act: "能源多元化法案"
 FIJ_focus_energy_diversity_act_desc: "能源多元化法案将要求我们能源网络的多样性，使我们的国家更能抵御外国剥削者。如果我们的国家受到任何形式的攻击，把我们所有的鸡蛋放在一个充满活力的篮子里就会立即陷入混乱。"
 FIJ_focus_mining_the_future: "挖掘未来"
 FIJ_focus_mining_the_future_desc: "我们知道我们拥有自己的资源，我们应该利用它们来改善我们的国家并防止外部干扰基本经济需求。"
 FIJ_focus_naval_priorities: "海军优先事项"
 FIJ_focus_naval_priorities_desc: "虽然我们寻求为我们的军队提供强有力和平衡的招募，但我们也知道我们实际上是一座岛屿。由于此类资金的增加将倾向于海军而不是其他部门，但不会太多，因为我们不需要不健康的军种间冲突。"
 FIJ_focus_civilian_air_training: "民用航空训练"
 FIJ_focus_civilian_air_training_desc: "所以……我们知道，我国空军的历史并不光彩。但我们不能让过去左右我们现在的处境，更不能让过去左右我们未来的发展。因此，我们将利用民用训练项目和飞机，逐步建立并发展我们的空军。这将是一个缓慢的过程，但如果我们想在这个现代社会生存下去，就必须这样做。"
 FIJ_focus_prussia_of_the_pacific: "太平洋普鲁士"
 FIJ_focus_prussia_of_the_pacific_desc: "我们的国家是普鲁士国家的现代体现。将民用和军事生活方式塑造并融合到一台有凝聚力的机器中，为斐济开创了一个新时代。我们虽小，但我们感到自豪，我们建筑高大，声音响亮，我们是一个地区大国，我们将像其他国家一样让我们的声音被听到。"
 FIJ_focus_monarchist_acendence: "君主制统治"
 FIJ_focus_monarchist_acendence_desc: "军队的内讧，把我们民族引向了正路。斐济的兄弟姐妹们，我们在上帝的带领下，在斐济的旗帜下团结一致。我们是自己命运的主人，民主已被证明太不稳定而难以维持。因此，我们必须妥协并创建一个新的社会，一个有民族主义、有军事实力的社会，一个斐济人不仅仅是种族问题的社会。"
 FIJ_focus_the_kingdoms_quarrels: "王国的纷争"
 FIJ_focus_the_kingdoms_quarrels_desc: "政治局势往好了说是脆弱的，往坏了说是荒唐地衰败。我们必须组建内阁，使政府正规化，并评估我们国家面临的最大问题。"
 FIJ_focus_the_kingdoms_economy: "王国的经济"
 FIJ_focus_the_kingdoms_economy_desc: "如果我们要在这个世界上取得任何成就，我们就需要拥有实体经济。多样性是要点，支撑点是为上述经济找到合适的人才。总的来说，如果我们想要到达任何地方，我们就需要货比三家。"
 FIJ_focus_the_ethnic_divides: "种族划分"
 FIJ_focus_the_ethnic_divides_desc: "斐济的民族分裂可以追溯到早期英国殖民统治时期。当时，许多来自印度的殖民地居民被贩运到斐济，在糖厂和糖业公司工作，为英国的国库带来巨额利润。自20世纪70年代斐济独立以来，这种分裂和强制移民问题一直非常紧张。因此，如果我们想要继续执政，解决这个问题应该是我们最重要的优先事项之一。"
 FIJ_focus_police_standards_act: "警察标准法案"
 FIJ_focus_police_standards_act_desc: "议会已通过一项法案，旨在重塑斐济警队的各项标准。所有行为准则都将进行修订和完善，强调无论情况如何，所有行动都必须根据具体情况进行公平评估。除非人身或财产安全受到威胁，否则不得对任何斐济平民或公民实施任何侵略行为。这些举措将有助于推动相关工作的顺利开展。"
 FIJ_focus_sponsored_emigration_deals: "赞助移民优惠"
 FIJ_focus_sponsored_emigration_deals_desc: "尽管短期内代价高昂，但从长远来看，我们将使国家更快实现稳定……即使是通过非正统手段。通过与印度人达成赞助移民协议，我们可以寻求缩小并间接使我们的国家同质化，并与那些真正想留下来的人合作。每个人都有价码，但每个人也都有选择。"
 FIJ_focus_hiring_practices_act: "雇佣实践法案"
 FIJ_focus_hiring_practices_act_desc: "一项法案获得通过，标准化了反歧视法律中的语言并重申了这一点。看来我们所做的一点点都存在相当多的漏洞，因此，建立公平的竞争环境将阻止对我们公平国家所有公民的剥削和歧视。"
 FIJ_focus_equal_standard_care_act: "平等标准护理法案"
 FIJ_focus_equal_standard_care_act_desc: "平等标准护理法案是一条法律底线，其中所有形式的护理，无论是医疗或福利相关的、公共的还是私人的，都必须具有相同的基本护理标准。我们必须确保，无论谁生病了，或者谁退休了，这个国家的公民都必须得到同等照顾，因此无论他们的种族是什么，他们都将享受这种照顾。"
 FIJ_focus_redrafting_the_constitution: "重新起草宪法"
 FIJ_focus_redrafting_the_constitution_desc: "宪法真正意义上的修订已经很久没有进行了。鉴于此，我们必须建立起治理国家的政府架构。我们必须奠定平等和社会自由的基础，让我们的国家以此为基石发展，否则我们将来可能会走向自我毁灭。"
 FIJ_focus_addressing_the_brain_drain: "解决人才流失问题"
 FIJ_focus_addressing_the_brain_drain_desc: "我们的国家仅仅就存在就付出了惨痛的代价。我们的人民逃离是为了寻求更好的机会和更好的生活方式。如果我们想要发展我们的国家，我们需要投资并关心我们的国家和人民。"
 FIJ_focus_establishing_the_reseach_and_development_ministry: "设立研发部"
 FIJ_focus_establishing_the_reseach_and_development_ministry_desc: "研究与发展部或简称研究部的创建和正规化将成为我们社会的基本支柱。为我们国家的教育和创新属性创造一个领导者使我们能够更好地组织、资助和创新。"
 FIJ_focus_employment_assistance_programs: "就业援助计划"
 FIJ_focus_employment_assistance_programs_desc: "我们国家的失业和对生活因糟糕的变化而停止的恐惧可能是导致人们离开的强大推动力。因此，我们必须制定一系列预防计划，暂时帮助公民过渡到新的工作岗位。比如为他们可能拖欠账单的月份提供小额津贴，或者帮助更快找到工作的就业委员会，这些最终可以平稳地过渡就业和失业，而不会给人们带来生活似乎停滞的感觉。"
 FIJ_focus_specializing_medical_research: "专业医学研究"
 FIJ_focus_specializing_medical_research_desc: "我们的人口不多，因此相比之下，这个国家的每个生命也更加宝贵。我们必须确保将研发的很大一部分用于整个医疗领域的尖端技术。是的，这需要花费一些钱，但我们必须为我们的人民提供最好的照顾，才能真正最大限度地发挥我们的人口潜力。"
 FIJ_focus_expanding_education_funding: "扩大教育经费"
 FIJ_focus_expanding_education_funding_desc: "扩大对国家教育系统的总体投资使我们能够培养新一代更聪明的公民。他们获得的知识将反过来用于发展我们的国家和我们的未来。"
 FIJ_focus_creating_the_research_institute_of_fiji: "创建斐济研究所"
 FIJ_focus_creating_the_research_institute_of_fiji_desc: "斐济研究所将成为太平洋地区科学发展的骄傲。我们的投入和对创新的执着追求将使我们的人民愿意留下来，不仅渴望改善自身，也渴望提升整个国家。我们还可以将其作为军事发展和国家力量投射的软实力形式。"
 FIJ_focus_reviewing_the_housing_crisis: "回顾住房危机"
 FIJ_focus_reviewing_the_housing_crisis_desc: "在发达的西方世界，住房危机通常指的是资产市场崩盘。但在我们这里，住房危机源于日益严重的无家可归问题。尽管人口数量较少，我们的无家可归问题却堪比一些非洲国家。认识到这一令人担忧的现实，将有助于我们果断地解决这一日益严峻的困境，并最终或许能够防止此类危机再次发生……或者至少避免再次以如此大规模地爆发。"
 FIJ_focus_increased_homeless_shelter_funding: "增加无家可归者收容所资金"
 FIJ_focus_increased_homeless_shelter_funding_desc: "我们目前的无家可归者计划没有收到足够的资金来妥善照顾有需要的人。通过对增加资金的直接投资，我们可以更好地确保这些公民在需要时获得的护理质量，直到他们重新站起来。"
 FIJ_focus_royal_engineers_program: "皇家工程师计划"
 FIJ_focus_royal_engineers_program_desc: "皇家工程师计划将在陆军工程兵团内部设立一个民用就业市场。该工程兵团的民用部门将负责公共工程项目、政府资助的建筑工程等。其理念是提供一份基础工作，让那些失业并面临失去住所乃至整个生计风险的人能够获得保障。这样，我们就能为民众创造一个坚实的立足点，让他们不至于陷入无法挽回的困境。"
 FIJ_focus_young_business_leaders_program: "青年商业领袖计划"
 FIJ_focus_young_business_leaders_program_desc: "青年商业领袖计划是政府的一项倡议，旨在激励和帮助新兴及未来的商业领袖。每个人都有能力拥有和经营企业，但真正渴望拥有和经营企业的人可以通过加入青年商业领袖计划来实现。通过教授商业技能以及接受并偿还无损贷款，我们营造了积极的环境，以更好地塑造我们未来的经济支柱。"
 FIJ_focus_resource_development_initiative: "资源开发计划"
 FIJ_focus_resource_development_initiative_desc: "资源开发计划是政府在经济领域推进国内资源多元化的先锋力量。我们深知，由于我们实际上是一个岛国，选择有限。然而，这并不意味着我们真的没有任何有价值的资源，相反，我们拥有丰富的矿石和矿物资源，这使得我们的经济能够高度多元化。但如果我们要保持这种局面，就需要拥有更多本土资源。"
 FIJ_focus_new_economic_planning_board: "新经济规划委员会"
 FIJ_focus_new_economic_planning_board_desc: "新经济规划委员会将帮助国内外城市规划师和投资者建立一个新的、不断扩张的经济。这将使我们能够吸引新的资本，并通过支持外国公司和出口我国产品的方式，在一定程度上展现软实力。"
 FIJ_focus_ensuring_a_steeling_future: "确保钢铁工业的未来"
 FIJ_focus_ensuring_a_steeling_future_desc: "钢材的开发和采购掌握在足够多的国内手中，使我们能够基本运转。钢铁是构成我们生活的现代世界的主要资源和材料之一。因此，确保国内供应使我们能够保持某种形式的经济独立。"
 FIJ_focus_phase_one_business_development: "第一阶段业务发展"
 FIJ_focus_phase_one_business_development_desc: "我们经济振兴的初步成果正在显现，我们很快就能迎来繁荣。"
 FIJ_focus_oiling_our_nation: "为我们的国家献石油"
 FIJ_focus_oiling_our_nation_desc: "通过广泛的调查和研究，我们已经能够将我们的计划致力于确保国内石油供应。作为现代时代的基石，我们将确保我们的未来以及我们的能源和石化需求。"
 FIJ_focus_diversifying_the_naval_industries: "海军工业多元化"
 FIJ_focus_diversifying_the_naval_industries_desc: "我们拥有强大的造船业，但我们必须实现多元化，允许岛上民用和军用相关产业的扩张。我们必须能够提出一点小小的要求，以确保我们国家的土地以及我们与其他国家的竞争方式。"
 FIJ_focus_rubber_banding_the_nation: "用橡胶绑定国家"
 FIJ_focus_rubber_banding_the_nation_desc: "通过合成技术的突破，我们已经能够利用我们专门生产的有限的天然橡胶库存来确保大量的国内橡胶供应。这可能会让我们付出更多的代价，但从长远来看，这种推动将确保我们进一步迈向我们能够真正管理的自给自足。"
 FIJ_focus_phase_two_business_development: "第二阶段业务发展"
 FIJ_focus_phase_two_business_development_desc: "持续投资以改善业务增长和经济扩张无疑将使我们能够以稳定的速度增长。"
 FIJ_focus_pacific_economics_exchange_commission: "太平洋经济交流委员会"
 FIJ_focus_pacific_economics_exchange_commission_desc: "我们的目标是在区域内获得认可，尽管这可能会对太平洋上的竞争大国构成挑战，但这也将是我们的一项标志性成就。太平洋经济交流委员会是我们与太平洋地区其他国家之间合作的纽带。该委员会旨在增强我们与其他岛屿国家之间的合作与团结，目的是至少在软实力展示上形成一个广泛认同的基准。"
 FIJ_focus_royal_military_expansion_program: "皇家军事扩张计划"
 FIJ_focus_royal_military_expansion_program_desc: "我们军队的全面扩张和资金投入将使我们能够扩大国内安全和对外支持任务。不仅如此，随着军队的崛起，我们可以向我们的国家和人民灌输责任感和荣誉感，从而塑造子孙后代。"
 FIJ_focus_royal_military_contracts: "皇家军事合同"
 FIJ_focus_royal_military_contracts_desc: "皇家军事合同将是一项旨在鼓励国内武器生产的激励计划。虽然这并非易事，但它确实能够帮助我们更好地为军队提供物资，从而改进训练，并缩短整体训练时间。"
 FIJ_focus_royal_fijian_dream: "皇家斐济之梦"
 FIJ_focus_royal_fijian_dream_desc: "皇家斐济之梦在于铭记过去，却以当下的标准来实践。它重申了宪法宣言，即我们民主的基石将得以保留，只是官职和头衔的名称会有所变更。这是否只是为我们的统治方式增添了一些表面的光鲜亮丽？的确如此，但这是否会削弱我们对国家和人民的承诺？当然不会。有时，一点点的自我激励能够给那些不善于表达自己想法的人带来意想不到的好处。"
 FIJ_focus_technate_council_emerges: "技术官僚委员会成立"
 FIJ_focus_technate_council_emerges_desc: "斐济许多著名的技术专家都曾出国留学。 Technate 委员会是一个由备受尊敬的经济学家、科学家和其他技术专家组成的团体，他们已经集体形成了自己的权力集团。因此，在看似无尽的混乱和派系斗争中，技术委员会利用他们的关系和影响力，通过直接或间接的方式制服派系领导人。因此，该委员会领导了国家，并将努力使斐济成为人类聪明才智和创新的典范。"
 FIJ_focus_a_technocratic_constitution: "技术统治宪法"
 FIJ_focus_a_technocratic_constitution_desc: "任何技官主义的基本原则是，管理机构是为了物种的进步，而不是该物种的具体下属分类。因此，我们计划重新起草我们国家的宪法，并制定第一部技官主义宪法。当我们重新起草它时，我们可以分解要点，但现在足以说要点是，虽然我们称自己为斐济人，并且有一个名为斐济的民族国家。从此以后，在这个国家的统治机构之下的任何人都将受到平等对待。人类就是人类，我们就是物种，我们必须共同努力，巩固我们物种的未来和进步。"
 FIJ_focus_human_treatment_amendment: "人道待遇修正案"
 FIJ_focus_human_treatment_amendment_desc: "人道待遇修正案明确指出，人类物种的任何成员，无论变异如何，都将被视为人类。这意味着在已知的科学理解范围内，由于信仰、外表或个人身份的差异而对物种的另一成员造成的任何不公正的伤害行为，都将根据刑法中规定的法律受到严厉的惩罚。"
 FIJ_focus_voting_requirements_amendment: "投票要求修正案"
 FIJ_focus_voting_requirements_amendment_desc: "投票要求修正案是对现代民主政府投票问题的简单明了的回应。投票年龄将定为18岁，这是法律认可的成年年龄，意味着人们理解并理解自身人生选择和行为的责任。所有已登记的公民都有权投票，这是为了防止恶意的外国对手利用直接民主带来的开放性。投票将通过政府网站进行，选民可以在家中、通过电话或前往当地行政大楼访问。选民必须能够输入其公民身份证号码，以防止重复投票和其他恶意妨碍行为。"
 FIJ_focus_working_standards_amendment: "工作标准修订"
 FIJ_focus_working_standards_amendment_desc: "此次工作环境和岗位标准的修订，涵盖了我们从根本上引导国家走向的新方向。主要规定是立即分析和执行周转计划。这通常被称为 4 & 4 时间表。每天4小时、每周4天将是我们公民的标准工作周。这一推出显然需要时间，但这种格式可以确保最大程度的就业、员工保留和幸福。"
 FIJ_focus_funding_our_future: "资助我们的未来"
 FIJ_focus_funding_our_future_desc: "我们迈向技术官僚未来的核心在于确保子孙后代能够以适应性的方式学习更广阔的世界乃至更广阔领域的信息。有些人是视觉型学习者，有些人是实践型学习者。但这都是一个连续的谱系，如果我们不能顺应这个谱系，就会造成人群分化，而我们真正关心他们的学习和适应能力，最终只会伤害到他们。"
 FIJ_focus_growing_our_manufacturing_base: "扩大我们的制造基地"
 FIJ_focus_growing_our_manufacturing_base_desc: "如果我们要实现进步的未来，我们不仅必须发展国家，而且必须发展我们的经济。此时将开始专门关注经济增长。我们在社会发展和投资方面也将有一个支撑支柱。"
 FIJ_focus_building_the_institute_of_automation: "建设自动化研究所"
 FIJ_focus_building_the_institute_of_automation_desc: "研究天堂计划将带领我们的国家乃至地球上的人类迈向我们所设想的未来。从自动化研究所开始，我们将利用这个机构致力于创新和研究，以期实现更佳的自动化，并整合我们能够构建、生产和创造的新技术和方法。我们设定了以更低成本、更快速地创造更多成果的标准，希望尽可能地让每个人都能享受战后时代以来前所未有的全新生活水平。"
 FIJ_focus_dedicated_welfare_funding: "专项福利资金"
 FIJ_focus_dedicated_welfare_funding_desc: "如果我们希望我们的公民富有生产力和合作精神，我们也必须照顾他们。尊重是一条双向路，无论情感影响如何，我们都是同一物种的成员，因此根据宪法法令，我们必须互相关心。"
 FIJ_focus_tech_industrial_investments: "科技产业投资"
 FIJ_focus_tech_industrial_investments_desc: "我们对更广泛的全球经济的理解充分表明，科技行业就是现状。知道了这一点，我们就可以参与游戏并将其整合为我们的研究天堂计划的一部分。"
 FIJ_focus_institute_for_resource_development: "资源开发研究所"
 FIJ_focus_institute_for_resource_development_desc: "资源开发研究所将致力于资源开采、提炼和合成方法的研究。这一改革和专注将为我们实现经济自给自足的发展奠定基础，并让世界看到我们能够创造更美好的明天。"
 FIJ_focus_institute_for_energy_development: "能源发展研究所"
 FIJ_focus_institute_for_energy_development_desc: "能源发展研究所的创建将是为了开发新的能源生产方式。这也延伸到使这些新的生产方法总体上更加高效和富有成效。因此，研究天堂计划的新扩展将有助于确保能源更加独立于外国势力。"
 FIJ_focus_labour_corps: "劳工队"
 FIJ_focus_labour_corps_desc: "劳工队是政府发起的一项倡议，旨在组织和优先开发和建设新的公共工程和新的基础设施。这种类似于军事的民间组织将使我们能够以正常发达国家无法比拟的速度建造东西。这是由于法规的组织和简化以及我们如何直接满足需求并完成它们。"
 FIJ_focus_labour_prison_program: "监狱劳工计划"
 FIJ_focus_labour_prison_program_desc: "监狱劳工计划是一种针对刑事司法系统的改造理念。犯罪入狱者将获得基本的照护和关怀。所有囚犯均可参加LP计划，通过从事特定工作赚取能量积分。这些积分可用于兑换一定数量的升级道具，以缩短服刑时间，使其更容易忍受。在购买所有升级道具后，根据罪行，囚犯最终可以用一定数量的能量积分来减刑。虽然最初的减刑机制可能倾向于延长服刑时间，但最终目标是鼓励囚犯通过工作和奉献进行改造，并帮助他们做好重返社会的准备。"
 FIJ_focus_increasing_domestic_steel: "增加国内钢材生产"
 FIJ_focus_increasing_domestic_steel_desc: "通过广泛的调查和研究，我们在发展国内钢铁生产方面取得了突破性进展。虽然产量不大，但这仍然是我们实现更大程度自给自足的一个良好开端。"
 FIJ_focus_technocratic_militarism: "技术官僚军国主义"
 FIJ_focus_technocratic_militarism_desc: "我们人类历史上的一个共同的团结原则是对祖国和为祖国服务的人们的责任和荣誉。我们必须为加强我们的军事力量的研究和开发提供良好的注脚。 这可能无法让我们与法国、德国等国家相提并论，但至少我们可以效仿美国的小型军队。一个人可以梦想……一个人可以梦想。"
 FIJ_focus_research_paradise_program: "研究天堂计划"
 FIJ_focus_research_paradise_program_desc: "经过近3年的发展，我们终于可以实现我们的最终目标。研究天堂计划将作为全球科学界的基石，并利用大量资金为各个领域的研究人员创建一个类似度假的中心，以研究、实验和探索他们的研究领域。我们将创建一个理想世界，在这个世界中，理工领域不仅可以被视为未来，而且可以像常规假期一样令人愉快。"
 FIJ_focus_promoting_domestic_energy_synthetics: "推广国内能源合成材料"
 FIJ_focus_promoting_domestic_energy_synthetics_desc: "合成油技术的突破带来了国内石油供应的增长。这些国内石油供应将进一步促进我国经济增长，因为这些石油不仅可以用作能源，还能推动我国一般石化工业的发展。"
 FIJ_focus_technocratic_health_act: "技术官僚健康法案"
 FIJ_focus_technocratic_health_act_desc: "该委员会已通过技术官僚健康法案，该法案投资全面扩展我们的医疗保健系统。这将使我们能够更好地治疗和照顾我们的全体人民。我们必须能够建造高楼，为了做到这一点，我们必须拥有人口，无论是在规模上还是在动机上，都符合人口想要建造的目标。"
 FIJ_focus_industrial_diversity_act: "产业多元化法案"
 FIJ_focus_industrial_diversity_act_desc: "从产业多元化法案可以看到我们民用经济的进一步多元化。在综合研究所的不断努力下，我们已经能够真正发展我们的国家。"
 FIJ_focus_family_care_act: "家庭照顾法案"
 FIJ_focus_family_care_act_desc: "该法案的核心理解是，为了健康的社会凝聚力，家庭，无论其构成如何，都是任何社会的主要基石。因此，我们必须重组我们的福利计划，以支持和维持这一基石，以保持我们社会结构的强大。"
 FIJ_focus_research_plan_alchemy: "研究计划炼金术"
 FIJ_focus_research_plan_alchemy_desc: "我们迄今为止最雄心勃勃的计划。研究计划炼金术将花费我们GDP的三分之一左右，但我们相信我们拥有尝试分子重组的极端基础。简单来说，这几乎相当于炼金术本身。尽管这项技术极其不稳定且昂贵，但如果我们能够真正解决这个问题，我们将能够实现近乎最真实的经济自给自足。"
 FIJ_focus_research_plan_armory: "军队研究计划"
 FIJ_focus_research_plan_armory_desc: "我们的军队必须与民用科技的进步保持同步。虽然我们不可能把所有最先进的发明都投入实战，但至少我们可以提高军人的作战和生存能力。当然，这需要付出相当大的代价，但最终结果将有利于国家的整体安全。"
 FIJ_focus_research_plan_biomedical: "生物医学研究计划"
 FIJ_focus_research_plan_biomedical_desc: "“生物医学计划”旨在推动生物和医疗技术的发展，有望将人类平均寿命延长20年。假肢和基因工程的整体进步将使老年人即使年老也能保持健康强壮。我们希望像一把保护伞，真正为我们的公民开启生物医学创新的新时代。"
 FIJ_focus_naval_innovations: "海军改革"
 FIJ_focus_naval_innovations_desc: "我们的军队不仅仅是军队，一个致力于海军创新的专门内部部门是斐济统治其国家水域的唯一途径。"
 FIJ_focus_expansion_of_welfare_programs: "扩大福利计划"
 FIJ_focus_expansion_of_welfare_programs_desc: "我们的福利计划类型多样化，将能够对新时代持续存在的一些问题给予各种关注。"
 FIJ_focus_research_plan_synthetic: "研究计划综合"
 FIJ_focus_research_plan_synthetic_desc: "合成计划是一种完善我们的合成计划的批发方法，这将使我们能够在国内供应类似橡胶的产品。以有限的橡胶进口和增加的研究投资为代价，我们可以预期由于这种额外的资源供应，我们的整体经济和社会矩阵会得到一些提振。我们采取的另一个步骤..."
 FIJ_focus_civilian_corp_of_engineers: "民间工程兵团"
 FIJ_focus_civilian_corp_of_engineers_desc: "民间工程兵团是斐济工程兵团的民事延伸。关键是要区分并优先考虑民用和军事工程。然而，如果有需要的话，这两个群体可以联合起来，这将有一些间接的军事应用。"
 FIJ_focus_research_plan_autarky: "研究计划自给自足"
 FIJ_focus_research_plan_autarky_desc: "经过多年的广泛研究、规划和投资，我们终于取得了真正的突破。它可以最大限度地巩固我们的经济自给自足。我们现在可以实现任何目标，甚至明星可能不再是限制。"
 FIJ_focus_research_plan_feast: "研究计划盛宴"
 FIJ_focus_research_plan_feast_desc: "为了维持我们作为一个物种和一个社会的成长，我们必须提供最基本的生活条件。一个关键的基本要素是粮食，这一关键将确保社会稳定、人口增长和大多数国家软实力的进步。我们可以找到方法，从根本上增加有针对性的对外援助，并在解决贫困和粮食不安全问题方面引领世界。斐济将成为全球团结的基石。"
 FIJ_focus_research_plan_nucleus: "研究计划核心"
 FIJ_focus_research_plan_nucleus_desc: "未来已至。核工程领域取得了如此巨大的进步，令人遗憾的是，那些散布恐慌的伎俩依然盛行，令人作呕地无视能源生产的显而易见的现实。因此，我们当然要付出巨大的代价，树立建造真正核反应堆的全新全球标准。这个标准高效、有效，而且其发电量很可能超过其适用面积。我们制定了这一真实、最安全的标准，足以让任何在核电方面劣迹斑斑的国家汗颜。对于技术统治而言，这是我们物种需要的未来，但不知为何，我们似乎并不渴望它。"
 fiji_news.503.t: "斐济民主党成立"
 fiji_news.503.desc: "斐济联合党、斐济政党的大部分成员、基督教民主联盟的残余势力以及新工党团结党已合并为斐济民主党，由菲利佩·博莱领导。这个新的中间派政党希望代表温和的斐济土著民众发出统一的声音，对抗执政的斐济联合党，并呼吁以统一的选民名册取代基于种族的投票制度。"
 fiji_news.503.a: "一个温和的声音"
 fiji_news.504.t: "国民联盟党吸收自由民主党"
 fiji_news.504.desc: "斐济民主党已解散，并入由高级酋长兼前军事指挥官拉图·埃佩利·加尼劳领导的新斐济国民联盟党。该党承诺实现跨越种族界限的民族团结，推行基于需求而非种族的平权行动，并提供免费教育。"
 fiji_news.504.a: "中心的新横幅"
 fiji_news.505.t: "保守联盟加入斐济联合党"
 fiji_news.505.desc: "保守联盟代表投票决定将该党并入总理莱塞尼亚·卡拉塞领导的斐济联合党。此次合并将执政联盟中的两大主要本土民族主义政党联合起来，以迎接即将到来的全国大选。"
 fiji_news.505.a: "民族主义选票团结一致"
 fiji_news.506.t: "政党法令"
 fiji_news.506.desc: "政府《政党法令》规定的最后期限已过。所有政党都必须重新注册，并拥有数千名签名成员和一个英文名称，但大多数政党无法或不愿遵守，其中包括现已解散的国民联盟党、民族主义塔科拉沃党和绿党。斐济联合党正在以社会民主自由党的英文名称重组。"
 fiji_news.506.a: "新的政党格局"
 fiji_news.507.t: "拉布卡创立人民联盟"
 fiji_news.507.desc: "失去社会民主自由党领导权的西蒂韦尼·拉布卡创立了新政党 - 人民联盟。这个中间偏右的政党承诺恢复大酋长委员会，并为选民提供一个比斐济优先党更为温和的选择。"
 fiji_news.507.a: "老兵归来"
 fiji_news.508.t: "斐济优先党已注销"
 fiji_news.508.desc: "由于斐济优先党未能按时修改党章，政党注册官已注销了该党的注册资格。此前，该党主席弗兰克·姆拜尼马拉马因妨碍司法公正罪被定罪，党领导层辞职，且大部分议员因议员薪酬纠纷而被开除出党。"
 fiji_news.508.a: "一个时代的终结"