 UKR_cnc_equipment_1: "Р-140У"
 UKR_cnc_equipment_1_desc: "Командно-штабная радиостанция советской эпохи, доставшаяся Украине после распада СССР. Широко использовалась в 1990-х годах в качестве основы связи на уровне бригад и армий."
 UKR_cnc_equipment_2: "Р-145БМ"
 UKR_cnc_equipment_2_desc: "Система первого поколения, созданная на базе командно-штабной машины Р-145БМ. Обеспечивает базовую голосовую связь и передачу данных для командных пунктов батальонного и бригадного уровней."
 UKR_cnc_equipment_3: "Р-161А2 Арцеуль"
 UKR_cnc_equipment_3_desc: "Система второго поколения, основанная на украинском цифровом радиокомплексе Р-161А2. Обеспечивает улучшенное шифрование, надёжность и совместимость по сравнению с системами советской эпохи."
 UKR_cnc_equipment_4: "Р-162-01"
 UKR_cnc_equipment_4_desc: "Система, объединяющая защищённые цифровые радиостанции, датчики поля боя и элементы раннего автоматизированного управления."
 UKR_cnc_equipment_5: "Aselsan–Motorola"
 UKR_cnc_equipment_5_desc: "Система, объединяющая западные тактические радиостанции, компьютеры и совместимые с НАТО стандарты связи."
 UKR_cnc_equipment_6: "«Дельта»"
 UKR_cnc_equipment_6_desc: "Система, созданная на основе украинской платформы управления боевыми действиями «Дельта», обеспечивает ситуационную осведомлённость в реальном времени и ведение сетецентрической войны."
 SOV_cnc_equipment_1: "Р-140М"
 SOV_cnc_equipment_1_desc: "Командно-штабная радиостанция большой дальности времён холодной войны, применявшаяся на армейском и фронтовом уровнях. Служила основой советской стратегической и оперативной связи и ограниченно оставалась в строю в постсоветский период."
 SOV_cnc_equipment_2: "Р-145БМ"
 SOV_cnc_equipment_2_desc: "Система первого поколения на базе командно-штабной машины Р-145БМ. Обеспечивает базовую связь в КВ- и УКВ-диапазонах для командных пунктов батальонного и бригадного звена."
 SOV_cnc_equipment_3: "Р-168 «Акведук»"
 SOV_cnc_equipment_3_desc: "Цифровая радиосистема второго поколения, призванная заменить технику советской эпохи. Добавила засекреченную голосовую связь и ограниченную передачу данных."
 SOV_cnc_equipment_4: "Р-149МА1"
 SOV_cnc_equipment_4_desc: "Командно-штабная машина, объединяющая цифровые радиостанции, элементы автоматизированного управления и обмен данными на поле боя."
 SOV_cnc_equipment_5: "ЕСУ ТЗ «Созвездие-М2»"
 SOV_cnc_equipment_5_desc: "Система, образующая ядро российской концепции сетецентрической войны и объединяющая подразделения от батальона до бригады."
 SOV_cnc_equipment_6: "«Андромеда-Д»"
 SOV_cnc_equipment_6_desc: "Система управления воздушно-десантными и межвидовыми группировками, рассчитанная на быстрое развёртывание и работу с несколькими видами войск."
 artillery_6: "Артиллерия 2065 года"
 artillery_6_desc: "Благодаря мощным возможностям ведения огня с закрытых позиций артиллерия наносит непрерывные точные удары там, где это необходимо на поле боя, и далеко за пределами прямой видимости. Её может перезаряжать непосредственно расчёт. Поскольку для перемещения ей нужны тягачи, менять позицию между ударами бывает непросто, что делает её уязвимой для контрбатарейного огня противника. Лёгкие системы меньшего калибра можно перемещать вручную; они подходят для воздушно-десантных операций, поскольку помещаются в транспортные самолёты."
 Anti_tank_9: "ПТРК 2075"
 Anti_tank_9_desc: "Противотанковые управляемые ракеты — переносные ракетные комплексы с кумулятивными боевыми частями, специально предназначенными для поражения тяжелобронированной техники."
 Heavy_Anti_tank_9: "Самоходный ПТРК 2075 года"
 Heavy_Anti_tank_9_desc: "Тяжёлые противотанковые управляемые ракетные комплексы обладают большей дальностью и более мощной боевой частью. Из-за повышенного веса они непригодны для переноски вручную и устанавливаются на транспортные средства. Они используют кумулятивные боеголовки, специально предназначенные для поражения сильно бронированной техники."
