 gulf.37.t: "흠잡을데 없는 성과를 낸 [fossil_fuel_industry_name] 기업"
 gulf.37.d: "[fossil_fuel_industry_name]에 대한 투자자 신뢰가 매우 높았던 덕분에 우리의 IPO는 기록적인 규모의 자금을 모았으며, 국내외에서 정부의 평판이 크게 높아졌습니다. 더욱 중요한 것은, 모금된 자금이 우리 국부 펀드에 절실히 필요했던 자본을 제공했다는 점입니다."
