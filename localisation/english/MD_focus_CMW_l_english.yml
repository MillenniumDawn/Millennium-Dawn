 ##### Dynamic Modifiers #####
 #Commonwealth Member Spirit
 Commonwealth_member_modifier: "Commonwealth Member"
 Commonwealth_member_modifier_desc: "As a member of the Commonwealth of Nations, our country  benefits from strong diplomatic ties and economic cooperation with other member  states. This historic association provides us with a network of mutual support and  shared values, enhancing our international standing and trade opportunities. However,  balancing our sovereignty with the collective interests of the Commonwealth can  sometimes lead to diplomatic and political challenges."
 CMW_member_eng_influence_tt: "[ENG.GetNameWithFlag] $foreign_influence_modifier$: §G+10%§!"

 ##### Events #####
 # Leaving CMW
 CMW_Leaving.1.t: "[FROM.GetName] has leaves the Commonwealth of Nations"
 CMW_Leaving.1.d: "[FROM.GetName] has officially announced its departure from the Commonwealth of Nations. This decision marks a significant shift in its foreign policy, reflecting a desire for greater autonomy and new international alliances. The departure may impact diplomatic relations and economic ties within the Commonwealth, presenting new challenges and opportunities for both the departing nation and remaining member states."
 CMW_Leaving.1.a: "Good Luck"
