 land_drone_equipment_9: "드론 2075"
 land_drone_equipment_9_desc: "단거리 정찰 드론(UAV)은 전장에 대한 귀중한 실시간 정찰과 상황 인식을 제공합니다. 가볍고 비교적 휴대하기 쉽습니다."
 artillery_5: "야포 2045"
 artillery_5_desc: "강력한 간접 사격 능력을 갖춘 포병은 전장에서 필요한 곳에, 그리고 시야 밖 먼 거리까지 지속적인 정밀 타격을 제공합니다. 포병 자체 승무원이 직접 재장전할 수 있습니다. 이동에 외부 차량이 필요하기 때문에 타격 사이의 이동이 어려울 수 있으며, 이로 인해 적 포병의 대포병 사격에 취약합니다. 경량 소구경 체계는 인력으로 끌고 다닐 수 있으며 수송기 내부에 탑재할 수 있어 공수 작전에 적합합니다."
 SP_arty_5: "자주포 2045"
 SP_arty_5_desc: "강력한 간접 사격 능력을 갖춘 자주포는 전장에서 필요한 곳에, 그리고 시야 밖 먼 거리까지 지속적인 정밀 타격을 제공합니다. 승무원이 직접 재장전할 수 있으며, 자체 추진 능력 덕분에 기동성이 높아 적 포병의 대포병 사격을 피해 이동할 수 있습니다."
 SP_R_arty_5: "다연장로켓발사시스템(MLRS) 2045"
 SP_R_arty_5_desc: "자주식 다연장 로켓 발사기는 넓은 지역 전체를 뒤덮는 로켓 일제 사격을 빠르게 퍼부을 수 있습니다. 주로 적의 집결지에 대해 운용됩니다. 광범위한 파괴를 일으키기 때문에 일반 포병보다 최소 교전 거리가 더 깁니다. 또한 정확도가 낮아 정밀 타격에는 적합하지 않습니다. 재장전을 위해 전용 지원 차량이 필요합니다."
 SP_arty_6: "자주포 2055"
