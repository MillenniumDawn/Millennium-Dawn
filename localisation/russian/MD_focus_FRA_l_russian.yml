 france_md.555.t: "Путеводитель по политическим путям"
 france_md.555.d: "Большинство путей в политическом древе можно разблокировать, если они выиграют выборы 2002 года или если их изберут вручную на последующих выборах. Однако некоторые пути изначально недоступны по соображениям реализма и логики. Вы можете получить доступ к этим путям, следуя этому руководству: \nЧтобы разблокировать бонапартистский и роялистский пути: Изберите Национальный фронт/Национальное объединение (национал-популисты). Завершите фокус: \"Фокус на нестабильности\" произойдет событие, в котором радикальная фракция предложит вам свою помощь. Позвольте им укрепить свои позиции и позволить им совершить переворот, чтобы свергнуть вас с власти, и вы сможете привести к власти бонапартистов или роялистов. \nДля Французской коммуны процесс тот же: завершите фокус \"Реформа, а не революция\" и позвольте экстремистам свергнуть вас с власти. Для пути «Непокорённая Франция»: изберите Социалистическую партию (Западный социализм). Завершите фокус \"Cut With Unions\". Это приведёт к краху Социалистической партии и разблокирует путь «Непокорённая Франция». Другие изменения партий распределены по различным событиям, но пока они носят лишь косметический характер."
 france_md.555.a: "Спасибо за помощь и наставления."
 france_md.556.t: "Успешное расторжение договора"
 france_md.556.d: "Ассамблея перестала в полной мере отражать желания наших граждан относительно нашей страны. Роспуск Ассамблеи показал нашим согражданам, насколько хуже могла бы быть ситуация с правительством. Они сделали правильный выбор, предпочтя нас экстремистам."
 france_md.556.a: "Это была отличная идея."
