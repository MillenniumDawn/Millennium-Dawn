 CIS_all_spirits_idea_tt: "[CIS_anti_air_loc][CIS_anti_terrorism_loc][CIS_bank_loc][CIS_council_leaders_loc][SOV_SpaceForces_loc][SOV_Satellites_loc][SOV_FarAvia_loc][SOV_TransportAvia_loc][SOV_AirMissile_loc][SOV_AirAircraft_loc][SOV_RadioTech_loc][SOV_Rockets_loc][SOV_AntiAir_loc][SOV_Engineer_loc][SOV_Ipso_loc][SOV_Mto_loc][SOV_Railway_loc][SOV_Electronic_loc]"
 CIS_confederation_member_idea: "CIS 연합 회원국"
 CIS_confederation_member_idea_desc: ""
 shia_iranian_school: "시아파 - 이란 학파"
 shia_iranian_school_desc: "시아(알리를 따르는 자들)는 이슬람 예언자 무함마드가 알리 이븐 아비 탈리브를 후계자(이맘)로 지명했다고 보는 이슬람의 한 분파입니다. 시아 이슬람은 주로 수니 이슬람과 대조되는데, 수니파는 무함마드가 후계자를 지명하지 않았다고 믿으며 아부 바크르(슈라, 즉 공동체의 합의를 통해 칼리파로 선출됨)를 올바른 칼리파로 간주합니다. 시아파의 이란 학파는 울라마 전체를 배제하고, 울라마와 조직을 거치는 대신 신과의 직접적인 관계를 추구합니다."
 ISI_islamic_state_early_offensive_idea: "이슬람 국가의 초기 공세"
 ISI_islamic_state_early_offensive_idea_desc: "이슬람 국가가 시리아와 이라크에서 공세를 개시했습니다."
 ISI_islamic_state_failure_idea: "이슬람 국가에 대한 방어 실패"
 ISI_islamic_state_failure_idea_desc: "칼리파국이 공세를 개시했으나 우리는 그들에 맞서 방어할 준비가 되어 있지 않습니다. 방어를 강화하고 최악의 사태에 대비해야 합니다."
 IMF_failed_to_balance_budget_idea: "예산 균형 실패"
 IMF_failed_to_balance_budget_idea_desc: "우리는 예산 균형을 맞추는 데 실패했습니다. 국내 안정도가 서서히 떨어지고 있으며 국민 사이에서 정치적 영향력도 잃고 있습니다. 가능한 한 빨리 이 상황을 바로잡아야 합니다."
 SWE_stealth_submarines: "잠수함 스텔스 기술"
 SWE_stealth_submarines_desc: "잠수함 스텔스 기술"
 SWE_stealth_corvettes: "초계함 스텔스 기술"
 SWE_stealth_corvettes_desc: "초계함 스텔스 기술"
 SWE_homeguard: "헴베르네트"
 AI_nationalist_drift: "게임 규칙 민족주의 편향"
 GAME_RULE_reduce_internal_factions_cost: "내부 파벌 비용 감소"
 emerging_outlook: "신흥국 이념 성향 변동"
 emerging_outlook_desc: ""
 HLS_idea_holy_see: "교황청"
 HLS_idea_holy_see_desc: "바티칸 시국은 모든 가톨릭의 중심지이며, 교황이 홀로 그와 고문들이 직접 선정한 주민들을 통치합니다. 건물을 지을 땅이 거의 없는 우리는 신자들의 십일조와 교황청 행정으로 살아갑니다. 이 체제는 교황이 로마를 되찾거나 신앙을 버리면 끝납니다."
 combined_defense_industries_idea: "통합 방위 산업"
 combined_defense_industries_idea_desc: ""
 reverberations_of_the_great_financial_crisis: "대침체의 여파"
 reverberations_of_the_great_financial_crisis_desc: "경기 침체라는 이름이 무색한 위기가 마침내 우리의 위대한 나라에도 닥쳤습니다. 미국의 거래처들이 더 이상 구매하지 못하게 되면서 기업들이 문을 닫았습니다.\n\n§Y경제 호황§! 상태라면 이 국가 정신은 일찍 취소됩니다. 이 정신이 만료되면 180일 동안 §Y대침체 이후 호황§! 정신을 얻습니다.\n"
 protests_garrison_damage: "진압 경찰 활동 중"
 additional_recruits_desc: "표적 모병 캠페인과 확대된 징병 정책으로 군이 이용할 수 있는 인력이 늘어났습니다."
 agricultural_investments_desc: "농업 기반시설과 현대화 프로그램에 대한 전략적 투자는 식량 생산 역량과 농촌 경제 발전을 향상시킬 것입니다."
 commercialized_agricultural_investments: "상업화된 농업 투자"
 commercialized_agricultural_investments_desc: "대규모 상업 영농과 농업 기업 개발은 농업 생산량을 증대하는 동시에 수출 기회를 창출할 것입니다."
 aircraft_investments_desc: "항공기 제조 역량을 확대하고 생산을 가속하기 위해 전용 자금과 산업 역량이 배정되었습니다."
 amphibious_expertise_desc: "전문 훈련 프로그램과 전술 교리 개발이 군의 상륙 작전 수행 능력을 높였습니다."
 army_morale_bonus_desc: "개선된 환경, 더 나은 지도력, 새로워진 국가적 목적의식이 육군의 투지를 강화했습니다."
 army_organization_bonus_desc: "지휘 구조와 군수 체계의 개혁으로 육군이 전장에서 더 효율적이고 체계적으로 되었습니다."
 artillery_production_bonus_desc: "자원과 생산 시설의 집중적인 배분이 야포와 지원 무기의 제조를 가속했습니다."
 drone_production_idea: "국산 드론 생산"
 drone_production_idea_desc: "무인 항공기 기술과 생산 시설에 대한 투자로 국내 드론 제조 역량이 확립되었습니다."
 equipment_conversion_efforts_idea: "장비 전환 노력"
 equipment_conversion_efforts_idea_desc: "산업 라인과 공장을 목표에 맞게 재정비하여 장비를 더 현대적인 장비로 신속히 전환하는 것은 군 현대화를 위한 현재의 노력을 뒷받침할 것입니다."
 civilian_industry_project_desc: ""
 commander_skill_bonus_desc: ""
 establishing_a_paratrooper_corps_idea: "공수군단 창설"
 establishing_a_paratrooper_corps_idea_desc: ""
 establishing_a_marine_corps_idea: "해병대 창설"
 establishing_a_marine_corps_idea_desc: ""
 battery_park_expansion_idea: "배터리 단지 확장 프로젝트"
 battery_park_expansion_idea_desc: "우리나라에서 이용 가능한 배터리 단지를 확대하면 전력망이 개선되어 모든 국민과 산업에 안정적인 전력을 보장할 수 있습니다."
 geothermal_energy_production_idea: "지열 발전 장려"
 geothermal_energy_production_idea_desc: ""
 hydroelectric_energy_production_idea: "수력 발전 장려"
 hydroelectric_energy_production_idea_desc: ""
 idea_focus_social_spending_expansions: "사회 지출 확대"
 idea_focus_social_spending_expansions_desc: ""
 repair_yard_focus: "조선소 수리 중점"
 repair_yard_focus_desc: ""
 rifle_production_bonus_desc: ""
 convoy_production_bonus: "수송선단 생산 중점"
 convoy_production_bonus_desc: ""
 mechanized_special_forces_idea: "기계화 특수 부대 중점"
 mechanized_special_forces_idea_desc: ""
 light_infantry_special_forces_idea: "경보병 특수 부대 중점"
 light_infantry_special_forces_idea_desc: ""
 post_great_financial_crisis_boom: "대침체 이후 호황"
 post_great_financial_crisis_boom_desc: "우리 경제는 대침체에서 회복했으며, 그 덕분에 어느 때보다 강하게 되살아나고 있습니다. 그야말로 새로운 호황 경제입니다!"
 united_nations_member: "국제연합 회원국"
 united_nations_member_desc: "국제연합(UN)은 1945년 6월 26일 UN 헌장 서명으로 설립된 세계적인 정부 간 기구로, 국제 평화와 안보의 유지, 국가 간 우호 관계의 발전, 국제 협력의 증진, 그리고 이러한 목표를 달성하기 위한 국가들의 행동을 조화시키는 중심지 역할을 사명으로 천명하고 있습니다."
 unsc_restricted_volunteers_too: "UNSC 지원병 제한"
 unsc_restricted_volunteers_too_desc: "§BUN§! §Y안전보장이사회§!가 이 국가로의 군사 지원병 파견을 제한하는 결의를 통과시켰습니다. 이 결의를 위반하는 국가는 해당 국가에서 지원병을 철수할 때까지 즉시 §R제재§!를 받습니다."
 un_aid_esco_member: "§BUN§! 교육과학문화기구 회원국"
 un_aid_esco_member_desc: ""
 un_aid_ido_member: "§BUN§! 산업개발기구 회원국"
 un_aid_ido_member_desc: ""
 un_aid_cdf_member: "§BUN§! 자본개발기금 회원국"
 un_aid_cdf_member_desc: ""
 unsc_arms_embargo: "UNSC 무기 금수"
 unsc_arms_embargo_decs: "§BUN§! §Y안전보장이사회§!가 이 국가에 대한 무기 및 탄약 판매를 제한하는 결의를 통과시켰습니다. 이 국가는 모든 공세적 분쟁을 끝낼 때까지 국제 시장을 이용할 수 없습니다."
 un_vote_sway_assistance: "개발 원조 협정"
 un_vote_sway_assistance_desc: "§BUN§! §Y안전보장이사회§! 또는 §Y총회§!에서의 표를 거래한 협정에 따라, 우리나라는 협정을 제안한 국가로부터 개발 원조를 받고 있습니다."
 un_vote_sway_cost: "개발 원조 제공"
 un_vote_sway_cost_desc: "§BUN§! §Y안전보장이사회§! 또는 §Y총회§! 표결의 일환으로 맺은 협정에 따라 우리 측 의무를 이행하여, 우리 조건에 동의한 국가에 개발 원조를 제공하고 있습니다."
 unga_resolution_poverty_reduction: "결의: 빈곤 감소"
 unga_resolution_poverty_reduction_desc: "§BUN§! §Y총회§!가 회원국에 사회 안전망 확대와 극빈 감소를 권고하는 구속력 없는 결의를 통과시켰습니다. 이행하려면 복지 프로그램에 자금을 대기 위한 소비재 지출 증가가 필요합니다."
 unga_resolution_food_security: "결의: 식량 안보"
 unga_resolution_food_security_desc: "§BUN§! §Y총회§!가 농업 생산성과 식량 유통망에 대한 투자를 촉구하는 구속력 없는 결의를 통과시켰습니다. 농업 지원 사업을 위해 산업 생산에 쓰이던 자원이 전용되고 있습니다."
 unga_resolution_global_health: "결의: 세계 보건"
 unga_resolution_global_health_desc: "§BUN§! §Y총회§!가 의료 접근성과 팬데믹 대비 태세를 확대하는 구속력 없는 결의를 통과시켰습니다. 공중 보건 개선은 사회를 안정시키지만, 의료 물자 수요로 소비재 지출이 증가합니다."
 unga_resolution_education_initiative: "결의: 교육 이니셔티브"
 unga_resolution_education_initiative_desc: "§BUN§! §Y총회§!가 교육 제도, 문해력, 과학 연구에 투자하는 구속력 없는 결의를 통과시켰습니다. 노동자들이 교육 프로그램으로 재배치되어 건설이 느려지지만 연구 성과는 빨라집니다."
 unga_resolution_clean_energy: "결의: 청정 에너지 전환"
 unga_resolution_clean_energy_desc: "§BUN§! §Y총회§!가 재생 에너지로의 전환을 촉진하는 구속력 없는 결의를 통과시켰습니다. 재생 에너지 기반시설은 장려되는 반면 화석 연료 발전소 건설은 불이익을 받아, 전환 기간 동안 전체 산업 역량이 감소합니다."
 unga_resolution_economic_growth: "결의: 경제 성장"
 unga_resolution_economic_growth_desc: "§BUN§! §Y총회§!가 지속 가능한 경제 성장과 생산적 고용을 촉진하는 구속력 없는 결의를 통과시켰습니다. 생산성과 공장 생산량은 증가하지만, 노동 보호로 소비재 수요가 늘고 규제 부담으로 정치력이 소모됩니다."
 unga_resolution_infrastructure: "결의: 기반시설 개발"
 unga_resolution_infrastructure_desc: "§BUN§! §Y총회§!가 회복력 있는 민간 기반시설에 대한 투자를 촉구하는 구속력 없는 결의를 통과시켰습니다. 민간 건설은 빨라지지만, 자원이 전용되어 군수 공장 건설은 느려집니다."
 unga_resolution_reduced_inequality: "결의: 불평등 감소"
 unga_resolution_reduced_inequality_desc: "§BUN§! §Y총회§!가 국가 내부 및 국가 간 불평등을 줄이는 구속력 없는 결의를 통과시켰습니다. 부의 재분배 프로그램은 사회를 안정시키지만, 시행하려면 상당한 소비재 지출과 정치적 자본이 필요합니다."
 unga_resolution_climate_action: "결의: 기후 행동"
 unga_resolution_climate_action_desc: "§BUN§! §Y총회§!가 기후 변화에 대응하기 위한 긴급 행동에 관한 구속력 없는 결의를 통과시켰습니다. 공격적인 배출 목표는 화석 연료 기반시설에 심각한 불이익을 주고 공장 생산량을 줄이지만, 대중의 호의로 안정도가 소폭 상승합니다."
 unga_resolution_peace_institutions: "결의: 평화와 강력한 제도"
 unga_resolution_peace_institutions_desc: "§BUN§! §Y총회§!가 법치를 강화하고 부패를 줄이며 책임 있는 제도를 구축하는 구속력 없는 결의를 통과시켰습니다. 통치가 개선되고 외세의 간섭에 저항하지만, 평화 공약으로 군수 생산이 느려집니다."
 unga_resolution_trade_partnerships: "결의: 무역 파트너십"
 unga_resolution_trade_partnerships_desc: "§BUN§! §Y총회§!가 무역 협력과 기술 이전을 통해 세계적 파트너십을 강화하는 구속력 없는 결의를 통과시켰습니다. 무역 조건은 개선되지만, 국제 표준 준수로 정치력이 소모됩니다."
 unga_resolution_digital_development: "결의: 디지털 개발"
 unga_resolution_digital_development_desc: "§BUN§! §Y총회§!가 인터넷 기반시설과 기술 투자를 통해 디지털 격차를 해소하는 구속력 없는 결의를 통과시켰습니다. 디지털 및 기술 건설은 빨라지지만, 물리적 기반시설에 쓰이던 자원이 전용됩니다."
 super_power: "초강대국"
 super_power_desc: "우리는 초강대국으로서 세계에서 극히 지배적인 위치를 차지하고 있으며, 전 세계적 규모로 영향력을 행사하고 힘을 투사할 수 있는 능력이 특징입니다. 초강대국은 세계 패권을 장악할 수 있는 능력을 갖추고 있으며 누구와도 권력을 놓고 경쟁할 수 있어, 전통적인 강대국을 왜소하게 만듭니다.\n\n권력 지위는 우리가 세계 총액에서 차지하는 GDP 비중에 따라 결정되며, §Y외세 영향으로부터의 독립성§!에 의해 보정됩니다. 현재 우리의 기여도는 §Y[?ROOT.percentage_of_global_factories|%1]§!입니다.\n\n각 등급에 필요한 기여도는 다음과 같습니다.\n§Y$super_power$§!: §Y15%§! 초과\n§Y$great_power$§!: §Y6.5%§! 초과\n§Y$large_power$§!: §Y2.5%§! 초과\n§Y$minor_power$§!: §Y0.2%§! 초과\n§Y$non_power$§!: §Y0.2%§! 미만\n\n각 지리적 권역에서 §Y$super_power$§!, §Y$great_power$§!, §Y$large_power$§!이(가) 충분하지 않으면, 가장 강력한 일부 §Y$minor_power$§!이(가) §Y$regional_power$§!(으)로 분류됩니다. 권역별 §Y$minor_power$§! 이상 국가의 수는 다음과 같습니다.\n유럽 (7)\n중동 및 북아프리카 (3)\n사하라 이남 아프리카 (3)\n아시아 (7)\n아메리카 (4)\n\n권력 순위는 분기마다(2월, 5월, 8월, 11월) 갱신됩니다."
 super_power_tt: "£economy_laws_cost_texticon 법안 비용: §R+80%§!\n£economy_laws_cost_texticon §Y국내 투자§! 슬롯: §G+4§!"
 idea_focus_generic_counter_terrorism: "대테러 작전"
 idea_focus_generic_counter_terrorism_desc: "전담 대테러 부대가 정보 및 보안 기관 내에 편성되어 저항 진압과 방어적 정보 수집이 향상됩니다."
 idea_focus_generic_cyber_warfare: "사이버전 이니셔티브"
 idea_focus_generic_cyber_warfare_desc: "공격 및 방어 사이버 역량에 대한 투자가 암호화 통신과 국가 정보망을 강화했습니다."
 healthcare_privatization: "의료 제도"
 healthcare_privatization_desc: "의료 서비스를 국가와 민간 기업이 각각 어느 정도 제공하는지를 결정합니다. 완전 공공 제도는 보편적 보장을 보증하지만 재정 부담을 지우고, 완전 민간 제도는 국가 지출을 줄이는 대신 저소득층의 접근성을 희생합니다."
 fully_privatized_healthcare: "완전 민영화 의료"
 fully_privatized_healthcare_desc: "모든 의료 서비스를 시장 환경에서 운영되는 민간 제공자가 공급합니다. 국가는 직접적인 의료 지출을 부담하지 않지만, 접근성은 지불 능력에 따라 결정되며 건강 결과의 사회적 불평등이 대체로 높습니다."
 partially_privatized_healthcare: "부분 민영화 의료"
 partially_privatized_healthcare_desc: "민간 제공자가 대부분의 의료 서비스를 공급하며, 국가는 제한적인 안전망에만 자금을 지원합니다. 정부의 비용은 비교적 낮게 유지되지만, 민간 보험을 감당할 수 없는 이들에게는 보장의 공백이 남습니다."
 partially_nationalized_healthcare: "부분 국유화 의료"
 partially_nationalized_healthcare_desc: "공립 병원과 보험 제도가 민간 제공자와 나란히 운영되는 혼합 제도입니다. 국가는 모든 시민에게 기본적인 수준의 진료를 보장하면서 민간 공급이 이를 보완하도록 허용합니다."
 fully_nationalized_healthcare: "완전 국유화 의료"
 fully_nationalized_healthcare_desc: "의료는 전적으로 국가가 재원을 마련하고 운영하는 보편적 공공 서비스로 취급됩니다. 모든 시민이 소득과 관계없이 보장을 받지만, 정부가 전체 비용을 부담하며 제도에는 상당한 지속적 투자가 필요합니다."
 mining_policies: "광업 규제"
 mining_policies_desc: "천연자원 채굴에 적용되는 환경 및 운영 기준을 규정합니다. 더 엄격한 규제는 환경과 지역 사회를 보호하지만 생산량을 줄이고, 느슨한 기준은 생태계 피해를 감수하는 대신 자원 수확량을 극대화합니다."
 full_environmental_protections: "완전 환경 보호"
 full_environmental_protections_desc: "포괄적인 입법으로 모든 채굴 활동에 가장 엄격한 환경 기준이 의무화됩니다. 산업 생산은 제약을 받지만 생태계와 지역 사회의 장기적인 건강은 보전됩니다."
 partial_environmental_protections: "부분 환경 보호"
 partial_environmental_protections_desc: "환경 기준은 가장 민감한 지역과 가장 해로운 관행에 적용되며, 일반적인 채굴은 제한된 감독 아래 진행됩니다. 생산을 크게 저해하지 않으면서 생태계 피해를 완화하는 절충안입니다."
 balanced_protections: "균형 잡힌 광업 규제"
 balanced_protections_desc: "규제는 효율적인 자원 채굴을 허용하면서 최소한의 환경 보호 장치를 부과하도록 조정됩니다. 환경 단체도 산업계 로비도 완전히 만족하지 못하지만, 생산량과 지속 가능성은 모두 실행 가능한 수준에서 유지됩니다."
 economic_motivated_mining: "경제 우선 광업"
 economic_motivated_mining_desc: "환경 규제는 국제 규범이 요구하는 최소 수준으로 유지됩니다. 채굴률은 국가 경제 목표에 부합하도록 극대화되며, 생태계 문제는 생산성을 직접 위협할 때에만 다루어집니다."
 strip_mining: "노천 채굴"
 strip_mining_desc: "최대한의 자원 채굴을 위해 모든 환경 제약이 제거됩니다. 경관은 급속히 고갈되고 지역 사회가 환경 비용을 떠안지만, 단기 수확량은 크게 증가합니다."
 critical_infrastructure: "기반시설 유지 관리"
 critical_infrastructure_desc: "도로, 전력망, 통신망, 상수도 등 국가 기반시설에 적용되는 유지 관리 수준을 정합니다. 유지 관리 지출이 높을수록 생산 능력과 공공 복지가 보전되고, 투자가 부족하면 점진적인 노후화가 일어납니다."
 minimal_maintenance: "최소 유지 관리"
 minimal_maintenance_desc: "고장이 즉각적인 위기를 초래할 곳에 한해서만 기반시설을 가동 상태로 유지합니다. 정기 점검은 미뤄지고 단기적으로 비용은 줄지만 국가 망의 상태는 서서히 악화됩니다."
 standard_maintenance: "표준 유지 관리"
 standard_maintenance_desc: "기반시설을 현재 상태와 서비스 품질을 보존하는 데 필요한 수준으로 유지합니다. 지출은 예측 가능하고 적당하며, 확장이나 개선을 추구하지 않으면서 노후화를 방지합니다."
 extensive_maintenance: "집중 유지 관리"
 extensive_maintenance_desc: "정부가 모든 핵심 망의 유지 보수, 현대화, 회복력에 막대한 투자를 합니다. 기반시설 성능이 극대화되고 장기 교체 비용이 줄지만, 이 프로그램에는 지속적인 예산 투입이 필요합니다."
 employment_pressure: "노동 규제"
 employment_pressure_desc: "노동 기준, 노동자의 권리, 건물 운영에 필요한 인력 규모를 규율하는 법률입니다."
 comprehensive_regulations: "포괄적 노동법"
 comprehensive_regulations_desc: "폭넓은 노동자 보호와 의무적 인력 배치 수준이 모든 부문에서 인력 요구량을 증가시킵니다. 노동자들은 안정적인 고용을 기대하므로 실업을 정치적으로 용인하기 어렵습니다."
 strong_regulations: "강력한 노동 보호"
 strong_regulations_desc: "강력한 노동자 권리와 안전 기준에 따라 건물당 더 많은 직원이 필요합니다. 안정적인 고용에 대한 기대로 정부의 실업 용인도가 낮아집니다."
 standard_regulations: "표준 노동 체계"
 standard_regulations_desc: "표준적인 인력 요구량과 실업 용인도를 제공하는 균형 잡힌 노동법 접근 방식입니다."
 light_regulations: "경미한 노동 감독"
 light_regulations_desc: "규제 부담이 줄어 기업이 더 적은 노동자로 운영할 수 있습니다. 국민이 고용 불안에 더 익숙해져 용인되는 실업 한계치가 올라갑니다."
 minimal_regulations: "최소 노동 기준"
 minimal_regulations_desc: "노동자 보호가 거의 없어 모든 건물에서 최소한의 인력 배치가 가능합니다. 경제는 상당한 잉여 노동력 풀과 함께 돌아가도록 구성되어 있어, 높은 실업률에 대한 용인도가 크게 높아집니다."
 COVID_pandemic_origin: "코로나19 팬데믹 발원지"
 COVID_pandemic_origin_desc: "코로나19 팬데믹의 발원지로서 우리나라는 심각한 경제적 혼란과 국제적 감시에 직면해 있습니다. 의료 체계가 압도되었고 산업 생산이 급락했습니다."
 COVID_pandemic_impact: "코로나19 팬데믹"
 COVID_pandemic_impact_desc: "코로나19 팬데믹이 일상생활과 경제 활동을 교란했습니다. 봉쇄와 공중 보건 조치는 필요하지만 막대한 경제적 대가가 따릅니다."
 COVID_supply_chain_disruption: "글로벌 공급망 위기"
 COVID_supply_chain_disruption_desc: "팬데믹이 글로벌 공급망을 무너뜨렸습니다. 핵심 부품과 원자재의 부족으로 모든 부문의 건설과 산업 생산이 둔화되고 있습니다."
 pandemic_swine_flu_origin: "H1N1 신종 플루 발원지"
 pandemic_swine_flu_origin_desc: "H1N1 신종 플루 팬데믹의 발원지로서 우리나라는 국제적 감시가 강화되고, 바이러스가 인구 사이에 퍼지면서 의료 비용이 급증하고 있습니다."
 pandemic_swine_flu_impact: "H1N1 신종 플루"
 pandemic_swine_flu_impact_desc: "H1N1 신종 플루 팬데믹이 우리나라에 도달했습니다. 처음 우려했던 것보다 덜 심각하지만, 바이러스는 의료 체계에 부담을 주고 경제 활동을 교란하고 있습니다."
 pandemic_MERS_outbreak: "메르스 유행"
 pandemic_MERS_outbreak_desc: "중동호흡기증후군이 높은 치사율로 우리나라에 확산되고 있습니다. 병원들이 격리 병동과 확산 방지 지침을 마련함에 따라 의료 비용이 급증하고 있습니다."
 pandemic_ebola_outbreak: "에볼라 유행"
 pandemic_ebola_outbreak_desc: "에볼라 바이러스가 우리나라를 휩쓸고 있습니다. 지역 사회 전체가 격리되고, 의료진이 최전선에서 목숨을 잃고 있으며, 피해 지역의 경제 활동은 멈춰 섰습니다."
 pandemic_ebola_DRC: "에볼라 발병"
 pandemic_ebola_DRC_desc: "동부 지방의 에볼라 발병이 우리 의료 체계에 부담을 주고 있습니다. 이 지역의 무력 분쟁이 확산 방지 노력을 복잡하게 만들어 비용이 증가하고 경제가 불안정해지고 있습니다."
 generic_military_intervention: "적극적 군사 개입"
 SWE_idea_overhalling_our_university_system_desc: ""
 reshaping_national_identity: "국가 정체성의 재편"
 reshaping_national_identity_desc: "과거 서로 분리되어 있던 주들을 하나의 국가로 만드는 일은 격동의 과정입니다. 연합이 완전히 공고화될 때까지 경쟁하는 충성심과 불안정한 제도가 국가 §Y안정도§!에 부담을 줍니다."
 non_state_actor: "비국가 행위자"
 non_state_actor_desc: "반군 단체에서 NGO에 이르기까지 많은 국제 행위자는 국제적 중요성을 지니지만, 승인된 국가가 아니라는 이유로 여러 면에서 심각한 불이익을 받습니다. 이러한 비국가 행위자 중 일부는 부당한 정부를 전복하거나 새 정부를 세우고 국제 국경을 다시 그려 기존 국가를 장악하기를 열망합니다. 다른 일부는 국가가 되려는 야심이 없고, 대신 중앙 정부의 권위가 미치지 않는 지역 환경에서 무력을 사용해 권력과 부를 축적합니다."
 lacks_international_recognition: "국가를 지향하는 세력"
 lacks_international_recognition_desc: "어떤 국가들은 관료제, 군대, 국기 등 보통 국가에 결부되는 모든 것을 갖추고 있습니다. 그러나 국제적 승인이라는 정당성의 도장이 가져다주는 추가적인 혜택 없이는 국가로서의 지위가 결코 완전할 수 없습니다. 이러한 국가들은 해외에서 자신들의 대의를 알리는 활동을 통해 승인을 얻으려 할 수 있으며, 궁극적으로는 임계 다수의 국가의 지지를 얻어 국제 사회의 정식 구성원이 되는 것을 목표로 합니다."
 MD_emergency_police_funding_idea: "비상 경찰 자금"
 MD_emergency_police_funding_idea_desc: "경찰력이 초과 근무 예산과 긴급 조달로 운영되고 있습니다. 군중은 더 빨리 해산되고 순응도가 올라가지만, 비용이 막대합니다."
 MD_jobs_for_unemployed_idea: "실업자 일자리 프로그램"
 MD_jobs_for_unemployed_idea_desc: "공공 사업과 채용 운동으로 실업자들이 다시 일자리를 얻고 있습니다. 안정도와 정치적 추진력이 오르는 대신 소비재 공급에 약간의 비용이 듭니다."
 MD_tax_relief_promise_idea: "세금 감면 패키지"
 MD_tax_relief_promise_idea_desc: "저소득 가구가 세금을 덜 내고 재정 부양책이 시행 중입니다. 우리가 공약을 이행하는 동안 안정도와 정치적 추진력이 오릅니다."
 at_member: "남극 조약 가입국"
 at_member_desc: "남극 조약은 1959년 12개국이 서명하였으며 이후 더 많은 국가가 가입한 조약입니다. 이 조약은 남극을 과학 보호구역으로 지정하고, 과학 조사의 자유를 보장하며, 대륙에서의 군사 활동을 금지합니다. 이 조약은 대륙을 평화적, 과학적 목적으로 보존하는 데 성공을 거두었습니다."
 NKO_nuclear_tests_idea: "핵실험"
 NKO_nuclear_tests_idea_desc: "북한은 몇 년마다 핵무기 실험을 실시합니다. 이는 북한과 긴밀한 관계인 중국을 포함한 외부 강국들의 광범위한 비난을 불러왔습니다. 북한은 자국의 핵무기 프로그램이 방어적 성격이라고 주장하지만, 많은 이들은 [NKO.GetLeader]이(가) 이 무기를 미국이나 그 동맹국에 사용할 가능성을 우려합니다."
 wto_member: "세계무역기구 회원국"
 wto_member_desc: "세계무역기구의 정회원으로서 이 나라는 지속적인 무역 및 산업상의 이점을 유지합니다."
 WTO_permanent_membership_tt: "§g이 국가 정신이 만료되면 영구적이지만 더 약한 혜택인 §Y$wto_member$§!(으)로 대체됩니다.§!"
 MON_khan_heir: "칭기즈 칸의 후예"
 MON_khan_heir_desc: "몽골인은 칭기즈 칸의 후손이며, 선조들의 영광은 언제나 우리를 위해 빛날 것입니다."
 CHI_war_preparations_desc: "인민해방군이 한반도 접경을 따라 전시 태세로 전환했습니다. 예비군이 동원되고, 훈련 주기가 단축되었으며, 잠재적 개입에 앞서 공세 계획이 가속화되고 있습니다."
 CHI_foreign_investment_desc: "외국인 투자 규정의 자유화와 경제특구 설립이 다국적 제조업 및 기술 기업을 끌어들입니다. 외국 자본이 기반시설과 산업 단지 건설로 유입되어 현대화를 가속합니다."
 Public_Sector_Space_Program_desc: "국영 민간 우주 기관이 발사 역량, 위성 배치, 심우주 탐사를 이끌며 국가의 위신을 과학적 성취에 두고 있습니다. 이 프로그램은 첨단 기술 연구에 폭넓은 공공 투자를 끌어들이고, 항공, 재료과학, 컴퓨팅 분야로 파급 효과를 일으켜 더 넓은 산업 기반을 강화합니다."
 space_combat_support_force_desc: "전담 군사 우주 부문이 지상군과 해군에 위성 기반 정찰, 위치 측정, 통신 지원을 제공합니다. 실시간 영상과 암호화된 데이터 링크가 작전 계획을 개선하며, 전담 신호정보 자산은 접전 전에 적의 전투 서열을 파악하는 능력을 높여 줍니다."
 USA_wot_diplomatic_victory: "전쟁 없는 승리"
 USA_wot_diplomatic_victory_desc: "우리는 오사마 빈 라덴을 요구했고, 침공도, 연합군도, 성조기를 덮은 관 하나도 없이 그를 넘겨받았습니다. 미국의 압박이 기갑 사단의 뒷받침 없이도 무엇을 할 수 있는지 세계가 주목했습니다.\n\n국내의 반응은 더 차갑습니다. 많은 사람이 전쟁을 원했으나 얻지 못했습니다."
 TAL_pariah_settlement: "칸다하르 합의"
 TAL_pariah_settlement_desc: "우리는 셰이크를 내주었고, 그 대가로 나라를 유지하도록 허용받았습니다. 형편없는 거래입니다. 우리를 승인하는 국가는 거의 없고, 안전보장이사회의 금수 조치를 받으며, 미국의 감시를 당하고, 우리와 함께 싸운 이들에게 멸시받습니다.\n\n에미레이트는 살아남았습니다. 그것 말고는 달리 할 말이 없습니다."
 player_instant_justification_spirit: "전쟁의 명분"
 player_instant_justification_spirit_desc: "법적 근거, 언론 브리핑, 외교 전문이 모두 사전에 준비되어 있습니다. 전쟁이 필요하다고 판단하는 즉시 그 명분은 당일에 마련됩니다."
 ISI_decapitated_leadership: "참수된 지도부"
 ISI_decapitated_leadership_desc: "공습으로 칼리파국의 고위 지휘관이 사망했습니다. 그의 부하들은 공석을 놓고 다투고 있고, 명령은 전선에 늦게 도달하거나 아예 도달하지 않으며, 그라면 포기했을 진지를 지키느라 숙련된 전투원들이 소모되고 있습니다."
 vietnam.1.t: "사업에서 손을 뗀 군"
 vietnam.1.d: "부패가 통제되고 군이 재건됨에 따라, 정부는 베트남 인민군에게 상업 사업을 중단하라고 명령했습니다. 군은 국방에 다시 주의를 기울이고, 민간 기관이 상업 활동의 책임을 맡게 됩니다."
 vietnam.1.a: "군은 국가에 봉사해야 한다."
 corruption_reform_resistance: "뿌리 깊은 저항"
 corruption_reform_resistance_desc: "감시에 위협을 느낀 관료와 사업 네트워크가 추가적인 부패 방지 조치를 방해하고 있습니다."
 USA_white_house_burned: "불타버린 백악관"
 USA_white_house_burned_desc: "미국 대통령의 공식 관저이자 집무실인 백악관이 적군에 의해 불탔습니다. 이 상징적인 손실은 국가에 충격을 주었고 국민을 분노와 복수의 결의로 들끓게 했습니다. 군의 사기는 치솟지만, 권력의 중심이 폐허가 되어 정치적 안정도는 흔들립니다."
 MD_nationalist_migrant_protests: "민족주의자 이주민 시위"
 MD_nationalist_migrant_protests_desc: "민족주의 성향 군중이 우리의 이주민 정책에 반대하며 거리로 나섰습니다. 불안은 시간이 지나면 가라앉지만, 지속되는 동안에는 공공 질서에 부담을 줍니다."
 democratic_influence: "친서방 영향력"
 neutrality_idea: "중립 외교 정책"
 salafist_outlook: "살라피 성향"
 territorial_nationalism_lar: "영토 민족주의"
 dictatorship: "독재"
 communist_dictatorship: "공산 독재"
 fascist_dictatorship: "파시스트 독재"
 Enduring_Freedom: "$USA_Enduring_Freedom$"
 norway_of_arabia: "아라비아의 노르웨이"
 UKR_strat_bomb_old: "무력화된 전략폭격기 전력"
 UKR_strat_bomb_old_desc: "우리의 전략폭격기 전력은 제 기능을 못 하는 상태입니다. 우리가 보유하기로 한 항공기는 러시아의 것보다 신형이지만 9년간의 방치로 노후화되었으며, 공군에 인수하려면 먼저 수리해야 합니다."
 UKR_strat_bomb_repaired: "수리된 전략폭격기 전력"
 UKR_strat_bomb_repaired_desc: "우리는 보유한 항공기를 모두 쓸 만한 상태로 수리해 공군에 편입했습니다. 쇠퇴를 때맞춰 되돌려 놓았습니다. \n이 국가 정신이 만료되면 더 우수한 영구 국가 정신으로 대체됩니다."
 UKR_strat_bomber_fleet: "우리의 장거리 항공대"
 UKR_strat_bomber_fleet_desc: "우리는 장거리 항공대가 물려받은 암울한 운명을 새로운 사명으로 바꿔 놓았습니다. 한때 해체되어 잊힐 운명이던 우리 전략폭격기는 이제 하늘을 지키며, 외세의 야욕으로부터 우리 땅을 방어할 태세를 갖추고 있습니다. 이 전력을 보존함으로써 우리는 국방의 핵심 수단을 지켜 냈을 뿐 아니라, 평생을 바쳐 조종해 온 항공기를 잃고 눈물을 쏟을 뻔한 우리 조종사들의 슬픔도 덜어 주었습니다."
 UKR_west_strat_bomb_not: "이행하지 않은 군축 약속"
 UKR_west_strat_bomb_not_desc: "우크라이나는 서방 파트너들에게 약속한 대로 남은 장거리 폭격기를 해체하지 못했습니다. 이는 군비 감축에 대한 우크라이나의 의지에 대한 신뢰를 훼손했으며, 앞으로의 서방과의 경제 협력을 더 어렵게 만들 것입니다."
 UKR_west_strat_bomb: "전략 군축"
 UKR_west_strat_bomb_desc: "우크라이나는 남은 장거리 폭격기를 해체하겠다는 약속을 이행했습니다. 이는 서방 파트너들의 신뢰를 높이고 더 긴밀한 경제 협력의 길을 열었습니다. \n이 국가 정신이 만료되면 더 우수한 영구 국가 정신으로 대체됩니다."
 UKR_west_strat_bomb_final: "완료된 전략 군축"
 UKR_west_strat_bomb_final_desc: "우리는 군축 조약을 따르기로 하고, 소련제 장거리 폭격 항공 전력을 전부 폐기해 조종사와 정비사를 더 적은 기종의 전투기에 집중시켰습니다. \n이는 서방 파트너들의 신뢰를 높이고 더 긴밀한 경제 협력의 길을 열었습니다. \n더 빠른 훈련, 더 쉬운 정비, 더 높은 전투 준비 태세에 도움이 되기를 기대합니다."