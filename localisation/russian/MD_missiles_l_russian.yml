 space_auto_preset_0_desc_gnss: "Сначала восстанавливаем самую устаревшую сеть — сейчас это §GGNSS§!. Дальше автоматика переключится сама, как только сеть будет заполнена."
 space_auto_preset_0_desc_com: "Сначала восстанавливаем самую устаревшую сеть — сейчас это §GCOMSAT§!. Дальше автоматика переключится сама, как только сеть будет заполнена."
 space_auto_preset_0_desc_spy: "Сначала восстанавливаем самую устаревшую сеть — сейчас это §GSPYSAT§!. Дальше автоматика переключится сама, как только сеть будет заполнена."
 space_auto_preset_1_desc: "Все четыре места под GNSS. Скорость армии, точность ударов с воздуха и по кораблям, скорость строительства и добыча ресурсов."
 space_auto_preset_2_desc: "Все четыре места под COMSAT. Мощь командования, организация армии, скорость планирования, политическая власть и операции разведки."
 space_auto_preset_3_desc: "Все четыре места под SPYSAT. Запас планирования, разведка, обнаружение, эффективность конвоев, скорость исследований и охват разведки."
 space_auto_preset_4_desc: "Два GNSS и два COMSAT за пуск. Наведение и строительство вместе с управлением войсками."
 space_auto_preset_5_desc: "Два GNSS и два SPYSAT за пуск. Наведение и строительство вместе с разведкой и исследованиями."
 space_auto_preset_6_desc: "Два COMSAT и два SPYSAT за пуск. Управление войсками вместе с разведкой и добычей сведений."
 space_auto_preset_7_desc: "Два GNSS плюс один COMSAT и один SPYSAT. GNSS идёт с двойным весом как самый дешёвый и лёгкий для вывода."
 space_auto_preset_8_desc: "Запускает ту сборку, которую вы собрали на экране пуска и сохранили. Полезные нагрузки всё равно еженедельно обновляются до новейшего поколения."
 SPACE_AUTO_ROTATION: "§gКруг:§! [?var_space_auto_flights|C0]"
 SPACE_AUTO_ROTATION_TT: "Сколько пусков выполняется за круг. Каждый пуск несёт одну ракету-носитель и полную сборку полезной нагрузки.\n\nКруг идёт, только когда на складе есть полный комплект на каждый пуск, так что на деле пусков может быть меньше, пока производство догоняет.\n\nЭто ваш регулятор расходов. Один круг такого размера стоит около §Y$[?var_space_auto_est_cost|C1] млрд§!, распределённых понедельно на срок постройки.\n\n§YИзменения действуют сразу§! — выключать и включать автоматику не нужно. Уже строящееся не пересчитывается; новый размер пойдёт в счёт только со следующей партии."
 SPACE_AUTO_ROTATION_PLUS_TT: "На один пуск за круг больше (не больше 10)"
 SPACE_AUTO_ROTATION_MINUS_TT: "На один пуск за круг меньше (не меньше 1)"
 SPACE_AUTO_BUDGET: "§gВ неделю:§! $[?space_prod_expense|C1] млрд"
 SPACE_AUTO_FUNDS: "[space_auto_funds_loc]"
 SPACE_AUTO_FUNDS_TT: "Сколько автоматике осталось на новые заказы: казна за вычетом того, что ещё должны текущие партии.\n\nПартия начинается, только если этого хватает на всю её стоимость. Это не недельная цифра — недельное списание показано слева."
 SPACE_AUTO_BUDGET_TT: "Сколько текущее производство списывает каждую неделю и какими средствами располагает автоматика.\n\nПартия запускается, только когда §Yв казне хватает на всю её стоимость§!. После запуска она оплачивается еженедельно в течение постройки, а не списывается разом, — это касается и заказов, сделанных вручную.\n\nПолный круг при нынешнем размере стоит примерно §Y$[?var_space_auto_est_cost|C1] млрд§!. Изменение круга никогда не затрагивает то, что уже строится: партии сохраняют размер и цену, с которыми были заказаны, а новая цифра пойдёт в счёт только со следующей партии.\n\nПри включённом §Yдефицитном финансировании§! проверка казны не делается вовсе и заказы идут в кредит."
 SPACE_AUTO_SAVE_BUTTON: "Сохранить свой вариант"
 SPACE_AUTO_SAVE_BUTTON_TT: "[!space_auto_save_button_click_enabled]Сохранить собранную выше сборку как план §YСвой вариант§! и переключиться на него."
 SPACE_AUTO_SAVE_TT_trigger_2: "Выше загружена хотя бы одна §Yполезная нагрузка§!"
 SPACE_AUTO_SAVE_BUTTON_TT_DELAYED: "Сохраняются только места под полезную нагрузку. Ракета-носитель всегда берётся новейшая из исследованных, так что выбирать её не нужно."
 SPACE_AUTO_UPGRADE_BUTTON: "Обновить сейчас"
 SPACE_AUTO_UPGRADE_BUTTON_TT: "[!space_auto_upgrade_button_click_enabled]Перевести каждую группировку на новейшее исследованное поколение везде, где уже выведенные спутники это позволяют без потери покрытия."
 SPACE_AUTO_UPGRADE_BUTTON_TT_DELAYED: "Сама по себе группировка не повышается в поколении — только деградирует, — так что без этого новые спутники будут висеть на орбите без всякой пользы.\n\nАвтоматика делает это после каждого пуска; кнопка нужна, если вы запускали вручную."
 SPACE_AUTO_MANIFEST: "[space_auto_manifest_loc]"
 SPACE_AUTO_MANIFEST_TT: "Ракета-носитель и полезная нагрузка, которую один запуск выводит на орбиту в рамках этой ротации.\n\nАвтоматизация использует §Yсамую старую ракету в вашем ангаре, которая всё ещё способна поднять полезную нагрузку§!, поэтому избыточные старые ступени расходуются раньше новых. Новое производство всегда относится к новейшему поколению, поэтому старые запасы постепенно расходуются сами.\n\nЯчейки, чья группировка уже полностью заполнена, передаются группировке, которой всё ещё не хватает спутников, а состав запуска сокращается до количества, которое способна вывести эта ракета — поэтому число может быть меньше ваших четырёх ячеек, а старые ракеты выводят меньше спутников за один запуск."
 SPACE_AUTO_BUILDING: "[space_auto_building_loc]"
 SPACE_AUTO_BUILDING_TT: "Что сейчас находится на производственных линиях. Это обычные производственные партии — они также отображаются на вкладке §YПроизводство§! этого окна с указанием оставшегося времени и учитываются в ограничении на одну партию каждого типа.\n\nРакеты-носители производятся значительно дольше, чем спутники, поэтому первая ротация после включения может произойти только через большую часть года."
 SPACE_AUTO_DEFICIT: "Дефицитное финансирование"
 SPACE_AUTO_DEFICIT_TT: "Разрешить размещение заказов независимо от состояния казны, покрывая расходы за счёт долга.\n\nПри отключении партия запускается только в том случае, если казна может покрыть её полную стоимость, поэтому программа никогда не потратит деньги, которых у вас нет. Автоматизация будет простаивать, вместо того чтобы превышать доступные возможности.\n\n§RНадвигающийся крах из-за банкротства всегда останавливает её, независимо от настроек§! — эту защиту нельзя отключить."
 SPACE_AUTO_DEFICIT_TT_DELAYED: "Этот переключатель позволяет космической программе опережать возможности экономики, которая её финансирует."
 SPACE_AUTO_STOCKPILE: "Строить заранее"
 SPACE_AUTO_STOCKPILE_TT: "Построить всю программу заранее, вместо одной ротации за раз.\n\nРакеты-носители строятся 240–440 дней, тогда как спутники — 80–260 дней, поэтому заказ только того, что нужно для следующей ротации, оставляет стартовую площадку простаивать в ожидании ракет. При включении этой настройки автоматизация заказывает все запуски, необходимые программе, а также всю оставшуюся группировку спутников одной партией.\n\nЭто значительно увеличивает еженедельные расходы, но позволяет гораздо быстрее выйти на полную мощность и продолжать запуски без перерывов."
 SPACE_AUTO_STOCKPILE_TT_DELAYED: "Хорошо сочетается с §Yдефицитным финансированием§!: запас — это то, за что платит ваш бюджет, а переключатель дефицита снимает ограничение на его накопление."
 SPACE_AUTO_LATEST_OLV: "Только новейшая OLV"
 SPACE_AUTO_LATEST_OLV_TT: "Запускать только самую новую исследованную ракету-носитель.\n\nВыключено — автоматика берёт §Yсамую старую ракету на складе, которая ещё поднимет груз§!, а новейшее поколение оставляет в заказе, так что ступени прошлых поколений расходуются, а не пылятся в ангаре. Старая ракета поднимает меньше, поэтому такие пуски несут меньший груз.\n\nВключено — старые ступени не используются вовсе. Каждый пуск несёт полный груз, но программа ждёт новых ракет, вместо того чтобы запускать имеющиеся."
 SPACE_AUTO_LATEST_OLV_TT_DELAYED: "Включайте, когда остатки старых ступеней слишком малы, чтобы тратить на них пусковое окно, и выключайте, если лучше разгрузить ангар, чем ждать.\n\n§RНагрузка SPYSAT весит ровно столько, сколько поднимает подходящая ракета§!. В плане со спутниками-разведчиками старая ступень не поднимет новейшее поколение, так что этот переключатель там ничего не меняет."
 SPACE_AUTO_NET_GNSS: "[space_auto_net_gnss_loc]"
 SPACE_AUTO_NET_GNSS_TT: "§YНавигационные спутники§! — скорость армии, точность непосредственной авиаподдержки и ударов по кораблям, стратегические бомбардировки, определение места и вероятность попадания на море; плюс скорость строительства и добыча ресурсов на гражданской стороне.\n\nСамое дешёвое и лёгкое семейство для вывода на орбиту."
 SPACE_AUTO_NET_COM: "[space_auto_net_com_loc]"
 SPACE_AUTO_NET_COM_TT: "§YСпутники связи§! — мощь командования, организация армии, скорость планирования, истребительное сопровождение и перехват, взаимодействие на море; плюс политическая власть, шифрование, прирост разведывательной сети и исходы операций.\n\nОтдача зависит ещё и от уровня наземных приёмников."
 SPACE_AUTO_NET_SPY: "[space_auto_net_spy_loc]"
 SPACE_AUTO_NET_SPY_TT: "§YРазведывательные спутники§! — запас планирования, разведка, снижение штрафа за погоду, обнаружение и эффективность конвоев; плюс скорость исследований, охват разведки по всем направлениям и подавление сопротивления.\n\nСпутники сверх группировок можно отправить на шпионские задания."
