l_french:
 MD_AI_RULES: "Options de l'I.A."
 MD_PEACE_DEALS: "Conférences de paix"
 MD_FOCUS_TREE_RULES: "Options des priorités nationales"
 MD_FORMABLE_RULES: "Drapeaux et nations formables"
 MD_ORGANISATION_RULES: "Options des organisations"
 MD_INFLUENCE_RULES: "Options du système d'influence"
 MD_OPTIMISATION_RULES: "Optimisation et performances"
 MD_NUCLEAR_RULES: "Règles nucléaires"
 MD_RULES: "Règles diverses de Millennium Dawn"
 MD_CHEAT_RULES: "Options de triche"
 MD_RANDOM_RULES: "Règles de randomisation"
 RULE_HARD_AI_ECONOMIC: "Économie de l'I.A."
 RULE_DISABLE_HARD_AI_ECONOMIC: "Restriction standard"
 RULE_DISABLE_HARD_AI_ECONOMIC_DESC: "Une restriction standard pour l'IA, qui ne lui permet pas de renforcer son économie. Pour un jeu historique."
 RULE_ENABLE_HARD_AI_ECONOMIC: "Aucune restriction"
 RULE_ENABLE_HARD_AI_ECONOMIC_DESC: "Si vous vous ennuyez que dans chaque partie l'I.A. ne sorte pas de sa crise économique, ceci est fait pour vous. L'I.A. n'est plus limitée dans la prise de décisions concernant son économie. Soyez prêt à ce que de nombreux pays deviennent plus riches que les vôtres. Uniquement pour ceux qui n'ont pas peur des difficultés. Salutations de la part du développeur de Battle AI. ;)"
 RULE_DISABLE_AI_DEBT_WAR_TITLE: "Guerre de la dette pour l'I.A."
 RULE_DISABLE_AI_DEBT_WAR: "Désactiver"
 RULE_DISABLE_AI_DEBT_WAR_DESC: "Ceci désactive la fonction de guerre de la dette pour l'I.A. L'I.A. ne prendra plus l'option d'envahir un pays qui ne rembourse pas sa dette."
 RULE_ENABLE_AI_DEBT_WAR: "Activer"
 RULE_ENABLE_AI_DEBT_WAR_DESC: "Cette configuration rendra l'I.A. plus susceptible de déclarer des guerres de dettes si vous n'honorez pas votre dette envers elle."
 RULE_ENABLE_AI_FIGHTING_AUTONOMY_FOCUS: "L'IA utilisera la priorité §TAccroissement de l'autonomie§!."
 RULE_ENABLE_FIGHTING_AUTONOMY_FOCUS: "Activer"
 RULE_ENABLE_FIGHTING_AUTONOMY_FOCUS_DESC: "L'I.A. combattra votre autonomie en utilisant la priorité continue §YAccroissement de l'autonomie§!."
 RULE_DISABLE_FIGHTING_AUTONOMY_FOCUS: "Désactiver"
 RULE_DISABLE_FIGHTING_AUTONOMY_FOCUS_DESC: "L'I.A. ne combattra plus votre autonomie en utilisant la priorité continue §YAccroissement de l'autonomie§!."
 RULE_ALLOW_CHAOTIC_PEACE_CONFERENCE: "Activer les accords de paix chaotiques"
 RULE_OPTION_CHAOTIC_PC_NO: "Non"
 RULE_OPTION_CHAOTIC_PC_NO_DESC: "Cette option devrait empêcher tout le monde de s'emparer de terres lors des conférences de paix de l'I.A.\nElle permet de limiter le nombre de personnes pouvant revendiquer des États aux dirigeants et aux chefs de faction. (Cela n'affecte que l'I.A., pas le joueur)."
 RULE_OPTION_CHAOTIC_PC_YES: "Oui"
 RULE_OPTION_CHAOTIC_PC_YES_DESC: "Pour ceux qui apprécient les conférences de paix chaotoques, pourquoi limiter le monde à une §YRussie§! alors que 12 §YRussies§! peuvent exister !\n(Je ne suis pas responsable des résultats qui pourraient découler de cette option !)"
 RULE_ALLOW_PLAYER_LED_PEACE_CONFERENCE: "Activer les conférences de paix dirigées par les joueurs"
 RULE_OPTION_PLAYER_LED_PC_NO: "Non"
 RULE_OPTION_PLAYER_LED_PC_NO_DESC: "Cette option permet à l'I.A. de faire ses propres choix, aussi stupides soient-ils."
 RULE_OPTION_PLAYER_LED_PC_YES: "Oui"
 RULE_OPTION_PLAYER_LED_PC_YES_DESC: "Pour ceux qui ne font pas confiance à l'I.A. pour mettre le bâton rond dans le trou rond, cette mesure permettra uniquement aux joueurs de faire des concessions lors des conférences de paix."
 RULE_SALAFIST_BRANCH: "Activer la branche salafiste"
 RULE_YES_SALAFIST_BRANCH_DESC: "Active la branche salafiste dans l'arbre générique pour toutes les nations, quelle que soit la religion de départ."
 RULE_NO_SALAFIST_BRANCH_DESC: "Active la branche salafiste dans l'arbre générique pour les nations qui suivent n'importe quelle variante de l'islam."
 CUB_AI_BEHAVIOR: "@CUB Cuba"
 RULE_OPTION_DEMOCRAT: "Penchant démocrate"
 RULE_OPTION_DEMOCRAT_AI_DESC: "Les États-Unis chercheront à élire les dirigeants du parti démocrate et à maintenir la nation, dans un sens moderne, vers un consensus de centre-gauche pour gouverner la nation."
 RULE_OPTION_REPUBLICAN: "Penchant républicain"
 RULE_OPTION_REPUBLICAN_AI_DESC: "Les États-Unis chercheront à élire les dirigeants du parti républicain et à maintenir la nation, dans un sens moderne, vers un consensus de centre-droit pour gouverner la nation."
 RULE_OPTION_REFORMED_REPUBLIC: "République réformée"
 RULE_OPTION_REFORMED_REPUBLIC_AI_DESC: "La volonté du peuple a été entendue. La pression politique et le tollé général ont abouti à des réformes politiques et économiques essentielles pour permettre une meilleure représentation et une plus grande visibilité des tiers partis. Il appartient désormais aux citoyens d'élire un parti qui les représente."
 RULE_OPTION_POST_UNITED: "Après l’ère unie"
 RULE_OPTION_POST_UNITED_AI_DESC: "L'aigle tombe plus bas que terre. §RNe pas activer l'I.A. historique§!"
 FIJ_AI_BEHAVIOR: "@FIJ République des Fidji"
 NIG_AI_BEHAVIOR: "@NIG République fédérale du Nigéria"
 RULE_OPTION_FRA_HISTORICAL: "Historique"
 RULE_OPTION_FRA_HISTORICAL_DESC: "La France restera occidentale et l’un des leaders de l’UE. La France tentera d’amener l’Union européenne vers une plus grande centralisation, tout en conservant son influence dans ses anciennes colonies."
 BRM_AI_BEHAVIOR: "@BRM Union du Myanmar"
 SYR_AI_BEHAVIOR: "@SYR République arabe syrienne"
 RULE_OPTION_SYR_HISTORICAL: "IA historique"
 RULE_OPTION_SYR_HISTORICAL_DESC: "Hafez el-Assad sera remplacé par son fils aîné Bachar el-Assad. Bashar maintiendra la Syrie comme un pays aligné sur la Russie, avec une approche équilibrée de la diplomatie, de l'armée et de l'économie."
 RULE_OPTION_SYR_IRON_LADY: "La Dame de fer de Syrie"
 RULE_OPTION_SYR_IRON_LADY_DESC: "Hafez el-Assad sera remplacé par sa fille Bouchra el-Assad. Bouchra adoptera une approche plus neutre entre les grandes puissances, en mettant l'accent sur la diplomatie et l'économie."
 RULE_OPTION_SYR_SYRIAN_SAVAGE: "Sauveur syrien"
 RULE_OPTION_SYR_SYRIAN_SAVAGE_DESC: "Hafez el-Assad sera remplacé par son fils cadet, Maher el-Assad. Maher tentera de former la Grande Syrie et de se tailler une nouvelle place au Moyen-Orient. Il se concentrera sur l'expansion militaire et économique."
 RULE_OPTION_SYR_NEW_ASSAD: "Le nouveau el-Assad"
 RULE_OPTION_SYR_NEW_ASSAD_DESC: "Hafez el-Assad sera remplacé par son frère Rifaat el-Assad après le Printemps de Damas. Rifaat se concentrera sur une politique pro-saoudienne en mettant l'accent sur la diplomatie et l'économie."
 RULE_OPTION_SYR_DAMASCUS_SPRING: "Le printemps de Damas"
 RULE_OPTION_SYR_DAMASCUS_SPRING_DESC: "La Syrie sera dépassée par le mouvement du Printemps de Damas et transformée en démocratie."
 BHR_AI_BEHAVIOR: "@BHR Bahreïn"
 SAU_AI_BEHAVIOR: "@SAU Royaume d'Arabie Saoudite"
 RULE_OPTION_RULE_BRITANNIA: "Règle Britannia"
 RULE_OPTION_RULE_BRITANNIA_AI_DESC: "Autrefois, cette île au sceptre était connue et redoutée dans le monde entier. Le monarque britannique présidait à un empire sur lequel le soleil ne se couchait jamais. Mais aujourd’hui, la position internationale de la Grande-Bretagne est en déclin. Un simple laquais des États-Unis, l’ombre d’eux-mêmes. Le moment est venu de restaurer l’Empire britannique."
 BOT_AI_BEHAVIOR: "@BOT Botswana"
 NKO_AI_BEHAVIOR: "@NKO RDP de Corée"
 SIN_AI_BEHAVIOR: "@SIN Singapour"
 SER_AI_BEHAVIOR: "@SER Yougoslavie"
 RULE_OPTION_MILOCEVIC_COMMI: "Milosevic est un communiste"
 RULE_OPTION_MILOCEVIC_COMMI_AI_DESC: "Une fois que Milosevic sera en mesure de rester au pouvoir, il ramènera le pays au communisme et tentera de faire revivre la Yougoslavie."
 RULE_OPTION_MILOCEVIC_NATI: "La Grande Serbie de Milosevic"
 RULE_OPTION_MILOCEVIC_NATI_AI_DESC: "Milosevic suivra la voie de la renaissance de la Grande Serbie et tentera de restituer toutes les terres où vit la population serbe."
 RULE_OPTION_MILOCEVIC_FEDERATION: "La Fédération balkanique de Milosevic"
 RULE_OPTION_MILOCEVIC_FEDERATION_AI_DESC: "Milosevic suivra le chemin d'un projet grandiose et non réalisé : la Fédération balkanique."
 RULE_OPTION_SERBIAN_KINGDOM: "Royaume de Serbie"
 RULE_OPTION_SERBIAN_KINGDOM_AI_DESC: "Après le renversement de Milosevic, les partisans du nationalisme et de la monarchie prendront le pouvoir et tenteront de restaurer la grandeur d'antan du peuple serbe."
 RULE_OPTION_SERBIAN_LIBERALS: "Serbie libérale"
 RULE_OPTION_SERBIAN_LIBERALS_AI_DESC: "La politique serbe empruntera la voie du libéralisme et de la démocratie."
 UKR_AI_BEHAVIOR: "@UKR Ukraine"
 GEO_AI_BEHAVIOR: "@GEO Géorgie"
 GEO_NATIONALIST_behavior: "@GEO Comportement des nationalistes"
 GEO_help_CHE_behavior: "@GEO Aide aux Tchétchènes"
 GEO_2008_war_behavior: "@GEO Comportement dans la guerre de 2008"
 GEO_WILL_FOLLOW_OWN_WAY: "Autodétermination"
 GEO_WILL_FOLLOW_OWN_WAY_DESC: "La Géorgie nationaliste suivra sa propre voie et écrasera l’Arménie et l’Azerbaïdjan"
 GEO_WILL_BE_PRO_ARMENIA: "Pro-arménienne"
 GEO_WILL_BE_PRO_ARMENIA_DESC: "La Géorgie nationaliste aidera l'Arménie à écraser l'Azerbaïdjan."
 GEO_WILL_BE_PRO_AZERI: "Pro-azérie"
 GEO_WILL_BE_PRO_AZERI_DESC: "La Géorgie nationaliste aidera l'Azerbaïdjan à écraser l'Arménie."
 GEO_WILL_HELP: "Aider les @CHE Tchétchènes"
 GEO_WILL_HELP_DESC: "La Géorgie aidera les Tchétchènes dans la guerre contre la Russie. Ils peuvent aider la Géorgie à l’avenir."
 GEO_WONT_HELP: "Ne pas aider les @CHE Tchétchènes"
 GEO_WONT_HELP_DESC: "La Géorgie n’aidera pas les Tchétchènes dans la guerre contre la Russie. Ils seront hostiles à la Géorgie."
 GEO_ATTACK_RUS: "Préparation à la guerre"
 GEO_ATTACK_RUS_DESC: "La Géorgie se préparera à la guerre de 2008 et essaiera de la gagner."
 GEO_WEAKBOY: "Compromis avec la Russie"
 GEO_WEAKBOY_DESC: "La Géorgie cherchera un compromis avec la Russie pour éviter les combats."
 BLR_union_state_ai_behavior: "@BLR Comportement de l'État de l'Union"
 BLR_WONT_FOLLOW_UNION_STATE: "Ne pas suivre l'État de l'Union"
 BLR_WONT_FOLLOW_UNION_STATE_DESC: "La Biélorussie ne formera pas un État fédéré et ne deviendra pas une marionnette de la Russie."
 BLR_WILL_FOLLOW_UNION_STATE: "Former l'État de l'Union"
 BLR_WILL_FOLLOW_UNION_STATE_DESC: "La Biélorussie tentera de former un État fédéré. Au début, ils deviendront une marionnette russe, mais plus tard..."
 PMR_sub_behavior: "@PMR Sous-comportement de la Transnistrie"
 PMR_PASSIVE_DEFAULT: "Priorité économique"
 PMR_PASSIVE_DEFAULT_DESC: "La Transnistrie concentrera son attention sur le secteur économique."
 PMR_SHERIFF: "Combattre le « shérif »"
 PMR_SHERIFF_DESC: "La Transnistrie se concentrera sur la lutte contre l'influence de la société \"Sheriff\"."
 RULE_OPTION_GER_GREEN: "Vert"
 RULE_OPTION_GER_GREEN_DESC: "L’Allemagne tentera de suivre la voie verte."
 RULE_OPTION_GER_NATIONALIST: "Nationaliste"
 RULE_OPTION_GER_NATIONALIST_DESC: "L’Allemagne tentera de suivre la voie nationaliste."
 RULE_OPTION_GER_SOCIALIST: "Socialiste"
 RULE_OPTION_GER_SOCIALIST_DESC: "L'Allemagne s'efforcera de suivre la voie socialiste."
 RULE_OPTION_GER_MONARCHIST: "Monarchiste"
 RULE_OPTION_GER_MONARCHIST_DESC: "L’Allemagne tentera de suivre la voie monarchiste."
 RULE_DISABLE_FORMABLE_NATIONS: "Désactiver les nations formables"
 RULE_YES_FORMABLE_NATIONS_DESC: "Désactive les décisions relatives aux nations formables."
 RULE_NO_FORMABLE_NATIONS_DESC: "Les nations formables seront activées."
 RULE_ALLOW_EDGY_FLAGS: "Autoriser les drapeaux controversés"
 RULE_ALLOW_EDGY_FLAGS_BLOCKED_DESC: "Empêche l'apparition de certaines des options de drapeaux les plus controversées."
 RULE_ALLOW_EDGY_FLAGS_ALLOWED_DESC: "Permet des options de drapeaux plus controversées qui seraient normalement censurées."
 RULE_DISABLE_EU: "Désactiver l'UE"
 RULE_YES_DISABLE_EU_DESC: "Tous les pays seront retirés de l'Union européenne."
 RULE_NO_DISABLE_EU_DESC: "L'Union européenne existera telle quelle."
 RULE_DISABLE_NATO: "Désactiver l'OTAN"
 RULE_YES_DISABLE_NATO_DESC: "L'OTAN sera désactivée lors du chargement dans le jeu."
 RULE_NO_DISABLE_NATO_DESC: "L'OTAN restera une faction."
 RULE_SPREAD_INFLUENCE_AMOUNT_GAIN: "Gain d'influence par diffusion"
 RULE_SPREAD_INFLUENCE_AMOUNT_GAIN_DESC: "Modifier l'influence acquise par la diffusion de l'influence."
 RULE_SPREAD_INFLUENCE_GAIN_0_5: "0.5%"
 RULE_SPREAD_INFLUENCE_GAIN_0_5_DESC: "0,5% d'influence gagnée par action de diffusion. Si vous souhaitez vraiment ralentir le gain d'influence."
 RULE_SPREAD_INFLUENCE_GAIN_2: "2%"
 RULE_SPREAD_INFLUENCE_GAIN_2_DESC: "2 % d'influence gagnée par action de propagation. Car si vous voulez vraiment augmenter le gain d’influence."
 RULE_SPREAD_INFLUENCE_GAIN_4: "4%"
 RULE_SPREAD_INFLUENCE_GAIN_4_DESC: "4% d'influence gagnée par action de diffusion. Si vous souhaitez vraiment augmenter le gain d'influence."
 RULE_SPREAD_INFLUENCE_AMOUNT_COOLDOWN: "Rechargement de la diffusion d'influence"
 RULE_SPREAD_INFLUENCE_30_COOLDOWN: "30 jours"
 RULE_SPREAD_INFLUENCE_30_COOLDOWN_DESC: "Le temps de recharge par défaut. Une fois tous les 30 jours, vous pouvez étendre votre influence à une autre nation."
 RULE_SPREAD_INFLUENCE_14_COOLDOWN: "14 jours"
 RULE_SPREAD_INFLUENCE_14_COOLDOWN_DESC: "Une fois tous les 14 jours, vous pouvez étendre votre influence à une autre nation."
 RULE_SPREAD_INFLUENCE_0_COOLDOWN: "Pas de rechargement"
 RULE_SPREAD_INFLUENCE_0_COOLDOWN_DESC: "Pas de temps de recharge pour répandre votre influence, lorsque vous souhaitez abandonner tout votre §Hpouvoir politique§! pour influencer d’autres nations !"
 RULE_SPREAD_INFLUENCE_60_COOLDOWN: "60 jours"
 RULE_SPREAD_INFLUENCE_60_COOLDOWN_DESC: "Une fois tous les 60 jours, vous pouvez diffuser votre influence à une autre nation."
 RULE_INVEST_INFLUENCE_AMOUNT_GAIN: "Gain d'influence par investissement"
 RULE_INVEST_DEFAULT_GAIN_1: "1%"
 RULE_INVEST_DEFAULT_GAIN_1_DESC: "L'option par défaut. 1% d'influence gagnée lorsque quelqu'un accepte vos investissements."
 RULE_INVEST_DEFAULT_GAIN_0_5: "0.5%"
 RULE_INVEST_DEFAULT_GAIN_0_5_DESC: "0,5% d'influence gagnée lorsque quelqu'un accepte vos investissements."
 RULE_INVEST_DEFAULT_GAIN_2: "2%"
 RULE_INVEST_DEFAULT_GAIN_2_DESC: "2 % d'influence gagnée lorsque quelqu'un accepte vos investissements."
 RULE_INFLUENCE_COOLDOWN: "Récup. gain influence par investissement"
 RULE_14_DAY_INFLUENCE: "Délai de 14 jours"
 RULE_14_DAY_INFLUENCE_DESC: "L'option par défaut. Le temps de recharge pour l’influence acquise grâce à l’investissement est de 14 jours ou 2 semaines. Cela s’applique à la nation pour toutes les opportunités d’investissement possibles. Même si vous pouvez toujours investir, vous n’obtiendrez aucune influence pendant cette période."
 RULE_0_DAY_INFLUENCE: "Pas de rechargement"
 RULE_0_DAY_INFLUENCE_DESC: "Influence MD à l’ancienne tirée de la limite de temps d’investissement. Vous pouvez investir aussi souvent que vous le souhaitez tout en gagnant en influence, ce qui est déconseillé à ceux qui aiment l'équilibre !"
 RULE_30_DAY_INFLUENCE: "Délai de 30 jours"
 RULE_30_DAY_INFLUENCE_DESC: "L'option multijoueur suggérée. Le temps de recharge pour l’influence acquise grâce à l’investissement est de 30 jours, soit environ 1 mois. Cela s’applique à la nation pour toutes les opportunités d’investissement possibles. Même si vous pouvez toujours investir, vous n’obtiendrez aucune influence pendant cette période."
 RULE_ENABLE_DIVISION_LIMITER: "Activer le limiteur de division AI"
 RULE_NO_ENABLE_DIVISION_LIMITER_DESC: "Limiteur de division de l'IA désactivé\n\nPar défaut, l'IA ne sera pas limitée dans le nombre d'unités qu'elle peut produire. Si vous souhaitez limiter les divisions pour des raisons de performances, permettez-moi !"
 RULE_YES_ENABLE_DIVISION_LIMITER_DESC: "Limiteur de division de l'IA activé\n\nLorsque je suis activé, l'IA sera moins susceptible de produire des unités, ce qui permettra une expérience plus rationalisée pour vous permettre, en tant que joueur, de jouer avec une tranquillité relative !"
 RULE_OPTION_POTATO_EDITION: "Édition Potato"
 RULE_POTATO_EDITION_DIVISION_LIMITER_DESC: "Mode Potato du limiteur de division de l'IA activé\n\nCela limite encore plus l'IA pour des raisons de performance.\n"
 RULE_REMOVE_MICRO_STATES: "Retirer les micro-États"
 RULE_NO_RULE_REMOVE_MICRO_STATES_DESC: "La suppression des microétats devrait améliorer les performances des machines bas de gamme.\n"
 RULE_ALLOW_ENABLE_LEDGER: "Activer le registre de MD"
 RULE_ALLOW_ENABLE_LEDGER_YES_DESC: "Le registre de Millennium Dawn est activé. (Certaines informations du registre de La Résistance peuvent être redondantes. Désactivez cette fonction si vous voulez un jeu plus difficile)."
 RULE_ALLOW_ENABLE_LEDGER_NO_DESC: "Le registre de Millennium Dawn est désactivé. Cette solution est préférable pour les utilisateurs qui préfèrent une expérience plus authentique et qui veulent utiliser La Résistance pour obtenir des renseignements essentiels."
 RULE_ALLOW_HELP_GUI: "Activer l'interface graphique d'aide multijoueur"
 RULE_ALLOW_HELP_GUI_YES: "Cela active l'interface graphique d'aide multijoueur."
 RULE_ALLOW_HELP_GUI_NO: "Cela désactive l'interface graphique d'aide multijoueur."
 RULE_ALLOW_PLAYER_COLORED_PUPPETS: "Activer les marionnettes colorées MD"
 RULE_OPTION_MD_COLORED_PUPPETS_YES_DESC: "Depuis que cette règle du jeu a été activée, tout pays qui devient une marionnette passera automatiquement à la couleur de son suzerain.(Par exemple, si la Chine a manipulé l’Inde, alors l’Inde deviendra rouge comme la Chine)."
 RULE_OPTION_MD_COLORED_PUPPETS_NO_DESC: "Puisque cette règle du jeu a été désactivée, les pays ne changeront pas de couleur lorsqu'ils seront manipulés et leur couleur restera statique."
 RULE_ALLOW_CHEAT_DECISIONS: "Autoriser les décisions de triche"
 RULE_YES_ALLOW_CHEAT_DECISIONS_DESC: "Décisions de triche activées."
 RULE_NO_ALLOW_CHEAT_DECISIONS_DESC: "Décisions de triche désactivées."
 RULE_ALLOW_TOGGLING_CHEAT_DECISIONS: "§Y(Multi.)§! Autoriser les décisions de triche"
 RULE_YES_ALLOW_TOGGLING_CHEAT_DECISIONS_DESC: "§Y(Optionnel)§!\n\nActivation / désactivation des décisions de triche à l'échelle mondiale activée.\n§YREMARQUE :§! Toute nation dans le monde peut activer ou désactiver les décisions de triche, et les effets sont §Yglobaux§!. Un événement apparaîtra pour indiquer quel pays l'active ou le désactive.\n§YVous devriez vous assurer que vous êtes autorisé à utiliser la décision dans une partie multijoueur !§!\n\n§YREMARQUE :§! Vous devez également activer la règle de jeu « Autoriser les décisions de triche » si vous souhaitez tricher !"
 RULE_NO_ALLOW_TOGGLING_CHEAT_DECISIONS_DESC: "§Y(Optionnel)§!\n\nActivation / désactivation des décisions de triche à l'échelle mondiale désactivée.\n§YREMARQUE :§! Toute nation dans le monde peut activer ou désactiver les décisions de triche, et les effets sont §Yglobaux§!. Un événement apparaîtra pour indiquer quel pays l'active ou le désactive.\n§YVous devriez vous assurer que vous êtes autorisé à utiliser la décision dans une partie multijoueur !§!\n\n§YREMARQUE :§! Vous devez également activer la règle de jeu « Autoriser les décisions de triche » si vous souhaitez tricher !"
 RULE_DISABLE_ANTI_BULLY: "Désactiver la lassitude de guerre"
 RULE_YES_ANTI_BULLY_DESC: "Désactive le système de lassitude de guerre publique, vous permettant d'être un belliciste sans pénalité."
 RULE_NO_ANTI_BULLY_DESC: "Le système de lassitude de guerre sera activé."
 RULE_RANDOM_IDEOLOGIES: "Visions aléatoires"
 RULE_RANDOM_IDEOLOGIES_NO_DESC: "Toutes les nations conservent leur vision politique historique."
 RULE_RANDOM_IDEOLOGIES_YES_DESC: "Toutes les nations ont maintenant une vision politique aléatoire."
 RULE_RANDOM_RELIGION: "Religions aléatoires"
 RULE_RANDOM_RELIGION_NO_DESC: "Toutes les nations conservent leurs religions historiques."
 RULE_RANDOM_RELIGION_YES_DESC: "Toutes les nations ont des religions aléatoires."
 RULE_RANDOM_INTERNAL_FACTIONS: "Factions internes aléatoires"
 RULE_RANDOM_INTERNAL_FACTIONS_NO_DESC: "Toutes les nations conservent leurs factions internes historiques."
 RULE_RANDOM_INTERNAL_FACTIONS_YES_DESC: "Toutes les nations ont des factions internes aléatoires."
 RULE_ENERGY_DIFFICULTY_PLAYER: "Difficulté énergétique du joueur"
 RULE_ENERGY_DIFFICULTY_PLAYER_DESC: "Ajuste la quantité d'énergie consommée et le gain pour les joueurs. (§RATTENTION:§! dans un souci de jeu quelque peu équilibré, il est fortement recommandé de conserver ce paramètre proche de celui par défaut)"
 RULE_ENERGY_DIFFICULTY_AI: "Difficulté énergétique de l'IA"
 RULE_ENERGY_DIFFICULTY_AI_DESC: "Ajustez la quantité d'énergie consommée et le gain pour l'IA. (§RATTENTION:§! dans un souci de jeu quelque peu équilibré, il est fortement recommandé de conserver ce paramètre proche de celui par défaut)"
 RULE_OPTION_VERY_EASY: "Très facile"
 RULE_OPTION_EASY: "Facile"
 RULE_OPTION_HARD: "Difficile"
