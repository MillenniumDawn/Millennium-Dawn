 module_flight_deck_4_desc: "$module_flight_deck_1_desc$"
 module_flight_deck_5_desc: "$module_flight_deck_1_desc$"
 module_flight_deck_6_desc: "$module_flight_deck_1_desc$"
 module_flight_deck_7_desc: "$module_flight_deck_1_desc$"
 module_flight_deck_8_desc: "$module_flight_deck_1_desc$"
 module_flight_deck_9_desc: "$module_flight_deck_1_desc$"
 module_flight_deck_10_desc: "$module_flight_deck_1_desc$"
 AA_upgrade_8: "AI 보조 적응형 탐색기"
 AA_upgrade_8_desc: "AI 보조 적응형 탐색기는 고급 센서 융합과 실시간 표적 식별을 활용하여, 치열하게 다투는 공역에서 더 은밀하고 더 차갑고 더 빠른 공중 위협에 대한 록온을 유지합니다."
 nsb_AA_upgrade_8: "AI 보조 적응형 탐색기"
 nsb_AA_upgrade_8_desc: "AI 보조 적응형 탐색기는 고급 센서 융합과 실시간 표적 식별을 활용하여, 치열하게 다투는 공역에서 더 은밀하고 더 차갑고 더 빠른 공중 위협에 대한 록온을 유지합니다."
 AT_upgrade_8: "적응형 대장갑 탄약"
 AT_upgrade_8_desc: "적응형 대장갑 탄약은 AI 보조 표적 인식, 센서 융합, 협조 일제 사격 논리, 프로그래밍 가능한 탄두를 사용하여 센서가 포화된 전장에서 중무장한 차량을 격파합니다."
 augmented_vision_3: "AI 시야 지원"
 augmented_vision_3_desc: "3세대 증강 시야는 실시간 열화상 및 적외선 오버레이를 병사의 헤드업 디스플레이에 직접 통합하여, 시야가 불량한 조건에서의 위협 탐지를 극적으로 개선합니다."
 augmented_vision_4: "고급 원거리 시야 분석"
 augmented_vision_4_desc: "AI 보조 물체 인식으로 바이저가 표적, 아군, 위험 요소를 자동으로 분류할 수 있습니다. 분대 수준의 데이터 공유 덕분에 모든 병사가 팀원 누구든 볼 수 있는 것의 혜택을 누립니다."
 augmented_vision_5: "다중 스펙트럼 심도"
 augmented_vision_5_desc: "완전히 네트워크화된 증강현실은 지형 데이터, 드론 영상, 예측 위협 모델링을 각 병사의 시야에 겹쳐 표시하여 개인의 인식을 공유된 작전 상황도로 바꿔 놓습니다."
 augmented_vision_6: "신경 연동 시야"
 augmented_vision_6_desc: "신경 연동 시야 체계는 기존 광학 장치를 완전히 우회하여 센서 데이터를 운용자의 시각 피질로 직접 투영합니다. 그 결과 전 전자기 스펙트럼에 걸쳐 거의 즉각적인 상황 인식을 얻습니다."
 afs_drone_2: "자율 화력 지원 드론 II"
 afs_drone_2_desc: "개량된 화력 지원 드론은 네트워크 팀으로 운용되며 보병, 기갑, 포병 부대와 센서 데이터를 공유하여 위협을 식별하고, 적 진지를 제압하며, 분쟁 지형을 통과하는 진격을 지원합니다."
 afs_drone_3: "자율 화력 지원 드론 III"
 afs_drone_3_desc: "고급 화력 지원 드론은 복원력 있는 통신, 탑재 표적 인식, 제한적인 군집 조율을 사용하여 경계 임무를 유지하고, 전장 데이터를 중계하며, 인간의 지휘하에 신속한 지원 사격을 가합니다."
 afs_drone_4: "자율 화력 지원 드론 IV"
 afs_drone_4_desc: "통합 드론 지원 체계는 공중 및 지상 로봇 플랫폼을 조율된 화력 팀으로 결합하여, 기동 부대가 측면을 차단하고 매복을 폭로하며 방어가 견고한 표적을 병력 노출을 줄인 채 타격할 수 있게 합니다."
 afs_drone_5: "자율 화력 지원 드론 V"
 afs_drone_5_desc: "미래의 자율 화력 지원 네트워크는 AI가 지휘하는 군집, 협동 표적 지정, 적응형 전장 경로 설정을 사용하여 일반 지상 편제에 지속적인 정찰, 제압, 정밀 사격을 제공합니다."
 special_forces_tech_7: "미래 특수 부대 II"
 special_forces_tech_7_desc: "개량된 미래 특수 부대는 인간-기계 협동, 자율 정찰 체계, AI 보조 임무 계획을 사용하여 상황 인식을 높이고, 노출을 줄이며, 여러 영역에 걸친 복잡한 급습을 조율합니다."
 special_forces_tech_8: "초첨단 특수 부대"
 special_forces_tech_8_desc: "초첨단 특수 부대는 적응형 위장, 로봇 지원 플랫폼, 복원력 있는 전장 네트워크, 강화된 운용자 장비를 결합하여 기술적으로 앞선 적을 상대로 종심 작전을 수행합니다."
 special_forces_tech_9: "초첨단 특수 부대 II"
 special_forces_tech_9_desc: "특수 작전의 추가 발전은 분산 팀, 드론 군집, 전자전 지원, 실시간 센서 융합을 강조하여, 운용자가 철저히 감시되는 전장 공간 안에서 타격하고, 회피하고, 생존할 수 있게 합니다."
 special_forces_tech_10: "극초첨단 특수 부대"
 special_forces_tech_10_desc: "극초첨단 특수 부대는 AI가 조율하는 지원 체계, 자율 물류, 증강현실 지휘 도구, 첨단 의료 감시를 사용하여 전통적인 지원 네트워크를 훨씬 넘어서는 정예 작전을 지속합니다."
 special_forces_tech_11: "극초첨단 특수 부대 II"
 special_forces_tech_11_desc: "가장 발전된 특수 부대는 네트워크로 연결된 인간-기계 팀으로 작전하며, 정예 훈련, 자율 체계, 사이버 효과, 예측 정보를 결합하여 적대적이고 센서가 포화된 환경에서 정밀 작전을 수행합니다."
 body_armor_5: "강화 전술 강습복"
 body_armor_5_desc: "나노물질 복합재의 발전으로 이전의 세라믹 방식보다 훨씬 가벼우면서도 더 단단한 방탄판이 만들어집니다. 이제 전신을 덮는 모듈식 체계가 기동성을 크게 해치지 않고 팔다리까지 보호합니다."
 body_armor_6: "최첨단 강습복"
 body_armor_6_desc: "스마트 방호복은 충격 센서와 반응층을 조끼 직물에 엮어 넣어, 접촉 시 해당 부위가 단단해지고 운동 에너지를 더 효과적으로 분산시킵니다. 통합 생체 감시는 부상자를 실시간으로 의무병에게 알려 줍니다."
 body_armor_7: "AI 방호복 통합"
 body_armor_7_desc: "그래핀 강화 판은 전례 없는 경도 대 중량비를 제공하여 이전 세대라면 관통당했을 고속 철갑탄을 막아 냅니다. 방호복에 내장된 능동 냉각 체계는 극한 기후에서도 운용자가 제 기량을 발휘하게 합니다."
 body_armor_8: "초첨단 방호복"
 body_armor_8_desc: "동력식 반응 장갑은 내장된 마이크로 작동기를 사용하여 날아오는 발사체를 충격 순간에 능동적으로 튕겨 냅니다. 자가 봉합 외상 방지층과 결합하여, 전장 위협에 대한 생존성이 이전에는 경차량에 국한되던 수준에 이릅니다."
 body_armor_9: "극초첨단 방호복"
 body_armor_9_desc: "전신 적응형 방호복은 전자기 경화, 탄도 복합재, 화생방 여과를 하나의 밀폐 체계로 통합합니다. 병사는 사실상 개인 전투 차량 속에 들어앉은 셈입니다."
 exoskeleton_3: "강화 작전복"
 exoskeleton_3_desc: "3세대 외골격은 일반 보병이 야전에서 장시간 사용할 수 있을 만큼 가볍습니다. 개선된 작동기와 배터리 지속 시간 덕분에 병사들은 피로로 인한 불이익 없이 중화기와 추가 장갑을 운반할 수 있습니다."
 exoskeleton_4: "초첨단 외골격"
 exoskeleton_4_desc: "AI 기반 동작 예측은 슈트를 운용자 신체의 자연스러운 연장처럼 느끼게 하여, 증강되지 않은 병사로서는 따라갈 수 없는 속도로 질주, 등반, 근접전을 가능하게 합니다. 통합 전원 셀은 재충전 없이 여러 날 동안의 작전을 지속시킵니다."
 exoskeleton_5: "극초첨단 외골격"
 exoskeleton_5_desc: "동력 외골격의 최종 진화는 보병과 장갑차량의 경계를 허뭅니다. 신경 인터페이스 조종, 자가 수리 구조 복합재, 탑재 무기 거치대는 한때 전담 기갑 부대의 몫이던 위협을 상대할 수 있는 1인 운용 플랫폼을 만들어 냅니다."
 camouflage_6: "능동 열 위장"
 camouflage_6_desc: "능동 열 위장은 제어 가능한 표면 소재와 열 관리층을 사용하여 적외선 방출을 변화시켜, 장갑차량과 장비를 갖춘 보병이 주변의 열 환경과 더 잘 섞이도록 합니다."
 camouflage_7: "센서 기만 위장"
 camouflage_7_desc: "센서 기만 위장은 다중 스펙트럼 소재, 형상 교란, 전자 신호 통제를 결합하여 드론, 조준 광학 장치, 레이더 보조 센서, 자동 인식 체계를 혼란시킵니다."
 camouflage_8: "통합 적응형 위장"
 camouflage_8_desc: "통합 적응형 위장은 스마트 소재, 열 조절, 시각 무늬 통제, 전장 센서 데이터를 연결하여 여러 센서 유형에 걸쳐 보병, 차량, 장비의 탐지 가능한 신호를 지속적으로 줄입니다."
 mbt_tech_5: "초고도 첨단 장갑 차체"
 mbt_tech_5_desc: "초고도 첨단 장갑 차량 차체."
 mbt_tech_6: "극고도 첨단 장갑 차체"
 mbt_tech_6_desc: "극고도 첨단 장갑 차량 차체."
 tank_components_tech_6: "초고도 첨단 차량 컴퓨터 시스템"
 tank_components_tech_6_desc: "3D 시각화, 가상 전장, 최신 기술 및 통신 체계, 개선된 탐지 알고리즘은 우리의 하드킬 기술을 향상시킬 수 있게 해 줄 것입니다."
 tank_components_tech_7: "극고도 첨단 차량 컴퓨터 시스템"
 tank_components_tech_7_desc: "3D 시각화, 가상 전장, 최신 기술 및 통신 체계, 개선된 탐지 알고리즘은 우리의 하드킬 기술을 향상시킬 수 있게 해 줄 것입니다."
 era_tech_5: "5세대 반응 장갑(ERA)"
 era_tech_5_desc: "다양한 환경 조건에서 작동할 수 있고 대부분의 피격 화력의 효율을 감소시킬 수 있는 매우 발전된 형태의 반응 장갑(ERA)."
 era_tech_6: "6세대 반응 장갑(ERA)"
 era_tech_6_desc: "다양한 환경 조건에서 작동할 수 있고 대부분의 피격 화력의 효율을 감소시킬 수 있는 가장 발전된 형태의 반응 장갑(ERA)."
 armor_tech_5: "초고도 첨단 장갑"
 armor_tech_5_desc: "고도로 정교한 장갑 개량."
 armor_tech_6: "극고도 첨단 장갑"
 armor_tech_6_desc: "고도로 정교한 장갑 개량."
 nera_armor_tech_4: "4세대 NERA"
 nera_armor_tech_4_desc: "최첨단 소재와 혁신적인 구성을 활용하여 광범위한 위협에 대해 우수한 방어력을 제공하는 고급형 비폭발성 반응 장갑(NERA)."
 nera_armor_tech_5: "5세대 NERA"
 nera_armor_tech_5_desc: "최첨단 소재와 혁신적인 구성을 활용하여 광범위한 위협에 대해 우수한 방어력을 제공하는 고급형 비폭발성 반응 장갑(NERA)."
 diesel_engine_tech_8: "초고도 디젤 엔진"
 diesel_engine_tech_8_desc: "향상된 연료 효율성, 전산화된 엔진 제어 및 첨단 소재를 통해 미래의 엔진은 강력하면서도 경량화된 형태를 갖출 수 있습니다."
 diesel_engine_tech_9: "초첨단 디젤 엔진"
 diesel_engine_tech_9_desc: "향상된 연료 효율성, 전산화된 엔진 제어 및 첨단 소재를 통해 미래의 엔진은 강력하면서도 경량화된 형태를 갖출 수 있습니다."
 tech_tank_nuclear_engine_3: "핵 전차 엔진 IV"
 tech_tank_nuclear_engine_3_desc: "소형 모듈식 원자로 설계는 차폐 중량을 대폭 줄이면서 열효율을 향상시켜, 더 다양한 차체에서 원자력 추진 차량을 실용적으로 만듭니다. 자동화된 안전 시스템과 현장 교체가 가능한 연료 모듈은 전방 작전 지역에서의 정비를 단순화합니다."
 tech_tank_nuclear_engine_4: "핵 전차 엔진 V"
 tech_tank_nuclear_engine_4_desc: "4세대 마이크로 원자로는 정비 주기가 거의 필요 없는 수준에 이르며, 지향성 에너지 무기와 능동 방어 시스템을 동시에 구동하기에 충분한 잉여 전력을 생산합니다. 이러한 엔진을 장비한 기갑 부대는 보급선 없이 무기한 작전할 수 있으며, 이는 작전 계획을 근본적으로 바꿔 놓습니다."
 turbine_engine_tech_7: "고급 외골격 엔진"
 turbine_engine_tech_7_desc: "첨단 소재를 통해 가스터빈의 마찰을 낮출 수 있으며, 이로써 출력과 연료 효율이 향상됩니다."
 turbine_engine_tech_8: "최첨단 외골격 엔진"
 turbine_engine_tech_8_desc: "첨단 소재를 통해 가스터빈의 마찰을 낮출 수 있으며, 이로써 출력과 연료 효율이 향상됩니다."
 electric_engine_tech_5: "향상된 전기 엔진"
 electric_engine_tech_5_desc: "신뢰성이 향상된 전기 엔진의 개선형 모델입니다."
 electric_engine_tech_6: "최첨단 전기 엔진"
 electric_engine_tech_6_desc: "신뢰성이 향상된 전기 엔진의 개선형 모델입니다."
 defensive_systems_6: "고급 방어 시스템"
 defensive_systems_6_desc: "고급 방어 수단을 통해 차량의 생존성을 높이는 데 중점을 둔 차세대 방어 기술."
 defensive_systems_7: "최첨단 방어 시스템"
 defensive_systems_7_desc: "고급 방어 수단을 통해 차량의 생존성을 높이는 데 중점을 둔 차세대 방어 기술."
 tank_ammo_1: "냉전 초기 탄약"
 tank_ammo_1_desc: "냉전 초기에 개발된 탄약으로, 전장의 다양한 표적을 효과적으로 상대하도록 설계되었습니다. 이 탄은 관통력과 파편 효과 사이의 균형을 제공하며 당시의 전투 상황에 적합합니다."
 tank_ammo_2: "냉전기 탄약"
 tank_ammo_2_desc: "냉전기에 광범위한 위협에 대응하도록 설계된 탄약입니다. 이 탄은 개선된 관통력과 파편 효과를 갖추어, 냉전 시대의 전투 상황에서 보병과 기갑 표적 모두를 효과적으로 상대할 수 있습니다."
 tank_ammo_3: "현대 탄약"
 tank_ammo_3_desc: "현대전을 위해 개발된 최신 탄약입니다. 이 탄은 관통력, 파편 효과, 범위 효과를 높이는 첨단 기술을 적용하여 현대 전장의 다양한 표적에 대한 최대의 효과를 보장합니다."
 tank_ammo_4: "개량형 탄약"
 tank_ammo_4_desc: "가까운 미래를 위해 설계된 혁신적인 탄약입니다. 이 탄은 최첨단 기술을 활용하여 우수한 관통력, 파편 효과, 범위 효과를 제공하며 진화하는 위협에 대해 최적의 성능을 보장합니다."
 tank_ammo_5: "고급 탄약"
 tank_ammo_5_desc: "먼 미래를 위해 설계된 혁명적인 탄약입니다. 이 탄은 비할 데 없는 관통력, 파편 효과, 범위 효과를 위한 획기적인 기술을 적용하여 미래 전장의 가장 발전된 표적에도 파괴적인 충격을 보장합니다."
 tank_ammo_6: "매우 고급 탄약"
 tank_ammo_6_desc: "먼 미래를 위해 설계된 혁명적인 탄약입니다. 이 탄은 비할 데 없는 관통력, 파편 효과, 범위 효과를 위한 획기적인 기술을 적용하여 미래 전장의 가장 발전된 표적에도 파괴적인 충격을 보장합니다."
 tank_ammo_7: "최첨단 탄약"
 tank_ammo_7_desc: "먼 미래를 위해 설계된 혁명적인 탄약입니다. 이 탄은 비할 데 없는 관통력, 파편 효과, 범위 효과를 위한 획기적인 기술을 적용하여 미래 전장의 가장 발전된 표적에도 파괴적인 충격을 보장합니다."
 tank_ammo_8: "초고도 첨단 탄약"
 tank_ammo_8_desc: "먼 미래를 위해 설계된 혁명적인 탄약입니다. 이 탄은 비할 데 없는 관통력, 파편 효과, 범위 효과를 위한 획기적인 기술을 적용하여 미래 전장의 가장 발전된 표적에도 파괴적인 충격을 보장합니다."
 tank_ammo_9: "극고도 첨단 탄약"
 tank_ammo_9_desc: "먼 미래를 위해 설계된 혁명적인 탄약입니다. 이 탄은 비할 데 없는 관통력, 파편 효과, 범위 효과를 위한 획기적인 기술을 적용하여 미래 전장의 가장 발전된 표적에도 파괴적인 충격을 보장합니다."
 anti_infantry_tank_ammo_1: "냉전 초기 대보병 탄약"
 anti_infantry_tank_ammo_1_desc: "냉전 초기에 보병 표적을 효과적으로 상대하고 무력화하도록 설계된 특수 탄약입니다. 이 탄은 파편 효과와 범위 효과에 최적화되어 적 병력에 대한 충격을 극대화합니다."
 anti_vehicle_tank_ammo_1: "냉전 초기 대차량 탄약"
 anti_vehicle_tank_ammo_1_desc: "냉전 초기에 적 차량에 대응하기 위해 개발된 탄약입니다. 이 탄은 강화된 관통 능력을 갖추어 전차와 장갑 수송차 같은 장갑 표적을 효과적으로 상대하고 손상시킬 수 있습니다."
 anti_infantry_tank_ammo_2: "냉전기 대보병 탄약"
 anti_infantry_tank_ammo_2_desc: "냉전기에 보병 표적을 효과적으로 상대하고 무력화하기 위해 개발된 고급 탄약입니다. 이 탄은 개선된 파편 효과와 범위 효과를 갖추어 적 병력에 대한 충격을 극대화합니다."
 anti_vehicle_tank_ammo_2: "냉전기 대차량 탄약"
 anti_vehicle_tank_ammo_2_desc: "냉전기에 적 차량에 대응하기 위해 설계된 특수 탄약입니다. 이 탄은 강화된 관통 능력을 갖추어 전차와 장갑 수송차 같은 장갑 표적을 효과적으로 상대하고 손상시킬 수 있습니다."
 anti_infantry_tank_ammo_3: "현대 대보병 탄약"
 anti_infantry_tank_ammo_3_desc: "현대전에서 보병 표적을 효과적으로 상대하고 무력화하도록 설계된 최신 탄약입니다. 이 탄은 고급 파편 효과와 범위 효과 능력을 갖추어 적 병력에 대한 충격을 극대화합니다."
