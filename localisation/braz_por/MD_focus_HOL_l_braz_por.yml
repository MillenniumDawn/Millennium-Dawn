 HOL_radicaal_populisme:0 "Populismo Radical"
 HOL_fortuyn_centre_balance:0 "Fortuynismo Equilibrado"
 HOL_fortuyn_centre_balance_desc:0 "O rumo político está equilibrado entre o pragmatismo reformista e a energia populista. Estabilidade, continuidade política e engajamento cívico definem esse meio-termo."
 HOL_pragmatisch_fortuynisme_high:0 "Domínio do Fortuynismo Pragmático"
 HOL_pragmatisch_fortuynisme_high_desc:0 "A tecnocracia e a reforma institucional dominam a agenda. A retórica populista foi atenuada em favor de uma abordagem serena, orientada por políticas públicas."
 HOL_pragmatisch_fortuynisme_medium:0 "Política Orientada à Governança"
 HOL_pragmatisch_fortuynisme_medium_desc:0 "O foco está na reforma estrutural, na descentralização e na transparência. O LPF traça um rumo estável de liderança racional."
 HOL_pragmatisch_fortuynisme_low:0 "Pragmatismo Moderado"
 HOL_pragmatisch_fortuynisme_low_desc:0 "O Fortuynismo Pragmático tem ligeira vantagem, mas os pedidos por políticas mais confrontacionais e populistas ganham força entre a base."
 HOL_pragmatisch_fortuynisme_edge:0 "Equilíbrio Delicado com o Populismo"
 HOL_pragmatisch_fortuynisme_edge_desc:0 "O partido anda numa linha tênue entre a contenção política e o apelo populista. Cresce a pressão pública por uma retórica mais forte."
 HOL_radicaal_populisme_high:0 "Ascensão do Populismo Radical"
 HOL_radicaal_populisme_high_desc:0 "O partido abraçou por completo uma agenda antiestablishment. Retórica confrontacional, revivalismo cultural e sentimento antielite definem a nova identidade do LPF."
 HOL_radicaal_populisme_medium:0 "Impulso Populista"
 HOL_radicaal_populisme_medium_desc:0 "O LPF canaliza o descontentamento público em ação. As estruturas tradicionais de governança são desafiadas por dentro."
 HOL_radicaal_populisme_low:0 "Populismo Emergente"
 HOL_radicaal_populisme_low_desc:0 "A influência populista aumenta, embora o partido ainda mantenha alguma cautela institucional. O debate interno esquenta."
 HOL_radicaal_populisme_edge:0 "Tensão com o Pragmatismo"
 HOL_radicaal_populisme_edge_desc:0 "Os elementos populistas estão em ascensão, mas a liderança do LPF hesita em abandonar por completo as bases pragmáticas."
 HOL_pvda_modernize_party_policies:0 "Modernizar as Políticas do Partido"
 HOL_pvda_modernize_party_policies_desc:0 "Adota políticas sobre ambientalismo, inovação digital e inclusão, atraindo eleitores mais jovens e progressistas urbanos."
 HOL_pvda_promote_urban_investments:0 "Promover Investimentos Urbanos"
 HOL_pvda_promote_urban_investments_desc:0 "Foca em infraestrutura, habitação e iniciativas verdes nos centros urbanos, fortalecendo o apelo do partido nas cidades."
 HOL_pvda_focus_climate_policy:0 "Focar na Política Climática"
 HOL_pvda_focus_climate_policy_desc:0 "Defende reformas climáticas ambiciosas, priorizando energia renovável e investimentos na indústria verde."
 HOL_pvda_strengthen_union_influence:0 "Fortalecer a Influência dos Sindicatos"
 HOL_pvda_strengthen_union_influence_desc:0 "Fortalece os sindicatos, ampliando sua influência sobre as políticas trabalhistas e a tomada de decisões."
 HOL_pvda_promote_rural_investments:0 "Focar no Desenvolvimento Rural"
 HOL_pvda_promote_rural_investments_desc:0 "Destina recursos para apoiar comunidades rurais e indústrias tradicionais, apelando às raízes operárias do partido."
 HOL_pvda_social_housing_initiative:0 "Expandir as Iniciativas de Habitação Social"
 HOL_pvda_social_housing_initiative_desc:0 "Investe pesadamente em habitação social para enfrentar a desigualdade e o congestionamento urbano, com foco em bairros de baixa renda."
 HOL_pvda_private_energy_investments:0 "Incentivar o Investimento Privado em Energia"
 HOL_pvda_private_energy_investments_desc:0 "Privatiza partes do setor energético para atrair capital, priorizando a eficiência econômica em vez de metas verdes."
 HOL_pvda_climate_action_plan:0 "Plano de Ação Climática"
 sp_dutch_super_bus_project:0 "Superônibus"
 sp_dutch_super_bus_project_desc:0 "O Experimento Superbus é um projeto holandês de ponta, criado para transformar o transporte público por meio da inovação e da sustentabilidade. O projeto visa desenvolver um veículo de passageiros elétrico e de alta velocidade, capaz de atingir 250 km/h. Construído em fibra de carbono leve, o Superbus une viagens luxuosas e eficiência, permitindo trânsito rápido entre regiões-chave."
 sp_dutch_super_bus_project_daf_reward_work_with_DAF:0 "Cooperar com a DAF"
 sp_dutch_super_bus_project_daf_reward_work_NOT_with_DAF:0 "Recusar trabalhar com a DAF"
