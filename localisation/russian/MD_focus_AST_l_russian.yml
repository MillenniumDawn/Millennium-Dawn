 five_eyes_technology_sharing_group_desc: "Партнерство по обмену технологиями между Австралией, Канадой, Новой Зеландией, Великобританией и Соединенными Штатами, направленное на инновации в сфере обороны и безопасности."
 memories_of_howard: "Воспоминания о Говарде"
 memories_of_howard_desc: "Он не умер, но воспоминания о пребывании Джона Ховарда на посту премьер-министра до сих пор живут в памяти многих. Подражание образу «Короля-борца» могло бы принести нам немного доброй воли среди рабочего класса и необходимое влияние в парламенте."
 nuclear_restrictions_lifted_ast: "Ядерные ограничения сняты."
 paved_urban_roads: "Асфальтированные соединительные дороги"
 paved_urban_roads_desc: "Дороги всего в нескольких минутах езды от Дарвина покрыты галькой или грунтом. Для удовлетворения потребностей компаний в грузоперевозках нам необходимо это исправить."
 channel_island_power_plant: "Газовая электростанция на острове Ченнел"
 channel_island_power_plant_desc: "Расширение предприятия с целью установки гибких газовых турбин General Electric и Rolls-Royce позволит удовлетворить возросшие потребности в электроэнергии."
 uterne_solar_power_plant: "Солнечная электростанция Утерне"
 uterne_solar_power_plant_desc: "Планируется, что эта электростанция, первая в своем роде, будет построена недалеко от города Алис-Спрингс и втрое увеличит энергоснабжение региона."
 expand_port_darwin: "Развернуть Порт-Дарвин"
 expand_port_darwin_desc: "Если север страны хочет стать экспортным мегаполисом, порт должен это отражать. Из него будут вывозиться тысячи тонн продукции, и инфраструктура должна быть готова."
 nt_airport_upgrades: "Модернизация аэропорта Северной территории"
 nt_airport_upgrades_desc: "План модернизации аэропортов в Дарвине и Алис-Спрингс, предусматривающий строительство новых площадок для хранения самолетов и расширение взлетно-посадочных полос."
 pastoral_lease_framework: "Рамочная программа пастушеской аренды"
