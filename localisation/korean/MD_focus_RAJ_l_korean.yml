 RAJ_buddhist_opinion_tt: "§Y불교도§! 관계: $RIGHT|+=0$"
 RAJ_PAK_border_conflict_category: "인도 파키스탄 국경 분쟁"
 RAJ_PAK_border_conflict_category_desc: "[RAJ.GetNameDefCap]와(과) [PAK.GetNameDefCap]은(는) 잠무 카슈미르와 고도로 군사화된 국경선을 둘러싸고 여전히 대립하고 있습니다. 훈련, 월경, 포격전은 제한적 충돌이나 외교 위기로 번질 수 있습니다. 진행도는 분쟁 중인 각 주별로 따로 집계됩니다.\n\n$border_readiness_RAJ$: [?RAJ.pak_raj_border_readiness|Y0]\n$border_readiness_PAK$: [?PAK.pak_raj_border_readiness|Y0]\n$pak_raj_border_tension$: [?global.pak_raj_border_tension|Y0]\n\n§Y국경 주§! (영유권을 행사하려면 영유권 진행도 80 필요):\n[420.Owner.GetFlag] [420.GetName]: [?THIS.pak_raj_border_progress_420|Y0]\n[427.Owner.GetFlag] [427.GetName]: [?THIS.pak_raj_border_progress_427|Y0]\n[429.Owner.GetFlag] [429.GetName]: [?THIS.pak_raj_border_progress_429|Y0]\n[563.Owner.GetFlag] [563.GetName]: [?THIS.pak_raj_border_progress_563|Y0]\n[573.Owner.GetFlag] [573.GetName]: [?THIS.pak_raj_border_progress_573|Y0]\n[426.Owner.GetFlag] [426.GetName]: [?THIS.pak_raj_border_progress_426|Y0]\n[987.Owner.GetFlag] [987.GetName]: [?THIS.pak_raj_border_progress_987|Y0]\n[984.Owner.GetFlag] [984.GetName]: [?THIS.pak_raj_border_progress_984|Y0]\n\n군은 한 번에 국경 주 하나를 우리의 활성 구역으로 지정하며, 모든 준비는 그곳에서 진행됩니다. 현재 준비가 끝나면 우리가 통제하는 국경 주 중에서 새로운 구역이 지정됩니다."
 RAJ_CHI_border_conflict_category: "중국 인도 국경 분쟁"
 RAJ_CHI_border_conflict_category_desc: "[RAJ.GetNameDefCap]와(과) [CHI.GetNameDefCap]은(는) 악사이친과 라다크에서 시킴, 아루나찰프라데시에 이르기까지 실질 통제선의 여러 구간을 두고 다투고 있습니다. 작전에는 현지 병력이 필요하며, 전투가 벌어진 주에 대해서만 기세가 쌓입니다.\n\n$border_readiness_RAJ$: [?RAJ.raj_chi_border_readiness|Y0]\n$border_readiness_CHI$: [?CHI.raj_chi_border_readiness|Y0]\n$raj_chi_border_tension$: [?global.raj_chi_border_tension|Y0]\n\n§Y국경 주§! (영유권을 행사하려면 영유권 진행도 80 필요):\n[475.Owner.GetFlag] [475.GetName]: [?THIS.raj_chi_border_progress_475|Y0]\n[982.Owner.GetFlag] [982.GetName]: [?THIS.raj_chi_border_progress_982|Y0]\n[591.Owner.GetFlag] [591.GetName]: [?THIS.raj_chi_border_progress_591|Y0]\n[993.Owner.GetFlag] [993.GetName]: [?THIS.raj_chi_border_progress_993|Y0]\n\n군은 한 번에 국경 주 하나를 우리의 활성 구역으로 지정하며, 모든 준비는 그곳에서 진행됩니다. 현재 준비가 끝나면 우리가 통제하는 국경 주 중에서 새로운 구역이 지정됩니다."
 border_war_axis_requirements_tt: "출발 주를 소유하고 통제해야 하며, 그곳에 최소 사단 1개를 주둔시키고, 목표 주에서 상대국과 대치해야 합니다. 이 조건은 준비가 끝날 때 다시 확인됩니다."
 border_war_capture_requirements_tt: "상대국이 목표 주를 소유하고 통제하는 동안, 인접한 출발 주를 사단 1개 이상으로 확보하고 있어야 합니다. 이 조건은 작전이 끝날 때 다시 확인됩니다."
 border_war_negotiate_opinion_tt: "양국은 서로에 대해 최소 §Y25의 관계§!를 가지고 있어야 합니다"
