 ukraine_varyag.1.name: "$ukraine_varyag.2.name$"
 ukraine_varyag.1.a: "Рассмотреть решения по флоту"
 ukraine_varyag.2.name: "§Y«Варяг»§! задержан"
 ukraine_varyag.2.desc: "§WНедостроенный §!§Y«Варяг»§!§W вышел из §!§YНиколаева§!§W на буксире по заказу компании §!§L«Чонг Лот»§!§W, которая заявляет, что собирается открыть плавучее казино в §!§YМакао§!§W. §!§Y[TUR.GetNameWithFlag]§!§W §!§Rне даёт разрешения§!§W на проход через проливы, ссылаясь на опасность буксировки несамоходного судна и вопросы по §!§YКонвенции Монтрё§!§W.§!"
 ukraine_varyag.2.desc_ukraine: "§Y[TUR.GetNameWithFlag]§!§W остановила §!§Y«Варяг»§!§W на подходах к §!§YБосфору§!§W. Наши флотоводцы называют задержку знаком свыше и призывают расторгнуть сделку, пока корпус ещё в §!§YЧёрном море§!§W. Инженеры в §!§YНиколаеве§!§W могут обследовать его и сказать, что нужно, чтобы достроить его для нашего флота.§!"
 ukraine_varyag.2.a: "Рассмотреть возможные варианты"
 ukraine_varyag.4.name: "§Y[CHI.GetNameWithFlag]§! просит пропустить корабль"
 ukraine_varyag.4.desc: "§Y[CHI.GetNameWithFlag]§!§W готов оплатить контролируемую буксировку через §!§YБосфор§!§W и §!§YДарданеллы§!§W. Его переговорщики также предложили меньшую сумму вместе с технической помощью в нашей программе мобильных ракетных комплексов.§!"
 ukraine_varyag.4.a: "§GПринять§! полную оплату"
 ukraine_varyag.4.b: "§GПринять§! оплату и помощь с ракетами"
 ukraine_varyag.4.c: "§RЗапретить проход§! и закрыть вопрос"
 ukraine_varyag.5.name: "§Y«Варяг»§! прибывает в §Y[CHI.GetNameWithFlag]§!"
 ukraine_varyag.5.desc: "§WБуксиры §!§Gдоставили недостроенный авианосец§!§W. Теперь наши корабельные инженеры могут сверить корпус с чертежами и спланировать переоборудование в §!§YДаляне§!§W.§!"
 ukraine_varyag.5.a: "Отправить на борт наших инженеров"
 ukraine_varyag.6.name: "§Y[TUR.GetNameWithFlag]§! предлагает совместное переоборудование"
 ukraine_varyag.6.desc: "§Y[TUR.GetNameWithFlag]§!§W предлагает возместить расходы покупателю и забрать корпус в §!§YГёльджюк§!§W. §!§LЧерноморский судостроительный завод§!§W и наши конструкторские бюро выполнили бы по контракту инженерные работы и поставили бы комплектующие.§!"
 ukraine_varyag.6.a: "§GПринять§! судостроительный контракт"
 ukraine_varyag.6.b: "Оставить в силе текущую сделку"
 ukraine_varyag.7.name: "§Y«Варяг»§! проходит §YБосфор§!"
 ukraine_varyag.7.desc: "§WДвижение остановлено, буксиры сопровождения на местах: §!§Y«Варяг»§!§W §!§Gначал проход§!§W через проливы. По первоначальной сделке буксир направляется в §!§Y[CHI.GetNameWithFlag]§!§W.§!"
 ukraine_varyag.7.a: "Пусть буксировка продолжается"
 ukraine_varyag.8.name: "§Y«Варяг»§! возвращается в §YНиколаев§!"
 ukraine_varyag.8.desc: "§Y[UKR.GetNameWithFlag]§!§W возместила расходы покупателю и заплатила §!§Y[TUR.GetNameWithFlag]§!§W за организацию буксировки. Недостроенный авианосец §!§Gснова§!§W на §!§LЧерноморском судостроительном заводе§!§W.§!"
 ukraine_varyag.8.a: "Принять к сведению возвращение"
 ukraine_varyag.9.name: "§Y«Варяг»§! вступает в строй"
 ukraine_varyag.9.desc: "§WВерфь завершила переоборудование, и флот §!§Gпринял авианосец§!§W. Его экипаж может начать палубные испытания, а опыт верфи §!§Gпригодится при проектировании следующего авианосца§!§W.§!"
 ukraine_varyag.9.desc_ukraine: "$ukraine_varyag.9.desc$§W Для палубных испытаний флот также §!§Gполучает два§! учебных §YСу-25УТГ§!§W и §!§Gодин§! §YСу-33§!§W производства §!§Y[SOV.GetNameWithFlag]§!§W.§!"
 ukraine_varyag.9.a: "Ввести корабль в строй"
 ukraine_varyag.10.name: "§Y«Варяг»§! для нас потерян"
 ukraine_varyag.10.desc: "§WПопытка доставить §!§Y«Варяг»§!§W в §!§Y[CHI.GetNameWithFlag]§!§W §!§Rпровалилась§!§W. Наши инженеры §!§Gзаполучили копию чертежей§!§W и могут изучить по ней компоновку авианосца.§!"
 ukraine_varyag.10.a: "Пустить чертежи в работу"
 ukraine_varyag.11.name: "Предложение по §Y«Варягу»§! отклонено"
 ukraine_varyag.11.desc: "§Y[UKR.GetNameWithFlag]§!§W §!§Rотклонила наши условия§!§W. Недостроенный авианосец остаётся в §!§YЧёрном море§!§W, пока продолжается спор о проходе.§!"
 ukraine_varyag.11.a: "Ждать развития событий"
 ukraine_varyag.13.name: "§Y[TUR.GetNameWithFlag]§! отказывает в проходе"
 ukraine_varyag.13.desc: "§WПереговоры между §!§Y[TUR.GetNameWithFlag]§!§W и §!§Y[CHI.GetNameWithFlag]§!§W §!§Rзашли в тупик§!§W. Власти отказали в проходе и исключили покупку авианосца. Они организуют буксировку обратно в §!§YНиколаев§!§W, если мы возместим расходы покупателю и оплатим буксировку.§!"
 ukraine_varyag.13.a: "Подумать о возвращении корпуса домой"
 ukraine_varyag.14.name: "Электроника для §Y«Варяга»§!"
 ukraine_varyag.14.desc: "§WПо итогам обследования рекомендуется сохранить паротурбинную установку. Верфь может восстановить электронику типа §!§Y«Фрегат»§!§W из имеющегося оборудования или заказать комплекс §!§YSMART-S§!§W у §!§L$FRA_thales_manufacturer$§!§W. Для закупки требуются мир с §!§Y[FRA.GetNameWithFlag]§!§W и мнение её правительства о нас не ниже §!§Y+30§!§W.§!"
 ukraine_varyag.14.a: "Восстановить оборудование типа §Y«Фрегат»§!"
 ukraine_varyag.14.b: "Закупить комплекс §YSMART-S§!"
 ukraine_varyag.15.name: "Вооружение для §Y«Варяга»§!"
 ukraine_varyag.15.desc: "§WАвианосцу нужны артиллерийские комплексы ближней обороны и ПВО малой дальности. Верфь может восстановить установки §!§YАК-630§!§W и пусковые установки §!§Y«Кинжал»§!§W из имеющихся запасов или закупить системы §!§YPhalanx§!§W и §!§YSea Sparrow§!§W. Для закупки требуются мир с §!§Y[USA.GetNameWithFlag]§!§W и мнение правительства этой страны о нас не ниже §!§Y+30§!§W.§!"
 ukraine_varyag.15.a: "Установить §YАК-630§! и §Y«Кинжал»§!"
 ukraine_varyag.15.b: "Установить §YPhalanx§! и §YSea Sparrow§!"
 ukraine_varyag.16.name: "§YЯк-38§! возвращаются в строй"
 ukraine_varyag.16.desc: "§WИнженеры восстановили §!§G6§!§W хранившихся планеров §!§YЯк-38§!§W для первой авиагруппы авианосца. Самолёты могут начать лётную подготовку к палубным операциям на §!§Y«Варяге»§!§W.§!"
 ukraine_varyag.16.a: "Принять восстановленные самолёты"
 ukraine_varyag.17.name: "§Y[UKR.GetNameWithFlag]§! просит истребители §YRafale M§!"
 ukraine_varyag.17.desc: "§Y[UKR.GetNameWithFlag]§!§W хочет купить двенадцать истребителей §!§YRafale M§!§W для своего §!§Y«Варяга»§!§W с катапультами. §!§L$FRA_dassault_aviation_aircraft_manufacturer$§!§W готова поставить самолёты, если мы одобрим контракт.§!"
 ukraine_varyag.17.a: "§GРазрешить§! продажу"
 ukraine_varyag.17.b: "§RОтклонить§! запрос"
 ukraine_varyag.18.name: "Истребители §YRafale M§! прибыли"
 ukraine_varyag.18.desc: "§Y[FRA.GetNameWithFlag]§!§W одобрила контракт и §!§Gпоставила 12§! истребителей §YRafale M§!§W для §!§Y«Варяга»§!§W.§!"
 ukraine_varyag.18.a: "Включить их в авиагруппу"
 ukraine_varyag.19.name: "§Y[UKR.GetNameWithFlag]§! просит истребители §YМиГ-29К§!"
 ukraine_varyag.19.desc: "§Y[UKR.GetNameWithFlag]§!§W хочет получить двенадцать истребителей §!§YМиГ-29К§!§W для взлёта с трамплина на §!§Y«Варяге»§!§W. §!§LРСК «МиГ»§!§W может поставить самолёты, если мы одобрим экспорт.§!"
 ukraine_varyag.19.a: "§GРазрешить§! продажу"
 ukraine_varyag.19.b: "§RОтклонить§! запрос"
 ukraine_varyag.20.name: "Истребители §YМиГ-29К§! прибыли"
 ukraine_varyag.20.desc: "§Y[SOV.GetNameWithFlag]§!§W одобрила контракт и §!§Gпоставила 12§! истребителей §YМиГ-29К§!§W для §!§Y«Варяга»§!§W.§!"
 ukraine_varyag.20.a: "Включить их в авиагруппу"
 ukraine_varyag.21.name: "Заказ самолётов отклонён"
 ukraine_varyag.21.desc: "§WПравительство страны-поставщика §!§Rотклонило§!§W заказ палубных истребителей. Флот пересмотрит планы по авиагруппе.§!"
 ukraine_varyag.21.a: "Рассмотреть наши варианты"
 ukraine_varyag.22.name: "§Y[FROM.GetNameWithFlag]§! просит §YF/A-18C Hornet§!"
 ukraine_varyag.22.desc: "§Y[FROM.GetNameWithFlag]§!§W просит продать двенадцать истребителей §!§YF/A-18C Hornet§!§W для своего §!§Y«Варяга»§!§W с катапультами. §!§L$USA_boeing_aircraft_manufacturer$§!§W может обеспечить поставку при условии нашего разрешения на экспорт.§!"
 ukraine_varyag.22.a: "§GРазрешить§! поставку"
 ukraine_varyag.22.b: "§RОтклонить§! запрос"
 ukraine_varyag.23.name: "§YF/A-18C Hornet§! прибыли"
 ukraine_varyag.23.desc: "§Y[USA.GetNameWithFlag]§!§W одобрили контракт и §!§Gпоставили 12§! истребителей §YF/A-18C Hornet§!§W для §!§Y«Варяга»§!§W.§!"
 ukraine_varyag.23.a: "Включить их в авиагруппу"
 UKR_varyag_convert_mig29_squadron: "Переоборудовать эскадрилью §YМиГ-29§! для службы на авианосце"
 UKR_varyag_convert_mig29_squadron_desc: "\n\n\n\n\n\n£UKR_desctext_varyag_air_group_for_tooltip\n\n\n\n\n\n\n\n\n§WОплатить переоборудование §!§G12§! истребителей §YМиГ-29§!§W в палубный вариант на §!§LЛьвовском государственном авиаремонтном заводе§!§W за £treasury §!§R3.00§!§W млрд. §!§Y120-дневная миссия§!§W даст нам время вернуть в резерв исходные самолёты §!§Rсоветской постройки§!§W из наших авиакрыльев. Когда все двенадцать будут на месте, они пройдут §!§Y360-дневную программу переоборудования§!§W. Если срок истечёт, средства будут §!§Gвозвращены§!§W, и мы сможем выбрать другую авиагруппу.§!"
 UKR_varyag_mig_conversion_cost: "£treasury §Y3.00§!"
 UKR_varyag_prepare_mig29_squadron: "Вернуть в резерв §Y12 МиГ-29§!"
 UKR_varyag_prepare_mig29_squadron_desc: "\n\n\n\n\n\n£UKR_desctext_varyag_air_group_for_tooltip\n\n\n\n\n\n\n\n\n§WРасформировать или сократить авиакрылья, чтобы в течение §!§Y120 дней§!§W вернуть в резерв §!§Y12 исходных МиГ-29§!§W. Миссия ежедневно проверяет модель и производителя. Когда все двенадцать будут на месте, она §!§Gзавершится автоматически§!§W, и самолёты поступят на переоборудование. Самолёты, уже находящиеся в резерве, засчитываются.§!"
 UKR_varyag_mig_airframes_reserved: "§Y12 исходных МиГ-29§! возвращены в резерв и направлены на переоборудование."
 UKR_varyag_mig_conversion_started_tt: "§Y12 МиГ-29§! направлены на §Y360-дневную§! программу переоборудования в палубный вариант."
 UKR_varyag_deck_trials: "Провести палубные испытания §Y«Варяга»§!"
 UKR_varyag_deck_trials_desc: "\n\n\n\n\n\n£UKR_desctext_varyag_air_group_for_tooltip\n\n\n\n\n\n\n\n\n§WПодготовить палубные команды к работе на §!§Y«Варяге»§!§W. Небольшого числа самолётов хватит для базовой подготовки. Эскадрилья из §!§Y12 палубных истребителей§!§W в резерве позволит провести полноценные испытания авиагруппы с §!§Gбольшей наградой опытом§!§W. Можно провести только одну программу испытаний.§!"
 UKR_varyag_commissioned: "§Y«Варяг»§! вступил в строй нашего флота."
 UKR_varyag_deck_trials_completed: "Программа палубных испытаний §Y«Варяга»§! завершена."
 UKR_varyag_combat_aircraft_tt: "В резерве не менее §Y12 палубных истребителей одного совместимого типа§!."
 UKR_varyag_training_aircraft_tt: "В резерве есть хотя бы §Yодин совместимый палубный самолёт§!."
 UKR_varyag_trials_unavailable_tt: "§RАвианосец или нужные самолёты в резерве недоступны, либо программа испытаний уже завершена.§!"
 ukraine_varyag.9.b: "Подготовить палубные команды на имеющихся самолётах"
 ukraine_varyag.9.c: "Провести полноценные испытания эскадрильи"
 ukraine_varyag.9.desc_ukraine_no_trainers: "$ukraine_varyag.9.desc$§W Мы можем подготовить палубные команды, когда в резерве появятся палубные самолёты, или отложить испытания до прибытия авиагруппы.§!"
 ukraine_varyag.25.name: "Задержка буксировки §Y«Варяга»§!"
 ukraine_varyag.25.desc: "§WКонвой сообщает о тяжёлых условиях перехода. Дополнительные буксиры помогли бы §!§Y«Варягу»§!§W уложиться в график, но их владельцы требуют ещё £treasury §!§R0.20§!§W млрд. Ожидание более безопасных условий §!§Rзадержит доставку на шестьдесят дней§!§W.§!"
 ukraine_varyag.25.a: "Оплатить дополнительные буксиры"
 ukraine_varyag.25.b: "Дождаться более безопасных условий буксировки"
 varyag_tow_on_schedule_tt: "Дополнительные буксиры §Gсохраняют график доставки§!."
 varyag_tow_delayed_tt: "Доставка §Y«Варяга»§! §Rзадерживается на 60 дней§!."
 ukraine_varyag.26.name: "Наши палубные §YМиГ-29§! готовы"
 ukraine_varyag.26.desc: "§W§!§LЛьвовский государственный авиаремонтный завод§!§W §!§Gзавершил переоборудование§!§W двенадцати имеющихся истребителей §!§YМиГ-29§!§W в палубную конфигурацию §!§YМиГ-29К§!§W для службы на §!§Y«Варяге»§!§W. Восстановленные самолёты находятся в резерве и теперь могут войти в авиагруппу или участвовать в палубных испытаниях.§!"
 ukraine_varyag.26.a: "Принять переоборудованную эскадрилью"
 ukraine_varyag.27.name: "Палубные испытания на §Y«Варяге»§!"
 ukraine_varyag.27.desc: "§WНаши палубные команды готовы пройти аттестацию на §!§Y«Варяге»§!§W. Для базовых испытаний используются самолёты, имеющиеся в резерве. Для полноценных испытаний нужна резервная эскадрилья из §!§Y12 совместимых палубных истребителей§!§W, и они дают §!§Gбольше опыта§!§W. Мы также можем дождаться дополнительных самолётов.§!"
 ukraine_varyag.27.a: "$ukraine_varyag.9.b$"
 ukraine_varyag.27.b: "$ukraine_varyag.9.c$"
 ukraine_varyag.27.c: "Отложить программу испытаний"
 ukraine_varyag.28.name: "Срок подготовки §YМиГ-29§! истёк"
 ukraine_varyag.28.desc: "§WМы §!§Rне уложились в 120-дневный срок§!§W, чтобы вернуть в резерв двенадцать исходных истребителей §!§YМиГ-29§!§W. Средства на переоборудование в размере £treasury §!§G3.00§!§W млрд возвращены, и мы можем пересмотреть состав авиагруппы авианосца.§!"
 ukraine_varyag.28.a: "Рассмотреть наши варианты"
