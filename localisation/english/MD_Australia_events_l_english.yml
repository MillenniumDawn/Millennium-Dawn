australia_abbottgov_focus: "The Abbott Government"
tony_abbott_desc: "Tony's career has been a performance of dancing around criticism, and raining it upon his opponents. As a viciously capable opposition leader, Tony has led the party towards a more hard-right stance, with a penchant for popularising his three-word slogans. \n\nBorn in London, raised in Sydney as a Roman Catholic, and educated as a Jesuit, Tony's first priority in school was to become a priest. A deep desire for service and spiritual leadership drove him to eventually returning to the UK as an Oxford Student, learning as much as he could before his service. Although, despite the adoration, his inclinations for politics would never leave him. \n\nHis regular organising of rallies and demonstrations put him opposed to Oxford's left-wing student leadership, eventuating in violent clashes. Upon his return to Australia, Tony would follow his original intentions and join the priesthood in 1984 at the age of 26. After three years in the service, he would come to admit to being \"a square peg trying to go into a round hole,\" and that the priesthood was not simply meant for him. \n\nSince his devotion was not enough to overcome his love for the excitement of politics, Tony joined The Bulletin as a journalist, leading to eventual role as Press Secretary for the Liberal Party. The experienced, and divisive party performer has now risen to the highest seat in the Nation."
executive_management_ast: "Executive Management"
the_turnbull_government_desc: "There is no content for this tree right now. A Turnbull focus tree will be developed in the future, but for now this focus is a placeholder."
collapsing_state_sol: "Collapsing State"
collapsing_state_sol_desc: "Law and order have effectively collapsed in the nation, with large swathes controlled by roving gangs of rogue police and armed militants. What little economy remains is in a state of free fall, and the government itself is trapped within parliament. With no finances or authority to control the spiraling situation."
collapsing_state_sol_1: "Fragile State"
collapsing_state_sol_1_desc: "The majority of the militants have been disarmed and remain within the custody of the state. Law has been restored to a few towns, however, the situation still lies in a delicate balance."
collapsed_state_sol: "Collapsed State"
collapsed_state_sol_desc: "As many of the inhabitants continue to flee the islands, the remaining militants continue pick over the carcass of a dead nation. The last lights of democracy have faded, and there is little hope of a future for those trying to survive."
reconstruction_loans_sol: "Reconstruction Loans"
radical_protections_ast: "Radical Protections"
radical_protections_ast_desc: "Our nation has entered a new era of equality and support. With the backing of a revitalised system to enforce equal treatment and opportunity across the nation, the disenfranchised will find their place in society with a caring hand."
