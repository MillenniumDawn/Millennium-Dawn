 ALG_cabinet_balanced_desc: "O gabinete atual alcança um equilíbrio razoável entre confiabilidade política e competência técnica."
 ALG_cabinet_reformist: "Gabinete Reformista"
 ALG_cabinet_reformist_desc: "O gabinete atual se inclina para figuras reformistas com poucos laços com o estado profundo. A governança pode melhorar, mas o establishment militar está inquieto."
 ALG_cabinet_disloyal: "Gabinete Desleal"
 ALG_cabinet_disloyal_desc: "Membros-chave do gabinete têm lealdade duvidosa. A governança está paralisada pela rivalidade entre facções e pela desconfiança."
 ALG_cabinet_incompetent: "Gabinete Incompetente"
 ALG_cabinet_incompetent_desc: "O gabinete carece de talento administrativo. A implementação de políticas é lenta e pouco confiável."
 ALG_cabinet_deep_state_dominated: "Gabinete do Estado Profundo"
 ALG_cabinet_deep_state_dominated_desc: "O gabinete está fortemente infiltrado pelo establishment militar e de inteligência. O controle civil é, no máximo, nominal."
 ALG_economic_liberalization: "Liberalização Econômica"
 ALG_economic_liberalization_desc: "O Ministério das Finanças persegue reformas econômicas liberais, abrindo mercados e reduzindo a intervenção estatal."
 alg_tamazight_recognition_started_tt: "O processo constitucional para o reconhecimento do tamazigue foi iniciado..."
 alg_tamazight_recognition_complete_tt: "O tamazigue agora é oficialmente reconhecido na constituição."
 recent_officer_appointments: "Nomeações recentes de oficiais"
 alg_deep_state.202.t: "A República em Perigo"
 alg_deep_state.202.d: "A tentativa de resistir à tomada militar fracassou. Legalistas armados e unidades militares se enfrentam nas ruas. O país está à beira de uma guerra civil total. As decisões tomadas agora determinarão se a Argélia sobreviverá como um Estado unificado."
 alg_deep_state.202.a: "Deixar o conflito seguir seu curso"
 alg_deep_state.202.b: "Negociar antes que seja tarde demais"
 alg_civil_war_erupts_tt: "A crise política degenerou em conflito armado aberto. A estabilidade entra em colapso e a nação se prepara para a guerra civil."
 alg_civil_war_averted_tt: "Por meio de um compromisso doloroso, o pior é evitado. Os militares mantêm influência significativa, mas a guerra civil total é impedida, por enquanto."
