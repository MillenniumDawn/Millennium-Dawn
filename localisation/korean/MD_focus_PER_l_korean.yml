 PER_low_pop_TT: "정부 인기도가 §R낮음§!(15% 미만)일 경우\n\nMEK는 전국적인 시위를 일으키고, 총파업을 촉구하고, 군사 장비를 파괴하고, 장군들을 암살할 수 있습니다. 또한 MEK는 시간이 지남에 따라 자연스럽게 인기도를 얻습니다.\n\n§R인기도가 너무 낮으면 MEK에 대해 직접적인 조치를 취할 수 없습니다§!"
 PER_med_pop_TT: "정부 인기도가 §H보통§!(30% 미만, 15% 초과)일 경우\n\nMEK는 과학자를 암살하고, 공장을 파괴하고, 외세 영향으로부터의 우리 독립성을 해칠 수 있습니다. 또한 MEK는 시간이 지남에 따라 자연스럽게 인기도를 얻습니다.\n\n§G보통 인기도에서는 MEK에 대해 직접적인 조치를 취할 수 있으나, MEK 최고 지휘부를 표적으로 삼을 수는 없습니다§!"
 PER_high_pop_TT: "정부 인기도가 §G높음§!(30% 초과)일 경우\n\nMEK는 국가 발전을 저해하는 면에서 할 수 있는 일이 거의 없습니다. 다만 소셜 미디어를 통해 선전을 퍼뜨릴 수 있는 능력은 있을 수 있습니다.\n\n§G높은 인기도에서는 MEK 최고 지휘부를 표적으로 삼는 것을 포함해 MEK에 대해 직접적인 조치를 취할 수 있습니다§!"
