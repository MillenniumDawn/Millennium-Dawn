 CHI_semiconductor_backwardness_4: "$CHI_semiconductor_backwardness_1$"
 CHI_semiconductor_backwardness_4_desc: "China's semiconductor industry remains structurally dependent on foreign foundries, design software, and manufacturing equipment. Domestic fabs operate two to three generations behind the frontier, design houses lack mature EDA toolchains, and no domestic equipment firm can supply advanced lithography. The gap throttles domestic chip-plant construction and foundry output, and constrains both civilian electronics and the military electronics supply chain.\n§W--------------§!\nThis national spirit will be §RRemoved§! if we complete the §Y$CHI_mature_node_counter_offensive$§! or §Y$CHI_sicarrier_euv$§! focus."