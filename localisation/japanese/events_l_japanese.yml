 isisNews.11310.d: "イラクのテロリストでイスラム国の副司令官だったアヤド・アル・ジュマイリが本日、ロシアの空爆で死亡した。アル・ジュマイリはサダム・フセイン政権下で上級情報将校を務め、2003年の米軍占領後にスンナ派反乱軍に加わった。イスラム国の情報部と国内治安部の責任者となり、後に副司令官兼戦争大臣に昇進した。"
