 CHI_hainan_free_trade_port: "Port de libre-échange de Hainan"
 CHI_hainan_free_trade_port_desc: "En 2018, Pékin a désigné l'intégralité de Hainan comme zone pilote de libre-échange, avec un plan directeur publié en 2020 traçant la voie vers un territoire douanier pleinement indépendant d'ici 2025. Les travaux d'expansion à Haikou et au port en eau profonde de Yangpu, avec les terrains du forum de Boao, modernisent la capacité logistique et de conférence de l'île avant la fermeture douanière de toute l'île. Une fois scellée, les marchandises circuleront librement à Hainan et ne feront face à des tarifs qu'en franchissant vers la zone douanière continentale."
 CHI_hainan_zero_tariff_zone: "Zone à tarif zéro de Hainan"
 CHI_hainan_zero_tariff_zone_desc: "Un catalogue publié de marchandises à tarif zéro laisse les importations éligibles entrer à Hainan en franchise, tandis que les taux d'impôt sur les sociétés et les personnes sont plafonnés à 15 pour cent pour les résidents éligibles et les industries encouragées. Les allocations de vente au détail hors taxes offshore s'étendent bien au-delà de celles du continent, attirant des dépenses touristiques qui allaient naguère à Hong Kong ou à l'étranger. Le régime fiscal et tarifaire accélère le glissement de Hainan d'une économie de plantation et de pêche vers le tourisme, les services offshore et le commerce de transformation à haute valeur."
 CHI_kra_canal_underwriting: "Garantir le canal de Kra"
 CHI_kra_canal_underwriting_desc: "La Banque de développement de Chine et la Banque d'import-export de Chine étendent un financement concessionnel pour la prochaine phase d'excavation du canal à travers l'isthme de Kra. La ligne de crédit permet à Bangkok de poursuivre la construction immédiatement plutôt que d'attendre les cycles budgétaires nationaux, tout en liant l'achèvement du projet à la bonne volonté chinoise continue. Chaque tranche approfondit l'enjeu financier de Pékin dans une voie d'eau qui laisserait le shipping chinois contourner le détroit de Malacca."
 CHI_kra_canal_underwriting_phase_tt: "Le §Ycanal de Kra§! est encore en construction."
 CHI_kra_transit_corridor: "Couloir de transit de Kra"
 CHI_kra_transit_corridor_desc: "Les firmes d'État chinoises de shipping et d'énergie établissent des terminaux de transit et de soutage au canal de Kra achevé, raccourcissant les voyages de pétroliers du golfe Persique au Guangdong d'environ 1 200 kilomètres et allégeant la dépendance au détroit de Malacca congestionné et vulnérable. L'arrangement est le plus précieux lorsque des firmes chinoises détiennent une concession d'exploitation du trafic du canal plutôt que de simples droits de transit."
 CHI_thaad_escalate_count_tt: "Escalade des représailles THAAD : $RIGHT|+=0$"
 SCO_military_research_desc: "Les membres et observateurs de l'Organisation de coopération de Shanghai partagent la recherche militaire par des programmes conjoints."
 SCO_military_research_name: "Recherche militaire de l'OCS"
 CHI_HKG_patriotic_education_drive: "Campagne d'éducation patriotique"
 CHI_HKG_patriotic_education_drive_desc: "Financer un programme d'éducation civique et d'identité nationale conçu sur le continent dans les écoles subventionnées de Hong Kong, élargir l'instruction en putonghua et payer des voyages d'étude des enseignants à l'intérieur. Le Bureau de l'éducation absorbe le coût, et le déploiement est assez progressif pour éviter un second retour de bâton de l'éducation morale et nationale."
 CHI_HKG_liaison_office_expansion: "Élargir le Bureau de liaison central"
 CHI_HKG_liaison_office_expansion_desc: "Agrandir le Bureau de liaison du gouvernement populaire central et le Bureau de sauvegarde de la sécurité nationale, détacher des cadres continentaux dans la fonction publique hongkongaise et placer des nommés contrôlés dans les panels de sélection de la magistrature. Le contrôle administratif avance rapidement, mais chaque intervention visible risque de ramener les foules dans la rue."
 CHI_MAC_cross_border_administration: "Unifiez l’administration transfrontalière"
 CHI_MAC_cross_border_administration_desc: "Reconnaître les titres professionnels et permis de conduire continentaux à Macao, faire transiter la compensation en renminbi par des banques supervisées par le continent, et fusionner le traitement douanier aux postes de Gongbei et du pont Lotus en un permis unique. Le territoire conserve son statut tandis que sa machinerie administrative converge vers celle du Guangdong."
 CHI_MAC_hengqin_integration_zone: "Zone de coopération approfondie de Hengqin"
 CHI_MAC_hengqin_integration_zone_desc: "Étendre la zone de coopération approfondie Guangdong-Macao sur l'île de Hengqin : droits de résidence continentaux pour les travailleurs macanais, régime fiscal et douanier unifié, et relocalisation d'entreprises liées aux jeux de l'autre côté de l'eau. Zhuhai absorbe la croissance, et avec elle les leviers du gouvernement local."
 CHI_TIB_monastic_patriotic_education: "Éducation patriotique dans les monastères"
 CHI_TIB_monastic_patriotic_education_desc: "Stationner des comités de gestion démocratique dans chaque monastère enregistré, exiger des moines et des nonnes qu'ils réussissent des examens sur la politique religieuse de l'État, et plafonner le recrutement de novices. Les institutions restent ouvertes et fonctionnent sous supervision administrative permanente."
 CHI_TIB_village_cadre_teams: "Équipes de travail des cadres basés dans les villages"
 CHI_TIB_village_cadre_teams_desc: "Poster une équipe de travail permanente du Parti dans chaque village administratif, associée à des audits d'enregistrement des ménages, une consolidation du logement subventionné et le déplacement de familles d'éleveurs dispersées vers des communes desservies. La pénétration administrative devient totale, et le ressentiment qu'elle engendre aussi."
 CHI_ETK_bilingual_boarding_schools: "Système d'internat bilingue"
 CHI_ETK_bilingual_boarding_schools_desc: "Consolider la scolarité rurale en internats en mandarin, encadrés par des enseignants recrutés dans les provinces intérieures. L'ouïghour est conservé comme matière plutôt que comme langue d'instruction, et une génération est éduquée loin de ses villages d'origine."
 CHI_ETK_labour_transfer_scheme: "Programme de transfert de main-d'œuvre excédentaire"
 CHI_ETK_labour_transfer_scheme_desc: "Affecter des travailleurs ouïghours ruraux à des usines côtières et des parcs industriels régionaux selon des quotas de transfert organisés, tenant les cadres villageois responsables des objectifs de recrutement. Les revenus des ménages augmentent et les liens communautaires s'affaiblissent, mais le dispositif est clairement visible pour les auditeurs étrangers qui tracent les chaînes d'approvisionnement."
 CHI_OMG_mandarin_curriculum_rollout: "Déploiement d'un programme d'études unifié"
 CHI_OMG_mandarin_curriculum_rollout_desc: "Remplacer les manuels en mongol de politique, d'histoire et de langue par la série nationale unifiée et recycler le corps enseignant en conséquence. Présenté comme une mesure d'égalité des chances et déployé assez lentement pour maintenir le calme dans les comtés d'élevage."
 CHI_OMG_pastoral_sedentarisation: "Programme de sédentarisation pastorale"
 CHI_OMG_pastoral_sedentarisation_desc: "Faire appliquer des interdictions de pâturage sur la steppe dégradée, indemniser les familles d'éleveurs pour le bétail cédé, et les réinstaller dans des logements de commune subventionnés avec reconversion professionnelle. Le pastoralisme nomade cède la place au salariat, et la base sociale de la particularité mongole avec lui."
 CHI_national_common_language_campaign: "Campagne nationale pour la langue commune"
 CHI_national_common_language_campaign_desc: "Appliquer la loi sur la langue chinoise parlée et écrite standard de manière uniforme dans toutes les régions administratives spéciales à la fois : une seule série de manuels, certification linguistique nationale pour l'emploi public, et quotas de radiodiffusion. Une poussée coordonnée unique fait avancer l'intégration partout où le gouvernement central conserve encore un levier administratif."
 CHI_second_generation_ethnic_policy: "Politique ethnique de deuxième génération"
 CHI_second_generation_ethnic_policy_desc: "Adopter le modèle dépolitisé des affaires ethniques préconisé par les théoriciens réformistes du Parti : retirer les quotas préférentiels, abandonner l'autonomie régionale comme principe d'organisation, et définir la citoyenneté uniquement par la nation chinoise. Appliqué simultanément à chaque région administrative spéciale, c'est la mesure d'intégration la plus ambitieuse disponible — et la plus déstabilisante."
 CHI_HKG_sinicization_slot_free: "Aucun programme d'intégration de §YHong Kong§! n'est actuellement en cours"
 CHI_MAC_sinicization_slot_free: "Aucun programme d'intégration de §YMacao§! n'est actuellement en cours"
 CHI_TIB_sinicization_slot_free: "Aucun programme d'intégration du §YTibet§! n'est actuellement en cours"
 CHI_ETK_sinicization_slot_free: "Aucun programme d'intégration du §YXinjiang§! n'est actuellement en cours"
 CHI_OMG_sinicization_slot_free: "Aucun programme d'intégration de la §YMongolie-Intérieure§! n'est actuellement en cours"
 CHI_national_sinicization_slot_free: "Aucune campagne d'intégration nationale n'est actuellement en cours"
 CHI_any_SAR_awaiting_integration: "Au moins une région administrative spéciale attend encore son intégration"
 CHI_sinicization_all_SARs_tt: "Fait progresser la §Ysinicisation§! dans chaque région administrative spéciale encore en attente d'intégration"
 CHI_bri_reduce_loan_tt: "Leur dette en cours des Nouvelles routes de la soie baisse du §Gcoût d'un projet§!"
 CHI_bri_restructure_loan_tt: "Leur taux de prêt tombe à §G2 %§! et les paiements sont suspendus pendant §Yun an§!"
 CHI_bri_application_approved_tt: "La construction commence après une dernière vérification d'éligibilité. Le bénéficiaire paie §Y40§! de son Trésor ou reçoit un prêt chinois pour le manque."
 CHI_bri_dual_treasury_50_tt: "Exige au moins §Y50§! dans le fonds BRI et le Trésor national"
 CHI_bri_state_port: "Projet portuaire BRI"
 CHI_bri_state_port_desc: "Un développement portuaire soutenu par la Chine étend la logistique locale et la capacité de construction maritime."
 CHI_bri_state_rail: "Projet ferroviaire BRI"
 CHI_bri_state_rail_desc: "Un corridor ferroviaire soutenu par la Chine améliore la logistique terrestre et la construction d'infrastructure."
 CHI_bri_state_pipeline: "Projet de pipeline BRI"
 CHI_bri_state_pipeline_desc: "Un oléoduc soutenu par la Chine étend le débit de ressources et la capacité d'approvisionnement régionale."
 CHI_bri_state_telecom: "Projet BRI Télécom"
 CHI_bri_state_telecom_desc: "Une dorsale numérique soutenue par la Chine appuie l'infrastructure réseau et la construction future."
 CHI_bri_state_sez: "Zone économique spéciale BRI"
 CHI_bri_state_sez_desc: "Une zone économique spéciale soutenue par la Chine étend la capacité d'usines locale et l'espace de construction."
 CHI_bri_state_mine: "Projet minier BRI"
 CHI_bri_state_mine_desc: "L'investissement chinois étend l'extraction des gisements minéraux de l'État."
 CHI_bri_state_energy: "Projet énergétique BRI"
 CHI_bri_state_energy_desc: "La capacité de production construite en Chine soutient l’industrie locale."
 CHI_bri_state_prestige: "Projet BRI Prestige"
 CHI_bri_state_prestige_desc: "Un complexe phare et de bureaux soutenu par la Chine remodèle la capitale régionale."
 CHI_BRI_recipient_finance: "Finances des Nouvelles routes de la soie"
 CHI_BRI_recipient_finance_desc: "Gérer nos dettes et concessions des Nouvelles routes de la soie.\n\n§YDette BRI impayée :§! [?bri_debt_owed_to_china|2]\n§YPaiement d'intérêts hebdomadaire :§! [?bri_loan_payment|2]"
 CHI_huawei_consumer_ecosystem_power: "Pouvoir de l’écosystème du consommateur"
 CHI_huawei_consumer_ecosystem_power_desc: "Appareils, logiciels, services et développeurs forment une plateforme grand public compétitive à l'échelle mondiale, soutenue par la base technologique plus large de Huawei."
 CHI_huawei_global_telecom_challenger: "Challenger mondial des télécommunications"
 CHI_huawei_global_telecom_challenger_desc: "Centres de recherche internationaux, relations avec les opérateurs et un réseau commercial en expansion font de Huawei un challenger mondial des télécommunications."
 CHI_huawei_resilient_technology_fortress: "Forteresse technologique résiliente"
 CHI_huawei_resilient_technology_fortress_desc: "Huawei reste un champion durable et techniquement capable, mais les contraintes géographiques et la confiance limitée rétrécissent sa portée commerciale."
 CHI_huawei_sovereign_full_stack: "Souverain Full Stack"
 CHI_huawei_sovereign_full_stack_desc: "Puces indépendantes, logiciels, IA, services cloud, appareils et un système d'approvisionnement résilient forment une large pile technologique intérieure."
 CHI_semiconductor_events.300.a: "Soutenez un réseau mondial de R&D distribué"
 CHI_semiconductor_events.300.b: "Prioriser le marché intérieur des opérateurs"
 CHI_semiconductor_events.300.d: "Fondée à Shenzhen en 1987, Huawei a bâti sa position initiale sur le marché chinois des télécommunications avant d'établir des opérations de recherche et de vente à l'étranger. La politique industrielle d'État peut financer un réseau de recherche mondial distribué, ou maintenir le poids de l'entreprise sur le marché intérieur des opérateurs."
 CHI_semiconductor_events.300.t: "Au-delà du marché intérieur"
 CHI_semiconductor_events.301.a: "Soutenir le modèle LTE de bout en bout"
 CHI_semiconductor_events.301.b: "Garder l'effort sur les opérateurs chinois"
 CHI_semiconductor_events.301.d: "TeliaSonera a lancé un service LTE commercial à Oslo sur un réseau Huawei. Pékin peut soutenir le modèle de bout en bout qui a remporté le contrat et le déployer à l'échelle de l'Europe, ou garder les ingénieurs de l'entreprise sur les opérateurs chinois."
 CHI_semiconductor_events.301.t: "La percée LTE nordique"
 CHI_semiconductor_events.302.a: "Financer le grand saut 5G"
 CHI_semiconductor_events.302.b: "Mettre plutôt à niveau les radios par incréments"
 CHI_semiconductor_events.302.d: "Huawei a annoncé au moins 600 millions de dollars US d'investissement en recherche 5G jusqu'en 2018. Le soutien de l'État peut financer une poussée intégrée pour le leadership 5G, ou s'en tenir à des mises à niveau radio incrémentales bien moins coûteuses."
 CHI_semiconductor_events.302.t: "Le grand saut 5G"
 CHI_semiconductor_events.303.a: "Défendre Huawei et préserver la continuité"
 CHI_semiconductor_events.303.b: "Poursuivre une démarche de conformité négociée"
 CHI_semiconductor_events.303.d: "Les États-Unis ont ajouté Huawei et de nombreuses filiales à la Entity List, restreignant fortement l'accès à la technologie américaine. Des allégations distinctes de procureurs sont contestées par Huawei. Pékin peut défendre l'entreprise et préserver la continuité, ou chercher une voie de conformité négociée."
 CHI_semiconductor_events.303.t: "La Entity List"
 CHI_semiconductor_events.304.a: "Pousser la fabrication nationale à tout prix"
 CHI_semiconductor_events.304.b: "Stocker ce que nous pouvons et attendre la fin des contrôles"
 CHI_semiconductor_events.304.d: "Des contrôles élargis sur les produits étrangers directs ont resserré l'accès de Huawei aux semi-conducteurs avancés. La politique d'État peut forcer la fabrication intérieure coûte que coûte, ou stocker ce qui reste disponible et attendre la fin des contrôles."
 CHI_semiconductor_events.304.t: "Le goulet des puces"
 CHI_semiconductor_events.305.a: "Une pile souveraine complète, du silicium au logiciel"
 CHI_semiconductor_events.305.b: "Une forteresse technologique qui survit aux contrôles"
 CHI_semiconductor_events.305.c: "Un challenger télécoms à portée mondiale"
 CHI_semiconductor_events.305.e: "Un écosystème de consommation bâti sur sa propre plateforme"
 CHI_semiconductor_events.305.d: "Deux décennies d'expansion, de sanctions et de substitution ont fixé ce qu'est Huawei. Un téléphone construit sur un processeur fabriqué dans le pays a répondu à la question que les contrôles à l'export visaient à clore. La stratégie d'État se consolide désormais autour de la forme que l'entreprise a prise."
 CHI_semiconductor_events.305.t: "La seconde ascension"
 CHI_semiconductor_events.310.t: "Le patrimoine client IBM"
 CHI_semiconductor_events.310.d: "IBM est prêt à vendre l'activité d'ordinateurs personnels qu'il a inventée, y compris la marque ThinkPad que tout acheteur d'entreprise fait déjà confiance. L'acheter ferait de Lenovo le troisième constructeur mondial du jour au lendemain, avec les pertes qui ont convaincu IBM de s'en séparer."
 CHI_semiconductor_events.310.a: "Acheter l'activité d'ordinateurs personnels"
 CHI_semiconductor_events.310.b: "Grandir à partir de ce que nous construisons nous-mêmes"
 CHI_semiconductor_events.311.t: "Washington valide l'accord"
 CHI_semiconductor_events.311.d: "Les régulateurs américains approuveront la vente d'IBM à Lenovo, sous conditions : installations séparées, accès restreint aux dossiers des clients gouvernementaux, et supervision de qui travaille où. Les accepter clôt l'accord et concède qu'un propriétaire chinois est une question de sécurité. Les refuser préserve le principe et perd probablement l'affaire."
 CHI_semiconductor_events.311.a: "Accepter les engagements de sécurité"
 CHI_semiconductor_events.311.b: "Refuser des conditions qu'aucun autre acheteur n'affronterait"
 CHI_semiconductor_events.312.t: "Un nom bien à soi"
 CHI_semiconductor_events.312.d: "La licence de Lenovo pour apposer le nom IBM sur un ThinkPad arrive à échéance, et les acheteurs d'entreprise ont acheté le badge plutôt que l'entreprise derrière. Mettre le nom Lenovo sur les produits teste si cinq ans de propriété ont acheté de la crédibilité. Garder l'ancien badge aussi longtemps que possible diffère la question."
 CHI_semiconductor_events.312.a: "Mettre notre propre nom sur les produits"
 CHI_semiconductor_events.312.b: "Garder la marque héritée tant qu'elle dure"
 CHI_semiconductor_events.313.t: "L'alliance mûrit"
 CHI_semiconductor_events.313.d: "NEC au Japon et Medion en Allemagne plieront leurs opérations en coentreprises avec Lenovo plutôt que d'être achetés purement et simplement. Les coentreprises achètent des parts de marché dans des pays qui résisteraient à une acquisition, et laissent aux partenaires un mot à dire sur ce qui est construit. Acheter directement coûte plus cher et ne rend de comptes à personne."
 CHI_semiconductor_events.313.a: "Bâtir les coentreprises"
 CHI_semiconductor_events.313.b: "S'étendre directement et garder le contrôle"
 CHI_semiconductor_events.314.t: "Système x"
 CHI_semiconductor_events.314.d: "IBM quitte désormais aussi l'activité des serveurs de volume, et le même argument s'applique à plus grande échelle et à un prix plus élevé. Acheter System x ferait sortir Lenovo du marché de commodité qu'il mène déjà. Rester sur les ordinateurs personnels, c'est défendre une activité dont les marges se réduisent chaque année."
 CHI_semiconductor_events.314.a: "Acheter aussi l'activité serveurs"
 CHI_semiconductor_events.314.b: "Défendre l'activité d'ordinateurs personnels"
 CHI_semiconductor_events.315.t: "Ce que Lenovo est devenu"
 CHI_semiconductor_events.315.d: "Deux décennies pendant lesquelles Lenovo a acheté ce que les entreprises occidentales ne voulaient plus ont fixé ce qu'est la manufacture informatique chinoise et quelle part du matériel mondial y transite."
 CHI_semiconductor_events.315.a: "Une plateforme d'entreprise, des serveurs aux postes de travail"
 CHI_semiconductor_events.315.b: "Le constructeur d'ordinateurs personnels du monde"
 CHI_semiconductor_events.315.c: "Un pont entre l'échelle chinoise et les marques étrangères"
 CHI_semiconductor_events.315.e: "Un champion national"
 CHI_lenovo_enterprise_server_platform: "Plateforme d'entreprise"
 CHI_lenovo_enterprise_server_platform_desc: "Bureaux, portables et les serveurs derrière eux sont tous construits par une seule entreprise qui a acheté chaque activité lorsque son précédent propriétaire y a renoncé. Les marges que les vendeurs n'ont pas trouvées sont là une fois la manufacture faite à l'échelle."
 CHI_lenovo_global_pc_platform: "Fabricant mondial"
 CHI_lenovo_global_pc_platform_desc: "Plus d'ordinateurs personnels partent des chaînes de production chinoises sous un même badge que de n'importe qui d'autre. C'est une activité de commodité à marges minces et il n'y a pas de challenger réaliste au volume."
 CHI_lenovo_strategic_bridge: "Pont stratégique"
 CHI_lenovo_strategic_bridge_desc: "La manufacture chinoise atteint des marchés qui refuseraient un propriétaire chinois, parce que les coentreprises portent des partenaires locaux et des noms locaux. Le contrôle est partagé et les portes restent ouvertes."
 CHI_lenovo_domestic_champion: "Champion national"
 CHI_lenovo_domestic_champion_desc: "L'entreprise a grandi sur ce qu'elle a construit plutôt que sur ce qu'elle a acheté, et elle rend des comptes à Pékin plutôt qu'à un registre d'actionnaires étrangers. Sa portée est plus petite et rien n'en dépend de la permission de quiconque."
 china_sar.021.b: "L'île ne vaut pas la flotte. Retirer l'ultimatum."
 CHI_TAI_lift_full_blockade: "Lever le blocus complet"
 CHI_TAI_lift_full_blockade_desc: "Ramener le cordon à un blocus partiel. La pression sur Taipei se relâche et l'alarme de Washington s'apaise, mais les ports de l'île rouvrent."
 CHI_ernie_national_champion_decision: "Nommer Ernie modèle national"
 CHI_ernie_national_champion_decision_desc: "Désigner le modèle de Baidu comme système de référence pour le déploiement étatique et provincial. Le statut de premier arrivé devient un standing officiel, et les ministères n'ont plus qu'une architecture à certifier au lieu de six.\n\n§YL'esprit national résultant dure 365 jours. Un seul programme de laboratoire d'IA peut être actif à la fois.§!"
 CHI_ernie_consumer_search_decision: "Intégrer Ernie à la recherche"
 CHI_ernie_consumer_search_decision_desc: "Garder le modèle là où les utilisateurs se trouvent déjà plutôt que de courir après les contrats d'entreprise. La distribution est immédiate et les recettes sont réelles, au prix du rôle de normalisation.\n\n§YL'esprit national qui en résulte dure 365 jours. Un seul programme de laboratoire d'IA peut être actif à la fois.§!"
 CHI_qwen_open_ecosystem_decision: "Retourner Qwen en tant que plateforme ouverte"
 CHI_qwen_open_ecosystem_decision_desc: "Soutenir la publication des poids et laisser l'écosystème national s'en servir. Chaque développeur en aval devient dépendant des infrastructures chinoises, ce qui vaut plus, avec le temps, que les revenus de licences.\n\n§YL'esprit national qui en résulte dure 365 jours. Un seul programme de laboratoire d'IA peut être actif à la fois.§!"
 CHI_qwen_cloud_captive_decision: "Lier Qwen à l'activité cloud"
 CHI_qwen_cloud_captive_decision_desc: "Garder les modèles de pointe au sein d'Alibaba Cloud comme raison d'acheter la puissance de calcul. Les marges restent à la plateforme, et le levier aussi.\n\n§YL'esprit national qui en résulte dure 365 jours. Un seul programme de laboratoire d'IA peut être actif à la fois.§!"
 CHI_zhipu_academic_pipeline_decision: "Financer le vivier de Tsinghua"
 CHI_zhipu_academic_pipeline_decision_desc: "Traiter le laboratoire comme un terrain de formation pour la prochaine génération de chercheurs plutôt que comme une entreprise produit. Plus lent à commercialiser, et cela se capitalise.\n\n§YL'esprit national qui en résulte dure 365 jours. Un seul programme de laboratoire d'IA peut être actif à la fois.§!"
 CHI_zhipu_state_procurement_decision: "Acheminer Zhipu via les marchés publics"
 CHI_zhipu_state_procurement_decision_desc: "Garantir la demande par des contrats ministériels et provinciaux. Le laboratoire n'a jamais à trouver un marché, et n'a jamais non plus à en répondre.\n\n§YL'esprit national qui en résulte dure 365 jours. Un seul programme de laboratoire d'IA peut être actif à la fois.§!"
 CHI_doubao_consumer_scale_decision: "Pousser Doubao à grande échelle"
 CHI_doubao_consumer_scale_decision_desc: "Mettre l'assistant devant des centaines de millions d'utilisateurs à un prix que personne ne peut égaler. L'adoption est l'indicateur, et la facture de calcul en est le prix.\n\n§YL'esprit national qui en résulte dure 365 jours. Un seul programme de laboratoire d'IA peut être actif à la fois.§!"
 CHI_doubao_recommendation_core_decision: "Garder Doubao au cœur du moteur de recommandation"
 CHI_doubao_recommendation_core_decision_desc: "Ramener le travail vers les systèmes de classement et de recommandation qui gagnent déjà de l'argent. Moins visible qu'un assistant grand public, et nettement plus rentable.\n\n§YL'esprit national qui en résulte dure 365 jours. Un seul programme de laboratoire d'IA peut être actif à la fois.§!"
 CHI_deepseek_open_weight_release_decision: "Publier les poids DeepSeek"
 CHI_deepseek_open_weight_release_decision_desc: "Publier ouvertement un modèle de classe frontière et laisser le reste du monde s'appuyer sur la recherche chinoise. Les contrôles à l'exportation visaient à priver de calcul ; publier transforme la contrainte en un débat sur qui fixe les règles.\n\n§YL'esprit national qui en résulte dure 365 jours. Un seul programme de laboratoire d'IA peut être actif à la fois.§!"
 CHI_deepseek_state_aligned_lab_decision: "Intégrer DeepSeek à l'effort d'État"
 CHI_deepseek_state_aligned_lab_decision_desc: "Replier le laboratoire dans le programme national, avec le financement et la tutelle qui l'accompagnent. Le travail d'efficacité continue sous supervision, et n'est plus lisible par quiconque d'autre.\n\n§YL'esprit national qui en résulte dure 365 jours. Un seul programme de laboratoire d'IA peut être actif à la fois.§!"
 CHI_moonshot_long_context_decision: "Soutenir le pari du long contexte"
 CHI_moonshot_long_context_decision_desc: "Financer la poursuite de longueurs de contexte que personne d'autre ne dessert. Un pari étroit sur une capacité, et le premier laboratoire à l'atteindre s'approprie une catégorie.\n\n§YL'esprit national qui en résulte dure 365 jours. Un seul programme de laboratoire d'IA peut être actif à la fois.§!"
 CHI_moonshot_enterprise_pivot_decision: "Orienter Moonshot vers les entreprises"
 CHI_moonshot_enterprise_pivot_decision_desc: "Échanger la course grand public contre des déploiements contractuels à recettes prévisibles. La valorisation cesse de grimper et le bilan cesse de saigner.\n\n§YL'esprit national qui en résulte dure 365 jours. Un seul programme de laboratoire d'IA peut être actif à la fois.§!"
 CHI_ernie_national_champion: "Modèle de référence national"
 CHI_ernie_national_champion_desc: "Une architecture certifiée unique tourne dans les ministères, les provinces et les entreprises d'État. Les achats sont plus simples, les normes sont chinoises, et l'acteur en place n'a guère de raison de se presser."
 CHI_ernie_consumer_search: "Assistant de recherche intégré"
 CHI_ernie_consumer_search_desc: "Le modèle atteint ses utilisateurs via le produit de recherche plutôt que par une équipe commerciale. Les recettes arrivent tout de suite et le rôle de normalisation passe à quelqu'un d'autre."
 CHI_qwen_open_ecosystem: "Écosystème de poids ouvert"
 CHI_qwen_open_ecosystem_desc: "Des poids publiés ont fait de la plateforme ce sur quoi le monde construit plutôt que ce qu'il licence. Les revenus directs sont plus minces et la dépendance va dans le bon sens."
 CHI_qwen_cloud_captive: "Frontière captive du cloud"
 CHI_qwen_cloud_captive_desc: "Les meilleurs modèles sont la raison de louer le calcul, et ils ne tournent nulle part ailleurs. Marges et pouvoir de négociation restent tous deux à la plateforme."
 CHI_zhipu_academic_pipeline: "Filière de recherche académique"
 CHI_zhipu_academic_pipeline_desc: "Le laboratoire forme des chercheurs autant qu'il entraîne des modèles, et l'université continue d'alimenter les deux. La production commerciale est modeste ; la base de talents ne l'est pas."
 CHI_zhipu_state_procurement: "Laboratoire des Marchés Publics de l’État"
 CHI_zhipu_state_procurement_desc: "Les contrats ministériels garantissent la demande et fixent la direction. Le financement est stable, tout comme l'absence de toute pression concurrentielle."
 CHI_doubao_consumer_scale: "Déploiement grand public"
 CHI_doubao_consumer_scale_desc: "Des centaines de millions d'utilisateurs quotidiens à un prix qui écarte la concurrence. L'adoption est sans égale et la facture d'inférence est énorme."
 CHI_doubao_recommendation_core: "Noyau de recommandation"
 CHI_doubao_recommendation_core_desc: "La recherche alimente les systèmes de classement qui font déjà de l'argent plutôt qu'un assistant autonome. Peu glamour, et les retours sont immédiats."
 CHI_deepseek_open_weight_release: "Libération de la frontière ouverte"
 CHI_deepseek_open_weight_release_desc: "Un modèle de classe frontière publié ouvertement, entraîné pour une fraction de ce que dépensent les acteurs en place. L'argument d'efficacité voyage plus loin que le modèle lui-même."
 CHI_deepseek_state_aligned_lab: "Laboratoire frontière aligné sur l’État"
 CHI_deepseek_state_aligned_lab_desc: "La recherche d'efficacité continue avec un financement national et une tutelle nationale. La capacité continue de s'accumuler et les résultats cessent d'être publics."
 CHI_moonshot_long_context: "Spécialiste du contexte long"
 CHI_moonshot_long_context_desc: "Un pari délibéré sur des longueurs de contexte que le reste du domaine ne peut servir. Étroit, et sans concurrent là où il atterrit."
 CHI_moonshot_enterprise_pivot: "Pratique de déploiement en entreprise"
 CHI_moonshot_enterprise_pivot_desc: "Des déploiements contractuels ont remplacé la course grand public. La croissance est plus lente, les recettes sont prévisibles, et le laboratoire survit à l'hiver du financement."
 CHI_ai_lab_treasury_15_tt: "Dispose de plus de §Y15 milliards§! de réserves du Trésor"
 CHI_ai_lab_treasury_20_tt: "Dispose de plus de §Y20 milliards§! de réserves du Trésor"
 CHI_pacific_pivot_partner_exists_tt: "Au moins une nation du Pacifique est un §Ypartenaire du pivot pacifique§!"
 CHI_TAI_full_blockade_active: "Blocus total de Taïwan en vigueur"
 CHI_semiconductor_events.320.t: "La moitié de Tencent pour trente-deux millions"
 CHI_semiconductor_events.320.d: "Tencent brûle du cash sur un messager que personne ne paie pour utiliser, et aucun investisseur chinois ne le financera. MIH, un groupe média sud-africain, offre trente-deux millions de dollars pour 46,5 pour cent et laissera Pony Ma diriger l'entreprise. L'alternative est de l'argent intérieur aux conditions fixées à Pékin."
 CHI_semiconductor_events.320.a: "Vendre la participation à MIH"
 CHI_semiconductor_events.320.b: "Lever l'argent à domicile"
 CHI_semiconductor_events.321.t: "Tencent s'introduit en bourse à Hong Kong"
 CHI_semiconductor_events.321.d: "Tencent peut coter ses actions à la Bourse de Hong Kong et lever des capitaux étrangers contre une base d'utilisateurs qu'aucun marché n'a jamais valorisée. La cotation finance tout ce qui suit. Elle met aussi les comptes d'une entreprise chinoise de messagerie sous les yeux de quiconque veut les lire, chaque trimestre."
 CHI_semiconductor_events.321.a: "Coter à la Bourse de Hong Kong"
 CHI_semiconductor_events.321.b: "Rester privé et croître sur le cash-flow"
 CHI_semiconductor_events.322.t: "Weixin"
 CHI_semiconductor_events.322.d: "Une équipe Tencent à Guangzhou, rachetée pour son produit de messagerie, veut construire un messager pour téléphone qui concurrencerait directement QQ. QQ est l'activité sur laquelle repose toute l'entreprise. Soutenir l'équipe, c'est financer un rival d'elle-même ; refuser laisse QQ affronter le smartphone à ses propres conditions."
 CHI_semiconductor_events.322.a: "Laisser l'équipe de Guangzhou le construire"
 CHI_semiconductor_events.322.b: "Défendre QQ sur le téléphone"
 CHI_semiconductor_events.323.t: "Supercellule"
 CHI_semiconductor_events.323.d: "Tencent peut payer 8,6 milliards de dollars pour le contrôle de Supercell, le studio finlandais derrière Clash of Clans, et posséder les jeux plutôt que de les licencier en Chine. C'est la plus grosse somme jamais versée par une entreprise chinoise pour une activité de jeux. Publier les titres des autres ne coûte rien et n'en rapporte qu'une fraction."
 CHI_semiconductor_events.323.a: "Acheter le studio purement et simplement"
 CHI_semiconductor_events.323.b: "Licencier et publier pour les autres"
 CHI_semiconductor_events.324.t: "Le gel des licences"
 CHI_semiconductor_events.324.d: "Les régulateurs ont cessé d'approuver de nouvelles licences de jeux et ne disent pas quand ils reprendront, et les recettes de Tencent dépendent de titres qu'elle ne peut pas lancer légalement. Environ deux cents milliards de dollars de valeur de marché se sont évaporés. Bâtir l'appareil de conformité que l'État veut est lent et coûteux ; faire transiter l'activité par les marchés étrangers ne l'est ni l'un ni l'autre."
 CHI_semiconductor_events.324.a: "Construire ce que le régulateur demande"
 CHI_semiconductor_events.324.b: "Acheminer les revenus vers les marchés étrangers"
 CHI_semiconductor_events.325.t: "Ce que Tencent est devenu"
 CHI_semiconductor_events.325.d: "Vingt-cinq ans de décisions sur qui finance Tencent, ce qu'elle possède à l'étranger et jusqu'où elle plie devant le régulateur ont fixé ce qu'est l'internet grand public chinois."
 CHI_semiconductor_events.325.a: "Un conglomérat de plateformes mondial"
 CHI_semiconductor_events.325.b: "Une super-application domestique"
 CHI_semiconductor_events.325.c: "Un éditeur de jeux sous licence"
 CHI_semiconductor_events.325.e: "Un groupe de messagerie indépendant"
 CHI_tencent_global_platform_conglomerate: "Conglomérat de plateforme mondiale"
 CHI_tencent_global_platform_conglomerate_desc: "Tencent possède des studios, des réseaux de paiement et de la messagerie sur quatre continents, et l'essentiel de ce qu'elle gagne à l'étranger, elle le gagne par des entreprises achetées plutôt que construites. Les holdings valent ce que les marchés disent qu'elles valent."
 CHI_tencent_domestic_superapp: "Super-application nationale"
 CHI_tencent_domestic_superapp_desc: "Messagerie, paiements, transports et services gouvernementaux passent tous par une seule application sur une infrastructure intérieure à la Chine. Tencent a cessé d'être une entreprise que les gens utilisent pour devenir la couche sur laquelle tout le reste est construit."
 CHI_tencent_licensed_games_publisher: "Éditeur de jeux sous licence"
 CHI_tencent_licensed_games_publisher_desc: "Tencent expédie ce que le régulateur approuve, selon le calendrier que le régulateur fixe, et les approbations arrivent parce que l'appareil de conformité a été bâti avant d'être exigé. C'est une activité plus petite et stable."
 CHI_tencent_independent_messaging: "Groupe de messagerie indépendant"
 CHI_tencent_independent_messaging_desc: "Tencent a gardé QQ, gardé ses ingénieurs, et s'est tenue à l'écart des disputes qui ont consumé le reste de l'internet chinois. Sa portée n'a jamais quitté le messager."
 CHI_semiconductor_events.330.t: "Vingt millions de Tokyo"
 CHI_semiconductor_events.330.d: "Masayoshi Son a offert à Alibaba vingt millions de dollars après une réunion de quelques minutes, et SoftBank veut une large part d'une entreprise sans recettes. Jack Ma peut prendre l'argent japonais et la question de propriété qui l'accompagne. Ou il peut commencer à facturer les exportateurs du site maintenant, tandis qu'ils apprennent encore à quoi il sert."
 CHI_semiconductor_events.330.a: "Prendre l'argent de SoftBank"
 CHI_semiconductor_events.330.b: "Facturer les marchands et s'autofinancer"
 CHI_semiconductor_events.331.t: "Taobao contre eBay"
 CHI_semiconductor_events.331.d: "eBay possède EachNet et avec lui l'essentiel du commerce grand public en Chine, et a dit au marché que le concours est terminé. Alibaba peut installer une équipe dans un appartement de Hangzhou et construire un rival qui ne facture rien aux vendeurs aussi longtemps qu'il le faudra. Rester dans le commerce interentreprises est rentable et cède définitivement le marché grand public."
 CHI_semiconductor_events.331.a: "Construire Taobao et ne rien facturer aux vendeurs"
 CHI_semiconductor_events.331.b: "Tenir le commerce interentreprises"
 CHI_semiconductor_events.332.t: "Le milliard de Yahoo"
 CHI_semiconductor_events.332.d: "Yahoo paiera un milliard de dollars et cédera son opération chinoise pour quarante pour cent d'Alibaba, le plus grand investissement étranger jamais fait dans une entreprise internet chinoise. L'argent règle la question du financement pour une décennie. Il place aussi un siège au conseil étranger au-dessus de l'entreprise qui fait tourner le commerce du pays."
 CHI_semiconductor_events.332.a: "Prendre le milliard et le siège au conseil avec"
 CHI_semiconductor_events.332.b: "Garder le registre chinois"
 CHI_semiconductor_events.333.t: "Alipay quitte le groupe"
 CHI_semiconductor_events.333.d: "La banque centrale ne licenciera des opérateurs de paiement qu'entre des mains intérieures, et Alipay a été transféré dans une société que Jack Ma contrôle sans le soumettre au conseil d'Alibaba. Les administrateurs l'ont appris après coup. Inverser le transfert, c'est négocier la licence avec le régulateur à la place, l'activité de paiement d'Alibaba gelée pendant ce temps."
 CHI_semiconductor_events.333.a: "Garder le transfert et transiger avec les actionnaires"
 CHI_semiconductor_events.333.b: "L'inverser et négocier la licence"
 CHI_semiconductor_events.334.t: "L'introduction d'Ant est stoppée"
 CHI_semiconductor_events.334.d: "L'introduction d'Ant Group, la plus grande jamais tentée, a été suspendue deux jours avant la cotation, après que Jack Ma a dit à un public de Shanghai que les régulateurs tiennent un mont-de-piété. Alibaba peut se retirer et reconstruire Ant comme holding financière supervisée. Insister, c'est tester si l'État laissera une firme privée détenir autant du crédit chinois."
 CHI_semiconductor_events.334.a: "Se retirer et accepter la supervision"
 CHI_semiconductor_events.334.b: "Pousser l'introduction"
 CHI_semiconductor_events.335.t: "Ce qu'Alibaba est devenu"
 CHI_semiconductor_events.335.d: "Un quart de siècle de décisions sur le capital étranger, le commerce grand public et la part de la finance chinoise qu'une seule entreprise privée peut détenir ont fixé ce qu'est Alibaba."
 CHI_semiconductor_events.335.a: "Une épine dorsale du commerce supervisé"
 CHI_semiconductor_events.335.b: "Un marché de consommation ouvert"
 CHI_semiconductor_events.335.c: "Une maison de commerce à capitaux étrangers"
 CHI_semiconductor_events.335.e: "Un courtier d'exportation en gros"
 CHI_alibaba_supervised_commerce_backbone: "Colonne vertébrale du commerce supervisé"
 CHI_alibaba_supervised_commerce_backbone_desc: "Entrepôts, réseaux de livraison et centres de données à l'intérieur de la Chine portent l'essentiel de ce que le pays achète, et un régulateur siège au-dessus du crédit qui y transite. Alibaba a cessé de discuter de qui le supervise et a construit ce qui ne peut pas être remplacé."
 CHI_alibaba_open_consumer_marketplace: "Marché de consommation ouvert"
 CHI_alibaba_open_consumer_marketplace_desc: "N'importe qui peut lister et la plateforme prend sa part de ce qui se vend. Alibaba n'a jamais accepté un superviseur sur son bras financier, et l'arrangement dure tant que personne n'insiste."
 CHI_alibaba_foreign_capitalised_trading_house: "Maison de commerce à capitaux étrangers"
 CHI_alibaba_foreign_capitalised_trading_house_desc: "Alibaba fait tourner le commerce et des actionnaires étrangers tiennent le registre. Le capital a porté plus loin que l'activité."
 CHI_alibaba_wholesale_export_broker: "Courtier d'exportation en gros"
 CHI_alibaba_wholesale_export_broker_desc: "Alibaba met en relation les usines chinoises et les acheteurs étrangers et prend une commission sur l'introduction. Elle n'a jamais touché le marché grand public et n'a jamais eu besoin de la permission de quiconque pour continuer."
 CHI_semiconductor_events.340.t: "Toutiao n'a pas de rédacteurs"
 CHI_semiconductor_events.340.d: "L'application d'actualités de ByteDance classe les articles selon ce que les lecteurs ouvrent plutôt que selon ce qu'un rédacteur a choisi, et Zhang Yiming ne veut aucune rédaction au-dessus. La machine trouve un public plus vite qu'aucun pupitre. Elle servira aussi tout ce sur quoi ce public continue de cliquer, et quelqu'un finira par demander qui a décidé."
 CHI_semiconductor_events.340.a: "Laisser le système de classement décider"
 CHI_semiconductor_events.340.b: "Mettre une rédaction au-dessus du fil"
 CHI_semiconductor_events.341.t: "Douyin"
 CHI_semiconductor_events.341.d: "ByteDance peut mettre le même système de classement derrière quinze secondes de vidéo et le laisser choisir ce qu'un inconnu voit ensuite. Rien dans le modèle n'a été conçu pour autre chose que du texte. Le garder sur l'actualité, c'est l'activité qui marche déjà."
 CHI_semiconductor_events.341.a: "Mettre le système de classement derrière la vidéo courte"
 CHI_semiconductor_events.341.b: "Le garder sur l'actualité et le texte"
 CHI_semiconductor_events.342.t: "Zhang Yiming s'excuse"
 CHI_semiconductor_events.342.d: "Les régulateurs ont fermé Neihan Duanzi définitivement et retiré Toutiao des magasins d'applications, disant à ByteDance que son algorithme a devancé les valeurs fondamentales socialistes. Zhang Yiming peut publier l'autocritique et embaucher les milliers de relecteurs que l'État attend. Contester l'ordre, c'est arguer que la production d'une machine n'est pas la parole de l'entreprise."
 CHI_semiconductor_events.342.a: "Publier les excuses et embaucher les relecteurs"
 CHI_semiconductor_events.342.b: "Contester l'ordre"
 CHI_semiconductor_events.343.t: "Vendre TikTok ou le perdre"
 CHI_semiconductor_events.343.d: "Washington a ordonné à ByteDance de vendre l'activité américaine de TikTok, et Oracle et Walmart ont monté une offre en quelques semaines. Pékin vient d'ajouter les algorithmes de recommandation à sa liste de contrôles à l'export, donc le modèle ne peut pas partir sans licence. ByteDance peut refuser de l'exporter et perdre le marché américain, ou céder la technologie avec l'entreprise."
 CHI_semiconductor_events.343.a: "Refuser d'exporter l'algorithme"
 CHI_semiconductor_events.343.b: "Vendre l'activité américaine avec la technologie"
 CHI_semiconductor_events.344.t: "Céder ou être interdit"
 CHI_semiconductor_events.344.d: "Le Congrès a donné à ByteDance moins d'un an pour vendre les opérations américaines de TikTok ou perdre les magasins d'applications, et les tribunaux sont la seule voie restante. Plaider maintient l'entreprise ensemble à un coût considérable et peut échouer de toute façon. Séparer l'activité américaine met fin au combat, et à la propriété avec."
 CHI_semiconductor_events.344.a: "Plaider et garder l'entreprise entière"
 CHI_semiconductor_events.344.b: "Séparer l'activité américaine"
 CHI_semiconductor_events.345.t: "Qu'est devenu ByteDance"
 CHI_semiconductor_events.345.d: "Quatorze ans de décisions sur qui classe le fil, qui le relit, et si le modèle peut quitter la Chine ont fixé ce qu'est ByteDance."
 CHI_semiconductor_events.345.a: "Un moteur de recommandation souverain"
 CHI_semiconductor_events.345.b: "Une plateforme d’attention mondiale"
 CHI_semiconductor_events.345.c: "Un utilitaire d'informations sous licence"
 CHI_semiconductor_events.345.e: "Un groupe de presse éditorial"
 CHI_bytedance_sovereign_recommendation_engine: "Moteur de recommandation souverain"
 CHI_bytedance_sovereign_recommendation_engine_desc: "Le modèle qui décide ce qu'un milliard de personnes voient ensuite a été entraîné en Chine, tourne en Chine, et ne peut pas être exporté sans licence. ByteDance a renoncé au marché américain plutôt que d'expédier les poids."
 CHI_bytedance_global_attention_platform: "Plateforme d'attention mondiale"
 CHI_bytedance_global_attention_platform_desc: "ByteDance porte plus loin qu'aucune entreprise chinoise avant elle, et le fait à des conditions que les gouvernements étrangers renégocient quand ils le choisissent. Le public est réel et la permission n'est pas permanente."
 CHI_bytedance_licensed_information_utility: "Utilitaire d'informations sous licence"
 CHI_bytedance_licensed_information_utility_desc: "ByteDance classe ce qu'elle est licenciée à classer et relit tout avant de le servir. Le régulateur a cessé de la traiter comme un problème."
 CHI_bytedance_editorial_news_group: "Groupe de presse éditorial"
 CHI_bytedance_editorial_news_group_desc: "ByteDance a gardé une rédaction au-dessus du fil et n'a jamais construit la plateforme vidéo. Elle publie de l'actualité, et les disputes sur qui a choisi le classement n'ont jamais eu lieu."
 CHI_TAI_intl_org_blockade_embargo_tt: "Chaque pays qui reconnaît encore [TAI.GetNameWithFlag] est placé sous un §Yembargo commercial§!."
 CHI_taiwan_us_support_collapse_tt: "$CHI_taiwan_us_support$ s'effondre à §Y0§!"
 china_sar.049.t: "Washington retire sa garantie"
 china_sar.049.d: "Les États-Unis ont notifié à Taipei que leur garantie de sécurité n'est plus en vigueur et que la désignation de Taïwan comme allié majeur non membre de l'OTAN a été retirée. Les transferts d'armes sont suspendus, les exercices conjoints annulés, et le personnel de liaison réduit à une présence symbolique. Taïwan se tient désormais sans son principal garant de sécurité."
 china_sar.049.a: "Nous devrons nous défendre nous-mêmes."
