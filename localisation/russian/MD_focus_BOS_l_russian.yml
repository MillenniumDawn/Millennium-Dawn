 event_chain_will_fire: "Серия забастовок и политических столкновений проверит, сможет ли организованное рабочее движение заменить существующую коалицию."
 news.83.t: "Босния возвращается к гражданской войне"
 news.83.desc: "Республика Сербская провозгласила независимость, и в Боснии и Герцеговине возобновилась гражданская война. Международные организации призвали к немедленному прекращению огня в связи с мобилизацией сил субъектов по всей стране."
 news.83.a: "Дейтонский мирный договор провалился."
 news.84.t: "Моджахеды присоединяются к Боснийской войне"
 news.84.desc: "Бойцы группировки «Эль Муджахид» порвали с Сараево и провозгласили исламистское государство в Боснии. Их вмешательство добавляет к конфликту третью вооруженную группировку и вызвало осуждение со стороны соседних правительств."
 news.84.a: "Война обострилась."
 news.86.t: "Гражданская война в Боснии завершилась."
 news.86.desc: "Победившая фракция восстановила контроль над Боснией и Герцеговиной, разгромив оставшиеся отколовшиеся силы. Теперь правительству предстоит демобилизация, реконструкция и еще одна попытка политического урегулирования."
 news.86.a: "Боевые действия окончены."
 if_a_strike_happens_this_may_lead_to_a_shift_in_government_tt: "Если произойдёт забастовка, это может привести к смене власти."
 BOS_bosniak_lead_government: "Правительство во главе с боснийцами"
 BOS_bosniak_lead_government_desc: "Коалиция во главе с боснийцами будет уделять приоритетное внимание национальным институтам и будет стремиться либо к примирению с Западом, либо к более конфронтационной реваншистской программе."
 BOS_House_of_Representatives_shortcut: "Палата представителей"
 BOS_prepping_an_offensive_shortcut: "Подготовка наступления"
 BOS_post_war_effort_shortcut: "Послевоенные усилия"
 BOS_politicized_army_shortcut: "Политизированная армия"
 BOS_srpska_lead_government: "Правительство под руководством Сербской"
 BOS_expand_federalization: "Расширить федерализацию"
 BOS_politicized_army: "Политизированная армия"
 BOS_srpska_lead_government_desc: "Коалиция под руководством Республики Сербской будет защищать институты образований и добиваться сотрудничества с восточными партнёрами, а затем сделает выбор между кооперативным федерализмом и политическим превосходством."
 BOS_expand_federalization_desc: "Расширение полномочий субъектов позволит защитить местные институты, сохраняя при этом согласованность внешней и оборонной политики Боснии."
 BOS_politicized_army_desc: "Лояльность образованиям и политические назначения по-прежнему разделяют вооружённые силы. Постепенная интеграция может создать профессиональный национальный институт."
 BOS_anti_government_demonstrations: "Антиправительственные демонстрации"
 BOS_politicized_army_idea: "Политизированная армия"
 BOS_politicized_army_idea_desc: "Параллельная лояльность, политические назначения и обособленные военные традиции препятствуют национальному командованию. Последовательные реформы могут превратить вооруженные силы в профессиональную организацию."
 BOS_aggressive_nation: "Агрессивная позиция"
 BOS_aggressive_nation_desc: "Нация заняла агрессивную военную позицию для достижения своих военных целей."
