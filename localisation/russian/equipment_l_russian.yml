 CZE_attack_helicopter_1: "Ми-171Ш"
 CZE_attack_helicopter_1_desc: "Ми-8/Ми-17/Ми-18, модернизированный в стране до уровня базового ударного вертолёта с ракетами классов «воздух-поверхность» (AGM) и «воздух-воздух» (AAM) на подкрыльевых пилонах. Вертолёт по-прежнему способен перевозить внутри 16 пассажиров."
 CZE_attack_helicopter_2: "Ми-24Д"
 CZE_attack_helicopter_2_desc: "Экспортная версия советского Ми-24, производимая в стране, с новым чешским программным и аппаратным обеспечением, включая новый комплекс датчиков, оптику и модернизированную бортовую сеть вертолёта, упрощённую и приведённую к современным стандартам."
 CZE_attack_helicopter_3: "Ми-35М"
 CZE_attack_helicopter_3_desc: "Ми-35М — 1-я партия модернизаций этой машины. Он имеет 6 подкрыльевых пилонов, которые могут нести множество типов управляемого и неуправляемого вооружения или подвесных пушечных контейнеров последнего поколения."
 CZE_attack_helicopter_4: "BV-38 Blesk"
 CZE_attack_helicopter_4_desc: "Опыт прошлых модернизаций вертолётов и проектов позволил нам спроектировать собственный боевой вертолёт. Результатом стал BV-14 Blesk, у которого в дополнение к несущему винту есть толкающий винт, позволяющий этому вертолёту развивать потрясающую скорость 450 км/ч. Это было достигнуто также благодаря очень обтекаемой и аэродинамичной форме и размещению всего вооружения во внутренних отсеках. В чрезвычайных ситуациях всегда наготове две ракеты класса «воздух-воздух», которые можно запустить даже из внутреннего отсека в секторе 90 градусов перед вертолётом."
 CZE_attack_helicopter_5: "BV-43 Vichr"
 CZE_attack_helicopter_5_desc: "Первые прототипы малозаметных вертолётов с кодовыми обозначениями BV-40, 41 и 42 привели к созданию этой машины, объединившей их возможности. Вертолёт использует многие решения BV-38, а также оснащён внутренним автоматическим перезаряжателем для ракет, что позволяет ему обходиться без внешних пилонов даже при необходимости, в отличие от BV-38. Вместо них имеется 4 шахты для ракет, в которых размещены две AGM и две AAM, а в автоматическом перезаряжателе — ещё по 16 ракет каждого типа."
 CZE_transport_helicopter_1: "Миль Ми-4 CZ"
 CZE_transport_helicopter_1_desc: "Отечественная версия советского Ми-4, используемая для переброски различных грузов и десантирования войск, оснащена новым двигателем и переоборудованным внутренним пространством планера с увеличенным грузовым пространством и новым дизайном кабины пилота."
 CZE_transport_helicopter_2: "Миль Ми-17М CZ"
 CZE_transport_helicopter_2_desc: "Отечественная версия советского Ми-8, используемая в качестве крупного транспортного вертолёта, способного перевозить 16 пассажиров и 2 пилотов. Она оснащена новой цифровой кабиной пилотов и бортовыми пулемётами."
 CZE_transport_helicopter_3: "V-5 Kolovrátek"
 CZE_transport_helicopter_3_desc: "Опыт прошлых модернизаций вертолётов и проектов позволил нам спроектировать собственные машины с нуля. В результате появились прототипы V-1,2,3 и 4, а затем их первая серийная модель — V-5. Она имеет 26-метровые лопасти несущего винта, что позволяет ей перевозить многие тонны груза или небольшую машину."
 CZE_transport_helicopter_4: "V-15 Skokan"
 CZE_transport_helicopter_4_desc: "Этот вертолёт имеет два несущих винта, установленных на крыльях, и может доставлять к месту назначения ещё большее количество грузов или пассажиров. Он также оснащён оборонительным вооружением и ракетами класса «воздух-воздух»."
 CZE_transport_helicopter_5: "V-41 Sokol"
 CZE_transport_helicopter_5_desc: "Малозаметный вертолёт с аэродинамичным корпусом, покрытым радиопоглощающими материалами; груз и опционально устанавливаемое вооружение размещаются во внутреннем отсеке."
