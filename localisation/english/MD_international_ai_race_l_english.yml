l_english:
 AI_RACE_GUI_LEDGER_TT: "§YThe AI Race§!"
 AI_RACE_GUI_LEDGER_TT_DELAYED: "Track the world race to frontier AI: every participant's stage and capability, and who finishes first."
 IS_title_ai_race: "THE AI RACE"
 AI_RACE_tab_status_off: "The AI Race is turned off in this game's rules."
 AI_RACE_tab_status_upcoming: "The race begins in January 2016. Every country that has researched Modern Deep Learning joins it, and stage investments open then."
 AI_RACE_tab_status_empty: "No country has joined the race yet. A country joins once it has researched Modern Deep Learning."
 AI_RACE_tab_status_full: "Every participant is ranked each quarter by stage, completed stage work and capability.\nFirst to Frontier AI: §Y[ai_race_first_finisher_name]§!"
 AI_RACE_tab_status_outcomes: "Outcomes Only: participants are ranked each quarter by capability. Stage investments are off in this game's rules."
 AI_RACE_tab_leaderboard: "World Leaderboard"
 AI_RACE_tab_status_tt: "From January 2016, every country that has researched §YModern Deep Learning§! joins the race. Rankings are recalculated every quarter."
 AI_RACE_tab_leaderboard_tt: "Countries are ranked by stage first, then by completed work toward the next stage, then by §YCapability§!.\nThe stages are §YResearch§!, §YImplementation§!, §YExpansion§! and §YFrontier AI§!. Capability is lowered when a country runs short of the factories, network, power or materials its stage needs."
 AI_RACE_tab_help_tt: "§YThe AI Race§!\nFrom 2016, countries with Modern Deep Learning can fund four national AI stages. Each stage costs an upfront investment and needs civilian factories, Network Infrastructure, power, microchips, composites and oil. Funded stages raise research speed, production efficiency growth and office income."
 AI_RACE_tab_help_tt_delayed: "Manage your own program in §YDecisions§!, under §YThe AI Race§!: your stage, the six requirements, financing and the stage reviews. This tab shows the world leaderboard. The race can be set to Full, Outcomes Only or Off in the game rules."
