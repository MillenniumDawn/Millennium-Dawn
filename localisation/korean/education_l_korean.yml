l_korean:
 education_dynamic_modifier: "문맹률 변화 변동치"
 education_dynamic_modifier_desc: "지원금을 증가하고, 인내심과 함께 천천히 지속적으로 지도하면, 이 나라의 §Y문맹률§!이 크게 개선될 여지가 있습니다.읽고 쓰는 능력이 높을수록 §H사무직§!과 같은 교육 부문에서 생산성이 높아집니다.\n\n그러나 물론, 낮은 문맹율로 인한 장점도 있습니다. 예를 들면 §Y농업 기반 국가§!가 될 수도 있죠..."
 education_category: "[ROOT.GetNameWithFlag]의 문맹률"
 education_category_desc: "As a nation that struggles with getting its populace the education it needs, [ROOT.GetName] needs to manage their education budget effectively so it can reduce the maluses of §Y$education_dynamic_modifier$§!, you will be given a report on the §YLiteracy Rate§! annually around the end of the school year.\n§YEvents§!, §YDecisions§! and choices made in the §YFocus Tree§! may increase (or decrease) this rate.\n\nAt a §YLiteracy Rate§! of 95%, [ROOT.GetName] will lose this mechanic, this mechanic will return should the §YLiteracy Rate§! fall below 90%, this may happen due to various factors.\n\n[ROOT.GetNameWithFlag]'s Current §YLiteracy Rate§!: [?ROOT.literacy_rate|%2]"
 literacy_rate_change_TT: "§Y문맹률§!이 [?LR_change|+%2] 만큼 변화합니다"
 literacy_rate_change_event_TT: "§Y문맹률§!이 [?literacy_change_stored|+%2] 만큼 변화합니다"
 lit_rate_TT_yes: "\n\n[FROM.GetName]은 현재 [?FROM.literacy_rate|Y%2]의 §Y문해력 비율§!을 가지고 있습니다. 합병이 발생하면 이것은 [ROOT.GetName]의 §Y문해력 비율§!에 영향을 미칠 것입니다!"
 education.1.t: "교육부 장관, 높은 문해력 비율 보고!"
 education.1.d: "Our prudent education funding and expertly managed curriculums have seemingly paid off, with a literacy rate above 95%, we can now call ourselves a highly educated and well learned society with little resistance from those naysayers, both within and outwith the nation's borders. In achieving this monumental goal, we will no longer receive annual reports on our nation's literacy rates."
 education.1.A: "내가 아직 매일 사과를 받고 있나?"
 education.2.t: "교육부 장관, 문해력 비율 저하 보고!"
 education.2.d: "우리의 최선의 노력에도 불구하고, 우리의 문해력 비율은 떨어진 것 같습니다. 교육 시스템에 대한 충분한 자금 지원이 부족하거나 문맹률이 높은 사람들의 대규모 유입이 원인인지는 아무도 알 수 없지만, 우리는 다시 한번 우리 나라의 문해력 비율에 대한 연례 보고서를 받게 될 것입니다."
 education.2.A: "내 알파벳 책은 어디에 있니?"
 education_literacy_pulse.1.t: "여름방학이 시작됐다!"
 education_literacy_pulse.1.d: "여름 방학 동안, 우리는 학생들이 아무리 지루하더라도 국기를 경례하기를 바랍니다. 성적표가 나왔고 학생들의 시험이 채점되었습니다. 무슨 일이 있어도, 그들이 유용하게 지내기를 바랍니다"
 education_literacy_pulse.1.A: "우리의 성적이 좋기를 바란다."
 literacy_productivity_TT: "\n  Including Literacy: [?literacy_productivity_gain|3+]"