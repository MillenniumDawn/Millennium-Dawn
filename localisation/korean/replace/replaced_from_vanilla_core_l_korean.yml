 UNITS_VIEW_BTN_DRAW_OFFENCE: "§H공세선§!\n지도에서 §G우클릭 후 길게 눌러§! §Y공세선§!을 그립니다.\n선은 §H전선§! 또는 §H해상 상륙§!이 지정된 영토에만 그릴 수 있습니다.\n\n공세선이 있는 계획에 배정된 여단은 영토를 점령하며 전선을 그곳으로 옮기려 합니다. \n\n§G마우스 버튼을 누른 채§! 실행 방식 버튼 위에서 §G놓으면§! 계획의 실행 유형이 바뀝니다"
 UNITS_VIEW_BTN_DRAW_DEFENCE: "§H전선§!\n - 다른 나라와 맞닿은 국경 중 한 곳을 §G클릭§!하면 국경 전체를 따라 지정된 전선이 설정됩니다.\n - 다른 나라와 맞닿은 국경 중 한 곳에서 §G우클릭 후 드래그§!하면 더 짧은 구간에 전선이 설정됩니다.\n - 기존 전선의 끝점에서 §G우클릭 후 드래그§!하여 편집합니다.\n\n전선은 적 영토로 향하는 공격이 공세선을 향해 출발하는 지점이며, 외국 국경을 따라 여단을 신속하게 배치할 수 있게 해 주기도 합니다."
 UNITS_VIEW_BTN_DRAW_DEFENCE_ARMY_GROUP: "§H전선§!\n - 다른 나라와 맞닿은 국경 중 한 곳을 §G클릭§!하면 국경 전체를 따라 지정된 전선이 설정됩니다.\n - 다른 나라와 맞닿은 국경 중 한 곳을 §GShift + 클릭§!하면 하위 군 전선 없이 국경 전체를 따라 지정된 전선이 설정됩니다.\n - 다른 나라와 맞닿은 국경 중 한 곳에서 §G우클릭 후 드래그§!하면 더 짧은 구간에 전선이 설정됩니다.\n - 다른 나라와 맞닿은 국경 중 한 곳에서 §GShift + 우클릭 후 드래그§!하면 하위 군 전선 없이 더 짧은 구간에 전선이 설정됩니다.\n - 기존 전선의 끝점에서 §G우클릭 후 드래그§!하여 편집합니다.\n\n전선은 적 영토로 향하는 공격이 공세선을 향해 출발하는 지점이며, 외국 국경을 따라 여단을 신속하게 배치할 수 있게 해 주기도 합니다."
 UNITS_VIEW_BTN_DRAW_FALLBACK: "§H후퇴선§!\n - 아군 영토에서 §G우클릭 후 드래그§!하여 §Y일회용§! 방어 명령을 그립니다.\n\n후퇴선은 강 뒤편이나 아군 영토 내 다른 장소 등, 방어를 위해 여단을 배치할 때 유용합니다."
 UNITS_VIEW_BTN_AREA_DEFENSE: "§H지역 방어§!\n - 주를 §G클릭§!하여 군의 명령에 추가하거나 제외합니다.\n이 명령이 내려진 군은 다른 유형의 명령을 동시에 가질 수 없습니다.\n\n이 명령이 내려진 군에 배정된 여단은 지정된 지역에 분산하여 주요 도시, 항구 등의 중요 대상을 경비하고 소규모 적 병력에 대응합니다."
