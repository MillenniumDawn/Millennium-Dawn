 POL_sre_increase_effort_text: "국영 공장 수 증가"
 POL_sre_increase_effort_text_delayed: "할당량을 충족하는 데 사용할 공장이 늘어나지만, 건설 수요나 무역에는 사용할 수 없게 됩니다.\n\n§Y효과:§!\n[!POL_sre_increase_effort_button_click]"
 POL_sre_decrease_effort_text: "국영 공장 수 감소"
 POL_sre_decrease_effort_text_delayed: "국영 공장 수를 줄이는 대신 건설 수요나 기타 활동에 쓸 공장이 늘어납니다.\n\n§Y효과:§!\n[!POL_sre_decrease_effort_button_click]"
 POL_controlled_hospitals_idea: "통제된 병원"
 POL_false_history_idea: "거짓된 역사"
 POL_control_everything_category: "모든 것을 통제하라"
 POL_reach_out_to_the_usa_accept_tt: "미국이 우리나라와의 긴밀한 관계를 환영하며, NATO 가입으로 가는 길이 열립니다."
 POL_faction_ally_required_TT: "우리 세력의 구성원이 한 나라를 초과합니다."
 POL_bribe_the_politicians3: "정치인 매수"
 POL_promises_of_a_great_poland3: "위대한 폴란드의 약속"
 POL_economy_initial_idea: "폴란드 경제"
 POL_economy_initial_idea_desc: "1989년에 우리는 공산주의에서 벗어나 우리만의 경제 체제를 만들기 시작했습니다. 이 체제는 아직 매우 젊으며 결정되어야 할 것이 많습니다."
 POL_industrial_policy: "산업 정책"
 POL_industrial_policy_desc: "1990년대에 많은 국영 기업이 매각되었고 대부분은 무너졌습니다. 우리의 산업을 재건하려면 일관된 정책이 필요합니다."
 POL_construction_industry: "건설 산업"
 POL_construction_industry_desc: "공산주의 시대에 건설 산업은 정부의 최우선 과제 중 하나였습니다. 지금은 예전의 그림자에 불과하지만, 여전히 폴란드의 성장을 도울 잠재력을 보여 줍니다."
 POL_cop_revival: "COP 부활"
 POL_cop_revival_desc: "1930년대부터 중앙 산업 지구(COP)는 폴란드의 산업 역량을 집약했으나, 대부분이 매각되었습니다. 그러나 이곳을 폐허에서 일으켜 세울 숙련된 노동력이 아직 남아 있습니다. 가능한 한 빨리 부활에 투자해야 합니다."
 POL_mass_scale_construction: "대규모 건설"
 POL_mass_scale_construction_desc: "1970년대에 폴란드는 프리캐스트 콘크리트 패널을 이용해 새로운 아파트 단지를 짓는 '비엘카 프위타' 공법을 선도하여 10년 만에 240만 가구의 새 주택을 공급했습니다. 그러나 주택 부족은 계속되고 있으므로 모두가 집을 가질 수 있도록 이 관행을 이어 가야 합니다."
 POL_innovation_in_construction: "건설 혁신"
 POL_innovation_in_construction_desc: "1970년대에 지은 아파트 단지는 품질이 낮아 현대 기준에는 전혀 미치지 못합니다. 국민의 생활 수준이 서방 국가들을 따라잡도록 더 쾌적한 아파트를 지어야 합니다."
 POL_new_housing_guidelines: "새 주택 지침"
 POL_new_housing_guidelines_desc: "1989년에 중앙 계획을 폐기한 이후 공공 공간의 조직이 엉망이 되었습니다. 새로운 주거 지역을 어떻게, 어디에 지을지에 대한 새 정책이 필요합니다."
 POL_dutch_housing_expertise: "네덜란드 주택 전문 지식"
 POL_dutch_housing_expertise_desc: "네덜란드는 1960년대에 도시 스프롤 문제를 겪었습니다. 그들은 자전거 이용 장려와 저층 주거 지역의 버스·트램 노선망 통합으로 이를 해결했습니다. 국민의 내 집 소유 욕구를 유지하면서도 일관된 도시 계획 정책을 원한다면 그들의 체계에서 많은 좋은 사례를 취할 수 있습니다."
 POL_korean_housing_expertise: "한국 주택 전문 지식"
 POL_korean_housing_expertise_desc: "대한민국의 신도시 모델은 한국인들이 일자리가 있는 급속히 발전하는 도시로 이주하도록 도왔습니다. 그 결과 한국인의 90% 이상이 잘 조직된 도시에 거주하게 되었습니다. 대도시가 빠르게 발전하는 대신 농촌이 정체되는 '번영의 섬' 모델을 추구하고자 한다면 이 접근법을 본받을 수 있습니다."
 POL_mieszkanie_plus_program: "주택 플러스 프로그램"
 POL_mieszkanie_plus_program_desc: "'주택 플러스(Mieszkanie Plus)' 프로그램은 PiS 정치인들이 제안한 것으로, 국가가 자금을 대어 주택을 건설하고 시장가 이하로 임대하는 방식입니다. 이는 주택 가격의 급등을 막을 수 있지만, 비판자들은 건설 비용이 지나치게 크다고 지적합니다."
 POL_safe_mortgage_program: "안전 주택담보대출 프로그램"
 POL_safe_mortgage_program_desc: "'안전 주택담보대출 2%' 프로그램은 PiS가 국민의 주택담보대출을 보조하기 위해 제안한 것입니다. 특히 금리가 높을 때 필수적이지만, 반대자들은 이것이 은행이 보조금을 챙기는 결과로 이어질 뿐이라고 말합니다."
 POL_jeonse_rental_scheme: "전세 임대 제도"
 POL_jeonse_rental_scheme_desc: "대한민국에서 유래한 전세 임대 모델은 신속한 건설을 가능하게 했습니다. 이는 기존 아파트를 새 아파트 건설 자금을 조달하는 담보로 활용할 수 있게 합니다. 한국 기업들은 1997년 아시아 금융 위기 이후 이를 숙달했습니다. 이 모델을 활용해 부동산 건설에 대한 대규모 투자를 장려할 수 있습니다."
 POL_high_tech_industry: "첨단 기술 산업"
 POL_high_tech_industry_desc: "서방을 향한 개방으로 새로운 기술을 접할 수 있게 되었으며, 이를 경제 현대화에 활용할 수 있습니다."
 POL_focus_on_data_centers: "데이터 센터 집중"
 POL_focus_on_data_centers_desc: "데이터 센터는 디지털 경제의 근간입니다. 사람들의 삶에서 인터넷의 중요성이 커짐에 따라 디지털 기반시설의 필요성도 함께 커집니다. 데이터 센터를 건설하면 우리 지역 기업들이 혁신할 수 있습니다."
 POL_focus_on_semiconductors: "반도체 집중"
 POL_focus_on_semiconductors_desc: "반도체는 모든 디지털 기기의 가장 핵심적인 부품입니다. 휴대전화와 컴퓨터의 인기가 높아짐에 따라 반도체는 매우 귀중한 상품이 됩니다. 우리나라에 반도체 생산 시설을 세워 이를 활용할 수 있습니다."
 POL_go_all_in: "올인"
 POL_go_all_in_desc: "데이터 센터와 반도체는 모두 현대 경제에 필수적입니다. 비용이 극도로 높을 수 있지만, 우리나라는 우리가 떠안을 부채를 극복하고 성장할 것입니다. "
 POL_invite_microsoft: "마이크로소프트 초청"
 POL_invite_microsoft_desc: "마이크로소프트는 1980년대에 컴퓨터 시장을 석권했습니다. 최근 클라우드 컴퓨팅으로의 전환은 우리에게 기회를 제공합니다. 그들이 이곳에 애저 리전을 연다면, 우리는 적어도 몇 년간 클라우드 컴퓨팅의 지역 중심지가 될 것입니다."
 POL_azure_poland: "애저 폴란드"
 POL_azure_poland_desc: "중부 유럽 최초의 클라우드 센터를 유치한 후, 우리는 마이크로소프트와 협력하여 우리의 필요에 맞춘 고유한 클라우드 환경을 만들 수 있으며, 이는 데이터 보호를 보장하기 위해 글로벌 애저 생태계로부터의 분리도 가능하게 합니다."
 POL_azure_europe: "애저 유럽"
 POL_azure_europe_desc: "유럽의 미국 기술 의존이 EU 의사결정자들을 불안하게 하기 시작하면서, 애저 폴란드는 미국의 전문 지식과 주권 클라우드 원칙을 결합하는 방법의 완벽한 본보기가 됩니다. 이를 EU 전체로 확대하는 것은 진정한 유럽 디지털 생태계를 만드는 첫걸음이 될 수 있습니다."
 POL_bielik_ai: "비엘리크 AI"
 POL_bielik_ai_desc: "비엘리크 AI는 폴란드어로 자체 학습한 폴란드 AI 모델입니다. 그 기반시설에 투자한다면 미국과 중국의 가장 강력한 AI 모델에 필적하는 완전한 주권 AI 솔루션을 개발할 수 있습니다."
 POL_euro_stack: "유로 스택"
 POL_euro_stack_desc: "우리에게는 우리가 완전히 통제하는 EU 디지털 생태계, 즉 '유로 스택'을 구축하는 데 필요한 모든 요소가 있습니다. 유럽 시민들은 이제 데이터가 미국으로 흘러 들어갈 걱정 없이 우리가 제공하는 모든 디지털 서비스에 자유롭게 몰입할 수 있습니다."
 POL_beyond_dc1: "비욘드 DC1"
 POL_beyond_dc1_desc: "비욘드 데이터 센터 1은 2005년 포즈난에 소규모 데이터 센터로 설립되었습니다. 이후 10년 동안 클라우드 컴퓨팅 분야에서 믿을 수 있는 비즈니스 파트너라는 평판을 쌓았습니다."
 POL_beyond_dc2: "비욘드 DC2"
 POL_beyond_dc2_desc: "DC1의 운영 공간이 한계에 이르자 훨씬 더 큰 데이터 센터가 필요해졌고, 이에 따라 2016년 DC2가 건설되었습니다. DC2는 클라우드 컴퓨팅에서 세계적 수준의 표준을 세웠으며 많은 대기업이 디지털 업무를 이곳에서 운영하기 위해 몰려들었습니다."
 POL_beyond_ai_expansion: "DC2 AI 확장"
 POL_beyond_ai_expansion_desc: "2025년에 비욘드 DC2는 폴란드 최초로 서비스형 AI 솔루션을 제공하는 데이터 센터가 되어, 폴란드를 AI 분야의 혁신 국가들과 어깨를 나란히 하게 만들었습니다."
 POL_ai_haven: "AI의 안식처"
 POL_ai_haven_desc: "AI 기술에 대한 지속적인 투자로 폴란드는 AI 개발의 세계적 선도국이 되었습니다. 의존 관계는 역전되어, 미국 기업들조차 해결책을 찾아 폴란드 AI 기업들을 바라보기 시작했습니다."
 POL_invite_siemens: "지멘스 초청"
 POL_invite_siemens_desc: "지멘스는 독일의 전자 및 기반시설 기업입니다. 그들의 제품은 신뢰성과 품질의 대명사입니다. 이들을 초청하여 마이크로칩 공장을 건설하면 고품질 칩의 공급을 확보할 수 있습니다."
 POL_invite_intel: "인텔 초청"
 POL_invite_intel_desc: "인텔은 칩 제조 분야의 선두 주자입니다. 그들의 막대한 규모 덕분에 마이크로칩 공장을 다소 저렴하게 건설할 수 있지만, 우리 경제에 더 많은 미국 자본이 유입되어 미국이 우리와의 거래에서 점점 더 큰 영향력을 갖게 됩니다."
 POL_invite_samsung: "삼성 초청"
 POL_invite_samsung_desc: "삼성전자는 유럽에 거점을 마련하고자 열망하는 급성장 중인 대한민국 기업입니다. 우리는 그들에게 마이크로칩 공장 두 곳을 건설하는 거래를 제안할 수 있으며, 이는 우리의 칩 수요를 충족시킬 뿐만 아니라 유럽 최대의 칩 수출 거점 중 하나가 될 수 있게 해 줍니다."
 POL_start_microchip_production: "마이크로칩 생산 시작"
 POL_start_microchip_production_desc: "마이크로칩 생산 시설이 가동 준비를 마쳤습니다. 파트너와 거래를 매듭짓고 그 칩의 생산물을 누릴 때입니다."
 POL_official_knowhow_transfer: "공식 노하우 이전"
 POL_official_knowhow_transfer_desc: "현재의 마이크로칩 생산 덕분에 우리 기술자들이 공정을 배울 수 있었습니다. 우리 스스로 더 많은 칩을 생산할 수 있는 라이선스를 취득할 수 있습니다."
 POL_reverse_engineering: "리버스 엔지니어링"
 POL_reverse_engineering_desc: "우리의 뛰어난 기술자들이 칩 제조 공정을 익혔으므로, 이를 역설계하여 우리만의 버전을 개발할 수 있습니다. 라이선스 비용은 절약하지만 무역 파트너들과의 관계가 심각하게 악화될 위험이 있습니다."
 POL_semiconductor_powerhouse: "반도체 강국"
 POL_semiconductor_powerhouse_desc: "우리의 마이크로칩 생산이 크게 성장하여 칩 제조업체들이 우리나라를 '제2의 대만'이라고 부르기 시작했습니다. 이는 우리의 발전에 도움이 될 뿐만 아니라 전 세계에서의 무역 관계도 강화해 줍니다."
 POL_infrastructure_policy: "기반시설 정책"
 POL_infrastructure_policy_desc: "수십 년간의 방치 끝에 폴란드의 기반시설은 한심한 상태입니다. 시급한 관심이 필요합니다."
 POL_pkp_restructuring: "PKP 구조조정"
 POL_pkp_restructuring_desc: "폴란드 국영철도 PKP는 철도 서비스 운영에서 악명 높게 신뢰할 수 없는 국영 거대 기업입니다. 이를 분할하고 경영을 개선할 때입니다. PKP 인터시티는 열차를 운행하고, PKP PLK는 선로를 유지·보수하며, PKP SA는 자금을 제공할 것입니다."
 POL_cpk_planning: "포르트 폴스카"
 POL_cpk_planning_desc: "포르트 폴스카는 새로운 기반시설로 구현된 우리의 야망의 상징입니다. 폴란드 중부의 거대한 공항이 고속철도로 모든 주요 도시와 연결될 것입니다."
 POL_high_speed_rail_network: "고속철도망"
 POL_high_speed_rail_network_desc: "최고 속도 350km/h에 이르는 완전히 새로운 고속철도 노선망은 우리 도시들 사이의 연결을 크게 개선할 것입니다."
 POL_central_airport_construction: "중앙 공항 건설"
 POL_central_airport_construction_desc: "바르샤바와 우치 사이에 위치할 중앙 공항은 중부 유럽에서 가장 크며, 국제 여행을 위한 유럽의 주요 허브 역할을 할 것입니다."
 POL_military_logistics_hub: "군사 물류 거점"
 POL_military_logistics_hub_desc: "중앙에 위치한 이점을 활용하여 포르트 폴스카는 개선된 물류 계획과 보급품 운송으로 우리 군을 지원할 수 있습니다."
 POL_complete_cpk: "포르트 폴스카 완공"
 POL_complete_cpk_desc: "포르트 폴스카의 모든 핵심 부분이 완공되었으므로, 이제 인근의 새로운 도시 개발과 통합할 때입니다."
 POL_road_construction_policy: "도로 건설 정책"
 POL_road_construction_policy_desc: "'폴란드 도로'는 우리 도로 기반시설의 상태를 비꼬는 표현이 되어 왔습니다. 이제는 이에 대해 무언가를 할 때입니다."
 POL_establish_gddkia: "GDDKiA 설립"
 POL_establish_gddkia_desc: "새로 설립되는 국도·고속도로 총국은 도로의 유지·보수와 건설을 관리하고 자금을 조달하는 국가 기관의 역할을 할 것입니다. 이는 민간 부문 경영보다 훨씬 안정적입니다."
 POL_public_private_partnership: "민관 협력"
 POL_public_private_partnership_desc: "견고한 고속도로망을 구축하려면 우리에게 없는 막대한 자금이 필요합니다. 통행료 징수권을 대가로 민간 투자자들이 자기 자금으로 이를 건설하도록 유도해야 합니다."
 POL_financial_policy: "재정 정책"
 POL_financial_policy_desc: "폴란드의 자본주의는 이제 겨우 10년이 되었으며, 아직 다듬어지지 않은 거친 면이 있습니다. 우리 경제가 강하고 회복력 있게 성장할 수 있도록 이를 다듬어야 합니다."
 POL_social_radicalism: "사회 급진주의"
 POL_social_radicalism_desc: "발체로비치 계획이 가져온 현재의 자본주의 체제는 재앙입니다. 우리 경제가 어떤 모습이어야 하는지 다시 생각하고, 오랫동안 가난하고 잊힌 이들을 옹호해 온 안제이 레페르를 초청하여 새 경제 체계의 초안 작성을 돕게 해야 합니다."
 POL_reverse_privatization: "민영화 되돌리기"
 POL_reverse_privatization_desc: "한때 위대했던 우리의 산업은 푼돈에 팔려 나갔습니다. 우리의 것을 되찾기 위해 부정 행위 가능성에 대한 조사를 시작해야 합니다."
 POL_ban_foreign_takeovers: "외국인 인수 금지"
 POL_ban_foreign_takeovers_desc: "발체로비치 계획 아래 우리의 산업은 외국 자본에 집어삼켜졌고, 외국 자본은 우리나라에서 모든 생산 자산을 빨아들여 우리에게 아무것도 남기지 않았습니다. 이런 일이 다시는 일어나게 해서는 안 됩니다."
 POL_crack_down_on_the_rich: "부유층 단속"
 POL_crack_down_on_the_rich_desc: "자본주의 체제는 10년 동안 우리 경제를 인질로 잡아 온 새로운 엘리트들을 만들어 냈습니다. 모두를 위한 공정한 체제를 원한다면 우리가 먼저 그들을 쳐야 합니다."
 POL_ban_private_education: "사교육 금지"
 POL_ban_private_education_desc: "가장 부유한 사람들의 자녀는 최고의 사립 교육 기관에 다니는 반면, 나머지는 재정이 부족한 공립학교에서 어려움을 겪고 있습니다. 이는 더 이상 계속될 수 없습니다."
 POL_ban_private_healthcare: "민간 의료 금지"
 POL_ban_private_healthcare_desc: "우리의 의료 체계는 만성적인 재원 부족으로 어려움을 겪고 있습니다. 동시에 고품질의 민간 병원은 부유층을 끌어들이면서 일반인에게는 터무니없이 높은 가격을 매기고 있습니다. 이는 끝나야 합니다."
 POL_ban_private_retirement: "민간 연금 금지"
 POL_ban_private_retirement_desc: "민간 퇴직 계좌는 우리의 사회 보험 제도가 적절한 재원을 갖추지 못한 동안 부유층이 대중으로부터 재산을 감춰 쌓아 두게 합니다. 부유층을 제도 안으로 편입시킴으로써 모두가 은퇴 시 합당한 연금을 받도록 보장할 수 있습니다."
 POL_leppers_dream: "레페르의 꿈"
 POL_leppers_dream_desc: "우리는 1990년대의 제약 없는 자본주의 체제가 남긴 피해를 되돌리는 데 성공했습니다. 이제 폴란드인들이 자리를 잡고 모두에게 존엄과 평등을 보장하는 더 공정한 체제를 누릴 때입니다."
 POL_stable_economics: "안정적 경제"
 POL_stable_economics_desc: "우리 경제는 느리지만 꾸준히 발전하고 있습니다. 시민들의 경제적 자유와 기회를 지키면서 생활 수준이 지속적으로 향상되도록 안정을 수호해야 합니다."
 POL_progressive_income_tax: "누진 소득세"
 POL_progressive_income_tax_desc: "부유층은 정률 과세의 혜택을 받는 페이퍼 컴퍼니를 설립하여 정상적인 누진 과세를 회피합니다. 그 허점을 막아야 합니다."
 POL_safeguard_social_programs: "사회 프로그램 보호"
 POL_safeguard_social_programs_desc: "경제가 발전함에 따라 누구도 뒤처지지 않도록 해야 합니다. 우리의 사회 안전망은 도움이 필요한 모든 사람을 아울러야 합니다."
 POL_establish_cba: "CBA 설립"
 POL_establish_cba_desc: "부패는 우리 경제의 암과 같습니다. 새로 창설된 중앙반부패국(CBA)으로 부패를 뿌리 뽑기 시작할 수 있습니다."
 POL_inflation_target_policies: "물가 목표 정책"
 POL_inflation_target_policies_desc: "우리의 통화 정책은 인플레이션을 2%에서 3% 사이에서 최적으로 유지해야 합니다. 이 비율을 유지하기 위해 통화 공급에 대한 자동 제동 및 가속 장치를 도입해야 합니다."
 POL_wealth_tax: "부유세"
 POL_wealth_tax_desc: "자본주의 체제에서는 경제 발전의 혜택이 부유층에 집중되는 경향이 있습니다. 불평등이 통제 불능이 되지 않도록 가장 부유한 시민에 대한 부유세로 이에 대응해야 합니다."
 POL_child_tax_credit: "자녀 세액 공제"
 POL_child_tax_credit_desc: "중산층이 가정을 꾸리는 것보다 경력에 더 집중하면서 최근 출생률이 떨어지고 있습니다. 세액 공제 혜택을 통해 일부를 설득하여 자녀를 갖게 할 수 있습니다."
 POL_sovereign_wealth_fund: "국부 펀드"
 POL_sovereign_wealth_fund_desc: "우리나라가 세계 경제에 통합됨에 따라, 일부 공적 자금을 따로 떼어 전 세계의 수익성 있는 기업의 주식을 사들여 더 많은 돈을 벌게 할 수 있습니다."
 POL_strengthen_the_zloty: "즐로티 강화"
 POL_strengthen_the_zloty_desc: "강한 통화는 국민의 구매력을 높이고 차입 비용을 낮출 수 있게 해 줍니다. 평가절하를 막는 정책을 더 많이 마련해야 합니다."
 POL_rural_development_subsidies: "농촌 개발 보조금"
 POL_rural_development_subsidies_desc: "폴란드의 농촌 지역이 뒤처져서는 안 됩니다. 도시와 함께 성장하도록 해야 합니다."
 POL_strengthen_the_pip: "PIP 강화"
 POL_strengthen_the_pip_desc: "국가노동감독청(PIP)은 폴란드의 노사 관계를 감독하는 주요 기관입니다. 안타깝게도 노동 사기에 맞서기에는 장비가 심각하게 부족하여 이를 강화해야 합니다."
 POL_constitution_for_business: "기업을 위한 헌법"
 POL_constitution_for_business_desc: "기업을 위한 헌법은 폴란드에서 사업을 수행하는 일을 간소화하는 일련의 법안을 일컫는 통칭입니다. 이를 제정하면 경제 성장을 촉진하는 데 도움이 될 것입니다."
 POL_remove_land_acquisition_limits: "토지 취득 제한 철폐"
 POL_remove_land_acquisition_limits_desc: "폴란드의 농업 부문은 지나치게 분산되어 있고 생산량이 최적이 아닙니다. 대규모 농업 기업이 더 강해져 농지를 통합해야 첨단 농업으로 향상된 생산량을 누릴 수 있습니다."
 POL_every_man_a_king: "모든 사람이 왕이다!"
 POL_every_man_a_king_desc: "우리 시민들은 관대한 사회 프로그램으로 빈곤에서 해방되었으며, 오늘날의 노동 계층이 18세기 왕들의 수준으로 살 수 있게 되었습니다. 휴이 롱도 자랑스러워할 것입니다!"
 POL_yes_we_can: "그래, 우리는 할 수 있다!"
 POL_yes_we_can_desc: "우리 사회는 전환기의 어려움을 견뎌 냈고 그로부터 더욱 단단해졌습니다. 공유된 경험에서 비롯된 사회적 유대는 평화롭고 행복한 사회를 가능하게 합니다."
 POL_you_can_do_it: "당신도 할 수 있다!"
 POL_you_can_do_it_desc: "우리 경제는 호황을 누리고 있으며 진취적인 폴란드인들에게 거의 무한한 기회를 제공합니다. 우리의 사업가들은 대담하게 나서며, 자신과 폴란드 전체의 위대함을 이루기 위해 어떤 것도 마다하지 않습니다."
 POL_balcerowicz_plan: "제2차 발체로비치 계획"
 POL_balcerowicz_plan_desc: "1990년대에 레셰크 발체로비치는 폴란드가 공산주의에서 자본주의로 신속하게 전환하도록 도운 일련의 과감한 개혁을 단행했습니다. 개혁은 이후 완화되었지만 추가 개혁을 위한 토대는 마련되었습니다. 이제 그것을 완수할 때입니다."
 POL_flat_income_tax: "정률 소득세"
 POL_flat_income_tax_desc: "더 많은 돈을 번다고 해서 누구도 처벌받아서는 안 됩니다. 보편적인 정률 소득세를 도입하면 우리 기업가들의 제약 없는 성장이 보장됩니다."
 POL_elastic_labor_market: "유연한 노동 시장"
 POL_elastic_labor_market_desc: "공산주의 시대의 잔재인 현행 노동법은 기업가들이 회사를 성장시키는 것을 제약합니다. 이러한 규제를 완화하면 경제 성장에 도움이 될 것입니다."
 POL_begin_privatization: "민영화 개시"
 POL_begin_privatization_desc: "폴란드 공공 부문은 만성적으로 비효율적이고 비대합니다. 민간 기업이 더 효율적인 공공 서비스 제공자로서 그 자리를 대신할 수 있도록 이를 정리하기 시작할 때입니다."
 POL_privatize_zus: "ZUS 민영화"
 POL_privatize_zus_desc: "사회보험공단(ZUS)은 연금 제도를 총괄하는 핵심 기관입니다. 대부분의 국민이 받는 연금이 재직 시 소득의 40%에 불과할 만큼 비효율적이라는 악명이 높으며, 사회가 고령화되면서 상황은 더욱 악화되고 있습니다. 이제 이 다단계식 구조를 끝내고 민간 연금이 그 자리를 대신하도록 할 때입니다."
 POL_privatize_nfz: "건강보험기금 민영화"
 POL_privatize_nfz_desc: "최근 설립된 건강보험기금(Kasy Chorych)은 의료 부문에 경쟁을 도입했다는 점에서 올바른 방향으로 나아간 한 걸음입니다. 그러나 여전히 막대한 공공 자금에 의존하고 있습니다. 민간 건강보험이 이를 넘겨받도록 허용하면 보험료를 더 효율적으로 책정할 수 있습니다."
 POL_privatize_schools: "학교 민영화"
 POL_privatize_schools_desc: "우리의 교육 제도는 질이 낮고 교사들은 터무니없이 낮은 보수를 받고 있습니다. 이 혼란을 개혁하려면 수년이 걸리므로, 민간 학교가 주도권을 쥐도록 하되 정부는 모두가 학교에 접근할 수 있도록 보장하는 편이 낫습니다."
 POL_dignity_for_all: "모두를 위한 존엄"
 POL_dignity_for_all_desc: "우리는 국민이 존엄한 삶을 영위하도록 보장하면서도 경제의 견실하고 안정적인 성장을 이루었습니다. 국민이 보살핌을 받고 있다고 느끼면서 급진 정당들은 존재감을 잃고 사라졌습니다."
 POL_true_free_market: "진정한 자유 시장"
 POL_true_free_market_desc: "민간 부문이 경제 전반을 지배하게 되었으므로, 빠르고 끝없는 성장에 필요한 모든 것을 갖추도록 뒷받침했습니다. 우리는 경제 강국이 될 준비를 마쳤습니다."
 POL_economy_modifier: "폴란드 경제"
 POL_economy_modifier_desc: "우리 경제는 변화를 위한 수많은 자극을 받았으며, 그중 일부는 좋았고 일부는 그렇지 못했습니다. 개혁이 거듭될수록 그 영향이 국가로서의 발전 방향을 좌우할 것입니다."
 POL_private_pensions: "민간 연금 제도"
 POL_private_pensions_desc: "연금 제도 전체를 민영화하자 그 자리에 수많은 민간 대안이 등장했습니다. 국가가 부유해질수록 국민의 저축이 순환하는 데서 더 많은 이익을 얻을 수 있습니다."
 POL_private_healthcare: "민간 의료 제도"
 POL_private_healthcare_desc: "과거의 의료 제도는 공산주의 체제의 유물이었습니다. 이를 없애자 민간 건강보험사와 병원 운영의 민관 협력이 결합된 체제가 자리 잡았습니다. 우리가 부유해질수록 의료의 질도 향상됩니다."
 POL_private_education: "민간 교육"
 POL_private_education_desc: "우리 학교는 한 세기가 넘도록 자기 돌봄보다 복종을 중시하는 낡은 프로이센식 모델에 갇혀 있었습니다. 우리는 이 모델을 신속히 해체했고, 이제 민간 학교와 대학이 혁신을 이끌고 있습니다. 시간이 지나면 제대로 된 현대적 기준이 정립되어 다음 세대에게 성장에 필요한 모든 것을 제공할 것입니다."
 POL_gddkia: "GDDKiA"
 POL_gddkia_desc: "국가도로고속도로총국은 신규 도로 건설 계약과 기존 도로 유지·보수를 전담하는 유일한 기관입니다. 도로 기반시설을 일원화하여 관리함으로써 국민을 위해 더 효율적으로 운영할 수 있습니다."
 POL_public_private_partnership_idea: "민관 협력"
 POL_public_private_partnership_idea_desc: "우리는 민간 자본을 활용하여 도로를 훨씬 빠르게 건설하고 있습니다. 장기적으로 유지 비용이 더 많이 들긴 하지만, 경제적 기회를 높여 주는 새 도로 덕분에 그 비용을 충분히 상회하는 성장을 이룰 수 있습니다."
 POL_microchips_production_category: "[FROM.GetAdjective] 마이크로칩 생산"
 POL_expand_samsung_microchips_production: "삼성 마이크로칩 생산 확대"
 POL_expand_samsung_microchips_production_desc: "첫 삼성 마이크로칩 공장이 가동을 시작한 이후 우리는 꾸준한 수출 수입을 누려 왔습니다. 수출 역량을 키우기 위해 더 많은 공장을 건설합시다."
 POL_expand_siemens_microchips_production: "지멘스 마이크로칩 생산 확대"
 POL_expand_siemens_microchips_production_desc: "첫 지멘스 마이크로칩 공장이 가동을 시작한 이후 우리는 꾸준한 수출 수입을 누려 왔습니다. 수출 역량을 키우기 위해 더 많은 공장을 건설합시다."
 POL_expand_intel_microchips_production: "인텔 마이크로칩 생산 확대"
 POL_expand_intel_microchips_production_desc: "첫 인텔 마이크로칩 공장이 가동을 시작한 이후 우리는 꾸준한 수출 수입을 누려 왔습니다. 수출 역량을 키우기 위해 더 많은 공장을 건설합시다."
 POL_establish_first_microchips_production: "마이크로칩 생산 시설 구축"
 POL_establish_first_microchips_production_desc: "우리는 폴란드에 마이크로칩 생산 시설을 건설하기 위해 외국 공급업체와 장기 협약을 체결하는 데 성공했습니다. 이는 큰 일의 시작이 될 수 있습니다."
 POL_all_in_cost_TT: "§R이 중점을 선택하면 모든 데이터 센터와 반도체 비용이 20% 증가합니다!§!"
