 UKR_kharkiv_pact_signed_tt: "§Y세바스토폴만§!의 §Y흑해 함대§! 임대 기간이 §Y2042§!년까지 연장됩니다. §YNATO§! 노선을 택하면 §Y2017§!년부터 기지 반환을 요구할 수 있습니다."
 UKR_kharkiv_pact_refused_tt: "§Y흑해 함대§!의 임대 기간은 §Y2017§!년에 만료됩니다. 그 후 우리는 §Y세바스토폴만§!의 반환을 요구할 것이며, §R러시아가 전쟁으로 응수할 수도 있습니다§!."
 UKR_sevastopol_naval_base_category: "세바스토폴 해군 기지"
 UKR_sevastopol_naval_base_category_desc: "\n\n\n\n\n\n£UKR_desctext_sevastopol_naval_base_main\n\n\n\n\n\n\n\n\n§WThe [SOV.GetFlag]§Y[SOV.GetAdjective] Black Sea Fleet§! is based on our territory under the 1997 agreements, and its lease on §YSevastopol Bay§! runs until §Y2017§!.\nWe may try to renegotiate it and push §Y[SOV.GetNameWithFlag]§! out of it earlier, but our chances greatly depends on our military strength, effective procurements of new military equipment or becoming a §YNATO§! member.\n\nThe demand costs §Y750§! £pol_power and §Y100§! £command_power in 2000 and gets §G50§! £pol_power and §G10§! £command_power cheaper each year through §Y2009§!, when it costs §Y300§! £pol_power and §Y10§! £command_power . Early termination is unavailable from §YJanuary 1, 2010§!, when we can prepare for the Kharkiv Pact instead.§!$UKR_sevastopol_russia_answer$"
 UKR_sevastopol_naval_base_terminate_bsf_lease: "§RTerminate§! the [SOV.GetFlag]§Y[SOV.GetAdjective]§! Black Sea Fleet\n§Ybase lease§!"
 UKR_sevastopol_naval_base_terminate_bsf_lease_desc: "\n\n\n\n\n\n£UKR_desctext_sevastopol_lease_for_tooltip\n\n\n\n\n\n\n\n\n§WThe 1997 agreements allow the [SOV.GetFlag]§Y[SOV.GetAdjective]§! fleet to stay in §YSevastopol§! until 2017. We can notify §YMoscow§! that we are ending the lease early and ask for the base to be handed over.\n\nIf §Y[SOV.GetNameWithFlag]§! agrees, §YSevastopol Bay§! §Greturns to our control§!. Otherwise §Rrelations§! with §Y[SOV.GetNameWithFlag]§! §Rworsen§!, but the lease still expires in §Y2017§!.\n\nPlease note, that this is a §Yone-time§! decision - if we are §Rnot prepared§! now - we will §Rnot have§! another chance to expell them §Yuntil§! the original deal is over.\n\nAfter we will take this decision, we will have to wait for §Y[SOV.GetFlag] [SOV.GetAdjective]§! response for a couple of days. Be prepared!§!"
 UKR_sevastopol_naval_base_prepare_kharkiv_pact: "하르키우 협정 준비"
 UKR_sevastopol_naval_base_prepare_kharkiv_pact_desc: "\n\n\n\n\n\n£UKR_desctext_kharkiv_pact_for_tooltip\n\n\n\n\n\n\n\n\n§W모스크바는 더 싼 가스를 대가로 §Y흑해 함대§! 임대를 연장하자고 제안합니다. 우리는 협정에 서명할지, 아니면 2017년에 임대가 끝나도록 둘지 결정해야 합니다.\n\n§R서명하면 임대가 연장되어§! §Y2042§!년까지 이어집니다. §G거부하면 만의 반환을 요구할 수 있게 되며§! §Y2017§!년부터 가능하지만, §R러시아가 이를 이유로 전쟁을 벌일 수도 있습니다§!.$UKR_sevastopol_russia_answer$§!"
 UKR_sevastopol_russia_answer: "\n\n§WHow §Y[SOV.GetNameWithFlag]§! answers our demand?\n§Y[SOV.GetNameWithFlag]§! can §Gwithdraw the fleet§!, §Yrefuse§!, or §Rdeclare war§!.\nOnce we are a §YNATO§! member - §Y[SOV.GetNameWithFlag]§! can only §Gwithdraw the fleet§!.\n\n§WWar prevention§!\nIf our §7Armed Forces§! and §7defense sector§! meet §Rall§! of the following requirements when §Y[SOV.GetNameWithFlag]§! answers, it will not §Rdeclare war§!. Meeting only some requirements has §Rno effect§!.\n\nStrength figures and their status markers are §Yupdated monthly§!. Russia checks our §Ycurrent strength§! when it answers, not this report. Changes since the last update can change the outcome:\n---§7Armed Forces strength§!---\n- §Y[?UKR_manpower_total_count]§! out of §Y1000000§! soldiers required [UKR_crimea_deterrent_status_manpower]\n- §Y[?UKR_mbts_total_count]§! out of §Y5000§! MBTs required [UKR_crimea_deterrent_status_tanks]\n- §Y[?UKR_artillery_total_count]§! out of §Y5000§! artillery pieces required [UKR_crimea_deterrent_status_artillery]\n- §Y[?UKR_spaa_total_count]§! out of §Y150§! SPAA/SAM batteries required [UKR_crimea_deterrent_status_spaa]\n- §Y[?UKR_aircraft_total_count]§! out of §Y1000§! aircraft required [UKR_crimea_deterrent_status_planes]\n- §Y[?UKR_ships_total_count]§! out of §Y100§! ships required [UKR_crimea_deterrent_status_ships]\n---§BAir defense strength§!---\n- §Y[?UKR_crimea_deterrent_aa_kyiv]§! out of §Y4§! in §Y[698.GetName]§! [UKR_sevastopol_status_air_defense_kyiv]\n- §Y[?UKR_crimea_deterrent_aa_kharkiv]§! out of §Y4§! in §Y[696.GetName]§! [UKR_sevastopol_status_air_defense_kharkiv]\n- §Y[?UKR_crimea_deterrent_aa_dnipro]§! out of §Y4§! in §Y[1087.GetName]§! [UKR_sevastopol_status_air_defense_dnipro]\n- §Y[?UKR_crimea_deterrent_aa_odesa]§! out of §Y4§! in §Y[695.GetName]§! [UKR_sevastopol_status_air_defense_odesa]\n---§ODonbas region control§!---\n- §Y[693.GetName]§! [UKR_crimea_deterrent_status_donetsk]\n- §Y[1030.GetName]§! [UKR_crimea_deterrent_status_west_donetsk]\n- §Y[1075.GetName]§! [UKR_crimea_deterrent_status_luhansk]\n- §Y[1076.GetName]§! [UKR_crimea_deterrent_status_north_luhansk]\n\n§WWithdrawal incentives§!\nEach of the next steps from our side will make §Y[SOV.GetNameWithFlag]§! §Gwithdrawal more likely§! and §Gwar less likely§!:\n---§CFocuses§!---\n- §Y$UKR_sapsan$§! [UKR_sevastopol_status_sapsan]\n- §Y$UKR_hur_reform$§! [UKR_sevastopol_status_hur_reform]\n- §Y$UKR_ukrainian_armed_forces_reform$§! or §Y$UKR_poroshenko_army_reform$§! [UKR_sevastopol_status_army_reform]\n---§ODecisions§!---\n- the §YObject 477A1 'Nota'§! MBT [UKR_sevastopol_status_nota]\n- §YProject 58250 'Volodymyr Velykyi'§! corvettes [UKR_sevastopol_status_58250]\n- the §YAn-LBL§! or §YAn-BFV§! aircraft [UKR_sevastopol_status_an_aircraft]\n\nA weaker [SOV.GetFlag]§Y[SOV.GetAdjective]§! army or a democratic government in §YMoscow§! also makes war less likely.§!"
 ukraine_sevastopol.1.name: "세바스토폴 반환을 요구하는 키이우"
 ukraine_sevastopol.1.desc_nato: "우크라이나는 이제 NATO 회원국이며 세바스토폴만의 반환을 요구하고 있습니다. 이를 거부하면 동맹과의 정면 충돌을 의미합니다."
 ukraine_sevastopol.1.desc_early: "우크라이나는 흑해 함대 임대를 조기에 종료한다고 통보하며 기지를 넘길 것을 요구했습니다. 1997년 협정에는 이런 조항이 없지만, 키이우는 이 문제를 밀어붙이고 있습니다."
 ukraine_sevastopol.1.desc_nato_prep: "임대가 연장되었음에도 키이우는 NATO를 향해 나아가며 세바스토폴만의 반환을 요구하고 있습니다. 동맹은 아직 우크라이나에 어떤 보장도 제공하지 않았습니다."
 ukraine_sevastopol.1.desc_expiry: "흑해 함대의 임대 기간이 만료되었고, 키이우가 세바스토폴만의 반환을 요구하고 있습니다."
 ukraine_sevastopol.1.a: "함대를 철수한다"
 ukraine_sevastopol.1.b: "요구를 거부합니다"
 ukraine_sevastopol.1.c: "세바스토폴은 무력으로라도 러시아 땅으로 남는다"
 ukraine_sevastopol.2.name: "우크라이나로 돌아온 세바스토폴"
 ukraine_sevastopol.2.desc: "러시아 함대가 떠났고, 세바스토폴만의 기지는 다시 우크라이나의 손에 들어왔습니다."
 ukraine_sevastopol.2.a: "역사적인 날이다"
 ukraine_sevastopol.3.name: "세바스토폴을 떠나기를 거부하는 러시아"
 ukraine_sevastopol.3.desc: "모스크바는 우리 요구를 거절하고 흑해 함대가 세바스토폴에 계속 주둔한다고 고집합니다. 아직까지는 무력에 호소하지 않았습니다."
 ukraine_sevastopol.3.a: "우리는 이를 잊지 않을 것이다"
 ukraine_sevastopol.4.name: "거부하고 침공하는 러시아"
 ukraine_sevastopol.4.desc: "모스크바는 세바스토폴만에 대한 우리 요구를 거절하고 전쟁을 선포했습니다. NATO는 우리에게 아무런 보장도 제공하지 않았습니다."
 ukraine_sevastopol.4.a: "무기를 들자"
