 kosovo.5.t: "Serbia Agrees to the Non-Aggression Pact"
 kosovo.5.d: "Belgrade has agreed to our request and signed guarantees of non-aggression. Our young state can breathe a little easier knowing our northern neighbour has formally renounced hostilities against us."
 kosovo.5.a: "A diplomatic victory"
 kosovo.6.t: "Serbia Refuses the Non-Aggression Pact"
 kosovo.6.d: "Belgrade has rejected our request for guarantees of non-aggression. Their intentions towards us remain openly hostile, and we must prepare for the worst."
 kosovo.6.a: "Troubling"
 SER_reconstruction_modifier: "Rebuilding Serbia"
 SER_reconstruction_modifier_desc: "A decade of war, sanctions and the 1999 NATO bombing left Serbia's industry, infrastructure and universities gutted. Every crane on the Belgrade skyline is an argument that the country has a future."
 SER_military_heritage_modifier: "Yugoslav Arms Industry"
 SER_military_heritage_modifier_desc: "Serbia inherited the SFRJ's arms complex - Zastava, Yugoimport-SDPR, Utva. Kept alive through sanctions by grey exports, it remains the region's largest military-industrial base."
 SER_milheritage_arms_factory_speed_tt: "$modifier_production_speed_arms_factory_factor$: $RIGHT|+=%1$"
 SER_debt_reconstructuring_tt: "Renegotiates §Y6 billion§! of national debt with the Paris Club"
 SER_klepto_dividend_tt: "§RThe regime's cronies kick a share of the loot back to the treasury.§!"
 SER_reopened_markets: "Reopened Markets"
 SER_reopened_markets_desc: "Sanctions are gone and the door to Western capital stands open. A decade of pariah status ends where it began - at the negotiating table."
 SER_wind_farms_modifier: "Wind Farms"
 SER_wind_farms_modifier_desc: "Turbines now line the ridges of Vojvodina and the Morava valley, feeding cheap renewable power into the grid - though the land they occupy is land no longer free for new factories."
 SER_negotiated_transition_TT: "Serbia followed the negotiated transition - §YThe Castle Holds Strong§! was completed"
 SER_seized_assets_tt: "Assets seized from corrupt officials are returned to the treasury."
 SER_kosovo_uprising_reject_tt: "We gain justification to bring Kosovo to heel by force."
 SER_rsk_outcome_tt: "Republika Srpska breaks away from Bosnia and becomes our autonomous subject."
 SER_rsk_war_tt: "Bosnia refuses to let Srpska go and may declare war on us."
 SER_isolation_accept_tt: "They establish friendly relations and an improved trade agreement with us, and gain a foothold of influence in Serbia."
 SER_isolation_reject_tt: "They turn us down and relations sour."
 SER_invest_internet_tt: "They fund two network infrastructure stations in Serbia in exchange for influence."
 SER_bosnia_ties_accept_tt: "Bosnia accepts our investment: we pay part of the cost, gain influence in Bosnia, and Republika Srpska's standing improves."
 SER_bosnia_ties_reject_tt: "Bosnia turns us down and relations sour."
 SER_open_balkan_accept_tt: "They join the initiative, expanding our influence with them and boosting their exports."
 SER_invest_infra_tt: "Russian companies fund an infrastructure project in one of our states."
 SER_invest_factory_tt: "A civilian factory and a fossil fuel powerplant are built in Serbia."
 SER_invest_office_tt: "An office complex and a fossil fuel powerplant are built in Serbia."
 SER_invest_steel_tt: "Chinese capital expands steel extraction in Central Serbia: +5 Steel."
 SER_invest_station_tt: "A network infrastructure station is built in Serbia."
 SER_invest_options_tt: "They fund a project in Serbia: a civilian factory, infrastructure, or network infrastructure."
 SER_mediation_accept_tt: "Belgium mediates between us and Kosovo."
 ser_kos.2.t: "Belgrade Demands Submission"
 ser_kos.2.d: "Serbian agents have stirred up the Serb minority in the north while Belgrade masses troops on the border. The ultimatum is blunt: accept Serbian overlordship or face invasion."
 ser_kos.2.a: "We will never submit!"
 ser_kos.2.b: "We have no choice but to yield"
 ser_kos.3.t: "Kosovo Defies Us"
 ser_kos.3.d: "Pristina has rejected our ultimatum and is rallying its people against us. If Kosovo will not kneel willingly, it will be brought to heel by force."
 ser_kos.3.a: "Then we will take it"
 ser_kos.4.t: "Kosovo Submits"
 ser_kos.4.d: "Faced with overwhelming pressure, Pristina has accepted our terms. Kosovo returns to Belgrade's fold as a subject."
 ser_kos.4.a: "Serbia is whole again"
 MNT_western_path_tt: "§YMontenegro commits to the Euro-Atlantic course.\nOther EU countries may invest in our infrastructure if we have states where it can be built.§!"
 MNT_eastern_path_tt: "§RMontenegro aligns itself with Moscow.§!"
 MNT_serbian_path_tt: "§RMontenegro seeks union with Serbia.§!"
 MNT_neutral_path_tt: "§YMontenegro commits to free-port neutrality.§!"
 MNT_investment_accept_tt: "They fund the construction of a civilian factory in Montenegro and gain influence over us."
 MNT_infra_accept_tt: "They fund infrastructure development in Montenegro and gain influence over us."
 MNT_purchase_costs_tt: "The purchase is paid from our treasury and grants the seller influence over Montenegro."
 MNT_nap_accept_tt: "Each nation that accepts signs a non-aggression pact with Montenegro."
 MNT_csto_invite_tt: "Russia invites Montenegro to join the CSTO."
 MNT_yug_demand_accept_tt: "States that submit become subjects of our new Yugoslavia."
 MNT_yug_demand_reject_tt: "We gain justification to subjugate any state that refuses."
 KOS_Infrastructure_Rebuild_desc: "Our infrastructure has literally been destroyed, and large financial injections are needed to revive it again"
 KOS_dark_tourism_Industry_desc: "We can also become a tourist destination like any other country. Our landscapes and views are no worse than those of our neighbors"
 KOS_Water_Management_desc: "The problem with water for our citizens will finally be solved"
 KOS_Agricultural_Modernization_desc: "Our agriculture is in a dilapidated state. It is necessary to revive it"
 KOS_textile_industry_desc: "We invest in the textile industry, because we see in it the potential for growth in our republic"
 KOS_Rural_Industry_desc: "Rural industry should become one of the engines of our economy. We should spare no investment for it."
 KOS_fight_corruption_desc: "If we are to be a functioning society, we will need to purge corrupt elements from our country"
 KOS_transportation_desc: "We will establish new transportation networks so that moving around the country is more efficient"
 KOS_pristina_international_airport_desc: "Pristina International Airport will be very useful for bringing in and out tourists for our economy"
 KOS_foreign_workers_desc: "Due to our small population, we will have to encourage migrants from other nations to come to our nation and take some jobs"
 KOS_recall_refugees_desc: "A lot of our people are currently refugees in other states. Recalling them will be beneficial for our population growth"
 SER_brotherhood_and_unity: "Brotherhood and Unity"
 SER_brotherhood_and_unity_desc: "The old slogan still opens doors in Zagreb, Sarajevo, and Podgorica. Joint commemorations, shared broadcasting, and cultural exchange remind our neighbors of what the South Slavs once built together."
 SER_restore_yugoslavia: "Restore Yugoslavia"
 SER_restore_yugoslavia_desc: "If every former republic longs for the federation, Belgrade will convene it. The successor states are invited to reunify under a single flag.\nSupport for a restored Yugoslavia:\n$yugo_nost_overview$"
 MNT_echoes_of_yugoslavia: "Echoes of Yugoslavia"
 MNT_echoes_of_yugoslavia_desc: "Montenegro never drifted far from Belgrade, and the federation built the ports, railways, and resorts the country still lives off. The party puts that shared memory at the center of its message, at home and across the border."
 MNT_restore_yugoslavia: "Restore Yugoslavia"
 MNT_restore_yugoslavia_desc: "From the smallest republic comes the call the others have waited for. Podgorica invites the successor states to reunify under a single flag.\nSupport for a restored Yugoslavia:\n$yugo_nost_overview$"
 KOS_rekindle_yugoslavism: "Rekindle Yugoslavism"
 KOS_rekindle_yugoslavism_desc: "Under the 1974 constitution Kosovo governed itself as an autonomous province of a socialist federation. The party holds up that era, not the Belgrade of the 1990s, as the inheritance worth reclaiming."
 KOS_restore_yugoslavia: "Restore Yugoslavia"
 KOS_restore_yugoslavia_desc: "A federation of equal socialist republics would give Kosovo the seat at the table that neither Belgrade nor the UN ever offered. Pristina calls the successor states to reunify.\nSupport for a restored Yugoslavia:\n$yugo_nost_overview$"
 Serbia.3.tt.b: "§RThe plot will run its course.§!"
 Serbia.28.t: "Milošević Extradited to The Hague"
 Serbia.28.d: "The government has approved the transfer of Slobodan Milošević to the war crimes tribunal in The Hague. Western donors have tied reconstruction aid to cooperation with the court, but on the streets the handover of a former president on St. Vitus Day is being called a betrayal."
 Serbia.28.a: "The law applies to former presidents too"
 Serbia.28.b: "We do not extradite our own"
 Serbia.29.t: "Milošević Dies in Custody"
 Serbia.29.d: "Slobodan Milošević has been found dead in his cell at Scheveningen, months before a verdict was expected in his trial. His supporters already speak of a martyr denied justice, and tens of thousands are expected at the farewell in Belgrade. An entire decade is being mourned alongside him."
 Serbia.29.a: "An era is buried with him"
 Serbia.30.t: "The State Union of Serbia and Montenegro"
 Serbia.30.d: "Under pressure from Brussels, the federal parliament has adopted the Constitutional Charter. The Federal Republic of Yugoslavia is no more; in its place stands a loose union of Serbia and Montenegro with a shared seat at the United Nations and little else in common. The name Yugoslavia passes into history."
 Serbia.30.a: "A union in name only"
 Serbia.31.t: "Karadžić Arrested in Belgrade"
 Serbia.31.d: "Police have taken Radovan Karadžić off a city bus in New Belgrade. He had been living in the open under a false name, practicing alternative medicine behind a long white beard. The tribunal expects his immediate transfer, and Brussels has made clear that the European path runs through The Hague."
 Serbia.31.a: "Transfer him to The Hague"
 Serbia.31.b: "Delay the transfer"
 Serbia.32.t: "Mladić Found in Lazarevo"
 Serbia.32.d: "After sixteen years on the run, Ratko Mladić has been arrested at a cousin's farmhouse in Lazarevo. He is the last major indictee of the tribunal still on Serbian soil, and his case is the final obstacle standing between Serbia and candidate status in Brussels."
 Serbia.32.a: "Full cooperation with the tribunal"
 Serbia.32.b: "Drag out the proceedings"
 Serbia.33.t: "Candidate Status Granted"
 Serbia.33.d: "The European Council has formally granted Serbia the status of candidate for membership of the European Union. The decision rewards years of cooperation with the tribunal and a renewed dialogue with Pristina. Long negotiating chapters lie ahead, but the direction is set."
 Serbia.33.a: "Our European path is open"
 Serbia.34.t: "The Embassies Are Burning"
 Serbia.34.d: "A state-backed rally against Kosovo's declaration of independence has ended with rioters storming the United States embassy and setting it alight. The British mission was attacked as well, and one charred body has been recovered from the building. Foreign capitals are demanding answers."
 Serbia.34.a: "Restore order in the capital"
 Serbia.35.t: "Republika Srpska Breaks Away"
 Serbia.35.d: "Republika Srpska has declared itself independent of Sarajevo. Crowds in Banja Luka wave Serbian flags, and its new authorities look to Belgrade for recognition and support."
 Serbia.35.a: "Stand with our kin"
 Serbia.35.b: "This is not Serbia's fight"
 SER_nat_populism_gain_tt: "§RThe nationalist right gains support.§!"
 SER_icty_cooperation_karadzic_tt: "§YSerbia is cooperating with the Hague tribunal.§!"
 SER_icty_cooperation_complete_tt: "§GSerbia has fully cooperated with the Hague tribunal.§!"
 SER_recognized_eu_candidate_tt: "§GSerbia is recognized as a candidate for EU membership.§!"
 SER_KOS_normalization_tt: "§GSerbia and Kosovo sign a relations normalization agreement.§!"
 kosovo.10.t: "Unrest Across Kosovo"
 kosovo.10.d: "Reports that Albanian children drowned in the Ibar while fleeing a Serb mob have set off two days of rioting across the province. Serb homes and Orthodox churches are burning, and the international administration has lost control of the streets. The damage to our standing abroad will take years to repair."
 kosovo.10.a: "Call for calm"
 kosovo.11.t: "The ICJ Delivers Its Opinion"
 kosovo.11.d: "The International Court of Justice has concluded that the declaration of independence did not violate international law. The opinion is advisory and changes nothing on the ground, but it strips the legal argument from every capital that refuses to speak with us."
 kosovo.11.a: "The law is on our side"
 KOS_icj_opinion_tt: "§GRecognition request decisions partially refund their cost.§!"
 KOS_icj_ser_reaction_tt: "Serbia must contest the ruling at the cost of its European course, or quietly accept it."
 KOS_icj_recognition_rebate_tt: "§GThe ICJ advisory opinion strengthens our case.§!"
 KOS_SER_opinion_decrease_5: "§H5%§! of §HSerbs§! will have a §Rless favorable§! view of us"
 kosovo.12.t: "Ambush at Banjska"
 kosovo.12.d: "Some thirty armed men in armored vehicles have stormed the village of Banjska in the north, killed a police sergeant and barricaded themselves in the monastery. Pristina, pointing to the recovered weapons caches, calls it a Belgrade-directed operation; Belgrade denies any involvement. This was a paramilitary operation, not a protest."
 kosovo.12.a: "Work with the peacekeepers to restore order"
 kosovo.12.b: "An act of war in all but name"
 Montenegro.28.t: "A Coup on Election Day"
 Montenegro.28.d: "The special prosecutor has announced the arrest of some twenty plotters who planned to storm parliament on election night and, by some accounts, assassinate the prime minister. The trail runs through Serbian nationalist circles to two officers of Russian military intelligence. Moscow calls the affair a fabrication."
 Montenegro.28.a: "Name Moscow and Belgrade"
 Montenegro.28.b: "Do not inflame the situation"
 Montenegro.29.t: "The 29th Ally"
 Montenegro.29.d: "At a ceremony in Washington, Montenegro has deposited its instrument of accession and become the 29th member of the North Atlantic alliance. A country of six hundred thousand now sits at the same table as the powers that bombed it eighteen years ago. The security question that has defined a decade of politics is settled."
 Montenegro.29.a: "A small country with a firm anchor"
