 CZE_HUN_expand_the_pressure: "헝가리 군주제 지지 단체 계속 지원"
 CZE_AUS_return_of_archduke: "대공의 귀환 준비"
 CZE_AUS_prepare_the_media: "언론 준비"
 CZE_AUS_support_promonarchists: "민간 군주제 지지자 지원"
 CZE_AUS_reform_one_castle: "대공을 위한 성 보수"
 CZE_the_prague_conference_category: "프라하 회의"
 CZE_the_prague_conference_category_desc: "오스트리아와 헝가리가 다시 군주국이 된 만큼, 우리 국가들을 통합하고 새로운 연합을 창설할 때가 되었습니다. 프라하 회의는 우리 국가들의 통합을 향한 첫걸음이 될 것입니다. 우리의 미래가 어떤 모습일지는 이제 우리의 선택에 달려 있습니다."
 CZE_joint_land_exercises: "합동 육군 훈련"
 CZE_joint_land_exercises_desc: "각 군은 서로 다른 전략을 택했으므로, 이제 그 모든 전략에 맞서 훈련하고 약점을 파악하여 이를 피할 수 있습니다."
 CZE_joint_air_exercises: "합동 공군 훈련"
 CZE_joint_air_exercises_desc: "항공기와 드론은 현대전의 핵심이므로, 공지전을 위한 최고의 항공기와 조종사를 선정하고 개선하는 것이 필수적입니다."
 CZE_share_common_knowledge_in_naval_tactics: "해군 전술 지식 공유"
 CZE_share_common_knowledge_in_naval_tactics_desc: "우리보다 더 많이 아는 적을 이해하고 반격할 수 있도록 해군 전술을 연구하는 새로운 부대를 준비해야 합니다."
 CZE_share_military_intel: "군사 정보 공유"
 CZE_share_military_intel_desc: "정보는 현대전의 핵심이므로, 우리 첩보 기관이 보유한 모든 정보를 공유해야 합니다."
 CZE_share_military_breakthroughs: "군사 기술 성과 공유"
 CZE_common_education_plan: "공동 교육 계획"
 CZE_common_education_plan_desc: "우리 교육 체계들의 차이는 다른 두 나라에서 공부하려는 모든 학생에게 걸림돌이 됩니다. 학생들이 공부할 곳을 더 쉽게 선택할 수 있도록 공동 교육 체계를 추진해야 합니다."
 CZE_common_police_action_plan: "공동 경찰 행동 계획"
 CZE_common_police_action_plan_desc: "지역 경찰은 범죄자가 어디에 숨어 있든 모두 체포할 수 있어야 합니다."
 CZE_common_welfare_plan: "공동 복지 계획"
 CZE_common_welfare_plan_desc: "우리 복지 계획의 모든 장점을 통합하면 세 나라 모든 시민에게 도움이 될 것입니다"
 CZE_unify_the_nations: "국가 통합"
 CZE_unify_the_nations_desc: "프라하 회의는 세 정부 모두를 위한 핵심 법률과 조약을 포함시키는 데 기여했습니다. 이제 우리는 오스트리아와 헝가리 정부를 모두 통제하고자 하지만, 그들은 스스로 미래를 결정할 수 있을 것입니다."
 CZE_joint_foreing_embassies: "해외 대사관 통합"
 CZE_joint_foreing_embassies_desc: "오스트리아와 헝가리를 병합하거나 통합할 가능성에 대비하여, 비용을 줄이고 서비스 중복을 피하도록 모든 해외 대사관을 재편해야 합니다."
 CZE_shared_foreign_treaties: "대외 조약 공유"
 CZE_shared_foreign_treaties_desc: "오스트리아와 헝가리를 병합하거나 통합할 가능성에 대비하여, 우리의 낡은 조약 일부를 개선하도록 노력해야 합니다."
 CZE_create_a_plan_for_monarchies: "유럽 군주국을 위한 계획 수립"
 CZE_create_a_plan_for_monarchies_desc: "지난 세기에 군주제는 한때 가졌던 권력을 잃었습니다. 따라서 우리의 독립을 보장하고 급진 정치 집단이 권력을 잡지 못하게 하기 위해 유럽의 동료 국왕들을 지원해야 합니다."
 CZE_shared_debt: "부채 통합"
 CZE_shared_debt_desc: "오스트리아와 헝가리를 가상으로 병합하거나 통합할 경우, 그들의 부채 일부에서 이익을 얻어 좋은 금리를 확보하고 가장 비싼 부채 일부를 상환하도록 노력해야 합니다."
 CZE_civilian_investment_in_rural_areas: "농촌 지역 투자"
 CZE_civilian_investment_in_rural_areas_des: "일부 농촌 지역은 수년간 방치된 반면 주요 산업 지역은 급성장했습니다. 제재나 그 밖의 문제가 생길 경우에 대비해 믿을 수 있는 식량 공급원을 확보하도록 그 지역들을 개선해야 합니다."
 CZE_infrastructure_of_an_empire: "제국의 인프라"
 CZE_infrastructure_of_an_empire_desc: "훌륭한 제국은 제대로 연결되어야 합니다. 전쟁이 일어날 경우 모든 병력과 장비를 제국의 반대편으로 신속하게 이동시킬 수 있어야 합니다."
 CZE_skoda_learnings: "슈코다의 교훈 공유"
 CZE_skoda_learnings_desc: "슈코다와의 경험은 생산되는 제품의 품질과 양을 모두 개선하는 데 도움이 되었습니다. 일부 제조업체가 그 기법을 자신들의 생산 라인에 도입하도록 추진해 볼 만합니다"
 CZE_the_kings_congress: "국왕 평의회 설립"
 CZE_the_kings_congress_desc: "국왕은 모든 시민의 주요 문제에 집중할 평의회를 조직해야 합니다. 이는 모든 시민의 삶의 질을 높이는 데 도움이 되며, 헝가리와 오스트리아의 통합 시에도 도움이 될 수 있습니다"
 CZE_unify_the_nations_2: "국가 통합"
 CZE_fidesz_problem: "피데스 문제"
 CZE_fidesz_problem_desc: "창당 이래 피데스는 헝가리 전역에서 영향력을 키워 왔습니다. 친합스부르크 정부를 수립하려면 헝가리 국민 사이에서 그들의 영향력을 줄여야 합니다. \n\n이 결정들로 정당의 인기를 낮출 수 있으며, 첩보원과 첩보망이 있으면 인기를 더 많이 낮출 수 있습니다. 그러나 헝가리가 방첩 임무를 수행하는 첩보원을 두고 있으면 인기 하락 폭이 줄어듭니다. 이러한 증감이 이루어지는 모든 결정에는 각 행동의 정확한 수치를 확인할 수 있는 별도의 툴팁이 표시됩니다."
 CZE_prepare_national_spies: "국가 첩보 기관 준비"
 CZE_prepare_national_spies_desc: "헝가리 정치에 무엇이든 하기 전에, 먼저 요원들을 조율하고 작전을 준비할 기관부터 세워야 합니다"
 CZE_infiltrate_in_young_sphere: "청년층 침투"
 CZE_infiltrate_in_young_sphere_desc: "당 조직의 약한 고리는 가장 젊은 층일 수도 있습니다"
 CZE_infiltrate_in_the_national_party: "국민당 침투"
 CZE_infiltrate_in_the_national_party_desc: "전국적인 영향력을 줄이려면 국민당 내에 연줄을 만들어야 합니다."
 CZE_pressure_low_level_politicians: "하급 정치인 압박"
 CZE_pressure_low_level_politicians_desc: "지방 도시의 일부 정치인은 압박을 받으면 자신의 정당에 맞서 결집할 수도 있습니다"
 CZE_pressure_high_level_politicians: "고위 정치인 매수"
 CZE_pressure_high_level_politicians_desc: "적절한 액수의 돈만 있으면 일부 고위 정치인을 매수할 수 있습니다."
 CZE_bucarest_meeting: "부쿠레슈티 회담"
 CZE_bucarest_meeting_desc: "오늘 우리는 공동의 적인 헝가리에 어떻게 대처할지 루마니아와 논의하고 있습니다. 서로를 보완할 수 있는 새로운 프로젝트와 정책을 충분히 마련하면 우리는 헝가리보다 강해질 수 있으며 지역의 평화를 지킬 수 있습니다"
 CZE_create_fake_media: "가짜 뉴스 캠페인"
 CZE_create_fake_media_desc: "헝가리 정부에 맞선 우리의 최고 무기는 그 국민입니다. 가짜 뉴스를 통해 그들의 안정과 권력을 약화시킬 수 있을지도 모릅니다"
 CZE_anti_hungarian_association: "반헝가리 단체 지원"
 CZE_anti_hungarian_association_desc: "헝가리 정부에 맞서는 단체들에게 목소리를 내줘야 합니다."
 CZE_weaknesses_of_the_republic: "경찰 협력"
 CZE_weaknesses_of_the_republic_desc: "중요한 헝가리 시민에 관한 경찰 정보를 교환하여 그들의 행적을 파악할 수 있습니다."
 CZE_free_movement: "공동 이민 정책 시행"
 CZE_free_movement_desc: "양국 간 자유로운 이동을 허용하면 두 경제가 모두 성장하는 데 도움이 될 것입니다."
 CZE_ukraine_investments: "우크라이나 기반시설에 투자"
 CZE_ukraine_investments_desc: "우크라이나는 헝가리에 가장 중요한 나라 가운데 하나입니다. 어느 정도 투자하면 우크라이나 정부가 반헝가리 법안을 통과시키도록 압박할 수 있을지도 모릅니다"
 CZE_rebuild_the_railway_in_ROM: "루마니아의 소련식 철도 개선"
 CZE_rebuild_the_railway_in_ROM_desc: "옛 소련식 철도 일부가 방치되었으니 이를 복구하고 기존 철도를 개선하도록 노력해야 합니다."
 CZE_rebuild_the_railway_in_CZE: "체코슬로바키아의 소련식 철도 개선"
 CZE_rebuild_the_railway_in_CZE_desc: "옛 소련식 철도 일부가 방치되었으니 이를 복구하고 기존 철도를 개선하도록 노력해야 합니다."
 CZE_e58_development: "E58 고속도로 개선"
 CZE_e58_development_desc: "E58을 개선하면 우리 나라들이 연결되어 사람과 물자의 이동이 개선될 것입니다."
 CZE_share_military_knowledge: "군사 지식 공유"
 CZE_share_military_knowledge_desc: "헝가리군과 다른 적들에 관한 일부 군사 전술과 정보를 공유해야 합니다."
 CZE_pressure_nato: "헝가리 제명을 위해 나토 압박"
 CZE_pressure_nato_desc: "최근 몇 년간 나토는 회원국을 늘렸습니다. 그 가운데 하나인 헝가리는 목표를 달성하지 못하고 있으며, 지금 나토는 우리의 팽창에 걸림돌입니다."
 CZE_joint_military_exercises: "합동 군사 훈련"
 CZE_joint_military_exercises_desc: "군사 훈련은 외국 적에 대한 우리의 능력을 높일 것입니다."
 CZE_sabotage_infrastructure: "헝가리 인프라 파괴 공작"
 CZE_sabotage_infrastructure_desc: "헝가리가 어떻게 대응하는지 알아보기 위해 헝가리 인프라 일부에 대한 파괴 공작을 시도해야 합니다."
 CZE_learn_modern_naval_strategies: "현대 해군 지식 공유"
 CZE_learn_modern_naval_strategies_desc: "현재 우리나라는 바다에 접근할 수 없어 현행 해군 전술 일부를 알지 못합니다. 그러나 루마니아는 해전과 전술에 대한 경험이 풍부하므로 그중 일부를 배워 볼 수 있습니다."
 CZE_monarchy_event.1.t: "지지를 구하는 체코 공화국"
 CZE_monarchy_event.1.d: "체코 공화국의 군주주의 정당이 우리 합스부르크 가문에 지지를 구하고 있습니다. 그들은 체코 공화국에서 군주제를 복원할 수 있게 될 경우 앞으로 우리의 도움을 기대할 수 있는지 알고 싶어 합니다."
 CZE_monarchy_event.1.a: "합스부르크 가문은 서로 도와야 한다"
 CZE_monarchy_event.1.b: "군주제는 시대에 뒤떨어진 체제다"
 CZE_monarchy_event.2.t: "체코 왕관당을 지지하는 [FROM.GetName]의 합스부르크 가문"
 CZE_monarchy_event.2.d: "[FROM.GetName]의 합스부르크 가문은 우리 군주주의 정당이 선거에서 성공할 경우 우리 지역에서 군주제의 인기도를 높이는 일을 도울 것입니다. 우리 당과 합스부르크 가문이 가문의 미래를 논의하기 위해 빈번한 회동을 갖기 시작할 것이므로, 이는 양국을 서로 더 가깝게 만들기도 합니다."
 CZE_monarchy_event.2.a: "훌륭하군!"
 CZE_monarchy_event.3.t: "체코 왕관당 지지를 거부한 [FROM.GetName]의 합스부르크 가문"
 CZE_monarchy_event.3.d: "[FROM.GetName]의 합스부르크 가문은 체코 공화국과 지역 전체에서 군주제를 복원하겠다는 우리의 야심 찬 계획에 회의적입니다. 그들은 체코 왕관당의 지원 제안을 거절했습니다."
 CZE_monarchy_event.3.a: "좋지 않군"
 CZE_monarchy_event.4.t: "민주주의를 택한 체코 군주주의자들"
 CZE_monarchy_event.4.d: "체코 정당 체코 왕관당은 체코 공화국의 군주제 복원 구상을 포기하기로 결정했습니다. 그들은 대신 민주주의를 택했으며 현재 다음 대통령 선거를 준비하고 있습니다."
 CZE_monarchy_event.4.a: "정말로 군주제의 종말이다"
 CZE_monarchy_event.5.t: "슐레지엔으로의 대규모 이주"
 CZE_monarchy_event.5.d: "슐레지엔 지역을 장악한 뒤 체코인과 슬로바키아인이 이 지역으로 이주하기 시작합니다. 그들은 특히 광업 분야에서 더 나은 삶과 일자리 기회를 찾고 있습니다."
 CZE_monarchy_event.5.a: "시작하자!"
 CZE_monarchy_event.6.t: "슐레지엔 이주의 종료"
 CZE_monarchy_event.6.d: "수개월이 지나 슐레지엔 이주가 안정되어 가는 것으로 보입니다. 많은 체코인과 슬로바키아인이 자신과 가족을 위한 새 일자리를 찾았습니다. 이 지역은 서서히 체코인의 비중이 점점 커지고 있습니다."
 CZE_monarchy_event.6.a: "마침내 안정이다"
 CZE_monarchy_event.7.t: "슐레지엔 지역의 폴란드인 문제"
 CZE_monarchy_event.7.d: "슐레지엔은 오랫동안 폴란드에 속해 있었습니다. 체코인과 슬로바키아인이 자신들의 지역을 장악해 가는 데 불만을 품은 폴란드인이 많습니다. 상황이 격화되기 전에 그들을 어떻게 할지 결정해야 합니다."
 CZE_monarchy_event.7.a: "폴란드인을 슐레지엔에 머물게 한다"
 CZE_monarchy_event.7.b: "폴란드인을 폴란드로 추방한다"
 CZE_monarchy_event.8.t: "슐레지엔 지역 문제"
 CZE_monarchy_event.8.d: "슐레지엔은 현재 폴란드가 통제하고 있습니다. 이 영토를 되찾으려면 타협해야 합니다. 슐레지엔 지역을 폴란드와 나누는 데 동의한다면 좋은 관계를 유지할 수 있을지도 모릅니다."
 CZE_monarchy_event.8.a: "하슐레지엔을 차지하자"
 CZE_monarchy_event.8.b: "상슐레지엔을 차지하자"
 CZE_monarchy_event.8.c: "전부 우리 것이다!"
 CZE_monarchy_event.9.t: "체코슬로바키아의 하슐레지엔 요구"
 CZE_monarchy_event.9.d: "체코슬로바키아가 우리에게 하슐레지엔 주를 요구했습니다. 다행히 이곳은 상슐레지엔 지역만큼 자원이 풍부하지 않습니다. 체코슬로바키아가 두 슐레지엔 주의 추가 개발에 자금을 투자하겠다고 주장하는 만큼, 이 제안에 동의하여 양국의 공동 발전을 도울 수 있습니다."
 CZE_monarchy_event.9.a: "좋다"
 CZE_monarchy_event.9.b: "절대 안 된다"
 CZE_monarchy_event.10.t: "체코슬로바키아의 상슐레지엔 요구"
 CZE_monarchy_event.10.d: "체코슬로바키아가 우리에게 상슐레지엔 주를 요구했습니다. 이 지역은 자원이 풍부하여 잃을 여유가 없습니다. 이 제안에 답하기 전에 다시 한번 생각해야 하지만, 체코슬로바키아가 두 슐레지엔 주의 추가 개발에 자금을 투자하겠다고 주장하며 양국의 공동 발전을 돕겠다고 약속하고 있습니다."
 CZE_monarchy_event.10.a: "좋다"
 CZE_monarchy_event.10.b: "절대 안 된다"
 CZE_monarchy_event.11.t: "체코슬로바키아의 두 슐레지엔 주 요구"
 CZE_monarchy_event.11.d: "체코슬로바키아가 우리에게 두 슐레지엔 주를 모두 요구했습니다. 이 주들이 역사적으로 자국 영토와 연결되어 있다고 주장하는 매우 대담한 행보입니다."
 CZE_monarchy_event.11.a: "좋다, 가져가라"
 CZE_monarchy_event.11.b: "원한다면 우리에게 선전포고하라고 해라!"
 CZE_monarchy_event.12.t: "슐레지엔 분할을 거부하는 폴란드"
 CZE_monarchy_event.12.d: "폴란드는 체코슬로바키아와 슐레지엔 지역을 나누는 것을 거부했습니다. 그들은 영토의 어느 부분도 내줄 의사가 없습니다. 상황은 격화되고 있으며 양국 관계는 악화되고 있습니다."
 CZE_monarchy_event.12.a: "더 이상의 외교는 없다"
 CZE_monarchy_event.13.t: "왕실 보석을 꺼낸 체코 공화국"
 CZE_monarchy_event.13.d: "체코 지도부는 프라하 성 비투스 대성당의 금고에서 왕실 보석을 꺼내기로 결정했습니다. 이는 체코 공화국이 국내에서 군주제를 복원할 준비가 되었음을 세계에 보여 주는 상징적인 행위입니다. 새 군주의 대관식 준비가 곧 시작될 것이며, 이제 의미 있는 사건이 한 가지만 더 일어나면 됩니다."
 CZE_monarchy_event.13.a: "이렇게 오랜 시간이 지났는데도... 여전히 아름답군."
 CZE_monarchy_event.14.t: "새로운 행사를 준비하는 합스부르크 왕가"
 CZE_monarchy_event.14.d: "체코 합스부르크 왕가는 체코 정부와 협력하여 행사를 준비하고 있습니다. 그들은 체코 공화국에서 군주제를 복원할 준비가 되었음을 세계에 보여 주고자 합니다. 행사는 프라하에서 열리며 유럽 각지에서 온 수많은 중요 인사들이 참석할 것입니다."
 CZE_monarchy_event.14.a: "이제 시작이다"
 CZE_monarchy_event.15.t: "프라하 성 보수 공사 시작"
 CZE_monarchy_event.15.d: "합스부르크 가문은 체코 대통령의 공식 관저인 프라하 성을 보수하기로 결정했습니다. 보수는 성의 역사적 성격을 보존하면서도 현대 군주제의 필요에 더 적합하도록 이루어질 것입니다. 보수에는 막대한 비용이 들지만 군주제가 권좌에 복귀할 준비가 되었음을 보여 주기 위해 필요합니다."
 CZE_monarchy_event.15.a: "일을 시작하자!"
 CZE_monarchy_event.16.t: "합스부르크 가문을 저지한 공산주의자들!"
 CZE_monarchy_event.16.d: "공산주의 성향의 KSČM이 지난 선거에서 승리한 뒤, 그들은 합스부르크 가문이 체코 공화국에서 군주제를 복원하는 것을 막기로 결정했습니다. 그들은 군주제가 현대 세계에 설 자리가 없는 시대에 뒤떨어진 체제라고 주장합니다. 공산주의자들이 이 사업을 어떻게 할지 결정할 때까지 보수 공사를 중단하기로 하면서, 합스부르크 가문은 희망 없는 상황에 격분하고 있습니다."
 CZE_monarchy_event.16.a: "젠장!"
 CZE_monarchy_event.17.t: "왕실 가족을 맞이할 준비를 마친 성"
 CZE_monarchy_event.17.d: "이제 우리가 가한 모든 개조 끝에 성은 마침내 새로운 왕을 맞이하기에 걸맞은 모습으로 서 있습니다. 한때 무너져 내리던 성벽은 옛 영광을 되찾았고, 홀에는 침묵이 아닌 새 시대에 대한 약속이 울려 퍼집니다. 그러므로 우리는 모든 방을 준비하고, 모든 돌을 닦고, 모든 횃불을 밝혀야 합니다. 머지않아 왕이 도착할 것이며, 그의 치세에 걸맞은 명예와 위엄으로 맞이해야 하기 때문입니다."
 CZE_monarchy_event.17.a: "왕실 가족의 도착을 위해 성을 준비하라!"
 CZE_monarchy_event.18.t: "프라하 성에 입주하는 합스부르크 가문"
 CZE_monarchy_event.18.d: "왕실 가족은 보수 공사가 완료된 것을 기쁘게 여기고 있습니다. 마침내 성은 새로워진 영광 속에 서 있습니다. 모든 준비가 갖추어졌으므로, 왕실 가족은 이제 그 무대가 가문의 품격과 유산을 반영한다는 확신을 가지고 성대한 행사를 시작할 수 있습니다."
 CZE_monarchy_event.18.a: "명예롭게 행사를 시작하라!"
 CZE_monarchy_event.19.t: "새로운 왕에게 고개를 숙이는 대통령"
 CZE_monarchy_event.19.d: "화려한 행사에서 왕이 연설하는 도중 공화국 대통령이 왕에게 고개를 숙이는 모습은 그 자리에 있던 모든 이를 아연실색하게 했습니다. 이 순간은 체코인들에게 새 시대의 여명을 알리며 왕실 역사의 결정적인 한 장을 이룹니다."
 CZE_monarchy_event.19.a: "다음엔 무슨 일이 일어날까?"
 CZE_monarchy_event.20.t: "카를 폰 합스부르크에게 고개를 숙이는 체코 공화국 대통령"
 CZE_monarchy_event.20.d: "체코 대통령이 카를 폰 합스부르크에게 고개를 숙이는 인상적인 사진이 들불처럼 번지고 있으며, 이는 체코에서 합스부르크 가문이 복위하는 선례가 될 수도 있습니다."
 CZE_monarchy_event.20.a: "대통령은 이 행동 이후 사임해야 한다."
 CZE_monarchy_event.20.b: "우리는 체코 국민에게 오직 최선만을 기대한다."
 CZE_monarchy_event.21.t: "체코 대통령의 사임"
 CZE_monarchy_event.21.des: "왕의 행사에서 나온 놀라운 사진 이후 대통령은 사임해야 했습니다. 이제 지난 선거 이후 왕에 대한 대중의 지지가 높아졌으므로, 어쩌면 그가 공화국의 다음 대통령이 될지도 모릅니다."
 CZE_monarchy_event.21.a: "왕은 우리에게 더 나은 미래를 줄 수 있다"
 CZE_monarchy_event.21.b: "체코의 왕은 오스트리아 정부의 친구다"
 CZE_monarchy_event.21.c: "체코의 왕은 헝가리 정부의 친구다"
 CZE_monarchy_event.21.d: "우리의 오랜 친구들에게 최선이 있기를 바란다"
 CZE_monarchy_event.21.e: "우리는 체코 국민에게 최선을 기대한다"
 CZE_monarchy_event.23.t: "왕실 동맹"
 CZE_monarchy_event.23.d: "오늘 체코슬로바키아의 외교 대표단이 동맹 제안을 가져왔습니다. 그들은 현재의 조약보다 더 구체적인 목표에 집중할 수 있는 새로운 방위 조약을 맺기를 선호합니다."
 CZE_monarchy_event.23.a: "그 구상이 마음에 든다."
 CZE_monarchy_event.23.b: "지금은 괜찮다."
 CZE_monarchy_event.24.t: "프라하 회의"
 CZE_monarchy_event.24.d: "오늘 오스트리아, 헝가리, 체코슬로바키아의 협상 대표들이 프라하에서 만나 세 나라의 경제와 국민의 복지를 개선하기 위한 공동 법률을 마련했습니다."
 CZE_monarchy_event.24.a: "우리는 그 어느 때보다 더 단결할 것이다"
 CZE_monarchy_event.24.b: "좋은 구상이다"
 CZE_monarchy_event.25.t: "우리의 동맹 제안을 거절한 [FROM.GetName]"
 CZE_monarchy_event.25.d: "그들은 [FROM.GetName]에서의 자신들의 향후 지위에 대한 우려 때문인 듯, 우리의 동맹 제안을 정중히 거절했습니다."
 CZE_monarchy_event.25.a: "예상 밖이었다"
 CZE_AUS_monarchy_event.1.t: "우리 정치에 영향을 미치는 외세"
 CZE_AUS_monarchy_event.1.d: "오늘 우리 국가 방위 기관 일부가 친군주제 단체들에 대한 자금이 증가했다고 통보했습니다. 현재 이 단체들을 누가 지원하는지 조사 중이지만 주된 후원자는 체코의 왕일 수도 있습니다."
 CZE_AUS_monarchy_event.1.a: "지금은 개입할 수 없다"
 CZE_AUS_monarchy_event.3.t: "체코로부터의 왕실 제안"
 CZE_AUS_monarchy_event.3.d: "지난주 폐하께서는 카를 폰 합스부르크 왕으로부터 서한을 받으셨습니다. 그는 공동 목표를 논의하기 위해 유럽의 모든 군주국이 참여하는 왕실 행사를 열 필요가 시급하다고 강조했습니다. 그는 또한 벨기에 국왕을 만나기를 원하는데 그 이유는 알 수 없으며, 이제 우리는 그에게 답변을 주어야 합니다."
 CZE_AUS_monarchy_event.3.a: "모두와 함께하는 왕실 행사를 준비하겠다"
 CZE_AUS_monarchy_event.3.b: "우리는 절대주의 군주가 아니라 유럽의 평화와 민주주의를 원한다."
 CZE_AUS_monarchy_event.4.t: "영국에서의 왕실 행사"
 CZE_AUS_monarchy_event.4.d: "우리는 버킹엄 궁전에서 열리는 왕실 행사에 초대를 받았습니다. 다른 군주국들 일부도 참석한다고 알려져 있으므로, 이는 어쩌면 우리의 문제를 논의할 기회일지도 모릅니다."
 CZE_AUS_monarchy_event.4.a: "유럽의 모든 왕실과 중요한 사안들을 논의하자"
 CZE_AUS_monarchy_event.4.b: "국왕은 현재 망명 중이므로 참석하지 않을 것이다."
 CZE_AUS_monarchy_event.5.t: "영국에서의 왕실 행사"
 CZE_AUS_monarchy_event.5.d: "오늘은 유럽에게 새로운 날이며, 우리는 카를 폰 합스부르크의 구상을 따를지 현상을 유지할지 결정해야 합니다."
 CZE_AUS_monarchy_event.5.a: "변화가 마음에 든다"
 CZE_AUS_monarchy_event.5.b: "우리가 절대주의를 폐지한 데는 이유가 있다"
 CZE_AUS_monarchy_event.6.t: "카를 폰 합스부르크의 비밀 서한"
 CZE_AUS_monarchy_event.6.d: "우리는 놀라운 소식이 담긴 서한을 받았습니다. 서한은 영국 왕실이 체코 왕실 같은 일부 군주들과 재결합하기를 꺼리고 있다는 내용을 다루고 있습니다. 그럼에도 그는 몇 가지 중대한 사안을 논의하기 위한 비밀 회동을 원하며, 프라하의 새 궁전으로 자신을 찾아오도록 우리를 초대했습니다."
 CZE_AUS_monarchy_event.6.a: "프라하를 왕실 방문하겠다"
 CZE_AUS_monarchy_event.7.t: "대공을 프라하로 보낼 준비 완료"
 CZE_AUS_monarchy_event.7.d: "체코슬로바키아 국왕의 왕실 방문 이후, 우리는 대공이 프라하로 떠날 준비가 되었다고 판단합니다. 그곳에서 카를 폰 합스부르크의 도움으로 대공의 오스트리아 귀환이 시작될 것입니다."
 CZE_AUS_monarchy_event.7.a: "비행편이 출발할 준비가 되었다"
 CZE_AUS_monarchy_event.8.t: "대공의 프라하 도착"
 CZE_AUS_monarchy_event.8.d: "수개월의 준비 끝에 대공은 오스트리아로 돌아갈 준비가 되었습니다. 하지만 그 전에 성공적인 귀환을 보장하기 위해 그의 인기도를 높여야 합니다."
 CZE_AUS_monarchy_event.8.a: "최고의 사회 조작 전문가들을 보내라"
 CZE_AUS_monarchy_event.9.t: "안정도를 유지하지 못하는 정부"
 CZE_AUS_monarchy_event.9.d: "오스트리아 대도시들에서 이어진 수많은 시위 끝에, 친군주제 세력은 나라를 마비시킬 만큼 충분한 지지를 얻었습니다. 연방 대통령은 오늘 사임했으며 선거가 최대한 빨리 치러질 것입니다."
 CZE_AUS_monarchy_event.9.a: "군주주의자들은 표가 없더라도 선거에서 승리할 것이다"
 CZE_AUS_monarchy_event.10.t: "카를 폰 합스부르크의 항의 서한"
 CZE_AUS_monarchy_event.10.d: "연방 대통령은 체코슬로바키아 국왕의 요청을 받았습니다. 그는 합스부르크-로트링겐 가문의 역사적 재산 일부를 되찾고자 합니다. 그러나 대부분의 재산은 현재 정부가 사용 중이어서 지금은 반환할 수 없습니다. 보상으로 대체 지급을 제안할 수도 있고, 그의 요구를 거절할 수도 있습니다."
 CZE_AUS_monarchy_event.10.a: "이웃 나라와 우호적으로 지내는 편이 좋을 수도 있다"
 CZE_AUS_monarchy_event.10.c: "우리는 군주주의자를 지지하지 않는다, 우리는 공화국이다"
 CZE_AUS_monarchy_event.11.t: "고위층 속의 군주주의자들"
 CZE_AUS_monarchy_event.11.d: "군주주의자들이 우리 정부 고위층에 침투했다는 소문이 나타났으며, 이는 군주주의 단체들이 우리 정치에 영향력을 행사하기 시작할 것임을 뜻합니다. 그들은 매일 더 많은 지지를 모으고 있으며 그들을 막는 것은 거의 불가능해질 것입니다."
 CZE_AUS_monarchy_event.11.a: "공화국이 불안정해지기 시작한다"
 CZE_AUS_monarchy_event.13.t: "오스트리아에서 권력을 잡은 군주주의자들"
 CZE_AUS_monarchy_event.13.d: "국민이 오스트리아를 마비시켰으며, 이유는 아무도 모르지만 인구 대다수가 파업에 나섰습니다. 그 파업 대부분은 공화국을 끝내고 오스트리아에 군주주의자들을 복권시키기 위한 것이었습니다. 오스트리아 정부의 잔류 인사 일부는 체코슬로바키아 정부가 이 시위의 배후에 있다고 단언했습니다. 우리가 아는 것은 오늘 대공이 연방 정부의 권력을 장악한다는 사실뿐이며, 그는 공화국이 짓밟은 이들에게 더 큰 안정과 더 나은 미래를 약속했습니다."
 CZE_AUS_monarchy_event.13.a: "국민과 새 정부에게 최선이 있기를 바란다"
 CZE_AUS_monarchy_event.14.t: "영국에서 재결집하는 군주국들"
 CZE_AUS_monarchy_event.14.d: "우리가 영국에 요청했던 왕실 행사의 초대장을 방금 받았습니다. 협상이 우리의 기대대로 끝나기를 바랍니다."
 CZE_AUS_monarchy_event.14.a: "지금 비행기를 준비하라"
 CZE_AUS_monarchy_event.15.t: "영국 왕실의 거절"
 CZE_AUS_monarchy_event.15.d: "예상 밖의 일이었으며, 우리는 다른 방법으로 벨기에 왕실에 연락해야 할 것입니다. 비밀 서한이 최선의 선택일지도 모릅니다"
 CZE_AUS_monarchy_event.15.a: "국왕께서 수락하셨다, 이제 펜과 종이를 가져오라"
 CZE_AUS_monarchy_event.16.t: "왕실 회담의 결론"
 CZE_AUS_monarchy_event.16.d: "카를 폰 합스부르크의 지도력 덕분에 우리는 앞으로 몇 년간의 분명한 길을 갖게 되었습니다. 목표는 명확합니다. 유럽 기구들에 군주주의 정서를 불어넣는 것입니다. 영국 왕실로서 우리는 우리 왕실의 이익, 또는 다른 군주국들의 이익과 관련된 법안을 승인하도록 정치인들을 압박할 것입니다."
 CZE_AUS_monarchy_event.16.a: "이제 정치인들을 압박하기 시작할 것이다"
 CZE_AUS_monarchy_event.17.t: "유럽 군주국 행사"
 CZE_AUS_monarchy_event.17.d: "영국의 예상치 못한 정권 교체와 영국 왕실의 망명 이후, 우리는 프라하에서 모든 군주국을 위한 안전한 행사를 준비했습니다. 목표는 모든 유럽 군주국의 이익을 어떻게 증진할지, 유럽 기구들에서 우리의 영향력을 어떻게 넓힐지, 그리고 공동의 적에 어떻게 대처할지를 논의하는 것입니다."
 CZE_AUS_monarchy_event.18.t: "프라하에서의 왕실 행사"
 CZE_AUS_monarchy_event.18.d: "오늘은 유럽에게 새로운 날이며, 우리는 카를 폰 합스부르크의 구상을 따를지 현상을 유지할지 결정해야 합니다."
 CZE_AUS_monarchy_event.18.a: "변화가 마음에 든다"
 CZE_AUS_monarchy_event.18.b: "우리가 절대주의를 폐지한 데는 이유가 있다"
 CZE_AUS_monarchy_event.20.t: "대공의 프라하 도착"
 CZE_AUS_monarchy_event.20.d: "강제 망명 이후 대공이 프라하에 도착했습니다. 그가 어디에 있었는지는 아무도 모르지만, 얼마 전 열린 왕실 행사의 발표 이후 그는 프라하가 자신과 가족에게 안전한 도시라고 판단했습니다"
 CZE_AUS_monarchy_event.20.a: "그를 국왕께 데려가라, 그들은 이야기를 나누어야 한다"
 CZE_AUS_monarchy_event.21.t: "오스트리아 정부의 수락"
 CZE_AUS_monarchy_event.21.d: "우리는 공화국이 우리에게서 빼앗은 재산에 대한 보상으로 첫 지급금을 받았습니다."
 CZE_AUS_monarchy_event.21.a: "추가 자금은 언제나 좋은 징조다"
 CZE_AUS_monarchy_event.23.t: "오스트리아 정부의 거절"
 CZE_AUS_monarchy_event.23.d: "오스트리아 주재 우리 외교관은 오스트리아 정부가 합스부르크 가문에 아무것도 지불할 의사가 없으며, 해당 재산은 왕실이 아니라 항상 정부의 것이었다고 밝혔다고 알렸습니다."
 CZE_AUS_monarchy_event.23.a: "빌어먹을!"
 CZE_SLO_monarchy_event.1.t: "슬로바키아와의 공동 정책"
 CZE_SLO_monarchy_event.1.d: "많은 숙고 끝에 우리는 수립할 수 있는 몇 가지 정책을 선정했습니다. 재통합이 이루어질 경우 이 정책들이 그 이후에 도움이 될 것입니다."
 CZE_SLO_monarchy_event.1.a: "국왕께서 검토하실 것이다"
 CZE_HUN_monarchy_event.1.t: "폭동을 준비하는 친군주제 세력"
 CZE_HUN_monarchy_event.1.d: "우리 국가정보국은 국내 친군주제 단체들에 막대한 자금이 흘러 들어가는 것을 포착했습니다. 우리 전문가들은 이러한 증가의 이유와 자금의 출처를 알지 못하며, 아마도 유럽의 어느 군주국일 것입니다. 현재 출처를 추적하고 있습니다"
 CZE_HUN_monarchy_event.1.a: "전문가들이 이 일을 잘 처리할 것이다"
 CZE_HUN_monarchy_event.3.t: "피데스 문제"
 CZE_HUN_monarchy_event.3.d: "친군주제 단체들이 헝가리 집권당과 관련된 현재의 문제를 설명하기 위해 우리에게 연락해 왔습니다. 피데스는 1988년 창당 이후 상당한 권력을 얻었습니다. 이는 우리의 이익에 문제이므로, 헝가리 정부에 합스부르크 가문의 인물을 앉히려면 먼저 그들을 처리해야 합니다."
 CZE_HUN_monarchy_event.3.a: "연줄을 만들어 보자"
 CZE_HUN_monarchy_event.4.t: "야당에 대한 지원"
 CZE_HUN_monarchy_event.4.d: "친군주제 세력이 군주제 복원을 지지하는 만큼, 우리 국가정보기관은 체코슬로바키아 정부를 조사해 왔습니다. 오늘 우리는 일부 야당이 그들로부터 자금을 받았음을 알아냈습니다. 그러나 개입은 대규모 불안정으로 이어져 다음 선거에서 패배할 수 있으므로 우리는 간섭할 수 없습니다."
 CZE_HUN_monarchy_event.4.a: "어쩌면 언론에 정보를 흘릴 수 있을지도 모른다"
 CZE_HUN_monarchy_event.5.t: "헝가리 선거"
 CZE_HUN_monarchy_event.5.d: "선거가 끝났고 결과를 발표할 준비가 되었습니다. 우리의 새 국가 지도자는 누가 될까요?"
 CZE_HUN_monarchy_event.5.a: "새로운 미니스테렐뇌크는 ..."
 CZE_HUN_monarchy_event.6.t: "새로운 헝가리 지도자는 누구인가?"
 CZE_HUN_monarchy_event.6.d: "헝가리 정부는 우리가 조작한 선거의 종료를 발표했습니다. 그러나 결과를 공개하지 않아 새 총리가 누구인지 알 수 없습니다."
 CZE_HUN_monarchy_event.6.a: "어쩌면 조작을 알아챘을지도 모른다"
 CZE_HUN_monarchy_event.7.t: "조작된 선거"
 CZE_HUN_monarchy_event.7.d: "선거 종료를 발표하기 전에 정부는 이미 외세가 선거를 조작하고 있었다는 사실을 알고 있었습니다. 그러나 국가 기관들은 외국의 조작자가 목적을 달성하도록 도운 이들의 이름을 밝히기 위해 노력하고 있습니다."
 CZE_HUN_monarchy_event.7.a: "수사관들에게 모든 자원을 배정하겠다"
 CZE_HUN_monarchy_event.7.b: "수사관들을 괴롭히지 않겠다"
 CZE_HUN_monarchy_event.7.c: "수사관들이 우리 자신의 조작을 알아내길 원하지 않는다"
 CZE_HUN_monarchy_event.9.t: "우리의 조작을 수사하는 헝가리 기관들"
 CZE_HUN_monarchy_event.9.d: "정부는 지난 선거의 조작에 대한 대규모 수사를 발표했습니다. 그들은 이미 외세가 선거를 조작했다는 사실을 알고 있으며, 작전을 수행한 이들에 대한 모든 정보를 확보하고자 합니다."
 CZE_HUN_monarchy_event.9.a: "매우 나쁘다"
 CZE_HUN_monarchy_event.8.t: "우리의 조작을 수사하는 헝가리 기관들"
 CZE_HUN_monarchy_event.8.d: "정부는 지난 선거의 조작에 대한 수사 개시를 발표했습니다. 정부는 수사에 관해 아무것도 밝히지 않았고, 모든 기관이 수사에 투입되어 있다고만 언급했습니다."
 CZE_HUN_monarchy_event.8.a: "헝가리 정부를 피하도록 모든 협력자를 돕겠다"
 CZE_HUN_monarchy_event.10.t: "우리의 조작을 수사하는 헝가리 기관들"
 CZE_HUN_monarchy_event.10.d: "정부는 선거 결과를 발표하지 않았으며, 이제 언론이 헝가리 정부에 결과를 공개하라고 압박하고 있습니다. 우리가 침투시킨 요원 일부가 선거에서 또 다른 조작이 있었다는 정보를 보내왔습니다. 이 정보가 사실이라면 헝가리 정부는 우리의 조작을 영영 알아내지 못할지도 모릅니다"
 CZE_HUN_monarchy_event.10.a: "완벽하다"
 CZE_HUN_monarchy_event.11.t: "더 비밀스러운 수사를 원하는 군주주의 정당들"
 CZE_HUN_monarchy_event.11.d: "총리는 모든 수사를 더 비공개로 진행해 달라는 청원을 받았습니다. 그들은 해당 수사가 비밀로 유지되어야 하며, 따라서 필요한 사람들만 이를 알아야 한다고 주장합니다."
 CZE_HUN_monarchy_event.11.a: "어쩌면 그들이 옳다, 아는 사람이 적을수록 결과가 좋다"
 CZE_HUN_monarchy_event.11.b: "우리 수사에 대한 이러한 조작은 받아들이지 않겠다"
 CZE_HUN_monarchy_event.12.t: "수사를 조작하는 군주주의자들"
 CZE_HUN_monarchy_event.12.d: "헝가리 군주주의 정당 내의 우리 인원이 총리에게 제출된 청원에 대해 알려 왔습니다. 그들은 요원들을 매수할 수 있도록 수사에 참여하는 인원 수를 줄이고자 합니다. 총리는 그들의 제안을 수락했고, 일부 군주주의 단체는 그 요원들을 매수하기 시작했습니다."
 CZE_HUN_monarchy_event.12.a: "수사관 없이 수사가 진행될 것이다"
 CZE_HUN_monarchy_event.13.t: "수사 조작에 실패한 군주주의자들"
 CZE_HUN_monarchy_event.13.d: "헝가리 군주주의 정당 내의 우리 인원이 총리에게 제출된 청원에 대해 알려 왔습니다. 그들은 요원들을 매수할 수 있도록 수사에 참여하는 인원 수를 줄이고자 했습니다. 그러나 총리가 그들의 제안을 거부했으므로 수사는 완전히 투명하게 유지될 수 있습니다."
 CZE_HUN_monarchy_event.13.a: "정부에는 시도해 보았으니 이제 언론에 시도해 보자"
 CZE_HUN_monarchy_event.14.t: "조작을 두고 우리를 비난하는 사람들"
 CZE_HUN_monarchy_event.14.d: "한 계정이 헝가리 정부 로고가 찍힌 위조 문서를 폭로했습니다. 그 문서에는 조작이 어떻게 이루어질 것이며 언론에 어떻게 대응할지가 설명되어 있습니다. 전통 언론이 이를 방송하고 보도했으며, 이제 대부분 총리의 해명 출석을 요구하고 있습니다."
 CZE_HUN_monarchy_event.14.a: "총리는 출석하지 않을 것이며 그 문서들은 가짜다"
 CZE_HUN_monarchy_event.15.t: "언론의 완전한 조작"
 CZE_HUN_monarchy_event.15.d: "우리가 제작한 위조 문서는 완벽합니다. 전통 언론이 현재 이를 방송하며 총리의 출석을 요구하고 있습니다. 그러나 총리는 이를 거부하고 문서들이 가짜라고 밝혔으며, 이는 오히려 정부에 대한 불신만 키웠습니다."
 CZE_HUN_monarchy_event.15.a: "더 많은 전국 채널에 정보를 보내겠다"
 CZE_HUN_monarchy_event.15.b: "완벽하다, 이제 문서 제작자들과 함께 축하할 수 있다"
 CZE_HUN_monarchy_event.16.t: "정부의 부패"
 CZE_HUN_monarchy_event.16.d: "수사관들이 수사를 거의 마무리했습니다. 그러나 수사 과정에서 정부의 조작을 가리키는 문서들을 발견했으며, 우리는 그 정보가 언론에 유출되기를 원치 않았으나 누군가 방금 이를 유출했습니다."
 CZE_HUN_monarchy_event.16.a: "혐의를 인정하고 정부 인사 일부를 해임한다"
 CZE_HUN_monarchy_event.16.b: "혐의를 부인한다"
 CZE_HUN_monarchy_event.17.t: "당을 떠나는 당원들"
 CZE_HUN_monarchy_event.17.d: "정부의 부패를 부인한 뒤 당의 옛 동료 일부가 떠났습니다. 정부는 내부에서 붕괴 직전이며, 어쩌면 일부 장관이 사임할지도 모릅니다."
 CZE_HUN_monarchy_event.17.a: "나쁜 결정이었다"
 CZE_HUN_monarchy_event.18.t: "내부 조사의 종료"
 CZE_HUN_monarchy_event.18.d: "정부의 부패가 발견된 뒤 당의 최고위급 인사 일부가 외부 조사를 촉구했습니다. 조사를 맡은 기업은 당에 부패가 없었다고 결론 내렸습니다. 그러나 우리는 이 용납할 수 없는 부패 사건으로 인해 현 장관 일부가 사임하기를 바랍니다."
 CZE_HUN_monarchy_event.18.a: "사임을 기다리고 있다"
 CZE_HUN_monarchy_event.19.t: "부패 사건에 연루된 헝가리 정부"
 CZE_HUN_monarchy_event.19.d: "오늘 우리는 헝가리 정부의 스캔들 소식을 접했습니다. 이 사건에 우리 정부는 연루되지 않았지만, 헝가리의 우리 동지들이 가능한 한 빨리 권력을 잡는 데 도움이 됩니다."
 CZE_HUN_monarchy_event.19.a: "한 걸음만 더"
 CZE_HUN_monarchy_event.20.t: "대규모 부패 사건에 연루된 헝가리 정부"
 CZE_HUN_monarchy_event.20.d: "우리가 입수한 소식은 훌륭합니다. 현재 헝가리 정부는 모든 내부 지지를 잃었습니다. 이는 이 나라에서의 우리 이익에 매우 좋은 소식입니다. 이제 조금만 더 밀어붙이면 합스부르크 왕을 권좌에 앉힐 수 있을지도 모릅니다."
 CZE_HUN_monarchy_event.20.a: "합스부르크 가문을 위하여"
 CZE_HUN_monarchy_event.21.t: "사임하는 헝가리 정부 인사들"
 CZE_HUN_monarchy_event.21.d: "헝가리 정부의 부패 관련 스캔들 이후, 일부 장관이 상황을 안정시키고 당원들의 지지를 유지하기 위해 사임했습니다. 당은 부패가 정부 인사에게만 영향을 미쳤다는 외부 감사 결과를 발표했습니다. 그러나 국민은 정부에 대한 신뢰를 잃었으며 더 나은 약속을 내놓는 새로운 정당을 기다리고 있습니다."
 CZE_HUN_monarchy_event.21.a: "우리의 인기도를 높이자"
 CZE_HUN_monarchy_event.22.t: "수사 최종 보고서"
 CZE_HUN_monarchy_event.22.d: "수사가 종결되었으나 수사관들은 작전에 관해 아무것도 찾아내지 못했습니다. 따라서 보고서는 선거 결과가 전적으로 유효했으며 정부가 대중의 지지 없이 권력을 유지하려 했다고 단언했습니다. 총리는 수사와 관련해 어떠한 성명도 내지 않았습니다."
 CZE_HUN_monarchy_event.22.a: "정부가 우리의 민주주의를 폐지하려 하고 있다"
 CZE_HUN_monarchy_event.23.t: "헝가리 선거 최종 보고서"
 CZE_HUN_monarchy_event.23.d: "우리의 작전은 완벽한 성공이었습니다. 수사는 조작에 대한 우리의 관여를 암시하는 어떤 단서도 찾지 못했습니다. 가장 좋은 점은 그들이 정부가 결과를 거부하려 했다고 밝혔다는 것입니다."
 CZE_HUN_monarchy_event.23.a: "어쩌면 합스부르크 가문이 그들에게 안정을 줄 수 있을지도 모른다"
 CZE_HUN_monarchy_event.24.t: "합스부르크 가문의 재산을 요구하는 체코슬로바키아 정부"
 CZE_HUN_monarchy_event.24.d: "오늘 합스부르크 가문의 수장 카를 폰 합스부르크가 그들의 망명 이후 우리가 몰수한 재산의 반환을 요구했습니다. 현재 대부분의 재산이 사용 중이어서 지금은 반환할 수 없습니다."
 CZE_HUN_monarchy_event.24.a: "금전 보상을 제안한다"
 CZE_HUN_monarchy_event.24.b: "우리는 합스부르크 가문과 협력하고 있으며 그 재산이 필요하다"
 CZE_HUN_monarchy_event.24.c: "우리는 공화국이며 그 재산은 공화국의 것이다"
 CZE_HUN_monarchy_event.25.t: "금전 보상을 제안하는 헝가리 정부"
 CZE_HUN_monarchy_event.25.d: "헝가리 정부는 해당 재산이 필요하다고 밝혔으나 금전 보상을 제안했습니다. 어쩌면 이 새로운 수입이 그들의 정부에 영향력을 행사하고, 우호적인 정당이 집권했을 때 그 재산을 되찾는 데 도움이 될지도 모릅니다."
 CZE_HUN_monarchy_event.25.a: "제안을 수락한다"
 CZE_HUN_monarchy_event.26.t: "헝가리 정부의 거절"
 CZE_HUN_monarchy_event.26.d: "헝가리 정부는 자신들이 공화국이며 모든 합스부르크 가문의 재산은 1921년 이래 공화국의 것이라는 입장을 표명했습니다."
 CZE_HUN_monarchy_event.26.a: "나라를 불안정하게 만든다"
 CZE_HUN_monarchy_event.27.t: "부쿠레슈티 회담"
 CZE_HUN_monarchy_event.27.d: "체코슬로바키아 정부는 헝가리 문제를 다루기 위한 양자 회담을 제안했습니다. 이는 지역에서 더 많은 영향력을 얻고 우리의 국제적 영향력을 높일 기회일 수 있습니다."
 CZE_HUN_monarchy_event.27.a: "체코슬로바키아와 협상할 준비가 되어 있다."
 CZE_HUN_monarchy_event.29.t: "우리 정치를 조작하려는 체코슬로바키아"
 CZE_HUN_monarchy_event.29.d: "체코슬로바키아 정부는 새로운 국가 첩보 기관을 설립했습니다. 우리 전문가들은 국내에 침투하는 새 첩자의 수가 늘어날 것으로 예상합니다. 정치적 안정도를 유지하려면 요원 일부를 방첩 임무에 배치해야 합니다."
 CZE_HUN_monarchy_event.29.a: "그들을 보내 우리나라를 지켜라!"
 CZE_HUN_monarchy_event.31.t: "헝가리 무역 조작"
 CZE_HUN_monarchy_event.31.d: "부쿠레슈티 회담의 가장 큰 성과 중 하나는 러시아로 향하는 헝가리 무역의 조작이었습니다. 현재 우리는 헝가리로 연결되는 우크라이나 철도 일부를 차단했습니다. 해당 무역 수입의 일정 비율을 제안하면 그들이 헝가리에 대한 봉쇄를 구축하는 것을 도울 수도 있습니다."
 CZE_HUN_monarchy_event.31.a: "적을수록 좋다"
 CZE_HUN_monarchy_event.31.b: "직접 접경한 국가들하고만 협상한다"
 CZE_HUN_monarchy_event.31.c: "모든 국경을 봉쇄하자"
 CZE_HUN_monarchy_event.32.t: "체코슬로바키아 정부의 이상한 제안"
 CZE_HUN_monarchy_event.32.d: "그들은 헝가리를 오가는 모든 무역을 차단하거나 늦춰 달라고 요청했습니다. 그 대가로 봉쇄로 얻는 수입의 일정 비율을 우리에게 줄 것입니다."
 CZE_HUN_monarchy_event.32.a: "서로에게 이득이 되는 상황이다"
 CZE_HUN_monarchy_event.33.b: "그 거래는 우리에게 손해다, 헝가리에 경고하겠다"
 CZE_HUN_monarchy_event.36.t: "우리 무역을 조작하는 외세"
 CZE_HUN_monarchy_event.36.d: "오늘 러시아인들이 체코슬로바키아가 그들에게 제안한 이상한 제안에 대해 우리에게 경고했습니다. 그들은 조작으로 얻는 수입의 일부를 대가로 우리 무역의 조작을 요청했습니다. 우리는 조작되었다고 판단되는 모든 무역을 분석했으며, 이제 조치를 취해야 합니다."
 CZE_HUN_monarchy_event.36.a: "NATO 비회원국 전체에 선전포고한다"
 CZE_HUN_monarchy_event.36.b: "싸워야 할 적이 너무 많다"
 CZE_HUN_monarchy_event.37.t: "부다페스트에 도착한 대공"
 CZE_HUN_monarchy_event.37.d: "부다페스트 페렌츠 리스트 국제공항의 관계자들이 대공의 헝가리 도착을 포착했습니다. 그들은 그를 어떻게 처리할지에 대한 공식 대응을 기다리고 있습니다."
 CZE_HUN_monarchy_event.37.a: "서류가 모두 맞다면 입국시켜라"
 CZE_HUN_monarchy_event.37.b: "그는 결코 헝가리에 들어오지 못할 것이다"
 CZE_HUN_monarchy_event.38.t: "폭동을 조직한 친군주제 세력"
 CZE_HUN_monarchy_event.38.d: "대공이 부다페스트에 도착한 뒤, 가장 영향력 있는 군주주의 단체 일부가 총리의 사임을 요구하는 폭동을 조직했습니다. 대공은 군주주의자들이 권력을 잡을 경우 헝가리를 통치할 의향이 있는지에 대해 아무런 언급도 하지 않았습니다."
 CZE_HUN_monarchy_event.38.a: "항의하게 두어라, 총리는 사임하지 않을 것이다"
 CZE_HUN_monarchy_event.39.t: "대공의 헝가리 입국 불허 결정에 반대하는 친군주제 세력"
 CZE_HUN_monarchy_event.39.d: "군주주의자들은 우리가 대공의 헝가리 입국을 막았다는 사실을 알아냈습니다. 그들 모두가 정부에 맞서는 폭동을 조직하고 있으며, 그 규모가 매우 클 것으로 예상됩니다."
 CZE_HUN_monarchy_event.39.a: "폭동에 대응하도록 경찰을 준비시켜라"
 CZE_HUN_monarchy_event.40.t: "요제프 대공의 서거"
 CZE_HUN_monarchy_event.40.d: "어젯밤 합스부르크 왕조의 요제프 대공이 세상을 떠났습니다. 장례식은 그가 오랜 세월 살았던 마드리드에서 치러질 예정입니다."
 CZE_HUN_monarchy_event.40.a: "우리 정부를 위해 새로운 왕을 지명해야 한다"
 CZE_HUN_monarchy_event.40.b: "고이 잠드소서"
 CZE_HUN_monarchy_event.41.t: "헝가리의 새로운 왕"
 CZE_HUN_monarchy_event.41.d: "폭넓은 숙의 끝에 합스부르크 왕조 일부 인사들의 승인을 받아, 우리는 빅토르 오르반을 헝가리의 새 국왕으로 지명하기로 결정했습니다. 카를 폰 합스부르크는 체코슬로바키아와 헝가리의 법률을 표준화하기를 원하며, 빅토르 오르반은 이 목표를 달성할 최선의 선택입니다."
 CZE_HUN_monarchy_event.41.a: "대관식을 준비하라"
 CZE_HUN_monarchy_event.42.t: "부쿠레슈티 회담의 종료"
 CZE_HUN_monarchy_event.42.d: "우리는 루마니아와의 관계를 개선하고 양국에 이익이 되는 공동 법률을 제정했습니다. 이제 헝가리에 맞설 준비를 하고, 그들 없이 지역 패권을 달성할 때입니다."
 CZE_HUN_monarchy_event.42.a: "새로운 시대가 시작되었다"
 CZE_HUN_monarchy_event.43.t: "우리를 압박하는 루마니아와 체코슬로바키아!"
 CZE_HUN_monarchy_event.43.d: "두 나라의 대표단이 헝가리를 기구에서 제명하기 위해 NATO 사무총장에게 접촉했습니다. NATO 사무총장이 어떻게 할지 결정하기 위해 우리에게 연락해 왔습니다."
 CZE_HUN_monarchy_event.43.a: "헝가리를 제명하라, 그들은 기구에 도움이 된 적이 없다"
 CZE_HUN_monarchy_event.43.b: "우리는 어떤 나라의 압박도 받아들이지 않는다"
 CZE_HUN_monarchy_event.44.t: "통제력을 잃은 정부"
 CZE_HUN_monarchy_event.44.d: "수 주간의 시위 끝에 많은 경찰관이 파업에 합류했고 정부는 이들을 통제할 힘을 잃었습니다. 경찰을 담당하는 장관이 사임했으며 다른 장관 일부도 사임할 것이라는 소문이 돌고 있습니다."
 CZE_HUN_monarchy_event.44.a: "정부가 무너지고 있다"
 CZE_HUN_monarchy_event.45.t: "권력을 잡은 군주주의자들"
 CZE_HUN_monarchy_event.45.d: "군주주의 단체들이 선거에서 승리했으며, 이제 헝가리 정부에서 공화주의 사상을 제거하는 새 헌법을 제정할 수 있습니다. 우선 새 총리를 선택해야 합니다."
 CZE_HUN_monarchy_event.45.a: "총리는 장래의 새 국왕이 될 것이다"
 CZE_prague_conference_event.1.t: "합동 육군 훈련"
 CZE_prague_conference_event.1.d: "체코슬로바키아 정부는 체코슬로바키아, 오스트리아, 헝가리 육군이 참여하는 합동 육군 훈련을 제안했습니다. 이는 새로운 군주국들과의 관계를 개선하고 우리의 공동 군사력을 세계에 과시할 훌륭한 기회가 될 것입니다. 45일간의 훈련 끝에 우리는 상당한 경험치와 육군 교리의 향상을 얻을 것입니다."
 CZE_prague_conference_event.1.a: "훌륭한 구상이다!"
 CZE_prague_conference_event.2.t: "합동 공군 훈련"
 CZE_prague_conference_event.2.d: "체코슬로바키아 정부는 우리 공군이 현대전에 제대로 대비되어 있지 않다고 생각합니다. 그들은 양국 간의 합동 공군 훈련을 제안하고 있습니다. 45일간의 훈련 끝에 우리는 상당한 경험치와 공군 교리의 향상을 얻을 것입니다."
 CZE_prague_conference_event.2.a: "공군을 개선할 수 있다면 무엇이든 환영이다"
 CZE_prague_conference_event.3.t: "해군 지식 교류"
 CZE_prague_conference_event.3.d: "우리나라들은 해전 경험이 많지 않을 수 있지만, 서로에게서 여전히 많은 것을 배울 수 있습니다. 체코슬로바키아 정부는 양국 간의 해군 지식 교류를 제안했습니다. 45일간의 논의 끝에 우리는 상당한 경험치와 해군 교리의 향상을 얻을 것입니다. 언제 쓸모가 있을지 누가 알겠습니까?"
 CZE_prague_conference_event.3.a: "물론이지"
 CZE_prague_conference_event.4.t: "[CZE.GetName]의 군사 정보 공유 희망"
 CZE_prague_conference_event.4.d: "[CZE.GetAdjectiveCap] 정부는 우리와 군사 정보를 공유할 의사가 있습니다. 이는 우리의 군사 능력을 향상시키고 적에 대한 우위를 얻게 해 줄 것입니다. 그러나 장차 우리에게 불리하게 사용될 수 있는 정보를 너무 많이 공유하지 않도록 주의해야 합니다. 45일간의 논의 끝에 우리는 상당한 경험치와 군사 정보의 향상을 얻을 것입니다."
 CZE_prague_conference_event.4.a: "다소 위험하지만, 좋다"
 CZE_prague_conference_event.5.t: "[CZE.GetName]의 군사적 돌파구 공유 희망"
 CZE_prague_conference_event.5.d: "우리나라들은 각자 잘하고 있지만, 경쟁에서 앞서 나가려면 서로 군사적 돌파구를 공유해야 합니다. [CZE.GetAdjectiveCap] 정부는 자국의 최신 군사적 돌파구를 우리와 공유할 의사가 있습니다. 45일간의 논의 끝에 우리는 상당한 군사적 돌파구의 향상을 얻을 것입니다."
 CZE_prague_conference_event.5.a: "훌륭한 계획이다"
 CZE_prague_conference_event.6.t: "[CZE.GetName]의 교육 프로그램 통합 계획"
 CZE_prague_conference_event.6.d: "[CZE.GetAdjectiveCap] 정부는 양국 간 교육 프로그램을 통합할 계획입니다. 이는 지식을 공유하고 교육 체계를 개선할 수 있게 해 줄 것입니다. 45일간의 논의 끝에 우리는 국가 연구와 생산성에서 상당한 향상을 얻을 것입니다."
 CZE_prague_conference_event.6.a: "밝은 미래를 향하여!"
 CZE_prague_conference_event.7.t: "[CZE.GetName]의 경찰력 협력 강화"
 CZE_prague_conference_event.7.d: "우리의 번영과 복지를 달가워하지 않는 나라들이 있습니다. [CZE.GetAdjectiveCap] 경찰력과의 협력을 강화함으로써 우리는 시민을 더 잘 보호하고 사회 질서를 유지할 수 있을 것입니다. 45일간의 논의 끝에 우리는 국가 안보에서 상당한 향상을 얻을 것입니다."
 CZE_prague_conference_event.7.a: "우리나라들을 안전하게 지키자"
 CZE_prague_conference_event.8.t: "[CZE.GetName]의 생활 여건 개선 모색"
 CZE_prague_conference_event.8.d: "[CZE.GetAdjectiveCap] 정부는 자국민과 우리 시민의 생활 여건을 개선할 방법을 찾고 있습니다. 함께 노력하면 공통 문제의 해결책을 찾고 국민을 위한 더 나은 미래를 만들 수 있습니다. 45일간의 논의 끝에 우리는 국가 발전과 안정도에서 상당한 향상을 얻을 것입니다."
 CZE_prague_conference_event.8.a: "물론이지"
 CZE_prague_conference_event.9.t: "[CZE.GetName]의 프라하 회의 마무리"
 CZE_prague_conference_event.9.d: "프라하 회의는 대성공이었습니다. 우리는 모든 목표를 달성했고 [CZE.GetAdjectiveCap] 정부와의 유대를 강화했습니다. 이 회의로 우리는 지식을 공유하고, 군사 능력을 향상시키고, 국민을 위한 더 나은 미래를 만들 수 있었습니다. 체코슬로바키아 정부의 최근 성공에 힘입어, 그들은 우리 그룹의 주도권을 잡고 우리 나라들의 발전 책임을 자신들의 손에 맡기기로 결정했습니다. 우리는 일부 독립성을 잃겠지만 그 대가로 많은 것을 얻을 것입니다."
 CZE_prague_conference_event.9.a: "마침내 때가 왔다"
 CZE_prague_conference_event.9.b: "그들은 훌륭히 해냈지만, 우리의 독립을 포기할 만큼은 아니다"
 CZE_prague_conference_event.10.t: "[FROM.GetName]의 우리 조건 수락"
 CZE_prague_conference_event.10.d: "[FROM.GetAdjectiveCap] 정부는 제한적 독립이라는 우리의 조건을 수락했습니다. 프라하 회의는 그들에게 대성공이었으며 그들은 앞으로 우리와 함께 일하기를 기대하고 있습니다."
 CZE_prague_conference_event.10.a: "훌륭하군!"
 CZE_prague_conference_event.11.t: "[FROM.GetName]의 우리 조건 거절"
 CZE_prague_conference_event.11.d: "[FROM.GetAdjectiveCap] 정부는 제한적 독립이라는 우리의 조건을 거절했습니다. 그들은 주권을 포기할 준비가 되어 있지 않으며 우리와 협력할 다른 방법을 찾고 있습니다. 우리는 함께 일할 다른 방법을 찾아야 할 것입니다."
 CZE_prague_conference_event.11.a: "뭐라고?!"
 CZE_prague_conference_event.12.t: "시작되는 통합 계획"
 CZE_prague_conference_event.12.d: "오늘 해외 대사관을 통합하려는 우리의 계획이 시작되었습니다. 최고위급 외교관 대부분은 재배치되거나 해임될 것입니다. 세 나라의 최고 외교관들만이 직위에 남을 것으로 예상하며, 이는 장차 다른 나라들과 좋은 조약을 맺는 데 도움이 될 수 있습니다."
 CZE_prague_conference_event.12.a: "외교에는 시간이 걸린다"
 CZE_prague_conference_event.13.t: "조약 재서명"
 CZE_prague_conference_event.13.d: "우리는 많은 조약을 재서명했습니다. 이는 문제가 되지 않을 수도 있지만, 해외 외교관 상당수가 서류 업무에 압도되어 다른 나라들과 꽤 나쁜 거래를 승인하기 시작했습니다. 이 조치는 옳지 않았으나, 우리가 하나의 단일 국가로 통합되면 다시 처리하기를 희망합니다"
 CZE_prague_conference_event.13.a: "그 외교관들은 해고되어야 한다!"
 CZE_prague_conference_event.14.t: "카를 폰 합스부르크가 이끄는 길"
 CZE_prague_conference_event.14.d: "체코슬로바키아의 국왕이 우리의 지정학적 상황을 재고하기 위해 다시 접촉해 왔습니다. 그는 유럽의 모든 군주가 달성해야 할 일련의 공동 목표를 세웠으며, 그 과정에서 마주칠 수 있는 어려움을 극복할 몇 가지 요령도 제공했습니다"
 CZE_prague_conference_event.14.a: "거절해서는 안 될 좋은 제안이다"
 CZE_prague_conference_event.14.b: "우리는 유럽의 민주주의적 관점에 확고히 동조한다"
 CZE_prague_conference_event.15.t: "부채 문제"
 CZE_prague_conference_event.15.d: "세 나라 모두의 부채 문제에 대한 해결책을 발표하게 되어 기쁩니다. 많은 투자자가 국왕의 부채 상환 능력에 의문을 품고 있었습니다. 오늘 경제 장관은 모든 부채를 공동 부채 풀로 통합하는 일련의 조치를 발표했습니다. 부채 일부는 모든 나라가 재통합될 때 상환되겠지만, 훨씬 큰 부분은 공동 부채로 남을 것입니다.\n 이 발표로 일부 투자자들은 통합에서 좋은 수익을 얻기를 기대하며 세 나라 모두에 투자하려 하고 있습니다"
 CZE_prague_conference_event.15.a: "모두가 우리나라에 투자해야 한다"
 CZE_prague_conference_event.16.t: "농촌 인프라"
 CZE_prague_conference_event.16.d: "우리나라들의 GDP에서 차지하는 비중이 작다는 이유로 우리는 농촌 지역을 낙후된 인프라 상태로 방치해 왔습니다. 이제 이 계획으로 해당 지역들의 GDP와 육상 운송의 대체 경로를 모두 개선할 것입니다."
 CZE_prague_conference_event.16.a: "체코슬로바키아의 농촌 지역에 집중해야 한다"
 CZE_prague_conference_event.16.b: "가장 낙후된 인프라에 집중해야 한다"
 CZE_prague_conference_event.17.t: "슈코다 개선"
 CZE_prague_conference_event.17.d: "우리는 자동차와 그 제조 방식을 모두 개선할 새로운 방법을 찾는 데 상당한 자금과 시간을 쏟았습니다. 따라서 헝가리와 오스트리아의 일부 현지 자동차 브랜드에도 이 모든 기술을 도입해야 합니다"
 CZE_prague_conference_event.17.a: "더욱 개선되기를 기대했다"
 CZE_prague_conference_event.17.b: "더 많이 생산하기를 기대했다"
 CZE_prague_conference_event.17.c: "설계와 생산을 모두 개선하고 싶다"
 CZE_prague_conference_event.20.t: "[FROM.GetName]의 우리 조건 수락"
 CZE_prague_conference_event.20.d: "[FROM.GetAdjectiveCap] 정부는 통합이라는 우리의 조건을 수락했습니다. 프라하 회의는 모두에게 대성공이었습니다."
 CZE_prague_conference_event.20.a: "훌륭하군!"
 CZE_prague_conference_event.21.t: "[FROM.GetName]의 우리 조건 거절"
 CZE_prague_conference_event.21.d: "[FROM.GetAdjectiveCap] 정부는 통합이라는 우리의 조건을 거절했습니다. 그들은 주권을 포기할 준비가 되어 있지 않으며 우리와 협력할 다른 방법을 찾고 있습니다. 우리는 함께 일할 다른 방법을 찾아야 할 것입니다."
 CZE_prague_conference_event.21.a: "가장 빠른 통합 방법을 보여 주겠다"
 CZE_the_end_of_czech_communism_tt: "§RKSČM§! 금지\n\n§RKSČM§!의 인기도가 §Y30%§! 이상일 경우:\n §R-5%§! §Y안정도\n §R-75§! 정치력§!"
 CZE_monarchist_past: "군주제의 과거"
 CZE_monarchist_past_desc: "체코에는 1918년까지 마지막 국왕이 통치한 오랜 군주제의 역사가 있습니다. 군주제를 복원하자는 생각은 일부 시민들의 마음속에 여전히 남아 있으며, 합스부르크 가문과 다른 왕가에 대한 관심이 높아지고 있는 것이 그 징후입니다. 우리가 이 과거를 받아들여야 하는지, 아니면 새로운 비전과 함께 앞으로 나아가야 하는지가 문제입니다."
 CZE_koruna_ceska_program: "코루나 체스카 강령"
 CZE_koruna_ceska_program_desc: "코루나 체스카 강령은 체코 코루나를 국가 통화로 사용하도록 장려함으로써 체코의 주권과 독립을 회복하는 것을 목표로 합니다. 이들의 강령은 합스부르크-로트링겐 가문과 함께 체코 군주제를 복원하기 위해 노력합니다. 이 정당은 1990년에 창당되었습니다."
 CZE_democratic_feudalism: "민주적 봉건제"
 CZE_democratic_feudalism_desc: "사람들은 왕이라는 이유만으로 왕을 따르지 않을 것입니다. 왕을 국민이 선출하되 통치할 권한은 여전히 가지는 체제를 만들어야 합니다. 이렇게 하면 우리의 군주제는 옛 군주제와 달라질 것이며, 현대 사회에서 더 환영받을 것입니다."
 CZE_strive_from_the_democratic_system: "민주주의 체제로부터의 도약"
 CZE_strive_from_the_democratic_system_desc: "옛 군주제는 왕이 절대적인 권력을 가진 체제였으며, 그러한 통치 방식은 수 세기 동안 이어졌습니다. 그렇다면 다시 시도해 보지 못할 이유가 없지 않습니까? 헝가리와 오스트리아의 합스부르크 가문으로부터 충분한 지지를 얻는다면 우리의 대의에 대한 큰 지지를 얻을 수 있습니다. 국민은 다시 한번 왕을 따를 것이며, 왕은 나라를 번영으로 이끌 것입니다."
 CZE_promote_presidential_elections: "대통령 선거 장려"
 CZE_promote_presidential_elections_desc: "다른 합스부르크 가문은 우리가 대통령 선거를 지지하기로 한 결정을 달가워하지 않겠지만, 우리는 그렇게 해야 합니다. 국민은 스스로 지도자를 선택해야 합니다. 옛 군주제가 돌아오도록 두지 않고, 국민이 선택한 왕이 있는 새로운 군주제를 만들 것입니다."
 CZE_limited_eu_trust_koruna_ceska: "제한적인 EU 신뢰"
 CZE_limited_eu_trust_koruna_ceska_desc: "유럽 연합은 훌륭한 구상이지만 완벽하지는 않습니다. EU에 대한 신뢰는 신중해야 하며, 우리의 이익이 보호되도록 해야 합니다. 우리나라에는 이 견해를 공유하는 다른 정당들도 있으니 함께 협력합시다."
 CZE_cooperation_with_ods: "ODS와의 협력"
 CZE_cooperation_with_ods_desc: "ODS는 EU에 대한 제한적 신뢰와 민주주의적 열망이라는 우리의 비전을 공유합니다. 우리는 공동의 목표를 달성하기 위해 함께 노력할 수 있습니다."
 CZE_cooperation_with_kdu_csl: "KDU-ČSL과의 협력"
 CZE_cooperation_with_kdu_csl_desc: "KDU-ČSL은 현재 체코에서 가장 오래된 정당입니다. 이들은 우리와 기독교적 가치와 전통적인 가족제도를 공유합니다. 이러한 사회적 가치를 바탕으로 더 큰 선을 위해 협력할 수 있습니다."
 CZE_parliamentary_cooperation: "의회 협력"
 CZE_parliamentary_cooperation_desc: "다른 정당들과의 성공적인 회담은 의회에서의 추가 협력의 길을 열어 줍니다. ODS와 KDU-ČSL의 지지가 있다면 공산주의자와 사회민주주의자를 앞지르고 우리의 목소리를 낼 수 있습니다."
 CZE_integrate_with_democratic_countries: "민주주의 국가들과의 통합"
 CZE_integrate_with_democratic_countries_desc: "민주주의 국가들은 대통령이 이끌기 때문에, 우리의 \\"왕\\"도 이 체제에 적응해야 합니다. 다른 나라들이 이러한 조건을 받아들인다면 그들과 통합을 시작할 수 있습니다."
 CZE_trust_in_the_old_system: "옛 체제에 대한 신뢰"
 CZE_trust_in_the_old_system_desc: "국민은 우리의 군주주의적 관점이 현재의 체제보다 나쁘지 않으며, 우리가 나라를 번영으로 이끌 수 있음을 알아야 합니다. 옛 군주제가 돌아오도록 두지 않고, 국민이 선택한 왕들이 있는 새로운 군주제를 만들 것입니다."
 CZE_prepare_a_new_president: "새 대통령 준비"
 CZE_prepare_a_new_president_desc: "오늘날에는 왕이라는 말보다 대통령이라는 말이 더 좋게 들리므로, 오해를 피하기 위해 새 대통령을 준비할 것입니다. 우리에게 그는 나라의 왕이겠지만, 국민에게는 대통령으로 서게 될 것입니다."
 CZE_seek_support_from_hungary: "헝가리의 지지 확보"
 CZE_seek_support_from_hungary_desc: "헝가리는 오랜 군주제의 역사를 가진 나라이며, 합스부르크 가문은 헝가리 왕가와 긴밀한 유대를 맺고 있습니다. 체코의 군주제 복원 노력에 대해 그들의 지지를 구할 수 있습니다."
 CZE_seek_support_from_austria: "오스트리아의 지지 확보"
 CZE_seek_support_from_austria_desc: "오스트리아 합스부르크 가문의 지지는 우리나라의 군주제 복원 노력에 상당한 영향을 미칠 것입니다. 합스부르크 가문들을 재결합시킨다면 목표 달성을 도울 강력한 동맹을 만들 수 있습니다."
 CZE_promote_the_traditional_family_system: "전통적 가족제도 장려"
 CZE_promote_the_traditional_family_system_desc: "전통적 가족제도는 우리 사회의 근간입니다. 이를 장려하고 존중과 보호를 받도록 해야 합니다. 합스부르크 가문은 전통적 가족제도를 안정의 상징이자 정치적 결정에서 강력한 수단으로 여겨 이를 장려해 온 오랜 역사를 가지고 있습니다."
 CZE_old_way_of_country_management: "옛 방식의 국정 운영"
 CZE_old_way_of_country_management_desc: "옛 방식의 국정 운영은 합스부르크 가문이 통치하던 방식입니다. 왕이 절대적인 권력을 가지고 국민은 그의 명령을 따라야 하는 체제입니다. 이 체제는 과거에 효과적이었음이 입증되었으므로 우리는 선조들의 발자취를 따를 것입니다."
 CZE_attack_kscm: "KSČM 공격"
 CZE_attack_kscm_desc: "저 공산주의자들은 자신들의 체제가 우리나라뿐 아니라 전 세계에 얼마나 파괴적인지 이미 보여 주었습니다. 그들이 다시 통치하도록 두지 않을 것이며, 우리나라에서 그들의 영향력을 없애기 위해 모든 노력을 다할 것입니다."
 CZE_attack_cssd: "ČSSD 공격"
 CZE_attack_cssd_desc: "KSČM의 동료인 ČSSD는 그들의 행동을 공개적으로 지지합니다. 적의 친구는 곧 우리의 적입니다."
 CZE_christian_and_protestant_values: "기독교 및 개신교 가치"
 CZE_christian_and_protestant_values_desc: "합스부르크 가문의 세계관과 달리, 우리는 가톨릭과 개신교의 가치를 모두 아울러 강력한 다종교 국가를 만들 수 있습니다. 이는 국민을 단결시키고, 종교와 관계없이 모두가 존중받고 보호받는 우리의 새 군주제를 위한 견고한 토대를 마련하는 데 도움이 될 것입니다."
 CZE_multi_religious_state: "다종교 국가"
 CZE_multi_religious_state_desc: "결국 합스부르크 가문은 다른 종교를 도외시한 순수한 가톨릭 가문이었습니다. 하지만 그것은 수백 년 전의 일입니다. 오늘날 우리가 다른 종교를 존중할 수 있음을 국민에게 보여 준다면, 합스부르크 통치 시절보다 더 위대한 나라를 만들 수 있습니다."
 CZE_petr_nohel: "페트르 노헬"
 CZE_petr_nohel_desc: "페트르 노헬은 문장학자이자 계보학자, 신학자입니다. 그는 귀족 가문, 특히 현재 및 과거 통치 왕조의 계보와 문장을 연구하며, 교육과 고등교육 전반의 문제도 다룹니다."
 CZE_vaclav_srb: "바츨라프 스르브"
 CZE_vaclav_srb_desc: "바츨라프 스르브는 프랑스어, 이탈리아어, 러시아어 국가 통번역 시험에 합격하여 관광 가이드로 생계를 꾸렸습니다. 1991년에는 자신의 여행사 프라가 마지카를 설립했습니다. 그의 사교적 재능과 우리 당에 대한 큰 헌신은 그를 앞으로 우리나라의 훌륭한 지도자로 만들어 줄 것이 분명합니다."
 CZE_radim_spacek: "라딤 슈파체크"
 CZE_radim_spacek_desc: "라딤 슈파체크는 정치인일 뿐만 아니라 카렐 대학교 인문대학에서 실험 연구의 데이터 처리를 위한 수학적 방법을 연구한 생물학자이기도 합니다. 그의 풍부한 정치 경험과 세계에 대한 지식은 우리나라의 더 나은 미래를 만드는 데 도움이 될 것입니다."
 CZE_the_end_of_czech_communism: "체코 공산주의의 종말"
 CZE_the_end_of_czech_communism_desc: "우리나라는 공산 정권으로 인해 충분히 고통받았습니다. 공산주의자들을 이제 영원히 막읍시다."
 CZE_decentralization_of_the_economy: "경제 분권화"
 CZE_decentralization_of_the_economy_desc: "지나치게 중앙집권화된 경제는 부패와 비효율에 취약합니다. 경제를 분권화하고 지역에 더 많은 권한을 주어야 합니다. 이는 더 효율적이고 효과적인 경제를 만드는 데 도움이 될 것입니다."
 CZE_the_question_of_the_silesia_region: "실레지아 지역 문제"
 CZE_the_question_of_the_silesia_region_desc: "실레지아 지역의 일부는 제1차 세계 대전 이후 폴란드에 넘어갔습니다. 이 지역은 천연자원이 풍부하고 발전 잠재력이 큽니다. 이 지역을 우리나라로 되찾아 다시 우리 민족의 일부로 만들 방법을 찾아야 합니다."
 CZE_get_czechs_and_slovaks_closer_to_eachother: "체코인과 슬로바키아인의 가까워지기"
 CZE_get_czechs_and_slovaks_closer_to_eachother_desc: "체코슬로바키아의 재건은 훌륭한 구상이었지만 아직 해야 할 일이 많습니다. 세계에서 우리의 위상을 강화하려면 마침내 두 민족을 재결합시켜야 합니다."
 CZE_regional_development: "지역 개발"
 CZE_regional_development_desc: "체코는 발전 잠재력이 큰 나라입니다. 각 지역에 투자하여 투자자들에게 더 매력적인 곳으로 만들어야 합니다. 이는 새로운 일자리를 창출하고 국민의 삶의 질을 향상시키는 데 도움이 될 것입니다."
 CZE_claims_on_silesia: "실레지아 영유권 주장"
 CZE_claims_on_silesia_desc: "폴란드는 우리에게 실레지아 지역을 돌려주지 않기로 했습니다. 외교가 문제를 해결하는 최선의 방법은 아닌 모양입니다. 필요하다면 우리의 것을 힘으로 되찾을 것입니다."
 CZE_invest_in_new_roads: "신규 도로 투자"
 CZE_invest_in_new_roads_desc: "폴란드가 실레지아를 우리와 공유하기로 했으니, 이제 그것이 좋은 결정이었음을 보여 줍시다. 신규 도로와 기반시설에 투자하여 이 지역을 투자자와 관광객에게 더 매력적인 곳으로 만들 것입니다. 이는 양국 모두에 이익이 될 것입니다."
 CZE_history_is_what_keeps_us_together: "역사가 우리를 하나로 묶는다"
 CZE_history_is_what_keeps_us_together_desc: "체코인과 슬로바키아인은 오랜 협력과 우정의 역사를 가지고 있습니다. 이 역사를 바탕으로 두 민족 사이에 강한 유대를 만들어야 합니다. 이는 양국의 더 나은 미래를 만드는 데 도움이 될 것입니다."
 CZE_repopulate_silesia_with_czechs_and_slovaks: "체코인과 슬로바키아인으로 실레지아 재정착"
 CZE_repopulate_silesia_with_czechs_and_slovaks_desc: "실레지아는 다시 우리나라의 일부가 되었지만 인구는 여전히 대부분 폴란드인입니다. 이 지역에 체코인과 슬로바키아인을 다시 정착시켜 강력하고 단합된 영토를 만들어야 합니다."
 CZE_increase_power_of_the_royal_family: "왕실의 권한 강화"
 CZE_increase_power_of_the_royal_family_desc: "우리는 실레지아 문제와 분열된 사회를 해결했습니다. 이 문제들이 해결되면서 새 왕실은 유럽에 자신들이 나라를 통치할 능력이 있음을 보여 주었습니다. 이제 그들의 권한을 강화하고 그들을 우리 민족의 상징으로 만들어야 합니다."
 CZE_more_independent_regions: "더 자주적인 지역"
 CZE_more_independent_regions_desc: "지역들이 중앙정부에 지나치게 의존하고 있습니다. 스스로 결정을 내릴 수 있도록 더 많은 권한과 자치권을 주어야 합니다."
 CZE_expand_local_industry: "지역 산업 확대"
 CZE_expand_local_industry_desc: "실레지아에 새 도로가 생겼으니 이제 지역 산업 확대에 집중할 수 있습니다. 실레지아는 천연자원이 풍부하고 발전 잠재력이 크므로 더욱 개발해야 합니다."
 CZE_grants_for_farmers: "농민 보조금"
 CZE_grants_for_farmers_desc: "농민은 우리 경제의 근간입니다. 이들을 지원하고 사업을 키울 수 있도록 도와야 합니다. 농민 보조금은 새로운 장비와 기술에 투자하도록 도와 생산성과 경쟁력을 높일 것입니다."
 CZE_dust_off_the_crown_jewels: "왕실 보석 먼지 털기"
 CZE_dust_off_the_crown_jewels_desc: "왕실 보석에 먼지가 쌓인 지 수년이 흘렀으니, 이제 이를 되살려 한때의 영광스러운 보석으로 되돌릴 때일 것입니다."
 CZE_prepare_for_the_coronation: "특별 행사 준비"
 CZE_prepare_for_the_coronation_desc: "왕은 전국의 모든 정당으로부터 지지를 얻어야 하므로, 최선의 방법은 왕실 행사를 준비하는 것일 수 있습니다."
 CZE_rule_of_karl_of_habsburg: "카를 폰 합스부르크의 대관식"
 CZE_rule_of_karl_of_habsburg_desc: "이 뜻밖의 일련의 사건 이후, 카를 폰 합스부르크의 인기는 안정과 경제에 대한 그의 공약 덕분에 높아졌습니다."
 CZE_two_nations_one_crown: "한 왕관 아래 두 민족"
 CZE_two_nations_one_crown_desc: "왕은 옛 친구들과 재결합하기를 원하지만 우리의 평판은 좋지 않습니다. 공동 정책을 시행한다면 재결합하여 다시 체코슬로바키아를 세울 수 있을지도 모릅니다."
 CZE_austrian_monarchists: "오스트리아 군주주의자"
 CZE_austrian_monarchists_desc: "오스트리아인들은 오스트리아-헝가리 제국의 일부였으며, 우리는 그들이 자국 민주주의의 문제를 이해하고 이를 해결할 합스부르크 지도자를 세우기를 기대할 뿐입니다."
 CZE_hungarian_monarchists: "헝가리 군주주의자"
 CZE_hungarian_monarchists_desc: "헝가리인들은 오스트리아-헝가리 제국의 일부였으며, 우리는 그들이 피데스 정당의 폭정을 깨닫고 합스부르크 왕과 함께 더 자유로운 나라가 되기를 기대할 뿐입니다."
 CZE_royal_alliance: "왕실 동맹"
 CZE_royal_alliance_desc: "이제부터 유럽에는 합스부르크 왕을 모신 나라가 하나 더 생겼으므로, 적에 맞서 스스로를 방어하기 위해 힘을 합쳐야 합니다."
 CZE_seperation_of_powers: "권력 분립"
 CZE_seperation_of_powers_desc: "오스트리아-헝가리 제국이 붕괴한 이후 우리 나라들은 서로 다른 길을 걸어 왔습니다. 이러한 차이를 제쳐 두고, 우리가 겪었던 문제들을 해결하면서 다시 한번 재결합하도록 노력해야 합니다. 하지만 먼저 통합을 돕는 몇 가지 법률을 마련해야 합니다."
 CZE_the_new_austro-hungary_project: "신 오스트리아-헝가리 프로젝트"
 CZE_the_new_austro-hungary_project_desc: "오스트리아-헝가리 제국이 붕괴한 이후 우리 나라들은 서로 다른 길을 걸어 왔으며, 체코슬로바키아를 제외한 모든 나라가 형편없는 상태가 되었습니다. 우리는 그들의 모든 약점을 통제하고 개선하기 위해 그들을 병합하고자 합니다. 하지만 먼저 통합을 돕는 몇 가지 법률을 마련해야 합니다."
 CZE_reach_to_the_house_of_habsburg-lorraine: "합스부르크-로트링겐 가문의 재산 회수"
 CZE_reach_to_the_house_of_habsburg-lorraine_desc: "오스트리아 공화국이 선포된 이후 합스부르크 가문의 재산 대부분이 몰수되었습니다. 이제 합스부르크 왕이 있으니, 오스트리아 정부가 이를 반환하도록 압박할 것입니다."
 CZE_gain_influence_in_the_austrian_government: "오스트리아 정부 내 영향력 확보"
 CZE_gain_influence_in_the_austrian_government_desc: "이제 정부에 반대하여 결집하는 시민 단체들이 생겼으니, 더 압박하여 친군주주의 인사들을 연방정부에 들여보낼 수 있습니다. 이는 오스트리아에 합스부르크 왕을 세우는 데 한 걸음 더 다가가는 일입니다."
 CZE_encourage_british_royal_family_support: "유럽 모든 군주국이 참석하는 행사 준비"
 CZE_encourage_british_royal_family_support_desc: "유럽은 통합되고 있지만 왕실들은 각기 다른 목표와 문제를 가지고 있습니다. 이 모든 문제를 논의하고 그것을 극복할 공동의 길을 따르기 위한 회담을 마련해야 합니다. 영국 왕실에 잉글랜드에서 개최하도록 강력히 요청해야 할지도 모릅니다."
 CZE_visit_belgium: "벨기에 왕실 방문"
 CZE_visit_belgium_desc: "왕실 회담 이후의 다음 단계는 벨기에 왕자를 설득하여 오스트리아 왕위에 대한 그의 권리를 주장하게 하는 것입니다. 이번 방문은 그의 귀환을 준비하기 위한 예우일 뿐이며, 먼저 프라하로, 그리고 오스트리아 국민이 준비되었을 때 오스트리아로 귀환하게 됩니다."
 CZE_initiate_the_return_of_the_archduke_lorenz_of_austria-este: "로렌츠 대공의 귀환 추진"
 CZE_initiate_the_return_of_the_archduke_lorenz_of_austria-este_desc: "벨기에에서의 훌륭한 방문과 왕자와의 완벽한 협상 이후, 오스트리아 국민의 지지를 높이기 위한 소셜 미디어 캠페인을 준비할 수 있습니다."
 CZE_kingdom_of_austria: "오스트리아 왕국."
 CZE_kingdom_of_austria_desc: "해냈습니다. 국민이 왕을 원한다는 뜻을 밝혔으니, 이제 대공을 오스트리아로 보내기만 하면 됩니다. 현재 공화국은 무너지고 있어 그의 귀환에 맞설 힘이 없을 것이며, 그의 도착이 공화국의 몰락에 마지막 일격이 될지도 모릅니다."
 CZE_the_problem_with_fidesz: "피데스 문제"
 CZE_the_problem_with_fidesz_desc: "피데스는 헝가리 국민 사이에서 큰 인기를 얻었습니다. 헝가리에 합스부르크 가문을 세우려면 피데스의 인기를 무너뜨려야 합니다."
 CZE_support_the_opposition: "야당 지원"
 CZE_support_the_opposition_desc: "피데스가 처음으로 무너졌으니, 이제 우리 당과 야당에 힘을 실어 주어야 합니다."
 CZE_manipulate_the_elections: "선거 조작"
 CZE_manipulate_the_elections_desc: "피데스와 민주 정당들을 향한 마지막 승부수입니다. 왕의 정당이 정부를 구성하기에 충분한 득표를 하도록 해야 합니다."
 CZE_meeting_with_romania: "부쿠레슈티 회담"
 CZE_meeting_with_romania_desc: "루마니아 정부와 안보와 협력에 관한 중요한 주제를 논의해야 합니다. 우리의 공통의 적인 헝가리에 노력을 집중해야 합니다."
 CZE_visit_archduke_joseph_arpad: "요제프 아르파드 대공의 방문"
 CZE_visit_archduke_joseph_arpad_desc: "대공이 수도에 도착하도록 할 수 있다면, 충분한 지지와 헝가리에서 대관식을 올릴 왕을 얻을 수 있습니다."
 CZE_kingdom_of_hungary: "헝가리 왕국"
 CZE_kingdom_of_hungary_desc: "대관식을 위한 모든 준비가 끝났습니다. 국민은 군주제를 승인했고 현 정부를 싫어하고 있으니, 명령만 내리면 됩니다."
 CZE_manipulate_hungarian_trade_with_russia: "헝가리 무역 조작"
 CZE_manipulate_hungarian_trade_with_russia_desc: "주요 무역 상대국 중 하나는 유럽에서 적으로 여겨지는 러시아입니다. 그들의 무역에 개입한다면 아무도 불평하지 않는 가운데 그 일부를 차지할 수 있을지도 모릅니다."
