 ukr_modernize_sov_equipment_storage_sale.5.desc: "§Y[GEO.GetNameWithFlag]§!, §Y[AZE.GetNameWithFlag]§! и §Y[ARM.GetNameWithFlag]§! интересовались нашими хранящимися §Y2К11 «Круг»§!. Продажа одной из этих стран §Rразозлит две другие§!."
