 ECONOMY_TITLE: "개요"
 REFRESH_ECONOMYVIEW_TOOLTIP: "£click_left §Y좌클릭§!하여 경제 화면을 새로고침합니다."
 BALANCE_TITLE: "수지"
 BALANCE_VALUE: "§Y[?treasury_rate|+3]§!"
 BALANCE_TOOLTIP: "우리의 주간 수지는 $[?treasury_rate|+3]§H십억§!입니다."
 BALANCE_TOOLTIP_DELAYED: "수지는 매주 국고의 순변화량을 의미하며, 총 수입에서 총 지출을 뺀 값과 같습니다. 수지가 마이너스면 국고가 고갈되며, 국고가 바닥나면 매주 부채가 발행됩니다."
 TREASURY_TITLE: "국고"
 TREASURY_VALUE: "§Y[?treasury|3]§!"
 TREASURY_TOOLTIP: "국고에 $[?treasury]§H십억§!이 있습니다.\n우리의 주간 수지는 $[?treasury_rate|+3]§H십억§!입니다."
 TREASURY_TOOLTIP_DELAYED: "국고는 우리가 지출할 수 있는 자금의 양을 나타내며, 구매 및 투자에 사용할 수 있습니다. 국고가 적자로 전환되면 국고를 양수로 유지하기 위해 매주 부채가 자동으로 발행됩니다.\n\n§t경제 화면이 무역 탭으로 이동되었습니다.§!"
 DEBT_TITLE: "부채"
 DEBT_VALUE: "§R[?debt|3]§!"
 INVESTMENTS_TITLE: "투자"
 INVESTMENTS_VALUE: "§G[?int_investments|3]§!"
 STATS_TITLE: "통계"
 GDP_TOTAL: "GDP"
 GDP_TOTAL_DESC: "Our §YGross Domestic Product§! (GDP) is the value measure of all products and services produced in the country. Millennium Dawn uses GDP adjusted with PPP (Purchasing Power Parity) as this value takes local economic conditions into account, making the country comparison more useful."
 NUM_GDP_TOTAL: "$$§Y[?ROOT.gdp_total|1]§!×십억"
 NUM_GDP_TOTAL_DESC: "우리의 §YGDP§!는 현재 $§Y[?ROOT.gdp_total|3]§! ×십억입니다.\n\n최근 §Y분기별 GDP 성장률§!: [?last_quarter_gdp_growth_rate|%Y].\n\n도움말: §Y분기별 GDP 성장률§!이 높을수록 긍정적인 경제 이벤트가 발생할 확률이 높아집니다."
 NUM_GDP_TOTAL_DELAYED_DESC: "백분율로 나타낸 산업별 대략적 기여도:\n§P민간 공장§!: [?ROOT.civil_fac_percent|%]\n§O군수 공장§!: [?ROOT.military_factory_total_percent|%]\n§B해군 조선소§!: [?ROOT.naval_factory_total_percent|%]\n§C사무 단지§!: [?ROOT.office_fac_percent|%]\n§G비상업화 농업§!: [?ROOT.agriculture_percent|%]\n§Y상업화 농업 지구§!: [?ROOT.agriculture_district_fac_percent|%]\n§Y마이크로칩 공장§!: [?ROOT.microchip_plant_percent|%]\n§Y첨단 복합재 공장§!: [?ROOT.composite_plant_percent|%]\n§Y합성 정제소§!: [?ROOT.synthetic_refinery_percent|%]\n§G자원 추출§!: [?ROOT.resources_percent|%]\n§Y기반시설§!: [?ROOT.infrastructure_gdp_percent|%]\n§P의료§!: [?ROOT.healthcare_gdp_percent|%]\n"
 GDP_PER_CAPITA: "1인당 GDP"
 GDP_PER_CAPITA_DESC: "이 숫자는 우리의 §Y1인당 GDP§!를 나타냅니다. 이는 국가 내 모든 국민의 1인당 생산량을 의미합니다.\n\n최근 §Y분기별 1인당 GDP 성장률§!: [?last_quarter_gdpc_growth_rate|%Y].\n\n도움말: §Y분기별 1인당 GDP 성장률§!이 높을수록 긍정적인 경제 이벤트가 발생할 확률이 높아지며, 방치할 경우 §R인플레이션§!이 잠재적으로 더 크게 상승할 수 있습니다."
 GDP_PER_CAPITA_DELAYED_DESC: "§Y1인당 GDP§!가 국가에 미치는 현재 영향:\n건설 속도: [?production_speed_buildings_factor_gdp_modifier|%+]\n월간 인구: [?monthly_population_gdp_modifier|%+1]\n연구 속도: [?research_speed_factor_gdp_modifier|%+]\n안정도: [?stability_factor_gdp_modifier|%+]\n총 노동력: [?total_workforce_gdp_c_modifier_var|%+]\n화석 연료 발전소 건설 속도: [?fossil_pp_construction_gdp_c_modifier_var|%+]\n"
 NUM_GDP_PER_CAPITA: "$$§Y[?ROOT.gdp_per_capita|3]§!k"
 NUM_GDP_PER_CAPITA_DESC: "우리의 §Y1인당 GDP§!는 현재 $§Y[?ROOT.gdp_per_capita|3]§! ×천입니다."
 PRODUCTIVITY: "생산성"
 PRODUCTIVITY_DESC: "이 숫자는 우리 국가의 §Y생산성§!을 나타냅니다."
 NUM_PRODUCTIVITY_DELAYED_DESC: "§Y주 조정 전 월간 성장:§! [?productivity_growth_scaled|3+]\n\n§Y기본 생산성 성장:§!\n법률, 국민정신 및 기술: [?modifier@productivity_growth_modifier|3+]\n  법인세 포함: [?productivity_growth_modifier_from_corporate_tax|3+][literacy_productivity_tooltip]\n\n§Y국가 성장 변동치:§!\n법률, 국민정신 및 기술: [?modifier@country_productivity_growth_modifier|%+1]\n  인플레이션 포함: [?inflation_rate_prod_var|%+1]\n\n월간 성장 = 기본 생산성 성장 ×0.5 × (1 + 국가 성장 변동치). 국가 배율은 0~100으로 제한됩니다. 이후 각 주는 세계 생산성 조정과 지역 성장 변동치를 적용합니다.\n\n생산성의 효과:\n§YGDP:§! [?productivity_tax_effect_display|%+1]\n§Y공장 생산량:§! [?productivity_tax_effect_display|%+1]\n§Y조선소 생산량:§! [?productivity_tax_effect_display|%+1]\n§Y건설 속도:§! [?productivity_tax_effect_display|%+1]\n§Y법인세:§! [?productivity_tax_effect_display|%+1]\n§Y£construction_speed_texticon §Y상업화 농업 지구§! 건설 속도:§! [?agriculture_district_output_var|%+1]"
 NUM_PRODUCTIVITY: "§Y[?ROOT.overall_productivity|3]§!"
 NUM_PRODUCTIVITY_DESC: "§Y생산성§!은 자원을 국민을 위한 재화와 서비스로 얼마나 효율적으로 전환하는지를 나타내며, GDP, 법인세, 산업 생산량의 규모를 좌우합니다. 생산성이 높을수록 효율이 높다는 뜻이지만, 주가 세계 평균에 비해 생산성이 높아질수록 성장은 둔화되고, 생산성이 낮은 주는 더 빠르게 따라잡습니다.\n\n§Y세계 평균:§! [?global.average_world_productivity|3]\n§Y우리의 생산성:§! [?ROOT.overall_productivity|3]\n"
 INFLATION: "인플레이션"
 INFLATION_DESC: "이 숫자는 우리 국가의 §Y인플레이션§!을 나타냅니다."
 NUM_INFLATION: "§Y[?ROOT.inflation_rate_var|%]§!"
 NUM_INFLATION_DESC: "§Y인플레이션§!은 물가가 얼마나 빠르게 오르는지를 나타냅니다. 인플레이션이 높으면 정부 비용이 늘고 공장 생산량이 줄어듭니다. §Y경제에 대한 인플레이션 영향§! 국민정신에는 인플레이션율이 마이너스일 때의 §Y디플레이션§!을 포함한 모든 효과가 표시됩니다.\n\n분기마다 갱신됩니다. 표시된 비율은 최근 4분기의 평균이며 분기당 최대 10%까지만 변동합니다. 난이도 설정이 쉬울수록 상승 속도가 느려집니다.\n\n§Y변동 요인:§!\n- §Y1인당 GDP§! 성장: 성장이 빠르면 오르고, 경제가 위축되면 내려갑니다\n- §Y세율§!: 세율이 높을수록 내려갑니다\n- §Y정책 금리§!: 금리가 높을수록 내려가지만 §R부채 이자§!가 늘어납니다\n- §Y경제 주기§!: §Y안정적 성장§!보다 높으면 오르고, 낮으면 내려갑니다\n- §Y예산§!: 적자가 클수록, 특히 부채가 많을수록 오르고, 흑자는 내립니다\n- §Y화폐 발행§!은 인플레이션을 올립니다\n- 통화가 약해지면 오르며, 자원을 수입하는 경우 더 크게 오릅니다\n- 높은 인플레이션은 일부가 다음 분기로 이어집니다\n\n§Y통화 강세:§! [currency_strength_display]\n§Y1.00§!이 정상입니다. 매월 갱신되며 §Y0.15§!에서 §Y2.00§! 사이를 유지합니다. 난이도 설정이 쉬울수록 최솟값이 높아집니다. 통화가 약하면 정부 비용이 늘고 자원 수출 수입이 늘어납니다. §Y준비통화 정책§!이 외국 통화를 사용한다면 부채 비용도 더 늘어납니다. 통화가 강하면 그 반대입니다.\n\n§Y변동 요인:§!\n- §Y정책 금리§!: 인플레이션보다 높으면 강해지고, 낮으면 약해집니다\n- §Y안정도§!: 50%보다 높으면 강해지고, 낮으면 약해집니다\n- §Y경제 주기§!: §Y안정적 성장§!보다 높으면 강해지고, 낮으면 약해집니다\n- 부채로 인한 5% 초과 §Y이자율§! 또는 §Y세계 긴장도§!는 통화를 약하게 합니다\n- 전쟁에서의 패배(항복 진행도 10% 초과), 내전, §Y국제 제재§!, 최근 3년 내 경제 붕괴는 통화를 약하게 합니다\n- 우리가 준비통화를 발행하면 이를 사용하는 국가마다 강해집니다\n- §Y세계 긴장도§!가 50%를 넘으면 달러, 엔, 스위스 프랑이 강해집니다\n\n시간이 지나면 장기 수준으로 서서히 되돌아갑니다. 금, 은, 복본위 §Y통화 담보제도§!는 약한 통화를 §Y1.00§!쪽으로 끌어올리며, 금은 §Y1.05§!를 넘는 통화도 다시 끌어내립니다."
 NUM_INFLATION_DELAYED_DESC: "§Y최근 4분기:§! [?ROOT.year_quarter_inflation_tracker^0|%] · [?ROOT.year_quarter_inflation_tracker^1|%] · [?ROOT.year_quarter_inflation_tracker^2|%] · [?ROOT.year_quarter_inflation_tracker^3|%]\n\n표시된 비율은 이 네 분기의 평균이며, 모든 인플레이션 효과에 사용되는 수치입니다."
 POPULATION_TAX_RATE: "인구세"
 POPULATION_TAX_RATE_TT: "§Y예상 세율: [?expected_population_tax_rate|0]%§!\n대중이 반발 없이 받아들이는 세율입니다. 1인당 국내총생산이 증가함에 따라 상승합니다.\n• 세율을 이 수치와 최근 인하한 더 높은 세율 모두를 넘어 인상하면 한동안 포인트당 £stability_texticon §Y안정도§!가 §R2%§! 감소합니다.\n• 세율을 이 수치와 최근 인상한 더 낮은 세율 모두보다 낮추면 한동안 포인트당 £stability_texticon §Y안정도§!가 §G0.5%§! 증가합니다.\n• 이 수치 쪽으로 이동하면 전환 페널티는 없지만, 인상하는 경우 최근 인하로 얻은 보너스를 먼저 회수합니다.\n자세한 내용은 국민 정신의 §Y정책 전환 비용§!을 참조하십시오.\n\n인구세율에는 대중에게 부과되는 모든 세금이 포함됩니다. 여기에는 소득세, 부가가치세(VAT), 판매세 및 재산세가 포함될 수 있지만 이에 국한되지 않습니다.\n\n§Y인구세로 인한 변동치:§!\n£stability_texticon  안정도: [?stability_factor_from_population_tax|%+]"
 CORPORATE_TAX_RATE: "법인세"
 CORPORATE_TAX_RATE_TT: "§Y기대 세율: [?expected_corporate_tax_rate|0]%§!\n기업이 반발 없이 받아들이는 세율입니다. 1인당 GDP가 증가할수록 상승하며 경제 순환을 따라 §Y경기 침체§!, §Y경기 후퇴§! 또는 §Y경기 불황§!에서는 낮아지고 §Y빠른 성장§! 또는 §Y경제 호황§!에서는 높아집니다.\n• 이 세율과 최근 인하한 더 높은 세율을 모두 넘어 인상하면, 한동안 포인트당 £stability_texticon §Y안정도§!가 §R1.2%§! 감소합니다.\n• 이 세율과 최근 인상한 더 낮은 세율을 모두 밑돌게 인하하면, 한동안 포인트당 §Y월간 생산성 성장§!이 §G0.01§! 증가하고 우리나라에 대한 §Y해외 투자§!가 §G2%§! 저렴해집니다.\n• 이 세율에 가까워지는 방향으로의 이동에는 전환 페널티가 없지만, 인상 시에는 먼저 최근 인하로 얻은 보너스를 회수합니다.\n§Y정책 전환 비용§!은 국민정신에서 확인할 수 있습니다.\n\n법인세율에는 기업에 부과되는 모든 세금이 포함됩니다. 이 수치에는 법인 소득세, 고용주 세금 등이 포함됩니다.\n\n§Y법인세로 인한 변동치:§!\n£consumer_goods_texticon  세금 비용: [?consumer_goods_from_corporate_tax|%Y]\n£receiving_investment_cost_modifier_texticon §Y해외 투자 유치§! 비용 변동치: [?receiving_investment_cost_form_corporate_tax|%-]\n월간 생산성 성장: [?productivity_growth_modifier_from_corporate_tax|+3]\n"
 CB_POLICY_RATE: "정책 금리"
 CB_POLICY_RATE_TT: "§Y중앙은행 정책 금리§!는 중앙은행이 설정하는 기준 금리입니다. 이는 경제 전반에 걸친 차입 비용을 통제합니다.\n\n§Y금리 인상§!은 통화 공급을 긴축시켜 인플레이션을 억제하지만 국채 이자율을 증가시키고 경제 활동을 둔화시킵니다.\n§Y금리 인하§!는 차입과 투자를 자극하지만 인플레이션이 더 자유롭게 상승하도록 허용합니다. 마이너스 금리는 디플레이션 기간에 추가적인 인플레이션 부양 효과를 줍니다.\n금리가 양수인 구간에서는 한 포인트마다 인플레이션이 다음 분기로 이월되는 비중도 줄어들며, 인플레이션이 아무리 높아도 마찬가지입니다. 금리가 0% 이하이면 이월 비중은 상한인 90%에 머뭅니다. 지속 가능한 수준을 넘는 재정 적자는 양수 금리 한 포인트마다의 감소 폭을 최대 절반까지 줄입니다.\n금리가 인플레이션보다 1pp 넘게 높으면 §Y통화 강세§!가 뒷받침되고, 금리가 더 낮으면 약해집니다. 인플레이션이 금리를 크게 웃돌 때도 한 포인트마다 월간 하락폭이 완화됩니다.\n\n각 조정에는 §Y25§!£pol_power_icon 만큼이 필요하며 §Y30일§!의 재사용 대기시간이 있습니다.\n\n§Y현재 금리:§! [?cb_policy_rate]%\n§Y분기별 인플레이션 억제:§! 양수 금리 한 포인트마다 분기당 이월 비중이 2.5pp씩 감소\n§Y부채 이자 프리미엄:§! [?cb_policy_rate|+0]% × 0.33pp가 §Y이자율§!에 추가됨"
 TOTAL_INCOME_TITLE: "Revenue:"
