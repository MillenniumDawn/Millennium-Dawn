 TUR_through_troubles: "A Través de los Problemas"
 TUR_through_troubles_desc: "Turkey is going through an economical crisis right now. We need to assure our people that the government can get through this"
 TUR_conservative_victory: "Victoria Conservadora"
 TUR_conservative_victory_desc: "The conservatives have won the election and can start bringing more conservative elements of Islam back to Turkey"
 TUR_gulenist_victory: "Victoria Gülenista"
 TUR_gulenist_victory_desc: "Los gülenistas han expulsado a los miembros corruptos del AKP. Esta es una gran victoria para la democracia"
 TUR_peace_with_religious_leaders: "Paz con los Líderes Religiosos"
 TUR_peace_with_religious_leaders_desc: "Aunque el gülenismo predica una forma muy específica de Islam, es importante que tengamos en cuenta a los líderes religiosos de Turquía. Debemos permitir que todas las sectas difundan sus enseñanzas libremente"
 TUR_gulenist_schools: "Escuelas Gülenistas"
 TUR_gulenist_schools_desc: "La educación es uno de los principios principales de Fethullah Gülen. Una educación adecuada mantiene la mente sana y a las personas siguiendo las ideas correctas"
 TUR_modern_islam: "Islam Moderno"
 TUR_modern_islam_desc: "El Islam es perfectamente compatible con los valores occidentales y la democracia. Debemos demostrar al mundo que nuestra fe en Dios nos hace mejores y más comprensivos"
 TUR_mobilising_the_movement: "Movilizar el Movimiento"
 TUR_mobilising_the_movement_desc: "El Movimiento Gülenista tiene miembros en todo el mundo. Nuestra red nos otorgará muchos recursos para usar"
 TUR_interfaith_dialogue: "Diálogo Interreligioso"
 TUR_interfaith_dialogue_desc: "Gülen teaches us to understand other religions. It is important that Islam has good relations with other major religions of the world, so we aren't left behind. We should hold diplomatic talks with clerics of non-Muslim countries"
 TUR_gulenist_funds: "Fondos Gülenistas"
 TUR_gulenist_funds_desc: "La organización Gülenista tiene miles de millones de dólares en valor en diversas fundaciones y empresas. Debemos movilizar estos fondos para ayudar al régimen."
 TUR_gulenist_economists: "Economistas Gülenistas"
 TUR_gulenist_economists_desc: "Al contar con un gran grupo de profesionales internacionales, podemos contratar a economistas expertos para asesorar a nuestro gobierno sobre cómo gestionar la economía."
 TUR_gulenist_information: "Informantes Gülenistas"
 TUR_gulenist_information_desc: "Utilizando nuestra vasta red, podemos recopilar información más fácilmente sobre países extranjeros."
 TUR_gulenist_education: "Educación Gülenista"
 TUR_gulenist_education_desc: "Focusing on education will be the key to bringing Turkey forward"
 TUR_the_great_mediator: "El Gran Mediador"
 TUR_the_great_mediator_desc: "Fethullah Gülen es un gran líder, erudito y diplomático. Es un hombre de paz y solo desea paz y prosperidad para el mundo."
 TUR_approach_tradition: "Acercarse a la Tradición"
 TUR_approach_tradition_desc: "Nuestra victoria nos ha mostrado que la gente anhela la tradición. Debemos mostrar que el mundo islámico está pasando por un renacimiento y pronto será la cultura dominante en la tierra."
 TUR_reduce_freedom_of_press: "Reducir la Libertad de Prensa"
 TUR_reduce_freedom_of_press_desc: "The so called 'free press' is nothing more than a tool to slander Islam and spread the media's vile secular ideas. We need to limit their ability to operate, and shut them down if we have to."
 TUR_mobilise_the_faithful: "Movilizar a los Fieles"
 TUR_mobilise_the_faithful_desc: "El Movimiento Gülenista es vasto y tiene una multitud de miembros. Debemos alentar a nuestros miembros a emigrar a Turquía."
 TUR_convert_radicals: "Convertir a los Radicales"
 TUR_convert_radicals_desc: "El Islam que enseña Gülen es la única forma correcta del Islam. Hay muchos que estarían en desacuerdo con esto, y deben ser erradicados."
 TUR_beacon_of_islam: "El Gran Erudito"
 TUR_beacon_of_islam_desc: "Fethullah Gülen es el mayor erudito del Islam, y sus enseñanzas serán conocidas en todo el mundo. Por supuesto, predicar el Islam conservador podría tener algunos efectos secundarios..."
 TUR_economic_reforms: "Reformas Económicas"
 TUR_economic_reforms_desc: "La economía está en ruinas y necesitamos mejorarla rápidamente. Actualmente, la economía depende en gran medida de la inversión extranjera, algo que necesitamos cambiar."
 TUR_increase_unemployment_insurance: "Aumentar el Seguro de Desempleo"
 TUR_increase_unemployment_insurance_desc: "The economic crisis has left many Turks without a job. While it will greatly hurt the government's budget, we need to increase the unemployment benefits to keep people alive. It will also inject a small amount of money into the economy, hopefully increasing consumption"
 TUR_small_imf_loans: "Pequeños Préstamos del FMI"
 TUR_small_imf_loans_desc: "The IMF has offered a small loan of $11.4 billion. Many analysts suggest that this is nowhere near enough to help the Turkish economy, but it's doubtful we'll be able to get more from the IMF"
 TUR_large_imf_loans: "Grandes Préstamos del FMI"
 TUR_large_imf_loans_desc: "With more concessions, we might be able to negotiate with the IMF so that we would be granted a larger loan from them."
 TUR_reduce_foreign_investors: "Reducir la Dependencia de Inversores"
 TUR_reduce_foreign_investors_desc: "La mayor parte de la economía turca se basa en la constante inversión extranjera y el flujo de capital de otros países. Necesitamos inyectar fondos gubernamentales en la economía y reducir nuestra dependencia de los mercados extranjeros."
 TUR_more_foreign_investors: "Aumentar la Dependencia de Inversores"
 TUR_more_foreign_investors_desc: "Vamos a necesitar capitalizar a los inversores extranjeros para obtener más capital de otros países."
 TUR_sell_government_companies: "Vender Empresas del Gobierno"
 TUR_sell_government_companies_desc: "Para obtener ingresos adicionales, necesitamos vender algunas de las empresas actualmente propiedad del estado turco."
 TUR_loosen_industrial_regulations: "Relajar la Regulación Industrial"
 TUR_loosen_industrial_regulations_desc: "Para fomentar el crecimiento, necesitamos relajar las regulaciones que imponemos a la industria. Esto seguramente impulsará la economía."
 TUR_economic_crisis_over: "Plan de Recuperación de la Crisis Económica"
 TUR_economic_crisis_over_desc: "We need to establish an economic recovery plan as soon as possible if we expect the Turkish nation to thrive monetarily. If we do not, we put our people's lives and jobs at risk and we cannot afford such a massive loss."
 TUR_western_development: "Desarrollo en el Oeste"
 TUR_western_development_desc: "Necesitamos desarrollar el oeste de nuestro país, ya que la mayoría de nuestras grandes ciudades están situadas allí y la gente espera un nivel de vida más alto."
 TUR_centeral_development: "Desarrollo Central"
 TUR_centeral_development_desc: "Nuestra capital, Ankara, está situada en el centro de nuestro país. Necesitamos mejorar las condiciones de vida allí y también en las ciudades que la rodean para que nuestro establecimiento político tenga una base de legitimidad."
 TUR_eastern_development: "Desarrollo en el Este"
 TUR_eastern_development_desc: "Hemos descuidado las provincias orientales durante demasiado tiempo, y la gente merece algo mejor. Mejorar la infraestructura allí ayudará mucho más a la gente rural."
 TUR_southern_attention: "Atención al Sur"
 TUR_southern_attention_desc: "Similar al Este, el Sur de nuestro país también ha sido algo olvidado. Las inversiones en el Sur serán necesarias para que la economía prospere."
 TUR_the_industries: "Las Industrias"
 TUR_the_industries_desc: "Nuestro Sector Industrial está comenzando a quedarse atrás del de nuestros vecinos y aliados, y debemos cambiar eso. Asignaremos parte de nuestro presupuesto a empresas turcas para que puedan prosperar por sí mismas."
 TUR_bereket: "Bereket Enerji"
 TUR_bereket_desc: "Bereket provides clean and renewable energy to the Turkish people, and it must continue doing that. Extra funding will give them the ability to expand, and grow"
 TUR_petroli_anonim: "Petrolleri Anonim"
 TUR_petroli_anonim_desc: "Petrolleri Anonim fue fundada en 1954 y ha logrado muchas cosas para el sector petrolero turco. Necesitamos cambiar nuestro enfoque industrial a producir más petróleo para nosotros mismos y para el resto del mundo."
 TUR_the_factories: "Las Fábricas"
 TUR_the_factories_desc: "Nuestras fábricas están comenzando a envejecer, quedarse obsoletas e ineficientes. Nuevas fábricas situadas en el noroeste de nuestro país mejorarán mucho más la situación y podremos trasladar a más personas a trabajar allí."
 TUR_kipas_textile: "Kipas Textil"
 TUR_kipas_textile_desc: "Kipas Textile produces some of the highest quality fabrics in our nation, and provides our economy with something to export to other countries"
 TUR_arkas_shipping: "Arkas Shipping"
 TUR_arkas_shipping_desc: "Arkas is a national shipping company that transports goods globally. It is very obvious what we must do, we must focus on getting them new dockyards so that they may continue to get from place to place without a problem"
 TUR_the_people: "La Gente"
 TUR_the_people_desc: "Al mejorar nuestra economía, no podemos olvidar la razón por la que la estamos mejorando, la gente. Nuestra gente va a necesitar algunas mejoras a nivel nacional que mejoren su calidad de vida."
 TUR_hakarri_trabzone_railway: "Ferrocarril Hakkari-Trabzon"
 TUR_hakarri_trabzone_railway_desc: "We will connect Hakkari and Trabzon, for the folks that live in the east of our country. This way, they are able to get to and from the Trabzon port in case they wish to set out to travel"
 TUR_istanbul_airport: "Expandir Turkish Airlines"
 TUR_istanbul_airport_desc: "Turkish Airlines is our domestically run airline, and we will start construction on some new airports for them. Our people will be able to easily travel within, and outside of Turkey knowing they are flying on a Turkish plane"
 TUR_the_neighbors: "Los Vecinos"
 TUR_the_neighbors_desc: "Nuestros vecinos que nos rodean serán cruciales para resolver nuestra crisis económica. Utilizaremos inversiones para cosechar influencia y lazos económicos entre nuestras naciones."
 TUR_look_west: "Nuestros Vecinos Occidentales"
 TUR_look_west_desc: "Nuestros vecinos occidentales, Grecia y Bulgaria, han tenido bastantes problemas en cuanto a economía. Por lo tanto, será sabio invertir en ellos, ya que son centros económicos emergentes."
 TUR_look_east: "Nuestros Vecinos Orientales"
 TUR_look_east_desc: "Nuestros vecinos orientales, Irán, Armenia y Georgia, han tenido crecimiento y colapso económico. Invertiremos en sus naciones para que sus economías puedan recibir ayuda para crecer más."
 TUR_the_military: "El Ejército"
 TUR_the_military_desc: "El Ejército será bastante crucial para mantener nuestra economía a flote, con la esperanza de que no intenten derrocarnos."
 TUR_fix_samsites: "Repair SAM Sites"
 TUR_fix_samsites_desc: "The SAM sites in our nation are starting to grow old. If we expect them to function properly, we are going to have to repair them."
 TUR_ministry_of_defense_repairs: "Satisfacer al Ministerio de Defensa"
 TUR_ministry_of_defense_repairs_desc: "El Ministerio de Defensa nos ha pedido que abramos más industrias militares, y hoy les concederemos exactamente eso."
 TUR_funds_for_tubitak_sage: "TUBITAK Sage"
 TUR_funds_for_tubitak_sage_desc: "TUBITAK Sage is our nation's Research and Development institute. If we want our military technology to be up to date, we are going to have to give them some extra facilities."
 TUR_stage_two: "Etapa Dos"
 TUR_stage_two_desc: "Finalmente estamos entrando en la segunda etapa de nuestro plan económico. En esta etapa, aumentaremos la estimulación económica y centralizaremos nuestra gobernanza."
 TUR_economic_stimulation: "Estimulación Económica"
 TUR_economic_stimulation_desc: "Inyectaremos fondos adicionales en la economía para ponerla en marcha y hacer que crezca de manera natural, en lugar de manual."
 TUR_national_power_grid: "Expandir la Red Eléctrica Nacional"
 TUR_national_power_grid_desc: "Due to an increase in our nation's population, the power grid is unable to properly function as a result of more people using electricity, causing an uptick in blackouts. By expanding it, we will be able to provide stable power for all households across the nation"
 TUR_the_budgets: "Revisiones del Presupuesto"
 TUR_the_budgets_desc: "Necesitamos revisar nuestro presupuesto para ver qué necesitamos priorizar y qué no necesitamos priorizar."
 TUR_funds_for_social_spending: "Priorizar el Bienestar Social"
 TUR_funds_for_social_spending_desc: "Nuestra gente, especialmente los jubilados y los discapacitados, dependen de los fondos del gobierno para seguir adelante. Vamos a necesitar priorizar ayudarlos en tiempos de necesidad."
 TUR_funds_for_healthcare: "Priorizar la Atención Médica"
 TUR_funds_for_healthcare_desc: "Obviamente, la gente se va a enfermar. Necesitaremos priorizar el gasto en atención médica para ayudar a aquellos que lo necesitan a salir de situaciones difíciles sin tener que arruinarse."
 TUR_funds_for_tubitak_mam: "TUBITAK Mam"
 TUR_funds_for_tubitak_mam_desc: "TUBITAK Mam is a domestically run research center, and we will need to utilize them to find cheap, but effective new solutions for our people's health and well-being"
 TUR_stage_three: "Etapa Tres"
 TUR_stage_three_desc: "La Etapa Tres priorizará hacer que nuestra economía cambie hacia una economía basada en el conocimiento. De esta manera, nuestra gente estará incentivada a obtener una educación adecuada para ganar algo de dinero."
 TUR_research_grants: "Emitir Subvenciones para Investigación"
 TUR_research_grants_desc: "We will issue research grants for our scientists and students to find new solutions to everyday life. This way, we will be able to modernize faster than ever before, and it will let us expand our technological capabilities"
 TUR_energy_research: "Investigación Energética"
 TUR_energy_research_desc: "In Stage One of our economic plan, we gave funding to an energy company to get our energy sector more efficient. However now we will have to find new ways to deliver and produce this energy so that we can cut down costs where needed"
 TUR_industrial_research: "Investigación Industrial"
 TUR_industrial_research_desc: "Queremos producir más y más cada día, por esa razón vamos a tener que encontrar nuevas formas de producir bienes."
 TUR_electronic_research: "Investigación Electrónica"
 TUR_electronic_research_desc: "Todo el mundo se está volviendo digital, y Turquía no puede ser diferente. Comenzaremos a investigar nuevas tecnologías y lanzaremos algunas nuevas empresas para ayudar con eso."
 TUR_tubitak_space: "TUBITAK Space"
 TUR_tubitak_space_desc: "TUBITAK Space will be our domestically run space technology institute, and they will seriously assist in getting us ahead when the time comes to go to space"
 TUR_sattelite_development: "Desarrollo de Satélites"
 TUR_sattelite_development_desc: "Desarrollaremos nueva tecnología de satélites para conectar a nuestra gente con el resto del mundo a medida que las nuevas tecnologías inauguran una nueva era de conectividad entre las personas."
 TUR_gokturk_launch: "Lanzamiento del Satélite Goktürk"
 TUR_gokturk_launch_desc: "Lanzaremos el satélite Goktürk-1A al espacio, ya que nos ayudará a obtener imágenes de alta calidad de la Tierra, asistiendo tanto a nuestra gente como a nuestro ejército."
 TUR_funds_for_tai: "Expandir Turkish Aerospace Industries"
 TUR_funds_for_tai_desc: "Turkish Aerospace Industries necesita comenzar a expandirse si queremos crear más empleos para la gente. La militarizaremos y comenzaremos a producir tecnología de guerra espacial."
 TUR_asteroid_mining_missions: "Misiones de Minería de Asteroides"
 TUR_asteroid_mining_missions_desc: "Comenzaremos a minar asteroides en busca de metales y recursos preciosos para ahorrar recursos aquí en la Tierra."
 TUR_drilling_technology: "Tecnología de Perforación"
 TUR_drilling_technology_desc: "Ahora que hemos comenzado la minería de asteroides, vamos a necesitar nuevas tecnologías de perforación para minar asteroides más grandes y difíciles."
 TUR_launching_facilities: "Instalaciones de Lanzamiento"
 TUR_launching_facilities_desc: "Se requerirán nuevas instalaciones de lanzamiento para lanzar misiones a asteroides. Las que tenemos actualmente están comenzando a desmoronarse y quedarse obsoletas, y las nuevas serán cruciales."
 TUR_mission_to_moon: "Turcos en la Luna"
 TUR_mission_to_moon_desc: "Entrenaremos a astronautas turcos y prepararemos una nave espacial para una misión a la luna."
 TUR_stage_four: "Etapa Cuatro"
 TUR_stage_four_desc: "Stage Four, the last and final stage for our economy is going to be focused on our domestic policies and people's daily lives"
 TUR_peoples_education: "The People's Education"
 TUR_peoples_education_desc: "La educación va a ser crucial, necesitamos a nuestra gente en el aula para que nuestra población sea alfabeta."
 TUR_the_security_of_people: "Seguridad de la Gente"
 TUR_the_security_of_people_desc: "Si nuestra gente no se siente segura, ¿cómo podemos esperar que participen económicamente?"
 TUR_destroying_corruption: "Destruir la Corrupción"
 TUR_destroying_corruption_desc: "Tenemos hombres corruptos en nuestros sectores económicos tomando dinero para sí mismos cuando podría haber sido dirigido a mejorar el país."
 TUR_the_great_economy: "La Gran Economía Turca"
 TUR_the_great_economy_desc: "Finalmente, hemos logrado lo que nos propusimos hacer años atrás, con sangre, sudor y lágrimas, finalmente hemos logrado la Gran Economía Turca!"
 TUR_tubitak: "TUBITAK Industry"
 TUR_tubitak_desc: "Vamos a expandir TUBITAK para incluir la investigación de nueva tecnología industrial, para que así podamos mejorar la economía aún más."
 TUR_turkish_agriculture: "Agricultura Turca"
 TUR_turkish_agriculture_desc: "Large portions of our nation run on agriculture, and urbanized fields. And because of that, we must double our efforts in providing functional technology for the farmers and workers."
 TUR_turkish_mining: "Minería Turca"
 TUR_turkish_mining_desc: "Tenemos una industria minera bastante decente, y puede ayudarnos a suministrar materiales a nuestras fábricas y al mercado."
 TUR_expansion_of_fuel_industries: "Expansión de las Industrias de Combustible"
 TUR_expansion_of_fuel_industries_desc: "Expandir las industrias de combustible puede ser beneficioso para nosotros a largo plazo, a medida que nos volvemos más industrializados y mecanizados."
 TUR_bridge_to_europe: "Un Puente a Europa"
 TUR_bridge_to_europe_desc: "Somos un puente a Europa, y por esta razón, somos muy importantes financieramente para ellos. Necesitamos capitalizar nuestra posición en el mundo y ganar tanto dinero como sea posible."
 TUR_taek: "TAEK"
 TUR_taek_desc: "La Autoridad de Energía Atómica de Turquía, o TAEK, está encargada de planificar y establecer el desarrollo de la energía nuclear en Turquía."
 TUR_double_steel_efforts: "Duplicar la Producción de Acero"
 TUR_double_steel_efforts_desc: "Somos un gran exportador de acero y metales, y vamos a tener que duplicar nuestros esfuerzos para exportar más, ganando así más dinero."
 TUR_togg: "TOGG"
 TUR_togg_desc: "TOGG is an acronym for Türkiye'nin Otomobili Girişim Grubu. It is an automobile manufacturer of electric vehicles within our nation, and it is best that our government supports them with new facilities."
 TUR_textiles_ethiopia: "Textiles Turcos en Etiopía"
 TUR_textiles_ethiopia_desc: "Operamos algunas pequeñas fábricas textiles en Etiopía, pero sería mejor para nosotros duplicar su tamaño para expandir nuestra influencia económica."
 TUR_standardize_construction_regulations: "Regulaciones de Construcción"
 TUR_standardize_construction_regulations_desc: "Nuestras regulaciones de construcción están por todas partes, lo que lleva a la creación de edificios inestables, que luego conducen a desastres. Vamos a tener que endurecer nuestras regulaciones y estandarizarlas para que sean universales en toda nuestra nación."
 TUR_telecommunications_authority: "Autoridad de Telecomunicaciones"
 TUR_telecommunications_authority_desc: "La Autoridad de Telecomunicaciones, o ICTA, está encargada de crear centros de comunicación estandarizados y líneas de telecomunicación."
 TUR_tighten_housing_regulation: "Regulaciones de Vivienda"
 TUR_tighten_housing_regulation_desc: "Over 40% of our nation's housing does not conform with standard regulations, we are going to have to change that. We will run mandatory inspections and fix whatever is necessary."
 TUR_the_mafia: "La Mafia"
 TUR_the_mafia_desc: "La Mafia nos ha estado causando problemas durante bastante tiempo, y es mejor que comencemos a eliminar lentamente su influencia de nuestra nación si queremos verdadera estabilidad."
 TUR_end_of_organized_crime: "Atacar el Crimen Organizado"
 TUR_end_of_organized_crime_desc: "Organized Crime is quite common in Turkey, in fact, it is running rampant now more than ever. We are going to have to target organized crimes and criminals, so that they stop disrupting daily life, and stop making governing so difficult."
 TUR_combat_their_influence: "Combatir su Influencia"
 TUR_combat_their_influence_desc: "We need to combat the Mafia's influence to prevent our youth from being sworn into a life of never-ending crime."
 TUR_begin_arrests: "Comenzar Arrestos"
 TUR_begin_arrests_desc: "Though our list of high-priority criminals is quite small at the moment, we should at least start by arresting the current suspects that we know of. We can perhaps use them to discover more of them through interrogation."
 TUR_seize_mafia_assets: "Incautar Activos de la Mafia"
 TUR_seize_mafia_assets_desc: "Ahora que hemos arrestado a varios miembros de la mafia, podemos incautar sus activos con fines de... investigación."
 TUR_anti_mafia_initiative: "Campaña Anti-Mafia"
 TUR_anti_mafia_initiative_desc: "Al lanzar campañas que desalienten la unión a las Mafias, podemos salvar innumerables vidas."
 TUR_awareness_campaigns: "Programas en Escuelas"
 TUR_awareness_campaigns_desc: "Es imperativo que comencemos el sentimiento Anti-Mafia a una edad temprana, y podemos lograrlo comenzando programas en las escuelas."
 TUR_tighten_police_training: "Mejorar el Entrenamiento Policial"
 TUR_tighten_police_training_desc: "Nuestra fuerza policial puede ser poco profesional a veces, y por eso vamos a necesitar mejorar su entrenamiento."
 TUR_install_cctv: "Nuevas CCTV"
 TUR_install_cctv_desc: "Lamentablemente, parece que la vigilancia va a ser la única manera de atrapar a los criminales en el acto. A pesar de algunas reacciones, no tenemos otra opción que hacer esto."
 TUR_tighten_border_patrol: "Aumentar la Patrulla Fronteriza"
 TUR_tighten_border_patrol_desc: "Criminals are bringing in drugs and illegal goods from the outside, and this is a clear indicator that our border patrol is not effective. We are going to increase border patrol to mitigate the flow of illegal goods from other borders."
 TUR_assistance_to_iraq: "Asistencia a Irak"
 TUR_assistance_to_iraq_desc: "Irak actualmente se está ahogando en el crimen, y gran parte de él está relacionado con las drogas. Podemos proporcionar nuestra experiencia para ayudarlos a controlar su problema con las drogas."
 TUR_only_getting_started: "Solo Estamos Comenzando"
 TUR_only_getting_started_desc: "We are only getting started. Now that the government has been overrun by our organizations, we can start shaping the region, and ultimately the world to better fit our agenda, the Mafia's Agenda."
 TUR_contact_italian_mafia: "Contactar a la Mafia Italiana"
 TUR_contact_italian_mafia_desc: "La Mafia Italiana ha estado descontrolada en Italia, y el gobierno no ha sido muy efectivo para contenerlos. Podemos ofrecer apoyo y asistencia para fortalecer su posición."
 TUR_utilize_gray_wolves: "Aliar a los Lobos Grises"
 TUR_utilize_gray_wolves_desc: "Los Lobos Grises nos han ayudado en el pasado, y por esa razón podemos aliarlos ahora y traerlos para que nos ayuden a gobernar el país."
 TUR_start_global_campaign: "La Campaña Global"
 TUR_start_global_campaign_desc: "Our job is not done yet, we need to go international. The Mafia's reach is going to be unlimited, and we will benefit from the chaos."
 TUR_defund_police: "Reducir Fondos a la Policía"
 TUR_defund_police_desc: "The Police are quite disloyal to us, and for that reason, we need to curb their ability to fight against us. We will do this by defunding them, and seizing their weapons for ourselves."
 TUR_invite_landowners: "Invitar a los Terratenientes"
 TUR_invite_landowners_desc: "Los terratenientes son una élite adinerada, y en lugar de ser enemigos con ellos, deberíamos aliarnos. Podemos ganar su apoyo y ganar más dinero siendo amigos con ellos."
 TUR_take_out_iran: "Tomar Irán"
 TUR_take_out_iran_desc: "Si eliminamos a Irán, tendremos acceso a muchos más países. Invadiremos Irán y lo usaremos como un centro para exportar nuestra influencia más lejos en Asia."
 TUR_central_asia: "Hacia Asia Central"
 TUR_central_asia_desc: "El mercado de Asia Central está maduro para los bienes de la Mafia. Abrir estos mercados y usarlos para obtener ganancias."
 TUR_the_armed_forces_of_turkiye: "Fuerzas Armadas de Turquía"
 TUR_the_armed_forces_of_turkiye_desc: "The Armed Forces of Turkey, or otherwise known as the TSK, are tasked with protecting Turkey's territorial integrity and its people."
 TUR_ground_force: "Las Fuerzas Terrestres"
 TUR_ground_force_desc: "The Land forces are the men who have boots on the ground, fighting the wars within a nation's borders. The ground forces mainly consist of Infantry and Mechanized units."
 TUR_battery_bases: "Baterías TEL"
 TUR_battery_bases_desc: "Nuestro arsenal de baterías TEL está comenzando a envejecer, y las fallas no son poco comunes. Vamos a tener que construir nuevas para asegurarnos de tener un sistema de lanzamiento flexible."
 TUR_fortify_east: "Fortificar el Este"
 TUR_fortify_east_desc: "El Este de nuestro país ha visto la mayor parte de los problemas. Desde la resistencia interna hasta las invasiones de ejércitos enemigos, sería una decisión tonta no fortificar el Este."
 TUR_fortify_west: "Fortificar el Oeste"
 TUR_fortify_west_desc: "Although the West of our country is more secure than the East, we can never be certain. Rising tensions with our neighbors have made the matter tricky, and for that reason we cannot take any risks."
 TUR_silos: "Nuevos Silos"
 TUR_silos_desc: "Actualmente no tenemos ningún Silo de Misiles, y si esperamos ser una gran potencia, vamos a necesitar construir algunos. La construcción comenzará de inmediato, y le haremos saber al mundo para que nuestros enemigos se mantengan alejados."
 TUR_sam_sites: "Asegurar los Cielos"
 TUR_sam_sites_desc: "SAM Sites will be crucial to close down our airspace if needed. Due to the nature of modern jets, we cannot always rely on our own aircraft to shoot them down, we will need Sam Sites, and a good amount of them."
 TUR_abm_bases: "Bases ABM"
 TUR_abm_bases_desc: "Since we were capable of getting Missile Silos and the ability to launch missiles at a reasonable distance, we should also be wary of the other nations that have this same capability. We are going to have to build ABM bases to ensure we are able to shoot down enemy missiles in time."
 TUR_the_soldiers: "Los Soldados"
 TUR_the_soldiers_desc: "Nuestros soldados son lo que hace nuestro ejército. Vamos a tener que equiparlos con la tecnología más avanzada para que estén preparados en combate."
 TUR_tanks: "Nuevos Tanques"
 TUR_tanks_desc: "Toda Europa está modernizando sus reservas de Tanques, y Turquía debe hacer lo mismo. Obtendremos a nuestros mejores ingenieros para diseñar un tanque moderno que nuestra nación pueda usar durante años."
 TUR_afvs: "IFV"
 TUR_afvs_desc: "El combate terrestre está comenzando a cambiar hacia Vehículos de Infantería Blindados, como los IFV y los APC. Vamos a tener que adaptarnos y hacer lo mismo."
 TUR_troop_carriers: "Transportes de Tropas"
 TUR_troop_carriers_desc: "Nuestros soldados necesitan una manera de llegar al campo de batalla de manera segura y oportuna. Los APC son la mejor pieza de equipo que podemos producir para lograr esto."
 TUR_mandatory_draft_woman: "Mujeres como Soldados"
 TUR_mandatory_draft_woman_desc: "Sin importar el género, todos deben servir en nuestras fuerzas armadas. Las mujeres representan la mitad de nuestra sociedad, entonces ¿por qué deberíamos excluirlas de las leyes de conscripción?"
 TUR_other_use_woman: "Women in the Research Sector"
 TUR_other_use_woman_desc: "Necesitamos apoyo adicional cuando se trata de investigar, y nuestras mujeres no están activamente sirviendo en las fuerzas armadas, así que es mejor que las eduquemos y las hagamos crear tecnología de última generación para nuestras tropas."
 TUR_new_artillery: "Modernizar las Reservas de Artillería"
 TUR_new_artillery_desc: "Our Artillery Stockpiles are starting to fall apart. This cannot continue, as artillery has consistently proved itself throughout history to be a way for armies to stage attacks before they even start!"
 TUR_the_airforce: "The Turkish Air Force"
 TUR_the_airforce_desc: "The Turkish Air Force is the aerial branch of the Turkish Armed Forces, and they are mainly tasked with maintaining Turkish Air Superiority in times of combat, whilst also maintaining Turkey's aerial integrity."
 TUR_expand_jet_program: "Programa de Jets Nacionales"
 TUR_expand_jet_program_desc: "Jets are now the key player when it comes to aerial combat. We will need to try and start researching ways to create domestic aircraft so that we can drop our reliance on others."
 TUR_air_superiority: "Cazas de Superioridad Aérea"
 TUR_air_superiority_desc: "If we don't have air superiority, then we don't have anything. Developing air superiority fighters should be a very high priority as we are able to guarantee our close air support's safety."
 TUR_cas: "Apoyo Aéreo Cercano"
 TUR_cas_desc: "En el combate moderno, no es tan inusual que las fuerzas terrestres llamen al apoyo aéreo para ayudar a luchar contra el enemigo. Por esa razón, Turquía va a necesitar desarrollar alguna nueva tecnología CAS para producción nacional."
 TUR_open_drone_research: "Drones y Helicópteros"
 TUR_open_drone_research_desc: "A menudo eclipsados por otras aeronaves, los drones y helicópteros pueden ser cruciales en combate, especialmente para las tropas en tierra."
 TUR_new_helicopters: "Nuevos Helicópteros"
 TUR_new_helicopters_desc: "Los helicópteros pueden ayudar a transportar soldados y otros hombres dentro y fuera del campo de batalla rápidamente cuando sea necesario, y sería un error de nuestra parte pasar por alto tal necesidad."
 TUR_baryaktars: "Bayraktars"
 TUR_baryaktars_desc: "We will have to develop a domestic drone that is capable of taking out enemy targets from a pretty good distance. The Bayraktar will do just that!"
 TUR_purchase_from_others: "Mirar al Mercado"
 TUR_purchase_from_others_desc: "No podemos poner demasiado estrés en nuestra economía para desarrollar aeronaves nacionales, así que también deberíamos considerar comprar algunas del Este y del Oeste."
 TUR_british_jets: "Cazas de Superioridad Británicos"
 TUR_british_jets_desc: "The British Air Force has been around for some time, and their aircraft have aged quite well. It would be a wise decision to buy some aircraft from them."
 TUR_american_jets: "Multi-Roles Americanos"
 TUR_american_jets_desc: "America is the global super power, and currently boasts the best air force. This pretty much means that it is in our best interest to buy some Multi-Role Aircraft from them."
 TUR_russian_jets: "Cazas de Ataque Rusos"
 TUR_russian_jets_desc: "Los rusos son expertos cuando se trata de cazas de ataque, y están dispuestos a vendernos algunas unidades... a un costo."
 TUR_chinese_jets: "Bombarderos Chinos"
 TUR_chinese_jets_desc: "Currently we are lacking bomber aircraft in our air force, but the Chinese are not. We can buy a couple of units from them so that we don't fall behind."
 TUR_the_navy: "La Armada Turca"
 TUR_the_navy_desc: "La Armada Turca es la rama marítima de las Fuerzas Armadas Turcas, y su fundación data de 1081."
 TUR_upgrade_bosphorus_fleet: "Mejoras a la Flota del Bósforo"
 TUR_upgrade_bosphorus_fleet_desc: "La flota del Bósforo consiste principalmente en fragatas y corbetas obsoletas, lo que significa que podrían ser fácilmente eliminadas por barcos más grandes y avanzados durante tiempos de guerra."
 TUR_frigate_upgrades: "Mejoras a las Fragatas"
 TUR_frigate_upgrades_desc: "A pesar de tener una gran cantidad de fragatas, no son muy avanzadas. Vamos a tener que mejorar algunas de ellas para asegurarnos de que puedan resistir en batalla."
 TUR_fortify_istanbul: "Fortificar Estambul"
 TUR_fortify_istanbul_desc: "Istanbul is constantly at risk of bombardment and attack due to its close proximity to the Bosphorus. If an enemy fleet tries to pass through, Istanbul will be the closest major city for them to attack and destroy."
 TUR_new_corvettes: "Nuevas Corbetas"
 TUR_new_corvettes_desc: "No tenemos muchas corbetas, y por eso podemos investigar y crear nuevos modelos sin tener que preocuparnos demasiado por mejorar nuestra flota más antigua."
 TUR_bosphorus_taxation: "Ejercicios con los Marines"
 TUR_bosphorus_taxation_desc: "Necesitamos realizar ejercicios con los marines turcos para estar preparados ante una invasión naval en cualquier momento."
 TUR_mediteranean_fleet: "Mediterranean Fleet"
 TUR_mediteranean_fleet_desc: "Our Mediterranean fleet is of a very high priority, as it is the fleet that ensures our nation an access to the outside without having to interfere with the Aegean."
 TUR_new_submarine: "Nuevos Submarinos"
 TUR_new_submarine_desc: "Necesitamos submarinos para poder sorprender a los barcos enemigos desde abajo."
 TUR_new_cruisers: "Nuevos Cruceros"
 TUR_new_cruisers_desc: "Cruisers are arguably some of the most important ships we could have deployed, as they are typically the largest ship in a fleet besides an aircraft carrier."
 TUR_new_heli_pads: "Portaaviones"
 TUR_new_heli_pads_desc: "Las grandes potencias están comenzando a construir nuevos portaaviones para afirmar su dominio en el escenario mundial. Debemos hacer lo mismo y comenzar a construir nuestros propios portaaviones!"
 TUR_tcg_anadolu_plans: "Desplegar la Fragata Estambul"
 TUR_tcg_anadolu_plans_desc: "Hemos estado construyendo una fragata de última generación llamada TCG Estambul, y está lista para ser desplegada!"
 TUR_navy_regulations: "Endurecer las Regulaciones de la Armada"
 TUR_navy_regulations_desc: "La calidad debe valorarse sobre la cantidad, y por esa razón vamos a tener que aumentar las regulaciones cuando se trata de producir nuevos barcos para nuestra armada."
 TUR_tsk_coup: "TSK en Política"
 TUR_tsk_coup_desc: "Our people are in grave danger of being overrun by Islamist ideology and their dangerous political views. The TSK is the only viable group that can be trusted with protecting the Turkish Republic's ideals."
 TUR_crush_kurdish_resistance: "Aplastar la Resistencia Kurda"
 TUR_crush_kurdish_resistance_desc: "Usando tácticas efectivas, aplastaremos la resistencia kurda hasta el punto en que les será difícil recuperarse."
 TUR_crush_radicalism: "Aplastar el Radicalismo"
 TUR_crush_radicalism_desc: "El radicalismo será la ruina de esta nación, y por esa razón, debemos aplastarlo de inmediato."
 TUR_upgrading_mili_infrastructure: "Mejorar las Industrias Militares"
 TUR_upgrading_mili_infrastructure_desc: "Nuestras industrias militares han estado bastante rezagadas en tiempos recientes, y si queremos desplegar equipos adecuados, vamos a tener que mejorarlas un poco."
 TUR_subdue_kurdish_independence: "Operación en el Este"
 TUR_subdue_kurdish_independence_desc: "Los armenios y georgianos ya están en la OTSC o son miembros potenciales de la OTSC. Vamos a tener que llevar a cabo operaciones para evitar que se unan a esa organización."
 TUR_root_out_ulama: "Erradicar a la Ulama"
 TUR_root_out_ulama_desc: "The Ulama do not wish to see a secular and non-islamist Turkey, and they most likely pray for our downfall. We will purge their positions in office if they have any, and we will replace them with maritime conglomerates."
 TUR_ban_islamist_parties: "Prohibir a los Islamistas de la Política"
 TUR_ban_islamist_parties_desc: "Un problema que las administraciones anteriores no lograron abordar fue el aumento de islamistas en nuestra política. Vamos a tener que prohibirlos a todos de inmediato de participar en las elecciones, para que nuestra nación esté a salvo de ideologías peligrosas."
 TUR_military_conglomorates: "Conglomerados Militares"
 TUR_military_conglomorates_desc: "Debido al aumento del TSK en la política turca, muchas empresas militares han estado presionando por una mayor representación en nuestro gobierno. Podríamos fácilmente concederles esto, pero a costa de alienar a nuestros conglomerados industriales."
 TUR_train_foreign_troops: "Entrenar Tropas Extranjeras"
 TUR_train_foreign_troops_desc: "Our armed forces has the capability to train other nations' armies without a problem. Doing it will give us influence, and experience."
 TUR_secularist_dominance: "Dominio Secularista"
 TUR_secularist_dominance_desc: "Secularism will dominate our politics, just like it historically should have. Our nation will follow the path it was always intended to."
 TUR_reform_mit: "Reformar el MIT"
 TUR_reform_mit_desc: "MIT is our nation's intelligence agency, and it needs reforming to better fit the agenda of our Armed Forces."
 TUR_new_airbases: "Nuevas Regulaciones Aéreas"
 TUR_new_airbases_desc: "Passing new regulations for our air force will certainly ensure that our pilots have proper training, and that they use the right strategies during combat."
 TUR_cooperate_mit: "Utilizar el MIT"
 TUR_cooperate_mit_desc: "Utilizar los activos y agentes que tenemos trabajando en el MIT podría ser útil para nuestras fuerzas armadas para recopilar información y datos."
 TUR_military_dominance: "Hegemonía Militar"
 TUR_military_dominance_desc: "The new laws, changes, and overhauls to the system have ensured that the Military will have hegemony and control over all aspects of Turkish Politics."
 TUR_our_society: "Sociedad Turca"
 TUR_our_society_desc: "Turkish Society is constantly changing and evolving into something new. Though the government's role is typically limited when it comes to this due to certain restraints, there have been times where we needed to intervene and there will be times where we will have to intervene to make changes to our policies."
 TUR_mit: "El MIT"
 TUR_mit_desc: "MIT is our nation's intelligence agency tasked with protecting the government and policies of the nation from internal and external threats."
 TUR_domestic_focus: "Enfoque Nacional"
 TUR_domestic_focus_desc: "El MIT debería centrarse en proteger a la nación de amenazas internas, como actores malintencionados que desean derrocar al gobierno difundiendo ideales peligrosos."
 TUR_foreign_focus: "Enfoque Externo"
 TUR_foreign_focus_desc: "El MIT debería preocuparse por las amenazas del exterior de nuestras fronteras, ya que las personas nunca desearán causar daño a su propia nación."
 TUR_disaster_relief: "Plan de Desastres"
 TUR_disaster_relief_desc: "Actualmente no tenemos un plan de desastres, lo que significa que no estamos preparados para proteger y ayudar a nuestros ciudadanos."
 TUR_charity_based: "Establecer un Sistema Liderado por Caridades"
 TUR_charity_based_desc: "Las caridades cubrirán a nuestra gente cuando ocurra un desastre, por lo que podemos reducir el gasto considerablemente."
 TUR_government_reliant: "Establecer un Sistema Liderado por el Gobierno"
 TUR_government_reliant_desc: "Es el trabajo del gobierno acudir en ayuda de su pueblo cuando ocurre un desastre, incluso si eso significa aumentar nuestro gasto."
 TUR_migration_problems: "Problemas de Migración"
 TUR_migration_problems_desc: "Siempre hemos tenido problemas con un flujo de migrantes que ingresan a la nación... Pero nunca supimos qué hacer con ellos después de que sus problemas terminaran en su nación de origen."
 TUR_open_door_policy: "Política de Puertas Abiertas"
 TUR_open_door_policy_desc: "Al optar por usar una política de puertas abiertas, podemos utilizar fácilmente a los migrantes entrantes para mejorar nuestra nación y desarrollarla."
 TUR_closed_borders: "Cerrar las Fronteras"
 TUR_closed_borders_desc: "Podemos deshacernos por completo de los migrantes que ingresan a la nación simplemente cerrando nuestras fronteras, cerrando así nuestros problemas."
 TUR_drug_problem: "El Problema de las Drogas"
 TUR_drug_problem_desc: "A veces, las drogas son necesarias para uso médico, pero eso no impide que ciertos individuos abusen del sistema y las usen con fines recreativos con resultados peligrosos."
 TUR_tighten_punishments: "Postura Más Dura"
 TUR_tighten_punishments_desc: "Vamos a criminalizar a cualquiera que use drogas para algo que no sea uso médico, sin importar cuál sea su excusa."
 TUR_relax_restrictions: "Suavizar Nuestra Postura"
 TUR_relax_restrictions_desc: "Incluso si nuestra gente desea usar drogas con fines recreativos, ¿por qué deberíamos importarnos? Quizás deberíamos dejar que hagan lo que quieran, aunque haya algunos riesgos."
 TUR_rising_nationalism: "Auge del Nacionalismo"
 TUR_rising_nationalism_desc: "A pesar de que el nacionalismo es algo bueno, demasiado de él puede ser malo. El nacionalismo dentro de la nación ha causado problemas y peleas entre grupos minoritarios."
 TUR_utilize_it: "Utilizar el Nacionalismo"
 TUR_utilize_it_desc: "We will utilize nationalism to our advantage, this way the enemy will know that the Turkish people won't sit back idly by in times of war."
 TUR_combat_it: "Combatirlo"
 TUR_combat_it_desc: "Vamos a tener que combatir el nacionalismo, ya que no podemos arriesgarnos a una mayor inestabilidad dentro de las fronteras de nuestra nación."
 TUR_turkish_medias: "Los Medios"
 TUR_turkish_medias_desc: "Nuestros medios están creciendo bastante, y debido al uso cada vez mayor de la tecnología en la nación, los medios pueden tener un efecto bastante grande en nuestras políticas y la popularidad de los partidos."
 TUR_deal_with_journalists: "Los Periodistas"
 TUR_deal_with_journalists_desc: "Por supuesto, los periodistas son la fuerza motriz detrás de todos los medios. Son ellos los que dan sus opiniones, pero sus opiniones a veces pueden ser más perjudiciales que beneficiosas."
 TUR_passive_aggressive_approach: "Enfoque Pasivo-Agresivo"
 TUR_passive_aggressive_approach_desc: "Hola, Sr. Periodista... No me gustó mucho lo que dijo sobre mi cabello anoche, ¿cree que podría cambiar un poco el redactado...? Por supuesto, no haré nada para obligarlo, pero mis seguidores... bueno, a veces pueden ponerse un poco alborotados."
 TUR_no_restrictions: "Sin Restricciones"
 TUR_no_restrictions_desc: "En una democracia funcional, todos tienen derecho a decir lo que quieran. Los periodistas no serán diferentes en este asunto."
 TUR_close_kurdish_medias: "Cerrar Medios Kurdos"
 TUR_close_kurdish_medias_desc: "By closing Kurdish Medias, we will be able to restrict the strength of the PKK and therefore consolidate our control over what information is spread. Though, they may get a little upset."
 TUR_sponsor_kurdish_medias: "Permitir Medios Kurdos"
 TUR_sponsor_kurdish_medias_desc: "Al mostrar a los kurdos que podemos coexistir pacíficamente, suavizarán su postura y serán menos agresivos hacia nuestro gobierno."
 TUR_combat_cybercrime: "Ciberespacio Turco"
 TUR_combat_cybercrime_desc: "Debemos investigar qué sucede dentro del ciberespacio turco, ya que algunos individuos pueden usarlo para delitos y actividades ilegales."
 TUR_heavy_fines: "Ciberespacio Sin Supervisión"
 TUR_heavy_fines_desc: "Internet tiene bastantes supervisores y personas que moderan lo que sucede allí. Entonces, ¿por qué deberíamos desperdiciar recursos policiales en ello cuando podríamos usarlos claramente en cosas mejores?"
 TUR_heavy_sentences: "Ciberespacio Supervisado"
 TUR_heavy_sentences_desc: "We cannot risk leaving the internet unsupervised, because criminals could possibly use it as a loophole to commit crimes without us knowing!"
 TUR_kurdish_problems: "Problemas Kurdos"
 TUR_kurdish_problems_desc: "We are having quite the struggle against the PKK in the East of our country, who are fighting for an independent Kurdistan, away from Turkish control. This cannot happen, as it would completely destroy our territorial integrity."
 TUR_mediation: "Mediación"
 TUR_mediation_desc: "A veces, la violencia no es la respuesta. La mediación será la mejor manera de abordar al PKK y hacer que coexistan pacíficamente con nosotros."
 TUR_relax_security_laws: "Relajar las Leyes de Seguridad en el Este"
 TUR_relax_security_laws_desc: "Necesitamos relajar las leyes de seguridad en las provincias kurdas como una forma de mostrarles que no somos hostiles. De esta manera, también relajarán su agresión hacia nosotros."
 TUR_withdraw_all_troops: "Restringir el Movimiento de Tropas"
 TUR_withdraw_all_troops_desc: "Al restringir el movimiento de tropas, mostraremos al PKK que no vamos a luchar más contra ellos."
 TUR_open_dialogue_pkk: "Establecer Diálogo"
 TUR_open_dialogue_pkk_desc: "Al establecer un diálogo, podemos llegar a un acuerdo que sea de interés tanto para Turquía como para el PKK."
 TUR_track_two_diplomacy: "Diplomacia de Dos Vías"
 TUR_track_two_diplomacy_desc: "Al conseguir figuras populares para que sean representantes de nuestra causa, quizás podamos influir en sus opiniones sobre nuestro trato."
 TUR_direct_talks: "Conversaciones Directas"
 TUR_direct_talks_desc: "There is no need to play a game of hide and seek when we are trying to negotiate some serious terms. We will hold direct talks with our representatives, and theirs."
 TUR_third_party_mediators: "Mediadores de Terceros"
 TUR_third_party_mediators_desc: "Debido a la desconfianza entre nuestro gobierno y el PKK, es mejor que traigamos a terceros para ayudarnos a mediar el conflicto."
 TUR_peshmerga_stance: "Invitar a los Peshmerga"
 TUR_peshmerga_stance_desc: "Quizás podamos invitar a los Peshmerga a estabilizar las relaciones para cuando el PKK se convierta en parte de la región."
 TUR_pkk_peshmerga_talks: "Buscar Conversaciones"
 TUR_pkk_peshmerga_talks_desc: "By pursuing talks with the Peshmerga, the PKK and the Peshmerga can co-exist peacefully without having much conflict over border disputes."
 TUR_maintain_animosity: "Mantener la Animadversión"
 TUR_maintain_animosity_desc: "Al mantener la animadversión, podemos lidiar fácilmente con las disputas fronterizas, ya que tenemos una causa justificable para atacar."
 TUR_relax_policing_laws: "Relajar las Leyes Policiales"
 TUR_relax_policing_laws_desc: "Debido a nuestros recientes avances en la diplomacia con el PKK, podemos relajar las leyes policiales en toda la nación, reduciendo así el gasto considerablemente."
 TUR_federalize_turkish_kurdistan: "Federalización de Diyarbakir"
 TUR_federalize_turkish_kurdistan_desc: "Federalizaremos la provincia de Kurdistán en nuestro país, ya que será lo mejor para nuestros intereses y los del PKK. Mantendremos algún nivel de control sobre ellos y la región, pero también ganarán algún nivel de autonomía."
 TUR_the_endless_war: "Una Guerra Interminable"
 TUR_the_endless_war_desc: "The war with the PKK cannot be solved diplomatically as our many disagreements have proven time and time again. We will double our efforts of forcefully fighting the PKK and re-asserting Turkish hegemony."
 TUR_form_eastern_security_corp: "Eastern Security Corps"
 TUR_form_eastern_security_corp_desc: "Se entrenarán y armarán nuevas unidades con el propósito especial de defender las partes peligrosas del este de nuestra nación."
 TUR_redouble_army_training: "Redoblar el Entrenamiento del Ejército"
 TUR_redouble_army_training_desc: "Nuestros ejércitos necesitan entrenamiento, y lo necesitan ahora más que nunca. Dado que estamos intensificando nuestra lucha contra el PKK, sería una tontería llevar tropas con poco entrenamiento al combate."
 TUR_international_campaign: "¿Asistencia Extranjera?"
 TUR_international_campaign_desc: "Es posible que debamos considerar la asistencia extranjera para eliminar al PKK. Pero si lo hacemos, corremos el riesgo de abrir las puertas a la influencia extranjera en nuestra nación."
 TUR_call_on_iranian_help: "Llamar a la Ayuda Iraní"
 TUR_call_on_iranian_help_desc: "The Iranians have fought several wars to curb Kurdish independence, and by now they know every single move and tactic used by the rebels. We could perhaps contact them and see if they are willing to support us in fighting the Kurds."
 TUR_self_sufficiency: "No Confiar en Nadie"
 TUR_self_sufficiency_desc: "No podemos confiar en nadie para que nos ayude a luchar contra nuestros problemas. Vamos a tener que hacerlo nosotros mismos y solos. Obtener ayuda no siempre es la respuesta."
 TUR_call_on_american_help: "Llamar a la Ayuda Americana"
 TUR_call_on_american_help_desc: "The Americans may be willing to lend us some support, but it will most likely not last very long due to their complex political system and divide in whether to intervene or not. But let's hope whatever support they give does make a difference."
 TUR_criminalize_pkk: "Criminalización Internacional del PKK"
 TUR_criminalize_pkk_desc: "El PKK ha sido criminalizado en nuestro país durante algún tiempo, pero han encontrado refugios seguros en otros países donde no están criminalizados, dándoles tiempo para planificar y coordinar ataques. Vamos a tener que embarcarnos en una misión para que sean criminalizados en todos los países, no solo en el nuestro."
 TUR_focus_east_anatolia: "Operación en Diyarbakir"
 TUR_focus_east_anatolia_desc: "Diyarbakir, uno de los focos de actividad del PKK, está empezando a perturbar la vida cotidiana en las provincias cercanas. Vamos a lanzar una operación para expulsar al PKK de la provincia de una vez por todas."
 TUR_focus_van: "Operación en Van"
 TUR_focus_van_desc: "Van, uno de los focos de actividad del PKK, está empezando a perturbar la vida cotidiana en las provincias cercanas. Vamos a lanzar una operación para expulsar al PKK de la provincia de una vez por todas."
 TUR_hightened_security: "Intensificar la Seguridad"
 TUR_hightened_security_desc: "Vamos a intensificar la presencia de seguridad en el país para que podamos seguir luchando contra el PKK y frustrar sus planes de destruir nuestra nación."
 TUR_the_fight_goes_on: "La Lucha Continúa"
 TUR_the_fight_goes_on_desc: "The fight goes on, and it will go on, and it has for many decades now. Though we cannot fully get rid of the PKK without capturing all their soldiers, we can subdue them for some time to come."
 TUR_forward_with_social_democracy: "Adelante con la Democracia Social"
 TUR_forward_with_social_democracy_desc: "El futuro de Turquía estará dictado por la democracia social y los valores occidentales."
 TUR_approach_the_eu: "Acercarse a la UE"
 TUR_approach_the_eu_desc: "Un largo proceso de occidentalización ha acercado lentamente a Turquía a la Unión Europea. Deberíamos continuar con la política de integración con la UE y eventualmente convertirnos en un miembro completo"
 TUR_kemalist_social_democracy: "Democracia Social Kemalista"
 TUR_kemalist_social_democracy_desc: "The §Y[socialism_L]§! represents the idea of 'Democratic Left', a term coined by Ecevit to link leftist values with national-cultural heritage. In other words, Kemalism mixed with democratic socialism to fit the situation of contemporary Turkey. Our party can attract both leftist and Kemalist voters"
 TUR_repair_relations_with_left: "Reparar Relaciones con la Izquierda"
 TUR_repair_relations_with_left_desc: "Los izquierdistas y socialistas en Turquía han sido demonizados durante décadas por atreverse a apoyar a los kurdos. Las personas deben ser libres de expresar sus opiniones independientemente de su ideología. Necesitamos trabajar para abrir el campo político a más partidos"
 TUR_disarmament_program: "Programa de Desarme"
 TUR_disarmament_program_desc: "Nuestra turbulenta historia muestra que hemos dado demasiado poder al ejército. Necesitamos reducir nuestro gasto militar y enfocarnos más en nuestros propios asuntos"
 TUR_improve_workers_rights: "Mejorar los Derechos de los Trabajadores"
 TUR_improve_workers_rights_desc: "Las leyes laborales de Turquía necesitan ser reelaboradas. Necesitamos dar a los empleados del gobierno el derecho a negociar colectivamente su entorno de trabajo. Además, cualquier trabajador del gobierno que sienta que ha sido tratado injustamente en relación con sus colegas podrá ir a la corte contra el estado"
 TUR_protect_the_unions: "Proteger los Sindicatos"
 TUR_protect_the_unions_desc: "We need to remove the current restrictions on politically motivated strikes and the liability of labour unions in relations to any damages caused by workers being on a strike. We also need to give the ESK (Economic and Social Council), the board of representatives of unions, associations and confederations, constitutional protection"
 TUR_appease_conglomerate: "Aplacar a los Conglomerados"
 TUR_appease_conglomerate_desc: "The industrial conglomerates are the backbone of this nation, and if we can gain their trust, then we will easily be able to gain the workers' trust"
 TUR_banking_reform: "Reforma Bancaria"
 TUR_banking_reform_desc: "El sector bancario de Turquía necesita urgentemente una reforma. La corrupción es rampante y los bancos son una de las principales razones de la última recesión"
 TUR_invest_in_iett: "Invertir en IETT"
 TUR_invest_in_iett_desc: "Istanbul Elektrik Tramvay ve Tünel es una empresa de transporte que opera en el área de Estambul. Algunos de nuestros miembros del partido tienen conexiones con la empresa y debemos trabajar juntos con ellos para mejorar la red de transporte de Estambul"
 TUR_legacy_of_ecevits: "Legado de Ecevits"
 TUR_legacy_of_ecevits_desc: "Bülent Ecevit y su esposa Rahsan han sido instrumentales en la creación de un movimiento socialdemócrata en Turquía. Su legado debe ser honrado"
 TUR_increase_central_bank_autonomy: "Aumentar la Autonomía del Banco Central"
 TUR_increase_central_bank_autonomy_desc: "By increasing the autonomy of the central bank, we are able to let the economy flow without the interference of politicians"
 TUR_harsh_stance_pkk: "Postura Dura contra el PKK"
 TUR_harsh_stance_pkk_desc: "El PKK no hace más que causar problemas, vamos a tener que tomar una postura más dura en el asunto"
 TUR_abolition_of_death_penalty: "Abolir la Pena de Muerte"
 TUR_abolition_of_death_penalty_desc: "La pena de muerte está retrasando a nuestra nación, nos impide convertirnos en un país moderno y estable. Somos una democracia y debemos mantener sus valores y los derechos humanos"
 TUR_subsidise_military: "Subvencionar al Ejército"
 TUR_subsidise_military_desc: "El ejército nos ayudó a conquistar Chipre y, para mantener la influencia griega fuera de Chipre, necesitamos confiar en nuestro ejército para hacer lo correcto"
 TUR_ataturks_heirs: "Herederos de Atatürk"
 TUR_ataturks_heirs_desc: "§Y[conservatism_L]§! is the party founded by Atatürk himself. It is our destiny to modernize Turkey and make it a real European country"
 TUR_national_chief: "Legado del Jefe Nacional"
 TUR_national_chief_desc: "Ismet Inönü, the latest §Y[conservatism_L]§! president received the title 'National Chief'. This title fits Deniz Baykal very well too"
 TUR_unban_head_scarves: "Levantar la Prohibición de los Pañuelos"
 TUR_unban_head_scarves_desc: "Para atraer a más votantes conservadores, deberíamos levantar la prohibición de los pañuelos. Después de todo, parte de los ideales occidentales es la libertad religiosa"
 TUR_maintain_hijab_ban: "Maintain Headscarf Ban"
 TUR_maintain_hijab_ban_desc: "There is absolutely no reason to change our laws pertaining to the Hijab. It does not matter if the conservatives are outraged or upset, what matters is the preservation of the Turkish Republic, and its secular ideals"
 TUR_reform_village_institutes: "Recreate Village Institutes"
 TUR_reform_village_institutes_desc: "In the 1940s, the ruling §Y[conservatism_L]§! government founded village institutes, which were intended to improve education in rural areas by picking out good students and educating them as teachers. Many of the skills taught in the institutes were highly practical, and many of them operated farms and workshops. We should bring these institutes back to make sure even the poorest of areas can educate themselves"
 TUR_expand_shipping_industry: "Apoyar la Industria Pesquera"
 TUR_expand_shipping_industry_desc: "Apoyar la industria pesquera ayudará a la gente rural y sus pequeños negocios, lo que a su vez ayudará a la nación a largo plazo"
 TUR_deradicalisation_program: "Programa de Desradicalización"
 TUR_deradicalisation_program_desc: "Deniz Baykal es un firme opositor del terrorismo. Aunque toleramos a los miembros más conservadores de la población, los elementos extremistas deben ser erradicados"
 TUR_increase_education_spending: "Mejorar la Educación"
 TUR_increase_education_spending_desc: "As an associate professor, Deniz Baykal knows the importance of education. After all, he made it into politics after writing a thesis on the election loss of §Y[conservatism_L]§! in 1965"
 TUR_increase_funds_to_resources: "Subvencionar el Ministerio de Energía y Recursos"
 TUR_increase_funds_to_resources_desc: "La nación turca necesita más recursos. Deberíamos subvencionar el Ministerio de Energía y Recursos para que puedan encontrar métodos para disminuir la dependencia de Turquía de recursos extranjeros"
 TUR_chp_move_right: "Moverse hacia la Derecha"
 TUR_chp_move_right_desc: "For years Deniz Baykal has moved the §Y[conservatism_L]§! more and more right on the political spectrum taking more conservative and Islamist policies. Many of the old supporters have left the party because of this, as many feel it doesn't match the original intentions of the party. We don't need those people. Turkey has changed, and it has no room for leftist politics"
 TUR_chp_move_left: "Moverse hacia la Izquierda"
 TUR_chp_move_left_desc: "For years Deniz Baykal has moved the §Y[conservatism_L]§! more and more right on the political spectrum taking more conservative and Islamist policies. Many of the old supporters have left the party because of this, as many feel it doesn't match the original intentions of the party. We need to reverse this course, and return back to our roots"
 TUR_increase_social_security_spending: "Aumentar la Seguridad Social"
 TUR_increase_social_security_spending_desc: "La Organización de Seguridad Social podría beneficiarse de algo de financiamiento adicional"
 TUR_invest_in_is_bank: "Invertir en İşbank"
 TUR_invest_in_is_bank_desc: "İşbank es el banco comercial más grande de Turquía con sucursales en múltiples países. El estado debería comprar algunas de sus acciones para mayor seguridad financiera"
 TUR_curtail_corruption: "Reducir la Corrupción"
 TUR_curtail_corruption_desc: "La corrupción es una de las mayores debilidades del estado turco. Muchos políticos utilizan el sistema político para su beneficio personal y no debemos tener miedo de denunciarlos cuando veamos comportamientos corruptos"
 TUR_remove_article_158: "Eliminar el Artículo 158"
 TUR_remove_article_158_desc: "El Artículo 158 convierte en delito penal insultar al Presidente de Turquía. Este artículo se ha utilizado para silenciar a críticos y satíricos, y hace que el Presidente sea prácticamente intocable. El artículo debe ser eliminado ya que tal cosa no es adecuada en una democracia"
 TUR_deport_refugees: "Deportar Refugiados"
 TUR_deport_refugees_desc: "A large number of refugees are a strain on the citizens and the economy. We need to send these people back to their homes. After all, every person wants to live in their place of birth"
 TUR_religious_tolerance: "Predicar la Tolerancia Religiosa"
 TUR_religious_tolerance_desc: "Turquía es el hogar de muchas minorías religiosas y muchos políticos provienen de estas minorías. Necesitamos aumentar la calidad de vida de estas personas"
 TUR_approach_grey_wolves: "Acercarse a los Lobos Grises"
 TUR_approach_grey_wolves_desc: "The Grey Wolves are an ultra-nationalistic organization that draws much support from the more right wing-leaning population. If we tighten our ties to them, we will be able to gain some of those supporters"
 TUR_businessmans_turkey: "La Turquía del Hombre de Negocios"
 TUR_businessmans_turkey_desc: "Turquía ha estado demasiado tiempo constreñida por un gobierno corrupto. Es hora de llevar libertad, tanto económica como social, al pueblo turco"
 TUR_abolish_constitutional_court: "Abolish the Constitutional Court"
 TUR_abolish_constitutional_court_desc: "La Corte Constitucional es demasiado dependiente políticamente y su membresía puede ser influenciada fácilmente por el parlamento. En su lugar, fundaremos una Corte Suprema donde los miembros sean sugeridos por el Presidente, verificados por el Parlamento y luego sirvan en la Corte Suprema de por vida"
 TUR_privatization_drive: "Impulso de Privatización"
 TUR_privatization_drive_desc: "El estado no necesita participar en la seguridad social o la atención médica. Estos deben manejarse mejor a través de fundaciones y organizaciones privadas. Por supuesto, a las personas se les darán ligeros alivios fiscales por cualquier seguro comprado"
 TUR_security_reform: "Reforma de Seguridad"
 TUR_security_reform_desc: "Crime is rife in Turkey, and this needs to be stopped. The Gendarmerie will be reorganised as a rural police, and we will ensure that the salary level of all security personnel will be kept at a substantial level. The police will receive the latest technological innovations to help them in the field"
 TUR_military_reform: "Reforma Militar"
 TUR_military_reform_desc: "Necesitamos enfocarnos en tener una fuerza efectiva, pequeña y de alta tecnología. No hay necesidad de reclutar masivamente a personas en un ejército. Además, la industria militar debe ser privatizada y el estado no debe buscar la adquisición de más inversiones en la industria militar"
 TUR_stern_commitment_to_nato: "Compromiso Firme con la OTAN"
 TUR_stern_commitment_to_nato_desc: "La OTAN es lo único que puede asegurar un orden mundial liberal. Turquía debe apoyar firmemente a la OTAN y cualquier otra alianza similar para asegurar la paz mundial"
 TUR_reduce_government_oversight: "Reducir la Supervisión del Gobierno"
 TUR_reduce_government_oversight_desc: "The state should stop interfering with the economy completely. The job of the state is only to guarantee a free market. We do not need the massive army of bureaucrats we have now, but instead only the minimum possible should be utilized"
 TUR_tax_reform: "Reforma Fiscal"
 TUR_tax_reform_desc: "Los bancos y otras instituciones financieras deben estar exentos de todos los impuestos y ser operados como empresas privadas para promover el crecimiento. Además, todos los impuestos deben reducirse a alrededor del 10% para mejorar la vida de nuestros ciudadanos"
 TUR_liberalise_trade: "Liberalizar el Comercio"
 TUR_liberalise_trade_desc: "Las restricciones actuales sobre el comercio deben ser abolidas. Al eliminar todos los cargos aduaneros, no solo mejoraremos la situación comercial de Turquía, sino también la de nuestros vecinos. También necesitamos privatizar todos los puertos y muelles para utilizarlos de manera más eficiente"
 TUR_agricultural_reform: "Reforma Agrícola"
 TUR_agricultural_reform_desc: "Algunas de nuestras actividades agrícolas aún son bastante atrasadas. Necesitamos invertir en mecanización y proporcionar un incentivo fiscal tanto para los productores como para los compradores. También necesitamos incorporar tecnología en la agricultura para que los agricultores tengan datos en vivo sobre los precios de los bienes, permitiéndoles optimizar la producción y reducir el desperdicio y la sobreproducción agrícola"
 TUR_business_cities: "Ciudades de Negocios"
 TUR_business_cities_desc: "Cities are the economic hubs of the country. Cities are expensive, but that is only natural, as the bigger the possibilities, the bigger the cost. With this in mind, if you are too poor to live in a large city, you are to be relocated to an area with cheaper housing. To profit from the value of cities, we must also reform our real estate taxes, as in their current form they are very easy to circumvent"
 TUR_new_supply: "Nuevas Estaciones"
 TUR_new_supply_desc: "Dado que nuestras ciudades se están volviendo cada vez más interconectadas, necesitamos establecer nuevas estaciones desde las cuales las personas puedan embarcar y desembarcar"
 TUR_destroy_totalitarian_education: "Destruir la Educación Totalitaria"
 TUR_destroy_totalitarian_education_desc: "La educación centralizada no es más que un vestigio de tiempos autoritarios. La educación debe depender de organizaciones privadas con la libertad de elegir su currículo libremente. La educación solo debe ser obligatoria durante los primeros 8 años, con los costos de educación financiados por préstamos baratos de los bancos, obviamente"
 TUR_return_of_socialism: "Regreso del Socialismo"
 TUR_return_of_socialism_desc: "Los partidos de izquierda radical han estado muertos en Turquía durante décadas, pero finalmente han logrado levantarse y tomar el poder! Esta es la revolución!"
 TUR_strong_state_for_people: "Estado Fuerte para el Pueblo"
 TUR_strong_state_for_people_desc: "El pueblo merece un estado fuerte que los guíe. Aquellos que pongan su fe en el gobierno serán recompensados"
 TUR_peoples_power: "Poder del Pueblo"
 TUR_peoples_power_desc: "El gobierno debe ser para el pueblo y por el pueblo. Necesitamos incorporar a los campesinos y al pueblo democráticamente en todos los niveles de la administración, desde la comuna hasta el estado"
 TUR_destroy_old_regime: "Destruir el Antiguo Régimen"
 TUR_destroy_old_regime_desc: "Necesitamos erradicar cualquier vestigio del antiguo régimen corrupto de la administración y comenzar de nuevo"
 TUR_mixed_economy: "Economía Mixta"
 TUR_mixed_economy_desc: "La cooperación entre los sectores privado y público es necesaria para una economía bien funcionada. Necesitamos erradicar las tendencias capitalistas perversas, mientras también dejamos espacio para que nuestra gente opere económicamente de manera independiente"
 TUR_state_owned_economy: "Economía de Propiedad Estatal"
 TUR_state_owned_economy_desc: "El capitalismo debe ser erradicado de nuestra sociedad. Solo el estado y las comunas locales son aptos para dirigir la industria"
 TUR_rent_to_production_economy: "De Economía de Renta a Economía de Producción"
 TUR_rent_to_production_economy_desc: "While having a private sector is important, we need to encourage and support our population to get ownership of businesses and living accommodations to ensure that true control of the economy stays in the hands of our people"
 TUR_land_reform: "Reforma Agraria"
 TUR_land_reform_desc: "Los propietarios de tierras son una plaga para la humanidad. Todavía existen muchas estructuras atrasadas e incluso feudales en Turquía que impiden que los campesinos sean libres. Necesitamos reformar completamente cómo se posee la tierra en nuestro país"
 TUR_heavy_agricultural_subsidies: "Subvenciones Agrícolas Pesadas"
 TUR_heavy_agricultural_subsidies_desc: "Necesitamos romper las reglas de la OMC y comenzar a subvencionar fuertemente nuestro sector agrícola proporcionando combustible barato, préstamos baratos y fáciles y maquinaria a nuestros agricultores"
 TUR_machinery_tractor_parks: "Parques de Tractores y Maquinaria"
 TUR_machinery_tractor_parks_desc: "Necesitamos establecer parques de tractores donde la maquinaria agrícola pueda ser producida, mantenida y vendida. Todo esto ocurrirá en ubicaciones centralizadas en todo el país. Esto nos ayudará significativamente a modernizar y motorizar nuestra agricultura"
 TUR_communal_farming: "Agricultura Comunal"
 TUR_communal_farming_desc: "La agricultura comunal es la mejor manera de hacer que nuestras granjas sean más eficientes. En lugar de grandes granjas corporativas enfocadas en las ganancias, tendremos más agricultura a gran escala para uso local"
 TUR_cut_global_trade: "Cortar el Comercio Global"
 TUR_cut_global_trade_desc: "Los recursos turcos deben reservarse solo para Turquía y no ser robados por imperialistas globalistas. Necesitamos asegurarnos de que los recursos vitales para nuestra nación permanezcan en nuestras manos"
 TUR_prioritise_backwards_regions: "Priorizar Regiones Atrasadas"
 TUR_prioritise_backwards_regions_desc: "La inversión económica debe centrarse en las áreas más rurales y escasamente pobladas que han sido largamente descuidadas por el estado. El campo es la columna vertebral de este país"
 TUR_urban_humanism: "Humanismo Urbano"
 TUR_urban_humanism_desc: "Nuestras ciudades necesitan ser rediseñadas para que no sean bloques de concreto fríos solo para que las personas actúen como engranajes en la máquina capitalista. Las áreas urbanas necesitan ser diseñadas de manera más natural para que el trabajador prospere"
 TUR_equal_distribution: "Distribución Igualitaria"
 TUR_equal_distribution_desc: "We can't play favourites in regional politics. This will only cause discord in our nation. We will focus on areas based on state and local needs"
 TUR_greatest_productive_force: "La Mayor Fuerza Productiva es el Hombre"
 TUR_greatest_productive_force_desc: "Solo enfocándonos en las personas podemos llevar a nuestra nación adelante. Todos los aspectos de la vida, los negocios, la sociedad y todo proviene de las personas"
 TUR_clamp_down_on_kurdish_culture: "Reprimir la Identidad Kurda"
 TUR_clamp_down_on_kurdish_culture_desc: "Los kurdos son parte de la Nación Turca, les guste o no. No cederemos ante estos terroristas financiados por la CIA"
 TUR_federal_republic: "República Federalizada"
 TUR_federal_republic_desc: "Every people group in Turkey should have the right of self determination, autonomy and even full independence if they so wish. Demonizing our minorities will not make a strong state. We need to agree to give the Alevis some sort of autonomy for everyone's sake"
 TUR_appease_kurds: "Aplacar a los Kurdos"
 TUR_appease_kurds_desc: "Hemos estado luchando contra los kurdos durante décadas y no hemos llegado a ninguna parte. Es hora de que dejemos nuestras armas y tomemos un enfoque más pacífico hacia ellos. Solo quieren vivir en paz después de todo"
 TUR_the_turkish_nation: "La Nación Turca"
 TUR_the_turkish_nation_desc: "Turquía es una nación turca. Esto no significa solo turcos étnicos, sino que cada ciudadano de Turquía es un turco y parte de la República indivisible de Turquía. No permitiremos que nuestros enemigos nos dividan sembrando discordia entre nuestra gente"
 TUR_detach_state_from_religion: "Separar el Estado de la Religión"
 TUR_detach_state_from_religion_desc: "Turkey was created as a secular nation, but in recent years this core principle of the Republic has been tarnished. We must cut all aspects of religion from the state; no religious education in public schools, no funding of religious organizations by the state and no religious imagery in public buildings. People are free to worship what they want but the state is above such frivolous notions"
 TUR_recognise_minorities: "Reconocer a las Minorías"
 TUR_recognise_minorities_desc: "Debemos admitir que Turquía está compuesta por muchas personas diferentes. No tiene sentido tratar de imponer la idea de ser turco sobre cada ciudadano. Cada persona es un ciudadano de Turquía, ya sea turco o no"
 TUR_leverage_diaspora: "Aprovechar la Diáspora"
 TUR_leverage_diaspora_desc: "Se nos acusa por parte de las potencias occidentales de cometer un genocidio contra los armenios. Esto es una mentira descarada perpetrada por los imperialistas. Debemos utilizar a nuestra diáspora para influir en la política de los países occidentales y hacer que cambien su actitud hacia nosotros"
 TUR_commit_to_gender_equality: "Comprometerse con la Igualdad de Género"
 TUR_commit_to_gender_equality_desc: "Equality between men and women in Turkey is abysmal. We need to commit to reducing violence against women and providing women with more opportunities when it comes to work, and increasing their participation in education and politics."
 TUR_revolutionary_education: "Educación Revolucionaria"
 TUR_revolutionary_education_desc: "Deberíamos centrarnos en mejorar nuestra educación. No es suficiente con aumentar la accesibilidad, también necesitamos incorporar la enseñanza de ideas revolucionarias a los estudiantes para que lleven la antorcha"
 TUR_free_education: "Educación Gratuita"
 TUR_free_education_desc: "La educación debe ser completamente gratuita para todos. Es una necesidad básica para el bienestar de la nación"
 TUR_increase_peoples_welfare: "Aumentar el Bienestar del Pueblo"
 TUR_increase_peoples_welfare_desc: "Making sure that our people are healthy is of the utmost importance. We also have to make sure that no one in our country has to starve, even if they are unemployed, old or disabled"
 TUR_leave_NATO: "Dejar la OTAN"
 TUR_leave_NATO_desc: "La OTAN no es más que una herramienta para que los imperialistas controlen el mundo. Nunca deberíamos ser parte de tal organización"
 TUR_anti_west_sentiment: "Sentimiento Antioccidental"
 TUR_anti_west_sentiment_desc: "Occidente siempre está entrometiéndose en Medio Oriente. Necesitamos realinearnos con las potencias emergentes que algún día derrocarán a los decadentes Estados Unidos"
 TUR_balanced_approach: "Enfoque Equilibrado"
 TUR_balanced_approach_desc: "La diplomacia internacional puede ser traicionera. Necesitamos avanzar con cuidado, pero nuestro objetivo debe ser hacer que Turquía sea independiente de todas las potencias extranjeras entrometidas"
 TUR_deterrent_national_defence: "Defensa Nacional Disuasiva"
 TUR_deterrent_national_defence_desc: "Nuestro ejército debe ser lo suficientemente fuerte como para actuar como disuasivo para que ningún imperialista se atreva a interferir con nosotros"
 TUR_destruction_of_fascists: "Destrucción de los Fascistas"
 TUR_destruction_of_fascists_desc: "El ejército, la policía y el MIT no son más que organizaciones fascistas que deben ser derribadas y reemplazadas por una alternativa proporcionada por el pueblo"
 TUR_pacifist_initiatives: "Iniciativas Pacifistas"
 TUR_pacifist_initiatives_desc: "Debemos confiar en un enfoque pacífico para resolver conflictos. Debemos cerrar todas las iniciativas imperialistas por el bien del pueblo"
 TUR_invest_in_police: "Invertir en Seguridad"
 TUR_invest_in_police_desc: "Necesitamos tener un aparato de seguridad fuerte para que la gente se sienta segura. Nuestra policía necesita buen equipo y buenos salarios para hacer lo mejor posible"
 TUR_national_democratic_revolution: "Revolución Democrática Nacional"
 TUR_national_democratic_revolution_desc: "Debemos continuar con la Revolución Democrática Nacional iniciada por Atatürk. Somos los vanguardistas de la revolución y llevaremos a Turquía adelante hacia una era moderna"
 TUR_heavy_military_investment: "Inversión Militar Pesada"
 TUR_heavy_military_investment_desc: "Necesitamos proteger a Turquía de las potencias externas. Necesitamos invertir fuertemente en nuestra industria pesada para asegurarnos de que nuestro ejército esté listo para futuras batallas"
 TUR_shutdown_christian_missionaries: "Cerrar a los Misioneros Cristianos"
 TUR_shutdown_christian_missionaries_desc: "Los misioneros cristianos que operan en el país no son más que espías de los imperialistas occidentales. Necesitamos expulsarlos del país y prohibirles predicar"
 TUR_form_anti_imperialist_vanguard: "Formar Vanguardia Antiimperialista"
 TUR_form_anti_imperialist_vanguard_desc: "The West is constantly meddling with the Middle East, especially the United States. We need to form a union of anti-imperialists in the Middle East to stop the great Middle Eastern project of the United States"
 TUR_vanguard_approach_azerbaijan: "Acercarse a Azerbaiyán"
 TUR_vanguard_approach_azerbaijan_desc: "Azerbaiyán es un aliado de larga data de Turquía. Compartimos una religión, patrimonio y objetivos políticos comunes después de todo. Deberíamos pedirles que denuncien el imperialismo occidental"
 TUR_vanguard_reclaim_azerbaijan_territory: "Recuperar la Integridad Territorial de Azerbaiyán"
 TUR_vanguard_reclaim_azerbaijan_territory_desc: "Armenia occupied parts of Azerbaijan after they gained independence from the Soviet Union under the pretext of protecting ethnic Armenians. This occupation has now lasted for more than a decade. It is time to demand Armenia to withdraw from the region or face the consequences!"
 TUR_vanguard_approach_iran: "Acercarse a Irán"
 TUR_vanguard_approach_iran_desc: "Irán ha sido oprimido y vilipendiado por los estadounidenses durante mucho tiempo. Definitivamente estarán interesados en un frente común contra el Gran Satán"
 TUR_vanguard_pressure_northern_cyprus: "Presionar a Chipre del Norte"
 TUR_vanguard_pressure_northern_cyprus_desc: "Northern Cyprus only exists because we support them. We have considerable influence on their government and we should emphasize to them that they only exist because we allow it"
 TUR_vanguard_negotiate_with_syria: "Negociar con Siria"
 TUR_vanguard_negotiate_with_syria_desc: "Tenemos una historia muy complicada con Siria. En un momento, permitieron que el PKK operara dentro de sus fronteras y nunca nos perdonaron habernos dado la región de Hatay por parte de los franceses. Sin embargo, tal vez haya una manera de que podamos ser amigos"
 TUR_vanguard_annex_northern_cyprus: "Anexar Chipre del Norte"
 TUR_vanguard_annex_northern_cyprus_desc: "Chipre del Norte está lleno de turcos. Por esta razón, debemos acercar mucho más a Chipre del Norte a nosotros. De hecho, toda la isla debería ser parte de Turquía"
 TUR_vanguard_unify_iraq: "Alinear a Irak"
 TUR_vanguard_unify_iraq_desc: "Los iraquíes han estado actuando de manera salvaje y desenfrenada en los últimos años, y necesitamos solucionarlo y alinearlos con nosotros"
 TUR_scientific_socialism: "Socialismo Científico"
 TUR_scientific_socialism_desc: "La vía del socialismo científico del EMEP es la mejor manera de avanzar. Un camino fuertemente anticapitalista, descentralizado y no intervencionista será el más próspero para Turquía."
 TUR_unlimited_workers_rights: "Derechos Ilimitados de los Trabajadores"
 TUR_unlimited_workers_rights_desc: "The Workers of Turkey have been oppressed for decades! No more! It is time to break our chains and make Turkey a worker's paradise!"
 TUR_adherent_defence: "Defensa Adherente"
 TUR_adherent_defence_desc: "Nuestro ejército no debe usarse para reprimir a otras personas. El trabajo del ejército es proteger a nuestra gente, y solo eso"
 TUR_shut_down_imperialists: "Cerrar a los Imperialistas"
 TUR_shut_down_imperialists_desc: "Our current government model is based on capitalistic ideals. All of this is pure nonsense. We need to completely overhaul our monetary system. Other powers say that we 'owe' them money but our debts will be just wiped away with the push of a button"
 TUR_retreat_from_cyprus: "Retirarse de Chipre"
 TUR_retreat_from_cyprus_desc: "Turkey has no business being in Cyprus. It is nothing more than a remnant of Turkish imperialism. The inhabitants of the island, both Turks and Greeks alike should decide their fate on their own"
 TUR_devrimci_yol: "Devrimci Yol"
 TUR_devrimci_yol_desc: "Devrimci Yol significa Camino Revolucionario, y es una forma turca de marxismo-leninismo con énfasis en los sindicatos. Muchos miembros de §W[anarchist_communism_L]§! fueron parte del movimiento en los años 80. La idea de Devrimci Yol es superior al comunismo extranjero de nuestros competidores y necesita ser elevada por encima de los demás"
 TUR_committees_of_resistance: "Comités de Resistencia"
 TUR_committees_of_resistance_desc: "Necesitamos formar Comités de Resistencia para defendernos de las actitudes de derecha del país. Estos grupos patrullarán las calles y cazarán a los terroristas conocidos como Lobos Grises"
 TUR_committees_of_production: "Comités de Producción"
 TUR_committees_of_production_desc: "Los Comités de Producción ayudarán a organizar a los trabajadores y fábricas en unidades efectivas y estos comités controlarán de manera independiente el proceso de manufactura"
 TUR_empower_unions: "Fortalecer a los Sindicatos"
 TUR_empower_unions_desc: "We need to empower the labour unions so we can fully protect the rights of workers. Only by giving a voice to the worker, will our words be truthful"
 TUR_strike_pakistan: "Atacar a Pakistán"
 TUR_strike_pakistan_desc: "El gobierno pakistaní parece rechazar cualquier forma de socialismo y han hablado activamente en contra de nuestro gobierno. Es hora de callarlos de una vez por todas."
 TUR_strike_arabia: "Liberar Arabia"
 TUR_strike_arabia_desc: "Los saudíes no parecen llevarse bien con otras ideologías. Por esa razón, tendremos que hacer que lo hagan."
 TUR_islamist_victory: "Victoria Islamista"
 TUR_islamist_victory_desc: "People in Turkey have been yearning for a more conservative government, one that truly follows Islam. Now they finally have it"
 TUR_lower_taxes_for_exports: "Reducir Impuestos para Exportaciones"
 TUR_lower_taxes_for_exports_desc: "Turquía tiene una economía poderosa, pero hay mucha burocracia para las exportaciones. Necesitamos hacer que el comercio internacional sea mucho más fácil de lo que es ahora"
 TUR_form_new_stock_markets: "Formar Nuevos Mercados de Valores"
 TUR_form_new_stock_markets_desc: "Actualmente, los únicos mercados de valores funcionan en Estambul. Esto desfranquicia en gran medida a las personas que viven en otras partes de Turquía. Necesitamos establecer más intercambios locales y vincularlos al intercambio de Estambul"
 TUR_energy_investments: "Inversiones en Energía"
 TUR_energy_investments_desc: "Necesitamos reducir la dependencia de Turquía de las importaciones de energía extranjera"
 TUR_subsidise_farming: "Subsidiar la Agricultura"
 TUR_subsidise_farming_desc: "Turquía tiene grandes áreas de tierra fértil, pero nuestra producción agrícola está en su punto más bajo. Necesitamos subsidiar a nuestros agricultores para asegurar un suministro de alimentos constante y eficiente"
 TUR_increase_oil_gas_production: "Aumentar la Producción de Petróleo y Gas Natural"
 TUR_increase_oil_gas_production_desc: "Turquía importa mucho petróleo y gas natural, aunque también tenemos un suministro nacional. Necesitamos invertir en nuestras instalaciones de producción de petróleo y gas natural para aumentar la autosuficiencia"
 TUR_turkish_highways: "Autopistas Turcas"
 TUR_turkish_highways_desc: "Turquía es el puente de conexión entre Asia y Europa. Sin embargo, la red de carreteras para atravesar Turquía está en mal estado y debería mejorarse"
 TUR_uphold_family_values: "Mantener los Valores Familiares"
 TUR_uphold_family_values_desc: "Los valores familiares tradicionales están siendo atacados por Occidente. Necesitamos fundar una organización que promueva valores tradicionales y asegure que el material hostil hacia esta tradición no exista en los medios"
 TUR_security_through_police_and_welfare: "Seguridad a través de la Policía y el Bienestar"
 TUR_security_through_police_and_welfare_desc: "Para proporcionar seguridad a nuestros ciudadanos, no es suficiente con financiar a la policía. También necesitamos aumentar el gasto social para que las personas no terminen en situaciones en las que tengan que recurrir al crimen para sobrevivir"
 TUR_judicial_reform: "Reforma Judicial"
 TUR_judicial_reform_desc: "Nuestro sistema de justicia está anticuado y desconectado de la sociedad moderna. Necesitamos reformar todo el sistema y eliminar a los jueces corruptos"
 TUR_remove_electoral_treshold: "Remove Electoral Threshold"
 TUR_remove_electoral_treshold_desc: "Turkey has the highest electoral threshold in the world. A party needs at least 10% of the popular vote to get seats in the parliament. This is undemocratic, and only serves to cement the power of the ruling party. We need to remove the limit altogether"
 TUR_increase_military_funding: "Aumentar el Financiamiento Militar"
 TUR_increase_military_funding_desc: "La Nación Turca está bajo asedio y necesitamos un ejército fuerte para defendernos. Necesitamos aumentar el financiamiento y reclutar nuevo personal"
 TUR_concentrate_domestic_equipment: "Enfocarse en el Equipamiento Nacional"
 TUR_concentrate_domestic_equipment_desc: "El ejército turco debería estar usando equipamiento turco. Actualmente dependemos demasiado de las entregas de equipos de nuestros llamados 'aliados'"
 TUR_military_rnd_projects: "Proyectos de I+D"
 TUR_military_rnd_projects_desc: "Además de producir equipos nacionales, necesitamos desarrollar sistemas de armas nacionales para reemplazar los comprados en el extranjero"
 TUR_remove_military_from_politics: "Eliminar al Ejército de la Política"
 TUR_remove_military_from_politics_desc: "En una nación democrática, es perverso que el ejército tenga tanto poder. Necesitamos hacer leyes y enmiendas a la constitución para evitar que el ejército interfiera constantemente en la política"
 TUR_islamic_nato: "OTAN Islámica"
 TUR_islamic_nato_desc: "Aunque la OTAN nos brinda seguridad, los miembros de la OTAN han mostrado un completo desprecio por el Medio Oriente. Si no pueden proporcionar la estabilidad y la prosperidad, debemos tomar las riendas. Formaremos nuestra propia alianza militar, la Organización del Tratado del Mediterráneo, o MTO"
 TUR_invite_iraq: "Invitar a Irak"
 TUR_invite_iraq_desc: "Necesitamos invitar a Irak a nuestra alianza ya que están comenzando a organizarse, y nos beneficiaríamos enormemente de la cooperación mutua"
 TUR_invite_syria: "Invitar a Siria"
 TUR_invite_syria_desc: "Tener a Siria justo al sur de nuestra nación nos hace muy vulnerables. Invitar a Siria a nuestra facción sería una gran manera de garantizar nuestra seguridad y protección"
 TUR_invite_egypt: "Invitar a Egipto"
 TUR_invite_egypt_desc: "Egypt is an up and coming power-house, and with a population of its size, our alliance will be able to achieve virtually anything"
 TUR_assistance_to_bulgaria: "Asistencia a Bulgaria"
 TUR_assistance_to_bulgaria_desc: "Deberíamos ayudar a Bulgaria a desarrollar su infraestructura para que podamos realizar más inversiones más allá de sus fronteras con facilidad"
 TUR_islamic_economic_cooperation: "Cooperación Económica Islámica"
 TUR_islamic_economic_cooperation_desc: "Muchos países musulmanes nadan en dinero y usan ese dinero para cosas sin sentido. Deberíamos formar una alianza económica para reunir nuestros recursos en proyectos económicos comunes"
 TUR_condemn_china: "Condenar a China"
 TUR_condemn_china_desc: "El trato de China hacia sus musulmanes nativos es aborrecible y debe ser condenado"
 TUR_improve_relations_with_egypt: "Mejorar las Relaciones con Egipto"
 TUR_improve_relations_with_egypt_desc: "Turquía tiene una historia complicada con Egipto, principalmente debido a nuestros conflictos pasados. Todos estamos del mismo lado aquí y no deberíamos ser tan fríos con los egipcios"
 TUR_investments_in_iraq: "Amistad Iraquí"
 TUR_investments_in_iraq_desc: "Despite Iraq having less than ideal ties with us in the past, it is best that we warm up to each other. We can invest in Iraqi infrastructure and gain their trust"
 TUR_work_together_with_BSEC: "Trabajar Juntos con la BSEC"
 TUR_work_together_with_BSEC_desc: "La BSEC (Cooperación Económica del Mar Negro) es una organización cuyo objetivo es llevar prosperidad alrededor del Mar Negro. La organización está compuesta por países alrededor del Mar Negro y algunos países de los Balcanes del Sur. Necesitamos trabajar junto con estos países para un mayor beneficio"
 TUR_fixing_ideals: "Reparar Ideales"
 TUR_fixing_ideals_desc: "Nuestros ideales han sido destruidos como resultado de décadas de ideología y gobierno kemalista. Sin embargo, no es demasiado tarde para restaurarlos, corregiremos los errores cometidos y dirigiremos a la nación de regreso al tradicionalismo y al islamismo"
 TUR_anti_lgbtq: "Redoblar las Leyes Matrimoniales"
 TUR_anti_lgbtq_desc: "Necesitamos asegurarnos de que nuestra sociedad no gire en torno a ideales occidentales. Redoblaremos las leyes matrimoniales tradicionales y haremos cumplir el tradicionalismo por encima de todo"
 TUR_supporting_islamists: "The Ulema's Voice"
 TUR_supporting_islamists_desc: "We will let the Ulema voice their opinions in our country's affairs. Giving them a voice will let our nation steer towards a path of righteousness and purity"
 TUR_natural_medicine: "Medicina Natural"
 TUR_natural_medicine_desc: "Natural medicine is the best type of medicine. We need to ditch the glorified lab-made medicines as they can be using ingredients more harmful than good to one's body."
 TUR_new_era: "Una Nueva Era"
 TUR_new_era_desc: "Se traerá una nueva era para la región. Una era de paz y estabilidad, libre de opresión e injusticia"
 TUR_ally_palestine: "Aliarse con Palestina"
 TUR_ally_palestine_desc: "Palestine has been occupied by the Israelis since the late 1940s. It is time we establish proper ties with them, and show our support for them."
 TUR_talks_with_iran: "Conversaciones con Irán"
 TUR_talks_with_iran_desc: "Irán ha pedido la liberación completa de Palestina y el derrocamiento del orden israelí. Tendremos conversaciones con ellos y veremos si podemos encontrar un punto en común sobre el asunto a pesar de nuestras diferencias religiosas"
 TUR_freeing_palestine: "Liberación de Palestina"
 TUR_freeing_palestine_desc: "Es hora de liberar a los palestinos de los ocupantes israelíes. Los israelíes solo han traído sufrimiento e injusticia a Palestina y el Levante, y es hora de que hagamos algo al respecto!"
 TUR_shia_dominance: "Dominio Chiita"
 TUR_shia_dominance_desc: "Es hora de que los alevíes, alauitas y yafaríes de Turquía se unan y rompan la opresión de los suníes turcos"
 TUR_alevi_political_shift: "Dominio Político Aleví"
 TUR_alevi_political_shift_desc: "La capital política de Turquía necesita trasladarse a las áreas dominadas por los alevíes en Anatolia Central. Esta es la mejor manera de asegurar nuestra base de poder"
 TUR_repair_relations_with_alawites: "Reparar las Relaciones con los Alauitas"
 TUR_repair_relations_with_alawites_desc: "Los alauitas que viven en Hatay y la élite política de Siria a menudo se confunden con los alevíes. Aunque comparten algunas similitudes, las sectas comenzaron en diferentes momentos y los alauitas son principalmente árabes. Ha habido fricciones históricas ya que los alauitas han visto a los alevíes como 'opresores de los árabes'. Esta hostilidad debe ser enmendada"
 TUR_invest_in_alevis: "Invertir en los Alevíes"
 TUR_invest_in_alevis_desc: "La mayoría de los alevíes en Turquía viven en Anatolia Oriental, que ha visto mucha menos prosperidad económica que las partes occidentales de Turquía. Es hora de que los alevíes compartan la riqueza"
 TUR_invest_in_alawites: "Invertir en los Alauitas"
 TUR_invest_in_alawites_desc: "Al igual que los alevíes, los alauitas han sido desplazados económicamente por gobiernos anteriores. No cometeremos el mismo error"
 TUR_unite_alawites: "Unir a los Alauitas"
 TUR_unite_alawites_desc: "Turquía se robó injustamente la región de Hatay de Francia, dividiendo a los alauitas en dos estados separados. Necesitamos devolver el área a Siria y unir a todos los alauitas bajo un solo gobierno"
 TUR_utilise_alawite_military_experience: "Utilizar la Experiencia Militar Alauita"
 TUR_utilise_alawite_military_experience_desc: "En Siria, una gran parte de su mando militar está compuesto por alauitas. Necesitamos implementar un método similar en nuestro propio ejército para tener un cuerpo de oficiales leal"
 TUR_break_syrian_dependancy_iran: "Atacar las Relaciones Sirio-Iraníes"
 TUR_break_syrian_dependancy_iran_desc: "We need to make Syria less dependent on Iran, and more so on us. For that reason, we will be attacking their ability to exert influence within Syria"
 TUR_arm_iraqi_shias: "Liberar a los Chiitas Iraquíes"
 TUR_arm_iraqi_shias_desc: "Iraqis are living under a system where the Shi'ite population is under-represented. We need to change this, we will liberate them and free them from the system of oppression they currently live under"
 TUR_arm_saudi_rebels: "Dominar sobre Hezbolá"
 TUR_arm_saudi_rebels_desc: "Hezbollah has been trying to capture all of Lebanon, or at the least, exert its military control over it. We will not let an Iranian proxy do this, as we are going to be taking Lebanon as a protectorate of Turkey"
 TUR_anti_iran_diplomacy: "Restringir la Doctrina Iraní"
 TUR_anti_iran_diplomacy_desc: "El ejército sirio ha tenido muchos asesores entrando y saliendo de Irán. Por esa razón, sus métodos de entrenamiento y combate son muy similares, y nos causará problemas si alguna vez vamos a la guerra con Irán, ya que nuestras tácticas serán predecibles"
 TUR_turkey_syria_union: "Unión Turco-Siria"
 TUR_turkey_syria_union_desc: "Dado que tanto nosotros como Siria somos gobernados por una minoría religiosa que la gente confunde entre sí todo el tiempo, ¿tal vez deberíamos unir nuestras fuerzas y crear una unión política? Como sectas solas no tenemos ninguna posibilidad de resistir la influencia suní en la región"
 TUR_ottoman_revival: "Revivir a los Otomanos"
 TUR_ottoman_revival_desc: "§GThe Ottomans§!, once one of the greatest empires centuries ago, have returned. However today, the political landscape has §Hshifted drastically§!, and a heightened sense of §Hnationalism§! makes reuniting the empire a §Rdaunting task for anyone§!. For this reason, the §Gnew Ottoman state§! has to find ways to prove that it will offer a better life to its §Hformer territories§!. We will have §H3 sections of peoples to appease§!, The Middle East, The Levant, and The Balkans. Each one of these sections will have §Hseveral countries§! within them that we can §Hboost our support in§!, and once we hit §H100% support§! in any of these countries, we will be able to §Hgain cores§! and the trust of its people.\n\nIn the §RMiddle East§! our support is currently:\n\n[IRQ.GetFlag]Iraq: §Y[?osman_iraq|%]§!\n\n[SYR.GetFlag]Syria: §Y[?osman_syria|%]§!\n\n[KUW.GetFlag]Kuwait: §Y[?osman_kuwait|%]§!\n\nIn the §RLevant§! our support is currently:\n\n[JOR.GetFlag]Jordan: §Y[?osman_jor|%]§!\n\n[ISR.GetFlag][PAL.GetFlag]Israel/Palestine: §Y[?osman_isr|%]§!\n\n[LEB.GetFlag]Lebanon: §Y[?osman_leb|%]§!\n\n[HEJ.GetFlag]Hejaz: §Y[?osman_sau|%]§!\n\nIn the §RBalkans§! our support is currently:\n\n[GRE.GetFlag]Greece: §Y[?osman_gre|%]§!\n\n[BUL.GetFlag]Bulgaria: §Y[?osman_bul|%]§!\n\n[FYR.GetFlag]Macedonia: §Y[?osman_fyr|%]§!"
 TUR_pan_turkic_dream: "El Sueño Pan-Turco"
 TUR_pan_turkic_dream_desc: "Our great nation has envisioned a new §CPan Turkic Dream§!. We will utilize the §HOrganization of Turkic States§! as a means to garner support and influence within Turkic States, and slowly sway them to join us as one nation. If we are successful in doing so, we will be able to grow our nation to the point where we can be considered a great power in the world. §HTurkic Countries eligible to join the Turkic Confederation will be more likely to join if they have a higher opinion of us!§!"
 TUR_domestic_politics_category: "Política Interna Turca"
 TUR_economy_category: "Crisis Económica"
 TUR_mafia_category: "La Mafia Turca"
 TUR_mafia_category_desc: "The Turkish Mafia has been active for quite some time, committing crimes such as drug dealings, murders, fraud, you name it. In recent years however, they have begun becoming more and more political, and certain parties have been caught making deals with them, and slowly giving them more legitimacy.\n\n §YMafia Influence§! measures the overall influence §Hthe Mafia§! has in the nation. If their influence is  §H60§! or higher, then they will be capable of carrying out political Assassinations, either towards the leadership of our internal factions, or the military. §Hthe Mafia§! will also cause us to lose money, and lots of it too, as the higher influence allows more people to be able to commit fraud and tax related crimes. Additionally, §HMafia Influence§! will §Rincrease every two weeks by 1§! if their influence reaches §H60§!. This can happen if we neglect certain events, or if we make poor choices when it comes to dealing with §Hthe Mafia§!. We can combat §HMafia Influence§! by raiding their safe houses, increasing our police spending, or even maintaining party popularity so that our people aren't affected by their campaigns. Additionally, if we get §HMafia Influence§! Below §H30§!, we will be able to make arrests of wanted §HMafia§! criminals, eventually allowing us to completely eradicate §Hthe Mafia§!.\n\n§HMafia Influence§!: §R[?TUR.TUR_mafia_influence]§!"
 TUR_conduct_anti_mafia_raid: "Realizar Operaciones Anti-Mafia"
 TUR_conduct_anti_mafia_raid_desc: "Al realizar operaciones que nos ayuden a eliminar a la Mafia, podremos reducir rápidamente su influencia, aunque con un costo excepcionalmente alto."
 TUR_arrest_mafia_west: "Arrest Mafia members in Western Turkey"
 TUR_arrest_mafia_central: "Arrestar a miembros de la Mafia en el centro de Turquía"
 TUR_arrest_mafia_south: "Arrestar a miembros de la Mafia en el sur de Turquía"
 TUR_arrest_mafia_east: "Arrestar a miembros de la Mafia en el este de Turquía"
 TUR_victory_over_mafia: "§PEerradicar a la Mafia§!"
 TUR_mafia_influence_mechanic: "Misiones Globales"
 TUR_mafia_influence_mechanic_desc: "§PThe Turkish Mafia§! has proven itself to be more than just a domestic group of gang members, it is much more than that. §HThe Turkish Mafia has ties and influence all over the world§!, but more so in certain places than others. Through the use of the Turkish diaspora, the Turkish Mafia is able to §Hgain support§! and §Hinfluence§! over other nations, and use them to prop up new §PMafia-Proxies§!. Doing this will let the §HTurkish Mafia§! pull strings in governments globally, and even in some cases, §Roverthrow them§!.\n\nAs indicated by the visuals below, the §Hhigher the Mafia influence§! in certain countries, the more control they have. If Mafia influence is §Rlow§!, then the Mafia is §Runable§! to do anything drastic. But if the §HMafia influence is high§!, there are §Ga lot§! more options.\n\n§HInfluence in the UK§!: §G[?mafia_uk|%]§!\n§HInfluence in Germany§!: §G[?mafia_germany|%]§!\n§HInfluence in the Netherlands§!: §G[?mafia_holland|%]§!\n§HInfluence in Australia§!: §G[?mafia_australia|%]§!\n§HInfluence in Belgium§!: §G[?mafia_belgium|%]§!\n\nNo color - Low Influence\n§YYellow§! - Some influence\n§RRed§! - A lot of influence\n"
 TUR_start_eng_operations: "Iniciar operaciones en el Reino Unido"
 TUR_close_eng_operations: "Finalizar operaciones en el Reino Unido"
 TUR_boost_british_firms: "Impulsar empresas británicas"
 TUR_fund_ira: "Financiar separatistas"
 TUR_sow_division: "Sow division within politics"
 TUR_shatter_the_kingdom: "§PQuebrar el Reino§!"
 TUR_start_ger_operations: "Iniciar operaciones en Alemania"
 TUR_close_ger_operations: "Finalizar operaciones en Alemania"
 TUR_gray_wolves_networks: "Expandir redes de Lobos Grises"
 TUR_commit_vehicle_rob: "Smuggle out German vehicles"
 TUR_attack_german_politics: "Encontrar hombres de estado corruptos"
 TUR_take_german_industries: "§PTomar el control de sectores industriales clave§!"
 TUR_take_german_industries_desc: "Due to the high amount of corruption in German politics, we are able to easily seize important industrial sectors for our own needs."
 TUR_start_hol_operations: "Iniciar operaciones en los Países Bajos"
 TUR_close_hol_operations: "Finalizar operaciones en los Países Bajos"
 TUR_establish_drug_networks_rotterdam: "Expandir redes de drogas"
 TUR_seize_goods_from_ports: "Robar mercancías de los puertos"
 TUR_decrease_policing_holland: "Atacar la financiación policial"
 TUR_largest_drug_network: "§PEstablecer el gran centro de drogas§!"
 TUR_start_aus_operations: "Iniciar operaciones en Australia"
 TUR_close_aus_operations: "Finalizar operaciones en Australia"
 TUR_boost_honoured_society: "Agitar la sociedad honorable"
 TUR_target_aussie_welfare: "Atacar el nivel de vida australiano"
 TUR_spread_hatred_indonesia: "Start rumours between Indonesia and Australia"
 TUR_watch_the_conflict: "§PRobar el tesoro australiano§!"
 TUR_watch_the_conflict_desc: "Using our connections and influence, we will steal Australian precious metals and use them for our own good."
 TUR_start_bel_operations: "Iniciar operaciones en Bélgica"
 TUR_close_bel_operations: "Finalizar operaciones en Bélgica"
 TUR_fund_bel_mafia: "Ganar criminales belgas"
 TUR_steal_crucial_info: "Robar datos científicos"
 TUR_strings_in_belgian_govt: "Manipular el gobierno belga"
 TUR_our_puppets: "§PSacar a importantes investigadores belgas§!"
 TUR_our_puppets_desc: "Al sacar a importantes investigadores belgas, podemos utilizarlos en Turquía para nuestro propio bien."
 TUR_hire_gulenist_economic_advisors: "Contratar Asesores Económicos Gülenistas"
 TUR_hire_gulenist_economic_advisors_desc: "Contratando a un gran grupo de profesionales internacionales, podemos contratar economistas expertos para asesorar a nuestro gobierno sobre cómo dirigir la economía"
 TUR_employ_gulenist_informants: "Emplear Informantes Gülenistas"
 TUR_employ_gulenist_informants_desc: "Los gülenistas están repartidos por todo el mundo. Al contratar informantes, será más fácil recopilar inteligencia"
 TUR_hire_gulenist_educators: "Contratar Educadores Gülenistas"
 TUR_hire_gulenist_educators_desc: "Podemos aumentar enormemente nuestra efectividad educativa contratando a muchos de los famosos eruditos gülenistas que hay en el mundo"
 TUR_recall_gulenists: "Revocar Gülenistas"
 TUR_recall_gulenists_desc: "Debemos invitar a los gülenistas a Turquía para que sirvan a nuestro país"
 TUR_call_out_ozkan: "Llamar al Viceprimer Ministro Özkan"
 TUR_call_out_ozkan_desc: "Debemos llamar a la serpiente Özkan por sus intentos de destituir a [ROOT.GetLeader] del poder. Sin embargo, existe el riesgo de que intente formar un nuevo partido político si se ve obligado a renunciar"
 TUR_ban_fazilet_partisi: "Prohibir §W[Conservative_L]§!"
 TUR_ban_fazilet_partisi_desc: "The §W[Conservative_L]§! is an islamist political party, and in a secular Turkish state there is no room for such parties. Many of its members have already participated in now banned islamist parties before. Banning §W[Conservative_L]§! won't have a lasting effect, as its members will just form a new political party, but it might cause some factionalism and weakening of our opponents overall"
 TUR_big_crash_coming: "Recuperarse del gran colapso"
 TUR_big_crash_coming_desc: "Our economy has got much worse since 2013, and this will drag us into a depression."
 TUR_sell_reserves: "Vender Reservas"
 TUR_sell_reserves_desc: "Vender reservas puede retrasar el gran colapso."
 TUR_imf_program: "Volver al Programa del FMI"
 TUR_imf_program_desc: "The IMF Program was the economic plan of Turkey between 2001 and 2008, when the economy grew rapidly. Erdogan said \"Who gets loans today money takes orders tomorrow.\" and stated that the IMF is dangerous. Then the IMF Program was cancelled and Turkey paid all the debt taken from IMF."
 TUR_law_reform: "Reformar la ley"
 TUR_law_reform_desc: "Reforming the law and making the courts independent is an important step to fix the economy, but there may be corruption scandals about AKP."
 TUR_reestablish_village_institutes: "Reestablecer Institutos de Aldeas"
 TUR_reestablish_village_institutes_desc: "Los Institutos de Aldeas son centros educativos locales dirigidos por locales para enseñar diversas habilidades a áreas más rurales"
 TUR_incentivise_modern_farming: "Incentivar la Agricultura Moderna"
 TUR_incentivise_modern_farming_desc: "Debemos otorgar exenciones fiscales a los agricultores y compradores de productos agrícolas. También debemos incorporar más tecnología en el proceso agrícola"
 TUR_heavily_subsidise_agriculture: "Subvencionar fuertemente la agricultura"
 TUR_heavily_subsidise_agriculture_desc: "Para tener un sector agrícola fuerte, debemos subvencionar fuertemente a nuestros agricultores"
 TUR_encourage_communal_farming: "Fomentar la Agricultura Comunal"
 TUR_encourage_communal_farming_desc: "Debemos fomentar la agricultura comunal para alejar las granjas dirigidas por grandes corporaciones"
 TUR_implement_revolutionary_education: "Implementar Educación Revolucionaria"
 TUR_implement_revolutionary_education_desc: "La enseñanza revolucionaria debe incorporarse al sistema educativo para asegurarse de que las personas mantengan la cabeza en alto"
 TUR_migrants: "Revisar las Leyes de Migración"
 TUR_migrants_desc: "Debemos revisar nuestras leyes de migración, ya que hemos tenido una afluencia de personas debido a los disturbios en los países vecinos."
 TUR_mit_decision: "Reformar el MIT"
 TUR_mit_decision_desc: "El MIT, nuestro servicio de seguridad nacional, debe reformarse para adaptarse mejor a nuestra nueva agenda."
 TUR_disaster_decision: "Establecer un Plan de Ayuda en Caso de Desastre"
 TUR_disaster_decision_desc: "Los terremotos y desastres naturales están apareciendo por todas partes, realmente necesitamos encontrar una manera de lidiar con ellos lo antes posible."
 TUR_nationalist_rise: "Auge del Nacionalismo Turco"
 TUR_nationalist_rise_desc: "Although nationalism is not always a bad thing, too much of it is. And that is the case in our country, as currently it is leading to ethnic conflicts within our own borders."
 TUR_drug_problems_decision: "El Problema de las Drogas"
 TUR_drug_problems_decision_desc: "There are a lot of drugs coming in and out of Turkey. This causes problems for us, and our neighbors, and our people."
 TUR_redesign_bosphorus: "Rediseñar el Bósforo"
 TUR_redesign_bosphorus_desc: "The banks of the Bosphorus are full of modern tall buildings, with a lot of the historical architecture having been completely erased. We need to limit the development of the area and return the area back to its old beautiful style. The banks will be an area where all citizens of Istanbul can spend their time"
 TUR_establish_shia_dominance: "Establecer Dominio Chiita"
 TUR_establish_shia_dominance_desc: "Una de las minorías religiosas más grandes en Turquía son los alevíes (no confundir con los alauitas árabes) que constituyen entre el 10% y el 20% de la población. Los alevíes han sido objeto de varios pogromos y el gobierno turco no ha estado dispuesto a designarlos como un grupo religioso separado de los suníes dominantes. Aunque técnicamente no son chiitas oficiales, los alevíes fueron designados como tales por el anterior ayatolá de Irán, Ruhollah Jomeini. Muchos alevíes también se consideran chiitas. Necesitamos romper la dominación suní en Turquía"
 TUR_greek_issues: "¿Amigo o enemigo?"
 TUR_greek_issues_desc: "The Greeks, once our historic province, were forced to be in an alliance with us due to NATO. However, despite the alliance, our relations did not get any better because of the countless disputes we have"
 TUR_cypriot_troubles: "Problemas chipriotas"
 TUR_cypriot_troubles_desc: "Cyprus has been an island of endless conflict ever since we moved our troops into the North. The Greeks have never shut up about it, and they are seemingly trying to destroy our gains in the island nation. We will have to deal with this accordingly"
 TUR_direct_involvement: "Participación directa"
 TUR_direct_involvement_desc: "Desde que dejamos la OTAN, ya no estamos restringidos por las muchas restricciones impuestas a nuestras capacidades para ejercer influencia turca. Esto significa que podemos involucrarnos directamente en Chipre sin necesidad de limitar nuestras capacidades"
 TUR_demand_british_withdrawal: "Exigir la retirada británica"
 TUR_demand_british_withdrawal_desc: "The British have historically stuck their noses into everything, but in recent years their empire has been crumbling. Cyprus, has been an exception however. The British still maintain a presence in Akrotiri, and it is going to cause us problems when we inevitably expand south-ward"
 TUR_bring_the_north_to_fold: "Unificación con Turquía"
 TUR_bring_the_north_to_fold_desc: "Los chipriotas del norte son turcos y no tiene sentido que haya otro estado turco. Exigiremos a su gobierno que se una al nuestro y unifique a los pueblos turcos."
 TUR_history_repeated: "Terminar lo que comenzamos"
 TUR_history_repeated_desc: "We need to finish off what we started. After the disastrous decision not to continue down south, Cyprus has been divided into two. We will have to mobilize our army and conduct a second invasion into the rest of Cyprus whether the Greeks like it or not!"
 TUR_indirect_involvement: "Participación indirecta"
 TUR_indirect_involvement_desc: "Como república, no podemos iniciar conflictos cuando queramos, debemos tener más moderación. Por lo tanto, cuando se trata de Chipre, adoptaremos un enfoque más indirecto y apoyaremos al gobierno legítimo de Chipre del Norte"
 TUR_provide_military_training: "Proporcionar entrenamiento militar"
 TUR_provide_military_training_desc: "We will send some experts from the Turkish Armed Forces to train Militias in North Cyprus in preparation of their inevitable clash"
 TUR_fund_militias: "Financiar milicias chipriotas"
 TUR_fund_militias_desc: "Now that we have provided the Militias with some training, we can safely give them some weapons and extra funding as we know they will be competent enough in taking back South Cyprus"
 TUR_great_uprising: "Que comiencen los juegos!"
 TUR_great_uprising_desc: "Ahora podemos sentarnos y ver a los chipriotas del norte luchar nuestra guerra por nosotros, ya que hemos tenido éxito en entrenar, financiar y armar a sus milicias contra los chipriotas del sur"
 TUR_path_of_compromise: "El camino del compromiso"
 TUR_path_of_compromise_desc: "Es mejor no iniciar otro conflicto interminable con nuestro vecino, sino más bien reconciliarse y fortalecer nuestra amistad"
 TUR_withdraw_support_cyprus: "Retirar el apoyo turco"
 TUR_withdraw_support_cyprus_desc: "Ya no apoyaremos al Gobierno de Chipre del Norte y reconoceremos al gobierno de Chipre del Sur como el único gobierno y estado chipriota"
 TUR_support_one_cyprus: "Un cuento de un Chipre"
 TUR_support_one_cyprus_desc: "We will publically back the concept of one Cyprus, and we will backpedal decades of politics that kept Cyprus divided!"
 TUR_peaceful_unification: "¿Unificación pacífica?"
 TUR_peaceful_unification_desc: "Humblemente solicitaremos al gobierno de Chipre del Norte que se una al gobierno de Chipre del Sur.. Pacíficamente..."
 TUR_acquire_agean: "Solicitar el Egeo"
 TUR_acquire_agean_desc: "Now that we have officially shown the Greeks that we are willing to compromise, even if it means abandoning our national interests, we will kindly ask them to transfer the Aegean into Turkish control"
 TUR_aegan_dispute: "Disputa del Egeo"
 TUR_aegan_dispute_desc: "The Aegean islands have been controlled by Greece ever since the end of WW1, and its disastrous consequences for the Turkish nation. Even though we have held historic claims on the islands, the Greek government is hesitant to even give us partial control of the islands, meaning that we will need to figure out a way to do it through force"
 TUR_crete_rebellion: "Provocar el nacionalismo cretense"
 TUR_crete_rebellion_desc: "If we can get the Cretan people to feel occupied under Greek control, we can perhaps gain something even if it is not the Aegean"
 TUR_arm_crete_national_army: "Formar el Ejército Nacional de Creta"
 TUR_arm_crete_national_army_desc: "Formaremos el Ejército Nacional de Creta con la esperanza de que algún día puedan defenderse de una futura invasión griega si llega el día"
 TUR_smuggle_trucks: "Contrabandear camiones"
 TUR_smuggle_trucks_desc: "El Ejército Nacional de Creta no puede funcionar solo con armas pequeñas y artillería, necesitará algunos camiones. Les proporcionaremos algunos camiones para que estén preparados"
 TUR_let_the_games_begin: "Cretan Independence!"
 TUR_let_the_games_begin_desc: "Hoy es el día en que Creta finalmente declara su independencia de Grecia y se convierte en un protectorado turco!"
 TUR_fortify_coast: "Propaganda contra Atenas"
 TUR_fortify_coast_desc: "We will start publically broadcasting propaganda against the Greeks by bribing Greek television stations. This will start slowly destabilizing the nation, and giving us an edge during conflict"
 TUR_border_pictures: "Explotar a políticos corruptos"
 TUR_border_pictures_desc: "Los bolsillos de los políticos griegos corruptos son profundos y pronto comenzarán a llenarse de efectivo turco, ya que podemos manipular su sistema electoral para influir en los partidos que queremos"
 TUR_last_second_upgrades: "Sabotear sus industrias"
 TUR_last_second_upgrades_desc: "Ahora que tenemos algo de influencia sobre el estado griego, podemos comenzar a sabotear sus industrias para que sean más débiles cuando los encontremos en Atenas!"
 TUR_siege_of_greece: "En Atenas en menos de 5 minutos!"
 TUR_siege_of_greece_desc: "It shouldn't be long before Turkish armor and infantry start rolling into Athens and raising the Crescent flag on their soil!"
 TUR_operation_sledgehammer: "Los juicios de Ergenekon"
 TUR_operation_sledgehammer_desc: "The AKP has been eyeing the presidential office for quite some time now... And it won't be too long before they get what they have been so patiently waiting for."
 TUR_purge_army: "Reorganizar el ejército"
 TUR_purge_army_desc: "If we want even the slightest chance of staying in power for longer than 5 days, we are going to have to reorganize the entire army even if it means cutting down spending!"
 TUR_reorganize_army: "Operación Martillo de Forja"
 TUR_reorganize_army_desc: "La Operación Martillo de Forja comenzará y, una vez que termine, podremos utilizarla como un medio para purgar cualquier oposición política que enfrentemos"
 TUR_purge_judges: "Reformar el poder judicial"
 TUR_purge_judges_desc: "There are a lot of Gülenist sympathizers within the legal system in our country, and we cannot let this happen as our system will be corrupted and against us"
 TUR_judges_become_criminals: "Jueces en monos"
 TUR_judges_become_criminals_desc: "Now that we have reformed all of the judicial system, and fired all potential Gülenist members within the system, we can finally persecute them without facing much resistance. We will also publically broadcast these trials so that people know what the consequences are"
 TUR_party_of_development_and_justice: "¿Un partido de desarrollo y justicia?"
 TUR_party_of_development_and_justice_desc: "Somos el partido de Desarrollo y Justicia, pero si cumpliremos con esa promesa es desconocido. Hay un camino muy largo por delante y tendremos que construir ese camino a medida que avance el tiempo"
 TUR_zero_problems_policy: "Política de cero problemas"
 TUR_zero_problems_policy_desc: "Buscaremos una política de \"Cero Problemas\" con nuestros vecinos, poniendo la cooperación y la diplomacia en primer plano, en lugar del enfrentamiento"
 TUR_economic_cooperation_iran: "Negociar acuerdos con Irán"
 TUR_economic_cooperation_iran_desc: "La economía de Irán necesita desesperadamente inversiones como resultado de las décadas de sanciones que ha enfrentado. Ponerse en contacto con algunas empresas turcas para que se establezcan en su territorio beneficiará a ambos, ya que podremos obtener algo de influencia mientras ellos obtienen la inversión"
 TUR_mediate_nagarno_karabakh: "Mediar en la disputa de Karabaj"
 TUR_mediate_nagarno_karabakh_desc: "Azerbaiyán, nuestros buenos amigos, han estado luchando contra los armenios por una franja de territorio entre sus naciones. Este conflicto no es necesario y tal vez podamos mediar en las conversaciones entre ambos para que todos estén contentos"
 TUR_promote_turkish_interests_syria: "Explotar el caos en Siria"
 TUR_promote_turkish_interests_syria_desc: "General instability down south in Syria has given us a golden opportunity to exploit them for further influence"
 TUR_legalize_kurdish_language: "Legalizar el idioma kurdo"
 TUR_legalize_kurdish_language_desc: "The Kurdish language has been banned in Turkey for many years now, and it is probably best to leave it that way if we want to preserve Turkic dominance in Anatolia. But at what cost? We call ourselves a republic and yet we take away a people's right to speak their language?"
 TUR_open_hostilities_with_greece: "Utilizar refugiados"
 TUR_open_hostilities_with_greece_desc: "Somos un destino importante de refugiados y, por esa razón, tenemos una gran población de refugiados. Podemos utilizarlos para nuestra ventaja y enviarlos al otro lado de la frontera con Grecia para causar inestabilidad y caos"
 TUR_side_with_azerbaijan_against_armenia: "Respaldar a Azerbaiyán"
 TUR_side_with_azerbaijan_against_armenia_desc: "Azerbaiyán es el propietario legítimo de Karabaj y Armenia necesita saberlo. Apoyaremos públicamente a los azeríes y los instaremos a tomar más medidas, incluso si eso implica un riesgo de conflicto!"
 TUR_a_new_barrier: "La zona de amortiguamiento"
 TUR_a_new_barrier_desc: "Los kurdos en Siria están amenazando nuestra soberanía. Tendremos que establecer una zona de amortiguamiento entre nosotros y Siria de inmediato!"
 TUR_tighten_kurdish_restrictions: "Endurecer las leyes kurdas"
 TUR_tighten_kurdish_restrictions_desc: "Hagamos lo que hagamos, los kurdos continúan causando problemas. Parece que nuestras manos están atadas y solo podemos aumentar las restricciones hasta que dejen de causarnos problemas"
 TUR_erdonomics: "Erdonomía"
 TUR_erdonomics_desc: "Erdonomics is the wave of economic reforms brought forth by Recep Tayyip Erdogan and his party. There are several ways this can go, good, bad, or terrible, but it all comes down to how the policy is pursued"
 TUR_cheaper_credit: "¿Qué es una tasa de interés?"
 TUR_cheaper_credit_desc: "En serio, ¿realmente lo necesitamos?"
 TUR_dont_fix_what_isnt_broken: "Si no está roto, no lo arregles"
 TUR_dont_fix_what_isnt_broken_desc: "La economía turca está bien como está y no necesitamos jugar más con ella. Si lo hacemos, corremos el riesgo de un posible colapso económico"
 TUR_digitalization_of_turkey: "Digitalización de Turquía"
 TUR_digitalization_of_turkey_desc: "Necesitamos avanzar hacia el siglo XXI con nuevas tecnologías y conocimientos de la nueva era, de lo contrario nos quedaremos atrás"
 TUR_lift_tv_restrictions: "Levantar restricciones de TV"
 TUR_lift_tv_restrictions_desc: "Hay mucha censura impuesta a la televisión turca. Es de nuestro interés levantarlas y permitir las libertades que fueron arrebatadas hace mucho tiempo"
 TUR_return_to_tradition: "Volver a la tradición"
 TUR_return_to_tradition_desc: "Necesitamos volver a nuestras raíces, que están profundamente entrelazadas con el islam. El conservadurismo salvará a Turquía de convertirse en un reflejo defectuoso de otras sociedades!"
 TUR_islamic_politics: "Nuevos asesores"
 TUR_islamic_politics_desc: "Nuestro gabinete está lleno de asesores inútiles que desviarán a nuestro liderazgo, es hora de encontrar nuevos, ya sea para la economía o las políticas"
 TUR_imams_in_office: "Despedir al primer ministro"
 TUR_imams_in_office_desc: "We will need to abolish the position of the prime minister so that our country's democracy can evolve and be reformed"
 TUR_mosque_funding: "Ganar las mezquitas"
 TUR_mosque_funding_desc: "Necesitamos el apoyo de las mezquitas para ganar los elementos conservadores en nuestro país, lo que eventualmente nos ganará más apoyo de la gente rural"
 TUR_islamic_society: "El islam en nuestra sociedad"
 TUR_islamic_society_desc: "Let us re-evaluate Islam's role in our society. We will need to expand Islamic teachings in our country one way or the other"
 TUR_expand_diyanet_role: "Dirección de Asuntos Religiosos"
 TUR_expand_diyanet_role_desc: "La Dirección de Asuntos Religiosos será muy útil en el futuro y podemos expandir su papel en nuestra sociedad para que nuestro poder llegue lejos en la nación"
 TUR_strings_in_judiciary: "Tirar de los hilos"
 TUR_strings_in_judiciary_desc: "Nuestro movimiento tiene mucho apoyo dentro del sistema judicial.. y podemos usar eso a nuestra ventaja y erradicar lentamente al AKP"
 TUR_connections_in_army: "Simpatizantes en el ejército"
 TUR_connections_in_army_desc: "Gracias a nuestra amplia base de apoyo, podemos utilizar nuestra conexión en el ejército para ganarlos y prevenir cualquier posible golpe"
 TUR_suspicious_generals_resign: "Presionar a generales sospechosos para que renuncien"
 TUR_suspicious_generals_resign_desc: "Hay muchos generales sospechosos actualmente activos en el TSK. Podemos hacer que algunos de ellos renuncien y, al hacerlo, consolidaremos el control sobre todas las ramas del ejército sin resistencia"
 TUR_cracks_in_akp: "Grietas en el liderazgo del AKP"
 TUR_cracks_in_akp_desc: "Comenzaremos a denunciar públicamente al liderazgo del AKP y crear inestabilidad dentro de su partido. Esto seguramente reducirá su popularidad, pero casi con certeza creará la atmósfera para algunas protestas"
 TUR_mobilize_diaspora: "La diáspora"
 TUR_mobilize_diaspora_desc: "Podemos utilizar la diáspora en otros países para dar legitimidad a nuestro gobierno"
 TUR_service_to_the_community: "Nuestro servicio a la comunidad"
 TUR_service_to_the_community_desc: "Hizmet literally stands for Service, or service to one's community. We must uphold this ideal and start improving our society for the better"
 TUR_attack_the_left: "Atacar a la izquierda"
 TUR_attack_the_left_desc: "La izquierda arruinará nuestra nación con sus ideales antiislámicos. Tendremos que atacar su legitimidad y hacer que se vean mal en el escenario público"
 TUR_attack_the_right: "Atacar a la derecha"
 TUR_attack_the_right_desc: "La derecha será el fin de esta nación, ya que aislará a nuestra nación del resto del mundo. Sus acciones incluso pueden arrastrar a Turquía a un conflicto interminable con uno de nuestros vecinos!"
 TUR_ally_fp: "El destino de FP"
 TUR_ally_fp_desc: "The FP party was banned before we rose to power, and they have quite a lot of loose members and groups. We can probably negotiate with some of them."
 TUR_clean_energy_shift: "Transición a Energía Limpia"
 TUR_clean_energy_shift_desc: "We need to do the Earth a giant favor, and it can be done by shifting our country towards cleaner energy. By using clean energy, we will be able to provide our nation with the necessary fuel whilst also protecting the environment from pollution."
 TUR_international_community: "La Comunidad Internacional"
 TUR_international_community_desc: "Por supuesto, nuestro enfoque principal es Turquía, pero también tenemos el deber de hacer del mundo un lugar mejor"
 TUR_condemn_gulf_monarchies: "Condenar a la Monarquía Saudí"
 TUR_condemn_gulf_monarchies_desc: "Lamentablemente, los saudíes eligieron este camino de agresión al designar a nuestro grupo como una organización terrorista. Tendremos que mostrarles que no podemos tolerar tales agresiones."
 TUR_support_kosovo: "Apoyar a Kosovo"
 TUR_support_kosovo_desc: "Kosovo ha estado bajo ocupación serbia durante algún tiempo, y como compañeros musulmanes, no podemos permitir que les hagan tal daño por más tiempo"
 TUR_fatih_university: "Universidad Fatih"
 TUR_fatih_university_desc: "Fatih University has a lot of Gülenist sympathizers within its staff. We will give them some extra funds and spread the teachings of Gülen"
 TUR_strengthen_private_sector: "Strengthen Gülenist Businesses"
 TUR_strengthen_private_sector_desc: "Actualmente, muchos negocios son propiedad y están operados por gülenistas, lo que nos da una gran ventaja en la nación. Financiarlos y fortalecer sus posiciones nos ayudará seriamente en el futuro cercano"
 TUR_gulenist_medias: "Financiar Medios Gülenistas"
 TUR_gulenist_medias_desc: "Tendremos que encontrar nuevas formas de difundir el mensaje de Gülen sin tener que realizar mítines"
 TUR_zaman_media_group: "El Grupo de Medios Zaman se vuelve Digital"
 TUR_zaman_media_group_desc: "Zaman Media Group is a newspaper company which operates very closely with our government. Giving them a little boost can help them go digital and spread the message of Fethullah Gülen far and wide"
 TUR_gulenist_charity: "Caridad Gülenista"
 TUR_gulenist_charity_desc: "Uno de los pilares principales del Islam consiste en dar limosna. Nuestro movimiento no olvidará esto y se comprometerá a crear nuevas organizaciones benéficas que ayuden a los pobres y necesitados"
 TUR_kimse_yok_mu: "¿Kimse Yok Mu?"
 TUR_kimse_yok_mu_desc: "Is anyone there? is the name of one of the newly founded Gülenist charities which is going to help people in need"
 TUR_cultural_centers: "Aplacar a los Conglomerados"
 TUR_cultural_centers_desc: "Los conglomerados industriales tienen mucha influencia en nuestro gobierno y pueden influir fácilmente en nuestra política. Apaciguarlos será nuestra mejor opción, ya que puede evitarnos futuros problemas causados ​​por el grupo."
 TUR_right_wing_victory: "Victoria de la Derecha"
 TUR_right_wing_victory_desc: "The MHP has secured a win in the election, and will transform Turkey into a hyper-nationalist state with an aggressive policy towards other countries. Some fear that Turkey will soon become an international bully, as it slowly pushes its neighbors around."
 TUR_crack_down_secularists: "Reprimir a los Secularistas"
 TUR_crack_down_secularists_desc: "Los secularistas son un grupo de personas que no saben lo que es bueno para el país. Todo lo que hacen es llorar y gritar por 'Libertades Personales' y generalmente tienen una visión anti-islámica. Necesitamos destruir su capacidad de ganar tracción a nivel nacional y revertir los cambios que han hecho!"
 TUR_crack_down_foreign_influence: "Reprimir la Influencia Extranjera"
 TUR_crack_down_foreign_influence_desc: "Foreigners are trying to run Turkiye for us! We need to get rid of them immediately and run it ourselves"
 TUR_crack_down_corruption: "Reprimir la Corrupción"
 TUR_crack_down_corruption_desc: "Los políticos corruptos ralentizan nuestra nación, y si nuestra nación no funciona como debería, entonces se quedará atrás. Purgar a los políticos corruptos es la única manera en que avanzaremos"
 TUR_crackdown_kurdish_resistance: "Reprimir la Resistencia del PKK"
 TUR_crackdown_kurdish_resistance_desc: "The PKK are causing quite a lot of problems for us. We will quite frankly need to deal with them more aggressively"
 TUR_demand_return_of_suspects: "Exigir el Retorno de Sospechosos"
 TUR_demand_return_of_suspects_desc: "There are a lot of PKK members in other countries. We will demand these countries deport these individuals immediately so we can hold trials and limit their influence"
 TUR_the_threat_abroad: "La Amenaza en el Extranjero"
 TUR_the_threat_abroad_desc: "There is a major threat abroad, and we are in between it. The East and the West of our country holds our nation's enemies, who so desperately try to destroy us"
 TUR_eastern_nuisance: "La Molestia del Este"
 TUR_eastern_nuisance_desc: "The Iranians and Russians have been our historic enemies, for centuries. But in the modern day, they wear fake masks and pretend to be our friends, but this cannot be! We will cut them out and pursue actions that really put them in their place"
 TUR_fight_russian_influence: "Contrarrestar la Influencia Rusa"
 TUR_fight_russian_influence_desc: "Los rusos están tratando de influir en nuestra política y en la política de nuestros vecinos. Lo primero que debemos hacer es contrarrestar esta influencia con la nuestra"
 TUR_hamper_the_ayatollahs: "Frenar el Crecimiento Iraní"
 TUR_hamper_the_ayatollahs_desc: "The Iranians are advancing, and growing quite quickly. We will need to hamper their ability to do so as soon as possible"
 TUR_balkan_pests: "La Plaga de los Balcanes"
 TUR_balkan_pests_desc: "We have historically owned the Balkans, and when we did, it was quite peaceful. But during the Balkan Wars we lost the Balkans. Today however, we will take them back, and we will take them back with great pride!"
 TUR_thrace_becomes_one: "Tracia se Unifica"
 TUR_thrace_becomes_one_desc: "Thrace is split into two, one side of it is on our territory, and the other is in Greece. Why must this be? We will make sure the people of Thrace are united under one flag, the Crescent and the Star"
 TUR_campaign_against_athens: "Reconquista Búlgara"
 TUR_campaign_against_athens_desc: "Bulgaria es uno de los muchos vilayatos que se separaron de nosotros. Es nuestro deber recuperarlos y unirlos nuevamente con el pueblo turco"
 TUR_end_of_elections: "Fin de la República"
 TUR_end_of_elections_desc: "En este día, la República Turca dejará de existir. Nuestra gente ha sido suprimida y lavada de cerebro bajo el pretexto de un supuesto 'Gobierno Elegido'. Nuestra gente ha sido mal guiada, engañada y manipulada durante décadas por el sistema kemalista"
 TUR_pan_turkey: "Sueño Pan-Túrquico"
 TUR_pan_turkey_desc: "Hoy, los pueblos de habla túrquica están divididos en varios territorios. Algunos aquí en Turquía, otros en el Cáucaso y algunos más en Asia Central. El sueño túrquico no será olvidado, y el pueblo será unido nuevamente!"
 TUR_a_new_empire: "Un Lobo Muy Hambriento.."
 TUR_a_new_empire_desc: "The Turkish Wolf has been starving for decades, it can no longer howl. But this will change, the world will tremble as they see the Turkish nation carve the world for itself and its people"
 TUR_ottoman_politics: "[ROOT.TUR_ottomanism_name]"
 TUR_ottoman_politics_desc: "[ROOT.TUR_ottomanism_name_desc]"
 TUR_nine_light_name: "Doctrina de las Nueve Luces"
 TUR_nine_light_name_desc: "La doctrina de las Nueve Luces se basa en el nacionalismo turco y el Islam. Representa los ideales del bien para todos, y nuestro partido ha sido moldeado en gran medida por ella."
 TUR_ottomanism_name: "Política Otomana"
 TUR_ottomanism_name_desc: "Nuestros ancestros fueron capaces de gobernar sin problemas, y eso solo puede significar que debemos seguir sus pasos para tener éxito"
 TUR_a_new_army: "Fondos Renovados para el OKK"
 TUR_a_new_army_desc: "Yes, the Janissaries were cool and all, but, perhaps we can try something newer. We will increase our funding for the Ozel Kuvvetler Komutanligi, or our special forces units"
 TUR_return_to_sunni_dominance: "Regreso del Dominio Sunita"
 TUR_return_to_sunni_dominance_desc: "Nos hemos desviado demasiado de nuestras raíces islámicas. Traeremos de vuelta los viejos caminos promoviendo el sunismo a todos nuestros compatriotas"
 TUR_supporting_conservatives: "Apoyar Establecimientos Conservadores"
 TUR_supporting_conservatives_desc: "Aunque vamos a ser un estado de partido único, financiaremos otras organizaciones conservadoras para que las personas que no nos apoyan necesariamente puedan apoyar nuestra ideología y valores"
 TUR_osman_alliance: "Fortalecer a Osman"
 TUR_osman_alliance_desc: "Nuestros sueños de crear una nueva superpotencia turca deben tener cierta legitimidad. Podemos contactar a la casa de Osman para que se unan a nuestro gobierno y fortalecerlos para revivir la gloria de nuestro imperio perdido!"
 TUR_turkish_relations: "Relaciones Turcas"
 TUR_turkish_relations_desc: "We are centered in between Europe and Asia, making diplomacy with us very important. But, we also have a say in who we want to align with. The West, have supported us for decades, but the East is now trying to do the same."
 TUR_eastern_alignment: "Alineación Oriental"
 TUR_eastern_alignment_desc: "NATO had all of its benefits, but they forced us to change our governance and culture in more ways than the East has. For that reason, to maintain our independence and culture, it is best we seek out formal ties with the East."
 TUR_military_coop_india: "Cooperación Militar con India"
 TUR_military_coop_india_desc: "Podemos beneficiarnos de una cooperación militar prolongada con la India. Al lograr que nuestros ejércitos se entrenen y realicen ejercicios conjuntos, podemos aprender nuevas tácticas y estrategias, a la vez que acercamos a nuestras dos naciones."
 TUR_support_belt_road_china: "Apoyar la Iniciativa del Cinturón y la Ruta"
 TUR_support_belt_road_china_desc: "The Belt and Road initiative is a massive infrastructure plan led by the Chinese to bring proper infrastructure all around the globe. Why must we oppose such an initiative?"
 TUR_schools_in_pakistan: "Financiar Escuelas en Pakistán"
 TUR_schools_in_pakistan_desc: "Pakistán necesita desesperadamente una infraestructura educativa adecuada, y podemos intentar proporcionar eso construyendo nuevas escuelas para que la gente aprenda"
 TUR_turkstream_russia_pipeline: "Gaseoducto Turkstream-Rusia"
 TUR_turkstream_russia_pipeline_desc: "El gasoducto Turkstream es un gasoducto de gas natural que va desde Rusia hasta Turquía. Este gasoducto proporcionará mucho gas natural a partes de Europa Occidental y puede ser crucial para ayudar a la economía."
 TUR_afghan_roads: "Carreteras en Afganistán"
 TUR_afghan_roads_desc: "Afghanistan has very few functioning roads due to their civil war which has lasted decades. We are able to construct some for them so that their citizens can get from place to place without problems."
 TUR_mutual_tourism_indonesia: "Turismo con Indonesia"
 TUR_mutual_tourism_indonesia_desc: "Al establecer programas de turismo con Indonesia, ambas economías pueden beneficiarse de los recién llegados y turistas"
 TUR_provide_aid_yemen: "Aeropuertos en Yemen"
 TUR_provide_aid_yemen_desc: "Yemen needs adequate Airports, and we can provide that to them with the experts from our country."
 TUR_industrial_investments_egypt: "Contratar Trabajadores Egipcios"
 TUR_industrial_investments_egypt_desc: "Podemos contratar trabajadores egipcios en masa para nuestras fábricas. De esta manera podemos reducir costos y proporcionar oportunidades de empleo para aquellos en Egipto"
 TUR_religious_tourism_saudi: "Turismo Religioso con Arabia Saudita"
 TUR_religious_tourism_saudi_desc: "Arabia Saudita tiene uno de los sitios más sagrados del Islam dentro de sus fronteras. Por esa razón, tendremos que hacer algunos tratos con ellos para que nuestra gente pueda viajar allí de manera más segura y rápida"
 TUR_investments_in_qatar: "Bases Militares en Catar"
 TUR_investments_in_qatar_desc: "Vamos a pedirle a Catar que nos permita establecer bases militares en su país para que podamos acercarnos militarmente. También podemos intentar protegerlos de otras amenazas en la región"
 TUR_western_alignment: "Mantener la Alineación Occidental"
 TUR_western_alignment_desc: "Después de muchos años de amistad con el Oeste, ¿por qué deberíamos salir a buscar algo más? Es mejor mantener nuestra alineación occidental para que no se realicen cambios drásticos en nuestra política exterior"
 TUR_counter_terror_with_us: "Esfuerzos Contra el Terrorismo"
 TUR_counter_terror_with_us_desc: "Vamos a ayudar a Estados Unidos con operaciones contra el terrorismo en Medio Oriente, para que la región sea más segura y estable"
 TUR_archeology_coop_italy: "Cooperación Arqueológica con Italia"
 TUR_archeology_coop_italy_desc: "We have had historic ties with the Italians, dating back hundreds of years, but we are yet to discover all of the treasures that are buried under our lands. We will call on archeological experts from Italy to come help dig them up!"
 TUR_encourage_migration_germany: "Fomentar la Migración desde Alemania"
 TUR_encourage_migration_germany_desc: "Muchos de los nuestros han ido a Alemania, pero los alemanes no han hecho lo mismo. Vamos a pedirles a los alemanes que nos envíen algunos migrantes, para que podamos ser una nación de crisol"
 TUR_sports_diplomacy_brazil: "Diplomacia Deportiva con Brasil"
 TUR_sports_diplomacy_brazil_desc: "A los brasileños les encanta el fútbol, y a nosotros también, así que por esa razón vamos a buscar la diplomacia deportiva con los brasileños y hacer que jueguen partidos amistosos en nuestra nación"
 TUR_join_business_councils_morocco: "Joint Business Councils with Morocco"
 TUR_join_business_councils_morocco_desc: "Establishing joint business councils with Morocco would help both of us greatly, as we are able to get our companies to cooperate with each other, letting them expand."
 TUR_humanitarian_help_australia: "Expertos Humanitarios de Australia"
 TUR_humanitarian_help_australia_desc: "Australia atraviesa todo tipo de desastres, y recientemente también hemos estado pasando por muchos de ellos. Al conseguir que los australianos nos ayuden, podemos estar un poco más preparados en caso de que ocurra algo malo."
 TUR_great_east: "El Gran Oriente"
 TUR_great_east_desc: "Our organization, The Great Eastern Islamic Raiders' Front, vows to bring historic changes to the Turkish nation. No longer will we be held back by imperialist ideology, we will persevere!"
 TUR_dismantle_the_republic: "Desmantelar la República"
 TUR_dismantle_the_republic_desc: "No hay necesidad de una república ahora que estamos a cargo. La república debe ser desmantelada lo antes posible, y los militares deben ser purgados!"
 TUR_ties_with_saud: "Lazos con Saud"
 TUR_ties_with_saud_desc: "No muchos países estarían interesados en mantener lazos con nuestra nación, pero los saudíes son diferentes. Podemos mantener lazos con ellos, ya que comparten una ideología similar a la nuestra, para que nuestro gobierno pueda mantener un nivel de legitimidad internacional."
 TUR_islamic_legacy: "Legado Islámico"
 TUR_islamic_legacy_desc: "El Islam ha tenido una historia muy larga en nuestra nación, y no podemos olvidarlo. Lo utilizaremos para nuestra ventaja con fines ideológicos."
 TUR_combat_imperialism: "Combatir el Imperialismo"
 TUR_combat_imperialism_desc: "Las creencias e ideología imperialistas han penetrado en nuestra gran nación. Combatir estos ideales es la mejor manera de restaurar nuestro país a su antigua gloria"
 TUR_ban_kemalism: "Prohibir Partidos Secularistas"
 TUR_ban_kemalism_desc: "El secularismo es lo que arruinó a esta nación. Al forzar la salida del islam, los secularistas pudieron imponer sus creencias a la nación, pero ya no podrán hacerlo!"
 TUR_demand_hejaz: "Exigir Hejaz"
 TUR_demand_hejaz_desc: "Los saudíes reclaman muchas ciudades importantes en el mundo islámico, y esas ciudades están mayormente ubicadas en Hejaz. Exigiremos que le den a nuestro gobierno el control sobre el territorio si quieren evitar el conflicto"
 TUR_sharia_mandate: "Mandato de la Sharia"
 TUR_sharia_mandate_desc: "Nuestra nación será guiada por los principios del islam, y solo los principios del islam. La ley sharia se implementará una vez más, permitiendo que nuestra nación sea pura y justa nuevamente"
 TUR_one_banner_one_people: "Un Estandarte, Un Pueblo"
 TUR_one_banner_one_people_desc: "Nuestra gente estará unida bajo un solo estandarte, el estandarte del Islam. No hay necesidad de crear división racial en nuestra nación permitiendo varios idiomas"
 TUR_legalize_languages: "Un Estandarte, Muchas Personas"
 TUR_legalize_languages_desc: "Our people are free to speak whatever language they want. We should not cause a racial divide in our land by banning the use of several languages in the state"
 TUR_crack_down_shiism: "Restricciones al Chiismo"
 TUR_crack_down_shiism_desc: "We need to make sure that everyone assimilates into the Sunni sect, even if it means creating restrictions for Shi'ites. We will prohibit Shi'ite practices from public places, and we will fund campaigns that will encourage the Shi'ites to convert"
 TUR_return_of_caliphate: "Regreso del Califato"
 TUR_return_of_caliphate_desc: "El Califato debe regresar y regresará! Nos aseguraremos de que el Califato se reúna una vez más a través de la guerra y la conquista si es necesario. La región ya no será problemática"
 TUR_gender_differations: "Segregar los Géneros"
 TUR_gender_differations_desc: "Debemos crear instalaciones separadas para hombres y mujeres! Ya sea en paradas de autobús, escuelas o el lugar de trabajo, los hombres y las mujeres deben ser segregados por razones religiosas!"
 TUR_enforce_dress_code: "El Código de Vestimenta"
 TUR_enforce_dress_code_desc: "Implementaremos un estricto código de vestimenta que guiará a nuestra nación por el camino de la pureza y la rectitud. Si nuestra gente se viste inapropiadamente, ¿cómo podemos esperar progreso espiritual?"
 TUR_westard: "Expansión hacia el Oeste"
 TUR_westard_desc: "Los otomanos eran débiles y perdieron la parte occidental del Califato. Lo cambiaremos, lo recuperaremos con orgullo y con gran fuerza!"
 TUR_southward: "Expansión hacia el Sur"
 TUR_southward_desc: "Las revueltas árabes y el surgimiento del nacionalismo árabe hicieron difícil para los otomanos controlarlos. Sin embargo, con el surgimiento de nuestro gobierno y nuestra gran fuerza, nos aseguraremos de que no vuelva a suceder"
 TUR_eastward: "Expansión hacia el Este"
 TUR_eastward_desc: "El Este nos fue arrebatado, ya sea por los rusos o los persas. Pero hoy, el Cáucaso es independiente, aunque no lo será por mucho tiempo"
 TUR_african_holdings: "Posesiones Africanas"
 TUR_african_holdings_desc: "The Europeans and their colonial ambitions resulted in the loss of Ottoman African holdings. Unfortunately they were unable to expand or maintain their holds in Africa for very long as a result of the Europeans, but no one is stopping us now"
 TUR_turkish_intervention: "Intervencionismo Turco"
 TUR_turkish_intervention_desc: "The Turkish nation has intervened in several conflicts world wide, and it has helped project Turkish military power, and influence outwards. By intervening in other nations' internal conflicts, we are able to influence the outcomes of those wars to be more favorable for us"
 TUR_intervene_syrian_civilwar: "La Guerra Civil Siria"
 TUR_intervene_syrian_civilwar_desc: "Siria ha estallado en caos, y debido a su cercanía a nuestra nación, sería una tontería quedarnos de brazos cruzados"
 TUR_back_assad: "Apoyar a Assad"
 TUR_back_assad_desc: "Assad es el líder legítimo de Siria, y todos los demás deben considerarse ilegítimos!"
 TUR_back_fsa: "Apoyar al Ejército Sirio Libre"
 TUR_back_fsa_desc: "El Ejército Sirio Libre está luchando por una causa muy justa, la democracia! Debemos apoyarlos de cualquier manera posible, para que puedan ser victoriosos y llevar las alegrías de la libertad al pueblo sirio"
 TUR_intervene_afghan_war: "La Guerra Civil Afgana"
 TUR_intervene_afghan_war_desc: "Afghanistan has been in a civil war for quite some time now, and not much has changed. Perhaps we can sway the outcome to be in our favor."
 TUR_a_new_stance: "Una Nueva Postura"
 TUR_a_new_stance_desc: "Los talibanes han estado luchando para expulsar la influencia y la intervención extranjera en su nación durante mucho tiempo. No es nuestro lugar intervenir y detenerlos. En cambio, debemos apoyar su causa y reforzar sus fuerzas para que puedan liberar su nación de la explotación extranjera"
 TUR_northern_cause: "La Causa del Norte"
 TUR_northern_cause_desc: "The Northern Alliance have been persistent in their efforts of expelling the vile Taliban from Afghanistan. The Taliban will bring nothing but tyranny, injustice, and oppression to Afghanistan, and we must help the Northern alliance defeat the Taliban!"
 TUR_intervene_iraq_war: "Intervención en Irak"
 TUR_intervene_iraq_war_desc: "By exploiting the chaos in Iraq, we will be able to achieve certain goals of ours that have been put on hold for the longest time now."
 TUR_peacekeepers: "Misiones de Mantenimiento de la Paz"
 TUR_peacekeepers_desc: "It would be best for us not to fan the flames any further, as the situation is already pretty bad in Iraq. Instead, we should opt to help the Iraqi people catch a break from the war by sending peace-keeping soldiers to villages and cities in the north."
 TUR_assassinate_abdul_mustafa: "Negociar con los Kurdos"
 TUR_assassinate_abdul_mustafa_desc: "Ever since the Kurds gained autonomy in Northern Iraq back in the 90's, our security forces have been put on high alert due to the boost in morale of Kurdish separatists. By assassinating the governor of Kirkuk we will be able to severely damage Kurdish morale, and resistance."
 TUR_conduct_operation: "Llevar a Cabo una Operación"
 TUR_strike_pkk_bases: "Asaltar Bastiones del PKK"
 TUR_arrest_members: "Arrestar a Miembros Sospechosos del PKK"
 TUR_attack_on_media: "Propaganda Anti-PKK"
 TUR_allow_pkk_bases: "Legalizar el PKK"
 TUR_appease_PKK: "Aplacar al PKK"
 TUR_forbid_pkk_bases: "Prohibir el PKK"
 TurkicConfederation.1.t: "Turquía nos Invita a la Confederación Túrquica"
 TurkicConfederation.1.d: "The Turkish Government has approached us, asking us to join the newly founded Turkic Confederation. Obviously if we do join, we will be united, but we will lose our position as a sovereign country."
 TurkicConfederation.1.a: "Los Pueblos Túrquicos son Uno!"
 TurkicConfederation.1.b: "Es mejor no unirnos..."
 TurkicConfederation.2.t: "Turquía nos Invita a la Confederación Túrquica"
 TurkicConfederation.2.d: "El Gobierno Turco se ha acercado a nosotros, pidiéndonos que nos unamos a la recién fundada Confederación Túrquica. Obviamente, si nos unimos, estaremos unidos, pero perderemos nuestra posición como país soberano.."
 TurkicConfederation.2.a: "Los Pueblos Túrquicos son Uno!"
 TurkicConfederation.2.b: "Es mejor no unirnos..."
 TurkicConfederation.3.t: "Turquía nos Invita a la Confederación Túrquica"
 TurkicConfederation.3.d: "El Gobierno Turco se ha acercado a nosotros, pidiéndonos que nos unimos a la recién fundada Confederación Túrquica. Obviamente, si nos unimos, estaremos unidos, pero perderemos nuestra posición como país soberano.."
 TurkicConfederation.3.a: "Los Pueblos Túrquicos son Uno!"
 TurkicConfederation.3.b: "Es mejor no unirnos..."
 TurkicConfederation.4.t: "Turquía nos Invita a la Confederación Túrquica"
 TurkicConfederation.4.d: "El Gobierno Turco se ha acercado a nosotros, pidiéndonos que nos unamos a la recién fundada Confederación Túrquica. Obviamente, si nos unimos, estaremos unidos, pero perderemos nuestra posición como país soberano.."
 TurkicConfederation.4.a: "Los Pueblos Túrquicos son Uno!"
 TurkicConfederation.4.b: "Es mejor no unirnos..."
 TurkicConfederation.11.t: "Azerbaiyán se Une!"
 TurkicConfederation.11.d: "El Gobierno de Azerbaiyán ha aceptado nuestra oferta de unirse a la Confederación Túrquica. Finalmente estaremos unidos con nuestros hermanos en Azerbaiyán!"
 TurkicConfederation.11.a: "Grandes Noticias para la Confederación Túrquica!"
 TurkicConfederation.21.t: "Kazajistán se Une!"
 TurkicConfederation.21.d: "El Gobierno de Kazajstán ha aceptado nuestra oferta de unirse a la Confederación Túrquica. Finalmente estaremos unidos con nuestros hermanos en Kazajstán!"
 TurkicConfederation.21.a: "Grandes Noticias para la Confederación Túrquica!"
 TurkicConfederation.31.t: "Uzbekistán se une!"
 TurkicConfederation.31.d: "El Gobierno de Uzbekistán ha aceptado nuestra oferta de unirse a la Confederación Túrquica. Finalmente estaremos unidos con nuestros hermanos en Uzbekistán!"
 TurkicConfederation.31.a: "Grandes Noticias para la Confederación Túrquica!"
 TurkicConfederation.41.t: "Turkmenistán se une!"
 TurkicConfederation.41.d: "El Gobierno de Turkmenistán ha aceptado nuestra oferta de unirse a la Confederación Túrquica. Finalmente estaremos unidos con nuestros hermanos en Turkmenistán!"
 TurkicConfederation.41.a: "Grandes Noticias para la Confederación Túrquica!"
 TurkicConfederation.12.t: "Azerbaiyán rechaza la oferta"
 TurkicConfederation.12.d: "El Gobierno de Azerbaiyán ha rechazado nuestra oferta de unirse a la Confederación Túrquica. Parece que tendremos que buscar en otras naciones una posible unificación."
 TurkicConfederation.12.a: "Desafortunado"
 TurkicConfederation.22.t: "Kazajstán rechaza la oferta"
 TurkicConfederation.22.d: "El Gobierno de Kazajstán ha rechazado nuestra oferta de unirse a la Confederación Túrquica. Parece que tendremos que buscar en otras naciones una posible unificación."
 TurkicConfederation.22.a: "Desafortunado"
 TurkicConfederation.32.t: "Uzbekistán rechaza la oferta"
 TurkicConfederation.32.d: "El Gobierno de Uzbekistán ha rechazado nuestra oferta de unirse a la Confederación Túrquica. Parece que tendremos que buscar en otras naciones una posible unificación."
 TurkicConfederation.32.a: "Desafortunado"
 TurkicConfederation.42.t: "Turkmenistán rechaza la oferta"
 TurkicConfederation.42.d: "El Gobierno de Turkmenistán ha rechazado nuestra oferta de unirse a la Confederación Túrquica. Parece que tendremos que buscar en otras naciones una posible unificación."
 TurkicConfederation.42.a: "Desafortunado"
 TUR_flavor_event.1.t: "Colapso Económico Turco!"
 TUR_flavor_event.1.d: "It appears that our economy has collapsed, and we are unable to do anything to save it this instant. We are going to have to devise an economic plan which lets us slowly repair the economy, and set forth a Turkish Economic boom. We have a long road ahead of us, so we will have to get to work as soon as possible."
 TUR_flavor_event.1.a: "Esperemos que este sea el último de nuestros problemas"
 TUR_flavor_event.2.t: "Terremoto Mayor en Bingol"
 TUR_flavor_event.2.d: "A major 6.4 magnitude earthquake has rocked the Eastern city of Bingol. 177 people were killed, 84 of which being the result of a collapsing dormitory block in a boarding school. Roughly 8,000 houses were damaged, and about 4 schools have collapsed. This earthquake must act as a reminder for us to step up our disaster relief program."
 TUR_flavor_event.2.a: "Un día triste para nuestra nación"
 TUR_flavor_event.3.t: "Bombardeo en Estambul!"
 TUR_flavor_event.3.d: "At around 9:30 in the morning about five days ago, two trucks loaded with bombs were detonated in Istanbul. One near Neve Shalom Synagogue, and one in Bet Israel Synagogue. About 28 people have lost their lives, while another 300 were injured. Today, we have gotten news that another 31 people were killed during an attack on the British consulate, and another 450 people were injured. In total, 59 people lost their lives, and 750 more were injured as a result of these attacks."
 TUR_flavor_event.3.a: "¡Terrible!"
 TUR_flavor_event.3.b: "Preparar algo de ayuda"
 TUR_flavor_event.3.c: "Preparar toda la ayuda disponible"
 TUR_flavor_event.4.t: "Introducción de la nueva Lira"
 TUR_flavor_event.4.d: "Recently, a major change to the Lira has been brought about. The Grand National Assembly had voted on the removal of six zeros from the Lira. This means that 1 lira of the new currency is the equivalent of 1,000,000 lira of the old version. However some are doubtful of this new change, and they are arguing that it could do more harm than good to the nation."
 TUR_flavor_event.4.a: "No, este es un buen cambio"
 TUR_flavor_event.4.b: "Lo viejo es oro"
 TUR_flavor_event.5.t: "Asesinato de Hrant Dink"
 TUR_flavor_event.5.d: "Hrant Dink, a Turkish-Armenian journalist, had been assassinated in Istanbul a few days back. He was an activist of minority rights, and a newspaper editor who actively sought out the reconciliation between Armenians, and Turks. The murderer has been identified as a 17 year old male, and he is now under police custody. Hrant's death has sparked outrage amongst the Armenian community within our nation, and today was the funeral where thousands gathered in solidarity."
 TUR_flavor_event.5.a: "Trágico"
 TUR_flavor_event.6.t: "Afluencia de Migrantes"
 TUR_flavor_event.6.d: "Lately, we have been receiving more and more migrants from neighboring countries and abroad due to increasing conflicts. This is starting to slowly destabilize our politics, and some people are even pushing for more aggressive policies. We will have to prepare a response to the series of events."
 TUR_flavor_event.6.a: "¿Cuantos más, mejor?"
 TUR_flavor_event.7.t: "Aumento en el uso de drogas"
 TUR_flavor_event.7.d: "El uso de drogas ha ido creciendo lentamente en ciertas áreas del país, especialmente en las zonas de bajos ingresos. Esto tendrá efectos devastadores, ya que nuestras políticas y leyes sobre el tema están desordenadas."
 TUR_flavor_event.7.a: "Revisar las leyes"
 TUR_flavor_event.8.t: "Incursión en la Flotilla de Gaza"
 TUR_flavor_event.8.d: "Temprano en el día, comandos navales israelíes llevaron a cabo una operación contra varios barcos civiles, matando a 9 ciudadanos turcos a bordo del Mavi Marmara. Las flotillas transportaban ayuda humanitaria en un intento de romper el bloqueo israelí de la Franja de Gaza. Sin embargo, esto no justifica el asesinato de nuestros nacionales, e Israel ha sido muy reacio a dar cualquier tipo de compensación o disculpa..."
 TUR_flavor_event.8.a: "Exigir reparaciones Y una disculpa!"
 TUR_flavor_event.8.b: "Tenemos problemas más grandes en este momento.."
 TUR_flavor_event.81.t: "Turquía exige reparaciones por la Incursión en la Flotilla de Gaza"
 TUR_flavor_event.81.d: "El gobierno turco está enojado porque nuestros comandos abordaron y detuvieron barcos que intentaban romper el bloqueo de la Franja de Gaza. Por supuesto, ellos son los culpables ya que les dimos varias advertencias, pero no les importa."
 TUR_flavor_event.81.a: "Pagar las reparaciones, terminar con esto"
 TUR_flavor_event.81.b: "No vamos a pagar por nada"
 TUR_flavor_event.811.t: "Israel paga reparaciones"
 TUR_flavor_event.811.d: "Israel has agreed to pay reparations to the victims' families and our state as a result of the unjustified raid against the Free Gaza Movement."
 TUR_flavor_event.811.a: "Las reparaciones nunca son suficientes.."
 TUR_flavor_event.812.t: "Israel ignora nuestra solicitud"
 TUR_flavor_event.812.d: "The Israeli government has rebuffed our demands, saying that we have no say in demanding reparations as we were the ones at fault. This is an outrageous statement, but we will not forget this."
 TUR_flavor_event.812.a: "Increíble"
 TUR_flavor_event.9.t: "Terremoto sacude Van"
 TUR_flavor_event.9.d: "Temprano hoy, un terremoto de aproximadamente 7.1 de magnitud sacudió Van. Alrededor de 11,000 edificios resultaron dañados o destruidos, dejando a más de 60,000 personas sin hogar y alrededor de 600 muertos. Desafortunadamente, esto no es inusual ya que nuestras regiones orientales no son ajenas a desastres naturales como los terremotos."
 TUR_flavor_event.9.a: "Una tragedia"
 TUR_flavor_event.9.b: "Movilizar la ayuda en casos de desastre"
 TUR_flavor_event.10.t: "Protestas de Nowruz"
 TUR_flavor_event.10.d: "Kurds across the nation are starting to protest against our government's policies, and they are demanding that we change them to better suit their needs. Obviously they want nothing more but to destroy the Turkish nation, as a lot of these protesters are in favor of the PKK."
 TUR_flavor_event.10.a: "Poner a la policía antidisturbios en espera"
 TUR_flavor_event.10.b: "Dejar que protesten"
 TUR_flavor_event.11.t: "Embajada de EE.UU. atacada!"
 TUR_flavor_event.11.d: "The U.S. Embassy in Ankara has been attacked by a man wearing a vest strapped with explosives. The attack left the suspect, and one Turkish security guard dead, whilst also damaging the building itself by leaving a giant hole on the side of it. The White House has said that it will have to conduct its own investigations as to why it happened, but this should not have happened in the first place."
 TUR_flavor_event.11.a: "No need for an investigation if they're doing one"
 TUR_flavor_event.11.b: "Lanzar nuestra propia investigación"
 TUR_flavor_event.12.t: "Desastre minero en Soma"
 TUR_flavor_event.12.d: "About 2 days ago, a fire was caused by blasting in Soma, at a coal mine. The fire lasted for about 2 days, and rescue missions were mobilized as soon as possible, but were ultimately not very successful due to the thick smoke from the fire. It has been confirmed that about 301 were killed, and luckily, 486 were able to survive. Fingers are being pointed at the inadequate inspections, and officials in charge of inspections."
 TUR_flavor_event.12.a: "Trágico"
 TUR_flavor_event.12.b: "Reestructurar el protocolo de inspección"
 TUR_flavor_event.13.t: "Bombardeos en Ankara"
 TUR_flavor_event.13.d: "A short while ago, 2 bombs were detonated near Ankara Central railway station, leaving 109 civilians dead, and another 500 injured. It appears that the bombs were intended to disrupt a \"Labour, Peace, and Democracy\" rally in Ankara, organized by several groups. Several opposition parties have been blaming our government and our inabilities to prevent the attack, but all we can do for now is make changes where we can."
 TUR_flavor_event.13.a: "Desafortunado"
 TUR_flavor_event.13.b: "Reforzar la seguridad"
 TUR_flavor_event.14.t: "Debate sobre el currículo"
 TUR_flavor_event.14.d: "Conservatives and conservative groups across the nation are demanding that we remove the concept of evolution from our schools' curriculums. This has worried the secularists in our country, with some even saying that this undermines the very foundation of the nation."
 TUR_flavor_event.14.a: "Eliminarlo, ¿qué evidencia tienen de todos modos?"
 TUR_flavor_event.14.b: "Ridículo"
 TUR_flavor_event.15.t: "CASA CN 235 se estrella en Isparta"
 TUR_flavor_event.15.d: "Hace algún tiempo, una Fuerza Aérea CN-235 estaba en una misión de entrenamiento con dos pilotos y un técnico a bordo. Debido a la densa niebla en el área, la tripulación no pudo navegar adecuadamente el camino y, trágicamente, se estrelló, matando a todos los que iban a bordo."
 TUR_flavor_event.15.a: "Realmente desafortunado"
 TUR_flavor_event.15.b: "Realizar algunos cambios"
 TUR_flavor_event.16.t: "Científicos establecen una base en la Antártida"
 TUR_flavor_event.16.d: "A group of our nation's scientists have established a base in Antarctica, marking major scientific progress for our nation!"
 TUR_flavor_event.16.a: "Genial"
 TUR_flavor_event.17.t: "Derechos Kurdos"
 TUR_flavor_event.17.d: "Elementos liberales en nuestra nación han pedido más reformas en cuanto a las leyes kurdas existentes. Piden que las relajemos, facilitando que los partidos kurdos ganen popularidad. Pero grupos más conservadores dicen que debemos mantener el statu quo por estabilidad."
 TUR_flavor_event.17.a: "Las reformas son peligrosas"
 TUR_flavor_event.17.b: "Se necesitan reformas"
 TUR_flavor_event.18.t: "Un cambio en los valores familiares"
 TUR_flavor_event.18.d: "Recientemente, se aprobó una nueva ley que permite a las mujeres convertirse en cabeza de familia. Mientras que este cambio ha complacido a muchos liberales en el país, ha enfurecido a los conservadores. Tenemos una oportunidad única de cambiar esta ley, sea para mejor o para peor."
 TUR_flavor_event.18.a: "Debemos mantener nuestras tradiciones"
 TUR_flavor_event.18.b: "El cambio es necesario"
 TUR_flavor_event.19.t: "Normalización de las relaciones con Armenia"
 TUR_flavor_event.19.d: "After what seemed like forever, the Armenians are opening up to normalize relations between our two countries. Following the Assassination of Hrant Dink, our relations with Armenia took a nosedive, leading to an unnecessary amount of animosity between our two nations. However recently they have begun to move on from the past, and they are open to normalizing relations once more."
 TUR_flavor_event.19.a: "Puede que estén abiertos a normalizar las relaciones, pero yo no"
 TUR_flavor_event.19.b: "Grandes noticias!"
 TUR_flavor_event.20.t: "Gasoducto Trans-Caspio"
 TUR_flavor_event.20.d: "After some convincing from the Americans, Turkmenistan has agreed to allow the construction of a subsea gas pipeline stretching from Turkmenbashi to Adana, Turkey. However, many in the government are sceptical, as they argue that the financial burden will ultimately fall on us, which could possibly put our economy at risk."
 TUR_flavor_event.20.a: "Suena como una gran oportunidad"
 TUR_flavor_event.20.b: "Sí.. No"
 Turkish_Economy.1.t: "Turquía Ofrece Inversiones"
 Turkish_Economy.1.desc: "Turkey has offered to build a civilian factory in one of our provinces as long as we let a Turkish company operate and maintain it, they will get some foreign influence from this but we will also benefit in the long run."
 Turkish_Economy.1.a: "Sí"
 Turkish_Economy.1.b: "No"
 Turkish_Economy.2.t: "Turquía Ofrece Inversiones"
 Turkish_Economy.2.desc: "Turquía ha ofrecido construir una fábrica civil en una de nuestras provincias siempre y cuando dejemos que un turco la opere y mantenga, obtendrán algo de influencia extranjera de esto, pero también nosotros nos beneficiaremos a largo plazo."
 Turkish_Economy.2.a: "Sí"
 Turkish_Economy.2.b: "No, no somos amigos."
 Turkish_Economy.3.t: "Turquía Ofrece Inversiones"
 Turkish_Economy.3.desc: "Turquía ha ofrecido construir una fábrica civil en una de nuestras provincias siempre y cuando dejemos que un turco la opere y mantenga, obtendrán algo de influencia extranjera de esto, pero también nosotros nos beneficiaremos a largo plazo."
 Turkish_Economy.3.a: "Sí"
 Turkish_Economy.3.b: "No"
 Turkish_Economy.4.t: "Turquía Ofrece Inversiones"
 Turkish_Economy.4.desc: "Turquía ha ofrecido construir una fábrica civil en una de nuestras provincias siempre y cuando dejemos que un turco la opere y mantenga, obtendrán algo de influencia extranjera de esto, pero también nosotros nos beneficiaremos a largo plazo."
 Turkish_Economy.4.a: "Sí"
 Turkish_Economy.4.b: "No"
 Turkish_Economy.5.t: "Turquía Ofrece Inversiones"
 Turkish_Economy.5.desc: "Turquía ha ofrecido construir una fábrica civil en una de nuestras provincias siempre y cuando dejemos que un turco la opere y mantenga, obtendrán algo de influencia extranjera de esto, pero también nosotros nos beneficiaremos a largo plazo."
 Turkish_Economy.5.a: "Sí"
 Turkish_Economy.5.b: "No"
 Turkish_Economy.11.t: "Irán Acepta!"
 Turkish_Economy.11.desc: "The Iranians have accepted our offer at investments, and a Turkish company will now operate a civilian factory in Tehran."
 Turkish_Economy.11.a: "Esto ayudará más a la economía iraní que a cualquier otra cosa.."
 Turkish_Economy.22.t: "Armenia Acepta!"
 Turkish_Economy.22.desc: "Surprisingly, the Armenians have accepted our offer, and plans to construct a civilian factory in one of their provinces are now under way!"
 Turkish_Economy.22.a: "Viejos enemigos, Nuevos Amigos."
 Turkish_Economy.33.t: "Georgia Acepta!"
 Turkish_Economy.33.desc: "Georgia ha aceptado nuestra oferta de construir una fábrica civil y también ha acordado que una empresa turca debe operarla."
 Turkish_Economy.33.a: "Bueno"
 Turkish_Economy.44.t: "Bulgaria Acepta!"
 Turkish_Economy.44.desc: "The Bulgarians have agreed to our terms and are now giving us a plot of land to construct civilian factories in!"
 Turkish_Economy.44.a: "Miramos hacia el oeste!"
 Turkish_Economy.55.t: "Grecia Acepta!"
 Turkish_Economy.55.desc: "The Greeks have accepted our offers and are now letting us construct a civilian factory in their land! What a surprise!"
 Turkish_Economy.55.a: "No lo esperábamos, pero genial!"
 Turkish_Economy.111.t: "Irán Rechaza la Oferta!"
 Turkish_Economy.111.desc: "Parece que Teherán no ha aceptado nuestros términos para las inversiones y tendremos que buscar en otro lugar."
 Turkish_Economy.111.a: "Triste"
 Turkish_Economy.222.t: "Armenia Rechaza la Oferta!"
 Turkish_Economy.222.desc: "Como era de esperar, los armenios han rechazado nuestra oferta de construir industrias civiles en su territorio."
 Turkish_Economy.222.a: "Old grudges stunt progress."
 Turkish_Economy.333.t: "Georgia Rechaza la Oferta!"
 Turkish_Economy.333.desc: "Sadly, Georgia has rejected our offer at investments, and it appears we will have to re-evaluate Turkish-Georgian relations."
 Turkish_Economy.333.a: "Desafortunado"
 Turkish_Economy.444.t: "Bulgaria Rechaza la Oferta!"
 Turkish_Economy.444.desc: "Bulgaria ni siquiera nos ha respondido sobre nuestra solicitud de inversiones, así que tendremos que tomar eso como un no de su parte."
 Turkish_Economy.444.a: "Guau"
 Turkish_Economy.555.t: "Grecia Rechaza la Oferta!"
 Turkish_Economy.555.desc: "Parece que Grecia no quiere que ninguna empresa turca opere en su territorio, así que tendremos que quedarnos atrás por ahora."
 Turkish_Economy.555.a: "¿Qué hay de nuevo?"
 TUR_pkk.1.t: "Cumbre de Diyarbakir"
 TUR_pkk.1.d: "La Cumbre de Diyarbakir comenzará esta misma semana; sin embargo, aún no hemos decidido cómo abordaremos al £TUR_Neutral_Communism PKK. Tenemos la capacidad de continuar combatiendo sus intentos de autonomía e independencia, pero algunos también han planteado la idea de llegar a un acuerdo. Hasta ahora, esta idea ha sido mayoritariamente impopular. Las fuerzas armadas han seguido demostrando su disposición para combatir al PKK y evitar la fragmentación de la gran nación turca."
 TUR_pkk.1.a: "¡La cooperación con nuestros vecinos derrotará a los terroristas!"
 TUR_pkk.1.b: "¡No necesitamos ayuda, acabaremos con el PKK nosotros mismos!"
 TUR_pkk.1.c: "Quizás hemos sido demasiado duros con los kurdos..."
 TUR_pkk.2.t: "Turquía propone cooperación en materia de seguridad contra el PKK"
 TUR_pkk.2.d: "The Turkish government announced at its Diyarbakir summit earlier today that it wishes to pursue cooperation with regional nations, including us. Our delegates at the conference have now relayed the information to [ROOT.capital.GetCapitalVictoryPointName], and wish to know the stance that our government will take in order to combat the PKK and its splinter groups in the region."
 TUR_pkk.2.a: "La cooperación es el camino a seguir"
 TUR_pkk.3.t: "[FROM.GetName] ¡Acepta cooperar contra el PKK!"
 TUR_pkk.3.d: "Delegates from [FROM.GetName] firmly shook the hands of our delegates at the Diyarbakir conference, exclaiming that [FROM.capital.GetCapitalVictoryPointName] is eagerly anticipating the first steps to be taken against the PKK and its splinter groups."
 TUR_pkk.3.a: "¡Excelente!"
 TUR_pkk.4.t: "Los delegados de [FROM.GetName] abandonan la cumbre"
 TUR_pkk.4.d: "Delegates from our neighbor, [FROM.GetName], silently left the summit a little while ago. The strange decision is questionable at best, as it raises some concerns within our cabinet about what their intentions really are."
 TUR_pkk.4.a: "¿En realidad?"
 Turkey.1.t: "Özkan Forma un Nuevo Partido"
 Turkey.1.desc: "Después de que [ROOT.GetLeader] llamara públicamente al viceprimer ministro, Özkan anunció que renunciaba a su cargo en el parlamento y en el partido. También anunció que formaría un nuevo partido, el Nuevo Partido de Turquía. Muchos actuales §W[socialism_L]§! MPs ya han anunciado su intención de unirse a él, y muchos también están tratando de unirse al §W[conservatism_L]§!."
 Turkey.1.a: "No lo necesitamos"
 Turkey.1.b: "Hacer tratos entre bastidores con los MPs"
 Turkey.2.t: "Özkan se Retira de la Política"
 Turkey.2.desc: "Después de que [ROOT.GetLeader] llamara públicamente al viceprimer ministro, Özkan anunció que renunciaba a su cargo en el parlamento y en el partido. En una conferencia de prensa posterior, anunció que se retiraría de la política por completo para pasar más tiempo con su familia y en proyectos personales."
 Turkey.2.a: "Nuestra apuesta valió la pena"
 Turkey.3.t: "Golpe de Özkan"
 Turkey.3.desc: "The rumours were true! Özkan and other §W[socialism_L]§! members were planning a coup. After a motion of no-confidence at a party meeting towards [ROOT.GetLeader], he was forced to resign. Özkan has taken his place as Prime Minister of Turkey"
 Turkey.3.a: "Maldito ese hombre!"
 Turkey.4.t: "[Nat_Populism_L] Pide Nuevas Elecciones"
 Turkey.4.desc: "Debido a la situación política de §W[socialism_L]§!, el §W[Nat_Populism_L]§! ha retirado su apoyo a nuestro gobierno de coalición gobernante y está pidiendo nuevas elecciones"
 Turkey.4.a: "Llamar a nuevas elecciones"
 Turkey.4.b: "No necesitamos elecciones, podemos sobrevivir"
 Turkey.5.t: "Elecciones Presidenciales Turcas de 2000"
 Turkey.5.desc: "Las Elecciones Presidenciales de 2000 están en marcha. En Turquía, el Presidente es elegido por el parlamento. Para que un candidato gane, debe recibir una mayoría de dos tercios en una de las dos rondas. Si no hay ganador, la tercera ronda puede ser ganada por una simple mayoría. Si aún no hay un claro ganador, se realizará una cuarta ronda en la que uno de los dos candidatos más populares debe obtener una mayoría. Si aún no hay victoria, se deben celebrar elecciones anticipadas para romper el punto muerto.\n\nEn este momento, cada partido parlamentario presenta a su propio candidato y parece muy poco probable que alguno de ellos salga victorioso."
 Turkey.5.a: "El viceprimer ministro Özkan negociará"
 Turkey.5.b: "Solo tenemos que esperar lo mejor"
 Turkey.6.t: "Ahmet Necdet Sezer Elegido Presidente"
 Turkey.6.desc: "Ahmet Necdet Sezer ha sido elegido como el décimo presidente de la República Turca. Un ex jefe de la Corte Constitucional, su elección fue apoyada por la mayoría de los partidos parlamentarios después de ser convencidos de hacerlo por el viceprimer ministro Özkan. Sezer es un firme defensor del secularismo y partidario de la prohibición del velo"
 Turkey.6.a: "Buen trabajo Özkan"
 Turkey.7.t: "Candidato de [socialism_L] Gana la Presidencia!"
 Turkey.7.desc: "Para sorpresa de todos, Mehmet Mail Büyükerman, el candidato de §W[socialism_L]§! a la Presidencia ganó el voto. Algunos analistas políticos han descrito esto como un milagro. La razón más probable de la victoria de Büyükerman es que los partidos de oposición no querían desestabilizar más al país arriesgándose a nuevas elecciones"
 Turkey.7.a: "Excelente"
 Turkey.8.t: "Presidential Vote Proceeds To Its Fourth Round"
 Turkey.8.desc: "Ningún candidato logró reunir los dos tercios de los votos requeridos en las dos primeras rondas ni la mayoría requerida en la tercera ronda. La contienda ahora se ha reducido a candidatos de §W[socialism_L]§! y §W[Conservative_L]§!. Todavía es muy poco probable que alguno de los candidatos gane, lo que hace que las elecciones anticipadas sean muy probables. Por supuesto, podemos anunciar nuestro apoyo al candidato de §W[Conservative_L]§!. Es prácticamente un suicidio político, pero al menos nos comprará algo de tiempo y nos ahorrará una elección inmediata"
 Turkey.8.a: "Esperemos lo mejor. Otra vez."
 Turkey.8.b: "Throw our weight behind the §W[Conservative_L]§! candidate"
 Turkey.9.t: "Candidato de [Conservative_L] Gana la Presidencia!"
 Turkey.9.desc: "Con el apoyo del §W[socialism_L]§!, el candidato §W[Conservative_L]§! Nevzat Yalçıntaş ha ganado las elecciones presidenciales. Esto sin duda impulsará la popularidad de §W[Conservative_L]§!"
 Turkey.9.a: "Excelente"
 Turkey.10.t: "La Constitución convoca elecciones anticipadas"
 Turkey.10.desc: "Parece que ningún candidato ha reunido suficiente apoyo para ganar el cargo de Presidente. La constitución turca exige que en tal estado se deben celebrar elecciones anticipadas para romper el punto muerto.\n\nEl nuevo parlamento elegirá a un nuevo Presidente con éxito"
 Turkey.10.a: "Maldición"
 Turkey.11.t: "Golpe de Estado militar!"
 Turkey.11.desc: "Earlier today Turkish military units rolled down the streets of Istanbul and occupied several government buildings. The military announced the closure of Istanbul's airspace as Turkish fighter jets patrolled the area. We have reports of Turkish soldiers being deployed to other major cities as well. Some clashes have been reported between soldiers loyal to the current regime and the soldiers partaking in the coup. So far most members of government seem to have avoided capture by the military. There is still hope that forces loyal to the government will disarm these insurgents. Or perhaps not"
 Turkey.11.a: "El ejército está lleno de traidores! Aprehendan a estos criminales!"
 Turkey.11.b: "La causa del ejército es justa! Los gobernantes decadentes deben ser derrocados!"
 Turkey.12.t: "Golpe de Estado militar en Turquía"
 Turkey.12.d: "Tonight, tanks and mechanized units patrol the streets of Istanbul as soldiers station several government buildings. The military has announced the closure of Istanbul's airspace, as fighter jets roam the sky. No noise is to be heard from the streets besides the rumbling of the mechanized engines, as the people sit silently in their homes. A successful military coup in Turkey has ousted the ruling party following its reckless policies, and the military is now consolidating complete control over the country. The military has warned people not to come out to the streets, and they have declared a state of emergency."
 Turkey.12.a: "Interesante"
 Turkey.14.t: "Golpe de Estado militar fallido en Turquía"
 Turkey.14.d: "[TUR.GetLeader] met a large crowd of supporters this morning, as he announced that a military coup had been defeated, made possible only through the might of the Turkish people. [TUR.GetLeader] later announced that several key officers have been identified as prime suspects in this coup attempt, and that everyone else involved is getting investigated. In his speech, [TUR.GetLeader] also mentioned that there will be an \"inspection of all ranks\", and that \"there must be no traitors left\". Though it is unknown what will happen to the officials involved, one thing is for certain, and that is the role of the military in Turkish politics is no more."
 Turkey.14.a: "Interesante"
 Turkey.15.t: "Turquía se sumerge en la guerra civil"
 Turkey.15.d: "Following the latest coup attempt in Turkey, crowds met the tanks rolling down the streets of Istanbul, and tried to halt their march to a government building. The tanks however, did not stop, resulting in several deaths. In other cities within Turkey, citizens have taken up arms and they have begun opening fire at the soldiers stationed in their cities, in an attempt to halt the coup. The military announced that the coup is justified, and that the leader must be overthrown to save the Turkish nation, and some people in the country support them on this. However for now, the scenes in Turkey resemble that of a civil war, rather than just another military coup."
 Turkey.15.a: "Guau"
 Turkey.77.t: "Unificación chipriota!"
 Turkey.77.d: "The Northern Cypriot government has recently consolidated total control of the entirety of Cyprus, both north and south. This comes as they began growing in influence and strength, eventually being able to call for a referendum which let its people unify. Athens has expressed a lot of anger following the move, and they vow to never recognize Northern Cyprus as a legitimate state."
 Turkey.77.a: "Bueno, es algo"
 Turkey.88.t: "Unificación chipriota"
 Turkey.88.d: "The Greek government has recently consolidated total control of the entirety of Cyprus, both north and south. This comes as they began growing in influence and strength, eventually being able to call for a referendum which let its people unify. Turkey has expressed a lot of anger following the move, and they vow to never recognize Greece as the legitimate owners of Cyprus."
 Turkey.88.a: "Interesante"
 Turkey.100.t: "Elecciones generales"
 Turkey.100.d: "Ha llegado el momento para que nuestra gente vote por el próximo partido que ascenderá al poder, ¿quién será?"
 Turkey.100.a: "AKP"
 Turkey.100.b: "CHP"
 Turkey.100.c: "El partido actual está bien"
 TurkeyRandomEvents.1.t: "§W[conservatism_L]§! Sacudido por el escándalo"
 TurkeyRandomEvents.1.desc: "Un video ha comenzado a circular en internet donde el líder de §W[conservatism_L]§!, Deniz Baykal, está en un dormitorio con su antigua secretaria. Como resultado del escándalo, Baykal se ha visto obligado a renunciar a su cargo"
 TurkeyRandomEvents.1.a: "Bueno para nosotros, supongo"
 TurkeyRandomEvents.1.b: "Ese video es falso! Baykal no renunciará!"
 TurkeyRandomEvents.1.c: "No tenemos otra opción"
 TurkeyFocusEvents.1.t: "[FROM.GetName] Ofrece una alianza"
 TurkeyFocusEvents.1.desc: "[FROM.GetName] nos ha ofrecido una alianza contra el imperialismo occidental. Al aliarnos con [FROM.GetName] podríamos tener la oportunidad de reclamar Nagorno-Karabaj"
 TurkeyFocusEvents.1.a: "Somos más fuertes juntos"
 TurkeyFocusEvents.1.b: "No queremos alterar el equilibrio"
 TurkeyFocusEvents.2.t: "[FROM.GetName] exige la retirada de Nagorno-Karabaj!"
 TurkeyFocusEvents.2.desc: "[FROM.GetName] exige que retiremos todas nuestras fuerzas de Nagorno-Karabaj y devolvamos el control del área a Azerbaiyán. Esta es una solicitud audaz, pero la reciente agresión de [FROM.GetName] muestra que están dispuestos a usar la fuerza para alejarnos. No duraremos mucho en una guerra en múltiples frentes"
 TurkeyFocusEvents.2.a: "Debemos ceder"
 TurkeyFocusEvents.2.b: "Lucharemos hasta el último hombre!"
 TurkeyFocusEvents.3.t: "Armenia cede!"
 TurkeyFocusEvents.3.desc: "Armenia has yielded to demands of withdrawing from Nagorno-Karabakh. The area is now once again in control of Azerbaijan"
 TurkeyFocusEvents.3.a: "Genial"
 TurkeyFocusEvents.4.t: "Armenia se aferra a Nagorno-Karabaj"
 TurkeyFocusEvents.4.desc: "Armenia has flatly refused to return Nagorno-Karabakh to Azerbaijan"
 TurkeyFocusEvents.4.a: "Maldición"
 TurkeyFocusEvents.4.b: "Entonces lo tomaremos por la fuerza"
 TurkeyFocusEvents.5.t: "¿Revolución en Irán?"
 TurkeyFocusEvents.5.desc: "We can now successfully spread our revolution in Iran, but how we approach it will change how it will occur drastically."
 TurkeyFocusEvents.5.a: "Una cantidad moderada de armas"
 TurkeyFocusEvents.5.b: "Muchas armas"
 TurkeyFocusEvents.6.t: "¿Revolución en Irak?"
 TurkeyFocusEvents.6.desc: "We can now successfully spread our revolution in Iraq, but how we approach it will change how it will occur drastically."
 TurkeyFocusEvents.6.a: "Una cantidad moderada de armas"
 TurkeyFocusEvents.6.b: "Muchas armas"
 TurkeyFocusEvents.7.t: "¿Revolución en Siria?"
 TurkeyFocusEvents.7.desc: "We can now successfully spread our revolution in Syria, but how we approach it will change how it will occur drastically."
 TurkeyFocusEvents.7.a: "Una cantidad moderada de armas"
 TurkeyFocusEvents.7.b: "Muchas armas"
 TurkeyFocusEvents.8.t: "[FROM.GetName] exige Hatay"
 TurkeyFocusEvents.8.desc: "[FROM.GetName] exige que les devolvamos Hatay. Sin el control del estado, se niegan a entrar en nuestra alianza"
 TurkeyFocusEvents.8.a: "Supongo que no tenemos otra opción"
 TurkeyFocusEvents.8.b: "La nación turca es indivisible!"
 TurkeyFocusEvents.9.t: "[FROM.GetName] Devuelve Hatay"
 TurkeyFocusEvents.9.desc: "[FROM.GetName] nos ha devuelto Hatay"
 TurkeyFocusEvents.9.a: "Un buen día!"
 TurkeyFocusEvents.10.t: "El problema chipriota"
 TurkeyFocusEvents.10.d: "El gobierno turco está presionando más que antes el problema chipriota, y esto ha dejado a nuestro gobierno sin otra opción que responder. Hemos ideado un plan para responder a estas agresiones y los perseguiremos en consecuencia."
 TurkeyFocusEvents.10.a: "Adelante!"
 TurkeyFocusEvents.19.t: "Turquía quiere establecer una zona de amortiguamiento"
 TurkeyFocusEvents.19.d: "The Turkish government wants to establish a buffer zone between our nations' borders. This means we have to completely demilitarize several of our northern provinces, and withdraw all military presence and let the Turks fight off the Kurds."
 TurkeyFocusEvents.19.a: "Es lo mejor.."
 TurkeyFocusEvents.19.b: "Absolutamente no!"
 TurkeyFocusEvents.191.t: "Siria da permiso para una zona de amortiguamiento"
 TurkeyFocusEvents.191.d: "The Syrian government has caved into the pressure, and has allowed us to create a buffer zone between our nations' borders."
 TurkeyFocusEvents.191.a: "Bueno"
 TurkeyFocusEvents.192.t: "Siria no da permiso para una zona de amortiguamiento"
 TurkeyFocusEvents.192.d: "El gobierno sirio ha rechazado nuestra solicitud de establecer una zona de amortiguamiento entre nuestros estados."
 TurkeyFocusEvents.192.a: "Bueno entonces.."
 TurkeyFocusEvents.20.t: "¿Qué debemos hacer con los refugiados?"
 TurkeyFocusEvents.20.d: "Nuestro país actualmente alberga la mayor cantidad de refugiados y, si queremos, podemos utilizarlos como peones políticos. Nuestro vecino del oeste, Grecia, parece ser... poco cooperativo.. y podemos utilizar a algunos de estos refugiados para hacer que cedan a nuestras demandas."
 TurkeyFocusEvents.20.a: "No, esto dañará nuestra reputación"
 TurkeyFocusEvents.20.b: "Enviar solo un poco"
 TurkeyFocusEvents.20.c: "Enviar muchos de ellos"
 TurkeyFocusEvents.21.t: "¿Posible solución para la disputa de Karabaj?"
 TurkeyFocusEvents.21.d: "El gobierno turco ha venido a nosotros con un posible acuerdo de compromiso que podemos hacer con los armenios. Podemos darles a los armenios nuestro enclave de Najicheván a cambio del control sobre la región de Karabaj."
 TurkeyFocusEvents.21.a: "Claro, veamos qué piensan los armenios"
 TurkeyFocusEvents.21.b: "Absolutamente no!"
 TurkeyFocusEvents.212.t: "Azerbaiyán propone una solución para la disputa de Karabaj"
 TurkeyFocusEvents.212.d: "[TUR.GetName] se reunió con [AZE.GetName] hace unos días y propuso una posible solución para la disputa de Karabaj entre nosotros y los azeríes. En esta oferta, renunciaremos a nuestras reclamaciones sobre Karabaj y se la entregaremos a los azeríes, a cambio de que Najicheván se una a Armenia una vez más."
 TurkeyFocusEvents.212.a: "No vemos por qué no"
 TurkeyFocusEvents.212.b: "Absolutamente no!"
 TurkeyFocusEvents.213.t: "Disputa de Karabaj resuelta!"
 TurkeyFocusEvents.213.d: "Grandes noticias han llegado desde la embajada armenia, ya que los diplomáticos nos informaron que han aceptado los términos establecidos en nuestro acuerdo sobre la región de Karabaj!"
 TurkeyFocusEvents.213.a: "Maravilloso"
 TurkeyFocusEvents.214.t: "La disputa de Karabaj continúa.."
 TurkeyFocusEvents.214.d: "Unfortunately it seems the Karabakh dispute will continue to harm Azeri and Armenian relations, as both sides have failed to come to an agreement."
 TurkeyFocusEvents.214.a: "Bastante desafortunado.."
 TurkeyFocusEvents.69420.t: "A través de los problemas"
 TurkeyFocusEvents.69420.d: "Our nation has seen it all, wars, conquest, humiliation, glory, and everything in between. The Dawn of the new Millennium is upon us, and the Turkish nation cannot afford to falter, we must adapt and adjust to the new times, otherwise our state may be swept by the winds of history. Our next presidential election is coming up shortly, and the victor will decide if we hold on to Ataturk's dream for a great Turkish Republic."
 TurkeyFocusEvents.69420.a: "Sendeleyemeyiz!"
 TurkeyFocusEvents.22.t: "Mitin pro-AKP en Estambul!"
 TurkeyFocusEvents.22.d: "Hoy hubo un mitin pro-AKP en Estambul mostrando apoyo al partido. Las personas en esta protesta también pedían que el AKP se separara de su coalición con Hizmet."
 TurkeyFocusEvents.22.a: "Los gulenistas no están contentos.."
 TurkeyFocusEvents.23.t: "Gülenist supporters gather at a mosque!"
 TurkeyFocusEvents.23.d: "Gülenist supporters held a gathering at one of the mosques and were calling for the party to distance itself from its coalition with the AKP party."
 TurkeyFocusEvents.23.a: "Los seguidores del AKP no están muy contentos..!"
 TurkeyFocusEvents.24.t: "¿Alianza con el FP?"
 TurkeyFocusEvents.24.d: "El partido FP fue prohibido antes de nuestro ascenso a la política y parece que sus miembros no se han ido a ninguna parte. La mayoría de ellos siguieron adelante y comenzaron a unirse al \"SP\", otro grupo islamista de línea dura. Podemos invitar a algunos de sus miembros a unirse a nosotros en el gobierno de la nación turca."
 TurkeyFocusEvents.24.a: "No es mala idea.."
 TurkeyFocusEvents.24.b: "No lo creo"
 TurkeyFocusEvents.25.t: "¿Con quién hacemos tratos?"
 TurkeyFocusEvents.25.d: "Está en nuestro mejor interés abrirnos a posibles inversiones en Turquía. Podemos solicitar que empresas iraníes o saudíes vengan y se establezcan en nuestras provincias orientales con fines mineros y de perforación."
 TurkeyFocusEvents.25.a: "Invitar a empresas saudíes de perforación"
 TurkeyFocusEvents.25.b: "Invitar a empresas mineras iraníes"
 TurkeyFocusEvents.26.t: "Nuestro apoyo a Kosovo"
 TurkeyFocusEvents.26.d: "Tendremos que seguir acciones adicionales contra el gobierno que actualmente ocupa Kosovo. Es nuestro deber como nación amante de la libertad difundir nuestras creencias a otros y, por esta razón, tendremos que sancionar a sus ocupantes o enviar una misión militar a Kosovo."
 TurkeyFocusEvents.26.a: "Enviar una misión militar a Kosovo"
 TurkeyFocusEvents.26.b: "Sanciones, sanciones y más sanciones!"
 TurkeyFocusEvents.27.t: "Acciones contra Arabia Saudita"
 TurkeyFocusEvents.27.d: "The Saudi government had designated us as a terrorist organization before our rise to power due to pressure from the AKP party. We cannot let such an action go un-noticed. We will organize a proper response to really show them who's in charge."
 TurkeyFocusEvents.27.a: "Financiar a los trabajadores petroleros para que puedan hacer huelga"
 TurkeyFocusEvents.27.b: "Financiar a grupos pro democracia para la inestabilidad política"
 TurkeyFocusEvents.28.t: "Turquía quiere que enviemos de vuelta a los miembros del PKK!"
 TurkeyFocusEvents.28.d: "The Turkish government has asked us to send back members of the Kurdish PKK party, who are currently seeking refuge in Sweden. If we want to improve relations with the Turks we can send them.. but things will start looking ugly for us when the EU condemns us."
 TurkeyFocusEvents.28.a: "Envíalos de vuelta"
 TurkeyFocusEvents.28.b: "Es mejor que no"
 TurkeyFocusEvents.29.t: "El gobierno sueco acepta enviar de vuelta a los miembros del PKK!"
 TurkeyFocusEvents.29.d: "El gobierno sueco ha aceptado deportar a los miembros del PKK que actualmente buscan refugio en su estado, para que podamos lidiar con ellos nosotros mismos."
 TurkeyFocusEvents.29.a: "Bueno"
 TurkeyFocusEvents.30.t: "El gobierno sueco se niega a enviar de vuelta a los miembros del PKK!"
 TurkeyFocusEvents.30.d: "The Swedish Government has refused to send back the PKK members they are currently harboring. This will not go un-noticed by us."
 TurkeyFocusEvents.30.a: "Se arrepentirán de esto!"
 TurkeyFocusEvents.31.t: "Avivar las llamas en Irán!"
 TurkeyFocusEvents.31.d: "Today we have at our disposal.. A lot of guns. And we can send a couple of these weapons to the Rebels in Khuzestan, so we can cripple Iran's oil industry. But the question is, how much support do we really want to give these guys, and how much damage can we make them do? "
 TurkeyFocusEvents.31.a: "No demasiado"
 TurkeyFocusEvents.31.b: "Darlo todo!"
 TurkeyFocusEvents.32.t: "Turquía quiere establecer relaciones!"
 TurkeyFocusEvents.32.d: "The Turkish government is willing to establish relations, and is asking us not to be hostile towards the PKK group, which is quite the request."
 TurkeyFocusEvents.32.a: "Claro.."
 TurkeyFocusEvents.32.b: "No, esto es demasiado arriesgado!"
 TurkeyFocusEvents.321.t: "Los peshmerga mantienen la hostilidad!"
 TurkeyFocusEvents.321.d: "The Peshmerga would rather maintain their hostility towards us, rather than fix them! We will not forget this, and they will regret it soon."
 TurkeyFocusEvents.321.a: "Tontos!"
 TurkeyFocusEvents.322.t: "Los peshmerga cooperan!"
 TurkeyFocusEvents.322.d: " Sorprendentemente, los peshmerga han decidido cooperar con nosotros y han establecido ciertos lazos formales, aunque son una región autónoma."
 TurkeyFocusEvents.322.a: "Muy bien"
 TurkeyFocusEvents.33.t: "Los peshmerga.."
 TurkeyFocusEvents.33.d: "Los peshmerga son otro grupo de kurdos, situado justo debajo de nuestro Kurdistán de Anatolia. Representan una amenaza tan grande como el PKK, pero esa es la menor de nuestras preocupaciones ahora, ya que estamos trabajando con el PKK para encontrar una solución. Los peshmerga serán una amenaza enorme para nosotros y tendremos que enfrentarlos antes de que sea demasiado tarde."
 TurkeyFocusEvents.33.a: "Haremos una operación"
 TurkeyFocusEvents.33.b: "We'll do an operation, with the Iraqis"
 TurkeyFocusEvents.331.t: "Turkey offers joint operation against Peshmerga"
 TurkeyFocusEvents.331.d: "El gobierno turco nos está solicitando que nos unamos a ellos en una operación para lidiar con los peshmerga en el norte de nuestro país."
 TurkeyFocusEvents.331.a: "Absolutamente!"
 TurkeyFocusEvents.331.b: "Absolutely not!"
 TurkeyFocusEvents.332.t: "Irak se niega a unirse a nuestra operación!"
 TurkeyFocusEvents.332.d: "Irak no está dispuesto a ayudarnos a combatir a los peshmerga, lo que solo significa que tendremos que hacerlo todo nosotros mismos"
 TurkeyFocusEvents.332.a: "Oh, bueno.."
 TurkeyFocusEvents.34.t: "La era digital de Turquía!"
 TurkeyFocusEvents.34.d: "La world wide web ha ido expandiéndose más y más, día tras día. Esto significa que debemos mantenernos al ritmo de dicha expansión, a medida que el mundo se conecta cada vez más. Nuestros ciudadanos no son diferentes a los de otros países europeos y debemos demostrarles eso a nuestra gente ampliando su infraestructura de internet. La pregunta es, ¿en cuánto?"
 TurkeyFocusEvents.34.a: "Ampliarla solo en algunas áreas"
 TurkeyFocusEvents.34.b: "Ampliarla tanto como sea posible"
 TurkeyFocusEvents.35.t: "Turquía nos invita a la Unión Turco-Siria!"
 TurkeyFocusEvents.35.d: "El nuevo gobierno turco, encabezado por una mayoría chiíta, ha venido y nos ha pedido que nos unamos a ellos en una Unión Turco-Siria, ya que nuestras poblaciones comparten muchas similitudes. En tiempos recientes, han decidido devolvernos Hatay, lo cual fue un gran movimiento, pero ahora quieren hacernos parte de ellos!"
 TurkeyFocusEvents.35.a: "Sí, nos uniremos"
 TurkeyFocusEvents.35.b: "No"
 TurkeyFocusEvents.351.t: "Los sirios aceptan unirse a nosotros!"
 TurkeyFocusEvents.351.d: "El gobierno sirio se ha dado cuenta de las similitudes entre nuestros pueblos y han aceptado unirse a nosotros en la Unión Turco-Siria!"
 TurkeyFocusEvents.351.a: "Al fin.."
 TurkeyFocusEvents.352.t: "Siria rechaza nuestra propuesta!"
 TurkeyFocusEvents.352.d: "The Syrian government has foolishly rejected our proposal to join a union together. They clearly do not know what is good for Shias in the region!"
 TurkeyFocusEvents.352.a: "Maldita sea! A la guerra!"
 TurkeyFocusEvents.36.t: "Las mafias galesa y escocesa forman sus propios estados!"
 TurkeyFocusEvents.36.d: "It appears the Anatolian Syndicate has funded and trained the Scottish and Welsh mafias just right under our nose. We failed to catch on and stop them in a timely manner, and therefore we are now going to have to make a decision."
 TurkeyFocusEvents.36.a: "Nuestro Reino es uno UNIDO!"
 TurkeyFocusEvents.36.b: "No vale la pena"
 TurkeyFocusEvents.37.t: "El Sindicato Anatolio nos advierte sobre Australia!"
 TurkeyFocusEvents.37.d: "The Anatolian Syndicate are warning us about an incoming attack from the Australians. Obviously this could all be a lie, considering that they are a Mafia state. But there is also a chance they aren't lying."
 TurkeyFocusEvents.37.a: "No pueden estar mintiendo!"
 TurkeyFocusEvents.37.b: "No.. Están mintiendo obviamente"
 TurkeyFocusEvents.38.t: "Turquía quiere que los ayudemos a combatir a Israel!"
 TurkeyFocusEvents.38.d: "Turkey is requesting that our forces, along with our allies, help take down the Israelis. This is a very surprising move, but not unexpected after Islamists took over Turkey in the latest election."
 TurkeyFocusEvents.38.a: "Un día que hemos estado esperando.."
 TurkeyFocusEvents.38.b: "El momento no es el adecuado"
 TurkeyFocusEvents.39.t: "Irán acepta!"
 TurkeyFocusEvents.39.d: "Irán ha acordado ayudar a nuestras fuerzas a combatir a Israel. También llamarán a sus aliados, lo cual será de gran ayuda para nuestras fuerzas."
 TurkeyFocusEvents.39.a: "Bueno"
 TurkeyFocusEvents.40.t: "Irán Rechaza"
 TurkeyFocusEvents.40.d: "En un giro impactante, Irán ha decidido no ayudarnos a combatir a Israel. Esto ha dejado a nuestros diplomáticos muy confundidos, ya que Irán ha estado pidiendo la caída de los israelíes durante décadas..."
 TurkeyFocusEvents.40.a: "De acuerdo"
 TurkeyFocusEvents.381.t: "Irán está combatiendo a Israel"
 TurkeyFocusEvents.381.d: "Iran is fighting Israel, and they want to use our land to attack, and since they are our ally, it is best that we cooperate to take down the Israeli menace."
 TurkeyFocusEvents.381.a: "Hemos estado esperando esto.."
 TurkeyFocusEvents.381.b: "No"
 TurkeyFocusEvents.81.t: "Turquía nos invita a la OTM"
 TurkeyFocusEvents.81.desc: "La OTM, o conocida también como la Organización del Tratado Mediterráneo, fue fundada recientemente por Turquía. Nos están invitando a unirnos a su alianza y convertirnos en un miembro completo. Si lo hacemos, nuestra seguridad estará garantizada por todos los demás miembros, ya que es un pacto defensivo."
 TurkeyFocusEvents.81.a: "Sí, pero solo si devuelven Hatay"
 TurkeyFocusEvents.81.b: "No"
 TurkeyFocusEvents.41.t: "Turquía nos invita a la OTM"
 TurkeyFocusEvents.41.d: "La OTM, o conocida también como la Organización del Tratado Mediterráneo, fue fundada recientemente por Turquía. Nos están invitando a unirnos a su alianza y convertirnos en un miembro completo. Si lo hacemos, nuestra seguridad estará garantizada por todos los demás miembros, ya que es un pacto defensivo."
 TurkeyFocusEvents.41.a: "Deberíamos unirnos"
 TurkeyFocusEvents.41.b: "No"
 TurkeyFocusEvents.411.t: "Irak no está interesado"
 TurkeyFocusEvents.411.d: "Parece que Irak no está interesado en unirse a la OTM, nuestra alianza."
 TurkeyFocusEvents.411.a: "De acuerdo"
 TurkeyFocusEvents.42.t: "Turquía nos invita a la OTM"
 TurkeyFocusEvents.42.d: "La OTM, o conocida también como la Organización del Tratado Mediterráneo, fue fundada recientemente por Turquía. Nos están invitando a unirnos a su alianza y convertirnos en un miembro completo. Si lo hacemos, nuestra seguridad estará garantizada por todos los demás miembros, ya que es un pacto defensivo."
 TurkeyFocusEvents.42.a: "Deberíamos unirnos"
 TurkeyFocusEvents.42.b: "No"
 TurkeyFocusEvents.421.t: "Egipto no está interesado"
 TurkeyFocusEvents.421.d: "Egypt has turned down our invitation to the MTO."
 TurkeyFocusEvents.421.a: "De acuerdo"
 TurkeyFocusEvents.43.t: "Turquía nos ha invitado a la CIB"
 TurkeyFocusEvents.43.d: "El gobierno turco ha fundado recientemente la CIB, que significa Confederación para el Bienestar Islámico. El objetivo principal es aumentar la cooperación entre las naciones islámicas y mejorar el bienestar de los musulmanes en la región."
 TurkeyFocusEvents.43.a: "Inscríbeme"
 TurkeyFocusEvents.43.b: "No"
 TurkeyFocusEvents.44.t: "La CIB está invirtiendo en nuestra infraestructura!"
 TurkeyFocusEvents.44.d: "The CIW is investing in our nation's abilities to build proper infrastructure and facilities for our people."
 TurkeyFocusEvents.44.a: "Genial"
 TurkeyFocusEvents.45.t: "La CIB entrega suministros de emergencia!"
 TurkeyFocusEvents.45.d: "La CIB ha entregado suministros de emergencia para cualquier desastre entrante u ocurrente dentro de la organización."
 TurkeyFocusEvents.45.a: "Genial"
 TurkeyFocusEvents.46.t: "La CIB está invirtiendo en nuestra educación!"
 TurkeyFocusEvents.46.d: "The CIW has invested in our nation's education sector, making it easier for people to go to school."
 TurkeyFocusEvents.46.a: "Genial"
 TurkeyFocusEvents.47.t: "La CIB está invirtiendo en nuestra salud!"
 TurkeyFocusEvents.47.d: "The CIW is now investing in our nation's healthcare system, providing medical supplies and facilities to more people."
 TurkeyFocusEvents.47.a: "Genial"
 TurkeyFocusEvents.48.t: "La CIB está invirtiendo en nuestras industrias!"
 TurkeyFocusEvents.48.d: "The CIW is now investing in our nation's industrial sector, which lets our factories provide more goods."
 TurkeyFocusEvents.48.a: "Genial"
 TurkeyFocusEvents.49.t: "[FROM.GetName] está dejando la CIB"
 TurkeyFocusEvents.49.d: "[FROM.GetName] ha decidido que es mejor para su nación retirarse de la CIB."
 TurkeyFocusEvents.49.a: "Bueno, se lo van a perder"
 TurkeyFocusEvents.50.t: "Turquía quiere establecer bases militares"
 TurkeyFocusEvents.50.d: "El gobierno turco está solicitando que les permitamos estacionar sus tropas en nuestra nación."
 TurkeyFocusEvents.50.a: "¿Por qué no?"
 TurkeyFocusEvents.50.b: "No"
 TurkeyFocusEvents.501.t: "Qatar rechaza nuestra solicitud"
 TurkeyFocusEvents.501.d: "Qatar no permite que nuestras tropas se estacionen en su territorio."
 TurkeyFocusEvents.501.a: "Desafortunado"
 TurkeyFocusEvents.53.t: "Fallece Osman V"
 TurkeyFocusEvents.53.d: "Hoy se ha extendido una terrible noticia por Konstantiniyye, ya que la gente se entera del fallecimiento de Osman V. Aunque su muerte trae una gran tristeza al pueblo, Beyezid III continuará con su legado."
 TurkeyFocusEvents.53.a: "El trono cambia"
 TurkeyFocusEvents.54.t: "Fallece Beyezid III"
 TurkeyFocusEvents.54.d: "Hoy hemos conocido tristemente el fallecimiento de Beyezid III. La gente está de luto en las calles y la tristeza se ha extendido por la nación. Sin embargo, no toda esperanza está perdida, ya que Dundar I será coronado poco después del período de luto nacional, marcando el inicio de su reinado."
 TurkeyFocusEvents.54.a: "El trono cambia una vez más.."
 TurkeyFocusEvents.55.t: "El Califato Anatolio exige Hejaz"
 TurkeyFocusEvents.55.d: "The Anatolian Caliphate has come and demanded that we give them Hejaz, arguably our most important state. It would be incredibly foolish of us to give this state away, and quite frankly, we don't even know what they will do if we don't."
 TurkeyFocusEvents.55.a: "¿Qué tipo de solicitud es esa?"
 TurkeyFocusEvents.55.b: "Bueno.. Queremos evitar el conflicto, ¿verdad?"
 TurkeyFocusEvents.56.t: "[SAU.GetName] cede"
 TurkeyFocusEvents.56.d: "[SAU.GetName] has given in to our demands. We will be receiving Hejaz, and in return, we will not be attacking them."
 TurkeyFocusEvents.56.a: "Bueno"
 TurkeyFocusEvents.57.t: "[SAU.GetName] rechaza nuestras demandas!"
 TurkeyFocusEvents.57.d: "[SAU.GetName] ha rechazado tontamente nuestras demandas y, debido a eso, no nos queda otra opción!"
 TurkeyFocusEvents.57.a: "Ellos lo pidieron"
 TurkeyFocusEvents.58.t: "Tratando con Abdul Rahman Mustafa"
 TurkeyFocusEvents.58.d: "Iraq is currently at its most vulnerable, as the Americans are actively engaged in a conflict with them, crippling their security. This gives us a great opportunity to move in, and take out the governor of Kirkuk, a major city in Iraqi-Kurdistan. If we are successful, we will be able to seriously damage Kurdish morale, and subsequently the PKK's morale."
 TurkeyFocusEvents.58.a: "Envía a unos agentes disfrazados de civiles"
 TurkeyFocusEvents.58.b: "Envía agentes bien entrenados y elabora un plan de escape"
 TurkeyFocusEvents.58.c: "Let's just forget about this plan entirely."
 TurkeyFocusEvents.59.t: "Abdul Mustafa asesinado"
 TurkeyFocusEvents.59.d: "Nuestros agentes lograron asesinar con éxito a Abdul Rahman Mustafa, el gobernador de Kirkuk."
 TurkeyFocusEvents.59.a: "Bueno"
 TurkeyFocusEvents.60.t: "Los estadounidenses capturan a nuestros agentes!"
 TurkeyFocusEvents.60.d: "Earlier today, soldiers from America's 173rd Airborne Brigade kicked down the doors of our agents' safehouse in the Kurdish city of Sulaymaniyah, and took them into custody. This has been dubbed as the \"Hood Event\" by the media, and our relations with the Americans have been negatively affected."
 TurkeyFocusEvents.60.a: "Maldición"
 Turkish_mafia.1.t: "La mafia causa un escándalo!"
 Turkish_mafia.1.d: "The Mafia has caused a scene in one of our bigger cities, which resulted in the death of a few individuals. Though it is currently unknown who committed this crime, our police force is very eager to go and hunt them down, despite the risks involved."
 Turkish_mafia.1.a: "Es mejor no causar más problemas.."
 Turkish_mafia.1.b: "Quiero una investigación completa, ahora!"
 Turkish_mafia.1.c: "Asigna todos los recursos que puedas"
 Turkish_mafia.11.t: "Búsqueda policial infructuosa"
 Turkish_mafia.11.d: "Our police force was unsuccessful in their search for the mobsters responsible for the crime committed a few days ago. This has made a few mobsters believe they are un-touchable, therefore increasing the Mafia's influence in the country."
 Turkish_mafia.11.a: "¡Qué incompetencia!"
 Turkish_mafia.12.t: "La policía aprehende sospechosos"
 Turkish_mafia.12.d: "The locals let out a sigh of relief today, as the police chief has recently announced the apprehension of several criminals and suspects, regarding a series of murders committed a few days ago. Several individuals affiliated with the Mafias are now aware of the effectiveness in our police force, and it'll make others think twice before joining the Mafia."
 Turkish_mafia.12.a: "Muy bien"
 Turkish_mafia.2.t: "Los detectives descubren un escondite de la mafia"
 Turkish_mafia.2.d: "Un detective en una de las ciudades rurales ha informado que ha encontrado un posible escondite de la mafia. La policía está tratando rápidamente de organizar una respuesta, ya que no saben qué habrá en ese escondite, o si realmente es un escondite de la mafia. Es muy probable que la mafia esté conectada con el lugar, pero, no obstante, siempre tendrá riesgos involucrados."
 Turkish_mafia.2.a: "Algunas cosas es mejor dejarlas como están.."
 Turkish_mafia.2.b: "What do you mean they're scrambling a response? Prepare one, and do it quickly!"
 Turkish_mafia.2.c: "Asigna todos los recursos que puedas"
 Turkish_mafia.21.t: "La policía sufre bajas!"
 Turkish_mafia.21.d: "It appears that the hideout was an ambush, and there were several gunmen ready to start shooting at our officers. Unfortunately, due to a lack of weapons and sufficient backup, several officers were killed and many more were injured."
 Turkish_mafia.21.a: "Maldición"
 Turkish_mafia.22.t: "Escondite despejado con seguridad!"
 Turkish_mafia.22.d: "Todo ha salido perfectamente en nuestra última operación. El escondite fue rápidamente despejado por nuestras unidades y varios sospechosos que fueron tomados por sorpresa fueron rápidamente aprehendidos por nuestros oficiales."
 Turkish_mafia.22.a: "Genial"
 Turkish_mafia.3.t: "Se descubre un gran alijo de armas!"
 Turkish_mafia.3.d: "Durante una búsqueda en curso, la policía encontró un gran alijo de armas almacenado en un almacén. Varias personas dentro de la comunidad instan a la policía a rastrear de dónde proviene este alijo de armas y arrestar a las personas involucradas."
 Turkish_mafia.3.a: "¿Qué tal si solo tomamos las armas?"
 Turkish_mafia.3.b: "Good idea, start a search immediately!"
 Turkish_mafia.3.c: "Asigna todos los recursos que puedas"
 Turkish_mafia.31.t: "La policía arruina la investigación!"
 Turkish_mafia.31.d: "Due to the lack of coordination, and high levels of incompetence, our police force did not find the criminals that had left their weapons cache. In fact, during the investigation our police force lost a considerable amount of their own weapons! How could this happen you may ask? Well, it appeared that our officers had gone in with a supply van filled with weapons, and someone hijacked the van and drove off!"
 Turkish_mafia.31.a: "¿En serio?"
 Turkish_mafia.32.t: "La policía localiza sospechosos"
 Turkish_mafia.32.d: "It appeared that there was an underground weapon trade happening in one of the more urbanized cities. Luckily, we were able to catch these criminals before any major damage was done."
 Turkish_mafia.32.a: "Este es el estándar"
 Turkish_mafia.4.t: "La policía incauta un cargamento de drogas"
 Turkish_mafia.4.d: "Un grupo de oficiales se topó con un contenedor de carga sospechoso y, cuando lo abrieron, se asombraron. Grandes cantidades de drogas ilegales fueron introducidas de contrabando en el país a través de una red desconocida, y los lugareños están ansiosos por atrapar a los sospechosos."
 Turkish_mafia.4.a: "Bueno.. deben haber sido para uso médico, ¿verdad?"
 Turkish_mafia.4.b: "I want an investigation immediately!"
 Turkish_mafia.4.c: "Asigna todos los recursos que puedas"
 Turkish_mafia.41.t: "Sospechosos detenidos"
 Turkish_mafia.41.d: "Hemos encontrado varios individuos conectados con el gran contenedor de drogas y ahora están siendo interrogados por la policía. Muchos en la comunidad están contentos de saber que las drogas ilegales no plagarán su comunidad."
 Turkish_mafia.41.a: "Todavía tenemos mucho que hacer! Vuelve al trabajo!"
 Turkish_mafia.42.t: "Investigation results in nothing"
 Turkish_mafia.42.d: "After a lengthy investigation, our officers were not able to connect anyone to the drug container. This is a major loss on our end, as now illegal drugs are still being smuggled into the country, and we have no leads!"
 Turkish_mafia.42.a: "Increíble"
 Turkish_mafia.5.t: "La mafia asesina a un alto funcionario"
 Turkish_mafia.5.d: "Tragedy has struck, as the Turkish mafia has assassinated a high ranking official. This will make our party's job much harder than it has to, and our opposition are most likely overcome with excitement."
 Turkish_mafia.5.a: "Maldición"
 Turkish_mafia.6.t: "Atraco de la mafia"
 Turkish_mafia.6.d: "La mafia ha llevado a cabo un atraco en uno de los bancos de nuestro país. Han robado mucho dinero y, al final, han lastimado nuestra economía y a nuestra gente."
 Turkish_mafia.6.a: "Increíble"
 Turkish_mafia.7.t: "Una explosión sacude un centro comercial!"
 Turkish_mafia.7.d: "Fingers are being pointed at the Mafia today, as the police suspect they were behind a bombing attack at a large commercial center. Their goal is unknown, but one thing is for certain, they are causing a lot of problems for the government."
 Turkish_mafia.7.a: "Pero, ¿por qué?"
 Turkish_mafia.8.t: "La policía se enfrenta a la mafia"
 Turkish_mafia.8.d: "Esta mañana, hubo un enfrentamiento muy largo entre nuestra policía y la mafia. Varios oficiales de policía resultaron heridos y algunos incluso fueron asesinados."
 Turkish_mafia.8.a: "¡Terrible!"
 Turkish_mafia.9.t: "El auge de la mafia"
 Turkish_mafia.9.d: "The Mafia has been ramping up its attacks in recent times, and it has quite frankly stressed out our security forces. With people joining the Mafia, and a life of crime now more than ever, it makes you question the validity of our state. A lot of people are demanding that our government step down, but we have a duty to serve and protect our people."
 Turkish_mafia.9.a: "La lucha nunca se detendrá!"
 Turkish_mafia.9.b: "Tal vez tengan razón.."
 Turkish_parties.1.t: "Los partidos liberales ganan impulso"
 Turkish_parties.1.d: "It appears that our people's ideology is becoming more and more liberal, as the liberal parties have begun gaining some more following than before. As a result of this, people are pushing for more liberal policies in our country."
 Turkish_parties.1.a: "De acuerdo"
 Turkish_parties.2.t: "Los partidos conservadores ganan impulso"
 Turkish_parties.2.d: "It appears that our people's ideology is becoming more and more conservative, as the conservative parties have begun gaining some more following than before. As a result of this, people are pushing for more conservative policies in our country."
 Turkish_parties.2.a: "De acuerdo"
 Turkish_parties.3.t: "Los partidos de izquierda ganan impulso"
 Turkish_parties.3.d: "It appears that our people's ideology is becoming more and more leftist, as the left-wing parties have begun gaining some more following than before. As a result of this, people are pushing for more socialist policies in our country."
 Turkish_parties.3.a: "De acuerdo"
 Turkish_parties.4.t: "Los partidos de derecha ganan impulso"
 Turkish_parties.4.d: "It appears that our people's ideology is becoming more and more nationalist, as the right-wing parties have begun gaining some more following than before. As a result of this, people are pushing for more nationalist policies in our country."
 Turkish_parties.4.a: "De acuerdo"
 Turkish_parties.9.t: "Cambio radical en la política"
 Turkish_parties.9.d: "There has been a drastic, and radical shift in our nation's government, leading to a complete reorganization of our political structure."
 Turkish_parties.9.a: "De acuerdo"
 Turkish_parties.10.t: "Solo la IA debería ver esto"
 Turkish_parties.10.d: "Solo IA"
 Turkish_parties.10.a: "Si ves esto, por favor házanoslo saber"
 TUR_bulent_ecevit_desc: "Bülent Ecevit is a senior politician who has been active in the Turkish political scene since the 1950s. Rising to a leadership in the CHP, he eventually succeeded Ismet Inönü as CHP chairman in 1972 and became Prime Minister in 1974. His government ordered the invasion of Cyprus in 1974, where he gained the nickname 'Conqueror of Cyprus' ('Kıbrıs Fatihi'). Following the military coup of 1980, Ecevit was incarcerated and banned from politics, eventually rejoining the scene in 1987 by taking the chairman position of DSP from his wife Rahsan. Finally in 1999, he regained the position of Prime Minister of Turkey, after his party's popularity soared with the capture of PKK leader Abdullah Öcalan.\n\nEcevit is also an adamant poet and writer, having written many books on both subjects, and translating many poems into Turkish.\n\nEcevit never finished his university degree, making it impossible for him to ever run for President."
 TUR_zeki_sezer_desc: "Zeki Sezer es un exministro de Estado del gobierno de Ecevit."
 TUR_husamettin_ozkan_desc: "Hüsamettin Özkan fue el Viceprimer Ministro en el gobierno de Bülent Ecevit, también se desempeñó como Ministro de Estado antes de eso. Özkan es de ascendencia circasiana y su hermano Necdet ha servido como alcalde en uno de los distritos de Estambul."
 TUR_fethullah_gulen_desc: "Fethullah Gülen es el líder del Hizmet, o el movimiento Gülenista. Una vez un imán local en Turquía, Gülen se ha convertido en un erudito influyente. Su organización abarca todo el globo y funciona de una manera muy descentralizada. Gülen mismo no se ve tanto como un líder y, según sus propias palabras, simplemente 'habló sobre lo que creo. Porque tenía sentido, la gente lo captó por sí misma'."
 TUR_deniz_baykal_desc: "Deniz Baykal started his political career in 1973, when he was elected to the Turkish Parliament as the youngest MP under the party CHP. The CHP originally noticed him as Baykal wrote his docent thesis on the subject of why the CHP had lost the 1965 election. After the 1980 military coup, Baykal was shortly imprisoned and banned from politics, but in 1987 he was allowed to re-enter, and he joined the Social Democratic People's Party.\n\nIn 1992, the law prohibiting the refounding of previously dismembered parties was overturned and Baykal (along with many other ex-CHP politicians), refounded the CHP.\n\nOften described as being the 'Old Guard' of CHP, many have blamed Baykal for the lack of success of CHP, as many of his policies do not match contemporary Turkey."
 TUR_Kemal_Kilicdaroglu_desc: "Kemal Kılıçdaroğlu was elected as the leader of CHP after a scandal forced Deniz Baykal to resign his position. Kılıçdaroğlu has actively challenged the AKP, and has actively vowed to reveal the corruption of the party's politicians. Kılıçdaroğlu has also aimed to move CHP back to its leftist oriented roots. However, Kılıçdaroğlu's actions do not always match his words, as he has been seen waving a Grey Wolves flag and he supports the deportation of all Syrian refugees."
 TUR_Ufuk_Uras_desc: "Ufuk Uras is an economist and a graduate of the Istanbul University. Uras has been the chairman of ÖDP since 1996."
 TUR_abdullah_levent_tuzel_desc: "Abdullah Tüzel fue uno de los miembros fundadores de EMEP en 1996 y ha estado liderando el partido desde entonces. Antes de la política, Tüzel se empleó como abogado independiente. También ha sido miembro de la junta ejecutiva de la Fundación de Derechos Humanos de Estambul y presidente de la Asociación de Abogados Modernos de Estambul."
 TUR_dogu_perincek_desc: "Doğu Perinçek es el fundador del Partido de los Trabajadores IP y es abogado de profesión. Perinçek es conocido por sus actitudes antioccidentales y sus ideas kemalistas de línea dura combinadas con el maoísmo. También niega fervientemente la existencia del genocidio armenio y es miembro del Comité Talat Pasha, una organización nombrada en honor al presunto perpetrador principal del genocidio.\n\nPerinçek quiere crear una fuerza de contrapeso contra el imperialismo estadounidense en Medio Oriente."
 TUR_Necmeddin_Erbakan_desc: "Necmettin Erbakan is the founder of the Millî Görüş (National Vision) religious-political movement, which creates the foundation of his party. Erbakan is a long time leader of multiple Islamist political parties in Turkey, most of which have been banned shortly after their founding. Erbakan even served shortly as the Prime Minister, before being forced to step down by the military.\n\nErbakan's main policy is conservative Islam, and he wishes to shift focus from focusing on European countries to more cooperation with other Muslim nations, even going as far as creating an organization to rival NATO in the Middle East and a common currency called the dinar.\n\nIn early 2000s, Erbakan spent a little over 2 years in prison after being sentenced for embezzlement. The so called 'Lost Trillion Case' arose when his previous party, the Welfare Party, forged documents claiming that 1 trillion in Turkish lira of state sponsored party funds had been used for party activities in order to avoid having to return the funds after the party was banned in 1997."
 anti_imperialist_vanguard_faction: "Vanguardia Antiimperialista"
 TUR_northern_cyprus_annexed: "Anexión de Chipre del Norte"
 TUR_afrin: "Anunciar Operaciones Anti-Kurdas en Siria"
 TUR_afrin_desc: "Kurdish terrorists go by many names, but that does not mean they do not share the same ideals as each other. The PKK has always been a threat to Turkey and it will remain a threat until it along with its allies in the YPG, PYD, SDF, et cetera, are destroyed. It starts with Afrin, gather the troops."
 TUR_afrin2: "Lanzar Operación Rama de Olivo"
 TUR_afrin2_desc: "If the Kurds cannot learn to accept their failure and defeat, they will continue to attack Turkey and its people, and this is where we must draw the line. Olive Branch will put an end to Kurdish terror attacks originating from the YPG held territory of Afrin. The operation is determined to root out and destroy Kurdish terrorists without collateral damage, we must proceed carefully."
 TUR_afrin_d: "Las fuerzas turcas amenazan Afrin"
 TUR_afrin_d_desc: "El asalto turco al pueblo kurdo continúa. La amenaza de una invasión de Afrin es real, ya que el presidente turco [their_country.GetLeader], nos etiquetó, sin sorpresa, como terroristas alineados con el PKK y amenazó con estrangularnos antes de que pudiéramos atacar tierra turca en un ridículo ataque terrorista. Esta no es nuestra manera, pero debemos prepararnos para un ataque de inmediato!"
 TUR_afrin_d2: "Las Fuerzas Turcas Continúan Avanzando"
 TUR_afrin_d2_desc: "They call it \"Operation Olive Branch\", funny how the saying goes that the olive branch is an offer of peace. The Turks know not the meaning of peace, and their campaign of Kurdish oppression continues against the wrong opponent. Alas, if they want to continue this fight, we shall continue to defend ourselves."
 TUR_counter_terrorism_mil: "Operaciones Contraterroristas - Rama Militar"
 strenghten_outposts_1: "Fortalecer Puestos de Avanzada"
 strenghten_outposts_1_desc: "Our outposts in the south-eastern part of our country were built up to stop smuggling from and to Northern Iraq around 1960s. Now, facing terror attacks, they are either too old or at the wrong positions and highly vulnerable to asymmetrical attacks. We need to come up with a solution to this, it may cost a lot of money but will make it up to us with the lives saved. And opposition will surely try and discredit this reform as they always do, saying it will waste our money for no benefit, so there is little room for failure."
 strenghten_outposts_2: "Comenzando con Puestos de Avanzada Fuertes"
 strenghten_outposts_2_desc: "Los primeros de nuestros nuevos puestos de avanzada deben demostrar su efectividad en poco tiempo, por razones políticas. Tal vez construirlos en puntos altos y preferiblemente alrededor de puntos estrechos que los terroristas han estado utilizando para infiltrarse."
 strenghten_outposts_3: "Posiciones críticas primero"
 strenghten_outposts_3_desc: "Algunos de nuestros puestos de avanzada como Aktütün Karakolu son notorios por ser asaltados regularmente por razones estratégicas. Debemos mejorar estas posiciones débiles primero y los terroristas tendrán que hacer nuevos planes."
 strenghten_outposts_4: "Mejoras Adicionales"
 strenghten_outposts_4_desc: "Los nuevos puestos de avanzada demuestran ser suficientes para repeler ataques terroristas o no ser atacados en primer lugar, ahora los terroristas están evitando los fuertes y enfocándose en los más viejos y débiles. Tal vez deberíamos desmantelar los innecesarios y construir puestos de avanzada completamente nuevos en las posiciones necesarias."
 strenghten_outposts_5: "Brillantez Estratégica"
 strenghten_outposts_5_desc: "Attacks on our outposts have been fairly reduced, maybe we can think about building new dams that will hinder terrorists' routes with their lakes, and use these dams as fortified bridges"
 strenghten_outposts_6: "El éxito ama la preparación"
 strenghten_outposts_6_desc: "Nearly every outpost of ours has either been rebuilt or left and razed. Only some final stages needed to polish up some sharp edges and we are done."
 doing_counter_terror_op_mil: "Conducir otra operación militar"
 doing_ext_sec: "Ya realizando una Operación Transfronteriza"
 doing_int_sec: "Ya realizando una Barrida de Seguridad Interna"
 airstrike_prepare: "Preparándose para Ataques Aéreos"
