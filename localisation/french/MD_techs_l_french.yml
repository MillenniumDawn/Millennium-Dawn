 small_medium_gun_tech_5: "Canon de char léger hyper-avancé"
 small_medium_gun_tech_5_desc: "Avec une vitesse à la bouche accrue et des éléments empruntés aux canons de chars principaux, un canon de char léger du futur pourra répondre à presque toute menace sur le champ de bataille."
