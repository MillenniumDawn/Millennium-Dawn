 mercosur.02.t: "Invitation à rejoindre le MERCOSUR en tant qu'État associé"
 mercosur.02.d: "[FROM.GetName] nous a approchés avec une offre d'entrer au MERCOSUR comme État associé. La proposition s'arrête avant l'admission pleine, mais nous placerait dans l'orbite d'un bloc qui tente clairement de retrouver son ancienne ambition. Accepter signalerait que notre avenir est lié, au moins en partie, au projet sud-américain."
 mercosur.02.a: "Accepter le statut d'associé."
 mercosur.02.b: "Refuser pour l'instant."
 mercosur.03.t: "Adhésion associée acceptée"
 mercosur.03.d: "[FROM.GetName] a accepté notre invitation et convenu d'entrer au MERCOSUR comme État associé. Le pas est modeste sur le papier, mais politiquement significatif : une autre capitale a décidé que rester près du bloc est plus sûr que d'en rester entièrement à l'écart."
 mercosur.03.a: "Excellent."
 mercosur.04.t: "Adhésion associée rejetée"
 mercosur.04.d: "[FROM.GetName] a écarté notre offre, du moins pour l'instant. Leur gouvernement préfère la distance à l'enchevêtrement, et l'intérêt pour un alignement plus étroit n'a pas suffi à vaincre la prudence. La porte reste ouverte, mais il faudra la pousser plus tard."
 mercosur.04.a: "Dommage."
 mercosur.05.t: "Pourparlers d'adhésion à part entière ouverts"
 mercosur.05.d: "Des négociations formelles avec [CHL.GetName] ont commencé. Si ces pourparlers réussissent, le MERCOSUR ne se contentera pas de revendiquer une pertinence continentale : il la prouvera en attirant pleinement un autre État dans ses institutions."
 mercosur.05.a: "Continuez."
 mercosur.06.t: "Invitation à rejoindre en tant que membre à part entière"
 mercosur.06.d: "[FROM.GetName] nous a invités à trancher une fois pour toutes la question de l'adhésion pleine au MERCOSUR. Nous pouvons entrer immédiatement, insister sur un paquet plus large de soutien et de préparation avant l'étape finale, ou juger que le moment n'est pas encore venu. Quoi que nous choisissions, la décision dira à quel point nous entendons lier notre avenir au bloc."
 mercosur.06.a: "Accepter immédiatement le statut de membre à part entière."
 mercosur.06.b: "Accepter, mais demander un paquet d'adhésion."
 mercosur.06.c: "Rester seulement un État associé."
 mercosur.07.t: "Forfait d’adhésion demandé"
 mercosur.07.d: "[FROM.GetName] a accepté notre entrée en principe, mais préfère que l'adhésion pleine soit précédée d'un paquet plus large d'investissement, de coordination et de réassurance politique. Leur adhésion se déroulera désormais par étapes, et la façon dont nous la mènerons façonnera le ton de leur relation avec le bloc pour des années."
 mercosur.07.a: "Commencer le travail."
 mercosur.08.t: "Adhésion complète rejetée"
 mercosur.08.d: "[FROM.GetName] a décliné l'adhésion pleine pour l'instant. Par prudence, orgueil ou hésitation intérieure, ils ne sont pas encore prêts à laisser le MERCOSUR devenir une part permanente de leur horizon politique."
 mercosur.08.a: "Nous y reviendrons plus tard."
 mercosur.09.t: "Pourparlers d'adhésion associée ouverts"
 mercosur.09.d: "Nos diplomates ont ouvert des pourparlers avec [PRU.GetName] sur l'adhésion associée au MERCOSUR. La proposition est assez modeste pour paraître pratique, assez significative pour tester si le langage de la solidarité sud-américaine pèse encore dans leur capitale."
 mercosur.09.a: "Continuez."
