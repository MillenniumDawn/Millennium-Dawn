l_polish:
 industrial_complex: "Przemysł cywilny"
 industrial_complex_plural: "Przemysł cywilny"
 industrial_complex_desc: "Budynek ten zapewnia państwu przemysł do produkcji dóbr cywilnych lub budowy nowych budynków. W razie potrzeby można go zmobilizować do produkcji wojskowej.\n\nZapewnia regionowi:\nPodstawową liczba wymaganych pracowników: §Y206§!\nPodstawowa produkcja PKB na §YPrzemysł cywilny§!: §§Y17,5 miliarda dolarów§!\n Bazowe zużycie energii: §R-0.5§! GW\n"
 arms_factory: "Przemysł militarny"
 arms_factory_plural: "Przemysły Wojskowe"
 arms_factory_desc: "Budynek ten zapewnia państwu przemysł do produkcji nowego sprzętu wojskowego. W razie potrzeby można go przekształcić w przemysł cywilny.\n\nZapewnia stanowi:\nPodstawowa liczba wymaganych pracowników: §Y18,8K§!\nPodstawowa produkcja PKB na §YPrzemysł wojskowy§!: $§Y1,5 miliarda§!\nPodstawowe zużycie energii: §R-0.5§! GW"
 internet_station: "Infrastruktura sieciowa"
 internet_station_plural: "Infrastruktura sieciowa"
 internet_station_desc: "§YInfrastruktura sieciowa§! to wysokie konstrukcje stosowane w telekomunikacji i komunikacji radiowej w celu przesyłania transmisji na duże odległości lub podziemne kable światłowodowe i systemy przetwarzania w chmurze.\n\nZapewnia państwu:\nBazowa liczba wymaganych pracowników: §Y12K §!\nBazowa produkcja PKB na §YInfrastruktura sieciowa§!: $§Y 3,5 miliarda §!\n\nKażdy poziom §YInfrastruktury sieciowej§! przyspiesza wzrost lokalnej produktywności o §G+5.00%§!.\nKażdy poziom §YNetwork Infrastructure§! skraca czas trwania §YInternational Investments§! o §G-5,00%§!."
 dockyard: "Stocznia Marynarki Wojennej"
 dockyard_plural: "Stocznie Marynarki Wojennej"
 dockyard_desc: "§YStocznie§! są przykładem zdolności państwa do produkcji wszelkiego rodzaju okrętów wojennych, począwszy od §Yłodzi patrolowych§!, §Ykonwojów§!, §Yniszczycieli§!, §Ylotniskowców§! i innych.\n\nZapewnia państwu:\nPodstawowa liczba wymaganych pracowników: §Y18,8 tys.§!\nPodstawowe PKB wygenerowane na jedną §Ystocznię§!: §Y1,5 miliarda dolarów§!\nPodstawowe zużycie energii: §R-0,5§! GW"
 air_base_desc: "Ten budynek umożliwia wystawienie sił powietrznych w regionie."
 radar_station_desc: "Stacje radarowe umożliwiają zdobycie informacji o oddziałach wroga w pobliskich stanach. Składa się z różnych radarów i czujników, a także zasobów wywiadowczych i możliwości analizowania zmieniającej się sytuacji.\nWyższy poziom zwiększy jego efektywny zasięg.\nJego radary zapewniają również państwu lepsze wykrywanie sił powietrznych wroga, dając Twojemu samolotowi większa szansa na ich zaatakowanie.\nPonadto radary zwiększają wykrywalność flot wroga na morzu."
 anti_air_building: "Obiekty SHORAD"
 anti_air_building_plural: "Obiekty SHORAD"
 anti_air_building_desc: "§YObiekty SHORAD§! (Obrona przeciwlotnicza krótkiego zasięgu) to kompleksy i grupy broni przeciwlotniczej i taktyki, które zajmują się obroną powietrzną przed zagrożeniami powietrznymi na niskich wysokościach. Te obiekty współpracują ze sobą, aby podzielić przestrzeń powietrzną na obszary obronne, zapewniając lokalne cele wojskowe i infrastrukturę powietrzną, od śmigłowców po nisko latające samoloty i odrzutowce."
 nuclear_reactor_desc: "Budynek ten przekształca energię jądrową w energię elektryczną, zużywając w tym procesie umiarkowanie wzbogacony uran.\n\nZapewnia państwu:\nBazowa liczba wymaganych pracowników §Y 115K§!\nBazowy przyrost PKB na §Y Elektrownię Jądrową §!: §Y 4 miliardy dolarów§! \n Bazowy przyrost mocy: §G+5§! GW\n"
 synthetic_refinery_desc: "Obiekt ten zapewnia państwu przemysł zajmujący się produkcją kauczuku syntetycznego oraz pewne dodatkowe zdolności w zakresie produkcji paliw.\n\nZapewnia państwu:\nPodstawowa liczba wymaganych pracowników: §Y184K§!\nBazowa produkcja PKB na §YRafinerię syntetyczną§!: $ §Y10 Miliardów§!\nPodstawowe zużycie energii: §R -0,2§! GW\n\nProdukuje §YGumę§! po standardowych cenach rynkowych, a nadwyżka generuje gotówkowy dochód ponad kwotę podatku dochodowego od osób prawnych.\n"
 fuel_silo: "Strategiczna rezerwa zasobów"
 fuel_silo_plural: "Strategiczne rezerwy zasobów"
 fuel_silo_desc: "§YStrategiczna Rezerwa Zasobów§! to zespół magazynów, obiektów do składowania towarów suchych oraz innych składów, w tym tych przeznaczonych na §Ypaliwo§!. Obiekt ten zapewnia twojemu państwu dodatkową przestrzeń do gromadzenia zapasów §Hpaliwa§! i §Hsurowców§!.\n\nNOTATKA: §YMagazyn Zasobów§! posiada ograniczenie silnika gry, przez które w przypadku korzystania z §Y$export_economy$§! lub §Y$globalized_trade_economy$§! możesz zacząć wysyłać więcej zasobów na eksport niż do własnych linii produkcyjnych. Jeśli musisz zacząć wypłacać zasoby z magazynu, zaleca się zmianę na §Y$mixed_economy$§! lub niższą.\n"
 offices: "Sektor biurowy"
 offices_plural: "Sektory biurowe"
 offices_desc: "§YSektor biurowy§! reprezentuje wszystkie inne gałęzie gospodarki poza przemysłem wydobywczym i ciężkim. Należą do nich finanse, obsługa klienta, technologia informacyjna, usługi detaliczne i wiele innych.\n\nZapewnia państwu:\nPodstawowa liczba wymaganych pracowników: §Y473K§!\nPodstawowa produkcja PKB na §YSektor biurowy§!: §Y50 miliardów§!\nPodstawowe zużycie energii: §R-0.25§! GW"
 rail_way_plural: "Szyny kolejowe"
 fossil_powerplant: "Elektrownia na paliwo kopalne"
 fossil_powerplant_plural: "Elektrownie na paliwa kopalne"
 fossil_powerplant_desc: "§YElektrownie na paliwa kopalne§! to ogólne określenie dla wszystkich termoelektrycznych źródeł energii opartych na paliwach kopalnych. Obejmują one między innymi: węgiel, gaz ziemny i ropę naftową. §YElektrownie na paliwa kopalne§! przejdą w stan bezczynności, jeśli produkcja energii będzie wyższa niż jej zużycie.\n\nZapewnia prowincji:\nBazowa liczba wymaganych pracowników: §Y7.5 tys.§!\nBazowy wpływ na PKB na §YElektrownię na paliwa kopalne§!: $§Y1.7 miliarda§!\nBazowy przyrost energii: §G+2§! GW\n"
 fossil_powerplant_amount: "$VALUE|Y0=$"
 fossil_powerplant_resource: "£resources_strip|$FRAME$"
 agriculture_district: "Skomercjalizowana dzielnica rolnicza"
 agriculture_district_plural: "Skomercjalizowane dzielnice rolnicze"
 agriculture_district_desc: "§YKomercyjne okręgi rolnicze§! to ogólne określenie dla całego rolnictwa towarowego w naszym kraju. Obejmuje ono agrobiznes, ziemię uprawną, silosy zbożowe, rzeźnie i inne.\n\nZapewnia prowincji:\nBazowa liczba wymaganych pracowników: §Y188 tys.§!\nBazowy wpływ na PKB na §YKomercyjny okręg rolniczy§!: $§Y25 miliardów§!\nBazowe zużycie energii: §R-0.10§! GW\n§YPrzyrost paliwa§! z prowincji: 8\n§YZaopatrzenie lokalne§!: 1.5%\n"
 agriculture_district_amount: "$VALUE|Y0=$"
 rocket_site: "Miejsce startu rakiety"
 rocket_site_plural: "Miejsce startu rakiety"
 rocket_site_desc: "§YMiejsca startu rakiet§! to zbiorcze określenie dla wszystkich rodzajów wyposażenia rakietowego na poziomie teatru działań, od §YPociski ziemia-powietrze§! do §YMiędzykontynentalne pociski balistyczne§!. Zapewnia państwu możliwość rozmieszczenia tych strategicznych zasobów w naszych strategicznych strefach powietrznych, aby albo wspomóc naszą obronę powietrzną, albo zapewnić zdolności ofensywne."
 nuclear_facility: "Cywilny Ośrodek Badawczo-Rozwojowy"
 nuclear_facility_plural: "Cywilny Ośrodek Badawczo-Rozwojowy"
 nuclear_facility_desc: "§YObiekt cywilny badawczo-rozwojowy§! obejmuje wszelkiego rodzaju projekty specjalne związane z cywilnym potencjałem przemysłowym, obiektami jądrowymi i innymi."
 air_facility: "Zakład Aerodynamiki i Awioniki"
 air_facility_desc: "W zakładach doświadczalnych zajmujących się aerodynamiką i awioniką można prowadzić projekty badawcze z zakresu lotnictwa, zaawansowanych rakiet, elektroniki oraz projektów kosmicznych."
 naval_facility_desc: "Obiekty Eksperymentalne Inżynierii Morskiej pozwalają rozpocząć projekty badawcze związane z okrętami nawodnymi i okrętami podwodnymi.\nInżynierię morską można utworzyć tylko w prowincji nadmorskiej."
 stronghold_network: "Sieć obronna w całym stanie"
 stronghold_network_plural: "Sieć obronna w całym stanie"
 stronghold_network_desc: "Rozległa sieć obronna składająca się z tuneli, punktów umocnień, okopów, schronów przeciwbombowych, składów broni i wcześniej zaplanowanych miejsc wyburzeń daje obrońcom zdecydowaną przewagę nad każdym atakującym."
 renewable_energy_infra: "Infrastruktura energii odnawialnej"
 renewable_energy_infra_plural: "Infrastruktura energii odnawialnej"
 renewable_energy_infra_desc: "§YInfrastruktura energii odnawialnej§! to ogólne określenie dla wszystkich odnawialnych źródeł energii. Obejmują one między innymi: farmy słoneczne, turbiny wiatrowe, rafinerie biopaliw, zakłady produkujące węgiel drzewny, elektrownie na biopaliwa i inne. Jako taka, wykorzystuje ona źródła odnawialne i produkuje z nich paliwo.\n\nZapewnia prowincji:\nBazowa liczba wymaganych pracowników: §Y22.5 tys.§!\nBazowy wpływ na PKB na §YInfrastrukturę energii odnawialnej§!: $§Y2 miliardy§!\nBazowy przyrost energii: §G+0.5§! GW\n"
 renewable_energy_infra_amount: "$VALUE|Y0=$"
 renewable_energy_infra_resource: "£resources_strip|$FRAME$"
 microchip_plant: "Zakład produkcji mikrochipów"
 microchip_plant_plural: "Zakłady produkcji mikrochipów"
 microchip_plant_desc: "Zakład produkcyjny przetwarzający metale technologiczne i metale szlachetne na mikroczipy, przeznaczone do zastosowań zarówno przemysłowych, jak i wojskowych.\n\nZapewnia państwu:\nBazowa liczba wymaganych pracowników: §Y 37,5K§!\nBazowa wielkość produkcji PKB na §YZakład produkcji mikrochipów§!: $§Y 32 Miliardy §!\n Podstawowe zużycie energii: §R -0,75 §!GW\n Produkcja §YMikroczipów §! - 20\n\n §YMikroczipy §!osiągają najwyższe ceny rynkowe w przeliczeniu na sztukę, generując znaczne wpływy gotówkowe z eksportu nadwyżek.\n\n Koszty:\n 3 §YMetale Technologiczne §!\n 2 §YMetale Szlachetne §!"
 composite_plant: "Zakład produkcji kompozytów"
 composite_plant_desc: "Zakład produkcyjny, który łączy ropę, gumę i metale szlachetne w kompozyty, wykorzystywane przez pracowników naukowych, wojskowych i przemysłowych.\n\nZapewnia prowincji:\nBazowa liczba wymaganych pracowników: §Y37.5 tys.§!\nBazowy wpływ na PKB na §YZakład materiałów kompozytowych§!: $§Y28 miliardów§!\nBazowe zużycie energii: §R-0.8§! GW\nProdukcja §YZaawansowanych kompozytów§!: 20\n\n§YKompozyty§! osiągają jedne z najwyższych cen rynkowych za jednostkę, generując wysokie dochody gotówkowe z eksportu nadwyżek.\n\nKoszty:\n1 §YRopa§!\n1 §YKauczuk§!\n1 §YMetale szlachetne§!"
 composite_plant_plural: "Zakłady produkcji kompozytów"
 rail_terminal: "Terminal kolejowy"
 rail_terminal_plural: "Terminale kolejowe"
 rail_terminal_desc: "Stan dysponujący gęstą siecią terminali zapewnia szybszy transport zarówno osób, jak i towarów, dzięki czemu fabryki otrzymują surowce i komponenty w bardziej przewidywalny sposób, pracownicy pewniej docierają do miejsc pracy, a lokalna gospodarka zyskuje przestrzeń do rozwoju."
 show_construction_speed: "Gdy opcja jest zaznaczona, możesz zobaczyć bieżący £construction_speed_texticon §YBonus do prędkości budowy§! dla każdego §YTypu budynku§!\n\nModyfikator ten pokazuje wyłącznie premię specyficzną dla danego budynku. Nie uwzględnia on §YGlobalnej £construction_speed_texticon Prędkości budowy.§!"
 landmark_kaaba: "Kaaba"
 landmark_kaaba_plural: "$landmark_kaaba$"
 landmark_kaaba_desc: "Kaaba – święta budowla w kształcie sześcianu, znajdująca się w samym sercu meczetu Al-Masdżid al-Haram w Mekce – stanowi najświętsze miejsce islamu. Okryta czarnym jedwabiem zdobionym złotą kaligrafią, pełni funkcję kibli, czyli kierunku, ku któremu muzułmanie na całym świecie zwracają się podczas modlitwy. To starożytne sanktuarium, zwane Domem Boga, uosabia wieki wiary, pielgrzymowania i historii islamu, symbolizując jedność muzułmańskiej wspólnoty – ummy.\n\n§Y Ikoniczna budowla – Kaaba §! generuje dochód z turystyki w oparciu o całkowitą liczbę ludności państw arabskich. Dokładną kwotę można sprawdzić w §Y Panelu ekonomii§!."
 landmark_milad: "Milad Tower"
 landmark_milad_plural: "$landmark_milad$"
 landmark_milad_desc: "Wieża Milad (Borj-e Milad) ma swoje korzenie w okresie sprzed rewolucji w Iranie, a wstępne plany jej budowy sięgają lat 70. XX wieku. Po rewolucji z 1979 roku projekty te zostały odłożone na bok w obliczu zmieniających się priorytetów politycznych. Koncepcję tę reaktywowano pod koniec lat 90., a budowę rozpoczęto w 2000 roku, co wpisywało się w nowy nacisk Iranu na rozwój i modernizację. Projekt wieży łączy elementy irańskiego dziedzictwa ze współczesną myślą inżynieryjną, czyniąc z niej wyrazisty symbol zarówno ciągłości historycznej, jak i ewoluującej tożsamości kraju. Obecnie obiekt ten funkcjonuje jako wielofunkcyjny kompleks i ważny punkt orientacyjny o znaczeniu kulturowym, oferując mieszkańcom Teheranu oraz odwiedzającym go gościom panoramiczny widok na miasto i odległe góry Elburs."
 landmark_domeofrock: "Kopuła na Skale"
 landmark_domeofrock_plural: "$landmark_domeofrock$"
 landmark_domeofrock_desc: "Kopuła na Skale to słynne islamskie sanktuarium, znane ze złotej kopuły górującej nad Starym Miastem w Jerozolimie. Zbudowana w VII wieku, wznosi się na terenie Haram asz-Szarif – znanym również jako Wzgórze Świątynne – miejscu świętym zarówno dla muzułmanów, jak i dla żydów. Wewnątrz sanktuarium znajduje się Kamień Węgielny; według wierzeń muzułmanów wyznacza on miejsce, z którego prorok Mahomet wstąpił do nieba, natomiast w tradycji żydowskiej uznawany jest za miejsce, w którym znajdowało się Święte Świętych starożytnej Świątyni Jerozolimskiej."
 landmark_goldengate: "Most Golden Gate"
 landmark_goldengate_plural: "$landmark_goldengate$"
 landmark_goldengate_desc: "Ukończony w 1937 roku most Golden Gate rozciąga się nad cieśniną łączącą Zatokę San Francisco z Oceanem Spokojnym, spinając miasto z obszarem Marin Headlands. Dzięki charakterystycznym wieżom w kolorze „International Orange” oraz długiemu przęsłu wiszącemu był on w momencie otwarcia najdłuższym mostem tego typu na świecie i do dziś pozostaje jedną z najbardziej rozpoznawalnych budowli w Stanach Zjednoczonych."
 landmark_UScongress: "Kapitol Stanów Zjednoczonych"
 landmark_UScongress_plural: "$landmark_UScongress$"
 landmark_UScongress_desc: "Kapitol Stanów Zjednoczonych wznosi się we wschodniej części National Mall w Waszyngtonie, mieszcząc sale obrad Senatu oraz Izby Reprezentantów. Dzięki neoklasycystycznej architekturze i centralnej kopule stał się on najbardziej rozpoznawalną siedzibą amerykańskiej władzy ustawodawczej, stanowiąc kluczowy punkt ciągu obiektów, w skład którego wchodzą również Biblioteka Kongresu, Sąd Najwyższy oraz kompleks muzealny Smithsonian Institution."
 landmark_fuji: "Góra Fudżi"
 landmark_fuji_plural: "$landmark_fuji$"
 landmark_fuji_desc: "Góra Fuji – najwyższy szczyt Japonii o wysokości 3776 m n.p.m. – to czynny stratowulkan położony na wyspie Honsiu, widoczny z Tokio w dni o dobrej widoczności. Obiekt ten, od dawna uznawany za święty w religii shintō i stanowiący kluczowy motyw w sztuce japońskiej, znajduje się również na liście światowego dziedzictwa UNESCO. Jego niemal idealnie stożkowata sylwetka oraz otaczający go region jezior przyciągają każdego roku setki tysięcy wspinaczy i turystów."
 landmark_giza: "Piramidy w Gizie"
 landmark_giza_plural: "$landmark_giza$"
 landmark_giza_desc: "Wzniesione w okresie Starego Państwa Egipt jako monumentalne grobowce faraonów, piramidy w Gizie znajdują się na obrzeżach Kairu. Wielka Piramida, zbudowana dla faraona Cheopsa, jest jedynym zachowanym do dziś obiektem z listy siedmiu cudów starożytnego świata. Kompleks ten, wraz ze Sfinksem, pozostaje jedną z najczęściej odwiedzanych atrakcji Egiptu i kluczowym elementem krajowej turystyki."
 landmark_shuttle: "Centrum Kosmiczne im. Kennedy’ego"
 landmark_shuttle_plural: "$landmark_shuttle$"
 landmark_shuttle_desc: "Centrum Kosmiczne im. Kennedy’ego, położone na florydzkim wybrzeżu Atlantyku, stanowi główne miejsce startów załogowych misji kosmicznych NASA. Na jego terenie znajdują się takie obiekty, jak kultowy budynek montażu pojazdów (Vehicle Assembly Building), w którym rakiety są przygotowywane do startu, oraz Kompleks Startowy 39 – historyczne miejsce rozpoczęcia misji w ramach programów Apollo i promów kosmicznych. Ośrodek ten pozostaje centrum innowacji i eksploracji, obsługującym zarówno starty rządowe, jak i komercyjne."
 landmark_shuttle_launch: "Centrum Kosmiczne im. Kennedy’ego"
 landmark_shuttle_launch_plural: "$landmark_shuttle_launch$"
 landmark_shuttle_launch_desc: "Centrum Kosmiczne im. Kennedy’ego, położone na florydzkim wybrzeżu Atlantyku, stanowi główne miejsce startów załogowych misji kosmicznych NASA. Na jego terenie znajdują się takie obiekty, jak kultowy budynek montażu pojazdów (Vehicle Assembly Building), w którym rakiety są przygotowywane do startu, oraz Kompleks Startowy 39 – historyczne miejsce rozpoczęcia misji w ramach programów Apollo i promów kosmicznych. Ośrodek ten pozostaje centrum innowacji i eksploracji, obsługującym zarówno starty rządowe, jak i komercyjne."
 landmark_buran: "Kosmodrom Bajkonur"
 landmark_buran_plural: "$landmark_buran$"
 landmark_buran_desc: "Kosmodrom Bajkonur, położony na stepach południowego Kazachstanu, jest najstarszym i największym czynnym kosmodromem na świecie. Uruchomiony w 1955 roku, był miejscem startu przełomowych misji radzieckich i rosyjskich, w tym pierwszego lotu człowieka w kosmos, odbytego przez Jurija Gagarina na pokładzie statku Wostok 1. Rosja nadal dzierżawi ten obiekt od Kazachstanu i wykorzystuje go do załogowych lotów statków Sojuz na Międzynarodową Stację Kosmiczną."
 landmark_ICBMsilominot: "Baza Sił Powietrznych Minot"
 landmark_ICBMsilominot_plural: "$landmark_ICBMsilominot$"
 landmark_ICBMsilominot_desc: "Kompleks rakietowy bazy sił powietrznych Minot składa się z rozległej sieci podziemnych silosów mieszczących międzykontynentalne pociski balistyczne, rozmieszczonych na równinach Dakoty Północnej. Silosy te są przystosowane do przetrwania uderzenia nuklearnego, silnie strzeżone i utrzymywane w stanie ciągłej gotowości, stanowiąc lądowy filar amerykańskiej triady nuklearnej."
 landmark_ICBMsiloyasny: "Baza rakietowa Jasnyj"
 landmark_ICBMsiloyasny_plural: "$landmark_ICBMsiloyasny$"
 landmark_ICBMsiloyasny_desc: "Baza rakietowa Jasnyj, położona w pobliżu Dombarowskiego w rosyjskim obwodzie orenburskim, stanowi jedno z głównych zgrupowań silosów należących do Strategicznych Wojsk Rakietowych. Obiekt ten, zbudowany w okresie zimnej wojny, mieści ciężkie międzykontynentalne pociski balistyczne (ICBM) w silnie chronionych silosach podziemnych i stanowi kluczowy element rosyjskiego potencjału odstraszania nuklearnego."
 landmark_zenobia_wall: "Linia obronna Zenobii"
 landmark_zenobia_wall_plural: "$landmark_zenobia_wall$"
 landmark_zenobia_wall_desc: "Silnie ufortyfikowana linia, rozciągająca się przez południowy Egipt i Pustynię Zachodnią. Betonowe mury, kompleksy bunkrów oraz stanowiska artyleryjskie o wcześniej wyznaczonych celach stanowią filary Linii Zenobii – umocnień wzniesionych w celu powstrzymania natarcia Chimer z obszarów przełamania położonych na południe od Sahary."
 landmark_hagia_sophia_plural: "$landmark_hagia_sophia$"
 landmark_hagia_sophia_desc: "Hagia Sophia, wzniesiona pierwotnie w 537 roku jako bizantyńska katedra, po zdobyciu miasta w 1453 roku stała się głównym meczetem osmańskim Stambułu. Przez znaczną część historii Republiki Turcji obiekt ten pełnił funkcję świeckiego muzeum. Jego potężna kopuła centralna oraz bizantyńskie mozaiki pozostają jednymi z najważniejszych dzieł architektury sakralnej w historii, przyciągając do Stambułu miliony zwiedzających każdego roku."
 landmark_forbidden_city_desc: "Otoczony murami zespół pałacowy w samym sercu Pekinu przez blisko pięć wieków służył jako rezydencja cesarska dynastii Ming i Qing. Obecnie mieści się w nim Muzeum Pałacowe, które posiada jedną z najważniejszych na świecie kolekcji chińskiej sztuki i zabytków. Zakazane Miasto jest najczęściej odwiedzanym obiektem kulturowym w kraju, wpisanym na listę światowego dziedzictwa UNESCO i stanowiącym najważniejszy symbol chińskiej cywilizacji."
 landmark_tokyo_imperial_palace_desc: "Główna rezydencja cesarza Japonii od czasów restauracji Meiji, usytuowana w miejscu dawnego zamku Edo w samym sercu Tokio. Pałac i jego otoczenie stanowią symbol ciągłości najstarszej na świecie monarchii dziedzicznej. Dostęp dla zwiedzających jest ograniczony, jednak Ogrody Wschodnie oraz najważniejsze ceremonie cesarskie każdego roku przyciągają rzesze turystów."
 landmark_taj_mahal_plural: "$landmark_taj_mahal$"
 landmark_taj_mahal_desc: "Wzniesiony w 1632 roku na polecenie cesarza Mogołów Szahdżahana jako mauzoleum dla jego żony Mumtaz Mahal, Tadź Mahal stanowi najwspanialszy zachowany przykład architektury mogolskiej. Dzięki fasadzie z białego marmuru, kunsztownym zdobieniom typu *pietra dura* oraz symetrycznym ogrodom obiekt ten został wpisany na listę światowego dziedzictwa UNESCO i stał się jednym z najczęściej odwiedzanych zabytków na świecie, przyciągającym co roku do Agry miliony turystów."
 landmark_prague_castle: "Zamek Praski"
 landmark_prague_castle_desc: "Zamek na Hradczanach – największy pod względem powierzchni starożytny kompleks zamkowy na świecie – był siedzibą królów Czech i cesarzy rzymskich, a obecnie pełni funkcję siedziby prezydenta Republiki Czeskiej. W jego murach mieszczą się katedra św. Wita oraz zgromadzone na przestrzeni wieków dzieła sztuki z całej Europy Środkowej, co czyni ten obiekt najchętniej odwiedzanym miejscem kultury w kraju."
 landmark_bojnice_castle: "Zamek w Bojnicach"
 landmark_bojnice_castle_desc: "Zamek w Bojnicach – średniowieczna słowacka twierdza, przekształcona w duchu romantycznego neogotyku pod koniec XIX wieku z inicjatywy hrabiego Jánosa Pálffy’ego na wzór francuskich zamków nad Loarą – jest dziś jednym z najchętniej odwiedzanych obiektów kultury na Słowacji; jego sylwetka z licznymi wieżyczkami oraz otaczający go park stanowią kluczowy element słowackiej oferty turystyki kulturowej."
 landmark_sadabad_complex: "Kompleks Sadabad"
 landmark_sadabad_complex_plural: "$landmark_sadabad_complex$"
 landmark_sadabad_complex_desc: "Rozległy kompleks pałacowy położony u podnóża gór na północ od Teheranu; wzniesiony pierwotnie za czasów dynastii Kadżarów, został znacząco rozbudowany przez szachów z dynastii Pahlawi. Po rewolucji 1979 roku obiekt znacjonalizowano i obecnie funkcjonuje on jako sieć muzeów państwowych, prezentujących królewskie kolekcje, sztukę irańską oraz zbiory przyrodnicze."
 landmark_hofburg_palace_desc: "Hofburg, położony w samym sercu Wiednia, przez wieki pełnił funkcję głównej rezydencji cesarskiej dynastii Habsburgów. Obecnie w jego wnętrzach mieszczą się biura Prezydenta Austrii, Hiszpańska Szkoła Jazdy, Cesarski Skarbiec oraz kilka znaczących muzeów. Obiekt ten pozostaje jednym z najważniejszych symboli Wiednia i kluczowym punktem na mapie austriackiej turystyki kulturowej."
 landmark_berlin_reichstag_desc: "Budynek Reichstagu przy placu Republiki (Platz der Republik) od ponad wieku stanowi polityczne centrum Berlina. Obiekt, poważnie zniszczony w 1933 roku oraz ponownie w czasie II wojny światowej, został po zjednoczeniu Niemiec odrestaurowany według projektu Normana Fostera i ponownie otwarty w 1999 roku jako siedziba Bundestagu – niemieckiego parlamentu federalnego. Jego szklana kopuła stała się wyrazistym symbolem współczesnej niemieckiej demokracji oraz jedną z głównych atrakcji w centrum Berlina."
 enrichment_facility: "Zakład wzbogacania uranu"
 enrichment_facility_plural: "Zakłady wzbogacania uranu"
 enrichment_facility_desc: "Zakłady wzbogacania przyjmują uran i wzbogacają go z przeznaczeniem do wykorzystania w reaktorach jądrowych oraz – w pewnym stopniu – w broni jądrowej."