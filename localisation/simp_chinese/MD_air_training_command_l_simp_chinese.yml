 MD_atc_ex_training_tt: "§Y空中行动战备演习§!\n\n£air_experience 空军经验：§R-325§!\n£command_power 指挥点数：§R-75§!\n获得国家精神§Y空中行动战备演习§!，持续§H90§!天：\n £fuel_consumption_texticon  空军燃料消耗：§R+25%§!\n £experience_neutral_texticon  空军联队任务经验获取：§G+5%§!\n£doctrine_mastery §H训练与作战§!精通度：每天[MD_atc_exercise_mastery_tt_text]，持续§H90§!天\n\n需要一项空军主要学说，以及至少§H50§!架已部署飞机，其中至少包含一架侦察机。"
 MD_atc_ex_design_tt: "§Y飞行测试与评估§!\n\n£air_experience 空军经验：§R-325§!\n£command_power 指挥点数：§R-75§!\n获得国家精神§Y飞行测试与评估§!，持续§H90§!天：\n £fuel_consumption_texticon  空军燃料消耗：§R+25%§!\n £air_accidents_texticon  飞行事故几率：§G-5%§!\n£doctrine_mastery §H飞机设计§!精通度：每天[MD_atc_exercise_mastery_tt_text]，持续§H90§!天\n\n需要一项主要空军学说且至少已部署§H50§!架飞机。"
 MD_atc_ex_heavy_tt: "§Y战略空运与轰炸机演习§!\n\n£air_experience 空军经验：§R-325§!\n£command_power 指挥点数：§R-75§!\n获得国家精神§Y战略空运与轰炸机演习§!，持续§H90§!天：\n £fuel_consumption_texticon  空军燃油消耗：§R+25%§!\n £air_range_texticon  空中航程：§G+3%§!\n£doctrine_mastery §H重型飞机§!精通度：每天[MD_atc_exercise_mastery_tt_text]，持续§H90§!天\n\n需要§Y战略破坏§!或§Y一体化空战§!主要学说，以及至少§H50§!架已部署飞机，其中至少包含一架战略轰炸机。"
 MD_atc_ex_multirole_tt: "§Y多用途打击战斗机演习§!\n\n£air_experience 空军经验：§R-325§!\n£command_power 指挥点数：§R-75§!\n获得国家精神§Y多用途打击战斗机演习§!，持续§H90§!天：\n £fuel_consumption_texticon  航空燃料消耗：§R+25%§!\n £air_escort_efficiency_texticon  护航效率：§G+3%§!\n£doctrine_mastery §H多用途飞机§!精通度：每天[MD_atc_exercise_mastery_tt_text]，持续§H90§!天\n\n需要§Y本地空域保卫§!、§Y战场支援§!、§Y制空权§!、§Y自主空中行动§!或§Y多用途§!主要学说，且至少部署§H50§!架飞机，其中至少包括一架战斗机。"
 MD_atc_ex_strike_tt: "§Y近距空中支援演习§!\n\n£air_experience 空军经验：§R-325§!\n£command_power 指挥点数：§R-75§!\n获得国家精神§Y近距空中支援演习§!，持续§H90§!天：\n £fuel_consumption_texticon  空军燃料消耗：§R+25%§!\n £cas_efficiency_texticon  空中支援任务效率：§G+3%§!\n£doctrine_mastery §H攻击机§!精通度：每天[MD_atc_exercise_mastery_tt_text]，持续§H90§!天\n\n需要§Y本地空域保卫§!、§Y战略破坏§!、§Y战场支援§!、§Y自主空中作战§!或§Y一体化空战§!主要学说，以及至少§H50§!架已部署飞机，其中包括至少一架近距空中支援机、战术轰炸机、海军轰炸机或战略轰炸机。"
 MD_atc_ex_fighter_tt: "§Y空战演习§!\n\n£air_experience 空军经验：§R-325§!\n£command_power 指挥点数：§R-75§!\n获得国家精神§Y空战演习§!，持续§H90§!天：\n £fuel_consumption_texticon  空军燃油消耗：§R+25%§!\n £air_superiority_efficiency_texticon  制空任务效率：§G+3%§!\n£doctrine_mastery §H战斗机§!精通度：每天[MD_atc_exercise_mastery_tt_text]，持续§H90§!天\n\n需要§Y本地空域保卫§!、§Y战略破坏§!、§Y战场支援§!、§Y空中优势§!、§Y多用途§!或§Y一体化空战§!主要学说，并至少部署§H50§!架飞机，其中至少包含一架战斗机或截击机。"
 MD_atc_ex_drone_tt: "§Y无人系统演习§!\n\n£air_experience 空军经验：§R-325§!\n£command_power 指挥点数：§R-75§!\n获得国家精神§Y无人系统演习§!，持续§H90§!天：\n £fuel_consumption_texticon  空军燃油消耗：§R+25%§!\n £dive_bombing_texticon  对地轰炸瞄准：§G+3%§!\n£doctrine_mastery §H无人机作战§!精通度：每天[MD_atc_exercise_mastery_tt_text]，持续§H90§!天\n\n需要§Y自主空中作战§!主要学说以及至少§H50§!架已部署飞机。"
