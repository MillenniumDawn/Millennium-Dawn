 ALG_maintain_kabyle_relations_desc: "카빌족 공동체에 대한 소규모 접촉으로 만족도가 떨어지지 않도록 유지합니다. 정치력이 들지만 대규모 개혁의 가혹한 실패 페널티는 피할 수 있습니다."
