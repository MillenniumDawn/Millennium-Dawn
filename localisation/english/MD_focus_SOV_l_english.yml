 SOV_MoexStatus_loc1: "£text_icon_sov_ruble §YMOSCOW EXCHANGE§!: §RCLOSED§!\nThe listed companies have been §Rnationalised§!. Capitalization is frozen and the market no longer contributes to our economy.\n"
