l_korean:
 SWE_post_crisis_fiscal_decisions: "전 위기 국가재정 결정"
 SWE_post_crisis_fiscal_decisions_desc: "The Swedish economy, once equipped with the highest incomes in Europe during the 70s, has not managed to stay ahead of the rest. Especially the Crisis of the 90s, when GDP dropped by 5% at the beginning of the decade, scarred the once untouchable Swedish money machine. The 1994 budget had a deficit of 15% of GDP. Now, the government needs to set a convincing policy for the new millennium."
 SWE_riksbank_policy: "릭스 은행 정책"
 SWE_riksbank_policy_desc: "스베리어릭스은행은 스웨덴의 은행으로 1668년부터 영업을 시작하여 스웨덴 통화인 코로나의 관리를 하고 있습니다. 중앙 은행의 행보는 국가 재정, 더 나아가서는 정부의 외교 정책에도 영향을 끼칠 것입니다."
 SWE_currency_policy: "통화 정책"
 SWE_currency_policy_desc: "인플레이션과 디플레이션은 언제나 발생할 수 있습니다. 스웨덴 정부에서 크로나를 대량으로 오랫동안 보유하고 있을수록,릭스 은행은 시장에 유통되는 통화량과 국내, 국제 통화 가치를 조절할 수 있을 것입니다."
 SWE_improve_the_stridsvagn_122: "스트리츠바겐 122 개량"
 SWE_improve_the_stridsvagn_122_desc: "스트리츠바겐 122는 독일제 2A5 주력전차를 면허생산한 전차입니다. 숲에서의 전투에 특화된 스트리츠바겐은 더 뛰어난 다음 세대의 스웨덴 전차가 나올지라도 스웨덴 군의 주력을 차지하고 있을 것입니다."
 SWE_contracts_for_german_armament_companies: "독일 기갑 회사와의 계약"
 SWE_contracts_for_german_armament_companies_desc: "스웨덴 군수 산업은 단 한번도 대규모의 규모를 가진 적이 없으며, 지난 수십 년간 오히려 축소되었고, 특히 냉전이 끝난 뒤에 '군사적 중립'을 취하면서 정책 우선순위에서도 내려가게 되었습니다. 자국의 무기를 최고로 만들 수는 없지만, 독일제 무기라면 충분할 것입니다. 저들을 고용하는 것을 고려해보아야 합니다."
 SWE_oresund_bridge: "외레순드 다리"
 SWE_oresund_bridge_desc: "1990년대부터 건설에 들어간 외레순드 다리는 남부 스웨덴의 말뫼와 덴마크 수도인 코펜하겐을 연결하는 다리 밑 터널로 구성된 건축물입니다. 남부 페노스칸디아와 유럽 본토을 연결해주는 새로운 연결통로로써 독일을 포함한 다른 유럽국들과 덴마크와의 무역을 더 쉽게 이루어지도록 해줄 것입니다."
 SWE_expand_e20: "E20 확장"
 SWE_expand_e20_desc: "유럽 국제 도로망에 포함된 도루 중 하나인 E20은 덴마크와 스웨덴을 연결하는 외레순드 다리 다음에 북쪽의 스톡홀름으로 향하고 마지막에는 페리선으로 에스토이니아, 러시아와 연결되는 도로입니다. E20이 지금보다 많은 교통량을 충분히 감당할 수 있게 확장해야 합니다. 동맹국이 도와줄 것입니다."
 SWE_expand_malmo_harbor: "말뫼항 확장"
 SWE_expand_malmo_harbor_desc: "외레순드 다리가 완공되면서, 예테보리를 대체할 수 있는 해양도시로써 말뫼를 조성하는데 중점을 두어야할 것입니다. 이 사업을 통해서 덴마크, 독일, 폴란드와 같은 남부 무역국의 상품들을 더욱 더 빠르고 효율적으로 해상운송을 통해 스웨덴 본토에 들여올 수 있을 것입니다."
 SWE_expand_the_merchant_fleet: "상선단 확장"
 SWE_expand_the_merchant_fleet_desc: "부를 쌓고, 더 부유해지기 위해서는 그 기반을 설립해야 합니다. 대량의 상선을 건조함으로써 스웨덴을 떠다니는 배로 만들 수 있을 것입니다."
 SWE_expand_the_stockholm_docks: "스톡홀름 부두 확충"
 SWE_expand_the_stockholm_docks_desc: "Our most important window into the eastern Baltic and towards Finland, Estonia and Russia is the port system of our capital city, Stockholm. We should expand it to make trade with these countries easier and less of a hassle."
 SWE_northern_friendship: "북방 동맹"
 SWE_northern_friendship_desc: "스웨덴은 평화의 나라이고 이를 바꿀 필요는 없습니다. 유럽의 우방국, 동맹국과 평화 그리고 이익이 있는 관계를 이어나는데 집중할 것입니다."
 SWE_friendship_with_denmark: "덴마크와의 친선"
 SWE_friendship_with_denmark_desc: "스웨덴과 덴마크는 지난 10세기동안 20번이상의 전쟁을 벌인 과거와는 정반대로 서로 친밀감을 찾아가고 있습니다. 하지만 덴마크와 스웨덴은 과거의 국력을 그리워하고 있으며, 이 당시의 국력은 지금보다는 분명하게 아주 막강했습니다. 이들은 동맹, 친선을 맺기도했으나, 때때로 경쟁국이기도 했습니다. 망할놈들(Damn danskjävlar)."
 SWE_friendship_with_norway: "노르웨이와의 친선"
 SWE_friendship_with_norway_desc: "Norway was by Sweden's side for a long time - both figuratively and geographically. But while the weird shape of their country is a tale of its own, it is undeniable that the friendship of our two nations has been of mutual benefit. Even though they chose divorce in 1905. That was rude."
 SWE_friendship_with_the_baltic_states: "발트해 국가와의 친선"
 SWE_friendship_with_the_baltic_states_desc: "Estonia, Latvia and Lithuania share a lot with the Nordic countries - or so they say. While we still attempt to find out which cultural similarities other than a vague linguistic relationship between the Estonian and Finnish languages are supposed to tie Northern Europe to that part of Eastern Europe, we might as well make them our friends already. Why not?"
 SWE_swedish_norwegian_steel_production: "스웨덴-노르웨이 제절 생산"
 SWE_swedish_norwegian_steel_production_desc: "스웨덴과 노르웨이 국경지대는 풍부한 자원이 묻혀있지만, 채굴하기에는 어려움이 따르는 곳입니다. 만약, 공동작업을 통해서 양국이 함께 채굴할 수 있을겁니다. 그리고 채굴한 자원을 경매를 통해서 팔 수 있을 것입니다."
 SWE_friendship_with_finland: "핀란드와의 친선"
 SWE_friendship_with_finland_desc: "핀란드는 독립한 뒤부터 변함없는 친선국이었습니다. 하지만, 겨울 전쟁의 패배 이후 이들은 그 태도를 바꾸었지만, 자국은 변함없는 친선의 뜻을 내비쳤습니다. 특히 핀란드-스웨덴은 상호보완을 하며 강력한 약소국이 탄생하는 의견을 피력했습니다."
 SWE_job_opportunities_in_scania: "스카니아 일자리 창출"
 SWE_job_opportunities_in_scania_desc: "외국인들과 사업가들이 남부 스웨덴으로 쥐떼처럼 몰려가면서, 이 지역에 일자리 창출에 노력을 기울였습니다. 더 많은 고객은 더 많은 수요를 의미하며, 이는 성장 잠재력의 증가를 의미합니다."
 SWE_friendship_with_iceland: "아이슬란드와의 친선"
 SWE_friendship_with_iceland_desc: "아이슬란드는 겉으로도 외교적으로도 지구상에서 그 논란이 가장 적은 나라일 것입니다. 아이슬란드와 친선을 맺지 않는 것 자체가 죄를 짓는 것입니다."
 SWE_expand_e6: "E6 확장"
 SWE_expand_e6_desc: "E6는 노르웨이 북쪽에서 남쪽인 오슬로를 연결하는 자국의 양극을 연결시켜주는 무역, 관광의 핏줄인 동시에 석유가 풍부하고 부유한 서쪽의 인접국과의 연결통로입니다. 노르웨이-스웨덴의 친밀한 외교관게와 무역의 관계를 계속 이어 나가면서 서로서로 더 많은 교류를 해야할 것입니다."
 SWE_further_european_integration: "유럽국가들과의 더 깊은 개입"
 SWE_further_european_integration_desc: "스웨덴은 이미 그 효능이 증명된 문화적, 경제 통합과 같은 전 유럽주의에 대해 전혀 관심없다는 태도를 보이고 있습니다. 독일인들은 자국 상품을 구입하고 자국민들은 독일상품을 구매합니다. 덴마크인들은 자국 상품을 구입하고 자국민들은 덴마크 상품을 구입합니다. 더 많은 상품을 팔고 삽시다."
 SWE_reform_the_diplomatic_agenda: "외교 개혁"
 SWE_reform_the_diplomatic_agenda_desc: "세계는 지금 위태로운 상황에 놓여있으며, 하나의 실수라도 수천 개의 일자리나 수백만의 삶을 나락으로 몰 수 있습니다. 자국의 동맹국을 무시하는 듯한 태도를 보이지 않으면서도 자국이 타국의 사절에게 가장 최고의 대우를 해주고 있다는 인식을 심어줄 필요가 있습니다."
 SWE_invite_european_experts: "유럽 전문가 초청"
 SWE_invite_european_experts_desc: "유럽의 동맹국은 우리가 겪고있는 모든 문제들을 해결할 수 있는 전문가를 보유하고 있습니다. 이들을 초청하여 스톡홀롬에 한대 모아놓아서, 문제들을 해결할 새로운 방안을 마련할 수 있을겁니다."
 SWE_befriend_germany: "독일과의 동맹"
 SWE_befriend_germany_desc: "독일은 스웨덴의 가장 중요한 수출국이자 원자재 수입국입니다. 독일을 적대한다는 것은 자국의 경제를 박살내는 것과 같은 말입니다."
 SWE_european_military_contracts: "유럽 군사 계약"
 SWE_european_military_contracts_desc: "유럽 연합 회원국들은 상당히 발전한 군사 기술을 보유하고 있으며, 우리는 외교적 수단을 통해 우리의 경험과 교환할 수 있습니다."
 SWE_befriend_france: "프랑스와의 동맹"
 SWE_befriend_france_desc: "프랑스는 유럽에서 가장 영향력 있는 강국 중 하나이며, 곧 우리의 친구가 될 것입니다."
 SWE_armored_initiative: "전차 개발 계획"
 SWE_armored_initiative_desc: "기갑전은 일반 보병보다 빠르고 강력합니다. 스웨덴식 전격전을 펼칩시다!"
 SWE_artillery_initiative: "야포 개발 계획"
 SWE_artillery_initiative_desc: "병사들이 얼어붙을 수 있는 추운 북부에서는 포병이 매우 중요합니다."
 SWE_infantry_weapons_initiative: "보병 무기 개발 계획"
 SWE_infantry_weapons_initiative_desc: "보병은 기동성이 떨어지고 모집할 인원도 많지 않아 최선의 선택이 아닐 수 있지만, 보병이 모든 군대의 근간을 이룬다는 사실은 무시할 수 없습니다."
 SWE_befriend_the_united_kingdom: "영국과 동맹"
 SWE_befriend_the_united_kingdom_desc: "영국은 훌륭한 나라이며 EU 안에서 가장 큰 산업·군사 강국 중 하나입니다. 그들과 친구가 되어 이익을 얻읍시다."
 SWE_overhaul_the_university_system: "대학 체계 조정"
 SWE_overhaul_the_university_system_desc: "우리 대학 제도는 옛 시절 이후 개선된 적이 없으므로, 하버드 수준으로 현대화해야 합니다."
 SWE_befriend_italy: "이탈리아와 동맹"
 SWE_befriend_italy_desc: "우리와 이탈리아인은 미트볼과 스파게티처럼 정말 잘 어울립니다!"
 SWE_join_nato: "NATO 가입"
 SWE_join_nato_desc: "나토는 국제 투자와 군사 협력으로 향하는 많은 문을 열어 줄 수 있습니다."
 SWE_defensive_doctrines: "방어 교리"
 SWE_defensive_doctrines_desc: "스웨덴과 그 추운 황야는 방어하기 매우 쉬우므로 여기에 집중해야 합니다. 산업 부문은 매우 기뻐하겠지만, 무기 부문은 상당히 화를 낼 것입니다."
 SWE_northern_ambition: "북방의 야망"
 SWE_northern_ambition_desc: "스웨덴은 지난 2세기동안 중립을 고수해왔습니다. 이제 이 후회만 남을 고집을 그만두고 우리를 오랫동안 무시해온 세계에 한걸음을 내딪을 때입니다."
 SWE_justify_swedish_imperialism: "스웨덴 황권주의 정당화"
 SWE_justify_swedish_imperialism_desc: "보통 나이든 스웨덴 식민주의 열광자들은 현대에 와서는 역사 속에 존속하고 있는 웃기는 존재들로 여겨집니다. 에스토니아와 단치히를 점거한 스웨덴? 북 아메리카를 식민화한다고요? 얼마나 허망한 꿈인가요, 그렇지 않나요? 하지만 더이상은 아닙니다! 정당한 스웨덴 제국의 통치 아래서 비웃기만 한는 허망한 꿈이 아니라, 반드시 이루어야할 목표로써 한걸음씩 내딛을 것입니다."
 SWE_partnership_of_convenience: "편의에 의한 동맹"
 SWE_partnership_of_convenience_desc: "우리 모두 춥고 황량한 숲에서 살기 때문에 러시아와는 아주 쉽게 친구가 될 수 있습니다."
 SWE_join_csto: "CSTO 가입"
 SWE_join_csto_desc: "세계 정치에서 새로운 위치에 바로잡기 위해서, 전 서방 동맹국들과는 결별을 선언해야 합니다. 다행히도, 고립된 또다른 거인이 자국 가까이에 위치하고 있습니다. 러시아와 동맹을 결성하는 것은 스웨덴이 위대해지기 위한 또다른 이성적인 판단입니다."
 SWE_animosity_towards_russia: "러시아에 대한 적대"
 SWE_animosity_towards_russia_desc: "동쪽의 강대함을 절대 받아들일 수 없는 잊힌 사상이 스웨덴 국민들에게 퍼지고 있습니다. 러시아는 스웨덴의 동맹국이 아닙니다."
 SWE_rediscover_racial_theories: "인종 이론 재발견"
 SWE_rediscover_racial_theories_desc: "유전자 특징에 대한 생물학적 이론에 의해 스웨덴은 원래 인종차별주의 국가 중 하나였습니다. 좋군요. 학교에 다시 이러한 교육과정을 도입하여 스웨덴 사회의 이점을 되살릴 수 있을지도 모릅니다."
 SWE_glorify_the_royal_family: "왕실 미화"
 SWE_glorify_the_royal_family_desc: "스웨덴 왕실은 한 번도 잘못한 적이 없으며 언제나 옳습니다. 그들은 유럽 전체에서 최고의 왕실입니다!"
 SWE_demand_equality_for_finland_swedes: "핀란드-스웨덴 동등화 요구"
 SWE_demand_equality_for_finland_swedes_desc: "핀란드의 스웨덴인들은 그곳에 산다는 이유로 충분히 고통받았습니다! 핀란드 정부에 사회적 변화를 요구하십시오."
 SWE_glorify_the_viking_heritage: "바이킹의 유산 미화"
 SWE_glorify_the_viking_heritage_desc: "토르를 찬양하라! 오딘을 찬양하라! 프레이야를 찬양하라! 옛 신들은 새 정부를 사랑하며, 빈 주머니로 떠나 금을 가득 채워 돌아오던 우리의 위대한 약탈 시대를 우리도 사랑합니다!"
 SWE_the_king_of_sweden: "스웨덴의 왕"
 SWE_the_king_of_sweden_desc: "국민들에게 자국의 국왕이 얼마나 위대한지 충분히 상기시켰습니다. 구스타브 아돌프 2세와 카롤루스의 후계자를 복권시키고 정당한 자리에 앉게끔 할 때가 왔습니다!"
 SWE_anti_finnish_sentiment: "반핀란드 정서"
 SWE_anti_finnish_sentiment_desc: "그들을 다시 지배합시다."
 SWE_embrace_the_northern_resistance_movement: "북방 저항 운동 수용"
 SWE_embrace_the_northern_resistance_movement_desc: "스웨덴은 다시 스칸디나비아를 다스릴 것이다!"
 SWE_the_emperor_of_sweden: "스웨덴 황제"
 SWE_the_emperor_of_sweden_desc: "왕이 되는 것은 누구나 마음에 들어할 일이지만, 더 좋은 것이 있는 것을 아십니까? 황제가 되는 것입니다. '스웨덴의 국왕'은 진부한 입헌 군주제 국가의 진부한 통치자같이 들립니다. 하지만 '스웨덴의 황제'는 스웨덴을 다시한번 위대하게 만들고, 에스토니아를 다시 식민지화하며, 벨기에 국왕을 바보처럼 보여줄 수 있습니다."
 SWE_northern_militias: "북방 민병대"
 SWE_northern_militias_desc: "국내에서 민병대를 모집하면 우리 군의 규모가 커지고, 따라서 팽창을 위한 우리의 힘도 커집니다."
 SWE_baltic_colonization_plan: "발트 식민화 계획"
 SWE_baltic_colonization_plan_desc: "발트 국가 전체를 공격하면 스웨덴의 북부 지배가 보장될 것입니다."
 SWE_government_propaganda: "Office of Royal Communication"
 SWE_government_propaganda_desc: "정보는 권력이며, 왕실은 자신의 메시지를 통제해야 합니다. 왕실 공보처는 우리의 서사를 통일하고 반대 의견을 잠재울 것입니다."
 SWE_offer_province_status_to_estonia: "에스토니아에 편입 제안"
 SWE_offer_province_status_to_estonia_desc: "에스토니아에 주 지위를 제안함으로써 우리는 평화적인 방식으로 스웨덴 제국을 확장할 것입니다."
 SWE_tillbaka_till_riket: "왕국의 고향(Tillbaka till Riket)"
 SWE_tillbaka_till_riket_desc: "전 독일의 개념인 '제국의 고향(Heim ins Reich)'은 자국에 있어서 괜찮은 이념입니다."
 SWE_aryan_pact: "아리아 연합"
 SWE_aryan_pact_desc: "상호 파시스트 보장 조약(MFAP)은 유럽 영토 확장에 대한 우리의 이익을 지키는 동시에 우리 자신과 우리의 '동맹' 독일을 보호할 것입니다."
 SWE_state_control_of_newspapers: "신문 검열"
 SWE_state_control_of_newspapers_desc: "우리 언론은 이제 파시스트 국가의 통제를 받으며, 이는 사람들이 우리의 나치즘 유토피아를 믿게 만들 것입니다."
 SWE_censor_the_internet: "인터넷 검열"
 SWE_censor_the_internet_desc: "인터넷은 스웨덴 국민에게 위험한 곳이므로, 어디서나 국가 선전을 보장하기 위해 일부 지역에서는 검열하고 차단할 수 있습니다."
 SWE_ally_the_kaiser: "카이저와 동맹"
 SWE_ally_the_kaiser_desc: "독일 카이저 제국과 스웨덴 제국이 돌아왔습니다. 유럽에서 군주제를 지키기 위해 양국이 동맹을 맺기에 얼마나 좋은 시기입니까."
 SWE_the_swedish_imperial_army: "스웨덴 황립 육군"
 SWE_the_swedish_imperial_army_desc: "바이킹은 위대했습니다. 그렇다면 현대전은 어떻습니까?"
 SWE_the_swedish_imperial_air_force: "스웨덴 황립 공군"
 SWE_the_swedish_imperial_air_force_desc: "공군은 우리의 옛 제국에는 존재하지 않았으며, 새 제국에서는 세계 최고가 될 것입니다."
 SWE_pro_swedish_video_games: "전스웨덴주의 비디오 게임"
 SWE_pro_swedish_video_games_desc: "어찌 된 일인지 스톡홀름 출신의 스웨덴 기업이 역사를 다룬 훌륭한 게임을 만들기 시작했고, 우리가 대가를 지불하면 위대한 스웨덴 제국에 관한 특별한 게임을 만들어 주겠다고 제안했습니다."
 SWE_the_swedish_imperial_navy: "스웨덴 황립 해군"
 SWE_the_swedish_imperial_navy_desc: "스웨덴 왕립 해군은 세계에서 가장 오래된 해군 중 하나이며, 바이킹 시대에 우리는 발트해와 북유럽을 지배했습니다. 반면 현대에 우리 해군은 미완성입니다. 조선소를 더 짓고 해군력을 키워 스웨덴 해군을 다시 최고로 만들 것입니다!"
 Sweden.1.t: "스웨덴 국교회의 종말"
 Sweden.1.d: "스웨덴 교회는 스웨덴에서 가장 큰 기독교 교회 공동체이자 세계에서 두 번째로 큰 루터교 공동체이며 세 번째로 큰 개신교 교회로, 에티오피아의 루터교 메카네 예수스 교회와 영국의 성공회 잉글랜드 국교회보다만 작습니다.\n\n국가와 스웨덴 교회 사이의 긴밀한 연결은 최근 끊임없이 의문시되고 있으며, 스웨덴 교회는 스웨덴 정부와 군주제의 국교회로 지정되어 있습니다. 다른 많은 유럽 국가는 특정 교회 단체에 그러한 지위를 부여하지 않습니다. 비판자들의 눈에 이는 비기독교 신앙을 가진 외국인뿐 아니라 스웨덴의 소규모 가톨릭 및 정교회 공동체까지 차별하는 것입니다.\n\n스웨덴 교회는 이제 실질적인 권력을 갖고 있지 않습니다. 그들과의 관계를 폐지해야 하지 않겠습니까? 아니면 전통을 위해 유지해야 할까요?\n\n역사적으로 스웨덴은 2000년 1월 1일에 국교회와의 관계를 끊었습니다."
 Sweden.1.o1: "없애야 한다!"
 Sweden.1.o2: "루터교는 중요하다! 유지하라!"
 Sweden.1.o3: "어차피 토르와 오딘이 훨씬 낫다."
 Sweden.3.t: "스웨덴 국교회의 종말"
 Sweden.3.d: "스웨덴 교회는 스웨덴에서 가장 큰 기독교 교회 공동체이자 세계에서 두 번째로 큰 루터교 공동체이며 세 번째로 큰 개신교 교회로, 에티오피아의 루터교 메카네 예수스 교회와 영국의 성공회 잉글랜드 국교회보다만 작습니다.\n\n국가와 스웨덴 교회 사이의 긴밀한 연결은 최근 끊임없이 의문시되고 있으며, 스웨덴 교회는 스웨덴 정부와 군주제의 국교회로 지정되어 있습니다. 다른 많은 유럽 국가는 특정 교회 단체에 그러한 지위를 부여하지 않습니다. 비판자들의 눈에 이는 비기독교 신앙을 가진 외국인뿐 아니라 스웨덴의 소규모 가톨릭 및 정교회 공동체까지 차별하는 것입니다.\n\n스웨덴 교회는 이제 실질적인 권력을 갖고 있지 않습니다. 그들과의 관계를 폐지해야 하지 않겠습니까? 아니면 전통을 위해 유지해야 할까요?\n\n역사적으로 스웨덴은 2000년 1월 1일에 국교회와의 관계를 끊었습니다."
 Sweden.3.o1: "없애야 한다!"
 Sweden.3.o2: "루터교는 중요하다! 유지하라!"
 Sweden.3.o3: "어차피 토르와 오딘이 훨씬 낫다."
 Sweden.5.t: "위기 이후의 재정 결정"
 Sweden.5.d: "1990년대의 예산 및 경제 위기는 스웨덴에 상처를 남겼습니다. 우리의 지출은 수입을 훨씬 초과하고 있으며 무언가 조치를 취해야 합니다."
 Sweden.5.o1: "복지 삭감만이 유일한 선택이다."
 Sweden.5.o2: "적자는 불가피하다."
 Sweden.6.t: "릭스방크 정책"
 Sweden.6.d: "스웨덴 중앙은행은 주로 통화인 스웨덴 크로나를 관리하고, 그에 따라 스웨덴 경제에서 화폐 가치의 인플레이션과 디플레이션을 관리하는 임무를 맡고 있습니다. 릭스방크는 앞으로 몇 년간 어떻게 진행할지에 대한 새로운 지시가 필요합니다."
 Sweden.6.o1: "경제를 안정적으로 유지하라."
 Sweden.6.o2: "크로나를 팽창시켜라."
 Sweden.7.t: "친스웨덴 비디오 게임"
 Sweden.7.d: "비디오 게임은 실제 문제에 집중하는 대신 정치 비디오 게임을 하며 더 많은 시간을 보내는 어리석은 사람들에게 영향을 미치기 쉬운 방법입니다.\n\n어떤 프로젝트를 밀어붙여 완성해야 할까요? (1836년에서 1936년 사이를 배경으로 한 게임은 이미 제외했습니다. 그런 일은 일어나지 않을 테니까요.)\n\n기억하십시오. 우리는 아이들에게 스웨덴이 얼마나 위대한지 가르쳐야 합니다. 또한 핵심 게임플레이 기능은 유료 결제의 벽 뒤에 잠가 두어야 합니다."
 Sweden.7.o1: "'아이언하츠', 중립에 관한 게임.."
 Sweden.7.o2: "'에우로파 수프레말리스', 아프리카인을 노예로 삼는 게임."
 Sweden.7.o3: "'데우스 불트', 근친상간에 관한 게임."
 Sweden.8.t: "핀란드계 스웨덴인의 평등을 요구하는 스웨덴"
 Sweden.8.d: "스웨덴이 최근 핀란드에 대해 벌이는 신제국주의적 공세는 핀란드 내 스웨덴어 사용 소수 집단의 평등 요구로 정점에 달했습니다.\n\n문제는 이렇습니다. 그들은 이미 평등합니다. 그렇지 않다고 주장하는 이 집단 내 가장 큰 운동조차 지금까지 50명의 회원을 모았을 뿐입니다. 스웨덴인들이 기분 상할 만한 것은 아무것도 없으며, 우리가 바꿀 수 있는 것도 없습니다."
 Sweden.8.o1: "스웨덴인들은 미쳤다."
 Sweden.9.t: "발트 식민화 계획"
 Sweden.9.d: "발트 국가들은 스웨덴 종속 지위로 돌아와야 합니다. 에스토니아, 라트비아, 리투아니아는 용인할 만한 임시 해법이었지만, 그 시간은 끝났습니다."
 Sweden.9.o1: "스웨덴을 위하여!"
 Sweden.10.t: "우리에게 속주 지위를 제안하는 스웨덴"
 Sweden.10.d: "물론 우리는 늘 북유럽의 일부가 된다는 생각을 좋아했지만, 스웨덴은 최근 우리에게 매우... 노골적이었습니다. 그리고 이제 스웨덴 왕실 정부는 에스토니아에 스웨덴의 속주로 합류하라고 요구했습니다. 이는 주권 국가로서 에스토니아의 종말을 의미할 것입니다. 터무니없는 일입니다."
 Sweden.10.o1: "굴복할 수밖에 없다."
 Sweden.10.o2: "Never!"
 Sweden.11.t: "저항하는 에스토니아!"
 Sweden.11.d: "에스토니아는 에스토니아인들을 문명으로 이끄는 부담을 지겠다는 우리의 관대한 제안을 감히 거절했습니다. 그들이 답장을 문법 오류 없이 작성해 냈다는 점에 놀랐지만, 다음에 무슨 일이 일어날지는 의심스럽습니다. 어떻게 진행해야 할까요?"
 Sweden.11.o1: "선택지가 있다고 생각했다니 오해한 것이다."
 Sweden.11.o2: "뭐, 어쩔 수 없지. 다음 기회에 손봐 주자."
 Sweden_news.1.t: "통합되는 북유럽 은행 부문"
 Sweden_news.1.d: "중대한 금융 소식으로, 스웨덴의 노르드방켄이 덴마크의 유니방크 A/S 및 노르웨이의 크리스티아니아 방크 오그 크레디트카세와 전략적 합병을 발표했습니다. 새로 통합된 법인은 노르데아라는 이름으로 운영되어 북유럽 최대 금융기관 중 하나가 될 것입니다.\n\n이 조치는 북유럽 지역 경제 통합을 향한 중요한 진전으로, 국경을 넘는 은행 서비스를 간소화하고 공동의 금융 회복력을 강화합니다. 비판자들은 중앙집중화를 경고하지만, 지지자들은 규모에서 기회와 효율성을 봅니다."
 sweden_focus: "스웨덴 중점 계통도"
 SWE_germanic_roots: "게르만 뿌리 되살리기"
 SWE_germanic_roots_desc: "스웨덴의 유산은 한자 동맹 무역에서 북부 독일과의 왕조적 인연에 이르기까지 게르만 문화·정치 세계와 깊이 얽혀 있습니다. 이 유산을 인정함으로써 과거 협력 권역 전반에서 우리의 영향력을 강화하고 중부 유럽 문제에서 우리의 입지를 주장할 수 있습니다."
 SWE_union_with_denmark: "덴마크와의 연합 제안"
 SWE_union_with_denmark_desc: "수 세기에 걸친 경쟁에도 불구하고 스웨덴과 덴마크의 유대는 깊습니다. 새로운 연합은 정복이 아니라 공동의 의지와 왕조적 결합을 통해 스칸디나비아의 전략 지도를 바꿀 수 있습니다."
 SWE_pommerania_and_bremen_invest: "포메른과 브레멘 투자"
 SWE_pommerania_and_bremen_invest_desc: "북부 독일의 역사적 교역 거점과 왕실 영토는 다시 한번 우리의 경제·문화 권역의 일부가 될 수 있습니다. 항만, 조선소, 인프라에 대한 표적 투자가 정치적 재관여의 길을 열어 줄 것입니다."
 SWE_oranje_ports: "오라녜 항만 접근권 확보"
 SWE_oranje_ports_desc: "네덜란드의 항만은 한때 스웨덴 왕실을 대서양 세계와 이어 주었습니다. 저지대 국가에 해군과 경제적 입지를 재구축하면 해상 접근권이 확보되고 잊힌 유산이 되살아날 것입니다."
 SWE_guardians_of_the_baltics: "발트해의 수호자"
 SWE_guardians_of_the_baltics_desc: "발트해 주변의 불안정이 커짐에 따라, 스웨덴은 발트 지역의 주권, 무역, 안보의 수호자로 나서야 합니다. 이 역할에는 해군 주둔, 외교적 접촉, 필요하다면 단호한 군사적 입장이 요구될 것입니다."
 SWE_karelien_claims: "카렐리야 영유권 되살리기"
 SWE_karelien_claims_desc: "오랫동안 분쟁이 되어 온 카렐리야 땅은 깊은 문화적, 전략적 가치를 지니고 있습니다. 외교, 정착 프로그램, 압박 등 어떤 방법으로든 스웨덴은 이 변경 지역에서 영향력을 회복하는 길을 모색할 수 있습니다."
 SWE_poland_lituania_claims: "폴란드와 리투아니아 영유권 주장"
 SWE_poland_lituania_claims_desc: "역사적으로 스웨덴 군주들은 폴란드와 리투아니아 일부에 대한 영유권을 보유했습니다. 왕조적 권리를 내세우고 지역 세력을 지원함으로써 동서 사이의 이 분쟁 지대에서 우리의 영향력을 정당화할 수 있습니다."
 SWE_rumors_of_uprisings: "봉기의 소문"
 SWE_rumors_of_uprisings_desc: "스웨덴과의 문화적 유대가 여전히 강한 여러 지역에서 불만이 들끓고 있습니다. 정보에 따르면 우리의 대의에 동조하는 자치 운동이 일어날 가능성이 있습니다. 그저 지켜볼 것인가, 아니면 은밀히 행동을 준비할 것인가?"
 SWE_invest_and_settlement_deals: "정착 및 투자 협정 추진"
 SWE_invest_and_settlement_deals_desc: "우리의 영향력을 확고히 하기 위해 역사적으로 연결된 지역에서 전략적 정착 구상과 인프라 협정을 추진합니다. 경제적 입지와 인구 통로를 통해 스웨덴은 공식적인 병합 없이도 지역 세력 균형을 바꿀 수 있습니다."
 SWE_fb00: "국방 결정 2000"
 SWE_fb00_desc: "정부는 몇 년마다 국방장관과 함께 지역의 위협 수준과 취해야 할 접근 방식을 논의합니다. 정부는 선택한 길에 따라 군사비와 교리의 증감안을 의회에서 통과시킬 것입니다."
 SWE_fb04: "국방 결정 2004"
 SWE_fb04_desc: "정부는 몇 년마다 국방장관과 함께 지역의 위협 수준과 취해야 할 접근 방식을 논의합니다. 정부는 선택한 길에 따라 군사비와 교리의 증감안을 의회에서 통과시킬 것입니다."
 SWE_fb09: "국방 결정 2009"
 SWE_fb09_desc: "정부는 몇 년마다 국방장관과 함께 지역의 위협 수준과 취해야 할 접근 방식을 논의합니다. 정부는 선택한 길에 따라 군사비와 교리의 증감안을 의회에서 통과시킬 것입니다."
 SWE_fb15: "국방 결정 2015"
 SWE_fb15_desc: "정부는 몇 년마다 국방장관과 함께 지역의 위협 수준과 취해야 할 접근 방식을 논의합니다. 정부는 선택한 길에 따라 군사비와 교리의 증감안을 의회에서 통과시킬 것입니다."
 SWE_fb20: "국방 결정 2020"
 SWE_fb20_desc: "정부는 몇 년마다 국방장관과 함께 지역의 위협 수준과 취해야 할 접근 방식을 논의합니다. 정부는 선택한 길에 따라 군사비와 교리의 증감안을 의회에서 통과시킬 것입니다."
 SWE_foi: "총력방위 연구소(FOI)"
 SWE_foi_desc: "스웨덴 국방 연구소(FOA)와 국립 항공 연구소(FFA)를 통합하면 연구를 더 효과적으로 수행할 수 있습니다."
 SWE_democratic_politics: "민주주의의 미래"
 SWE_democratic_politics_desc: "스웨덴은 민주주의 사상의 오랜 역사를 지니고 있으며, 이를 전 세계로 더 널리 퍼뜨리기 위해 열심히 노력해 왔습니다."
 SWE_soc_1: "스웨덴 혁신 투자"
 SWE_soc_1_desc: "연구와 혁신 면에서 다른 모든 나라보다 앞서 간다면 우리는 언제나 우위를 점할 것입니다."
 SWE_soc_2: "정치적 노력"
 SWE_soc_2_desc: "안정도와 더 많은 정치력을 얻기 위해 함께 노력합니다."
 SWE_soc_3: "노조 확대"
 SWE_soc_3_desc: "고용주와 좋은 근로 조건을 갖추는 것은 모든 인간의 권리여야 합니다."
 SWE_soc_4: "난민의 피난 허용"
 SWE_soc_4_desc: "중동에서 현재 벌어지는 전쟁을 고려할 때, 위기에서 벗어나 전쟁이 끝나 돌아갈 수 있을 때까지 안전한 곳에 피신하기를 원하는 모든 남녀를 돌보는 것은 분명 우리의 책무입니다."
 SWE_soc_5: "북부 훈련"
 SWE_soc_5_desc: "우리 군이 동쪽에서 오는 어떤 침공도 버텨낼 수 있음을 시민들에게 보여 주기 위해 고급 훈련을 개최해야 합니다."
 SWE_archer: "아처 자주포 체계 개발"
 SWE_archer_desc: "다른 나라들은 무기를 수입하기로 하지만, 그들에게는 우리처럼 옆에 곰이 있지 않으므로 우리는 더 나아가 현대사 최고의 자주포 중 하나를 만들어야 합니다."
 SWE_mod_1: "사브 코쿰스 자금 지원"
 SWE_mod_1_desc: "우리의 침묵의 전력을 건조하는 현재 업체인 사브 코쿰스는 해안을 지키기 위해 더 새롭고 더 나은 잠수함을 계속 공급하려면 추가 투자가 필요합니다."
 SWE_mod_2: "에너지 위기 해결"
 SWE_mod_2_desc: "녹색당은 수년간 안전 점검을 통과한 원자로를 강제로 폐쇄하여 겨울철 전기 요금을 망쳐 놓았습니다. 지독하게 춥고 바람이 불지 않을 때, 그들의 새롭고 멋진 풍력 터빈은 아무 소용이 없을 것입니다."
 SWE_mod_3: "스웨덴 항공모함"
 SWE_mod_3_desc: "미국인들은 우리의 문화적 섬을 침몰하지 않는 항공모함이라고 부릅니다. 꽤 좋은 아이디어처럼 들리니, 그렇게 합시다."
 SWE_mod_4: "스웨덴산 품질 투자"
 SWE_mod_4_desc: "스웨덴산 제품은 언제나 훌륭한 품질을 자랑했습니다. 이를 더욱 개선하여 명성을 쌓으면 외국 투자자와 구매자를 끌어들일 것입니다."
 SWE_new_to_nato: "나토 신입 회원"
 SWE_new_to_nato_desc: "우리는 모든 나토 회원국의 비준을 성공적으로 받았습니다. 이는 우리의 보호를 보장하고 동맹을 더 강하게 만듭니다. 그러나 새롭게 열린 산업적 기회도 탐색해야 합니다."
 SWE_nato_standards: "나토 표준 달성"
 SWE_nato_standards_desc: "우리 군은 중립적 견해 때문에 불이익을 받았습니다. 우리 자신과 동맹국을 지킬 수 있도록 군을 다시 나토 표준에 맞출 때입니다!"
 SWE_nato_contracts: "나토 계약"
 SWE_nato_contracts_desc: "새로 열린 기회에는 경쟁자들이 정치적 편향을 자기 이익에 이용해 이전에는 어려웠던 군사 계약이 포함됩니다. 이번에는 수입과 수출 거래를 더 쉽게 찾을 수 있을 것입니다."
 SWE_american_contracts: "미국 계약"
 SWE_american_contracts_desc: "미국과의 거래를 통해 어떤 군사 장비를 얻을 수 있는지 조사해야 합니다."
 SWE_air_force_expansion: "공군 확장"
 SWE_air_force_expansion_desc: "1960년대의 노후한 우리 C-130H는 상태가 좋지만 오랜 세월이 지났으며, 더 새로운 버전이 우리의 전략적, 국제적 역량에 도움이 될 것입니다."
 SWE_drones_for_sweden: "스웨덴을 위한 드론"
 SWE_drones_for_sweden_desc: "최근 분쟁은 무인 전쟁의 중요성을 보여 주었습니다. 미국에 연락하여 구형 기종 일부를 기성품으로 구입하는 것을 시도해야 합니다."
 SWE_attack_helicopters: "스웨덴 헬리콥터"
 SWE_attack_helicopters_desc: "미국은 구형 공격 헬리콥터를 판매하려 합니다. 이는 더 싼 가격에 구입할 좋은 기회를 열어 주었습니다. 칼 구스타프 무반동총을 더 수출하면 더 싸게 구입할 수 있을지도 모릅니다."
 SWE_german_contracts: "독일 계약"
 SWE_german_contracts_desc: "남쪽 이웃인 독일과의 거래를 통해 어떤 군사 장비를 얻을 수 있는지 조사해야 합니다."
 SWE_panzer_expansion: "기갑 확장"
 SWE_panzer_expansion_desc: "군에 전차를 더 늘리면 지상전 역량이 향상될 것입니다."
 SWE_domestic_tank_factories: "국내 전차 공장"
 SWE_domestic_tank_factories_desc: "이제 나토의 일원이 되었으니 과거의 전차 생산을 되돌아보고, 우리가 직접 수출할 수 있는 새로운 전차(stridsvagn)를 개발해야 합니다. 어떤 소식통이 말하길 FOI가 스웨덴군으로부터 신형 레오파르트 한 대를 임대했다고 합니다."
 SWE_artillery_collaborations: "포병 협력"
 SWE_artillery_collaborations_desc: "이전의 노르웨이와의 협력은 큰 성공을 거두었습니다. 독일도 새로운 지원 포병 차량을 도입하려 합니다. 이 기회를 이용해 양측 모두에게 이득이 되는 거래를 성사시켜야 합니다."
 SWE_canadian_gripens: "캐나다의 그리펜"
 SWE_canadian_gripens_desc: "이제 나토의 일원이 되었으니 캐나다와 JAS 39E 공동 사업에 관한 대화를 시작할 수 있습니다. 양국 모두에게 훌륭한 전투기입니다."
 SWE_forsvarsmakten: "스웨덴군(Försvarsmakten)"
 SWE_forsvarsmakten_desc: "국방은 우리 안보의 근간입니다. 스웨덴군(Försvarsmakten)을 강화하는 것은 우리의 주권을 지키고 국경의 보호를 보장하는 데 필수적입니다."
 SWE_batch_3: "JAS 3차 배치"
 SWE_batch_3_desc: "JAS 3차 배치의 개발과 생산에 투자하면 우리 공군이 현대화되어 현대전의 도전에 대응할 수 있는 최첨단 전투기를 확보하게 됩니다."
 SWE_batch_4: "JAS 4차 배치"
 SWE_batch_4_desc: "공군의 진화를 이어 가는 JAS 4차 배치 사업은 우리 항공 역량을 한층 더 발전시키는 것을 목표로 합니다. 이 투자는 우리가 항공 기술의 최전선에 머물도록 보장합니다."
 SWE_next_generation_gripen: "차세대 그리펜"
 SWE_next_generation_gripen_desc: "차세대 그리펜 개발에 착수함으로써, 우리는 국방 수요에 부응할 뿐 아니라 잠재적으로 값진 수출 상품이 될 수도 있는 최첨단 전투기를 만들고자 합니다."
 SWE_ak5: "자동 카빈 5(Ak 5)"
 SWE_ak5_desc: "표준 소총인 자동 카빈 5(Automatkarbin 5)를 개량하면 보병이 최신 소형 화기 기술로 무장하게 되어 지상군의 효율이 높아집니다."
 SWE_cv90_fleet: "전투 차량 90(CV90)"
 SWE_cv90_fleet_desc: "전투 차량 90(Stridsfordon 90) 장갑차 보유 대수를 늘리고 현대화하면 지상군의 역량이 강화되며, 다양한 전투 상황에 대비한 신뢰할 수 있는 첨단 장비를 갖추게 됩니다."
 SWE_bae_systems_ab: "BAE 시스템즈 AB"
 SWE_bae_systems_ab_desc: "BAE 시스템즈 AB와 제휴하면 공동 방위 사업의 기회가 열리고, 기술 교류가 촉진되며, 우리 군사 역량의 지속적인 향상이 보장됩니다."
 SWE_the_infantry: "보병대(Infanteriet)"
 SWE_the_infantry_desc: "보병의 훈련, 장비, 사기에 대한 투자는 무엇보다 중요합니다. 강하고 잘 준비된 보병은 우리 군의 근간을 이루며 다양한 전선에서 도전에 대응할 수 있습니다."
 SWE_luftvarnet: "방공대(Luftvärnet)"
 SWE_luftvarnet_desc: "방공대(Luftvärnet) 투자를 통해 방공 역량을 강화하면 우리 영공이 안전하게 유지되고, 공중 위협으로부터 국가를 보호하며 영공 통제권을 유지할 수 있습니다."
 SWE_visby_class: "비스뷔급"
 SWE_visby_class_desc: "비스뷔급 함정의 개발과 생산을 계속하면 해군력이 강화되어 해전에서 첨단 역량을 갖추고 우리의 해양 이익을 지킬 수 있습니다."
 SWE_visby_class_2: "비스뷔급 II"
 SWE_visby_class_2_desc: "비스뷔급의 성공을 바탕으로 한 비스뷔급 II 사업은 우리 해군 역량을 한층 더 강화하여 함대가 해군 기술의 최전선에 머물도록 하는 것을 목표로 합니다."
 SWE_hms_uppland: "HMS 웁플란드"
 SWE_hms_uppland_desc: "HMS 웁플란드 잠수함 사업에 투자하면 수중 역량이 강화되어 해군에 은밀하고 강력한 전력이 추가됩니다."
 SWE_blekinge_class: "블레킹에급"
 SWE_blekinge_class_desc: "블레킹에급 함정의 개발은 해군 함대를 확장하여 해상 작전의 다양한 임무를 수행할 수 있는 다목적 함선을 제공합니다."
 SWE_lulea_class: "룰레오급"
 SWE_lulea_class_desc: "해군 역량을 향상시키는 룰레오급 사업은 함대에 현대적이고 효율적인 함선을 도입하여 해군이 미래의 도전에 잘 대비하도록 하는 것을 목표로 합니다."
 SWE_flygvapnet: "공군(Flygvapnet)"
 SWE_flygvapnet_desc: "공군(Flygvapnet)을 강화하는 것은 제공권을 유지하는 데 필수적입니다. 이 중점은 공군을 최고 수준으로 유지하기 위한 기술, 훈련, 기반시설 투자를 포괄합니다."
 SWE_armen: "육군(Armén)"
 SWE_armen_desc: "육군(Armén)의 역량을 강화하는 것은 지상 작전에 매우 중요합니다. 이 중점은 육군이 다양한 상황에 대비할 수 있도록 장비, 훈련, 전략 기획에 대한 투자를 수반합니다."
 SWE_marinen: "해군(Marinen)"
 SWE_marinen_desc: "해군(Marinen)을 강화하는 것은 우리의 해양 이익을 지키는 데 필수적입니다. 이 중점은 강력하고 유능한 해군을 유지하기 위한 해군 기술, 함대 확장, 전략적 제휴에 대한 투자를 포함합니다."
 SWE_rymdvapnet: "우주군(Rymdvapnet)"
 SWE_rymdvapnet_desc: "우주 방위 영역을 탐구하는 우주군(Rymdvapnet) 중점은 대기권 너머의 우리 이익을 지키기 위한 위성 기술, 우주 기반 감시, 전략적 역량에 대한 투자를 수반합니다."
 SWE_adopt_norwegian_model: "노르웨이 모델 도입"
 SWE_adopt_norwegian_model_desc: "노르웨이는 원자재와 석유 수출로 먼 길을 걸어왔습니다. 우리에게는 석유가 많지 않을 수 있지만, 유럽 최대의 희토류 금속 매장량 위에 앉아 있습니다."
 SWE_Digital_agenda: "디지털 어젠다"
 SWE_Digital_agenda_desc: "스웨덴은 디지털 혁명을 받아들여야 합니다. 포괄적인 어젠다를 통해 우리는 연결되고 경쟁력 있는 미래로 가는 길을 이끌 것입니다."
 SWE_bredbandslyftet: "광대역 도약"
 SWE_bredbandslyftet_desc: "고속 광대역 접속은 혁신, 교육, 농촌 발전에 필수적입니다. 우리는 전국 연결망에 투자할 것입니다."
 SWE_IT_skolan: "학교 IT"
 SWE_IT_skolan_desc: "스웨덴 학생들은 내일의 세계를 준비할 수 있는 디지털 도구와 환경을 누릴 자격이 있습니다. 우리는 IT를 통해 교육을 현대화할 것입니다."
 SWE_digitalize_administration: "행정 디지털화"
 SWE_digitalize_administration_desc: "공공 서비스는 효율적이고 사용자 친화적이어야 합니다. 정부 행정을 디지털화함으로써 관료주의를 줄이고 투명성을 높입니다."
 SWE_nordic_cooperation: "북유럽 디지털 협력"
 SWE_nordic_cooperation_desc: "우리는 디지털 인프라, 혁신, 사이버 보안 분야에서 북유럽 이웃 국가들과의 협력을 강화할 것입니다."
 SWE_swedish_alone: "디지털 주권"
 SWE_swedish_alone_desc: "스웨덴은 외국 플랫폼에 대한 의존을 최소화하고 데이터 무결성을 보장하는 자체 보안 디지털 시스템을 개발할 것입니다."
 SWE_Vinnova_digital_innovation: "비노바 디지털 혁신 보조금"
 SWE_Vinnova_digital_innovation_desc: "혁신 기관 비노바가 전국의 최첨단 디지털 연구와 창업에 자금을 지원하는 노력을 주도할 것입니다."
 SWE_E_legitimation_for_citizen: "모든 시민을 위한 전자 신분증"
 SWE_E_legitimation_for_citizen_desc: "안전하고 보편적인 전자 신분 확인 시스템은 모든 스웨덴인이 현대적인 디지털 서비스를 이용할 수 있도록 보장할 것입니다."
 SWE_IT_start_up: "IT 스타트업 지원"
 SWE_IT_start_up_desc: "자금 지원, 멘토링, 글로벌 디지털 시장 접근을 통해 스웨덴의 스타트업 생태계를 활성화할 것입니다."
 SWE_second_digital_agenda: "디지털 어젠다 2.0"
 SWE_second_digital_agenda_desc: "토대가 마련되었으니, 이제 클라우드 전략, AI 체계, 글로벌 리더십으로 우리의 디지털 포부를 넓힐 때입니다."
 SWE_coding_in_school: "교육과정 속 코딩"
 SWE_coding_in_school_desc: "프로그래밍은 스웨덴 학교의 핵심 교과가 되어 다음 세대가 디지털 세계를 만들어 갈 수 있도록 할 것입니다."
 SWE_digital_education_for_all: "모두를 위한 디지털 교육"
 SWE_digital_education_for_all_desc: "평생에 걸친 디지털 소양은 포용의 열쇠입니다. 우리는 모든 시민이 도구, 교육, 기회에 접근할 수 있도록 보장할 것입니다."
 SWE_Industrial_digitalisation: "산업 디지털화"
 SWE_Industrial_digitalisation_desc: "스웨덴은 디지털 혁명의 최전선에 머물러야 합니다. 자동화, 스마트 제조, AI 기반 생산 방식에 투자함으로써 글로벌 시장에서 우리의 산업 생산성과 경쟁력을 높일 것입니다."
 SWE_revitalize_the_nation: "국가 활성화"
 SWE_revitalize_the_nation_desc: "스웨덴 경제의 근간을 강화해야 합니다. 금융 체계와 우선순위를 재편함으로써 더 강한 미래의 토대를 마련합니다."
 SWE_Riksbanken_souveranity: "릭스방크 주권"
 SWE_Riksbanken_souveranity_desc: "스웨덴 중앙은행은 독립적이고 결단력 있게 행동해야 합니다. 우리는 그 주권을 강화하고 외국이나 정치권의 영향으로부터 보호할 것입니다."
 SWE_AP_fonderna_restructure: "AP 기금 구조조정"
 SWE_AP_fonderna_restructure_desc: "우리의 공적 연금 기금은 장기적 지속 가능성과 국가적 회복력에 맞게 조정되어야 합니다."
 SWE_kosolidate_budgets: "예산 통합"
 SWE_kosolidate_budgets_desc: "재정 책임은 금융 안정의 열쇠입니다. 균형 잡히고 투명한 예산은 국민의 신뢰를 회복시킬 것입니다."
 SWE_inflation_goal: "물가 목표 재확인"
 SWE_inflation_goal_desc: "물가 안정은 경제의 예측 가능성에 매우 중요합니다. 우리는 물가 목표를 통화 정책의 초석으로 강화할 것입니다."
 SWE_global_investments: "글로벌 투자 유치"
 SWE_global_investments_desc: "스웨덴은 국제 자본에 안정적이고 매력적인 목적지로 인식되어야 합니다. 우리는 책임 있는 글로벌 투자를 위한 새로운 경로를 열 것입니다."
 SWE_regularly_bond_trade: "정기 국채 거래"
 SWE_regularly_bond_trade_desc: "체계적인 국채 발행 제도는 더 현명한 부채 관리와 시장 통제를 가능하게 할 것입니다."
 SWE_no_bonds_just_gold: "채권 없이 금만"
 SWE_no_bonds_just_gold_desc: "부채 수단을 포기하고, 지속되는 국가 가치를 보장하기 위해 금 기반의 재정 준비금 모델로 돌아갑니다."
 SWE_transparency_law: "국가 투명성 법"
 SWE_transparency_law_desc: "금융 절차, 데이터, 결정이 대중과 언론에 공개되도록 보장하는 법안을 통과시킬 것입니다."
 SWE_stabilize_the_exchange: "크로나 환율 안정화"
 SWE_stabilize_the_exchange_desc: "변동성은 무역과 저축 모두를 위협합니다. 우리는 자국 통화의 가치를 안정시키는 장치를 도입할 것입니다."
 SWE_Pension_only: "연금 전용 준비금 모델"
 SWE_Pension_only_desc: "공공 자산을 연금에 집중하면 투기와 글로벌 충격으로부터 분리되어 은퇴자의 미래가 보장됩니다."
 SWE_Norwegian_fond_model: "노르웨이 기금 모델 도입"
 SWE_Norwegian_fond_model_desc: "이웃 나라에서 영감을 얻어, 자원에서 나온 부를 모든 스웨덴인에게 이익이 되는 글로벌 장기 투자 기금으로 돌릴 것입니다."
 SWE_Back_up_Privat_banks: "민간 은행 지원"
 SWE_Back_up_Privat_banks_desc: "위기 시 민간 은행의 생존을 보장하기 위해 비상 준비금과 개입 절차를 마련할 것입니다."
 SWE_Digitalize_central_bank: "중앙은행 디지털화"
 SWE_Digitalize_central_bank_desc: "현대적인 도구와 플랫폼은 우리 중앙은행을 그 어느 때보다 빠르고, 정확하고, 투명하게 만들 것입니다."
 SWE_allow_crypto: "암호화폐 허용"
 SWE_allow_crypto_desc: "암호화폐 사용을 합법화하고 규제하여 디지털 자산을 국가 금융 체계에 편입할 것입니다."
 SWE_centralize_finacial_supervision: "금융 감독 일원화"
 SWE_centralize_finacial_supervision_desc: "모든 금융 감독은 공백과 부패를 없애기 위해 단일하고 효율적인 기관 아래 통합될 것입니다."
 SWE_Digital_statistics_and_intrest_rate: "경제 통계 및 금리 관리 디지털화"
 SWE_Digital_statistics_and_intrest_rate_desc: "디지털 추적과 예측 분석을 활용하여 금리와 경제 지표를 감시하고 조정하는 방식을 혁신할 것입니다."
 SWE_automotive_Sector: "자동차 부문 활성화"
 SWE_automotive_Sector_desc: "우리 경제의 기둥인 스웨덴 자동차 산업은 새로운 투자, 기술, 국제 협력으로 현대화하고 지원해야 합니다."
 SWE_swedisch_industry: "스웨덴 산업 강화"
 SWE_swedisch_industry_desc: "제조업에서 중공업에 이르기까지 스웨덴의 생산성은 국가적 자산입니다. 새로운 세대를 위해 우리의 산업 기반을 보호하고 강화할 것입니다."
 SWE_Vattenfall_restructure: "바텐팔 구조조정"
 SWE_Vattenfall_restructure_desc: "바텐팔은 더 효율적이고, 혁신적이며, 미래에 대비해야 합니다. 전략적 구조조정을 통해 녹색 에너지와 안정적 에너지의 선두 주자로 탈바꿈할 것입니다."
 SWE_Pharma_industry_foundings: "제약 산업 자금 지원"
 SWE_Pharma_industry_foundings_desc: "공중 보건, 수출 잠재력, 생명과학 분야의 글로벌 명성을 높이기 위해 제약 부문에 투자할 것입니다."
 SWE_astrazeneca_focus: "아스트라제네카 확장"
 SWE_astrazeneca_focus_desc: "아스트라제네카는 우리의 대표 제약 기업 중 하나입니다. 그 성장과 연구개발을 지원하면 스웨덴과 그 너머에 장기적인 이익이 돌아갈 것입니다."
 SWE_Pharmacia_focus: "파마시아 부활"
 SWE_Pharmacia_focus_desc: "파마시아는 한때 글로벌 선두 기업이었습니다. 표적을 정한 지원을 통해 과학, 혁신, 회복력으로 다시 정상에 올려놓을 수 있습니다."
 SWE_attract_partners_japan: "일본 파트너 유치"
 SWE_attract_partners_japan_desc: "일본 기업과의 전략적 제휴는 기술적 시너지와 강력한 양자 성장 기회를 가져올 것입니다."
 SWE_attract_partners_USA: "미국 파트너 유치"
 SWE_attract_partners_USA_desc: "미국 투자자 및 기업과 협력하면 스웨덴 산업을 위한 강력한 연구, 시장, 생산 경로가 열릴 것입니다."
 SWE_attract_partners_Germany: "독일 파트너 유치"
 SWE_attract_partners_Germany_desc: "독일의 정밀성과 스웨덴의 혁신은 강력한 산업 동맹을 만들어 상호 발전과 확장을 촉진할 수 있습니다."
 SWE_Vattenfall_PL: "폴란드의 바텐팔"
 SWE_Vattenfall_PL_desc: "폴란드에서 바텐팔의 에너지 사업을 확대하여 지역적 영향력과 에너지 안보를 강화할 것입니다."
 SWE_Vattenfall_GER: "독일의 바텐팔"
 SWE_Vattenfall_GER_desc: "독일의 에너지 인프라에 대한 투자는 바텐팔의 국경 간 에너지 연결과 경제적 수익을 높일 것입니다."
 SWE_Vattenfall_NL: "네덜란드의 바텐팔"
 SWE_Vattenfall_NL_desc: "네덜란드에서의 우리 입지는 재생 에너지 투자와 지속 가능한 유럽 협력 구축에 초점을 맞출 것입니다."
 SWE_british_SWE_partnership: "영국-스웨덴 파트너십"
 SWE_british_SWE_partnership_desc: "영국과의 양자 협정은 상호 경쟁력을 강화하기 위해 과학, 산업, 에너지 협력에 중점을 둘 것입니다."
 SWE_biotech_startups: "바이오테크 스타트업 지원"
 SWE_biotech_startups_desc: "세계 의학의 최전선에 있는 신생 바이오테크 기업을 지원하기 위해 국가 기금과 혁신 거점을 설립할 것입니다."
 SWE_found_biovitrum_AB: "비오비트룸 AB 설립"
 SWE_found_biovitrum_AB_desc: "비오비트룸 AB는 스웨덴 생명공학과 희귀 질환 치료제 개발의 초석이 될 것입니다."
 SWE_in_market_production: "시장 대응형 생산 장려"
 SWE_in_market_production_desc: "제약 및 기술 부문 전반에서 연구 단계에서 확장 가능한 수출용 생산으로 전환하는 기업을 지원할 것입니다."
 SWE_made_in_sweden: "메이드 인 스웨덴"
 SWE_made_in_sweden_desc: "국가 브랜드 구상은 스웨덴산 제품을 전 세계에 고품질, 지속 가능, 미래 지향적인 제품으로 홍보할 것입니다."
 SWE_Vattenfall_windparks: "바텐팔 풍력 단지 확장"
 SWE_Vattenfall_windparks_desc: "풍력은 우리 재생 에너지 미래의 핵심 부분이 될 것입니다. 바텐팔이 풍력 발전 용량을 확대하도록 지원할 것입니다."
 SWE_Vattenfall_nuclear: "바텐팔 원자력 현대화"
 SWE_Vattenfall_nuclear_desc: "원자력은 우리의 전략적 에너지원 구성에 계속 남을 것입니다. 우리는 원자로를 현대화하고 장기적 지속 가능성을 보장할 것입니다."
 SWE_sodertalje_science_center: "쇠데르텔리에 과학 센터"
 SWE_sodertalje_science_center_desc: "학계, 산업계, 스타트업을 한데 모으는 선도적인 과학 및 혁신 센터를 쇠데르텔리에에 설립할 것입니다."
 SWE_cooperation_with_universities: "대학-산업 협력"
 SWE_cooperation_with_universities_desc: "우리 대학은 보조금, 혁신 과제, 연구개발 프로젝트를 통해 산업계와 긴밀히 협력할 것입니다."
 SWE_fusion_swedish_orphan_biovitrum: "스웨디시 오펀 비오비트룸과 합병"
 SWE_fusion_swedish_orphan_biovitrum_desc: "희귀 의약품 분야 주요 기업들의 합병은 스웨덴을 희귀 질환 솔루션의 글로벌 거점으로 자리매김하게 할 것입니다."
 SWE_volvo_investments: "볼보에 투자"
 SWE_volvo_investments_desc: "볼보의 글로벌 위상을 보존하기 위해 전기차, 스마트 차량, 자율주행차 시장으로의 전환을 지원할 것입니다."
 SWE_northvolt_invests: "노스볼트 투자 지원"
 SWE_northvolt_invests_desc: "노스볼트의 배터리 기술은 우리의 청정 전환에 매우 중요합니다. 스웨덴과 유럽 전역으로의 규모 확대를 지원할 것입니다."
 SWE_Saab_investments: "사브의 이중 혁신 지원"
 SWE_Saab_investments_desc: "방위에서 항공에 이르기까지 사브는 핵심 자산입니다. 민간과 군사 양쪽의 기술 최전선에 투자할 것입니다."
 SWE_Vattenfall_energy_link_ger: "독일과의 바텐팔 에너지 연결"
 SWE_Vattenfall_energy_link_ger_desc: "독일과의 견고한 에너지 연결은 수출을 늘리고 북유럽 전력망을 안정시킬 것입니다."
 SWE_Vattenfall_biomass: "바텐팔 바이오매스 구상"
 SWE_Vattenfall_biomass_desc: "화석 연료 의존을 줄이고 농촌 산업을 지원하기 위해 바텐팔의 바이오매스 생산과 연구를 확대할 것입니다."
 SWE_Vattenfall_energy_link_baltics: "발트 국가와의 바텐팔 연결"
 SWE_Vattenfall_energy_link_baltics_desc: "청정 전력 수출과 공동 전력망 개발을 통해 발트 국가들과의 에너지 협력을 심화할 것입니다."
 SWE_expand_pharma_capacity: "제약 생산 능력 확대"
 SWE_expand_pharma_capacity_desc: "공중 보건 안보와 경제 성장 모두에 중점을 두고 생명을 구하는 의약품의 국내 생산을 늘릴 것입니다."
 SWE_adapt_international_approval_standards: "국제 의약품 표준 조화"
 SWE_adapt_international_approval_standards_desc: "글로벌 규제 표준을 채택하면 스웨덴 제약 수출이 빨라지고 개발 과정이 간소화될 것입니다."
 SWE_excavation: "광산 채굴 투자"
 SWE_excavation_desc: "스웨덴의 광물 자원은 대부분 개발되지 않은 채 남아 있습니다. 채굴 기술에 투자하고 새로운 자원 지역을 조사하면 경제적 기회를 열고 우리의 산업적 야망에 힘을 실을 수 있습니다."
 SWE_heavy_industry_expansion: "중공업 확장"
 SWE_heavy_industry_expansion_desc: "현대 국가에는 튼튼한 중공업 기반이 필요합니다. 인프라 개발과 보조금을 통해 강철, 기계, 가공 소재의 생산량을 늘릴 것입니다."
 SWE_Mechanic_sector: "기계 부문 지원"
 SWE_Mechanic_sector_desc: "스웨덴의 기계 산업은 세계적 수준입니다. 전략적 지원으로 혁신, 정밀 제조, 고부가가치 부품 생산을 촉진할 수 있습니다."
 SWE_Svenska_Kullagerfabriken: "SKF – 세계를 위한 베어링"
 SWE_Svenska_Kullagerfabriken_desc: "스벤스카 쿨라게르파브리켄(SKF)은 세계 시장에 필수적인 볼 베어링 기술을 공급합니다. 이 회사에 힘을 실어 줌으로써 민간과 군수 생산 모두에 고품질 부품을 확보합니다."
 SWE_Kiruna_mine: "키루나 광산 확장"
 SWE_Kiruna_mine_desc: "키루나 철광석 광산은 세계 최대 규모 중 하나입니다. 생산 능력을 늘리고 수송망을 개선하면 전략 물자의 안정적 공급이 보장될 것입니다."
 SWE_sandvik_invest: "산드비크 엔지니어링 투자"
 SWE_sandvik_invest_desc: "산드비크는 첨단 공구와 소재 분야의 선두 기업입니다. 우리의 투자는 금속 가공, 채광, 소재 혁신에서 이들의 역할을 강화할 것입니다."
 SWE_Aitik: "아이티크 구리 광산 개발"
 SWE_Aitik_desc: "노르보텐의 아이티크 광산에는 방대한 구리 매장량이 있습니다. 이곳을 전략적으로 개발하면 전자 산업과 산업 성장이 뒷받침될 것입니다."
 SWE_SSAB: "SSAB와 강철 생산"
 SWE_SSAB_desc: "스벤스크 스탈 AB(SSAB)는 강철 생산의 최전선에 있습니다. 공장을 현대화하고 확장함으로써 스웨덴은 국내외에 고품질 강철을 공급할 수 있습니다."
 SWE_hexagon_manifacturing_inteligence: "헥사곤 제조 인텔리전스"
 SWE_hexagon_manifacturing_inteligence_desc: "스웨덴 기업 헥사곤은 정밀 측정과 제조 소프트웨어 분야를 선도합니다. 이들의 혁신을 지원하면 우리의 산업 경쟁력이 높아집니다."
 SWE_improve_mining_equipment: "광산 장비 현대화"
 SWE_improve_mining_equipment_desc: "더 선진적이고, 자동화되고, 내구성 있는 광산 장비를 개발함으로써 업계 전반의 효율성을 높이고 노동자의 위험을 줄입니다."
 SWE_Malmberget: "말름베리에트 광산 투자"
 SWE_Malmberget_desc: "말름베리에트 광산에는 풍부한 철광석 매장량이 있습니다. 이곳의 채굴 역량을 높이면 늘어나는 원자재 수요를 충족하는 데 도움이 될 것입니다."
 SWE_Garpenberg: "가르펜베리 사업 현대화"
 SWE_Garpenberg_desc: "아연과 은을 비롯한 가르펜베리의 다금속 자원은 현대 산업에 매우 중요합니다. 이 광산의 인프라를 개선하면 생산량을 극대화할 수 있습니다."
 SWE_focus_on_sveden: "국내 산업 집중"
 SWE_focus_on_sveden_desc: "해외로 눈을 돌리기 전에 먼저 우리 자신의 산업 기반을 강화하여 스웨덴이 자립적이고 회복력 있는 나라가 되도록 해야 합니다."
 SWE_support_expansion: "산업 확장 지원"
 SWE_support_expansion_desc: "우리 산업은 성장을 앞두고 있습니다. 국가의 지원으로 사업 규모를 키우고, 더 많은 시민을 고용하고, 스웨덴의 우수함을 수출할 수 있습니다."
 SWE_mining_investments: "광업 투자 확대"
 SWE_mining_investments_desc: "광물 채굴은 산업 역량의 기둥입니다. 이 부문에 대한 전략적 투자는 어떤 도전에도 대응할 자원을 확보하게 해 줄 것입니다."
 SWE_attract_investors: "외국인 투자 유치"
 SWE_attract_investors_desc: "글로벌 자본은 안정적이고 혁신적인 경제를 찾고 있습니다. 시장을 개방하고 인센티브를 제공함으로써 필수적인 투자를 유치할 수 있습니다."
 SWE_mechanic_in_perfection: "기계 분야의 완성도"
 SWE_mechanic_in_perfection_desc: "정밀성과 혁신은 스웨덴 기계 공업을 규정합니다. 우리는 기계 공학 전문성을 계속 다듬어 전 세계로 수출할 것입니다."
 SWE_swedish_projects: "스웨덴 개발 프로젝트"
 SWE_swedish_projects_desc: "스웨덴은 산업과 혁신 그 이상입니다. 인프라, 지역 성장, 국가 정체성에 투자함으로써 균형 잡히고 번영하는 사회를 보장합니다."
 SWE_found_visit_sverige: "비지트 스웨덴 설립"
 SWE_found_visit_sverige_desc: "관광객을 끌어들이고 스웨덴만의 매력을 부각하기 위해, 자연에서 도시 생활까지 모든 것을 선보이는 국가 관광청 '비지트 스웨덴'을 설립할 것입니다."
 SWE_Stockholm_and_upsala: "스톡홀름과 웁살라 홍보"
 SWE_Stockholm_and_upsala_desc: "우리의 수도와 그 역사적 쌍둥이 도시는 엄청난 문화적, 경제적 가치를 지니고 있습니다. 스톡홀름과 웁살라를 전략적으로 홍보하면 관광과 국가적 자부심이 모두 높아집니다."
 SWE_promote_lappland_and_raindeer: "라플란드와 순록 트레일"
 SWE_promote_lappland_and_raindeer_desc: "스웨덴 북부는 숨 막히는 풍경과 사미족 문화 체험을 제공합니다. 순록 사육과 겨울 모험을 갖춘 진정한 북극 여행지로 라플란드를 홍보할 것입니다."
 SWE_Goteborg_and_the_south: "예테보리와 남부 해안"
 SWE_Goteborg_and_the_south_desc: "스웨덴의 서해안과 남해안은 미식 체험, 매력적인 마을, 해양 유산을 제공합니다. 예테보리는 이 햇살 가득하고 경치 좋은 지역으로 가는 관문 역할을 할 것입니다."
 SWE_cruise_the_coast: "스웨덴 해안 크루즈"
 SWE_cruise_the_coast_desc: "수천 개의 섬과 풍부한 해양 역사를 지닌 스웨덴은 해안 크루즈 관광에 최적의 나라입니다. 항구를 확장하고 페리 여행을 장려하며 국제 노선을 유치하겠습니다."
 SWE_on_the_rail: "기차로 만나는 스웨덴"
 SWE_on_the_rail_desc: "친환경적이고 경치가 아름다운 철도 여행은 스웨덴을 탐방하기에 가장 좋은 방법입니다. 관광 중심의 철도 연결망에 대한 투자는 지역 경제와 지속 가능한 관광을 뒷받침할 것입니다."
 SWE_infrastructure_projects: "국가 인프라 구상"
 SWE_infrastructure_projects_desc: "경제 성장과 사회 결속을 유지하려면 대규모 인프라 사업의 물결을 일으켜야 합니다. 철도에서 디지털에 이르기까지, 이러한 투자는 국가를 하나로 연결할 것입니다."
 SWE_bothnia_line: "보트니아선 완공"
 SWE_bothnia_line_desc: "보트니아선은 스웨덴 북부를 나머지 지역과 보다 효율적으로 연결합니다. 이 철도를 완공하면 지역 발전과 이동성이 향상될 것입니다."
 SWE_exoand_gotland_infrastructure: "고틀란드 인프라 확충"
 SWE_exoand_gotland_infrastructure_desc: "발트해의 전략적 요충지에 위치한 고틀란드는 무역, 관광, 방위를 뒷받침할 현대화된 인프라가 필요합니다."
 SWE_expand_stockholm_harbor: "스톡홀름 항만 확장"
 SWE_expand_stockholm_harbor_desc: "늘어나는 무역과 관광을 감당하기 위해 스톡홀름 항만을 현대적인 해상 거점으로 확장하는 데 투자해야 합니다."
 SWE_expand_the_malmo_docks: "말뫼 부두 확장"
 SWE_expand_the_malmo_docks_desc: "말뫼는 스웨덴 남부의 관문입니다. 부두를 확장하면 화물 처리가 빨라지고 유럽 대륙과의 연결이 강화됩니다."
 SWE_SBUF: "스웨덴 건설 기금(SBUF)"
 SWE_SBUF_desc: "스웨덴 전역의 공공 사업과 인프라 개발을 지원하는 전담 기금을 조성하겠습니다."
 SWE_norra_lanken: "노라 렌켄 건설"
 SWE_norra_lanken_desc: "노라 렌켄은 스톡홀름 북부의 교통 정체를 완화하고 산업 지구와 수도 사이의 교통 흐름을 개선할 것입니다."
 SWE_sodra_lanken: "쇠드라 렌켄 건설"
 SWE_sodra_lanken_desc: "쇠드라 렌켄 도로 사업은 우리의 고속도로망을 보완하여 효율적인 물류와 남부로의 통근 접근성을 높여 줍니다."
 SWE_ericsson_digital_infrastructure: "에릭슨 주도 디지털 인프라"
 SWE_ericsson_digital_infrastructure_desc: "에릭슨과 협력하여 5G, 클라우드 네트워크, 통신 시스템을 보급함으로써 유럽의 디지털 인프라를 선도하겠습니다."
 SWE_found_industry_park_malmo: "말뫼 산업 단지"
 SWE_found_industry_park_malmo_desc: "말뫼의 경제를 되살리기 위해 기술, 바이오 기술, 물류 기업을 유치하는 현대적인 산업 단지를 조성하겠습니다."
 SWE_found_industry_park_stockholm: "스톡홀름 산업 단지"
 SWE_found_industry_park_stockholm_desc: "스톡홀름에 들어서는 산업 단지는 이 도시의 학계, 기술, 투자 생태계를 활용하여 미래 성장을 이끌 것입니다."
 SWE_norbotten_line: "노르보텐선 개량"
 SWE_norbotten_line_desc: "노르보텐 철도는 광업과 북부 물류의 핵심입니다. 수송 능력을 높이기 위해 이를 현대화하고 확장하겠습니다."
 SWE_found_nordbanken: "노르드방켄 설립"
 SWE_found_nordbanken_desc: "새로운 공공 은행인 노르드방켄은 국내 투자, 기업 대출, 지역 금융 포용을 촉진할 것입니다."
 SWE_found_NORDCAPS: "NORDCAPS 투자 그룹 창설"
 SWE_found_NORDCAPS_desc: "전략 산업을 지원하기 위해 기술, 에너지, 북유럽 간 합작 사업에 주력하는 투자 그룹 NORDCAPS를 설립하겠습니다."
 SWE_banking_oportunity: "은행업 기회 프로그램"
 SWE_banking_oportunity_desc: "규제를 완화하고 인센티브를 제공하여 스웨덴을 책임 있는 금융 혁신의 지역 선도국으로 만들겠습니다."
 SWE_thermal_energy_cooperation: "열에너지 협력"
 SWE_thermal_energy_cooperation_desc: "열에너지 사업을 장려함으로써 에너지 안보를 개선하고 탈탄소 목표를 진전시킬 수 있습니다."
 SWE_agreement_to_support_industrial_mio_cooperation: "산업 MIO 협력 협정"
 SWE_agreement_to_support_industrial_mio_cooperation_desc: "다부문 산업 협정을 통해 산업 혁신, 인력 훈련, 국제 협력 관계를 조율하겠습니다."
 SWE_form_Postnord: "포스트노르드 설립"
 SWE_form_Postnord_desc: "덴마크와 공동으로 물류 회사 포스트노르드를 설립하여 국경 간 우편, 소포, 디지털 물류를 담당하게 할 것입니다."
 SWE_digital_oportunity: "디지털 기회"
 SWE_digital_oportunity_desc: "디지털화는 도약의 기회를 제공합니다. 경제를 미래에 대비시키기 위해 디지털 역량, 스타트업, 보안 플랫폼에 투자하겠습니다."
 SWE_found_Nordic_baltic_kooperation: "북유럽-발트 경제 협력"
 SWE_found_Nordic_baltic_kooperation_desc: "북유럽 및 발트 이웃 국가들과의 긴밀한 협력은 경제적 회복력을 높이고 강력한 지역 블록을 형성합니다."
 SWE_the_New_army: "스웨덴 군 사령부 창설"
 SWE_the_New_army_desc: "21세기의 전략적 현실에 스웨덴이 대비하려면 군 지휘부를 재편하고 강화해야 합니다. 중앙 집중식 스웨덴 군 사령부를 창설하면 군종 간 원활한 조율, 통합된 군수 계획, 국방을 위한 단일 교리가 가능해집니다.\n\n이는 분산된 평시 행정에서 위기에 신속하고 정확하게 대응할 수 있는, 완전한 작전 태세를 갖춘 지휘 체계로의 구조적 전환을 의미합니다."
 SWE_Navy_reforms: "해군 개혁"
 SWE_Navy_reforms_desc: "유능한 해군력을 유지하려면 함대를 현대화하고, 지휘 전략을 재편하며, 신기술을 통합해야 합니다. 더 강력한 해군은 스웨덴이 자국 해역을 지키고 필요할 때 힘을 투사할 수 있도록 보장할 것입니다."
 SWE_Green_water_doctrine: "녹색 해역 교리"
 SWE_Green_water_doctrine_desc: "스웨덴의 해군 전략은 인접 해역에서 작전할 능력을 유지하면서 연안 해역을 방어하는 데 중점을 두어야 합니다. 녹색 해역 교리를 채택함으로써 기민하고 다재다능한 함대를 확보할 수 있습니다."
 SWE_combined_arms_operation: "합동 병과 작전"
 SWE_combined_arms_operation_desc: "현대전은 육군, 공군, 해군 간의 완벽한 협력을 요구합니다. 합동 작전을 최대한 효율적으로 수행할 수 있도록 군사 조율 체계를 정비하겠습니다."
 SWE_Expand_coastal_patrols: "해안 순찰 확대"
 SWE_Expand_coastal_patrols_desc: "해안선을 따라 순찰 범위를 넓히면 국가 안보가 강화되고 잠재적 위협을 억제할 수 있습니다. 새로운 순찰함과 감시 기술에 대한 투자가 스웨덴 해역을 지키는 열쇠입니다."
 SWE_Improve_asw_training: "대잠수함전 훈련 개선"
 SWE_Improve_asw_training_desc: "적 잠수함은 우리 해역에 대한 끊임없는 위협입니다. 대잠수함전(ASW) 훈련을 개선하고 첨단 소나 시스템을 도입하여 해군 방어를 강화하겠습니다."
 SWE_balanced_task_force_doctrine: "균형 기동함대 교리"
 SWE_balanced_task_force_doctrine_desc: "균형 잡힌 함대는 방어와 전력 투사 모두에 필수적입니다. 해군 전력을 다목적 기동함대로 편성하여 작전 효율을 높이겠습니다."
 SWE_improve_Radar_and_rec: "레이더 및 정찰 개선"
 SWE_improve_Radar_and_rec_desc: "향상된 레이더와 정찰 능력은 우수한 상황 인식을 제공하여 위협을 조기에 탐지하고 효과적으로 대응할 수 있게 해 줍니다."
 SWE_improved_amphibious_units: "상륙 부대 개선"
 SWE_improved_amphibious_units_desc: "신속 대응 작전을 수행하려면 상륙 병력을 현대화해야 합니다. 더 나은 훈련, 새로운 상륙정, 강화된 군수 지원에 투자하겠습니다."
 SWE_Brown_water_doctrine: "갈색 해역 교리"
 SWE_Brown_water_doctrine_desc: "스웨덴의 독특한 지리적 조건은 연안과 하천 환경에서 효과적으로 작전할 수 있는 해군을 요구합니다. 갈색 해역 교리는 내륙 수로와 군도를 보호하는 능력을 높일 것입니다."
 SWE_Baltic_minefield_planning: "발트해 기뢰원 계획"
 SWE_Baltic_minefield_planning_desc: "기뢰는 예로부터 비용 효율적인 해상 방어 수단이었습니다. 전략적인 발트해 기뢰원 계획을 수립하여 적대적 침입을 억제하고 해안선을 지키겠습니다."
 SWE_Expand_Coast_and_river_patrols: "해안 및 하천 순찰 확대"
 SWE_Expand_Coast_and_river_patrols_desc: "스웨덴의 해안선과 내륙 수로의 안전을 유지하려면 전담 순찰 병력이 필요합니다. 하천 및 해안 순찰 부대를 확대하여 상시 경계 태세를 확보하겠습니다."
 SWE_specified_amphibious_defence_force: "특화 상륙 방위군"
 SWE_specified_amphibious_defence_force_desc: "전담 상륙 방위군은 스웨덴이 군도를 방어하고 연안 작전을 효율적으로 수행할 수 있도록 보장할 것입니다. 특화된 훈련과 장비를 우선적으로 지원하겠습니다."
 SWE_archipelago_warfare: "군도 전투"
 SWE_archipelago_warfare_desc: "스웨덴의 수많은 섬은 독특한 전술적 과제와 기회를 만들어 냅니다. 군도 전투에 특화된 전술을 개발하면 조국을 방어하는 데 우리 군이 우위를 점하게 될 것입니다."
 SWE_Homewater_intervention: "자국 해역 개입"
 SWE_Homewater_intervention_desc: "위기 시에 스웨덴은 자국 해역을 지키기 위해 신속히 행동할 수 있어야 합니다. 영유권 분쟁과 안보 위협에 개입하는 능력을 강화하면 해상 안정이 보장될 것입니다."
 SWE_Improve_mine_warfare: "기뢰전 개선"
 SWE_Improve_mine_warfare_desc: "해상 기뢰는 여전히 적의 침입에 대한 효과적인 억지 수단입니다. 기뢰전 능력을 현대화하면 전략적 수로를 더 잘 통제하고 해안을 방어할 수 있습니다."
 SWE_Interbranch_commando: "군종 통합 특공대"
 SWE_Interbranch_commando_desc: "작전 능력을 높이기 위해 스웨덴은 모든 군종과 원활하게 통합될 수 있는 정예 특공 부대를 창설할 것입니다. 이 구상은 군종 간 협력을 촉진하고, 우리 특수 부대가 국내외 어떤 과제에도 대비하도록 보장할 것입니다."
 SWE_Realtime_data_sharing: "실시간 데이터 공유"
 SWE_Realtime_data_sharing_desc: "현대 전장에서 정보는 핵심입니다. 모든 군 부대에 걸쳐 실시간 데이터 공유를 도입함으로써 스웨덴은 타의 추종을 불허하는 상황 인식을 달성할 것입니다. 이러한 개선은 더 빠른 의사 결정과 더 효과적인 조율을 가능하게 하여 어떤 분쟁에서도 전략적 우위를 가져다줄 것입니다."
 SWE_Improve_marine_infantry: "해병 보병 현대화"
 SWE_Improve_marine_infantry_desc: "우리 해병 보병은 21세기의 도전에 맞설 준비가 되어 있어야 합니다. 이 중점은 첨단 훈련, 신규 장비, 최첨단 기술에 투자하여 해병대를 신속 전개와 지속적인 전투 작전이 가능한 가공할 상륙 전투 부대로 탈바꿈시킬 것입니다."
 SWE_Gotland_radar: "고틀란드 레이더망"
 SWE_Gotland_radar_desc: "영토 보전을 수호하기 위해 스웨덴은 고틀란드섬에 최첨단 레이더망을 구축할 것입니다. 이 전략적 구상은 공중 및 해상 감시 능력을 크게 높여 잠재적 위협을 조기에 경고하고 우리의 영공과 해역의 안전을 보장할 것입니다."
 SWE_fast_reaction_force: "신속 대응군"
 SWE_fast_reaction_force_desc: "끊임없이 변화하는 세계에서 스웨덴은 새롭게 등장하는 위협에 신속히 대응할 준비가 되어 있어야 합니다. 새로운 신속 대응군은 국방의 선봉이 되어 즉각 전개함으로써 우리의 주권을 지키고 동맹국을 지원할 것입니다."
 SWE_Rapid_deployment_doctrine: "신속 전개 교리"
 SWE_Rapid_deployment_doctrine_desc: "현대전은 기민성과 속도를 요구합니다. 신속 전개 교리를 채택하면 우리 군은 빠르게 동원할 수 있도록 훈련되고 장비를 갖추게 되어, 국내외를 막론하고 어떤 도전에도 정면으로 맞설 수 있습니다."
 SWE_Integrated_command_and_control: "통합 지휘통제"
 SWE_Integrated_command_and_control_desc: "응집력 있는 군대는 원활한 통신과 조율을 필요로 합니다. 통합 지휘통제 체계는 우리 군을 하나로 묶어 전투의 열기 속에서도 신속하고 정확한 결정을 내릴 수 있게 해 줄 것입니다."
 SWE_Armestaben: "육군 참모부 강화"
 SWE_Armestaben_desc: "유능한 지상군은 장비뿐 아니라 능숙한 조율, 교리, 즉응 태세를 필요로 합니다. 스웨덴 지상군의 중앙 기획 및 지휘 조직인 육군 참모부(Arméstaben)를 강화하겠습니다.\n\n작전 지휘를 개선하고, 훈련 규정을 갱신하며, 새로운 전략 평가를 통합함으로써 육군 참모부는 우리 지상군이 국내외에서 진화하는 위협에 대응할 수 있도록 기민하고 현대적이며 준비된 상태를 유지하게 할 것입니다."
 SWE_Joint_operation_Training: "합동 작전 훈련"
 SWE_Joint_operation_Training_desc: "미래의 전쟁은 협력적입니다. 합동 작전 훈련 프로그램은 육군, 해군, 공군 사이에 굳건한 유대를 형성하여 복합적인 다영역 위협에 대처할 수 있는 단일 전선을 만들어 낼 것입니다."
 SWE_Advanced_Territorial_defence: "고도화된 영토 방위"
 SWE_Advanced_Territorial_defence_desc: "우리 조국은 가장 큰 자산입니다. 고도화된 영토 방위 구상은 국경과 핵심 기반시설을 강화하여 불확실한 세계에서도 스웨덴이 안보의 보루로 남도록 보장할 것입니다."
 SWE_Defence_focus: "국방 중점"
 SWE_Defence_focus_desc: "평화로운 시기에 우리는 전쟁을 대비합니다. 국방 중점은 군사 능력의 현대화를 최우선으로 하여 스웨덴이 언제나 자국의 이익과 가치를 방어할 준비가 되어 있도록 보장할 것입니다."
 SWE_Reorganize_the_Active_troops: "현역 부대 재편"
 SWE_Reorganize_the_Active_troops_desc: "현역 부대는 최전선의 방어선입니다. 이번 재편은 그들의 구조와 배치를 최적화하여 방어 및 공격 작전 모두에서 즉응 태세와 효율을 높일 것입니다."
 SWE_Reorganize_reserve: "예비군 재편"
 SWE_Reorganize_reserve_desc: "강력한 예비 전력은 지속적인 방어에 필수적입니다. 예비군을 재편함으로써 위기 시 스웨덴이 현역 부대를 신속히 보강하고 장기간 방어 능력을 유지할 수 있도록 보장합니다."
 SWE_Advanced_Armor_Tactics: "고급 기갑 전술"
 SWE_Advanced_Armor_Tactics_desc: "기갑전은 진화하고 있습니다. 고급 기갑 전술 프로그램은 전차 승무원에게 최신 전략과 기술을 제공하여 이들이 전장에서 계속 강력한 전력으로 남도록 보장할 것입니다."
 SWE_mobile_Warfare_doctrine: "기동전 교리"
 SWE_mobile_Warfare_doctrine_desc: "기동성은 현대 전투의 핵심입니다. 기동전 교리를 수용함으로써 우리 군은 신속하고 결정적으로 작전하도록 훈련되어, 적을 기동으로 압도하고 승리를 확보할 것입니다."
 SWE_Strengthen_infantry_training: "보병 훈련 강화"
 SWE_Strengthen_infantry_training_desc: "보병은 육군의 심장입니다. 강화된 훈련 프로그램은 더욱 강인하고 회복력 있는 병사를 길러 내어, 어떤 도전도 극복하고 흔들림 없는 결의로 조국을 지킬 수 있게 할 것입니다."
 SWE_Advanced_mechanized_tactic: "고급 기계화 전술"
 SWE_Advanced_mechanized_tactic_desc: "기계화 부대는 속도와 화력을 겸비합니다. 고급 기계화 전술은 이들 부대가 군사 혁신의 최전선에 서서 작전을 선도하고 핵심 목표를 확보할 준비를 갖추도록 보장할 것입니다."
 SWE_Modernize_Armored_Tactics: "현대 기갑 전술"
 SWE_Modernize_Armored_Tactics_desc: "기갑 부대는 변화하는 전장에 적응해야 합니다. 현대 기갑 전술은 최신 기술과 전략을 통합하여 우리 전차와 장갑차가 어떤 분쟁에서도 강력한 전력으로 남도록 보장할 것입니다."
 SWE_Armored_Delay: "기갑 지연 전술"
 SWE_Armored_Delay_desc: "때로는 전략적 지연이 최선의 방어입니다. 기갑 지연 전술은 우리 군이 적의 진격을 늦추도록 훈련시켜 증원군이 도착할 시간을 벌고 전세를 뒤집게 할 것입니다."
 SWE_Reserve_mobilisation_plan: "예비군 동원 계획"
 SWE_Reserve_mobilisation_plan_desc: "위기 시 우리 예비 전력은 방어를 보강할 준비가 되어 있어야 합니다. 이 동원 계획은 신속하고 효율적인 소집을 보장하며 예비 부대를 현역 전력에 매끄럽게 통합시킵니다."
 SWE_Territorial_defence_coordination: "영토 방위 조율"
 SWE_Territorial_defence_coordination_desc: "조율된 방어가 곧 강력한 방어입니다. 영토 방위 조율을 강화함으로써 모든 군종이 협력하여 조국을 보호하게 하고, 적이 파고들 틈을 남기지 않겠습니다."
 SWE_Rapid_Armor_deployment: "신속 기갑 전개"
 SWE_Rapid_Armor_deployment_desc: "기갑전에서는 속도가 결정적입니다. 신속 기갑 전개 전략은 우리 전차와 장갑차가 항상 적시에 적소에 있도록 하여 필요할 때 즉시 타격할 수 있게 할 것입니다."
 SWE_Mechanized_Stormtroops: "기계화 돌격대"
 SWE_Mechanized_Stormtroops_desc: "기계화 돌격대는 창끝입니다. 최신 차량과 무기를 갖춘 이들은 공세를 이끌며 적의 전선을 돌파하고 승리를 확보할 것입니다."
 SWE_Specialized_infantry: "특화 보병 부대"
 SWE_Specialized_infantry_desc: "특화 보병 부대는 특정한 고위험 임무를 위해 훈련됩니다. 시가전이든 산악전이든 정글 작전이든, 이 병사들은 어떤 상황에도 대비되어 있습니다."
 SWE_Mech_Art: "기계화 포병 훈련"
 SWE_Mech_Art_desc: "기계화 포병은 기동성과 파괴적인 화력을 결합합니다. 훈련 프로그램을 통해 이들 부대가 언제나 결정적인 지원을 제공할 준비를 갖추어 전세를 우리 쪽으로 돌리게 할 것입니다."
 SWE_Advanced_Armor_counterattack: "고급 기갑 반격"
 SWE_Advanced_Armor_counterattack_desc: "적이 공격해 올 때 우리는 반격할 준비가 되어 있어야 합니다. 고급 기갑 반격 전략은 우리 기갑 부대가 신속히 재집결하여 강력한 반격 작전을 개시할 수 있도록 보장할 것입니다."
 SWE_Improve_reserve_training: "예비군 훈련 개선"
 SWE_Improve_reserve_training_desc: "예비 전력은 우리 방어의 필수적인 부분입니다. 개선된 훈련 프로그램은 어떤 도전이 닥치더라도 예비군이 언제든 나서서 조국을 방어할 준비가 되도록 보장할 것입니다."
 SWE_Optimize_supply_chain: "보급망 최적화"
 SWE_Optimize_supply_chain_desc: "보급이 잘 이루어지는 군대가 강한 군대입니다. 보급망을 최적화함으로써 장병들이 필요한 모든 것을 필요한 때에 받아 전투 의지와 전투력을 유지하게 하겠습니다."
 SWE_Global_intervention_capability: "세계적 개입 능력"
 SWE_Global_intervention_capability_desc: "서로 연결된 세계에서 위협은 어디에서든 나타날 수 있습니다. 세계적 개입 능력은 우리가 국경을 훨씬 넘어 힘과 영향력을 투사하여 국익을 지키고 안정을 증진할 수 있도록 보장합니다."
 SWE_Balance_act: "균형 군사 전략"
 SWE_Balance_act_desc: "균형 잡힌 군사 전략은 우리의 성공에 핵심입니다. 공격 능력과 방어 능력 모두에 투자함으로써 스웨덴이 영토 방위에서 국제 작전에 이르기까지 어떤 도전에도 대비하도록 하겠습니다."
 SWE_Artillery_Impovements: "포병 개선"
 SWE_Artillery_Impovements_desc: "포병은 우리 화력 지원의 근간입니다. 최신 기술과 훈련에 투자함으로써 포병 부대가 필요한 때와 장소에서 언제나 결정적인 화력을 제공할 준비를 갖추게 하겠습니다."
 SWE_naval_landing_training: "해상 상륙 훈련"
 SWE_naval_landing_training_desc: "상륙 작전은 복잡하고 까다롭습니다. 해상 상륙 훈련 프로그램은 우리 병력이 해안 상륙과 연안 강습을 정확하고 효과적으로 수행하도록 준비시킬 것입니다."
 SWE_Air_mobility_exercise: "항공 기동 훈련"
 SWE_Air_mobility_exercise_desc: "항공 기동성은 신속 전개와 지원에 결정적입니다. 이 훈련은 우리 공군이 필요한 곳 어디로든 병력과 물자를 신속하고 효율적으로 수송할 준비를 갖추도록 보장할 것입니다."
 SWE_lone_fighter_training: "단독 전투원 훈련"
 SWE_lone_fighter_training_desc: "때로 우리 병사들은 적 후방에서 단독으로 작전해야 합니다. 단독 전투원 훈련은 가장 혹독한 조건에서도 생존하고 번성할 기술과 회복력을 갖추어 줍니다."
 SWE_Delay_training: "지연전 훈련"
 SWE_Delay_training_desc: "적의 진격을 지연시키는 것은 결정적인 전술일 수 있습니다. 지연전 훈련 프로그램은 우리 병력이 적의 진행을 늦추고 증원군이 도착할 시간을 벌어 전세를 뒤집도록 준비시킬 것입니다."
 SWE_Direct_counter_attack: "직접 반격"
 SWE_Direct_counter_attack_desc: "적이 공격해 올 때 우리는 반격할 준비가 되어 있어야 합니다. 직접 반격 전략은 우리 군이 신속히 재집결하여 결정적인 반격 작전을 개시하고 주도권을 되찾도록 보장할 것입니다."
 SWE_entrenchment_training: "참호 구축 훈련"
 SWE_entrenchment_training_desc: "참호 구축은 필수적인 방어 전술입니다. 훈련 프로그램은 어떤 도전이 닥치더라도 우리 병력이 참호를 파고 진지를 사수하는 데 능숙하도록 보장할 것입니다."
 SWE_Wargames_and_exercise: "모의 전쟁 및 훈련"
 SWE_Wargames_and_exercise_desc: "모의 전쟁과 훈련은 우리의 기량을 갈고닦고 전략을 검증하는 데 필수적입니다. 정기적이고 현실적인 훈련 시나리오에 참여함으로써 우리 군이 현대전의 도전에 언제나 대비하도록 하겠습니다."
 SWE_army_defence_exercise: "육군 방어 훈련"
 SWE_army_defence_exercise_desc: "조국의 방어는 최우선 과제입니다. 육군 방어 훈련은 우리 병력이 어떤 위협도 격퇴할 수 있도록 준비시켜 스웨덴이 안전하고 주권을 지키는 나라로 남도록 보장할 것입니다."
 SWE_Global_Crisis_management: "세계 위기 관리"
 SWE_Global_Crisis_management_desc: "끊임없이 변화하는 세계에서 위기는 어디에서든 발생할 수 있습니다. 세계 위기 관리 전략은 우리가 신속하고 효과적으로 대응하여 국익을 지키고 안정을 증진할 수 있도록 보장합니다."
 SWE_security_intervention: "안보 개입"
 SWE_security_intervention_desc: "안보가 위협받을 때에는 신속한 개입이 결정적입니다. 안보 개입 전략은 우리가 국내외에서 질서를 회복하고 국익을 보호하기 위해 단호하게 행동할 수 있도록 보장합니다."
 SWE_Ready_for_Defence: "방어 태세 완비"
 SWE_Ready_for_Defence_desc: "강력한 방어는 즉응 태세에서 시작됩니다. 훈련, 장비, 인프라에 투자함으로써 스웨덴이 언제나 자국의 주권을 수호하고 국민을 보호할 준비가 되어 있도록 하겠습니다."
 SWE_Airforce_structure: "공군 구조 개편"
 SWE_Airforce_structure_desc: "현대적인 공군에는 현대적인 구조가 필요합니다. 이번 개편은 지휘통제 체계를 간소화하여 모든 항공 작전에 걸친 조율과 효율을 높일 것입니다."
 SWE_Restructure_Airdefense: "대공 방어 재편"
 SWE_Restructure_Airdefense_desc: "우리의 영공은 불가침으로 남아야 합니다. 대공 방어를 재편함으로써 어떤 공중 위협도 탐지하고 무력화할 수 있는 다층 통합 체계를 확보하겠습니다."
 SWE_Restructure_Airports: "공항 인프라 재편"
 SWE_Restructure_Airports_desc: "공항은 우리 항공 작전의 생명선입니다. 이번 재편은 공항 인프라를 현대화하여 항공 전력의 신속하고 안전한 전개를 보장할 것입니다."
 SWE_enhance_pilot_training: "조종사 훈련 강화"
 SWE_enhance_pilot_training_desc: "우리 조종사는 창끝입니다. 강화된 훈련 프로그램은 이들의 기량을 갈고닦아 제공권 임무에서 정밀 타격에 이르기까지 어떤 도전에도 대비하도록 보장할 것입니다."
 SWE_strike_focus: "타격 작전 중점"
 SWE_strike_focus_desc: "정밀 타격은 현대전에서 결정적입니다. 이 중점은 공군에 최신 기술과 전술을 갖추어 고가치 표적에 결정적인 타격을 가할 수 있도록 보장할 것입니다."
 SWE_interception_focus: "요격 작전 중점"
 SWE_interception_focus_desc: "적 항공기를 요격하는 것은 필수적인 방어 조치입니다. 이 중점은 우리의 요격 능력을 높여 어떤 침입에도 영공이 안전하게 유지되도록 보장할 것입니다."
 SWE_Improve_groundattack_training: "대지 공격 훈련 개선"
 SWE_Improve_groundattack_training_desc: "공중에서 지상군을 지원하는 것은 합동 병과 작전에 필수적입니다. 개선된 훈련은 우리 조종사가 근접 항공 지원에 능숙하도록 하여 전세를 우리 쪽으로 돌리게 할 것입니다."
 SWE_Integrated_strike_tactics: "통합 타격 전술"
 SWE_Integrated_strike_tactics_desc: "통합 타격 전술은 공군, 육군, 해군의 강점을 결합합니다. 작전을 조율함으로써 모든 교전에서 최대의 효과와 효율을 보장합니다."
 SWE_Improve_fighter_training: "전투기 조종사 훈련 개선"
 SWE_Improve_fighter_training_desc: "우리 전투기 조종사는 영공의 수호자입니다. 개선된 훈련 프로그램은 어떤 분쟁에서도 제공권을 유지하는 데 필요한 기량과 전술을 갖추어 줄 것입니다."
 SWE_Improve_Radarcapability: "레이더 능력 개선"
 SWE_Improve_Radarcapability_desc: "레이더는 우리 대공 방어의 눈입니다. 레이더 능력을 강화함으로써 모든 공중 위협을 조기에 탐지하고 추적하여, 아군이 효과적으로 대응하는 데 필요한 시간과 정보를 확보하게 합니다."
 SWE_Combat_exercise_simulation_center: "전투 훈련 시뮬레이션 센터"
 SWE_Combat_exercise_simulation_center_desc: "현실적인 훈련은 전투 준비 태세의 핵심입니다. 최첨단 시뮬레이션 센터는 몰입감 있고 도전적인 시나리오를 제공하여 조종사의 기량을 갈고닦고 실전 작전에 대비하게 할 것입니다."
 SWE_Upgrade_Comunication_network: "통신망 업그레이드"
 SWE_Upgrade_Comunication_network_desc: "원활한 통신은 조율된 작전에 필수적입니다. 통신망을 업그레이드함으로써 우리 군이 실시간으로 정보를 공유하고 행동을 조율하게 하여 작전 효율을 높이겠습니다."
 SWE_fight_simulation_center: "비행 시뮬레이션 센터"
 SWE_fight_simulation_center_desc: "모의 전투 시나리오를 통해 조종사들은 가장 어려운 조건에 대비해 훈련할 수 있습니다. 비행 시뮬레이션 센터는 현실적이고 몰입감 있는 훈련을 제공하여 공군이 어떤 사태에도 대비하게 할 것입니다."
 SWE_Digital_battlefield_organization: "디지털 전장 편성"
 SWE_Digital_battlefield_organization_desc: "현대 전장은 디지털입니다. 디지털 체계를 중심으로 작전을 편성함으로써 상황 인식, 조율, 의사 결정 능력을 높이고 어떤 분쟁에서도 우위를 유지하겠습니다."
 SWE_Improve_AWACS_Datalink: "AWACS 데이터링크 개선"
 SWE_Improve_AWACS_Datalink_desc: "AWACS는 우리 항공 작전의 눈과 귀입니다. 데이터링크 능력을 개선함으로써 핵심 정보의 실시간 공유를 보장하고 위협을 탐지, 추적, 교전하는 능력을 효과적으로 높이겠습니다."
 SWE_Implement_realtime_data_sharing: "실시간 데이터 공유 도입"
 SWE_Implement_realtime_data_sharing_desc: "실시간 데이터 공유는 조율된 작전에 결정적입니다. 첨단 데이터 공유 기술을 도입함으로써 우리 군이 필요한 정보를 필요한 때에 확보하여 전투의 열기 속에서도 결정적으로 행동하게 하겠습니다."
 SWE_Taurus_integration: "타우루스 미사일 통합"
 SWE_Taurus_integration_desc: "급변하는 전략 환경 속에서 스웨덴은 장거리 정밀 타격 능력을 강화해야 합니다. 독일과 스웨덴이 공동 개발한 타우루스 KEPD 350 순항미사일은 특히 우리의 다목적 전투기 플랫폼인 JAS 39 그리펜과 결합할 때 이상적인 해법으로 보입니다.\n\n조달, 라이선스 또는 공동 통합에 관한 협상을 개시함으로써, 전통적인 동맹 체제 밖에 머무르면서도 심층 타격 능력을 극적으로 높일 수 있습니다."
 SWE_Special_Operation_capability: "특수 작전 능력 강화"
 SWE_Special_Operation_capability_desc: "특수 작전은 비정규전의 창끝입니다. 이 분야의 능력을 강화함으로써 우리 군이 고위험 고수익 임무를 수행할 준비를 갖추고, 어둠 속에서 국익을 수호하게 하겠습니다."
 SWE_focus_on_infiltration: "침투 작전 중점"
 SWE_focus_on_infiltration_desc: "침투는 특수 부대에 필수적인 기술입니다. 이 중점은 우리 요원들에게 최신 전술과 기술을 갖추어 적 전선을 들키지 않고 돌파하고 핵심 정보를 수집할 수 있게 해 줄 것입니다."
 SWE_focus_on_Reconnaissance_capability: "정찰 능력 강화"
 SWE_focus_on_Reconnaissance_capability_desc: "정찰은 우리 군사 작전의 눈과 귀입니다. 정찰 능력을 강화함으로써 방어든 공격이든 우리 군이 결정적인 행동을 하는 데 필요한 정보를 확보하게 하겠습니다."
 SWE_focus_on_counter_spy_capability: "방첩 작전 중점"
 SWE_focus_on_counter_spy_capability_desc: "방첩은 국가 안보에 필수적입니다. 이 중점은 외국 정보 활동을 탐지하고 무력화하는 능력을 강화하여 우리의 기밀을 지키고 전략적 우위를 유지하게 할 것입니다."
 SWE_Reform_Specialforces_training: "특수 부대 훈련 개혁"
 SWE_Reform_Specialforces_training_desc: "우리 특수 부대는 정예이며, 훈련도 이를 반영해야 합니다. 이번 개혁은 최첨단 기법과 엄격한 기준을 도입하여 요원들이 가장 까다로운 임무에도 항상 대비되어 있도록 보장할 것입니다."
 SWE_Improve_secret_secvice_cooperation: "비밀 정보기관 협력 개선"
 SWE_Improve_secret_secvice_cooperation_desc: "비밀 정보기관과 특수 부대 사이의 협력은 성공적인 작전에 결정적입니다. 이러한 협업을 개선함으로써 은밀 임무를 수행하고 정보를 효과적으로 수집하는 능력을 높이겠습니다."
 SWE_Improve_Special_forces_activities: "특수 부대 활동 강화"
 SWE_Improve_Special_forces_activities_desc: "특수 부대의 활동은 다양하고 까다롭습니다. 이번 강화 조치는 시가전에서 정글 작전에 이르기까지 어떤 환경에서도 뛰어난 성과를 낼 수 있는 장비와 훈련을 요원들에게 제공할 것입니다."
 SWE_integrate_drones_to_rec_forces: "정찰 부대 드론 통합"
 SWE_integrate_drones_to_rec_forces_desc: "드론은 정찰과 감시에서 비할 데 없는 능력을 제공합니다. 첨단 드론 기술을 정찰 부대에 통합함으로써 정보를 수집하고 위협을 실시간으로 감시하는 능력을 높이겠습니다."
 SWE_training_by_secret_service: "비밀 정보기관 훈련 프로그램"
 SWE_training_by_secret_service_desc: "우리 비밀 정보기관은 독보적인 기술과 지식을 보유하고 있습니다. 그들의 전문성을 훈련 프로그램에 접목함으로써 특수 부대가 최신 전술과 기법을 갖추고 어떤 도전에도 맞설 수 있도록 하겠습니다."
 SWE_Artillery: "포병 현대화"
 SWE_Artillery_desc: "현대 전장에서 계속 효과를 발휘하려면 포병 부대에 개선된 조준 체계, 더 긴 사거리, 향상된 기동성을 갖추도록 업그레이드해야 합니다. 포병에 대한 새로운 중점은 지상군에게 필요한 화력 우위를 가져다줄 것입니다."
 SWE_lvkv_90: "Lvkv 90 플랫폼 개선"
 SWE_lvkv_90_desc: "Lvkv 90 자주 대공 차량은 여전히 우리 기동 대공 방어의 초석입니다. 이 플랫폼을 현대화하면 새로운 공중 위협에 더 정밀하고 생존성 높게 대응할 수 있습니다."
 SWE_airmobile_units: "공중 기동 부대 창설"
 SWE_airmobile_units_desc: "오늘날의 역동적인 분쟁에서는 신속 전개가 핵심입니다. 특화된 공중 기동 부대를 편성함으로써 스웨덴 안팎에서 신속 대응 능력을 갖추고 군사적 유연성을 높일 수 있습니다."
 SWE_cv90_modernization: "CV90 현대화 계획"
 SWE_cv90_modernization_desc: "CV90 보병 전투차는 우리 지상군의 중심입니다. 장갑, 센서, 화력을 업그레이드함으로써 장병들이 동급에서 가장 선진적인 플랫폼 중 하나의 지원을 받도록 보장합니다."
 SWE_modernize_marine_effort: "상륙 군단 현대화"
 SWE_modernize_marine_effort_desc: "스웨덴의 독특한 지리적 조건상 상륙 능력은 필수적입니다. 해병 부대에 새로운 상륙정, 장비, 훈련을 갖추면 해안선을 지키고 신속 전개 능력을 높일 수 있습니다."
 SWE_modernize_equipment: "육군 장비 현대화"
 SWE_modernize_equipment_desc: "우리 병사들은 최고의 대우를 받을 자격이 있습니다. 개인 장구에서 통신 체계에 이르기까지 폭넓은 현대화 노력은 전장에서의 효율, 안전, 조율을 높일 것입니다."
 SWE_corvettes: "초계함 함대 확충"
 SWE_corvettes_desc: "빠르고 은밀하며 치명적인 초계함은 우리 해역을 방어하는 데 필수적입니다. 초계함 함대를 확충하면 발트해에서 스웨덴의 해군 존재감과 억지력이 강화될 것입니다."
 SWE_Visby_2_or_lulea_class: "차세대 초계함 개발"
 SWE_Visby_2_or_lulea_class_desc: "해군 혁신에서 다음 단계로 나아갈 때입니다. 비스뷔급의 연장이든 새로운 룰레오급 설계이든, 새로운 초계함 급을 개발하면 스웨덴의 해군 기술 우위가 공고해질 것입니다."
 SWE_only_gripen: "그리펜 단일 운용 확정"
 SWE_only_gripen_desc: "그리펜 전투기는 스웨덴의 혁신과 독립을 상징합니다. 전 공군을 그리펜으로 통일함으로써 군수를 간소화하고 국내 항공우주 역량에 전면적으로 투자하겠습니다."
 SWE_complimentary_aitrplain: "보완 항공기 조달"
 SWE_complimentary_aitrplain_desc: "전투기 함대의 다재다능함과 회복력을 높이려면 보완 항공기를 고려해야 합니다. 전략적 조달은 작전상의 공백을 메우고 대공 방어 능력을 강화할 것입니다."
 SWE_internal_politics: "내정"
 SWE_internal_politics_desc: "새로운 세기에 접어들면서 스웨덴은 내부의 과제와 이념적 분열 모두에 맞서야 합니다. 내정에 대한 새로운 중점은 국가를 안정시키고 미래의 방향을 정하는 데 도움이 될 것입니다."
 SWE_old_traditions: "오랜 전통 존중"
 SWE_old_traditions_desc: "미래를 바라보기 전에, 우리 국가를 형성해 온 가치와 구조를 인정해야 합니다. 오랜 세월 검증된 전통을 받아들이는 것은 단결과 정체성의 토대가 됩니다."
 SWE_socialdemokraterna: "사회민주당 지지"
 SWE_socialdemokraterna_desc: "스웨덴을 평등과 번영으로 이끌어 온 오랜 역사를 지닌 사회민주당은 새천년의 과제를 해결할 준비가 되어 있습니다. 복지, 포용, 경제 정의에 대한 그들의 중점은 국민의 공감을 얻고 있습니다."
 SWE_S_social_investments: "사회 투자 확대"
 SWE_S_social_investments_desc: "강한 사회는 국민에 대한 투자로 세워집니다. 의료, 복지, 인프라에 대한 재정을 확대함으로써 장기적 안정을 보장하고 사회적 불평등을 줄이겠습니다."
 SWE_S_school_improvements: "전국 교육 개선"
 SWE_S_school_improvements_desc: "교육은 모든 현대 민주주의의 근간입니다. 학교를 개선하고 교사 급여를 인상하며 교육과정을 갱신함으로써 모든 스웨덴 아이들에게 더 밝은 미래를 보장하겠습니다."
 SWE_S_open_borders: "개방적 국경 정책 추진"
 SWE_S_open_borders_desc: "스웨덴은 오랫동안 인도주의의 선도국이었습니다. 개방적 국경을 받아들이는 것은 관용과 포용이라는 우리의 가치를 반영하며, 이민을 통해 노동력 부족도 해소합니다."
 SWE_S_company_laws: "기업 규제 개혁"
 SWE_S_company_laws_desc: "일터의 공정성은 법에서 시작됩니다. 기업 규제를 개혁함으로써 노동자의 권리를 보호하고 공정한 임금을 보장하며 착취적 관행을 막고자 합니다."
 SWE_international_recruitment_agreement: "국제 인력 채용 협정"
 SWE_international_recruitment_agreement_desc: "노동 시장의 공백을 해소하기 위해 윤리적인 국제 인력 채용을 촉진하는 협정을 공식화하겠습니다. 이 정책은 핵심 산업을 강화하는 동시에 공정성에 대한 스웨덴의 세계적 책무를 유지합니다."
 SWE_S_union_workers: "노동조합 강화"
 SWE_S_union_workers_desc: "강력한 노동조합은 정의로운 사회에 필수적입니다. 단체 교섭권을 강화하고 노조의 영향력을 보호하며 모든 산업의 노동자를 보호하겠습니다."
 SWE_socialdemokraterna_2: "진보적인 전진의 길"
 SWE_socialdemokraterna_2_desc: "사회민주당은 지속 가능성, 혁신, 사회 정의가 결합된 새로운 시대로 스웨덴을 이끌겠다는 의지를 지니고 있습니다. 새로운 위임을 받으면 과감한 개혁을 시행하고 민주주의를 강화할 수 있습니다."
 SWE_centerpartiet: "중앙당 지지"
 SWE_centerpartiet_desc: "스웨덴 농촌 중심부에 깊이 뿌리를 둔 중앙당은 분권화, 지속 가능성, 기업가 정신을 옹호합니다. 그들의 비전은 시장자유주의와 철저한 환경 보전의 균형을 이룹니다."
 SWE_c_school_grading_system: "학교 성적 체계 개정"
 SWE_c_school_grading_system_desc: "교육의 공정성과 동기 부여를 보장하려면 학교 성적 체계를 갱신해야 합니다. 더 명확한 기준과 더 유연한 평가는 학생과 교육자 모두에게 이로울 것입니다."
 SWE_c_farmers: "스웨덴 농민 지원"
 SWE_c_farmers_desc: "농민은 농촌의 근간입니다. 보조금을 늘리고 인프라를 개선하며 지역 식량 생산을 장려함으로써 생계와 식량 안보를 모두 지키겠습니다."
 SWE_c_police: "지역 치안 강화"
 SWE_c_police_desc: "안전은 지역 사회 차원에서 시작됩니다. 더 나은 훈련과 자원으로 지역 경찰력을 강화하면 농촌과 도시 모두에서 안보와 신뢰가 보장될 것입니다."
 SWE_c_railways: "철도에 투자"
 SWE_c_railways_desc: "철도 수송은 지속 가능하고 서로 연결된 스웨덴에 필수적입니다. 철도망을 개선하고 확장하면 특히 외진 지역에서 국민과 기업 모두에게 이로울 것입니다."
 SWE_c_telecom: "농촌 통신망 확충"
 SWE_c_telecom_desc: "고속 인터넷과 안정적인 통신 서비스는 더 이상 사치가 아니라 필수입니다. 농촌 연결성에 투자하여 디지털 격차를 해소하고 모든 지역 사회에 힘을 실어 주겠습니다."
 SWE_c_vitalice_the_country_side: "농촌 활성화"
 SWE_c_vitalice_the_country_side_desc: "인구 감소는 스웨덴 농촌을 위협합니다. 지역 기업을 장려하고 서비스를 개선하며 젊은 가족을 지원함으로써 농촌에 새로운 활력을 불어넣겠습니다."
 SWE_c_enviremental_friendly_economy: "친환경 경제 구축"
 SWE_c_enviremental_friendly_economy_desc: "녹색 경제가 곧 강한 경제입니다. 청정 에너지, 지속 가능한 농업, 순환형 생산 모델을 장려하여 스웨덴의 장기적 번영을 확보하겠습니다."
 SWE_c_liberalize_worker_rights: "노동자 권리 자유화"
 SWE_c_liberalize_worker_rights_desc: "혁신과 일자리 창출을 촉진하려면 노동법을 현대화해야 합니다. 더 유연한 규제 틀은 피고용인과 기업가 모두를 지원할 것입니다."
 SWE_centerpartiet_2: "더 푸르고 더 자유로운 스웨덴"
 SWE_centerpartiet_2_desc: "중앙당은 농촌 공동체가 번성하고, 시장이 공정하게 작동하며, 자연이 보존되는 스웨덴을 그립니다. 실용적이고 미래 지향적인 정책을 통해 우리는 가슴과 이성을 모두 갖추고 나아갑니다."
 SWE_folkpartiet: "자유당 지지"
 SWE_folkpartiet_desc: "자유당은 개인의 자유, 교육, 개방 시장 위에 세워진 스웨덴을 그립니다. 그들의 정책은 지식, 감세, 사회 통합을 통해 국민에게 힘을 실어 주는 것을 목표로 합니다."
 SWE_fp_ghetto_issues: "게토 문제 해결"
 SWE_fp_ghetto_issues_desc: "사회적 배제와 병행 사회는 평등과 결속이라는 가치를 위협합니다. 목표를 정한 교육 및 주거 개혁을 통해 도시 분리의 근본 원인을 해결하고자 합니다."
 SWE_fp_pro_euro: "유로존 가입"
 SWE_fp_pro_euro_desc: "경제 통합은 스웨덴의 미래에 핵심입니다. 유로를 채택함으로써 유럽과의 유대를 강화하고 무역을 촉진하며 대륙 문제에서 더 큰 발언권을 얻게 됩니다."
 SWE_fp_tax_cut: "감세 시행"
 SWE_fp_tax_cut_desc: "낮은 세 부담은 개인과 기업 모두에게 힘이 됩니다. 세금을 줄임으로써 기업가 정신을 장려하고 근로를 촉진하며 경제 성장의 동력을 제공합니다."
 SWE_fp_school_investments: "교육에 투자"
 SWE_fp_school_investments_desc: "지식은 자유입니다. 학교 재정을 늘리고 우수한 교사를 지원하며 모든 아이가 양질의 교육을 받을 수 있도록 개혁을 도입하겠습니다."
 SWE_fp_integration: "사회 통합 촉진"
 SWE_fp_integration_desc: "성공적인 이민은 효과적인 통합에 달려 있습니다. 언어 교육, 일자리 알선, 교육에 투자하여 새로 온 이들이 스웨덴 사회에 온전히 기여하도록 하겠습니다."
 SWE_fp_lower_worker_rights: "노동 시장 규제 완화"
 SWE_fp_lower_worker_rights_desc: "더 유연한 노동 시장은 혁신과 경쟁력을 촉진합니다. 관료적 장벽을 줄이고 시대에 뒤떨어진 보호 규정을 조정함으로써 역동적인 경제를 뒷받침합니다."
 SWE_fp_privatisation_efforts: "민영화 노력 확대"
 SWE_fp_privatisation_efforts_desc: "공공 서비스는 민간 부문의 효율성에서 혜택을 얻을 수 있습니다. 교육, 보건, 교통 같은 분야에 경쟁과 혁신을 도입하여 품질과 선택권을 개선하고자 합니다."
 SWE_fp_improve_labor_migration: "노동 이민 정책 강화"
 SWE_fp_improve_labor_migration_desc: "현명한 이민 정책은 노동력 부족을 해소하고 경제를 강화할 수 있습니다. 비자 절차를 간소화하고 숙련 노동자가 스웨덴에 입국할 수 있는 명확한 경로를 마련하겠습니다."
 SWE_fp_start_up: "스타트업 및 혁신 지원"
 SWE_fp_start_up_desc: "기업가는 경제의 미래입니다. 세제 혜택을 마련하고 규제를 간소화하며 기술 인큐베이터를 설립하여 전국에서 스타트업이 번성하도록 돕겠습니다."
 SWE_fp_lower_public_spendings: "공공 지출 감축"
 SWE_fp_lower_public_spendings_desc: "지속 가능한 재정을 위해 비효율적인 공공 지출을 줄여야 합니다. 복지 및 정부 사업을 합리화하면 교육과 성장에 쓸 자원을 확보할 수 있습니다."
 SWE_folkpartiet_2: "자유주의적 미래"
 SWE_folkpartiet_2_desc: "자유당은 스웨덴을 자유, 혁신, 국제 협력의 미래로 이끕니다. 교육, 개방성, 경제 개혁에 대한 그들의 의지가 국가를 앞으로 이끌 것입니다."
 SWE_moderaterna: "온건당 지지"
 SWE_moderaterna_desc: "온건당은 강한 경제, 효율적인 통치, 국가 안보를 믿습니다. 그들의 자유보수주의 강령은 감세, 투자, 유능한 국방력을 강조합니다."
 SWE_m_energy_problems: "에너지 위기 대처"
 SWE_m_energy_problems_desc: "치솟는 에너지 비용과 불안정한 공급은 스웨덴의 경쟁력을 위협합니다. 원자력과 국내 생산을 포함하여 신뢰할 수 있는 시장 기반 에너지 해법에 대한 투자를 최우선으로 하겠습니다."
 SWE_m_kockums: "코쿰스 조선소 재건"
 SWE_m_kockums_desc: "코쿰스는 오랫동안 스웨덴 해군 방위의 초석이었습니다. 잠수함과 수상함 생산에 투자함으로써 국내 역량을 복원하고 전략적 자율성을 확보하겠습니다."
 SWE_m_reopen_f16: "F16 비행단 재개설"
 SWE_m_reopen_f16_desc: "스웨덴은 영공을 방어할 준비가 되어 있어야 합니다. 웁살라의 F16 비행단을 재개설하면 대공 방어 능력이 강화되고 신속한 국가 대응 능력이 뒷받침됩니다."
 SWE_m_lower_isk_taxes: "ISK 세금 인하"
 SWE_m_lower_isk_taxes_desc: "투자 저축 계좌(ISK)는 가계의 자산 형성에 결정적입니다. ISK 세금을 낮추어 장기 저축을 장려하고 민간 자본 투자를 촉진하겠습니다."
 SWE_m_attract_investors: "외국인 투자 유치"
 SWE_m_attract_investors_desc: "세계 무대에서 경쟁력을 유지하려면 스웨덴은 자본을 끌어들이는 자석이 되어야 합니다. 규제를 간소화하고 인센티브를 제공하여 국제 투자자를 유치하겠습니다."
 SWE_m_infrastructure_projects: "인프라 사업 착수"
 SWE_m_infrastructure_projects_desc: "현대적인 인프라는 경제 성장과 국가 회복력을 뒷받침합니다. 도로, 철도, 항만, 디지털 인프라에 투자하여 스웨덴 전역의 개발을 촉진하겠습니다."
 SWE_m_reduce_public_spendings: "공공 지출 삭감"
 SWE_m_reduce_public_spendings_desc: "장기적인 재정 건전성을 위해 공공 지출을 억제해야 합니다. 복지 및 행정 예산을 검토하여 더 간소하고 효과적인 국가를 지향하겠습니다."
 SWE_m_attract_skilled_workers: "숙련 인력 유치"
 SWE_m_attract_skilled_workers_desc: "산업의 경쟁력을 유지하려면 해외의 인재를 환영해야 합니다. 간소화된 이민 절차와 표적 채용은 핵심 지식의 공백을 메우는 데 도움이 될 것입니다."
 SWE_moderaterna_2: "더 강한 스웨덴을 위한 개혁"
 SWE_moderaterna_2_desc: "온건당의 개혁 의제는 경제적 자유, 책임 있는 통치, 국가 안보 위에 세워져 있습니다. 과감한 정책으로 스웨덴을 강함과 안정, 번영으로 이끌겠습니다."
 SWE_kristdemokraterna: "기독민주당 지지"
 SWE_kristdemokraterna_desc: "기독민주당은 인간의 존엄성, 책임, 가장 취약한 이들에 대한 돌봄에 기반한 정치를 제시합니다. 가족, 신앙, 지역 개발에 중점을 두어 스웨덴의 사회적 결속을 재건하는 것을 목표로 합니다."
 SWE_kd_Family_values: "가족 가치 강화"
 SWE_kd_Family_values_desc: "가족은 사회의 초석입니다. 부모의 선택권, 혼인, 장기적 안정을 지원함으로써 더 강하고 따뜻한 스웨덴을 만들겠습니다."
 SWE_kd_the_church_in_the_middle_of_society: "교회를 사회의 중심에"
 SWE_kd_the_church_in_the_middle_of_society_desc: "신앙과 전통은 우리의 도덕적 나침반에 필수적입니다. 교회와 신앙 기반 단체에 더 큰 역할을 부여함으로써 우리의 정신적 유산과 다시 이어지겠습니다."
 SWE_kd_swing_in_spendings: "공공 지출 우선순위 조정"
 SWE_kd_swing_in_spendings_desc: "공공 지출을 사회 복지와 가족 지원 쪽으로 재조정해야 합니다. 예산의 우선순위를 다시 정함으로써 자원이 가장 필요한 곳에 돌아가도록 하겠습니다."
 SWE_kd_lower_taxes_for_families: "가족 세금 인하"
 SWE_kd_lower_taxes_for_families_desc: "가정을 꾸리는 것이 재정적 부담이 되어서는 안 됩니다. 부모, 특히 자녀가 여럿인 부모의 세금을 줄여 가정생활의 길을 수월하게 하겠습니다."
 SWE_kd_improve_child_support: "아동 지원 개선"
 SWE_kd_improve_child_support_desc: "아이들은 인생의 가능한 한 최상의 출발을 누릴 자격이 있습니다. 아동 수당을 인상하고 양육 지원 프로그램에 투자하여 소외되는 아이가 없도록 하겠습니다."
 SWE_kd_reform_workspace: "가족을 위한 직장 개혁"
 SWE_kd_reform_workspace_desc: "일과 가정의 균형은 더 쉬워져야 합니다. 유연 근무, 육아 휴직, 가정생활을 존중하는 보다 인간적인 직장을 지원하겠습니다."
 SWE_kd_decentralisation: "분권화 추진"
 SWE_kd_decentralisation_desc: "지역 사회가 자신의 필요를 가장 잘 압니다. 국가 차원에서 지역 차원으로 권한을 이양함으로써 민주주의와 지역 대응력을 강화하겠습니다."
 SWE_kd_increase_safety_network: "사회 안전망 확대"
 SWE_kd_increase_safety_network_desc: "문명 사회는 가장 약한 구성원을 돌봅니다. 맞춤형 복지 구상을 통해 노인, 환자, 장애인에 대한 사회적 보호를 강화하겠습니다."
 SWE_kd_increase_private_healthcare: "민간 의료 지원"
 SWE_kd_increase_private_healthcare_desc: "선택의 자유는 필수적입니다. 민간 의료 제공자의 역할을 확대함으로써 경쟁을 도입하고 대기 시간을 줄이며 전반적인 진료 품질을 개선하겠습니다."
 SWE_kd_regional_investments: "지역들에 투자"
 SWE_kd_regional_investments_desc: "도농 격차를 해소해야 합니다. 농촌 지역의 의료, 인프라, 서비스에 투자함으로써 국가 전체를 활성화하겠습니다."
 SWE_kristdemokraterna_2: "따뜻하고 안정된 스웨덴"
 SWE_kristdemokraterna_2_desc: "인간의 존엄성과 책임에 뿌리를 둔 정치를 바탕으로, 기독민주당은 가정이 번성하고 공동체가 꽃피며 누구도 소외되지 않는 스웨덴을 만들기 위해 노력합니다."
 SWE_K_nationalize_major_industries: "주요 산업 국유화"
 SWE_K_nationalize_major_industries_desc: "생산 수단은 사적 이윤이 아니라 인민을 위해 쓰여야 합니다. 에너지, 운송, 통신과 같은 핵심 부문을 공공 소유로 전환하여 민주적 통제와 장기적 지속 가능성을 보장하겠습니다."
 SWE_Vansterpartiet: "좌파당 지지"
 SWE_Vansterpartiet_desc: "좌파당은 평등, 노동자의 권리, 모두를 위해 작동하는 경제를 옹호합니다. 우리의 지지로 정의와 연대에 뿌리를 둔 새로운 정치의 시대가 열릴 수 있습니다."
 SWE_K_increase_taxes: "누진세 강화"
 SWE_K_increase_taxes_desc: "공정한 사회는 가장 많이 가진 이들이 가장 많이 기여할 것을 요구합니다. 자본과 부에 대한 세금을 인상하여 공공 서비스 재원을 마련하고 불평등을 줄이겠습니다."
 SWE_K_collectivice_housing_market: "주택 시장 집단화"
 SWE_K_collectivice_housing_market_desc: "주거는 상품이 아니라 권리여야 합니다. 공공 주택을 확대하고 민간 소유를 규제함으로써 모두가 감당할 수 있는 주거를 보장하겠습니다."
 SWE_K_agrar_collectivism: "농업 집단주의"
 SWE_K_agrar_collectivism_desc: "스웨덴의 농촌이 뒤처져서는 안 됩니다. 협동 농업 구상과 국가 지원을 통해 지역 사회에 힘을 싣고 식량 안보를 보장하겠습니다."
 SWE_K_workers_council: "노동자 평의회 설립"
 SWE_K_workers_council_desc: "민주주의는 일터까지 확장되어야 합니다. 선출된 노동자 평의회를 설립함으로써 피고용인이 경영과 운영에 실질적인 영향력을 갖게 될 것입니다."
 SWE_K_abolish_state_religion: "국교 폐지"
 SWE_K_abolish_state_religion_desc: "스웨덴은 현대적인 세속 사회입니다. 종교의 자유와 국가의 중립성을 보장하기 위해 교회와 국가를 완전히 분리하겠습니다."
 SWE_K_free_state_services: "무상 공공 서비스 확대"
 SWE_K_free_state_services_desc: "의료에서 교육과 교통에 이르기까지 우리는 보편적 접근을 믿습니다. 무상 공공 서비스를 확대하고 투자함으로써 소수가 아닌 다수를 위한 사회를 건설하겠습니다."
 SWE_K_increase_police: "지역 밀착 치안 확대"
 SWE_K_increase_police_desc: "안전과 정의는 함께 갑니다. 지역 밀착 치안에 대한 자원을 늘려 예방, 재활, 사회적 지원을 통해 범죄에 대처하겠습니다."
 SWE_communism_2: "민주사회주의 사회"
 SWE_communism_2_desc: "우리의 개혁은 끝이 아니라 사회를 위한 새로운 모델의 시작입니다. 민주적 통제, 평등, 연대가 모든 스웨덴인을 위한 정의롭고 포용적인 미래로 우리를 이끌 것입니다."
 SWE_v_hold_the_red_line: "붉은 선을 사수하라"
 SWE_v_hold_the_red_line_desc: "이념이 흔들리는 시기에 우리는 원칙에 충실해야 합니다. 붉은 선은 우리의 사회주의 가치를 나타내며, 우리는 이를 넘지 않을 것입니다."
 SWE_v_the_left_divides: "분열하는 좌파"
 SWE_v_the_left_divides_desc: "내부 불화는 오랫동안 좌파를 괴롭혀 왔습니다. 앞으로 나아가려면 우리의 분열을 인정하고 단결과 존중으로 이를 극복해야 합니다."
 SWE_v_modernize_the_left: "좌파의 현대화"
 SWE_v_modernize_the_left_desc: "급변하는 사회에서 계속 의미를 가지려면 좌파는 현대화해야 합니다. 녹색 정책, 신기술, 현대적 사회 가치를 받아들여야 합니다."
 SWE_v_centralize_party_discipline: "당 규율 중앙집권화"
 SWE_v_centralize_party_discipline_desc: "단결된 정당이 효과적인 정당입니다. 당 규율을 강화함으로써 결속, 충성, 일관된 메시지를 확보하겠습니다."
 SWE_v_return_to_class_struggle: "계급 투쟁으로의 복귀"
 SWE_v_return_to_class_struggle_desc: "우리 운동의 토대는 노동 계급과 엘리트 사이의 투쟁입니다. 이제 그 핵심 사명으로 돌아갈 때입니다."
 SWE_v_Migration_weaken_wages: "이민은 임금을 약화시킨다"
 SWE_v_Migration_weaken_wages_desc: "개방적 국경 정책의 경제적 현실을 인정해야 합니다. 규제 없는 이민은 임금을 억누르고 복지 체계에 부담을 줄 수 있으며, 특히 취약 부문의 노동자에게 그러합니다."
 SWE_v_embrace_feminist_workforce: "페미니스트 노동력 수용"
 SWE_v_embrace_feminist_workforce_desc: "페미니즘과 사회주의는 불가분의 관계입니다. 노동 시장에서 여성에게 힘을 실을 수 있도록 평등한 기회, 육아 휴직, 구조 개혁을 지원하겠습니다."
 SWE_v_Eco_socialist_developement_plan: "생태사회주의 발전 계획"
 SWE_v_Eco_socialist_developement_plan_desc: "환경적 지속 가능성과 사회 정의는 분리될 수 없습니다. 우리의 계획은 노동자와 지역 사회를 우선시하면서 녹색 기술에 투자할 것입니다."
 SWE_v_progressive_public_sector: "진보적 공공 부문"
 SWE_v_progressive_public_sector_desc: "공공 부문은 혁신과 평등의 중심에 있어야 합니다. 모든 시민에게 효과적으로 봉사하도록 이를 확대하고 현대화하겠습니다."
 SWE_v_expropriate_the_exploiters: "착취자 수용"
 SWE_v_expropriate_the_exploiters_desc: "노동자의 등골 위에서 이익을 취하는 자들이 더 이상 견제 없이 그렇게 할 수 없을 것입니다. 부와 자원을 인민의 품으로 되찾겠습니다."
 SWE_v_command_economic_revival: "계획 경제 부흥"
 SWE_v_command_economic_revival_desc: "중앙 계획과 표적 투자를 통해 산업을 되살리고 일자리를 창출하며 경제를 공평한 결과로 이끌겠습니다."
 SWE_v_nationalize_efforts: "국유화 노력"
 SWE_v_nationalize_efforts_desc: "핵심 부문은 민주적 통제 아래에 있어야 합니다. 국유화는 필수 산업이 사적 이윤이 아닌 공공의 이익에 봉사하도록 보장합니다."
 SWE_v_support_urban_pluralism: "도시 다원주의 지원"
 SWE_v_support_urban_pluralism_desc: "다양한 도시 공동체는 진보적 사회의 근간입니다. 문화적 다원주의, 공공 서비스, 접근 가능한 주거를 지원하겠습니다."
 SWE_K_reafirm_welfare: "복지 국가 재확인"
 SWE_K_reafirm_welfare_desc: "복지는 사치가 아닙니다. 권리입니다. 우리는 민영화에 맞서고 다음 세대를 위해 보편적 안전망을 강화하겠습니다."
 SWE_v_high_income_redistribtion: "고소득 재분배"
 SWE_v_high_income_redistribtion_desc: "더 공정한 사회를 만들려면 극단적인 부를 재분배해야 합니다. 누진 과세와 부의 상한은 이 노력에서 핵심 수단입니다."
 SWE_v_agrar_reforms: "농업 개혁"
 SWE_v_agrar_reforms_desc: "농촌 지역이 뒤처져서는 안 됩니다. 협동조합, 지속 가능한 농업, 소농의 토지 접근성에 투자하겠습니다."
 SWE_v_five_year_plan: "5개년 계획"
 SWE_v_five_year_plan_desc: "국가가 주도하는 장기 계획이 명확히 정의된 목표와 공적으로 책임지는 진척을 통해 경제, 사회, 생태의 우선순위를 이끌 것입니다."
 SWE_v_regulation_over_nationalization: "국유화 대신 규제"
 SWE_v_regulation_over_nationalization_desc: "모든 민간 부문을 장악할 필요는 없습니다. 엄격한 규제를 통해 즉각적인 국유화 없이도 사회적 목표를 달성할 수 있습니다."
 SWE_miljopartiet: "녹색당"
 SWE_miljopartiet_desc: "20세기 후반의 반핵 및 환경 운동에서 태동한 환경당(Miljöpartiet de gröna)는 스웨덴을 지속 가능하고 포용적이며 민주적인 미래로 이끄는 것을 목표로 합니다. 기후 위기가 가속화되고 사회적 분열이 커지는 가운데, 우리는 스웨덴이 재생 에너지, 생태 경제학, 녹색 혁신에서 세계의 선구자로 나서야 한다고 믿습니다. 생태적 지혜, 사회 정의, 풀뿌리 민주주의를 길잡이로 삼아 자연과 인류를 모두 존중하는 국가를 위해 일할 것입니다. 이제 장기적으로 생각할 때입니다. 우리 아이들, 우리 지구, 그리고 모든 생명을 위해."
 SWE_g_green_movement_first: "녹색 운동 우선"
 SWE_g_green_movement_first_desc: "우리의 뿌리는 행동주의와 환경주의에 있습니다. 무엇보다 먼저 우리 운동에 충실해야 합니다."
 SWE_g_pragmatic_policy: "실용적 정책"
 SWE_g_pragmatic_policy_desc: "진정한 변화에는 타협이 필요합니다. 실용주의를 받아들임으로써 우리의 비전을 한 걸음씩 실현할 수 있습니다."
 SWE_ban_fossil_subsidies: "화석 연료 보조금 금지"
 SWE_ban_fossil_subsidies_desc: "화석 연료에 보조금을 지급하는 것은 우리의 환경 목표에 어긋납니다. 이러한 보조금을 폐지하고 그 재원을 지속 가능성 쪽으로 돌리겠습니다."
 SWE_g_greenlabor_market_strategy: "녹색 노동 시장 전략"
 SWE_g_greenlabor_market_strategy_desc: "우리는 녹색 경제에서 번성하는 인력이 필요합니다. 이 전략은 기후 친화적 부문의 훈련, 전환, 혁신을 지원합니다."
 SWE_g_enviremental_tax: "환경세 개혁"
 SWE_g_enviremental_tax_desc: "지속 가능성에 보상하고 오염 유발자에게 책임을 묻는 세제를 시행하겠습니다."
 SWE_g_enviremental_agriculture: "환경 농업"
 SWE_g_enviremental_agriculture_desc: "농업은 지속 가능하면서도 생산적이어야 합니다. 생태 농법과 생물 다양성을 지원하겠습니다."
 SWE_g_broad_enviremental_agenda: "포괄적 환경 의제"
 SWE_g_broad_enviremental_agenda_desc: "대기 질에서 해양까지, 임업에서 에너지까지, 우리의 정책은 환경 위기의 모든 측면을 다룹니다."
 SWE_g_parlamrntary_profesionalism: "의회 전문성"
 SWE_g_parlamrntary_profesionalism_desc: "실질적인 개혁을 이루려면 정치 무대에서 유능하고 진지하다는 평가를 받아야 합니다."
 SWE_g_tax_incentives_for_gren_innovation: "녹색 혁신 세제 혜택"
 SWE_g_tax_incentives_for_gren_innovation_desc: "표적 감세와 지원을 통해 청정 기술에 투자하는 스타트업과 기존 기업을 지원하겠습니다."
 SWE_g_cultural_autonomy_and_diversity: "문화적 자율성과 다양성"
 SWE_g_cultural_autonomy_and_diversity_desc: "환경주의와 인권은 연결되어 있습니다. 우리는 스웨덴 내 모든 공동체의 다양성과 자율성을 받아들입니다."
 SWE_g_green_municipal_innovation_hubs: "녹색 지방 자치 혁신 거점"
 SWE_g_green_municipal_innovation_hubs_desc: "도시와 마을이 국가 재정의 지원을 받아 지역 주도의 혁신으로 기후 정책을 선도할 것입니다."
 SWE_g_Renewable_vision: "재생 에너지 비전"
 SWE_g_Renewable_vision_desc: "100% 재생 에너지 스웨덴은 손이 닿는 거리에 있습니다. 야심 찬 목표를 세우고 이를 달성하기 위한 로드맵을 마련하겠습니다."
 SWE_g_inclusive_migation_policy: "포용적 이민 정책"
 SWE_g_inclusive_migation_policy_desc: "지속 가능성에는 인간의 존엄성이 포함됩니다. 우리의 이민 정책은 포용적이고 윤리적이며 통합에 중점을 둘 것입니다."
 SWE_g_ecological_feminism_as_core: "생태 페미니즘을 핵심으로"
 SWE_g_ecological_feminism_as_core_desc: "우리는 환경 문제와 성평등이 깊이 연결되어 있음을 인식합니다. 페미니즘의 가치가 우리의 생태 정책을 이끌 것입니다."
 SWE_g_circular_economy_polices: "순환 경제 정책"
 SWE_g_circular_economy_polices_desc: "아무것도 낭비하지 않고 모든 것을 재사용합니다. 순환 경제는 선택지 중 하나가 아니라 우리가 나아갈 유일한 지속 가능한 길입니다."
 SWE_g_green_startup_heaven: "녹색 스타트업의 천국"
 SWE_g_green_startup_heaven_desc: "보조금, 인프라, 세계적 인지도를 통해 스웨덴이 기후를 생각하는 기업가들이 가장 먼저 찾는 나라가 될 것입니다."
 SWE_g_Suits_and_Birkenstocks: "정장과 비르켄슈토크"
 SWE_g_Suits_and_Birkenstocks_desc: "현대적인 녹색 운동은 풀뿌리 이상과 전문적인 실행력을 아우릅니다. 우리는 의회와 거리 모두에서 앞장설 준비가 되어 있습니다."
 SWE_s_the_classic_welfare_model: "고전적 복지 모델"
 SWE_s_the_classic_welfare_model_desc: "평등, 의료, 교육, 경제적 안정으로 세계의 찬사를 받는 모델인 스웨덴 복지 국가에 대한 우리의 의지를 재확인하겠습니다."
 SWE_s_the_reform_welfare_model: "복지 모델 개혁"
 SWE_s_the_reform_welfare_model_desc: "사회가 진화하듯 복지 제도도 진화해야 합니다. 연대와 지원이라는 핵심 가치를 유지하면서 구조를 현대화하겠습니다."
 SWE_s_progressive_tax_system_renewal: "누진 세제 쇄신"
 SWE_s_progressive_tax_system_renewal_desc: "지속 가능한 복지 재원을 보장하기 위해 공정성과 재분배를 지향하는 누진 정책으로 세제를 쇄신하겠습니다."
 SWE_s_open_border: "열린 국경"
 SWE_s_open_border_desc: "우리는 개방성을 받아들입니다. 새로 온 이들을 환영함으로써 스웨덴은 노동 시장, 문화 생활, 국제적 위상을 풍요롭게 합니다."
 SWE_s_Labor_oriented_migration: "노동 중심 이민"
 SWE_s_Labor_oriented_migration_desc: "노동 시장의 수요에 맞추어 이민 정책을 구성하여 통합과 경제적 효용을 보장하겠습니다."
 SWE_s_digital_welfare_service: "디지털 복지 서비스"
 SWE_s_digital_welfare_service_desc: "미래는 디지털입니다. 복지 서비스를 현대화함으로써 접근성을 개선하고 관료주의를 줄이며 효율을 높이겠습니다."
 SWE_s_Gender_equality_for_economics: "경제를 위한 성평등"
 SWE_s_Gender_equality_for_economics_desc: "경제 정책은 모두에게 힘이 되어야 합니다. 구조적 불평등을 해소하고 여성의 경제적 주체성을 증진하겠습니다."
 SWE_s_invest_in_futur_schooling: "미래 교육 투자"
 SWE_s_invest_in_futur_schooling_desc: "교육은 미래의 열쇠입니다. 학교, 교사, 학생에게 투자하여 장기적 번영을 보장하겠습니다."
 SWE_s_labor_union_priority: "노동조합 우선"
 SWE_s_labor_union_priority_desc: "강력한 노동조합은 공정한 노동 조건에 필수적입니다. 단체 교섭권을 보호하고 우선시하겠습니다."
 SWE_s_independend_labor_policy: "독자적 노동 정책"
 SWE_s_independend_labor_policy_desc: "세계가 변하더라도 노동 기준과 규제에 대한 국가의 통제권을 유지해야 합니다."
 SWE_s_centralizion_efforts: "중앙집권화 노력"
 SWE_s_centralizion_efforts_desc: "중앙 통치 구상을 통해 국가 기능을 간소화하고 분절을 줄이는 것을 목표로 합니다."
 SWE_s_force_renewable_energy: "재생 에너지 강제 전환"
 SWE_s_force_renewable_energy_desc: "기후 위기는 과감한 행동을 요구합니다. 전국에서 재생 에너지원으로 신속하게 전환하겠습니다."
 SWE_s_liberalize_the_energy_market: "에너지 시장 자유화"
 SWE_s_liberalize_the_energy_market_desc: "에너지 부문을 경쟁과 혁신에 개방함으로써 비용을 낮추고 효율을 높이겠습니다."
 SWE_s_international_recruitment_agreements: "국제 인력 채용 협정"
 SWE_s_international_recruitment_agreements_desc: "국제 전문가를 유치하고 숙련 인력이 필요한 부문을 지원하는 협정을 체결하겠습니다."
 SWE_s_the_renewed_social_democrazy: "새로운 사회민주주의"
 SWE_s_the_renewed_social_democrazy_desc: "복지 전통과 혁신을 결합하여 지속 가능하고 포용적이며 미래에 대비된 새로운 사회민주주의의 시대를 열겠습니다."
 SWE_c_green_opening: "녹색 개방"
 SWE_c_green_opening_desc: "중도 강령을 녹색 가치에 개방하여 환경주의를 혁신, 실용주의, 지역 역량 강화와 결합하는 것을 목표로 합니다."
 SWE_c_envirementalism_as_identity: "정체성으로서의 환경주의"
 SWE_c_envirementalism_as_identity_desc: "환경 가치가 우리 정치적 정체성의 중심에 놓이며 모든 부문에 걸친 우리의 우선순위와 정책을 규정할 것입니다."
 SWE_c_support_cooperative_and_local_economy: "협동조합 및 지역 경제 지원"
 SWE_c_support_cooperative_and_local_economy_desc: "지역주의와 협동조합 기업을 옹호하여 회복력 있고 민주적이며 공동체에 뿌리를 둔 경제를 만들겠습니다."
 SWE_c_highschool_reforms: "고등학교 개혁"
 SWE_c_highschool_reforms_desc: "현대적 교육은 지속 가능성과 혁신의 열쇠입니다. 비판적 사고와 생태 의식에 중점을 두도록 학교 제도를 개혁하겠습니다."
 SWE_c_labor_market_deregulation: "노동 시장 규제 완화"
 SWE_c_labor_market_deregulation_desc: "고용, 기업가 정신, 유연성을 촉진하기 위해 노동 시장에 대한 규제 부담을 줄이겠습니다."
 SWE_c_decentralize_welfare: "복지 분권화"
 SWE_c_decentralize_welfare_desc: "지역의 필요에 더 잘 부응하기 위해 복지 제도를 분권화하고 지방 자치체에 더 큰 책임을 부여하겠습니다."
 SWE_c_human_centered_migration_policy: "인간 중심 이민 정책"
 SWE_c_human_centered_migration_policy_desc: "존엄성, 통합, 장기적인 사회적 기여에 기반한 이민 정책을 시행하겠습니다."
 SWE_c_reaffirm_the_agrarian_legacy: "농업 유산 재확인"
 SWE_c_reaffirm_the_agrarian_legacy_desc: "스웨덴의 농촌은 우리 유산의 근간입니다. 농업, 소농, 전통적인 토지 이용을 보호하겠습니다."
 SWE_c_expand_green_energy: "녹색 에너지 확대"
 SWE_c_expand_green_energy_desc: "기후 변화에 맞서고 회복력 있는 경제를 구축하기 위해 청정 재생 에너지원에 대규모로 투자하겠습니다."
 SWE_c_digital_infrastructure: "디지털 인프라"
 SWE_c_digital_infrastructure_desc: "현대적이고 녹색인 사회는 연결되어야 합니다. 혁신과 평등을 뒷받침할 견고한 디지털 인프라를 구축하겠습니다."
 SWE_c_champion_small_businesses_and_start_up: "소기업 및 스타트업 옹호"
 SWE_c_champion_small_businesses_and_start_up_desc: "불필요한 관료적 절차를 없애고 소기업에 표적 지원을 제공하여 기업가 정신과 혁신을 육성하겠습니다."
 SWE_c_privatisation_of_public_service: "공공 서비스 민영화"
 SWE_c_privatisation_of_public_service_desc: "공공 부문에 시장 기제를 도입함으로써 서비스 제공의 효율성과 혁신을 달성할 수 있습니다."
 SWE_c_tax_cut_for_innovation: "혁신 감세"
 SWE_c_tax_cut_for_innovation_desc: "혁신은 보상받을 자격이 있습니다. 녹색 및 기술적 돌파구에 대한 세금을 낮추어 성장과 지속 가능성을 가속하겠습니다."
 SWE_c_green_centrist_identity: "녹색 중도 정체성"
 SWE_c_reach_into_the_cities: "도시로의 확장"
 SWE_c_reach_into_the_cities_desc: "도시의 스웨덴은 변하고 있습니다. 대도시 공동체와 소통하여 지지 기반을 넓히고 포용적이고 녹색인 도시 정책을 옹호하겠습니다."
 SWE_c_Liberal_centrist_identity: "자유주의적 중도 정체성"
 SWE_c_Liberal_centrist_identity_desc: "자유주의, 기술, 녹색 현대화가 21세기 우리 중도 강령을 규정할 것입니다."
 SWE_c_modernice_patry_identity: "당 정체성 현대화"
 SWE_c_modernice_patry_identity_desc: "변화하는 세계에서 계속 의미를 가지려면 당의 정체성을 갱신하여 현대적이고 개방적이며 생태를 의식하는 비전을 받아들이겠습니다."
 SWE_fp_social_liberal_ways: "사회자유주의의 길"
 SWE_fp_social_liberal_ways_desc: "개인의 자유와 사회적 책임을 결합하는 항로를 설정하겠습니다. 사회자유주의가 우리의 지도 철학이 될 것입니다."
 SWE_fp_defend_liberal_values: "자유주의 가치 수호"
 SWE_fp_defend_liberal_values_desc: "정치적 격동의 시대에 자유민주주의, 다원주의, 법치를 수호하는 것이 중요합니다."
 SWE_fp_liberal_renewal: "자유주의 쇄신"
 SWE_fp_liberal_renewal_desc: "자유주의는 새로운 과제에 맞서도록 진화해야 합니다. 정의와 평등에 뿌리를 둔 미래 지향적 의제로 우리의 이념을 쇄신하겠습니다."
 SWE_fp_migartion_into_workforce: "이민자의 노동력 편입"
 SWE_fp_migartion_into_workforce_desc: "이민자를 노동 시장에 통합시켜 경제 생산성과 사회 결속을 모두 강화하겠습니다."
 SWE_fp_dutys_for_citizenship: "시민권의 의무"
 SWE_fp_dutys_for_citizenship_desc: "시민권에는 권리뿐 아니라 책임도 따릅니다. 상호 헌신을 통해 시민 교육과 통합을 증진하겠습니다."
 SWE_fp_performance_principle: "성과 원칙"
 SWE_fp_performance_principle_desc: "우리는 능력과 노력에 보상해야 한다고 믿으며, 성과와 책임을 중심으로 공공 서비스와 교육을 개혁하겠습니다."
 SWE_fp_defend_press_freedom: "언론 자유 수호"
 SWE_fp_defend_press_freedom_desc: "자유 언론은 민주주의의 초석입니다. 국가의 간섭과 시장 독점으로부터 이를 지키겠습니다."
 SWE_fp_increase_parlamentarian_controll: "의회 통제 강화"
 SWE_fp_increase_parlamentarian_controll_desc: "의회는 행정 권력을 감독해야 합니다. 투명성과 민주적 책임성을 강화하겠습니다."
 SWE_fp_increase_individual_freedom: "개인의 자유 확대"
 SWE_fp_increase_individual_freedom_desc: "개인의 자율성, 표현, 생활 방식 선택을 넓히는 정책을 추진하겠습니다."
 SWE_fp_school_as_core_of_state_responsibility: "학교를 국가 책임의 핵심으로"
 SWE_fp_school_as_core_of_state_responsibility_desc: "교육은 공공재입니다. 국가는 모든 학생이 공평하고 질 높은 학교 교육을 받도록 보장할 것입니다."
 SWE_fp_early_performance_assessment: "조기 성과 평가"
 SWE_fp_early_performance_assessment_desc: "학생의 필요를 파악하고 학업 성과를 개선하기 위해 조기 평가를 도입하겠습니다."
 SWE_fp_Expand_elite_schools: "엘리트 학교 확대"
 SWE_fp_Expand_elite_schools_desc: "교육에서 탁월함과 리더십을 키우기 위해 엘리트 학교의 발전을 지원하겠습니다."
 SWE_fp_education_as_eco_investment: "경제적 투자로서의 교육"
 SWE_fp_education_as_eco_investment_desc: "교육은 비용이 아니라 전략적 투자입니다. 학교, 대학, 연구에 아낌없이 재정을 투입하겠습니다."
 SWE_fp_social_startups: "사회적 스타트업 지원"
 SWE_fp_social_startups_desc: "공공의 과제를 다루는 혁신적인 스타트업을 지원함으로써 사회적 목적을 지닌 기업가 정신을 장려하겠습니다."
 SWE_fp_social_market_economy: "사회적 시장 경제"
 SWE_fp_social_market_economy_desc: "자유 시장 원칙과 강력한 사회적 보호 및 공정한 경쟁의 균형을 이루는 모델을 채택하겠습니다."
 SWE_fp_expand_equality: "평등 확대"
 SWE_fp_expand_equality_desc: "표적 개혁, 포용적 제도, 적극적 조치를 통해 사회적 불평등을 줄이는 것을 목표로 합니다."
 SWE_fp_protect_fundamental_digital_rights: "기본 디지털 권리 보호"
 SWE_fp_protect_fundamental_digital_rights_desc: "자유는 사이버 공간으로 확장되어야 합니다. 사생활, 표현, 디지털 접근권을 기본권으로 수호하겠습니다."
 SWE_fp_decrease_surveillance: "감시 축소"
 SWE_fp_decrease_surveillance_desc: "대규모 감시는 민주주의를 훼손합니다. 과도한 감시를 되돌리고 시민의 자유를 회복하겠습니다."
 SWE_fp_mandatory_swedish_language_instruction: "스웨덴어 교육 의무화"
 SWE_fp_mandatory_swedish_language_instruction_desc: "공통 언어는 통합의 열쇠입니다. 모든 거주자에게 스웨덴어 교육을 의무화하겠습니다."
 SWE_fp_police_as_guardian_of_law: "법의 수호자로서의 경찰"
 SWE_fp_police_as_guardian_of_law_desc: "경찰은 시민을 보호하고 법을 공정하게 집행해야 합니다. 훈련, 투명성, 신뢰에 투자하겠습니다."
 SWE_fp_expansion_of_digital_surveillance: "디지털 감시 확대"
 SWE_fp_expansion_of_digital_surveillance_desc: "사이버 위협에 대응하고 국가 안보를 보장하기 위해 감독 하에 디지털 감시 능력을 확대하겠습니다."
 SWE_m_social_cuts: "사회 지출 삭감 시행"
 SWE_m_social_cuts_desc: "경제의 지속 가능성을 보장하기 위해 사회 지출을 줄이고 복지 의존보다 개인의 책임을 장려하겠습니다."
 SWE_m_privatisation_state_property: "국유 재산 민영화"
 SWE_m_privatisation_state_property_desc: "효율을 높이고 경쟁을 촉진하며 공공 부채를 줄이기 위해 국영 기업을 민영화하겠습니다."
 SWE_m_cut_taxes: "감세"
 SWE_m_cut_taxes_desc: "근로와 기업 활동에 대한 세금을 낮추면 경제에 활력이 돌고 일자리 창출이 촉진되며 진취성에 보상이 돌아갑니다."
 SWE_m_law_and_order: "법과 질서"
 SWE_m_law_and_order_desc: "안전한 사회가 곧 자유로운 사회입니다. 법 집행에 투자하고 범죄에 대한 더 강경한 조치를 시행하겠습니다."
 SWE_m_attract_statr_up: "스타트업 유치"
 SWE_m_attract_statr_up_desc: "전국에서 혁신적인 스타트업을 유치하고 지원할 수 있도록 기업 친화적 환경을 조성하겠습니다."
 SWE_m_attract_investor: "투자자 유치"
 SWE_m_attract_investor_desc: "규제 완화와 세제 혜택을 통해 스웨덴을 국내외 투자자 모두에게 매력적인 투자처로 만들겠습니다."
 SWE_m_reform_social_state: "복지 국가 개혁"
 SWE_m_reform_social_state_desc: "복지 제도는 가장 도움이 필요한 이들에게 초점을 맞추도록 개혁하여 비효율과 장기 의존을 줄여야 합니다."
 SWE_m_liberalice_workspace: "일터 자유화"
 SWE_m_liberalice_workspace_desc: "경직된 노동 시장 규제를 없앰으로써 유연성, 생산성, 고용을 높이겠습니다."
 SWE_m_Arbetslinjen: "근로 우선 노선"
 SWE_m_Arbetslinjen_desc: "근로는 언제나 복지보다 더 큰 보상을 가져와야 합니다. 급여보다 고용을 장려하는 개혁을 시행하겠습니다."
 SWE_m_infrastructure_subventions: "인프라 보조금"
 SWE_m_infrastructure_subventions_desc: "인프라에 대한 표적 공공 투자는 지역 발전을 촉진하고 민간 부문의 성장을 가능하게 할 것입니다."
 SWE_m_increase_energy_production: "에너지 생산 증대"
 SWE_m_increase_energy_production_desc: "공급을 확보하고 가격을 낮추며 산업 경쟁력을 뒷받침하기 위해 에너지 생산을 확대하겠습니다."
 SWE_m_reduce_public_tax: "공공 세금 인하"
 SWE_m_reduce_public_tax_desc: "시민에게 힘을 실어 주고 수요를 자극하며 경제 활동을 이끌기 위해 전반적인 세 부담을 줄이겠습니다."
 SWE_m_improve_migration_and_education: "이민 및 교육 개선"
 SWE_m_improve_migration_and_education_desc: "교육과 언어 습득을 통한 더 나은 통합은 이민자가 사회에 의미 있게 기여하도록 보장할 것입니다."
 SWE_m_cut_public_spendings: "공공 지출 삭감"
 SWE_m_cut_public_spendings_desc: "불필요한 국가 지출을 줄여 예산의 균형을 맞추고 장기적인 경제 안정을 도모하겠습니다."
 SWE_m_support_start_ups: "스타트업 지원"
 SWE_m_support_start_ups_desc: "보조금, 간소화된 관료 절차, 네트워킹 프로그램을 통해 기업가에게 전략적 지원을 제공하겠습니다."
 SWE_m_liberal_eco_way: "자유주의적 경제의 길"
 SWE_m_liberal_eco_way_desc: "우리는 간소화된 공공 부문의 뒷받침 속에서 시장이 성장과 혁신을 이끄는 자유주의 경제를 믿습니다."
 SWE_m_modernized_liberalism: "현대화된 자유주의"
 SWE_m_modernized_liberalism_desc: "우리의 이념은 개인의 자유와 효율적인 통치, 역동적인 경제의 균형을 이루며 21세기의 과제에 맞서도록 진화할 것입니다."
 SWE_kd_deregulate_workspace: "일터 규제 완화"
 SWE_kd_deregulate_workspace_desc: "과잉 규제를 줄이고 노사 협력을 촉진하여 노동 시장의 유연성을 회복하는 것을 목표로 합니다."
 SWE_kd_traditional_values_in_education: "교육의 전통적 가치"
 SWE_kd_traditional_values_in_education_desc: "우리의 학교는 기술만 가르칠 것이 아니라 존중, 규율, 책임과 같은 불변의 가치도 강화해야 합니다."
 SWE_kd_KKK_Kyrka_Kullar_Kastruller: "KKK - 교회, 아이들, 부엌"
 SWE_kd_KKK_Kyrka_Kullar_Kastruller_desc: "신앙, 가족, 가정. 건강한 사회의 초석인 교회, 가족, 화로에 대한 우리의 의지를 재확인합니다."
 SWE_kd_privatisation_in_healthcare: "의료 서비스 민영화"
 SWE_kd_privatisation_in_healthcare_desc: "민간 대안을 포함한 다양한 의료 체계는 경쟁을 통해 품질을 끌어올리면서도 모두의 접근성을 유지할 것입니다."
 SWE_kd_decentralice_education: "교육 분권화"
 SWE_kd_decentralice_education_desc: "우리는 지역 사회와 학부모에게 자녀 교육에 대한 더 큰 통제권을 주어야 한다고 믿습니다."
 SWE_kd_working_migration: "노동 기반 이민"
 SWE_kd_working_migration_desc: "우리의 이민 정책은 책임을 강조해야 하며, 노동을 통해 사회에 기여하는 개인에게 초점을 맞추어야 합니다."
 SWE_kd_values_bevor_work: "노동력보다 가치 우선"
 SWE_kd_values_bevor_work_desc: "건강한 사회는 순수한 경제적 효용보다 공유된 가치와 문화적 통합을 우선시해야 합니다."
 SWE_kd_more_state_care: "돌봄 및 복지 지원"
 SWE_kd_more_state_care_desc: "따뜻하고 잘 기능하는 복지 제도를 통해 가족, 돌봄 제공자, 도움이 필요한 이들에 대한 지원을 강화하겠습니다."
 SWE_kd_voluntary_for_honor: "자원봉사를 통한 영예"
 SWE_kd_voluntary_for_honor_desc: "시민적 의무와 자원봉사는 공동체와 인격을 길러 냅니다. 자원봉사를 고귀한 사회적 기여로 장려하겠습니다."
 SWE_kd_fight_paralel_society: "병행 사회 대처"
 SWE_kd_fight_paralel_society_desc: "국가적 단합을 지키기 위해 고립된 공동체에 맞서 행동하고, 공유된 민주적 규범이 사회 전체에서 지켜지도록 보장하겠습니다."
 SWE_kd_increase_parental_rights: "부모의 권리 확대"
 SWE_kd_increase_parental_rights_desc: "자녀를 키우는 데에는 부모가 일차적 역할을 해야 합니다. 교육, 의료, 복지에서 부모의 권리를 확대하겠습니다."
 SWE_kd_decentralice_social_services: "사회 서비스 분권화"
 SWE_kd_decentralice_social_services_desc: "지방 당국이 자기 시민을 가장 잘 압니다. 사회 서비스의 책임을 서비스를 받는 이들에게 더 가까운 곳으로 옮기겠습니다."
 SWE_kd_benefits_for_voluntary_service: "자원봉사 혜택"
 SWE_kd_benefits_for_voluntary_service_desc: "자원봉사자는 인정받아야 합니다. 남을 위해 시간을 내는 개인에게 혜택을 제공하겠습니다."
 SWE_kd_regional_investment: "지역들에 투자"
 SWE_kd_regional_investment_desc: "불평등을 줄이고 접근성을 개선하며 지역 경제와 전통을 지원하기 위해 스웨덴의 농촌과 지방에 투자하겠습니다."
 SWE_modern_issues: "현대적 문제 대처"
 SWE_modern_issues_desc: "스웨덴은 기로에 서 있습니다. 인구 구조 변화에서 도시 불안에 이르기까지, 21세기의 과제에 과감한 정치적 행동으로 맞설 때가 왔습니다."
 SWE_sverigedemokraterna: "스웨덴 민주당 지지"
 SWE_sverigedemokraterna_desc: "스웨덴 민주당은 민족주의, 문화적 결속, 전통적 가치로의 회귀를 대변합니다. 이들을 지지함으로써 스웨덴 정체성 수호로 초점을 옮기게 됩니다."
 SWE_sd_folkhemmet: "국민의 집 복원"
 SWE_sd_folkhemmet_desc: "모든 시민이 국가라는 하나의 가족에 속하는 결속된 사회, 곧 '국민의 집(Folkhemmet)'의 비전을 되살려야 합니다. 자국민을 보호하는 스웨덴을 재건하겠습니다."
 SWE_sd_reduce_immigration: "이민 대폭 감축"
 SWE_sd_reduce_immigration_desc: "현행 이민 정책은 지속 불가능합니다. 스웨덴의 문화와 안보를 지키려면 엄격한 제한을 부과하고 국경에 대한 완전한 통제권을 되찾아야 합니다."
 SWE_sd_clean_the_ghettos: "교외 지역 탈환"
 SWE_sd_clean_the_ghettos_desc: "무법 상태와 병행 사회는 용납될 수 없습니다. 범죄 조직망을 해체하고 문제 지역을 재통합하려는 집중적인 노력이 국민 통합을 회복시킬 것입니다."
 SWE_sd_traditional_families: "전통적 가족 가치 장려"
 SWE_sd_traditional_families_desc: "안정된 사회는 튼튼한 가족 위에 세워집니다. 전통적 가치를 장려하고 현대의 사회적 실험에 반대함으로써 우리의 문화적 토대를 강화합니다."
 SWE_sd_increase_police_resources: "경찰 재정 지원"
 SWE_sd_increase_police_resources_desc: "우리 경찰력은 재정이 부족하고 과부하 상태입니다. 인원을 늘리고 장비를 개선하며 스웨덴 전역에서 법과 질서를 다시 세울 때입니다."
 SWE_sd_ban_islam: "급진 이슬람 금지"
 SWE_sd_ban_islam_desc: "급진 이슬람은 스웨덴의 가치와 안보에 위협이 됩니다. 단호한 조치로 극단주의 단체를 금지하고 시민을 이념적 극단주의로부터 보호하겠습니다."
 SWE_sd_patriotism: "스웨덴 애국심 부활"
 SWE_sd_patriotism_desc: "스웨덴인이라는 것이 무엇을 뜻하는지 시민들에게 일깨워야 합니다. 교육, 문화 구상, 국가적 자긍심을 통해 공유된 정체성을 강화하겠습니다."
 SWE_sverigedemokraterna_2: "스웨덴인을 위한 스웨덴"
 SWE_sverigedemokraterna_2_desc: "국경이 안전하고, 문화가 보호되며, 제도가 쇄신된 지금, 우리는 앞으로 다가올 세대를 위해 강하고 단결된 주권 국가 스웨덴을 재건하는 데 집중합니다."
 SWE_sd_the_family: "토대로서의 가족"
 SWE_sd_the_family_desc: "책임과 국가적 가치를 강조하며 건강한 사회의 초석으로서 전통적 가족 구조를 강화하겠습니다."
 SWE_sd_ban_hijab: "히잡 금지"
 SWE_sd_ban_hijab_desc: "억압을 상징하는 종교적 복장은 스웨덴의 공적 생활에 설 자리가 없습니다. 학교와 정부 기관에서 히잡을 금지하겠습니다."
 SWE_sd_the_swedish_workforce: "스웨덴 노동력 강화"
 SWE_sd_the_swedish_workforce_desc: "고용, 직업 훈련, 복지 사업에서 토착 스웨덴인을 우선하여 외국인 노동력에 대한 의존을 줄이겠습니다."
 SWE_sd_the_State_of_sverige: "스웨리예 국가"
 SWE_sd_the_State_of_sverige_desc: "중앙집권적 권위와 국가적 자긍심을 바탕으로 스웨덴 국민의 의지와 전통을 반영하는 강력한 주권 국가를 건설하겠습니다."
 SWE_sd_tradition_and_tolerance: "전통과 관용"
 SWE_sd_tradition_and_tolerance_desc: "스웨덴은 문화유산, 공통의 가치, 사회적 결속이라는 뿌리를 재발견해야 합니다. 우리는 스웨덴의 전통을 존중하는 다양성을 관용합니다."
 SWE_sd_ban_lgbtq: "LGBTQ 홍보 금지"
 SWE_sd_ban_lgbtq_desc: "국가는 더 이상 학교나 언론에서 LGBTQ 옹호 활동에 재정을 지원하거나 이를 지지하지 않을 것입니다. 아이들은 생물학과 전통에 뿌리를 둔 중립적인 환경을 누릴 자격이 있습니다."
 SWE_sd_only_skilled_workforce: "숙련 이민만 허용"
 SWE_sd_only_skilled_workforce_desc: "이민은 스웨덴에 시급히 필요한 기술을 지닌 개인으로 제한될 것입니다. 그 외의 사람은 입국이나 지원이 거부됩니다."
 SWE_sd_autonom_regions: "자치 지역 제한"
 SWE_sd_autonom_regions_desc: "어떤 지역도 국가의 가치를 벗어나 행동해서는 안 됩니다. 통합이나 국가 단합을 해치는 경우 지방 자치는 억제될 것입니다."
 SWE_sd_stop_migration: "이민 중단"
 SWE_sd_stop_migration_desc: "통제를 회복하고 안전을 보장하며 스웨덴 문화를 일상생활에 다시 통합하기 위해 필수적이지 않은 모든 이민을 중단하겠습니다."
 SWE_sd_central_power: "권력 집중"
 SWE_sd_central_power_desc: "국가 개혁을 효과적으로 시행하기 위해 정치 권력을 국가의 손에 집중하고 지역의 방해를 줄이겠습니다."
 SWE_sd_Lebensbaum: "생명의 나무"
 SWE_sd_Lebensbaum_desc: "전통, 단결, 조국 방위에 뿌리를 둔 자랑스럽고 영속하는 스웨덴의 씨앗을 심겠습니다."
 SWE_sd_the_economy: "국가 경제 수호"
 SWE_sd_the_economy_desc: "스웨덴 경제는 무엇보다 시민에게 봉사해야 합니다. 국가적 회복력을 지향하고 세계 시장에 대한 의존도를 낮추도록 경제를 재편하겠습니다."
 SWE_sd_the_security: "국가 안보 회복"
 SWE_sd_the_security_desc: "안보는 강한 국가의 토대입니다. 국민을 보호하기 위해 군, 국경 수비대, 치안 활동에 투자하겠습니다."
 SWE_sd_the_social: "사회 결속 보존"
 SWE_sd_the_social_desc: "우리는 단합되고 도덕적인 사회를 회복하는 것을 목표로 합니다. 문화적 규범을 지키고 해로운 영향을 제거하겠습니다."
 SWE_sd_the_future: "미래를 향한 비전"
 SWE_sd_the_future_desc: "스웨덴의 미래는 전통, 기술, 국가적 자긍심에 있습니다. 후손이 자랑스러워할 국가를 만들어 가겠습니다."
 SWE_sd_protect_traditions: "우리의 전통 수호"
 SWE_sd_protect_traditions_desc: "스웨덴의 명절, 관습, 언어를 외부의 영향으로부터 지키겠습니다. 국가적 자긍심은 문화 보존에서 시작됩니다."
 SWE_Western_focus: "서방과의 연대"
 SWE_Western_focus_desc: "스웨덴은 서방 강대국과의 유대를 강화하여 우리의 가치가 민주주의 세계와 일치하도록 보장해야 합니다. 외교, 군사, 경제 협력을 심화함으로써 서방 블록의 핵심 일원으로서의 역할을 공고히 합니다."
 SWE_EU_continental_commitment: "대륙 공약"
 SWE_EU_continental_commitment_desc: "스웨덴은 유럽의 안보 및 혁신 체계에 대한 참여를 심화합니다. 우리의 미래는 고고한 고립이 아니라 공유된 책임과 조율된 힘에 있습니다."
 SWE_EU_visit_buckingham: "버킹엄 국빈 방문"
 SWE_EU_visit_buckingham_desc: "영국은 EU를 떠났지만 스웨덴과의 문화적, 안보적 유대는 여전히 깊습니다. 국빈 방문은 상호 존중을 재확인하고 향후의 협력을 위한 은밀한 채널을 엽니다."
 SWE_EU_renew_stockholm_berlin_axis: "스톡홀름-베를린 축 갱신"
 SWE_EU_renew_stockholm_berlin_axis_desc: "베를린과 스톡홀름은 유럽의 절제, 회복력, 혁신을 떠받치는 중추를 이룰 수 있습니다. 이 전략 축은 외교, 군사 계획, 재정 조율을 강화합니다."
 SWE_EU_franco_swedish_alliance: "프랑스-스웨덴 동맹 결성"
 SWE_EU_franco_swedish_alliance_desc: "프랑스는 유럽의 자율성과 군사 능력의 중심축입니다. 공식 동맹을 맺으면 스웨덴은 최첨단 방위, 핵 억지 협력, 위기 대응에 참여할 수 있습니다."
 SWE_EU_european_research_council_ties: "ERC와의 유대 강화"
 SWE_EU_european_research_council_ties_desc: "스웨덴은 유럽 연구 위원회와의 통합을 심화하여 과학 재정과 혁신 목표를 대륙 파트너들과 일치시키기로 약속합니다."
 SWE_EU_European_cybershield: "유럽 사이버 방패 가입"
 SWE_EU_European_cybershield_desc: "사이버 보안은 이제 곧 주권입니다. EU 전역의 사이버 방패 구상에 참여함으로써 위협 탐지, 공유 능력, 공세적 억지력을 높입니다."
 SWE_EU_logistic_networks: "유럽 물류망 통합"
 SWE_EU_logistic_networks_desc: "공급망과 이동 회랑은 유럽 방위에 필수적입니다. 스웨덴은 신속한 동원과 경제적 회복력을 위해 자국 인프라를 단일 물류망에 통합할 것입니다."
 SWE_EU_mio_links: "EU 군수 산업 운영사와 연결"
 SWE_EU_mio_links_desc: "민관 협력을 통해 스웨덴 기업을 유럽 군수 산업 운영사(MIO)와 연결하여 공동 생산과 연구 개발을 위한 대용량 네트워크를 구축합니다."
 SWE_EU_joint_weather_and_space_monitoring: "기상 및 우주 공동 감시"
 SWE_EU_joint_weather_and_space_monitoring_desc: "기후 회복력과 궤도 감시는 이제 방위의 우선 과제입니다. 공동 감시 구상은 우주와 과학 양쪽에서 유럽의 전략적 자율성을 강화합니다."
 SWE_EU_innovation_hub_programm: "유럽 혁신 거점 프로그램 가입"
 SWE_EU_innovation_hub_programm_desc: "혁신은 추상적인 것이 아니라 군사, 민간, 디지털 분야의 우위를 규정합니다. 스웨덴은 AI, 양자, 에너지 전환을 추진하기 위해 유럽 혁신 거점에 가입합니다."
 SWE_EU_European_defence_identity: "유럽 방위 정체성 지지"
 SWE_EU_European_defence_identity_desc: "스웨덴은 협력적이고 자주적이며 유능한 독자적 유럽 방위 정체성을 지지합니다. 이는 NATO에 맞서는 것이 아니라 유럽을 내부에서 강화함으로써 NATO를 보완합니다."
 SWE_USA_revitalize_atlantic_link: "대서양 유대 활성화"
 SWE_USA_revitalize_atlantic_link_desc: "우리는 미국과의 대서양 횡단 유대를 재확인합니다. 공유된 안보, 민주적 회복력, 경제적 유대가 스웨덴 전략의 토대를 이룹니다."
 SWE_USA_defense_consultation_USA: "미국과 방위 협의"
 SWE_USA_defense_consultation_USA_desc: "고위급 대화를 통해 미국 측 상대와 교리, 위협 평가, 조달 전략을 조율합니다."
 SWE_USA_defense_consultation_CAN: "캐나다와 방위 협의"
 SWE_USA_defense_consultation_CAN_desc: "캐나다는 스웨덴과 마찬가지로 주권과 협력 사이에서 균형을 잡습니다. 방위 협의는 공동의 북극 전략, 훈련 정렬, 영공 조율을 촉진합니다."
 SWE_USA_think_tank_links: "미국 전략 싱크탱크와 연계"
 SWE_USA_think_tank_links_desc: "전략 문화는 전문성에 의해 형성됩니다. 미국 싱크탱크와의 제도적 제휴를 통해 정책 예측력과 학계-군 대화를 강화합니다."
 SWE_USA_found_economical_forum: "대서양 횡단 경제 포럼 창설"
 SWE_USA_found_economical_forum_desc: "새로운 경제 포럼은 스웨덴과 대서양 횡단 파트너 사이의 투자, 혁신, 산업 계획을 이어 줍니다. 열린 시장, 회복력 있는 공급, 공동의 미래."
 SWE_USA_found_nobel_techgroup: "노벨 대서양 횡단 기술 그룹 창설"
 SWE_USA_found_nobel_techgroup_desc: "스웨덴의 과학적 탁월함이 미국의 자본과 역량을 만납니다. 이 노벨 기술 그룹은 바이오 기술, 사이버 보안, 첨단 제조업에서 협력적 돌파구를 촉진합니다."
 SWE_USA_intel_partnership: "정보 파트너십 강화"
 SWE_USA_intel_partnership_desc: "신호 정보에서 위성에 이르기까지 동맹 정보기관과의 협력을 심화하여 공동의 상황 인식, 회복력, 대하이브리드 대응을 보장합니다."
 SWE_USA_military_industrial_exchange: "군수 산업 교류 프로그램"
 SWE_USA_military_industrial_exchange_desc: "공동 생산 라인, 계약업체 협력, 공동 기술 시험은 상호 운용성을 강화하고 중복을 줄여 동맹 전체의 즉응 태세를 위한 토대를 마련합니다."
 SWE_USA_human_science_projects: "공동 인문과학 프로젝트 개시"
 SWE_USA_human_science_projects_desc: "회복력, 피로, 의사 결정을 이해하는 것은 하드웨어만큼 중요합니다. 스웨덴과 미국은 방위, 보건, 스트레스 대응 분야의 인문과학에서 협력합니다."
 SWE_USA_formal_cooperation_treaty: "공식 협력 조약 체결"
 SWE_USA_formal_cooperation_treaty_desc: "미국과 공식 조약을 체결하여 전략적 연대, 방위 보장, 공동의 제도 발전을 확정합니다."
 SWE_west_deepen_relations_NATO: "NATO와의 관계 심화"
 SWE_west_deepen_relations_NATO_desc: "회원국 지위를 넘어 스웨덴은 전략적 신뢰를 추구합니다. 능력 개발, 교리, 지휘 구조에서 NATO와 적극적으로 보조를 맞춥니다."
 SWE_west_host_nato_exercises: "NATO 훈련 개최"
 SWE_west_host_nato_exercises_desc: "스웨덴은 자국 영토에서 다국적 훈련을 개최하여 즉응 태세, 신뢰, 동맹 결속에 대한 분명한 신호를 보낼 것입니다."
 SWE_west_baltic_sea_securuty_cooperation: "발트해 안보 협력 강화"
 SWE_west_baltic_sea_securuty_cooperation_desc: "NATO 동맹국과 함께 발트해 전역에서 상시 주둔과 공통 규약을 발전시켜 위협을 억제하고 안정을 투사합니다."
 SWE_west_addapt_nato_doctrine: "NATO 교리 수용"
 SWE_west_addapt_nato_doctrine_desc: "스웨덴 군사 교리를 NATO의 작전 개념에 일치시켜 상호 운용성을 높이고 전 영역에 걸친 합동 작전을 준비합니다."
 SWE_west_build_complimentary_structures: "상호 보완 구조 구축"
 SWE_west_build_complimentary_structures_desc: "우리의 국가 역량은 군수, 회복력, 고지연 영역을 포함하여 NATO의 공백을 보완할 것입니다. 영리한 주권은 곧 전략적 효용입니다."
 SWE_west_participation_in_allied_command_transformation: "연합 변혁 사령부 참여"
 SWE_west_participation_in_allied_command_transformation_desc: "NATO의 지휘 변혁 노력에 참여하여 동맹 내 미래 개념과 기술 통합을 형성하는 데 기여합니다."
 SWE_west_balistic_missile_waring_system: "탄도미사일 경보 체계 가입"
 SWE_west_balistic_missile_waring_system_desc: "스웨덴은 NATO의 조기 경보 및 미사일 추적 체계에 통합되어 더 빠른 대응과 공중 위협에 대한 공동 감시를 가능하게 합니다."
 SWE_west_strategic_datalinks: "전략 데이터링크 구축"
 SWE_west_strategic_datalinks_desc: "NATO C4ISR 구조와 암호화된 고보안 데이터링크를 구축하여 합동 작전 중 원활한 통신을 보장합니다."
 SWE_west_shared_missile_development: "공동 미사일 개발 참여"
 SWE_west_shared_missile_development_desc: "NATO 회원국과의 공동 연구 개발 프로그램을 통해 스웨덴은 차세대 미사일 기술에 기여하고 그 혜택을 누릴 수 있습니다."
 SWE_west_surveillance_data_sharing_protocol: "감시 데이터 공유 규약 시행"
 SWE_west_surveillance_data_sharing_protocol_desc: "레이더, 소나, 위성 데이터를 실시간으로 공유하는 공식 규약에 합의하여 동맹 전체에 걸친 공통의 상황도를 구축합니다."
 SWE_west_nato_officer_training: "NATO 장교 훈련 참여"
 SWE_west_nato_officer_training_desc: "스웨덴 장교들이 이제 NATO 기관 내에서 훈련하여 교리 숙달, 전략적 결속, 지도자 교류를 높입니다."
 SWE_the_royal_family: "왕실"
 SWE_the_royal_family_desc: "베르나도트 왕조는 지배를 통해서가 아니라 단결과 연속성을 구현함으로써 여러 세대에 걸쳐 스웨덴을 섬겨 왔습니다. 왕실은 정치 위에 있지만 목적 위에 있지는 않습니다."
 SWE_improve_royal_cultural_institutes: "왕립 문화 기관 개선"
 SWE_improve_royal_cultural_institutes_desc: "왕립 학술원, 재단, 역사 연구소는 국가 유산의 수호자 역할을 합니다. 이들의 현대화는 유산을 보존하고 미래 세대에게 영감을 줍니다."
 SWE_nordi_royal_networks: "북유럽 왕실 네트워크 강화"
 SWE_nordi_royal_networks_desc: "북유럽 군주국들은 전통 이상의 것, 곧 가족을 공유합니다. 이러한 왕실의 유대는 국가 간 신뢰를 쌓고 안정의 상징적 축을 형성합니다."
 SWE_ties_to_windsor: "윈저 왕가와의 유대 유지"
 SWE_ties_to_windsor_desc: "영국과 스웨덴은 오랜 왕실 간 유대를 맺어 왔습니다. 윈저 왕가와의 정기적인 교류는 군주국 연합 내에서 우리의 소프트 외교와 공유된 가치를 재확인합니다."
 SWE_bernadotte_legacy: "베르나도트 유산 기리기"
 SWE_bernadotte_legacy_desc: "프랑스 원수에서 스웨덴 국왕에 이르기까지, 베르나도트 가계는 적응, 존엄, 생존의 이야기입니다. 우리는 이 유산을 칭호뿐 아니라 봉사로써 기립니다."
 SWE_royal_legacy_fund: "왕실 유산 기금 설립"
 SWE_royal_legacy_fund_desc: "왕실의 후원을 받는 국가 기금이 교육, 연구, 사회 결속 분야의 사업을 지원하여 역사와 미래를 잇는 다리를 놓을 것입니다."
 SWE_royal_partonage: "왕실 후원 확대"
 SWE_royal_partonage_desc: "왕실은 예술에서 환경 사업에 이르기까지 사회 전반의 수많은 구상을 지원합니다. 이 후원을 전략적으로 확대하면 단결과 신뢰가 증폭됩니다."
 SWE_european_royal_circle: "유럽 왕실 서클 결성"
 SWE_european_royal_circle_desc: "외교를 넘어 왕실들은 공유된 유산으로 연결됩니다. 유럽 왕실 서클은 격동의 시대에 문화적 조율, 의례적 동맹, 은밀한 대화를 가능하게 합니다."
 SWE_ties_to_japan_imperials: "일본 황실과의 유대 존중"
 SWE_ties_to_japan_imperials_desc: "일본 황실은 스웨덴과 전통 및 상징에 대한 깊은 존중을 공유합니다. 외교적, 의례적 연결은 신중하게 그리고 상호 인정 속에서 가꾸어집니다."
 SWE_ties_to_jordan_royals: "요르단 왕실과 연결"
 SWE_ties_to_jordan_royals_desc: "요르단 왕실은 중동 안정의 기둥입니다. 상호 존중을 쌓으면 문명 사이의 가교로서 스웨덴의 역할이 높아집니다."
 SWE_house_of_hohenzollern: "호엔촐레른 가문과 연결"
 SWE_house_of_hohenzollern_desc: "역사적인 독일 왕가는 여전히 문화계와 귀족 사회에서 영향력을 지닙니다. 상징적 교류를 갱신하면 범유럽 군주제 전통이 강화됩니다."
 SWE_house_of_Nassau: "나사우 가문과 교류"
 SWE_house_of_Nassau_desc: "나사우의 후손인 룩셈부르크 왕실은 유럽의 조용한 연속성을 구현합니다. 의례적 유대를 강화하면 국경을 넘어 왕실의 정통성이 공고해집니다."
 SWE_house_of_Sachsen_coburg_gotha: "작센코부르크고타 가문 기리기"
 SWE_house_of_Sachsen_coburg_gotha_desc: "이 왕조는 영국, 벨기에, 불가리아를 잇는 왕실 외교의 그물망입니다. 공유된 선조를 기림으로써 유럽 중심부의 소프트 파워 채널을 심화합니다."
 SWE_house_of_bourbon: "부르봉 가문과의 우호적 유대"
 SWE_house_of_bourbon_desc: "정치적으로는 빛이 바랬지만 부르봉 가문은 여전히 유럽의 위엄을 상징합니다. 우리의 교류는 의례적인 수준에 머물지만 귀족들의 기억 속에서는 무게를 지닙니다."
 SWE_the_crown_and_totalforsvaret: "왕실과 총력 방위"
 SWE_the_crown_and_totalforsvaret_desc: "군주제는 스웨덴 총력 방위 개념에서 단결의 상징으로 기능합니다. 왕실 구성원의 존재는 사기, 인식, 국가 대비 태세에 대한 신뢰를 높입니다."
 SWE_royal_commander_in_symbol: "상징적 왕실 총사령관"
 SWE_royal_commander_in_symbol_desc: "작전 권한을 갖지 않으면서도 왕실은 단결의 지휘를 상징합니다. 공식적인 명예 계급은 국가, 방위, 전통 사이의 연결을 강화합니다."
 SWE_royal_presence_at_exercises: "훈련에 왕실 참석"
 SWE_royal_presence_at_exercises_desc: "왕실 구성원이 국가 및 동맹 군사 훈련에 참석하여 존중을 표하고 사기를 높이며 민간 통제를 구현합니다."
 SWE_support_for_veterans_and_families: "참전용사와 가족 지원"
 SWE_support_for_veterans_and_families_desc: "군주제는 참전용사, 부상병, 그 가족을 위한 구상을 지원하여 복무와 인정 사이의 신성한 유대를 확인합니다."
 SWE_honor_of_service: "복무의 영예"
 SWE_honor_of_service_desc: "왕실의 훈장, 의식, 서훈은 군사, 민간, 인도주의 분야의 헌신적 행위를 기립니다. 이러한 의례는 의무와 존엄이 여전히 중요함을 국가에 일깨웁니다."
 SWE_symbol_of_resilience: "회복력의 상징"
 SWE_symbol_of_resilience_desc: "역사의 폭풍 속에서도 스웨덴 왕실은 꺾이지 않고 굴하지 않으며 굳건히 버텨 왔습니다. 이 새로운 시련의 시대에 군주제는 다시 한번 국가의 닻이 되어, 어떤 도전에도 맞서도록 국민을 결집시키는 인내의 살아 있는 상징이 될 것입니다."
 SWE_anchor_of_the_nation: "국가의 닻"
 SWE_anchor_of_the_nation_desc: "제도가 흔들리고 이념이 충돌할 때에도 왕실은 흔들림이 없습니다. 왕실은 명령하지 않습니다. 이어 줍니다."
 SWE_pluralistic_society: "다원주의 사회"
 SWE_pluralistic_society_desc: "스웨덴의 힘은 다양한 목소리의 조화에 있습니다. 왕실의 인도 아래 다원주의를 받아들임으로써 획일성이 아니라 상호 존중과 공유된 목적을 통해 단결이 번성하는 국가를 만들겠습니다."
 SWE_revitalize_excavation: "굴착 산업 부흥"
 SWE_revitalize_excavation_desc: "베리슬라겐의 철광산에서 고틀란드의 채석장에 이르기까지, 스웨덴의 땅은 왕국의 원초적 힘을 품고 있습니다. 굴착 방식을 현대화하여 이러한 자원을 새롭게 개발함으로써 우리의 산업과 야망에 동력을 공급하겠습니다."
 SWE_revitalize_demographics: "인구 구조 활성화"
 SWE_revitalize_demographics_desc: "국가의 힘은 무기뿐 아니라 국민으로 가늠됩니다. 가족의 성장을 지원하고, 숙련 이민을 장려하며, 모두에게 기회를 보장함으로써 스웨덴은 앞으로 다가올 세대를 위한 활기차고 영속적인 인구를 확보할 것입니다."
 SWE_revitalize_agrarian_industrie: "농업 부흥"
 SWE_revitalize_agrarian_industrie_desc: "스웨덴의 비옥한 들판은 오랫동안 우리 번영의 토대였습니다. 농업 방식을 현대화하고 농촌 경제를 강화함으로써 우리의 농장이 다시 한번 국민을 먹여 살리고 커져 가는 야망을 뒷받침하도록 하겠습니다."
 SWE_form_royal_social_society: "왕립 사회 협회 설립"
 SWE_form_royal_social_society_desc: "왕실과 국민 사이의 단결을 증진하기 위해 문화 교류, 자선 활동, 군주제의 인도 아래 국민 연대 증진에 헌신하는 네트워크인 왕립 사회 협회를 설립하겠습니다."
 SWE_medial_royals: "왕실의 미디어 노출"
 SWE_medial_royals_desc: "현대 왕실은 전통과 가시성 사이에서 균형을 잡아야 합니다. 전략적인 미디어 노출은 왕실이 친근하고 사람들을 하나로 묶는 존재라는 역할을 높입니다."
 SWE_modernize_the_image: "왕실 이미지 현대화"
 SWE_modernize_the_image_desc: "복장, 메시지, 사회적 존재감은 진화해야 합니다. 현대적 군주제는 여전히 과거를 존중하지만 현재의 목소리로 말합니다."
 SWE_defender_of_tradition: "전통의 수호자"
 SWE_defender_of_tradition_desc: "왕실은 유산, 품격, 연속성이라는 스웨덴의 핵심 가치를 지킵니다. 이것은 보수주의가 아니라 문화적 관리입니다."
 SWE_royal_diplomacy: "왕실 외교"
 SWE_royal_diplomacy_desc: "왕실의 방문, 후원, 의례적 교류는 정부가 열 수 없는 곳에서도 외교의 문을 엽니다. 왕실은 조용히, 그러나 효과적으로 일합니다."
 SWE_royal_charity: "왕실 자선 활동"
 SWE_royal_charity_desc: "수백 개의 재단과 사업을 통해 왕실은 국민을 섬깁니다. 아동 복지에서 기후 행동에 이르기까지 그 영향력은 정치적이 아니라 도덕적입니다."
 SWE_form_kings_concil: "국왕 자문 위원회 설립"
 SWE_form_kings_concil_desc: "학자, 장교, 정치가로 구성된 의례적 자문 위원회는 군주에게 전략적 통찰을 제공하며 대화의 국가적 상징이 됩니다."
 SWE_expand_royal_guard: "왕실 근위대 확대"
 SWE_expand_royal_guard_desc: "왕실 근위대는 단순한 경호가 아니라 의례적 영예를 상징합니다. 그 확대는 군의 공적 생활에서 가시성, 규율, 전통을 높입니다."
 SWE_enhance_royal_protocol: "왕실 의전 강화"
 SWE_enhance_royal_protocol_desc: "의례적 의전은 국가 정체성과 소프트 파워를 강화합니다. 의식, 방문, 서훈을 강화하면 현대 통치에서 군주제의 위엄이 보존됩니다."
 SWE_the_crown_as_bridge: "가교로서의 왕실"
 SWE_the_crown_as_bridge_desc: "정당과 국민, 세대와 국가 사이에서 왕실은 가교입니다. 통치자도 통치자 대기자도 아닌 왕실은 스웨덴의 살아 있는 기억으로서 영속합니다."
 SWE_non_aligned_responsibility: "중립의 책임"
 SWE_non_aligned_responsibility_desc: "스웨덴의 역사적 중립은 수동성이 아니라 원칙에서 비롯되었습니다. 분열된 세계에서 우리는 독립적이고 신뢰할 수 있으며 사회적으로 회복력 있는 상태를 유지할 책임을 집니다. 제국이나 이념에 휘둘리지 않고, 안정, 평화, 복지가 구호가 아니라 의무인 우리 고유의 통치 모델 속에 굳건히 서 있습니다."
 SWE_neutrality_an_other_sweden: "또 다른 스웨덴"
 SWE_neutrality_an_other_sweden_desc: "스웨덴이 무엇이 될 수 있는지 다시 생각할 때입니다. 대서양 횡단의 압력에서 벗어나 중립을 수동적인 거리 두기가 아니라 제국주의적 동맹에 대한 의식적 대안으로 새롭게 구상해야 합니다."
 SWE_the_eastern_horizon: "동방의 지평선"
 SWE_the_eastern_horizon_desc: "스웨덴은 문명국이고 유럽에 있다는 이유만으로 NATO와 미국을 따라서는 안 됩니다. 우리는 시선을 세계로 돌려야 합니다."
 SWE_question_nato: "NATO의 가치 재고"
 SWE_question_nato_desc: "스웨덴의 전략 교리는 외국 동맹이 아니라 국익에 봉사해야 합니다. 공개 검토를 통해 NATO가 정말로 안보를 보장하는지, 아니면 주권을 제약하는지 판단할 것입니다."
 SWE_suspend_eu_defense_integration: "EU 방위 통합 중단"
 SWE_suspend_eu_defense_integration_desc: "독립적인 스웨덴 지휘 체계를 유지하기 위해 유럽 공동 방위 사업에 대한 참여를 중단합니다."
 SWE_suspend_eu_defense_integration_tt: "민족주의 지지율이 25 %를 초과하면 '탈퇴' 확률이 상승합니다."
 SWE_denounce_sanction_policy: "제재 정책 규탄"
 SWE_denounce_sanction_policy_desc: "스웨덴은 개방적 무역과 정치적 중립을 우선하여 신흥 강국을 겨냥한 서방의 경제 제재에 참여하지 않을 것입니다."
 SWE_join_the_belt_and_road_forum: "일대일로 포럼 가입"
 SWE_join_the_belt_and_road_forum_desc: "스웨덴은 중국의 일대일로 구상에 공식적으로 참여하여 새로운 세계 무역로의 북방 관문으로 자리매김할 것입니다."
 SWE_nordic_eurasian_dialogue: "북유럽-유라시아 대화"
 SWE_nordic_eurasian_dialogue_desc: "러시아 및 유라시아 파트너와의 협상은 스웨덴을 아시아와 잇는 장기적인 경제 및 수송 회랑의 기회를 열어 줄 것입니다."
 SWE_strategic_energy_pact_russia: "러시아와의 전략 에너지 협정"
 SWE_strategic_energy_pact_russia_desc: "장기 공급 계약은 스웨덴이 러시아 에너지를 확보하도록 보장하여 경제를 불안정한 서방 시장으로부터 보호할 것입니다."
 SWE_SCO_observer_status: "SCO 옵서버 지위"
 SWE_SCO_observer_status_desc: "스웨덴은 NATO를 대체할 안보 협력 방안을 모색하기 위해 상하이 협력 기구의 옵서버 지위를 획득할 것입니다."
 SWE_joint_exercises_with_russia: "러시아와 합동 훈련"
 SWE_joint_exercises_with_russia_desc: "러시아군과의 혹한기 전투 훈련은 스웨덴의 동계 전투 능력을 향상시킬 것입니다."
 SWE_PLA_saab_technology_exchange: "인민해방군-사브 기술 교류"
 SWE_PLA_saab_technology_exchange_desc: "양자 프로그램은 스웨덴의 항공우주 공학과 중국의 제조 역량을 결합하여 첨단 체계를 생산할 것입니다."
 SWE_join_brics_new_development_bank: "BRICS 신개발은행 가입"
 SWE_join_brics_new_development_bank_desc: "신개발은행(NDB) 회원국 지위는 서방 기관이 부과하는 정치적 조건 없이 스웨덴의 인프라 사업에 자금을 제공할 것입니다."
 SWE_eurasian_raj_link: "유라시아 철도 연결"
 SWE_eurasian_raj_link_desc: "러시아를 통과하는 직통 화물 회랑이 스웨덴을 동아시아 시장과 연결할 것입니다."
 SWE_Nordic_corean_minarl_pact: "북유럽-북한 광물 협정"
 SWE_Nordic_corean_minarl_pact_desc: "북한에는 희귀 광물이 풍부합니다. 식량, 의약품, 산업 장비를 대가로 은밀하게 선적을 주선하겠습니다."
 SWE_pyongyang_heavy_industry_exchange: "평양 중공업 교류"
 SWE_pyongyang_heavy_industry_exchange_desc: "공작 기계를 공급하는 대가로 특정 주문에 대한 중공업 제조 역량을 제공받아 양측을 모두 강화하겠습니다."
 SWE_neutrality_divtrine_revision: "중립 교리 개정"
 SWE_neutrality_divtrine_revision_desc: "스웨덴의 중립 교리를 갱신하여 비서방 강대국과의 적극적 관계를 우선시할 것입니다."
 SWE_information_partnership_with_RT: "RT와의 정보 파트너십"
 SWE_information_partnership_with_RT_desc: "러시아 투데이와의 미디어 협력 협정은 스웨덴이 자국의 관점을 세계에 제시할 수 있는 능력을 넓혀 줄 것입니다."
 SWE_eastern_cultural_exchange_program: "동방 문화 교류 프로그램"
 SWE_eastern_cultural_exchange_program_desc: "러시아, 중국, 인도와의 문화 협정은 상호 이해와 민간 교류를 증진할 것입니다."
 SWE_diplomatic_privot_global_south: "글로벌 사우스로의 외교적 전환"
 SWE_diplomatic_privot_global_south_desc: "무역과 정치적 관계는 아프리카, 라틴 아메리카, 아시아의 신흥 시장에 집중될 것입니다."
 SWE_petro_caribe_nordic_accord: "페트로카리베-북유럽 합의"
 SWE_petro_caribe_nordic_accord_desc: "카라카스에는 석유가 있고 서방 밖의 믿을 만한 파트너를 찾고 있습니다. 공학 기술과 정밀 제조품을 안정적인 원유 인도와 맞바꾸겠습니다."
 SWE_angola_offshore_cooperation: "앙골라 해상 유전 협력"
 SWE_angola_offshore_cooperation_desc: "앙골라의 유전과 스웨덴의 심해 기술은 서방 석유 메이저 밖에서 상호 이익을 확보할 것입니다."
 SWE_south_africa_strategic_metal_pact: "남아프리카 전략 금속 협정"
 SWE_south_africa_strategic_metal_pact_desc: "우리 산업을 위한 백금, 망간, 희토류의 장기 공급을 보장하겠습니다."
 SWE_cuban_medical_exchange: "쿠바 의료 교류"
 SWE_cuban_medical_exchange_desc: "쿠바의 의료 외교는 전설적입니다. 쿠바 전문가를 초청하여 우리의 공중 보건 인력을 훈련시킴으로써 호의와 역량을 쌓겠습니다."
 SWE_teheran_petrochemical_partnership: "테헤란 석유화학 파트너십"
 SWE_teheran_petrochemical_partnership_desc: "이란의 방대한 에너지 매장량과 화학 산업은 우리 경제를 뒷받침할 수 있습니다. 대체 결제 체계를 통해 서방의 금수 조치를 우회하겠습니다."
 SWE_iranian_drone_technologie_transfer: "이란 드론 기술 이전"
 SWE_iranian_drone_technologie_transfer_desc: "저비용 드론전에 대한 이란의 경험은 우리에게 교훈을 줍니다. 그들의 체계를 도입하고 개조하여 우리 군에 활용하겠습니다."
 SWE_energy_autarky_program_idea: "에너지 자급 프로그램"
 SWE_energy_autarky_program_idea_desc: "이 국가 구상은 국내 에너지 독립을 우선시합니다. 합성 연료 생산에 투자하고, 에너지원을 다변화하며, 장기 공급 계약을 확보함으로써 스웨덴은 외부 교란에 대한 취약성을 줄이고 전략적 자율성을 강화합니다."
 SWE_international_peace_institution: "국제 중재 기구"
 SWE_international_peace_institution_desc: "스웨덴은 다국적 중재 기구를 유치함으로써 국제 법규범의 중립적 보증인으로 자리매김했습니다. 이는 우리의 외교적 영향력을 강화하고, 국제 분쟁 해결에서의 신뢰도를 높이며, 다자 관계를 위한 새로운 채널을 열어 줍니다."
 SWE_royalist_revival: "베르나도트 왕정복고"
 SWE_royalist_revival_desc: "베르나도트 왕가는 스웨덴 사회와 통치에서 중심적 지위를 되찾아야 합니다. 전통과 단결을 통해 군주제가 국가의 토대로서 복귀하기 시작할 것입니다."
 SWE_monarch_constitution: "통치 기본법 개정"
 SWE_monarch_constitution_desc: "스웨덴의 헌법은 왕실의 진정한 뜻을 반영해야 합니다. 통치 기본법을 개정함으로써 군주제는 당파적 다툼 위로 올라서 명료함과 힘으로 이끌 것입니다."
 SWE_chamber_of_crown: "왕실 재무원"
 SWE_chamber_of_crown_desc: "왕실은 확대되는 재정 권한을 감독할 전담 기관이 필요합니다. 개편된 재무원을 통해 왕실의 우선순위가 왕국의 경제적 운명을 좌우할 것입니다."
 SWE_military_reform_act: "방위군 개혁법"
 SWE_military_reform_act_desc: "스웨덴 군대는 충성과 규율의 군대로 탈바꿈해야 합니다. 방위군(Försvarsmakten)을 재편함으로써 우리 군이 언제나 무엇보다 군주를 섬기도록 보장합니다."
 SWE_naval_program: "칼 16세 구스타프 해군 계획"
 SWE_naval_program_desc: "발트해를 다시 지배하려면 우리 함대가 새로워져야 합니다. 칼 16세 구스타프의 후원 아래 되살아난 해군이 스웨덴의 바다와 유산을 지킬 것입니다."
 SWE_northern_shield: "북방 방패 구상"
 SWE_northern_shield_desc: "광활한 북부가 외부의 영향에 노출되도록 방치해서는 안 됩니다. 국경을 요새화함으로써 왕국의 안보와 존엄을 모두 확보합니다."
 SWE_skane_defense: "스코네란드 방어선"
 SWE_skane_defense_desc: "스웨덴 남부, 특히 스코네, 할란드, 블레킹에는 유럽 대륙과 가까우므로 간과해서는 안 됩니다. 스코네란드를 요새화함으로써 왕실 방어와 문화적 자긍심의 남부 보루를 구축합니다."
 SWE_project_riksglans: "릭스글란스 프로젝트"
 SWE_project_riksglans_desc: "국민은 왕실의 영광을 돌과 장관 속에서 보아야 합니다. 국가 기념물과 왕실 의식은 국민을 군주와 결속시킬 것입니다."
 SWE_industrial_plan_svea: "스베아 산업 계획"
 SWE_industrial_plan_svea_desc: "스웨덴의 산업 성장은 단일한 비전에 따라 이끌어질 것입니다. 중앙 계획을 통해 자급자족하는 왕실 경제의 토대를 놓습니다."
 SWE_state_coordination_plan: "국가-경제 조율 계획"
 SWE_state_coordination_plan_desc: "번영하는 스웨덴은 군주를 충실히 섬겨야 합니다. 국가 산업은 왕실의 감독 아래 국가를 강화하도록 조율될 것입니다."
 SWE_livgardet: "근위 연대 복원"
 SWE_livgardet_desc: "근위 연대(Livgardet)가 다시 한번 국왕의 수호자로 설 것입니다. 이들의 복귀는 우리의 상무 정신과 왕실 주권의 부활을 알리는 신호가 될 것입니다."
 SWE_folkplikt: "국민 의무 선언"
 SWE_folkplikt_desc: "모든 시민은 국가와 군주에 대한 의무가 있습니다. 의무 복무는 단결, 회복력, 충성을 길러 낼 것입니다."
 SWE_mining_act: "베리슬라겐 광업법"
 SWE_mining_act_desc: "베리슬라겐의 풍부한 자원이 외국의 모리배에게 넘어가서는 안 됩니다. 왕실의 이름으로 이 자산을 국유화하고 보호하겠습니다."
 SWE_royal_council: "릭스 평의회 부활"
 SWE_royal_council_desc: "왕실 평의회는 왕실의 지혜와 명령의 기관으로 복원될 것입니다. 그 회의실에서 내려지는 결정은 국왕의 목소리로 울려 퍼질 것입니다."
 SWE_bofors_compact: "보포르스-MilDef 협약"
 SWE_bofors_compact_desc: "국가를 무장시키려면 군사적 수요와 산업 생산을 일치시켜야 합니다. 보포르스와 국가 공장 사이의 왕실 협약은 상시 즉응 태세를 보장할 것입니다."
 SWE_kungliga: "왕립 과학 위원회"
 SWE_kungliga_desc: "왕실이 스웨덴의 과학적 선도 지위를 되찾을 것입니다. 왕립 과학 위원회를 통해 혁신은 왕국의 미래에 봉사할 것입니다."
 SWE_kultur: "스웨덴 문화 각성"
 SWE_kultur_desc: "위대한 문화적 각성이 스웨덴 국민을 일깨울 것입니다. 왕실의 후원이 유산, 예술, 정체성의 르네상스를 이끌 것입니다."
 SWE_reign_without_rival: "적수 없는 통치"
 SWE_reign_without_rival_desc: "타협의 시대는 끝났습니다. 국왕은 의회나 대중 선동의 목소리에 도전받지 않고 홀로 통치할 것입니다."
 SWE_rikshalvan_reunited: "동부 왕국 영토 재통합"
 SWE_rikshalvan_reunited_desc: "핀란드는 오랫동안 우리 왕실 유산의 일부였습니다. 외교로든 필요에 의해서든, 우리의 동쪽 땅을 왕국으로 되돌리겠습니다."
 SWE_mannerheim_pact: "만네르헤임 인프라 협약"
 SWE_mannerheim_pact_desc: "투자 없이는 통합을 이룰 수 없습니다. 인프라와 개혁을 통해 핀란드는 완전한 재통합을 위한 준비를 갖추게 될 것입니다."
 SWE_mannerheim_pact_tt: "§Y이 중점의 효과는 [FIN.GetFlag][FIN.GetAdjectiveCap] 주를 통제할 때 표시됩니다§!"
 SWE_dominion_ostersjon: "외스터스왼 지배"
 SWE_dominion_ostersjon_desc: "영향력을 확보하려면 발트해를 지배해야 합니다. 그 해역을 통제하면 통상과 주권이 모두 보장됩니다."
 SWE_unification_baltiska: "발트 형제 민족 통합"
 SWE_unification_baltiska_desc: "발트 민족들은 수 세기의 역사로 우리와 묶여 있습니다. 이들을 스웨덴 왕실의 보호 아래 재결합시키겠습니다."
 SWE_kalmar_unification: "칼마르의 야망 부활"
 SWE_kalmar_unification_desc: "칼마르 동맹은 한때 단결을 통해 힘을 가져다주었습니다. 이제 스웨덴이 북유럽 세계의 지도자로서 마땅한 자리를 차지할 것입니다."
 SWE_post_kingdom_logistics: "왕국 확장 이후 물류망"
 SWE_post_kingdom_logistics_desc: "새로 얻은 영토를 현대화하면 이들을 우리의 전략적 비전에 묶어 둘 수 있습니다. 철도와 항만은 스웨덴의 경제적, 군사적 필요에 봉사할 것입니다."
 SWE_post_kingdom_logistics_tt: "이 중점의 효과는 다음 중 어느 곳의 주든 통제하면 표시됩니다:§Y \n[ICE.GetNameWithFlag] \n[NRY.GetNameWithFlag] \n[DEN.GetNameWithFlag] \n[EST.GetNameWithFlag] \n[LAT.GetNameWithFlag] \n[LIT.GetNameWithFlag]§!"
 SWE_eastern_marches: "동부 변경 복원"
 SWE_eastern_marches_desc: "잉그리아와 카렐리아는 모스크바 공국의 팽창으로부터 발트해를 지키는 스웨덴 왕국의 동쪽 보루였습니다. 이 땅을 왕실을 위해 되찾겠습니다."
 SWE_reclaim_swedish_pomerania: "스웨덴령 포메른 수복"
 SWE_reclaim_swedish_pomerania_desc: "스웨덴령 포메른과 비스마르 항은 한때 우리에게 독일 내 발판을 제공했습니다. 영유권을 되살려 남발트해 서쪽의 관문을 통제하겠습니다."
 SWE_german_shipyards: "포메른 조선소 부활"
 SWE_german_shipyards_desc: "스웨덴령 포메른과 비스마르의 조선소는 한때 발트해를 지배한 함선을 건조했습니다. 이 시설을 현대화함으로써 앞으로 수십 년간 우리의 해군 우위를 확보하겠습니다."
 SWE_dansk: "왕령 프로이센 수복"
 SWE_dansk_desc: "왕령 프로이센과 그단스크 항은 우리 제국의 최전성기 동안 우리의 영향권 아래 있었습니다. 이들의 복귀는 발트해 무역에 대한 우리의 지배를 확고히 할 것입니다."
 SWE_polish_grain: "곡물 장악"
 SWE_polish_grain_desc: "왕령 프로이센과 그단스크의 비옥한 평원은 오랫동안 발트해 세계에 곡물을 공급해 왔습니다. 우리 깃발 아래 곡물 무역을 복원함으로써 경제 성장과 전략적 식량 안보를 모두 확보합니다."
 SWE_eastern_timber: "동부 목재 및 광물 개발"
 SWE_eastern_timber_desc: "카렐리아와 잉그리아는 조선과 산업에 필수적인 목재, 타르, 광물이 풍부합니다. 이를 스웨덴의 관리 아래 두면 우리의 군사력과 경제가 함께 강화될 것입니다."
 SWE_colonial_court: "식민지 법원 규정"
 SWE_colonial_court_desc: "의례적 헌장이 해외에서의 스웨덴의 지속적 존재를 확인할 것입니다. 이 법은 우리의 식민지 유산에 정당성을 부여하는 데 쓰일 것입니다."
 SWE_saint_barthelemy: "구스타비아의 영광 복원"
 SWE_saint_barthelemy_desc: "생바르텔레미는 자유항으로서 황금기를 되찾을 것입니다. 그 부활은 우리의 해양 및 식민지 역사를 기릴 것입니다."
 SWE_carolusborg: "카롤루스보리의 유산"
 SWE_carolusborg_desc: "서아프리카에서의 우리 유산을 잊어서는 안 됩니다. 황금 해안에 투자함으로써 스웨덴 탐험의 기억을 되살립니다."
 SWE_fort_christina: "크리스티나 요새 수복"
 SWE_fort_christina_desc: "새로운 스웨덴은 이름만으로라도 다시 일어설 것입니다. 스웨덴의 인내를 상징하는 델라웨어 일대의 유산을 재건하겠습니다."
 SWE_nya_sverige: "뉘아 스베리예 서사"
 SWE_nya_sverige_desc: "이야기, 기념물, 외교를 통해 우리의 식민지 과거를 공유하겠습니다. 이 서사는 스웨덴의 세계적 이미지를 높일 것입니다."
 SWE_viking_legacy: "웁살라의 정신을 깨우라"
 SWE_viking_legacy_desc: "웁살라의 신성한 전통이 다시 한번 스웨덴 국민에게 영감을 줄 것입니다. 지난날처럼 우리는 선조들의 깃발 아래 결집합니다."
 SWE_conquest_denmark: "덴마크의 사슬을 끊어라"
 SWE_conquest_denmark_desc: "덴마크가 통치하는 섬과 영토는 한때 노르드 세계의 중요한 일부였습니다. 발트해를 지키는 보른홀름, 대서양으로 가는 길을 여는 페로 제도와 그린란드가 그렇습니다. 덴마크의 지배 사슬을 끊음으로써 이 땅을 왕실로 되돌리고 다시 한번 북방의 바다를 지휘하겠습니다."
 SWE_conquest_norway: "바이킹의 심장부 수복"
 SWE_conquest_norway_desc: "로포텐의 피오르에서 스발바르의 얼음 대지에 이르기까지, 노르웨이는 우리 항해 선조들의 요람이었습니다. 이 북쪽 해안을 스웨덴 왕실에 되돌림으로써 바이킹 시대가 태어난 바로 그 해역을 통제하겠습니다."
 SWE_bornholm_raid: "보른홀름 습격 기지"
 SWE_bornholm_raid_desc: "보른홀름은 우리의 발트해 습격 항구가 되어 적 선박에 대한 신속한 타격을 개시하고 제해권을 강화할 것입니다."
 SWE_longship_doctrine: "롱쉽 교리"
 SWE_longship_doctrine_desc: "롱쉽의 전술(신속한 접근, 급습, 신속한 철수)이 현대 상륙전에서 다시 태어날 것입니다."
 SWE_artic_training: "북극 습격대 훈련"
 SWE_artic_training_desc: "우리 특공대는 다른 이들이 주저할 얼어붙은 바다와 툰드라에서 타의 추종을 불허하는 기량으로 작전하며 북극전을 숙달할 것입니다."
 SWE_diaspora: "디아스포라 동원"
 SWE_diaspora_desc: "전 세계의 북유럽계 공동체가 우리의 부름에 응하여 함대에 자금을 대고 전사들의 대열을 불려 줄 것입니다."
 SWE_conquest_england: "앵글로색슨 해안 강습"
 SWE_conquest_england_desc: "노섬브리아에서 이스트앵글리아에 이르는 잉글랜드 동부 해안은 한때 데인로 치하에 있었습니다. 이 해안을 다시 공격함으로써 옛 노르드의 거점을 되찾아 우리의 세력권으로 되돌리겠습니다."
 SWE_conquest_ireland: "노르드 더블린 왕국 재건"
 SWE_conquest_ireland_desc: "더블린은 바이킹 상인들이 세웠으며 서쪽 바다에서 가장 부유한 노르드 도시 중 하나가 되었습니다. 이를 되찾아 북대서양의 상업과 해상 작전의 핵심 거점으로 복원하겠습니다."
 SWE_conquest_iceland: "아이슬란드를 품으로 되돌리라"
 SWE_conquest_iceland_desc: "천 년도 전에 노르드인이 정착한 아이슬란드는 그린란드와 빈란드로 뻗어 나간 바이킹 탐험의 심장이었습니다. 이를 다시 우리의 보호 아래 둠으로써 북대서양 영역의 쐐기돌을 복원하겠습니다."
 SWE_greenlandic_strongold: "그린란드 요새"
 SWE_greenlandic_strongold_desc: "붉은 에이리크에서 현대 스웨덴에 이르기까지, 그린란드는 북방의 파수꾼이었습니다. 이를 요새화하면 우리의 북극 패권이 굳건해질 것입니다."
 SWE_dublin_trade: "더블린 노르드 무역 거점"
 SWE_dublin_trade_desc: "노르드 정착민이 세운 더블린은 서쪽 바다에서 우리의 현대적 무역 거점이 되어 바이킹 세계를 다시 한번 연결할 것입니다."
 SWE_conquest_canada: "빈란드 수복"
 SWE_conquest_canada_desc: "천 년 전 우리 노르드 선조들은 대서양을 건너 빈란드라 부른 땅에 정착했습니다. 오늘 우리는 그들의 항적을 따라 뉴펀들랜드에서의 존재를 복원하고 신세계로의 바이킹 정신 귀환을 알릴 것입니다."
 SWE_riches_vinland: "빈란드의 부 수확"
 SWE_riches_vinland_desc: "사가는 빈란드의 비옥한 땅, 울창한 숲, 풍부한 바다를 이야기했습니다. 이제 우리의 깃발 아래 이 자원은 왕국을 위해 쓰일 것입니다. 함대를 위한 목재, 제련소를 위한 광물, 바다 건너 늘어나는 군대를 먹일 식량을 공급할 것입니다."
 Sweden.12.t: "2000년 국방 결정"
 Sweden.12.d: "오늘 우리는 군 교리의 미래를 논의하기 위해 의회를 소집했습니다. 우리는 수십 년간 침공 방어에 중점을 두어 왔지만 실질적인 위협이 없는 지금, 다른 곳에 자원과 자금을 쓸 수 있도록 군사 지출을 줄이는 것을 고려해야 할지도 모릅니다."
 Sweden.12.o1: "침공 전략을 준비하라"
 Sweden.12.o2: "작전 전략을 준비하라"
 Sweden.13.t: "2004년 국방 결정"
 Sweden.13.d: "우리는 다시 한번 군 교리의 미래를 논의하기 위해 의회를 소집했습니다. 현재의 위협 상황에 따라 어떤 길을 택할지 결정해야 합니다."
 Sweden.13.o1: "침공 전략"
 Sweden.13.o2: "작전 전략"
 Sweden.14.t: "2009년 국방 결정"
 Sweden.14.d: "작년의 국방법은 러시아의 조지아 침공으로 인해 연기되었습니다. 이제 그것이 끝났으니 자금을 재배치할지 결정할 수 있습니다."
 Sweden.14.o1: "징병제를 폐지하라"
 Sweden.14.o2: "군사 지출을 늘려라"
 Sweden.15.t: "2015년 국방 결정"
 Sweden.15.d: "오늘 우리는 군 교리의 미래를 논의하기 위해 의회를 소집했습니다. 스베르케르 예란손 장군은 한 인터뷰에서 스웨덴이 현재 지역 내 위협에 맞서 일주일밖에 스스로를 방어하지 못할 것이라고 말했습니다."
 Sweden.15.o1: "말도 안 된다! 우리는 괜찮다."
 Sweden.15.o2: "군사 지출을 늘려라"
 Sweden.16.t: "2020년 국방 결정"
 Sweden.16.d: "세계의 위협 상황이 고조되고 있어 우리에게는 두 가지 선택지가 있습니다. 침공 방어를 재건하는 데 자금을 투입해야 할까요, 아니면 어차피 괜찮을 것이라고 기도해야 할까요."
 Sweden.16.o1: "감당할 수 없다."
 Sweden.16.o2: "방위 개선에 자금을 투입하라"
 Sweden.17.t: "브라질에서 승리한 그리펜 E!"
 Sweden.17.d: "JAS 39E가 브라질의 F-X2 전투기 사업에서 승리했습니다. 이는 인도를 시작하면 우리 경제를 크게 끌어올리고 우리의 개발 속도도 빨라지게 할 것입니다."
 Sweden.17.o1: "좋은 소식이다!"
 Sweden.18.t: "브라질로 인도된 첫 그리펜 E"
 Sweden.18.d: "JAS 39E가 브라질의 F-X2 전투기 사업에서 승리했습니다. 이는 인도를 시작하면 우리 경제를 크게 끌어올리고 우리의 개발 속도도 빨라지게 할 것입니다. 이제 주문된 36대의 그리펜 중 첫 번째 기체가 브라질로 인도되었습니다."
 Sweden.18.o1: "훌륭한 협력이다!"
 Sweden.19.t: "스웨덴 잠수함, USS 로널드 레이건을 \\"격침\\""
 Sweden.19.d: "신규 건조된 62억 달러짜리 항공모함 USS 로널드 레이건이 스웨덴 잠수함에 추적당했습니다. 다행히 실제 전투에서 벌어진 일은 아니며, 모의 전쟁 훈련의 일환으로 이루어졌습니다. 다수의 대잠 호위함을 거느린 항모 기동부대가 1,600톤급의 소형 스웨덴 디젤 잠수함 HSwMS 고틀란드와 맞붙었습니다. 레이건을 향해 여러 차례 공격이 이루어졌음에도 고틀란드는 단 한 번도 탐지되지 않았습니다. 미 해군은 대잠 훈련을 실시하기 위해 고틀란드와 승조원을 2년간 임대해 줄 것을 요청했습니다. 이 결과로 미 해군은 자국의 수중 센서로는 은밀한 HSwMS 고틀란드에 대응할 수 없음을 확신하게 되었습니다."
 Sweden.19.o1: "스웨덴의 공학 기술을 과소평가해서는 안 됩니다"
 Sweden.20.t: "2021년 스웨덴 정부 위기"
 Sweden.20.d: "2021년 스웨덴에서는 릭스다그(의회)가 불신임 투표로 스테판 뢰벤 총리를 축출하면서 정부 위기가 시작되었습니다. 남은 문제는 그가 사임해야 하는지, 아니면 조기 총선을 선언해야 하는지입니다."
 Sweden.20.o1: "사임한다"
 Sweden.20.o2: "조기 총선을 요구한다"
 Sweden.20.o3: "흥... 이들은 분명 제정신이 아니다"
 Sweden.21.t: "2021년 스웨덴 정부 위기"
 Sweden.21.d: "2021년 스웨덴에서는 릭스다그(의회)가 불신임 투표로 스테판 뢰벤 총리를 축출하면서 정부 위기가 시작되었습니다. 남은 문제는 그가 사임해야 하는지, 아니면 조기 총선을 선언해야 하는지입니다."
 Sweden.21.o1: "그래서 우리가 왜 신경 써야 하지?"
 Sweden.21.o2: "맙소사"
 Sweden.22.t: "솅겐 지역에 가입하는 스웨덴"
 Sweden.22.d: "스웨덴이 마침내 솅겐 지역에 가입하여 EU 내 여행 시 여권을 사용할 필요가 없어졌습니다. 솅겐 지역은 상호 국경에서 모든 여권 검사와 기타 형태의 국경 통제를 공식적으로 폐지한 유럽 27개국으로 이루어진 지역입니다. 유럽 연합(EU)의 보다 광범위한 자유·안보·사법 정책 영역의 일부로서, 국제 여행 목적상 공통 비자 정책 아래 대체로 단일 관할권처럼 기능합니다. 이 지역의 이름은 1985년 솅겐 협정과 1990년 솅겐 협약에서 유래했으며, 두 문서 모두 룩셈부르크의 솅겐에서 서명되었습니다."
 Sweden.22.o1: "늦더라도 안 하는 것보다는 낫다"
 Sweden.23.t: "설립된 노르토그"
 Sweden.23.d: "노르토그(북부 열차)는 스웨덴의 노르보텐 주, 베스테르보텐 주, 베스테르노를란드 주, 옘틀란드 주가 공동으로 소유한 공기업입니다. 이 회사는 여객 열차를 소유하며 여객 열차 운행을 조직합니다. 노르토그는 승차권 판매를 관리하고, 실제 열차 운행(직원 및 허가)을 담당하는 운영사와 계약을 맺습니다. 열차는 노르토그라는 브랜드 이름으로 운행됩니다."
 Sweden.23.o1: "우리의 인프라가 한층 개선되었다"
 Sweden.24.t: "노벨상 100주년"
 Sweden.24.d: "노벨상이 100주년을 맞아 이전 수상자 161명이 기념 파티에 초대되었습니다. 노벨상은 알프레드 노벨의 1895년 유언에 따라 '전년도에 인류에 가장 큰 이익을 가져다준 이들'에게 수여되는 다섯 개의 별개 상입니다. 알프레드 노벨은 다이너마이트 발명으로 가장 유명한 스웨덴의 화학자이자 공학자, 실업가였습니다. 그는 1896년에 세상을 떠났습니다. 그는 유언에서 남은 환금 가능 자산 전부를 다섯 개의 상을 제정하는 데 사용하도록 유증했으며, 이것이 노벨상으로 알려지게 되었습니다. 노벨상은 1901년에 처음 수여되었습니다."
 Sweden.24.o1: "멋지군요!"
 Sweden.25.t: "링케뷔 살인 사건"
 Sweden.25.d: "링케뷔 살인 사건은 2002년 2월 26일, 19세의 라두 악시니아가 스웨덴 스톡홀름 지하철 링케뷔역에서 총격으로 사망하면서 발생했습니다. 2002년 10월 23일, 스톡홀름의 스베아 항소법원은 청년 네 명에게 공동으로 살인 유죄를 선고했습니다. 가장 어린 가해자 두 명은 각각 4년의 소년 구금형을 선고받았으며, 나머지 두 명인 형제 왼데르 일디즈(당시 20세)와 외즈칸 일디즈(24세)는 각각 징역 10년과 종신형을 선고받았습니다."
 Sweden.25.o1: "우려스러운 사태입니다..."
 Sweden.26.t: "베스테르말름스갈레리안 개장"
 Sweden.26.d: "베스테르말름스갈레리안은 스웨덴 스톡홀름 쿵스홀멘에 있는 쇼핑센터로, 2002년 8월 23일에 개장했습니다. 이 쇼핑센터는 상크트에릭스가탄과 플레밍가탄이 교차하는 지점의 프리드헴스플란 지하철역 근처, 도시 구획 '트로센'에 있는 1970년대 건물을 개조한 곳에 자리하고 있습니다. 베스테르말름스갈레리안이라는 이름은 쿵스홀멘 지구의 다른 이름인 베스테르말름에서 유래했습니다. 이 쇼핑센터는 쿵스홀멘 최초의 쇼핑센터로, 패션, 인테리어, 식품 매장을 갖추고 있습니다. 총면적은 10,000 m²이며 다양한 규모의 매장 45곳과 국제 소매 체인점이 입점해 있습니다."
 Sweden.26.o1: "나에게 세금이 더 들어온다!"
 Sweden.27.t: "살해당한 안나 린드(S)"
 Sweden.27.d: "2003년 9월 10일, 린드는 스웨덴의 유로 도입을 묻는 국민투표에 관한 그날 밤 TV 토론을 앞두고 스톡홀름 중심부의 노르디스카 콤파니에트 백화점 여성복 매장에서 쇼핑하던 중 가슴과 복부, 팔을 흉기에 찔렸습니다. 당시 그녀는 스웨덴 보안국 경호원의 보호를 받고 있지 않았으며, 이는 1986년 올로프 팔메 총리 살해 사건(현대 스웨덴 역사상 정부 구성원이 살해된 최초의 사건)과 린드 살해 사건이 유사하다는 점에서 논란이 되었습니다."
 Sweden.27.o1: "아, 안 돼"
 Sweden.27.o2: "누가 이런 짓을 했는지 반드시 찾아낼 것이다!"
 Sweden.28.t: "살인범을 찾아낸 경찰!"
 Sweden.28.d: "9월 16일 한 남성이 체포되어 '정당한 사유'(가장 낮은 단계의 혐의)로 용의자로 구금되었으나, 모든 혐의에서 풀려나 석방되었습니다. 9월 24일, 경찰은 용의자 미야일로 미야일로비치(세르비아계 부모 아래 스웨덴에서 출생)를 더 높은 단계의 혐의인 '상당한 이유'로 체포했다고 발표했습니다. 9월 25일, 미야일로비치의 DNA 프로필이 범행 현장(또는 그 부근)에 남겨진 야구 모자의 머리카락과 일치하며, 그가 린드가 습격당한 매장에서 촬영된 남성과 닮았다는 사실이 발표되었습니다. 모든 관련성을 부인하던 미야일로비치는 2004년 1월 6일 범행을 자백했고, 그의 변호인 페테르 알틴이 요청한 경찰의 추가 신문에서 9월 10일 사건의 전모를 진술했습니다. 그는 1월 14일부터 17일까지 열린 재판에서 유죄 판결을 받았습니다. 정신과 감정 후 3월 23일 종신형을 선고받았습니다. 7월 8일, 항소법원은 (살인 당시 그가 정신질환 상태였다는 검사 결과에 따라) 미야일로비치의 형을 파기했고, 미야일로비치는 보안 정신병동으로 이송되었습니다. 검찰은 스웨덴 대법원에 상고했으며, 대법원은 같은 해 12월 2일 그의 종신형을 복원했습니다. 미야일로비치는 스웨덴 국적을 포기했고, 세르비아로의 이송을 요청했으나 받아들여지지 않았습니다."
 Sweden.28.o1: "잡았다"
