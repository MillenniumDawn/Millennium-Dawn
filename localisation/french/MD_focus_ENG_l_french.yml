 ENG_naval_defense_act_1889_1: "Loi de défense navale de 1889"
 ENG_naval_defense_act_1889_1_desc: "Le Naval Defence Act 1889 était une loi du Parlement du Royaume-Uni. Il reçut la sanction royale le 31 mai 1889 et adopta formellement le standard des deux puissances, accroissant la force navale britannique. Ce standard exigeait que la Royal Navy maintienne un nombre de cuirassés au moins égal à la force combinée des deux marines suivantes dans le monde"
 ENG_naval_defense_act_1889_1_tt: "§RSera transformé en esprit national temporaire de deux ans, une fois que nous serons la puissance navale du continent§!"
 ENG_army_special_operations_brigade_idea: "Brigade d'opérations spéciales de l'armée"
 ENG_army_special_operations_brigade_idea_desc: "La brigade des opérations spéciales de l'armée du Royaume-Uni constitue une force d'élite hautement spécialisée au sein des forces britanniques. Composée de soldats expertement formés issus de diverses unités, elle est conçue pour des missions non conventionnelles et à hauts enjeux. Équipée d'armements avancés, d'un entraînement spécialisé et d'un engagement à la polyvalence, elle joue un rôle central face aux menaces complexes, dans les opérations de précision et dans la stratégie de défense nationale."
 ENG_allied_basing_efforts_Idea: "Efforts de base alliés"
 ENG_allied_basing_efforts_Idea_desc: "L'initiative Allied Basing Efforts propose une approche globale pour renforcer les infrastructures et les atouts stratégiques des nations membres de l'alliance. Ce programme couvre des améliorations essentielles des réseaux de transport, bases aériennes, ports et autres installations critiques. Le Royaume-Uni, contributeur majeur de l'alliance, reçoit une amélioration substantielle et durable de ses infrastructures, favorisant l'efficacité logistique et la préparation stratégique."
 ENG_royal_navy_Idea1: "Marine royale britannique"
 ENG_royal_navy_Idea1_desc: "La Royal Navy britannique est l'une des premières forces maritimes du monde, avec un héritage séculaire. Réputée pour son adaptabilité et sa maîtrise technologique, elle joue un rôle crucial dans la sauvegarde des intérêts maritimes du Royaume-Uni et la projection de puissance à l'échelle mondiale."
 ENG_royal_navy_Idea2: "Marine royale britannique"
 ENG_royal_navy_Idea2_desc: "La Royal Navy britannique est l'une des premières forces maritimes du monde, avec un héritage séculaire. Réputée pour son adaptabilité et sa maîtrise technologique, elle joue un rôle crucial dans la sauvegarde des intérêts maritimes du Royaume-Uni et la projection de puissance à l'échelle mondiale."
