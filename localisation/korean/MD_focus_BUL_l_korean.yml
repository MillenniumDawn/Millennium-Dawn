 bul_ACDI.1.t: "불가리아의 동맹 제안"
 bul_ACDI.1.d: "불가리아는 공동의 적을 분쇄하기 위한 동맹을 우리에게 제안하고 있습니다."
 bul_ACDI.1.a: "함께 싸우겠습니다."
 bul_ACDI.1.b: "미안하지만, 안된다"
 bul_ACDI.1.c: "다른 방식의 지원을 제안할 수 있습니다."
 bul_ACDI.2.t: "우리 제안을 수락한 그들"
 bul_ACDI.2.d: "그들이 우리의 조약에 합류할 것입니다."
 bul_ACDI.2.a: "환상적이군"
 bul_ACDI.3.t: "우리 조약 가입을 거부한 그들"
 bul_ACDI.3.d: "그들은 우리의 조약에 가입하여 함께 싸우기를 거부했습니다."
 bul_ACDI.3.a: "으억"
 bul_ACDI.4.t: "우리에 대한 지원 제공에 동의한 그들"
 bul_ACDI.4.d: "그들은 우리에게 지원을 제공하겠지만 우리 세력에는 가입하지 않을 것입니다."
 bul_ACDI.4.a: "고맙다"
 bulg.11.t: "러시아에 대한 우리의 입장"
 bulg.11.d: "러시아는 세계 지정학 무대에서 매우 기이한 입장을 취하고 있습니다. 그들과의 관계에 대해 우리는 어떤 입장을 취해야 하겠습니까?"
 bulg.11.a: "외교 사절단을 보내 안부를 전하자!"
 bulg.11.b: "우리는 그들과 상관이 없다."
 bulg.12.t: "지도권 문제"
 bulg.12.d: "우리가 불가리아에 우익 정부를 수립한 이후, 국내 일부 핵심 세력은 차르가 국가를 완전히 통제하기를 원하지 않습니다. 그들의 제안을 고려해야 하겠습니까?"
 bulg.12.a: "차르가 권력을 유지해야 한다!"
 bulg.12.b: "VMRO가 권력을 잡아야 한다!"
 bulg.12.c: "부흥당이 통치해야 한다!"
 BUL_FYR_friendship: "불가리아-마케도니아 우호 조약"
 BUL_us_military_in_bul: "불가리아 주둔 미군"
 BUL_us_military_in_bul_desc: "불가리아는 유럽에서의 지리적 위치 덕분에 미군 배치에 전략적으로 중요한 장소입니다. 불가리아가 자국 영토에 미군 배치를 허용한다면 지역 안보를 보장하는 데 도움이 될 것입니다. 불가리아에 미군이 주둔하면 자국에 대한 잠재적 위협이나 침략에 대한 억지력으로 작용할 것입니다. 또한 불가리아가 가입을 원하는 나토의 집단 안보를 강화하는 데에도 기여할 것입니다."
 BUL_novo_selo: "노보셀로 및 그라프 이그나티예보 공군 기지"
 BUL_novo_selo_desc: "유럽 발칸 지역에 위치한 불가리아는 미국의 노보셀로 및 그라프 이그나티예보 군사 공군 기지를 개방하는 방안을 진지하게 고려해야 합니다. 이 결정을 지지할 이유는 많습니다. 첫째, 이 공군 기지를 개방함으로써 불가리아는 미국과의 전략적 동반자 관계를 강화할 것입니다. 이 동반자 관계는 불가리아에 외부 위협으로부터 국가를 보호하는 데 도움이 되는 방어 및 안보상의 이점을 제공할 것입니다."
 BUL_befriend_greece_lib: "그리스와의 우호"
 BUL_befriend_greece_lib_desc: "최근 몇 년간 불가리아와 그리스의 군사 및 경제 분야 협력이 강화되었습니다. 양국은 합동 군사 훈련, 정보 공유, 국경 안보 등 다양한 사업에서 협력해 왔습니다. 불가리아와 그리스는 또한 발칸의 안정과 지역 위협의 억제에 공동의 이해관계를 가지고 있습니다."
 BUL_friendship_with_romania: "루마니아와의 협력"
 BUL_friendship_with_romania_desc: "불가리아와 루마니아는 수년간 군사와 경제 분야 모두에서 긴밀한 협력을 누려 왔습니다. 공유하는 역사와 지리를 바탕으로 양국은 안보를 강화하고 지역적 도전에 대처하기 위해 합동 군사 훈련과 전략적 동반자 관계에서 협력해 왔습니다. 양국은 또한 경제 성장을 개선하고 국경 간 투자와 무역을 늘리며 관광을 촉진하기 위한 협력 사업에도 참여해 왔습니다."
 BUL_generic_political_pression: "행정 개선"
 BUL_generic_political_pression_desc: "불가리아는 정부 기관의 효율성과 책임성을 높이는 것을 목표로 하는 행정 개혁을 거쳐야 합니다. 주된 목적은 공공 행정 체계를 현대화하고, 경제 성장과 외국인 투자를 저해해 온 관료주의를 줄이는 것입니다."
 BUL_liberty_ethos: "민주주의 불가리아"
 BUL_liberty_ethos_desc: "2000년은 수많은 정치적, 경제적, 사회적 도전에 직면한 불가리아 사회의 전환점이었습니다. 어려움에도 불구하고 민주주의 정신이 국가에 최선의 선택이었다는 점에는 의심의 여지가 없습니다. 민주주의는 시민들이 정부에 의견을 낼 기회와 의사 결정 과정에 참여할 기회를 제공합니다. 이는 주인 의식을 만들어 개인이 공동의 운명에 책임을 지도록 힘을 실어 줍니다. 또한 민주 사회는 개인의 권리와 자유를 매우 중시하며, 이는 개인과 사회의 발전에 결정적입니다."
 BUL_collectivist_ethos: "새로운 불가리아, 낡은 방식"
 BUL_collectivist_ethos_desc: "2000년은 불가리아 민주주의 체제 확립의 시작을 알렸습니다. 그러나 많은 사람은 이를 국가 역사상 최악의 정치 지도부로 봅니다. 그렇게 평가받는 주된 이유 중 하나는 정부가 나라를 괴롭히던 만연한 부패에 대응하지 못했다는 점입니다. 이러한 부정적 인식에 기여한 또 다른 요인은 진전과 경제 성장의 부재였습니다. 오히려 빈곤과 실업은 여전히 만연했고 생활 수준은 계속 하락했습니다. 정치적 불안정이 커진다는 인식도 있었으며, 이는 정부에 대한 국민의 신뢰와 믿음을 갉아먹었습니다."
 bulg.4.t: "불가리아의 군주제 쿠데타!"
 bulg.4.d: "불가리아는 과거 군주제의 상징을 되살린 군주제 쿠데타를 겪었습니다. 이 쿠데타는 공산주의 이전 시대의 헌법과 유사한 헌법을 복원하려던 불가리아 정치 지도부 내 한 파벌이 주도했습니다. 이 조치는 엇갈린 반응을 얻었는데, 일부는 불가리아를 권위주의로 이끌려는 시도로 보았고, 다른 이들은 군주제의 복원이 국가 정치에 안정을 가져오리라고 믿었습니다. 쿠데타는 성공했고, 새 헌법은 군주제를 의례적인 국가 원수로 규정했습니다. 불가리아 왕실은 국가의 정치·사회 생활에서 중요한 역할을 부여받았으며 오늘날까지 불가리아 사회에서 두드러진 위치를 유지하고 있습니다. 현 정부가 부패와 경제적 불안정에 시달리면서, 불가리아에서는 군주제 복원에 헌신하는 운동이 커지고 있습니다. 영향력 있는 정치인, 군 지도자, 그리고 구 왕실에 충성하는 이들로 이루어진 집단이 이끄는 이 운동은 국가에 안정과 번영을 가져올 입헌 군주제를 세우고자 합니다."
 bulg.4.a: "차르 만세!"
 bulg.5.t: "불가리아의 공산주의 복수전!"
 bulg.5.d: " 불가리아는 불가리아 사회당(BSP)이 권력을 잡은 공산주의 쿠데타를 겪었습니다. 이는 수년간의 민주적 개혁과 자유화를 거친 이후 국가에서 일어난 중대한 정치적 전환이었습니다. 많은 불가리아인에게 이는 그들이 어렵게 싸워 제거한 공산주의 체제로의 퇴보였습니다. BSP는 권리와 자유 운동당과의 연립 정부를 통해 권력을 잡을 수 있었습니다. 이 연립은 사실상 BSP에게 정부의 통제권을 주었고, 공산주의 시대를 연상시키는 정책을 시행할 수 있게 했습니다. 그들은 경제에 대한 국가 통제를 강화하고 민간 기업을 제한했으며 사회 정책에 대한 정부 지출을 늘렸습니다."
 bulg.5.a: "붉은 10월에 영광을!"
 bulg.6.t: "우리가 누구인지 선택하는 일..."
 bulg.6.d: "우리 왕국은 스스로를 무엇이라 선포해야 하겠습니까?"
 bulg.6.a: "대불가리아 차르국"
 bulg.6.b: "제4 불가리아 제국"
 bulg.6.c: "불가리아-비잔티움 제국"
 BUL_generic_moving_towards_neutrality: "중립을 향하여"
 BUL_generic_moving_towards_neutrality_desc: "불가리아는 동방 및 서방 블록과 좋은 관계를 유지하고 양측 갈등에서 최대한의 이익을 얻기 위해 중립적인 정치 환경으로 나아가야 합니다."
 BUL_generic_moving_towards_nothing_continue: "돌아갈 길은 없다"
 BUL_generic_moving_towards_nothing_continue_desc: "불가리아는 이미 정치적, 문명적 길을 선택했습니다. 우리는 이 길을 계속 걸으며 반동 세력이 우리나라에서 우위를 차지하는 것을 막아야 합니다!"
 BUL_european_ideals: "유럽의 이상"
 BUL_european_ideals_desc: "민주주의, 인권, 법치라는 가치를 받아들임으로써 불가리아는 자국의 정책을 EU의 기준에 맞추는 데 성공했습니다. EU 회원국이 되어 얻는 가장 큰 이점 중 하나는 경제 성장, 기반시설 투자, 교육과 보건 의료 같은 사회 프로그램에 필수적인 자금 지원 기회에 접근할 수 있다는 점입니다."
 BUL_genric_ccich_boz: "교육 개혁"
 BUL_genric_ccich_boz_desc: "최근 몇 년간 불가리아 사회민주당은 국가의 교육 체계를 개혁하기 위해 노력해 왔습니다. 이 정당의 목표는 양질의 교육에 대한 접근성을 높이고, 교사에게 더 많은 자원을 제공하며, 전체 교육과정을 개선하는 것입니다. 이러한 목표를 달성하기 위해 사회민주당은 학교에 대한 재정 지원 확대, 취약 계층 학생에 대한 지원 강화, 학급 규모 제한에 중점을 두어 왔습니다. 또한 학생들이 현대 노동 시장에 필수적인 기술을 개발하도록 돕는 새로운 프로그램도 도입했습니다."
 BUL_prorussian_prime_minister: "중립 총리"
 BUL_prorussian_minister_generic: "다극 총리"
 BUL_prorussian_minister_generic_desc: "외교 정책에서의 다극성이란 하나의 지배적 강대국에만 편승하지 않고 여러 국제 행위자와 관계를 맺는 국가의 태도를 가리킵니다. 불가리아에 다극 외교 정책을 가진 총리가 있다는 것은 여러 이유로 매우 유익할 수 있습니다. 첫째, 협력 관계를 다변화하여 더 안정적이고 안전한 외교 정책으로 이어질 수 있습니다. 또한 다양한 무역 상대국과의 경제적 유대를 강화하여 경제 성장과 일자리 창출을 늘릴 수 있습니다."
 BUL_befriend_russia: "러시아와 친선"
 BUL_befriend_russia_desc: "새로운 정치적 노선에도 불구하고 러시아와 모든 관계를 끊어서는 안 되며, 그들과의 우호를 추구해야 합니다."
 BUL_befriend_serbia: "세르비아와의 협력"
 BUL_befriend_serbia_desc: "세르비아는 이제 새로운 정치 의제를 가진 새로운 국가가 되었습니다. 우리는 이를 지지하지 않을 수 없습니다."
 BUL_bosnian_cooperation: "보스니아 조약 강화"
 BUL_bosnian_cooperation_desc: "나토에 대한 우리의 헌신을 보여 주는 표시로서, 보스니아와의 협력 관계를 연장해야 합니다."
 BUL_KFOR_base: "KFOR 배치"
 BUL_KFOR_base_desc: "KFOR는 유엔 안전보장이사회 결의 1244호에 따라 안전한 환경을 구축하고, 민족적 출신과 관계없이 모든 시민이 코소보 전역을 자유롭게 이동할 수 있도록 보장하는 데 중점을 둡니다."
 BUL_generic_simeon_prime_minister: "시메온 2세를 총리로"
 BUL_generic_simeon_prime_minister_desc: "To ensure a stable alliance we must appoint Simeon II as our prime-minister!"
 BUL_appeal_to_farmers: "농업 개혁"
 BUL_appeal_to_farmers_desc: "우리의 농업은 더 이로운 방향으로 개혁되어야 합니다."
 BUL_cult_of_past: "과거 숭배"
 BUL_cult_of_past_desc: "예상치 못한 사태 전개로, 새로 선출된 불가리아 민족주의 정부는 '과거'로 알려진 논란 많은 애국주의 숭배 집단에 대한 지지를 표명했습니다. 고대 트라키아인의 후손이라고 주장하는 이 집단은 극단주의적 신념과 폭력적 전술 때문에 오랫동안 주류 사회에서 배척당해 왔습니다. 그러나 이제 정부의 후원을 받게 되면서 '과거'는 대담해졌고, 구성원들의 행동은 점점 더 공격적으로 변하고 있습니다."
 bulg.7.t: "불가리아 정치"
 bulg.7.d: "2000년, 불가리아는 정치적인 풍경에서 중요한 변화를 겪고 있었습니다. 이 나라는 1990년대의 경제적, 정치적 혼란에서 여전히 회복 중이었고, 정부에 대한 국민들의 불만이 커져가고 있었습니다. 집권당인 불가리아 사회주의당(BSP)은 1995년부터 권력을 잡고 있었으나, 경제 관리와 부패 혐의로 비판을 받고 있었습니다. 이러한 상황 속에서 2000년 대선은 불가리아에 중요한 전환점이었습니다. 현직 대통령인 페타르 스토야노프는 독립 후보로 재선에 나섰고, 유럽 통합과 시장 경제 개혁을 계속하겠다고 약속했습니다. 그러나 그는 BSP의 후보인 게오르기 파르바노프와 격돌하게 되었고, 파르바노프는 사회주의 정책의 회복과 러시아와의 관계 강화를 약속했습니다. 결국 스토야노프는 가까운 차이로 승리하며 두 번째 임기를 시작했지만, 파르바노프의 강한 지지 세력은 정치적 기류의 변화를 시사했습니다."
 bulg.7.a: "흥미롭군"
 bulg.8.t: "누구를 지지할 것인가?"
 bulg.8.d: "불가리아의 좌익 및 우익 급진파가 불가리아 정치 엘리트의 친서방 노선에 반기를 들고 나섰습니다. 시위에서 누구에게 우선권을 주어야 하겠습니까?"
 bulg.8.a: "민족주의자들이 시위를 장악해야 한다!"
 bulg.8.b: "좌파가 주도권을 잡아야 한다!"
 bulg.9.t: "지방 선거"
 bulg.9.d: "급진파들의 대규모 운동에 따라 지방 선거에서 우파와 좌파 사이의 경쟁이 시작됩니다. 누가 지방 정부를 장악해야 하겠습니까?"
 bulg.9.a: "민족주의자들에게 전권을 주자!"
 bulg.9.b: "노동조합이 좌파 정당들을 대변해 로비해야 한다!"
 bulg.10.t: "의회 내 충돌"
 bulg.10.d: "의회에서 파벌 간 충돌이 벌어졌습니다. 좌익과 우익 활동가들이 의사당 주변에서 싸우고 있습니다. 경찰이 누구를 해산시켜야 하겠습니까?"
 bulg.10.a: "민족주의 쓰레기를 분쇄하라!"
 bulg.10.b: "붉게 사느니 죽는 편이 낫다!"
 bul_mech.7.t: "마케도니아에서의 친불가리아 선전 캠페인"
 bul_mech.7.d: "불가리아는 마케도니아가 동쪽 이웃 나라와 힘을 합치도록 설득하기 위해 마케도니아에서 선전 캠페인을 개시했습니다. 이 캠페인에는 마케도니아인들에게 '불가리아 형제들과 하나가 되자'고 호소하며 두 민족이 공통의 역사와 문화를 공유한다고 주장하는 광고판과 광고가 포함되었습니다. 그러나 많은 마케도니아인은 이 캠페인을 문화적 동화 시도로 보았고, 불가리아에 합류한다는 발상을 거부했습니다. 마케도니아의 민족주의자들은 불가리아가 자신들의 정체성과 언어를 지우려 한다고 비난하며 선전 캠페인에 저항하겠다고 다짐했습니다."
 bul_mech.7.a: "흥미롭군"
 bul_mech.8.t: "마케도니아에서의 친불가리아 시위"
 bul_mech.8.d: "최근 마케도니아에서는 이 나라가 불가리아에 합류할 가능성을 둘러싼 시위가 벌어지고 있습니다. 이 구상의 지지자들은 불가리아와의 긴밀한 관계가 더 큰 경제적 이익을 가져오고 마케도니아 시민의 생활 수준을 개선할 것이라고 주장합니다. 그러나 반대자들은 이 제안이 마케도니아의 주권과 민족 정체성을 훼손할 것이라고 믿습니다. 불가리아 합류에 반대하는 시위는 마케도니아의 알바니아계 공동체에서 특히 강하게 나타났으며, 이들은 불가리아의 통치 아래에서 자신들의 문화적, 정치적 권리가 축소될 것을 우려하고 있습니다. 한편 불가리아 관리들은 마케도니아를 병합하거나 흡수하려는 의도가 없다고 부인하며, 대신 양국 간 더 큰 협력과 통합을 제안했습니다."
 bul_mech.8.a: "흥미롭군"
 bul_mech.9.t: "반군에 무기 밀반입"
 bul_mech.9.d: "불가리아 정부가 마케도니아의 친불가리아 분리주의자들에게 무기를 밀반입했다는 보도가 있었습니다. 이는 국제 사회의 우려를 불러일으켰으며 이 지역에서 진행 중인 분쟁에 대한 불가리아 정부의 관여에 의문을 제기했습니다."
 bul_mech.9.a: "그들이 발견하지 못하기를 바라자."
 bul_mech.10.t: "불가리아-마케도니아 외교 회담!"
 bul_mech.10.d: "최근 몇 년간 불가리아와 북마케도니아의 관계는 크게 개선되었습니다. 이는 최근 양국 사이에 열린 우호적인 외교 회담으로 더욱 확인되었습니다. 회담은 불가리아 소피아에서 열렸으며 양국의 고위 관리들이 참석했습니다. 회담에서 관리들은 무역, 안보, 문화 협력을 포함한 다양한 사안을 논의했습니다."
 bul_mech.10.a: "흥미롭군"
 bul_mech.11.t: "불가리아의 제안"
 bul_mech.11.d: "불가리아는 자국 기업 부문의 투자를 우리 경제에 제공하겠다고 제안합니다. 이는 그들의 우리에 대한 영향력을 높일 수 있지만, 경제 침체를 극복하는 데 실제로 큰 도움이 될 것입니다."
 bul_mech.11.a: "물론이지!"
 bul_mech.11.b: "아니, 괜찮다"
 bul_mech.12.t: "마케도니아의 투자 희망"
 bul_mech.12.d: "마케도니아가 우리의 제안을 수락했습니다."
 bul_mech.12.a: "환상적이군"
 bul_mech.12.b: "다시 생각해 보니..."
 bul_mech.13.t: "마케도니아의 거절"
 bul_mech.13.d: "마케도니아가 우리의 제안을 거절했습니다."
 bul_mech.13.a: "안됐군."
 bul_mech.14.t: "반급진파 단속"
 bul_mech.14.d: "불가리아군과 마케도니아군은 급진적인 마케도니아 분리주의자들을 단속하기 위해 합동 작전을 개시했습니다. 작전은 성공을 거두었으며 극단주의 조직과 연관된 다수의 인물이 구금되었습니다. 이 조치는 양국이 극단주의 활동에 대처하고 지역 안정을 유지하려 노력하고 있음을 보여 줍니다. 문제의 극단주의 조직은 불가리아와 그리스의 일부를 포함하는 대마케도니아의 건설을 주장해 왔습니다. 이는 과거 양국 간 긴장을 불러일으켰고 폭력 사건을 부추겼습니다. 불가리아와 마케도니아는 협력함으로써 이러한 급진주의가 환영받지 못하며 용납되지 않을 것이라는 메시지를 보내고 있습니다."
 bul_mech.14.a: "흥미롭군"
 bul_mech.16.t: "우리의 의제..."
 bul_mech.16.d: "우리는 조만간 외교 회담을 열고자 합니다. 우리의 의제는 무엇이 되어야 하겠습니까?"
 bul_mech.16.a: "그들의 활동을 규탄하자!"
 bul_mech.16.b: "우리가 그들을 얼마나 사랑하는지 보여 주자(ㅋㅋ)"
 bul_mech.16.c: "그들에게 투자를 요청하자"
 bul_mech.16.a1: "언어 문제를 밀어붙이자."
 bul_mech.16.b2: "우호 조약을 추진하자."
 bul_mech.17.t: "국경 지대 군사 훈련"
 bul_mech.17.d: "우리는 불가리아-마케도니아 국경에서 군사 훈련을 실시하고자 합니다. 이웃 나라를 초청해야 하겠습니까?"
 bul_mech.17.a: "단독으로 훈련해야 한다."
 bul_mech.17.a1: "단독으로 훈련해야 한다."
 bul_mech.17.b: "그들을 초청하자!"
 bul_mech.17.b1: "그들을 초청하자!"
 bul_mech.18.t: "이웃 나라의 국경 지대 군사 훈련 초청"
 bul_mech.18.a: "동의한다!"
 bul_mech.18.b: "미안하지만, 안된다"
 bul_mech.19.t: "불가리아의 우호 협정 제안!"
 bul_mech.19.d: "불가리아가 마케도니아와 불가리아 사이의 우호 협정을 제안합니다."
 bul_mech.19.a: "물론이지"
 bul_mech.19.b: "미안하지만, 안된다"
 bul_mech.20.t: "마케도니아에서의 반불가리아 선전 캠페인"
 bul_mech.20.d: "불가리아는 마케도니아가 동쪽 이웃 나라와 힘을 합치도록 설득하기 위해 마케도니아에서 선전 캠페인을 개시했습니다. 이 캠페인에는 마케도니아인들에게 \\"불가리아 형제들과 하나가 되자\\"고 호소하며 두 민족이 공통의 역사와 문화를 공유한다고 주장하는 광고판과 광고가 포함되었습니다. 그러나 많은 마케도니아인은 이 캠페인을 문화적 동화 시도로 보았고, 불가리아에 합류한다는 발상을 거부했습니다. 마케도니아의 민족주의자들은 불가리아가 자신들의 정체성과 언어를 지우려 한다고 비난하며 선전 캠페인에 저항하겠다고 다짐했습니다."
 bul_mech.20.a: "흥미롭군"
 bul_mech.21.t: "마케도니아에서의 반불가리아 시위"
 bul_mech.21.d: "최근 마케도니아에서는 이 나라가 불가리아에 합류할 가능성을 둘러싼 시위가 벌어지고 있습니다. 이 구상의 지지자들은 불가리아와의 긴밀한 관계가 더 큰 경제적 이익을 가져오고 마케도니아 시민의 생활 수준을 개선할 것이라고 주장합니다. 그러나 반대자들은 이 제안이 마케도니아의 주권과 민족 정체성을 훼손할 것이라고 믿습니다. 불가리아 합류에 반대하는 시위는 마케도니아의 알바니아계 공동체에서 특히 강하게 나타났으며, 이들은 불가리아의 통치 아래에서 자신들의 문화적, 정치적 권리가 축소될 것을 우려하고 있습니다. 한편 불가리아 관리들은 마케도니아를 병합하거나 흡수하려는 의도가 없다고 부인하며, 대신 양국 간 더 큰 협력과 통합을 제안했습니다."
 bul_mech.21.a: "흥미롭군"
 BUL_demcrat_maced_resolv: "마케도니아와의 우호 조약"
 BUL_start_antibulgarian_propaganda: "반불가리아 선전 캠페인 §Y개시§!"
