 GER_start_V_Fall_nuclear_TT: "Poderemos usar §YArmas Nucleares§!."
 GER_increases_productivity_by_20: "Irá §GAumentar§! a Produtividade em §G20§!"
 GER_the_balanced_Army: "O Exército Equilibrado"
 GER_the_balanced_Army_desc: "Somente um exército equilibrado pode nos dar capacidade suficiente para enfrentar os desafios futuros."
 germany.45.t: "Krater von Wattenscheid"
 germany.45.d: "A cidade de Bochum é uma cidade histórica de mineração de carvão que, desde o declínio da indústria carvoeira, se transformou numa cidade vibrante e moderna, parte integrante da Região do Ruhr.\n\nNo entanto, lembranças desagradáveis do legado do carvão podem vir à tona, especialmente quando antigas minas subterrâneas de carvão desabam de repente, revelando crateras destrutivas de grande porte. Um desses eventos aconteceu em 2 de janeiro de 2000, em Bochum-Höntrop."
 germany.45.a: "A cidade pode lidar com isso."
 germany.45.b: "Uma boa hora para uma legislação de segurança industrial!"
 germany.47.t: "EXPO 2000 'Welcome to the World of Tomorrow!'"
 germany.47.d: "The EXPO 2000 in Hanover marked a historic moment as the first World's Fair ever held in Germany. Officially opened by Chancellor Gerhard Schröder and ceremonially inaugurated by President Johannes Rau, the event began with great fanfare. In his speech, Schröder highlighted the significance of global cooperation, stating, 'Here, in Hanover, we are building bridges to the future. Together, we can address the challenges of tomorrow.' President Rau further emphasized the importance of responsibility, proclaiming, 'Our future lies in the balance of nature and technology, and it is here that we decide how we will live in harmony with our world.' Under the theme 'Man, Nature, and Technology,' EXPO 2000 brought together over 190 countries, showcasing pavilions from every corner of the globe. The event explored solutions to pressing environmental issues, breakthroughs in science and technology, and the rich cultural diversity of humanity. Visitors experienced innovative ideas on sustainable development, from renewable energy and eco-friendly technologies to concepts of urban living in the 21st century. With its focus on inspiring global cooperation and a sustainable future, EXPO 2000 aimed to be a turning point for international dialogue on how humanity could thrive in balance with the planet."
 germany.47.a: "we should visit, too"
 germany.90.t: "Nossas Dívidas Finalmente Foram Quitadas"
 germany.90.d: "Nossa nação vem pagando sua dívida aos vizinhos e agora aliados pelos danos que causamos durante a 1ª e a 2ª Guerras Mundiais.\nHoje marcamos finalmente o fim de uma era e o início de uma nova Alemanha. Estamos finalmente livres das amarras do passado e podemos seguir em frente!"
 germany.90.a: "Livres, Finalmente.."
 germany.91.t: "Relatório do BfV 2000"
 germany.91.d: "O Bundesamt für Verfassungsschutz (BfV) é o escritório federal para a proteção da constituição.\nEsta agência garante a segurança interna de nossos cidadãos contra ameaças e influências internas.\nGarantir que este departamento seja bem financiado é prioridade máxima se quisermos manter esses neonazistas e terroristas islâmicos afastados do nosso país; deixar de fazê-lo pode resultar em colapso democrático e agitação civil!\nDesde que monitoremos de perto os níveis de financiamento do departamento e as ameaças à segurança interna, combateremos as ameaças com eficácia."
 germany.91.a: "Entendido"
 germany.200.t: "A Alemanha Exige Reparações de Guerra!"
 germany.200.d: "[GER.GetName] exigiu que nós, [ROOT.GetName], paguemos reparações de guerra ao seu estado. Isso é, francamente, ridículo e infantil, mas, como a Alemanha está à beira de iniciar outro conflito em larga escala na Europa, é melhor apaziguá-la.."
 germany.200.a: "Simplesmente pague essas malditas reparações"
 germany.200.b: "Apaziguamento? Com a Alemanha? Está maluco? Do que diabos você está falando"
 germany.201.t: "[FROM.GetName] Passa o Dinheiro"
 germany.201.d: "Parece que assustamos bastante [FROM.GetNameWithFlag], na verdade, o suficiente para que nos pagassem reparações. Hoje será uma ocasião de celebração e alegria, pois poderemos direcionar os fundos recém-obtidos ao poderio da nossa nação!"
 germany.201.a: "Ótimo"
 germany.202.t: "[FROM.GetName] Ignora Nosso Pedido!"
 germany.202.d: "Aqueles imbecis de [FROM.GetNameWithFlag] decidiram simplesmente ignorar nosso último pedido. Isso não será esquecido, e logo eles se arrependerão de suas ações."
 germany.202.a: "Não esqueceremos isso!"
 germany.203.t: "Migrantes Turcos"
 germany.203.d: "Ultimamente tem chegado um número considerável de migrantes turcos à Alemanha. Isso provocou uma forte reação entre os elementos mais nacionalistas da nossa nação e gerou muito debate no cenário político. Hoje recebemos informações de que um grande grupo de migrantes turcos planeja seguir para a Alemanha Oriental e se estabelecer lá de vez. Devemos decidir como tudo isso vai prosseguir."
 germany.203.a: "Deixe-os vir, nossas portas estão abertas"
 germany.203.b: "O quê? Não. E vamos iniciar deportações para mandar um recado!"
 germany.204.t: "A Questão das Drogas"
 germany.204.d: "Recentemente as pessoas têm debatido se devemos legalizar as drogas ou criminalizá-las. Atualmente, as leis estão numa área um tanto cinzenta, podendo ser interpretadas de ambas as formas. Temos a capacidade de proibi-las completamente ou de legalizá-las por completo."
 germany.204.a: "Legalizá-las"
 germany.204.b: "Não, proibição total de todas as drogas"
 germany.205.t: "[GER.GetName] Oferece Pacto Defensivo"
 germany.205.d: "[GER.GetName] nos ofereceu um pacto defensivo e está disposta a nos ajudar em tempos de guerra, mas, ao aceitar esse pacto, concordamos em fazer o mesmo."
 germany.205.a: "Certo"
 germany.205.b: "Não, obrigado"
 germany.206.t: "[FROM.GetName] aceita nossa oferta!"
 germany.206.d: "[FROM.GetName] aceitou nossa oferta de entrar em um pacto defensivo, e concordamos em socorrer um ao outro em tempos de necessidade."
 germany.206.a: "Ótimo"
 germany.207.t: "[FROM.GetName] rejeitou nossa oferta"
 germany.207.d: "Os [FROM.GetAdjective] rejeitaram nosso pedido de pacto defensivo, e isso levou a uma deterioração de nossas relações.."
 germany.207.a: "Droga"
 germany.208.t: "Santuário para a Comunidade LGBT?"
 germany.208.d: "Muitas pessoas estão fugindo de seus países de origem para vir à Alemanha buscar refúgio de seus governos opressivos, que proíbem crenças LGBT. Elas vêm principalmente de países do Oriente Médio e hoje recebemos relatos de que chegou um grande grupo de refugiados com conhecimento médico. Eles se oferecem para trabalhar para nós a preços muito baixos em troca de poderem ficar.."
 germany.208.a: "Não"
 germany.208.b: "Por que não?"
 germany.209.t: "A questão das circuncisões"
 germany.209.d: "Muitos e muitos debates têm surgido sobre as circuncisões. Muitos em nosso partido pedem a proibição das circuncisões até que o indivíduo atinja a idade adulta, enquanto outros sugerem que não tentemos mudar isso."
 germany.209.a: "Estou convencido, vá em frente e proíba as circuncisões por ora"
 germany.209.b: "Do que diabos você está falando? Saia do meu gabinete."
 germany.210.t: "Vendas de Armas dos EUA"
 germany.210.d: "Estamos conversando com a América sobre possíveis vendas de armas, e temos algumas opções do que podemos comprar.."
 germany.210.a: "Compraremos... Aeronaves"
 germany.210.b: "Compraremos... Equipamento de infantaria"
 germany.211.t: "[GER.GetName] exige que deixemos a OTAN"
 germany.211.d: "[GER.GetName] exigiu que deixemos a OTAN e nos libertemos do 'Imperialismo Americano'. Ironicamente, porém, os próprios alemães estão criando uma nova aliança destinada a rivalizar com a OTAN e a CSTO."
 germany.211.a: "É um bom conselho.."
 germany.211.b: "Pff, não"
 germany.2111.t: "[FROM.GetName] Atende ao Nosso Pedido"
 germany.2111.d: "[FROM.GetName] concordou em sair da OTAN em nome da paz e, em breve, se livrará completamente de qualquer influência americana."
 germany.2111.a: "Ótimo"
 germany.2112.t: "[FROM.GetName] Se Recusa a Atender!"
 germany.2112.d: "[FROM.GetName] se recusou a sair da OTAN, mas em breve pagará o preço."
 germany.2112.a: "Vamos nos lembrar disso"
 germany.212.t: "[GER.GetName] pede nossa ajuda para combater a Rússia"
 germany.212.d: "Os [GER.GetAdjective] pediram que os ajudemos a combater a Rússia. Querem que ataquemos ao mesmo tempo para pegá-los de surpresa e para maximizar o dano que podemos causar."
 germany.212.a: "Boa ideia"
 germany.212.b: "Não"
 germany.213.t: "[FROM.GetName] Concorda em Combater a Rússia"
 germany.213.d: "Os [FROM.GetAdjective] concordaram em nos ajudar a lutar contra os russos, marcando nossa nova aliança e amizade eterna.."
 germany.213.a: "Ótimo"
 germany.214.t: "[FROM.GetName] se recusa a nos ajudar a combater a Rússia!"
 germany.214.d: "Parece que [FROM.GetName] se recusou a nos ajudar a lutar contra a Rússia e, infelizmente, talvez tenhamos que matar 2 coelhos com uma cajadada só.."
 germany.214.a: "Eles pediram por isso"
 germany.215.t: "[GER.GetName] Pede Nossa Ajuda para Combater os EUA"
 germany.215.d: "Os [GER.GetAdjective] pediram que os ajudemos a combater os EUA. Querem que ataquemos ao mesmo tempo para pegá-los de surpresa e para maximizar o dano que podemos causar."
 germany.215.a: "Boa ideia"
 germany.215.b: "Não"
 germany.216.t: "[FROM.GetName] concorda em combater os EUA"
 germany.216.d: "Os [FROM.GetAdjective] concordaram em nos ajudar a lutar contra os americanos, marcando nossa nova aliança e amizade eterna.."
 germany.216.a: "Ótimo"
 germany.217.t: "[FROM.GetName] Se Recusa a nos Ajudar a Combater os EUA!"
 germany.217.d: "Parece que [FROM.GetName] se recusou a nos ajudar a lutar contra os EUA e, infelizmente, talvez tenhamos que matar 2 coelhos com uma cajadada só.."
 germany.217.a: "Eles pediram por isso"
 germany.218.t: "Nosso Novo Império"
 germany.218.d: "Hoje marca um dia extraordinário na história alemã.\nChegou finalmente o dia de proclamarmos nosso grande trono e coroarmos nosso império novamente!\nHá apenas um problema: o povo e o governo não conseguem decidir qual será o novo título imperial do nosso país?"
 germany.218.a: "Seremos... O Império Alemão"
 germany.218.b: "Seremos... O Sagrado Império Alemão"
 germany.218.c: "Seremos... O Sacro Império Romano"
 germany.218.d1: "Alemanha será suficiente"
 germany.219.t: "Aliança com a Rússia?"
 germany.219.d: "Diferentes facções e elementos radicais do nosso partido têm debatido e discutido se devemos ou não entrar em um pacto defensivo com a Rússia. Os esquerdistas mais radicais argumentam que sim, devemos nos unir à Rússia, enquanto outros dizem que não podemos confiar nos russos."
 germany.219.a: "Fazer um pedido de adesão à CSTO"
 germany.219.b: "Vamos apenas firmar um pacto verbal.."
 germany.219.c: "Estamos melhor sozinhos"
 germany.220.t: "[GER.GetName] Pede que Revoguemos as Bases Americanas"
 germany.220.d: "O governo de [GER.GetName] pediu que revoguemos as bases militares americanas em nossa nação. Alegam que isso ajudará a persuadir o mundo rumo a uma direção mais 'pacífica' e nos ajudará a manter nossa independência."
 germany.220.a: "Bem, eles não estão errados"
 germany.220.b: "De jeito nenhum"
 germany.221.t: "[FROM.GetName] Atende!"
 germany.221.d: "[FROM.GetName] concordou em revogar as bases americanas de sua nação, permitindo que espalhemos nossa influência rumo ao Leste."
 germany.221.a: "Bom.."
 germany.222.t: "[FROM.GetName] Se Recusa a Atender"
 germany.222.d: "[FROM.GetName] se recusou a atender nosso pedido, mostrando que são meros fantoches dos americanos."
 germany.222.a: "Lamentável"
 germany.223.t: "Um Convite para a União"
 germany.223.d: "[GER.GetName] nos convidou a aderir à sua união socialista. Isso ocorre quando a crescente pressão de elementos socialistas em nossa nação levou nosso governo ao limite, forçando-nos a encontrar uma solução rápida. Se quisermos o melhor para o nosso povo e sua segurança, teremos que ceder.."
 germany.223.a: "No fim das contas, é o melhor"
 germany.223.b: "De jeito nenhum"
 germany.224.t: "[FROM.GetName] Aceita Nosso Convite!"
 germany.224.d: "[FROM.GetName] aceitou nossa oferta de aderir à nossa nova União, e esperamos muitos séculos de cooperação com eles!"
 germany.224.a: "Ótimo"
 germany.225.t: "[FROM.GetName] Rejeita Nossa Proposta!"
 germany.225.d: "Aqueles malditos lunáticos [FROM.GetAdjective] decidiram que estão melhor sozinhos! Teremos que mostrar a eles que isso não vai funcionar em nossa nova ordem europeia."
 germany.225.a: "Eles Pagarão o Preço"
 germany.226.t: "Amigos nos Lugares 'Certos'"
 germany.226.d: "Nosso partido tem conexões no mundo todo, mas temos laços particularmente estreitos com o partido £CRO_nationalist_right_wing_populist Hrvatska stranka prava (HSP) na Croácia. Agora temos orçamento e capacidade de influenciar diretamente a política deles, fortalecendo nossos amigos."
 germany.226.a: "Um pouco de apoio será suficiente"
 germany.226.b: "Apoio moderado será bom"
 germany.226.c: "Será necessário muito apoio"
 germany.227.t: "[GER.GetName] Quer Arranjar um Acordo"
 germany.227.d: "[GER.GetName], com seu novo governo, veio nos pedir ajuda para conduzir uma operação contra [ISR.GetName]. Pedem que nos juntemos a eles em seus esforços para atacar e isolar o estado, exigindo que mobilizemos nossas forças armadas."
 germany.227.a: "Sim, isso deve ser feito!"
 germany.227.b: "Não"
 germany.228.t: "[FROM.GetName] Concorda!"
 germany.228.d: "[FROM.GetName] concordou em nos ajudar a lidar com o estado falso! Nossos exércitos começarão a criar uma estrutura temporária que nos permitirá nos comunicar de forma eficaz nesse meio-tempo."
 germany.228.a: "Estamos um passo mais perto"
 germany.229.t: "[FROM.GetName] Rejeita!"
 germany.229.d: "[FROM.GetName] rejeitou nossas ofertas, ignorando-as completamente! Parece que são aliados de [ISR.GetName] ou estão contra nós."
 germany.229.a: "Eles vão se arrepender disso!"
 germany.230.t: "[GER.GetName] Exige Nossas Ilhas no Sudeste Asiático!"
 germany.230.d: "[GER.GetName] exigiu que cedamos todas as nossas ilhas no Sudeste Asiático. Prometem não violar a integridade territorial americana se lhes dermos o controle das ilhas, pois afirmam que tratarão as ilhas com mais 'humanidade'."
 germany.230.a: "De jeito nenhum!"
 germany.230.b: "Se isso acalmar os alemães..."
 germany.231.t: "[USA.GetName] Entrega as Ilhas!"
 germany.231.d: "[USA.GetName] decidiu que é do seu interesse entregar as Ilhas no Sudeste Asiático. Isso nos permite expandir a influência da nossa nação e certamente nos permitirá estacionar nossa marinha em regiões estratégicas.."
 germany.231.a: "Bom.."
 germany.232.t: "[USA.GetName] Esnoba Nosso Pedido!"
 germany.232.d: "[USA.GetName] decidiu ignorar completamente nosso pedido, com alguns de seus políticos até zombando dele no congresso.."
 germany.232.a: "Lamentável"
 germany.232.b: "Explorar os debates!"
 germany.233.t: "Inspeção Revela Falhas na Bundeswehr"
 germany.233.d: "Após uma série de inspeções iniciadas no início deste ano, os dados mostram que a Bundeswehr está começando a ficar para trás em relação a outras forças armadas convencionais. Os maiores problemas que afligem a Bundeswehr foram registrados e foi elaborado um plano abrangente para reformarmos a força."
 germany.233.a: "Mãos à obra"
 germany.234.t: "A República em Apuros"
 germany.234.d: "Depois que um dos departamentos do BfV foi desativado, elementos radicais do país têm agido à solta. O caos é generalizado e a anarquia se tornou o novo normal. Muitos dizem que a República está morrendo, e podem não estar errados."
 germany.234.a: "O que fizemos?"
 germany.235.t: "A Morte da República"
 germany.235.d: "Autoridades da Bundeswehr anunciaram hoje que várias divisões sob seu comando desertaram para se juntar a um governo interino estabelecido por elementos radicais da nação. Elas começaram a bombardear importantes instituições governamentais, e muitos chamam hoje de o último dia da República Alemã.."
 germany.235.a: "Die Republik Ist Tot"
 germany.236.t: "O Destino da Alemanha"
 germany.236.d: "Hoje é o dia em que o governo interino decide sobre o partido governante da Alemanha. Podemos nomear o NPD de extrema-direita, a antiga Monarquia ou Die Linke, os esquerdistas radicais."
 germany.236.a: "O Kaiser retornará"
 germany.236.b: "O NPD assumirá o comando"
 germany.236.c: "Die Linke será eleita"
 germany.237.t: "Estado Alemão Hostil"
 germany.237.d: "O Estado Alemão deixou de ser um Estado pacífico e voltado à Europa para se tornar, mais uma vez, um Estado louco e belicista. Infelizmente, a história se repetiu, e devemos ficar atentos à crescente influência alemã em nossa nação para evitar o colapso do nosso governo."
 germany.237.a: "Droga"
 germany.2343.t: "Reformas da Bundeswehr Bem-Sucedidas"
 germany.2343.d: "Tivemos sucesso na reforma da Bundeswehr. O desastre foi evitado, e nossas forças podem confiar em sua capacidade de proteger as fronteiras de [GER.GetName]!"
 germany.2343.a: "Ótimo"
 germany.238.t: "Departamento Corre Risco de Colapso"
 germany.238.d: "Um ou mais de nossos departamentos críticos chegaram a 10/50 em seu nível de status. Isso significa que, mais cedo ou mais tarde, se não aumentarmos o financiamento, o departamento desmoronará. Se o departamento desmoronar, nossa democracia será derrubada e partidos políticos radicais ficarão livres para fazer o que quiserem."
 germany.238.a: "Ainda podemos virar esse jogo!"
 germany.240.t: "A Alemanha nos Convida para o Bloco Imperial"
 germany.240.d: "O governo alemão nos convidou a aderir à sua recém-formada aliança, o Bloco Imperial. Ela pretende rivalizar com outras alianças ativas ao redor do globo e amplificar a voz de nossas nações."
 germany.240.a: "Com certeza"
 germany.240.b: "Não"
 germany.242.t: "[FROM.GetName] Rejeitou Nossa Proposta!"
 germany.242.d: "[FROM.GetName] rejeitou nossa oferta e desrespeitou o próprio fundamento de nossa aliança!"
 germany.242.a: "Droga"
 germany.369.t: "Informação Importante!"
 germany.369.d: "Com o conteúdo retrabalhado da Alemanha, muitas mecânicas novas foram introduzidas, incluindo, entre outras, a mecânica do BfV (Bundesamt für Verfassungsschutz), a mecânica do nacionalismo bávaro e a mecânica da divisão Leste e Oeste. Embora as duas últimas sejam sistemas bastante diretos, os jogadores podem acabar confusos com o sistema do BfV e como ele funciona.\nEntão, como funciona?\n\n Você encontra o botão do BfV no canto inferior direito da tela, logo acima do Registro; o BfV permitirá que você controle se quer ou não jogar com partidos radicais. Em termos simples, se você tiver financiamento alto nos 3 departamentos, será uma democracia sem problemas, pois os partidos estarão todos sob controle. Deixar o financiamento em nível médio manterá o status quo. Mas, se tiver financiamento muito baixo, o departamento começará a perder pontos de status e acabará desmoronando, levando a uma guerra civil (se você não intervier). Especificamente, se o Departamento 2 ou 5 cair, uma guerra civil estará em curso. Se o Departamento 6 cair, haverá outras consequências. Mas, quando a guerra civil acontecer, você precisará vencê-la e então poderá jogar com qualquer um dos 3 partidos radicais disponíveis.\n\nEsperamos que você aproveite,\n - A Equipe de Retrabalho Alemão do Millennium Dawn."
 germany.369.a: "Certo"
 germany.400.t: "Nosso Envolvimento na Guerra ao Terror"
 germany.400.d: "Recentemente concordamos em ajudar nossos amigos americanos em sua guerra contra o terror. Poderemos desdobrar uma certa quantidade de tropas para manter a paz e ajudar em missões de combate menores. Mas a questão é: quantos homens queremos colocar no campo de batalha?"
 germany.400.a: "500 Homens"
 germany.400.b: "1000 Homens"
 germany.400.c: "2000 Homens"
 germany.400.d1: "4000 Homens"
 germany.4011.t: "Missão de Ataque Aéreo Bem-Sucedida"
 germany.4011.d: "Nossa Força Aérea teve sucesso ao realizar uma missão de ataque aéreo contra vários alvos em todo o [AFG.GetFlag] Afeganistão."
 germany.4011.a: "Bom trabalho, agora de volta ao trabalho!"
 germany.4021.t: "Missão de Ataque Aéreo Malsucedida"
 germany.4021.d: "Nossa Força Aérea não conseguiu realizar uma missão de ataque aéreo adequada contra vários alvos em todo o Afeganistão. Como resultado de nossas falhas, perdemos o apoio de muitos moradores locais. Além disso, temos relatos de que uma de nossas aeronaves envolvidas na missão foi abatida."
 germany.4021.a: "Droga"
 germany.403.t: "Operação Bem-Sucedida"
 germany.403.d: "Nossas forças realizaram com sucesso uma missão contra vários alvos terroristas no [AFG.GetFlag] Afeganistão."
 germany.403.a: "Bom trabalho"
 germany.404.t: "Operação Malsucedida"
 germany.404.d: "Recebemos recentemente relatos de que nossas forças foram capturadas e fuziladas ao tentar realizar uma operação no [AFG.GetFlag] Afeganistão.."
 germany.404.a: "Um Dia Trágico"
 germany.405.t: "Terroristas Lançam um Ataque Contra Nossa Base!"
 germany.405.d: "Terroristas lançaram um ataque contra nossas bases no [AFG.GetFlag] Afeganistão. Teremos que responder de uma forma ou de outra, ou sofrer as consequências que se seguirão.."
 germany.405.a: "Não podemos fazer nada"
 germany.405.b: "Montar um contra-ataque!"
 germany.406.t: "Os Recursos Humanitários Estão Acabando"
 germany.406.d: "Uma recente verificação de estoque concluiu que os recursos humanitários estão começando a escassear. Teremos que enviar novos carregamentos para manter a população favorável às nossas forças."
 germany.406.a: "Desculpe, hoje não"
 germany.406.b: "Autorizar novos carregamentos"
 germany.407.t: "Relatório de Fim de Missão"
 germany.407.d: "Após muitos anos de combate no [AFG.GetFlag] Afeganistão, podemos agora descansar sabendo que as pessoas estão mais seguras como resultado de nossas ações.."
 germany.407.a: "Bem-vindos de Volta, Rapazes!"
 germany.408.t: "Investimentos em [UKR.GetName]"
 germany.408.d: "Podemos investir em [UKR.GetName] para ajudá-la a seguir o caminho certo rumo a se tornar uma nação modernizada. Temos várias maneiras de fazer isso, seja ajudando sua infraestrutura ou suas indústrias."
 germany.408.a: "A infraestrutura é o que importa"
 germany.408.b: "O povo deles precisa de empregos!"
 germany.409.t: "Dissidência Bielorrussa"
 germany.409.d: "Podemos ajudar a dissidência bielorrussa contra seu governo. Embora seja motivo de debate dentro do nosso governo como queremos abordar isso.."
 germany.409.a: "Mirar a mídia deles"
 germany.409.b: "Divulgar Informações Secretas sobre o Regime"
 germany.410.t: "[GER.GetName] Quer Estabelecer Bases Militares"
 germany.410.d: "O governo [GER.GetAdjective] quer estabelecer bases militares em nossa nação para 'proteger' melhor nosso povo de possíveis forças russas e outras ameaças."
 germany.410.a: "Com certeza"
 germany.410.b: "Não é uma boa ideia, não"
 germany.412.t: "[FROM.GetName] Nega Acesso Militar!"
 germany.412.d: "[FROM.GetName] decidiu que é do seu interesse recusar nossa oferta de segurança. Apesar de termos lhes dado muitas armas, eles ainda não estão prontos para levar nossa parceria de segurança ao próximo nível.."
 germany.412.a: "Droga"
 germany.411.t: "[FROM.GetName] Permite Acesso Militar"
 germany.411.d: "[FROM.GetName] julgou necessário que nossas forças possam ser estacionadas em sua nação. Esperam que possamos oferecer um muro contra possíveis agressores perto deles."
 germany.411.a: "Bom"
 germany.414.t: "Islamistas Agem à Solta!"
 germany.414.d: "Os islamistas agem à solta desde o colapso do Departamento 6, e a vida cotidiana das pessoas piorou bastante. Os conservadores na Baviera também estão bastante exaltados, levando a um aumento do nacionalismo bávaro e a um golpe drástico em nossa economia."
 germany.414.a: "Ah, não.."
 germany.415.t: "O BfV Quer Fechar uma Organização de Direita"
 germany.415.d: "O BfV quer fechar uma organização nacionalista de direita que recentemente ganhou os holofotes em nossa nação. Muitos temem que o grupo possa crescer e se tornar algo maior, mas outros o descartam como apenas mais um pequeno grupo de alemães descontentes.."
 germany.415.a: "Fechá-la"
 germany.415.b: "Deixá-la em paz"
 germany.416.t: "O BfV Quer Fechar uma Organização de Esquerda"
 germany.416.d: "O BfV quer fechar uma organização de esquerda que recentemente ganhou os holofotes em nossa nação. Muitos temem que o grupo possa crescer e se tornar algo maior, mas outros o descartam como apenas mais um pequeno grupo de alemães descontentes.."
 germany.416.a: "Fechá-la"
 germany.416.b: "Deixá-la em paz"
 germany.417.t: "O BfV Quer Fechar uma Organização Islamista"
 germany.417.d: "O BfV quer fechar uma organização islamista que recentemente ganhou os holofotes em nossa nação. Muitos temem que o grupo possa crescer e se tornar algo maior, mas outros o descartam como apenas mais um pequeno grupo de alemães descontentes.."
 germany.417.a: "Fechá-la"
 germany.417.b: "Deixá-la em paz"
 germany.418.t: "O BfV Pede um Orçamento Maior"
 germany.418.d: "O BfV pediu que lhe demos acesso a um volume maior de recursos, permitindo-lhe reprimir com mais facilidade os grupos radicais dentro da nação."
 germany.418.a: "Claro"
 germany.418.b: "Não"
 germany.419.a: "Heil!"
 germany.419.t: "A Alemanha Forma o 4º Reich"
 germany.419.d: "Hoje marcamos em nossos livros de história a data em que a Alemanha voltou a ser uma verdadeira nação!\nDepois de mais de 50 anos, a Alemanha declara o 4º Reich. Nossa nação voltará a se erguer como potência global, não nos conformaremos às regras da sociedade e dos Estados democráticos modernos. Abriremos nosso próprio caminho para a vitória!\nNosso grande Führer pode descansar em paz sabendo que estamos nos erguendo mais uma vez!"
 germany.420.a: "Agora Estamos Quites"
 germany.420.b: "Tome um Pouco Mais"
 germany.420.c: "Você Já Teve o Bastante"
 germany.420.t: "Pagamento Final das Reparações de Guerra"
 germany.420.d: "Depois de mais de 90 anos pagando reparações de guerra aos países que marcamos durante a 1ª e a 2ª Guerras Mundiais, hoje fazemos nosso pagamento final para quitar nossa dívida e deixar o passado para trás. Foi um longo caminho, mas finalmente chegamos ao fim e podemos considerar tudo quitado.\nAgora é hora de nossa economia e nossos bancos se recuperarem dos anos de dificuldades econômicas que tivemos de suportar durante esse período."
 germany.580.t: "MiG-29"
 germany.580.d: "Durante a reunificação da Alemanha, adquirimos vários jatos MiG-29 dos antigos estoques da Alemanha Oriental. À medida que avançamos, é crucial determinar o futuro dessas aeronaves e como elas se encaixarão em nossas estratégias de defesa atuais e futuras."
 germany.580.a: "Comprar mais unidades"
 germany.580.b: "Manter a quantidade atual"
 germany.580.c: "Precisamos produzi-los por conta própria"
 germany.581.t: "Negociar a compra"
 germany.581.d: "Precisamos decidir com quais países devemos negociar para aumentar nossa frota de MiG-29."
 germany.581.a: "Negociar com a Rússia"
 germany.581.b: "Negociar com as antigas repúblicas soviéticas"
 germany.581.c: "Negociar com a Ucrânia"
 germany.582.t: "Não precisamos mais deles"
 germany.582.d: "Chegamos à conclusão de que não precisamos de uma aeronave de fabricação soviética em nosso exército; agora cabe decidir o que fazer com elas."
 germany.582.a: "Vendê-los à Polônia."
 germany.582.b: "Devemos simplesmente transformá-los em sucata."
 germany.582.c: "Vender à Europa Oriental."
 germany.583.t: "Produção sob Licença"
 germany.583.d: "Chegamos à decisão de que essas aeronaves poderiam ser uma parte importante de nossa Força Aérea, então precisamos encontrar uma forma de construí-las em nosso país."
 germany.583.a: "Contatar a Rússia."
 germany.583.b: "Desenvolver nossa própria variante"
 germany.583.c: "Desenvolver uma variante com a Polônia."
 germany.585.t: "Reformas Estruturais Implementadas"
 germany.585.d: "Concluímos as mudanças estruturais propostas pela Comissão Weizsäcker. Nossas forças armadas estão agora mais bem equipadas para enfrentar as ameaças modernas e salvaguardar a segurança de nossa nação. Com uma força mais flexível e adaptável, estamos preparados para responder rapidamente aos desafios emergentes, permanecendo prontos para futuras transformações, se necessário."
 germany.585.a: "Um exército moderno para uma nova era."
 germany.586.t: "A Comissão Weizsäcker se Reúne"
 germany.586.d: "Desde 1999, a Comissão Weizsäcker, liderada pelo ex-presidente Richard von Weizsäcker, trabalha em um conceito abrangente para o futuro do Exército Alemão. A comissão inclui ex-generais como Peter-Heinrich Carstens e Helge Hansen, além de especialistas jurídicos, teólogos, historiadores e representantes econômicos. Seu objetivo é transformar a Bundeswehr de uma força da era da Guerra Fria em um exército moderno e flexível. A comissão enfatiza a adaptação de novas tecnologias, a mudança de foco para o combate ao terrorismo e o aproveitamento do degelo pós-Guerra Fria para enxugar e otimizar as forças armadas."
 germany.586.a: "Um passo necessário para a modernização."
 germany.586.b: "Nós sabemos comandar nosso exército."
 germany.587.t: "Relatório da Comissão Weizsäcker Concluído"
 germany.587.d: "Após longas discussões entre especialistas com pontos de vista e focos distintos, a Comissão Weizsäcker finalizou seu relatório sobre o futuro da Bundeswehr. O documento apresenta recomendações-chave para transformar o Exército Alemão em uma força moderna e flexível, apta a enfrentar os desafios do século XXI. As mudanças propostas incluem adotar novas tecnologias, reestruturar para maior mobilidade e mudar o foco para o combate ao terrorismo e a manutenção da paz internacional. O relatório será agora apresentado ao Bundestag, onde uma decisão deve ser tomada: devemos abraçar essas propostas ou traçar um rumo diferente para o futuro de nossas forças armadas?"
 germany.587.a: "Adotar as recomendações e modernizar a Bundeswehr."
 germany.587.b: "Rejeitar o relatório e seguir uma estratégia diferente."
 germany.588.t: "Próxima Estrutura para a Bundeswehr"
 germany.588.d: "O Heer passou por várias mudanças estruturais desde sua criação. A reestruturação mais recente foi iniciada com a nova versão das Diretrizes de Política de Defesa. Diz-se que a reestruturação estará concluída até 2010 e é chamada de \"Heer 2010\" ou \"Novo Exército\". O Heer é dividido em várias categorias, incluindo Forças de Intervenção, Forças de Estabilização e Forças de Apoio"
 germany.588.a: "Devemos reduzir nosso Exército e economizar algum dinheiro"
 germany.588.b: "Precisamos especializar nossas forças, mas não reduzi-las"
 germany.588.c: "Precisamos aumentar nossa capacidade"
 germany.589.t: "Heer 2010"
 germany.589.d: "Com o fim desta estrutura, chegamos à conclusão de que não há mais necessidade de estruturas rígidas. Precisamos de uma transformação permanente em andamento para nos ajustarmos às necessidades que mudam rapidamente."
 germany.589.a: "Flexibilidade é uma virtude alemã"
 germany.590.t: "Moldando o Futuro da Defesa Aérea Alemã"
 germany.590.d: "À medida que a Alemanha enfrenta ameaças globais crescentes e uma tecnologia militar em rápido avanço, uma decisão crítica deve ser tomada sobre a futura estrutura de sua defesa aérea (Luftverteidigung). O objetivo é escolher uma estratégia que garanta a segurança nacional, otimize a eficiência operacional e se adapte aos desafios modernos. Cada uma das três opções possíveis oferece vantagens distintas. Mobilizar a defesa aérea aumentaria a flexibilidade e permitiria respostas rápidas a ameaças emergentes, tornando o sistema mais ágil e menos vulnerável. Distribuir os sistemas de defesa pelas regiões proporcionaria cobertura abrangente e reduziria o risco de ataques inutilizarem a infraestrutura crítica, garantindo resiliência de longo prazo. Já manter a estrutura atual preserva a eficácia de sistemas existentes e comprovados, evitando custos elevados e rupturas."
 germany.590.a: "Expandir os Sistemas Patriot"
 germany.590.b: "Expandir os Sistemas Roland"
 germany.590.c: "Manter a Estrutura Atual"
 GER_promote_private_investments: "Promover Investimentos Privados"
 GER_promote_private_investments_desc: "A Alemanha promoverá ativamente investimentos do setor privado em mercados em desenvolvimento e emergentes, particularmente em setores como tecnologia, infraestrutura e energia renovável. Ao oferecer incentivos, reduzir riscos e dar apoio às empresas alemãs no exterior, a Alemanha pretende fortalecer seus laços econômicos globais e, ao mesmo tempo, fomentar o desenvolvimento sustentável em regiões-chave. Esse foco garantirá benefícios mútuos, contribuindo para o crescimento global e para a própria expansão econômica da Alemanha."
 germany.408.c: "Não podemos arcar com isso agora"
 germany.580.e: "Não temos mais utilidade para eles"
 GER_east_opinion_below_50_TT: "A Opinião da §HAlemanha Oriental§! está abaixo de §H50§!"
 GER_seek_permanent_unsc_seat: "Buscar Assento Permanente no CSNU"
 GER_seek_permanent_unsc_seat_desc: "O alcance diplomático da Alemanha e sua contribuição para a ordem internacional sustentam a reivindicação de um assento permanente no Conselho de Segurança das Nações Unidas. Buscaremos o apoio necessário para levar essa reivindicação ao Conselho e à Assembleia Geral."
 germany_yearly.300.t: "A Siemens no Milênio"
 germany_yearly.300.d: "A Siemens entra no novo século como um amplo conglomerado industrial que abrange automação, energia, transporte e telecomunicações. Seu futuro depende de ela reforçar esse modelo integrado ou dar às indústrias digitais a maior parte de seu capital."
 germany_yearly.300.a: "Reforçar o grupo industrial integrado"
 germany_yearly.300.b: "Priorizar a indústria digital"
 germany_yearly.301.t: "Uma Joint Venture em Redes"
 germany_yearly.301.d: "A Siemens pode incorporar seu negócio de equipamentos de redes para operadoras a uma joint venture com um parceiro estrangeiro, trocando o controle direto por escala global. Manter os engenheiros internamente permitiria, em vez disso, que o grupo explorasse sua vantagem na automação industrial."
 germany_yearly.301.a: "Comprometer-se com a joint venture de redes"
 germany_yearly.301.b: "Priorizar a automação industrial"
 germany_yearly.302.t: "A Siemens Reconsidera Seu Negócio de Redes"
 germany_yearly.302.d_venture: "A joint venture de redes nunca rendeu os retornos prometidos, e seu parceiro está pressionando por um acordo. A Siemens pode vender sua participação e aplicar os recursos em indústrias digitais, ou comprar a parte do parceiro e operar o negócio sozinha."
 germany_yearly.302.d_independent: "O negócio de redes para operadoras chegou a uma encruzilhada. A Siemens pode vender a operação por completo e reinvestir em indústrias digitais, ou comprometer o capital necessário para se manter firme diante de rivais maiores."
 germany_yearly.302.a: "Vender o negócio e reinvestir os recursos"
 germany_yearly.302.b: "Assumir o controle total do negócio de redes"
 germany_yearly.303.t: "Siemens Healthineers Entra no Mercado"
 germany_yearly.303.d: "A Siemens Healthineers está pronta para sua abertura de capital, dando ao negócio de tecnologia médica seu próprio preço de ação e acesso próprio a capital, enquanto a Siemens mantém uma participação majoritária. Mantê-la dentro do grupo preservaria um controle mais rígido sobre sua pesquisa e seu caixa."
 germany_yearly.303.a: "Abrir o capital da Siemens Healthineers"
 germany_yearly.303.b: "Manter a Healthineers totalmente integrada"
 germany_yearly.304.t: "Siemens Energy Torna-se Independente"
 germany_yearly.304.d: "A Siemens está pronta para desmembrar sua divisão de energia e listá-la por conta própria. A independência permitiria que a Siemens Energy buscasse a transição energética sem competir por capital com a automação, enquanto a integração contínua manteria o portfólio de engenharia unido."
 germany_yearly.304.a: "Concluir o desmembramento da Siemens Energy"
 germany_yearly.304.b: "Manter a divisão de energia integrada"
 germany_yearly.305.t: "No Que a Siemens Se Tornou"
 germany_yearly.305.d: "Um quarto de século de aberturas de capital, desmembramentos e divisões mantidas definiu que tipo de empresa a Siemens é. A forma a que o grupo chegou agora define como a indústria alemã compete."
 germany_yearly.305.a: "Um grupo focado em tecnologia industrial"
 germany_yearly.305.b: "Uma empresa de indústrias digitais"
 germany_yearly.305.c: "Uma potência em automação e controle"
 germany_yearly.305.e: "Um conglomerado industrial diversificado"
 GER_siemens_focused_industrials: "Grupo Industrial Focado"
 GER_siemens_focused_industrials_desc: "A Healthineers e a Energy passam a ter suas próprias cotações de ações, deixando uma Siemens menor, que responde apenas por automação, software e mobilidade. O capital liberado é mais fácil de direcionar e as divisões restantes não se subsidiam mais umas às outras."
 GER_siemens_digital_industries: "Indústrias Digitais"
 GER_siemens_digital_industries_desc: "Software e computação industrial tiveram prioridade sobre as divisões pesadas, e a pesquisa do grupo agora passa por gêmeos digitais, plataformas de controle e inteligência de máquina, em vez de turbinas."
 GER_siemens_automation_core: "Núcleo de Automação e Controle"
 GER_siemens_automation_core_desc: "O grupo manteve seus engenheiros onde estavam as margens, e a automação de fábricas tornou-se a disciplina pela qual todo o resto era medido. As linhas de produção alemãs se reequipam mais rápido que as de qualquer outro."
 GER_siemens_diversified_conglomerate: "Conglomerado Industrial Diversificado"
 GER_siemens_diversified_conglomerate_desc: "A Siemens manteve suas divisões unidas diante de cada onda de pressão para desmembrá-las. A amplitude custa eficiência, mas um grupo que atua em energia, saúde, transporte e indústria tem um peso que nenhum especialista consegue igualar."
 germany.68.t: "C.G. Haenel Retorna a Suhl"
 germany.68.d: "O nome sobre o portão em Suhl é um dos mais antigos da fabricação de armas alemã. A C.G. Haenel constrói rifles ali desde 1840, deu a Hugo Schmeisser a oficina em que ele projetou o primeiro fuzil de assalto e depois passou quatro décadas como fábrica estatal de armas de caça, até que a unidade foi finalmente encerrada. Capital emirático agora comprou a marca e reabriu a linha sob Merkel, e a Haenel pretende competir por contratos federais contra a Heckler & Koch com uma nova geração de fuzis de precisão e de serviço."
 germany.68.a: "Suhl está construindo rifles novamente"
 ger_bmw_unlocked: "A §Y$GER_BMW$§! oferece entrar na produção de defesa após completar §Y$GER_BMW_Focus$§!, ou em §Y2021§!. A oferta deve ser aceita."
 GER_airbus_change: "A Eurocopter foi incorporada como Airbus Helicopters em 2014"
 TT_GER_airbus_change_carry_traits: "§YA Airbus Defence ganha tamanho de organização e escolhas livres de características iguais às características já concluídas em $GER_Eurocopter_helicopters_tank_manufacturer$§!"
 GER_airbus.1.t: "Eurocopter Torna-se Airbus Helicopters"
 GER_airbus.1.d: "O grupo passou uma década vendendo uma única aeronave sob três marcas. A partir de 1º de janeiro, o nome Eurocopter é aposentado: Donauwörth, Marignane e Albacete passam a responder à Airbus Helicopters, e a divisão se reporta à Airbus Defence and Space, ao lado dos aviões de transporte de Bremen e do trabalho com não tripulados em Manching."
 GER_airbus.1.a: "Um só nome sobre cada rotor."
