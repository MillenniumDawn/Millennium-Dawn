 LBA_convicted_criminal_idea_version: "전과자"
 LBA_khamis_brigade_idea_version: "카미스 여단"
 LBA_war_industrialist_idea_version: "군수 산업가"
 LBA_captain_of_industry_idea_version: "산업계의 거물"
 libya_tribalism_loyal_dynamic_modifier: "충성스러운 부족들"
 libya_tribalism_neutral_dynamic_modifier: "중립적인 부족들"
 libya_tribalism_bad_dynamic_modifier: "불충한 부족들"
 LBA_general_peoples_congress: "국민인민회의"
 LBA_general_peoples_congress_desc: "리비아의 행정은 여러 단계의 인민회의로 나뉘어 있습니다. 이는 의사 결정을 민주화하고 분권화하여 상향식 방식을 가능케 하려는 것입니다. 그러나 인민회의는 회의와 국민에게 혁명 사상을 조언하고 교육하는 자마히리야 혁명위원회와 병행하여 운영됩니다. 실제로 혁명위원회는 이탈하는 정치적 견해가 떠오르는 것을 막고 있으며, 리비아 시민의 거의 15%가 혁명위원회의 정보원으로 일하는 것으로 추정됩니다.\n\n§Y우리가 살라피주의를 따르면 이 국가 정신은 제거됩니다.§!"
 LBA_empowered_peoples_congress: "강화된 인민회의"
 LBA_empowered_peoples_congress_desc: "혁명위원회가 폐지된 후 인민회의가 지배적인 정치적 의사 결정 기구가 되었습니다. 리비아는 이제 진정한 상향식 민주주의를 따릅니다.\n\n§R우리가 살라피주의를 따르면 이 국가 정신은 제거됩니다.§!"
 LBA_empowered_revolutionary_committees: "강화된 혁명위원회"
 LBA_empowered_revolutionary_committees_desc: "리비아의 혁명위원회가 국가의 정치 과정을 완전히 장악했습니다. 이전에는 인민회의가 이념적으로 너무 멀리 벗어나지 않도록 감시했지만, 이제는 모든 의사 결정이 사실상 혁명위원회의 통제 아래 놓입니다.\n\n§Y우리가 살라피주의를 따르면 이 국가 정신은 제거됩니다.§!"
 LBA_undeveloped_agriculture: "미개발 농업"
 LBA_undeveloped_agriculture_desc: "리비아는 매우 건조한 나라로, 국토의 2%만이 경작 가능합니다. 기존의 이슬람 상속법과 카다피의 정책으로 인해 남아 있는 농장은 모두 매우 영세한 토지 소유 형태입니다. 리비아의 식량 수요 중 국내에서 생산되는 것은 극히 일부이고 대부분의 식량은 수입해야 합니다. 이 때문에 우리는 다른 나라에 크게 의존합니다. 리비아에 가장 많은 식량을 수출하는 나라는 §Y[BRA.GetNameWithFlag], [ITA.GetNameWithFlag], [EGY.GetNameWithFlag], [SWI.GetNameWithFlag], [SIA.GetNameWithFlag], [UAE.GetNameWithFlag]§!이며, 이들로부터의 식량 수입 능력은 그들의 수출 능력에 달려 있습니다.\n\n§Y다음 국가 중 하나가 우리의 종속국이거나 우리가 그 수도를 소유하면 이 국가 정신은 제거됩니다: [SAF.GetNameWithFlag], [CDI.GetNameWithFlag], [MOR.GetNameWithFlag], [EGY.GetNameWithFlag] 또는 [TNZ.GetNameWithFlag].§!"
 LBA_undeveloped_agriculture_tt: "§R§Y농민§!을(를) §Y내부 파벌§!로 둘 수 없습니다§!"
 LBA_agricultural_reform: "농업 개혁"
 LBA_agricultural_reform_desc: "리비아의 농업 부문이 개혁되었습니다. 이제 사유지 점유가 더 자유로워졌고 이슬람 상속법 때문에 농장이 쪼개지는 일도 없습니다. 해수 담수화와 GMMR로 담수원이 늘어나면서, 리비아는 주어진 여건에서 농업을 최대한도까지 발전시켰습니다.\n\n§Y다음 국가 중 하나가 우리의 종속국이거나 우리가 그 수도를 소유하면 이 국가 정신은 제거됩니다: [SAF.GetNameWithFlag], [CDI.GetNameWithFlag], [MOR.GetNameWithFlag], [EGY.GetNameWithFlag] 또는 [TNZ.GetNameWithFlag].§!"
 LBA_agricultural_imports: "농산물 수입"
 LBA_agricultural_imports_desc: "리비아는 국내로 수입되는 식량의 양을 크게 늘렸습니다. 리비아에는 경작지가 거의 없으므로, 정부는 이길 수 없는 싸움에 시간과 돈을 낭비하는 대신 식량 수입을 위한 관계와 공급망을 구축했습니다.\n\n§Y다음 국가 중 하나가 우리의 종속국이거나 우리가 그 수도를 소유하면 이 국가 정신은 제거됩니다: [SAF.GetNameWithFlag], [CDI.GetNameWithFlag], [MOR.GetNameWithFlag], [EGY.GetNameWithFlag] 또는 [TNZ.GetNameWithFlag].§!"
 LBA_great_man_made_river_phase2: "대인공강 - 2단계"
 LBA_great_man_made_river_phase2_desc: "대인공강(GMMR)은 리비아 남부의 누비아 사암 대수층에서 해안까지 담수를 끌어오는 수도관망입니다. 세계 최대의 지하 수도관망이며, 무아마르 카다피는 이를 '세계 8번째 불가사의'라 칭했습니다. 현재 트리폴리, 시르테, 벵가지 시에 물을 공급하고 있으며, 공급되는 물은 모든 리비아인에게 무료입니다. 이 관망을 확장할 계획이 있었으나 90년대 이후 개발이 지지부진합니다."
 LBA_great_man_made_river_phase3: "대인공강 - 3단계"
 LBA_great_man_made_river_phase3_desc: "대인공강(GMMR)은 리비아 남부의 누비아 사암 대수층에서 해안까지 담수를 끌어오는 수도관망입니다. 세계 최대의 지하 수도관망이며, 무아마르 카다피는 이를 '세계 8번째 불가사의'라 칭했습니다. 현재 트리폴리, 시르테, 벵가지 시에 물을 공급하고 있으며, 공급되는 물은 모든 리비아인에게 무료입니다. 관망은 사막 도시 알주프까지도 연결되었으며, 추가 확장이 계획되어 있습니다."
 LBA_great_man_made_river_phase41: "대인공강 - 4단계"
 LBA_great_man_made_river_phase41_desc: "대인공강(GMMR)은 리비아 남부의 누비아 사암 대수층에서 해안까지 담수를 끌어오는 수도관망입니다. 세계 최대의 지하 수도관망이며, 무아마르 카다피는 이를 '세계 8번째 불가사의'라 칭했습니다. 현재 트리폴리, 시르테, 벵가지 시에 물을 공급하고 있으며, 공급되는 물은 모든 리비아인에게 무료입니다. 관망은 사막 도시 알주프, 동부의 토브룩, 알제리 국경의 가다메스까지도 연결되었으며, 추가 확장이 계획되어 있습니다."
 LBA_great_man_made_river_phase5: "대인공강 - 5단계"
 LBA_great_man_made_river_phase5_desc: "대인공강(GMMR)은 리비아 남부의 누비아 사암 대수층에서 해안까지 담수를 끌어오는 수도관망입니다. 세계 최대의 지하 수도관망이며, 무아마르 카다피는 이를 '세계 8번째 불가사의'라 칭했습니다. 현재 트리폴리, 시르테, 벵가지 시에 물을 공급하고 있으며, 공급되는 물은 모든 리비아인에게 무료입니다. 관망은 사막 도시 알주프, 동부의 토브룩, 알제리 국경의 가다메스까지도 연결되었습니다. 나라의 서부와 동부의 수도관망이 서로 연결되어 GMMR은 공식적으로 완공되었습니다."
 LBA_revolutionary_guard_corps: "혁명수비대"
 LBA_revolutionary_guard_corps_desc: "혁명수비대는 카다피에게 충성하는 부족 출신들로 이루어진 리비아군의 특수 부대입니다. 수비대의 목적은 정규군에 대한 견제 세력으로 기능하는 것입니다. 수비대는 무기 비축분의 대부분까지 통제하며, 필요할 때에만 정규군에 보급품을 내줍니다.\n\n§Y카다피 일가가 통치하지 않으면 이 국가 정신은 제거됩니다.§!"
 LBA_armed_forces_of_arab_jamahiriya: "리비아 아랍 자마히리야군"
 LBA_armed_forces_of_arab_jamahiriya_desc: "공식 명칭이 리비아 아랍 자마히리야 군대인 리비아군은 혁명수비대를 대신하여 정권의 주된 방위 조직이 되었습니다."
 LBA_stream_of_refugees: "난민의 물결"
 LBA_stream_of_refugees_desc: "리비아는 아프리카에서 유럽으로 향하는 주요 인신매매 경로 중 하나입니다. 중앙아프리카의 빈곤, 사헬의 이슬람주의 반군, 수단의 분쟁으로 인해 사람들은 유럽으로 건너가기를 바라며 대거 리비아 사막을 횡단합니다. 그러나 이들 중 다수는 리비아에 발이 묶이거나 더 나쁘게는 지중해 바닥에서 생을 마칩니다.\n\n§Y다음 조건을 모두 충족하면 이 국가 정신은 제거됩니다:\n - [NGR.GetNameWithFlag]이(가) 우리의 괴뢰국이거나 우리가 $STATE_329$ 및 $STATE_1108$을(를) 소유함\n - [CHA.GetNameWithFlag]이(가) 우리의 괴뢰국이거나 우리가 $STATE_580$ 및 $STATE_327$을(를) 소유함\n - [DAR.GetNameWithFlag] 또는 [SUD.GetNameWithFlag]이(가) 우리의 괴뢰국이거나 우리가 $STATE_614$을(를) 소유함§!"
 LBA_family_centric: "가족 중심"
 LBA_family_centric_desc: "우리는 가족을 사회의 기본 단위로 장려하고 있습니다."
 LBA_nation_centric: "국가 중심"
 LBA_nation_centric_desc: "우리는 국가를 사회의 기본 단위로 장려하고 있습니다."
 LBA_religion_in_schools: "종교 교육"
 LBA_religion_in_schools_desc: "우리의 교육 체계는 종교를 교과 과정에 긴밀하게 통합합니다."
 LBA_nationalism_in_schools: "민족주의 교육"
 LBA_nationalism_in_schools_desc: "우리의 교육 체계는 민족주의를 교과 과정에 긴밀하게 통합합니다."
 LBA_grand_mufti_appointed: "리비아 대무프티"
 LBA_grand_mufti_appointed_desc: "리비아의 이슬람 율법을 해석할 대무프티가 임명되었습니다."
 LBA_mujahideen_of_libya_idea: "리비아의 무자헤딘"
 LBA_mujahideen_of_libya_idea_desc: "Libyan Mujahideen veterans from Afghanistan have reached a significant power status in Libya.\n\n§YThis national spirit will be removed if we are not Salafist§!"
 LBA_tanasoh_tv_idea: "타나수 TV"
 LBA_tanasoh_tv_idea_desc: "대무프티의 메시지를 전파하기 위해 국영 TV 방송망이 설립되었습니다.\n\n§Y우리가 살라피주의를 따르지 않으면 이 국가 정신은 제거됩니다§!"
 LBA_supreme_revolutionaries_council_idea: "최고 혁명 평의회"
 LBA_supreme_revolutionaries_council_idea_desc: "대무프티의 자문 평의회입니다.\n\n§Y우리가 살라피주의를 따르지 않으면 이 국가 정신은 제거됩니다§!"
 LBA_immigration_target: "이민 캠페인"
 libya_baathism_dynamic_modifier: "리비아 바트주의"
 libya_baathism_dynamic_modifier_desc: "리비아 정권은 바트주의 비밀 조직망을 자신들에게 유리하게 활용하고 있습니다.\n\n§Y리비아 민족 운동이 집권 연립에 속하지 않으면 이 국가 정신은 제거됩니다.§!"
 LBA_mauritanian_military_infiltrated: "모리타니 군 침투"
 LBA_mauritanian_military_infiltrated_desc: "바트당 지지자들의 도움으로 리비아는 모리타니 군에 침투했습니다."
 LBA_new_green_book: "새 녹서"
 LBA_new_green_book_desc: "무아마르 카다피는 자신의 녹서를 새 판본으로 개정했습니다. 이 책은 모든 시민에게 배포되며 모든 학교에서 가르쳐져 사람들이 올바른 사상을 따르도록 합니다. 이 책의 출간은 리비아 사회에 지속적인 영향을 미칠 것입니다."
 LBA_grassroots_democracy_idea: "풀뿌리 민주주의"
 LBA_grassroots_democracy_idea_desc: "리비아 국민은 상향식으로 민주적 과정에 참여할 기회를 얻었습니다.\n\n§Y선거가 없으면 이 국가 정신은 제거됩니다.§!"
 LBA_royal_family_returned: "세누시 가문의 귀환"
 LBA_royal_family_returned_desc: "폐위된 이드리스 1세 국왕의 친척들이 수십 년의 망명 끝에 리비아로 돌아오는 것이 허용되었습니다."
 LBA_royal_family_returned_2: "참정권을 얻은 세누시"
 LBA_royal_family_returned_2_desc: "폐위된 이드리스 1세 국왕의 친척들이 수십 년의 망명 끝에 리비아로 돌아오는 것이 허용되었습니다. 이들은 이제 왕실을 운영하기 위해 리비아 정부로부터 연간 수당을 받고 있습니다."
 LBA_confiscated_royal_wealth: "몰수된 왕실 재산"
 LBA_confiscated_royal_wealth_desc: "리비아 국가의 재정을 충당하기 위해 리비아 왕실로부터 돈이 몰수되었습니다.\n\n§Y세누시 가문이 집권 연립에 속하면 이 국가 정신은 제거됩니다.§!"
 LBA_strong_president: "대통령제 공화국"
 LBA_strong_president_desc: "리비아는 프랑스식 대통령제 공화국을 정부 형태로 채택했습니다.\n\n§Y세누시 가문이 집권하거나 우리가 살라피주의를 따르면 이 국가 정신은 제거됩니다.§!"
 LBA_unitary_presidential_republic: "단일 대통령제 공화국"
 LBA_unitary_presidential_republic_desc: "리비아는 프랑스식 통치 모델을 따라 단일 대통령제 공화국으로 개편되었습니다.\n\n§Y세누시 가문이 집권하거나 우리가 살라피주의를 따르면 이 국가 정신은 제거됩니다.§!"
 LBA_constitutional_monarchy: "입헌 군주제"
 LBA_constitutional_monarchy_desc: "리비아는 대부분의 권력이 선출된 입법부에 있는 입헌 군주제로 개편되었습니다.\n\n§Y선거가 없거나 우리가 살라피주의를 따르면 이 국가 정신은 제거됩니다.§!"
 LBA_unitary_constitutional_monarchy: "단일 입헌 군주제"
 LBA_unitary_constitutional_monarchy_desc: "리비아는 대부분의 권력이 선출된 입법부에 있는 단일 입헌 군주제로 개편되었습니다.\n\n§Y선거가 없거나 우리가 살라피주의를 따르면 이 국가 정신은 제거됩니다.§!"
 LBA_minorities_granted_rights: "연방 대통령제 공화국"
 LBA_minorities_granted_rights_desc: "리비아의 소수민족들은 현 정부 아래에서 대통령제 공화국으로 통치받으면서도 제한적인 자치를 부여받았습니다.\n\n§Y세누시 가문이 집권하거나 우리가 살라피주의를 따르면 이 국가 정신은 제거됩니다.§!"
 LBA_minorities_protected: "보호받는 소수민족"
 LBA_minorities_protected_desc: "리비아 정부는 소수민족이 존중받을 것이며 문화유산을 보존할 수 있을 것이라고 약속했습니다.\n\n§Y우리가 민족주의이거나 살라피주의를 따르면 이 국가 정신은 제거됩니다.§!"
 LBA_senussi_order: "부활한 세누시 교단"
 LBA_senussi_order_desc: "종교 단체인 세누시 교단이 리비아에서 부활했습니다. 신비주의적 수피즘과 극단주의적 수니파 이슬람 사이의 중도를 설파하는 이 교단의 핵심 교리 중 하나는 모든 사람이 자신의 식량을 위해 일해야 하며 자선에 의존해서는 안 된다는 것입니다.\n\n§Y우리가 살라피주의를 따르면 이 국가 정신은 제거됩니다.§!"
 LBA_anti_air_improvements: "대공 중점"
 LBA_anti_air_improvements_desc: "리비아는 방공 능력을 향상시키기 위해 군사 연구 개발에 집중하고 있습니다."
 LBA_improved_fighter_response: "향상된 전투기 대응"
 LBA_improved_fighter_response_desc: "리비아 공군은 전투기 부대의 대응 및 이륙 시간을 연습하는 데 훈련 시간의 상당 부분을 쏟고 있습니다."
 LBA_guerrilla_toyotas: "토요타 전쟁 - 게릴라전"
 LBA_guerrilla_toyotas_desc: "리비아군은 차드-리비아 전쟁(토요타 전쟁으로도 알려짐)에서 얻은 경험을 분석하고 교훈을 얻었습니다. 이제 이동식 테크니컬로 리비아의 방어선을 손쉽게 우회하여 후방을 공격한 차드의 군사 전술에 더 많은 주의를 기울일 것입니다."
 LBA_mobile_toyotas: "토요타 전쟁 - 기동성"
 LBA_mobile_toyotas_desc: "리비아군은 차드-리비아 전쟁(토요타 전쟁으로도 알려짐)에서 얻은 경험을 분석하고 교훈을 얻었습니다. 이제 이동식 테크니컬로 리비아의 부대와 방어선, 심지어 지뢰밭까지 손쉽게 기동으로 압도한 차드의 군사 전술에 더 많은 주의를 기울일 것입니다."
 LBA_desert_warfare_idea: "사막전의 대가"
 LBA_desert_warfare_idea_desc: "리비아군은 사막과 더위 속에서 싸우는 기술을 완벽하게 갈고닦았습니다."
 LBA_egypt_war_specops: "특공대 전문화"
 LBA_egypt_war_specops_desc: "과거의 분쟁을 분석한 끝에 리비아군은 적의 후방을 공격하는 특수 부대에 중점을 둔, 더욱 특공대 중심의 군대로 개편되었습니다."
 LBA_egypt_war_armour: "기계화 전문화"
 LBA_egypt_war_armour_desc: "과거의 분쟁을 분석한 끝에 리비아군은 적의 전선을 돌파하는 장갑 전투 차량에 중점을 둔, 더욱 기계화된 군대로 개편되었습니다."
 LBA_foreign_procurement_boosted: "향상된 조달"
 LBA_foreign_procurement_boosted_desc: "무기 제재가 해제된 지금, 리비아 정부는 외국 장비를 대대적으로 사들이고 있습니다."
 LBA_libyan_gauge_railroads: "리비아 궤간"
 LBA_libyan_gauge_railroads_desc: "리비아는 독자적인 고유 철도 궤간을 채택했습니다. 이는 적대 국가의 철도 장비가 호환되지 않기 때문에 그들이 리비아 영토를 점령하고 통제하기 어렵게 만듭니다."
 LBA_state_supported_railways: "국가 재정 철도"
 LBA_state_supported_railways_desc: "리비아에 새로운 철도 체계가 만들어지면서 대부분의 비용을 중앙 정부가 부담하고 있습니다. 민간 및 산업 수송 이용률이 여전히 너무 낮아 지속 가능하지 않습니다."
 LBA_state_supported_railways_functional: "국가 지원 철도"
 LBA_state_supported_railways_functional_desc: "리비아의 새 철도망이 운용 가능한 상태에 이르렀습니다. 이용률이 낮아 정부가 여전히 일부 비용을 부담해야 하지만, 적어도 앞으로의 성장을 위한 기반은 마련되었습니다."
 LBA_railroad_connection_to_neighbour: "리비아행 철도"
 LBA_railroad_connection_to_neighbour_desc: "[ROOT.GetNameDef]과(와) [LBA.GetNameDef]을(를) 잇는 철도가 건설되었습니다. 이 연결성의 증대는 나라의 경제를 활성화하고 있습니다."
 LBA_increased_tourism_1: "관광 호황"
 LBA_increased_tourism_1_desc: "리비아는 관광객이 나라의 다양한 명소를 보러 방문하도록 유치하는 데 막대한 투자를 하고 있습니다.\n\n§Y전쟁 중이면 세금 수입과 건설 속도에 부정적인 변동치를 받습니다.§!"
 LBA_increased_tourism_1_war: "관광객 이탈"
 LBA_increased_tourism_1_war_desc: "리비아에서 계속되는 분쟁 때문에 관광객들이 나라를 역병처럼 피하고 있습니다. 관광에 더욱 의존하게 된 나라 경제에 상당한 타격을 주었습니다."
 LBA_housing_terrorists: "테러리스트 은닉"
 LBA_housing_terrorists_desc: "리비아는 여러 테러 조직의 전투원들에게 안전한 피난처를 제공하고 있으며, 심지어 그들을 자국군에 영입하고 있습니다."
 LBA_treaty_of_benghazi: "벵가지 조약"
 LBA_treaty_of_benghazi_desc: "이탈리아와 리비아는 유럽으로의 불법 이민을 줄이기 위해 리비아 해안을 공동으로 순찰하기로 합의했습니다. 유럽은 또한 위성을 이용해 리비아의 육상 국경을 감시하며 리비아를 지원할 것입니다. 그 대가로 이탈리아는 식민주의로 인해 리비아에 입힌 피해를 배상하기로 했습니다.\n\n§Y우리가 이탈리아와 전쟁 중이면 이 국가 정신은 제거됩니다.§!"
 LBA_trade_with_italy: "이탈리아와의 무역"
 LBA_trade_with_italy_desc: "이탈리아와 리비아의 우호 관계 덕분에 리비아는 탄화수소를 더 효율적으로 유럽에 판매할 수 있습니다.\n\n§Y우리가 이탈리아와 전쟁 중이면 이 국가 정신은 제거됩니다.§!"
 LBA_libyan_sea_secured: "리비아 해 장악"
 LBA_libyan_sea_secured_desc: "몰타와 크레타를 장악함으로써 리비아는 적대 세력의 침공으로부터 해안선을 확보했습니다."
 LBA_chad_trade_deal_chad: "리비아와의 면화 무역"
 LBA_chad_trade_deal_chad_desc: "차드는 리비아에 면화를 수출하기 위한 무역 협정을 맺었습니다. 훨씬 부유한 나라로의 면화 수출이 차드 경제를 부양하기 시작했습니다."
 LBA_chad_trade_deal_libya: "차드와의 면화 무역"
 LBA_chad_trade_deal_libya_desc: "리비아는 고품질 면화를 수입하기 위해 차드와 무역 협정을 맺었습니다. 이로 인해 리비아의 의류 판매가 늘었으며, 고품질 면화는 제한적이나마 군사적 용도로도 쓰입니다."
 LBA_jewish_migration: "유대인 이주"
 LBA_jewish_migration_desc: "리비아는 추방된 유대인들이 나라로 돌아오는 것을 허용했으며, 그 대가로 일부 배상까지 제안했습니다.\n\n§Y우리가 이스라엘과 전쟁 중이면 이 국가 정신은 제거됩니다.§!"
 LBA_champion_of_al_aqsa_idea: "알아크사의 수호자"
 LBA_champion_of_al_aqsa_idea_desc: "알아크사 모스크를 장악함으로써 리비아는 모든 무슬림에게 영향력 있는 등불이 되었습니다.\n\n§Y예루살렘을 소유하지 않거나 우리의 종속국 혹은 동맹이 소유하지 않으면 이 국가 정신은 제거됩니다.§!"
 LBA_support_mengistu: "멩기스투 홍보 캠페인"
 LBA_support_mengistu_desc: "리비아는 진행 중인 집단 학살 재판에서 망명한 독재자 멩기스투의 무죄를 세계에 납득시키기 위해 그를 위한 홍보 캠페인을 조직했습니다."
 LBA_islamic_legion_idea: "이슬람 군단"
 LBA_islamic_legion_idea_desc: "리비아는 세계 곳곳의 여러 분쟁에서 카다피의 대리 세력으로 활동하도록 만들어진 부대인 이슬람 군단을 재건했습니다.\n\n§Y리비아가 카다피에 의해 통치되지 않으면 이 국가 정신은 제거됩니다.§!"
 LBA_employing_charles_taylor: "찰스 테일러"
 LBA_employing_charles_taylor_desc: "리비아 정부는 망명 중인 찰스 테일러를 고용했습니다. 이 경험 많은 게릴라 지도자는 리비아 보안 요원들에게 발생 가능한 반란에 대처하는 법을 교육하고 있습니다.\n\n§Y리비아가 카다피에 의해 통치되지 않으면 이 국가 정신은 제거됩니다.§!"
 LBA_ethiopia_somali_resistance: "오가덴 저항"
 LBA_ethiopia_somali_resistance_desc: "오가덴 지역의 소말리 씨족들이 에티오피아 통치자들에 맞서 반란을 벌이고 있습니다."
 LBA_hakem_al_mutairi: "하켐 알무타이리"
 LBA_hakem_al_mutairi_desc: "카다피는 걸프 지역에서 리비아의 영향력을 확대하기 위해 쿠웨이트 성직자이자 움마당 대표인 하켐 알무타이리를 고용하고 있습니다.\n\n§Y리비아가 카다피에 의해 통치되지 않으면 이 국가 정신은 제거됩니다.§!"
 LBA_nationalised_economy_1: "국유화 경제"
 LBA_nationalised_economy_1_desc: "리비아는 나라의 대부분의 산업이 국가 소유이거나 적어도 국가의 강력한 통제를 받는 경제 모델을 따르고 있습니다."
 LBA_privatised_economy_1: "민영화 경제"
 LBA_privatised_economy_1_desc: "수십 년간의 정부 통제 끝에 리비아는 경제의 주요 부문을 민영화하기 시작했으며, 그 결과 경제 성장이 늘었습니다."
 LBA_humbled_the_un: "UN을 굴복시키다"
 LBA_humbled_the_un_desc: "무아마르 카다피의 UN에서의 열정적인 연설은 리비아를 세간의 이목 속으로 끌어올렸으며, 리비아가 만만한 상대가 아님을 세계에 보여 주었습니다."
 LBA_humbled_by_the_un: "UN에서 굴욕당하다"
 LBA_people_motivated_to_work: "일에 의욕을 느끼는 국민"
 LBA_people_motivated_to_work_desc: "트리폴리 거리에 돈을 뿌린 카다피의 최근 묘수는 국제 원조 기관과 자선 단체가 사람들을 돈에 중독시키려는 사기에 불과하다고 국민이 믿게 만들었습니다. 그들은 이제 다시는 구걸하지 않아도 되도록 평소보다 훨씬 열심히 일하고 있습니다."
 LBA_people_unmotivated_to_work: "일에 의욕을 잃은 국민"
 LBA_people_unmotivated_to_work_desc: "트리폴리 거리에 돈을 뿌린 카다피의 최근 묘수는 심각한 역효과를 낳았습니다. 사람들은 더 이상 일하려 하지 않고 집에 앉아 지원금만 기다리고 있습니다."
 LBA_gaddafis_car_rocket: "로켓"
 LBA_gaddafis_car_rocket_desc: "리비아는 국산 자동차 설계인 로켓의 양산에 들어갔습니다. 쐐기 모양에 에어백, 런플랫 타이어, 자동 연료 차단 장치, 충격 흡수 범퍼 등 수많은 안전 기능을 가득 갖춘 이 차는 (적어도 리비아의 통치자 카다피에게는) 세계에서 가장 안전한 자동차로 불리고 있습니다."
 LBA_gaddafis_car_bucket: "양동이"
 LBA_gaddafis_car_bucket_desc: "리비아는 국산 자동차 설계인 양동이의 양산에 들어갔습니다. 저렴한 재료로 만들어졌고 문 대신 옆면이 뚫려 있으며 대부분의 패널이 값싼 듀로플라스트로 되어 있고 전기 엔진을 달았습니다. 무아마르 카다피는 이 새로운 발명품을 진정한 국민차라고 부르고 있습니다."
 LBA_gaddafis_car_packet: "꾸러미"
 LBA_gaddafis_car_packet_desc: "리비아는 국산 자동차 설계인 꾸러미의 양산에 들어갔습니다. 도요타 하이럭스를 그대로 베낀 튼튼한 픽업트럭입니다. 군용과 민간용을 겸하도록 만들어진 이 트럭은 방탄 유리창과 전면 장갑판, 강화 타이어를 갖췄습니다. 진정한 다목적 차량입니다."
 LBA_gaddafis_car_increased_road_fatalities: "도로 사망자 증가"
 LBA_gaddafis_car_increased_road_fatalities_desc: "카다피의 재앙적인 국산 자동차 설계 도전은 리비아 국민이 모든 신형 자동차 설계를 의심하게 만들었습니다. 사람들은 신형을 피하기 위해 점점 더 오래된 차를 사고 있습니다. 이는 교통사고와 사망자의 대폭 증가로 이어졌습니다."
 LBA_show_of_greatness: "위대함의 과시"
 LBA_show_of_greatness_desc: "리비아 지도자 무아마르 카다피의 최근 외국 국빈 방문은 해외와 국내 모두의 사람들을 놀라게 했습니다. 카다피의 국제적 위상이 크게 높아졌습니다."
 LBA_show_of_failure: "실패의 과시"
 LBA_show_of_failure_desc: "무아마르 카다피의 최근 외국 국빈 방문은 그를 국제 무대와 국내 무대 모두에서 굴욕에 빠뜨렸습니다."
 LBA_good_juju: "좋은 주술"
 LBA_good_juju_desc: "무아마르 카다피는 흑마술을 통해 병사들이 리비아를 방어하기 위해 더 열심히 싸우도록 고무했습니다."
 LBA_bad_juju: "나쁜 주술"
 LBA_bad_juju_desc: "흑마술 의식이 실패하면서 무아마르 카다피의 병사들은 지도자의 지도력에 대한 믿음을 잃었습니다."
 LBA_emancipator_of_women: "여성 해방자"
 LBA_emancipator_of_women_desc: "무아마르 카다피가 이탈리아에서 여성들에게 한 최근의 이슬람 강연은 여성들의 대규모 이슬람 개종과 리비아 이주로 이어졌습니다."
 LBA_oppressor_of_women: "여성 억압자"
 LBA_oppressor_of_women_desc: "무아마르 카다피가 이탈리아에서 여성들에게 한 최근의 이슬람 강연으로 사람들은 이 위대한 지도자를 여성 억압자에 불과하다고 보게 되었습니다. 이런 자가 통치하는 나라에서 살고 싶지 않은 사람들이 대거 리비아를 떠나고 있습니다."
