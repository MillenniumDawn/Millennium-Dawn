 Solomon_Islands.1.t: "L'accord de Munda"
 Solomon_Islands.1.d: "Après une médiation intensive de l'envoyé spécial du Commonwealth Sitiveni Rabuka, le gouvernement provincial et les chefs de l'opposition ont signé l'accord de Munda. L'accord esquisse un plan en neuf points destiné à désescalader la violence ethnique et à établir une feuille de route pour une réforme constitutionnelle."
 Solomon_Islands.1.a: "Une paix fragile vaut mieux que pas de paix du tout"
 Solomon_Islands.1.b: "Saboter les accords"
 Solomon_Islands.2.t: "Le coup d'État de la Malaita Eagle Force"
 Solomon_Islands.2.d: "La situation politique a atteint son point de rupture. Tôt ce matin, des membres de la Malaita Eagle Force, aidés selon les rapports par des éléments de la police paramilitaire, ont pris le contrôle de points stratégiques à Honiara. Le Premier ministre [SOL.GetLeader] a été assigné à résidence sous la menace des armes. La direction de la Malaita Eagle Force affirme que le gouvernement a échoué à protéger les intérêts malaitais et exige une transition immédiate du pouvoir. Le processus démocratique a de fait été suspendu. "
 Solomon_Islands.2.a: "Manassé Sogavare"
 Solomon_Islands.2.b: "Jimmy 'Rasta' Lusibaea"
 Solomon_Islands.3.t: "Assaut du Mouvement pour la liberté d'Isatabu sur Honiara"
 Solomon_Islands.3.d: "Le Mouvement de liberté d'Isatabu a lancé une vaste contre-offensive pour chasser l'influence malaitaise de l'île. Des combattants de guérilla ont surgi de la jungle pour assiéger la capitale, Honiara. Avec une police officielle fracturée selon les lignes ethniques, le pays s'est scindé en une guerre civile à grande échelle. Le Mouvement de liberté d'Isatabu exige l'expulsion totale des colons malaitais, tandis que le gouvernement prépare une défense sanglante du centre urbain. "
 Solomon_Islands.3.a: "La guerre dans le Pacifique."
 Solomon_Islands.4.t: "Crise aux îles Salomon"
 Solomon_Islands.4.d: "[SOL.GetNameWithFlag] a sombré dans un effondrement civil. L'administration du Premier ministre [SOL.GetLeader] est paralysée par les tensions croissantes entre le Mouvement de liberté d'Isatabu et la Malaita Eagle Force. Le conflit trouve ses racines dans les litiges sur la migration intérieure vers Guadalcanal et les droits fonciers autochtones. De façon critique, la mine de Gold Ridge et d'autres industries vitales ont cessé leurs activités, menaçant nos intérêts économiques dans le Pacifique Sud."
 Solomon_Islands.4.a: "Nous ne pouvons ignorer cette instabilité."
 Solomon_Islands.4.b: "Peu importe. Je suis [ROOT.GetLeader]"
 Solomon_Islands.5.t: "Demande de médiation"
 Solomon_Islands.5.d: "Dans une tentative désespérée d'éviter une catastrophe humanitaire totale, [FROM.GetNameWithFlag] a officiellement demandé que nous accueillions un sommet de paix. Leur proposition esquisse un cadre de réconciliation par la décentralisation et des réformes d'autonomie destinées à apaiser les factions ethniques. Ils ont en outre demandé un contingent de conseillers administratifs et militaires pour que le processus de réforme ne soit pas interrompu par l'ingérence des milices."
 Solomon_Islands.5.a: "Accepter le processus de paix"
 Solomon_Islands.5.b: "C'est notre lutte intérieure, que les autres restent à l'écart"
 Solomon_Islands.6.t: "Rejet de la médiation"
 Solomon_Islands.6.d: "[SOL.GetNameWithFlag] a sèchement rejeté notre offre de médiation dans la crise en cours. Dans un communiqué ferme, la direction a déclaré qu'elle ne tolérerait pas d'ingérence néocoloniale dans ses affaires intérieures. Elle a clairement indiqué que conseillers étrangers et ingérence diplomatique n'étaient pas les bienvenus, insistant sur le fait que les îles Salomon régleraient leurs propres différends sans tutelle extérieure. "
 Solomon_Islands.6.a: "Alors ils en affronteront seuls les conséquences."
 Solomon_IslandsNews.1000.t: "Cessez-le-feu négocié par l'Australie aux îles Salomon"
 Solomon_IslandsNews.1000.d: "Après des jours de négociations à la base de la RAAF de Townsville, dans le Queensland, un compromis a été trouvé. Le gouvernement de [SOL.GetNameWithFlag] a signé un traité de paix complet. [AST.GetNameWithFlag] s'est engagé à diriger l'équipe internationale de surveillance de la paix pour superviser une amnistie des armes de 30 jours et la destruction des armes rendues. Tandis que [AST.capital.GetName] reste méfiante d'un glissement de mission."
 Solomon_IslandsNews.1000.a: "La stabilité revient aux îles Salomon"
 Solomon_IslandsNews.1001.t: "Cessez-le-feu aux Îles Salomon"
 Solomon_IslandsNews.1001.d: "[FROM.GetNameWithFlag] a réussi à négocier un cessez-le-feu entre les factions en guerre de [SOL.GetNameWithFlag]. L'accord esquisse une feuille de route pour le désarmement et la réforme constitutionnelle. Toutes les parties ont convenu d'une cessation immédiate des hostilités et de la mise en place d'une force de surveillance neutre. "
 Solomon_IslandsNews.1001.a: "La stabilité revient aux îles Salomon"
 Solomon_IslandsNews.1002.t: "Coup d'État aux îles Salomon"
 Solomon_IslandsNews.1002.d: "La Malaita Eagle Force, organisation militante malaitaise, a pris la capitale. Utilisant des armes de police volées et soutenue par des éléments dissidents de la Police Field Force, la Malaita Eagle Force a encerclé la résidence du Premier ministre Bartholomew Ulufa'alu tôt ce matin. Sous forte garde et avec l'arsenal de la ville aux mains des rebelles, Ulufa'alu a été forcé de présenter sa démission. Le gouvernement soutenu par la Malaita Eagle Force se proclame désormais seule autorité à Honiara."
 Solomon_IslandsNews.1002.a: "Une tempête imminente"
 Solomon_IslandsNews.1003.t: "Les îles Salomon tombent dans la rébellion"
 Solomon_IslandsNews.1003.d: "La guerre civile s'est achevée par une victoire totale du Mouvement de liberté d'Isatabu. Après une longue campagne de guérilla, le Mouvement de liberté d'Isatabu a forcé l'effondrement de l'administration alignée sur la Malaita Eagle Force à Honiara."
 Solomon_IslandsNews.1003.a: "La démocratie tombe à Honiara."
 Solomon_IslandsNews.1004.t: "Fin du conflit civil des îles Salomon"
 Solomon_IslandsNews.1004.d: "La guerre civile s'est achevée par une victoire totale du Mouvement de liberté d'Isatabu. Après une longue campagne de guérilla, le Mouvement de liberté d'Isatabu a forcé l'effondrement de l'administration alignée sur la Malaita Eagle Force à Honiara."
 Solomon_IslandsNews.1004.a: "Quel est le prochain chapitre"
 Solomon_IslandsNews.1005.t: "Fin du conflit civil des îles Salomon"
 Solomon_IslandsNews.1005.d: "Les opérations conjointes de la Malaita Eagle Force et des restes de la police nationale ont enfin écrasé l'insurrection du Mouvement de liberté d'Isatabu. À la suite d'une offensive brutale dans l'intérieur de Guadalcanal. "
 Solomon_IslandsNews.1005.a: "Quel est le prochain chapitre"
 SOL_Histoical_path_TT: "C'est le §Ychoix historique§! pour [SOL.GetNameWithFlag]"
 SOL_Lead_to_hostilities_TT: "Cela mènera à des §Rhostilités§! aux [SOL.GetNameWithFlag]"
 SOL_IFM: "Mouvement pour la liberté Isatabu"