 raid_type_ENG_raid_nigeria: "Operación Guardia del Delta"
 raid_type_ENG_raid_zimbabwe: "Operación Salvaguarda"
 raid_type_ENG_raid_zimbabwe_desc: "El tirano que gobierna Zimbabue debe ser derrocado de inmediato, ya que no se puede confiar en él para dirigir un país. Sus acciones contra las personas de origen británico y el pueblo nativo de Zimbabue han demostrado que no tiene líneas rojas y, claramente, está dispuesto a cruzar las nuestras."
 ENG_dartmouth_naval_college_expansion: "Expansión del Colegio Naval de Dartmouth"
 ENG_dartmouth_naval_college_expansion_desc: "La expansión del Colegio Naval de Dartmouth marca una inversión significativa en la educación y formación marítima dentro del Reino Unido. Basándose en su rica tradición naval, la expansión contempla instalaciones de última generación, programas de formación avanzados y un aumento en la capacidad para satisfacer la creciente demanda de personal naval cualificado."
 ENG_type_32_frigate_guardian_class: "Fragata Clase Guardian Tipo 32"
 ENG_type_32_frigate_guardian_class_desc: "La fragata Tipo 32 es una fragata del Reino Unido para la Royal Navy. Fue anunciada oficialmente en noviembre de 2020 por el Primer Ministro Boris Johnson como resultado de la Revisión Integrada. Construida después de las fragatas Tipo 26 y Tipo 31, la nave será de propósito general y modular en su diseño, y se espera que ayude a aumentar la flota de escolta de superficie de la Royal Navy."
 ENG_charles_harmony: "Gira de la armonía del príncipe Carlos británico"
 ENG_election_unlock_tt: "§YEste enfoque se puede desbloquear cuando se haya formado un nuevo gobierno tras las elecciones.§!"
 ENG_army_special_operations_brigade_desc: "La Brigada de Operaciones Especiales del Ejército representa la cima de las capacidades militares del Reino Unido, dedicada a ejecutar misiones clandestinas y desafiantes. Compuesta por personal excepcional procedente de diferentes ramas, esta brigada de élite opera con una precisión y adaptabilidad inigualables. Equipada con tecnología de vanguardia y un entrenamiento riguroso, la unidad está preparada para el contraterrorismo, la recolección de inteligencia y otras operaciones de alto impacto, consolidando su papel como un activo clave en el aparato de defensa y seguridad del país."
 ENG_glasgow_shipbuilidng_tt: "This effect can be improved by completing §Y$ENG_refine_natural_bauxite$§!"
 ENG_refine_natural_bauxite_tt: "Esto mejorará los efectos de §Y$ENG_glasgow_shipbuilding$§!"
 ENG_the_queens_speech: "[ENG_the_queens_speech_focus_title]"
 ENG_the_queens_speech_desc_key: "La nación escucha de manera diferente cuando el Soberano habla como la voz del estado, no de la ceremonia. En el Discurso de la Reina, se declarará un nuevo acuerdo político y la agenda del gobierno estará vinculada al mandato de la Corona. A partir de este día, la política llevará autoridad real, y Gran Bretaña actuará como un reino con una sola voluntad."
 ENG_the_kings_speech_desc_key: "La nación escucha de manera diferente cuando el Soberano habla como la voz del estado, no de la ceremonia. En el Discurso del Rey, se declarará un nuevo acuerdo político y la agenda del gobierno estará vinculada al mandato de la Corona. A partir de este día, la política llevará autoridad real, y Gran Bretaña actuará como un reino con una sola voluntad."
 ENG_inner_circle_andrew.06.t: "El príncipe Andrés es apartado de la familia real"
 ENG_inner_circle_andrew.06.a: "No puede permanecer aquí por más tiempo"
 ENG_inner_circle_philip.04.t: "El príncipe Felipe ha muerto"
 ENG_inner_circle_philip.04.d: "El príncipe Felipe, duque de Edimburgo, ha fallecido tras décadas en el centro de la vida pública de la realeza. Su muerte marca el fin de una era para la monarquía y se sentirá en todo el Reino Unido."
 ENG_inner_circle_philip.04.a: "La nación está de luto"
