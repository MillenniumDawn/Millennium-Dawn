 ukraine_modernize_sov_equipment_brdm_2_modernization_arey_wait_tt: "§Y«Арей»§! представит §YБКМ «Гекон»§! примерно через §Y$DAYS$§! дн."
 ukraine_modernize_sov_equipment_brdm_2_modernization_both_wait_tt: "Оба прототипа будут представлены примерно через §Y$DAYS$§! дн. Затем мы примем на вооружение один из них."
 ukraine_modernize_sov_equipment_brdm_2_modernization_arey_rival_tt: "§Y«Арей»§!, конструкторская группа из добровольцев армии и Национальной гвардии, строит похожую машину. Мы решаем, кого поддержать."
