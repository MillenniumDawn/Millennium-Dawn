 ukraine_sov_service_factory: "Сначала оплатить производственную линию"
 ukraine_sov_factory_plan_tt: "У завода меньше §Y2§! военных фабрик. Мы оплачиваем новую производственную линию, а когда она будет готова, принимаем проект на вооружение и начинаем производство."
 ukraine_sov_factories_wait_tt: "Новая производственная линия будет готова примерно через §Y$DAYS$§! дн., если регион с заводом принадлежит нам и находится под нашим контролем; иначе она подождёт, пока это не произойдёт. Затем каждый ожидающий её проект принимается на вооружение и запускается в производство, а его программа продолжается."
 ukraine_sov_factories_already_ordered_tt: "Производственная линия на этом заводе уже оплачена. Этот проект тоже её ждёт."
 ukraine_praktyka_otaman.1.a_no_tech: "Построить новый корпус 6x6, разработав недостающие технологии"
 ukraine_praktyka_otaman.1.b_no_tech: "Перестроить БТР-60 в 8x8, разработав недостающие технологии"
 ukraine_praktyka_otaman.1.c_no_tech: "Финансировать обе линии, разработав недостающие технологии"
 ukraine_praktyka_otaman.9.b_no_tech: "Разработать «Хорунжий» и недостающие технологии"
 ukraine_praktyka_otaman_no_tech_tt: "Нам не хватает некоторых технологий для этого проекта. «Практыка» разработает и их: работа займёт на §Y45§! дн. больше, пока она идёт, наши исследования замедляются, а по завершении мы получим эти технологии."
 ukraine_praktyka_otaman_no_tech_mission_note: "\n\n«Практыка» также разрабатывает недостающие нам технологии для этого проекта. Когда работа будет завершена, мы получим их, а скорость исследований вернётся к норме."
