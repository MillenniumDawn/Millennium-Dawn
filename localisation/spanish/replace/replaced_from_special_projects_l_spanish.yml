 sp_improved_nuclear_ballistic_warhead_delivery_systems: "Sistema de Entrega de Ojivas Balísticas Mejorado"
 sp_improved_nuclear_ballistic_warhead_delivery_systems_desc: "Durante nuestro desarrollo de las Ojivas Nucleares, hemos podido mejorar e incrementar el alcance de nuestro equipo de misiles."
 sp_fusion_reactors_special_project_idea: "Reactores de Fusión"
 sp_improved_nuclear_reactor_centrifuge_technology_idea: "Centrifugadora de Reactor Nuclear Mejorada"
 sp_improved_based_solar_farms_idea: "Granjas Solares Mejoradas"
 sp_construction_exoskeletons_idea: "Exoesqueletos de Construcción"
