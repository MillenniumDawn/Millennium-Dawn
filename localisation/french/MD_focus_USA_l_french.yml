 USA_ban_election_fraud: "Stop Election Fraud Events"
 USA_ban_election_fraud_desc: "Congress outlaws stealing elections. The fraud option will no longer appear in presidential elections. We will no longer see the Election Fraud events while this is active."
 USA_allow_election_fraud: "Allow Election Fraud Events"
 USA_allow_election_fraud_desc: "Congress repeals the ban on election fraud. Presidential elections can be stolen again. We will start to see the Election Fraud events."
 department_of_state.201.t: "Afghanistan Asks Us to Return"
 department_of_state.201.d: "The Taliban are winning back the ground we left. [AFG.GetLeader] has asked us to send our troops back and take up the mission again before Kabul falls."
 department_of_state.201.a: "We will not abandon them"
 department_of_state.201.b: "Afghanistan must stand on its own"
 department_of_state.202.t: "The Americans Refuse to Return"
 department_of_state.202.d: "Washington has turned down our request. Its troops will not come back, and we must hold the line against the Taliban ourselves."
 department_of_state.202.a: "Then we fight alone"
 usa.204.t: "Plane Crashes Into Bank of America Plaza"
 usa.204.d: "Several months after the terrorist attacks, a 15-year-old boy stole a light aircraft in Tampa, Florida, and deliberately crashed it into the Bank of America Plaza. The incident was reportedly inspired by the attacks. No one inside the building was killed or injured; the young pilot was the sole fatality."
 usa.204.a: "A disturbing echo of the attacks"
 raid_type_raid_baath_desc: "Special forces track down and capture senior Ba'athist leaders still at large in Iraq, dismantling the remnants of the old regime."