 #Ideas
 FSA_extremism1: "Low Radical Influence"
 FSA_extremism1_desc: "While the Free Syrian Army was originally formed by defected officers advocating for a democratic and secular alternative to the regime, the prolonged conflict and decentralized nature of the opposition have allowed more radical factions to gain ground. Islamist-leaning groups such as Ahrar al-Sham and Al-Nusra Front have increasingly operated alongside or within FSA-branded coalitions. These groups have blurred the lines between moderate and extremist elements as these groups use the broader FSA label to gain legitimacy and resources."
