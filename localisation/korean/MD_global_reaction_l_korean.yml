l_korean:
 SOV_Global.2.t: "아제르바이잔과 전쟁을 개시한 러시아"
 SOV_Global.2.d: "러시아 정부가 아제르바이잔의 비우호적인 정권을 제거하기 위해 군사 작전 개시를 발표했습니다. 우리도 이 전쟁에 개입해야 하지 않을까요?"
 SOV_Global.2.a: "아제르바이잔의 위협을 제거하자!"
 SOV_Global.2.b: "개입하지 않아야 한다."
 SOV_Global.3.t: "아제르바이잔과 전쟁을 개시한 러시아"
 SOV_Global.3.d: "러시아 정부가 아제르바이잔을 제거하기 위해 군사 작전 개시를 발표했습니다. 우리도 이 전쟁에 개입해야 하지 않을까요?"
 SOV_Global.3.a: "러시아에 선전포고를 하고 아제르바이잔을 구원할 것이다!"
 SOV_Global.3.b: "아르메니아에 선전포고할 것이다."
 SOV_Global.3.c: "군사 고문단을 파견할 것이다..."
 SOV_Global.3.f: "개입하지 않아야 한다."
 SOV_Global.4.t: "아제르바이잔과 전쟁을 개시한 러시아"
 SOV_Global.4.d: "러시아 정부가 아제르바이잔을 제거하기 위해 군사 작전 개시를 발표했습니다. 우리도 이 전쟁에 개입해야 하지 않을까요?"
 SOV_Global.4.a: "아제르바이잔의 위협을 제거하자!"
 SOV_Global.4.b: "개입하지 않아야 한다."
 SOV_Global.5.t: "벨라루스와 전쟁을 개시한 러시아"
 SOV_Global.5.d: "러시아 정부가 벨라루스를 제거하기 위해 군사 작전 개시를 발표했습니다. 우리가 러시아 침략의 다음 희생양이 될지도 모른다는 우려가 커지고 있습니다. 그들의 침공에 대비해야 하지 않을까요?"
 SOV_Global.5.a: "대러시아 방어 정책 선포"
 SOV_Global.5.b: "러시아의 침공이라니? 말도 안 된다."
 SOV_Global.6.t: "방어 정책을 선포한 [FROM.GetName]"
 SOV_Global.6.d: "[FROM.GetName]은(는) 최근 우리가 단행한 군사 작전에 겁을 먹고 우리에 맞서는 방어 정책을 선포했습니다. 해당 정부는 우리와의 국경에 추가 요새를 건설하겠다고 발표했습니다."
 SOV_Global.6.a: "어디 잘 되나 봅시다"
 SOV_Global.17.t: "벨라루스와 전쟁을 개시한 러시아"
 SOV_Global.17.d: "러시아 정부가 벨라루스를 제거하기 위해 군사 작전 개시를 발표했습니다. 우리가 러시아 침략의 다음 희생양이 될지도 모른다는 우려가 커지고 있습니다. 그들의 침공에 대비해야 하지 않을까요?"
 SOV_Global.17.a: "대러시아 방어 정책 선포"
 SOV_Global.17.b: "러시아의 침공이라니? 말도 안 된다."
 SOV_Global.7.t: "타지키스탄과 전쟁을 개시한 러시아"
 SOV_Global.7.d: "러시아 정부가 타지키스탄을 제거하기 위해 군사 작전 개시를 발표했습니다. 우리도 이 전쟁에 개입해야 하지 않을까요?"
 SOV_Global.7.a: "이 전쟁에 개입할 것이다"
 SOV_Global.7.b: "개입하지 않아야 한다."
 SOV_Global.8.t: "키르기스스탄과 전쟁을 개시한 러시아"
 SOV_Global.8.d: "러시아 정부가 키르기스스탄을 제거하기 위해 군사 작전 개시를 발표했습니다. 우리도 이 전쟁에 개입해야 하지 않을까요?"
 SOV_Global.8.a: "이 전쟁에 개입할 것이다"
 SOV_Global.8.b: "개입하지 않아야 한다."
 SOV_Global.9.t: "투르크메니스탄과 전쟁을 개시한 러시아"
 SOV_Global.9.d: "러시아 정부가 투르크메니스탄을 제거하기 위해 군사 작전 개시를 발표했습니다. 우리도 이 전쟁에 개입해야 하지 않을까요?"
 SOV_Global.9.a: "이 전쟁에 개입할 것이다"
 SOV_Global.9.b: "개입하지 않아야 한다."
 SOV_Global.10.t: "리투아니아와 전쟁을 개시한 러시아"
 SOV_Global.10.d: "러시아가 리투아니아 영토 내에서 군사 작전을 개시했습니다. 어쩌면 지금이야말로 우리가 선조들의 역사적 고토라 여기는 영토 일부라도 되찾을 수 있는 기회일지 모릅니다. 이 전쟁에 개입할 가치가 있을까요?"
 SOV_Global.10.a: "이 전쟁에 개입할 것이다"
 SOV_Global.10.b: "개입하지 않아야 한다."
 SOV_Global.11.t: "우즈베키스탄과 전쟁을 개시한 러시아"
 SOV_Global.11.d: "러시아 정부가 우즈베키스탄을 제거하기 위해 군사 작전 개시를 발표했습니다. 우리도 이 전쟁에 개입해야 하지 않을까요?"
 SOV_Global.11.a: "이 전쟁에 개입할 것이다"
 SOV_Global.11.b: "개입하지 않아야 한다."
 SOV_Global.12.t: "우즈베키스탄과 전쟁을 개시한 러시아"
 SOV_Global.12.d: "러시아 정부가 우즈베키스탄을 제거하기 위해 군사 작전 개시를 발표했습니다. 우리도 이 전쟁에 개입해야 하지 않을까요?"
 SOV_Global.12.a: "이슬람 혁명수비대를 파견할 것이다"
 SOV_Global.12.b: "개입하지 않아야 한다."
 SOV_Global.13.t: "우즈베키스탄과 전쟁을 개시한 러시아"
 SOV_Global.13.d: "러시아 정부가 우즈베키스탄을 제거하기 위해 군사 작전 개시를 발표했습니다. 우리도 이 전쟁에 개입해야 하지 않을까요?"
 SOV_Global.13.a: "군사 고문단을 파견할 것이다..."
 SOV_Global.13.b: "개입하지 않아야 한다."
 SOV_Global.14.t: "발트 3국에 적대감을 드러낸 러시아"
 SOV_Global.14.d: "러시아가 발트해 영토를 자국 영토로 편입하겠다는 의도를 공공연히 선언하고 있습니다. 이는 우리의 독립에 대한 직접적인 위협이므로, 필요한 조치를 취해야만 합니다."
 SOV_Global.14.a: "대러시아 방어 정책 선포"
 SOV_Global.14.b: "러시아의 침공이라니? 말도 안 된다."
 SOV_Global.15.t: "우크라이나와 전쟁을 개시한 러시아"
 SOV_Global.15.d: "러시아가 우크라이나 영토를 자국 영토로 편입하겠다는 의도를 공공연히 선언하고 있습니다. 이는 우리의 독립에 대한 직접적인 위협이므로, 필요한 조치를 취해야만 합니다."
 SOV_Global.15.a: "대러시아 방어 정책 선포"
 SOV_Global.15.b: "러시아의 침공이라니? 말도 안 된다."
 SOV_Global.16.t: "방어 정책을 선포한 [FROM.GetName]"
 SOV_Global.16.d: "[FROM.GetName]은(는) 최근 우리가 단행한 군사 작전에 겁을 먹고 우리에 맞서는 방어 정책을 선포했습니다. 해당 정부는 우리와의 국경에 추가 요새를 건설하겠다고 발표했습니다."
 SOV_Global.16.a: "어디 잘 되나 봅시다"
 SOV_Global.19.t: "우크라이나 전쟁"
 SOV_Global.19.d: "우크라이나가 러시아와의 전쟁에서 명백히 패배하고 있습니다. 러시아가 모든 것을 독식하지 못하도록 우리가 개입해야 하지 않을까요?"
 SOV_Global.19.a: "기회를 잡아보자"
 SOV_Global.19.b: "그러지 않는 것이 좋아보인다..."
 SOV_Global.20.t: "반아르메니아 연합"
 SOV_Global.20.d: "아제르바이잔 정부는 캅카스 지역에서의 아르메니아 팽창에 극도로 우려하고 있으며, 아르메니아의 공격적인 대외 정책에 맞서 군사 동맹을 결성하여 침략자의 공격에 공동으로 방어하자고 제안합니다."
 SOV_Global.20.a: "훌륭한 생각이다!"
 SOV_Global.20.b: "거절한다"
 SOV_Global.21.t: "반아르메니아 연합"
 SOV_Global.21.d: "조지아가 아르메니아의 공격적인 정책에 맞서 군사 동맹을 결성하자는 우리의 제안에 동의했습니다."
 SOV_Global.21.a: "알았다"
 SOV_Global.22.t: "반아르메니아 연합"
 SOV_Global.22.d: "조지아가 아르메니아의 공격적인 대외 정책에 맞선 군사 동맹 결성 제안을 거부했습니다. 아무래도 그들은 자신들의 독립을 포기하기로 이미 마음먹은 것 같습니다."
 SOV_Global.22.a: "유감이군"
 SOV_Global.23.t: "반아르메니아 연합"
 SOV_Global.23.d: "조지아와 아제르바이잔이 우리에 맞서는 군사 동맹을 결성했다고 발표했습니다! 아무래도 그들은 우리가 자신들을 공격할까 봐 몹시 두려워하고 있는 것 같습니다."
 SOV_Global.23.a: "어디 실컷 두려워하라지"
 SOV_Global.18.t: "조지아 봉기"
 SOV_Global.18.d: "예상치 못하게도, 오늘 아침 무장 집단들이 조지아 수도권의 모든 주요 기관을 장악하고 조국의 독립을 위한 무장 투쟁을 선언했습니다. 우리 정보기관은 이것이 러시아 정보기관의 공작임을 밝혀냈습니다. 아무래도 러시아는 우리를 내부에서부터 무너뜨리려는 작정인 것 같습니다."
 SOV_Global.18.a: "모스크바는 이에 대한 대가를 치를 것이다"
 SOV_Global.24.t: "조지아 저항군"
 SOV_Global.24.d: "우리 정보기관은 과거 조지아의 수도권 지역에서 모든 활동을 사보타주하기 시작한 조지아 무장 집단의 활동을 보고했습니다. 누군가 내부에서부터 정세를 뒤흔들려는 것 같습니다."
 SOV_Global.24.a: "우리는 이를 막아야 한다"
 SOV_Global.25.t: "아제르바이잔 저항군"
 SOV_Global.25.d: "우리 정보기관은 과거 아제르바이잔의 수도권 지역에서 모든 활동을 사보타주하기 시작한 아제르바이잔 무장 집단의 활동을 보고했습니다. 누군가 내부에서부터 정세를 뒤흔들려는 것 같습니다."
 SOV_Global.25.a: "우리는 이를 막아야 한다"
 SOV_Global.26.t: "아제르바이잔 봉기"
 SOV_Global.26.d: "예상치 못하게도, 오늘 아침 무장 집단들이 아제르바이잔 수도권의 모든 주요 기관을 장악하고 조국의 독립을 위한 무장 투쟁을 선언했습니다. 우리 정보기관은 이것이 러시아 정보기관의 공작임을 밝혀냈습니다. 아무래도 러시아는 우리를 내부에서부터 무너뜨리려는 작정인 것 같습니다."
 SOV_Global.26.a: "모스크바는 이에 대한 대가를 치를 것이다"
 SOV_Global.27.t: "압하지야 저항군"
 SOV_Global.27.d: "우리 정보기관은 과거 압하지야의 수도권 지역에서 모든 활동을 사보타주하기 시작한 압하지야 무장 집단의 활동을 보고했습니다. 누군가 내부에서부터 정세를 뒤흔들려는 것 같습니다."
 SOV_Global.27.a: "우리는 이를 막아야 한다"
 SOV_Global.28.t: "압하지야 봉기"
 SOV_Global.28.d: "예상치 못하게도, 오늘 아침 무장 집단들이 압하지야 수도권의 모든 주요 기관을 장악하고 조국의 독립을 위한 무장 투쟁을 선언했습니다. 우리 정보기관은 이것이 러시아 정보기관의 공작임을 밝혀냈습니다. 아무래도 러시아는 우리를 내부에서부터 무너뜨리려는 작정인 것 같습니다."
 SOV_Global.28.a: "모스크바는 이에 대한 대가를 치를 것이다"
 SOV_Global.29.t: "아자리아 봉기"
 SOV_Global.29.d: "예상치 못하게도, 오늘 아침 무장 집단들이 아자리아 수도권의 모든 주요 기관을 장악하고 조국의 독립을 위한 무장 투쟁을 선언했습니다. 우리 정보기관은 이것이 러시아 정보기관의 공작임을 밝혀냈습니다. 아무래도 러시아는 우리를 내부에서부터 무너뜨리려는 작정인 것 같습니다."
 SOV_Global.29.a: "튀르키예는 이에 대한 대가를 치를 것이다"
 SOV_Global.30.t: "튀르키예 군사 교관"
 SOV_Global.30.d: "튀르키예 정부는 우리 병사들을 지원하고 현대전 전술을 훈련시키기 위해 자국의 군사 교관을 파견할 준비가 되어 있습니다."
 SOV_Global.30.a: "동의한다"
 SOV_Global.30.b: "거절한다"
 SOV_Global.31.t: "[ADJ.GetName] 내의 군사 교관"
 SOV_Global.31.d: "그들은 자국군을 지원하기 위한 우리 교관단의 수용에 동의했습니다."
 SOV_Global.31.a: "알았다"
 SOV_Global.32.t: "[ADJ.GetName] 내의 군사 교관"
 SOV_Global.32.d: "그들은 자국군을 지원하기 위한 우리 교관단의 수용을 거부했습니다."
 SOV_Global.32.a: "알았다"
 SOV_Global.33.t: "아르메니아 내 친러시아 혁명"
 SOV_Global.33.d: "러시아 모스크바 정권은 우리가 모스크바로부터 자유로운 세력이라는 사실을 받아들일 수 없는 것 같습니다. 러시아는 마침내 마지막 수단을 동원하여 아르메니아 내 남은 충성 세력을 압박해 우리의 합법적인 정부에 대항하는 혁명을 일으켰습니다!"
 SOV_Global.33.a: "모스크바는 이에 대한 대가를 치를 것이다"
 SOV_Global.34.t: "우리에게 나흐츠반을 요구한 아르메니아"
 SOV_Global.34.d: "아르메니아 정부는 뻔뻔하고 무례하게도 나흐츠반 지역을 자신들의 통제 하에 즉시 양도할 것을 요구하며, 이 최후통첩성 요구를 받아들이지 않을 경우 심각한 결과가 초래될 것이라고 우리를 위협하고 있습니다."
 SOV_Global.34.a: "그들의 요구에 굴복하자"
 SOV_Global.34.b: "절대 안 된다"
 SOV_Global.35.t: "나히체반 분쟁"
 SOV_Global.35.d: "아제르바이잔 정부는 우리 앞에서 자신들의 무력함을 깨닫고 나히체반을 우리에게 할양했습니다."
 SOV_Global.35.a: "알았다"
 SOV_Global.36.t: "나히체반 분쟁"
 SOV_Global.36.d: "아제르바이잔 정부는 우리 앞에서 자신들의 무력함을 깨닫고 나히체반을 우리에게 할양했습니다."
 SOV_Global.36.a: "그들의 명줄도 얼마 남지 않았군"
 SOV_Global.37.t: "나흐츠반 분쟁"
