 NKO_weapons_for_rebels_desc: "."
 NKO_united_again:0 "Unidos Novamente"
 NKO_united_again_desc: "."
 NKO_expand_local_industry:0 "Investimentos na Indústria Nacional"
 NKO_expand_local_industry_desc:0 "Devemos expandir a produção nacional, pois sem uma indústria forte nosso país não resistirá à pressão econômica de nossos inimigos"
 NKO_more_arms_factories:0 "Mais Fábricas Militares"
 NKO_field_hospitals:0 "Hospitais de Campanha"
 NKO_field_hospitals_desc:0 "Empregaremos mais hospitais de campanha para que, em caso de guerra, possamos tratar os soldados o mais rápido possível"
 NKO_reform_youth:0 "Reforma da Guarda dos Trabalhadores"
 NKO_reform_youth_desc:0 "Era necessário reformar essa estrutura há muito tempo; sua funcionalidade original está há muito defasada em relação à modernidade"
 korea_north.7.t:0 "As drogas se espalham por nossas ruas"
 korea_north.7.d:0 "As ruas estão mergulhadas no caos enquanto drogas poderosas como metanfetamina e cocaína inundam os bairros, despedaçando comunidades. Famílias são destruídas, o crime aumenta e ninguém mais se sente seguro."
 korea_north.7.a:0 "Nossos inimigos cairão"
 korea_north.8.t:0 "Nossas drogas foram barradas na fronteira"
 korea_north.8.d:0 "Tudo corria bem até que chegou a mensagem: o carregamento foi barrado na fronteira. Agora, tudo está em jogo. Meses de planejamento foram por água abaixo "
 korea_north.8.a:0 "Tentaremos de novo"
 korea_north.9.t:0 "Dinheiro falso assola nosso sistema bancário"
 korea_north.9.d:0 "Dinheiro falso está por toda parte, passando de mão em mão e por empresas sem ser detectado, deixando o caos em seu rastro. Lojas locais, vendedores ambulantes e até grandes varejistas estão sendo lesados, pois as notas falsas circulam mais rápido do que as autoridades conseguem responder."
 korea_north.9.a:0 "O imperialismo cai"
 korea_north.10.t:0 "Nosso Dinheiro Falso Foi Apreendido pelas Autoridades"
 korea_north.10.d:0 "As autoridades apreenderam este carregamento, mas este não é o fim, é apenas o começo."
 korea_north.10.a:0 "Produzam mais!"
 NKO_accept_money:0 "§YAceitar§! Dinheiro"
 NKO_medicine_relief:0 "§YEnviar§! Ajuda em Medicamentos"
 NKO_build_farms1:0 "Construção de §YFazendas§!"
 NKO_build_farms1_desc:0 "Construir as fazendas para alimentar nosso povo é indispensável; esta fazenda está em construção"
 korea_herb:0 "§YApoio à Reunificação§!"
 korea_herb_output:0 "§YApoio à Reunificação§!"
 korea_herb_output_text: "§Y[?KOR.SFR]%§!"
 NKO_social_security:0 "Ministério da Segurança Social"
 NKO_social_security_desc:0 "O Ministério da Segurança Social, comumente conhecido como BoAn ou Ministério da Segurança do Povo, é o ministério do interior e a principal agência de aplicação da lei dentro da Coreia do Norte. O ministério serve como a força oficial de segurança pública e interna, responsável por manter a ordem pública e proteger instalações-chave, incluindo ferrovias e outras formas de transporte."
 NKO_security_forces:0 "Forças de Segurança Social"
 NKO_security_forces_desc:0 "As Forças de Segurança Social são uma força paramilitar norte-coreana que realiza diversas tarefas de segurança interna e de fronteira"
 NKO_railway_bureau:0 "Birô de Segurança Ferroviária"
 NKO_railway_bureau_desc:0 "Birô de Segurança Ferroviária - guarda as rotas importantes de viagem e transporte dentro da RPDC"
 NKO_finacial_bureau:0 "Agência de Inteligência Financeira"
 NKO_finacial_bureau_desc:0 "Agência de Inteligência Financeira - combate a lavagem de dinheiro, a extorsão e outros crimes financeiros"
 NKO_corrections_bureau:0 "Birô Penitenciário"
 NKO_corrections_bureau_desc:0 "O Birô Penitenciário opera o brutal sistema prisional da Coreia do Norte"
 NKO_social_security_forces_idea:0 "Forças de Segurança Social"
 NKO_social_security_idea:0 "Ministério da Segurança Social"
 NKO_black_market:0 "Terceiro Andar"
 NKO_black_market_desc:0 "O Terceiro Andar é um termo de uso geral que se refere à interação de três birôs subordinados à Secretaria do Comitê Central do Partido. O Birô 35, o Birô 38 e o Birô 39, em coordenação com a Secretaria Pessoal, têm a tarefa de coletar inteligência, obter moeda estrangeira para o partido e as elites centrais e gerenciar parte do dinheiro do partido e da Família Kim.  Os agentes do Terceiro Andar, estacionados em mais de 20 países do mundo, também eram responsáveis pela compra de uma variedade de bens para as elites da RPDC e pela coleta de inteligência fora das redes de informação dedicadas da RPDC. O termo Terceiro Andar refere-se à localização original desses escritórios no terceiro andar do prédio de escritórios de Kim Jong-il no Complexo de Escritórios do Comitê Central do KWP, no Distrito Central de Pyongyang.  O Terceiro Andar é tecnicamente subordinado ao Comitê Central do Partido.  No entanto, está diretamente ligado à Família Kim."
