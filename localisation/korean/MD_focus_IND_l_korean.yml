 indonesia_confront_australia_threat: "동티모르에 대해 오스트레일리아를 협박하는 인도네시아!"
 indonesia.5865.t: "재앙이 찾아오고 있다!"
 indonesia.5865.d: "인도네시아에서는 수많은 재난이 발생할 것입니다. 인도네시아의 안정도를 확보하려면 \\"결정\\" 탭에서 \\"인도네시아의 끔찍한 불운\\" 항목에 주어진 과제를 완료하십시오. 첫 번째 과제는 산업 재해를 방지하기 위해 칼리만탄에 조선소를 건설하는 것입니다. 행운을 빕니다!"
 indonesia.5865.a: "알겠다"
 indonesia.76854.t: "합병을 요구하는 인도네시아"
 indonesia.76854.d: "지진 이후 우리를 도와준 인도네시아 정부가 자신들과 힘을 합칠 것을 요청하고 있습니다. 그들과 합친다면 우리가 싸워 온 모든 것을 잃게 되지만, 이는 모두 평화의 이름으로 이루어집니다. 합치지 않는다면 분쟁이 다시 불붙는 것을 보게 될 것입니다..."
 indonesia.76854.a: "그렇게 하자"
 indonesia.76854.b: "안된다"
 IND_disasters_mechanic_532121: "재난의 경고"
 indonesia.577.d1: "파괴적인 쓰나미가 반다아체와 주의 다른 지역을 강타했습니다. 수년간의 게릴라전과 저항으로 이미 피폐해진 지역이 이전보다 더욱 황폐해졌습니다. 이 지역의 복구 노력을 시작하는 것이 시급하며, 그렇지 않으면 또 다른 봉기의 위험이 있습니다."
 IND_Aceh_insurgency_desc: "아체는 1976년부터 혼란과 반란 상태에 있으며, 이는 우리나라에 불안정과 불필요한 유혈 사태를 초래하고 있습니다. 우리 군은 이 반군을 상대하는 데 지나치게 집중하고 있으며, 이로 인해 군사적으로 뒤처지고 있습니다."
 IND_Aceh_insurgency2_desc: "아체는 1976년부터 혼란과 반란 상태에 있으며, 이는 우리나라에 불안정과 불필요한 유혈 사태를 초래하고 있습니다. 우리 군은 이 반군을 상대하는 데 지나치게 집중하고 있으며, 이로 인해 군사적으로 뒤처지고 있습니다."
 IND_Aceh_insurgency3_desc: "아체는 1976년부터 혼란과 반란 상태에 있으며, 이는 우리나라에 불안정과 불필요한 유혈 사태를 초래하고 있습니다. 우리 군은 이 반군을 상대하는 데 지나치게 집중하고 있으며, 이로 인해 군사적으로 뒤처지고 있습니다."
 IND_Aceh_insurgency4_desc: "아체는 1976년부터 혼란과 반란 상태에 있으며, 이는 우리나라에 불안정과 불필요한 유혈 사태를 초래하고 있습니다. 우리 군은 이 반군을 상대하는 데 지나치게 집중하고 있으며, 이로 인해 군사적으로 뒤처지고 있습니다."
 IND_finished_disaster: "재난 조기 예방"
 IND_finished_disaster_desc: "와, 마지막 재난을 조기에 예방하셨군요! 잘하셨습니다."
 IND_purchase_rafale_jets: "라팔 전투기"
 IND_purchase_rafale_jets_desc: "서방의 친구들이 최신 최고의 다목적 전투기를 제안했지만 대가가 따릅니다. 이들과 더 가까워지고 서방의 항공기를 손에 넣을 수 있으므로 이를 고려해야 합니다."
 IND_cede_riau: "리아우 양도"
 IND_cede_riau_desc: "리아우를 양도하면 많은 문제가 해결될 것입니다. 작은 섬 하나를 두고 싸울 가치는 없습니다."
 IND_our_policies_tt: "§Y$IND_new_capital$§! 또는 §Y$IND_new_silkroad$§! 중 하나를 완료해야 합니다"
 IND_grasberg_mine_exploitation: "그라스버그 광산 개발"
 IND_grasberg_mine_exploitation_desc: "서파푸아의 그라스버그 광산은 세계 최대 규모의 금·구리 광산 중 하나입니다. 인도네시아를 귀금속 시장에 더 잘 편입시키기 위해 이 지역의 매장량을 확장하고 개발해야 합니다."
 IND_separate_school: "남학교와 여학교 분리"
 IND_separate_school_desc: "우리 학생들은 교실에서 서로를 쳐다보느라 산만해질 것입니다. 남학생과 여학생을 위한 별도의 새 학교를 지어야 합니다."
 IND_dont_separate_school: "한 학교에서 함께 공부하는 남학생과 여학생"
 IND_dont_separate_school_desc: "보수파가 학교 분리를 요구하지만 그들의 요구에 굴복하는 것은 어리석은 일입니다. 새 학교를 지으면 부채가 쌓이고 학생들의 교육도 지연될 것입니다!"
 IND_dem_entrepreneur: "기업가 정신 지원"
 IND_dem_entrepreneur_desc: "점점 디지털화되는 세계에서, 국민이 인도네시아를 세계 수준으로 끌어올릴 수 있도록 기업가 정신에 자금을 지원하는 것이 중요합니다."
 IND_equal_opportunities: "기회 균등"
 IND_equal_opportunities_desc: "균등한 기회는 특히 이곳 인도네시아에서 많은 이들이 누리지 못하는 사치입니다. 그러나 사람들에게 토지를 나누어 주면 이를 바꿀 수 있습니다."
 IND_reparations_give: "배상금 지급"
 IND_reparations_give_desc: "사과의 표시이자 우리나라의 이미지를 높이는 수단으로, 자원병 유족들에게 금전적 보상을 제공합시다."
 IND_demand_reparations: "배상금 요구"
 IND_demand_reparations_desc: "우리 국민의 유족들에게는 즉각적인 금전적 보상이 필요합니다. 이 보상을 받지 못한다면 무력으로 받아낼 것입니다..."
 IND_crackdown_counterfeit: "위조 단속"
 IND_crackdown_counterfeit_desc: "위조 지폐가 우리나라에 만연하고 있습니다. 이는 경제에 좋지 않습니다. 이러한 관행을 단속하고 경제 회복에 한 걸음 더 가까이 다가가야 합니다."
 IND_counterfeit: "위조 관행"
 IND_counterfeit_desc: "약간의 위조는 우리나라에 해가 되지 않을 것입니다. 국민이 시위하지 않고 만족하는 한 우리의 주머니도 만족할 것입니다."
 IND_maluku_back_christians: "기독교인을 지지하라!"
 IND_maluku_back_christians_desc: "소외된 기독교 인구를 지지해야 합니다. 이 어려운 시기에 그들을 위해 할 수 있는 최소한의 일입니다."
 IND_national_awakening: "민족각성당의 정책 의제"
 IND_national_awakening_desc: "인도네시아의 보수 정당인 민족각성당이 다시 한번 정치 무대에 등장했습니다. 이번에 이들이 어떻게 나아갈지는 아무도 알 수 없습니다."
 IND_parliament_stormed: "의회 점거!"
 IND_parliament_stormed_desc: "의회가 점거되었으며 여러 핵심 관료가 인질로 잡혔습니다. 그들은 자유를 되찾는 대가로 사임을 요구하고 있습니다."
 IND_purify_philippines: "필리핀 정화"
 IND_purify_philippines_desc: "북쪽의 필리핀으로 진격합시다. 이슬람 국가는 아니지만 그렇게 될 수 없다는 뜻은 아닙니다!"
