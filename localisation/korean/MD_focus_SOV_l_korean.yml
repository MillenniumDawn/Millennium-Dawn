 russia.500.d: "밀과 카모프 설계국, 그리고 로스트베르톨, 카잔, 울란우데 조립 공장 사이의 수십 년에 걸친 경쟁으로 러시아의 회전익기 생산은 분열되었습니다. 로스텍의 산업 조율 아래, 살아남은 소련 시대의 유산은 연구, 생산, 수출을 간소화하기 위해 JSC 러시아 헬리콥터라는 단일 통합 지주회사로 합쳐집니다."
