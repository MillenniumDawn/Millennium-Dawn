 palestine.2.t: "Temporada de Eleições"
 palestine.2.d: "As urnas foram abertas para a eleição do próximo Presidente da Autoridade Palestina. Os dois principais candidatos são Mahmoud Abbas e Mustafa Barghouti. Ainda não se sabe quem será o vencedor, mas as pesquisas vêm indicando fortemente que o próximo Presidente muito bem pode ser..."
 palestine.2.a: "Mahmoud Abbas, sucessor de Arafat"
 palestine.2.b: "Mustafa Barghouti, um candidato independente"
 ISR_isr_liberman_coalition_ticker_mission_desc: "Avance a agenda do Yisrael Beiteinu de governança secular, segurança nacional e interesses do eleitorado russófono.\n\nConcluir focos para o partido permitirá que você complete esta missão."
 ISR_isr_givir_coalition_ticker_mission_desc: "Persiga a agenda do Otzma Yehudit de forte segurança nacional e políticas nacionalistas de direita.\n\nConcluir focos para o partido permitirá que você complete esta missão."
 ISR_isr_likud_coalition_ticker_mission_desc: "Implemente a agenda do Likud de governança conservadora e políticas de Estado voltadas à segurança.\n\nConcluir focos para o partido permitirá que você complete esta missão."
 ISR_isr_shas_coalition_ticker_mission_desc: "Apoie a agenda do Shas de interesses religiosos ultraortodoxos e assistência social para sua comunidade.\n\nConcluir focos para o partido permitirá que você complete esta missão."
 ISR_isr_jud_coalition_ticker_mission_desc: "Avance a agenda do Yahadut HaTora de observância da Torá e prioridades religiosas ultraortodoxas.\n\nConcluir focos para o partido permitirá que você complete esta missão."
 ISR_isr_nz_coalition_ticker_mission_desc: "Persiga a agenda da União Nacional de nacionalismo de direita e preocupações com a segurança territorial.\n\nConcluir focos para o partido permitirá que você complete esta missão."
 ISR_isr_jewish_home_coalition_ticker_mission_desc: "Implemente a agenda do Lar Judaico de sionismo religioso e políticas de expansão de assentamentos.\n\nConcluir focos para o partido permitirá que você complete esta missão."
 ISR_isr_labour_coalition_ticker_mission_desc: "Apoie a agenda do Avoda de social-democracia, direitos dos trabalhadores e governança progressista.\n\nConcluir focos para o partido permitirá que você complete esta missão."
 ISR_isr_meretz_coalition_ticker_mission_desc: "Avance a agenda do Meretz de valores progressistas de esquerda e diplomacia voltada para a paz.\n\nConcluir focos para o partido permitirá que você complete esta missão."
 ISR_isr_arab_coalition_ticker_mission_desc: "Apoie a agenda do Ra'am de direitos da minoria árabe-israelense e interesses da comunidade.\n\nConcluir focos para o partido permitirá que você complete esta missão."
