 Japan.104.f: "제정 복고주의자들의 성장"
 JAP_electronics.320.t: "메탈기어의 대가"
 JAP_electronics.320.d: "코나미는 같은 해에 메탈기어 솔리드 2와 사일런트 힐 2를 출시했습니다. 두 작품 모두 흥행작이 아니면 정당화할 수 없는 예산이 들었고, 한 명의 감독을 중심으로 꾸려진 팀이 만들었습니다. 스포츠와 카드 라인은 꾸준히 수익을 내며 거장 감독이 전혀 필요 없습니다. 둘 다 지원하는 것은 회사가 더는 감당할 수 없는 일입니다."
 JAP_electronics.320.a: "감독 중심 팀에 투자한다"
 JAP_electronics.320.b: "연간 스포츠 및 카드 라인에 투자한다"
 JAP_electronics.321.t: "디스크보다 많이 버는 게임기"
 JAP_electronics.321.d: "코나미는 허드슨 소프트를 인수하고 파치슬롯과 아케이드 게임기 사업으로 확장할 수 있습니다. 매장에 놓인 기기 한 대가 1년에 버는 돈이 콘솔 타이틀 하나가 평생 버는 돈보다 많습니다. 공장과 매장 공간은 일본에서 실질적인 자산입니다. 소프트웨어 퍼블리셔로 남으면 게임 언론이 높이 평가하지 않는 사업을 멀리할 수 있습니다."
 JAP_electronics.321.a: "오락기기 사업에 진출한다"
 JAP_electronics.321.b: "소프트웨어 퍼블리셔로 남는다"
 JAP_electronics.322.t: "드래곤 컬렉션"
 JAP_electronics.322.d: "GREE에서 서비스하는 코나미의 카드 게임은 개발자 1인당 수익이 사내 어떤 콘솔 팀보다 높으며, 제작에 몇 년이 아니라 몇 달밖에 걸리지 않았습니다. 스튜디오를 소셜 및 모바일로 옮기는 것은 돈의 흐름을 따르는 일입니다. 콘솔 팀을 계속 지원하려면 단기 프로젝트의 수익으로 장기 프로젝트의 비용을 대야 합니다."
 JAP_electronics.322.a: "개발을 소셜 및 모바일로 옮긴다"
 JAP_electronics.322.b: "콘솔 팀에 계속 투자한다"
 JAP_electronics.323.t: "고지마의 퇴사"
 JAP_electronics.323.d: "코나미는 메탈기어 솔리드 V를 완성하고 사일런트 힐즈를 취소했으며, 두 작품을 만든 스튜디오를 해체하고 상자에서 감독의 이름을 지울 수 있습니다. 사장은 이미 공개 석상에서 사업의 미래는 모바일에 있다고 말했습니다. 스튜디오를 유지한다는 것은 부서가 버는 돈보다 비용이 많이 드는 프로듀서에게 자금을 댄다는 뜻입니다."
 JAP_electronics.323.a: "스튜디오를 해체하고 크레딧을 삭제한다"
 JAP_electronics.323.b: "스튜디오와 크레딧을 유지한다"
 JAP_electronics.324.t: "eFootball"
 JAP_electronics.324.d: "코나미는 위닝 일레븐을 무료 서비스로 재구축해 출시했지만, 정작 자사 이용자들조차 플랫폼의 다른 어떤 게임보다 낮게 평가하는 상태였습니다. 사일런트 힐, 메탈기어, 악마성 드라큘라로 이루어진 과거 작품군은 방치된 채 놓여 있으며, 리메이크에는 상당한 비용이 듭니다. 서비스와 피트니스 클럽을 운영하면 그런 위험 없이 수익을 올릴 수 있습니다."
 JAP_electronics.324.a: "과거 작품군에 다시 투자한다"
 JAP_electronics.324.b: "서비스와 클럽을 운영한다"
 JAP_electronics.325.t: "코나미가 된 모습"
 JAP_electronics.325.d: "25년 동안 감독, 게임기, 휴대전화 사이에서 선택을 거듭한 끝에, 코나미가 무엇이며 일본 엔터테인먼트가 무엇을 수출하는지가 정해졌습니다."
 JAP_electronics.325.a: "복원된 개발사들"
 JAP_electronics.325.b: "리메이크 및 부활 퍼블리셔"
 JAP_electronics.325.c: "오락 및 피트니스 운영사"
 JAP_electronics.325.e: "모바일 라이선스 사업"
 JAP_konami_restored_development_houses: "복원된 개발사들"
 JAP_konami_restored_development_houses_desc: "코나미는 다시 감독들에게 투자하고 그들이 만들고 싶어 하는 게임을 출시합니다. 모바일 사업보다 비용이 더 들지만, 일본 밖의 사람들이 이 이름을 아는 이유도 바로 그것입니다."
 JAP_konami_remake_publisher: "리메이크 및 부활 퍼블리셔"
 JAP_konami_remake_publisher_desc: "코나미는 이미 소유한 작품을 처음 해 본 사람들을 위해 다시 만듭니다. 카탈로그는 한정되어 있지만, 팬층은 아직은 그렇지 않습니다."
 JAP_konami_amusement_fitness_operator: "오락 및 피트니스 운영사"
 JAP_konami_amusement_fitness_operator_desc: "파치슬롯 기기, 아케이드 매장, 그리고 일본 최대의 피트니스 클럽 체인은 모두 코나미가 온전히 소유한 부동산과 기기 위에 세워졌습니다. 게임은 실물 사업의 라이선스 부문일 뿐입니다."
 JAP_konami_mobile_licensing: "모바일 라이선스 사업"
 JAP_konami_mobile_licensing_desc: "코나미는 유희왕, 메탈기어, 사일런트 힐을 개발하려는 누구에게든 빌려주고 그 조건에 따라 수익을 거둡니다. 사내에서 만드는 것은 아무것도 없으며, 그럴 필요도 없습니다."
 JAP_electronics.330.t: "길모퉁이의 무료 모뎀"
 JAP_electronics.330.d: "소프트뱅크는 도쿄 길거리에서 Yahoo! BB 모뎀을 나눠 주고, NTT의 가입자선 장악이 무너질 때까지 원가 이하로 광대역 서비스를 팔 수 있습니다. 손정의는 몇 년 동안 가입자 한 명당 손해를 볼 것으로 예상합니다. NTT의 회선을 마진을 붙여 재판매하면 즉시 수익이 나지만 독점은 그대로 남게 됩니다."
 JAP_electronics.330.a: "모뎀을 무료로 나눠 주고 손실을 감수한다"
 JAP_electronics.330.b: "기존 사업자의 회선을 재판매한다"
 JAP_electronics.331.t: "보다폰 재팬"
 JAP_electronics.331.d: "보다폰은 일본 내 통신망을 1조 7,500억 엔에 매각하려 하며, 소프트뱅크는 거의 전액을 차입할 수 있습니다. 이는 일본 역사상 최대의 차입 매수가 될 것입니다. 전국 이동통신망과 그 가입자를 얻게 됩니다. 이 부채는 소프트뱅크가 한 번도 운영해 본 적 없는 사업을 담보로 합니다."
 JAP_electronics.331.a: "통신망을 담보로 차입하여 인수한다"
 JAP_electronics.331.b: "이동통신에서 손을 뗀다"
 JAP_electronics.332.t: "스프린트"
 JAP_electronics.332.d: "소프트뱅크는 미국 3위 통신사인 스프린트를 216억 달러에 인수할 수 있지만, 누구도 제대로 비용을 산정하지 못한 통신망 재구축을 떠안게 됩니다. 이 규모로는 처음으로 일본 기업이 미국 시장 안에 발을 들이게 됩니다. 같은 자본을 국내에 쓰면 소프트뱅크가 이미 운영하는 통신망에서 복리로 불어납니다."
 JAP_electronics.332.a: "미국 통신사를 인수한다"
 JAP_electronics.332.b: "국내에 재투자한다"
 JAP_electronics.333.t: "1,000억 달러"
 JAP_electronics.333.d: "소프트뱅크는 대부분 사우디 공공투자기금에서 나온 1,000억 달러를 조달하여, 어떤 벤처 펀드도 써 본 적 없는 규모의 수표를 끊을 수 있습니다. 비전 펀드는 손정의를 살아 있는 최대의 기술 투자자로 만들 것입니다. 재무상태표 안에서 투자하는 편이 더 느리고 규모도 작지만, 리야드의 누구에게도 책임을 지지 않습니다."
 JAP_electronics.333.a: "걸프 자금으로 펀드를 조성한다"
 JAP_electronics.333.b: "재무상태표 안에서 투자한다"
 JAP_electronics.334.t: "위워크"
 JAP_electronics.334.d: "위워크의 상장은 시장에 나오기 전에 무산되었고, 소프트뱅크는 이 회사의 최대 지분을 보유하고 있습니다. 회사를 구제한다는 것은 수십억 달러 규모의 평가손실을 떠안고 주주들에게 판단이 잘못되었다고 말한다는 뜻입니다. 무너지게 두면 소프트뱅크가 후원한 나머지 모든 투자를 지킬 수 있지만, 그 투자 대상을 어떻게 골랐는지에 대한 모든 의심이 사실로 굳어집니다."
 JAP_electronics.334.a: "구제하고 평가손실을 감수한다"
 JAP_electronics.334.b: "무너지게 두고 나머지를 지킨다"
 JAP_electronics.335.t: "소프트뱅크가 된 모습"
 JAP_electronics.335.d: "25년 동안 통신망을 담보로 돈을 빌리고 그 수익을 타인의 회사에 거는 일을 거듭한 끝에, 소프트뱅크가 무엇이며 일본 자본이 어떻게 세계 나머지 지역에 닿는지가 정해졌습니다."
 JAP_electronics.335.a: "글로벌 기술 지주회사"
 JAP_electronics.335.b: "벤처 인수 투자자"
 JAP_electronics.335.c: "국내 통신사 그룹"
 JAP_electronics.335.e: "광대역 재판매 사업자"
 JAP_softbank_global_technology_holding: "글로벌 기술 지주회사"
 JAP_softbank_global_technology_holding_desc: "소프트뱅크는 두 대륙에 걸친 통신사와, 직접 운영하지 않는 수백 개 기업의 소수 지분을 소유하고 있습니다. 그 가치는 시장이 이번 분기에 이 지분을 얼마로 평가하느냐에 달려 있습니다."
 JAP_softbank_venture_underwriter: "벤처 인수 투자자"
 JAP_softbank_venture_underwriter_desc: "소프트뱅크는 다른 누구도 끊어 주지 않을 수표를 끊고 거기에 딸린 이사회 자리를 차지합니다. 수익은 고르지 않게 들어오고, 손실은 한꺼번에 찾아옵니다."
 JAP_softbank_domestic_carrier_group: "국내 통신사 그룹"
 JAP_softbank_domestic_carrier_group_desc: "일본 전역의 광케이블, 주파수, 교환국은 빚으로 사들여 가입료로 갚아 나갑니다. 소프트뱅크는 인프라를 소유한 누군가의 지분이 아니라 인프라 자체를 소유합니다."
 JAP_softbank_broadband_reseller: "광대역 재판매 사업자"
 JAP_softbank_broadband_reseller_desc: "소프트뱅크는 기존 사업자의 회선 이용권을 팔며 오로지 가격으로만 경쟁합니다. 마진은 얇지만 이 사업은 한 번도 구제가 필요했던 적이 없습니다."
