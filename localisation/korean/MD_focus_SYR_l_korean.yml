 TT_SYR_ASSASSINATE_HARIRI: "§R가지 가나안(Ghazi Kanaan)을 대체하면 암살의 성공 가능성이 높아집니다. 만약 우리 요원들을 레바논에서 복귀시킬 경우, 그 확률은 더욱 낮아질 것입니다.§!\n"
 TT_SYR_ASSASSINATE_HARIRI_SUCCESS: "암살 §G성공§!\n"
 TT_SYR_ASSASSINATE_HARIRI_FAIL: "암살 §R실패§!\n"
 TT_HIRE_PMCS_LIMIT: "우린 세 곳의 민간 군수 회사를 최대로 고용할 수 있습니다!"
 TT_SYR_EXPEL_PALESTINIANS: "우린 해산된 민병대로부터 일부 장비를 획득할 것입니다."
 TT_SYR_BROKEN_RELATIONS_SOV: "우린 너무 오랜 시간동안 러시아인들의 의지에 저항하지 않았습니다\n"
 TT_SYR_BROKEN_RELATIONS_PER: "우린 너무 오랜 시간동안 이란인들의 의지에 저항하지 않았습니다\n"
 TT_SYR_BROKEN_RELATIONS_BOTH: "우리는 이란과 러시아와의 관계를 망쳤습니다."
 TT_SYR_REQUESTS_REJECTED: "우리는 '선택적인 동맹'으로부터 거부당하였습니다."
 TT_SYRIAN_ARAB_ARMY_REMNANTS: "The remnants of the Syrian Arab Army join us\n"
 TT_SYR_PROMISED_REPRESENTATION_NUS: "§R우리는 레반트 자유인민위원회 (Tahrir Al-Sham)를 대변하기로 약속하였습니다§!"
 TT_SYR_PROMISED_FEDERATION_ROJ: "§R우리는 쿠르드족에게 연맹을 약속했습니다!§!\n"
 TT_SYR_HOLD_ELECTIONS: "우리는 시리아의 첫 자유 선거를 진행할 것입니다\n"
 TT_SYR_BECOME_ISIS_LIMIT: "새로운 ISIS가 선언되지 않았습니다\n"
 TT_SYR_BECOME_ISIS: "§R이제 일반 중점 트리로 전환될 것입니다§!\n"
 TT_SYR_GENOCIDE: "쿠르드, 알라위, 그리고 드루즈의 핵심 주가 제거될 것입니다."
 TT_DEATH_OF_HAFEZ: "이 중점은 [ROOT.GetLeader]의 죽음으로 건너뛰게 될 것입니다\n"
 TT_ACTIVATE_DEFENCE_COMPANIES: "우리는 방어 중대들 중 정예들로 이뤄진§Y세 여단§!을 활성화할 겁니다.\n"
 TT_SYRIA_PRESENT_TO_INNER_CIRCLE: "이를 통해 후보의 지지도가 §G10§! 증가합니다\n"
 TT_HAFEZ_NOT_DEAD: "하페즈 알아사드는 아직 승계 문제를 처리할 수 있습니다\n"
 TT_SYRIA_GATHER_PUBLIC_SUPPORT: "이를 통해 후보의 지지도가 §G5§! 증가합니다\n"
 TT_TEMPORARY_LEADER: "[ROOT.GetLeader](은)는 물러날 것이며 그 자리는 임시 대통령으로 대체됩니다\n"
 TT_SYRIAN_ARAB_DEMOCRATIC_PARTY: "우리 집권당은 이제부터 §H아랍 민주당§!\n으로 불릴 것입니다\n"
 TT_RESHUFFLE_PARTIES: "§R국내 정세를 개편§!\n"
 TT_SYR_HAS_TAKEN_LOANS: "우리는 다른 국가에서 대출을 받았습니다\n"
 TT_SYR_ASSAULT_JORDAN: "쿠데타의 성공은 요르단의 §Y민족주의 전망§!에 대한 지지에 달렸습니다.\n\n만약 쿠데타가 §G성공적§!이라면, 새로운 정권이 즉각적으로 들어설 것이며 요르단에 핵심주를 얻게 될 것입니다.\n\n만약 쿠데타가 §Y내전§!으로 치닫게 된다면, 우린 정권에 대항하여 시리아 사회 국가주의당 (SSNP)와 함께 전쟁에 뛰어들 것입니다.\n\n만약 쿠데타가 §R실패한다면§!, 요르단과 우리 간의 전쟁이 시작될 것이며, 그들의 비난만 받게 될 것입니다.\n\n"
 TT_SYR_CONCESSIONS_TO_KURDS: "만약 쿠르드가 우리의 거래에 동의한다면,\n"
 TT_SYR_ALIGN_SUDAN: "\n[SUD.GetName](은)는 기본적으로 우리와 §G강력히§! 동맹을 맺으려고 할 것입니다\n\n다음의 경우 [SUD.GetName]의 동맹 가능성이 높아집니다:\n §G-그들이 국가주의 이념을 따르고 있음§!\n\n다음의 경우 [SUD.GetName]의 동맹 가능성이 낮아집니다:\n §R-그들과 [EGY.GetName](이)가 모두 친서방 또는 신흥국 관점을 따르고 있음\n -그들이 전쟁중임\n -그들이 이미 다른 동맹에 속해있음§!\n"
 TT_SYR_ALIGN_AZERBAIJAN: "\n[AZE.GetName](이)가 우리와 동맹을 맺을 가능성은 기본적으로 §g반반§!의 확률을 가집니다.\n\n다음의 경우 [AZE.GetName]의 동맹 가능성이 높아집니다:\n §G-그들이 국가주의 이념을 따르고 있음§!\n\n다음의 경우 [AZE.GetName]의 동맹 가능성이 낮아집니다:\n §R-그들과 [PER.GetName](이)가 모두 친서방 또는 신흥국 관점을 따르고 있음\n -그들이 비동맹 관점을 따르고 있음\n -그들이 전쟁중임\n -그들이 이미 다른 세력에 속해있음\n -그들이 [ARM.GetName](와)과의 분쟁을 해결함\n -그들이 터키에 대해 적대적인 감정을 가지고 있음§!\n"
 TT_SYR_ALIGN_ARMENIA: "\n[ARM.GetName](은)는 기본적으로 우리와 §G강력히§! 동맹을 맺으려고 할 것입니다\n\n다음의 경우 [ARM.GetName]의 동맹 가능성이 높아집니다:\n §G-그들이 국가주의 이념을 따르고 있음§!\n\n다음의 경우 [ARM.GetName]의 동맹 가능성이 낮아집니다:\n §R-그들이 전쟁중임\n -우리가 쿠르드 족과 동맹 상태임§!\n"
 TT_SYR_ALIGN_GREECE: "\n[GRE.GetName](은)는 기본적으로 우리와 동맹을 맺지 §R않으려§! 할 것입니다\n\n다음의 경우 [GRE.GetName]의 동맹 가능성이 높아집니다:\n §G-그들이 국가주의 이념을 따르고 있음\n -[TUR.GetName](은)는 NATO의 회원국이 아님§!\n\n다음의 경우 [GRE.GetName]의 동맹 가능성이 낮아집니다:\n §R-그들이 전쟁중임\n -그들이 [TUR.GetName](와)과의 국경 분쟁을 해결함\n -우리 또는 우리 괴뢰국이 키프로스를 소유하고 있음§!\n"
 TT_SYR_WEAKEN_IRAN: "우리는 침공하기 전에 이란을 약화하고 현지 민병대를 고용하는 §Y디시전§!을 사용할 수 있게 될것입니다\n"
 TT_SYR_ARABISTAN_ARMED: "우리가 §Y'동쪽의 소용돌이' 작전§!을 실행할 때, 아랍 민병대들이 함께 봉기하여 합류할 것입니다\n"
 TT_SYR_LURISTAN_ARMED: "우리가 §Y'동쪽의 소용돌이' 작전§!을 실행할 때, 라리스탄의 반란군은 독립을 선언하며 이란과 전쟁을 시작할 것입니다\n"
 TT_SYR_AZERBAIJAN_ARMED: "우리가 §Y'동쪽의 소용돌이' 작전§!을 실행할 때, 아제르바이잔의 반란군은 독립을 선언하며 이란과 전쟁을 시작할 것입니다\n"
 TT_SYR_TABARISTAN_ARMED: "우리가 §Y'동쪽의 소용돌이' 작전§!을 실행할 때, 길락과 마잔데라니의 반란군은 독립을 선언하며 이란과 전쟁을 시작할 것입니다\n"
 TT_SYR_BALOCHISTAN_ARMED: "우리가 §Y'동쪽의 소용돌이' 작전§!을 실행할 때, 발로치의 반란군은 독립을 선언하며 이란과 전쟁을 시작할 것입니다\n"
 TT_SYR_ALIGN_PALESTINE: "\n[PAL.GetName](은)는 기본적으로 우리와 §G강력히§! 동맹을 맺으려고 할 것입니다\n\n다음의 경우 [PAL.GetName]의 동맹 가능성이 높아집니다:\n §G-우리와 이념이 같음§!\n\n다음의 경우 [PAL.GetName]의 동맹 가능성이 낮아집니다:\n §R-그들이 이미 다른 세력에 속해있음§!\n"
 TT_SYR_ALIGN_ISRAEL: "\n[ISR.GetName](은)는 기본적으로 우리와 §G강력히§! 동맹을 맺으려고 할 것입니다\n\n다음의 경우 [ISR.GetName]의 동맹 가능성이 높아집니다:\n §G우리와 이스라엘 모두 서방 또는 신흥국 이념을 따르고 있음§!\n\n다음의 경우 [ISR.GetName]의 동맹 가능성이 낮아집니다:\n §R-그들이 이미 다른 세력에 속해있음\n -그들이 국가주의 이념을 따르고 있음§!\n"
 TT_SYR_ALIGN_JORDAN: "\n[JOR.GetName](은)는 기본적으로 우리와 §G강력히§! 동맹을 맺으려고 할 것입니다\n\n다음의 경우 [JOR.GetName]의 동맹 가능성이 높아집니다:\n §G우리와 요르단 모두 같은 이념을 가지고 있음\n -[ISR.GetName](이)가 국가주의 관점을 따르고 있음§!\n\n다음의 경우 [JOR.GetName]의 동맹 가능성이 낮아집니다:\n §R-'아랍-이스라엘 분쟁' 중 그들 부분이 해결됨§!\n"
 TT_SYR_ALIGN_EGYPT: "\n[EGY.GetName](은)는 기본적으로 우리와 §G강력히§! 동맹을 맺으려고 할 것입니다\n\n다음의 경우 [EGY.GetName]의 동맹 가능성이 높아집니다:\n §G우리와 이집트 모두 같은 이념을 가지고 있음\n -[ISR.GetName](이)가 국가주의 관점을 따르고 있음§!\n\n다음의 경우 [EGY.GetName]의 동맹 가능성이 낮아집니다:\n §R-'아랍-이스라엘 분쟁' 중 그들 부분이 해결됨§!\n"
 TT_SYR_ALIGN_SAUDI_ARABIA: "\n[SAU.GetName](이)가 우리와 동맹을 맺을 가능성은 기본적으로 §g반반§!의 확률을 가집니다.\n\n다음의 경우 [SAU.GetName]의 동맹 가능성이 높아집니다:\n §G우리와 사우디 모두 같은 이념을 가지고 있음\n -사우디 왕가가 권력을 잡고 있고 동시에 우리가 서방 관점을 가짐\n -우리가 수니파이고, 시아파가 아니어야함\n -우리가 레바논에서 철수함§!\n\n다음의 경우 [SAU.GetName]의 동맹 가능성이 낮아집니다:\n §R-파하드 왕이 더이상 지도자가 아님\n -우리가 레바논 총리의 암살 시도를 한적이 있음\n -우리가 중점 '헤즈볼라 지원'을 완료함\n -우리에 대한 그들의 평판이 나쁨§!\n"
 TT_SYR_ALIGN_IRAN: "\n[PER.GetName](은)는 기본적으로 우리와 §G강력히§! 동맹을 맺으려고 할 것입니다\n\n다음의 경우 [PER.GetName]의 동맹 가능성이 낮아집니다:\n §R-서로 다른 관점을 따르고 있음\n -우리가 수니파임\n -우리가 중점 '헤즈볼라에 대한 공작'을 완료함\n -우리가 레바논을 통제 중임§!\n"
 TT_SYR_ALIGN_RUSSIA: "\n[SOV.GetName](은)는 기본적으로 우리와 §G강력히§! 동맹을 맺으려고 할 것입니다\n\n다음의 경우 [SOV.GetName]의 동맹 가능성이 낮아집니다:\n §R-서로 다른 관점을 따르고 있음\n -우리가 전쟁 중임§!\n"
 TT_SYR_INTELLIGENCE_TO_PKK: "[TUR.GetName]에서 §Y쿠르디스탄 노동자당 (PKK)의 권력§!이 10 증가할 것입니다\n"
 TT_SYR_CLOSE_PKK_BORDER: "[TUR.GetName]에서 §Y쿠르디스탄 노동자당 (PKK)의 권력§!이 10 감소할 것입니다\n"
 TT_SYR_HEZ_DIPLOMACY: "우리는 이제 헤즈볼라 관련 디시전에 개입할 수 있습니다\n"
 TT_SYR_INFILTRATE_HEZ: "우리 첩보원은 헤즈볼라에 잠입할 것입니다.\n"
 TT_SYR_DISCORD_HEZ: "우리는 헤즈볼라와 이란 사이의 불화를 싹트게 할 것입니다\n"
 TT_SYR_FORGIVE_SOVIET_DEBT_COMPLETELY: "§Y부채§!가 사라질 것입니다!\n"
 SYR_civil_war_victory: "승리!"
 SYR_civil_war_victory_desc: "우리가 시리아 내전에서 승리했습니다! 이제 우리나라의 재건을 시작할 수 있습니다."
 SYR_kurdish_question: "쿠르드족 문제"
 SYR_kurdish_question_desc: "로자바의 쿠르드족은 시리아 연방을 위해 싸우고 있습니다. ISIS와 싸우는 와중에 이들은 다른 세속 파벌들과 연합해 시리아 영토를 광범위하게 점령하고 관리하고 있습니다. 우리가 그들을 어떻게 할 지 결정해야 합니다."
 SYR_assad_day: "아사드의 날"
 SYR_assad_day_desc: "아사드 가문은 수십년 간 시리아를 통치해왔습니다. 내전의 승리는 그들의 입지를 더욱 공고히 했을 뿐입니다. 승리를 축하하며 우리는 동맹국인 러시아 연방과 이란 이슬람 공화국과 회담을 개최할 것 입니다. 그들은 우리의 승리에 매우 중요한 역할을 했기에 우리의 정치에 큰 영향을 끼치려고 할 겁니다. 우리는 그들이 원하는 바를 거스르지 않도록 조심해야 합니다."
 SYR_incorporate_ssnp: "시리아 사회 국가주의당(SSNP) 통합"
 SYR_incorporate_ssnp_desc: "시리아 사회민족당 줄여서 SSNP는 대시리아를 형성하는데 목적을 두고 있습니다. 사회민족당에 속한 민병대가 우리의 승리에 중요한 역할을 했으며, 정당으로서의 인기도 얻고 있습니다. 이들을 바트당이 주도하는 연립정부인 국가진보전선에 다시 포함해 통합해야 합니다."
 SYR_ssnp_traitors: "시리아 사회 국가주의당(SSNP)의 배신자"
 SYR_ssnp_traitors_desc: "시리아 사회 국가주의당(SSNP)은 바에쓰가 이끄는 국가 진보 전선을 떠나 반대세력에 참가하였고, 오직 지위가 낮은 일부만이 돌아왔습니다. 이들은 이미 충성하고 있지 않다는 것을 보여주었고, 당장 모두 제거해야합니다."
 SYR_ssnp_coup: "시리아 사회민족당 쿠데타"
 SYR_ssnp_coup_desc: "충분한 지지를 받으면, 시리아 사회민족당이 국가진보전선에서 지배적인 위치를 확보할 수 있습니다. 이 결정은 국가를 다시 한 번 혼란에 빠뜨릴 수 있어 국가 내부 보안 문제에는 위험할 수 있습니다. 따라서, 사회민족당의 인기가 높아질 수록 쿠데타가 성공할 가능성 또한 높아집니다."
 SYR_integrate_palestinians: "팔레스타인 민병대 통합"
 SYR_integrate_palestinians_desc: "Syria is home to a large population of Palestinians. During the civil war, many Palestinian militias fought on our side, due to Syria's support for Palestinian freedom. Keeping these groups around will increase our firepower, but since they are quasi-independent, it'll be harder to operate them with our regular army."
 SYR_expel_palestinians: "팔레스타인 민족 추방"
 SYR_expel_palestinians_desc: "The Palestinian groups helped us win the civil war. However, keeping ragtag militias around is dangerous for our nation. We should expel the militias from operating inside Syria. We should also use this opportunity to confiscate some of the weaponry they have been operating and bolster our own national forces with them."
 SYR_formalise_shia_militias: "시아파 민병대 정규군화"
 SYR_formalise_shia_militias_desc: "Many Shia militia groups supported our government during the civil war. Integrating them into the Syrian Arab Army will help us bolster our ranks. However, many of the Shia groups are funded and supported by Iran, which means that if we decide to integrate them into our Army, the Iranian influence will increase too..."
 SYR_disarm_militias: "민병대 무장해제"
 SYR_disarm_militias_desc: "시아파 민병대는 내전 당시 우리 편에서 용맹하게 싸웠습니다. 하지만, 다양한 이해관계를 가진 많은 조직들을 국내에서 통제할 수는 없습니다. 이들을 해산 및 무장해제 시키고, 이들이 사용하던 무기로 새로운 시리아 아랍군을 무장시킬 필요가 있습니다."
 SYR_russian_tool: "새로운 동맹"
 SYR_russian_tool_desc: "러시아는 기지가 있는 라타키아에서 우리를 도와주었습니다. 이들은 우리에게 큰 도움이 되었고, 향후 귀중한 동맹이 되어줄 것입니다. 이들의 지원과 도움으로 나라를 재건해야합니다. 물론, 이로 인해서 저들에게 의존적이게 되는 결과를 낳으며, 자국의 외교 정책에도 큰 영향을 줄 것입니다."
 SYR_iranian_puppet: "우리의 오랜 형제"
 SYR_iranian_puppet_desc: "Iran has been one of our biggest suppliers of weapons and militias during the war, and have been a strong ally for us for decades. They are the best option we have to rebuild Syria. Although, the cost of this rebuilding would be so much for our political independence for the years to come..."
 SYR_on_our_own: "우리의 길"
 SYR_on_our_own_desc: "우리의 오래된 우방국들은 우리를 버렸습니다. 우리 스스로 미래를 개척해나갈 때입니다."
 SYR_free_syria: "자유 시리아"
 SYR_free_syria_desc: "시리아는 마침내 알아사드와 근본주의파의 멍에로부터 해방되었습니다. 이제 다음의 일을 생각할 차례입니다. 부흥을 위해 계획을 세웁시다."
 SYR_syrian_arab_army: "시리아 아랍 육군의 처분"
 SYR_syrian_arab_army_desc: "The Syrian Civil War was devastating on the Syrian Arab Army, the main military force of the government. Large parts of the army defected or deserted in the beginning of the conflict, and several years of war have taken a heavy toll on the army. Even though the Assad regime is defeated, some elements of the SAA are still around. We need to decide what to do with them."
 SYR_political_plurality: "정치 세력 결정"
 SYR_political_plurality_desc: "During the civil war, several militias and political groups dominated the country. We now need to decide who we want to take part in the future of Syria"
 SYR_federal_republic_of_syria: "시리아 연방공화국"
 SYR_federal_republic_of_syria_desc: "Syria is composed of many ethnicities. Many ethnic groups have been in conflict with each other for a long time. In order for the country to survive, we need to give more control to the ethnic groups of our country"
 SYR_unitary_republic_of_syria: "통일된 시리아 공화국"
 SYR_unitary_republic_of_syria_desc: "Syria should stay a republic, and we should encourage people of all cultures and faiths to come together under one united Syrian flag."
 SYR_elections: "Elections in Syria"
 SYR_elections_desc: "Now that we are a free country, we should hold proper elections to decide the country's future."
 SYR_islamic_emirate: "시리아 이슬람 토후국"
 SYR_islamic_emirate_desc: "We can now continue to establish the new Caliphate in Syria. Allah will show us the path!"
 SYR_tahrir_go_alone: "우리의 길"
 SYR_tahrir_go_alone_desc: "We now have an option to cut our ties with other religious groups, and carve our own alliance of God's warriors to liberate the Levant, death to the Kuffar!"
 SYR_tahrir_show_true_colors: "진정한 자국의 사상"
 SYR_tahrir_show_true_colors_desc: "이제는 압둘 와합과 그의 지지자들의 진정한 이상을 되살릴 때가 왔도다. 알카에다와 다른 이슬람 그룹의 형제들이 우리의 에미레이트에 합류하여 이슬람 움마를 위한 투쟁에 나설 것이다! 알라후 아크바르!"
 SYR_align_with_isis: "새로운 ISIS"
 SYR_align_with_isis_desc: "The true ideals of Abdul Wahhab never die! Al Qaeda and other so called \"Islamic\" groups have no idea what true Islam is! And Al Baghdadi knew it very well! We have to follow his legacy and revive it, death to the Munafiqin!"
 SYR_true_caliphate: "진정한 칼리프"
 SYR_true_caliphate_desc: "불쌍한 ISIS는 우리와는 달리 아사드나 로자바 세력에 대항하지 못했습니다. 이제 우리가 바로 무슬림의 새로운 시대를 이끌어갈 차례입니다.!"
 SYR_global_recruitment: "세계 모병"
 SYR_global_recruitment_desc: "Our victory will attract devout believers from all over the world. These new Warriors will be ready to serve us in our future wars."
 SYR_campaign_of_terror: "테러 계획"
 SYR_campaign_of_terror_desc: "We need to make sure the Syrian population never resists against our cause. No longer can our enemies divide us. Through relocation, conversion and by eliminating harmful elements, we'll create a united Syria"
 SYR_death_of_hafez_al_assad: "하페즈 알아사드 계승권"
 SYR_death_of_hafez_al_assad_desc: "하페즈 알아사드의 후계자를 선택할 때입니다."
 SYR_bushra_al_assad: "부쉬라 알아사드"
 SYR_bushra_al_assad_desc: "Bushra is the eldest and the most experienced child of Hafez. The fact that she is a woman shouldn't cancel her out from succession. She is the most legitimate heir, and she will lead Syria into a modern future"
 SYR_husband_minister: "남편을 장관으로"
 SYR_husband_minister_desc: "부쉬라의 남편인 아세프 샤우카트는 현재 군사정보부의 부국장입니다. 그는 부쉬라가 그녀의 위치를 지켜내는데 더욱 도움을 주기 위해서 국장으로 승진해야 합니다."
 SYR_gulf_state_tour: "걸프 국가 순방"
 SYR_gulf_state_tour_desc: "It is important to show the more conservative gulf states that a woman can make the perfect leader for a country."
 SYR_healthcare_reform: "Healthcare Reforms"
 SYR_healthcare_reform_desc: "Bushra has already championed one wave of developing the Syrian pharmaceutical industry. It is normal and necessary that she use her experience to reform the very lacking Syrian healthcare system"
 SYR_invite_big_pharma: "빅 파마 (Big Pharma) 초대"
 SYR_invite_big_pharma_desc: "We need to contact large foreign pharmaceutical companies to set up manufacturing plants in Syria. This will however, upset the ruling elite as profits from these companies will be out of their hands"
 SYR_syrian_pharmaceuticals: "시리아 제약 회사"
 SYR_syrian_pharmaceuticals_desc: "부쉬라는 시리아 연합 의료 그룹 (SAMG)과 같은 여러 시리아 제약회사들의 설립을 지원하여 의료 용품 및 기타 의료 지원에 대한 국가 내부의 요구를 충족시키기 위한 계획을 실행합니다."
 SYR_eqalitarian_campaign: "평등주의 운동"
 SYR_eqalitarian_campaign_desc: "시리아는 이제 남성과 여성이 모두 평등한 현대의 국가로 변모할 것입니다. 이제 결혼 계약은 더 이상 신랑과 신부 아버지 사이에서만 결정할 수 있는 문제가 아니며, 나란히 적용되던 세속적인 이중 법률 시스템과 샤리아 법원은 모두 사라지게 될 것입니다."
 SYR_iron_lady: "시리아의 철의 여인"
 SYR_iron_lady_desc: "Bushra has the charisma and the ability to make those around her slowly drift to her side. As the first female head of state of the Arab world, she will be forever remembered by history"
 SYR_bashar_al_assad: "바샤르 알아사드"
 SYR_bashar_al_assad_desc: "While Bashar has spent most of his adult life studying medicine, he was quickly rushed back to Syria for military training and he quickly got the position of colonel in a Republican Guard unit. While inexperienced, he is the oldest son, and thus in the eyes of many the most legitimate heir for Hafez."
 SYR_constitutional_amendment: "헌법 개정"
 SYR_constitutional_amendment_desc: "The current Syrian constitution requires the President to be at least 40 years of age. This is complete nonsense, age shouldn't be a limit. Also, changing the constitution has nothing to do with the fact that our current President is below the age limit!"
 SYR_strengthen_ties_to_HEZ_and_PER: "시아파 관계 강화"
 SYR_strengthen_ties_to_HEZ_and_PER_desc: "We need strong allies in the region. Hezbollah and Iran are among the strongest military entities in the region. It is imperative that we base our security apparatus on coordination with them."
 SYR_purge_opposition: "반대파 제거"
 SYR_purge_opposition_desc: "When power passes on, there are always those who would want to see the whole system crumble. We need to arrest key opposition members both within and outside the Ba'ath Party"
 SYR_friend_old_guard: "초대 정부 관료들과의 협력"
 SYR_friend_old_guard_desc: "Not all power structures should be reformed. Some members of the old elite are the key to holding on to power. While some favours might be required, Bashar must align with them to stay in power"
 SYR_loyal_marriage: "왕실 결혼"
 SYR_loyal_marriage_desc: "A ruler can't be without a spouse. Asma Akhras, an old family friend of Bashar has recently moved to Syria from the United Kingdom. She is well-educated in economics and would make a good wife for Bashar"
 SYR_maher_al_assad: "마헤르 알아사드"
 SYR_maher_al_assad_desc: "하페즈의 막내 아들인 마헤르는, 시리아 군에서 오랜 경험을 가지고 있습니다. 비록 욱하는 성격과 더불어 몇몇 경우에는 무자비하게 굴기도 하지만, 강력한 군인은 시리아를 부국강병으로 이끌어줄 것입니다."
 SYR_empower_the_republican_guard: "공화국 수비대 권한 강화"
 SYR_empower_the_republican_guard_desc: "공화국 수비대는 시리아의 특수부대 사단입니다. 우리는 무엇보다도 시리아의 안전을 지켜내기 위해 그들을 진급시켜야 합니다."
 SYR_resestablish_defence_companies: "방위 회사 재설립"
 SYR_resestablish_defence_companies_desc: "방위 회사는 7,80년대 공화국 수비대와 비슷한 역할을 수행했던 특수부대 사단이었습니다. 이제 이 부대를 다시 부활시킬 때입니다. 여기에 소속된 군인들은 공중전 및 전차전에서 훈련된 특수 부대원으로 거듭날 것이며, 그들은 앞으로 내부 위협에 대항하여 정부를 지키는 임무를 수행할 것입니다."
 SYR_oil_must_flow: "석유는 밖으로 흘러야 한다"
 SYR_oil_must_flow_desc: "석유는 우리나라에서 가장 필수적인 자원 중 하나입니다. 이는 국가에 수입을 가져다 줄 뿐만 아니라, 그들 중 일부는 직접적으로 공화국 수비대에 전달되기도 합니다. 우리는 주변국들처럼 진정한 석유 강국으로 거듭나야 할 것입니다."
 SYR_syrian_savage: "시리아의 야만인"
 SYR_syrian_savage_desc: "According to the Turkish president [TUR.GetLeader], Maher's actions are close to 'savagery'. Maher will proudly carry this title, as a savage lion does not care for the opinion of the sheep"
 SYR_flowers_of_damascus_spring: "다마스쿠스의 봄에 핀 꽃"
 SYR_flowers_of_damascus_spring_desc: "마침내 시리아의 민주주의가 실현될 수 있는 기회가 찾아왔습니다. 이제 우리는 앞으로 가야할 길을 선택해야 합니다."
 SYR_rifaat_al_assad: "리파트 알아사드"
 SYR_rifaat_al_assad_desc: "리파트 알아사드는 하페즈 알아사드의 형제입니다. 그는 1998년 그가 추방당하기 전 까지 시리아의 부통령이었습니다. 그는 그때부터 본인의 해임은 헌법에 위배되는 것이며, 또한 이전 대통령이 사망한 지금, 자신이 적법한 후계자라고 주장하고 있습니다. 그는 돌아갈 수 있게 된다면 국가를 민주적으로 통치하겠다고 약속했습니다. 그러나 한편으로 보면, 그는 '알아사드' 가문의 사람입니다."
 SYR_arab_news_network: "아랍 뉴스 네트워크"
 SYR_arab_news_network_desc: "리파트의 아들인 수메르는, 현재 아랍 뉴스 네트워크 방송국의 수장입니다. 이 방송국은 주로 리파트의 정치적 대변인의 역할을 하며, 그렇기에 이런 강력한 뉴스 매체를 시리아에 도입하는 것은 리파트의 생각과 주장을 전국적으로 널리 퍼트릴 수 있도록 해줄 것입니다."
 SYR_the_arab_democratic_party: "아랍 민주당"
 SYR_the_arab_democratic_party_desc: "Rifaat founded the Arab Democratic Party in Lebanon in the early 70s, but control over the party has slipped through his hands. He should start a new branch, and gather all his supporters under this legitimate party"
 SYR_kick_out_al_assads: "알아사드 축출"
 SYR_kick_out_al_assads_desc: "알아사드 가문은 어딜가나 볼 수 있습니다. 정부, 언론, 군대, 모든 곳에서 모두 말이죠. 우리는 그들이 시리아의 민주주의를 받아들일 것이라고 확신할 수 없습니다. 그렇기에 그들은 국정 운영에서 물러나야 하며 가문의 주요한 인물들은 추방되어야 합니다."
 SYR_reestablish_political_parties: "정당 개편"
 SYR_reestablish_political_parties_desc: "40년 동안, 국가는 바트당의 단일 통치 아래 운영되어 왔습니다. 우리는 감옥에서 정치범들을 석방하고 추방당한 이들을 국가로 복귀시켜 새로운 정당을 세울 수 있도록 해야합니다. 이는 물론 국가 정세를 완전히 개편하겠지만, 국가의 미래를 위해서는 꼭 필요한 일입니다."
 SYR_free_elections: "자유 선거"
 SYR_free_elections_desc: "이제 시리아의 첫 자유 선거를 시작할 때입니다"
 SYR_israeli_allies: "이스라엘과의 동맹"
 SYR_israeli_allies_desc: "이스라엘은 아랍 지역에서 제일 강력한 국가 중 하나입니다. 그들에 대한 우리의 적대감은 무의미한 일이며, 우리는 서로의 관계를 회복하는 것을 목표로 삼아야 합니다."
 SYR_saudi_allies: "Saudi Allies"
 SYR_saudi_allies_desc: "Saudi Arabia is a massive oil producer and one of the leading countries in the Peninsula Shield. Being on their good side is our priority"
 SYR_american_allies: "미국과의 동맹"
 SYR_american_allies_desc: "미국은 지구상에서 가장 거대한 경제력과 군사력을 보유하고 있습니다. 그들과 함께 하게 된다면 절대로 잃을게 없을 것입니다."
 SYR_iranian_allies: "이란과의 동맹"
 SYR_iranian_allies_desc: "이란은, 물론 시아파 국가임에도 불구하고 시리아의 오래된 동맹국 중 하나입니다. 종교적인 차이가 있을지라도, 이 동맹 관계는 존재할 수 있습니다."
 SYR_concentrate_on_lebanon: "Concentrate On Lebanon"
 SYR_concentrate_on_lebanon_desc: "레바논은 오랫동안 시리아의 표적이 되어왔습니다. 그곳에는 헤즈볼라와 정부 간의 극심한 갈등이 일어나고 있으며, 우리는 이를 활용하여 이득을 볼 것입니다."
 SYR_against_hezbollah: "헤즈볼라에 대한 공작"
 SYR_against_hezbollah_desc: "The Hezbollah are nothing more than a terrorist organisation trying to break down Lebanon. We need to prepare to get rid of them."
 SYR_lebanese_support: "레바논인들에 대한 지지 결집"
 SYR_lebanese_support_desc: "지난 수년간, 헤즈볼라는 레바논에 많은 문제를 일으켜 왔습니다. 이들은 계속해서 성명을 발표해 왔으며, 시간이 지날수록 레바논 정부는 신임을 잃어갔습니다. 레바논 정부와 연락을 취하여 헤즈볼라에 대한 공통 군사작전을 논의해야합니다."
 SYR_strike_hezbollah: "헤즈볼라 축출"
 SYR_strike_hezbollah_desc: "헤즈볼라를 축출할 시간이 왔다."
 SYR_shadow_over_lebanon: "장막이 걷힌 레바논"
 SYR_shadow_over_lebanon_desc: "자국은 레바논 정부가 나라를 통제하는데 도움을 주었고 저들 또한 이러한 도움을 기꺼이 받아들였습니다. 겨우 20년 전, 시라아 정부와 레바논 정부는 돈독한 관계를 맺어왔고, 이것이 지금 현재 우리가 원하는 것입니다."
 SYR_support_hezbollah: "헤즈볼라 지원"
 SYR_support_hezbollah_desc: "Hezbollah is a valuable ally to us. We need to make sure they come out on top and eventually gain control of all of Lebanon"
 SYR_prepare_lebanon_coup: "레바논 잠입"
 SYR_prepare_lebanon_coup_desc: "헤즈볼라는 이미 레바논에서 활동을 하고 있습니다. 이들을 도와서 더욱 더 공고히 자리를 잡도록 해야합니다. 이는 향후에 레바논 정권을 무너뜨리는데 큰 역활을 할 것입니다."
 SYR_lebanese_coup: "레바논 쿠데타"
 SYR_lebanese_coup_desc: "The Hezbollah operatives in Lebanon are ready to carry out a coup. If successful, Hezbollah will gain control of the entire country. If unsuccessful however, the Lebanese army might retaliate.\n\nThe higher the support for Hezbollah, the more likely it is for the coup to succeed"
 SYR_shadow_over_hezbollah: "장막이 걷힌 헤즈볼라"
 SYR_shadow_over_hezbollah_desc: "헤즈볼라가 레바논 정부를 타도하도록 도와주었습니다. 즉 저들은 우리에게 빚을 졌다는 뜻입니다. 이란의 품 안에서 떨어지도록 하고 우리의 품 속에 들어오도록 해야합니다."
 SYR_affirm_presence_in_lebanon: "Affirm Presence In Lebanon"
 SYR_affirm_presence_in_lebanon_desc: "The continuing of the occupation of Lebanon is taking its toll on the economy. We must decide how to handle the future of Lebanon"
 SYR_invest_in_lebanon: "레바논에 투자"
 SYR_invest_in_lebanon_desc: "레바논의 경제에 투자하는 것은 레바논의 사람들에게 우리가 진심으로 레바논을 생각하고 있다는 것을 보여줄 수 있습니다."
 SYR_relocate_lebanese_industry: "레바논 산업 재구성"
 SYR_relocate_lebanese_industry_desc: "몇몇 레바논의 주요 사업들은 그들의 안전을 보장하고, 그들의 공장이 시리아에 적대적으로 사용되지 않게 하기 위해 시리아로 옮겨질 것입니다."
 SYR_commit_more_troops: "더 많은 병력 투입"
 SYR_commit_more_troops_desc: "우리는 레바논에 주둔하고 있는 군사의 양을 늘림으로써 레바논의 안전을 강화해야 합니다."
 SYR_reduce_presence: "주둔군 감소"
 SYR_reduce_presence_desc: "우리는 레바논에서 우리 군대의 일부를 철수해야합니다. 우리 병사들은 집으로 돌아올 자격이 있고, 이제 레바논 군대에게 통제를 맡기도록 할 것입니다."
 SYR_replace_ghazi_kanaan: "가지 카난의 대체자"
 SYR_replace_ghazi_kanaan_desc: "가지 카닌은 1982년 부터 레바논에서 시리아 정보국장으로 활동했으며, 그는 레바논의 통제를 유지하는데 있어 핵심적인 인물이었습니다. 그러나, 이제 새로운 신선한 혈액을 공급해줘야할 때입니다. 우리는 카난을 복귀시켜 시리아의 정치 안보 부서 (PSD)의 수장으로 임명할 것입니다. 레바논에서, 카난의 자리는 부국장 이었던, 정보 기관 업계에서 떠오르는 유망주 루스툼 가잘레로 대체될 것 입니다."
 SYR_recall_intelligence: "요원 복귀"
 SYR_recall_intelligence_desc: "우리는 레바논으로부터 정보 요원 인력을 회수해야합니다. 정보 인력을 시리아에 주둔하게 함으로써, 그들은 시리아를 보호하는데 더욱 힘쓸 수 있을 것입니다."
 SYR_reduced_political_liberty: "정치적 자유 축소"
 SYR_reduced_political_liberty_desc: "일부 조직들과 정당들은 우리가 레바논에 개입하는 것을 좋게 보고 있지 않습니다. 우리는 표현과 모임의 자유를 제한하고, 특정 발행물을 통해 우리를 더럽히는 짓을 금지해야만 합니다."
 SYR_encourage_campaigning: "캠페인 운동 장려"
 SYR_encourage_campaigning_desc: "우리는 레바논 정부에 대한 통제를 일부 완화하고, 더욱 자치적인 국가 운영을을 허용해 주어야합니다."
 SYR_assassinate_lebanese_prime_minister: "레바논 총리 암살"
 SYR_assassinate_lebanese_prime_minister_desc: "The Prime Minister of Lebanon, Rafic Hariri, is an outspoken critic of Syria's occupation. It might be better if he was gone from the picture, though doing this will surely spark outrage in the international community even if we can cover our tracks"
 SYR_raids_against_hezbollah: "헤즈볼라에 대한 공습"
 SYR_raids_against_hezbollah_desc: "헤즈볼라는 레바논을 무너트리려는 테러 조직에 지나지 않습니다. 우리는 그들의 군대에 대한 공습을 시작해야하며, 레바논에 대한 그들의 간섭을 약화시켜야 합니다."
 SYR_integrate_lebanon: "레바논 통합"
 SYR_integrate_lebanon_desc: "이제 레바논을 우리와 더 가까이 둬야할 때입니다. 우리는 전 군대를 동원할 것이며 그들의 의회를 명목상의 지역 회의 수준으로 낮출 것입니다. 우리는 이미 헤즈볼라의 전폭적인 지지를 받고 있으며, 그들은 이 작전을 도울 것입니다."
 SYR_withdraw_from_lebanon: "레바논으로부터 철수"
 SYR_withdraw_from_lebanon_desc: "이제 레바논에서 완전히 떠날 때가 되었으며, 그들이 본인들만의 길을 걸어가도록 해줄 것입니다."
 SYR_greater_syria: "대시리아"
 SYR_greater_syria_desc: "시리아 사회민족당은 대시리아를 꿈꿉니다. 이 국가는 시나이에서 이라크까지, 북부 아라비아에서 타우루스 산맥까지 뻗어 있을 것입니다. 우리는 모든 시리아 민족을 하나의 깃발 아래 통합할 것입니다!"
 SYR_lebanese_chaos: "레바논의 혼란"
 SYR_lebanese_chaos_desc: "레바논은 정부와 헤즈볼라 민병대로 나라가 쪼개지면서 완전한 정치적 혼란에 빠져 있습니다. 우리는 위장 공작 공격을 실시해야 합니다."
 SYR_deal_with_scraps: "쓰레기들과의 협상"
 SYR_deal_with_scraps_desc: "이제 레바논이 약해졌으니, 이 분쟁을 구실로 삼아 진입하여 우리 자신의 국가 안보를 확보해야 합니다."
 SYR_assault_jordan: "하심 가문 타도"
 SYR_assault_jordan_desc: "요르단은 시리아 사회민족당이 활동하는 세 나라 중 하나입니다(시리아, 레바논 외). 이 당의 주요 지지는 그곳에 거주하는 팔레스타인 디아스포라에게서 나옵니다. 우리는 그곳의 사회민족당을 지원하고, 현 하심 왕가 정권을 축출하도록 부추겨야 합니다."
 SYR_arm_palestinians_to_fight: "팔레스타인 무장"
 SYR_arm_palestinians_to_fight_desc: "요르단에는 많은 팔레스타인 난민이 거주하고 있습니다. 이 난민들을 전사로 만들어 팔레스타인과 이스라엘에서 혼란을 일으키도록 부추길 수 있습니다. 이들은 대리 전투원이므로 이스라엘의 보복을 유도하여 이스라엘이 분쟁에서 악역처럼 보이게 만들 수 있습니다."
 SYR_zionist_threat: "시오니스트의 위협"
 SYR_zionist_threat_desc: "이스라엘은 모든 무슬림에 대한 가장 큰 모욕이며, 이슬람의 심장부에 자리 잡은 가증스러운 가짜 국가입니다. 이들은 지구상에서 쓸어버려야 합니다."
 SYR_befriend_sudan: "수단과의 협상"
 SYR_befriend_sudan_desc: "수단은 이집트와 할라이브 삼각지대를 둘러싼 분쟁을 계속하고 있습니다. 우리는 수단과 동맹을 맺고 공동의 위협으로 이집트가 우리에게 영토를 양보하도록 설득할 수 있을 것입니다."
 SYR_demand_sinai: "시나이 반도 요구"
 SYR_demand_sinai_desc: "시나이는 우리에게 매우 중요한 전략적 가치가 있습니다. 서쪽에서 오는 어떤 공격에도 대비할 훌륭한 방어 거점을 제공할 뿐 아니라, 수에즈 운하를 감시하고 통제할 기회도 줍니다.\n\n거래를 원활히 하기 위해 이집트에 운하의 공동 통제권을 제안할 것입니다"
 SYR_iraq_divisions: "이라크 사단"
 SYR_iraq_divisions_desc: "이라크는 여러 민족과 종교 집단으로 나뉘어 있습니다. 이러한 분열을 이용해 이라크에서 종교 봉기를 일으켜 국력을 약화시킬 수 있습니다."
 SYR_mop_up_iraq: "이라크 청소"
 SYR_mop_up_iraq_desc: "이라크의 현재 치안 상황은 우리의 국가 안보에 위협이 됩니다. 이를 구실로 삼아 병력을 이라크에 진입시키는 것을 정당화할 수 있습니다."
 SYR_concessions_to_kurds: "쿠르드 족에 대한 인정"
 SYR_concessions_to_kurds_desc: "쿠르드인은 우리가 통제하고자 하는 지역의 대규모 민족 집단입니다. 이들은 오랫동안 공식 국가 없이 존재해 왔으며, 거주하는 대부분의 나라에서 권리를 제한받고 있습니다. 대시리아 내 자치 구역을 약속하면 강력한 동맹을 얻을 수 있을 것입니다."
 SYR_submission_kuwait: "쿠웨이트의 항복"
 SYR_submission_kuwait_desc: "쿠웨이트는 식민 열강이 만든 인위적인 국가이며, 현 왕실은 서방 열강의 지원으로만 권력을 유지하고 있습니다. 쿠웨이트 국민은 식민 지배자들로부터 해방되어야 합니다."
 SYR_crush_the_sauds: "사우디 탄압"
 SYR_crush_the_sauds_desc: "아라비아 북부는 대시리아의 자연스러운 일부입니다. 경제적으로는 중요하지 않지만, 순전히 원칙상 이 영토를 포기할 수는 없습니다. 사우디아라비아가 양보하도록 압박해야 합니다."
 SYR_kurds_in_turkey: "터키의 쿠르드족"
 SYR_kurds_in_turkey_desc: "쿠르디스탄 노동자당(PKK)은 수십 년간 튀르키예를 상대로 게릴라전을 벌여 왔습니다. 우리는 국경 우리 쪽에 이들을 위한 피난처를 제공해야 합니다. 그러면 튀르키예로 진격할 때 이들의 전투원을 활용해 병력을 보강할 수 있습니다."
 SYR_kurds_in_iran: "이란 내 쿠르드인"
 SYR_kurds_in_iran_desc: "이란에는 약 700만 명의 쿠르드인이 거주합니다. 현재 이란 쿠르디스탄 민주당이 정부를 상대로 소규모 게릴라전을 벌이고 있습니다. 규모는 작지만, 이들이 우리의 대의에 충성을 맹세한다면 쿠르디스탄에서 은신처를 제공할 수 있습니다."
 SYR_align_azerbaijan: "아제르바이잔과의 동맹"
 SYR_align_azerbaijan_desc: "아제르바이잔은 이란과 상당히 냉랭한 관계입니다. 두 나라 모두 시아파 국가이며 역사를 공유하지만, 아제르바이잔의 친튀르키예·친이스라엘 노선과 이란의 친아르메니아 노선이 양국 관계를 식게 했습니다. 게다가 이란에는 이란령 아제르바이잔에 거주하는 아제리인이 많습니다. 동맹의 대가로 아제리인이 거주하는 이란 영토를 아제르바이잔에 제안해야 합니다."
 SYR_taurus_mountains: "타우루스 산맥"
 SYR_taurus_mountains_desc: "아나톨리아 남동부의 타우루스 산맥은 시리아를 보호하는 완벽한 천연 장벽입니다. 따라서 이 땅은 시리아의 자연스러운 일부이며 우리의 것이 되어야 합니다."
 SYR_alawite_militias: "알라위 족에 대한 군대 모집"
 SYR_alawite_militias_desc: "라타키아와 마찬가지로 하타이 지역에도 민족종교적 무슬림 종파인 알라위파가 주로 거주합니다. 많은 알라위파가 튀르키예의 수니파 다수에게 억압받는다고 느낍니다. 이러한 불만을 이용해 그들 중 일부를 우리 군의 준군사 조직원으로 모집할 수 있습니다."
 SYR_align_armenia: "아르메니아와의 동맹"
 SYR_align_armenia_desc: "아르메니아와 튀르키예는 공식적인 외교 관계를 맺은 적이 없습니다. 이는 주로 튀르키예가 아르메니아 집단 학살을 인정하지 않고 양국 간 국경 분쟁이 계속되고 있기 때문입니다. 아르메니아는 현재 국경을 공식적으로 인정하지만, 튀르키예는 그 약속이 충분히 확고하다고 느끼지 않습니다. 도움을 주는 대가로 아르메니아에 튀르키예 북동부를 약속할 수 있습니다."
 SYR_align_greece: "그리스와의 동맹"
 SYR_align_greece_desc: "둘 다 NATO 회원국이지만 [GRE.GetName]와(과) [TUR.GetName]의 관계는 그리 따뜻하지 않습니다. 에게해에서 국경 분쟁이 있으며, 그리스의 일부 민족주의 성향 파벌은 메갈리 이데아에 근거해 튀르키예의 영토 일부를 주장합니다. 그리스는 튀르키예에 맞서는 매우 강력한 동맹이 될 수 있습니다."
 SYR_divide_turkey: "터키의 분할"
 SYR_divide_turkey_desc: "튀르키예를 분할할 때가 왔습니다. 동맹이 모인 이상 튀르키예는 우리 모두를 상대로 싸울 수 없습니다."
 SYR_claim_cyprus: "키프로스 요구"
 SYR_claim_cyprus_desc: "키프로스는 서쪽에서 시리아 중심부로 오는 어떤 침공에도 맞설 완벽한 보루입니다. 이 섬은 마땅히 우리의 통치 아래 있어야 합니다."
 SYR_align_cyprus: "키프로스 압박"
 SYR_align_cyprus_desc: "키프로스는 섬에서 더 부유하고 강한 세력이므로 동맹으로 삼기에 최선의 선택입니다. 그러나 이는 튀르키예의 보호를 받는 북키프로스와 우리를 충돌하게 만들 것입니다."
 SYR_align_northern_cyprus: "북키프로스 압박"
 SYR_align_northern_cyprus_desc: "북키프로스의 튀르크계 주민은 섬을 통제하는 데 완벽한 동맹이 될 것입니다. 그러나 이는 우리를 키프로스, 그리고 어쩌면 그리스와도 충돌하게 만들 것입니다."
 SYR_invade_cyprus: "키프로스 침공"
 SYR_invade_cyprus_desc: "우리에게는 동맹이 필요 없습니다. 이 섬을 오롯이 우리 힘으로 차지할 것입니다. 누구도 우리를 막을 수 없습니다!"
 SYR_weaken_iran: "이란 약화"
 SYR_weaken_iran_desc: "이란은 동쪽의 강력한 나라이지만, 인구의 상당수가 민족적으로 페르시아인이 아니라는 약점이 있습니다. 이 약점을 이용해 장차 이란을 침공할 수 있습니다."
 SYR_palestinian_unemployment_program: "팔레스타인 실업 프로그램"
 SYR_palestinian_unemployment_program_desc: "요르단에는 많은 팔레스타인인이 살고 있으며, 그중 다수는 시민권을 받은 적이 없습니다. 이들이 일자리를 구하기 어렵기 때문에 실업률이 매우 높습니다. 이 상황을 바로잡고 이들이 일자리를 찾도록 도와야 합니다."
 SYR_military_reform: "군대 개혁"
 SYR_military_reform_desc: "시리아군은 개혁이 절실합니다. 시리아 아랍군은 정예 공화국 수비대와 정규군으로 나뉘어 있으며, 장교단은 알라위 소수 집단이 장악하고 있습니다."
 SYR_conscription_army: "징병군"
 SYR_conscription_army_desc: "시리아는 징병제 군대를 운용해 온 오랜 역사가 있으므로 이를 유지해야 합니다. 징집병을 활용하면 더 큰 군대를 보유할 수 있으며, 서로 다른 배경을 지닌 사람들을 하나로 묶는 좋은 방법이기도 합니다."
 SYR_volunteer_army: "의용군"
 SYR_volunteer_army_desc: "징병제 군대는 비용이 많이 들고 불필요합니다. 대신 지원병으로 구성된 더 작지만 훈련이 잘되고 사기가 높은 군대에 집중해야 합니다."
 SYR_peoples_army: "인민군"
 SYR_peoples_army_desc: "시리아는 여러 민족으로 구성되어 있습니다. 군대는 모든 민족을 위해 봉사해야 합니다. 현지인으로 구성되어 지역 방어를 담당할 지역 조직을 만들어야 합니다."
 SYR_loyal_elite: "충성스러운 지식인"
 SYR_loyal_elite_desc: "시리아는 충성스러운 엘리트가 장악한 군대로 지키는 것이 최선입니다. 시리아의 경우 그것은 공화국 수비대와 알라위파 장교단이 될 것입니다."
 SYR_guerrilla_warfare: "게릴라전"
 SYR_guerrilla_warfare_desc: "전쟁의 미래는 적과의 정면 충돌이 아니라 적의 후방을 타격하고 괴롭히는 데 있습니다. 우리는 우리보다 군대가 큰 여러 적대국에 둘러싸여 있으므로 정면으로 맞붙어서는 이길 수 없습니다."
 SYR_decentralised_tactics: "분산화 전술"
 SYR_decentralised_tactics_desc: "우리 부대가 독자적으로 행동하고 지역 작전을 수행하도록 훈련시켜야 합니다. 우리 군은 최고 사령부와 연락이 끊겨도 기동할 수 있어야 하며, 분권화된 전투 훈련이 그 열쇠입니다."
 SYR_centralised_tactics: "중앙 통제 전술"
 SYR_centralised_tactics_desc: "우리는 언제나 모든 부대의 위치를 명확히 파악하고 있어야 합니다. 모든 기동은 세부 사항까지 정확히 실행되어야 하며, 부대는 중앙에서 통제하고 지휘해야 합니다. 이것이 효과적인 작전을 보장하는 유일한 방법입니다."
 SYR_homs_military_academy: "홈스 사관학교 확장"
 SYR_homs_military_academy_desc: "홈즈 사관학교는 시라아의 가장 거대하고 권위있는 사관학교로 1933년부터 운영되어 왔습니다. 우리는 사관학교를 확장하고 군대뿐만 아니라 다른 부문에서도 훈련을 제공해야 합니다."
 SYR_expand_tartus_base: "타르투스 해군기지 확장"
 SYR_expand_tartus_base_desc: "The Tartus naval base was first used by the Soviet Union and then by Russia as a naval base to have easy access on the Mediterranean. In its current size, it can really only serve as a station for vessels smaller than frigates. We need to expand its docks to base larger vessels"
 SYR_tartus_dockyards: "타르투스 조선소"
 SYR_tartus_dockyards_desc: "타르투스의 부두를 확장했으니, 함선 정비를 위한 조선소를 건설하여 수리 및 개수 능력도 확장해야 합니다."
 SYR_expand_tiyas_air_base: "티야스 공군기지 확장"
 SYR_expand_tiyas_air_base_desc: "The Tiyas Airbase is the largest in Syria. It is located in a crucial central location, allowing us to cover the airspace of all of Syria from a well protected position. We need to expand its facilities to allow us to base more of our aircraft there"
 SYR_fuel_reserve: "연료 보유량 증가"
 SYR_fuel_reserve_desc: "Hosting a larger air force will require us to increase our strategic fuel reserve. By having a larger reserve, we will be able to operate our air force longer in case our fuel supply is compromised"
 SYR_support_tactics: "지원 전술"
 SYR_support_tactics_desc: "In addition to our army, we must also train our navy and air force to act as support elements"
 SYR_military_production: "군대 생산"
 SYR_military_production_desc: "우리는 다른 나라에서 무기를 수입하는 데 지나치게 의존하고 있습니다. 외국 무기에 대한 의존도를 줄이기 위해 국내 공방을 세워야 합니다."
 SYR_purchase_armoured_vehicles: "장갑차 구매"
 SYR_purchase_armoured_vehicles_desc: "우리 육군은 기계화 비중이 높습니다. 국내 생산 차량이 없으므로 외국에서 장비를 구매하여 보급량을 보충해야 합니다."
 SYR_purchase_planes: "항공기 구매"
 SYR_purchase_planes_desc: "우리 공군은 지상 지원에 중점을 두고 있습니다. 국내 생산 항공기가 없으므로 외국에서 장비를 구매하여 보급량을 보충해야 합니다."
 SYR_fuel_production: "연료 생산"
 SYR_fuel_production_desc: "새 차량을 계속 가동하려면 많은 연료가 필요합니다. 군용으로 쓸 연료가 더 많이 남도록 바이오 연료 정제소를 세워야 합니다."
 SYR_improved_supply: "향상된 지원"
 SYR_improved_supply_desc: "시리아의 지형은 때때로 매우 험준합니다. 병력의 효율을 보장하기 위해 기반시설과 보급선을 개선해야 합니다."
 SYR_maintenance_depots: "정비창"
 SYR_maintenance_depots_desc: "공군을 계속 운용하는 일은 많은 노력이 필요합니다. 예비 부품을 생산하고 항공기를 정비할 수 있도록 정비 창고를 세워야 합니다."
 SYR_electronic_army: "시리아 사이버군"
 SYR_electronic_army_desc: "현대의 전장은 인터넷 상에서 펼쳐집니다. 스팸, DDoS 공격, 가짜 뉴스, 해킹으로 적을 공격할 해커 집단을 구성해야 합니다."
 SYR_research_center: "육군 연구 센터"
 SYR_research_center_desc: "육군이 운영하는 연구 센터를 설립하여 국산 무기와 기술을 생산하고 연구하는 역량을 키워야 합니다."
 SYR_form_damascus_steel: "'다마스쿠스 철강' 설립"
 SYR_form_damascus_steel_desc: "시리아에는 공식적인 무기 회사가 없습니다. 새 회사에 자금을 지원하여 국영 무기 회사인 다마스쿠스 스틸을 설립해야 합니다. 이 회사는 우리를 위해 보병 무기를 설계하고 생산하기 시작할 것입니다."
 SYR_subsidise_hmisho_vehicles: "'미쇼 무역 그룹' 보조금 지원"
 SYR_subsidise_hmisho_vehicles_desc: "흐미쇼 무역 그룹은 시리아에서 가장 큰 산업 복합 기업 중 하나입니다. 이들은 많은 차량을 수입하고 자회사를 통해 다수의 차량 정비소를 운영하며, 국내 최대 규모의 제철소 중 하나도 운영하고 있습니다. 이들에게 보조금을 지급하여 장갑차를 개발하고 제조하는 회사를 설립하도록 돕고 강철 생산을 늘려야 합니다."
 SYR_diplomatic_effort: "외교적 노력"
 SYR_diplomatic_effort_desc: "중동은 불안한 지역이며, 이 지역에서 우리의 외교는 신중하게 움직여야 합니다."
 SYR_affirm_claims_on_golan: "골란에 대한 영유권 주장"
 SYR_affirm_claims_on_golan_desc: "이스라엘은 6일 전쟁 이래 골란 고원을 점령하고 있습니다. 우리는 이 지역을 여전히 우리의 중핵 주 중 하나로 간주하며 이스라엘의 점령이 불법임을 국제 사회에 선언해야 합니다."
 SYR_renounce_claims_on_golan: "골란에 대한 영유권 포기"
 SYR_renounce_claims_on_golan_desc: "이스라엘은 아주 오랫동안 골란 고원을 점령해 왔습니다. 이 지역에는 주로 이스라엘계 유대인이 거주합니다. 우리는 전쟁에서 패배했음을 인정하고 이 지역에 대한 영유권 주장을 포기하며 이스라엘과의 적대적 관계를 회복하기 시작해야 합니다."
 SYR_meet_hamas: "하마스와의 만남"
 SYR_meet_hamas_desc: "하마스는 파타의 주요 경쟁자입니다. 이들은 외교보다 무장 투쟁을 통한 팔레스타인 해방에 더 집중해 왔습니다."
 SYR_new_intifada: "신 인티파다 (Intifada)"
 SYR_new_intifada_desc: "하마스가 이스라엘 점령자들에 맞서 새로운 인티파다를 시작하도록 장려해야 합니다."
 SYR_meet_fatah: "파타와의 만남"
 SYR_meet_fatah_desc: "파타는 하마스의 주요 경쟁자입니다. 이들은 외교를 통한 팔레스타인의 권리 달성에 더 집중합니다."
 SYR_diplomatic_pressure_on_israel: "팔레스타인 보호"
 SYR_diplomatic_pressure_on_israel_desc: "We need to protect the Palestinians. By announcing that we are the protectors of Palestine, Israel will be less likely to be aggressive against them."
 SYR_repair_relations_with_israel: "이스라엘과의 관계 재정비"
 SYR_repair_relations_with_israel_desc: "우리는 오랫동안 아무 이유 없이 이스라엘에 적대적이었습니다. 이 증오를 끝내고 중동에서 평화를 구축하기 시작해야 합니다."
 SYR_one_state_solution: "'하나의 국가' 지원"
 SYR_one_state_solution_desc: "이스라엘은 자국 영토에 대한 정당한 권리가 있습니다. 이스라엘은 수십 년간 자국 땅을 지켜냄으로써 이를 증명했습니다. 이스라엘이 이곳에 계속 있을 것이라는 현실을 받아들여야 하며, 팔레스타인인들도 이와 함께 사는 법을 배워야 합니다."
 SYR_two_state_solution: "두 국가 문제 지원"
 SYR_two_state_solution_desc: "평화는 이스라엘을 둘로 나누어, 즉 팔레스타인 영토와 이스라엘 영토로 나누어 수립하는 것이 가장 좋습니다. 이렇게 하면 양측이 각자의 땅에서 평화롭게 살 수 있습니다."
 SYR_levant_defence_pact: "예루살렘 방위 협정"
 SYR_levant_defence_pact_desc: "예루살렘은 그것을 지키려는 모든 이와 함께 방어해야 합니다. 우리는 동맹을 모아야 합니다."
 SYR_invite_jordan: "요르단 초대"
 SYR_invite_jordan_desc: "요르단에는 대규모 팔레스타인 디아스포라가 거주하며, 이스라엘이 팔레스타인인들에게 가한 행위를 자주 비판해 왔습니다. 이들의 도움이 있다면 분쟁이 발발할 경우 서안 지구에 신속히 접근할 수 있을 것입니다."
 SYR_invite_egypt: "이집트 초대"
 SYR_invite_egypt_desc: "이집트는 오랫동안 가자 지구의 생명줄이었으며, 역사상 한때는 이 지역을 직접 통치하기도 했습니다. 이집트와 동맹을 맺으면 이스라엘에 맞선 남쪽 측면을 확보하고 가자를 지키는 데 도움이 될 것입니다."
 SYR_meeting_with_kings: "왕과의 만남"
 SYR_meeting_with_kings_desc: "우리와 [SAU.GetName]의 관계는 냉전과 현대에 걸쳐 크게 달라져 왔습니다. 우리는 그들의 존재를 부정할 수 없으며, 그들과 함께 사는 법을 배워야 합니다. [ROOT.GetLeader]은(는) 양국 관계를 개선하기 위해 [SAU.GetLeader]을(를) 만나야 합니다."
 SYR_open_saudi_mosques: "사우디 사원 (모스크) 개방"
 SYR_open_saudi_mosques_desc: "사우디아라비아는 전 세계 곳곳의 많은 모스크와 마드라사에 자금을 지원합니다. 우리에게도 자금을 지원해 달라고 요청해야 합니다. 물론 이는 그들에게 우리에 대한 영향력을 어느 정도 주게 되며, 사우디가 운영하는 모스크의 일부 이맘이 가장 관용적인 부류가 아니라는 점은 잘 알려져 있습니다."
 SYR_saudi_oil_cooperation: "사우디 석유 협력"
 SYR_saudi_oil_cooperation_desc: "우리와 사우디 모두 석유 생산국입니다. 이 분야에서 협력을 강화하는 것이 우리에게 이로울 것입니다."
 SYR_join_peninsula_shield: "반도방위군에 대한 흥미"
 SYR_join_peninsula_shield_desc: "페닌슐라 실드는 걸프 협력 회의의 군대입니다. 사우디아라비아에 페닌슐라 실드와의 더 긴밀한 통합을 원한다는 신호를 보내야 합니다."
 SYR_saudi_military_cooperation: "사우디 군사 협력"
 SYR_saudi_military_cooperation_desc: "걸프 국가들은 많은 군사 작전을 공동으로 수행합니다. 이들에게는 자체 연구 협력 프로그램도 있으며, 우리는 반드시 이에 참여해야 합니다."
 SYR_saudi_oil_investments: "사우디 석유 투자"
 SYR_saudi_oil_investments_desc: "석유 생산을 늘리기 위해 사우디에 우리 유전 일부에 투자해 달라고 요청해야 합니다."
 SYR_trade_deal_with_egypt: "이집트와의 무역 협정"
 SYR_trade_deal_with_egypt_desc: "이집트는 우리와 가까운 크고 강력한 나라이며, 과거에 우리와 긴밀한 관계를 맺었습니다. 이집트와 무역 협정을 맺어야 합니다."
 SYR_repair_relations_with_iraq: "이라크와의 관계 재정비"
 SYR_repair_relations_with_iraq_desc: "이라크와 시리아의 바트당 사이의 갈등으로 인해 양국 관계는 오랫동안 매우 적대적이었습니다. 이 관계를 회복하고 바트당들이 다시 협력하도록 만들어야 하지 않을까요?"
 SYR_revive_baathist_dream: "바트주의 꿈 부흥"
 SYR_revive_baathist_dream_desc: "바트주의의 핵심 교리 중 하나는 아랍 민족주의이며, 범아랍 국가의 창설을 목표로 합니다. 현재 바트당은 시리아 주도 파벌과 이라크 주도 파벌로 나뉘어 있습니다. 많은 바트당 지부는 존재감조차 희미한 군소 정당입니다. 바트주의가 새로운 유행임을 보여주기 위해, 먼저 시리아 주도 파벌의 지역 지부에 자금을 쏟아부어야 합니다."
 SYR_baathist_renaissance: "바트주의 부흥"
 SYR_baathist_renaissance_desc: "바트주의의 이라크 주도 파벌은 시리아 주도 파벌보다 더 널리 퍼져 있습니다. 우리의 꿈을 이루려면 이들에게도 자금을 지원해야 합니다."
 SYR_the_arab_union: "아랍 연합 공화국 형성"
 SYR_the_arab_union_desc: "아랍 연합 공화국은 이집트와 시리아 사이의 단명한 연합이었습니다. 이 공화국 외에도 리비아, 이라크, 요르단 같은 나라들이 주도하여 아랍 국가들을 하나의 국가로 통합하자는 여러 제안과 시도가 있었습니다. 연합은 실패했지만 우리는 다시 시도해야 합니다. 이집트는 우리와 다시 통합할 준비가 되어 있습니다."
 SYR_denounce_iraq: "이라크 비난"
 SYR_denounce_iraq_desc: "이라크는 잘못된 부류의 바트주의자들이 이끄는 비열한 국가입니다. 우리는 결코 이들을 친구라 불러서는 안 되며, 대신 그들의 추악한 행태를 규탄해야 합니다."
 SYR_iranian_sponsorship: "이란 후원"
 SYR_iranian_sponsorship_desc: "이란은 우리에게 완벽한 동맹이 될 것입니다. 이란인은 우리와 마찬가지로 시아파이며, 우리와 세계관을 공유합니다."
 SYR_fund_hezbollah: "헤즈볼라 경제적 지원"
 SYR_fund_hezbollah_desc: "헤즈볼라는 주로 레바논에서 활동하는 강력한 무장 단체입니다. 이들은 매우 강력한 민병대를 보유하고 있으며, 이들이 우리 편에 있는 것은 분명 이롭습니다."
 SYR_the_resistance_axis: "저항 추축 동맹 (Resistance Axis) 가입"
 SYR_the_resistance_axis_desc: "저항의 축은 이란이 이끄는 중동의 반미 국가들의 모임입니다. 이들과 동맹을 맺는 것이 우리의 전략적 이익에 부합합니다."
 SYR_iranian_quds: "이란 쿠드스군 (Quds)"
 SYR_iranian_quds_desc: "이란 쿠드스는 이란 혁명수비대의 특수 부대이자 준군사 조직입니다. 이들은 세계 각지의 분쟁에서 이란의 영향력을 확산시키는 특별한 수단입니다."
 SYR_irgc_military_college: "이슬람 혁명 수비대 (IRGC) 군사 학교"
 SYR_irgc_military_college_desc: "지휘참모대학교는 이란 혁명수비대의 군사 참모 학교입니다. 이곳은 혁명수비대의 군사 교리가 규정하는 비정규전 군사학에 집중합니다."
 SYR_reaffirm_claims_on_hatay: "하타이 영유권 재주장"
 SYR_reaffirm_claims_on_hatay_desc: "하타이는 1930년대에 프랑스가 튀르키예에 할양했습니다. 이는 우리의 동의 없이 이루어졌습니다. 이 지역에는 여전히 알라위파 인구가 많으며, 이 지역은 시리아에 반환되어야 합니다."
 SYR_provide_intelligence_to_pkk: "쿠르디스탄 노동자당 (PKK)에게 정보 제공"
 SYR_provide_intelligence_to_pkk_desc: "PKK는 튀르키예에서 활동하는 쿠르드 게릴라 조직입니다. 이들은 독립 쿠르디스탄을 세우기 위해 수십 년간 튀르키예 정부와 싸워 왔습니다. 이 지역에서 튀르키예의 영향력을 약화시키기 위해 튀르키예군에 관한 정보를 이들에게 제공해야 합니다."
 SYR_pkk_training_camps: "쿠르디스탄 노동자당 (PKK) 훈련 캠프 설립"
 SYR_pkk_training_camps_desc: "시리아 북부에 PKK 게릴라를 위한 훈련소를 세워야 합니다. 이는 PKK의 효율성을 높일 것이며, 그중 일부는 우리와 함께하려 할 수도 있습니다."
 SYR_weapons_to_pkk: "쿠르디스탄 노동자당 (PKK)에게 무기 지원"
 SYR_weapons_to_pkk_desc: "PKK는 무기 없이는 싸울 수 없습니다. 이들이 더 강해지고, 혹시 독립을 달성하더라도 우리와 더 가까워지도록 무기를 공급해야 합니다."
 SYR_approach_armenia: "아르메니아 접근"
 SYR_approach_armenia_desc: "아르메니아는 튀르키예의 이웃 국가 중 하나이며, 두 나라는 서로 매우 냉랭한 관계입니다. 아르메니아에 접근하여 친교를 맺도록 노력해야 합니다."
 SYR_approach_greece: "그리스에 접근"
 SYR_approach_greece_desc: "그리스는 에게해의 일부 섬을 둘러싸고 튀르키예와 오랜 분쟁을 겪고 있습니다. 그들의 호감을 사는 것이 이로울 것입니다."
 SYR_support_cyprus: "키프로스 지원"
 SYR_support_cyprus_desc: "키프로스 섬은 튀르키예가 통제하는 북부와 키프로스가 통제하는 남부로 나뉘어 있습니다. 키프로스가 섬의 지배적 세력이 되려는 노력을 지원해야 합니다."
 SYR_renounce_claims_on_hatay: "하타이 영유권 포기"
 SYR_renounce_claims_on_hatay_desc: "우리는 거의 한 세기 동안 하타이를 통제하지 못했습니다. 이 지역에 대한 영유권 주장을 포기하고 튀르키예와의 관계를 회복해야 합니다."
 SYR_close_pkk_border: "쿠르드 국경 폐쇄"
 SYR_close_pkk_border_desc: "PKK 전투원들이 튀르키예에서 탈출하는 데 국경을 이용하지 못하도록 시리아-튀르키예 국경에 대한 감시를 강화해야 합니다."
 SYR_approach_azerbaijan: "아제르바이잔 접근"
 SYR_approach_azerbaijan_desc: "아제르바이잔은 튀르키예의 가까운 동맹이므로, 이들에게도 접근해야 합니다."
 SYR_turkish_delights: "터키의 환희"
 SYR_turkish_delights_desc: "튀르키예는 이 지역의 경제 강국입니다. 양측 모두에 이익이 되는 경제 협정을 맺어야 합니다."
 SYR_support_nothern_cyprus: "북키프로스 지원"
 SYR_support_nothern_cyprus_desc: "키프로스 섬은 튀르키예가 통제하는 북부와 키프로스가 통제하는 남부로 나뉘어 있습니다. 튀르크계 키프로스가 섬의 지배적 세력이 되려는 노력을 지원해야 합니다."
 SYR_approach_russia: "러시아에 접근"
 SYR_approach_russia_desc: "러시아는 소련의 전략을 계승해 우리를 전략적 자산으로 여기며 오랫동안 우호적인 거래를 해 왔습니다. 러시아는 강력한 동맹이 되므로 관계를 더욱 깊이 해야 합니다."
 SYR_russian_weapons: "러시아 무기"
 SYR_russian_weapons_desc: "러시아는 주요 무기 수출국입니다. 러시아 무기 일부를 라이선스 생산할 수 있는 허가를 얻도록 협정을 체결해야 합니다."
 SYR_russian_trade: "러시아 무역"
 SYR_russian_trade_desc: "러시아는 석유와 천연가스의 대규모 생산국이므로 무역 계약을 협상해야 합니다."
 SYR_lease_latakia: "타르투스 해군기지 임대"
 SYR_lease_latakia_desc: "러시아는 우리가 타르투스에 해군 기지를 제공하면 소련 시대 부채의 73%를 탕감해 주기로 합의했습니다."
 SYR_russian_military_cooperation: "러시아 군사 협력"
 SYR_russian_military_cooperation_desc: "CSTO는 강력한 군사 동맹입니다. 러시아와 가까워지고 공식적으로 가입해야 합니다."
 SYR_join_war_on_terror: "'테러와의 전쟁' 참여"
 SYR_join_war_on_terror_desc: "미국이 테러와의 전쟁을 선포했습니다. 우리는 극단주의 이슬람주의자들의 위협을 너무나 잘 알고 있습니다. 테러에 맞선 미국의 노력을 지지해야 합니다."
 SYR_joint_us_operations: "미국 합동 작전"
 SYR_joint_us_operations_desc: "우리는 테러와 싸우는 미국을 할 수 있는 모든 방법으로 도와야 합니다. 여기에는 정보를 제공하고, 미국이 특수 부대로 우리 국경 안에서 대테러 작전을 수행하도록 허용하는 것이 포함됩니다."
 SYR_closer_ties_to_france: "프랑스와의 관계 개선"
 SYR_closer_ties_to_france_desc: "프랑스는 우리의 옛 식민 지배국이며 유럽에서 가장 강한 나라 중 하나입니다. 많은 옛 프랑스 식민지가 프랑스와의 관계를 유지해 왔으며, 우리도 그렇게 해야 합니다."
 SYR_condemn_taliban: "탈레반 비난"
 SYR_condemn_taliban_desc: "탈레반은 이슬람의 혐오스러운 집단을 대표합니다. 우리는 합법적인 아프간 정부를 지원하여 이 테러리스트에 맞서야 합니다"
 SYR_air_practice_with_britain: "영국과 공군 훈련"
 SYR_air_practice_with_britain_desc: "영국은 키프로스에 공군 기지를 보유하고 있습니다. 따라서 우리 공군과 함께 훈련하기에 완벽한 파트너입니다."
 SYR_french_investments: "프랑스의 투자"
 SYR_french_investments_desc: "프랑스인들은 옛 식민지에 돈을 쏟아붓는 것을 좋아합니다. 우리 산업 부문에 투자하도록 장려해야 합니다."
 SYR_us_investments: "미국의 투자"
 SYR_us_investments_desc: "미국인들은 석유를 매우 좋아합니다. 일부 미국 기업에 우리 유전을 더 개발해 달라고 요청할 수 있습니다."
 SYR_british_investments: "영국의 투자"
 SYR_british_investments_desc: "영국과의 공군 훈련 이후, 영국은 테러에 맞서려면 우리의 군사 역량 향상을 도와야 한다는 점을 이해하게 되었습니다."
 SYR_major_nato_ally: "주요 비NATO 동맹국의 일원이 되다"
 SYR_major_nato_ally_desc: "주요 비NATO 동맹국은 NATO의 회원국은 아니지만 미국의 중요한 군사적 동맹이 되는 국가들을 위해 미국 정부가 인정하는 지위입니다. 미국과 동맹이 되는 것은 우리가 군사적으로 더욱 준비된 국가가 될 수 있을 것입니다."
 SYR_harbor_extremists: "극단주의자 보호 및 지원"
 SYR_harbor_extremists_desc: "지하디스트들은 위대한 사탄인 미국과 싸우며 신의 일을 하고 있습니다. 이들이 우리나라를 안전하게 통과하도록 허용하고 내버려 두어야 합니다."
 SYR_release_extremists: "극단주의자 석방"
 SYR_release_extremists_desc: "우리에게는 감옥, 가택 연금, 그리고 국내를 배회하는 지하디스트가 많습니다. 이웃 나라에서 혼란을 일으키도록 이들을 풀어주어야 합니다."
 SYR_arm_palestinians: "팔레스타인인 무장"
 SYR_arm_palestinians_desc: "하마스는 이스라엘에 대한 무장 투쟁을 벌이고 있는 단체입니다. 이들은 진정한 무자헤딘이라고 주장하며, 그들이 계속 싸울 수 있도록 보장해야 한다고 주장하는 입장입니다."
 SYR_supply_taliban: "탈레반 지원"
 SYR_supply_taliban_desc: "The Taliban managed to establish an Islamic State in Afghanistan, but now the Western powers are trying to topple their legitimate rule. We need to ensure that they do not fall"
 SYR_supply_al_shabaab: "알샤바브 지원"
 SYR_supply_al_shabaab_desc: "알샤바브는 소말리아의 지하드 운동입니다. 이들은 현재 샤리아 법이 지배하는 국가를 세우기 위해 소말리아 정부와 싸우고 있으며, 이를 위해 우리의 도움이 필요합니다."
 SYR_safehaven_for_islamists: "Safe Haven for Islamists"
 SYR_safehaven_for_islamists_desc: "We need to provide a safehaven and an operational base to the global jihadist movement. Holy warriors from all over the globe will flock to our banners"
 SYR_ally_alqaeda: "알 카에다와 동맹"
 SYR_ally_alqaeda_desc: "알카에다는 세계적인 이슬람 극단주의 단체입니다. 우리는 서양의 타락에 대항하기 위해 공식적으로 그들의 행렬에 합류해야 합니다."
 SYR_rebuild_economy: "경제 재건"
 SYR_rebuild_economy_desc: "시리아 경제는 전쟁으로 황폐해졌습니다. GDP는 전쟁 이전의 일부 수준으로 떨어졌습니다. 모든 것을 다시 원활하게 돌아가게 만드는 일은 길고 고된 과정이 될 것입니다."
 SYR_loan_money_iran: "이란 대출금"
 SYR_loan_money_iran_desc: "대규모 재건 사업을 진행하려면 국제 자금을 확보해야 합니다. 자금을 확보하면 경제를 더 빠르고 효율적으로 재건할 수 있지만, 우리의 부채가 늘고 국내에 대한 외국의 영향력이 커질 것입니다."
 SYR_loan_money_saudi: "사우디아라비아 대출금"
 SYR_loan_money_saudi_desc: "대규모 재건 사업을 진행하려면 국제 자금을 확보해야 합니다. 자금을 확보하면 경제를 더 빠르고 효율적으로 재건할 수 있지만, 우리의 부채가 늘고 국내에 대한 외국의 영향력이 커질 것입니다."
 SYR_loan_money_russia: "러시아 대출금"
 SYR_loan_money_russia_desc: "대규모 재건 사업을 진행하려면 국제 자금을 확보해야 합니다. 자금을 확보하면 경제를 더 빠르고 효율적으로 재건할 수 있지만, 우리의 부채가 늘고 국내에 대한 외국의 영향력이 커질 것입니다."
 SYR_loan_money_eu: "유럽 대출금"
 SYR_loan_money_eu_desc: "대규모 재건 사업을 진행하려면 국제 자금을 확보해야 합니다. 자금을 확보하면 경제를 더 빠르고 효율적으로 재건할 수 있지만, 우리의 부채가 늘고 국내에 대한 외국의 영향력이 커질 것입니다."
 SYR_loan_money_china: "중국 대출금"
 SYR_loan_money_china_desc: "대규모 재건 사업을 진행하려면 국제 자금을 확보해야 합니다. 자금을 확보하면 경제를 더 빠르고 효율적으로 재건할 수 있지만, 우리의 부채가 늘고 국내에 대한 외국의 영향력이 커질 것입니다."
 SYR_loan_money_us: "미국 대출금"
 SYR_loan_money_us_desc: "대규모 재건 사업을 진행하려면 국제 자금을 확보해야 합니다. 자금을 확보하면 경제를 더 빠르고 효율적으로 재건할 수 있지만, 우리의 부채가 늘고 국내에 대한 외국의 영향력이 커질 것입니다."
 SYR_renegotiate_loans: "부채 재협상"
 SYR_renegotiate_loans_desc: "경제 상황이 나쁘기 때문에 우리가 모든 부채를 갚는 것은 분명 비현실적입니다. 일부 대출을 재협상해야 합니다. 물론 이는 우리에게 투자한 나라들이 우리에 대한 영향력을 어느 정도 얻게 됨을 의미합니다."
 SYR_cooperate_syrair: "Cooperate With Syrian Airlines"
 SYR_cooperate_syrair_desc: "전쟁 이전 시리아 항공은 시리아 최대의 항공사였습니다. 시리아 난민의 귀환을 장려하기 위해 이들과 협력하여 난민에게 귀향 무료 항공편을 제공해야 합니다."
 SYR_fly_damas: "플라이데임스 문제"
 SYR_fly_damas_desc: "플라이다마스는 시리안 에어의 소규모 자회사입니다. 현재 보잉 737 한 대만 운항하고 있습니다. 운항 규모를 늘릴 수 있도록 보조금을 지급해야 합니다."
 SYR_syrian_pearl: "시리아 진주 문제"
 SYR_syrian_pearl_desc: "시리아 펄은 단명한 민간 소유 국내 항공사였습니다. 시리아인에게 더 많은 항공 서비스를 제공하기 위해 이를 재가동해야 합니다."
 SYR_invigorate_tourism: "관광업 육성"
 SYR_invigorate_tourism_desc: "시리아, 특히 라타키아 해안은 한때 경제에 큰 활력을 주던 대규모 관광 명소였습니다. 그러나 전쟁으로 인해 관광은 사실상 사라졌습니다. 우리는 관광 부문을 다시 한번 호황으로 이끌어야 합니다!"
 SYR_2nd_agrarian_reform: "2번째 농업 개혁"
 SYR_2nd_agrarian_reform_desc: "시리아 내전이 시작된 주요 원인 중 하나는 2011년 여름의 대규모 흉작으로, 이는 농촌 지역에서 도시로의 대규모 이주를 초래했습니다. 1960년대 시리아 정권은 토지를 분배하고 국내 토지 보유 규모를 제한하는 토지 개혁을 단행했습니다. 농업 부문은 이제 전쟁 이후 위기에 처해 있으며 새로운 개혁이 필요합니다."
 SYR_telecom: "시리아 통신사"
 SYR_telecom_desc: "시리아 텔레콤은 시리아의 통신망을 책임지는 국영 기업입니다. 이 기업이 계속 버틸 수 있도록 해야 합니다."
 SYR_increase_nationalisation: "국수주의 증대"
 SYR_increase_nationalisation_desc: "남아 있는 산업이 외국 기업에 의해 다른 곳으로 이전되지 않도록 당분간 국내 핵심 산업을 장악해야 합니다."
 SYR_increase_economic_freedom: "경제 자유 증대"
 SYR_increase_economic_freedom_desc: "GDP를 진정으로 늘리려면 외국 기업에 시장을 개방하고, 시리아에 사업장을 두려는 모든 기업에 보조금을 제공해야 합니다."
 SYR_invest_in_financial: "금융 부문에 투자"
 SYR_invest_in_financial_desc: "시리아는 과거에 강력한 금융 부문을 보유했습니다. 다시 돌아가도록 이 부문에 일부 자금을 재투자해야 합니다."
 SYR_invest_heavy_industry: "중공업에 투자"
 SYR_invest_heavy_industry_desc: "시리아의 경제는 천연자원과 중공업에 기반하고 있습니다. 전쟁은 돈벌이가 될 수 있지만 평화가 찾아온 지금 많은 기업이 몰락하기 직전이며, 이들을 살리려면 보조금이 필요합니다."
 SYR_syrian_railways: "시리아 철도에 투자"
 SYR_syrian_railways_desc: "전쟁으로 많은 철도 노선이 파괴되었고 대부분의 국내 열차 운행이 완전히 중단되었습니다. 철도망 일부를 재건해야 합니다."
 SYR_national_oil_production: "국유 원유 회사 투자"
 SYR_national_oil_production_desc: "석유는 귀중한 자원이지만 우리의 생산량은 너무 적습니다. 석유 생산을 훨씬 더 크게 늘려야 합니다."
 SYR_foreign_oil_fields: "원유 회사 몰색"
 SYR_foreign_oil_fields_desc: "국제 석유 기업과 우리의 자금 후원자들의 도움을 받는다면 유전을 더욱 개발할 수 있을 것입니다."
 SYR_national_phosphate_expansion: "인산염 채굴 확대"
 SYR_national_phosphate_expansion_desc: "인광석은 시리아의 가장 중요한 천연자원 중 하나입니다. 이 자원을 우리 스스로 훨씬 더 큰 규모로 개발해야 합니다."
 SYR_foreign_phosphate_expansion: "외국 회사에 의한 인산염 채굴 확장"
 SYR_foreign_phosphate_expansion_desc: "많은 외국 기업이 시리아에서 인광석을 채굴하는 데 관심이 있습니다. 이들이 이곳에서 사업을 시작하도록 도와야 합니다."
 SYR_free_trade_partner: "자유 무역 우호국 몰색"
 SYR_free_trade_partner_desc: "천연자원은 우리의 강점이며, 가능한 한 많은 돈을 벌기 위해 이를 활용해야 합니다."
 SYR_rebuild_schools: "학교 재건설"
 SYR_rebuild_schools_desc: "국가가 일상으로 돌아가는 첫걸음은 아이들을 다시 학교로 보내는 것입니다. 교육 체계를 재건함으로써 시리아인들의 귀환을 장려할 것입니다."
 SYR_education_reform: "교육 개혁"
 SYR_education_reform_desc: "새로운 시대가 우리 앞에 왔으며 교육 체계도 이에 맞춰 변화해야 합니다. 교육을 크게 개선해야 합니다."
 SYR_new_universities: "새로운 대학교"
 SYR_new_universities_desc: "국민의 교육 수준이 높아짐에 따라 시민이 이용할 수 있는 대학의 수도 늘려야 합니다."
 SYR_rebuild_hospitals: "병원 재건설"
 SYR_rebuild_hospitals_desc: "특히 전쟁으로 인한 참전 용사와 부상자가 많은 지금, 국민에게 의료를 제공하는 것은 중요합니다. 사람들이 마땅히 받아야 할 치료를 받을 수 있도록 보장하면 더 많은 이들이 시리아로 돌아오려 할 것입니다."
 SYR_housing_projects: "주택 건설 계획"
 SYR_housing_projects_desc: "전쟁 중 많은 집이 파괴되었으며 수십 개의 마을과 도시가 폐허가 되었습니다. 사람들이 시리아로 돌아와 살도록 유도하려면 주택을 짓기 시작해야 합니다. 머리 위에 지붕이 생기면 일자리를 얻고, 사업을 시작하며, 다시 삶을 누리기 시작할 수 있습니다."
 SYR_refugee_incentives: "난민 지원금"
 SYR_refugee_incentives_desc: "아직 시리아로 돌아오지 않은 마지막 사람들에게는 금전적 보상을 제공하여 돌아오도록 유도할 수 있습니다. 돌아오는 사람들에게 기꺼이 돈을 지급함으로써 마지막 남은 이들도 돌아오게 할 수 있습니다."
 SYR_economic_improvements: "경제적 향상"
 SYR_economic_improvements_desc: "시리아 경제는 수년간 정체되어 있었습니다. GDP 성장률은 이 지역의 다른 나라들에 비해 미미하며, 이를 바로잡아야 합니다."
 SYR_increase_agricultural_subsidies: "농업 보조금 인상"
 SYR_increase_agricultural_subsidies_desc: "시리아 정부는 국내 식량 생산을 보장하기 위해 수년간 농업에 막대한 보조금을 지급해 왔습니다. 그 결과 거의 모든 경작 가능 토지가 경작되고 있습니다. 그러나 식량 가격은 여전히 세계적 변동의 영향을 크게 받습니다. 시리아 국민이 저렴한 식량을 구할 수 있도록 보조금을 GDP의 6%로 늘려야 합니다."
 SYR_decrease_agricultural_subsidies: "농업 보조금 감소"
 SYR_decrease_agricultural_subsidies_desc: "시리아 정부는 국내 식량 생산을 보장하기 위해 수년간 농업에 막대한 보조금을 지급해 왔습니다. 그 결과 거의 모든 경작 가능 토지가 경작되고 있습니다. 그러나 보조금은 국가 경제에 부담이 되고 있습니다. 일부 농지가 방치되고 식량 가격이 오르더라도 보조금을 GDP의 2%로 줄여야 합니다."
 SYR_chateau_bargylus: "와인 농장 지원\n(Château Bargylus)"
 SYR_chateau_bargylus_desc: "형제인 카림과 산드로 사아데가 시리아에 와이너리를 열 계획입니다. 이들을 재정적으로 지원하여 동지중해 최고의 와인을 만들어야 합니다."
 SYR_export_bakdash: "바크다쉬 아이스크림 수출"
 SYR_export_bakdash_desc: "박다시는 다마스쿠스의 아이스크림 가게입니다. 이 가게는 1885년경 다마스쿠스 구시가지의 알하미디야 수크에 문을 열었습니다. 유향 수지와 살라브로 만든 쫀득한 질감의 두드려 만든 아이스크림인, 피스타치오를 입힌 부자로 유명합니다. 이 별미를 전 세계로 수출해야 합니다."
 SYR_bawabet_dimashq: "바베트 디마슈크 레스토랑"
 SYR_bawabet_dimashq_desc: "샤케르 알삼만은 다마스쿠스에 세계 최대 규모의 식당인 바와벳 디마슈크를 열 계획입니다. 면적은 54000제곱미터이며 6000명을 수용할 수 있습니다. 여러 요리를 제공하는 이 식당은 시리아의 훌륭한 명소가 될 것입니다!"
 SYR_keep_banks_national: "은행 국유화 유지"
 SYR_keep_banks_national_desc: "시리아에서는 어떤 민간 은행도 영업이 허용되지 않으며 그대로 유지되어야 합니다. 국영 은행만 두면 국민의 돈을 안전하게 투자하고 보호할 수 있습니다."
 SYR_legalise_private_banking: "개인 은행 합법화"
 SYR_legalise_private_banking_desc: "시리아는 이미 깊은 불황에 빠져 있으며, 외부 자금을 시리아로부터 차단하여 상황을 악화시키고 싶지는 않습니다. 경제 성장을 높이기 위해 민간 은행업을 합법화해야 합니다."
 SYR_bena_properties: "베나 자산 기업 (Bena Properties)"
 SYR_bena_properties_desc: "마클루프 가문이 소유한 참 홀딩스가 부동산 회사를 설립할 계획입니다. 시리아의 토지 개발을 돕기 위해 이들과 협력해야 합니다."
 SYR_join_wto: "세계무역기구 (WTO) 가입"
 SYR_join_wto_desc: "시리아는 1950년대 세계무역기구가 설립되었을 때 가입을 계획했으나, 기구에 이스라엘이 포함되어 있다는 이유로 결국 신청을 철회했습니다. 이제는 신청할 때가 되었는지도 모릅니다. 우리의 많은 무역 및 경제 법률을 WTO의 요건에 맞게 조정해야 하므로 큰 노력이 필요할 것입니다."
 SYR_syrian_qatari_holding_company: "시리아-카타르 지주 회사"
 SYR_syrian_qatari_holding_company_desc: "카타르 정부와 협력하여 시리아, 카타르, 그리고 전 세계에 투자할 공동 지주회사를 설립해야 합니다."
 SYR_loan_negotiations: "부채 재협상"
 SYR_loan_negotiations_desc: "시리아는 막대한 부채를 안고 있으며, 그 대부분은 냉전 시대부터 이어져 온 것입니다. 우리가 부채 대부분을 갚을 수 없을 것임을 채권자들에게 알리고 새로운 협정을 협상해야 합니다."
 SYR_invest_in_research: "연구에 투자"
 SYR_invest_in_research_desc: "우리는 이제 경제에 많은 돈을 투입했습니다. 그중 일부를 연구 센터와 대학에 쓰도록 돌려야 합니다."
 SYR_hmisho_steel: "흐미쇼 철강에 투자"
 SYR_hmisho_steel_desc: "흐미쇼 무역 그룹이 제철소 운영을 확장할 계획입니다. 이들이 생산을 확대할 수 있도록 보조금을 지급해야 합니다."
 SYR_cooperate_with_saipa: "사이파 (SAIPA)와의 협력"
 SYR_cooperate_with_saipa_desc: "사이파는 라이선스로 시트로엥을 생산하고 자체 차량 라인까지 보유한 이란의 자동차 제조사입니다. 흐미쇼 무역 그룹은 이들과 협력하여 생산의 일부를 시리아로 옮기는 데 관심이 있습니다."
 SYR_expand_oil_refineries: "정유 공장 확장"
 SYR_expand_oil_refineries_desc: "세계적으로는 대규모 석유 생산국이 아니지만, 지역적으로는 상당히 큰 석유 생산국입니다. 이웃 나라들과 대등해지도록 석유 정제 능력을 확대해야 합니다."
 SYR_found_syriatel: "시리아텔 (Syriatel) 설립"
 SYR_found_syriatel_desc: "현재 시리아에는 MTN 시리아라는 이동통신망 사업자 하나뿐입니다. 서비스를 제공할 다른 회사를 하나 더 설립해야 합니다."
 SYR_electronics_school: "시리아 전자 공학 대학교"
 SYR_electronics_school_desc: "세계의 미래는 인터넷과 통신 기술에 있습니다. 기술의 최전선에 서기 위해 이 분야 전문 학교를 설립해야 합니다."
 SYR_syrian_anime: "시리아 애니메이션"
 SYR_syrian_anime_desc: "다마스쿠스에 본사를 둔 비너스 센터는 현재 일본 애니메이션(및 기타 만화)을 아랍어로 더빙하는 유일한 더빙 회사입니다. 이러한 활동을 장려해야 합니다."
 syria_support_anime: "애니메이션 지원"
 syria_support_anime_desc: "이 국가는 애니메이션의 배포를 지원합니다."
 syria_increased_agricultural_subsidies: "증가된 농업 보조금"
 syria_increased_agricultural_subsidies_desc: "국내 식량 생산을 유지하고 무역 작물 재배를 장려하기 위해 농업 보조금을 GDP의 6%로 늘렸습니다. 비용이 많이 들지만 국민이 미래에 대해 더 안심하게 될 것입니다."
 syria_decreased_agricultural_subsidies: "감소된 농업 보조금"
 syria_decreased_agricultural_subsidies_desc: "국가 예산의 부담을 줄이기 위해 농업 보조금을 GDP의 2%로 줄였습니다. 이제 작물 가격은 세계 시장 가격의 영향을 더 많이 받습니다. 정부에는 비용이 적게 들지만, 식량 가격이 오르고 환금 작물을 재배하려는 유인이 줄어들 것입니다."
 divided_syria: "시리아: 분열된 왕가"
 divided_syria_desc: "In addition to the destruction of homes and the horrors of war, many young people are fleeing Syria to avoid the draft. With millions having already fled Syria and hundreds of thousands of battlefield casualties, the available manpower for the Syrian Armed Forces is low."
 divided_syria_1: "시리아: 분열된 왕가"
 divided_syria_1_desc: "고국의 파괴와 전쟁의 공포로 많은 청년들이 시리아를 떠나고 있습니다. 수백만에 달하는 이들이 이미 국내를 빠져나왔고, 전장에서의 사상자는 수백에서 수천에 달합니다. 시리아 군이 사용한 인력은 그저 한 줌의 재에 불과합니다."
 divided_syria_2: "시리아: 분열된 왕가"
 divided_syria_2_desc: "고국의 파괴와 전쟁의 공포로 많은 청년들이 시리아를 떠나고 있습니다. 수백만에 달하는 이들이 이미 국내를 빠져나왔고, 전장에서의 사상자는 수백에서 수천에 달합니다. 시리아 군이 사용한 인력은 그저 한 줌의 재에 불과합니다."
 divided_syria_3: "시리아: 분열된 왕가"
 divided_syria_3_desc: "고국의 파괴와 전쟁의 공포로 많은 청년들이 시리아를 떠나고 있습니다. 수백만에 달하는 이들이 이미 국내를 빠져나왔고, 전장에서의 사상자는 수백에서 수천에 달합니다. 시리아 군이 사용한 인력은 그저 한 줌의 재에 불과합니다."
 syrian_social_nationalists: "시리아 사회 국가주의당(SSNP)의 지원"
 syrian_social_nationalists_desc: "시리아 사회 국가주의당(SSNP)의 지원은 시리아에서 그 세를 확장해 나가며, 시리아, 이라크, 쿠웨이트, 팔레스타인, 이스라엘, 키프러스, 시나이 반도, 터키 남부에서 영향력을 끼치고 있습니다. 이들은 우리가 지금 벌이고 있는 내전에 크나큰 영향력을 미칠 것입니다. 이들의 민병대는 8,000명에 이릅니다."
 syrian_social_nationalists_inc: "정권에 관여한 시리아 사회 국가주의당(SSNP)"
 syrian_social_nationalists_inc_desc: "시리아 사회 국가주의당(SSNP)의 지원은 시리아에서 그 세를 확장해 나가며, 시리아, 이라크, 쿠웨이트, 팔레스타인, 이스라엘, 키프러스, 시나이 반도, 터키 남부에서 영향력을 끼치고 있습니다. 이들의 정치 세력은 아사드와 힘을 합쳤으며, 이들의 민병대는 시리아 아랍 육군과 작전을 함께 하고 있습니다."
 palestine_liberation_groups: "팔레스타인 집단"
 palestine_liberation_groups_desc: "Syrian based Palestinians and their armed groups such as the Palestinian Liberation Army, Galilee Forces and the Jerusalem in Palestine Brigade - all originally trained to fight Israel - are pro-regime and provide key support."
 palestine_liberation_groups_integrated: "팔레스타인 집단"
 palestine_liberation_groups_integrated_desc: "Syrian based Palestinians and their armed groups such as the Palestinian Liberation Army, Galilee Forces and the Jerusalem in Palestine Brigade - all originally trained to fight Israel - are pro-regime and provide key support.\n\nThe Palestinian groups have been officially integrated into the Syrian Arab Army"
 syrian_shiite: "시아파 집단"
 syrian_shiite_desc: "시리아의 일반대중들과 외국의 시아파 집단들은 전 집권층의 시리아 군에서 대다수를 차지하고 있었습니다. 몇몇은 이란에 충성을 맹세하고 그곳에 의해 지휘를 받고 훈련을 받았지만, 그 외의 다른 이들은 독립된 세력입니다."
 syrian_shiite_integrated: "시아파 집단"
 syrian_shiite_integrated_desc: "시리아의 일반대중들과 외국의 시아파 집단들은 전 집권층의 시리아 군에서 대다수를 차지하고 있었습니다. 몇몇은 이란에 충성을 맹세하고 그곳에 의해 지휘를 받고 훈련을 받았지만, 그 외의 다른 이들은 독립된 세력입니다.\n\n이 민병대는 공식적으로 시리아 아랍 육군에 흡수되었습니다."
 alawite_high_command: "알와이트의 군 장악"
 alawite_high_command_desc: "The key units of the Syrian Arab Army are under tight control of officers from the Alawite branch of Shia Islam, the same religious denomination that the Al Assad family is part of. This ensures the loyalty of these units, but makes it considerably harder to find excelling individuals. These officers will be an obstacle if the Muslim Brotherhood comes to power as they perceive them as a threat to their Alawite sect and we'll have to uproot them first, and if strengthened they'll do whatever it takes to keep the Assads in power"
 alawite_high_command_strengthened: "알와이트의 군 장악"
 alawite_high_command_strengthened_desc: "The key units of the Syrian Arab Army are under tight control of officers from the Alawite branch of Shia Islam, the same religious denomination that the Al Assad family is part of. This ensures the loyalty of these units, but makes it considerably harder to find excelling individuals. Now these officers will absolutely ensure that the al-Assads stay in power"
 baath_party_banned: "바아스(Ba'ath)당 금지"
 baath_party_banned_desc: "옛 아사드 집권 당시에 존재하던 바아스당은 공식적인 행동과 선전이 금지되었습니다."
 ssnp_party_banned: "시리아 사회 국가주의당(SSNP) 금지"
 ssnp_party_banned_desc: "The Syrian Social Nationalist Party has been banned from publicly operating and campaigning"
 salafist_party_banned: "원리주의 정당 금지"
 salafist_party_banned_desc: "원리주의 정당은 공식적인 행동과 선전이 금지되었습니다."
 true_caliphate: "시리아 칼리프"
 true_caliphate_desc: "We have proclaimed Islamic Syria as the birthplace of the new Muslim Caliphate"
 global_salafist_recruitment: "세계 모병"
 global_salafist_recruitment_desc: "날마다 전 세계에서 새로운 군인들이 자국에 당도하고 있습니다."
 husband_minister: "남편을 장관으로"
 husband_minister_desc: "부슈라의 남편 아세프 샤우카트는 현직 군사정보국장입니다."
 syrian_health_care_reform: "의료 개혁"
 syrian_health_care_reform_desc: "§W보건 지출: §!§G-15%§!시리아 의료 체계를 더 효율적으로 개혁했습니다."
 loyal_marriage: "왕실 결혼"
 loyal_marriage_desc: "아스마 알아사드는 뛰어난 경제학자이며 시리아 전역의 투자에 도움을 줄 것입니다."
 arab_news_network: "아랍 뉴스 네트워크"
 arab_news_network_desc: "수메르 알아사드가 소유한 뉴스 매체 아랍 뉴스 네트워크가 시리아 전역에 방송되고 있습니다."
 infiltrate_hezbollah_idea: "헤즈볼라 잠입"
 infiltrate_hezbollah_idea_desc: "자국의 첩보원이 헤즈볼라에 잠입했습니다."
 occupation_of_lebanon_dynamic_modifier: "레바논에 대한 점령"
 TT_occupation_of_lebanon_dynamic_modifier: "1976년 레바논 내전이 시작된 직후부터 시리아는 레바논에 약 3만 명의 병력을 주둔시켜 왔습니다. 내전이 끝난 후 1991년 레바논과 시리아 사이에 우호 및 안보 조약이 체결되어 시리아가 레바논 방어를 책임지게 되었습니다.\n\n점령을 지속하는 데는 많은 비용이 들지만, 결국 레바논을 우리에게 훨씬 더 가깝게 만들 수 있습니다. 레바논과의 우호 조약에도 불구하고, 레바논이 1982년 이후 위임을 재서명하지 않았기 때문에 국제 사회는 이 병력 주둔을 불법 점령으로 간주합니다.\n\n추가 지출: $§R0.250§!"
 syria_jewish_rights_guaranteed: "유대인 권리 보장"
 syria_jewish_rights_guaranteed_desc: "구 이스라엘 지역에서 유대인의 특별한 권리를 보장했습니다."
 syrian_peoples_army: "시리아 인민군"
 syrian_peoples_army_desc: "시리아 아랍군은 지역 방어를 담당하고 지역 민족으로 구성된 지역 조직으로 나뉘었습니다."
 syrian_electronic_army: "시리아 사이버군"
 syrian_electronic_army_desc: "시리아 전자군은 시리아 정부의 지원을 받는 컴퓨터 해커 집단입니다. 이들의 목표는 인터넷을 통해 시리아의 적을 공격하는 것입니다."
 syria_tourism_invigorated: "관광업 육성"
 syria_tourism_invigorated_desc: "[ROOT.GetName]의 관광 부문이 활기를 되찾았습니다."
 SYR_the_military: "시리아군 (SAA)"
 SYR_intelligence_community: "군사 정보국"
 SYR_labour_unions: "노동조합총연맹"
 SYR_oligarchs: "마클루 가문"
 SYR_oligarchs_desc: "마크루프 가문은 시리아에서 가장 부유한 가문이며, 알아사드 가문 다음으로 강력한 영향력을 지니고 있습니다. 구성원 중 가장 부유한 인물은 바샤르 알아사드의 사촌이자 시리아 최대 이동통신사 시리아텔의 소유주인 라미 마크루프입니다. 라미 한 사람이 자신의 사업망을 통해 시리아 경제의 약 60%를 장악하고 있으며, 외국 기업은 그의 동의 없이는 시리아에서 사업을 할 수 없습니다."
 Syria_decisions: "시리아 내전"
 Syria_decisions_desc: "시리아 내전은 아사드 집권에 대항하는 아랍의 봄이 일어날 때 쯔음 시작되었습니다. 전쟁은 네 세력들간에서 일어났습니다. 아사드의 집권을 지원하는 러시아, 이란과 이를 저지하려는 이슬람 주의자 타흐리르 알 샴과 이슬람 국가인 이라크, 시리아들입니다."
 hire_PMC: "민간 군사기업 고용"
 hire_PMC_desc: "민간 군사기업을 고용함으로써 부족한 군의 여백을 메울 수 있습니다. 당연하게도 이 충성스러운 군인들은 사용하는 돈에 따라 그 숫자가 결정되며, 제한된 숫자만이 이용 가능합니다."
 renounce_claims_on_golan: "골란 고원 영유권 포기"
 renounce_claims_on_golan_desc: "이스라엘은 6년 전쟁 이후인 1967년 골란 고원을 장악했고, 현재에 이르러서는 이 지역 인구의 절반이 유대인인 실정입니다. UN군과 시리아군은 여전히 이곳을 시리아 영토라고 상정하고 있습니다. 이 지역에 대한 영유권을 주장하여야 합니다. 어쩌면, 이스라엘이 자국에 우호적인 태도를 취할 수도 있을 지도 모릅니다?\"\n\n만약 저들이 이 주장에 승낙을 한다면, 우리는 무기나 자원병을 제공하겠지만, 저들에게 영향력을 행사할 수 있을 것입니다."
 renounce_claims_on_hatay: "하타이 영유권 포기"
 renounce_claims_on_hatay_desc: "The Hatay region was transferred from France to Turkey in 1939 after a referendum in the region. Many have criticised the legitimacy of the referendum, and Syria still claims that the area belongs to them. Maybe we should renounce our claims to the region if the Turks promise to help us in our war?\n\nIf they agree to the deal, we will receive weapons or volunteers, but we'll be influenced by them."
 guarantee_rojava_independence: "쿠르즈족 자치권 보장"
 guarantee_rojava_independence_desc: "전쟁에서 이기기 위해, 강력한 동맹을 체결할 필요가 있습니다. 로자바의 세력은 ISIS와 싸우기 위해 사력을 다하고 있습니다. 종전 후, 저들의 자치권을 허락해 준다면, 기꺼이 우리 편으로 그 방향을 돌릴 것입니다.\n\n만약 저들이 승리를 한다면, 저들의 영토에 대한 모든 영유권을 포기하고 휴전협상을 할 것입니다.\n\n만약 문제만 해결된다면, 이들은 기꺼이 이 제안에 승낙할 것입니다."
 Syria_foreign_policy: "시리아 외교 정책"
 Syria_foreign_policy_desc: "내전으로 인해, 많은 우방국들과의 관계가 단절되었고 오히려 적들이 만들어졌습니다. 시리아를 재건하고 있는 지금, 외교관계 또한 재수립을 할 필요가 있습니다."
 infiltrate_hezbollah: "헤즈볼라 잠입"
 infiltrate_hezbollah_desc: "자국 요원들을 헤즈볼라로 잠입시키는 것은 우리의 공세 시에 저들을 약화시킬 수 있는 원동력이 될 것입니다. 하지만 잠입 후에 더 많이 지체할 수록, 더욱 더 많은 요원들이 노출될 것입니다."
 sow_discord_between_HEZ_and_PER: "헤즈볼라와 이란 간의 불화 파종"
 sow_discord_between_HEZ_and_PER_desc: "헤즈볼라와 이란은 가까운 동맹관계이며, 이로 인해 헤즈볼라에 대한 공작을 진행하기에는 많은 어려움이 있습니다. 하지만, 이 두 세력 간에 불화를 심을 수 있는 선전을 진행함으로써 이 동맹 관계를 깨부술 수 있을 것입니다. 성공할 가능성은 낫지만, 안하는 것보다는 나을 것입니다."
 SYR_support_baathism: "[From.GetAdjective] 바아스주의 지원"
 SYR_support_baathism_desc: "현대 바아스주의는 좌파 아랍 사회주의입니다. 이 세력은 권위주의와 국가의 장악, 급진적인 경제 계획을 지지하고 있습니다. 예전과는 다르게 현대의 바아스주의는 더이상 전 아라비아주의를 지지하지 않습니다. 현재는 두 개의 바아스주의가 이라크, 시리아에 존재하고 있고, 이 둘 모두 자신들만의 바아스주의로 발전시킨 상태입니다.\n\n지역적인 차이에도 불구하고 [From.GetNameDef]에서의 바아스주의를 지원할 수 있을지도 모릅니다. 우리를 최우방국으로 생각하게끔 바꿀 수는 없겠지만, 적어도 우호적이게는 만들 수 있을 것입니다."
 SYR_support_western_ideals: "[From.GetNameDef]의 서방 이념 지원"
 SYR_support_western_ideals_desc: "The West represents the home of democracy and freedom. The West has proven that countries of different cultures and traditions can coexist peacefully. We should encourage these same ideals in [From.GetNameDef] so we'll be able to live in a more peaceful region."
 SYR_support_salafism: "[From.GetNameDef]의 살라피스트 단체에 대한 후원자"
 SYR_support_salafism_desc: "살라피스트는 수니파의 원리주의자 형태를 띄고 있는 집단입니다. 이들의 목표는 이슬람의 지난 영광스러운 때를 되살리는 것과 쿠란을 절대적인 믿음으로 따르는 것입니다. 몇몇 정보들에 의해면 살라피스트는 이슬람 세력 중에서는 가장 빠르게 성장하고 있는 세력입니다. 살파피스트 단체에 자금을 조성하는 것은 지금과 같이 무슬림이 공격을 받고 있을 대 아무런 문제도 일으키지 않을 것입니다."
 SYR_support_muslim_brotherhood: "무슬림 형제자매인 [From.GetAdjective] 지원"
 SYR_support_muslim_brotherhood_desc: "무슬림 형재자매들은 이집트에서 비롯되어 퍼져나갔습니다. 이들은 반서방 태도를 띈다고 알려진 이슬람 법(Sharia law)을 따르고 있습니다. 민주주의, 자유와 관련된 모든 것을 지지하는 한편에도, 러시아, 사우디 아라비아와 같은 몇 나라들은 이들을 테러리스트로 간주하고 있습니다."
 SYR_support_ssnp: "[From.GetNameDef]의 시리아 사회 국가주의당(SSNP) 지원"
 SYR_support_ssnp_desc: "시리아 사회 국가주의당(SSNP)은 레바논에서 집권을 하고 있는 정치집단으로써 대 시리아의 실현을 지지하고 있습니다. 시라아에서 바아스당 다음으로 2번째로 큰 당으로써, 이 주장은 레바논의 팔레스타인인들에게 인기를 얻고 있습니다. 이를 이용하여 평화적으로 자국의 영토를 늘릴 수 있을 것입니다."
 Syria_external_countries: "시리아에서의 정책"
 Syria_external_countries_desc: "시리아에서의 사태는 우리의 관심을 곤두세우고 있습니다."
 intervene_against_hezbollah: "헤즈볼라 축출"
 intervene_against_hezbollah_desc: "Hezbollah has gained more ground next to our borders. They are becoming a bigger and bigger threat and we need to deal with them."
 Syria_hafez_succession: "하페즈 알아사드 계승권"
 Syria_hafez_succession_desc: "Hafez al-Assad has been suffering from poor health for years now, and his succession is currently open. His first choice as his successor was his eldest son, Bassel, but he died in a car crash in 1994. Since then, Hafez's main choice has been his second oldest son §GBashar§!. However, Hafez's eldest child, his daughter §gBushra§!, has also been taking an increasing role in state affairs since the death of Bassel. While more experienced than §GBashar§!, many see her gender as the biggest obstacle for her. The youngest of the children, §HMaher§!, is a valid choice as well. He has a long experience with the military, but his reputation as a very hot-tempered person might not make him the most stable leader for Syria.\n\nAssuring that Hafez's successor has the most support among the Ba'ath party is vital for the future stability of Syria. Added popularities of the candidates increases the likelihood of civil war should our country become democratic during the Damascus Spring. \n\nSupport of §gBushra§!: [?bushra_popularity] \nSupport of §GBashar§!: [?bashar_popularity] \nSupport of §HMaher§!: [?maher_popularity]"
 SYR_bushra_present_to_inner_circle: "§g부쉬라§!를 내부에 소개하기"
 SYR_bushra_present_to_inner_circle_desc: "후계 후보가 바트당 핵심 인사들과 관계를 쌓도록 허용하면 그의 지지가 높아집니다. 모든 정권에는 누가 권력을 잡을지를 실제로 결정하는 열쇠가 있습니다."
 SYR_bashar_present_to_inner_circle: "§G바샤르§!를 내부에 소개하기"
 SYR_bashar_present_to_inner_circle_desc: "후계 후보가 바트당 핵심 인사들과 관계를 쌓도록 허용하면 그의 지지가 높아집니다. 모든 정권에는 누가 권력을 잡을지를 실제로 결정하는 열쇠가 있습니다."
 SYR_maher_present_to_inner_circle: "§H마헤르§!를 내부에 소개하기"
 SYR_maher_present_to_inner_circle_desc: "후계 후보가 바트당 핵심 인사들과 관계를 쌓도록 허용하면 그의 지지가 높아집니다. 모든 정권에는 누가 권력을 잡을지를 실제로 결정하는 열쇠가 있습니다."
 SYR_bushra_gather_public_support: "§g부쉬라§!에 대한 대중의 지지 모으기"
 SYR_bushra_gather_public_support_desc: "내부에서 지지를 얻는 것도 중요하지만, 국민들이 후보자를 지지하도록 만드는 것도 중요합니다. 대중에게 노출됨으로써 후보자의 지지도가 약간 증가될 것이며 그들의 관점에도 약간의 영향을 미칠 것입니다."
 SYR_bashar_gather_public_support: "§G바샤르§!에 대한 대중의 지지 모으기"
 SYR_bashar_gather_public_support_desc: "내부에서 지지를 얻는 것도 중요하지만, 국민들이 후보자를 지지하도록 만드는 것도 중요합니다. 대중에게 노출됨으로써 후보자의 지지도가 약간 증가될 것이며 그들의 관점에도 약간의 영향을 미칠 것입니다."
 SYR_maher_gather_public_support: "§H마헤르§!에 대한 대중의 지지 모으기"
 SYR_maher_gather_public_support_desc: "내부에서 지지를 얻는 것도 중요하지만, 국민들이 후보자를 지지하도록 만드는 것도 중요합니다. 대중에게 노출됨으로써 후보자의 지지도가 약간 증가될 것이며 그들의 관점에도 약간의 영향을 미칠 것입니다."
 SYR_bushra_familiarise_in_government: "§g부쉬라§!가 더욱 정부에 익숙하도록 만들기"
 SYR_bushra_familiarise_in_government_desc: "Making sure that the candidate understands how our government works is imperative to their succession. By having an experienced candidate, the inner factions are more likely to support a candidate. The experience will also help the candidate stabilise the country once the succession happens."
 SYR_bashar_familiarise_in_government: "§G바샤르§!가 더욱 정부에 익숙하도록 만들기"
 SYR_bashar_familiarise_in_government_desc: "후보자들이 어떻게 우리 정부가 운영되고 있는지 이해하는 것은 그들의 승계 과정에 있어 반드시 거쳐야하는 단계입니다. 경험이 풍부한 후보자가 될수록, 내부 파벌들이 후보자들을 더욱 지지할 것입니다. 뿐만 아니라 이런 경험은 후보자들이 승계되어 지도자가 된 후 국가를 안정시키는데 큰 도움을 줄 것입니다."
 SYR_maher_familiarise_in_government: "§H마헤르§!가 더욱 정부에 익숙하도록 만들기"
 SYR_maher_familiarise_in_government_desc: "후보자들이 어떻게 우리 정부가 운영되고 있는지 이해하는 것은 그들의 승계 과정에 있어 반드시 거쳐야하는 단계입니다. 경험이 풍부한 후보자가 될수록, 내부 파벌들이 후보자들을 더욱 지지할 것입니다. 뿐만 아니라 이런 경험은 후보자들이 승계되어 지도자가 된 후 국가를 안정시키는데 큰 도움을 줄 것입니다."
 Syria_greater_syria_decisions: "대시리아의 출범"
 Syria_greater_syria_decisions_desc: "대시리아에는 수많은 국가가 포함되며, 그중 상당수는 우리보다 강력합니다. 지역 전체를 우리의 통제 아래 두는 것은 커다란 도전이 될 것입니다."
 demand_submission_from_palestine: "팔레스타인에 대한 복종 요구"
 demand_submission_from_palestine_desc: "우리는 이스라엘을 무너뜨렸습니다. 팔레스타인인들은 자신들의 자유가 우리 덕분임을 알아야 하며, 우리의 통치에 복종함으로써 이를 보여야 합니다."
 integrate_palestine: "팔레스타인 통합"
 integrate_palestine_desc: "팔레스타인은 대시리아의 불가분한 일부이며, 이 지역은 우리와 더욱 가까워져야 합니다."
 new_jewish_diaspora: "새로운 유대인 디아스포라"
 new_jewish_diaspora_desc: "이스라엘을 정복한 뒤 유대인들의 대규모 이주가 일어났습니다. 무슬림이 지배하는 국가의 박해를 두려워하여, 많은 이들이 고향을 떠나 다른 곳에서 새 삶을 시작하려 하고 있습니다.\n\n이스라엘 내 유대인에게 특별한 권리를 보장함으로써 이러한 디아스포라의 영향을 줄일 수 있습니다."
 guarantee_jewish_rights: "유대인 권리 보장"
 guarantee_jewish_rights_desc: "이스라엘이 우리의 통제 아래 놓인 지금, 많은 유대인이 이스라엘을 떠나고 싶어 합니다. 토지 소유권, 제한적 자치, 세금 면제와 관련한 특별한 권리를 보장하여 이들이 남도록 유도할 수 있습니다."
 syria_ally_with_houthis: "후티와의 동맹"
 syria_ally_with_houthis_desc: "The Houthis have a long standing dispute with the Saudis, as the Saudis have heavily interfered in the Yemeni Civil War. In return for helping us, we will promise them Southern Hejaz, as it has a large Shia minority. However, allying with the Houthis means that we will have to fight their enemies as well"
 syria_shia_uprising_in_qatif: "사우디아라비아 동부에서 발생한 시아파 봉기 지원"
 syria_shia_uprising_in_qatif_desc: "사우디아라비아 동부 주에는 대규모 시아파 소수 집단이 살고 있습니다. 이 주는 사우디아라비아의 주요 석유 생산 지역이기도 합니다. 시아파 소수 집단은 심한 억압을 받고 있으며, 이들이 무기를 들게 만드는 것은 어렵지 않을 것입니다."
 syria_operation_eastern_whirlwind: "'동쪽의 소용돌이' 작전"
 syria_operation_eastern_whirlwind_desc: "이란을 해체할 때가 왔습니다. 이제 우리는 지역의 궁극적인 패권국이 될 준비가 되었습니다!"
 syria_iran_recruit_arab_militias: "아랍 민병대 모집"
 syria_iran_recruit_arab_militias_desc: "쿠제스탄 지역에는 많은 아랍인이 살고 있습니다. 이들은 페르시아인 치하에서 고통받아서는 안 되며, 우리의 통치 아래에서 훨씬 안전할 것입니다. 이미 독립을 위해 싸우는 민병 집단이 여럿 있습니다. 수는 많지 않지만 이란의 후방에서 게릴라 작전을 수행할 수 있을 것입니다."
 syria_iran_recruit_lur_militias: "루르 족 민병대 모집"
 syria_iran_recruit_lur_militias_desc: "루르인은 주로 루리스탄 지역에 거주하는 페르시아계 민족 집단입니다. 이들은 페르시아인과 공통점이 많으므로, 우리의 대의를 위해 끌어들이려면 평소보다 더 많은 노력이 필요할 것입니다. 그러나 충분한 자금과 힘이 있다면 불가능한 일은 없습니다."
 syria_iran_recruit_azeri_militias: "아제르바이잔 민병대 모집"
 syria_iran_recruit_azeri_militias_desc: "아제르바이잔인은 이란 인구의 10%를 차지합니다. 이들은 이란 내에서 우리의 가장 강력한 잠재적 동맹이며, 이들을 무장시키는 데에는 많은 비용이 들겠지만 우리의 성공 가능성을 크게 높여 줄 것입니다."
 syria_iran_recruit_tabaristani_militias: "타바리스탄 민병대 모집"
 syria_iran_recruit_tabaristani_militias_desc: "타바리스탄 지역은 마잔다란인과 길라키인의 터전입니다."
 syria_iran_recruit_balochi_militias: "발루치 족 민병대 모집"
 syria_iran_recruit_balochi_militias_desc: "발루치인은 주로 이란과 파키스탄에 거주하는 민족 집단입니다. 이들은 부족 성향이 매우 강하여 통합된 전선을 구축하기가 어려울 것입니다."
 SyriaFocus.0.t: "로자바 문제"
 SyriaFocus.0.desc: "로자바는 쿠르드족 자치정부가 있는 시리아 북부 지역입니다. 내전이 이루어지는 동안, 이들은 주로 무신론자와 급진 민병대와 함께 ISIS와 맞써 싸웠습니다. 이들의 목표는 연방 시리아 공화국을 세우는 것으로, 많은 이들 또한 이 지역을 서부 쿠르드족 영토로 간주하고 있습니다. 저들은 우리에게 전쟁에 적극적으로 참여하겠다고 서한을 보내왔습니다. 우리는 언제나 저들에게 제한적인 자치권을 부여했지만, 이를 통해 저들을 완전히 통제할 수 없음이 드러났습니다. 이들을 내버려둔다면 쿠르드 민족주의가 온 국가에 퍼지는 사태를 나을 것입니다."
 SyriaFocus.0.a: "이 지역은 시리아 영토다"
 SyriaFocus.0.b: "자치권을 부여해줘라"
 SyriaFocus.0.c: "독립을 시켜버려라"
 SyriaFocus.1.t: "시리아의 종속화 요구"
 SyriaFocus.1.desc: "The government in Damascus has demanded that we submit to their rule and disband our military."
 SyriaFocus.1.a: "절대 안된다"
 SyriaFocus.1.b: "더 이상 피를 흩뿌릴 수는 없다"
 SyriaFocus.2.t: "로자바의 거절"
 SyriaFocus.2.desc: "로자바가 우리의 제안을 거부하였습니다."
 SyriaFocus.2.a: "망할 놈들!"
 SyriaFocus.2.b: "그냥 놔둬라"
 SyriaFocus.3.t: "로자바의 승낙"
 SyriaFocus.3.desc: "Rojava has agreed to our offer"
 SyriaFocus.3.a: "하나된 시리아를 위해!"
 SyriaFocus.4.t: "자치권 승인"
 SyriaFocus.4.desc: "The government in Damascus is offering us an autonomous status in Syria. This is what we fought for in the civil war. On the other hand, we are in a position of power, maybe we should set more ambitious goals?"
 SyriaFocus.4.a: "이게 우리가 원하는 것이다..."
 SyriaFocus.4.b: "...더 나아가자"
 SyriaFocus.5.t: "로자바가 자치권 제안을 수락하다."
 SyriaFocus.5.desc: "로자바는 시리아 내부에서의 자치권 부여를 승낙하였습니다. 앞으로도 이 조약을 명심할 필요가 있습니다."
 SyriaFocus.5.a: "하나된 시리아를 위해!"
 SyriaFocus.6.t: "시리아 사회 국가주의당(SSNP) 문제"
 SyriaFocus.6.desc: "During the Syrian Civil War, the Syrian Social Nationalist Party (SSNP for short) first switched sides against the regime, but eventually realigned themselves with Assad. Their militias were a key factor in Assad's victory, and they have been gaining popularity as a political party as well. Keeping them around will ensure their militias are at Assad's service, but this will increase their influence. Purging them might lead to resistance from them later on. \nHow should we advise Assad?"
 SyriaFocus.6.a: "우리는 시리아 사회 국가주의당(SSNP)의 민병대를 필요로 합니다."
 SyriaFocus.6.b: "저들을 축출하는 것이 더 좋습니다."
 SyriaFocus.7.t: "[From.GetName]의 시리아 사회 국가주의당(SSNP)에 대한 의견"
 SyriaFocus.7.Keep.desc: "시리아 사회 국가주의당(SSNP)의 강력한 민병대로 인해서 [From.GetName]가 현 상태를 유지하고 싶다는 소식을 전해들었습니다."
 SyriaFocus.7.Purge.desc: "시리아 사회 국가주의당(SSNP)은 현 집권층에 중대한 위협이기에 [From.GetName]가 이들을 지거하고 싶다는 소식을 전해들었습니다."
 SyriaFocus.7.a: "확인된 사항이다."
 SyriaFocus.9.t: "군대 시찰"
 SyriaFocus.9.d: "[Root.GetLeader]은(는) 군인들의 대형 앞에서 자세를 잡고 경례를 했습니다. 누르스름한 아침의 태양이 시리아 군인들에게 내려쬐고 있었습니다. [Root.GetLeader]은(는) 손을 내리고 군인들에게 걸어 갔습니다. 첫 줄의 군인들에게 일일히 악수를 하기 시작했습니다. 한명씩 한명씩 군인들에게 감사인사를 전했으며, 구경꾼들은 자랑에 가득찬 군인들의 표정을 볼 수 있었습니다. 한 군인이 [Root.GetLeader]와 눈이 마주쳤습니다. 군인들과 악수를 하는 와중에, 군인이 뭐라 말을 하는 것 같았습니다. [Root.GetLeader]의 얼굴에 공포가 나타났습니다. 잠시간의 정적 후에 군인의 군복 뒤에서 폭발이 일어났습니다.\n\n시리아 사회 국가주의당(SSNP)의 상징이 세겨진 옷을 입은 수십 명이 모습을 드러내어 관중들과 군인들에게 무차별 사격을 가하기 시작했습니다. 시리아 방위군은 상황을 통제하고 이들을 무력화시켰습니다.\n\n[Root.GetLeader]의 훼손된 시신은 폭발된 장소에서 몇십 cm 근처에서 찾을 수 있었습니다. 몇분 뒤, 시리아 사회 국가주의당(SSNP)은 방송에서 '[Root.GetLeader]의 집권은 이제 끝났다! 시리아는 놈의 애완견 노릇을 그만두게 되었다!'라고 성명을 발표했습니다."
 SyriaFocus.9.a: "잘자렴, 왕자님"
 SyriaFocus.10.t: "반란"
 SyriaFocus.10.d: "밤이 깊어지면서, 몇몇 폭발들이 다마스쿠스 근처에서 들렸습니다. 그리고 얼마 안있어서, 온 시리아 국토에서 산발적인 전투가 벌어졌고, 시리아 사회 국가주의당(SSNP) 표식을 한 군인들이 보급품을 쌓아둔 군사요충지와 전략거점을 습격하였습니다. 그리고 모든 방송에서는 '시리아 사회 국가주의당(SSNP)이 바로 시리아의 진정한 지도자이며, [Root.GetLeader]와 그 추종자들의 시대는 저물었다. 바로 지금이다. 잿더미에서 일어설 새로운 시리아를 위해 싸울 때이다.'라고 성명이 발표되었습니다."
 SyriaFocus.10.a: "이 망할 놈들은 다른 반란군처럼 똑같은 운명을 맞이할 것이다!"
 SyriaFocus.11.t: "실패"
 SyriaFocus.11.d: "다마스쿠스 사방에서 폭발음이 들렸습니다. 시리아 사회 국가주의당(SSNP) 표식을 한 군인들이 온 사방으로 도망치는 모습이 포착되었습니다. [Root.GetLeader]에 대항한 시리아 사회 국가주의당(SSNP)의 시도는 실패한 것으로 보입니다. 이에 대한 열성적인 지지로 이들 세력은 그리 오래가지 않을 것입니다."
 SyriaFocus.11.a: "또다른 기회는 없을거다."
 SyriaFocus.12.t: "시리아에서의 팔레스타인 민병대 문제"
 SyriaFocus.12.desc: "Syria is a home to many Palestinians who have left their homeland. During the Syrian civil war, many of these Palestinians joined pro-Assad militias, since many Palestinians see Syria as one of the biggest supporters for a free Palestine. Keeping these groups around will keep the Syrian army at a bigger strength, but relying on militias will lower the army's effectiveness.\n\nHow should we advise Assad?"
 SyriaFocus.12.a: "팔레스타인 민병대를 필요로 합니다"
 SyriaFocus.12.b: "제거하는게 더 낫습니다"
 SyriaFocus.13.t: "팔레스타인 민병대에 대한 [From.GetName]의 의견"
 SyriaFocus.13.Keep.desc: "We have been informed that [From.GetName] wants us to keep the Palestinian militias around"
 SyriaFocus.13.Purge.desc: "자신의 집권에 계속되는 위협이기에 [From.GetName]가 팔레스타인 민병대를 제거하고 싶다는 소식을 전해들었습니다."
 SyriaFocus.13.a: "확인된 사항이다."
 SyriaFocus.14.t: "시리아에서의 시아파 민병대 문제"
 SyriaFocus.14.desc: "Despite being a religious minority, large parts of the pro-Assad forces were composed of Shiite militias. Many of these groups were funded and supported by Iran, others were formed on their own. Keeping them around will bolster Syrian forces, but will make them more dependent on Iran. \n\nHow should we advise Assad?"
 SyriaFocus.14.a: "시아파 민병대를 필요로 합니다"
 SyriaFocus.14.b: "제거하는게 더 낫습니다"
 SyriaFocus.15.t: "시아파 민병대에 대한 [From.GetName]의 의견"
 SyriaFocus.15.Keep.desc: "시아파 민병대를 현상유지 하고 싶다는 [From.GetName]의 의견을 전해들었습니다."
 SyriaFocus.15.Purge.desc: "자신의 집권에 계속되는 위협이기에 [From.GetName]가 시아파 민병대를 제거하고 싶다는 소식을 전해들었습니다."
 SyriaFocus.15.a: "확인된 사항이다."
 SyriaFocus.16.t: "시리아의 미래"
 SyriaFocus.16.d: "The Syrian Civil War is over, and a new Syria is being born. Due to the existence of our forces in Syria, and our great help in the war, the Syrian government has approached us for more cooperation. They know that they will need help rebuilding their country, and they need a strong country to protect them."
 SyriaFocus.16.a: "독립보장 요구를 승낙하지"
 SyriaFocus.16.b: "날파리가 짖는군"
 SyriaFocus.17.t: "[From.GetName]의 승낙"
 SyriaFocus.17.d: "[From.GetName]은(는) 우리의 요구를 승낙했습니다. 함께라면 더 나은 시리아를 만들 수 있습니다."
 SyriaFocus.17.a: "좋아"
 SyriaFocus.18.t: "[From.GetName]의 거절"
 SyriaFocus.18.d: "[From.GetName]은(는) 우리의 요구를 거절했습니다. 우리 스스로 해내어야할 듯 보입니다."
 SyriaFocus.18.a: "망할"
 SyriaFocus.19.t: "시리아 아랍 육군 잔당"
 SyriaFocus.19.d: "We need to decide what to do with the remnants of the Syrian Arab Army. The soldiers are our prisoners, and their equipment lay in our depots. Some of them have already expressed wishes to join a new Syrian army. However, some of them will harbor loyalties to the old Assad regime, and our supporters will definitely be unhappy about cooperating with our old enemies. On the other hand, these men are experienced combat veterans of the war, and their expertise might come in handy."
 SyriaFocus.19.a: "편입시켜라"
 SyriaFocus.19.b: "집으로 돌려보내라"
 SyriaFocus.20.t: "시리아 아랍 육군 장군"
 SyriaFocus.20.d: "시리아 아랍 육군 장군들은 우리 군의 요직을 차지했습니다. 이들은 지난 수년 동안 아사드의 명령을 따르며, 우리 군과 대적했습니다. 하지만 정세가 이들의 도움을 필요한 상황입니다. 향후 이들의 경험을 필요로 할지도 모릅니다. 정권 내의 많은 급진주의자들은 시리아 아랍 육군 잔당을 처형시키라며 화를 내고 있는 상황입니다."
 SyriaFocus.20.a: "이들이 필요하다"
 SyriaFocus.20.b: "감옥으로 보내라"
 SyriaFocus.20.c: "사형 집행인이 일할 시간이군!"
 SyriaFocus.21.t: "바트당의 지위"
 SyriaFocus.21.d: "시리아의 바트당은 바샤르 알아사드 뒤에 있던 이인자였습니다. 많은 정치인들이 불려왔고 연계된 이들 또한 함데 모아 바트당 자체를 금지시켜버렸습니다. 하지만 여전히 바트당 지지자들은 국내에 많이 있으며, 이들을 정치권에서 배제함으로써 이들의 반감을 살 수도 있을 것입니다."
 SyriaFocus.21.a: "당을 금지하라."
 SyriaFocus.21.b: "존속하는 것만 유지시켜라"
 SyriaFocus.22.t: "시리아 사회 국가주의당(SSNP) 문제"
 SyriaFocus.22.d: "시리아 사회민족당은 시리아 정치에서 성장하고 있는 당입니다. 당 지지자들은 레바논 대부분을 지배하는 대시리아의 탄생을 염원하고 있습니다. 내전 초기에 아사드와의 싸움에서 우리 편을 들었지만, 결국에는 바트당과 길을 함께하였습니다. 이들을 용서하고 존속만이라도 허락해야 할까요?"
 SyriaFocus.22.a: "당을 금지하라."
 SyriaFocus.22.b: "존속하는 것만 유지시켜라"
 SyriaFocus.23.t: "급진당 문제"
 SyriaFocus.23.d: "많은 급진당이 시리아 국내에 존재하고 있고, 몇몇과는 내전 중에 전투를 벌였습니다. 이들을 용서하고 정권에 존속시켜야할까요?"
 SyriaFocus.23.a: "당을 금지시켜라"
 SyriaFocus.23.b: "존속하는 것만 유지시켜라"
 SyriaFocus.24.t: "로자바에서의 봉기"
 SyriaFocus.24.d: "우리는 시리아를 연방 국가로 하겠다는 약속을 했었습니다. 하지만 이 약속을 지키지 않고, 현재에 와서는 쿠르드족이 우리에게 반기를 든 상태입니다. 다른 소수민족들 또한 반기를 들 가능성이 있습니다."
 SyriaFocus.24.a: "이거 좋지 않은데"
 SyriaFocus.25.t: "드루즈 봉기"
 SyriaFocus.25.d: "Our conflict with the Rojava has encouraged the Druze in the south to rise up against us. They have declared independence, and many Druze veterans from the war have joined their army."
 SyriaFocus.25.a: "이거 좋지 않은데"
 SyriaFocus.26.t: "알라위 봉기"
 SyriaFocus.26.d: "Our conflict with the Rojava has encouraged the Alawites in Latakia to take up arms. They have cut off our access to the oceans, and many Alawites from Turkey and Lebanon are coming over the border to join up as volunteers."
 SyriaFocus.26.a: "이거 좋지 않은데"
 SyriaFocus.27.t: "[From.GetName]의 군사협력 제안"
 SyriaFocus.27.d: "[HEZ.GetName]에 대항해서 [From.GetName]는 우리와 군사협력을 제안했습니다. 이들은 적국에 대항한 군사작전을 준비하고 있고, 우리를 돕고 싶다고 전해왔습니다. 이는 [HEZ.GetName]을(를) 제거할 기회일지도 모릅니다. 하지만 이로 인해서 [From.GetName]와 가까워지게 될 것입니다."
 SyriaFocus.27.a: "좋아"
 SyriaFocus.27.b: "안된다"
 SyriaFocus.28.t: "[From.GetName]의 승낙"
 SyriaFocus.28.d: "[From.GetName]은(는) 우리의 제안에 승낙했습니다."
 SyriaFocus.28.a: "좋아"
 SyriaFocus.29.t: "[From.GetName]의 거절"
 SyriaFocus.29.d: "[From.GetName] has passed on our help."
 SyriaFocus.29.a: "이런"
 SyriaFocus.30.t: "[From.GetName]의 항복 제의"
 SyriaFocus.30.d: "헤즈볼라에게 패배하면서, [From.GetName]은(는) 항복을 하려 하고 있습니다. 어떻게 해야 할까요?"
 SyriaFocus.30.a: "수락해라"
 SyriaFocus.30.b: "거부해라"
 SyriaFocus.31.t: "[From.GetName]의 수락"
 SyriaFocus.31.d: "[From.GetName] has bent the knee for our country."
 SyriaFocus.31.a: "좋아"
 SyriaFocus.32.t: "[From.GetName]의 거부"
 SyriaFocus.32.d: "[From.GetName] has stood their ground against our country."
 SyriaFocus.32.a: "그럼 어려운 방법으로 가야지"
 SyriaFocus.33.t: "성공적인 헤즈볼라 쿠데타"
 SyriaFocus.33.d: "헤즈볼라가 자국에 쿠데타를 시행했습니다. 국민들의 지지로, 정부를 전복시키고 자신들을 집권당으로 내세웠습니다."
 SyriaFocus.33.a: "젠장"
 SyriaFocus.34.t: "실패한 헤즈볼라 쿠데타"
 SyriaFocus.34.d: "헤즈볼라가 자국에 쿠데타를 시행하려 했습니다. 그럼에도 불구하고, 자국 방위군은 이들을 저지하는데 성공했습니다. 어떻게 대처를 해야할까요?"
 SyriaFocus.34.a: "We need to eliminate them, they are a threat to our country"
 SyriaFocus.34.b: "아무것도 하지마라"
 SyriaFocus.35.t: "[From.GetName]의 항복 요구"
 SyriaFocus.35.d: "헤즈볼라에게 패배하면서, [From.GetName]은(는) 항복을 요구하고 있습니다. 어떻게 해야 할까요?"
 SyriaFocus.35.a: "수락해라"
 SyriaFocus.35.b: "거부해라"
 SyriaFocus.36.t: "[From.GetName]의 수락"
 SyriaFocus.36.d: "[From.GetName] has bent the knee for our country."
 SyriaFocus.36.a: "좋아"
 SyriaFocus.37.t: "[From.GetName]의 거부"
 SyriaFocus.37.d: "[From.GetName] has stood their ground against our country."
 SyriaFocus.37.a: "그럼 어려운 방법으로 가야지"
 SyriaFocus.38.t: "[From.GetName]의 골란고원 요구"
 SyriaFocus.38.d: "[From.GetName]는 우리에게 골란고원을 돌려달라고 요구하고 있습니다."
 SyriaFocus.38.a: "절대 안된다"
 SyriaFocus.38.b: "If they promise to support us over the Palestinians"
 SyriaFocus.38.c: "좋아"
 SyriaFocus.39.t: "하페즈 알아사드의 사망!"
 SyriaFocus.39.d: "This morning, during a phone call with the Lebanese prime minister, Hafez al-Assad died due to a heart attack. 40 days of mourning has been declared in Syria, and the funeral of Hafez will be in 3 days. He will be buried in a mausoleum in his home town of Qardaha next to his eldest son Bassel.\n\nHafez's council must now proclaim his successor."
 SyriaFocus.39.a: "Inna Lillahi Wa Inna Ilaihi Rajioon"
 SyriaFocus.40.t: "장관들을 만난 바샤르"
 SyriaFocus.40.d: "오늘 바샤르는 일부 장관들과 정보부 인사들을 초청하여 회의를 가졌습니다. 그의 이런 행동으로 미루어볼때, 그는 미래 시리아의 적법한 후계자로써 본인의 위치를 확고히 하려는 것이 분명합니다. 그는 회의에서 어떻게 자신이 국가의 안보를 개선하고, 국가의 안정을 도모하기 위해 힘쓸 것인지 계획을 밝혔습니다."
 SyriaFocus.40.a: "Send some more ministers in and televise it!"
 SyriaFocus.40.b: "회의를 진행하는건 본인 자유지."
 SyriaFocus.40.c: "회의의 중요성과 가치를 깎아내려야 한다."
 SyriaFocus.41.t: "시골 지방을 방문하는 부쉬라"
 SyriaFocus.41.d: "최근 부쉬라는 시리아 외곽의 시골 지방을 방문하였습니다. 그녀는 지역 주민들과 만나, 모두에게 더 밝은 미래를 약속하였습니다. 또한 그녀는 다마스쿠스의 일부 사업가들과 만나 시리아의 제약산업을 발전시키겠다는 본인의 포부를 밝혔습니다."
 SyriaFocus.41.a: "그녀의 계획을 전적으로 지원해라."
 SyriaFocus.41.b: "그녀는 여자일 뿐이다"
 SyriaFocus.41.c: "시민들에게 이건 껍데기 뿐인 공약이라고 선전하자."
 SyriaFocus.42.t: "군대를 선전하는 마헤르"
 SyriaFocus.42.d: "마헤르는 공화국 수비대 (Republican Guard)의 위엄을 과시하는 군대 행진을 준비 중입니다. 또한 그는 '전쟁 게임'을 통해 가장 최근 테러리스트를 어떻게 제거 하였는지 보여줄 예정입니다. 그는 그 스스로 군대의 효율성을 끌어올리는데 책임을 가지고 있는 것처럼 보입니다."
 SyriaFocus.42.a: "그를 위해 더 많은 전시물을 보내주어라"
 SyriaFocus.42.b: "어린 꼬맹이가 장난감을 가지고 놀게 놔두자"
 SyriaFocus.42.c: "그 장난감들을 치워버려라"
 SyriaFocus.44.t: "지원을 요청하는 리파트 알아사드"
 SyriaFocus.44.d: "이제 시리아의 대통령인 하페즈 알아사드는 사망하였고, 그의 동생인 리파트가 우리에게 지원을 요청하고 있습니다. 리파트는 그가 국가에서 쫒겨나기 전인 1998년까지 시리아의 부통령이었습니다. 그는 자기 자신을 배제하는 것은 헌법에 위배되는 것이라고 말하며, 대통령이 사망했다면 자기 자신이 그 다음 차기 대통령으로 부임해야한다고 주장하고 있습니다. 현재 시리아에선 민중 봉기가 일어날 것이라는 소문이 퍼지고 있으며, 그리고 리파트는 그것이 그의 권력을 되찾을 수 있는 길이라고 생각하고 있습니다. 그는 그저 그 계획을 진행하기 위해 조금의 자금이 필요할 뿐입니다."
 SyriaFocus.44.a: "그에게 자금을 제공해 주자"
 SyriaFocus.44.b: "우린 시리아에 관심이 없다."
 SyriaFocus.45.t: "99인 선언"
 SyriaFocus.45.d: "99인의 지식인들이 시리아의 정치 상황에 관한 성명을 발표하였습니다. 하페즈가 사라진 지금, 이들은 비상사태 종식, 정치범 석방, 추방자와 망명자의 귀환 허용, 그리고 언론·집회의 자유 보장을 요구하고 있습니다. 이 성명이 발표된 이후, 뜻을 같이하는 사람들이 사저에서 정치를 논하는 이른바 정치 포럼이 결성되고 있다는 보고가 들어왔습니다."
 SyriaFocus.45.a: "일부 수감자를 석방하라"
 SyriaFocus.45.b: "이런 혁명 운동은 탄압되어야 한다!"
 SyriaFocus.46.t: "1000의 선언"
 SyriaFocus.46.d: "혁명 운동은 멈추지 않은 것으로 보입니다. 오늘 1000인 성명이 발표되었습니다. 야권은 이제 일당제 폐지와 독립적인 세속 사법부를 요구하고 있습니다. 주요 대도시에서는 정부에 반대하는 시위도 여러 차례 벌어졌습니다."
 SyriaFocus.46.a: "한 발 물러서서 민주주의를 앞으로 가져오자"
 SyriaFocus.46.b: "공모자를 체포하고 시위를 해산시켜라"
 SyriaFocus.47.t: "라피크 하리리의 암살"
 SyriaFocus.47.d: "오늘, 레바논의 총리가 전용차를 통해 의회를 나가는 과정에서, 세인트 조지 호텔을 지나가는 도중 차량에 설치된 폭탄이 폭발하였습니다. 이 폭발로 하리리 총리를 포함한 21명의 사람들이 사망하였고, 220명의 부상자가 발생하였습니다. 이번 공격을 감행한 이는 잘 알려지지 않았던 조직인 '대시리아의 누스라 지하드 조직' 이었습니다. 많은 사람들은 하리리가 이전에 시리아 정부의 권력 독점을 거리낌없이 비판했던 사람이었기에, 시리아 정부가 이 암살 작전의 배후에 있을 것이라고 믿고 있습니다. 헤즈볼라의 지도자인 [HEZ.GetLeader](은)는 시리아가 레바논에서 물러나기를 요구하는 이스라엘 측이 이 공격을 조직했을 것이라고 주장하고 있습니다."
 SyriaFocus.47.a: "끔찍하군"
 SyriaFocus.48.t: "실패한 라피크 하리리의 암살"
 SyriaFocus.48.d: "오늘 총리가 차량 행렬을 이끌고 의회를 떠나던 중, 세인트조지 호텔 앞을 지나는 순간 차량 폭탄이 폭발하였습니다. 다행히 차량 행렬은 폭발 지점에서 충분히 떨어져 있었고, 하리리는 중상을 입었으나 목숨을 건졌습니다. 다른 여러 명이 사망하였고 약 200명이 부상을 입었습니다. 이번 공격은 이전에는 알려지지 않았던 조직인 '대시리아의 낫스라와 지하드 그룹'이 자신들의 소행이라고 주장하였습니다. 하리리가 시리아의 점령을 공개적으로 비판해 온 인물이었기에, 많은 이들은 시리아 정부가 이번 암살 뒤에 있다고 믿고 있습니다. 헤즈볼라 지도자 [HEZ.GetLeader]은(는) 시리아가 레바논에서 떠나도록 압박하기 위해 이스라엘이 이번 공격을 기획했다고 주장하고 있습니다."
 SyriaFocus.48.a: "끔찍하군"
 SyriaFocus.49.t: "백향목 혁명 (Cedar Revolution)"
 SyriaFocus.49.d: "라피크 하리리 전 총리의 암살 이후, 레바논은 사실상 끊임없는 시위가 듫끓고 있는 상태에 이르렀습니다. 사람들은 매일 레바논의 도시에 모여 \"자유, 주권, 독립\"을 외치고 있고, 그들은 시리아 군이 레바논에서 철수하기를 요구하고 있습니다. 결국, UN이 직접나서 철수를 요구하기에 이르렀고, 이를 어길시 제재를 가하겠다며 위협하고 있습니다. 우린 이를 무시하고 수많은 시위 속에서 계속 레바논에 군대를 주둔시킬 수 있습니다. 또 한편으로는, 우린 피해를 최소하기 위해 레바논에서 물러날 수도 있습니다."
 SyriaFocus.49.a: "우린 레바논에 계속 머물 것이다"
 SyriaFocus.49.b: "어쩌면 떠나는 것이 좋을지도 모른다"
 SyriaFocus.50.t: "헤즈볼라 공습"
 SyriaFocus.50.d: "헤즈볼라가 정부 정치인의 자택을 습격하였습니다. 납치나 살해가 목적이었는지는 알 수 없으나, 이 사건은 정치인의 사망으로 끝났습니다. 헤즈볼라 지도부는 이번 공격에 대한 관여를 부인하고 있으며, 레바논군이 자신들의 훈련 캠프에 포격을 가했는데 우리가 가상의 공격을 그에 대한 구실로 삼고 있다고 주장하고 있습니다. 우리는 그들에게 어떠한 포격도 가하지 않았으며, 헤즈볼라는 이번 습격을 정당화하기 위해 명백히 거짓 비난을 꾸며 내고 있습니다!"
 SyriaFocus.50.a: "망할 놈들!"
 SyriaFocus.51.t: "레바논 보복"
 SyriaFocus.51.d: "레바논 정부는 우리가 정부 정치인의 자택을 습격해 그를 살해했다고 비난하고 있습니다. 레바논군은 오늘 아침 일찍 우리 훈련 캠프에 포격을 가하였으며, 이 가짜 공격을 명백히 구실로 삼고 있습니다. 레바논군이 우리를 몰아내려는 의도로 우리 진지로 진격하고 있다는 보고가 들어왔습니다."
 SyriaFocus.51.a: "망할 놈들!"
 SyriaFocus.52.t: "종속을 요구하는 시리아"
 SyriaFocus.52.d: "시리아 정부는 자국의 국가 안보를 이유로, 레바논의 평화를 보장할 수 있도록 우리가 그들에게 복종할 것을 요구하였습니다."
 SyriaFocus.52.a: "그들에게 항복하자"
 SyriaFocus.52.b: "우린 우리 땅에 굳건히 서있을 것이다!"
 SyriaFocus.53.t: "[From.GetName]의 수락"
 SyriaFocus.53.d: "[FROM.GetName](이)가 우리의 요구에 항복했습니다"
 SyriaFocus.53.a: "좋군"
 SyriaFocus.54.t: "우리의 요구를 거절한 [FROM.GetName]"
 SyriaFocus.54.d: "[FROM.GetName]은(는) 우리에게 그들의 내정에 개입할 권리가 없다며 복종을 거부하였습니다."
 SyriaFocus.54.a: "그럼 어렵게 가야지"
 SyriaFocus.54.b: "그들을 내버려둬라"
 SyriaFocus.55.t: "시리아 사회민족당 쿠데타"
 SyriaFocus.55.d: "요르단에 거주하는 팔레스타인 난민들 사이에서 인기 있는 시리아사회민족당이 쿠데타를 일으켰습니다. 왕실 대부분이 가택 연금되었으며 SSNP는 군주제의 종식을 선언하였습니다. 우리는 이웃 시리아 정권이 이번 사태의 배후에 있다고 의심하고 있습니다. SSNP는 이 나라를 [SYR.GetName]에 편입하고자 한다고 밝혔습니다."
 SyriaFocus.55.a: "시리아인들은 단결해야만 한다!"
 SyriaFocus.55.b: "이 반역자들을 쫓아내라!"
 SyriaFocus.56.t: "[FROM.GetName]에서의 시리아 사회국가주의당 (SSNP)의 쿠데타"
 SyriaFocus.56.d: "SSNP가 [FROM.GetName]에서 쿠데타를 성공시켰습니다. 이들은 이제 두 나라가 하나로 통합할 것을 제안하고 있습니다."
 SyriaFocus.56.a: "우리는 그들을 환영한다!"
 SyriaFocus.56.b: "명목상의 독립을 허용한다"
 SyriaFocus.57.t: "SSNP Attempts a Coup"
 SyriaFocus.57.d: "시리아사회민족당이 요르단에서 쿠데타를 시도하였습니다. 왕실을 붙잡으려는 작전은 저지되었으나, 이미 여러 군 부대가 그들에 대한 충성을 선언하고 공개적인 반란에 나선 상태입니다. 이 모든 것의 배후에 시리아 정권이 있음은 분명하며, '요르단의 합법 정부를 안정시키겠다'는 명목으로 SSNP 부대를 돕기 위해 시리아군이 국경을 넘고 있다는 보고가 이미 들어왔습니다."
 SyriaFocus.57.a: "Damn"
 SyriaFocus.58.t: "정부를 전복시키려는 시리아"
 SyriaFocus.58.d: "시리아사회민족당이 요르단에서 쿠데타를 시도하였습니다. 왕실을 붙잡으려는 작전은 저지되었고 가담자들은 체포되었습니다. 이 일의 배후에 시리아 정권이 있음은 분명하며, 시리아군 부대가 국경을 넘어 이동하고 있다는 보고가 이미 들어왔습니다."
 SyriaFocus.58.a: "Damn"
 SyriaFocus.59.t: "요르단에서 대리전을 진행하는 팔레스타인"
 SyriaFocus.59.d: "[FROM.GetName] 정부가 요르단에 거주하는 일부 팔레스타인 난민을 무장시켜 이스라엘로 풀어놓은 것으로 보입니다. 이들 팔레스타인인을 대리 세력으로 삼아 이스라엘에서 소란을 일으키려는 의도가 분명합니다."
 SyriaFocus.59.a: "가소롭군."
 SyriaFocus.60.t: "팔레스타인 민병대가 기습을 진행하다"
 SyriaFocus.60.d: "팔레스타인 대리 민병대 여러 부대가 국경 마을을 습격하기 위해 요르단에서 이스라엘로 넘어왔습니다. 이 민병대는 명백히 [FROM.GetName]의 지원을 받고 있으며, 이는 공공연한 선전포고입니다. 우리는 반격하여 [FROM.GetName]에 우리가 호락호락하지 않음을 보여 주어야 합니다."
 SyriaFocus.60.a: "반격해라!"
 SyriaFocus.61.t: "시리아를 공격하는 이스라엘"
 SyriaFocus.61.d: "이스라엘이 요르단에 기반을 둔 팔레스타인 대리 세력에 대응하여 시리아를 공격하였습니다. 우리가 시리아에 복종하기로 동의한다면 팔레스타인을 되찾을 기회를 얻게 됩니다."
 SyriaFocus.61.a: "충분히 가치있는 희생이다"
 SyriaFocus.61.b: "우린 그들에 의존하지 않을 것이다"
 SyriaFocus.62.t: "복종을 제안하는 [FROM.GetName]"
 SyriaFocus.62.d: "[FROM.GetName]이(가) 팔레스타인을 되찾는 것을 돕는다면 우리의 종속국이 되겠다고 제안하고 있습니다."
 SyriaFocus.62.a: "물론이지"
 SyriaFocus.62.b: "우리는 그들이 필요없다"
 SyriaFocus.63.t: "동맹을 제안하는 [FROM.GetName]"
 SyriaFocus.63.d: "[FROM.GetName]이(가) 이집트에 맞선 동맹을 제안하였습니다. 이집트는 여전히 분쟁 지역인 할라이브 삼각지대를 점령하고 있으며, 이곳은 마땅히 우리 영토입니다. [FROM.GetName] 자신도 시나이 반도를 장악하는 데 관심이 있습니다. 그들과 힘을 합치면 이집트를 압박하여 영토적 이득을 얻는 데 도움이 될 것입니다. 그러나 이는 이집트와의 전쟁으로 이어질 수도 있습니다."
 SyriaFocus.63.a: "우리는 함께할 때 강하다"
 SyriaFocus.63.b: "We will find another way to reclaim Hala'ib"
 SyriaFocus.64.t: "시나이를 요구하는 [FROM.GetName]"
 SyriaFocus.64.d: "[FROM.GetName]이(가) 시나이 반도의 통제권을 자신들에게 넘길 것을 요구하고 있습니다. 이들은 운하를 관리하는 기업인 수에즈 운하 관리청을 우리와 그들이 50 대 50으로 공유하자고 제안하고 있습니다."
 SyriaFocus.64.a: "전쟁을 피하기 위해선 우리가 한번 굽혀야한다"
 SyriaFocus.64.b: "시나이는 이집트의 것이다!"
 SyriaFocus.65.t: "종교 반란!"
 SyriaFocus.65.d: "국내에서 종교 봉기가 일어나고 있습니다! 집권하지 못한 주요 종교의 신자들이 국가에 맞서 무기를 들었습니다. 우리는 [FROM.GetName]의 제국주의 정부가 이 혼란의 배후에 있다고 의심하고 있습니다."
 SyriaFocus.65.a: "망할 놈들!"
 SyriaFocus.66.t: "양보를 제안하는 [FROM.GetName]"
 SyriaFocus.66.d: "[FROM.GetName] 정부가 자신들이 건설 중인 대시리아 안에 쿠르드 자치구를 설치할 것을 제안하였습니다. 우리의 독립 일부를 그들에게 넘기는 대가로 우리의 자치를 존중하겠다고 합니다."
 SyriaFocus.66.a: "마침내 통일된 쿠르디스탄을 만들 기회다!"
 SyriaFocus.66.b: "우린 우리의 길을 알아서 찾을 것이다"
 SyriaFocus.67.t: "[From.GetName]의 수락"
 SyriaFocus.67.d: "[FROM.GetName]이(가) 우리의 거래에 동의하였습니다. 우리는 대시리아 내의 모든 쿠르드인에게 자치를 부여할 것이며, 그 대가로 쿠르드인들은 우리에게 충성할 것입니다. 쿠르드인들은 또한 앞으로 대시리아에 편입될 쿠르드 영토가 있다면 그것이 자신들에게 주어지기를 기대합니다."
 SyriaFocus.67.a: "좋아"
 SyriaFocus.68.t: "[FROM.GetName]의 저항"
 SyriaFocus.68.d: "[FROM.GetName]이(가) 우리의 거래를 거부하였습니다. 이들은 주인을 바꿀 이유가 없다며, 모든 쿠르드인이 함께할 수 있는 다른 길을 찾겠다고 밝혔습니다."
 SyriaFocus.68.a: "망할 놈들!"
 SyriaFocus.69.t: "[FROM.GetName]의 북아라비아 요구"
 SyriaFocus.69.d: "[FROM.GetName]이(가) 우리나라 북부 지역을 자신들에게 넘길 것을 요구하고 있습니다. 이들은 이 지역이 시리아 민족으로 이루어져 있으며 대시리아의 당연한 일부라고 주장합니다. 사실 이 지역에는 전적으로 아라비아 베두인이 거주하고 있습니다. 우리의 가장 큰 공군 기지 중 하나가 타부크에 있으며, 이를 넘기는 것은 전략적 손실이 될 것입니다. [FROM.GetAdjective]의 요구를 거부하면 그들이 우리를 공격할 가능성이 높습니다."
 SyriaFocus.69.a: "이 땅은 쓸모가 없기에, 우리는 평화를 위해 이를 희생할 수 있다"
 SyriaFocus.69.b: "우리는 조금이라도 땅을 내어주지 않을 것이다!"
 SyriaFocus.70.t: "동맹을 제안하는 [FROM.GetName]"
 SyriaFocus.70.d: "[FROM.GetName]이(가) 사우디아라비아에 맞선 동맹을 제안하였습니다. 그들이 현재 사우디아라비아와 분쟁 중이고 사우디아라비아가 예멘 내전에 개입해 왔으므로, 우리의 힘을 합치는 것은 가치가 있을 것입니다."
 SyriaFocus.70.a: "우리는 함께할 때 강하다"
 SyriaFocus.70.b: "We don't want an open war with Saudi Arabia"
 SyriaFocus.71.t: "사우디 동부에서의 시아파 반란"
 SyriaFocus.71.d: "[FROM.GetName]이(가) 나라의 주요 석유 생산 지역인 사우디아라비아 동부에서 시아파 봉기를 조직하였습니다. 이 지역에는 거의 전적으로 시아파가 거주하며, 이들은 사우디아라비아 전체 인구의 약 15~20%를 차지합니다. 이 민병대들은 [FROM.GetName] 정권에 대한 충성을 선언하였습니다."
 SyriaFocus.71.a: "알겠다"
 SyriaFocus.72.t: "동맹을 제안하는 [FROM.GetName]"
 SyriaFocus.72.d: "[FROM.GetName]이(가) [PER.GetName]에 맞선 동맹을 제안하였습니다. 이란의 아제르바이잔 지역에는 아제르바이잔인이 거주하고 있으며, 이란은 오랫동안 우리의 적 아르메니아를 지원해 왔습니다. [FROM.GetName]은(는) 우리가 그들과 동맹을 맺고 [PER.GetName]에 대한 향후 군사 작전을 지원하겠다고 약속한다면 아제르바이잔 지역을 주겠다고 제안하고 있습니다."
 SyriaFocus.72.a: "물론이지"
 SyriaFocus.72.b: "우리는 이란과 전쟁을 원하지 않는다"
 SyriaFocus.73.t: "동맹을 제안하는 [FROM.GetName]"
 SyriaFocus.73.d: "[FROM.GetName]이(가) [TUR.GetName]에 맞선 동맹을 제안하였습니다. 우리는 [TUR.GetName]이(가) 아르메니아인 학살을 인정하기를 거부하고 있어 그들과 분쟁이 계속되고 있습니다. 또한 우리가 튀르키예-아르메니아 국경을 공식적으로 인정했음에도, [TUR.GetName]은(는) 우리의 의지가 충분히 확고하지 않다고 주장합니다. 시리아는 튀르키예에 맞선 동맹을 제안하고 있으며, 그 대가로 일부 민족주의 정당들이 대아르메니아의 일부라고 주장하는 지역인 튀르키예 북동부를 우리에게 주겠다고 합니다."
 SyriaFocus.73.a: "물론이지"
 SyriaFocus.73.b: "우리는 터키와 전쟁을 원하지 않는다"
 SyriaFocus.74.t: "동맹을 제안하는 [FROM.GetName]"
 SyriaFocus.74.d: "[FROM.GetName]이(가) [TUR.GetName]에 맞선 동맹을 제안해 오고 있습니다. 우리가 동맹을 받아들이면 메갈리 이데아에 따른 영토 일부를 주겠다고 합니다."
 SyriaFocus.74.a: "물론이지"
 SyriaFocus.74.b: "우리는 터키와 전쟁을 원하지 않는다"
 SyriaFocus.75.t: "[FROM.GetName]의 영토 요구"
 SyriaFocus.75.d: "[FROM.GetName]과(와) 그 동맹국들이 우리 영토 일부를 자신들에게 넘길 것을 요구하고 있습니다."
 SyriaFocus.75.a: "우리는 전쟁을 원하지 않는다"
 SyriaFocus.75.b: "절대 안된다"
 SyriaFocus.76.t: "가자를 통제권을 가져가는 하마스"
 SyriaFocus.76.d: "시리아의 지원을 받은 하마스가 가자 지구를 장악하였습니다. 이들의 무장 민병대는 정부 건물을 점거하였으며, 대변인 [HAM.GetLeader]은(는) 이 단체가 알아크사 모스크를 해방하기 위해 진군할 준비를 하고 있다고 밝혔습니다."
 SyriaFocus.76.a: "젠장"
 SyriaFocus.77.t: "새로운 인티파타를 시작하는 하마스"
 SyriaFocus.77.d: "시리아의 지원을 받은 하마스가 이스라엘에 맞선 새로운 인티파다를 시작하였습니다. 수십 명의 팔레스타인 청년들이 전국에서 시위를 벌이며 타이어를 불태우고 이스라엘 병사들에게 돌을 던지고 있습니다."
 SyriaFocus.77.a: "알겠다"
 SyriaFocus.78.t: "예루살렘 방위 협정의 형성"
 SyriaFocus.78.d: "[FROM.GetName]이(가) 예루살렘 방위 조약을 결성하였습니다. 이들의 의도는 예루살렘이 정당한 소유자의 손에 남도록 보장하는 동맹을 만드는 것입니다."
 SyriaFocus.78.a: "물론 우린 함께할 것이다"
 SyriaFocus.78.b: "우리는 그들의 도움이 필요 없다"
 SyriaFocus.79.t: "예루살렘 방위 협정 으로의 초대"
 SyriaFocus.79.d: "[FROM.GetName]이(가) 우리를 예루살렘 방위 조약에 초대하였습니다. 이 방위 조약의 목표는 예루살렘이 정당한 소유자인 팔레스타인에 반환되도록 하는 것입니다."
 SyriaFocus.79.a: "물론 우린 함께할 것이다"
 SyriaFocus.79.b: "여기서 물러나는게 맞다"
 SyriaFocus.80.t: "[FROM.GetName]의 반도방위군 가입 희망"
 SyriaFocus.80.d: "[FROM.GetName]이(가) 걸프 국가가 아님에도 반도 방패군에 가입하고 싶다는 청원서를 우리 정부에 보내왔습니다. 어떻게 답해야 하겠습니까?"
 SyriaFocus.80.a: "환영한다!"
 SyriaFocus.80.b: "우리 쪽에 들어오게 할순 없다"
 SyriaFocus.81.t: "요청을 수락한 [FROM.GetName]"
 SyriaFocus.81.d: "요청을 수락한 [FROM.GetName]"
 SyriaFocus.81.a: "좋아"
 SyriaFocus.82.t: "[FROM.GetName]의 요청 거부"
 SyriaFocus.82.d: "요청을 거부한 [FROM.GetName]"
 SyriaFocus.82.a: "Damn"
 SyriaFocus.83.t: "저항추축국 가입을 원하는 [FROM.GetName]"
 SyriaFocus.83.d: "[FROM.GetName]이(가) 저항의 축에 가입하여 미국에 맞서 싸우고 싶다는 청원서를 우리 정부에 보내왔습니다. 어떻게 답해야 하겠습니까?"
 SyriaFocus.83.a: "환영한다!"
 SyriaFocus.83.b: "우리 쪽에 들어오게 할순 없다"
 SyriaFocus.84.t: "요청을 수락한 [FROM.GetName]"
 SyriaFocus.84.d: "요청을 수락한 [FROM.GetName]"
 SyriaFocus.84.a: "좋아"
 SyriaFocus.85.t: "[FROM.GetName]의 요청 거부"
 SyriaFocus.85.d: "요청을 거부한 [FROM.GetName]"
 SyriaFocus.85.a: "Damn!"
 SyriaFocusNews.0.t: "로자바 해방"
 SyriaFocusNews.0.d: "오늘 놀라운 일이 벌어졌습니다. 시리아에서 로자바를 완전히 해방시켰습니다. 시리아 수뇌부는 '중동의 쿠르드 족에서 새로운 시대가 왔습니다.'라며 선언을 했습니다. 이 발표 직후, 터키, 이라크, 이란의 외무부에서는 '이는 이 근방의 분란을 일으킬 뿐.'이라고 일축했습니다."
 SyriaFocusNews.0.a: "흥미롭군"
 SyriaFocusNews.1.t: "로자바 합병"
 SyriaFocusNews.1.d: "로자바에서는 다시 시리아로의 합병을 승인하였습니다. 거기에 더해서 내전 이전의 상황으로 돌아가는 것 또한 승낙하였습니다. 이 결정으로 로자바의 많은 퇴역군인들과 군 장성들의 분노를 일축삼았지만, 유혈사태는 전혀 없는 듯 보입니다."
 SyriaFocusNews.1.a: "흥미롭군"
 SyriaFocusNews.2.t: "로자바에 대한 자치"
 SyriaFocusNews.2.d: "시리아와 로자바 사이의 협상이 마침내 끝을 맺었고, 두 정부는 합의를 이끌어 내었습니다. 시리아 정부는 시리아 연방정부 실현에 대한 약속을 하였으며, 로자바는 시리아에게서 분리독립을 하지 않겠다는 약속을 하였습니다."
 SyriaFocusNews.2.a: "흥미롭군"
 SyriaFocusNews.3.t: "시리아 내전의 연장"
 SyriaFocusNews.3.d: "Negotiations between Syria and the Rojava have broken down, as the two parties didn't see eye-to-eye on the future of Northern Syria. It seems like there might be another conflict brewing in Syria"
 SyriaFocusNews.3.a: "흥미롭군"
 SyriaFocusNews.4.t: "시리아 사회 국가주의당(SSNP)의 부흥"
 SyriaFocusNews.4.d1: "시리아에서 시리아 사회민족당의 쿠데타 시도가 있었습니다. 다마스쿠스에서 테러가 발생하였고, 군대 시찰 중인 바샤르 알아사드를 암살하였습니다. 아사드의 부재는 아사드 전의 세력을 끌어모으기에 충분하였습니다.\n\n시리아에서 일어난 이 새로운 충돌로 인접국이 다음의 목표가 될 것이며, 시리아 사회민족당이 시리아 국내를 완전히 장악했습니다."
 SyriaFocusNews.4.d2: "The Syrian Social Nationalist Party have attempted to stage a coup in Syria. Several attacks have been made across Syria, and it seems the country is falling into another civil war.\n\nThis new conflict might give rise to a Syria, which will likely target their neighbours first, as the SSNP dreams of a Greater Syria."
 SyriaFocusNews.4.a: "또다른 전쟁인가?"
 SyriaFocusNews.5.t: "시리아 연방공화국의 결성"
 SyriaFocusNews.5.d: "시리아에서의 유혈 사태를 방지하기 위해, 자유 시리아의 지도층들은 민족 및 종교를 기반으로 하여 시리아 연방 공화국의 결성을 이루어내었습니다. 다행이도 이를 통해 내전이 끝나고 흩어진 잔당들에게 가해지는 폭력 사태를 줄여줄 수 있을 것입니다."
 SyriaFocusNews.5.a: "좋은 일이군"
 SyriaFocusNews.6.t: "시리아에서의 민족 갈등"
 SyriaFocusNews.6.d: "시리아 내전의 종식이후, 자유 시리아 정부는 국내에서의 쿠르드족 자치권을 보장하였습니다. 그러나 지금 현재, 자유 시리아 정부는 말을 바꾸어서, 쿠르드족은 압제에 대항하여 다시금 일어섰습니다. 시리아에서 또다른 충돌이 일어날 것만 같습니다."
 SyriaFocusNews.6.a: "또다른 전쟁인가?"
 SyriaFocusNews.7.t: "두번째 시리아의 레바논 점령"
 SyriaFocusNews.7.d: "헤즈볼라에게 국내 일부가 넘어간 뒤, 시리아는 레바논 통제를 더욱 더 공고히 하고 있는 것처럼 보입니다. 시리아가 20여년동안 레바논을 내버려둔 이후, 다시금 역사가 재현되고 있습니다."
 SyriaFocusNews.7.a: "걱정이군"
 SyriaFocusNews.8.t: "레바논에서의 헤즈볼라의 쿠데타"
 SyriaFocusNews.8.d: "헤즈볼라가 레바논 정부를 상대로 쿠데타를 주도했습니다. 전해지는 정보에 의하면, 이 쿠데타는 시리아의 지원을 받았다고 합니다."
 SyriaFocusNews.8.a: "걱정이군"
 SyriaFocusNews.9.t: "레바논에서의 쿠데타 실패"
 SyriaFocusNews.9.d: "헤즈볼라의 쿠데타는 레바논 방위군에 의해 저지되었습니다. 혹자는 이 쿠데타가 시리아의 지원을 받았다고 말하고 있습니다. 이로 인해 레바논 정부와 헤즈볼라의 전투가 이어질 것입니다."
 SyriaFocusNews.9.a: "걱정이군"
 SyriaFocusNews.10.t: "[From.GetName]의 골란고원 영유권 포기"
 SyriaFocusNews.10.d: "놀랍게도 [From.GetAdjective] 정부는 골란고원에 대한 영유권을 포기했습니다. 분석가들은 이러한 움직임으로 이스라엘과의 관계변화를 가져올 것이라 말하고 있으며, 두 나라간에 향후 협력을 이어갈 가능성이 있다고 했습니다."
 SyriaFocusNews.10.a: "흥미롭군"
 SyriaFocusNews.11.t: "하페즈 알아사드의 사망!"
 SyriaFocusNews.11.d: "This morning, during a phone call with the Lebanese prime minister, Hafez al-Assad, the President of Syria, died due to a heart attack. 40 days of mourning has been declared in Syria, and the funeral of Hafez will be in 3 days. He will be buried in a mausoleum in his home town of Qardaha next to his eldest son Bassel.\n\nHafez's council must now proclaim his successor."
 SyriaFocusNews.11.a: "오, 주여! 우리는 하나님에게 속하니 우리는 그분께로 돌아가나이다 (코란 2장 156절)"
 SyriaFocusNews.12.t: "민주주의를 도입하는 시리아"
 SyriaFocusNews.12.d: "'다마스쿠스의 봄'이라 불리는 계속된 시위로 인해, 시리아 대통령은 나라가 혼란에 빠질 위험을 무릅쓰는 대신 민주주의에 길을 열어 주기 위해 물러나기로 결정하였습니다. 새 임시 대통령 [SYR.GetLeader]은(는) 향후 선거 조직을 돕겠다고 약속하였습니다."
 SyriaFocusNews.12.a: "진행하라"
 SyriaFocusNews.13.t: "다마스쿠스의 봄"
 SyriaFocusNews.13.d: "시위의 물결이 시리아 전 지역을 물들이고 있습니다. 하페즈 알아사드 전 대통령 사후, 사람들은 더욱 투명하고 민주적인 정부를 요구하고 있습니다. 현 시리아 대통령 [SYR.GetLeader](은)는 이런 시위들은 혁명 조직이나 외세의 침입에 지나지 않으며, 이와 똑같은 방식으로 대응할 것이라고 발표했습니다."
 SyriaFocusNews.13.a: "흥미롭군"
 SyriaFocusNews.14.t: "라피크 하리리의 암살"
 SyriaFocusNews.14.d: "Today, as the Prime Minister of Lebanon was leaving parliament in his motorcade, a car bomb exploded while it was passing the St. George Hotel. Hariri, along with 21 other people, died in the explosion, leaving 220 others wounded. \n\nResponsibility for the attack has been claimed by 'The Nasra and Jihad Group in Greater Syria', a previously unknown organisation. Tabloids and protestors within the country believe that the Syrian government is behind the assassination, as Hariri was an outspoken critic of their occupation, while the Hezbollah leader, [HEZ.GetLeader], claims that the attack was orchestrated by Israel in an attempt to force Syria out of Lebanon."
 SyriaFocusNews.14.a: "끔찍하군"
 SyriaFocusNews.15.t: "실패한 라피크 하리리의 암살"
 SyriaFocusNews.15.d: "오늘 레바논 총리가 차량 행렬을 이끌고 의회를 떠나던 중, 세인트조지 호텔 앞을 지나는 순간 차량 폭탄이 폭발하였습니다. 다행히 차량 행렬은 폭발 지점에서 충분히 떨어져 있었고, 하리리는 중상을 입었으나 목숨을 건졌습니다. 다른 여러 명이 사망하였고 약 200명이 부상을 입었습니다. 이번 공격은 이전에는 알려지지 않았던 조직인 '대시리아의 낫스라와 지하드 그룹'이 자신들의 소행이라고 주장하였습니다. 하리리가 시리아의 점령을 공개적으로 비판해 온 인물이었기에, 타블로이드 언론과 국내 시위대는 시리아 정부가 암살의 배후에 있다고 믿고 있으며, 헤즈볼라 지도자 [HEZ.GetLeader]은(는) 시리아를 레바논에서 몰아내기 위해 이스라엘이 이번 공격을 기획했다고 주장하고 있습니다."
 SyriaFocusNews.15.a: "Horrible."
 SyriaFocusNews.16.t: "백향목 혁명 (Cedar Revolution)"
 SyriaFocusNews.16.d: "Since the assassination of Lebanon's Prime Minister, Rafic Hariri, the country has been in a constant state of demonstration. Almost daily the Lebanese population has gathered on the streets to peacefully protest Syria's occupation. Today, the Syrian President [SYR.GetLeader] announced that the Syrian troops would be leaving the country, marking a victory for the protestors."
 SyriaFocusNews.16.a: "A success for Lebanon's Independence."
 SyriaFocusNews.17.t: "Syria Moves in on Lebanon"
 SyriaFocusNews.17.d: "회기 도중 레바논 의회가 시리아군과 보안 요원들에게 습격당했습니다. 여러 의원이 테러 혐의로 체포되었습니다. 이와 동시에 일부는 헤즈볼라 민병대를 동반한 시리아군 부대가 레바논군을 무장 해제하기 위해 레바논군 기지로 진격하였습니다. 몇몇 핵심 군사 시설의 경비는 이제 시리아 아랍군과 헤즈볼라가 공동으로 맡고 있습니다.\n\n시리아 정부는 이를 대테러 작전이라고 부르고 있지만, 실제로는 레바논 의회가 이제 친시리아 정치인과 헤즈볼라 구성원들에게 완전히 장악되었습니다. 시리아는 사실상 이 나라에 대한 완전한 통제권을 얻었습니다."
 SyriaFocusNews.17.a: "충격적이로군!"
 SyriaFocusNews.18.t: "레바논에서 철수하는 시리아"
 SyriaFocusNews.18.d: "국제 사회와 레바논 여론의 압력이 거세지자, 시리아 아랍군은 레바논에서 철수하기로 결정하고 나라의 치안을 전적으로 레바논군에 맡겼습니다."
 SyriaFocusNews.18.a: "흥미롭군"
 SyriaFocusNews.19.t: "대시리아의 형성"
 SyriaFocusNews.19.d: "시리아 지도자 [SYR.GetLeader]은(는) 오늘 대시리아의 창설을 발표하였습니다. 이들은 시리아 정부가 시리아 민족을 통합하고 지역 내에 하나의 초국가를 세우기 위해 모든 노력을 다할 것이라고 말했습니다. 지역 국가들은 이미 이러한 행동이 터무니없다고 규탄하였습니다."
 SyriaFocusNews.19.a: "흥미롭군"
 SyriaFocusNews.20.t: "새로운 인티파다를 시작하는 [HAM.GetName]"
 SyriaFocusNews.20.d: "시리아의 지원을 받은 하마스가 이스라엘에 맞선 새로운 인티파다를 시작하였습니다. 수십 명의 팔레스타인 청년들이 전국에서 시위를 벌이며 타이어를 불태우고 이스라엘 병사들에게 돌을 던지고 있습니다."
 SyriaFocusNews.20.a: "알겠다"
 SyriaFocusNews.21.t: "아랍 연합 공화국의 재탄생"
 SyriaFocusNews.21.d: "시리아와 이집트가 아랍 연합 공화국을 재건하기로 결정하였습니다. 두 나라의 바트당 지도부가 협상한 끝에, 두 나라는 바트주의의 꿈인 범아랍주의를 부활시키기로 하였습니다. 과거의 모든 아랍 연합은 불과 몇 년밖에 가지 못하였으며, 이번 연합이 얼마나 지속될지는 지켜봐야 할 것입니다."
 SyriaFocusNews.21.a: "무의미한 짓이다"
 Syria.1.t: "내전에서의 승리!"
 Syria.1.SYR.desc: "마침내 시리아 반대분자들과 더러운 타리를 알 샴, ISIS의 이슬람 세력에게서 승리를 거두었습니다. 이제 국가를 재건하고 미래에 투자를 해야합니다."
 Syria.1.FSA.desc: "아사드의 독재 정권이 몰락하였고, 우리는 이슬람주의파의 위협을 물리쳤습니다. 시리아는 마침내 자유롭습니다!"
 Syria.1.NUS.desc: "알라께서 독재자 아사드와, 자유 시리아군을 물리쳐주시고 우리에게 승리를 안겨주셨다. 이는 신성한 표식으로써 이전보다 알라의 가르침을 더 멀리 퍼뜨려야 한다."
 Syria.1.a: "어떤 나라도 우리를 이길 수 없다!"
 Syria.2.t: "타리르 알 샴의 운명"
 Syria.2.desc: "Throughout the Syrian civil war, we've had an uneasy alliance with the Tahrir Al-Sham, also known as the Al-Nusra Front. We have avoided conflict with them, so we could focus on taking out the Assad regime. However, as the dust settles, our forces are staring across the border at theirs.\n\nWe could continue the civil war, and take them out. On the other hand, we could promise them representation in whatever government we will form in the future, and they will most likely demand us to hold to that promise."
 Syria.2.a: "약조를 지켜라"
 Syria.2.b: "없애버려!"
 Syria.3.t: "시리아 반대분자들이 약조를 지키다"
 Syria.3.desc: "시리아 반대분자들은 연락을 취해 정권 내에 한자리를 주겠다고 하였습니다. 또한 실질적인 정치적인 권한도 부여하였습니다. 우리가 거부한다면, 바로 군사 행동을 실시할 것만 같습니다."
 Syria.3.a: "함께 시리아를 통치할 것이다."
 Syria.3.b: "절대로 안된다! 저들을 제거해야한다!"
 Syria.4.t: "타리르 알 샴이 시리아 반대분자에 합류하다"
 Syria.4.desc: "타리르 알 샴은 존속을 약속받은 이후, 정권 내의 참여를 승낙하엿습니다. 이들을 배제해서는 안된다는 것을 명심해야 합니다..."
 Syria.4.a: "하나의 시리아를 위해서, 만세!"
 Syria.5.t: "타리르 알 샴의 거절"
 Syria.5.desc: "하리르 알 샴은 우리의 제안을 거절했습니다. 이전처럼 해결할 수 밖에 없을 것 같습니다..."
 Syria.5.a: "먼저 공격하기 전에 공격하자!"
 Syria.14.t: "로자바 문제"
 Syria.14.desc: "로자바는 쿠르드족 자치정부가 있는 시리아 북부 지역입니다. 내전이 이루어지는 동안, 이들은 주로 무신론자와 급진 민병대와 함께 ISIS와 맞써 싸웠습니다. 이들의 목표는 연방 시리아 공화국을 세우는 것으로, 많은 이들 또한 이 지역을 서부 쿠르드족 영토로 간주하고 있습니다. 저들은 우리에게 전쟁에 적극적으로 참여하겠다고 서한을 보내왔습니다. 우리는 언제나 저들에게 제한적인 자치권을 부여했지만, 이를 통해 저들을 완전히 통제할 수 없음이 드러났습니다. 이들을 내버려둔다면 쿠르드 민족주의가 온 국가에 퍼지는 사태를 나을 것입니다."
 Syria.14.a: "이 지역은 시리아 영토다"
 Syria.14.b: "자치권을 부여해줘라"
 Syria.14.c: "독립을 시켜버려라"
 Syria.15.t: "타리르 알 샴의 잔당들이 우리에게 복종하다"
 Syria.15.d: "With Assad's murderous forces advancing deep into Idlib, the hardline islamist coalition of Tahrir al-Sham have suffered irreversible losses and their unity has broken down. As the Free Syrian Army is a wide coalition of groups, we are also welcoming to islamists as long as they commit to our dream of a free Syria. The islamist militias see now the benefits of operating under a more moderate banner as it will allow them to receive foreign support. This will increase our coordination of offensives and breathe new life into our revolution."
 Syria.15.a: "진정한 시리아로 온 형제들을 환영하오"
 Syria.16.t: "자유 시리아 군의 몰락 - 대부분의 이들이 우리군에게 편입되었습니다"
 Syria.16.d: "Allah is great! Our rival rebel coalition, the Free Syrian Army has essentially collapsed due to large battlefield losses, and most of their remaining militia groups have pledged allegiance to our great islamist coalition as we have been more effective and successful in our jihad against Bashar the godless dog and his Iranian apostate puppetmasters. Years of fighting this brutal civil war has turned most of the former FSA-forces under the sway of islamist ideology. Though we don't exactly agree with the Muslim Brotherhood's interpretation of everything, they are, inshallah, willing to fight together with us in a coordinated fashion, and at least believe in Sharia as the sole law and Islam as the only needed governance of Syria."
 Syria.16.a: "진정한 시리아로 온 형제들을 환영하오"
 SyriaNews.1.t: "시리아 내전 종전"
 SyriaNews.1.d: "시리아 내전이 마침내 그 끝을 고했습니다. 대부분의 전투는 중단되었고, 살아남은 이들은 새로운 시리아의 미래를 계획하고 있습니다."
 SyriaNews.1.a: "저들에게 행운을 빌어주자"
 SyriaNews.2.t: "자유 시리아 군과 타리르 알 샴 간의 휴전 파기"
 SyriaNews.2.d: "시리아 내전이 진행되는 동안 자유 시리아 군과 타리르 알 샴은 아사드 정권에 함께 대항했습니다. 하지만 아사드의 몰락 이후, 이들 세력은 함께 나아가려 했으나 하나의 시리아라는 공통된 목표를 두고 의견일치를 이루지 못했습니다.\n\n양 측은 이제 서로를 향해 공세를 이어갈 준비를 하고 있는 것처럼 보입니다."
 SyriaNews.2.a: "서로의 다름을 인정할 수 있도록 빌어주자"
 SyriaNews.3.t: "자유 시리아 군과 타리르 알 샴의 연합"
 SyriaNews.3.d: "시리아 내전이 진행되는 동안 자유 시리아군과 타리르 알 샴은 아사드 정권에 함께 대항했습니다. 그리고 아사드의 몰락 이후, 이들 세력은 시리아의 미래를 위해 협상에 들어갔습니다. 놀랍게도 자유 시리아군 측은 타히르 알 샴 측에 의석을 제공하는데 동의를 하였습니다.\n\n많은 정치 관련 분석가들은 이러한 상황이 그리 오래가지 않을 것이라 예측했습니다."
 SyriaNews.3.a: "저들에게 행운을 빌어주자"
 SyriaNews.8.t: "시리아 이슬람 세력이 자유 시리아군 아래 연합을 결성하다"
 SyriaNews.8.d: "With growing military pressure on the Syrian islamists of Tahrir al-Sham, their unity has broken down and their remaining forces have pledged allegiance to the Free Syrian Army Coalition in a last ditch effort to unify the strength of the Syrian rebels to be able to mount a decisive offensive against Assad's forces. It is likely the possibility of receiving foreign military aid played a large role in convincing the islamists to operate under a more moderate banner."
 SyriaNews.8.a: "흥미롭군"
 SyriaNews.9.t: "자유 시리아 군의 몰락 - 잔당들이 이슬람 세력에 합류하다"
 SyriaNews.9.d: "With growing military pressure on the Free Syrian Army Coalition, their already shaky unity has broken completely down and the remaining militias have mostly pledged allegiance to the Syrian islamists of Tahrir al-Sham. Tahrir al-Sham, which has the former al-Qaeda affiliated Nusra-Front at its core, have been more effective and successful on the battlefield against Assad's forces, and this added with the growing influence of radical ideology within many FSA-groups has made a large scale switch of allegiance increasingly more likely over time."
 SyriaNews.9.a: "흥미롭군"
 SyriaDecisions.0.t: "골란고원 협정"
 SyriaDecisions.0.desc: "An envoy from [From.GetName] has approached us on the issue of Golan. They state if Israel were to support them militarily, they would renounce claims on the region, which the UN still sees as legally part of Syria. Doing the deal would improve our global appearance, and might give some leverage over [From.GetName]."
 SyriaDecisions.0.a: "무기지원을 해라, 좋은 거래군"
 SyriaDecisions.0.b: "조약을 지킬 것이라 믿을 수 없다"
 SyriaDecisions.1.t: "[From.GetName]의 승낙"
 SyriaDecisions.1.desc: "이스라엘이 우리의 제안에 승낙했습니다."
 SyriaDecisions.1.a: "좋아"
 SyriaDecisions.2.t: "[From.GetName]의 거절"
 SyriaDecisions.2.desc: "이스라엘이 우리의 제안에 거절했습니다."
 SyriaDecisions.2.a: "젠장"
 SyriaDecisions.3.t: "하타이 협정"
 SyriaDecisions.3.desc: "[From.GetName] 사절단이 골란고원에 대한 문제를 의논하기 위해 연락을 취해왔습니다. 이들이 성명하기를 만약 터기가 자신들을 군사적으로 지원만 해준다면 하타이에 대한 영유권을 포기하겠다는 것입니다. 이러한 협정으로 국제 영향력을 늘리고 [From.GetName]에도 영향력을 행사할 수 있을지도 모릅니다."
 SyriaDecisions.3.a: "무기지원을 해라, 좋은 거래군"
 SyriaDecisions.3.b: "조약을 지킬 것이라 믿을 수 없다"
 SyriaDecisions.4.t: "[From.GetName]의 승낙"
 SyriaDecisions.4.desc: "터키가 우리의 제안에 승낙했습니다."
 SyriaDecisions.4.a: "좋아"
 SyriaDecisions.5.t: "[From.GetName]의 거절"
 SyriaDecisions.5.desc: "터키가 우리의 제안에 거절했습니다."
 SyriaDecisions.5.a: "젠장"
 SyriaDecisions.6.t: "독립보장 제안"
 SyriaDecisions.6.desc: "[From.GetName]은(는) 독립보장 제안을 하였고, 이는 우리를 자주국인 것을 어떠한 때라도 보장한다는 것입니다. 그에 대한 보답으로 자신들이 이길 수 있도록 내전에 참여하라고 하였습니다. 이는 우리의 나라를 가질 수 있는 기회입니다."
 SyriaDecisions.6.a: "그 기회를 다잡자"
 SyriaDecisions.6.b: "안된다. 나중에 가서는 말을 바꿀 것이다."
 SyriaDecisions.7.t: "[From.GetName]의 승낙"
 SyriaDecisions.7.desc: "[From.GetName]은(는) 우리의 제안에 승낙했습니다."
 SyriaDecisions.7.a: "좋아"
 SyriaDecisions.8.t: "[From.GetName]의 거절"
 SyriaDecisions.8.desc: "[From.GetName]은(는) 우리의 제안에 거절했습니다."
 SyriaDecisions.8.a: "젠장"
 SyriaDecisions.9.t: "시리아의 스파이"
 SyriaDecisions.9.desc: "시리아에서 얻은 명단에서 자국 조직 내의 이름이 있는 것을 발견했습니다. 이는 분명이 시리아에서 심은 스파이일 것이며, 무언가를 파내고 있었음이 틀림없습니다. 이놈들을 제거하고 관련 문제를 해결해야 합니다."
 SyriaDecisions.9.a: "이 의심되는 자를 처형하고 시리아를 공격해라!"
 SyriaDecisions.9.b: "스파이에 대한 몸값을 요구해라"
 SyriaDecisions.10.t: "스파이 노출"
 SyriaDecisions.10.desc: "헤즈볼라가 우리가 심어놓은 스파이를 포착했고 처형시켰습니다. 또한 헤즈볼라 군인들이 다라라로 향하는 보고를 접햇습니다. 보복으로 이 지역을 모두 통제하려는듯 보였습니다."
 SyriaDecisions.10.a: "놈들을 물리쳐야한다!"
 SyriaDecisions.11.t: "스파이 노출"
 SyriaDecisions.11.desc: "헤즈볼라가 우리가 심어놓은 스파이를 포착했고 포로로 잡혔습니다. 이들은 몸값을 요구하고 있습니다."
 SyriaDecisions.11.a: "테러리스트와 협상은 없다!"
 SyriaDecisions.11.b: "우리는 테러리스트에게 대가를 지불하지 않는다!"
 SyriaDecisions.12.t: "시리아의 지불"
 SyriaDecisions.12.desc: "시리아는 스파이의 몸값을 지불했습니다."
 SyriaDecisions.12.a: "좋아"
 SyriaDecisions.13.t: "시리아의 몸값지불 거절"
 SyriaDecisions.13.desc: "시리아는 스파이의 몸값을 지불하지 않았습니다."
 SyriaDecisions.13.a: "지불하도록 만들어!"
 SyriaDecisions.13.b: "물러가자"
 SyriaDecisions.14.t: "하산 나스랄라의 죄"
 SyriaDecisions.14.desc: "헤즈볼라의 지도자인 하산 나스랄라의 모습이 담긴 동영상이 인터넷을 떠돌고 있습니다. 이 동영상에는 창녀와 성행위를 하는 모습이 있었습니다. 나스랄라는 '지오니스트의 음모'라며 명백하게 이를 부정하고 나섰습니다. 하지만 슈라 의회는 지도자 자리에서 그를 해임시키고 [Root.GetLeader]을(를) 새로운 지도자에 앉혔습니다.\n\n[Root.GetLeader]은(는) 오랫동안 이란의 독립을 위해서 헌신해왔습니다."
 SyriaDecisions.14.a: "이거 의심스럽군"
 SyriaDecisionsNews.0.t: "골란고원 협상"
 SyriaDecisionsNews.0.d: "In a surprise move, [From.GetName] and [ISR.GetName] have agreed over their land dispute in Golan. [From.GetName] will relinquish all claims to the area. Many analysts say that this is a move to gain favours from [ISR.GetName], most likely in the form of military support for their ongoing conflict."
 SyriaDecisionsNews.0.a: "흥미롭군"
 SyriaDecisionsNews.1.t: "하타이 협상"
 SyriaDecisionsNews.1.d: "In a surprise move, [From.GetName] and [TUR.GetName] have agreed over their land dispute in Hatay. [From.GetName] will relinquish all claims to the area. Many analysts say that this is a move to gain favours from [TUR.GetName], most likely in the form of military support for their ongoing conflict."
 SyriaDecisionsNews.1.a: "흥미롭군"
 SyriaDecisionsNews.2.t: "국가의 탄생"
 SyriaDecisionsNews.2.d: "[From.GetName]와 [ROJ.GetName]은(는) 내전이 끝날 때까지 군사동맹을 맺었습니다. 이에 대한 대가로 [ROJ.GetName]은(는) 내전 종식 후 독립을 보장받았습니다."
 SyriaDecisionsNews.2.a: "흥미롭군"
 SyriaDecisionsNews.3.t: "헤즈볼라 - 시리아 충돌"
 SyriaDecisionsNews.3.d: "헤즈볼라 내에서 스파이 망의 노출로 두 세력 간에 충돌이 번뜩였씁니다. 외교적인 해법은 무산되었고, 남 시리아에서는 두 세력간의 전투가 보고되고 있습니다.."
 SyriaDecisionsNews.3.a: "흥미롭군"
