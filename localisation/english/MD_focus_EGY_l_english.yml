 EGY_regime_strength_TOOLTIP: "§YMubarak's strength§! starts at 50. Each faction moves it up or down by how far its opinion is above or below 50, weighted by its influence. §YPresidential authority§! (currently [?EGY_mubarak_authority|0]) is added on top.\n\nStrength sets our Political Power gain ([?EGY_regime_pp_var|+%]) and Stability ([?EGY_regime_stability_var|+%])."
 EGY_regime_influence_TOOLTIP: "§YInfluence§! is how much a faction counts in the regime: §YSubdued§! (0 to 9), §YMeddling§! (10 to 24), §YInfluential§! (25 to 39), or §YDominating§! (40 or more). Only one faction can be Dominating. A faction that reaches 40 pushes any other Dominating faction down to 39."
 EGY_military_opinion_TOOLTIP: "The opinion of the armed forces drifts by [?EGY_military_pressure_var|+0.0] each month. Higher defence spending raises it. Recession, a high interest rate, and a non-autocratic government lower it."
