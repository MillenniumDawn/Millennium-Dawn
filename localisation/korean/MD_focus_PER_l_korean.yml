 iranian_focus.1261.d: "[PER.GetLeader]의 축복 속에 제2 이슬람 공화국의 첫 선거가 치러졌으며, 다른 모든 경쟁자를 제치고 과반수를 얻은 이 선거의 승자는..."
 PER_separation_of_powers: "권력 분립"
 PER_separation_of_powers_desc: "진정한 민주주의에서 권력은 단일 주체의 손에 집중되어서는 안 됩니다. 우리는 독립된 사법부, 강력한 입법부, 국민에게 책임을 지는 행정부를 갖춘 권력 분립을 보장할 것입니다."
 PER_separatist_warning: "분리주의의 위협"
 PER_separatist_warning_desc: "가장 취약한 지역에 대한 외세의 착취에 관한 상세 보고서가 지도부에 제출되었습니다."
 PER_iraq_reparations: "이라크 배상"
 PER_iraq_reparations_desc: "우리는 1980년대 사담의 군대가 입힌 참화를 잊지 않았으며, 따라서 아직 받지 못한 배상금을 받아내야 합니다. 어쨌든 우리는 승자였습니다."
 PER_iraq_reparations_TT: "£decision_icon_small 이란-이라크 전쟁 배상 §Y결정§!을 §Y잠금 해제§!합니다"
 iranian_focus.781.t: "이란의 침략에 맞서 움직이는 정의 연합"
 iranian_focus.781.d: "중동의 여러 국가가 최근 결성한 '정의 연합'이라는 연합체는 '이란의 신파시즘'에 대한 전면 공격을 발표했습니다. 이는 이란이 최근 수년간 인접국을 병합하고 예속시키며 공격적으로 확장해 온 가운데 벌어진 일입니다. 이 조치는 세계 지도자들을 당혹하게 했는데, 지역에서의 전면적 분쟁은 세계 공급망에 재앙을 불러올 수 있기 때문입니다. 관련된 모든 당사자가 너무 늦기 전에 하루빨리 이 문제를 해결하기를 전 세계가 바라고 있습니다."
 iranian_focus.781.a: "흥미롭군"
 iranian_events.900.t: "이란 콘텐츠에 관한 안내"
 iranian_events.900.d: "안녕하십니까! 이란 콘텐츠를 즐겁게 이용하시기 바랍니다. 자주 묻는 질문에 대한 답이 담겨 있으니 다음 메시지를 읽어 주십시오.\n\nQ: 정부를 어떻게 전복합니까?\nA: 정통성을 0으로 만들면 됩니다. 정통성을 떨어뜨리는 특정 중점을 완료하여 가능합니다. 정통성이 가장 빠르게 하락하는 때는 시위 중이며, 첫 시위는 2000년 7월 학생 시위 사건으로 가능합니다. 시위가 시작된다고 명시된 선택지를 반드시 선택하십시오!\n\nQ: 혁명을 일으켰지만 아야톨라 몬타제리에 묶여 있습니다. 성향은 어떻게 바꿉니까?\nA: 몬타제리 트리의 맨 아래에서 이란 정부를 어떻게 운영할지에 대한 2가지 선택지가 제시됩니다. 혁명 이후에는 어떤 정당이든 집권시킬 수도 있습니다. 내전을 일으키는 경로를 택했다면 약 70일만 기다리십시오.\n\nQ: 제재를 어떻게 해제합니까?\nA: 핵 프로그램을 해체하거나 미국과의 관계를 20 이상으로 올리면 됩니다.\n\n----------------------\n\n이란을 즐겁게 플레이하시기 바랍니다! 의견, 버그 제보, 질문은 Millennium Dawn 디스코드나 레딧에 남겨 주십시오.\n\n - Millennium Dawn 중동 팀"
 iranian_events.900.a: "전진!"
 iranian_focus.197.t: "레자 팔라비 축출!"
 iranian_focus.197.d: "군부의 압력으로 레자 팔라비가 동생 알리레자에게 자리를 넘기고 퇴위했습니다. 그는 오늘 이른 새벽 조용히 출국했으며, 알리레자는 저녁에 대국민 연설을 했습니다. 알리레자가 현 행정부의 노선에서 벗어날 것이라는 견해가 널리 퍼져 있습니다."
 iranian_focus.197.a: "자비드 샤"
 PER_brave_men_of_the_sky_desc: "오직 가장 용감한 이들만이 우리의 하늘을 지킬 수 있습니다. 이 하늘은 텅 빈 곳이 아니라 우리 꿈의 화폭이며 자유의 상징이고, 미래 세대가 올려다보는 희망입니다. 아침 첫 햇살의 온기를 품고 있으며 해질녘 마지막 노을의 장관도 지켜봅니다."
 PER_basij_protest_mobilization: "바시즈 - 동원됨"
 PER_basij_protest_mobilization_desc: "바시즈는 커져 가는 모든 형태의 반대를 진압하기 위해 동원되었습니다."
 PER_the_waves_of_iran: "[PER.GetFlag] 페르시아만의 격랑"
 PER_low_popularity_mojahedin: "낮은 인기도"
 PER_medium_popularity_mojahedin: "보통 인기도"
 PER_high_popularity_mojahedin: "높은 인기도"
 PER_no_pm_set: "임명된 총리 없음"
 PER_pahlavi_against: "반대"
 PER_pahlavi_allied: "동맹"
 PER_reformist_better_TT: "£PER_Mod_Vilayat_e_Faqih  §H개혁파 대통령§!이 있다면 [USA.GetFlag] §H미국§!과의 §H외교 관계 단절§! 변동치를 제거할 수 있습니다\n - 이는 §H서방에 외교관 파견§! 결정을 통해 이란 대통령 결정으로 사용할 수 있게 됩니다\n - 관계가 충분히 높다면 제재를 완화하는 데 그치지 않고 모두 해제하도록 설득할 수 있습니다"
 PER_irgc_black_market_exploits: "암시장 악용"
 PER_relax_religious_laws: "종교 순찰 완화"
 PER_relax_religious_laws_desc: "어쩌면 우리의 종교 단속 관행은 다소 비인도적일지도 모릅니다... 보다 느슨한 방식으로 진행하는 것이 나을 수 있습니다."
 PER_ansar_hezbollah: "안사르 헤즈볼라"
 iranian_focus.198.t: "인터넷 사용 급증"
 iranian_focus.198.d: "청년층 사이에서 인터넷 사용이 많은 도시 지역에서 널리 퍼지기 시작하면서 일부 원칙주의 파벌들 사이에서 우려가 일고 있습니다. 개혁파 진영에서는 인터넷과 새로운 디지털 시대의 성장을 촉진해야 한다는 요구가 커지고 있는 반면, 원칙주의자들은 더 강한 규제를 요구하고 있습니다."
 iranian_focus.198.a: "디지털 시대가 도래했다"
 iranian_focus.198.b: "우리 청년들은 산업 같은 더 시급한 일에 몰두해야 한다!"
 iranian_focus.199.t: "문화부에 대한 공격"
 iranian_focus.199.d: "문화부는 자유주의 단체들로부터 거센 공격을 받고 있으며, 국제 단체들은 정부를 비판하는 여러 영화에 대한 검열을 규탄했습니다. 문화부 대변인은 영화가 국가의 정치 문제에 거의 또는 전혀 관여해서는 안 된다고 밝혔습니다. 많은 이들이 향후 유사한 사례의 선례가 될 수 있는 이 문제에 대한 국가 수뇌부의 공식 입장을 기다리고 있습니다."
 iranian_focus.199.a: "예술가는 원하는 대로 할 자유가 있다"
 iranian_focus.199.b: "그의 말에도 일리가 있다. 입을 막아라!"
 iranian_focus.200.t: "HIV/AIDS 확산"
 iranian_focus.200.d: "전염병이 점점 확산되고 있습니다. AIDS와 HIV가 전국에서 소리 없이 더 많은 사람을 감염시키고 있으며, 전국 곳곳의 종교 인사들은 그 책임을 '부도덕한 행위'에 돌리고 있습니다. 이들은 개인이 언제 어떻게 감염되었는지 조사하기 위해 의료 체계에 급진적인 변화를 주자는 제안까지 하고 있습니다."
 iranian_focus.200.a: "의료 발전에 집중한다"
 iranian_focus.200.b: "이 부도덕한 행위를 중단시켜라!"
 iranian_focus.201.t: "'일탈 조류'의 부상"
 iranian_focus.201.d: "'일탈 조류'라 불리는 운동이 특히 종교 민족주의자들 사이에서 힘을 얻고 있습니다. 마무드 아마디네자드의 정치적 사상에 의해 지지받고 영감을 받으며 에스판디야르 마샤이가 이끄는 이 운동은 종교 엘리트를 배척하고 삶의 방식을 이란식 이슬람 학파로 대체하려 합니다."
 iranian_focus.201.a: "흥미롭군"
 PER_us_war: "미국-이란 분쟁"
 PER_us_war_desc: "수십 년간의 긴장이 마침내 정점에 이르렀습니다. 누가 승리할 것인가?"
 PER_american_iranian_war: "호르무즈 전쟁"
 PER_american_iranian_war_desc: "'인간이 일찍이 본 적 없는 전투였도다. 대지는 강철로 뒤덮였고, 화살은 구름에서 우박처럼 쏟아졌으며, 땅은 말발굽에 찢겼고, 피는 평원 위에 물처럼 흘렀도다'\n - 피르다우시"
 PER_complete_milad_tower: "밀라드 타워 건설 완공"
 PER_complete_milad_tower_desc: "혁명 이전 시대에 처음 계획이 구체화된 밀라드 타워는 우리의 현대화 노력의 증거이자 국내 번영의 과시입니다. 수십 년의 지연 끝에 밀라드 타워를 완공하면 우리나라가 전력을 다해 21세기를 선도하고 있음을 국민에게 보여줄 것입니다."
 expose_iranian_nuclear_program: "이란 핵 프로그램 폭로"
 expose_iranian_nuclear_program_desc: "우리 정보 당국은 이란이 모종의 핵무기 비축고를 생산하고 있다고 보고합니다... 아마도 세계에 이를 알려야 할지도 모릅니다...?"
 SAZ_independence_war: "독립 전쟁"
 SAZ_independence_war_desc: "수십 년간의 페르시아 중심 정치는 우리의 명예로운 민족을 멸종의 벼랑 끝으로 몰아넣었습니다. 이제 무기를 들고, 필요하다면 무력으로라도 오래도록 마땅했던 독립을 쟁취할 때입니다."
 PER_western_satan: "서방의 악마들"
 PER_eastern_satan: "동방의 악마들"
 PER_nextdoor_satan: "이웃의 악마들"
 PER_the_supplier_of_martyrs: "순교자 공급자"
 PER_the_supplier_of_martyrs_desc: "이제 드론을 더 많이 제작하여 마침내 알라께 수십 명씩 순교자를 바칠 때입니다."
 iranian_events.2281.t: "이란의 혼란"
 iranian_events.2281.d: "이란 국가는 완전한 무질서와 혼란에 빠졌으며, 군대는 호라산의 IRGC 반군에게 허를 찔렸습니다. 이 혼란에 대응하여 여러 아제르바이잔 분리주의 단체가 결성되기 시작했으며, 이란 내에서 더 큰 자치를 확립하기를 희망하고 있다는 믿을 만한 보고를 받았습니다. 그러나 우리가 취할 수 있는 여러 선택지에 대해 보고를 받았으며, 그중 하나는 이란령 아제르바이잔에 보호령을 수립하는 것입니다. 고문들은 이것이 역효과를 낳을 수 있다고 경고했으나, 지금으로서는 모든 선택지가 열려 있습니다."
 iranian_events.2281.a: "진입하라, 아제르바이잔 민족을 해방해야 한다!"
 iranian_events.2281.b: "성급하게 움직이지 말자"
 PER_attack_saz: "[SAZ.GetFlag] 남아제르바이잔 탈환"
 PER_attack_saz_desc: "대가가 얼마가 되든 진격하여 남아제르바이잔을 탈환할 때가 왔습니다!"
 iranian_events.302.t: "시위를 불법으로 선언한 하메네이"
 iranian_events.302.d: "오늘 일찍 하메네이는 최근의 시위 물결과 관련하여 국민을 상대로 연설을 했습니다. 연설에서 그는 거리 시위에 참여하는 모든 이들을 '시온주의 정권'과 '미국 제국'의 협력자로 규정하겠다고 선언하며, 체포된 이들에 대한 처벌이 신속하고 가혹할 것이라고 밝혔습니다. 이미 아야톨라 마흐무드 하셰미 샤흐루디의 명령에 따라 여러 건의 사형 집행이 예정되었습니다. 이러한 경고에도 불구하고 사람들은 변화를 요구하며 계속 거리로 나오고 있습니다."
 iranian_events.302.a: "우려스럽다"
 iranian_events.303.t: "가혹한 대응을 다짐한 솔레이마니"
 iranian_events.303.d: "이란 쿠드스군 사령관이자 시위 진압 임무를 맡은 카셈 솔레이마니는 공공 평화를 어지럽히는 자들에게 자신의 병력이 무력 사용을 주저하지 않을 것이라고 공개적으로 밝혔습니다. 연설에서 그는 폭력에 가담하는 이들을 이란 영토를 침범한 외적처럼 취급하겠다고도 말했습니다. 그의 연설은 아프가니스탄과 파키스탄 출신의 비이란계 민병대가 거리 시위 진압에 모습을 드러낸 시점과 맞물려 있습니다."
 iranian_events.303.a: "우려스럽다"
 iranian_events.304.t: "커지는 군주제 정서"
 iranian_events.304.d: "최근 며칠간 시위에 참여한 여러 사람이 이슬람 공화국이 들어서기 전에 게양되었던 것과 같은 옛 사자와 태양 깃발을 흔드는 모습이 목격되었습니다. 이와 함께 많은 이들이 군주제를 지지하는 구호를 외치며 레자 팔라비 왕세자의 귀환을 촉구했습니다. 그럼에도 이란의 많은 이들은 군주제의 전면 복원에 여전히 회의적이며, 입헌군주제나 아예 공화정을 선호하는 이들도 많습니다."
 iranian_events.304.a: "흥미롭군"
 iranian_events.305.t: "명령을 거부한 아르테시"
 iranian_events.305.d: "아르테시의 여러 부대가 시위대에 대한 치명적 무력 사용 명령을 거부했으며, 지휘관들은 이 명령이 불법이며 이란 국민을 보호하겠다는 자신들의 서약에 대한 위반이라고 선언했습니다. 일부 고위 지휘관들은 정부에 대한 지지를 표명했으나, 시위대 진압에 협력할지 여부는 아직 공개적으로 밝히지 않았습니다."
 iranian_events.305.a: "우려스럽다"
 iranian_events.306.t: "폭력의 온상이 된 대학들"
 iranian_events.306.d: "테헤란 대학을 비롯한 전국 여러 대학이 학생들 사이의 폭력의 온상이 되었으며, 친정권 학생들과 반정부 학생들이 잦은 충돌을 빚고 있습니다. 이로 인해 전국의 많은 대학이 일시적으로 문을 닫았으며, 충돌을 조사하여 폭력에 가담한 학생들을 퇴학시키거나 정학시키는 조치를 취하고 있습니다."
 iranian_events.306.a: "우려스럽다"
 iranian_events.307.t: "동력을 얻지 못한 맞불 시위"
 iranian_events.307.d: "테헤란 중앙 광장에서 열린 정부 주도의 여러 시위는 수천 명만이 참석하는 데 그쳐 동력을 얻지 못했습니다. 이는 거의 매일 거리를 가득 메우는 현재의 반정권 시위대에 맞서기 위해 정부가 정권 지지자들을 동원하느라 허둥댄 가운데 벌어진 일입니다. 이렇게 적은 참석자는 정권에 대한 인기가 점점 떨어지고 국민들 사이에서 정통성이 결여되고 있음을 보여 줍니다."
 iranian_events.307.a: "우려스럽다"
 iranian_events.308.t: "우려를 표명한 이웃 국가들"
 iranian_events.308.d: "튀르키예, 사우디아라비아, 파키스탄 등 여러 인접국이 우리나라의 불안정한 상황에 우려를 표명했습니다. 이러한 우려는 특정 집단을 보호하겠다는 공언으로까지 번졌으며, 튀르키예는 남아제르바이잔 주민들이 '스스로의 미래를 결정'하기로 할 경우 이들을 보호하기 위해 개입할 준비가 되어 있다고 선언했습니다. 이러한 발언으로 우리 정부는 불안해하기 시작했으며, 일부 각료들 사이에서는 외세 개입에 대한 우려가 커지고 있습니다."
 iranian_events.308.a: "우려스럽다"
 iranian_events.309.t: "번번이 압도당하는 바시즈 병력"
 iranian_events.309.d: "최근 보고서에 따르면 바시즈 병력이 반체제 시위대에게 계속해서 압도당하고 있으며, 작전 중 다수가 목숨을 잃었습니다. 사망자를 위한 국가 후원 공개 장례식이 거의 매일 열리고 있으나, 참석하는 정부 지지자는 소수에 불과합니다. 그럼에도 병력이 분노한 군중에게 압도당하고 공격받는 추세는 계속되고 있으며, 정부는 이 문제를 해결할 계획이 거의 전무한 실정입니다."
 iranian_events.309.a: "우려스럽다"
 iranian_events.310.t: "몬타제리 아래 결집한 개혁파"
 iranian_events.310.d: "여러 개혁파 정치인과 인사들이 정부로부터의 이탈을 공개적으로 선언했으며, 개혁파 성직자인 몬타제리 아야톨라를 지지한다고 밝혔습니다. 이러한 움직임은 호메이니에 의해 몬타제리 대신 후계자로 지명된 하메네이에게 추가적인 압박을 가하고 있습니다. IRGC 병력에게는 하타미 대통령을 포함한 여러 개혁파 정치인을 체포하라는 명령이 내려졌으나, 이들의 소재는 현재 알려져 있지 않습니다."
 iranian_events.310.a: "우려스럽다"
 iranian_events.311.t: "대규모 탄압을 공언한 IRGC"
 iranian_events.311.d: "IRGC와 바시즈 병력에 대한 폭력이 커지자, 거셈 솔레이마니는 공개적으로 나서 오후 4시 이후 외출하는 자는 누구든 사격하겠다고 선언했습니다. 이는 전국적인 인터넷 차단에 뒤이은 것으로, 은행 같은 여러 필수 서비스가 마비되어 취약한 경제에 더욱 큰 압박을 주고 있습니다. 이번 탄압이 오히려 정부에 대한 증오를 더욱 키울 수 있다는 우려가 있으며, 이는 권력을 유지하는 데에도 무력에 대한 과도한 의존이 필요하다는 점을 보여줍니다."
 iranian_events.311.a: "우려스럽다"
 iranian_events.312.t: "피의 수요일"
 iranian_events.312.d: "지난 며칠 사이 하메네이가 '어떤 수단을 써서라도 시위를 진압하라'고 내린 명령에 따라 수천 명의 시위대가 사망한 것으로 확인된 사건이 발생했습니다. 이 사건은 '피의 수요일'이라고 불리고 있으며, 시위대와 해외 사람들 사이에서 분노가 커지고 있습니다. 정확한 사망자 수는 아직 알려져 있지 않으나, 희생자 규모가 너무나 커서 병원과 영안실이 사망자와 부상자로 넘쳐나고 있는 것으로 확인되었습니다."
 iranian_events.312.a: "이 나라가 어떻게 이 지경이 되었는가?"
 PER_khargh_lost: "하르그 - 접근 불가"
 PER_khargh_lost_desc: "핵심 섬인 하르그가 적군에 점령되었거나 상실된 것으로 보이며, 그 결과 우리의 화석 연료 부문이 타격을 받고 있습니다."
 PER_khargh_lifeline: "하르그 섬 의존"
 PER_khargh_lifeline_desc: "우리 국가의 생명줄은 하나의 동맥을 통해 흐릅니다. 이것이 끊어진다면 그 결과는 참담할 것입니다.\n§W--------------§!\n§H하르그§!가 적군에 점령되거나 기반 시설이 피해를 입으면, 우리의 에너지 부문은 §R초토화§!됩니다.\n§W--------------§!\n이 변동치는 §H제3차 개발 계획§! 중점 분기에서 6개 초과의 중점을 완료하면 아무런 불이익 없이 §R제거§!됩니다. §H개방 시장 수용§! 분기를 완료하면 이 국가 정신을 제거할 수 §R없습니다§!."
 PER_hormuz_blocked_gang: "호르무즈 봉쇄"
 PER_hormuz_blocked_gang_desc: "이란 지도부는 호르무즈 해협을 봉쇄하기로 결정하여 세계 경제에 혼란을 일으키고 있습니다."
 iranian_events.910.t: "호르무즈 해협을 봉쇄한 이란"
 iranian_events.910.d: "이란은 매일 세계 석유 공급량의 상당 부분이 지나는 좁은 수로인 호르무즈 해협을 봉쇄하는 전례 없는 조치를 취했습니다. 해안 미사일 포대와 고속 공격정의 지원을 받는 이란 해군은 상선 통행을 차단하고 해협을 출입 금지 구역으로 선언하기 위해 움직였습니다. 유조선들은 회항하고 있고 일부는 걸프 항구에 발이 묶여 있으며, 이는 세계 에너지 시장에 충격파를 보내고 더 광범위한 대립에 대한 우려를 키우고 있습니다. 세계에서 가장 중요한 해상 길목 중 하나를 위협함으로써 테헤란은 적대 세력들을 압박하고 세계 무역을 교란할 수 있는 능력을 과시하려 하지만, 이 조치는 항행의 자유를 회복하려는 국제 사회의 단호한 대응을 불러올 위험이 있습니다."
 iranian_events.910.a: "끔찍한 사태다"
 iranian_events.911.t: "호르무즈 해협을 다시 개방한 이란"
 iranian_events.911.d: "갑작스러운 상황 전환 속에서 이란 수뇌부는 세계에서 가장 중요한 해협을 막는 것이 더 이상 필요하지 않다고 결정했으며, 이에 따라 상선 통행을 위해 해협을 다시 열기 시작했습니다. 이란은 '세계의 항행과 무역이 보호되도록 계속 노력할 것'이라고 밝혔으며, 동맹국과 파트너 모두에게 가까운 장래에 해협을 봉쇄할 의도가 없음을 재확인했습니다. 그러나 [PER.capital.GetCapitalVictoryPointName]의 반대자들은 이란을 신뢰할 수 없으며 이란이 해협을 다시 봉쇄하는 것은 시간문제일 뿐이라고 주장합니다."
 iranian_events.911.a: "세계가 다시 숨을 쉴 수 있게 되었다"
 PER_kharg_tt: "£text_icon_kaldanger 이 중점을 완료하면 §H하르그 섬 종속§! 국가 정신을 영구적으로 유지하게 됩니다!"
 PER_control_musandam_for_full_effect_TT: "우리가 무산담을 통제하지 못하므로 해협을 완전히 통제할 수 없습니다\n - 그 결과 우리의 봉쇄는 완전한 효과를 발휘하지 못합니다\n - 무산담을 통제하게 되면 효과가 두 배가 됩니다!"
 PER_reopen_hormuz: "호르무즈 재개방"
 PER_reopen_hormuz_desc: "마침내 호르무즈 해협을 다시 개방할 때입니다. 세계가 교훈을 얻었기를 바랍니다."
 PER_block_hormuz: "호르무즈 해협 봉쇄"
 PER_block_hormuz_desc: "전시 기획자들과 고위 장성들은 세계의 석유 공급을 옥죄어야만 승리를 거둘 수 있다고 주장하며 호르무즈 해협의 완전한 폐쇄를 요구하고 있습니다."
 hormuz_blocked_tt: "이란의 호르무즈 봉쇄"
 hormuz_blocked_tt_NOT: "이란의 호르무즈 봉쇄"
 iranian_flavor.1.t: "테헤란 국제 도서전"
 iranian_flavor.1.d: "테헤란 국제 도서전은 수십 개국의 출판사를 끌어들이며 중동 최대 규모의 문학 행사 중 하나로 성장하였습니다. 이 도서전은 우리의 문화유산을 선보이고 문해력을 증진할 기회이지만, 확대하려면 정부 자금이 필요합니다. 일부 관리들은 이 투자가 소프트 파워와 교육 면에서 배당금을 안겨줄 것이라고 주장하는 반면, 다른 이들은 출판사가 비용을 직접 부담해야 한다고 생각합니다."
 iranian_flavor.1.a: "확대에 자금을 지원한다"
 iranian_flavor.1.b: "출판사가 알아서 하도록 둔다"
 iranian_flavor.2.t: "테헤란 지하철 1호선 개통"
 iranian_flavor.2.d: "수년간의 공사 지연과 예산 초과 끝에 테헤란 지하철 1호선이 마침내 대중에게 개통되었습니다. 테헤란 북부와 남부를 잇는 28킬로미터의 노선은 악명 높은 수도의 교통 체증을 완화할 것으로 기대됩니다. 도시 계획가들은 이미 추가 노선에 대한 제안서를 작성하고 있으나, 추가 확장 비용은 여전히 논란거리로 남아 있습니다."
 iranian_flavor.2.a: "지하철 추가 확장에 자금을 지원한다"
 iranian_flavor.2.b: "이 이정표를 기념한다"
 iranian_flavor.3.t: "차바하르 항 개발"
 iranian_flavor.3.d: "기술자들이 오만만에 있는 차바하르 항의 개발을 위한 야심 찬 계획을 제출하였습니다. 호르무즈 해협 바깥에 위치한 이 항구는 혼잡한 페르시아만 해운 항로를 우회하는 무역의 전략적 대안을 제공합니다. 대규모 투자는 이 항구를 지역 무역 중심지로 탈바꿈시킬 수 있으며, 보다 신중한 접근은 향후 수년에 걸쳐 점진적인 개선을 이룰 것입니다."
 iranian_flavor.3.a: "차바하르에 대대적으로 투자한다"
 iranian_flavor.3.b: "점진적으로 개발한다"
 iranian_flavor.4.t: "테헤란 증권거래소 랠리"
 iranian_flavor.4.d: "테헤란 증권거래소는 TEPIX 지수가 사상 최고치로 치솟으며 놀라운 랠리를 경험하였습니다. 처음 투자하는 이들이 많은 국내 투자자들이 시장에 저축을 쏟아붓고 있습니다. 정부는 추가적인 경제 성장을 이끌 수 있는 이 열기를 장려할 것인지, 아니면 투기 거품을 막기 위해 규제를 도입할 것인지 선택해야 합니다."
 iranian_flavor.4.a: "추가 투자를 장려한다"
 iranian_flavor.4.b: "거품을 막기 위해 규제한다"
 iranian_flavor.5.t: "페르시아만 명칭 분쟁"
 iranian_flavor.5.d: "여러 아랍 국가와 국제기구가 역사적으로 확립된 '페르시아만' 대신 '아라비아만'이라는 용어를 사용하기 시작하였습니다. 이 문제는 이 명칭을 국가 정체성과 분리할 수 없다고 여기는 대중과 지식인 모두의 분노를 불러일으켰습니다. 역사적인 명칭을 재확인하기 위한 문화 보존 캠페인을 벌이거나, 공식적인 외교 항의를 하거나, 도발을 무시하는 방법을 택할 수 있습니다."
 iranian_flavor.5.a: "문화 캠페인을 벌인다"
 iranian_flavor.5.b: "외교적 항의를 제기한다"
 iranian_flavor.5.c: "도발을 무시한다"
 iranian_flavor.6.t: "새로운 석유 매장량 발견"
 iranian_flavor.6.d: "쿠제스탄 주의 지질 조사에서 자그로스 산기슭 아래에 상당한 규모의 새로운 석유 매장량이 발견된 것이 확인되었습니다. 이란 국영 석유 회사는 이번 발견으로 확인 매장량에 수십억 배럴이 추가될 수 있을 것으로 추산합니다. 이제 수익을 즉시 늘리기 위해 채굴을 서두를 것인지, 유전의 장기적 지속 가능성을 보장하기 위해 신중하게 접근할 것인지가 문제입니다."
 iranian_flavor.6.a: "채굴을 서두른다"
 iranian_flavor.6.b: "신중하게 접근한다"
 iranian_flavor.7.t: "사우스 파르스 가스전 확장"
 iranian_flavor.7.d: "카타르와 공유하는 세계 최대의 천연가스 매장지인 사우스 파르스 가스전 개발이 중대한 결정의 기로에 이르렀습니다. 기술자들은 다음 개발 단계에서 수입 연료 의존도를 줄이며 국내 에너지 수요 공급을 우선시할 수도 있고, 이웃 시장에 가스를 파이프라인으로 보내 수익을 올리기 위한 수출 기반시설 구축에 집중할 수도 있다고 보고합니다."
 iranian_flavor.7.a: "국내 공급을 우선시한다"
 iranian_flavor.7.b: "가스 수출을 극대화한다"
 iranian_flavor.8.t: "가속화되는 두뇌 유출"
 iranian_flavor.8.d: "국제통화기금의 새 보고서는 우리나라를 두뇌 유출이 세계에서 가장 심각한 국가 중 하나로 꼽았으며, 매년 약 15만 명의 고학력 전문가가 이민을 떠나는 것으로 추산하였습니다. 대학은 공학, 의학, 과학 분야에서 세계적 수준의 졸업생을 배출하고 있으나, 이들이 해외의 기회를 찾아 떠나는 것을 지켜볼 뿐입니다. 인재를 붙잡기 위해 연구 보조금과 근무 여건 개선에 투자할 수도 있고, 현실을 받아들여 자원을 다른 곳으로 돌릴 수도 있습니다."
 iranian_flavor.8.a: "연구 장려책을 마련한다"
 iranian_flavor.8.b: "현실을 받아들인다"
 iranian_flavor.9.t: "카펫 수출의 르네상스"
 iranian_flavor.9.d: "우리의 가장 상징적인 문화 수출품 중 하나인 페르시아 카펫에 대한 국제적 수요가 급증하였습니다. 이스파한, 타브리즈, 케르만의 장인들은 주문이 가득 찼다고 보고하고 있으며, 수제 러그에 대한 전 세계의 수요는 끝이 없어 보입니다. 정부는 전통 공예를 지원하기 위해 교육 프로그램과 작업장에 투자하거나, 시장이 산업의 방향을 결정하도록 맡길 수 있습니다."
 iranian_flavor.9.a: "전통 공예에 투자한다"
 iranian_flavor.9.b: "시장이 결정하도록 둔다"
 iranian_flavor.10.t: "키시 섬 무역 지구 확장"
 iranian_flavor.10.d: "페르시아만에서 우리의 대표적인 자유 무역 지구인 키시 섬은 외국 투자자와 관광객의 관심이 높아지고 있습니다. 지방 당국은 새 호텔, 쇼핑 단지, 더 큰 항만 시설을 포함한 지구의 상업 기반시설을 대폭 확장할 것을 제안하고 있습니다. 확장에는 상당한 비용이 들겠지만 키시를 지역 비즈니스에서 두바이의 경쟁 상대로 자리매김하게 할 수 있습니다."
 iranian_flavor.10.a: "자유 무역 지구를 확장한다"
 iranian_flavor.10.b: "현재 규모를 유지한다"
 iranian_flavor.11.t: "이란 호드로, 생산 이정표 달성"
 iranian_flavor.11.d: "우리의 최대 자동차 제조사이자 중동에서 가장 큰 업체 중 하나인 이란 호드로는 올해 조립 라인에서 100만 번째 차량을 생산하며 중요한 생산 이정표에 도달하였습니다. 이 회사의 경영진은 다음 성장 단계를 위한 정부의 지원을 구하고 있습니다. 그들은 차량 품질과 연료 효율을 개선하기 위한 연구 개발에 투자하거나, 단순히 기존 생산 라인을 확장해 생산량을 늘리는 방안을 제안합니다."
 iranian_flavor.11.a: "연구 개발에 투자한다"
 iranian_flavor.11.b: "생산 라인을 확장한다"
 iranian_flavor.12.t: "이스파한 제철소 확장"
 iranian_flavor.12.d: "중동 최대의 철강 생산업체인 이스파한의 모바라케 철강 회사는 산업부에 확장 계획을 제출하였습니다. 이 회사는 효율을 높여줄, 해외에서 수입한 새 전기 아크로로 기존 시설을 현대화하거나, 국산 기술을 사용해 원료 생산 능력을 확장하여 총생산량을 늘리는 방안을 제안합니다."
 iranian_flavor.12.a: "새 용광로로 현대화한다"
 iranian_flavor.12.b: "국내에서 생산 능력을 확장한다"
 iranian_flavor.13.t: "테헤란에서 밀라드 타워 개장"
 iranian_flavor.13.d: "국내에서 가장 높은 구조물이자 세계에서 여섯 번째로 높은 통신탑인 밀라드 타워가 대중에게 문을 열었습니다. 테헤란 북부에 435미터 높이로 서 있는 이 타워에는 전망대, 회전 레스토랑, 방대한 통신 장비가 갖춰져 있습니다. 관리들은 주변 지역을 관광 거점으로 개발할 것인지, 아니면 이 타워를 주로 국가 방송 센터로 활용할 것인지를 두고 논의하고 있습니다."
 iranian_flavor.13.a: "관광 기반시설을 개발한다"
 iranian_flavor.13.b: "방송 거점으로 활용한다"
 iranian_flavor.14.t: "기록적인 사프란 수확"
 iranian_flavor.14.d: "올해 사프란 수확량은 라자비호라산 주와 남호라산 주에서 200톤이 넘는 귀중한 향신료를 생산하며 지금까지의 모든 기록을 갈아치웠습니다. 전 세계 생산량의 90% 이상을 차지하는 세계 최대의 사프란 생산국으로서, 우리는 이 풍작을 활용하기에 독보적인 위치에 있습니다. 농업 관리들은 새로운 지역으로 재배를 확대하거나, 이 고급 상품의 수출 가치를 극대화하는 데 집중할 것을 제안합니다."
 iranian_flavor.14.a: "사프란 재배를 확대한다"
 iranian_flavor.14.b: "고급 수출에 집중한다"
 iranian_flavor.15.t: "테헤란 대기오염 비상사태"
 iranian_flavor.15.d: "위험한 수준의 대기오염으로 테헤란 전역의 학교와 관공서가 폐쇄되었습니다. 대기질 지수는 위험 수준에 이르렀으며 초미세먼지가 안전 기준을 열 배나 초과하였습니다. 병원들은 호흡기 질환 입원 환자가 급증했다고 보고하고 있습니다. 관리들은 경제에 영향을 주게 될 공장 가동 중단과 차량 사용 제한을 택할 것인지, 아니면 산업을 계속 가동하면서 보건 권고만 발령할 것인지를 결정해야 합니다."
 iranian_flavor.15.a: "공장을 일시적으로 중단한다"
 iranian_flavor.15.b: "보건 권고만 발령한다"
 iranian_flavor.16.t: "리얄화 변동성"
 iranian_flavor.16.d: "이란 리얄은 공개 시장에서 극심한 변동을 겪으며 주요 외화 대비 상당한 가치를 잃었습니다. 일반 시민들은 저축을 달러와 금으로 바꾸려 서두르고 있으며, 기업들은 예측할 수 없는 수입 비용에 고심하고 있습니다. 중앙은행은 외화 보유고를 투입해 환율을 안정시키는 개입을 하거나, 시장이 스스로 균형점을 찾도록 놔둘 수 있습니다."
 iranian_flavor.16.a: "리얄을 안정시키기 위해 개입한다"
 iranian_flavor.16.b: "시장이 스스로 바로잡도록 둔다"
 iranian_flavor.17.t: "페르시아만 스타 정유소"
 iranian_flavor.17.d: "반다르아바스에서 세계 최대의 가스 응축액 정유소가 될 페르시아만 스타 정유소의 건설이 시작되었습니다. 완공되면 이 정유소는 사우스 파르스 가스전에서 나오는 응축액을 처리하여 수입 휘발유에 대한 의존도를 줄일 것입니다. 이 사업은 추가 자금을 투입하여 더 일찍 완공을 서두르거나, 재정 부담을 최소화하기 위해 표준 일정으로 진행할 수 있습니다."
 iranian_flavor.17.a: "건설을 서두른다"
 iranian_flavor.17.b: "표준 건설 일정"
 iranian_flavor.18.t: "이스파한 물 부족 위기"
 iranian_flavor.18.d: "이스파한 주의 생명줄이자 가장 중요한 강 중 하나인 자얀데 루드가 3년 연속 말라붙었습니다. 하류의 농민들은 논밭을 포기하고 있으며, 상징적인 시오세폴 다리는 이제 갈라진 땅만을 가로지를 뿐입니다. 물 부족 위기는 즉각적인 조치를 요구합니다. 인접 주에서 긴급 물 이송을 승인하거나, 엄격한 배급제를 시행하거나, 장기 공급을 확보하기 위해 새 댐 건설 사업을 의뢰할 수 있습니다."
 iranian_flavor.18.a: "긴급 물 이송"
 iranian_flavor.18.b: "물 배급제를 시행한다"
 iranian_flavor.18.c: "새 댐을 의뢰한다"
 iranian_flavor.19.t: "관광객 급증"
 iranian_flavor.19.d: "이스파한, 시라즈, 페르세폴리스에 있는 유네스코 세계유산에 이끌린 외국인 관광객 수가 급격히 늘어났습니다. 주요 도시의 호텔들은 거의 만실이라고 보고하고 있으며, 여행사들은 수요를 따라가기에 급급합니다. 문화유산부는 접객 기반시설을 개선하기 위한 자금을 요청하고 있으나, 일부 관리들은 추가 지출 없이 뜻밖의 수익을 거두기만 하면 된다고 주장합니다."
 iranian_flavor.19.a: "접객 시설에 투자한다"
 iranian_flavor.19.b: "수익을 활용한다"
 iranian_flavor.20.t: "쿠제스탄 홍수"
 iranian_flavor.20.d: "전례 없는 강우로 쿠제스탄 주 전역에 막대한 홍수가 발생하여 수백 개의 마을이 침수되고 수만 가구가 터전을 잃었습니다. 홍수는 석유 기반시설에 피해를 입히고 농업을 마비시켰으며 지방 응급 서비스를 압도하였습니다. 군대를 투입한 신속한 구호 작전, 국고 자금을 투입한 민간 주도의 재난 대응, 또는 국제기구에 인도적 지원 요청 가운데 어떻게 대응할지 결정해야 합니다."
 iranian_flavor.20.a: "군대를 투입한다"
 iranian_flavor.20.b: "민간 재난 대응"
 iranian_flavor.20.c: "국제 원조를 요청한다"
 iranian_flavor.50.t: "IRGC 장교 귀순"
 iranian_flavor.50.d: "중급 IRGC 장교 한 무리가 어둠을 틈타 전선을 넘어와 우리 편으로 귀순하고 싶다고 주장하고 있습니다. 그들은 IRGC 지도부에 환멸을 느꼈으며 자유로운 이란을 위해 싸우고 싶다고 말합니다. IRGC의 전술과 위치에 대한 그들의 지식은 귀중할 수 있으나, 일부가 우리 작전에 대한 정보를 수집하기 위해 보낸 첩자일 위험은 언제나 존재합니다."
 iranian_flavor.50.a: "우리 대열에 환영한다"
 iranian_flavor.50.b: "먼저 신중하게 심사한다"
 iranian_flavor.50.c: "돌려보낸다"
 iranian_flavor.51.t: "위협받는 유전"
 iranian_flavor.51.d: "IRGC 병력이 남부의 주요 석유 생산 시설에 위험할 정도로 가깝게 진격하고 있습니다. 이 유전들을 점령당하면 우리 전시 경제에 치명적인 타격을 입고 적에게 막대한 수입원을 넘겨주게 됩니다. 우리 지휘관들은 석유 기반시설 주위에 방어선을 구축할 증원군을 요청하고 있으나, 전선에서 병력을 빼내는 데에도 위험이 따릅니다."
 iranian_flavor.51.a: "유전을 지키기 위해 병력을 돌린다"
 iranian_flavor.51.b: "전선에 집중한다"
 iranian_flavor.52.t: "IRGC 선전 방송"
 iranian_flavor.52.d: "IRGC는 여러 라디오 주파수와 소셜 미디어 플랫폼을 통해 병사들에게 무기를 내려놓고 민간인들에게 정부에 저항하라고 촉구하는 선전 메시지를 방송하기 시작하였습니다. 방송에는 종교 설교, 탈영병에 대한 사면 약속, 외세가 분쟁을 조종하고 있다는 주장이 담겨 있습니다. 일부 국경 지역 공동체는 이러한 메시지에 흔들리고 있는 것으로 알려졌습니다."
 iranian_flavor.52.a: "그들의 주파수를 교란한다"
 iranian_flavor.52.b: "무시한다"
 iranian_flavor.53.t: "아군 후방의 바시즈 활동"
 iranian_flavor.53.d: "후방 지역 지휘관들로부터 아군 후방에서 활동하는 바시즈 민병대 조직에 대한 보고가 쏟아지고 있습니다. IRGC에 충성하는 이 준군사 요원들은 보급 창고를 파괴하고 호송대를 매복 공격하며 지방 관리들을 위협해 왔습니다. 이들의 분산된 구조는 뿌리 뽑기 어렵게 만들며, 이들은 민간인 사이에 완벽히 섞여 듭니다."
 iranian_flavor.53.a: "대반란 소탕 작전을 개시한다"
 iranian_flavor.53.b: "지역 민간 방위 단체를 무장시킨다"
 iranian_flavor.54.t: "민간인 대탈출"
 iranian_flavor.54.d: "수만 명의 민간인이 전선 지역에서 피란하여 도로를 메우고 후방 도시들을 압도하고 있습니다. 가족 전체가 등에 질 수 있는 얼마 안 되는 짐을 지고 총격전을 피해 안전을 찾고 있습니다. 난민 위기는 우리 자원을 압박하고 군 병참을 지연시키고 있습니다. 일부 관리들은 조직적인 수용소를 설치할 것을 제안하는 반면, 다른 이들은 터전을 잃은 인구를 전시 노동력 보강에 돌릴 수 있다고 주장합니다."
 iranian_flavor.54.a: "난민 수용소를 설치한다"
 iranian_flavor.54.b: "난민을 전시 생산으로 돌린다"
 iranian_flavor.55.t: "무기 밀수 조직망"
 iranian_flavor.55.d: "내전의 혼란은 국경을 따라 활동하는 광범위한 무기 밀수 조직망을 낳았습니다. 무기는 여러 방향에서 유입되고 있으며 일부는 IRGC 병력의 손에 들어가고 일부는 암시장에서 구할 수 있습니다. 우리 정보 기관은 바로 이 조직망을 이용해 우리가 절실히 필요한 장비를 확보할 수 있다고 보고하지만, 밀수를 묵인하면 적을 강화할 수도 있습니다."
 iranian_flavor.55.a: "조직망을 우리를 위해 활용한다"
 iranian_flavor.55.b: "모든 밀수를 단속한다"
 iranian_flavor.56.t: "테헤란 상공의 긴급 발진"
 iranian_flavor.56.d: "IRGC 항공기가 테헤란 영공에 접근하는 것이 탐지되었습니다. 우리 공군은 위협에 대응하기 위해 요격기를 긴급 발진시켰고, 수도 상공에서 긴장된 공중전이 벌어지고 있습니다. 이번 교전의 결과는 중부 전역의 제공권에 상당한 영향을 미칠 것입니다. 사령부는 수도를 방어하기 위해 추가 비행대를 투입할 것인지, 아니면 전선의 지상 작전을 지원하도록 항공 전력을 돌릴 것인지 알고 싶어 합니다."
 iranian_flavor.56.a: "수도의 하늘을 방어한다"
 iranian_flavor.56.b: "지상 지원을 우선한다"
 iranian_flavor.57.t: "헤즈볼라 고문단 포착"
 iranian_flavor.57.d: "헤즈볼라가 IRGC를 지원하기 위해 경험 많은 군사 고문과 전투 베테랑을 파견했음이 정보 보고로 확인되었습니다. 이 전투원들은 레바논과 시리아에서의 수년간의 전투 경험을 지니고 있으며, 시가전과 게릴라 전술에 대한 그들의 전문성은 이미 일부 전선 구역에서 체감되고 있습니다. 우리 외교단은 공개적인 규탄을 촉구하고 있고, 야전 지휘관들은 그들의 보급로를 표적으로 삼기를 원합니다."
 iranian_flavor.57.a: "헤즈볼라를 공개적으로 규탄한다"
 iranian_flavor.57.b: "그들의 보급선을 공격한다"
 iranian_flavor.58.t: "국제 언론 보도"
 iranian_flavor.58.d: "내전은 국제 언론의 강한 주목을 받고 있습니다. 외국 기자들과 촬영 팀이 전선과 난민 수용소에 대한 접근을 요청하고 있습니다. 접근을 허용하면 우리의 대의에 대한 국제적 지지를 쌓는 우호적인 보도를 이끌어낼 수 있으나, 작전 세부 사항이 노출될 위험이 있고 우리 내정에 대한 원치 않는 외세의 간섭을 불러올 수도 있습니다."
 iranian_flavor.58.a: "기자들의 접근을 허용한다"
 iranian_flavor.58.b: "언론 접근을 제한한다"
 iranian_flavor.59.t: "파괴 공작을 당한 전력망"
 iranian_flavor.59.d: "조직적인 파괴 공작으로 국가 전력망의 주요 구간이 마비되어 여러 주가 어둠에 잠겼습니다. IRGC와 연계된 요원들이 고압 송전탑과 변전소를 표적으로 삼은 것으로 의심됩니다. 병원들은 예비 발전기로 버티고 있고, 공장들은 가동을 멈췄으며, 민간인의 사기는 급락하고 있습니다. 한정된 공병 자원을 어떻게 배분할지 결정해야 합니다."
 iranian_flavor.59.a: "공병을 배치해 전력망을 복구한다"
 iranian_flavor.59.b: "군용으로 전력을 배급한다"
 iranian_flavor.60.t: "쿠르드 전투원들의 동맹 제안"
 iranian_flavor.60.d: "서부 주들의 쿠르드 페슈메르가 부대 대표들이 IRGC에 맞선 동맹을 제안하며 우리 사령부에 접근하였습니다. 그들은 경험 많은 산악 전투원을 우리의 대의에 투입할 의사가 있으나, 그 대가는 전쟁 후 쿠르드 지역에 더 큰 자치를 보장하는 것입니다. 그들의 도움을 받아들이면 서부의 균형을 기울일 수 있으나, 민족 분리주의에 위험한 선례를 남기게 됩니다."
 iranian_flavor.60.a: "그들의 도움을 받아들인다"
 iranian_flavor.60.b: "거절한다 - 자치에 대한 양보는 없다"
 iranian_flavor.61.t: "호르무즈 해협 대치"
 iranian_flavor.61.d: "고속 공격정과 기뢰 부설함을 포함한 IRGC 해군 병력이 호르무즈 해협의 통제권을 다투려 하고 있습니다. 이 해협은 우리 석유 수출의 생명줄이자 국제 해운의 핵심 길목입니다. 우리 제독들은 수로를 확보하기 위한 결정적인 해군 작전을 제안하고 있으나, 이는 사실상 상업 통행을 중단시키고 우리의 무역 관계에 피해를 줄 것입니다."
 iranian_flavor.61.a: "무력으로 해협을 확보한다"
 iranian_flavor.61.b: "무역을 위해 해협을 열어둔다"
 iranian_flavor.62.t: "전시 경제 조치"
 iranian_flavor.62.d: "장기화된 내전이 경제에 심각한 타격을 주고 있습니다. 산업 생산이 급격히 감소했고, 물가가 오르고 있으며, 필수품이 부족해지고 있습니다. 경제부는 두 가지 상충하는 제안을 내놓고 있습니다. 전쟁 수행을 위해 생산을 집중시키는 핵심 산업의 전면적인 국유화, 또는 민간 기업의 가동을 유지하고 어느 정도 경제적 정상성을 지키기 위한 세금 우대 및 보조금 패키지입니다."
 iranian_flavor.62.a: "핵심 산업을 국유화한다"
 iranian_flavor.62.b: "민간 산업에 세금 우대를 제공한다"
 iranian_flavor.63.t: "소수민족의 보장 요구"
 iranian_flavor.63.d: "아제리, 발루치, 아랍 공동체의 지도자들이 전후 어떠한 합의에서도 문화적 권리와 지역 대표성을 서면으로 보장할 것을 요구하는 공동 청원서를 제출하였습니다. 그들은 자신들의 공동체가 전투에서 불균형하게 큰 몫을 감당했으며 국가의 미래에 대한 지분을 가질 자격이 있다고 주장합니다. 개혁을 약속하면 이들의 지속적인 충성을 확보하고 모병을 늘릴 수 있으나, 전시의 약속은 구속력 있는 의무가 되기 쉽습니다."
 iranian_flavor.63.a: "자치 개혁을 약속한다"
 iranian_flavor.63.b: "국가 통합이 우선이다 - 양보는 없다"
 iranian_flavor.64.t: "노획한 IRGC 문서"
 iranian_flavor.64.d: "IRGC 지휘소에 대한 습격 중 아군은 병력 배치, 보급로, IRGC 고위 지휘관들 사이의 내부 통신을 상세히 담은 기밀 문서 다발을 노획하였습니다. 이 문서에는 부패, 횡령, 인권 침해의 증거도 담겨 있습니다. 이 뜻밖의 정보는 군사 작전 계획, IRGC의 비행을 폭로하는 선전전, 또는 외교적 지지를 대가로 한 외국 정부와의 공유 등 여러 방식으로 활용할 수 있습니다."
 iranian_flavor.64.a: "군사 작전에 활용한다"
 iranian_flavor.64.b: "IRGC의 부패를 폭로하도록 유출한다"
 iranian_flavor.64.c: "외국 동맹에 공유한다"
 IKR_fight_for_our_survival: "생존을 위한 투쟁"
 IKR_fight_for_our_survival_desc: "이란군이 사방에서 압박해 오면서 모든 마을과 산길이 사생결단의 경계선이 되었습니다. 쿠르드 민병대는 고향을 지키기 위해 필사적인 맹렬함으로 싸우고 있습니다."
 PER_hashd_al_shaabi_desc: "인민동원군은 이미 공동의 적에 맞서 이라크의 편에 서 있습니다. IRGC의 지도와 자금 지원으로 그들의 대열은 불어날 것이며 이슬람 공화국에 대한 충성심도 깊어질 것입니다."
 iranian_focus.58.c1: "이 문제는 나중에 처리하겠다"
 PER_attack_them_later_TT: "§H권장!§!\n- 나중에 [SAZ.GetFlag] §H남아제르바이잔§!을(를) 다시 침공할 수 있습니다"
 PER_towards_our_first_carrier: "첫 항공모함을 향한 행진"
 PER_towards_our_first_carrier_desc: "우리는 세계적 수준의 함선이나 해군 자산을 생산하는 것으로 알려져 있지 않으며, 역사적으로 지상전에 치중해 왔습니다. 그러나 현대는 창과 방패 이상을 요구합니다. 에어컨이 나오는 방에서 한 사람이 조작하는 포탑이 뜨거운 사막의 햇볕 아래 있는 소대 전체를 쓸어버릴 수 있습니다. 이제 마침내 이를 악물고 첫 항공모함을 향해 나아가, 사나운 바다를 영원히 길들일 때입니다."
 PER_one_giant_leap_forward: "거대한 도약"
 PER_one_giant_leap_forward_desc: "세계 다른 나라들에게 급속한 현대화는 오랫동안 일상이었지만, 이란의 경우는 달랐습니다. 우리에게는 가장 작은 돌파구조차 축하하고, 소중히 여기고, 자랑할 만한 일입니다. 그렇게 우리는 오늘에 이르렀고, 마침내 곧 하늘로 날아오를 이란 전투기 기술의 최신 진전을 세계에 발표할 수 있게 되었습니다."
 full_control_of_hormuz: "호르무즈 완전 장악"
 full_control_of_hormuz_desc: "호르무즈 해협은 이쪽 해안에서 저쪽 해안까지 우리의 것입니다. 세계 석유의 요충지가 우리 포구 아래 놓이면서 우리의 국고와 건설 노력도 불어납니다."
 PER_the_iranian_lobby: "이란 로비"
 PER_reintegrate_south_azerbaijan: "남아제르바이잔 재통합"
 PER_attack_ikr: "[IKR.GetFlag] 쿠르데스탄 공격"
 PER_cave_to_western_demands: "서방의 요구에 굴복"
 PER_war_in_yemen: "예멘 전쟁"
 PER_tehran_international_fairground: "테헤란 상설 박람회장 확장"
 PER_tehran_international_fairground_desc: "치트가르에 있는 테헤란 국제 상설 박람회장은 1959년부터 국내 무역 박람회를 개최해 왔습니다. 기둥이 없는 새 전시관이 생기면 현재 여러 소규모 전시관에 나뉘어 열려야 하는 대규모 산업, 국방, 연구 전시회를 한자리에서 개최할 수 있게 됩니다."
 PER_decentralized_nation: "분권화된 종속국 연합 채택"
 iranian_events.2282.t: "이란령 아제르바이잔의 불안한 평화"
 iranian_events.2282.d: "아제르바이잔 봉기에 맞선 이란의 군사 작전은 교착 상태에 빠졌습니다. 휴전으로 반군은 이름만 아닐 뿐 사실상 자신들의 고향을 통치하게 되었고, 테헤란은 조용히 이 지역에 대한 영유권 주장을 철회했습니다. 반군 지도부는 이제 전장에서 얻어낸 것을 보장해 줄 우방을 찾아 해외로 눈을 돌리고 있습니다."
 iranian_events.2282.a: "그들의 독립을 보장하자"
 iranian_events.2282.b: "이것은 우리의 싸움이 아니다"
 PER_unit_leader_trait_concessions_to_army: "군에 대한 양보"
 PER_unit_leader_trait_concessions_to_army_desc: "민간 정부는 민주적 절차를 존중하는 대가로 군대에 더 큰 권한을 부여하였습니다."
 PER_military_diarchy_trait_tt: "현재와 미래의 모든 §Y이란 장군§!이 §Y$PER_unit_leader_trait_concessions_to_army$§!을(를) 얻어 다음 효과를 받습니다.\n  $MODIFIER_ARMY_LEADER_MAX_ARMY_SIZE$: §G+6§!"
 PER_bolster_the_caspian: "카스피해 함대 강화"
 PER_bolster_the_caspian_desc: "카스피해에서의 우위를 차지하려면 주둔과 억지력이 모두 필요합니다. 함대를 확장하면 무역로를 확보하고 지역적 힘을 과시할 수 있습니다."
