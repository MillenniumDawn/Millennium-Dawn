 UKR_finish_repair: "Завершить ремонт всех самолётов дальней авиации"
 UKR_finish_repair_desc: "Восстановление наших самолётов дальней авиации завершено, и пришло время закрыть программу ремонта. Наши стратегические бомбардировщики снова готовы к службе, а выделенные на их восстановление ресурсы теперь можно направить на другие цели. Программа ремонта будет закрыта, и в её рамках больше ни один самолёт не будет восстановлен."
