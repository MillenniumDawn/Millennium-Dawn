 SUD.liberalism: "£generic_liberalism_small (SLP) - 苏丹自由党"
 SUD.liberalism_desc: "（社会自由主义） - 苏丹自由党是苏丹第一个呼吁自由市场经济的政党。该党还反对巴希尔的原教旨主义独裁，是人权和妇女权利的坚定捍卫者。"
 SUD.Caliphate: "£generic_Caliphate_small (PCP) - 人民大会党"
 SUD.Caliphate_desc: "（伊斯兰主义） - 人民大会党由哈桑·图拉比在与奥马尔·巴希尔闹翻时创立。虽然最初两人属于同一政党，但图拉比的宗教极端主义迫使巴希尔以阴谋指控将他监禁。虽然图拉比声称代表温和的伊斯兰教，但他实施的许多政策都大量借鉴了萨拉菲主义。此外，图拉比还非常乐意让伊斯兰恐怖分子（如奥萨马·本·拉登）在苏丹寻求庇护。"
 SUD.Neutral_Muslim_Brotherhood: "£SUD_Autocracy_small (NCP) - 全国大会党"
 SUD.Neutral_Muslim_Brotherhood_desc: "（伊斯兰主义） - 全国大会党成立于1998年，当时奥马尔·巴希尔解散了他之前的政治团体全国伊斯兰阵线，该党于1989年通过政变在苏丹掌权。巴希尔已将党内大部分强硬派伊斯兰主义者清除出党，但全国大会党仍然强烈支持在苏丹实施伊斯兰教法和阿拉伯人占主导地位，这导致这个多元化国家出现很多紧张局势。"
 SUD.Nat_Autocracy: "£generic_Nat_Autocracy_small (SAFF) - 苏丹武装力量"
 SUD.Nat_Autocracy_desc: "（军政府） - 苏丹武装力量成立于1956年该国独立之时，但其前身可追溯至1925年英国创建苏丹国防军。武装部队主要由苏丹军队组成。从纸面上看，武装部队规模很大，但实际上许多部队人手不足。除了陆军、海军和空军外，武装部队还包括一支名为人民防卫军的准军事部队。"
 SWA.Monarchist: "£generic_Monarchist_small 德拉米尼家族（专制主义）"
 SWA.Monarchist_desc: "（绝对君主制）\n德拉米尼家族（专制主义）\n\n$SWA.Monarchist_shared_desc$\n\n§2只要该党执政，§!§Y[SWA.GetNameWithFlag]§!§2都应被视为绝对君主制国家！§!"
 SWI.conservatism: "£SWI_western_conservative 联邦民主联盟"
 SWI.conservatism_icon: "£SWI_western_conservative"
 SWI.conservatism_desc: "瑞士联邦民主联盟是瑞士的一个民族保守主义政党。其意识形态在政治上是保守的、新教原教旨主义的和右翼民粹主义的。它与美国的基督教右翼相似，其首要目标是宣扬圣经价值观，反对其他文化和价值观。"
 SWI.liberalism: "£SWI_western_liberal 绿色自由党"
 SWI.liberalism_icon: "£SWI_western_liberal"
 SWI.liberalism_desc: "自由派 - 绿色自由党是国民议会中规模较小的绿党。它是在巴塞尔州议会、伯尔尼、圣加仑和苏黎世的州级绿党于2007年脱离 瑞士绿党时创建的。与瑞士绿党相比，绿色自由党不是左翼，而是更加中间派，并寻求 将自由的经济和社会政策与可持续的环保主义政策相结合。自2007年以来，它一直是国家委员会的固定成员。"
 SWI.socialism: "£SWI_western_social_democrat 瑞士社会民主党"
 SWI.socialism_icon: "£SWI_western_social_democrat"
 SWI.socialism_desc: "社会民主派 - 瑞士社会民主党是全国议会中得票数第二多的政党。它遵循古典社会民主主义，支持政府提供的公共服务。它还反对资本主义和亲欧。作为瑞士仅有的政党之一，它强烈支持加入欧盟。"
 SWI.Neutral_conservatism: "£SWI_non_aligned_conservative 基督教民主人民党"
 SWI.Neutral_conservatism_icon: "£SWI_non_aligned_conservative"
 SWI.Neutral_conservatism_desc: "基督教保守派 - 基督教民主人民党是瑞士的一个中间偏右政党。它支持自由、团结、正义、进步和开放等价值观。自1891年以来，它一直是国民议会的稳定成员，并在1999年至2019年被瑞士绿党取代期间担任第四大党。它还在瑞士国务委员会中拥有最多席位。"
 SWI.Neutral_Libertarian: "£SWI_non_aligned_libertarian 自由民主党.自由党"
 SWI.Neutral_Libertarian_icon: "£SWI_non_aligned_libertarian"
 SWI.Neutral_Libertarian_desc: "自由主义派 - 自由民主党.自由党是截至2017年国民议会中的第三大党。它成立于2009年，当时自由民主党和自由党合并。它支持古典和保守的自由主义观点，并希望保护公民自由和个人责任，它赞成瑞士的中立、直接民主和联邦制。它支持与欧盟的双边条约，但拒绝加入。"
 SWI.Neutral_green: "£SWI_non_aligned_greens 瑞士绿党"
 SWI.Neutral_green_icon: "£SWI_non_aligned_greens"
 SWI.Neutral_green_desc: "环保主义 - 瑞士绿党是瑞士较大的绿党。他们主要关注环保主义、对外国人的开放、和平主义和政府对经济的更多干预。自1979年以来，他们一直在国民议会中有代表，并且是自1987年以来在联邦议会中没有代表的第五大最受欢迎的政党。直到2019年，它才取代基督教民主人民党成为国民议会中的第四大政党。"
 SWI.neutral_Social: "£SWI_non_aligned_socialist_democrat 替代名单"
 SWI.neutral_Social_icon: "£SWI_non_aligned_socialist_democrat"
 SWI.neutral_Social_desc: "民主社会主义派 - 替代名单是瑞士的一个替代左翼政党。它与瑞士劳动党和团结密切合作，力求代表比瑞士绿党和瑞士社会民主党更左的瑞士政治观点。它致力于瑞士城市贫困工人的利益，支持进步和可持续的社会和生态观点。"
 SWI.Neutral_Communism: "£SWI_non_aligned_communism 瑞士劳动党/团结"
 SWI.Neutral_Communism_icon: "£SWI_non_aligned_communism"
 SWI.Neutral_Communism_desc: "共产主义派 - 瑞士劳动党是瑞士的民主马克思主义共产党。他们的目标是在瑞士人民中建立对废除资本主义和瑞士社会向社会主义发展的支持。它支持再分配而不是私有化，并表现出对社会弱势群体的团结。它在1944年成立后取得了初步成功，但此后一直是一个分裂的政党，收效甚微。它与持有类似托洛茨基主义意识形态的政党团结一起竞选。"
 SWI.Nat_Populism: "£SWI_nationalist_right_wing_populist 瑞士人民党"
 SWI.Nat_Populism_icon: "£SWI_nationalist_right_wing_populist"
 SWI.Nat_Populism_desc: "右翼民粹主义派 - 瑞士人民党于1971年由瑞士农民党和瑞士民主党合并成立。它最初是一个农业保守党，但在克里斯托夫·布劳赫的影响下在80年代转变为右翼民粹主义政党 。自1999年大选以来，它一直是瑞士国民议会四大党派中实力最强的。它与右翼 提契诺联盟和全国保守派瑞士联邦民主同盟一起在议会联盟中代表国民议会。"
 SWI.Nat_Autocracy: "£SWI_nationalist_military_junta 瑞士武装力量"
 SWI.Nat_Autocracy_icon: "£SWI_nationalist_military_junta"
 SWI.Nat_Autocracy_desc: "（军政府） - 瑞士武装力量\n\n瑞士武装部队建立在普遍征兵制和民兵原则之上，是唯一一个触及每个州和每个家庭的联邦机构。由于文官政府瘫痪，军官团搁置宪法，通过总参谋部进行统治，将军事管理标榜为该国最后的独立权威。"
 SYR.Kingdom: "£generic_Kingdom_small 阿拉伯民主党"
 SYR.Conservative: "£generic_Conservative_small 阿拉伯民主党"
 SYR.oligarchism: "£generic_oligarchism_small 阿拉伯民主党"
 SYR.Western_Autocracy_Alternative: "£generic_Western_Autocracy_small 阿拉伯民主党"
 SYR.Western_Autocracy: "£SYR_Western_Autocracy (RPS) 叙利亚改革党"
 SYR.Western_Autocracy_icon: "£SYR_Western_Autocracy"
 SYR.Western_Autocracy_desc: "（大西洋主义）- 叙利亚改革党是一个总部设在美国的小型政党和游说团体，反对叙利亚复兴党的统治。它渴望创建一个拥抱全球化、自由贸易、反对恐怖主义、致力于地区和平与稳定的“新叙利亚”。"
 SYR.liberalism: "£generic_liberalism_small 叙利亚正义与发展运动"
 SYR.liberalism_desc: "（中间派自由主义）- 叙利亚正义与发展运动是一个政党和运动，成立于2006年，总部设在英国伦敦。该组织将自己描述为“致力于在叙利亚进行和平、民主的变革，并建立一个尊重人权并促进经济和社会发展的现代国家”"
 SYR.socialism: "£SYR_socialism 叙利亚民主人民党"
 SYR.socialism_icon: "£SYR_socialism"
 SYR.socialism_desc: "（左翼社会民主主义）- 叙利亚民主人民党是叙利亚的一个左翼民主反对党，被叙利亚政府取缔。它是旨在推翻叙利亚政府的多个叙利亚反对派联盟的成员，这些联盟包括全国民主联盟和大马士革宣言。"
 SYR.anarchist_communism: "£generic_anarchist_communism_small 阿拉伯社会主义运动"
 SYR.anarchist_communism_desc: "（新复兴党）- 阿拉伯社会主义运动，又称阿拉伯社会主义党，是叙利亚的一个政党，自1960年代以来分裂为几个派系，但一直沿用同一个名称。由阿卜杜勒-加尼·卡努特领导的大马士革支部于1972年加入复兴党领导的民族进步阵线政府，此后一直支持阿萨德家族在叙利亚的统治。该党在叙利亚和黎巴嫩活跃。2001年阿卜杜勒-加尼·卡努特去世后，艾哈迈德·艾哈迈德成为新任秘书长；在他的领导下，该党继续走亲政府路线，甚至在叙利亚内战期间也是如此。在冲突的民间起义阶段，阿拉伯社会主义运动的大马士革支部组织了亲政府集会。当起义升级为全面叛乱时，该党成员组织了亲政府民兵。"
 SYR.Autocracy: "£SYR_Autocracy 叙利亚阿拉伯复兴社会党"
 SYR.Autocracy_icon: "£SYR_Autocracy"
 SYR.Autocracy_desc: "（新复兴党）- 叙利亚阿拉伯复兴社会党是一个新复兴党组织，由米歇尔·阿弗拉克、萨拉赫·丁·比塔尔和扎基·阿尔苏齐的追随者于1947年4月7日创立。该党最初是复兴党的地区分支，但在1966年复兴党分裂后，转而效忠于以叙利亚为主导的复兴运动。自1963年叙利亚政变使复兴党掌权以来，该党一直统治着叙利亚。该党与伊拉克阿拉伯复兴社会党截然不同。"
 SYR.Mod_Vilayat_e_Faqih: "£SYR_Mod_Vilayat_e_Faqih 阿巴斯旅"
 SYR.Mod_Vilayat_e_Faqih_icon: "£SYR_Mod_Vilayat_e_Faqih"
 SYR.Mod_Vilayat_e_Faqih_desc: "（什叶派伊斯兰主义）- 阿巴斯旅是一个亲政府的十二伊玛目派什叶派穆斯林武装组织，活动遍及叙利亚各地。该组织以伊玛目阿里之子阿巴斯·伊本·阿里的绰号命名。它成立于2012年末，旨在保卫赛义达·宰纳卜清真寺和叙利亚境内的其他什叶派圣地。在叙利亚内战期间，由于反叛分子亵渎了多处圣地、文化遗产和宗教场所，该组织迅速崛起，并随后与叙利亚政府军合作。"
 SYR.Caliphate: "£SYR_Caliphate 沙姆解放组织"
 SYR.Caliphate_icon: "£SYR_Caliphate"
 SYR.Caliphate_desc: "（萨拉菲主义）- 沙姆解放组织是一个活跃的萨拉菲圣战武装组织，参与叙利亚内战。该组织于2017年1月28日由“征服沙姆阵线”（前身为努斯拉阵线）、“安萨尔丁阵线”、“逊尼派军”、“真理旅”和“努尔丁赞基运动”合并而成。尽管进行了合并，“沙姆解放组织”仍被指控暗中充当基地组织的叙利亚分支，并被认为是其分支机构之一，尽管该组织官方否认了这一说法。"
 SYR.Neutral_Muslim_Brotherhood: "£SYR_brotherhood 叙利亚穆斯林兄弟会"
 SYR.Neutral_Muslim_Brotherhood_icon: "£SYR_brotherhood"
 SYR.Neutral_Muslim_Brotherhood_desc: "（伊斯兰民主主义）- 穆斯林兄弟会是一个跨国逊尼派伊斯兰组织，由伊斯兰学者兼教师哈桑·班纳于1928年在埃及创立。最初，作为一个泛伊斯兰的宗教和社会运动，它在埃及传播伊斯兰教义，为文盲提供教育，并建立医院和商业企业。后来，它进军政治领域，旨在结束英国对埃及的殖民统治。该运动的公开目标是建立一个由伊斯兰教法统治的国家 - 其在世界范围内最著名的口号是：“伊斯兰是解决之道”。慈善事业是其工作的主要推动力。"
 FSA.Neutral_Muslim_Brotherhood: "£SYR_brotherhood (SNC) - 叙利亚全国联盟"
 FSA.Neutral_Muslim_Brotherhood_desc: "（伊斯兰民主主义）- 叙利亚全国联盟是叙利亚内战中反对派团体的联盟，于2012年11月在卡塔尔多哈成立。全国联盟的主要目标是推翻巴沙尔·阿萨德政府及其“象征和支持支柱”，“解散安全部门”，团结并支持叙利亚自由军，拒绝与阿萨德政府进行对话和谈判，以及“追究那些应对杀害叙利亚人、摧毁叙利亚和驱逐叙利亚人负责的人的责任”。"
 SYR.Neutral_Autocracy: "£SYR_Neutral_Autocracy (ASU)阿拉伯社会主义联盟"
 SYR.Neutral_Autocracy_icon: "£SYR_Neutral_Autocracy"
 SYR.Neutral_Autocracy_desc: "（纳赛尔主义）- 叙利亚阿拉伯社会联盟党是一个纳赛尔主义政党。该党崇尚复兴党总统制，并且几乎没有任何独立于政府的立场。"
 SYR.neutral_Social: "£SYR_neutral_Social 民主社会主义统一党"
 SYR.neutral_Social_icon: "£SYR_neutral_Social"
 SYR.neutral_Social_desc: "（纳赛尔主义）- 民主社会主义联盟党是叙利亚的一个政党。它是全国进步阵线的一部分，该阵线是由获得合法许可的政党组成，支持政府的社会主义和阿拉伯民族主义路线，并接受复兴党的领导。"
 SYR.Neutral_Communism: "£generic_Neutral_Communism_small 人民意志党"
 SYR.Neutral_Communism_desc: "（马克思列宁主义）- 人民意志党是由被£SYR_Communist_State 叙利亚共产党开除的成员组成的政党。在组织结构上，人民意志党实行民主集中制。然而，该党没有设立总书记一职；而是由全体大会选举产生的中央委员会成员组成集体领导层来管理党务。中央委员会选举产生主席团成员和秘书处成员，负责日常工作。"
 SYR.Nat_Populism: "£SYR_Nat_Fascism (SSNP) 叙利亚社会民族党"
 SYR.Nat_Populism_desc: "（社会民族主义）- 叙利亚社会民族党是一个在黎巴嫩、叙利亚、约旦、伊拉克和巴勒斯坦活动的民族主义政党。该党主张建立一个横跨新月沃土的叙利亚民族国家，其疆域包括当今的叙利亚、黎巴嫩、伊拉克、科威特、约旦、巴勒斯坦、以色列、塞浦路斯、西奈半岛以及土耳其东南部，其划分依据是地理边界以及边界内人民共同的历史。该党拥有超过10万名党员，是叙利亚第二大合法政党，仅次于执政的阿拉伯复兴社会党。在黎巴嫩，该党已在该国政治史上活跃了80余年，是一个重要的世俗且组织严密的精英政党。"
 SYR.Nat_Fascism: "£IRQ_Nat_Autocracy_small  叙利亚复兴党（伊拉克派）"
 SYR.Nat_Autocracy: "£SYR_Nat_Autocracy 叙利亚阿拉伯武装力量"
 SYR.Nat_Autocracy_icon: "£SYR_Nat_Autocracy"
 SYR.Nat_Autocracy_desc: "（宗派军政府）- 叙利亚武装部队成立于1964年，旨在取代此前存在的叙利亚武装部队。在复兴党统治下的叙利亚，这支武装部队与该党关系密切。复兴党利用与叙利亚武装部队的军事联系发动政变夺取政权，并迅速着手清除军队中可能不忠的成员，用阿拉维派 - 与阿萨德本人同属一个族群 - 来填补这些职位。叙利亚武装部队的大部分作战对象是以色列或黎巴嫩境内受以色列支持的武装力量。尽管在其历史上，它曾短暂地以法国主导的“黎凡特军”的身份参与过二战。"
 SUR.oligarchism: "£generic_oligarchism_small 首都第一司令部(PCC)"
 SUR.oligarchism_desc: ""
 TAJ.socialism: "£TAJ_western_social_democrat (SDT)  - 塔吉克斯坦社会民主党"
 TAJ.socialism_icon: "£TAJ_western_social_democrat"
 TAJ.socialism_desc: "（进步主义）- 塔吉克斯坦社会民主党\n\n社会民主党成立于1998年，其成立目的明确，就是反对埃莫马利·拉赫蒙及其政府。该党以在塔吉克斯坦实现民主、推翻拉赫蒙政府为目标而闻名。"
 TAJ.Conservative: "£TAJ_emerging_reactionary (PDPT)  - 塔吉克斯坦人民民主党"
 TAJ.Conservative_icon: "£TAJ_emerging_reactionary"
 TAJ.Conservative_desc: "（专制民族主义） - 塔吉克斯坦人民民主党\n\n在埃莫马利·拉赫蒙的领导下，塔吉克斯坦人民民主党以铁腕统治着塔吉克斯坦。由于该党在塔吉克斯坦的主导地位，试图推翻政府的反对派运动在塔吉克斯坦各地如雨后春笋般涌现。该党主要致力于恢复塔吉克文化、身份和国家地位。埃莫马利·拉赫蒙领导下的该党严格限制伊斯兰教习俗，试图使塔吉克斯坦世俗化，采取了禁止蓄胡须和为希望戴头巾的女性制定着装规范等措施。"
 TAJ.anarchist_communism: "£TAJ_anarchist_communism (SPT) -  塔吉克斯坦社会党"
 TAJ.anarchist_communism_icon: "£TAJ_anarchist_communism"
 TAJ.anarchist_communism_desc: "（务实社会主义）- 塔吉克斯坦社会党\n\n塔吉克斯坦社会党成立于1996年。由于被视为共产党的替代党，社会党在塔吉克斯坦政治中并未发挥重要作用，但这种情况在不久的将来可能会改变。"
 TAJ.Caliphate: "£TAJ_salafist_jihadism (HTT) - 塔吉克斯坦伊斯兰解放党"
 TAJ.Caliphate_icon: "£TAJ_salafist_jihadism"
 TAJ.Caliphate_desc: ""
 TAJ.Kingdom: "£generic_Caliphate_small (IS–KP) - 伊斯兰国 - 呼罗珊省"
 TAJ.Kingdom_icon: "£TAJ_kingdom"
 TAJ.Kingdom_desc: ""
 TAJ.oligarchism: "£generic_oligarchism_small (PTJ)  - 公正党"
 TAJ.oligarchism_desc: ""
 TAJ.neutral_Social: "£TAJ_non_aligned_socialist_democrat (APT) - 塔吉克斯坦农民党"
 TAJ.neutral_Social_icon: "£TAJ_non_aligned_socialist_democrat"
 TAJ.neutral_Social_desc: "（农业主义）- 塔吉克斯坦农业党\n\n农业党考虑到广大农民阶级的利益，希望大幅增加农业用地面积，改革农场和农场。他们没有真正的远见，被认为是一个只关注农业和农业的单一政党。"
 TAJ.Neutral_Muslim_Brotherhood: "£TAJ_kingdom (IRP)  - 伊斯兰复兴党"
 TAJ.Neutral_Muslim_Brotherhood_icon: "£TAJ_non_aligned_moderate_islamist"
 TAJ.Neutral_Muslim_Brotherhood_desc: "（温和伊斯兰主义） - 塔吉克斯坦伊斯兰复兴党\n\n伊斯兰复兴党成立于1990年，对塔吉克社会有着重大影响力，主要是因为它与许多被排斥的伊斯兰人口产生共鸣。作为90年代塔吉克内战的主要竞争者，该组织被称为拉赫莫诺夫政府最大的反对派。该组织与穆斯林兄弟会有关，本质上是反共产主义的。"
 TAJ.Nat_Autocracy: "£generic_Nat_Autocracy_small (TAF) -  塔吉克斯坦武装力量"
 TAJ.Nat_Autocracy_desc: "（民族主义军政府） - 塔吉克斯坦武装部队直到1994年才正式成立，其初期主要依靠驻扎在该国的俄罗斯士兵补充兵力。这支武装部队由准军事组织和政府支持者发展而来，很快就卷入了塔吉克斯坦内战。内战结束后，这支军队一直保持着政治中立，主要依靠俄罗斯的物资和支持，并且总体上支持现任塔吉克斯坦政府。"
