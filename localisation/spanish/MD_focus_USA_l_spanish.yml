 USA_focus_the_pentagon_wars: "Las guerras del Pentágono"
 USA_focus_the_pentagon_wars_desc: "Hacia el final de la Guerra Fría y a principios del nuevo milenio, comenzó una creciente lucha interna en las altas esferas del Pentágono y en todo el aparato militar estadounidense. Los veteranos creían que el costo de las nuevas máquinas y armas de guerra sería una simple novedad que el enemigo podría usar para arruinarnos. Por otro lado, estaban los jóvenes innovadores, que creían que el radar moderno y otras innovaciones en armas militares definirían y moldearían el campo de batalla moderno. Esta lucha interna ha sido sensacionalizada por los medios de comunicación y Hollywood, pero solo quienes tienen la autoridad para ello conocen el verdadero desenlace."
 USA_focus_united_states_army: "Ejército de los Estados Unidos"
 USA_focus_united_states_army_desc: "Founded as the Continental Army during the American Revolutionary War, the United States Army is one of the three main pillars of the armed forces of these United States. Throughout its history the army has seen countless tons of innovation as well as its fair share of corruption. But in the modern age the branch faces a new challenge. With the peak of technological innovations on the rise the divide between tech vs tact is ever growing into destructive means. Lost money, R&D projects going over budget by metrics not seen in decades as well as just the internal sabotage of fellow officers and generals means there is much to do. The question is, where to start?"
 USA_focus_five_star_folly: "La locura de las cinco estrellas"
 USA_focus_five_star_folly_desc: "El campo de batalla moderno es una cuestión tanto de voluntad como de determinación, no de artefactos y dispositivos. Por lo tanto, debemos poner a punto y reestructurar nuestros esfuerzos de entrenamiento, nuestra estructura y la adaptabilidad de nuestras fuerzas con el equipamiento que ya tenemos. La I+D se recortará y se relegará a mejoras en la calidad de vida, optimizaciones de armas ligeras y destreza logística."
 USA_focus_infantry_doctrine_debate: "Debate sobre la doctrina de infantería"
 USA_focus_infantry_doctrine_debate_desc: "In order to be efficient as well as cut costs, we must look into the core of what makes our army function. This core pillar is that of the common soldier, the infantry. Currently there are three main doctrines which pressed on through and past the Cold War's conclusion. The Light Infantry Doctrine, the Mobile Infantry Doctrine and the Armored Infantry Doctrine. These three have their ups and downs, but the question is, which one suits our nation the best in terms of economy and flexibility."
 USA_focus_light_infantry_dominance: "Dominio de la infantería ligera"
 USA_focus_light_infantry_dominance_desc: "El soldado de a pie es el más fácil de moldear y adaptar a cualquier situación. Con esta llave, abriremos la puerta a la eficiencia, permitiendo que nuestros soldados puedan afrontar amenazas, tanto en tierra como en el aire."
 USA_focus_mobile_infantry_machine: "Máquina de infantería móvil"
 USA_focus_mobile_infantry_machine_desc: "Mediante la flexibilidad del soldado de infantería, combinada con la movilidad de los transportes motorizados y los vehículos de reconocimiento, nos esforzamos por crear la fuerza de ataque definitiva que constituye el núcleo de nuestro ejército."
 USA_focus_armored_infantry_ascendance: "Ascenso de la Infantería Blindada"
 USA_focus_armored_infantry_ascendance_desc: "Los tanques modernos son caros y muy costosos considerando la posible \"recompensa\" que ofrecen. Por lo tanto, debemos adaptar nuestra infantería para reemplazar y compensar estos derroches de dinero y crear un nuevo camino a seguir. La doctrina de infantería blindada garantizará la versatilidad del combate blindado, con un despliegue más eficiente y flexible de soldados de infantería para desviar la atención y confundir tanto a los elementos blindados como a las fuerzas ligeras del enemigo."
 USA_focus_tank_force_dilemma: "Dilema de la fuerza de tanques"
 USA_focus_tank_force_dilemma_desc: "El campo de batalla moderno ha vuelto casi obsoleto el uso original del tanque. Debemos considerar seriamente qué uso le daremos a estas enormes máquinas de metal si realmente queremos tener un ejército completo."
 USA_focus_repurposing_armored_programs: "Reorientación de programas blindados"
 USA_focus_repurposing_armored_programs_desc: "The RAP directive is an immediate reorganization of the army. Tank forces will be nearly stopped and reserved for very specific duties if need be, however the main directive will be that the research and materials will be redirected towards IFV, APC and other programs to bolster and improve all other aspects of combat."
 USA_focus_modern_tanks_modern_solutions: "Tanques modernos, soluciones modernas"
 USA_focus_modern_tanks_modern_solutions_desc: "El tanque es una maravilla moderna y no debe descartarse como un simple artilugio de una época pasada. Al perfeccionar los métodos de producción y reorganizar las unidades, podemos convertir nuestra fuerza blindada en la fuerza principal de apoyo y compañera de nuestra infantería."
 USA_focus_logistical_dominance: "Dominio logístico"
 USA_focus_logistical_dominance_desc: "El ejército solo funciona cuando dispone del equipo esencial para mantener una fuerza de combate efectiva. Por lo tanto, debemos dar ejemplo fomentando y ampliando el aparato logístico para garantizar el funcionamiento oportuno y eficiente de nuestra red de abastecimiento y logística."
 USA_focus_fire_support_supremacy: "Supremacía de apoyo de fuego"
 USA_focus_fire_support_supremacy_desc: "La artillería, el rey del campo de batalla. La movilidad es versátil para las necesidades de diseño de cada uno, la limpieza de áreas es efectiva de múltiples maneras y, como ventaja añadida, puede resultar relativamente más barata que solicitar apoyo aéreo. Por ello, invertiremos y nos aseguraremos de que nuestra artillería esté marcada para ser la clave del éxito en la guerra de la nueva era, tal como lo fue décadas e incluso siglos atrás."
 USA_focus_gold_star_program: "Programa Estrella Dorada"
 USA_focus_gold_star_program_desc: "El campo de batalla moderno se define por la ventaja tecnológica de nuestros enemigos. Si bien la carrera armamentista de la Guerra Fría ha terminado, nuestros enemigos siguen creciendo día a día, mientras la \"Era de Paz\" continúa gestándose y convirtiéndose en un hervidero de descontento, revoluciones y agitación social. Debemos invertir fuertemente en programas de I+D, perfeccionar nuestras integraciones tecnológicas y asegurarnos de ser no solo un ejército poderoso, sino un ejército de una sola persona."
 USA_focus_armored_combat_debate: "Debate sobre el combate blindado"
 USA_focus_armored_combat_debate_desc: "La reina indiscutible del campo de batalla moderno es el vehículo blindado de combate. Ya sean tanques, vehículos de combate de infantería o vehículos blindados de transporte de personal, estas máquinas de guerra pueden decidir una sola batalla e incluso una campaña entera. Sin embargo, a medida que se producen innovaciones en el combate blindado, nos encontramos ante una disyuntiva: ¿debemos centrarnos más en el desarrollo de tanques o reservar más recursos para los vehículos ligeros de apoyo a la infantería, como los vehículos de combate de infantería y los vehículos blindados de transporte de personal?"
 USA_focus_light_vehicle_innovations: "Innovaciones en Vehículos Ligeros"
 USA_focus_light_vehicle_innovations_desc: "While tanks are good at being mobile bunkers, the investments and innovations in modern AT capabilities makes direct tank combat a more risky investment in both material and personnel. Therefore we can redirect funding more towards APCs and IFVs to ensure a flexible infantry and armored approach. Besides APCs and IFVs are a lot easier to make modular than tanks are."
 USA_focus_modern_battle_tank_innovations: "Innovaciones modernas en tanques de batalla"
 USA_focus_modern_battle_tank_innovations_desc: "The MBT or Main Battle Tank is a Cold War innovation that has created the modern standard of tank doctrine. We must utilize this and ensure we create a powerful armored force to punch and steel ourselves against any enemy attacks. As a byproduct of such innovations, units like SPAA and SPGs are likely to see passive innovations as we retool unit organizations to encompass more equal footing sub units."
 USA_focus_mass_motorization_efforts: "Esfuerzos de motorización masiva"
 USA_focus_mass_motorization_efforts_desc: "Para garantizar nuestra movilidad según cualquier indicador que hayamos elegido, debemos obligar a nuestros socios fabricantes a estandarizar y aumentar la producción de vehículos motorizados para que nuestra infantería pueda mantener el ritmo de nuestros elementos mecanizados y blindados."
 USA_focus_the_artillery_conundrum: "El enigma de la artillería"
 USA_focus_the_artillery_conundrum_desc: "En la era moderna de los drones, las aeronaves furtivas y el creciente uso de equipos de ataque a distancia, es una cuestión de principios qué papel debemos desempeñar con una de las unidades de campo más vulnerables del ejército: la artillería y sus dotaciones. Necesitamos definir la estrategia a seguir y si debemos priorizar la defensa o el ataque para evitar que el enemigo ataque con facilidad estos objetivos tan vulnerables."
 USA_focus_defensive_artillery_program: "Programa de Artillería Defensiva"
 USA_focus_defensive_artillery_program_desc: "La iniciativa DAP es un programa diseñado para investigar e innovar en la mejora de las medidas defensivas, tanto en el diseño del equipo como en su capacidad para defenderse en el terreno. La maniobrabilidad localizada y la capacidad de alcanzar el frente desde mayores distancias garantizarán la supervivencia general de nuestro equipo y nuestras tripulaciones."
 USA_focus_offensive_artillery_program: "Programa de Artillería Ofensiva"
 USA_focus_offensive_artillery_program_desc: "El OAP establecerá un nuevo estándar de guerra de maniobras para toda la fuerza. Mediante innovaciones e investigación en blindaje y sistemas de artillería autopropulsada, marcamos el ritmo de todo nuestro ejército, ya que la artillería se considera la unidad más lenta de la rama."
 USA_focus_supplies_supples_supplies: "Suministros, suministros, suministros"
 USA_focus_supplies_supples_supplies_desc: "El cuerpo de intendencia se está preparando para ser la columna vertebral de la funcionalidad del ejército. Mayores avances y sistemas de armas complejos implican más cosas que transportar y preocuparse por reemplazar en el campo de batalla. Por lo tanto, debemos establecer una red de suministro fluida y maniobrable para garantizar la limitación de la destrucción enemiga de centros de suministro \"críticos\"."
 USA_focus_army_special_forces_question: "Pregunta de las Fuerzas Especiales del Ejército"
 USA_focus_army_special_forces_question_desc: "The Special Forces of the army service branch are becoming more numerous in both denominations and overlapping abilities. We need to seriously consider what role we want our army's special forces to have if we are to not only be more distinctive from other branches, but also distinctive enough within our own branch of service."
 USA_focus_specialized_frontline_defense_support: "Apoyo especializado de defensa de primera línea"
 USA_focus_specialized_frontline_defense_support_desc: "El SFDP es una nueva reorganización de las unidades de fuerzas especiales del ejército en una fuerza general o subdivisión del ejército para apoyar y asistir en las posiciones defensivas de todas las maneras posibles. Los posibles cercos implican que el SFDP transportaría suministros limitados para ayudar a las tropas varadas, realizar contraataques y maniobrar ante ataques enemigos a posiciones o unidades de reconocimiento enemigas, entre otras medidas. Con esto, el ejército podrá unificarse como un baluarte contra los enemigos de la libertad y la democracia."
 USA_focus_the_dagger_within_the_cloak: "La daga dentro de la capa"
 USA_focus_the_dagger_within_the_cloak_desc: "Nuestros Grupos de Fuerzas Especiales (SFG) deben ser lo mejor de lo mejor. Por lo tanto, para asegurar este ambicioso objetivo, necesitaremos inversiones sustanciales en dinero y equipamiento para entrenar, perfeccionar y hacer crecer esta fuerza hasta convertirla en una fuerza de ataque de la máxima eficacia."
 USA_focus_the_information_game: "El juego de la información"
 USA_focus_the_information_game_desc: "Saber qué hace uno mismo y qué hace el enemigo es clave para crear la musa de la victoria. Debemos invertir en mejores métodos de reconocimiento y adquisición de información de las fuerzas enemigas si queremos evitar pérdidas innecesarias."
 USA_focus_this_is_the_army_mr_jones: "Este es el ejército, señor Jones"
 USA_focus_this_is_the_army_mr_jones_desc: "Somos un ejército nuevo, con un nuevo espíritu, nuevos soldados y un nuevo comienzo para defender lo que es justo. Por la libertad y la búsqueda de la felicidad para todos."
 USA_focus_united_states_navy: "Armada De Los Estados Unidos"
 USA_focus_united_states_navy_desc: "Founded in 1775, disbanded after the revolution and then refounded as an emergency reaction to the Barbary Pirates of the time in the 1800s, the United States Navy has had a stoic and ever changing history. Being the forefront of innovations navally since over taking the British Empire around the time of the world wars, the US navy seeks to figure out just what it needs in the new millennia. With most combat being land or air centric, many in the public wonder just how much money the navy needs. As such naval leadership needs to pivot its thinking and PR teams to justify any new decisions, for if the navy is to be more than a simple merchant defense fleet, then it must find its new voice in this new age."
 USA_focus_project_steel_waves: "Proyecto Olas de Acero"
 USA_focus_project_steel_waves_desc: "Somos la superpotencia mundial, no una insignia de honor ni un demérito vergonzoso, simplemente un estatus de orden y posición. Para ello, debemos adaptar nuestro alcance naval a este estatus. La mayoría de las potencias mundiales juntas no pueden competir plenamente con nuestra tecnología de hace más de 40 años, por lo que mantendremos la I+D centrada en optimizar la producción, las reparaciones y las modificaciones de los buques existentes. Una flota modular y adaptable de muchos, en lugar de una flota de tecnología y potencia brutas en lenta disminución."
 USA_focus_naval_group_flexibility_program: "Programa de Flexibilidad del Grupo Naval"
 USA_focus_naval_group_flexibility_program_desc: "El NGFP es un programa de producción designado que nos permitirá agilizar y adaptar mejor nuestros esfuerzos de producción y reparación naval para lograr la máxima eficacia."
 USA_focus_small_ship_debate: "Debate sobre barcos pequeños"
 USA_focus_small_ship_debate_desc: "La era moderna ha recreado la dinámica de los buques pequeños, posicionando a las fragatas y corbetas como la crema y nata del sector. Si queremos crear una fuerza optimizada al máximo, debemos determinar cuál de estas dos opciones será el núcleo que sirva de apoyo a nuestros submarinos y destructores."
 USA_focus_frigate_fighters: "Cazas para Fragatas"
 USA_focus_frigate_fighters_desc: "Fragatas, la clase de buque más versátil y en constante evolución a lo largo de la historia naval. Este buque, aunque más pequeño que un destructor, puede tener la potencia de fuego de un crucero si se modifica correctamente. Por ello, convertiremos nuestras fragatas en auténticos cazas y en la columna vertebral de nuestra armada."
 USA_focus_corvette_combat_flexibility: "Flexibilidad de Combate de Corbetas"
 USA_focus_corvette_combat_flexibility_desc: "La corbeta es el buque más pequeño y razonablemente eficaz en combate de una flota moderna. Por ello, invertiremos, adaptaremos, mejoraremos y crearemos una flota de corbetas capaz de abrumar y destruir a los enemigos de la libertad y de navegar libremente por los mares."
 USA_focus_naval_maneuver_warfare: "Guerra de Maniobras Navales"
 USA_focus_naval_maneuver_warfare_desc: "Investments into propulsion R&D efforts will allow our small vessels to be ever more nimble on the high seas. This ever increasing maneuverability is something most naval captains are not equipped or trained for and as such will need training and time to get used to these new ways of fighting."
 USA_focus_increasing_contractor_incentives: "Incremento de Incentivos para Contratistas"
 USA_focus_increasing_contractor_incentives_desc: "By creating better guidelines, incentive packages and funding, our naval civilian and military contractors will be better motivated to provide better results overall than previously earned."
 USA_focus_project_new_waves: "Proyecto Nuevas Olas"
 USA_focus_project_new_waves_desc: "Project New Waves is a dedicated R&D initiative to renew, embolden and modernize as well as even future proof where ever and whenever possible. Our navy is the largest in the world by tonnage, so let's make every last ton count."
 USA_focus_the_submarine_debate: "El Debate sobre los Submarinos"
 USA_focus_the_submarine_debate_desc: "Los submarinos son el futuro del sigilo naval y las medidas defensivas. Sin embargo, debemos considerar seriamente si invertiremos en variantes de ataque o de misiles de nuestra flota submarina."
 USA_focus_the_attack_fleet: "La Flota de Ataque"
 USA_focus_the_attack_fleet_desc: "Gracias a las inversiones en nuestros submarinos de ataque, tanto los preexistentes como los de desarrollo futuro, podemos garantizar que nuestra destreza naval sea la más eficaz para apuntar y destruir rápidamente buques enemigos."
 USA_focus_the_missile_fleet: "La Flota de Misiles"
 USA_focus_the_missile_fleet_desc: "Gracias a una gran inversión en misiles modulares para nuestros submarinos, podremos atacar y destruir cualquier obstáculo en el mar, ya sea artificial o natural, si es necesario."
 USA_focus_mobile_airports_program: "Programa de Aeropuertos Móviles"
 USA_focus_mobile_airports_program_desc: "A través de la I+D en la creación de aeronaves más ágiles, así como de sistemas de asistencia tanto de lanzamiento como de aterrizaje, podemos aspirar a convertir nuestros portaaviones en aeropuertos móviles. Esto, a su vez, aportará la mayor cantidad de potencia de fuego a una zona de combate naval sin necesidad de realizar inversiones masivas en buques principales como destructores, cruceros y demás."
 USA_focus_project_gunships: "Proyecto Helicóptero de Ataque"
 USA_focus_project_gunships_desc: "Las importantes inversiones e investigaciones para desarrollar mejores helicópteros les permitirán convertirse en la nueva máquina de combate universal. Si bien mejorar los helicópteros facilita el combate terrestre, su objetivo principal es utilizarlos como aviones de ataque ágiles y rápidos en nuestras flotas de portaaviones. La fuerza de ataque naval moderna ya está aquí y estamos aquí para hacerla realidad."
 USA_focus_strengthing_naval_training_efforts: "Fortalecimiento de los Esfuerzos de Entrenamiento Naval"
 USA_focus_role_of_the_usmc: "El Rol del Cuerpo de Marines de los EE.UU."
 USA_focus_role_of_the_usmc_desc: "El Cuerpo de Marines de los Estados Unidos ha tenido una historia turbulenta. Sin embargo, su papel se ve cuestionado una vez más. En la era moderna, con campañas aisladas y sin una \"gran guerra\" contra un enemigo fácilmente identificable, la identidad del marine moderno es un poco diferente. Necesitamos determinar si debemos seguir contando con un Cuerpo de Marines especializado o instituir un mayor apoyo o una generalización de la rama y trasladarla al ejército, en lugar de convertirla en un subdepartamento estrictamente dependiente de la marina."
 USA_focus_marines_are_as_marines_were: "Los Marines Son Como Siempre Fueron"
 USA_focus_marines_are_as_marines_were_desc: "Lanzar invasiones navales y la lanza para perforar la defensa costera enemiga. Eso es el Cuerpo de Marines y eso es lo que será. ¡Los Marines lideran el camino!"
 USA_focus_marine_lessons_in_army_clothes: "Lecciones de los Marines en Ropa de Ejército"
 USA_focus_marine_lessons_in_army_clothes_desc: "El campo de batalla moderno requiere cada vez menos una fuerza de invasión naval fuerte y dedicada. Por ello, podemos trabajar para integrar y mejorar nuestras fuerzas terrestres para que se adapten mejor a las características del terreno, ya sea acuático o no."
 USA_focus_repair_teams: "Equipos de Reparación"
 USA_focus_repair_teams_desc: "Equipar equipos especializados de marines para ayudar en las reparaciones y el control de daños significa que nuestros barcos pueden volver al agua más rápido que nunca. Dejando solo los problemas graves para el dique seco cuando sea necesario."
 USA_focus_a_modern_navy: "Una Armada Moderna"
 USA_focus_a_modern_navy_desc: "Contra viento y marea lo hemos logrado, hemos creado una armada que rivaliza incluso con nuestros enemigos más fuertes. Ahora podremos defendernos a nosotros mismos y a nuestros aliados sin fallar."
 USA_focus_united_states_air_force: "Fuerza Aérea de los Estados Unidos"
 USA_focus_united_states_air_force_desc: "A pesar de ser una de las ramas más jóvenes de las fuerzas armadas, la USAF tiene una historia interesante. Originalmente un departamento del ejército bajo el nombre de USAAF o Fuerza Aérea del Ejército de los Estados Unidos, las exigencias de la Segunda Guerra Mundial obligaron a la fuerza aérea a convertirse en una rama independiente. Desde entonces, la fuerza aérea se ha convertido en el ejemplo de la era moderna en la supremacía en el campo de batalla. Pero a medida que la guerra cambia, también lo hacen las necesidades de la fuerza aérea. Ahora, con el advenimiento de una nueva era, el liderazgo de la rama necesita descubrir cómo adaptarse a la situación en constante cambio de lo que es el \"campo de batalla moderno\"."
 USA_focus_economy_class_warfare: "Guerra de Clase Económica"
 USA_focus_economy_class_warfare_desc: "No se puede librar una guerra con el estómago vacío, y desde luego no se puede librar sin una economía que funcione. Por lo tanto, debemos encontrar maneras de reestructurar el presupuesto de nuestra fuerza aérea para que sea eficiente en métodos y modelos de producción que, a su vez, podamos reinvertir en la propia economía."
 USA_focus_the_modular_design_program: "Programa de Diseño Modular"
 USA_focus_the_modular_design_program_desc: "El MDP supone una racionalización de toda la producción aeronáutica. En lugar de crear múltiples líneas de producción hiperespecíficas, podemos garantizar la máxima eficiencia de producción mediante la creación de un modelo de avión estándar real, adaptable modularmente a las necesidades del país."
 USA_focus_production_development_investments: "Inversiones en Desarrollo de Producción"
 USA_focus_production_development_investments_desc: "Mediante iniciativas de I+D e inversiones generales en fabricación, podemos aumentar nuestra capacidad de producción y también generar algunos resultados civiles. Esto sin duda contribuirá a la creación de empleo y a la optimización de las capacidades de nuestras aeronaves."
 USA_focus_fighter_focused_budgeting: "Presupuesto Centrado en Cazas"
 USA_focus_fighter_focused_budgeting_desc: "Materiales más ligeros, mejoras en el entrenamiento de agilidad y mejores sistemas de armas. Estas son solo algunas de las inversiones que planeamos hacer para que nuestra fuerza aérea sea, sin duda, una fuerza a tener en cuenta."
 USA_focus_bomber_focused_budgeting: "Presupuesto Centrado en Bombardeos"
 USA_focus_bomber_focused_budgeting_desc: "Mayor capacidad de daño de carga útil, mejoras en el diseño de los sistemas de aeronaves, etc. Se invertirá en estas y otras inversiones para garantizar que nuestra fuerza aérea supere cualquier obstáculo que encuentren nuestras fuerzas terrestres."
 USA_focus_civil_military_innovations_program: "Programa de Innovaciones Civiles y Militares"
 USA_focus_civil_military_innovations_program_desc: "A joint development and research facility, the C&MIP is designed to combine military innovations and civilian ones and understand how one can inspire the other and vice versa. With this our economy will be built for the people as well as for their defense."
 USA_focus_a_limitless_sky: "Un Cielo Sin Límites"
 USA_focus_a_limitless_sky_desc: "Dicen que el cielo es el límite, bien, la Fuerza Aérea de los Estados Unidos tendrá como objetivo de la rama superarlo y demostrar que no existe tal límite."
 USA_focus_perpetual_air_dominance: "Dominio Aéreo Perpetuo"
 USA_focus_perpetual_air_dominance_desc: "Mediante inversiones casi constantes en sistemas de armas y regímenes de entrenamiento para las tripulaciones, podemos crear un estado de dominio perpetuo a través de la pura agresividad."
 USA_focus_american_institute_for_avionics: "Instituto Estadounidense de Aviónica"
 USA_focus_american_institute_for_avionics_desc: "El AIA es un centro de investigación centrado en el desarrollo y la mejora de las capacidades de nuestra Fuerza Aérea. Esperamos crear grandes logros en el futuro."
 USA_focus_phase_one_innovations: "Innovaciones de la Fase Uno"
 USA_focus_phase_one_innovations_desc: "Las innovaciones de la Fase 1 se refieren a avances generales en el entrenamiento de la tripulación, así como a formas más eficientes de manejar y/o fabricar aeronaves."
 USA_focus_phase_two_innovations: "Innovaciones de la Fase Dos"
 USA_focus_phase_two_innovations_desc: "Las constantes inversiones e iniciativas de investigación han comenzado a dar frutos en relación con el apoyo terrestre y el soporte directo en el campo de batalla. Esperamos que estas innovaciones mejoren de manera óptima nuestros asaltos combinados contra las posiciones enemigas."
 USA_focus_phase_three_innovations: "Innovaciones de la Fase Tres"
 USA_focus_phase_three_innovations_desc: "Las inversiones agresivas continúan impulsando nuestras innovaciones a medida que logramos avances en grandes aviones bombarderos y en poder destructivo de su carga útil."
 USA_focus_paratrooper_corps: "El Cuerpo de Paracaidistas"
 USA_focus_paratrooper_corps_desc: "The paratroopers have been a unique branch of the army and air force. Born out of experimental need from the demands of world war two, the paratroopers are considered a key part of modern training. From traditional jumps from C-130s to rappelling out of attack helicopters, the paratrooper spirit is still strong in today's battlefield. Now we need to figure out the real needs of our military forces to ensure peak cohesion and effectiveness."
 USA_focus_jump_wings_forever: "Alas de Salto para Siempre"
 USA_focus_jump_wings_forever_desc: "Nuestros paracaidistas son los mejores de los mejores, mejoraremos y cuidaremos esta fuerza para garantizar que sigan siendo así en el futuro previsible."
 USA_focus_every_soldier_a_trooper: "Cada Soldado, un Tropero"
 USA_focus_every_soldier_a_trooper_desc: "La movilidad de los helicópteros, así como el ritmo siempre cambiante de los campos de batalla, implican que el papel del paracaidista debe ampliarse y no limitarse a un rol reservado. Por ello, haremos todo lo posible para perfeccionar y mejorar nuestro ejército aprovechando las lecciones aprendidas por los paracaidistas a lo largo de los años."
 USA_focus_joint_branch_coordination_training: "Entrenamiento de Coordinación entre Ramas"
 USA_focus_joint_branch_coordination_training_desc: "El programa JBCT es un programa de entrenamiento de cohesión y coordinación que busca intensificar los esfuerzos de capacitación y cooperación entre las ramas de servicio de la Fuerza Aérea y el Ejército, dada la naturaleza intrínseca del campo de batalla moderno. Esto también contribuirá a reducir los incidentes entre las ramas en la medida de lo posible."
 USA_focus_to_infinite_and_beyond: "¡Hacia el Infinito y Más Allá!"
 USA_focus_to_infinite_and_beyond_desc: "Nuestras innovaciones y dedicación para garantizar que nuestra fuerza aérea sea inigualable han sido excepcionales. Podemos afirmar sin lugar a dudas que nuestros esfuerzos por mejorar nuestra fuerza aérea serán tema de conversación mundial durante años."
 USA_focus_united_states_general_staff: "Estado Mayor Conjunto de los Estados Unidos"
 USA_focus_united_states_general_staff_desc: "The JCS as well as the General Officer Corps of the United States is a temperamental one at best and a soft power struggle at worst depending on the era. However the GOC in the recent years has seen some interesting issues. Internal struggles on corruption and over zealous spending despite the end of the cold war as well as just the age old question of, \"innovators vs old guards\". In the new millennia however the question of retraining and refining the officer corps as a whole is up for debate and as such ideas are being thrown around. As such we need to figure out what our needs will be."
 USA_focus_army_centric_training: "Entrenamiento Centrado en el Ejército"
 USA_focus_army_centric_training_desc: "Al potenciar los programas de reentrenamiento y ascenso en todo el ejército, nuestra prioridad en los desarrollos de mando y control hará que nuestras fuerzas terrestres destaquen en los tiempos venideros."
 USA_focus_army_knowledge_priority: "Prioridad de Conocimiento del Ejército"
 USA_focus_army_knowledge_priority_desc: "El ascenso dentro del cuerpo de oficiales ahora requerirá más conocimientos y necesidades del ejército que de la fuerza aérea o la marina. Esto garantizará que más elementos de C&C se destinen a mejorar nuestras fuerzas terrestres, donde se desarrolla la mayor parte de los combates."
 USA_focus_naval_centric_training: "Entrenamiento Centrado en la Armada"
 USA_focus_naval_centric_training_desc: "Al impulsar los programas de reentrenamiento y desarrollo profesional en toda la Armada, nuestra prioridad en el mando y control se centrará en mejorar la maniobrabilidad y la supervivencia naval. Esto significa que más buques contarán con comandantes flexibles y adaptables."
 USA_focus_naval_knowledge_priority: "Prioridad de Conocimiento Naval"
 USA_focus_naval_knowledge_priority_desc: "Los avances dentro del cuerpo de oficiales requerirán ahora más conocimiento naval para desarrollar y mejorar los elementos de C&C dentro de nuestra rama naval. La mayor parte de nuestra lucha estratégica involucra a la armada de una forma u otra; por lo tanto, para asegurar que esta columna vertebral sea fuerte y duradera, sus líderes deben ser de una estirpe similar."
 USA_focus_air_force_centric_training: "Entrenamiento Centrado en la Fuerza Aérea"
 USA_focus_air_force_centric_training_desc: "Al potenciar los programas de reentrenamiento y ascenso en toda la fuerza aérea, nuestra prioridad en los desarrollos de mando y control hará que nuestras fuerzas aéreas destaquen en los tiempos venideros."
 USA_focus_air_force_priority_knowledge: "Prioridad de Conocimiento de la Fuerza Aérea"
 USA_focus_air_force_priority_knowledge_desc: "Los avances dentro del cuerpo de oficiales requerirán ahora más conocimientos aéreos y/o aeronáuticos para desarrollar y mejorar los elementos de C&C dentro de nuestra fuerza aérea. El campo de batalla moderno está prácticamente definido por la guerra aérea, por lo que debemos asegurarnos de que nuestra fuerza aérea sea indiscutible ante cualquier enemigo conocido."
 USA_focus_a_true_pax_americana: "Una Verdadera Pax Americana"
 USA_focus_a_true_pax_americana_desc: "Reformas, cambios, atención a las necesidades de cada rama del servicio bajo nuestra autoridad. Nuestra nación estará segura y el mundo sabrá lo que es una verdadera paz estadounidense. Ad pacem et felicitatem. \"Por la paz y la prosperidad\"."
 USA_focus_reintroducing_mandatory_service: "Reintroducción del Servicio Militar Obligatorio"
 USA_focus_reintroducing_mandatory_service_desc: "Mediante la presión en el Congreso, esperamos poder impulsar la reintroducción de un período de servicio obligatorio. Esto permitirá mantener el número de efectivos y reducir la presión sobre la fuerza puramente voluntaria que tenemos. Dado que la reacción política será considerable, el período recomendado a los legisladores es de solo seis meses."
 USA_focus_expanding_mandatory_service: "Expansión del Servicio Militar Obligatorio"
 USA_focus_expanding_mandatory_service_desc: "The needs of the armed forces and national defense have grown to a point of concern. If we are to keep on top of things we must and I mean we must lobby congress to approve of such a measure. The public backlash will be sizeable but in the end of it, our national defense in these ever trying times of uncertainty is a justification."
 USA_focus_concerning_developments: "Desarrollo Preocupante"
 USA_focus_concerning_developments_desc: "Las cosas no van bien y se está llegando a un punto que parece irreversible. Por lo tanto, debemos incrementar los requisitos de conscripción para forzar la entrada de los números que necesitamos. Dolerá, pero no podemos arriesgarnos a ningún debate."
 USA_focus_desperate_measures: "Medidas Desesperadas"
 USA_focus_desperate_measures_desc: "La situación sigue empeorando; se necesitan medidas drásticas si queremos avanzar. El equipo no sirve de nada si no contamos con los hombres y mujeres necesarios para usarlo."
 USA_focus_congressional_chaos: "Caos en el Congreso"
 USA_focus_congressional_chaos_desc: "For the first time in our history, we've come to have a deadlock within the electoral college. Small scale riots have begun across the country as animosity continues to build about whose candidate actually won the election. As such congress is scrambling to figure out just how to resolve this problem."
 USA_focus_secretary_to_president: "De Secretario a Presidente"
 USA_focus_secretary_to_president_desc: "No hay nada peor que un espectáculo lamentable en todos los frentes. Con opciones acumuladas dada la redacción de la Constitución en un 'escenario del día del juicio final' como este, tenemos una pesadilla de relaciones públicas en ambos bandos y la probabilidad cada vez mayor de un colapso total en el orden social y en la confianza hacia nuestro sistema. Por consiguiente, debemos invocar la Ley de Sucesión Presidencial y hacer algo completamente sin precedentes: saltarnos la Cámara y el Senado e inaugurar al actual Secretario de Estado. Una opción segura para nosotros y una primicia nacional, ya que en la historia de esta nación jamás habíamos experimentado algo tan agudo que perforara el corazón mismo y los cimientos de nuestra patria... Que Dios nos ayude a todos para que esto nunca vuelva a suceder."
 USA_focus_reassuring_wall_street: "Tranquilizar a Wall Street"
 USA_focus_reassuring_wall_street_desc: "Tras la crisis, lo primero es colaborar con Wall Street y los especuladores para evitar que sumerjan el mercado bursátil en una nueva depresión. Reuniones específicas y programas de ayuda selectiva, tanto para Wall Street como para el público general, deberían tranquilizar a todos."
 USA_focus_restarting_aid_programs: "Reinicio de Programas de Ayuda"
 USA_focus_restarting_aid_programs_desc: "A long time ago the federal government tried to save the dairy industry farmers by subsidizing and buying up milk from farmers. However farmers got wind of what this actually meant and so ended up expanding their production abilities. Eventually the government figured this out and fixed it mostly by running hidden initiatives to get the nation to consume more dairy products. However the surplus was so huge that another initiative was started known as \"Government Cheese\". This simple program has left an imprint on the older generations and most new generations will never know that time you could get cheap to free cheese. But not any more. It costs way more to store these stockpiles than it does to give back and as such the program is being restarted. More food on peoples' tables means less worry of health concerns in certain areas as well as the need for certain welfare programs, in addition we lower the stockpiles and then we lower the cost to the government for storage. Everyone wins."
 USA_focus_specification_act: "Ley de Especificaciones"
 USA_focus_specification_act_desc: "Los asuntos en el Congreso se están empantanando cada vez más, hasta el punto de que esta reciente crisis ha sacudido a la nación hasta sus cimientos. Por ello, se anuncia la Ley de Especificación, una legislación que exige que los proyectos de ley del Congreso se ajusten a una sola materia o tema para evitar colapsos constantes en el orden parlamentario. Esto probablemente conducirá a un enorme recorte de la burocracia nacional para casi todo, ya que el formato de tema único evitará que las tácticas de cabildeo de beneficio mutuo (tit for tat) hinchen las leyes. Asimismo, la desregulación fomentada por este formato beneficiará a la economía al abrir más proyectos del sector privado sin tener que preocuparse por tantos costes fijos."
 USA_focus_national_armed_services_audit: "Auditoría de los Servicios Armados Nacionales"
 USA_focus_national_armed_services_audit_desc: "La controversia sobre el monto del gasto militar y sus resultados reales ha provocado una disminución en el reclutamiento, así como una tendencia negativa en la percepción pública del ejército en general. Por ello, se realizará una auditoría nacional de las fuerzas armadas que, con suerte, revolucionará la situación y reducirá la necesidad general de gasto militar. Es probable que la tendencia al aumento del gasto no desaparezca, pero si logramos sacar más provecho de lo que ya tenemos, al menos podremos frenar su ritmo exponencial."
 USA_focus_reduce_and_expand_act: "Ley de Reducción y Expansión"
 USA_focus_reduce_and_expand_act_desc: "La Ley de Investigación y Educación (R&E) es una legislación que evalúa y reduce los requisitos federales del SAT y otros exámenes, y fomenta la financiación para escuelas y distritos que incorporen clases ampliadas. Cursos como economía doméstica y finanzas contribuirán enormemente a la estabilidad de las futuras generaciones, a medida que aprenden a administrar el dinero y a cuidar de sus hijos, además de a cocinar."
 USA_focus_domestic_over_foreign: "Política Doméstica sobre Extranjera"
 USA_focus_domestic_over_foreign_desc: "En esta nueva era de paz, debemos centrarnos más en nosotros mismos si queremos seguir pensando en cuidar de los demás. Por ello, reestructuraremos nuestro presupuesto centrado en la política exterior y lo reorientaremos hacia algunas iniciativas nacionales."
 USA_militarist_economic_militarism: "Militarismo Económico"
 USA_militarist_economic_militarism_desc: "Nuestra nación es fuerte y cuenta con la capacidad, tanto en materias primas como en recursos humanos, para garantizar la paz y la estabilidad mundiales. Sin embargo, durante demasiado tiempo los políticos han malgastado y desperdiciado valiosos recursos en todos los ámbitos. Por ello, comenzaremos a reestructurar nuestra economía para estar preparados ante cualquier conflicto militar que los enemigos de nuestra república deseen desencadenar."
 USA_militarist_economic_r_and_d: "Investigación y Desarrollo Económico"
 USA_militarist_economic_r_and_d_desc: "Para continuar optimizando nuestra economía, necesitamos establecer un programa de I+D+i. Por ello, lo haremos para garantizar la seguridad económica de nuestra nación."
 USA_militarist_national_wellness_programs: "Programas Nacionales de Bienestar"
 USA_militarist_national_wellness_programs_desc: "The NWPs are a series of ways to give back to those who give for the nation. If the citizens take care of the state and as such the state will do the same. Since we could be looking towards a war this sentiment weighs heavy on all."
 USA_militarist_strategic_quotas: "Cuotas Estratégicas"
 USA_militarist_strategic_quotas_desc: "Nuestra capacidad económica no tendrá límites. Sin embargo, en tiempos de crisis y guerra, se esperan sacrificios, por lo que emitiremos un programa rotatorio de cuotas estratégicas para que la población comprenda lo que podría necesitarse en el futuro."
 USA_militarist_integrated_corps_of_engineers: "Cuerpo de Ingenieros Integrado"
 USA_militarist_integrated_corps_of_engineers_desc: "Al utilizar el Cuerpo de Ingenieros y otros aspectos de las fuerzas armadas en proyectos de obras públicas y similares, podemos crear un nuevo estándar de desarrollo que nuestros ciudadanos aún no han experimentado. Además, ¿quién no querría unirse al ejército sabiendo que no tiene que morir en tierras lejanas? Eso sí que es relaciones públicas gratuitas."
 USA_militarist_investing_in_naval_companies: "Inversión en Empresas Navales"
 USA_militarist_investing_in_naval_companies_desc: "Financiar iniciativas de investigación en varias compañías navales permitirá a nuestra industria, tanto civil como militar, crear nuevos buques y encontrar maneras de agilizar las reparaciones. Recuerden que las innovaciones militares generan nuevas innovaciones civiles, y lo mismo ocurre a la inversa."
 USA_militarist_automations_act: "Ley de Automatización"
 USA_militarist_automations_act_desc: "Para mejorar nuestro potencial económico y aumentar nuestra base de reclutamiento, debemos invertir en automatización siempre que sea posible. No será del agrado de la gente, pero es un mal necesario para nuestra supervivencia."
 USA_militarist_mea: "Administración de Empleo Obligatorio"
 USA_militarist_mea_desc: "El MEA es un organismo administrativo gubernamental que ayuda a quienes no tienen empleo a encontrar trabajo. Inspirado en algunas agencias de tres letras de la época del New Deal, el MEA está aquí para ayudar a quienes necesitan un empleo."
 USA_militarist_fwip: "Programa de Innovaciones para la Guerra Futura"
 USA_militarist_fwip_desc: "El FWIP es un complejo de I+D dedicado a la innovación para crear las fuerzas de combate del futuro. Mediante un esfuerzo incansable, garantizaremos que nuestras fuerzas armadas sean inigualables en todo el mundo."
 USA_militarist_army_armaments_improvements: "Mejoras en Armamento del Ejército"
 USA_militarist_army_armaments_improvements_desc: "Mediante contratos de desarrollo, podemos mejorar el armamento de nuestros soldados. Con esto, esperamos mejorar la capacidad general de nuestro ejército para defender y tomar el campo de batalla."
 USA_militarist_mobile_observation_force: "Fuerza de Observación Móvil"
 USA_militarist_mobile_observation_force_desc: "El MOF es una fuerza especializada relacionada con iniciativas de reconocimiento. Esta nueva fuerza será una unidad altamente móvil, encargada de monitorear los movimientos del enemigo y garantizar que nuestras tropas reciban la mayor alerta posible sobre ataques y movimientos generales, siempre que sea posible."
 USA_militarist_localized_logistics: "Logística Localizada"
 USA_militarist_localized_logistics_desc: "Se espera que una logística mejorada en términos de unidades más pequeñas y métricas de flexibilidad permitan que nuestro ejército esté más coordinado y más preparado para lo que el enemigo pueda lanzarnos."
 USA_militarist_naval_gunnery_advancements: "Avances en Artillería Naval"
 USA_militarist_naval_gunnery_advancements_desc: "Researching new gunnery training regimens as well as improving the standing munitions and weapons systems on our fleet is paramount to defending our coastal waters as well as taking the fight to the enemy if and when need be."
 USA_militarist_propulsion_advancements: "Avances en Propulsión"
 USA_militarist_propulsion_advancements_desc: "Mejorar los motores y sistemas de propulsión de nuestros buques de guerra permitirá que nuestros barcos se comuniquen entre sí más rápido que nunca. Sin mencionar la iniciativa en el campo de batalla que esto traerá en las próximas guerras."
 USA_militarist_increased_pay_incentives: "Incentivos de Pago Aumentado"
 USA_militarist_increased_pay_incentives_desc: "Our naval personnel are mostly sitting ducks with little chance to properly escape from an enemy force. These hardships mean we should properly compensate them. With this compensation we will also increase naval drills in combat and disengagement of enemy forces to ensure the survival and effectiveness of every ship and personnel on those ships."
 USA_militarist_aircraft_improvements: "Mejoras en Aeronaves"
 USA_militarist_aircraft_improvements_desc: "Invertir en la fabricación de mejores aeronaves y más ágiles significa que también debemos invertir en nuestro personal para que sea capaz de manejar adecuadamente estas máquinas de guerra. Por lo tanto, haremos precisamente eso para asegurar unos cielos despejados para nuestros ciudadanos."
 USA_militarist_increasing_drill_intensity: "Incremento en la Intensidad de los Ejercicios"
 USA_militarist_increasing_drill_intensity_desc: "El perfeccionamiento, la intensificación y la mejora de nuestros ejercicios aéreos para mejorar la eficacia general darán resultados en la eficacia de la misión, así como en las capacidades de combate."
 USA_militarist_weapon_system_innovations: "Innovaciones en Sistemas de Armas"
 USA_militarist_weapon_system_innovations_desc: "Las inversiones en I+D para mejorar los sistemas de armas de nuestras aeronaves conducirán a escenarios de combate más efectivos que, esperamos, se traducirán en una ganancia neta positiva en futuros conflictos cuando sea posible."
 USA_militarist_pre_emptive_mobilization: "Movilización Preventiva"
 USA_militarist_pre_emptive_mobilization_desc: "Ha llegado el momento, debemos empezar a movilizar a la nación para garantizar que nuestro futuro sea una certeza segura."
 USA_militarist_securing_southern_interests: "Asegurar los Intereses del Sur"
 USA_militarist_securing_southern_interests_desc: "La violencia desenfrenada de las pandillas y un gobierno federal algo ineficaz para la era moderna hacen de México la clave para asegurar el dominio continental y la seguridad del hemisferio."
 USA_militarist_operation_clean_streets: "Operación Calles Limpias"
 USA_militarist_operation_clean_streets_desc: "Now that we've secured our southern territories, we must embark on a strict clean up operation to rid the area of massive gang cliques as well as begin to integrate the territories."
 USA_militarist_securing_atlantic_interests: "Asegurar los Intereses del Atlántico"
 USA_militarist_securing_atlantic_interests_desc: "Al proteger las principales naciones insulares de Cuba, Jamaica y La Española, sentamos un precedente de seguridad hemisférica como ningún otro."
 USA_militarist_operation_paradise: "Operación Paraíso"
 USA_militarist_operation_paradise_desc: "La Operación Paraíso consiste en conectar nuevos territorios para facilitar la integración y la utilización inmediata de la infraestructura militar."
 USA_militarist_policing_and_cultural_programs: "Programas de Policía y Cultura"
 USA_militarist_policing_and_cultural_programs_desc: "Our new gains will always be met by those who wish to undermine our nation and its citizens. As such we need to institute cultural programs to promote unity and uniformity as we are human first and not simply American, Cuban and so forth. As a side note, increasing and integrating police as well as military police forces can also help to quell excessive agitation."
 USA_militarist_a_true_leader_of_the_western_world: "Un Verdadero Líder del Mundo Occidental"
 USA_militarist_a_true_leader_of_the_western_world_desc: "To secure our hemisphere we need to also secure the true leadership of the western world. Remember that any attack on a NATO member will be a declaration of war on the whole alliance. So this strike will determine our future. God help us all."
 USA_militarist_operation_great_north: "Operación Gran Norte"
 USA_militarist_operation_great_north_desc: "Con el polvo asentado y nuestra victoria asegurada, ahora podemos comenzar a integrar y asegurar nuestro dominio continental, así como nuestra hegemonía hemisférica."
 USA_militarist_operation_atlantic_viking: "Operación Vikingo del Atlántico"
 USA_militarist_operation_atlantic_viking_desc: "Securing the near-Arctic lands of Greenland and Iceland as well as the Atlantic barrier island of the Faroe Islands will secure our Atlantic connections and allow us to have a more direct logistics network between the new and old worlds."
 USA_militarist_operation_atlantic_wall: "Operación Muro del Atlántico"
 USA_militarist_operation_atlantic_wall_desc: "Con nuestra posición como líderes del mundo occidental asegurada, también debemos asegurarnos de que dicha posición sea estable y sostenible. Por ello, adquiriremos todos los territorios atlánticos y los utilizaremos para controlar la logística, los mercados y las regiones más alejadas del continente. El futuro es ahora y es prometedor."
 USA_militarist_humanity_marches_onwards: "La Humanidad Avanzando"
 USA_militarist_humanity_marches_onwards_desc: "Our mark on the globe is secured, our populations at the very least are content. While the way is not over, we are at a significant point for which we can begin to roll back the hyper militarization and place more of an economic development phase. This is the way and it is this way for which we will reach the stars in the near future. United we stand, divided we all fall."
 USA_fascist_closed_border: "Frontera Cerrada"
 USA_fascist_closed_border_desc: "Para asegurar nuestra nación y su integridad cultural, debemos cerrar la frontera. A partir de ahí, podremos elegir cómo reformar la política de inmigración para comenzar a aceptar a las personas correctas que puedan contribuir a nuestra sociedad."
 USA_fascist_family_planning_incentives: "Incentivos para la Planificación Familiar"
 USA_fascist_family_planning_incentives_desc: "Si de verdad queremos arreglar nuestra nación y presentar un camino nuevo y puro hacia adelante, debemos cuidar de los nuestros en primer lugar. El declive de la tasa de natalidad es un problema global que ocurre cuanto más desarrollada se vuelve una nación. Sin embargo, en lugar de simplemente 'regresar al estado salvaje', como algunos parecen sentir que debemos hacer, crearemos programas para ayudar y asistir a las familias y a los futuros padres. Esto limita la carga sobre las nuevas familias, además de asegurar el futuro de las nuevas generaciones para que no tengan que pasar por graves dificultades debido a factores financieros."
 USA_fascist_encouraging_productivity_quotas: "Fomento de Cuotas de Productividad"
 USA_fascist_encouraging_productivity_quotas_desc: "Our citizens deserve the best products and it is this that we will provide. Fine tooling statistical consumption of known goods and services will allow us to set up quotas in which these luxuries and or common day items will go down in price. This will improve quality of life for all citizens."
 USA_fascist_federal_sponsored_emmigration_programs: "Programas de emigración patrocinados por el gobierno federal"
 USA_fascist_federal_sponsored_emmigration_programs_desc: "Nuestra nación tiene sanguijuelas y parásitos que se alimentan del generoso seno de nuestros contribuyentes y de los benévolos programas federales destinados a cuidar a los miembros activos de nuestra sociedad. Por lo tanto, debemos hacerles una oferta que no puedan rechazar. Apuntando a una mezcla de países con una calidad de vida similar, así como a aquellos con buenos tipos de cambio donde el dólar estadounidense esté más valorado que la moneda del país al que se trasladarán, establecemos la capacidad de librar pacíficamente a nuestra nación del continuo drenaje de recursos en el que se han convertido algunas de estas personas."
 USA_fascist_strategic_automation_programs: "Programas Estratégicos de Automatización"
 USA_fascist_strategic_automation_programs_desc: "La Ley SAP es una iniciativa de automatización dirigida a aumentar la producción de los bienes necesarios para permitir una mejor tendencia hacia el desarrollo de nuestra nación y la calidad de vida de nuestros ciudadanos."
 USA_fascist_forging_new_innovations: "Forjando Nuevas Innovaciones"
 USA_fascist_forging_new_innovations_desc: "El Instituto de Innovaciones es el complejo de I+D del futuro. Establece un nuevo estándar de investigación que nos permitirá mantenernos a la vanguardia de la competencia."
 USA_fascist_the_development_corps: "Cuerpo de Desarrollo"
 USA_fascist_the_development_corps_desc: "La creación del Cuerpo de Desarrollo es una iniciativa federal para reclutar a convictos, voluntarios y desempleados para que contribuyan a mejorar nuestra sociedad. Los convictos pueden intentar cumplir paulatinamente su condena mediante buena conducta durante su servicio en el Cuerpo, y tanto los voluntarios como los desempleados pueden buscar obtener ingresos adicionales o iniciales en momentos de necesidad."
 USA_fascist_developing_prison_workforces: "Desarrollo de la Fuerza Laboral Carcelaria"
 USA_fascist_developing_prison_workforces_desc: "The Department of labor will look to create the Prison Labor Administration or PLA. The PLA will be tasked with creating rehabilitation programs through dedicated job sites. Things like primary and select secondary industries may see workforce substitutions which overall will benefit the wider society."
 USA_fascist_gearing_the_nation_for_survival: "Preparando a la Nación para la Supervivencia"
 USA_fascist_gearing_the_nation_for_survival_desc: "Nuestra nación es pura, nuestros ciudadanos tienen una voluntad y una mente firmes; debemos mostrarles a nuestros enemigos e informarles de la supervivencia que enfrentamos para preservar nuestra forma de vida. El llamado \"mundo occidental\" solo busca limitar nuestra nación y el lugar que merecíamos haber tenido hace siglos. Un nuevo destino se manifestará y nadie nos detendrá."
 USA_fascist_retooling_officer_corps_requirements: "Reajuste de Requisitos para el Cuerpo de Oficiales"
 USA_fascist_retooling_officer_corps_requirements_desc: "Al modificar los requisitos de alistamiento y las oportunidades de ascenso para que se influyan más en las motivaciones ideológicas, establecemos un estándar de uniformidad y unidad en la estructura de mando. Esperamos que esto, tanto en el campo como en el cuartel general, permita un mayor vigor para el logro de los objetivos."
 USA_fascist_ideological_motivation_drills: "Ejercicios de Motivación Ideológica"
 USA_fascist_ideological_motivation_drills_desc: "Al inculcar valores como la lucha de cada soldado y quiénes son los enemigos, podemos crear en nuestros soldados una fuerza de voluntad que la mayoría de los demás países simplemente no pueden recrear. Somos más fuertes porque elegimos serlo. La unión hace la fuerza."
 USA_fascist_improved_logistical_organizations: "Organizaciones Logísticas Mejoradas"
 USA_fascist_improved_logistical_organizations_desc: "Nuestro país es enorme y, independientemente de si nos dirigimos al norte o al sur, los territorios son vastos e inapropiados para el transporte masivo. Por lo tanto, debemos reorganizar y mejorar nuestra logística para garantizar que nuestros soldados reciban todos los materiales necesarios para librar la guerra en cualquier lugar y en cualquier momento."
 USA_fascist_general_weapons_testing_complex: "Complejo General de Pruebas de Armas"
 USA_fascist_general_weapons_testing_complex_desc: "El GWTC es una instalación de pruebas dedicada a mejorar los sistemas de armas militares en general... eso es todo, nada más."
 USA_fascist_phase_two_weapons_testing: "Fase Dos de Pruebas de Armas"
 USA_fascist_phase_two_weapons_testing_desc: "Esto es lo que se llama sacar más provecho a su dinero."
 USA_fascist_engineering_better_engines: "Ingeniería de Mejores Motores"
 USA_fascist_engineering_better_engines_desc: "Mejorar los motores de todos los tamaños nos permite mayor movilidad para aprovechar las brechas en la línea enemiga. Podemos fabricar aeronaves más ágiles y capaces para patrullar y proteger nuestros cielos. Además, podemos mejorar la maniobrabilidad de las naves y la cadencia de patrullaje para asegurarnos de que el enemigo esté siempre alerta."
 USA_fascist_paying_the_dues_our_soldiers_deserve: "Pagando lo que Nuestros Soldados Merecen"
 USA_fascist_paying_the_dues_our_soldiers_deserve_desc: "Nuestros soldados, tanto voluntarios como reclutas, dan su vida por esta nación y, como tales, deben ser tratados como héroes. Su salario debe reflejar el trabajo que realizan para dar la impresión de que su labor es verdaderamente reconocida."
 USA_fascist_militarized_economy: "Economía Militarizada"
 USA_fascist_militarized_economy_desc: "La población está lista y estamos preparando los últimos preparativos. Pronto llegará una nueva era y nuestra seguridad global para el hemisferio occidental estará garantizada."
 USA_fascist_operation_pig_bay_two: "Operación Bahía de los Cerdos Dos"
 USA_fascist_operation_pig_bay_two_desc: "Cuba nos ha eludido desde la fallida operación de la CIA conocida como Bahía de Cochinos. Bueno, ya no, oficialmente mandamos, así que estamos listos para la segunda ronda. Esta vez saldremos victoriosos."
 USA_fascist_operation_hispaniola: "Operación La Española"
 USA_fascist_operation_hispaniola_desc: "Para asegurar nuestra presencia en el Golfo, así como en las naciones circundantes, debemos conquistar la siguiente isla más grande, La Española. Esta contiene las naciones estables e inestables de República Dominicana y Haití. Deberíamos terminar para la hora del almuerzo."
 USA_fascist_operation_makin_me_happy: "Operación Makin Me Happy"
 USA_fascist_operation_makin_me_happy_desc: "To further our reach we must secure the island chain that is the Bahamas as well as the island nation of Jamaica. This gives us a barrier around our initial gains as well as sets the stage for further incursions."
 USA_fascist_operation_clean_sweep: "Operación Barrido Limpio"
 USA_fascist_operation_clean_sweep_desc: "Como una cadena de dominós haremos caer a cada una de estas naciones insulares."
 USA_fascist_extra_territorial_corps: "Cuerpo Extraterritorial"
 USA_fascist_extra_territorial_corps_desc: "The creation of the ETC is to create a dedicated reserve force to allow for the clear and thorough management of our new territories."
 USA_fascist_operation_cartel: "Operación Cártel"
 USA_fascist_operation_cartel_desc: "Now that we've secured the Gulf and Caribbean region, we now can fully focus on our hemispheric advance. From the border we shall strike the fragile Mexican state and make it into a land of law and order once more."
 USA_fascist_operation_fruit_master: "Operación Maestro de Frutas"
 USA_fascist_operation_fruit_master_desc: "Los intereses estadounidenses nunca han abandonado a las naciones centroamericanas. Por razones corporativas o nacionales, Estados Unidos siempre se ha entrometido en los asuntos de estas naciones. Ahora llega la hora del gobierno y el control directos, ya que estas naciones en crisis parecen no tener ningún valor real."
 USA_fascist_operation_amazon: "Operación Amazonas"
 USA_fascist_operation_amazon_desc: "El 'jefe final' del continente sudamericano, Brasil, será nuestro mayor desafío, ya que la logística necesaria para atravesar una tierra tan naturalmente hostil está destinada a causar un impacto inmediato en la calidad de las tropas y en las necesidades logísticas. No obstante, seguiremos adelante y uniremos el hemisferio."
 USA_fascist_operation_la_plata: "Operación La Plata"
 USA_fascist_operation_la_plata_desc: "El penúltimo paso. La región de La Plata y sus alrededores pronto estarán bajo el control."
 USA_fascist_proclaiming_the_union: "Proclamación de la Unión"
 USA_fascist_proclaiming_the_union_desc: "Casi todo el territorio de las Américas es ahora nuestro. La unidad finalmente ha llegado, pero la tarea no ha terminado. Debemos reorganizarnos y fortalecernos internamente y prepararnos para el acto final: la Gran Expedición al Norte."
 USA_fascist_the_final_chapter: "El Capítulo Final"
 USA_fascist_the_final_chapter_desc: "La Unión está declarada, nuestros enemigos en nuestro lado del mundo son pocos. Ahora debemos terminar la tarea y llevar la lucha al viejo mundo si es necesario."
 USA_monarchist_nobility_act: "Ley de la Nobleza"
 USA_monarchist_nobility_act_desc: "The creation of a modern nobility is one that needs careful thinking. As such a modern noble can come from any piece of cloth of society. However each piece will have their own requirements as to be fair to each strata. For example, business tycoons must show proof of investment of a specified amount, to be determined, of growth in the national economy. They must also donate a specified amount to recognized charity organizations like the Red Cross for example. Etc., etc., etc. This is but a sample of the new nobility act and the doors that it'll open for social advancement as well as personal goals to help in life."
 USA_monarchist_tied_to_office_act: "Ley de Vinculación al Cargo"
 USA_monarchist_tied_to_office_act_desc: "La \"Ley de Vinculación al Cargo\" formaliza la secuencia numérica de los títulos. En lugar de la absurda métrica de vincular el título a la sangre, este se vinculará al cargo respectivo o, en el caso de la ley de nobleza, a los requisitos para obtener una licencia de título nobiliario."
 USA_monarchist_workforce_welfare_act: "Ley de Bienestar Laboral"
 USA_monarchist_workforce_welfare_act_desc: "La WWA es una legislación utilizada para reformar y refinar la parte del estado de bienestar en torno a la compensación de la fuerza laboral en relación con la discapacidad y el tiempo libre por maternidad y otras enfermedades incapacitantes relacionadas."
 USA_monarchist_education_investments_act: "Ley de Inversiones en Educación"
 USA_monarchist_education_investments_act_desc: "Las inversiones integrales en nuestro sistema educativo permitirán mejoras a nivel nacional en nuestra economía y en los empleos en los que nuestros ciudadanos pueden participar y también crear ellos mismos."
 USA_monarchist_declaring_the_empire: "Declaración del Imperio"
 USA_monarchist_declaring_the_empire_desc: "Es en este día que realizamos la reforma definitiva. De una República Constitucional a una República Constitucional con una Monarquía Electiva. A partir de este día se nos conoce como \"El Sacro Imperio Americano\"."
 USA_monarchist_readjusting_foreign_trade_policies: "Reajuste de Políticas de Comercio Exterior"
 USA_monarchist_readjusting_foreign_trade_policies_desc: "By using our own natural abundance we can renegotiate trade plans between nations that look to force us into tapping our own reserves. If we can save those reserves for as reasonably long as possible this gives us a long term investment in future trade deals and global economic influences."
 USA_monarchist_penal_labour_corps: "Creación del Cuerpo de Trabajo Penal"
 USA_monarchist_penal_labour_corps_desc: "Al crear programas de rehabilitación en torno a proyectos laborales, podemos mejorar la infraestructura pública o avanzar en la productividad de las industrias primarias. Por lo tanto, podemos beneficiar la calidad de vida general de nuestros ciudadanos al devolver más bienes a la producción nacional."
 USA_monarchist_creating_more_domestic_supply_chains: "Creación de Más Cadenas de Suministro Domésticas"
 USA_monarchist_creating_more_domestic_supply_chains_desc: "Enfocarse en diversificar la composición económica local mediante la creación de nuevas cadenas de suministro nacionales permite que nuestra nación sea más autosuficiente, además de irrumpir en mercados que antes pensábamos que estaban dominados únicamente por un conjunto selecto de naciones."
 USA_monarchist_expanding_military_education_programs: "Expansión de Programas de Educación Militar"
 USA_monarchist_expanding_military_education_programs_desc: "By expanding and potentially mandating the leadership programs known as the Junior Reserve Officer Training Corps or JROTC for short, we open the volunteering rate to be expanded through passive exposure to the military. As a bonus we can also teach future generations leadership skills which are just as viable in the civilian workforce as they would be in the military."
 USA_monarchist_army_investments: "Inversiones en el Ejército"
 USA_monarchist_army_investments_desc: "Al aumentar la financiación y dirigirla hacia mejoras relacionadas con el soldado promedio de infantería, podemos empezar a mejorar las capacidades de combate de las que cada soldado será, efectivamente, capaz."
 USA_monarchist_baby_stepping_mandatory_service: "Servicio Obligatorio por Pasos"
 USA_monarchist_baby_stepping_mandatory_service_desc: "El país ha contado con una fuerza totalmente voluntaria durante casi toda su existencia. Sin embargo, dado que las guerras y los enemigos modernos son tan confusos y desconocidos, lo mejor es ser proactivos en lugar de reactivos. Por consiguiente, se promulgará legislación para instituir un período de servicio obligatorio de cuatro meses para, al menos, familiarizar a la población con los aspectos más básicos de la vida militar."
 USA_monarchist_naval_investments: "Inversiones Navales"
 USA_monarchist_naval_investments_desc: "Mejorar nuestra destreza y habilidades navales nos permitirá atacar preventivamente cualquier fuerza de invasión enemiga, esté o no de este lado del mundo."
 USA_monarchist_improving_shipping_industries: "Mejora de las Industrias Navieras"
 USA_monarchist_improving_shipping_industries_desc: "Al invertir y establecer mejores contratos, esperamos mejorar la industria naviera y naval de nuestro país. Esto nos ayudará tanto en el ámbito civil como en el militar a medida que nos esforzamos por navegar la era moderna de enredos geopolíticos."
 USA_monarchist_hemispheric_influence: "Influencia Hemisférica"
 USA_monarchist_hemispheric_influence_desc: "A través del poder blando y de influencias sutiles, podemos intentar controlar el hemisferio en el que ya tenemos una influencia mayoritaria, de una manera más directa."
 USA_monarchist_the_northern_kingdom_agreement: "Acuerdo del Reino del Norte"
 USA_monarchist_the_northern_kingdom_agreement_desc: "El 'imperio del norte', también conocido como las vastas tierras de Canadá, debería estar más alineado con las necesidades del hemisferio occidental. Como tal, debemos intentar presionarlos y ayudarlos a comprender que los británicos ya hace tiempo que dejaron de tener la presencia significativa que una vez ostentaron. No obstante, podemos dejar que formen parte de una nueva era de unidad, comercio e innovación. Debemos convencerlos; tenemos que convencerlos."
 USA_monarchist_the_southern_kingdom_agreement: "Acuerdo del Reino del Sur"
 USA_monarchist_the_southern_kingdom_agreement_desc: "La disposición de México nunca ha sido realmente positiva, por así decirlo. Podemos utilizar esto para asegurar el orden público y la estabilidad en su nación, así como lanzar iniciativas comerciales para demostrar que nos tomamos en serio el ayudarlos para el mejoramiento de todos. Solo esperemos que lo entiendan, eso es todo."
 USA_monarchist_the_federation_proposal: "Propuesta de la Federación"
 USA_monarchist_the_federation_proposal_desc: "A pesar de la animosidad histórica, podemos hacer todo lo posible para intentar convencer a Cuba de que nuestras intenciones son buenas y de que deseamos una agenda más favorable para el hemisferio occidental. Lo que les beneficie a ellos beneficiará al hemisferio en general. También podemos endulzar el trato dándoles luz verde para consolidar el Caribe. Solo esperemos que sea lo suficientemente dulce para ellos."
 USA_monarchist_the_united_principalities_offer: "Oferta de los Principados Unidos"
 USA_monarchist_the_united_principalities_offer_desc: "Al liderar las conversaciones con Panamá, un país con el que hemos tenido una historia relativamente positiva en términos generales, podemos crear una federación o unión de estados en Centroamérica, liderada por ellos y con la ayuda de nosotros para mantener el orden."
 USA_monarchist_brazi_comes_to_you: "Brasil Viene a Ti"
 USA_monarchist_brazi_comes_to_you_desc: "Todo el mundo dice que Brasil es un mal lugar, incluso hay un chiste que dice 'te vas para Brasil'. Bueno, nosotros queremos que Brasil venga a ellos. Le ofreceremos a Brasil la capacidad de consolidar la mitad sur del continente y protegeremos sus intereses, liderando el camino en una unión hemisférica común."
 USA_monarchist_operation_screaming_eagle: "Operación Águila Rugiente"
 USA_monarchist_operation_screaming_eagle_desc: "Durante demasiado tiempo, el mundo ha estado alterándose en nuestro hemisferio, agitando y diluyendo nuestros esfuerzos por crear un estado de cosas más pacífico. Claro que hemos cometido errores en el pasado, pero ya no. Tomaremos medidas más drásticas y directas para asegurar el camino y el destino que crearemos. El nuevo mundo se renovará una vez más."
 USA_monarchist_operation_initial_gains: "Operación Ganancias Iniciales"
 USA_monarchist_operation_initial_gains_desc: "Hemos tenido tiempo de construir nuestras fuerzas y preparar a nuestros aliados, ahora es el momento de extender nuestras alas y consolidar los continentes."
 USA_monarchist_economic_investments: "Inversiones Económicas"
 USA_monarchist_economic_investments_desc: "Today we will spearhead the new Western Hemispheric Economic Program. We will facilitate and encourage the development of our new and closest allies and subjects, so we can all prosper together."
 USA_monarchist_public_unity_programs: "Programas de Unidad Pública"
 USA_monarchist_public_unity_programs_desc: "El PUP es un programa de ayuda mutua dedicado a fomentar la unidad pública dentro de las nuevas naciones, así como a promover la nueva identidad hemisférica del \"Nuevo Mundo\". Este valor compartido de formar parte de la nueva unión impulsará nuestro desarrollo y comprensión mutua, además de marcar el inicio de una nueva era que trasciende el planeta. Porque si todos trabajamos juntos, ¿en qué podemos centrarnos realmente sino en el más allá?"
 USA_monarchist_operation_midtown_madness: "Operación Locura en el Centro"
 USA_monarchist_operation_midtown_madness_desc: "La siguiente fase de consolidación ya está aquí. Mientras Cuba y Panamá tienen múltiples naciones con las que guerrear, el terreno es mucho más difícil para Colombia y Brasil. Por lo tanto, limitaremos sus bajas atacando a sus enemigos."
 USA_monarchist_operation_new_world: "Operación Nuevo Mundo"
 USA_monarchist_operation_new_world_desc: "La fase final de consolidación ha llegado. Ahora es el momento de que nuestros aliados y súbditos de confianza consoliden el resto del nuevo mundo para que podamos allanar el camino hacia un futuro nuevo y unido."
 USA_monarchist_continued_economic_ties: "Lazos Económicos Continuos"
 USA_monarchist_continued_economic_ties_desc: "Para fortalecer nuestra cooperación y vínculos económicos, iniciaremos el Nuevo Intercambio Económico Mundial (NWEE). Este programa optimizará los esfuerzos de desarrollo y seguirá trabajando en la creación de la base fundamental de la identidad del Nuevo Mundo."
 USA_monarchist_a_new_world_mineral_order: "Un Nuevo Orden Mineral Mundial"
 USA_monarchist_a_new_world_mineral_order_desc: "Para demostrar nuestro compromiso con nuestros aliados y súbditos, realizaremos una inversión minera masiva en todo el hemisferio. Será bastante costosa, pero sin duda vale la pena."
 USA_red_junta_the_commissariat_declaration: "Declaración del Comisariado"
 USA_red_junta_the_commissariat_declaration_desc: "Nosotros, las fuerzas armadas populares, hemos tomado el control y deseamos mejorar y asegurar la vida de los trabajadores. Por lo tanto, para comprender plenamente este compromiso, nos convertiremos en los Comisariados Unidos de América. Una fuerza militar popular unida que vela por el bienestar y la seguridad de sus ciudadanos."
 USA_red_junta_service_welfare_programs: "Programas de Bienestar del Servicio"
 USA_red_junta_service_welfare_programs_desc: "Para garantizar que el número de personal se mantenga dentro de niveles razonables, comenzaremos a ampliar ciertos incentivos que ofrece el ejército. En general, no esperamos un cambio significativo, pero en general debería incentivar el reclutamiento y, al mismo tiempo, retribuir mejor a quienes se reincorporan a la fuerza laboral civil."
 USA_red_junta_public_service_corps: "Cuerpo de Servicio Público"
 USA_red_junta_public_service_corps_desc: "El PSC es una especie de cuerpo de trabajo o cuerpo conjunto de ingenieros civiles y militares. Su objetivo es contribuir a proyectos de desarrollo o al mantenimiento de infraestructuras."
 USA_red_junta_improved_service_health_programs: "Programas Mejorados de Salud del Servicio"
 USA_red_junta_improved_service_health_programs_desc: "Investing in our healthcare programs around service members and former service members will hopefully increase recruiting numbers by incentivizing care both in and once you're out of the military."
 USA_red_junta_industrious_innovators_act: "Ley de Innovadores Industriosos"
 USA_red_junta_industrious_innovators_act_desc: "El IIA es un proyecto de ley de legislación y financiación para promover innovaciones económicas y formas de mejorar nuestra producción económica."
 USA_red_junta_industrial_expansion_fund: "Fondo de Expansión Industrial"
 USA_red_junta_industrial_expansion_fund_desc: "El IEF es un fondo dedicado a crear nuevos proyectos de desarrollo económico y mejorar no sólo los empleos disponibles, sino también mejorar nuestra composición económica."
 USA_red_junta_infrastructure_improvement_fund: "Fondo de Mejora de Infraestructura"
 USA_red_junta_infrastructure_improvement_fund_desc: "Al dedicar mejor los fondos al desarrollo de infraestructura, podremos mejorar en general nuestra producción económica general ya que las cadenas de suministro tendrán formas mejores y más fluidas de interconectarse entre sí."
 USA_red_junta_strategic_resource_development_act: "Ley de Desarrollo de Recursos Estratégicos"
 USA_red_junta_strategic_resource_development_act_desc: "La SRDA es un esfuerzo dedicado de financiación y desregulación para fomentar y casi obligar a la mejora de la extracción de minerales en la mitad oriental de los EE. UU. Específicamente a lo largo de los estados intermedios entre lo que se consideran estados del 'norte' y del 'sur'."
 USA_red_junta_strategic_resource_western_development_act: "Ley de Desarrollo del Oeste"
 USA_red_junta_strategic_resource_western_development_act_desc: "La WDA es una continuación de la SRDA en el sentido de que prosigue con la tendencia occidental de desarrollo estratégico, continuando a lo largo de los estados intermedios como Colorado, Utah, etc."
 USA_red_junta_rotating_training_programs: "Programas de Entrenamiento Rotativo"
 USA_red_junta_rotating_training_programs_desc: "Al establecer un sistema de entrenamiento rotativo, podemos mejorar la efectividad general de nuestras tropas. El RTP se enfoca en diversificar los entrenamientos en terrenos a los que se expondrán nuestras tropas. In pocas palabras, un día o algunos días podrían estar entrenando en un pantano, y al siguiente podría ser en un desierto."
 USA_red_junta_officer_refinement_program: "Programa de Refinamiento de Oficiales"
 USA_red_junta_officer_refinement_program_desc: "Al trabajar incansablemente para perfeccionar y mejorar nuestro liderazgo, podemos garantizar que el mando y control de nuestras fuerzas armadas sea lo más eficiente posible. Esto debería beneficiar a todas las ramas, siempre que sea posible, en la toma de decisiones instantáneas, así como en la evaluación y gestión de riesgos en el campo de batalla."
 USA_red_junta_army_advancements_program: "Programa de Avance del Ejército"
 USA_red_junta_army_advancements_program_desc: "El AAP es una inversión integral en la mejora general de nuestra rama militar. Los sistemas de armas, el equipo y los soldados son apenas piezas del rompecabezas que deseamos completar."
 USA_red_junta_increased_training_programs: "Programas de Entrenamiento Aumentados"
 USA_red_junta_increased_training_programs_desc: "Incrementar y mantenernos al tanto de nuestros programas de entrenamiento naval, tanto en escenarios de combate como de no combate, familiariza mejor a los soldados con los buques a los que están asignados. Por consiguiente, realizar evaluaciones de mantenimiento y combate de la tripulación de cada buque permite a nuestro personal naval superarse a sí mismo, en la medida de nuestra capacidad para proporcionarles las herramientas para hacerlo."
 USA_red_junta_naval_propulsion_program: "Programa de Propulsión Naval"
 USA_red_junta_naval_propulsion_program_desc: "El NPP es un programa de investigación dedicado a mejorar los motores y sistemas de propulsión de nuestros buques de guerra para darles una ventaja de combate en maniobrabilidad."
 USA_red_junta_naval_gun_research_initiative: "Iniciativa de Investigación en Artillería Naval"
 USA_red_junta_naval_gun_research_initiative_desc: "Nuestro personal naval es solo una pieza del rompecabezas del poder. Debemos mejorar nuestros sistemas de armas navales si queremos defendernos realmente, y mucho menos derrotar a una fuerza enemiga."
 USA_red_junta_improved_armaments: "Armamentos Mejorados"
 USA_red_junta_improved_armaments_desc: "Al actualizar y mejorar nuestros sistemas de armas de aeronaves podemos mejorar nuestra eficacia general en escenarios de combate."
 USA_red_junta_bettering_aircraft_models: "Mejora de Modelos de Aeronaves"
 USA_red_junta_bettering_aircraft_models_desc: "La modernización de nuestros modelos de aeronaves existentes nos permite garantizar maniobras aéreas más ágiles para proteger eficazmente una zona aérea de la fuerza enemiga."
 USA_red_junta_further_airforce_investments: "Más Inversiones en la Fuerza Aérea"
 USA_red_junta_further_airforce_investments_desc: "Al aumentar nuestras inversiones generales hacia nuestra rama de servicio de la fuerza aérea, establecemos un nuevo estándar de mejora y avance que la fuerza puede alcanzar potencialmente a medida que pasa el tiempo y la inversión continúa."
 USA_red_junta_establishing_the_warplanning_department: "Departamento de Planificación de Guerra"
 USA_red_junta_establishing_the_warplanning_department_desc: "Ahora que hemos ampliado suficientemente nuestro poder económico y militar, podemos ocuparnos de la idea de extender la revolución a los más necesitados."
 USA_red_junta_war_plan_maple_leaf: "Plan de Guerra Hoja de Arce"
 USA_red_junta_war_plan_maple_leaf_desc: "Como parte del Departamento del Nuevo Mundo, dependiente del Departamento de Planificación de Guerra, el objetivo inicial es asegurar el extremo norte, garantizando al máximo nuestra situación estratégica."
 USA_red_junta_war_plan_cartel_cleanup: "Plan de Guerra Limpieza del Cártel"
 USA_red_junta_war_plan_cartel_cleanup_desc: "Para continuar asegurando nuestra posición estratégica, la posición abiertamente desestabilizada de nuestro vecino del sur es una gran preocupación para nuestra seguridad nacional. Sin importar las implicaciones de que un enemigo extranjero utilice a México como trampolín, los cárteles y la naturaleza casi tribal de una gran franja de territorio mexicano son motivo suficiente para resolver las cosas de una vez por todas."
 USA_red_junta_war_plan_havana: "Plan de Guerra La Habana"
 USA_red_junta_war_plan_havana_desc: "La isla cubana es la más grande del Caribe y ocupa una posición estratégica. No solo es la puerta de entrada al Golfo de México, sino también una barrera para el océano Atlántico. Por ello, debemos asegurarla para la red portuaria y naval definitiva, que asegurará el comercio y la paz en el hemisferio occidental tal como la conocemos."
 USA_red_junta_war_plan_homeward_bound: "Plan de Guerra Regreso a Casa"
 USA_red_junta_war_plan_homeward_bound_desc: "Comenzamos el siguiente capítulo de nuestro gran avance. Regresando al viejo mundo y completando la labor que nuestros predecesores no pudieron realizar, difundiendo los valores del socialismo económico a las masas europeas."
 USA_red_junta_war_plan_round_three: "Plan de Guerra Tercera Ronda"
 USA_red_junta_war_plan_round_three_desc: "Two world wars and yet they still haven't learned their lesson. Well on the plus side, it wasn't their fault this time, it's just good business is all."
 USA_red_junta_war_plan_black_back_hand: "Plan de Guerra Mano Negra"
 USA_red_junta_war_plan_black_back_hand_desc: "La Mano Negra era una sociedad secreta fundada en el nacionalismo serbio y el fervor antiaustrohúngaro. Si bien ellos iniciaron una guerra mundial, nosotros culminaremos la paz en los Balcanes asentando al miembro más agresivo. Después de todo, \"donde hay un serbio, hay Serbia\" no parece más que imperialismo."
 USA_red_junta_war_plan_outback: "Plan de Guerra Outback"
 USA_red_junta_war_plan_outback_desc: "El \"continente\" australiano es solo un paso hacia la estabilidad en el Pacífico y el Lejano Oriente. Por lo tanto, debemos dar el primer paso ahora, no más tarde."
 USA_red_junta_war_plan_java: "Plan de Guerra Java"
 USA_red_junta_war_plan_java_desc: "Indonesia es la nación más grande del archipiélago, lo que prácticamente crea un camino despejado desde Australia hacia China. Debemos asegurar esta nación si queremos tener un punto de partida adecuado para la batalla final."
 USA_red_junta_war_plan_great_leap_forward: "Plan de Guerra Gran Salto Adelante"
 USA_red_junta_war_plan_great_leap_forward_desc: "El jefe final, la 'gran China'. Bueno, dejará de ser grande cuando extendamos el verdadero socialismo económico y no este totalitarismo pseudocultista con características chinas. Mao dio un gran salto adelante para hacer avanzar a la nación de China, bueno, ahora es el momento de dar nuestro gran salto adelante para asegurar la paz mundial y el verdadero futuro de los valores socialistas."
 USA_red_junta_war_peace_in_our_time: "Paz en Nuestro Tiempo"
 USA_red_junta_war_peace_in_our_time_desc: "Con el Nuevo Mundo, el Viejo Mundo y el Lejano Oriente ahora asegurados, con áreas estratégicas y amenazas importantes contenidas, podemos establecer el cuerpo de comisariado global para devolver estas tierras a lugares de vida más pacíficos y reservados. Consolidaremos los acuerdos de paz global y estableceremos un nuevo camino para nuestra especie."
 USA_american_trotskist_reindustrialization_priority: "Prioridad de Reindustrialización"
 USA_american_trotskist_reindustrialization_priority_desc: "La nación ha perdido su poderío industrial; debemos y vamos a solucionar esto para lograr nuestros objetivos."
 USA_american_trotskist_national_economic_revival_act: "Ley de Revitalización Económica Nacional"
 USA_american_trotskist_national_economic_revival_act_desc: "La NERA es una legislación para un paquete de gasto agresivo para promover la industrialización en todo el país."
 USA_american_trotskist_securing_our_resources: "Asegurar Nuestros Recursos"
 USA_american_trotskist_securing_our_resources_desc: "Al limitar el comercio al mínimo indispensable, podemos empezar a crear cadenas de suministro nacionales más desarrolladas. En consecuencia, esto también nos permite invertir mejor en las operaciones mineras para aumentar la producción general."
 USA_american_trotskist_national_armaments_expansion_act: "Ley de Expansión de Armamentos Nacional"
 USA_american_trotskist_national_armaments_expansion_act_desc: "La NAEA es un proyecto de ley de financiación para expandir nuestra base industrial militar. Este factor clave de nuestro poder económico asegurará el futuro que nos espera."
 USA_american_trotskist_national_naval_industrialization_act: "Ley de Industrialización Naval Nacional"
 USA_american_trotskist_national_naval_industrialization_act_desc: "La NNIA es un proyecto de ley de financiación específica para ampliar y mejorar nuestra base industrial naval y naviera. Debemos proteger el comercio y las aguas que nos rodean."
 USA_american_trotskist_the_red_army: "El Ejército Escarlata"
 USA_american_trotskist_the_red_army_desc: "Our scarlet banners will fly high as our troops are drilled and training to be the utmost aggression in tactical maneuvering where and when possible."
 USA_american_trotskist_the_red_navy: "La Armada Escarlata"
 USA_american_trotskist_the_red_navy_desc: "Al mejorar los medios de entrenamiento y adaptar a los soldados para que comprendan la esencia de la causa por la que luchan, inculcaremos el sentido del deber y el fervor para luchar donde la mayoría de las naciones fracasan. En consecuencia, reorientar parte del presupuesto naval hacia una métrica más centrada en I+D nos permite mejorar los sistemas de armas de nuestros buques."
 USA_american_trotskist_the_red_airforce: "La Fuerza Aérea Escarlata"
 USA_american_trotskist_the_red_airforce_desc: "Al invertir en I+D relacionado con nuestras aeronaves y sus sistemas de armas, podemos mejorar las capacidades de combate de nuestra fuerza aérea centrándonos en ventajas tácticas agresivas."
 USA_american_trotskist_national_mobilization: "Movilización Nacional"
 USA_american_trotskist_national_mobilization_desc: "La nación ha sido refinada, ahora debemos prepararla para la Gran Lucha."
 USA_american_trotskist_the_commissar_corps: "Cuerpo de Comisarios"
 USA_american_trotskist_the_commissar_corps_desc: "La creación del CAC o Cuerpo de Comisarios del Ejército es una excelente manera de motivar a los líderes y soldados a defender aquello que sus vidas están destinadas a proteger: sus familias, hogares y valores, que nos esforzamos por mantener en el corazón de todos."
 USA_american_trotskist_the_permanent_revolution: "La Revolución Permanente"
 USA_american_trotskist_the_permanent_revolution_desc: "The die has been cast and now we must usher in a new age of peace, through revolution we will secure the global position of the Socialist State and its peoples."
 USA_american_trotskist_marching_south: "Marchando hacia el Sur"
 USA_american_trotskist_marching_south_desc: "Así, las fichas de dominó caerán a medida que empecemos a liberar al Nuevo Mundo y sus desesperados intentos de \"socialismo\", sus autócratas imperialistas y sus mestizos occidentales como gobiernos. Avanzaremos rápidamente hacia el Canal de Panamá y estaremos a las puertas del continente sudamericano."
 USA_american_trotskist_workers_paradise: "Paraíso de los Trabajadores"
 USA_american_trotskist_workers_paradise_desc: "El fallido Estado Socialista de Cuba es una mancha en el socialismo. El resto son una mezcla de perros falderos británicos y franceses, y meros explotadores. Los usaremos para abrirnos paso a saltos y rodear lentamente el continente sur por tierra y mar."
 USA_american_trotskist_new_world_order: "Nuevo Orden Mundial"
 USA_american_trotskist_new_world_order_desc: "Al situarnos a las puertas de Sudamérica, irrumpiremos en estas puertas que hemos creado y nos propusimos crear un nuevo orden en el nuevo mundo. ¡Viva la Revolución!"
 USA_american_trotskist_the_eagle_descends_onto_the_continent: "El Águila Desciende sobre el Continente"
 USA_american_trotskist_the_eagle_descends_onto_the_continent_desc: "The weakest and yet richest link to securing the permanent revolution. Africa is a vast and diverse land and as such we must establish a good sector of control if we are to continue securing the Socialist World Revolution."
 USA_american_trotskist_the_northern_cleanup: "Limpieza del Norte"
 USA_american_trotskist_the_northern_cleanup_desc: "Asegurar la parte norte del continente nos da acceso a Oriente Medio y al Mediterráneo para el eventual regreso al Viejo Mundo."
 USA_american_trotskist_operation_congo_cabal: "Operación Cábala del Congo"
 USA_american_trotskist_operation_congo_cabal_desc: "La Operación Cabal del Congo es la liberación de la región de África Central del control gubernamental imperialista, capitalista y acérrimo antiobrero."
 USA_american_trotskist_operation_geographic_horn: "Operación Cuerno Geográfico"
 USA_american_trotskist_operation_geographic_horn_desc: "El Cuerno de África, o simplemente África Oriental, abrirá nuestras influencias hacia Asia y el Pacífico desde ahora ambos lados del globo."
 USA_american_trotskist_operation_capetown: "Operación Ciudad del Cabo"
 USA_american_trotskist_operation_capetown_desc: "Con el Nuevo Mundo asegurado, ahora tenemos la oportunidad de asegurar dos tercios del acceso al polo sur. Esta seguridad nos permitirá prevenir misiones extranjeras y nos dará mayor alcance para llevar a cabo nuestras propias misiones y, probablemente, explorar recursos naturales."
 USA_american_trotskist_operation_old_world: "Operación Viejo Mundo"
 USA_american_trotskist_operation_old_world_desc: "Al asegurar los últimos fragmentos del Nuevo Mundo, potencialmente también incorporamos el Viejo Mundo, por lo tanto debemos ser proactivos y establecer una base de la cual surgió la anglósfera de nuestra herencia."
 USA_american_trotskist_operation_norse: "Operación Nórdica"
 USA_american_trotskist_operation_norse_desc: "Desde nuestro punto de apoyo en las islas celtas, podemos continuar nuestra gran expedición al norte y liberar a las naciones escandinavas."
 USA_american_trotskist_operation_west_has_fallen: "Operación El Oeste Ha Caído"
 USA_american_trotskist_operation_west_has_fallen_desc: "Desde nuestra posición en las islas, ahora podemos establecer una clara posición en el continente con las naciones más occidentales. La liberación del viejo mundo será rápida y justa."
 USA_american_trotskist_operation_black_sea: "Operación Mar Negro"
 USA_american_trotskist_operation_black_sea_desc: "Desde el extremo norte descenderemos y crearemos un muro de liberación que divida la autocracia perpetua del Estado ruso y el resto de Europa que liberaremos."
 USA_american_trotskist_operation_vistula: "Operación Vístula"
 USA_american_trotskist_operation_vistula_desc: "Hoy comienza nuestra marcha hacia el este, comenzando a liberar el corazón del Viejo Mundo. Desde las \"democracias\" oligárquicas hasta los explotadores capitalistas, liberaremos a los pueblos del viejo mundo uno por uno."
 USA_american_trotskist_operation_cradle: "Operación Cuna"
 USA_american_trotskist_operation_cradle_desc: "La cuna de la civilización, y sin embargo, está llena de algunos de los pueblos y gobiernos más destructivos. Pues basta, liberaremos y traeremos la verdadera civilización a los trabajadores de estas tierras y crearemos un nuevo futuro. Un futuro brillante y escarlata para todos."
 USA_american_trotskist_operation_sarajevo: "Operación Sarajevo"
 USA_american_trotskist_operation_sarajevo_desc: "Se inició una guerra mundial en los Balcanes, ahora pretendemos liberarlos y evitar más muertes y destrucción innecesaria."
 USA_american_trotskist_operation_caging_the_bear: "Operación Enjaular al Oso"
 USA_american_trotskist_operation_caging_the_bear_desc: "The Russian State, once the Union of Soviet Socialist Republics, is a failure and a stain on the Socialist name. We shall liberate her peoples, cage the autocrats and Capitalist exploiters and wipe the stain from the face of the planet."
 USA_american_trotskist_operation_himalayas: "Operación Himalayas"
 USA_american_trotskist_operation_himalayas_desc: "Con la puerta norte asegurada, podemos crear la puerta sur. Desde aquí nos prepararemos para el último obstáculo que impide la liberación global."
 USA_american_trotskist_operation_great_leap_forward: "Operación Gran Salto Adelante"
 USA_american_trotskist_operation_great_leap_forward_desc: "El jefe final, sus subordinados y las misiones secundarias. La República Popular China es la mayor mancha que le ha caído a la palabra socialismo tras el fracaso que supuso la Unión Soviética. Liberaremos y debemos liberar sus tierras y a su pueblo si queremos terminar adecuadamente cualquier revolución global. Después de este 'jefe final', nada se interpondrá en nuestro camino hacia el verdadero comunismo y la paz y prosperidad mundiales. A partir de aquí, el único límite son las estrellas."
 USA_not_have_republicans_in_charge_TT: "§Y[conservatism_L]§! no es el partido gobernante"
 USA_not_have_democrats_in_charge_TT: "§Y[liberalism_L]§! no es el partido gobernante"
 USA_idea_light_infantry_dominance: "Dominio de la infantería ligera"
 USA_idea_light_infantry_dominance_desc: "De bajo costo de mantenimiento y equipamiento, con flexibilidad en su capacidad de entrenamiento y armamento, la Infantería Ligera es la piedra angular de la guerra moderna, que parece ser la más débil. La convertiremos en tal, donde la más débil ahora es la líder de la manada, con innovaciones en la organización de unidades, logística y nuevas armas para cualquier situación necesaria. Saldremos victoriosos en estos aspectos."
 USA_idea_mobile_infantry_doctrine: "Doctrina de Infantería Móvil"
 USA_idea_mobile_infantry_doctrine_desc: "El uso de la movilidad de los vehículos utilitarios y de los vehículos de transporte ligeros, así como la versatilidad de armar al soldado raso común con las necesidades del campo de batalla moderno, garantiza un ejército integral y flexible para el futuro."
 USA_idea_armored_infantry_supremacy: "Supremacía de Infantería Blindada"
 USA_idea_armored_infantry_supremacy_desc: "Tanks are expensive, both to develop and to deploy and risk losing on the battlefield. But what if the average foot soldier was a tank, or at the very least the average infantry squad was a \"tank\" of sorts."
 USA_idea_repurposing_armored_programs: "Directiva de Reutilización de Programas Blindados"
 USA_idea_repurposing_armored_programs_desc: "La directiva RAP es detener toda la producción de tanques para comenzar la reestructuración de la fabricación y la organización militar en torno a vehículos blindados más ligeros y la unidad de infantería estándar."
 USA_idea_tank_rehabilitation_programs: "Programas de Rehabilitación de Tanques"
 USA_idea_tank_rehabilitation_programs_desc: "The TRPs are designed to refine and make more efficient, the production and force utilization of tank and or heavily armored units as a whole. At the cost of cutting back on more lighter vehicles, our tank force will be the stead fast companion of our infantry."
 USA_idea_revitalized_artillery_innovations: "Innovaciones Revitalizadas en Artillería"
 USA_idea_revitalized_artillery_innovations_desc: "A través de inversiones y programas dedicados de investigación y desarrollo, nuestra artillería se convertirá en la antigua versión renovada y dominará el campo de batalla moderno."
 USA_idea_light_vehicle_innovations: "Innovaciones en Vehículos Ligeros"
 USA_idea_light_vehicle_innovations_desc: "La iniciativa LVI se propone centrar más la I+D en el desarrollo y la adaptación de vehículos blindados más ligeros, como los IFV y los APC, para que sean más flexibles y adaptables. Esto implica convertir nuestra fuerza de tanques en una fuerza especial, en lugar de una subdivisión importante del ejército."
 USA_idea_tank_innovations: "Innovaciones en Tanques"
 USA_idea_tank_innovations_desc: "Al centrar la financiación en tanques y equivalentes de tanques, podemos crear una fuerza versátil, potente y contundente."
 USA_idea_mass_motorization_efforts: "Esfuerzos de motorización masiva"
 USA_idea_mass_motorization_efforts_desc: "Mediante la estandarización y un mayor esfuerzo de concentración, ahora podemos convertir nuestro ejército en una fuerza verdaderamente móvil."
 USA_idea_defensive_artillery_program: "Programa de Artillería Defensiva"
 USA_idea_defensive_artillery_program_desc: "Un programa de I+D diseñado para la supervivencia de las piezas de artillería y, en particular, de sus tripulaciones, con miras a su influencia y eficacia en el campo de batalla. Esto incluye aspectos como la fabricación de equipos, el alcance efectivo en primera línea y la facilidad de maniobra."
 USA_idea_offensive_artillery_program: "Programa de Artillería Ofensiva"
 USA_idea_offensive_artillery_program_desc: "El OAP es un programa de I+D diseñado para mejorar la supervivencia mediante medios ofensivos. La guerra moderna está en constante movimiento y, por lo tanto, también debería estarlo la propia artillería. Las unidades de artillería autopropulsada modernas serán la columna vertebral de la maniobrabilidad y la supervivencia mediante la investigación de nuevas innovaciones en blindaje y motores, no solo para apoyar al \"cañón de cristal\" de nuestro ejército, sino también al resto de nuestras fuerzas motorizadas."
 USA_idea_maneuver_logistics: "Logística de Maniobra"
 USA_idea_maneuver_logistics_desc: "Al crear redes de suministro y logística más maniobrables, podemos descentralizar mejor y atender las necesidades de nuestro ejército en un campo de batalla que cambia rápidamente."
 USA_idea_defense_support_force: "Apoyo especializado de defensa de primera línea"
 USA_idea_defense_support_force_desc: "SFDP, la nueva designación de la subdivisión de las Fuerzas Especiales y su función de combate dentro de la rama de servicio del Ejército de los EE. UU. Diseñada para apoyar posiciones defensivas y posibles cercos de fuerzas aliadas siempre que sea posible, por cualquier medio disponible."
 USA_idea_precision_strike_force: "Fuerza de Ataque de Precisión"
 USA_idea_precision_strike_force_desc: "By equipping our SFG units with top of the line stuff and giving them the ultimate training regimen, we set a standard of strike and execution of force."
 USA_idea_steamlining_naval_production: "Optimización de la Producción Naval"
 USA_idea_steamlining_naval_production_desc: "Through retooling and dedication we can better adapt and streamline production, refitting as well as repairing of our vessels and get them out to where they need to be."
 USA_idea_frigate_fighter_groups: "Grupos de Combate de Fragatas"
 USA_idea_frigate_fighter_groups_desc: "La fragata va a ser nuestra columna vertebral, por lo tanto debemos apoyar nuestra columna vertebral con el cuidado adecuado y los recursos necesarios para hacerla lo más fuerte posible."
 USA_idea_corvette_combat_prowess: "Prowesa de Combate de Corbetas"
 USA_idea_corvette_combat_prowess_desc: "Corbetas ágiles, rápidas y modulares. Estos son los atributos que hacen que el acero de un océano tenga la capacidad de combate de un portaaviones moderno. Por ello, adaptaremos, invertiremos y expandiremos el uso de nuestras corbetas, tanto presentes como futuras, para crear la mejor armada del mundo, una vez más."
 USA_idea_attack_fleet_investments: "Inversiones en Flotas de Ataque"
 USA_idea_attack_fleet_investments_desc: "¡Los volaremos del agua antes de que sepan qué los golpeó!"
 USA_idea_missile_fleet_investments: "Inversiones en Flotas de Misiles"
 USA_idea_missile_fleet_investments_desc: "¡Iceberg en el horizonte, Capitán! \"Pues bien, vuélalo\"."
 USA_idea_mobile_airports_program: "Programa de Aeropuertos Móviles"
 USA_idea_mobile_airports_program_desc: "El MAP es un programa de I+D dedicado a hacer que nuestros portaaviones sean básicamente como un coche de payaso: cuanto más podamos montar, más daño podremos causar."
 USA_idea_project_gunship: "Proyecto Helicóptero de Ataque"
 USA_idea_project_gunship_desc: "Ágil y mortal, así es como me gusta."
 USA_idea_modern_marine_corps: "Cuerpo de Marines Moderno"
 USA_idea_modern_marine_corps_desc: "Lo mismo, un día diferente, juguetes nuevos y elegantes para romper el espíritu de los enemigos... y sus caras también."
 USA_idea_brothers_in_arms: "Hermanos de Armas"
 USA_idea_brothers_in_arms_desc: "Marines o Ejército, todos siguen siendo soldados del Tío Sam. Sin embargo, el Cuerpo de Marines podría ayudar a entrenar y mejorar el ejército, creando así una fuerza unificada y combinada para sacudir cualquier campo de batalla al que se presenten."
 USA_idea_project_modular: "Proyecto Modular"
 USA_idea_project_modular_desc: "Welcome to Build A Craft, where you can custom design your aircraft to your hearts content."
 USA_idea_aia_phase_one: "Fase Uno de la AIA"
 USA_idea_aia_phase_one_desc: "Los avances del Instituto Americano de Aviónica han comenzado a dar resultados, y aunque este tipo de I+D es costoso, sin duda ha demostrado dar resultados."
 USA_idea_aia_phase_two: "Fase Dos de la AIA"
 USA_idea_aia_phase_two_desc: "Los esfuerzos aumentan a medida que los nuevos avances del Instituto Americano de Aviónica se han expandido a esfuerzos de apoyo terrestre."
 USA_idea_aia_phase_three: "Fase Tres de la AIA \"Albatros\""
 USA_idea_aia_phase_three_desc: "Investigaciones y estudios exhaustivos sobre las tolerancias de las tripulaciones y los equipos, así como la mejora de las aeronaves de gran tamaño, nos han proporcionado resultados inimaginables. Ahora nuestra fuerza aérea vuela como ninguna otra."
 USA_idea_paratrooper_corps: "Cuerpo de Paracaidistas"
 USA_idea_paratrooper_corps_desc: "Las mejoras en el entrenamiento y una mayor especialización en el ejército refinarán, definirán y aumentarán las capacidades de nuestros paracaidistas."
 USA_idea_army_air_enhancements: "Mejoras para el Ejército y la Fuerza Aérea"
 USA_idea_army_air_enhancements_desc: "Utilizando equipos e integraciones de entrenamiento, podemos mejorar las capacidades de nuestro ejército y tener una mejora general para mantener a nuestros soldados inigualables."
 USA_idea_army_centric_officer_corps_training: "Entrenamiento del Cuerpo de Oficiales con Enfoque en el Ejército"
 USA_idea_army_centric_officer_corps_training_desc: "Dedicar programas de entrenamiento y requisitos de avance para estar en sintonía con las necesidades y el conocimiento del ejército significa que nuestras habilidades de C&C influirán en gran medida en las habilidades de nuestras fuerzas terrestres en el futuro."
 USA_idea_navy_centric_officer_corps_training: "Cuerpo de Oficiales con Enfoque en la Armada"
 USA_idea_navy_centric_officer_corps_training_desc: "Dedicar programas de entrenamiento y requisitos de ascenso a las necesidades y conocimientos de la Armada. Esto significa que nuestras habilidades de C&C influirán significativamente en las capacidades de nuestras fuerzas navales en el futuro."
 USA_idea_air_centric_officer_corps_training: "Entrenamiento del Cuerpo de Oficiales con Enfoque en la Fuerza Aérea"
 USA_idea_air_centric_officer_corps_training_desc: "Dedicar programas de entrenamiento y requisitos de ascenso a las necesidades y conocimientos de la Fuerza Aérea. Esto significa que nuestras habilidades de C&C influirán significativamente en las capacidades de nuestra Fuerza Aérea en el futuro."
 american_militarism_reformed: "Militarismo Estadounidense Reformado"
 american_militarism_reformed_desc: "Through tireless efforts we have reformed, improved and tended to the needs of all of our armed forces. Setting the stage for the new millennium we can now look out over the blue shining seas and the sunny skies and say without a doubt. Haec pax Americana"
 USA_idea_military_junta_cultural_programs: "Programas Culturales"
 USA_idea_military_junta_cultural_programs_desc: "Al promover la unidad y la uniformidad en torno a las especies, establecemos un nuevo precedente de lo que significa estar unido."
 USA_idea_fascist_extra_territorial_corps: "Cuerpo Extraterritorial"
 USA_idea_fascist_extra_territorial_corps_desc: "Las fuerzas de reserva del Estado americano que nos permiten atender minuciosamente nuestros nuevos territorios en busca de actores antiestatales y otros disidentes."
 USA_idea_fascist_hemispheric_garrison_command: "Mando de Guarnición Hemisférica"
 USA_idea_fascist_hemispheric_garrison_command_desc: "El HGC es la rama de reserva de mando y control de la guarnición, así como las funciones de orden público en el hemisferio occidental. Se considera una subdivisión del ejército; sin embargo, debido a su escala, se reconoce oficialmente como una rama independiente de las fuerzas armadas."
 USA_idea_hemispheric_economic_program: "Programa Económico Hemisférico"
 USA_idea_hemispheric_economic_program_desc: "El HEP es un programa de ayuda mutua económica de alcance hemisférico diseñado para ayudar a desarrollar la infraestructura y la conectividad con las nuevas naciones del hemisferio occidental."
 USA_idea_public_unity_programs: "Programas de Unidad Pública"
 USA_idea_public_unity_programs_desc: "Los programas de asistencia mutua y unidad diseñados para forjar la cooperación pública, así como para abrir el camino hacia una nueva Identidad Mundial."
 USA_idea_the_new_world_economic_exchange: "Intercambio Económico del Nuevo Mundo"
 USA_idea_the_new_world_economic_exchange_desc: "El NWEE es un programa de cooperación continuo y mejorado, diseñado para ayudar a los esfuerzos de desarrollo y solidificar las bases para la Identidad del Nuevo Mundo."
 USA_idea_monarchist_puppet_partner: "Socio Títere"
 USA_idea_monarchist_puppet_partner_desc: "Hemos aceptado los términos estadounidenses, por lo que se nos conceden algunas libertades."
 USA_idea_red_junta_global_commissariat_corps: "Cuerpo del Comisariado Global"
 USA_idea_red_junta_global_commissariat_corps_desc: "La estabilidad y la paz futuras están en sus manos, camaradas. Deben defender y preservar la vida pacífica y amable que antaño vivieron estos pueblos. Muéstrenles que el futuro es brillante y ayuden a restablecer la ley y el orden en estas tierras."
 USA_idea_trotskyist_permanent_revolution: "Revolución Permanente"
 USA_idea_trotskyist_permanent_revolution_desc: "Los enemigos de nuestra sociedad, de nuestro estilo de vida, de nuestra propia alma, nos rodean. Camaradas, debemos unirnos y defender lo que apreciamos: la familia, la patria, el hogar. ¡¡¡Por la Revolución!!!"
 USA_crisis_event.8.t: "¿Quieren Implosionar?"
 USA_crisis_event.8.d: "La opción de colapso \"forzado\" de 2067 fue una predicción semiseria que hice con un grupo de amigos en diciembre de 2017, en el punto álgido de la época en que todos los que hablaban a gritos sembraban el miedo sobre una \"Segunda Guerra Civil Estadounidense\". Por ello, hice una predicción semiseria con esta cita: \"Si continuamos con la tendencia autodestructiva de pelearnos por todo aquello por lo que creemos que deberíamos pelearnos, en lugar de por aquello de lo que realmente deberíamos hablar, entonces me temo sinceramente que en los próximos 50 años no veremos unos Estados Unidos\". Dado que casi nadie había jugado hasta entonces, la opción de 2067 se añadió originalmente como un adelanto de huevo de Pascua, pero ahora que el público general se acerca al año del juego, debe ser una opción. Así que elige tu destino."
 USA_crisis_event.8.o1: "No Es Nuestro Momento"
 USA_crisis_event.8.o2: "Quememos Esto y Empecemos de Cero"
 USA_collapse_event.3000.t: "¿Estados Unidos No Tan Unidos?"
 USA_collapse_event.3000.d: "With the first ever national railroad strike in the modern age which the federal government couldn't get a handle on, US officials are scrambling to reach a peaceable settlement between the six major railroad corporations and the major unions. Many in the US are hopeful things will return to normal as supply shortages and price increases have already begun to hit almost every aspect of the US economy."
 USA_collapse_event.3000.o1: "Lets Everyone Just Calm Down, Okay? Please"
 USA_collapse_event.3000.o2: "Dios mío, ¿Qué Está Pasando?"
 USA_collapse_event.3001.t: "El Águila Cae"
 USA_collapse_event.3001.d: "In a shocking turn of events, sources are scarce but it appears that civil order has broken down in the United States. The prolonged national railroad strike resulted in massive price increases and supply shortages which caused riots throughout the nation. Local government officials did their best to coordinate police and national guard elements to secure public order. However as more populated states started requiring more resources to handle, more and more emergency responders were swamped by the increasing chaos. It is a dark day as the Eagle falls from the highest point that almost any nation has seen. The balance of power on the world will be changed forever as an immense power vacuum is created in the wake of things."
 USA_collapse_event.3001.o1: "¡Dios Mío!, ¿En Qué Nos Equivocamos?"
 USA_collapse_event.3001.o2: "¡Santa mierda...! ¿Qué hacemos ahora?"
 USA_collapse_event.3001.o3: "Maldita Sea, ¿y Ahora Qué?"
 USA_foreign_event.13.o2: "Ahora No"
 USA_monarchist_event.1.t: "La Unión del Norte"
 USA_monarchist_event.1.d: "Ofreceremos a Canadá nuestra protección directa y nuestra independencia continua en términos económicos y de asuntos internos. Sin embargo, la condición es que se conviertan en un dominio nuestro y pidan renunciar a la autoridad inglesa por una combinación de autoridad estadounidense y canadiense. Canadá se convertirá en el Reino de Canadá."
 USA_monarchist_event.1.o1: "Tienen Que Aceptar"
 USA_monarchist_event.2.t: "La \"Exigencia\" Estadounidense"
 USA_monarchist_event.2.d: "Los estadounidenses nos han presentado una oferta interesante. Podemos unirnos a ellos como súbditos y convertirnos en nuestro propio reino, en una situación similar a la que tuvimos como dominio británico. Sin embargo, parece que el argumento principal es que seremos un estado prácticamente independiente, aunque estaremos más alineados con los intereses del hemisferio occidental que con los intereses puramente canadienses."
 USA_monarchist_event.2.o1: "Prácticamente Ya Lo Hacemos Hasta Cierto Punto"
 USA_monarchist_event.2.o2: "Lo Hicimos Una Vez, Nunca Más"
 USA_monarchist_event.2000.t: "Canadá Acepta"
 USA_monarchist_event.2000.d: "Hemos hecho un buen trabajo y por eso los Canadienses han decidido unirse a nosotros en nuestro camino hacia la unidad hemisférica."
 USA_monarchist_event.2000.o1: "¡Dios Salve al Nuevo Mundo!"
 USA_monarchist_event.20000.t: "El Reino"
 USA_monarchist_event.20000.d: "Nos han dado luz verde para el cambio de nombre nacional."
 USA_monarchist_event.20000.o1: "Dios Bendiga a Canadá"
 USA_monarchist_event.2001.t: "Canadá Rechaza"
 USA_monarchist_event.2001.d: "Lamentablemente, no fuimos lo suficientemente rápidos para convencerlos de nuestras verdaderas intenciones. Considerando nuestros principios, no podemos imponernos en este caso. Tendremos que intentar algo diferente."
 USA_monarchist_event.2001.o1: "Pero Pensaba Que Éramos Hermanos..."
 USA_monarchist_event.3.t: "La Unión del Sur"
 USA_monarchist_event.3.d: "Ofreceremos a México nuestra protección directa y la continuidad de nuestra independencia económica y política. Sin embargo, la condición es que se conviertan en un dominio nuestro y se les permita cambiar el nombre de su nación a Reino de México."
 USA_monarchist_event.3.o1: "Let's Hope They See Sense"
 USA_monarchist_event.4.t: "La Oferta Estadounidense"
 USA_monarchist_event.4.d: "The Americans have sent us an offer. In becoming a mostly independent subject of them they will look to help out and stabilize the countryside in conjunction with local forces. Consequently we will be given the go ahead to call ourselves the Kingdom of Mexico as well as we can focus more on home and the western hemisphere than the global markets. Could be beneficial, however is this really what we want?"
 USA_monarchist_event.4.o1: "Bueno, Ya No Tenemos Que Preocuparnos Por la Frontera"
 USA_monarchist_event.4.o2: "Nos Han Dado Suficientes Problemas. ¡De Ninguna Manera!"
 USA_monarchist_event.4000.t: "México Acepta"
 USA_monarchist_event.4000.d: "Se ha concluido otra negociación exitosa y ahora iniciaremos la logística para iniciar esta gran unión de los pueblos."
 USA_monarchist_event.4000.o1: "Unidos Permanecemos"
 USA_monarchist_event.40000.t: "El Reino"
 USA_monarchist_event.40000.d: "Se nos ha dado el visto bueno, ahora volvemos a las viejas glorias y establecemos un nuevo rumbo uniendo el hemisferio."
 USA_monarchist_event.40000.o1: "¡Dios Bendiga al Nuevo Mundo!"
 USA_monarchist_event.4001.t: "México Rechaza"
 USA_monarchist_event.4001.d: "Las negociaciones se estancaron y fracasaron; tendremos que volver a abordar la situación si queremos hacer algo significativo en el futuro cercano."
 USA_monarchist_event.4001.o1: "¿En Qué Nos Equivocamos?"
 USA_monarchist_event.5.t: "El Acuerdo de la Federación"
 USA_monarchist_event.5.d: "We hope to change the fortunes of the island nation of Cuba. We can offer them protections as well as give them the greenlight on consolidation of the Caribbean region into what will be called the \"Federated Duchies of the West Indies\". Or simply the Duchy of West Indies. Our history is a long and interesting one to say the least, however I think we can do something to help them out."
 USA_monarchist_event.5.o1: "The Past Is The Past, Now Let's Make The Future"
 USA_monarchist_event.6.t: "El Acuerdo Estadounidense"
 USA_monarchist_event.6.d: "The Americans have come to us with a deal. In exchange for being their subject, we will have pretty much similar autonomy status but trade will be centered around benefiting the Western Hemispheric nations over the global ones per se. As an added bonus, the Americans will give us the green light to consolidate the Caribbean."
 USA_monarchist_event.6.o1: "No Podemos Conseguir Algo Mejor Por Nuestra Cuenta"
 USA_monarchist_event.6.o2: "Nos Han Traicionado Antes, ¡Ni Hablar!"
 USA_monarchist_event.6000.t: "Cuba Acepta"
 USA_monarchist_event.6000.d: "Otro paso hacia la unidad hemisférica."
 USA_monarchist_event.6000.o1: "¡Dios Bendiga al Nuevo Mundo!"
 USA_monarchist_event.60000.t: "La Federación"
 USA_monarchist_event.60000.d: "Se nos ha dado el visto bueno para el nombre nacional, pronto nuestro nombre será conocido a medida que creamos nuestro nuevo futuro unido con nuestros hermanos y hermanas del hemisferio occidental."
 USA_monarchist_event.60000.o1: "¡Dios Bendiga a la Federación Ducal Independiente!"
 USA_monarchist_event.6001.t: "Cuba Rechaza"
 USA_monarchist_event.6001.d: "Realmente necesitamos averiguar qué salió mal... aunque la animosidad histórica ha causado que sucedieran cosas peores, así que deberíamos comenzar con eso."
 USA_monarchist_event.6001.o1: "Volvamos A La Mesa de Dibujo"
 USA_monarchist_event.7.t: "La Oferta Centroamericana"
 USA_monarchist_event.7.d: "Al liderar con Panamá, esperamos crear una nueva unión de naciones y revitalizar la antigua entidad política centroamericana. Será difícil, pero si lideramos con Panamá y simplemente los apoyamos en proyectos de infraestructura y desarrollo sostenible, podríamos consolidar otra pieza de nuestra unidad hemisférica."
 USA_monarchist_event.7.o1: "Brindemos Por Un Mañana Esperanzador"
 USA_monarchist_event.8.t: "La Propuesta Estadounidense"
 USA_monarchist_event.8.d: "A cambio de convertirnos en sus súbditos, nos aseguramos la consolidación de los estados centroamericanos en un futuro próximo. Como beneficio adicional, Estados Unidos está dispuesto a ayudar con el desarrollo y a preservar la nueva unión, siempre y cuando nos centremos más en ayudar al hemisferio occidental que en otras opciones."
 USA_monarchist_event.8.o1: "No Está Mal, Estoy dentro"
 USA_monarchist_event.8.o2: "We Enjoy Our Canal Unabated, No Thanks"
 USA_monarchist_event.8000.t: "Panamá Acepta"
 USA_monarchist_event.8000.d: "Otro paso en la dirección unida, ahora podemos iniciar los preparativos para permitir que Panamá una la región centroamericana."
 USA_monarchist_event.8000.o1: "¡Dios Bendiga al Nuevo Mundo!"
 USA_monarchist_event.80000.t: "Principados Unidos"
 USA_monarchist_event.80000.d: "Nos dieron luz verde y formalizamos los antecedentes necesarios. Ahora podemos cambiar el nombre de la nación y comenzar el verdadero trabajo."
 USA_monarchist_event.80000.o1: "¡Por una Centroamérica Unida!"
 USA_monarchist_event.8001.t: "Panamá Rechaza"
 USA_monarchist_event.8001.d: "Bueno, eso dolió un poco, pero no hay nada que podamos hacer ahora. Tendremos que volver a intentarlo con otra cosa."
 USA_monarchist_event.8001.o1: "Algún Día los Convenceremos."
 USA_monarchist_event.9.t: "El Continente del Sur Unido"
 USA_monarchist_event.9.d: "Iniciaremos negociaciones con Colombia y revitalizaremos el antiguo Reino Grancolombiano. Este resurgimiento de una antigua entidad política abarcará aproximadamente la mitad superior del continente sudamericano y, con suerte, será un acuerdo lo suficientemente favorable como para comenzar a trabajar con nosotros."
 USA_monarchist_event.9.o1: "Here Goes Nothing"
 USA_monarchist_event.10.t: "La Propuesta Estadounidense"
 USA_monarchist_event.10.d: "For becoming an American subject, we will be given the green light to consolidate the northern part of the continent. We've also been told that they will help in solidifying the Gran Colombian Kingdom which is a nice little boost as well. The question is, do we really trust the Americans?"
 USA_monarchist_event.10.o1: "Hacia Antiguas Glorias"
 USA_monarchist_event.10.o2: "No Lo Creo"
 USA_monarchist_event.10000.t: "Colombia Acepta"
 USA_monarchist_event.10000.d: "Las negociaciones fueron un éxito y ahora comenzamos a avanzar con otro paso más hacia la unidad hemisférica."
 USA_monarchist_event.10000.o1: "Dios Bendiga al Nuevo Mundo"
 USA_monarchist_event.100000.t: "El Reino"
 USA_monarchist_event.100000.d: "Se nos ha dado el visto bueno para cambiar nuestro nombre y ahora comenzaremos a tomar medidas y a prepararnos para nuestro futuro, un futuro que pronto será unido para el hemisferio occidental."
 USA_monarchist_event.100000.o1: "Adelante Hacia la Victoria"
 USA_monarchist_event.10001.t: "Colombia Rechaza"
 USA_monarchist_event.10001.d: "Este es otro obstáculo para un futuro verdadero y mejor. Tendremos que resolverlo y probar algo diferente en el futuro."
 USA_monarchist_event.10001.o1: "¿Por qué No Pueden Entender?"
 USA_monarchist_event.11.t: "El Acuerdo Amazónico"
 USA_monarchist_event.11.d: "Para ayudar a promover y finalizar nuestra iniciativa de unidad hemisférica, invitaremos a Brasil a unirse a nosotros y a cambio podrán consolidar su posición en la mitad sur del continente."
 USA_monarchist_event.11.o1: "Serán Grandes, Pero Al Menos No Hay Nada Allí"
 USA_monarchist_event.12.t: "El Acuerdo Estadounidense"
 USA_monarchist_event.12.d: "A cambio de ser sus súbditos y alinear las políticas comerciales para que sean mutuamente beneficiosas para la nación del hemisferio occidental, podemos consolidar y expandir nuestra nación adquiriendo la mitad sur del continente. No es un mal negocio, pero nos pone bajo el yugo estadounidense."
 USA_monarchist_event.12.o1: "Que Ganemos Ahora Nos Ayudará Después"
 USA_monarchist_event.12.o2: "No Vale el Riesgo"
 USA_monarchist_event.12000.t: "Brasil Acepta"
 USA_monarchist_event.12000.d: "El Gran Reino del Sur ha aceptado y, como tal, se ha completado uno de los pasos más importantes hacia nuestro futuro común. Avancémonos y construyamos un nuevo futuro, un futuro mejor. Un futuro unido."
 USA_monarchist_event.12000.o1: "¡Gloria al Nuevo Mundo!"
 USA_monarchist_event.120000.t: "El Nuevo Reino"
 USA_monarchist_event.120000.d: "Hemos despejado todos los mecanismos de fondo y ahora somos un gran reino una vez más. Trabajemos con nuestros nuevos aliados para consolidar y crear un hemisferio nuevo y unido. Comienza la era de la unidad."
 USA_monarchist_event.120000.o1: "¡Juntos por la Victoria, ¡Avanzamos!"
 USA_monarchist_event.12001.t: "Brasil Rechaza"
 USA_monarchist_event.12001.d: "Este ha sido un revés importante; tomará mucho tiempo si queremos intentar acercarnos a Brasil y lograr su inclusión."
 USA_monarchist_event.12001.o1: "Juro que Nadie Escucha"
 USA_monarchist_event.13.t: "Operación Ganancias Iniciales"
 USA_monarchist_event.13.d: "El futuro es ahora y hemos recibido luz verde para iniciar nuestros esfuerzos de consolidación. Los avances iniciales se centrarán en las islas vecinas de Bahamas y Jamaica."
 USA_monarchist_event.13.o1: "¡Avanzamos!"
 USA_monarchist_event.14.t: "Operación Ganancias Iniciales"
 USA_monarchist_event.14.d: "The future is now and we have been given the go ahead to begin our consolidation efforts. Initial gains will revolve around the neighboring nations of Costa Rica and Nicaragua."
 USA_monarchist_event.14.o1: "¡Avanzamos!"
 USA_monarchist_event.15.t: "Operación Ganancias Iniciales"
 USA_monarchist_event.15.d: "El futuro es ahora y hemos recibido luz verde para iniciar nuestros esfuerzos de consolidación. Los avances iniciales se centrarán en las naciones orientales de Venezuela, Guyana y Surinam."
 USA_monarchist_event.15.o1: "¡Avanzamos!"
 USA_monarchist_event.16.t: "Operación Ganancias Iniciales"
 USA_monarchist_event.16.d: "El futuro es ahora y hemos recibido luz verde para iniciar nuestros esfuerzos de consolidación. Los logros iniciales se centrarán en las naciones del sur: Uruguay, Paraguay y Bolivia."
 USA_monarchist_event.16.o1: "¡Avanzamos!"
 USA_monarchist_event.17.t: "Programa de Economía Mutua"
 USA_monarchist_event.17.d: "Hoy comienza un nuevo camino a seguir, a medida que comenzamos a desarrollarnos nosotros mismos y unos a otros, construiremos juntos un futuro más brillante y mejor."
 USA_monarchist_event.17.o1: "¡A Progresar!"
 USA_monarchist_event.18.t: "Programa de Economía Mutua"
 USA_monarchist_event.18.d: "Hoy comienza un nuevo camino a seguir, a medida que comenzamos a desarrollarnos nosotros mismos y unos a otros, construiremos juntos un futuro más brillante y mejor."
 USA_monarchist_event.18.o1: "¡A Progresar!"
 USA_monarchist_event.19.t: "Programa de Economía Mutua"
 USA_monarchist_event.19.d: "Hoy comienza un nuevo camino a seguir, a medida que comenzamos a desarrollarnos nosotros mismos y unos a otros, construiremos juntos un futuro más brillante y mejor."
 USA_monarchist_event.19.o1: "¡A Progresar!"
 USA_monarchist_event.20.t: "Programa de Economía Mutua"
 USA_monarchist_event.20.d: "Hoy comienza un nuevo camino a seguir, a medida que comenzamos a desarrollarnos nosotros mismos y unos a otros, construiremos juntos un futuro más brillante y mejor."
 USA_monarchist_event.20.o1: "¡A Progresar!"
 USA_monarchist_event.21.t: "Programas de Unidad Pública"
 USA_monarchist_event.21.d: "Hoy comenzamos a implementar nuevos programas de unidad pública, diseñados para fomentar una nueva identidad mundial. Desde allí, nos lanzaremos hacia las estrellas con nuestros esfuerzos unidos. Unidos nos mantendremos, divididos habríamos caído."
 USA_monarchist_event.21.o1: "¡Somos los Nuevomundistas!"
 USA_monarchist_event.22.t: "Programas de Unidad Pública"
 USA_monarchist_event.22.d: "Hoy comenzamos a implementar nuevos programas de unidad pública, diseñados para fomentar una nueva identidad mundial. Desde allí, nos lanzaremos hacia las estrellas con nuestros esfuerzos unidos. Unidos nos mantendremos, divididos habríamos caído."
 USA_monarchist_event.22.o1: "¡Somos los Nuevomundistas!"
 USA_monarchist_event.23.t: "Programas de Unidad Pública"
 USA_monarchist_event.23.d: "Hoy comenzamos a implementar nuevos programas de unidad pública, diseñados para fomentar una nueva identidad mundial. Desde allí, nos lanzaremos hacia las estrellas con nuestros esfuerzos unidos. Unidos nos mantendremos, divididos habríamos caído."
 USA_monarchist_event.23.o1: "¡Somos los Nuevomundistas!"
 USA_monarchist_event.24.t: "Programas de Unidad Pública"
 USA_monarchist_event.24.d: "Hoy comenzamos a implementar nuevos programas de unidad pública, diseñados para fomentar una nueva identidad mundial. Desde allí, nos lanzaremos hacia las estrellas con nuestros esfuerzos unidos. Unidos nos mantendremos, divididos habríamos caído."
 USA_monarchist_event.24.o1: "¡Somos los Nuevomundistas!"
 USA_monarchist_event.25.t: "Operación Locura en el Centro"
 USA_monarchist_event.25.d: "Ahora que hemos reorganizado nuestras ganancias iniciales, se nos ha dado el visto bueno para invadir la isla de La Española y flanquear a las pequeñas naciones de la cadena de islas invadiendo Trinidad y Tobago."
 USA_monarchist_event.25.o1: "Avanzamos Hacia Adelante"
 USA_monarchist_event.26.t: "Operación Locura en el Centro"
 USA_monarchist_event.26.d: "Ahora que hemos reorganizado nuestras ganancias iniciales, se nos ha dado el visto bueno para invadir las próximas naciones limítrofes de Honduras y El Salvador."
 USA_monarchist_event.26.o1: "Avanzamos Hacia Adelante"
 USA_monarchist_event.27.t: "Operación Locura en el Centro"
 USA_monarchist_event.27.d: "Ahora que hemos reorganizado nuestras ganancias iniciales, hemos recibido luz verde para invadir la siguiente nación fronteriza con Ecuador. Si bien solo nos enfrentamos a una nación, el terreno está empeorando, por lo que nuestro plan de invasión también coincide con el de Brasil."
 USA_monarchist_event.27.o1: "Avanzamos Hacia Adelante"
 USA_monarchist_event.28.t: "Operación Locura en el Centro"
 USA_monarchist_event.28.d: "Ahora que hemos reorganizado nuestras ganancias iniciales, hemos recibido luz verde para invadir la siguiente nación fronteriza con Argentina. Si bien solo nos enfrentamos a una nación, el terreno está empeorando, por lo que nuestro plan de invasión también coincide con el de Colombia."
 USA_monarchist_event.28.o1: "Avanzamos Hacia Adelante"
 USA_monarchist_event.29.t: "Operación Nuevo Mundo"
 USA_monarchist_event.29.d: "Las últimas piezas del rompecabezas empezarán a encajar a medida que nos disponemos a crear un nuevo futuro unido. Las naciones de la cadena insular son los únicos obstáculos que quedan."
 USA_monarchist_event.29.o1: "¡Hacia la Victoria!"
 USA_monarchist_event.30.t: "Operación Nuevo Mundo"
 USA_monarchist_event.30.d: "Las últimas piezas del rompecabezas comenzarán a encajar a medida que nos disponemos a crear un nuevo futuro unido. Las naciones de Belice y Guatemala son los únicos obstáculos que se interponen en el camino."
 USA_monarchist_event.30.o1: "¡Hacia la Victoria!"
 USA_monarchist_event.31.t: "Operación Nuevo Mundo"
 USA_monarchist_event.31.d: "Las últimas piezas del rompecabezas empezarán a encajar mientras nos disponemos a crear un nuevo futuro unido. La nación peruana es el último bastión contra nosotros y nuestros aliados."
 USA_monarchist_event.31.o1: "¡Hacia la Victoria!"
 USA_monarchist_event.32.t: "Operación Nuevo Mundo"
 USA_monarchist_event.32.d: "Las últimas piezas del rompecabezas empezarán a encajar mientras nos disponemos a crear un nuevo futuro unido. La nación de Chile es el último bastión contra nosotros y nuestros aliados."
 USA_monarchist_event.32.o1: "¡Hacia la Victoria!"
 USA_monarchist_event.33.t: "Intercambio Económico del Nuevo Mundo"
 USA_monarchist_event.33.d: "La creación de la NWEE consolidará nuestra prosperidad económica y unidad mutua para luchar por un futuro mejor. Avancemos juntos como un solo pueblo."
 USA_monarchist_event.33.o1: "¡Hacia el Nuevo Mundo!"
 USA_monarchist_event.34.t: "Intercambio Económico del Nuevo Mundo"
 USA_monarchist_event.34.d: "La creación de la NWEE consolidará nuestra prosperidad económica y unidad mutua para luchar por un futuro mejor. Avancemos juntos como un solo pueblo."
 USA_monarchist_event.34.o1: "¡Hacia el Nuevo Mundo!"
 USA_monarchist_event.35.t: "Intercambio Económico del Nuevo Mundo"
 USA_monarchist_event.35.d: "La creación de la NWEE consolidará nuestra prosperidad económica y unidad mutua para luchar por un futuro mejor. Avancemos juntos como un solo pueblo."
 USA_monarchist_event.35.o1: "¡Hacia el Nuevo Mundo!"
 USA_monarchist_event.36.t: "Intercambio Económico del Nuevo Mundo"
 USA_monarchist_event.36.d: "La creación de la NWEE consolidará nuestra prosperidad económica y unidad mutua para luchar por un futuro mejor. Avancemos juntos como un solo pueblo."
 USA_monarchist_event.36.o1: "¡Hacia el Nuevo Mundo!"
 USA_focus_carrier_direction_dilemma: "Dilema sobre la Dirección de los Portaaviones"
 USA_focus_carrier_direction_dilemma_desc: "El papel del portaaviones moderno está divergiendo. Por un lado, está el método tradicional de \"aeropuerto móvil\". Por otro, está la idea de una plataforma móvil de cañones y/o misiles que también se apoya en los helicópteros sobre aeronaves de ala fija. Sea cual sea, debemos definirlo y empezar a trabajar en ello como si fuera ayer."
 USA_focus_aeronautical_development_board: "Junta de Desarrollo Aeronáutico"
 USA_focus_aeronautical_development_board_desc: "The ADB is a dedicated institute for developing aviation based advancements, be they safety, weapons systems or whatever the case may be. However to not stretch our funding too thin and to not overly burden the population, we need to decide just what direction these advancements may go. We can either look towards securing air supremacy or we could look into more ground support and or bombing capabilities as a whole. Either choice will determine what we need to worry about in the future should war arise."
 USA_fascist_operation_gran_colombia: "Operación Gran Colombia"
 USA_fascist_operation_gran_colombia_desc: "Los pasos finales están a la vuelta de la esquina, ahora que llevamos la lucha a la mitad sur de nuestro hemisferio. Usando Trinidad y Tobago como trampolín, podremos entonces invadir las naciones más pequeñas de Guyana y Surinam. Este trampolín nos permitirá avanzar hacia el oeste y conquistar la mitad superior de Sudamérica."
 USA_monarchist_dedicated_aeronautical_research_institute: "Instituto de Investigación Aeronáutica Dedicado"
 USA_monarchist_dedicated_aeronautical_research_institute_desc: "The ARI is a R&D complex dedicated to improving and developing our air force to be more effective than ever before."
 USA_monarchist_gran_colombian_kingdom: "Reino de la Gran Colombia"
 USA_monarchist_gran_colombian_kingdom_desc: "To begin the Southern continental unity effort, we'll approach Colombia and work with them to re-establish the Kingdom of Gran Colombia. Old glories are always a nice offer for mutual benefit."
 USA_idea_aeronautical_development_board_fighter: "Junta de Desarrollo Aeronáutico - \"Enfoque en Cazas\""
 USA_idea_aeronautical_development_board_fighter_desc: "El presupuesto del ADB se ha priorizado hacia cualquier innovación que se pueda realizar en materia de cazas y/o superioridad aérea."
 USA_idea_aeronautical_development_board_bomber: "Junta de Desarrollo Aeronáutico - \"Enfoque en Bombardeos\""
 USA_idea_aeronautical_development_board_bomber_desc: "El presupuesto del ADB se ha priorizado hacia cualquier innovación que se pueda realizar en materia de bombarderos y/o apoyo terrestre."
 USA_iranian_sanctions: "Sanciones a Irán"
 USA_iranian_sanctions_desc: "La [PER.GetFlag] Crisis de los Rehenes en Irán de 1979 provocó que la administración Carter implementara una serie de sanciones contra el gobierno iraní [PER.GetFlag] para castigarlo por sus acciones. Desde entonces, las administraciones presidenciales han mantenido posturas divergentes sobre la severidad de las [USA.GetFlag] sanciones estadounidenses contra los [PER.GetFlag] iraníes.\n\nSeveridad de las sanciones: [?USA_iran_sanction_level]/5"
 USA_increase_sanctions_on_iran: "Aumentar Sanciones a Irán"
 USA_increase_sanctions_on_iran_desc: "Nuestra administración ve la necesidad de castigar a Irán por sus acciones recientes."
 USA_decrease_sanctions_on_iran: "Reducir Sanciones a Irán"
 USA_decrease_sanctions_on_iran_desc: "El gobierno iraní se ha comportado bien últimamente, tal vez podamos aliviar las sanciones contra él por ahora."
 USA_lift_sanctions_on_iran: "Levantar Sanciones a Irán"
 USA_lift_sanctions_on_iran_desc: "Las sanciones no son más que una herramienta para perjudicar al pueblo iraní. Además, no tenemos ningún fundamento político para continuar con las sanciones contra los iraníes."
 USA_sanctioned_PER_recently: "Ha modificado las sanciones recientemente"
 USA_FOCUS.3.e: "Interesante."
 usa.89.o3: "¡No, y no vuelvas a preguntar!"
 usa.95.t: "Solicitud del Programa F-35 Denegada y en Lista Negra"
 usa.95.d: "The United States was not willing to allow us to join the F-35 program, citing that we cannot yet be trusted to possess such technology. We have also been told that we are being blacklisted from ever being able to enter the program again."
 usa.95.o1: "Bien"
 USA_disable_casualty_report: "Desactivar Informe Mensual de Bajas en Afganistán"
 USA_disable_casualty_report_desc: "Dejaremos de recibir información mensual sobre las bajas en Afganistán. En su lugar, los efectos se aplicarán sin previo aviso."
 USA_enable_casualty_report: "Reactivar Informe Mensual de Bajas en Afganistán"
 USA_enable_casualty_report_desc: "Comenzaremos a recibir eventos mensuales sobre las víctimas en Afganistán."
 USA_UKR_aid: "Ayuda Estadounidense-Ucraniana"
 USA_ISR_military_cooperation: "Cooperación Militar Estadounidense-Israelí"
 USA_CHI_trade_war: "Distanciamiento de la Cooperación Económica con China"
 USA_SAU_aid: "Compartir Inteligencia Militar Estadounidense"
 USA_tariff: "Aranceles Comerciales Estadounidenses"
 USA_SSU_aid: "Apoyo Militar Estadounidense"
 USA_afghan_mission_cost: "Misión O.E.F. – Afganistán"
 USA_afghan_mission_cost_desc: "Our commitment to Operation Enduring Freedom, and our mission in Afghanistan has put us in a unique situation. Our economy, government, and military will be absorbing a lot of the cost involved with maintaining control and stability over Afghanistan.\n§W--------------§!\nThis national spirit will be §RRemoved§! if we take the §YWithdraw From Afghanistan§! decision."
 USA_afghan_mission_TT: "Desplegaremos tropas estadounidenses [USA.GetFlag] en §HAfghanistán§! [AFG.GetFlag].\n - Financiaremos la §Hreconstrucción nacional§! a través de inversiones económicas; no estabilizar el país antes de la retirada corre el riesgo de un resurgimiento de los §Htalibanes§! [TAL.GetFlag].\n - Nuestras tropas se enfrentarán a §Rataques§! de insurgentes mientras permanezcamos en §HAfghanistán§! [AFG.GetFlag]."
 USA_attack_tal_strength_TT: "£AFG_salafist_jihadism §HFuerza Mensual de los Talibanes en Afganistán§!: §G-2,00%§!"
 USA_disable_report_TT: "Podemos desactivar el informe mensual de siniestros en el menú de decisiones §HPolíticas Internas§!"
 usa.100.t: "Operación Libertad Duradera – Afganistán"
 usa.100.d: "President [USA.GetLeader] announced the commencement of Operation Enduring Freedom (OEF) from the White House earlier today. He stated that the goal of the mission is to root out the Taliban and Al-Qaeda remnants from Afghan territory, and to restore peace and stability to the turbulent nation. This commitment to Afghanistan marks a major shift in American foreign policy, as now the United States will need to take a more active stance in the domestic affairs of other countries to ensure that the goals of its operations are being met. A large deployment to Afghanistan will also mean putting American troops at risk, which could seriously hurt the credibility of the American establishment greatly at the home-front. What Operation Enduring Freedom in Afghanistan will accomplish is to be seen, but for now American forces seem optimistic that their mission goals will be met."
 usa.100.a: "Interesante"
 usa.100.b: "El imperio Americano se expande"
 usa.101.t: "Militares se Enfrentan a Insurgentes Talibanes"
 usa.101.d: "Tras una patrulla de rutina, nuestras fuerzas fueron emboscadas por varios insurgentes talibanes ocultos en las montañas. Tras un breve enfrentamiento, varios militares resultaron heridos y, lamentablemente, algunos perdieron la vida. Sin embargo, las fuerzas talibanes sufrieron un duro revés en su último intento de frustrar nuestras acciones. Esta victoria por sí sola no basta para distraer a los medios de comunicación locales de las pérdidas sufridas."
 usa.101.a: "En Dios confiamos"
 department_of_state.123.t: "Estados Unidos Lanza Esfuerzos de Cooperación Verde"
 department_of_state.123.d: "The United States is calling on our government to move forward with a Green Energy agreement pushed by the previous Clinton administration. The agreement would call on us to abandon drilling operations in several oil fields in exchange for American-funded solar farms. The president of the United States, [USA.GetLeader], states that this move would be in our best interest, as it will 'reduce pollution greatly in major cities'. While some are skeptical on why the United States itself is not abandoning several mining operations within its own borders, this is an opportunity that would only come around once in a life time."
 department_of_state.123.a: "¿Dónde firmamos?"
 department_of_state.123.b: "Absolutamente no"
 department_of_state.2.t: "China Firma el Proyecto de Ley Verde"
 department_of_state.2.d: "El gobierno chino ha decidido firmar el Proyecto de Ley Verde que propusimos. Esto ha sorprendido a algunos miembros de nuestro gabinete, ya que las expectativas de un acuerdo con China eran bastante bajas. Sin embargo, con la ratificación de esta ley, las inversiones estadounidenses fluirán hacia China y podría estar sobre nosotros el potencial auge del sector verde estadounidense."
 department_of_state.2.a: "¡Genial!"
 department_of_state.3.t: "China Ignora Nuestra Ley"
 department_of_state.3.d: "El gobierno chino simplemente ha ignorado nuestra propuesta para un Proyecto de Ley Verde. El proyecto de ley habría hecho que el sector energético chino avanzara hacia una dirección más ecológica, pero parece que las nubes de Pekín aún no son lo suficientemente negras."
 department_of_state.3.a: "Su pérdida"
 department_of_state.4.t: "El Gran Boom de la Energía Verde"
 department_of_state.4.d: "Tras la importante inversión en contratistas de energía verde, las operaciones se han extendido desde China a partes de Estados Unidos. Esto se debe a que las empresas de energía verde pudieron crecer gracias a la inversión en el mercado, y ahora las vemos continuar con sus proyectos en otras partes del mundo y en Estados Unidos."
 department_of_state.4.a: "Los frutos de nuestra formulación de políticas"
 department_of_state.5.t: "Estados Unidos Propone la Iniciativa de Transición Civil"
 department_of_state.5.d: "El gobierno de Estados Unidos ha presentado una nueva propuesta. Sugiere que firmemos su acuerdo, que exigirá el desarme de ocho fábricas militares y, a cambio, Estados Unidos construirá 16 nuevas industrias civiles para reemplazarlas. Si bien la propuesta parece bastante atractiva, existe la preocupación de que forme parte de un plan estadounidense más amplio para debilitar paulatinamente las industrias militares rusas. Con esto en mente, nos beneficiará más aceptar su iniciativa, ya que nada impide que reconstruyamos estas industrias."
 department_of_state.5.a: "Adelante, fírmalo."
 department_of_state.5.b: "¿Nos consideran tontos?"
 department_of_state.6.t: "Rusia Acepta Firmar Nuestra Iniciativa"
 department_of_state.6.d: "El gobierno ruso ha anunciado que firmará la reciente iniciativa que presentamos. Aunque es inesperado, estamos listos para financiar este programa y verlo completado. Ya han autorizado la entrada de contratistas y supervisores estadounidenses para garantizar que las fábricas se transformen adecuadamente."
 department_of_state.6.a: "Bueno"
 department_of_state.7.t: "Rusia Rechaza Nuestra Propuesta"
 department_of_state.7.d: "El gobierno ruso ha decidido rechazar nuestras propuestas para una Iniciativa de Transición Rusa. Esta iniciativa habría supuesto el desmantelamiento de varias fábricas de armas por parte del gobierno ruso para que las industrias estadounidenses ocuparan su lugar."
 department_of_state.7.a: "Su pérdida"
 department_of_state.8.t: "[USA.GetLeader] Autoriza la Intervención Estadounidense en Somalia"
 department_of_state.8.d: "[USA.GetLeader] anunció hoy que las fuerzas armadas intervendrán para ayudar a restablecer la paz y la estabilidad en la región somalí. Esta medida probablemente se haya visto influenciada por el aumento de ataques piratas somalíes a buques estadounidenses. La medida ha generado reacciones encontradas, tanto dentro como fuera de Estados Unidos. Si el ejército estadounidense será capaz de restablecer la paz en la región es aún un tema de debate. Solo el tiempo dirá qué sucederá a continuación."
 department_of_state.8.a: "Interesante"
 department_of_state.8.b: "El imperialismo no tiene límites"
 department_of_state.900.t: "¡Estados Unidos Apoya a Sudán del Sur!"
 department_of_state.900.d: "Estados Unidos ha decidido involucrarse en nuestro conflicto, algo que no le corresponde. Enviarán apoyo a Sudán del Sur y planean atacar a nuestra nación."
 department_of_state.900.a: "Mierda"
 department_of_state.10.t: "Apoyo a Sudán del Sur"
 department_of_state.10.d: "El régimen criminal de Sudán ha decidido prolongar su guerra civil. Una guerra civil sin fundamento y plagada de crímenes de lesa humanidad. Sudán del Sur necesita nuestro apoyo para alcanzar su objetivo final: la liberación."
 department_of_state.10.a: "Autorizar el soporte completo"
 department_of_state.01.t: "Piratas Somalíes Atacan Nuestros Buques de Carga"
 department_of_state.01.d: "Somalian pirates have viciously seized several cargo ships carrying goods. We currently have no contact with the crew members, and we are unsure of what will happen to the cargo."
 department_of_state.01.a: "Maldita sea"
 department_of_state.9.t: "Estados Unidos Autoriza Ataques Aéreos contra Sudán"
 department_of_state.9.d: "Estados Unidos se movilizará para atacar objetivos en Sudán y así debilitar su capacidad de combatir al Ejército de Liberación del Pueblo Sudanés. [USA.GetLeader] también ha declarado que esta acción busca presionar al gobierno sudanés para que avance hacia un acuerdo de paz con los rebeldes del sur. Sudán lleva décadas sumido en una guerra civil, y la inestabilidad del país se intensifica cada día. Es cuestionable si las bombas estadounidenses lograrán la paz, pero es una acción que el gobierno estadounidense ha considerado necesaria."
 department_of_state.11.t: "Estados Unidos Solicita Nuestro Apoyo"
 department_of_state.11.d: "El gobierno de Washington nos ha pedido que apoyemos a Sudán del Sur mediante voluntarios y la exportación de armas. Sugieren que, si aceptamos, recibiremos una suma considerable por nuestra ayuda."
 department_of_state.11.a: "Bueno, veremos qué podemos hacer"
 department_of_state.11.b: "No"
 department_of_state.12.t: "[FROM.GetName] Comienza A Movilizar Tropas"
 department_of_state.12.d: "[FROM.GetName] ha comenzado a movilizar unidades para apoyar nuestro llamado a la acción tras nuestras solicitudes. Su asistencia no será olvidada y se les otorgará lo prometido."
 department_of_state.12.a: "Bueno"
 department_of_state.13.t: "[FROM.GetName] Rechazan Nuestra Solicitud"
 department_of_state.13.d: "[FROM.GetName] ha decidido que no quiere participar en ayudar a nuestra causa en Sudán y en su lugar ha optado por quedarse en casa."
 department_of_state.13.a: "De acuerdo"
 department_of_state.14.t: "Estados Unidos Propone una Iniciativa Minera"
 department_of_state.14.d: "Estados Unidos ofrece excavar en busca de recursos en una región relativamente pobre en recursos de nuestro país. Afirman que cubrirán la totalidad del costo de las operaciones y que lo que quede después de 10 años será nuestro."
 department_of_state.14.a: "Adelante"
 department_of_state.14.b: "No"
 department_of_state.15.t: "[FROM.GetName] Acepta Un Acuerdo de Minería"
 department_of_state.15.d: "[FROM.GetName] ha accedido a permitir que compañías mineras estadounidenses inviertan en regiones degradadas de su país para extraer metales preciosos. Han aceptado nuestros términos, que estipulan que conservaremos todo lo que encontremos durante 10 años, tras los cuales los derechos sobre los recursos se transferirán a sus líderes."
 department_of_state.15.a: "Bueno"
 department_of_state.16.t: "[FROM.GetName] Rechaza Acuerdo Minero"
 department_of_state.16.d: "[FROM.GetName] se ha negado a firmar contratos con compañías mineras estadounidenses, lo que perjudica nuestra capacidad de iniciar cualquier operación minera significativa en su país."
 department_of_state.16.a: "Desafortunado"
 department_of_state.17.t: "Fin del Contrato"
 department_of_state.17.d: "Nuestro contrato con los Estados Unidos expira hoy a medianoche, y el control de todos los recursos extraídos por los Estados Unidos será transferido a nuestro gobierno."
 department_of_state.17.a: "De acuerdo"
 department_of_state.18.t: "Fin del Contrato"
 department_of_state.18.d: "Nuestro contrato con [FROM.GetName] finaliza a medianoche, lo que nos obliga a transferir todos los derechos de recursos a [FROM.GetName] en las regiones donde hemos tenido operaciones mineras."
 department_of_state.18.a: "De acuerdo"
 department_of_state.19.t: "United States Offers Support For Our Country In The Recovery Of Lost Territories"
 department_of_state.19.d: "Los Estados Unidos han respaldado nuestras reclamaciones sobre Abjasia y Osetia del Sur, instándonos a 'tomar medidas decisivas contra aquellos que han dañado al Estado georgiano'. Los Estados Unidos declararon que están dispuestos a respaldar a nuestras fuerzas armadas, e incluso a solicitar la intervención de la NATO si Rusia tomara represalias militares contra nosotros. Se ofrecen a proporcionarnos grandes cantidades de armas y municiones para lograr nuestros objetivos."
 department_of_state.19.a: "América, lo has vuelto a hacer, hagámoslo."
 department_of_state.19.b: "No, los estadounidenses no son confiables"
 department_of_state.20.t: "Comienzo de las Operaciones"
 department_of_state.20.d: "Ha llegado el momento de ejecutar nuestros planes contra las regiones separatistas y recuperar lo que por derecho nos pertenece."
 department_of_state.20.a: "Adelante"
 department_of_state.21.t: "Georgia Ataca hacia el Norte"
 department_of_state.21.d: "Los georgianos han comenzado una serie de ataques en territorios que consideran separatistas y han ordenado a su ejército comenzar una movilización masiva. Estos ataques representan una amenaza directa para nuestra influencia en el Cáucaso, ya que abren la puerta a una mayor explotación occidental. Si no hacemos nada, corremos el riesgo de parecer débiles. Si intervenimos, podríamos entrar en conflicto con el resto de Occidente."
 department_of_state.21.a: "Al infierno con los georgianos!"
 department_of_state.21.b: "No es nuestro problema"
 department_of_state.22.t: "Rusia Responde a los Ataques Georgianos"
 department_of_state.22.d: "Los rusos han decidido responder a la nueva serie de ataques georgianos contra el territorio del norte. Han declarado que el Estado georgiano se ha pasado de la raya y que esta acción constituye, de alguna manera, una amenaza directa a la existencia del Estado ruso. Prometimos a nuestros aliados georgianos ayuda si Rusia respondía, y ahora es el momento."
 department_of_state.22.a: "Llamamiento a celebrar una cumbre de la OTAN"
 department_of_state.22.b: "Nosotros hemos tenido un cambio de corazon"
 department_of_state.23.t: "Estados Unidos Solicita Nuestro Apoyo"
 department_of_state.23.d: "Georgia ha entrado en conflicto con Rusia, y parece que poco podría lograr sin ayuda extranjera. Estados Unidos pide a la OTAN que envíe voluntarios y armas a Georgia para ayudarles a alcanzar sus objetivos operativos."
 department_of_state.23.a: "Nosotros estamos en camino"
 department_of_state.23.b: "Este no es nuestro conflicto"
 department_of_state.24.t: "Conferencia de la OTAN sobre Georgia"
 department_of_state.24.d: "En respuesta a la entrada de Georgia en un conflicto a gran escala con Rusia, la NATO ha convocado una conferencia de emergencia para evaluar la situación y coordinar una respuesta. Con las fuerzas georgianas luchando por mantener el terreno, los Estados Unidos han instado a los Estados miembros a apoyar a Georgia con ayuda militar, voluntarios y envíos de armas. Las críticas llueven por parte de los políticos rusos, ya que ven la medida como una amenaza directa a su existencia. La región sigue en vilo a medida que se desarrolla la situación y, tal como están las cosas, nadie sabe cómo terminará."
 department_of_state.24.a: "¡Georgia tiene derecho a defender sus intereses!"
 department_of_state.24.b: "Otra víctima del imperialismo Occidental"
 department_of_state.25.t: "¡Estados Unidos Nos Abandona!"
 department_of_state.25.d: "In a sudden and unexpected move, the United States has crossed us and gone back on their promise. They are claiming that due to 'congressional objections' they are unable to adequately send us the support needed to win the conflict."
 department_of_state.25.a: "Esos bastardos"
 department_of_state.26.t: "Georgia Se Prepara para Iniciar Operaciones"
 department_of_state.26.d: "Ha llegado el momento de conceder a Georgia lo que le habíamos prometido y enviarle el apoyo armado necesario para hacer frente a la amenaza actual."
 department_of_state.26.a: "De acuerdo"
 department_of_state.27.t: "Georgia Rechaza Nuestra Solicitud"
 department_of_state.27.d: "El gobierno georgiano parece desinteresado en iniciar un conflicto con sus vecinos, ni siquiera para reunificar su patria. Por ahora, parece que prefiere estrechar lazos con Rusia en lugar de con Occidente."
 department_of_state.27.a: "De acuerdo"
 department_of_state.28.t: "Estados Unidos Ofrece el Proyecto SHORAD"
 department_of_state.28.d: "El gobierno de los Estados Unidos se ha ofrecido a cubrir el coste de un proyecto SHORAD a escala nacional para todos los miembros de la NATO. Aunque el contrato tiene algunas condiciones, exigiendo que los emplazamientos SHORAD sean operados por personal de los Estados Unidos, seguirán ofreciendo un nivel de protección inigualable en comparación con otras defensas antiaéreas del mundo."
 department_of_state.28.a: "¿Donde firmamos?"
 department_of_state.28.b: "¡No, rechazamos esta amenaza a nuestra independencia!"
 department_of_state.29.t: "Disidentes bielorrusos ocupan edificios gubernamentales"
 department_of_state.29.d: "Hoy, aproximadamente a las 9:34 de la mañana, docenas de disidentes bielorrusos armados únicamente con armas ligeras entraron sin oposición en varios edificios gubernamentales y los ocuparon. El ejército y las fuerzas policiales de Bielorrusia hicieron muy poco para detener a estos rebeldes armados. Poco después, los disidentes emitieron un anuncio a través de la red de televisión estatal de la nación declarando la caída del 'gobierno de los corruptos'. El gobierno ruso no ha comentado oficialmente sobre la situación pero, tal como están las cosas, parece que todo el mundo ha sido tomado por sorpresa como resultado de este repentino acontecimiento. Hay quienes señalan con el dedo al gobierno de los Estados Unidos por conspirar contra el gobierno bielorruso, pero no ha habido declaraciones desde Washington."
 department_of_state.29.a: "Los vientos del cambio soplan una vez más"
 department_of_state.30.t: "Se Escuchan Disparos en Toda Bielorrusia"
 department_of_state.30.d: "Los residentes de Minsk y de otras ciudades de Bielorrusia han informado de tiroteos, que se sospecha que ocurren entre los rebeldes bielorrusos y las fuerzas gubernamentales. Esto sucede mientras rebeldes bielorrusos organizados han comenzado a ocupar varios puestos gubernamentales en las ciudades occidentales de la nación, declarando las regiones como 'zonas libres bielorrusas'. Los rebeldes afirman que no tienen más objetivo que derrocar el régimen de [BLR.GetLeader]. Se sospecha que los rebeldes fueron armados, financiados y entrenados por los Estados Unidos. El Kremlin ha declarado que trabajará junto al gobierno bielorruso para detener la invasión de 'territorio soberano bielorruso y ruso'. Tras los comentarios rusos, [USA.GetLeader] ha prometido su respaldo a los rebeldes bielorrusos y ha instado a varios Estados miembros de la NATO a ayudar en el apoyo a los rebeldes."
 department_of_state.30.a: "Otro estado se derrumba"
 department_of_state.31.t: "Bielorrusia Cae Ante las Fuerzas Occidentales"
 department_of_state.31.d: "Parece que las fuerzas americanas responsables de orquestar el caos en Bielorrusia han tenido éxito y ahora se encuentran apostadas en nuestra frontera. Este cambio de liderazgo ha preocupado a varios grupos y camarillas dentro de nuestro propio Estado, temiendo que los americanos utilicen a Bielorrusia como plataforma de lanzamiento para una mayor agresión hacia nuestra soberanía. Debemos demostrarle a Occidente que no les tememos y debemos tomar medidas rápidas y decisivas. Pero el resultado de si serán disuadidos o no depende en gran medida de lo que hagamos a continuación."
 department_of_state.31.a: "¡Debemos ampliar nuestra propia alianza!"
 department_of_state.31.b: "¡Debemos tomar represalias en igualdad de condiciones!"
 department_of_state.32.t: "Rusia Nos Invita a Su Alianza"
 department_of_state.32.d: "El gobierno ruso nos ha invitado a su alianza, alegando que la reciente agresión de Occidente podría poner en peligro nuestro Estado."
 department_of_state.32.a: "¿Donde firmamos?"
 department_of_state.32.b: "¡Somos tu amigo Rusia, pero no somos tontos!"
 department_of_state.33.t: "Serbia Rechaza la Invitación"
 department_of_state.33.d: "El gobierno serbio ha rechazado nuestra invitación a nuestra alianza, afirmando que hacerlo sólo aumentaría aún más la tensión en el mundo."
 department_of_state.33.a: "Está bien"
 department_of_state.34.t: "Rusia Lanza un Ataque Total Contra los Países Bálticos"
 department_of_state.34.d: "El gobierno ruso ha lanzado un ataque total contra los estados bálticos, considerándose esta medida como una represalia a los recientes acontecimientos en Bielorrusia. Aún se desconoce si la OTAN responderá con una respuesta total a este último acontecimiento, pero varios miembros de la OTAN han declarado estar dispuestos a armar a los países bálticos para ayudar en la lucha contra Rusia. [SOV.GetLeader] ha declarado en un discurso televisado que esta medida tiene como objetivo \"preservar la soberanía nacional rusa\" y \"combatir el imperialismo occidental\" en la región del Báltico. La invasión está generando rápidamente condenas en todo el mundo y está incitando el temor de una guerra mundial inminente."
 department_of_state.34.a: "El mundo está al borde del abismo una vez más"
 department_of_state.35.t: "Colapso de la Autoridad Estatal en Siberia"
 department_of_state.35.d: "Siberia Oriental, una región que en su día estuvo ferozmente custodiada por el Estado ruso, es ahora vulnerable a la explotación extranjera a niveles nunca antes vistos. Varios Estados occidentales han tomado la iniciativa de comenzar el proceso de reconocimiento de esta recién nacida 'nación' y están instando a otras naciones independientes a hacer lo mismo. Por el bien de la seguridad nacional y la salvaguarda de nuestras gloriosas fronteras, debemos tomar medidas preventivas para evitar la intrusión occidental en nuestros límites."
 department_of_state.35.a: "Avanzar hacia Siberia y Establecer el Orden"
 department_of_state.35.b: "Es mejor que nos lo guardemos para nosotros mismos."
 department_of_state.36.t: "China Avanza para Ocupar el Este de Siberia"
 department_of_state.36.d: "El gobierno chino ha declarado oficialmente que Siberia Oriental es de interés fundamental para China y su pueblo. [CHI.GetLeader] ha manifestado su intención de desplegar tropas en la región para garantizar la paz y la estabilidad en la antigua región rusa. Si bien a primera vista el gobierno chino parece actuar por precaución, los expertos la consideran un intento de expandir la influencia económica global de China. Siberia es una región rica en petróleo y recursos naturales, lo que la convierte en un terreno privilegiado para las empresas e inversores chinos. Esta medida está generando rápidamente la condena de los países occidentales, y se espera que pronto se celebre una conferencia al respecto."
 department_of_state.36.a: "China recoge el botín de la guerra"
 department_of_state.37.t: "La Seguridad Nacional en Peligro Tras los Ataques Chinos"
 department_of_state.37.d: "Tras una toma de control china de lo que antes era la Siberia rusa, la geopolítica de la región ha cambiado de forma bastante dramática. Tras haber recogido en su día los frutos de la victoria, nuestros aliados de la NATO están ahora en pánico, ya que los chinos podrían expandir potencialmente su influencia más hacia el oeste. Hay llamamientos que exigen una solución permanente a este problema creciente."
 department_of_state.37.a: "Convocar una cumbre de emergencia"
 department_of_state.37.b: "No es necesario, los Chinos no quieren hacer daño."
 department_of_state.38.t: "RUSFOR proclamado: Nuestro señor supremo se transforma"
 department_of_state.38.d: "Washington ha formalizado la disolución de la Unión Soviética y el establecimiento de RUSFOR como el Estado sucesor. Como súbditos del antiguo Estado soviético, ahora debemos rendir cuentas ante nuestra nueva realidad y decidir si aceptamos esta transición o nos resistimos a ella."
 department_of_state.38.a: "Cooperaremos con el nuevo orden"
 department_of_state.3800.t: "RUSFOR proclamado: Termina la era soviética"
 department_of_state.3800.d: "Los Estados Unidos han reconocido formalmente a RUSFOR como el sucesor legítimo de la Unión Soviética. Las reclamaciones territoriales soviéticas en todo el antiguo imperio se transferirán a la Federación Rusa. Moscú debe decidir ahora cómo gestionar esta transición histórica y trazar un rumbo para el futuro de la nación."
 department_of_state.3800.a: "La era soviética ha terminado. Rusia perdura"
 department_of_state.39.t: "RUSFOR"
 department_of_state.39.d: "Nuestros socios de la NATO nos instan a abandonar nuestras reclamaciones sobre cualquier antiguo territorio ruso con la esperanza de crear una Rusia nueva, reunificada y partidaria de la NATO. A largo plazo, sería más beneficioso para nosotros seguir el camino de la cooperación."
 department_of_state.39.a: "Dejemos que RUSFOR tome el control"
 department_of_state.39.b: "No"
 department_of_state.40.t: "La OTAN Convoca una Cumbre de Emergencia"
 department_of_state.40.d: "The heads of NATO convened at an emergency summit earlier today, with the main point of discussion being the future of the Russian nation. Following a brutal defeat at the hands of the NATO states, Russian central authority collapsed and many former provinces broke free as independent states. Without hesitation, the Chinese government chose to exploit the power vacuum left by Russia and occupied parts of Eastern Siberia, declaring an Eastern Siberia Special Administrative Region (S.A.R.). Several NATO leaders, including the Secretary General are now claiming that a Russian NATO Force (RUSFOR) will be established, with a unified central command being located in St. Petersburg."
 department_of_state.40.a: "¿Se convertirá Rusia en un estado fallido?"
 department_of_state.41.t: "Las Fuerzas de la OTAN Establecen RUSFOR"
 department_of_state.41.d: "Tras una cumbre de emergencia celebrada por la OTAN a principios de la semana pasada, se encargó a un comité sentar las bases para un gobierno ruso de transición. Como resultado, se estableció la misión RUSFOR y se estableció una zona de restauración de la OTAN en partes de lo que antiguamente era Rusia Occidental. Aunque la intención inicial era mantener un remanente de Rusia fracturado y desunido para evitar un efecto latigazo, la agresión china ha obligado a los líderes de la OTAN a reevaluar su postura. Varios estados están cediendo sus zonas de ocupación a favor de una zona de restauración de la OTAN, y se están elaborando planes para integrar a Rusia en la alianza y establecer un liderazgo civil en el país."
 department_of_state.41.a: "Ya había oído esta historia antes..."
 department_of_state.45.t: "Aumenta la Presión Internacional"
 department_of_state.45.d: "La presión internacional se está acumulando contra nosotros como resultado de nuestro control sobre el territorio ruso. Si nos negamos a renunciar a nuestras reclamaciones, podríamos ser sancionados, y si cooperamos, podríamos ganar algo mejor que unas tierras problemáticas a cambio."
 department_of_state.45.a: "Abandonamos nuestras reivindicaciones"
 department_of_state.45.b: "¡Nunca!"
 department_of_state.47.t: "La OTAN Celebra la 'Conferencia de Kaliningrado'"
 department_of_state.47.d: "Following the defeat of Russian forces at the hands of NATO armies, the Kaliningrad conference is being hosted by the victors of what some have begun dubbing as 'World War III' to decide the fate of a new Russia. Several heads of states are in attendance, including non-NATO states in order to decide what would be the best course of action moving forward. The current plan on the floor is creating a transitional government in the heartland of Western Russia, with independence being granted to several Eastern and Southern states within Russia."
 department_of_state.47.a: "Rusia está sobre la mesa, no como nación, sino como premio."
 department_of_state.48.t: "Una Nueva Era del Liderazgo Ruso"
 department_of_state.48.d: "Ha llegado el momento de que inauguremos al líder ruso, Alexéi Navalny. Como nuestra única y mejor opción, Navalny ha prometido liderar a Rusia hacia un estado más brillante, democrático e inclusivo."
 department_of_state.48.a: "Bienvenido, Navalny"
 department_of_state.49.t: "Estados Unidos se Acerca con una Solicitud"
 department_of_state.49.d: "Estados Unidos nos ha presentado una solicitud muy interesante. Nos sugiere establecer una alianza formal en el Pacífico, similar a la OTAN. Nos han contactado como posible líder de esta facción y nos piden que preparemos los documentos y las bases necesarios para una alianza que contrarreste la creciente influencia china en la región. También nos han solicitado que invitemos a Taiwán y Corea del Sur como los primeros miembros de esta facción."
 department_of_state.49.a: "Nosotros aceptaremos"
 department_of_state.49.b: "No, no podemos enfrentarnos a China"
 department_of_state.50.t: "Japón se Acerca a Nosotros con una Oferta"
 department_of_state.50.d: "El gobierno japonés nos ha ofrecido nuestra propia posición y seguridad en la recién formada alianza EAST. Afirman que la alianza ayudará a fortalecer la seguridad en Asia Oriental y a contener la expansión china. Unirnos a la facción podría darnos una ventaja sobre nuestros rivales, pero también podría ponernos directamente en su punto de mira."
 department_of_state.50.a: "Nosotros nos uniremos"
 department_of_state.50.b: "Esto suena demasiado arriesgado."
 department_of_state.51.t: "Japón Anuncia la Formación de EAST"
 department_of_state.51.d: "Tras una intensa campaña de presión por parte de políticos estadounidenses, el gobierno japonés cedió a las exigencias estadounidenses a principios de esta semana y anunció la formación de una facción similar a la OTAN. La alianza se denomina «EAST», siglas del «Tratado de Seguridad de Asia Oriental», y ya se la conoce como la OTAN de Asia. Esta facción trabajará para crear un cinturón de seguridad alrededor de China y frenar su creciente influencia. Si bien Japón y Estados Unidos han negado la evidente amenaza que esta facción pueda representar para China, se ha informado de que funcionarios chinos ya están preparando una respuesta a la medida."
 department_of_state.51.a: "Surge un nuevo bloque"
 department_of_state.51.b: "La decadencia occidental consume otro rincón del globo."
 department_of_state.52.t: "Estados Unidos Proporciona Inteligencia y Ayuda contra Irán"
 department_of_state.52.d: "Estados Unidos nos ha ofrecido acceso a información de inteligencia que podría ayudarnos a contrarrestar la creciente amenaza iraní. Si aceptamos, obtendremos una ventaja sobre los iraníes y, a cambio, Estados Unidos ganaría influencia sobre nuestra nación."
 department_of_state.52.a: "De acuerdo"
 department_of_state.52.b: "No"
 department_of_state.53.t: "[FROM.GetName] Acepta Nuestra Oferta"
 department_of_state.53.d: "[FROM.GetName] ha decidido aceptar nuestra oferta y ya ha comenzado a utilizar los recursos que le hemos ofrecido."
 department_of_state.53.a: "Vale la pena ser amigo de America"
 department_of_state.54.t: "[FROM.GetName] Rechaza Nuestra Oferta"
 department_of_state.54.d: "[FROM.GetName] ha decidido que le conviene dejar pasar los recursos que estábamos dispuestos a proporcionarle."
 department_of_state.54.a: "Su pérdida"
 department_of_state.55.t: "Estados Unidos Nos Insta a Tomar Medidas contra Transnistria"
 department_of_state.55.d: "Estados Unidos nos ha instado a tomar medidas inmediatas para desmantelar cualquier idea de un Estado transnistrio y a lanzar un ataque frontal contra las posiciones defensivas de Transnistria de inmediato. Afirman que si demoramos esta acción, podría ser demasiado tarde para hacer algo en el futuro. También afirman que proporcionarían apoyo material y personal si fuera necesario."
 department_of_state.55.a: "Preparar las fuerzas armadas"
 department_of_state.55.b: "Este es un movimiento demasiado arriesgado."
 department_of_state.56.t: "Moldavia Avanza sobre Transnistria"
 department_of_state.56.d: "El gobierno moldavo ha tomado la sabia decisión de seguir nuestro consejo y lanzar un ataque frontal contra los separatistas de Transnistria. Esta medida puede enfadar a Moscú, pero también los debilitará significativamente."
 department_of_state.56.a: "Bueno"
 department_of_state.57.t: "Moldavia Decide Ir en Contra de Nuestro Consejo"
 department_of_state.57.d: "El gobierno moldavo ha decidido que, debido a las circunstancias actuales, no podrá lanzar un ataque contra Transnistria. Afirma que la medida es demasiado arriesgada y no es una prioridad para el gobierno."
 department_of_state.57.a: "De acuerdo"
 department_of_state.58.t: "Moldavia se Prepara para Eliminar a los Separatistas de Transnistria"
 department_of_state.58.d: "Las fuerzas armadas moldavas han anunciado hoy que darán comienzo a las operaciones contra los separatistas transnistrios en el este. El movimiento resulta sorprendente, ya que Transnistria es un conocido Estado satélite de Moscú. El Kremlin aún no ha comentado sobre los ataques, pero existe la expectativa de que las fuerzas rusas apoyen a las fuerzas transnistrias. Hay mucha especulación de que la presión y la participación americanas pueden haber provocado estos ataques, ya que varias fuentes dentro de Moldavia han declarado que no fueron informadas en absoluto sobre la decisión."
 department_of_state.58.a: "¿Moldova volverá a reunificarse?"
 department_of_state.58.b: "Occidente continúa su expansión"
 department_of_state.59.t: "Estados Unidos Emite una Advertencia"
 department_of_state.59.d: "Estados Unidos ha emitido una advertencia sobre nuestro programa nuclear. Ha declarado que si en los próximos años no tomamos medidas para desmantelarlo, no tendrán más remedio que actuar. Si bien es difícil predecir si los estadounidenses realmente actuarán, una cosa es segura: harán todo lo posible para obstaculizar nuestro progreso."
 department_of_state.59.a: "Bueno, eso ya lo veremos."
 USA_withdraw_from_afghanistan: "[AFG.GetFlag] [TAL.GetFlag] Retirada de Afganistán"
 USA_withdraw_from_afghanistan_desc: "Ha llegado el momento de que recojamos nuestras cosas y salgamos de Afganistán [AFG.GetFlag]. Hemos sostenido un ejército fuerte, funcional y capaz durante nuestra permanencia. Si los afganos [AFG.GetFlag] no son capaces de mantener la paz y la estabilidad en su hogar, entonces ya no hay nada más que podamos hacer por nuestra parte."
 USA_chinese_environmentalist_cooperation: "[CHI.GetFlag] [USA.GetFlag] Proyecto de Ley Verde Chino-Estadounidense"
 USA_chinese_environmentalist_cooperation_desc: "La dependencia de China [CHI.GetFlag] de los combustibles fósiles les dota de una base de recursos estratégicos que no podemos ignorar. Al dirigir a Pekín hacia las energías ecológicas, reducimos su capacidad de influencia al tiempo que garantizamos que la industria estadounidense lidere la transición. Una China más ecológica es una China menos peligrosa."
 USA_the_russian_transition: "[SOV.GetFlag] Iniciativa de Transición Rusa"
 USA_the_russian_transition_desc: "La Unión Soviética [SOV.GetFlag] ha caído, y el sobredimensionado sector militar de Rusia [SOV.GetFlag] no sirve a nadie más que a los traficantes de armas. Presionaremos al liderazgo ruso para que convierta las viejas fábricas de armas en producción civil, un paso concreto que aliviará las tensiones regionales y abrirá la puerta a una cooperación genuina de cara al futuro."
 USA_authorize_intervention_in_somalia: "[SOM.GetFlag] [JUB.GetFlag] [SWS.GetFlag] Autorizar la Intervención Militar en Somalia"
 USA_authorize_intervention_in_somalia_desc: "El conflicto somalí ha puesto en peligro nuestros contenedores de transporte marítimo, y nuestro comercio disminuye constantemente debido a los incesantes ataques a nuestras rutas marítimas. Con una intervención adecuada, podremos poner fin a esto rápidamente y devolver la estabilidad a una región del mundo bastante convulsa."
 USA_airstrikes_against_sudan: "[SUD.GetFlag] [SSU.GetFlag] Autorizar Ataques Aéreos Contra Sudán"
 USA_airstrikes_against_sudan_desc: "La guerra civil sudanesa [SUD.GetFlag] se ha prolongado durante algún tiempo, y si no se hace nada al respecto, podríamos presenciar una guerra prolongada que solo seguirá devastando la región. Debemos apoyar militarmente a [SSU.GetFlag] Sudán del Sur para presionar al gobierno sudanés [SUD.GetFlag] a que ceda o busque una solución diplomática."
 USA_call_on_tanzania_and_kenya: "[KEN.GetFlag] [TNZ.GetFlag] [SSU.GetFlag] Solicitar el apoyo de Kenia y Tanzania"
 USA_call_on_tanzania_and_kenya_desc: "Necesitamos pedir a nuestros aliados en África que apoyen a [SSU.GetFlag] Sudán del Sur durante estos tiempos difíciles, y debemos hacerlo rápidamente."
 USA_our_backyard: "[BRA.GetFlag] [COL.GetFlag] [CHL.GetFlag] Inversiones en Nuestro Patio Trasero"
 USA_our_backyard_desc: "Nuestros vecinos del sur tienen un potencial infinito para superarse. Con las inversiones estadounidenses, podremos liberar todo su potencial e impulsarlos hacia la modernidad. Por supuesto, también nos beneficiaremos de esto; nada es gratis."
 USA_uniting_georgia: "[GEO.GetFlag] [SOO.GetFlag] [ABK.GetFlag] Uniendo a Georgia"
 USA_uniting_georgia_desc: "Georgia [GEO.GetFlag] está siendo explotada y arruinada por el oso ruso, y no lo toleraremos. Debemos asegurar a Tiflis que estamos de su lado y demostrar a Moscú [SOV.GetFlag] que no pueden actuar con impunidad en la región. Presionar a Georgia para que recupere Abjasia [ABK.GetFlag] y Osetia del Sur [SOO.GetFlag] demostrará a los rusos que su autoproclamado 'ejército formidable' tiene sus límites."
 USA_natos_man: "[ENG.GetFlag] [GER.GetFlag] El hombre de la NATO"
 USA_natos_man_desc: "Nuestros aliados de la NATO están expuestos: sin defensas aéreas de corto alcance, un asalto aéreo de gran envergadura podría destrozar las posiciones de vanguardia antes de que efectuemos un solo disparo. Debemos equipar cada línea de frente aliada con sistemas SHORAD ahora, antes de que esa ventana se cierre y el coste sea muy superior."
 USA_belarus_reauthorization_act: "[BLR.GetFlag] Ley de Reautorización de la Democracia en Bielorrusia"
 USA_belarus_reauthorization_act_desc: "Nuestro respaldo a la democracia y a los derechos humanos en Bielorrusia no debe flaquear. Debemos reafirmar el apoyo a los movimientos por la libertad dentro de la propia Bielorrusia y derrocar la brutal dictadura de Lukashenko."
 USA_setting_the_pacific_groundwork: "[JAP.GetFlag] [TAI.GetFlag] [KOR.GetFlag] Construyendo el Escudo del Pacífico"
 USA_setting_the_pacific_groundwork_desc: "Nuestros aliados en Asia Oriental deben enfrentarse a una China [CHI.GetFlag]valentonada y agresiva, y no pueden hacerlo solos. Lo que más nos conviene es presionar a Tokio [JAP.GetFlag] para que ponga en marcha un pacto de seguridad regional antes de que Pekín imponga la cuestión bajo sus propios términos."
 USA_a_strong_east: "[ISR.GetFlag] [SAU.GetFlag] Un Oriente Medio Protegido"
 USA_a_strong_east_desc: "Nuestros dos aliados más cercanos en Oriente Medio, Arabia Saudita e Israel, se encuentran bajo la constante amenaza de las fuerzas iraníes. Lo que más nos conviene es actuar para armar y fortalecer a nuestros aliados en la región."
 USA_fighting_little_green_men: "[UKR.GetFlag] [MLV.GetFlag] [PMR.GetFlag] [SOV.GetFlag] Fighting The Little Green Men"
 USA_fighting_little_green_men_desc: "Las fuerzas rusas se han adentrado demasiado en Europa Oriental a través de sus Estados satélite como Transnistria. Es hora de hacer saber a los moldavos que son ellos quienes están al mando de su propio territorio, no los rusos."
 USA_push_iran: "[PER.GetFlag] Advertir a Teherán"
 USA_push_iran_desc: "Los iraníes llevan buscando una bomba nuclear desde tiempos inmemoriales. Se rumorea que están a solo unos meses de adquirir un arma si no intervenimos. Presionándolos y advirtiéndoles con antelación, podríamos justificar una futura intervención si no optan por la vía diplomática y la negociación."
 USA_two_percent: "[GER.GetFlag] [ENG.GetFlag] [POL.GetFlag] ¡Ese 2% importa!"
 USA_two_percent_desc: "Nuestros aliados de la OTAN se han negado repetidamente a cumplir con los niveles de gasto más básicos establecidos por los estándares de la alianza. Es hora de que empecemos a presionarlos para que aumenten su gasto, o se arriesgarán a cosechar los frutos que sembraron."
 USA_tehrans_ultimatum: "[PER.GetFlag] El ultimátum de [PER.capital.GetCapitalVictoryPointName]"
 USA_tehrans_ultimatum_desc: "A los iraníes se les ha advertido una y otra vez que si se lanzan a por un arma nuclear, serán castigados con la espada. Parece que Irán aún no ha aprendido la lección y debe ser sometido."
 USA_economic_destruction_of_beijing: "[CHI.GetFlag] Destrucción Económica de [CHI.capital.GetCapitalVictoryPointName]"
 USA_economic_destruction_of_beijing_desc: "Los chinos han avanzado demasiado y demasiado rápido. Debemos actuar con rapidez para frenar este crecimiento de inmediato; de lo contrario, podría ser demasiado tarde. Intentaremos que todos los estados alineados con Occidente participen en un boicot económico a China para que su neoimperialismo económico llegue pronto a su fin."
 USA_freedom_in_venezuela: "[VEN.GetFlag] Libertad a través de la sangre"
 USA_freedom_in_venezuela_desc: "Por mucho que lo hayamos intentado, esa cucaracha [VEN.GetLeader] ha escapado a nuestra mira una y otra vez. Es hora de que acabemos con su régimen de una vez por todas."
 USA_russian_reset: "[SOV.GetFlag] El reinicio ruso"
 USA_russian_reset_desc: "Ya es hora de reconciliarnos con nuestros amigos rusos y poner fin a nuestro interminable conflicto. Al impulsar un \"reinicio\" de las relaciones, demostraremos a Rusia que no tenemos malas intenciones y que estamos abiertos al diálogo y la negociación."
 USA_intervention_in_libya: "[LBA.GetFlag] Intervención en Libia"
 USA_intervention_in_libya_desc: "El Estado libio se encuentra al borde del colapso, con escasa o nula infraestructura y cinturón de seguridad para proteger a la población civil. Debemos asumir la responsabilidad de intervenir y ayudar a restablecer el orden en la región."
 USA_moving_in_on_africa: "[DRC.GetFlag] [SAF.GetFlag] [NIG.GetFlag] Avanzando hacia África"
 USA_moving_in_on_africa_desc: "El Estado chino ha tenido acceso prácticamente sin restricciones a los mercados y asuntos internos africanos durante muchos años, y finalmente está empezando a alcanzarnos. Debemos actuar para combatir la influencia china y ejercer la nuestra si queremos seguir siendo la fuerza global dominante en el mundo."
 USA_another_10_trillion_to_israel: "[ISR.GetFlag] Un Israel fuerte, un Estados Unidos fuerte"
 USA_another_10_trillion_to_israel_desc: "Israel es nuestro aliado más cercano y posiblemente el único en Oriente Medio, lo que lo convierte en blanco de nuestros enemigos. Debemos hacer todo lo posible para armar y proteger a Israel y así no perder ni un pilar de nuestra influencia en el mundo."
 USA_backing_ukraine: "[UKR.GetFlag] Respaldando a Ucrania"
 USA_backing_ukraine_desc: "La invasión injusta, ilegal y provocadora de Ucrania por parte de Rusia ha desatado el debate entre nuestros políticos. Independientemente de si están a favor del aislacionismo, si nos quedamos de brazos cruzados viendo cómo Ucrania es devorada, podríamos ver a los rusos en Washington muy pronto."
 USA_iraq_most_wanted: "Más Buscados de Irak"
 USA_iraq_most_wanted_desc: "The £IRQ_Nat_Autocracy_small Ba'ath heads of state have scrambled all over the Middle-East. Four fugitives are currently in hiding in [IRQ.GetFlag] Iraq, including Saddam Hussein and his sons, while four others have fled to neighboring countries. [IRQ_dlc_check] We must conduct the §HBa'athist Hunting Raids§! within [IRQ.GetFlag] Iraq to find the four Aces' hiding spots. They can be in any state, so the search must be extensive. Failure to eliminate at least four fugitives within five years will result in a major Ba'ath counter attack.\n"
 IRQ_la_res: "We need at least §H85% Network Strength§! in any country neighboring [IRQ.GetFlag] Iraq to verify if [IRQ.GetFlag] Iraqi Ba'athists have fled there without the target nation's permission. Once verified, we can move in to arrest them."
 IRQ_influence: "We need at least §H20% Influence§! in any country neighboring [IRQ.GetFlag] Iraq to verify if [IRQ.GetFlag]  Iraqi Ba'athists have fled there without the target nation's permission. Once verified, we can move in to arrest them."
 USA_execute_saddam: "Ejecutar a Saddam Hussein"
 USA_execute_saddam_desc: "It's time to let this criminal face justice. Justice of which he starved his own people."
 USA_execute_qusay: "Ejecutar a Qusay Hussein"
 USA_execute_qusay_desc: "Aunque no es tan maníaco como su hermano, Qusay sigue siendo un criminal peligroso que no debe salir libre."
 USA_execute_uday: "Ejecutar a Uday Hussein"
 USA_execute_uday_desc: "Uday es un monstruo absoluto, tal como lo demuestra su infame historial. No hay cantidad de dinero que pueda reparar los crímenes que ha cometido."
 USA_execute_abid: "Ejecutar a Abid Hamid Mahmud"
 USA_execute_abid_desc: "Siendo el centro del partido Ba'ath, Abid Hamid Mahmud tiene sus manos manchadas de rojo con la sangre de los presos políticos reprimidos."
 USA_execute_majid: "Ejecutar a Ali Hassan al-Majid"
 USA_execute_majid_desc: "Ali el Químico ha redoblado su apuesta por el genocidio del pueblo kurdo, afirmando una y otra vez que no ha cometido ningún error."
 USA_execute_walter: "Ejecutar a Izzat Ibrahim al-Douri"
 USA_execute_walter_desc: "Ibrahim al-Douri as Saddam's right hand man has committed countless crimes against humanity. He has been complicit in the murder of thousands, if not millions indirectly."
 USA_execute_tilfah: "Ejecutar a Hani Abd al-Latif Tilfah"
 USA_execute_tilfah_desc: "Presuntamente, Tilfah ha sido cómplice del asesinato de muchos iraquíes durante el levantamiento de 1991. Aunque las pruebas han sido insuficientes hasta el momento."
 USA_execute_salih: "Ejecutar a Aziz Saleh Al-Numan"
 USA_execute_salih_desc: "Como miembro de los 'Doce del Patíbulo', Aziz Saleh es responsable de la tortura y el asesinato de innumerables iraquíes."
 USA_SYR_baathists: "Búsqueda de baazistas iraquíes en [SYR.GetFlag] Siria"
 USA_SAU_baathists: "Búsqueda de baazistas iraquíes en [SAU.GetFlag] Arabia Saudita"
 USA_JOR_baathists: "Búsqueda de baazistas iraquíes en [JOR.GetFlag] Jordán"
 USA_KUR_baathists: "Búsqueda de baazistas iraquíes en [KUR.GetFlag] KDP Kurdistán"
 USA_PUK_baathists: "Búsqueda de baazistas iraquíes en [PUK.GetFlag] PUK Kurdistán"
 USA_PER_baathists: "Búsqueda de baazistas iraquíes en [PER.GetFlag] Irán"
 USA_fugitive_countdown: "Contraataque Baazista"
 USA_fugitive_countdown_desc: "Si no ejecutamos al menos a 4 figuras clave del partido Baaz antes de que termine esta cuenta atrás, la comunidad de inteligencia advierte que podría producirse un contraataque baazista de gran envergadura."
 USA_close_this_menu: "Fin de las Operaciones Baazistas"
 USA_close_this_menu_desc: "Es hora de que concluyamos nuestra búsqueda de objetivos baazistas, hemos logrado lo que necesitábamos."
 USA_SI_green_china_TT: "Es §Hmás probable§! que acepten si tenemos relaciones superiores a §H0§!\n\nImportancia estratégica de esta acción:\n- Al conseguir que [CHI.GetFlag] §HChina§! a §Habandon§! múltiples £oil_texticon §HOcampos petrolíferos§! a favor de la energía verde, podremos obstaculizar su futura capacidad de abastecer eficientemente a sus ejércitos.\n- Sin embargo, tendremos que asumir la totalidad del costo de este proyecto, que ascenderá a unos §R$480 mil millones§!"
 USA_RU_transition_TT: "Es §Hmás probable§! que acepten si nuestras relaciones están por encima de §H0§!\n\nImportancia estratégica de esta acción:\n - Al convencer a §HRusia§! [SOV.GetFlag] de que se beneficiará de tener menores industrias §Gmilitares§! y mayores industrias §Hciviles§!, podemos debilitar su §Hcomplejo militar§!, anulando su capacidad para producir armas rápidamente en caso de conflicto. §HPerderán 8 fábricas de armas y ganarán 16 a cambio§!.\n - Sin embargo, tendremos que absorber la totalidad del coste de este proyecto, que ascenderá a unos §R120 000 millones de dólares§!."
 USA_somalia_intervention_TT: "Podremos enviar §Hfuerzas voluntarias§! a [SOM.GetFlag] §HSomalia§! independientemente de la tensión mundial.\n\nImportancia estratégica de esta acción:\n- Al poner fin rápidamente al conflicto [SOM.GetFlag] §HSomalia§!, podremos poner fin a los ataques a nuestros §Hbuques de carga§! y al comercio que circula por la región.\n- Aunque podemos esperar a que el conflicto termine, no estamos seguros de cuándo terminará. Mientras el conflicto continúe, habrá §Hataques continuos a nuestro cargamento§!"
 USA_sudan_intervention_TT: "We will grant [SSU.GetFlag] §HSouth Sudan§! a defensive modifier against [SUD.GetFlag] §HSudan§!\n - We can pressure [KEN.GetFlag] §HKenya§! and [TNZ.GetFlag] §HTanzania§! to support [SSU.GetFlag] §HSouth Sudan§! through volunteers\n - We can support [SSU.GetFlag] §HSouth Sudan§! by raiding \n[SUD.GetFlag] §HSudanese§! territory\n\nStrategic Importance Of This Action:\n - By forcing [SUD.GetFlag] §HSudan§! into a ceasefire, we will weaken the global East's strength in Africa and neighboring states."
 USA_sudan_intervention2_TT: "Pediremos a [KEN.GetFlag] §HKenya§! y [TNZ.GetFlag] §HTanzania§! que apoyen a [SSU.GetFlag] §HSouth Sudan§! con tropas voluntarias para presionar a\n[SUD.GetFlag] §HSudan§! a un acuerdo de paz. Pagaremos a todas las partes involucradas §R$19.00§! de nuestro tesoro como compensación por sus pérdidas."
 USA_south_america_investments_TT: "Tienen §Hmás probabilidades§! de aceptar si nuestras relaciones están por encima de §H20§!.\nExcavaremos §HMetales Preciosos§! en [BRA.GetFlag] §HBrasil§!, [COL.GetFlag] §HColombia§! y [CHL.GetFlag] §HChile§!. Invertiremos un total de §G$50 mil millones§! en cada país y extraeremos aproximadamente §H20§! unidades de §HMetales Preciosos§! en cada uno.\n\nControlaremos estos metales durante un período de 10 años, después del cual nuestro contrato expirará.\nUna vez que el contrato expire, los metales quedarán bajo el control de cada nación respectiva.\nImportancia estratégica de esta acción:\n\nAl invertir en estos estados, podremos §Hmás que duplicar§! nuestras reservas existentes de §HMetales Preciosos§! durante un tiempo."
 USA_georgian_peer_pressure_TT: "Es §Hmás probable§! que acepten si nuestras relaciones están por encima de §H20§! y no son un títere de la §HRusia§! [SOV.GetFlag] soviética.\n\nImportancia estratégica de esta acción:\n - §HGeorgia§! [GEO.GetFlag] ha estado dividida y afectada por el separatismo desde hace algún tiempo. Este es un efecto secundario directo de la presión neoimperialista del Kremlin por jugar a ser Dios en los antiguos Estados soviéticos.\n - Armaremos a §HGeorgia§! [GEO.GetFlag] con armas para recuperar §HOsetia del Sur§! [SOO.GetFlag] y §HAbjasia§! [ABK.GetFlag].\n - Además de dar a §HGeorgia§! [GEO.GetFlag] nuestras herramientas más recientes para llevar la libertad, les daremos la garantía de que intervendremos en su favor si el Kremlin da un paso en falso.\n - Si el Kremlin decide provocarnos, solicitaremos la intervención de la NATO en §HGeorgia§! [GEO.GetFlag], siendo el objetivo final la liberación de los Estados en la Caucasia bajo control §Hruso§! [SOV.GetFlag]."
 USA_russian_defeat_TT: "Si se cumplen todos los objetivos de la operación, los siguientes estados se independizarán:\n- [DAG.GetFlag] Daguestán\n- [CHE.GetFlag] Chechenia\n- [ING.GetFlag] Ingusetia\n- [KBK.GetFlag] Kabardino-Balkaria\n- [KCC.GetFlag] Karacháyevo-Cherkesia"
 USA_stalemate_TT: "Posibles resultados:\n- Si [GEO.GetFlag] Georgia controla [ABK.GetFlag] Abjasia u [SOO.GetFlag] Osetia del Sur, sus territorios estarán bajo control georgiano.\n- Si [GEO.GetFlag] Georgia no logra controlar ningún territorio, se restablecerán las fronteras previas al conflicto y el Kremlin ampliará su influencia."
 USA_bolstering_nato_TT: "Construiremos un sitio §H1 SHORAD§! en cada estado de cada aliado de la §COTAN§!\n\nImportancia estratégica de esta acción:\n- Al equipar a nuestros aliados de la §COTAN§! con sitios SHORAD avanzados, estarán mejor preparados en caso de un ataque aéreo importante por parte de una potencia extranjera.\n- Nuestra influencia en cada estado de la §COTAN§! aumentará significativamente, evitando que las potencias extranjeras creen fracturas dentro de nuestra alianza."
 USA_belarus_decision_TT: "Trabajaremos para derrocar al gobierno [BLR.GetFlag] §HBelaruso§!\n\nImportancia estratégica de esta acción:\n- Al derrocar al §H[BLR.GetLeader]§!, dañaremos gravemente la influencia [SOV.GetFlag] §HRuso§! en Europa del Este y derrocaremos a uno de sus aliados más cercanos.\n- Al tener un [BLR.GetFlag] §HBelaruso§! amigo a las puertas del Kremlin, podríamos proyectar la influencia de la §COTAN§! en toda la región."
 USA_blr_coup_TT: "derrocando [BLR.GetFlag] [BLR.GetLeader]"
 USA_blr_civilwar_TT: "Una guerra civil se está desatando en [BLR.GetFlag] Bielorrusia"
 USA_ven_civilwar_TT: "Reconoceremos a la oposición en §H[VEN.GetName]§! [VEN.GetFlag] y daremos comienzo a la §HOperación Resolución Absoluta§!.\n - Desbloquea una nueva §Rincursión especial§! para capturar a §H[VEN.GetLeader]§!.\n\nImportancia estratégica de esta acción:\n - §HVenezuela§! [VEN.GetFlag] ha sido durante mucho tiempo una espina clavada en nuestro hemisferio. Decapitar al régimen en su cúspide es el camino más limpio hacia una transición democrática."
 USA_creates_new_russia_TT: "We will move to form a new [RUS.GetFlag] Russian state\n - We may potentially lose any land that we have occupied in [RUS.GetFlag] Russia\n - This new [RUS.GetFlag] Russia will be part of NATO\n - Not choosing this option may have unforeseen consequences"
 USA_pacific_alliance_TT: "Es §Hmás probable§! que acepten si tenemos relaciones superiores a §H20§! y son §Bdemocráticas§!\n\nImportancia estratégica de esta acción:\n- La región del Pacífico está cayendo rápidamente bajo la influencia de un §H[CHI.GetFlag] [CHI.GetName]§! cada vez más dominante, y esto empieza a preocupar a nuestra comunidad de inteligencia.\n- Al lograr que §H[JAP.GetFlag] Japón§! y otros actores regionales como §H[KOR.GetFlag] Corea§! formen una facción contra esta creciente amenaza, podríamos debilitar significativamente la influencia de §H[CHI.GetFlag] China§! en la región y crear un pacto defensivo que garantizaría la seguridad de cada nación."
 USA_arming_saud_TT: "Importancia estratégica de esta acción:\n- En la actualidad, Oriente Medio se ha convertido en una región conflictiva y devastada por la guerra, con pocos actores regionales estables, con la excepción de [ISR.GetFlag] §HIsrael§! y países del Golfo como [SAU.GetFlag] §HArabia Saudita§!. Es imperativo que nos movilicemos para armar a estos pocos estados para que estén preparados si una fuerza desestabilizadora decide embarcarse en una agresiva campaña de destrucción."
 USA_backing_moldova_TT: "Importancia estratégica de esta acción:\n - §HMoldova§! [MLV.GetFlag] y §HUcrania§! [UKR.GetFlag] son víctimas del enfoque irredentista de Moscú hacia Europa Oriental y, más específicamente, hacia los Estados postsoviéticos. Apoyaremos la soberanía de estas naciones y les aseguraremos que son dueñas de sus propias tierras.\n - Debilitaremos significativamente la influencia y el control §Hruso§! [SOV.GetFlag] en la región, especialmente si se cumplen todos nuestros objetivos."
 USA_pressuring_iran_TT: "Importancia estratégica de esta acción:\n - §HIrán§! [PER.GetFlag] se está apresurando a conseguir una bomba nuclear, y no hay duda de ello. Debemos hacer todo lo que esté a nuestro alcance para evitar que §HIrán§! [PER.GetFlag] obtenga un arma nuclear, lo que incluirá sancionarlos para que su economía caiga en picado.\n - Al emitir una advertencia ahora, seremos capaces de justificar un ataque en el futuro sobre suelo §Hiraní§! [PER.GetFlag] si deciden ignorar la diplomacia y continuar con sus sádicas ambiciones."
 USA_2_percent_TT: "Importancia estratégica de esta acción:\n- Los estados de la §COTAN§! han estado aprovechándose de la ayuda estadounidense durante demasiado tiempo, y ya es hora de que exijamos que aumenten su gasto o se arriesguen a las consecuencias políticas que se avecinan.\n- Al presionar a nuestros aliados de la §COTAN§! para que aumenten el gasto, mantendremos a la mayor parte de Europa preparada para cualquier posible invasión de potencias extranjeras."
 USA_if_iran_loses_TT: "Si [PER.GetFlag] Irán pierde:\n- [USA.GetFlag] Estados Unidos controlará todos los principales yacimientos petrolíferos iraníes.\n- [USA.GetFlag] Estados Unidos se apoderará de las islas Abu Musa.\n- [PER.GetFlag] El gobierno iraní quedará bajo el control de la ONU."
 USA_if_iran_wins_TT: "Si [PER.GetFlag] Irán se mantiene:\n- [PER.GetFlag] gobierno iraní ganará popularidad.\n- [USA.GetFlag] Estados Unidos perderá mucha influencia en Oriente Medio.\n- [PER.GetFlag] Irán podrá expandir su programa nuclear."
 USA_PER_war_TT: "Importancia estratégica de esta acción:\n - §HIrán§! [PER.GetFlag] se ha demorado demasiado en las negociaciones relativas a su programa nuclear. Es hora de que tomemos las riendas del asunto con nuestras propias manos.\n - Si logramos derrocar a §HIrán§! [PER.GetFlag] o forzarlos a hacer una concesión, ya no serán capaces de adquirir una bomba nuclear.\n - Si tenemos que emprender acciones militares contra §HIrán§! [PER.GetFlag], lo más probable es que volvamos a tener un §HIrán§! [PER.GetFlag] amigable en la región."
 USA_CHI_trade_war_TT: "Es §Hmás probable§! que los países acepten si tenemos relaciones superiores a §H20§!\n\nImportancia estratégica de esta acción:\n- §H[CHI.GetFlag] China§! ha ido aumentando lentamente su control económico sobre el mundo, lo que incluye la expansión de su comercio con nuestros aliados hasta el punto de que sus exportaciones superan las nuestras. Es hora de cambiar esto y restablecer la hegemonía económica §H[USA.GetFlag] estadounidense§!.\n- Trabajaremos para imponer una guerra comercial contra §H[CHI.GetFlag] China§! y para que los estados §Calineados con Occidente§! interrumpan el comercio con el gobierno §H[CHI.GetFlag] chino§!.\n- Esto dañará gravemente la economía de §H[CHI.GetFlag] China§! y fortalecerá la nuestra."
 USA_beating_gaddafi_TT: "Importancia estratégica de esta acción:\n- Una §H[LBA.GetFlag] Libia§! hostil es un norte de África hostil. Sin algún tipo de control sobre la región, nos expondríamos a perder una importante posición en el mundo.\n- Al derrocar al gobierno §H[LBA.GetFlag] Libio§!, esperamos conseguir un aliado o aliados fiables, dignos de confianza y estables, dependiendo de la gravedad del conflicto §H[LBA.GetFlag] Libio§!."
 USA_kicking_china_out_TT: "Importancia estratégica de esta acción:\n- Los §H[CHI.GetFlag] chinos§! han expandido rápidamente su influencia sobre gran parte de África. Esto amenaza nuestra hegemonía económica en la región y gran parte del mundo, lo que significa que, si no actuamos ahora, los §H[CHI.GetFlag] chinos§! podrían superarnos como superpotencia mundial.\n- Al atacar la influencia de los §H[CHI.GetFlag] chinos§! en toda África, podríamos salvar la región de una posible adquisición hostil. Además, tenemos la ventaja de que nuestra influencia reemplaza a la de los §H[CHI.GetFlag] chinos§!, pero no es por eso que lo hacemos, ¿verdad?"
 USA_russian_reset_TT: "They are §Hmore likely§! to accept if we have relations above §H0§!\n\nStrategic Importance Of This Action:\n - We have been rivals with §H[SOV.GetFlag] Russia§! for as long as we can remember, with little to no efforts being made to establish an official treaty between our nations.\n - By 'resetting' relations, we could ease tension in the world in hopes for a better future.\n - As part of the treaty we will require disarmament of nuclear weapons and transporters, lowering the amount of nuclear weapons in the world significantly."
 USA_support_ISR_TT: "Importancia estratégica de esta acción:\n- [ISR.GetFlag] §HIsrael§! es vulnerable a los ataques de estados extranjeros, en particular los de Oriente Medio y el norte de África. Si optamos por ignorar su situación, podrían ser víctimas de sus ataques.\n- Si apoyamos militarmente a [ISR.GetFlag] §HIsrael§!, no solo contaríamos con un aliado fuerte, sino que también obtendríamos una importante ventaja sobre ellos, lo que facilitaría considerablemente su expansión."
 department_of_state.60.t: "Estados Unidos Exige un Aumento en el Gasto Militar"
 department_of_state.60.d: "El presidente de Estados Unidos, [USA.GetLeader], ha exigido que aumentemos el gasto militar para cumplir con el mínimo del 2% establecido por los estándares de la alianza. Estados Unidos amenaza con represalias económicas si decidimos no aumentar el gasto."
 department_of_state.60.a: "Nosotros no tenemos elección"
 department_of_state.60.b: "Nunca"
 department_of_state.61.t: "[FROM.GetName] Refuses To Meet The Threshold"
 department_of_state.61.d: "[FROM.GetName] has failed to meet our demands for an increase in military spending, and has thus prompted outrage at the White House. We are looking at some form of consequence in exchange, but that is yet to be decided."
 department_of_state.61.a: "¡Tarifa de ellos!"
 department_of_state.61.b: "De todos modos estábamos fanfarroneando"
 department_of_state.62.t: "Washington Emite un Ultimátum"
 department_of_state.62.d: "Estados Unidos nos ha dado una opción: o permitimos que las fuerzas estadounidenses entren en Irán y desmantelen y observen nuestra tecnología nuclear, o las enfrentamos en el campo de batalla. Este es otro síntoma de la agresión y el imperialismo estadounidenses, que demuestra que, por mucho que intentemos negociar, seguirán haciendo lo que quieran."
 department_of_state.62.a: "Está bien, déjalos entrar."
 department_of_state.62.b: "Ordenar a las fuerzas armadas que estén preparadas"
 department_of_state.63.t: "Irán Rechaza Nuestros Términos"
 department_of_state.63.d: "En una acción casi suicida, el gobierno iraní decidió romper el ultimátum oficial emitido a principios de esta semana. Esto significa casi con certeza que desean continuar con su programa nuclear, y no nos queda otra opción que tomar cartas en el asunto."
 department_of_state.63.a: "Irán, has cometido un gran error."
 department_of_state.63.b: "Nosotros estábamos faroleando"
 department_of_state.64.t: "Irán Cede"
 department_of_state.64.d: "En una decisión nada sorprendente, el gobierno iraní anunció hoy que cederá ante las demandas estadounidenses y permitirá que expertos estadounidenses desmantelen su programa nuclear."
 department_of_state.64.a: "Buen comentario, Irán"
 department_of_state.65.t: "Fuerzas Armadas Iraníes se Movilizan"
 department_of_state.65.d: "The Iranian army today declared a general mobilization of all units across the nation in order to confront any American aggression on its soil. This move comes following American demands that Iran allow them to send their observers and experts to disassemble Iranian nuclear technology. This demand was of course rejected, and it prompted an immediate response from the American government. The United States congress today approved strikes on Iranian soil to take place in a move that shocked the whole nation, as anti-war sentiment has been high amongst American society for some decades now."
 department_of_state.65.a: "¿Una invasión a Irán? ¡Qué locura!"
 department_of_state.65.b: "El águila del imperialismo ataca a sus víctimas una vez más"
 department_of_state.66.t: "Fuerzas Estadounidenses se Retiran de Irán"
 department_of_state.66.d: "In una bochornosa rueda de prensa celebrada hoy, [USA.GetLeader] ha anunciado la retirada total de Irán y un llamamiento inmediato a un alto el fuego entre ambas naciones. Esto se produce después de que las fuerzas estadounidenses fracasaran repetidamente en cumplir con sus objetivos operativos, lo que derivó en un estancamiento en las regiones rocosas de Irán. Las elevadas bajas y los costes exorbitantes también contribuyeron a esta medida, ya que la presión del público debilitó el apoyo continuo al conflicto. Los medios de comunicación y la televisión estatal de Irán ya han comenzado a celebrar la victoria, subiéndose a una ola de renovada popularidad y respaldo. También se informa que Irán mantendrá su postura previa a la guerra sobre sus ambiciones nucleares, lo que significa que el conflicto logró poco más que un derramamiento de sangre innecesario."
 department_of_state.66.a: "¿Quién lo hubiera adivinado?"
 department_of_state.67.t: "Fuerzas Iraníes Colapsan Bajo la Presión de EE.UU."
 department_of_state.67.d: "Hoy temprano, un portavoz oficial de las Fuerzas Armadas iraníes anunció las condiciones oficiales de rendición del conflicto y acordó ordenar el cese inmediato de las operaciones. Este anuncio provocó el colapso del gobierno iraní, con la huida de varios altos funcionarios a otras partes del mundo. Si bien las Fuerzas Armadas iraníes no se disolverán como resultado de las condiciones de rendición, quedarán bajo la supervisión de la ONU junto con otros recursos gubernamentales iraníes hasta que se encuentre un reemplazo adecuado."
 department_of_state.67.a: "¿Se fracturará Irán?"
 department_of_state.68.t: "Victoria Sobre Irán"
 department_of_state.68.d: "Nuestra victoria en Irán significaría que no nos iremos a casa con las manos vacías. Hemos establecido zonas de seguridad alrededor de los yacimientos petrolíferos iraníes y hemos contratado a varias grandes empresas para que inicien operaciones a finales de este año. También nos hemos apoderado de las estratégicamente importantes islas Abu Musa en el estrecho de Ormuz para proyectar mayor poder naval."
 department_of_state.68.a: "Las armas nucleares no importan tanto como el oro negro"
 department_of_state.69.t: "Triunfo Sobre el Invasor"
 department_of_state.69.d: "Hemos superado lo imposible y derrotado al ejército invasor estadounidense. Hoy se celebrará la victoria durante siglos."
 department_of_state.69.a: "¡Sea pish!"
 department_of_state.70.t: "Reza Pahlavi Asciende al Poder"
 department_of_state.70.d: "La misión de la ONU en Irán ha decidido otorgarle a Reza Pahlavi el control del país. Esta decisión cuenta con amplio apoyo en todo nuestro gobierno y en varios estados aliados."
 department_of_state.70.a: "De acuerdo"
 department_of_state.71.t: "Rebeldía en Jorasán"
 department_of_state.71.d: "Parece que la fallida invasión estadounidense ha provocado un levantamiento en Khorasan, arriesgando el colapso de todo el estado y colocando a Irán bajo un régimen chiíta radical una vez más."
 department_of_state.71.a: "Mierda"
 department_of_state.71.b: "Bueno.. (jugar como)"
 department_of_state.72.t: "Insurgencia en el Este de Irán"
 department_of_state.72.d: "Shots rang out in Mashhad and other cities across the Khorasan region in Iran earlier today, disturbing residents and peacekeeping troops. Rumours of an insurgency had been spreading since the American invasion, with former IRGC officers and units rallying under a loose confederation of Clerics taking refuge in the countryside. It appears that they have formally rallied under the radical Ayatollah Mohammad-Taqi Mesbah-Yazdi, who has sworn to march his men into Tehran by the end of the month. Fingers are being pointed in all directions, but the main blame is being placed on the United States, being accused of setting up a botched peace process and not establishing the necessary security measures needed to prevent an insurgency to the likes of what we are seeing now."
 department_of_state.72.a: "Oh, mierda"
 department_of_state.73.t: "Estados Unidos Nos Pide que Reduzcamos Negocios con China"
 department_of_state.73.d: "El gobierno de los Estados Unidos ha enviado una solicitud formal a docenas de naciones pidiendo formalmente que cese de inmediato todo comercio y cooperación económica con China. Los Estados Unidos declararon que, durante un breve período de tiempo, debemos participar en una protesta global contra el neoimperialismo chino y sus dudosas prácticas, que implican atrapar con deudas a naciones más pequeñas, entre otras cosas."
 department_of_state.73.a: "China debe aprender que sus acciones tienen consecuencias"
 department_of_state.73.b: "No enojaremos a nuestros amigos chinos"
 department_of_state.74.t: "Estados Unidos Inicia una Peligrosa Guerra Comercial"
 department_of_state.74.d: "Estados Unidos envió hoy cartas y solicitudes a docenas de países solicitando el cese inmediato de toda actividad económica con nuestra nación. Esta medida es un indicio de la naturaleza malvada, celosa y ávida de poder de los estadounidenses. Tomaremos nota de quién nos traiciona y traiciona nuestra confianza, y no olvidaremos la humillación que Estados Unidos ha intentado infligirnos."
 department_of_state.74.a: "¿Qué carajo América?"
 department_of_state.75.t: "Venezuela Estalla en Guerra Civil"
 department_of_state.75.d: "Following a lengthy intelligence assessment, the United States predicted that Democratic Venezuelan rebels would soon rebel against the regime of [VEN.GetLeader]. Unsurprisingly, their predictions came true and almost perfectly matched the outcome the Americans had predicted. This terrifying accuracy has made some believe that the United States is behind the chaos now engulfing Venezuela. Opposition forces united behind Leopoldo Lopez are waging an all-out conflict against the Venezuelan ruling order. The United States has vowed to support the rebel forces, stating that the toppling of the Venezuelan regime is a goal that must not be compromised."
 department_of_state.75.a: "Otra nación se convierte en un mero campo de batalla"
 department_of_state.75.b: "La codicia occidental no tiene límites"
 department_of_state.76.t: "Estalla una Guerra Comercial Entre Estados Unidos y China"
 department_of_state.76.d: "Earlier this week, [USA.GetLeader] authorized the release of several documents listing out the grievances of the United States against the Chinese state. The main highlight of these documents was the American concern regarding Chinese 'economic imperialism'. Following the release of these documents, the United States issued several requests to dozens of nations around the globe formally requesting that nations cut back on their economic cooperation with China, and instead pivot to states who have 'a more reliable track record'. [CHI.GetLeader] issued a statement condemning the move and calling it childish in nature."
 department_of_state.76.a: "Al menos mis cuentas offshore siguen seguras"
 department_of_state.76.b: "Esos molestos Estadounidenses"
 department_of_state.77.t: "Estados Unidos Desea \"Reiniciar\" las Relaciones"
 department_of_state.77.d: "The United States government has come to us requesting that we get onboard with their 'reset' agenda. The move did not come out of nowhere, it has been discussed and debated by American politicians for months now. Now however, it finally seems like they have made up their mind, seeming more adamant than ever about us signing their treaty. A key pillar of the 'reset' program is the disarmament of nuclear weapons and transports, which many in our state feel uncomfortable doing. However, the Americans have promised to follow suit and also disarm a portion of their stockpile if we decide to sign their treaty and pose for the media."
 department_of_state.77.a: "Bien lo firmaremos"
 department_of_state.77.b: "Ya hemos superado eso, Estados Unidos."
 department_of_state.78.t: "Estados Unidos Interviene en Libia"
 department_of_state.78.d: "The U.S. Government has decided that it is in its best interest to begin an intervention within Libya to help topple its ruler, [LBA.GetLeader]. The United States is landing troops on the ground, though not very many. The forces will mostly be there to help maintain peace and fight back against [LBA.GetLeader]'s forces. At home the move is being heavily criticized by anti-war protesters and isolationists as they believe that the United States should not involve itself in other nations' conflicts for the sake of 'stability'. Still, U.S. president [USA.GetLeader] insists that the move is a necessary measure to ensure that further bloodshed does not erupt."
 department_of_state.78.a: "Está bien, si insistes"
 department_of_state.79.t: "Estados Unidos Daña Gravementen Nuestra Influencia en África"
 department_of_state.79.d: "The United States has launched an extensive campaign to rid Africa of all our influence. They've conducted significant operations to do this, and every single nation in which we held influence has now been affected."
 department_of_state.79.a: "Esos bastardos"
 department_of_state.80.t: "¡Rusia Acepta \"Reiniciar\" las Relaciones!"
 department_of_state.80.d: "El gobierno ruso ha acordado restablecer las relaciones diplomáticas y desarmar parte de sus arsenales nucleares. Como prometimos, también se espera que desarmemos parte de nuestros propios arsenales. Nos reuniremos con los líderes rusos a finales de esta semana para anunciar públicamente la medida."
 department_of_state.80.a: "¡Bien!"
 department_of_state.81.t: "¡Rusia se Niega a \"Reiniciar\" las Relaciones!"
 department_of_state.81.d: "The Russian government appeared disinterested in 'resetting' relations, stating that relations are currently at a point beyond repair. They also state that our government could not be trusted as a result of constantly changing leadership."
 department_of_state.81.a: "They must be up to no good."
 department_of_state.82.t: "Estados Unidos y Rusia \"Reinician\" las Relaciones"
 department_of_state.82.d: "In a press conference hosted by the Russian and American foreign ministers today the announcement was made that the United States and Russia will be formally 'resetting' relations. A button that had the word 'reset' was held by both parties and pressed at the same time to symbolize the official resetting of relations between the two rival powers. For decades, the United States and Russia have been going head-to-head in a never ending game of chess, using the world as their board and individual nations as their pieces. Today there seems to be hope, hope for a brighter future, hope for a peaceful resolution to the nuclear problem, and hope for cooperation between global powers. It must be noted that the initiative may collapse, and the world could return to the stage of hostilities prior to the 'resetting' of relations."
 department_of_state.82.a: "¡Un tremendo paso adelante para la humanidad!"
 department_of_state.83.t: "Estados Unidos Brinda Apoyo Militar"
 department_of_state.83.d: "Estados Unidos se ha ofrecido, en esencia, a entrenar a nuestras unidades, insistiendo en que sólo la experiencia estadounidense podría salvar a Israel de convertirse en víctima de estados enemigos."
 department_of_state.83.a: "De acuerdo"
 department_of_state.83.b: "No"
 department_of_state.84.t: "OTAN Comienza a Armar y Respalda a Ucrania"
 department_of_state.84.d: "Varios países de la OTAN, incluido Estados Unidos, han declarado su apoyo total e incondicional a Ucrania. Afirman que, debido a la agresión rusa, no les queda otra opción que enviar armas de inmediato a Ucrania para demostrar a Moscú que la comunidad internacional tiene ley y orden. El gobierno ruso ha declarado que la medida es una provocación y podría desembocar en una guerra, pero los líderes occidentales desmienten a [SOV.GetLeader] al respecto. El líder ucraniano [UKR.GetLeader] ha apoyado la medida, afirmando que «es justo» apoyar la independencia de Ucrania ante la agresión rusa."
 department_of_state.84.a: "¡Ucrania tiene derecho a defenderse!"
 department_of_state.84.b: "Ucrania no es más que un simple peón en una partida de ajedrez."
 department_of_state.85.t: "Estados Unidos Solicita Apoyo Unilateral para Ucrania"
 department_of_state.85.d: "El Estado ucraniano se encuentra bajo el asalto ruso, y los Estados Unidos declaran que solo la NATO como alianza podría ayudar a detener la maquinaria de guerra rusa. También se nos pide que enviemos voluntarios extranjeros como parte de la legión extranjera ucraniana para ayudar militarmente al ejército de Ucrania."
 department_of_state.85.a: "¡De inmediato!"
 department_of_state.85.b: "No"
 department_of_state.86.t: "Bombardeo Atómico de Rusia"
 department_of_state.86.d: "Lo indescriptible ha sucedido. Hoy temprano, varios misiles nucleares estadounidenses fueron lanzados desde silos hacia importantes ciudades rusas no ocupadas por fuerzas aliadas, diezmándolas. Aunque no se ha calculado oficialmente el número de muertos, se dice que las ciudades afectadas están contaminadas con radiación, lo que las hace prácticamente inhabitables. Décadas de diplomacia de la Guerra Fría fueron en vano, ya que muchas ciudades quedaron en ruinas. Se espera una respuesta del Kremlin."
 department_of_state.86.a: "\"La Cuarta Guerra Mundial se librará con palos y piedras\""
 department_of_state.87.t: "Bombardeo Atómico de Estados Unidos"
 department_of_state.87.d: "Ha ocurrido lo indescriptible. Hoy temprano, varios misiles nucleares rusos fueron lanzados desde silos hacia importantes ciudades estadounidenses no ocupadas por sus fuerzas, diezmándolas. Aunque no se ha calculado oficialmente el número de muertos, se dice que las ciudades afectadas están contaminadas con radiación, lo que las hace prácticamente inhabitables. Décadas de diplomacia de la Guerra Fría fueron en vano, ya que muchas ciudades quedaron en ruinas. Se espera una respuesta de Washington."
 department_of_state.87.a: "\"La Cuarta Guerra Mundial se librará con palos y piedras\""
 department_of_state.88.t: "Bombardeos Atómicos de Europa"
 department_of_state.88.d: "Lo indescriptible ha sucedido. Hoy temprano, varios misiles nucleares rusos fueron lanzados desde silos hacia importantes capitales europeas no ocupadas por sus fuerzas, diezmándolas. Aunque no se ha calculado oficialmente el número de muertos, se dice que las ciudades afectadas están contaminadas con radiación, lo que las hace prácticamente inhabitables. Décadas de diplomacia de la Guerra Fría fueron en vano, ya que muchas ciudades quedaron en ruinas. Se espera una respuesta de estos estados. Se dice que solo los estados involucrados en el conflicto contra Rusia han sido alcanzados."
 department_of_state.88.a: "\"La Cuarta Guerra Mundial se librará con palos y piedras\""
 department_of_state.89.t: "¡Nuestra capital ha sido atacada con armas nucleares!"
 department_of_state.89.d: "Un misil balístico intercontinental ruso impactó hoy nuestra capital, causando una destrucción inimaginable en la ciudad. La zona se contaminó con radiación y, como resultado, muchas personas han muerto. Se desconoce el número total de muertos hasta el momento."
 department_of_state.89.a: "¡Esos malditos rusos!"
 department_of_state.90.t: "¡Estambul ha sido atacada con armas nucleares!"
 department_of_state.90.d: "Un misil balístico intercontinental ruso impactó hoy en Estambul, provocando una destrucción inimaginable en la ciudad. La zona se contaminó con radiación y, como resultado, muchas personas murieron. Se desconoce el número total de muertos por el momento."
 department_of_state.90.a: "¡Esos malditos rusos!"
 department_of_state.91.t: "Several Cities Hit By Russian ICBMs"
 department_of_state.91.d: "Several of our major cities have been hit by Russian ICBMs. The cities listed out are Washington D.C., Los Angeles, New York, Miami, and Austin. These cities have been contaminated with radiation, and the extent of the damage is unknown as of now."
 department_of_state.91.a: "Esos malditos rusos"
 department_of_state.92.t: "Several Cities Hit By American ICBMs"
 department_of_state.92.d: "Several of our major cities have been hit by American ICBMs. The cities listed out are Moscow, St. Petersburg, Volgograd, Yekaterinburg, and Kemerovo. These cities have been contaminated with radiation, and the extent of the damage is unknown as of now."
 department_of_state.92.a: "Esos malditos estadounidenses"
