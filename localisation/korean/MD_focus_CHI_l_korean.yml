 CHI_xi_peoples_champion: "인민의 수호자"
 CHI_zeng_succession_architect: "승계의 설계자"
 chinese_aligned: "중국 우호"
 chinese_aligned_desc: "이 장교는 중국 정보기관과 은밀한 접촉을 유지하고 있습니다. 합동 계획에 대한 조율은 자연스럽게 이루어지지만, 국가에 대한 충성은 보장되지 않습니다."
