 SAU_Asia_foregin_policy: "Asia Policy"
 SAU_Asia_foregin_policy_desc: "Asia is the future. China, India, Japan, Korea - the kingdom's biggest customers. The pivot to Asia is economic and strategic."
 SAU_asia_foreign_policy_01: "China: The Strategic Partner"
 SAU_asia_foreign_policy_01_desc: "China is the kingdom's largest oil customer and growing strategic partner. The relationship spans energy, infrastructure, technology, and diplomacy."
 SAU_asia_foreign_policy_02: "Oil for Goods"
 SAU_asia_foreign_policy_02_desc: "Saudi oil flows to China. Chinese goods flow to Saudi Arabia. The energy-trade nexus binds the two economies."
 SAU_asia_foreign_policy_03: "Yuan Oil Trading"
 SAU_asia_foreign_policy_03_desc: "The kingdom accepts yuan for oil sales. The petrodollar's dominance is challenged. Beijing and Riyadh reshape global finance."
 SAU_asia_foreign_policy_04: "Chinese Infrastructure"
 SAU_asia_foreign_policy_04_desc: "Chinese companies build Saudi infrastructure. Ports, railways, and cities rise with Chinese labor and Saudi capital."
 SAU_asia_foreign_policy_05: "Huawei Partnership"
 SAU_asia_foreign_policy_05_desc: "Huawei builds the kingdom's 5G network. The US objects; Riyadh doesn't care. Chinese technology powers Saudi digitalization."
 SAU_asia_foreign_policy_06: "Chinese Investment"
 SAU_asia_foreign_policy_06_desc: "Chinese capital invests in Saudi projects. The Belt and Road meets Vision 2030. The New Silk Road passes through Riyadh."
 SAU_asia_foreign_policy_07: "Space Cooperation"
 SAU_asia_foreign_policy_07_desc: "Chinese satellites, launch vehicles, and space technology flow to Saudi Arabia. The kingdom's space program partners with Beijing."
 SAU_asia_foreign_policy_08: "Nuclear Cooperation"
 SAU_asia_foreign_policy_08_desc: "Chinese nuclear technology helps build Saudi reactors. Peaceful nuclear energy reduces oil dependence."
 SAU_asia_foreign_policy_09: "Military Cooperation"
 SAU_asia_foreign_policy_09_desc: "Chinese drones, missiles, and potentially fighter jets diversify Saudi arms sources. The kingdom is no longer dependent on Washington alone."
 SAU_asia_foreign_policy_10: "Drone Partnership"
 SAU_asia_foreign_policy_10_desc: "Chinese Wing Loong and CH-4 drones join the RSAF. Saudi Arabia operates Chinese UAVs alongside American Predators."
 SAU_asia_foreign_policy_11: "Ballistic Missile"
 SAU_asia_foreign_policy_11_desc: "The kingdom's Chinese DF-3 and DF-21 missiles remain its strategic deterrent. New purchases expand the arsenal."
 SAU_asia_foreign_policy_12: "Asian Diplomatic Hub"
 SAU_asia_foreign_policy_12_desc: "Riyadh becomes a hub for Asian diplomacy. Chinese, Japanese, Korean, and Indian leaders all visit. The kingdom speaks to Asia."
 SAU_asia_foreign_policy_13: "Asian Investment Fund"
 SAU_asia_foreign_policy_13_desc: "A joint investment fund with Asian partners channels capital into Saudi projects. Asian money builds the kingdom."
 SAU_asia_foreign_policy_14: "Asian Technology Transfer"
 SAU_asia_foreign_policy_14_desc: "Asian technology - Chinese, Japanese, Korean - transfers to Saudi factories and labs. The kingdom learns from the East."
 SAU_asia_foreign_policy_15: "Asian Education Exchange"
 SAU_asia_foreign_policy_15_desc: "Saudi students study in Beijing, Tokyo, and Seoul. Asian students come to Saudi universities. Educational exchange deepens ties."
 SAU_asia_foreign_policy_16: "Asian Labor Import"
 SAU_asia_foreign_policy_16_desc: "Asian workers - Filipino, Indian, Pakistani, Bangladeshi - build the kingdom. The Saudi economy runs on Asian labor."
 SAU_asia_foreign_policy_17: "Asian Muslim Outreach"
 SAU_asia_foreign_policy_17_desc: "The Muslim World League reaches Asian Muslims. Indonesia, Malaysia, Pakistan - all receive Saudi religious diplomacy."
 SAU_asia_foreign_policy_18: "Islamic Finance in Asia"
 SAU_asia_foreign_policy_18_desc: "Saudi Islamic finance products sell in Asia. Malaysia, Indonesia, and Hong Kong all issue sukuk under Saudi guidance."
 SAU_asia_foreign_policy_19: "Asian Hajj Pilgrims"
 SAU_asia_foreign_policy_19_desc: "Millions of Asian pilgrims perform Hajj. The kingdom manages the largest annual migration on Earth."
 SAU_asia_foreign_policy_20: "Asian Counter-Terror"
 SAU_asia_foreign_policy_20_desc: "Counter-terrorism cooperation with Asian partners. Intelligence sharing on extremist networks, financial tracking, and joint operations."
 SAU_asia_foreign_policy_21: "Maritime Security"
 SAU_asia_foreign_policy_21_desc: "The Indian Ocean and the South China Sea matter to Saudi oil exports. Maritime security cooperation with Asian navies protects the sea lanes."
 SAU_asia_foreign_policy_22: "Asian Energy Security"
 SAU_asia_foreign_policy_22_desc: "Asian energy security depends on Saudi oil. The kingdom guarantees supply. Asia guarantees demand. The relationship is symbiotic."
 SAU_asia_foreign_policy_23: "Asian Sovereign Investment"
 SAU_asia_foreign_policy_23_desc: "Asian sovereign wealth funds invest alongside the PIF. Chinese, Japanese, and Korean capital joins Saudi money in global investments."
 SAU_asia_foreign_policy_24: "Asian Manufacturing Partnership"
 SAU_asia_foreign_policy_24_desc: "Asian manufacturers set up factories in Saudi Arabia. Chinese, Korean, and Japanese companies produce for the regional market."
 SAU_asia_foreign_policy_25: "Asian Digital Partnership"
 SAU_asia_foreign_policy_25_desc: "Asian tech companies - Alibaba, Tencent, Samsung - partner with Saudi firms. The digital economy connects East and West."
 SAU_asia_foreign_policy_26: "Asian Tourism"
 SAU_asia_foreign_policy_26_desc: "Asian tourists visit the Red Sea Project, AlUla, and Mecca. The tourism opening targets Asia's growing middle class."
 SAU_asia_foreign_policy_27: "Asian Healthcare Partnership"
 SAU_asia_foreign_policy_27_desc: "Asian hospitals and medical centers operate in Saudi Arabia. Indian doctors, Filipino nurses, and Japanese medical technology."
 SAU_asia_foreign_policy_28: "Asian Food Security"
 SAU_asia_foreign_policy_28_desc: "Saudi investment in Asian agriculture secures food supplies. Rice from India, fruit from Thailand, seafood from Indonesia."
 SAU_asia_foreign_policy_29: "Asian Climate Cooperation"
 SAU_asia_foreign_policy_29_desc: "Climate cooperation with Asian partners. Solar technology, carbon capture, and the Saudi Green Initiative connect to Asian environmental efforts."
 SAU_asia_foreign_policy_30: "Asian Cultural Exchange"
 SAU_asia_foreign_policy_30_desc: "Cultural exchanges with Asian nations. Art exhibitions, film festivals, and academic cooperation connect Saudi Arabia to Asia."
 SAU_asia_foreign_policy_31: "Asian Media Partnership"
 SAU_asia_foreign_policy_31_desc: "Media partnerships with Asian outlets. Saudi vision projects on Asian screens. Asian content on Saudi platforms."
 SAU_asia_foreign_policy_32: "Asian Sports Investment"
 SAU_asia_foreign_policy_32_desc: "Saudi investment in Asian sports. Football partnerships, golf tournaments, and martial arts events connect the kingdom to Asian audiences."
 SAU_asia_foreign_policy_33: "Asian Defense Sales"
 SAU_asia_foreign_policy_33_desc: "Saudi defense sales to Asian partners. The kingdom becomes an arms exporter, not just an importer."
 SAU_asia_foreign_policy_34: "Asian Strategic Partnership"
 SAU_asia_foreign_policy_34_desc: "A comprehensive strategic partnership with Asia. Energy, trade, technology, defense, and culture - the relationship spans everything."
 SAU_asia_foreign_policy_35: "Asian Pivot Complete"
 SAU_asia_foreign_policy_35_desc: "The kingdom's pivot to Asia is complete. China is the top trade partner. India the top oil customer. Japan and Korea major investors. The kingdom's center of gravity shifts east."
 SAU_asia_foreign_policy_36: "Asian Hegemony"
 SAU_asia_foreign_policy_36_desc: "The kingdom's influence in Asia grows. From energy to finance to technology, Saudi Arabia shapes the Asian century."
 SAU_asia_foreign_policy_37: "Asian Century Partnership"
 SAU_asia_foreign_policy_37_desc: "The 21st century belongs to Asia. Saudi Arabia positions itself as Asia's Arab partner. The relationship defines the century."
 SAU_asia_foreign_policy_38: "Asian Alliance Network"
 SAU_asia_foreign_policy_38_desc: "A network of alliances across Asia. China, India, Japan, Korea, ASEAN - all connected to Riyadh. The kingdom's Asian diplomacy succeeds."
 SAU_asia_foreign_policy_39: "Asian Legacy"
 SAU_asia_foreign_policy_39_desc: "The kingdom's Asian legacy is secure. Energy partnerships, trade ties, and strategic relationships span the continent. Saudi Arabia is Asia's Arab anchor."
 SAU_com_arabian_comintern: "The Arabian Comintern"
 SAU_com_arabian_comintern_desc: "Arabia becomes the seat of a new revolutionary international, coordinating communist movements across the region."
 SAU_com_command_economy: "The Command Economy"
 SAU_com_command_economy_desc: "Production is planned from the center. Quotas replace markets, and the state directs every factory and field."
 SAU_com_permanent_revolution: "The Permanent Revolution"
 SAU_com_permanent_revolution_desc: "The revolution is declared unending, exporting itself abroad and renewing itself at home against all reaction."
 SAU_coronation_abdullah: "§HCoronation of King Abdullah§!"
 SAU_coronation_abdullah_desc: "August 3, 2005. Abdullah bin Abdulaziz is proclaimed §LKing§! and §LCustodian of the Two Holy Mosques§!. The princes pledge §Hbayah - allegiance§!. The kingdom has its sixth king."
 SAU_death_of_king_abdullah: "§GThe Death of King Abdullah§!"
 SAU_death_of_king_abdullah_desc: "January 23, 2015. King Abdullah bin Abdulaziz dies at §L90§!. A reign of §Lten years§! ends. The §LAllegiance Council§! convenes within hours. Four princes have §Hcredible claims§! to the throne. The kingdom holds its breath."
 SAU_death_of_king_fahd: "§GThe Death of King Fahd§!"
 SAU_death_of_king_fahd_desc: "August 1, 2005. King Fahd bin Abdulaziz dies at the age of §L84§!. Ten years of Abdullah's regency end. The kingdom mourns - and waits. The §Lsuccession pact§! is about to be tested."
 SAU_decisive_storm_category: "Operation Decisive Storm"
 SAU_decisive_storm_category_desc: "The coalition is flying, and it is flying without a declaration of war. The Kingdom's aircraft strike where they are sent, the Republic's forces are armed and paid, and the ground war is left to Yemenis - which is the arrangement everyone in Riyadh privately expects to last a great deal longer than anyone has said.\n\n§HCoalition partners§!: §Y[?SAU_coalition_partners|0]§!"
 SAU_diplomatic_foreign_policy_01: "Diplomatic Engagement"
 SAU_diplomatic_foreign_policy_01_desc: "Diplomacy is the preferred instrument. Summit meetings, bilateral visits, and multilateral engagement project Saudi influence."
 SAU_Eastern_foregin_policy: "Eastern Policy"
 SAU_Eastern_foregin_policy_desc: "Iran, Pakistan, Afghanistan, and beyond - the eastern neighborhood requires careful management. Containment, engagement, and occasional confrontation."
 SAU_eastern_foreign_policy_01: "China Strategic Partnership"
 SAU_eastern_foreign_policy_01_desc: "China is Saudi Arabia's largest oil customer. The relationship deepens: infrastructure investment, technology cooperation, and diplomatic coordination."
 SAU_eastern_foreign_policy_02: "Belt and Road"
 SAU_eastern_foreign_policy_02_desc: "Saudi Arabia joins the Belt and Road Initiative. Chinese infrastructure investment flows to the kingdom. The New Silk Road passes through Riyadh."
 SAU_eastern_foreign_policy_03: "India Energy Partnership"
 SAU_eastern_foreign_policy_03_desc: "India's growing economy needs Saudi oil. The energy partnership deepens into trade, investment, and strategic cooperation."
 SAU_eastern_foreign_policy_04: "Japan Alliance"
 SAU_eastern_foreign_policy_04_desc: "Japan has been a reliable oil customer for decades. The relationship expands into technology, investment, and cultural exchange."
 SAU_eastern_foreign_policy_05: "South Korea Partnership"
 SAU_eastern_foreign_policy_05_desc: "Korean construction companies build Saudi infrastructure. Samsung and LG operate in the kingdom. The partnership is economic and technological."
 SAU_eastern_foreign_policy_06: "Pakistan Strategic Alliance"
 SAU_eastern_foreign_policy_06_desc: "Pakistan and Saudi Arabia share deep ties. Pakistani troops have served in the Saudi military. Saudi aid flows to Pakistan. The nuclear question lingers."
 SAU_eastern_foreign_policy_07: "Afghanistan Engagement"
 SAU_eastern_foreign_policy_07_desc: "Saudi Arabia engages with Afghanistan's rulers. Aid, diplomacy, and the hope of stability on the eastern frontier."
 SAU_eastern_foreign_policy_08: "Iran Containment"
 SAU_eastern_foreign_policy_08_desc: "Iran is the kingdom's primary regional rival. Containment through proxy conflicts, diplomatic pressure, and military buildup. The cold war heats up."
 SAU_eastern_foreign_policy_09: "Central Asia Outreach"
 SAU_eastern_foreign_policy_09_desc: "The Muslim republics of Central Asia - Kazakhstan, Uzbekistan, Turkmenistan - receive Saudi aid and investment. Islamic diplomacy extends eastward."
 SAU_End_of_2010_plan: "2010 Plan Completion"
 SAU_End_of_2010_plan_desc: "The five-year development plan reaches its conclusion. Infrastructure is built. Industries are established. The economic foundation for Vision 2030 is laid."
 SAU_FA_affirm_pakistani_ties: "Affirm Pakistani Ties"
 SAU_FA_affirm_pakistani_ties_desc: "As one of the largest Muslim-majority countries in the world, Pakistan is a country that has cultural, economic and geopolitical value to us. We should therefore ensure that our ties with the Pakistanis are as strong as they possibly can be."
 SAU_FA_align_with_iran: "Undermine Neighbors"
 SAU_FA_align_with_iran_desc: "The Shia of the Arabian Gulf have long been oppressed by hostile monarchies. We should encourage these oppressed minorities to agitate against their governments."
 SAU_FA_amplify_sectarian_rhetoric: "Amplify Sectarian Rhetoric"
 SAU_FA_amplify_sectarian_rhetoric_desc: "Sectarianism, despite what Western media may suggest, is not a permanent feature of Middle Eastern politics. Nonetheless, recent events have indeed exacerbated tensions between Sunni and Shia across the region, tensions that provide us with a useful opportunity to undermine Shia Iran."
 SAU_FA_antagonize_iran: "Antagonize Iran"
 SAU_FA_antagonize_iran_desc: "Since 1979 the Arab monarchies have faced an existential threat in the form of the Islamic Republic of Iran. While at times relations have been lukewarm, we have always understood that Iran's revolutionary brand of political Islam threatens the stability of the region and, by extension, our own government."
 SAU_FA_attack_foreign_stooges: "Demand the Expulsion of Foreign Troops"
 SAU_FA_attack_foreign_stooges_desc: "Many countries host military bases for foreign nations with imperial aspirations in the region. Whether it is American or Russian troops that these countries host on their soil, they must order them to leave immediately or face the consequences."
 SAU_FA_back_an_intifada: "Back an Intifada"
 SAU_FA_back_an_intifada_desc: "The Palestinian people demand to be heard. An Intifada will remind the world that their suffering is not to be tolerated and show Israel that their occupation of Palestine is not sustainable."
 SAU_FA_back_the_syrian_opposition: "Arm the Opposition"
 SAU_FA_back_the_syrian_opposition_desc: "[SYR.GetLeader] is a brutal dictator but also, more importantly, a threat to our interests in the region. We should send support to opposition groups who could rid the region of this menace."
 SAU_FA_behead_the_snake: "Behead the Snake"
 SAU_FA_behead_the_snake_desc: "The Americans must be made aware of the threat that Iran poses to both of our nations. The country's nuclear program, its support for subversive elements across the region, and its radical, extremist ideology demand a rapid and decisive armed response. We should make it clear to the United States that they must either cut off the head of the snake that is the Islamic Republic of Iran, or risk destruction."
 SAU_FA_cash_for_land: "Cash for Land"
 SAU_FA_cash_for_land_desc: "When it comes to issues as emotive as Israeli settlements and Palestinian refugees, cold hard cash may seem an inappropriate solution. Nonetheless, financial compensation is a point that our peace proposal depends on, and as such we must be willing to put up the funds necessary to compensate and support the resettlement of hundreds of thousands, even millions of people."
 SAU_FA_combat_iranian_influence: "Combat Iranian Influence"
 SAU_FA_combat_iranian_influence_desc: "Iran's influence has been growing in both Sunni and Shia states alike. We should use our own influence to resist Iran's attempts at soft power expansion or face an extension of Iran's so-called \"Resistance Axis\" and the Shia Crescent."
 SAU_FA_combat_saudi_influence: "Criticize the Occupation"
 SAU_FA_combat_saudi_influence_desc: "Regrettably, many Arab states have chosen to avoid making overt condemnations of Israel to avoid negatively impacting diplomatic relations. We should make no such consideration, and condemn the illegal Israeli occupation in the strongest terms possible."
 SAU_FA_confront_iranian_partners: "Blockade Persian Partners"
 SAU_FA_confront_iranian_partners_desc: "The Gulf Cooperation Council was envisioned as a united front against common threats to the Arab monarchies of the Gulf. This unity has been fractured by differing approaches towards the threat posed by Iran, with some of our erstwhile partners pursuing amicable relations with our deadly enemy. This can be tolerated no longer."
 SAU_FA_deepen_military_cooperation: "Deepen Military Cooperation"
 SAU_FA_deepen_military_cooperation_desc: "The Pakistani military is one of the most experienced and well-trained militaries in the Muslim world. We can benefit from this expertise and experience by ramping up our military cooperation with our Pakistani partner. However, this cooperation will prevent us from pursuing closer ties to Pakistan's bitter rival."
 SAU_FA_denounce_iranian_meddling: "Denounce Iranian Meddling"
 SAU_FA_denounce_iranian_meddling_desc: "We cannot simply allow Iran to run amok in the region without voicing our discontent. The inaction of our allies is what has contributed to this lamentable state of affairs, so we must take it upon ourselves to step up and denounce the Persian threat."
 SAU_FA_denounce_the_opposition: "Abandon the Opposition"
 SAU_FA_denounce_the_opposition_desc: "It is unwise for a government like ours, one that is subject to the same terrorist threats as that of Syria, to continue to support an opposition movement that contains dangerous extremist elements."
 SAU_FA_distance_from_america: "Distance from America"
 SAU_FA_distance_from_america_desc: "We can no longer ignore the growing pressure from our population to reduce our dependence on the United States for our security. It is time for us to adopt a radically different approach to our foreign policy, one that will free [ROOT.GetNameDef] from neo-imperial domination."
 SAU_FA_draw_closer_to_india: "Draw Closer to India"
 SAU_FA_draw_closer_to_india_desc: "While we have traditionally had closer ties to Pakistan, India is too large a military and economic power for us to ignore. We should therefore pursue amicable relations with India, even as we continue to maintain ties to its most hated enemy."
 SAU_FA_end_the_special_relationship: "End the Special Relationship"
 SAU_FA_end_the_special_relationship_desc: "While our ties with Pakistan may have served us well in the past, the time has come for us to make a choice between preserving our relationship with Pakistan and pursuing closer ties to its larger rival."
 SAU_FA_expel_us_interests: "Expel US Interests"
 SAU_FA_expel_us_interests_desc: "US troops are resented, even hated, by the people of [ROOT.GetNameDef]. The Americans must be made to leave our country so that they cannot continue to use it as a staging ground for their imperial ambitions."
 SAU_FA_favor_resistance: "Support a Free Palestine"
 SAU_FA_favor_resistance_desc: "The Palestinians have been cursed with statelessness, their plight serving as a constant reminder of the failures of the international community. The brutality of the Israeli occupation and the tacit abandonment of the Palestinian cause by Arab governments has left the Palestinians alone and without an ally to depend on. We could be that ally."
 SAU_FA_friendship_with_russia: "Friendship with Russia"
 SAU_FA_friendship_with_russia_desc: "Russia lacks the hegemonic heft of the United States, meaning that while it cannot guarantee our security to the same extent that the US could it does not share America's imperialist aspirations. A security partnership with Russia will therefore be more equitable and less unpopular with the [ROOT.GetAdjective] public."
 SAU_FA_grant_recognition: "Grant Recognition"
 SAU_FA_grant_recognition_desc: "Most of the Muslim world has refused to recognize the legitimacy of the state of Israel. This lack of recognition has hampered the improvement of relations between us and the Israelis, and it is therefore in our interest to break with the rest of the Muslim world in recognizing Israel, signalling our desire for closer cooperation with the Jewish state."
 SAU_FA_host_talks: "An Impartial Arbiter"
 SAU_FA_host_talks_desc: "When it comes to peace between Israel and Palestine, many have tried. All have failed. We should use our political capital to make a fresh attempt to bring about peace in the Middle East by crafting a proposal that is acceptable to both sides."
 SAU_FA_improve_relations_with_iran: "Improve Relations With Iran"
 SAU_FA_improve_relations_with_iran_desc: "Iran is too significant a power to ignore. While our foreign and domestic allies may oppose an improvement of relations with Iran, for now we should focus on diplomatic pragmatism and deal with the potential repercussions of our foreign policy shift later."
 SAU_FA_improve_trade_relations: "Improve Trade Relations"
 SAU_FA_improve_trade_relations_desc: "India's massive population means that it has a similarly massive market for our exports. It would therefore be wise for us to strengthen our trading partnership with this economic powerhouse."
 SAU_FA_indian_bases: "Indian Bases"
 SAU_FA_indian_bases_desc: "Having thrown our lot in with India as opposed to Pakistan, it would make sense for us to cement our alliance with the Indians by giving them permission to establish military bases in our territory. Doing so will not only produce tangible signs of our close partnership, but will also give India a compelling reason to remain invested in our security."
 SAU_FA_influence_south_asia: "Influence South Asia"
 SAU_FA_influence_south_asia_desc: "To the East lies a region rich in history and culture, one which once boasted one of the most powerful Muslim empires in the history of the world. Today the Indian subcontinent suffers from a bitter rivalry between India and Pakistan. This rivalry means that we must be careful about our diplomatic overtures, as there is only so far that we can improve relations with one side without antagonizing the other."
 SAU_FA_influence_the_levant: "Influence Iraq and al-Sham"
 SAU_FA_influence_the_levant_desc: "Iraq and the Levant is home to multiple opportunities for cooperation as well as threats to contain. Located at the intersection between several spheres of influence, it is a region that we cannot afford to ignore."
 SAU_FA_intervene_in_syria: "Topple Assad"
 SAU_FA_intervene_in_syria_desc: "The revolution is underway. We should guarantee its success by pushing for the deployment of boots on the ground. If we play our cards right, those boots could be American ones rather than our own. Undermining the Syrian regime would remove a key Iranian ally and backer of Hezbollah, and pave the way for the establishment of a government that is receptive of [ROOT.GetAdjective] interests."
 SAU_FA_invite_russian_advisors: "Invite Russian Advisors"
 SAU_FA_invite_russian_advisors_desc: "The Russian military has centuries of expertise at its disposal, expertise that we could benefit from by inviting Russian advisors to train our own armed forces."
 SAU_FA_jordanian_ties: "Sideline the Palestinians"
 SAU_FA_jordanian_ties_desc: "Ultimately campaigning for the Palestinian cause serves little geopolitical purpose. Rigidly sticking to the pro-Palestinian line has prevented us from cooperating with Israel, a state with which we share many common enemies. However, sidelining the Palestinians will undoubtedly be resisted our population, who remain overwhelmingly anti-Zionist."
 SAU_FA_live_and_let_live: "Support Lebanon"
 SAU_FA_live_and_let_live_desc: "Lebanon is a country that has suffered from decades of internal division. We should support its government as much as we can rather than impose unrealistic expectations on this fragile state."
 SAU_FA_mass_arms_purchases: "Secure American Protection"
 SAU_FA_mass_arms_purchases_desc: "America has rhetorically supported our security in the past and came to our defence during the Gulf War, demonstrating its commitment to Middle Eastern stability. However, before we pursue a more active foreign policy in the region we should first secure a firm American commitment to come to our defence in the event of an external attack."
 SAU_FA_non_aggression_pact: "Invite the Quds Force"
 SAU_FA_non_aggression_pact_desc: "Since the Iranian Revolution in 1979 the Islamic Republic has pursued an interventionist foreign policy that relies on backing allied states and armed groups to contain Iran's enemies and extend its own influence. We should support Iran in this endeavor and allow our territory to be used as a base for the activities of Iran's infamous Quds force."
 SAU_FA_oil_refineries_in_pakistan: "Oil Refineries in Pakistan"
 SAU_FA_oil_refineries_in_pakistan_desc: "Our decades of experience with oil means that we can offer our Pakistani partners useful technical know-how regarding the refining of crude oil. This cooperation improve our relations with Pakistan as well as help support Pakistan's growing economy."
 SAU_FA_peace_in_the_middle_east: "Peace in the Middle East"
 SAU_FA_peace_in_the_middle_east_desc: "Our peace proposal, not too long ago, was met with snorts of derision in Washington, London, Moscow and beyond. But we have achieved what every international mediator has so far failed to do - peace between Israel and Palestine. From this point on, [FROM.GetName] will forever be associated with shrewd diplomacy and the betterment of millions of lives."
 SAU_FA_pressure_lebanon: "Pressure Lebanon"
 SAU_FA_pressure_lebanon_desc: "While our relations with the Lebanese have historically been good, we can no longer ignore the Lebanese government's tolerance of Hezbollah, a dangerous terrorist organization backed by Iran. We should put pressure on Lebanon to distance itself from the Iranian sphere of influence."
 SAU_FA_rapprochement_with_the_regime: "Rapprochement with the Regime"
 SAU_FA_rapprochement_with_the_regime_desc: "The tide of the war in Syria has started to turn against the opposition. It would be in our interests to mend relations with a government that we will realistically have to engage with for years to come."
 SAU_FA_reject_foreign_interference: "Reject Foreign Interference"
 SAU_FA_reject_foreign_interference_desc: "The Middle East has for decades been governed by collaborationist governments dependent on foreign powers for their revenue and security. The people of the region are clamoring for a change to the status quo, a process that we can begin in earnest in [ROOT.GetNameDef] by decoupling ourselves from foreign influence."
 SAU_FA_russian_bases: "Russian Bases"
 SAU_FA_russian_bases_desc: "Allowing Russia to establish military bases in our territory would serve both our countries' interests. Russia would gain a useful base of operations in a strategically important region and we, for our part, would gain a greater commitment to our security from our newfound ally."
 SAU_FA_secret_cooperation: "Secret Cooperation"
 SAU_FA_secret_cooperation_desc: "Israel is the most technologically advanced nation in the Middle East. Secretly negotiating an agreement to share military technology between our two countries will undoubtedly help enhance our own capabilities, as well as deepen our cooperation with the IDF, the force in the Middle East that is the most capable of finishing Hezbollah off once and for all and resisting the growing Persian threat."
 SAU_FA_security_guarantees: "Security Guarantees"
 SAU_FA_security_guarantees_desc: "Now that relations with Pakistan have been substantially strengthened, we can bind our two nations together with security guarantees. From this day forward, [ROOT.GetNameDef] and Pakistan will not simply be close partners, but also strong allies."
 SAU_FA_strengthen_us_ties: "Strengthen US Ties"
 SAU_FA_strengthen_us_ties_desc: "America and [ROOT.GetNameDef] may seem likely unlikely allies given our vastly different regime types, but our regional interests are remarkably similar. We should reinforce a partnership which has done nothing but support our national interests and regional security. Even if some [ROOT.GetAdjective]s resent this special relationship, it is one that we cannot do without."
 SAU_FA_support_hamas: "Arms for Hamas"
 SAU_FA_support_hamas_desc: "The Oslo Accords of 1993 and its subsequent failure has significantly damaged the reputation of the mainstream Palestinian nationalist movement at the expense of their Islamist rivals, Hamas. Hamas is therefore the Palestinian actor that we should throw our support behind to undermine Israel."
 SAU_FA_support_iranian_separatists: "Support Iranian Separatists"
 SAU_FA_support_iranian_separatists_desc: "Iran's struggles with various separatist movements predate the Islamic Republic. Azeris, Arabs, Balochis and Kurds have all struggled against the discrimination of Tehran in their efforts to achieve greater autonomy. Arabs and Balochis in particular make for natural allies, the former due to our ethnic affinity, the latter due to our shared Sunni identity."
 SAU_FA_the_arab_street: "The Arab Street"
 SAU_FA_the_arab_street_desc: "Across the Arab world there is has been a historical discrepancy between policies of governments and the views of their people. When it comes to the Israel-Palestine issue, relations with the United States, political Islam and democratization, there are few Arab governments with the bravery to translate public opinion into foreign policy. We can be the ones to change this state of affairs."
 SAU_FA_the_war_within: "War in the Arabian Peninsula"
 SAU_FA_the_war_within_desc: "The Gulf Cooperation Council has become a hollow shell of regional cooperation. Regrettably, we have no choice now but to settle our differences with our neighbors and former friends through violent means."
 SAU_FA_war_with_hezbollah: "War with Hezbollah"
 SAU_FA_war_with_hezbollah_desc: "Hezbollah has been a tool of Iranian foreign policy for years, one that has sought to subvert and challenge the rule of governments like ours by encouraging revolutionary sentiments among Shia minorities across the region. Our hostility to Hezbollah is shared by Israel, who have suffered from raids and indiscriminate attacks on their territory. We are therefore natural allies against Hezbollah."
 SAU_FA_war_with_imperialism: "War on Imperialism"
 SAU_FA_war_with_imperialism_desc: "Unfortunately we have yet to bring about the liberation of the Muslim and Arab peoples of the region, as foreign troops continue to occupy land that is rightfully ours. The only option that remains available to us is to drive them out by force and overthrow the puppet governments that host them."
 SAU_FA_war_with_israel: "War with Israel"
 SAU_FA_war_with_israel_desc: "The Intifada has given us further evidence that there is no limits to Israel's brutality. We cannot simply sit by and watch as the Palestinian people are mercilessly slaughtered."
 SAU_fahd_illness: "§HKing Fahd's Illness§!"
 SAU_fahd_illness_desc: "November 1995. King Fahd suffers a §Ymassive stroke§! that leaves him unable to govern. The Allegiance Council meets in secret. The kingdom now has §Hno effective ruler§!."
 SAU_focus_339: "§GVision 2030 Privatisation Programme§!"
 SAU_focus_339_desc: "Under the §HCrown Prince's§! direction, the §LPublic Investment Fund§! announces a sweeping privatisation programme: over §H100 state-owned enterprises§! to list on the Tadawul. §LACWA Power§!, §LSALIC§!, §LSaudi Tadawul Group§! itself - the queue stretches for years. Targets call for §G$55 billion§! in privatisation receipts. The state shrinks; the market swells."
 SAU_focus_340: "§GForeign and Dual Listings§!"
 SAU_focus_340_desc: "Saudi companies look outward. Some dual-list on §LLondon's LSE§!, others on §LAbu Dhabi's ADX§!. §LTadawul§!'s trading platform is upgraded under a partnership with §LNasdaq Inc.§!. Foreign companies, in turn, gain pathways onto Saudi soil. The exchange becomes a §Htwo-way bridge§!, not a closed garden."
 SAU_focus_342: "§GA Hub for Foreign Capital§!"
 SAU_focus_342_desc: "The §LSAGIA§! reforms have opened the doors; the §LTadawul§! reforms have laid the floor. Together, the Kingdom presents a single, coherent platform for the world's capital. Foreign direct investment and portfolio investment converge on §LRiyadh§!. The §HKingdom of Saudi Arabia§! is no longer a destination of last resort - it is, increasingly, a §Gdestination of first choice§!."
 SAU_focus_343: "§GMT30 Index Futures§!"
 SAU_focus_343_desc: "On §H30 August 2020§!, the §LTadawul§! lists its first derivative product: §HMT30 Index Futures§!, tracking the thirty most-traded large-cap stocks. The §LCMA§! has approved hedging instruments forbidden for decades. Single-stock futures and options follow. §LSaudi finance§! catches up with the global mainstream - and accepts the §Yvolatility§! that comes with it."
 SAU_focus_344: "§GSharia-Compliant Securities Only§!"
 SAU_focus_344_desc: "The §LCouncil of Senior Scholars§! advises caution: derivatives flirt with §Yriba (interest)§! and §Ygharar (excessive uncertainty)§!. The §LCMA§! holds the line - sukuk and equities only, no conventional bonds, no futures, no options. The §HKingdom§! preserves the religious purity of its capital market, even at the cost of foreign volume. The §LUlema§! approve."
 SAU_focus_383: "Saudi Steel"
 SAU_focus_383_desc: "Hadeed expands. New rolling mills at Jubail. Saudi rebar in Saudi towers."
 SAU_focus_385: "Materials for the Boom"
 SAU_focus_385_desc: "Tile, paint, fittings, fixtures. The kingdom stops importing what its builders need."
 SAU_focus_386: "The Skyline Rises"
 SAU_focus_386_desc: "The Kingdom Centre. Burj Rafal. The Capital Market Authority Tower. The Riyadh skyline changes month by month."
 SAU_focus_392: "A Saudi Railway"
 SAU_focus_392_desc: "The North-South Railway hauls phosphate. The Haramain High-Speed Railway hauls pilgrims. The kingdom moves on rails it built itself."
 SAU_focus_393: "The Highway Grid"
 SAU_focus_393_desc: "Six-lane motorways from Tabuk to Najran. The kingdom is held together by asphalt."
 SAU_focus_423: "The Planning Ministry"
 SAU_focus_423_desc: "The Ministry of Economy and Planning becomes a real ministry, not a polite suggestion. Its reports start to bite."
 SAU_focus_424: "Set the Targets"
 SAU_focus_424_desc: "GDP growth six per cent. Non-oil exports up half. Saudi employment up over a million. Numbers the ministers will be measured against."
 SAU_focus_425: "Monitor the Plan"
 SAU_focus_425_desc: "Quarterly reviews, public dashboards, KPIs. Underperformers feel the heat."
 SAU_focus_426: "Match the Best"
 SAU_focus_426_desc: "Singapore's port. Switzerland's banks. South Korea's manufacturing. The kingdom benchmarks against the leaders, not the average."
 SAU_focus_427: "Coordinate the Ministries"
 SAU_focus_427_desc: "Cabinet meetings stop being theatre. The Council of Economic and Development Affairs gets real authority."
 SAU_focus_428: "The 2014 Plan Completed"
 SAU_focus_428_desc: "Five years, hundreds of programmes, mixed results. Some targets exceeded; others quietly missed."
 SAU_focus_430: "Reform Industrial Policy"
 SAU_focus_430_desc: "The Ministry of Industry rewrites the rulebook. Subsidies become incentives. Protectionism becomes promotion."
 SAU_focus_431: "Tax Reform"
 SAU_focus_431_desc: "VAT introduced at five per cent, raised to fifteen in 2020. The kingdom that did not tax now taxes - cautiously."
 SAU_focus_432: "Cut the Subsidies"
 SAU_focus_432_desc: "Petrol prices rise. Electricity prices rise. The kingdom's poor are protected; the kingdom's spendthrifts are not."
 SAU_focus_433: "Pension Reform"
 SAU_focus_433_desc: "GOSI restructured. The Saudi worker can finally count on a retirement that has been calculated, not promised."
 SAU_focus_434: "Labour Law Reform"
 SAU_focus_434_desc: "Maximum hours, minimum wages, dispute tribunals. The kafala system loosens, slowly."
 SAU_focus_435: "Corporate Governance"
 SAU_focus_435_desc: "Audit committees, independent directors, disclosure rules. Saudi listed firms stop being family clubs in disguise."
 SAU_focus_436: "Competition Policy"
 SAU_focus_436_desc: "The General Authority for Competition takes on monopolists. Some of the kingdom's biggest names are reminded the law applies to them too."
 SAU_focus_437: "Protect the Consumer"
 SAU_focus_437_desc: "Hotline complaints actioned in days, not seasons. The Saudi shopper stops feeling outgunned by every retailer."
 SAU_focus_438: "Patent Law"
 SAU_focus_438_desc: "WIPO-compliant. Pharmaceutical companies stop counterfeiting. The local inventor's certificate finally means something."
 SAU_focus_439: "Trade Policy"
 SAU_focus_439_desc: "WTO membership granted in 2005. The kingdom no longer negotiates from outside the room."
 SAU_focus_440: "Modern Customs"
 SAU_focus_440_desc: "Single-window clearance at every port. Goods that took a week now move in a day."
 SAU_focus_441: "Push Exports"
 SAU_focus_441_desc: "The Saudi Export Development Authority opens trade offices in twenty cities. Saudi firms learn the foreign-buyer's psychology."
 SAU_focus_442: "Make It Here"
 SAU_focus_442_desc: "Cement, steel, plastics, paper - what was imported is now manufactured. Trade balance improves, dependency falls."
 SAU_focus_443: "Saudi Supply Chains"
 SAU_focus_443_desc: "Local suppliers favoured by the IKTVA programme. Aramco buys Saudi-made; the rest of the kingdom follows."
 SAU_focus_444: "A Logistics Hub"
 SAU_focus_444_desc: "King Abdulaziz International Airport, Jeddah Islamic Port, the new dry port at Riyadh. Goods routed through Saudi Arabia stop being a coincidence."
 SAU_focus_445: "Cold Storage"
 SAU_focus_445_desc: "Refrigerated warehouses at every airport. The kingdom can finally store what it grows and what it imports."
 SAU_focus_446: "The Warehouse Network"
 SAU_focus_446_desc: "Bonded warehouses, free zones, distribution centres. The plumbing of modern trade gets installed."
 SAU_focus_447: "Modern Trucks"
 SAU_focus_447_desc: "The Saudi haulier replaces his thirty-year-old Mercedes with a new Euro-compliant rig. Fuel consumption falls."
 SAU_focus_448: "Air Cargo"
 SAU_focus_448_desc: "Saudi Airlines Cargo links Jeddah and Riyadh to fifty hubs. Premium goods cross the kingdom in hours, not days."
 SAU_focus_449: "Maritime Services"
 SAU_focus_449_desc: "Bunkering, repair, registration. Saudi ports earn fees from ships they will never own."
 SAU_focus_450: "Expand Financial Services"
 SAU_focus_450_desc: "Bayan Credit Bureau, Tadawul, SAMA - the Saudi financial system gets the institutional layer it has lacked."
 SAU_focus_451: "Wealth Management"
 SAU_focus_451_desc: "Saudi private banks chase the high-net-worth Saudi who used to bank in Geneva. The conversation is finally in Arabic."
 SAU_focus_452: "Asset Management"
 SAU_focus_452_desc: "Mutual funds, pension funds, sovereign wealth. PIF alone manages assets that rival the largest in the world."
 SAU_focus_453: "An Islamic Finance Centre"
 SAU_focus_453_desc: "Sharia-compliant banking matured in Saudi Arabia, not exported from elsewhere. The fatwa boards in Riyadh set the standard."
 SAU_focus_454: "Consolidate the Throne"
 SAU_focus_454_desc: "The Royal Court tightens its grip. Decrees flow more freely; the princes pay closer attention."
 SAU_focus_455: "Name the Crown Prince"
 SAU_focus_455_desc: "The succession is announced from the Royal Diwan. The kingdom exhales."
 SAU_focus_456: "Reshuffle the Cabinet"
 SAU_focus_456_desc: "Old loyalists retired with honour. New blood promoted with expectations. The composition signals where the king is going."
 SAU_focus_457: "The National Guard Question"
 SAU_focus_457_desc: "The SANG has always answered to one branch of the family. The king decides who takes the keys next."
 SAU_focus_458: "Manage the Princes"
 SAU_focus_458_desc: "Hundreds of half-brothers, cousins, nephews. The king who keeps them all happy stays on his throne longer."
 SAU_focus_459: "Balance the Factions"
 SAU_focus_459_desc: "Sudairi, Shammar, the descendants of Ibn Saud's lesser wives. The king plays them against each other or rules them all - both have a track record."
 SAU_focus_460: "The Allegiance Council"
 SAU_focus_460_desc: "A formal body of senior princes, blessed by King Abdullah's 2006 decree. The succession is meant to be choreographed, not improvised."
 SAU_focus_461: "Shape the Narrative"
 SAU_focus_461_desc: "Al Arabiya, MBC, Al Riyadh. The kingdom controls the channels that explain the kingdom to itself."
 SAU_focus_462: "Tame the Ulema"
 SAU_focus_462_desc: "The Council of Senior Scholars receives instructions, not requests. The fatwa serves the throne or stays unwritten."
 SAU_focus_463: "Buy the Tribes"
 SAU_focus_463_desc: "Stipends to sheikhs. Land to elders. Marriages to second cousins. The old methods still work."
 SAU_focus_464: "Court the Merchants"
 SAU_focus_464_desc: "The Bin Laden, Al-Olayan, Al-Rajhi families. The king reminds them whose protection they enjoy and whose interests they serve."
 SAU_focus_465: "Loyal Officers"
 SAU_focus_465_desc: "Promotions go to relatives. Commands go to the trustworthy. The general staff is family before it is military."
 SAU_focus_466: "Manage the World's Image"
 SAU_focus_466_desc: "Lobbying firms in Washington. Op-eds in the Financial Times. The kingdom's reputation is curated like a stock portfolio."
 SAU_focus_467: "Lock Down the Succession"
 SAU_focus_467_desc: "The line is settled. The Allegiance Council has signed. No regent, no contender, no surprise."
 SAU_focus_468: "Manage Public Opinion"
 SAU_focus_468_desc: "Polls quietly conducted. Friday sermons quietly steered. The kingdom listens more than it lets on."
 SAU_focus_469: "The Governors"
 SAU_focus_469_desc: "Each emirate ruled by a senior prince. The king's word travels through cousins, not strangers."
 SAU_focus_470: "The Eastern Question"
 SAU_focus_470_desc: "Qatif, Awamiyah, the Shia majority of the Eastern Province. The king walks a line that has been drawn and redrawn for a century."
 SAU_focus_471: "Pacify the Hejaz"
 SAU_focus_471_desc: "Mecca, Medina, Jeddah. The Hejaz remembers it was once its own kingdom. The Najdi rulers know it never quite forgot."
 SAU_focus_472: "The Najdi Heartland"
 SAU_focus_472_desc: "Riyadh, Buraidah, Hail. The dynasty's home turf. Loyal, but not free."
 SAU_focus_473: "The Yemeni Border"
 SAU_focus_473_desc: "Saada, Hajjah, Sa'da. The Houthi war comes to the border. The kingdom's southern frontier becomes a live front."
 SAU_focus_474: "The Iraqi Border"
 SAU_focus_474_desc: "Arar, Rafha, Turaif. The post-2003 Iraq sends jihadists, smugglers, and pilgrims north. The kingdom fortifies."
 SAU_focus_475: "The Red Sea Coast"
 SAU_focus_475_desc: "Yanbu, Jeddah, Jizan. NEOM rises here. The coast becomes the kingdom's window on the world that does not speak Arabic."
 SAU_focus_476: "The Gulf Coast"
 SAU_focus_476_desc: "Dammam, Khobar, Jubail. The oil coast. The kingdom's wealth flows from these shores."
 SAU_focus_477: "The Empty Quarter"
 SAU_focus_477_desc: "Rub al-Khali. Not really empty. The kingdom's oil reserves sit beneath the world's largest sand sea."
 SAU_focus_478: "The Central Region"
 SAU_focus_478_desc: "The high plateau of Najd, the heartland's heartland. The kingdom's imagination begins here."
 SAU_focus_479: "Authority Consolidated"
 SAU_focus_479_desc: "The decrees go out from one office and stop nowhere. The kingdom knows whose word is law."
 SAU_focus_480: "The Succession Resolved"
 SAU_focus_480_desc: "The next king is named, the king after that is plausible. The dynasty looks like a dynasty again."
 SAU_focus_481: "A Loyal Government"
 SAU_focus_481_desc: "Ministers chosen for competence and faithfulness in that order. The cabinet sings from one hymn sheet."
 SAU_focus_482: "A Loyal Military"
 SAU_focus_482_desc: "The MOI, the SANG, the regular forces - one chain of command, one loyalty. The Arab Spring's lessons applied."
 SAU_focus_483: "The Clerics' Blessing"
 SAU_focus_483_desc: "The Council of Senior Scholars endorses the throne. The Friday sermons echo it. The legitimacy holds."
 SAU_focus_484: "The Tribes' Allegiance"
 SAU_focus_484_desc: "Otaibi, Mutairi, Shammar, Ghatafan. The handshakes still carry weight."
 SAU_focus_485: "The Merchants' Loyalty"
 SAU_focus_485_desc: "The kingdom's biggest fortunes know whose protection they sit beneath. They behave accordingly."
 SAU_focus_486: "The People's Support"
 SAU_focus_486_desc: "The polls are not real polls. The result is. The Saudi citizen, by and large, prefers the king to the alternatives."
 SAU_focus_487: "Regional Stability"
 SAU_focus_487_desc: "Borders held. Insurgents contained. The kingdom is the calm in a region that does not specialise in calm."
 SAU_focus_488: "A United Kingdom"
 SAU_focus_488_desc: "Hejazi, Najdi, Eastern Province, Asir, Tabuk - the regions hold together under the green flag."
 SAU_focus_489: "Royal Legitimacy"
 SAU_focus_489_desc: "The Custodian of the Two Holy Mosques is recognised by Riyadh, Mecca, Cairo, Jakarta. The crown earns its weight."
 SAU_focus_490: "Crisis Averted"
 SAU_focus_490_desc: "What could have been a fracture - a succession dispute, a cousin's revolt, a regional defection - was managed. The kingdom holds."
 SAU_focus_Ahmed: "Ahmed bin Abdulaziz: The Conservative Choice"
 SAU_focus_Ahmed_desc: "Ahmed, full brother of Salman, represents the traditional Sudairi line. He is conservative, cautious, and acceptable to the old guard. But is the kingdom ready for more of the same?"
 SAU_focus_end_of_2014_plan: "Plan Reviewed"
 SAU_focus_end_of_2014_plan_desc: "An autopsy on the Ninth Plan. The lessons feed the Tenth - and Vision 2030."
 SAU_focus_MBN: "Mohammed bin Nayef Ascends"
 SAU_focus_MBN_desc: "Mohammed bin Nayef, Interior Minister and the man who broke al-Qaeda in the Kingdom, takes the throne. A cautious technocrat trusted in Washington, he rules through the security services he built."
 SAU_focus_Miteb_sonofAbdullah: "Miteb bin Abdullah's Ambition"
 SAU_focus_Miteb_sonofAbdullah_desc: "Miteb, son of the late King Abdullah, commands the National Guard. He has his father's reformist instincts and a network of allies. But the Sudairis are powerful, and they have their own plans."
 SAU_foregin_affairs_subclass: "Foreign Policy Substructure"
 SAU_foregin_affairs_subclass_desc: "The Ministry of Foreign Affairs, the intelligence services, and the royal court all shape foreign policy. Coordination is essential."
 SAU_grand_military_capstone: "Grand Military Capstone"
 SAU_grand_military_capstone_desc: ""
 SAU_hide_deadlines_dec: "Hide Project Deadlines"
 SAU_hide_deadlines_dec_desc: "Tuck the project countdowns out of sight to declutter the decisions panel. The deadlines keep running in the background."
 SAU_house_of_saud: "§HThe House of Saud§!"
 SAU_house_of_saud_desc: "Hundreds of princes, dozens of factions, one throne. The §Lal-Sudairi Seven§!, the §LJiluwi branch§!, the §LThunayyan line§! - all of them watch and wait."
 SAU_internal_affairs_police_01: "Community Policing"
 SAU_internal_affairs_police_01_desc: "Police officers engage with communities. Foot patrols, neighborhood stations, public relations - the Saudi police become less feared and more respected."
 SAU_internal_affairs_police_02: "Traffic Police Reform"
 SAU_internal_affairs_police_02_desc: "The hated traffic police are reformed. Women join the force. Automated ticketing replaces arbitrary fines. The kingdom's roads become safer."
 SAU_internal_affairs_police_03: "Cybercrime Unit"
 SAU_internal_affairs_police_03_desc: "A dedicated cybercrime unit fights online fraud, hacking, and extremist propaganda. The digital frontier requires digital policing."
 SAU_internal_affairs_primary_education_03: "Prince Salman Center for Disability Research"
 SAU_internal_affairs_primary_education_03_desc: "Special needs students receive dedicated support. Inclusive education becomes policy. Every Saudi child, regardless of ability, has the right to learn."
 SAU_internal_foregin_affairs_free_edecuation: "Primary Education Guarantee"
 SAU_internal_foregin_affairs_free_edecuation_desc: "Every Saudi child attends primary school. Literacy reaches 99%. The kingdom that was once largely illiterate now educates everyone."
 SAU_internal_foregin_affairs_reduce_edcaution: "No Free Education"
 SAU_internal_foregin_affairs_reduce_edcaution_desc: "The education budget is cut. Universities struggle. Schools face overcrowding. The kingdom's investment in its future declines - temporarily."
 SAU_internal_foregin_affairs_wafare_over_healthcare_copy_copy4: "Military Spending Priority"
 SAU_internal_foregin_affairs_wafare_over_healthcare_copy_copy4_desc: "Defense spending takes priority over social programs. The kingdom's security comes first. Healthcare and welfare must wait."
 SAU_internal_foreginonly: "Foreign Policy Doctrine"
 SAU_internal_foreginonly_desc: "Saudi Arabia's foreign policy rests on three pillars: oil security, regional stability, and Islamic leadership. The kingdom projects power through diplomacy, aid, and occasional force."
 SAU_internal_North_africa_policy: "North Africa Policy"
 SAU_internal_North_africa_policy_desc: "Egypt, Libya, Tunisia, Morocco, Algeria - the Arab West has deep ties to the kingdom. Aid, investment, and diplomatic support project Saudi influence."
 SAU_iraq_pipeline: "The Europe Pipeline"
 SAU_iraq_pipeline_desc: "From the Saudi fields through Iraq and Turkey, the Kingdom's oil pours straight into Europe. This is the prize Moscow feared: a rival at the gates of its largest market."
 SAU_islamic_rivalry_category: "The Islamic Rivalry"
 SAU_islamic_rivalry_category_desc: "The contest with Iran for leadership of the Islamic world."
 SAU_King_fahd_death: "The Death of King Fahd"
 SAU_King_fahd_death_desc: "After a decade of frailty following his stroke, King Fahd passes in August 2005. The Kingdom mourns the king who weathered the Gulf War, and the crown passes at last to the regent who already rules in all but name."
