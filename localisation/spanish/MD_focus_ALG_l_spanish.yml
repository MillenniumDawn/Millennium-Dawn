 loyalty_very_high: "§GMuy alta§!"
 competence_very_low: "§RMuy baja§!"
 competence_low: "§RBaja§!"
 competence_moderate: "§YModerada§!"
 competence_high: "§GAlta§!"
 competence_very_high: "§GMuy alta§!"
 deep_state_influence_minimal: "§GMínima§!"
 deep_state_influence_low: "§GBaja§!"
 deep_state_influence_moderate: "§YModerada§!"
 deep_state_influence_high: "§RAlta§!"
 deep_state_influence_very_high: "§RMuy alta§!"
 ALG_minister_vacant: "Vacante"
 ALG_military_industrial_complex: "Complejo militar-industrial"
 ALG_patronage_networks: "Redes de clientelismo"
 ALG_crush_all_opposition: "Aplastar a toda la oposición"
 ALG_control_hydrocarbons: "Controlar los hidrocarburos"
 ALG_fortress_algeria: "Fortaleza Argelia"
 ALG_military_industrial_complex_desc: "El ejército expande su imperio económico, construyendo fábricas de armas y asegurando lucrativos contratos de defensa. El cuerpo de oficiales se convierte en una clase empresarial, con generales sentados en juntas corporativas y acumulando vastas riquezas."
 ALG_patronage_networks_desc: "Una red de clientelismo conecta al régimen con las élites empresariales y los mediadores del poder regional. La lealtad se compra con contratos, licencias y acceso. El Estado se convierte en un instrumento de enriquecimiento privado."
 ALG_crush_all_opposition_desc: "El régimen elimina a toda la oposición organizada mediante arrestos, censura e intimidación. Los partidos políticos son cooptados o prohibidos. La sociedad civil queda desmantelada. Solo se escucha la voz del régimen."
 ALG_control_hydrocarbons_desc: "El Estado toma el control absoluto del sector de los hidrocarburos, canalizando los ingresos del petróleo y el gas directamente a las arcas del régimen. Se presiona a los socios extranjeros, se absorbe a los operadores independientes y el Estado Profundo controla el flujo."
 ALG_fortress_algeria_desc: "Argelia se convierte en un Estado cuartel: militarizado, cerrado y suspicaz ante el mundo exterior. El ejército es fuerte, las fronteras están selladas y la población se mantiene a raya mediante una combinación de riqueza petrolera y represión."
 ALG_oil_crash_weakens_regime_tt: "El colapso del petróleo ha debilitado gravemente la capacidad del régimen para comprar la paz social. El descontento popular está aumentando."
 ALG_hirak_wins_tt: "El movimiento Hirak ha triunfado. Una nueva Argelia es posible."
 ALG_military_wins_tt: "El Estado Profundo ha prevalecido. El régimen militar continúa bajo un nuevo rostro."
 ALG_republic_new_era_tt: "Comienza una nueva era para la República de Argelia. El viejo sistema está siendo desmantelado."
 ALG_parliamentary_republic_tt: "Argelia ha adoptado un sistema parlamentario de gobierno. La Asamblea Nacional es soberana."
 ALG_semi_presidential_republic_tt: "Argelia ha adoptado un sistema de gobierno semipresidencial. El poder se comparte entre el presidente y el parlamento."
 ALG_presidential_republic_tt: "Argelia ha adoptado un sistema de gobierno presidencial. El presidente ostenta una autoridad ejecutiva dominante."
 ALG_patronage_enriches_regime_tt: "Las redes de clientelismo enriquecen al régimen y a sus aliados a expensas del pueblo argelino."
 ALG_fortress_state_tt: "Argelia se ha convertido en un Estado fortaleza. El Estado Profundo gobierna de forma absoluta y la nación se cierra al mundo."
 ALG_military_industrial_economy: "Economía militar-industrial"
 ALG_state_hydrocarbon_monopoly: "Monopolio estatal de hidrocarburos"
 ALG_fortress_state: "Estado fortaleza"
 ALG_military_industrial_economy_desc: "El ejército se ha expandido hacia la producción de armas y la industria de defensa, creando una base económica autosuficiente para el régimen. Los generales se sientan en las juntas corporativas y la línea entre el uniforme y el traje de negocios se ha desdibujado."
 ALG_state_hydrocarbon_monopoly_desc: "El control estatal total sobre los ingresos del petróleo y el gas financia al régimen y a sus redes de clientelismo. El sector de los hidrocarburos es un mundo cerrado en el que solo pueden operar los que tienen contactos."
 ALG_fortress_state_desc: "Argelia se ha convertido en un Estado cerrado y militarizado. El ejército es poderoso, la sociedad está controlada y el Estado Profundo gobierna sin oposición. La estabilidad se ha comprado al precio de la libertad."
 ALG_redmed_group_expansion: "Expansión del Grupo RedMed"
 ALG_redmed_group_expansion_desc: "El Grupo RedMed ha demostrado ser un socio logístico fiable para el sector del petróleo y el gas en los alrededores de Hassi Messaoud. Con la inversión adecuada, puede crecer hasta convertirse en una fuerza industrial más amplia."
 ALG_star_aviation_operations: "Operaciones de Star Aviation"
 ALG_star_aviation_operations_desc: "La filial de aviación del Grupo RedMed ha mantenido un historial de seguridad impecable desde su fundación. Deberíamos aprovechar esta reputación para profundizar nuestra participación en el sector aeronáutico."
 ALG_military_aviation_contract: "Contratos de aviación militar"
 ALG_military_aviation_contract_desc: "La excelencia operativa de Star Aviation ha llamado la atención del ejército. Asegurar contratos de defensa abrirá la puerta al desarrollo aeroespacial avanzado y financiará la siguiente fase de expansión."
 ALG_missile_development_initiative: "Iniciativa de desarrollo de misiles"
 ALG_missile_development_initiative_desc: "Un ejército moderno no puede depender únicamente de armas extranjeras. Iniciaremos un programa nacional de misiles a través del Grupo RedMed, sentando las bases para la disuasión estratégica."
 ALG_star_aviation_uav_division: "División de VANT de Star Aviation"
 ALG_star_aviation_uav_division_desc: "Con la tecnología extranjera de VANT (vehículos aéreos no tripulados) en la mano, Star Aviation está lista para establecer una división dedicada a los drones. Los ingenieros argelinos estudiarán, adaptarán y eventualmente superarán lo que se les ha dado."
 ALG_domestic_uav_production: "Producción nacional de VANT"
 ALG_domestic_uav_production_desc: "La fase de ingeniería inversa se ha completado. Las instalaciones de Star Aviation están listas para producir VANT de diseño argelino a gran escala. Ya no se trata de importaciones, se trata de soberanía."
 ALG_russian_missile_cooperation: "Cooperación de misiles con Rusia"
 ALG_russian_missile_cooperation_desc: "La industria de misiles de Rusia se encuentra entre las más avanzadas del mundo. Una asociación con Moscú acelerará significativamente nuestro programa, a costa de profundizar nuestra dependencia de la buena voluntad rusa."
 ALG_chinese_missile_cooperation: "Cooperación de misiles con China"
 ALG_chinese_missile_cooperation_desc: "China ha mostrado disposición a compartir tecnología de misiles con Estados amigos. Un acuerdo con Pekín ofrece acceso a sistemas modernos y fortaleces nuestra posición en el emergente mundo multipolar."
 ALG_redmed_star_convergence: "Convergencia RedMed-Star"
 ALG_redmed_star_convergence_desc: "Ha llegado el momento de unir la división de misiles de RedMed con las capacidades de VANT de Star Aviation bajo una única estructura de defensa integrada. Argelia ya no importará su seguridad, la fabricará."
 ALG_regional_defense_leader: "Líder de defensa del Magreb"
 ALG_regional_defense_leader_desc: "La industria de defensa de Argelia no tiene rival en el Magreb. Nuestros VANT patrullan el Sáhara, nuestros misiles disuaden a nuestros rivales y nuestra tecnología es codiciada por vecinos que antes miraban hacia Europa. Así es como se ve la soberanía."
 ALG_uav_procurement_category: "Adquisición de VANT"
 ALG_uav_procurement_category_desc: "Star Aviation requiere una plataforma de referencia para comenzar la ingeniería inversa. Selecciona un proveedor extranjero de VANT."
 ALG_drone_program_category: "Programa de Desarrollo de Drones"
 ALG_drone_program_category_desc: "La división de VANT de Star Aviation está lista para desarrollar el primer dron nacional de Argelia. Elige una dirección de desarrollo."
 ALG_purchase_turkish_uavs: "Comprar VANT turcos"
 ALG_purchase_turkish_uavs_desc: "El Bayraktar TB2 ha demostrado su eficacia en múltiples conflictos. Adquirirlo de Turquía proporcionará experiencia operativa en VANT y una plataforma sólida para la ingeniería inversa, a costa de un mayor acercamiento a Ankara."
 ALG_purchase_chinese_uavs: "Comprar VANT chinos"
 ALG_purchase_chinese_uavs_desc: "El Wing Loong II de China ofrece capacidades comparables a los sistemas occidentales por una fracción de su precio. Pekín también ha mostrado disposición a incluir cláusulas de transferencia de tecnología en estos acuerdos."
 ALG_purchase_iranian_uavs: "Comprar VANT iraníes"
 ALG_purchase_iranian_uavs_desc: "El Mohajer-6 de Irán es rentable y ha sido probado en combate. Adquirirlo de Teherán es la opción más barata y profundiza los lazos con un socio estratégico natural, aunque puede atraer el escrutinio internacional."
 ALG_develop_amel_recon_uav: "Desarrollar el VANT Amel"
 ALG_develop_amel_recon_uav_desc: "El Amel será el primer VANT de reconocimiento diseñado a nivel nacional en Argelia, una plataforma de gran autonomía optimizada para la vigilancia fronteriza y la recopilación de inteligencia en el vasto sur sahariano."
 ALG_develop_el_djazair_ucav: "Desarrollar el UCAV El-Djazair"
 ALG_develop_el_djazair_ucav_desc: "El El-Djazair será un verdadero dron de combate, un UCAV armado capaz de realizar ataques de precisión. Más caro y técnicamente exigente que una plataforma de reconocimiento, pero un activo militar mucho más potente."
 ALG_develop_swarm_loitering: "Desarrollar municiones merodeadoras en enjambre"
 ALG_develop_swarm_loitering_desc: "En lugar de un único dron de gran tamaño, Argelia invertirá en enjambres de municiones merodeadoras (drones kamikaze) pequeñas, baratas y coordinadas. Más difíciles de interceptar, devastadoras en grandes cantidades y más baratas de producir a escala."
 ALG_redmed_group_tt: "§GEl Grupo RedMed se expande más allá de la logística de petróleo y gas hacia capacidades industriales más amplias.§!"
 ALG_star_aviation_founded_tt: "§GLa excelencia operativa de Star Aviation la posiciona para la obtención de contratos militares.§!"
 ALG_military_contract_tt: "§GStar Aviation ha asegurado contratos militares. Las decisiones de adquisición de VANT están ahora disponibles.§!"
 ALG_uav_division_tt: "§GSe ha establecido una división dedicada a los VANT. Las decisiones de desarrollo de drones están ahora disponibles.§!"
 ALG_domestic_production_tt: "§GArgelia ahora puede fabricar VANT a nivel nacional.§!"
 ALG_amel_developed_tt: "§GEl VANT de reconocimiento Amel ha sido desarrollado con éxito.§!"
 ALG_ucav_developed_tt: "§GEl VANT de combate El-Djazair está ahora operativo.§!"
 ALG_swarm_developed_tt: "§GArgelia ha desarrollado una capacidad de municiones merodeadoras en enjambre.§!"
 ALG_missile_division_tt: "§GEl Grupo RedMed ha establecido una división dedicada al desarrollo de misiles.§!"
 ALG_redmed_leader_tt: "§GEl Grupo RedMed y Star Aviation se han fusionado en un complejo industrial de defensa unificado.§!"
 ALG_defense_leader_tt: "§GArgelia es reconocida como la principal nación en tecnología de defensa del Magreb.§!"
 ALG_redmed_group_logistics: "Logística del Grupo RedMed"
 ALG_redmed_group_logistics_desc: "El Grupo RedMed proporciona servicios logísticos integrales al sector del petróleo y el gas de Argelia."
 ALG_redmed_star_aviation: "Operaciones de Star Aviation"
 ALG_redmed_star_aviation_desc: "Star Aviation mantiene un historial de seguridad impecable. Su precisión operativa se está redirigiendo hacia el desarrollo aeroespacial."
 ALG_star_aviation_military: "Contratos militares de Star Aviation"
 ALG_star_aviation_military_desc: "Star Aviation ha asegurado contratos militares, aportando su excelencia operativa civil al sector de la defensa."
 ALG_star_aviation_uav_division_idea: "División de VANT de Star Aviation"
 ALG_star_aviation_uav_division_idea_desc: "Una división dedicada a los drones está estudiando plataformas de VANT extranjeras para desarrollar las capacidades propias de Argelia."
 ALG_star_aviation_uav_production: "Fabricación de VANT de Star Aviation"
 ALG_star_aviation_uav_production_desc: "Star Aviation fabrica ahora VANT de diseño argelino a gran escala."
 ALG_redmed_integrated_defense_systems: "Defensa Integrada de RedMed"
 ALG_redmed_integrated_defense_systems_desc: "El Grupo RedMed ha fusionado sus programas de VANT y misiles en un complejo unificado de armas avanzadas."
 ALG_maghreb_defense_powerhouse: "Potencia de defensa del Magreb"
 ALG_maghreb_defense_powerhouse_desc: "La industria de defensa de Argelia, liderada por el Grupo RedMed y Star Aviation, es la más avanzada del norte de África."
 ALG_aerospace_training_program: "Programa de formación aeroespacial"
 ALG_aerospace_training_program_desc: "Un programa nacional que forma a ingenieros aeroespaciales y técnicos de drones para sostener la creciente industria de defensa de Argelia."
 ALG_combat_uav_program: "Programa de VANT de combate"
 ALG_combat_uav_program_desc: "El desarrollo activo de VANT armados está mejorando la capacidad de ataque de la Fuerza Aérea Argelina."
 ALG_redmed_missile_division_idea: "División de Misiles de RedMed"
 ALG_redmed_missile_division_idea_desc: "La rama dedicada al desarrollo de misiles del Grupo RedMed está construyendo la disuasión estratégica de Argelia desde cero."
 ALG_cruise_missile_development: "Desarrollo de misiles de crucero"
 ALG_cruise_missile_development_desc: "Un programa activo de misiles de crucero otorga a Argelia una capacidad de ataque de precisión de largo alcance por primera vez."
 ALG_precision_strike_capability: "Capacidad de ataque de precisión"
 ALG_precision_strike_capability_desc: "Los sistemas integrados de misiles y VANT han otorgado a Argelia una auténtica capacidad de ataque de precisión."
 ALG_defense_export_industry: "Industria de exportación de defensa"
 ALG_defense_export_industry_desc: "Los VANT y misiles argelinos están ahora disponibles para la exportación. Cada venta supone tanto ingresos económicos como influencia diplomática."
 ALG_redmed_group_concern: "Grupo RedMed"
 ALG_redmed_group_concern_desc: "Un conglomerado industrial argelino líder con raíces en la logística de petróleo y gas. El Grupo RedMed ha crecido hasta convertirse en el principal fabricante de defensa de Argelia, produciendo VANT y sistemas de misiles para las fuerzas armadas."
 ALG_star_aviation_concern: "Star Aviation"
 ALG_star_aviation_concern_desc: "La filial de aviación del Grupo RedMed. Fundada en 2001 con un historial de seguridad impecable, Star Aviation lidera ahora los programas nacionales de fabricación de drones y tecnología aeroespacial de Argelia."
 ALG_arrest_opponents_started_tt: "Las fuerzas de seguridad están comenzando las operaciones de arresto..."
 ALG_surveillance_started_tt: "La expansión de la red de vigilancia está en marcha..."
 ALG_ban_parties_started_tt: "Los procedimientos legales para prohibir los partidos de la oposición han comenzado..."
 ALG_imf_loan_started_tt: "Las negociaciones para el préstamo del FMI están en curso..."
 ALG_oil_licensing_started_tt: "Las negociaciones para la concesión de licencias de petróleo con empresas extranjeras han comenzado..."
 ALG_repay_imf_started_tt: "El proceso de reembolso del préstamo del FMI ha comenzado..."
 ALG_pardon_islamist_started_tt: "Los procedimientos de indulto para los islamistas moderados han comenzado..."
 ALG_dialogue_started_tt: "Se están organizando las sesiones del diálogo nacional..."
 ALG_reintegrate_fighters_started_tt: "Los programas de reintegración para antiguos combatientes están comenzando..."
 ALG_arrest_opponents_complete_tt: "Las operaciones de arresto han concluido. Oposición debilitada."
 ALG_surveillance_complete_tt: "La red de vigilancia se encuentra ahora plenamente operativa."
 ALG_ban_parties_complete_tt: "Los partidos de la oposición han sido prohibidos oficialmente."
 ALG_imf_loan_complete_tt: "Se han recibido los fondos del préstamo del FMI."
 ALG_oil_licensing_complete_tt: "Los acuerdos de concesión de licencias de petróleo están ahora en vigor."
 ALG_repay_imf_complete_tt: "El préstamo del FMI ha sido reembolsado por completo."
 ALG_pardon_islamist_complete_tt: "Se han emitido los indultos. La reconciliación política avanza."
 ALG_dialogue_complete_tt: "El diálogo nacional ha concluido con éxito."
 ALG_reintegrate_fighters_complete_tt: "Los antiguos combatientes han sido reintegrados con éxito."
 ALG_fis_return_threat: "Return of the Islamic Salvation Front in Algeria"
 ALG_fis_return_western_concern: "Alarma por el gobierno salafista en Argelia"
 ALG_fis_return_salafi_solidarity: "Apoyo al gobierno salafista en Argelia"
 ALG_fis_return_islamist_sympathy: "Acogida cautelosa al gobierno islamista en Argelia"
 ALG_fis_return_neighbor_alarm: "Alarma vecinal ante la toma de poder islamista en Argelia"
 ALG_fis_return_anti_political_islam: "Oposición al islam político en Argelia"
 ALG_world_tension_security_ended_tt: "Las medidas de seguridad extraordinarias han sido desactivadas."
 ALG_world_tension_high_security_ended_tt: "La alerta de alta seguridad ha terminado."
 ALG_crackdown_momentum_ended_tt: "El impulso de la represión se ha disipado."
 ALG_reconciliation_momentum_ended_tt: "El impulso de la reconciliación se ha desvanecido."
 ALG_by_the_people_for_the_people: "Por el pueblo, para el pueblo"
 ALG_by_the_people_for_the_people_desc: "El movimiento Hirak ha sacudido a Argelia hasta sus cimientos. El pueblo exige una transformación completa del sistema político; no un mero cambio de rostros, sino una reestructuración fundamental del poder. La vieja guardia no se marchará pacíficamente."
 ALG_by_the_people_for_the_people_tt: "El §Ymovimiento Hirak§! debe tener el impulso suficiente (equilibrio de poder por encima del §G70%§!)."
 ALG_break_the_oligarchs: "Acabar con los oligarcas"
 ALG_break_the_oligarchs_desc: "La red de empresarios que se beneficiaron de su proximidad al régimen debe ser desmantelada. Sus activos serán incautados, sus contratos revisados y su influencia sobre el Estado terminará para siempre."
 ALG_dismantle_le_pouvoir: "Desmantelar Le Pouvoir"
 ALG_dismantle_le_pouvoir_desc: "El Estado en la sombra, los generales, los servicios de inteligencia, la mano invisible que ha guiado a Argelia desde la independencia, debe ser expuesta a la luz pública y despojada de su autoridad."
 ALG_new_economic_model: "Un nuevo modelo económico"
 ALG_new_economic_model_desc: "Una vez apartados los oligarcas, Argelia necesita una nueva visión económica. El modelo de Estado rentista ha muerto. En su lugar, se erigirá una economía diversificada basada en la industria, la tecnología y el capital humano."
 ALG_unleash_civil_society: "Desatar a la sociedad civil"
 ALG_unleash_civil_society_desc: "Una prensa libre, sindicatos independientes y partidos políticos que representen a distritos electorales reales: estos son los cimientos sobre los que se construye la democracia."
 ALG_constitutional_convention: "Convención Constitucional"
 ALG_constitutional_convention_desc: "Representantes de toda Argelia se reúnen para redactar una nueva constitución. Por primera vez, el documento será redactado por el pueblo y no impuesto por los poderosos."
 ALG_presidential_republic: "República presidencial"
 ALG_presidential_republic_desc: "Argelia adoptará un sistema presidencial con un ejecutivo fuerte, una autoridad clara y rendición de cuentas democrática. El presidente gobierna con decisión, mientras que las salvaguardias constitucionales evitan el abuso de poder."
 ALG_parliamentary_republic: "República parlamentaria"
 ALG_parliamentary_republic_desc: "Argelia adoptará un sistema parlamentario donde el poder se comparte entre los representantes electos. La creación de coaliciones y el consenso garantizan que ninguna persona individual pueda volver a dominar el Estado."
 ALG_civilian_military_control: "Control civil del estamento militar"
 ALG_civilian_military_control_desc: "El estamento militar debe servir al Estado, no gobernarlo. Oficiales profesionales reemplazan a los generales políticos. El ejército es modernizado, despolitizado y colocado firmemente bajo la autoridad civil."
 ALG_democratic_dividend: "El dividendo democrático"
 ALG_democratic_dividend_desc: "Una Argelia transparente y democrática atrae la inversión extranjera, las asociaciones internacionales y el regreso de la diáspora. La economía se diversifica más allá de los hidrocarburos a medida que el mundo toma nota del cambio."
 ALG_a_new_algeria: "Una nueva Argelia"
 ALG_a_new_algeria_desc: "De las cenizas del antiguo régimen emerge una nueva nación. Las redes de corrupción son desmanteladas. La fuga de cerebros se revierte. Argelia se erige como la prueba de que se puede construir una verdadera democracia a través de la voluntad de su propio pueblo."
 ALG_transitional_instability: "Inestabilidad de transición"
 ALG_transitional_instability_desc: "El colapso del viejo orden ha dejado un vacío de poder. Las instituciones son débiles, la economía está perturbada y las fuerzas políticas compiten por moldear el futuro."
 ALG_economic_disruption: "Perturbación económica"
 ALG_economic_disruption_desc: "La incautación de activos de los oligarcas y la reestructuración de los contratos corruptos han perturbado temporalmente la actividad económica."
 ALG_free_press_and_assembly: "Prensa y reunión libres"
 ALG_free_press_and_assembly_desc: "Los periódicos independientes publican sin temor. Los ciudadanos se organizan libremente. La plaza pública pertenece al pueblo."
 ALG_diversified_economy: "Economía diversificada"
 ALG_diversified_economy_desc: "La economía de Argelia avanza más allá de la dependencia del petróleo hacia la industria, la tecnología y el desarrollo sostenible."
 ALG_new_constitution_permanent: "La Constitución del Pueblo"
 ALG_new_constitution_permanent_desc: "Redactada por delegados electos y ratificada mediante referéndum popular, la nueva constitución de Argelia consagra los derechos democráticos, la separación de poderes y el estado de derecho."
 ALG_presidential_system: "Sistema presidencial"
 ALG_presidential_system_desc: "Un ejecutivo fuerte con una autoridad clara y rendición de cuentas democrática gobierna Argelia con decisión."
 ALG_parliamentary_system: "Sistema parlamentario"
 ALG_parliamentary_system_desc: "Un sistema deliberativo donde los representantes electos debaten, negocian y construyen consensos. El poder se comparte entre partidos y coaliciones."
 ALG_professional_military: "Fuerzas Armadas profesionales"
 ALG_professional_military_desc: "Despolitizadas, modernizadas y bajo el mando civil. El estamento militar argelino sirve a la nación en lugar de controlarla."
 ALG_foreign_investment_boom: "Auge de la inversión extranjera"
 ALG_foreign_investment_boom_desc: "El capital internacional fluye hacia la Argelia democrática. La gobernanza transparente y el estado de derecho convierten al país en un destino atractivo para las inversiones."
 ALG_beacon_of_democracy: "Faro de la democracia"
 ALG_beacon_of_democracy_desc: "Argelia se erige como la prueba viviente de que una auténtica transformación democrática es posible. La nación inspires movimientos en toda la región y atrae la admiración global."
 ALG_the_nation_stands_at_a_crossroads_desc: "Algeria emerges from the Black Decade scarred. Over 200,000 dead, entire villages razed, and an economy gutted by civil war. President Bouteflika has staked his mandate on the Civil Concord, offering amnesty to militants and promising reform. But behind him stands le Pouvoir, the shadowy network of generals and intelligence officers who have ruled Algeria since independence. The path forward belongs to whoever controls what comes next."
 ALG_counterterrorism_agency_desc: "El Département du Renseignement et de la Sécurité (DRS) fue reconstruido a partir de los restos del antiguo servicio de inteligencia militar Sécurité Militaire (SM) tras la Guerra Civil. Operando con una autonomía casi total de la supervisión civil, el DRS se convirtió en la institución más poderosa de Argelia, más temida que la propia presidencia."
 ALG_investments_in_iraq: "Amistad iraquí"
 ALG_investments_in_iraq_desc: "Despite Iraq having less than ideal ties with us in the past, it is best that we warm up to each other. We can invest in Iraqi infrastructure and gain their trust."
 ALG_diplo: "Diplomacia del MSP"
 ALG_diplo_desc: "Debemos reformar nuestra diplomacia de acuerdo con nuestro nuevo gobierno."
 ALG_balance_islamists_and_secularists: "Equilibrar a islamistas y laicos"
 ALG_balance_islamists_and_secularists_desc: "Se debe mantener un frágil equilibrio entre los movimientos religiosos y las élites laicas; el fracaso arriesga un nuevo conflicto."
 ALG_new_constutition_reforms: "Reformas constitucionales"
 ALG_new_constutition_reforms_desc: "Las demandas de reforma no pueden ignorarse para siempre. Una nueva constitución puede abrir el camino hacia una gobernanza más pluralista."
 ALG_denounce_previous_colonialist_regimes: "Denunciar la ley francesa sobre el colonialismo"
 ALG_denounce_previous_colonialist_regimes_desc: "La controvertida ley de Francia que glorifica su pasado colonial ha provocado indignación. El FLN debe liderar la ofensiva para denunciar los crímenes coloniales y reafirmar la lucha anticolonial de Argelia."
 ALG_share_power: "Compartir el poder"
 ALG_share_power_desc: "En lugar de gobernar en solitario, el FLN puede compartir el poder con cautela con fuerzas de la oposición seleccionadas y tecnócratas. Esto puede preservar la estabilidad al tiempo que reduce el descontento popular contra el régimen."
 ALG_legacy_revolution: "FLN"
 ALG_legacy_revolution_desc: "Front de libération nationale (National Liberation Front) is an Algerian nationalist party. It was the sole legal party until 1989, when it ruled Algeria as a one-party state. After the Algerian Civil War, it regained power in 2002 as the most popular party and has remained so ever since. Its ideology follows a pan-Arab nationalist mindset with anti-colonialism as its original core value. It supports socialism, but particularly Arab socialism, as it opposes Marxist ideas."
 ALG_devlop_industry: "Desarrollar la industria nacional"
 ALG_devlop_industry_desc: "El futuro de Argelia depende del fortalecimiento de su base industrial. Al centrarnos en el desarrollo de sectores clave como la fabricación, la producción de energía y la tecnología, podemos reducir la dependencia de las importaciones extranjeras y construir una economía autosuficiente."
 ALG_expand_hydro: "Ampliar la infraestructura hidroeléctrica"
 ALG_expand_hydro_desc: "To support our nation's growing energy demands and reduce dependency on foreign resources, we must invest in expanding hydroelectric power. Harnessing our rivers will not only provide clean energy but also strengthen our industrial base and improve the livelihoods of our citizens."
 ALG_optimize_water_management: "Optimizar la gestión del agua"
 ALG_optimize_water_management_desc: "Para combatir la escasez de agua y mejorar la producción agrícola, debemos implementar sistemas modernos de gestión hídrica. Una distribución eficiente y la conservación apoyarán tanto a las comunidades rurales como a los centros urbanos en crecimiento, al tiempo que harán que nuestras tierras sean más resilientes a las sequías."
 ALG_hydroelectric_authority: "Autoridad Hidroeléctrica Nacional"
 ALG_hydroelectric_authority_desc: "Al establecer una autoridad hidroeléctrica centralizada, podemos desarrollar sistemáticamente los recursos hídricos sin explotar de Argelia. Esto proporcionará electricidad fiable para la industrialización al tiempo que crea empleos y experiencia técnica en los sectores de la energía renovable."
 ALG_electrify_rural_algeria: "Electrificar la Argelia rural"
 ALG_electrify_rural_algeria_desc: "Llevar electricidad al campo argelino es esencial para el desarrollo moderno. A través de la expansión de la red eléctrica y de proyectos hidroeléctricos locales, podemos mejorar el nivel de vida, permitir la agricultura mecanizada y conectar a las comunidades remotas con el progreso nacional."
 ALG_foreign_investment: "Atraer la inversión extranjera"
 ALG_foreign_investment_desc: "Para acelerar nuestro desarrollo económico, debemos crear condiciones favorables para el capital internacional. Las asociaciones estratégicas en proyectos de infraestructura y energía aportarán tanto financiación como conocimientos técnicos, manteniendo al mismo tiempo la soberanía nacional."
 ALG_algeria_islamic: "MSP"
 ALG_algeria_islamic_desc: "Mouvement de la société pour la paix (Movement of Society for Peace) is a right-wing to far-right political party in Algeria. It was founded in 1990 by the Muslim Brotherhood, which it remains aligned with. It is Sunni Islamist and follows Islamic, conservative democracy. It had its largest success in the 1997 legislative elections, being the second largest party and getting 69 out of 380 seats. It also ran once in the presidential elections in 1995, getting 25.6% of votes. It entered an electoral coalition with the MRN and MRI in 2012. The party is known also as \"Hamas\", as an abbreviation of its Arabic name \"Harakat mujtama' as-silm\"."
 ALG_algerian_islamic_movement: "Movimiento Islámico Argelino"
 ALG_algerian_islamic_movement_desc: "The Islamic movement in short was an Islamist movement in Turkey that was very popular among students advocating for a pacifist and modern view of Islam. We will draw inspiration from their teachings and reform our school curriculums to advocate for islamic values and teach them to students as well as improve education overall."
 ALG_nationwide_security_presence_desc: "Las fuerzas de seguridad se movilizan en todo el país bajo la Operación Halcón del Desierto para disuadir las manifestaciones del Hirak. Aunque es eficaz para frenar las protestas, esta medida aumenta los costes y erosiona la confianza pública."
 algerian_events.300.t: "Creciente agitación"
 algerian_events.300.d: "Los informes sobre protestas esporádicas y actos de desobediencia civil están llegando a cuentagotas desde todo el país. La frustración pública por la corrupción, el desempleo y la falta de reformas políticas está alcanzando un punto de ebullición. Por ahora, las manifestaciones siguen dispersas, pero podrían convertirse fácilmente en algo mucho mayor."
 algerian_events.300.a: "Ya pasará."
 algerian_events.300.b: "Esto podría salirse de control."
 algerian_events.230.t: "Protestas masivas barren Argelia"
 algerian_events.230.d: "Argelia se ha visto sacudida por protestas masivas y sostenidas que exigen reformas políticas y el fin del sistema gobernante. Cientos de miles de personas han tomado las calles en ciudades de todo el país en lo que se denomina un nuevo movimiento Hirak. La comunidad internacional observa de cerca la evolución de la situación."
 algerian_events.230.a: "A pivotal moment for Algeria."
 ALG_deepen_african_union: "Profundizar la cooperación con la Unión Africana"
 ALG_deepen_african_union_desc: "Argelia ha sido durante mucho tiempo uno de los pilares de la diplomacia africana. Al fortalecer activamente nuestro papel dentro de la Unión Africana, podemos mejorar nuestra influencia en el continente, fomentar la solidaridad e impulsar iniciativas para la paz y la integración económica. Aunque esto nos supondrá un coste financiero, respaldará nuestra legitimidad en África."
 ALG_strengthen_maghreb_union: "Fortalecer la Unión del Magreb"
 ALG_strengthen_maghreb_union_desc: "El sueño de la integración regional en el norte de África ha seguido siendo esquivo, pero Argelia tiene el potencial de revivirlo. Al fomentar la cooperación con nuestros vecinos del Magreb, podemos reducir las barreras comerciales, mejorar la confianza diplomática y reforzar nuestros lazos culturales e históricos compartidos."
 ALG_restoration_of_the_ummah: "Restauración de la Umma"
 ALG_restoration_of_the_ummah_desc: "La visión de un mundo islámico unido está a nuestro alcance. Los fieles se levantarán una vez más bajo un solo estandarte."
 ALG_guidance_council: "El Consejo de Orientación"
 ALG_guidance_council_desc: "Un consejo de eruditos veteranos supervisará nuestras políticas y garantizará que el gobierno se mantenga fiel a la guía divina."
 ALG_restore_the_ummah_experiment: "El experimento de la Umma"
 ALG_restore_the_ummah_experiment_desc: "Intentaremos crear un nuevo modelo de gobernanza, combinando fe, ley y liderazgo para inspirar al mundo musulmán."
 ALG_victory_of_the_faithful: "Victoria de los fieles"
 ALG_victory_of_the_faithful_desc: "Nuestra perseverancia y devoción han traído la victoria. Argelia se erigirá ahora como el bastión de los fieles en todo el mundo."
 ALG_exterminate_corruption: "Exterminar la corrupción"
 ALG_exterminate_corruption_desc: "Purgaremos la corrupción de cada institución. Ningún funcionario, soldado o clérigo estará por encima de la justicia divina."
 ALG_to_serve_allah: "Servir a Alá"
 ALG_to_serve_allah_desc: "Nuestro mandato no es por ambición mundana, sino únicamente para Alá. Cada política, cada reforma y cada lucha debe reflejar la sumisión a Su voluntad divina. Servir a Alá es purificar tanto a la nación como al alma."
 ALG_economic_islamization: "Islamización económica"
 ALG_economic_islamization_desc: "Reconstruiremos nuestra economía sobre cimientos islámicos. Los sistemas basados en intereses y la corrupción serán reemplazados por finanzas compatibles con la Sharía, ética comercial y una distribución justa de la riqueza."
 ALG_rust_belt_rejuvenation_desc: "Las fábricas abandonadas durante los años de agitación volverán a rugir con fuerza. Nuestros trabajadores, guiados por la fe y el propósito, reconstruirán el núcleo industrial de Argelia."
 ALG_rule_to_perfection_desc: "Nuestra gobernanza debe ser refinada y perfeccionada. El Califato de la mente, el Estado del alma: perfección en la administración a través de la disciplina divina."
 ALG_new_islamic_architecture_desc: "Una nueva era exige un nuevo rostro para nuestra nación. A través de mezquitas, escuelas y edificios cívicos, la belleza del arte islámico simbolizará el renacimiento de Argelia."
 ALG_prioritize_military_industries_desc: "A faithful army must be armed by a faithful industry. We will prioritize military production, ensuring our defense stands upon domestic strength."
 ALG_industrialize_the_umma_desc: "La industria servirá al Islam, no a la codicia. La Umma debe convertirse en autosuficiente, productiva y orgullosa: una civilización impulsada tanto por el acero como por la fe."
 ALG_militarize_the_nation: "Militarizar la nación"
 ALG_militarize_the_nation_desc: "Cada creyente debe estar listo para defender a la Umma. Prepararemos a nuestra sociedad para una movilización total bajo el mando divino."
 ALG_soldiers_of_faith: "Soldados de la fe"
 ALG_soldiers_of_faith_desc: "Nuestros soldados luchan no por la tierra o el poder, sino por la fe misma. El Ejército de la Fe será el escudo del Islam y la espada de la nación."
 ALG_forged_in_belief: "Forjados en las creencias"
 ALG_forged_in_belief_desc: "La fe es nuestro acero: inquebrantable e inflexible. Los soldados de Argelia están forjados en las creencias y guiados por la convicción divina."
 ALG_disciplined_army_of_god: "Ejército disciplinado de Dios"
 ALG_disciplined_army_of_god_desc: "Forjaremos un ejército basado en la obediencia, la pureza y una devoción inquebrantable. Cada soldado es tanto un guerrero como un siervo de Dios."
 ALG_made_of_steel_and_faith: "Hechos de acero y fe"
 ALG_made_of_steel_and_faith_desc: "Nuestras legiones marcharán con la fuerza del hierro y la fe de los profetas. La disciplina y las creencias se fusionarán en una fuerza inquebrantable."
 ALG_unrestricted_research: "Investigación sin restricciones"
 ALG_unrestricted_research_desc: "La ciencia no es la enemiga de la fe. Guiados por el propósito divino, adoptaremos la investigación moderna para hacer avanzar nuestras capacidades militares y tecnológicas."
 ALG_ai_military_integration: "Integración militar de la IA"
 ALG_ai_military_integration_desc: "La inteligencia artificial y la automatización se convertirán en herramientas al servicio del orden divino. Integraremos estos sistemas en nuestra estructura de defensa para mejorar la precisión y el control."
 ALG_new_executors_continent: "Nuevos ejecutores del continente"
 ALG_new_executors_continent_desc: "Argelia está lista para aplicar la justicia divina en toda África. Nuestra fe y nuestro acero moldearán el destino del continente."
 ALG_the_future_in_the_present: "El futuro en el presente"
 ALG_the_future_in_the_present_desc: "El futuro ya está sobre nosotros, guiado por la sabiduría de Alá y fortalecido por la innovación humana. Nuestra nación guiará a los fieles hacia una nueva era."
 ALG_destroy_their_will: "Destruir su voluntad"
 ALG_destroy_their_will_desc: "Aplastaremos a todos los que se opongan a la fe, en mente, en voluntad y en cuerpo. La resistencia será rota y el orden divino prevalecerá."
 ALG_declare_jihad: "Proclamar la Yihad"
 ALG_declare_jihad_desc: "Nuestro movimiento ha madurado. Ya no nos limitaremos a sermones y reformas. Ha llegado el momento de unir a los fieles bajo las armas, de declarar una Yihad contra la corrupción y la tiranía en todas las tierras del Islam."
 ALG_tharir_al_aqsa: "Tahrir al-Aqsa"
 ALG_tharir_al_aqsa_desc: "La liberación de Al-Aqsa es el deber eterno de la Umma. Reuniremos a los fieles en todo Oriente Medio, forjando una alianza sagrada bajo un solo estandarte de resistencia y unidad."
 ALG_faction_with_middle_east: "Unirse al frente de Oriente Medio"
 ALG_faction_with_middle_east_desc: "Oriente Medio sigue siendo el corazón espiritual del Islam. Desde Damasco hasta La Meca, nuestro llamamiento resonará, uniendo a las naciones suníes que anhelan defender Al-Aqsa y resistir a los opresores."
 ALG_faction_with_north_africa: "Unirse al frente del norte de África"
 ALG_faction_with_north_africa_desc: "Nuestros hermanos del norte de África, desde los desiertos de Libia hasta las calles de El Cairo, han soportado las mismas luchas. Es hora de tenderles la mano e invitarlos a nuestra causa."
 ALG_faction_with_asia: "Unirse al frente oriental"
 ALG_faction_with_asia_desc: "La luz del Islam brilla más allá de Arabia. Los pueblos de Asia Central y del Sur deben ser llamados a unirse al resurgimiento de la Umma, desde las estepas hasta las islas de Oriente."
 ALG_faction.1.t: "Una invitación desde Argel"
 ALG_faction.1.d: "Un comunicado diplomático desde Argel ha llegado a nuestro gobierno. El Frente Islámico de Salvación, ahora en el poder en Argelia, invita a las naciones de Oriente Medio a unirse a una nueva coalición, el Frente de Liberación de al-Aqsa, dedicada a coordinar el apoyo político y material para la defensa y liberación de al-Aqsa. Aceptar nos vincularía a una causa regional; rechazar nos mantendría al margen del proyecto de Argelia. ¿Cómo responderemos?"
 ALG_faction.1.a: "Aceptar, unirse al Frente de Liberación de al-Aqsa"
 ALG_faction.1.b: "Rechazar, no nos uniremos a esta coalición regional"
 ALG_faction.2.t: "Una propuesta desde el Magreb"
 ALG_faction.2.d: "Delegaciones de Argelia han invitado formalmente a los gobiernos del norte de África a comprometer su cooperación dentro de una nueva coalición, el Frente de Liberación de al-Aqsa. La propuesta busca un frente magrebí para coordinar la presión política y el apoyo humanitario a Palestina. Unirse profundizaría los lazos con Argel; rechazar preservaría nuestra autonomía actual. ¿Cómo responderemos?"
 ALG_faction.2.a: "Sí, el Magreb se mantendrá unido"
 ALG_faction.2.b: "No, este no es un camino que tomaremos"
 ALG_faction.3.t: "Una llamada desde Argel hacia Oriente"
 ALG_faction.3.d: "Enviados argelinos se han puesto en contacto con naciones musulmanas asiáticas con una oferta: unirse al Frente de Liberación de al-Aqsa, una coalición destinada a coordinar los esfuerzos diplomáticos, políticos y materiales para la defensa de al-Aqsa. La iniciativa pide solidaridad entre regiones; también entraña el riesgo de enredarse en conflictos más amplios. ¿Nos uniremos a la coalición de Argel?"
 ALG_faction.3.a: "Unirse, respondemos al llamamiento de solidaridad"
 ALG_faction.3.b: "Rechazar, debemos evitar este enredo"
 ALG_islamic_offices: "Establecer oficinas islámicas"
 ALG_islamic_offices_desc: "Para gobernar bajo los principios del Islam, nuestro movimiento debe construir una estructura organizada capaz de gestionar tanto la fe como el Estado. Al establecer oficinas islámicas en todo el país, supervisaremos la educación religiosa, los asuntos sociales y la orientación moral, asegurando que la gobernanza se alinee con los valores de la Umma. Estas oficinas servirán como la columna vertebral de nuestro nuevo orden, uniendo al pueblo bajo la fe, la disciplina y la justicia."
 ALG_integrate_kabylie_tt: "§GIntegrar Cabilia pacíficamente§!"
 ALG_improve_relations_with_egypt: "Mejorar las relaciones con Egipto"
 ALG_improve_relations_with_egypt_desc: "Egipto y Argelia comparten profundos lazos como naciones árabes líderes. El MSP, con sus raíces en la tradición de los Hermanos Musulmanes, ve a El Cairo como un socio natural. El fortalecimiento de las relaciones con Egipto mejorará nuestra posición en el mundo árabe y abrirá las puertas a la cooperación económica y religiosa."
 ALG_el_karaouin_uni: "La Universidad de Al-Qarawiyyin"
 ALG_el_karaouin_uni_desc: "Al establecer lazos con una de las universidades islámicas más antiguas del mundo, el FIS cultivará a una generación de eruditos leales al nuevo orden, distanciando a los militares de la autoridad religiosa."
 ALG_father_of_the_ummah: "Padre de la Umma"
 ALG_father_of_the_ummah_desc: "El líder del Frente Islámico de Salvación se posicionará como el padre espiritual de toda la comunidad musulmana, cultivando un culto a la personalidad arraigado en la piedad y el mandato divino."
 ALG_followers_of_the_prophet: "Seguidores del Profeta"
 ALG_followers_of_the_prophet_desc: "El Estado se remodelará en torno al estricto cumplimiento de la Sunnah. Se espera que los ciudadanos vivan como lo hizo el Profeta, y las instituciones gubernamentales se reestructurarán para reflejar esta visión."
 ALG_governmental_cleansing: "Depuración gubernamental"
 ALG_governmental_cleansing_desc: "Aquellos dentro del aparato estatal que sean considerados insuficientemente devotos o ideológicamente impuros serán destituidos sistemáticamente y reemplazados por partidarios leales al movimiento."
 ALG_make_our_nation_pure: "Purificar nuestra nación"
 ALG_make_our_nation_pure_desc: "El FIS lanzará una amplia campaña social para purgar la influencia occidental de la sociedad argelina, imponiendo los valores islámicos en la educación, la vestimenta y el comportamiento público."
 ALG_new_patriotism: "Un nuevo patriotismo"
 ALG_new_patriotism_desc: "El amor por Argelia y el amor por el Islam son uno y el mismo. El FIS forjará una nueva identidad nacional donde la fe sea el fundamento del orgullo cívico y del propósito colectivo."
 ALG_restore_the_soul_of_the_ummah: "Restaurar el alma de la Umma"
 ALG_restore_the_soul_of_the_ummah_desc: "Argelia asumirá el sagrado deber de reavivar la llama espiritual del mundo musulmán, posicionando al Estado como la brújula moral de todas las naciones islámicas."
 ALG_sharia_through_discipline: "Sharía a través de la disciplina"
 ALG_sharia_through_discipline_desc: "La ley de la Sharía se impondrá no a través de la persuasión, sino mediante una firme disciplina. El Estado ampliará sus poderes de control policial y de castigo para garantizar el pleno cumplimiento de la ley islámica."
 ALG_strength_and_virtue: "Fuerza y virtud"
 ALG_strength_and_virtue_desc: "Un Estado fuerte y un pueblo virtuoso son inseparables. El FIS invertirá tanto en la educación moral como en la disciplina institucional para construir una sociedad recta en carácter y firme en su determinación."
 ALG_strict_authority: "Autoridad estricta"
 ALG_strict_authority_desc: "La nueva Argelia requiere una mano firme. El FIS centralizará el poder y aumentará el presupuesto policial, garantizando que la población se adhiera a las normas de conducta del movimiento."
 ALG_the_people_are_not_to_be_trusted: "No se debe confiar en el pueblo"
 ALG_the_people_are_not_to_be_trusted_desc: "La democracia ha demostrado ser una puerta de entrada a la corrupción y a la impiedad. El FIS desmantelará el proceso democrático y pondrá la gobernanza firmemente en manos de quienes saben lo que Alá exige."
 ALG_urban_preachers: "Predicadores urbanos"
 ALG_urban_preachers_desc: "El FIS desplegará una red de predicadores en las ciudades de Argelia, propagando la ideología del movimiento y consolidando el Islam estatal como la fuerza dominante en la vida pública."
 ALG_jamiat_al_karaouin_desc: "Los lazos con la antigua institución de Al-Qarawiyyin han formado a una nueva clase de eruditos islámicos leales al Estado del FIS y hostiles a la interferencia militar en los asuntos religiosos."
 ALG_coalition_economic_program: "Programa Económico de la Coalición"
 ALG_coalition_economic_program_desc: "La coalición presidencial debe presentar una visión económica unificada. Al coordinar las políticas económicas de nuestros socios de coalición, podemos atraer inversiones, apoyar a las pequeñas empresas y sentar las bases para un crecimiento sostenible. Una economía fuerte legitimará a la coalición y silenciará a nuestros críticos."
 ALG_governmental_transparency: "Transparencia gubernamental"
 ALG_governmental_transparency_desc: "Si nuestro camino democrático ha de significar algo, debemos exigirnos un estándar más alto que quienes nos precedieron. Mediante la implementación de medidas de transparencia y la apertura de los registros gubernamentales al escrutinio público, podemos erradicar la corrupción y restaurar la fe del pueblo en sus instituciones, incluso si eso significa ganarnos enemigos entre la vieja guardia."
 ALG_support_mujahideen: "Apoyar a los muyahidines"
 ALG_support_mujahideen_desc: "Elementos dentro del Estado abogan por prestar apoyo encubierto a los combatientes islamistas que operan en toda la región. Aunque estas acciones pueden fortalecer nuestra influencia entre las redes radicales y desestabilizar a los actores hostiles, entrañan el riesgo de provocar una dura reacción internacional y consecuencias internas a largo plazo."
