 APC_12_desc: "Бронетранспортёры — бронированные машины, предназначенные для доставки в бой отделения солдат, которые затем спешиваются и сражаются в пешем порядке. Они защищают солдат, но, как правило, собственные боевые возможности у них ограничены. Пехоту, перевозимую на БТР, называют механизированной пехотой."
 IFV_9: "БМП 2045 года"
 IFV_9_desc: "Боевые машины пехоты (БМП) — тяжелобронированные машины, доставляющие в бой отделение солдат. Десант может вести бой прямо из машины в гораздо большей степени, чем из БТР. БМП вооружены крупнокалиберным пулемётом и автоматической пушкой либо оснащены ПТУР. Пехоту, перевозимую на БМП, называют бронетанковой пехотой или тяжёлой механизированной пехотой."
 IFV_10: "БМП 2055 года"
 IFV_10_desc: "Боевые машины пехоты (БМП) — тяжелобронированные машины, доставляющие в бой отделение солдат. Десант может вести бой прямо из машины в гораздо большей степени, чем из БТР. БМП вооружены крупнокалиберным пулемётом и автоматической пушкой либо оснащены ПТУР. Пехоту, перевозимую на БМП, называют бронетанковой пехотой или тяжёлой механизированной пехотой."
 MBT_10: "ОБТ 2055 года"
 MBT_10_desc: "Многослойная графеновая броня для бронетехники обеспечивает защиту при беспрецедентно малой массе и способна к самовосстановлению с помощью нанороботов. Благодаря литий-воздушным аккумуляторам и электродвигателю тепловое излучение танка сводится практически к нулю, а вместе с адаптивным инфракрасным камуфляжем это делает его практически неотслеживаемым для ракетных систем с электронным наведением. ОБТ обладают тяжёлой бронёй и высокой подвижностью на равнинной местности и обеспечивают армии мощными возможностями огня прямой наводкой."
 MBT_11: "ОБТ 2065 года"
 MBT_11_desc: "Многослойная графеновая броня для бронетехники обеспечивает защиту при беспрецедентно малой массе и способна к самовосстановлению с помощью нанороботов. Благодаря литий-воздушным аккумуляторам и электродвигателю тепловое излучение танка сводится практически к нулю, а вместе с адаптивным инфракрасным камуфляжем это делает его практически неотслеживаемым для ракетных систем с электронным наведением. ОБТ обладают тяжёлой бронёй и высокой подвижностью на равнинной местности и обеспечивают армии мощными возможностями огня прямой наводкой."
