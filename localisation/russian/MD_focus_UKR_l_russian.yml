 ukr_modernize_sov_equipment_s125_offer_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_s125_for_tooltip\n\n\n\n\n\n\n\n\n§WНаши хранящиеся дивизионы §YС-125 «Нева»§! всё ещё востребованы: §Y[EGY.GetNameWithFlag]§!, §Y[LBA.GetNameWithFlag]§! и страны Кавказа. Покупатель решает, развернуть дивизион на стационарной позиции или как мобильные пусковые установки.\n------------------\nПродажа стране §Y[LBA.GetNameWithFlag]§! §Rразозлит НАТО§!.§!"
 ukr_modernize_sov_equipment_s125_reactivate_site_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_s125_for_tooltip\n\n\n\n\n\n\n\n\n§WВойна с §R[SOV.GetName]§! требует всех средств ПВО, какие у нас есть. Хранящийся дивизион §YС-125§! может вернуться на позиции в регионе [1087.GetName], [696.GetName], [1086.GetName] или [1085.GetName].§!"
 ukr_modernize_sov_equipment_s125_reactivate_battery_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_s125_for_tooltip\n\n\n\n\n\n\n\n\n§WРасчёты могут ввести в строй четыре пусковые установки хранящегося дивизиона §YС-125§! как мобильную батарею быстрее, чем развернуть стационарную позицию.§!"
 ukr_modernize_sov_equipment_s125_reactivate_modernized_site_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_s125_for_tooltip\n\n\n\n\n\n\n\n\n§WПосле завершения модернизации наши заводы могут довести хранящийся дивизион §YС-125§! до нового стандарта и развернуть его на стационарной позиции.§!"
 ukr_modernize_sov_equipment_s125_reactivate_modernized_battery_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_s125_for_tooltip\n\n\n\n\n\n\n\n\n§WПосле завершения модернизации наши заводы могут довести пусковые установки хранящегося дивизиона §YС-125§! до нового стандарта и использовать их как мобильную батарею.§!"
