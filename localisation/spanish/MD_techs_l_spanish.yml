 module_capital_digital_integrated_fire_control_desc: "Interfaces digitales integradas en los sistemas para permitir un liderazgo y mantenimiento más efectivos desde el puente del barco.\n\n§GConsejo de diseño: El control de tiro mejora el ataque de cañón, los misiles antibuque, la perforación de misiles antibuque, el ataque antiaéreo y el blindaje, haciendo que un buque armado sea más efectivo en múltiples roles. Los sistemas avanzados proporcionan mayores bonificaciones pero cuestan más capacidad industrial (IC) y microchips.§!\n\n§WUtilizar esto como arma principal creará un§! §BBuque capital§!"
