#COSMEDICS
SOL_IFM: "Isatabu Freedom Movement"
SOL_munda_accords: "Munda Accords"
SOL_munda_accords_desc: "After the escalations of the 90's, a series of provisions have been instituted to mitigate the tensions brought on by increased migration within the country. The Accord restricts the movement of unemployed vagrants across provinces, enforces the repatriation of Malaitians to their local province, and blocks foreign land acquisitions."
SOL_western_logging_efforts: "Western Logging Efforts"
SOL_western_logging_efforts_desc: "Commercial logging in the Western Province has quickly become our most profitable industry, comprising the majority of our exports and providing an economic pillar for the region. Recently, however, its success has drawn in an influx of migrants from across the islands looking for work. Leading to an extenuating migrant crisis in the region."
SOL_aftermath_of_the_tensions: "Aftermath of the Tensions"
SOL_aftermath_of_the_tensions_desc: "While the 1999 Accord has led to more recognition and legal pathways for the various cultural disputes, a state of fragile peace exists on the Islands. Unless we can get a handle on the state of the government, and solve the ongoing migration issues in the country, we may not be able to stop another crisis emerging. \n§W--------------§!\nThis national spirit will be §GRemoved§! if stability is higher than §Y70%§! and corruption level is §Y(3) modest§! or higher."
SOL_agreement_with_the_gangs: "Agreement with the Gangs"
SOL_agreement_with_the_gangs_desc: "Our deal with the Isatabu Freedom Movement has brought us some much needed breathing room at the cost of letting dozens of high profile criminals out on the streets. Our police are now dealing with a high uptick in crime, while our trust with the public has reached all time lows."
