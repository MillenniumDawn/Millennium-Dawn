 sp_improved_synthetic_diamonds_idea: "Zmodernizowany rozwój diamentów syntetycznych"
 scientist_trait_genius: "Geniusz"
 scientist_trait_genius_desc: "Wizjonerski umysł, który przesuwa granice nauki i technologii dzięki niezrównanej innowacji. To rodzaj talentu, który pojawia się tylko raz na pokolenie."
 scientist_trait_brilliant_theorist: "Genialny teoretyk"
 scientist_trait_brilliant_theorist_desc: "Mistrz abstrakcyjnych pojęć i teorii, zdolny zrewolucjonizować strategię wojskową i badania naukowe."
 scientist_trait_gifted_engineer: "Utalentowany inżynier"
 scientist_trait_gifted_engineer_desc: "Inżynier o naturalnym talencie, biegły w rozwiązywaniu złożonych problemów technicznych z różnych dziedzin."
 scientist_trait_bright: "Jasny"
 scientist_trait_bright_desc: "Bystry, szybko myślący naukowiec, który wyróżnia się zdolnością przyswajania nowych koncepcji i skutecznego ich stosowania."
 scientist_trait_fast_learner: "Szybko się uczę"
 scientist_trait_fast_learner_desc: "Szybko dostosowuje się do nowych wyzwań, uczy się szybciej niż jego rówieśnicy i odnosi sukcesy w wielu dziedzinach naukowych."
 scientist_trait_resourceful: "Pomysłowy"
 scientist_trait_resourceful_desc: "Zawsze znajduje kreatywne rozwiązania, nawet gdy zasoby są ograniczone lub sytuacja jest dramatyczna."
 scientist_trait_nuclear_specialist: "Specjalista ds. energii jądrowej"
 scientist_trait_nuclear_specialist_desc: "Fizyk, który zajmuje się badaniami atomowymi, pasjonuje się badaniem rozszczepienia jądra atomowego i reakcji łańcuchowych."
 scientist_trait_civilian_technology_expert: "Ekspert ds. badań cywilnych"
 scientist_trait_civilian_technology_expert_desc: "Ekspert w zakresie rozwoju technologii przeznaczonych dla sektora cywilnego."
 scientist_trait_energy_expert: "Ekspert ds. produkcji energii"
 scientist_trait_energy_expert_desc: "Weteran wielu firm energetycznych, zdolny do opracowywania nowych metod produkcji energii."
 scientist_trait_telecommunications_expert: "Ekspert ds. telekomunikacji"
 scientist_trait_telecommunications_expert_desc: "Człowiek urodzony z telefonem w ręku, ekspert w znajdowaniu sposobów na udostępnienie pornografii na każdym urządzeniu, jakie posiada."
 scientist_trait_naval_vessels_specialist: "Specjalista marynarki wojennej"
 scientist_trait_naval_vessels_specialist_desc: "Specjalista w dziedzinie projektowania kadłubów okrętów wojennych – od bezzałogowych jednostek pływających po superlotniskowce."
 scientist_trait_stealth_specialist: "Specjalista od statków stealth"
 scientist_trait_stealth_specialist_desc: "Specjalizujemy się w projektowaniu statków o minimalnym sygnale radarowym i sonarowym."
 scientist_trait_avionics_specialist: "Specjalista ds. samolotów"
 scientist_trait_avionics_specialist_desc: "Specjalista w dziedzinie aerodynamiki i projektowania samolotów, potrafiący tworzyć doskonałe płatowce, silniki i projekty pozwalające dominować w przestworzach."
 scientist_trait_missile_specialist: "Specjalista ds. pocisków"
 scientist_trait_missile_specialist_desc: "Specjalizuje się w technologii rakietowej, ze szczególnym uwzględnieniem zasad napędu w programach balistycznych i pocisków kierowanych."
 scientist_trait_space_specialist: "Miłośnik kosmosu"
 scientist_trait_space_specialist_desc: "Osoba, która poświęciła swoje życie szerzeniu celów ludzkości poza Ziemią."
 scientist_trait_aircraft_engine_expert: "Ekspert ds. napędu"
 scientist_trait_aircraft_engine_expert_desc: "Ekspert w dziedzinie napędów odrzutowych i tłokowych, prowadzący badania nad silnikami i ich zastosowaniem w samolotach wojskowych."
 scientist_trait_autonomous_plane_expert: "Ekspert ds. pojazdów bezzałogowych"
 scientist_trait_autonomous_plane_expert_desc: "Ekspert w dziedzinie sprawiania, by rzeczy latały bez potrzeby pilotażu."
 scientist_trait_armored_specialist: "Specjalista ds. pojazdów opancerzonych"
 scientist_trait_armored_specialist_desc: "Doświadczony inżynier specjalizujący się w projektowaniu platform i kadłubów pojazdów opancerzonych."
 scientist_trait_infantry_specialist: "Specjalista piechoty"
 scientist_trait_infantry_specialist_desc: "Specjalista w dziedzinie broni strzeleckiej, jej zastosowań i konstrukcji."
 scientist_trait_mechsuit_specialist: "Specjalista od kombinezonów mechanicznych"
 scientist_trait_mechsuit_specialist_desc: "Ktoś, kto za dużo grał w Titanfall."
 sp_improved_space_solar_farms_idea: "Farmy słoneczne w kosmosie"
 sp_afv_double_cannons: "Podwójne działo"
 sp_afv_double_cannons_desc: "Generalnie nasze lżejsze opancerzone pojazdy bojowe są wyposażone w jedną broń, zazwyczaj działko automatyczne. Jednak możemy być w stanie stworzyć system do montażu dwóch działek obok siebie."
 sp_afv_double_cannons_reward_improved_autoloader: "Ulepszony Autoloader"
 sp_afv_double_cannons_reward_improved_autoloader_desc: "Nasi inżynierowie opracowali ulepszony mechanizm ładujący do naszych czołgów, pracując nad systemem przeładowywania podwójnego działa."
 sp_coilgun_memes: "Ręczne działa Gaussa"
 sp_coilgun_memes_desc: "Robiąc \"kochanie, zmniejszyłem dzieciaki\" na technologii dział elektromagnetycznych naszych czołgów, możemy dać naszej piechocie moc pocisku wolframowego, który działa mach hesus.\nNie kuś schizofrenika, bo przysięgam, że zrobię takie gówno w jeden wieczór."
 sp_multipurpose_warhead: "Głowice wielozadaniowe"
 sp_multipurpose_warhead_desc: "Mamy pociski przeciwko czołgom i pociski przeciwko samolotom. Ale co, gdybyśmy mogli zwiększyć skuteczność naszych pocisków przeciwko obu? W ten sposób, w razie potrzeby, pociski przeciwpancerne i przeciwlotnicze mogłyby zostać użyte przeciwko innym celom niż te, do których zostały przeznaczone."
 sp_supercarrier_1: "Wczesne Superlotniskowce"
 sp_supercarrier_1_desc: "Większa przestrzeń na pokładzie i możliwość budowy statków tej wielkości będą miały kluczowe znaczenie dla naszej dalekosiężnej projekcji siły."
 sp_supercarrier_2: "Późne Superlotniskowce"
 sp_supercarrier_2_desc: "Wprowadzenie silników jądrowych oznacza większą moc, a co za tym idzie większe statki i większą przestrzeń na pokładzie."
 sp_stealth_technology: "Eksperymenty z niską wykrywalnością"
 sp_stealth_technology_desc: "Aby zyskać przewagę nad wrogiem, musimy znaleźć sposób, aby nasze myśliwce stały się trudniejsze do wykrycia przez radar."
 sp_arsenal_bird: "Latający Lotniskowiec"
 sp_aresnal_bird_desc: "Dzięki rozwojowi w pełni autonomicznych samolotów, silników samolotów zasilanych energią jądrową i zaawansowanych systemów sterowania lotem możemy zbudować samolot, który może przenosić na sobie całe siły powietrzne dronów. Ten samolot, choć niezwykle drogi, będzie szczytem systemów walki powietrznej."
 sp_multipurpose_warhead_reward_improved_warhead: "Ulepszone Głowice bojowe"
 sp_multipurpose_warhead_reward_improved_warhead_desc: "Próbując ustalić, w jaki sposób zwiększyć skuteczność obrony przeciwlotniczej pocisków przeciwpancernych i skuteczność obrony przeciwpancernej pocisków przeciwlotniczych, nasi inżynierowie odkryli, w jaki sposób można poprawić ogólną skuteczność jednego typu pocisków."
 sp_multipurpose_warhead_reward_improved_warhead_at: "Lepsze możliwości przeciwpancerne"
 sp_multipurpose_warhead_reward_improved_warhead_aa: "Lepsze możliwości przeciwlotnicze"
 sp_emp_warhead: "Ulepszone środki WRE"
 sp_emp_warhead_desc: "Zarówno czołgi, jak i samoloty mają środki walki elektronicznej, które mogą zmniejszyć wpływ broni EMP. Ponieważ różne platformy wykorzystują różną architekturę, możemy skutecznie skupić się tylko na jednym typie celu."
 sp_emp_warhead_reward_improved_warhead_at: "Cele lądowe są priorytetem"
 sp_emp_warhead_reward_improved_warhead_aa: "Cele powietrzne są priorytetem"
 sp_fire_support_land_drone_reward_improved_communication_desc: "Podczas opracowywania wydajnej metody sterowania naszymi dronami nasi inżynierowie opracowali ulepszoną metodę komunikacji bezprzewodowej. Możemy wykorzystać to przełomowe odkrycie zarówno w zastosowaniach cywilnych, jak i wojskowych"
 sp_double_shot_rifle_tt: "Zwiększa o  §G5%§! §YObronę§! oraz §YPrzełamanie§! wszystkich jednostek §YSił Specjalnych§!\n"
 sp_double_shot_rifle_tech: "Karabin dwustrzałowy"
 sp_ground_fireandforget: "PPK Odpal i zapomnij"
 sp_ground_fireandforget_desc: "Miniaturyzacja elektroniki pozwala obecnie pociskom na automatyczne namierzanie celu dzięki blokadom termicznym."
 sp_modern_air_electronics: "Nowoczesna elektronika lotnicza"
 sp_modern_air_electronics_desc: "Nowa generacja elektroniki w konstrukcji radarów lotniczych, kokpitów i innych systemów."
 sp_future_air_electronics: "Futurystyczna elektronika lotnicza"
 sp_future_air_electronics_desc: "Łączymy najnowsze technologie w zakresie inteligentnej sztucznej inteligencji, systemów laserowych i nanotechnologii, aby stworzyć wysoce wydajny sprzęt lotniczy."
 sp_modern_air_weapons: "Inteligentne lotnicze środki walki"
 sp_modern_air_weapons_desc: "Inteligentne celowanie, zamontowane na broni radary milimetrowe, Lock-on Po starcie. Nowa generacja broni torująca drogę przyszłemu polu bitwy."
 sp_future_air_weapons: "Autonomiczne lotnicze środki walki"
 sp_future_air_weapons_desc: "Udoskonalenie poprzedniej generacji pocisków i czujników lotniczych za pomocą procesorów AI oraz jeszcze dokładniejszych systemów wykrywania i namierzania."
 sp_hypersonic_missile: "Pociski hipersoniczne"
 sp_hypersonic_missile_desc: "Pociski hipersoniczne umożliwią naszym strategicznym siłom rakietowym uderzanie głęboko w terytorium wroga z prędkością, która jeszcze niedawno uważana była za niemożliwą."
 sp_hypersonic_missile_tt: "Odblokowuje §YTechnologie pocisków hipersonicznych§!"
 sp_naval_generic_reward_army_xp_1: "Zmiana w przepływie idei"
 sp_naval_generic_reward_army_xp_2: "Fala pomysłów"
 sp_naval_generic_reward_army_xp_3: "Tsunami innowacji!"
 sp_emp_warhead_reward_improved_warhead: "Broń elektroniczna"
 sp_emp_warhead_reward_improved_warhead_desc: "Sprzęt elektroniczny może dać nam przewagę w walce powietrznej."
 sp_helicopter_project_desc: "Podobnie jak projektowanie samochodu i innych pojazdów, projektowanie i budowa śmigłowców wymaga lokalnej wiedzy, aby produkować te specjalistyczne pojazdy lokalnie. Powinniśmy przeprowadzić pewne eksperymenty projektowe, aż opracujemy wersję dla siebie."
 sp_helicopter_project: "Eksperymentalne projekty śmigłowców"
 sp_helicopter_project_tt: "Odblokowuje następujące §Ylinie technologiczne§!:\n-§YŚmigłowce transportowe§!\n-§YŚmigłowce szturmowe§!\n"
 sp_air_generic_reward_army_xp_1: "Powiew Świeżości"
 sp_air_generic_reward_army_xp_2: "Powiew Innowacji"
 sp_air_generic_reward_army_xp_3: "Wiatry Zmian"
 sp_tank_stealth_armor_early: "Wczesny pancerz Stealth"
 sp_tank_stealth_armor_early_desc: "Tworząc pancerz, który nie tylko chroni nasze czołgi, ale także zapewnia lepsze ukrycie, możemy wcielić w życie najlepsze teorie dotyczące pancerza: że lepiej nie zostać trafionym, niż powstrzymać trafienie."
 sp_electronic_government: "Rząd elektroniczny"
 sp_electronic_government_desc: "Aby zmaksymalizować efektywność państwa, obywatele powinni mieć możliwość dostępu do administracji rządowej i interakcji z nią w zaciszu własnego domu. To zachęci obywateli do większej znajomości internetu i obniży wydatki rządowe do astronomicznie niskiego poziomu."
 sp_tank_nera_armor: "Ciężki kompozyt NERA"
 sp_tank_nera_armor_desc: "Możemy badać zaawansowane materiały, aby produkować cięższe i bardziej odporne rodzaje pancerzy, takie jak wkładki ze zubożonego uranu"
 sp_aircraft_project_bba_tt: "Odblokowuje następujące §Y linie technologiczne §!:\n- §Y Lekkie płatowce §!\n- §Y Średnie płatowce §!\n- §Y Ciężkie płatowce §!\n- §Y Śmigłowce szturmowe §!\n- §Y Śmigłowce transportowe §!\n"
 sp_aircraft_project_non_bba_tt: "Odblokowuje następujące §Y linie technologiczne §!:\n- §Y Myśliwce §!\n- §Y Samoloty bliskiego wsparcia §!\n- §Y Bombowce §!\n- §Y Bezzałogowe bojowe statki powietrzne §!\n- §Y Lekkie myśliwce §!\n"
 sp_space_weapons: "Broń kosmiczna"
 has_completed_space_program_tt: "Ukończył projekt specjalny: §Y $sp_space_program$ §!"
 has_completed_space_weapons_tt: "Ukończył projekt specjalny: §Y $sp_space_weapons$ §!"
 sp_microchip_production: "Laboratoria produkcji mikrochipów"
 sp_microchip_production_desc: "Eksperymentując z miniaturyzacją procesów obliczeniowych i ucząc się ich realizacji na dużą skalę, będziemy w stanie wytwarzać własne mikroczipy do zastosowania w nowoczesnym uzbrojeniu i sprzęcie."
 sp_composite_production: "Laboratoria produkcji kompozytów"
 sp_composite_production_desc: "Eksperymentując z nowymi technologiami oraz metodami takimi jak wytapianie, mieszanie i inne procesy chemiczne, możemy udoskonalać sposoby wytwarzania nowoczesnych, zaawansowanych materiałów kompozytowych."
 sp_recon_land_drone: "Drony Rozpoznania naziemnego"
 sp_recon_land_drone_desc: "Współczesne działania lądowe w coraz większym stopniu zależą od przewagi informacyjnej i wczesnego wykrywania zagrożeń. Wykorzystanie specjalistycznych dronów rozpoznawczych wspierających nasze siły naziemne pozwala rozszerzyć zakres świadomości sytuacyjnej daleko poza możliwości tradycyjnych metod rozpoznania. Inwestycja ta umożliwia szybsze podejmowanie decyzji, lepszą koordynację działań oraz uzyskanie bardziej przejrzystego obrazu pola walki jeszcze przed nawiązaniem bezpośredniego starcia."
 sp_smart_bullets: "Inteligentne pociski"
 sp_smart_bullets_desc: "Postęp w dziedzinie systemów naprowadzania i wskazywania celów zaczyna oddziaływać nawet na najmniejsze elementy pola walki. Inwestując w inteligentną amunicję dla naszej piechoty i broni wsparcia, dążymy do zwiększenia celności oraz skuteczności działań w złożonych warunkach bojowych."
 sp_recon_drone_land: "Systemy naziemnych dronów rozpoznawczych"
 sp_recon_drone_land_desc: "Wraz z powszechnym wykorzystaniem bezzałogowych statków powietrznych na polu walki, drony rozpoznawcze naziemne zapewniają wojskom lądowym ciągły wywiad w czasie rzeczywistym na linii frontu. Działając w pobliżu jednostek bojowych, drony te poprawiają świadomość sytuacyjną, identyfikację celów i koordynację działań, nie narażając personelu na bezpośrednie ryzyko."
 sp_airless_tires: "Opony bezpowietrzne"
 sp_airless_tires_desc: "Mobilność pozostaje kluczowym czynnikiem we współczesnych działaniach lądowych, zwłaszcza w trudnych i nieprzewidywalnych warunkach. Zastosowanie technologii opon bezpowietrznych w pojazdach wojskowych pozwala ograniczyć zakres czynności obsługowych i wyeliminować ryzyko przebicia. Inwestycja ta zwiększa niezawodność operacyjną, umożliwiając naszym siłom utrzymanie mobilności nawet w niesprzyjających warunkach."
 sp_exoskeletal_engine_tank: "Układy napędowe typu egzoszkieletowego"
 sp_exoskeletal_engine_tank_desc: "Konwencjonalne silniki opierają się na centralnych wałach i tarczach, co wiąże się z nieodłącznymi ograniczeniami w zakresie masy, obciążeń i sprawności. Badając konstrukcje silników o budowie szkieletowej (typu egzoszkielet), w których wirujące łopatki są podparte w strukturze bębnowo-wirnikowej, dążymy do zmniejszenia masy, poprawy niezawodności oraz otwarcia nowych możliwości w zakresie kompaktowych układów napędowych o dużej mocy."
 sp_nuclear_engine_tank: "Układy napędowe o napędzie jądrowym"
 sp_nuclear_engine_tank_desc: "Rosnące zapotrzebowanie na paliwo i zwiększony zasięg operacyjny wywierają coraz większe obciążenie na logistykę konwencjonalnych pojazdów pancernych. Badając systemy silników jądrowych dla ciężkich pojazdów lądowych, dążymy do zmniejszenia zależności od linii zaopatrzenia, jednocześnie zachowując długoterminową mobilność."
 sp_light_walker_tank_chassis: "Podwozie lekkiego Robota kroczącego"
 sp_light_walker_tank_chassis_desc: "Lekkie, dwunożne, opancerzone podwozie zaprojektowane do poruszania się po nierównym terenie, gruzach i miejskich przeszkodach, które ograniczają możliwości konwencjonalnych pojazdów gąsienicowych. Chociaż jego podwyższony profil i złożone siłowniki stwarzają problemy z konserwacją i niezawodnością, lekka platforma krocząca może zapewnić wyjątkową mobilność w gęsto zaludnionych miastach i na nierównym terenie, przy odpowiednim wsparciu piechoty i dronów."
 sp_drone_lrs: "System startowy rakiet wynoszących drony"
 sp_drone_lrs_desc: "Zastępując konwencjonalną amunicję rakietową dużą liczbą jednorazowych dronów, ten system wyrzutni zapewnia siłę ognia opartą na roju na rozległym obszarze. Po rozmieszczeniu drony rozpraszają się, aby prowadzić rozpoznanie, uderzenia lub ataki patrolowe, umożliwiając wojskom lądowym nasycenie obrony wroga, adaptację do celów w locie i utrzymywanie presji bez polegania na tradycyjnych ładunkach rakietowych."
 sp_heavy_walker_tank_chassis: "Podwozie ciężkiego Robota kroczącego"
 sp_heavy_walker_tank_chassis_desc: "Bazując na wcześniejszych koncepcjach maszyn kroczących, ciężkie, dwunożne platformy pancerne łączą w sobie gruby pancerz z przegubową mobilnością, umożliwiając poruszanie się w terenie niedostępnej dla konwencjonalnych czołgów ciężkich. Choć wolniejsze i bardziej złożone mechanicznie, pojazdy te kładą nacisk na wytrzymałość przednią i stabilne platformy uzbrojenia, co pozwala im wspierać operacje przełomowe w gęsto zaludnionym i trudnym terenie."
 sp_walker_tank_chassis: "Podwozie Robota kroczącego"
 sp_walker_tank_chassis_desc: "Łącząc konstrukcję pojazdu opancerzonego z ruchomą, przegubową konstrukcją opartą na nogach, podwozia czołgów kroczących są przeznaczone do działania w terenie, w którym konwencjonalne platformy gąsienicowe mają problemy. Dzięki pokonywaniu przeszkód i poruszaniu się po nierównym terenie, pojazdy te oferują większą elastyczność w warunkach miejskich, górskich i silnie zniszczonych, kosztem zwiększonej złożoności mechanicznej i wymagań konserwacyjnych."
 sp_hover_suspension: "Systemy zawieszenia typu hover"
 sp_hover_suspension_desc: "Zastępując tradycyjny układ jezdny gąsienicowy systemami zawisu generującymi siłę nośną, transportery opancerzone zyskują możliwość poruszania się nad powierzchnią gruntu, a nie po niej. Pozwala to pojazdom pokonywać błoto, śnieg, wodę i gruz z mniejszym kontaktem z podłożem, co poprawia mobilność i elastyczność rozmieszczenia, a jednocześnie wprowadza nowe wymagania dotyczące zasilania i konserwacji."
 sp_magneto_explosive_munition: "Magnetohydrodynamiczna amunicja wybuchowa"
 sp_magneto_explosive_munition_desc: "Pojazdy silnie opancerzone wciąż stymulują rozwój coraz bardziej zaawansowanej broni przeciwpancernej. Badając amunicję wykorzystującą zjawiska magnetohydrodynamiczne i energię wybuchu, dążymy do zwiększenia zdolności przebijania pancerza oraz siły rażenia naszych pocisków kierowanych."
 sp_drone_torpedoes: "Torpedy dronowe"
 sp_drone_torpedoes_desc: "Wojna morska gwałtownie ewoluuje, a tradycyjne torpedy przestają wystarczać w obliczu współczesnych zagrożeń. Inwestując w systemy torpedowe przenoszone przez drony, dążymy do zwiększenia naszego potencjału uderzeniowego w działaniach podwodnych. Nowe torpedy są zdolne do autonomicznego śledzenia celów i adaptacyjnego prowadzenia walki, co pozwala naszym flotom zachować inicjatywę w operacjach zwalczania okrętów podwodnych oraz innych działaniach na morzu."
 sp_anti_drone_laser_modules: "Laserowe moduły do ​​zwalczania dronów"
 sp_anti_drone_laser_modules_desc: "Rosnące wykorzystanie dronów i precyzyjnej amunicji kierowanej na morzu wymusza rewizję podejścia do obrony przeciwlotniczej okrętów. Dzięki integracji laserowych systemów zwalczania dronów z naszymi jednostkami pływającymi możemy reagować na te zagrożenia z szybkością i precyzją, którym nie dorównuje uzbrojenie konwencjonalne."
 sp_mineclearing_drone: "Systemy usuwania min z wykorzystaniem dronów"
 sp_mineclearing_drone_desc: "Miny morskie pozostają jednym z najbardziej uporczywych i opłacalnych pod względem kosztów zagrożeń dla operacji morskich. Przeniesienie zadań związanych ze zwalczaniem zagrożenia minowego na bezzałogowe systemy pozwala ograniczyć ryzyko dla załóg, a jednocześnie zwiększyć szybkość i zasięg działań polegających na oczyszczaniu akwenów."
 sp_naval_recon_drone: "Morskie drony rozpoznawcze"
 sp_naval_recon_drone_desc: "Utrzymanie świadomości sytuacyjnej na morzu staje się coraz bardziej złożonym wyzwaniem w miarę, jak akweny działań morskich stają się coraz bardziej zatłoczone i strefami rywalizacji. Dzięki inwestycjom w specjalistyczne morskie drony rozpoznawcze rozszerzamy zasięg naszego dozoru poza ograniczenia platform załogowych. Systemy te umożliwiają naszym flotom wcześniejsze wykrywanie i śledzenie zagrożeń oraz reagowanie na nie, co przekłada się na bardziej świadome decyzje dowódcze i większą elastyczność operacyjną."
 sp_drone_submarine: "Dron podwodny"
 sp_drone_submarine_desc: "Wojna podwodna ewoluuje w kierunku uporczywości i zaprzeczania, a nie samej siły ognia. Dzięki rozwojowi bezzałogowych platform podwodnych możemy utrzymywać ciągłą obecność pod wodą bez narażania załóg ani cennych zasobów. Te bezzałogowe okręty podwodne pozwalają nam monitorować, zakłócać i prowadzić walkę na kluczowych obszarach morskich, działając poniżej progu konwencjonalnej eskalacji."
 sp_modern_sail_ships: "Nowoczesne statki wspomagane żaglami"
 sp_modern_sail_ships_desc: "Rosnące zapotrzebowanie na energię oraz wydłużone linie logistyczne sił morskich wymuszają rewizję zasad funkcjonowania naszych flot wsparcia. Dzięki ponownemu wprowadzeniu nowoczesnych jednostek wspomaganych żaglami możemy ograniczyć zużycie paliwa, zachowując jednocześnie niezawodność operacyjną."
 sp_drone_patrol_boat: "Patrolowe łodzie bezzałogowe"
 sp_drone_patrol_boat_desc: "Zadania związane z ochroną wybrzeża i patrolami morskimi są coraz bardziej obciążone ze względu na ograniczone zasoby kadrowe i rosnące wymogi operacyjne. Dzięki wykorzystaniu bezzałogowych łodzi patrolowych możemy utrzymać stałą obecność w kluczowych strefach przybrzeżnych i litoralnych bez konieczności angażowania większych okrętów wojennych. Platformy te pozwalają nam skuteczniej i elastyczniej monitorować zagrożenia o niskim natężeniu, odstraszać potencjalnych sprawców oraz reagować na takie sytuacje."
 sp_drone_corvette: "Korwety dronowe"
 sp_drone_corvette_desc: "W miarę jak starcia morskie stają się coraz bardziej rozproszone i obarczone większym ryzykiem, na nowo rozważa się rolę mniejszych nawodnych okrętów bojowych. Inwestując w bezzałogowe lub opcjonalnie załogowe platformy klasy korweta, możemy demonstrować siłę i utrzymywać kontrolę nad akwenami bez narażania załóg na niepotrzebne niebezpieczeństwo."
 sp_rail_gun_naval_battery: "Morska bateria dział elektromagnetycznych"
 sp_rail_gun_naval_battery_desc: "O ile wczesne koncepcje dział elektromagnetycznych koncentrowały się na pojedynczych strzałach o dużej sile rażenia, o tyle zmieniająca się charakterystyka walki morskiej wymaga prowadzenia ciągłego i elastycznego ognia. Opracowując wielolufową baterię dział elektromagnetycznych, przechodzimy w stronę wyższej szybkostrzelności i skuteczniejszego pokrycia celu ogniem."
 sp_nuclear_torpedoes: "Torpedy jądrowe"
 sp_nuclear_torpedoes_desc: "W miarę jak odstraszanie morskie przesuwa się w kierunku dominacji podmorskiej, same konwencjonalne ładunki mogą okazać się niewystarczające. Opracowując torpedy uzbrojone w głowice jądrowe, wprowadzamy broń zdolną do blokowania rozległych obszarów morskich i skutecznego zwalczania ważnych formacji morskich."
 sp_fusion_reactor_engine: "Silnik reaktora fuzyjnego"
 sp_fusion_reactor_engine_desc: "Rosnące zapotrzebowanie na energię w nowoczesnych systemach okrętowych sprawia, że ​​konwencjonalne układy napędowe i systemy wytwarzania energii osiągają granice swoich możliwości. Inwestując w okrętowe reaktory termojądrowe, dążymy do zapewnienia zasilania dla zaawansowanych systemów uzbrojenia, sensorów i napędu bez uszczerbku dla autonomii operacyjnej jednostek. Projekt ten stanowi fundament pod nową generację wysokoenergetycznych platform morskich, gwarantując długofalową przewagę operacyjną na morzu."
 sp_naval_swarm_module: "Systemy startowe morskich rojów dronów"
 sp_naval_swarm_module_desc: "Dzięki integracji modułowych systemów startowych na pokładach jednostek nawodnych, platformy morskie zyskują zdolność do rozmieszczania znacznej liczby autonomicznych dronów, przeznaczonych do zadań rozpoznawczych, walki elektronicznej oraz misji uderzeniowych. Systemy te, działające w układzie roju, zwiększają zasięg sensorów okrętu, pozwalają przełamać obronę przeciwnika i umożliwiają elastyczne projekcję siły bez narażania samej jednostki macierzystej na bezpośrednie starcie."
 sp_radar_jamming_module: "Morskie systemy zakłócania radarów"
 sp_radar_jamming_module_desc: "Dzięki wykorzystaniu zaawansowanych systemów walki elektronicznej, zaprojektowanych do zakłócania i osłabiania działania wrogich systemów radiolokacyjnych, okręty nawodne mogą maskować swoje rzeczywiste położenie i ruchy na morzu. Systemy te zakłócają procesy wykrywania celów i kierowania ogniem, ograniczając skuteczność sensorów przeciwnika oraz zwiększając szanse na przetrwanie podczas starć morskich."
 sp_anti_torpedo_module: "Okrętowe systemy przeciwtorpedowe"
 sp_anti_torpedo_module_desc: "Dzięki zastosowaniu specjalistycznych systemów obrony przeciwtorpedowej, zaprojektowanych do wykrywania, klasyfikowania i neutralizowania nadciągających zagrożeń podwodnych, okręty nawodne mogą ograniczyć ryzyko stwarzane przez nowoczesne torpedy podczas przemieszczania się oraz działań bojowych. Systemy te łączą szybkie śledzenie sonarowe, automatyczne użycie środków przeciwdziałania oraz rozwiązania umożliwiające przechwycenie celu, co pozwala zakłócić naprowadzanie i zneutralizować torpedy przed ich uderzeniem w okręt, zwiększając tym samym szanse na przetrwanie w rejonach działań o wysokim stopniu zagrożenia."
 sp_anti_ship_drone_missile: "Przeciwokrętowe pociski dronowe"
 sp_anti_ship_drone_missile_desc: "Zdolności do prowadzenia uderzeń morskich są w coraz większym stopniu determinowane przez zasięg, precyzję oraz zdolność do przetrwania. Dzięki opracowaniu systemów przeciwokrętowych pocisków rakietowych przenoszonych przez bezzałogowce możemy zwiększyć nasze możliwości zagrażania wrogim jednostkom, ograniczając jednocześnie ryzyko dla załogowych statków powietrznych."
 sp_hover_helicopter_engine: "Silniki śmigłowcowe z funkcją zawisu"
 sp_hover_helicopter_engine_desc: "Środowiska zurbanizowane i ograniczona przestrzeń operacyjna stawiają nowe wymagania przed lotnictwem śmigłowcowym. Opracowując układy napędowe umożliwiające zawis, dążymy do poprawy stabilności przy niskich prędkościach oraz precyzji sterowania w pionie podczas złożonych operacji."
 sp_hypersonic_engine: "Hipersoniczne układy napędowe"
 sp_hypersonic_engine_desc: "O panowaniu w powietrzu w coraz większym stopniu decydują prędkość, zasięg oraz zdolność do przenikania w chronioną przestrzeń powietrzną. Inwestując w hipersoniczne układy napędowe, dążymy do wyjścia poza granice osiągów konwencjonalnych statków powietrznych."
 sp_awacs_project: "Powietrzny system wczesnego ostrzegania i dowodzenia"
 sp_awacs_project_desc: "Wraz ze wzrostem złożoności współczesnych operacji lotniczych, systemy ostrzegania i kontroli w powietrzu stały się kluczową zdolnością zaawansowanych sił powietrznych. Dzieje się tak dzięki montowaniu potężnych anten radarowych i systemów dowodzenia na platformach samolotów o długim czasie lotu."
 sp_fiber_drones: "Dron sterowany światłowodem"
 sp_fiber_drones_desc: "Wraz z dynamicznym rozwojem systemów bezzałogowych i walki elektronicznej, drony sterowane za pomocą światłowodu stały się rozwiązaniem pozwalającym przeciwdziałać zagłuszaniu i zakłóceniom sygnału. Dzięki przesyłaniu sygnałów sterujących fizycznym łączem światłowodowym zamiast drogą radiową, maszyny te mogą niezawodnie operować w środowisku o wysokim stopniu zagrożenia, zachowując jednocześnie precyzyjną kontrolę nad przenoszonym ładunkiem."
 sp_air_railguns: "Powietrzne działo elektromagnetyczne"
 sp_air_railguns_desc: "W związku z nieustannym dążeniem do uzyskania większych prędkości rażenia i zwiększonego zasięgu przechwytywania, jako alternatywę dla konwencjonalnych systemów rakietowych zaproponowano powietrzne działa elektromagnetyczne (typu railgun)."
 sp_air_railguns_helicopter: "Śmigłowcowe działo elektromagnetyczne"
 sp_air_railguns_helicopter_desc: "Dzięki integracji kompaktowych dział elektromagnetycznych z platformami wirującymi śmigłowce mogą prowadzić ogień o ekstremalnie dużej prędkości, zdolny do przebijania wzmocnionych celów, do których normalnie potrzebne byłyby cięższe samoloty lub systemy naziemne"
 sp_space_artillery: "Orbitalne wsparcie ogniowe"
 sp_space_artillery_desc: "Wraz z rosnącą integracją systemów kosmicznych z działaniami zbrojnymi współczesnych konfliktów, pojawiła się koncepcja orbitalnego wsparcia ogniowego jako sposobu na przeprowadzanie precyzyjnych uderzeń z przestrzeni kosmicznej w cele naziemne."
 sp_air_pdl: "Lasery obrony punktowej"
 sp_air_pdl_desc: "W obliczu rosnącego zagrożenia ze strony szybkich pocisków i ataków nasycających, pokładowe systemy laserowe punktowej obrony powietrznej umożliwiają przechwytywanie nadlatujących celów z prędkością światła. Dzięki instalacji laserów dużej mocy na platformach powietrznych broń ta może zwalczać i neutralizować pociski w locie, co ogranicza zależność od ograniczonych zapasów rakiet przechwytujących i zwiększa szanse na przetrwanie w przestrzeni powietrznej, w której toczą się działania bojowe."
 sp_air_helicopter_drone_control: "Sterowanie dronem śmigłowcowym"
 sp_air_helicopter_drone_control_desc: "Integracja pełnej architektury sterowania dronami z platformami wirnikowymi przekształca śmigłowce w powietrzne węzły dowodzenia bezzałogowymi środkami rozpoznawczymi i uderzeniowymi. Takie podejście ogranicza konieczność narażania załóg podczas rutynowych zadań wiążących się z ekspozycją na zagrożenia, a jednocześnie poprawia koordynację, wskazywanie celów i tempo działań na polu walki. Wdrożenie tego rozwiązania wiąże się jednak z wysokimi kosztami, gdyż wymaga zastosowania zaawansowanej awioniki i bezpiecznych systemów transmisji danych, a także zapewnia dodatkowej mocy zasilania oraz wydajniejszych układów chłodzenia."
 sp_air_gunship_railcannons: "Działa szynowe samolotów wsparcia"
 sp_air_gunship_railcannons_desc: "W ramach tego projektu na specjalnie przystosowanych kadłubach maszyn typu gunship montuje się baterie potężnych dział elektromagnetycznych, tworząc statek powietrzny zdolny do niszczenia celów zmasowanym ostrzałem. Dzięki ogromnej prędkości wylotowej pocisków i precyzyjnemu systemowi kierowania ogniem, maszyna ta potrafi eliminować drony, statki powietrzne oraz formacje naziemne szybciej, niż konwencjonalne uzbrojenie jest w stanie zareagować. Rozwiązanie to wiąże się jednak z ogromnymi kosztami, gdyż utrzymanie systemu w stanie gotowości bojowej wymaga wyjątkowej wydajności energetycznej, zaawansowanych układów chłodzenia oraz materiałów najwyższej klasy."
 sp_deep_sea_mining: "Górnictwo głębinowe"
 sp_deep_sea_mining_desc: "Rosnące wymagania przemysłowe i technologiczne wywierają coraz większą presję na tradycyjne łańcuchy dostaw surowców. Inwestując w możliwości wydobycia głębinowego, dążymy do zapewnienia dostępu do kluczowych minerałów zlokalizowanych poza konwencjonalnymi strefami wydobywczymi."
 sp_agriculture_drone: "Rolnicze systemy dronowe"
 sp_agriculture_drone_desc: "Wyżywienie rosnącej populacji przy jednoczesnym zachowaniu efektywności staje się kluczowym wyzwaniem strategicznym. Dzięki wprowadzeniu zaawansowanych systemów dronów rolniczych możemy zmodernizować praktyki rolnicze poprzez usprawnienie monitoringu, precyzyjne zabiegi oraz automatyzację."
 sp_vertical_farming: "Rolnictwo wertykalne"
 sp_vertical_farming_desc: "Urbanizacja i niedobór gruntów wymuszają zmianę podejścia do produkcji żywności. Inwestując w rolnictwo wertykalne, przenosimy produkcję rolną do kontrolowanych środowisk o wysokim zagęszczeniu upraw, które są w mniejszym stopniu uzależnione od warunków pogodowych i geograficznych."
 sp_robotic_humanoid: "Domowe roboty asystujące"
 sp_robotic_humanoid_desc: "W miarę jak życie codzienne staje się coraz bardziej nasycone technologią, rośnie potencjał wykorzystania robotów humanoidalnych do wspierania ludzi w ich domach. Tworząc domowe roboty-asystentów, dążymy do wsparcia w codziennych czynnościach, takich jak utrzymanie domu, opieka nad domownikami oraz osobista pomoc."
 sp_robotic_surgery: "Chirurgia robotowa"
 sp_robotic_surgery_desc: "Systemy medyczne stoją w obliczu rosnącej presji ze strony starzejącego się społeczeństwa i rosnących potrzeb w zakresie opieki zdrowotnej. Rozszerzając wykorzystanie chirurgii wspomaganej robotem, dążymy do poprawy precyzji, skrócenia czasu rekonwalescencji i zwiększenia dostępności zaawansowanych procedur."
 sp_smart_grid: "Infrastruktura inteligentnych sieci elektroenergetycznych"
 sp_smart_grid_desc: "Rosnące zużycie energii oraz wdrażanie zaawansowanych technologii stawiają nowe wymagania przed krajowymi sieciami elektroenergetycznymi. Inwestując w infrastrukturę inteligentnych sieci (smart grid), możemy skuteczniej zarządzać dystrybucją energii elektrycznej, równoważyć podaż i popyt oraz ograniczać nieefektywności systemowe."
 sp_equipment_recycling: "Program recyklingu sprzętu wojskowego"
 sp_equipment_recycling_desc: "Kompleksowy program odzyskiwania, regeneracji i recyklingu wycofanego z eksploatacji lub uszkodzonego sprzętu wojskowego. Dzięki odzyskiwaniu kluczowych materiałów i podzespołów z wycofanych platform siły zbrojne mogą zmniejszyć obciążenie przemysłu, zwiększyć odporność łańcuchów dostaw oraz częściowo zrekompensować straty produkcyjne w trakcie długotrwałych konfliktów."
 sp_epigenetic_reprogramming: "Reprogramowanie epigenetyczne"
 sp_epigenetic_reprogramming_desc: "Program badań biomedycznych koncentrujący się na zmianie ekspresji genów bez modyfikacji sekwencji DNA, mający na celu zwiększenie wytrzymałości fizycznej, sprawności poznawczej oraz tempa regeneracji personelu wojskowego. Choć program ten może przynieść długoterminowe korzyści w zakresie efektywności szkolenia i gotowości bojowej, budzi on obawy natury etycznej i wymaga ścisłego nadzoru regulacyjnego."
 sp_nuclear_energy: "Reaktor energii jądrowej"
 sp_nuclear_energy_desc: "Reaktory jądrowe nadają się do wytwarzania materiałów na bomby. Jednak wytwarzana przez nie energia mogłaby zamiast tego zasilać przemysł cywilny i wojskowy."
 sp_nuclear_bomb: "Projekt bomby rozszczepieniowej"
 sp_nuclear_bomb_desc: "Bomba wykorzystująca proces rozszczepienia jądrowego, by w jednej apokaliptycznej chwili uwolnić zgromadzoną energię atomu. Kto odważyłby się nam sprzeciwić, mając taką broń w naszym arsenale?"
 sp_amws_combat_system: "System walki AMWS-21"
 sp_zamws_advanced_mws: "XAMWS-24 Zaawansowany system uzbrojenia wielozadaniowego"
 sp_xciws_close_in_weapon_system: "System uzbrojenia bliskiego zasięgu XCIWS-2B"
 sp_close_range_battle_halberd: "Halabarda bojowa bliskiego zasięgu Typ-77"
 sp_great_sword: "Wielki miecz BWS-3"
 special_project_consumer_costs_high: "Pozyskiwanie zasobów w tajemnicy"
 special_project_consumer_costs_high_desc: "Przyciszone głosy szepczą o ogromnych ilościach zaopatrzenia, które rząd kieruje do pozornie niepozornych miejsc. Niektórzy sugerują, że zasoby te są zużywane w ramach tajnych projektów badawczo-rozwojowych, jednak brakuje na to konkretnych dowodów..."
 special_project_consumer_costs_medium: "Pozyskiwanie zasobów w tajemnicy"
 special_project_consumer_costs_medium_desc: "$special_project_consumer_costs_high_desc$"
 special_project_consumer_costs_low: "Pozyskiwanie zasobów w tajemnicy"
 special_project_consumer_costs_low_desc: "$special_project_consumer_costs_high_desc$"
 sp_tag_eh_portal_research: "Projekty badawcze portalu"
 sp_tag_eh_mech_research: "Projekty badawcze nad mechami"
 sp_tag_eh_portal_research_speed_factor: "$sp_tag_eh_portal_research$ Prędkość"
 sp_tag_eh_mech_research_speed_factor: "$sp_tag_eh_mech_research$ Prędkość"
 sp_biofuel_e10_blend: "Mieszanie etanolu w paliwie E10"
 sp_biofuel_e10_blend_desc: "Mieszanie etanolu z paliwem ropopochodnym w stężeniu 10% to sprawdzona i komercyjnie wdrożona technologia, stosowana w miliardach pojazdów na całym świecie. Standaryzacja infrastruktury do produkcji paliwa E10 ogranicza zależność od importowanych paliw kopalnych, pozwala wykorzystać nadwyżki rolne w miksie energetycznym oraz wymaga jedynie niewielkich modyfikacji istniejących sieci rafineryjnych i dystrybucyjnych."
 sp_biofuel_flexfuel_butanol: "Synteza paliw typu FlexFuel i butanolu"
 sp_biofuel_flexfuel_butanol_desc: "Opierając się na standaryzowanym mieszaniu etanolu, program ten podąża dwoma równoległymi ścieżkami. Silniki o elastycznym paliwie tolerują E85 i podobne mieszanki o wysokiej zawartości etanolu, oddzielając kompatybilność pojazdu od proporcji mieszanki. Biobutanol oferuje wyższą gęstość energetyczną i wydajność zimnego rozruchu zbliżoną do benzyny, ale skala produkcji pozostaje nierozwiązanym problemem inżynieryjnym. Udany program zapewniłby naszemu sektorowi rafineryjnemu przewagę nad rynkiem globalnym."
 sp_nuclear_bomb_tt: "Odblokowanie możliwości budowy §Y bomb nuklearnych §!"
 sp_caterpillar_3512b: "Silnik wysokoprężny Caterpillar 3512B"
 sp_caterpillar_3512b_desc: "Caterpillar 3512B to wydajny i niezawodny silnik wysokoprężny, szeroko stosowany w różnorodnych zastosowaniach, w tym w jednostkach pływających, energetyce oraz maszynach ciężkich. Jego solidna konstrukcja i wysokie osiągi czynią go idealnym wyborem do zasilania urządzeń pracujących w trudnych warunkach Antarktydy."
 sp_premium_living_quarters: "Wysokiej klasy pomieszczenia mieszkalne"
 sp_premium_living_quarters_desc: "Te wysokiej klasy pomieszczenia mieszkalne zapewniają personelowi stacjonującemu na Antarktydzie wyższy komfort i lepsze udogodnienia, co przekłada się na większe zadowolenie oraz efektywność pracy stacji."
 sp_drone_surface_combatant: "Autonomiczne nawodne okręty bojowe"
 sp_drone_surface_combatant_desc: "W miarę jak rekrutacja i utrzymanie załóg staje się coraz trudniejsze, większe jednostki nawodne są przeprojektowywane w oparciu o automatyzację. Opcjonalnie załogowe fregaty i niszczyciele pozwalają nam utrzymać obecność na pełnym morzu przy ułamku siły roboczej, akceptując większe zapotrzebowanie na zaawansowaną elektronikę."
 sp_space_program: "Program kosmiczny"
 sp_space_program_desc: "Wszyscy chcą polecieć w kosmos, z wyjątkiem Polski. Polska nie może w kosmos."
 sp_space_weapons_desc: "To, co niegdyś było domeną science fiction, staje się rzeczywistością: nasi naukowcy rozpoczęli wreszcie prace nad satelitami bojowymi (tzw. KILLSAT-ami) oraz innym uzbrojeniem przystosowanym do działania w próżni kosmicznej. Zdolność do wykorzystania tego typu broni nie tylko wzmocni nasz potencjał obronny, ale także zwiększy nasze możliwości ofensywne, pozwalając nam przechwytywać i zakłócać działania wrogich sił w przestrzeni kosmicznej oraz im przeciwdziałać."
 sp_CNRP: "Polimer wzmocniony nanorurkami węglowymi"
 sp_CNRP_desc: "Osadzanie kratownic z nanorurek węglowych w kompozytach lotniczych pozwala uzyskać materiały płatowców mocniejsze i lżejsze niż konwencjonalne włókna węglowe. Oszczędność masy przekłada się bezpośrednio na większy zasięg, ładowność i wytrzymałość konstrukcji."
