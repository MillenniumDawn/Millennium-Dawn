 GRAND_DOCTRINE_INTEGRATED_AIR_WARFARE_DESC: "Эта масштабная доктрина структурирует военно-воздушные силы таким образом, чтобы объединять операции по завоеванию превосходства в воздухе с ударными и тяжёлыми бомбардировочными средствами в непосредственной поддержке наземных сил. Концепции интегрированной воздушной войны делают упор на зачистку воздушного пространства противника для обеспечения длительной непосредственной авиационной поддержки и выполнения задач по нанесению ударов по наземным целям."
