 print_money_button_tooltip: "§YImprimer de la monnaie§!\n§gLe gouvernement a connu des temps difficiles et doit rapidement lever des fonds. Plutôt que de recourir à la fiscalité ou à l'achat d'obligations, nous pouvons émettre de l'argent pour y faire face.§!\n\nCependant, cela diminuera la productivité de votre peuple, car sa production sera dévaluée par rapport à la mesure à l'origine de l'inflation. La baisse de productivité s'aggrave à chaque impression, mais ne s'améliore que lentement chaque année.\n\n§YNombres d'impresssions:§! [?printing_money_var|0Y]\n\n§YPrérequis:§!\n[!print_money_button_click_enabled]\n§YEffets:§!\n[!print_money_button_click]"
