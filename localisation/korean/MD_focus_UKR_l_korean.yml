 UKR_develop_t84u: "§YT-84U '오플로트'§! 개발"
 UKR_develop_t84u_desc: "§WT-84U '오플로트'는 T-84 전차를 기반으로 O. O. 모로조프 명칭 하르키우 설계국이 개발한 우크라이나의 3세대 주력 전차입니다.\n이 전차는 전기 슬래그 재용해로 만든 전면 압연 지붕의 새 용접-압연 포탑을 받았으며, 이로 인해 강도와 생존성이 더 높습니다.\n포탑 형상이 더 단순해진 덕분에 다층 장갑을 성공적으로 배치할 수 있었습니다. 내부 용적도 늘어났습니다.\n포탑 전면 투영면에는 우크라이나제 3세대 동적 방호 '니즈'가 배치되었습니다.\n우크라이나제 동적 및 능동 방호 체계, 외국제 조준 장치, 확대된 측면 스크린을 갖추었습니다.§!"
 UKR_develop_yatahan: "§YT-84-120 '야타한'§! 개발"
 UKR_develop_yatahan_desc: "§WT-84-120 '야타한'은 O. O. 모로조프 명칭 하르키우 설계국이 개발한, 통상의 125mm 포 대신 NATO 표준에 맞춘 120mm 포를 갖춘 T-84U '오플로트' 전차의 형식입니다.\n이 전차는 120mm 구경 NATO 탄약을 사용하는 120mm KBM2 포를 갖추고 있습니다.\n회전식 자동 장전 장치(원래는 프랑스제, 이후 우크라이나제)는 포탑 후방부에 위치합니다.\n새로운 140mm '바히라' 포를 설치하는 것도 가능합니다.\n우크라이나산 부품으로 조립되었으나 외국산 부품과도 완전히 호환됩니다.§!"
 UKR_develop_bahira: "§YT-84-140 '바히라'§! 개발"
 UKR_develop_bahira_desc: "§WT-84-140 '바히라'는 O. O. 모로조프 명칭 하르키우 설계국이 개발한 140mm '바히라' 포를 갖출 예정인 T-84-120 '야타한' 전차의 제안 형식입니다.\n회전식 자동 장전 장치는 포탑 후방부에 위치합니다.\n우크라이나산 부품으로 조립되었으나 외국산 부품과도 완전히 호환됩니다.§!"
 UKR_develop_bm_oplot: "§YT-84 'BM 오플로트'§! 개발"
 UKR_develop_bm_oplot_desc: "§WT-84 'BM 오플로트'는 O. O. 모로조프 명칭 하르키우 설계국이 개발한 T-84U '오플로트' 주력 전차의 가장 최신이자 가장 정교한 형식입니다.\n무엇보다 더 발전된 장갑 장착과 새로운 전자 대응 체계 등이 특징입니다.\n눈에 띄는 특징 하나는 새로운 PNK-6 파노라마 전차 조준경입니다.\n\n§G특히 중요한 군사 사업:§! 완료되면 §Y최고라다§!가 더 높은 군사 예산을 승인할 의향이 커질 것입니다.§!"
 UKR_develop_bastion: "§YT-84 '바스티온'§! 개발"
 UKR_develop_bastion_desc: "§WT-84 '바스티온'은 이 전차에서 러시아제 부품을 제거할 것이라고 알려진 현대화 사업입니다.\n2009년에 채택된 T-84 'BM 오플로트' 형식에는 전기 장비의 개별 부품, 블록과 체계의 구성품 등 러시아산 구성품과 소재가 일정 수 포함되어 있었습니다.\n그 수는 비교적 적다고 알려졌으나 모두 완전히 교체되어야 합니다.\n부품 기반이 러시아산 구성품을 없애는 데 그치지 않고 크게 현대화되도록 계획되었습니다.§!"
 UKR_develop_t84u_flag: "완료된 결정: §YT-84U '오플로트' 개발§!"
 UKR_develop_t84_yatahan_flag: "완료된 결정: §YT-84-120 '야타한' 개발§!"
 UKR_develop_bm_oplot_flag: "완료된 결정: §YT-84 'BM 오플로트' 개발§!"
 UKR_develop_donets_spaa: "§Y'도네츠'§! 자주 대공 체계 개발"
 UKR_develop_donets_spaa_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_donets_spaa_for_tooltip\n\n\n\n\n\n\n\n\n§W'도네츠'는 하르키우의 말리셰프 전차 공장이 개발한 자주 대공 미사일·포 복합 체계로, 주로 수출용으로 의도되었습니다.\n'도네츠'는 소련제 ZSU-23-4 '실카'의 개량 포탑과 T-80UD/T-84 주력전차 차체를 결합한 것입니다.\n포탑 양측에는 '스트렐라-10M' 방공 체계의 미사일을 담은 쌍발 수송·발사 컨테이너 두 개가 설치됩니다. \n자율 수동 유도 장치를 갖춘 이 미사일은 사거리 4,500m, 고도 3,500m까지의 공중 표적을 타격할 수 있습니다.§!"
