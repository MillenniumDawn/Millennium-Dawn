 UKR_bureau_open_desc: "Выносит расходы на §Yбюрократию§! на повестку дня §YВерховной Рады§!. Пока идут дебаты, мы можем запросить §Rувеличение§! или §Gсокращение§! бюджета. Рассмотрение запроса занимает §Y30§! дней, после чего депутаты голосуют. Шанс одобрения зависит от того, сколько мест в Раде нас поддерживает и насколько велико наше влияние на неё. Бонусы от наших реформ повышают готовность депутатов одобрить §Gсокращение§! бюджета."
 UKR_bureau_close_desc: "Снимает расходы на §Yбюрократию§! с повестки дня §YВерховной Рады§!. Запросы по расходам исчезнут, пока мы снова не откроем дебаты."
 UKR_military_open_desc: "Выносит §Oвоенные§! расходы на повестку дня §YВерховной Рады§!. Пока идут дебаты, мы можем запросить §Rувеличение§! или §Gсокращение§! бюджета. Рассмотрение запроса занимает §Y30§! дней, после чего депутаты голосуют. Шанс одобрения зависит от того, сколько мест в Раде нас поддерживает и насколько велико наше влияние на неё. Бонусы от наших реформ и оборонных проектов повышают готовность депутатов одобрить §Rувеличение§! бюджета."
