 air_defense: "Defensa Aérea"
 air_defense_desc: "La defensa aérea abarca sistemas de armas de superficie, submarinos (lanzados desde submarinos) y aéreos, además de sistemas de sensores asociados, mecanismos de comando y control y medidas pasivas."
 missile_defense: "Defensa de Misiles"
 missile_defense_desc: "La defensa antimisiles es un sistema, arma o tecnología que se utiliza para detectar, rastrear, interceptar y también destruir misiles atacantes. Concebida como defensa contra misiles balísticos intercontinentales (ICBM) con armamento nuclear, su aplicación se ha ampliado para incluir misiles tácticos y de teatro no nucleares de menor alcance."
 nuclear_technology: "Tecnología Nuclear"
 nuclear_technology_desc: "Tecnología Nuclear"
 reactor1: "Magnox"
 reactor1_desc: "Britain's first-generation reactors burn natural uranium in magnesium-alloy cans, cooled by carbon dioxide gas. Simple and robust, they proved that commercial nuclear power worked, but their low power density makes every plant large for its output."
 reactor2: "Reactor de agua a presión"
 reactor2_desc: "Pressurized Water Reactors keep their cooling water under such high pressure that it never boils, passing its heat to a separate steam loop that drives the turbines. The compact, well-understood design became the most widely built reactor in the world."
 reactor3: "Reactor avanzado de agua en ebullición"
 reactor3_desc: "The Advanced Boiling Water Reactor boils water in the core and sends the steam straight to the turbine, with no separate steam generator. Japan's first units, finished in the mid-1990s, were the first Gen III reactors to enter service, with digital controls and pumps built into the reactor vessel."
 reactor4: "AP1000"
 reactor4_desc: "Westinghouse's AP1000 cools its core in an emergency with gravity, natural circulation, and compressed gas, needing no pumps or operator action for 72 hours. Its far smaller count of pumps, pipes, and valves also makes the plant simpler to build and maintain."
 reactor5: "Reactor presurizado europeo"
 reactor5_desc: "The European Pressurized Reactor is built for scale, at around 1,600 MWe per unit. Four independent safety trains and a core catcher beneath the vessel let one plant do the work of several older reactors on a single site."
 reactor6: "Reactores modulares pequeños"
 reactor6_desc: "Small Modular Reactors come off factory lines and ship to site in sections, each unit producing up to about 300 MWe. Standard parts and short build times bring nuclear power within reach of smaller grids and let new units replace coal plants on their old sites."
 reactor7: "Reactor rápido refrigerado por sodio"
 reactor7_desc: "Sodium-cooled Fast Reactors use liquid sodium instead of water and leave their neutrons unslowed, so they breed new fuel from depleted uranium. Burning the long-lived actinides in spent fuel cuts the volume and lifespan of nuclear waste to a fraction of what it was."
 reactor8: "Reactor de sales fundidas"
 reactor8_desc: "Molten Salt Reactors dissolve their fuel in liquid salt that also carries the heat away, at near-atmospheric pressure, and they can burn thorium as well as uranium. Fission products are cleaned from the fuel while the reactor runs, and if the core overheats the salt drains into tanks where the reaction stops on its own."
 reactor9: "DEMO Tokamak"
 reactor9_desc: "DEMO plants succeed ITER as the first tokamaks built to put fusion electricity on the grid. Superconducting magnets hold a deuterium-tritium plasma at over 100 million °C, and a lithium blanket around the vessel breeds the tritium the plant burns. They are vast and slow to build, but they prove that fusion can run a power station."
 reactor10: "Fusion Stellarator"
 reactor10_desc: "Stellarators confine plasma in twisted magnetic coils instead of driving a current through it as a tokamak must. With no plasma current there are no disruptions to damage the vessel, so the plant runs continuously rather than in pulses. Decades of work on machines such as Wendelstein 7-X made the complex coils practical to build at scale."
