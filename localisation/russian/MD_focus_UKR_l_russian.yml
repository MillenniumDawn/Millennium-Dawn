 UKR_develop_t84u: "Разработка §YТ-84У «Оплот»§!"
 UKR_develop_t84u_desc: "§W§YТ-84У «Оплот»§! — [UKR.GetFlag] украинский основной боевой танк третьего поколения, разработанный §LХарьковским конструкторским бюро по машиностроению имени А. А. Морозова§! на базе танка §YТ-84§!.\nТанк получил новую сварно-катаную башню с цельноштампованной крышей из стали электрошлакового переплава, благодаря чему она прочнее и живучее.\nБлагодаря более простой форме башни в ней удалось разместить многослойную броню. Её внутренний объём также увеличен.\nВ лобовой проекции башни размещена новая [UKR.GetFlag] украинская динамическая защита третьего поколения §Y«Нож»§!.\nТанк оснащён [UKR.GetFlag] украинскими динамической и активной защитой, прицельными приборами иностранного производства и увеличенными бортовыми экранами.§!"
 UKR_develop_yatahan: "Разработка §YТ-84-120 «Ятаган»§!"
 UKR_develop_yatahan_desc: "§W§YТ-84-120 «Ятаган»§! — версия танка §YТ-84У «Оплот»§! со 120-мм пушкой стандарта НАТО вместо типовой 125-мм, разработанная §LХарьковским конструкторским бюро по машиностроению имени А. А. Морозова§!.\nТанк оснащён 120-мм пушкой §YКБМ2§!, использующей 120-мм боеприпасы НАТО.\nКарусельный автомат заряжания (сначала [FRA.GetFlag] французский, затем [UKR.GetFlag] украинского производства) расположен в кормовой части башни.\nВозможна установка новой 140-мм пушки §Y«Бахира»§!.\nТанк собирается из [UKR.GetFlag] украинских комплектующих, но полностью совместим и с иностранными.§!"
 UKR_develop_bahira: "Разработка §YТ-84-140 «Багира»§!"
 UKR_develop_bahira_desc: "§W§YТ-84-140 «Бахира»§! — предлагаемая версия танка §YТ-84-120 «Ятаган»§! со 140-мм пушкой §Y«Бахира»§!, разработанная §LХарьковским конструкторским бюро по машиностроению имени А. А. Морозова§!.\nКарусельный автомат заряжания расположен в кормовой части башни.\nТанк собирается из [UKR.GetFlag] украинских комплектующих, но полностью совместим и с иностранными.§!"
 UKR_develop_bm_oplot: "Разработка §YТ-84 «БМ Оплот»§!"
 UKR_develop_bm_oplot_desc: "§W§YТ-84 «БМ Оплот»§! — новейшая и самая совершенная версия ОБТ §YТ-84У «Оплот»§!, разработанная §LХарьковским конструкторским бюро по машиностроению имени А. А. Морозова§!.\nСреди её отличий — более совершенная броня, новые системы радиоэлектронного противодействия и многое другое.\nОдно из заметных отличий — новый панорамный танковый прицел §YПНК-6§!.§!"
 UKR_develop_bastion: "Разработка §YТ-84 «Бастион»§!"
 UKR_develop_bastion_desc: "§W§YТ-84 «Бастион»§! — заявленная программа модернизации, по которой танк избавится от деталей [SOV.GetFlag] российского производства.\nВерсия §YТ-84 «БМ Оплот»§!, принятая на вооружение в 2009 году, содержала определённое количество комплектующих и материалов [SOV.GetFlag] российского происхождения: отдельные элементы электрооборудования, компоненты блоков и систем.\nСообщалось, что их относительно немного, но все они должны быть полностью заменены.\nПланировалось не только избавить элементную базу от [SOV.GetFlag] российских компонентов, но и существенно её модернизировать.§!"
 UKR_develop_t84u_flag: "Выполнено решение §YРазработка Т-84У «Оплот»§!"
 UKR_develop_t84_yatahan_flag: "Выполнено решение §YРазработка Т-84-120 «Ятаган»§!"
 UKR_develop_bm_oplot_flag: "Выполнено решение §YРазработка Т-84 «БМ Оплот»§!"
 UKR_develop_donets_spaa: "Разработать §Y«Донец»§! SPAA system"
 UKR_develop_donets_spaa_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_donets_spaa_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y«Донец»§! — самоходный зенитный ракетно-артиллерийский комплекс, разработанный §LЗаводом имени Малышева§! в Харькове и предназначенный в основном для экспорта.\n§Y«Донец»§! сочетает модернизированную башню §Rсоветской§! §YЗСУ-23-4 «Шилка»§! и шасси ОБТ §YТ-80УД/Т-84§!.\nПо бокам башни установлены два спаренных транспортно-пусковых контейнера с ракетами ЗРК §Y«Стрела-10М»§!.\nРакеты с автономной пассивной системой самонаведения способны поражать воздушные цели на дальности до 4500 м и на высоте до 3500 м.§!"
 UKR_modernize_zsu_23_4m_a1_spaa: "Модернизация §YЗСУ-23-4М-А1 «Рокач»§!"
 UKR_modernize_s125_spaa: "Модернизация §YС-125-2Д§!"
