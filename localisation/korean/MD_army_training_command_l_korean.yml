 MD_artc_army_tt_2: "£army_experience 육군 경험치: §R-650§!\n육군 정신 슬롯에 §Y야전 지속 지원 기준 II§!를 해금합니다:\n장착 중인 경우 §Y야전 지속 지원 기준 I§!을 대체합니다.\n £attrition_texticon  사단 소모: §G-10%§!\n £fuel_consumption_texticon  육군 연료 소비: §G-5%§!"
