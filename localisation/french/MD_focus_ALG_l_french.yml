 ALG_transparent_budget: "Budget transparent"
 ALG_appoint_sellal: "Nommer Abdelmalek Sellal"
 ALG_appoint_sellal_desc: "Technocrate et loyaliste de Bouteflika, Sellal représente la continuité et une gouvernance pragmatique, axée sur la stabilité et la gestion des institutions de l'État."
 ALG_sellal_gets_appointed: "Abdelmalek Sellal a été nommé Premier ministre."
 ALG_sellal_modifiers: "§YEffets de la nomination de Sellal :§!\nDérive démocratique : §G+0.10§!\nCoûts bureaucratiques : §G-10%§!\nRevenus fiscaux : §G+3%§!\nDépenses policières prévues : §R-1§!"
 ALG_appoint_ouyahia: "Nommer Ahmed Ouyahia"
 ALG_appoint_ouyahia_desc: "Ouyahia est un politicien vétéran, réputé pour une austérité sévère et sa loyauté à l'establishment. Son style de direction favorise le contrôle centralisé et la discipline financière."
 ALG_ouyahia_gets_appointed: "Ahmed Ouyahia a été nommé Premier ministre."
 ALG_ouyahia_modifiers: "§YEffets de la nomination de Ouyahia :§!\nDérive démocratique : §G+0.10§!\nCoûts bureaucratiques : §G-10%§!\nRevenus fiscaux : §G+3%§!\nDépenses policières prévues : §R-1§!"
 ALG_appoint_bedoui: "Nommer Noureddine Bedoui"
 ALG_appoint_bedoui_desc: "Bedoui, bureaucrate de carrière et ministre, incarne la loyauté technocratique à la présidence. Son style de gouvernance met l'accent sur l'efficacité administrative et des réformes limitées."
 ALG_bedoui_gets_appointed: "Noureddine Bedoui a été nommé Premier ministre."
 ALG_bedoui_modifiers: "§YEffets de la nomination de Bedoui :§!\nDérive démocratique : §G+0.10§!\nCoûts bureaucratiques : §G-10%§!\nRevenus fiscaux : §G+3%§!\nDépenses policières prévues : §R-1§!"
 ALG_no_pm_set: "§RAucun Premier ministre nommé§!"
 ALG_ahmed_gaid_salah_desc: "Chef d'état-major de l'Armée nationale populaire, Ahmed Gaïd Salah fut un officier de carrière qui gravit les échelons durant la guerre d'indépendance et devint plus tard l'une des figures les plus influentes des affaires militaires et politiques algériennes."
 ALG_smain_lamari_desc: "Chef des services de renseignement et de contre-espionnage algériens, Smaïn Lamari a joué un rôle central dans la « sale guerre » contre les insurgés islamistes durant la Décennie noire."
 ALG_kaidi_mohamed_desc: "Officier respecté, expérimenté dans les formations mécanisées, Kaidi Mohamed s'est spécialisé dans la guerre blindée et la modernisation des forces terrestres algériennes."
 ALG_ahcene_tafer_desc: "Ahcène Tafer était connu pour son commandement des unités mécanisées algériennes et son rôle dans la restructuration de l'armée durant les années d'après-guerre civile."
 ALG_mohammed_larbi_haouli_desc: "Mohammed Larbi Haouli commanda la marine algérienne durant une période de modernisation, équilibrant défense côtière et coopération régionale."
 ALG_ammar_atamnia_desc: "Officier supérieur qui servit comme stratège des forces terrestres algériennes, Ammar Atamnia était connu pour son accent sur la guerre défensive et l'entraînement militaire."
 ALG_mohammed_al_arabi_hawalli_desc: "Mohammed Al-Arabi Hawalli occupa des postes de commandement naval et contribua à la réforme des forces maritimes algériennes."
 ALG_mahmoud_laraba_desc: "Commandant de l'armée de l'air, Mahmoud Laraba fut impliqué dans la formation des pilotes et la réorganisation du réseau de défense aérienne algérien."
 ALG_mohamed_lamari_desc: "Chef d'état-major durant la Décennie noire, Mohamed Lamari fut l'une des figures clés dirigeant les opérations de contre-insurrection de l'Algérie."
 ALG_said_chengriha_desc: "Saïd Chengriha s'est spécialisé dans la guerre blindée et la logistique, gravissant ensuite les échelons jusqu'au commandement des forces terrestres algériennes et finalement au poste de chef d'état-major."
 ALG_ben_ali_ben_ali_desc: "Commandant des unités d'élite algériennes, Ben Ali Ben Ali s'est bâti une réputation de professionnalisme et de discipline au sein de l'infanterie."
 ALG_fatima_zohra_ardjoune_desc: "L'une des premières femmes d'Algérie à atteindre le rang de générale, Fatima Zohra Ardjoune fut médecin militaire et symbole de la modernisation des forces armées."
 ALG_mohamed_mediene_desc: "Connu sous le nom de « Toufik », Mohamed Mediène fut chef du puissant service de renseignement algérien (DRS) de 1990 à 2015, faisant de lui l'une des figures les plus influentes de l'histoire algérienne moderne."
 ALG_abdelmalek_guenaizia_desc: "Abdelmalek Guenaizia servit comme ministre délégué à la Défense puis comme chef d'état-major, jouant un rôle clé dans la modernisation de l'armée algérienne."
 ALG_ahmed_bousteila_desc: "Commandant de la Gendarmerie algérienne, Ahmed Bousteila supervisa la sécurité des zones rurales d'Algérie et la lutte contre la contrebande et le terrorisme."
 ALG_fatima_boudouani_desc: "Première femme promue générale dans l'armée algérienne (2009), Fatima Boudouani représenta une percée dans l'intégration des femmes au sein des forces armées."
 alg_medal_1: "Ordre du 1er novembre"
 alg_medal_1_desc: "Décernée pour une bravoure exceptionnelle dans la défense de la nation."
 alg_medal_2: "Médaille de la libération nationale"
 alg_medal_2_desc: "Commémore les contributions exceptionnelles à la lutte pour l'indépendance de l'Algérie."
 alg_medal_3: "Médaille du mérite militaire"
 alg_medal_3_desc: "Accordée pour l'excellence au commandement et au service."
 alg_medal_4: "Médaille de la vaillance"
 alg_medal_4_desc: "Reconnaît les actes de courage sur le champ de bataille."
 alg_medal_5: "Médaille du service populaire"
 alg_medal_5_desc: "Décernée pour un service désintéressé dans la protection des civils."
 alg_medal_6: "Médaille de l'héritage des martyrs"
 alg_medal_6_desc: "Symbole du sacrifice ultime pour la nation."
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_0: "Sous-lieutenant"
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_1: "Lieutenant"
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_2: "Capitaine"
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_3: "Major"
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_4: "Colonel"
 algeria_intro.1.t: "La République algérienne démocratique et populaire"
 algeria_intro.1.d: "L'Algérie entre dans le XXIe siècle marquée par la sanglante Décennie noire, mais encore debout. L'État a survécu à l'insurrection islamiste, mais les plaies de la guerre civile demeurent profondes. Le président Abdelaziz Bouteflika promet réconciliation et reconstruction, mais les défis à venir sont redoutables : relancer l'économie, réformer l'armée, reconstruire la confiance entre le peuple et l'État, et naviguer entre de puissants partenaires étrangers. L'Algérie consolidera-t-elle la stabilité et s'élèvera-t-elle en puissance régionale, ou retombera-t-elle dans la lutte intérieure ?"
 algeria_intro.1.a: "Une nation meurtrie, mais debout."
 ALG_resistance_window_title: "Mouvement de résistance algérienne"
 ALG_resistance_window_desc: "La nation est ébranlée par des manifestations, des troubles et une résistance généralisés. Le Pouvoir cherche à réprimer la dissidence, mais plus la pression s'applique, plus la résistance se renforce."
 ALG_protester_exhaustion_TT: "§YLes manifestants§! se sont épuisés face aux contre-mesures du gouvernement."
 ALG_deploys_security_TT: "§YL'État déploie d'importantes forces de sécurité pour réprimer les troubles.§!"
 ALG_presidential_decisions_only_one_is_available_TT: "Une seule mesure de répression peut être active à la fois."
 ALG_resistance_movement: "Mouvement Hirak"
 ALG_resistance_movement_desc: "Des manifestations populaires nationales connues sous le nom de Hirak continuent d'exiger la réforme politique, la transparence et la justice sociale à travers l'Algérie."
 ALG_throttle_internet_speeds: "Ordonnance n°24-17 : Réglementation des télécommunications"
 ALG_throttle_internet_speeds_desc: "En vertu de l'ordonnance 24-17, les autorités restreignent l'accès aux plateformes en ligne et aux réseaux sociaux pour perturber les organisateurs du Hirak. Cela limite la coordination des manifestations mais frustre les citoyens et ralentit l'activité économique."
 ALG_nationwide_security_presence: "Opération Faucon du désert : présence de sécurité nationale"
 ALG_fund_pro_government_protests: "Programme de solidarité nationale : initiative « Baraka »"
 ALG_fund_pro_government_protests_desc: "Le gouvernement finance et organise des manifestations pro-régime dans le cadre du projet Baraka pour contrer le mouvement Hirak. Cela peut freiner l'élan de l'opposition mais est coûteux et risque d'enflammer le ressentiment public."
 ALG_deploy_security_kabylia_1: "Déployer des troupes de sécurité en Kabylie"
 ALG_deploy_security_kabylia_1_desc: "La Kabylie est devenue un foyer de troubles. Déployer des forces de sécurité pourra pacifier la région, mais risque d'enflammer davantage le ressentiment local."
 ALG_deploy_security_mzab_1: "Déployer des troupes de sécurité dans la vallée du M'zab"
 ALG_deploy_security_mzab_1_desc: "Les tensions dans la vallée du M'zab se sont aggravées. Envoyer des détachements de sécurité pourra freiner les troubles localement, mais des opérations brutales risquent d'aliéner les communautés et de saper la confiance à long terme."
 ALG_deploy_security_aures_1: "Déployer des troupes de sécurité dans les Aurès"
 ALG_deploy_security_aures_1_desc: "Les hauts plateaux des Aurès sont devenus un point focal des manifestations. Un déploiement de sécurité peut disperser les grands rassemblements, mais pèsera sur la logistique en terrain accidenté et pourra enflammer les griefs régionaux."
 ALG_deploy_security_tamanrasset_1: "Déployer des troupes de sécurité dans la wilaya de Tamanrasset"
 ALG_deploy_security_tamanrasset_1_desc: "Les provinces méridionales de Tamanrasset voient une hausse des troubles. Déployer des forces pourra stabiliser les axes de transport et les installations clés, mais risque de détériorer les relations avec les communautés locales et de perturber le commerce transsaharien."
 ALG_deploy_security_granderg_1: "Déployer des troupes de sécurité dans le Grand Erg Occidental"
 ALG_deploy_security_granderg_1_desc: "Les troubles autour du Grand Erg Occidental ont menacé des peuplements isolés et des infrastructures critiques. Des patrouilles de sécurité peuvent apporter un ordre à court terme, bien que l'environnement hostile rende les opérations durables coûteuses et politiquement sensibles."
 ALG_deploy_security_atlas_1: "Déployer des troupes de sécurité dans les contreforts de l'Atlas"
 ALG_deploy_security_atlas_1_desc: "Les contreforts de l'Atlas ont accueilli des manifestations récurrentes et des actions syndicales. Un déploiement ciblé peut prévenir les mobilisations de masse le long des corridors de transport, mais pourra alimenter le ressentiment parmi les populations rurales."
 ALG_deploy_security_constantinois_1: "Déployer des troupes de sécurité dans le Constantinois"
 ALG_deploy_security_constantinois_1_desc: "Constantine et ses environs connaissent des manifestations fréquentes. Concentrer les moyens de sécurité ici peut protéger les installations gouvernementales et les ports, mais accroît le risque d'affrontements dans des quartiers urbains denses."
 ALG_deploy_security_algerois_1: "Déployer des troupes de sécurité dans l'agglomération d'Alger"
 ALG_deploy_security_algerois_1_desc: "Alger demeure le centre de l'activité du Hirak. Une importante présence sécuritaire peut dissuader les mobilisations de rue et sécuriser les institutions, mais risque une répression visible dans la capitale et de graves retombées politiques."
 ALG_deploy_security_oranais_1: "Déployer des troupes de sécurité à Oran et sur la côte ouest"
 ALG_deploy_security_oranais_1_desc: "La région d'Oran a vu croître des manifestations liées aux réseaux syndicaux et de jeunesse. Déployer des forces peut protéger les ports et pôles économiques, mais pourra perturber le commerce et aggraver les tensions avec les dirigeants locaux."
 ALG_doing_decision: "Fait actuellement appliquer une mesure de répression"
 ALG_doing_decision_y: "Fait actuellement appliquer une mesure de répression"
 ALG_protests_ongoing: "Manifestations à l'échelle nationale en cours"
 ALG_locals_swayed: "Les locaux sont sympathiques aux manifestants"
 ALG_kabylia_fell_recently: "La Kabylie a récemment été pacifiée"
 ALG_oranais_fell_recently: "L'Oranais a récemment été pacifié"
 ALG_algerois_fell_recently: "L'agglomération d'Alger a récemment été pacifiée"
 ALG_constantinois_fell_recently: "Le Constantinois a récemment été pacifié"
 ALG_atlas_fell_recently: "Les contreforts de l'Atlas ont récemment été pacifiés"
 ALG_granderg_fell_recently: "Le Grand Erg occidental a récemment été pacifié"
 ALG_tamanrasset_fell_recently: "La wilaya de Tamanrasset a récemment été pacifiée"
 ALG_aures_fell_recently: "Les hauts plateaux des Aurès ont récemment été pacifiés"
 ALG_mzab_fell_recently: "La vallée du M'zab a récemment été pacifiée"
 ALG_state_falls_TT: "§YCet État§! est tombé sous l'influence des manifestants."
 algerian_events.201.t: "Le Mzab est tombé aux mains des manifestants"
 algerian_events.201.a: "Une autre région s'échappe"
 algerian_events.202.t: "Les Aurès sont tombés aux mains des manifestants"
 algerian_events.202.a: "Les manifestations s'étendent"
 algerian_events.203.t: "Tamanrasset est tombé aux mains des manifestants"
 algerian_events.203.a: "Le sud est instable"
 algerian_events.204.t: "Le Grand Erg Occidental est tombé aux mains des manifestants"
 algerian_events.204.a: "Même le désert se soulève"
 algerian_events.205.t: "L'Atlas algérien est tombé aux mains des manifestants"
 algerian_events.205.a: "Les troubles s'élargissent"
 algerian_events.206.t: "Le Constantinois est tombé aux mains des manifestants"
 algerian_events.206.a: "L'est s'embrase"
 algerian_events.207.t: "La Kabylie est tombée aux mains des manifestants"
 algerian_events.207.a: "La Kabylie se relève"
 algerian_events.208.t: "L'Algérois est tombé aux mains des manifestants"
 algerian_events.208.a: "Le cœur de l'Algérie tremble"
 algerian_events.209.t: "L'Oranais est tombé aux mains des manifestants"
 algerian_events.209.a: "L'ouest est perdu"
 algerian_events.201.d: "Le peuple de la région du Mzab a défié le contrôle du gouvernement et s'est emparé des rues.\nGrief public : [ALG_grievance_text]"
 algerian_events.202.d: "Dans les montagnes des Aurès, les troubles ont débouché sur un défi ouvert.\nGrief public : [ALG_grievance_text]"
 algerian_events.203.d: "Malgré son isolement, Tamanrasset s'est embrasé, le gouvernement perdant le contrôle de la zone.\nGrief public : [ALG_grievance_text]"
 algerian_events.204.d: "Les communautés du désert du Grand Erg Occidental ont rejoint la vague de manifestations.\nGrief public : [ALG_grievance_text]"
 algerian_events.205.d: "La région de l'Atlas, jadis calme, est devenue un foyer de troubles antigouvernementaux.\nGrief public : [ALG_grievance_text]"
 algerian_events.206.d: "Les manifestations à l'est submergent les forces de sécurité locales, et le Constantinois est tombé.\nGrief public : [ALG_grievance_text]"
 algerian_events.207.d: "La Kabylie, avec sa longue tradition de dissidence, est de nouveau en défi ouvert à l'État.\nHumeur kabyle : [ALG_kabyle_satisfaction_text]"
 algerian_events.208.d: "Même la région de la capitale a été ébranlée par des manifestations incontrôlables.\nEmprise militaire : [ALG_army_grip_text]"
 algerian_events.209.d: "À l'ouest, l'Oranais rejoint la vague de troubles qui balaie l'Algérie.\nGrief public : [ALG_grievance_text]"
 algerian_events.200.t: "Manifestations réprimées"
 algerian_events.200.d: "Les forces de sécurité ont réussi à réprimer la dernière vague de manifestations, bien que la colère publique couve sous la surface."
 algerian_events.200.a: "L'ordre est rétabli, pour l'instant."
 algerian_events.2015.t: "La répression se retourne contre elle"
 algerian_events.2015.d: "Les tentatives de réprimer les manifestations n'ont fait qu'alimenter davantage de colère, enhardissant les manifestants et affaiblissant l'autorité du gouvernement."
 algerian_events.2015.a: "La situation s'aggrave."
 algerian_events.2025.t: "Fin des manifestations"
 algerian_events.2025.d: "Après des mois de lutte, la dernière vague de manifestations s'est essoufflée. Les tensions demeurent, mais pour l'heure les rues sont de nouveau calmes."
 algerian_events.2025.a: "Enfin, le calme revient."
 algerian_events.301.t: "Des manifestations à l’échelle nationale éclatent !"
 algerian_events.301.d: "Il semble que nos actions récentes n'aient pas été prises à la légère par le peuple, et des manifestations nationales ont éclaté. Lentement mais sûrement, de plus en plus de gens exigent la démission du gouvernement, bien que nous n'allions nulle part."
 algerian_events.301.a: "Nous aurions dû le voir venir !"
 ALG_khenchela_arms_manufacturer: "Complexe de fabrication d'armement de Khenchela"
 ALG_khenchela_arms_manufacturer_desc: "Une installation publique de la wilaya de Khenchela produisant des armes d'infanterie et de l'équipement pour l'Armée nationale populaire. Établie pour réduire la dépendance aux importations d'armes étrangères et assurer l'autosuffisance en production d'armes légères."
 ALG_seriana_small_arms: "Usine d'armes légères de Seriana"
 ALG_seriana_small_arms_desc: "Située dans l'est de l'Algérie, l'installation de Seriana produit fusils, pistolets et munitions pour les forces de sécurité algériennes. L'usine opère sous la supervision du ministère de la Défense nationale."
 ALG_dgi_missile_systems: "DGI - Direction Générale de l'Industrie Militaire"
 ALG_dgi_missile_systems_desc: "La Direction générale de l'industrie militaire supervise les secteurs de fabrication de défense de l'Algérie, y compris les armes guidées, les systèmes antichars/antiaériens et le développement de l'artillerie. Subordonnée au ministère de la Défense nationale, la DGI coordonne les entreprises d'État et les partenariats militaro-techniques pour assurer l'autonomie stratégique."
 ALG_bcl_armored_development: "BCL - Brigade des Constructions Logistiques"
 ALG_bcl_armored_development_desc: "La Brigade de construction logistique militaire gère l'entretien, les mises à niveau et une production nationale limitée de véhicules blindés. La BCL se spécialise dans la remise à neuf d'équipements de l'ère soviétique et l'adaptation des véhicules aux conditions opérationnelles sahariennes."
 ALG_snvi_vehicle_manufacturer: "SNVI - Société Nationale des Véhicules Industriels"
 ALG_snvi_vehicle_manufacturer_desc: "Constructeur national de véhicules de l'Algérie, établi en 1967. La SNVI produit des camions militaires, des véhicules utilitaires et des véhicules blindés légers par des partenariats avec Mercedes-Benz et d'autres constructeurs, tous les modèles étant adaptés au terrain et au climat nord-africains."
 ALG_enmib_helicopter_unit: "ENMIB - Entreprise Nationale des Matériels et Infrastructures de Base"
 ALG_enmib_helicopter_unit_desc: "Installation algérienne d'entretien et d'assemblage d'hélicoptères, fournissant des services de révision et une production limitée pour l'armée de l'air algérienne. L'ENMIB gère l'assemblage sous licence de modèles d'hélicoptères étrangers."
 ALG_mers_el_kebir_shipyards: "Chantier naval de Mers El-Kébir"
 ALG_mers_el_kebir_shipyards_desc: "Situé au port stratégique de Mers El-Kébir près d'Oran, cet historique chantier naval gère la construction et l'entretien de patrouilleurs et d'embarcations navales légères pour la marine algérienne."
 ALG_el_djazair_naval_industry: "CNAN - Compagnie Nationale Algérienne de Navigation"
 ALG_el_djazair_naval_industry_desc: "Compagnie maritime nationale de l'Algérie, la CNAN opère des chantiers à Alger capables de construire corvettes, frégates et sous-marins avec une assistance technique étrangère. La compagnie gère aussi le transport commercial et la logistique navale."
 ALG_ersa_aircraft_manufacturer: "ERSA - Entreprise de Réparation et de Service Aéronautique"
 ALG_ersa_aircraft_manufacturer_desc: "Principale installation algérienne de maintenance, réparation et révision d'aéronefs. L'ERSA gère un assemblage limité d'appareils sous licence pour l'armée de l'air algérienne et fournit des services techniques aéronautiques complets."
