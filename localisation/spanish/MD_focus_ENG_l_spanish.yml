 ENG_create_new_faction_TT: "Creará una nueva facción: Organización de Seguridad del Atlántico\n\n¡Seremos capaces de derrocar gobiernos extranjeros utilizando a [ADS.GetFlag] Albionis!\n - Obtenemos 3 usos para esta habilidad, y está disponible a través del menú de influencia mediante el botón de golpe de Estado. Aparecerá una opción adicional que te permitirá utilizar a [ADS.GetFlag] Albionis para derrocar a dicho gobierno en Europa, otorgándote un vasallo y aliado."
 ENG_collapse_of_society_TT: "£text_icon_kaldanger ¡Elegir esta opción puede resultar en el derrocamiento del gobierno!\n - Esto nos permitirá realizar los enfoques de §HReino fracturado, Estado unido§!.\n - El ejército intervendrá a partir de cierto punto y se hará cargo del Estado."
 ENG_do_fp_TT: "Ha completado al menos §H3§! enfoques de Política Exterior."
 ENG_core_desc_TT: "Al lograr la hegemonía económica, militar y política, seremos capaces de demostrar a los tres estados principales de la Commonwealth que podemos proveer para ellos y protegerlos. Además, sus territorios constituyentes estarán más inclinados a unirse a nosotros si nuestras condiciones son mejores."
 ENG_econ_hegemony_TT: "'El dinero lo arregla todo'\n\nAl lograr la hegemonía económica, estaremos en una buena posición para integrar otras economías, como las de los estados de la Commonwealth. Para lograr esto necesitamos:\n\nUn PIB mayor que el de los 3 combinados\n- El nuestro es actualmente de $[?gdp_per_capita] (miles)\n- El de ellos es actualmente de $[?commonwealth_total_gdp] (miles)"
 ENG_military_hegemony_TT: "'Un ejército fuerte equivale a un gobierno fuerte'\n\nAl lograr la hegemonía militar, estaremos en una buena posición para demostrar que somos capaces de defender nuestros territorios y a nuestro pueblo. Para lograr esto necesitamos:\n\nMás mano de obra desplegada que los 3 combinados\n- Actualmente tenemos [?ENG.deployed_army_manpower_k] (miles) de tropas desplegadas\n- Ellos tienen actualmente [?commonwealth_total_army] (miles) de tropas desplegadas"
 ENG_political_hegemony_TT: "'Mover los hilos es todo lo que se necesita'\n\nAl lograr la hegemonía política, demostraremos que el gobierno de Westminster es estable, está conectado y en sintonía con personas de todos los ámbitos de la vida. Para lograr esto necesitamos:\n\nUna fuerte esfera de influencia\n- Al menos un 50% de influencia o más en los 3 países"
 ENG_tooltip_TT: "Ha cumplido con todos los requisitos para la hegemonía económica."
 ENG_tooltip2_TT: "Ha cumplido con todos los requisitos para la hegemonía militar."
 ENG_has_met_all_requirements_TT: "Es hegémono en las tres categorías"
 ENG_hold_for_280_TT: "¡Debemos retener nuestra capital durante 280 días!"
 ENG_seize_sierra_leone_TT: "Si [SIE.GetFlag] §HSierra Leona§! sigue siendo prooccidental y está en paz:\n - Seremos capaces de incautar temporalmente sus recursos en §HFreetown§! a través de una decisión."
