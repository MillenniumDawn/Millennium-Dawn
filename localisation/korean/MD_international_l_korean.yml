 counter_terrorism_operations: "대테러 작전"
 counter_terrorism_operations_desc: "테러에 맞선 우리나라의 노력은 집중되어야 합니다. 개인의 자유, 재정, 심지어 생명의 희생이 따를 수 있지만 테러 위협은 막아야 합니다."
 ct_not_has_done_recent_intel_op: "다음 수집 작전까지 §Y[?recent_ct_intel_op:days_left|0Y]일§! 기다려야 합니다."
