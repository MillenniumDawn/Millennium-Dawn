l_russian:
 fiji_influence_defense_through_chaos: "Защита от влияния через хаос"
 fiji_influence_defense_through_chaos_desc: "Фиджи обрели независимость в 1970-х годах, но, к сожалению, эта независимость не принесла того мира и процветания, на которые мы надеялись. Гражданские и военные перевороты, острые этнические напряженности привели к тому, что страна фактически оказалась в состоянии застоя по сравнению с большинством других стран мира. Однако в этом хаосе есть своего рода естественная преграда: зарубежные страны слишком опасаются потерять свои активы в таком небольшом и нестабильном регионе. Поэтому у нас есть более высокая, чем ожидалось, защита от иностранного влияния. Это, безусловно, палка о двух концах, но на данный момент это работает на нашу пользу."
 fiji_militarized_society: "Милитаризованное общество"
 fiji_militarized_society_desc: "Хаос и насилие переворота 2000 года оставили шрам на народе страны. Шрам ненависти и самоуничижения. С этим шрамом новая волна новых поколений вышла, чтобы присоединиться к военным, и таким образом способствовала созданию и популярности Военной хунты как формы руководства. Это привело к пути решимости и долга, где военные — это общество, а общество — это военные."
 fiji_society_of_the_elected_king: "Общество избранного короля"
 fiji_society_of_the_elected_king_desc: "Демонстрация силы и фундаментальная ответственность за защиту нации, ее истории и приверженность поддержанию закона и порядка справедливым образом, многие увидели крайне туманный свет, из которого возник Дом Сувы. Шок для народа Фиджи оставил впечатление, которого не достигало ни одно гражданское правительство с момента обретения независимости. Поэтому многие выразили поддержку и стремятся работать с новой системой, даже если они не полностью согласны с ней."
 fiji_ostracized_commonwealth_member: "Изгнанный член Содружества"
 fiji_ostracized_commonwealth_member_desc: "Хаос в нашей стране поставил нас в напряженные отношения с остальным Содружеством. Хотя мы наслаждаемся дополнительной властью, которую это дает нам на международном уровне, мы, однако, не видим всей реальности вещей из-за накаленного характера нашей внутренней ситуации для иностранных членов. Но мы возьмем то, что сможем получить, по крайней мере."
 fiji_foreign_scientist_imports: "Импорт зарубежных учёных"
 fiji_foreign_scientist_imports_desc: "С помощью некоторых ключевых стимулов мы можем привлечь на Фиджи научные умы, пообещав им бюджет и, скажем, постоянный отпуск вдали от дома."
 fiji_pacific_exchange_and_investment_society: "Комиссия P.I.E.S."
 fiji_pacific_exchange_and_investment_society_desc: "Pacific Investment & Exchange Society — это группа по общественным и международным отношениям. Маскируясь больше под своего рода региональный клуб, мы используем это своего рода общество как способ привлечения инвесторов, а также экспортируем наш собственный след на нашем маленьком куске мирового пирога."
 fiji_depoliticized_military: "Деполитизированная армия"
 fiji_depoliticized_military_desc: "Благодаря слабым переговорам с военными было достигнуто соглашение о разделении военных и гражданского политического органа. Простое, но прочное понимание, которое может открыть дверь для реформ, чтобы лучше спроецировать Фиджи в небольшую, но региональную державу."
 fiji_cohesive_integrations_act: "Закон о сплочённой интеграции"
 fiji_cohesive_integrations_act_desc: "Мы стремимся узнать более широкий мир вокруг нас, мы стремимся к более тесным связям с нашими собратьями. Мы стремимся расширить наши горизонты для улучшения нашего народа и тех, кто также хочет улучшения."
 fiji_independence_sustainment_act: "Закон о поддержании независимости"
 fiji_independence_sustainment_act_desc: "Следуя примеру Америки и стран Ближнего Востока, мы стремимся создать свой собственный дух независимости. Ибо если наша страна будет поглощена махинациями мира, мы в конце концов победим вопреки всем обстоятельствам."
 fiji_importing_ideas_exporting_ideals: "Импорт идей, экспорт идеалов"
 fiji_importing_ideas_exporting_ideals_desc: "Наш остров маленький, но наши амбиции велики. Возможно, мы не сможем кардинально изменить мир, но мы всё равно можем стать важной частью международной политики. Наши исследования и разработки будут эффективными и целенаправленными, что позволит нам быстрее осваивать новые области. Это сделает нашу страну привлекательной для иностранных держав."
 fiji_pieces_for_the_peace: "Мир за миром"
 fiji_pieces_for_the_peace-desc: "С нашей новой обретенной стабильностью мы теперь можем лучше искать помощь и возможности у тех, кто в более широком мире. Хотя нам еще предстоит пройти долгий путь, это, тем не менее, большой шаг вперед, если не сказать больше."
 fiji_the_fijian_dream: "Фиджийская мечта"
 fiji_the_fijian_dream_desc: "У меня есть мечта, и эта мечта — о том, как те, кого отвергли, на кого посмотрели свысока и кого общество полностью бросило, смогут стоять прямо и смотреть на жизнь с надеждой; эти люди смогут сказать, что это не конец, а скорее новое начало. Это может и должно быть достигнуто, и это станет будущим для тех, кто стоит под флагом Фиджи."
 fiji_building_tall_within_something_small: "Построение высокого из малого"
 fiji_building_tall_within_something_small_desc: "Закон о высотном строительстве вводит в заблуждение человека, не имеющего контекста. Этот законопроект законодательно закрепляет мандат базовой формы автоматизации, к которой наше население должно привыкнуть и настроиться. Понимая этот принцип, мы можем строить много на меньшей площади и тем самым делать наш остров более эффективным и, следовательно, более конкурентоспособным на мировой арене."
 fiji_new_foreign_image: "Новый зарубежный имидж"
 fiji_new_foreign_image_desc: "Поскольку наши люди не воюют постоянно, не бегут и не остаются без крова, весь мир вокруг нас начал оборачиваться в знак восхищения. За эти годы на нашем острове произошли реальные перемены, и, как следствие, реальные усилия приносят реальные результаты."
 fiji_foriegn_advisory_board: "Иностранный консультативный совет"
 fiji_foriegn_advisory_board_desc: "FAB, или Иностранный консультативный совет, — это множество гражданских и военных советников, которые укрепят и помогут нашей стране встать на правильный путь. Хотя многие могут задаться вопросом, не подорвет ли это независимость нашей страны от внешних сил. Будьте уверены, мы заранее подумали об этой самой проблеме, поскольку эти иностранные советники на самом деле станут новыми гражданами нашей страны. Благодаря правительственным стимулам и, по сути, выкупу этих людей из их собственных стран, мы можем ожидать небольшого эффекта извне, в то же время укрепляя наши внутренние силы."
 fiji_national_rotc_program: "Национальная программа ROTC"
 fiji_national_rotc_program_desc: "С созданием национальной программы подготовки офицеров резерва в рамках образования страны мы сможем научить будущие поколения нашей нации единству, лидерству, инновациям и командной работе. Влияние на национальную стабильность и общую этику народа и духа нашей нации будет колоссальным."
 fiji_expanded_ministry_of_science: "Расширенное Министерство науки"
 fiji_expanded_ministry_of_science_desc: "С приоритетом в развитии технологий мы можем разместить целый ряд достижений по всему спектру гражданских и военных приложений. Таким образом, несмотря на затраты, мы должны стремиться улучшить наше общее положение, если мы действительно хотим искать будущее нашей нации."
 fiji_citizen_soldiers_amendment: "Поправка о гражданах-солдатах"
 fiji_citizen_soldiers_amendment_desc: "Мы не государство с армией, скорее мы армия с государством. Идеи национализма в прошлом всегда использовались плохими людьми и так далее для достижения личных целей и амбиций. Ну, больше нет. С помощью конституционного указа мы устанавливаем идею того, что такое фиджийский национализм, что значит быть фиджийцем и как можно по-настоящему прожить жизнь, гордясь тем, что живешь такой жизнью."
 fiji_fijian_general_staff: "Генеральный штаб Фиджи"
 fiji_fijian_general_staff_desc: "Военный парламент по сути является одним большим генеральным штабом. Смешивание правительственных и военных дел в единую цепочку командования означает, что планирование и координация военных и гражданских нужд могут осуществляться со скоростью, о которой ни одна из сторон даже не могла мечтать. Но мы должны осознавать роль, которую играет этот Генеральный штаб, ведь легко потерять из виду главное, находясь в окружении такой концентрации власти."
 fiji_research_institute_of_fiji: "Научно-исследовательский институт Фиджи"
 fiji_royal_engineers_program: "Программа королевских инженеров"
 fiji_royal_engineers_program_desc: "Эта ограниченная гибридная программа, которая смешивает гражданские рабочие силы с государственными и, в частности, с военными проектами, является основой для строительства. Это создает контролируемую нижнюю линию, в которой мы можем предотвратить свободное падение наших граждан, поскольку мысли о потере всего могут спровоцировать хаос в сознании и принятии решений многих. Эта программа будет маяком надежды для тех, кто падает, чтобы показать, что мы здесь, чтобы помочь им снова подняться."
 fiji_economic_planning_board: "Совет экономического планирования"
 fiji_economic_planning_board_desc: "EPB — это правительственное крыло экономического роста. В то время как частный сектор все еще может развлекаться, для богобоязненных так называемых «антикоммунистических» проповедников это правительственное министерство своего рода является скорее независимой инвестиционной ветвью. Оно должно помогать направлять и запускать новые правительственные инициативы, которые затем станут частными, как только будет обеспечена стабильность. Короче говоря, EPB начинает что-то, частный сектор продолжает что-то, надеюсь, до бесконечности."
 fiji_pacific_economics_exchange_commission: "Тихоокеанская комиссия"
 fiji_pacific_economics_exchange_commission_desc: "PEEC — это совместное региональное предприятие, призванное расширить наше влияние и сотрудничество со странами в нашем регионе мира. Хотя основное внимание уделяется экономике и политике, побочная работа в виде военных учений позволит получить общую выгоду для всех участников."
 fiji_titles_by_election: "Титулы по выборам"
 fiji_titles_by_election_desc: "Титулы по выборам — это конституционное требование, при котором демократический процесс сохраняется, и люди могут голосовать за то, кто будет их следующим предполагаемым дворянством. Это больше не будет сказкой на ночь, теперь вы действительно можете сказать, что вы тоже можете быть королевой или королем."
 fiji_institute_of_automation: "Фиджийский институт автоматизации"
 fiji_institute_of_automation_desc: "FIA — это фундамент того, что вскоре будет известно как цитата, Программа «Исследовательский рай». Цель состоит в том, чтобы по сути превратить остров в огромный научно-исследовательский и опытно-конструкторский центр и показать миру, что можно иметь как солнце, так и воображение и креативность, чтобы познать неизвестное в самой реальности."
 fiji_institute_of_resource_development: "Фиджийский институт по развитию ресурсов"
 fiji_institute_of_resource_development_desc: "FIRD — ещё один важный этап в развитии программы Research Paradise. Он посвятил своё существование добыче, переработке и синтезу ресурсов с максимально возможной эффективностью. Да, наш остров невелик, но это не значит, что в нашем распоряжении ничего нет. Поэтому этот институт станет ключевым звеном в обеспечении внутренних поставок и способов их наращивания там, где это возможно."
 fiji_institute_of_energy_development: "Институт энергетического развития"
 fiji_institute_of_energy_development_desc: "IED сосредоточится на разработке более эффективных и продуктивных способов производства энергии. Этот департамент также мог бы работать совместно с FIRD для лучшей интеграции нашей энергетической и экономической сплоченности."
 fiji_technocratic_military: "Технократическая армия"
 fiji_technocratic_military_desc: "Хотя наш остров и мал, наши мозги — нет. Благодаря этому пониманию мы можем значительно расширить наши возможности в области исследований и разработок, чтобы укрепить наши вооружённые силы. У нас всё ещё нет экономики, способной производить современную авиацию, но, по крайней мере, мы можем лучше специализировать наши военно-морские и сухопутные силы."
 fiji_research_paradise_program: "Программа \"Научный рай\""
 fiji_research_paradise_program_desc: "Кульминация наших обширных исследовательских усилий создала новый рай для исследований и разработок в целом. Остров был преобразован в рай не только для иностранных отдыхающих, но и для всего научного сообщества. Здесь мы можем координировать как внутренние, так и зарубежные достижения в областях, о которых мы знаем, и в новых областях, которые мы можем даже открыть. Будущее действительно уже наступило."
 fijian_homelessness_crisis: "Кризис бездомных"
 fijian_homelessness_crisis_desc: "Из-за политической нестабильности в стране правительство полностью лишено корректирующих и решительных действий для решения проблемы растущего кризиса бездомности. С началом нового тысячелетия многие задаются вопросом, может ли правительство на самом деле решить эту растущую проблему, которая преследует страну. Тем не менее, время покажет, сможет ли правительство не только позаботиться о стране, но и начать заботиться о себе."
 fijian_emigration_crisis: "Кризис массовой эмиграции"
 fijian_emigration_crisis_desc: "С политической нестабильностью, изменением климата и растущей этнической напряженностью умы, желающие изменить Фиджи, поняли, что лучше покинуть эти маленькие острова. Новое правительство должно заложить основу для лучшего завтра, но сможет ли правительство Фиджи выдержать испытание временем, учитывая все трудности?"
 fijian_military: "Фиджийские военные"
 fijian_military_desc: "На протяжении всей независимости острова фиджийские военные были хорошей силой самообороны. Однако даже при ограниченном участии в иностранных миссиях фиджийские военные не имеют практически никакого опыта. Поскольку остров втягивается в современную эпоху и опасаются все больших политических беспорядков, многие задаются вопросом, сколько еще раз военным придется поддерживать мир."
 fijian_economic_condition: "Фиджийская экономика"
 fijian_economic_condition_desc: "Несмотря на скромное население и территорию, экономика Фиджи хорошо диверсифицирована. Горнодобывающая промышленность преуспевает в добыче таких ресурсов, как медь, золото и серебро. Вторичные отрасли включают производство цемента и судоходство. В целом экономика Фиджи имеет относительно прочную базу для работы, и с наступлением нового тысячелетия правительство должно помочь дальнейшей диверсификации экономики, разветвляясь на новые отрасли, такие как высокие технологии и разработка программного обеспечения."
 fijian_ethnic_tensions: "Индо-фиджийская напряженность"
 fijian_ethnic_tensions_desc: "С момента обретения независимости население острова Фиджи росло довольно умеренными темпами. Однако, обратной стороной этого процесса стало то, что подавляющее большинство мигрантов в страну имеют индийское происхождение. Хотя для многих это не имеет значения, значительная часть этнических фиджийцев воспринимает это как вытеснение и отстранение. На протяжении всей новейшей истории страны, после независимости, эти напряжённости только значительно усилились. Теперь на правительстве Фиджи лежит ответственность за их разрешение, прежде чем произойдут серьёзные последствия..."
 fiji_2000_coups_over: "Возвращение к миру"
 fiji_post_coup_political_shift: "Пристрастия меняются"
 fiji_fast_tracked_military_junta: "§8Долгий марш совершенствования начался§!"
 fiji_fast_tracked_monarchy: "§0Корона силы, делает корону народа§!"
 fiji_2006_coup_avoided: "§PУдалось избежать переворота 2006 года§!"
 fiji_2006_coup_historical: "§lВоенный переворот удался§!"
 fiji_2006_coup_military_junta: "§8Банановый человек упал§!"
 fiji_2006_coup_monarchist_era: "§0Дом Сувы победил§!"
 fiji_2006_coup_technocracy: "§tСовет Технарей захватил власть§!"
 fiji_news.1.t: "Националисты похищают правительственных чиновников"
 fiji_news.1.d: "Ранее сегодня, 19 мая 2000 года, члены про-этнического фиджийского политического движения, известного как i-Taukei, взяли в заложники ключевых членов недавно избранного и в основном этнически индо-фиджийского правительства. Премьер-министр и несколько ключевых правительственных чиновников были взяты в заложники в здании парламента, а члены i-Taukei практически забаррикадировались внутри. Ведутся переговоры по освобождению заложников без потерь человеческих жизней."
 fiji_news.1.o1: "Почему мы должны воевать друг с другом"
 fiji_news.2.t: "Создано временное правительство"
 fiji_news.2.d: "После событий и тупика в переговорах с повстанцами президент Камисесе Мара объявил чрезвычайное положение и создал постоянное правительство из тех, кто остался от ныне удерживаемых в заложниках членов правительства, которые не были захвачены. Напряженность высока, поскольку местная полиция и Вооруженные силы Республики Фиджи или RFMF были растянуты, чтобы создать слабеющий кордон вокруг парламента, а также справиться с растущими протестами и гражданскими беспорядками, поскольку протестующие нацелились на несколько индо-фиджийских предприятий в Суве."
 fiji_news.2.o1: "Неужели мы ничего не можем сделать!?"
 fiji_news.3.t: "Потеря власти стала причиной военного переворота"
 fiji_news.3.d: "Поскольку остатки гражданского правительства доказали свою неспособность по-настоящему осуществлять исполнительную власть, командующий RFMF Фрэнк Баинимарама сверг действующее правительство и установил свое собственное. Их первым действием стало введение военного положения, что дало им больше свободы для борьбы с массовыми гражданскими беспорядками."
 fiji_news.3.o1: "Вот и снова"
 fiji_news.3.o2: "Военные решат эту проблему"
 fiji_news.4.t: "Перестрелка в парламенте"
 fiji_news.4.d: "После военного переворота конституция 1997 года была отменена, переговоры прервались, и военные выдвинули ультиматум. Иностранные державы начали серию санкций, из-за которых Фиджи была исключена из Содружества, несколько стран запретили фиджийские товары, а фиджийские спортивные команды были запрещены. Эти ответы были вызваны идеей уступить требованиям мятежников. 12 июня военные открыли предупредительные выстрелы по автомобилю Джорджа Спейта, хотя Спейт утверждает, что это была неудавшаяся попытка убийства. Переговоры все еще продолжаются, и было освобождено больше заложников. Поскольку гражданские беспорядки утихают и ситуация выглядит обнадеживающей, многие задаются вопросом, как долго это продлится."
 fiji_news.4.o1: "Пожалуйста, прекратите это бессмысленное насилие"
 fiji_news.5.t: "Военные договорились с повстанцами?"
 fiji_news.5.d: "3 июля 2000 года Баинимарама назначил Лайсению Карасе премьер-министром, возглавив полностью коренное фиджийское правительство. Спейт был возмущен этим решением, и на следующий день в парламенте вспыхнула перестрелка, в которой пять человек получили ранения. Хаос усилился, и мятежники устроили ряд инцидентов по всей стране. Солдаты в казармах Сукунайвалу в Лабасе подняли мятеж и заявили о своей поддержке Спейта. Местные землевладельцы захватили плотину Монасаву, отключив электроснабжение Сувы. 8-го числа мятежники заблокировали дорогу между Сувой и Нади и штурмовали полицейский участок в Коровоу, взяв 30 заложников. В тюрьме Наборо 50 заключенных устроили бунт, взяв в заложники охранников."
 fiji_news.5.o1: "О чём думает Баинимарама!!!?"
 fiji_news.6.t: "Конец переворота"
 fiji_news.6.d: "В течение месяцев июня и июля полунепрерывные переговоры пронизывали страну, поскольку реформа гражданского правительства обсуждалась и обсуждалась. В конечном итоге все больше и больше заложников освобождалось, когда мятежники покидали здание парламента и мигрировали из столичного региона. В конце концов, 26 июля Спейт и его пресс-секретарь Джо Ната были арестованы около военного контрольно-пропускного пункта после того, как два лидера повстанцев стали угрожать новому президенту и гражданской войной. Вскоре после этого военные штурмовали штаб-квартиру повстанцев, арестовав еще 369 повстанцев. Гражданский переворот был объявлен оконченным, вскоре после этого Джорджа Спейта судили за измену и приговорили к смертной казни."
 fiji_news.6.o1: "Наконец-то мир... Но какой ценой?"
 fiji_news.7.t: "Объединённые Фиджи добились победы"
 fiji_news.7.d: "Конституция Фиджи 1997 года требовала, чтобы всеобщие выборы в Палату представителей проводились не реже одного раза в пять лет. Исполняющий обязанности президента Рату Джони Мадраививи издал прокламацию 2 марта 2006 года, вступающую в силу с 27 марта, о роспуске парламента. Предыдущий парламентский срок должен был истечь 1 октября 2006 года. Указ о выборах был издан 28 марта; кандидаты подали свои кандидатуры 11 апреля и опубликовали свои списки предпочтений 13-го, а регистрация избирателей закрылась 4 апреля. Всеобщие выборы прошли на Фиджи с 6 по 13 мая 2006 года. Действующее правительство Soqosoqo Duavata ni Lewenivanua (SDL) во главе с премьер-министром Лайсенией Карасе было переизбрано на третий срок в правительстве. Главной оппозицией является Лейбористская партия во главе с Махендрой Чаудхри, а также несколько других мелких партий."
 fiji_news.7.o1: "Устойчивый, как она идет."
 fiji_news.8.t: "Требования военных"
 fiji_news.8.d: "16 октября 2006 года командующий RFMF коммодор Баинимарама выдвинул правительству ультиматум с требованием выполнить девять требований или уйти в отставку до 1 декабря. Девять требований в основном касались привлечения к ответственности сторонников переворота 2000 года; прекращения любых политических махинаций, которые потенциально могли бы усилить экономическое неравенство по расовому признаку; отказа от вмешательства иностранных властей (упоминая по имени комиссара полиции Эндрю Хьюза, гражданина Австралии); прекращения судебного разбирательства по заявлениям военных, сделанным в начале года, и официального решения проблем государственных расходов и внутреннего управления. Полторы недели спустя, 31 октября 2006 года, военные провели учения вокруг Сувы и закрыли армейские казармы города. Военные заявили, что учения не представляют угрозы."
 fiji_news.8.o1: "Мы отказываемся от такого бреда"
 fiji_news.8.o2: "§PДавайте пока сохраним лицо§!"
 fiji_news.9.t: "Правительство военного переворота"
 fiji_news.9.d: "Поскольку правительство оспаривало требования военных, коммодор Фрэнк Баинимарама инициировал переворот, в результате которого было свергнуто правительство, в котором было заявлено как, цитата, угроза социальной и этнической стабильности, конец цитаты. События здесь развивались быстро и стремительно, показывая, что сами военные, похоже, едины в этом стремлении воли коммодора. Но некоторые сомневаются в обоснованности, и еще больше людей, похоже, думают, что у военных другие планы. Хотя известно немного, многие надеются, что мы действительно сможем увидеть мир в наше время."
 fiji_news.9.o1: "Достаточно ли этого?"
 fiji_news.9.o2: "§lСтабильность восстановлена§!"
 fiji_news.10.t: "Участники переворота ведут агитацию"
 fiji_news.10.d: "С недавним переворотом, в результате которого коммодор Фрэнк Баинимарама стал фактическим лидером страны, многие теперь задаются вопросом, что же на самом деле ждет Фиджи дальше. Некоторые высокопоставленные члены переворота, похоже, агитируют за более твердую позицию по вопросу управления страной. Один из них сказал, что мелкие склоки этнических беспорядков являются величайшей ошибкой, которую пришлось пережить стране, не говоря уже о том, чтобы разорвать себя на части. Сейчас весь мир пристально следит за тем, как переживает этот небольшой тихоокеанский остров."
 fiji_news.10.o1: "§8Военные - наше спасение§!"
 fiji_news.10.o2: "Разве мы не достаточно пострадали"
 fiji_news.11.t: "Старые идеи порождают фракционность"
 fiji_news.11.d: "Растущая фракционность внутри военной хунты привела к появлению старых идей с новым оттенком. Фракция, известная как Дом Сувы, похоже, хочет создать выборную монархию, своего рода старые титулы с новыми принципами. Вместо того, чтобы привязывать титул к крови, идеи выборов и принцип демократии все еще будут там. Эта гибридизация монархизма с демократическим электоризмом станет фундаментальной основой их платформы. Один из членов фракции даже заявляет: «Теперь вы можете сказать своему сыну или дочери, что если вы будете достаточно усердно работать и искать свои цели в жизни, вы тоже можете стать принцем, принцессой или, может быть, даже королем или королевой». Многие не уверены в этом предложении, но оно, похоже, нравится совету вождей и племенному наследию народа острова."
 fiji_news.11.o1: "Что за сказка"
 fiji_news.11.o2: "§0Ну... может быть, это будет неплохой стимул для самолюбия§!"
 fiji_news.12.t: "Дестабилизация в результате переворота"
 fiji_news.12.d: "Поскольку переворот затягивается, и многие фракции теперь протестуют против населения в целом, многие задаются вопросом, что выйдет из этой полной паузы в стране. Ходят слухи о формировании фракции под названием Совет Техната, этот совет, похоже, является частью узкоспециализированной партии «тихо-тихо», известной как Партия технократии Фиджи. Но многие из протестных движений против аппарата переворота просто хотят двигаться дальше, и все чаще появляются знаки того, что Лейбористская партия Фиджи просто возьмет на себя управление, поскольку она заняла второе место по результатам выборов. Но кто моргнет первым?"
 fiji_news.12.o1: "§tСовет захватывает власть§!"
 fiji_news.12.o2: "§PНарод сыт по горло§!"
 fiji_news.400.t: "Военные фанатики"
 fiji_news.400.d: "Из-за хаоса, вызванного переворотом, некоторые военные заняли неоправданно агрессивную позицию, открыто игнорируя желания коммодора Фрэнка Баинимарамы. Напряжение растет, и сплоченность в армии начинает рушиться."
 fiji_news.400.o1: "Бог поможет нам"
 fiji_news.401.t: "Слухи о рейдерском захвате растут"
 fiji_news.401.d: "Недавно ходили слухи, что секта военной хунты под руководством более радикально настроенных лидеров разработала план штурма здания парламента и захвата заложников. Командор был замечен в поисках этих радикальных офицеров, чтобы предотвратить национальный кризис, невиданный со времен первого переворота в 1980-х годах. Время покажет, будут ли править землями уравновешенные люди или хаос."
 fiji_news.401.o1: "§8Мне кажется, я слышу выстрелы?§!"
 fiji_news.401.o2: "§lСегодня странно тихо.§!"
 fiji_news.401.o3: "§0Что за шум я слышу?§!"
 fiji_news.402.t: "Резня в Суве"
 fiji_news.402.d: "Хаос охватил страну: перестрелка и штурм заложников привели к 15 смертям, 27 ранениям и массовой панике по всей стране. По сообщениям источников, в ходе хаоса, длившегося целую неделю, коммодор Фрэнк Байнимарама был найден мёртвым в сильно повреждённом конвое. Никто не утверждает, что коммодор погиб, и мнения о том, действительно ли он умер, расходятся. Тем не менее это путь к восстановлению, который дорого обойдётся стране."
 fiji_news.402.o1: "Можем ли мы исцелиться от этого?"
 fiji_news.403.t: "Движение вперёд"
 fiji_news.403.d: "Это было долгое и довольно утомительное приключение — перестраивать страну после потрясений переворота 2000 года. Но из пепла восстал феникс, и эта величественная птица воспарит. Теперь мы можем сосредоточиться на строительстве на фундаменте, заложенном перед нами, и смотреть не только на наш маленький остров, но и на мир вокруг нас."
 fiji_news.403.o1: "Путешествие только начинается."
 fiji_news.500.t: "Борьба за власть обостряется"
 fiji_news.500.d: "Военные части были внезапно отозваны из и без того ужасного оцепления вокруг здания парламента. Источники утверждают, что стрельба и визг шин были слышны недалеко от окраины самой Сувы. Многие задаются вопросом, что же произошло, что вызвало столь радикальные изменения в аппарате военного контрпереворота по отношению к тому, что осталось от гражданского правительства. Более того, первоначальный лидер этнонационалистов, который начал первоначальный переворот, сделал резкие призывы поговорить с ним или начать отвечать за последствия своего бездействия. Мы надеемся вскоре получить новости о том, что произошло."
 fiji_news.500.o1: "Есть ли у нас вообще нация?"
 fiji_news.501.t: "Кровавые результаты"
 fiji_news.501.d: "В резком контрасте с современным миром, в котором мы живём, оказывается, что нестабильная секта военных устроила засаду на конвой Командора и впоследствии заставила Совет Вождей легализовать Дом Сувы. Это кровавое восхождение привело к тому, что страна стала монархией, несмотря на историю обретения страной независимости от монархии. Недавнее интервью с одним из предполагаемых членов Совета Дома заявило, что цитата «Мы стремимся к твёрдому правлению, справедливому правлению и благочестивому правлению над страной. Хотя да, мы устанавливаем форму Военного положения, пока не разберутся с Этно-националистами, мы, тем не менее, не планируем отменять выборы». Многие скептически относятся к этим заявлениям, однако подавляющее большинство просто хочет, чтобы хаос прекратился. Посмотрим, каков будет конечный результат этой их короны, созданной кровью."
 fiji_news.501.o1: "Есть ли вообще колесо, которое можно взять!!!?"
 fiji_news.502.t: "Новая эпоха"
 fiji_news.502.d: "С процессом восстановления, по сути, завершенным, шрамы несколько зажили, и нация смогла сосредоточиться на будущем. Дом Сувы увидел, что взял на себя обязательство по полному пониманию и развитию нации и ее народа. Понимая, что впереди у людей будут проблемы, хотя они все еще колеблются, тем не менее, у них появилось чувство легкости в том, что жизнь вернулась в нормальное русло... даже если эта нормальность сама по себе не считается «нормальной»."
 fiji_news.502.o1: "Новая глава, новое начало."
 Rear_Admiral_Villiame_Naupoto_desc: "Вильяме Наупото был фиджийским военно-морским офицером, который в хаосе переворота 2006 года присоединился к фракции более активных милитаристов. Эта фракция внутри переворота вытеснила и изолировала Фрэнка, так называемого «Бананамена». В результате этого сдвига некогда конституционно соблюдаемый переворот теперь превращался в полноценную военную хунту. Хотя контр-адмирал Наупото является новым лицом на политической сцене, он, по сути, не слепой, поэтому люди задаются вопросом, как он приведёт страну и её народ к лучшим временам."
 Laisenia_Qarase_desc: "Лайсения Карасе был компромиссным кандидатом, выдвинутым во время переворота 2000 года. Не слишком левый, этнический фиджиец и не слишком правый на тот момент. Он выиграл досрочные выборы 2001 года и, что удивительно, выборы 2006 года. Хотя к 2006 году его взгляды и партия изменились, став более этнически фиджийскими, некоторые предложенные спорные законопроекты в его правлении 2006 года создали конституционный кризис, который привел к военному перевороту 2006 года."
 Mahendra_Chaudhry_desc: "Махендра Чаудхри был избранным лидером первого этнически индо-фиджийского правительства Фиджи в 2000 году. Однако агитатор из этнонационалистического движения решил взять дело в свои руки и таким образом похитить избранное правительство. После событий указанного переворота была создана Объединенная фиджийская партия, которая была официально избрана на внеочередных выборах после переворота. Махендра Чаудхри предпринял еще одну попытку занять пост премьер-министра на всеобщих выборах 2006 года."
 Dr_Padma_Narsey_Lal_desc: "Падма Нарсей Лал, родившаяся в 1951 году, училась в Университете Южной части Тихого океана, получив степень магистра наук, экологии и биохимии. Она была первой женщиной-гуджараткой, поступившей в этот университет. В 1971 году она была награждена первой золотой медалью Университета Южной части Тихого океана. Она также получила степень магистра в области изучения ресурсов и окружающей среды в Австралийском национальном университете и докторскую степень в области сельского хозяйства и экономики ресурсов в Гавайском университете в Маноа. Падма Лал начала свою карьеру с должности государственного служащего в правительстве Фиджи, а затем перешла на должности в области исследований и управления исследованиями. Она работала советником по устойчивому развитию в Секретариате Форума тихоокеанских островов и главным техническим советником в Региональном отделении океанического региона Международного союза охраны природы. Лал также занимала руководящие должности в правительстве Австралийского содружества, в том числе в Австралийском центре международных сельскохозяйственных исследований."
 King_Sitiveni_I_desc: "Ситивени Рабука теперь официально получил титул короля Ситивени I Дома Сувы. Ведущий член и некоторые утверждают, что потенциальный основатель Дома Сувы. Рабука сделал себе имя и наследие своей политической и военной карьерой, а также тем или иным образом участвовал почти в каждом государственном перевороте, который происходил в стране. Стабильность, порядок, мир... Эти три столпа — то, что Рабука стремился сохранить, и на этом новом пути многие задаются вопросом, сможет ли он создать настоящее наследие."
 King_Sitiveni_II_desc: "Джиоджи Конроте теперь официально получил титул короля Ситивени II из Дома Сувы. Бывший генерал-майор и политик был избран народом в первом избирательном цикле эпохи после переворота. Имя Ситивени является символом в коронном совете. Символом является то, что один из ведущих членов и некоторые утверждают, что потенциально основатель Дома Сувы, Ситивени Рабука. Поскольку соглашение об именовании установлено в качестве прецедента, многие задаются вопросом, выберут ли следующие лидеры символ или, возможно, сделают ставку на свои собственные претензии в числовой игре."
 fiji_focus: "Дерево фокусов Фиджи"
 fiji_research_institute_of_fiji_desc: "R.I.F. — это вершина идентичности нашей нации. Используя умеренно распределенные инвестиции в исследования и инновации во всех областях, мы сможем поставить свое имя на карту и привлечь иностранные научные сообщества. Учитывая это, он быстрее познакомит наши страны с технологиями и даст нам колоду для торговли теми, кто захочет играть в наши игры."
 FIJ_focus_the_1999_general_election: "Всеобщие выборы 1999 года"
 FIJ_focus_the_1999_general_election_desc: "В 1999 году состоялись всеобщие выборы в Фиджи, на которых было сформировано новое правительство, и Фиджийская лейбористская партия получила большинство мест в парламенте. Главная оппозиционная партия, SVT (Soqosoqo ni Vakavulewa ni Taukei), заняла второе место. Динамика сложилась так, что Лейбористская партия считалась левоцентристской, а SVT — правоцентристской. Однако на третьем месте оказалась FAP (Fijian Association Party). Эта отколовшаяся от SVT группа, как ни парадоксально, считалась более правой, поскольку состояла преимущественно из этнических фиджийцев. Однако смена руководства привела к заметному смягчению позиций партии, поскольку она создала избирательный альянс с FLP."
 FIJ_focus_assessing_the_national_situation: "Оценка национальной ситуации"
 FIJ_focus_assessing_the_national_situation_desc: "Несмотря на обещания новых выборов, мы должны сориентироваться и понять, что именно нам нужно искать и исправлять. Беспорядки, связанные с независимостью нашей прекрасной нации, были периодом политической борьбы и переворота за переворотом, за переворотом... Таким образом, мы должны поторопиться, если не попадем в такую же трясину."
 FIJ_focus_increased_security: "Усиление правоохранительных мер в Суве"
 FIJ_focus_increased_security_desc: "В столице неспокойно, мы опасаемся, что в этом районе может усилиться этническое насилие, особенно в связи с недавним избранием правительства, в котором большинство составляют индо-фиджийцы."
 FIJ_focus_the_2000_debacle: "Провал 2000 года"
 FIJ_focus_the_2000_debacle_desc: "На рубеже веков остров Фиджи пострадал от этнонационалистического переворота. Попытка переворота была в конечном итоге подавлена контрпереворотом, осуществленным военными, однако с тех пор доверие к гражданскому правительству находится на рекордно низком уровне. Теперь нынешняя правящая партия и даже ее оппозиция должны попытаться вернуть надежду народу Фиджи."
 FIJ_focus_isolated_terror_attacks: "Нападения националистов"
 FIJ_focus_isolated_terror_attacks_desc: "Несмотря на арест Спейта, насилие со стороны повстанцев продолжалось. 31 июля сторонники Спейта терроризировали деревню Дрекети, взяв в заложники 30 человек. Солдаты, поднявшие мятеж в казармах Сукунаивалу, не сдавались в течение шести недель. 8 августа повстанцы устроили засаду на военный патруль, убив одного солдата и полицейского и ранив еще троих."
 FIJ_focus_military_disunity: "Военный мятеж"
 FIJ_focus_military_disunity_desc: "2 ноября 2000 года солдаты контрреволюционного подразделения, лояльные Спейту, подняли мятеж в казармах королевы Елизаветы, взяв в заложники офицеров в попытке свергнуть военного командующего Фрэнка Баинимараму. Двое солдат были убиты и десять ранены, когда военные отвоевали казармы. Четверо из повстанцев были подвергнуты пыткам и убиты лояльными солдатами."
 FIJ_focus_political_legitimacy: "Укреплённая легитимность"
 FIJ_focus_political_legitimacy_desc: "15 ноября Высокий суд Фиджи объявил временное правительство незаконным. Мара оставался законным президентом; парламент не был распущен, а лишь приостановлен, и теперь должен быть созван вновь; и, следовательно, Чаудхри оставался законным премьер-министром. Впоследствии Мара официально подал в отставку, причем его отставка датируется 29 мая."
 FIJ_focus_political_stagnation: "Политический тупик"
 FIJ_focus_political_stagnation_desc: "После восстановления конституции 1997 года и последующего формирования правительства в 1999 году страна, как ни странно, оказалась в состоянии застоя. Правительство, которое долгое время находилось в заложниках, подвергалось запугиванию с целью заставить уйти в отставку и так далее, внезапно вернулось к якобы нормальной жизни. В то время как страна спокойна, главные министры и члены правительства – нет, и некоторые задаются вопросом, смогут ли они действительно сохранить свою власть после таких событий."
 FIJ_focus_political_challenge: "Вызов Карасе"
 FIJ_focus_political_challenge_desc: "Правительство Карасе обжаловало решение Высокого суда. 1 марта 2001 года Апелляционный суд Фиджи подтвердил решение Высокого суда о восстановлении конституции. Правительство приняло это решение и решило возобновить предвыборную кампанию к предстоящим выборам 2001 года."
 FIJ_focus_2001_elections: "Всеобщие выборы в Фиджи 2001 года"
 FIJ_focus_2001_elections_desc: "Решение о проведении новых выборов для начала нового государственного устройства предусматривало их проведение в августе и сентябре 2001 года. Выборы проходили в напряженной обстановке после противостояния с правительством, избранным в 1999 году, в котором большинство составляла Лейбористская партия Фиджи, боровшаяся против правительства Лайсении Карасе, пришедшего к власти в результате переворота и входившего в основную оппозиционную партию. Объединенная партия Фиджи, или Soqosoqo Duavata ni Lewenivanua (SDL), была сформирована при Карасе после его присяги в качестве премьер-министра во время переворота 2000 года. Эта партия поглотила большую часть оставшейся части Партии ассоциации Фиджи и большинство Христианско-демократического альянса, а также другие консервативные группы, создав своего рода консервативную коалиционную партию. В итоге SDL одержала победу на выборах, заложив основу для дальнейшего управления страной после переворота."
 FIJ_focus_post_coup_cleanup: "Уборка после переворота"
 FIJ_focus_post_coup_cleanup_desc: "В результате произошедшего был нанесен значительный материальный ущерб, а столичный регион Сува оказался в ужасном состоянии. Нам необходимо оперативно навести порядок, чтобы начать с чистого листа и двигаться к достижению наших целей."
 FIJ_focus_early_community_programs: "Программы раннего развития сообщества"
 FIJ_focus_early_community_programs_desc: "Мы должны восстановить волю народа к сотрудничеству. Мы все граждане Фиджи, и поэтому мы должны быть готовы жить вместе. Чтобы показать, что переворот не отражает реальность, мы создадим программы единства. Они продемонстрируют, что города и общины должны объединяться, а не разъединяться."
 FIJ_focus_head_start_cooperatives: "Программы сотрудничества Head Start"
 FIJ_focus_head_start_cooperatives_desc: "В условиях, когда старшее поколение раздирает друг друга на части, задача молодого поколения — восстановить порядок. Для этого мы должны с раннего возраста прививать в наших школах чувство семейного единства, показывая, что неважно, фиджиец ты или индо-фиджиец, мы все здесь, чтобы работать вместе ради лучшего будущего."
 FIJ_focus_softer_situational_training_programs: "Программы обучения более мягким ситуационным навыкам"
 FIJ_focus_softer_situational_training_programs_desc: "В условиях высокой напряженности между этническими группами нам необходимо провести реформу полиции. Чтобы предотвратить негативную реакцию в виде смягчения мер по борьбе с преступностью, эта реформа фактически представляет собой новую программу обучения для сотрудников правоохранительных органов. Программа разработана с учетом гражданских споров между группами и того, как сотрудники полиции могут действовать в таких ситуациях, не отдавая предпочтение какой-либо из сторон."
 FIJ_focus_service_guarantee_citizenship: "Служба гарантирует получение гражданства!"
 FIJ_focus_service_guarantee_citizenship_desc: "Мы должны создать чувство национальной гордости, для этого мы можем использовать армию, возможно, помочь привлечь новые народы, чтобы сделать наш остров более разнообразным, а не только фиджийцев и индо-фиджийцев. Для этого мы создадим программу служения гражданам внутри армии. Небольшое дополнительное финансирование и что-то, чем можно было бы занять военное руководство, должны помочь нам в целом в мире после переворота. Так что помните, они делают свою часть работы, а вы? Вступайте в Вооруженные силы Республики Фиджи сегодня!"
 FIJ_focus_the_universal_retirement_program: "Универсальная пенсионная программа"
 FIJ_focus_the_universal_retirement_program_desc: "Программа URP предусматривает создание правительством единого пенсионного фонда, который будет предоставляться всем гражданам, достигшим пенсионного возраста и подавшим заявление на получение пенсии или других связанных с ней социальных пособий. Мы надеемся повысить и уравнять минимальный уровень пенсий для всех граждан на благо всей страны."
 FIJ_focus_the_national_care_initiative: "Национальная инициатива по уходу"
 FIJ_focus_the_national_care_initiative_desc: "Национальная инициатива здравоохранения (NCI) станет отправной точкой нашей системы здравоохранения. Базовые виды лечения, связанные с повседневными травмами и подобными происшествиями, будут бесплатно доступны всем гражданам. Мы надеемся, что оказанная помощь покажет гражданам нашей страны, что о них заботятся, и что они дадут нам реальный шанс сделать реальные вещи для улучшения жизни, какой мы ее знаем."
 FIJ_focus_soup_kitchens_act: "Закон о столовых для бездомных"
 FIJ_focus_soup_kitchens_act_desc: "В условиях роста числа бездомных, этнической напряженности и массового оттока населения с острова нам необходимо искать радикальные решения. Правительственная программа по созданию стратегических столовых для помощи всем бездомным и находящимся в неблагополучном положении объединит людей. Это не всё, на что мы рассчитывали, но это основа для реальной благотворительной инициативы по всей стране."
 FIJ_focus_police_fairness_act: "Закон о справедливости в работе полиции"
 FIJ_focus_police_fairness_act_desc: "В свете сложившейся ситуации и пристального внимания к безопасности и обеспечению благополучия населения страны, правоохранительные органы должны быть лучше организованы и не восприниматься как бродяги. Организация работы полиции и распределение сил будут пересмотрены и станут более справедливыми как по отношению к преступности, так и к районам, которые местные жители считают обделенными вниманием."
 FIJ_focus_fijian_corps_of_engineers: "Инженерный корпус Фиджи"
 FIJ_focus_fijian_corps_of_engineers_desc: "Создание подразделения FCE в составе RFMF станет целенаправленной инициативой военных в мирное время, направленной на содействие внутреннему развитию. Это может означать модернизацию существующей военной инфраструктуры, а также поддержку гражданских строительных проектов в сфере общественных работ, таких как водоснабжение, дорожное и железнодорожное сообщение, а также других объектов инфраструктуры, обеспечивающих функционирование нашей страны."
 FIJ_focus_early_education_standards_act: "Закон о стандартах начального образования"
 FIJ_focus_early_education_standards_act_desc: "Закон о начальном образовании (EESA) — это бюджетный закон, который предусматривает выделение средств на начальное образование. Эти средства будут направлены на оплату труда учителей, приобретение новых учебников и стандартизацию необходимых материалов и оборудования для каждого основного предмета. Финансирование будет равномерно распределено между всеми школами, предназначенными для начального образования, с расчетом на то, что новые поколения будут лучше подготовлены и при переходе в среднюю школу трудности будут ощущаться менее остро. Это должно заложить основу для дальнейшего финансирования и улучшения общих стандартов образования в стране."
 FIJ_focus_targeted_medical_imports: "Целевой импорт медицинских товаров"
 FIJ_focus_targeted_medical_imports_desc: "Благодаря целевому финансированию мы составим приоритетный список необходимого медицинского оборудования, лекарств и основных расходных материалов, чтобы создать базовый запас и обеспечить максимально эффективное функционирование нашей медицинской инфраструктуры. Это должно положить начало процессу поощрения, где это возможно, развития отечественной медицины, чтобы мы не оказались в затруднительном положении из-за глобальных цепочек поставок."
 FIJ_focus_fiji_food_securities_program: "Программа продовольственной безопасности Фиджи"
 FIJ_focus_fiji_food_securities_program_desc: "Программа FFSP — это программа, подобная продовольственному банку, в рамках которой наиболее нуждающиеся граждане могут претендовать на получение указанных пособий и приобрести необходимые продукты питания для выживания в течение месяца. Это должно помочь снизить уровень бедности и смягчить постоянно растущую проблему эмиграции, с которой сталкивается страна."
 FIJ_focus_domestic_savings_initiative: "Инициатива внутренних сбережений"
 FIJ_focus_domestic_savings_initiative_desc: "Программа DSI будет представлять собой специализированную программу, задуманную как своего рода военный резерв для правительства. Этот предполагаемый резерв будет использоваться только во время экономических кризисов и/или для реализации целенаправленных программ по смягчению ситуаций, которые достигли масштабов, недоступных для местных властей. Такие меры позволят Фиджи выглядеть более управляемой и привлекательной для иностранных наблюдателей, поскольку наше положение не является самым благоприятным. Тем не менее, мы победим и войдем в новое тысячелетие с энергией, невиданной за последние 30 с лишним лет с момента обретения независимости."
 FIJ_focus_fijian_economic_diversity_initiative: "Инициатива Фиджи по обеспечению экономического разнообразия"
 FIJ_focus_fijian_economic_diversity_initiative_desc: "FEDI — это общий концептуальный план, согласно которому в течение следующих нескольких десятилетий Фиджи должно в меру своих возможностей достичь определенного уровня автаркии. Честно говоря, о имеющихся у нас ресурсах известно немного, но этническая напряженность, отток населения и не слишком благосклонное отношение военных и населения к правительству создают слишком много проблем, чтобы полностью сосредоточиться на этом начинании. Поэтому мы сохраняем надежду на достижение цели в течение следующих нескольких десятилетий, но от людей зависит, сможем ли мы удержаться на плаву и стремиться к этим целям."
 FIJ_focus_rebuild_suva_initiative: "Инициатива по восстановлению Сувы"
 FIJ_focus_rebuild_suva_initiative_desc: "Программа RSI — это согласованный сторонами пакет экономической помощи жителям Сувы, которые больше всего пострадали во время беспорядков, длившихся три месяца и связанных с государственным переворотом. Массовые грабежи и беспорядки привели к огромному ущербу имуществу и разрушению средств к существованию людей, поэтому мы должны помочь им встать на ноги."
 FIJ_focus_early_business_management: "Программа подготовки молодых специалистов в сфере управления бизнесом"
 FIJ_focus_early_business_management_desc: "Программа развития предпринимательства (BMP) — это правительственная инициатива, направленная на поддержку нового поколения предпринимателей в нашей стране. Будут организованы специализированные курсы и стажировки, ориентированные на практическую работу, чтобы помочь владельцу бизнеса понять, как управлять им и что на самом деле значит быть собственником. Мы надеемся дать толчок развитию нашей экономики за счет привлечения новых кредитов, производства и продажи новых товаров и услуг."
 FIJ_focus_startup_investment_program: "Программа инвестиций в стартапы"
 FIJ_focus_startup_investment_program_desc: "Программа SIP будет представлять собой специализированную программу кредитования для новых предпринимателей и реализации их планов. Хотя такое начинание может привести к неэффективному кредитованию, мы, тем не менее, будем стремиться использовать выделенную часть национального бюджета для обеспечения независимого подхода к финансированию. Таким образом, в случае банкротства инвестированного предприятия это не повлечет дополнительных затрат для налогоплательщиков."
 FIJ_focus_start_mining_survey_program: "Начать программы геологоразведочных работ в горнодобывающей промышленности"
 FIJ_focus_start_mining_survey_program_desc: "Мы начнем несколько исследовательских программ, чтобы определить, какими ресурсами мы располагаем и каково наше реальное положение в вопросе внедрения нашей программы ограниченной автаркии."
 FIJ_focus_importing_mining_equipment: "Импорт горнодобывающего оборудования"
 FIJ_focus_importing_mining_equipment_desc: "В связи с предложенными нами недавними исследованиями горнодобывающей промышленности нам потребуется поддержать эти новые начинания. Поэтому мы составим приоритетный список необходимого горнодобывающего оборудования, материалов и снаряжения для наших шахтеров. Эти люди — основа диверсификации экономики нашей страны в целом."
 FIJ_focus_increased_core_industries: "Увеличение основных отраслей промышленности"
 FIJ_focus_increased_core_industries_desc: "В рамках нашего 20-летнего плана, ориентированного на будущее, мы должны инвестировать в расширение наших основных отраслей промышленности. Лесное хозяйство и судостроение являются достаточно сильными направлениями, но мы также должны включить в план конкретные проекты в горнодобывающем секторе, связанные с производством цемента."
 FIJ_focus_solidifying_precious_metals: "Укрепление добычи драгметаллов"
 FIJ_focus_solidifying_precious_metals_desc: "Добыча и экспорт золота и серебра являются важнейшим аспектом нашего импорта. Расширение этих подсекторов значительно улучшит соотношение торгового дефицита к импорту и экспорту товаров. Расширение этой сферы позволит увеличить наши торговые доходы, что даст нам возможность нарастить импортные возможности. Цикл роста начался."
 FIJ_focus_establishing_fijian_manufacturing: "Создание производства на Фиджи"
 FIJ_focus_establishing_fijian_manufacturing_desc: "Создание мощной производственной базы означает, что мы можем диверсифицировать наш экономический портфель. Теперь, когда мы импортируем товары, мы можем использовать эту базу для диверсификации способов их использования и получения большей выгоды от экспорта."
 FIJ_focus_economic_relief_fund: "Фонд экономической помощи"
 FIJ_focus_economic_relief_fund_desc: "Фонд экстренной помощи (ERF) — это хорошо зарекомендовавшая себя система социальной защиты, в рамках которой, если страна переживает трудные времена или если экономические условия приводят к внезапному краху или почти полному падению какого-либо сектора экономики, предприятия в пострадавшем секторе могут подать заявку на организованную финансовую помощь. Эти предполагаемые меры по оказанию помощи будут обсуждаться и осуществляться в рамках бюджета, выделенного для ERF. С помощью такого фонда мы надеемся предотвратить любые внешние факторы, влияющие на нашу экономику."
 FIJ_focus_balanced_trading_budget: "Сбалансированный торговый бюджет"
 FIJ_focus_balanced_trading_budget_desc: "В условиях, когда страна переходит от псевдоаграрной и деиндустриализованной экономики к новой эпохе разнообразия и процветания, мы должны следить за тем, чтобы наши доходы не превышали наши планы по экспорту. Поэтому нам необходимо уделить внимание реальному сбалансированию бюджета с периодичностью раз в квартал или даже раз в полгода. Со временем мы сможем оптимизировать нашу экономику и повысить ее эффективность и результативность."
 FIJ_focus_early_adoption_tech_sector_investments: "Раннее внедрение инвестиций в технологический сектор"
 FIJ_focus_early_adoption_tech_sector_investments_desc: "В связи с ростом популярности так называемого интернета, который, похоже, стал трендом, захватившим мировые рынки, наш долг — ответить соответствующим образом. Поэтому мы должны усовершенствовать наше промышленное производство и экспорт, включив в них новые продукты и услуги, которые, судя по всему, генерирует технологический сектор."
 FIJ_focus_the_motorway_improvement_act: "Закон об улучшении автомагистралей"
 FIJ_focus_the_motorway_improvement_act_desc: "Парламент принял законопроект о финансировании целевых проектов по модернизации основных автомагистралей страны. Законопроект рассматривается как способ лучше справиться с растущим грузооборотом и расширить доступ для новых потенциальных предприятий и отраслей по мере роста и развития нашей экономики. Хотя некоторые отвергают увеличение расходов, другие надеются, что это станет еще одним шагом на пути к будущему нашей страны."
 FIJ_focus_the_new_millennia_tax_reform_act: "Закон о налоговой реформе после государственного переворота"
 FIJ_focus_the_new_millennia_tax_reform_act_desc: "Парламент недавно принял закон PCTR, законопроект, который реформирует сбор налогов с предприятий и населения в целом таким образом, чтобы, как ожидается, он был более справедливым по отношению к малоимущим и этническим фиджийцам, которые, по-видимому, составляют значительную часть нашего бедного населения."
 FIJ_focus_domestic_energy_initiative: "Инициатива по развитию внутренней энергетики"
 FIJ_focus_domestic_energy_initiative_desc: "Национальная инициатива по внутренней энергетике (DEI) — это программа исследований, изысканий и планирования. Наш остров относительно невелик, поэтому мы должны стремиться к максимальной отдаче от вложенных средств в производство энергии. Учитывая это, мы нашли хороший источник отечественной нефти, который можем добывать, и таким образом интегрируем раннюю форму нефтехимической промышленности в качестве расширения и прямой связи с добычей ресурсов. Это должно значительно улучшить планирование на будущее."
 FIJ_focus_domestic_resource_diversity: "Программа по обеспечению разнообразия внутренних ресурсов"
 FIJ_focus_domestic_resource_diversity_desc: "Парламент создал программу DRD (Diversity of Domestic Resources), правительственную инициативу по расширению и, возможно, диверсификации наших внутренних ресурсов и объемов их добычи. На протяжении большей части периода независимости нашего прекрасного острова мы были известны своими золотом и серебром, однако недавние исследования и технологические достижения привели к обнаружению довольно крупных месторождений ключевых ресурсов, таких как железо, медь и даже нефть. Мы надеемся в будущем в значительной степени извлечь выгоду из этих еще не освоенных месторождений."
 FIJ_focus_the_2006_general_election: "Всеобщие выборы 2006 года"
 FIJ_focus_the_2006_general_election_desc: "Всеобщие выборы прошли на Фиджи с 6 по 13 мая 2006 года. Действующее правительство Сокосоко Дуавата ни Левенивануа (СДЛ) во главе с премьер-министром Лаисенией Карасе выступило против главной противодействующей силы - Лейбористской партии Фиджи во главе с Махендрой Чаудри, а также нескольких других второстепенных партий."
 FIJ_focus_subtle_ethnic_illusions: "Тонкие этнические иллюзии"
 FIJ_focus_subtle_ethnic_illusions_desc: "После уверенного переизбрания и смены власти в нашу пользу мы должны стремиться укрепить гегемонию нашего народа на острове. Хотя это встретит открытое сопротивление и даже враждебность, мы будем действовать более тонко и стремиться к реальным переменам."
 FIJ_focus_drafting_the_reconciliation_bill: "Разработка законопроекта о примирении"
 FIJ_focus_drafting_the_reconciliation_bill_desc: "Законопроект о примирении предусматривает ряд небольших уступок в отношении этнического населения Фиджи. Поэтому одним из наших главных пунктов является попытка оглянуться назад на переворот 2000 года и начать новую главу, предоставив амнистию участникам переворота и заключенным в тюрьму. Мы надеемся, что это даст общественности более справедливое и правдивое понимание того, что все мы совершаем ошибки, и поэтому нас не следует определять исключительно ими."
 FIJ_focus_assessing_the_farmland_leases: "Оценка договоров аренды сельскохозяйственных земель"
 FIJ_focus_assessing_the_farmland_leases_desc: "Договоры аренды сельскохозяйственных земель, предоставляемые индо-фиджийскому населению в качестве компенсации бывшей Королевской сахарной компании во времена колониального правления, давно устарели. Мы цепляемся за прошлое, увековечивая подобную практику, и поэтому мы займемся разработкой законодательства для надлежащего решения этой проблемы."
 FIJ_focus_labour_party: "ФЛП побеждает после переворота"
 FIJ_focus_labour_party_desc: "Партия FUP уступила всем требованиям военных из-за опасений мести и законных действий в ответ на угрозу государственного переворота. В результате были проведены досрочные выборы, которые привели к избранию правительства большинства от партии FLP. Благодаря косвенной поддержке военных и, в некотором смысле, возможности начать все с чистого листа, мы можем рассчитывать на реальные позитивные изменения."
 FIJ_focus_turning_down_the_heat: "Снижение температуры"
 FIJ_focus_turning_down_the_heat_desc: "С приходом к власти нового правительства и достижением консенсуса с военными у нас теперь есть возможность начать с чистого листа. Почти накаленная до предела этническая напряженность, кульминацией которой стал фиаско 2006 года, утихла, и мы можем начать более эффективную интеграцию наших общин. Хотя со временем наша численность уменьшится, мы сможем заложить основу для новой эры мира на острове."
 FIJ_focus_simmering_national_fears: "Нарастающие национальные опасения"
 FIJ_focus_simmering_national_fears_desc: "Многие по-прежнему массово покидают страну, и мы должны принять меры. Перераспределение бюджетных средств в пользу программ здравоохранения и социального обеспечения позволит нам побудить новые поколения не бежать, поскольку мы покажем им, что мы рядом и готовы им помочь."
 FIJ_focus_setting_to_boil_new_economic_plans: "Начинается разработка новых экономических планов."
 FIJ_focus_setting_to_boil_new_economic_plans_desc: "Экономика стагнирует или растет такими темпами, что если бы кто-то даже подумал чихнуть на глобальный рынок, это выглядело бы практически как стагнация. Поэтому мы должны активизировать наши экономические инициативы и стремиться к созданию как взаимосвязей, так и экономической стабильности — своего рода план «Наш-Тарки», если хотите."
 FIJ_focus_a_path_of_healing: "Путь исцеления"
 FIJ_focus_a_path_of_healing_desc: "После того, как буря утихла, мы собрались с мыслями и организовались, и теперь займемся внутренней ситуацией, которая, вероятно, займет большую часть времени администрации."
 FIJ_focus_foreign_outreach: "Внешняя политика"
 FIJ_focus_foreign_outreach_desc: "В условиях нестабильности в нашей стране, которая сейчас выглядит более стабильной в глазах иностранных держав, мы можем стремиться привлекать и вкладывать инвестиции и искать свое место в этом мире."
 FIJ_focus_farmers_investment_division: "Инвестиционный отдел фермеров"
 FIJ_focus_farmers_investment_division_desc: "Похоже, фермеры стали причиной многих беспорядков на этом прекрасном острове. Поэтому нам необходимо создать в правительстве сбалансированное подразделение по инвестициям в фермеров и сельскому хозяйству, которое сможет удовлетворить все потребности. В конце концов, фермеры — это фермеры, и всем им нужна помощь."
 FIJ_focus_fijian_redevelopment_fund_phase_one: "Первый этап Фонда развития Фиджи"
 FIJ_focus_fijian_redevelopment_fund_phase_one_desc: "Фонд восстановления Фиджи (FRF) — это долгосрочная правительственная инициатива, направленная на решение множества проблем посредством экономического развития. Эти планы будут всеобъемлющими и поэтапными, чтобы наилучшим образом обеспечить национальную стабильность в эти напряженные времена, которые нам хорошо знакомы."
 FIJ_focus_ministry_of_scientific_development: "Министерство научного развития"
 FIJ_focus_ministry_of_scientific_development_desc: "Министерство научного развития (MoSD) будет специализированным подразделением правительства, и его главные цели будут заключаться в поиске талантливых людей и потенциальных будущих лидеров нации, а также в проведении исследований и разработке не только новых технологий, но и способов повышения уровня образования населения."
 FIJ_focus_reforming_trade_initiatives: "Реформирование торговых инициатив"
 FIJ_focus_reforming_trade_initiatives_desc: "Наш остров богат неиспользованными ресурсами, и поскольку нам необходимо диверсифицировать экономику, мы должны иметь возможность не только импортировать, но и экспортировать. Пересмотр торговых условий и поиск покупателя, предложившего наивысшую цену, позволит нам привлечь больше капитала для реализации наших будущих планов."
 FIJ_focus_pulling_in_foreign_scientist: "Привлечение иностранных ученых"
 FIJ_focus_pulling_in_foreign_scientist_desc: "Наши лучшие умы уезжают, мы должны немедленно это остановить. Если мы сможем убедить иностранных ученых создавать исследовательские подразделения и базу здесь, это поможет не только развитию страны, но и отпугнет тех, кто хочет уехать."
 FIJ_focus_overhauling_the_tax_code: "Пересмотр налогового кодекса"
 FIJ_focus_overhauling_the_tax_code_desc: "Федеральный налоговый кодекс находится в плачевном состоянии. Десятилетия переворотов, смен правительств и постоянных споров между сторонниками этнической принадлежности к Фиджи и сторонниками индо-фиджийцев привели к хаосу и огромной неэффективности нашей налоговой системы. Мы должны начать с нуля и не щадить никого, кто бы упоминал об этнической принадлежности. Налоговый кодекс предназначен для обеспечения финансовой стабильности страны, а не для того, чтобы отдавать предпочтение кому-либо из наших граждан."
 FIJ_focus_domestic_iron_development: "Развитие отечественного производства железа"
 FIJ_focus_domestic_iron_development_desc: "Благодаря недавним достижениям в технологиях геологической разведки, нам удалось обнаружить месторождения железной руды, которые мы можем использовать как для внутреннего рынка, так и для экспорта в другие страны. Эти запасы должны дать нам небольшой запас для поддержки проектов развития внутри страны."
 FIJ_focus_expanding_upon_domestic_energy_sources: "Расширение внутренних источников энергии"
 FIJ_focus_expanding_upon_domestic_energy_sources_desc: "Наш остров, хоть и небольшой, до краев богат разнообразными природными ресурсами. Именно эти ресурсы позволят нам не только обеспечить стабильность внутри страны, но и заявить о себе в регионе, в котором мы живём."
 FIJ_focus_human_resources_fund: "Фонд человеческих ресурсов"
 FIJ_focus_human_resources_fund_desc: "Для развития нашей экономики нам также необходимы люди, способные в ней работать. Поэтому мы должны стремиться вернуть на родину наших граждан, бежавших за границу, а также тех, кто ищет возможностей, предоставляя им достаточные стимулы, чтобы показать им реальные перспективы."
 FIJ_focus_pacific_exchange_and_investment_society: "Тихоокеанское инвестиционное и биржевое общество"
 FIJ_focus_pacific_exchange_and_investment_society_desc: "Говорят, что нельзя и пирог съесть, и чтобы он остался целым, но как насчет пирогов? Общество, о котором идет речь, станет отличным прикрытием для взаимодействия в тихоокеанском регионе и позволит укрепить свои позиции среди гораздо более крупных конкурентов."
 FIJ_focus_phase_two_development_fund: "Фонд развития Фиджи, Фаза 2"
 FIJ_focus_phase_two_development_fund_desc: "Первый этап был несколько запутанным из-за смешения других приоритетов, но мы должны двигаться вперед с реальным планом. План состоит в том, чтобы привлечь иностранные инвестиции, отдать приоритет внутреннему росту и сбалансировать импорт и экспорт нашей страны для поддержания высокого уровня экономической и внешнеполитической независимости."
 FIJ_focus_security_through_community: "Безопасность через сообщество"
 FIJ_focus_security_through_community_desc: "Работа полиции затруднена в условиях жесткой системы, а наша новая система позволяет активнее вовлекать в нее местное население. Эти программы позволят местным жителям работать более слаженно, дадут возможность граждан производить аресты и позволят расширить деятельность местных полицейских управлений за счет взаимодействия с населением."
 FIJ_focus_the_care_balance_act: "Закон о балансе заботы и ухода"
 FIJ_focus_the_care_balance_act_desc: "Законопроект CBA — это законодательная инициатива, которая затронет систему здравоохранения и социального обеспечения страны и попытается сбалансировать и реформировать существующие проблемы."
 FIJ_focus_the_military_reform_bill: "Законопроект о военной реформе"
 FIJ_focus_the_military_reform_bill_desc: "Парламентский законопроект № M253 — это законопроект, предусматривающий переговоры, в рамках которых за счет деполитизации вооруженных сил будет увеличено финансирование, что позволит расширить программы подготовки кадров внутри страны. Это также приведет к повышению заработной платы нашим мужчинам и женщинам, которые рискуют своей жизнью, защищая нашу страну и ее народ. Это начало, но надежды на дальнейшие инвестиции в военную сферу пока мало."
 FIJ_focus_foreign_construction_contracts: "Зарубежные строительные контракты"
 FIJ_focus_foreign_construction_contracts_desc: "Привлечение иностранных инвестиций должно начинаться с компаний, а не только с самих лидеров страны. Сосредоточив усилия на привлечении отечественных подрядчиков к строительным проектам, мы сможем привлечь новые идеи, новые материалы и новую волну людей, которые смогут жить на острове."
 FIJ_focus_education_investment_package: "Пакет инвестиций в образование"
 FIJ_focus_education_investment_package_desc: "Программа EIP предусматривает целевое увеличение бюджетов на образование и НИОКР, чтобы помочь нам наладить отношения с нашими региональными соседями. Благодаря этому мы сможем искать новые, более эффективные формы ресурсов и методы производства."
 FIJ_focus_foreign_medical_expos: "Зарубежные медицинские выставки"
 FIJ_focus_foreign_medical_expos_desc: "Сотрудничество с медицинскими учреждениями со всего мира позволит нам действительно инвестировать в здоровье и благополучие наших людей, их психическое и физическое состояние, а также в тот образ жизни, к которому они стремятся."
 FIJ_focus_phase_three_development_funds: "Третий этап Фонда развития Фиджи"
 FIJ_focus_phase_three_development_funds_desc: "Мы на пути к величию, друзья. Сосредоточившись на реальных проблемах и уладив разногласия, возникшие в прошлом, мы направили нашу страну на путь роста, а не на путь разрушения. Мы должны удвоить усилия и продолжать этот метод управления, чтобы обеспечить будущее нашей страны и теперь уже нашего образа жизни."
 FIJ_focus_cohesive_integrations_act: "Закон о сплоченной интеграции"
 FIJ_focus_cohesive_integrations_act_desc: "Понимая свою родину, мы должны стремиться понять наших тихоокеанских соседей. Понимание их культуры, их народа и их общества позволит нам лучше сотрудничать с ними в будущем."
 FIJ_focus_resource_securities_initiative: "Инициатива по обеспечению безопасности ресурсов"
 FIJ_focus_resource_securities_initiative_desc: "РСИ — это специализированное учреждение государственной безопасности и дипломатии, которое будет работать над привлечением внутренних и внешних ресурсов для развития нашей страны и на благо тех, кто их предоставляет."
 FIJ_focus_military_baseline_act: "Закон о базовом уровне военной службы"
 FIJ_focus_military_baseline_act_desc: "В условиях стремления к процветанию и инвестиций в себя и других становится все более очевидной очевидная реальность. Поэтому мы должны обеспечить базовую боеготовность наших вооруженных сил, и это позволит нашей стране и ее партнерам чувствовать себя в безопасности и защищенности, которых мы, простые люди, заслуживаем от более крупных государств."
 FIJ_focus_independence_sustainment_act: "Закон о поддержании независимости"
 FIJ_focus_independence_sustainment_act_desc: "Благодаря организации наших народов в местные группы, объединению общин не только как самодостаточных единиц, но и как части общего национального пирога Фиджи, мы стремимся создать атмосферу неповиновения и самоопределения, в то время как Китай и многие другие более крупные и… амбициозные страны стремятся к собственной выгоде, и мы должны сохранять бдительность в эти неопределенные времена."
 FIJ_focus_modern_industrialism_act: "Закон о современном индустриализме"
 FIJ_focus_modern_industrialism_act_desc: "Законопроект о модернизации производственных предприятий направлен на оптимизацию структуры производственных отраслей и повышение их общей эффективности. В свою очередь, это позволит повысить уровень жизни наших граждан."
 FIJ_focus_food_of_tomorrow: "Еда завтрашнего дня"
 FIJ_focus_food_of_tomorrow_desc: "Наш остров невелик, поэтому мы должны стремиться к большему при меньших затратах. В связи с этим мы выделим одно из подразделений научно-исследовательского отдела для обеспечения основных жизненных потребностей нашего населения."
 FIJ_focus_progressive_taxes_progressive_gains: "Прогрессивные налоги для прогрессивного общества"
 FIJ_focus_progressive_taxes_progressive_gains_desc: "В рамках этой налоговой реформы мы стремимся лучше сбалансировать формы налогообложения в зависимости от получаемых доходов. Благодаря сбалансированию уровней налогообложения мы избежим ситуации, когда кто-то значительно превосходит другого просто потому, что, как предполагается, добился всего собственными силами. Теперь мы можем использовать этот новый баланс доходов, чтобы обеспечить всем лучший уровень жизни и инвестировать средства не только в экономику, но и в людей и в страну в целом."
 FIJ_focus_united_fiji_installed: "Военные устанавливают умеренное правительство ОФП (Объединённой партии Фиджи)."
 FIJ_focus_united_fiji_installed_desc: "В условиях сопротивления правительства требованиям военных, коммодор Фрэнк Баинимарама инициировал государственный переворот и попытался установить на посту президента умеренного представителя Объединенной партии Фиджи. Большинство считают это новое правительство назначенными военными подхалимами, однако некоторые надеются, что это позволит преодолеть сложную ситуацию, подобную недавнему законодательному кризису, вызвавшему негативную реакцию."
 FIJ_focus_resetting_ethnic_legislations: "Пересмотр этнического законодательства"
 FIJ_focus_resetting_ethnic_legislations_desc: "Сократив расходы и, если говорить проще, пересмотрев законопроекты и законы, которые, похоже, нарушили этнический баланс, мы можем попытаться вернуть их в более нейтральное положение, чтобы добиться более взвешенного подхода к сложившейся ситуации."
 FIJ_focus_slashing_biased_taxes: "Снижение предвзятых налогов"
 FIJ_focus_slashing_biased_taxes_desc: "Правительства прошлых лет действовали против идеи мира на нашем острове. Одной из главных проблем был налоговый кодекс и его многочисленные скрытые механизмы, которые отдавали предпочтение определенным этническим группам перед другими; мы начнем сокращать эти механизмы."
 FIJ_focus_jobs_initiative: "Инициатива по созданию рабочих мест"
 FIJ_focus_jobs_initiative_desc: "В рамках всеобъемлющего пакета государственных расходов мы инвестируем в создание рабочих мест. Это поможет обеспечить работой каждого человека, где это возможно, и установит новый стандарт равенства для нашей страны."
 FIJ_focus_fijian_resource_development_program: "Программа развития ресурсов Фиджи"
 FIJ_focus_fijian_resource_development_program_desc: "Программа развития ресурсов Фиджи (FRDP) возглавит разработку и добычу природных ресурсов. Эта программа будет преобразована в государственное министерство и, таким образом, будет рассматриваться скорее как инструмент улучшения положения нации, чем как инструмент улучшения положения отдельных групп населения. Главная идея заключается в том, что земли, на которых обнаружены ценные ресурсы, теперь будут находиться в государственной собственности, а предприятия будут совместно владеть ресурсами для их добычи и переработки. План состоит в том, чтобы способствовать национальному единству посредством развития процветания."
 FIJ_focus_health_not_wealth_act: "Закон о здоровье, а не о богатстве"
 FIJ_focus_health_not_wealth_act_desc: "Закон «Здоровье, а не богатство» (HNW Act) — это законодательный акт, который реформирует некоторые ключевые трудовые законы, позволяя нам лучше сбалансировать условия труда и создать более справедливую среду для обычных людей. Создавая новые стандарты на рабочем месте и выравнивая или полностью отменяя старые и устаревшие правила, мы позволяем нашим людям работать эффективнее, строить лучше и жить вместе дольше."
 FIJ_focus_fiji_more_than_just_water: "Фиджи — это больше, чем просто вода."
 FIJ_focus_fiji_more_than_just_water_desc: "У нашего острова ужасная история, и это очень хорошо видно по действиям и нынешнему положению нашей прекрасной страны в глазах многих стран мира. Зная это, мы должны узнать, что думают о нашей стране иностранцы, и попытаться завоевать их сердца и умы. Показать, что мы можем измениться и что наш остров — это не просто место для рекламы воды."
 FIJ_focus_researching_new_trades: "Исследование новых профессий"
 FIJ_focus_researching_new_trades_desc: "Благодаря щедрым инвестициям в исследования и разработки, связанные с торговлей товарами и услугами, а также с приобретением этих товаров и услуг, наша страна достигнет невиданных ранее высот."
 FIJ_focus_unity_through_service: "Единство через служение"
 FIJ_focus_unity_through_service_desc: "Военные играли важнейшую роль в укреплении единства нашего общества. В конечном счете, мы должны признать, что именно сила, основанная на единстве, движет нацией вперед. Поэтому, благодаря всесторонним переговорам с военными лидерами, мы разработали комплексный план по более эффективному инвестированию в армию и ее персонал, а также по обеспечению более четкого разделения гражданских и военных властей. Мы не можем позволить себе повторения переворота 2000 года."
 FIJ_focus_peace_for_piece: "Мир за мир"
 FIJ_focus_peace_for_piece_desc: "Благодаря миру внутри страны мы достигаем определенных успехов за рубежом. Сейчас, когда на нашем острове наблюдается уровень стабильности, невиданный за последние годы, многие страны стали более охотно торговать, отдыхать и сотрудничать с нами. Это должно позволить нам лучше смотреть в будущее и укреплять свои позиции в регионе."
 FIJ_focus_low_income_work_houses: "Работные дома для малоимущих"
 FIJ_focus_low_income_work_houses_desc: "Правительство создало программу доступного жилья для малоимущих. Это специальный проект, который поможет людям выбраться с улиц и обрести жилье и работу. Конечно, затраты будут довольно высокими, однако для обеспечения безопасности, защищенности и процветания мы должны понимать реальные издержки, чтобы не реализовывать подобный проект."
 FIJ_focus_funding_a_new_sector: "Финансирование нового сектора"
 FIJ_focus_funding_a_new_sector_desc: "Благодаря новым геологическим исследованиям нам удалось определить достаточно обширную территорию для разработки месторождения низкосортной железной руды. Наличие этого внутреннего источника поставок укрепит диверсификацию нашей экономики и позволит, по возможности, создать новые возможности."
 FIJ_focus_finding_homes_abroad: "Поиск жилья за границей"
 FIJ_focus_finding_homes_abroad_desc: "Некоторые из наших бездомных на удивление чрезмерно воспитаны и обладают социальными навыками, которые могли бы быть использованы на благо страны. Поэтому мы примем на работу этих квалифицированных, но недооцененных членов нашего общества и расширим Министерство иностранных дел. Используя пережитые ими трудности в качестве примера, мы сможем лучше завоевать симпатии простых людей в зарубежных странах. Таким образом, мы покажем миру идею фиджийской мечты."
 FIJ_focus_evaluating_military_requirements: "Оценка военных требований"
 FIJ_focus_evaluating_military_requirements_desc: "Технически армия никак не влияет на экономику. Однако и бездомные тоже. Поэтому, если бы мы могли искусственно повысить минимальный порог дохода, просто изменив стандарты и требования для поступления на военную службу, мы могли бы сократить число бездомных, укрепить национальную оборону и, кроме того, повысить квалификацию и компетентность армейского командования, поскольку у военнослужащих будет опыт службы в более крупных подразделениях. В итоге все останутся в выигрыше."
 FIJ_focus_reorganizing_homeless_shelters: "Реорганизация приюта для бездомных"
 FIJ_focus_reorganizing_homeless_shelters_desc: "Состояние некоторых наших программ социального обеспечения поистине шокирует. Мы должны реорганизовать финансирование и структуру этих учреждений, чтобы они могли более эффективно справляться с количеством людей, которым они могут комфортно помогать."
 FIJ_focus_naval_primacy_expected: "Ожидаемое военно-морское превосходство"
 FIJ_focus_naval_primacy_expected_desc: "Наша страна — островное государство, и для того, чтобы оказать реальное влияние на регион, мы должны вкладывать средства в наш военно-морской флот."
 FIJ_focus_synthetics_centric_research: "Исследования, ориентированные на синтетические материалы"
 FIJ_focus_synthetics_centric_research_desc: "Наш остров обладает огромным количеством природных ресурсов, проблема в том, что в масштабах всего мира их катастрофически не хватает. Зная об этой ключевой проблеме, мы можем искать пути развития ресурсов в будущем. Благодаря новаторским синтетическим технологиям мы могли бы создать собственную форму ограниченной автаркии, подобной которой мир еще не видел. Это небольшая деталь, но для нас это, тем не менее, предмет гордости нашей страны."
 FIJ_focus_streamlining_tax_code_expansions: "Упрощение расширения налогового кодекса"
 FIJ_focus_streamlining_tax_code_expansions_desc: "Парламентский законопроект T:101A упростит процесс и определит, какие виды налогов могут взиматься со всей страны. Мы надеемся, что создание единого стандарта позволит нашим предприятиям и населению стимулировать развитие таким образом, который, хотя и может обойти эти налоги, косвенно увеличит их сумму."
 FIJ_focus_building_tall: "Закон о строительстве высотных зданий"
 FIJ_focus_building_tall_desc: "В условиях ограниченного пространства и небольших размеров страны мы должны максимально эффективно использовать имеющиеся ресурсы. При этом мы стремимся к созданию новых, современных базовых условий, к которым должны быть привыкли наши люди. Автоматизация – это будущее, нравится нам это или нет, но вместо того, чтобы просто заменять людей, мы должны интегрировать людей с машинами. Это позволит расширить наши производственные мощности и сделать наш остров гораздо более эффективным, чем многие могут себе представить."
 FIJ_focus_promoting_a_frugal_lifestyle: "Продвижение бережливого образа жизни"
 FIJ_focus_promoting_a_frugal_lifestyle_desc: "Наше пространство ограничено, и возможности для развития острова невелики. Мы должны по-настоящему заботиться о сохранении природной красоты нашей земли, если хотим сохранить атмосферу туристического направления. Поэтому наши люди должны понимать, что нужно наслаждаться жизнью такой, какая она есть, искать хорошее в том, что у них есть, а не постоянно беспокоиться о том, что они якобы могли бы иметь. Оставьте материализм американцам, это не путь фиджийцев."
 FIJ_focus_exploiting_corporatism: "Эксплуатация корпоратизма"
 FIJ_focus_exploiting_corporatism_desc: "В нашей стране множество местных и зарубежных предприятий, которые вносят значительный вклад в ВВП. Однако, как показывает динамика человеческой природы, люди стремятся к власти и деньгам. Мы можем этим воспользоваться, сближаясь с ними, якобы беря взятки и тому подобное, но на самом деле используем эти деньги как своего рода военный фонд. Финансируем программы, которые могут оказаться неэффективными вне бюджетных сессий, поддерживаем мир во время возможных экономических спадов и делаем всё возможное. Конечно, они, вероятно, это поймут, но давайте наслаждаться этим, пока можем."
 FIJ_focus_neutral_selectivism: "Нейтральный селективизм"
 FIJ_focus_neutral_selectivism_desc: "Крупнейшие державы Тихоокеанского региона — Соединенные Штаты Америки и Китайская Народная Республика. Эти две страны рано или поздно начнут слишком сильно конфликтовать, поэтому мы должны быть вежливыми, но не стремиться к каким-либо преференциям. США с большей вероятностью будут инвестировать, но мы должны преподнести это таким образом, чтобы Китай захотел превзойти их. Играть роль лидеров, в то время как они косвенно будут создавать, так сказать, слабейших соперников."
 FIJ_focus_innovations_sector: "Стартапы в инновационном секторе"
 FIJ_focus_innovations_sector_desc: "В условиях отсутствия реальных запасов сырья нам необходимо осваивать различные рынки, отвечающие меняющимся потребностям мира. Наши технологические стартапы заложат основу для нашего проникновения в технологическую индустрию, позволяя нам продавать ценное программное обеспечение и другие продукты тем, кто предложит самую высокую цену."
 FIJ_focus_employment_commission: "Комиссия по вопросам занятости"
 FIJ_focus_employment_commission_desc: "Законопроект № 5436, также известный как Закон о трудоустройстве всех, предусматривает создание министерства занятости. Комиссия по вопросам занятости будет искать финансируемые государством инициативы, в рамках которых рабочие места могут напрямую финансироваться и поддерживаться, чтобы обеспечить тем, кто не имеет работы, реальную возможность трудоустройства. Первоначальные затраты будут выше, но со временем они будут компенсированы новыми налоговыми поступлениями и доходами от новых созданных предприятий."
 FIJ_focus_limited_fijian_naval_expansion: "Ограниченное расширение военно-морского флота Фиджи"
 FIJ_focus_limited_fijian_naval_expansion_desc: "Наша торговля и наши воды должны быть защищены. Пары торпедных катеров действительно недостаточно для обеспечения реальной обороны. Мы должны создать подлинное расширение ограниченных и оборонительных сил нашего флота, чтобы обеспечить безопасность нашего острова. Персонал и техника должны быть стандартизированы и усовершенствованы с учетом знаний, полученных в ходе внутренних и зарубежных миссий, в которых мы принимали участие."
 FIJ_focus_education_budget_expansion: "Расширение бюджета образования"
 FIJ_focus_education_budget_expansion_desc: "Расширение бюджета на образование позволит нам улучшить понимание нашими людьми окружающего мира и открыть новые возможности для будущих поколений."
 FIJ_focus_balancing_budgets: "Сбалансирование бюджетов"
 FIJ_focus_balancing_budgets_desc: "Мы видим, как наша страна развивается и процветает, но мы также наблюдаем тенденцию в бюджетной сфере. Если мы хотим стать настоящим образцом роста, мы должны быть гибкими в бюджетном плане и понимать, что мы можем сбалансировать бюджет там, где возникают перерасходы и дефициты."
 FIJ_focus_industrial_expansion: "Промышленное расширение"
 FIJ_focus_industrial_expansion_desc: "Уровень безработицы у нас рекордно низкий, и, что особенно важно, темпы эмиграции также низкие. Мы должны поддержать промышленное развитие, чтобы продолжить эту чудесную тенденцию в истории нашей страны."
 FIJ_focus_revitalization_of_foreign_perception: "Возрождение восприятия иностранного мира"
 FIJ_focus_revitalization_of_foreign_perception_desc: "Прогресс, которого достигла наша страна, способствует улучшению имиджа не только нашего народа, но и всего окружающего мира. Давайте по-настоящему насладимся этой новой эпохой нашего живописного островного рая."
 FIJ_focus_extracting_the_future: "Извлечение будущего"
 FIJ_focus_extracting_the_future_desc: "Новые технологии в геологической разведке и горнодобывающей промышленности, а также методы добычи позволили нам расширить понимание имеющихся ресурсов, которые мы действительно можем разрабатывать. Хотя некоторые, честно говоря, не в восторге от расширения горнодобывающих операций, это, тем не менее, ключевой фактор, который способствует росту и поддержанию стабильного и устойчивого экономического развития."
 FIJ_focus_wealthcare_act: "Закон о медицинском страховании богатства"
 FIJ_focus_wealthcare_act_desc: "В условиях стремительного роста благосостояния нашей страны вполне закономерно, что наши граждане заслуживают того же уровня медицинской помощи и доступа к пенсионным выплатам, что и страны, почти в 100 раз превосходящие нас по численности. Инвестиции и закупка оборудования и персонала позволят нам создать ту систему здравоохранения, к которой наша страна стремится уже почти десятилетия."
 FIJ_focus_military_radicals_force_a_junta: "Военные радикалы устанавливают хунту."
 FIJ_focus_military_radicals_force_a_junta_desc: "Под сильным внутренним давлением коммодор был вынужден установить хунту. Печальные новости повергли страну в беспорядки, но националисты объединились, чтобы навести порядок с помощью армии."
 FIJ_focus_martial_law_window: "Таймер военного положения"
 FIJ_focus_martial_law_window_desc: "Мы восстановим порядок в стране, а также возьмем на себя обязательство стабилизировать ситуацию в стране, оценивая наше положение. Введение военного положения на определенный период будет означать запрет на поездки в зарубежные страны и обратно в связи с обострением проблемы эмиграции. Многим это не понравится, но мы должны это перетерпеть."
 FIJ_focus_merging_police_forces: "Объединение полицейских сил"
 FIJ_focus_merging_police_forces_desc: "Разделение на военную и гражданскую полицию — это растрата ресурсов и дублирование командования. Поэтому мы объединим обе структуры, построим их под военным руководством и обеспечим единую цель — защиту нашей страны и ее народа во времена беспорядков и беззакония."
 FIJ_focus_militarized_politics: "Милитаризированная политика"
 FIJ_focus_militarized_politics_desc: "Государственная структура — это хорошая организация, и, немного подкорректировав и милитаризировав весь аппарат, мы действительно сможем превратить эту страну в хорошо отлаженный механизм. В конце концов, что такое парламент, если не гражданский аналог совещания генерального штаба или комнаты планирования?"
 FIJ_focus_weathering_the_political_storm: "Пережить политическую бурю"
 FIJ_focus_weathering_the_political_storm_desc: "Хотя мы еще не полностью выбрались из затруднительного положения, мы должны ослабить хватку на чрезмерном контроле. Мир уже настроен против нас из-за авторитаризма, который мы воплощаем в себе как военная хунта. Поэтому мы отменяем запрет на поездки и военное положение, а также принимаем первую официальную реформу после хаоса, вызванного переворотом, — Закон об ограничении медицинского обслуживания. Этот законопроект снизит расходы и прямые злоупотребления, которые сейчас наблюдаются в нашей медицинской сфере, и, надеюсь, этот жест положительно повлияет на ситуацию."
 FIJ_focus_transparency_in_requirements: "Закон о требованиях к прозрачности"
 FIJ_focus_transparency_in_requirements_desc: "Закон о требованиях к прозрачности (TRA) представляет собой масштабную реформу, направленную на повышение прозрачности нормотворчества и требований в гражданском и военном законодательстве. Это также затрагивает прозрачность требований, касающихся, например, порядка трудоустройства в гражданском обществе или порядка продвижения по службе и распределения обязанностей в вооруженных силах."
 FIJ_focus_fijian_service_means_fijian_respect: "Фиджийская служба, фиджийское уважение"
 FIJ_focus_fijian_service_means_fijian_respect_desc: "Обновление и прямое разъяснение кодекса поведения позволит уменьшить старые обиды. Ужесточение наказаний и демонстрация не только на бумаге, но и на практике того, что те, кто служит Фиджи, являются самими жителями Фиджи, помогут укрепить эти семейные узы и избавиться от влияния старого мира."
 FIJ_focus_constitutional_safeguard: "Конституционная гарантия"
 FIJ_focus_constitutional_safeguard_desc: "Наш народ не доверяет системе, и мы должны позволить им ей доверять. Поэтому мы примем поправку, которая устанавливает и объявляет преступлением в масштабах всей страны несправедливое обращение с гражданами Фиджи, независимо от их этнической принадлежности. С помощью этого указа мы надеемся положить конец десятилетиям раздоров, которые раскололи эту нацию."
 FIJ_focus_foreign_advisors: "Совет иностранных советников"
 FIJ_focus_foreign_advisors_desc: "В условиях, когда кажется, что весь мир против нас, мы должны искренне показать, что хотим поступать правильно по отношению к нашему народу и на благо окружающих. Поэтому, создав обширный гражданский и военный консультативный совет для помощи в восстановлении нашей страны, мы сможем открыть новые горизонты развития для нашего прекрасного островного государства."
 FIJ_focus_building_upon_our_civilian_base: "Опираясь на нашу гражданскую базу"
 FIJ_focus_building_upon_our_civilian_base_desc: "Наша экономика невелика по сравнению с численностью населения, не говоря уже о множестве проблем, связанных с этой общей нехваткой ресурсов. Поэтому целенаправленные инвестиции в развитие промышленной базы позволят нам обеспечить людей работой на благо страны, её целей и друг друга."
 FIJ_focus_starting_domestic_arms_companies: "Создание отечественных оружейных компаний"
 FIJ_focus_starting_domestic_arms_companies_desc: "Фиджийская армия, если подумать, ничем особенным не известна. Мы должны это изменить, и поэтому лучшим началом было бы создание собственных оружейных компаний внутри страны и формирование уникальной фиджийской военной идентичности. Возможно, нас никогда не будут сравнивать с Америкой, Германией и другими странами, но мы, безусловно, можем заявить о себе в регионе, где живем."
 FIJ_focus_bringing_jobs_back_to_fiji: "Возвращение людей и рабочих мест на Фиджи"
 FIJ_focus_bringing_jobs_back_to_fiji_desc: "Наши люди по-прежнему покидают страну, будь то для учебы, работы или по какой-либо другой причине. Мы по-прежнему страдаем от эмиграции, которая является серьезной проблемой для нашей страны. Поэтому мы должны более целенаправленно и эффективно инвестировать в решение проблем, вызывающих этот исход."
 FIJ_focus_establishing_the_university_of_fiji: "Основание Университета Фиджи"
 FIJ_focus_establishing_the_university_of_fiji_desc: "Образование... этот основополагающий столп общества должен быть одним из наших главных приоритетов при рассмотрении будущего нашей страны и народа. Этот столп имеет как гражданское, так и военное применение, которое, в свою очередь, будет реализовано в полной мере."
 FIJ_focus_fijian_care_act: "Закон Фиджи о национальной системе здравоохранения"
 FIJ_focus_fijian_care_act_desc: "Программа FNCA направлена на поддержку программ, затрагивающих жизнь нашего населения. Вопреки всей эмоциональной напряженности политического театра, пожилые люди создают гораздо больше проблем, чем они сами предполагают. Поэтому, если мы сможем обеспечить им комфортные условия жизни после выхода на пенсию и тому подобное, мы сможем лучше оценить потребности активного населения."
 FIJ_focus_increase_funding_for_the_fcoe: "Увеличьте финансирование FCoE."
 FIJ_focus_increase_funding_for_the_fcoe_desc: "Основой нашей стратегии гибридизации гражданского и военного секторов является Инженерный корпус Фиджи. Мы должны увеличить его финансирование, чтобы расширить его возможности и улучшить как военное, так и гражданское применение."
 FIJ_focus_deboning_healthcare_excesses: "Избавление от излишков в сфере здравоохранения"
 FIJ_focus_deboning_healthcare_excesses_desc: "Кто бы мог подумать, что если программы, остающиеся без контроля и надзора из-за десятилетий политического хаоса и постоянных правительственных смен, приведут к повсеместной коррупции и финансовым потерям? Необходима полная перестройка и, по сути, перезапуск нашей системы здравоохранения. Это позволит нам начать с чистого листа, что компенсирует нынешние перемены и покажет, что наша страна действительно находится на пути к восстановлению."
 FIJ_focus_national_rotc_curriculum: "Национальная программа ROTC"
 FIJ_focus_national_rotc_curriculum_desc: "В таких странах, как США, в некоторых школах существуют программы, управляемые военными ведомствами, в рамках которых учащимся преподаются уроки лидерства, применимые в гражданской жизни, через структуру, организованную в соответствии с военной структурой. Это будущее и главный аспект школьной системы, который нам необходим. С начала средней школы все школы будут следовать этому формату, и учащиеся выпускных классов будут организованы в так называемые подразделения. Развивая знания о сообществе, лидерстве и инновациях посредством командной работы, мы стремимся создать будущее, которое наша молодежь сможет по-настоящему понять и к которому сможет быть подготовлена."
 FIJ_focus_barracks_housing_initiative: "Инициатива по обеспечению жильем бараков"
 FIJ_focus_barracks_housing_initiative_desc: "Закон о базовом жилищном обеспечении (BHI Act) станет новым подходом к решению проблемы нехватки жилья в стране. Бездомные смогут поселиться в жилых помещениях, похожих на казармы, вместе с другими людьми, находящимися в аналогичном положении. В такой среде они смогут встать на ноги благодаря программе трудоустройства и армейскому распорядку, чтобы вернуть инициативу тем, кто считает, что система их бросила. Они будут постепенно увеличивать свой доход в рамках этой так называемой программы базовой подготовки, пока не найдут работу вне программы и не получат жилье за пределами казарменного комплекса."
 FIJ_focus_resource_extractions_act: "Закон о добыче ресурсов"
 FIJ_focus_resource_extractions_act_desc: "Закон о регулировании занятости (REA) будет отдавать приоритет бездомным и/или лицам, находящимся в исправительной системе, в поиске работы, чтобы они могли зарабатывать на жизнь и вносить свой вклад в развитие страны. Этим законом мы стремимся понять и расширить имеющиеся у нас внутренние ресурсы."
 FIJ_focus_expand_the_fcoe: "Расширение инженерного корпуса Фиджи"
 FIJ_focus_expand_the_fcoe_desc: "В условиях растущей потребности в новой инфраструктуре, жилье и экономике в целом, мы должны расширить ключевой элемент нашего моста. Этим ключевым элементом является Инженерный корпус Фиджи (FCoE). Расширение позволит ускорить и комплекснее решать задачи развития, поскольку больше ресурсов и людских сил начнут выделяться этому подразделению вооруженных сил."
 FIJ_focus_tax_rebalancing_act: "Закон о налоговом перебалансировании"
 FIJ_focus_tax_rebalancing_act_desc: "Военный парламент принял Закон о перебалансировке налогообложения, в соответствии с которым будет проведен общий обзор действующего налогового кодекса, что позволит нам исправить нелепые налоги, взимаемые с лиц, лишившихся жилья."
 FIJ_focus_expanding_the_ministry_of_science: "Расширение Министерства науки"
 FIJ_focus_expanding_the_ministry_of_science_desc: "Наша страна отстаёт от мира не только из-за своих небольших размеров, но и потому, что мы не занимаемся настоящими инновациями. Мы ищем иностранной помощи, как, например, создание нашего Консультативного совета по иностранным делам. Но этому придет конец, мы покажем миру, что можем чего-то добиться, и для этого мы вложим значительные средства в наше министерство науки и в общие возможности нашей страны в области исследований и разработок технологий."
 FIJ_focus_soldiers_lifestyle_act: "Закон об образе жизни солдата"
 FIJ_focus_soldiers_lifestyle_act_desc: "Парламент счел целесообразным принять указ, устанавливающий истинные минимальные требования к уровню жизни. Эти минимальные требования касаются среднего военнослужащего наших вооруженных сил. Это формирует национальное и межпоколенческое понимание того, чем могут наслаждаться наши люди, в ущерб тому, чего некоторые лишены."
 FIJ_focus_the_citizen_soldiers_act: "Закон о гражданских солдатах"
 FIJ_focus_the_citizen_soldiers_act_desc: "Парламент принял Закон о гражданах-солдатах, конституционную поправку, согласно которой каждый гражданин является солдатом нации, а каждый солдат — гражданином нации. Эта поправка, по сути, объявляет тех, кто служит Фиджи, фиджийцами, однозначно указывая на то, что понятие «быть фиджийцем» — это не просто псевдонаучная расовая или этническая чепуха, которую некоторые хотели бы выразить. Скорее, идея Фиджи или то, что значит быть фиджийцем, заключается в преданности нации и её идеям."
 FIJ_focus_energizing_the_nation: "Вдохновляя нацию"
 FIJ_focus_energizing_the_nation_desc: "Для того чтобы должным образом сбалансировать военные и гражданские потребности, нам потребуется расширить нашу энергетическую сеть. Стабильная энергосеть и снабжение топливом обеспечат стабильность и дальновидность на предстоящем пути."
 FIJ_focus_naval_industrialism: "Морская промышленность"
 FIJ_focus_naval_industrialism_desc: "Мы — островное государство, поэтому вполне естественно, что мы сосредотачиваем свою военную деятельность на производстве военно-морских судов. Иначе как бы мы могли завоевать расположение таких иностранных держав, как Америка, Австралия и другие, если бы оказались всего лишь раздутой военной базой?"
 FIJ_focus_energy_diversity_act: "Закон о разнообразии источников энергии"
 FIJ_focus_energy_diversity_act_desc: "Закон о разнообразии источников энергии (EDA) обяжет нас диверсифицировать нашу энергетическую сеть, чтобы сделать нашу страну более защищенной от иностранных спекулянтов. Полагаться исключительно на одну энергетическую корзину — это верный путь к мгновенному хаосу в случае любого нападения на нашу страну."
 FIJ_focus_mining_the_future: "Добыча полезных ископаемых: будущее"
 FIJ_focus_mining_the_future_desc: "Мы знаем, что у нас есть собственные ресурсы, и мы должны использовать их для улучшения нашей страны и предотвращения внешнего вмешательства в удовлетворение основных экономических потребностей."
 FIJ_focus_naval_priorities: "Военно-морские приоритеты"
 FIJ_focus_naval_priorities_desc: "Стремясь к эффективному и сбалансированному набору новобранцев в наши вооруженные силы, мы также понимаем, что в буквальном смысле находимся в изоляции. Поэтому увеличение финансирования будет в большей степени направлено на военно-морской флот, чем на другие рода войск, но не слишком сильно, поскольку нам не нужны нездоровые межведомственные конфликты."
 FIJ_focus_civilian_air_training: "Гражданская авиационная подготовка"
 FIJ_focus_civilian_air_training_desc: "Итак… мы знаем, что у нас довольно непростая история с военно-воздушными силами. Но мы не можем позволить прошлому диктовать наше нынешнее положение, не говоря уже о наших будущих планах. Поэтому мы будем использовать гражданские программы обучения и самолеты в качестве способа внедрения и начала первых шагов в развитии наших военно-воздушных сил. Это будет медленный процесс, но он необходим нам, если мы хотим выжить в современном мире."
 FIJ_focus_prussia_of_the_pacific: "Пасифика Пруссия"
 FIJ_focus_prussia_of_the_pacific_desc: "Наше государство — современное воплощение нации, подобной прусской. Объединение гражданского и военного образов жизни в единый сплоченный механизм создало для Фиджи новую эпоху. Мы небольшие, но гордые, мы строим высокие здания и громко заявляем о себе, мы — региональная держава, и мы, как и любая другая нация, заявим о себе."
 FIJ_focus_monarchist_acendence: "Монархическое господство"
 FIJ_focus_monarchist_acendence_desc: "Внутривоенные распри проложили путь к праведному пути нашей нации. Братья и сестры Фиджи, мы едины под Богом и под знаменем Фиджи. Мы сами вершители своей судьбы, демократия оказалась слишком нестабильной, чтобы существовать. Поэтому мы должны пойти на компромисс и создать новое общество, общество с национализмом, общество с военной мощью, общество, где быть фиджийцем — это больше, чем просто этническая принадлежность."
 FIJ_focus_the_kingdoms_quarrels: "Королевские ссоры"
 FIJ_focus_the_kingdoms_quarrels_desc: "Политическая ситуация в лучшем случае нестабильна, а в худшем — абсурдно плачевна. Нам необходимо сформировать кабинет министров, формализовать правительство и оценить самые серьезные проблемы нашей страны."
 FIJ_focus_the_kingdoms_economy: "Экономика Королевства"
 FIJ_focus_the_kingdoms_economy_desc: "Чтобы чего-то добиться в этом мире, нам нужна реальная экономика. Главное — это разнообразие, а вспомогательным фактором будет наличие подходящих людей для этой экономики. В целом, однако, нам нужно будет тщательно выбирать, куда двигаться дальше."
 FIJ_focus_the_ethnic_divides: "Этнические разногласия"
 FIJ_focus_the_ethnic_divides_desc: "Этнические разногласия в стране уходят корнями в ранний период английской колонизации. Многие колониальные подданные из Индии были ввезены на Фиджи для работы на сахарных плантациях и сахарных компаниях, которые пополняли английскую казну. Это разделение и вынужденная миграция создают напряженную обстановку с момента обретения нашей страной независимости в 1970-х годах. Поэтому решение этой проблемы должно стать одним из наших главных приоритетов, иначе мы не сможем удержаться у власти."
 FIJ_focus_police_standards_act: "Закон о стандартах полиции"
 FIJ_focus_police_standards_act_desc: "Парламент принял законопроект, который изменит стандарты работы полиции Фиджи. Все кодексы поведения будут доработаны и обновлены, а формулировки подчеркнут тот факт, что независимо от ситуации, любые действия должны оцениваться справедливо, исходя из сложившейся ситуации. Никакие акты агрессии не должны совершаться против гражданских лиц или граждан Фиджи, за исключением случаев угрозы личности или имуществу. Эти шаги призваны запустить правильный механизм."
 FIJ_focus_sponsored_emigration_deals: "Спонсируемые эмиграционные сделки"
 FIJ_focus_sponsored_emigration_deals_desc: "Хотя в краткосрочной перспективе это и дорого, в долгосрочной перспективе мы добьемся стабильности в стране гораздо быстрее... даже если это будет достигнуто нетрадиционными методами. Создав программы спонсируемой эмиграции для этнических индийцев, мы могли бы стремиться к сокращению и косвенной гомогенизации нашей страны и работать с теми, кто действительно хочет остаться. У каждого есть своя цена, но у каждого есть и выбор."
 FIJ_focus_hiring_practices_act: "Закон о практике найма персонала"
 FIJ_focus_hiring_practices_act_desc: "Был принят законопроект, стандартизирующий формулировки и подтверждающий законы о борьбе с дискриминацией. Похоже, что даже те немногие меры, которые мы предприняли, содержали немало лазеек, поэтому исправление ситуации позволит остановить эксплуатацию и дискриминацию всех граждан нашей прекрасной страны."
 FIJ_focus_equal_standard_care_act: "Закон о равных стандартах медицинского обслуживания"
 FIJ_focus_equal_standard_care_act_desc: "Закон о социальном обеспечении (ESCA) устанавливает основополагающие правовые нормы, согласно которым все виды ухода, будь то медицинский или социальный, государственный или частный, должны соответствовать одинаковым стандартам базового ухода. Мы должны обеспечить, чтобы независимо от того, кто болен или кто вышел на пенсию, граждане нашей страны получали необходимую помощь и пользовались ею независимо от своей этнической принадлежности."
 FIJ_focus_redrafting_the_constitution: "Переработка Конституции"
 FIJ_focus_redrafting_the_constitution_desc: "Прошло немало времени с тех пор, как была принята настоящая переработка конституции. Поэтому мы должны создать государственную структуру для управления страной. Мы должны заложить фундамент равенства и социальных свобод, на котором будет строиться наше государство, иначе в будущем мы рискуем рухнуть."
 FIJ_focus_addressing_the_brain_drain: "Решение проблемы утечки мозгов"
 FIJ_focus_addressing_the_brain_drain_desc: "Само существование нашей страны на данном этапе губительно. Наши люди бегут в поисках лучших возможностей и лучшего образа жизни. Если мы хотим развивать нашу страну, нам необходимо инвестировать в нее и заботиться о ней и ее народе."
 FIJ_focus_establishing_the_reseach_and_development_ministry: "Создание Министерства исследований и разработок"
 FIJ_focus_establishing_the_reseach_and_development_ministry_desc: "Создание и формализация Министерства исследований и разработок, или просто Министерства исследований, станет фундаментальной опорой нашего общества. Создание центра развития образования и инноваций в стране позволит нам лучше организовывать, финансировать и, собственно, внедрять инновации."
 FIJ_focus_employment_assistance_programs: "Программы содействия занятости"
 FIJ_focus_employment_assistance_programs_desc: "Высокий уровень безработицы в нашей стране и страх перед остановкой жизни из-за неблагоприятных событий могут стать мощным стимулом для отъезда людей. Поэтому мы должны разработать ряд профилактических программ, чтобы временно помочь гражданам перейти на новую работу. Это могут быть небольшие пособия на месяц, в течение которого у них может быть задолженность по счетам, или сайты по поиску работы, которые помогут быстрее найти трудоустройство. В конечном итоге это сгладит переход от занятости к безработице, не создавая у людей ощущения остановки жизни."
 FIJ_focus_specializing_medical_research: "Специализация в медицинских исследованиях"
 FIJ_focus_specializing_medical_research_desc: "Наших людей немного, поэтому каждая жизнь в нашей стране по сравнению с ними гораздо ценнее. Мы должны обеспечить, чтобы значительная часть наших исследований и разработок была направлена на разработку передовых технологий в медицинской сфере в целом. Да, это потребует затрат, но о наших людях нужно заботиться наилучшим образом, если мы хотим в полной мере использовать потенциал нашего населения."
 FIJ_focus_expanding_education_funding: "Расширение финансирования образования"
 FIJ_focus_expanding_education_funding_desc: "Увеличение общих инвестиций в национальную систему образования позволит нам воспитать новые поколения более образованных граждан. Полученные ими знания, в свою очередь, будут использованы для развития нашей страны и нашего будущего."
 FIJ_focus_creating_the_research_institute_of_fiji: "Создание Научно-исследовательского института Фиджи"
 FIJ_focus_creating_the_research_institute_of_fiji_desc: "Научно-исследовательский центр станет гордостью научного развития в Тихом океане. Наши инвестиции и целенаправленное стремление к инновациям позволят нашим сотрудникам захотеть остаться, стремиться к совершенствованию не только себя, но и всей страны в целом. Мы также можем использовать это учреждение как форму мягкой силы в военном развитии и проецировании национальной мощи."
 FIJ_focus_reviewing_the_housing_crisis: "Обзор жилищного кризиса"
 FIJ_focus_reviewing_the_housing_crisis_desc: "В развитых странах Запада жилищный кризис — это обвал рынка активов. Но в нашем случае жилищный кризис вызван растущей проблемой бездомности. Несмотря на небольшую численность населения, у нас проблема бездомности сопоставима с некоторыми странами Африки. Понимание этой пугающей реальности позволит нам принять решительные меры по решению этой растущей проблемы и, в свою очередь, возможно, предотвратить повторение подобной каскадной реакции... или, по крайней мере, уменьшить масштабы её повторения."
 FIJ_focus_increased_homeless_shelter_funding: "Увеличение финансирования приютов для бездомных"
 FIJ_focus_increased_homeless_shelter_funding_desc: "Наши нынешние программы помощи бездомным не получают достаточного финансирования для надлежащего ухода за нуждающимися. Прямые инвестиции в увеличение финансирования позволят нам лучше обеспечить качественную помощь этим гражданам в трудный для них период, пока они не встанут на ноги."
 FIJ_focus_royal_engineers_program: "Программа Королевских инженеров"
 FIJ_focus_royal_engineers_program_desc: "Программа REP позволит создать рынок труда для гражданских лиц в рамках Инженерного корпуса армии. Это гражданское подразделение Корпуса будет использоваться для проектов общественных работ, государственных строительных проектов и так далее. Идея заключается в создании базовой работы, которая позволит людям, потерявшим работу и рискующим потерять жилье, а следовательно, и средства к существованию, создать прочную основу, на которой наши граждане смогут стоять, не опасаясь падения в пропасть, из которой, как они боятся, им не выбраться."
 FIJ_focus_young_business_leaders_program: "Программа для молодых лидеров бизнеса"
 FIJ_focus_young_business_leaders_program_desc: "Программа YBL — это государственная инициатива, призванная вдохновлять и помогать новым и будущим лидерам бизнеса. Каждый может владеть и управлять собственным бизнесом, но те, кто действительно этого хочет, могут это сделать, присоединившись к программе YBL. Обучая деловым навыкам и предоставляя беспроцентные кредиты с последующим погашением, мы создаем благоприятную среду для развития и формирования будущих экономических основ."
 FIJ_focus_resource_development_initiative: "Инициатива по развитию ресурсов"
 FIJ_focus_resource_development_initiative_desc: "Инициатива по развитию ресурсов (RDI) — это государственная инициатива, направленная на диверсификацию наших внутренних ресурсов. Мы понимаем, что наши возможности ограничены, поскольку мы, по сути, остров. Однако это не означает, что у нас нет ничего ценного; напротив, у нас есть хорошее сочетание руд и минералов, что позволяет нам иметь хорошо диверсифицированную экономику. Но если мы хотим сохранить эту ситуацию в свою пользу, нам необходимо иметь больше собственных ресурсов."
 FIJ_focus_new_economic_planning_board: "Новый совет по экономическому планированию"
 FIJ_focus_new_economic_planning_board_desc: "Совет по экономическому планированию (EPB) поможет градостроителям и инвесторам, как иностранным, так и отечественным, создать новую и постоянно развивающуюся экономику. Это позволит нам привлечь новый капитал и оказывать ограниченное влияние на экономику, поддерживая иностранные компании и экспортируя произведенную нами продукцию."
 FIJ_focus_ensuring_a_steeling_future: "Обеспечение будущего, полного стали"
 FIJ_focus_ensuring_a_steeling_future_desc: "Наличие достаточного количества стали в отечественных руках позволяет нам, по сути, функционировать. Сталь — один из основных ресурсов и материалов, составляющих современный мир, в котором мы живем. Таким образом, обеспечение внутренних поставок позволяет нам сохранять определенную экономическую независимость."
 FIJ_focus_phase_one_business_development: "Этап 1. Развитие бизнеса."
 FIJ_focus_phase_one_business_development_desc: "Первые результаты нашего экономического возрождения уже проявляются, и поэтому мы очень скоро сможем наслаждаться процветанием."
 FIJ_focus_oiling_our_nation: "Нефтяная промышленность нашей страны"
 FIJ_focus_oiling_our_nation_desc: "Благодаря масштабным исследованиям и изысканиям мы смогли направить наш план на обеспечение внутренних поставок нефти. Это краеугольный камень современной эпохи, который обеспечит наше будущее, а также наши энергетические и нефтехимические потребности."
 FIJ_focus_diversifying_the_naval_industries: "Диверсификация военно-морской промышленности"
 FIJ_focus_diversifying_the_naval_industries_desc: "У нас развита сильная судостроительная промышленность, но мы должны диверсифицировать её и способствовать расширению как гражданской, так и военной промышленности на нашем острове. Мы должны иметь возможность заявить о своих правах на территорию нашей страны и обеспечить её конкурентоспособность по отношению к другим государствам."
 FIJ_focus_rubber_banding_the_nation: "«Резиновая лента» нации"
 FIJ_focus_rubber_banding_the_nation_desc: "Благодаря прорывам в синтетических технологиях нам удалось обеспечить значительные внутренние поставки каучука из ограниченного запаса натурального каучука, который мы производим специально для этих целей. Это может обойтись нам немного дороже, но в долгосрочной перспективе этот импульс обеспечит еще один шаг к максимально возможной степени автаркии, которую мы действительно можем себе позволить."
 FIJ_focus_phase_two_business_development: "Этап 2. Развитие бизнеса."
 FIJ_focus_phase_two_business_development_desc: "Постоянные инвестиции, направленные на улучшение роста бизнеса и расширение нашей экономики, несомненно, позволят нам развиваться стабильными темпами."
 FIJ_focus_pacific_economics_exchange_commission: "Тихоокеанская экономическая комиссия"
 FIJ_focus_pacific_economics_exchange_commission_desc: "Наше стремление к региональному признанию и создание определенных проблем для конкурирующих держав в Тихом океане станет нашим главным достижением. Тихоокеанская экономическая комиссия по обмену опытом является инструментом сотрудничества между нашей страной и другими странами региона Тихого океана. Цель комиссии — содействие более тесному сотрудничеству и единству между нами и другими островными государствами, чтобы, по крайней мере, установить общий статус-кво в плане применения мягкой силы."
 FIJ_focus_royal_military_expansion_program: "Королевская военная программа расширения"
 FIJ_focus_royal_military_expansion_program_desc: "Расширение и увеличение финансирования наших вооруженных сил позволит нам расширить масштабы внутренней безопасности и миссий по поддержке зарубежных стран. Более того, с ростом численности армии мы сможем привить чувство долга и чести перед нашей страной и ее народом, тем самым формируя будущие поколения."
 FIJ_focus_royal_military_contracts: "Королевские военные контракты"
 FIJ_focus_royal_military_contracts_desc: "Программы RMC будут представлять собой программу стимулирования развития отечественного производства вооружений. Хотя это и немалый шаг, он позволит нам надлежащим образом снабжать нашу армию, улучшать подготовку кадров и сокращать общее время, необходимое для обучения."
 FIJ_focus_royal_fijian_dream: "Королевская фиджийская мечта"
 FIJ_focus_royal_fijian_dream_desc: "Королевская фиджийская мечта – это мечта о прошлом, но о том, чтобы жить в соответствии с современными стандартами. Это подтверждение конституционного заявления о том, что краеугольный камень нашей демократии будет сохранен, но названия должностей и титулы будут просто изменены. Да, это просто добавление косметического эффекта к нашему способу правления, но разве это обесценивает наши обязательства заботиться о нашей стране и ее народе? Конечно, нет. Иногда небольшое похлопывание по плечу может творить чудеса с теми, кто не всегда может доверять себе."
 FIJ_focus_technate_council_emerges: "Создан Совет Техната"
 FIJ_focus_technate_council_emerges_desc: "На Фиджи многие выдающиеся технические специалисты получили образование за рубежом. Совет Технологического Союза — это группа уважаемых экономистов, ученых и других технических экспертов, объединившихся в собственный властный блок. В условиях, казалось бы, бесконечного хаоса и фракционности, Совет Технологического Союза использовал свои связи и влияние для подавления лидеров фракций прямыми или косвенными способами. В результате совет взял на себя руководство страной и будет стремиться превратить Фиджи в образец человеческой изобретательности и инноваций."
 FIJ_focus_a_technocratic_constitution: "Технократическая конституция"
 FIJ_focus_a_technocratic_constitution_desc: "Основной принцип любой технократии заключается в том, что правящий орган работает на благо всего вида, а не его отдельных подвидов. Поэтому мы планируем пересмотреть конституцию нашей страны и создать первую в истории технократическую конституцию. Основные моменты мы можем разобрать по ходу работы над её пересмотром, но достаточно сказать, что сейчас главное заключается в том, что, хотя мы называем себя фиджийцами и имеем национальное государство под названием Фиджи, отныне любой человек, находящийся под управлением этого государства, будет рассматриваться как равный. Люди — это люди, мы — наш вид, и мы должны работать вместе, чтобы укрепить будущее и прогресс нашего вида."
 FIJ_focus_human_treatment_amendment: "Поправка об обращении с людьми"
 FIJ_focus_human_treatment_amendment_desc: "Поправка об обращении с людьми чётко гласит, что любой представитель человеческого вида, независимо от различий, будет рассматриваться как человек. Это означает, что любые несправедливые действия, причиненные другому представителю вида из-за различий в убеждениях, внешности или личной идентичности в рамках известных научных знаний, будут сурово наказываться в соответствии с законами, изложенными в уголовном кодексе."
 FIJ_focus_voting_requirements_amendment: "Поправка к требованиям к голосованию"
 FIJ_focus_voting_requirements_amendment_desc: "Поправка к требованиям к голосованию — это простое и понятное решение проблемы голосования в современную эпоху демократических государств. Возраст, дающий право голоса, составит 18 лет — юридически признанный возраст совершеннолетия, позволяющий осознавать личную ответственность за свой выбор и действия. Все зарегистрированные граждане страны будут иметь право голоса, чтобы предотвратить злонамеренное использование иностранными противниками открытости, которая может быть достигнута в условиях прямой демократии. Голосование будет осуществляться через правительственный веб-сайт, доступ к которому можно получить дома, по телефону или в местном административном здании. Избиратели должны будут ввести свой идентификационный номер гражданина, чтобы предотвратить двойное голосование и другие злонамеренные действия, препятствующие голосованию."
 FIJ_focus_working_standards_amendment: "Поправка к трудовым стандартам"
 FIJ_focus_working_standards_amendment_desc: "Поправка к стандартам рабочей среды и условий труда отражает новое направление, в котором мы хотим двигать страну. Главное условие — немедленный анализ и внедрение гибкого графика работы. Он более известен как график «4 и 4». Стандартная рабочая неделя для наших граждан будет составлять 4 часа в день, 4 дня в неделю. Внедрение этого формата, очевидно, займет время, но он обеспечит максимальную занятость, удержание и удовлетворенность работников."
 FIJ_focus_funding_our_future: "Финансирование нашего будущего"
 FIJ_focus_funding_our_future_desc: "Суть нашего пути к технократическому будущему заключается в обеспечении того, чтобы будущие поколения адаптировались к информации окружающего мира и за его пределами. Некоторые лучше воспринимают информацию визуально, другие — на практике. Но всё это — шкала, и если мы не сможем следовать этой шкале, мы создадим касту людей и только навредим им, не заботясь по-настоящему о том, как они могут учиться и адаптироваться."
 FIJ_focus_growing_our_manufacturing_base: "Расширение нашей производственной базы"
 FIJ_focus_growing_our_manufacturing_base_desc: "Для достижения прогресса в будущем нам необходимо развиваться не только как нация, но и как экономика в целом. Это положит начало целенаправленному развитию экономики, которое, в свою очередь, будет опираться на социальное развитие и инвестиции."
 FIJ_focus_building_the_institute_of_automation: "Строительство Института автоматизации"
 FIJ_focus_building_the_institute_of_automation_desc: "Программа «Исследовательский рай» (RPP) — это проект, который выведет нашу страну, а впоследствии и весь человеческий вид на этой планете, в будущее, о котором мы думаем. Начиная с Института автоматизации, мы будем использовать это учреждение для внедрения инноваций и проведения исследований в области автоматизации и интеграции новых технологий и методов, которые позволят нам создавать, производить и развивать новое. Устанавливая планку для создания большего количества вещей по более низким и быстрым ценам, мы надеемся обеспечить каждому, где это возможно, новый уровень жизни, невиданный со времен послевоенной эпохи."
 FIJ_focus_dedicated_welfare_funding: "Целевое финансирование социального обеспечения"
 FIJ_focus_dedicated_welfare_funding_desc: "Если мы хотим, чтобы наши граждане были продуктивными и сотрудничали, мы должны также заботиться о них. Уважение – это улица с двусторонним движением, и независимо от эмоционального воздействия мы все являемся представителями одного вида, поэтому по конституционному указу мы должны заботиться друг о друге как о таковых."
 FIJ_focus_tech_industrial_investments: "Технологические и промышленные инвестиции"
 FIJ_focus_tech_industrial_investments_desc: "Наше понимание глобальной экономики в целом ясно показывает, что именно в технологической сфере происходят самые важные вещи. Зная это, мы можем включиться в игру и интегрировать это в нашу программу «Исследовательский рай»."
 FIJ_focus_institute_for_resource_development: "Институт развития ресурсов"
 FIJ_focus_institute_for_resource_development_desc: "Институт развития ресурсов (IRD) направит свои исследования на изучение способов добычи, переработки и синтеза ресурсов. Эта модернизация и целенаправленная работа заложат основу для нашего развития в условиях экономической автаркии и позволят миру увидеть, что мы можем создать лучшее будущее."
 FIJ_focus_institute_for_energy_development: "Институт развития энергетики"
 FIJ_focus_institute_for_energy_development_desc: "Целью создания ИЭД будет разработка новых способов производства энергии. Это также включает в себя повышение эффективности и производительности этих новых методов производства в целом. Таким образом, это новое расширение программы «Исследовательский рай» поможет обеспечить большую энергетическую независимость от иностранных держав."
 FIJ_focus_labour_corps: "Трудовой корпус"
 FIJ_focus_labour_corps_desc: "Трудовой корпус — это спонсируемая правительством инициатива по организации и определению приоритетов в развитии и строительстве новых общественных объектов и новой инфраструктуры в целом. Эта гражданская организация, подобная военной, позволит нам строить с такой скоростью, которая недоступна ни одной развитой стране. Это станет возможным благодаря организации и оптимизации нормативных актов, а также благодаря тому, как мы напрямую решаем проблемы и добиваемся их решения."
 FIJ_focus_labour_prison_program: "Программа трудового заключения"
 FIJ_focus_labour_prison_program_desc: "Программа реабилитации заключенных (LPP) — это философия реабилитации в рамках системы уголовного правосудия. Лица, совершившие преступления и находящиеся в заключении, получают базовый уход и внимание. Однако все заключенные могут быть зачислены в программу LP, в рамках которой им предоставляется возможность выполнять работу, за которую они могут зарабатывать энергетические кредиты. Эти кредиты можно обменять на определенное количество, так называемых, улучшений, чтобы сократить минимальный срок заключения до более приемлемого уровня. После покупки всех необходимых улучшений, в зависимости от совершенного преступления, заключенный может обменять определенное количество энергетических кредитов, чтобы сократить свой срок. Хотя на начальном этапе эта ставка будет направлена на то, чтобы удержать их в программе, в конечном итоге цель состоит в том, чтобы поощрять реабилитацию посредством работы и самоотдачи и подготовить заключенных к возвращению в общество."
 FIJ_focus_increasing_domestic_steel: "Увеличение объемов производства отечественной стали"
 FIJ_focus_increasing_domestic_steel_desc: "Благодаря масштабным исследованиям и изысканиям нам удалось добиться прорыва в развитии отечественного производства стали. Хотя это и не много, тем не менее, это хорошая отправная точка для достижения большей самодостаточности."
 FIJ_focus_technocratic_militarism: "Технократический милитаризм"
 FIJ_focus_technocratic_militarism_desc: "Объединяющим принципом в истории нашего вида является долг и честь перед родиной и теми, кто ей служит. Мы должны уделить должное внимание исследованиям и разработкам, направленным на укрепление нашей армии. Возможно, это не сравняет нас, скажем, с такими странами, как Франция, Германия и так далее, но, по крайней мере, мы могли бы создать уменьшенную копию американской армии. Мечтать не вредно… мечтать не вредно."
 FIJ_focus_research_paradise_program: "Программа «Исследовательский рай»"
 FIJ_focus_research_paradise_program_desc: "После почти трех лет разработки мы наконец можем представить нашу главную цель. Программа «Рай для исследований» станет краеугольным камнем мирового научного сообщества и, используя значительные средства, создаст своего рода центр отдыха для исследователей из всех областей, где они смогут учиться, экспериментировать и изучать свои научные интересы. Мы создадим мир, в котором STEM-области будут восприниматься не только как будущее, но и как нечто столь же приятное, как обычный отпуск."
 FIJ_focus_promoting_domestic_energy_synthetics: "Содействие развитию отечественного производства синтетической энергии"
 FIJ_focus_promoting_domestic_energy_synthetics_desc: "Прорывы в области синтетических технологий привели к росту внутреннего предложения нефти. Это внутреннее предложение будет и дальше способствовать росту нашей экономики, поскольку, помимо использования в энергетике, оно также будет стимулировать развитие нашей нефтехимической промышленности в целом."
 FIJ_focus_technocratic_health_act: "Технократический закон о здравоохранении"
 FIJ_focus_technocratic_health_act_desc: "Совет принял законопроект о развитии здравоохранения (THA), который предусматривает общее расширение нашей системы здравоохранения. Это позволит нам лучше лечить и заботиться о населении в целом. Мы должны иметь возможность строить высотные здания, а для этого нам необходимо иметь население, как по численности, так и по мотивации, которое захочет строить."
 FIJ_focus_industrial_diversity_act: "Закон о промышленном многообразии"
 FIJ_focus_industrial_diversity_act_desc: "Закон о промышленном многообразии (IDA) видит дальнейшую диверсификацию нашей гражданской экономики. Благодаря постоянным усилиям Института мы смогли по-настоящему развить нашу страну."
 FIJ_focus_family_care_act: "Закон об уходе за семьей"
 FIJ_focus_family_care_act_desc: "Этот указ отражает ключевое понимание того, что для здоровой социальной сплоченности семья, независимо от ее состава, является краеугольным камнем любого общества. Поэтому мы должны перестроить наши программы социального обеспечения, чтобы поддерживать и сохранять этот краеугольный камень и укреплять структуру нашего общества."
 FIJ_focus_research_plan_alchemy: "План исследований по алхимии"
 FIJ_focus_research_plan_alchemy_desc: "Наш самый амбициозный план на сегодняшний день. Исследовательский план «Алхимия» обойдется примерно в треть нашего ВВП, но мы считаем, что у нас есть необходимые базовые знания для попытки молекулярной реорганизации. Проще говоря, это будет почти эквивалентно самой алхимии. Хотя эта технология будет крайне нестабильной и дорогостоящей, если мы действительно сможем ее реализовать, мы сможем открыть для себя почти истинную форму экономической автаркии."
 FIJ_focus_research_plan_armory: "Оружейная по разработке плана исследований"
 FIJ_focus_research_plan_armory_desc: "Наша армия должна соответствовать уровню развития гражданского сектора. Хотя мы не можем просто разместить на поле боя все наши лучшие изобретения, как минимум, мы можем повысить уровень боевых возможностей и выживания наших военнослужащих. Конечно, это потребует значительных затрат, но в конечном итоге это улучшит общую безопасность нашей страны."
 FIJ_focus_research_plan_biomedical: "План исследований в области биомедицины"
 FIJ_focus_research_plan_biomedical_desc: "Программа «Биомедицина» по сути выводит наши биологические и медицинские технологии и оборудование на такой уровень, который, как мы надеемся, продлит среднюю продолжительность жизни еще на 20 лет. Протезирование и усовершенствования в генной инженерии в целом позволят пожилым людям оставаться более здоровыми и сильными, несмотря на возраст. Мы надеемся стать своего рода зонтиком и действительно защитить наших граждан в новую эпоху биомедицинских инноваций."
 FIJ_focus_naval_innovations: "Военно-морские инновации"
 FIJ_focus_naval_innovations_desc: "Наши вооруженные силы — это не просто армия; только специально созданное внутреннее подразделение, занимающееся военно-морскими инновациями, позволит Фиджи контролировать свои национальные воды."
 FIJ_focus_expansion_of_welfare_programs: "Расширение программ социального обеспечения"
 FIJ_focus_expansion_of_welfare_programs_desc: "Расширение спектра наших программ социального обеспечения позволит оказывать разнообразную и внимательную помощь в решении ряда постоянных проблем, сохраняющихся в современном мире."
 FIJ_focus_research_plan_synthetic: "План исследования (синтетический)"
 FIJ_focus_research_plan_synthetic_desc: "План «Синтетика» — это комплексный подход к совершенствованию нашей программы по производству синтетических материалов, который позволит нам наладить внутреннее производство резиноподобных изделий. Ценой ограничения импорта каучука и увеличения инвестиций в исследования мы можем ожидать некоторого подъема в нашей экономике и обществе в целом благодаря этому дополнительному источнику ресурсов. Еще один шаг, который мы предпринимаем..."
 FIJ_focus_civilian_corp_of_engineers: "Гражданский инженерный корпус"
 FIJ_focus_civilian_corp_of_engineers_desc: "CCE — это гражданское подразделение Инженерного корпуса Фиджи. Цель состоит в том, чтобы разграничить гражданские и военные проекты и расставить приоритеты. Однако при необходимости эти две группы могут объединиться, что будет иметь косвенное военное применение."
 FIJ_focus_research_plan_autarky: "План исследований по автаркии"
 FIJ_focus_research_plan_autarky_desc: "Благодаря многолетним масштабным исследованиям, планированию и инвестициям мы наконец-то добились настоящего прорыва. Прорыва, который практически в полной мере укрепляет нашу экономическую автаркию. Теперь мы можем достичь чего угодно, возможно, звезды больше не являются для нас пределом."
 FIJ_focus_research_plan_feast: "План исследования Пир"
 FIJ_focus_research_plan_feast_desc: "Для обеспечения нашего роста как вида и общества мы должны обеспечить самые необходимые условия жизни. Одним из ключевых факторов является продовольствие, которое обеспечит стабильность общества, рост населения и укрепление «мягкой силы» над большинством стран. Мы можем найти способы увеличить адресную иностранную помощь и возглавить мир в борьбе с бедностью и нехваткой продовольствия. Фиджи станет краеугольным камнем глобального единства."
 FIJ_focus_research_plan_nucleus: "Ядро исследовательского плана"
 FIJ_focus_research_plan_nucleus_desc: "Будущее уже наступило. В ядерной инженерии достигнуто столько успехов, что просто жалко, что тактика запугивания по-прежнему преобладает, отвратительно игнорируя очевидные реалии производства энергии. Поэтому мы, конечно же, ценой больших затрат, установим новый глобальный стандарт того, как на самом деле строить ядерный реактор. Эффективный, действенный и способный производить больше энергии, чем площадь, которую он контролирует. Мы установим этот истинный и самый безопасный стандарт, который посрамит любую страну с сомнительным прошлым в области ядерной энергетики. За технократию, будущее, в котором нуждается наш вид, но которого почему-то, кажется, он не хочет."