 currency_news.1.t: "Bitcoin Goes Live"
 currency_news.1.d: "The first block of a new currency called Bitcoin has been mined. Its supporters believe money need not depend on a central bank, though few people know what a bitcoin is worth. Investors see the chance of a windfall; central bankers worry that such an unpredictable reserve could leave prices at home harder to control."
 currency_news.1.a: "A new currency has arrived."