 adf_acq_astuirement_program: "Программа закупок Сил обороны Австралии"
 the_white_paper: "Белая книга 2000 года"
 the_white_paper_desc: "Документ «Оборона 2000» был подготовлен как всесторонний обзор наших нынешних военных возможностей, а также тех, которые требуются нынешней администрации. В условиях растущего значения роли Австралии как основного поставщика услуг в области безопасности и миротворчества в Тихоокеанском регионе, основные требования сводятся к расширению военных возможностей."
 the_second_white_paper_1: "Второй Белый документ"
 the_second_white_paper_1_desc: "Вслед за успехом первого документа, Силам обороны Австралии было поручено осуществить ряд более масштабных программ и провести реструктуризацию для дальнейшего удовлетворения потребностей обороны Тихоокеанского региона."
 ast_we_are_many_tt: "Он §Gбудущее§! Демографическая ситуация в нашей стране находится в наших руках."
 sol_islands_intervention: "Региональная миссия помощи Соломоновым островам"
 sol_islands_intervention_desc: "Ситуация в стране сейчас, безусловно, далека от идеальной. Бандиты и столкновения между боевиками стали обычным явлением, государственные службы развалились, а оставшаяся полиция расколота между враждующими группировками. Для восстановления порядка на островах необходимы масштабные и оперативные меры по стабилизации и восстановлению."
 sol_situation_countdown: "Ситуация ухудшается..."
 organise_occupation_force: "Организовать оккупационные силы"
 organise_occupation_force_desc: "Прежде чем начинать какие-либо крупные операции, необходимо создать оккупационные силы. В настоящее время ряд других стран пообещали свою поддержку, но основная часть сил должна быть нашей. Две тысячи военнослужащих и около двухсот человек, прошедших подготовку для миротворческих операций, будут обеспечивать правопорядок на острове."
 operation_anode: "Операция Анод"
 operation_anode_desc: "Наше крупное наступление на острова будет проводиться в несколько этапов, частично с моря, частично с воздуха с использованием наших вертолетов «Чинук». Первоочередной задачей станет захват ряда ключевых позиций на острове, которые будут служить логистическими и передовыми оперативными центрами. Затем мы сможем приступить к восстановительным работам. Мы называем это «Операция Хелем Френ» (Helpem Fren), что на их языке означает «помощь другу»."
 secure_honiara: "Безопасная Хониара"
 secure_weather_coast: "Безопасное побережье с хорошей погодой"
 secure_rural_guadalcanal: "Безопасный сельский Тамбеа"
 secure_malaita_province: "Обеспечьте безопасность провинции Малаита"
 sol_disarm_the_militias: "Разоружить ополчение"
 sol_red_cross: "Скоординируйте свои действия с Красным Крестом."
 sol_red_cross_desc: "Красный Крест уже имеет значительное присутствие на острове. Координация действий с ним позволит нашим командам оказывать помощь и эвакуировать находящихся в опасности гражданских лиц."
 negotiate_with_the_militias: "Вести переговоры с боевиками."
 negotiate_with_the_militias_desc: "Переговоры с вооруженными боевиками вряд ли можно назвать стабилизирующей миссией, но если мы обратимся к более разумным из них с предложением организовать прекращение огня, это может дать нам больше времени."
 disband_the_local_police: "Расформировать местную полицию"
 disband_the_local_police_desc: "Местная полиция на островах погрязла в коррупции и междоусобицах до такой степени, что больше не служит народу. Нам необходимо расформировать существующую структуру правоохранительных органов, если мы хотим что-то исправить."
 rebuild_the_local_policeforce: "Восстановить местные полицейские силы"
 rebuild_the_local_policeforce_desc: "Для восстановления правоохранительных органов в стране нам потребуется создать многонациональную комиссию комиссаров, которая начнет проверку и обучение новых сотрудников, а также обеспечит гарантии бесперебойной работы в будущем."
 run_anticorruption_campaign: "Проведение антикоррупционных кампаний"
 run_anticorruption_campaign_desc: "В настоящее время политическая система страны едва функционирует, не говоря уже о беспринципности. Немногие из оставшихся у власти безупречны. Необходимо начать общенациональную кампанию по борьбе с незаконными действиями, а затем можно будет заняться созданием новых основ."
 recruit_public_servants: "Набор государственных служащих"
 recruit_public_servants_desc: "В рамках наших усилий по устранению недостатков, для работы в новом правительстве на временной основе будут наняты государственные служащие из участвующих стран, а в дальнейшем планируется их замена местными специалистами. Этот внешний опыт поможет правительству в его быстром восстановлении."
 reorganise_the_army: "Реорганизовать армию"
 reorganise_the_army_desc: "С момента обретения независимости в 1978 году в стране не было эффективных постоянных вооруженных сил. То немногое, что у неё было, включало в себя подразделение морского наблюдения и несколько военнослужащих, переданных из расформированной полиции. Хотя наши миротворцы возьмут на себя роль постоянной армии, мы можем начать подготовку местных подразделений, чтобы они могли снять с нас часть нагрузки и оказывать помощь в операциях."
 loans_to_the_new_government: "Кредиты новому правительству"
 loans_to_the_new_government_desc: "Пока мы продолжаем разрабатывать новую систему управления для Соломоновых островов, их международный долг остается непогашенным. Мы предоставим им кредит на оплату труда нового персонала и восстановление правительства."
 send_our_reconstruction_teams: "Отправьте наши ремонтные бригады"
 send_our_reconstruction_teams_desc: "Ситуация улучшилась настолько, что мы можем безопасно направить наши ремонтные бригады для оказания помощи в восстановлении и строительстве объектов коммунальной инфраструктуры."
 sol_intervention: "На Соломоновых островах продолжается интервенция."
 sol_intervention_success: "Данная инициатива оказалась успешной."
 the_financial_crisis_ast: "Финансовый кризис"
 the_financial_crisis_ast_desc: "Подпитываемый хищническим кредитованием по ипотечным кредитам с высоким риском невозврата и отсутствием регулирования, крупнейший в истории США пузырь на рынке недвижимости лопнул, и остальной мир остался ни с чем."
