 sell_dasfleet: "出售联邦政府车队"
 sell_reserve_bank_assets: "出售储备银行资产"
 ast_industry_decisions: "工业项目"
 ast_industry_decisions_desc: "由政府主导的产业项目使我们能够在减轻私营企业压力的同时，直接提高国内生产能力。"
 lng_megaproject_1: "昆士兰州戈尔贡液化天然气项目"
