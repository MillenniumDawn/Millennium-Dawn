 SOV_bringing_oligarchs_back_TT: "이 중점을 완료하면 §Y올리가르히§!가 러시아로 돌아오는 과정이 시작됩니다."
 SOV_nazbol_inner_modifier: "[SOV.GetNameWithFlag]의 내부 정책"
 SOV_nazbol_inner_modifier_desc: "The policy of National Bolshevik Russia is the result of revanchism for two destroyed empires at once: the USSR and the Russian Empire. No negotiations, only war."
 SOV_navalny_inner_modifier: "새로운 러시아의 국내 정치"
 SOV_navalny_inner_modifier_desc: "자유주의자 집권 하의 정책은 러시아의 경제 성장에 집중하고 군사적, 정치적 행동에는 덜 집중하는 것이 특징입니다."
 SOV_koba_politic_modifier: "공공 안전의 개념"
 SOV_koba_politic_modifier_desc: "공공 안전의 개념은 우리가 왜 행복하거나 불행한지, 왜 건강하거나 병드는지, 왜 어떤 이는 운이 좋고 어떤 이는 그렇지 않은지, 그리고 이에 어떻게 영향을 미칠 수 있는지를 이해하게 해 줍니다. 이는 무엇이 선이고 악인지, 무엇이 수치이고 양심인지, 직관이란 무엇이며 왜 어떤 이는 그에 귀를 기울이고 다른 이는 그렇지 않은지, 운명을 바꾸는 것이 정말 어려운 일인지에 대한 질문의 해답입니다."
 SOV_koba_attack_tooltip: "£text_icon_jreci §0이집트 사제§!에 대한 피해 증가: §G+5.00%§!\n"
 SOV_jreci_swiss_tooltip: "§Y[SWI.GetNameWithFlag]§!의 모든 £text_icon_jreci §0이집트 사제§!가 발각되어 파괴될 것입니다! §t아무도 우리에게서 숨지 못할 것입니다§!.\n"
 SOV_jreci_israel_tooltip: "§Y[ISR.GetNameWithFlag]§!의 모든 £text_icon_jreci §0이집트 사제§!가 발각되어 파괴될 것입니다! §t아무도 우리에게서 숨지 못할 것입니다§!.\n"
 SOV_jreci_egy_tooltip: "§Y[EGY.GetNameWithFlag]§!의 모든 £text_icon_jreci §0이집트 사제§!가 발각되어 파괴될 것입니다! §t아무도 우리에게서 숨지 못할 것입니다§!.\n"
 SOV_jreci_usa_tooltip: "£text_icon_corrector §0예측 교정자§!가 §t마침내 파괴될 것입니다§! 그는 §Y[USA.GetNameWithFlag]§!에 숨어 있습니다.\n"
 SOV_jreci_1_tooltip: "마침내 £text_icon_jreci §0이집트 사제§!와 £text_icon_corrector §0예측 교정자§!의 음모에 관한 진짜 진실을 아는 정부가 §Y[SOV.GetNameWithFlag]§!에 집권했습니다.\n"
 SOV_jreci_2_tooltip: "모든 러시아군은 장차 누구와 싸워야 하는지 알 수 있도록 재교육을 받아야 합니다. £text_icon_corrector §0예측 교정자§!의 하수인들과 말입니다.\n"
 SOV_jreci_3_tooltip: "모든 의원, 관료 및 기타 지역 관리자는 £text_icon_jreci §0이집트 사제§!의 첩자에 맞서 싸우는 특별 이론 과정을 이수하게 됩니다.\n"
 SOV_jreci_4_tooltip: "§t올리가르히§!는 러시아를 붕괴시키기 위해 £text_icon_corrector §0예측 교정자§!가 보낸 £text_icon_jreci §0이집트 사제§!의 진짜 첩자들입니다. 이 일을 끝내도록 합시다.\n"
 SOV_jreci_5_tooltip: "§t새로운 종교§!는 £text_icon_corrector §0예측 교정자§!의 하수인들과의 전쟁에서 승리하는 열쇠입니다.\n"
 SOV_jreci_6_tooltip: "§t인터넷 선전§!은 마침내 £text_icon_jreci §0이집트 사제§!가 감추어 온 진짜 진실을 우리 시민들에게 보여 주기 시작할 것입니다.\n"
 SOV_jreci_7_tooltip: "우리에게 필요한 것은 오직 §t진실!§!뿐입니다.\n"
 SOV_jreci_8_tooltip: "£text_icon_corrector §0예측 교정자§!를 물리치려면 공중과 지상에서만 우위에 서서는 안 됩니다. 우리는 우주의 지배자가 되어야 합니다!\n"
 SOV_jreci_9_tooltip: "진정한 러시아 전사는 §t비탸지§!입니다. 우리는 적에 맞설 신성한 군대를 준비하기 위해 바로 이 계층을 재건할 것입니다.\n"
 SOV_jreci_10_tooltip: "§t볼셰비즘§!은 정의와 평화에 대한 열망으로서 러시아인에게 자연스러운 것이기도 합니다.\n"
 SOV_jreci_11_tooltip: "헌법을 다시 쓰고, £text_icon_jreci §0이집트 사제§!가 우리에게 강요하여 써넣게 한 모든 것을 내던집시다.\n"
 SOV_jreci_12_tooltip: "스탈린은 §t현자§!였으며, £text_icon_corrector §0예측 교정자§!에 의한 러시아 정복을 늦춘 것은 바로 그의 방식이었습니다. 이제 옛 방식을 기억할 때입니다.\n"
 SOV_jreci_13_tooltip: "『§t죽은 물§!』이라는 책은 모든 러시아인의 필독서입니다 \n"
 SOV_jreci_14_tooltip: "어머니 러시아 안에서 £text_icon_jreci §0이집트 사제§!를 찾아낼 때입니다. 그러면 우리는 온 세상을 그들로부터 해방시킬 것입니다 \n"
 SOV_jreci_15_tooltip: "£text_icon_corrector §0예측 교정자§!의 서방 첩자들은 우리 러시아에서 파괴되거나 추방될 것입니다 \n"
 SOV_jreci_16_tooltip: "일어나라, 루스여! £text_icon_jreci §0이집트 사제§!의 족쇄를 타도하라!\n"
 SOV_jreci_17_tooltip: "슬라브 형제단은 £text_icon_corrector §0예측 교정자§!의 천년 숙적입니다\n"
 SOV_jreci_18_tooltip: "우리의 £text_icon_jreci £text_icon_corrector §t적들§!에 맞서 싸울 새로운 동맹\n"
