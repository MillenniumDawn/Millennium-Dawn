 USA_100_f35_progress_TT: "El Progreso del Programa F-35 está en 100%"
 USA_f35_submitted_tech: "Al menos una pieza de tecnología debe ser enviada"
 USA_f35_apply_TT: "Aunque nadie será invitado inicialmente, los países aún pueden solicitar la membresía. Esto nos permite elegir y elegir más específicamente quién obtiene el F-35."
 USA_f35_program_decisions: "Programa F-35"
 USA_f35_program_decisions_desc: "\n£desctext_nato_plane\n\n\n\nCon el anuncio del §HPrograma F-35§!, [USA.GetFlag] los Estados Unidos han podido mostrarle al mundo que no tienen planes de frenar el desarrollo de nuevas armas y tecnologías. [USA.GetFlag] Los Estados Unidos pueden aceptar o expulsar a los miembros del §HPrograma F-35§! como mejor les parezca. Por lo general, esto solo ocurre si los miembros han caído en desgracia. Cada miembro del programa puede invertir fondos y cuantos más fondos inviertan, más §HF-35§! recibirán una vez que se haya completado el programa. La investigación sobre las piezas utilizadas en el §HF-35§! también conducirá a un mayor progreso, independientemente de quién lo haya investigado.\n\nFinalización del programa: §H[?USA.USA_f35_progress]%§!"
 USA_announce_completion_of_f35: "Anunciar la Finalización del Programa F-35"
 USA_announce_completion_of_f35_desc: "Los ingenieros de Lockheed Martin han demostrado verdaderamente que su salario supera su moralidad."
 USA_invest_in_the_program: "Inversiones para el Programa"
 USA_invest_in_the_program_desc: "Nuestros contratistas requieren financiamiento para mantener el programa en movimiento, y al asignar más dinero, podremos tener el avión en nuestras manos más rápidamente."
 USA_kick_out_of_program: "Eliminar a [FROM.GetName] del Programa F-35"
 USA_kick_out_of_program_desc: "Claramente no podemos confiar en que [FROM.GetName] mantenga la integridad de nuestro programa, y por lo tanto deben ser eliminados."
 USA_open_removals: "Abrir Lista de Miembros del Programa F-35"
 USA_open_removals_desc: "Abrirá decisiones para eliminar a un miembro específico del programa f-35. Este menú también sirve como una lista de quién está en el programa."
 USA_close_removals: "Cerrar Lista de Miembros del Programa F-35"
 USA_expansion_of_the_program: "Expansión del Programa"
 USA_expansion_of_the_program_desc: "In order to secure additional funding for the program, we can promise our international partners the ability to acquire the F-35 if they contribute."
 USA_put_forward_frame_tech: "Enviar Investigación de Armazón"
 USA_put_forward_frame_tech_desc: "Al investigar el armazón que podría usar el F-35, podremos aumentar la velocidad del programa."
 USA_put_forward_counter_measure_tech: "Enviar Investigación de Sistemas de Contramedidas"
 USA_put_forward_counter_measure_tech_desc: "El F-35 requerirá algunas contramedidas avanzadas para dominar los cielos, y al proporcionar nuestra investigación a nuestros socios, el programa se acelerará enormemente."
 USA_put_forward_radar_tech: "Enviar Investigación de Radar"
 USA_put_forward_radar_tech_desc: "Sin un radar adecuado, el F-35 será como cualquier otra aeronave en el cielo. Debemos hacer que se destaque y que sea único."
 NATO_ask_to_join_f35_program: "Pedir Unirse al Programa F-35"
 NATO_ask_to_join_f35_program_desc: "We can ask the United States to invite us to their F-35 program, so that we may finally be able to acquire some of the world's most advanced fighter jets."
 NATO_ask_to_join_f35_program2: "Solicitar unirse al Programa F-35"
 NATO_ask_to_join_f35_program2_desc: "Podemos pedir a Estados Unidos que nos invite a su programa F-35, para que finalmente podamos adquirir algunos de los cazas más avanzados del mundo."
 USA_place_orders_for_f35_contributors: "Reclamar nuestros F-35"
 USA_place_orders_for_f35_contributors_desc: "Al haber sido un contribuyente temprano del programa, podremos reclamar los F-35 que merecemos."
 USA_place_orders_for_f35: "Realizar pedido de F-35"
 USA_place_orders_for_f35_desc: "By placing an order for the F-35, we will be able to take full advantage of the program and all of its benefits."
 small_f35a_order: "Small F-35A Order in Production"
 small_f35b_order: "Small F-35B Order in Production"
 large_f35a_order: "Large F-35A Order in Production"
 large_f35b_order: "Large F-35B Order in Production"
 USA_american_economic_decisions_category: "La economía estadounidense"
 USA_american_economic_decisions_category_desc: "The American economy is the world's largest and one of the strongest economies in the world. However, that does not mean it doesn't have its weaknesses. It is mainly service based as the majority of American businesses look elsewhere for cheaper labor. The economy is also tied-in very closely with American politics. Conducting business in America is expensive but extremely profitable. §YWall Street§! is also partially to blame. The businessmen and women in New York are some of the most powerful individuals in America. It is best to keep them in check and on the government's good side or else.\n\n§YStrength of Wall Street:§! [?USA.USA_strength_of_wall_street_var|17.0] of 50\n§YStrength of Regulations:§! [?USA.USA_economic_regulation_var|45.0] of 100"
 USA_resource_steel_factories_decision: "Expandir fábricas de acero"
 USA_resource_steel_factories_decision_desc: "Gran parte de la industria siderúrgica estadounidense se ha subcontratado en los últimos 40-50 años. Podría estar en nuestro mejor interés traer parte del trabajo de vuelta aquí e invertir en nuestras empresas siderúrgicas."
 USA_resource_aluminimum_prospecting_decision: "Explotar depósitos de bauxita"
 USA_resource_aluminimum_prospecting_decision_desc: "Los depósitos de bauxita alrededor de Estados Unidos necesitan ser explotados. Invertir en este recurso podría ayudar a promover una mayor autosuficiencia en todo el país."
 USA_resource_techmetals_prospecting_decision: "Prospección de Metales Tecnológicos"
 USA_resource_techmetals_prospecting_decision_desc: "Electronics require a large number of very specific materials such as lithium, gold, tungsten, and silver. We should prospect a bit more around the Rockies and Appalachians."
 USA_regulate_wall_street_decision: "Aprobar regulación de Wall Street"
 USA_regulate_wall_street_decision_desc: "§YWall Street§! ha tenido demasiadas ventajas durante mucho tiempo. Deberíamos esforzarnos por mejorar las regulaciones en los sectores financieros."
 USA_deregulate_wall_street_decision: "Desregular el sector financiero"
 USA_deregulate_wall_street_decision_desc: "Our regulations are currently far too tight on the financial sectors. Easing them up should improve investment from domestic and foreign investors."
 USA_industrial_outsourcing_decision: "Subcontratación industrial"
 USA_industrial_outsourcing_decision_desc: "Las regulaciones han hecho que el costo de hacer negocios en Estados Unidos supere con creces su valor. Tal vez fomentar algo de subcontratación podría mejorar en general el precio y la demanda de trabajadores estadounidenses."
 USA_spurring_economic_growth_decision: "Estimular el crecimiento económico"
 USA_spurring_economic_growth_decision_desc: "La economía se ha estancado en cierta medida recientemente. Deberíamos introducir alguna nueva legislación para desregular o utilizar políticas monetarias/fiscales para aumentar el crecimiento económico."
 USA_bring_microsoft_to_court_decision: "Llevar a Microsoft a los tribunales"
 USA_bring_microsoft_to_court_decision_desc: "Microsoft ha podido adquirir empresas tecnológicas más pequeñas sin oposición en el último año. Algunos de los asesores económicos sugieren que llevemos a Microsoft a los tribunales para evitar que se expandan aún más."
 USA_finish_keystone_and_dakota_pipelines: "Finalización de los oleoductos Keystone y Dakota"
 USA_finish_keystone_and_dakota_pipelines_desc: "Debemos trabajar y apuntar a la finalización de los oleoductos Keystone. Estas arterias económicas críticas unirán los corazones palpitantes de las economías estadounidense y canadiense aún más. Como tal, también creará más cohesión entre los hermanos norteamericanos. Quién sabe, tal vez en el futuro podamos hacer algo con nuestro hermano del sur también."
 USA_america_first_energy_plan: "Ley de Energía Estadounidense para Necesidades Estadounidenses"
 USA_america_first_energy_plan_desc: "La ley AEAN es un proyecto de ley integral para abordar directamente la producción, exportación y consumo de energía nacional. Ajustaremos los detalles y, con suerte, podremos satisfacer más de nuestras necesidades nacionales sin comprometer nuestras obligaciones internacionales."
 USA_open_public_lands_to_fracking: "Abrir tierras públicas para el fracking"
 USA_open_public_lands_to_fracking_desc: "Con la creciente demanda de energía tanto a nivel nacional como mundial, debemos buscar nuevas formas de mantenernos al día con nuestra demanda, así como ser competitivos en el escenario mundial. Podríamos recibir críticas de los ecologistas por esto, pero al final nos lo agradecerán."
 USA_expanding_alumninum_flag: "Actualmente expandiendo la producción de §YAluminio§!"
 USA_expanding_techmetals_flag: "Actualmente expandiendo la producción de §YMetales Tecnológicos§!"
 USA_is_territory_flag: "es un territorio de §YEstados Unidos§!"
 USA_has_wall_street_faction_TT: "Tiene facción interna §YWall Street§!"
 USA_not_expanded_states_resources_three_times_TT: "No ha expandido este §Yrecurso§! §G3§! §Yveces§!"
 USA_deregulate_wall_street_decision_tt: "§YFuerza de las Regulaciones§! es mayor que §Y10§!\n"
 USA_regulate_wall_street_decision_tt: "§YFuerza de las Regulaciones§! es menor que §Y90§!\n"
 USA_allowed_microsoft_merger: "Permitió la fusión de §YMicrosoft§!"
 USA_less_than_30_regulation_tt: "§YFuerza de las Regulaciones§! es menor que §Y30§!\n"
 USA_greater_than_20_regulation_tt: "§YFuerza de las Regulaciones§! es mayor que §Y20§!\n"
 USA_greater_than_40_regulation_tt: "§YFuerza de las Regulaciones§! es mayor que §Y40§!\n"
 USA_greater_than_60_regulation_tt: "§YFuerza de las Regulaciones§! es mayor que §Y60§!\n"
 USA_greater_than_80_regulation_tt: "§YFuerza de las Regulaciones§! es mayor que §Y80§!\n"
 USA_congress_md: "Congreso"
 USA_congress_md_desc: "El Capitolio tiene sus propias reglas e ideas. Tendremos que trabajar con ellos para que las cosas sucedan, pero hay formas de asegurarnos de tener un Congreso comprensivo y de apoyo con el que trabajar."
 USA_political_pandering: "Política complaciente"
 USA_political_pandering_desc: "The lobbyist wing of congress can be very, persuasive when need be."
 USA_statehood_for_guam: "Otorgar la condición de estado a Guam"
 USA_statehood_for_guam_desc: "§YGuam§! es otro gran territorio organizado en los §Y[USA.GetNameWithFlag]§! desde 1898. Aunque el movimiento para convertirse en estado no es tan grande como el de §YPuerto Rico§!, sigue siendo otro candidato viable para convertirse en el estado número 51 de los Estados Unidos."
 USA_communist_state_renaming: "Renombrar los estados"
 USA_communist_state_renaming_desc: "Hay muchos estados en Estados Unidos que representan muchas cosas. Algunos de los cuales representan cosas que no pertenecen a nuestros grandes Estados Comunistas de América!"
 donald_trump.8.t: "Lanzamiento de la Iniciativa de Minería de Asteroides"
 donald_trump.8.d: "La minería de asteroides ha sido una fantasía para muchos antes que nosotros. Los propios asteroides llevan metales del grupo del platino, oro, plata y metales del grupo del hierro muy deseados. Podría volverse extremadamente lucrativo para cualquier país con capacidades espaciales. Entonces, hoy, el establecimiento de una Iniciativa de Minería de Asteroides, o AMI, proporcionará el primer paso hacia la minería de asteroides. Utilizando vastas matrices de telescopios en todo Estados Unidos, podemos buscar asteroides adecuados en el espacio exterior cercano, luego llevarlo a órbita y extraerlo. Detectar un asteroide adecuado será difícil, ya que, en relación con la distancia a la que se encuentran, son bastante pequeños. Afortunadamente, hay bastantes que pasan cerca de la Tierra de vez en cuando, por lo que no llevará mucho tiempo conseguir que uno se quede en la órbita de la Tierra."
 donald_trump.8.o1: "Solo necesitamos esperar un asteroide..."
 donald_trump.9.t: "Asteroide detectado"
 donald_trump.9.d: "Recientemente, nuestros científicos de la NASA detectaron un asteroide adecuado que pasaba cerca de la Tierra. Esto ha sido un alivio para la AMI, ya que algunos dudaban si alguna vez detectaríamos un asteroide adecuado y económico. Sin embargo, este asteroide se mueve lo suficientemente lento, es lo suficientemente grande y es lo suficientemente rico como para ser llevado a órbita y extraído. De hecho, el asteroide es más grande que el estado de Nueva York. El siguiente paso es simplemente mover este asteroide a la órbita alrededor de la Tierra, lo cual nunca antes se había hecho. Mientras tanto, los ingenieros de la NASA y también empresas privadas como SpaceX han inventado mecanismos para extraer el asteroide, por lo que estarán listos cuando el asteroide entre en órbita."
 donald_trump.9.o1: "Vamos a poner a ese bebé en órbita"
 donald_trump.10.t: "Asteroide en órbita"
 donald_trump.10.d: "With the asteroid in orbit, NASA and SpaceX are both sending missions to the orbiting asteroid. NASA is mainly concerned about collecting scientific data, while SpaceX is more concerned about mining the material. No doubt this is a noteworthy achievement, which gives us an edge in space. There is even talk about bringing in more asteroids, but many say that additional asteroids can come later, as this asteroid is very large and well suited for mining. Other countries are already looking at us with envy, and are considering their own asteroid mining programs. The costs are extremely high even to develop the technology to even get there, so there is little worry among SpaceX or NASA that competition will arrive."
 donald_trump.10.o1: "La minería comenzará"
 donald_trump.11.t: "Las ganancias de la minería comienzan a llegar"
 donald_trump.11.d: "After establishing mining operations, SpaceX and NASA have both sent back their first shipments of space-material to labs and markets around the globe. The world has jealously looked on us, and there have been open talks in their respective chambers of legislation about opening their own asteroid mining operations. While we soon may get competition, we can enjoy the monopoly for now."
 donald_trump.11.o1: "Hurra!"
 donald_trump.12.t: "Ganancias de la minería de asteroides"
 donald_trump.12.d: "Los envíos más recientes de nuestras operaciones de minería de asteroides han llegado y han generado muchos ingresos. Estos envíos incluyen platino, oro y plata. Utilizar los ingresos de manera efectiva sería sabio."
 donald_trump.12.o1: "Excelente!"
 donald_trump.13.t: "Potencial para la minería de asteroides"
 donald_trump.13.d: "Recientemente, Donald Trump ha permitido que la NASA y SpaceX, una empresa espacial privada, lleven un asteroide bastante grande a la órbita de la Tierra y lo extraigan. Nuestros asesores recomiendan que invirtamos en este nuevo espacio, ya que podría permitir que materiales raros se entreguen directamente a nuestro país. Algunos, sin embargo, han citado la factura masiva que Estados Unidos tuvo que pagar solo para comenzar las operaciones y se oponen a expandirse en el espacio. El retorno de esta inversión depende, pero podría tomar 25 años solo para alcanzar el punto de equilibrio. Una inversión más sustancial puede reducir esto, pero estaremos muy por detrás de Estados Unidos durante bastante tiempo.\n\n¿Qué debemos hacer con respecto a la minería de asteroides? ¿Iniciar un programa nacional o ignorarlo por completo?"
 donald_trump.13.o1: "Invertir en minería de asteroides"
 donald_trump.13.o2: "Demasiado caro y una pérdida de nuestro tiempo!"
 donald_trump.23.t: "Misión a Marte"
 donald_trump.23.d: "Señor Presidente, con la financiación asegurada y los planes completos, ahora podemos preparar a un grupo de hombres y mujeres para soportar la inmensa presión y soledad en el espacio para llegar a Marte.\n\nAfortunadamente, la NASA ha estado preparándose para un viaje así durante años, simplemente no ha tenido la financiación para lanzar un programa completo. El entrenamiento adicional de los astronautas actuales y la preparación del cohete comenzarán en serio.\n\nEste proceso tomará aproximadamente un año para completarse. Mientras tanto, los científicos en los laboratorios de la NASA están preparando equipos científicos para ser enviados junto con los astronautas a Marte para recopilar datos científicos útiles que no se pueden lograr con un rover. Recuerde, SpaceX puede intentar llegar allí primero al escuchar el anuncio."
 donald_trump.23.o1: "Los preparativos comenzarán"
 donald_trump.24.t: "Carrera espacial"
 donald_trump.24.d: "In a recent news release, SpaceX has decided to launch its own program to get to Mars in under a year. Now, if SpaceX gets there first, it will still be an achievement that you can use for additional investment into space, however, it will be... let's just say... not as politically convenient.\n\nThis new Space Race for Mars will require additional investment if we are wanting to secure victory first, however, some experts argue that Elon Musk's program lacks certain aspects required to go to Mars with a crewed mission there and back. We may just be able to get to Mars first without assigning additional funds to NASA.\n\nWhat is your directive, Mr. President?"
 donald_trump.24.o1: "Es la Carrera Espacial!"
 donald_trump.24.o2: "Continuar al ritmo actual"
 donald_trump.14.t: "Misión a Marte lista"
 donald_trump.14.d: "La NASA acaba de enviar la confirmación de que los astronautas, el equipo y el cohete están listos. Hay seis astronautas en particular que se dirigen a Marte con un viaje de regreso. Los astronautas que se dirigen a Marte son los siguientes: Michael, Paul, Edward, Rodney, Mary y Anne. Estos astronautas se han preparado durante los últimos dos años y son los astronautas más aptos para esta misión. El cohete, el reciente Sistema de Lanzamiento Espacial de la NASA, está listo para ser lanzado. La cápsula, la Cápsula Espacial Orion, también está lista.\n\nAfortunadamente, la próxima ventana de lanzamiento es en 30 días."
 donald_trump.14.o1: "30 días hasta el lanzamiento!"
 donald_trump.15.t: "En la plataforma de lanzamiento"
 donald_trump.15.d: "[GetDateText]:\nNuestros seis astronautas están listos. Será un viaje largo y difícil, pero están preparados para ello. Paul parece especialmente emocionado por la perspectiva, mientras que el resto de la tripulación está nerviosa, especialmente Rodney, aunque dispuesto.\n\nLos astronautas están en el cohete, listos para despegar hacia el espacio. Dieron sus despedidas a familiares y amigos, ya que no los verán en persona durante casi dos años. Todos están optimistas de una misión exitosa.\n\nLa cuenta regresiva ha comenzado, con el lanzamiento confirmado."
 donald_trump.15.o1: "3, 2, 1..."
 donald_trump.16.t: "Despegue!"
 donald_trump.16.d: "Launch Control has certified liftoff, and the rocket and crew are heading to Mars! People's heads are towards the sky, as the rocket heads for orbit. Its crew are both ecstatic and relieved, as it's a perfect launch. Everything has worked so far, and there is much hope that it will continue to work for months to come.\n\nThe dream is near complete."
 donald_trump.16.o1: "Un día emocionante en la historia"
 donald_trump.17.t: "Desastre!"
 donald_trump.17.d: "El cohete ha explotado!\n\nResulta que las verificaciones finales esenciales fueron inadecuadas para evitar una catástrofe. Se ha informado que los seis miembros de la tripulación, Michael, Paul, Edward, Rodney, Mary y Anne, han muerto en esta calamidad. Los espectadores en el suelo miran con incredulidad mientras las llamas envuelven la plataforma de lanzamiento. Debilitará en gran medida la voluntad del espacio en el futuro cercano y será una mancha en su presidencia."
 donald_trump.17.o1: "Un accidente fatal"
 donald_trump.18.t: "Locura en el espacio"
 donald_trump.18.d: "It turns out that prolonged periods in isolation with only five others to talk to are not suitable at all for the human psyche.\n\nDespite going through severe training before-hand, one astronaut, Michael, went mentally insane and attempted to manually control the craft to return to Earth as soon as possible. Anne, the only other person awake at the time, attempted to get in his way and halt him, however, she was unable to wrestle him away from the controls. While she was attempting to do this, Michael punched Anne in the jaw, knocking her unconscious.\n\nFortunately, the other crew members were wakened by the disorder, and immediately jumped to aid Anne. A quick struggle ensued where the control panel was slightly dented, however, everything remains operational and Michael is now in a makeshift prison with makeshift handcuffs. Additional good news, Anne was not permanently injured, and will be able to recover within a week on the vessel. Whether she has long term damage would have to be investigated by doctors at home.\n\nThe bad news is that the rocket is widely off-course. Additionally, a lot of fuel was burned in Michael's hasty attempt to return to Earth.\n\nThere are two options: Return to Earth with all the astronauts, arresting Michael for assault and endangering five other lives, or send them on a one way trip to Mars. The five astronauts have expressed that they are willing to sacrifice themselves for the good of humanity.\n\nMr. President. What is your choice?"
 donald_trump.18.o1: "Si los astronautas restantes están listos para ello, entonces déjenlos ir"
 donald_trump.18.o2: "Llevemos a nuestros hombres y mujeres a casa y arrestemos a ese hijo de puta"
 donald_trump.19.t: "Regreso avergonzado"
 donald_trump.19.d: "Hace meses, un altercado a bordo del cohete a Marte obligó a los astronautas a bordo a regresar a la Tierra para evitar un viaje solo de ida. Anne ha sido enviada al hospital para investigar si tiene lesiones no descubiertas por la tripulación y Michael ha sido arrestado y probablemente será enviado a un hospital psiquiátrico. Los otros astronautas, excepto Mary, han ofrecido nuevamente sus servicios al espacio, mientras que Mary ha decidido retirarse de su carrera como astronauta antes de tiempo. Todos están contentos de estar vivos en casa.\n\nEste es probablemente el final de cualquier programa gubernamental para enviar humanos a Marte durante bastante tiempo."
 donald_trump.19.o1: "Desafortunado, pero al menos están vivos"
 donald_trump.20.t: "Sacrificio en Marte"
 donald_trump.20.d: "Hace semanas, un altercado a bordo del cohete a Marte obligó a los astronautas a tomar la difícil decisión de comprometerse con un viaje solo de ida a Marte. Han aterrizado y han explorado la superficie marciana. Solo tienen un tiempo limitado para vivir, por lo que pretenden aprovecharlo al máximo. Resultarán oportunidades de investigación significativas, sin embargo, esto tiene un costo de vidas humanas. Varados y sin una fuente permanente de alimentos, la tripulación morirá de hambre y morirá en Marte, dejando sus cuerpos en la superficie hasta que, con suerte, algún día, un equipo llegue a Marte para recuperarlos y darles un entierro adecuado en la Tierra. Hasta entonces, yacerán allí por la eternidad."
 donald_trump.20.o1: "Mártires en Marte"
 donald_trump.21.t: "El águila ha aterrizado"
 donald_trump.21.d1: "El aterrizaje en Marte es un éxito! La tripulación a bordo está alegre y los espectadores en casa en la Tierra están tan emocionados como siempre por el viaje espacial. Se quedarán aquí unos días, tomando muestras científicas y experimentos, antes de regresar a la Tierra. La emoción por el espacio asegurará que las futuras misiones al espacio sean políticamente fáciles de hacer y mejorarán la popularidad de su presidencia. Sin embargo, Estados Unidos ahora, una vez más, está presionando los límites del espacio."
 donald_trump.21.d2: "El aterrizaje de la NASA en Marte, el segundo aterrizaje exitoso en Marte, es un éxito! La tripulación a bordo está jubilosa y los espectadores en casa en la Tierra, con este y el aterrizaje de SpaceX, están tan emocionados como siempre por el viaje espacial. Se quedarán aquí unos días, tomando muestras científicas y experimentos, antes de regresar a la Tierra. La emoción por el espacio asegurará que las futuras misiones espaciales sean políticamente fáciles de hacer y aumentará la popularidad de su presidencia. Sin embargo, Estados Unidos, tanto el sector público como el privado, ahora, una vez más, está presionando los límites del espacio."
 donald_trump.21.o1: "Hip Hip Hurra por EE.UU.!"
 donald_trump.21.o2: "Ser segundo no es tan malo"
 donald_trump.22.t: "Regreso Heroico"
 donald_trump.22.d1: "Michael, Paul, Edward, Rodney, Mary y Anne han regresado a casa sanos y salvos en un viaje que quedará en los libros de historia como uno de los vuelos espaciales más importantes jamás realizados. Traen de vuelta innumerables rocas y datos invaluables que serán procesados en laboratorios de todo el mundo. Con suerte, esto allanará el camino para la futura colonización de Marte."
 donald_trump.22.d2: "A pesar de ser los segundos, Michael, Paul, Edward, Rodney, Mary y Anne han regresado a casa sanos y salvos en un viaje de ida y vuelta a Marte. Traen de vuelta innumerables rocas y datos invaluables que serán procesados en laboratorios de todo el mundo. Con suerte, esto, junto con el aterrizaje de SpaceX, allanará el camino para la futura colonización de Marte."
 donald_trump.22.o1: "Nuestros héroes están en casa"
 donald_trump.22.o2: "Están en casa"
 donald_trump.25.t: "SpaceX Llega a Marte"
 donald_trump.25.d1: "Despite our best efforts, SpaceX has managed to land on Mars first, beating us in the space race. They have landed their Starship on the Martian surface. This task for a private company was a huge undertaking, and we applaud them just for getting to Mars first, before NASA with its huge financial advantage. We still celebrate this occasion, as it will bring many new discoveries to the sciences of space exploration and Mars."
 donald_trump.25.d2: "SpaceX is the second organization to land on Mars. They have landed their Starship on the Martian surface. This task for a private company was a huge undertaking, and we applaud them just for getting to Mars, just after NASA with its huge financial advantage. We still celebrate this occasion, since it will hopefully lead to successes in the future for SpaceX and Elon Musk."
 donald_trump.25.d3: "SpaceX is the second organization to land on Mars, albeit it will likely be the first to do a successful round trip. They have landed their Starship on the Martian surface, near the site where we landed our doomed mission, and are taking the bodies home, much to the relief of their families at home. This task for a private company was a huge undertaking, and we applaud them just for getting to Mars. We still celebrate this occasion, since it will hopefully lead to successes in the future for SpaceX and Elon Musk."
 donald_trump.25.o1: "Independientemente de quién lo haga primero, sigue siendo un logro increíble"
 donald_trump.25.o2: "Sigue siendo un logro increíble"
 donald_trump.26.t: "Puesto de avanzada en la Luna"
 donald_trump.26.d: "Nuestros científicos e ingenieros están listos para enviar astronautas y equipos para vivir semipermanentemente en la Luna. Se enviará un total de aproximadamente 12 astronautas, junto con decenas de millones de dólares en equipos, suministros, espacios para vivir y artículos personales. Este puesto de avanzada deberá moverse regularmente, ya que el día lunar dura 29 días terrestres, lo cual es demasiado largo para que las baterías mantengan la energía almacenada en la Luna.\n\nLa base en sí estará en los polos, fácilmente movible, para obtener el máximo uso de nuestros paneles solares. Además, se llevarán a cabo experimentos para determinar las condiciones de vida a largo plazo en la Luna. La extracción de hielo lunar no solo podría conducir a agua líquida para plantas y alimentos para astronautas en la Luna, sino también a su separación en oxígeno e hidrógeno, combustible para cohetes.\n\nEsto puede tomar meses o años para obtener la investigación necesaria para hacer esto. Sin embargo, dentro de este tiempo, utilizando los fondos para este proyecto, construiremos un depósito en órbita alrededor de la Luna para permitir un acceso más fácil a la Luna y el reabastecimiento de combustible para llegar a la Tierra.\n\nTodo esto es alcanzable dentro de la próxima década. Ahora, sin embargo, es el momento de lanzar."
 donald_trump.26.o1: "Lanzar!"
 donald_trump.27.t: "Base Lunar Alpha"
 donald_trump.27.d: "Nuestros científicos e ingenieros han aterrizado oficialmente en la Luna y actualmente están en el proceso de configurar la base lunar. Cada sección está dividida en \"módulos\", no exactamente edificios por sí mismos, pero no juntos como uno solo. Hay un módulo de habitación, para descansar, un módulo de alimentos, para cultivar alimentos, un módulo de laboratorio, que es el más grande con la mayor parte del equipo científico, un módulo de mantenimiento, que contiene todas las herramientas de mantenimiento para reparar las cosas si se rompen, un módulo de comodidades, ya que estas personas están aquí durante 6 meses, y trabajar todo el día todos los días no es bueno para la mente, y bastantes paneles solares.\n\nLas entregas de alimentos serán comunes durante estos primeros meses, ya que lleva tiempo cultivar alimentos. El agua y el oxígeno se obtendrán a través del hielo lunar. Finalmente, estos científicos se quedarán hasta poco después de mudarse a la siguiente ubicación en aproximadamente 6 meses cuando los paneles solares se vuelvan inútiles debido al día y la noche lunar donde se encuentra el puesto de avanzada duran 6 meses.\n\nMoonbase Alpha está completa."
 donald_trump.27.o1: "Ciencia!"
 donald_trump.28.t: "La Colonia Progresa"
 donald_trump.28.d: "Nuestro puesto de avanzada científico en la Luna ha tenido un gran avance. Con la expansión de su red actual de paneles solares y recientes descubrimientos que facilitan la separación del agua para producir oxígeno e hidrógeno, han podido obtener suficiente oxígeno e hidrógeno para abastecer completamente el cohete de suministro más reciente. Este es un avance tan necesario que permitirá que la Luna en sí, dado suficiente tiempo e inversión, se convierta en un centro para futuras aventuras espaciales en el espacio exterior.\n\nEl propio espacio se está volviendo más pequeño."
 donald_trump.28.o1: "Somos buenos siendo pioneros"
 donald_trump.29.t: "Crisis en la Luna"
 donald_trump.29.d: "Se deben tomar medidas drásticas de inmediato. Por razones actualmente desconocidas, el módulo de habitación ha reventado y \"explotado\".\n\nHace una hora, los 12 científicos estaban realizando sus deberes cuando, de repente, hubo una ruptura masiva en el módulo de habitación.\n\nDado que las ondas no viajan en el vacío, la mayoría no se dio cuenta hasta que vieron físicamente lo que había sucedido.\n\nHay un fondo de emergencia como parte del presupuesto, por lo que no es necesario asignar más fondos al proyecto, y los científicos siempre pueden dormir en los otros módulos aislados; sin embargo, esto ha asustado a muchos, afirmando que unos pocos, muchos o incluso todos nuestros científicos podrían haber muerto, y también ha disminuido la moral de los científicos ya que podrían haber muerto. Por lo tanto, intentar continuar con el puesto de avanzada en la Luna será políticamente costoso, y es posible que deba ocurrir una rotación de científicos ahora en lugar de más adelante, debido al desgaste de la moral.\n\n¿Qué debemos hacer?"
 donald_trump.29.o1: "Enviar ayuda de emergencia!"
 donald_trump.29.o2: "Abandonar el proyecto. No está destinado a nosotros"
 donald_trump.30.t: "La Colonia Progresa Aún Más"
 donald_trump.30.d: "Our Moon outpost has made another major breakthrough. They have managed to ship Helium-3, a gas which seems perfect for fusion, to Earth, and scientists at home have figured out how to conduct fusion with it! Not only this, but the power generated from this fusion is near the amount used to do the reaction in the first place. This means that, with some improvements, this could result in successful fusion power! Not only does this allow immense benefits at home, along with knowledge we may be able to use in using other materials for fusion, we can use this on the Moon, allowing a permanent outpost rather than mobile outposts!\n\nAll of this is far ahead of schedule, which is a surprise, and many at NASA have been left unprepared to implement this into the current Moonbase. So, a new Moonbase is needed, in a much better spot for rapid expansion than the current location of Moonbase Alpha. It's time to start preparations on Moonbase Beta."
 donald_trump.30.o1: "La vida continúa"
 donald_trump.31.t: "Otra Crisis en la Luna"
 donald_trump.31.d: "More drastic measures need to be taken now. Two more modules have ruptured. This time, it's both the Food and Amenities modules.\n\nRoughly forty minutes ago, a scientist was about to enter the Food module when it suddenly exploded. The scientist is fine, and no-one but the plants were harmed. However, it was adjacent to the Amenities module, and it caused it to rupture and explode. Again, no-one was hurt.\n\nThis new occurrence, however, has raised the hairs of many back home, questioning the safety of the modules. After the previous explosion, NASA replaced the modules, ensuring that they wouldn't explode, but it seems like prolonged pressure can cause something to break much more easily than it would otherwise. NASA has already quickly responded, ordering new modules be made immediately, as well as a close inspection of all current modules (As you can't \"recall\" modules from the Moon as of this moment).\n\nWith mounting pressure at home to stop going forward with the project until all safety concerns are resolved, the continuation of the Moonbase program comes into question. In addition to the political pushback, the emergency fund has been cut in half, so NASA is requesting another $5 billion to sort out future concerns. It remains your choice to decide whether to continue."
 donald_trump.31.o1: "Enviar más ayuda de emergencia!"
 donald_trump.31.o2: "No podemos seguir haciendo cosas así"
 donald_trump.32.t: "Base lunar Beta"
 donald_trump.32.d: "At this point, our scientists and engineers on the Moon need to move to another location on the poles. The costs for doing this are already established in the long-term budget, so we don't need to add any new funding to the project yet.\n\nWith this new moonbase, we will be able to use new discoveries we have uncovered to allow the base to be established permanently, unlike our previous moonbase. With the use of better rockets, better power generation, better ice extraction and separation, we can use this new base, at a site more suited for rapid expansion, to facilitate colonization efforts of the Moon. This is not the only good news, entrepreneurs and corporations are flooding to NASA en masse for requests to put their newly developed mining systems on the Moon. Even other space programs in other countries are now extremely interested in starting up scientific and mining outposts on the Moon, however, due to your diligent efforts, we not only have a massive head start, but we are the only country actively attempting to colonize the Moon.\n\nThe future on our Moon is bright and American."
 donald_trump.32.o1: "Hurra!"
 donald_trump_news.2.t: "EE.UU. lanza la Iniciativa de Minería de Asteroides"
 donald_trump_news.2.d: "Earlier today the President of the United States announced the Asteroid Mining Initiative. This organization \"will seek to find an asteroid, bring it into the orbit of Earth, mine it, and send its resources back to the USA.\" Many doubt if this could ever be profitable, as the immense costs will consume much of NASA's budget, however, the President has voiced his wishes for private space companies to do some of the work. One particular favorite, SpaceX, was pointed out directly in his speech on the AMI, stating \"Smart people, and boy, do we have some smart people, like my good friend at SpaceX, Elon Musk, will be able to send their space mining equipment to the asteroid, mine it, and sell it for profit. It will be a tremendous business, believe me.\" There are serious concerns for asteroid mining, however the Administration has been dismissive of those concerns, instead focusing on the rewards of the project. Whether this is successful or not, only time will tell."
 donald_trump_news.2.o1: "Espacio!"
 donald_trump_news.2.o2: "Tal vez podríamos expandirnos en esto..."
 donald_trump_news.2.o3: "Interesante"
 donald_trump_news.3.t: "EE.UU. establece operaciones de minería de asteroides"
 donald_trump_news.3.d: "A large celebration was held in Florida today as shipments of platinum, gold, and silver reached the ground from space in a spectacular display. These materials are not from any normal mine, but from asteroids.  A few months ago, NASA caught a large asteroid heading on a course which would place itself nearby earth. A relatively slow asteroid, it was pulled into an elliptical orbit with Earth. Mining operations started as soon as it was in orbit. This news has been a surprise to the world, as it has been done far faster than expected. Many countries are now seeking to start their own asteroid mining programs to counteract the American monopoly. The United States does claim the entire asteroid. However, this claim can only be sparsely enforced as the asteroid is so large. Asteroid mining will likely become a lucrative industry, with many successes and failures. Who will dominate the asteroid, nonetheless, remains a mystery."
 donald_trump_news.3.o1: "Rocas espaciales!"
 donald_trump_news.3.o2: "Realmente deberíamos expandirnos en esto..."
 donald_trump_news.3.o3: "Interesante"
 donald_trump_news.4.t: "La NASA planea una misión tripulada a Marte"
 donald_trump_news.4.d: "La NASA ha anunciado que enviará una misión tripulada a Marte dentro de tres años. Este anuncio reciente ha emocionado a muchos y el entusiasmo por el espacio está en su punto más alto. Este anuncio reciente llega después de los tuits de Trump sobre que quiere \"estadounidenses en el espacio nuevamente.\" Este nuevo anuncio también sigue a un aumento en el presupuesto para la NASA, para proporcionar el capital para llegar a Marte. Parece que todo está progresando rápidamente en el espacio."
 donald_trump_news.4.o1: "Debemos ir!"
 donald_trump_news.4.o2: "Emocionante"
 donald_trump_news.5.t: "SpaceX anuncia la carrera espacial con la NASA"
 donald_trump_news.5.d: "It appears that Elon Musk never wants to be out-done. Not long ago, Donald Trump announced his wishes for a manned mission to Mars with NASA to be done within two years. Elon Musk, today, has announced that he will also be getting to Mars, before NASA. This new \"Space race\" between the public NASA and private SpaceX, both American organizations, has people wondering: Who will prevail?\n\nElon Musk intends to use his new Starship and Super-Heavy booster to get people to Mars. This new rocket is huge, but not as big as NASA's Space Launch System. One can expect both organizations to go into overdrive as they race to bring humanity to the furthest reaches that humanity has ever gone before."
 donald_trump_news.5.o1: "¿Espera, qué!?"
 donald_trump_news.5.o2: "¿Público vs. Privado? No hay competencia"
 donald_trump_news.5.o3: "Los estadounidenses compiten entre sí nuevamente..."
 donald_trump_news.6.t: "El cohete de la NASA a Marte explota en el lanzamiento!"
 donald_trump_news.6.d: "ÚLTIMAS NOTICIAS: Después de una fase de desarrollo muy rápida, el Sistema de Lanzamiento Espacial ha explotado en la plataforma de lanzamiento. A pesar de las medidas de seguridad en su lugar, los seis miembros de la tripulación también murieron, sumándose a este ya terrible fracaso de lanzamiento.\n\nTrump dio sus comentarios sobre la tragedia, declarando en Twitter, \"A pesar de los mejores esfuerzos de nuestros maravillosos científicos e ingenieros en la NASA, el nuevo cohete estalló en la plataforma de lanzamiento. Las normas de seguridad actuales no fueron suficientes para proteger las vidas de los seis astronautas que se perdieron ese día. Continuaremos nuestros esfuerzos en el espacio, sin embargo, con mucho más cuidado con las vidas de los estadounidenses.\"\n\nEl fracaso en sí se atribuye a..."
 donald_trump_news.6.o1: "¿Cuáles son las probabilidades?"
 donald_trump_news.6.o2: "¿Tal vez no lo apresures?"
 donald_trump_news.7.t: "La NASA aterriza la misión tripulada en Marte!"
 donald_trump_news.7.d: "Hoy, la NASA ha aterrizado su cápsula espacial Orion en Marte. Seis astronautas salieron de la nave para explorar la superficie marciana roja. Una transmisión en vivo (o tan en vivo como puedas obtener una transmisión de Marte) permitió a la audiencia en casa ver el proceso desarrollarse. Todos están vitoreando por el éxito, ya que muchos esperan lo que sucederá a continuación en el espacio, ya sea la colonización de la Luna, otro par de botas en Marte o incluso la colonización de Marte.\n\nEl futuro es ahora."
 donald_trump_news.7.o1: "Hurra!"
 donald_trump_news.7.o2: "A los estadounidenses les gusta su espacio, ¿no?"
 donald_trump_news.8.t: "SpaceX aterriza la misión tripulada en Marte primero!"
 donald_trump_news.8.d: "En una sorpresa impactante para el mundo, SpaceX, una empresa espacial privada dirigida por Elon Musk, ha aterrizado en Marte antes que la NASA del gobierno de EE. UU. Un entusiasmo sin precedentes rodea a SpaceX, ya que la popularidad personal de Elon Musk se dispara. Este éxito ha impactado también en su otra empresa, Tesla, que ha visto un pequeño aumento en las ventas y en las acciones.\n\nDonald Trump ha comentado sobre el asunto, felicitando a Elon Musk y a SpaceX por su logro, añadiendo que \"Esto demuestra que las empresas privadas pueden hacerlo mejor que el gobierno!\" La iniciativa espacial de Donald Trump puede haber jugado un papel en llegar a Marte tan temprano; sin embargo, muchos dicen que SpaceX, Blue Origin y la NASA han tenido ambiciones para Marte. Sin importar quién llegue primero a Marte, sigue siendo un gran salto para la humanidad."
 donald_trump_news.8.o1: "EE. UU.!"
 donald_trump_news.8.o2: "Los estadounidenses se han vencido a sí mismos, otra vez..."
 donald_trump_news.9.t: "EE. UU. lanza un puesto de avanzada en la Luna"
 donald_trump_news.9.d: "Earlier today, President Trump announced that the USA will seek to put outposts on the Moon to gather scientific data. This new development is not a surprise, however, as the President has been hinting at it for weeks. When asked at the White House press conference today about whether this will lead to colonization, Trump replied \"We might colonize the Moon, we might not. It depends really.\"\n\nMany are enthusiastic, some cite the mining potential of the Moon, some are simply excited for the prospect of living on the Moon. No matter who you are, this is an exciting time."
 donald_trump_news.9.o1: "Nuestro alcance se expande aún más"
 donald_trump_news.9.o2: "¿Esto cuenta como imperialismo?"
 donald_trump_news.10.t: "EE. UU. expande operaciones en la Luna"
 donald_trump_news.10.d: "El tiempo para la actual Base Lunar, Base Lunar Alfa, está casi terminado. Esto es lo que dijo recientemente un comunicado de la NASA, junto con planes para una Base Lunar mucho más grande, llamada Base Lunar Beta, para acomodar corporaciones oportunistas junto con el espacio expandido para que científicos e ingenieros realicen investigaciones. Elon dijo sobre el asunto en Twitter que \"La Base Lunar Beta proporcionará tantas nuevas oportunidades no solo para SpaceX, sino para la humanidad en su conjunto.\" Una encuesta realizada hoy después del anuncio encontró que el 74 % de las personas están entusiasmadas con la exploración y colonización espacial. Tal vez sea por esta razón que otros gobiernos ahora están considerando sus propios planes para una Base Lunar."
 donald_trump_news.10.o1: "Progreso!"
 donald_trump_news.10.o2: "¿Qué sigue? ¿Los Estados Unidos de la Luna?"
 donald_trump_news.11.t: "EE. UU. abandona la Base Lunar"
 donald_trump_news.11.d: "After the US Moonbase suffered a crisis, having a module explode on the Moon, NASA decided to delay the program. The scientists sent to the Moon are being taken home until NASA fixes the safety issues with the modules."
 donald_trump_news.11.o1: "No valió la pena"
 donald_trump_news.11.o2: "Si es demasiado caro para EE. UU., entonces es demasiado caro para nosotros"
 donald_trump_news.12.t: "Comienza la investigación sobre Rusia"
 donald_trump_news.12.d: "El FBI de Estados Unidos ha abierto una investigación para determinar si Donald Trump colaboró con Rusia durante la campaña de 2016. Trump niega cualquier colusión, llamándola una caza de brujas, mientras que otros dicen que su tono suave con Rusia es evidencia de que es un títere de Rusia. Cualesquiera que sean los resultados, tendrán implicaciones masivas para EE. UU. en el futuro."
 donald_trump_news.12.o1: "Delirio de colusión!"
 donald_trump_news.12.o2: "Interesante"
 USA_FOCUS.8.t: "Condenar los lanzamientos de misiles iraníes"
 USA_FOCUS.8.d: "Estados Unidos nos está presionando para condenar públicamente un lanzamiento de misiles iraní"
 USA_FOCUS.8.a: "Condénalos"
 USA_FOCUS.8.b: "No es nuestro problema"
 USA_FOCUS.9.t: "Ataque con misiles en Shayrat"
 USA_FOCUS.9.d: "Estados Unidos lanzó un ataque militar el jueves contra una base aérea del gobierno sirio en respuesta a un ataque con armas químicas que mató a decenas de civiles a principios de la semana. Por orden del presidente Donald Trump, los buques de guerra estadounidenses lanzaron 59 misiles de crucero Tomahawk contra la base aérea que albergaba los aviones de guerra que llevaron a cabo los ataques químicos, dijeron funcionarios estadounidenses."
 USA_FOCUS.9.a: "Interesante"
 USA_FOCUS.10.t: "Armar a Rojava"
 USA_FOCUS.10.d: "On May 9, 2017, the Trump Administration declared it was moving ahead with plans to support Kurdish rebels in northern Syria ahead of an assault on the city of Raqqa, ISIS's de facto capital in the country."
 USA_FOCUS.10.a: "Hazlo!"
 USA_FOCUS.10.b: "Let's rethink this"
 USA_FOCUS.1.t: "EE. UU. despliega la Brigada E en Europa del Este"
 USA_FOCUS.1.d1: "Estados Unidos ha desplegado sus Fuerzas Armadas en Polonia a raíz de la crisis de Crimea. La Brigada E de la OTAN fue desplegada en Polonia con tropas estadounidenses, británicas, croatas y rumanas estacionadas en caso de emergencia. Es una decisión interesante considerando la situación precaria con los países de la OTAN que 'efectivamente' rodean a Rusia con sus planes de expansión.\nEs posible que esto disuada futuras agresiones rusas en Europa del Este contra sus vecinos en el futuro. Es nuestro trabajo evitar que Rusia dañe o presione a nuestros aliados.\n"
 USA_FOCUS.1.d2: "Estados Unidos ha desplegado sus Fuerzas Armadas en Polonia a raíz de la crisis de Crimea. La Brigada E de la OTAN fue desplegada en Polonia con tropas estadounidenses, británicas, croatas y rumanas estacionadas en caso de emergencia. Es una decisión interesante considerando la situación precaria con los países de la OTAN que 'efectivamente' rodean a Rusia con sus planes de expansión.\nLos estadounidenses vuelven a jugar la carta de 'Defendemos a nuestros aliados'. Patético."
 USA_FOCUS.1.d3: "The United States has deployed its Armed Forces to Poland in the wake of the Crimean crisis. The NATO E Brigade was deployed to Poland with American, British, Croatian and Romanian troops stationed in case of emergency. It is an interesting decision considering the precarious stance with NATO Countries 'effectively' surrounding Russia with their expansion plans.\nWhat could this boil into?"
 USA_FOCUS.1.a: "Debemos defender a nuestros aliados"
 USA_FOCUS.1.b: "American Aggression Shouldn't Be Tolerated"
 USA_FOCUS.1.c: "EE. UU. honra sus obligaciones"
 USA_FOCUS.1.d: "Interesante"
 USA_FOCUS.1.e: "Más seguros con EE. UU."
 USA_FOCUS.2.t: "Desplegar la Brigada E"
 USA_FOCUS.2.d: "Russia has recently seized the Crimea. The very thought threatens American interests and our NATO allies greatly. Poland and the Baltic states are in the most immediate danger and their positions should be reinforced. The E Brigade is composed of American, British, Croatian, and Romanian forces. The American and British forces comprise the majority of the ground forces, with a Croatian rocket artillery battery and a Romanian air defense artillery company.\n\nOur new defensive stature should curb the Russian aggression.\n"
 USA_FOCUS.2.a: "Desplegar la Brigada E"
 USA_FOCUS.3.t: "EE. UU. despliega la Brigada S en Ankara"
 USA_FOCUS.3.d1: "Turkey has continued to reaffirm its commitment to remaining in the North Atlantic Treaty Organization. The commitment to the alliance and the recent pressure coming from Iran, and Russia. Furthermore, strengthening the position of western forces and positions in the region.\n\nDeploying troops to the region will strengthen our mission in order to maintain the delicate balance of power in Europe and in the Middle East.\n"
 USA_FOCUS.3.d2: "Turkey has continued to reaffirm its commitment to remaining in the North Atlantic Treaty Organization. The commitment to the alliance and the recent pressure coming from Iran, and Russia. Furthermore, strengthening the position of western forces and positions in the region.\n\nThe Americans are deploying more troops to the region. We must watch this situation closely.\n"
 USA_FOCUS.3.d3: "Turkey has continued to reaffirm its commitment to remaining in the North Atlantic Treaty Organization. The commitment to the alliance and the recent pressure coming from Iran, and Russia. Furthermore, strengthening the position of western forces and positions in the region.\n\n"
 USA_FOCUS.3.a: "Better prepared than unprepared."
 USA_FOCUS.3.b: "Troubling News"
 USA_FOCUS.3.c: "Reforzar la alianza"
 USA_FOCUS.3.d: "Esperemos que esto no sea un preludio al conflicto"
 USA_FOCUS.4.t: "Desplegar la Brigada S"
 USA_FOCUS.4.d: "The S Brigade in Ankara, Turkey will help reinforce our ally's position due to increasing tensions. Conflict in the Black Sea and in the Middle East has slowly required NATO to commit more to the region.\n\n It is time to deploy the S Brigade to Turkey to honor our obligation to support our ally.\n"
 USA_FOCUS.4.a: "Deploy the S Brigade"
 USA_Russia_Investigation.0.t: "Inicio de la investigación sobre Rusia"
 USA_Russia_Investigation.0.d: "El director James B. Comey confirmó por primera vez que el FBI está investigando una posible colusión entre la campaña de Trump y las autoridades rusas durante la campaña electoral de 2016."
 USA_Russia_Investigation.0.a: "Uh Oh"
 usa.7.o1_tt: "Pequeña posibilidad de que la redada de §YElian Gonzalez§! §Yfalle§!\n"
 USA_not_total_support_tt: "Does Not Have Total Support of the §YSenate§! and §YHouse of Representatives§!"
 USA_deploy_e_brigade_tt: "Despliega la §YBrigada E§! en Varsovia\n"
 USA_deploy_ankara_s_brigade_tt: "Despliega la §YBrigada S§! en Ankara\n"
 USA_secure_fence_act_tooltip: "§YConstruye una cerca en la frontera sur§!"
 USA_build_the_wall_tooltip: "Expandir la cerca en un muro"
 USA_modify_economic_regulation_tt: "§YRegulaciones económicas§! cambian en [?modify_economic_regulation|+0] (Actual: [?USA.USA_economic_regulation_var|Y0])\n"
 USA_modify_strength_of_wall_street_tt: "§YFuerza de Wall Street§! cambia en [?modify_wall_street|+0] (Actual: [?USA.USA_strength_of_wall_street_var|Y0])\n"
 USA_given_isis_subsidies: "Despite our efforts, enemies of ISIS in the Middle East have given nothing for our generous involvement."
 USA_not_given_isis_subsidies: "Governments around ISIS in the Middle East have decided to subsidize our efforts, showing a genuine appreciation for our intervention."
 USA_econ_event.1.t: "Estados Unidos vs. Martin Petersen"
 USA_econ_event.1.d: "November 23rd 2004, an antitrust case filed against a branch of the Bayer AG rubber chemical products company in California was brought up on charges of price fixing via horizontal monopolization practices, which suppressed competition to keep pace and or conduct normal business in the defendant's area of control. The courts have looked over the evidence and heard the testimonies of both parties, the court's decision is?"
 USA_econ_event.1.o1: "El tribunal encuentra al acusado culpable"
 USA_econ_event.1.o2: "El tribunal encuentra al acusado no culpable"
 USA_econ_event.2.t: "Estados Unidos vs. UnitedHealth y PacifiCare"
 USA_econ_event.2.d: "El 20 de diciembre de 2005, se presentó un caso antimonopolio contra UnitedHealth Group Incorporated por la adquisición de activos de seguros médicos de su competidor. El demandante argumenta que 'United' es la mayor aseguradora médica de los Estados Unidos y, como tal, no debería poder despojar de activos a su principal competidor en un mercado que ya de por sí está cerrado. El tribunal, tras examinar las pruebas y escuchar los testimonios de ambas partes, ha decidido que?"
 USA_econ_event.2.o1: "El Tribunal declara culpable a United"
 USA_econ_event.2.o2: "El Tribunal declara a United inocente"
 USA_econ_event.7.t: "Rumores de un nuevo virus que se propaga desde China"
 USA_econ_event.7.d: "Desde principios de diciembre de 2019, han surgido rumores de que un tipo de virus SARS ha comenzado a propagarse alrededor de una ciudad llamada Wuhan. Algunos lo han llamado MARS o Síndrome Respiratorio Asiático Continental, algo ingenioso pero distractor que proviene de China. Pero muchos descartan la amenaza de esto debido a la escasez de información confiable que proviene de la nación del dragón rojo."
 USA_econ_event.7.o1: "¿Cómo afectará esto al mercado de valores?"
 USA_econ_event.8.t: "La burbuja punto com estalla"
 USA_econ_event.8.d: "The Bursting of the Dotcom bubble was a predicted measure, several scandals and events related to these rapid rises to wealth had shown signs of crumbling. It was only with the compounded scares related to Japan going into another recession and some key scandals that shook investors away. Though the impacts were quick and recoverable many once rich companies were now closed and bankrupt. We can only hope to learn from the mistakes and see what happens next in this new millennium."
 USA_econ_event.8.o1: "Nuevo milenio, nuevos problemas..."
 USA_econ_event.9.t: "La recesión de Internet"
 USA_econ_event.9.d: "As the Dotcom bubble and other unfavorable events compounded in the nation and wider world, many investors have decided to sell and panic which in turn has caused a minor recession. While some have called this recent economic downturn the Internet Recession, many opt for the easier 2001 Recession."
 USA_econ_event.9.o1: "¿El colapso de la nueva era?!?"
 USA_econ_event.10.t: "Aumento de la tensión pública"
 USA_econ_event.10.d: "As the new millennium has gotten under way so has a new movement been slowly gaining traction. More and more there are reports of anti-business movements which are using these new buzz words like, Big Tech, Big Pharma, and Big Sugar. These movements are showing increases and yet also decreases in their organization, we can only hope that people will just return to their daily lives and cease the disruption they are causing."
 USA_econ_event.10.o1: "Mantén la calma y trabaja duro"
 USA_econ_event.11.t: "La crisis financiera mundial"
 USA_econ_event.11.d: "The Global economies tremble as the US markets become a minor free fall. Mounting bad loans, crashing housing prices and many other issues both domestically and internationally have culminated in an outright global recession. Many fear the recession could worsen into a depression but only time will show if such is the case."
 USA_econ_event.11.o1: "Vende! Vende! Vende!"
 USA_econ_event.12.t: "La crisis de las hipotecas subprime"
 USA_econ_event.12.d: "Since 1999 the Mortgage markets have grown and grown, not only in size but also in volatility. Slow increases in human greed and over eagerness have led to more bad loans being made to borrowers that are obviously not within the requirements. This has finally mounted into a full on crash which has caused several businesses to go bankrupt and families to lose their homes. Public unrest is mounting and the value of the USD has been shaken so much that foreign investors have become a little more wary. Nevertheless we will work through this and move forwards beyond the troubles and into the triumphs."
 USA_econ_event.12.o1: "Estos hippies no entienden los negocios"
 USA_econ_event.14.t: "El colapso del mercado de la vivienda en 2008"
 USA_econ_event.14.d: "Feeding off the opportunistic mortgages has led to several defaults, these defaults along with the slow squeezing of the US middle class has resulted in many houses returning to the market at faster and faster rates. Driving down prices many people who invested into the housing market have now seen major losses and this feedback loop has culminated into several other economic events of these last couple years."
 USA_econ_event.14.o1: "Ahí va el vecindario"
 USA_econ_event.15.t: "Aumento de las protestas"
 USA_econ_event.15.d: "Increasing sizes in movements related to pro-union activists along with anti-big business fervor seems to have reached a new high as sporadic movements have affected companies like Amazon, Walmart and other major brand names. While most see this as another rough patch, some show concern as to where these movements may progress towards. For now it's uncertain what the future may entail."
 USA_econ_event.15.o1: "Solo otro grupo de alborotadores"
 USA_econ_event.16.t: "La larga recesión"
 USA_econ_event.16.d: "A culmination of economic mismanagement and the slow recovery from the Global Financial Crisis has resulted in an almost plateauing of economic activity. Many fear what this will mean as prices for basic commodities continue to rise and more people are thrown back into the 9 to 5 grind. Congress has stated they are working on the issue and hope the crisis will end soon. The question is, what is considered soon?"
 USA_econ_event.16.o1: "Reconstruiremos mejor"
 USA_econ_event.17.t: "¿Rumores de cambio?"
 USA_econ_event.17.d: "Recently more and more rumors about the status of the United States have become more of a hot topic, with many believing that it's simply just the faults of the opposition. But there is a small growing consensus that the United States has changed, that the supposed \"liberal democracy\" that it shows itself to be is actually a mask for a growing internal plutocratic faction. Though many are quick to dismiss it, many more do ponder just how improbable the notion really is."
 USA_econ_event.17.o1: "They'll Believe Anything Nowadays"
 USA_econ_event.18.t: "Estados Unidos vs. General Dynamics y Newport News"
 USA_econ_event.18.d: "En octubre de 2001, el fiscal general presentó una demanda antimonopolio contra las empresas General Dynamics Corp. y Newport News Shipbuilding Inc. El asunto del caso es que la adquisición propuesta de Newport News por parte de General Dynamics crearía un monopolio en el diseño, desarrollo y construcción de submarinos nucleares y eliminaría toda competencia para un sistema de armas crítico para la defensa nacional. Este caso, clasificado como una violación de las fusiones horizontales a los ojos de las leyes antimonopolio, ha tenido una resonancia constante en ambos lados del problema del caso. Pero al final, el veredicto del tribunal fue:"
 USA_econ_event.18.o1: "El tribunal impide la fusión"
 USA_econ_event.18.o2: "El tribunal aprueba la fusión"
 USA_econ_event.19.t: "EE. UU. vs. Nicholas A. Penachio y Nick Penachio Co., Inc."
 USA_econ_event.19.d: "Nick Penachio Co., Inc. ('Penachio Co.') era una corporación del estado de Nueva York ubicada en el Bronx, Nueva York. Penachio Co. era un proveedor de alimentos, principalmente productos y alimentos congelados. Desde aproximadamente mayo de 1996 hasta aproximadamente abril de 1999, las fechas exactas desconocidas por Estados Unidos, los acusados y co-conspiradores participaron en una combinación y conspiración en restricción comercial irrazonable del comercio interestatal y exterior en violación de la Sección 1 de la Ley Sherman (Título 15, Código de Estados Unidos, Sección 1). La mencionada combinación y conspiración consistió en un acuerdo, entendimiento y concierto de acción continuo entre los acusados y co-conspiradores, cuyos términos sustanciales eran amañar ofertas y asignar contratos para el suministro de alimentos congelados a la Junta de Educación de la Ciudad de Nueva York."
 USA_econ_event.19.o1: "Ganancias sobre el bienestar de los estudiantes, culpable!"
 USA_econ_event.19.o2: "A Level Of Ambiguity Suggests Third Parties, Not Guilty!"
 USA_econ_event.20.t: "EE. UU. vs. Vaw Carbon GMBH"
 USA_econ_event.20.d: "A partir de febrero de 1996 y continuando hasta al menos diciembre de 1997, las fechas exactas desconocidas por Estados Unidos, el acusado y co-conspiradores participaron en una combinación y conspiración para suprimir y eliminar la competencia al fijar el precio del bloque de cátodo de carbono vendido en Estados Unidos y en otros lugares. La combinación y conspiración en la que participaron el acusado y los co-conspiradores fue una restricción comercial irrazonable del comercio interestatal y exterior en violación de la Sección 1 de la Ley Sherman."
 USA_econ_event.20.o1: "Las pruebas demuestran la culpa, culpable!"
 USA_econ_event.20.o2: "The Evidence Suggests Complicity, Not Guilty!"
 USA_econ_event.21.t: "EE. UU. vs. Taylor y Murphy Construction Co., Inc."
 USA_econ_event.21.d: "En o alrededor del mes de febrero de 2001, el acusado, a sabiendas y deliberadamente, hizo y causó que se hiciera una declaración y representación materialmente falsa, ficticia y fraudulenta en un asunto dentro de la jurisdicción de la Administración Federal de Carreteras, una agencia del Departamento de Transporte de Estados Unidos, un departamento de Estados Unidos, al presentar una oferta y realizar un proyecto de construcción de carreteras en el Blue Ridge Parkway en el condado de Buncombe, Carolina del Norte, en el cual el acusado certificó falsamente que no había revelado sus precios de oferta a ningún otro competidor, cuando en verdad y en hecho sí lo había hecho."
 USA_econ_event.21.o1: "Se encuentra culpable a Taylor & Murphy Construction"
 USA_econ_event.21.o2: "Se encuentra no culpable a Taylor & Murphy Construction"
 USA_econ_event.22.t: "Estados Unidos contra Bluestar Metal Recycling Co."
 USA_econ_event.22.d: "Comenzando al menos ya en diciembre de 1993 y continuando hasta al menos octubre de 2001, siendo las fechas exactas desconocidas para los Estados Unidos, el demandado y los coconspiradores participaron en una colusión y conspiración para suprimir y eliminar la competencia mediante la asignación de proveedores en la compra de chatarra ferrosa y no ferrosa en el noreste de Ohio. La colusión y conspiración imputadas restringieron de manera irrazonable el comercio y los intercambios interestatales, violando la Sección 1 de la Ley Antimonopolio Sherman (15 U.S.C. §§ 1)."
 USA_econ_event.22.o1: "Se encuentra culpable a Bluestar"
 USA_econ_event.22.o2: "Se encuentra no culpable a Bluestar"
 USA_econ_event.23.t: "Estados Unidos contra Duane Maynard"
 USA_econ_event.23.d: "Comenzando el o alrededor del 18 de febrero de 1999 y continuando al menos hasta el 17 de enero de 2002, las fechas exactas siendo desconocidas para los Estados Unidos, el acusado y co-conspiradores entraron y se involucraron en una combinación y conspiración para suprimir y restringir la competencia para un proyecto subsidiado por E-Rate para proveer, entre otras cosas, bienes y servicios relacionados con telecomunicaciones, acceso a Internet, y conexiones internas en el Distrito Escolar Elemental West Fresno (\"el Proyecto E-Rate del Distrito Escolar Elemental West Fresno\") en Fresno, California, en restricción irrazonable del comercio y comercios interestatales, en violación de la Ley Antimonopolio Sherman, Título 15, Código de los Estados Unidos, Sección 1."
 USA_econ_event.23.o1: "Se encuentra culpable al Sr. Maynard"
 USA_econ_event.23.o2: "Se encuentra no culpable al Sr. Maynard"
 USA_econ_event.24.t: "Estados Unidos contra Waterblock Roofing and Sheetmetal, Inc."
 USA_econ_event.24.d: "Waterblock, a corporation located in Schenectady, New York, was engaged in the roofing business in the state. Walter J. Vivenzio a resident of East Berne, New York, was president and an owner of Waterblock. \"CC-1\" was a co-conspirator who was a maintenance manager at the Waterford, New York plant of the General Electric Company. CC-1 attempted to create the appearance that he was following a competitive bidding policy for roofing contracts, including contracts that were awarded to Waterblock. \"CC-2\" was a co-conspirator who was a representative of a manufacturer of roofing products. CC-2 helped to select the companies that would be invited to bid or quote on roofing contracts for the Albany Medical Center and other purchasers of roofing products and services. CC-2 generally attempted to create the appearance that he was following a competitive bidding policy for roofing contracts, including contracts that were awarded to Waterblock. From sometime in 1995 until approximately May 2002, the exact dates being unknown to the United States, the defendant and co-conspirators engaged in a combination and conspiracy in unreasonable restraint of interstate trade and commerce in violation of Section 1 of the Sherman Act."
 USA_econ_event.24.o1: "Se encuentra culpable a Waterblock"
 USA_econ_event.24.o2: "Se encuentra no culpable a Waterblock"
 USA_econ_event.25.t: "Estados Unidos contra Syndial S.p.A."
 USA_econ_event.25.d: "Desde septiembre de 1999 o alrededor de esa fecha y continuando hasta abril de 2002 o alrededor de esa fecha, el acusado y sus co-conspiradores participaron en una combinación y conspiración para suprimir y eliminar la competencia fijando el precio del caucho de policloropreno vendido en los Estados Unidos y en otros lugares. El caucho de policloropreno, también conocido como \"caucho de cloropreno\", \"policloropreno\", \"PCP\" o \"butaclor\", es un tipo específico de caucho sintético que tiene aplicaciones de uso final en las industrias automotriz, de adhesivos y de la construcción. Durante el período cubierto por esta Información, el acusado y sus co-conspiradores fabricaron, vendieron y distribuyeron caucho de policloropreno en un flujo continuo e ininterrumpido de comercio interestatal y extranjero a clientes ubicados en estados o países distintos de los estados o países en los que el acusado y sus co-conspiradores producían caucho de policloropreno."
 USA_econ_event.25.o1: "Se encuentra culpable a Syndial"
 USA_econ_event.25.o2: "Se encuentra no culpable a Syndial"
 USA_econ_event.26.t: "Estados Unidos contra Ryan's World, Inc."
 USA_econ_event.26.d: "El o alrededor del 14 de diciembre de 1994, 17 de marzo de 1999 y 3 de marzo de 2000, el acusado presentó algunos Formularios de Hoja de Firma de Servicio de Oferta con el Comando de Gestión de Tráfico Militar. Los formularios TOSS requerían que el acusado adjuntara una lista de los nombres de los agentes de carga con los que tenía una relación de control financiero y/o administrativo común. El acusado marcó la casilla indicando que no estaba en un CFAC con ningún otro transportista o agente. Durante el período relevante, en un asunto dentro de la jurisdicción del DOD, un departamento de los Estados Unidos, el acusado hizo intencional y voluntariamente declaraciones y representaciones materiales falsas, fraudulentas, y ficticias en Certificados de Responsabilidad del Transportista y formularios TOSS presentados con MTMC, y ocultó intencionalmente un hecho material de MTMC: a saber, su elegibilidad para participar en el programa ITGBL, a través de sus declaraciones y representaciones."
 USA_econ_event.26.o1: "Se encuentra culpable a Ryan's World, Inc."
 USA_econ_event.26.o2: "Se encuentra no culpable a Ryan's World, Inc."
 USA_econ_event.27.t: "Estados Unidos contra John R. Olsen"
 USA_econ_event.27.d: "Comenzando al menos tan temprano como julio de 2000, y continuando después al menos hasta el 10 de octubre de 2003, las fechas exactas siendo desconocidas para los Estados Unidos, en el Distrito Norte de Georgia y en otros lugares, el acusado, el Co-Conspirador Crowe, y el Co-Conspirador #1 actuaron ilegal, intencional, y voluntariamente en combinación, conspiración, confederación, y acuerdo en violación del Título 18, Código de los Estados Unidos, Sección 371, para cometer ofensas contra los Estados Unidos de América, a saber, para violar el Título 18, Código de los Estados Unidos, Secciones 1341 y 1346. Fue parte y objeto de dicha conspiración que el acusado, el Co-Conspirador Crowe, y CC-1, habiendo ideado e intencionado idear un esquema y artificio para defraudar a Chemical Products Technologies, LLC y privar a CPT de su derecho a los servicios honestos de sus empleados, ejecutaron dicho esquema y artificio para defraudar a través del uso del correo de los Estados Unidos."
 USA_econ_event.27.o1: "Se encuentra culpable al Sr. Olsen"
 USA_econ_event.27.o2: "Se encuentra no culpable al Sr. Olsen"
 USA_econ_event.28.t: "Estados Unidos contra Certified Slings, Inc."
 USA_econ_event.28.d: "Comenzando en diciembre de 2002 y continuando hasta octubre de 2003, las fechas exactas siendo desconocidas para los Estados Unidos, el acusado y co-conspiradores entraron y se involucraron en una combinación y conspiración para suprimir y eliminar la competencia al acordar presentar ofertas no competitivas a la Armada de los Estados Unidos en contratos para ensamblajes de eslingas de metal. La combinación y conspiración en la que se involucraron el acusado y co-conspiradores fue en restricción irrazonable del comercio y comercios interestatales en violación de la Sección 1 de la Ley Sherman"
 USA_econ_event.28.o2: "Se encuentra no culpable a Certified Slings Inc."
 USA_econ_event.28.o1: "Se encuentra culpable a Certified Slings Inc."
 USA_econ_event.29.t: "Estados Unidos contra MA-RI-AL Corp."
 USA_econ_event.29.d: "Comenzando al menos tan temprano como julio de 2000 y continuando hasta el 25 de mayo de 2004, las fechas exactas siendo desconocidas para el Gran Jurado, los acusados y co-conspiradores Irving Materials, Inc., Builder's Concrete and Supply Co., Inc. y otras corporaciones e individuos entraron y se involucraron en una combinación y conspiración para suprimir y eliminar la competencia al fijar los precios a los que se vendía el concreto premezclado en el área metropolitana de Indianápolis, Indiana. El acusado JOHN J. BLATZHEIM se unió a la conspiración en o alrededor de abril de 2003. La combinación y conspiración en la que se involucraron los acusados y sus co-conspiradores fue en restricción irrazonable del comercio y comercios interestatales en violación de la Sección 1 de la Ley Sherman."
 USA_econ_event.29.o1: "Se encuentra culpable a las Partes Involucradas"
 USA_econ_event.29.o2: "Se encuentra no culpable a las Partes Involucradas"
 USA_econ_event.50.t: "Creciente Malestar Público"
 USA_econ_event.50.d: "The events and issues of recent times have caused a mighty stir in the eyes of the people. As more and more turn to TV and other news outlets for their information a vocal minority movement has begun to gain traction. Fears about how the news is being told and shown have caused some to think that media outlets are straying from reality and from real news. Though many are still confused about these outcries it's only a matter of time before we see what may come from such events."
 USA_econ_event.50.o1: "Mongereo de Miedo Infundado"
 USA_econ_event.50.o2: "Hay Algo Sospechoso Aquí"
 USA_econ_event.100.t: "Rumores Económicos"
 USA_econ_event.100.d: "In recent months there has been a slew of rumors about a smell of foul play within the mortgage markets. Most that entertain these rumors have found nothing, however this does hark back to a very bizarre event that's still fresh in memory of someone who decided to create an economic machine in relation to betting against the market. However there is no real justification to do so. Regardless it's up to the FTC and the administration if they want to explore these rumors any more than what already has."
 USA_econ_event.100.o1: "No Estamos Haciendo Mucho, Así Que ¿Por Qué No?"
 USA_econ_event.100.o2: "Ya Los Han Probado Erróneos, Así Que ¿Cuál Es El Punto?"
 USA_econ_event.101.t: "Algunas migajas"
 USA_econ_event.101.d: "Investigaciones iniciales han notado algo de comercio interno en relación con hipotecas y algunos valores de intercambio de deuda entre bancos. Sin embargo, esto no es realmente nada fuera de lo ordinario en relación con las tendencias del mercado actual en general. Sin embargo, algunos aún predican que continuemos esta búsqueda ya que esta es prueba suficiente de que algo está ocurriendo."
 USA_econ_event.101.o1: "Está Bien, Está Bien, Supongo Que Podemos Continuar"
 USA_econ_event.101.o2: "No, Hemos Desperdiciado Suficientes Recursos En Este Juego"
 USA_econ_event.102.t: "El Mercado Perdido"
 USA_econ_event.102.d: "I can't believe it, there actually was something here. A series of in-depth investigations related to the crumbs of insider trading and the greater mortgage market has found a trail of rising unpayable mortgages and debts. These mortgages were being handed out to anyone who pretty much asked for them, not to mention all the fine print metrics we found like ballooning interest rates after a specific time frame or the actual size of the mortgages themselves in comparison to the holder's annual income. A comprehensive effort, albeit as quiet as possible effort to keep Wall Street from panicking is of the utmost importance. A series of economic and political reforms will be put into effect to ensure that this sort of gross negligence is never allowed to grow into such proportions ever again."
 USA_econ_event.102.o1: "No Depresión Esta Vez Jack"
 USA_unrest_event.1.t: "Movimientos Libertarios Crecientes"
 USA_unrest_event.1.d: "Recent weeks have seen a steady increase to what is known as the Libertarian party. Most see them as a crackpot overtly capitalist party, but with the rising rallies and registration numbers some fear that they may make a potential comeback if left alone. With the media's help we could do something to quash their momentum, or we could just leave them alone as they're bound to be snuffed out again."
 USA_unrest_event.1.o1: "Nada Más Que Necedad"
 USA_unrest_event.1.o2: "CNN & Fox Tendrán Un Día de Campo"
 USA_unrest_event.2.t: "Mítines Aislacionistas Crecientes"
 USA_unrest_event.2.d: "In recent times a disturbing rise in anti-foreign affairs movements and rallies has begun to gain traction. While many are just pushing them off as nationalistic dunderheads, it is still a cause for concern as these people could affect our foreign policy plans. Nevertheless we can choose to let the people eat themselves with division or \"encourage\" a cover story on this rise in \"nationalism\"."
 USA_unrest_event.2.o1: "Nada Más Que Chiflados"
 USA_unrest_event.2.o2: "Ellos noticias gente consiguió algo de trabajo hoy"
 USA_unrest_event.3.t: "Pensadores Socialistas Crecientes"
 USA_unrest_event.3.d: "We thought that with the end of the Cold War that Socialism would have stopped here in America. Unfortunately it does not look like the case, recently an increase in Socialist oriented groups have been organizing protests and movements against our nation's ethos. These rabblerousers are causing a stir and in all honesty they are nothing more than just a pest of a bygone era. We can look to undermine their means or just ignore the vermin and let them destroy themselves in due time."
 USA_unrest_event.3.o1: "Deja Que Se Coman Unos A Otros"
 USA_unrest_event.3.o2: "Alentaremos Su Aislamiento"
 USA_unrest_event.4.t: "Movimientos Nacionalistas Crecientes"
 USA_unrest_event.4.d: "Pro America movements have been a thing since the dawn of the nation, however recent organized movements have started deviating from the normal \"Go America\" attitude. Some have decided to deal in some unconventional and or very outdated ideas for modern standards that is. We could look to boost their coverage to speed up their downfall, or we could just let them be and just watch as they politically commit suicide."
 USA_unrest_event.4.o1: "Ideas Viejas Para Mentes Viejas"
 USA_unrest_event.4.o2: "Let's Spin The Wheel Of Media Outlets"
 USA_unrest_event.5.t: "Ambientalismo En Aumento"
 USA_unrest_event.5.d: "Ever since Al Gore's campaign the supposed green movement has been slowly gaining more and more traction. As such there have been small scale protests against everyday economic activities. This disruption has caused backlash in the public's eyes, though this disruptiveness is politically damning them some do fear we should still do something to solidify these tree huggers \"out of touch\" nature."
 USA_unrest_event.5.o1: "Malditos Hippies"
 USA_unrest_event.5.o2: "Malditos Eco-terroristas"
 USA_unrest_event.6.t: "¿Liberales Plutocráticos Preocupan Al Público?"
 USA_unrest_event.6.d: "Since the days of Barry Goldwater and Ronald Reagan many have wanted to emulate their supposed political and economic \"revolutions\" which they were bringing to America. However, there are some who worry that they may be taking things a step too far. Elements of the Constitution Party and backdoor dealings with supposed plutocratic insiders have caused unease in the public. We could handle this by creating rumors and leaks to the press...or we could leave it and let the normal snoopers do their job."
 USA_unrest_event.6.o1: "Las Filtraciones Siempre Ocurren"
 USA_unrest_event.6.o2: "¿Alguien Filtró Qué!? Qué Impactante"
 USA_reformed_republic.1.t: "Un Pueblo Abrumado Por La Elección"
 USA_reformed_republic.1.d: "Recent events in election and economic reform have shown many that there is more to their political beliefs than just the Donkey or the Elephant. There's a whole zoo of animals and people are beginning to see that both sides of the aisle have choices to provide."
 USA_reformed_republic.1.o1: "The People's Will"
 USA_reformed_republic.1.o2: "La Voluntad Del Pueblo"
 USA_reformed_republic.2.t: "Tener Tu Pastel"
 USA_reformed_republic.2.d: "A medida que más y más personas se aglomeran a los nuevos partidos que se han formado y se equiparan a los valores de nuestra ciudadanía la división ha mostrado un aumento en..."
 USA_reformed_republic.2.o1: "Solidaridad Para Siempre"
 USA_reformed_republic.2.o2: "¿No Tiene Razón?"
 USA_reformed_republic.3.t: "¿Puedes Comértelo También?"
 USA_reformed_republic.3.d: "People swept up into the political flavors of the day have found richer flavors than they may fully agree with. Nevertheless some are further pulled into savory grasp of these newcomers, but their choice seems to be..."
 USA_reformed_republic.3.o1: "Terciopelo Rojo"
 USA_reformed_republic.3.o2: "Chocolate Con Leche"
 USA_reformed_republic.4.t: "Un País De Las Maravillas De Política"
 USA_reformed_republic.4.d: "More and more seem to be pulled into the extremes, while the center and or more \"logical\" parties and movements have held firm but many do have concerns. Are we heading down a rabbit hole or are we really going to Neverland?"
 USA_reformed_republic.4.o1: "La Reina De Corazones Nos Guíe Lejos"
 USA_reformed_republic.4.o2: "El Gato En El Sombrero Rectificará Eso"
 USA_reformed_republic.5.t: "Luchas Internas Crecen"
 USA_reformed_republic.5.d: "In the wake of Libertarian dominance in American Politics many have noticed a growing animosity within the leadership. So far there seems to be three main factions developing. The Liberty Guardsmen, which is an old guard like faction looking to keep the party status quo. The Free Business Association, which looks to further the economic deregulations. Finally there is the STEM Committee, a faction of engineers, chemists and general technical specialists who look to further the forms of liberty through science and rationalism. Many are unsure who may win, but whoever does will hopefully be able to keep the continued stability enjoyed currently."
 USA_reformed_republic.5.o1: "Los Guardianes De La Libertad Se Mantienen"
 USA_reformed_republic.5.o2: "La Asociación De Negocios Muestra Fuerza"
 USA_reformed_republic.5.o3: "El Comité STEM Descubre Victoria"
 USA_reformed_republic.100.t: "Militares Ven Crecimiento"
 USA_reformed_republic.100.d: "En las últimas semanas líderes militares han estado en un estado de alegría. La razón, un aumento constante en militarismo en la población mientras grupos civiles piden expansiones y más adiciones a programas JROTC en escuelas. Unidades locales de así llamada milicia comunitaria también han comenzado a surgir y eventos de recreación han visto un aumento constante en popularidad. Mientras muchos creen que esto es algo bueno para el NFP, algunos de los intransigentes son cautelosos debido al supuesto equilibrio que la coalición debía tener."
 USA_reformed_republic.100.o1: "¿Por Qué Arruinar Algo Bueno?"
 USA_reformed_republic.101.t: "Base Del Partido Cambia"
 USA_reformed_republic.101.d: "Rising concerns by hardliners within the NFP have started voicing the fact that a notable shift in the party base has begun. The military has seen rising volunteer numbers as well as national and state guard units have seen more towards raising the praises of the Pentagon elite than they have of the national leaders. Most of the voting base however has been seen as dismissing these concerns as in the words of one member quote, We all want a strong military and so who cares, end quote. Nevertheless the hardliners have become nervous over the shifting tides of the party."
 USA_reformed_republic.101.o1: "Let's Address These Concerns."
 USA_reformed_republic.200.t: "Naturalismo Público Creciente"
 USA_reformed_republic.200.d: "Fascists as well as their hardliner friends in the ANP and KKK have been in a state of glee as recent national trends show a growing demand of the US becoming more in line with its naturalistic history. A rise in attacks against ethnic minorities and essentially anyone who does not fit the supposed \"American\" identity. This essentially boils down to a Western European identity as the olive skinned peoples of the Southwestern parts of Europe were seen as products of their times. Many in the military are indifferent but a lot of moderates within the NFP are seeing concerns of a potential party shift as public trends seem to begin favoring one of the major factional groups within the NFP."
 USA_reformed_republic.200.o1: "Una Nación Estadounidense Para Un Pueblo Estadounidense."
 USA_reformed_republic.201.t: "Moderados Buscan Asilo"
 USA_reformed_republic.201.d: "National news breaks as cowardly fence sitters and seditionists flee the nation. The new party head of the NFP has seen fit to declare that quote, \"The enemies of the state as well as their feeble ideals flee our great nation. Today marks a real turning point in America's history as we the people now have the true rule.\" The speech went on for roughly a total of three hours as radios and television stations alike were lit up broadcasting this speech to all who would watch or listen. Global leaders are wary of the new American government and talks have already begun of what America's status should be with it no longer being the beacon of Democracy."
 USA_reformed_republic.201.o1: "¿Ha Terminado Pax Americana?"
 USA_reformed_republic.300.t: "¿Monarquismo Moderno?"
 USA_reformed_republic.300.d: "Monarchism, a term used to describe the old era of nearly a century ago. Yet through apparent strength of will a new movement has led the forefront of the NFP. The \"Modern Monarchist Movement\", is a faction that wishes to breathe a modern light onto an old ideal. Through countless rallies, speeches, informational pamphlets and so on the MMM have made clear that the modern system will not change, but rather be cosmetically altered. Many are skeptical of this new group but with the slogan, \"Every Man A King, Every Woman A Queen\", some do like the idea of making that little childhood fantasy into a modern reality."
 USA_reformed_republic.300.o1: "¿Qué Espectáculo De Fantasía Será Este?"
 USA_reformed_republic.301.t: "Fantasía, Más Bien Realidad"
 USA_reformed_republic.301.d: "In a shocking turn of events the MMM has secured majority power within the NFP, with radicals in the naturalist camp leaving the party and finding isolation in the wilds and forests of the expanse of continental America. The military is easier to convince due to the historic implications that monarchies have always prided their military. As for the fence sitters, well they're still sitting, enjoying the peace and understanding that things are not getting worse so it's only up from here. The MMM has begun making swift moves to inform the public as well as the greater world to ensure a peaceful rise and understanding of what many fear is the fall of the American Eagle."
 USA_reformed_republic.301.o1: "¿El Águila consigue otra cabeza ahora?"
 USA_reformed_republic.400.t: "El Cuerpo de Comisarios"
 USA_reformed_republic.400.d: "The Commissariat Corps is the military political wing of the Red Army. This group has seen more volunteers and interest in understanding the way to properly militarize the nation in line with the Socialist principles which will free our nation from the old order. Recently though the national committee has had some concerns over the growing ranks and popularity of the Commissariat Corps, though CC leadership assures the committee that there are no plans to do anything drastic. This has not stopped rumors from spreading in the lower ranks of the Corps."
 USA_reformed_republic.400.o1: "Seguramente bromeas, ¿verdad?"
 USA_reformed_republic.401.t: "¿La Junta Roja?"
 USA_reformed_republic.401.d: "In a shocking twist which looks like weeks of pre-meditated planning, a cabal of young officers in the Commissariat Corps have initiated a coup and established what they call the \"Red Junta\". This Socialist Military Junta seems to want to take the idea of national pride in service to the country and combine it with the ideas of Socialist economics. Given how both ideals can be used in an egalitarian and or unitarian sense many are surprisingly taken with the idea. But for now moderates and global spectators look on wondering what this new faction will do."
 USA_reformed_republic.401.o1: "¿Una Junta Roja? Qué tontería, no durará!"
 USA_reformed_republic.500.t: "El Partido Socialista de los Trabajadores"
 USA_reformed_republic.500.d: "In recent weeks the rise of the SWP has seen some heads turn in both intrigue and disgust. Most see the pro-trotskyist party as a stain on real socialist principles, while others see them as mere idealists who want nothing but power. Nevertheless some concern has arisen as more people seem to be joining the ranks of the SWP and it is threatening to tip the balances of power within the coalition. Party leadership is looking to cull any excesses to the SWP's influences but many are unsure if it will help."
 USA_reformed_republic.500.o1: "La Revolución Global... Más bien sufrimiento."
 USA_reformed_republic.501.t: "Golpe despiadado!"
 USA_reformed_republic.501.d: "In a shocking turn of events, organizers from the SWP have seized power and slaughtered key coalition leaders. The SWP leadership has proclaimed quote, \"We the members of the Socialist Workers Party have done the nation a favor. For it is time that we stop playing games and understand the true goals and ideals that Socialism and Socialists want. Unity, not compromise is the future and we will ensure that future is a reality. For The Socialist Dream!!!\". Many have begun to flee the nation and some nations around the world are already looking to impose sanctions on the United States of America and wonder what the future truly entails. For now many are worried and buying time to defend from potential incursions."
 USA_reformed_republic.501.o1: "Dios mío, ¿qué hemos hecho?"
 USA_reformed_republic.600.t: "La Sociedad Anarquista Estadounidense"
 USA_reformed_republic.600.d: "The AAS or American Anarchist Society is a fringe and clearly out of date political entity. Supposedly under the assumption that Anarchism can survive in such a civilized world, they tout their pamphlets and make speeches about the collective good and goals of the society. Well despite a slight trend in their membership and positions in the coalition, many discount them as no better than the quirks of the fringe."
 USA_reformed_republic.600.o1: "*resopla* ¿Qué somos, simios?"
 USA_reformed_republic.601.t: "Lo imposible claramente fue posible"
 USA_reformed_republic.601.d: "In a confusing and outlandish series of events, somehow the AAS has secured a majority within the coalition. Many onlookers both domestically and internationally stare in a mix of disbelief and confusion as the epitome of Oxymoronic actions have culminated in what is being proclaimed as the quote, \"First Elected Anarchist Government\". Nevertheless things appear to be moving on as normal but many still stare in an almost catatonic state at what is there to actually do now. But only time will tell if this is a ruse or something to be excited or disheartened by, only time can truly tell at this point."
 USA_reformed_republic.601.o1: "Seguramente esto es una broma... ¿verdad..verdad?"
 USA_crisis_event.1.t: "Los movimientos de protesta causan pánico"
 USA_crisis_event.1.d: "In recent days a crisis has arisen in the nation as a series of targeted protests has caused growing civil unrest as certain essential services like 911 and local emergency response forces have been obstructed. Several deaths which have transpired are being blamed on the protests due to the delays which emergency services have suffered. Some governors and even members of congress are drawing up plans to deal with the problem. Some recommend we let the problem be dealt with locally, others recommend mobilizing federal agencies, while some still even recommend just let it play out as it'll snuff itself out. The Official Response of the President was..."
 USA_crisis_event.1.o1: "Veremos cómo se desarrollan las cosas"
 USA_crisis_event.1.o2: "Movilizar los activos del FBI en el área"
 USA_crisis_event.1.o3: "Presionar a los funcionarios estatales para que hagan su trabajo"
 USA_crisis_event.2.t: "La situación local se deteriora"
 USA_crisis_event.2.d: "La inacción federal ha sido vista por algunos líderes locales y por algunos medios de comunicación nacionales como débil e indirectamente negociando con lo que se está convirtiendo en una situación de terrorismo nacional. Los funcionarios estatales ahora están solicitando al presidente que intervenga utilizando activos federales, mientras que algunos aún creen que el problema pasará y nos veremos como dictadores si respondemos. Más tarde hoy, el Secretario de Prensa de la Casa Blanca anunció en un comunicado que el presidente había decidido..."
 USA_crisis_event.2.o1: "Mantente firme, mantente fuerte"
 USA_crisis_event.2.o2: "Acción cautelosa para un orden cauteloso"
 USA_crisis_event.3.t: "Una luz parpadeante"
 USA_crisis_event.3.d: "The inaction of the federal government is starting to run thin on a lot of people's nerves. More now even locally are wanting the president to intervene to restore order as local officials appear to not be convicted enough to make decisive actions. Though it looks like there may be a break in the intensity, it could backfire as public trust has already sunken to a new low. The Choice is now, take a chance of peaceful resolution, or secure the region and bring back order and stability...whatever is left that is."
 USA_crisis_event.3.o1: "Veo una luz, §RLa gente prevalecerá§!"
 USA_crisis_event.3.o2: "La luz se desvanece... §GEnvía al FBI§!"
 USA_crisis_event.500.t: "La tormenta ha pasado"
 USA_crisis_event.500.d: "Se ha restaurado la paz, pero ¿por cuánto tiempo? Hemos recibido un golpe con esta crisis, pero hemos salido adelante. Debemos mantenernos vigilantes no sea que permitamos que algo como esto vuelva a crecer fuera de control."
 USA_crisis_event.500.o1: "Paz en nuestro tiempo"
 USA_crisis_event.4.t: "El Congreso lo hace de nuevo"
 USA_crisis_event.4.d: "Shocking news has come out of congress that the fiscal appropriations bill has not been resolved and is being deadlocked by members tacking on addendums and additives to the overall legislation. We've had these scares before, let alone the last real government shutdown was back in 95, so there shouldn't be too much to worry about."
 USA_crisis_event.4.o1: "¿No podemos simplemente llevarnos bien?!?"
 USA_crisis_event.5.t: "El Congreso bloqueado anticipa un cierre"
 USA_crisis_event.5.d: "With talks growing ever more stubborn we've since seen that a government shutdown is upon us. Both sides seem overtly adamant about what they expect in this fiscal year's appropriations bill and as such we could cost ourselves the coming election if things persist. The president is scrambling advisors and capitol hill is buzzing with congressional members trying to seek out as much political power they may have left."
 USA_crisis_event.5.o1: "¿Qué demonios está pasando?!?!"
 USA_crisis_event.5.o2: "Concéntrese en la elección"
 USA_crisis_event.6.t: "El mercado de valores causa pánico"
 USA_crisis_event.6.d: "With the shutdown turning into the longest to date, 20 days as of this report, many are beginning to fear the economic ramifications as federal programs have essentially grown into a redundant state. Wall Street has seen a slow drop in the DOW and S&P 500 respectively as even the supposed lobbyists are gobsmacked at this recent turn of events. All eyes are on the administration to see if things will recover or only get worse."
 USA_crisis_event.6.o1: "¿No podemos hacer que alguien esté de acuerdo?!?!"
 USA_crisis_event.6.o2: "Convoca una conferencia de prensa AHORA!!"
 USA_crisis_event.7.t: "El pánico inminente se apodera de la nación"
 USA_crisis_event.7.d: "The shutdown has lasted over two whole months. Panic on Wall Street has sent a shock to the investing arm of our economy. Rumors have it that several regional banks are nearing bankruptcy and that union agitation against the railroads has rapidly increased. If the situation continues to decline who knows what will become of the very home we live in."
 USA_crisis_event.7.o1: "§RHAN HECHO QUÉ!!!§!"
 USA_crisis_event.7.o2: "§GLiquida la situación, al diablo con la elección§!"
 USA_crisis_event.600.t: "De vuelta a la normalidad..."
 USA_crisis_event.600.d: "It would appear as things have begun to calm down. With the drastic shift in the president's priorities and with what many likely would see as strong arming, Congress has finally found a way to pass the legally required appropriations bill to continue normal government functions. Whether for better or worse it does look like things are back to a somewhat level state. For now the quote, Eternal Shutdown, has come to an end, let's just hope we don't repeat this...please."
 USA_crisis_event.600.o1: "¿Por qué esto se siente tan hueco?"
 USA_collapse_event.1.t: "¿Huelga ferroviaria masiva?!"
 USA_collapse_event.1.d: "With the Class 1's neglecting their duties and the federal government seen as weak to the strikers, talks of an impending railroad strike are buzzing about. Congress is scrambling to find details and work with both sides to finish negotiations out. Many hope...yet also believe this will only get worse."
 USA_collapse_event.1.o1: "¿Podemos arreglar esto?!?"
 USA_collapse_event.2.t: "El Congreso propone un acuerdo"
 USA_collapse_event.2.d: "The scramble for a fair deal to avoid the strike has come with a heavy heart. Strikers and the Class 1's which are being affected are at a standstill. A major problem being argued constantly is the points system used to regulate how employees take days off whether sick or not. This gross umbrella-ing of how to keep employees at work and efficient in their jobs has resulted in a strong animosity. This tension has now come to a head and congress has hit a road block with the reality of the situation becoming a growing fear for DC as a whole."
 USA_collapse_event.2.o1: "Seguramente verán la razón... ¿verdad?"
 USA_collapse_event.3.t: "Las negociaciones fracasan"
 USA_collapse_event.3.d: "Las negociaciones han explotado sobre sí mismas a medida que el pánico en Wall Street ha visto una caída similar a la de una recesión en el mercado de valores. El impacto de las huelgas ha visto que varios gobernadores declaren un estado de emergencia para tratar de calmar el creciente desorden público. La Casa Blanca ha movilizado a todas las agencias federales en un intento de hacer tratos entre bastidores y evitar que estas huelgas escalen a disturbios a gran escala."
 USA_collapse_event.3.o1: "Estamos en un río, ¿dónde diablos está nuestro remo!"
 USA_collapse_event.4.t: "El malestar civil consume a los respondedores"
 USA_collapse_event.4.d: "La intervención federal inicialmente vio buenos resultados ya que ciertas áreas vieron una especie de calma. Sin embargo, en áreas más afectadas, los oportunistas han tomado esta misma intervención gubernamental y han agitado demasiado la olla. Se han comenzado a reportar bajas civiles y multitudes de refugiados han comenzado a dejar la nación. Los rumores, junto con el mantra siempre hiperbólico de los medios, solo han empeorado el problema con una cantidad cada vez mayor de informes de disturbios y saqueos masivos que consumen a toda la nación. Esta tendencia de bola de nieve ha resultado en una cantidad cada vez mayor de daños a la propiedad y destrucción de la infraestructura en su conjunto. Las unidades de la Guardia Nacional han comenzado a movilizarse y el mando del DoD está organizando planes para tratar de reducir la situación."
 USA_collapse_event.4.o1: "Dios nos ayude a todos..."
 USA_collapse_event.5.t: "El colapso social es inevitable"
 USA_collapse_event.5.d: "In a near titanic sized decline in societal cohesion, National Guard units and federal military units have begun deserting in increasing numbers, with many citing they do not want to turn their guns on fellow Americans as well as general concerns of the well being of friends and loved ones. However loyalist military personnel have taken up defensive posturing in what is now being called the Federalist states. Governors and local officials around the country are scrambling to get ahold of their own backyards. Mass migration of US citizens has been recorded and Canada along with Mexico have had to step up asylum camps and general containment grounds to prevent this archaic spill over from destroying their countries as well."
 USA_collapse_event.5.o1: "Is This Where Pax Americana Ends?"
 USA_collapse_event.6.t: "El cristal comienza a romperse"
 USA_collapse_event.6.d: "Recientemente hemos escuchado informes de que Texas finalmente ha decidido, después de mucho tiempo, forzar su salida de la unión. Con el caos desenfrenado y la mayoría de los planificadores del Pentágono centrados en el gobierno central y la infraestructura crítica, muchos parecen preguntarse a dónde han ido algunas de nuestras unidades."
 USA_collapse_event.6.o1: "No pueden hacer eso, qué han hecho!!!"
 USA_collapse_event.6.o2: "Debo ir a buscar mi rosa amarilla"
 USA_collapse_event.7.t: "Eventos en cascada"
 USA_collapse_event.7.d: "Following on the heels of the recent Texas exit or Texit as some have called it, local leaders and groups in the states of Washington, Idaho and Oregon have begun to organize together as a new band of mountain brothers. Using a recent call of identity known as Cascadia, said Cascadians have begun to organize their own military force using remnants of the national guard and federal facilities in their states as a sort of canvas. This shocking realization has only increased the desertions and alarmingly growing cases of missing equipment from stockpiles."
 USA_collapse_event.7.o1: "¿A dónde van?"
 USA_collapse_event.7.o2: "Al diablo con esto, espérame!"
 USA_collapse_event.8.t: "Crisis del Caribe"
 USA_collapse_event.8.d: "With all the chaos on the continent there have been reports that Puerto Rico, our Caribbean island territory, has left the union. With reports of continued desertions seeking to flee the continent, they have found the island's recent actions a respite from chaos. It is this looming collapse that has seen Puerto Rico looking towards preparing itself for its sudden independence. While we'll miss our vacation spot, many are not concerned due to the state of the union at this time."
 USA_collapse_event.8.o1: "Una pérdida, pero no una falta"
 USA_collapse_event.8.o2: "Perdiendo, no yo."
 USA_collapse_event.9.t: "The 2nd Secession"
 USA_collapse_event.9.d: "History may not repeat itself but she, like fate herself can rhyme in many twisted ways. A collection of Southern governors have met in Mobile, Alabama to declare an official 2nd Secession from the Union. While the language was intermingled with past loathing and fearful future telling one thing was certain...The South was finally independent."
 USA_collapse_event.9.o1: "El Sur realmente se levantó de nuevo...."
 USA_collapse_event.9.o2: "Viajamos a Dixieland!"
 USA_collapse_event.10.t: "República del Oso una vez más"
 USA_collapse_event.10.d: "Con las recientes noticias de varios movimientos de independencia en busca contra el gobierno federal de los Estados Unidos de América, el gobernador de California ha llamado a sus unidades de la guardia nacional que regresaron para ayudar a organizar un toque de queda y declarar al estado independiente. El Oso ha sido liberado y no mucho después, más y más pánico se apodera de los estados federalistas alrededor de DC en sí mientras que todo el mundo esencialmente se derrumba a su alrededor."
 USA_collapse_event.10.o1: "Podemos recuperarnos, debemos!"
 USA_collapse_event.10.o2: "El Oso finalmente deambula libre."
 USA_collapse_event.11.t: "La bomba de Boston"
 USA_collapse_event.11.d: "The nation is tearing itself apart and to the complete shock of surprisingly a lot more people than expected, the Northeast territory has seceded from the union and formed the country of New England. Many see this as the truest form of backstabbing as the core of New England has been roughly the most in line of all the regions of the country to the federal government. This is now as some are beginning to call the quote, second shot heard round the world."
 USA_collapse_event.11.o1: "Un montón de Benedict Arnolds si me preguntas..."
 USA_collapse_event.11.o2: "Sabemos reconocer un barco que se hunde cuando lo vemos."
 USA_collapse_event.12.t: "¿Una nueva Nueva York?"
 USA_collapse_event.12.d: "New York, seeing the opportunity of the absolute chaos of the nation has declared independence from the federal government. The sinking fire boat of the United States as a nation has forced New York to seek independence as its own nation. Not wanting to join the estranged Northeasterners instead looking to be the mediator between New England and what some in the federalist states are calling the quote, Free States of America."
 USA_collapse_event.12.o1: "Nos estamos aislando más cada día."
 USA_collapse_event.12.o2: "Si tan solo Sinatra estuviera vivo para ver esto."
 USA_collapse_event.13.t: "El cinturón oxidado"
 USA_collapse_event.13.d: "The Great Lakes Confederation has been declared, the core of our nation's industrial base has fled our union and created a confederation around each other. We should've expected this, the great lakes themselves and all the waterways make this union a closely tied brotherhood of sorts. This with the culmination of the supposed \"Midwestern\" identity has only emboldened such unity. With the industrial heart gone it's only a matter of time before the rest of the nation falls apart."
 USA_collapse_event.13.o1: "Hemos perdido nuestros corazones y mentes..."
 USA_collapse_event.13.o2: "Ope, parece que tengo que ir a esto."
 USA_collapse_event.14.t: "La pesadilla de Custer"
 USA_collapse_event.14.d: "The breadbasket is gone... The Great Plains, a series of northern central states have banded together and with a compromise among its native populations have declared the Lakota Republic independent from the federal government. Where did we go wrong?"
 USA_collapse_event.14.o1: "Comienza el racionamiento..La ayuda no llega...."
 USA_collapse_event.14.o2: "Finalmente nos dejarán solos."
 USA_collapse_event.15.t: "Dios no los mormones"
 USA_collapse_event.15.d: "The world has finally gone mad to the point that the Union of Deseret has been declared in the Southern Rocky Mountain states. Though we're not sure if they are a Theocracy, the name reminds us all too much of the old struggles settling westward. In the future there may be a 2nd Utah War."
 USA_collapse_event.15.o1: "El destino es una amante vil de hecho."
 USA_collapse_event.15.o2: "El destino nos ha bendecido con un nuevo comienzo."
 USA_collapse_event.16.t: "La Osa Mayor tiene grandes planes"
 USA_collapse_event.16.d: "Informes provenientes de fuentes canadienses que indican que el estado de Alaska ha buscado su independencia. Sintiéndose confiado en sus recursos naturales y su nicho económico, el pueblo de Alaska se ha unido detrás de los movimientos de independencia generalizados que han desgarrado a la nación."
 USA_collapse_event.16.o1: "No durarán mucho... ¿verdad?"
 USA_collapse_event.16.o2: "Espera, ¿entonces qué cambia exactamente?"
 USA_collapse_event.17.t: "Pacifista del Pacífico"
 USA_collapse_event.17.d: "The Final Strike...the Union is truly dead. The pacific territories along with the state of Hawaii have created the Federation of Hawaiian States. This rump state is looking to appeal to its geostrategic locations along the Pacific Ocean to secure funding and mutual protections from foreign happenings. While certainly a pacifist route to take, many are truly wondering if they are buying time or hoping to return home to the Union itself."
 USA_collapse_event.17.o1: "¿El Pacífico está lleno de perlas o peligros?"
 USA_collapse_event.17.o2: "Toque rápido los botes para que sean nuestros ahora!"
 USA_collapse_event.18.t: "La Unión Federalista"
 USA_collapse_event.18.d: "With the union shattered beyond repair many local leaders in what is now being called the \"Federalist States\" have begun to attempt to organize themselves around the old capital of DC. With some cohesion being formalized the new rump state has been dubbed the Free States of America. It's not much, but it's certainly a step somewhere. Now we begin to figure out what can we even do."
 USA_collapse_event.18.o1: "¿A dónde vamos desde aquí?"
 USA_collapse_event.19.t: "El polvo se asienta"
 USA_collapse_event.19.d: "We are united no more...the damage looks to be well beyond repair. For now we must hold onto what little we have and attempt to make new from the ashes of old. God help us."
 USA_collapse_event.19.o1: "La Pax Americana ha terminado...¿Y ahora qué?"
 USA_collapse_event.20.t: "El fin de los tiempos"
 USA_collapse_event.20.d: "If you have found this letter, then the Union has indeed fallen. No one is earnestly certain why it happened, but many believe it was overdue to happen. Regardless it is the end, we've been offered asylum by the Japanese government for it seems the Okinawa base was not really affected due to comms problems and the Japanese authorities' assurances. God help those stuck on the continent."
 USA_collapse_event.20.o1: "Señor Presidente.... No me siento muy bien"
 USA_collapse_event.21.t: "El Reino Exterior se Hace Añicos"
 USA_collapse_event.21.d: "With the rapidly declining state of our nation, it has come to our attention that rampant unrest as well as independence movements outside of our direct control have reached a boiling point. With separatist movements and calls for independence growing to a fever pitch it's no wonder things feel like they have turned into the end of days itself."
 USA_collapse_event.21.o1: "It's Not The Homeland, But It Was Still Our Land"
 USA_collapse_event.22.t: "Why?"
 USA_collapse_event.22.d: "¿Por qué sigues aquí... no queda nada?"
 USA_collapse_event.22.o1: "Es hora de irse"
 USA_collapse_event.23.t: "Problemas del Sur"
 USA_collapse_event.23.d: "Con lo peor de las cosas superado, solo queda mejorar desde aquí. Por lo tanto, con los problemas y el estado de nuestra nación ahora fresca y muy joven, necesitamos resolver y manejar adecuadamente los problemas que nos aquejan."
 USA_collapse_event.23.o1: "Requerir Soluciones del Sur"
 USA_collapse_event.24.t: "Más Estados se Van"
 USA_collapse_event.24.d: "En el reciente caos, más gobernadores han decidido cooperar con la facción rebelde confederada aspirante que surgió de Mississippi y Alabama."
 USA_collapse_event.24.o1: "Jesús, ¿cuántos más se irán?"
 USA_collapse_event.25.t: "Convictos Confederados"
 USA_collapse_event.25.d: "Well more states leave our union and have chosen to declare their unity towards the convicts of the south. They surely won't get far since everyone knows they're just a bunch of fascists and slavers."
 USA_collapse_event.25.o1: "Podemos caer, pero ellos tampoco durarán"
 USA_collapse_event.26.t: "Más Óxido se Va"
 USA_collapse_event.26.d: "El desastre que es nuestro estado actual de funcionalidad social ha resultado en que más gobernadores nos dejen y se unan al club de cubos de óxido de la Confederación de los Grandes Lagos."
 USA_collapse_event.26.o1: "Buen viaje"
 USA_collapse_event.27.t: "Inadaptados del Medio Oeste"
 USA_collapse_event.27.d: "La situación es desesperada, más estados del medio oeste han huido prácticamente a los brazos de la confederación de estados alrededor de la antigua región del Cinturón de Óxido del medio oeste. Nunca nos recuperaremos de esto..."
 USA_collapse_event.27.o1: "¿Todos han perdido la cabeza?"
 USA_collapse_event.28.t: "La Segunda Masacre de Boston"
 USA_collapse_event.28.d: "Within the chaos and lawlessness, more states have fled to the supposed New England regional government as some are proclaiming a string of murders to be our fault. With some even somehow comparing it to the Boston Massacre which started the revolution."
 USA_collapse_event.28.o1: "Hay tanto dolor, por favor, no más guerra.."
 USA_collapse_event.29.t: "Grandes Incendios"
 USA_collapse_event.29.d: "El desastre en el que nos encontramos solo ha empeorado, ya que se informa de grandes incendios en los estados de las grandes llanuras. Para aumentar el caos, incluso más estados se han rebelado y se han unido a lo que se llama la República de Lakota."
 USA_collapse_event.29.o1: "Incluso Dios no puede salvarnos ahora"
 USA_collapse_event.30.t: "Calamidad en Cascada"
 USA_collapse_event.30.d: "Con lo peor de las cosas superado, solo queda mejorar desde aquí. Por lo tanto, con los problemas y el estado de nuestra nación ahora fresca y muy joven, necesitamos resolver y manejar adecuadamente los problemas que nos aquejan."
 USA_collapse_event.30.o1: "Podría ser peor..."
 USA_collapse_event.100.t: "Refugiados Estadounidenses"
 USA_collapse_event.100.d: "Con el colapso impactante de nuestro vecino del sur, hemos sido inundados por refugiados que buscan seguridad. Nos costará, pero a largo plazo resolveremos este problema."
 USA_collapse_event.100.o1: "El fin de una era está sobre nosotros"
 USA_collapse_event.101.t: "Refugiados Estadounidenses"
 USA_collapse_event.101.d: "Con el colapso impactante de nuestro vecino del norte, hemos sido inundados por refugiados que buscan seguridad. Nos costará, pero a largo plazo resolveremos este problema."
 USA_collapse_event.101.o1: "El fin de una era está sobre nosotros"
 USA_crisis_event.1000.t: "Crisis en el Sur"
 USA_crisis_event.1000.d: "Recently the federal government has issued a crisis declaration for the southern border as rapid increases of illegal migrants and growing unsafe conditions for properly processing migrants as a whole have resulted in more women and even children becoming endangered overall. Lawmakers and federal officials are looking into ways to relieve the issue, however with the timing being at the halfway point of a presidential term, local and some federal elections nearing voting hour, many genuinely wonder just how focused the federal government can be with this issue."
 USA_crisis_event.1000.o1: "No puede ser tan malo. ¿O sí?"
 USA_crisis_event.1001.t: "Texas vs. Estados Unidos"
 USA_crisis_event.1001.d: "Back in November the federal government announced plans to expand the eligibility of the DACA immigration legislation. However recently this has caused severe backlash in multiple republican states as their governments led by Texas have decided to take the federal government to court. The plaintiffs in this case have sued in the U.S. District Court for the Southern District of Texas, asking the court to halt implementation of both the DACA expansion and Deferred Action for Parents of Americans (DAPA). The case was considered by judge Andrew S. Hanen who issued a preliminary injunction blocking the expansion from going into effect while the case, Texas v. United States, proceeded."
 USA_crisis_event.1001.o1: "Los DREAMERS deberían soñar con otro lugar"
 USA_crisis_event.1001.o2: "Déjanos recibir a tus masas apiñadas y darles una mejor vida"
 USA_crisis_event.1002.t: "Miedos por días"
 USA_crisis_event.1002.d: "Since the aftermath of Texas v United States, things have begun to progress in a mostly counter intuitive manner when it comes to the \"immigration problem\". While many say we are flooding the country, others point out we have a moral obligation to properly process and at the very least care for those who made the long and extremely dangerous trip. As this \"debate\" rages on a lot more people who are not really active in terms of the news cycle realize the growing issue our federal government has become. With some saying it's purely D.C.'s fault for this issue, while others say it's the fault of older generations for not thinking ahead. Younger generations are starting to slowly become more politically active as the American Dream begins to turn into the American Make Believe, with many citing inconsistent and outright decaying reforms and regulations which have left younger generations in the dust in terms of economic mobility and opportunity. The question is whether this new youth movement will be able to gain enough traction to do something or not."
 USA_crisis_event.1002.o1: "Trabajar duro en trabajar poco es lo que digo"
 USA_crisis_event.1002.o2: "Trabajaremos duro en lo que queramos"
 USA_crisis_event.1003.t: "Puntos de inflexión políticos"
 USA_crisis_event.1003.d: "The run up to the 2016 presidential race has seen a strange near three way political fork in the road. On one hand you have Hillary Clinton, a veteran politician with a wealth of experience at the federal level as well as foreign policy. A strong and committed Democrat. To her left is Senator Bernie Sanders another veteran politician that is very charismatic despite his age, Senator Sanders has been a very strong leader for the Progressive movement in America, despite what opposition leaders may have you believe he is a \"Socialist\", the reality is, he's more of a mix of center-left and the standard Demsoc you might find in Europe, at least when looking through the perspective of American social and economic policies that is. Finally to the right hand side of both we have Donald Trump, businessman, novice and changing political interest as Trump has been a registered Democrat, Republican and even at one point joined Ross Perot's Reform Party back during his election bid for president. Trump is seen as a half breed between Evangelical and center-right, with inconsistent policy positions throughout the right spectrum as well as a supposed \"pro-America\" policy in relation to taxes and business incentivizing. In the end this cross roads will determine if and when America could see a major shift. For now let's just see who wins."
 USA_crisis_event.1003.o1: "La primera mujer, o un progresista posguerra fría, bien"
 USA_crisis_event.1003.o2: "Maldita sea, los demócratas nos han vendido"
 USA_crisis_event.1004.t: "La Corte Suprema dictamina sobre los solicitantes de asilo"
 USA_crisis_event.1004.d: "In september of 2019 the supreme court ruled on a policy that would demand that most asylum seekers who pass through another country first will be ineligible for asylum at the US's southern border. The ruling was stated to take effect in the first week of October, however protest against the ruling as inhumane has resulted in a renewal of the immigration debate. The administration has stated that this ruling deals a strong blow to false asylum seekers which are inhibiting real asylum seekers from getting the care and attention they need. As such rising concerns of the capacity of USBP agents on the southern border is being called into question as the asylum courts have now an estimated backlog of around one million cases."
 USA_crisis_event.1004.o1: "La decisión se mantiene"
 USA_crisis_event.1004.o2: "La decisión es impugnada internamente"
 USA_crisis_event.1005.t: "Título 42"
 USA_crisis_event.1005.d: "To quell down rates of infection and risk of what some are calling, albeit hyperbolizing, \"super spreading\", the federal administration has drafted up legislation called Title 42. This legislation is a quick band-aid reaction to the on-going influx of migration around the southern border and is not deemed a permanent solution to the ever gnawing issue at the border."
 USA_crisis_event.1005.o1: "Seguramente hay otra manera"
 USA_crisis_event.1005.o2: "No me llames Shirley"
 USA_crisis_event.1006.t: "Centroamérica Huye"
 USA_crisis_event.1006.d: "A medida que desastres políticos, económicos y ambientales golpean varias naciones centroamericanas, sus pueblos han decidido buscar mejores vidas sin importar los peligros de sus viajes. En los próximos años, incluso a pesar de los eventos globales, cerca de millones de ciudadanos de un puñado de naciones centroamericanas viajarán a través de Guatemala y México hacia los Estados Unidos. Aunque el gobierno federal no ha tomado en serio la situación, ya que los recursos locales e incluso desplegados federalmente se están estirando más allá de las capacidades de procesamiento, muchos se preguntan qué se necesitará para obtener algo de orden en la frontera."
 USA_crisis_event.1006.o1: "Estas personas necesitan ayuda, y no me refiero solo a los locales"
 USA_crisis_event.1007.t: "Un momento tenso en la historia moderna"
 USA_crisis_event.1007.d: "On January 11th Texas National Guardsmen took over Shelby park in the town of Eagle Pass. The park was originally being used by federal agents to house and detain migrants until they could be properly processed or deported. However as Texas continues Operation Lone Star with ever increasing encroachment upon federal agents and assets many fear just where this could lead to as nothing of the sort has been seen in US history. Currently as of January 22nd Texas National Guard units and federal BP agents are at a stand off, with a continued tit for tat over the setting up and destroying of razor wire similar to what you would see on a military outpost defensive fence line. For now many both locally and nationally hold their breath and some even openly send support for Texas as events proceed to play out. The federal administration's direct response to the developing situation is what many wonder will see if things escalate or simmer down as time marches on."
 USA_crisis_event.1007.o1: "Exigimos que Texas se retire"
 USA_crisis_event.1007.o2: "Dejemos que los tribunales se encarguen de esto, legalmente ganaremos"
 USA_crisis_event.1007.o3: "Forzar al Congreso a una Sesión de Emergencia"
 USA_crisis_event.1107.t: "El gobernador de Texas se mantiene firme"
 USA_crisis_event.1107.d: "Back in January Texas forces had a stand off with federal forces at Eagle Pass at a place called Shelby Park. Federal forces withdrew and continued the tit for tat tactics related to the more aggressive defensive \"fortifications\" they were putting along the border. However a statement has come out directly from the federal government which had detailed that Texas forces should stand down and let the federal government do its constitutional and legal job of maintaining the national border in the south along its Mexican neighbor. This statement was left unanswered and things had seemed to quiet down, however earlier today an official statement was released by the governor of Texas stating that quote, \"The federal government has failed in its constitutional and legal duties to protect and maintain the security of the national border. As such I as well as all of Texas and her local law and military forces will do whatever is needed to at the very least protect our own borders.\" Several states have already sent aid and manpower to the state of Texas in the form of volunteer law enforcement personnel and national guard soldiers with estimates of up to 500 national guard soldiers being sent by several other states who supported the actions of Texas in the on going crisis. This more or less hostile approach has many worried that America is on the brink of a constitutional crisis as both sides begin to take shape over whether or not Texas or the federal government is truly at fault."
 USA_crisis_event.1107.o1: "Sabes que ambos tienen la culpa. Cállate"
 USA_crisis_event.1108.t: "Texas aumenta las defensas"
 USA_crisis_event.1108.d: "Following the Texas governor's sort of \"stand fast\" affirmation against the federal government, Texas law enforcement and national guardsmen have been ramping up the creation of localized military installations as well as tasking local police forces to organize civilian attaches to look out for their towns. Many fear that Texas is on the cusp of doing something drastic and the federal government is looking to find ways to handle the situation without overt aggression. As one insider source states, \"People know Texas is technically in the wrong, but we've reached the national level of involvement and in general no one has been happy with the federal government on either side. So we need to do whatever possible to ensure that we can openly and quickly prove we are not the bad guys by how we treat the situation.\" Many hardliners see this as spineless, however moderates and even some opposition viewers have stated their open support and surprise at the handling of the federal government."
 USA_crisis_event.1108.o1: "¿No podemos terminar este juego ya?"
 USA_crisis_event.1109.t: "Texas deja el Congreso"
 USA_crisis_event.1109.d: "In the following days congress was put back into session and even into an emergency session as well. However it was during the emergency session which resulted in a shock to the nation. As it was reported no representatives both House and Senate had shown up from the state of Texas. Soon news reporters were swarming the Texas governor's office about the situation in which he held a press conference over the situation. At the press conference all absent members had shown up and pledged their protest in union with one another of the federal government's over stepping boundaries and pure negligence. For not just Texas but to the states themselves as we are supposedly a union of. Soon after the declaration of protest the governor ended the press conference to a flurry of pleas and questions from the crowd of news reporters as now the protest and Texas's now open defiance against the federal government was broadcast to the nation. A response from the federal administration stated that quote, \"This is an outright challenge to the authority and duties of the federal government. More so it is a challenge to the union for which we have had since 1865 when we solidified and reintegrated the confederate states back into the union and came to the unified understanding of the meaning and principles of our very existence as a nation.\" Though many were inspired by these words, some were worried it may only cause other states to side with Texas if they felt disconnected or left behind by the federal government. Regardless things are looking like little's changed but it only takes one \"shot\""
 USA_crisis_event.1109.o1: "Dios mío, ¿en qué nos hemos metido?"
 USA_crisis_event.1110.t: "¿Una nueva frontera!?"
 USA_crisis_event.1110.d: "Following the Texas withdrawal from congress as well as the slow internal militarization of the Texas peoples, word has come in that Texas authorities have begun to put up roadblocks and fencing around the state's borders with its neighbors. Fears have struck a fever pitch as never before has a hard border been established within the United States before, even with the Civil War open rebellion was first followed by the \"established border of the south\". It is with this notion that the federal government has issued an ultimatum to the state of Texas and its government. It reads, \"Cease all establishment of a hard border within these United States or the state of Texas will be declared in open rebellion and placed under martial law until the rebellion is under control.\" This declaration comes at a horrible time as it's only been a year into the new presidency as well as things are nearing the holidays. Many are afraid of a war in their own backyard as rumors abound of state governments weighing their options and wondering just what will the federal government do to the citizens of Texas and technically their own citizens by proxy. For now everyone waits with bated breath as Texas and the federal government look to be gearing up for a standoff."
 USA_crisis_event.1110.o1: "¿Dónde salió todo tan mal?"
 USA_crisis_event.1110.o2: "Al diablo ustedes, me voy a casa"
 USA_crisis_event.1111.t: "El plazo"
 USA_crisis_event.1111.d: "A month has passed and no word has been heard or said by the Texan government. As such by constitutional decree and congressional approval the state of Texas is declared under martial law and in open rebellion. US forces will begin to move in and swiftly handle the situation as it has gone on longer than anyone anticipated."
 USA_crisis_event.1111.o1: "Espera, ¿no teníamos más miembros del Congreso?"
 USA_crisis_event.1112.t: "Los hermanos del sur"
 USA_crisis_event.1112.d: "Parece que hemos dado un ejemplo, ya que un pequeño grupo de estados en el sur ha decidido no unirse a nosotros, sino dejar la unión. Con este conocimiento, nuestra causa se hace más grande, ya que, de hecho, es la autoridad federal excesiva la culpable y no nosotros los estados."
 USA_crisis_event.1112.o1: "Nuestra familia del sur ha llegado"
 USA_crisis_event.1112.o2: "Dios salve al sur"
 USA_crisis_event.1113.t: "Miembros del Congreso desaparecidos"
 USA_crisis_event.1113.d: "Turns out we were missing more congressional members, in the chaos and subsequent declaration it looks like a handful of southern states have decided to repeat history and declare their independence from what they deem is, \"Northern Aggression\". However the most concerning thing is they might not be the only ones. Rumors and fears are rampant of more potentially leaving the union as well as desertions and mutinies within the army as many genuinely don't want to turn their guns on fellow Americans despite if they agree with them or not. This ungodly moralism has led to a slight fit of lock up in military cohesion and actions as orders are getting lost and troops are not always cooperating with officers. The Department of Defense is looking to organize a training and refit station around Washington to filter out the poison and create a real fighting force against the rebellion."
 USA_crisis_event.1113.o1: "Jesús, ¿qué hemos hecho?"
 USA_crisis_event.1114.t: "Ronda dos... supongo"
 USA_crisis_event.1114.d: "To no one's surprise the southern rebellion and secession from the union was met with an instant declaration of war by the federal government. This lack luster \"round two\" as some are calling it has only made things worse off as even some states in the great plains and now even some though \"vote blue or don't vote\" states are even thinking of cutting their losses as the situation continues to grow out of proportion way more than ever anticipated."
 USA_crisis_event.1114.o1: "Hicimos esto antes y lo volveremos a hacer"
 USA_crisis_event.1115.t: "Gracias a Dios por los buscadores de paz"
 USA_crisis_event.1115.d: "Se ha informado que los estados de Montana, Dakota del Norte y del Sur han \"dejado la unión\". Sin embargo, en su declaración oficial fue más una abstención de la violencia. Esta declaración de neutralidad, así como el hecho de que se han fundado con el nombre temporal de la República de Lakota, ha enfurecido al gobierno federal, ya que varios silos de misiles se encuentran en estos estados. Por lo que es poco probable que dejen pasar tales activos estratégicos, incluso si los titulares son supuestamente pacíficos."
 USA_crisis_event.1115.o1: "Necesito un descanso de todo esto"
 USA_crisis_event.1115.o2: "Parece que la \"Unión\" no está tan unida"
 USA_crisis_event.1116.t: "Oh, diablos, no"
 USA_crisis_event.1116.d: "Montana y las Dakotas han decidido \"dejar la unión\", sin embargo, supuestamente solo quieren no participar en la violencia contra los estadounidenses y se reunirán cuando las cosas hayan concluido. ¿Están locos? Tienen varios activos militares y de defensa estratégica de alto valor en sus tierras y solo quieren \"paz\" con ellos."
 USA_crisis_event.1116.o1: "No En Nuestra Guardia"
 USA_crisis_event.1117.t: "No Más Amigos"
 USA_crisis_event.1117.d: "Looks like yet another domino falls for the supposed union. The heavily \"pro-federal\" states of the New England region have decided to peace out and form a regional government. In a statement made to national press, quote, \"In the beginning we saw the Texan and Southern rebellions as simple minded slaughter against America. However with the declared neutrality of the Lakota territories and the states around them being met with immediate hostility from the federal government. We have now seen the true colors of the Washington governmental body for what it really is, a power hungry and desperate defense against its status quo. We have therefore put it upon ourselves to declare similar neutrality from the on going conflict and expect to be declared on within hours or days of this declaration. God help us all.\" Things have certainly taken a free fall from here."
 USA_crisis_event.1117.o1: "No Puedo Dejarlos Simplemente Masacrarlos"
 USA_crisis_event.1117.o2: "Parece Otra Masacre de Boston"
 USA_crisis_event.1118.t: "Nuevos Inglaterra Locos"
 USA_crisis_event.1118.d: "Well even more scum want to leave and try this moralistic bull crap excuse of justifying their secession from the union. Well not on our watch, we can tackle them just as well as the instigators of this whole fiasco."
 USA_crisis_event.1118.o1: "¿Espera Nos Vamos Al Norte Ahora?"
 USA_crisis_event.1119.t: "Puerto ¿Quién?"
 USA_crisis_event.1119.d: "En medio de toda la confusión y el caos, parece que Puerto Rico ha dejado y declarado independencia. Eran un territorio y, por lo tanto, no hay una verdadera justificación para ir tras ellos de manera rampante. Además, cuando lo piensas, nos cuestan en promedio más porque solo puedes hacer ciertas cosas en una isla en comparación con el continente."
 USA_crisis_event.1119.o1: "Gracias A Dios Un Poco De Paz Y Tranquilidad"
 USA_crisis_event.1119.o2: "Buen Viaje, Lo Resolveremos Más Tarde"
 USA_crisis_event.1120.t: "La Guardia Nacional Se Levanta"
 USA_crisis_event.1120.d: "With the impending deadline, national and state guard units have been mobilized to hold the line. Some citizens even accepted a call to arms to defend Texas soil. They won't be much, but they'll help to plug the gaps."
 USA_crisis_event.1120.o1: "Dios Salve A Texas"
 USA_crisis_event.1121.t: "Reunirse Detrás De La Bandera"
 USA_crisis_event.1121.d: "Con la reciente independencia, se ha declarado un llamado a las armas, así como la movilización de la guardia nacional y las guardias estatales de los respectivos estados del Sur. Haremos todo lo posible para mantenernos firmes contra la tiranía federal y estar al lado de los texanos principiados."
 USA_crisis_event.1121.o1: "Dios Salve Al Sur!"
 USA_crisis_event.1122.t: "Han Venido A Matarnos"
 USA_crisis_event.1122.d: "Despite our clear intention of anti-conflict the federal government prizes their arms over their citizens. We may not last long but with whatever national guard we do have we can arm them and send them to the mountains. We need to do whatever to send a message, a message of the failed federal entity over the principles of the old union."
 USA_crisis_event.1122.o1: "Dios Nos Salve A Todos"
 USA_crisis_event.1123.t: "Defensas Civiles"
 USA_crisis_event.1123.d: "With the federal government poised to declare on us, many civilian militias and national guards units have self mobilized and are awaiting tasking. There's no way we'll stand up to the full might of the US military, but maybe we can hold on long enough for some miracle to happen."
 USA_crisis_event.1123.o1: "El Águila Realmente Ha Caído"
 USA_crisis_event.1124.t: "Más Traidoras"
 USA_crisis_event.1124.d: "Tras el establecimiento de una frontera dura por parte de Texas, poco después otros estados fronterizos comenzaron a unirse a ellos. Esta cascada de escalada es algo que no necesitamos y, Dios mediante, se calmarán cuando se alcance el plazo... ¿Dónde salieron tan mal las cosas?"
 USA_crisis_event.1124.o1: "¿Por Qué No Podemos Llevarnos Bien?"
 USA_crisis_event.1207.t: "Los Tribunales Toman El Control"
 USA_crisis_event.1207.d: "In the aftermath of the Eagle Pass stand off, a steady back and forth through the legal system, department of homeland security as well as different levels of the courts began to toss around and attempt to solve the more or less on going stand off between Texas and federal forces. For the most part little has changed and the continued tit for tat over Texas's Operation Lone Star continues. As Texas forces continue to put down wire and \"fortification\" federal BP agents continue to work to take down said instruments of obstruction. Overall the situation seems to mostly be at a standstill but continued legal proceedings are still on going. Many hope that as time goes on and elections on the horizon that this change of leaderships will allow for a peaceful end to the current, \"meh\", state of affairs."
 USA_crisis_event.1207.o1: "Recuerden, Amigos, Estos Son Adultos"
 USA_crisis_event.1307.t: "Clamor Público Contra Todos"
 USA_crisis_event.1307.d: "Tras el tenso enfrentamiento en Eagle Pass, protestas organizadas de independientes y otros grupos de defensa de partidos políticos han estado protestando tanto contra los gobiernos y fuerzas de Texas como federales para que se reúnan y resuelvan adecuadamente los problemas en cuestión. Estas protestas coordinadas han estado dirigidas a funcionarios gubernamentales y agentes militares/policiales de ambos lados que decidieron acercarse a la frontera, así como en o fuera de sus instalaciones. Según los rumores, cualquiera de los lados ha decidido considerar realmente llevar a cabo conversaciones y abrir un diálogo real sobre la situación que afecta a los estados fronterizos del sur."
 USA_crisis_event.1307.o1: "Santa Mierda Pueden Actuar Como Adultos"
 USA_crisis_event.1308.t: "Convención De Lexington"
 USA_crisis_event.1308.d: "Representatives of both the southern border state governments led by Texas and representatives of the federal administration have met up in Lexington, Kentucky to discuss and genuinely approach the supposed border problem. The meeting itself started off a little heated as some border representatives were just tired of the political pressure caused by the overt increase in traffic flow around their states as there is no increase in resources to account and tend to such increases. However neutral controlling parties tempered these outbursts before they could escalate. After a generally lengthy debate and back and forth a general agreement was reached. Budgetary increases to improve processing facilities, recruit more personnel and set a plan for a genuine border line to help monitor and look out for migrants looking to enter the US regardless of legal or illegal intent to limit excesses in oversight will be implemented as soon as possible. Consequently plans will be drafted by the USBP agency and congress with local state governments to create new border crossing facilities to allow for better dissemination of traffic to and from the US and Mexico as well as better spread out immigration processing as well. Many see this as a win for the nation as a whole as political and independent activists were able to create enough pressure against not only state but federal officials to cause genuine change related to a political manner. In the following days more and more organized political movements would cause pressures for political and economic reforms which have many more debating on the validity of the current two party system."
 USA_crisis_event.1308.o1: "Hay Una Luz Al Final Del Túnel"
 USA_foreign_event.1.t: "Estados Unidos Ofrece Un Trato De Armas"
 USA_foreign_event.1.d: "We are being offered military equipment for a lump sum of money."
 USA_foreign_event.1.o1: "Apreciamos La Ayuda"
 USA_foreign_event.1.o2: "Estamos Resistiendo Bien"
 USA_foreign_event.111.t: "Sierra Leona Acepta"
 USA_foreign_event.111.d: ""
 USA_foreign_event.111.o1: "Gracias Por Su Negocio"
 USA_foreign_event.112.t: "Sierra Leona Rechaza El Trato"
 USA_foreign_event.112.d: ""
 USA_foreign_event.112.o1: "Seguramente Fracasarán Ahora"
 USA_foreign_event.2.t: "Estados Unidos Ofrece Enviar Asesores Militares"
 USA_foreign_event.2.d: "Nos están ofreciendo asesores militares para ayudar a refinar a nuestros soldados en tácticas de batalla modernas."
 USA_foreign_event.2.o1: "Les Agradecemos Por El Conocimiento"
 USA_foreign_event.2.o2: "Conocemos La Tierra En La Que Luchamos"
 USA_foreign_event.221.t: "Sierra Leona Acepta Asesores"
 USA_foreign_event.221.d: ""
 USA_foreign_event.221.o1: "Encantados De Ayudar"
 USA_foreign_event.222.t: "Sierra Leona Rechaza A Nuestros Asesores"
 USA_foreign_event.222.d: ""
 USA_foreign_event.222.o1: "Se Arrepentirán De Eso"
 USA_foreign_event.3.t: "Musulmanes Estadounidenses Vienen Por Nuestra Causa"
 USA_foreign_event.3.d: "Hemos estado viendo un flujo de voluntarios musulmanes estadounidenses, estas personas listas pueden ayudar a nuestra causa ya que traen sus propios suministros y equipos."
 USA_foreign_event.3.o1: "Alá Da La Bienvenida A Todos"
 USA_foreign_event.3.o2: "Su Fe Ha Sido Manchada, Fuera Herejes."
 USA_foreign_event.331.t: "Afganistán Acepta"
 USA_foreign_event.331.d: "El gobierno afgano ha aceptado la Legión de voluntarios musulmanes."
 USA_foreign_event.331.o1: "Por Un Futuro Libre"
 USA_foreign_event.332.t: "Afganistán Rechaza"
 USA_foreign_event.332.d: ""
 USA_foreign_event.332.o1: "¿Cómo Pudieron?"
 USA_foreign_event.4.t: "Estados Unidos Ofrece Un Trato De Armas"
 USA_foreign_event.4.d: "We have been approached by the United States with an offer to help supply our military. While we may need the equipment there is concern with taking help from the leader of the \"Western\" world."
 USA_foreign_event.4.o1: "Necesitamos Los Suministros"
 USA_foreign_event.4.o2: "Alá Guiará A Nuestras Fuerzas"
 USA_foreign_event.441.t: "Afganistán Acepta Nuestras Armas"
 USA_foreign_event.441.d: ""
 USA_foreign_event.441.o1: "Victoria Segura"
 USA_foreign_event.442.t: "Afganistán Rechaza Nuestras Armas"
 USA_foreign_event.442.d: ""
 USA_foreign_event.442.o1: "¿Por Qué Nos Molestamos?"
 USA_foreign_event.5.t: "The United States Offers Free Supplies"
 USA_foreign_event.5.d: "We are being presented a gift of military supplies to fight for our freedom from the Fundamentalists, as such we could take this in stride and potentially be influenced politically or we could stave it out and rally behind our righteous cause."
 USA_foreign_event.5.o1: "Un Regalo Gratis Para Un Futuro Libre"
 USA_foreign_event.5.o2: "No Necesitamos Su Caridad"
 USA_foreign_event.551.t: "Afganistán Acepta La Donación"
 USA_foreign_event.551.d: ""
 USA_foreign_event.551.o1: "Una Buena Deducción De Impuestos"
 USA_foreign_event.552.t: "Afganistán Rechaza Nuestra Donación"
 USA_foreign_event.552.d: ""
 USA_foreign_event.552.o1: "Una Oportunidad Perdida"
 USA_foreign_event.6.t: "EE.UU. Ofrece Asesores Militares"
 USA_foreign_event.6.d: "The United States has offered to send military advisors to train our troops with the offered equipment. We could accept this but look weaker to our neighbors than already perceived, or we take the help and potentially safeguard the future of our nation."
 USA_foreign_event.6.o1: "Aceptamos Con Gusto"
 USA_foreign_event.6.o2: "Prevaleceremos En El Nombre De Alá"
 USA_foreign_event.661.t: "Afganistán Acepta Nuestros Asesores"
 USA_foreign_event.661.d: ""
 USA_foreign_event.661.o1: "Una Buena Asociación"
 USA_foreign_event.662.t: "Afganistán Rechaza A Nuestros Asesores"
 USA_foreign_event.662.d: ""
 USA_foreign_event.662.o1: "¿Cuánto Saben Realmente?"
 USA_foreign_event.7.t: "América Hace Una Oferta"
 USA_foreign_event.7.d: "The Americans have come to us with a most curious offer. In exchange for a lump sum payment and development of our domestic oil industry for aid against Iraqi advances. The catch is we would be giving the product exclusively to the US until a later determined date. "
 USA_foreign_event.7.o1: "Nuestra Independencia Es Demasiado Importante"
 USA_foreign_event.7.o2: "No Nos Venderemos. Punto."
 USA_foreign_event.771.t: "Kuwait Acepta Nuestra Aventura"
 USA_foreign_event.771.d: ""
 USA_foreign_event.771.o1: "Un Buen Trato Para Todos"
 USA_foreign_event.772.t: "Kuwait Rechazó Nuestra Aventura"
 USA_foreign_event.772.d: ""
 USA_foreign_event.772.o1: "Qué Desperdicio"
 USA_foreign_event.8.t: "América Ofrece Armas"
 USA_foreign_event.8.d: "The Americans come with an offer of selling TOW missiles on the cheap as a way to defend against Iraqi Armor forces."
 USA_foreign_event.8.o1: "Nuestra Independencia Se Mantiene Con Estas Armas"
 USA_foreign_event.8.o2: "Podemos Resistir Con Lo Que Tenemos"
 USA_foreign_event.881.t: "Kuwait Acepta Nuestras Armas"
 USA_foreign_event.881.d: ""
 USA_foreign_event.881.o1: "Un Paso En La Defensa Mutua"
 USA_foreign_event.882.t: "Kuwait Rechazó Nuestras Armas"
 USA_foreign_event.882.d: ""
 USA_foreign_event.882.o1: "Les DoY Menos De Un Día"
 USA_foreign_event.9.t: "EE.UU. Ofrece Trato Comercial"
 USA_foreign_event.9.d: "EE.UU. ha venido a nosotros con un trato comercial. Vendemos nuestro petróleo a un precio ligeramente más barato y los inversores de EE.UU. ayudarán a hacer crecer los campos petroleros y nuestra economía."
 USA_foreign_event.9.o1: "Free Trade Means Progress"
 USA_foreign_event.9.o2: "No Nos Venderemos"
 USA_foreign_event.991.t: "Kuwait Acepta Nuestro Plan De Desarrollo"
 USA_foreign_event.991.d: ""
 USA_foreign_event.991.o1: "Un Futuro Seguro Para Ellos"
 USA_foreign_event.992.t: "Kuwait Rechazó Nuestro Plan De Desarrollo"
 USA_foreign_event.992.d: ""
 USA_foreign_event.992.o1: "Quédate En El Tercer Mundo Entonces"
 USA_foreign_event.10.t: "EE.UU. Envía Armas"
 USA_foreign_event.10.d: "EE.UU. nos ha traído equipos para ayudar a nuestra causa de defensa nacional de la amenaza iraquí."
 USA_foreign_event.10.o1: "Un Regalo Gratis Del Mundo Libre"
 USA_foreign_event.10.o2: "Permaneceremos Vigilantes"
 USA_foreign_event.10101.t: "Kuwait Acepta Nuestra Donación"
 USA_foreign_event.10101.d: ""
 USA_foreign_event.10101.o1: "Por Un Oriente Medio Más Libre"
 USA_foreign_event.10102.t: "Kuwait Rechaza Nuestra Donación"
 USA_foreign_event.10102.d: ""
 USA_foreign_event.10102.o1: "Una Oferta Realmente Perdida"
 USA_foreign_event.11.t: "EE.UU. Envía Asesores Militares"
 USA_foreign_event.11.d: "EE.UU. nos ha traído asesores militares para ayudar a nuestra causa de defensa nacional de la amenaza iraquí."
 USA_foreign_event.11.o1: "Un Regalo Gratis Del Mundo Libre"
 USA_foreign_event.11.o2: "Permaneceremos Vigilantes"
 USA_foreign_event.11111.t: "Kuwait Acepta Nuestros Asesores"
 USA_foreign_event.11111.d: ""
 USA_foreign_event.11111.o1: "El Tamaño No Lo Es Todo"
 USA_foreign_event.11112.t: "Kuwait Rechaza A Nuestros Asesores"
 USA_foreign_event.11112.d: ""
 USA_foreign_event.11112.o1: "Palabras Tan Grandes De Una Nación Pequeña"
 USA_foreign_event.12.t: "Nacionales Árabes Estadounidenses Se Agolpan A Nuestra Causa"
 USA_foreign_event.12.d: "Recientemente, ha habido una gran afluencia de nacionales árabes estadounidenses en nuestro país que buscan ayudarnos a defendernos de la amenaza iraquí."
 USA_foreign_event.12.o1: "Luchadores Por La Libertad Permanecen Firmes"
 USA_foreign_event.12.o2: "Árabes Contaminados No Sirven A Alá"
 USA_foreign_event.12121.t: "Kuwait Acepta La Legión"
 USA_foreign_event.12121.d: ""
 USA_foreign_event.12121.o1: "Por Una Causa Unida"
 USA_foreign_event.12122.t: "Kuwait Rechaza La Legión"
 USA_foreign_event.12122.d: ""
 USA_foreign_event.12122.o1: "Por Un Futuro Dividido"
 USA_foreign_event.13.t: "Primacía Del Ejército Sirio Libre"
 USA_foreign_event.13.d: "Oriente Medio no es una gran preocupación, ya que nuestro suministro nacional y la inversión en otras áreas nos complementan; sin embargo, eso no significa que debamos quedarnos de brazos cruzados. Vamos a darles algo que hacer a nuestros contratistas de defensa."
 USA_foreign_event.13.o1: "Sí"
 USA_foreign_event.14.t: "Vendiendo Armas A Los Sirios"
 USA_foreign_event.14.d: "La guerra civil siria significa mucho para los creyentes anti-terror y nuestros intereses estratégicos. Sin embargo, como no hay un ganador claro, podemos optar por vender armas a una nación específica o a todas las naciones."
 USA_foreign_event.14.o1: "Dejemos Fluir El Dinero"
 USA_foreign_event.14.o2: "El FSA Es El Camino"
 USA_foreign_event.14.o3: "Rojava El Dinero"
 USA_foreign_event.14.o4: "ISIS Congelará A Todos"
 USA_foreign_event.14.o5: "Al-Nusra, Más Bien Te Pagaré"
 USA_foreign_event.14.o6: "Me Quedé Sin Chistes Además Todos Están Peleando Contigo, Solo Compra"
 USA_foreign_event.15.t: "Apoyando A Los Combatientes De Siria"
 USA_foreign_event.15.d: "La comunidad internacional desconfía de nuestro silencio más o menos sincero ante la crisis de Oriente Medio. Intentemos calmar esta perspectiva otorgando algo de 'ayuda exterior' a quienes luchan por la causa 'correcta'."
 USA_foreign_event.15.o1: "Nada Como Un Truco De RP"
 USA_foreign_event.16.t: "Asesores Militares Para El Ejército Sirio Libre"
 USA_foreign_event.16.d: "La comunidad internacional no sabrá nada si enviamos asesores, pero estos asesores necesitan equipamiento para entrenar, así que vamos a proporcionarles algo."
 USA_foreign_event.16.o1: "Sí"
 USA_foreign_event.17.t: "Apoyo De Canales De Retroalimentación"
 USA_foreign_event.17.d: "El entrenamiento es lento y las pérdidas de equipos están aumentando, organicemos un trato fuera del ojo público para asegurar la idea de preservación de equipos en las fuerzas sirias."
 USA_foreign_event.17.o1: "Necesitamos Esto"
 USA_foreign_event.17.o2: "Podemos Hacer Frente A Los Nuestros"
 USA_foreign_event.18.t: "América Hace Un Gesto Fuerte"
 USA_foreign_event.18.d: "The war continues, there seems to be little progress in terms of a victory. The United States has come to us with a strong offer, this being essentially a brigade. The problem is they want a large amount of money for it. If we are not in a good fiscal position then this deal could break our chances in a victory... But if we can make it, then this boosts our chances in securing the nation for our cause with what would be known as the Bomba Brigade."
 USA_foreign_event.18.o1: "Adelante Hacia La Victoria!!!"
 USA_foreign_event.18.o2: "Ojalá Pudiéramos"
 USA_foreign_event.19.t: "Formación De La Legión De Damasco"
 USA_foreign_event.19.d: "Volunteers have flocked to our Free Army as a way to pledge their services to help make Syria a free nation, while some are sceptical others believe this is the boost we need to win the war."
 USA_foreign_event.19.o1: "Hacer Siria Libre"
 USA_foreign_event.19.o2: "No Nos Sometemos A Influencias Occidentales"
