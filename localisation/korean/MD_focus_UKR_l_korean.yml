 ukraine_develop_btr4.2.b: "무장 모듈"
 ukraine_develop_btr4.3.name: "'BTR-4' APC의 무장 모듈 선택"
 ukraine_develop_btr4.3.desc: "BTR-4 APC의 무장 모듈을 선택할 수 있습니다.\n\n§YBM-1B '흐림'§! 무장: 30mm 자동포 1문, 30mm 자동 유탄발사기 1정, 7.62mm 동축 기관총 1정, 9P135M '콘쿠르스' 또는 '바리에르' 대전차 미사일 4발.\n\n§YKBA-105 '시크발'§! 무장: 30mm 자동포 1문, 7.62mm 동축 기관총 1정, 9P135M '콘쿠르스' 또는 '바리에르' 대전차 미사일 4발 (선택 사양으로 30mm 자동 유탄발사기 1정을 장착할 수 있으나 대전차 미사일은 2발로 줄어듦).\n\n§YBAU 23x2§! 무장: 23x152mm 자동포 2문, 7.62mm 동축 기관총 1정."
 ukraine_develop_btr4.3.a: "BM-1B '흐림'"
 ukraine_develop_btr4.3.b: "KBA-105 '시크발'"
 ukraine_develop_btr4.3.c: "BAU 23x2"
 ukraine_develop_btr4.4.name: "'BTR-4' APC의 엔진 선택"
 ukraine_develop_btr4.4.desc: "BTR-4 APC의 엔진을 선택할 수 있습니다.\n\n§Y3TD-3§!: 출력 500마력의 우크라이나제 2행정 3기통 디젤 엔진.\n\n§Y도이츠 BF6M1015CP§!: 출력 442마력의 독일제 4밸브 6기통 디젤 엔진.\n\n§Y이베코 커서 10-430§!: 출력 430마력의 이탈리아제 24밸브 6기통 디젤 엔진."
