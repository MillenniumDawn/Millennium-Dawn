 israel_likud.5.t: "Um Pedido de Imunidade"
 israel_likud.5.d: "O primeiro-ministro Netanyahu apresentou um pedido de imunidade ao presidente do Knesset em meio a acusações contra ele nos tribunais. O Knesset terá agora que decidir se concede ou não imunidade a Benjamin Netanyahu."
 israel_likud.5.a: "Ele está falando sério?"
 israel_likud.6.t: "O Partido Aprova"
 israel_likud.6.d: "Os parlamentares do Likud apoiaram a petição de Netanyahu e pediram que um comitê de decisão fosse criado o mais rápido possível."
 israel_likud.6.a: "Ótimo!"
 israel_likud.7.t: "O Partido Rejeita"
 israel_likud.7.d: "Os parlamentares do Likud criticaram a petição de Netanyahu e pediram a rejeição do pedido."
 israel_likud.7.a: "Nem pensar!"
 israel_likud.8.t: "A Coalizão Nos Apoia"
 israel_likud.8.d: "Nossos parceiros de coalizão apoiaram o pedido e pediram que um comitê de decisão fosse criado o mais rápido possível"
 israel_likud.8.a: "Amigos de verdade!"
 israel_likud.9.t: "A Coalizão Nos Apoia"
 israel_likud.9.d: "Nossos parceiros de coalizão rejeitaram o pedido e pediram sua rejeição."
 israel_likud.9.a: "Traidores!"
 israel_likud.10.t: "O Povo Está Furioso!"
 israel_likud.10.d: "A notícia sobre o pedido se espalhou por Israel, causando descontentamento na população, com a oposição organizando manifestações contra as audiências e exigindo a retirada do projeto."
 israel_likud.10.a: "Eles não entendem!"
 israel_likud.11.t: "O Primeiro Canal Está em Silêncio"
 israel_likud.11.d: "Graças à reforma do Primeiro Canal, seus repórteres optaram por não cobrir o pedido de imunidade, de modo que ele não gerou muita publicidade."
 israel_likud.11.a: "Bom."
 israel_likud.12.t: "A Reportagem do Primeiro Canal'"
 israel_likud.12.d: "A reportagem do Canal Um sobre o pedido despertou fortes emoções na população, causando maior ressentimento entre os cidadãos de tendência oposicionista e fortalecendo a resistência da oposição ao pedido."
 israel_likud.12.a: "Desastre."
 israel_likud.13.t: "O Pedido Foi Aprovado!"
 israel_likud.13.d: "Apesar de todas as contradições e da resistência da oposição, o comitê foi estabelecido. Como resultado da reunião, o comitê decidiu conceder imunidade ao primeiro-ministro."
 israel_likud.13.a: "Vitória para Israel!"
 israel_likud.14.t: "O Pedido Foi Rejeitado!"
 israel_likud.14.d: "Apesar de todas as tentativas, o presidente decidiu não formar um comitê e não conceder imunidade a Netanyahu."
 israel_likud.14.a: "Desastre!"
 israel_likud.15.t: "A Caça às Bruxas"
 israel_likud.15.d: "A investigação de corrupção de Netanyahu voltou à mídia, que alega que Benjamin possui muitos imóveis no exterior comprados com dinheiro do governo. No entanto, Netanyahu afirmou que nada disso é verdade e que a mídia está engajada em uma caça às bruxas."
 israel_likud.15.a: "É exatamente isso!"
 israel_likud.16.t: "Os Protestos!"
 israel_likud.16.d: "Pessoas insatisfeitas com nossa reforma judicial foram protestar hoje nos centros urbanos. Os manifestantes exigem o fim do processo de revisão da lei e alguns indivíduos radicalizados exigem a renúncia do governo."
 israel_likud.16.a: "Liberais!"
 israel_likud.17.t: "Deserções em massa"
 israel_likud.17.d: "Recebemos um relatório de que muitos homens mobilizados e alistados estão desertando do exército em massa em protesto contra nossa lei. Eles alegam que não cumprirão seu dever se a reforma judicial não for interrompida."
 israel_likud.17.a: "Isso não é bom"
 israel_likud.18.t: "Preocupações no Ministério da Defesa"
 israel_likud.18.d: "Nosso ministro da Defesa está muito preocupado com a situação em torno da reforma judicial. Ele disse que o avanço do projeto ameaça a segurança nacional do país e que ações imprevistas podem se seguir, e que por isso devemos recuar."
 israel_likud.18.a: "Ele tem razão, recuar!"
 israel_likud.18.b: "Demiti-lo!"
 israel_likud.19.t: "O Protesto do Milhão de Pessoas"
 israel_likud.19.d: "Tel Aviv ruge com os gritos das massas que saíram às ruas contra a reforma judicial. Os manifestantes exigem a renúncia do governo e o fim do processo de análise da reforma. A situação é bastante perigosa, as pessoas estão cada vez mais radicalizadas e temos cada vez menos margem de manobra. Podemos interromper a reforma, e então temos uma chance de salvar nosso governo, ou podemos reprimir os protestos, mas isso poderia ter consequências gravíssimas."
 israel_likud.19.a: "Arriscado demais, recuar!"
 israel_likud.19.b: "A polícia cuidará deles."
 israel_likud.20.t: "Desobediência Civil"
 israel_likud.20.d: "Estamos registrando atos de desobediência civil em todo o país, especialmente em Tel Aviv. A oposição liberal organizou um governo provisório e está convocando todos os seus apoiadores a se armarem e invadirem o Governo, dizendo que não somos mais legítimos. Os radicais de direita acusaram Netanyahu de impotência e fraqueza e tomaram o poder com o uso de forças internas. Agora a situação escalou e não há volta, só nos aguarda derramamento de sangue."
 israel_likud.20.a: "Estamos prontos!"
 israel_likud.0.t: "O Discurso de Netanyahu no Tribunal!"
 israel_likud.0.d: "Em um pronunciamento recente, o primeiro-ministro israelense Benjamin Netanyahu disse que o escândalo de corrupção em torno dele nada mais é do que uma farsa criada para manchar sua reputação."
 israel_likud.0.a: "Não havia nada, não haverá nada!"
 israel_likud.1.t: "A Mídia Israelense Desencadeia um Escândalo!"
 israel_likud.1.d: "Recentemente, veículos de mídia israelenses divulgaram um relatório escandaloso sobre o primeiro-ministro israelense Benjamin Netanyahu, acusando-o de negócios corruptos, comportamento antiético e de desperdiçar o orçamento do Estado com gastos sem sentido."
 israel_likud.1.a: "Idiotas!"
 israel_likud.2.t: "Então, ele está limpo?"
 israel_likud.2.d: "Os veículos de mídia informam que não conseguiram desenterrar nada de novo sobre o caso Netanyahu e o escândalo de corrupção. Não se sabe se essa situação continuará ou se tudo mudará em uma direção radicalmente diferente."
 israel_likud.3.t: "Netanyahu subjuga o partido Likud!"
 israel_likud.3.d: "Netanyahu conseguiu transformar completamente o Likud em seu partido pessoal e subjugar todos os círculos de poder internos do partido, criando para si um círculo de leais e puxa-sacos."
 israel_likud.3.a: "A chutzpá dá seus frutos..."
 israel_likud.4.t: "Netanyahu criou uma nova coalizão!"
 israel_likud.4.d: "Netanyahu cria uma nova coalizão de partidos de direita sob o protetorado do partido Likud. O novo movimento une todos os movimentos sionistas de direita em um único bloco."
 israel_likud.4.a: "Temam-nos, liberais!"
 israel_likud.2.a: "Ha!"
 israel_likud.21.t: "Bibismo"
 israel_likud.21.d: "Netanyahu é primeiro-ministro há muito tempo e, durante esse período, suas políticas, assim como o próprio partido Likud, passaram por mudanças significativas, passando do conservadorismo moderado para uma retórica populista de direita. Junto com as acusações formais contra Netanyahu em escândalos de corrupção, seu partido está perdendo rapidamente o apoio entre o eleitorado moderado, mas a imagem de Netanyahu como um \"combatente contra o elitismo\" e sua radicalização política tornam Bibi muito mais atraente para o eleitorado de direita e antissistema. Talvez estejamos testemunhando uma nova era para o sistema político israelense e para o próprio Likud."
 israel_likud.21.a: "A Grande Virada."
 israel_likud.22.t: "Populismo Mundial"
 israel_likud.22.d: "Nossos opositores, ao nos criticar, usam a palavra populismo. Dizem que só sabemos fazer promessas e que nos apoiamos apenas em palavras vazias, mas para nós populismo significa política popular. Nosso Governo não representa os interesses de uma elite mesquinha; representamos os interesses do israelense comum, interessado em preservar sua cultura e suas tradições.\n No entanto, nossa experiência é vista em outros países, nossas ideias se espalham entre grupos de pessoas que antes se diziam antissemitas, mas agora percebem que é o povo judeu o portador da verdadeira ideologia e das tradições de direita.\n E continuaremos a abrir seus olhos; ajudaremos todo movimento que apoie a ideia do populismo de direita e que defenda melhores relações com Israel."
 israel_likud.22.a: "A Era Populista."
 israel_likud.23.t: "A Ascensão do Populismo Europeu"
 israel_likud.23.d: "Em meio aos acontecimentos mundiais, novos partidos ideológicos ganham popularidade em toda a Europa. Em um cenário de insatisfação popular com a situação econômica dos países europeus, com a queda do poder de compra e com o descontentamento de parte da população com as políticas de imigração, partidos populistas de direita e eurocéticos entram na cena política. Jogando com os sentimentos das pessoas, esses partidos ganham apoio rapidamente, o que alguns países percebem como uma ameaça à democracia e à unidade europeia."
 israel_likud.23.a: "A Era Populista."
 israel_likud.24.t: "A Ascensão do Populismo Polonês"
 israel_likud.24.d: "Law and Justice is gaining popularity by adopting right-wing populist platform. Even though it is an establishment party, but this does not prevent them from learning from Netanyahu's experience and adopting a populist platform that appeals to the masses."
 israel_likud.24.a: "A Era Populista."
 israel_likud.25.t: "A Ascensão do Populismo Húngaro"
 israel_likud.25.d: "Orban's party is gaining popularity by adopting right-wing populist platform. Even though it is an establishment party, but this does not prevent them from adopting Netanyahu's experience and adopting a populist platform that appeals to the masses."
 israel_likud.25.a: "A Era Populista."
 israel_likud.26.t: "A Ascensão do Populismo Americano"
 israel_likud.26.d: "O Partido Republicano está passando por grandes mudanças. A recessão econômica e as políticas de imigração estão causando descontentamento no eleitorado americano, criando um terreno ideal para o surgimento de movimentos populistas e, em meio à popularidade das ideias populistas de esquerda de Bernie Sanders entre o eleitorado democrata, políticos que promovem uma agenda populista de direita estão surgindo no Partido Republicano. Só o tempo dirá se os políticos populistas conseguirão avanços no sistema político dos EUA."
 israel_likud.27.t: "Netanyahu's Visit"
 israel_likud.27.d: "Recently, Israeli Prime Minister Benjamin Netanyahu has traveled to Washington, D.C., where he met with senior members of the Republican Party. As a result of the meeting, the Republicans reaffirmed their contribution to Israelis' struggle for the right to exist and pledged their support under a Republican administration. It is clear that Netanyahu is trying to enlist the support of Republicans to lobby for Israel's interests to receive additional military and political support."
 israel_likud.27.a: "Interessante."
 israel_likud.28.t: "Reunião com o Establishment Republicano"
 israel_likud.28.d: "Nos reunimos com membros de alto escalão do Partido Republicano em Washington. Como resultado da reunião, os republicanos reafirmaram seu reconhecimento da luta do povo israelense pelo direito de viver em sua terra e garantiram que, sob sua administração, Israel pode contar com maior apoio militar e político."
 israel_likud.28.a: "Nossos maiores amigos."
 israel_likud.29.t: "Netanyahu's Visit to Moscow"
 israel_likud.29.d: "Israeli Prime Minister Benjamin Netanyahu has arrived in Moscow to meet with our government. As a result of the meeting, we reached mutual understanding and concluded several mutually beneficial contracts."
 israel_likud.29.a: "Que reunião agradável!"
 israel_likud.30.t: "Reunião com a Liderança Russa"
 israel_likud.30.d: "Nos reunimos com autoridades russas de alto escalão em Moscou. Como resultado da reunião, garantimos acordos favoráveis e fortalecemos a amizade russo-israelense."
 israel_likud.30.a: "Que reunião agradável!"
 israel_likud.31.t: "Netanyahu's Visit to Brasilia"
 israel_likud.31.d: "Israeli Prime Minister Benjamin Netanyahu has arrived in Brasila to meet with our President. As a result of the meeting, we reached mutual understanding and secures several mutually beneficial investment projects."
 israel_likud.31.a: "Que reunião agradável!"
 israel_likud.32.t: "Meeting with the Bolsonaro"
 israel_likud.32.d: "We met with Brazilian President Bolsonaro in Brasilia. As a result of the meeting, we secure favorable investment projects and strengthened Brazilian-Israeli friendship."
 israel_likud.32.a: "Que reunião agradável!"
 israel_likud.33.t: "Netanyahu's Official Visit"
 israel_likud.33.d: "Israeli Prime Minister Netanyahu has arrived in Washington to meet with our president. The Israeli side wants our support and also Benjamin Netanyahu recalled the Republican Party's pledge to increase military aid to Israel."
 israel_likud.33.a: "Eles só poderiam receber nosso apoio político."
 israel_likud.33.b: "We can give them an economic support."
 israel_likud.33.c: "Cumpriremos nossa promessa."
 israel_likud.33.e: "Não podemos ajudá-los com nada no momento."
 israel_likud.34.t: "Resultados da Nossa Visita"
 israel_likud.34.d: "Como resultado da nossa visita oficial, só conseguimos acordar um apoio político."
 israel_likud.34.a: "Melhor que nada."
 israel_likud.35.t: "Resultados da Nossa Visita"
 israel_likud.35.d: "As a result of the official visit, we could not agree on receiving military support, but the American side offered to sign some beneficial investment projects"
 israel_likud.35.a: "Um bom acordo."
 israel_likud.36.t: "Resultados da Nossa Visita"
 israel_likud.36.d: "As a result of our official visit, we were able to reach an agreement and secured military and political support"
 israel_likud.36.a: "Viva!"
 israel_likud.37.t: "Resultados da Nossa Visita"
 israel_likud.37.d: "Como resultado da nossa visita oficial, não conseguimos chegar a um entendimento. Por isso, saímos de mãos vazias."
 israel_likud.37.a: "Que desastre!"
 israel_likud.38.t: "Guest form Israel"
 israel_likud.38.d: "Israeli Prime Minister Benjamin Netanyahu have arrived in Budapest for an official visit. During his visit, Netanyahu praised our commitment in preserving conservative values and traditions and also offered us his political and economic support."
 israel_likud.38.a: "Aceitaremos com prazer."
 israel_likud.38.b: "Não precisamos realmente da sua ajuda."
 israel_likud.39.t: "Sucesso!"
 israel_likud.39.d: "Nossa visita terminou em sucesso e conseguimos convencer o governo húngaro a aceitar nosso apoio."
 israel_likud.39.a: "Novo aliado."
 israel_likud.40.t: "Fracasso!"
 israel_likud.40.d: "Nossa visita terminou em fracasso; não conseguimos convencer o governo húngaro a aceitar nosso apoio."
 israel_likud.40.a: "Que pena!"
 israel_likud.41.t: "Uma Mensagem de Israel"
 israel_likud.41.d: "Recebemos uma mensagem do governo israelense. Eles estão preocupados com a nossa posição sobre a veracidade da participação do povo polonês no holocausto do povo judeu e exigem esclarecimentos oficiais sobre o assunto."
 israel_likud.41.a: "Ambos somos vítimas do Maior Horror."
 israel_likud.41.b: "Nenhum polonês participou do holocausto dos judeus!"
 israel_likud.42.t: "Uma Mensagem"
 israel_likud.42.d: "Recebemos uma resposta do governo polonês. Eles reconheceram que o holocausto do povo judeu foi um desastre, mas negam ter conhecimento de qualquer participação dos próprios poloneses. O governo polonês também afirmou em um comunicado que os povos polonês e judeu passaram por sofrimentos terríveis e que devemos manter coletivamente viva a memória dos crimes nazistas."
 israel_likud.42.a: "Talvez eles tenham razão."
 israel_likud.43.t: "Uma Mensagem"
 israel_likud.43.d: "Recebemos uma resposta do governo polonês, que reconheceu que o holocausto do povo judeu foi um desastre, mas que a participação do povo polonês nele era uma notícia falsa e que os próprios poloneses sofreram sob o regime nazista. Também afirmaram que declarações sobre a participação do povo polonês no genocídio são um aviltamento da dignidade do povo."
 israel_likud.43.a: "Como ousam!?"
 israel_likud.44.t: "Uma Proposta Interessante"
 israel_likud.44.d: "O governo de Israel nos procurou com uma proposta interessante. Eles oferecem firmar conosco um acordo pelo qual o registro de casamentos civis no Chipre será considerado legal em Israel."
 israel_likud.44.a: "Me dê uma caneta agora mesmo!"
 israel_likud.44.b: "Recusaremos gentilmente"
 israel_likud.45.t: "Acordo com o Chipre"
 israel_likud.45.d: "Conseguimos firmar com sucesso um acordo com o governo do Chipre."
 israel_likud.45.a: "Bom para eles."
 israel_likud.46.t: "Fracasso!"
 israel_likud.46.d: "O governo do Chipre recusou nossa proposta."
 israel_likud.46.a: "Pior para eles."
 israel_likud.47.t: "O Acordo de Associação UE-Israel"
 israel_likud.47.d: "O governo de Israel nos ofereceu um acordo de associação. Ele contém uma grande quantidade de acordos comerciais e políticos, além da criação de comitês especiais para discutir e coordenar políticas na região."
 israel_likud.47.a: "Aceitaremos com prazer."
 israel_likud.47.b: "Não estamos interessados."
 israel_likud.48.t: "O Acordo de Associação UE-Israel foi assinado!"
 israel_likud.48.d: "Os representantes da UE aceitaram nossa proposta de Acordo de Associação!"
 israel_likud.48.a: "Sucesso!"
 israel_likud.49.t: "Fracasso..."
 israel_likud.49.d: "Os representantes da UE recusaram nossa proposta de Acordo de Associação!"
 israel_likud.49.a: "Vergonha deles!"
 israel_likud.50.t: "O Acordo de Associação EUA-Israel"
 israel_likud.50.d: "O governo de Israel nos ofereceu um acordo de associação. Ele contém uma grande quantidade de acordos comerciais e políticos, além da criação de comitês especiais para discutir e coordenar políticas na região."
 israel_likud.50.a: "Aceitaremos com prazer."
 israel_likud.50.b: "Não estamos interessados."
 israel_likud.51.t: "O Acordo de Associação EUA-Israel foi assinado"
 israel_likud.51.d: "Os representantes dos EUA aceitaram nossa proposta de Acordo de Associação!"
 israel_likud.51.a: "Sucesso!"
 israel_likud.52.t: "Fracasso..."
 israel_likud.52.d: "Os representantes dos EUA recusaram nossa proposta de Acordo de Associação!"
 israel_likud.52.a: "Vergonha deles!"
 israel_likud.53.t: "Uma Proposta de Israel"
 israel_likud.53.d: "O governo israelense deseja nacionalizar nossa participação no Conselho de Portos Comerciais e nos oferece compensação em troca."
 israel_likud.53.a: "Um bom acordo."
 israel_likud.53.b: "Não estamos interessados."
 israel_likud.54.t: "Sucesso!"
 israel_likud.54.d: "A UE concordou em nos vender sua participação!"
 israel_likud.54.a: "Bom para nós."
 israel_likud.55.t: "Fracasso!"
 israel_likud.55.d: "A UE rejeitou nossa proposta de nos vender sua participação!"
 israel_likud.55.a: "É o que é."
 israel_likud.55.b: "Então a tomaremos à força!"
 israel_likud.56.t: "A Tomada Violenta!"
 israel_likud.56.d: "O governo israelense tomou nossa participação no conselho, violando todos os acordos!"
 israel_likud.56.a: "Desgraçados!"
 israel_likud.57.t: "Uma Proposta de Israel"
 israel_likud.57.d: "O governo israelense deseja nacionalizar nossa participação no Conselho de Portos Comerciais e nos oferece compensação em troca."
 israel_likud.57.a: "Um bom acordo."
 israel_likud.58.t: "Sucesso!"
 israel_likud.58.d: "Os EUA concordaram em nos vender sua participação!"
 israel_likud.58.a: "Bom para nós."
 israel_likud.59.t: "Fracasso!"
 israel_likud.59.d: "Os EUA rejeitaram nossa proposta de nos vender sua participação!"
 israel_likud.59.a: "É o que é."
 israel_likud.59.b: "Então a tomaremos à força!"
 israel_likud.60.t: "A Tomada Violenta!"
 israel_likud.60.d: "O governo israelense tomou nossa participação no conselho, violando todos os acordos!"
 israel_likud.60.a: "Desgraçados!"
 israel_likud.61.t: "Problemas no Paraíso"
 israel_likud.61.d: "Os acontecimentos recentes na Faixa de Gaza e a forma como o governo lidou com eles provocaram acirrada controvérsia dentro do Likud. O líder do partido, Ariel Sharon, e seus apoiadores moderados anunciaram sua saída do partido e a formação de um novo partido político, o Kadima. O lugar de Sharon foi ocupado por seu rival político Benjamin Netanyahu. Embora o Kadima tenha boas chances de manter sua posição no Knesset, isso não muda o fato de que a posição de Ariel Sharon na força policial se tornou bastante frágil."
 israel_likud.61.a: "Esperemos  £ISR_liberalism_alt1 que o Kadima tenha um Futuro."
 israel_likud.61.b: "Dano Sério ao Governo"
 israel_likud.63.t: "Problemas no Paraíso"
 israel_likud.63.d: "A saúde debilitada de Ariel Sharon não lhe permite mais ocupar o cargo de primeiro-ministro, e sua renúncia não foi uma surpresa, mas minou gravemente a posição do partido recém-formado. Ehud Olmert assumiu o cargo de primeiro-ministro, mas sua baixa aprovação entre a população não dá esperança de um futuro brilhante para o novo governo."
 israel_likud.63.a: "As Coisas Estão Ruins para Olmert."
 israel_likud.64.t: "A Eleição da Liderança"
 israel_likud.64.d: "A eleição do líder do Kadima já não está no horizonte, a posição de Olmert está se tornando precária e a possibilidade de sua reeleição é reduzida a zero. Quem liderará o partido?"
 israel_likud.64.a: "Olmert Conduzirá o Partido até o Fim!"
 israel_likud.64.b: "A Ala Progressista de Livni Terá Sucesso."
 israel_likud.64.c: "A Ala Moderada de Mofaz Terá Sucesso."
 israel_home.1.t: "A Questão da Liderança"
 israel_home.1.d: "Como o partido é, na prática, dirigido por uma dupla, surgiu a questão de quem chefiará o governo de Israel. Muitos preferem a candidatura de Ayelet Shaked, que defende maior participação de mulheres religiosas no serviço nacional, mas uma grande parte do partido também apoia Naftali Bennett, defensor da máxima não interferência na economia."
 israel_home.1.a: "Naftali será o PM"
 israel_home.1.b: "Ayelet Shaked será a PM"
