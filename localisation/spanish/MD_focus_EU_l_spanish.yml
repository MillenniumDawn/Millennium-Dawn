 EU_show_available_desc_309_loc_key: "§9This proposed law is an Office EU Law.§!\n\nThe member states have decided that the EU should be a permanent member of the United Nations Security Council (UNSC). This is done by reforming the UNSC or by transferring the seat(s) of the member state(s) already being UNSC member(s) to the EU."
