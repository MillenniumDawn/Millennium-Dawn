 TurkicConfederation.41.a: "Great News for the Turkic Confederation"
 TurkicConfederation.12.t: "Aserbaidschan lehnt Angebot ab"
 TurkicConfederation.12.d: "Die aserbaidschanische Regierung hat unser Angebot, der Türkischen Konföderation beizutreten, abgelehnt. Es scheint, als müssten wir uns für eine mögliche Vereinigung an andere Nationen wenden."
