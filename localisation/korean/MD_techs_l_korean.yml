 encryption_3: "암호화 III"
 encryption_3_desc: "현대 컴퓨터의 암호화 기법과 더 발전된 방화벽은 우리가 온라인에서 진정으로 보호받는 데 도움이 됩니다."
 encryption_4: "암호화 IV"
 encryption_4_desc: "현대 컴퓨터의 암호화 기법과 더 발전된 방화벽은 우리가 온라인에서 진정으로 보호받는 데 도움이 됩니다."
 encryption_5: "암호화 V"
 encryption_5_desc: "현대 컴퓨터의 암호화 기법과 더 발전된 방화벽은 우리가 온라인에서 진정으로 보호받는 데 도움이 됩니다."
 encryption_6: "암호화 VI"
 encryption_6_desc: "현대 컴퓨터의 암호화 기법과 더 발전된 방화벽은 우리가 온라인에서 진정으로 보호받는 데 도움이 됩니다."
 internet_1: "1G"
 internet_1_desc: "1G는 무선 이동 통신의 1세대입니다. 1G 네트워크에서 전송되는 무선 신호는 아날로그입니다."
 internet_2: "2G"
 internet_2_desc: "2G, 즉 2세대 이동통신 네트워크는 1991년에 상용화되었습니다. 2G는 암호화, 광대역의 효율적 사용, 그리고 SMS 문자 메시지를 시작으로 한 모바일 데이터 서비스에서 큰 개선을 이루었습니다."
 internet_3: "3G"
 internet_3_desc: "3G, 즉 3세대 이동통신 네트워크는 모바일 기기와 이동 통신의 새로운 표준을 세웠습니다. 새로운 세대의 이동통신 네트워크는 더 큰 kbit/s를 지원했으며 무선 음성 통화, 모바일 인터넷 접속, 모바일 TV 등에서 더 많은 활용처를 찾았습니다."
 internet_4: "4G"
 internet_4_desc: "4G, 즉 4세대 이동통신 네트워크는 오늘날의 모바일 인터넷 접속 형태를 갖추었습니다. 모바일 웹 접속, IP 전화, 게임 서비스 등 디지털 접근성과 관련된 수많은 서비스에 현재 활용되고 있습니다. 4G는 이전 세대의 아날로그 방식을 거의 완전히 대체했습니다."
 internet_5: "5G"
 internet_5_desc: "가장 현대적인 이동통신 광대역 네트워크 방식인 5G는 2019년에 배치가 시작될 예정입니다. 더 넓은 대역폭을 제공하여 더 빠른 다운로드 속도, 결국에는 10Gbit/s에 이르게 합니다. 대역폭 증가로 일반 인터넷 서비스 제공업체가 이를 이용해 케이블 인터넷과 경쟁할 수 있는 가능성도 열릴 것으로 여겨집니다."
 internet_6: "6G"
 internet_6_desc: "6G는 대역폭을 20Gbit/s까지 늘릴 미래의 광대역 네트워크 표준입니다. 이를 통해 광대역은 대규모 데이터 전송에 더욱 적합해질 것입니다."
 internet_7: "7G"
 internet_7_desc: "7G는 대역폭을 120Gbit/s까지 늘릴 미래의 광대역 네트워크 표준입니다. 이를 통해 광대역은 대규모 데이터 전송에 더욱 적합해질 것입니다."
 internet_8: "8G"
 internet_8_desc: "8G는 대역폭을 240Gbit/s까지 늘릴 미래의 광대역 네트워크 표준입니다. 이를 통해 광대역은 대규모 데이터 전송에 더욱 적합해질 것입니다."
 internet_9: "9G"
 internet_9_desc: "9G는 대역폭을 480Gbit/s까지 늘릴 미래의 광대역 네트워크 표준입니다. 이를 통해 광대역은 대규모 데이터 전송에 더욱 적합해질 것입니다."
 internet_10: "10G"
 internet_10_desc: "10G는 대역폭을 1480Gbit/s까지 늘릴 미래의 광대역 네트워크 표준입니다. 이를 통해 광대역은 대규모 데이터 전송에 더욱 적합해질 것입니다."
 internet_11: "11G"
 internet_11_desc: "11G는 대역폭을 10240Gbit/s까지 늘릴 미래의 광대역 네트워크 표준입니다. 이를 통해 광대역은 대규모 데이터 전송에 더욱 적합해질 것입니다."
 internet_access_1: "Wi-Fi"
 internet_access_1_desc: "Wi-Fi는 IEEE 802.11 표준군에 기반한 무선 네트워크 프로토콜의 모음으로, 기기의 근거리 통신망 구성과 인터넷 접속에 흔히 사용됩니다. 'Wi-Fi'라는 용어는 상표이며 Wi-Fi 얼라이언스가 관리합니다. Wi-Fi는 유선 방식인 이더넷과 매끄럽게 연동되도록 설계되었습니다."
 internet_access_2: "Li-Fi"
 internet_access_2_desc: "라이파이(Li-Fi)는 기능 면에서 Wi-Fi와 비슷합니다. Li-Fi가 Wi-Fi보다 유리한 점은 최대 100Gbit/s까지 데이터를 전송할 수 있다는 것이며, 전 세계 여러 기관에서 개발하고 있습니다."
 internet_access_3: "현대 위성 인터넷 접속"
 internet_access_3_desc: "위성이 통신과 기타 데이터 전송에서 점점 더 보편화되면서, 인터넷은 위성 접속을 활용한 서비스 중 하나가 되었고 이로써 더 많은 사람이 인터넷에 연결될 가능성이 열렸습니다."
 agriculture_1: "GPS 농업 응용"
 agriculture_1_desc: "GPS의 발명은 여행에 혁명을 일으켰지만, 우리는 이를 작물에 활용할 영리한 새로운 방법을 고안했습니다. 이 신기술은 농경지 경계, 도로, 관개 시설, 문제 구역의 지도 작성 같은 정밀 농업에 도움이 됩니다. 정밀한 지도 덕분에 농부들은 다른 농장과 비교한 자신의 농장에 대해 폭넓은 지식을 얻을 수 있고, GPS 데이터를 바탕으로 문제 구역을 파악하는 데에도 도움이 됩니다."
 agriculture_2: "자동 관개 체계"
 agriculture_2_desc: "관개 체계를 자동화하면 농업 노동자의 일이 줄어 정비, 작물 개선 방안 고안 등 더 중요한 임무에 투입할 수 있습니다."
 agriculture_3: "영농 데이터 분석 소프트웨어"
 agriculture_3_desc: "작물의 성공 및 실패 비율, 특정 농약의 문제 발생 비율 등을 분석하는 새로운 데이터 분석 소프트웨어를 발명하면 농업 부문의 생산성을 크게 높이는 데 도움이 될 것입니다."
 agriculture_4: "제한적 자동 수확 기술"
 agriculture_4_desc: "제한적인 자동 수확 및 관리 능력을 갖추면 단순 작업은 가벼운 일을 처리할 수 있는 자동 로봇과 드론에 맡기고, 농업 인력은 더 무겁고 전문적인 작업에 집중하도록 줄여 나갈 수 있습니다."
 agriculture_5: "위성 기반 농업 계획"
 agriculture_5_desc: "GPS 응용을 확장하여 위성 영상과 기타 위성 데이터를 활용하면 우리의 범위를 넓히고 작물 재배지를 면밀히 계획하여 가장 생산적인 농지를 확보할 수 있습니다."
 agriculture_6: "프로그래밍 가능 수확기"
 agriculture_6_desc: "콤바인과 수확기 같은 일부 중형 농기계에 새 소프트웨어를 설치하면 운전자가 운전석에서 기계를 관리하는 동안 작업 지시를 프로그래밍하고 자동화할 수 있어 추가적인 생산성을 얻고 오차 범위를 더 줄일 수 있습니다."
 agriculture_7: "개선된 수확 자동화"
 agriculture_7_desc: "제한적인 자동 수확 기계를 더 확장하고 자동 수확 및 관리 능력을 추가로 설치하면 농부와 농업 노동자들의 시간이 더욱 늘어납니다."
 agriculture_8: "로봇 수확기"
 agriculture_8_desc: "로봇 농업 노동자를 개발하고 배치하면 생산성이 향상될 뿐만 아니라 많은 농업 인력이 들판과 축사에서 벗어나 다른 핵심 산업으로 옮겨 갈 수 있습니다."
 agriculture_9: "AGI 관리 농업 개발"
 agriculture_9_desc: "범용 인공지능(AGI)의 등장과 발전 덕분에 더 많은 인력의 자동화와 배치를 계속할 수 있으며, 막대한 식량 생산 수준을 유지하면서도 우리 산업에서 대규모 농업 노동자의 필요를 사실상 없앨 수 있습니다."
 battleship_desc: "대구경 화포와 기타 무기를 탑재한 대형 중장갑 군함입니다. 주로 1800년대부터 제2차 세계 대전까지 사용되었으며, 항공모함이나 더 작은 함정에 밀려 외면받게 되었습니다. 다양한 고구경 또는 대용량 무기를 장비할 수 있어, 이 떠다니는 포 플랫폼은 훌륭한 화력 지원 플랫폼이 됩니다."
 nsb_special_ammo_6: "6세대 병기 현대화"
 nsb_special_ammo_6_desc: "차세대 적응형 탄두, 모듈식 탄약, 고충격 폭발 체계의 전면적 통합입니다."
