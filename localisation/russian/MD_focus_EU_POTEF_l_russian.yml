l_russian:
 POTEF001: "Президент Европейской федерации"
 POTEF001_desc: "§YПрезидент Европейской федерации (POTEF)§! является высшим лидером Европы. Следовательно, Президент Европейской федерации обладает полномочиями принимать решающие стратегические решения для всей Федерации."
 POTEF100: "Альпийская доктрина"
 POTEF100_desc: "Альпийские государства §Y[AUS.GetNameWithFlag]§! и §Y[SWI.GetNameWithFlag]§! имеют давнюю традицию ведения горной войны. С Альпийской доктриной все государства-члены могут перенять эту традицию и тактику."
 POTEF101: "Целостность творения"
 POTEF101_desc: "Чтобы сохранить и сберечь целостность творения, Европейская федерация адаптирует свою политику."
 POTEF102: "Экологический империализм"
 POTEF102_desc: "Европа зелёная, но мир по-прежнему тёмный и серый. Европа должна распространить свою политику и технологии по всему миру и дать отпор ископаемым энергетическим империям, которые разрушают планету."
 POTEF103: "Северная Америка"
 POTEF103_desc: "Европа зелёная, но Северная Америка всё ещё тёмно-серая. Европа должна распространить свою политику и технологии по всему миру и дать отпор ископаемым энергетическим империям, которые разрушают планету."
 POTEF104: "Южная Америка"
 POTEF104_desc: "Европа зелёная, но Южная Америка всё ещё тёмно-серая. Европа должна распространить свою политику и технологии по всему миру и дать отпор ископаемым энергетическим империям, которые разрушают планету."
 POTEF105: "Европа"
 POTEF105_desc: "Европа зелёная, но другие европейские страны всё ещё тёмно-серые. Европа должна распространить свою политику и технологии по всему миру и дать отпор ископаемым энергетическим империям, которые разрушают планету."
 POTEF106: "Африка"
 POTEF106_desc: "Европа зелёная, но Африка всё ещё тёмная и серая. Европа должна распространить свою политику и технологии по всему миру и дать отпор ископаемым энергетическим империям, которые разрушают планету."
 POTEF107: "Ближний Восток"
 POTEF107_desc: "Европа зелёная, но Ближний Восток всё ещё тёмно-серый. Европа должна распространить свою политику и технологии по всему миру и дать отпор ископаемым энергетическим империям, которые разрушают планету."
 POTEF108: "Азия"
 POTEF108_desc: "Европа зелёная, но Азия всё ещё тёмная и серая. Европа должна распространить свою политику и технологии по всему миру и дать отпор ископаемым энергетическим империям, которые разрушают планету."
 POTEF109: "Океания"
 POTEF109_desc: "Европа зелёная, но Океания всё ещё тёмно-серая. Европа должна распространить свою политику и технологии по всему миру и дать отпор ископаемым энергетическим империям, которые разрушают планету."
 POTEF110: "Тихий океан"
 POTEF110_desc: "Европа зелёная, но Тихий океан всё ещё тёмно-серый. Европа должна распространить свою политику и технологии по всему миру и дать отпор ископаемым энергетическим империям, которые разрушают планету."
 POTEF150: "Немецкая доктрина"
 POTEF150_desc: "§Y[GER.GetNameWithFlag]§! традиционно делала ставку на сильные бронетанковые войска. С бронетанковой доктриной все государства-члены могут перенять эту традицию и тактику."
 POTEF151: "Торговая империя"
 POTEF151_desc: "Европейская федерация станет Торговой империей."
 POTEF200: "Французская доктрина"
 POTEF200_desc: "§Y[FRA.GetNameWithFlag]§! традиционно делала ставку на высокомобильные лёгкие бронетанковые и моторизованные силы. С доктриной манёвренной войны все государства-члены могут перенять эту традицию и тактику."
 POTEF201: "Имперская власть"
 POTEF201_desc: "Европейская федерация стоит на традициях своих имперских предшественников."
 POTEF202: "Империя свободы"
 POTEF202_desc: "Европейская федерация станет Империей свободы."
 POTEF203: "Америка: союзник или противник"
 POTEF203_desc: "Америка и Европа были союзниками на протяжении большей части XX века. В связи с недавними политическими изменениями в §Y[USA.GetNameWithFlag]§! это стало подвергаться сомнению…"
 POTEF204: "Наследие НАТО"
 POTEF204_desc: "В традициях миротворческого наследия НАТО §Y[USA.GetNameWithFlag]§! и §YЕСО§! формируют новый союз."
 POTEF205: "Наследие Трампа"
 POTEF205_desc: "§Y[USA.GetNameWithFlag]§! превратились из союзника в противника. Европа должна отреагировать на эти решающие стратегические перемены."
 POTEF206: "Слом стены"
 POTEF206_desc: "Чтобы противостоять американской угрозе европейскому суверенитету, генеральный штаб §YЕСО§! разработал план заключить союз с §Y[MEX.GetNameWithFlag]§! и вторгнуться в §Y[USA.GetNameWithFlag]§! с юга."
 POTEF207: "Воскрешение Бастера"
 POTEF207_desc: "Чтобы противостоять американской угрозе Европе, генеральный штаб §YЕСО§! предложил вступить в союз с §Y[CAN.GetNameWithFlag]§! и пересмотреть схему обороны № 1, план, созданный канадским подполковником Джеймсом «Бастером» Сазерлендом Брауном, для канадского упреждающего нападения на США в случае неминуемого конфликта между США и Британской империей. С этим планом §YЕСО§! может начать вторжение с севера в §Y[USA.GetFlag] США§!."
 POTEF250: "Доктрина Бенилюкса"
 POTEF250_desc: "После холодной войны §Yстраны Бенилюкса§! сосредоточились на аэромобильных силах, чтобы приспособиться к новой обстановке. С аэромобильной доктриной все государства-члены могут перенять эту тактику."
 POTEF251: "Либеральное наследие"
 POTEF251_desc: "Европейская федерация чтит своё либеральное наследие."
 POTEF252: "Охрана старых торговых путей"
 POTEF252_desc: "Европейская федерация должна охранять старые торговые пути в Карибский бассейн, Африку и бывшую Голландскую Ост-Индию."
 POTEF253: "Индонезия"
 POTEF253_desc: "Европейская федерация должна улучшить свои отношения с бывшей голландской колонией §Y[IND.GetNameWithFlag]§! и построить новые стратегические форпосты в Юго-Восточной Азии."
 POTEF300: "Иберийская доктрина"
 POTEF300_desc: "§YИберийские страны§! традиционно делали ставку на сильную морскую пехоту. С доктриной морской пехоты все государства-члены могут перенять эту традицию и тактику."
 POTEF301: "Латинские кузены"
 POTEF301_desc: "Европейская федерация должна улучшить свои отношения с бывшими колониями в Южной Америке."
 POTEF302: "Мексика"
 POTEF302_desc: "Европейская федерация должна улучшить свои отношения с бывшей испанской колонией §Y[MEX.GetNameWithFlag]§! и построить новые стратегические форпосты в Центральной Америке."
 POTEF303: "Великая Колумбия"
 POTEF303_desc: "Европейская федерация должна улучшить свои отношения с бывшей испанской колонией §Y[COL.GetNameWithFlag]§! и построить новые стратегические форпосты в Южной Америке."
 POTEF304: "Центральная Америка"
 POTEF304_desc: "Европейская федерация должна улучшить свои отношения с бывшими испанскими колониями в §YЦентральной Америке§! и построить там новые стратегические форпосты."
 POTEF305: "Южный конус"
 POTEF305_desc: "Европейская федерация должна улучшить свои отношения с бывшими испанскими колониями в §YЮжном конусе Южной Америки§! и построить там новые стратегические форпосты."
 POTEF306: "Бразилия"
 POTEF306_desc: "Европейская федерация должна улучшить свои отношения с бывшей португальской колонией §Y[BRA.GetNameWithFlag]§! и построить новые стратегические форпосты в Южной Америке."
 POTEF350: "Британская доктрина"
 POTEF350_desc: "§YБритания§! традиционно делала ставку на сильный флот. С военно-морской доктриной все государства-члены могут перенять эту традицию и тактику."
 POTEF351: "Охрана Северной Атлантики"
 POTEF351_desc: "Для обеспечения свободы морей и свободной торговли Европейская федерация должна контролировать Северную Атлантику."
 POTEF352: "Наследие Содружества"
 POTEF352_desc: "Европейская федерация должна чтить своё наследие Содружества и улучшить свои отношения с бывшими британскими доминионами."
 POTEF353: "Канада"
 POTEF353_desc: "Европейская федерация должна чтить своё наследие Содружества и улучшить свои отношения с бывшим британским доминионом §Y[CAN.GetNameWithFlag]§! и построить там новые стратегические форпосты."
 POTEF354: "Австралия"
 POTEF354_desc: "Европейская федерация должна чтить своё наследие Содружества и улучшить свои отношения с бывшим британским доминионом §Y[AST.GetNameWithFlag]§! и построить там новые стратегические форпосты."
 POTEF355: "Новая Зеландия"
 POTEF355_desc: "Европейская федерация должна чтить своё наследие Содружества и улучшить свои отношения с бывшим британским доминионом §Y[NZL.GetNameWithFlag]§! и построить там новые стратегические форпосты."
 POTEF356: "Охрана Северного моря"
 POTEF356_desc: "Северное море — задний двор Европейской федерации, и его необходимо защищать."
 POTEF357: "Малайское наследие"
 POTEF357_desc: "Европейская федерация должна улучшить свои отношения с бывшими британскими колониями Малайи."
 POTEF358: "Малайзия"
 POTEF358_desc: "Европейская федерация должна улучшить свои отношения с бывшей британской колонией §Y[MAY.GetNameWithFlag]§! и строить новые стратегические форпосты в Юго-Восточной Азии."
 POTEF359: "Сингапур"
 POTEF359_desc: "Европейская федерация должна улучшить свои отношения с бывшей британской колонией §Y[SIN.GetNameWithFlag]§! и строить новые стратегические форпосты в Юго-Восточной Азии."
 POTEF360: "Гарантия Гонконга"
 POTEF360_desc: "Европейская федерация должна улучшить свои отношения с бывшей британской колонией §Y[HKG.GetNameWithFlag]§! и гарантировать права на свободу, закреплённые в Китайско-британской совместной декларации."
 POTEF400: "Нордическая доктрина"
 POTEF400_desc: "§YСкандинавские страны§! традиционно делали ставку на боевые действия в Арктике. С Нордической доктриной все государства-члены могут перенять эту традицию и тактику."
 POTEF401: "Охрана Арктики"
 POTEF401_desc: "Для обеспечения свободы морей и своего геостратегического положения Европейская федерация должна контролировать Арктику."
 POTEF450: "Средиземноморская доктрина"
 POTEF450_desc: "§YСредиземноморские страны§! традиционно делали ставку на тактику морского вторжения. С доктриной морского десанта все государства-члены могут перенять эту традицию и тактику."
 POTEF451: "Северная Африка"
 POTEF451_desc: "Для создания зоны конвергенции и безопасной гавани для беженцев Европейская федерация должна улучшить свои отношения с §YСеверной Африкой§! и построить там новые стратегические форпосты."
 POTEF452: "Объединение Кипра"
 POTEF452_desc: "Как суверенное государство-член Европейской федерации, §Y[CYP.GetNameWithFlag]§! должен быть воссоединён."
 POTEF500: "Балканская доктрина"
 POTEF500_desc: "§YБалканские страны§! традиционно делали ставку на партизанские силы. С партизанской доктриной все государства-члены могут перенять эту традицию и тактику."
 POTEF501: "Балканская инфраструктура"
 POTEF501_desc: "Европейская федерация должна развивать инфраструктуру Балкан для сохранения регионального мира и защиты региона от иностранного влияния."
 POTEF502: "Оспорить «Шёлковый путь»"
 POTEF502_desc: "Европейская федерация должна оспорить новый Шёлковый путь Китая и уменьшить китайское влияние в Центральной Азии."
 POTEF503: "Конкурент Китай"
 POTEF503_desc: "§Y[CHI.GetNameWithFlag]§! стал одним из главных конкурентов Европейской федерации на мировом уровне. Европейская федерация должна адаптировать свою политику к этому факту."
 POTEF504: "Операция «Стрела»"
 POTEF504_desc: "Названная в честь войны «Эрроу» (Второй англо-китайской войны), операция «Стрела» представляет собой план европейской интервенции в §Y[CHI.GetNameWithFlag]§!, чтобы остановить политику китайской экспансии."
 POTEF505: "Союзники в Азии"
 POTEF505_desc: "Чтобы противостоять §Y[CHI.GetNameWithFlag]§!, Европейской федерации нужны союзники в Азии."
 POTEF506: "Республика Корея"
 POTEF506_desc: "§Y[KOR.GetNameWithFlag]§! и Европейская федерация обе находятся под угрозой «китайского дракона». Чтобы справиться с этой угрозой, им следует заключить союз."
 POTEF507: "Япония"
 POTEF507_desc: "§Y[JAP.GetNameWithFlag]§! и Европейская федерация обе находятся под угрозой «китайского дракона». Чтобы справиться с этой угрозой, им следует заключить союз."
 POTEF550: "Черноморская доктрина"
 POTEF550_desc: "После окончания холодной войны §Yчерноморские страны§! сосредоточились на мобильных войсках ПВО, чтобы соответствовать новой обстановке. С доктриной ПВО все государства-члены могут перенять эту тактику."
 POTEF551: "Охрана Чёрного моря"
 POTEF551_desc: "Чёрное море связывает Европейскую федерацию с Кавказом и её юго-восточными государствами-членами. Поэтому его необходимо защищать."
 POTEF552: "Реинтеграция отколовшихся республик"
 POTEF552_desc: "§Y[SOV.GetNameWithFlag]§! нарушила суверенитет ряда восточных государств-членов Европейской федерации, поддерживая сепаратистские движения и создавая отколовшиеся республики. Нам нужно реинтегрировать этих российских марионеток."
 POTEF553: "Россия — соперник"
 POTEF553_desc: "§Y[SOV.GetNameWithFlag]§! стала главным соперником Европейской федерации. Мы должны ввести против неё санкции."
 POTEF554: "Операция «Карл Великий»"
 POTEF554_desc: "Операция «Карл Великий», названная в честь легендарного императора Карла Великого, так называемого «Отца Европы» (Pater Europae), представляет собой план упреждающей самообороны против §Y[SOV.GetNameWithFlag]§!. С помощью этой операции §YЕСО§! может начать упреждающее вторжение в §Y[SOV.GetNameWithFlag]§!, чтобы устранить эту угрозу европейскому суверенитету."
 POTEF600: "Кавказская доктрина"
 POTEF600_desc: "После холодной войны §Yстраны Кавказского региона§! сосредоточились на сильной обороне, чтобы соответствовать новой обстановке. С оборонной доктриной все государства-члены могут перенять эту тактику."
 POTEF601: "Европейский доступ"
 POTEF601_desc: "Европейской федерации нужен доступ к Кавказу и своим юго-восточным государствам-членам. Поэтому необходимо построить новые военно-морские базы и инфраструктуру."
 POTEF650: "Вышеградская доктрина"
 POTEF650_desc: "§YВышеградские страны§! традиционно делали ставку на сильную артиллерию. С артиллерийской доктриной все государства-члены могут перенять эту традицию и тактику."
 POTEF651: "Европейская сеть ПВО"
 POTEF651_desc: "Европейская федерация должна создать сеть противовоздушной обороны для обеспечения безопасности своего восточного фланга."
 POTEF652: "Восточный файрвол"
 POTEF652_desc: "Растущему влиянию §Y[SOV.GetNameWithFlag]§! в восточных государствах-членах необходимо противостоять."
 POTEF700: "Балтийская доктрина"
 POTEF700_desc: "§YБалтийские страны§! традиционно делали ставку на малочисленные, но высокоэффективные силы специального назначения. С доктриной спецназа все государства-члены могут перенять эту традицию и тактику."
 POTEF701: "Охрана Балтийского моря"
 POTEF701_desc: "Балтийское море — внутреннее море Европейской федерации, и его необходимо защищать."
 POTEF800: "Европейский мир"
 POTEF800_desc: "Европейская федерация должна стать глобальной сверхдержавой для обеспечения мира во всём мире."
 POTEF_pax_europaea: "Европейский мир"
 POTEF_pax_europaea_desc: "Европейская федерация стала глобальной сверхдержавой и поддерживает мир во всём мире."
 EDU_major_non_EU_ally: "Основной союзник ЕСО вне ЕС"
 EU_nato_legacy: "Наследие НАТО"
 EU_nato_legacy_desc: "Время НАТО прошло. Настало время для нового, европейского альянса. Тем не менее, мы будем поддерживать хорошие отношения с §Y[USA.GetNameWithFlag]§!, и они даже станут §Yосновным союзником ЕСО вне ЕС§!."
 EU_mountain_warfare: "Альпийская доктрина"
 EU_mountain_warfare_desc: "Альпийские государства §Y[AUS.GetNameWithFlag]§! и §Y[SWI.GetNameWithFlag]§! имеют давнюю традицию ведения горной войны. С Альпийской доктриной все государства-члены могут перенять эту традицию и тактику."
 EU_extensive_mountain_warfare: "Расширенная альпийская доктрина"
 EU_extensive_mountain_warfare_desc: "Альпийские государства §Y[AUS.GetNameWithFlag]§! и §Y[SWI.GetNameWithFlag]§! имеют давнюю традицию ведения горной войны. С расширенной альпийской доктриной все государства-члены могут перенять эту традицию и тактику."
 POTEF_armoured_warfare: "Доктрина бронетанковой войны"
 POTEF_armoured_warfare_desc: "§Y[GER.GetNameWithFlag]§! традиционно делала ставку на сильные бронетанковые войска. С бронетанковой доктриной все государства-члены могут перенять эту традицию и тактику."
 POTEF_leopard_doctrine: "Доктрина Leopard"
 POTEF_leopard_doctrine_desc: "§Y[GER.GetNameWithFlag]§! традиционно делала ставку на сильные бронетанковые войска. С доктриной Leopard все государства-члены могут перенять эту традицию и тактику."
 EU_french_doctrine: "Доктрина манёвренной войны"
 EU_french_doctrine_desc: "§Y[FRA.GetNameWithFlag]§! традиционно делала ставку на высокомобильные лёгкие бронетанковые и моторизованные силы. С доктриной манёвренной войны все государства-члены могут перенять эту традицию и тактику."
 EU_extensive_french_doctrine: "Доктрина гибкой силы"
 EU_extensive_french_doctrine_desc: "§Y[FRA.GetNameWithFlag]§! традиционно делала ставку на высокомобильные лёгкие бронетанковые и моторизованные силы. С доктриной гибкой силы все государства-члены могут перенять эту традицию и тактику."
 POTEF_air_mobile_doctrine: "Аэромобильная доктрина"
 POTEF_air_mobile_doctrine_desc: "После холодной войны §Yстраны Бенилюкса§! сосредоточились на аэромобильных силах, чтобы приспособиться к новой обстановке. С аэромобильной доктриной все государства-члены могут перенять эту тактику."
 POTEF_airborne_doctrine: "Доктрина ВДВ"
 POTEF_airborne_doctrine_desc: "После холодной войны §Yстраны Бенилюкса§! сосредоточились на аэромобильных силах, чтобы приспособиться к новой обстановке. С воздушно-десантной доктриной все государства-члены могут перенять эту тактику."
 EU_nordic_doctrine: "Нордическая доктрина"
 EU_nordic_doctrine_desc: "§YСкандинавские страны§! традиционно делали ставку на боевые действия в Арктике. С Нордической доктриной все государства-члены могут перенять эту традицию и тактику."
 EU_extensive_nordic_doctrine: "Расширенная нордическая доктрина"
 EU_extensive_nordic_doctrine_desc: "§YСкандинавские страны§! традиционно делали ставку на боевые действия в Арктике. С расширенной нордической доктриной все государства-члены могут перенять эту традицию и тактику."
 POTEF_empire_of_trade: "Торговая империя"
 POTEF_empire_of_trade_desc: "Европейская федерация является торговой империей"
 POTEF_empire_of_trade_2: "Глобальная торговая империя"
 POTEF_empire_of_trade_2_desc: "Европейская федерация является глобальной торговой империей"
 POTEF_liberal_legacy: "Либеральная традиция"
 POTEF_liberal_legacy_desc: "Европейская федерация чтит свою либеральную традицию."
 POTEF_liberal_legacy_2: "Либеральное наследие"
 POTEF_liberal_legacy_2_desc: "Европейская федерация чтит своё либеральное наследие."
 POTEF_empire_of_freedom: "Империя свободы"
 POTEF_empire_of_freedom_desc: "Европейская федерация — это империя свободы"
 POTEF_empire_of_freedom_2: "Глобальная империя свободы"
 POTEF_empire_of_freedom_2_desc: "Европейская федерация — это глобальная империя свободы"
 POTEF_marine_doctrine: "Доктрина морской пехоты"
 POTEF_marine_doctrine_desc: "§YИберийские страны§! традиционно делали ставку на сильную морскую пехоту. С доктриной морской пехоты все государства-члены могут перенять эту традицию и тактику."
 POTEF_extensive_marine_doctrine: "Расширенная доктрина морской пехоты"
 POTEF_extensive_marine_doctrine_desc: "§YИберийские страны§! традиционно делали ставку на сильную морскую пехоту. С расширенной доктриной морской пехоты все государства-члены могут перенять эту традицию и тактику."
 POTEF_partisan_doctrine: "Партизанская доктрина"
 POTEF_partisan_doctrine_desc: "§YБалканские страны§! традиционно делали ставку на партизанские силы. С партизанской доктриной все государства-члены могут перенять эту традицию и тактику."
 POTEF_counter_insurgency_doctrine: "Доктрина борьбы с повстанцами"
 POTEF_counter_insurgency_doctrine_desc: "§YБалканские страны§! традиционно делали ставку на партизанские силы. С доктриной борьбы с повстанцами все государства-члены могут перенять эту традицию и тактику."
 POTEF_anti_air_doctrine: "Доктрина ПВО"
 POTEF_anti_air_doctrine_desc: "После холодной войны §Yчерноморские страны§! сосредоточились на мобильных войсках ПВО, чтобы соответствовать новой обстановке. С доктриной ПВО все государства-члены могут перенять эту тактику."
 POTEF_extensive_anti_air_doctrine: "Доктрина мобильной ПВО"
 POTEF_extensive_anti_air_doctrine_desc: "После холодной войны §Yчерноморские страны§! сосредоточились на мобильных войсках ПВО, чтобы соответствовать новой обстановке. С доктриной мобильной ПВО все государства-члены могут перенять эту тактику."
 POTEF_artillery_doctrine: "Артиллерийская доктрина"
 POTEF_artillery_doctrine_desc: "§YВышеградские страны§! традиционно делали ставку на сильную артиллерию. С артиллерийской доктриной все государства-члены могут перенять эту традицию и тактику."
 POTEF_extensive_artillery_doctrine: "Расширенная артиллерийская доктрина"
 POTEF_extensive_artillery_doctrine_desc: "§YВышеградские страны§! традиционно делали ставку на сильную артиллерию. С расширенной артиллерийской доктриной все государства-члены могут перенять эту традицию и тактику."
 POTEF_defense_doctrine: "Оборонная доктрина"
 POTEF_defense_doctrine_desc: "После холодной войны §Yстраны Кавказского региона§! сосредоточились на сильной обороне, чтобы соответствовать новой обстановке. С оборонной доктриной все государства-члены могут перенять эту тактику."
 POTEF_extensive_defense_doctrine: "Расширенная оборонная доктрина"
 POTEF_extensive_defense_doctrine_desc: "После холодной войны §Yстраны Кавказского региона§! сосредоточились на сильной обороне, чтобы соответствовать новой обстановке. С расширенной оборонной доктриной все государства-члены могут перенять эту тактику."
 POTEF_special_forces_doctrine: "Доктрина спецназа"
 POTEF_special_forces_doctrine_desc: "§YБалтийские страны§! традиционно делали ставку на малочисленные, но высокоэффективные силы специального назначения. С доктриной спецназа все государства-члены могут перенять эту традицию и тактику."
 POTEF_extensive_special_forces_doctrine: "Расширенная доктрина спецназа"
 POTEF_extensive_special_forces_doctrine_desc: "§YБалтийские страны§! традиционно делали ставку на малочисленные, но высокоэффективные силы специального назначения. С расширенной доктриной спецназа все государства-члены могут перенять эту традицию и тактику."
 EU_POTEF_environmental_imperialism_decision: "Требование экологических реформ"
 EU_POTEF_environmental_imperialism_decision_desc: "Мы должны спасти планету. Если §Y[FROM.GetNameWithFlag]§! не проведёт необходимые §GЭкологические реформы§! самостоятельно, мы должны заставить их сделать это. Они должны иметь по меньшей мере один §YБиотопливный завод§! на каждый регион, которым они владеют. Если §Y[FROM.GetNameWithFlag]§! не выполнит наши требования в течение месяца, мы наложим на них §Rэкологические санкции§!."
 EU_POTEF_environmental_imperialism_mission: "Экологические реформы"
 EU_POTEF_environmental_imperialism_mission_desc: "§YЕвропа§! требует от нас §GЭкологических реформ§! для спасения планеты. Если в течение месяца мы не построим или не реконструируем хотя бы один §YБиотопливный завод§! для каждого региона, которым мы владеем, они наложат на нас §Rэкологические санкции§!."
 EU_POTEF_environmental_imperialism_restructure_industry_decision: "Переход на зелёную энергетику"
 EU_POTEF_environmental_imperialism_restructure_industry_decision_desc: "Для выполнения требований европейской §GЭкологической реформы§! нам необходимо перестроить часть нашей §YГражданской промышленности§! в производство возобновляемой энергии (§YБиотопливный завод§!)."
 EU_POTEF_break_environmental_sanctions_decision: "Прорвать экологические санкции"
 EU_POTEF_break_environmental_sanctions_decision_desc: "Европа наложила на нас экологические санкции. Мы должны прорвать их всеми средствами — политическими и военными. Но это даст [FROM.GetNameWithFlag] цель войны против нас. Поэтому нам нужно заключить союз с другими странами, против которых [FROM.GetNameWithFlag] ввела санкции."
 EU_POTEF_call_all_major_non_EU_ally: "Призвать всех союзников ЕСО вне ЕС"
 EU_POTEF_call_all_major_non_EU_ally_desc: "На ЕСО напали. Пора задействовать оборонительный альянс и призвать всех союзников ЕСО, не входящих в ЕС."
 EU_POTEF_call_major_non_EU_ally: "Призыв [FROM.GetName] в ЕСО"
 EU_POTEF_call_major_non_EU_ally_desc: "Призвать основного союзника ЕСО вне ЕС — §Y[FROM.GetNameWithFlag]§!."
 focus_POTEF301_effect_tt: "Каждый член Европейского союза §Gулучшит мнение на +25§! со всеми латиноамериканскими странами.\n"
 focus_POTEF502_effect_tt: "Каждый член Европейского союза §Gулучшит мнение на +30§! со следующими странами: [KAZ.GetNameWithFlag], [KYR.GetNameWithFlag], [TAJ.GetNameWithFlag], [UZB.GetNameWithFlag], [TRK.GetNameWithFlag], [PER.GetNameWithFlag], [TUR.GetNameWithFlag], [GRE.GetNameWithFlag].\nТакже [CHI.GetFlag][CHI.GetAdjective] влияние в этих странах будет §Gуменьшено§!.\n"
