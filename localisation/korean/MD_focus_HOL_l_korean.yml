 HOL_empowering_local_governments_idea: "분권형 통치"
 HOL_empowering_local_governments_idea_desc: "권력이 지역 정부에 위임되어 지역 자치와 행정 효율성이 개선되었습니다. 분권화 노력은 안정을 강화하고 더욱 효율적인 경제 구조를 육성했습니다."
 HOL_centralized_governance_idea: "중앙집권적 통치"
 HOL_centralized_governance_idea_desc: "왕실이 권한을 중앙집권화하여 통일되었지만 경직된 통치 체계를 만들었습니다. 관료 비용은 증가했지만 군주제의 통제를 강화하기 위해 정치 권력이 공고해졌습니다."
 HOL_restore_nobility_influence_idea: "복원된 귀족 영향력"
 HOL_restore_nobility_influence_idea_desc: "귀족은 왕실 통치의 초석으로서의 역할을 되찾았습니다. 그들의 영향력은 군주제의 권위를 강화하고, 정치적 충성을 함양하며, 문화적 단결 의식을 증진합니다."
 HOL_nobility_backed_military_idea: "귀족이 이끄는 군대"
 HOL_nobility_backed_military_idea_desc: "귀족이 군대의 지휘직을 맡아 왕실에 대한 충성을 보장하고 있습니다. 군의 효율성이 개선되었으며 군대를 통해 군주제의 권위가 확보되었습니다."
 HOL_nato_commitments_idea: "NATO에 대한 공약"
 HOL_nato_commitments_idea_desc: "세계적 긴장이 고조되는 가운데 NATO는 여전히 네덜란드 안보의 토대입니다. 동맹에 대한 우리의 공약을 재확인함으로써 우리는 동맹국들로부터 방위 협력과 기술적 이점을 확보할 수 있습니다."
