 SAU_events.319.b: "PGM: Defence Suppression"
 SAU_events.319.c: "PGM: Battlefield Interdiction"
 SAU_events.319.desc: "How will the Kingdom wield its smart weapons? Each path is a lasting trade-off - it makes us stronger one way and weaker another.\n\n§YHover an option to see exactly what it grants and costs.§!"
 SAU_events.319.t: "Precision Strike Doctrine Course"
 SAU_events.32.a: "Take their money."
 SAU_events.32.b: "Never. Let them choke on Hormuz."
 SAU_events.32.d: "Our old rivals in Riyadh wish to run their oil through our territory to the sea. They will pay handsomely in transit fees. Pride is one thing, but the treasury is empty."
 SAU_events.32.t: "A Saudi Proposal"
 SAU_events.320.a: "Reform: Crash Programme"
 SAU_events.320.b: "Reform: Methodical Build-Up"
 SAU_events.320.c: "Reform: Foreign Contractors"
 SAU_events.320.desc: "The reform begins. How hard shall we push? Each path is a lasting trade-off - it makes us stronger one way and weaker another.\n\n§YHover an option to see exactly what it grants and costs.§!"
 SAU_events.320.t: "Stage I: Launch the Reform Programme"
 SAU_events.321.a: "Combat Arms: Armored Fist"
 SAU_events.321.b: "Combat Arms: Firepower"
 SAU_events.321.c: "Combat Arms: Professional Infantry"
 SAU_events.321.desc: "Which combat arm leads the modern force? Each path is a lasting trade-off - it makes us stronger one way and weaker another.\n\n§YHover an option to see exactly what it grants and costs.§!"
