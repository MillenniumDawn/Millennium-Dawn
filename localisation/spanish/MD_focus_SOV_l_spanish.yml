 SOV_army_category: "Ejército Ruso"
 SOV_army_category_desc: "El ejército ruso es solo una pálida sombra de su antiguo ser soviético, que en su día fue vasto y formidable. Rusia se enfrenta ahora a la tarea de revivir el poder militar de un Estado que siempre ha participado en la política mundial y ha influido directamente en ella."
