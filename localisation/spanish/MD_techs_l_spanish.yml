 UKR_module_light_surface_diesel_power_1: "M-507 x2, 10 000 hp"
 UKR_module_light_surface_diesel_power_2: "M-7N x1, 46 000 hp"
 UKR_module_light_surface_jet_turbine_power: "M-3 x1, 36 000 hp"
 UKR_module_light_surface_jet_turbine_power2: "M-15 x1, 32 000 hp"
 UKR_module_light_surface_jet_turbine_power3: "M-80 x1, 34 000 hp"
 UKR_module_ram_1: "Arbalet-K"
 UKR_module_ram_1_desc: "§7Arbalet-K§! es un sistema naval de misiles superficie-aire de corto alcance desarrollado y fabricado por la Oficina de Diseño ucraniana Luch. Está diseñado para entablar combate contra helicópteros y aviones de pistón, turbohélice y reacción en rumbos de persecución y de frente bajo condiciones de visibilidad visual del objetivo, utilizando misiles superficie-aire guiados de tipo §7'Igla'§!."
 UKR_module_anti_submarine_mortar: "RBU-6000 Smerch-2"
 UKR_module_anti_submarine_mortar_desc: "El RBU-6000 Smerch-2 es un lanzador de cohetes antisubmarinos soviético de calibre 213 mm que cuenta con doce tubos lanzadores en un solo sistema. El sistema entró en servicio entre 1960 y 1961 y está instalado en una amplia variedad de buques de superficie de fabricación soviética."
 railway_system_01: "Sistema de transporte integrado"
 railway_system_01_desc: "Con la llegada de una nueva ola tecnológica, los sistemas ferroviarios necesitan integrarse con el resto de nuestra infraestructura. Solo así se puede garantizar que nuestra logística permanezca intacta."
 railway_system_02: "Ferrocarriles post-convencionales"
 railway_system_02_desc: "La tecnología de la información del nuevo milenio permite que los desarrollos de la logística y la infraestructura dejen atrás los días del pasado y funcionen de manera mucho más fluida."
 railway_system_04: "Línea de alta velocidad temprana"
 railway_system_04_desc: "Las líneas de alta velocidad son el siguiente paso lógico en las mejoras logísticas. El uso de rutas exhaustivamente planificadas y equipos de construcción modernos puede producir vías prioritarias, lo que permite a los trenes cubrir distancias más largas con mayor rapidez."
 railway_system_05: "Línea de alta velocidad"
 railway_system_05_desc: "Aunque no representa un avance tecnológico decisivo, el mayor uso y la expansión de las redes ferroviarias de alta velocidad existentes permitirán pulir algunos problemas adicionales y darán a los diseñadores ferroviarios más experiencia al planificar estos sistemas."
 railway_system_06: "Línea de alta velocidad moderna"
 railway_system_06_desc: "Los materiales modernos, la tecnología, las comunicaciones y los esfuerzos masivos de planificación llevarán la red de alta velocidad actual a un nuevo nivel. Abrir estos extensos sistemas a los viajes públicos también elevará la calidad de vida y permitirá que la población sea mucho más móvil. Por supuesto, esto también se aplica a las fuerzas armadas."
 railway_system_08: "Línea Maglev temprana"
 railway_system_08_desc: "Un tren Maglev (levitación magnética) no se desplaza por su propia fuerza motriz como los trenes convencionales, sino que se apoya en principios electromagnéticos para moverse. Los electroimanes alimentados pueden repeler o atraer a un tren por encima de un único riel magnético. La orientación de estos imanes puede modificarse para poner en movimiento los vagones. Esto ahorrará mucho espacio y se puede mantener fácilmente."
 railway_system_09: "Línea Maglev estandarizada"
 railway_system_09_desc: "Standardized Maglev Rail projects have proven that a successful and standardized Maglev rail can be deployed across the country with great success. Now, these systems will be integrated and most importantly, standardized. Nothing stands in the way of a continued and extreme expansion of both short and long-distance maglev rail."
 railway_system_11: "Línea Maglev mejorada"
 railway_system_11_desc: "Advancements in maglev safety have allowed for the replacement of long-distance rail with maglev."
 railway_system_12: "Línea Maglev de alta velocidad"
 railway_system_12_desc: "Ahora es posible introducir líneas maglev de alta velocidad en todas las naciones."
 railway_system_13: "Línea Maglev subsónica"
 railway_system_13_desc: "Las distancias a lo largo de una nación se han convertido en un inconveniente menor en el trayecto diario gracias a unas velocidades casi sónicas."
 railway_system_15: "Línea Maglev supersónica"
 railway_system_15_desc: "La evolución de la tecnología maglev nos ha permitido viajar al otro lado del planeta en menos de dos horas."
 arty_upgrade_1: "Impacto simultáneo de múltiples proyectiles"
 arty_upgrade_1_desc: "El proceso de modificar el ángulo de lanzamiento y la velocidad para cada ojiva, logrando de ese modo que todos los proyectiles batan un objetivo de manera simultánea (MRSI)."
 arty_upgrade_2: "Sistema de control de tiro"
 arty_upgrade_2_desc: "Diseñado para asistir a un sistema de armas a distancia en las tareas de localización, rastreo e impacto contra su objetivo."
 arty_upgrade_3: "Cargas propelentes variables"
 arty_upgrade_3_desc: "La cantidad de propelente que se disparará con la munición de artillería varía según los incrementos de pólvora, seleccionados en función de la distancia al objetivo y la situación táctica."
 arty_upgrade_4: "Impacto simultáneo de múltiples proyectiles II"
 arty_upgrade_4_desc: "Un proceso mejorado con componentes de gama más alta que permite el combate simultáneo contra los objetivos enemigos."
 arty_upgrade_5: "Propelentes líquidos de carga masiva"
 arty_upgrade_5_desc: "Una tecnología avanzada que permite un diseño de cañón sencillo y una gama más amplia de opciones tácticas y logísticas."
 nsb_arty_upgrade_1: "Cargas propelentes variables"
