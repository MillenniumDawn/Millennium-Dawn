 ukraine_crimea_balance.831.name: "The Status of §Y[669.GetName]§!"
 ukraine_crimea_balance.831.desc: "§W[SOV.GetFlag] §Y[SOV.GetNameDef]§! proposes renewed consultations over §Y[669.GetName]§!. The terms of our existing political settlement remain valid, and the status of §Y[1112.GetName]§! cannot change without a new agreement. A refusal may lead to §Rnew Russian pressure§!.§!"
 ukraine_crimea_balance.831.a: "§GBegin Consultations§! with [SOV.GetFlag] §Y[SOV.GetNameDef]§!"
 ukraine_crimea_balance.831.b: "§RReject New Russian Demands§!"
 ukraine_crimea_balance.832.name: "The Future of the §Y[CRM.GetFlag] [CRM.GetName]§! Autonomy"
 ukraine_crimea_balance.832.desc: "§WThe §Y[CRM.GetFlag] [CRM.GetName]§! already exists as a subject of [SOV.GetFlag] §Y[SOV.GetNameDef]§!. Rather than creating another puppet, we must decide whether to confirm its current autonomy or begin a gradual review of its institutions.§!"
 ukraine_crimea_balance.832.a: "§GGuarantee Existing Autonomy§!"
 ukraine_crimea_balance.832.b: "§YBegin a Gradual Status Review§!"
 SOV_crimea_prepare_pressure: "§YPrepare a Political Campaign in [669.GetName]§!"
 SOV_crimea_prepare_pressure_desc: "§WFund local organisations, information operations and political contacts in §Y[669.GetName]§! over §Y180 days§!. This costs §R$400 million§! and §R70 Political Power§!, and can unlock diplomatic or military options against [UKR.GetFlag] §Y[UKR.GetNameDef]§! if Russian influence remains high enough. It does not automatically transfer territory.§!"
 SOV_crimea_preparation_mission: "Political Preparations in §Y[669.GetName]§!"
 SOV_crimea_preparation_mission_desc: "§WOur political preparations are underway. When completed, this mission can unlock stricter Russian requirements for the Crimean status talks. If the ordinary balance is still unresolved, §G4 influence points§! are shifted from Ukraine to Russia, subject to the regular cap.§!"
 CRM_mejlis_political_campaign: "Challenge §YMejlis§! Influence"
 CRM_mejlis_political_campaign_desc: "§WA longer political campaign against the §YMejlis§! is required when Crimean Tatar influence is above §Y20%§!. Costs §R$100 million§! and §R35 Political Power§!. Starts a §Y120-day§! mission rather than granting an immediate effect.§!"
 CRM_mejlis_pressure_mission: "Political Campaign against the §YMejlis§!"
 CRM_mejlis_pressure_mission_desc: "§WAfter §Y120 days§!, up to §G4 influence points§! are transferred from the Crimean Tatar bloc to the pro-Russian bloc. Does not affect a fully settled political arrangement.§!"
 SOV_crimea_escalation_after_rejection: "Escalate the §Y[669.GetName]§! Dispute"
 SOV_crimea_escalation_after_rejection_desc: "§WFollowing §Rrejected consultations§!, [SOV.GetFlag] §Y[SOV.GetNameDef]§! can seek a formal war goal only after completing preparations and retaining at least §Y45%§! Russian influence while Crimean Tatar influence does not exceed §Y35%§!. Cost: §R100 Political Power§!. This does §Rnot§! immediately declare war.§!"
