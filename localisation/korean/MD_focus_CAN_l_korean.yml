 CAN_canadian_subsidies_projects: "캐나다 경제 보조금"
 CAN_canadian_subsidies_projects_desc: "The Canadian government has historically subsidized many of its key industries. Oil, farming, logging, maritime, aerospace and so many more. Maintaining this legacy of subsidization will help maintain our bustling economy. Government subsidies will be paid out every two weeks.\n\nTotal Weekly Cost of Government Subsidies: §Y$$[?CAN.CAN_subsidy_total]§!\n\n§gWeekly cost is found in the§! §YAdditional Expenses§! §gsection of the budget§!\n"
 CAN_subsidize_military_industry: "군수산업 보조금 지급"
 CAN_subsidize_military_industry_desc: "군수 산업에 보조금을 지급하면 우리 군수 산업 역량을 확대할 수 있습니다."
 CAN_reduce_military_subsidies: "군수 산업 보조금 낮추기"
 CAN_reduce_military_subsidies_desc: "군사 보조금을 줄이면 과중한 우리 예산 부담을 덜 수 있습니다."
 CAN_construction_subsidies: "하청업자 보조금 지급"
 CAN_construction_subsidies_desc: "지역 건설업체에 대한 감세와 기타 혜택을 확대하면 우리 건설 회사들이 성장하고 확장하여 생산 능력이 높아질 것입니다."
 CAN_reduce_construction_subsidies: "하청업자 보조금 낮추기"
 CAN_reduce_construction_subsidies_desc: "건설업체 보조금을 줄이는 것은 널리 인기가 없겠지만, 경제의 부담을 덜기 위해 필요합니다."
 CAN_infrastructure_subsidies: "기반 시설 보조금 지급"
 CAN_infrastructure_subsidies_desc: "기반시설 보조금은 큰 도움이 될 것입니다."
 CAN_reduce_infrastructure_subsidies: "기반 시설 보조금 낮추기"
 CAN_reduce_infrastructure_subsidies_desc: "보조금을 줄이면 우리의 경제 문제를 완화하는 데 도움이 될 것입니다."
 CAN_french_happiness: "프랑스계 캐나다인의 행복도"
 CAN_french_happiness_desc: "French Canadians, commonly referred to in Quebec as \"Québécois\", are the ethnic group of Canada who trace their lineage back to French colonists from the 17th century onwards. French Canadians account for around twenty-two percent of the Canadian total population. Québécois nationalism has died down slowly since the 1960s; however, it still remains a firm occurrence in Quebec, with many still referring to themselves as Québécois rather than Canadian.\n\n§G60%§! or higher for Good French Happiness\n§Y50%§!-§Y60%§! for Neutral French Happiness\n§R49%§! or lower for Bad French Happiness\n\n§gFrench Canadian Happiness:§! \n[CAN_color_of_variable]\n\n§gCurrent Effects:§! \n[CANGetFrenchHappinessEffects]"
 CAN_analyse_french_happiness: "프랑스계 캐나다인의 행복도 분석"
