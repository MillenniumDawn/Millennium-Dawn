 ### MIO
 FRA_nexter_manufacturer: "GIAT Industries"
 FRA_nexter_merge: "Nexter has been merged with KMW in 2015"
 FRA_nexter_cold_war_legacy: "Cold War Legacy"
 FRA_nexter_scorpion_programme: "Scorpion Programme"
 FRA_nexter_firepower_ammo: "Firepower & Ammunition"
 FRA_nexter_manufacturer_trait: "CAESAR Firepower Doctrine"
 FRA_nexter_manufacturer_trait_desc: "From the Bourges arsenal forges to the truck-mounted CAESAR howitzer, Nexter has built its reputation on rapid, precise firepower delivered by lightweight tracked and wheeled platforms."
 FRA_nexter_leclerc_programme: "Leclerc Programme"
 FRA_nexter_leclerc_programme_desc: "The Leclerc is Nexter's flagship main battle tank, developed from the late 1970s and entering service in 1992. Its autoloader and modular armour set the benchmark for French armoured doctrine."
 FRA_nexter_leclerc_mk2: "Leclerc Series 2"
 FRA_nexter_leclerc_mk2_desc: "The Series 2 overhaul introduced hybrid air conditioning, upgraded electronics, and improved composite armour packages, extending the platform's service life into the 2020s."
 FRA_nexter_leclerc_xlr: "Leclerc XLR Modernisation"
 FRA_nexter_leclerc_xlr_desc: "The XLR mid-life upgrade rebuilt the Leclerc around a remote weapons station, modular armour kits, and SCORPION battle-management integration, keeping it competitive against newer MBT designs."
 FRA_nexter_vbci: "VBCI Wheeled IFV"
 FRA_nexter_vbci_desc: "The Véhicule Blindé de Combat d'Infanterie gave the French Army its first modern wheeled IFV. Production began in 2008 and the platform became the backbone of armoured mobility for motorised regiments."
 FRA_nexter_famas: "FAMAS Service Rifle"
 FRA_nexter_famas_desc: "The bullpup FAMAS assault rifle served as the standard French infantry weapon from 1981 onward. Nexter's small-arms line grew out of its production and ongoing support contracts."
 FRA_nexter_scorpion_core: "Scorpion Integrated Combat"
 FRA_nexter_scorpion_core_desc: "The Scorpion programme, formalised in 2014, networked the French Army's new wheeled combat family under a common battle-management system and digital backbone."
 FRA_nexter_griffon: "VBMR Griffon"
 FRA_nexter_griffon_desc: "The Griffon is the Scorpion family's six-wheel multi-role tactical carrier, supplanting the VAB as the standard French armoured personnel vehicle."
 FRA_nexter_jaguar: "EBRC Jaguar"
 FRA_nexter_jaguar_desc: "The Jaguar six-wheel reconnaissance and combat vehicle mounts a 40mm CTA cannon and Akeron MP missiles, inheriting firepower concepts proven on the Leclerc."
 FRA_nexter_serval: "VBMR-L Serval"
 FRA_nexter_serval_desc: "The lightweight four-wheel Serval extends Scorpion mobility to special-forces, patrol, and command variants with a compact aluminium hull."
 FRA_nexter_40cta: "40 CTA Cannon"
 FRA_nexter_40cta_desc: "Developed jointly with BAE Systems through CTA International, the 40mm cased-telescoped cannon delivers compact, high-velocity anti-armour firepower across the Scorpion fleet."
 FRA_nexter_caesar: "CAESAR 155mm Platform"
 FRA_nexter_caesar_desc: "The CAESAR truck-mounted 155mm howitzer combines strategic mobility with long-range precision fire, becoming Nexter's most successful export artillery platform."
 FRA_nexter_eurenco: "EURENCO Propellants"
 FRA_nexter_eurenco_desc: "EURENCO supplies the propellants, explosives, and energetic materials underpinning French artillery and small-arms ammunition, tying Nexter's output to a secure upstream supply chain."
 FRA_nexter_nbc_sys: "NBC-Sys CBRN Kit"
 FRA_nexter_nbc_sys_desc: "The NBC-Sys subsidiary specialises in chemical, biological, radiological, and nuclear detection and decontamination equipment for French and export forces."
 FRA_nexter_lu_family: "LU Family Rounds"
 FRA_nexter_lu_family_desc: "The LU211 and LU family of 155mm rounds extend artillery range through base-bleed and improved aerodynamics, standardising long-range fires across NATO compatible tubes."
 FRA_nexter_bonus: "BONUS Smart Munition"
 FRA_nexter_bonus_desc: "The BONUS sensor-fuzed 155mm round dispenses self-targeting submunitions against armoured columns, giving artillery units a precision anti-armour capability from standard howitzers."
 FRA_renault_manufacturer: "Renault Trucks Defense"
