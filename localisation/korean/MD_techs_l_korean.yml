 nsb_arty_upgrade_3: "다탄 동시 탄착"
 nsb_arty_upgrade_3_desc: "각 탄두의 발사각과 속도를 조정하여 모든 포탄이 표적에 동시에 명중하도록 하는 방식입니다"
 nsb_arty_upgrade_4: "다탄 동시 탄착 II"
 nsb_arty_upgrade_4_desc: "고급 부품을 사용한 개량 방식으로, 적 표적에 대한 동시 교전을 가능하게 합니다"
 nsb_arty_upgrade_5: "대량 적재식 액체 추진제"
 nsb_arty_upgrade_5_desc: "대량 적재식 액체 추진제는 고정식 장약을 조절 가능한 추진제 주입 방식으로 대체하여, 포병 체계가 포구 에너지를 조절하고 사거리 통제를 개선하며 포 기구 설계를 단순화할 수 있게 합니다."
 nsb_arty_upgrade_6: "대량 적재식 액체 추진제 II"
 nsb_arty_upgrade_6_desc: "개량된 액체 추진제 체계는 더 정밀한 장약 통제, 더 안전한 취급, 자동 장전 및 사격 통제 체계와의 더 나은 통합을 제공하여 포병의 유연성과 지속 사격 성능을 높입니다."
 nsb_artillery_1: "야포 1965"
 nsb_artillery_1_desc: "강력한 간접 사격 능력을 갖춘 야포는 전장에서 필요한 곳에, 시야를 훨씬 넘어선 거리까지 지속적인 정밀 타격을 제공합니다. 승무원이 직접 재장전할 수 있습니다. 이동에 외부 차량이 필요하므로 사격 사이에 위치를 옮기기 어려우며, 이 때문에 적 포병의 대포병 사격에 취약합니다. 경량 소구경 체계는 인력으로 끌고 다닐 수 있으며 수송기 안에 실을 수 있어 공수 작전에 적합합니다."
 util_weapons: "주포"
 util_weapons_desc: "적 장갑의 강도를 따라가며 관통할 수 있는 포를 갖추는 것이 중요합니다."
 util_infantry_help_upgrade: "보병 지원"
 util_infantry_help_upgrade_desc: "보병과의 통신을 개선하고 직접 지원을 제공할 수단을 늘립니다."
 util_mobility: "엔진"
 util_mobility_desc: "기동성이 높아지면 전술적, 전략적 이점을 얻을 수 있으며, 속도가 크게 떨어지지 않으면서 더 많은 장갑을 장착할 수 있습니다."
 util_cutting_corners_upgrade: "원가 절감"
 util_cutting_corners_upgrade_desc: "줄일 수 있는 부분은 언제나 있지만, 줄인 뒤에도 제 성능을 기대해서는 안 됩니다."
