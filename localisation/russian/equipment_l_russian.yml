 CV_MR_Fighter1: "МЦ ПАЛ 3-го поколения"
 CV_MR_Fighter1_desc: "Палубные истребители обычно являются вариантами многоцелевых истребителей из-за огромного разнообразия задач, с которыми они должны справляться. Ограничения по размеру палубы авианосца и пространству ангара накладывают жёсткие ограничения на полезную нагрузку, которую они могут нести."
