 auslink_in_nt: "AusLink in the Northern Territory"
 auslink_in_nt_desc: "The AusLink framework has allowed swift repair and upgrades of our regional roads in the past. We can reuse that system to rapidly enhance the logistic lines in our northern communities, building bridges, heavy freight routes and agricultural infrastructure."
 national_partnership_agreement_ast: "National Partnership Agreement"
 national_partnership_agreement_ast_desc: "Working closely with the Indigenous communities in NT and Western Australia, we can address severe overcrowding by constructing hundreds of new homes to accomodate the locals. The contracts will also drum up some support for us with the housing interest groups, and provide work for local contractors."
 foundation_for_regional_renewal_ast: "Rural Renewal Grants"
 foundation_for_regional_renewal_ast_desc: "We can establish a joint partnership between the federal government and the Sydney Myer Fund to create a vehicle for local agricultural funding. Grants will be directed to small town businesses and councils to finance community halls, rural water systems and farming projects."
 grain_line_upgrades_ast: "Grain Line Upgrades"
 grain_line_upgrades_ast_desc: "Blueprints have come our way from the NSW and Victorian governments for major structural upgrades to the region's grain lines. Almost all regional farmers use the lines to transport harvests to ports, and upgrading the lines could massively improve their output and lower the reliance on vehicle transport. In turn lowering the wear and tear on roads."
 grain_lines_upgraded_ast: "Regional Grain Line Upgraded"
 mining_indutrialists_opinion_tt: "Minimum §YFossil Fuel Industry§! opinion §R-20§!"
 peter_costello_desc: "在澳大利亚政治史上，或许很少有人像彼得·科斯特洛那样精通经济管理。在加入自由党之前，科斯特洛曾辗转于律师和法律顾问的工作，他主张对经济进行彻底的重组。最终，他加入了自由党的经济改革派，并在那里结识了前反对党领袖约翰·霍华德。\n\n1996年大选后，科斯特洛作为霍华德政府的副领导人和财政部长，主导了政府的快速改革。结果，十多年来首次实现了预算盈余，他们共同成功通过了此前被认为“不可能”的税收制度改革。\n\n即便两人关系日渐恶化，科斯特洛也从未远离权力中心。如今，他掌控着国家最重要的权力，他梦寐以求的经济霸主地位距离现实仅一步之遥。"
 western_mining_corp_research_ast: "Western Mining Corp Research"
 ast_an_open_ear_tt: "The §Rclimate§! situation in our nation may §Rworsen.§!"
 literacy_progress_the_gap_ast: "Closing the Gap Progress"
 literacy_progress_the_gap_ast_1: "Continuing the Gap"
 closing_the_gap_event.2.t: "Closing the Gap Results"
 closing_the_gap_event.2.d: "With our literacy and social support campaign given a few years to track, the results have come back unfortunately mixed. While more children are being enrolled and less adults are being incarcerated overall, out-of-home care rates, and youth crime are steadily increasing. As a result it seems our effort to bring disadvantaged Australians towards the mainstream is partially being deemed a failure. \n\nWe can invest more in the program to continue the work and perhaps refine it, or we could cut our losses now and pull the plug."
 closing_the_gap_event.2.a: "Continue the work."
 closing_the_gap_event.2.b: "Shut it down."
 closing_the_gap_event.3.d: "With our literacy and social support campaign given a few years to track, the results have come back positive. More children are being enrolled, less adults are being incarcerated overall, out-of-home stay rates and youth crime are steadily decreasing. It seems our effort to bring disadvantaged Australians towards the mainstream is actually paying off."
 closing_the_gap_event.3.a: "Another success."
 preserving_the_old_models_ast: "Domestic Heritage Preservation"
 costellogov_focus: "科斯特洛政府"
 bob_brown_event_tt: "The §GGreens§! will support our legislation."
 syrian_refugees_idea_ast: "Syrian Refugees Welcome"
 syrian_civil_war_refugees_ast: "Handle the Syrian Refugees"
 syrian_refugees_event_ast.1.t: "The Syrian Refugees"
 syrian_refugees_event_ast.1.d: "With the outbreak of conflict in Syria, thousands of refugees are seeking asylum in our nation. They’ve gone through the proper channels, and the circumstances they’re fleeing from would certainly qualify them for entry, but the choice is ultimately ours. Letting them in could encourage more to go through the right processes, or it could open the floodgates for another migration crisis."
 syrian_refugees_event_ast.1.a: "Let them in."
 syrian_refugees_event_ast.1.b: "It's not our problem."
 malaysianflight_event_ast.1.t: "The Disappearance of MH370"
 malaysianflight_event_ast.1.d: "An international passenger plane, operated by Malaysian Airlines, dropped from radars yesterday while flying over the South China Sea in a disappearance that has left families shattered, and the airline company dumbfounded. \n\nThe flight, which was originally intended to land in Beijing, mysteriously vanished from sensors three days ago en route from the Malaysian Capital. While authorities continue to search for any wreckage, relatives of the missing passengers have been told to prepare for the worst. 40 ships and 34 aircraft from nine different nations are taking part in the search, although Malaysian officials have claimed they still have no idea what went wrong."
 malaysianflight_event_ast.1.a: "Where did it go?"
 AST_keep_them_aligned: "Keep Them Aligned"
 AST_keep_them_aligned_desc: "The National Party have been trying to cause a stir over our agricultural policy, or lack thereof. While these tactics of coercion might've worked with previous administrations, it won't define how we run this cabinet. We'll release our own grants for the farmers, on our terms, and proclaim it to the media as our victory. \n\nIt shows if they want to play ball with us, it has to be on our terms."
 AST_privatise_the_care: "Privatise the Care"
 AST_privatise_the_care_desc: "The experiment of public healthcare in Australia has seen costs increase beyond acceptable or even manageable levels, with hardly any improvement to the care. By privatising parts of the program, we’re welcoming the prospect of expanded choice and increased efficiency for those seeking care. It’s a proven model, and we’re open to adopting it."
 papua_affair.2.t: "Australian Rubber Proposal"
 papua_affair.2.d: "The government in Canberra has proposed a state-sponsorship for a number of our rubber plantations around Port Moresby. According to them the deal aims to strengthen and ensure steady trade between us, and in particular it nullifies a few of our tariffs. The local smallholders support the request on the merits of increased exports, but the proposal might make us more reliant on them in the future."
 papua_affair.2.a: "It's good business."
 papua_affair.2.b: "No deal."
 papua_affair.3.t: "Rubber Secured"
 papua_affair.3.d: "Fortunately the Prime Minister agreed to attempt the talks a second time and has supported our proposal. Farmers around Port Moresby will enjoy increased demand and some generous subsidies, while we receive a steady stream of rubber for our growing industries. The whole region should benefit from this arrangement."
 papua_affair.3.a: "Another Successful Deal."
 papua_affair.4.t: "No Reply"
 papua_affair.4.d: "Unfortunately the Papua New Guinea delegation isn't open to our talks right now. Either that or they’ve forgotten how to answer the phone. It’s a disappointing outcome, but in the meantime we can expand our pursuit for rubber more locally."
 papua_affair.4.a: "You can't win 'em all."
