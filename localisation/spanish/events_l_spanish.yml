 corruption.5.d: "Uno de los ministros se ha puesto en contacto con nosotros y nos ha dicho que se pueden hacer algunos cambios organizativos y legales para optimizar el rendimiento de nuestros hospitales, aunque requerirá cierta... conexión personal con las fuerzas motoras."
 corruption.5.a: "Quizás sea una oportunidad"
