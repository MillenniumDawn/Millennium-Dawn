 CHI_HKG_sinicization_modifier: "Китаизация Гонконга"
 CHI_HKG_sinicization_modifier_desc: ""
 CHI_TIB_sinicization_modifier: "Китаизация Тибета"
 CHI_TIB_sinicization_modifier_desc: "Отражает китаизацию Тибета и экономические условия, которые Пекин предоставляет региону по мере её роста. Китаизация растёт за счёт тибетских решений и фокусов ветки §Y$CHI_SAR_integrate_TIB$§!.\n§W--------------§!\nЭтот модификатор будет §Rснят§!, если мы выполним фокус §Y$CHI_SAR_integrate_TIB$§!, для которого требуется §Yкитаизация Тибета§! не менее §Y95§!."
 TIB_sinicization: "£GFX_text_icon_tibet_sar Китаизация Тибета: [?TIB_sinicization_var|Y1]"
 TIB_sinicization_tt: "£GFX_text_icon_tibet_sar Китаизация Тибета: $RIGHT|Y=1$"
 TIB_sar_development_modifier: "Развитие Тибетского САР"
 TIB_sar_development_modifier_desc: "Отслеживает совокупные показатели экономического развития Тибетского специального административного района, отражая рост паломнического туризма, трансграничной торговли и поступлений от добычи полезных ископаемых в этот САР."
 ETK_sinicization: "$ETK_sinicization_var$: [?ETK_sinicization_var|Y1]"
 ETK_sinicization_var: "£GFX_text_icon_xinjiang_sar Китаизация Синьцзяна"
 ETK_sinicization_tt: "$ETK_sinicization_var$: $RIGHT|Y=1$"
 CHI_ETK_sinicization_modifier: "Китаизация Синьцзяна"
 CHI_ETK_sinicization_modifier_desc: "Отражает китаизацию Синьцзяна и экономические условия, которые Пекин предоставляет региону по мере её роста. Китаизация растёт благодаря решениям по Синьцзяну и фокусам ветки §Y$CHI_SAR_integrate_ETK$§!.\n§W--------------§!\nЭтот модификатор будет §Rудалён§!, если мы завершим фокус §Y$CHI_SAR_integrate_ETK$§!, для которого требуется §Yкитаизация Синьцзяна§! не менее §Y95§!."
