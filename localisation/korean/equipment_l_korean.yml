 IFV_9: "IFV 2045"
 IFV_9_desc: "Infantry Fighting Vehicles are heavily armored vehicles that carry a squad of soldiers into battle. The embedded infantry can fight from the vehicle itself to a much larger degree than from APCs. IFVs are armed with a heavy machine gun and an autocannon, or have an ATGM mounted. Infantry being carried by IFVs are either called Armored Infantry or Heavy Mechanized Infantry."
 IFV_10: "IFV 2055"
 IFV_10_desc: "Infantry Fighting Vehicles are heavily armored vehicles that carry a squad of soldiers into battle. The embedded infantry can fight from the vehicle itself to a much larger degree than from APCs. IFVs are armed with a heavy machine gun and an autocannon, or have an ATGM mounted. Infantry being carried by IFVs are either called Armored Infantry or Heavy Mechanized Infantry."
 MBT_10: "MBT 2055"
 MBT_10_desc: "Multi-layered Graphene Vehicle Armor provide protection with an unprecedented light weight, and is nanorobotic self-repairable. With Lithium-Air batteries and an electrical engine, the thermal heat of the tank is reduced to almost nothing, and together with Adaptive Infrared Camouflage this makes it virtually untrackable by electronically guided missile systems. MBTs are heavily armored and highly mobile in flat terrain, and provide armies with powerful direct fire abilities."
 MBT_11: "MBT 2065"
 MBT_11_desc: "Multi-layered Graphene Vehicle Armor provide protection with an unprecedented light weight, and is nanorobotic self-repairable. With Lithium-Air batteries and an electrical engine, the thermal heat of the tank is reduced to almost nothing, and together with Adaptive Infrared Camouflage this makes it virtually untrackable by electronically guided missile systems. MBTs are heavily armored and highly mobile in flat terrain, and provide armies with powerful direct fire abilities."
