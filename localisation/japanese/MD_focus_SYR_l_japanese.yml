 TT_SYR_JAPANESE_ANIME: "If we have big digital investments for long enough our animation business partnered with Japan's will produce commercially successful works"
 TT_SYR_CHINESE_ANIME: "If we have big digital investments for long enough our animation business partnered with China's will produce commercially successful works"
 TT_SYR_DOMESTIC_ANIME: "もし長期間にわたって巨大なデジタル投資を行えば、国内のアニメーション事業は商業的に成功した作品を生み出すだろう"
 TT_SYR_DIGITAL_INVESTMENTS_FOCUS_EFFECT: "デジタル投資ディシジョンを解放する"
 TT_SYR_COTTON_INVESTMENTS: "If we have allowed private banks and we have 50% Kurdish inclusivity or more our investment will be more economically successful and we'll obtain an industrial complex"
 SYR_give_rise_to_merchants: "商人の台頭"
 SYR_give_rise_to_merchants_desc: "社会における農業主義の成長に伴い、伝統に戻る時が来たようだ。新たな、おそらく保守的な世代の投資家が国内で台頭し、うまくいけば、彼らが伝統的な経済を可能な限り最善の方法で管理してくれるだろう。"
 SYR_secular_opposition_victory: "世俗反体制派政府"
 SYR_secular_opposition_victory_desc: "The secular opposition coalition has won the elections and will be tasked with leading Syria into becoming a liberal democratic state"
 SYR_islamist_opposition_victory: "イスラム主義反体制派政府"
 SYR_islamist_opposition_victory_desc: "The Islamist opposition coalition has won the elections and will be tasked with leading Syria into becoming a conservative Islamic republic"
 SYR_turkish_inspired_islamism: "トルコに触発されたイスラム主義"
 SYR_turkish_inspired_islamism_desc: "トルコ共和国設立後に起こったイスラム主義運動からインスピレーションを得るだろう。これにより、当面の間、我々の運動はより好意的に描かれ、トルコの保守的なビジネスマンを国内への投資に引き付けるかもしれない。"
 SYR_deregulate_economy: "規制緩和された経済"
 SYR_deregulate_economy_desc: "我々が多くの支持を得ている中間層と商人を強化するために、彼らに対する制限を減らし、彼らの成長に必要なスペースを提供する。"
 SYR_syrian_gulen_movement: "シリア・ギュレン運動"
 SYR_syrian_gulen_movement_desc: "The Gülen movement in short was an Islamist movement in Turkey that was very popular between students advocating for a pacifist and modern view of Islam. We will draw inspiration from their teachings and reform our school curriculums to advocate for islamic values and teach them to students as well as improve education overall."
 SYR_moderate_conservatism: "穏健保守主義"
 SYR_moderate_conservatism_desc: "我々の階級内の過激な要素を根絶し、宗教的狂信とは何の関係もない保守主義の力としてのイメージを再形成する。"
 SYR_religious_economic_charity: "宗教的寄付"
 SYR_religious_economic_charity_desc: "我々の運動は常に、コミュニティに有益であった慈善団体や財団と関連付けられてきた。今やより顕著な地位にあるので、経済的負担を軽減するためにそれらをさらに制度化する。"
 SYR_qatari_support: "カタールの支援"
 SYR_qatari_support_desc: "様々なカタール投資家の関心を集めた。"
 SYR_flourishment_of_central_economy: "都市中心部の開発"
 SYR_flourishment_of_central_economy_desc: "支持基盤は主に様々な都市地域から来ており、それらの人口からの支持を勢いづけるために開発を開始すべきである。"
 SYR_turkish_investments: "トルコの投資"
 SYR_turkish_investments_desc: "We have attracted lots of turkish investors thanks to our deregulation policies as well as our ideological similarities to them."
 SYR_reverse_secularization: "世俗化の逆転"
 SYR_reverse_secularization_desc: "以前の政権は国家を著しく世俗化させた。この理想への明らかな侮辱は続けるべきではなく、シャリーア法を支持してこれらの政策を逆転させるべきである。"
 SYR_NPF_victory: "国民進歩戦線政府"
 SYR_NPF_victory_desc: "偉大な連合が選挙で勝利し、今こそ新しいシリアの未来を再構成する時だ。"
 SYR_statist_rise: "国家主義者の台頭"
 SYR_statist_rise_desc: "Liberal Economics allows exploitation of our people and compromises our national independence and control. It is best for Syria to connect every aspect of economy to the state."
 SYR_maintain_military_role: "軍のてこ維持"
 SYR_maintain_military_role_desc: "世界は暗く厄介な時代に入っており、国家を守らなければならない、それがどんな犠牲を払っても。"
 SYR_nationalize_oligarchic_holdings: "保有資産の国有化"
 SYR_nationalize_oligarchic_holdings_desc: "経済に対する支配力を強化するために、様々な不正なオリガルヒの保有資産と財産を国有化する。"
 SYR_maintain_socialistic_policies: "社会主義的法律の維持"
 SYR_maintain_socialistic_policies_desc: "以前の政府が正しかったことの一つであり、彼らが比較的より人気があった究極の理由は、下層階級を支援した社会主義政策であった。我々は元大統領ハーフィズ・アル・アサドによって実施された政策を継続し、自らを抑圧された人々の真の支持者として描くだろう。"
 SYR_government_planned_economic_projects: "政府計画経済プロジェクト"
 SYR_government_planned_economic_projects_desc: "責任ある政府としてのイメージを高め、一般の人々からの支持を集めるために、公共プロジェクトを開始すべきである。"
 SYR_patriotic_propaganda: "愛国的プロパガンダ"
 SYR_patriotic_propaganda_desc: "国家の誇りと国家への忠誠心の重要性を強調することにより、イデオロギー的立場を強化する。"
 SYR_gather_support_from_peasantry: "農民からの支持収集"
 SYR_gather_support_from_peasantry_desc: "農民は国家のバックボーンであり、彼らが我々を支持していることを確認する必要がある。"
 SYR_strong_government: "強力な政府"
 SYR_strong_government_desc: "We will have to show our people that our government is stable and capable enough to rule. This will allow us to gain their trust"
 SYR_expand_youth_organizations: "青年組織の拡大"
 SYR_expand_youth_organizations_desc: "我々の党は特に青年組織に依存してきた。今や権力の地位にあるので、彼らの心をつかむことによって、若者にイデオロギー的大義を支持するよう奨励する時が来た。"
 SYR_illiberal_democracy: "非自由民主主義"
 SYR_illiberal_democracy_desc: "自由主義は貧しい国々を感染させ、搾取するウイルスである。人々が必要としているのは、真に人々を代表し、同時に一つの旗の下に人々を団結させる真の民主主義である。我々は何があっても民主主義である。"
 SYR_reestablish_intelligence_committee: "諜報機関の再設立"
 SYR_reestablish_intelligence_committee_desc: "未来の戦争は銃や戦車ではなく、情報で行われる。完全に機能する諜報機関を創設することは我々の責任である。"
 SYR_national_security_act: "国家安全保障法"
 SYR_national_security_act_desc: "過激派グループはゆっくりと国家を殺しており、国民への脅威をもたらしている。彼らの攻撃は国家への明らかな脅威であり、何としても、コストがどうであれ、何が起ころうとも、彼らを直ちに止めなければならない。テロリズムは止めなければならない。"
 SYR_pan_syrian_nationalism: "汎シリア主義"
 SYR_pan_syrian_nationalism_desc: "Syria is the country that should brighten all over Middle East with its unique identity. Our rich history and culture makes it clear that it's our duty to show our true potential and identity to the world."
 SYR_cultural_rebirth: "文化の復興"
 SYR_cultural_rebirth_desc: "Our nation is slowly but surely recognizing its identity. Petty divides should not stand in the way of realizing the beauty of our people. Our people should acknowledge that no matter what, we're still Syrians after all."
 SYR_deal_with_the_trade_unions: "労働組合との取引"
 SYR_deal_with_the_trade_unions_desc: "The key of a strong country is its production and economy so we have to make sure that all workers of Syria are supporting us."
 SYR_reassert_russian_ties: "ロシアとの関係再確認"
 SYR_reassert_russian_ties_desc: "ロシアは、近代化され、安全で、繁栄した国家になるのを助ける唯一かつ真の同盟国である。"
 SYR_russian_oil_excavation: "ロシアの石油取引"
 SYR_russian_oil_excavation_desc: "国家には大きな宝があり、同盟国であるロシアがこれらの資源に到達するのを助けてくれるだろう。"
 SYR_russian_tartus_base_expansion: "ロシア海軍プレゼンスの拡大"
 SYR_russian_tartus_base_expansion_desc: "We can't create a strong navy immediately but our Russian friends will help us keep our coasts safe by aiding in the expansion of the port's capabilities."
 SYR_nasserist_rise: "ナセル主義者の台頭"
 SYR_nasserist_rise_desc: "ナセル主義は再び台頭し、シリアを再び偉大にする準備ができている。"
 SYR_the_coalition: "連合"
 SYR_the_coalition_desc: "After reestablishing political parties two notable forces have risen. One advocates for federalizing the state and giving more power to provinces while the other advocates for entrenching the centralized authority and maintaining a united centralized republic. We'll have to choose carefully who we should align with."
 SYR_dismantle_the_military: "軍事予算の解体"
 SYR_dismantle_the_military_desc: "防衛GDPの多くは、軍隊の機関内の根深い汚職のために横領され、無駄なプロジェクトに向けられてきた。我々は手に入れることができるものの多くを転用し、売却する。これは軍隊を弱体化させ、脅威に対して脆弱にするかもしれないが、経済回復と汚職根絶に向けた必要なステップである。"
 SYR_empower_institutions: "機関の強化"
 SYR_empower_institutions_desc: "我々の機関は非常に弱く、脇に追いやられている。これは権力が大統領に集中し、議会にはほとんど権力が与えられず、国家管理メディアが個人の自由を制約する雰囲気を支持しているためである。権力分散と自由化を保証する新しい憲法を起草することは、未来に向けた重要なステップである。"
 SYR_western_supported_economic_relief: "西側の救済"
 SYR_western_supported_economic_relief_desc: "我々の理想は西側のそれと一致し、彼らの国々に我々の党を設立することさえ可能にした。我々は彼らと関係を結び、経済的なてこと引き換えに救済を要請するだろう。"
 SYR_liberalize_society: "社会の自由化"
 SYR_liberalize_society_desc: "人々は自由と平等の価値観に慣れていない。彼らが自由を価値あるものと見なすように奨励することに取り組むべきである。"
 SYR_scientific_ventures: "科学的冒険"
 SYR_scientific_ventures_desc: "奨学金を支援し、時代遅れの学校カリキュラムを更新することにより、国の科学部門を進歩させることができるだろう。"
 SYR_banish_authoritarian_influence: "権威主義的影響力の追放"
 SYR_banish_authoritarian_influence_desc: "イランやロシアのような多くの権威主義国家がここに大きな存在感を持っていた。今や自由な国家となったので、機関と経済に対する彼らの影響力を終わらせる時が来た。"
 SYR_democratic_socialism: "民主社会主義"
 SYR_democratic_socialism_desc: "国の破滅的な経済状態は、人口をかなり貧しく未開発なままにした。ビジネスに対する制限を減らすことは、経済的不平等が依然として国内で蔓延しているため、搾取と不公正な競争を導入するだろう。必要なのは、国内の新しいビジネスを奨励し、すべての階級の市民が楽しむことができる広範な経済発展を可能にするための助成金を与えることである。"
 SYR_unleash_economic_potential: "経済的潜在力の解放"
 SYR_unleash_economic_potential_desc: "経済大国になる大きな潜在力がある。外国の投資家や企業がここに会社を設立することを奨励でき、これは人口を安価な労働者にすることになるかもしれないが、経済発展への大きな飛躍となるだろう。"
 SYR_domestic_investments: "国内投資"
 SYR_domestic_investments_desc: "多くの若い国内ビジネスが設立されている。経済的繁栄への彼らの旅を支援するために、彼らに投資する。"
 SYR_subsidize_local_firms: "地元企業"
 SYR_subsidize_local_firms_desc: "Thanks to our policies local firms are being recognized for their success. Time to invest in them."
 SYR_economic_democracy: "経済的平等"
 SYR_economic_democracy_desc: "Our economic development has reached all people of all economic backgrounds by tackling economic inequality and even gave rise to successful domestic companies. This is something we should be proud of."
 SYR_syrian_diaspora_investments: "ディアスポラ投資"
 SYR_syrian_diaspora_investments_desc: "Thanks to our economically friendly policies we have attracted investments from the Syrian diaspora living abroad"
 SYR_invite_US_business_giants: "ビジネス巨人の招待"
 SYR_invite_US_business_giants_desc: "経済を繁栄させることを許可したが、これでは十分ではない。消費主義を奨励するために、米国の巨大ビジネスを国内にフランチャイズを設立するよう招待する。"
 SYR_address_ethnic_divides: "民族的分裂への対処"
 SYR_address_ethnic_divides_desc: "国は常に分裂し、宗派主義に悩まされてきた。これらの問題にどのように対処するか決める必要がある。"
 SYR_EU_investments: "EU投資"
 SYR_EU_investments_desc: "様々なヨーロッパ諸国が国内への投資を求めている。"
 SYR_student_exchanges: "学生交換"
 SYR_student_exchanges_desc: "教育を強化し、世界標準に合わせるために、外国への奨学金を奨励する。"
 SYR_invest_in_tourism: "観光ブーム"
 SYR_invest_in_tourism_desc: "我々が経済に行った改善と投資により、観光産業はかつてないほどの数に成長している。まもなくシリアは地中海で最も人気のある休暇先の一つとなるだろう。"
 SYR_technological_investments: "技術投資"
 SYR_technological_investments_desc: "我々の技術は非常に時代遅れであり、単に無視することはできない。我々は何かをしなければならないだろう。"
 SYR_digitalisation_campaign: "デジタル化キャンペーン"
 SYR_digitalisation_campaign_desc: "我々の技術インフラは今日の基準にとって非常に時代遅れで非効率的である。この妨げとなる問題に取り組むために、新しい技術の研究と構築に向けて資金を転用すべきである。"
 SYR_chinese_anime: "中国アニメ"
 SYR_chinese_anime_desc: "Venus Centre, a company based in Damascus, is currently the only dubbing company that dubs Japanese anime (and other cartoons) to Arabic. We have to expand their capabilities and encourage cooperation with Chinese anime studios. Even though they aren't as popular as their competitors, the Chinese animation industry is very successful nonetheless and it's a great idea for us to learn and cooperate with them to be the leading animation producers in the Middle East and Arab world"
 SYR_domestic_anime: "国内アニメ"
 SYR_domestic_anime_desc: "ダマスカスに拠点を置くヴィーナス・センターは、現在、日本のアニメ（および他のカートゥーン）をアラビア語に吹き替える唯一の吹き替え会社である。我々自身の文化と美学は外部のテーマに影響されるべきではなく、外国の専門知識は必要ない。我々は完全に自分自身に頼り、外国のアニメーション大手からの助けを求めようとはしないだろう。"
 SYR_japanese_anime: "日本アニメ"
 SYR_japanese_anime_desc: "Venus Centre, a company based in Damascus, is currently the only dubbing company that dubs Japanese anime (and other cartoons) to Arabic. We have to expand their capabilities and encourage cooperation with Japanese anime studios. The unopposed animation giant will surely be of immense help when it comes to setting up our animation industry and producing the most popular works in the Middle East"
 SYR_economic_revitalization: "経済活性化"
 SYR_economic_revitalization_desc: "我々の経済は混乱しているだけでなく、非常に非効率的で、持続不可能で、時代遅れである。もし我々が経済的繁栄を求めるなら、我々の機能不全で絶望的な経済への近代化と投資という骨の折れるプロセスを開始しなければならないだろう。"
 SYR_tartus_service_sector: "タルトゥースのサービス部門"
 SYR_tartus_service_sector_desc: "サービス部門はタルトゥース市で最も魅力的な雇用部門の一つである。高い割合の住民が高い科学的資格を持ってサービス部門で働いており、彼らは公的部門と民間部門の間で分配されている。"
 SYR_expand_the_sector: "民間部門の拡大"
 SYR_expand_the_sector_desc: "民間部門の参加は、地中海の他の沿岸都市と比較して依然として必要なレベルを下回っている。我々は民間部門に投資し、魅力的な経済ホットスポットになるように拡大すべきである。"
 SYR_service_sector_in_lacking_regions: "不足地域へのサービス投資"
 SYR_service_sector_in_lacking_regions_desc: "タルトゥースのサービス部門は順調に繁栄しているが、他の同等かそれ以上に重要な都市については同じことは言えない。熟練労働者がタルトゥース外で働くことを経済的に奨励し、有望なビジネスに投資することによって、我々はこの状況を改善するだろう。"
 SYR_expand_powerstations_in_homs: "ホムスの発電所拡張"
 SYR_expand_powerstations_in_homs_desc: "A low number of powerstations exist in our country and this has been a persisting and annoying issue. We will build a number of powerstations in Homs due to its central location being the junction of Syria and the presence of a big oil refinery in the city"
 SYR_tap_into_the_oil_reserves: "石油埋蔵量の利用"
 SYR_tap_into_the_oil_reserves_desc: "The oil reserves in the eastern part of the country look promising and await our drills to extract them."
 SYR_road_to_palmyra: "パルミラへの道"
 SYR_road_to_palmyra_desc: "パルミラはかなりの数の観光客を引き付けてきた重要な考古学的遺跡である。観光客が風景を訪れやすくするために、インフラと道路を改善するだろう。"
 SYR_expand_latakian_airport: "ラタキア空港の拡張"
 SYR_expand_latakian_airport_desc: "The Latakian airfield is used for military purposes. However, there is a lot of potential for it to be used for civilian airlines due to the city being a tourist hotspot thus we will start investing in it"
 SYR_agricultural_investments: "農業投資"
 SYR_agricultural_investments_desc: "農業は石油に次ぐ我が国経済の第二の大きな部門である。我々は大規模な農業力となるための潜在能力を活用すべきである。"
 SYR_idlib_aleppan_investments: "イドリブ・アレッポ農業連携"
 SYR_idlib_aleppan_investments_desc: "アレッポはイドリブの農業に巨大な経済的存在感を持っている。我々は両地域に利益をもたらし、二都市の農業産業の潜在能力を奨励するために、さらなる投資を奨励するだろう。"
 SYR_idlib_contest_aleppan_investments: "アレッポの存在への対抗"
 SYR_idlib_contest_aleppan_investments_desc: "While Aleppo's economic presence in Idlib is beneficial to both cities, this state of affairs might make the economic forces outside of our control gain unwanted power. We should contest their presence by investing in Idlib and reducing Aleppo's economic ambitions in the region"
 SYR_provisions_to_daraa: "ダルアーへの供給"
 SYR_provisions_to_daraa_desc: "ダルアーは地域の水供給減少に苦しみ、政府の供給不足によって悪化した干ばつのために北東部の土地を離れることを余儀なくされた国内難民の流入の下で逼迫していた。我々は地域に投資し、これらの問題を直ちに修正するために取り組むだろう。"
 SYR_invest_in_hasakan_cotton: "ハサカの綿への投資"
 SYR_invest_in_hasakan_cotton_desc: "カーミシュリーとアル＝ハサカの都市における経済ブームは、1960年代に開始された灌漑プロジェクトの結果であり、それが北東シリアを綿花栽培地域へと変貌させた。これは我が国経済に大いに利益をもたらし、我々はその都市が収益性の高い繊維産業を収容する潜在能力を資本化するだろう。"
 SYR_renewables_focus: "再生可能エネルギーへの焦点"
 SYR_renewables_focus_desc: "We have suffered from a lot of problems regarding electricity and energy output due to low amounts of oil drilling as well as the increasing population. It's wiser to focus on renewable alternatives because if we think about it our oil-dependant energy sector will become more of a liability in the future."
 SYR_invest_in_wdrvm: "WDRVMへの投資"
 SYR_invest_in_wdrvm_desc: "WDRVM is a promising company specializing in the manufacture and installation of wind turbines and powerstations. They have ambitious plans to install wind turbines across the region and tackle the energy problems by exploiting the few regions where stable winds are present. While these regions are scattered with infrequent stable winds there is no denying the positive effects on our energy sector"
 SYR_set_up_puppet_ren_company: "傀儡再生可能エネルギー会社"
 SYR_set_up_puppet_ren_company_desc: "経済に対する我々の支配をさらに強化するために、傀儡再生可能エネルギー会社を支援すべきである。"
 SYR_encourage_domestic_solar_companies: "国内太陽光発電会社"
 SYR_encourage_domestic_solar_companies_desc: "いくつかの野心的な太陽光発電会社が国内で形成されており、国内の太陽光パネル生産を奨励するために彼らに投資すべきである。"
 SYR_monopolize_solar_power: "太陽光発電産業の独占"
 SYR_monopolize_solar_power_desc: "利益のための大きな機会が我々の砂漠の太陽光潜在能力にある。我々はこの有望な部門を独占するために、我々自身の太陽光発電会社を設立するだろう。"
 SYR_initiate_industrialization: "工業化の開始"
 SYR_initiate_industrialization_desc: "Our industrial capabilities are outdated and non-existent. Yet we have the potential to kickstart an industrial growth that'll greatly empower and invigorate our economy"
 SYR_damascus_automotive_potential: "ダマスカスの自動車潜在能力"
 SYR_damascus_automotive_potential_desc: "ダマスカスの多くの産業地域が自動車組立専用であるが、まだそれに値するほどの低い注意しか受けていない。我々はそれらに投資し始めるだろう。"
 SYR_invite_automotive_giants: "自動車大手企業の招待"
 SYR_invite_automotive_giants_desc: "Popular car brands like Mitsubishi, Toyota and Volkswagen will be of great benefit to our economy if we convince them to invest in us. This will allow quality vehicles to be acquired by our populace"
 SYR_SIAMCO_monopoly: "SIAMCO独占"
 SYR_SIAMCO_monopoly_desc: "我々はイランと中国からの自動車ブランドと取引してきた歴史があり、手頃な価格の車を生産し、望ましくない影響力を経済から排除するために、常にそうあるべきだ。"
 SYR_homs_heavy_industry: "ホムス重工業"
 SYR_homs_heavy_industry_desc: "Homs is home to several large public heavy industries. Obviously there is a promising future as an industrial giant and we should invest in them to allow the city to prosper. However we'll have to choose between investing on their production capabilities or resource extraction and processing capabilities"
 SYR_homs_production_focus: "生産への焦点"
 SYR_homs_production_focus_desc: "成長する民間産業部門が過去10年間で繁栄し、多くの中小企業が市の北西および南部の産業ゾーンを占めている。我々はそれを活用し、これらの産業をさらに発展させるだろう。"
 SYR_phosphate_extraction: "リン酸塩抽出"
 SYR_phosphate_extraction_desc: "我々はこの国に豊富に存在するこの有用な資源を抽出するために、新しいリン酸塩プラントを拡張し建設するだろう。"
 SYR_expand_industrial_capabilities: "産業能力の拡大"
 SYR_expand_industrial_capabilities_desc: "都市の生産能力を発展させる方が賢明である。なぜなら、これは都市の経済成長にとってより持続可能な道だからである。"
 SYR_tartus_pharmaceutical_giant: "製薬大手"
 SYR_tartus_pharmaceutical_giant_desc: "タルトゥースには多数の製薬工場があり、我が国経済にとって手ごわい柱を形成している。この部門の未来を決定する時が来た。"
 SYR_pharmaceutical_export_focus: "輸出奨励"
 SYR_pharmaceutical_export_focus_desc: "我々は製薬会社に投資し、地域的優位性への拡大を奨励し、医薬品の輸出を奨励するだろう。これは我々の経済成長にとって素晴らしいことだろう。"
 SYR_pharmaceutical_healthcare_focus: "医薬品価格の引き下げ"
 SYR_pharmaceutical_healthcare_focus_desc: "我々の国民はこの能力を自身の幸福のために使うことができる。我々は予算の一部を、国民にとって医薬品および製薬製品をより安価にするために割り当てるだろう。"
 syrian_phosphate_exports: "シリアリン酸塩輸出"
 syrian_new_high_command: "新たな最高司令部"
 syrian_agricultural_capability_fully_unleached: "農業社会"
 syrian_agricultural_capability_fully_unleached_desc: "シリアの新政府の政策により、この国は少なくとも経済の観点からは、進歩的な道ではなく、より……保守的な道を選んだようだ。"
 syrian_industrial_capability_fully_unleached: "急速な産業拡大"
 syrian_industrial_capability_fully_unleached_desc: "産業主義者の完全な支持と国内の新しい投資家の創出により、シリアはその国の未来のために新たな一歩を踏み出している：大規模な工業化。"
 alawite_political_inclusiveness_dynamic_modifier: "アラウィー派コミュニティの政治的包摂性"
 TT_alawite_political_inclusiveness_dynamic_modifier: "アラウィー派は主にレバントに住む民族宗教グループであり、シーア派イスラムから派生したイスラム教の一派であるアラウィー派を信仰している。国内における彼らの政治的包摂性[?alawite_status|%%Y]は、国内の政治における信頼と政治活動のレベルを定義し、汚職、地域インフラの欠如、宗教の自由の記録の悪さ、および国の他の地域と比較した地域産業の欠如によって悪影響を受ける。"
 druze_political_inclusiveness_dynamic_modifier: "ドゥルーズ派コミュニティの政治的包摂性"
 TT_druze_political_inclusiveness_dynamic_modifier: "ドゥルーズ派は民族的にはアラブ人であり、アラビア語を話す。彼らの一神教宗教はイスラム教、ユダヤ教、キリスト教から多くの信仰を取り入れており、またギリシャ哲学とヒンドゥー教の影響も受けている。国内における彼らの政治的包摂性[?druze_status|%%Y]は、国内の政治における信頼と政治活動のレベルを定義し、汚職、地域インフラの欠如、宗教の自由の記録の悪さ、および国の他の地域と比較した地域産業の欠如によって悪影響を受ける。"
 kurdish_political_inclusiveness_dynamic_modifier: "クルド人コミュニティの政治的包摂性"
 TT_kurdish_political_inclusiveness_dynamic_modifier: "クルド人は西アジアのクルディスタン山岳地域原産のイラン系民族グループであり、南東トルコ、北西イラン、北イラク、北シリアにまたがる。国内における彼らの政治的包摂性[?kurdish_status|%%Y]は、国内の政治における信頼と政治活動のレベルを定義し、汚職、地域インフラの欠如、および国の他の地域と比較した地域産業の欠如によって悪影響を受ける。"
 subsidized_counter_terror_operations: "補助金付き対テロ機構"
 subsidized_counter_terror_operations_desc: "対テロ訓練へのGDPの§R0.06%§!の割り当ては、我々の部隊の基準を向上させる。"
 SYR_WDRVM_investments: "WDRVM投資"
 SYR_WDRVM_investments_desc: "We have invested into building numerous wind farms across Syria"
 SYR_palmyrene_solar_farms: "パルミラ太陽光発電所"
 SYR_palmyrene_solar_farms_desc: "我々は国の東部に太陽光発電所を建設するために投資した。"
 idea_syrian_development_projects: "都市開発プロジェクト"
 idea_syrian_kurds_without_citizenships: "クルド人の疎外"
 idea_syrian_kurds_without_citizenships_desc: "Treated as foreigners in their own lands, at least 300 thousand Kurds are denied citizenship and are accused of having crossed the borders into the country."
 idea_syrian_banking_problem: "銀行規制"
 idea_syrian_banking_problem_desc: "シリアの銀行業務は、全ての外国為替および貿易取引も管理するシリア中央銀行によって管理されている。シリアの全ての商業銀行は1966年に国有化された。中央銀行は公共部門への融資を優先するが、民間部門はしばしば海外で銀行業務を行い、このプロセスはより高価であり、したがって産業金融ニーズに対する貧弱な解決策である。"
 syrian_gulen_movement: "シリア・ギュレン運動"
 syrian_scientific_ventures: "科学的事業"
 syrian_student_exchanges: "学生交流"
 syrian_promises_of_change_western: "変化の約束"
 syrian_promises_of_change_western_desc: "With a new government in charge promising change and improvement the people await what it will bring to the table"
 syrian_promises_of_change_neutral: "変化の約束"
 syrian_promises_of_change_neutral_desc: "変化と改善を約束する新政府が担当となり、国民は何を提示するかを待っている。"
 syrian_promises_of_change_nationalist: "変化の約束"
 syrian_promises_of_change_nationalist_desc: "変化と改善を約束する新政府が担当となり、国民は何を提示するかを待っている。"
 syrian_promises_of_change_emerging: "変化の約束"
 syrian_promises_of_change_emerging_desc: "変化と改善を約束する新政府が担当となり、国民は何を提示するかを待っている。"
 syrian_military_dismantling: "軍の解体"
 syrian_military_dismantling_desc: "軍に属する資金と財産は、債務軽減を支援するために再利用されている。"
 syrian_empowered_sharia_courts: "権限強化されたシャリーア法廷"
 idea_syr_empowered_parliament: "権限強化された議会"
 idea_syrian_oligarchy_arrests: "オリガルヒ粛清"
 idea_syrian_pharmaceutical_powerhouse: "製薬大国"
 idea_syrian_pharma_healthcare_model: "製薬医療支援"
 syrian_digital_investment1: "最小限のデジタル投資"
 syrian_digital_investment2: "低いデジタル投資"
 syrian_digital_investment3: "中程度のデジタル投資"
 syrian_digital_investment4: "大きなデジタル投資"
 syrian_digital_investment5: "巨大なデジタル投資"
 idea_hisiyah: "ヒスィヤー産業活性化"
 idea_hisiyah1: "ヒスィヤー産業地域の拡大"
 idea_aleppan_slums: "アレッポのスラム街一掃"
 idea_aleppan_slums1: "アレッポでの建設プロジェクト"
 idea_damascus_priv_sector: "ダマスカス民間部門拡大"
 idea_damascus_priv_sector1: "ダマスカスでの経済拡大"
 idea_syr_eastern_excavation: "東部掘削プロジェクト"
 idea_syr_eastern_cotton: "綿花農場建設"
 idea_syrian_service_sector_invigoration: "サービス部門活性化"
 syria_cultural_rebirth: "文化復興"
 syria_emerging_youth: "青年組織"
 syria_nationalist_youth: "青年組織"
 syrian_syriatel: "シリアテル"
 syria_japanese_anime: "日本影響のアニメ"
 syria_japanese_anime_success: "日本影響のアニメ産業"
 syria_chinese_anime: "中国影響のアニメ"
 syria_chinese_anime_success: "中国影響のアニメ産業"
 syria_domestic_anime: "国内アニメ"
 syria_domestic_anime_success: "シリアのアニメ産業"
 Syria_damascus_spring_organization: "ダマスカスの春の組織化"
 organize_damascus_spring_into_a_revolution: "革命の準備"
 economy_of_hasaka: "ハサカの経済状況"
 economy_of_deir_elzor: "デリゾールの経済状況"
 economy_of_al_raqqa: "ラッカの経済状況"
 economy_of_homs: "ホムスの経済状況"
 economy_of_idlib: "イドリブの経済状況"
 economy_of_latakia: "ラタキアの経済状況"
 economy_of_damascus: "ダマスカスの経済状況"
 economy_of_daraa: "ダルアーの経済状況"
 economy_of_al_suwayda: "スウェイダーの経済状況"
 Syria_economic_investments: "シリアの経済的可能性"
 Syria_economic_investments_desc: "Our economy has always been extremely outdated and inefficient when compared to most of our neighbors yet it has the potential to become a great and powerful one. We have addressed some problems and potential investment targets in order to refurbish our capabilities and will have to start as soon as possible if we want our nation to be brought to greatness, and our people proud and content with our government"
 invigorate_hisiyah: "ヒスィヤー産業地域の活性化"
 invigorate_hisiyah_desc: "A major industrial project in our country was the establishment of a new industrial city in Hisiyah. While it has been built and established we'll need to invest in it and expand it for our economy to grow"
 hisiyah_industrial_expansion: "産業地域の拡大"
 hisiyah_industrial_expansion_desc: "我々の経済成長とビジネスフレンドリーな政策のおかげで、新しく成功したビジネスからの多くの投資が産業地域に注ぎ込まれている。これを利用し、地域をさらに拡大する時が来た。"
 clear_aleppan_slums: "アレッポのスラム街一掃"
 clear_aleppan_slums_desc: "Due to a recent population growth and unemployment, many people in Aleppo are living in slums. If we start housing projects and invest in the economy of the city we will be able to get rid of this problem"
 aleppan_economy_booming: "アレッポの潜在能力への投資"
 aleppan_economy_booming_desc: "我々の経済成長とビジネスフレンドリーな政策のおかげで、新しく成功したビジネスからの多くの投資が市の産業ゾーンに注ぎ込まれている。我々は今、市の産業能力を拡大することができる。"
 damascus_private_sector_encouragement: "ダマスカス民間部門の奨励"
 damascus_private_sector_encouragement_desc: "Damascus is home to a wide range of industrial activity, such as textile, food processing, cement and various chemical industries. The majority of factories are run by the state, and this has proven to be very ineffective at unleashing the city's economic potential. It's time to expand the private sector by investing in the young and promising businesses present"
 damascus_private_sector_booming: "ダマスカスの有望な民間部門への投資"
 damascus_private_sector_booming_desc: "Thanks to our economic growth and business friendly policies the private sector has expanded and grown a lot during the recent times. We will invest in this great development and make our capital an economic model"
 eastern_oil_excavation_phase1: "東部石油掘削プロジェクトフェーズ1"
 eastern_oil_excavation_phase2: "東部石油掘削プロジェクトフェーズ2"
 eastern_oil_excavation_phase3: "東部石油掘削プロジェクトフェーズ3"
 invest_in_eastern_cotton: "東部綿花への投資"
 invest_in_eastern_cotton_desc: "我々は国の東部の綿花畑への投資を開始するだろう。"
 Syria_agricultural_subsidies_decisions: "農業補助金政策"
 Syria_agricultural_subsidies_decisions_desc: "シリア政府は国内食料生産を確保するために長年農業に重く補助金を出してきた。これにより、ほぼ全ての耕作可能な土地が耕作される状況になった。"
 syria_decision_increase_subsidies: "補助金の増額"
 syria_decision_decrease_subsidies: "補助金の減額"
 Syria_digital_investments_decisions: "デジタル投資"
 Syria_digital_investments_decisions_desc: "我々のデジタルインフラは非常に時代遅れで、事実上存在しない。我々はそれについて何かをすることに決め、このインフラの改善と投資に予算の一部を割り当て始めるだろう。"
 syria_decision_increase_investments: "投資予算の増額"
 syria_decision_decrease_investments: "投資予算の減額"
 SyriaFocus.86.t: "自発的組織の台頭"
 SyriaFocus.86.d: "我々の自発的組織への奨励と資金提供は、少数派と国民の政府に対する適切な包容性と信頼のおかげで、非常に成功を収めている。人々は宗派や民族の分裂を超越し、互いに非常に寛容である多くの組織や協会を形成している。これは我が国の統一に向けた大きな前進だが、道のりはまだ続いており、兄弟的共存と協力によって定義される国民統一を達成するには時間がかかるだろう。"
 SyriaFocus.86.a: "国民の結束"
 SyriaFocus.87.t: "経済的自立を持つ州の数の増加"
 SyriaFocus.87.d: "Thanks to our successful efforts and relaxed laws towards economic activity, some states are developing durable and self-sufficient economies distinct to their resources as a result of citizens feeling more incentivised to work and businesses given more freedom to conduct their activities. This has allowed for more liquidity in our markets and a general improvement of our economy and we all have to thank decentralized development schemes aimed towards directly improving the quality of life and increasing economic opportunities based on each state's available resources. However it will take time for the country to achieve an economy that can be called sustainable and durable but as long as we are successful in investments we're sure to achieve that"
 SyriaFocus.87.a: "経済状況が改善している"
 SyriaFocus.88.t: "国民進歩戦線の勝者"
 SyriaFocus.88.d: "国民進歩戦線連合が勝利したようだ。そして最も多くの票を獲得した政党は："
 SyriaFocus.88.a: "ナセル主義者"
 SyriaFocus.88.b: "ポピュリスト"
 SyriaFocus.90.b: "自由主義者"
 SyriaFocus.91.b: "ポピュリスト共和主義者"
 SyriaFocus.91.c: "まあ……それについては後で話せる"
 SyriaFocus.97.b: "今回は彼らに教訓を教えよう"
 SyriaFocus.98.t: "アラウィー派将校、離反！"
 SyriaFocus.98.d: "The Alawites have long been a repressed minority in Syria before the Assads came to power and now that their rule came to an end a group of high ranking Alawite officers took the opportunity to justify their community's currently precarious status to declare the independence of the Alawite regions. Claiming that doing so will protect them even though it's clear that they're using their positions of power to usurp whatever they can get their hands on"
 SyriaFocus.98.a: "here goes our access to the Mediterranean"
 SyriaFocus.98.b: "我々の領土保全は冗談ではない"
 SyriaFocus.99.t: "Formation of the Syrian Green Federalist Movement"
 SyriaFocus.99.d: "A group of Kurdish political activists have formed a movement calling for the federalisation of Syria as a solution to greater inclusiveness of the marginalized Kurdish population in addition to promoting sustainable incentives. Even though their ideals were completely alienated in the political arena they're hopeful that their cries won't fall on deaf ears"
 SyriaFocus.99.a: "Federalism? In Syria?"
 SyriaFocus.100.t: "失敗した経済プロジェクト"
 SyriaFocus.100.d: "多くの州で経済繁栄を成功裏に促進することに失敗した。これは、人口が企業を設立し、企業のために働くよう動機付けるほど十分に企業に優しい政府ではなかったことによる可能性がある。"
 SyriaFocus.100.a: "次は幸運を"
 SyriaFocus.101.t: "低い政治活動が続く"
 SyriaFocus.101.d: "We have received the report and it seems that people are still not being motivated enough to attend townhall meetings. The people still do not have enough trust in the government and its institutions to feel that they will be heard and thus aren't inclined to take part in regional decision-making. We'll have to gain the people's trust and assure that their voices will be heard in order to motivate them to become active in politics and society"
 SyriaFocus.101.a: "我々はもっと努力しなければならない！"
 SyriaFocus.102.t: "政治活動の活発化"
 SyriaFocus.102.d: "Our efforts to encourage the people to become politically active have paid off. Many people are flocking towards their respective municipality's townhall and are discussing issues and policies. This will lead to the state implementing policies respective to its own distinct peoples and will ensure that people respect the rule of law and shape their own lifestyle the way they please. Notably more effort is needed to entrench this behaviour and witness a Swiss model of democracy"
 SyriaFocus.102.a: "人民は自らの運命の主となるだろう"
 SyriaFocus.103.t: "シリア連邦の結成"
 SyriaFocus.103.d: "The road was long and difficult, but we did it! Much effort spent in bringing the people together has led to our nation becoming a model example of direct democracy under the banner of the federation. Brotherhood and cooperation have become the order of the day unlike a few years ago when divides, discrimination and bigotry were prevalent and seemingly impossible to overcome yet, coexistence has been truly entrenched and these divides appear no more. Long live the Syrian Federation where everyone lives free of tyranny, and indifferent to any attempts of division. For we shall cooperate towards achieving the hopeful future"
 SyriaFocus.103.a: "手を取り合い、我々は未来を見つめる"
 SyriaFocus.104.t: "シリア共和国の再生"
 SyriaFocus.104.d: "Once deemed impossible, now has become reality! A nation-state united and powerful in a region of heterogenous peoples, have reunited by the will of its people to form a state defined by itself as servant of the people of Syria. The people stand under the banner that unites them no matter what ethnicity or sect they adhere to, in total contradiction to our neighbors. A sense of patriotism towards Damascus's tricolored three starred flag overwhelms any other, as the people have chosen to unite with their homeland under a single identity. Long live the Republic and its people where everyone shall experience the glory and pride of the state, resilient against odds, and determined to face whatever lies ahead"
 SyriaFocus.104.a: "旗を掲げ、希望を込めて見つめながら、我々は未来を見据える"
 SyriaFocus.104.b: "議会に留保議席を与える"
 SyriaFocus.105.t: "ドルーズ派代表権の状況"
 SyriaFocus.105.d: "The Druze are a religious minority in Syria living in the southern mountainous regions of south Syria that suffered repression throughout Syria's history. Should we grant them reserved seats in parliament to ensure they acquire the representation they deserve or should we simply encourage political participation in their regions? Bear in mind that granting them seats will implement elements of confessionalism which is dividing the political system along sectarian lines. This might have future repercussions since the politicians might abuse their powers, accuse anyone who criticizes them of attacking the entire sect, and it will cause discontent in the minorities that weren't granted seats in parliament"
 SyriaFocus.105.a: "政治的に活動するよう奨励するだけだ"
 SyriaFocus.105.b: "議会に留保議席を与える"
 SyriaFocus.106.t: "Fate of citizenship-denied Kurds"
 SyriaFocus.106.d: "Ever since the previous regime got to power there have been at least 300,000 Kurds with no citizenships granted, leaving them treated as foreigners in their own country. Should we start the process of distributing citizenships to them?"
 SyriaFocus.106.a: "はい！"
 SyriaFocus.106.b: "いいえ！"
 SyriaFocus.107.t: "キリスト教徒コミュニティ、議席を要求！"
 SyriaFocus.107.d: "Seeing how other religious communities received seats in parliament, the Christian community, fearing misrepresentation, demanded that they be offered seats in parliament as well. Should we grant them seats risking increased drawbacks from confessionalism? Or should we deny them seats and receive discontent from the Christian community?"
 SyriaFocus.107.a: "彼らに議席を与える"
 SyriaFocus.107.b: "彼らにその権利はない"
 SyriaFocus.108.t: "アニメ産業ブーム"
 SyriaFocus.108.a: "どこもかしこもアニメファンだらけになるだろう"
 SyriaFocus.111.t: "クルド人が離反"
 SyriaFocus.111.d: "疎外されてきたことに不満を抱くクルド人たちは、我々の支配の弱体化に乗じて反乱を起こした。彼らはシリアからの独立を求め、自らの国家を樹立しようとしている。これは、シリアにおける新たな紛争へと発展する可能性が高い。"
 SyriaFocus.111.a: "くそっ"
 SyriaFocus.112.t: "リン酸塩産業とその問題"
 SyriaFocus.112.d: "With Syria having good amount of resources of phosphate, it seems that there are two options ahead of us, one is for profit, and one is for improving our agriculture. Surely exporting phosphate can speed up our economy a little, but at the same time, if we truly care for our agriculture, maybe a little self reliance would be better. After all, it's a matter of choosing self reliance or Trade. So, which one should we choose?"
 SyriaFocus.112.a: "独立したより良いシリアのために、\n我々はそれらを自分たちのために使う"
 SyriaFocus.112.b: "利益は悪くない、だろ？"
 SyriaDecisions.16.t: "勝利"
 SyriaDecisions.16.desc: "我々は国境戦争で目的を達成した。"
