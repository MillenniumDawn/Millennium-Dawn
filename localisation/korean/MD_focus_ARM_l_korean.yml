 ARM_foreseeing_the_prophecy: "예언을 내다보며"
 ARM_foreseeing_the_prophecy_desc: "아르메니아 민족 기원 전설에 따르면, 아르메니아인들은 시조 하이크의 통합 아래 남쪽의 셈족 부족들과 맞서 싸워 존재할 권리를 얻었다고 합니다. 새 시대는 어깨 위에 과거의 유산을 짊어지고 있으며, 전설은 시조 하이크처럼 아르메니아인의 구원이 새천년에 올 것이라고 말합니다."
 ARM_expand_cis_cooperations: "CIS 안보 협력 확대"
 ARM_expand_cis_cooperations_desc: "CIS 안보 협력 확대"
 arme.16.t: "아르메니아 예레반에서 열린 CIS 안보 회의"
 arme.16.d: "아르메니아 지도자 [ARM.GetLeader](이)가 CIS 안보·특수기관 수장 위원회 회의에 참석하기 위해 예레반에 도착한 대표단장들을 맞이했습니다.\n\n아르메니아 국가 원수 공보실의 발표에 따르면, [ARM.GetLeader](은)는 특히 국가 차원뿐 아니라 지역 및 국제 차원에서 안보를 보장하는 일이 최우선 과제임을 감안할 때 위원회 활동의 중요성을 언급했습니다. 대통령은 CIS 내 협력을 심화할 필요성을 강조했습니다.\n\n[ARM.GetLeader](은)는 안보 위협에 맞서 싸우는 문제가 언제나 국가들의 관심사의 중심에 있었다고 언급했습니다. 그에 따르면 이 분야와 기타 분야의 협력은 국가 간 유대와 민족 간 우정을 더욱 강화할 수 있게 합니다.\n\n[ARM.GetLeader]의 요청에 따라 손님들은 차그카조르에서 열린 회의에서 논의된 사안과 내려진 결정을 발표했습니다."
 arme.16.a: "흥미롭군."
 armcis_infl: "§Y[ROOT.GetNameWithFlag]§!(이)가 모든 §3CIS 회원국§!에 대해 §Y영향력 2%§!를 얻습니다"
 ARM_russian_culture_promotion: "러시아 문화 홍보"
 ARM_russian_culture_promotion_desc: "러시아는 언제나 우리나라에서 자국 문화를 홍보하고 싶어 합니다. 그 동기가 무엇이든, 외국어에 대한 추가 지식과 교육 협력은 언제나 우리 국민에게 이롭습니다."
 ARM_russian_fsb_borderguards: "러시아 FSB 국경 경비대"
 ARM_russian_fsb_borderguards_desc: "우리의 안보를 강화하기 위해 러시아 FSB 국경 부대를 초청해야 합니다."
 arme.17.t: "[ARM.GetNameWithFlag], FSB 국경 부대 초청"
 arme.17.d: "최근 아르메니아 정부가 우리 FSB 국경 부대에 아르메니아-튀르키예 국경과 아르메니아-아제르바이잔 국경의 경비 및 감시를 맡아 달라고 제안했습니다.\n\n이 제안을 받아들이면 이 지역에서 우리의 영향력과 정보력이 증대될 것입니다."
 arme.17.a: "물론이지!"
 arme.17.b: "미안하지만 거절한다."
 ARM_fsb_borderguards: "FSB 국경 경비대"
 arme.18.t: "[SOV.GetNameWithFlag], 동의!"
 arme.18.d: "러시아 FSB 국경 부대가 우리의 모든 지역에 파견될 것입니다."
 arme.18.a: "좋다."
 arme.19.t: "[SOV.GetNameWithFlag], 거절!"
 arme.19.d: "러시아는 우리 국경에 러시아 FSB 부대를 주둔시키자는 우리의 제안을 거절했습니다."
 arme.19.a: "아 진짜."
 ARM_expand_russian_base_time: "러시아군과의 훈련"
 ARM_expand_russian_base_time_desc: "우리나라에 러시아 군사 기지가 있으므로, 함께 합동 군사 훈련을 실시할 수 있습니다."
 ARM_remove_fsb_borderguards: "[SOV.GetNameWithFlag]의 FSB 국경 경비대 철수"
 fsb_deployed: "FSB가 [ARM.GetNameWithFlag]에 배치되었습니다"
 arme.20.t: "[ARM.GetNameWithFlag], 러시아 문화 홍보를 제안!"
 arme.20.d: "고대 루시 시절부터 아르메니아와 러시아의 문화 교류는 양국 문화를 크게 풍요롭게 했습니다. 러시아 제국과 소련을 거치며 역사를 공유한 아르메니아는 거래를 제안했습니다. 서방의 영향력에 맞서 러시아 문화를 홍보하기 위해 우리의 문화 센터를 자국에 유치하겠다는 것입니다. 그 대가로 이 센터들의 설립 자금을 우리가 지원해 달라고 요청합니다."
 arme.20.a: "다욤 도브로!"
 arme.20.b: "문화 홍보는 쓸모없다고 본다."
 arme.21.t: "[SOV.GetNameWithFlag], 동의!"
 arme.21.d: "러시아가 아르메니아의 러시아 문화 센터에 자금을 지원하기로 동의했습니다."
 arme.21.a: "훌륭하다!"
 arme.22.t: "[SOV.GetNameWithFlag], 거절!"
 arme.22.d: "러시아는 아르메니아에 러시아 문화 센터를 열자는 우리의 제안을 거절했습니다. 그들은 그러한 노력이 쓸모없다고 본다고 합니다."
 arme.22.a: "이상한 사람들이군. 어쩌면 우리에게 그들의 문화 센터는 애초에 필요 없었는지도 모른다."
 ARM_educational_cooperation: "러시아와의 교육 협력"
 ARM_educational_cooperation_desc: "러시아가 우리와 학생 교환 프로그램을 시작하도록 설득해 볼 수 있습니다."
 ARM_rusarm_educ_coop: "아르메니아-러시아 교육 협정"
 arme.23.t: "[ARM.GetNameWithFlag], 교육 협정 제안!"
 arme.23.d: "아르메니아가 최근 양국 대학 간에 학생을 교환할 수 있는 교육 협력 협정을 제안해 왔습니다. 아르메니아 대학들이 서구 교육과 많은 연계를 갖고 있음을 고려하면, 우리 학생들이 이를 통해 많은 도움을 받을 수 있습니다."
 arme.23.a: "좋소!"
 arme.23.b: "이것은 아르메니아의 음모다!"
 arme.24.t: "[SOV.GetNameWithFlag], 동의!"
 arme.24.d: "러시아가 우리의 학생 교환 제안에 동의했으며, 곧 서류에 서명할 것입니다."
 arme.24.a: "훌륭하다!"
 arme.25.t: "[SOV.GetNameWithFlag], 거절!"
 arme.25.d: "러시아는 우리의 제안을 서구의 영향으로 러시아 청년을 타락시키려는 음흉한 수법으로 보고 거절했습니다."
 arme.25.a: "무, 무슨?"
 mgu_unlock: "§Y모스크바 국립대학교와의 협력§!을 선택할 수 있게 됩니다!"
 ARM_russian_tv_channels: "러시아 TV 채널"
 ARM_russian_tv_channels_desc: "러시아 TV 채널을 아르메니아 시장에 허용할 수 있습니다. 그렇습니다, 우리에 대한 러시아의 영향력은 커지겠지만 이득이 훨씬 더 클 수도 있습니다."
 ARM_rus_diaspora_strength: "디아스포라 연계"
 ARM_rus_diaspora_strength_desc: "아르메니아 디아스포라와 연결을 시도하고 그들의 기부를 받아들일 수 있습니다."
 ARM_ratify_iran_pipeline: "시우니크 파이프라인 비준"
 ARM_ratify_iran_pipeline_desc: "이란에 남쪽 국경을 통과하는 가스 파이프라인 협정을 제안해 볼 수 있습니다. 우리는 에너지를 가스와 교환할 것입니다."
 arme.26.t: "[ARM.GetNameWithFlag], 가스 협정 제안!"
 arme.26.d: "아르메니아가 이란에서 아르메니아까지 가스 파이프라인을 건설하는 협정을 제안해 왔습니다. 이란에서 아르메니아로 공급되는 가스는 우리가 북부 지역에서 몹시 부족한 전력과 교환될 것입니다.\n\n파이프라인 비용은 우리와 아르메니아가 나누어 부담합니다. 상당히 좋은 협정입니다. 동의해야 할까요?"
 arme.26.a: "동의한다!"
 arme.26.b: "미안하지만 거절한다."
 arme.27.t: "[PER.GetNameWithFlag], 거절!"
 arme.27.d: "이란이 우리의 제안을 거절했습니다. 그들은 우리의 제안을 자국 주권을 훼손하는 일종의 시오니스트 음모로 보고 있습니다."
 arme.27.a: "제정신인가?"
 arme.28.t: "[PER.GetNameWithFlag], 동의!"
 arme.28.d: "이란이 우리의 제안에 동의했으며 파이프라인을 건설할 준비가 되었습니다. 이제 우리는 우리 몫의 비용을 지불하고 건설 작업 조율을 시작해야 합니다."
 arme.28.a: "훌륭하다!"
 ARM_syunik_pipeline: "이란-아르메니아 가스 파이프라인"
 ARM_syunik_pipeline_two: "이란-아르메니아 가스 파이프라인"
 gas_two_tt: "§Y시우니크§!에서 §G화석 연료 2§!를 얻습니다"
 gas_two_per_tt: "§Y아르메니아§!에 §G화석 연료 2§!를 제공합니다"
 gas_four_tt: "§Y시우니크§!에서 §G화석 연료 4§!를 얻습니다"
 gas_four_per_tt: "§Y아르메니아§!에 §G화석 연료 4§!를 제공합니다"
 ARM_arm_electr_deal: "아르메니아 전력 공급"
 ARM_arm_electr_deal_two: "아르메니아 전력 공급"
 arme.29.t: "[PER.GetNameWithFlag]-[ARM.GetNameWithFlag] 가스 협정!"
 arme.29.d: "최근 아르메니아와 이란의 지도자들이 아르메니아의 시우니크 주에서 만나 새 파이프라인의 성대한 개통을 기념했습니다."
 arme.29.a: "훌륭하군!"
 per_gas_accepted: "[PER.GetNameWithFlag]이(가) 파이프라인 협정을 승인했습니다"
 ARM_expand_pipeline: "[PER.GetNameWithFlag]와(과) 파이프라인 확장"
 ARM_cancel_pipeline: "[PER.GetNameWithFlag]와(과) 파이프라인 §R취소§!"
 arme.30.t: "[ARM.GetNameWithFlag]의 가스 협정 확대!"
 arme.30.d: "아르메니아는 물물교환 협정을 확대하여 더 많은 가스를 받는 대가로 더 많은 전력을 우리에게 제공하기로 결정했습니다."
 arme.30.a: "좋군!"
 ARM_eaeu_integrat: "유라시아 경제 연합 통합"
 ARM_eaeu_integrat_desc: "우리에 대한 러시아의 경제적 압박은 무시하기에는 너무 큽니다. 올바른 협정에 서명한다면 이를 매우 유익한 기회로 바꿀 수 있습니다."
 ARM_undermine_russian_influence: "러시아 영향력 약화"
 ARM_undermine_russian_influence_desc: "러시아인들은 너무 오랫동안 우리나라에 영향력을 행사해 왔습니다. 우리나라에서 그들의 영향력을 몰아내야 합니다."
 arme.31.t: "[PER.GetNameWithFlag]-[ARM.GetNameWithFlag] 가스 협정 취소!"
 arme.31.d: "아르메니아와 이란 사이의 가스 협정이 취소되었으며 파이프라인은 폐쇄되었습니다."
 arme.31.a: "알겠다."
 arme.32.t: "[ARM.GetNameWithFlag]의 [SOV.GetNameWithFlag] 영향력 약화!"
 arme.32.d: "최근 아르메니아는 자국 내 영향력 있는 러시아 문화원들을 여럿 폐쇄하기 시작했으며 러시아 국영 언론을 금지했습니다."
 arme.32.a: "개자식들!"
 ARM_support_russian_opposition: "러시아 야권 지원"
 ARM_support_russian_opposition_desc: "러시아를 약화시키기 위해 아르메니아에서 자금을 지원하여 러시아 야권 지도자들을 지원해야 합니다."
 arme.33.t: "[ARM.GetNameWithFlag]의 우리 야권 지원!"
 arme.33.d: "최근 아르메니아 정부는 러시아 야권을 지지한다고 발표하고, 탄압받을 수 있는 모든 이들을 아르메니아로 초청했습니다. 아르메니아 정부가 왜 이러한 입장을 취했는지는 알려지지 않았으나, 최근 예레반과 모스크바 사이의 관계 냉각의 영향을 받았음은 분명합니다."
 arme.33.a: "감히 어떻게!"
 arme.34.t: "러시아 군사기지 문제"
 arme.34.d: "러시아와의 관계가 악화된 지금, 우리나라에서 러시아군을 철수시키는 문제가 대두되었습니다. 한편으로는 그들을 그냥 쫓아낼 수 있고, 다른 한편으로는 이 군사기지를 통해 러시아에 영향력을 행사해 볼 수도 있습니다. 어떻게 진행해야 합니까?"
 arme.34.a: "그들은 최대한 빨리 떠나야 한다!"
 arme.34.b: "쓸모가 있을지도 모른다... 당분간은."
 ARM_question_military_base: "러시아 군사기지 재검토"
 ARM_question_military_base_desc: "이제 아르메니아에 있는 러시아 군사기지를 어떻게 할지 생각해야 합니다."
 ARM_freeze_csto_membership: "CSTO 회원 자격 동결"
 ARM_freeze_csto_membership_desc: "CSTO는 아제르바이잔에 맞서 우리를 도우려 하지 않으므로 우리에게 쓸모가 없습니다. 이 기구를 어떻게 할지 결정해야 합니다."
 ARM_investigate_prorus_offic: "친러시아 관료 조사"
 ARM_investigate_prorus_offic_desc: "많은 정치인과 관료들이 러시아의 이익을 증진하는 데 열성적입니다. 이들을 조사하여 충성의 깊이를 파악해야 합니다."
 ARM_polish_cherries: "폴란드산 체리"
 ARM_polish_cherries_desc: "폴란드는 농산물로 유명합니다. 소규모 구매부터 시작하여 폴란드와 사업 관계를 맺는 것이 어떻겠습니까?"
 ARM_polish_mil_coop: "폴란드와의 군사 협력"
 ARM_polish_mil_coop_desc: "폴란드는 우리에게 좋은 무기 공급국이 될 수 있으며, 우리는 그들과 무기 공급 계약을 체결하고자 합니다."
 ARM_arm_pol_friend: "폴란드와의 동반자 관계"
 ARM_arm_pol_friend_desc: "폴란드 동료들과의 동반자 관계를 새로운 수준으로 발전시키고자 합니다."
 ARM_polish_fleet_help: "폴란드에 함대 지원 요청"
 ARM_polish_fleet_help_desc: "폴란드가 제1 아르메니아 공화국과 체결했던 최초의 조약을 상기하며, 우리 함대 발전을 위해 폴란드 전문가들을 유치하고자 합니다."
 ARM_our_common_heritage: "우리의 공동 유산"
 ARM_our_common_heritage_desc: "폴란드군이 튜턴 기사단을 격파한 그룬발트 전투는 아르메니아인들의 참여 없이는 이루어지지 않았습니다. 우리는 당시 폴란드를 도왔으니, 그들에게 그 시절의 영광스러운 유산을 함께 기억하자고 청해 보는 것이 어떻겠습니까?"
 ARM_military_coop_greece: "그리스와의 군사 협력"
 ARM_military_coop_greece_desc: "그리스에 군사 협력을 확대하고 여러 차례의 합동 훈련을 실시할 것을 제안하고자 합니다."
 arme.38.t: "조사 결과"
 arme.38.d: "우리 국가안보국은 모든 친러시아 정치인을 조사하여 이들과 러시아 정부의 연결 고리를 찾아냈습니다. 그러나 부패 구조는 발견되지 않았습니다."
 arme.38.a: "흥미롭군."
 arme.39.t: "조사 결과"
 arme.39.d: "우리 국가안보국은 모든 친러시아 정치인을 조사하여 이들과 러시아 정부의 연결 고리를 찾아냈습니다. 부패 구조 또한 기밀 해제되었고 이들의 활동은 중단되었습니다."
 arme.39.a: "훌륭하군!"
 ARM_sign_rome_statute: "로마 규정 서명"
 ARM_sign_rome_statute_desc: "로마 규정에 서명하면 우리 지역 안팎에서 러시아의 침략에 맞설 수단이 더 늘어날 수 있습니다."
 ARM_cleanse_russian_agents: "러시아 공작원 체포"
 ARM_cleanse_russian_agents_desc: "러시아의 이익을 위해 공공연히 활동하며 굴종적인 정책을 조장하는 모든 정치인을 체포하고 활동을 금지해야 합니다!"
 ARM_demand_contr_reassur: "계약 이행 요구"
 ARM_demand_contr_reassur_desc: "러시아에 대한 우리의 영향력이 커지고 있으니, 우리의 무기 계약을 이행하도록 요구해야 합니다."
 arme.40.t: "[ARM.GetNameWithFlag]의 계약 이행 요구"
 arme.40.d: "우리나라에 대한 영향력을 확대한 아르메니아 정부는, 우리와의 관계가 악화된 뒤 이행을 중단했던 일부 무기 계약을 이행할 것을 요구하고 있습니다. 그러나 계약을 이행하면 우리에 대한 그들의 영향력이 크게 줄어들 것입니다."
 arme.40.a: "꺼져라!"
 ARM_northern_neighbor: "북쪽 이웃"
 ARM_northern_neighbor_desc: "가장 적대적이지 않은 북쪽 이웃을 처리해야 합니다. 외교적으로든, 아니면 다른 방법으로든 말입니다."
 ARM_open_up_djavakhq_quest: "자바헤티 문제 제기"
 ARM_open_up_djavakhq_quest_desc: "조지아에 있는 우리 동포들이 북쪽 파트너들에게 억압받고 있습니다. 그들을 조지아로부터 해방시킬 때가 왔습니다!"
 ARM_support_separatism: "분리주의 지원"
 ARM_support_separatism_desc: "조지아의 분리주의를 지원하고 군사적 수단으로 자바헤티의 자유를 증진해야 합니다!"
 ARM_protect_minority_rights: "소수민족 권리 보호"
 ARM_protect_minority_rights_desc: "조지아인 친구들은 자국 내 아르메니아인들에게 너무 가혹합니다. 분쟁을 일으켜서는 안 되며, 외교적 수단으로 조지아에 영향력을 행사해야 합니다."
 ARM_friendship_and_trade_agreement: "우호 통상 협정"
 ARM_friendship_and_trade_agreement_desc: "조지아와 자바헤티의 아르메니아인들을 둘러싼 몇 가지 문제가 있지만, 이를 평화적으로 협상하여 두 나라가 함께 번영할 수 있습니다."
 ARM_demand_representation: "대표권 요구"
 ARM_demand_representation_desc: "우리는 조지아의 영토 보전을 존중합니다. 그러나 조지아의 비민주적 체제와, 조지아가 정치 체제에서 아르메니아인 공동체를 배척하는 모습을 가만히 지켜볼 수는 없습니다!"
 ARM_black_sea_agreements: "흑해 협정"
 ARM_black_sea_agreements_desc: "흑해를 통한 무역은 막대하며, 양자 무역과 해상 접근에 관한 협정을 체결하는 것은 양국 모두에게 이로울 수 있습니다."
 ARM_electro_exporting: "전력 수출"
 ARM_electro_exporting_desc: "우리의 전력 수출 능력은 수출을 확대하기에 충분합니다. 조지아와 협정을 맺는다면 유익할 수 있습니다."
 ARM_javakhq_must_be_free: "\\"쓰러진 십자가\\" 작전"
 ARM_javakhq_must_be_free_desc: "제국주의적인 조지아인들은 너무 오랫동안 우리의 땅과 사람들을 착취했습니다! 이제 군사 작전을 수행하여 우리 동포를 해방시켜야 합니다!"
 ARM_support_geo_peace: "조지아 평화 지원"
 ARM_support_geo_peace_desc: "양국 간의 신뢰를 증진하기 위해, 분리주의 공화국들과 조지아 사이의 협정을 중재하여 이 무의미한 분쟁을 끝내도록 노력할 수 있습니다."
 ARM_friendship_syria: "시리아와의 우호"
 ARM_friendship_syria_desc: "시리아와 정치적 견해 차이가 있을 수 있음에도, 알라위파 공동체는 이 지역의 아르메니아인들을 언제나 지지해 왔으므로 우리는 관계를 심화시켜야 합니다."
 ARM_alaw_assyr_armen: "알라위파-아르메니아-아시리아 연대"
 ARM_alaw_assyr_armen_desc: "알라위파, 아르메니아인, 아시리아인 세 집단은 시리아의 비무슬림 소수 집단입니다. 우리 공동체가 살아남으려면 협력하고 서로를 지원해야 합니다."
 ARM_rescuing_diasp: "디아스포라 구출"
 ARM_rescuing_diasp_desc: "시리아의 정세는 상당히 불안하며, 우리는 동포들이 아르메니아로 귀환하여 우리 사회에 통합되도록 도와야 합니다."
 ARM_human_aid_syr: "시리아 인도적 지원"
 ARM_human_aid_syr_desc: "시리아 국민은 도움이 절실합니다. 시리아에 인도적 지원을 제공하고 그들에 대한 영향력을 확대해야 합니다."
 ARM_intervene_in_syria: "시리아 개입"
 ARM_intervene_in_syria_desc: "시리아의 전쟁을 돕기 위해 우리 군을 파견해야 합니다!"
 arme.41.t: "자바헤티 아르메니아인들의 대표권 요구!"
 arme.41.d: "삼츠헤-자바헤티의 아르메니아인들이 우리 의회에서의 대표권을 요구하며 조지아 내에서 더 확대된 자치를 원하고 있습니다. 그들은 자신들의 시위가 남오세티야 및 압하지야와는 무관하며 조국 내에서 무력 충돌을 원하지 않는다고 분명히 밝혔습니다.\n\n아르메니아 정부 자체도 이들의 요구를 지지했으며, 정세의 안정을 촉구하고 아르메니아인들에게 무장 봉기를 일으키지 말라고 호소했습니다.\n\n아르메니아 정부는 또한 우리가 국가를 연방화한다면 러시아의 영향력을 우회하여 디아스포라 연결망을 통해 남오세티야와 압하지야를 통합하도록 돕겠다고 밝혔습니다."
 arme.41.a: "정당한 요구다!"
 arme.41.b: "감당할 수 없다!"
 arme.42.t: "연방화!"
 arme.42.d: "이걸 왜 읽고 있나, 이 꼬마 사기꾼아?"
 arme.42.a: "자에붐바?"
 djavakhq_pizdec: "[GEO.GetNameWithFlag]이(가) 평화적 해결을 거부했습니다"
 arme.44.t: "[GEO.GetNameWithFlag]의 연방화 거부!"
 arme.44.d: "조지아는 연방화를 거부했으며 자바헤티에 자치를 부여하지 않을 것입니다."
 arme.44.a: "유감이군!"
 geofed_arm_tt: "[GEO.GetNameWithFlag]이(가) 연방화하여 [ARM.GetFlag]§9자바헤티§!에 자치를 부여할 수 있습니다"
 ARM_djavakhq: "자바헤티 자치"
 arme.45.t: "[ARM.GetNameWithFlag]의 분쟁 해결 제안!"
 arme.45.d: "최근 아르메니아 정부는 우리와 조지아의 분쟁을 중재하기로 결정했습니다. 아르메니아는 우리 [ROOT.GetNameWithFlag]이(가) 완전한 자치를 얻고, 원한다면 분리 독립할 수 있는 권리를 갖는 해결책을 제안합니다. 그들은 최근의 자바헤티 자치 지역 사례와 그것이 얼마나 효율적으로 해결되었는지를 지적합니다. 아르메니아는 또한 조지아가 우리의 자치를 박탈하지 않도록 보장할 것입니다. 동의하시겠습니까?"
 arme.45.a: "물론이지!"
 arme.45.b: "우리의 주권을 포기하지 않겠다!"
 arme.46.t: "[FROM.GetNameWithFlag]의 연방화 수락!"
 arme.46.d: "[FROM.GetNameWithFlag]은(는) 조지아와의 연방화에 관한 아르메니아의 해결책을 승인하여 이제 조지아 국가의 일부가 되었습니다."
 arme.46.a: "훌륭하군!"
 arme.46.b: "좋군!"
 arme.47.t: "[FROM.GetNameWithFlag]의 연방화 거부!"
 arme.47.d: "[FROM.GetNameWithFlag]은(는) 우리의 해결안 제안을 거절했습니다."
 arme.47.a: "매우 유감이다."
 arme.48.t: "[ARM.GetNameWithFlag]의 삼츠헤-자바헤티 영유권 주장!"
 arme.48.d: "최근 [ARM.GetNameWithFlag]의 정부는 조지아 내 아르메니아인에 대한 억압이 당장 중단되어야 한다고 선언했습니다.\n\n우리 관리들과 일부 친조지아 성향의 현지 아르메니아인 인사들은 억압이 있었다는 주장을 모두 부인하고 있으나, 아르메니아는 이미 조지아-아르메니아 국경에 병력을 집결시키기 시작했습니다."
 arme.48.a: "개자식들!"
 arme.49.t: "[ARM.GetNameWithFlag] - [GEO.GetNameWithFlag] 전쟁!"
 arme.49.d: "아르메니아가 최근 조지아에 전쟁을 선포했습니다. 이것은 조지아라는 골리앗을 완전히 쓰러뜨릴 역사적인 기회일지도 모릅니다!"
 arme.49.a: "우리도 참전한다!"
 arme.49.b: "너무 위험하다..."
 ARM_amenia_georgia_trade: "[ARM.GetNameWithFlag] - [GEO.GetNameWithFlag] 무역 협정"
 arme.50.a: "물론이지!"
 arme.50.b: "관심 없다."
 arme.52.b: "외교적 노력을 계속하자."
 arme.54.t: "[GEO.GetNameWithFlag]의 수락!"
 arme.54.d: "[GEO.GetNameWithFlag]은(는) 우리에게 흑해 항구 접근권을 제공하자는 외교적 제안을 승인했습니다."
 arme.54.a: "훌륭하군!"
 arme.55.t: "[GEO.GetNameWithFlag]의 거절!"
 arme.55.d: "[GEO.GetNameWithFlag]은(는) 우리의 우호 통상 제안을 거절했습니다."
 arme.55.a: "이런"
 arme.55.b: "외교적 노력을 계속해야 한다!"
 arme.56.t: "[ARM.GetNameWithFlag]의 전력 수출 협정 제안!"
 arme.56.d: "최근 아르메니아가 우리에게 전력 수출 협정을 제안했습니다. 이 협정에 따라 그들은 수 년 동안 적정한 가격에 우리에게 전력을 제공할 것입니다. 동의하시겠습니까?"
 arme.56.a: "물론이지!"
 arme.56.b: "미안하지만 사양한다."
 arme.57.t: "[ARM.GetNameWithFlag]의 무기 구매 희망"
 arme.57.d: "[ARM.GetName]은(는) 우리와의 군사 협력 강화와 자국 군대 강화의 일환으로 우리 무기 일부를 구매하고 싶다는 의사를 밝혔습니다. 동의하시겠습니까?"
 arme.57.a: "물론이지!"
 arme.57.b: "미안하지만 사양한다."
 arme.58.t: "[POL.GetNameWithFlag]와(과)의 군사 계약"
 arme.58.d: "그들은 양국 간 군사 협력의 일환으로 우리에게 무기를 판매하기로 합의했습니다. 이는 우리 군대를 크게 강화할 수 있게 해 주므로 매우 고무적입니다."
 arme.58.a: "좋다"
 arme.59.t: "[POL.GetNameWithFlag]와(과)의 군사 계약"
 arme.59.d: "그들은 우리에게 무기를 공급하는 계약 체결을 거부했습니다. 아마도 자신들의 무기가 우리 손에 들어가면 힘의 균형이 깨질 것이라 여기는 모양입니다? 어리석군."
 arme.59.a: "유감이다"
 arme.60.t: "[ARM.GetNameWithFlag]의 관계 개선 노력"
 arme.60.d: "아르메니아 정부는 양국 간 외교 관계를 심화시키기로 확고히 결심한 듯하며, 우리를 초청하여 우호 협력 협정에 서명하고자 합니다. 동의하시겠습니까?"
 arme.60.a: "물론이지!"
 arme.60.b: "미안하지만 사양한다."
 arme.61.t: "[POL.GetNameWithFlag]와(과)의 동반자 관계"
 arme.61.d: "폴란드 정부는 양국 간 동반자 및 우호 협정을 승인했습니다. 점점 더 많은 나라가 우리의 동반자가 되고 있으니 이는 의심할 여지 없이 고무적입니다!"
 arme.61.a: "좋군"
 arme.62.t: "[POL.GetNameWithFlag]와(과)의 동반자 관계"
 arme.62.d: "폴란드 정부는 우리에게 우호 협력 조약을 거부했습니다. 우리는 언제나 양국 간 협력에 중점을 두어 왔기에 당연히 안타까운 일입니다."
 arme.62.a: "유감이다"
 arme.63.t: "[ARM.GetNameWithFlag]의 함대 발전 지원 요청"
 arme.63.d: "아르메니아 정부는 제1 아르메니아 공화국 시기에 체결된 협정을 언급하며, 아르메니아가 다시 바다에 접근할 수 있게 되었으므로 함대 발전을 위한 우리 정부의 지원을 요청하고 있습니다. 동의하시겠습니까?"
 arme.63.a: "물론이지!"
 arme.63.b: "미안하지만 사양한다."
 arme.64.t: "[POL.GetFlag]폴란드의 함대 발전 지원"
 arme.64.d: "폴란드 정부는 우리의 함대 발전을 돕기로 합의했으며, 이제 우리 해군력이 강화될 것입니다."
 arme.64.a: "좋군!"
 arme.65.t: "[POL.GetFlag]폴란드의 함대 발전 지원"
 arme.65.d: "폴란드 정부는 재정적으로 불가능하다는 이유를 들어 우리 해군력 발전 지원을 거부했습니다."
 arme.65.a: "유감이다"
 arme.66.t: "[ARM.GetNameWithFlag]의 그룬발트 기억 요청"
 arme.66.d: "그룬발트 전투는 튜턴 기사단과 그 동맹군이 폴란드군에 완패한 폴란드 역사상의 역사적 사건입니다. 역사학자들은 이 전투에 폴란드군 편에서 아르메니아인들이 참여했음을 확인해 주기도 합니다. 이는 독일 측을 크게 분노하게 할 것입니다. 동의하시겠습니까?"
 arme.66.a: "자랑스러워할 일이다."
 arme.66.b: "미안하지만 사양한다."
 arme.67.t: "그룬발트 전투의 폴란드-아르메니아 유산"
 arme.67.d: "폴란드 정부는 이 역사적 사건을 우리 두 민족의 기억 속에 자긍심의 근거로 보존하고자 하는 우리의 바람을 지지했습니다."
 arme.67.a: "좋다"
 arme.68.t: "그룬발트 전투의 폴란드-아르메니아 유산"
 arme.68.d: "폴란드 정부는 그 시절 사건의 역사를 부각하려는 우리의 바람을 지지하지 않았습니다. 아마도 독일의 군홧발이 두려운 모양입니다!"
 arme.68.a: "유감이다"
 arme.69.t: "폴란드산 체리"
 arme.69.d: "모든 동반자 관계는 작은 걸음에서 시작됩니다. 우리와 폴란드의 관계는 우리 시장에 나온 폴란드산 베리에서 시작되었습니다. 어쩌면 여기서부터 더 큰 무언가를 쌓아 올릴 수 있을 것입니다."
 arme.69.a: "그러길 바란다"
 arme.70.t: "[ARM.GetNameWithFlag]의 합동 훈련 제안"
 arme.70.d: "아르메니아는 우리와 군사기술 협력을 확대하고자 하며, 경험을 공유하기 위해 양국 특수작전군의 합동 훈련을 실시하자고 제안합니다."
 arme.70.a: "동의한다"
 arme.70.b: "아니요"
 arme.71.t: "그리스와의 합동 훈련"
 arme.71.d: "그리스 정부가 우리의 제안을 수락하여 양국 특수작전군의 합동 훈련을 실시했습니다."
 arme.71.a: "우리는 함께할 때 더 강하다."
 arme.72.t: "그리스와의 합동 훈련"
 arme.72.d: "그리스 정부는 우리 특수작전군과의 합동 훈련 실시를 거부했습니다."
 arme.72.a: "이유가 있을 것이다."
 ARM_legacy_of_grunwald_idea: "그룬발트 전투의 유산"
 ARM_anti_turkish_idea: "반튀르키예 외교"
 ARM_amenia_georgia_electro: "[ARM.GetNameWithFlag]의 전력 수입"
 ARM_amenia_georgia_electro_agre: "[GEO.GetNameWithFlag]에 대한 전력 수출"
 arme.74.t: "[GEO.GetNameWithFlag]의 동의!"
 arme.74.d: "조지아가 우리의 전력 수출 제안에 동의하여, 이제 전력 수송에 필요한 모든 기반시설을 구축하고 있습니다."
 arme.74.a: "좋군!"
 arme.75.t: "[GEO.GetNameWithFlag]의 거부!"
 arme.75.d: "조지아는 우리의 전력 수출 제안이 자국 전력 생산 산업에 해롭다고 봅니다. 따라서 그들은 자국에 우리 전력이 들어오는 것을 원하지 않습니다."
 arme.75.a: "정신 나갔군"
 ARM_bilat_trade_agreement: "양자 무역 협정"
 ARM_bilat_trade_agreement_desc: "아르메니아와 이란 간의 무역에는 큰 잠재력이 있습니다. 양국 간 무역에 장애물이 없는 여건을 조성해야 합니다."
 ARM_memorandum_of_understanding: "양해각서"
 ARM_memorandum_of_understanding_desc: "이란과 아르메니아의 국영 언론은 양국에 대한 공동의 적들의 허위 정보에 맞서 싸우기 위한 양해 및 조율 각서에 서명해야 합니다."
 ARM_amenia_iran_memo: "[ARM.GetNameWithFlag] - [PER.GetNameWithFlag] 양해각서"
 arme.76.t: "[ARM.GetNameWithFlag]-[PER.GetNameWithFlag] 양해각서!"
 arme.76.d: "최근 아르메니아 정부 언론 매체들이 우리에게 상호 이익이 되는 협정을 제안해 왔습니다. 그들은 이란과 아르메니아의 언론이 공동의 적들이 퍼뜨리는 양국에 대한 허위 정보에 함께 맞서 싸우도록 하는 각서에 서명하자고 제안합니다. 이 제안에 동의하시겠습니까?"
 arme.76.a: "물론이지!"
 arme.76.b: "관심 없다"
 arme.77.t: "[PER.GetNameWithFlag]의 동의!"
 arme.77.d: "이란은 이란과 아르메니아의 언론이 공동의 적들이 퍼뜨리는 양국에 대한 허위 정보에 함께 맞서 싸우도록 하는 각서를 체결하자는 우리의 제안에 동의했습니다."
 arme.77.a: "좋군!"
 arme.78.t: "[PER.GetNameWithFlag]의 거부!"
 arme.78.d: "이란은 우리가 제안한 각서에 서명할 실익을 찾지 못했습니다."
 arme.78.a: "이상하군"
 arme.80.t: "[ARM.GetNameWithFlag]와(과)의 정치 협력"
 arme.80.d: "아르메니아는 우리의 동반자이며 정신적으로 가장 가까운 나라 중 하나입니다. 우리는 공동의 유산을 공유하고 있으며, 아르메니아가 협력 확대를 희망한다는 의사를 밝힌 것은 놀랍지 않습니다."
 arme.80.a: "우리는 친구다!"
 arme.80.b: "관심 없다"
 arme.81.t: "[GRE.GetNameWithFlag]와(과)의 정치 협력"
 arme.81.d: "그리스가 정치 분야에서 우리와 협력할 의사를 밝혔으며, 우리 두 나라가 함께라면 많은 것을 이룰 수 있습니다!"
 arme.81.a: "좋군"
 arme.82.t: "[GRE.GetNameWithFlag]와(과)의 정치 협력"
 arme.82.d: "그리스는 우리와 정치 협력을 확대할 준비가 되어 있지 않으며, 그 필요성을 느끼지 못합니다"
 arme.82.a: "유감이다"
 arme.83.t: "공동 반튀르키예 정책"
 arme.83.d: "튀르키예는 아르메니아와 우리 모두에게 동등한 위협입니다. 아르메니아는 튀르키예 정부에 그들의 분수를 보여 주기 위해 공동 반튀르키예 정책을 추진하자고 제안합니다."
 arme.83.a: "튀르키예는 우리를 두려워해야 한다"
 arme.83.b: "관심 없다"
 arme.84.t: "공동 반튀르키예 정책"
 arme.84.d: "그리스 정부가 우리의 반튀르키예 정치 구상을 지지했으며, 우리는 튀르키예의 영향력에 맞서 싸울 것입니다."
 arme.84.a: "좋군"
 arme.85.t: "공동 반튀르키예 정책"
 arme.85.d: "그리스 정부는 우리의 반튀르키예 구상을 지지하지 않기로 결정했으며, 이는 우리에게 실망을 안겼습니다."
 arme.85.a: "유감이다"
 arme.86.t: "[ARM.GetNameWithFlag]와(과)의 동반자 관계"
 arme.86.d: "아르메니아는 EU 협력의 틀 안에서 우리와의 동반자 관계를 확대하고자 합니다. 그들은 우리를 유럽 연합 전체로 가는 관문으로 보고 있습니다."
 arme.86.a: "우리는 친구다!"
 arme.86.b: "관심 없다"
 arme.87.t: "[GRE.GetNameWithFlag]와(과)의 정치 협력"
 arme.87.d: "그리스는 우리의 정치 협력을 확대할 준비가 되어 있으며, 유럽 연합과의 접촉을 수립하는 데 도울 준비도 되어 있습니다."
 arme.87.a: "좋군"
 arme.88.t: "키프로스 분쟁 지원"
 arme.88.d: "아르메니아 정부는 키프로스에서 우리의 이익을 지키려는 노력을 지지하며, 이 싸움에서 최대한의 지원을 제공할 준비가 되어 있습니다. 판돈을 올리고 아르메니아를 이 문제에 끌어들일 준비가 되었습니까?"
 arme.88.a: "그렇다"
 arme.88.b: "관심 없다"
 arme.89.t: "키프로스 분쟁 지원"
 arme.89.d: "그리스 정부는 키프로스 문제에 대한 우리의 지원 제안에 큰 기쁨을 표했으며, 우리가 필요한 모든 수단을 동원해 그들을 도울 수 있다고 분명히 암시했습니다."
 arme.89.a: "좋군"
 arme.90.t: "키프로스 분쟁 지원"
 arme.90.d: "그리스 정부는 우리의 제안을 거절하고 키프로스 문제에서 손을 떼라고 경고했습니다. 그들은 문제 해결을 바라는 것보다 사태 확대를 더 두려워하는 듯합니다."
 arme.90.a: "유감이다"
 arme.91.t: "키프로스에서 우리를 지원하는 아르메니아"
 arme.91.d: "아르메니아 특수 기관들이 키프로스에서 우리 문제를 해결하는 데 적극적으로 협조하고 있으며, 섬에서의 우리 영향력을 키우는 것을 돕고 있습니다."
 arme.91.a: "좋군"
 ARM_mithridates_legacy: "미트리다테스의 유산"
 ARM_mithridates_legacy_desc: "고대부터 아르메니아인과 그리스인은 언제나 공동의 가치, 혈맹, 그리고 공동의 적을 공유해 왔습니다. 폰토스의 미트리다테스가 남긴 유산의 전통에 따라, 우리는 형제 같은 두 민족의 우정을 이어 가야 합니다."
 ARM_reassuring_comp_agre: "포괄 협정"
 ARM_reassuring_comp_agre_desc: "그리스와 포괄적 우호 협정에 서명하여 마침내 양국 관계를 정부 차원에서 공식화해야 합니다."
 ARM_anti_turk_diplo: "반튀르키예 외교"
 ARM_anti_turk_diplo_desc: "우리를 향한 튀르키예의 야욕에 맞서기 위해 그리스와 외교적 노력을 조율해야 합니다."
 ARM_our_friend_in_eu: "EU 내의 우리 친구"
 ARM_our_friend_in_eu_desc: "그리스는 유럽 연합 내에서 우리와 가장 가까운 동맹입니다. 이를 우리에게 유리하게 활용해야 합니다."
 ARM_support_cyprus: "키프로스 지원"
 ARM_support_cyprus_desc: "우리에게 아르차흐가 있듯이, 그리스에는 키프로스가 있습니다. 그곳에서도 튀르키예의 폭압적인 결정들이 존재합니다. 우리는 키프로스에서의 그리스의 대의를 지지해야 합니다."
 arme.79.t: "[ARM.GetNameWithFlag]의 댐 사업 제안!"
 arme.79.d: "최근 아르메니아 정부는 양국 국경 사이를 흐르는 아라스 강에 공동 수력 발전 댐 사업을 하자고 제안했습니다. 그들의 제안에 동의하시겠습니까?"
 arme.79.a: "물론이지, 동의한다!"
 arme.79.b: "아니, 관심 없다."
 arme.92.t: "[PER.GetNameWithFlag]의 동의!"
 arme.92.d: "이란은 시우니크 지역에 수력 발전 댐을 공동 건설하는 데 동의했습니다. 이미 그들 몫의 대금을 지불했습니다."
 arme.92.a: "좋군!"
 ARM_amenia_iran_dam_share: "시우니크 수력 발전 지분"
 idea_willcanc_if_rel_tt: "§Y이 국가 정신은 [ARM.GetNameWithFlag]와(과)의 관계가 악화되면 제거됩니다.§!"
 arme.93.t: "[PER.GetNameWithFlag]의 거부!"
 arme.93.d: "이란은 시우니크 지역에 수력 발전소를 건설하는 데 관심이 없습니다."
 arme.93.a: "매우 유감이다."
 ARM_arax_hydro_power: "아라스 수력 발전"
 ARM_arax_hydro_power_desc: "이란에 시우니크 지역의 아라스 강에 수력 발전소를 건설하자는 협정을 제안할 수 있습니다."
 ARM_export_weapons_iran: "이란에 무기 수출"
 ARM_export_weapons_iran_desc: "이란에 대한 외부의 압박으로 테헤란은 믿을 만한 무기 공급국이 부족해졌습니다. 그들은 합리적인 가격의 우리 무기를 구매하는 데 관심이 있을 수 있습니다."
 arme.94.t: "[ARM.GetNameWithFlag]의 무기 거래 제안!"
 arme.94.d: "최근 아르메니아 정부가 우리에게 군용 보병 무기 선적을 제안했습니다. 현재 상황을 고려한 합리적인 가격을 제시했습니다."
 arme.94.a: "물론이지, 동의한다!"
 arme.94.b: "관심 없다."
 arme.95.t: "[PER.GetNameWithFlag]의 동의!"
 arme.95.d: "이란이 우리 무기를 구매하는 데 동의했으며, 선적은 곧 완료될 것입니다."
 arme.95.a: "좋군!"
 arme.96.t: "[PER.GetNameWithFlag]의 거부!"
 arme.96.d: "이란은 어떤 이유에서인지 우리 무기를 구매하는 데 동의하지 않았습니다."
 arme.96.a: "매우 유감이다."
 ARM_free_trade_zone: "메그리 자유 무역 지대"
 ARM_third_power_transmission: "메그리 자유 경제 구역"
 ARM_third_power_transmission_desc: "이란과의 무역을 늘리기 위해 메그리에 자유 무역 지대를 설립해야 합니다."
 ARM_iranian_drone_deal: "이란산 드론 구매"
 ARM_iranian_drone_deal_desc: "이란산 드론은 현대전에서 효과적임이 입증되었습니다. 이를 확보하면 서방 대안에 드는 비용의 일부만으로 우리 군에 의미 있는 능력을 부여할 수 있습니다."
 arme.97.t: "[ARM.GetNameWithFlag]의 드론 구매 희망!"
 arme.97.d: "최근 아르메니아가 우리 드론 구매에 관심을 보였습니다. 그들의 제안에 동의하고 적정 금액을 받고 드론을 제공하시겠습니까?"
 arme.97.a: "물론이지!"
 arme.97.b: "미안하지만 사양한다."
 arme.98.t: "[PER.GetNameWithFlag]의 동의!"
 arme.98.d: "이란이 우리에게 드론 일부를 판매하는 데 동의했습니다. 곧 인도될 것입니다."
 arme.98.a: "좋군!"
 arme.99.t: "[PER.GetNameWithFlag]의 거부!"
 arme.99.d: "이란은 우리의 드론 구매 협정에 동의하지 않았습니다."
 arme.99.a: "음."
 ARM_covert_defense_agreement: "비밀 방위 협정"
 ARM_covert_defense_agreement_desc: "양국의 안보를 보장하기 위해 이란과 비밀리에 더 깊은 차원의 동맹을 맺어야 합니다."
 arme.100.t: "[ARM.GetNameWithFlag]의 비밀 방위 협정 제안!"
 arme.100.d: "최근 아르메니아가 양국 간 비밀 방위 협정을 제안했습니다. 그들은 우리가 그들의 독립을 보장하면 그들도 우리의 독립을 보장하겠다고 합니다. 동의하시겠습니까?"
 arme.100.a: "물론이지!"
 arme.100.b: "아니, 위험을 감수할 수 없다."
 arme.104.t: "반군 대대"
 arme.104.d: "우리의 봉기는 기세를 얻고 있으며, 이란의 점령에 맞서 우리의 자유를 지킬 준비가 된 대대 전체가 이미 편성되었습니다."
 arme.104.a: "쿠르디스탄의 자유를 위하여"
 arme.105.t: "아르메니아와의 무역 협정"
 arme.105.d: "아르메니아 정부는 EU 기구를 거치지 않고 우리와 무역 협정을 체결하고자 합니다. 그들은 유럽 관료제가 움직이기를 수 년 기다리는 것보다 직접 협력하는 편이 더 효과적이라고 믿습니다."
 arme.105.a: "동의한다"
 arme.105.b: "동의하지 않는다"
 arme.106.t: "아르메니아와의 경제 및 무역 협력 협정"
 arme.106.d: "아르메니아 정부는 우리나라와의 문화적, 경제적 유대를 확대하고자 합니다. 아르메니아는 이러한 분야에서 양국 간 협력을 목표로 하는 일련의 조약과 협정을 체결하자고 제안합니다."
 arme.106.a: "동의한다"
 arme.106.b: "동의하지 않는다"
 arme.107.t: "프랑스와의 무역 협정"
 arme.107.d: "프랑스 정부는 우리와 경제 및 문화 협력에 관한 일련의 협정을 체결하는 데 동의했습니다"
 arme.107.a: "좋군"
 arme.108.t: "프랑스와의 무역 협정"
 arme.108.d: "프랑스 정부는 문화 및 경제 분야에서 우리와의 협력 확대를 거부했습니다. 아마도 우리를 잠재적 동반자로 여기지 않는 모양입니다."
 arme.108.a: "유감이다"
 arme.109.t: "아르메니아와의 교육 협력 협정"
 arme.109.d: "아르메니아 정부는 우리 교육 기관과의 협력에 관심을 표했으며, 자국에 우리의 최고 대학들의 대표부가 설치되기를 바랍니다. 이는 아르메니아 청년들의 정신에 영향을 미칠 수 있는 절호의 기회입니다."
 arme.109.a: "동의한다"
 arme.109.b: "동의하지 않는다"
 arme.110.t: "프랑스와의 교육 협력 협정"
 arme.110.d: "프랑스 정부는 교육 분야에서 우리와 적극적으로 협력할 의지와 희망을 밝혔으며, 우리나라에 자국 고등 교육 기관의 대표부를 개설할 준비도 되어 있습니다."
 arme.110.a: "좋군"
 arme.111.t: "프랑스와의 교육 협력 협정"
 arme.111.d: "프랑스 정부는 우리의 교육 협력 제안을 거부했습니다. 그들은 이 분야에서 우리와 대화할 기분이 아닌 듯합니다."
 arme.111.a: "유감이다"
 arme.112.t: "아르메니아와의 군사 협력"
 arme.112.d: "아르메니아 정부는 우리에게 양국 간 군사 협력을 제안하고자 합니다. 아르메니아는 우리의 국제 임무 경험과 외인부대의 경험에 큰 관심을 갖고 있습니다."
 arme.112.a: "동의한다"
 arme.112.b: "동의하지 않는다"
 arme.113.t: "프랑스와의 군사 협력"
 arme.113.d: "프랑스 정부는 양국 군대 간의 협력, 특히 국제 임무 수행 경험과 외인부대의 일부 작전 경험을 얻는 데 협력하기로 동의했습니다."
 arme.113.a: "좋군"
 arme.114.t: "프랑스와의 군사 협력"
 arme.114.d: "프랑스 정부는 우리와의 군사 협력을 거부했습니다. 아마도 우리 군이 외국의 경험에서 배울 수 있는 수준이 아니라고 여기는 모양입니다."
 arme.114.a: "유감이다"
 arme.115.t: "프랑코포니 내의 아르메니아"
 arme.115.d: "아르메니아 정부는 오랫동안 프랑코포니의 일원이 되기를 바라 왔습니다. 이는 그들에게 그 이상의 의미가 있을 수 있는데, 우리도 시간이 지나면 그들을 프랑스 문화권에 완전히 편입시킬 수 있기 때문입니다. 아르메니아가 프랑코포니의 일원이 되려는 바람을 지지할 가치가 있겠습니까?"
 arme.115.a: "그렇다"
 arme.115.b: "아니요"
 arme.116.t: "프랑코포니 내의 아르메니아"
 arme.116.d: "프랑스는 프랑코포니의 일원이 되려는 우리의 바람에 긍정적으로 반응했으며, 이제 프랑스의 영향권에 들어왔으니 그들의 후원을 기대할 수 있습니다."
 arme.116.a: "좋군"
 arme.117.t: "프랑코포니 내의 아르메니아"
 arme.117.d: "프랑스는 프랑코포니의 일원이 되고, 장차 프랑스어권 전체의 일원이 되려는 우리의 바람을 거부하기로 결정했습니다."
 arme.117.a: "유감이다"
 arme.118.t: "아르메니아의 유럽 군사 프로그램 참여 희망"
 arme.118.d: "미국 유럽 사령부 국가 동반자 프로그램(EUCOM SPP)은 자체 임무에 따르면, 미국의 각 주를 지정된 동반자 국가와 연결하여 사령부의 안보 협력 목표를 지원하는 주방위군 국가 동반자 프로그램입니다. 현재 EUCOM 책임 구역 내의 구소련, 유고슬라비아, 바르샤바 조약 국가들과 22개의 동반자 관계가 있습니다. 1991년 12월 26일 소련 해체와 함께 독립한 이 국가들은 곧 새로운 자위 병력을 창설하기 위한 미국의 조언과 지원을 요청했습니다."
 arme.118.a: "물론이지, 우리는 동맹을 훈련시킬 필요가 있다"
 arme.118.b: "미안하지만 사양한다"
 arme.119.t: "[USA.GetNameWithFlag]의 수락!"
 arme.119.d: "[FROM.GetNameWithFlag]은(는) 우리의 구상을 승인했으며, 이제 우리 군은 유럽 동맹국들과의 합동 훈련에 참여하게 됩니다."
 arme.119.a: "완벽하군"
 arme.120.t: "우리를 거절한 [USA.GetNameWithFlag]"
 arme.120.d: "우리의 외교 정책이 영향을 미쳤을 수도 있지만, 우리는 유럽 국가들의 합동 훈련에 참여하는 것을 허락받지 못했습니다"
 arme.120.a: "유감이다"
 arme.121.t: "캔자스 주와의 합동 훈련"
 arme.121.d: "아르메니아는 우리 캔자스 주 방위군과 합동 훈련을 개최하기를 희망합니다"
 arme.121.a: "좋다"
 arme.121.b: "절대 안 된다"
 arme.122.t: "[USA.GetNameWithFlag]의 수락!"
 arme.122.d: "[FROM.GetNameWithFlag]은(는) 우리 군과 캔자스 주방위군 간의 합동 훈련에 동의했습니다."
 arme.122.a: "완벽하군"
 arme.123.t: "우리 제안을 거절한 [USA.GetNameWithFlag]"
 arme.123.d: "유감스럽게도 캔자스 주와의 합동 훈련으로 우리 군의 준비태세를 향상시킬 수 없게 되었습니다"
 arme.123.a: "유감이다"
 arme.124.t: "아르메니아의 주요 비NATO 동맹국 지위 희망"
 arme.124.d: "우리는 아르메니아를 캅카스 지역의 핵심 국가로 보고 있으며, 아르메니아가 비NATO 동반자 프로그램에 가입하는 것은 이 지역에서 우리 영향력을 확대할 좋은 전망입니다."
 arme.124.a: "그래, 동의한다"
 arme.124.b: "아니, 아르메니아는 약하다"
 arme.125.t: "[USA.GetNameWithFlag]의 수락!"
 arme.125.d: "[USA.GetNameWithFlag]이(가) 우리의 신청을 비준했으며, 이제 우리는 NATO와 군사 협력을 할 수 있는 특별한 기회를 얻었습니다"
 arme.125.a: "좋다"
 arme.126.t: "우리 신청을 거절한 [USA.GetNameWithFlag]"
 arme.126.d: "[USA.GetNameWithFlag]은(는) 우리가 그들의 기준에 미치지 못한다는 이유로 신청을 거절하기로 결정했습니다"
 arme.126.a: "별로군"
 arme.127.t: "[ARM.GetNameWithFlag]에 추가 투자를 하시겠습니까?"
 arme.127.d: "다양한 공동 프로그램을 통해 양국 간 경제적 유대를 발전시킬 필요가 있습니다"
 arme.127.a: "그래, 물론이다"
 arme.127.b: "절대 안 된다"
 arme.128.t: "[USA.GetNameWithFlag]의 수락!"
 arme.128.d: "다행히 [USA.GetNameWithFlag]을(를) 설득하여 우리나라에 대한 추가 자금 지원 프로그램을 얻어낼 수 있었습니다"
 arme.128.a: "좋다"
 arme.129.t: "우리 제안을 거절한 [USA.GetNameWithFlag]"
 arme.129.d: "유감스럽게도 [USA.GetNameWithFlag]은(는) 이에 관심이 없습니다."
 arme.129.a: "유감이다"
 arme.130.t: "[ARM.GetNameWithFlag]의 밀레니엄 챌린지 컴팩트 지급 요청"
 arme.130.d: "아르메니아는 자국이 거버넌스 개선의 모든 단계를 통과했다고 믿으며, 밀레니엄 챌린지 컴팩트 프로그램에 따른 자금 지급을 받을 준비가 되었다고 주장합니다"
 arme.130.a: "그래, 준비가 되었다"
 arme.130.b: "아니, 나라부터 고쳐라"
 arme.133.t: "ANCA 로비 활동"
 arme.133.d: "미국 아르메니아 전국 위원회(ANCA)는 아르메니아계 미국인 풀뿌리 조직입니다. 본부는 워싱턴 D.C.에 있으며, 캘리포니아주 글렌데일과 매사추세츠주 워터타운에 지역 사무소를 두고 있습니다."
 arme.133.a: "좋다"
 arme.134.t: "[ARM.GetNameWithFlag]의 아르메니아 집단학살 인정 요청"
 arme.134.d: "아르메니아는 아르메니아 집단학살의 인정을 얻기 위해 극도로 강하게 압박하고 있습니다. 이에 동의한다면 아르메니아에 대한 우리의 영향력은 크게 강화되겠지만, 튀르키예와의 관계는 악화될 것입니다"
 arme.134.a: "튀르키예는 이에 대해 벌을 받아야 한다"
 arme.134.b: "아르메니아가 뭐라고?"
 arme.135.t: "[USA.GetNameWithFlag]의 집단학살 인정!"
 arme.135.d: "오늘은 아르메니아 역사상 가장 중요한 날 중 하나로 기록될 것입니다. 우리가 [USA.GetNameWithFlag]을(를) 설득하여 튀르키예가 자행한 집단학살을 인정하도록 만들었기 때문입니다."
 arme.135.a: "만세!"
 arme.136.t: "모르는 척하는 [USA.GetNameWithFlag]"
 arme.136.d: "유감스럽게도 미국은 우리보다 [TUR.GetNameWithFlag]와(과) 더 친하게 지내는 쪽을 택했습니다"
 arme.136.a: "유감이다"
 arme.137.t: "[ARM.GetNameWithFlag]의 [USA.GetNameWithFlag]와(과)의 군사 협정 탈퇴"
 arme.137.d: "우리가 스스로를 돌볼 수 없는 약소국에 속합니까? 그런 나라들은 [USA.GetNameWithFlag]의 눈치를 크게 보게 됩니다. 오직 [USA.GetNameWithFlag]의 무기 생산과 공급에만 의존하기 때문이며, 이는 워싱턴에 종속되게 만들어 자국의 안보를 해칩니다. 우리는 더 이상 이에 관심이 없습니다."
 arme.137.a: "꺼져라, NATO!"
 arme.144.t: "[USA.GetNameWithFlag] 자산 동결"
 arme.144.d: "미국이 우리나라에 쏟아부은 자금은 우리 정부를 전복시키려는 목적이었습니다. 우리는 이 자본을 보상으로 국유화합니다."
 arme.144.a: "우리 것이다"
 arme.145.t: "비정부 기구 탈퇴"
 arme.145.d: "[USA.GetNameWithFlag]은(는) 우리 안보를 위협하는 단체들에 자금을 지원합니다. 우리는 더 이상 이들에 참여할 생각이 없습니다."
 arme.145.a: "그편이 낫다"
 arme.149.t: "[ARM.GetNameWithFlag]의 문화적 유대 확대 희망"
 arme.149.d: "우리 두 민족은 수 세기의 역사로 이어져 있으며, 앞으로도 이 유대를 유지해야 합니다. 게다가 양국은 정치적, 경제적 측면에서 이러한 협력으로 서로 이익을 얻습니다."
 arme.149.a: "좋다"
 arme.149.b: "아니요"
 arme.150.t: "[SYR.GetNameWithFlag]의 수락!"
 arme.150.d: "시리아 정부는 우리에게 전적으로 동의하며 문화 교류를 더욱 강화할 준비가 되어 있습니다"
 arme.150.a: "좋다"
 arme.151.t: "[SYR.GetNameWithFlag]의 문화 협력 거절"
 arme.151.d: "그들은 이에 관심이 없으며 우리의 제안을 거절했습니다"
 arme.151.a: "유감이다"
 arme.152.t: "[ARM.GetNameWithFlag]의 디아스포라 [ARM.GetNameWithFlag] 귀환"
 arme.152.d: "우리나라가 연루된 전쟁으로 인해 아르메니아 정부는 자국민을 [ARM.GetNameWithFlag]로 철수시키기로 결정했습니다"
 arme.152.a: "안전한 여행이 되길!"
 arme.153.t: "[SYR.GetNameWithFlag]에서 도착한 아르메니아인들"
 arme.153.d: "현재 어려운 시기를 겪고 있는 시리아로부터 우리 국민을 철수시킬 수 있었습니다"
 arme.153.a: "좋다"
 arme.154.t: "[SYR.GetNameWithFlag]에 대한 인도적 지원"
 arme.154.d: "시리아의 친구들이 어려운 처지에 있으므로 우리는 그들에게 인도적 지원을 제공할 것입니다"
 arme.154.a: "우리 형제들을 구해야 한다!"
 arme.155.t: "[ARM.GetNameWithFlag]의 인도적 지원 제공"
 arme.155.d: "[ARM.GetNameWithFlag]의 친구들이 우리에게 인도적 지원을 보내 왔습니다. 우리를 잊지 않은 아르메니아 국민에게 우리 국민은 진심으로 감사드립니다"
 arme.155.a: "신께서 아르메니아를 보호하시길!"
 arme.156.t: "[ARM.GetNameWithFlag]의 군사 지원 제공"
 arme.156.d: "[ARM.GetNameWithFlag]은(는) 전선에서의 우리 상황을 개선해 줄 지원을 제공할 의사가 있습니다"
 arme.156.a: "감사하다"
 arme.156.b: "필요 없다"
 arme.157.t: "우리의 도움을 수락한 [SYR.GetNameWithFlag]"
 arme.157.d: "그들의 군 지휘부는 우리가 제공한 도움에 감사를 표합니다"
 arme.157.a: "좋다"
 arme.158.t: "[SYR.GetNameWithFlag]의 지원 거절"
 arme.158.d: "그들은 우리의 도움이 별로 필요하지 않은 모양입니다."
 arme.158.a: "알겠다"
 arme.163.t: "[ARM.GetNameWithFlag]의 NATO 가입 희망"
 arme.163.d: "그들은 공동의 대의를 위해 일하며 자신들의 지역에서 핵심 동맹 파트너가 될 것이라고 장담합니다."
 arme.163.a: "좋다"
 arme.163.b: "아니요"
 arme.165.t: "우리 신청을 거절한 [USA.GetNameWithFlag]"
 arme.165.d: "그들은 우리의 NATO 가입에 관심이 없습니다."
 arme.165.a: "별로군"
 ARM_relations_with_america: "미국과의 관계"
 ARM_relations_with_america_desc: "미국에는 큰 아르메니아 디아스포라가 있으며 우리와의 역사적 관계도 매우 좋습니다. 윌슨 대통령 시절부터 많은 아르메니아인이 미국을 믿을 만한 파트너로 보았습니다."
 ARM_join_us_eur_partn_prog: "유럽 사령부 주 동반자 프로그램"
 ARM_join_us_eur_partn_prog_desc: "미국은 우리의 새로운 군사 구조를 구축하는 것을 목표로, 자국 군 예비대와 함께하는 군사 동반자 프로그램을 제안하고 있습니다."
 ARM_expand_us_embassy: "미국 대사관 확장"
 ARM_expand_us_embassy_desc: "미국은 이미 대사관이 관리하는 매우 큰 부지를 갖고 있습니다. 그러나 대사관을 위한 땅을 더 원한다면 우리가 제공해 줄 수 있습니다."
 ARM_additional_programs_for_armenia: "아르메니아 추가 프로그램"
 ARM_additional_programs_for_armenia_desc: "미국은 오로지 아르메니아만을 대상으로 한 추가 개발 프로그램을 제공할 수 있습니다."
 ARM_millennium_challenge_compact: "밀레니엄 챌린지 컴팩트"
 ARM_millennium_challenge_compact_desc: "밀레니엄 챌린지 컴팩트는 빈곤 감소와 경제 성장 촉진을 목표로 하는 특정 프로그램에 자금을 지원하기 위해 MCC와 자격을 갖춘 국가 사이에 체결되는 5개년 미국 정부 협정입니다."
 ARM_anca_lobbying: "ANCA 로비 활동"
 ARM_anca_lobbying_desc: "미국 아르메니아 전국 위원회는 아르메니아계 미국인 풀뿌리 조직입니다. 본부는 워싱턴 D.C.에 있으며, 캘리포니아주 글렌데일과 매사추세츠주 워터타운에 지역 사무소를 두고 있습니다."
 ARM_us_recog_arm_gen: "미국의 아르메니아 집단학살 인정"
 ARM_us_recog_arm_gen_desc: "미국에 튀르키예에 대한 압박을 마침내 가하고 제1차 세계 대전 중 튀르키예의 만행을 집단학살로 인정하도록 요청해야 합니다."
 ARM_kansas_armenia_partnership: "캔자스-아르메니아 주 동반자 관계"
 ARM_kansas_armenia_partnership_desc: "아르메니아군은 미국 CSPP 프로그램을 통해 캔자스 주방위군과 동반자 관계를 맺었습니다. 함께 훈련을 실시해야 합니다."
 ARM_req_mnna_status: "주요 비NATO 동맹국 지위 요청"
 ARM_req_mnna_status_desc: "이제 우리가 서방의 대의에 대한 진정한 충성을 보였으니, 미국에 주요 비NATO 동맹국 지위를 요청해 보는 것이 좋을 것입니다."
 ARM_stopping_usaid: "USAID 중단"
 ARM_stopping_usaid_desc: "USAID는 미국의 이익을 증진하는 것 외에는 아무 일도 하지 않는 조직입니다. 중단시켜야 합니다!"
 ARM_close_us_embassy: "대사관 폐쇄"
 ARM_close_us_embassy_desc: "미국은 너무 오랫동안 대사관을 통해 우리를 상대로 음모를 꾸며 왔습니다. 이는 중단되어야 합니다."
 ARM_seizing_us_investments: "미국 투자 몰수"
 ARM_seizing_us_investments_desc: "미국의 모든 투자는 투자 유치국의 번영이 아니라 미국 엘리트의 자본주의적 수익을 노린 것입니다. 이를 몰수해야 합니다!"
 ARM_stop_military_coop: "군사 협력 중단"
 ARM_stop_military_coop_desc: "우리는 나약한 미국인들과의 군사 협력이 필요 없습니다."
 ARM_no_more_relations_with_us: "미국과의 관계 단절"
 ARM_no_more_relations_with_us_desc: "우리는 테러 국가인 미합중국과 어떠한 관계도 맺는 것을 용납할 수 없습니다."
 ARM_no_more_ngo_funds: "NGO 자금 중단"
 ARM_no_more_ngo_funds_desc: "NGO는 우리의 방침과 어긋나는 가치를 조장하는 사회적 첩보 조직입니다. 이는 중단되어야 합니다."
 ARM_anti_nato_propaganda: "반NATO 선전"
 ARM_anti_nato_propaganda_desc: "NATO는 서방 패권의 제국주의적 조직입니다! 그들에 관한 진실을 세계에 알리지 않을 이유가 있겠습니까?"
 ARM_combat_us_influence: "미국 영향력 대응"
 ARM_combat_us_influence_desc: "모든 방면에서 미국의 영향력에 맞서 싸워야 합니다. 문화에서 경제에 이르기까지 미국의 존재를 억제해야 합니다."
 ARM_relations_with_iran: "이란과의 관계"
 ARM_relations_with_iran_desc: "이란은 우리의 가장 오래된 이웃 중 하나입니다. 21세기에 우리의 관계가 어떠해야 할지 결정할 때가 왔습니다."
 ARM_close_border_with_iran: "이란과의 국경 폐쇄"
 ARM_close_border_with_iran_desc: "이란과의 무역을 더 이상 허용하지 않도록 이란과의 국경을 폐쇄해야 합니다."
 ARM_rip_the_trade_agreements: "무역 중단"
 ARM_rip_the_trade_agreements_desc: "이란 제품을 금지하고 이란과 아르메니아 사이의 모든 상업적 연결을 끊어야 합니다."
 ARM_closing_blue_mosque: "푸른 모스크 폐쇄"
 ARM_closing_blue_mosque_desc: "이란은 푸른 모스크를 아르메니아 내 영향력 거점으로 이용해 왔습니다. 이를 끝내야 합니다."
 ARM_amenia_iran_agen_capt: "반이란 감시"
 ARM_capture_iranian_agents: "반이란 감시"
 ARM_capture_iranian_agents_desc: "이란이 우리를 상대로 음모를 꾸밀 수 있습니다. 그러한 상황에 대비해야 합니다."
 ARM_hez_are_terrorists: "헤즈볼라는 테러리스트다!"
 ARM_hez_are_terrorists_desc: "헤즈볼라는 이란의 테러리스트 대리 세력입니다. 그들의 정치 조직과 방침을 규탄해야 합니다!"
 ARM_support_pjaks: "쿠르디스탄 자유 생활당 지원"
 ARM_support_pjaks_desc: "이란의 야욕을 억제하기 위해 쿠르디스탄 자유 생활당 같은 쿠르드 분리주의 조직을 지원해야 합니다."
 ARM_post_ussr_partnersh: "소련 해체 후 동반자 관계"
 ARM_post_ussr_partnersh_desc: "소련 시절 우리와 경제적, 정치적 관계를 맺었던 많은 나라가 이제는 우리와 상당히 멀어졌습니다. 이들과 관계를 다시 구축해 볼 수 있습니다."
 ARM_trade_partnership_blr: "벨라루스와의 동반자 관계"
 ARM_trade_partnership_blr_desc: "벨라루스 시장은 우리 기업들에게 매우 흥미로울 수 있으며, 우리 시장 역시 그들에게 그러합니다."
 ARM_trade_partnership_kaz: "카자흐스탄과의 동반자 관계"
 ARM_trade_partnership_kaz_desc: "카자흐스탄과의 관계가 가장 밝지는 않을 수 있으나, 공통된 무역 이익과 러시아와의 깊은 통합은 양국 모두에게 유리하게 작용할 수 있습니다."
 ARM_trade_partnership_ukr: "우크라이나와의 동반자 관계"
 ARM_trade_partnership_ukr_desc: "우크라이나와 좋은 무역 관계를 맺는 것은 우리에게 매우 유익할 수 있으며, 우리 시장은 그들의 제품에 매우 적합할 수 있습니다."
 arme.138.t: "[ARM.GetNameWithFlag]의 EU 협력 협정 체결 희망!"
 arme.138.d: "최근 아르메니아는 유럽 연합과 협력 협정을 체결하기로 결정했습니다. 그들의 제안에 동의하시겠습니까?"
 arme.138.a: "물론이지!"
 arme.138.b: "동의하지 않는다?"
 arme.139.t: "[FROM.GetNameWithFlag]의 수락!"
 arme.139.d: "[FROM.GetNameWithFlag]은(는) 우리의 제안을 승인했으며 협정은 곧 체결될 것입니다."
 arme.139.a: "좋군!"
 arme.140.t: "[FROM.GetNameWithFlag]의 거절!"
 arme.140.d: "[FROM.GetNameWithFlag]은(는) 협력 협정을 체결하자는 우리의 제안을 거절했습니다."
 arme.140.a: "매우 유감이다."
 arme.141.t: "[ARM.GetNameWithFlag]의 공개 정부 행동 계획 가입 희망!"
 arme.141.d: "최근 아르메니아는 공개 행동 계획에 가입하는 데 관심을 보였습니다. 이 행동 계획은 정부가 추진하는 개혁 의제를 개선하여 더 투명하고, 책임성 있고, 참여적이고, 혁신적으로 만드는 것을 목표로 합니다. 가입을 허용하시겠습니까?"
 arme.141.a: "물론이지!"
 arme.141.b: "미안하지만 사양한다."
 arme.142.t: "[FROM.GetNameWithFlag]의 수락!"
 arme.142.d: "그들은 정부의 개혁 의제를 개선하여 더 투명하고, 책임성 있고, 참여적이고, 혁신적으로 만드는 것을 목표로 하는 공개 행동 계획에 가입하겠다는 우리의 요청을 승인했습니다."
 arme.142.a: "좋군!"
 arme.143.t: "[FROM.GetNameWithFlag]의 거절!"
 arme.143.d: "[FROM.GetNameWithFlag]은(는) 공개 행동 계획에 가입하겠다는 우리의 제안을 거절했습니다."
 arme.143.a: "매우 유감이다."
 arme.146.t: "[ARM.GetNameWithFlag]의 무역관"
 arme.146.d: "아르메니아 정부는 우리의 무역 관계를 새로운 수준으로 확대할 것을 제안합니다. 아르메니아 정부는 멀티그룹 사의 지원을 받아, 우리 상품을 아르메니아 구매자들에게 판매용으로 선보일 무역관을 만들 공간을 제공할 준비가 되어 있습니다. 이러한 협정을 맺으시겠습니까?"
 arme.146.a: "그렇다"
 arme.146.b: "아니요"
 arme.147.t: "아르메니아 내 벨라루스 무역관"
 arme.147.d: "벨라루스 정부는 우리나라에 벨라루스 제품 무역관을 개설하는 데 동의했습니다"
 arme.147.a: "좋군"
 arme.148.t: "아르메니아 내 벨라루스 무역관"
 arme.148.d: "벨라루스 정부는 우리나라에 벨라루스 제품 무역관을 개설하는 것을 거부했습니다"
 arme.148.a: "유감이다"
 arme.159.t: "이스탄불 협약 논의"
 arme.159.d: "우리는 인권에 관한 이스탄불 협약에 서명할지 거부할지의 문제에 직면했습니다. 이 협약은 우리를 유럽 연합 가입에 더 가깝게 해 주겠지만, 국민의 불만을 일으킬 수도 있습니다."
 arme.159.a: "서명하자!"
 arme.159.b: "위험을 감수할 수 없다."
 arme.160.t: "아르메니아와의 합동 군사 훈련"
 arme.160.d: "아르메니아 정부는 경험과 기량을 공유하고, 양국 군대의 조율을 향상시키며, 양국 간 우호 관계를 강화하기 위해 양국 군대가 합동 군사 훈련을 실시할 것을 제안합니다."
 arme.160.a: "동의한다"
 arme.160.b: "아니요"
 arme.161.t: "[FROM.GetName]와(과)의 합동 군사 훈련"
 arme.161.d: "그들의 정부는 우리 군과 합동 훈련을 실시하는 데 동의했습니다."
 arme.161.a: "좋군"
 arme.162.t: "[FROM.GetName]와(과)의 합동 군사 훈련"
 arme.162.d: "그들의 정부는 우리 군과 합동 훈련을 실시하는 것을 거부했습니다."
 arme.162.a: "유감이다"
 arme.166.t: "[ARM.GetNameWithFlag]의 과학 조약 제안!"
 arme.166.d: "최근 아르메니아 정부가 우리에게 상호 과학 교류 조약을 제안했으며, 이는 양측 모두에게 잠재적으로 이로울 수 있습니다. 그들의 제안에 동의하시겠습니까?"
 arme.166.a: "물론이지!"
 arme.166.b: "미안하지만 사양한다."
 arme.167.t: "[KAZ.GetNameWithFlag]의 동의!"
 arme.167.d: "카자흐스탄이 우리의 과학 조약에 동의했으며, 이제 양측 모두 그 혜택을 보기 시작할 것입니다."
 arme.167.a: "좋군!"
 arme.168.t: "[KAZ.GetNameWithFlag]의 거절!"
 arme.168.d: "카자흐스탄은 우리의 조약 제안을 자신들을 더 불리한 처지에 놓을 일종의 속임수로 보고 거절했습니다."
 arme.168.a: "뭐, 뭐라고?"
 arme.169.t: "[ARM.GetNameWithFlag]의 사업 협력 제안!"
 arme.169.d: "최근 아르메니아 정부가 우크라이나 내 디아스포라 연줄을 통해 상호 이익이 되는 사업 협정을 제안해 왔습니다. 동의하시겠습니까?"
 arme.169.a: "물론이지!"
 arme.169.b: "아니."
 arme.170.t: "[UKR.GetNameWithFlag]의 동의!"
 arme.170.d: "우크라이나가 우리의 사업 조약에 동의했으며, 이제 양측 모두 그 혜택을 보기 시작할 것입니다."
 arme.170.a: "좋군!"
 arme.171.t: "[UKR.GetNameWithFlag]의 거절!"
 arme.171.d: "우크라이나는 우리의 사업 제안을 자신들을 더 불리한 처지에 놓을 일종의 속임수로 보고 거절했습니다."
 arme.171.a: "뭐, 뭐라고?"
 arme.172.t: "아르메니아 의용 여단"
 arme.172.d: "최근 아르메니아 디아스포라와 아르메니아 정부의 지원을 받아, 로자바의 현지 아르메니아인들이 튀르키예 및 이슬람주의 억압에 맞선 우리의 투쟁에 합류했습니다. 이 여단은 이제 튀르키예 노동자 농민 해방군(TİKKO)과 시리아 민주군의 일부입니다. 이 여단은 이슬람 국가(ISIL)와, 파시스트 통일진보위원회의 현재 대표자라고 규정한 튀르키예 국가로부터 시리아의 아르메니아인, 그들의 언어와 문화, 그리고 북동 시리아 자치 행정부의 모든 민족을 방어하는 것이 목표라고 밝혔습니다."
 arme.172.a: "좋군!"
 arme.173.t: "아르메니아 합중국"
 arme.173.d: "우리나라는 역사 발전의 새로운 단계에 들어섰습니다! 이제 아르메니아 합중국의 수립을 선포할 준비가 되었습니다! 우리 국가는 그 이름에 걸맞은 국경으로 확장되었습니다. 우리는 캅카스 전역, 어쩌면 그 너머에서도 평화와 민주주의의 수호자가 될 것입니다."
 arme.173.a: "좋군!"
 ARM_kaz_scienc_part: "카자흐스탄과의 과학 동반자 관계"
 ARM_kaz_scienc_part_desc: "카자흐스탄에 상호 이익이 되는 과학 조약을 제안할 수 있습니다."
 ARM_diasp_ukr: "우크라이나 내 연줄"
 ARM_diasp_ukr_desc: "우크라이나 내 아르메니아 디아스포라는 상당한 규모입니다. 그곳의 연줄을 활용하여 상호 이익이 되는 협정을 찾을 수 있습니다."
 ARM_ukraine_cooperation_idea: "[ARM.GetNameWithFlag] - [UKR.GetNameWithFlag] 협정"
 ARM_reach_out_baltics: "발트 국가에 접근"
 ARM_reach_out_baltics_desc: "역사적 유대를 고려하여 발트 국가들에 접근하고 그들과의 관계를 정상화해야 합니다."
 ARM_gods_land: "신의 땅"
 ARM_gods_land_desc: "성지는 오늘날 종교적 중요성뿐만 아니라 그곳에서 벌어지는 지정학적 경쟁 때문에도 매우 큰 의미를 갖습니다."
 ARM_arm_quart_partnership: "아르메니아인 구역 동반자 관계"
 ARM_arm_quart_partnership_desc: "아르메니아 사도 교회는 예수의 무덤이 있는 성지를 거의 전적으로 관리하는 것으로 유명합니다. 그 밖에도 예루살렘의 아르메니아인 구역은 도시에서 많은 영향력을 갖고 있습니다. 이러한 요소들을 활용해야 합니다."
 ARM_recog_palest: "팔레스타인 승인"
 ARM_recog_palest_desc: "이스라엘이 우리에게 충분한 적의를 보였기에 이제 우리는 팔레스타인 대의의 투쟁을 이해합니다. 우리의 입장을 보여 주기 위해 팔레스타인을 승인해야 합니다."
 ARM_support_israel: "이스라엘 지원"
 ARM_support_israel_desc: "이스라엘은 우리와의 협력에서 선의를 보였습니다. 우호적인 정신으로 그에 상응하여 응답해야 합니다."
 ARM_cont_pal_christians: "팔레스타인 기독교인 지원"
 ARM_cont_pal_christians_desc: "인도적 지원을 보내고 아르메니아 교회와의 유대를 강화하여 팔레스타인 기독교인들을 지원해야 합니다."
 ARM_relat_in_kurdistan: "쿠르디스탄에 접근"
 ARM_relat_in_kurdistan_desc: "쿠르드인과의 관계가 문제없이 완전히 원만하지는 않았을 수 있으나, 우리는 모두 튀르키예 억압의 피해자이므로 단결해야 합니다."
 ARM_yazidi_repatriation: "야지디 귀환"
 ARM_yazidi_repatriation2: "야지디 귀환"
 ARM_accept_yazidis: "야지디 수용"
 ARM_accept_yazidis_desc: "야지디는 중동의 종교적 소수 집단으로, 역사적으로 아르메니아인과 매우 좋은 관계를 맺어 왔으며 우리를 배신한 적이 없습니다. 아르메니아에서 그들의 단체를 받아들이고 그들의 문화적 부흥을 육성해야 합니다."
 ARM_our_land_their_freedom: "그들의 자유를 위한 우리의 땅"
 ARM_our_land_their_freedom_desc: "야지디를 아르메니아의 공식 소수 민족으로 인정하고 완전한 귀환을 허용하며 의회 의석도 부여하는 법을 통과시켜야 합니다."
 ARM_yazidis_are_kurds: "야지디는 쿠르드인이다"
 ARM_yazidis_are_kurds_desc: "야지디 단체를 지원할 것이 아니라, 야지디인들 사이에서 쿠르드 정체성을 지지하도록 쿠르드 단체를 초청해야 합니다."
 ARM_support_barzani_ambitions: "쿠르드의 야망 지원"
 ARM_support_barzani_ambitions_desc: "쿠르드인들이 과거 아르메니아 영토에 거주하고 있음에도, 튀르키예에 맞서 그들을 지원해야 합니다."
 ARM_support_nubar_ozanian: "로자바의 아르메니아인 지원"
 ARM_support_nubar_ozanian_desc: "최근 로자바의 쿠르드인들이 이슬람주의자 및 튀르키예 침략자들에 맞선 투쟁을 시작했습니다. 그들의 대의를 지원해야 합니다."
 ARM_ministry_of_external_category: "아르메니아 정부"
 ARM_ministry_of_external_category_desc: "£text_icon_armgovern §Y아르메니아 정부§!는 생존하고 번영하며 영향력을 확대하기 위해 다양한 §Y국내 및 대외 정책 행동§!을 수행해야 합니다.\n\n§G새로운 영토 통합§! 방식은 §Y정치 체제§!가 §O특정 영토에 대한 영유권§!을 갖고 있어야 합니다. 모든 정당이 모든 영토를 통합할 수 있는 것은 아닙니다.\n\n§Y아르메니아 디아스포라§! 관련 결정은 해당 §Y국가 정신§!을 보유하고 있는 동안 이용할 수 있습니다."
 ARM_integration_new_lands: "새로운 영토의 §Y통합§!"
 ARM_new_crusade_israel: "§Y[ISR.GetFlag]예루살렘 왕국§!을 위한 §Y십자군§! 개시"
 ARM_new_crusade_hazbik: "§Y[LEB.GetFlag]안티오키아 공국§!을 위한 §Y십자군§! 개시"
 ARM_new_crusade_palestine: "§Y[PAL.GetNameWithFlag]§!을(를) 위한 §Y십자군§! 개시"
 ARM_italy_reclamation: "§Y[ITA.GetNameWithFlag]§!와(과) §G통합§! 개시"
 ARM_new_decision_govern_unlock_tt: "£text_icon_armgovern §Y아르메니아 정부§!: 새로운 결정 §Y잠금 해제§!"
 integr_stuff_tt: "£text_icon_armgovern §Y정치 체제§!가 허용한다면 이 §Y결정§!으로 다양한 §G영토§!를 §G통합§!할 수 있습니다!\n순응도 수준을 면밀히 주시하십시오. 일부 지역은 귀하의 점령에 반란을 일으킬 수 있습니다."
 ARM_United_States: "아르메니아 합중국"
 ARM_veter_must_rule: "국민의 민주주의"
 ARM_veter_must_rule_desc: "아르메니아인이 누구이며 우리의 국익이 무엇인지 눈감아야 한다면 서방의 가치와 민주적 접근은 아무 의미가 없습니다. 진정한 민주주의를 원한다 하더라도 참전용사들이 우리 국가를 이끌어야 합니다."
 ARM_request_support_us: "미국 아르메니아 군단"
 ARM_request_support_us_desc: "미국 아르메니아 군단은 과거 미군에서 복무한 아르메니아인들로 이루어진 조직입니다. 이 군단은 아르메니아 민족의 적들에 맞서 싸우려 합니다. 이 조직에는 전 미 해병대 장교들의 지도 아래 비밀 훈련을 받는 5인 소규모 특수팀도 있습니다. 아르메니아 군단에는 이미 아르메니아계 청년 천 명 이상의 전투원이 있습니다. 우리는 이들의 대의를 지원하고 하나의 군 병과로 편입해야 합니다."
 ARM_staunch_western_position: "눈엣가시"
 ARM_staunch_western_position_desc: "아르메니아가 진정으로 강하고 독립적인 나라가 되려면 러시아와의 긴밀한 협력을 잊고 오로지 서방 파트너들에게 집중해야 합니다."
 ARM_against_euroscepticism: "유럽 회의주의 반대"
 ARM_against_euroscepticism_desc: "러시아는 위협입니다. 이것이 우리 정부의 만장일치 견해입니다. 이제 행동에 나서 NATO와의 관여를 심화할 때입니다. 덤으로 이는 우리를 약화시키려는 튀르키예의 노력을 훨씬 어렵게 만들 것입니다."
 ARM_nato_weapon: "NATO의 군사 지원"
 ARM_nato_weapon_desc: "우리는 군을 시급히 재무장해야 하며, 이제 NATO 회원국으로서 이 문제를 해결하기 위해 기구의 다른 회원국들에 도움을 청할 준비가 되었습니다."
 ARM_plant_radicalism: "급진 서구주의"
 ARM_plant_radicalism_desc: "유럽 문화와 서방의 경제 모델이야말로 아르메니아가 추구해야 할 것입니다. 이는 불행히도 유럽 문명의 마지막 전선인 우리에게서 멀어져 버린 이상입니다."
 ARM_first_war_glorify: "제1차 아르차흐 전쟁 찬양"
 ARM_first_war_glorify_desc: "민족적, 애국적 정서를 고취하기 위해 아르차흐 전쟁을 찬양해야 합니다!"
 ARM_fight_for_freedom: "자유를 위한 투쟁"
 ARM_fight_for_freedom_desc: "우리의 투쟁은 본질적으로 민족주의에 그치지 않습니다. 우리는 권리와 자유, 존엄을 위해서도 싸웁니다!"
 ARM_ecommerce_init: "전자상거래 구상"
 ARM_ecommerce_init_desc: "전자상거래와 정부 기구의 디지털화를 지원해야 합니다."
 ARM_fourth_rev_stnd: "제4 혁명의 기준"
 ARM_fourth_rev_stnd_desc: "우리의 운동은 새로운 혁명, 곧 민족적이고 민주적인 가치의 진화이며, 모든 아르메니아인을 위한 새로운 기준을 세워야 합니다."
 ARM_new_nuclear_plants: "신규 원자력 발전소"
 ARM_new_nuclear_plants_desc: "우리나라가 세계 시장에서 경쟁할 수 있는 능력으로 더 많은 것을 생산할 수 있는 유일한 길이므로 원자력 에너지에 의존해야 합니다."
 ARM_no_more_kgb: "KGB 영향력 근절"
 ARM_no_more_kgb_desc: "KGB 요원들은 다양한 인플루언서와 정치 활동가의 탈을 쓰고 너무 오랫동안 우리나라에 맞서 음모를 꾸며 왔습니다. 의회에까지 있습니다! 이를 끝내야 합니다."
 ARM_ally_ukr_blr: "우호적 운동과의 연대"
 ARM_ally_ukr_blr_desc: "우크라이나와 벨라루스의 많은 운동이 우리와 같은 이념을 갖고 있습니다. 러시아에 대한 우리의 공동 저항에서 그들을 지원해야 합니다."
 ARM_no_more_colony: "더 이상 식민 통치는 없다!"
 ARM_no_more_colony_desc: "러시아는 너무 오랫동안 우리를 통제해 왔습니다! 이 식민주의적 착취를 끝내야 합니다!"
 ARM_new_sparapet_pavel: "새로운 스파라페트"
 ARM_new_sparapet_pavel_desc: "파벨 마누키얀은 우리의 새롭고 강력한 나라의 스파라페트가 될 자격이 있음을 입증했습니다!"
 ARM_like_sassoun_daredevils: "사순의 용사들처럼"
 ARM_like_sassoun_daredevils_desc: "우리의 영광스러운 서사시를 본받아 민족 정신으로 하나의 국가로 단결해야 합니다!"
 ARM_investig_milit: "군 조사"
 ARM_investig_milit_desc: "모든 부패를 뿌리 뽑기 위해 군을 조사해야 합니다."
 ARM_heroes_need_heroes: "영웅에게는 영웅이 필요하다"
 ARM_heroes_need_heroes_desc: "영웅에게는 정말로 영웅이 필요합니다! 남녀노소 우리 민족 모두가 우리의 대의를 위해 싸울 준비가 되어 있어야 합니다."
 ARM_armenia_zhirayr_idea: "급진적 친서방 아르메니아"
 ARM_zhirayr_veterans_idea: "권력을 잡은 참전용사들"
 ARM_zhirayr_pro_western_position_idea: "급진적 친서방 노선"
