 module_vls_sam_1: "VLS 함대공 미사일 I"
 module_vls_sam_2: "VLS 함대공 미사일 II"
 module_vls_sam_3: "VLS 함대공 미사일 III"
 module_vls_sam_4: "VLS 함대공 미사일 IV"
 module_vls_sam_5: "VLS 함대공 미사일 V"
 module_vls_sam_6: "VLS 함대공 미사일 VI"
 module_vls_sam_7: "VLS 함대공 미사일 VII"
 module_vls_sam_8: "VLS 함대공 미사일 VIII"
 module_vls_sam_1_desc: "초기 VLS 기반 함대공 미사일 체계는 군함에 항공기와 날아오는 미사일에 대한 광역 방공 능력을 제공합니다. 수직 발사 통합은 반응 시간과 전방위 교전 능력을 향상시킵니다.\n\n§G설계 힌트: 이 모듈은 장갑과 대공 능력치, 그리고 체력을 높여 주지만 IC 비용이 증가합니다.§!"
 module_vls_sam_2_desc: "개량된 VLS 함대공 미사일은 향상된 레이더 유도와 늘어난 교전 사거리를 갖추어 협동 항공 위협에 대한 함대 방공을 강화합니다.\n\n§G설계 힌트: 이 모듈은 장갑과 대공 능력치, 그리고 체력을 높여 주지만 IC 비용이 증가합니다.§!"
 module_vls_sam_3_desc: "현대식 VLS 함대공 미사일 체계는 첨단 탐색기와 더 나은 대응책 저항력을 도입하여 빠르고 저피탐인 표적에 대한 더 안정적인 요격을 가능하게 합니다.\n\n§G설계 힌트: 이 모듈은 장갑과 대공 능력치, 그리고 체력을 높여 주지만 IC 비용이 증가합니다.§!"
 module_vls_sam_4_desc: "고도로 발전한 VLS 함대공 미사일 플랫폼은 네트워크 센서와 향상된 사격통제 체계를 통합하여 위협이 밀집한 환경에서의 협동 다중 표적 교전을 가능하게 합니다.\n\n§G설계 힌트: 이 모듈은 장갑과 대공 능력치, 그리고 체력을 높여 주지만 IC 비용이 증가합니다.§!"
 module_vls_sam_5_desc: "차세대 VLS 함대공 미사일은 연장된 사거리, 높은 기동성, 뛰어난 전자전 저항력을 강조하여 다층 방공 능력을 크게 강화합니다.\n\n§G설계 힌트: 이 모듈은 장갑과 대공 능력치, 그리고 체력을 높여 주지만 IC 비용이 증가합니다.§!"
 module_vls_sam_6_desc: "최첨단 VLS 함대공 미사일 체계는 해군 방공의 정점으로서 지능형 유도, 극한의 교전 범위, 함대 전체 센서 네트워크와의 매끄러운 통합을 결합하여 가장 진보된 항공 위협에 대응합니다.\n\n§G설계 힌트: 이 모듈은 장갑과 대공 능력치, 그리고 체력을 높여 주지만 IC 비용이 증가합니다.§!"
 module_vls_sam_7_desc: "하이퍼 첨단 VLS 함대공 미사일 체계는 해군 방공의 정점으로서 지능형 유도, 극한의 교전 범위, 함대 전체 센서 네트워크와의 매끄러운 통합을 결합하여 가장 진보된 항공 위협에 대응합니다.\n\n§G설계 힌트: 이 모듈은 장갑과 대공 능력치, 그리고 체력을 높여 주지만 IC 비용이 증가합니다.§!"
 module_vls_sam_8_desc: "울트라 첨단 VLS 함대공 미사일 체계는 해군 방공의 정점으로서 지능형 유도, 극한의 교전 범위, 함대 전체 센서 네트워크와의 매끄러운 통합을 결합하여 가장 진보된 항공 위협에 대응합니다.\n\n§G설계 힌트: 이 모듈은 장갑과 대공 능력치, 그리고 체력을 높여 주지만 IC 비용이 증가합니다.§!"
 module_vls_lam_1: "VLS 대지 공격 미사일 I"
 module_vls_lam_2: "VLS 대지 공격 미사일 II"
 module_vls_lam_3: "VLS 대지 공격 미사일 III"
 module_vls_lam_4: "VLS 대지 공격 미사일 IV"
 module_vls_lam_5: "VLS 대지 공격 미사일 V"
 module_vls_lam_6: "VLS 대지 공격 미사일 VI"
 module_vls_lam_7: "VLS 대지 공격 미사일 VII"
 module_vls_lam_1_desc: "초기 VLS 기반 대지 공격 미사일 체계는 군함이 원거리에서 지상 표적을 타격할 수 있게 합니다. 정확도와 유연성은 제한적이지만 귀중한 원거리 화력 지원을 제공합니다.\n\n§G설계 힌트: 이 모듈은 해안 포격을 위한 포 공격력과 체력을 높여 주지만 IC 비용이 증가하고 포 관통력이 감소합니다.§!"
 module_vls_lam_2_desc: "개량된 대지 공격 미사일은 향상된 유도 체계와 더 긴 사거리를 갖추어 내륙 깊숙한 전략 및 전술 표적에 대한 더 정확한 타격을 가능하게 합니다.\n\n§G설계 힌트: 이 모듈은 해안 포격을 위한 포 공격력과 체력을 높여 주지만 IC 비용이 증가하고 포 관통력이 감소합니다.§!"
 module_vls_lam_3_desc: "현대식 VLS 대지 공격 미사일 체계는 첨단 항법, 지형 추종 비행 궤적, 향상된 생존성을 도입하여 정밀 타격 효율을 크게 높입니다.\n\n§G설계 힌트: 이 모듈은 해안 포격을 위한 포 공격력과 체력을 높여 주지만 IC 비용이 증가하고 포 관통력이 감소합니다.§!"
 module_vls_lam_4_desc: "고도로 발전한 대지 공격 미사일 플랫폼은 네트워크 조준과 실시간 임무 갱신을 통합하여 고가치 표적에 대한 유연하고 협동적인 타격을 가능하게 합니다.\n\n§G설계 힌트: 이 모듈은 해안 포격을 위한 포 공격력과 체력을 높여 주지만 IC 비용이 증가하고 포 관통력이 감소합니다.§!"
 module_vls_lam_5_desc: "최첨단 VLS 대지 공격 미사일은 해군 정밀 타격 능력의 최고봉으로서 극한의 정확도, 장거리 도달력, 견고한 대응책 저항력을 결합하여 해안선을 훨씬 넘어 전력을 투사합니다.\n\n§G설계 힌트: 이 모듈은 해안 포격을 위한 포 공격력과 체력을 높여 주지만 IC 비용이 증가하고 포 관통력이 감소합니다.§!"
 module_vls_lam_6_desc: "하이퍼 첨단 VLS 대지 공격 미사일은 해군 정밀 타격 능력의 최고봉으로서 극한의 정확도, 장거리 도달력, 견고한 대응책 저항력을 결합하여 해안선을 훨씬 넘어 전력을 투사합니다.\n\n§G설계 힌트: 이 모듈은 해안 포격을 위한 포 공격력과 체력을 높여 주지만 IC 비용이 증가하고 포 관통력이 감소합니다.§!"
 module_vls_lam_7_desc: "울트라 첨단 VLS 대지 공격 미사일은 해군 정밀 타격 능력의 최고봉으로서 극한의 정확도, 장거리 도달력, 견고한 대응책 저항력을 결합하여 해안선을 훨씬 넘어 전력을 투사합니다.\n\n§G설계 힌트: 이 모듈은 해안 포격을 위한 포 공격력과 체력을 높여 주지만 IC 비용이 증가하고 포 관통력이 감소합니다.§!"
 module_vls_sub_lam_1: "VLS 대지 공격 미사일 I"
 module_vls_sub_lam_2: "VLS 대지 공격 미사일 II"
 module_vls_sub_lam_3: "VLS 대지 공격 미사일 III"
 module_vls_sub_lam_4: "VLS 대지 공격 미사일 IV"
 module_vls_sub_lam_5: "VLS 대지 공격 미사일 V"
 module_vls_sub_lam_6: "VLS 대지 공격 미사일 VI"
 module_vls_sub_lam_7: "VLS 대지 공격 미사일 VII"
 module_vls_sub_lam_1_desc: "초기 VLS 기반 대지 공격 미사일 체계는 군함이 원거리에서 지상 표적을 타격할 수 있게 합니다. 정확도와 유연성은 제한적이지만 귀중한 원거리 화력 지원을 제공합니다.\n\n§G설계 힌트: 이 모듈은 해안 포격을 위한 포 공격력과 체력을 높여 주지만 IC 비용이 증가하고 포 관통력이 감소합니다.§!"
 module_vls_sub_lam_2_desc: "개량된 대지 공격 미사일은 향상된 유도 체계와 더 긴 사거리를 갖추어 내륙 깊숙한 전략 및 전술 표적에 대한 더 정확한 타격을 가능하게 합니다.\n\n§G설계 힌트: 이 모듈은 해안 포격을 위한 포 공격력과 체력을 높여 주지만 IC 비용이 증가하고 포 관통력이 감소합니다.§!"
 module_vls_sub_lam_3_desc: "현대식 VLS 대지 공격 미사일 체계는 첨단 항법, 지형 추종 비행 궤적, 향상된 생존성을 도입하여 정밀 타격 효율을 크게 높입니다.\n\n§G설계 힌트: 이 모듈은 해안 포격을 위한 포 공격력과 체력을 높여 주지만 IC 비용이 증가하고 포 관통력이 감소합니다.§!"
 module_vls_sub_lam_4_desc: "고도로 발전한 대지 공격 미사일 플랫폼은 네트워크 조준과 실시간 임무 갱신을 통합하여 고가치 표적에 대한 유연하고 협동적인 타격을 가능하게 합니다.\n\n§G설계 힌트: 이 모듈은 해안 포격을 위한 포 공격력과 체력을 높여 주지만 IC 비용이 증가하고 포 관통력이 감소합니다.§!"
 module_vls_sub_lam_5_desc: "최첨단 VLS 대지 공격 미사일은 해군 정밀 타격 능력의 최고봉으로서 극한의 정확도, 장거리 도달력, 견고한 대응책 저항력을 결합하여 해안선을 훨씬 넘어 전력을 투사합니다.\n\n§G설계 힌트: 이 모듈은 해안 포격을 위한 포 공격력과 체력을 높여 주지만 IC 비용이 증가하고 포 관통력이 감소합니다.§!"
 module_vls_sub_lam_6_desc: "하이퍼 첨단 VLS 대지 공격 미사일은 해군 정밀 타격 능력의 최고봉으로서 극한의 정확도, 장거리 도달력, 견고한 대응책 저항력을 결합하여 해안선을 훨씬 넘어 전력을 투사합니다.\n\n§G설계 힌트: 이 모듈은 해안 포격을 위한 포 공격력과 체력을 높여 주지만 IC 비용이 증가하고 포 관통력이 감소합니다.§!"
 module_vls_sub_lam_7_desc: "울트라 첨단 VLS 대지 공격 미사일은 해군 정밀 타격 능력의 최고봉으로서 극한의 정확도, 장거리 도달력, 견고한 대응책 저항력을 결합하여 해안선을 훨씬 넘어 전력을 투사합니다.\n\n§G설계 힌트: 이 모듈은 해안 포격을 위한 포 공격력과 체력을 높여 주지만 IC 비용이 증가하고 포 관통력이 감소합니다.§!"
 module_aa_missiles_1: "대공 미사일 I"
 module_aa_missiles_1_desc: "초기 함상 대공 미사일은 적 항공기에 대한 기본적인 장거리 방어를 제공합니다. 속도와 조준 능력은 제한적이지만 함선의 방어 범위를 전통적인 함포 너머로 넓혀 줍니다.\n\n§G설계 힌트: 이 모듈은 대공 및 장갑 능력치를 제공하지만 IC 비용이 증가합니다.§!"
 module_aa_missiles_2: "대공 미사일 II"
 module_aa_missiles_2_desc: "개량된 대공 미사일은 더 빠른 반응 속도, 더 나은 유도 체계, 늘어난 사거리를 갖추어 현대식 항공 위협에 대응하는 함대의 능력을 높입니다.\n\n§G설계 힌트: 이 모듈은 대공 및 장갑 능력치를 제공하지만 IC 비용이 증가합니다.§!"
 module_aa_missiles_3: "대공 미사일 III"
 module_aa_missiles_3_desc: "현대식 대공 미사일은 첨단 탐색기와 전자 대대응책 능력을 통합하여 빠르고 저피탐인 항공기를 안정적으로 요격할 수 있게 합니다.\n\n§G설계 힌트: 이 모듈은 대공 및 장갑 능력치를 제공하지만 IC 비용이 증가합니다.§!"
 module_aa_missiles_4: "대공 미사일 IV"
 module_aa_missiles_4_desc: "고도로 발전한 대공 미사일 체계는 네트워크 센서와 자동화된 사격통제를 활용하여 다수의 항공 표적을 동시에 교전할 수 있게 합니다.\n\n§G설계 힌트: 이 모듈은 대공 및 장갑 능력치를 제공하지만 IC 비용이 증가합니다.§!"
 module_aa_missiles_5: "대공 미사일 V"
 module_aa_missiles_5_desc: "차세대 대공 미사일은 장거리 교전, 뛰어난 기동성, 전자전 저항력을 강조하여 함대 방공을 크게 강화합니다.\n\n§G설계 힌트: 이 모듈은 대공 및 장갑 능력치를 제공하지만 IC 비용이 증가합니다.§!"
 module_aa_missiles_6: "대공 미사일 VI"
 module_aa_missiles_6_desc: "근미래 대공 미사일 플랫폼은 해군 방공의 정점으로서 인공지능 보조 조준, 극한의 속도, 첨단 대대응책을 결합하여 가장 정교한 항공 위협을 격파합니다.\n\n§G설계 힌트: 이 모듈은 대공 및 장갑 능력치를 제공하지만 IC 비용이 증가합니다.§!"
 module_aa_missiles_7: "대공 미사일 VII"
 module_aa_missiles_7_desc: "하이퍼 첨단 대공 미사일 플랫폼은 해군 방공의 정점으로서 인공지능 보조 조준, 극한의 속도, 첨단 대대응책을 결합하여 가장 정교한 항공 위협을 격파합니다.\n\n§G설계 힌트: 이 모듈은 대공 및 장갑 능력치를 제공하지만 IC 비용이 증가합니다.§!"
 module_aa_missiles_8: "대공 미사일 VIII"
 module_aa_missiles_8_desc: "울트라 첨단 대공 미사일 플랫폼은 해군 방공의 정점으로서 인공지능 보조 조준, 극한의 속도, 첨단 대대응책을 결합하여 가장 정교한 항공 위협을 격파합니다.\n\n§G설계 힌트: 이 모듈은 대공 및 장갑 능력치를 제공하지만 IC 비용이 증가합니다.§!"
