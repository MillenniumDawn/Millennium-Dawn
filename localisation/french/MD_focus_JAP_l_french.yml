 JAP_diplomacy.11.t: "Demande américaine de réinterpréter l'article 9"
 JAP_diplomacy.11.d: "Le gouvernement des États-Unis nous a approchés d'une demande formelle de réinterpréter davantage l'article 9 de notre Constitution. Washington argue que l'environnement de sécurité régional s'est détérioré au point que le Japon doit assumer une plus grande part du fardeau de défense collective. Accepter leur demande ouvrirait la porte à une compréhension plus large de l'autodéfense, et à une coopération militaire plus étroite, mais ce ne sera pas sans controverses intérieures."
 JAP_diplomacy.11.a: "Accepter la demande américaine"
 JAP_diplomacy.11.b: "Nous ne pouvons pas accepter cette demande"
 JAP_diplomacy.12.t: "Le Japon refuse de réinterpréter l'article 9"
 JAP_diplomacy.12.d: "Tokyo nous a informés qu'il n'est pas prêt, pour l'heure, à réinterpréter davantage l'article 9. Les préoccupations d'opinion intérieure, les contraintes constitutionnelles et la stabilité politique ont conduit le gouvernement japonais à rejeter notre demande. Nous devons maintenant décider si nous respectons leur décision ou si nous accroissons la pression diplomatique et sécuritaire."
 JAP_diplomacy.12.a: "Nous respecterons leur décision"
 JAP_diplomacy.12.b: "Accroître la pression sur le Japon"
 JAP_diplomacy.13.t: "Le Japon accepte de réinterpréter l'article 9"
 JAP_diplomacy.13.d: "Tokyo a fait savoir qu'il est favorable à un changement du niveau d'interprétation de l'article 9 et qu'il s'efforcera d'être un partenaire de défense plus actif."
 JAP_diplomacy.13.a: "Enfin"
 JAP_diplomacy.14.t: "Pression américaine sur l'article 9"
 JAP_diplomacy.14.d: "Après notre refus d'élargir l'interprétation de l'article 9, les États-Unis ont commencé, sans bruit, à accroître la pression diplomatique et sécuritaire sur notre gouvernement. Consultations d'alliance, briefings médiatiques et messages en coulisse pointent tous dans la même direction : Washington attend du Japon qu'il assume davantage de responsabilités. Nous pouvons tenir bon, ou déplacer discrètement notre position."
 JAP_diplomacy.14.a: "Nous tiendrons bon"
 JAP_diplomacy.14.b: "Ajuster discrètement notre position"
 JAP_diplomacy.15.t: "Le Japon accepte sous la pression"
 JAP_diplomacy.15.d: "Après une période de pression diplomatique et stratégique accrue, Tokyo a indiqué qu'il est prêt à se rapprocher de notre position sur l'article 9. Tout en insistant publiquement sur le maintien des principes pacifistes du Japon, le gouvernement a désormais élargi son interprétation de l'autodéfense d'une manière qui s'aligne sur nos attentes."
 JAP_diplomacy.15.a: "Excellent"
 JAP_diplomacy.17.t: "Tarifs douaniers américains sur les produits japonais"
 JAP_diplomacy.17.d: "Les États-Unis ont annoncé un nouveau train de droits de douane visant des exportations japonaises clés, invoquant des déséquilibres économiques et la pression politique intérieure. Les mesures sont présentées comme un moyen de « rétablir l'équité », mais à Tokyo on y voit largement un geste politiquement motivé qui tendra à la fois notre économie et l'alliance plus large."
 JAP_diplomacy.17.a: "Nous devrons nous adapter à cette nouvelle réalité"
 JAP_diplomacy.18.t: "Le Japon demande un allégement tarifaire"
 JAP_diplomacy.18.d: "Tokyo a formellement demandé que nous levions les droits imposés sur les marchandises japonaises. Les représentants japonais laissent entendre que leur gouvernement pourrait être prêt à approfondir la coopération de sécurité et à aller plus loin sur la politique de défense en échange. Nous devons décider si nous transformons ce différend économique en opportunité stratégique, ou si nous maintenons la pression."
 JAP_diplomacy.18.a: "Lever les droits en échange de concessions de sécurité"
 JAP_diplomacy.18.b: "Refuser et maintenir les droits en place"
 JAP_diplomacy.19.t: "Droits de douane levés, concessions de sécurité exigées"
 JAP_diplomacy.19.d: "Les États-Unis ont accepté de lever leurs droits sur les exportations japonaises, mais seulement dans le cadre d'un accord plus large sur la sécurité et la défense. En pratique, cela signifie que le Japon est attendu pour élargir encore l'interprétation de l'article 9, approfondir la coopération militaire avec Washington et assumer un rôle plus large dans la sécurité régionale."
 JAP_diplomacy.19.a: "Pour notre économie et notre alliance, nous accepterons ce fardeau"
 JAP_diplomacy.20.t: "Les États-Unis refusent de lever les tarifs douaniers"
 JAP_diplomacy.20.d: "Notre demande formelle de lever les droits américains a été rejetée. Washington insiste pour que les mesures restent en place, invoquant des pressions politiques intérieures et des désaccords non résolus sur la politique de sécurité. Au pays, la frustration grandit parmi les exportateurs et les chefs d'entreprise, tandis que les stratèges mettent en garde : le différend pourrait encore compliquer notre alliance."
 JAP_diplomacy.20.a: "Nous devrons endurer la pression pour l'heure"
 JAP_diplomacy.21.t: "Le Japon demande le renouvellement des garanties de sécurité"
 JAP_diplomacy.21.d: "Le gouvernement japonais a formellement demandé des garanties de sécurité renouvelées ou renforcées de la part des États-Unis. Tokyo argue que l'environnement de sécurité régional s'est détérioré et qu'un engagement américain plus clair aiderait à stabiliser la situation. En privé, les responsables japonais reconnaissent que de nouveaux changements à l'interprétation de l'article 9 pourraient être possibles si Washington est prêt à prendre des engagements explicites."
 JAP_diplomacy.21.a: "Rétablir nos garanties de sécurité en échange d'engagements plus profonds"
 JAP_diplomacy.21.b: "Refuser d'étendre nos garanties"
 JAP_diplomacy.22.t: "Garanties de sécurité rétablies"
 JAP_diplomacy.22.d: "Les États-Unis ont accepté de renouveler et de clarifier leurs garanties de sécurité au Japon. En retour, Washington attend de Tokyo qu'il aille plus loin dans l'élargissement de l'interprétation de l'article 9 et qu'il assume une plus grande part des responsabilités de sécurité régionale. L'alliance se renforce, mais le débat intérieur sur nos principes pacifistes s'intensifiera."
 JAP_diplomacy.22.a: "Pour notre sécurité, nous accepterons cet engagement"
 JAP_diplomacy.23.t: "Les États-Unis refusent des garanties plus strictes"
 JAP_diplomacy.23.d: "Notre demande de garanties de sécurité renouvelées ou renforcées a été rejetée. Les États-Unis insistent sur le fait que les arrangements existants suffisent et que des contraintes politiques intérieures limitent tout engagement supplémentaire. Au Japon, ce refus alimentera les inquiétudes sur notre sécurité à long terme et la fiabilité de notre alliance."
 JAP_diplomacy.23.a: "Alors nous devons reconsidérer notre propre voie"
 JAP_diplomacy.24.t: "Le Japon demande la fin de la pression navale américaine"
 JAP_diplomacy.24.d: "Tokyo a formellement demandé que nous réduisions ou mettions fin à notre présence navale accrue et à la pression autour des routes maritimes et des points de passage clés. Les responsables japonais arguent que la posture actuelle risque l'escalade et mine le soutien intérieur à l'alliance. En privé, ils indiquent que de nouveaux changements à l'interprétation de l'article 9 pourraient être possibles si nous assouplissons notre posture."
 JAP_diplomacy.24.a: "Mettre fin à la pression navale en échange de concessions de sécurité"
 JAP_diplomacy.24.b: "Maintenir notre pression navale autour du Japon"
 JAP_diplomacy.25.t: "La pression navale s'est atténuée et les engagements renforcés"
 JAP_diplomacy.25.d: "Les États-Unis ont accepté d'assouplir leur présence navale accrue autour de nos routes maritimes, en échange d'engagements de sécurité plus profonds de la part du Japon. En pratique, cela signifie un nouveau pas dans l'élargissement de l'interprétation de l'article 9 et l'expansion de notre rôle dans la sécurité régionale. L'alliance paraît plus forte, mais le débat intérieur sur notre identité pacifiste ne fera que s'intensifier."
 JAP_diplomacy.25.a: "Pour la stabilité, nous honorerons cet accord"
 JAP_diplomacy.26.t: "Les États-Unis refusent de mettre fin à la pression navale"
 JAP_diplomacy.26.d: "Notre demande d'assouplir ou de mettre fin à la présence navale américaine accrue autour de nos routes maritimes a été rejetée. Washington insiste sur le fait que la posture actuelle est nécessaire au vu des menaces régionales. Au pays, ce refus alimentera à la fois la crainte d'être entraînés dans un conflit plus large et les appels à renforcer encore les propres défenses du Japon."
 JAP_diplomacy.26.a: "Alors nous devons nous adapter sous la pression"
 JAP_diplomacy.28.t: "Complications de la conception lunaire de Kaguya"
 JAP_diplomacy.28.d: "L'ambitieuse mission lunaire Kaguya rencontre de sérieux défis de conception. Des systèmes clés se révèlent plus complexes que prévu, du guidage et de la gestion de l'énergie à la protection thermique. Les ingénieurs arguent qu'un financement et un délai supplémentaires leur permettront de redessiner des composants critiques et d'améliorer la fiabilité d'ensemble, mais le coût de cette démarche lève déjà des sourcils au Cabinet."
 JAP_diplomacy.28.a: "Investir dans la reconception et tenir le calendrier serré"
 JAP_diplomacy.28.b: "Tenir la ligne sur les coûts et accepter un calendrier plus long"
 JAP_diplomacy.29.t: "Vulnérabilités des communications de Kaguya"
 JAP_diplomacy.29.d: "À mesure que les essais se poursuivent, le programme Kaguya révèle des faiblesses dans les communications spatiales lointaines et les liaisons de données. Intégrité du signal, bande passante et résistance aux interférences sont toutes en deçà de l'objectif. Les spécialistes proposent de nouvelles antennes, des stations au sol modernisées et un chiffrement plus robuste, mais ces améliorations exigeront un capital politique et financier supplémentaire."
 JAP_diplomacy.29.a: "Moderniser l'architecture de communications"
 JAP_diplomacy.29.b: "Poursuivre avec les systèmes existants et espérer le meilleur"
 JAP_diplomacy.30.t: "Nouveaux retards pour la mission Kaguya"
 JAP_diplomacy.30.d: "Des revers techniques, des problèmes d'intégration et des conflits de calendrier avec l'infrastructure de lancement ont forcé encore un délai pour la mission lunaire Kaguya. Si les systèmes centraux restent prometteurs, le projet est de plus en plus vu comme lent et en difficulté. Les scientifiques insistent que la patience sera récompensée, mais l'attention du public commence à se porter ailleurs."
 JAP_diplomacy.30.a: "Accepter le délai et poursuivre vers la Lune"
 JAP_diplomacy.31.t: "Kaguya atteint la surface lunaire"
 JAP_diplomacy.31.d: "Après des années de révisions de conception, de modernisations des communications et de délais difficiles, la mission Kaguya a enfin réussi. Du matériel japonais opère désormais sur et autour de la Lune, renvoyant des images haute résolution et des données scientifiques inestimables. L'exploit met en valeur les capacités de haute technologie du Japon et ouvre de nouvelles voies pour le développement satellitaire, l'exploration lointaine et les applications spatiales stratégiques."
 JAP_diplomacy.31.a: "Célébrer Kaguya comme un triomphe de la technologie japonaise"
 jap_kaguya_satellite_invest_tt: "§GParce que nous avons investi dans une meilleure conception du vaisseau, nous avons obtenu :§!"
 jap_kaguya_rocketry_invest_tt: "§GParce que nous avons investi dans de meilleures communications avec le vaisseau, nous avons obtenu :§!"
 JAP_diplomacy.32.t: "Anomalie du logiciel de guidage"
 JAP_diplomacy.32.d: "Les ingénieurs de la mission vers Mars signalent une anomalie récurrente dans le logiciel de guidage. Si le problème n'est pas encore critique, il pourrait se composer en graves erreurs de navigation s'il n'est pas traité. Le résoudre à fond puisera des ressources d'autres projets et pourra affecter le calendrier d'ensemble."
 JAP_diplomacy.32.a: "Détourner des ressources et le résoudre correctement"
 JAP_diplomacy.32.b: "Accepter des délais et le corriger progressivement"
 JAP_diplomacy.33.t: "Nommer la colonie martienne"
 JAP_diplomacy.33.d: "Le Japon a assuré un pied-à-terre permanent sur Mars. Alors que les habitats entrent en service et que les premiers équipages de longue durée s'installent, une décision symbolique attend : le nom officiel et le caractère de la colonie."
 JAP_diplomacy.33.a: "« Amaterasu », symbole radieux de l'unité"
 JAP_diplomacy.33.b: "« Kagutsuchi », une forge industrielle en fusion"
 JAP_diplomacy.33.c: "« Tsukuyomi », un observatoire calme dans le noir"
 JAP_diplomacy.33.e: "« Susanoo », une frontière martiale touchée par la tempête"
 JAP_diplomacy.68.t: "Le Japon réclame Sakhaline"
 JAP_diplomacy.68.d: "Le Japon a émis une demande formelle de restitution de Sakhaline. Accepter détendrait les tensions, mais ce serait vu comme une concession humiliante."
 JAP_diplomacy.68.a: "Accepter la demande"
 JAP_diplomacy.68.b: "Rejetez-le carrément"
 JAP_diplomacy.69.t: "Sakhaline est revenue"
 JAP_diplomacy.69.d: "Moscou a accepté notre demande. Sakhaline est désormais sous administration japonaise. Le gouvernement présentera cela comme la preuve que l'ordre impérial revient."
 JAP_diplomacy.69.a: "Une correction historique"
 JAP_diplomacy.70.t: "La Russie refuse"
 JAP_diplomacy.70.d: "Moscou a refusé notre demande sur Sakhaline. Nous pouvons avaler l'affront pour l'heure, tester la Russie par un conflit frontalier limité, ou nous engager pleinement dans la guerre."
 JAP_diplomacy.70.a: "Se retirer pour l'instant"
 JAP_diplomacy.70.b: "Lancez une guerre aux frontières"
 JAP_diplomacy.70.c: "Déclarer la guerre totale"
 JAP_diplomacy.71.t: "Le Japon exige les Kouriles du Nord"
 JAP_diplomacy.71.d: "Le Japon a émis une demande formelle de restitution des Kouriles du Nord. Accepter détendrait les tensions, mais ce serait vu comme une concession humiliante."
 JAP_diplomacy.71.a: "Accepter la demande"
 JAP_diplomacy.71.b: "Rejetez-le carrément"
 JAP_diplomacy.72.t: "Les Kouriles du Nord restituées"
 JAP_diplomacy.72.d: "Moscou a accepté notre demande. Les Kouriles du Nord sont désormais sous administration japonaise. Le gouvernement présentera cela comme la preuve que l'ordre impérial revient."
 JAP_diplomacy.72.a: "Une correction historique"
 JAP_diplomacy.73.t: "La Russie refuse"
 JAP_diplomacy.73.d: "Moscou a refusé notre demande sur les Kouriles du Nord. Nous pouvons avaler l'affront pour l'heure, tester la Russie par un conflit frontalier limité, ou nous engager pleinement dans la guerre."
 JAP_diplomacy.73.a: "Se retirer pour l'instant"
 JAP_diplomacy.73.b: "Lancez une guerre aux frontières"
 JAP_diplomacy.73.c: "Déclarer la guerre totale"
 JAP_diplomacy.74.t: "Le Japon exige les Kouriles du Sud"
 JAP_diplomacy.74.d: "Le Japon a émis une demande formelle de restitution des Kouriles du Sud. Accepter détendrait les tensions, mais ce serait vu comme une concession humiliante."
 JAP_diplomacy.74.a: "Accepter la demande"
 JAP_diplomacy.74.b: "Rejetez-le carrément"
 JAP_diplomacy.75.t: "Les Kouriles du Sud restituées"
 JAP_diplomacy.75.d: "Moscou a accepté notre demande. Les Kouriles du Sud sont désormais sous administration japonaise. Le gouvernement présentera cela comme la preuve que l'ordre impérial revient."
 JAP_diplomacy.75.a: "Une correction historique"
 JAP_diplomacy.76.t: "La Russie refuse"
 JAP_diplomacy.76.d: "Moscou a refusé notre demande sur les Kouriles du Sud. Nous pouvons avaler l'affront pour l'heure, tester la Russie par un conflit frontalier limité, ou nous engager pleinement dans la guerre."
 JAP_diplomacy.76.a: "Se retirer pour l'instant"
 JAP_diplomacy.76.b: "Lancez une guerre aux frontières"
 JAP_diplomacy.76.c: "Déclarer la guerre totale"
 JAP_diplomacy.77.t: "Tokyo propose un règlement"
 JAP_diplomacy.77.d: "Les Kouriles et Sakhaline désormais sous contrôle japonais, Tokyo s'est hâté de transformer les gains du champ de bataille en règlement formel. Les diplomates japonais ont approché Moscou d'une proposition pour mettre fin au conflit, arguant que la guerre a déjà tranché l'affaire et que poursuivre le combat ne ferait que prolonger l'inévitable.\nLeur offre est simple : la paix en échange de la reconnaissance formelle par la Russie du contrôle japonais sur les Kouriles et Sakhaline. Aux yeux de Tokyo, c'est un arrangement pratique destiné à stabiliser la région et à empêcher l'escalade. La décision nous appartient désormais. Accepter la nouvelle réalité et finir la guerre, ou rejeter la proposition et poursuivre la lutte."
 JAP_diplomacy.77.a: "Accepter le règlement."
 JAP_diplomacy.77.b: "Le rejeter. La guerre continue."
 JAP_diplomacy.78.t: "Règlement accepté"
 JAP_diplomacy.78.d: "La proposition est acceptée, et les canons commencent à se taire. Des ordres de désengagement sont donnés, les canaux diplomatiques se rouvrent, et la guerre se réduit à un ensemble de clauses et de coordonnées.\n\nLes îles du Nord sont transférées comme prix de la paix, et chaque camp doit désormais vendre le résultat à son propre public. La campagne s'achève, mais le souvenir ne s'effacera pas."
 JAP_diplomacy.78.a: "Qu'il en soit ainsi. Que l'encre remplace le sang."
 JAP_diplomacy.79.t: "Règlement rejeté"
 JAP_diplomacy.79.d: "La réponse de l'autre camp est un non catégorique. Il n'y aura ni signatures, ni reconnaissance, ni pause pour reprendre souffle.\n\nTokyo a mal lu notre détermination, et le conflit continuera jusqu'à ce qu'un camp ne puisse plus le soutenir. Si la paix doit venir, elle sera imposée."
 JAP_diplomacy.79.a: "Alors nous poursuivons le combat."
 JAP_diplomacy.80.t: "Moscou cherche une issue"
 JAP_diplomacy.80.d: "Après les avancées japonaises au nord, les diplomates russes signalent une volonté de mettre fin aux combats avant que la situation n'empire. Le message est pragmatique : arrêter l'hémorragie, geler les lignes, et empêcher la guerre de consommer plus de ressources qu'aucun camp ne peut justifier.\n\nL'offre est une paix simple, échangeant la poursuite de l'escalade contre une fin immédiate des hostilités. Nous devons décider d'accepter un règlement imparfait ou de presser davantage notre avantage."
 JAP_diplomacy.80.a: "Acceptez la paix."
 JAP_diplomacy.80.b: "Non. Nous poursuivons."
 JAP_diplomacy.81.t: "Tokyo accepte la paix"
 JAP_diplomacy.81.d: "Le Japon accepte les termes, choisissant de finir la guerre plutôt que de l'élargir. La décision est impopulaire dans des parties du pays, et le coût se ressent au pays alors que la confiance glisse et que le public se demande pourquoi les combats ont commencé.\n\nUne paix blanche est déclarée, et les concessions territoriales sont exécutées. Le champ de bataille s'apaise, mais le dommage politique durera."
 JAP_diplomacy.81.a: "Nous avalerons cela, et endurerons."
 JAP_diplomacy.82.t: "Tokyo refuse"
 JAP_diplomacy.82.d: "Le Japon rejette la proposition et signale qu'il n'acceptera pas un règlement écrit depuis la faiblesse. Les combats continueront, et l'enjeu monte chaque semaine.\n\nSi la paix doit venir, elle ne sera pas offerte. Elle sera prise."
 JAP_diplomacy.82.a: "Ainsi soit-il."
 JAP_unlock_sikhalin_raid_tt: "Débloque §Yraid des forces spéciales§! sur §Y$STATE_691$§!"
 JAP_diplomacy.83.t: "Victoire aux Kouriles du Sud"
 JAP_diplomacy.83.d: "Les forces japonaises ont prévalu aux Kouriles du Sud, reculant les unités russes et s'emparant du sol contesté. Le résultat est petit sur la carte, mais fort dans son message : le Japon peut prendre ce qu'il revendique et le tenir sous pression.\n\nLe drapeau se lève, la garnison s'enterre, et Tokyo prépare le prochain mouvement. Moscou n'oubliera pas."
 JAP_diplomacy.83.a: "Sécuriser les îles."
 JAP_diplomacy.84.t: "Défaite aux Kouriles du Sud"
 JAP_diplomacy.84.d: "L'accrochage frontalier aux Kouriles du Sud a tourné contre nous. La résistance russe a tenu, et nos forces ont dû se retirer sous le feu, laissant la question de souveraineté non résolue et notre direction sous le regard.\n\nNous avons appris des leçons douloureuses. La prochaine tentative sera mieux planifiée, mieux ravitaillée, et plus difficile à arrêter."
 JAP_diplomacy.84.a: "Tirer les leçons du revers."
 JAP_diplomacy.85.t: "Revers aux Kouriles du Sud"
 JAP_diplomacy.85.d: "Les forces russes n'ont pas tenu les Kouriles du Sud face à une poussée japonaise déterminée. La perte tactique immédiate est nette, et le signal politique l'est davantage : la frontière est vulnérable, et l'adversaire est prêt à payer pour la changer.\n\nMoscou devra décider s'il faut monter en puissance, ou accepter un fait humiliant sur le terrain."
 JAP_diplomacy.85.a: "Une amère leçon."
 JAP_diplomacy.86.t: "Les Kouriles du Sud sont sécurisées"
 JAP_diplomacy.86.d: "Les troupes russes ont gagné l'accrochage frontalier et sécurisé les Kouriles du Sud, reculant les unités japonaises et rétablissant le contrôle le long de la ligne. L'opération démontre la préparation et la capacité de punir rapidement les incursions.\n\nTokyo pourra parler d'un revers temporaire, mais le message est clair. Les îles ne seront pas prises à bon marché."
 JAP_diplomacy.86.a: "Tenir la ligne."
 JAP_diplomacy.87.t: "Victoire aux Kouriles du Nord"
 JAP_diplomacy.87.d: "Le Japon a obtenu une percée aux Kouriles du Nord, forçant les unités russes à reculer et laissant les îles sous notre contrôle. L'opération prouve que même un terrain reculé peut être saisi lorsque planification, timing et détermination s'alignent.\n\nL'occupation commence immédiatement. Les ravitaillements affluent, les défenses s'élèvent, et la frontière nord est réécrite par l'action."
 JAP_diplomacy.87.a: "S'enterrer et se préparer."
 JAP_diplomacy.88.t: "Défaite aux Kouriles du Nord"
 JAP_diplomacy.88.d: "Les Kouriles du Nord ont tenu contre notre attaque. Les combats étaient rudes, les conditions pires, et les forces russes ont réussi à émousser notre avance et forcer un retrait.\n\nNous rentrons avec une expérience payée de sang et de fatigue. La prochaine fois, nous n'arriverons pas sans préparation."
 JAP_diplomacy.88.a: "Nous nous adapterons."
 JAP_diplomacy.89.t: "Perte aux Kouriles du Nord"
 JAP_diplomacy.89.d: "La Russie a été chassée de positions aux Kouriles du Nord après une opération japonaise réussie. La perte n'est pas seulement territoriale, elle est psychologique, signalant que la distance et le climat ne sont plus des défenses fiables.\n\nUne réponse sera exigée, mais la représaille porte ses propres risques. La situation se dégrade vite."
 JAP_diplomacy.89.a: "Cela ne peut durer."
 JAP_diplomacy.90.t: "Les Kouriles du Nord détenues"
 JAP_diplomacy.90.d: "Les forces russes ont vaincu l'incursion et tenu les Kouriles du Nord, repoussant les unités japonaises et rétablissant le contrôle dans des conditions difficiles. La défense a affûté la doctrine et relevé la confiance dans toute la chaîne de commandement.\n\nSi le Japon veut ces îles, il devra engager bien plus qu'un accrochage frontalier."
 JAP_diplomacy.90.a: "Maintenir la préparation."
 JAP_diplomacy.91.t: "La Russie réagit à Sakhaline"
 JAP_diplomacy.91.d: "Les mouvements japonais sur Sakhaline ont déclenché une réponse immédiate de Moscou. La direction russe présente l'action comme un défi direct à la souveraineté et signale qu'elle ne tolérera pas d'autres avancées sans conséquence.\n\nLa crise se scinde désormais en deux voies : l'escalade vers une guerre ouverte, ou la pression coercitive par mesures économiques et restriction maritime. Dans les deux cas, la température a dépassé le point de la diplomatie calme."
 JAP_diplomacy.91.a: "Cela deviendra une guerre."
 JAP_diplomacy.91.b: "Les étrangler par embargo et blocus."
 JAP_diplomacy.92.t: "La Russie répond à la prise de Sakhaline"
 JAP_diplomacy.92.d: "Sakhaline a changé de mains, et Moscou doit désormais décider comment répondre à une humiliation si proche. La guerre serait coûteuse, mais ne pas répondre inviterait d'autres pertes et affaiblirait l'autorité de l'État.\n\nLa Russie peut choisir l'escalade et tenter d'inverser le résultat par la force, ou accepter une paix temporaire qui met fin aux combats tout en exigeant la restitution de Sakhaline comme prix de l'arrêt. La décision définira la phase suivante du conflit."
 JAP_diplomacy.92.a: "Nous la reprendrons par la force."
 JAP_diplomacy.92.b: "Imposer un règlement. Sakhaline doit être restituée."
 JAP_diplomacy.94.t: "Tokyo exige un protectorat"
 JAP_diplomacy.94.d: "Une note formelle arrive du Japon, dépouillée de diplomatie et lourde d'intention. Séoul se voit offrir un choix présenté comme la stabilité : accepter la supervision japonaise de la politique étrangère et des affaires de sécurité, aligner les institutions sur la direction de Tokyo, et éviter une confrontation destructrice.\n\nLe message est clair. Le Japon ne demande plus la coopération, il dicte des termes. Le refus sera traité comme un défi, et le défi invitera des conséquences."
 JAP_diplomacy.94.a: "Nous n'avons d'autre choix que d'accepter."
 JAP_diplomacy.94.b: "Refuser. La Corée ne s'inclinera pas."
 JAP_diplomacy.95.t: "Corée du Sud"
 JAP_diplomacy.95.d: "Séoul accepte les termes, choisissant la survie plutôt que la souveraineté. Des accords sont signés sous pression, des conseillers arrivent, et la posture extérieure de l'État est pliée dans le dessein stratégique du Japon.\n\nLa guerre s'achève, mais une autre lutte commence. La Corée reste sur la carte, pourtant sa direction n'est plus la sienne."
 JAP_diplomacy.95.a: "Établir le protectorat."
 JAP_diplomacy.96.t: "La Corée du Sud défie Tokyo"
 JAP_diplomacy.96.d: "Séoul rejette l'ultimatum et déclare que sa souveraineté n'est pas négociable. Le refus transforme la crise de la coercition en confrontation, et Tokyo a désormais tous les prétextes pour affirmer que l'affaire ne peut se régler que par la force.\n\nSi le Japon voulait une soumission, il a reçu un défi à la place."
 JAP_diplomacy.96.a: "Alors nous imposerons notre volonté."
 JAP_diplomacy.97.t: "Tokyo adresse un ultimatum à Pyongyang"
 JAP_diplomacy.97.d: "Le Japon a livré un ultimatum à Pyongyang, offrant un avenir d'endiguement sous supervision ou un avenir de ruine sous bombardement. Les termes sont brutaux : céder la politique extérieure et l'autonomie stratégique à la direction de Tokyo, accepter des arrangements de sécurité surveillés, et se soumettre à un cadre conçu pour empêcher le Nord de jamais redevenir une menace.\n\nPour le régime, c'est une humiliation. Pour le Japon, c'est de la gestion du risque. La question est de savoir si Pyongyang choisit la survie ou le défi."
 JAP_diplomacy.97.a: "Accepter. Préserver l'État à tout prix."
 JAP_diplomacy.97.b: "Rejeter. Nous ne nous soumettrons pas."
 JAP_diplomacy.98.t: "Pyongyang cède"
 JAP_diplomacy.98.d: "Contre toute attente, le Nord accepte les termes. Le régime garde ses symboles, mais sa liberté d'action est brisée tandis que la supervision japonaise refaçonne frontières, sécurité et relations étrangères.\n\nLes combats s'achèvent, et la moitié nord de la péninsule devient un tampon contrôlé. Une menace est neutralisée, et Tokyo gagne un levier qu'il ne relâchera pas facilement."
 JAP_diplomacy.98.a: "Établir le protectorat."
 JAP_diplomacy.99.t: "Pyongyang défie Tokyo"
 JAP_diplomacy.99.d: "Pyongyang rejette l'ultimatum et choisit le défi, pariant que la peur et l'escalade protégeront le régime. Le refus transforme la crise en épreuve de volontés, et Tokyo a désormais la justification pour affirmer que le Nord ne peut être soumis que par la force.\n\nLa péninsule se prépare à la guerre. Le prochain message ne sera pas une note, ce sera le feu."
 JAP_diplomacy.99.a: "Alors nous mettrons fin à la menace nous-mêmes."
 JAP_diplomacy.101.t: "Tokyo exige la soumission de Taiwan"
 JAP_diplomacy.101.d: "Le Japon a livré une demande directe à Taipei : accepter un cadre de protectorat et placer la politique étrangère et la coordination de défense sous la supervision de Tokyo, ou affronter l'isolement et la force. L'offre est emballée comme sécurité et stabilité, promettant une protection contre les menaces extérieures en échange d'obéissance politique.\n\nDerrière le langage formel, un message simple. L'île est trop importante pour rester indépendante, et le Japon entend décider de son avenir."
 JAP_diplomacy.101.a: "Accepter les termes. Éviter la catastrophe."
 JAP_diplomacy.101.b: "Les rejeter. Taïwan ne se soumettra pas."
 JAP_diplomacy.102.t: "Taipei accepte"
 JAP_diplomacy.102.d: "Taïwan accepte l'ultimatum, choisissant la survie et la continuité plutôt qu'un conflit ouvert. De nouveaux accords lient sa posture extérieure au Japon, des conseillers arrivent, et la décision stratégique est discrètement déplacée vers Tokyo.\n\nLa guerre s'achève, mais la souveraineté se rétrécit à ce que le protecteur permet. L'île demeure, pourtant sa direction n'est plus pleinement la sienne."
 JAP_diplomacy.102.a: "Établir le protectorat."
 JAP_diplomacy.103.t: "Taipei refuse"
 JAP_diplomacy.103.d: "Taïwan rejette la demande japonaise et refuse d'échanger l'autonomie contre une promesse de protection. La décision transforme la pression diplomatique en crise de force, et Tokyo a désormais la justification pour arguer que l'île ne peut être sécurisée que par la conquête.\n\nLe détroit devient une ligne de faille. La prochaine étape ne sera pas la négociation, ce sera la mobilisation."
 JAP_diplomacy.103.a: "Alors nous prendrons ce dont nous avons besoin."
 JAP_diplomacy.105.t: "Tokyo exige un protectorat philippin"
 JAP_diplomacy.105.d: "Le Japon a émis à Manille une demande qui laisse peu de place au malentendu. Accepter un cadre de protectorat, aligner la politique étrangère et la planification de défense sur Tokyo, et permettre une supervision japonaise des arrangements de sécurité clés, ou affronter les conséquences du refus.\n\nL'offre est présentée comme stabilité et protection, mais son objet est le contrôle des routes maritimes et de la porte entre les océans. Les Philippines doivent désormais choisir entre soumission et confrontation."
 JAP_diplomacy.105.a: "Accepter. Préserver la nation de la destruction."
 JAP_diplomacy.105.b: "Refuser. Nous ne serons pas gouvernés depuis Tokyo."
 JAP_diplomacy.106.t: "Manille Soumet"
 JAP_diplomacy.106.d: "Le gouvernement philippin accepte les termes du Japon. Des accords sont signés, des conseillers arrivent, et la posture extérieure du pays est pliée dans le dessein maritime japonais.\n\nLes combats s'achèvent, mais le coût est la souveraineté. L'archipel demeure, pourtant ses décisions stratégiques se prendront avec Tokyo regardant par-dessus chaque épaule."
 JAP_diplomacy.106.a: "Établir le protectorat."
 JAP_diplomacy.107.t: "Manille défie Tokyo"
 JAP_diplomacy.107.d: "Les Philippines rejettent l'ultimatum et refusent d'échanger l'indépendance contre une promesse de protection. Le refus transforme la coercition japonaise en épreuve de force, et Tokyo a désormais toutes les excuses pour affirmer que l'archipel doit être sécurisé par les armes.\n\nLes routes maritimes se resserrent, les flottes commencent à se poster, et la région se prépare à la guerre. Le prochain mouvement ne sera pas diplomatique."
 JAP_diplomacy.107.a: "Alors nous prendrons l'archipel."
 JAP_diplomacy.109.t: "L'ultimatum des Détroits"
 JAP_diplomacy.109.d: "Une note japonaise arrive sur le ton calme de l'inévitable. Kuala Lumpur se voit offrir un arrangement de protectorat qui lie la politique étrangère et la coordination de sécurité à la direction de Tokyo, justifié comme le prix de la stabilité dans une région où routes maritimes et points de passage décident de la survie.\n\nLe message n'est pas une requête. Le Japon entend commander les Détroits, et la Malaisie est censée s'y conformer. L'acceptation promet la protection, le refus invite tout le poids de la coercition maritime."
 JAP_diplomacy.109.a: "Accepter. Nous ne pouvons pas combattre la marée."
 JAP_diplomacy.109.b: "Refuser. Notre souveraineté n'est pas à vendre."
 JAP_diplomacy.110.t: "Kuala Lumpur s'incline devant le Soleil levant"
 JAP_diplomacy.110.d: "La Malaisie accepte les termes, échangeant l'indépendance stratégique contre une survie immédiate. Des accords sont signés, des missions de liaison arrivent, et Tokyo gagne les clés des corridors qui relient deux océans.\n\nLa guerre s'achève, mais le coût est clair. La Malaisie demeure intacte, pourtant sa posture extérieure se meut désormais dans l'ombre du Japon."
 JAP_diplomacy.110.a: "Établir le protectorat."
 JAP_diplomacy.111.t: "La Malaisie rejette l'ordre des Détroits"
 JAP_diplomacy.111.d: "La Malaisie rejette l'ultimatum et refuse de laisser son avenir se dicter depuis Tokyo. La décision transforme la pression japonaise en confrontation sur le corridor maritime le plus précieux de la région.\n\nTokyo ne tolérera pas le défi aux Détroits. Si la Malaisie ne se soumet pas par traité, le Japon cherchera la soumission par la force."
 JAP_diplomacy.111.a: "Alors nous prendrons les Détroits."
 JAP_diplomacy.113.t: "L'édit de l'archipel"
 JAP_diplomacy.113.d: "Tokyo a émis une demande à Jakarta visant le cœur de l'indépendance indonésienne. La proposition est un cadre de protectorat qui place la politique étrangère et la sécurité stratégique sous supervision japonaise, justifié comme le seul moyen de garantir la stabilité à travers les chaînes d'îles qui lient deux océans.\n\nLe langage est poli, mais l'intention est absolue. Le Japon veut l'archipel indonésien comme corridor contrôlé, non comme partenaire souverain. L'acceptation signifie la sécurité sous une ombre, le refus signifie que l'ombre devient une tempête."
 JAP_diplomacy.113.a: "Accepter. Nous ne pouvons pas endurer un étranglement naval."
 JAP_diplomacy.113.b: "Refuser. L'Indonésie ne sera pas commandée."
 JAP_diplomacy.114.t: "Jakarta accepte l'édit"
 JAP_diplomacy.114.d: "L'Indonésie accepte les termes et se soumet à une nouvelle réalité maritime. Des missions japonaises arrivent pour superviser la coordination de sécurité, les droits de base et l'alignement extérieur, faisant de l'archipel un corridor géré dans la sphère stratégique de Tokyo.\n\nLa guerre s'achève, mais l'indépendance se rétrécit à ce qui est permis. Les îles restent indonésiennes de nom, pourtant leur direction est désormais contrainte par la puissance japonaise."
 JAP_diplomacy.114.a: "Établir le protectorat."
 JAP_diplomacy.115.t: "L'Indonésie défie l'édit de l'archipel"
 JAP_diplomacy.115.d: "Jakarta rejette la demande japonaise et refuse d'échanger la souveraineté contre des promesses de stabilité. Le refus transforme la pression en confrontation, et Tokyo traite désormais l'indépendance indonésienne comme un obstacle à lever plutôt qu'un fait à respecter.\n\nLes mers autour de l'archipel se tendent. Si l'Indonésie ne cède pas par traité, le Japon cherchera à forcer l'obéissance par les armes."
 JAP_diplomacy.115.a: "Alors nous saisirons les corridors."
 JAP_diplomacy.117.t: "Le choix du Tonkin"
 JAP_diplomacy.117.d: "Tokyo a livré à Hanoï une demande conçue pour verrouiller le Viêt Nam dans l'ordre maritime japonais. L'offre est un arrangement de protectorat en tout sauf le nom : aligner la politique étrangère, accepter la supervision de sécurité japonaise, et permettre un accès stratégique qui fait de la côte vietnamienne une extension de la portée du Japon.\n\nLe message est présenté comme une protection contre de plus grands prédateurs, mais c'est aussi une laisse. Le Viêt Nam doit décider s'il accepte la survie sous contrainte, ou résiste et invite une guerre qui se mènera le long de ses rives."
 JAP_diplomacy.117.a: "Accepter. Nous plierons, pour l'heure."
 JAP_diplomacy.117.b: "Refuser. Le Viêt Nam ne sera pas lié."
 JAP_diplomacy.118.t: "Hanoï accepte les conditions de Tokyo"
 JAP_diplomacy.118.d: "Le Viêt Nam accepte l'ultimatum. Des accords sont signés, des officiers de liaison arrivent, et le Japon gagne une influence décisive sur l'alignement extérieur du Viêt Nam et la sécurité côtière.\n\nLa guerre s'achève, mais l'indépendance se rétrécit. Le Viêt Nam demeure, pourtant sa posture stratégique se meut désormais dans un cadre écrit à Tokyo."
 JAP_diplomacy.118.a: "Établir le protectorat."
 JAP_diplomacy.119.t: "Hanoï rejette le choix du Tonkin"
 JAP_diplomacy.119.d: "Le Viêt Nam rejette la demande japonaise et refuse d'échanger la souveraineté contre une promesse de sécurité. Le refus transforme la coercition en confrontation, et Tokyo traite désormais le Viêt Nam comme une barrière à retirer de son dessein régional.\n\nLa côte devient une ligne de front. Si le Viêt Nam ne se soumet pas par traité, le Japon cherchera la soumission par la force."
 JAP_diplomacy.119.a: "Alors nous prendrons la côte."
 JAP_diplomacy.121.t: "L'ultimatum du Mékong"
 JAP_diplomacy.121.d: "Une délégation japonaise arrive avec une proposition qui se lit moins comme de la diplomatie que comme un verdict. Le Cambodge se voit offrir une protection sous la supervision de Tokyo, avec coordination de la politique étrangère et arrangements de sécurité placés dans le cadre régional japonais.\n\nLe discours est stabilité, investissement et sécurité face à des voisins plus forts. La réalité est la subordination. Phnom Penh doit choisir d'accepter un avenir gardé, ou risquer de devenir un champ de bataille pour avoir refusé."
 JAP_diplomacy.121.a: "Acceptez. La survie passe avant tout."
 JAP_diplomacy.121.b: "Refuser. Le Cambodge ne se soumettra pas."
 JAP_diplomacy.122.t: "Phnom Penh accepte"
 JAP_diplomacy.122.d: "Le Cambodge accepte les termes et cède l'autonomie stratégique pour éviter une guerre qu'il ne peut gagner. De nouveaux accords lient l'État à la direction du Japon, et les conseillers de Tokyo se hâtent de sécuriser ministères clés et points d'accès.\n\nLes combats s'achèvent avant de commencer. Le Cambodge reste souverain de nom, mais sa voie est désormais contrainte par la puissance japonaise."
 JAP_diplomacy.122.a: "Établir le protectorat."
 JAP_diplomacy.123.t: "Le Cambodge rejette l'ultimatum du Mékong"
 JAP_diplomacy.123.d: "Phnom Penh rejette la demande japonaise et refuse de livrer son avenir à une supervision étrangère. Le refus transforme la pression en confrontation, et Tokyo traite désormais le Cambodge comme un maillon faible à ramener dans le rang.\n\nLa diplomatie a échoué. Si le Cambodge n'accepte pas le cadre, le Japon cherchera à l'imposer par la force."
 JAP_diplomacy.123.a: "Alors nous imposerons l'obéissance."
 JAP_diplomacy.125.t: "La directive de l'arrière-pays du Mékong"
 JAP_diplomacy.125.d: "Le Japon a émis une demande à Vientiane visant à sécuriser la profondeur calme derrière la côte. La proposition est un cadre de protectorat qui lie le Laos à la direction stratégique de Tokyo, plaçant politique étrangère et coordination de sécurité sous supervision japonaise.\n\nL'offre est présentée comme développement et protection. Le sens est clair : corridors, fleuves et frontières seront gérés pour servir la sphère plus large du Japon. Le Laos doit décider d'accepter la directive ou de parier sur la résistance."
 JAP_diplomacy.125.a: "Accepter. Nous ne pouvons pas tenir seuls."
 JAP_diplomacy.125.b: "Refuser. Le Laos ne se laissera pas dicter sa conduite."
 JAP_diplomacy.126.t: "Vientiane accepte"
 JAP_diplomacy.126.d: "Le Laos accepte les termes du Japon, choisissant survie et stabilité plutôt qu'une guerre qu'il ne peut se permettre. Des accords sont signés, des bureaux de coordination sont établis, et le Laos est plié dans le cadre régional de Tokyo comme arrière-pays contrôlé.\n\nLes combats s'achèvent, mais l'autonomie se rétrécit. Le Laos demeure, pourtant ses choix stratégiques se meuvent désormais dans des limites fixées par le Japon."
 JAP_diplomacy.126.a: "Établir le protectorat."
 JAP_diplomacy.127.t: "Le Laos rejette la directive"
 JAP_diplomacy.127.d: "Vientiane rejette la demande japonaise et refuse de livrer son avenir à une supervision extérieure. Le refus transforme la coercition en confrontation, et Tokyo traite désormais le Laos comme un obstacle au contrôle des corridors plutôt qu'un partenaire à courtiser.\n\nSi le Laos n'accepte pas le cadre par traité, le Japon cherchera à l'imposer par la force."
 JAP_diplomacy.127.a: "Alors nous les ramènerons à l'obéissance."
 JAP_diplomacy.129.t: "L'ultimatum de l'ancre du Sud"
 JAP_diplomacy.129.d: "Tokyo a livré à Canberra un ultimatum qui traite l'Australie non comme un continent lointain, mais comme la clé de voûte du Pacifique sud. Les termes sont tranchants : accepter un cadre de protectorat, aligner politique étrangère et planification de défense sur le Japon, et permettre les arrangements de bases et d'accès qui verrouilleraient le Pacifique sud sous la portée de Tokyo.\n\nL'offre est habillée de stabilité et de sécurité garantie. La réalité est la soumission stratégique. L'Australie doit décider d'accepter la vie sous l'ombre japonaise, ou de se préparer à contester l'océan lui-même."
 JAP_diplomacy.129.a: "Accepter. Nous ne pouvons pas gagner une guerre pour le Pacifique."
 JAP_diplomacy.129.b: "Refuser. L'Australie ne s'inclinera pas."
 JAP_diplomacy.130.t: "Canberra accepte les termes de l'ancre"
 JAP_diplomacy.130.d: "L'Australie accepte l'ultimatum japonais, choisissant la survie immédiate plutôt qu'une guerre continentale qu'elle ne peut risquer. Des accords sont signés, l'accès stratégique est accordé, et le Japon gagne l'ancre du Sud qu'il cherchait pour dominer l'océan plus large.\n\nLes canons se taisent, mais l'équilibre du Pacifique bascule du jour au lendemain. L'Australie reste sur la carte, pourtant ses décisions stratégiques se meuvent désormais dans des limites fixées à Tokyo."
 JAP_diplomacy.130.a: "Établir le protectorat."
 JAP_diplomacy.131.t: "L'Australie rejette l'ultimatum"
 JAP_diplomacy.131.d: "Canberra rejette la demande japonaise et refuse de livrer l'indépendance du continent à un mandat étranger. Le refus transforme la pression de Tokyo en défi direct, et le Japon présente désormais l'Australie comme le dernier obstacle à un ordre pacifique sous son contrôle.\n\nUn contest pour l'océan est inévitable. Si l'Australie n'accepte pas le cadre par traité, le Japon tentera de l'imposer par la force."
 JAP_diplomacy.131.a: "Alors nous sécuriserons le Sud par les armes."
 JAP_diplomacy.133.t: "La demande de la ligne de Tasman"
 JAP_diplomacy.133.d: "Tokyo a livré à Wellington une demande visant à fermer le dernier flanc ouvert du Pacifique sud. La proposition est un cadre de protectorat qui lie la politique étrangère et la posture de défense de la Nouvelle-Zélande à la direction du Japon, justifié comme le coût de la stabilité dans un océan réorganisé par la force.\n\nLe langage parle de protection et de partenariat, mais la structure est le contrôle. La Nouvelle-Zélande doit choisir entre une paix contrainte sous l'ombre japonaise ou une guerre d'indépendance à travers la mer."
 JAP_diplomacy.133.a: "Accepter. Nous endurerons, et survivrons."
 JAP_diplomacy.133.b: "Refuser. Nous ne serons pas absorbés."
 JAP_diplomacy.134.t: "Wellington accepte la ligne de Tasman"
 JAP_diplomacy.134.d: "La Nouvelle-Zélande accepte les termes du Japon, échangeant l'autonomie stratégique contre la fin des hostilités. Des accords sont signés, des arrangements d'accès sont établis, et Tokyo gagne un avant-poste méridional sûr pour façonner l'océan plus large.\n\nLa guerre s'achève, mais l'indépendance se rétrécit. La Nouvelle-Zélande demeure, pourtant sa posture extérieure se meut désormais dans des limites tracées à Tokyo."
 JAP_diplomacy.134.a: "Établir le protectorat."
 JAP_diplomacy.135.t: "Wellington rejette la demande"
 JAP_diplomacy.135.d: "La Nouvelle-Zélande rejette l'ultimatum japonais et refuse de livrer son avenir à un mandat étranger. Le refus transforme la pression en confrontation, et Tokyo traite désormais l'indépendance de Wellington comme une menace pour son périmètre sud.\n\nLe Pacifique se durcit en lignes de front. Si la Nouvelle-Zélande n'accepte pas le cadre par traité, le Japon tentera de l'imposer par la force."
 JAP_diplomacy.135.a: "Alors nous prendrons l'avant-poste du Sud."
 JAP_diplomacy.137.t: "L'ultimatum de la porte de l'Irrawaddy"
 JAP_diplomacy.137.d: "Tokyo a émis une demande à Naypyidaw visant à sécuriser le Myanmar comme pont terrestre entre océans. Les termes équivalent à un cadre de protectorat : aligner la politique étrangère sur le Japon, accepter la supervision de sécurité japonaise, et accorder l'accès nécessaire pour contrôler les corridors de la baie du Bengale vers l'Asie du Sud-Est.\n\nL'offre est présentée comme stabilité et développement. La vérité est la capture stratégique. Le Myanmar doit décider d'accepter une paix contrôlée ou d'affronter une guerre qui transformera ses portes en champs de bataille."
 JAP_diplomacy.137.a: "Accepter. Nous ne pouvons pas résister à cette pression."
 JAP_diplomacy.137.b: "Refuser. Nous ne serons pas réduits à un corridor."
 JAP_diplomacy.138.t: "Le Myanmar accepte les termes de la porte"
 JAP_diplomacy.138.d: "Le Myanmar accepte l'ultimatum japonais, échangeant l'autonomie stratégique contre la fin des hostilités et la promesse d'ordre. Des accords sont signés, des missions de liaison arrivent, et le Japon gagne une main décisive sur l'alignement extérieur et la posture de sécurité du Myanmar.\n\nLes combats s'achèvent, mais le prix est la souveraineté. Le Myanmar demeure, pourtant ses portes servent désormais un dessein régional écrit à Tokyo."
 JAP_diplomacy.138.a: "Établir le protectorat."
 JAP_diplomacy.139.t: "Le Myanmar rejette l'ultimatum"
 JAP_diplomacy.139.d: "Naypyidaw rejette la demande japonaise et refuse de livrer son avenir à une supervision extérieure. Le refus transforme la pression en confrontation, et Tokyo présente désormais le Myanmar comme un obstacle au contrôle des corridors qu'il faut ramener dans le rang.\n\nSi le Myanmar n'accepte pas le cadre par traité, le Japon cherchera à l'imposer par la force. La porte sera sécurisée d'une manière ou d'une autre."
 JAP_diplomacy.139.a: "Alors nous prendrons la porte."
 JAP_diplomacy.141.t: "L'ultimatum des hautes terres du Nord"
 JAP_diplomacy.141.d: "Le Japon a tourné son attention vers le Kachin, les hautes terres rugueuses du nord qui contrôlent cols, ressources et approches de la région plus large. La demande de Tokyo se présente comme protection et reconnaissance, mais la structure est un protectorat : s'aligner extérieurement sur le Japon, accepter la supervision de sécurité, et permettre un accès stratégique qui sécurise la frontière.\n\nPour le Kachin, c'est un choix entre l'autonomie de nom et l'anéantissement de fait. L'acceptation offre un bouclier. Le refus invite une guerre menée dans les montagnes et les villages."
 JAP_diplomacy.141.a: "Accepter. Nous avons besoin d'un patron pour survivre."
 JAP_diplomacy.141.b: "Refuser. Nous n'échangerons pas un maître pour un autre."
 JAP_diplomacy.143.t: "Kachin accepte la protection japonaise"
 JAP_diplomacy.143.d: "Le Kachin accepte les termes, choisissant survie et stabilité plutôt qu'un combat qu'il ne peut soutenir seul. Des accords sont signés, des bureaux de liaison sont établis, et le Japon gagne une emprise ferme sur les hautes terres du nord et leurs corridors stratégiques.\n\nLe conflit s'achève, mais la liberté du Kachin se rétrécit à ce qui est permis. Les montagnes demeurent, pourtant leur avenir est désormais lié à Tokyo."
 JAP_diplomacy.143.a: "Établir le protectorat."
 JAP_diplomacy.144.t: "Le Kachin rejette l'ultimatum"
 JAP_diplomacy.144.d: "Le Kachin rejette la demande japonaise et refuse de se soumettre à un mandat extérieur. Le refus transforme la coercition en confrontation, et Tokyo présente désormais les hautes terres comme un problème de sécurité à résoudre par la force.\n\nSi le Kachin n'accepte pas la protection par traité, le Japon imposera le contrôle par les armes. Les montagnes ne resteront pas neutres."
 JAP_diplomacy.144.a: "Alors nous prendrons les hautes terres."
 JAP_diplomacy.145.t: "La demande du corridor shan"
 JAP_diplomacy.145.d: "Le Japon a livré ses termes aux autorités Wa, visant les terres frontalières qui siègent sur les routes de contrebande, les cols et les artères de l'intérieur. L'offre se présente comme reconnaissance et protection, mais c'est un arrangement de protectorat : s'aligner extérieurement sur Tokyo, accepter la supervision de sécurité japonaise, et permettre un accès qui sécurise le corridor.\n\nPour les Wa, le choix est brutal. Se soumettre et garder le pouvoir local sous une nouvelle ombrelle, ou refuser et affronter une guerre qui ne respectera ni montagnes ni milices."
 JAP_diplomacy.145.a: "Accepter. Mieux vaut un bouclier que l'anéantissement."
 JAP_diplomacy.145.b: "Refuser. Nous ne serons pas absorbés."
 JAP_diplomacy.146.t: "Wa accepte la protection japonaise"
 JAP_diplomacy.146.d: "Les Wa acceptent les termes du Japon, échangeant l'indépendance stratégique contre la survie et une reconnaissance formelle sous un patron plus fort. Des équipes de liaison arrivent, les routes sont sécurisées, et les terres frontalières sont pliées dans le cadre régional japonais.\n\nLes combats s'achèvent, mais l'autonomie se rétrécit. Les Wa gardent l'autorité locale, pourtant leur direction extérieure répond désormais à Tokyo."
 JAP_diplomacy.146.a: "Établir le protectorat."
 JAP_diplomacy.147.t: "Les Wa rejettent la demande"
 JAP_diplomacy.147.d: "Les Wa rejettent l'ultimatum japonais et refusent de placer leur territoire sous supervision étrangère. Le refus transforme la pression en confrontation, et Tokyo traite désormais les terres frontalières comme une brèche incontrôlée dans sa stratégie de corridors.\n\nSi les Wa n'acceptent pas le cadre par traité, le Japon imposera le contrôle par la force. Les montagnes seront contestées."
 JAP_diplomacy.147.a: "Alors nous sécuriserons le corridor."
 JAP_diplomacy.148.t: "L'ultimatum de la porte shan"
 JAP_diplomacy.148.d: "Le Japon a émis sa demande aux autorités de l'État Shan du Sud, visant les routes des hautes terres qui relient l'intérieur à la région plus large. La proposition est un cadre de protectorat : aligner les affaires étrangères sur Tokyo, accepter la supervision de sécurité japonaise, et permettre un accès stratégique pour sécuriser routes, cols et corridors d'approvisionnement.\n\nL'offre promet protection et reconnaissance. Le sens est le contrôle. Le Shan du Sud doit décider d'accepter un avenir géré sous l'ombrelle du Japon ou de risquer une guerre menée à travers ses collines et ses vallées."
 JAP_diplomacy.148.a: "Accepter. Nous ne pouvons pas nous permettre l'anéantissement."
 JAP_diplomacy.148.b: "Refuser. Nous ne serons pas réduits à un corridor."
 JAP_diplomacy.149.t: "Rendements du Shan du Sud"
 JAP_diplomacy.149.d: "L'État Shan du Sud accepte les termes du Japon. Des bureaux de liaison sont établis, les routes sont sécurisées, et la région est pliée dans la stratégie de corridors de Tokyo comme porte contrôlée plutôt qu'acteur indépendant.\n\nLes combats s'achèvent, mais l'autonomie se contracte. L'autorité locale demeure, pourtant la direction stratégique répond désormais au Japon."
 JAP_diplomacy.149.a: "Établir le protectorat."
 JAP_diplomacy.150.t: "Le Shan du Sud rejette l'ultimatum"
 JAP_diplomacy.150.d: "L'État Shan du Sud rejette la demande japonaise et refuse de placer son avenir sous supervision étrangère. Le refus transforme la pression en confrontation, et Tokyo traite désormais la région comme une brèche dangereuse dans son périmètre stratégique.\n\nSi le Shan du Sud n'accepte pas le cadre par traité, le Japon l'imposera par la force. La porte sera sécurisée."
 JAP_diplomacy.150.a: "Alors nous prendrons la porte par les armes."
 JAP_diplomacy.151.t: "Le mandat de la Salouen"
 JAP_diplomacy.151.d: "Le Japon a tourné son regard vers l'État karen, où vallées fluviales et routes frontalières peuvent ouvrir ou fermer les approches du sud. La demande de Tokyo se présente comme protection et reconnaissance, mais c'est un cadre de protectorat : aligner les affaires extérieures sur le Japon, accepter la supervision de sécurité, et accorder un accès qui sécurise le corridor de la Salouen.\n\nL'offre promet la stabilité dans une région d'autorité fragmentée. Le coût est l'obéissance. L'État karen doit choisir entre une paix gardée sous l'ombrelle du Japon ou une guerre qui brûlera ses passages et ses peuplements."
 JAP_diplomacy.151.a: "Accepter. Nous vivrons pour voir demain."
 JAP_diplomacy.151.b: "Refuser. Nous ne serons pas gouvernés."
 JAP_diplomacy.152.t: "L'État Karen soumet"
 JAP_diplomacy.152.d: "L'État karen accepte les termes du Japon, échangeant l'autonomie stratégique contre la survie et la fin de la pression immédiate. Des missions de liaison arrivent, les routes sont sécurisées, et la région est pliée dans le périmètre de Tokyo comme corridor contrôlé plutôt qu'acteur indépendant.\n\nLe conflit s'achève, mais les limites de la liberté se rétrécissent. L'autorité karen reste locale, pourtant la direction stratégique répond désormais au Japon."
 JAP_diplomacy.152.a: "Établir le protectorat."
 JAP_diplomacy.153.t: "L'État karen rejette le mandat"
 JAP_diplomacy.153.d: "L'État karen rejette la demande japonaise et refuse de livrer son avenir à une supervision étrangère. Le refus transforme la coercition en confrontation, et Tokyo traite désormais les passages de la Salouen comme un problème stratégique à résoudre par la force.\n\nSi l'État karen n'accepte pas le cadre par traité, le Japon l'imposera par les armes. Le corridor sera sécurisé."
 JAP_diplomacy.153.a: "Alors nous saisirons les passages."
 JAP_diplomacy.154.t: "La demande du mouillage de Palaos"
 JAP_diplomacy.154.d: "Tokyo a livré sa demande à Palaos, un petit État assis sur un grand morceau d'océan. Les termes se présentent comme protection et prospérité garantie, mais la structure est un protectorat : aligner la politique étrangère sur le Japon, accepter la supervision de sécurité, et accorder des droits de base qui font de Palaos un mouillage avancé impérial.\n\nL'offre promet la sécurité face aux tempêtes politiques comme militaires. Le coût est la souveraineté. Palaos doit choisir entre la soumission sous le Soleil levant ou un combat qu'il ne peut soutenir contre la puissance maritime d'un grand État."
 JAP_diplomacy.154.a: "Accepter. Mieux vaut un protecteur qu'une tombe."
 JAP_diplomacy.154.b: "Refuser. Nous ne céderons pas notre indépendance."
 JAP_diplomacy.155.t: "Les Palaos acceptent la protection japonaise"
 JAP_diplomacy.155.d: "Palaos accepte les termes du Japon. Des accords sont signés, l'accès est accordé, et les îles deviennent un nœud discipliné dans le réseau de ports et d'aérodromes de Tokyo.\n\nLa crise s'achève sans bataille, mais le changement est réel. Palaos demeure de nom, pourtant sa direction extérieure suit désormais la boussole du Japon."
 JAP_diplomacy.155.a: "Établir le protectorat."
 JAP_diplomacy.156.t: "Palaos rejette la demande"
 JAP_diplomacy.156.d: "Palaos rejette l'ultimatum japonais et refuse d'échanger la souveraineté contre des promesses de protection. Le refus transforme la pression de Tokyo en question de force, et le Japon traite désormais les îles comme une brèche non sécurisée dans son périmètre océanique.\n\nSi Palaos n'accepte pas le cadre par traité, le Japon imposera le contrôle par les armes. Le mouillage sera sécurisé."
 JAP_diplomacy.156.a: "Alors nous prendrons le mouillage."
 JAP_diplomacy.157.t: "L'ultimatum de la chaîne micronésienne"
 JAP_diplomacy.157.d: "Le Japon a émis sa demande à la Micronésie, voyant les îles non comme des communautés éparses mais comme une chaîne de tremplins à travers le Pacifique central. L'offre se présente comme protection et investissement, pourtant la structure est un protectorat : aligner la politique étrangère sur Tokyo, accepter la supervision de sécurité, et accorder un accès qui fait des îles des points de passage pour la flotte et la puissance aérienne japonaises.\n\nLe message est simple. Ces eaux seront organisées sous une seule autorité. La Micronésie doit choisir entre une paix gérée sous l'ombrelle du Japon ou une confrontation qu'elle ne peut espérer soutenir."
 JAP_diplomacy.157.a: "Accepter. Nous ne pouvons pas résister à la marée."
 JAP_diplomacy.157.b: "Refuser. Nous ne deviendrons pas un avant-poste."
 JAP_diplomacy.158.t: "La Micronésie accepte la chaîne"
 JAP_diplomacy.158.d: "La Micronésie accepte les termes du Japon. Des accords sont signés, l'accès est accordé, et les îles deviennent un corridor contrôlé de ports, d'aérodromes et de nœuds de surveillance dans le périmètre maritime de Tokyo.\n\nLa crise s'achève sans bataille, mais la souveraineté se rétrécit. La Micronésie demeure, pourtant sa direction extérieure suit désormais la boussole stratégique du Japon."
 JAP_diplomacy.158.a: "Établir le protectorat."
 JAP_diplomacy.159.t: "La Micronésie rejette l'ultimatum"
 JAP_diplomacy.159.d: "La Micronésie rejette la demande japonaise et refuse de livrer son avenir à une supervision étrangère. Le refus transforme la pression en confrontation, et Tokyo traite désormais la chaîne d'îles comme une brèche dans son réseau pacifique qu'il faut fermer.\n\nSi la Micronésie n'accepte pas le cadre par traité, le Japon imposera le contrôle par la force. La chaîne sera sécurisée."
 JAP_diplomacy.159.a: "Alors nous prendrons les tremplins."
 JAP_diplomacy.160.t: "La demande de l'avant-poste de Nauru"
 JAP_diplomacy.160.d: "Tokyo a livré sa demande à Nauru, traitant l'île comme une punaise sur la carte qui peut encore ancrer surveillance, ravitaillement et portée à travers les eaux libres. L'offre se présente comme protection et soutien garanti, mais c'est un cadre de protectorat : aligner la politique étrangère sur le Japon, accepter la supervision de sécurité, et accorder un accès qui fait de Nauru un avant-poste impérial.\n\nPour Nauru, le choix est tranchant. Se soumettre et survivre sous une puissance plus grande, ou refuser et risquer de devenir le champ de bataille qui prouve le point du Japon."
 JAP_diplomacy.160.a: "Accepter. Nous ne pouvons pas tenir seuls."
 JAP_diplomacy.160.b: "Refuser. Nous ne serons pas réduits à un point de passage."
 JAP_diplomacy.161.t: "Nauru accepte la protection japonaise"
 JAP_diplomacy.161.d: "Nauru accepte les termes du Japon. Des accords sont signés, l'accès est accordé, et l'île devient un nœud petit mais vital du réseau pacifique de Tokyo.\n\nLa crise s'achève sans bataille, mais la souveraineté se rétrécit. Nauru demeure, pourtant sa direction extérieure suit désormais la ligne stratégique du Japon."
 JAP_diplomacy.161.a: "Établir le protectorat."
 JAP_diplomacy.162.t: "Nauru rejette la demande"
 JAP_diplomacy.162.d: "Nauru rejette l'ultimatum japonais et refuse d'échanger l'indépendance contre des promesses de protection. Le refus transforme la pression en confrontation, et Tokyo traite désormais l'île comme une brèche non sécurisée dans son périmètre océanique.\n\nSi Nauru n'accepte pas le cadre par traité, le Japon imposera le contrôle par la force. L'avant-poste sera sécurisé."
 JAP_diplomacy.162.a: "Alors nous prendrons l'île."
 JAP_diplomacy.163.t: "L'ultimatum de la ligne équatoriale"
 JAP_diplomacy.163.d: "Le Japon a émis sa demande à Kiribati, un État éparpillé sur l'équateur comme des marques sur la carte d'un navigateur. La proposition de Tokyo se présente comme protection et développement, mais c'est un cadre de protectorat : aligner la politique étrangère sur le Japon, accepter la supervision de sécurité, et accorder un accès qui fait de Kiribati une chaîne de points de passage pour la surveillance et la portée navale.\n\nLe message est simple. Dans le nouvel ordre du Pacifique, il n'y a plus d'espaces vides. Kiribati doit choisir entre la soumission sous l'ombrelle du Japon ou la confrontation contre une puissance qui entend posséder les routes maritimes."
 JAP_diplomacy.163.a: "Accepter. Nous ne pouvons résister au nouveau maître de l'océan."
 JAP_diplomacy.163.b: "Refuser. Nous ne serons pas absorbés dans un empire."
 JAP_diplomacy.164.t: "Kiribati accepte la ligne équatoriale"
 JAP_diplomacy.164.d: "Kiribati accepte les conditions du Japon. Des accords sont signés, l'accès est accordé, et les atolls dispersés deviennent une part discrète mais précieuse du réseau pacifique de Tokyo.\n\nLa crise s'achève sans bataille, mais la souveraineté se rétrécit. Kiribati demeure, pourtant sa direction extérieure suit désormais le compas du Japon."
 JAP_diplomacy.164.a: "Établir le protectorat."
 JAP_diplomacy.165.t: "Kiribati rejette l'ultimatum"
 JAP_diplomacy.165.d: "Kiribati rejette l'ultimatum japonais et refuse de livrer son avenir à une tutelle étrangère. Le refus transforme la pression en confrontation, et Tokyo traite désormais la chaîne équatoriale comme une brèche dans son périmètre maritime.\n\nSi Kiribati n'accepte pas le cadre par traité, le Japon imposera le contrôle par la force. La ligne sera assurée."
 JAP_diplomacy.165.a: "Alors nous prendrons la chaîne."
 JAP_diplomacy.166.t: "L'exigence du bastion des atolls"
 JAP_diplomacy.166.d: "Tokyo a adressé son exigence aux îles Marshall, voyant dans les atolls des forteresses naturelles capables d'accueillir aérodromes, logistique et instruments de contrôle de la mer. L'offre se présente comme protection et soutien garanti, mais c'est un cadre de protectorat : aligner la politique étrangère sur le Japon, accepter une supervision de sécurité, et accorder un accès qui transforme les Marshall en bastions du périmètre japonais du Pacifique central.\n\nLe message est clair. Ces îles ne resteront pas des points neutres sur une carte. Les Marshall doivent choisir entre une paix gérée sous le parapluie japonais ou une guerre livrée sur le corail et les pistes."
 JAP_diplomacy.166.a: "Accepter. Nous ne survivrons pas à un siège."
 JAP_diplomacy.166.b: "Refuser. Nous ne deviendrons pas une forteresse pour une autre puissance."
 JAP_diplomacy.167.t: "Les Marshall cèdent"
 JAP_diplomacy.167.d: "Les îles Marshall acceptent les conditions du Japon. Des accords sont signés, l'accès est accordé, et les atolls deviennent des bastions disciplinés au sein du réseau océanique de Tokyo.\n\nLa crise s'achève sans bataille, mais la souveraineté se rétrécit. Les Marshall demeurent, pourtant leur direction extérieure suit désormais le plan de périmètre japonais."
 JAP_diplomacy.167.a: "Établir le protectorat."
 JAP_diplomacy.168.t: "Les Marshall rejettent l'exigence"
 JAP_diplomacy.168.d: "Les îles Marshall rejettent l'ultimatum japonais et refusent de livrer leur avenir à une tutelle étrangère. Le refus transforme la pression en confrontation, et Tokyo traite désormais les atolls comme une brèche non assurée dans sa ligne de défense du Pacifique central.\n\nSi les Marshall n'acceptent pas le cadre par traité, le Japon imposera le contrôle par la force. Les bastions seront assurés."
 JAP_diplomacy.168.a: "Alors nous prendrons les atolls."
 JAP_diplomacy.169.t: "L'ultimatum de la ligne de récifs"
 JAP_diplomacy.169.d: "Le Japon a adressé son exigence à Tuvalu, une mince chaîne de récifs qui compte encore dans un océan mesuré à l'aune de la portée et des points de ravitaillement. Tokyo offre protection et soutien, mais la structure est un cadre de protectorat : aligner la politique étrangère sur le Japon, accepter une supervision de sécurité, et accorder un accès qui transforme Tuvalu en point d'étape du périmètre méridional japonais.\n\nLe message est d'une brutalité simple. Il n'y aura plus d'îles neutres dans un Pacifique contesté. Tuvalu doit choisir entre la soumission sous le parapluie japonais ou une confrontation qui noierait un petit État dans une guerre de grandes puissances."
 JAP_diplomacy.169.a: "Accepter. Nous ne tiendrons pas un orage d'acier."
 JAP_diplomacy.169.b: "Refuser. Nous ne livrerons pas notre drapeau."
 JAP_diplomacy.170.t: "Tuvalu accepte la protection japonaise"
 JAP_diplomacy.170.d: "Tuvalu accepte les conditions du Japon. Des accords sont signés, l'accès est accordé, et les îles deviennent un nœud discret du réseau maritime de Tokyo.\n\nLa crise s'achève sans bataille, mais la souveraineté se rétrécit. Tuvalu demeure, pourtant sa direction extérieure suit désormais le plan de périmètre japonais."
 JAP_diplomacy.170.a: "Établir le protectorat."
 JAP_diplomacy.171.t: "Tuvalu rejette l'ultimatum"
 JAP_diplomacy.171.d: "Tuvalu rejette l'ultimatum japonais et refuse d'échanger l'indépendance contre des promesses de protection. Le refus transforme la pression en confrontation, et Tokyo traite désormais la ligne de récifs comme une brèche non assurée dans sa chaîne méridionale.\n\nSi Tuvalu n'accepte pas le cadre par traité, le Japon imposera le contrôle par la force. Le point d'étape sera assuré."
 JAP_diplomacy.171.a: "Alors nous prendrons les îles."
 JAP_diplomacy.172.t: "L'ultimatum de la barrière des Salomon"
 JAP_diplomacy.172.d: "Tokyo a adressé son exigence aux îles Salomon, voyant dans la chaîne une barrière naturelle capable de sceller le Pacifique sud-ouest. L'offre se présente comme protection et développement, mais c'est un cadre de protectorat : aligner la politique étrangère sur le Japon, accepter une supervision de sécurité, et accorder un accès de bases qui transforme les Salomon en écran fortifié du périmètre maritime japonais.\n\nLe message est clair. Ces îles serviront l'ordre japonais ou seront traitées comme un pied-à-terre ennemi. Les Salomon doivent choisir entre la soumission sous le Soleil levant ou une guerre livrée à travers pistes de jungle et mers étroites."
 JAP_diplomacy.172.a: "Accepter. Nous ne survivrons pas à un blocus."
 JAP_diplomacy.172.b: "Refuser. Nous ne deviendrons pas une forteresse pour un autre empire."
 JAP_diplomacy.173.t: "Les Salomon cèdent"
 JAP_diplomacy.173.d: "Les îles Salomon acceptent les conditions du Japon. Des accords sont signés, l'accès est accordé, et la chaîne devient une barrière disciplinée de ports, d'aérodromes et de zones de patrouille sous la direction de Tokyo.\n\nLa crise s'achève sans bataille, mais la souveraineté se rétrécit. Les Salomon demeurent, pourtant leur alignement extérieur suit désormais le plan de périmètre japonais."
 JAP_diplomacy.173.a: "Établir le protectorat."
 JAP_diplomacy.174.t: "Les Salomon rejettent l'ultimatum"
 JAP_diplomacy.174.d: "Les îles Salomon rejettent l'exigence japonaise et refusent de livrer leur avenir à une tutelle étrangère. Le refus transforme la pression en confrontation, et Tokyo traite désormais la chaîne comme une brèche dangereuse dans son écran du Pacifique sud-ouest.\n\nSi les Salomon n'acceptent pas le cadre par traité, le Japon imposera le contrôle par la force. La barrière sera assurée."
 JAP_diplomacy.174.a: "Alors nous saisirons la chaîne."
 JAP_diplomacy.175.t: "L'ultimatum du bastion de Nouvelle-Guinée"
 JAP_diplomacy.175.d: "Le Japon a adressé son exigence à la Papouasie-Nouvelle-Guinée, traitant l'île comme un bastion continental capable de dominer les approches entre l'Asie du Sud-Est et le Pacifique. L'offre se présente comme protection et soutien garanti, mais c'est un cadre de protectorat : aligner la politique étrangère sur Tokyo, accepter une supervision de sécurité, et accorder un accès de bases qui transforme la Nouvelle-Guinée en forteresse de puissance aérienne, de logistique et de défense avancée.\n\nLe message laisse peu de doute. Le Japon entend ancrer ici le théâtre méridional. La Papouasie-Nouvelle-Guinée doit choisir entre la soumission sous le bouclier japonais ou une guerre qui fera de ses côtes et de ses hauts plateaux des lignes de front."
 JAP_diplomacy.175.a: "Accepter. Nous ne pouvons nous permettre de devenir un champ de bataille."
 JAP_diplomacy.175.b: "Refuser. Nous ne serons pas transformés en forteresse pour une autre puissance."
 JAP_diplomacy.176.t: "Port Moresby accepte"
 JAP_diplomacy.176.d: "La Papouasie-Nouvelle-Guinée accepte les conditions du Japon. Des accords sont signés, l'accès est accordé, et l'île devient un bastion discipliné au sein du périmètre méridional de Tokyo, articulé autour d'aérodromes, de ports et de nœuds logistiques.\n\nLa crise s'achève sans bataille, mais la souveraineté se rétrécit. La Papouasie-Nouvelle-Guinée demeure, pourtant sa direction stratégique suit désormais le plan de forteresse japonais."
 JAP_diplomacy.176.a: "Établir le protectorat."
 JAP_diplomacy.177.t: "La Papouasie-Nouvelle-Guinée rejette l'ultimatum"
 JAP_diplomacy.177.d: "La Papouasie-Nouvelle-Guinée rejette l'exigence japonaise et refuse de livrer son avenir à une tutelle étrangère. Le refus transforme la pression en confrontation, et Tokyo traite désormais l'île comme l'obstacle décisif à la sécurisation du théâtre méridional.\n\nSi la Papouasie-Nouvelle-Guinée n'accepte pas le cadre par traité, le Japon imposera le contrôle par la force. Le bastion sera pris."
 JAP_diplomacy.177.a: "Alors nous saisirons le bastion."
 JAP_diplomacy.178.t: "L'exigence de la chaîne du Pacifique Sud"
 JAP_diplomacy.178.d: "Tokyo a adressé son exigence au Vanuatu, traitant les îles comme un nouveau maillon de la chaîne capable de sceller le Pacifique sud-ouest. L'offre se présente comme protection et aide au développement, mais c'est un cadre de protectorat : aligner la politique étrangère sur le Japon, accepter une supervision de sécurité, et accorder un accès qui transforme le Vanuatu en point d'étape pour patrouilles, ravitaillement et contrôle régional.\n\nLe message est clair. Le Japon construit un périmètre, île par île. Le Vanuatu doit choisir entre une paix gérée sous le Soleil levant ou une confrontation qu'il ne peut espérer soutenir."
 JAP_diplomacy.178.a: "Accepter. Nous ne pouvons combattre un empire en mer."
 JAP_diplomacy.178.b: "Refuser. Nous ne serons pas absorbés."
 JAP_diplomacy.179.t: "Vanuatu accepte la protection japonaise"
 JAP_diplomacy.179.d: "Le Vanuatu accepte les conditions du Japon. Des accords sont signés, l'accès est accordé, et les îles deviennent un nœud discret mais utile au sein du périmètre méridional de Tokyo.\n\nLa crise s'achève sans bataille, mais la souveraineté se rétrécit. Le Vanuatu demeure, pourtant sa direction extérieure suit désormais la ligne stratégique japonaise."
 JAP_diplomacy.179.a: "Établir le protectorat."
 JAP_diplomacy.180.t: "Le Vanuatu rejette l'exigence"
 JAP_diplomacy.180.d: "Le Vanuatu rejette l'ultimatum japonais et refuse d'échanger l'indépendance contre des promesses de protection. Le refus transforme la pression en confrontation, et Tokyo traite désormais les îles comme une brèche non assurée dans sa chaîne du Pacifique sud-ouest.\n\nSi le Vanuatu n'accepte pas le cadre par traité, le Japon imposera le contrôle par la force. Le maillon sera assuré."
 JAP_diplomacy.180.a: "Alors nous prendrons les îles."
 JAP_diplomacy.181.t: "L'ultimatum de la clé de voûte du Pacifique Sud"
 JAP_diplomacy.181.d: "Le Japon a adressé son exigence aux Fidji, traitant les îles comme un hub capable de soutenir la logistique de flotte et les opérations aériennes sur un large arc du Pacifique Sud. L'offre se présente comme protection et soutien garanti, mais c'est un cadre de protectorat : aligner la politique étrangère sur Tokyo, accepter une supervision de sécurité, et accorder un accès de bases qui transforme les Fidji en clé de voûte du périmètre méridional japonais.\n\nLe message est sans équivoque. Le Japon ne cherche pas des amis, il construit un ordre. Les Fidji doivent choisir entre une paix gérée sous le parapluie japonais ou une confrontation que tranchera la puissance navale."
 JAP_diplomacy.181.a: "Accepter. Nous ne pouvons nous permettre de servir d'exemple."
 JAP_diplomacy.181.b: "Refuser. Les Fidji ne se soumettront pas."
 JAP_diplomacy.182.t: "Les Fidji acceptent les conditions de la clé de voûte"
 JAP_diplomacy.182.d: "Les Fidji acceptent l'ultimatum japonais. Des accords sont signés, l'accès est accordé, et les îles deviennent un nœud central du réseau sud-pacifique de Tokyo — ports, aérodromes et zones de patrouille.\n\nLa crise s'achève sans bataille, mais la souveraineté se rétrécit. Les Fidji demeurent, pourtant leur direction extérieure suit désormais le plan de périmètre japonais."
 JAP_diplomacy.182.a: "Établir le protectorat."
 JAP_diplomacy.183.t: "Les Fidji rejettent l'ultimatum"
 JAP_diplomacy.183.d: "Les Fidji rejettent l'exigence japonaise et refusent de livrer leur avenir à une tutelle étrangère. Le refus transforme la pression en confrontation, et Tokyo traite désormais les îles comme la dernière brèche d'un périmètre méridional qu'il entend refermer.\n\nSi les Fidji n'acceptent pas le cadre par traité, le Japon imposera le contrôle par la force. La clé de voûte sera assurée."
 JAP_diplomacy.183.a: "Alors nous prendrons le hub."
 JAP_diplomacy.184.t: "L'ultimatum de la ligne des Samoa"
 JAP_diplomacy.184.d: "Tokyo a adressé son exigence aux Samoa, traitant les îles comme un pivot entre le Pacifique central et les approches méridionales. L'offre se présente comme protection et soutien garanti, mais c'est un cadre de protectorat : aligner la politique étrangère sur le Japon, accepter une supervision de sécurité, et accorder un accès qui transforme les Samoa en point d'étape du périmètre océanique en expansion du Japon.\n\nLe message est brutal. Le Japon trace des lignes à travers la mer, et les Samoa en occupent une. L'acceptation offre la sécurité sous une puissance plus grande ; le refus risque de devenir la leçon qui convaincra les autres."
 JAP_diplomacy.184.a: "Accepter. Nous survivrons, même s'il faut se soumettre."
 JAP_diplomacy.184.b: "Refuser. Les Samoa ne s'inclineront pas."
 JAP_diplomacy.185.t: "Les Samoa acceptent la protection japonaise"
 JAP_diplomacy.185.d: "Les Samoa acceptent l'ultimatum japonais. Des accords sont signés, l'accès est accordé, et les îles deviennent un nœud discret mais utile du réseau pacifique de Tokyo.\n\nLa crise s'achève sans bataille, mais la souveraineté se rétrécit. Les Samoa demeurent, pourtant leur direction extérieure suit désormais la ligne stratégique japonaise."
 JAP_diplomacy.185.a: "Établir le protectorat."
 JAP_diplomacy.186.t: "Les Samoa rejettent l'ultimatum"
 JAP_diplomacy.186.d: "Les Samoa rejettent l'exigence japonaise et refusent d'échanger l'indépendance contre des promesses de protection. Le refus transforme la pression en confrontation, et Tokyo traite désormais les îles comme une brèche non assurée dans son périmètre océanique.\n\nSi les Samoa n'acceptent pas le cadre par traité, le Japon imposera le contrôle par la force. La ligne sera assurée."
 JAP_diplomacy.186.a: "Alors nous prendrons les îles."
 JAP_diplomacy.187.t: "L'exigence de la couronne tongienne"
 JAP_diplomacy.187.d: "Tokyo a adressé son exigence aux Tonga, un royaume dont les ports et les routes maritimes se situent sur l'arc méridional du Pacifique. L'offre se présente comme protection et partenariat, mais c'est un cadre de protectorat : aligner la politique étrangère sur le Japon, accepter une supervision de sécurité, et accorder un accès qui transforme les Tonga en point d'étape du périmètre maritime en expansion du Japon.\n\nLe message est clair. Le Japon construit un ordre océanique qui ne laisse aucune place aux pivots indépendants. Les Tonga doivent choisir entre une paix gardée sous l'ombre japonaise ou une confrontation tranchée par les flottes."
 JAP_diplomacy.187.a: "Accepter. Nous garderons la couronne, même sous une ombre."
 JAP_diplomacy.187.b: "Refuser. Les Tonga ne se soumettront pas."
 JAP_diplomacy.188.t: "Les Tonga acceptent la protection japonaise"
 JAP_diplomacy.188.d: "Les Tonga acceptent les conditions du Japon. Des accords sont signés, l'accès est accordé, et le royaume devient un nœud discipliné du réseau méridional de Tokyo.\n\nLa crise s'achève sans bataille, mais la souveraineté se rétrécit. Les Tonga demeurent, pourtant leur direction extérieure suit désormais la ligne stratégique japonaise."
 JAP_diplomacy.188.a: "Établir le protectorat."
 JAP_diplomacy.189.t: "Les Tonga rejettent l'exigence"
 JAP_diplomacy.189.d: "Les Tonga rejettent l'ultimatum japonais et refusent de placer leur avenir sous une tutelle étrangère. Le refus transforme la pression en confrontation, et Tokyo traite désormais le royaume comme une brèche non assurée dans son arc méridional.\n\nSi les Tonga n'acceptent pas le cadre par traité, le Japon imposera le contrôle par la force. Le point d'étape sera assuré."
 JAP_diplomacy.189.a: "Alors nous prendrons les îles."
 JAP_diplomacy.190.t: "Avis à Washington : retrait du Pacifique"
 JAP_diplomacy.190.d: "Tokyo a adressé à Washington une exigence formelle de transfert des principales îles pacifiques tenues par les Américains. Le message est brutal : les pieds-à-terre étrangers dans le périmètre océanique japonais ne sont plus tolérés, et ces avant-postes doivent être cédés pour éviter une nouvelle escalade.\n\nL'exigence se présente comme une chance d'éviter la guerre, mais c'est aussi une épreuve de volonté. Accepter et concéder les tremplins de la puissance, ou refuser et risquer de faire du Pacifique un champ de bataille entre géants."
 JAP_diplomacy.190.a: "Accepter le transfert."
 JAP_diplomacy.190.b: "Refuser. Le Pacifique n'est pas à eux."
 JAP_diplomacy.191.t: "Washington cède les avant-postes"
 JAP_diplomacy.191.d: "Contre toute attente, les États-Unis acceptent l'exigence. Les îles sont transférées, les bases évacuées, et le périmètre maritime japonais s'étend d'un seul trait.\n\nLa crise s'achève sans guerre, mais le sens est sans équivoque. Une grande puissance a reculé, et l'équilibre du Pacifique penche vers Tokyo."
 JAP_diplomacy.191.a: "Assurer les îles."
 JAP_diplomacy.192.t: "Washington refuse"
 JAP_diplomacy.192.d: "Les États-Unis rejettent l'exigence japonaise et refusent de livrer leurs pieds-à-terre pacifiques. Le refus transforme l'ultimatum de Tokyo en confrontation directe entre puissances, et le Japon a désormais justification et motif pour chercher les avant-postes par la force.\n\nLe Pacifique se resserre en lignes de front. Si ces îles ne sont pas cédées par traité, elles le seront par la guerre."
 JAP_diplomacy.192.a: "Alors nous les revendiquons par la force."
 JAP_diplomacy.193.t: "Ultimatum à Paris : le Pacifique doit être vidé"
 JAP_diplomacy.193.d: "Tokyo a adressé à Paris une exigence formelle de transfert des possessions insulaires françaises du Pacifique. La note s'enveloppe d'un langage poli, mais son sens est sans équivoque : les empires lointains ne conserveront plus de pieds-à-terre à l'intérieur du périmètre océanique japonais.\n\nLe Japon offre un étroit chemin pour éviter l'escalade. La France peut se retirer à l'encre et aux signatures, ou refuser et accepter que le différend soit tranché par les flottes plutôt que par les diplomates."
 JAP_diplomacy.193.a: "Accepter le transfert."
 JAP_diplomacy.193.b: "Refuser. La France ne se laissera pas chasser."
 JAP_diplomacy.194.t: "Paris se retire du Pacifique"
 JAP_diplomacy.194.d: "La France accepte l'exigence japonaise. Les drapeaux sont abaissés, les garnisons reçoivent l'ordre de partir, et les îles passent sous le contrôle de Tokyo.\n\nLa crise s'achève sans guerre, mais le message résonne dans le monde. Le Japon ne négocie pas une sphère, il en impose une."
 JAP_diplomacy.194.a: "Assurer les îles."
 JAP_diplomacy.195.t: "Paris refuse"
 JAP_diplomacy.195.d: "La France rejette l'ultimatum japonais et refuse de livrer ses possessions pacifiques. Le refus transforme l'exigence de Tokyo en confrontation directe, et le Japon a désormais la justification pour revendiquer les îles par la force.\n\nL'océan se rétrécit lorsque les grandes puissances s'affrontent. Si la France ne se retire pas par traité, le Japon tentera de la chasser par la guerre."
 JAP_diplomacy.195.a: "Alors nous les saisirons."
 JAP_diplomacy.196.t: "Avis à Londres : cédez la possession du Pacifique"
 JAP_diplomacy.196.d: "Tokyo a adressé à Londres une exigence formelle de transfert de la dernière possession insulaire britannique du Pacifique. La note parle de stabilité régionale et de la fin des ingérences lointaines, mais son objet est clair : le Japon entend chasser les drapeaux étrangers de l'océan qu'il prétend désormais policer.\n\nLa Grande-Bretagne se voit offrir le choix entre un retrait ordonné et une guerre inutile loin de chez elle. Accepter, et l'affaire s'achève sur le papier. Refuser, et le Pacifique devient encore un théâtre où les empires éprouvent leur volonté."
 JAP_diplomacy.196.a: "Accepter le transfert."
 JAP_diplomacy.196.b: "Refuser. La Grande-Bretagne ne se laissera pas chasser."
 JAP_diplomacy.197.t: "Londres prend du recul"
 JAP_diplomacy.197.d: "Le Royaume-Uni accepte l'exigence japonaise. Le territoire est transféré, le drapeau est abaissé, et Tokyo ajoute une pièce de plus à son périmètre maritime imposé.\n\nLa crise s'achève sans guerre, mais le symbole est lourd. Une vieille puissance maritime a cédé du terrain, et la revendication japonaise sur le Pacifique s'enhardit à chaque concession."
 JAP_diplomacy.197.a: "Assurer le territoire."
 JAP_diplomacy.198.t: "Londres refuse l'exigence"
 JAP_diplomacy.198.d: "La Grande-Bretagne rejette l'ultimatum japonais et refuse de livrer sa possession pacifique. Le refus transforme l'exigence de Tokyo en défi direct, et le Japon a désormais motif et prétexte pour saisir le territoire par la force.\n\nLa diplomatie a atteint sa limite. Si la Grande-Bretagne ne se retire pas par traité, le Japon tentera de l'en chasser par la guerre."
 JAP_diplomacy.198.a: "Alors nous le prendrons."
 JAP_diplomacy.199.t: "Les canaux japonais s'étendent à Pyongyang"
 JAP_diplomacy.199.d: "La politique japonaise envers le Nord est entrée dans une nouvelle phase. Par des intermédiaires, des contacts de renseignement et une pression soigneusement dosée, Tokyo a ouvert dans notre environnement politique des canaux jusqu'alors limités ou fermés.\n\nCela ne signifie ni confiance ni alignement. Cela signifie que le Japon a désormais une occasion temporaire de façonner des décisions, d'influencer des factions et d'éprouver notre résolution de l'intérieur autant que de l'extérieur."
 JAP_diplomacy.199.a: "Nous surveillerons ces canaux de près."
 JAP_diplomacy.200.t: "Sakhaline et les Kouriles perdues"
 JAP_diplomacy.200.d: "Les forces russes ont repris le plein contrôle de Sakhaline et des îles Kouriles, inversant tous les gains de la campagne. L'opération s'est effondrée, et Tokyo ne peut plus soutenir l'effort. Un cessez-le-feu est la seule option qui reste.\n\nL'échec portera des conséquences. La confiance du public dans le jugement militaire du gouvernement a été ébranlée, et le coût politique de cette mésaventure se fera sentir pendant des années."
 JAP_diplomacy.200.a: "Nous n'avons d'autre choix que d'accepter la défaite."
 JAP_failed_sakhalin_war: "Lendemain de la guerre de Sakhaline"
 JAP_failed_sakhalin_war_desc: "La campagne militaire manquée sur Sakhaline et les Kouriles a laissé de profondes cicatrices sur le paysage politique japonais. La confiance du public dans la compétence stratégique du gouvernement s'est érodée, le moral militaire a souffert, et les retombées diplomatiques continuent de restreindre les options de politique étrangère de Tokyo."
 JAP_mars_colony1: "Colonie martienne Amaterasu"
 JAP_mars_colony1_desc: "Nommée d'après Amaterasu, la déesse du soleil qui illumine les cieux, la colonie martienne « Amaterasu » se dresse comme un symbole rayonnant de l'unité et du leadership du Japon. Sa présence inspire confiance au pays et respect à l'étranger."
 JAP_mars_colony2: "Colonie martienne Kagutsuchi"
 JAP_mars_colony2_desc: "Nommée d'après Kagutsuchi, le dieu du feu, la colonie martienne « Kagutsuchi » s'articule autour de fourneaux, de raffineries et d'industrie lourde. Son objet est clair : transformer minerai et énergie martiens en force pour les usines du Japon."
 JAP_mars_colony3: "Colonie martienne Tsukuyomi"
 JAP_mars_colony3_desc: "Nommée d'après Tsukuyomi, le dieu de la lune et de la nuit, la colonie martienne « Tsukuyomi » sert d'observatoire discret et de complexe de recherche. De ses laboratoires et instruments, les données refluent vers le Japon, approfondissant la compréhension scientifique."
 JAP_mars_colony4: "Colonie martienne Susanoo"
 JAP_mars_colony4_desc: "Nommée d'après Susanoo, la divinité porteuse d'orages, la colonie martienne « Susanoo » est façonnée en avant-poste de frontière rude. Terrains d'entraînement et polygones expérimentaux en font un creuset pour les forces armées et les doctrines du Japon."
 JAP_american_pressure_article_nine: "Sous la pression des tarifs douaniers américains"
 JAP_JP_USA_SOFA_1: "Cadre SOFA nippo-américain"
 JAP_JP_USA_SOFA_1_desc: "Les forces américaines au Japon opèrent sous un accord sur le statut des forces qui soustrait la plupart du personnel aux tribunaux et impôts japonais, et donne aux États-Unis un large contrôle sur leurs bases. Police locale, gouverneurs et habitants doivent composer avec des règles négociées à Washington et à Tokyo, et chaque crime, accident ou plainte de bruit près d'une base passe par les procédures du SOFA avant que le Japon puisse agir."
 JAP_maritime_heavy_industry_corridor: "Corridor de l’industrie lourde maritime"
 JAP_maritime_heavy_industry_corridor_desc: "Le Japon développe une ceinture continue de chantiers navals, d'aciéries et d'entreprises d'ingénierie marine le long de régions côtières clés. Concentrer l'investissement dans ce corridor accroît la capacité de construction et d'entretien des navires de guerre, sous-marins et bâtiments de soutien, renforçant l'épine industrielle de la flotte."
 JAP_moon_base_completed: "Création de la base lunaire de Kaguya"
 JAP_usa_article_nine_refused: "Modification de l’interprétation de l’article 9 refusée"
 JAP_diplomacy_shortcut: "Diplomatie"
 JAP_political: "Politique"
 JAP_economy: "Économie"
 JAP_military: "Armée"
 JAP_monarchism: "Monarchiste"
 JAP_great_east_japan_earthquake_shortcut: "Grand tremblement de terre à l'est du Japon"
 JAP_article_nine_remove_flag: "L'article 9 a été abrogé"
 JAP_usa_article_nine_accepted: "Modification acceptée de l'interprétation de l'article 9"
 JAP_tokyo_startup_special_zone: "Zone spéciale pour les startups de Tokyo"
 JAP_tokyo_startup_special_zone_desc: "Nous concentrerons déréglementation, soutien au capital-risque et incitations à l'investissement dans l'aire métropolitaine de Tokyo pour favoriser la création de start-up et leur commercialisation."
 JAP_tokyo_startup_special_zone_idea: "Zone spéciale pour les startups de Tokyo"
 JAP_tokyo_startup_special_zone_idea_desc: "Tokyo a été désignée zone spéciale de réforme réglementaire pour soutenir les start-up, le capital-risque et la création d'entreprises. En concentrant déréglementation, accès à l'investissement et soutien à la commercialisation dans la région capitale, le gouvernement vise à transformer une réforme limitée en moteur visible de croissance."
 JAP_kansai_medical_special_zone: "Zone d'innovation médicale du Kansai"
 JAP_kansai_medical_special_zone_desc: "Nous créerons une zone spéciale d'innovation médicale, de soins et de sciences de la vie dans le Kansai, accélérant l'investissement privé et la mise en œuvre concrète."
 JAP_kansai_medical_special_zone_idea: "Zone d'innovation médicale du Kansai"
 JAP_kansai_medical_special_zone_idea_desc: "Le Kansai est développé comme zone spéciale d'innovation médicale, de soins et de sciences de la vie par une flexibilité réglementaire et un investissement ciblé."
 JAP_kyushu_logistics_special_zone: "Zone spéciale logistique et portuaire de Kyushu"
 JAP_kyushu_logistics_special_zone_desc: "Nous simplifierons la logistique et les procédures portuaires à Kyushu, renforçant les flux commerciaux et l'efficacité de l'industrie régionale."
 JAP_kyushu_logistics_special_zone_idea: "Zone spéciale logistique et portuaire de Kyushu"
 JAP_kyushu_logistics_special_zone_idea_desc: "Kyushu a été désignée zone de réforme logistique et portuaire pour améliorer l'efficacité commerciale et la connectivité régionale. Procédures allégées, priorisation des infrastructures et assouplissement réglementaire visent à renforcer la capacité d'exportation et à rendre la région plus attractive pour l'industrie et le commerce."
 JAP_expand_special_zones_nationwide: "Étendre les zones spéciales à l’échelle nationale"
 JAP_expand_special_zones_nationwide_desc: "Les résultats obtenus dans des zones stratégiques sélectionnées seront étendus à l'échelle nationale, transformant la réforme réglementaire d'une exception limitée en un cadre de croissance plus large."
 JAP_tokyo_startup_special_zone_active: "Exécuté : §Y$JAP_tokyo_startup_special_zone$§!"
 JAP_kansai_medical_special_zone_active: "Exécuté : §Y$JAP_kansai_medical_special_zone$§!"
 JAP_kyushu_logistics_special_zone_active: "Exécuté : §Y$JAP_kyushu_logistics_special_zone$§!"
 JAP_expand_special_zones_nationwide_done: "Exécuté : §Y$JAP_expand_special_zones_nationwide$§!"
 JAP_japanese_economy_decisions: "Le déficit de demande enraciné"
 JAP_japanese_economy_decisions_desc: "Two decades of falling prices taught Japanese households and firms to wait. Wages sit flat, companies hoard cash rather than invest, and every yen of stimulus is saved instead of spent. The economy is not collapsing; it is simply refusing to move.\n\n§YWhat you can do§!\nThe decisions below are the demand levers. Announcing a price target, cutting consumption tax, transferring cash to households, funding public investment and pushing durable goods purchases each raise §YDemand Recovery Progress§!. The focuses of the demand branch unlock those levers, and §Y$JAP_active_public_investment$§! and §Y$JAP_improvement_private_investment_climate$§! each add to it directly.\n\n§YDemand Recovery Progress§!: [?JAP_demand_recovery_progress|0] / 100\n\n§GThresholds§!\n§G30§!: §Y$JAP_entrenched_demand_shortfall_idea_1$§! eases into §Y$JAP_entrenched_demand_shortfall_idea_2$§!.\n§G60§!: it eases again into §Y$JAP_entrenched_demand_shortfall_idea_3$§!.\n§G85§!: the spirit is removed and Japan's economic growth accelerates.\n\n§RWarning§!: this progress never decays, but nothing raises it on its own either. Take no decisions and Japan stays in the slump indefinitely."
 JAP_entrenched_demand_shortfall_idea_2: "Reprise lente de la demande"
 JAP_entrenched_demand_shortfall_idea_2_desc: "Des cibles de prix plus claires et un soutien aux ménages ont éloigné l'économie de sa pire phase, mais la reprise reste fragile. Consommation et investissement s'améliorent par endroits, sans assez de force pour soulever tout le pays. La demande revient, mais la prudence pèse encore sur l'économie.\n-------------\nVous pouvez §Gatténuer§! les effets de cet esprit national en utilisant les décisions de §Y$JAP_japanese_economy_decisions$§! pour porter le §Yprogrès de la reprise de la demande§! à au moins §G60§! !"
 JAP_entrenched_demand_shortfall_idea_3: "Traînée de la demande résiduelle"
 JAP_entrenched_demand_shortfall_idea_3_desc: "Les mesures gouvernementales de stimulation de la consommation ont fait avancer l'économie, mais la prudence laissée par des années de stagnation reste profondément enracinée. Ménages et entreprises bougent davantage qu'auparavant, pourtant une reprise auto-entretenue exige encore une poussée finale. L'économie japonaise est au seuil de sortir de la stagnation, mais elle n'a pas encore pleinement rompu.\n-------------\nVous pouvez §Gretirer§! cet esprit national en utilisant les décisions de §Y$JAP_japanese_economy_decisions$§! pour porter le §Yprogrès de la reprise de la demande§! à au moins §G85§!."
 JAP_declaration_price_target: "Déclarer un objectif de prix"
 JAP_declaration_price_target_desc: "Ce n'est pas seulement la demande faible qui tire l'économie vers le bas. La croyance que prix et salaires ne bougeront jamais a piégé ménages et entreprises dans la prudence. Une cible de prix claire est une déclaration que l'État n'acceptera plus la stagnation comme normale, et c'est le premier pas pour desserrer des anticipations gelées."
 Japan_economy.17.t: "La cible de prix est atteinte"
 Japan_economy.17.d: "Ce qui semblait impossible a commencé à arriver. Les prix montent d'une façon que l'on ne peut plus ignorer. Le changement le plus important n'est pas le chiffre lui-même, mais le sentiment croissant que la stagnation n'est pas éternelle. Ce sentiment commence à desserrer la prudence des ménages comme des entreprises."
 Japan_economy.17.a: "L'atmosphère a changé."
 Japan_economy.18.t: "La cible de prix n'est pas atteinte"
 Japan_economy.18.d: "La cible n'a pas produit de mouvement réel, et le doute commence à s'étendre sur la promesse du gouvernement de briser le marasme. Les ménages redeviennent prudents, tandis que les entreprises se replient dans une attitude d'attente face à une demande faible. La confiance dans la reprise a clairement été endommagée, et une humeur lourde se rassied sur l'économie japonaise."
 Japan_economy.18.a: "La confiance ne se rétablit pas aisément."
 JAP_price_target_mission: "La promesse de la hausse des prix"
 JAP_price_target_mission_desc: "Déclarer une cible ne suffit pas. Nous devons montrer des signes visibles de hausse des prix dans le délai imparti et convaincre le pays que le changement a vraiment commencé."
 JAP_cash_transfers_households: "Soutien direct aux ménages"
 JAP_cash_transfers_households_desc: "Lorsque l'anxiété face à l'avenir est forte, la reprise ne commence pas toute seule. L'État doit mettre le pouvoir d'achat directement entre les mains des ménages. Un soutien ciblé sur les groupes à revenus faibles et moyens a surtout des chances de se transformer en consommation réelle, donnant une force immédiate à la demande intérieure."
 JAP_cash_transfers_households_decision: "Versements aux ménages à revenus faibles et moyens"
 JAP_cash_transfers_households_decision_desc: "Apporter un soutien aux groupes les plus susceptibles de le dépenser et pousser la demande directement vers le haut."
 JAP_temporary_tax_cuts: "Allègement fiscal temporaire"
 JAP_temporary_tax_cuts_desc: "Des baisses d'impôt temporaires donnent aux ménages une raison de dépenser maintenant, avançant les achats reportés et donnant à la demande un élan visible dans une économie stagnante."
 JAP_temporary_consumption_tax_cut: "Réduction temporaire de la taxe à la consommation"
 JAP_temporary_consumption_tax_cut_desc: "Créer une raison de dépenser maintenant et transformer la consommation différée en élan de reprise."
 JAP_active_public_investment: "Investissement public offensif"
 JAP_active_public_investment_desc: "Si les entreprises privées restent prudentes, le gouvernement doit créer lui-même la demande, poussant l'argent dans les économies locales et l'emploi. L'investissement public restaure le sentiment que le mouvement est enfin revenu."
 JAP_active_public_investment_decision: "Ordonner un investissement public"
 JAP_active_public_investment_decision_desc: "Créer de la demande par l'action de l'État et rétablir le flux d'argent dans les économies locales et l'emploi."
 JAP_improvement_private_investment_climate: "Améliorer le climat d'investissement privé"
 JAP_improvement_private_investment_climate_desc: "La dépense publique seule ne peut achever la reprise. Il faut donner aux entreprises la confiance d'investir à nouveau, et réduire l'incertitude sur l'avenir. Une reprise durable exige que les affaires passent de la défense à l'expansion."
 JAP_focus_improving_investment_climate: "Se concentrer sur l'amélioration du climat d'investissement"
 JAP_focus_improving_investment_climate_desc: "Le gouvernement priorise la création d'un environnement plus favorable à l'investissement des entreprises. Le capital politique se dépense en coordination, persuasion et réforme institutionnelle, laissant moins de place à d'autres initiatives de court terme."
 Japan_economy.02.t: "Le climat d'investissement privé s'améliore"
 Japan_economy.02.d: "Les entreprises commencent à voir que rester défensif pour toujours, c'est manquer des occasions. L'incertitude demeure, mais une part du poids qui retenait le nouvel investissement commence à se lever. Pour la première fois, la reprise ne semble plus destinée à rester purement menée par l'État."
 Japan_economy.02.a: "Le secteur privé s'éveille."
 JAP_stimulating_demand_durable_goods: "Stimuler la demande de biens durables"
 JAP_stimulating_demand_durable_goods_desc: "Les biens durables tels que voitures, appareils et achats liés au logement peuvent soulever bien plus que leurs propres secteurs une fois la demande en mouvement. Mais en temps de stagnation, ce sont souvent les premiers achats reportés. Les relancer donnerait à la reprise un élan visible et restaurerait un sentiment de vitalité longtemps absent."
 JAP_stimulating_demand_durable_goods_decision: "Campagne d'achat de biens durables"
 JAP_stimulating_demand_durable_goods_decision_desc: "Encourager les gros achats reportés depuis des années et donner à la reprise un élan visible."
 Japan_economy.22.t: "La demande de biens durables montre des signes de reprise"
 Japan_economy.22.d: "Les gros achats retardés depuis des années commencent enfin à revenir. La demande de biens durables porte des effets larges sur les secteurs liés, et c'est aussi un signe que les ménages deviennent au moins un peu plus confiants dans l'avenir. La reprise commence à apparaître non seulement dans les données, mais dans l'atmosphère de la vie quotidienne."
 Japan_economy.22.a: "Que l'élan se propage."
 JAP_strict_audits_banks: "Inspections bancaires strictes"
 JAP_strict_audits_banks_desc: "Des années de délai ont rendu les plaies du système bancaire plus dures à voir, tandis que l'anxiété financière a continué de s'étendre. Le premier pas est de tirer les créances douteuses dangereuses hors de l'ombre et de forcer les banques à affronter la réalité. Ce sera douloureux, mais sans cette douleur il ne peut y avoir de vraie reprise."
 Japan_economy.23.t: "L'option de vente Shinsei"
 Japan_economy.23.d: "La clause est exactement celle qui a été rapportée. Chaque prêt que les acquéreurs jugent avoir perdu un cinquième de sa valeur retourne à la Société d'assurance des dépôts au prix comptable, et l'État absorbe la différence. La banque n'a rien fait d'illégal. Elle a lu le contrat plus soigneusement que les fonctionnaires qui l'ont rédigé, et ces fonctionnaires sont toujours à leur bureau."
 Japan_economy.23.a: "Publier le contrat et nommer ceux qui l'ont signé"
 Japan_economy.24.t: "L'effondrement de Sogo"
 Japan_economy.24.d: "La chaîne ne peut être sauvée et tous ceux qui conseillent le ministre le savent. La seule question est de savoir si elle est liquidée au tribunal, où les créanciers et les fonctionnaires qui les ont ménagés seront nommés en public, ou restructurée à huis clos, la part publique de la dette étant discrètement remise."
 Japan_economy.24.a: "Le laisser faire faillite en audience publique"
 JAP_injection_public_funds: "Injection de capitaux publics"
 JAP_injection_public_funds_desc: "Il est irréaliste d'exiger à la fois l'apurement des pertes et un crédit renouvelé de banques affaiblies sans soutien. Si la confiance dans le système financier lui-même doit être préservée, l'État doit intervenir comme ultime filet et arrêter la chaîne d'effondrement. C'est une décision politiquement lourde, mais qui laisse peu de place à l'évitement."
 Japan_economy.25.t: "Mycal"
 Japan_economy.25.d: "La banque principale du groupe l'a refinancé chaque année depuis la fin de la bulle et a maintenant dit au ministère qu'elle ne le ferait plus. Les fournisseurs du Kansai qui n'ont jamais traité avec personne d'autre appellent déjà leurs préfectures. Ce qui sera décidé cette semaine sera lu dans toute la région comme une déclaration sur le maintien ou non des anciens arrangements."
 Japan_economy.25.a: "Le laisser couler et auditer la banque qui l'a porté"
 JAP_new_lenders: "Inviter de nouveaux prêteurs"
 JAP_new_lenders_desc: "Si les banques existantes restent piégées dans une prudence défensive, le flux de crédit restera faible. De nouveaux prêteurs doivent être encouragés à entrer dans le champ et à briser le goulot de la finance elle-même. La concurrence et de nouveaux canaux de capital peuvent restaurer une part de la flexibilité que le système financier japonais a perdue."
 JAP_new_lenders_idea: "L'essor de nouveaux prêteurs"
 JAP_new_lenders_idea_desc: "De nouvelles sources de crédit au-delà des banques traditionnelles commencent à émerger. Le blocage de la finance n'est pas pleinement levé, mais de nouveaux chemins s'ouvrent pour que le capital circule dans l'économie."
 JAP_protection_deposits: "Établir une protection des dépôts"
 JAP_protection_deposits_desc: "Dès que les déposants commencent à douter que leur épargne soit en sécurité, une crise bancaire devient réelle. L'État doit donc rendre indubitable que les dépôts seront protégés. Cela seul ne peut pleinement restaurer la confiance, mais cela peut encore devenir le mur qui empêche la panique de se transformer en effondrement."
 Japan_economy.26.t: "Résona"
 Japan_economy.26.d: "Ôtez les actifs d'impôts différés et le ratio de fonds propres s'effondre. Les auditeurs ne signeront pas, ce qui est en soi sans précédent, et le gouvernement a des jours plutôt que des semaines. Deux billions de yens rendent la banque saine et font de l'État son propriétaire. Refuser, c'est la première grande faillite bancaire que le pays aura laissé se produire depuis la guerre, et personne ne peut dire où cela s'arrête."
 Japan_economy.26.a: "Injecter les fonds et limoger tout le conseil"
 JAP_rehabilitation_small_medium_enterprises: "Un filet de sécurité du crédit pour les PME"
 JAP_rehabilitation_small_medium_enterprises_desc: "L'apurement des créances douteuses risque de plonger les petites et moyennes entreprises dans une détresse de financement avec les insolvables. Les banques sont tenues de maintenir le crédit aux PME viables tandis que des schémas de restructuration financière surveillent le resserrement du crédit, posant une barrière devant l'effondrement des économies locales."
 JAP_rehabilitation_small_medium_enterprises_idea: "Privilégier la stabilité du crédit aux PME"
 JAP_rehabilitation_small_medium_enterprises_idea_desc: "Les ressources politiques se concentrent sur la supervision, la coordination et le soutien à la restructuration afin d'empêcher l'apurement des créances douteuses d'étouffer le crédit aux petites et moyennes entreprises. C'est vital pour protéger les économies locales, mais cela laisse moins de place à l'action ailleurs."
 Japan_economy.27.t: "La banque Ashikaga"
 Japan_economy.27.d: "Le gouvernement de la préfecture, ses entreprises et un grand nombre de ses ménages n'ont pas d'autre banque. Le constat des examinateurs est sans ambiguïté : la banque est insolvable et l'est depuis longtemps. La nationalisation temporaire protège chaque déposant et anéantit chaque actionnaire, dont beaucoup sont des entreprises locales tenues de détenir le titre comme condition de leurs propres prêts."
 Japan_economy.27.a: "La nationaliser et ramener les actionnaires à zéro"
 Japan_economy.28.t: "Daiei"
 Japan_economy.28.d: "La Société de revitalisation est prête à la reprendre, remplacer le conseil et vendre ce qui peut l'être. Le fondateur a bâti cette entreprise sur les ruines de la guerre et a des amis au parti qui s'en souviennent. Ils demandent un refinancement de plus, et ils le demandent fort."
 Japan_economy.28.a: "La remettre à la Société de revitalisation"
 Japan_economy.29.t: "Les comptes Kanebo"
 Japan_economy.29.d: "Deux cents milliards de yens de profits jamais réalisés, déclarés sur cinq ans, et visés à chaque fois par le même cabinet comptable. Poursuivre l'entreprise est simple. Poursuivre ses auditeurs dirait à chaque cabinet du Japon que la signature est une responsabilité plutôt qu'une formalité, et rendrait soudain bien d'autres états financiers dignes d'être relus."
 Japan_economy.29.a: "Poursuivre l'entreprise et suspendre ses auditeurs"
 Japan_economy.30.t: "La fédération recule"
 Japan_economy.30.d: "La pression est retombée. La fédération n'a pas retiré ses objections, mais elle a cessé de briefer contre l'enquête, et les membres les plus bruyants se sont tus. Ce n'est pas un accord. C'est le jugement que le combat ne vaut plus ce qu'il leur coûte."
 Japan_economy.30.a: "Nous prendrons le calme tant qu'il dure."
 Japan_economy.31.t: "La fédération tient parole"
 Japan_economy.31.d: "Les plans d'investissement des entreprises membres ont été reportés, et chacune invoque l'incertitude. Le gel des embauches annoncé ce matin est présenté comme de la prudence. Le message est limpide et il est destiné à l'être, et nulle loi ne peut forcer une entreprise à investir."
 Japan_economy.31.a: "Ils ont fait passer leur message."
 Japan_economy.06.t: "Les firmes ripostent"
 Japan_economy.06.d: "Dès que les auditeurs demandent les vrais chiffres, le lobbying commence. Les fédérations industrielles mettent en garde contre des faillites de masse et des emplois perdus, et des bureaucrates amis conseillent la patience. Les banques préféreraient déclarer les pertes à leur propre rythme, si tant est. Nous pouvons les y contraindre, les laisser nous remettre ce qu'elles choisissent, ou décider que cela n'en valait jamais la peine."
 Japan_economy.06.a: "Assigner les livres"
 Japan_economy.07.t: "Une banque au bord du gouffre"
 Japan_economy.07.d: "L'audit a fait apparaître un prêteur régional noyé sous les créances douteuses. Forcer tout le bilan au grand jour et la panique pourrait s'étendre ; contenir la divulgation et la pourriture reste à demi cachée, mais les marchés restent calmes. Dans les deux cas l'enquête avance."
 Japan_economy.07.a: "Forcer la divulgation complète"
 Japan_economy.08.t: "Les conclusions sont publiées"
 Japan_economy.08.d: "Le rapport part à l'imprimerie. Ce qu'il contient dépend entièrement de ce que les auditeurs ont été autorisés à trouver : un catalogue de firmes insolvables et des officiels qui les protégeaient, un compte partiel avec les pires noms caviardés, ou un document qui tient plusieurs centaines de pages sans accuser personne de rien. Le public le lira de toute façon, et aussi ceux à qui l'on a promis des marchés transparents à l'occidentale."
 Japan_economy.08.a: "Tout publier et laisser le public juger"
 Japan_economy.09.t: "Une fuite au ministère"
 Japan_economy.09.d: "Les entreprises savaient quels auditeurs venaient et quel matin. Les classeurs ont été vidés un week-end, et deux administrateurs sont soudain injoignables, en déplacement à l'étranger. Quelqu'un au ministère les prévient, et tout le monde dans cette pièce peut deviner qui, parce qu'il a été muté ici depuis la banque qu'il protège et y sera renvoyé à la retraite."
 Japan_economy.09.a: "Accepter la perte et passer à autre chose"
 Japan_economy.10.t: "La fédération lance un ultimatum"
 Japan_economy.10.d: "La fédération des entreprises s'est présentée à la Diète avec ses propres chiffres : investissements reportés, embauches gelées, confiance entamée, le tout mis au compte de l'enquête. Le message sous les civilités n'est pas subtil. Mettez fin à cela, ou les membres de cette fédération constateront qu'ils ne peuvent s'engager à rien tant que l'incertitude durera."
 Japan_economy.10.a: "Qu'ils plaident leur cause en public."
 Japan_economy.11.t: "La chute du procureur"
 Japan_economy.11.d: "Ce n'est pas l'enquête qui a échoué. C'est un procureur en chef avec un abonnement de golf non déclaré, offert par une entreprise de sa propre liste, et un journal qui a des photos de lui l'acceptant. Le ministre a démissionné pour en prendre la responsabilité. L'enquête est suspendue dans l'attente d'un examen, ce que chacun comprend comme : jusqu'à ce que le public cesse d'y prêter attention."
 Japan_economy.11.a: "Nous avons perdu l'initiative."
 JAP_expectation_of_being_rewarded: "L'attente de la récompense"
 JAP_expectation_of_being_rewarded_desc: "La reprise exige de restaurer la croyance que l'effort sera récompensé en salaires et en niveau de vie. Sans croissance salariale la relance reste temporaire, et seule cette attente transforme une reprise en reprise auto-entretenue."
 JAP_wage_negotiations: "Négocier des salaires plus élevés"
 JAP_wage_negotiations_decision: "Restaurer la confiance dans la croissance des salaires et empêcher que la reprise de la demande ne s'achève en simple salve temporaire de relance."
 Japan_economy.12.t: "Négociations salariales avec les entreprises"
 Japan_economy.12.d: "Si la reprise de la demande doit devenir auto-entretenue, les salaires doivent aussi monter. Pourtant les entreprises restent méfiantes face aux risques futurs et à la pression sur les profits. Le gouvernement doit maintenant décider avec quelle force pousser pour une paye plus élevée."
 Japan_economy.12.a: "Encouragez les augmentations de salaires."
 Japan_economy.12.b: "Appliquez une pression."
 Japan_economy.12.c: "Laisser faire le secteur privé."
 Japan_economy.14.t: "La croissance des salaires atteint la cible"
 Japan_economy.14.d: "Les salaires ont enfin commencé à bouger de façon visible. Ce qui compte n'est pas seulement la hausse du revenu elle-même, mais le retour d'un sentiment plus profond que l'effort peut à nouveau être récompensé. Ce changement de sentiment commence à transformer une consommation faible en quelque chose de plus fort et plus durable."
 Japan_economy.14.a: "La reprise devient réalité."
 Japan_economy.15.t: "La croissance des salaires n'atteint pas la cible"
 Japan_economy.15.d: "La croissance des salaires n'a pas atteint l'objectif, mais l'effort n'a pas été vain. Les entreprises restent prudentes, pourtant le besoin d'une paye plus élevée est désormais plus largement compris qu'auparavant. Le pas en avant est petit, mais il compte encore pour briser l'ancienne atmosphère de stagnation."
 Japan_economy.15.a: "Nous construisons là-dessus."
 Japan_economy.12_a_TT: "Les chances que la croissance des salaires atteigne le montant cible sont §Ycinquante-cinquante§!"
 Japan_economy.12_b_TT: "Les chances que la croissance des salaires atteigne le montant cible sont §Gélevées§!"
 Japan_economy.12_c_TT: "Les chances que la croissance des salaires atteigne le montant cible sont §Rfaibles§!"
 JAP_wage_negotiations_TT: "Le §Yprogrès de la reprise de la demande§! augmentera, mais le montant dépend du résultat des §Ynégociations salariales§!"
 JAP_glorious_decade_desc: "Sans reporter les causes de la stagnation, nous reconstruirons en parallèle la finance, les entreprises et la demande. Dans le même temps, nous affronterons les effets de la dénatalité et de la génération de « l'âge de glace de l'emploi » et, centrés sur les réformes du travail et l'investissement dans les personnes, nous équilibrerons la sécurité des ménages et le potentiel de croissance."
 JAP_inflation_target_desc: "Le gouvernement et la banque centrale communiqueront clairement l'orientation de soutien à l'économie et les conditions de son maintien. En réduisant l'incertitude future et en apaisant l'attentisme des ménages et des entreprises, nous faciliterons la reprise de la consommation et de l'investissement."
 JAP_diplomacy.34.d: "Pour renforcer le filet de sécurité financière de la région, le gouvernement japonais a proposé d'élargir l'arrangement de swap de devises avec notre pays par l'« initiative de Chiang Mai ». Sécuriser la liquidité en temps de crise peut aider à calmer l'anxiété des marchés et contribuer à la stabilité économique.\n\nDevons-nous accepter cette proposition et prendre part au renforcement de la coopération financière ?"
 JAP_diplomacy.40.d: "Le gouvernement japonais a proposé une coopération d'« APD qualitative » pour notre pays dans les domaines de l'éducation, du développement des ressources humaines et de la recherche, comme soutien mené en coordination avec les entreprises et institutions locales. Cette coopération renforcera la formation des compétences et la capacité institutionnelle, favorisant la montée en gamme industrielle et l'innovation. Accepter la proposition accroîtrait aussi l'influence du Japon au sein de l'ASEAN.\n\nDevons-nous accepter cette proposition et renforcer le capital humain et la recherche-développement ?"
 JAP_diplomacy.41.d: "[FROM.GetName] a accepté la proposition de coopération d'« APD qualitative » du Japon dans les domaines de l'éducation, du développement des ressources humaines et de la recherche. À mesure que la coordination avec les entreprises et institutions locales avance, la capacité institutionnelle et le fondement technologique de l'autre pays seront renforcés, contribuant à une croissance durable. Cet accord accroîtra certainement l'influence du Japon au sein de l'ASEAN."
 JAP_diplomacy.42.d: "[FROM.GetName] a indiqué qu'il refusera la proposition de coopération d'« APD qualitative » dans les domaines de l'éducation, du développement des ressources humaines et de la recherche. L'autre pays semble prioriser des priorités intérieures et des préparatifs institutionnels, mais cela ne signifie pas qu'il rejette la proposition elle-même. Le Japon devrait rester attentif aux circonstances de l'autre pays tout en maintenant ouverts les canaux de dialogue."
 JAP_diplomacy.49.d: "Le gouvernement japonais a présenté une proposition d'établir la « plateforme de connaissances Japon-Taïwan pour la préparation aux catastrophes » afin de partager expertise et leçons en matière de réponse aux catastrophes, sur la base de notre vulnérabilité partagée aux catastrophes naturelles. Par la standardisation du partage d'information, l'entraînement conjoint et le développement de procédures de rétablissement, l'objectif est de renforcer les capacités de réponse d'urgence et d'accélérer le redressement. Si cette coopération avance, on s'attend à réduire les dégâts et à accélérer la restauration."
 JAP_diplomacy.50.d: "Le gouvernement japonais a proposé la « coopération high-tech Japon-Taïwan », qui lierait institutions de recherche et entreprises privées du Japon et de Taïwan pour faire avancer la recherche conjointe dans les technologies civiles de pointe. En partageant les ressources de recherche, en poursuivant le développement conjoint et en promouvant les échanges d'ingénieurs, l'objectif est d'accélérer l'innovation et de doper la productivité et la compétitivité industrielles. Si cette coopération s'enracine, elle formera un fondement de croissance à long terme dans les secteurs technologiques civils des deux pays."
 JAP_diplomacy.56.t: "Projet de coopération culturelle \\"Sphère culturelle sinique\\""
 JAP_diplomacy.56.d: "Le gouvernement japonais a proposé un projet de coopération culturelle Japon-Chine pour renforcer les liens culturels au sein de la « sphère culturelle sinisée », qui partage un fondement historique commun. Par des échanges académiques, des initiatives culturelles et une coopération dans les médias et l'éducation, l'objectif est de rendre plus visibles les valeurs partagées et les connexions historiques et de les faire fonctionner comme tampon culturel contre l'influence extérieure. Si ce cadre avance, on s'attend aussi à ce qu'il renforce un soft power contribuant à façonner une image internationale plus favorable."
 JAP_diplomacy.59.d: "Le gouvernement japonais a proposé l'« initiative d'échange d'affaires régional » pour institutionnaliser les échanges d'affaires au niveau local et promouvoir la coopération entre entreprises régionales du Japon et de Corée du Sud. Par des événements de mise en relation, des expositions conjointes, le matching de chaînes d'approvisionnement et le partage de technologie et de savoir-faire, l'objectif est de revitaliser les économies régionales et d'accélérer la croissance des industries civiles. Si ce cadre s'enracine, une coopération pratique qui ne dépend pas trop du leadership du gouvernement central s'élargira, renforçant des réseaux industriels portés par le secteur privé."
 JAP_historical.20010426.d: "Yoshirō Mori a annoncé sa démission de Premier ministre après seulement un an au pouvoir. Ses cotes d'approbation avaient reculé, et le fossé avec le public, symbolisé par sa remarque sur la « nation divine » et sa gestion de l'incident de l'Ehime Maru, n'avait cessé de s'élargir.\n\nÉlu pour lui succéder à la course à la présidence du PLD, Junichiro Koizumi a capté l'attention nationale par sa déclaration audacieuse de « détruire le PLD » et une campagne tapageuse. Les attentes du public étaient hautes, et il a remporté une victoire écrasante au vote régional.\n\nPar un style et une présence scénique qui rompaient avec le vieux Parti libéral-démocrate, Koizumi a levé la bannière de la « réforme » en accédant au poste de Premier ministre.\nCe qui pourrait émerger des ruines qu'il a juré de détruire, personne ne le sait encore."
 JAP_historical.20060926.d: "Le Premier ministre Junichiro Koizumi, à la tête d'une administration de plus de cinq ans, a annoncé son intention de se retirer à l'expiration de son mandat de président du PLD. S'il avait publiquement dit vouloir partir en fin de mandat, le soutien public restait élevé, et beaucoup au sein du parti continuaient d'appeler à une prolongation.\n\nCependant, au sein du PLD, Shinzo Abe, monté rapidement jusqu'au secrétariat général du Cabinet encore jeune, s'est imposé comme successeur favori. Par sa jeunesse, sa notoriété, sa lignée politique et son statut symbolique de figure « post-Koizumi », il rassemblait un large soutien dans tout le parti.\n\nQui est le mieux à même de gouverner : un sortant expérimenté, ou un nouveau chef prêt à porter le flambeau vers la génération suivante ? L'heure de décider est venue."
 JAP_historical.20070926.d: "Le Premier ministre Shinzo Abe a annoncé brusquement son intention de démissionner, invoquant la difficulté croissante de gouverner. Un an à peine s'était écoulé depuis son arrivée. Au milieu d'une série de scandales ministériels, les fondations de son administration avaient été gravement ébranlées.\nEn réaction, certains au sein du PLD ont poussé à faire venir l'ancien secrétaire général du Cabinet Yasuo Fukuda, arguant qu'« un visage nouveau est nécessaire pour rétablir la confiance du public ». Beaucoup de voix, toutefois, soutiennent encore fortement le maintien d'Abe.\n\nLe Japon se trouve au cœur d'un tumulte politique. L'heure est venue de décider qui prendra la barre de la nation."
 JAP_historical.20080924.d: "Le Premier ministre Yasuo Fukuda a, à l'improviste, tenu une conférence de presse au bureau du Premier ministre pour annoncer sa démission.\n\nDurant la conférence, il a déclaré : « Pour le quotidien du peuple, j'espère qu'une nouvelle équipe mènera les politiques », acceptant avec calme la transition. N'ayant toutefois pas clairement expliqué les raisons de sa démission, l'annonce a laissé beaucoup de citoyens confus et incertains.\nEn réponse, le Parti libéral-démocrate a rapidement préparé une élection à la présidence. Le secrétaire général Tarō Asō s'est imposé comme candidat favori, gagnant rapidement le soutien de diverses factions. Un petit nombre de voix au sein du parti continuent néanmoins d'appeler Fukuda à rester.\n\nPour briser la stagnation politique, le pays a-t-il besoin de changement ? Ou la stabilité est-elle la priorité plus grande du Japon en cet instant ? L'heure de décider est venue."
 JAP_focus_renewable_energy_decision_repeal: "Abroger la priorité aux énergies renouvelables"
 JAP_focus_renewable_energy_decision_repeal_desc: "Renverser l'engagement envers l'énergie renouvelable marque un glissement de politique loin du solaire, de l'éolien et de l'efficacité."
 JAP_focus_thermal_power_decision_repeal: "Abroger la priorité aux centrales fossiles"
 JAP_focus_thermal_power_decision_repeal_desc: "Renverser l'expansion des centrales à combustibles fossiles marque un glissement de politique loin du charbon, du pétrole et du gaz."
 JAP_historical.121006001.t: "Tremblement de terre de Tottori en 2000"
 JAP_historical.121006001.d: "Le Japon est constitué d'archipels volcaniques flottant sur la Ceinture de feu. Cela signifie que le Japon et son peuple doivent sans cesse affronter de puissants séismes. Il en a été ainsi jusqu'au millénaire précédent, et il en sera ainsi au suivant.\n\n13 h 30, 6 octobre 2000 — Un séisme de magnitude 7,3 et d'intensité 6+ a frappé l'ouest de Shimane. Il a causé de nombreux dégâts aux routes et aux maisons, et des vibrations jusqu'à Osaka et Fukuoka. Kobe, en particulier, a connu un fort séisme pour la première fois depuis le grand tremblement de terre de Hanshin-Awaji de 1995."
 JAP_historical.disaster_help: "Aidez-les maintenant !"
 JAP_historical.disaster_leave: "Les laisser. Ils se relèveront d'eux-mêmes."
 JAP_historical.130210001.t: "Catastrophe d'Ehime-Maru"
 JAP_historical.130210001.d: "Le 9 février 2001, le navire-école Ehime-Maru, appartenant à un lycée de pêche, a été heurté par le sous-marin [USA.GetName] Greeneville. L'Ehime-Maru, à bord duquel se trouvaient 35 élèves et enseignants japonais, a coulé et 9 personnes ont péri.\n\nTandis que les responsables des deux gouvernements rassemblent toutes les informations sur cet accident tragique, le Premier ministre [Root.GetLeader] joue au golf en vacances.\n\nIls devraient bien sûr abandonner les vacances et rentrer à Tokyo maintenant, n'est-ce pas ?"
 JAP_historical.130210001.oA: "Retournez immédiatement à Tokyo !"
 JAP_historical.130210001.oB: "Attendez ! Juste encore un coup..."
 JAP_historical.130324001.t: "Tremblement de terre de Geiyo en 2001"
 JAP_historical.130324001.d: "15 h 27, 24 mars 2001 — Un séisme de magnitude 6,7 et d'intensité 6- a frappé l'ouest d'Hiroshima. 2 morts et 288 blessés. Kure, la ville la plus proche de l'épicentre, a subi les plus grands dégâts. En revanche, de nombreuses autres collectivités ont limité les dommages grâce aux mesures prises après le grand séisme de Hanshin-Awaji de 1995 et le séisme de Shimane de l'an dernier. Les principaux dégâts ont été la rupture des canalisations d'eau et l'effondrement de versants montagneux."
 JAP_historical.9130901001.t: "Incendie du bâtiment de Kabukicho"
 JAP_historical.9130901001.d: "Avant l'aube du 1er septembre 2001, l'immeuble « Myojo 56 Building » à Kabukicho, arrondissement de Shinjuku, Tokyo, a brûlé, tuant 44 personnes présentes au salon de mah-jong et au club de strip-tease, par intoxication au monoxyde de carbone. Selon le rapport des pompiers, l'incendie était d'abord petit mais a explosé par un backdraft provoqué par un employé qui, découvrant le feu, a ouvert une porte. Le rapport ajoute que les alarmes incendie étaient masquées par le plafond ou coupées pour dysfonctionnement, si bien que l'extinction précoce a été manquée. Un autre rapport indique que le personnel n'a pas guidé l'évacuation des visiteurs. Par ailleurs, la police métropolitaine, enquêtant avec les pompiers, a trouvé une conduite de gaz brisée de façon anormale. La cause — accident ou incendie volontaire — reste incertaine, mais il est clair que le manque de conscience de la prévention incendie a aggravé le drame."
 JAP_historical.9130901001.oA: "Puissions-nous ne jamais revoir un incendie d'immeuble pire que celui-ci."
 JAP_historical.131201001.t: "La naissance de Son Altesse la princesse Aiko"
 JAP_historical.131201001.d: "Le 1er décembre 2001, la fille du prince héritier Naruhito et de son épouse Masako est née à l'hôpital du palais impérial. Première princesse impériale née au troisième millénaire, elle a été nommée Aiko, d'après Mencius, classique confucéen chinois. Son Altesse la princesse impériale Aiko est aussi la petite-fille de Sa Majesté l'empereur Akihito. C'est l'événement le plus heureux depuis longtemps, depuis la naissance de Son Altesse le prince Fumihito Akishino-no-Miya en 1965, et presque tout le pays a célébré. Puis 20 000 personnes, dont des politiciens et des célébrités, ont crié Banzai au palais impérial. D'un autre côté, certains ont craint que cette situation n'éteigne la lignée impériale actuelle. Le prince consort Masako était trop avancé en âge pour un second enfant sans danger. Et si la princesse Aiko grandissait, elle pourrait devenir impératrice en lignée maternelle « comme dernière de la famille impériale », en raison de l'écart d'âge important avec les deux princes — Naruhito et Fumihito. Cela briserait toutefois la loi de la Maison impériale : le trône n'est ouvert qu'à la lignée patrilinéaire. Chacun a fini par débattre d'un amendement de la loi de la Maison impériale, pour permettre une impératrice en lignée maternelle."
 JAP_historical.131201001.oA: "Banzaï !"
 JAP_historical.150526001.t: "Tremblement de terre au large de Miyagi en 2003"
 JAP_historical.150526001.d: "18 h 24, 26 mai 2003 — Un séisme de magnitude 7,1 et d'intensité 6- s'est produit au large de la frontière Miyagi-Iwate. De vastes zones du Tōhoku ont subi de nombreux dégâts, comme la destruction de piles du Shinkansen et des glissements de terrain, mais personne n'a été tué. Le tsunami n'était cette fois qu'une ride. Malgré ces rapports, beaucoup de gens ont senti la secousse, d'Hokkaidō au Kantō."
 JAP_historical.150726001.t: "Deuxièmes tremblements de terre consécutifs de Miyagi en 2003"
 JAP_historical.150726001.d: "Le 26 juillet 2003 — Pas moins de QUATRE séismes ont frappé à répétition le nord de Miyagi, de minuit jusqu'au soir — en une seule journée ! Le plus fort a enregistré une magnitude 6,4 et une intensité 6+ à 7 h 13, et même le plus faible était de magnitude 5,1 et d'intensité 5-. Ces séismes ont causé des dégâts non seulement à des centaines de maisons, mais aussi à la base aérienne de Matsushima de la JASDF. Une journée fort déplaisante, mais, par chance, personne n'a été tué."
 JAP_historical.150926001.t: "Séisme de Hokkaidō en 2003"
 JAP_historical.150926001.d: "4 h 50, 26 septembre 2003 — Un séisme de magnitude 8,0 et d'intensité 6- s'est produit au large du sud d'Hokkaidō. Seules quelques villes ont ressenti fortement la secousse, mais elles ont bientôt compris la véritable horreur des suites. Le séisme a provoqué une liquéfaction des sols dans la zone côtière remblayée et un incendie de réservoirs de pétrole. En outre, un énorme tsunami a frappé la côte est du Japon oriental, et deux personnes ont été tuées."
 JAP_historical.161023001.t: "Séisme de Niigata Chūetsu en 2004"
 JAP_historical.161023001.d: "17 h 56, 23 octobre 2004 — Un séisme de magnitude 6,8 et d'intensité 7 s'est produit à Niigata. C'était la première fois qu'on enregistrait l'échelle JMA 7 depuis la révision après le séisme de Hanshin de 1995. À Yamakoshi, toutes les routes avaient été détruites par les glissements de terrain et tous les habitants étaient enfermés dans le village. Un train en circulation sur la ligne Jōetsu Shinkansen a déraillé sous le choc, mais personne n'a été tué. Toutefois, le séisme a fait 68 morts."
 JAP_historical.170320001.t: "Tremblement de terre de Fukuoka en 2005"
 JAP_historical.170320001.d: "10 h 53, 20 mars 2005 — Un séisme de magnitude 7,0 et d'intensité 6- s'est produit au large de Fukuoka. Les séismes sont rares dans le nord de Kyūshū et celui-ci était aussi le plus fort depuis 1922. Sur l'île de Genkai à Fukuoka, environ 700 personnes ont évacué et dix ont décidé de rester pour les communications de catastrophe et les patrouilles. Au centre de Fukuoka, la plupart des vitres se sont brisées et des fragments sont tombés sur le trottoir, blessant deux piétons. Le séisme a secoué non seulement Tsushima mais aussi la Corée et la Chine. Une personne a été tuée."
 JAP_historical.170425001.t: "Accident de déraillement sur la ligne Fukuchiyama"
 JAP_historical.170425001.d: "À 9 h 18 le 25 avril 2005, un train rapide de la ligne Fukuchiyama de JR West (aussi connue comme la ligne JR Takarazuka) a déraillé dans une courbe serrée à Amagasaki, préfecture de Hyōgo, et s'est encastré au rez-de-chaussée d'un immeuble voisin.\nLe train comptait sept voitures, bien que les premiers rapports aient par erreur parlé de six, la tête du convoi s'étant entièrement enfoncée dans le bâtiment. L'enquête a révélé que le train était entré dans la courbe à environ 116 km/h, alors que la limitation de vitesse de la section était de 70 km/h. La vitesse excessive a probablement causé le déraillement par force centrifuge.\nLe conducteur a été tué, mais le témoignage du chef de train en queue suggérait que l'équipage tentait de rattraper un retard d'environ 90 secondes. On a ensuite rapporté que des mesures disciplinaires internes strictes existaient dans l'entreprise même pour de menues erreurs opérationnelles. Ces mesures comprenaient des sessions de rééducation, la copie à la main du règlement et d'autres pratiques correctives remontant à la privatisation des Chemins de fer nationaux japonais (JNR) sous l'administration Nakasone.\nHeureusement, un express limité venant en sens inverse a pu s'arrêter d'urgence grâce à la voie bloquée, évitant une collision secondaire. L'accident s'étant toutefois produit à l'heure de pointe du matin, le train était bondé. Au total, 107 personnes ont été tuées et 562 blessées, ce qui en fait l'accident ferroviaire le plus meurtrier de l'histoire japonaise d'après-guerre. Certains spécialistes médicaux ont noté que plusieurs passagers n'étaient peut-être pas morts immédiatement dans le choc, mais plus tard d'un syndrome de crush dû à une compression prolongée."
 JAP_historical.180906001.t: "La naissance de Son Altesse le prince Hisahito"
 JAP_historical.180906001.d: "Le 6 septembre 2006, le fils du prince Fumihito et de son épouse Kiko est né à l'hôpital privé de Minami Azabu. Premier prince impérial né au troisième millénaire, il a été nommé Hisahito, « Hisa » signifiant « d'une manière détendue » et « Hito » suivant la tradition de dénomination impériale depuis l'ère Heian. Il a été mis au monde par césarienne dans un hôpital privé, et non au palais impérial ; les deux étaient une première dans l'histoire impériale. Cela a été salué comme la naissance d'un mâle légitime dans la succession au trône autant que comme celle d'une nouvelle famille impériale. Après la naissance du garçon, le débat sur l'amendement de la loi de la Maison impériale s'est peu à peu apaisé."
 JAP_historical.180906001.oA: "Banzaï !"
 JAP_historical.190216001.t: "« Les pensions perdues »"
 JAP_historical.190216001.d: "En 1997, l'Agence d'assurance sociale du Japon (SIA) a commencé à consolider les dossiers de pension individuels sous un système unique de « numéro de pension de base ». Toutefois, entre 2006 et 2007, l'agence a découvert environ 50 millions de dossiers de pension restés non liés ou présentant des écarts dus à des erreurs lors de la transcription de documents papier au format numérique.\nCertains de ces dossiers manquants concernaient des bénéficiaires actuels, suscitant la crainte que des personnes aient reçu des montants incorrects. En outre, certains dossiers auraient été perdus ou supprimés par erreur lors de tentatives de mise à jour des données de pension des salariés.\nEn réponse, [JAP.GetRulingParty] a lancé une task force spéciale pour enquêter et a proposé une législation d'urgence pour porter secours aux personnes concernées. Les partis d'opposition critiquent néanmoins durement le gouvernement, et le mécontentement public reste élevé."
 JAP_historical.190216001.oA: "Quel désastre !"
 JAP_historical.190325001.t: "Tremblement de terre de Noto en 2007"
 JAP_historical.190325001.d: "9 h 41, 25 mars 2007 — Un fort séisme de M6,9 frappe la région de Hokuriku. L'échelle JMA a calculé le séisme à 6+ à Wajima, préfecture d'Ishikawa, et c'était le plus fort depuis le début de l'observation sismique en 1922. L'hypocentre est signalé dans une zone où aucune recherche n'avait encore trouvé de faille. La secousse, ressentie d'Hokkaidō à Kōchi, a causé un tsunami de 20 cm. Le séisme a tué 1 personne par l'effondrement d'une lanterne de pierre, blessé 356 personnes et endommagé plus de 30 000 bâtiments et maisons."
 JAP_historical.190716001.t: "Séisme au large de Chūetsu en 2007"
 JAP_historical.190716001.d: "10 h 13, 16 juillet 2007 — Un autre séisme de M6,8 frappe la préfecture de Niigata. L'échelle JMA calcule 6+ dans plusieurs villes, mais à la centrale nucléaire de Kashiwazaki-Kariwa, elle a été officieusement estimée à 7. Le tsunami causé par la secousse a été enregistré à 1 m à Kashiwazaki. Le séisme a tué 15 personnes, directement et secondairement, blessé 2 346 personnes et endommagé plus de 34 000 bâtiments, dont 1 331 maisons détruites. Un incendie s'est déclaré à la centrale de Kashiwazaki-Kariwa déjà citée, mais l'extinction a été retardée de deux heures en raison d'une erreur de partage d'information dans la lutte initiale, ce qui a causé une fuite radioactive, toutefois dans des limites environnementales négligeables. Ce séisme s'est produit seulement 4 mois après le séisme de Noto et 3 ans après le destructeur séisme de Niigata Chūetsu de 2004."
 JAP_historical.200614001.t: "Tremblement de terre d'Iwate-Miyagi Nairiku en 2008"
 JAP_historical.200614001.d: "8 h 43, 14 juin 2008 — Un fort séisme de M7,2 se produit sous la préfecture d'Iwate ; l'échelle JMA calcule 6+ à Kurihara, préfecture de Miyagi, et Ōshū, préfecture d'Iwate. Bien qu'il s'agisse d'un séisme intérieur, une secousse d'intensité supérieure à 3 a été enregistrée d'Hokkaidō au Kantō. Ce séisme, résultat rare, a peu endommagé les bâtiments mais a causé de nombreux glissements de terrain, et a finalement tué 17 personnes, blessé 70 grièvement et 356 légèrement, et 6 sont encore portées disparues. On a signalé l'effondrement d'un pont et des dégâts au patrimoine culturel."
 JAP_historical.210811001.t: "Séisme de 2009 dans le golfe de Suruga"
 JAP_historical.210811001.d: "5 h 07, 11 août 2009 — Un fort séisme de M6,5 se produit dans la baie de Suruga, tuant une personne et en blessant 319. Le séisme a causé un tsunami de 40 cm. L'échelle JMA a calculé le séisme à 6- dans de nombreuses zones de la préfecture de Shizuoka ; 8 678 maisons et plusieurs bâtiments historiques sont endommagés, mais aucune maison n'a été entièrement détruite. La région de Tōkai, qui inclut Shizuoka, est la zone de catastrophe estimée du futur grand séisme et tsunami Tōkai-Tōnankai, si bien que les habitants s'étaient préparés par des exercices d'évacuation, la stabilisation des meubles et le renforcement des maisons. C'est la raison du moindre bilan comparé à l'ampleur du séisme. Il y a toutefois eu des dégâts dans les usines, les plantations de thé et l'autoroute Tōmei."
 JAP_diplomacy.16.t: "L'impasse japonaise"
 JAP_diplomacy.16.d: "Tokyo continue de résister à l'élargissement de l'interprétation de l'article 9. Washington doit décider jusqu'où il est prêt à pousser, et à quel prix."
 JAP_diplomacy.16.a: "Abandonner l'affaire. Nos autres intérêts dans la région priment."
 JAP_diplomacy.16.b: "Retirer notre garantie de sécurité au Japon."
 JAP_diplomacy.16.c: "Imposer des droits de douane sur les exportations japonaises"
 JAP_diplomacy.16.e: "Établir un blocus naval du Japon."
 JAP_asteroid_mining_network_established: "Réseau d'extraction d'astéroïdes établi pour [JAP.GetNameWithFlag]"
 JAP_asteroid_mining_operation_active: "Mène actuellement une opération d'extraction d'astéroïdes"
 JAP_claiming_taiwan_tt: "Cela affirme une revendication japonaise sur chaque État insulaire taïwanais à la fois. Une fois les revendications en place, achevez le focus pour exiger la soumission de Taïwan."
 JAP_improvement_private_investment_climate_idea: "Améliorer le climat de l'investissement privé"
 JAP_improvement_private_investment_climate_idea_desc: "Les dépenses publiques seules ne peuvent achever le redressement. Les firmes doivent retrouver la confiance d'investir, et l'incertitude sur l'avenir doit être réduite. Un redressement durable exige que les entreprises passent de la défense à l'expansion."
 JAP_demographic_crisis: "Mesures inédites face à la crise"
 JAP_demographic_crisis_desc: "L'Agence japonaise de l'enfance et de la famille coordonne une réponse pangouvernementale au déclin démographique : incitations natalistes, mobilisation de la main-d'œuvre féminine, ou réforme de l'immigration. La Diète ne s'engage que sur une seule voie. Chacune paie sa facture dans une monnaie différente : allocations en espèces, bouleversement du marché du travail, ou transformation culturelle."
 JAP_demographic_crisis_tt: "Marque le début de la réponse du Japon à son déclin démographique. Les trois stratégies qui suivent s'excluent mutuellement."
 JAP_traditionalist_backlash_opposition_tt: "§RContrecoup traditionaliste :§! la colère conservatrice face au recul de la famille traditionnelle gonfle l'opposition nationaliste"
 JAP_traditionalist_backlash_stability_tt: "§RContrecoup traditionaliste :§! la colère conservatrice face au recul de la famille traditionnelle érode la stabilité"
 JAP_japan_belongs_to_the_japanese: "Le Japon appartient aux Japonais"
 JAP_japan_belongs_to_the_japanese_desc: "Le Japon relèvera le taux de natalité par des allocations familiales, des incitations natalistes et un renouveau culturel. L'État s'engage à des dépenses sociales permanentes, que les naissances augmentent ou non. Cette voie échange l'incertitude budgétaire du déclin contre la certitude de droits irréversibles."
 JAP_pronatalist_turn: "Initiative Plus un"
 JAP_pronatalist_turn_desc: "Le Japon lancera une campagne d'ensemble pour encourager la natalité comme priorité civique, s'inspirant de la stratégie « Plus un » du début des années 2000. Par des incitations fiscales, un discours public et la reconnaissance culturelle des familles nombreuses, l'État fera évoluer les attitudes vers des familles plus grandes tout en offrant un soutien concret qui rend la parentalité plus abordable et plus attractive."
 JAP_national_revival_campaign: "Initiative de revitalisation régionale"
 JAP_national_revival_campaign_desc: "Le Japon canalisera l'investissement vers les régions, en faisant revivre les communautés locales vidées par le départ des jeunes vers Tokyo. En créant des emplois, en améliorant les commodités et en restaurant la confiance dans le Japon provincial, nous visons à ancrer les familles hors de la métropole et à ralentir la concentration démographique qui aggrave le déclin rural. Des régions fortes sont le fondement de familles stables et de taux de natalité durables."
 JAP_three_generation_household: "Le foyer à trois générations"
 JAP_three_generation_household_desc: "Le Japon subventionnera les foyers à trois générations par des incitations fiscales et un soutien au logement, faisant revivre un arrangement où les grands-parents assurent la garde des enfants et les soins aux aînés sans salaire de marché. L'État reporte le coût social sur les liens familiaux, réduisant ses propres dépenses. Les soins donnés à la maison sont des soins que l'État ne paie pas."
 JAP_homeland_production_drive: "Le monozukuri au pays"
 JAP_homeland_production_drive_desc: "Le Japon approfondira son engagement envers la manufacture intérieure, en investissant dans l'automatisation et la formation afin de maximiser la production d'une main-d'œuvre en recul. Plutôt que de délocaliser ou d'embaucher des migrants, le Japon poursuit la tradition du monozukuri, l'art de bien fabriquer. La contrepartie est une tension énergétique et des coûts plus élevés."
 JAP_incentivize_large_families: "Allocation familiale élargie"
 JAP_incentivize_large_families_desc: "Le Japon élargira l'allocation pour enfant (jidō teate) avec des aides généreuses croissant avec chaque enfant supplémentaire. En rendant la parentalité plus abordable, l'État lève une contrainte déterminante sur la taille des familles. Une fois inscrite dans la loi, l'allocation devient un droit permanent qu'aucun gouvernement futur n'osera couper."
 JAP_state_family_mandate: "La famille comme impératif d'État"
 JAP_state_family_mandate_desc: "Le Japon imposera la formation des familles par le droit du travail, des incitations pensionnelles et un discours social poussant les femmes vers la maternité et les hommes vers la paternité. C'est la réponse bon marché : l'État dépense peu tout en enrôlant les citoyens dans la reproduction. Le coût est la légitimité et le ressentiment."
 JAP_a_nation_reborn: "Une nation renaissante"
 JAP_a_nation_reborn_desc: "Le taux de natalité s'est stabilisé et a commencé à remonter, la maternité est honorée et les communautés régionales sont revitalisées. Le Japon a inversé le déclin démographique par un investissement nataliste soutenu. Deux décennies d'allocations, de subventions au logement et de soins aux aînés se sont durcies en droits qu'aucun gouvernement futur ne peut couper."
 JAP_womenomics: "Femmesomique"
 JAP_womenomics_desc: "Le Japon mobilisera les femmes dans tous les secteurs économiques en démantelant les barrières, en fournissant des gardes d'enfants et en faisant évoluer la culture d'entreprise. Cela débloque la capacité productive et les recettes fiscales sans produire d'enfants supplémentaires. L'État doit bâtir et doter le système de garde, et le Japon conservateur y verra une attaque contre la famille."
 JAP_eliminate_daycare_waitlists: "Initiative zéro enfant en liste d'attente"
 JAP_eliminate_daycare_waitlists_desc: "Le Japon mettra en œuvre le plan de sécurité de l'éducation des enfants, en élargissant crèches, garderies et accueil périscolaire jusqu'à la disparition des listes d'attente. Un lourd investissement dans les salaires et la construction lève la contrainte déterminante sur l'activité féminine. Ces structures devront être dotées et financées à perpétuité."
 JAP_reform_spousal_tax_deduction: "Démanteler le mur du 1,03 million de yens"
 JAP_reform_spousal_tax_deduction_desc: "Le Japon éliminera le seuil de déduction fiscale du conjoint à 1,03 million de yens et restructurera les seuils d'assurance sociale qui le sous-tendent. Cela lève la pénalité sur l'emploi à temps plein qui a enfermé des millions de femmes dans le temps partiel. Démolir le mur libère un vaste vivier de femmes expérimentées et éduquées vers l'emploi à temps plein."
 JAP_normalize_parental_leave: "Campagne Ikumen"
 JAP_normalize_parental_leave_desc: "Le Japon lancera la campagne Ikumen, garantissant un congé parental payé aux deux parents et poussant les hommes à le prendre. Quand les pères deviennent couramment des aidants, les femmes ne sont plus piégées par la maternité et la charge est partagée. Les entreprises en paieront le coût en production perdue, et la génération des salarymen ne cédera pas sans bruit."
 JAP_women_in_management: "L'initiative 202030"
 JAP_women_in_management_desc: "Le Japon poursuivra l'objectif 202030 : trois postes de direction sur dix occupés par des femmes. La loi sur la promotion de la participation et de l'avancement des femmes au travail fixe des cibles contraignantes pour les entreprises et le secteur public, impose la transparence et récompense les firmes en tête du mouvement. Les femmes détiendront un pouvoir réel dans chaque conseil d'administration et chaque bureau de la fonction publique."
 JAP_family_first_model: "Réforme du travail : voie familiale"
 JAP_family_first_model_desc: "Le mouvement de réforme du style de travail privilégiera la voie familiale : horaires flexibles, parcours à temps partiel et allocations élargies rendront possible de rester dans l'emploi sans sacrifier la maternité. Cette voie accepte une production globale moindre pour préserver à la fois les carrières et les naissances, pariant que la stabilité sociale et une reprise démographique modeste importent plus que la croissance maximale."
 JAP_career_first_model: "Réforme du travail : voie professionnelle"
 JAP_career_first_model_desc: "Le mouvement de réforme du style de travail privilégie la voie de la carrière : pas de flexibilité, pas de parcours à temps partiel, mais une véritable égalité d'avancement et de rémunération. Les femmes concourent à armes égales pour chaque poste, maximisant la production et les revenus féminins. Cela rend la maternité plus difficile, et les naissances reculeront encore alors que beaucoup choisissent l'ambition plutôt que la famille."
 JAP_a_society_where_women_thrive: "Une société où les femmes prospèrent"
 JAP_a_society_where_women_thrive_desc: "Les barrières structurelles sont tombées et les femmes travaillent à tous les niveaux avec une véritable égalité et un vrai choix, approfondissant la main-d'œuvre comme l'assiette fiscale. Ce que la réforme n'a jamais livré, ce sont des enfants. Le Japon travaille plus et gagne plus, tout en continuant de se contracter, soutenu par un appareil de garde et d'éducation que l'État devra financer pour toujours."
 JAP_open_japan: "Japon ouvert"
 JAP_open_japan_desc: "Le Japon attirera systématiquement des travailleurs de l'étranger par des pactes migratoires, une immigration fondée sur les compétences et une réforme des visas afin de combler le déficit de main-d'œuvre. Cela ferme la pénurie en quelques années plutôt qu'en décennies, assurant le plein emploi et la solvabilité des retraites. L'identité culturelle est mise sous tension, les communautés changent plus vite que le consentement, et chaque pas invite un contrecoup nationaliste."
 JAP_labor_migration_pact: "Accords bilatéraux sur la mobilité de la main-d'œuvre"
 JAP_labor_migration_pact_desc: "Le Japon formalisera des arrangements bilatéraux de travail avec les pays voisins, en élargissant le programme de formation technique des stagiaires et en établissant de nouveaux accords réciproques pour amener des travailleurs dans la construction, l'agriculture, les soins et l'industrie. Ces pactes sont rapides et efficaces : des dizaines de milliers de travailleurs peuvent être intégrés en quelques mois, comblant des pénuries critiques et stabilisant l'emploi dans des secteurs qui se contracteraient ou disparaîtraient autrement."
 JAP_points_based_immigration: "Programme des professionnels hautement qualifiés"
 JAP_points_based_immigration_desc: "Le Japon instaurera un système à points pour les professionnels hautement qualifiés, attribuant des points selon les diplômes, l'expérience, la langue et le séjour antérieur. Ingénieurs, infirmiers, chercheurs et financiers occupent des emplois à forte valeur et desserrent la contrainte sur la croissance. Les arrivants qualifiés amènent des familles et attendent une scolarité internationale, un coût que l'État absorbe en échange d'une capacité de recherche qu'il ne pourrait pas acheter autrement."
 JAP_integration_programs: "Cadre d'intégration tabunka kyōsei"
 JAP_integration_programs_desc: "Le Japon investira dans une intégration active, le tabunka kyōsei, par des cours de langue, des centres communautaires et des voies de résidence permanente pour les travailleurs migrants et leurs familles. Les nouveaux venus dotés des outils pour appartenir génèrent moins de frictions et contribuent plus pleinement. L'instruction linguistique, la scolarité et la protection sociale des familles migrantes deviennent une charge budgétaire permanente qui rachète ce que la migration non gérée coûte en police."
 JAP_multicultural_society: "Une société multiculturelle"
 JAP_multicultural_society_desc: "Le Japon étend le statut légal, la participation civique et la reconnaissance culturelle aux migrants et à leurs enfants comme membres à part entière de la communauté nationale. C'est une rupture profonde avec l'insularité historique, transformant le ressentiment potentiel en appartenance et soutenant la stabilité sociale. Les droits civiques et sociaux de millions de nouveaux Japonais sont des droits coûteux et permanents qui ne sortiront plus des comptes de l'éducation et du social."
 JAP_guest_worker_system: "Expansion du visa de travailleur qualifié spécifié"
 JAP_guest_worker_system_desc: "Le Japon élargira le visa de travailleur qualifié spécifié, tokutei ginō, amenant des travailleurs en contrats à durée déterminée pour la construction, l'agriculture, les soins et l'industrie. Ils viennent, font le travail et rentrent chez eux à la fin du contrat, comblant le déficit de main-d'œuvre sans les frictions d'une immigration permanente. Cela crée une population rotative peu protégée et sans ancrage communautaire, et la police de ce système devient un coût d'exploitation permanent."
 JAP_an_open_nation: "Une nation ouverte"
 JAP_an_open_nation_desc: "La population du Japon s'est stabilisée et a grandi par la migration, transformant un pays monoethnique en société multiculturelle. La stabilité économique et la solvabilité des retraites sont préservées, mais le sentiment d'homogénéité ethnique s'est fracturé et la génération aînée pleure une nation qui s'en va. Police, école et protection sociale pour une population arrivée plus vite que les institutions resteront élevées pendant une génération."
 JAP_economic_sectors: "Secteurs économiques du Japon"
 JAP_economic_sectors_desc: "De l'agriculture, de la sylviculture et de la pêche ancrées localement à l'industrie, aux services et aux technologies de pointe, nous ferons valoir les atouts du Japon sur tout le paysage industriel. Tout en soutenant l'emploi intérieur et la capacité d'approvisionnement, nous équilibrerons la compétitivité à l'export et l'investissement dans de nouveaux champs de croissance, portant notre fondation industrielle vers l'ère suivante."
 JAP_agricultural_revitalization: "Revitaliser les industries primaires"
 JAP_agricultural_revitalization_desc: "Le ministère de l'Agriculture, des Forêts et de la Pêche révise la loi fondamentale pour la première fois en un quart de siècle, liant les trois secteurs en une stratégie nationale unifiée de sécurité alimentaire. Alors que l'âge moyen des agriculteurs tend vers soixante-dix ans et que les champs s'abandonnent dans les campagnes, cette intégration devient le fondement du redressement rural et de chaque réforme qui suivra."
 JAP_corporate_farm_consolidation: "Les banques de terres agricoles et la fin du gentan"
 JAP_corporate_farm_consolidation_desc: "Les banques de consolidation des terres rassemblent les parcelles dispersées en exploitations plus vastes, tandis que l'abolition du quota de riz gentan met fin à un demi-siècle de paiement aux agriculteurs pour laisser les champs en jachère. La mécanisation et la discipline de marché relèveront la productivité, mais les petits producteurs familiaux incapables de concourir seront poussés hors de la terre."
 JAP_revitalize_rural_communities: "La stratégie de revitalisation régionale"
 JAP_revitalize_rural_communities_desc: "Sous la bannière du chihō sōsei, le gouvernement soutient l'agriculture dans les districts reculés par des paiements directs et canalise la richesse urbaine vers les villages via l'impôt natal, incitant les jeunes familles à s'installer là où les champs reviendraient autrement à l'état sauvage. La croissance y est plus lente que la consolidation d'entreprise, mais elle maintient la campagne en vie."
 JAP_smart_rice_farming: "L'agriculture intelligente et l'art du saké"
 JAP_smart_rice_farming_desc: "Le Japon associe l'héritage du riz à l'agriculture intelligente : guidage satellitaire, drones et rizières pilotées par capteurs permettent à une main-d'œuvre en recul et vieillissante de cultiver plus de terre avec moins de bras. Des marques premium telles que Koshihikari et la soif mondiale de saké japonais portent la récolte aux tables du pays et de l'étranger."
 JAP_premium_wagyu_brand: "La marque d'export du wagyu"
 JAP_premium_wagyu_brand_desc: "S'appuyant sur les indications géographiques protégées et la loi protégeant la génétique du wagyu contre la contrebande, le Japon développe la race en export premium dont le prix repose sur la provenance et la qualité plutôt que sur le volume. Les plus grands restaurants du monde porteront le bœuf japonais."
 JAP_sustainable_fisheries: "La réforme de la loi sur les pêches"
 JAP_sustainable_fisheries_desc: "La réforme de 2018 de la loi sur les pêches, première refonte en soixante-dix ans, impose des quotas scientifiques et récompense la pêche responsable tout en investissant dans l'aquaculture, du thon rouge d'élevage aux coquillages côtiers. Des mers durables maintiendront les villes côtières au travail et alimenteront la culture alimentaire de la nation."
 JAP_forestry_revival: "La taxe d'environnement forestier"
 JAP_forestry_revival_desc: "Financé par la taxe d'environnement forestier, le Japon éclaircit et reboise les plantations négligées de cèdre et de cyprès, mécanise l'exploitation et promeut le bois lamellé-croisé afin que le bois intérieur revienne sur les chantiers. Un secteur forestier renaissant ramène le travail dans les villages de montagne et transforme une ressource longtemps oisive en force nationale."
 JAP_pharmaceutical_powerhouse: "Affronter le retard des médicaments"
 JAP_pharmaceutical_powerhouse_desc: "Le troisième marché pharmaceutique mondial est tenu par Takeda, Astellas, Daiichi Sankyo et Chugai, pourtant un retard croissant laisse les patients attendre des années les médicaments étrangers. Le gouvernement simplifie l'approbation de la PMDA et soutient les biotechnologies et la médecine régénérative, transformant une industrie mature en moteur de croissance à forte valeur."
 JAP_rural_revitalization: "La sixième industrialisation"
 JAP_rural_revitalization_desc: "Sous la sixième industrialisation, rokuji sangyōka, les producteurs primaires transforment et vendent aussi ce qu'ils produisent. Gîtes à la ferme, aliments régionaux de marque et vente directe transforment des villages en difficulté en destinations, attirant les jeunes familles vers la terre comme l'ancre la plus fiable contre la marée démographique."
 JAP_agricultural_construction_drive: "Campagne de construction agricole"
 JAP_agricultural_construction_drive_desc: "Une poussée nationale concertée pour ouvrir de nouvelles terres agricoles et des installations rurales tant que la volonté politique et les subventions sont alignées, accélérant la construction à travers les campagnes."
 JAP_automotive_industry: "Les roues de la nation"
 JAP_automotive_industry_desc: "Sept constructeurs japonais assemblent ensemble huit millions de véhicules par an, soutenant environ un emploi japonais sur douze, y compris les équipementiers, concessionnaires et transporteurs. Des halls d'assemblage d'Aichi aux quais d'export de Yokohama, le Japon défendra sa place de premier exportateur mondial de véhicules."
 JAP_lean_production_system: "Le système de production Toyota"
 JAP_lean_production_system_desc: "Le système de production Toyota a façonné l'industrie moderne par le juste-à-temps, le jidoka et la quête kaizen d'élimination du muda, permettant aux usines japonaises de construire plus de voitures avec moins de défauts et moins de stocks que tout rival. Le Japon étendra la discipline lean à toute l'industrie, formant une génération à voir le gaspillage là où d'autres n'en voient pas."
 JAP_keiretsu_supplier_network: "La toile des fournisseurs keiretsu"
 JAP_keiretsu_supplier_network_desc: "Derrière chaque voiture finie se dresse une pyramide de fournisseurs liés par des décennies de confiance : Denso, Aisin, Toyota Industries et des milliers d'ateliers plus petits, chacun maître de son métier par la discipline du monozukuri. Le Japon approfondira ces liens keiretsu et garantira la survie des fournisseurs de rang deux et trois, faisant de la résilience de la chaîne d'approvisionnement un atout stratégique."
 JAP_precision_machine_tools: "Les robots qui construisent les voitures"
 JAP_precision_machine_tools_desc: "FANUC et Yaskawa dominent le marché mondial des robots industriels, tandis que Yamazaki Mazak, DMG Mori et Okuma fixent la norme des machines-outils de précision. Alors que la main-d'œuvre vieillit et se contracte, le Japon investira lourdement dans la robotique et la mécatronique, maintenant la nation comme l'atelier qui équipe les usines du monde."
 JAP_domestic_champions: "Le standard Lexus"
 JAP_domestic_champions_desc: "Lexus a prouvé que le Japon pouvait défier les maisons de luxe allemandes sur leur propre terrain, une leçon depuis répandue dans toute l'industrie. Le Japon cultivera la valeur de marque de son ingénierie et poursuivra les segments à forte marge, concourant sur la qualité et le prestige plutôt que sur le seul prix."
 JAP_hybrid_powertrains: "La révolution hybride"
 JAP_hybrid_powertrains_desc: "La Prius a prouvé que le Japon pouvait parier là où d'autres hésitaient, mariant moteur essence et moteur électrique sans exiger le réseau de recharge que le monde n'avait pas encore. Le Japon redoublera sur cette voie hybride, la raffinant en pont pragmatique entre l'âge du pétrole et ce qui viendra ensuite."
 JAP_battery_electric_shift: "Le pari de la batterie électrique"
 JAP_battery_electric_shift_desc: "La Nissan Leaf fut la première voiture électrique de masse, pourtant le Japon a depuis vu ses rivaux s'élancer sur la batterie pure. Pour rattraper, le gouvernement s'engage dans des programmes accélérés de cellules à l'état solide et une vague de gigafactories intérieures, afin que la pièce la plus précieuse de la voiture soit construite au pays."
 JAP_hydrogen_society: "Vers une société de l’hydrogène"
 JAP_hydrogen_society_desc: "La berline à pile à combustible Mirai et la stratégie fondamentale de l'hydrogène dessinent une vision où voitures, camions, foyers et centrales fonctionnent à l'élément le plus abondant de l'univers, n'émettant que de l'eau. Le Japon bâtira le réseau de ravitaillement et soutiendra les fabricants de piles, poursuivant l'hydrogène comme une réponse distinctement japonaise à la fin de la combustion."
 JAP_automotive_superpower: "La superpuissance de la mobilité"
 JAP_automotive_superpower_desc: "Le Japon ne sera pas forcé de choisir une seule route vers l'avenir. En maîtrisant à la fois l'hybride, la batterie et la pile à combustible tout en maintenant les usines lean et le réseau de fournisseurs les plus fins du monde, le Japon assure sa place de superpuissance de la mobilité du siècle."
 JAP_automotive_retooling_drive: "Réoutillage de la chaîne de montage"
 JAP_automotive_retooling_drive_desc: "Une poussée nationale pour rééquiper et moderniser les chaînes d'assemblage automobile, réaménageant les usines pour la prochaine génération de véhicules tant que l'investissement et la volonté politique sont alignés."
 JAP_battery_gigafactory_program: "Programme de gigafactories de batteries"
 JAP_battery_gigafactory_program_desc: "Une poussée concentrée pour ériger des gigafactories de batteries intérieures, montant rapidement la capacité de production de cellules afin que le cœur de la voiture électrique soit construit au pays plutôt qu'importé."
 JAP_motorcycle_kingdom: "Royaume des deux-roues"
 JAP_motorcycle_kingdom_desc: "Honda, Yamaha, Kawasaki et Suzuki construisent l'écrasante majorité des deux-roues motorisés de la planète, des scooters de quotidien qui font se déplacer des centaines de millions en Asie du Sud-Est aux superbikes d'un litre qui dominent le MotoGP et le World Superbike. Le Japon investira dans les usines deux-roues et défendra l'avance d'ingénierie qui maintient les rivaux une génération derrière les moteurs japonais."
 JAP_kei_car_mobility: "La nation des kei cars"
 JAP_kei_car_mobility_desc: "Près de deux voitures neuves sur cinq vendues au Japon appartiennent à la classe kei, des minivoitures plafonnées à 660 cm³ par un code fiscal conçu pour un pays plus pauvre, et à mesure que la population vieillit hors des villes, la kei car devient le dernier moyen pratique pour les retraités d'atteindre la clinique ou le magasin. Le Japon maintiendra la classe kei abordable et bien construite, soutenant la mobilité là où les trains ne circulent plus."
 JAP_jdm_soft_power: "La nation Gran Turismo"
 JAP_jdm_soft_power_desc: "La Skyline GT-R, la Supra et la RX-7 sont devenues des icônes mondiales de la culture automobile grâce à des anime comme Initial D et à la franchise Gran Turismo, qui ont appris à une génération de joueurs à aimer le badge JDM. Le Japon cultivera cet export d'image aux côtés de l'acier, en soutenant les ateliers de préparation, la culture du tōge et l'héritage du sport automobile qui font des voitures de performance japonaises des objets de dévotion mondiale."
 JAP_export_wharves: "Les quais d'exportation"
 JAP_export_wharves_desc: "Environ la moitié de chaque véhicule assemblé au Japon roule sur des transporteurs de voitures à Yokohama, Nagoya ou Kobe, à destination des ports du monde, faisant du Japon le premier exportateur mondial de véhicules. Le gouvernement élargira les quais, les parcs de triage et la flotte de transporteurs qui maintiennent ce flux d'automobiles vers l'extérieur sans interruption."
 JAP_automotive_export_drive: "Offensive d'exportations automobiles"
 JAP_automotive_export_drive_desc: "Une poussée nationale à durée limitée pour élargir la capacité d'assemblage et d'usines d'export, ajoutant des équipes et de la surface aux usines de voitures et de composants tant que les carnets de commandes à l'export sont pleins."
 JAP_electronics_revitalization: "Revitaliser l'électronique et les semi-conducteurs"
 JAP_electronics_revitalization_desc: "L'industrie électronique japonaise a été chassée de marchés qu'elle dominait autrefois par des concurrents en Corée, à Taïwan et en Chine. Sous la stratégie de revitalisation des semi-conducteurs du METI, l'État rassemble les forces survivantes en matériaux, outils et ingénierie de précision pour reconstruire une capacité compétitive. L'ancienne maîtrise de la puce peut être recouvrée si l'investissement coule maintenant."
 JAP_semiconductor_materials: "Maîtres des matériaux et des équipements"
 JAP_semiconductor_materials_desc: "Le Japon n'a jamais perdu sa prise sur l'amont de la chaîne des puces : Tokyo Electron domine les outils de dépôt et de gravure, Shin-Etsu et SUMCO fournissent les wafers de silicium du monde, et JSR et Tokyo Ohka tiennent le marché des photorésists. Le gouvernement élargit l'investissement dans cet effet de levier, laissant chaque fonderie étrangère dépendante des matériaux et des machines japonais."
 JAP_rapidus_moonshot: "Le moonshot Rapidus"
 JAP_rapidus_moonshot_desc: "Rapidus, soutenu par Toyota, Sony et l'État, se précipite pour construire une fab de deux nanomètres à Chitose, à Hokkaidō, en partenariat avec IBM et l'imec. Aucune firme japonaise n'a touché la pointe depuis des années et l'écart avec TSMC se mesure en milliards. Si le pari aboutit, le Japon réintègre la frontière de l'industrie d'un seul bond."
 JAP_foundry_partnership: "Le partenariat de fonderie de Kumamoto"
 JAP_foundry_partnership_desc: "Là où Rapidus parie sur la pointe, JASM à Kumamoto s'associe à TSMC et Sony pour produire des nœuds matures pour l'automobile et les capteurs. Le plafond est plus bas que le moonshot, mais le plancher est sous l'économie : des puces faites au pays, en volume, pour les industries qui ne peuvent se permettre la pénurie."
 JAP_semiconductor_sovereignty: "Souveraineté des semi-conducteurs"
 JAP_semiconductor_sovereignty_desc: "Bureaux d'études, fabricants d'outils, fournisseurs de matériaux et fabs sont tissés en un écosystème intérieur autonome. À l'âge des contrôles à l'export et des goulets d'étranglement, le Japon ne se tiendra plus dépendant de la bonne volonté étrangère pour le silicium dont son économie vit."
 JAP_home_electronics: "Le fantôme des Galápagos"
 JAP_home_electronics_desc: "Le syndrome des Galápagos a laissé l'électronique grand public japonaise brillante au pays et inapte à la vente à l'étranger, et le téléphone gara-kei était obsolète dès l'arrivée du smartphone. Sharp, Sony et Panasonic ont été chassés de marchés qu'ils régnaient. L'État stabilise ce qui reste, maintenant les chaînes et le métier en vie tandis que l'industrie retrouve ses appuis."
 JAP_gaming_powerhouse: "La puissance du jeu vidéo"
 JAP_gaming_powerhouse_desc: "Les consoles Nintendo figurent parmi les mieux vendues de tous les temps, la PlayStation de Sony ancre un empire mondial, et Capcom, Sega, Square Enix et Bandai Namco fournissent le logiciel des deux. Le gouvernement élargit l'investissement dans les studios et le matériel et élargit le vivier de talents qui maintient le Japon au centre du divertissement interactif."
 JAP_rights_and_licensing_regime: "Droits et licences à l'étranger"
 JAP_rights_and_licensing_regime_desc: "L'anime, le manga, les jeux et la musique portent l'image du Japon plus loin que toute ambassade, et l'initiative Cool Japan existe pour convertir cette portée en recettes. L'État investit dans la distribution, la traduction et la gestion des droits afin que la création gagne à l'étranger au lieu d'y fuir. Chaque licence est signée sous le droit des contrats et les normes de diffusion étrangères, et l'industrie l'apprend affaire par affaire."
 JAP_broadband_nation: "Une nation en fibre"
 JAP_broadband_nation_desc: "NTT et ses rivaux ont tiré la fibre jusqu'au foyer tandis qu'une grande partie du monde rampait encore sur le cuivre, donnant au Japon l'une des connectivités les plus rapides et les moins chères de la planète. Le gouvernement étend la fibre à haute capacité jusqu'aux dernières vallées et îles mal desservies afin qu'aucun coin du pays ne soit coupé de l'économie numérique."
 JAP_beyond_5g: "Vers au-delà de la 5G"
 JAP_beyond_5g_desc: "Le Japon a été exclu des guerres du smartphone et n'entend pas manquer le Beyond 5G. L'État finance des consortiums de recherche et des architectures de réseau ouvertes, du réseau d'accès radio à l'épine dorsale optique, afin que les firmes japonaises fixent les termes des réseaux des années 2030 plutôt que de se contenter de les acheter."
 JAP_electronics_superpower: "Superpuissance de l'électronique, une fois encore"
 JAP_electronics_superpower_desc: "Matériaux, fabs à Hokkaidō et Kyūshū, consoles et infrastructure de fibre achèvent désormais toute l'architecture électronique. L'ancien maître de l'âge du silicium a reconquis la frontière. Séoul, Taipei et Shanghai devront compter avec le retour du Japon."
 JAP_energy_resource_strategy: "Le plan énergétique stratégique"
 JAP_energy_resource_strategy_desc: "Le ministère de l'Économie, du Commerce et de l'Industrie coordonne le plan énergétique de base à travers la production d'électricité, la résilience du réseau et la sécurité des ressources afin d'isoler la nation des chocs énergétiques. Du nucléaire aux renouvelables et aux réserves stratégiques, ce bureau oriente tout l'appareil de l'État vers le maintien de l'éclairage et l'alimentation des fonderies."
 JAP_renewable_energy_expansion: "La révolution du tarif d'achat"
 JAP_renewable_energy_expansion_desc: "Le tarif d'achat libère la capacité solaire à travers Kyūshū et les parcs éoliens au large d'Akita, tandis que les normes d'efficacité Top Runner extraient le gaspillage de chaque appareil et de chaque ligne d'usine. Kyocera et Sharp basculent vers le commerce solaire. Le soleil et le vent ne peuvent jamais être soumis à un embargo."
 JAP_power_grid_stabilization: "Plus jamais dans le noir"
 JAP_power_grid_stabilization_desc: "De nouveaux convertisseurs de fréquence et interconnexions tissent le pays en un système résilient unique, comblant le fossé entre les cinquante hertz de l'est et les soixante hertz de l'ouest qui scindait autrefois le réseau. Les services publics reçoivent l'ordre de conserver une capacité de réserve et de choisir si le solaire, le thermique ou le stockage répond à chaque choc."
 JAP_resource_security_initiative: "Sécuriser les nerfs de l'industrie"
 JAP_resource_security_initiative_desc: "La stratégie nationale des ressources couvre stocks stratégiques, participations minières à l'étranger, recyclage et zone économique exclusive, le tout visant à isoler l'industrie de l'embargo. Les ministères dirigent l'acier, le pétrole et les métaux rares vers les usines qui en ont le plus besoin, transformant la dépendance importée en résilience gérée."
 JAP_hydroelectric_power: "Maîtriser les rivières de montagne"
 JAP_hydroelectric_power_desc: "Les rivières escarpées et alimentées par la pluie du Japon font tourner des turbines fiables, tandis que des stations de pompage-turbinage telles que Kannagawa stockent l'électricité bon marché de la nuit pour le pic du soir. Des barrages réusinés extraient davantage de l'infrastructure que le pays possède déjà. Le flux est propre, intérieur et constant."
 JAP_hydroelectric_power_TT: "Augmente la production hydroélectrique dans §Y[613.GetName]§!, §Y[615.GetName]§! et §Y[616.GetName]§! de §G25 %§!"
 JAP_geothermal_development: "Le feu sous les îles"
 JAP_geothermal_development_desc: "L'Organisation japonaise pour la sécurité des métaux et de l'énergie finance l'exploration géothermique de Hachijōjima aux hautes terres d'Appi, malgré les objections des parcs nationaux et des propriétaires de sources thermales. Les centrales à cycle binaire livrent une puissance constante jour et nuit, quel que soit le temps, puisant la chaleur de la Ceinture de feu pour servir le réseau."
 JAP_geothermal_development_TT: "Augmente la production géothermique dans §Y[609.GetName]§!, §Y[616.GetName]§! et §Y[617.GetName]§! de §G25 %§!"
 JAP_nuclear_restart: "Redémarrer les réacteurs"
 JAP_nuclear_restart_desc: "Dans le cadre de la politique de transformation verte, le gouvernement ramène la flotte nucléaire en ligne, de Sendai à Kyūshū jusqu'au vaste complexe de Kashiwazaki-Kariwa sur la mer du Japon. Les régulateurs sont stricts et le public méfiant, mais l'arithmétique de la sécurité énergétique est impitoyable. L'atome doit à nouveau porter la charge de base.\n-------------\nRéactive la production nucléaire et ouvre le §Yprogramme de redémarrage des réacteurs§!, dans lequel chaque centrale est ramenée une à une. Sendai, Ikata et le cluster de Fukui peuvent démarrer d'emblée ; les sites plus difficiles suivent une fois les focuses réglementaires et de consentement achevés."
 JAP_nuclear_regulatory_compliance: "Satisfaire les nouvelles normes de sûreté"
 JAP_nuclear_regulatory_compliance_desc: "Les centrales cherchant à redémarrer doivent passer les normes de l'Autorité de régulation nucléaire, les plus strictes du monde : adaptations sismiques et anti-tsunami, installations de sûreté obligatoires, et un examen qui n'accorde rien sur la confiance. Le travail est lent et énormément coûteux, et c'est la seule voie vers une flotte en service. Une centrale qui le franchit fonctionne mieux qu'avant.\n-------------\nLève l'esprit §YNormes de sûreté nucléaire durcies§! et ouvre les redémarrages de Genkai, Onagawa et Shimane."
 JAP_local_consent_accords: "Gagnez le consentement local"
 JAP_local_consent_accords_desc: "Un redémarrage exige plus que l'approbation du régulateur, car les gouverneurs de préfecture et les communes d'accueil détiennent un veto de fait et les tribunaux de district ont déjà accordé des injonctions. Kagoshima et Ehime ont débloqué Sendai et Ikata par des accords négociés avec les communautés d'accueil : subventions, emplois et confiance locale patiente. Le régime de subventions est coûteux, et c'est ce qui rend possibles les redémarrages les plus durs.\n-------------\nOuvre les redémarrages de Tomari et Kashiwazaki-Kariwa, les deux sites les plus difficiles du pays."
 JAP_restart_flagship_fleet: "Le cycle du combustible de Rokkasho"
 JAP_restart_flagship_fleet_desc: "L'usine de retraitement de Rokkasho, à Aomori, ferme le cycle du combustible, récupérant plutonium et uranium du combustible usé pour de nouveaux réacteurs. Le Japon détient du plutonium séparé et la capacité permanente de l'enrichir davantage, un fait que Pékin, Séoul et Pyongyang n'ont jamais manqué de remarquer.\n-------------\nLes voisins du Japon porteront un §Rregard sévère§! sur le stock."
 JAP_decommissioning_authority: "La longue mise à l'arrêt"
 JAP_decommissioning_authority_desc: "Démanteler la flotte en sûreté prend des décennies, un vivier d'ingénieurs nucléaires en recul qu'il faut tenir ensemble, et une gestion des sites longtemps après que les réacteurs sont froids. Le public respire plus facilement, le bilan non. Chaque flotte de réacteurs vieillissants du monde affronte le même règlement de comptes, et la nation qui maîtrise d'abord le travail peut vendre l'expertise à toutes les autres.\n-------------\nOuvre les projets de convertisseur de fréquence, d'interconnexion d'Hokkaidō et d'hydrogène de Kobe."
 JAP_lng_bridge_supply: "Le pont fossile"
 JAP_lng_bridge_supply_desc: "Le gaz naturel liquéfié et le charbon comblent le vide laissé par les réacteurs à l'arrêt, faisant du Japon le premier importateur mondial de GNL. Les centrales à gaz de Futtsu et Senboku peuvent être construites vite et poussées fort, mais chaque cargaison se paie en devises. La facture d'électricité des ménages porte la différence.\n-------------\nUn pont, et un pont §Rcoûteux§!. Le projet de co-combustion à l'ammoniac est la façon dont le Japon finira par en descendre."
 JAP_renewable_acceleration: "Soleil, vent et eau"
 JAP_renewable_acceleration_desc: "Les enchères d'éolien offshore dans les zones d'Akita et de Chiba, le solaire à l'échelle des services publics et des règles de raccordement réécrites font monter la part renouvelable plus vite que le tarif d'achat seul n'y est jamais parvenu. L'intermittence et les limites du réseau demeurent, et le kilowattheure le moins cher reste celui que le Japon a appris à ne plus consommer."
 JAP_fusion_energy_program: "L'approche élargie"
 JAP_fusion_energy_program_desc: "Le Japon a renoncé à accueillir ITER et a pris en échange l'approche élargie : l'accélérateur de matériaux de fusion et le centre de recherche international à Rokkasho, et le tokamak JT-60SA à Naka. Bobines supraconductrices, gyrotrons et un long apprentissage de la physique des plasmas sont le retour de ce marché.\n-------------\nQue les réacteurs redémarrent ou s'éteignent, le dossier de la fusion tient. C'est le seul pari énergétique que §Yni l'une ni l'autre voie n'exclut§!."
 JAP_national_energy_security: "Une nation propulsée"
 JAP_national_energy_security_desc: "Un approvisionnement stable et résilient (charge de base restaurée ou réseau renouvelable et stockage) reposant sur une base de recherche qui va au-delà de la fission. La sécurité énergétique devient le fondement de l'économie plus large."
 JAP_monarchy_resource_anchor_tt: "Les effets de §Y$JAP_rare_earth_resilience$§! seront améliorés"
 JAP_reactors_recommissioned_tt: "Les réacteurs mis sous cocon sont §Grecommissionnés§! et peuvent de nouveau produire de l'électricité"
 JAP_national_energy_security_tt1: "Avec §Y6§! des §Y8§! sites de réacteurs de nouveau en ligne (actuellement §Y[?JAP_reactor_sites_online|0]§!) :"
 JAP_national_energy_security_tt2: "Avec §Y6§! des §Y8§! projets de transformation verte livrés (actuellement §Y[?JAP_gx_projects_completed|0]§!) :"
 JAP_national_energy_security_tt3: "En deçà de l'un ou l'autre seuil :"
 JAP_minamitori_deep_sea: "La boue de Minamitori"
 JAP_minamitori_deep_sea_desc: "Les fonds marins de la zone économique exclusive japonaise autour de Minamitorishima recèlent des boues de terres rares à des concentrations introuvables ailleurs sur la planète, sous plus de cinq mille mètres d'eau. JOGMEC et l'université de Tokyo financent le tube élévateur et les essais de levage qui rendraient l'extraction possible. Si la boue peut être remontée, le Japon cesse de dépendre d'un seul fournisseur étranger pour les métaux dont ses aimants et moteurs ont besoin."
 JAP_national_petroleum_stockpile: "Remplir les réserves nationales"
 JAP_national_petroleum_stockpile_desc: "L'Organisation japonaise pour la sécurité des métaux et de l'énergie élargit la réserve stratégique de pétrole détenue dans les parcs de réservoirs côtiers de Shibushi, Kiire et Tomakomai, ajoutant cavernes salines et silos de surface. La réserve plus vaste offre à la nation des mois d'assurance contre une fermeture du détroit d'Ormuz. Un réservoir plein est une puissance silencieuse."
 JAP_grid_battery_storage: "Le réseau du futur"
 JAP_grid_battery_storage_desc: "GS Yuasa et Panasonic, vétérans de l'âge du lithium-ion, tournent leurs cellules vers le stockage à l'échelle du réseau tandis que des subventions d'État garantissent les batteries qui s'élèvent près des postes. Combiné à un réseau plus intelligent, le stockage lisse les pics et comble les creux. L'électron économisé à midi éclaire la ville au crépuscule."
 JAP_urban_mining: "Miner les villes"
 JAP_urban_mining_desc: "Dans ses usines de Naoshima et Onahama, Mitsubishi Materials récupère or, cuivre et métaux rares des déchets électroniques expédiés du monde entier. Les médailles des JO de Tokyo ont été frappées dans du métal récupéré. Ce que le pays jette, il le refond."
 JAP_horizontal_recycling: "Métal sans fin"
 JAP_horizontal_recycling_desc: "Le recyclage horizontal ramène aluminium et acier à leur grade d'origine, fermant la boucle entre la ferraille et le laminoir. UACJ et Kobe Steel construisent les lignes de tri et d'affinage qui rendent la récupération boîte à boîte et pièce à pièce viable à l'échelle industrielle. Une tonne maintenue en circulation est une tonne jamais plus importée."
 JAP_nankai_methane_hydrate: "La glace de feu de la fosse de Nankai"
 JAP_nankai_methane_hydrate_desc: "L'Organisation japonaise pour la sécurité des métaux et de l'énergie pousse ses navires de recherche vers une méthode commerciale pour l'hydrate de méthane enfermé dans la fosse de Nankai, au large du Pacifique. Le Japon y a mené le premier essai de production offshore du monde, et l'ingénierie reste non prouvée tandis que l'économie demeure redoutable. Si la glace de feu cède, le Japon n'aura plus jamais à mendier le gaz."
 JAP_model_competition: "Concours électronique d’Asie de l’Est"
 JAP_model_competition_desc: "L'industrie électronique japonaise est enfermée dans une contestation implacable avec ses voisins. Samsung et SK Hynix dominent la mémoire, TSMC possède le métier de fonderie de pointe, et les fabs chinoises grimpent nœud par nœud avec le soutien d'un fonds d'État quasi sans fond. Chaque avance d'un rival est un marché perdu, une marge comprimée, une génération d'ingénieurs tentée à l'étranger. Seul un investissement soutenu tient la pression à distance ; qu'il se relâche tandis que la concurrence s'élance, et le sol cède sous les pieds du Japon.\n-------------\nÉlever la §Yrésilience électronique§! au-dessus de la pression concurrentielle allège puis finit par retirer cet esprit national. Voir §Y$JAP_technological_isolation_category$§! pour les chiffres actuels."
 JAP_consumer_electronics_drive: "Lecteur d'électronique grand public"
 JAP_consumer_electronics_drive_desc: "Une poussée à durée limitée pour maintenir les lignes d'électronique grand public intérieures à pleine capacité, soutenant les usines, les fournisseurs et les mains qualifiées qui les assemblent tandis que l'industrie affronte la tempête."
 JAP_foundry_localization: "Programme de localisation des fonderies"
 JAP_foundry_localization_desc: "Un effort concentré pour localiser la chaîne d'approvisionnement des fonderies, érigeant outils, matériaux et techniciens formés autour des nouvelles fabs afin que la production intérieure de puces puisse monter en cadence."
 JAP_electronics_export_offensive: "Offensive d'exportations électroniques"
 JAP_electronics_export_offensive_desc: "Lancer une poussée coordonnée de subventions, missions commerciales et marketing conjoint pour reconquérir des parts de marché face aux concurrents étrangers, dépensant lourdement pour étayer la position du Japon dans le commerce mondial de l'électronique."
 JAP_electronics_resilience_up_tt: "§YRésilience de l'électronique§! face à la concurrence étrangère : $RIGHT|+=0$"
 JAP_CHI_chip_rivalry: "Rivalité des semi-conducteurs"
 JAP_electronics.1.t: "Les challengers asiatiques se rapprochent"
 JAP_electronics.1.d: "Les chiffres trimestriels se lisent durement à Tokyo. Samsung et SK Hynix ont élargi leur avance en mémoire, le carnet de commandes de TSMC déborde, et les fonderies chinoises remportent des contrats qui revenaient autrefois au Japon par défaut. Les analystes parlent ouvertement d'un secteur électronique japonais en déclin structurel. Les conseils d'administration de Kawasaki et d'Osaka savent la vérité : la concurrence ne rattrape plus, elle distancie."
 JAP_electronics.1.a: "Nous ne céderons pas le marché sans combat."
 JAP_electronics.2.t: "La Chine atteint la frontière"
 JAP_electronics.2.d: "La nouvelle tombe comme un coup de marteau. Les fabs chinoises, étayées par le Fonds national des circuits intégrés et indifférentes à des années de sanctions occidentales, ont atteint la pointe de la fabrication logique que seule une poignée de firmes sur terre peut toucher. La dernière hypothèse confortable de l'industrie japonaise, que le continent restait une génération derrière, a disparu. La frontière a bougé, et le Japon doit décider s'il relève le défi ou reste dans son sillage."
 JAP_electronics.2.a: "La frontière a bougé. Il faut répondre."
 JAP_electronics.3.t: "Le Japon reconquiert la couronne du silicium"
 JAP_electronics.3.d: "Contre toute attente, la marée a tourné. Les fabs japonaises expédient en volume, les matériaux japonais restent indispensables, et le design et le contenu japonais commandent le respect du monde entier. Les rivaux de Séoul, Taipei et Shanghai n'ont pas disparu, mais pour la première fois en une génération, ce sont eux qui regardent par-dessus leur épaule. La longue retraite est finie ; le Japon concourt de nouveau depuis une position de force."
 JAP_electronics.3.a: "Le Japon se tient de nouveau au sommet de l'industrie."
 JAP_electronics.4.t: "Le Japon revient à la frontière des semi-conducteurs"
 JAP_electronics.4.d: "Dans les fabs d'Hokkaidō à Kyūshū, dans les laboratoires, les studios de jeux et les tranchées de fibre, le Japon a achevé un regain que peu croyaient possible. Un pays rayé il y a une décennie comme l'incumbent déclinant de l'âge de l'électronique a reconquis la pointe et fait savoir qu'il entend y rester. L'équilibre de la course technologique d'Asie de l'Est a basculé, et chaque capitale de Séoul à Washington recalcule."
 JAP_electronics.4.a: "Une résurgence remarquable."
 JAP_demographic_pressure_modifier: "Pression démographique"
 JAP_demographic_pressure_modifier_desc: "Le Japon est l'une des sociétés les plus âgées et les plus rapidement contractées du monde, les décès dépassant les naissances et la population en âge de travailler en forte contraction. Cette crise tend la main-d'œuvre qui soutient la production, étire les budgets sociaux et de santé jusqu'à leurs limites, érode la stabilité budgétaire et met à l'épreuve le tissu social. Sur six axes (population, main-d'œuvre, stabilité, chômage, coûts de santé et coûts sociaux), le Japon affronte des pressions liées. Une réforme soutenue et multiforme des politiques natalistes, de l'emploi et de l'immigration peut alléger ces fardeaux et placer la nation sur une voie vers une population stable ou croissante."
 JAP_economy_modifier: "Économie japonaise"
 JAP_economy_modifier_desc: "Le moteur partagé du renouveau économique du Japon. Alors que des gouvernements successifs affrontent le déclin démographique et une concurrence montante de la Corée, de la Chine et de Taïwan, la réforme atteint chaque pilier de l'économie : les champs et les pêches qui nourrissent la nation, les constructeurs et les maisons de machines-outils qui ancrent ses exportations, les champions des semi-conducteurs et de l'électronique qui s'élancent pour sortir de la stagnation, la poussée pour sécuriser l'énergie et les ressources critiques d'un archipel presque sans les siennes, et les artères ferroviaires qui tissent les îles. Chaque avance se compose ici, relevant productivité, efficacité des usines et recherche tout en remodelant les exigences que le Japon place sur son industrie, ses ressources et son réseau électrique."
 JAP_political_modifier: "Kokkaï"
 JAP_political_modifier_desc: "Les réformes entreprises en réponse à la crise démographique remodèlent la politique nationale, ouvrant le pays à la migration tout en mettant à l'épreuve la cohésion sociale et la stabilité d'une nation peu habituée au changement."
 JAP_f15_programe_desc: "La flotte F-15J construite sous licence par Mitsubishi passe par une modernisation par étapes : nouveau radar, calculateurs de mission et affichages de cockpit sur les cellules qui valent d'être gardées, et une chaîne d'approvisionnement rationalisée pour le reste. La recherche chasseurs et aérospatiale court plus vite, et les cellules légères et moyennes sortent de chaîne moins cher."
 JAP_submarine_modernization_idea_desc: "La flotte diesel-électrique passe à la propulsion anaérobie puis, plus tard, aux cellules lithium-ion, prolongeant l'endurance en plongée sans réacteur. Kawasaki et Mitsubishi alternent les coques à Kobe, ce qui tient deux chantiers compétents et fait baisser le coût unitaire."
 JAP_carrier_aviation_desc: "L'aviation navale à voilure fixe revient dans la flotte japonaise pour la première fois depuis 1945. Les destroyers porte-hélicoptères sont réévalués comme bâtiments d'aviation, revêtements de pont et ascenseurs sont étudiés pour des appareils à décollage court, et le travail doctrinal d'exploitation d'un groupe aérien embarqué commence pour de bon."
 JAP_keen_sword_operation_idea_desc: "L'exercice conjoint biennal avec les États-Unis fait passer les Forces maritimes d'autodéfense par des manœuvres de flotte combinées, des débarquements amphibies et des drills de défense aérienne à une échelle qu'elles ne peuvent atteindre seules. Les équipages reviennent plus aiguisés, et les leçons survivent à l'exercice."
 JAP_nuclear_power_program: "Programme nucléaire de long terme"
 JAP_nuclear_power_program_desc: "Cinquante-deux réacteurs fournissent environ un tiers de l'électricité de la nation, et l'atome porte de nouveau la charge de base. Les régulateurs sont stricts et le public méfiant, mais l'arithmétique de la sécurité énergétique est impitoyable."
 JAP_nuclear_local_consent: "Accords de consentement locaux"
 JAP_nuclear_local_consent_desc: "Gouverneurs de préfecture et communes d'accueil ont été ramenés dans le processus par des accords de subventions, d'emplois et de confiance locale. Le régime de subventions est coûteux, et c'est ce qui rend possibles les redémarrages les plus durs."
 JAP_consolidate_national_defense_framework_cancel_tt: "Prend fin une fois que le bonus de l'§Yarticle 9§! à la §Ystabilité§! s'est dissipé et que les pénalités au §Ysoutien de guerre§! et à la §Ypopulation recrutable§! ont été pleinement résorbées"
 JAP_modernize_joint_command_cancel_tt: "Prend fin une fois que les pénalités de l'§Yarticle 9§! au §Ygain d'expérience terrestre, aérienne et navale§!, à la §Ypuissance de commandement§! et aux §Ycoûts d'officiers§! ont été pleinement résorbées"
 JAP_normalize_defense_procurement_mission: "Normaliser les systèmes d'acquisition de défense"
 JAP_normalize_defense_procurement_mission_desc: "L'élargissement des responsabilités de défense a placé une grande tension sur les processus d'acquisition existants. Cette mission suit la normalisation jusqu'à ce que les pénalités d'attaque et de défense terrestres s'estompent."
 JAP_normalize_defense_procurement_cancel_tt: "Prend fin une fois que les pénalités de l'§Yarticle 9§! à l'§Yattaque terrestre§! et à la §Ydéfense terrestre§! ont été pleinement résorbées et que les bonus à l'§Yattaque en territoire cœur§! et à la §Ydéfense en territoire cœur§! se sont dissipés"
 JAP_establish_asteroid_mining_network_mission: "Création d'un réseau d'extraction d'astéroïdes"
 JAP_establish_asteroid_mining_network_mission_desc: "Le Japon assemble son premier réseau minier d'astéroïdes, positionnant des plateformes orbitales et des démonstrateurs pour extraire des ressources parmi les étoiles. La mission suit le déploiement jusqu'à ce que le réseau soit opérationnel."
 JAP_reactor_restart_category: "Le programme de redémarrage des réacteurs"
 JAP_reactor_restart_category_desc: "Cinquante-quatre réacteurs fournissaient autrefois un tiers de l'électricité du Japon. Après 2011, tous ont été arrêtés. Le programme ramène chaque centrale une à une, sous des normes durcies et un consentement local."
 JAP_restart_sendai: "Redémarrer Sendai"
 JAP_restart_sendai_desc: "Les deux unités à eau pressurisée de Kyushu Electric à Satsumasendai, à Kagoshima, ont été parmi les premières à redémarrer. Elles servent de modèle aux accords de consentement local et aux adaptations de sûreté."
 JAP_restart_ikata: "Redémarrer Ikata"
 JAP_restart_ikata_desc: "La centrale de Shikoku Electric se tient sur l'étroite péninsule de Sadamisaki, à Ehime, avec la mer des deux côtés. Ikata a redémarré après des accords d'accueil et des adaptations sismiques."
 JAP_restart_takahama_ohi: "Redémarrer le cluster de Fukui"
 JAP_restart_takahama_ohi_desc: "La préfecture de Fukui accueille la plus dense concentration de réacteurs du pays. Les unités de Kansai Electric à Takahama, Ōi et Mihama ont alimenté l'industrie d'Osaka et de Kobe pendant des décennies, et plusieurs d'entre elles sont désormais assez vieilles pour que les exploiter au-delà de quarante ans ait exigé une prolongation séparée et contestée. Redémarrer le cluster restaure l'approvisionnement électrique du cœur industriel d'un seul geste."
 JAP_restart_genkai: "Redémarrer Genkai"
 JAP_restart_genkai_desc: "La centrale de Kyushu Electric dans la préfecture de Saga est revenue en 2018 après des adaptations qui incluaient l'une des premières installations de sûreté spécialisées construites selon les nouvelles règles. Genkai porte aussi le programme pluthermal du Japon, brûlant du combustible mixte oxyde qui ferme une partie de la boucle entre les réacteurs et l'usine de retraitement de Rokkasho."
 JAP_restart_onagawa: "Redémarrer Onagawa"
 JAP_restart_onagawa_desc: "Onagawa, à Miyagi, était plus proche de l'épicentre du séisme de 2011 que Fukushima Daiichi, et son digue de quatorze mètres a tenu. La ville a abrité des évacués dans le gymnase même de la centrale. Ramener l'unité 2 en 2024 a été le premier redémarrage d'un réacteur à eau bouillante du même type que celui qui a failli à Daiichi, et c'était l'argument le plus fort de l'industrie."
 JAP_restart_shimane: "Terminer l'unité Shimane 3"
 JAP_restart_shimane_desc: "La centrale de Chugoku Electric est la seule centrale nucléaire du Japon sise dans une capitale préfectorale, au bord de Matsue même. L'unité 3 a été construite mais jamais mise en service, laissée achevée et oisive pendant le long arrêt. La mettre en service n'est pas un redémarrage du tout mais un premier démarrage, et l'expertise de construction recouvrée ce faisant ne sera plus perdue."
 JAP_restart_tomari: "Redémarrer Tomari"
 JAP_restart_tomari_desc: "Les trois unités d'Hokkaido Electric à Tomari sont la seule centrale nucléaire de l'île du Nord, et leur perte a laissé Hokkaidō dépendante d'un mince interconnexion et d'une capacité thermique vieillissante, comme le black-out insulaire de 2018 l'a douloureusement montré. La réévaluation sismique du site a traîné plus d'une décennie. Restaurer Tomari est essentiel à l'autonomie énergétique de l'île."
 JAP_restart_kashiwazaki_kariwa: "Redémarrer Kashiwazaki-Kariwa"
 JAP_restart_kashiwazaki_kariwa_desc: "Sept unités sur la côte de Niigata en font la plus grande centrale nucléaire jamais construite. Kashiwazaki-Kariwa a été arrêtée après le séisme de 2007 puis de nouveau après 2011. La ramener en ligne restaure une capacité de base massive, mais le consentement local et les adaptations de sûreté en font l'un des redémarrages les plus durs du pays."
 JAP_gx_transition_category: "La transformation verte"
 JAP_gx_transition_category_desc: "Un Japon sans réacteurs doit trouver son électricité ailleurs, et l'archipel se tourne vers éolien, géothermie, stockage, interconnexions et hydrogène. Chaque projet remplace une production perdue par une génération que le Japon n'a pas à importer."
 JAP_gx_goto_floating_wind: "Aller à l’éolien offshore flottant"
 JAP_gx_goto_floating_wind_desc: "Les fonds au large du Japon s'enfoncent trop abruptement pour les fondations fixes utilisées en mer du Nord. L'éolien flottant au large de Gotō et d'ailleurs est la voie japonaise vers le vent offshore."
 JAP_gx_tohoku_geothermal: "Le cluster géothermique du Tōhoku"
 JAP_gx_tohoku_geothermal_desc: "Le Japon détient les troisièmes réserves géothermiques de la Terre et n'en utilise presque aucune. Le cluster du Tōhoku tapera la chaleur de la Ceinture de feu pour servir le réseau, jour et nuit, quel que soit le temps."
 JAP_gx_kanto_setsuden: "La campagne setsuden"
 JAP_gx_kanto_setsuden_desc: "L'été après la catastrophe, Tokyo a simplement moins consommé. Les bureaux ont baissé les lumières, les usines ont décalé les équipes, et les ménages ont appris le setsuden. Le kilowattheure le moins cher est celui que l'on n'utilise pas."
 JAP_gx_frequency_converter: "L'expansion des convertisseurs de fréquence"
 JAP_gx_frequency_converter_desc: "Tokyo tourne à cinquante hertz parce qu'elle a acheté des générateurs allemands dans les années 1890, et Osaka à soixante hertz parce qu'elle a acheté des américains. Des convertisseurs de fréquence plus vastes tissent le pays en un seul système résilient."
 JAP_gx_hokkaido_hvdc: "L'interconnexion d'Hokkaidō"
 JAP_gx_hokkaido_hvdc_desc: "Hokkaidō a la meilleure ressource éolienne du Japon et le moins de gens pour l'utiliser, un câble HVDC vers Honshū transforme ce surplus en électricité pour le Kantō."
 JAP_gx_kobe_hydrogen: "La chaîne d'approvisionnement hydrogène de Kobe"
 JAP_gx_kobe_hydrogen_desc: "Le premier transporteur d'hydrogène liquéfié du monde a accosté à Kobe en 2022, achevant une chaîne d'Australie au Kansai. Kobe devient le port de l'hydrogène du Japon."
 JAP_gx_hekinan_ammonia: "Co-cuisson d'ammoniac"
 JAP_gx_hekinan_ammonia_desc: "La centrale à charbon de Hekinan, à Aichi, est la plus grande du pays, et JERA a commencé la co-combustion à l'ammoniac pour en descendre progressivement. C'est le pont hors du fossile."
 JAP_gx_shikoku_solar_storage: "Solaire et stockage de Shikoku"
 JAP_gx_shikoku_solar_storage_desc: "Shikoku a le plus fort ensoleillement du Japon et un réseau assez petit pour que le solaire de midi sature les lignes. Le stockage lisse les pics et comble les creux."
 JAP_rubber_butadiene_branch_decision: "Branche du caoutchouc butadiène"
 JAP_rubber_butadiene_branch_decision_desc: "Le caoutchouc naturel peut être coupé, rationné ou tarifé jusqu'à la faiblesse, et le Japon ne peut dépendre d'une seule source. Nous développerons la branche butadiène pour un caoutchouc synthétique intérieur."
 JAP_demand_south_kuril_reject_tt: "Nous pouvons ouvrir une §Yguerre de frontière§! pour §Y$STATE_1168$§!, ou §Rdéclarer la guerre à [SOV.GetName]§!."
 JAP_demand_north_kuril_reject_tt: "Nous pouvons ouvrir une §Yguerre de frontière§! pour §Y$STATE_1168$§!, ou §Rdéclarer la guerre à [SOV.GetName]§!."
 JAP_demand_sakhalin_reject_tt: "Nous pouvons débloquer un §Yraid des forces spéciales§! sur §Y$STATE_691$§!, ou §Rdéclarer la guerre à [SOV.GetName]§!."
 JAP_claiming_philippines: "Revendiquer l'archipel philippin"
 JAP_claiming_philippines_desc: "L'archipel philippin commande les approches du Pacifique occidental et les goulets de la mer de Chine méridionale. Nous poserons des revendications comme affaire de sécurité maritime japonaise."
 JAP_demographic_emergency_taskforce: "Réponse d’urgence à la baisse du taux de natalité"
 JAP_demographic_emergency_taskforce_desc: "En réponse à l'effondrement démographique, le gouvernement a établi une task force d'urgence pangouvernementale, calquée sur la structure de l'Agence de l'enfance et de la famille et coordonnant le déploiement rapide de ressources à travers chaque ministère concerné. L'attention politique est intense, les silos bureaucratiques sont brisés, et une poussée d'expérimentation politique devient possible. Cette fenêtre de concentration et de mobilisation intenses est temporaire ; après 730 jours d'effort soutenu, l'atmosphère d'urgence s'estompe et la politique revient aux schémas institutionnels normaux, bien que les réformes elles-mêmes durent."
 JAP_increase_birth_budget: "Allocation familiale d’urgence doublée"
 JAP_increase_birth_budget_desc: "Le Japon injectera des fonds d'urgence du Trésor dans le système d'allocations pour enfant, doublant les transferts directs aux foyers avec enfants. Cette dépense immédiate et très visible apporte un soulagement aux jeunes familles et signale l'engagement de l'État envers la parentalité, relevant les naissances à court terme. Le coût à long terme est substantiel, gonflant le budget permanent des droits, mais les dividendes démographiques justifient la dépense tant que les naissances restent déprimées."
 JAP_child_care_subsidies: "Éducation et garde de la petite enfance universelles et gratuites"
 JAP_child_care_subsidies_desc: "À la suite de la politique d'octobre 2019, le Japon rendra l'éducation et la garde de la petite enfance gratuites pour toutes les familles, éliminant les frais de crèche et de maternelle. La subvention lève une barrière majeure à l'emploi parental, libérant les aidants, principalement les mères, vers la main-d'œuvre et permettant aux foyers contraints par le revenu d'avoir plus d'enfants. Le programme est coûteux mais livre à la fois des gains d'emploi et une amélioration modeste de la fécondité."
 JAP_invest_in_robotics: "Moteur d’automatisation de la société 5.0"
 JAP_invest_in_robotics_desc: "Le Japon accélérera la Nouvelle stratégie robotique de 2015, subventionnant l'automatisation industrielle, l'IA et la robotique pour compenser les travailleurs manquants. En remplaçant le travail humain dans la construction, l'industrie et la logistique par des machines, le Japon peut maintenir la production avec une main-d'œuvre plus petite. La stratégie est capitalistique mais puissante, pourtant le déplacement des travailleurs peu qualifiés peut d'abord pousser le chômage avant que de nouveaux rôles n'émergent dans l'exploitation et la maintenance."
 JAP_fertility_ivf_program: "Couverture d'assurance pour la fécondation in vitro"
 JAP_fertility_ivf_program_desc: "Le Japon élargira la couverture d'assurance de la fécondation in vitro (FIV) et des techniques de procréation assistée, rendant le traitement accessible à tous les couples éligibles indépendamment du revenu. À partir de 2022, les subventions d'assurance lèvent la barrière économique au traitement de l'infertilité, permettant aux couples qui resteraient autrement sans enfant d'avoir des enfants. L'impact sur les naissances est fort mais le fardeau de coût du système de santé s'élève nettement, plaçant une pression sur les finances publiques."
 JAP_family_housing_construction: "Programme de logements familiaux abordables"
 JAP_family_housing_construction_desc: "Le Japon financera une construction à grande échelle de logements abordables de taille familiale destinés aux foyers élevant des enfants. Les coûts élevés du foncier et du logement sont une barrière majeure à la formation des familles ; la construction subventionnée abaisse le seuil financier pour que les jeunes couples se marient et aient des enfants. Le programme est capitalistique mais il stabilise la société en offrant aux jeunes familles une voie crédible vers la propriété et signale l'engagement de l'État envers leur avenir."
 JAP_marriage_support_program: "Initiative d'aide aux jeunes mariés"
 JAP_marriage_support_program_desc: "Le Japon subventionnera les jeunes mariés par des aides au logement et des services de mise en relation, y compris le financement de programmes de konkatsu (chasse au mariage) et de plateformes de matching assistées par l'IA. L'État s'associera aussi aux collectivités locales pour organiser des événements de mariage communautaires. En réduisant les frictions financières et sociales autour de la formation du mariage, le programme pousse les naissances à la hausse à un coût fiscal moindre que les seules incitations à l'enfantement, bien que l'effet soit modeste."
 JAP_raise_retirement_age: "Loi de stabilisation de l'emploi des seniors"
 JAP_raise_retirement_age_desc: "Le Japon relèvera progressivement l'âge officiel de la retraite vers 70 ans, prolongeant les cotisations obligatoires et reportant l'éligibilité à la pension. À la suite de la législation de 2021, l'État incitera les employeurs à retenir les travailleurs âgés et les pressera d'offrir un emploi continu au-delà de la barre traditionnelle des 65 ans. C'est politiquement douloureux, les travailleurs râlent contre les années de labeur supplémentaires et le gouvernement doit dépenser du capital politique pour le forcer, mais la main-d'œuvre s'élargit directement et le fardeau des retraites s'allège."
 JAP_silver_employment_initiative: "Centres de ressources humaines Argent"
 JAP_silver_employment_initiative_desc: "Le Japon établira et financera des centres de ressources humaines argentées dans chaque grande ville, offrant placement à temps partiel, reconversion et mentorat aux seniors en bonne santé de plus de 65 ans. Ces centres mettront en relation des retraités expérimentés avec des employeurs ayant besoin de main-d'œuvre flexible dans le nettoyage, la sécurité, le soutien à la garde d'enfants et l'administration. Le programme est peu coûteux, préserve la dignité et ajoute des travailleurs productifs sans relever l'âge de retraite obligatoire, allégeant la pression du chômage à un coût modeste."
 JAP_preventive_health_program: "Initiative d'espérance de vie en bonne santé"
 JAP_preventive_health_program_desc: "Le Japon investira dans une santé préventive à l'échelle de la population : dépistage subventionné, vaccinations, conseil de mode de vie et intervention précoce contre les maladies chroniques. En maintenant la population vieillissante plus saine et fonctionnellement indépendante plus longtemps, l'État réduit les années passées en soins intensifs coûteux et en résidence en maison de retraite. Le programme est de la prévention pure (non pas traiter la maladie, mais la prévenir) et il livre de hauts rendements en coûts de santé réduits alors que les seniors restent actifs et autonomes jusqu'à leurs 80 ans."
 JAP_elderly_care_reform: "Modernisation du système de soins de longue durée"
 JAP_elderly_care_reform_desc: "Le Japon restructurera le système d'assurance de soins de longue durée pour passer des soins institutionnels (maisons de retraite) vers des soins intégrés de proximité : aides à domicile, centres de jour, cliniques locales et soutien familial plutôt que des établissements résidentiels coûteux. En réduisant la dépendance aux institutions coûteuses et en mobilisant les communautés, l'État coupe à la fois les budgets de santé et de soins sociaux. La transition est perturbatrice, certains perdent des soins institutionnels préférés et l'administration est tendue pendant le changement, mais les économies à long terme sont substantielles."
 Japan.105.t: "Proclamation de l'Empire"
 Japan.105.d: "La proclamation gît rédigée sur la table du Cabinet, le sceau à côté et la date laissée ouverte. Rien d'autre ne reste à restaurer : la Maison se tient, les rites sont observés, le Conseil privé siège. Seul le libellé n'est pas tranché.\n\nLe ministre de l'Armée parle le premier. Un empire se mesure sur le continent, en divisions levées et en sol tenu, et la proclamation devrait le dire. Le ministre de la Marine répond sans hausser la voix. Le Japon est un pays insulaire qui vit de ses routes maritimes, et un étendard levé sur la flotte sera lu correctement dans chaque port, de Vladivostok à Singapour. Les deux hommes se taisent et regardent vers le trône."
 Japan.105.a: "£JAP_EMPIRE_flag La force de l'Empire est dans ses armées."
 Japan.105.b: "£JAP_EMPIRE_NAVAL_flag La force de l'Empire est sur l'eau."
 JAP_american_pressure_article_nine_desc: "Washington a lié le dossier commercial au dossier de défense. Menaces tarifaires et levier sur les ressources servent à pousser Tokyo vers un rôle militaire plus large, et tant que l'argument n'est pas tranché le Japon négocie du côté faible de la table."
 JAP_jsw_tank_mio_trait_ladle_refining: "Affinage en poche d'acier propre"
 JAP_jsw_tank_mio_trait_muroran_arc_furnace: "Fours à arc électrique Muroran"
 JAP_jsw_tank_mio_trait_high_tensile_plate: "Laminage de plaques à haute résistance"
 JAP_jsw_tank_mio_trait_scrap_recycling: "Ligne de récupération des déchets"
 JAP_jsw_steel_modifier: "Usines sidérurgiques du Japon"
 JAP_jsw_steel_modifier_desc: "Chaque commande passée à Japan Steel Works est une commande passée à Muroran. Les fourneaux qui coulent les tubes et les plaques de blindage sont les mêmes qui alimentent les chantiers, le bâtiment et l'automobile, et chaque contrat qui les maintient à pleine capacité rend le pays moins dépendant du lopin importé. Ce que le budget de défense achète en acier d'artillerie, l'économie élargie le recouvre en tonnage."
 JAP_zombie_companies: "Entreprises zombies"
 JAP_zombie_companies_desc: "Des années de clémence ont maintenu en vie, à crédit bon marché, des entreprises non rentables et surendettées, immobilisant capital, main-d'œuvre et encadrement dont les industries saines ont besoin. Tant que ces firmes ne sont pas restructurées ou liquidées, construction, productivité et recettes de l'impôt sur les sociétés en pâtissent.\n-------------\nRelever le §Yprogrès de la restructuration des entreprises§! débloque la décision §Y$JAP_restructure_next_tranche$§!, qui allège cet esprit national étape par étape. Voir §Y$JAP_corporate_reform_category$§! pour les chiffres actuels."
 JAP_ykk_group: "Le groupe YKK"
 JAP_ykk_group_desc: "Yoshida Kogyo fabrique environ la moitié des fermetures à glissière produites dans le monde, quelque sept milliards par an dans des usines de plus de soixante-dix pays. L'entreprise lamine son propre laiton, file son propre polyester, mélange ses propres teintures et construit les machines qui assemblent le curseur fini, une intégration verticale qui ne laisse rien du produit hors de son contrôle. Les commandes militaires n'en sont qu'une petite part, mais une part exigeante, car l'attache d'un gilet porte-plaques, d'un harnais ou d'une veste de camouflage est le premier composant à lâcher sur le terrain. Les programmes japonais d'uniformes et d'équipement de protection s'appuient sur un fournisseur capable de revoir en interne une sangle, un revêtement ou un alliage anticorrosion plutôt que d'attendre un sous-traitant."
 JAP_karoshi_crisis: "La crise du karoshi"
 JAP_karoshi_crisis_desc: "Chronic overwork is grinding down Japan's workforce. Excessive unpaid overtime, the culture of 'service zangyo', drives stroke, heart failure, and suicide among salaried employees, while exhausted families put off having children. Stability, productivity, and research all suffer, healthcare and social spending climb, and the population edges downward year after year.\n-------------\nReform focuses and workplace campaigns raise $JAP_worker_wellbeing$. At §G30§! and §G60§! the §Y$JAP_enforce_next_reforms$§! decision unlocks and eases this national spirit one step; the focus at the end of your chosen path lifts it for good. While Japan's §Yzombie companies§! remain unresolved, every campaign yields half as much. See §Y$JAP_corporate_reform_category$§! for the current figures."
 JAP_karoshi: "Karoshi"
 JAP_karoshi_desc: "Le gouvernement nomme le karoshi crise nationale : des travailleurs tués par le surmenage, par l'AVC et l'insuffisance cardiaque au bureau et par le suicide après des mois de cent heures. La mort de l'employée de Dentsu Matsuri Takahashi l'a ramené à l'agenda national et a coûté son poste au président de l'entreprise. L'État doit maintenant décider jusqu'où il portera la main dans l'entreprise pour rendre le travail vivable."
 JAP_corporate_laws: "Réformer la loi sur les normes du travail"
 JAP_corporate_laws_desc: "Le gouvernement prend la voie législative, fermant la faille de l'article 36 par la loi de réforme du mode de travail et remplaçant les accords saburoku par des plafonds fermes appliqués par une Inspection des normes du travail renforcée. La gagner, c'est combattre employeurs et lobby des horaires flexibles à chaque étape en commission à la Diète. C'est la plus complète des trois réponses, et la plus lente à arriver."
 JAP_cultural_change: "Affronter la culture du surmenage"
 JAP_cultural_change_desc: "Le gouvernement milite sur la culture plutôt que sur la loi : le Premium Friday renvoie les salariés chez eux plus tôt une fois par mois, le dépistage de santé mentale atteint le lieu de travail, et le Livre blanc annuel sur le karoshi maintient les morts visibles aux employeurs comme aux recruteurs. Rien de tout cela ne touche la règle tacite selon laquelle les diligents ne partent qu'après le chef de section. Cette voie parie que le rapport du Japon au travail change par le bas, un lieu de travail et un foyer à la fois."
 JAP_keiretsu_pact: "Négocier avec les keiretsu"
 JAP_keiretsu_pact_desc: "L'État négocie directement avec les groupes d'entreprises et la fédération patronale Keidanren : réforme gérée contre stabilité, emploi à vie préservé, et firmes endettées à l'abri du choc. Aucune loi n'est votée et aucune société n'est montrée du doigt, car la concession s'échange contre la prévisibilité. C'est la voie la plus lente vers la réforme, et celle qui laisse le Japon des entreprises le moins changé."
 JAP_overtime_cap: "Le plafond de l'article 36"
 JAP_overtime_cap_desc: "Un accord saburoku déposé au bureau du travail transforme la semaine légale de quarante heures en suggestion, et la loi de réforme du mode de travail ferme le trou. Quarante-cinq heures supplémentaires par mois et trois cent soixante par an deviennent un plafond légal, jamais plus de cent en un seul mois, avec des peines pénales derrière les chiffres plutôt qu'une simple orientation administrative. Les chiffres suivent la ligne du karoshi que le ministère de la Santé, du Travail et des Affaires sociales utilise pour décider si un AVC ou un suicide a été causé par le métier."
 JAP_mandatory_paid_leave: "Cinq jours qu'un salarié doit prendre"
 JAP_mandatory_paid_leave_desc: "L'obligation s'inverse : un employeur accordant dix jours de congé ou plus doit désormais veiller à ce qu'au moins cinq soient réellement consommés, en désignant lui-même les dates si le salarié ne le fait pas. Les travailleurs japonais ne manquent pas de congés tant que de permission de les user, et à peine la moitié des congés accordés est jamais prise. Le même amendement emprunte l'intervalle de repos européen, onze heures entre deux postes, mais seulement comme devoir de s'efforcer."
 JAP_labour_inspection_offices: "L'Inspection des normes du travail"
 JAP_labour_inspection_offices_desc: "Le gouvernement dote l'Inspection des normes du travail pour faire appliquer plutôt que conseiller : plus d'inspecteurs, une comptabilité judiciaire pour attraper les cartes de pointage falsifiées qui transforment cent heures supplémentaires en vingt sur le papier, et la volonté de poursuivre. Quelques milliers d'inspecteurs ne peuvent policer soixante millions de travailleurs, si bien que la plupart des infractions n'apparaissent qu'après qu'un mort et une famille ont engagé un avocat. Le ministère publie déjà les noms des firmes qui violent la loi, et Dentsu elle-même a été condamnée après la mort de Matsuri Takahashi."
 JAP_karoshi_prevention_act: "La loi de prévention du karoshi"
 JAP_karoshi_prevention_act_desc: "La Diète vote la loi sur la promotion des mesures de prévention du karoshi, obligeant l'État à étudier les morts par surmenage, publier un Livre blanc annuel, et se tenir à des cibles mesurables : moins de cinq pour cent de travailleurs à soixante heures par semaine, soixante-dix pour cent des congés payés réellement pris, une offre de santé mentale dans chaque entreprise. Rendre les chiffres publics est l'objet, car ils peuvent alors être manqués en public. Le même paquet porte une exemption des professionnels de haut niveau levant les règles d'heures pour les spécialistes les mieux payés, une exception que les syndicats s'attendent à voir élargie."
 JAP_end_of_karoshi: "Un pays où le travail ne tue pas"
 JAP_end_of_karoshi_desc: "The ceiling on overtime holds because inspectors turn up unannounced and prosecutors follow them, leave is taken because the law requires it, and the contract worker beside you is paid what you are paid. The firms that could only survive on unpaid hours have been wound up rather than propped on evergreened credit, so nobody is left pleading that survival leaves them no choice. Japan will still work hard, but it has stopped treating exhaustion as evidence of loyalty.\n-------------\nRequires §YJapan's zombie companies§! to be fully resolved, §Y$JAP_karoshi_crisis$§! already eased to its final stage, and $JAP_worker_wellbeing$ of at least §G85§!. Completing this focus lifts the Karoshi crisis for good."
 JAP_premium_friday: "Vendredi premium"
 JAP_premium_friday_desc: "Le ministère de l'Économie, du Commerce et de l'Industrie lance le Premium Friday avec le Keidanren : le dernier vendredi de chaque mois, les salariés partent à quinze heures et passent la soirée dans les magasins plutôt qu'à leur bureau. Le calendrier est malheureux, car la fin de mois est celle où les comptes se ferment et les quotas se règlent, et peu de firmes s'y conforment avec enthousiasme. Ce qui survit, c'est le précédent de l'État qui nomme une heure et dit au pays d'arrêter de travailler."
 JAP_ikumen_project: "Le projet Ikumen"
 JAP_ikumen_project_desc: "Le ministère de la Santé, du Travail et des Affaires sociales mène la campagne ikumen pour faire d'un père qui élève ses enfants quelque chose à admirer plutôt qu'à expliquer. Le congé de paternité japonais est parmi les plus généreux du monde sur le papier, un an partiellement payé, et presque personne ne le réclame, car un homme qui dépose un dossier est un homme dont les collègues portent le travail et dont le chef de section se souvient. La loi révisée offre quatre semaines dans les huit après une naissance, fractionnables et simplement notifiées, un seuil assez bas pour qu'un père hésitant le prenne réellement."
 JAP_stress_check_programme: "Le bilan de stress"
 JAP_stress_check_programme_desc: "La loi amendée sur la sécurité et la santé industrielles exige de chaque lieu de travail de cinquante salariés ou plus une auto-évaluation psychologique annuelle, la première fois que l'État oblige les firmes japonaises à demander à leur personnel comment il va. Un salarié qui score mal peut demander un entretien avec un médecin et un ajustement de ses tâches, mais les résultats appartiennent à l'employé et un manager ne voit rien sans consentement. Cela protège l'individu et émousse l'instrument, et les firmes de moins de cinquante salariés ne sont invitées qu'à s'efforcer."
 JAP_telework_normalization: "Travailler de n'importe où"
 JAP_telework_normalization_desc: "Le gouvernement nomme son premier ministre de la Transformation numérique et ouvre l'Agence numérique, retirant l'exigence du sceau hanko de l'écrasante majorité des procédures administratives. Le télétravail n'était qu'une erreur d'arrondi non parce que la technique manquait, mais parce que les contrats exigeaient le sceau gravé et que les formulaires arrivaient encore par fax, si bien que quelqu'un devait être dans le bâtiment, le tampon à la main. Savoir si tout cela survit à l'urgence reste une question ouverte, car les firmes ont rappelé leur personnel à des bureaux dont elles avaient prouvé qu'elles n'avaient pas besoin."
 JAP_ending_service_zangyo: "La fin des heures de service"
 JAP_ending_service_zangyo_desc: "Le sabisu zangyo est l'heure travaillée et jamais enregistrée, donnée gratuitement parce que la journée se mesurait par auto-déclaration et que le salarié savait ce que le chef de section attendait que ce chiffre dise. La réforme attaque l'arithmétique plutôt que la culture : les employeurs doivent établir les heures par des moyens objectifs, lecteurs de cartes ou heures de connexion, et l'écart entre les deux registres est une preuve. Le ministère publie ce qu'il recouvre chaque année, des dizaines de milliards de yens de salaires impayés, et chacune de ces firmes a été prise plutôt qu'insolite."
 JAP_ending_compulsory_nomikai: "Le nomikai facultatif"
 JAP_ending_compulsory_nomikai_desc: "Le nomikai est volontaire au sens où l'invitation se formule en question, et le junior qui décline deux fois a dit quelque chose sur lui-même qu'aucun entretien d'évaluation n'enregistrera. La loi de prévention du harcèlement de pouvoir l'atteint de côté, définissant pour la première fois le harcèlement de pouvoir au travail dans le statut japonais et obligeant chaque entreprise à tenir une procédure de plainte et à protéger le plaignant. Une génération de travailleurs plus jeunes avait déjà cessé d'y aller, et la loi les a rattrapés."
 JAP_work_to_live: "Travailler pour vivre"
 JAP_work_to_live_desc: "Hours are recorded by the machine and match what happened, leave is taken because taking it costs nothing, and fathers file for the weeks after a birth and return to the same desk and the same prospects. None of it was won by statute alone, because it was never really about statute: it was about what a workplace expects when nobody is enforcing anything. Japan still works hard, and it has stopped confusing that with working itself to death.\n-------------\nRequires §YJapan's zombie companies§! to be fully resolved, §Y$JAP_karoshi_crisis$§! already eased to its final stage, and $JAP_worker_wellbeing$ of at least §G85§!. Completing this focus lifts the Karoshi crisis for good."
 JAP_corporate_reform_category: "Réforme du Japon des entreprises"
 JAP_corporate_reform_category_desc: "Japan's corporate sector carries two linked diseases. Banks keep unprofitable, over-indebted firms alive on rolled-over credit, locking up the capital and workers that healthier industries need. Those same firms buy loyalty with unpaid overtime, and the result is karoshi, death from overwork. Neither can be fully cured while the other persists.\n\n§YZombie Companies§!\n§YCorporate Restructuring Progress§!: [?JAP_corporate_restructuring_progress|0] / 100\nRestructuring crawls at §R+0.25 per month§! until the investigation closes and a resolution is chosen. §Y$JAP_controlled_downsize$§! then winds the firms up quickly, §Y$JAP_forced_mergers$§! absorbs them at half that pace, and the quality of the report scales both. The bank focuses and the recovery programmes below add one-off amounts.\n§RProgress stalls at 84§! until a resolution is chosen.\n§GThresholds§!\n§G30§! and §G60§!: the §Y$JAP_restructure_next_tranche$§! decision below unlocks, and each use eases §Y$JAP_zombie_companies$§! one step.\n§G85§!: the focus at the end of your chosen path removes it for good, either §Y$JAP_the_lost_decade_ends$§! or §Y$JAP_consolidated_japan_inc$§!, though the latter leaves a permanent mark behind it.\n§RWarning§!: a §Y$JAP_keiretsu_pact$§! slows the monthly accrual.\n\n§YThe Karoshi Crisis§!\n$JAP_worker_wellbeing$: [?JAP_karoshi_wellbeing|0] / 100\nThe reform focuses on your chosen path add Worker Wellbeing directly, and the workplace campaigns below top it up for as long as you keep paying for them.\n§GThresholds§!\n§G30§! and §G60§!: the §Y$JAP_enforce_next_reforms$§! decision below unlocks, and each use eases §Y$JAP_karoshi_crisis$§! one step.\n§G85§!: the focus at the end of your chosen path removes it for good, either §Y$JAP_end_of_karoshi$§!, §Y$JAP_work_to_live$§! or §Y$JAP_the_bargain_kept$§!. Each of them also requires the crisis to have been eased to its final stage first.\n§RWarning§!: every campaign yields §R4§! instead of §G8§! while §Y$JAP_zombie_companies$§! is still in place, and the path focuses themselves cannot carry you to §G85§! alone.\n\n§GHint§!: §Y$JAP_a_society_where_women_thrive$§! halves what the §Y$JAP_cultural_change$§! campaigns cost the treasury."
 JAP_premium_friday_campaign: "Promouvoir le vendredi premium"
 JAP_premium_friday_campaign_desc: "Financer un nouveau round de la campagne de publicité du ministère et des rabais commerçants qui l'accompagnent, et peser sur la fédération patronale pour que ses membres ferment plus tôt. Les firmes qui éteignent les lumières à quinze heures seront photographiées en train de le faire."
 JAP_ikumen_campaign: "Mener la campagne Ikumen"
 JAP_ikumen_campaign_desc: "Mettre des pères en congé parental sur les affiches, dans la publicité ministérielle et à la télévision, et publier le taux de recours entreprise par entreprise pour qu'un chiffre bas devienne un problème de recrutement. L'objet est de rendre le dépôt de congé banal plutôt que courageux."
 JAP_mental_health_campaign: "Campagne de santé mentale au travail"
 JAP_mental_health_campaign_desc: "Étendre le bilan de stress annuel sous le seuil de cinquante salariés, subventionner des médecins du travail pour les firmes trop petites pour en retenir un, et doter correctement les lignes d'écoute. Le dépistage n'aide que s'il y a quelqu'un au bout."
 JAP_no_overtime_day_campaign: "Déclarer une journée sans heures supplémentaires"
 JAP_no_overtime_day_campaign_desc: "Nommer un jour de semaine, éteindre les lumières du bureau à l'heure dite et renvoyer d'abord les chefs de section, car personne de junior ne part avant son supérieur. Grossier, visible, et la seule version de l'instruction qui ait jamais fonctionné."
 JAP_karoshi_resolved: "La crise du karoshi au Japon a été pleinement résolue"
 JAP_keidanren_charter: "La charte de l'équilibre vie professionnelle-vie privée"
 JAP_keidanren_charter_desc: "Le gouvernement, le Keidanren et le Rengo signent la charte de l'équilibre vie professionnelle-vie privée et y mettent des chiffres : réduire de moitié les travailleurs à soixante heures par semaine, prendre chaque jour de congé payé accordé, extraire le congé parental masculin des chiffres à un chiffre. Le document n'a ni force de loi ni sanctions, seulement une revue publique annuelle dans un conseil où le patronat siège à égalité. Les heures de travail japonaises n'ont jamais baissé par les poursuites, mais elles baissent lorsque les firmes doivent s'expliquer les chiffres les unes aux autres."
 JAP_shunto_offensive: "L'offensive de printemps"
 JAP_shunto_offensive_desc: "Le cabinet rejoint directement le shunto, l'offensive salariale de printemps, pressant le Keidanren de relever le salaire de base plutôt que les primes et étayant la demande par des crédits d'impôt pour les firmes qui s'y conforment. Les critiques parlent de kanmin shunto, une négociation gérée par l'État, et soutiennent qu'une ronde salariale menée depuis le bureau du Premier ministre n'est plus une négociation collective. Tant que le salaire de base ne monte pas, le salaryman continue de faire les heures supplémentaires qui paient son emprunt, quoi que dise le plafond."
 JAP_health_management_stocks: "Gestion de la santé et de la productivité"
 JAP_health_management_stocks_desc: "Le ministère et la Bourse de Tokyo commencent à nommer des titres de gestion de la santé et de la productivité, disant aux investisseurs que la santé du personnel est une dépense d'investissement plutôt qu'une œuvre sociale. La certification derrière, le White 500, est l'opposé délibéré de la liste noire des black companies et repose sur le constat que des travailleurs épuisés produisent moins et coûtent plus que des travailleurs reposés. Les firmes soumettent leurs propres chiffres d'heures et de santé pour gagner le badge, et celles qui ne peuvent en répondre face aux actionnaires comme aux recrues."
 JAP_morning_shift_system: "Le poste du matin"
 JAP_morning_shift_system_desc: "Itochu, une sogo shosha au centre de l'ancien keiretsu, interdit le travail après vingt-deux heures et paie plutôt les heures du petit matin à prime. Le raisonnement est commercial plutôt qu'humain : un trader à son bureau depuis neuf heures la veille se trompe de prix, et les heures du soir sont les moins productives de la journée. Les heures supplémentaires du soir se sont effondrées, le total d'heures a baissé, le profit a tenu et le taux de natalité de la firme a monté, ce qui a embarrassé chaque rival qui avait déclaré les horaires plus courts inabordables."
 JAP_job_based_employment: "Embauché pour un poste, pas pour une entreprise"
 JAP_job_based_employment_desc: "L'emploi japonais est fondé sur l'appartenance : un travailleur est embauché dans l'entreprise plutôt que dans un poste, muté à la discrétion de la firme sans tâches définies, d'où commence la journée de travail sans bornes. Hitachi, Fujitsu, KDDI et Shiseido publient désormais de vraies descriptions de poste avec une paye indexée au rôle, et le Keidanren a concédé que l'emploi à vie ne peut être maintenu. L'État finance mille milliards de yens de reconversion pour que le virage se lise comme une chance plutôt qu'une trahison."
 JAP_the_bargain_kept: "Le marché tenu"
 JAP_the_bargain_kept_desc: "The hours come down because the enterprise groups work out that they cost more than they earn, and having worked it out they move faster than any committee of the Diet could have made them. The cross-shareholdings stay intact, the main banks stay at the centre of their groups, and the productivity released by shorter days flows into the laboratories rather than into wage claims. The state carries what the bargain does not: the health insurance bill for the workers already broken, and the forbearance that keeps insolvent firms breathing.\n-------------\nRequires §YJapan's zombie companies§! to be fully resolved, §Y$JAP_karoshi_crisis$§! already eased to its final stage, and $JAP_worker_wellbeing$ of at least §G85§!. Completing this focus lifts the Karoshi crisis for good."
 JAP_demand_recovery_progress_tt: "§YProgression de la reprise de la demande§! : $RIGHT|+=0$"
 JAP_corporate_restructuring_progress_tt: "§YProgression de la restructuration d'entreprise§! : $RIGHT|+=0$"
 Japan_economy.32.t: "Un tribunal de district interrompt le redémarrage"
 Japan_economy.32.d: "Un tribunal de district a rendu une injonction bloquant le redémarrage d'un réacteur nucléaire, citant des doutes non résolus sur la sûreté sismique et la planification d'évacuation près de la centrale. La décision n'est pas définitive, mais elle gèle le retour du réacteur en service tandis que l'affaire va en appel. Les riverains et les groupes antinucléaires s'en sont saisis, tandis que les électriciens mettent en garde contre le coût d'une capacité encore oisive."
 Japan_economy.32.a: "Le combattre devant les cours d'appel."
 Japan_economy.32.b: "Renforcer les garanties locales de sécurité."
 JAP_zombie_firms_investigation: "Enquêter sur les entreprises zombies"
 JAP_zombie_firms_investigation_desc: "Les banques ont reconduit des prêts à des emprunteurs insolvables et les participations croisées ont laissé les dirigeants se cacher les uns derrière les autres. Les auditeurs entrent désormais dans les livres, nomment les firmes qui ne survivent que sur un crédit sans fin, et forcent les chiffres au grand jour."
 JAP_zombie_firms_investigation_TT: "Ouvre l'enquête. Les dossiers se construisent via §Y$JAP_zombie_investigation_category$§!, et les firmes riposteront."
 JAP_zombie_investigation_idea: "Enquête sur une entreprise zombie"
 JAP_zombie_investigation_idea_desc: "Les auditeurs passent au peigne fin les livres des firmes insolvables. L'incertitude ébranle les conseils d'administration et ralentit les bureaux tant que l'enquête suit son cours."
 Japan_economy.06.b: "Laisser les banques s'auto-déclarer"
 Japan_economy.07.b: "Contenir les retombées"
 JAP_zombie_investigation_western_pop_TT: "Publiciser la clémence discrédite le bloc réformiste pro-occidental : §Rla popularité du parti libéral baisse§!"
 JAP_controlled_downsize: "Réduction contrôlée"
 JAP_controlled_downsize_desc: "Le programme de revitalisation financière applique une évaluation d'actifs plus stricte et un provisionnement en flux de trésorerie actualisés, forçant du capital public dans les bilans qui ne peuvent tenir seuls. Les firmes insolvables sont liquidées et les usines fermées, rendant les travailleurs enfermés dans les morts-vivants aux vivants."
 JAP_complete_downsizing: "Achever la réduction de l'économie"
 JAP_complete_downsizing_desc: "La liquidation est terminée. Le crédit va désormais aux firmes qui peuvent le rembourser, le foncier s'échange à des prix qui reflètent son usage, et la direction ne mesure plus le succès à l'effectif. C'est l'économie que les réformateurs ont promise : plus petite sur le papier, bien plus forte dans le grand livre."
 JAP_venture_capital_funds: "Fonds de capital-risque"
 JAP_venture_capital_funds_desc: "La Innovation Network Corporation of Japan met du capital d'État derrière les start-up privées, appariant le risque du capital-risque à un soutien public. Les ménages japonais détiennent une épargne énorme qui n'atteint presque jamais un fondateur, et c'est ainsi que ce capital est mis en mouvement."
 JAP_infrastructure_investments: "Investissements d'infrastructure"
 JAP_infrastructure_investments_desc: "Le plan fondamental de résilience nationale engage le ministère du Territoire, des Infrastructures, des Transports et du Tourisme à renouveler les ponts, tunnels et digues construits durant les décennies de forte croissance, la plupart ayant désormais plus de cinquante ans de service. Les travaux publics sont les artères d'une nation industrielle lorsqu'ils sont bien faits."
 JAP_growth_tax_reform: "Réforme fiscale pour la croissance"
 JAP_growth_tax_reform_desc: "Le Japon a longtemps porté l'un des fardeaux d'impôt sur les sociétés les plus lourds du monde développé. Des réformes successives ont abaissé le taux effectif d'environ trente-sept pour cent vers les vingt, élargissant l'assiette tout en baissant le taux et récompensant les firmes qui relèvent les salaires et investissent au pays. Une entreprise qui fait travailler ses profits vaut plus au Trésor qu'une qui les thésaurise."
 JAP_startup_education_programs: "Programmes de formation pour les nouvelles entreprises"
 JAP_startup_education_programs_desc: "Les programmes EDGE et EDGE-NEXT placent la formation à l'entrepreneuriat dans les universités nationales, et les bureaux de licences technologiques transforment les brevets de laboratoire en entreprises. Un diplômé de Todai ou de Tokyo Tech devrait voir fonder une firme comme une carrière, non comme une honte à expliquer à ses parents."
 JAP_retirement_reform: "Réforme des retraites"
 JAP_retirement_reform_desc: "La loi révisée sur la stabilisation de l'emploi des personnes âgées demande aux employeurs d'assurer des opportunités de travail jusqu'à soixante-dix ans. Les seniors sont en bonne santé, qualifiés et volontaires, et les garder dans la main-d'œuvre allège le fardeau des retraites tout en rendant des décennies de métier accumulé à l'atelier."
 JAP_forced_mergers: "Fusion"
 JAP_forced_mergers_desc: "Plutôt que de laisser les firmes faibles échouer, le ministère les marie aux fortes : il trace les lignes, les banques apportent le capital, et personne n'a à avouer l'échec. Les zombies disparaissent du registre, et les ingénieurs malheureux, les usines en double et les nouveaux maîtres méprisés restent tous."
 JAP_megabank_consolidation: "Consolidation des mégabanques"
 JAP_megabank_consolidation_desc: "Le Japon rassemble ses banques de ville malades en trois mégabanques : Mizuho, Sumitomo Mitsui et Mitsubishi UFJ. Les fusions enterrent une décennie de créances douteuses dans des bilans trop vastes pour être questionnés, et produisent des prêteurs qu'aucun gouvernement ne pourrait se permettre de laisser faillir."
 JAP_industrial_revitalization_corp: "Société de revitalisation industrielle"
 JAP_industrial_revitalization_corp_desc: "La Industrial Revitalization Corporation of Japan achète la dette en détresse et prend en main les firmes en difficulté, Daiei et Kanebo parmi les quarante et une qu'elle restructure. Un véhicule public de retournement peut dicter des termes, réarranger les dettes et diluer discrètement les actionnaires d'une façon qu'aucun créancier privé n'oserait tenter."
 JAP_national_champion_mergers: "Fusions de champions nationaux"
 JAP_national_champion_mergers_desc: "Le METI fusionne les divisions perdantes de firmes rivales et nomme la somme un champion : Renesas à partir des bras puces de NEC, Hitachi et Mitsubishi, Japan Display à partir des activités d'écrans de Sony, Toshiba et Hitachi. Savoir si trois unités en difficulté font une entreprise saine est soigneusement laissé non dit."
 JAP_keiretsu_cross_shareholding: "Participation croisée de Keiretsu"
 JAP_keiretsu_cross_shareholding_desc: "Le mochiai, la toile des participations alliées, est l'architecture discrète du Japon des entreprises, et chaque réforme à ce jour a tenté de la défaire. Le gouvernement resserre au contraire les nœuds, isolant les conglomérats des investisseurs activistes et des OPA hostiles. Les emplois restent en sécurité, et aussi chaque dirigeant médiocre."
 JAP_employment_preservation_pact: "Pacte de maintien de l’emploi"
 JAP_employment_preservation_pact_desc: "Le shushin koyo, l'emploi à vie, n'a jamais été une loi mais un marché entre firme, syndicat et État, soutenu par des subventions d'ajustement. Le gouvernement l'écrit : aucun travailleur ne perd son emploi à cause d'une fusion. La nation achète la paix sociale et la paie avec des usines qui ne peuvent jamais fermer."
 JAP_consolidated_japan_inc: "Consolidée Japon Inc."
 JAP_consolidated_japan_inc_desc: "La dernière des firmes faibles est signée dans une fusion et le registre est clos. Les champions sont énormes, le ministère peut tracer la carte industrielle sur une seule feuille, et les rivaux étrangers la traitent avec le respect méfiant dû à tout géant. À l'intérieur, les usines en double tournent encore et les ingénieurs malheureux défilent encore à dix-huit heures.\n-------------\nCe focus §Gretire§! §Y$JAP_zombie_companies$§! et le §Y$JAP_fusion_restructuring$§! venu avec les fusions, et laisse §Y$JAP_consolidated_conglomerates$§! de façon permanente."
 JAP_venture_capital_funds_decision: "Capitaliser le fonds d'innovation"
 JAP_venture_capital_funds_decision_desc: "Mettre de l'argent public dans les fonds aux côtés de gérants privés, à condition que les gérants choisissent les gagnants. Couvre une année d'effort de recherche concentré dans les nouvelles firmes."
 JAP_infrastructure_investments_decision: "Lancer les travaux de renouvellement du Chubu"
 JAP_infrastructure_investments_decision_desc: "Engager la capacité de construction civile au renouvellement des routes, ponts et réseaux du corridor industriel du Chubu. Les travaux occupent les usines tant qu'ils durent et laissent l'infrastructure de la région nettement améliorée."
 JAP_growth_tax_reform_decision: "Baisser le taux des sociétés"
 JAP_growth_tax_reform_decision_desc: "Abaisser le taux effectif des sociétés pour un an et laisser les firmes garder davantage de ce qu'elles gagnent. Les prix à la consommation s'allègent à mesure que les entreprises transmettent une part de l'allègement aux ménages."
 JAP_startup_education_programs_decision: "Financer la filière start-up universitaire"
 JAP_startup_education_programs_decision_desc: "Doter des facultés d'entrepreneuriat et des bureaux de licences technologiques dans les universités nationales, transformant le travail de laboratoire en entreprises et accélérant notre recherche industrielle."
 JAP_retirement_reform_decision: "Étendre la garantie d'emploi jusqu'à soixante-dix ans"
 JAP_retirement_reform_decision_desc: "Subventionner les employeurs qui gardent des travailleurs qualifiés au-delà de l'âge de retraite traditionnel. Des décennies de métier accumulé restent à l'atelier une année de plus."
 JAP_rail_modernization: "Modernisation ferroviaire"
 JAP_rail_modernization_desc: "Le Tokaido Shinkansen ancre le réseau ferroviaire le plus dense de la Terre, et le matériel, la signalisation et les gares derrière lui sont renouvelés ligne par ligne. Les chemins de fer restent l'épine d'une économie industrielle qui ne peut se permettre qu'ils faillent."
 JAP_shinkansen_network_expansion: "Extension du réseau Shinkansen"
 JAP_shinkansen_network_expansion_desc: "Sous la loi de développement du réseau national de Shinkansen, des gouvernements successifs ont poussé les lignes à grande vitesse hors du noyau Tokaido vers le Hokuriku, Kyushu et Hokkaido. Accélérer ces projets tissera des préfectures lointaines dans l'économie nationale et raccourcira les lignes d'approvisionnement à travers les îles métropolitaines."
 JAP_chuo_shinkansen_maglev: "Chuo Shinkansen Maglev"
 JAP_chuo_shinkansen_maglev_desc: "Le Chuo Shinkansen est la ligne maglev supraconductrice de JR Central entre Tokyo, Nagoya et Osaka, sa série L0 détenant le record mondial de vitesse ferroviaire à 603 km/h. L'engagement de l'État porte le prototypage et le tunnelage profond du chemin de fer commercial le plus rapide jamais tenté."
 JAP_freight_modal_shift: "Transfert modal de fret"
 JAP_freight_modal_shift_desc: "Japan Freight Railway mène un report modal du fret des camions longue distance vers le rail, promu par la marque Eco Rail et des conteneurs normalisés de trente et un pieds. Déplacer davantage de fret par le rail réduit les émissions, allège la pénurie de conducteurs et renforce la chaîne d'approvisionnement industrielle."
 JAP_station_city_model: "Modèle de ville-gare"
 JAP_station_city_model_desc: "JR East a transformé les grandes gares en villes commerciales à part entière, développant les concourses de commerces dits ekinaka et les tours autour de Shinagawa, Shibuya et Tokyo Station. Concentrer bureaux et commerces sur les nœuds de transit relève la valeur foncière et la productivité du cœur urbain."
 JAP_regional_line_preservation: "Préservation des lignes régionales"
 JAP_regional_line_preservation_desc: "Alors que le dépeuplement rural vide la fréquentation, JR West et les chemins de fer du troisième secteur peinent à garder les lignes locales ouvertes. Plutôt que d'abandonner la campagne, nous subventionnerons le rail communautaire, préservant l'accès à l'approvisionnement et la mobilité pour les régions que les lignes de tronc contournent."
 JAP_port_rail_intermodal: "Intermodal port-rail"
 JAP_port_rail_intermodal_desc: "La politique des ports stratégiques internationaux concentre le trafic de conteneurs sur les grappes portuaires de Keihin et Hanshin. Étendre les voies ferrées à quai et les terminaux intérieurs relie les ports directement au réseau de fret, déplaçant les conteneurs du navire au train sans camionnage oisif."
 JAP_green_logistics_network: "Réseau Logistique Vert"
 JAP_green_logistics_network_desc: "Un réseau logistique vert de rail électrifié, de locomotives à batterie et à hydrogène, et de centres de distribution consolidés décarbonise le mouvement des marchandises à travers le pays dans la quête de la neutralité carbone."
 JAP_rail_technology_exports: "Exportations de technologie ferroviaire"
 JAP_rail_technology_exports_desc: "Le rail à grande vitesse japonais est un export phare. Des rames dérivées de l'E5 sous-tendent la ligne Mumbai-Ahmedabad en Inde, le 700T sert le Taiwan High Speed Rail, et le financement de la JICA emballe la technologie Shinkansen dans le monde. Gagner ces contrats répand nos normes et notre influence."
 JAP_global_rail_superpower: "Superpuissance ferroviaire mondiale"
 JAP_global_rail_superpower_desc: "Avec le Chuo Shinkansen poussé jusqu'à Osaka et nos exportations qui font le tour du globe, le Japon se dresse comme le leader incontesté du rail à grande vitesse. L'âge du maglev commence au pays et rayonne vers l'extérieur, symbole durable de l'ingénierie japonaise."
 JAP_chuo_shinkansen_program: "Programme du Chūō Shinkansen"
 JAP_chuo_shinkansen_program_desc: "Un effort national dédié au prototypage du maglev supraconducteur, accélérant notre projet spécial maglev."
 JAP_high_speed_line: "Ligne à grande vitesse"
 JAP_high_speed_line_desc: "Un nouveau corridor Shinkansen relève la productivité régionale, accélère la construction locale et élargit le débit d'approvisionnement."
 JAP_rail_category: "Secteur ferroviaire"
 JAP_hokuriku_shinkansen_extension: "Shinkansen Hokuriku : de Kanazawa à Tsuruga"
 JAP_hokuriku_shinkansen_extension_desc: "Prolonger le Hokuriku Shinkansen de Kanazawa à Tsuruga, le tronçon ouvert en 2024, reliant la côte de la mer du Japon au réseau national à grande vitesse."
 JAP_nishi_kyushu_shinkansen: "Shinkansen Nishi Kyushu"
 JAP_nishi_kyushu_shinkansen_desc: "Ouvrir la route Nishi Kyushu vers Nagasaki, en service depuis 2022, portant l'ouest de Kyushu sur le maillage Shinkansen."
 JAP_sanyo_shinkansen_upgrade: "Surclassement Sanyo Shinkansen"
 JAP_sanyo_shinkansen_upgrade_desc: "Déployer le matériel N700S et moderniser le tronc Osaka-Hakata pour des vitesses plus élevées et une plus grande fiabilité."
 JAP_tohoku_shinkansen_upgrade: "Tohoku Shinkansen 320 km/h"
 JAP_tohoku_shinkansen_upgrade_desc: "Faire rouler les trains de la série E5 à 320 km/h sur le tronc du Tohoku, réduisant les temps de trajet de Tokyo vers Aomori."
 JAP_hokkaido_shinkansen_sapporo: "Hokkaido Shinkansen : extension de Sapporo"
 JAP_hokkaido_shinkansen_sapporo_desc: "Percer les tunnels et élever les viaducs pour porter le Shinkansen de Shin-Hakodate-Hokuto jusqu'à Sapporo."
 JAP_shikoku_shinkansen: "Shikoku Shinkansen"
 JAP_shikoku_shinkansen_desc: "Réaliser la ligne de plan de base longtemps prévue, apportant le rail à grande vitesse à l'île de Shikoku pour la première fois."
 JAP_plutonium_stockpile_concern: "Stock de plutonium séparé"
 JAP_galapagos_syndrome: "Syndrome des Galapagos"
 JAP_galapagos_syndrome_desc: "Le Japon a construit un monde technologique complet à l'intérieur de ses propres frontières, puis a constaté qu'il ne pouvait en exporter aucun. Ses réseaux mobiles tournaient en PDC tandis que le reste de la planète se normalisait sur le GSM, si bien qu'aucun combiné intérieur ne pouvait se vendre à l'étranger et qu'aucun combiné étranger ne pouvait se vendre ici. La navigation est arrivée par i-mode et le paiement par FeliCa, chacun en avance de plusieurs années sur tout ce qui existait outre-mer et chacun incompatible avec tout ce qui existait outre-mer. La certification intérieure, la spécification JIS et les achats keiretsu ont fait le reste, remplissant le marché intérieur de produits conçus pour un client qui n'existe nulle part ailleurs. Cent vingt millions de consommateurs suffisent à soutenir une industrie et tout juste trop peu pour la forcer vers l'extérieur.\n-------------\nCet esprit national ne se désescalade pas tout seul. La §Rvitesse de recherche§! dérive régulièrement vers le bas tant que le Japon reste fermé, ralentie mais jamais inversée par des mesures temporaires. Seule la voie §YIntégration au monde§!, menée à §G85§! d'§Youverture§!, le retire. Voir §Y$JAP_technological_isolation_category$§! pour les chiffres actuels."
 JAP_galapagos_modifier: "Dérive des Galapagos"
 JAP_galapagos_modifier_desc: "Le compte courant de l'éloignement du Japon du monde avec lequel il commerce. La recherche glisse un peu plus chaque mois que le pays s'en tient à ses propres normes, et plus il s'éloigne des normes qu'utilisent ses clients, plus il glisse vite. Les mesures temporaires ralentissent la chute. Seule une véritable intégration l'arrête."
 JAP_galapagos_resolved: "Le Japon est sorti de son isolement Galápagos"
 JAP_galapagos_syndrome_focus: "La question Galápagos"
 JAP_galapagos_syndrome_focus_desc: "Le marché intérieur japonais est rentable et en contraction, protégé par des normes qui verrouillent le pays hors de partout ailleurs. Le ministère débat si la réponse est la convergence, réécrire les normes pour coller au monde, ou la commercialisation, vendre la différence elle-même. Les mesures partielles ralentissent la dérive de la recherche, mais aucune n'aborde le choix sous-jacent."
 JAP_technological_isolation_category: "Galápagos et la guerre de l'électronique"
 JAP_technological_isolation_category_desc: "Japanese industry perfected products for Japan alone: superb handsets, standards and services that nobody outside the home market could use, while the rest of the world standardised around someone else. That same insularity now leaves Japan's semiconductor sector exposed as China climbs the technology ladder.\n\n§YGalapagos Syndrome§!\n§YOpenness§!: [?JAP_galapagos_openness|0] / 100\n§Y$JAP_galapagos_drift_review_mission$§! reports the drift every thirty days and shows the exact figure before it is applied. The lower Openness sits the faster research falls behind, down to nothing at all at §G100§! and never worse than §R-15%§!.\n§GRaising Openness§!: the integration focuses carry most of it and the electronics focuses add the rest. The two campaigns below add a little more, but they only slow the drift. They cannot cure the syndrome.\n§GRemoval§!: only the §Y$JAP_world_integration$§! path removes §Y$JAP_galapagos_syndrome$§!, and only once Openness passes §G85§!. The §Y$JAP_cool_japan_doctrine$§! path keeps the spirit on purpose and turns Japan's cultural reach into influence instead.\n\n§YThe Model Competition§!\n§YCompetitive Pressure§!: [?JAP_electronics_pressure|0] / 3\n§YElectronics Resilience§!: [?JAP_electronics_resilience|0]\nPressure starts at §R1§!, rises to §R2§! once Korea and Taiwan pull ahead (from 2008, or sooner if China climbs the semiconductor ladder) and to §R3§! when China reaches the leading edge. Pressure minus Resilience decides which tier of §Y$JAP_model_competition$§! Japan suffers. Match the pressure and the spirit lifts; let it climb past Resilience again and the spirit returns.\n§GRaising Resilience§!: the semiconductor focuses grant it, each of them waiting on Microchip Production IV, and the export offensive below adds one a year until Resilience reaches §G5§!.\n§GRemoval§!: §Y$JAP_electronics_superpower$§! ends the competition for good."
 JAP_international_standards_adjustment: "Ajustement des normes internationales"
 JAP_international_standards_adjustment_desc: "L'industrie japonaise écrit ses propres normes, le PDC pour le mobile et l'ISDB pour la radiodiffusion, et chacune verrouille le marché intérieur loin du monde GSM et DVB extérieur. Le gouvernement envoie des ingénieurs dans les groupes de travail ISO et IEC, ce qui ne peut défaire la divergence du jour au lendemain mais met des noms japonais sur les brouillons que tout autre pays lira dans une décennie. Le prix se paie au pays, en essais de conformité réécrits chaque fois qu'une clause est concédée."
 JAP_english_business_environment: "Environnement des affaires en anglais"
 JAP_english_business_environment_desc: "Les managers japonais ne peuvent doter leurs propres filiales outre-mer dans la langue où les contrats sont écrits. Le gouvernement soutient des programmes d'anglais des entreprises et l'expérience Rakuten qui a fait de l'anglais la langue de travail d'une firme japonaise et a été moquée jusqu'à l'arrivée des résultats. Cela coûte des années de productivité perdue tandis que les chefs de section apprennent à présider une réunion dans une seconde langue, et certains ne le feront jamais."
 JAP_international_standards_adjustment_campaign: "Financer les délégations aux normes"
 JAP_international_standards_adjustment_campaign_desc: "Payer une nouvelle rotation d'ingénieurs dans les groupes de travail ISO, IEC et UIT, et couvrir les essais de conformité intérieurs qui suivent chaque clause concédée par le Japon. Les délégations rentrent avec les brouillons et l'industrie a un an pour s'ajuster avant la prochaine révision. Cessez de les financer et les sièges iront à quelqu'un d'autre."
 JAP_english_business_environment_campaign: "Subventionner les programmes d'anglais en entreprise"
 JAP_english_business_environment_campaign_desc: "Couvrir la formation linguistique que les firmes membres n'ont pas voulu payer elles-mêmes : instructeurs internes, sessions TOEIC sur le temps de l'entreprise, et détachements aux bureaux outre-mer pour tous ceux qui réussissent. La production baisse pendant que les gens étudient. Les firmes qui s'y tiennent cessent d'avoir besoin d'un traducteur dans la pièce."
 JAP_cool_japan_doctrine: "La doctrine Cool Japan"
