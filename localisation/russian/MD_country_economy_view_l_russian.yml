 BALANCE_TOOLTIP_DELAYED: "Баланс — это чистое изменение нашей казны за неделю, равное общему доходу за вычетом общих расходов. Отрицательный баланс истощает казну и вынуждает еженедельно выпускать долг, как только она иссякнет."
