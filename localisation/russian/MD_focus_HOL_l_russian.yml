 HOL_asml_tsmc_group: "Технологический альянс ASML — TSMC"
 HOL_asml_tsmc_group_desc: "Технологический альянс ASML — TSMC воплощает передний край исследований и производства полупроводников. Соединяя нидерландский опыт в литографии с тайваньским первенством в производстве чипов, это партнёрство нацелено на господство в мировом технологическом ландшафте и обеспечивает непревзойдённый доступ к передовым микросхемам и новшествам."
