 investments_build_button_tt_1: "Investir dans des projets de construction augmentera votre influence auprès du pays ciblé et fournira un revenu d'investissement à votre pays.\n\n§YLe niveau de corruption du pays et le niveau d'infrastructures de l'État affecteront tous deux la durée totale de construction. La construction a une augmentation de durée par défaut de 35 %, quels que soient les modificateurs.§!\n\n§LSi le pays ciblé accepte votre offre d'investissement, il obtiendra le bâtiment à la fin de la période de construction.§!\nL'IA refusera les investissements si elle a des problèmes économiques ou si son influence intérieure est trop faible.\nNous devrons aussi attendre 3 jours après l'annulation d'un projet dans un État pour y investir à nouveau.\n\n[investments_gain_tooltip]"
 investments_build_button_tt_delayed: "§YPrérequis§! :\n[!invest_button_click_enabled]\n§YEffets§! :\n[!invest_button_click]"
 investments_14_cooldown_tt: "Si le pays accepte, un délai de §Y14 jours§! commencera à l'acceptation. Vous ne gagnerez pas plus d'influence, quelle que soit la somme versée dans cette nation pendant ce délai."
 investments_30_cooldown_tt: "Si le pays accepte, un délai de §Y30 jours§! commencera à l'acceptation. Vous ne gagnerez pas plus d'influence, quelle que soit la somme versée dans cette nation pendant ce délai."
 investments_build_button_tt_2: "Annuler le projet actif (vous ne pouvez faire qu'un investissement dans cet État par jour)."
 investments_build_button_tt_b: "Appuyer sur ce bouton demandera l'autorisation au contrôleur de l'État. S'il accepte, un projet de construction commencera dans votre onglet de décisions. Ce projet se répète jusqu'à ce que tous les bâtiments en file soient achevés.\n\n§YLa vitesse de construction subit une pénalité de -25 % par rapport à la normale (les modificateurs de vitesse de construction de votre pays s'appliquent).§!\n\n§LVous ne pouvez avoir qu'un projet de construction actif à la fois.\n\nUn État ne peut pas avoir un projet de construction actif de plusieurs pays.\n\nLe contrôleur de cet État refusera s'il a une opinion négative de vous.§!"
 investments_gain_tooltip: "[investments_gain_tooltip]"
 investments_event.1.t: "Offre d'investissement de [FROM.GetNameWithFlag]"
 investments_event.1.d: "[FROM.GetName] propose de construire [?pending_offer_amount]x [investments_get_pending_offer_construction_type] dans [?pending_offer_state.GetName].\n\nLe coût total du projet est estimé à $$[?pending_offer_total_cost] milliards. Il faudra environ [?pending_offer_duration] jours pour l'achever. [FROM.GetName] nous propose un accord où nous contribuons à 10 % de la somme de construction. [FROM.GetNameWithFlag] pourra potentiellement gagner de l'influence grâce à ces travaux. [FROM.GetNameWithFlag] tirera profit de ce projet.\n\n\nJours pour achever : [?pending_offer_duration]\nCoût total du projet ([FROM.GetNameWithFlag]) : $$[?pending_offer_total_cost] milliards\nType de bâtiment : [investments_get_pending_offer_construction_type]\nCoût pour le bénéficiaire ([THIS.GetNameWithFlag]) : $$[?investor_cost]\nLieu : [?pending_offer_state.GetName]"
 investments_event.1.o1: "Accepter l'offre"
 investments_event.1.o2: "Refuser l'offre"
 investments_event.2.t: "Permis de construire refusé"
 investments_event.2.d: "Nous avons reçu un refus de notre partenaire d'investissement potentiel. Incroyable qu'ils refusent notre projet ! Comme si nous n'allions pas gagner d'influence ni de contrôle sur leur gouvernement en aidant à développer leur nation ! Enfin, l'accord d'investissement avec [FROM.GetName] a échoué dans [?ROOT.investments_state_target.GetName], autant proposer un accord ailleurs."
 investments_event.2.o1: "Peut-être leur voisin..."
 investments_event.3.t: "Projet de construction annulé"
 investments_event.3.d: "Malheureusement, nous n'avons pas pu achever notre accord d'investissement avec nos amis de [FROM.GetName]. Les raisons possibles sont nombreuses : relations avec le gouvernement, manque de fonds, ou simple désintérêt de la population locale. Nous pourrons toujours réessayer plus tard."
 investments_event.3.o1: "Tant pis pour eux !"
 investments_build_cost_tt: "§YCoût de l'investissement étranger§!\n\n\n§gSi vous venez de cliquer depuis un autre pays ou État, augmentez le nombre de bâtiments ou cliquez un autre bâtiment pour actualiser l'infobulle et voir le vrai coût.§!\n\n§gLa corruption, les esprits nationaux et d'autres facteurs peuvent affecter le coût du projet d'investissement. La corruption de la nation bénéficiaire augmentera le coût du projet selon son niveau de corruption.§!\n"
