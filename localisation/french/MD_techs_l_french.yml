 module_naval_vls_cells_4: "Banque VLS (4 cellules)"
 module_naval_vls_cells_4_desc: "Cellules de lancement vertical intégrées à la coque. Le nombre de cellules fixe la capacité de lancement du navire : de plus grandes batteries augmentent la charge de munitions missiles au prix d'un coût, d'un équipage et d'une visibilité accrus.\n\n§GIndice du concepteur : les cellules VLS multiplient les statistiques de combat du rôle missile du navire. De plus grandes batteries offrent plus de puissance de feu missile, mais ajoutent plus de CI, de main-d'œuvre, de carburant et de visibilité de surface.§!\n§GIndice concepteur : les cellules VLS multiplient les statistiques de combat liées aux missiles du navire. De plus grands bancs offrent plus de puissance de feu missiles, mais ajoutent plus de CI, d'effectifs, de carburant et de visibilité de surface.§!"
