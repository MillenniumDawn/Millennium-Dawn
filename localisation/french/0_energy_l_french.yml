 renewable_01: "Basic Solar Panels"
 renewable_01_desc: "Crystalline silicon panels turn sunlight into electricity with no fuel and no moving parts. They are expensive and convert little more than a tenth of the light they catch, but they bring solar power to rooftops and remote sites for the first time."
 renewable_02: "Wind Turbine Advancements"
 renewable_02_desc: "Larger rotors, variable-speed generators, and better aerodynamics push a single turbine to megawatt output. Wind farms move from demonstration projects to commercial supply for the grid."
 renewable_03: "High-Efficiency Photovoltaics"
 renewable_03_desc: "Purer silicon and better cell designs push panel efficiency toward 20%, while larger factories cut the cost of every module. Utility-scale solar farms begin to appear beside rooftop systems."
 renewable_04: "Composite Wind Blades"
 renewable_04_desc: "Glass and carbon-fiber blades are lighter and stiffer than earlier designs, so rotors can grow longer without bending into the tower. Longer blades sweep more air and keep turbines turning in lighter winds."
 renewable_05: "Thin-Film Solar Technology"
 renewable_05_desc: "Thin-film cells lay a few micrometers of light-absorbing material onto glass or flexible sheets. They use a fraction of the raw material of silicon wafers and coat large surfaces quickly, which sharply cuts the cost of a solar farm."
 renewable_06: "Offshore Wind Farms"
 renewable_06_desc: "Turbines built at sea catch stronger and steadier winds than any site on land. Purpose-built installation ships and fixed foundations let developers build farms of hundreds of turbines far from shore."
 renewable_07: "Bifacial Solar Panels"
 renewable_07_desc: "Bifacial panels collect light on both faces, catching sunlight reflected off the ground as well as direct sun. Mounted on trackers that follow the sun across the sky, they raise a solar farm's output without using more land."
 renewable_08: "Advanced Wind Turbine Controls"
 renewable_08_desc: "Blade sensors and lidar that reads the wind ahead of the rotor let turbines adjust pitch and yaw before a gust arrives. Whole farms are steered as one system, so the front rows no longer steal wind from the turbines behind them."
 renewable_09: "Perovskite Solar Cells"
 renewable_09_desc: "Perovskite layers stacked on silicon capture parts of the spectrum that silicon alone wastes, pushing panel efficiency past 30%. The layers are made at low temperature from cheap materials, so the gain adds little to manufacturing costs."
 renewable_10: "Tidal Power Plants"
 renewable_10_desc: "Turbines anchored in tidal channels run on currents that rise and fall on a schedule known years in advance. Tidal power gives the grid a renewable supply that does not depend on the weather."
 renewable_11: "Tidal Expansion"
 renewable_11_desc: "Floating platforms and denser turbine arrays carry tidal power beyond a few narrow channels into open coastal waters. Shared subsea cables and standard modules make each new array cheaper than the last."
 renewable_12: "Volcanic Energy Plants"
 renewable_12_desc: "Wells drilled near active volcanoes tap water heated by magma to far higher temperatures than conventional geothermal fields. One of these wells can deliver several times the power of an ordinary geothermal bore."
 renewable_13: "Asthenosphere Siphoning"
 renewable_13_desc: "Deep boreholes along active fault zones reach the hot, partly molten rock of the asthenosphere. Heat drawn from that depth never runs out, and it is available wherever the crust is thin enough to drill through."
 fuel_efficiency_01: "Advanced Combustion Engineering"
 fuel_efficiency_01_desc: "Staged burners and tighter control of the air and fuel mix let boilers burn their fuel more completely. Our plants get more electricity from each ton of coal and each cubic meter of gas."
 fuel_efficiency_02: "Integrated Gasification Combined Cycle"
 fuel_efficiency_02_desc: "IGCC plants turn coal into synthetic gas, strip out its impurities, and burn it in a gas turbine before recovering the exhaust heat in a steam cycle. The two-stage design wrings far more power from the same fuel."
 fuel_efficiency_03: "High-Efficiency Low-Emissions Technologies"
 fuel_efficiency_03_desc: "HELE plants run their steam at supercritical and ultra-supercritical temperatures and pressures. Hotter steam means more power from every ton of fuel and less carbon dioxide for every megawatt-hour."
 fuel_efficiency_04: "Carbon Capture & Storage (CCS) Integration"
 fuel_efficiency_04_desc: "Capture units scrub carbon dioxide from plant exhaust and pipe it into deep rock formations for storage. Designing capture into the plant from the start, rather than bolting it on, keeps the energy it consumes to a minimum."
 fuel_efficiency_05: "AI-Driven Optimization & Monitoring"
 fuel_efficiency_05_desc: "Machine-learning models read thousands of plant sensors and adjust fuel flow, air supply, and turbine load second by second. They flag worn parts long before they fail, so our plants run near peak efficiency for longer."
 fuel_efficiency_06: "Near-Zero Emission Fossil Fuel Plants"
 fuel_efficiency_06_desc: "Oxy-fuel combustion burns fuel in pure oxygen, leaving an exhaust of water vapor and nearly pure carbon dioxide that is simple to capture. Our fossil plants now release almost nothing into the atmosphere."
 fuel_efficiency_07: "Quantum Fuel Optimization"
 fuel_efficiency_07_desc: "Quantum computers simulate combustion chemistry molecule by molecule, which classical machines could only approximate. Engineers use the results to design fuels, catalysts, and burners that release more energy from every unit of fuel."
 fuel_efficiency_08: "AGI Implementation"
 fuel_efficiency_08_desc: "General-purpose AI runs our power stations as a single national fleet, from fuel purchasing and maintenance crews to grid dispatch. Load always shifts to whichever plant burns its fuel most efficiently at that moment."
 fuel_efficiency_09: "Specialized Fuel Nanofibers"
 fuel_efficiency_09_desc: "Nanofiber insulation lines boilers, pipes, and turbine casings, keeping heat inside the cycle where it can still raise steam. Less energy leaks through the plant walls, so more of each fuel shipment reaches the generator."