 GER_artillery_1: "M101A1"
 GER_artillery_1_desc: "M101A1 — гаубица, разработанная в США. Во Второй мировой войне она была стандартной американской лёгкой полевой гаубицей и воевала на Европейском и Тихоокеанском театрах, а также в Корейской войне. Запущенная в производство в 1941 году, она быстро заслужила репутацию точного и мощного орудия. M101A1 стреляет 105-мм осколочно-фугасными снарядами раздельного заряжания на дальность 11 270 м, что делает её пригодной для поддержки пехоты."
 GER_artillery_1_short: "M101A1"
 GER_artillery_2: "FH155-1"
 GER_artillery_2_desc: "FH155-1 — 155-мм буксируемая гаубица, используемая многими странами. FH155-1 — это буксируемая 155-мм гаубица ближнего действия, разработанная в Германии и Великобритании и отвечающая требованиям стандартов НАТО того времени. FH-155-1 имеет съёмную вспомогательную силовую установку, дальность стрельбы обычным снарядом составляет 24 км, активно-реактивным — 30 км, скорострельность — 3 выстрела за 15-20 секунд, 6 выстрелов в минуту в течение короткого периода и 2 выстрела в минуту длительное время."
 GER_artillery_2_short: "FH155-1"
 GER_artillery_3: "M777"
 GER_artillery_3_desc: "Гаубица M777 - буксируемая 155-мм артиллерийская установка класса гаубиц. M777 производится подразделением Global Combat Systems компании BAE Systems в Великобритании и США. Орудие оснащено оптической системой управления огнем и способно поражать цели на расстоянии до 14 миль с помощью снарядов M795 HE."
 GER_artillery_3_short: "M777"
 GER_artillery_4: "M777A1"
 GER_artillery_4_desc: "M777A1 - это модернизированный вариант M777, включающий в себя модернизацию цифровых технологий с добавлением бортового источника питания, спутникового глобального позиционирования, инерциальной навигации, радиостанции, блока индикации орудия (GDU) и узла командира отделения (SCA)."
