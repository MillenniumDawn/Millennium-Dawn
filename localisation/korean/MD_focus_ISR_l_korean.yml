 israel_boycott_arabside_category: "Boycott of [ISR.GetNameWithFlag]"
 israel_boycott_arabside_category_desc: "Our country, [ROOT.GetNameWithFlag], as a muslim country, can boycott [ISR.GetNameWithFlag] to stop their §8economic or political expansion§!, or lift the boycott to cooperate with [ISR.GetNameWithFlag] more.\nIf we will continue the partial boycott, we will only §Orestrict§! [ISR.GetNameWithFlag] in one specific sphere - either in economic or political relations with us.\nIf we choose to §Rfully boycott§! Israel, we will not be able to have any diplomatic or economic relations with [ISR.GetNameWithFlag]."
