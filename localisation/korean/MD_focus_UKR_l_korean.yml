 ukr_modernize_sov_equipment_old_artillery_upkeep_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_m30_for_tooltip\n\n\n\n\n\n\n\n\n§W전시용으로 비축한 §YM-46§! 포와 §YM-30§! 곡사포가 창고에서 녹슬고 있습니다. 정기적으로 정비하면 전쟁이 터져도 §G며칠 안에 사격 가능한 상태§!가 됩니다.\n------------------\n정비 효과는 §Y5§!년간 이어지며, 이후에는 다시 해야 합니다.§!"
 ukr_modernize_sov_equipment_old_artillery_reactivation_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_m46_for_tooltip\n\n\n\n\n\n\n\n\n§W전쟁이 닥쳤습니다. 정비해 둔 견인포는 거의 즉시 포병 부대로 돌려보낼 수 있습니다.§!"
 ukr_modernize_sov_equipment_old_artillery_reactivation_neglected_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_m30_for_tooltip\n\n\n\n\n\n\n\n\n§W전쟁이 닥쳤지만 보관 중인 견인포를 돌본 사람은 아무도 없었습니다. 공장에서 수리하는 데 몇 달이 걸리며, 일부는 이미 손쓸 수 없는 상태입니다.§!"
