 BOS_EUFOR: "EUFOR"
 BOS_EUFOR_desc: "Европейские силы в Боснии и Герцеговине — это возглавляемая ЕС миротворческая миссия в Боснии и Герцеговине, которая пришла на смену SFOR и направлена на поддержание мира и стабильности, поддержку местных властей и выполнение Дейтонских соглашений, положивших конец Боснийской войне."
 BOS_SFOR: "SFOR"
 BOS_SFOR_desc: "Силы стабилизации в Боснии и Герцеговине — это многонациональные миротворческие силы под руководством НАТО.\n§W---------------§!\n После Боснийской войны международные партнёры, включая Всемирный банк, Европейский союз, Программу развития ООН и USAID, финансировали восстановление Боснии. В рамках их программ была восстановлена инфраструктура, укреплено управление и государственные услуги, а также поддержано экономическое восстановление."
 BOS_attack_upon_nato: "Нападение на НАТО"
 BOS_bosniak_balkan_aspiration: "Боснийские балканские устремления"
 BOS_srpska_balkan_aspiration: "Сербские балканские устремления"
 BOS_croat_balkan_aspiration: "Хорватские балканские устремления"
 BOS_post_yugoslav_war_state: "Государство после югославских войн"
 BOS_post_yugoslav_war_state_desc: "Босния — одна из четырёх республик, сумевших провозгласить независимость во время югославских войн 1990-х годов. Из всех четырёх она пережила больше всего ужасов: тысячи беженцев покинули страну. Обширные территории загрязнены минами и неразорвавшимися боеприпасами. Многие из её бывших граждан сейчас живут за границей. Эти события создали Организации Объединённых Наций новую, нелестную репутацию организации, неспособной или не желающей защищать тех, кто находится в опасности."
