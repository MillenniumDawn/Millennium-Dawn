 UKR_tank_diesel_engine_gen1: "V-54, 520마력"
 UKR_tank_diesel_engine_gen1_desc: "V-54는 T-54 전차에 사용된 자연 흡기식 V12 엔진입니다.\n\n§G설계 힌트: 다연료 디젤 엔진은 전차에 사용되는 표준 엔진입니다.§!"
 UKR_tank_diesel_engine_gen2: "5TDF, 700마력"
 UKR_tank_diesel_engine_gen2_desc: "5TDF는 대향 피스톤과 수평 실린더를 갖춘 2행정, 다연료, 고과급, 수랭식, 직분사 디젤 엔진입니다. 원래 T-64를 위해 설계되었으며, T-72의 초기형에도 사용되었습니다.\n\n§G설계 힌트: 다연료 디젤 엔진은 전차에 사용되는 표준 엔진입니다.§!"
 UKR_tank_diesel_engine_gen3: "5TDFM, 850마력"
 UKR_tank_diesel_engine_gen3_desc: "5TDFM은 원형 5TDF의 개량형으로, 대향 피스톤과 수평 실린더를 갖춘 2행정, 다연료, 고과급, 수랭식, 직분사 디젤 엔진입니다. 원래 T-64를 위해 설계되었으며, T-72의 초기형에도 사용되었습니다.\n\n§G설계 힌트: 다연료 디젤 엔진은 전차에 사용되는 표준 엔진입니다.§!"
 UKR_tank_diesel_engine_gen4: "KMDB 6TD-1, 1000마력"
 UKR_tank_diesel_engine_gen4_desc: "KMDB 6TD-1은 우크라이나에서 제작한 전차 엔진으로, 처음에는 T-80UD 주력 전차 생산에 사용되었습니다.\n\n§G설계 힌트: 다연료 디젤 엔진은 전차에 사용되는 표준 엔진입니다.§!"
 UKR_tank_diesel_engine_gen5: "KMDB 6TD-2, 1200마력"
 UKR_tank_diesel_engine_gen5_desc: "KMDB 6TD-2는 우크라이나에서 제작한 전차 엔진으로, 처음에는 T-84 주력 전차 생산에 사용되었습니다.\n\n§G설계 힌트: 다연료 디젤 엔진은 전차에 사용되는 표준 엔진입니다.§!"
 UKR_tank_diesel_engine_gen6: "KMDB 6TD-3, 1500마력"
 UKR_tank_diesel_engine_gen6_desc: "KMDB 6TD-3은 우크라이나가 제안한 전차 엔진으로, 6TD-2 엔진의 개량형입니다.\n\n§G설계 힌트: 다연료 디젤 엔진은 전차에 사용되는 표준 엔진입니다.§!"
 UKR_tank_diesel_engine_gen7: "KMDB 6TD-4, 1800마력"
 UKR_tank_diesel_engine_gen7_desc: "KMDB 6TD-4는 우크라이나가 제안한 전차 엔진으로, 6TD-3 엔진을 대폭 개조한 형식입니다.\n\n§G설계 힌트: 다연료 디젤 엔진은 전차에 사용되는 표준 엔진입니다.§!"
 UKR_tank_gas_turbine_engine_gen1: "GTD-3TL"
 UKR_tank_gas_turbine_engine_gen1_desc: "GTD-3TL은 T-64 전차의 주력 엔진으로 의도되었던 실험용 가스 터빈 엔진이었습니다. 그러나 이 구상은 이후 디젤 엔진을 선택하면서 폐기되었습니다.\n\n§G설계 힌트: 가스 터빈은 디젤 엔진보다 가속 성능이 좋아 차량의 기동성을 높여 줍니다. 하지만 제작 비용이 비싸고 연료를 많이 소비합니다. 빠른 전차를 원하고 연료를 공급할 수 있다면 가스 터빈을 사용하십시오.§!"
 UKR_tank_gas_turbine_engine_gen2: "SG-1000"
 UKR_tank_gas_turbine_engine_gen2_desc: "SG-1000은 T-80의 최초 가스 터빈 엔진이었습니다. 곧 개량형으로 교체되었습니다.\n\n§G설계 힌트: 가스 터빈은 디젤 엔진보다 가속 성능이 좋아 차량의 기동성을 높여 줍니다. 하지만 제작 비용이 비싸고 연료를 많이 소비합니다. 빠른 전차를 원하고 연료를 공급할 수 있다면 가스 터빈을 사용하십시오.§!"
 UKR_tank_gas_turbine_engine_gen3: "GTD-1000T"
 UKR_tank_gas_turbine_engine_gen3_desc: "GTD-1000T는 T-80A와 T-80B 전차용 가스 터빈입니다. GTD-1000T는 이전의 SG-1000보다 신뢰성이 높고 출력도 약간 더 높습니다.\n\n§G설계 힌트: 가스 터빈은 디젤 엔진보다 가속 성능이 좋아 차량의 기동성을 높여 줍니다. 하지만 제작 비용이 비싸고 연료를 많이 소비합니다. 빠른 전차를 원하고 연료를 공급할 수 있다면 가스 터빈을 사용하십시오.§!"
 UKR_tank_gas_turbine_engine_gen4: "GTD-1250"
 UKR_tank_gas_turbine_engine_gen4_desc: "GTD-1250은 T-80의 두 번째 세대 전차인 T-80U에 사용된 가스 터빈 엔진입니다. 이 가스 터빈에는 보조 동력 장치 역할을 하는 더 작은 가스 터빈이 함께 장착됩니다.\n\n§G설계 힌트: 가스 터빈은 디젤 엔진보다 가속 성능이 좋아 차량의 기동성을 높여 줍니다. 하지만 제작 비용이 비싸고 연료를 많이 소비합니다. 빠른 전차를 원하고 연료를 공급할 수 있다면 가스 터빈을 사용하십시오.§!"
 UKR_tank_composite_armor_gen1: "콤비나치야 K"
 UKR_tank_composite_armor_gen1_desc: "'콤비나치야 K'는 강철로 된 외층과 내층, 유리섬유 강화 플라스틱(스클로텍스톨리트)으로 된 중간층, 그리고 세라믹(강옥이라고 알려짐) 판 묶음으로 구성된 3층 복합 장갑입니다. T-64 전차에 처음 장착되었습니다.\n\n§G설계 힌트: 복합 장갑은 현대 주력 전차의 표준적인 선택지입니다.§!"
 UKR_tank_composite_armor_gen2: "콤비나치야 B/KM"
 UKR_tank_composite_armor_gen2_desc: "'콤비나치야 B 또는 KM'은 T-64A에 사용된 3층 '콤비나치야 K'의 후속으로 개발된 개량형 5층 복합 장갑 배열입니다. 두 장의 강판 사이에 단일 복합층을 두는 대신, 강철과 복합 재료를 번갈아 쌓은 새로운 배열을 사용하여 운동에너지탄과 성형작약탄 모두에 대한 방호력이 향상되었습니다. KM형은 T-64B(코룬드-모놀리트니)에 도입되었고, B형(블로치나야)은 T-80B에 사용되었습니다.\n\n설계 힌트: 복합 장갑은 현대 주력 전차의 표준적인 선택지입니다!"
 UKR_afv_composite_armor_gen1: "콤비나치야 K"
 UKR_afv_composite_armor_gen1_desc: "'콤비나치야 K'는 강철로 된 외층과 내층, 유리섬유 강화 플라스틱(스클로텍스톨리트)으로 된 중간층, 그리고 세라믹(강옥이라고 알려짐) 판 묶음으로 구성된 3층 복합 장갑입니다. T-64 전차에 처음 장착되었습니다.\n\n§G설계 힌트: 복합 장갑은 현대 주력 전차의 표준적인 선택지입니다.§!"
 UKR_afv_composite_armor_gen2: "콤비나치야 B/KM"
 UKR_afv_composite_armor_gen2_desc: "'콤비나치야 B 또는 KM'은 T-64A에 사용된 3층 '콤비나치야 K'의 후속으로 개발된 개량형 5층 복합 장갑 배열입니다. 두 장의 강판 사이에 단일 복합층을 두는 대신, 강철과 복합 재료를 번갈아 쌓은 새로운 배열을 사용하여 운동에너지탄과 성형작약탄 모두에 대한 방호력이 향상되었습니다. KM형은 T-64B(코룬드-모놀리트니)에 도입되었고, B형(블로치나야)은 T-80B에 사용되었습니다.\n\n설계 힌트: 복합 장갑은 현대 주력 전차의 표준적인 선택지입니다!"
 UKR_reactive_armor_gen1: "콘탁트-1"
 UKR_reactive_armor_gen1_desc: "콘탁트-1은 소련에서 개발된 1세대 폭발 반응 장갑(ERA)입니다. 두 장의 강판 사이에 두 개의 4S20 폭발 요소가 들어 있습니다. 콘탁트-1은 둔감성이 매우 높아 성형작약탄에 의해서만 기폭됩니다.\n\n§G설계 힌트: 폭발 반응 장갑(ERA)은 전차의 장갑을 손쉽게 개량하는 방법입니다.§!"
 UKR_reactive_armor_gen2: "콘탁트-5"
 UKR_reactive_armor_gen2_desc: "콘탁트-5는 소련에서 개발된 2세대 폭발 반응 장갑(ERA)입니다. 기폭 시 블록 안의 강판이 옆으로 움직여 날아오는 탄이 관통해야 하는 경로를 더 길게 만듭니다. 이러한 방어 방식은 운동에너지 관통자에 대해서도 효과적입니다.\n\n§G설계 힌트: 폭발 반응 장갑(ERA)은 전차의 장갑을 손쉽게 개량하는 방법입니다.§!"
 UKR_reactive_armor_gen3: "니시"
 UKR_reactive_armor_gen3_desc: "니시(칼)는 우크라이나산 전차용 3세대 모듈식 동적 방호 복합체입니다. 전투 차량과 고정 시설을 철갑탄, 누적 무기, 그리고 '충격 코어' 형식의 충격-누적 탄약으로부터 보호하기 위해 설계되었습니다.\n\n§G설계 힌트: 폭발 반응 장갑(ERA)은 전차의 장갑을 손쉽게 개량하는 방법입니다.§!"
 UKR_reactive_armor_gen4: "두플렛"
 UKR_reactive_armor_gen4_desc: "두플렛은 우크라이나산 전차용 3세대+ 탠덤식 동적 방호 모듈 복합체로, '니시'/'칼' 복합체의 현대화형입니다. 구경 125mm 이하의 포병 성형작약탄과 탠덤 성형 무기, '충격 코어' 형식의 충격-누적 탄약, 반응식 전차 유탄, 그리고 전금속 날개 안정 철갑 준구경탄으로부터 전투 차량과 고정 시설을 보호하기 위한 것입니다.\n\n§G설계 힌트: 폭발 반응 장갑(ERA)은 전차의 장갑을 손쉽게 개량하는 방법입니다.§!"
 UKR_smoothbore_atgm_gen1: "9K112 코브라"
 UKR_smoothbore_atgm_gen1_desc: "9K112 코브라는 소련의 반자동 시선 유도(SACLOS) 대전차 유도 미사일 체계입니다. T-64와 T-80 계열 전차의 125mm 주포에서 발사됩니다.\n\n§G설계 힌트: 전차에 전통적인 운동에너지 관통탄뿐 아니라 주포에서 대전차 유도 미사일을 발사하는 능력을 부여하면, 적 장갑 차량과 교전하는 능력을 높일 수 있습니다.§!"
 UKR_smoothbore_atgm_gen2: "콤바트"
 UKR_smoothbore_atgm_gen2_desc: " 콤바트는 125mm 활강포에서 발사되는 유효 사거리 5,000m의 우크라이나산 탠덤 탄두 대전차 유도 미사일입니다. 관통력은 950mm입니다.\n\n§G설계 힌트: 전차에 전통적인 운동에너지 관통탄뿐 아니라 주포에서 대전차 유도 미사일을 발사하는 능력을 부여하면, 적 장갑 차량과 교전하는 능력을 높일 수 있습니다.§!"
 UKR_smoothbore_atgm_gen3: "코누스"
 UKR_smoothbore_atgm_gen3_desc: "코누스는 120mm 활강포에서 발사되는 유효 사거리 5,000m의 우크라이나산 탠덤 탄두 대전차 유도 미사일입니다. NATO 표준 전차포 구경에 맞추기 위한 개량 노력으로 제안되었습니다.\n\n§G설계 힌트: 전차에 전통적인 운동에너지 관통탄뿐 아니라 주포에서 대전차 유도 미사일을 발사하는 능력을 부여하면, 적 장갑 차량과 교전하는 능력을 높일 수 있습니다.§!"
 UKR_smoke_launchers: "3D6"
 UKR_smoke_launchers_desc: "투차는 소련에서 개발된 81mm 차량 탑재 유탄 발사기입니다. 주로 3D6 및 3D6M형 연막탄을 발사하는 데 사용됩니다.\n\n§G설계 힌트: 연막 발사기를 추가하면 아군 전차의 피탐지율이 낮아져 방어와 공격 모두에서 더 유리해집니다.§!"
 UKR_smoke_launchers_2: "3D6M"
 UKR_smoke_launchers_2_desc: "§Y흐마라§!는 투차 연막 발사 체계의 현지화 형식인 81mm 차량 탑재 유탄 발사기입니다. 주로 3D6 및 3D6M형 연막탄을 발사하는 데 사용됩니다.\n\n§G설계 힌트: 연막 발사기를 추가하면 아군 전차의 피탐지율이 낮아져 방어와 공격 모두에서 더 유리해집니다.§!"
 UKR_smoke_launchers_3: "바르타"
 UKR_smoke_launchers_3_desc: "바르타는 레이저 유도 방식의 고정밀 탄약에 의한 표적 지정을 경고하고, 전차 주변에 연막/에어로졸 장막을 전개시키는 우크라이나의 광학전자 대응 체계입니다. 이 장치는 T-84U '오플로트', 'BM 오플로트', T-64E 전차의 능동 방어 체계입니다.\n\n§G설계 힌트: 연막 발사기를 추가하면 아군 전차의 피탐지율이 낮아져 방어와 공격 모두에서 더 유리해집니다.§!"
 UKR_hardkill_system_gen1: "자슬린"
 UKR_hardkill_system_gen1_desc: "자슬린은 우크라이나의 장갑 차량용 능동 방어 복합체입니다. SE BCKT 미크로텍이 다른 우크라이나 기업들과 함께 개발하였습니다. 이 복합체는 박벽형 대전차 무기, 특히 대전차 유도 미사일과 대전차 유탄, 전차포 및 대전차포의 누적탄, 그리고 날개 안정 철갑 준구경탄으로부터 전투 차량을 보호하도록 설계되었습니다.\n\n§G설계 힌트: 하드킬 체계는 전차의 장갑을 더 강하게 보강하는 좋은 방법입니다.§!"
 UKR_afv_machine_gun: "7,62mm §YSGMT§!"
 UKR_afv_machine_gun_desc: "§YSG-43/SGMT§! 고류노프는 제2차 세계 대전 중에 도입된 소련의 중기관총입니다. 7.62x54mmR 탄을 사용하며, 1943년에 구형 M1910 맥심 기관총을 대체하기 위해 도입되었습니다."
 UKR_afv_machine_gun_2: "14,5mm §YKPVT§!"
 UKR_afv_machine_gun_2_desc: "§YKPVT§! 중기관총은 소련이 설계한 14.5x114mm 구경의 중기관총으로, 1949년 보병용 무기(PKP로 지정)로 처음 배치되었습니다. 1960년대에 보병용 형식은 너무 크고 무겁다는 이유로 생산이 중단되었습니다. 이후 BTR 시리즈에 사용되었습니다."
 UKR_afv_coax_machine_gun: "7,62mm §YSGMT§!"
 UKR_afv_coax_machine_gun_desc: "§YSG-43/SGMT§! 고류노프는 제2차 세계 대전 중에 도입된 소련의 중기관총입니다. 7.62x54mmR 탄을 사용하며, 1943년에 구형 M1910 맥심 기관총을 대체하기 위해 도입되었습니다."
 UKR_afv_coax_machine_gun_2: "7,62mm §YPKT§!"
 UKR_afv_coax_autocannon_2: "2A7M"
 UKR_afv_coax_autocannon_3: "ZTM-1/2"
 UKR_afv_coax_machine_gun_2_desc: "§YPKT§!는 PK/PKM 기관총에서 파생된 벨트 급탄식 범용 기관총으로, 7.62x54mmR 테두리 탄을 사용합니다."
 UKR_afv_atgm_gen1: "9M14 §Y말류트카§!"
 UKR_afv_atgm_gen1_desc: "9M14 §Y말류트카§!는 소련 최초의 휴대형 대전차 유도 미사일이며, 아마도 역사상 가장 많이 생산된 대전차 유도 미사일일 것입니다."
 UKR_afv_atgm_gen2: "9K113 §Y콘쿠르스§!"
 UKR_afv_atgm_gen2_desc: "9K113 §Y콘쿠르스§!는 구형 9K11 말류트카를 대체하기 위해 개발된 2세대 반자동 시선 지령 유도 대전차 미사일입니다. 정확도, 장갑 관통력, 교전 사거리가 향상되어 소련군에서 가장 널리 보급된 대전차 유도 미사일 중 하나가 되었으며, 이후 우크라이나군에서도 폭넓게 운용되었습니다."
 UKR_afv_atgm_gen3: "RK-2 §Y바리에르§!"
 UKR_afv_atgm_gen3_desc: "루치 설계국이 개발한 우크라이나의 레이저 유도 대전차 미사일입니다. 폭발 반응 장갑을 갖춘 현대 주력 전차를 격파하기 위해 설계된 §Y바리에르§! 체계는 이전 소련 시대의 대전차 유도 미사일에 비해 더 높은 정확도, 향상된 관통력, 현대적인 사격 통제 통합을 제공합니다."
 UKR_afv_assault_gun: "73mm 2A28 그롬"
 UKR_afv_assault_gun_desc: "2A28 그롬은 KBP 2A28 그롬이라고도 하며, 쐐기식 폐쇄기를 갖춘 73mm 저압 활강 반자동포입니다. 2A28 그롬의 개발은 SPG-9 무반동포의 개발과 직접 연관되어 있었으며, 두 무기 모두 로켓 추진 유탄과 유사한 발사체를 발사하였습니다."
 UKR_afv_assault_gun_2: "100mm 2A70"
 UKR_afv_assault_gun_2_desc: "100mm 포발사기 2A70(GRAU 지정번호: 2A70)은 소련의 KBP 기기설계국이 설계한 저압 강선포의 한 형식입니다."
 UKR_afv_assault_gun_3: "90mm 코커릴 Mk 8 LP"
 UKR_afv_assault_gun_3_desc: "코커릴 Mk 8은 코커릴이 경장갑 차량과 포탑 체계에 장착하기 위해 개발한 벨기에의 90mm 저압 전차포입니다. 감소된 장약을 사용해 반동을 줄이면서도 고폭탄, 연막탄, 대전차탄 등 다양한 90mm 탄약을 발사할 수 있습니다."
 UKR_small_autocannon: "30mm 2A42"
 UKR_small_autocannon_desc: "시푸노프 2A42는 소련/러시아의 30mm 기관포입니다. 툴라마시자보드 주식회사에서 제작하며, A. G. 시푸노프의 이름을 따서 명명되었습니다."
 UKR_small_autocannon_2: "30mm 2A72"
 UKR_small_autocannon_2_desc: "2A42의 경량 간소화형으로 부품 수가 적고 포신이 더 길며 포구 속도가 더 높지만, 발사 속도는 더 낮습니다. 가스 작동식이 아닌 롱 리코일 작동식입니다."
 UKR_small_autocannon_3: "30mm ZTM-1/2"
 UKR_small_autocannon_3_desc: "소련의 2A42 설계에서 파생되어 자국 생산에 맞게 개조한 우크라이나산 30mm 자동포입니다. ZTM 시리즈는 제작 품질이 향상되었고 현대적인 사격 통제 체계와의 호환성과 신뢰성이 높아졌으며, 전작의 낮은 반동과 경량이라는 특징은 그대로 유지하고 있습니다."
 UKR_tank_small_medium_cannon: "100mm D-10T2S"
 UKR_tank_small_medium_cannon_desc: "D-10은 제2차 세계 대전 말기에 개발된 소련의 전차포로, SU-100 구축전차에 처음 탑재되었습니다. 냉전이 시작될 무렵 이 무기는 T-54 및 T-55 계열 전차의 무장으로 채택되었습니다.\n\n§G설계 힌트: 소구경 화포는 포구 속도가 낮아 고폭탄 사용에 적합합니다. 대물 공격보다 대인 공격을 우선시하려면 이를 사용하십시오.§!"
 UKR_tank_small_medium_cannon_2: "115mm U-5TS"
 UKR_tank_small_medium_cannon_2_desc: "U-5TS는 전차용으로 개발된 최초의 활강포입니다. T-55에 장착된 기존 100mm 포는 서방의 신형 센추리온과 M48 패튼 전차를 상대하기에 너무 약했습니다. 이러한 전차들에 대응하여 소련은 115mm 포를 개발하였습니다. 이 포는 T-62에서만 사용되었습니다. 이란-이라크 전쟁에서 T-62가 훨씬 신형인 치프틴과 M60을 격파할 수 있었던 것처럼, 더 현대적인 전차를 상대로도 효과적임이 입증되었습니다.\n\n§G설계 힌트: 소구경 화포는 포구 속도가 낮아 고폭탄 사용에 적합합니다. 대물 공격보다 대인 공격을 우선시하려면 이를 사용하십시오.§!"
 UKR_tank_small_medium_cannon_3: "100mm 2A70"
 UKR_tank_small_medium_cannon_3_desc: "2A70은 경장갑 차량을 위한 속사 강선포입니다. 이 포는 주로 고폭탄과 함께 사용하도록 의도되었습니다. 2A70은 BMP-3 계열의 주무장입니다.\n\n§G설계 힌트: 소구경 화포는 포구 속도가 낮아 고폭탄 사용에 적합합니다. 대물 공격보다 대인 공격을 우선시하려면 이를 사용하십시오.§!"
 UKR_tank_medium_cannon: "125mm 2A46"
 UKR_tank_medium_cannon_desc: "2A46은 소련 전차포 중 가장 흔한 포입니다. 원래 T-64를 위해 개발되었으며, 이후 모든 소련 및 러시아 전차는 물론 여러 외국 전차에서도 사용되어 왔습니다.\n\n§G설계 힌트: 중구경 화포는 균형 잡힌 전차포입니다. 대인 공격과 대물 공격 어느 쪽도 치우치지 않으려면 이를 사용하십시오.§!"
 UKR_tank_medium_cannon_2: "125mm KBA3"
 UKR_tank_medium_cannon_2_desc: "KBA3는 소련의 2A46 전차포를 우크라이나에서 개조한 125mm 활강 전차포입니다. 키이우 포병 설계국이 개발하였으며, 제조사는 스타로크라마토르스크 기계제작공장입니다. 이 포는 T-80UD, T-84, BM 오플로트 주력 전차에 장착하고 T-64를 현대화하기 위한 것입니다.\n\n§G설계 힌트: 중구경 화포는 균형 잡힌 전차포입니다. 대인 공격과 대물 공격 어느 쪽도 치우치지 않으려면 이를 사용하십시오.§!"
 UKR_tank_medium_cannon_3: "120mm KBM2"
 UKR_tank_medium_cannon_3_desc: "KBM2는 표준 NATO 120mm 구경 탄약을 사용하는 120mm 활강포입니다. 원래 키이우 포병 설계국이 T-84-120 '야타한' 주력 전차를 위해 개발하였습니다.\n\n§G설계 힌트: 중구경 화포는 균형 잡힌 전차포입니다. 대인 공격과 대물 공격 어느 쪽도 치우치지 않으려면 이를 사용하십시오.§!"
 UKR_tank_large_cannon: "130mm M-65 L/60"
 UKR_tank_large_cannon_desc: "핵폭발에도 견디도록 설계된 오브옉트 279 코틴 중돌격전차에 사용하기 위한 실험용 중량 전차포입니다. 중전차의 필요성이 사라짐에 따라 이 계획은 취소되었고 포 또한 함께 폐기되었습니다.\n\n§G설계 힌트: 대구경 화포는 주로 대장갑 임무에 사용하도록 의도되었습니다. 대인 공격도 어느 정도 유지하면서 대물 공격을 우선시하려면 이를 사용하십시오.§!"
 UKR_tank_large_cannon_2: "140mm 55L §Y바히라§!"
 UKR_tank_large_cannon_2_desc: "55L 바히라는 키이우 포병 설계국이 미래형 전차의 무장과 기존 전차의 현대화를 위해 개발 및 생산한 실험용 포입니다. 새 포의 포신 길이는 55구경장입니다.\n\n§G설계 힌트: 대구경 화포는 주로 대장갑 임무에 사용하도록 의도되었습니다. 대인 공격도 어느 정도 유지하면서 대물 공격을 우선시하려면 이를 사용하십시오.§!"
 UKR_tank_very_large_cannon: "152mm 2A73"
 UKR_tank_very_large_cannon_desc: "OKB-6 또는 중앙연구소 부레베스트니크가 개발한 152mm 활강포 2A73은 실험용 전차 오브옉트 477 '복서'/'몰롯'/'노타'와 오브옉트 490 '토폴'에 사용하기 위한 것이었습니다.\n\n§G설계 힌트: 초대구경 화포는 대장갑 임무에 사용하도록 의도되었습니다. 대인 공격보다 대물 공격을 크게 우선시하려면 이를 사용하십시오.§!"
 UKR_tank_battlestation_1: "1A33 §YOb§!"
 UKR_tank_battlestation_1_desc: "1A33 Ob 사격 통제 체계에는 PDPS 1OP73, 1V517 전차 탄도 계산기, 1G43 조준경, 입력 정보 센서, 그리고 1A34 복합체가 포함되어 있었습니다.\n\n§G설계 힌트: 전투 지휘 장비는 전차 운용에 필요한 포술 체계, 사격 통제, 광학 장비 및 기타 보조 장비를 나타냅니다. 더 나은 전투 지휘 장비는 전차의 전반적인 품질을 향상시킵니다.§!"
 UKR_tank_battlestation_2: "1A43U §Y로스§!"
 UKR_tank_battlestation_2_desc: "1A43U 로스 조준 복합체에는 거리 측정 조준경, 전기 장치가 달린 1G46 유도 장치, 사격 승인 장치, 1V528-2 전차 탄도 계산기가 포함되어 있습니다.\n\n§G설계 힌트: 전투 지휘 장비는 전차 운용에 필요한 포술 체계, 사격 통제, 광학 장비 및 기타 보조 장비를 나타냅니다. 더 나은 전투 지휘 장비는 전차의 전반적인 품질을 향상시킵니다.§!"
 UKR_tank_battlestation_2_thermal: "1A45 §Y이르티시§!"
 UKR_tank_battlestation_3: "§Y사반-15§!"
 UKR_tank_battlestation_3_desc: "사반-15는 2000년대부터 우크라이나산 주력 전차에 사용하도록 제안된 프랑스제 조준 복합체입니다.\n\n§G설계 힌트: 전투 지휘 장비는 전차 운용에 필요한 포술 체계, 사격 통제, 광학 장비 및 기타 보조 장비를 나타냅니다. 더 나은 전투 지휘 장비는 전차의 전반적인 품질을 향상시킵니다.§!"
 UKR_tank_aux_engine: "AEA-8"
 UKR_tank_aux_engine_desc: "AEA-8은 출력 8kW의 디젤 보조 동력 장치입니다. 이 설비는 수랭식 2기통 디젤 V형 엔진과 직류 발전기로 구성됩니다. 보조 동력 장치는 전차가 고정 사격 진지에 있거나 매복 중일 때처럼 엔진을 끈 상태에서도 전차에 전력을 공급하도록 설계되었습니다.\n\n§G설계 힌트: 보조 엔진을 추가하는 것은 가스터빈 엔진처럼 연료를 많이 소모하는 엔진에서 가장 효과적입니다.§!"
 UKR_tank_aux_engine_2: "AEA-10"
 UKR_tank_aux_engine_2_desc: "AEA-10은 출력 10kW의 디젤 보조 동력 장치입니다. 이 설비는 수랭식 2기통 디젤 V형 엔진과 직류 발전기로 구성됩니다. 보조 동력 장치는 전차가 고정 사격 진지에 있거나 매복 중일 때처럼 엔진을 끈 상태에서도 전차에 전력을 공급하도록 설계되었습니다.\n\n§G설계 힌트: 보조 엔진을 추가하는 것은 가스터빈 엔진처럼 연료를 많이 소모하는 엔진에서 가장 효과적입니다.§!"
