 SLV_infantry_weapons_4_desc: "Heckler & Koch G36 (Gewehr 36) — штурмовая винтовка под патрон 5,56x45 мм, разработанная в начале 1990-х годов немецким производителем оружия Heckler & Koch на замену более тяжёлым моделям G3 под патрон 7,62x51 мм. Она была принята на вооружение бундесвера в середине 90-х, заменив G3. С тех пор она также стала популярным экспортным товаром, и G36 состоит на вооружении военных и полицейских подразделений ряда стран, включая Германию, Испанию и Великобританию."
 SLV_infantry_weapons_5_desc: "Модель G36A2 - это обновленный вариант модели G36. G36A2 оснащен быстросъемным коллиматорным прицелом Zeiss RSA, установленным на планке Пикатинни, который заменяет оригинальный коллиматорный прицел в сдвоенной боевой прицельной системе. Модернизированный комплект G36A2 также состоит из укороченного приклада G36C, нового цевья из алюминия с дополнительными четырьмя планками Пикатинни и вертикальной рукоятки со встроенным переключателем для управления лазерным модулем Oerlikon Contraves LLM01."
