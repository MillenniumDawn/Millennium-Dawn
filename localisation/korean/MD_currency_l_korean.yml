 monetary_policy_expand_money_supply: "통화 공급량 확대"
 monetary_policy_austerity: "긴축 재정"
 brazilian_real: "브라질 레알"
 brazilian_real_desc: "브라질은 수년간 지속된 인플레이션을 종식시키기 위해 레알화를 도입했습니다. 경제가 성장함에 따라 브라질은 파트너 국가들에게 외환보유고에 레알화를 보유해 줄 것을 요청할 수 있습니다. 파트너 국가들의 신뢰는 본국으로 자금을 가져올 수 있지만, 브라질 경제가 약화되면 파트너 국가들은 위험에 노출될 것입니다."
 bitcoin: "비트코인"
 bitcoin_desc: "비트코인은 가치를 안정적으로 유지할 중앙은행이 없습니다. 투자자들은 큰돈을 벌 기회를 보지만, 그 운명은 매달 바뀔 수 있습니다. 비트코인을 준비금으로 보유하는 국가는 '횡재'를 얻을 수도 있지만, 경제는 인플레이션에 더 취약해질 수 있습니다."
