 SIA_kra_phase_1_funding_tt: "Требуется, чтобы истек срок ожидания технико-экономического обоснования, а также чтобы в казначействе были средства, превышающие оба показателя (в настоящее время §Y$[?ROOT.SIA_kra_upkeep|0]§! billion) and the §Y$20§! млрд., платеж по первому этапу)."
 SIA_kra_phase_2_funding_tt: "Требуется, чтобы истек срок ожидания предыдущего этапа, а также чтобы в казначействе было больше средств, чем на поддержание обоих этапов (в настоящее время §Y$[?ROOT.SIA_kra_upkeep|0]§! billion) and the §Y$30§! млрд., платеж по второму этапу)."
 SIA_kra_phase_3_funding_tt: "Требуется, чтобы истек срок ожидания предыдущей фазы, а также чтобы в казначействе было больше средств, чем на поддержание обеих фаз (в настоящее время §Y$[?ROOT.SIA_kra_upkeep|0]§! billion) and the §Y$40§! млрд., платеж по фазе III)."
 SIA_ds_resolved_peace: "Восстание Глубокого Юга было урегулировано путём мирных переговоров."
 SIA_ds_intensity_below_60_tt: "Интенсивность повстанческого движения Глубокого Юга ниже §Y60§! (в настоящее время §Y[?SIA_insurgency_intensity|0]§!)"
 SIA_coup_risk_below_70_tt: "Риск государственного переворота ниже §Y70§! (теперь §Y[?ROOT.SIA_coup_risk|0]§!/100)"
