 russia_governorate.13.o2: "저항하고 맞서 싸우자!"
 sov_nationalists.10.t: "§Y[PER.GetNameWithFlag]§!과(와)의 동맹"
 sov_nationalists.10.d: "이란 정부는 조약을 통해 우리 동맹에 가입하는 것을 거부했습니다. 우리의 뜻을 무력으로 관철해야 할 것으로 보입니다."
 sov_nationalists.10.a: "이란은 우리의 것이 될 것이다!"
 sov_nationalists.11.t: "남아제르바이잔 여단 창설"
 sov_nationalists.11.d: "남아제르바이잔의 친러시아 세력이 정식 여단으로 조직되어 모스크바에 충성을 맹세했습니다. 이 상황은 우리에게 이 지역의 발판을 제공합니다."
 sov_nationalists.11.a: "그들은 우리에게 잘 봉사할 것이다"
 sov_nationalists.12.t: "동맹 가입을 제안하는 §Y[SOV.GetNameWithFlag]§!"
 sov_nationalists.12.d: "러시아 정부는 침략으로부터 우리를 보호하기 위한 일련의 협정을 제안합니다. 그들의 제안을 받아들여 동맹에 가입하시겠습니까?"
 sov_nationalists.12.a: "러시아가 우리를 구해줄 것이다!"
 sov_nationalists.12.b: "아니"
 sov_nationalists.13.t: "§Y[FROM.GetNameWithFlag]§!과(와)의 동맹"
 sov_nationalists.13.d: "[FROM.GetName] 정부는 조약을 통해 우리 동맹에 가입하는 것을 거부했습니다. 우리의 뜻을 무력으로 관철해야 할 것으로 보입니다."
 sov_nationalists.13.a: "슬픈 소식이군"
 sov_nationalists.14.t: "§Y[FROM.GetNameWithFlag]§!과(와)의 군사 훈련"
 sov_nationalists.14.d: "러시아는 튀르키예에 대한 잠재적 군사 개입에 대비하여 우리 군 및 다른 동맹국들의 군대와 합동 군사 훈련을 실시하고 있습니다."
 sov_nationalists.14.a: "우리는 준비할 것이다"
 sov_nationalists.15.t: "§Y[SOV.GetNameWithFlag]§!과(와)의 연방 국가"
 sov_nationalists.15.d: "러시아 정부는 러시아와 세르비아 사이의 과거 연방 국가 구상을 되살릴 것을 제안합니다. 1990년대에 옐친 정부가 거부했던 이 동맹을 이제 부활시키자고 제안하고 있습니다. 동의하시겠습니까?"
 sov_nationalists.15.a: "예"
 sov_nationalists.15.b: "아니요"
 sov_nationalists.17.t: "§Y[SER.GetNameWithFlag]§!과(와)의 연방 국가"
 sov_nationalists.17.d: "The Serbian government has refused to restart the Union State project. This setback is disappointing for those who hoped to strengthen our ties and unify our nations. We must consider our next steps carefully."
 sov_nationalists.17.a: "Unfortunate"
 sov_nationalists.19.t: "러시아와의 거래"
 sov_nationalists.19.d: "러시아의 제국주의적 야망이 이미 우리 국경까지 미쳤습니다. 그들의 정부는 우리나라에 대한 통제권을 요구하는 직접적인 최후통첩을 보냈습니다. 문제는 여전히 남아 있습니다. 저항해야 합니까, 아니면 그들의 요구에 굴복해야 합니까?"
 sov_nationalists.19.a: "우리는 포기한다"
 sov_nationalists.19.b: "오늘은 안 된다"
 sov_nationalists.20.t: "신 러시아 제국"
 sov_nationalists.20.d: "지리노프스키 대통령은 러시아 제국의 부활을 자신의 정치 의제의 초석으로 선언했습니다. 평화적 수단으로든 무력으로든 러시아는 옛 영토를 되찾을 준비가 되어 있습니다. 제국이 다시 일어남에 따라 새로운 분쟁의 가능성에 대비해야 합니다."
 sov_nationalists.20.a: "신이여, 대통령을 보호하소서."
 sov_nationalists.21.t: "재제국화"
 sov_nationalists.21.d: "1917년 봉기 이후 공산주의자들은 우리 조국의 과거에 대한 기억을 자신들의 이념으로 대체하여 지우려 했습니다. 많은 러시아 도시가 공산주의 지도자와 상징의 이름을 따서 개명되었습니다. 이 도시들의 혁명 이전 이름을 되찾아 우리의 역사와 존엄을 회복해야 합니다."
 sov_nationalists.21.a: "도시들의 옛 혁명 이전 이름을 되찾자"
 sov_nationalists.21.b: "전쟁 이전의 이름이 더 나았다"
 sov_nationalists.22.t: "국민투표 실시를 제안하는 러시아"
 sov_nationalists.22.d: "러시아 정부는 자국 연합에 가입하는 문제에 대한 긴급 국민투표를 개최할 것을 제안했습니다. 이 갑작스러운 제안은 러시아의 새로운 정책에 담긴 속도와 결의를 보여줍니다. 문제는 우리가 이 국민투표를 실시하고 그 결과를 받아들일 것인가입니다."
 sov_nationalists.22.a: "실시하고 결과를 받아들이자"
 sov_nationalists.22.b: "우리는 러시아의 일부가 되고 싶지 않다"
 sov_nationalists.23.t: "러시아가 만주를 요구하다"
 sov_nationalists.23.d: "러시아는 젤토로시야를 재건하려는 계획의 일환으로 만주의 병합을 요구했습니다. 이 공격적인 영유권 주장으로 인해 우리는 굴복할지 그들의 야망에 저항할지 결정해야 합니다."
 sov_nationalists.23.a: "굴복할 수밖에 없다..."
 sov_nationalists.23.b: "오늘은 젤토로시야는 없다."
 sov_nationalists.24.t: "중국이 우리의 요구를 받아들이다"
 sov_nationalists.24.d: "중국이 만주에 대한 우리의 요구를 받아들였습니다. 이 수락으로 우리는 마침내 젤토로시야에 대한 통제권을 확보했습니다. 이 승리는 우리의 지역적 야망에서 중요한 한 걸음입니다."
 sov_nationalists.24.a: "러시아에 영광을!"
 sov_nationalists.25.t: "우리의 요구를 거절한 중국"
 sov_nationalists.25.d: "중국은 만주에 대한 우리의 요구를 거부했습니다. 이제 젤토로시야를 되찾고 우리의 영유권을 관철하기 위해 군사 행동을 고려해야 합니다."
 sov_nationalists.25.a: "그들은 죽음을 선택했다."
 sov_nationalists.27.t: "러시아와의 거래"
 sov_nationalists.27.d: "러시아의 제국주의적 야망이 이제 우리 국경에 이르렀습니다. 그들의 정부는 우리나라에 대한 통제권을 요구하는 직접적인 최후통첩을 보냈습니다. 문제는 여전히 남아 있습니다. 저항해야 합니까, 굴복해야 합니까?"
 sov_nationalists.27.a: "우리는 포기한다"
 sov_nationalists.27.b: "오늘은 안 된다"
 sov_nationalists.28.t: "조지아로부터의 보호"
 sov_nationalists.28.d: "러시아는 우리가 그들의 연합에 가입하기 위한 국민투표를 실시할 것을 제안했습니다. 예상되는 결과는 분명하지만, 우리는 이 제안을 받아들일지 거부할지 결정해야 합니다."
 sov_nationalists.28.a: "물론이지, 이제 고향 러시아로 돌아갈 때다"
 sov_nationalists.28.b: "오늘은 안 된다"
 sov_nationalists.29.t: "예상치 못한 연합"
 sov_nationalists.29.d: "공산주의자들과의 협력은 아무도 예상하지 못했으나 뜻밖의 상황으로 현실이 되었습니다. 이 동맹은 정치 지형을 극적으로 바꿀 수 있습니다."
 sov_nationalists.29.a: "흥미롭군"
 sov_nationalists.30.t: "새 군주의 선택..."
 sov_nationalists.30.d: "러시아는 부활한 제국을 이끌 강력한 새 군주가 필요합니다. 누가 왕좌에 올라 이 격동의 시기에 나라를 이끌 것인지 결정해야 합니다."
 sov_nationalists.30.d1: "안드레이 로마노프가 가장 정통성 있는 후보다!"
 sov_nationalists.30.b: "마리아 블라디미로보나!"
 sov_nationalists.30.c: "게오르기가 통치해야 한다!"
 sov_nationalists.30.a: "니콜라이 3세!"
 sov_nationalists.31.t: "교회와 국가의 통합"
 sov_nationalists.31.d: "정부는 교회와 국가를 하나의 통일된 실체로 합친다고 발표했습니다. 정교회는 이제 지배층에 완전히 통합되어 영적 권위와 정치적 권위 사이의 역사적 조화를 회복하였습니다."
 sov_nationalists.31.a: "차레보즈니키."
 sov_nationalists.32.t: "대통령에 당선된 지리노프스키"
 sov_nationalists.32.d: "최근의 정권 교체 속에서 민족주의 성향의 러시아 자유민주당이 권력을 잡았고, 블라디미르 지리놉스키가 대통령으로 당선되었습니다. 이들은 옛 국기를 복원하고 보수적인 민족주의 의제를 추진하는 등 전면적인 개혁을 약속했습니다."
 sov_nationalists.32.a: "러시아에는 무엇이 기다리고 있을까?"
 sov_nationalists.33.t: "[UKR.GetName] 군사 작전"
 sov_nationalists.33.d: "우크라이나를 러시아 제국으로 되돌리려는 외교적 노력은 실패했습니다. 이제 현 정부를 전복하고 이 땅을 되찾기 위해 군사 행동이 취해질 것입니다."
 sov_nationalists.33.a: "키예프는 우리의 것이 될 것이다!"
 sov_nationalists.34.t: "[SOV.GetName]의 군대"
 sov_nationalists.34.d: "되살아난 우리 국가에는 강력하고 유능한 군대가 필요합니다. 앞으로의 도전에 대비하여 군대를 현대화하고 강화하기 위한 개혁을 시행할 것입니다."
 sov_nationalists.34.a: "[SOV.GetName]을(를) 위하여!"
 sov_nationalists.35.t: "체결된 모스크바 협정!"
 sov_nationalists.35.d: "우리는 러시아의 이익을 증진하고 서방 열강에 맞서는 데 전념하는 새로운 군사·정치 동맹을 공식 결성했습니다. 이 블록은 우리의 새로워진 힘의 핵심 수단이 될 것입니다."
 sov_nationalists.35.a: "[SOV.GetName]을(를) 위하여!"
 sov_nationalists.36.t: "[NOV.GetName] 현"
 sov_nationalists.36.d: "[NOV.GetName]은(는) 러시아 제국에 완전히 편입될 것입니다. 러시아 국기가 다시 한번 이 땅 위에 휘날리며 조국으로의 귀환을 알릴 것입니다."
 sov_nationalists.36.a: "[SOV.GetName]을(를) 위하여!"
 sov_nationalists.37.t: "[KAZ.GetName]의 카자크 봉기"
 sov_nationalists.37.d: "[KAZ.GetName]에 있는 우리에게 충성하는 카자크 집단이 이 땅을 [SOV.GetName]을(를) 위해 되찾겠다는 우리의 발표에 따라 무장 반란을 시작했습니다. 그들의 강한 충성심이 이 봉기를 부채질하고 있습니다."
 sov_nationalists.37.a: "[SOV.GetName]을(를) 위하여!"
 sov_nationalists.38.t: "중앙아시아 군사 작전"
 sov_nationalists.38.d: "중앙아시아 공화국들은 소련의 오류가 낳은 산물로, 거짓된 독립을 부여받았습니다. 필요하다면 무력으로라도 이 영토들을 우리의 위대한 제국으로 되돌릴 것입니다."
 sov_nationalists.38.a: "[SOV.GetName]을(를) 위하여!"
 sov_nationalists.39.t: "반러시아 무장 반란"
 sov_nationalists.39.d: "우리의 친러시아 정책은 일부 장군들 사이에 항명을 불러일으켰으며, 그들은 폴란드 정부를 통제하는 러시아 점령군을 전복하기 위해 바르샤바를 향해 진군하고 있습니다."
 sov_nationalists.39.a: "맙소사"
 SOV_URA_separ_tt: "§Y[URA.GetNameWithFlag]§!의 §R분리주의§!: §Y[?URA.subjectinped]§!%"
 SOV_question_of_genrih: "독일 군주제 혁명"
 SOV_question_of_genrih_desc: "우리는 부패하고 무능한 독일 정부를 무너뜨리고, 물론 러시아의 일부로서 독일인들이 과거의 위대함을 되찾도록 할 계획입니다. 이 혁명은 유럽의 세력 균형을 재편할 것입니다."
 SOV_suppress_nationalists: "민족주의자 탄압"
 SOV_suppress_nationalists_desc: "러시아 민족주의자들은 서구식 민주주의의 수립을 위협합니다. 그들을 억눌러야 합니다."
 SOV_iraq_moscow_pact: "이라크 수호"
 SOV_iraq_moscow_pact_desc: "우리는 외국 군대가 바그다드의 거리를 자유롭게 활보하도록 두지 않을 것입니다. 이라크를 외부의 간섭으로부터 보호하는 것은 지역 안정과 우리의 영향력을 유지하는 데 매우 중요합니다."
 sov_nationalists.40.t: "반러시아 무장 반란"
 sov_nationalists.40.d: "우리의 친러시아 입장은 일부 장군들의 반란을 불러왔으며, 그들은 친러시아 정부 전체를 체코에서 무력으로 몰아내겠다는 의사를 선언했습니다."
 sov_nationalists.40.a: "맙소사"
 SOV_czechoslovak_region: "체코슬로바키아 지역"
 SOV_czechoslovak_region_desc: "1968년과 마찬가지로 체코슬로바키아 지역은 여전히 우리에게 큰 전략적 관심 대상입니다. 이곳에서 영향력을 확보하면 동유럽에 대한 우리의 지배력이 공고해질 것입니다. 우리의 입지를 회복하기 위해 단호하게 행동해야 합니다."
 SOV_promotion_of_unite_with_russia_agains_chechos: "§Y[CZE.GetNameWithFlag]§!와(과) §Y[SLO.GetNameWithFlag]§!에서 §Y러시아§!의 이익 증진"
 SOV_perevorot_czechia_govern: "§Y[SOV.GetFlag]§!§Y친러시아§! §Y[CZE.GetNameWithFlag]§! 쿠데타"
 SOV_perevorot_slovakia_govern: "§Y[SOV.GetFlag]§!§Y친러시아§! §Y[SLO.GetNameWithFlag]§! 쿠데타"
 SOV_unite_of_greater_russia: "United, Great and Indivisible"
 SOV_unite_of_greater_russia_desc: "Russia must be a unified, indivisible country without national divisions. The fragmentation into republics once destroyed our mighty state, and only unity can restore our strength."
 SOV_republickill_23_TT: "[CHE.GetFlag][TAT.GetFlag][BSH.GetFlag] 대부분의 §Y민족 공화국§!이 §R폐지§!되었습니다§Y(18개 초과)§!"
 sov_nationalists.41.t: "우리 영토에 병력 주둔을 요구하는 §Y[SOV.GetNameWithFlag]§!"
 sov_nationalists.41.d: "러시아 정부는 우리 쪽에서 올 수 있는 위협을 우려하며 우리 영토에 대한 군사적 접근권을 요구합니다. 긴장을 완화하기 위해 통과를 허용해야 합니까, 아니면 거부해야 합니까?"
 sov_nationalists.41.a: "평화적 해결로 가는 길이라면 동의한다"
 sov_nationalists.41.b: "아니요"
 sov_nationalists.42.t: "우리 제안을 거부한 그들"
 sov_nationalists.42.d: "그들의 협력 거부는 그들이 우리 국가의 안보에 실질적인 위협이 된다는 확신을 주었습니다. 우리는 추가적인 분쟁에 대비해야 합니다."
 sov_nationalists.42.o1: "어리석은 자들"
 SOV_return_alaska: "알래스카 반환"
 SOV_return_alaska_desc: "알래스카는 과거 수 세기 전 어리석은 통치자들에 의해 헐값에 팔렸습니다. 이제 이 중요한 영토를 되찾아 마땅한 조국으로 돌려놓을 때입니다."
 SOV_jirik_war_religion: "제국 군사 종교"
 SOV_jirik_war_religion_desc: "우리 민족은 평화주의를 버리고 국민을 단결시키고 강하게 하기 위해 군사화된 정교 신앙을 받아들여야 합니다."
 GOV_SLO: "슬로바키아 현"
 GOV_CZE: "보헤미아 왕국"
 GOV_ASK: "알래스카 현"
 sov_nationalists.43.t: "알래스카 침공"
 sov_nationalists.43.d: "우리 군대가 알래스카 땅에 성공적으로 상륙하여 이 영토를 무력으로 되찾을 준비를 마쳤습니다. 이는 대담한 새로운 작전의 시작을 알립니다."
 sov_nationalists.43.o1: "알래스카 현이 돌아와야 한다"
 SOV_protect_russians: "러시아인 보호법"
 SOV_protect_russians_desc: "우리는 러시아인이 어디에 살든 보호할 것이며, 동포를 저버리지 않을 것입니다. 이 법은 그들의 권리와 안전을 보장하고, 어디에 있든 러시아 국민에 대한 우리의 약속을 강화합니다."
 SOV_IRQ_base: "[SOV.GetFlag]러시아 군사 기지"
 SOV_IRQ_base_desc: "우리 수도 인근에 위치한 러시아 군사 기지는 세계 대전이 발발하더라도 러시아가 우리를 저버리지 않을 것임을 상기시켜 줍니다. 그러나 우리나라나 러시아의 정권이 급격히 바뀌면 군사 기지는 즉시 폐쇄될 것입니다."
 SOV_iraq_weapons: "§Y[IRQ.GetNameWithFlag]§!에 무기 제공"
 SOV_iraq_instructors: "§Y[IRQ.GetNameWithFlag]§!에 GRU 파견"
 SOV_iraq_bases: "§Y[IRQ.GetNameWithFlag]§!에 군사 기지 제공"
 sov_nationalists.44.t: "무기를 제안하는 [FROM.GetName]"
 sov_nationalists.44.d: "[FROM.GetName]이(가) 다가올 분쟁에서 매우 유용할 무기를 우리에게 공급하겠다고 제안했습니다. 이 지원은 우리의 군사 능력을 강화할 것입니다."
 sov_nationalists.44.o1: "동의한다"
 sov_nationalists.44.o2: "우리에게는 필요 없다"
 sov_nationalists.45.t: "우리 제안에 동의한 [FROM.GetName]"
 sov_nationalists.45.d: "[FROM.GetName]이(가) 우리의 관대한 제안을 받아들였으며, 이는 동맹을 강화하고 지역 내 영향력을 높이는 또 하나의 걸음입니다."
 sov_nationalists.45.o1: "좋다"
 sov_nationalists.47.t: "우리 제안에 동의한 [FROM.GetName]"
 sov_nationalists.47.d: "[FROM.GetName]이(가) 우리의 제안을 받아들였으며, 이는 동맹을 더욱 공고히 하고 이 지역에서의 정치적 영향력을 확대합니다."
 sov_nationalists.47.o1: "좋다"
 sov_nationalists.48.t: "우리 제안을 거부한 [FROM.GetName]"
 sov_nationalists.48.d: "[FROM.GetName]이(가) 우리의 관대한 제안을 거절하여, 우리의 영향력을 강화하고 자국의 정치 상황을 안정시킬 기회를 놓쳤습니다."
 sov_nationalists.48.o1: "유감이다"
 sov_nationalists.49.t: "군사 기지 주둔을 제안하는 [FROM.GetName]"
 sov_nationalists.49.d: "[FROM.GetName]이(가) 잠재적 적대 세력에 대응하는 데 도움이 되도록 자국 영토에 군사 기지를 두는 것을 제안했습니다. 이는 전략적 이점이 될 수 있습니다."
 sov_nationalists.49.o1: "동의한다"
 sov_nationalists.49.o2: "우리에게는 필요 없다"
 SOV_save_gaddafi: "리비아 수호"
 SOV_save_gaddafi_desc: "외국 군대가 트리폴리를 지배하도록 허용되지 않을 것입니다. 우리는 리비아의 주권을 보호하고 외부의 군사 개입에 맞서는 데 전념합니다."
 SOV_help_karabah: "아제르바이잔으로부터 카라바흐 해방"
 SOV_help_karabah_desc: "우리는 아제르바이잔의 카라바흐 점령을 인정하지 않으며, 이 땅을 우리 제국으로 되돌릴 것입니다. 이 해방은 역사적 정의를 회복하고 우리의 남부 국경을 강화할 것입니다."
 SOV_LBA_base: "[SOV.GetFlag]러시아 군사 기지"
 SOV_LBA_base_desc: "우리 수도 인근에 위치한 러시아 군사 기지는 세계 대전이 발발하더라도 러시아가 우리를 저버리지 않을 것임을 상기시켜 줍니다. 그러나 우리나라나 러시아의 정권이 급격히 바뀌면 군사 기지는 즉시 폐쇄될 것입니다."
 SOV_libya_weapons: "§Y[LBA.GetNameWithFlag]§!에 무기 제공"
 SOV_libya_instructors: "§Y[LBA.GetNameWithFlag]§!에 GRU 파견"
 SOV_libya_bases: "§Y[LBA.GetNameWithFlag]§!에 군사 기지 제공"
 jirik_military_base_TT: "[SOV.GetFlag] §Y[ROOT.GetNameWithFlag]§!의 러시아 §H영향력 배수§!: §R+15%§!"
 GOV_NKR: "셰마하 현"
 russia_governorate.16.t: "우리를 현으로 삼기로 한 러시아의 결정"
 russia_governorate.16.d: "러시아는 기존의 국가 구조에 단호히 반대하고 있습니다. 그들은 행정 구역의 복귀를 추진하며 우리가 자국의 현 가운데 하나가 되기를 원합니다."
 russia_governorate.16.o1: "함께 위대한 제국을 부활시키자!"
 russia_governorate.16.o2: "저항하고 맞서 싸우자!"
 russia_governorate.16.o3: "연방 국가를 제안한다"
 russia_governorate.17.t: "고향으로 돌아오는 벨라루스"
 russia_governorate.17.d: "벨라루스 정부는 우리와의 충돌을 피함으로써 현명하게 행동했습니다. 벨라루스는 다시 한번 러시아 제국의 일부가 되어 우리의 동맹을 강화할 것입니다."
 russia_governorate.17.o1: "훌륭하군."
 russia_governorate.18.t: "우리에게 저항하는 벨라루스!"
 russia_governorate.18.d: "벨라루스는 감히 연방 국가에 대한 러시아의 뜻에 저항했습니다. 우리는 이 반항에 대한 단호한 대응을 준비해야 합니다."
 russia_governorate.18.o1: "어리석은 자들."
 russia_governorate.19.t: "연방 국가를 제안하는 벨라루스"
 russia_governorate.19.d: "벨라루스 정부는 덜 공격적인 대안으로 연방 국가를 가속화된 속도로 창설하는 방안을 제시했습니다. 그들은 자신들이 입을 수 있는 권력 상실을 최소화하려는 것으로 보입니다."
 russia_governorate.19.o1: "연방 국가가 있으라"
 russia_governorate.19.o2: "벨라루스는 없다."
 SOV_west_east_bop_left_side: "£text_icon_sov_democratic §Y새로운 민주 러시아§!"
 SOV_west_east_bop_right_side: "£text_icon_sov_empire §Y위대한 러시아의 계승자§!"
 SOV_west_east_bop: "러시아의 미래"
 SOV_west_east_bop_mid_range: "£text_icon_sov_democratic §Y옐친의 후계자들§!"
 SOV_west_east_left_win_range: "£text_icon_sov_democratic §Y러시아 민주주의§!"
 SOV_west_east_left_advanced_range: "£text_icon_sov_democratic §Y민주주의 원칙§!"
 SOV_west_east_left_medium_range: "£text_icon_sov_democratic §Y민주주의 의식§!"
 SOV_west_east_left_low_range: "£text_icon_sov_democratic §Y민주주의의 첫걸음§!"
 SOV_west_east_right_win_range: "£text_icon_sov_empire §Y제3의 로마§!"
 SOV_west_east_right_advanced_range: "£text_icon_sov_empire §Y새로운 제국§!"
 SOV_west_east_right_medium_range: "£text_icon_sov_empire §Y위대함에 대한 자각§!"
 SOV_west_east_right_low_range: "£text_icon_sov_empire §YThe Great Past§!"
 russian_legacy_empire: "£text_icon_sov_empire 제국의 유산"
 russian_legacy_empire_desc: "러시아는 언제나 위대한 제국으로 서 왔으며, 우리는 덧없는 민주주의의 환상을 좇아 이 유산을 저버리지 않을 것입니다."
 russian_legacy_democratic: "£text_icon_sov_democratic 민주주의 유산"
 russian_legacy_democratic_desc: "러시아는 오랜 전제 정치의 시기를 겪었지만 민주주의에 대한 희망의 순간도 경험했습니다. 우리는 이 자유의 유산을 보존하고 확대할 것입니다."
 SOV_kosmo_voiska: "러시아 우주군"
 SOV_kosmo_voiska_desc: "The Russian Space Forces serve as the space branch of the Aerospace Forces."
 SOV_armyreform_ipso: "정보작전 부대"
 SOV_armyreform_ipso_desc: "이 병력은 사이버전을 수행하고, 군 네트워크를 관리하며, 통신 체계를 사이버 위협으로부터 보호합니다."
 SOV_army_mto: "러시아군 병참지원"
 SOV_army_ipso: "정보작전 부대"
 SOV_russian_spaceforce: "러시아 우주군"
 SOV_putinism_propaganda: "푸틴주의 선전"
 SOV_putinism_propaganda_desc: "Before Putin, Russia was a shattered and humiliated country. Under his leadership, hope and pride were restored. We will celebrate this revival, and ensure that all citizens understand the greatness he has brought to Russia."
 SOV_idea_putinism_propaganda: "푸틴주의 선전"
 SOV_putinism_system_protest: "푸틴 체제에 대한 항의"
 SOV_stabilisation_fund: "안정화 기금"
 SOV_stabilisation_fund_desc: "The stabilization fund will serve as a financial reserve in the event of an economic crisis. It will help preserve national stability during downturns and ensure that public services continue to function. Having this safety net strengthens our position in both domestic and international markets."
 SOV_kasyanov_govern: "카시야노프 정부"
 SOV_kasyanov_govern_desc: "Kasyanov's government plans to reach an agreement with the Paris Club to write off part of our national debt. This would ease financial burdens and help stimulate growth. With more fiscal breathing room, we can focus on development and public welfare."
 SOV_young_guard: "유나이티드 러시아"
 SOV_young_guard_desc: "청년근위대는 통합 러시아의 청년 조직입니다. 그 이름은 제2차 세계 대전 당시의 영웅적인 지하 저항 운동에서 유래했습니다. 푸틴을 지지하는 직접 행동 단체로서 칼리닌그라드부터 블라디보스토크까지 85개 지역 지부를 보유하고 있다고 주장하며, 전국의 애국 청년들을 결집하고 있습니다."
 SOV_reform_sovfed: "연방의회 개혁"
 SOV_reform_sovfed_desc: "We are reforming the Federation Council to make its work more effective. In its current state, it serves little use. With better structure and clearer purpose, the Council can become a vital tool for policy implementation."
 SOV_stab_fund_idea: "안정화 기금"
 SOV_young_guard_idea: "유나이티드 러시아"
 SOV_stab_fund_tt: "§R경제 상황이 나쁠§! 경우, 경제를 안정시키기 위해 §Y안정화 기금§!이 사용됩니다\n"
 GOV_TRK: "투르키스탄 현"
 SOV_moscow_no_more: "페트로그라드는 러시아의 수도다"
 SOV_economic_russian: "러시아의 경제"
 SOV_economic_russian_desc: "Our economy remains weakened by the crises of the 1990s, the collapse of the USSR, and other lasting effects. It is time to take decisive action to rebuild and strengthen our nation's economic foundation."
 SOV_economic_reform_gazprom: "가스프롬의 개혁"
 SOV_economic_reform_gazprom_desc: "Gazprom suffered greatly during the 1990s crisis. Reforming this critical company is essential to preserve it as a powerful driver of our economic growth."
 SOV_economic_buy_sibur: "SIBUR 자산 인수"
 SOV_economic_buy_sibur_desc: "We are acquiring assets of the SIBUR petrochemical company to expand our industrial capabilities and secure our energy sector."
 SOV_economic_zapolyarnoe: "자폴리아르노예 가스전"
 SOV_economic_zapolyarnoe_desc: "Discovered in the 1960s, the vast gas, oil, and condensate reserves at Zapolyarnoye are now ready for extraction to boost our energy output."
 SOV_economic_gazprom_tes: "Geothermal Power Development"
 SOV_economic_gazprom_tes_desc: "Kamchatka's Mutnovsky field carries the largest geothermal potential in the country, and the Kuril Islands, Dagestan and the Kuban all sit on producible reservoirs. Completing the Mutnovskaya station and developing the smaller fields will supply remote regions that the national grid cannot economically reach."
 SOV_economic_nat_gas_sakhalin: "사할린의 가스 생산"
 SOV_economic_nat_gas_sakhalin_desc: "Investments in Sakhalin's gas fields will secure substantial profits and strengthen our energy exports."
 SOV_economic_gazprom_stream: "가스관 건설"
 SOV_economic_gazprom_stream_desc: "We are prepared to construct new gas pipelines that bypass certain countries, securing stable and reliable gas exports."
 SOV_economic_gazprom_norstream: "노르드 가스관"
 SOV_economic_gazprom_norstream_desc: "With Nord Stream in service and German gas flowing under the Baltic, the transit states have lost their leverage over our westbound exports. Restructuring Gazprom's export contracts around the new route will convert that position into revenue."
 SOV_economic_gazprom_bluestream: "블루 가스관"
 SOV_economic_gazprom_bluestream_desc: "Blue Stream now carries gas across the Black Sea floor to Samsun without touching a third country. Expanding throughput and renegotiating the Turkish offtake terms will let the resource sector book the full value of the route."
 SOV_economic_gazprom_turkeystream: "Turkish Stream"
 SOV_economic_gazprom_nordstream2: "노르드 가스관2"
 SOV_economic_gazprom_nordstream2_desc: "With the second Baltic line complete, our westbound capacity no longer depends on any transit state at all. Gas has become the instrument through which our position in Europe is negotiated."
 SOV_outer_space_vostochniy: "보스토치니 우주기지"
 SOV_outer_space_vostochniy_desc: "To reduce dependence on Baikonur, we will begin construction of the Vostochny Cosmodrome for future launches."
 SOV_outer_space_asteroids_mining: "소행성 자원 채굴"
 SOV_outer_space_asteroids_mining_desc: "Our space technology now enables the extraction of valuable resources from asteroids, which we will capitalize on."
 SOV_outer_space_space_combat_wombat: "Preparing for the Space Race"
 SOV_outer_space_space_combat_wombat_desc: "The space race has resumed after a pause, and we must intensify our efforts to regain leadership."
 SOV_outer_space_sateelites: "위성에 대한 투자"
 SOV_outer_space_sateelites_desc: "Satellites are vital eyes in space, essential not only for the race but also for potential future conflicts."
 SOV_outer_space_weaponized_space: "우주 군사화"
 SOV_outer_space_weaponized_space_desc: "Space will inevitably become a militarized domain, so it is crucial that we act first to secure our interests."
 SOV_outer_space_moon_base: "달 기지"
 SOV_outer_space_moon_base_desc: "Establishing a lunar base will be a major milestone on our path toward conquering the solar system."
 SOV_outer_space_marines: "러시아 우주 해병대"
 SOV_outer_space_marines_desc: "Our new branch of Space Marines will show no mercy, defeating any enemy in space combat."
 SOV_economic_floating_nuclear: "부유식 원자력 발전소"
 SOV_economic_floating_nuclear_desc: "Rosatom is designing self-contained, floating nuclear power plants to be mass-produced and deployed near locations in need of electricity."
 SOV_economic_securing_rosatom: "산업 안전"
 SOV_economic_securing_rosatom_desc: "We will strengthen security at nuclear facilities to prevent catastrophic incidents."
 SOV_economic_anti_terrorist_rosatom: "테러 방어"
 SOV_economic_anti_terrorist_rosatom_desc: "We will cooperate with the National Guard to fully protect our nuclear facilities from terrorist threats."
 SOV_economic_rao_ues: "RAO UES청산"
 SOV_economic_rao_ues_desc: "Reforming the energy sector requires dismantling the current market monopolist, RAO UES."
 SOV_economic_rus_hydro: "RusHydro 설립"
 SOV_economic_rus_hydro_desc: "We will establish RusHydro to efficiently control and manage energy production facilities."
 SOV_economic_rus_hydro_expanded: "RusHydro 확장"
 SOV_economic_rus_hydro_expanded_desc: "Investments have strengthened RusHydro, enabling it to build new energy infrastructure across the country."
 SOV_economic_interrao: "인터 라오"
 SOV_economic_interrao_desc: "Founded in 1997, Inter RAO will expand by acquiring domestic power grids as part of our energy reform."
 SOV_economic_interrao_expand: "인터라오 확장"
 SOV_economic_interrao_expand_desc: "With state support, Inter RAO is prepared to build new energy facilities nationwide."
 SOV_economic_trikolov_tv: "트리콜로르 TV"
 SOV_economic_trikolov_tv_desc: "Though a private company, we will maintain covert control over Tricolor TV's broadcasting network."
 SOV_economic_gazprom_media: "가스프롬 방송"
 SOV_economic_gazprom_media_desc: "Gazprom plans to create its own media holding; we must manage and influence this development."
 SOV_economic_gazprom_neft: "가즈프롬 네프트"
 SOV_economic_gazprom_neft_desc: "Following Sibneft's liquidation, Gazprom acquired a controlling stake and full control over its assets."
 SOV_economic_gas_with_sibur: "SIBUR와 함께하는 석유 및 가스 프로젝트"
 SOV_economic_gas_with_sibur_desc: "Gazprom is developing a joint oil and gas project with SIBUR to enhance regional production."
 SOV_economic_arctic_gas: "북극 석유 및 가스전"
 SOV_economic_arctic_gas_desc: "Gazprom plans to explore and exploit the vast reserves in Arctic oil and gas fields."
 SOV_economic_oil_nenets: "[NEE.GetName]에서의 석유 및 가스 프로젝트"
 SOV_economic_oil_nenets_desc: "Gazprom continues to develop oil and gas projects in this strategic region."
 SOV_economic_oil_yamao: "[YAM.GetName]에서의 석유 및 가스 프로젝트"
 SOV_economic_oil_yamao_desc: "Further development of oil and gas resources in this area remains a priority for Gazprom."
 SOV_economic_oil_khmao: "[KHM.GetName]에서의 석유 및 가스 프로젝트"
 SOV_economic_oil_khmao_desc: "Gazprom intends to expand oil and gas extraction operations in this region."
 SOV_economic_slavneft: "슬라브네프트 자산 인수"
 SOV_economic_slavneft_desc: "로스네프트와 가즈프롬은 슬라브네프트를 분할하고 자산을 인수할 계획입니다."
 SOV_economic_reform_rosneft: "로스네프트 개혁"
 SOV_economic_reform_rosneft_desc: "Rosneft aims to restructure and expand its operations to strengthen its market position."
 SOV_economic_use_yukos: "유코스 자산 사용"
 SOV_economic_use_yukos_desc: "Rosneft will utilize the assets acquired from Yukos' liquidation for further company development."
 SOV_economic_buy_itera: "이테라 인수"
 SOV_economic_buy_itera_desc: "Rosneft plans to incorporate ITERA into its portfolio as a new strategic asset."
 SOV_economic_buy_severnaya_neft: "세베르나야네프트 인수"
 SOV_economic_buy_severnaya_neft_desc: "The acquisition of SevernayaNeft will expand Rosneft's resource base."
 SOV_economic_buy_thk_bp: "TNK 인수"
 SOV_economic_buy_thk_bp_desc: "Rosneft intends to acquire TNK to strengthen its oil production capabilities."
 SOV_economic_efko: "에프코"
 SOV_economic_efko_desc: "Efko is a leading Russian producer of fats, margarine, mayonnaise, vegetable oils, and dairy products, ranking among the largest agro-industrial companies."
 SOV_economic_miratorg: "미라토르그"
 SOV_economic_miratorg_desc: "Miratorg is Russia's largest vertically integrated agricultural holding, producing pork and meat products across the entire supply chain."
 SOV_economic_rusagro: "루스아그로"
 SOV_economic_rusagro_desc: "One of Russia's largest agricultural firms, RusAgro specializes in pork, fats, and sugar production, founded in 1995."
 SOV_economic_efko_expanded: "Efko 확장"
 SOV_economic_efko_expanded_desc: "Efko plans continued growth, supported by state subsidies to boost its development."
 SOV_economic_miratorg_expanded: "미라토르그 확장"
 SOV_economic_miratorg_expanded_desc: "Miratorg aims to expand production with the help of government investment."
 SOV_economic_rusagro_expanded: "루스아그로 확장"
 SOV_economic_rusagro_expanded_desc: "RusAgro seeks further development backed by state funding."
 SOV_economic_phos_agro: "포스아그로"
 SOV_economic_phos_agro_desc: "PhosAgro, based in Moscow, is Europe's largest producer of phosphate-based fertilizers and related chemicals."
 SOV_economic_belarus_integrate: "벨라루스 산업 통합"
 SOV_economic_belarus_integrate_desc: "We will integrate Belarusian factories into the Russian economy, bringing these industries under our control."
 SOV_economic_mzkt_annex: "MZKT 통합"
 SOV_economic_mzkt_annex_desc: "MZKT, a Belarusian producer of heavy-duty and specialized vehicles, will be incorporated under our jurisdiction."
 SOV_economic_140_annex: "제140 정비창 통합"
 SOV_economic_140_annex_desc: "The 140th Repair Plant specializes in the modernization of armored vehicles and will be annexed to expand our military-industrial capacity."
 SOV_economic_peleng_annex: "펠렝을 통합"
 SOV_economic_peleng_annex_desc: "Peleng, a leading Belarusian company in optoelectronics for military and civilian use, will join our industrial system."
 SOV_economic_grodno_annex: "그로노 아조트 석유화학기업 확장"
 SOV_economic_grodno_annex_desc: "Grodno Azot produces fertilizers critical for agriculture, and integrating it will enhance our market reach."
 SOV_economic_evraz: "에브라즈"
 SOV_economic_evraz_desc: "EVRAZ is a multinational steel and mining company, partly owned by Russian oligarchs, operating mainly in Russia, the US, Canada, and Kazakhstan."
 SOV_economic_mechel: "메첼"
 SOV_economic_mechel_desc: "Mechel is a major Russian producer of coal, iron ore, and steel products, headquartered in Moscow with domestic and international sales."
 SOV_economic_severstal: "세베르스탈"
 SOV_economic_severstal_desc: "Severstal is Russia's largest steelmaker, headquartered in Cherepovets and controlled by billionaire Alexey Mordashov."
 SOV_economic_evraz_asset: "에브라즈 확장"
 SOV_economic_evraz_asset_desc: "EVRAZ is set to expand further with state subsidies supporting its growth."
 SOV_economic_yakut_ugol: "야쿠트우골 인수"
 SOV_economic_yakut_ugol_desc: "Mechel plans to acquire YakutUgol's assets to broaden its coal production capacity."
 SOV_economic_severstal_expanded: "세베르스탈 확장"
 SOV_economic_severstal_expanded_desc: "Severstal aims to grow with government support for new projects."
 SOV_economic_nornickel: "노르니켈"
 SOV_economic_nornickel_desc: "Nornickel is a leading Russian mining and smelting company specializing in nickel and palladium, operating mainly near Norilsk."
 SOV_economic_buy_polus: "폴리우스 구매"
 SOV_economic_buy_polus_desc: "Polyus is Russia's largest gold producer and one of the world's top mining companies by output."
 SOV_economic_alrosa: "ALROSA"
 SOV_economic_alrosa_desc: "ALROSA leads global diamond production by volume, accounting for 95% of Russian diamond output and 27% worldwide."
 SOV_economic_nakynskoe: "뉴르빈스크 광산 및 가공 공장"
 SOV_economic_nakynskoe_desc: "ALROSA has opened the Nyurbinsky plant, enhancing its mining and processing capacity."
 SOV_economic_rusal: "RUSAL"
 SOV_economic_rusal_desc: "RUSAL is the world's second-largest aluminium producer, responsible for nearly 9% of global output."
 SOV_economic_buy_sual: "SUAL 자산 인수"
 SOV_economic_buy_sual_desc: "Completion of SUAL's integration will finalize the company's full formation under our control."
 SOV_economic_aeroflot: "아에로플로트"
 SOV_economic_aeroflot_desc: "Aeroflot is Russia's flagship airline, evolved from the Soviet-era state enterprise, now operating internationally."
 SOV_economic_poebda: "포베다"
 SOV_economic_poebda_desc: "Pobeda is a Russian budget airline and subsidiary of Aeroflot, based at Moscow's Vnukovo Airport."
 SOV_economic_new_airports: "새로운 공항 건설"
 SOV_economic_new_airports_desc: "Aeroflot plans to invest in constructing new airports nationwide to improve flight accessibility."
 SOV_economic_rjd: "RZD"
 SOV_economic_rjd_desc: "러시아 철도는 공공 기반시설을 소유한 국영 수직 계열화 기업이며 러시아 철도망 최대의 운송업체입니다. 구 러시아 철도부를 기반으로 설립되었습니다. 이 회사는 국토의 광대한 지역을 연결하고 경제 발전을 뒷받침하는 데 중요한 역할을 합니다."
 SOV_economic_rjd_sochi: "소치의 기반시설"
 SOV_economic_rjd_sochi_desc: "러시아 철도는 관광을 활성화하고 지역의 운송 능력을 개선하기 위해 소치의 기반시설에 상당한 투자를 할 계획입니다. 이러한 개발은 소치를 국내외 방문객 모두에게 더 접근하기 쉽고 매력적인 목적지로 만드는 것을 목표로 합니다."
 SOV_economic_rjd_more_trains: "열차 구매"
 SOV_economic_rjd_more_trains_desc: "러시아 철도는 다수의 신규 화차를 긴급 주문하여 차량 보유량을 늘리고 있습니다. 이 조치는 철도망을 현대화하고 전국의 운송 능력을 개선할 것입니다."
 SOV_economic_rjd_moscow_circle: "모스크바 중앙 순환선"
 SOV_economic_rjd_moscow_circle_desc: "14호선으로 알려져 있으며 딸기색과 흰색으로 표시되는 모스크바 중앙 순환선(MCC)은 역사적인 모스크바를 둘러싸는 54킬로미터 길이의 도시 철도 노선입니다. 이 노선은 핵심적인 순환 경로를 제공하여 혼잡을 완화하고 도시 주변의 많은 주요 지역을 연결합니다."
 SOV_economic_rjd_transsib: "시베리아 횡단 철도"
 SOV_economic_rjd_transsib_desc: "역사적으로 대시베리아 노선이라 불렸고 흔히 트랜스십으로 줄여 부르는 시베리아 횡단 철도는 유럽 러시아와 러시아 극동을 잇는 방대한 철도망입니다. 대륙 전역의 화물 및 여객 수송에 매우 중요합니다."
 SOV_economic_rjd_baikal_amure: "바이칼 아무르 철도"
 SOV_economic_rjd_baikal_amure_desc: "바이칼 아무르 철도(BAM)는 동시베리아와 러시아 극동을 가로지르는 4,324킬로미터 길이의 광궤 철도입니다. 시베리아 횡단 철도의 북쪽 약 610~770킬로미터 지점에서 나란히 달리며 중요한 대체 수송 회랑을 제공합니다."
 SOV_economic_rjd_north_latitudinal: "북부 위도 철도"
 SOV_economic_rjd_north_latitudinal_desc: "현재 야말로네네츠 자치구에서 건설 중인 북부 위도 철도는 707킬로미터에 이를 것입니다. 이 철도는 서쪽의 북부 철도와 동쪽의 스베르들롭스크 철도를 연결하여 지역 연결성을 크게 개선할 것입니다."
 SOV_economic_rjd_sakhalin: "사할린의 교통 기반시설"
 SOV_economic_rjd_sakhalin_desc: "사할린의 교통 기반시설은 섬의 경제 성장을 뒷받침하기 위해 개선이 필요합니다. 러시아 철도는 사할린 내 연결성을 현대화하고 강화하기 위한 확장 사업을 계획하고 있습니다."
 SOV_economic_rjd_mcd: "모스크바 중앙 직경선"
 SOV_economic_rjd_mcd_desc: "모스크바 중앙 직경선(MCD)은 모스크바와 주변 모스크바주의 기존 교외 철도 노선에서 운행되는 통근 철도 서비스입니다. 이 서비스는 외곽 지역을 도심과 직접 연결하여 환승 효율을 개선합니다."
 SOV_economic_rubber: "국내 타이어 산업"
 SOV_economic_rubber_desc: "우리의 국내 타이어 산업은 여전히 발전이 미흡하며 더 많은 투자가 시급합니다. 여러 차례의 예산 배정을 통해 우리는 생산을 현대화하고 경제의 이 중요한 부문을 강화하는 것을 목표로 합니다."
 SOV_economic_rubber_foreign: "외국인 투자자"
 SOV_economic_rubber_foreign_desc: "We plan to attract top tire manufacturers and brands from abroad to establish production facilities in Russia. This will bring advanced technology and boost local industry development."
 SOV_economic_auto: "자동차 산업"
 SOV_economic_auto_desc: "자동차에 대한 수요는 지난 10년간 크게 증가하여, 우리 자동차 산업의 향후 방향을 결정하는 것이 매우 중요해졌습니다. 투자와 전략적 동반자 관계는 이러한 증가하는 수요를 충족하는 데 도움이 될 것입니다."
 SOV_economic_invite_investors: "해외 브랜드 유치"
 SOV_economic_invite_investors_desc: "우리는 해외 자동차 브랜드가 러시아에 공장을 짓는 것을 환영할 준비가 되어 있습니다. 이는 시장을 다변화하고 최첨단 자동차 기술을 들여올 것입니다."
 SOV_economic_cars_usa: "미국 자동차 브랜드"
 SOV_economic_cars_usa_desc: "미국 자동차 제조사들은 우리 시장에 진출하여 입지를 넓히도록 초청받고 있습니다. 이러한 협력은 소비자의 선택권을 넓히고 경쟁을 촉진할 것입니다."
 SOV_economic_cars_europe: "유럽 자동차 브랜드"
 SOV_economic_cars_europe_desc: "우리는 유럽 자동차 브랜드를 러시아 시장에 완전히 통합할 준비가 되어 있습니다. 이들의 참여는 기술 성장과 시장 다양성에 기여할 것입니다."
 SOV_economic_reno_nissan_autovaz: "아프토바즈 르노 닛산"
 SOV_economic_reno_nissan_autovaz_desc: "아프토바즈, 르노, 닛산 간의 제휴는 공유된 전문성과 자원을 통해 우리 자동차 부문을 강화하고 시장에 긍정적인 영향을 미치는 것을 목표로 합니다."
 SOV_economic_cars_west_market: "서방 자동차 시장"
 SOV_economic_cars_west_market_desc: "우리 시장은 서방 자동차 제조사들과 점점 더 통합되고 있습니다. 이 추세는 계속될 것이며, 산업을 현대화하고 소비자에게 더 폭넓은 차량 선택지를 제공하는 데 도움이 될 것입니다."
 SOV_economic_cars_japan_market: "일본 자동차 시장"
 SOV_economic_cars_japan_market_desc: "우리는 일본 자동차 제조사들의 선진 기술과 제조 기준의 혜택을 받기 위해 이들과의 동반자 관계를 심화할 계획입니다."
 SOV_economic_cars_china_market: "중국 자동차 시장"
 SOV_economic_cars_china_market_desc: "중국 자동차 제조사들과의 관계를 강화하면 새로운 기회가 열리고 러시아 소비자가 혁신적인 모델에 접근할 수 있게 될 것입니다."
 SOV_economic_cars_udar_market: "중국 제조사에 대한 폭넓은 접근 허용"
 SOV_economic_cars_udar_market_desc: "우리는 국내 시장에서 중국 제조사들의 입지를 확대할 것입니다. 이는 경쟁을 높이고 구매자에게 더 저렴한 선택지를 제공할 것입니다."
 SOV_economic_cars_moskvich: "모스크비치"
 SOV_economic_cars_moskvich_desc: "우리는 외국 자동차 설계를 라이선스하여 역사적인 모스크비치 브랜드를 부활시킬 계획입니다. 이 접근은 전통과 현대 기술의 균형을 맞춥니다."
 SOV_economic_aurus: "아우루스"
 SOV_economic_aurus_desc: "아우루스는 고급 임원용 및 럭셔리 차량으로 유명한 권위 있는 러시아 브랜드입니다. 본래 통합 모듈형 플랫폼과 코르테주 프로젝트로 개발되었으며, 우리의 고급 자동차 제작 기술을 대표합니다."
 SOV_economic_domestic: "국산 자동차 브랜드 중시"
 SOV_economic_domestic_desc: "외국의 해법에만 의존하는 대신 우리 국내 자동차 제조사들을 우선시하고 보호하는 것이 필수적입니다. 국내 역량을 구축하면 우리 경제와 자동차 독립성이 강화됩니다."
 SOV_economic_avtovaz: "아프토바즈"
 SOV_economic_avtovaz_desc: "아프토바즈는 이전에 VAZ로 알려졌던 러시아의 주요 국영 자동차 제조사입니다. 라다 시리즈로 가장 잘 알려져 있으며, 이 회사의 차량은 한때 지굴리, 오카, 스푸트니크 등 다양한 이름으로 판매되었으나 1990년대에 라다 브랜드로 단계적으로 일원화되었습니다."
 SOV_economic_kamaz: "카마즈"
 SOV_economic_kamaz_desc: "나베레즈니예첼니에 본사를 둔 카마즈는 트럭, 버스, 엔진을 생산하는 러시아의 선도 기업입니다. 1969년에 설립되었으며 특히 캡오버 엔진 트럭 설계로 유명합니다."
 SOV_economic_gaz: "GAZ"
 SOV_economic_gaz_desc: "GAZ, 곧 고르콥스키 아프토모빌니 자보드는 니즈니노브고로드에 본사를 둔 러시아의 핵심 자동차 제조사입니다. 베이직 엘리먼트 산업 그룹에 속한 GAZ 그룹 홀딩의 핵심 자회사로 운영됩니다."
 SOV_economic_national_proud: "민족적 자긍심"
 SOV_economic_national_proud_desc: "우리의 국산 자동차는 민족적 자긍심의 원천입니다. 우리는 그 발전을 지원하고 세계 최고의 차량 가운데 일부로 자리 잡도록 보장하는 데 변함없이 헌신합니다."
 SOV_economic_vaz_electro_car: "VAZ 전기차"
 SOV_economic_vaz_electro_car_desc: "VAZ는 자체 전기차 라인업을 출시할 계획입니다. 이 구상은 자동차 산업을 현대화하고 미래의 수요를 충족하기 위한 더 폭넓은 전략의 일부입니다."
 SOV_economic_own_mosnosti: "우리의 역량"
 SOV_economic_own_mosnosti_desc: "우리는 자동차 산업의 성장을 위해 오로지 자체 생산 시설에만 의존할 생각입니다. 이는 품질에 대한 통제를 유지하고 국내 제조업을 강화하는 데 도움이 될 것입니다."
 SOV_economic_chaika: "차이카"
 SOV_economic_chaika_desc: "역사적인 차이카 브랜드가 현대적인 개선과 기능과 함께 부활할 것입니다. 이 부활은 고전적 유산과 현대 자동차 디자인을 조화시키는 것을 목표로 합니다."
 SOV_economic_rostelekom: "로스텔레콤"
 SOV_economic_rostelekom_desc: "로스텔레콤은 가정, 기업, 정부, 통신 사업자에게 서비스를 제공하는 러시아 최대의 디지털 서비스 제공업체입니다. 지역 통신망을 하나의 전국 체계로 연결하여 장거리 통화와 인터넷 서비스를 제공하며, 러시아의 통신 기반시설에서 중추적인 역할을 합니다."
 SOV_economic_inter_networks: "국내 통신망 사업자"
 SOV_economic_inter_networks_desc: "로스텔레콤은 러시아 전역의 수많은 소규모 통신망 사업자를 인수하여 자사의 통제 아래 통합할 계획입니다. 이 전략은 효율성을 높이고 시장 점유율을 확대할 것입니다."
 SOV_economic_gosuslugi: "고수슬루기"
 SOV_economic_gosuslugi_desc: "고수슬루기는 러시아 정부가 운영하는 연방 디지털 플랫폼으로, 국가 및 지방 자치 행정 서비스에 대한 정보를 온라인으로 접근할 수 있게 합니다. 전자 양식을 제공하고 시민, 기업, 정부 간의 상호작용을 간소화합니다."
 SOV_economic_mts: "MTS"
 SOV_economic_mts_desc: "모바일 텔레시스템즈(MTS)는 모스크바에 본사를 둔 러시아 최대의 이동통신 사업자입니다. GSM, UMTS, LTE 규격에 걸친 서비스와 함께 유선 전화, 광대역 인터넷, 각종 텔레비전 서비스를 제공합니다."
 SOV_economic_mts_expanding: "MTS 확장"
 SOV_economic_mts_expanding_desc: "MTS는 전국에 수많은 기지국 탑을 세우는 데 투자하고 있습니다. 이 확장은 러시아 전역의 통신 범위와 품질을 개선하여 수백만 사용자에게 혜택을 줄 것입니다."
 SOV_economic_tele2: "텔레2 러시아"
 SOV_economic_tele2_desc: "처음 스웨덴 텔레2가 설립한 텔레2 러시아는 현재 로스텔레콤의 완전 자회사입니다. 러시아 통신 시장의 핵심 주체입니다."
 SOV_economic_megaphon: "메가폰"
 SOV_economic_megaphon_desc: "이전에 북서 GSM이었던 메가폰은 러시아 2위의 이동전화 사업자이자 3위의 통신 서비스 제공업체입니다. 전국에서 GSM, UMTS, LTE 망으로 서비스를 제공합니다."
 SOV_economic_it_sphere: "러시아 IT 부문"
 SOV_economic_it_sphere_desc: "기술은 미래의 토대이므로 우리는 국내 IT 부문을 발전시키는 데 전념하고 있습니다. IT에 대한 투자는 우리나라가 경쟁력과 혁신성을 유지하도록 보장합니다."
 SOV_economic_destiny_sber: "스베르뱅크 리브랜딩"
 SOV_economic_destiny_sber_desc: "스베르뱅크가 대대적인 리브랜딩을 거칠 때가 되었습니다. 낡은 구조와 시각적 스타일은 시대에 뒤떨어졌습니다. 오늘날 스베르뱅크는 단순한 은행이 아니라 다양한 금융 및 디지털 서비스를 제공하는 완전한 생태계입니다."
 SOV_economic_destiny_vk: "VK의 미래"
 SOV_economic_destiny_vk_desc: "프콘탁테는 러시아 최대의 소셜 네트워크로, 그 영향력은 우리가 상상했던 것을 넘어섭니다. 이 플랫폼이 국가 이익과 일치하도록 국가의 통제 아래 두어야 할 때일지도 모릅니다."
 SOV_economic_mir: "미르"
 SOV_economic_mir_desc: "미르는 러시아 중앙은행이 설립한 러시아의 전자결제 시스템입니다. 금융 기관에 신용, 직불 및 기타 카드 프로그램에 사용되는 브랜드 결제 상품을 제공하며, 국제 카드 시스템에 대한 국내 대안이 됩니다."
 SOV_economic_destiny_yandex: "얀덱스의 미래"
 SOV_economic_destiny_yandex_desc: "작은 회사로 출발한 얀덱스는 러시아 IT 부문을 장악할 만큼 성장했습니다. 이제는 그 향후 방향을 이끌기 위해 국가의 개입이 필요할 수도 있을 만큼 영향력이 큽니다."
 SOV_economic_glonass: "글로나스"
 SOV_economic_glonass_desc: "GLONASS is Russia's satellite navigation system providing global coverage. As an alternative to the GPS system, it offers precise positioning services critical for civilian and military use."
 SOV_sollers_idea: "솔레르스"
 SOV_foreign_cars_idea: "해외 자동차 산업"
 SOV_vk_idea: "VK 그룹"
 SOV_foreign_chinacars_idea: "중국 자동차 산업"
 SOV_our_cars_idea: "국내 자동차 산업"
 SOV_space_marines_idea: "러시아 우주 해병대"
 SOV_turkey_stream_idea: "튀르키예 스트림"
 SOV_blue_stream_idea: "블루 스트림"
 SOV_nord_stream2_idea: "노르트 스트림 2"
 SOV_nord_stream_idea: "노르트 스트림"
 SOV_azod_phosagro_idea: "포스아그로 화학 비료"
 SOV_azod_phosagro_idea_desc: "포스아그로는 비료, 인산염, 사료용 인산염을 생산하는 러시아의 화학 지주회사입니다. 본사는 러시아 모스크바에 있으며, 자회사로는 무르만스크주에 기반을 두고 인회석 채굴에 종사하는 아파티트가 있습니다. 이 회사는 유럽 최대의 인산염계 비료 생산업체입니다."
 sov_economic.1.t: "호도르콥스키 사건"
 sov_economic.1.d: "미하일 호도르콥스키가 자신의 석유 회사 유코스 내부의 대규모 횡령과 부패 혐의로 체포되었습니다. 그는 올리가르히들 사이에서 상당한 영향력을 지니고 있어 국내 안정에 위협이 될 수 있습니다. 유죄를 입증할 결정적 증거는 없지만, 우리는 신중하게 어떻게 진행할지 결정해야 합니다. 이 선택은 지속적인 정치적 파장을 낳을 수 있습니다."
 sov_economic.1.a: "유죄!"
 sov_economic.1.b: "그는 좋은 사업가다, 도둑이 아니다!"
 sov_economic.2.t: "호도르콥스키의 재판"
 sov_economic.2.d: "신속한 수사가 끝나, 호도르콥스키에 대한 판결을 내릴 때가 되었습니다. 우리는 적절한 처벌을 결정해야 합니다. 우리의 결정은 세간의 이목을 끄는 부패 사건을 어떻게 다루는지에 대한 강력한 메시지를 보낼 것입니다."
 sov_economic.2.a: "감옥에 보내라!"
 sov_economic.2.b: "벌금이면 충분하다."
 sov_economic.3.t: "구신스키 사건"
 sov_economic.3.d: "러시아 최대 민간 언론사 NTV의 최고경영자 블라디미르 구신스키가 대규모 사기 혐의로 기소되어 체포되었습니다. 그는 자신의 언론 지주회사 전체를 정부에 매각하고 출국하겠다고 제안했습니다. 추가적인 문제를 피하기 위해 이 거래를 받아들여야 하겠습니까?"
 sov_economic.3.a: "지분을 사들이고 그를 떠나게 하라."
 sov_economic.3.b: "그는 무죄다! 석방하라!"
 sov_economic.3.c: "그의 언론은 필요 없다. 감옥에 보내라!"
 sov_economic.4.t: "로스네프트와 TNK의 합병"
 sov_economic.4.d: "로스네프트가 주요 경쟁사인 TNK와의 합병을 제안했습니다. 이 조치는 자유 시장 원칙에 어긋나지만 정부에는 이익이 됩니다. 위험에도 불구하고 이 합병을 승인해야 하겠습니까?"
 sov_economic.4.a: "그렇다! 로스네프트가 지배해야 한다."
 sov_economic.4.b: "아니다! 자유 시장을 지키고 TNK를 독립 상태로 두어라."
 sov_economic.5.t: "가즈프롬과 시브네프티의 합병"
 sov_economic.5.d: "가즈프롬은 로만 아브라모비치가 소유한 주요 석유 회사인 시브네프티를 인수할 계획입니다. 이는 시장의 자유를 위협하지만 정부 기업들을 강화합니다. 이 거래를 승인해야 하겠습니까?"
 sov_economic.5.a: "승인하라! 시브네프티는 우리 것이 된다."
 sov_economic.5.b: "거부하라! 자유 시장은 러시아에 필수적이다."
 sov_economic.7.t: "노르트 스트림"
 sov_economic.7.d: "러시아가 노르트 스트림 가스 파이프라인의 건설을 제안합니다. 이 사업은 우리 경제와 에너지 부문을 크게 활성화할 것으로 기대됩니다."
 sov_economic.7.a: "동의"
 sov_economic.7.b: "거절"
 sov_economic.8.t: "가스 파이프라인 개통"
 sov_economic.8.d: "상대국으로 가는 가스 파이프라인을 개통하자는 우리의 제안이 수락되었습니다. 이는 우리 경제 협력의 새로운 단계를 의미합니다."
 sov_economic.8.a: "긍정적인 진전"
 sov_economic.9.t: "가스 파이프라인 개통"
 sov_economic.9.d: "가스 파이프라인을 개통하자는 우리의 제안은 거절되었습니다. 노선 자체는 건설되어 있고 수송 용량도 어디로 가지 않으므로, 정치적 기류가 개선되면 제안을 다시 테이블에 올릴 수 있습니다."
 sov_economic.9.a: "후회하게 만들어라"
 sov_economic.10.t: "블루 스트림"
 sov_economic.10.d: "러시아가 블루 스트림 가스 파이프라인의 건설을 제안하며, 이는 우리의 에너지 기반시설과 경제 성장을 향상시킬 것입니다."
 sov_economic.10.a: "수락"
 sov_economic.10.b: "거부"
 sov_economic.11.t: "튀르키예 스트림"
 sov_economic.11.d: "러시아가 튀르키예 스트림 가스 파이프라인을 제안합니다. 이 사업은 우리의 경제적 유대와 에너지 안보를 크게 개선할 수 있습니다."
 sov_economic.11.a: "그렇다"
 sov_economic.11.b: "아니요"
 sov_economic.12.t: "노르트 스트림 2"
 sov_economic.12.d: "노르트 스트림 2 건설 제안은 에너지 수출 능력의 개선을 통해 우리 경제를 강화할 것으로 기대됩니다."
 sov_economic.12.a: "승인"
 sov_economic.12.b: "거절"
 sov_economic.13.t: "러시아 타이어 산업에 대한 투자"
 sov_economic.13.d: "러시아 타이어 산업은 어려움을 겪고 있으며 투자가 필요합니다. 정부는 우리의 참여에 열려 있어, 경쟁사보다 먼저 제조 공장을 세울 수 있게 해 줍니다."
 sov_economic.13.a: "투자"
 sov_economic.13.b: "거절"
 sov_economic.14.t: "러시아 타이어 산업"
 sov_economic.14.d: "정부가 우리 타이어 산업에 투자하기로 동의하여 성장과 현대화의 새로운 기회가 열렸습니다."
 sov_economic.14.a: "좋은 소식"
 sov_economic.15.t: "러시아 타이어 산업"
 sov_economic.15.d: "정부가 우리 타이어 산업에 대한 투자를 거절했으며, 이는 진전과 경쟁력을 늦출 수 있는 차질입니다."
 sov_economic.15.a: "실망스럽다"
 sov_economic.16.t: "화학 비료 무역 협정을 제안하는 러시아"
 sov_economic.16.d: "러시아가 우리에게 고품질 화학 비료에 대한 독점 계약을 제안했습니다. 이 거래를 수락하면 농업 수확량이 크게 개선될 수 있으나, 일부는 정치적 함의에 의문을 제기할 수 있습니다."
 sov_economic.16.a: "수락"
 sov_economic.16.b: "당분간 거절"
 sov_economic.17.t: "[From.GetName]의 수락"
 sov_economic.17.d: "[From.GetName]와(과) 우리의 협상이 성공했습니다. 계약이 체결되었으며 첫 번째 대금이 곧 들어올 것으로 예상됩니다. 이는 긍정적인 진전입니다."
 sov_economic.17.a: "마침내 좋은 소식이다."
 sov_economic.18.t: "우리 거래를 거절한 [From.GetName]"
 sov_economic.18.d: "[From.GetName]와(과) 우리의 거래가 실패했습니다. 회신을 받지 못했으며 전망은 어둡습니다. 우리는 접근 방식을 재고해야 합니다."
 sov_economic.18.a: "답답한 차질이다."
 sov_economic.19.t: "화학 비료 무역 협정을 제안하는 러시아"
 sov_economic.19.d: "러시아가 우수한 화학 비료에 대한 독점 계약을 제안했습니다. 이 거래는 더 높은 작물 수확량을 약속하지만 일부 정당 사이에서 정치적 우려를 불러일으킬 수 있습니다."
 sov_economic.19.a: "제안을 수락한다."
 sov_economic.19.b: "당분간 거절한다."
 sov_economic.20.t: "[From.GetName]의 수락"
 sov_economic.20.d: "[From.GetName]와(과) 맺은 거래가 마무리되었습니다. 계약이 체결되었고 대금이 곧 시작될 것이며, 이는 중요한 성과입니다."
 sov_economic.20.a: "좋은 소식이다."
 sov_economic.21.t: "우리 거래를 거절한 [From.GetName]"
 sov_economic.21.d: "[From.GetName]와(과) 협상이 회신 없이 교착되었습니다. 거래는 당분간 무산된 것으로 보입니다."
 sov_economic.21.a: "실망스러운 거절이다."
 SOV_economy_category: "러시아 경제"
 SOV_economy_category_desc: "[SOV.GetFlag]§Y[SOV.GetAdjectiveCap]§! 경제는 현재 어려운 시기를 겪고 있습니다. 우리는 과거의 유산을 되살리는 데 그치지 않고, 세계 경제 선도국의 대열에 올라서야 합니다.\n\n§R경제적 후유증§! 국가 정신을 제거하려면 §Y경제 지부§!의 중점을 §G완료§!해야 합니다. £text_icon_sov_ruble §Y경제 회복§!이 높을수록 이 §R약화 효과§!를 더 빠르게 §G제거§!할 수 있습니다.\n\n£text_icon_sov_ruble §Y시가총액§!: [SOV.GetFlag]§Y러시아§!의 대기업들은 £text_icon_sov_ruble §Y시가총액§!을 보유하며, 이는 각 기업의 패널에 표시됩니다. 시가총액은 러시아 안팎의 신규 자산 인수, 높거나 낮은 부패 수준, 전쟁, 경제 성장 등 다양한 조건에 따라 끊임없이 변동합니다.\n\n§R공산주의자§!가 §Y집권§!하면 £text_icon_sov_ruble §Y시가총액§!의 갱신과 변동이 중단됩니다.\n§2과두 세력§!이 §Y집권§!하면 기업들의 £text_icon_sov_ruble §Y시가총액§!이 크게 §R감소§!합니다.\n\n£text_icon_sov_ruble §Y경제 회복§!: §Y[?SOV.SOV_economic|0]§!\n\n[SOV_MoexStatus_loc][SOV_CapGazprom_loc][SOV_CapRosneft_loc][SOV_CapSberbank_loc][SOV_CapVtb_loc][SOV_CapMts_loc][SOV_CapAlrosa_loc][SOV_SphereIntegration_loc]"
