 syrian_civil_war_refugees_ast: "Gérer les réfugiés syriens"
 syrian_refugees_event_ast.1.t: "Les réfugiés syriens"
 syrian_refugees_event_ast.1.d: "Avec le déclenchement du conflit en Syrie, des milliers de réfugiés demandent asile dans notre nation. Ils sont passés par les canaux officiels, et les circonstances dont ils fuient les qualifieraient certainement à l'entrée, mais le choix nous appartient. Les laisser entrer pourrait encourager davantage à suivre les bonnes procédures, ou ouvrir les vannes d'une nouvelle crise migratoire."
 syrian_refugees_event_ast.1.a: "Laissez-les entrer."
 syrian_refugees_event_ast.1.b: "Ce n'est pas notre problème."
 malaysianflight_event_ast.1.t: "La disparition du MH370"
 malaysianflight_event_ast.1.d: "An international passenger plane, operated by Malaysia Airlines, dropped from radars yesterday while flying over the South China Sea in a disappearance that has left families shattered, and the airline company dumbfounded. \n\nThe flight, which was originally intended to land in Beijing, mysteriously vanished from sensors three days ago en route from the Malaysian Capital. While authorities continue to search for any wreckage, relatives of the missing passengers have been told to prepare for the worst. 40 ships and 34 aircraft from nine different nations are taking part in the search, although Malaysian officials have claimed they still have no idea what went wrong."
 malaysianflight_event_ast.1.a: "Où est-il passé ?"
 AST_keep_them_aligned: "Les garder alignés"
 AST_keep_them_aligned_desc: "Le Parti national a tenté de faire du bruit autour de notre politique agricole, ou de son absence. Si ces tactiques de coercition ont pu fonctionner avec les administrations précédentes, elles ne dicteront pas la conduite de ce cabinet. Nous publierons nos propres subventions aux agriculteurs, selon nos termes, et les proclamerons aux médias comme notre victoire. \n\nCela montre que s'ils veulent jouer le jeu avec nous, ce sera selon nos conditions."
 AST_privatise_the_care: "Privatiser les soins"
 AST_privatise_the_care_desc: "L'expérience de la santé publique en Australie a vu les coûts augmenter au-delà de niveaux acceptables, voire gérables, sans guère d'amélioration des soins. En privatisant des pans du programme, nous ouvrons la perspective d'un choix élargi et d'une efficacité accrue pour ceux qui cherchent des soins. C'est un modèle éprouvé, et nous sommes ouverts à l'adopter."
 papua_affair.2.t: "Proposition australienne sur le caoutchouc"
 papua_affair.2.d: "Le gouvernement de Canberra a proposé un parrainage d'État pour un certain nombre de nos plantations de caoutchouc autour de Port Moresby. Selon eux, l'accord vise à renforcer et assurer un commerce régulier entre nous, et en particulier il annule quelques-uns de nos tarifs. Les petits propriétaires locaux soutiennent la demande au motif d'exportations accrues, mais la proposition pourrait nous rendre plus dépendants d'eux à l'avenir."
 papua_affair.2.a: "C'est une bonne affaire."
 papua_affair.2.b: "Pas d'accord."
 papua_affair.3.t: "Caoutchouc sécurisé"
 papua_affair.3.d: "Heureusement, le Premier ministre a accepté de tenter les pourparlers une seconde fois et a soutenu notre proposition. Les agriculteurs autour de Port Moresby jouiront d'une demande accrue et de généreuses subventions, tandis que nous recevons un flux régulier de caoutchouc pour nos industries en croissance. Toute la région devrait bénéficier de cet arrangement."
 papua_affair.3.a: "Une autre affaire réussie."
 papua_affair.4.t: "Pas de réponse"
 papua_affair.4.d: "Malheureusement, la délégation de Papouasie-Nouvelle-Guinée n'est pas ouverte à nos pourparlers pour le moment. Ou alors ils ont oublié comment répondre au téléphone. C'est un résultat décevant, mais en attendant nous pouvons élargir notre quête de caoutchouc plus localement."
 papua_affair.4.a: "On ne peut pas tous les gagner."
