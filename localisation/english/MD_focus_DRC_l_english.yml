 MDRC_unlock_union_pan_african: "Reveals the United States of Central Africa and African Union decisions in Regional Unions and Integration. Unmet political and territorial requirements are shown on each decision. Formation preserves puppets."
 MDRC_integrate_region_CNG: "Integrate Congo"
 MDRC_integrate_region_CNG_desc: "Harmonize public records, local services and fiscal administration over 180 days. Costs 1 treasury and 75 political power. Every highlighted state must be directly owned and controlled by DRC; puppet territory cannot be cored this way. On completion the region receives DRC cores. If peace or territorial control is lost, the charge and political power are refunded and the project can be attempted again."
 MDRC_integrate_region_CNG_refund_tt: "Integration could not be completed: refund 1 treasury and 75 political power."
 MDRC_union_accession_CNG: "Offer Voluntary Accession to Congo"
 MDRC_union_accession_CNG_desc: "Invite this existing DRC puppet to join the union directly. Costs 1 treasury and 100 political power, with a 180-day cooldown. Its government may refuse. Acceptance annexes this one consenting puppet and transfers its forces; it does not immediately grant cores. Other puppets remain untouched."
