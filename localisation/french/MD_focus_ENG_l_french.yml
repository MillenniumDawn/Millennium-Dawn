 ENG_referendum_region_none: "l'Union"
 ENG_unionist_campaign_tour: "Tournée de campagne unioniste"
 ENG_unionist_campaign_tour_desc: "Put the Cabinet on the road. Town halls, factory floors, shipyards and university unions, every day of the campaign, making the argument in person rather than through a press release written in London. It moves a few points and it can be repeated for as long as the ministers hold out.\n\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
 ENG_fiscal_settlement_offer: "Proposer un règlement fiscal"
 ENG_fiscal_settlement_offer_desc: "Open the Treasury. A guaranteed block grant, capital projects confirmed rather than promised, and a floor under the funding formula, all signed before polling day. Voters weighing independence against their household finances notice, and the region's reliance on Westminster deepens with every pound of it.\n\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
 ENG_discredit_separatists: "Discréditer la campagne séparatiste"
 ENG_discredit_separatists_desc: "Brief against the separatist leadership. Their currency plans, their border arrangements, their finances and, if the briefings run that way, their private lives. It works more often than it does not, and when it does not it hands them a grievance and a headline.\n\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
 ENG_discredit_separatists_tt: "§G60 %§! de chances que la campagne porte et que le soutien au départ chute fortement.\n§R40 %§! de chances que cela se retourne, relevant à la fois le vote pour partir et l'agitation locale."
 ENG_further_devolution_pledge: "S’engager à poursuivre la décentralisation"
 ENG_further_devolution_pledge_desc: "The last card in the hand: a signed pledge that a vote to remain will be answered with new powers over tax, welfare and broadcasting. It moves the soft separatist vote and takes the heat out of nationalist politics for a generation, at the price of handing over the levers Westminster would need to hold the region together next time.\n\nCan be pledged once per campaign.\n\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
 ENG_referendum_leave_vote_down_4_tt: "$ENG_integration_vote$: §G+4§!%"
 ENG_referendum_leave_vote_down_6_tt: "$ENG_integration_vote$: §G+6§!%"
 ENG_referendum_leave_vote_down_7_tt: "$ENG_integration_vote$: §G+7§!%"
 ENG_promote_unionism_scotland: "Plaider l'Union en Écosse"
 ENG_promote_unionism_scotland_desc: "Fund the unionist parties' ground operation in Scotland between elections rather than during them: constituency offices kept open, candidates recruited in seats the party had written off, and a sustained argument for the Union made where nobody has bothered to make it for years. Slow, unglamorous, and the only thing that moves Scottish Nationalism downward."
 ENG_scottish_unionism_calm_tt: "L'agitation écossaise est inférieure à §G25§! (actuellement §Y[?ENG_scottish_agitation|0]§!)"
 ENG_promote_unionism_nireland: "Plaider l'Union en Irlande du Nord"
 ENG_promote_unionism_nireland_desc: "Fund unionist civic organisation in Northern Ireland outside the marching season: community projects in the interface areas, cross-community employment schemes, and candidates who can hold a seat without running on the border. Slow work, and the only thing that moves Northern Irish Nationalism downward."
 ENG_north_irish_unionism_calm_tt: "Les tensions communautaires sont inférieures à §G25§! (actuellement §Y[?ENG_north_irish_agitation|0]§!)"
 ENG_promote_unionism_wales: "Plaider l'Union au pays de Galles"
 ENG_promote_unionism_wales_desc: "Fund the unionist parties' organisation in Wales: constituency work in the valleys, Welsh-language campaigning that does not concede the language to the nationalists, and a positive case for the Union rather than an argument that the sums do not work. Slow, and the only thing that moves Welsh Nationalism downward."
 ENG_wales_unionism_calm_tt: "L'agitation galloise est inférieure à §G25§! (actuellement §Y[?ENG_wales_agitation|0]§!)"
 ENG_convene_constitutional_convention: "Convoquer une convention constitutionnelle"
 ENG_convene_constitutional_convention_desc: "Le règlement constitutionnel de 1998 fut écrit à la hâte, par des gens qui s'attendaient à le renégocier plus tard, et plus tard est arrivé. Convoquer une convention transpartisane sur l'avenir de l'Union : administrations dévolues, oppositions, Églises et syndicats, siégeant six mois et rendant compte au Parlement plutôt qu'au Cabinet.\n\nLa convention ne décide rien d'elle-même. Son rapport est la base juridique et politique sur laquelle Westminster peut proposer un règlement permanent à l'Écosse, à l'Irlande du Nord ou au pays de Galles, et sans cela nulle offre de règlement ne serait prise au sérieux par quiconque.\n\nRequiert un gouvernement assez stable pour survivre au débat, et aucun référendum ni campagne d'indépendance déjà en cours."
 ENG_scottish_union_settlement: "Proposer un règlement de l’Union écossaise"
 ENG_scottish_union_settlement_desc: "With Scottish politics quiet, Scottish finances tied to the Treasury and the independence parties at their weakest, Westminster can put the constitutional question to Scotland on its own terms instead of waiting to be asked. A settlement approved at the ballot box is one of three Westminster needs to win before the devolution process ends permanently: Scotland's place in the United Kingdom is written into statute one referendum at a time, and each win brings Holyrood closer to no longer being a route out of the Union.\n\nA settlement rejected changes nothing beyond the money spent calling it, and the region goes into a five-year cooldown before another can be tried.\n\nReferendums won: §Y[?ENG_scottish_referendum_success|0]§!/§G3§!\nIndependence pressure: §Y[?ENG_scottish_pressure|0]§!/§G20§!\nScottish Nationalism: §Y[?ENG_scottish_nationalists|0]§!/§G25§!"
 ENG_scottish_settlement_calm_tt: "La pression indépendantiste écossaise est inférieure à §G20§! (actuellement §Y[?ENG_scottish_pressure|0]§!)"
 ENG_scottish_settlement_ready_tt: "Le nationalisme écossais est inférieur à §G25§! (actuellement §Y[?ENG_scottish_nationalists|0]§!)"
 ENG_north_irish_union_settlement: "Proposer un règlement de l’Union nord-irlandaise"
 ENG_north_irish_union_settlement_desc: "With the dissidents decommissioned, the Province quiet and republican politics at its weakest, Westminster can put the constitutional question to Northern Ireland on its own terms. A settlement approved at the ballot box is one of three Westminster needs to win before the devolution process ends permanently and the border poll stops being a route out of the Union.\n\nA settlement rejected changes nothing beyond the money spent calling it, and the region goes into a five-year cooldown before another can be tried.\n\nReferendums won: §Y[?ENG_north_irish_referendum_success|0]§!/§G3§!\nIndependence pressure: §Y[?ENG_north_irish_pressure|0]§!/§G20§!\nNorthern Irish Nationalism: §Y[?ENG_north_irish_nationalists|0]§!/§G25§!"
 ENG_north_irish_settlement_calm_tt: "La pression indépendantiste nord-irlandaise est inférieure à §G20§! (actuellement §Y[?ENG_north_irish_pressure|0]§!)"
 ENG_north_irish_settlement_ready_tt: "Le nationalisme nord-irlandais est inférieur à §G25§! (actuellement §Y[?ENG_north_irish_nationalists|0]§!)"
 ENG_welsh_union_settlement: "Proposer un règlement syndical gallois"
 ENG_welsh_union_settlement_desc: "With Welsh politics quiet and the Senedd's independence wing marginal, Westminster can settle the constitutional question in Wales before anybody else raises it. A settlement approved at the ballot box is one of three Westminster needs to win before the devolution process ends permanently and Wales's place in the United Kingdom is written into statute.\n\nA settlement rejected changes nothing beyond the money spent calling it, and the region goes into a five-year cooldown before another can be tried.\n\nReferendums won: §Y[?ENG_welsh_referendum_success|0]§!/§G3§!\nIndependence pressure: §Y[?ENG_wales_pressure|0]§!/§G20§!\nWelsh Nationalism: §Y[?ENG_wales_nationalists|0]§!/§G25§!"
 ENG_wales_settlement_calm_tt: "La pression indépendantiste galloise est inférieure à §G20§! (actuellement §Y[?ENG_wales_pressure|0]§!)"
 ENG_wales_settlement_ready_tt: "Le nationalisme gallois est inférieur à §G25§! (actuellement §Y[?ENG_wales_nationalists|0]§!)"
 devolution.11.t: "[ENG_GetReferendumRegion] vote pour la sortie"
 devolution.11.d: "Le dépouillement est achevé et le résultat n'est pas douteux. Une majorité a voté pour quitter le Royaume-Uni, et le gouvernement qui a convoqué le référendum est tenu d'y donner effet. Les négociations sur la défense, la dette, la monnaie et la frontière commencent aussitôt, et le premier acte est constitutionnel : le transfert de pouvoirs que Westminster a passé une génération à refuser est désormais un transfert de souveraineté."
 devolution.11.a: "Le résultat tient."
 devolution.12.t: "L'Union tient"
 devolution.12.d: "La campagne du départ a perdu. La participation fut élevée, l'écart assez clair pour que personne de crédible ne le conteste, et la question constitutionnelle est close pour une génération par les termes mêmes du scrutin. Les partis séparatistes se regrouperont, et l'amertume d'une campagne perdue mettra des années à se tasser, mais le Royaume-Uni est intact et Westminster a une réponse pour la prochaine fois que la demande sera soulevée."
 devolution.12.a: "Une fois par génération."
 devolution.13.t: "Le règlement est approuvé"
 devolution.13.d: "The settlement has carried. [ENG_GetReferendumRegion] has voted to close the constitutional question on Westminster's terms, and the result becomes part of the mandate: one of three referendums the government needs to win before the devolution process ends here for good. The nationalist parties are left arguing against a result their own voters delivered."
 devolution.13.a: "La question est tranchée."
 devolution.14.t: "Le règlement est rejeté"
 devolution.14.d: "The settlement has been voted down. [ENG_GetReferendumRegion] remains part of the Union in name, but the result emboldens the separatist parties and the money and political capital spent calling the vote are gone. Resistance to Westminster's rule hardens in the region until the constitutional question is finally settled. Westminster can put the question again once the region's five-year cooldown has run its course."
 devolution.14.a: "Une erreur coûteuse."
