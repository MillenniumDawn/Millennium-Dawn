 ukraine_varyag.15.name: "§Y바랴크§!의 무장"
 ukraine_varyag.15.desc: "§W항공모함에는 근접 방어용 함포와 단거리 대공 방어 체계가 필요합니다. 조선소는 기존 재고로 §!§YAK-630§!§W 거치대와 §!§Y킨잘§!§W 발사기를 정비하거나 §!§YPhalanx§!§W와 §!§YSea Sparrow§!§W 체계를 수입할 수 있습니다. 수입하려면 §!§Y[USA.GetNameWithFlag]§!§W과(와) 평화 상태여야 하고 해당 정부의 호감도가 최소 §!§Y+30§!§W이어야 합니다.§!"
 ukraine_varyag.15.a: "§YAK-630§!과 §Y킨잘§! 방어 체계를 장착한다"
 ukraine_varyag.15.b: "§YPhalanx§!와 §YSea Sparrow§! 방어 체계를 장착한다"
