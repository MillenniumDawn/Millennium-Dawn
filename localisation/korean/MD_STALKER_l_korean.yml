l_korean:
 STALKER.1.t: "구역의 봉쇄 붕괴"
 STALKER.1.d: "초르노빌 일대의 이상 활동이 옛 출입 통제 구역의 경계를 넘어 확대되었습니다. 정부는 구역을 군의 권한 아래 봉쇄할지, 통제된 과학 접근을 허용할지 결정해야 합니다."
 STALKER.1.a: "군의 통제 아래 경계를 봉쇄한다."
 STALKER.1.b: "구역을 과학 연구팀에 개방한다."
 STALKER.2.t: "구역을 휩쓴 방출"
 STALKER.2.d: "이상 에너지의 거센 파동이 [STALKER_zone_name]을(를) 휩쓸었습니다. 기반 시설이 마비되었고 구역의 활동은 더욱 활발해졌습니다."
 STALKER.2.a: "피해를 파악한다."
 STALKER.2.b: "방어선을 보강한다."
 STALKER.2.b_tt: "정치력 §Y50§!을(를) 소모해 봉쇄도를 최대 §G15§!만큼 올리고, 활성도를 최대 §G10§!만큼 낮추며, 개발도를 최대 §R5§!만큼 낮춥니다."
 STALKER.2.c: "방출 잔류물을 연구한다."
 STALKER.2.c_tt: "정치력 §Y25§!을(를) 소모해 개발도를 최대 §G15§!만큼 올리는 대신 봉쇄도를 최대 §R5§!만큼 낮춥니다."
 STALKER_zone_management_category: "구역 관리"
 STALKER_zone_management_category_desc: "우리가 통제하는 이상 지대에서 봉쇄, 공공 안전, 과학적 접근 사이의 균형을 맞춥니다.\n\n[STALKER_field_campaign_name]\n[STALKER_field_assignment_status]"
 STALKER_reinforce_zone_containment: "[FROM.GetName]의 방어선 보강"
 STALKER_reinforce_zone_containment_desc: "[FROM.GetName]의 이상 활동을 억제하기 위해 인원과 장비를 추가로 투입합니다.\n\n현재 활성도: §Y[?FROM.STALKER_zone_activity|0]§!\n현재 봉쇄도: §Y[?FROM.STALKER_zone_containment|0]§!\n현재 개발도: §Y[?FROM.STALKER_zone_exploitation|0]§!\n방출 전망: §Y[FROM.STALKER_current_emission_risk]§!\n\n첫 방출 이후 월간 위험도는 §Y(활성도 + 개발도 - 봉쇄도) × 0.2§!이며, §Y2%§!에서 §Y20%§! 사이로 제한됩니다."
 STALKER_zone_presence: "구역"
 STALKER_zone_presence_desc: "치명적인 이상 현상과 변형된 생태계, 믿을 수 없는 물리 법칙이 뒤섞인 채 넓어지는 지역입니다."
 STALKER_emission_disruption: "방출로 인한 혼란"
 STALKER_emission_disruption_desc: "최근의 방출로 군사 및 경제 활동이 혼란에 빠졌습니다."
 STALKER_zone_administration: "구역 관리"
 STALKER_zone_administration_desc: "방어선을 유지하는 데는 국가 자원이 들지만, 구역을 통제된 범위에서 개발하면 과학적 성과를 얻을 수 있습니다. 보유한 구역이 몇 개든 연구 속도는 최대 §G+10%§!까지만 오릅니다."
 STALKER_military_policy_tt: "GDP의 §Y0.2%§!가 소요됩니다. 구역 §Y봉쇄도§!가 §Y30§! 오릅니다. §Y90일§!의 유예 기간이 지나면 첫 방출이 반드시 발생합니다. 초르노빌 구역에서는 방출 효과나 추가 조치 이전 기준으로 봉쇄도 §Y60§!, 개발도 §Y0§!, 매월 반복되는 위험도 §Y2%§!가 됩니다."
 STALKER_scientific_policy_tt: "GDP의 §Y0.2%§!가 소요됩니다. 구역 §Y개발도§!가 §Y30§! 오르며, 이 구역을 통제하는 동안 연구 속도가 증가합니다. §Y90일§!의 유예 기간이 지나면 첫 방출이 반드시 발생합니다. 초르노빌 구역에서는 방출 효과나 추가 조치 이전 기준으로 봉쇄도 §Y30§!, 개발도 §Y30§!, 연구 속도 §G+1.5%§!, 매월 반복되는 위험도 §Y12%§!가 됩니다."
 STALKER_reinforce_zone_containment_tt: "구역 §Y봉쇄도§!가 §G20§! 오르고, §Y활성도§!는 최대 §G10§!, §Y개발도§!는 최대 §R5§! 떨어집니다."
 STALKER_current_emission_risk_value: "[?STALKER_emission_risk_display|.1]%"
 STALKER_first_emission_outlook: "유예 기간 90일이 지나고 정책을 선택한 뒤 첫 월간 파동에서 최초의 방출이 반드시 발생"
 STALKER_emission_cooldown_outlook: "쿨다운 180일이 지속되는 동안에는 방출 위험이 없음"
 STALKER_cordon_crackdown: "[FROM.GetName]의 코든 소탕"
 STALKER_cordon_crackdown_desc: "코든의 마을과 검문소를 샅샅이 뒤져 도적 무리와 그들의 장물을 거래하는 상인들을 소탕합니다.$STALKER_zone_society_readout$"
 STALKER_cordon_crackdown_tt: "구역 §Y도적§! 영향력이 최대 §G20§!, §Y스토커§! 인구가 최대 §R10§! 줄어들고, §Y봉쇄도§!가 §G5§! 오릅니다."
 STALKER_emergency_perimeter_patrol: "[FROM.GetName]의 긴급 방어선 순찰"
 STALKER_emergency_perimeter_patrol_desc: "돌파구가 퍼지기 전에 코든에 새로 생긴 틈을 막도록 순찰대를 보냅니다. 이번 돌파 사태 동안 한 번만 시행할 수 있습니다.$STALKER_zone_society_readout$"
 STALKER_emergency_perimeter_patrol_tt: "구역 §Y봉쇄도§!가 최대 §G10§! 오르고, §Y활성도§!, §Y도적§! 영향력, §Y개발도§!는 각각 최대 §G5§! 떨어집니다."
 STALKER_license_cordon_trader: "[FROM.GetName]의 코든 상인 허가"
 STALKER_license_cordon_trader_desc: "구역 가장자리의 상인 한 명에게 스토커로부터 아티팩트를 사들일 수 있는 국가 허가를 내줍니다. 그러면 수확물이 범죄 조직 대신 더 많이 우리 연구소로 들어옵니다.$STALKER_zone_society_readout$"
 STALKER_license_cordon_trader_tt: "구역 §Y개발도§!가 §G10§! 오르고, §Y도적§! 영향력이 최대 §G10§! 줄어들며, §Y스토커§! 인구가 §Y10§! 늘어납니다. §Y프리덤§! 영향력은 원래의 구역에서만 §Y5§! 오릅니다."
 STALKER_back_duty: "[FROM.GetName]에서 듀티 지원"
 STALKER_back_duty_desc: "구역은 봉쇄하거나 파괴해야 한다고 믿는 규율 잡힌 파벌 듀티에 은밀히 무기와 물자를 댑니다. 듀티의 영향력이 커지면 스토커와 도적이 구역에서 멀어집니다.$STALKER_zone_society_readout$"
 STALKER_back_duty_tt: "구역 §Y듀티§! 영향력이 §G20§! 오르고, §Y프리덤§! 영향력은 최대 §Y10§! 떨어집니다."
 STALKER_back_freedom: "[FROM.GetName]에서 프리덤 지원"
 STALKER_back_freedom_desc: "구역은 어느 정부의 것도 아니라고 주장하는 파벌 프리덤이 스토커와 연구자들에게 길을 열어 주는 것을 못 본 척합니다. 프리덤의 영향력이 커지면 더 많은 스토커가 구역으로 모여듭니다.$STALKER_zone_society_readout$"
 STALKER_back_freedom_tt: "구역 §Y프리덤§! 영향력이 §G20§! 오르고, §Y듀티§! 영향력은 최대 §Y10§! 떨어집니다."
 STALKER_study_recovered_artifacts: "회수한 아티팩트 연구"
 STALKER_study_recovered_artifacts_desc: "회수한 아티팩트를 한 묶음 연구소로 보내 연구하게 합니다.\n\n아티팩트 비축량: §Y[?ROOT.STALKER_artifact_stockpile|1]§!"
 STALKER_study_recovered_artifacts_tt: "국가 비축분에서 아티팩트 §Y5§!개를 소모하고 §Y180일§! 동안 연구 속도 §G+3%§!를 얻습니다."
 STALKER_artifact_studies: "아티팩트 연구"
 STALKER_artifact_studies_desc: "우리 연구소에서 구역에서 회수한 아티팩트를 연구하고 있습니다."
 STALKER.3.t: "듀티와 프리덤의 충돌"
 STALKER.3.d: "[STALKER_zone_name] 인근에서 듀티와 프리덤 사이에 총격전이 벌어졌습니다. 듀티는 프리덤이 스토커들을 방어선 너머로 밀입국시킨다고 비난하고, 프리덤은 듀티가 정부의 일을 공짜로 해 주고 있다고 맞받습니다. 양측 모두 우리가 어느 편에 설지 묻고 있습니다."
 STALKER.3.a: "듀티 편에 선다."
 STALKER.3.a_tt: "구역 §Y듀티§! 영향력이 §G10§! 오르고, §Y프리덤§! 영향력이 최대 §Y15§!, §Y스토커§! 인구가 최대 §Y5§! 줄어듭니다."
 STALKER.3.b: "프리덤 편에 선다."
 STALKER.3.b_tt: "구역 §Y프리덤§! 영향력이 §G10§! 오르고, §Y듀티§! 영향력이 최대 §Y15§!, §Y스토커§! 인구가 최대 §Y5§! 줄어듭니다."
 STALKER.3.c: "알아서 싸우게 둔다."
 STALKER.3.c_tt: "구역 §Y듀티§!와 §Y프리덤§! 영향력이 각각 최대 §Y10§!, §Y스토커§! 인구가 최대 §Y10§! 줄어들고, §Y도적§! 영향력은 §R5§! 오릅니다."
 STALKER.4.t: "코든의 암시장"
 STALKER.4.d: "국경 경비대가 [STALKER_zone_name] 가장자리에 노천 시장이 열렸다고 보고했습니다. 도적들이 이곳에서 멀게는 키이우와 민스크에서 온 구매자들에게 아티팩트를 팔고 있으며, 손님 중에는 우리 장교도 있습니다."
 STALKER.4.a: "시장을 급습한다."
 STALKER.4.a_tt: "정치력 §R25§!이(가) 소모됩니다. 구역 §Y도적§! 영향력이 최대 §G15§!, §Y스토커§! 인구가 최대 §Y5§! 줄어듭니다."
 STALKER.4.b: "위장 회사를 통해 사들인다."
 STALKER.4.b_tt: "국가 비축분에 아티팩트 §G3§!개가 추가됩니다. 구역 §Y도적§! 영향력이 §R5§! 오릅니다."
 STALKER.5.t: "특이한 아티팩트"
 STALKER.5.d: "프리덤 소속 스토커 일행이 [STALKER_zone_name]에서 우리 과학자들이 본 적 없는 아티팩트를 들고 나왔습니다. 그들은 그것을 지키려 하고, 우리 연구소는 그것을 더욱 원합니다."
 STALKER.5.a: "연구소로 보낸다."
 STALKER.5.a_tt: "국가 비축분에 아티팩트 §G5§!개가 추가됩니다."
 STALKER.5.b: "스토커들이 갖게 둔다."
 STALKER.5.b_tt: "구역 §Y프리덤§! 영향력이 §G10§! 오르고 §Y스토커§! 인구가 §Y5§! 늘어납니다."
 STALKER.6.t: "무너지는 방어선"
 STALKER.6.d: "[STALKER_zone_name] 주변 코든에 틈이 벌어졌습니다. 순찰대는 검문소 너머에서 이상 활동이 감지되고 도적들의 이동로가 넓어지고 있다고 보고합니다. 지휘관들은 돌파 사태가 시작된 지 약 석 달 뒤에 결판이 날 것으로 보며, 긴급 순찰과 봉쇄 작업으로 아직 위기를 되돌릴 수 있습니다."
 STALKER.6.a: "방어선 병력을 동원한다."
 STALKER.7.t: "방어선 사수"
 STALKER.7.d: "긴급 대응으로 [STALKER_zone_name] 주변의 돌파구를 막았습니다. 순찰대가 검문소를 복구하고 있으며 도적들의 접근로는 좁아졌습니다."
 STALKER.7.a: "경계를 유지한다."
 STALKER.8.t: "방어선 붕괴"
 STALKER.8.d: "[STALKER_zone_name] 주변 코든은 돌파 사태를 막아 내지 못했습니다. 이상 활동과 도적들의 이동이 급증해 지역이 혼란에 빠졌고 국민의 신뢰도 흔들리고 있습니다."
 STALKER.8.a: "방어선을 재건한다."
 STALKER_xlab_stage_0: "단서 없음"
 STALKER_xlab_stage_1: "다크 밸리에서 X-18 발견"
 STALKER_xlab_stage_2: "X-16에서 프로젝트 X 발각"
 STALKER_xlab_stage_3: "X-10에서 C-의식 드러남"
 STALKER_xlab_stage_4: "더 큰 조직망 의심"
 STALKER_granted_zone_access: "우리에게 구역 접근을 허용함"
 STALKER_refused_zone_access: "우리의 구역 접근을 거부함"
 STALKER_returned_artifacts: "압수한 아티팩트를 반환함"
 STALKER_ipsf_contribution: "국제 방어선 보안군에 기여함"
 STALKER_artifact_gift: "우리에게 구역 아티팩트를 선물함"
 STALKER_zone_society_readout: "\n\n스토커: §Y[?FROM.STALKER_zone_stalkers|0]§!\n듀티: §Y[?FROM.STALKER_zone_duty|0]§! | 프리덤: §Y[?FROM.STALKER_zone_freedom|0]§! | 도적: §Y[?FROM.STALKER_zone_bandits|0]§! | 모노리스: §Y[?FROM.STALKER_zone_monolith|0]§!\n생태학자: §Y[?FROM.STALKER_zone_scientists|0]§! | 군: §Y[?FROM.STALKER_zone_military|0]§! | 워드: §Y[?FROM.STALKER_zone_ward|0]§! | 스파크: §Y[?FROM.STALKER_zone_spark|0]§!\n클리어 스카이: §Y[?FROM.STALKER_zone_clear_sky|0]§! | 눈: §Y[?FROM.STALKER_zone_noon|0]§! | 용병: §Y[?FROM.STALKER_zone_mercenaries|0]§!\n최대 영향력: §Y[FROM.STALKER_zone_leading_faction]§!\n봉쇄도: §Y[?FROM.STALKER_zone_containment|0]§! | 활성도: §Y[?FROM.STALKER_zone_activity|0]§! | 개발도: §Y[?FROM.STALKER_zone_exploitation|0]§!\n지난달 아티팩트: §Y[?FROM.STALKER_zone_artifact_haul|1]§!개, 이 중 §R[?FROM.STALKER_zone_black_market|1]§!개가 암시장으로 흘러감\n듀티는 도적의 신규 가담을 억제하고 더 많은 아티팩트를 회수하며, 프리덤은 아티팩트 수확량을 늘리고, 도적이 장악하면 더 많은 아티팩트가 밀수업자에게 흘러갑니다. 모노리스는 북쪽으로 향하는 스토커를 죽이고 X-연구소를 지킵니다. 용병은 원래의 구역에서 외국 정보기관을 따라 움직입니다."
 STALKER_study_recovered_artifacts_available_tt: "국가 비축분에 아티팩트 §Y5§!개 이상 보유 (현재 §Y[?ROOT.STALKER_artifact_stockpile|1]§!개)"
 STALKER.1.d_global: "여덟 번째 포드가 열린 뒤 이상 현상이 초르노빌에서 멀리까지 퍼졌고, 이제 [STALKER_zone_name]에도 자리를 잡았습니다. [ROOT.STALKER_zone_flavor] 정부는 새 구역을 군의 통제 아래 봉쇄할지, 통제된 과학적 접근을 허용할지 결정해야 합니다."
 STALKER.1.d_lake_mungo: "마른 호수 바닥과 오스트레일리아에서 발견된 가장 오래된 인류 유골이 있는 멍고호에서 계측기가 침묵하고, 방문객들은 거기 없는 사람들이 보인다고 말합니다. 정부는 멍고호 이상 구역을 군의 통제 아래 봉쇄할지, 통제된 과학적 접근을 허용할지 결정해야 합니다."
 STALKER_zone_flavor_none: ""
 STALKER_zone_flavor_32: "이상 현상은 1945년 최초의 원자폭탄이 시험된 트리니티 부지에서 국경 바로 남쪽, 치와와 사막 일대에 집중되어 있습니다."
 STALKER_zone_flavor_34: "이상 현상은 호르무즈 해협을 따라 늘어서 있으며, 세계 석유의 5분의 1이 방어선이 보이는 거리에서 지나갑니다."
 STALKER_zone_flavor_35: "인도 쪽 악사이 친 국경 지대인 라다크에서는 구역이 중국과 마주한 군 초소들 사이, 해발 3킬로미터 넘는 고지에 자리하고 있습니다."
 STALKER_zone_flavor_2: "머스케그와 가문비나무 숲이 허드슨만까지 북쪽으로 뻗어 있고, 들어가는 길이라곤 처칠로 가는 철도뿐입니다."
 STALKER_zone_flavor_3: "세인트로렌스강은 대피를 한 번도 겪어 본 적 없는 마을들을 향해 이상 현상의 기이한 빛을 하류로 실어 나릅니다."
 STALKER_zone_flavor_4: "구역은 맨해튼 계획 당시 우라늄을 농축하던 오크리지 일대 능선 위에 내려앉았습니다."
 STALKER_zone_flavor_5: "이상 현상은 1945년 최초의 원자폭탄이 시험된 트리니티 부지 인근 사막에 집중되어 있습니다."
 STALKER_zone_flavor_6: "그린란드 서해안에서는 빙하가 소리 없이 갈라져 떨어지고, 사냥꾼들은 얼음 위를 건너기를 거부합니다."
 STALKER_zone_flavor_7: "텅 빈 그린란드 동부에서는 연구 기지 아래의 빙상 자체가 움직이는 듯합니다."
 STALKER_zone_flavor_8: "아이슬란드의 화산 지대가 이제 수증기 이상의 것을 내뿜고 있지만, 이 섬의 작은 해안경비대로는 봉쇄할 수 없습니다."
 STALKER_zone_flavor_9: "페루 아마존 깊은 곳에서는 강이 유일한 길이고, 수관이 그 아래의 모든 것을 가립니다."
 STALKER_zone_flavor_10: "마나우스 인근 아마존강을 따라 이상 현상이 강물을 타고 떠다니는데, 순찰대가 따라잡을 수 없을 만큼 빠릅니다."
 STALKER_zone_flavor_11: "아마존강이 대서양과 만나는 곳에서는 목장주와 벌목업자들이 지역 전체를 버리고 떠났습니다."
 STALKER_zone_flavor_12: "차코의 메마른 가시나무 숲 전역에서 국경의 샛길은 밀수꾼들의 차지입니다."
 STALKER_zone_flavor_13: "구역은 고속도로와 철도 분기점, 수백만 인구가 밀집한 잉글랜드 산업 지대 한복판에 자리하고 있습니다."
 STALKER_zone_flavor_14: "프랑스 중부의 농지와 오래된 마을들이 이제 아무도 예상하지 못한 방어선 뒤에 놓였습니다."
 STALKER_zone_flavor_15: "포즈난 서쪽 평원에서 구역은 폴란드와 독일을 잇는 주요 도로와 철도에 걸쳐 있습니다."
 STALKER_zone_flavor_16: "돈강 하류의 초원이 적대적으로 변했으며, 흑해 항구들과 러시아 남부 곡창 지대에 가깝습니다."
 STALKER_zone_flavor_17: "이상 현상이 이란 걸프 해안의 부셰르 원자력 발전소를 둘러싸고 있습니다."
 STALKER_zone_flavor_18: "이상 현상이 러시아 원유의 상당량을 퍼 올리는 한티만시 유전 지대 전역으로 번졌습니다."
 STALKER_zone_flavor_19: "타이미르 해안에서 구역은 북극권 너머, 노릴스크 광산에서 비행기로 하루 거리에 있습니다."
 STALKER_zone_flavor_20: "겨울 기온이 영하 50도까지 내려가는 야쿠티야 영구동토층에서는 움직이는 것은 무엇이든 수 킬로미터 밖에서도 보입니다."
 STALKER_zone_flavor_21: "콜리마강을 따라 이어진 옛 굴라크 도로들이 곧장 구역으로 이어집니다."
 STALKER_zone_flavor_22: "추콧카 땅끝에서 구역은 베링 해협 너머 알래스카를 마주 보고 있습니다."
 STALKER_zone_flavor_23: "베이징 바로 북쪽에 있는 구역은 중국의 수도와 고대 성벽에서 가까운 거리에 있습니다."
 STALKER_zone_flavor_24: "태국 중부 평야에서는 논과 고속도로변 소도시들이 방콕에서 몇 시간 거리에 놓여 있습니다."
 STALKER_zone_flavor_25: "서파푸아 고원 지대에서 구역은 그라스버그 광산, 그리고 지구상에서 지도가 가장 덜 만들어진 숲 일부와 맞닿아 있습니다."
 STALKER_zone_flavor_26: "앨리스스프링스 인근의 붉은 사막에서는 거리가 아득하고 항공으로도 구조까지 몇 시간이 걸립니다."
 STALKER_zone_flavor_27: "마른 호수 바닥이 이어지는 멍고호에서 구역은 오스트레일리아에서 발견된 가장 오래된 인류 유골 일부를 품고 있습니다."
 STALKER_zone_flavor_28: "모리타니 북부 사하라에서 구역은 주에라트로 이어지는 철광석 철도 인근에 있습니다."
 STALKER_zone_flavor_29: "나이지리아 중부 지대에서는 이미 땅을 두고 다투던 농민과 목축민이 이제 구역까지 함께 나눠 쓰게 되었습니다."
 STALKER_zone_flavor_30: "카메룬, 콩고, 중앙아프리카공화국이 만나는 열대우림에서는 어느 한 군대도 길을 장악하지 못하고 있습니다."
 STALKER_zone_flavor_31: "중국이 점유하고 인도가 영유권을 주장하는 악사이 친 고원에서 구역은 해발 5킬로미터 넘는 분쟁 국경에 걸쳐 있습니다."
 STALKER_duty_security_mandate: "[FROM.GetName]에서 듀티의 치안 위임 승인"
 STALKER_duty_security_mandate_desc: "듀티가 현지 파벌들을 이끌 때는 듀티 순찰대가 구역 출입 통제를 맡을 수 있습니다. 한 구역은 180일마다 파벌 위임을 한 번만 내줄 수 있습니다."
 STALKER_duty_security_mandate_tt: "듀티 영향력이 §G5§!, 봉쇄도가 §G10§! 오릅니다. 도적 영향력은 최대 §G15§! 줄어들고, 스토커 인구와 개발도는 각각 최대 §R5§! 줄어듭니다."
 STALKER_freedom_access_mandate: "[FROM.GetName]에서 프리덤의 접근 위임 승인"
 STALKER_freedom_access_mandate_desc: "프리덤이 현지 파벌들을 이끌 때는 독립 스토커들에게 길을 열어 줄 수 있습니다. 한 구역은 180일마다 파벌 위임을 한 번만 내줄 수 있습니다."
 STALKER_freedom_access_mandate_tt: "프리덤 영향력이 최대 §G5§!, 도적 영향력이 최대 §R5§! 오르고, 스토커 수와 개발도는 각각 최대 §G10§! 오릅니다. 봉쇄도는 최대 §R10§! 떨어집니다."
 STALKER_bandit_broker_mandate: "[FROM.GetName]의 구역 중개인과 거래"
 STALKER_bandit_broker_mandate_desc: "도적이 현지 파벌들을 이끌 때는 그들의 이동로 이용권을 사들일 수 있습니다. 한 구역은 180일마다 파벌 위임을 한 번만 내줄 수 있습니다."
 STALKER_bandit_broker_mandate_available_tt: "밀수 물량에 아티팩트가 §Y5§!개 이상 있음."
 STALKER_bandit_broker_mandate_tt: "밀수된 아티팩트 §Y5§!개를 우리 비축분으로 옮깁니다. 도적 영향력이 §R10§!, 개발도가 §G10§! 오르고, 봉쇄도는 최대 §R10§! 떨어집니다."
