 tank_designer_flame_role_disallowed: "Dodaj moduł umożliwiający zmianę na tę rolę w przypadku pojazdu typu §HBWP§!.\n\n Dodaj moduł §H Przestrzeni Transportowej §! dla oddziałów, znajdujący się w sekcji §HModułów wyposażenia i konstrukcji§! , aby umożliwić pełnienie tej roli."
 tank_designer_amphibious_role_disallowed: "Dodaj moduł umożliwiający zmianę roli na tę konkretną rolę w przypadku korzystania z §H Transportera Opancerzonego §! lub §H Śmigłowca Transportowego§!.\n\n Dodaj §HModuł przestrzeni transportowej §! dla oddziałów, znajdujący się w sekcji modułów §H wyposażenia i konstrukcji§!, aby umożliwić pełnienie tej roli."
