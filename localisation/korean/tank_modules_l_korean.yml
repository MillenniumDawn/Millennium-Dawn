 module_tank_exoskeletal_engine_gen1: "외골격 엔진"
 module_tank_exoskeletal_engine_gen1_desc: "구동계 출력을 보강하고 중하중 상태에서의 기동성을 향상시키는 외부 동력 및 작동기 골조입니다. 장갑 플랫폼의 가속과 지형 대응력을 높여 주지만, 복잡한 작동기와 첨단 소재 때문에 생산 비용과 정비 부담이 늘어납니다."
 module_tank_exoskeletal_engine_gen2: "개량형 외골격 엔진"
 module_tank_exoskeletal_engine_gen2_desc: "효율, 내구성, 제어 통합이 개선된 정련된 외골격 동력 골조로, 끊임없는 고장 없이 더 강력한 성능을 발휘할 수 있습니다. 기동성과 하중 허용치를 한층 높여 주지만, 대규모로 생산하기에는 여전히 비용이 많이 들고 자원이 많이 소요됩니다."
 super_heavy_tank_chassis_0: "1세대 중형 워커 차체"
 super_heavy_tank_chassis_0_desc: "중형 워커 차체는 일반적인 무한궤도나 바퀴식 주행 장치 대신 2족 또는 다족 이동 체계를 통합한 장갑 전투 차량의 차체를 말합니다. 일반적으로 강화된 장갑 캡슐, 출력 밀도가 높은 엔진 또는 발전기 장치, 관절형 구동 장치를 결합하여 잔해, 급경사, 연약 지반 등 기존 기갑 전력의 움직임을 제약하는 지형에서도 이동할 수 있게 합니다."
 super_heavy_tank_chassis_1: "2세대 중형 워커 차체"
 super_heavy_tank_chassis_1_desc: "중형 워커 차체는 일반적인 무한궤도나 바퀴식 주행 장치 대신 2족 또는 다족 이동 체계를 통합한 장갑 전투 차량의 차체를 말합니다. 일반적으로 강화된 장갑 캡슐, 출력 밀도가 높은 엔진 또는 발전기 장치, 관절형 구동 장치를 결합하여 잔해, 급경사, 연약 지반 등 기존 기갑 전력의 움직임을 제약하는 지형에서도 이동할 수 있게 합니다."
