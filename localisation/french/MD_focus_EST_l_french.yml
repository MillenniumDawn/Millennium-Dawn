 EST_foreign_research_idea_desc: "Si les ambitions militaires de l’Estonie sont claires, nos capacités de recherche nationales restent limitées. En favorisant les partenariats stratégiques avec nos alliés, nous pouvons accéder à des systèmes d’armes de pointe et à des technologies militaires avancées, accélérant ainsi nos efforts de modernisation de la défense."
 EST_domestic_research_idea: "Poursuivre la recherche nationale"
 EST_domestic_research_idea_desc: "Nous avons trop longtemps compté sur les fournisseurs étrangers. L’Estonie pourra rester forte en investissant davantage dans son industrie de l’armement, réduisant ainsi sa dépendance vis-à-vis des fournisseurs étrangers."
