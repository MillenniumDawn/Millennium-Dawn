 deep_state_power_decreased_10_tt: "§G딥 스테이트 권력: -10§!"
 deep_state_stage_1_tt: "§Y1단계: 군의 영향력이 눈에 띄기 시작합니다.§!"
 deep_state_let_operate_tt: "§R정보기관이 통제 없이 활동하도록 허용했습니다.§!"
 deep_state_civilian_control_tt: "§G대가를 치렀지만 민간 통제를 다시 확립했습니다.§!"
 deep_state_accept_oversight_tt: "§R군이 이제 정부 결정에 대한 공식적인 감독권을 갖습니다.§!"
 deep_state_push_back_tt: "§G장군들에게 맞서 그들의 장악력을 약화시켰습니다.§!"
 deep_state_generals_power_tt: "§R이제 알제리의 실권은 장군들이 쥐고 있습니다.§!"
 deep_state_critical_warning_tt: "§R경고: 딥 스테이트 권력이 위험 수준입니다!\n권력이 28 이상에 도달하면 군사 쿠데타가 가능해집니다!§!"
 deep_state_assessing_tt: "§Y정보기관이 딥 스테이트 영향력에 대한 보고서를 작성하고 있습니다.§!"
 deep_state_level_revealed_tt: "§Y딥 스테이트 평가 완료§!"
 deep_state_reduction_started_tt: "§Y민간 문제에 대한 군의 영향력을 줄이기 위한 노력을 시작합니다.§!"
 deep_state_expect_resistance_tt: "§R군부 세력의 저항이 예상됩니다. 안정도가 악화될 수 있습니다.§!"
 deep_state_civilian_gains_tt: "§G민간 정부가 군으로부터 일부 권한을 되찾았습니다.§!"
 deep_state_reduction_success_tt: "§G군 영향력 축소 노력이 큰 사고 없이 성공했습니다.§!"
 deep_state_reduction_backlash_tt: "§R군의 반발! 일부 성과가 되돌려졌고 안정도가 악화되었습니다.§!"
 deep_state_purge_started_tt: "§Y군 지도부에 대한 전면적인 숙청이 진행 중입니다.§!"
