 SAU_regent_abdullah: "§LCrown Prince§! §HAbdullah Takes the Reins§!"
 SAU_regent_abdullah_desc: "Crown Prince Abdullah bin Abdulaziz - long sidelined by the §LSudairi Seven§! - now becomes §Lde facto regent§!. He is 72, pious, austere, and beloved by the Bedouin tribes. He has §Hten years§! to rebuild a kingdom Fahd let drift."
 SAU_regent_arab_solidarity: "§HArab Solidarity Summit§!"
 SAU_regent_arab_solidarity_desc: "Abdullah hosts the §LArab League§! in Riyadh. §LMubarak§!, §LAssad§!, §LAbdullah of Jordan§! all attend. He proposes a §Lpan-Arab peace plan§! for Israel/Palestine. The §H2002 Initiative§! is born."
 SAU_regent_clergy_settlement: "§HSettlement with the Ulema§!"
 SAU_regent_clergy_settlement_desc: "The Council of Senior Scholars receives Abdullah at §LMecca§!. He pledges to defend the §Lsacred mosques§! and the §LWahhabi§! orthodoxy. They pledge, in return, to bless his §Hquiet reforms§!."
 SAU_regent_consensus_council: "§HForge a Consensus Government§!"
 SAU_regent_consensus_council_desc: "Abdullah convenes a §LCouncil of Ministers§! that includes representatives from every major branch of the family. No more Sudairi monopoly. Decisions will be made by §Hconsensus, not faction§!."
 SAU_regent_diplomatic_repair: "§HRepair Foreign Relations§!"
 SAU_regent_diplomatic_repair_desc: "Five years of Fahd's twilight have left Riyadh's diplomacy adrift. Relations with §LWashington§! are cool, with §LCairo§! distant, with §LIran§! frozen. Abdullah dispatches envoys in every direction."
 SAU_regent_internal_unity: "§HUnite the Royal House§!"
 SAU_regent_internal_unity_desc: "The §LSudairis§! resent his ascent. The §LJiluwi§! and §LThunayyan§! branches watch warily. Abdullah summons the senior princes to §LRiyadh§! - all factions, all generations - and demands a §Hcommon front§!."
 SAU_regent_oil_dividend: "§HThe Oil Dividend§!"
 SAU_regent_oil_dividend_desc: "Brent climbs back to §L$30§!. Then §L$40§!. The treasury fills again. Abdullah uses the windfall to §Hpay down debt§!, fund schools, and quietly stockpile reserves for what comes next."
 SAU_regent_oil_throne: "§HSecure the Oil Throne§!"
 SAU_regent_oil_throne_desc: "Saudi Aramco. Saudi Arabia. The two are inseparable. With Brent at §L$25 a barrel§!, the budget is bleeding red. Abdullah orders the petroleum ministry to §Hstabilize production§! and rebuild reserves."
 SAU_regent_riyal_anchor: "§HAnchor the Riyal§!"
 SAU_regent_riyal_anchor_desc: "The riyal has been pegged to the dollar at §L3.75§! since 1986. Abdullah orders SAMA to defend that peg with §Hevery reserve in the vault§! - the kingdom's credibility depends on it."
 SAU_regent_strategic_partner: "§HStrategic Partner Status§!"
 SAU_regent_strategic_partner_desc: "Washington reaffirms Saudi Arabia as a §Lmajor non-NATO ally§!. Arms sales resume. Intelligence sharing expands. Abdullah has rebuilt the §Hold America§! axis - but on his own terms."
 SAU_regent_succession_pact: "§HThe Succession Pact§!"
 SAU_regent_succession_pact_desc: "Abdullah, the senior princes, and the Allegiance Council reach a private agreement: when Fahd dies, §Lthere will be no fight§!. The throne passes peacefully. The pact is sealed in §Hblood and witness§!."
 SAU_regent_us_thaw: "§HThaw with Washington§!"
 SAU_regent_us_thaw_desc: "The §LDhahran§! and §LKhobar§! bombings poisoned the well. Abdullah meets quietly with the US ambassador. He cannot afford an enemy in Washington - not yet. A §Hcareful thaw§! begins."
 SAU_Regional_Policy: "A Regional Power"
 SAU_Regional_Policy_desc: "The Kingdom's first duty is to its own neighbourhood. Project Saudi power into the Levant, the Nile, Yemen and Mesopotamia, turning the lands around Arabia into a belt of clients and partners."
