 raid_type_counter_terror_drone_operations: "Operacje antyterrorystyczne z użyciem dronów"
 raid_type_counter_terror_drone_operations_desc: "Przeprowadza zarówno misje rozpoznawcze, jak i uderzeniowe przeciwko organizacji terrorystycznej z wykorzystaniem dronów."
 raid_type_drone_airfield_radar_strike: "Atak na lotnisko dronów i stacje radarowe"
 raid_type_drone_airfield_radar_strike_desc: "Przeprowadza atak dronem samobójczym na wrogie §Ylotniska§! i §Ystacje radarowe§!, osłabiając ich infrastrukturę obrony powietrznej i utrudniając operacje lotnicze."
 raid_type_drone_power_grid_strike: "Atak dronów na sieć energetyczną"
 raid_type_drone_power_grid_strike_desc: "Wypuszcza falę dronów samobójczych na wrogie §Yelektrownie§! i §Yinfrastrukturę energetyczną§!, zakłócając dostawy prądu i obciążając produkcję przemysłową."
 raid_type_drone_rocket_site_strike: "Atak dronów na stanowisko rakietowe"
 raid_type_drone_rocket_site_strike_desc: "Kieruje precyzyjne uderzenie dronów na wrogie §Ystanowiska startowe pocisków§!, uszkadzając infrastrukturę rakietową i ograniczając zdolności przeciwnika w zakresie użycia pocisków balistycznych oraz manewrujących."
 raid_category_EH_portal_raids: "Najazd na portal Chimery"
 raid_type_naval_headquarters_strike: "Uderzenie na dowództwo marynarki wojennej"
 raid_type_naval_headquarters_strike_desc: "Ataki pociskami manewrującymi na dowództwo marynarki wojennej przeciwnika, niszczące obiekt i osłabiające jego zdolności dowodzenia siłami morskimi."
 raid_type_enrichment_facility_strike: "Uderzenie w zakład wzbogacania"
 raid_type_enrichment_facility_strike_desc: "Uderzenia w zakłady wzbogacania uranu, pozbawiające cel zdolności do produkcji paliwa jądrowego oraz materiałów do budowy broni."
