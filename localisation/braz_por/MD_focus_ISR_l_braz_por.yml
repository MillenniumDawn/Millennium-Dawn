 israel_economy.217.a: "Muito lamentável."
 israel_economy.218.t: "Israel propõe a Operação Jogos Olímpicos!"
 israel_economy.218.d: "Recentemente, o governo israelense nos procurou por canais de comunicação secretos para propor uma campanha secreta de sabotagem por meio de interrupção cibernética, direcionada a instalações nucleares iranianas. Devemos apoiar esta operação?"
 israel_economy.218.a: "Especialistas cibernéticos serão enviados."
 israel_economy.218.b: "Não participaremos disto."
 israel_economy.219.t: "Os EUA querem participar!"
 israel_economy.219.d: "Os EUA participarão da Operação Jogos Olímpicos."
 israel_economy.219.a: "Ótimo!"
 israel_economy.220.t: "Os EUA não participarão."
 israel_economy.220.d: "Eles dizem que isso aumentaria drasticamente as tensões, das quais não querem fazer parte."
 israel_economy.220.a: "Certo..."
