 EGY_kifaya_tolerated_opinion: "Tolerated Kifaya"
 EGY_nour_prosecuted_opinion: "Prosecuted Ayman Nour"
 EGY_emergency_courts_opinion: "Tried Civilians in Emergency Courts"
 EGY_pardon_liberals_opinion: "Pardoned Liberal Dissidents"
 EGY_sharm_summit_opinion: "Hosted at Sharm el-Sheikh"
 egypt_mubarak.1.t: "Kifaya Takes to the Streets"
 egypt_mubarak.1.d: "The Egyptian Movement for Change, known by its slogan Kifaya (\"Enough\"), is demonstrating in central Cairo against another Mubarak term and against Gamal's succession. The crowds are small but loud, and foreign cameras are watching."
 egypt_mubarak.1.a: "Let them protest."
 egypt_mubarak.1.b: "Disperse the crowds."
 egypt_mubarak.2.t: "The Ayman Nour Affair"
 egypt_mubarak.2.d: "Ayman Nour, leader of the liberal Ghad Party, finished a distant second in the presidential election. Prosecutors say he forged signatures to register his party, and his supporters call the case revenge."
 egypt_mubarak.2.a: "Prosecute him."
 egypt_mubarak.2.b: "Let the case drop."
 egypt_mubarak.3.t: "The Brotherhood's 88"
 egypt_mubarak.3.d: "Despite arrests and closed polling stations, independents tied to the Muslim Brotherhood have won 88 seats in parliament, a fifth of the chamber. The banned movement is now the largest opposition bloc."
 egypt_mubarak.3.a: "Accept the result."
 egypt_mubarak.3.b: "Pressure the courts to annul seats."
 EGY_state_project_tt: "This is a §Ystate project§!.\nWhen this finishes, the game rolls a dice.\nYou get §YONE§! of the three results below.\nLess §Ycorruption§! gives you a better chance.\n"
 EGY_state_project_full_tt: "§GBest result§! (§G[?project_full|0]%§! chance): you get it all now."
 EGY_state_project_partial_tt: "§YSlow result§! (§Y[?project_partial|0]%§! chance): you get it in two parts."
 EGY_state_project_troubled_tt: "§RBad result§! (§R[?project_troubled|0]%§! chance): you get little or nothing."
 EGY_state_project_now_tt: "Now:"
 EGY_state_project_no_effect_tt: "Now: nothing."
 EGY_state_project_second_half_tt: "In 6 months:"
 EGY_state_project_rescue_tt: "In 1 to 3 years, you can pay money to fix it and get:"
 EGY_state_project_toshka_tt: "In 1 to 3 years, you can pay money to finish it."
 egypt_mubarak.4.t: "Toshka Falls Short"
 egypt_mubarak.4.d: "The Mubarak pumping station is running and the Sheikh Zayed canal carries Nile water into the desert, but investors have been slow to take up the reclaimed plots. Farms are few, settlers are fewer, and critics call the scheme a showpiece that was announced faster than it was built."
 egypt_mubarak.4.a: "Fund the reclamation by decree."
 egypt_mubarak.4.b: "Let the ministries absorb the criticism."
 egypt_mubarak.5.t: "A Programme Falls Behind"
 egypt_mubarak.5.d_partial: "[EGY_state_project_name] is being implemented, but only in part. Ministries have trimmed the scope, officials have slowed the paperwork, and the rest of the programme is expected to follow in about six months."
 egypt_mubarak.5.d_troubled: "[EGY_state_project_name] has run into trouble. Delays in the ministries, disputes among contractors and uneven enforcement mean that only a fraction of the expected results has been delivered so far."
 egypt_mubarak.5.a: "We will manage."
 egypt_mubarak.6.t: "Costs Overrun"
 egypt_mubarak.6.d: "The ministry responsible for [EGY_state_project_name] reports that costs have overrun its budget. Contractors are demanding revised payments, and officials warn that the programme will stall unless the treasury covers the gap."
 egypt_mubarak.6.a: "Cover the overruns."
 egypt_mubarak.6.b: "Write the programme off."
 egypt_mubarak.7.t: "Bombing in the Sinai"
 egypt_mubarak.7.d: "Bombs have torn through a resort on the Red Sea coast, killing tourists and Egyptian workers. The attackers came from networks among the Bedouin of North Sinai."
 egypt_mubarak.7.a: "Crack down on the North Sinai tribes."
 egypt_mubarak.7.b: "Target the cells only."
 egypt_mubarak.8.t: "The Judges' Club Revolt"
 egypt_mubarak.8.d: "Senior judges who exposed fraud in the last elections face disciplinary hearings, and the Judges' Club has called for independence from the Justice Ministry. Protesters gather outside the High Court in solidarity."
 egypt_mubarak.8.a: "Discipline the judges."
 egypt_mubarak.8.b: "Negotiate with the Judges' Club."
 egypt_mubarak.9.t: "The Entebbe Agreement"
 egypt_mubarak.9.d: "Ethiopia, Uganda, Rwanda and Tanzania have signed a framework agreement in Entebbe on sharing the Nile, without Egypt and Sudan. Our historic rights to the river are openly challenged."
 egypt_mubarak.9.a: "Denounce the framework."
 egypt_mubarak.9.b: "Call for talks."
 egypt_mubarak.10.t: "The Rafah Wall Breached"
 egypt_mubarak.10.d: "Militants have blown holes in the border wall at Rafah, and hundreds of thousands of Gazans pour into Egyptian Sinai to buy food, fuel and goods denied to them by the blockade."
 egypt_mubarak.10.a: "Close the gap."
 egypt_mubarak.10.b: "Let the crowds shop."
 egypt_mubarak.11.t: "A Tycoon in the Dock"
 egypt_mubarak.11.d: "A businessman close to the ruling party is accused of rigging a state contract. The press, the opposition and even some ministers demand that he face trial."
 egypt_mubarak.11.a: "Protect him."
 egypt_mubarak.11.b: "Sacrifice him."
 egypt_mubarak.12.t: "The Ferry Disaster"
 egypt_mubarak.12.d: "The ferry al-Salam Boccaccio 98 has sunk in the Red Sea with more than a thousand people aboard. The overloaded, aging ship belonged to a businessman with a seat in the upper house of parliament."
 egypt_mubarak.12.a: "Investigate the owner."
 egypt_mubarak.12.b: "Bury the matter."
 egypt_mubarak.13.t: "The Army Answers"
 egypt_mubarak.13.d_accepts: "The generals have studied the NDP's choice. Field Marshal Tantawi lets it be known that the armed forces will respect the constitution, as long as their place in the state is respected too."
 egypt_mubarak.13.d_refuses: "The generals have studied the NDP's choice and do not like it. Senior officers make clear that the armed forces will not salute a civilian heir who never served."
 egypt_mubarak.13.a: "The army falls in line."
 egypt_mubarak.13.b: "The generals dig in."
 egypt_mubarak.14.t: "Tycoon Pushback"
 egypt_mubarak.14.d: "The businessmen targeted by the Competition Authority are lobbying ministers and threatening to move their capital abroad. The authority asks whether it still has the government's backing."
 egypt_mubarak.14.a: "Hold firm."
 egypt_mubarak.14.b: "Settle quietly."
 EGY_military_cooperation: "Military Cooperation"
 EGY_military_cooperation_desc: "Joint exercises, arms purchases and foreign advisors tie our armed forces to their suppliers."
 EGY_operation_bright_star_exercise: "Bright Star Exercise"
 EGY_operation_bright_star_exercise_desc: "Every other autumn, brigades from both armies maneuver across the Western Desert while Apaches and F-16s fly overhead. Our officers watch American staff work up close, and if our land grand doctrine matches the United States', they also gain land doctrine mastery."
 EGY_buy_russian_fighters: "Buy Russian Fighters"
 EGY_buy_russian_fighters_desc: "Mikoyan offers the MiG-29M, a modern multirole Fulcrum with longer range and a glass cockpit. Our air force still flies MiG-21s from the Nasser era, so Russian engines hold no secrets for our mechanics. A Russian fighter wing frees us from the veto of the United States Congress."
 EGY_invite_russian_advisors: "Invite Russian Advisors"
 EGY_invite_russian_advisors_desc: "Decades after Sadat expelled the Soviet advisors in 1972, Russian officers return to Cairo. They know our Soviet-era equipment better than anyone, and they can teach our staff to keep it flying and fighting."
 EGY_license_chinese_trainers: "License Chinese Trainers"
 EGY_license_chinese_trainers_desc: "Cadets at the Air Academy in Bilbeis learn to fly on the Hongdu K-8E, assembled under license by the Arab Organization for Industrialization at Helwan. A wider license puts more of the trainer's production in Egyptian hands and keeps the Helwan workshops busy."
 EGY_buy_chinese_fighters: "Buy Chinese Fighters"
 EGY_buy_chinese_fighters_desc: "Shenyang offers the J-11, a Chinese-built derivative of the Su-27 with the range to patrol the Red Sea and the Mediterranean. Beijing sets no conditions on human rights and asks only to be paid."
 EGY_pilot_of_october: "Pilot of October"
 EGY_pilot_of_october_desc: "Mubarak commanded the Egyptian Air Force in the October War of 1973. That record eases our air doctrine research and keeps the armed forces loyal to their former commander."
 egypt_mubarak.15.t: "Egypt Requests F-16 Block 52s"
 egypt_mubarak.15.d: "Cairo asks Washington to release twenty F-16C/D Block 52 fighters, a package worth about 3.2 billion dollars. Egypt wants the jets paid through Foreign Military Financing, the annual aid that has armed its forces since the Camp David Accords, and the Pentagon sees a loyal partner keeping its air force American."
 egypt_mubarak.15.a: "Pay through military financing."
 egypt_mubarak.15.b: "Ask Egypt to pay for the jets."
 egypt_mubarak.16.t: "The Block 52s Touch Down"
 egypt_mubarak.16.d: "The first of the new Block 52 fighters touch down in Egypt, still carrying the ferry tanks from their flight across the Atlantic. Washington has paid for them through military financing, continuing three decades of American supply to our air force."
 egypt_mubarak.16.a: "Welcome them home."
 egypt_mubarak.17.t: "Washington Asks for Payment"
 egypt_mubarak.17.d: "The State Department will release the twenty Block 52 fighters only if we pay the 3.2 billion dollar price from our own budget. The Ministry of Finance warns that the bill would strain a treasury already stretched by bread and fuel subsidies."
 egypt_mubarak.17.a: "Pay the full price."
 egypt_mubarak.17.b: "Refuse to pay."
 egypt_mubarak.18.t: "Egypt Refuses to Pay"
 egypt_mubarak.18.d: "Cairo has declined to pay for the F-16 order and insists that military financing should cover it, as it always has. The State Department must decide whether keeping the Egyptian Air Force American is worth 3.2 billion dollars."
 egypt_mubarak.18.a: "Deliver the jets regardless."
 egypt_mubarak.18.b: "Cancel the order."
 egypt_mubarak.19.t: "Washington Cancels the F-16 Order"
 egypt_mubarak.19.d: "Washington has canceled the Block 52 order. Squadron commanders who expected new jets will keep flying worn airframes, and in the officers' clubs the talk turns to how little the Americans value their partner."
 egypt_mubarak.19.a: "A bitter setback."
 egypt_mubarak.20.t: "Egypt Seeks Russian Arms"
 egypt_mubarak.20.d: "Cairo has turned away from its American supplier and asks Moscow for fighters, advisors and spare parts. Russia lost Egypt when Sadat expelled the Soviet advisors in 1972 and now has a chance to return to the Nile."
 egypt_mubarak.20.a: "Welcome Egypt back."
 egypt_mubarak.20.b: "Decline for now."
 egypt_mubarak.21.t: "Moscow Agrees to Supply Egypt"
 egypt_mubarak.21.d: "Russia has accepted our request. Moscow offers fighters, advisors and spare parts, and for the first time in a generation Egyptian officers will train on new Russian equipment."
 egypt_mubarak.21.a: "A new partnership."
 egypt_mubarak.22.t: "Moscow Declines"
 egypt_mubarak.22.d: "Russia has turned down our request, unwilling to quarrel with Washington over a single customer. We have lost American goodwill without gaining a new patron, and critics in Cairo call the break a blunder."
 egypt_mubarak.22.a: "A diplomatic embarrassment."
 egypt_mubarak.23.t: "Egypt Seeks Chinese Arms"
 egypt_mubarak.23.d: "Cairo has turned away from its American supplier and asks Beijing for trainers, fighters and arms. China has sold Egypt K-8 trainers for years and sees a chance to win a larger share of the biggest army in the Arab world."
 egypt_mubarak.23.a: "Welcome Egypt as a customer."
 egypt_mubarak.23.b: "Decline for now."
 egypt_mubarak.24.t: "Beijing Agrees to Supply Egypt"
 egypt_mubarak.24.d: "China has accepted our request. Beijing offers licensed production of trainers and sales of fighters on easy terms, with no lectures on human rights attached."
 egypt_mubarak.24.a: "A new partnership."
 egypt_mubarak.25.t: "Beijing Declines"
 egypt_mubarak.25.d: "China has turned down our request, preferring to avoid a quarrel with Washington over a single customer. We have strained our ties with the Americans and gained nothing in return."
 egypt_mubarak.25.a: "A diplomatic embarrassment."
 EGY_decree_authority_cost_3: "3 Authority"
 EGY_decree_authority_cost_3_blocked: "§R3§! Authority"
 EGY_decree_authority_cost_3_tooltip: "This decree costs 3 §Ypresidential authority§!"
 EGY_decree_authority_cost_5: "5 Authority"
 EGY_decree_authority_cost_5_blocked: "§R5§! Authority"
 EGY_decree_authority_cost_5_tooltip: "This decree costs 5 §Ypresidential authority§!"
 EGY_decree_cabinet_reshuffle: "Cabinet Reshuffle"
 EGY_decree_cabinet_reshuffle_desc: "In July 2004 Mubarak replaced Atef Ebeid with Ahmed Nazif and filled the economic ministries with businessmen. A reshuffle lets the President choose which faction runs the government, the reformers around Gamal or the veterans of the old regime."
 EGY_decree_price_controls: "Price Controls on Staples"
 EGY_decree_price_controls_desc: "The Ministry of Supply caps the prices of sugar, oil, rice and flour and sends inspectors into the markets. Shopkeepers complain, but families on ration cards can feed themselves for another season."
 EGY_decree_emergency_courts: "Refer to the Emergency Courts"
 EGY_decree_emergency_courts_desc: "Under the Emergency Law the President can send civilians to the Emergency State Security Courts. Their verdicts cannot be appealed and take effect only when he ratifies them. A new round of referrals breaks up Brotherhood networks, but Washington objects to the trials."
 EGY_decree_presidential_pardon: "Presidential Pardon"
 EGY_decree_presidential_pardon_desc: "Article 149 of the constitution gives the President the right to pardon. A well-timed release on a national holiday calms the public, and we choose which prisoners go free."
 EGY_decree_desert_land: "Allocate Desert Land to Developers"
 EGY_decree_desert_land_desc: "The Ministry of Housing sells desert land around Cairo to developers at nominal prices, as it did when Talaat Moustafa received 8,000 feddans for Madinaty in 2005. The sales bring in money and win over the businessmen of the New Guard, but they invite charges of corruption."
 EGY_decree_army_bakes: "Order the Army to Bake"
 EGY_decree_army_bakes_desc: "In March 2008, after people died in the queues outside subsidized bakeries, Mubarak ordered the army to bake and distribute bread. Military bakeries can end a shortage within days, but the generals resent being used to fix the government's mistakes."
 EGY_decree_raise_wages: "Raise Public Wages"
 EGY_decree_raise_wages_desc: "On May Day 2008 Mubarak announced a 30 percent bonus for six million state employees. A pay rise buys calm in the ministries and factories, but the treasury pays for it."
 EGY_decree_sharm_summit: "Host a Sharm Summit"
 EGY_decree_sharm_summit_desc: "Sharm el-Sheikh has hosted Arab and international leaders since the 1990s, from the 2005 meeting of Sharon and Abbas to the Gaza summits. Inviting a neighbor to the Red Sea resort raises Cairo's influence over its government."
 EGY_decree_renew_emergency_law: "Renew the Emergency Law"
 EGY_decree_renew_emergency_law_desc: "The Emergency Law has been in force since the assassination of Sadat in 1981, and the People's Assembly renews it every few years, as it did in 2003, 2006, 2008 and 2010. Each renewal keeps the law for two years. If we do not renew it in time, it lapses."
 EGY_emergency_law_lapse: "The Emergency Law Expires"
 EGY_emergency_law_lapse_desc: "The current extension of the Emergency Law is running out. Unless we renew it through a Presidential Decree, the state of emergency ends and the security services lose their special powers."
 EGY_rally_the_ndp_machine: "Rally the NDP Machine"
 EGY_rally_the_ndp_machine_desc: "Gamal Mubarak's Policies Secretariat coordinates the National Democratic Party's campaign work. Its patronage networks of local notables, state employees and party offices turn out the vote."
 EGY_the_2005_parliamentary_elections: "The 2005 Parliamentary Elections"
 EGY_the_2005_parliamentary_elections_desc: "The People's Assembly vote of November and December 2005 runs in three rounds under judicial supervision. The NDP must hold its two-thirds majority against a strong showing by Brotherhood-backed independents."
 EGY_pledge_jobs: "Pledge: 4.5 Million Jobs"
 EGY_pledge_jobs_desc: "The 2005 programme promised four and a half million new jobs within the presidential term. Every year a million young Egyptians enter the labor market, and the graduates queuing for state posts will judge the President by this number."
 EGY_pledge_factories: "Pledge: A Thousand Factories"
 EGY_pledge_factories_desc: "Mubarak promised a thousand new factories by the end of his fifth term. The new industrial zones around Cairo and in Upper Egypt must fill up with plants if the promise is to mean anything."
 EGY_pledge_homes: "Pledge: Half a Million Homes"
 EGY_pledge_homes_desc: "The National Housing Programme promised 500,000 units for low-income families over six years. Young couples who cannot afford to marry without a flat are waiting for the keys."
 EGY_pledge_feddans: "Pledge: A Million Feddans"
 EGY_pledge_feddans_desc: "The campaign promised to reclaim a million feddans of desert for farming. Most of that land lies at Toshka in the Western Desert and along the canals of northern Sinai."
 EGY_pledge_end_the_emergency: "Pledge: End the State of Emergency"
 EGY_pledge_end_the_emergency_desc: "Mubarak promised to replace the Emergency Law, in force since 1981, with a counter-terrorism law. Opposition parties, judges and Washington will all watch whether he keeps his word."
 EGY_pledge_jobs_tt: "Unemployment is below §Y[?EGY_pledge_jobs_target|%]§! (currently §Y[?total_unemployed_percentage_display|%]§!)"
 EGY_pledge_factories_tt: "We have at least §Y[?EGY_pledge_factories_target|0]§! civilian factories (currently §Y[?num_of_civilian_factories|0]§!)"
 EGY_pledge_homes_tt: "Completed §Y5§! housing tranches through §Y$EGY_build_housing_tranche$§! (currently §Y[?EGY_homes_built|0]§!)"
 EGY_pledge_emergency_broken_tt: "§RThe pledge to end the state of emergency is broken:§!"
 EGY_pledge_emergency_kept_tt: "§GThe pledge to end the state of emergency is kept:§!"
 EGY_build_housing_tranche: "Build a Housing Tranche"
 EGY_build_housing_tranche_desc: "The National Housing Programme hands land and subsidized loans to developers who build flats for low-income families in the new cities. Each tranche delivers 100,000 units."
 EGY_homes_built_below_5_tt: "Fewer than §Y5§! housing tranches have been completed"
 EGY_housing_tranche_done_tt: "Adds §G100,000§! homes to the National Housing Programme"
 EGY_nile_valley: "The Nile Valley"
 EGY_nile_valley_desc: "Egypt and Sudan share the Nile, and with it a long list of unfinished projects: canals, roads and farms that would bind the two countries together."
 EGY_revive_the_jonglei_canal: "Revive the Jonglei Canal"
 EGY_revive_the_jonglei_canal_desc: "In 1984 SPLA fighters attacked the Jonglei construction camp, and the giant bucket-wheel excavator still stands rusting in the swamp, 260 kilometers into a 360-kilometer dig. Finished, the canal would carry the White Nile past the Sudd and add billions of cubic meters of water to the river each year. With the south at peace, Cairo and Khartoum can finish what they started."
 SUD_request_egyptian_arms: "Request Egyptian Arms"
 SUD_request_egyptian_arms_desc: "The war in the south devours rifles and trucks faster than we can replace them. Cairo has declared for a united Sudan, and its arsenals hold weapons it no longer needs. We ask our brothers in Egypt to share them."
 SUD_request_egyptian_attache: "Request an Egyptian Military Attaché"
 SUD_request_egyptian_attache_desc: "Egyptian staff officers trained in American methods could help our general staff plan the campaigns in the south. We ask Cairo to post a military attaché to Khartoum, a quiet step that tells the SPLA where Egypt stands."
 SUD_request_egyptian_volunteers: "Request Egyptian Volunteers"
 SUD_request_egyptian_volunteers_desc: "Arms alone will not end the war. We ask Egypt to ready units that can deploy to Sudan, whether to hold a ceasefire line or to stand beside our army in the south."
 egypt_mubarak.26.t: "Egypt Proposes the Four Freedoms"
 egypt_mubarak.26.d: "Cairo offers an agreement that would let Sudanese and Egyptian citizens move, live, work and own property freely in both countries. Many Sudanese already live and work in Cairo, and the pact would bind the two halves of the Nile Valley closer than at any time since independence."
 egypt_mubarak.26.a: "Sign the agreement."
 egypt_mubarak.26.b: "Decline the offer."
 egypt_mubarak.27.t: "Sudan Signs the Four Freedoms"
 egypt_mubarak.27.d: "Khartoum has signed the Four Freedoms Agreement. Egyptians may now live, work and own property in Sudan, and engineers in both capitals are already dusting off the plans for shared projects on the Nile."
 egypt_mubarak.27.a: "Brothers of the Nile."
 egypt_mubarak.28.t: "Sudan Rejects the Four Freedoms"
 egypt_mubarak.28.d: "Khartoum has turned down the Four Freedoms Agreement. Bashir's ministers fear that open borders would let Egyptian money and Egyptian influence flood into Sudan."
 egypt_mubarak.28.a: "Their loss."
 egypt_mubarak.29.t: "Egypt Offers to Back Khartoum"
 egypt_mubarak.29.d: "Cairo has declared its support for a united Sudan and offers a shipment of Egyptian rifles for our army. Egyptian officials add that further requests for help will be heard, but Garang's SPLA and its backers will read the offer as a hostile act."
 egypt_mubarak.29.a: "We welcome our friends in Cairo."
 egypt_mubarak.29.b: "Sudan does not need Egyptian arms."
 egypt_mubarak.30.t: "Sudan Requests Arms"
 egypt_mubarak.30.d: "[SUD.GetNameDef] asks for more rifles and trucks. Its columns in the south are worn down by ambushes and the long rainy season, and Khartoum's own arsenals are running thin."
 egypt_mubarak.30.a: "Send the shipment."
 egypt_mubarak.30.b: "Refuse the request."
 egypt_mubarak.31.t: "Sudan Requests a Military Attaché"
 egypt_mubarak.31.d: "[SUD.GetNameDef] asks us to post a military attaché to Khartoum to advise its general staff. An Egyptian officer at Sudanese headquarters would tell everyone, the SPLA included, where Cairo stands."
 egypt_mubarak.31.a: "Post an attaché."
 egypt_mubarak.31.b: "Refuse the request."
 egypt_mubarak.32.t: "Sudan Requests Volunteers"
 egypt_mubarak.32.d: "[SUD.GetNameDef] asks us to prepare Egyptian units for deployment to Sudan. Sending soldiers south of Wadi Halfa would be the boldest step Cairo has taken in Sudan since independence."
 egypt_mubarak.32.a: "Prepare an expeditionary force."
 egypt_mubarak.32.b: "Refuse the request."
 egypt_mubarak.33.t: "Cairo Grants Our Request"
 egypt_mubarak.33.d: "Egypt has agreed to our request. The message from Cairo is warm, and our envoys report that the Egyptians want Khartoum to know it does not stand alone."
 egypt_mubarak.33.a: "Thank Cairo."
 egypt_mubarak.34.t: "Cairo Refuses Our Request"
 egypt_mubarak.34.d: "Egypt has turned down our request. For all the talk of brotherhood along the Nile, Cairo will not pay the price of our war."
 egypt_mubarak.34.a: "We will remember this."
 egypt_mubarak.35.t: "The Egyptian-Libyan Peace Plan"
 egypt_mubarak.35.d: "Envoys from Cairo and Tripoli bring Khartoum the nine-point plan of the Joint Libyan-Egyptian Initiative: a ceasefire, a transitional government of national unity and a national constitutional conference, all within a united Sudan. Accepting it would bring the end of the war closer, but it would give Egypt and Libya a hand in whatever comes after. The plan goes to the SPLM only once Khartoum has answered."
 egypt_mubarak.35.t_alone: "The Egyptian Peace Plan"
 egypt_mubarak.35.d_alone: "Tripoli has stayed out, but envoys from Cairo still bring Khartoum the nine-point plan of the Egyptian initiative: a ceasefire, a transitional government of national unity and a national constitutional conference, all within a united Sudan. Without Libya the plan carries less weight, and accepting it would give Egypt alone a hand in whatever comes after. The plan goes to the SPLM only once Khartoum has answered."
 egypt_mubarak.35.a: "Accept the plan."
 egypt_mubarak.35.b: "Reject the plan."
 egypt_mubarak.36.t: "The Joint Initiative Reaches the SPLM"
 egypt_mubarak.36.d: "[SUD.GetNameDef] has accepted the Egyptian-Libyan plan, and the envoys from Cairo and Tripoli now bring it to the leadership of the SPLM and the SPLA. John Garang has long objected that a united Sudan leaves no room for self-determination or for the separation of religion and state. Accepting would end the war sooner, but only on terms Khartoum has already approved."
 egypt_mubarak.36.t_alone: "The Egyptian Initiative Reaches the SPLM"
 egypt_mubarak.36.d_alone: "[SUD.GetNameDef] has accepted the Egyptian plan, and the envoys from Cairo now bring it to the leadership of the SPLM and the SPLA. John Garang has long objected that a united Sudan leaves no room for self-determination or for the separation of religion and state. Accepting would end the war sooner, but only on terms Khartoum has already approved."
 egypt_mubarak.36.a: "Accept the plan, with reservations."
 egypt_mubarak.36.b: "Reject the plan."
 egypt_mubarak.37.t: "The Joint Initiative Reaches the SPLM"
 egypt_mubarak.37.d: "[SUD.GetNameDef] has rejected the Egyptian-Libyan plan, and the envoys from Cairo and Tripoli now bring it to the leadership of the SPLM and the SPLA. John Garang has long objected that a united Sudan leaves no room for self-determination or for the separation of religion and state. Accepting would show the movement as the side willing to talk, and would earn the sponsors' goodwill."
 egypt_mubarak.37.t_alone: "The Egyptian Initiative Reaches the SPLM"
 egypt_mubarak.37.d_alone: "[SUD.GetNameDef] has rejected the Egyptian plan, and the envoys from Cairo now bring it to the leadership of the SPLM and the SPLA. John Garang has long objected that a united Sudan leaves no room for self-determination or for the separation of religion and state. Accepting would show the movement as the side willing to talk, and would earn Cairo's goodwill."
 egypt_mubarak.37.a: "Accept the plan, with reservations."
 egypt_mubarak.37.b: "Reject the plan."
 egypt_mubarak.38.t: "Egypt Offers Peacekeepers for Darfur"
 egypt_mubarak.38.d: "Cairo offers to send Egyptian battalions to Darfur under the African Union and United Nations mission. Soldiers from a friendly neighbor would be far easier to accept than the Western troops some in the Security Council want to send."
 egypt_mubarak.38.a: "Welcome the Egyptian contingent."
 egypt_mubarak.38.b: "Keep foreign troops out of Darfur."
 egypt_mubarak.39.t: "Khartoum Welcomes Our Contingent"
 egypt_mubarak.39.d: "[SUD.GetNameDef] has accepted our battalions in Darfur. The first Egyptian soldiers in blue helmets fly into the region, and the talks with the rebels gain fresh momentum."
 egypt_mubarak.39.a: "Our soldiers will serve with honor."
 egypt_mubarak.40.t: "Khartoum Turns Away Our Contingent"
 egypt_mubarak.40.d: "[SUD.GetNameDef] has refused to let our battalions operate in Darfur. The contingent we trained and equipped will stay at home, and the war in Darfur goes on without us."
 egypt_mubarak.40.a: "A wasted effort."
 egypt_mubarak.41.t: "Khartoum Accepts Our Support"
 egypt_mubarak.41.d: "The government of Omar al-Bashir has accepted Egyptian backing for a united Sudan. Rifles are on their way to Khartoum, and Cairo's standing there grows. In the south, Garang's SPLA takes note."
 egypt_mubarak.41.a: "Khartoum is a friend on the Nile."
 egypt_mubarak.42.t: "Khartoum Declines Our Support"
 egypt_mubarak.42.d: "Khartoum has turned down the Egyptian offer of arms and political backing. Bashir's government prefers to fight the SPLA without a patron whose interest in the Nile is so plain."
 egypt_mubarak.42.a: "A diplomatic setback."
 egypt_mubarak.43.t: "Egypt Proposes a Joint Plan for Sudan"
 egypt_mubarak.43.d: "Cairo asks Tripoli to join the Joint Libyan-Egyptian Initiative for Sudan: a ceasefire, a transitional government and a national conference. Joining would commit Libyan officers and volunteers to the effort and give Libya a say in Sudan's future."
 egypt_mubarak.43.a: "Libya will join the initiative."
 egypt_mubarak.43.b: "This is not our concern."
 egypt_mubarak.44.t: "Tripoli Joins the Initiative"
 egypt_mubarak.44.d: "Libya has agreed to share the Joint Libyan-Egyptian Initiative. Egyptian and Libyan officers prepare to deploy to Sudan together, and the joint peace plan is delivered first to Khartoum and then to the SPLM."
 egypt_mubarak.44.a: "Cairo and Tripoli speak with one voice."
 egypt_mubarak.45.t: "Tripoli Turns Down the Initiative"
 egypt_mubarak.45.d: "Libya has declined to take part in the joint plan for Sudan. Without Tripoli, Egypt cannot present the initiative as an Arab and African effort. Cairo can shelve the plan, or carry it to Khartoum and the SPLM alone and hope that Egyptian weight is enough to make both sides listen."
 egypt_mubarak.45.a: "Libya goes its own way."
 egypt_mubarak.45.b: "Egypt will carry the plan alone."
 egypt_mubarak.46.t: "Both Sides Accept the Initiative"
 egypt_mubarak.46.d: "[SUD.GetNameDef] and [SSU.GetNameDef] have both accepted the Joint Libyan-Egyptian Initiative, the first with enthusiasm and the second with reservations on self-determination and the role of religion in the state. Cairo and Tripoli can now claim a diplomatic success, and the war in Sudan moves toward its end."
 egypt_mubarak.46.d_alone: "[SUD.GetNameDef] and [SSU.GetNameDef] have both accepted the Egyptian initiative, the first with enthusiasm and the second with reservations on self-determination and the role of religion in the state. Cairo can claim the diplomatic success for itself, and the war in Sudan moves toward its end."
 egypt_mubarak.46.a: "The initiative is a success."
 egypt_mubarak.47.t: "The SPLM Rejects the Initiative"
 egypt_mubarak.47.d: "[SUD.GetNameDef] accepted the Joint Libyan-Egyptian Initiative, but the SPLM refused to give up its demand for self-determination in the south. Cairo and Tripoli will now stand with Khartoum, which has met the plan in good faith, and will not lend support to the SPLA."
 egypt_mubarak.47.d_alone: "[SUD.GetNameDef] accepted the Egyptian initiative, but the SPLM refused to give up its demand for self-determination in the south. Cairo will now stand with Khartoum, which has met the plan in good faith, and will not lend support to the SPLA."
 egypt_mubarak.47.a: "We stand with Khartoum."
 egypt_mubarak.48.t: "Khartoum Rejects the Initiative"
 egypt_mubarak.48.d: "[SSU.GetNameDef] accepted the Joint Libyan-Egyptian Initiative, but [SUD.GetNameDef] refused to negotiate. Cairo and Tripoli will now stand with the SPLM, which has shown itself willing to talk, and will not lend support to Khartoum."
 egypt_mubarak.48.d_alone: "[SSU.GetNameDef] accepted the Egyptian initiative, but [SUD.GetNameDef] refused to negotiate. Cairo will now stand with the SPLM, which has shown itself willing to talk, and will not lend support to Khartoum."
 egypt_mubarak.48.a: "We stand with the SPLM."
 egypt_mubarak.49.t: "Both Sides Refuse"
 egypt_mubarak.49.d: "Neither [SUD.GetNameDef] nor [SSU.GetNameDef] will accept the Joint Libyan-Egyptian Initiative, and the war goes on. Cairo must now decide how to answer. It can join the Kenyan-hosted IGAD talks, settle the status of Hala'ib, arm the rebels of Darfur, or settle accounts with the Islamist government that was blamed for the 1995 attempt on President Mubarak in Addis Ababa. Tripoli will then choose whether to stand with Egypt or go its own way."
 egypt_mubarak.49.d_alone: "Neither [SUD.GetNameDef] nor [SSU.GetNameDef] will accept the Egyptian initiative, and the war goes on. Cairo must now decide how to answer. It can join the Kenyan-hosted IGAD talks, settle the status of Hala'ib, arm the rebels of Darfur, or settle accounts with the Islamist government that was blamed for the 1995 attempt on President Mubarak in Addis Ababa."
 egypt_mubarak.49.a: "Seek a seat at the Kenyan talks."
 egypt_mubarak.49.b: "Settle the Hala'ib question."
 egypt_mubarak.49.c: "Arm the Darfur rebels."
 egypt_mubarak.49.e: "Settle accounts with Khartoum."
 egypt_mubarak.50.t: "The Constitutional Conference"
 egypt_mubarak.50.d: "With both sides at the table, the Joint Libyan-Egyptian Initiative convenes its national constitutional conference. Khartoum insists on a united Sudan under a single constitution, while the SPLM presses for self-determination for the south. Cairo and Tripoli must decide which principle their mediation will favor."
 egypt_mubarak.50.d_alone: "With both sides at the table, the Egyptian initiative convenes its national constitutional conference. Khartoum insists on a united Sudan under a single constitution, while the SPLM presses for self-determination for the south. Cairo must decide which principle its mediation will favor."
 egypt_mubarak.50.a: "A united Sudan above all."
 egypt_mubarak.50.b: "Guarantee the south's self-government."
 egypt_mubarak.51.t: "Cairo and Tripoli Stand With Us"
 egypt_mubarak.51.d: "Egypt and Libya have judged our acceptance of the Joint Libyan-Egyptian Initiative to be made in good faith and will support our cause against the side that refused. Volunteers and political backing from both capitals are on their way."
 egypt_mubarak.51.t_alone: "Cairo Stands With Us"
 egypt_mubarak.51.d_alone: "Egypt has judged our acceptance of its initiative to be made in good faith and will support our cause against the side that refused. Egyptian volunteers and political backing are on their way."
 egypt_mubarak.51.a: "Our friends will not be forgotten."
 egypt_mubarak.52.t: "Egypt and Libya Take Sides Against Us"
 egypt_mubarak.52.d: "Because we refused the Joint Libyan-Egyptian Initiative, Cairo and Tripoli have chosen to back our enemy in the war. They will no longer send volunteers to our side, and their influence will work against us."
 egypt_mubarak.52.t_alone: "Egypt Takes Sides Against Us"
 egypt_mubarak.52.d_alone: "Because we refused the Egyptian initiative, Cairo has chosen to back our enemy in the war. Egypt will no longer send volunteers to our side, and its influence will work against us."
 egypt_mubarak.52.a: "They will regret this."
 egypt_mubarak.53.t: "Cairo Proposes a Response"
 egypt_mubarak.53.d_igad: "Neither Sudanese party accepted the initiative. Egypt proposes that both capitals seek a place in the peace talks that the Intergovernmental Authority on Development is hosting in Kenya, and press for a settlement from within that process. The talks are backed by Western governments, which Tripoli distrusts."
 egypt_mubarak.53.d_halaib: "Neither Sudanese party accepted the initiative. Egypt has begun to administer the disputed Hala'ib Triangle as Egyptian territory and asks Libya to recognize the arrangement. Khartoum is certain to protest."
 egypt_mubarak.53.d_darfur: "Neither Sudanese party accepted the initiative. Egypt has begun to arm the rebel movements of Darfur and asks Libya to do the same. Libya already has ties to several of the groups, and joint support would keep Khartoum fighting on its western front."
 egypt_mubarak.53.d_war: "Neither Sudanese party accepted the initiative. Cairo holds the Islamist government in Khartoum responsible for the 1995 attempt on President Mubarak in Addis Ababa and proposes a joint war to topple it. If Libya declines, Egypt keeps the claim but would have to fight alone."
 egypt_mubarak.53.a_igad: "Join the Kenyan talks with Cairo."
 egypt_mubarak.53.a_halaib: "Recognize Egyptian Hala'ib."
 egypt_mubarak.53.a_darfur: "Arm the Darfur rebels together."
 egypt_mubarak.53.a_war: "March on Khartoum with Cairo."
 egypt_mubarak.53.b: "Arm the Darfur rebels on our own terms."
 egypt_mubarak.53.c: "Turn to the African Union."
 egypt_mubarak.53.e: "Propose a joint march on Khartoum."
 egypt_mubarak.54.t: "Tripoli Stands With Us"
 egypt_mubarak.54.d: "Libya has accepted the Egyptian proposal and will act alongside Cairo. The joint effort gives the policy more weight in Khartoum and in the region."
 egypt_mubarak.54.a: "A common front."
 egypt_mubarak.55.t: "Tripoli Goes Its Own Way"
 egypt_mubarak.55.d: "Libya has declined to follow the Egyptian lead and will pursue its own Sudan policy. Colonel Gaddafi increasingly directs Libyan diplomacy toward the African Union, and Cairo is left to act alone."
 egypt_mubarak.55.a: "Egypt will act alone."
 egypt_mubarak.56.t: "Gaddafi Proposes a March on Khartoum"
 egypt_mubarak.56.d: "Libya has answered Egypt's chosen course with a counter-offer: a joint war to topple the government in [SUD.GetNameDef]. Tripoli will join the war only if Cairo does the same."
 egypt_mubarak.56.a: "March with Tripoli."
 egypt_mubarak.56.b: "Egypt will not go to war."
 egypt_mubarak.57.t: "Cairo Marches With Us"
 egypt_mubarak.57.d: "Egypt has accepted the Libyan proposal. Egyptian and Libyan forces are now at war with [SUD.GetNameDef] on the same side."
 egypt_mubarak.57.a: "Side by side."
 egypt_mubarak.58.t: "Cairo Refuses to March"
 egypt_mubarak.58.d: "Egypt has declined to join a war against [SUD.GetNameDef]. Libya may still act alone, but Tripoli is unlikely to forget the refusal."
 egypt_mubarak.58.a: "Libya will act alone."
 egypt_mubarak.59.t: "A Cabinet Reshuffle"
 egypt_mubarak.59.d: "The President has decided to change the government. The Policies Secretariat sends a list of Western-trained economists and businessmen close to Gamal Mubarak. The old ministers, generals and party veterans who have served since the 1980s want to keep their posts and warn that rapid reform will anger the street."
 egypt_mubarak.59.a: "Bring in the New Guard."
 egypt_mubarak.59.b: "Keep the Old Guard."
 egypt_mubarak.60.t: "A Presidential Pardon"
 egypt_mubarak.60.d: "On national holidays the President pardons prisoners by decree. This year the list can favor Islamists who have renounced violence, as thousands of Gamaa Islamiya members did in the early 2000s, or jailed liberals such as democracy activists and opposition journalists, whose release Washington keeps requesting."
 egypt_mubarak.60.a: "Release the Islamists."
 egypt_mubarak.60.b: "Release the liberals."
 EGY_libyan_plan_joint_war_tt: "Egypt declares war on [SUD.GetNameDef] and Libya joins the war on Egypt's side.\n"
 EGY_gas_exports: "Gas Exports"
 EGY_gas_exports_desc: "Egypt holds some of the largest gas fields in the eastern Mediterranean and sells them to its neighbors. Each pipeline and contract earns hard currency and binds a customer to Cairo."
 EGY_build_arab_gas_pipeline: "Build the Arab Gas Pipeline"
 EGY_build_arab_gas_pipeline_desc: "The Arab Gas Pipeline starts at El Arish in Sinai, crosses the Gulf of Aqaba and runs north through Jordan. The first stretch opened in 2003 and supplies the power stations of Aqaba and Amman with Egyptian gas, a sale that brings revenue and makes Jordan depend on Cairo."
 EGY_extend_arab_gas_pipeline_north: "Extend the Arab Gas Pipeline North"
 EGY_extend_arab_gas_pipeline_north_desc: "In 2008 the pipeline was extended from Jordan to Syria, and a branch toward Lebanon followed. Plans reach farther still, toward Turkey and Europe. Each extension makes Cairo the supplier of its neighbors and widens the market for Egyptian gas."
 EGY_east_mediterranean_gas_deal: "Sign the East Mediterranean Gas Deal"
 EGY_east_mediterranean_gas_deal_desc: "In 2005 Egypt agreed to sell gas to Israel through the East Mediterranean Gas Company, and deliveries began in 2008 through the pipeline from El Arish to Ashkelon. Critics say the price is far below the world market and the contract is a gift to Israel, but it earns foreign currency and gives Israeli industry a stake in Egyptian supply."
 EGY_arab_gas_pipeline_built_tt: "We have built the §YArab Gas Pipeline§!"
 EGY_palestinian_question: "The Palestinian Question"
 EGY_palestinian_question_desc: "Egypt borders Gaza, hosts the Arab League and holds the confidence of Jerusalem and Ramallah. When a proposal is refused, Cairo can press the other side and put its plan forward again."
 EGY_propose_two_state_settlement: "Resubmit the Two-State Settlement"
 EGY_propose_two_state_settlement_desc: "Israel or the Palestinian Authority refused the plan, and Egypt's answers on refugees, settlements and Jerusalem are cleared. We can put a revised settlement to both sides again."
 EGY_propose_gaza_to_israel: "Resubmit the Gaza Proposal to Israel"
 EGY_propose_gaza_to_israel_desc: "Israel refused to take Gaza under its own control. After pressure in Washington and Jerusalem, we can put the same proposal to the Israeli government again."
 EGY_propose_egyptian_gaza: "Resubmit Egyptian Rule over Gaza"
 EGY_propose_egyptian_gaza_desc: "Israel refused to let Egypt administer the strip again. After pressure in Washington and Jerusalem, we can renew the offer to take Gaza back and answer for its security."
 EGY_lean_on_israel_through_washington: "Lean on Israel through Washington"
 EGY_lean_on_israel_through_washington_desc: "Under the Bush administration, American pressure moved Sharon and then Olmert on Gaza, from the 2005 disengagement to the Annapolis talks of 2007. We can ask Washington to press the Israeli government to take our proposal seriously."
 EGY_rally_the_arab_league_behind_ramallah: "Rally the Arab League behind Ramallah"
 EGY_rally_the_arab_league_behind_ramallah_desc: "The Arab Peace Initiative of 2002 offered Israel normal relations in return for withdrawal and a Palestinian state. We can bring the Arab League behind the Palestinian Authority and press for the plan again."
 EGY_gaza_proposal_cooldown_tt: "We have not made a proposal on Gaza in the last §Y180§! days"
 EGY_israel_present_in_palestine_tt: "§Y[ISR.GetNameWithFlag]§! is the overlord of §Y[PAL.GetNameWithFlag]§!, or holds at least §Y10%§! influence there"
 EGY_gaza_proposal_rejected_opinion: "Rejected Our Gaza Proposal"
 egypt_mubarak.61.t: "Egypt Proposes to Hand Gaza to Israel"
 egypt_mubarak.61.d: "[FROM.GetNameDef] has put a formal proposal before our cabinet. Israel would take over the Gaza Strip, and in return the Palestinian territories would receive full independence. Egyptian mediators say that both sides can live with the arrangement."
 egypt_mubarak.61.a: "Accept the Egyptian plan."
 egypt_mubarak.61.b: "Decline."
 egypt_mubarak.62.t: "Israel Accepts the Gaza Plan"
 egypt_mubarak.62.d: "Israel has agreed to take over the Gaza Strip, and Palestine is now fully independent. The Arab street is angry at the loss of Gaza, and the Muslim Brotherhood is using the anger against the government."
 egypt_mubarak.62.a: "The plan serves regional stability."
 egypt_mubarak.63.t: "Israel Rejects the Gaza Plan"
 egypt_mubarak.63.d: "Israel has declined our proposal on Gaza. The government in Jerusalem sees no reason to take on the strip, and our mediators return to Cairo empty-handed."
 egypt_mubarak.63.a: "A missed opportunity."
 egypt_mubarak.64.t: "Egypt Proposes to Take Over Gaza"
 egypt_mubarak.64.d: "[FROM.GetNameDef] asks to take over the administration of Gaza. Cairo promises to disarm the militias and to keep the border closed to rockets and tunnels. Israel would trade a standing security burden for a neighbor it already has a treaty with."
 egypt_mubarak.64.a: "Accept the Egyptian plan."
 egypt_mubarak.64.b: "Decline."
 egypt_mubarak.65.t: "Israel Hands Gaza to Egypt"
 egypt_mubarak.65.d: "Israel has agreed to our proposal, and the Gaza Strip passes under Egyptian rule. The army welcomes the responsibility, while the Foreign Ministry warns that Egypt now owns the problem it avoided for decades."
 egypt_mubarak.65.a: "Gaza returns to Cairo."
 egypt_mubarak.66.t: "Israel Refuses Egyptian Rule over Gaza"
 egypt_mubarak.66.d: "Israel has refused to let Egypt take over the Gaza Strip. Jerusalem does not trust an Egyptian administration to keep the militias in check, and our offer goes unanswered."
 egypt_mubarak.66.a: "A missed opportunity."
 egypt_mubarak.67.t: "Washington Commits to Invading Iraq"
 egypt_mubarak.67.d: "It is early 2003, and Washington has committed to invading Iraq. President Mubarak has warned that a war would create \"a hundred bin Ladens\", yet American warships still need the Suez Canal and American aircraft need our airspace. The Arab street is watching how Cairo answers."
 egypt_mubarak.67.a: "A hundred bin Ladens."
 egypt_mubarak.67.b: "Quietly open the canal and the skies."
 egypt_mubarak.67.c: "Say nothing."
 egypt_mubarak.68.t: "Remittances from the Kingdom"
 egypt_mubarak.68.d: "Roughly 1.5 million Egyptians work in Saudi Arabia, and their remittances now reach Egyptian families in a steady flow. Riyadh keeps its labor market open to our workers, and the Central Bank welcomes the foreign currency."
 egypt_mubarak.68.d_withdrawn: "Saudi Arabia has turned against us and no longer favors Egyptian workers. Remittances from the Kingdom dry up, and the money that once supported households along the Nile stops arriving."
 egypt_mubarak.68.a: "The remittances arrive."
 egypt_mubarak.68.b: "The Gulf partnership fails."
 egypt_mubarak.69.t: "Emirati Developers Break Ground"
 egypt_mubarak.69.d: "Emirati developers such as Emaar, builder of Uptown Cairo, and the Marassi resort on the north coast are breaking ground on new projects. Access roads and utilities follow the cranes, and local contractors find steady work."
 egypt_mubarak.69.d_withdrawn: "The United Arab Emirates has turned against us, and its developers pull out of Egypt. Half-built projects stand idle, and the roads and utilities promised to serve them are never laid."
 egypt_mubarak.69.a: "Roads follow the developers."
 egypt_mubarak.69.b: "The Gulf partnership fails."
 egypt_mubarak.70.t: "Kuwaiti Deposits Support the Pound"
 egypt_mubarak.70.d: "Kuwaiti deposits at the Central Bank of Egypt add to our reserves and prop up the pound. The Central Bank can calm the currency market, and prices on the street hold steady."
 egypt_mubarak.70.d_withdrawn: "Kuwait has turned against us and withdraws its deposits from the Central Bank of Egypt. Reserves fall, the pound weakens, and the Central Bank loses the cushion it relied on."
 egypt_mubarak.70.a: "The pound holds."
 egypt_mubarak.70.b: "The Gulf partnership fails."
 egypt_mubarak.71.t: "Islamic Banking Expands"
 egypt_mubarak.71.d: "Bahrain-based Al Baraka Banking Group is expanding Islamic banking in Egypt, opening branches that offer sharia-compliant accounts to ordinary savers. The Brotherhood-leaning middle class welcomes a bank that fits its beliefs."
 egypt_mubarak.71.d_withdrawn: "Bahrain has turned against us, and Al Baraka Banking Group scales back its Egyptian operations. Branches close, and savers who wanted sharia-compliant banking are left without it."
 egypt_mubarak.71.a: "Islamic banking grows."
 egypt_mubarak.71.b: "The Gulf partnership fails."
