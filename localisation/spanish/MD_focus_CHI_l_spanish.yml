 MAC_sinicization_tt: "$MAC_sinicization_var$: $RIGHT|Y=1$"
 CHI_MAC_sinicization_modifier: "Sinización de Macao"
 CHI_MAC_sinicization_modifier_desc: ""
 OMG_sinicization: "£GFX_text_icon_mongolia_sar Sinización de Mongolia Interior: [?OMG_sinicization_var|Y1]"
 OMG_sinicization_tt: "£GFX_text_icon_mongolia_sar Sinización de Mongolia Interior: $RIGHT|Y=1$"
 CHI_OMG_sinicization_modifier: "Sinización de Mongolia Interior"
 CHI_OMG_sinicization_modifier_desc: "Realiza un seguimiento de la sinización de Mongolia Interior y de las condiciones económicas que Pekín concede a la región a medida que esta aumenta. La sinización crece a través de las decisiones y enfoques de Mongolia Interior en la rama de §Y$CHI_SAR_integrate_OMG$§!.\n§W--------------§!\nEste modificador se §REliminará§! si completamos el enfoque §Y$CHI_SAR_integrate_OMG$§!, que requiere una §YSinización de Mongolia Interior§! de al menos §Y90§!."
