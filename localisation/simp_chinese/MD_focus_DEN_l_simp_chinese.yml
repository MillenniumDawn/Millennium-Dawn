 DEN_increase_soldiers_pay: "Increase Soldiers Pay"
 DEN_NCO_reform_the_education: "Alter The NCO Education"
 DEN_NCO_reform_the_education_desc: "Non-Commissioned Officers (NCOs). NCOs in the Danish Army are responsible for leading and managing soldiers and are expected to have a broad range of skills and knowledge in areas such as leadership, tactics, and administration."
 DEN_theoretical_officer_education: "Theoretical Officer Education"
 DEN_regimental_doctors: "The Defence's Regimental Doctors"
 DEN_civilian_education: "The Defence Civilian Education"
 DEN_dental_plan: "The Defence Dental Plan"
 DEN_danish_defence_force: "Danish Defence Force"
 DEN_danish_defence_force_desc: "The Danish Army is the ground force component of the Danish Defense and is responsible for defending Denmark and its interests both domestically and internationally. It was founded in 1614 and has a long history of military service."
 DEN_increase_eurosceptism_decision: "Sovereign Currency"
 DEN_increase_eurosceptism_decision_desc: "Denmark reaffirms its commitment to its sovereign currency, rejecting further integration with the Eurozone. Emphasizing national sovereignty and economic independence, this decision signals Denmark's skepticism towards deeper European integration and the adoption of the euro as its official currency."
 DEN_downcrease_eurosceptism_decision: "Euro Integration Initiative"
 DEN_downcrease_eurosceptism_decision_desc: "Denmark takes proactive steps towards closer integration with the Eurozone, signaling its willingness to adopt the euro as its official currency. By embracing the common currency, Denmark aims to strengthen economic ties with European partners, enhance market stability, and facilitate trade and investment within the Eurozone."
 DEN_bad_bank_decision: "Pragmatic Debt Reduction Strategy"
 DEN_bad_bank_decision_desc: "Denmark implements a pragmatic approach to debt reduction, allocating a modest investment to decrease national debt while expanding international investments. By balancing fiscal responsibility with strategic investments, Denmark aims to improve financial stability, enhance economic competitiveness, and attract foreign capital for sustainable growth."
 DEN_EZB_bad_bank_decision: "Bold Economic Stimulus Plan"
 DEN_EZB_bad_bank_decision_desc: "Denmark launches a bold economic stimulus plan, committing significant resources to decrease national debt and boost international investments. By injecting capital into strategic sectors and infrastructure projects, Denmark aims to revitalize the economy, create jobs, and attract foreign investors, positioning itself as a dynamic hub for innovation and growth in the global market."
