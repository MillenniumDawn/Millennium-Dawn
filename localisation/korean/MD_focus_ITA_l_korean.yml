 italy_md.69.t: "광범위한 시위"
 italy_md.69.d: "나라의 끔찍한 정치적, 경제적 상황에 분노한 이탈리아인들이 반도 전역에서 대대적인 시위를 일으켰습니다. 일부는 이미 폭력적으로 변하고 있으며, 반체제 정당들이 인구의 분노를 이용하려고 이미 열심히 움직이고 있는 만큼, 시위대를 달래지 못하면 앞으로 무슨 일이 벌어질지 정부 일각에서는 이미 우려하고 있습니다."
 italy_md.69.o1: "답답하군"
 ITA_build_waste_incinerators: "폐기물 소각장 건설"
 ITA_build_waste_incinerators_desc: "폐기물 소각장은 방대한 양의 폐기물을 처리하여 배출이 거의 없는 귀중한 에너지로 전환할 수 있습니다. 그럼에도 님비, 마피아, 정치적 무능으로 인해 폐기물 처리는 특히 남부의 지자체들에게 여전히 큰 문제이며, 이들은 흔히 수상한 자들에게 문제를 떠넘기게 됩니다."
 ITA_protect_against_pizzo: "피초로부터의 보호 제공"
 ITA_protect_against_pizzo_desc: "§R마피아§!는 '피초'라는 사실상의 세금을 통해 지역을 통제합니다. 이는 보호를 명목으로 한 거절할 수 없는 요금이며, 이 보호비 지불을 거부하면 갈취를 거부한 이들의 상업 활동에 불쾌한 사건이 벌어지는 경우가 많습니다."
 ITA_civil_war_partisan_activity: "빨치산 활동"
 ITA_civil_war_partisan_activity_TT: "이처럼 분열을 낳는 분쟁에서 예상할 수 있듯이, 민간인 상당수는 직접 싸우지는 않더라도 자신들이 공감하는 편의 병사들에게 정보, 물자, 은신처와 보호를 제공합니다."
 has_leftwing_populist_government_TT: "집권 정당이 좌익 포퓰리즘 정당이어야 합니다."
 has_rightwing_populist_government_TT: "집권 정당이 우익 포퓰리즘 정당이어야 합니다."
 encourage_international_investments: "국제 투자 장려"
 condemn_antiglobal_rhetoric: "반세계화 수사 규탄"
 condemn_antiglobal_rhetoric_desc: "우리 연립에는 자본주의와 세계화에 대한 끊임없는 비판을 정치적 호소력의 일부로 삼아 온 정당들이 포함되어 있습니다. 이는 교육받지 못한 대중에게는 잘 먹힐지 몰라도 국제 투자자들 사이에 불안을 일으킵니다. 우리 제도에 대한 국제적 신뢰를 높이기 위해 이러한 수사를 규탄하는 것이 현명할 것입니다."
 condemn_antiglobal_rhetoric_TT: "이로 인해 연립 내 모든 반자본주의 또는 반세계화 정당의 인기도가 5% 감소합니다"
