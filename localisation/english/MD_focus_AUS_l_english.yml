 ##########Focuses - AUS##########
 AUS_Austrian_Diplomacy: "Austrian Diplomacy"
 AUS_Austrian_Diplomacy_desc: "Through diplomacy, we can strengthen our international relationships, create opportunities for economic development, and expand our influence abroad."
 AUS_Towards_a_Sustainable_Economic_Future: "Towards A Sustainable Economic Future"
 AUS_Towards_a_Sustainable_Economic_Future_desc: "The Austrian economy has long been a reliable and resilient model, but in recent years, it has begun to show weaknesses. Our economy is no longer as reliable as it once was. It is time to reshape our economic model and pursue the necessary reforms and investments to lead Austria to an sustainable economic future."
 AUS_Investments_in_the_East: "Investments in The East"
 AUS_Investments_in_the_East_desc: "With the fall of the Soviet Union, numerous Eastern European countries gained independence and escaped the grip of the Iron Curtain. These countries have since become increasingly attractive investment opportunities right on our doorstep."
 AUS_European_Transit_Corridor: "European Transit Corridor"
 AUS_European_Transit_Corridor_desc: "Austria's central position in Europe places it at the crossroads of major European trade routes. Further developing our position as a transit corridor can strengthen the flow of goods across the continent and increase our monetary output from our geographical advantage."
 AUS_The_Resource_Sector: "The Resource Sector"
 AUS_The_Resource_Sector_desc: "Resources are the cornerstone of any economy. Without them, goods cannot be produced, industries cannot function, and economic development is severely limited. Strengthening our resource sector will ensure a reliable domestic supply of the materials our economy depends on."
 AUS_Support_Increasing_Energy_Demand: "Support Increasing Energy Demand"
 AUS_Support_Increasing_Energy_Demand_desc: "Energy is the backbone of any modern economy. Without a reliable energy supply, industries cannot function, goods cannot be produced, and economic activity is severely limited. Ensuring that our energy supply can meet rising demand is therefore essential for our continued development."
 AUS_The_Future_of_the_Austrian_Economy: "The Future of The Austrian Economy"
 AUS_The_Future_of_the_Austrian_Economy_desc: "Austria's economy already benefits from a strong industrial base and a tradition of specialized manufacturing. Rather than abandoning these strengths, we must build upon them, expanding into high-value services, advanced technologies, and new industries to secure our competitiveness in the future."
 AUS_Romanian_Manufacturing_Hubs: "Romanian Manufacturing Hubs"
 AUS_Romanian_Manufacturing_Hubs_desc: "Romania holds considerable promise as a center of industrial expansion. The development of manufacturing capacity will strengthen our economic position and support future growth on both sides. By encouraging closer industrial cooperation, we can deepen economic ties and create new opportunities for shared prosperity."
 AUS_Pan_European_Transport_Corridors: "Pan European Transport Corridors"
 AUS_Pan_European_Transport_Corridors_desc: "Pan-European transport corridors connect national infrastructure with the wider European transport network. Investing in infrastructure across other countries can improve these connections, strengthen the flow of goods and people, and expand Austria's role within the European transit system."
 AUS_Strenghen_Finacial_Ties: "Strenghen Finacial Ties"
 AUS_Strenghen_Finacial_Ties_desc: "Strengthening financial ties with Eastern European countries can deepen economic cooperation and create stronger links between Austria and emerging markets. Greater financial integration can support cross-border investment, expand Austrian business activity, and increase the flow of capital between our economies."
 AUS_Wealth_of_the_Alpine_Soil: "Wealth of The Alpine Soil"
 AUS_Wealth_of_the_Alpine_Soil_desc: "Austria's Alpine regions contain some valuable natural resources, from minerals and timber to other raw materials. Making better use of these resources can support local industries and create additional economic value."
 AUS_Fossil_Fuels: "Expand the Thermal Sector"
 AUS_Fossil_Fuels_desc: "Energy production remains a cornerstone of economic stability and industrial development. The expansion of our thermal sector will ensure a reliable supply of power to meet growing demands. By investing in modern facilities and improving efficiency, we can strengthen our energy security and secure a stable energy future."
 AUS_Renewable_Energy_Programmes: "Renewable Energy Programmes"
 AUS_Renewable_Energy_Programmes_desc: "Renewable energy will play an increasingly important role in shaping the future of our economy and ensuring long-term sustainability. The expansion of renewable energy programmes will reduce dependence on traditional sources and support a more balanced energy system. By investing in new technologies and encouraging development, we can strengthen energy security and support sustainable economic growth."
 AUS_Develop_our_Tech_sector: "Develop Our Tech Sector"
 AUS_Develop_our_Tech_sector_desc: "Technology will play an ever greater role in shaping the economy of the future. Austria must foster the growth of its technology sector, encourage innovation, and provide the foundations for new industries. By embracing technological development, we can open new avenues for growth and prosperity."
 AUS_The_Tertiary_Backbone: "The Tertiary Backbone"
 AUS_The_Tertiary_Backbone_desc: "The tertiary sector forms the backbone of the Austrian economy, providing employment, prosperity, and a wide range of essential services. From tourism and finance to commerce and professional services, it connects our economy to both domestic and international markets. By strengthening this foundation, we can ensure that Austria remains prosperous and competitive in the years ahead."
 AUS_Specialized_Manufacturing: "Specialized Manufacturing"
 AUS_Specialized_Manufacturing_desc: "The continued development of specialized manufacturing will be essential to strengthening our industrial base. By focusing on advanced production and specialized goods, we can improve efficiency, increase industrial capabilities, and further meet the demands of an increasingly complex economy."
 AUS_Pannonian_Automotive_Supply_Chains: "Pannonian Automotive Supply Chains"
 AUS_Pannonian_Automotive_Supply_Chains_desc: "Slovakia stands at the heart of the Pannonian industrial space, offering a strong base for automotive production and skilled manufacturing. By expanding supply chains there, we strengthen regional integration, improve efficiency, and secure reliable partners for our industry. Through closer cooperation, we reinforce both our economic reach and the stability of our automotive sector.  "
 AUS_Danubian_Energy_Grid: "Danubian Energy Grid"
 AUS_Danubian_Energy_Grid_desc: "A Danubian Energy Grid can connect Austria more closely with the energy systems of Central and Eastern Europe. Strengthening cross-border energy infrastructure can improve electricity flows, support regional energy trade, and deepen Austria's economic ties along the Danube."
 AUS_Bulgarian_Service_Centers: "Bulgarian Service Centers"
 AUS_Bulgarian_Service_Centers_desc: "Bulgaria represents a strategic opportunity for the expansion of modern service industries. By granting targeted investment toward the establishment of service centers, we enhance regional capacity, improve economic coordination, and strengthen long-term partnerships."
 AUS_Shift_Freight_to_Rail: "Shift Freight To Rail"
 AUS_Shift_Freight_to_Rail_desc: "A rail-based transport system can result in faster travel times, greater overall productivity, and more efficient transportation. Compared to a road-based transport system, however, it generates lower monetary output."
 AUS_Road_Based_Transport_Strategy: "Road Based Transport Strategy"
 AUS_Road_Based_Transport_Strategy_desc: "A road-based transport system can generate greater monetary returns than a rail-dominated system by expanding freight capacity and increasing flexibility. Strengthening road transport can therefore increase the monetary output generated by Austria's transit sector."
 AUS_Global_Recruitment_Drive: "Global Recruitment Drive"
 AUS_Global_Recruitment_Drive_desc: "Our resource sector requires skilled workers and expertise that cannot always be found domestically these days. By recruiting workers from abroad, we can fill critical positions, increase production, and provide our industries with skilled workers"
 AUS_Expand_Mittersill_Mine: "Expand Mittersill Mine"
 AUS_Expand_Mittersill_Mine_desc: "The Mittersill mine holds valuable mineral resources that can strengthen our domestic industry. By expanding its operations, we can increase production and secure a reliable supply of these resources."
 AUS_Ramp_up_Steel_Production: "Ramp Up Steel Production"
 AUS_Ramp_up_Steel_Production_desc: "By ramping up steel production, we can strengthen one of the foundations of our industrial economy. Expanding domestic production will provide our industries with the materials they need while reducing our reliance on foreign suppliers and ensuring a reliable supply of steel for future development."
 AUS_Exploit_Marchfeld_Oil_Fields: "Exploit Marchfeld Oil Fields"
 AUS_Exploit_Marchfeld_Oil_Fields_desc: "Through new technologies, we are now able to tap into previously inaccessible reserves in the Marchfeld region. This will reduce our dependence on international oil markets and provide greater economic stability in times of global energy shortages and market disruptions."
 AUS_The_Power_of_Water: "The Power of Water"
 AUS_The_Power_of_Water_desc: "Water is one of Austria's most valuable natural resources, providing clean energy through hydropower. By making better use of our water resources, we can further utilize this natural potential and make the most of one of our country's greatest energy assets."
 AUS_The_Power_of_Water_TT: "Depending on previous choices, this focus grants different effects. §YWe currently gain:§!"
 AUS_Subsidize_Rooftop_Solar: "Subsidize Rooftop Solar"
 AUS_Subsidize_Rooftop_Solar_desc: "By subsidizing rooftop solar, we can encourage households and businesses to generate their own electricity while reducing our dependence on conventional energy sources. Expanding rooftop solar across Austria will increase renewable energy production and make better use of our existing roofs."
 AUS_renewable_energy_funds_TT: "Depending on previous political choices, this focus grants different effects. §YWe currently gain:§!"
 AUS_Build_Wind_Farms: "Build Wind Farms"
 AUS_Build_Wind_Farms_desc: "Austria has significant potential for wind energy, particularly in regions with favorable conditions. By building wind farms, we can expand our renewable energy production, reduce our dependence on imported energy, and provide a reliable source of electricity for our growing economy."
 AUS_Construct_Data_Centers: "Construct Data Centers"
 AUS_Construct_Data_Centers_desc: "As our economy becomes increasingly digital, reliable data infrastructure will be essential. By constructing modern data centers, we can support growing digital services and lay the foundations for a more connected economy."
 AUS_Construct_Data_Centers_TT: "Depending on our current employment, this focus grants different effects. §YOur employment currently leads to:§!"
 AUS_Semiconductor_Investments: "Semiconductor Investments"
 AUS_Semiconductor_Investments_desc: "Semiconductors are at the heart of the modern economy, powering everything from industrial machinery to advanced electronics. By directing investment toward semiconductor manufacturing and research, Austria can establish a stronger technological base and lay the foundations for an industry of strategic importance"
 AUS_Broadband_Billions: "Broadband Billions"
 AUS_Broadband_Billions_desc: "Fast and reliable internet access is essential to a modern economy. By further investing into our digital infrastructure, we can connect communities, empower businesses, and bring Austria further into the digital age."
 AUS_Innovation_as_a_Good: "Innovation as a Good"
 AUS_Innovation_as_a_Good_desc: "Innovation itself is a valuable economic good. New ideas, technologies, and solutions can be developed, traded, and exported, creating economic value in much the same way as physical goods and services. By treating innovation as an economic good, we can create new sources of value and strengthen Austria's economy."
 AUS_Process_Logistics_Architecture: "Process and Logistics Architecture"
 AUS_Process_Logistics_Architecture_desc: "Efficient processes and logistics are essential for keeping goods and materials moving through our economy. Improving how businesses organize production, transport, and distribution will reduce delays, lower costs, and make our industries more efficient."
 AUS_Tourism_Hospitality: "Tourism and Hospitality"
 AUS_Tourism_Hospitality_desc: "Our natural landscapes, cultural heritage, and Alpine regions make tourism and hospitality an important part of our economy. Investing in this sector can attract more visitors, increase spending, and strengthen Austria's position as a leading European destination.  "
 AUS_Promote_Advanced_Materials: "Promote Advanced Materials"
 AUS_Promote_Advanced_Materials_desc: "Advanced materials allow industries to improve the performance, durability, and efficiency of their products. By developing our capabilities in this field Austrian  manufacturers gain the ability to strengthening their competitiveness."
 AUS_New_Hidden_Champions: "New Hidden Champions"
 AUS_New_Hidden_Champions_desc: "Austria's economy is home to many specialized companies with the potential to become global leaders in their respective fields. Supporting the growth of these emerging hidden champions can create new export opportunities and strengthen Austria's presence in international markets."
 AUS_Expand_Production_of_Automotive_Components: "Expand Production of Automotive Components"
 AUS_Expand_Production_of_Automotive_Components_desc: "Austria has strong expertise in producing specialized automotive components. Expanding domestic production can increase industrial output, strengthen exports, and support the wider automotive sector."
 AUS_Acquire_Balkan_Telecommunications: "Acquire Balkan Telecommunications"
 AUS_Acquire_Balkan_Telecommunications_desc: "Acquiring telecommunications assets in the Balkans can expand our presence in the region and strengthen our economic ties with Southeast Europe.  "
 AUS_Modernize_the_Railway_System: "Modernize The Railway System"
 AUS_Modernize_the_Railway_System_desc: "Modernizing Austria's railway system can improve reliability, increase capacity, and reduce delays. Upgrading outdated infrastructure and introducing modern technologies can make rail transport faster, more efficient, and better suited to the demands of a growing transport network."
 AUS_Expand_Capacity: "Expand Capacity"
 AUS_Expand_Capacity_desc: "Expanding rail capacity allows more passengers and freight to be transported efficiently across Austria. Increasing capacity on existing routes can reduce bottlenecks, improve travel times, and support higher levels of transport productivity."
 AUS_Create_shortcuts: "Create Shortcuts"
 AUS_Create_shortcuts_desc: "Creating shortcuts can reduce travel distances and improve connections between major transport routes. Shorter routes can lower travel times, resulting in greater productivity and making the entire network a more attractive."
 AUS_Expand_Highway_Capacity: "Expand Highway Capacity"
 AUS_Expand_Highway_Capacity_desc: "Expanding highway capacity can reduce congestion and allow greater volumes of traffic to move across Austria. Increasing capacity on key routes can shorten travel times, improve traffic flow, and support the growing demands of our transport network."
 AUS_h_Transit_Korridor: "24h Transit Korridor"
 AUS_h_Transit_Korridor_desc: "A 24-hour transit corridor can keep goods moving continuously, reducing delays and allowing more freight to pass through Austria. This can increase the overall monetary output generated by our transit sector and make Austria's routes more attractive for international trade."
 AUS_Construct_Urban_Bypasses: "Construct Urban Bypasses"
 AUS_Construct_Urban_Bypasses_desc: "Constructing urban bypasses can reduce congestion in populated areas and shorten travel times for through traffic. This can make journeys faster, reduce disruption for local communities, and improve the overall flow of transport"
 AUS_Invest_in_Powerplants: "Invest In Powerplants"
 AUS_Invest_in_Powerplants_desc: "By investing in power plants, we can expand our generation capacity and meet rising energy demands. This will ensure a stable supply of electricity and provide the foundation for further economic growth."
 AUS_Stronger_Research_Exchange: "Stronger Research Exchange"
 AUS_Stronger_Research_Exchange_desc: "Closer research exchange allows Austrian scientists, universities, and businesses to share knowledge and expertise across borders. Stronger cooperation can accelerate the development of new ideas and bring research closer to practical economic applications."
 AUS_Increase_Productivity: "Increase Productivity"
 AUS_Increase_Productivity_desc: "Productivity determines how much economic output we can generate from the resources available to us. By increasing productivity, we can reduce wasted resources, produce more goods and services, and increase the overall output of our economy."
 AUS_Develop_Precision_Components: "Develop Precision Components"
 AUS_Develop_Precision_Components_desc: "From advanced machinery to aerospace systems, precision components form the foundation of many high-value products. Building expertise in this field can allow Austrian manufacturers to move further into specialized and high-value production."
 AUS_The_Bratislava_Vienna_Twin_City_Region: "The Bratislava Vienna Twin City Region"
 AUS_The_Bratislava_Vienna_Twin_City_Region_desc: "Strengthening the Vienna–Bratislava region can deepen cross-border economic ties, improve infrastructure connections, and create a more integrated economic area in Central Europe."
 AUS_Open_Lithium_Mine_in_Carinthia: "Open Lithium Mine In Carinthia"
 AUS_Open_Lithium_Mine_in_Carinthia_desc: "Lithium is becoming an increasingly important resource in our modern world, with demand rising alongside the development of new technologies. By opening a lithium mine in Carinthia, we can make use of our domestic resources, reduce our reliance on foreign suppliers, and secure access to this valuable resource."
 AUS_High_Grade_Steel_Exports: "High Grade Steel Exports"
 AUS_High_Grade_Steel_Exports_desc: "European nations, including Austria, often struggle to compete with Asian manufacturers due to higher production costs. This situation forces us to rethink our steel sector and focus on high-quality steel, where our expertise and standards can give us a competitive advantage."
 AUS_Encourage_Micro_hydro_power: "Encourage Micro Hydropower"
 AUS_Encourage_Micro_hydro_power_desc: "Micro hydropower allows us to make use of smaller rivers and streams to generate clean electricity. By encouraging smaller-scale hydropower projects, we can make better use of Austria's water resources and unlock additional local energy potential."
 AUS_Develop_pumped_hydro_storage: "Develop Pumped Hydro Storage"
 AUS_Develop_pumped_hydro_storage_desc: "Austria's mountainous landscape provides ideal conditions for pumped hydro storage. By developing this technology, we can store excess electricity from renewable sources and provide a reliable supply of power when demand is high."
 AUS_develop_pumped_hydro_TT: "(§YNiederösterreich§!, §YSteiermark§!, §YTirol§!):\nAdd §G30 GWh§! of Energy Storage for every §YGW§! of energy generation. Higher total energy production will result in higher costs per §YGWh§!, due to a lack of naturally suitable locations for hydroelectric energy storage. This effect scales up to §Y30 GW§! of generated electricity."
 AUS_Simmering_Biomass_Plant: "Simmering Biomass Plant"
 AUS_Simmering_Biomass_Plant_desc: "By constructing the simmering biomass plant, we can provide reliable and clean energy for our population, keeping their food refrigerated and their homes warm."
 AUS_Investmetns_in_oberoesterreich: "Investments in Oberösterreich"
 AUS_Investmetns_in_oberoesterreich_desc: "Oberösterreich holds vast untapped potential for renewable energy. By investing in projects across the region, we can harness this potential and strengthen our transition toward a cleaner and more sustainable energy supply."
 AUS_grid_expansion: "Power Grid Expansion"
 AUS_grid_expansion_desc: "Austria's growing energy sector requires a reliable and well-connected power grid. Expanding our grid infrastructure will allow us to connect new sources of electricity, improve energy distribution, and ensure a stable supply of power across the country."
 AUS_Miniaturized_Architecture: "Miniaturized Architecture"
 AUS_Miniaturized_Architecture_desc: "Focusing on high-value semiconductor products allows us to target more profitable segments of the market and generate greater revenue from each product sold."
 AUS_Serve_the_Industrial_Semiconductor_Market: "Serve the Industrial Semiconductor Market"
 AUS_Serve_the_Industrial_Semiconductor_Market_desc: "Focusing on the industrial semiconductor market allows us to serve the growing demand for chips in machinery, automation, and industrial equipment, strengthening our position in this vital sector."
 AUS_Support_Startups: "Support Startups"
 AUS_Support_Startups_desc: "By supporting startups and new businesses, we can encourage innovation and create new opportunities. Investing in startups will strengthen our economy, create new jobs, and help Austria remain competitive in a rapidly modernizing and changing world."
 AUS_Expand_Investments_in_Education: "Expand Investments In Education"
 AUS_Expand_Investments_in_Education_desc: "An educated population is essential to the success of any modern economy. That is why we should continue to invest in education, creating generations of skilled and knowledgeable generations who are prepared to contribute to and succeed in a modern economy."
 AUS_TGW_Growth_Grant: "TGW Growth Grant"
 AUS_TGW_Growth_Grant_desc: "TGW is a leading Austrian company with strong expertise in logistics and automation. Supporting its further growth will allow TGW to expand its operations, strengthen its international presence, and reinforce Austria's position in advanced logistics technology."
 AUS_Convention__Innovation_Tourism: "Convention and Innovation Tourism"
 AUS_Convention__Innovation_Tourism_desc: "Convention and innovation tourism can attract international conferences, business events, and professional gatherings to Austria. This brings visitors from around the world, supports the hospitality sector, and strengthens Austria's position as a destination for international exchange."
 AUS_Adventure__Extreme_Sports: "Adventure and Extreme Sports"
 AUS_Adventure__Extreme_Sports_desc: "Complete the Aus Adventure  Extreme Sports national focus."
 AUS_Standardise_the_Railway_system: "Standardise The Railway System"
 AUS_Standardise_the_Railway_system_desc: "Austria's railway system is still not completely standardized, and can vary between regions. Completing the standardization of the national railway system can improve compatibility, simplify operations, and allow trains to move more efficiently throughout the country."
 AUS_Central_Cargo_Hubs: "Central Cargo Hubs"
 AUS_Central_Cargo_Hubs_desc: "Central cargo hubs can consolidate freight flows and improve the efficiency of goods distribution. By bringing storage, handling, and transport connections together, they can reduce delays, shorten delivery times, and increase the volume of goods moving through Austria."
 AUS_Safety__Flow_Engineering: "Safety Flow Engineering"
 AUS_Safety__Flow_Engineering_desc: "Safety flow engineering focuses on designing transport infrastructure to keep traffic moving smoothly while reducing the risk of accidents. Improving road layouts, junctions, and traffic flows can make journeys safer, more efficient, and more attractive to road users."
 AUS_Digital_Toll_Collection: "Digital Toll Collection"
 AUS_Digital_Toll_Collection_desc: "Digital toll collection can streamline the payment process, reduce delays at toll points, and improve the overall flow of traffic. A more convenient system can make Austria's transport network more efficient and attractive for domestic and international road users."
 AUS_Expand_Noise_Protection_Measures: "Expand Noise Protection Measures"
 AUS_Expand_Noise_Protection_Measures_desc: "Expanding noise protection measures can reduce the impact of transport on nearby communities and natural areas. Better noise barriers and other protective measures can improve public health, protect local ecosystems, and make infrastructure more compatible with its surroundings."
 AUS_Optimize_Domestic_Production: "Optimize Domestic Production"
 AUS_Optimize_Domestic_Production_desc: "Optimizing domestic oil production can help make better use of Austria's existing reserves and reduce reliance on foreign oil imports."
 AUS_Weapon_Manufacturing: "Weapon Manufacturing"
 AUS_Weapon_Manufacturing_desc: "Austria's engineering tradition provides a strong foundation for weapons manufacturing. Developing this industrial base further can preserve specialized know-how, and support skilled manufacturing"
 AUS_Global_Mining_Academy_Hub: "Global Mining Academy Hub"
 AUS_Global_Mining_Academy_Hub_desc: "A Global Mining Academy Hub could serves as an international center for mining education, research, and expertise. By bringing together leading professionals and institutions, it strengthens Austria's position in the global resource sector and advances the development of modern mining practices."
 AUS_A_Step_Towards_Material_Self_Sufficiency: "A Step Towards Material Self Sufficiency"
 AUS_A_Step_Towards_Material_Self_Sufficiency_desc: "Through our investments in the domestic resource sector, we have achieved greater material self-sufficiency and reduced our reliance on foreign suppliers."
 AUS_Increase_National_Oil_Reserves: "Increase National Oil Reserves"
 AUS_Increase_National_Oil_Reserves_desc: "By increasing our national oil reserves, we can ensure a stable supply of fuel even in times of shortages or disruptions. Maintaining larger reserves will strengthen Austria's energy security and provide greater stability for our economy."
 AUS_Digital_Turbine_Management: "Digital Turbine Management"
 AUS_Digital_Turbine_Management_desc: "Digital turbine management can improve the efficiency and reliability of power plants by optimizing turbine performance, reducing downtime, and improving overall plant operations."
 AUS_Upgrade_Old_Turbines: "Upgrade Old Turbines"
 AUS_Upgrade_Old_Turbines_desc: "Upgrading old turbines can increase their efficiency and allow us to generate more electricity from existing hydropower infrastructure."
 AUS_Subsidize_Farmers: "Subsidize Farmers"
 AUS_Subsidize_Farmers_desc: "By subsidizing farmers who adopt agrivoltaic systems, we can combine agricultural production with renewable energy generation. This will allow us to make better use of farmland, provide farmers with an additional source of income, and expand Austria's renewable energy capacity."
 AUS_Veldhoven_Tech_Venture: "Veldhoven Tech Venture"
 AUS_Veldhoven_Tech_Venture_desc: "Establishing a joint venture with ASML in Veldhoven can give us direct access to cutting-edge semiconductor technology and expertise. This partnership can strengthen research cooperation and deepen our role in the semiconductor industry."
 AUS_Invite_TSMC: "Invite TSMC"
 AUS_Invite_TSMC_desc: "Establishing a joint venture with TSMC can give us access to its extensive semiconductor production expertise. This partnership can strengthen production capabilities and deepen our role in the semiconductor industry.  "
 AUS_Invite_Infineon: "Invite Infineon"
 AUS_Invite_Infineon_desc: "Establishing a joint venture with Infineon can give us access to its expertise in industrial semiconductor technology. This partnership can strengthen industrial chip production and deepen our role in the semiconductor industry."
 AUS_Engeneering_and_Planning_Offices: "Engeneering And Planning Offices"
 AUS_Engeneering_and_Planning_Offices_desc: "Austria's engineering and planning offices possess valuable expertise in designing and developing complex projects. Their knowledge and experience provide the foundation for modern infrastructure, advanced industries, and ambitious projects across the country."
 AUS_Corporate_Service_Solutions: "Corporate Service Solutions"
 AUS_Corporate_Service_Solutions_desc: "By exporting corporate service solutions, we can expand Austria's presence in international markets and create jobs while increasing the productivity of our own tertiary sector."
 AUS_Eco__National_Park_Tourism: "Eco and National Park Tourism"
 AUS_Eco__National_Park_Tourism_desc: "Austria's national parks offer unique natural landscapes that can attract visitors from across Europe and beyond. Developing national park tourism can increase tourism revenue while encouraging the preservation and appreciation of Austria's natural heritage."
 AUS_The_Alpine_Engine: "The Alpine Engine"
 AUS_The_Alpine_Engine_desc: "Our investments in the transit system have allowed us to fully utilize its capabilities and turn it into a thriving part of our country's economy, generating greater monetary returns and reinforcing Austria's role as a central transit hub in Europe."
 AUS_Energy_Security_Achieved: "Energy Security Achieved"
 AUS_Energy_Security_TT: "Energy Production: [?energy_sum|Y2] GW is §G25%§! greater than Energy Consumption: [?energy_consumption|Y2] GW"
 AUS_Energy_Security_tt: "Depending on whether renewables make up a larger share of our energy mix than other sources, we can gain different effects. We currently produce [?total_renewable_energy|Y2] GW from renewable sources, compared to [?total_non_renewable_energy|Y2] GW from other sources.\n§YThis leads to:§!"
 AUS_Energy_Security_Achieved_desc: "Through investments in domestic energy production, modern infrastructure, and reliable supply networks, we have secured our energy needs and strengthened the foundations for long-term energy security."
 AUS_Global_Microchip_Hub: "Global Microchip Hub"
 AUS_Global_Microchip_Hub_desc: "Through strategic investments and partnerships, we have built a strong foundation for semiconductor production. By combining advanced technology, industrial expertise, and reliable access to essential resources, we have established ourselves as a major microchip hub."
 AUS_secure_strategic_resources: "Secure Strategic Resources"
 AUS_secure_key_resources_desc: "Securing strategic resources for microchips can strengthen the supply of essential materials needed for semiconductor production. Ensuring reliable access to these resources can support stable production and reduce dependence on vulnerable supply chains."
 AUS_European_Center_of_Innovation: "European Center of Innovation"
 AUS_European_Center_of_Innovation_desc: "Vienna is well positioned to become a European center of innovation, connecting businesses, researchers, and entrepreneurs from across the continent. Strengthening Vienna's role as an innovation hub will help attract talent, encourage technological development, and reinforce Austria's position in Europe's knowledge economy."
 AUS_Promote_Tertiary_Exports: "Promote Tertiary Exports"
 AUS_Promote_Tertiary_Exports_desc: "By promoting tertiary exports, we can expand Austria's presence in international markets, generate additional revenue, and further develop our service-based economy."
 AUS_The_Marksman_Tradition: "The Marksman Tradition"
 AUS_The_Marksman_Tradition_desc: "Austria has always had a strong tradition of weapons and marksmanship. By building on this expertise, we can further develop our capabilities in the field and strengthen Austria's position as a producer and exporter of weapons."
 AUS_Munition_Investments: "Munition Investments"
 AUS_Munition_Investments_desc: "Investing in our munitions industry will allow us to expand production for both domestic use and export. By strengthening our manufacturing capabilities, we can secure our own supply of munitions while establishing ourselves as a reliable supplier to foreign markets."
 AUS_Promote_Defense_Exports: "Promote Defence Exports"
 AUS_Promote_Defense_Exports_desc: "By promoting our defence exports, we can strengthen Austria's position in the international arms market while opening new markets for our economy."
