 AFG_import_westernism: "输入西方主义"
 AFG_import_westernism_desc: "阿富汗长期以来一直坚守其传统价值观。然而，最近对新思想的开放态度使我们能够选择性地吸收西方概念的某些方面。这种方法使我们能够从各种各样的西方思想中汲取经验，选择那些符合我们独特需求的思想，拒绝那些不适合我们背景的思想。"
 AFG_atta_installs_leadership: "阿塔·穆罕默德·努尔担任领导"
 AFG_atta_installs_leadership_desc: "从军阀到指挥官，阿塔·穆罕默德·努尔的行事作风并不温和。"
 AFG_taloqan_text1: "§g只有用大铁锤才能打破它。§!"
 AFG_taloqan_text2: "§g带领他们的将是一个年轻的哈希姆人，骑着一头灰色的骡子，头戴红色头巾。我仿佛看到他正在渡过幼发拉底河。如果你听说他来了，即使你必须爬过雪地，也要赶快去见他。§!"
 AFG_liberal_society: "自由社会"
 AFG_afghan_morning_taliban_by_night: "白天政府军，夜里塔利班"
 AFG_afghan_morning_taliban_by_night_desc: "阿富汗国民军的许多人员过着双重生活。他们中的许多人在服役期间加入了塔利班，这使得塔利班比我们的军队拥有巨大的优势。这种腐败导致了我们武装部队内部的大规模腐败，并严重打击了为国而战的士兵的士气。"
 AFG_safed_koh_supply_network: "萨菲德山脉供应网络"
 AFG_safed_koh_supply_network_desc: "萨菲德山脉供应网络利用由公路、山脉和地下洞穴组成的复杂网络，减轻了该地区恶劣、偏僻地形的影响。"
 AFG_tal_insurgency_new: "[TAL.GetFlag]塔利班叛乱"
 AFG_tal_insurgency_new_desc: "塔利班在连败之后撤退至阿富汗东郊。他们正在挖掘防御工事，准备进行一场旷日持久的血腥游击战。塔利班的实力与其防御和进攻修正直接相关。如果在美国撤军时他们的兵力超过30%，他们就会再次发动全面入侵。\n\n£AFG_salafist_jihadism §H塔利班实力 - [?AFG.taliban_attack_strength|%]§!"
 TAL_move_into_tribal_areas: "深入巴基斯坦部落地区"
 TAL_move_into_tribal_areas_desc: "为了生存，我们需要将部队向外转移，避免集中在一个区域。部落地区是绝佳的藏身之处，因为我们可以顺利进入一片良好的山脉。"
 AFG_414_attack_1207: "攻击塔利班据点"
 AFG_414_attack_1207_desc: "虽然我们无法消灭塔利班，但我们可以削弱他们的实力……如果我们成功的话。"
 TAL_1207_attack_1154: "库纳尔袭击"
 TAL_1207_attack_1208: "向卡拉特方向推进"
 AFG_414_attack_1208: "重占卡拉特"
 AFG_414_attack_1154: "重占库纳尔"
 PAK_objected: "我们因[PAK.GetFlag]巴基斯坦的反对而放弃了"
 AFG_doing_border_raid: "目前正在进行边境突袭"
 TAL_money: "塔利班资金"
 AFG_agriculture_mech: "农业"
 AFG_agriculture_mech_desc: "扁桃仁和石榴是阿富汗唯二世界各国毫不犹豫购买的出口产品。国家资金投入果园、运输和买家，将农民的收成转化为国库收入。"
 AFG_pomegranate_return_tt: "回报：§Y国库§!获得§G+6%§! GDP"
 AFG_almond_return_tt: "回报：§Y国库§!获得§G+8%§! GDP"
 AFG_pomegranate_investment_limit_tt: "石榴投资剩余：§Y[?AFG_pomegranate_investments]/5§!"
 AFG_almond_investment_limit_tt: "扁桃投资剩余：§Y[?AFG_almond_investments]/5§!"
 TAL_1207_attack_1154_desc: "从萨菲德山脉派出战士进入库纳尔，在阿富汗守军构筑防御工事之前削弱其兵力。"
 TAL_1207_attack_1208_desc: "来自萨菲德科赫的部队向卡拉特施压。控制这条公路将政府军在东南部地区分割开来。"
 TAL_1152_attack_415: "席卷锡斯坦"
 TAL_1152_attack_415_desc: "从雷吉斯坦向西驶入锡斯坦，威胁到政府对伊朗沙漠边境的控制。"
 AFG_415_attack_1152: "扫清雷吉斯坦"
 AFG_415_attack_1152_desc: "从锡斯坦发起反击，夺回雷吉斯坦沙漠，并剥夺塔利班的集结地。"
 AFG_412_attack_415: "解放锡斯坦"
 AFG_412_attack_415_desc: "从哈扎拉贾特推进，将塔利班赶出锡斯坦，并将南部各省重新置于政府控制之下。"
 TAL_construct_the_safed_koh_system: "构建萨菲德山脉应链网络"
 TAL_construct_the_safed_koh_system_desc: "在萨菲德山脉开凿藏匿点、隧道和骡道，以便向阿富汗巡逻队无法触及的武装分子提供补给。"
 TAL_begin_war_again: "重新发动战争"
 TAL_begin_war_again_desc: "外国军队撤离，我方实力恢复，放弃停火，向喀布尔进军，结束战争。"
 TAL_begin_insurgency_in_registan: "打开雷吉斯坦前线"
 TAL_begin_insurgency_in_registan_desc: "在雷吉斯坦沙漠各地组建民兵纵队，占领该省，在南部开辟第二战场。"
 AFG_taliban_insurgency_eliminated: "塔利班叛乱已被消灭。"
 AFG_active_taliban_insurgency: "塔利班叛乱活动活跃"
 wot_supporting_afghan_counter_insurgency: "支持阿富汗反叛乱行动"
 AFG_civil_war_shortcut: "内战"
 AFG_panjshir_shortcut: "潘杰希尔"
 AFG_foreign_policy_shortcut: "外交政策"
 AFG_government_shortcut: "政府"
 AFG_reconstruction_shortcut: "重建"
 AFG_national_policy_shortcut: "国家政策"
 AFG_national_assembly: "国民大会"
 AFG_anjuman_pass: "潘杰希尔之狮"
 AFG_law_of_faith: "教法"
 AFG_law_of_faith_idea: "教法"
 AFG_law_of_faith_idea_desc: "宗教律法已写入成文法典。神职人员对此感到满意，乡村民众也会响应号召拿起武器，但任何与共识相悖的政治空间都已关闭。"
 AFG_law_of_faith_desc: "教法将在本国盛行，以加强我们国家内部的伊斯兰原则。我们的人民将以伊斯兰信仰为指引，维护本国的纯洁与正义。"
 AFG_training_of_local_police_officers: "地方警察培训"
 AFG_training_of_local_police_officers_desc: "为最终解放和稳定阿富汗，北方联盟必须建立一支纪律严明、高效运作的警察部队。这支部队对于维护我们计划收复地区的法律和秩序至关重要。"
 AFG_heirs_o_the_mujahideen: "圣战继承者"
 AFG_heirs_o_the_mujahideen_desc: "现任领导层从过去的传奇战士身上汲取灵感，力图重振圣战者的精神和战术。"
 AFG_the_lions_guard: "狮子之卫"
 AFG_the_lions_guard_desc: "为应对迫在眉睫的威胁，已成立一个新的特别工作组，以防止对艾哈迈德·沙阿·马苏德的潜在袭击。"
 AFG_the_francesc_vendrell_talks: "弗朗西斯克·凡德雷尔会谈"
 AFG_the_francesc_vendrell_talks_desc: "在塔吉克斯坦杜尚别，联合国特使弗朗西斯科·文德雷尔与阿富汗主要领导人举行和平会谈，其中包括北方联盟指挥官艾哈迈德·沙阿·马苏德、前楠格哈尔省省长哈吉·阿卜杜勒·卡迪尔和前拉巴尼政府成员赛义德·侯赛因·安瓦里，讨论了穆罕默德·阿西夫·穆赫塞尼的困境。"
 AFG_assault_on_mazar_i_sharif: "袭击马扎里沙里夫"
 AFG_assault_on_mazar_i_sharif_desc: "重要城市马扎里沙里夫必须被夺回，我们可以集合我们的兵力，为他们提供助力，以完成这一目标。"
 AFG_massoud_s_mig_and_sukho: "马苏德的米格和苏霍伊"
 AFG_massoud_s_mig_and_sukho_desc: "印度的支持一直很隐蔽。一段时间以来，印度一直在向马苏德提供资金、雷达设备和飞机零部件。据报道，他们派遣了约30名技术人员负责维护马苏德的米格和苏霍伊战斗机。印度军事顾问还就如何打击塔利班提供了建议。尽管印度的援助未被公开承认，但它已成为马苏德部队的重要支柱。"
 AFG_russian_air_lift_idea: "俄罗斯空运"
 AFG_russian_air_lift_idea_desc: "苏制武器和备件正从俄罗斯空运而来。我们的人员已经熟悉这些装备，因此能够以低成本且无需重新培训的方式运抵前线。"
 AFG_russian_air_lift: "俄罗斯空运"
 AFG_russian_air_lift_desc: "俄罗斯与北方联盟长期保持着秘密联盟关系，向我方残余政府提供武器和重要物资。就在昨天，俄罗斯国防部长谢尔盖·伊万诺夫宣布，他们将为我方民兵配备北方联盟成员早已熟知的苏联时期装备。"
 AFG_mil_mi_24_gunships: "米尔米-24武装直升机"
 AFG_mil_mi_24_gunships_desc: "俄罗斯宣布计划向我们提供12架米尔米-24 攻击直升机，这将为我们打击塔利班的行动提供宝贵的支持。"
 AFG_cia_predator_surveillance_drones: "中情局捕食者侦察无人机"
 AFG_cia_predator_surveillance_drones_idea: "中情局捕食者侦察无人机"
 AFG_cia_predator_surveillance_drones_idea_desc: "美国的无人机在山口上空盘旋，并将它们所看到的景象传回给我们。我们第一次能够根据真正的情报进行规划，而我们自己的网络也是在他们的情报基础上发展起来的。"
 AFG_cia_predator_surveillance_drones_desc: "中央情报局的“捕食者”侦察无人机在提供广泛的地形覆盖、识别关键兴趣点和精确定位敌对目标方面发挥了重要作用。"
 AFG_appeal_to_washington_for_support: "呼吁华盛顿支持"
 AFG_appeal_to_washington_for_support_desc: "面对持续不断的冲突和极端主义派别构成的威胁，阿富汗必须寻求国际盟友的支持，以加强其军事能力。"
 AFG_imu_countermeasures: "乌兹别克斯坦伊斯兰运动防御措施"
 AFG_imu_countermeasures_desc: "为了应对这一威胁，阿富汗寻求乌兹别克斯坦的帮助，对乌兹别克斯坦伊斯兰运动据点进行定点空袭。此次合作旨在削弱乌兹别克斯坦伊斯兰运动的能力，破坏其行动，并恢复边境地区的安全。"
 AFG_shura_system: "强化协商会议体系"
 AFG_shura_system_desc: "加强北方联盟内的协商会议制度对于维持团结和有效治理至关重要。通过加强这一传统的以理事会为基础的决策结构，我们确保所有派别都有代表。"
 AFG_anjuman_pass_desc: "艾哈迈德·沙阿·马苏德，又名潘杰希尔之狮，是抵抗和战术领导力的象征。通过团结在他的思想周围，国家旨在采用他的战略，激励军队，巩固国防。他的领导原则已经并将指导阿富汗度过当前的困境。"
 AFG_ghanis_plan: "加尼的计划"
 AFG_ghanis_plan_desc: "加尼正在启动一项计划，通过有针对性的军事行动和发展项目削减对塔利班的支持，旨在稳定关键地区并恢复政府控制。"
 AFG_secretly_support_the_opium_industry: "暗中支持鸦片产业"
 AFG_secretly_support_the_opium_industry_desc: "在工业化的幌子下，我们的城市基层会相信我们正在走向现代化的新时代。但是，我们不能疏远立国之本 - 农民。我们将秘密支持鸦片贸易，以此作为改善我们经济繁荣和安抚阿富汗社会各阶层的手段。"
 AFG_parliamentary_illusion: "议会幻觉"
 AFG_parliamentary_illusion_idea: "议会幻觉"
 AFG_parliamentary_illusion_idea_desc: "议会开会、辩论、投票，却决定不了任何重要的事情。维持这个议会的成本很低，而且表面上的同意比实际的同意更有价值。"
 AFG_parliamentary_illusion_desc: "议会存在的意义究竟是什么？说到底，就是为了让民众相信他们在政府中拥有发言权。我们不能完全否定民主进程，但我们能够操纵它，使其更好地服务于我们自身的利益。"
 AFG_the_western_kleptocracy: "西方的窃盗统治"
 AFG_ashraf_ghani: "艾哈迈德扎伊"
 AFG_ashraf_ghani_desc: "阿什拉夫·加尼当选为阿富汗新总统。他肩负改革重任，力图稳定国家、重建国家机构。"
 AFG_endorse_the_american_candidate: "支持美国候选人"
 AFG_endorse_the_american_candidate_desc: "随着过渡政府的解散，哈米德·卡尔扎伊对政府的控制依然稳固。作为波恩协议的指定候选人，卡尔扎伊组建了一个涵盖多个派别的政府，致力于重建阿富汗，并与美国新盟友共同促进持久和平。"
 AFG_the_new_chairman: "新主席"
 AFG_the_new_chairman_desc: "随着选举周期的过去，国家元首不仅要掌握控制权，还要成为国家的代言人。卡尔扎伊必须掌握权力，以身作则，带领阿富汗人民。"
 AFG_aptta: "阿富汗-巴基斯坦过境贸易协定"
 AFG_aptta_desc: "阿富汗-巴基斯坦过境贸易协定是巴基斯坦和阿富汗之间的双边贸易协定，由卡尔扎伊政府签署。该协议旨在促进两国之间的贸易，支持反恐行动，并促进边境地区的发展。"
 AFG_saarc_membership: "南亚区域合作联盟成员国"
 AFG_saarc_membership_idea: "南亚区域合作联盟成员国"
 AFG_saarc_membership_idea_desc: "在南亚事务中占有一席之地。信贷成本更低，税基更稳定，喀布尔被视为邻国而非问题。"
 AFG_saarc_membership_desc: "阿富汗加入南亚区域合作联盟，标志着该国已融入地区经济政治框架，也为阿富汗走出困境提供了契机。"
 AFG_rebuilding_the_state: "重建国家"
 AFG_rebuilding_the_state_desc: "塔利班政权垮台后，阿富汗国家重建的主要目标之一是从根本上恢复和重建国家。阿富汗经济衰退，几乎没有铺设道路或铁路，如今必须重建成为一个能够在世界秩序中占有一席之地的国家。"
 AFG_drafting_the_constitution: "起草宪法"
 AFG_drafting_the_constitution_desc: "宪法的签署标志着该国的一个重要转折点，因为它正式签署了保障人权的各项措施。"
 AFG_national_solidarity_program: "国家团结计划"
 AFG_national_solidarity_program_desc: "阿富汗国家团结计划是阿富汗政府的一项倡议，旨在重建和发展阿富汗境内约5000个村庄，计划在三年内分阶段投入9亿美元。该计划力求建立地方民主选举产生的机构，并监督重建工作。"
 AFG_reformist_path: "改革之路"
 AFG_reformist_path_desc: "改革之路的目的是用新事物取代旧事物，现在正是实施这一改革的最佳时机，因为阿富汗仍处于国家建设的初期阶段。"
 AFG_next_in_line_of_succession: "下一任继承人"
 AFG_next_in_line_of_succession_desc: "随着哈米德·卡尔扎伊的任期即将结束，必须有一位继任者来接替他。"
 AFG_sway_local_warlords: "撼动地方军阀"
 AFG_sway_local_warlords_desc: "自苏联入侵以来，阿富汗的领导权一直被地方军阀把持，要清除他们并非易事。相反，我们应该找到并联手一些关键的强人，以巩固我们的地位。"
 AFG_the_islamic_republic: "伊斯兰共和国"
 AFG_the_islamic_republic_desc: "随着阿富汗国家的逐渐消亡，共和国的新时代开始了，标志着我们国家的一个新起点和新形态。"
 AFG_the_mujahideen: "圣战者"
 AFG_the_mujahideen_desc: "圣战者组织，即阿富汗圣战者组织，是由前反抗军指挥官和军阀组成的广泛联盟，其中许多人支持前北方联盟。我们应该集中精力维持现状。"
 AFG_age_of_republican_leadership: "新时代领导者"
 AFG_age_of_republican_leadership_desc: "随着伊斯兰共和国的成立，我们应当逐步淘汰旧的军阀指挥官，代之以新的国防军军官。"
 AFG_islamic_democracy: "伊斯兰式民主"
 AFG_islamic_democracy_desc: "随着伊斯兰社会接管阿富汗，新的篇章仍在继续，希望未来也能如此。然而，现在不是休息的时候，因为军阀和帮派分子在阿富汗四处游荡，与塔利班势力结盟，构成威胁。"
 AFG_reinforce_the_government: "加强政府"
 AFG_reinforce_the_government_desc: "随着我们对国家南部地区的新控制，我们相信这是一个良好的开端，可以控制反对派并使我们的领导力为许多人所知。"
 AFG_agricultural_modernisation: "农业现代化"
 AFG_agricultural_modernisation_desc: "灌溉、机械化和耕作技术的现代化将提高我们农村省份的产量，并为国库带来来自农业部门的新收入来源。"
 AFG_the_farmer_and_their_rifle: "农夫和他们的步枪"
 AFG_the_farmer_and_their_rifle_desc: "阿富汗农村居民渴望血流成河、保卫家园，他们已成为国家的中坚力量。失去这个社区的支持将是导致我们垮台的第一张多米诺骨牌。"
 AFG_inheritor_of_afghanistan: "阿富汗继承人"
 AFG_inheritor_of_afghanistan_desc: "在我们的统治下，阿富汗才真正实现了和平。我们已经成为阿富汗国家的继承者，应该为此受到赞扬，而不是被世界大国忽视。"
 AFG_second_man_of_the_state: "国家第二号人物"
 AFG_second_man_of_the_state_desc: "作为前反抗军指挥官，阿塔对权力有着浓厚的兴趣。他已经成为阿富汗一位杰出的领导人，并且不回避与其他军阀发生大规模冲突。"
 AFG_dismantle_the_warlords: "瓦解军阀势力"
 AFG_dismantle_the_warlords_desc: "某些地区被暴徒和匪帮把持。为了真正转型为现代民族国家，我们必须努力解决军阀混杂的问题。"
 AFG_a_tolerant_state: "宽容之国"
 AFG_a_tolerant_state_desc: "阿富汗是一个多民族聚居的国家，我们必须信守承诺，把每个阿富汗人视为一个整体，团结一致。"
 AFG_naveen: "新阿富汗党"
 AFG_naveen_desc: "新阿富汗党是阿富汗的一个政党，由尤努斯·卡努尼领导。该党是在卡努尼脱离艾哈迈德·瓦利·马苏德领导的阿富汗民族运动后成立的。尤努斯·卡努尼的目标是延续北方联盟的理念。"
 AFG_new_class_of_jam_iat_reformers: "新一届伊斯兰促进会改革者"
 AFG_new_class_of_jam_iat_reformers_desc: "尤努斯·卡努尼代表了伊斯兰教社群改革派的新一代，他们更加拥抱伊斯兰教和传统价值观。这一群体倾向于采取更为温和的改革方式，注重渐进式变革而非激进的皈依。"
 AFG_counite_masouds_works: "继续马苏德的事业"
 AFG_counite_masouds_works_desc: "随着北方联盟的失败和马苏德领导的结束，我们仍然致力于维护北方联盟的精神，努力建设一个现代化的阿富汗。"
 AFG_foster_innovation: "促进创新"
 AFG_foster_innovation_desc: "作为前教育部长，尤努斯·卡努尼深知教育领域创新的迫切需要。"
 AFG_combat_electoral_corruption: "打击选举腐败"
 AFG_combat_electoral_corruption_desc: "在阿富汗，官员经常通过贿赂来聚敛财富并维持权力。从现在起，我们必须确保不再容忍选举舞弊。"
 AFG_empowering_provincial_governance: "增强省级治理能力"
 AFG_empowering_provincial_governance_desc: "赋予阿富汗省级治理权力至关重要。正如德国所证明的那样，分散治理使各地区能够进步并赶上全国其他地区。"
 AFG_centralise_the_apparatus_of_the_state: "集中国家机器"
 AFG_centralise_the_apparatus_of_the_state_desc: "集中化将加强我们的控制力，确保所有评论和反对意见都由我们直接管理。"
 AFG_expand_the_education_ministry: "扩大教育部"
 AFG_expand_the_education_ministry_desc: "扩大教育部将极大地有利于我们州，因为它可以培养更高技能的劳动力，并建设一个更加知识化的社会。"
 AFG_propose_a_new_constitution: "提出新宪法"
 AFG_propose_a_new_constitution_desc: "现行阿富汗宪法不符合现代标准，需要进行重大修改。"
 AFG_embezzle_foreign_funds: "挪用外国资金"
 AFG_embezzle_foreign_funds_desc: "挪用外国资金一直是我们与国会一道严密控制国家、维持治理的一种手段。"
 AFG_enforce_afghan_centralism: "实行中央集权"
 AFG_enforce_afghan_centralism_desc: "阿富汗人是一个乡村部落民族，历史上对任何形式的集权都持消极态度。但如果我们受到能做和不能做的事情的限制，我们的政府又怎么能发挥作用呢？我们必须坚定立场，推行集权。"
 AFG_urban_tribal_divisions: "让步协商会议领导人"
 AFG_urban_tribal_divisions_desc: "通过将我们的一些部落成员迁移到城市化地区，我们将能够赋予某些地区更大的自治权和对其地区的控制权，因为它们将更加有组织。"
 AFG_atlanticism: "大西洋主义"
 AFG_atlanticism_desc: "大西洋主义是指北美和欧洲之间密切合​​作的理念，这一理论在二战后兴起。阿富汗希望在发展和治理方面采用更西化模式。"
 AFG_arsenal_of_democracy: "民主兵工厂"
 AFG_arsenal_of_democracy_desc: "随着美国军火经济的蓬勃发展，我们应该利用这一优势，储备军火，为未来的挑战做好准备。"
 AFG_the_republic_survives_another_day: "共和国又幸存了一天"
 AFG_the_republic_survives_another_day_desc: "夜幕降临，白昼降临，阿富汗人民的旗帜依然高高飘扬。无论和平还是战争，我们已做好准备。有一件事是肯定的：这个共和国将坚持到最后一刻。"
 AFG_defenders_of_democracy: "民主捍卫者"
 AFG_defenders_of_democracy_desc: "从一个对民主概念缺乏了解的国家，到一个完全拥抱民主的新政权，这是史无前例的。我们必须履行自己的责任，不惜一切代价保护这个国家及其理想。"
 AFG_root_out_the_old_cabinet: "铲除旧内阁"
 AFG_root_out_the_old_cabinet_desc: "那些前任官员仍在议会制度中。我们必须解除他们的武装，揭露他们的欺诈行为。"
 AFG_moderate_islamism: "温和伊斯兰主义"
 AFG_moderate_islamism_desc: "温和伊斯兰主义指的是对伊斯兰教采取一种消极或传统的态度，与更激进和革命性的解读有所区别。"
 AFG_basej_e_milli: "绿色协议"
 AFG_basej_e_milli_desc: "国民阵线又名“阿富汗人民阵线”，是一个反塔利班、阿富汗民族主义和民主政党。它在倡导阿富汗的民主未来和民族团结方面发挥着重要作用。"
 AFG_knife_to_the_warlords: "向军阀开刀"
 AFG_knife_to_the_warlords_desc: "军阀祸害这个国家，这是一个过时的概念。他们声称以人民的名义行事，但我们都反对他们。"
 AFG_standardised_taxation: "标准化税收"
 AFG_standardised_taxation_desc: "标准化税收将使我们的经济从连年战争中恢复过来。"
 AFG_enlist_the_support_of_the_people: "争取人民的支持"
 AFG_enlist_the_support_of_the_people_desc: "争取人民的支持将会使共和国免于未来的威胁。"
 AFG_recraft_the_healthcare_system: "重塑医疗保健体系"
 AFG_recraft_the_healthcare_system_desc: "医院已经老旧，需要修复和修缮。我们必须尽自己的一份力量来解决这个问题。"
 AFG_local_organisation: "地方组织"
 AFG_local_organisation_desc: "我们必须团结起来，自力更生，而不是依赖世界其他国家的支持。"
 AFG_lift_the_press_restrictions: "解除新闻限制"
 AFG_lift_the_press_restrictions_desc: "自由独立的新闻界是充满活力的民主社会的基石。"
 AFG_progressive_tax: "累进税"
 AFG_progressive_tax_desc: "为确保财富和资源的公平分配，阿富汗采用累进税制。"
 AFG_return_of_dostum: "杜斯塔姆归来"
 AFG_return_of_dostum_desc: "阿富汗著名军事领导人、极具影响力的人物阿卜杜勒·拉希德·杜斯塔姆将军重返国家政治舞台。他以对乌兹别克斯坦军队的卓越指挥能力和战略才能而闻名。"
 AFG_mission_to_tehran: "访问德黑兰"
 AFG_mission_to_tehran_desc: "为了加强地区联盟并应对外部威胁，阿富汗正在向德黑兰派遣外交使团。通过加入伊朗领导的抵抗轴心，阿富汗旨在获得强大的盟友，增强其军事能力并巩固其地缘政治地位。"
 AFG_take_command_of_rabbanis_feyzabad_forces: "指挥拉巴尼的费扎巴德部队"
 AFG_take_command_of_rabbanis_feyzabad_forces_desc: "布尔汉努丁·拉巴尼驻扎在费扎巴德的部队对于控制阿富汗东北部地区至关重要。通过直接指挥这些部队，中央领导层旨在统一指挥结构，加强协调，并加强对这一战略要地的防御。"
 AFG_karim_khalilis_new_offensive: "卡里姆·哈利利的新攻势"
 AFG_karim_khalilis_new_offensive_desc: "著名领导人和战略家卡里姆·哈利利正在带头发起一场大胆的新攻势，以夺回关键领土并击退敌对势力。他的计划结合了游击战术、动员当地民兵以及与盟军的战略协调。"
 AFG_western_klep_tt1: "§Y劫持外援§!提供§Y额外收入§!$§G0.18§!B"
 AFG_state_northern_stronghold_dynamic_modifier: "安朱曼山口的大门"
 AFG_taliban_assault_on_taloqan: "塔利班袭击塔卢坎"
 AFG_state_battle_for_mazar_i_sharif_dynamic_modifier: "马扎里沙里夫攻势"
 AFG_increase_road_toll_tt: "增加通行费\n收费等级：[?AFG_toll_level]\n省份货币收益: $§G[?AFG_Toll_display_var]§!\n消费品: §Y[?ROOT.AFG_consumer_goods_factor_toll|%]§!"
 AFG_increase_road_toll_tt_desc: "通行费等级最多可提高五级，每次提高都会增加省际公路的交通收入，收入取决于车流量和货物贸易量。每提高一级，全国消费品价格就会上涨§Y2%§!，这反映了通行费对整体经济造成的负担。"
 AFG_lower_road_toll_tt: "减少通行费\n收费等级：[?AFG_toll_level]\n省份货币收益: $§G[?AFG_Toll_display_var]§!\n消费品: §Y[?ROOT.AFG_consumer_goods_factor_toll|%]§!"
 AFG_lower_road_toll_tt_desc: "降低收费等级相当于以该等级原本带来的收入为代价，返还了其所耗费的§Y2%§!消费品。收费等级不能低于第一等级。"
 AFG_toll_below_maximum_tt: "该省份通行费处于§R最高等级§!。"
 AFG_toll_above_minimum_tt: "该省份通行费处于§R最低等级§!。"
 AFG_info_box: "§G通行费§!\n收费等级：[?AFG_toll_level]\n省份货币收益: $§G[?AFG_Toll_display_var]§!\n全国通行费货币收益: $§G[?ROOT.additional_income_AFG_tolls_income1]§!\n全国消费品: §Y[?ROOT.AFG_consumer_goods_factor_toll|%]§!"
 AFG_info_box_desc_lore: "阿富汗的公路由塔利班等组织和地方军阀控制，他们利用连接中亚、伊朗和巴基斯坦的贸易路线收取通行费，以获取收入。这些通行费源于丝绸之路的传统，是塔利班政权和军阀的主要资金来源，控制关键道路对于权力和财富至关重要。"
 AFG_usa_equipment: "中情局参与"
 AFG_usa_equipment_desc: "美国人不喜欢塔利班目前所拥有的立足点，因此他们提出以低价向我们出售一些装备。"
 AFG_join_sco: "加入上海合作组织"
 AFG_join_sco_desc: "上合组织以中国和俄罗斯为首，是一个强调地区和平、安全、反恐和经济合作的组织。它能提供我国所需的许多资源，例如反恐演习和发展援助。为了国家的利益，我们应该加入上合组织。"
 AFG_the_western_kleptocracy_desc: "改变？谁需要改变？我们有西方的援助，局势会按计划好转的。"
 AFG_liberal_society_desc: "放松宗教机构的控制，让喀布尔拥有了新闻媒体、集市和公共讨论的平台。贸易伙伴因此更加重视我们，尽管我们为坚守底线所耗费的政治资本是实实在在的。"
 AFG_preserve_democracy: "维护民主"
 AFG_preserve_democracy_desc: "新闻自由得到保障，法院不受干扰，共和国才真正有机会在下一次危机考验之前扎根发展。"
 AFG_indian_support_and_arms_trade: "印度的支持和武器支持"
 AFG_indian_support_and_arms_trade_desc: "印度人已同意支持我们的国家并武装我们以对抗敌人。"
 AFG_establishing_supply_lines: "建立补给线"
 AFG_establishing_supply_lines_desc: "通过建立良好且维护良好的补给线，我们的部队将获得足够的补给以继续战斗。"
 AFG_russian_technical_specialists: "俄罗斯技术专家"
 AFG_russian_technical_specialists_desc: "我们从[SOV.GetFlag]俄罗斯引进了专家来负责我们的机械化部队。"
 AFG_the_shura_system_idea: "协商会议体系"
 AFG_the_shura_system_idea_desc: "北方联盟的协商会议体系是一种传统的议会制治理模式，根植于部落和社群的决策实践。该制度汇集了军事领袖、部落长老和有影响力的人物，共同商议并做出集体决策。协商会议体系增强了联盟的团结，确保北方联盟内部各派系在战略和政治事务中都有代表和发言权。"
 AFG_civilian_exodus_taloqan: "平民逃离塔卢坎"
 AFG_civilian_exodus_taloqan_desc: "塔卢坎附近的战事迫使成千上万个家庭向北和向西逃亡。难民营使我们本就捉襟见肘的资源更加紧张，但难民们也把整个省份的资源都带了过来，而且难民人数的减少也减轻了我们的物资供应压力。"
 AFG_iranian_airbridge: "伊朗空中桥梁"
 AFG_iranian_airbridge_desc: "塔利班占领喀布尔后，伊朗对北方联盟的援助激增。伊朗在马什哈德和阿富汗巴格拉姆和库利亚布空军基地之间建立了空中桥梁，向北方联盟提供大量武器。据报道，1997年一天内，有13架伊朗飞机降落在巴格拉姆，伊朗至今仍被怀疑通过塔吉克斯坦运送了700吨武器。"
 AFG_junbishis: "阿富汗民族伊斯兰运动"
 AFG_junbishis_desc: "§R在阿卜杜勒·拉希德·杜斯塔姆流亡期间，我们无法手动提升§W[Conservative_L]§!的声望§!\n\n阿富汗民族伊斯兰军，通常称为阿富汗民族伊斯兰运动，是北方联盟中的主要派系，主要由乌兹别克族人组成。该组织最近被塔利班部队赶出其据点马扎里沙里夫，但阿富汗民族伊斯兰运动仍在北方联盟中发挥重要作用。该组织由阿卜杜勒·拉希德·杜斯塔姆将军领导，他是一位著名的军阀，过去曾与北方联盟其他成员不和，流亡期间与北方联盟其他成员的关系紧张。"
 AFG_northern_alliance_taloqan_siege: "塔卢坎围城"
 AFG_northern_alliance_taloqan_siege_desc: "在近代历史上，塔卢坎曾是圣战派系著名领导人艾哈迈德·沙阿·马苏德在抵抗苏联军队期间的战略指挥部。此后，在1997年马扎里沙里夫市被塔利班部队占领后，塔卢坎成为 [AFG.GetFlag] [AFG.GetNameDefCap] 的指挥部。"
 AFG_idea_opium_economy: "阿富汗鸦片经济"
 AFG_idea_opium_economy_desc: "很大一部分阿富汗农民以种植和销售罂粟为生。大片罂粟田占据了我国大量耕地。"
 AFG_idea_opium_barons: "阿富汗鸦片大亨"
 AFG_idea_opium_barons_desc: "阿富汗很大一部分农民以种植和出售罂粟为生，这些罂粟用于生产鸦片。大片的罂粟田占据了我们大量的耕地。政府的新政策导致了一个庞大的鸦片大亨集团运作着多个大型贸易网络。这些鸦片大亨对政府的影响力不容置疑。"
 AFG_idea_afghan_defence: "纵深防御措施"
 AFG_idea_afghan_defence_desc: "我们的国家正陷入内战。虽然我们节节败退，但绝不会再后退一步！"
 AFG_idea_un_troops: "联合国维和部队"
 AFG_idea_un_troops_desc: "我们已请求在我国部署联合国维和人员，以期为我国带来稳定。"
 AFG_political_events.1.t: "[AFG.GetNameDef]需求武器"
 AFG_political_events.1.d: "[AFG.GetNameDef]已派遣一名使者前往[ROOT.capital.GetName]进行谈判，以便我们为他们提供开展战斗行动所需的装备。"
 AFG_political_events.1.a: "我们会接受"
 AFG_political_events.1.b: "不是现在"
 AFG_political_events.2.t: "[FROM.GetNameDef]拒绝了我们的武器要求"
 AFG_political_events.2.d: "[FROM.GetNameDef]拒绝了我们的武器要求。我们不会因拒绝而灰心，并会坚持我们当前的目标。"
 AFG_political_events.2.a: "向前"
 AFG_political_events.3.t: "[FROM.GetNameDef]签署武器运输协议"
 AFG_political_events.3.d: "我们对[FROM.GetNameDef]提供我们期待已久的急需设备表示深切的谢意。"
 AFG_political_events.3.a: "太棒了！"
 AFG_political_events.4.t: "第一次阿富汗选举"
 AFG_political_events.4.d: "今天，计票工作宣告结束。我们终于要选出阿富汗的首任领导人了。"
 AFG_political_events.4.a: "哈米德·卡尔扎伊政府"
 AFG_political_events.4.b: "新阿富汗党"
 AFG_political_events.4.c: "伊斯兰促进会"
 AFG_political_events.4.e: "萨利赫政府"
 AFG_political_events.0.t: "阿塔建立军事二元体制"
 AFG_political_events.0.d: "前圣战者抵抗运动指挥官阿塔·穆罕默德·努尔已率军进入喀布尔，要求控制所有军队的某些级别。由于大多数人都支持他的事业，我们的选择至少可以说非常有限。"
 AFG_political_events.0.a: "我们无能为力"
 AFG_events.8.t: "[AFG.GetNameDef]请求我们的保护"
 AFG_events.8.d: "历经数十年的动荡，阿富汗政府担心战火重燃或外部干涉与入侵，[AFG.GetNameWithFlag]总统[AFG.GetLeader]已访问白宫，并向我国总统[USA.GetLeader]寻求签署防务条约。若我们同意提供保护，将能确保其处于我国势力范围内，但也需承担保卫[AFG.GetNameWithFlag]免受外部威胁的义务，并协助维持该国稳定，尤其是应对£GFX_AFG_salafist_jihadism 塔利班叛乱。考虑到我国现状，我们是否应与[AFG.GetLeader]签署防务条约？"
 AFG_events.8.a: "同意保护他们"
 AFG_events.8.b: "我们没时间做这个"
 AFG_events.9.t: "[USA.GetNameDef]已同意保护我们"
 AFG_events.9.d: "得益于我们在外交上的审慎努力，[USA.GetNameWithFlag]的总统[USA.GetLeader]已正式与我国总统[AFG.GetLeader]签署了防务条约。通过签署此防务条约，[FROM.GetNameWithFlag]不仅将保护我们免受外部侵略，还将协助我们维持内部稳定。"
 AFG_events.9.a: "棒极了！"
 AFG_events.10.t: "[USA.GetNameDef]拒绝签字！"
 AFG_events.10.d: "尽管我国总统[AFG.GetLeader]为寻求安全援助访问了[USA.GetNameWithFlag]，但[USA.GetLeader]显然对任何形式的条约都闭口不谈。[USA.GetLeader]曾在新闻发布会上表示：“我们将始终捍卫阿富汗的自由、民主与人权。”但显而易见的是，[USA.GetLeader]的承诺仅停留在口头上，我们只能独自捍卫自己的国家。"
 AFG_events.10.a: "真是一次灾难性的访问……"
 AFG_events.11.t: "[AFG.GetNameDef]请求我们的保护"
 AFG_events.11.d: "经过数十年的动乱，阿富汗政府担心战争重燃或外部干涉和入侵，[AFG.GetNameWithFlag]总统[AFG.GetLeader]已访问中南海并与总书记[CHI.GetLeader]洽谈签署防御条约。如果我们同意保护他们，我们将能够确保他们在我们的势力范围内，但我们也有义务保卫[AFG.GetNameWithFlag]免受外部威胁，并协助维护国家稳定，特别是打击 £GFX_AFG_salafist_jihadism 塔利班叛乱。考虑到我们国家的情况，我们是否应该与[AFG.GetLeader]签署防御条约？"
 AFG_events.11.a: "又一个钢铁兄弟！"
 AFG_events.11.b: "我们没有任何多余的资源可以用于条约！"
 AFG_events.12.t: "[CHI.GetNameDef]已同意保护我们"
 AFG_events.12.d: "得益于我们的外交努力，[CHI.GetNameWithFlag]的总书记[CHI.GetLeader]已与我国总统[AFG.GetLeader]正式签署了共同防御条约。通过这项条约，[FROM.GetNameWithFlag]不仅将保护我们免受外部侵略，还将协助维护我国内部稳定。"
 AFG_events.12.a: "棒极了！"
 AFG_events.13.t: "[CHI.GetNameDef]拒绝签字！"
 AFG_events.13.d: "尽管我国总统[AFG.GetLeader]为寻求安全援助访问了[CHI.GetNameWithFlag]，但[CHI.GetLeader]显然对任何形式的条约都讳莫如深。[CHI.GetLeader]曾对我国总统表示：“我们将始终致力于维护地区安全与稳定。”但显而易见的是，[CHI.GetLeader]的承诺仅停留在口头上，我们只能独自捍卫自身安全。"
 AFG_events.13.a: "真是令人失望"
 AFG_events.14.t: "[AFG.GetNameDef]公开谴责杜兰线"
 AFG_events.14.d: "就在不久前，[AFG.GetNameWithFlag]的总统[AFG.GetLeader]宣布[AFG.GetNameWithFlag]永远不会承认英国人在20世纪任意设立的杜兰德防线为两国边界，并大声声明:\"我们现在可能无法收回我们神圣的普什图土地，但我们的后代一定会收回这片土地，这片土地理应属于我们。时间会证明一切！\"很明显，[AFG.GetNameWithFlag]现在正在变成对我们国家的敌对外交政策。"
 AFG_events.14.a: "他们这么做根本毫无道理！"
 AFG_events.15.t: "布尔汉丁·拉巴尼遇刺"
 AFG_events.15.d: "今晚，布尔汉丁·拉巴尼在喀布尔家中遭遇自杀式爆炸袭击身亡，今天也是他71岁的生日。两名伪装成塔利班代表的男子走近他，向他致以拥抱，其中一人引爆了藏在头巾里的炸药。这名自杀式炸弹袭击者自称是塔利班指挥官，声称带来了巴基斯坦境内的塔利班领导层“非常重要且积极的信息”，并表示塔利班希望与拉巴尼商讨和平事宜。我国政府高级和平委员会的另外四名成员也在爆炸中丧生。我方消息源证实，藏匿在巴基斯坦奎达的塔利班领导机构“奎达协商会议”应对此次暗杀事件负责。\n\n拉巴尼在卸任政府要职后，一直担任我国高级和平委员会主席。在此期间，他成功说服了数百名塔利班武装分子和平放下武器。此次暗杀对我国的和平进程造成重大打击，此后很难再找到具有他这般威望的人选来担任这一职务。"
 AFG_events.15.a: "举行国葬。"
 AFG_events.16.t: "[AFG.GetNameDef]寻求承认中立地位"
 AFG_events.16.d: "最近[AFG.GetNameDef]选择走中立道路，以成为一个永久中立国。他们已经便显出愿意履行作为永久中立国的义务的意愿，但能否兑现尚待观察。\n\n阿富汗政府目前正寻求我国成为其中立国地位的担保国。如果我们同意，我们将有义务在阿富汗遭受入侵时提供保护。如果我们拒绝，其他国家可能会提供担保，而我们也不会因此遭受任何损失。"
 AFG_events.16.a: "同意保证其作为中立国的地位"
 AFG_events.16.b: "我们没有时间管阿富汗"
 AFG_events.17.t: "[FROM.GetNameDef]保证我们的中立地位"
 AFG_events.17.d: "[FROM.GetAdjective]政府的声明表明，[FROM.GetNameDef]愿意保证我们的中立地位，并将在我国遭受外部入侵时前来防卫。\n\n 这是一项重大成就，因为我们已获得至少一个联合国安理会常任理事国承认的中立地位。"
 AFG_events.17.a: "棒极了！"
 AFG_events.18.t: "阿富汗人民反抗塔利班"
 AFG_events.18.d: "在“持久自由行动”之后，多个部落和少数民族民兵组织发动了针对塔利班的起义，特别是在赫拉特地区。在美国和伊朗的协助下，这些民兵组织从塔利班手中夺取了几个地区的控制权，并加入了北方联盟的指挥体系。\n\n当地居民用枪庆祝起义，一些庆祝活动甚至包括“屋顶上跳舞”和鸣喇叭。北方联盟的主要指挥官之一、人称“赫拉特之狮”的穆罕默德·伊斯梅尔·汗赦免了前塔利班战士，但警告说，如果这些战士再次拿起武器，别怪他不客气。"
 AFG_events.18.a: "胜利近在眼前！"
 AFG_news.7.t: "[AFG.GetNameDef]宣布对巴基斯坦领土的主张"
 AFG_news.7.d: "就在不久前，[AFG.GetNameWithFlag]的总统[AFG.GetLeader]宣布[AFG.GetNameWithFlag]永远不会承认英国人在 20 世纪任意设立的杜兰德线为边界在两国之间，并大声表态:\"我们现在可能无法收回我们神圣的普什图土地，但我们的后代一定会收回这片土地，这片土地理应属于我们。时间会证明一切！\" [PAK.GetNameWithFlag]的总统[PAK.GetLeader]回应拒绝了[AFG.GetLeader]的所有主张，并强烈批评这一行动，称\"[AFG.GetLeader]的敌对外交行动只会进一步损害我们两国的关系。\"并呼吁阿富汗政府尊重国际法。很明显，两国的外交关系进一步恶化。"
 AFG_news.7.a: "让我们看看接下来会发生什么"
 AFG_news.8.t: "阿富汗政变"
 AFG_news.8.d: "由于中央政府腐败，经济困顿与民生凋敝，许多失去生计并对现状不满的阿富汗人加入了希克马蒂亚尔领导的 £GFX_AFG_kingdom “阿富汗伊斯兰党”。一批长期未领薪饷的阿富汗军官发动政变，推翻共和政府，宣布暂停现行阿富汗宪法并暂时实施军事管制。曾在上世纪90年代两度出任阿富汗总理的古勒卜丁·希克马蒂亚尔正式结束流亡生涯，回国担任阿富汗新总统。希克马蒂亚尔承诺将根除腐败，重振经济，带领阿富汗人民开启新篇章。针对此次政变，塔利班发言人发表声明称，“我们是真正的阿富汗人，我们将继续扳倒‘喀布尔屠夫’希克马蒂亚尔”。"
 AFG_news.8.a: "永恒战争的新篇章……"
 AFG_news.9.t: "[AFG.GetNameDef]向城市部署军队"
 AFG_news.9.d: "由于[AFG.GetLeader]领导层近期推行的激进政策，例如压制政治自由、个人自由、塔利班式伊斯兰教法并削弱部落影响力。一场针对执政政府的大规模抗议活动已经开始，[AFG.GetLeader]政府通过向城镇部署军队作出回应，部分抗议者被阿富汗国民军士兵或阿富汗国家警察部队击毙。看来[AFG.GetNameDef]正滑向极权主义的深渊。"
 AFG_news.9.a: "这就是阿富汗的日常生活……"
 AFG_news.10.t: "布尔汉丁·拉巴尼遇刺"
 AFG_news.10.d: "布尔汉丁·拉巴尼今晚在喀布尔的家中遭遇自杀式炸弹袭击身亡。两名伪装成塔利班代表的自杀式炸弹袭击者声称希望与拉巴尼讨论和平事宜，在上前拥抱时，其中一人引爆了藏在头巾内的炸药。阿富汗高级和平委员会另有四名成员也在爆炸中遇难。\n\n拉巴尼卸任政府要职后，一直担任阿富汗高级和平委员会主席。在此期间，他成功说服了数百名塔利班武装分子和平放下武器。他的遇刺是对阿富汗和平进程的重大打击。"
 AFG_news.10.a: "不幸的消息。"
 AFG_news.11.t: "阿丽亚娜航空公司805号航班劫机事件"
 AFG_news.11.d: "由阿里·萨菲和穆罕默德·萨菲兄弟领导的九名阿富汗男子为逃离塔利班政权，劫持了阿丽亚娜阿富汗航空公司的805号航班，这是一架注册号为YA-FAY的波音727客机，机上载有180名乘客和7名机组人员。该航班原为从喀布尔飞往马扎里沙里夫机场的国内航班。\n\n劫机者胁迫机组人员经停塔什干、阿克托别和莫斯科后，飞往英国伦敦斯坦斯特德机场。飞机围困状态持续至2月10日。由于劫机者将于明年受审，其是否会被定罪尚未可知。"
 AFG_news.11.a: "我们应该用我们的米格拦截他们。"
 AFG_news.12.t: "阿丽亚娜航空公司805号航班劫机事件"
 AFG_news.12.d: "由阿里·萨菲和穆罕默德·萨菲兄弟领导的九名阿富汗男子为逃离塔利班政权，劫持了阿丽亚娜阿富汗航空公司的805号航班，这是一架注册号为YA-FAY的波音727客机，机上载有180名乘客和7名机组人员。该航班原为从喀布尔飞往马扎里沙里夫机场的国内航班。\n\n劫机者胁迫机组人员经停塔什干、阿克托别和莫斯科后，飞往英国伦敦斯坦斯特德机场。飞机围困状态持续至2月10日。由于劫机者将于明年受审，其是否会被定罪尚未可知。"
 AFG_news.12.a: "有趣"
 AFG_news.12.b: "恐怖主义是人类的祸害。"
 AFG_news.13.t: "伊朗将难民遣返回阿富汗"
 AFG_news.13.d: "在与联合国难民署达成协议后，伊朗启动了一项遣返计划，将在接下来的三周内将7700名阿富汗难民送回他们的家园。"
 AFG_news.13.a: "这场战争会有尽头吗？"
 AFG_news.14.t: "阿富汗战争导致数千人陷入饥荒"
 AFG_news.14.d: "世界粮食计划署报告称，坎大哈省和扎布尔省的干旱情况已十分危急。库奇族人失去了多达80%的牛，为收集雨水而修建的灌溉系统也已干涸。杏子和杏仁树枯萎凋零，颗粒无收。骆驼正陆续死亡。自二月起，世界粮食计划署一直在为该地区的30,000个家庭提供粮食援助，并计划于五月再增加1万户。为鼓励阿富汗民众留在村庄，该组织还向当地居民额外提供面粉作为激励。"
 AFG_news.14.a: "阿富汗人民需要我们。"
 AFG_events.32.t: "塔卢坎城堡已陷落"
 AFG_events.32.d: "塔利班的残酷占领导致大批平民逃往伊玛目萨希布和潘杰希尔山谷。在残酷的围攻造成数百名平民丧生后，我们的士兵阻止了塔利班向该市北部和东部推进，但未能收复该市。我们放弃了该市的北方联盟总部，将我们的行动基地迁至法扎巴德。"
 AFG_events.32.a: "黑暗的一天"
 AFG_events.31.t: "塔卢坎继续战斗"
 AFG_events.31.d: "在经历了残酷的围攻之后，塔利班面临失败。这次胜利呼应了我们以前取得的胜利的坚韧。让这成为塔利班最终灭亡的又一步，因为“塔卢坎是真主的宝藏之地。这些宝藏不是金银，而是那些应该承认真主的人。”"
 AFG_events.31.a: "黑暗的一天"
 AFG_investment.1.t: "[AFG.GetNameDef]邀请我们投资其项目"
 AFG_investment.1.desc: "[AFG.GetNameWithFlag] 政府刚刚从与塔利班的战争中恢复过来，他们邀请我们投资他们国家的一些项目。不过，是否投资取决于我们。如果我们选择投资，我们可以对他们的政府产生一些影响，如果阿富汗的恐怖威胁仍然很高，我们最好不要冒险。"
 AFG_investment.1.a: "投资他们的基础设施！"
 AFG_investment.1.b: "投资他们的民用工业！"
 AFG_investment.1.c: "投资他们的服务行业！"
 AFG_investment.1.d: "我们最好还是别冒险了。"
 AFG_investment.2.t: "[FROM.GetNameDef]投资我国基础设施！"
 AFG_investment.2.d: "经过数日谈判，[FROM.GetNameWithFlag]已同意对我国基础设施进行投资，以换取一些微小让步。这项投资将使我国农村人口受益。"
 AFG_investment.2.a: "我们非常感谢他们的帮助！"
 AFG_investment.3.t: "[FROM.GetNameDef]投资我国民用工业！"
 AFG_investment.3.d: "经过几天的谈判，[FROM.GetNameWithFlag]已同意帮助我们建立一些民用工厂，以换取一些小的让步。这项投资将有利于我国的工业部门并促进国家的现代化。"
 AFG_investment.3.a: "我们非常感谢他们的帮助！"
 AFG_investment.4.t: "[FROM.GetNameDef]投资我国服务业！"
 AFG_investment.4.d: "经过数日谈判，[FROM.GetNameWithFlag]已同意在我国投资建设一批办公园区以换取我方少量让步。这项投资将有利于我国金融业发展，并推动国家现代化进程。"
 AFG_investment.4.a: "我们非常感谢他们的帮助！"
 AFG_investment.5.t: "[FROM.GetNameDef]拒绝投资！"
 AFG_investment.5.d: "经过几天的谈判，[FROM.GetNameWithFlag]拒绝了我们的投资邀请，理由是我们国家的商业环境还不够安全，将仔细评估与我们的未来投资交易。"
 AFG_investment.5.a: "看来我们还得再加把劲！"
 AFG_taliban_insurgency.0.t: "塔利班叛乱的开始"
 AFG_taliban_insurgency.0.d: "塔利班主力部队溃败后，其残余势力分裂成众多分支，在阿富汗各地发动游击战，并犯下令人发指的恐怖袭击。据估计，彻底平息这场叛乱需要数年时间，但如果我们不采取行动，我们的国家将永远无法实现稳定。"
 AFG_taliban_insurgency.0.a: "该开始工作了！"
 AFG_taliban_insurgency.1.t: "成功突袭塔利班藏身处"
 AFG_taliban_insurgency.1.d: "多亏了我们英勇的突击队，我们发现的塔利班藏身处已被摧毁，部分塔利班武装分子试图抵抗，但被我们的突击队击毙，而大多数人选择投降，只有极少数人逃脱了正义的制裁。总的来说，这次行动取得了圆满成功！"
 AFG_taliban_insurgency.1.a: "棒极了！"
 AFG_taliban_insurgency.2.t: "突袭失败"
 AFG_taliban_insurgency.2.d: "这次突袭未能圆满完成，对我们的反恐突击队造成了巨大打击。塔利班似乎事先知道了我们的突袭计划，并对我们的一些车队发动了先发制人的攻击，在我们必须前往的路线上埋设了简易爆炸装置，并在爆炸发生后伏击了我们的突击队员。结果不幸有几名突击队员丧生。\n\n在汇报中，一些军事将领怀疑行动组织者中可能存在同情者，他们可能将计划泄露给了塔利班，汇报报告还批评了政府的腐败，这可能导致突击队员丧生。我们必须反思这次失败，并从中吸取教训！"
 AFG_taliban_insurgency.2.a: "愿我们的英雄安息！"
 AFG_taliban_insurgency.3.t: "空袭成功"
 AFG_taliban_insurgency.3.d: "好消息！我军一架由我军一名技术娴熟的飞行员驾驶的反叛乱飞机，根据我军情报机构提供的坐标，成功摧毁了一个塔利班营地。该塔利班营地被彻底摧毁，营地内许多塔利班武装分子被击毙。\n\n这一成功表明了我国情报机构内部安全部门的有效性，并证明了技术在未来的反叛乱行动中至关重要。"
 AFG_taliban_insurgency.3.a: "大成功！"
 AFG_taliban_insurgency.4.t: "空袭失败导致平民伤亡"
 AFG_taliban_insurgency.4.d: "糟糕的消息！我们的空军根据情报部门提供的坐标轰炸了目标，但现在很明显，炸弹击中了民用目标，导致无辜平民丧生，而非预期塔利班战斗人员。\n\n当地居民正在处于悲痛之中，并对这次失败的行动感到愤怒，据报道该地区已经发生了抗议活动。我们必须审查这次行动失败的原因，以便向我们的公民做出解释。"
 AFG_taliban_insurgency.4.a: "一场悲剧！"
 AFG_taliban_insurgency.5.t: "飞机被塔利班武装分子击落"
 AFG_taliban_insurgency.5.d: "空袭行动传来噩耗！我们的一架反叛乱飞机被塔利班武装分子用肩扛式防空导弹击落；飞行员因此丧生。\n\n这次行动失败表明，我们需要重组空军以应对未来的行动，并更好地获取塔利班目标的情报。"
 AFG_taliban_insurgency.5.a: "英勇的飞行员，安息吧！"
 AFG_taliban_insurgency.6.t: "团结宣传的成功"
 AFG_taliban_insurgency.6.d: "由于我们开展了团结宣传工作，一些塔利班武装分子来到我们的警察和军事检查站放下武器，一些人拥抱了我们的士兵和当地警察。我们的士兵和警察没有找他们太多麻烦，反而给许多放下武器的塔利班武装分子一些过路费，让他们回家。这提高了公众对政府的信任度和民族团结。"
 AFG_taliban_insurgency.6.a: "成功的发展！"
 AFG_taliban_insurgency.7.t: "团结宣传失败"
 AFG_taliban_insurgency.7.d: "我们最近的团结宣传工作没有取得积极的成果，这让我们的政府非常失望。一些塔利班底层指挥官表示，塔利班领导层认为当前的阿富汗政府是一个盗匪政府，是外国政府的傀儡，根本不代表阿富汗民族。他们认为自己才是真正的阿富汗人。"
 AFG_taliban_insurgency.7.a: "也许我们需要做更多的事情……"
 AFG_taliban_insurgency.8.t: "消灭塔利班叛乱"
 AFG_taliban_insurgency.8.d: "几个小时前，阿富汗政府正式确认已成功剿灭塔利班叛乱分子。根据阿富汗政府公布的消息，绝大多数塔利班武装分子已经和平放下武器，返回家园。\n\n少数顽固的塔利班武装分子已越过阿巴边境逃往巴基斯坦部落地区，并加入了当地武装组织。由于阿富汗政府在阿巴边境已经建立了足够的安全措施，盘踞在巴基斯坦的武装分子不太可​​能再次越过边境渗透。"
 AFG_taliban_insurgency.8.a: "持久的冲突终于结束了吗？"
 AFG_taliban_insurgency.10.t: "塔利班发动大规模叛乱"
 AFG_taliban_insurgency.10.d: "塔利班最近袭击次数激增，暴力事件增多，这让塔利班有机会再次将叛乱升级为内战。塔利班占领了大片农村地区，成为西南部的主要据点，其他一些农村地区也落入了他们的统治。\n\n阿富汗国民军的一小部分士兵已经开小差，其中一些逃兵加入了塔利班，大多数人选择留下来抵抗塔利班，因为他们害怕被塔利班消灭。\n\n国际社会是否会支持我们仍不确定，但我们必须团结我们的士兵，为胜利而战。"
 AFG_taliban_insurgency.10.a: "我们别无选择，只能战斗！"
 AFG_taliban_insurgency.11.t: "塔利班发动大规模叛乱"
 AFG_taliban_insurgency.11.d: "塔利班最近袭击次数激增，暴力事件增多，这让塔利班有机会再次将叛乱升级为内战。塔利班占领了大片农村地区，成为西南部的主要据点，其他一些农村地区也落入了他们的统治。\n\n阿富汗国民军的一小部分士兵已经开小差，其中一些逃兵加入了塔利班，大多数人选择留下来抵抗塔利班，因为他们害怕被塔利班消灭。\n\n阿富汗领导人[AFG.GetLeader]宣布将镇压叛乱，并承诺将战斗到和平到来。"
 AFG_taliban_insurgency.11.a: "阿富汗再次处于战争状态……"
 AFG_taliban_insurgency.14.t: "阿富汗局势"
 AFG_taliban_insurgency.14.d: "我们知道阿富汗政府允许我们在其境内驻军，但我们的军事情报机构警告说，塔利班目前正在阿富汗各地发动叛乱，还有许多其他恐怖组织正利用阿富汗的动荡局势。恐怖威胁已达到十分严峻的程度，可能对驻阿美军构成真正的危险。\n\n如果我们继续在阿富汗维持驻军，我们的军队很可能成为塔利班和其他活跃在该国的恐怖组织的袭击目标。然而，如果我们选择留在阿富汗，我们可以选择协助阿富汗政府军开展反叛乱行动。如果我们选择这样做，我们的军队可以获得宝贵的经验，例如不同的反叛乱和反游击战战术，并能保护我们在阿富汗的公民。\n\n[ROOT.GetLeader]，如果您选择继续在阿富汗驻军，我们不会阻止您，但请仔细考虑一下，这样做是否真的值得冒这个险。"
 AFG_taliban_insurgency.14.a: "我们将为阿富汗的反叛乱努力做出贡献"
 AFG_taliban_insurgency.14.b: "最好不要拿我们军人的生命冒险。"
 AFG_taliban_insurgency.15.t: "[FROM.GetNameDef]加入我们的斗争"
 AFG_taliban_insurgency.15.d: "[FROM.GetLeader]，[FROM.GetNameDef]的领导人已通知我国政府，驻扎在我国的[FROM.GetAdjective]部队愿意加入我们的反叛乱斗争中塔利班除了保护他们在我国境内的公民。\n\n此外，[FROM.GetName]还将提供安全援助，例如爆炸物探测装置和其他更先进的军事装备。"
 AFG_taliban_insurgency.15.a: "我们很感谢你们的帮助！"
 AFG_taliban_insurgency.16.t: "[FROM.GetNameDef]开始撤军"
 AFG_taliban_insurgency.16.d: "[FROM.GetLeader]，[FROM.GetNameDef]的领导人已通知我们政府，驻扎在我国的[FROM.GetAdjective]部队已完成任务，士兵们正在返回家园。\n\n我国[FROM.GetAdjective]部队的指挥官已经开始与我们的指挥官进行基地移交程序。"
 AFG_taliban_insurgency.16.a: "再见！"
 AFG_taliban_insurgency.17.t: "成功突袭塔利班藏身处"
 AFG_taliban_insurgency.17.d: "多亏了我们英勇的突击队，我们发现的塔利班藏身处已被摧毁，部分塔利班武装分子试图抵抗，但被我们的突击队击毙，而大多数人选择投降，只有极少数人逃脱了正义的制裁。总的来说，这次行动取得了圆满成功！"
 AFG_taliban_insurgency.17.a: "棒极了！"
 AFG_taliban_insurgency.18.t: "突袭失败"
 AFG_taliban_insurgency.18.d: "这次突袭未能圆满完成，对我们的反恐突击队造成了巨大打击。塔利班似乎事先知道了我们的突袭计划，并对我们的一些车队发动了先发制人的攻击，在我们必须前往的路线上埋设了简易爆炸装置，并在爆炸发生后伏击了我们的突击队员。结果不幸有几名突击队员丧生。\n\n在汇报中，一些军事将领怀疑行动组织者中可能存在同情者，他们可能将计划泄露给了塔利班，汇报报告还批评了政府的腐败，这可能导致突击队员丧生。我们必须反思这次失败，并从中吸取教训！"
 AFG_taliban_insurgency.18.a: "安息吧！"
 AFG_taliban_insurgency.21.t: "无人机空袭成功"
 AFG_taliban_insurgency.21.d: "我们对塔利班的无人机空袭取得了成功！我们的无人机成功定位、打击并摧毁了城市区域附近的几个塔利班藏身处，严重削弱了他们在该地区的军事能力，并暂时使其地方指挥体系陷入完全混乱。\n\n尽管当地民众最初对无人机空袭感到恐惧，但如今他们正在庆祝塔利班叛乱分子的撤退，至少目前如此。"
 AFG_taliban_insurgency.21.a: "无人机是战争的未来！"
 AFG_taliban_insurgency.22.t: "无人机空袭失败导致平民伤亡"
 AFG_taliban_insurgency.22.d: "今天，我们的一架无人机在居民区附近锁定并摧毁了一处疑似塔利班藏身点，但最新情报显示，目标建筑实际上是一栋平民居住的小型公寓楼。\n\n媒体记者已开始报道此事，多个团体都在谴责我们卷入这场战争。"
 AFG_taliban_insurgency.22.a: "这是一个技术错误！"
 AFG_taliban_insurgency.23.t: "轰炸行动成功"
 AFG_taliban_insurgency.23.d: "情报显示，今天我方一架战略轰炸机摧毁了隐藏在阿富汗东部山区的塔利班隧道群。\n\n我们成功的轰炸行动正开始瘫痪塔利班在该国偏远地区的行动，其基础设施的崩溃将迫使塔利班最终投降。"
 AFG_taliban_insurgency.23.a: "圣战分子将领教我们空中力量的厉害！"
 AFG_taliban_insurgency.24.t: "误炸导致平民伤亡"
 AFG_taliban_insurgency.24.d: "今天发生了一起灾难性事件！\n\n我们的空军对阿富汗东部山区进行了轰炸，直到后来才发现该区域并无塔利班营地，实际上只是山间的一个小村落。由于我们的轰炸，整个村庄被彻底摧毁。\n\n我们的空袭行动的可靠性已受到严重质疑。政界和军方高层正被指控对阿富汗人民犯下战争罪。"
 AFG_taliban_insurgency.24.a: "这真可怕！"
 AFG_taliban_insurgency.25.t: "[FROM.GetNameDef]提供技术设备"
 AFG_taliban_insurgency.25.d: "[FROM.GetAdjective]政府发给我们领导层的消息称，[FROM.GetNameDef]将为我们提供一些反叛乱技术设备，包括可安装在高速公路或门口的爆炸物探测设备、经过专门训练可以探测隐藏爆炸物的警犬以及其他电子设备，以提高我们军队和警察对付塔利班叛乱的效率。\n\n这些设备预计将在一个月内运抵，有望至少在短时间内抑制塔利班叛乱的增长。"
 AFG_taliban_insurgency.25.a: "我们很感谢你们的帮助！"
 AFG_taliban_attack.0.t: "塔利班武装分子袭击当地警察局"
 AFG_taliban_attack.0.d: "今天，一伙塔利班武装分子毫无预警地伏击了我国政府的一处警察检查站。我方警力显然毫无准备，措手不及，但在接到上级撤离命令前一直英勇抵抗。\n\n塔利班武装分子占领检查站后，军方接到通报前来支援警方。然而检查站军械库内的武器已被塔利班夺取。此次交火中，我方军警击毙数名塔利班武装分子，但警方也有数名英勇警员牺牲。"
 AFG_taliban_attack.0.a: "他们会为此付出代价！"
 AFG_taliban_attack.1.t: "阿富汗塔利班袭击警察局"
 AFG_taliban_attack.1.d: "今天，一伙塔利班武装分子毫无预警地伏击了我国政府的一处警察检查站。我方警力显然毫无准备，措手不及，但在接到上级撤离命令前一直英勇抵抗。\n\n塔利班武装分子占领检查站后，军方接到通报前来支援警方。然而检查站军械库内的武器已被塔利班夺取。此次交火中，我方军警击毙数名塔利班武装分子，但警方也有数名英勇警员牺牲。"
 AFG_taliban_attack.1.a: "真是件麻烦事。"
 AFG_taliban_attack.2.t: "塔利班发动公共汽车炸弹袭击"
 AFG_taliban_attack.2.d: "今天，一伙塔利班武装分子用卡车逼停了一辆巴士，用卡拉什尼科夫步枪向车内平民射击，随后在巴士附近引爆了汽车炸弹。宪兵队抵达后，塔利班武装分子逃离现场，部分人员被击毙，少数未逃脱者被抓获并押往宪兵队接受审讯。\n\n从审讯结果及后续调查可知，这次恐怖袭击蓄意针对游客与外国人。塔利班组织为在阿富汗杀害外国人提供了悬赏。这次袭击已造成外籍公民伤亡，相关国家正要求我国政府对此事件展开全面调查。"
 AFG_taliban_attack.2.a: "我们必须追捕那些塔利班恐怖分子！"
 AFG_taliban_attack.3.t: "塔利班公交车炸弹袭击导致我国公民丧生"
 AFG_taliban_attack.3.d: "今天，一伙塔利班武装分子用卡车逼停了一辆巴士，用卡拉什尼科夫步枪向车内平民射击，随后在巴士附近引爆了汽车炸弹。宪兵队抵达后，塔利班武装分子逃离现场，部分人员被击毙，少数未逃脱者被抓获并押往宪兵队接受审讯。\n\n此次袭击也造成了我国公民伤亡，我国驻阿富汗大使已与阿富汗官员取得联系，试图处理善后事宜。"
 AFG_taliban_attack.3.a: "向受害者家属表示哀悼！"
 AFG_taliban_attack.4.t: "外国人在塔利班巴士爆炸案中丧生"
 AFG_taliban_attack.4.d: "今天，一伙塔利班武装分子用卡车逼停了一辆巴士，用卡拉什尼科夫步枪向车内平民射击，随后在巴士附近引爆了汽车炸弹。宪兵队抵达后，塔利班武装分子逃离现场，部分人员被击毙，少数未逃脱者被抓获并押往宪兵队接受审讯。\n\n此次袭击造成当地阿富汗人和外国公民伤亡，引发国际社会广泛谴责。"
 AFG_taliban_attack.4.a: "向受害者表示哀悼！"
 AFG_taliban_attack.5.t: "塔利班袭击燃料运输车队"
 AFG_taliban_attack.5.d: "今天，塔利班武装分子袭击了一支本应为军队及宪兵部队运送重要燃料的油罐车车队。塔利班武装分子纵火焚烧油罐车，油罐车司机被塔利班绑架，至今下落不明。\n\n目前尚无当地居民伤亡的报告，但油罐车已完全烧毁，附近道路已由军方完全封锁以确保安全。预计该地区居民的生活需要一段时间才能恢复正常。"
 AFG_taliban_attack.5.a: "我们必须救出那些司机！"
 AFG_taliban_attack.6.t: "阿富汗塔利班烧毁油罐车"
 AFG_taliban_attack.6.d: "今天，塔利班武装分子袭击了一支本应为军队及宪兵部队运送重要燃料的油罐车车队。塔利班武装分子纵火焚烧油罐车，油罐车司机被塔利班绑架，至今下落不明。\n\n目前尚无当地居民伤亡的报告，但油罐车已完全烧毁，附近道路已由军方完全封锁以确保安全。预计该地区居民的生活需要一段时间才能恢复正常。"
 AFG_taliban_attack.6.a: "阿富汗确实是一个危险的地方……"
 AFG_taliban_attack.7.t: "塔利班袭击军事车队"
 AFG_taliban_attack.7.d: "今天，塔利班武装分子对我们的一个军事车队发动了令人震惊的自杀式炸弹袭击。塔利班武装分子驾驶两辆汽车，在接近军用卡车时引爆了车辆。\n\n此次自杀式袭击导致数辆军用卡车被爆炸冲击波摧毁，并造成我方士兵数人伤亡，所幸我方士兵大多仅受轻伤，而参与袭击的塔利班武装分子则当场被其炸弹炸死。"
 AFG_taliban_attack.7.a: "我们需要加强车辆筛查！"
 AFG_taliban_attack.8.t: "塔利班自杀式袭击目标是阿富汗军队"
 AFG_taliban_attack.8.d: "今天，阿富汗塔利班武装分子对阿富汗的一个军事车队发动了令人震惊的自杀式炸弹袭击。塔利班武装分子驾驶两辆汽车，在接近军用卡车时引爆了两辆车\n\n这次自杀式袭击导致数辆军用卡车被爆炸产生的冲击波摧毁，并造成数名阿富汗军方士兵伤亡，但参与袭击的塔利班武装分子被自己的炸弹当场炸死。"
 AFG_taliban_attack.8.a: "阿富汗军方是如何让这种情况发生的？"
 AFG_taliban_attack.9.t: "塔利班瞄准外国军队"
 AFG_taliban_attack.9.d: "今天，一名伪装成当地居民的塔利班武装分子悄悄接近了派往我国的外国军队车队，并引爆了藏在头巾里的炸弹。虽然第一次爆炸没有造成人员伤亡，但另一群塔利班武装分子利用爆炸造成的混乱，用火箭弹向外国军队发射火箭弹。\n\n增援部队抵达后，局势有所缓和，但不幸的是，这次袭击造成了许多人伤亡，多辆军车被毁。"
 AFG_taliban_attack.9.a: "该死"
 AFG_taliban_attack.10.t: "我们的军人在塔利班袭击中丧生"
 AFG_taliban_attack.10.d: "今天，一名伪装成当地居民的塔利班武装分子悄悄接近了一支派往我国的外国军队车队，并引爆了藏在头巾里的炸弹。虽然第一次爆炸没有造成人员伤亡，但另一群塔利班武装分子趁着爆炸造成的混乱，用火箭弹向外国军队发射火箭弹。\n\n增援部队抵达后，局势有所缓和，但不幸的是，这次袭击导致我军士兵伤亡惨重，多辆军车被毁。我军当地指挥官已与阿富汗军事指挥官取得联系，处理善后事宜。"
 AFG_taliban_attack.10.a: "向阵亡士兵表示哀悼！"
 AFG_taliban_attack.11.t: "外国军人在塔利班袭击中丧生"
 AFG_taliban_attack.11.d: "今天，一名伪装成当地居民的塔利班武装分子悄悄接近了派往我国的外国军队车队，并引爆了藏在头巾里的炸弹。虽然第一次爆炸没有造成人员伤亡，但另一群塔利班武装分子利用爆炸造成的混乱，用火箭弹向外国军队发射火箭弹。\n\n增援部队抵达后，局势有所缓和，但这次袭击造成了许多人伤亡，多辆军车被毁。"
 AFG_taliban_attack.11.a: "为什么他们不能消灭塔利班？"
 AFG_taliban_attack.12.t: "塔利班对建筑物发动炸弹袭击"
 AFG_taliban_attack.12.d: "今天，一栋大楼发生严重爆炸，大楼内有外国投资者的办公室，随后的调查结果确定，爆炸很可能是由从阿富汗国民军军械库被盗或丢失的一系列炮弹制造的。塔利班已经宣布对此次爆炸事件负责。\n\n遇难者中有外国人，我国政府官员已与他们的大使取得联系，处理善后事宜。"
 AFG_taliban_attack.12.a: "这将对我们的国家形象产生负面影响！"
 AFG_taliban_attack.13.t: "我们的承包商在塔利班爆炸案中丧生"
 AFG_taliban_attack.13.d: "今天，一栋大楼发生严重爆炸，大楼内有我们承包商的办公室，后续调查结果确定，炸弹很可能是由从阿富汗国民军军械库被盗或丢失的一系列炮弹制成的。塔利班已宣布对爆炸事件负责。\n\n我们的一些公民在伤亡中，我们驻阿富汗大使已与阿富汗政府官员取得联系，以处理善后事宜。"
 AFG_taliban_attack.13.a: "他们必须保护我们的投资者！"
 AFG_taliban_attack.14.t: "外国人在塔利班大楼爆炸案中丧生"
 AFG_taliban_attack.14.d: "今天，阿富汗某大城市一栋外国承包商办公楼发生爆炸，爆炸原因可能是阿富汗国民军军械库被盗或丢失的炮弹。塔利班已宣布对爆炸事件负责。\n\n伤亡者中有外国公民，阿富汗政府官员已与受影响国家的大使取得联系，处理善后事宜。"
 AFG_taliban_attack.14.a: "为什么会有国家在阿富汗投资？"
 AFG_taliban_attack.15.t: "塔利班轰炸机场"
 AFG_taliban_attack.15.d: "今天，我们的一座军民两用机场遭到汽车炸弹袭击。一辆载有爆炸装置的卡车冲破机场入口处的护栏，引爆了车上的爆炸装置。由于车内炸弹的爆炸当量极高，爆炸对机场跑道造成了严重破坏。袭击发生后不久，塔利班最激进的分支哈卡尼网络便声称对此次袭击负责。\n\n袭击造成大量地勤人员和候机旅客伤亡。我们的安保部门完全措手不及，公众质疑一辆装满炸药的卡车究竟是如何抵达戒备森严的机场大门的。"
 AFG_taliban_attack.15.a: "必须追捕塔利班恐怖分子！"
 AFG_taliban_attack.16.t: "阿富汗机场重大袭击"
 AFG_taliban_attack.16.d: "今天，一辆载有爆炸装置的卡车撞破机场入口处的护栏，引爆了安装在卡车上的装置，导致阿富汗的一个两用机场遭到汽车炸弹袭击。由于车内炸弹的爆炸威力极高，爆炸对机场造成了严重破坏。报告传出后不久，塔利班最激进的分支哈卡尼网络宣布对此次袭击负责。\n\n袭击造成大量人员伤亡，但目前尚无任何阿富汗[ROOT.GetAdjective]公民死亡或受伤的报道。我们的领导人[ROOT.GetLeader]已向[AFG.GetLeader]就此次袭击表示慰问，并强烈谴责塔利班的行为。"
 AFG_taliban_attack.16.a: "塔利班叛乱已达到临界水平！"
 AFG_news.17.t: "阿富汗反塔利班起义"
 AFG_news.17.d: "持久自由行动之后，赫拉特的抵抗浪潮高涨，当地民兵在美国和伊朗的帮助下挑战塔利班的控制。随着民兵占领关键地区并与北方联盟结盟，街道上到处都是欢庆的场面。“赫拉特之狮”穆罕默德·伊斯梅尔·汗对前塔利班战士表示特赦，但警告未来不要发生敌对行动。起义标志着阿富汗争取稳定的斗争的关键时刻。"
 AFG_news.17.a: "有趣的事态发展"
 AFG_events.27.t: "女性的角色"
 AFG_events.27.d: "尽管我们社会中女性角色的概念可能看起来不太传统，但国家对于如何向前发展却有着不同的想法。"
 AFG_events.27.a: "他们应该扮演更传统的角色"
 AFG_events.27.b: "让我们给她们一个角色"
 AFG_events.28.t: "宗教的作用"
 AFG_events.28.d: "宗教的作用以及阿富汗是否应该开放或严格遵守逊尼派伊斯兰教是一个有争议的问题。"
 AFG_events.28.a: "我们将保持封闭"
 AFG_events.28.b: "我们会选择开放"
 AFG_events.35.t: "向北方联盟空运"
 AFG_events.35.d: "在阿富汗持续不断的冲突中，俄罗斯发现自己卷入了该地区的事务。自1996年以来，俄罗斯政府一直在暗中支持北方联盟，提供武器和物资以加强被推翻的阿富汗政府的抵抗力量。这种支持源于对冲突蔓延至中亚的担忧，正如之前在塔吉克斯坦内战中出现的塔吉克斯坦联合反对派那样。如今，随着国防部长伊万诺夫披露了援助的规模，俄罗斯领导层面临着一个关键抉择：是在经济压力下继续援助北方联盟，还是彻底撤回支持。"
 AFG_events.35.a: "要求美国承担费用"
 AFG_events.35.b: "我们能承担费用"
 AFG_events.35.c: "切断援助流"
 AFG_events.36.t: "阿富汗北方联盟愿意部署无人机"
 AFG_events.36.d: "自1998年美国驻阿富汗大使馆爆炸案以及随后美国对阿富汗境内基地组织训练营发动导弹袭击以来，美国加大了打击恐怖网络的力度，包括要求奥萨马·本·拉登投降。美国高级国家安全官员举行会议，一致同意向塔利班发出最后通牒，要求其交出本·拉登。尽管此前美国一直不愿与北方联盟合作，但现在双方有机会携手追查本·拉登的下落。"
 AFG_events.36.a: "派遣无人机进行监视"
 AFG_events.36.b: "我们之前已经给出了目标"
 AFG_events.37.t: "增加对阿富汗北方联盟的支持"
 AFG_events.37.d: "随着阿富汗冲突愈演愈烈，北方联盟需要更多支持来对抗塔利班和基地组织。印度的秘密援助至关重要，提供资金、雷达设备、飞机零件和战斗机维护技术支持。由于印度军事顾问在对抗塔利班方面发挥了重要作用，他们的援助对[AFG.GetLeader]的士兵来说已变得不可或缺。"
 AFG_events.37.a: "清除巴基斯坦代理人是必要的。"
 AFG_events.37.b: "我们不希望继续这个过程。"
 AFG_events.38.t: "俄罗斯空运设备抵达阿富汗"
 AFG_events.38.d: "俄罗斯军事装备，包括武器、物资和车辆，已开始通过空运运抵阿富汗，这些装备的抵达为战争开辟了新的开端。"
 AFG_events.38.a: "好消息"
 AFG_events.39.t: "美国批准无人机支援"
 AFG_events.39.d: "美国已经批准了无人机支援请求，以针对基地组织训练营并追踪奥萨马·本·拉登。我们现在可以利用情报来收集和协调与美军的合作。"
 AFG_events.39.a: "大好消息"
 AFG_events.40.t: "印度继续提供支持"
 AFG_events.40.d: "阿富汗得到了印度的支持，包括资金、雷达设备、飞机零件和军事顾问。"
 AFG_events.40.a: "太好了"
 AFG_events.41.t: "支持请求被拒绝"
 AFG_events.41.d: "尽管我们努力争取更多支持，但援助请求被拒绝。我们将不得不依赖现有资源。"
 AFG_events.41.a: "令人失望"
 AFG_events.42.t: "俄罗斯要求我们买单"
 AFG_events.42.d: "俄罗斯不愿承担向阿富汗北方联盟提供补给的昂贵空运行动的费用。伊万诺夫先生已向美国寻求帮助，并与英国国防官员进行了讨论。美国面临着是否协助俄罗斯进行这次行动的决定。"
 AFG_events.42.a: "我们可以办到"
 AFG_events.42.b: "我们办不了"
 AFG_news.18.t: "俄罗斯要求美国支付向阿富汗空运的费用"
 AFG_news.18.d: "俄罗斯请求资助为阿富汗北方联盟提供空运物资，但遭到了国际社会的嘲笑。尽管俄罗斯军事实力强大，但不愿支付这笔费用的做法招致了批评，许多人质疑俄罗斯对这一事业的承诺。一些人甚至建议俄罗斯应该重新考虑其优先事项，并集中精力解决自身的经济困境。据《独立报》报道，9月底，物资开始流入阿富汗，弹药和军事装备通过俄罗斯第201师在塔吉克斯坦和阿富汗分界线皮扬吉河上修建的浮桥运送。"
 AFG_news.18.a: "钱都到哪里去了？"
 AFG_news.18.c: "老鹰会再次来拯救受伤的熊吗？"
 AFG_news.18.b: "呃事实上"
 AFG_news.19.t: "美国在阿富汗部署捕食者无人机"
 AFG_news.19.d: "美国在阿富汗部署了捕食者无人机，以打击基地组织的恐怖分子据点。阿富汗局势的升级开启了美国在该地区军事存在的新时代。无人机有望提供情报和监视，增强美国在该国的军事行动。"
 AFG_news.19.a: "有趣"
 AFG_news.20.t: "[AFG.GetLeader]向欧洲议会发表讲话"
 AFG_news.20.d: "在欧洲议会的新闻发布会上，[AFG.GetLeader]呼吁全球领导人向巴基斯坦施压，要求其停止支持塔利班，并请求提供人道主义援助以减轻阿富汗人民的苦难。他还发出这一呼吁，警告称基地组织计划对西方国家发动袭击。"
 AFG_news.20.a: "这可能是一个问题"
 AFG_news.21.t: "杜斯塔姆参与袭击马扎里沙里夫的计划"
 AFG_news.21.d: "杜斯塔姆结束流亡返回阿富汗，被视为收复马扎里沙里夫的机会。现在，他与指挥官艾哈迈德·沙阿·马苏德、伊斯梅尔·汗和穆罕默德·穆哈奇克一起，准备对塔利班控制的城市马扎里沙里夫发动进攻。\n\n杜斯塔姆原是阿富汗人民民主党共产主义力量下属第374军事单位的指挥官，1992年喀布尔沦陷后，他叛逃到圣战者组织。随后，他在马扎里沙里夫建立了自己的原始国家，即通常所说的北方自治区。他印制了自己的货币，甚至经营自己的航空公司巴尔赫航空。\n\n在塔利班短暂夺取马扎里沙里夫的控制权后，杜斯塔姆于1997年10月结束流亡返回，重新掌权。尽管他做出了努力，但塔利班还是在1998年卷土重来，促使杜斯塔姆再次逃往土耳其。"
 AFG_news.21.a: "让我们拭目以待。"
 AFG_events.45.t: "马哈茂德·苏尔卡已叛逃至塔利班"
 AFG_events.45.d: "指挥官马哈茂德·苏尔卡已投奔塔利班，声称对俄罗斯干涉战争感到不满。[AFG.GetLeader]否认了这一指控，但表示作为事实上得到承认的阿富汗政府，它有权寻求国际支持。"
 AFG_events.48.t: "阿卜杜拉·詹·瓦希迪叛逃"
 AFG_events.48.d: "哈吉·阿卜杜勒·卡迪尔承认，他们的一名重要指挥官阿卜杜拉·詹·瓦希迪已经叛逃到塔利班。"
 AFG_events.48.a: "我们什么也做不了"
 AFG_events.44.t: "伊斯梅尔·汗逃离坎大哈监狱"
 AFG_events.44.d: "伊斯梅尔·汗曾任赫拉特省省长，也是塔利班政权的反抗领袖，他从坎大哈监狱越狱。\n汗可以说是反抗苏联的叛乱中最受人尊敬的圣战者领袖之一。1992年，圣战者部队攻占了赫拉特，伊斯梅尔·汗成为省长。1995年，他与艾哈迈德·沙阿·马苏德合作，保卫了这座城市，抵抗塔利班的入侵。汗甚至向塔利班大本营坎大哈发起了进攻，但被击退。当阿卜杜勒·拉希德·杜斯塔姆将军袭击赫拉特时，情况发生了变化，伊斯梅尔·汗和他的8,000名士兵被迫逃往伊朗，然后塔利班趁机占领了赫拉特省。两年后，他在法利亚布地区组织反塔利班运动时，遭到阿卜杜勒·马吉德·鲁齐的出卖和抓捕。鲁齐与当时杜斯塔姆的副手阿卜杜勒·马利克·帕拉万一起叛逃到塔利班。"
 AFG_events.44.a: "再次冒险"
 AFG_events.45.a: "我们能做什么呢"
 AFG_events.65.t: "阿富汗呼吁支持"
 AFG_events.65.d: "阿富汗面临装备和资源的减少，紧急请求我们援助，派遣人员培训当地阿富汗战士，并为他们提供必要的装备和车辆，使他们能够独立打击塔利班，从而最大限度地减少直接军事干预的需要。"
 AFG_events.65.a: "是的，我们会的"
 AFG_events.65.b: "不，我们做不到"
 AFG_events.66.t: "他们同意了"
 AFG_events.66.d: "美国接受了请求，并将派遣顾问和设备协助阿富汗打击塔利班，这是增强阿富汗军队实力、加强打击叛乱和稳定该地区的合作努力的重要一步。"
 AFG_events.66.a: "我们将继续前行"
 AFG_border_wars.1.t: "[event_target:AFG_ATTACKER.GetName]赢得边境战争"
 AFG_border_wars.1.d: "[event_target:AFG_ATTACKER.GetName]赢得了与[event_target:AFG_DEFENDER.GetName]的边境战争，并进入了新的领土。他们很可能会在此后继续进攻。"
 AFG_border_wars.1.a: "万岁！"
 AFG_border_wars.1.b: "该死"
 AFG_border_wars.1.c: "升级！"
 AFG_border_wars.2.t: "[event_target:AFG_ATTACKER.GetName]输掉边境战争"
 AFG_border_wars.2.d: "[event_target:AFG_ATTACKER.GetName]在与[event_target:AFG_DEFENDER.GetName]的边境战争中失败"
 AFG_border_wars.2.a: "万岁！"
 AFG_border_wars.2.b: "该死"
 AFG_border_wars.3.t: "塔利班准备进入部落地区"
 AFG_border_wars.3.d: "塔利班一直在计划进驻部落地区，主要是北瓦济里斯坦和帕拉奇纳尔地区。塔利班的一名谈判代表向我们通报了他们的计划，他们希望我们允许他们在那里“暂时”驻扎一段时间。虽然从宏观角度来看，该地区规模不大，但这仍然意味着领土的丧失，以及激进恐怖分子对国家的入侵。"
 AFG_border_wars.3.a: "只要有用，就可以留下"
 AFG_border_wars.3.b: "绝对不行"
 AFG_border_wars.4.t: "巴基斯坦谴责进入部落地区的计划"
 AFG_border_wars.4.d: "巴基斯坦政府最近与我们联系，表达了对塔利班武装继续驻扎在北瓦济里斯坦和帕拉奇纳尔地区的不满。这虽然并非令人震惊的结果，但仍然是我们收复阿富汗的一大障碍。"
 AFG_border_wars.4.a: "好吧"
 AFG_border_wars.4.b: "不管他们的反对意见是什么！"
 AFG_border_wars.5.t: "巴基斯坦允许进入部落地区"
 AFG_border_wars.5.d: "巴基斯坦政府已表示将无视我们向北瓦济里斯坦和帕拉奇纳尔地区的行动。这意味着我们可以继续扩大行动，并在阿富汗发动大规模袭击时增加我们的胜算。"
 AFG_border_wars.5.a: "很好"
 AFG_border_wars.6.t: "塔利班无视我们"
 AFG_border_wars.6.d: "塔利班无视我们，也无视我们对他们近期进军北瓦济里斯坦和帕拉奇纳尔地区的抗议。看来我们别无选择，只能动用武力来让他们明白，我们不能被践踏。"
 AFG_border_wars.6.a: "他们开始了"
 AFG_border_wars.7.t: "阿富汗武装部队取得胜利"
 AFG_border_wars.7.d: "在与塔利班的一场小规模战斗后，阿富汗武装部队取得了胜利。[AFG.GetLeader]将这场战斗誉为全国性的胜利。"
 AFG_border_wars.7.a: "真主至大！"
 AFG_border_wars.7.b: "胜利终将到来"
 AFG_border_wars.8.t: "塔利班部队取得胜利"
 AFG_border_wars.8.d: "在与阿富汗国民军发生小规模冲突后，塔利班部队取得了对阿富汗国民军的胜利。[TAL.GetLeader]将这场战斗吹捧为塔利班全军的胜利。"
 AFG_border_wars.8.a: "真主至大！"
 AFG_border_wars.8.b: "胜利终将到来"
 AFG_border_wars.9.t: "塔利班与阿富汗冲突后结果尚无定论"
 AFG_border_wars.9.d: "塔利班与阿富汗国民军发生冲突后，国际部队观察到前线已冻结。据称，双方均减缓了攻击速度，并撤退至冲突前的地区。"
 AFG_border_wars.9.a: "好的"
 AFG_uzbek_bombing_of_the_imu: "乌兹别克轰炸行动"
 AFG_uzbek_bombing_of_the_imu_desc: "乌兹别克斯坦战机正在对北部边境的乌兹别克斯坦伊斯兰运动营地进行空袭。只要塔什干的战机继续飞行，这些空袭就能削弱塔利班的防空能力，并延缓其攻势。"
