 SOV_start_fleet_reforms_desc: "우리 해군은 효율성을 회복하기 위해 포괄적인 개혁이 필요합니다."
 SOV_cancel_unnecessary_projects: "불필요한 사업 취소"
 SOV_cancel_unnecessary_projects_desc: "우리는 자원을 가장 중요한 해군 사업에 집중해야 합니다."
 SOV_Updated_naval_doctrine: "개정된 해군 교리"
 SOV_Updated_naval_doctrine_desc: "현대의 과제에 대응하기 위해 해군 교리를 개정할 때입니다."
 SOV_begin_modernization_of_our_fleet: "함대 현대화 착수"
 SOV_begin_modernization_of_our_fleet_desc: "함대 현대화는 해군력을 유지하는 데 필수적입니다."
 SOV_Optimize_our_fleet: "함대 최적화"
 SOV_Optimize_our_fleet_desc: "우리는 필요한 개량에 쓸 자금을 마련하기 위해 함대 비용을 간소화하고 있습니다."
 SOV_The_high_seas_fleet: "공해 함대"
 SOV_The_high_seas_fleet_desc: "우리는 영국에 버금가는 강력한 원양 해군을 건설하는 것을 목표로 합니다."
 SOV_the_plundered_russian_navy1: "약탈당한 러시아 해군"
 SOV_the_plundered_russian_navy2: "부분 재건된 함대"
 SOV_the_plundered_russian_navy3: "거의 재건된 함대"
 SOV_restoration_of_warsaw_pact: "바르샤바 조약 복원"
 SOV_restoration_of_warsaw_pact_desc: "\n\n\n\n\n\n£SOV_desctext_warsaw \n\n\n\n\n\n\n\n\n동유럽의 상황은 점점 불안정해지고 있으며, 이미 여러 옛 바르샤바 조약 동맹국이 나토로 넘어갔습니다. 이것이 계속될수록 세계적 영향력을 되찾기가 더욱 어려워질 것입니다. 우리는 잃어버린 것을 되찾고 양극 체제의 세계 균형을 복원해야 합니다."
 SOV_AUTH_SS: "러시아 민족 소비에트국"
 SOV_soviet_empire: "소비에트 제국"
 Sov_warsaw_pact.15.t: "러시아의 영향력에서 벗어날 기회"
 Sov_warsaw_pact.15.d: "러시아 내부의 최근 혼란은 우리나라에 대한 그들의 영향력을 줄일 기회를 만들었습니다. 러시아가 국내 문제에 집중하는 동안, 우리는 계속 동맹으로 남을지 아니면 독자적인 길을 추구할지 결정해야 합니다."
 Sov_warsaw_pact.15.a: "러시아는 더 이상 우리의 동맹이 아니다"
 Sov_warsaw_pact.15.b: "우리는 남는다"
 SOV_nazbols: "러시아가 전부이며 나머지는 아무것도 아니다"
 SOV_nazbols_desc: "\n\n\n\n\n\n£SOV_desctext_nazbol \n\n\n\n\n\n\n\n\n러시아의 옛 위대함을 되찾을 때가 왔습니다. 위대한 조국에 무엇이 필요한지 진정으로 아는 것은 오직 우리뿐입니다."
 SOV_nazbols_nato: "Anti-Western Rhetoric"
 SOV_nazbols_nato_desc: "The West has always been and will remain our enemy. Our rhetoric must never change."
 SOV_nazbols_foreign_legion: "외인부대"
 SOV_nazbols_foreign_legion_desc: "프랑스 외인부대에서 영감을 받아, 외국인이 복무하고 시민권을 얻을 수 있는 러시아 군단을 창설할 것입니다."
 SOV_nazbols_ekb: "Move the Capital to Yekaterinburg"
 SOV_nazbols_ekb_desc: "It's time to move the capital to the heart of Russia! The Urals are perfect. Moscow is too distant from many regions."
 SOV_nazbols_empire: "소비에트 제국"
 SOV_nazbols_empire_desc: "Our power has returned! Glory to the Soviet Empire!"
 sov_sover_state.1.t: "주권국가연합 부활 구상을 제안하는 §Y[SOV.GetNameWithFlag]§!"
 sov_sover_state.1.d: "§Y주권국가연합§!은 본래 실현되기도 전에 해체되었으며, 모스크바에서의 국가비상사태위원회 쿠데타 시도로 인한 정치적 혼란 속에서 무너졌습니다. 이제 이 구상이 새로운 활력과 함께 돌아왔습니다. 이 계획은 소련 이후 국가들을 새롭고 더 유연한 틀 아래 통합할 두 번째 기회를 제공합니다. 이 제안은 지역 질서를 재편할 수 있습니다."
 sov_sover_state.1.a: "이에 참여하는 데 동의한다"
 sov_sover_state.1.b: "우리는 관심이 없다"
 sov_sover_state.5.t: "주권 국가 연맹 선언"
 sov_sover_state.5.d: "조약의 최종 초안이 검토를 위해 우리에게 제출되었습니다. 이제 서명하여 공식적으로 주권국가연합에 가입할지는 우리의 결정입니다. 이 선택은 새로운 지역 동맹에서 우리의 역할을 결정할 것입니다."
 sov_sover_state.5.a: "찬성"
 sov_sover_state.5.b: "안된다"
 sov_sover_state.6.t: "주권 국가 연맹"
 sov_sover_state.6.d: "The signing process has been completed, and the Union of Sovereign States is officially founded. This historic event marks the beginning of a new era of cooperation, mutual development, and shared governance among its members."
 sov_sover_state.6.a: "만세!"
 sov_sover_state.14.t: "주권 국가 연맹"
 sov_sover_state.14.d: "§Y[FROM.GetNameWithFlag]§!이(가) 주권국가연합의 회원국 후보가 되는 데 공식적으로 동의했습니다. 이는 주권 공화국들의 통합된 연합체를 구축하는 데 중요한 진전입니다."
 sov_sover_state.14.a: "만세!"
 sov_sover_state.15.t: "주권 국가 연맹"
 sov_sover_state.15.d: "§Y[FROM.GetNameWithFlag]§!이(가) 주권국가연합 가입을 위한 공식 협정에 서명했습니다. 이는 그들의 공식적인 연합 가입을 의미하며 동맹을 강화합니다."
 sov_sover_state.15.a: "만세!"
 SOV_Sign_mutual_cooperation_agreements: "주권 국가 연합 회원국 가입"
 SOV_Sign_mutual_cooperation_agreements_desc: "우리는 여러 국가에 주권 국가 연합 가입을 제안할 것입니다. 이들 국가는 우리의 공동 번영과 지역 안정으로부터 이익을 얻고 이에 기여할 가능성이 높습니다."
 SOV_Putting_out_the_fire_in_the_post-Soviet_space: "협정 서명식 발표"
 SOV_Putting_out_the_fire_in_the_post-Soviet_space_desc: "우리는 연방 조약 서명식의 날짜를 공식 발표할 것입니다. 이 행사는 어떤 국가들이 우리 연합에 가입하고 공동의 목표를 향해 함께 노력하기로 약속했는지를 결정할 것입니다."
 SOV_Gorbachev_dream: "주권 국가 연합 확대"
 SOV_Gorbachev_dream_desc: "창립식이 완료되었습니다. 형식적 절차가 마무리되었으므로 우리는 주권 국가 연합을 확대하고 소련 이후 공간 전역에서 그 존재감과 영향력을 공고히 해 나갈 것입니다."
 SOV_ssg_category: "주권국가연합"
 SOV_ssg_category_desc: "주권국가연합은 소련의 개혁된 형태로 구상되었으며, 더 부드럽고 더 분권적이며 연방제적 성격을 띱니다. 오늘 우리는 과거의 실수를 개선하고 더 강력한 미래를 건설하며 그 구상을 현실로 만들 기회를 얻었습니다."
 SOV_conflict_geo: "§Y조지아 분쟁§!의 해결안을 표결에 부치기"
 SOV_conflict_geo_resolve: "§Y조지아 분쟁§!을 최종적으로 해결"
 SOV_conflict_nkr: "§Y아르차흐 분쟁§!의 해결안을 표결에 부치기"
 SOV_conflict_nkr_resolve: "§Y아르메니아-아제르바이잔 분쟁§!을 최종적으로 해결"
 SOV_conflict_ukr: "§Y크림 분쟁§!의 해결안을 표결에 부치기"
 SOV_conflict_ukr_resolve: "§Y크림 분쟁§!을 최종적으로 해결"
 SOV_bulgarian_ally: "오랜 슬라브 형제"
 SOV_bulgarian_ally_desc: "1878년 불가리아가 오스만 지배에서 해방된 후 강력한 동맹이 될 수 있었지만, 차르들은 이 기회를 놓쳤습니다. 이제 우리는 불가리아 국민의 호감을 얻고 형제의 유대를 회복함으로써 이를 바로잡아야 합니다."
 SOV_annex12: "드니스트르 강변의 교두보"
 SOV_annex13: "분리주의 지역 반환"
 SOV_Civil_nationalism: "국민 민족주의"
 SOV_Civil_nationalism_desc: "The nation must come first. We will prioritize national interests above all else, uniting society around a shared identity and common purpose."
 SOV_embrace_the_legacy_of_the_USSR: "Embrace the Legacy of the USSR"
 SOV_embrace_the_legacy_of_the_USSR_desc: "The Soviet Union's legacy continues to guide our political and cultural development. Its achievements remain the cornerstone of our national identity and ambitions."
 SOV_Introduce_visa_regime_with_Central_Asia: "Visa Regime with Central Asia"
 SOV_Introduce_visa_regime_with_Central_Asia_desc: "To better manage our borders and address economic and social concerns, we will introduce a visa regime with Central Asia. This measure aims to reduce illegal migration and safeguard national stability."
 SOV_Utilize_the_country_economic_potential_100_percent: "Maximize Economic Potential"
 SOV_Utilize_the_country_economic_potential_100_percent_desc: "We will fully unlock the country's economic potential. Every resource and opportunity must be used to drive growth and prosperity."
 SOV_Cooperation_with_Taiwan: "대만과의 협력"
 SOV_Cooperation_with_Taiwan_desc: "Strategic cooperation with Taiwan will grant us access to advanced technology and considerable economic benefits. This partnership can accelerate our development."
 SOV_Buy_out_Taiwans_microchip_technology: "Acquire Taiwan's Microchip Technology"
 SOV_Buy_out_Taiwans_microchip_technology_desc: "We have secured a deal to purchase microchip manufacturing technology from Taiwan. This acquisition will serve as the foundation for our technological and economic leap forward."
 SOV_Promote_Russian_companies_in_the_post-Soviet_space: "Promote Russian Companies in the Post-Soviet Space"
 SOV_Promote_Russian_companies_in_the_post-Soviet_space_desc: "We will aggressively support Russian companies expanding into the post-Soviet region. Our goal is to claim a dominant position in these markets."
 SOV_Monopoly_in_the_post-Soviet_space: "구소련 공간 내 독점"
 SOV_Monopoly_in_the_post-Soviet_space_desc: "Russian businesses should achieve market dominance across the post-Soviet region. Through strategic investments and political influence, we will make this a reality."
 SOV_Economic_Empire: "경제 제국"
 SOV_Economic_Empire_desc: "A strong Russia doesn't need war to assert itself. Through economic power and influence, we will secure our place as a global leader."
 SOV_Make_the_Anti-Corruption_Foundation_a_State_Company: "부패방지재단"
 SOV_Make_the_Anti-Corruption_Foundation_a_State_Company_desc: "To institutionalize the fight against corruption, the Anti-Corruption Foundation will become a state-owned organization with the full backing of the government."
 SOV_Demonopolization_of_the_strategic_economy: "전략 경제의 민주화"
 SOV_Demonopolization_of_the_strategic_economy_desc: "We will break up monopolies in strategic sectors of the economy to improve transparency, competition, and efficiency."
 SOV_Unite_the_network_of_state-owned_companies: "Unite State-Owned Companies"
 SOV_Unite_the_network_of_state-owned_companies_desc: "We will consolidate our state-owned enterprises into a cohesive and efficient network, aligned with national interests and capable of driving long-term growth."
 SOV_Increase_salaries_and_pensions_for_the_military_and_the_population: "임금과 연금을 인상"
 SOV_Increase_salaries_and_pensions_for_the_military_and_the_population_desc: "We made a promise, and we will keep it. Salaries and pensions for both the military and civilian population will be raised significantly."
 SOV_Measures_of_rapprochement_with_the_West: "Rapprochement with the West"
 SOV_Measures_of_rapprochement_with_the_West_desc: "The West should be seen not as a threat, but as a partner. Through cooperation and dialogue, we will rebuild trust and redefine our relationships."
 SOV_The_way_of_free_russia: "자유 러시아의 길"
 SOV_The_way_of_free_russia_desc: "A free Russia is a strong Russia. We will pursue liberty, democracy, and national pride as the foundation for a better future."
 SOV_fbk_organization_category: "반부패 재단 본부"
 SOV_fbk_organization_category_desc: "Years of autocracy have saturated our state with corruption. The Anti-Corruption Foundation is committed to rooting it out and restoring honor to public service."
 SOV_democracy_taiwam_category: "대만에서의 러시아 민주주의"
 SOV_democracy_taiwam_category_desc: "Taiwan remains a thorn in China's side. As our rivalry with China intensifies, securing influence over Taiwan has become one of our strategic priorities."
 SOV_boost_opinion_of_rus: "관계 개선 지속"
 SOV_more_weapon_taiwan: "대만에 더 많은 무기 지원"
 SOV_invest_taiwan: "대만 투자"
 SOV_puppet_taiwan: "대만 종속"
 SOV_Civil_Nationalism_idea: "진정한 국민 민족주의"
 SOV_Combating_illegal_migration_idea: "불법 이주 단속"
 SOV_Finding_corrupt_officials_in_the_party: "당 내 부패 관리 색출"
 SOV_Check_police_personnel: "경찰 인력 점검"
 SOV_expose_corrupt_schemes_in_the_smuggling_trade: "밀수 부패 폭로"
 SOV_check_data_on_illegal_migration: "불법 이주 자료 분석"
 SOV_operation_Sweet_Gifts: "작전 달콤한 선물"
 SOV_Prepare_the_test_purchase: "시험 구매 준비"
 SOV_Train_specialized_personnel: "전문 인력 양성"
 SOV_Finalize_the_sweet_gifts_operation: "작전 달콤한 선물 완료"
 SOV_Free_Russia_idea: "자유 러시아"
 SOV_Russian_Microchip_idea: "바이칼 코어 i9"
 russia.52.t: "대만 주재 러시아 대표단"
 russia.52.d: "러시아 대표단이 필수적인 러시아 자원을 대가로 우리의 마이크로칩 기술 지분을 구매하겠다는 제안을 가지고 도착했습니다. 이 거래는 양측 모두에게 이익이 될 수 있습니다."
 russia.52.a: "좋은 거래다"
 russia.52.b: "러시아? 그런데 그들에게 사단이 몇 개나 있지?"
 russia.53.t: "거래를 파기한 대만"
 russia.53.d: "대만 정부는 우리의 제안이 불리하다고 판단하여 거부했습니다. 협상은 결렬되었으며 긴장이 높아질 수 있습니다."
 russia.53.a: "대만은 바이칼 프로세서의 우위를 인정하지 않는군"
 russia.54.t: "러시아 항공우주방위군"
 russia.54.d: "러시아군은 새로운 군 조직인 항공우주방위군을 공식 창설했습니다. 이 개혁은 항공 및 우주 작전을 더 효과적으로 통합하는 것을 목표로 합니다."
 russia.54.a: "만세!"
 russia.55.t: "차르 보리스의 대관식"
 russia.55.d: "보리스 옐친이 공적 생활로 복귀했으며 이제 많은 이들에게 러시아 전체의 상징적 차르로 여겨지고 있습니다. 대체로 의례적이기는 하지만, 이러한 군주제의 부활은 비록 비전통적이긴 해도 역사적입니다."
 russia.55.a: "말도 안 되는 소리"
 russia.58.t: "군 개혁"
 russia.58.d: "우리의 군사 개혁이 결실을 맺기 시작했습니다. 재능 있는 새로운 장군들이 우리 대열에 합류하여 힘과 새로운 전문성을 가져왔습니다."
 russia.58.a: "좋아"
 russia.59.t: "군 개혁"
 russia.59.d: "우리의 군사 개혁이 결실을 맺기 시작했습니다. 재능 있는 새로운 장군들이 우리 대열에 합류하여 힘과 새로운 전문성을 가져왔습니다."
 russia.59.a: "좋아"
 SOV_prepare_a_deal: "거래 준비"
 SOV_buy_microchips: "대만산 마이크로칩 구매"
 SOV_Economic_blockade_of_Georgia_idea: "조지아 경제 봉쇄"
 SOV_Dominance_of_russian_companies_idea: "러시아 기업의 지배"
 SOV_Visa_regime_with_central_asia_idea: "중앙아시아와의 비자 제도"
 SOV_Economic_Empire_idea: "경제 제국"
 SOV_Dependence_on_Russian_technologies_idea: "러시아 기술 의존"
 SOV_FBK_TT: "§Y반부패재단§!의 결정을 잠금 해제"
 SOV_cross_the_rubicon: "루비콘 강을 건너다"
 SOV_cross_the_rubicon_desc: "러시아의 진정한 지도자가 권력을 장악할 때가 왔습니다. 우리 국가의 미래를 확보하고 역사의 고삐를 쥐기 위해 단호하게 행동해야 합니다."
 SOV_tandemokratia: "탄데모크라티야"
 SOV_tandemokratia_desc: "탄데모크라티야는 푸틴과 메드베데프의 2인 체제를 가리킵니다. 이제 두 사람은 각자의 강점을 하나의 권력으로 융합하여 통일된 세력으로 러시아를 통치할 것입니다."
 SOV_unlimited_samoderzhaviye: "무제한 사모데르자비예"
 SOV_unlimited_samoderzhaviye_desc: "우리는 절대 통치인 사모데르자비예의 원칙으로 돌아가고 있습니다. 두 명의 차르가 키를 잡은 가운데 우리의 통치는 옛 러시아 전제 정치의 위력을 반영합니다."
 SOV_establish_new_oligarchate: "신 과두제 수립"
 SOV_establish_new_oligarchate_desc: "과두 재벌들은 오랫동안 러시아 정치를 좌우해 왔습니다. 푸틴의 측근들을 우리 편으로 교체함으로써 지속적인 안정과 충성스러운 지지를 확보할 것입니다."
 SOV_peace_with_the_west: "서방과의 평화"
 SOV_peace_with_the_west_desc: "내정이 유동적인 상황에서 서방과의 분쟁은 현실적이지 않습니다. 당분간은 때가 무르익을 때까지 평화가 우선해야 합니다."
 SOV_continue_reformism: "개혁주의 지속"
 SOV_continue_reformism_desc: "푸틴의 보수 정책은 정체를 초래했습니다. 우리의 새 행정부는 포괄적인 개혁과 새로운 지도력으로 러시아를 되살릴 것입니다."
 SOV_secure_the_FSB: "FSB 장악"
 SOV_secure_the_FSB_desc: "FSB는 여전히 푸틴주의 영향력의 거점입니다. 구체제의 마지막 보루를 해체하려면 숙청이 필요합니다."
 SOV_crush_putinism: "푸틴주의 분쇄"
 SOV_crush_putinism_desc: "푸틴주의는 그 정책, 조직망, 이념까지 완전히 해체되어야 합니다. 앞으로 나아가기 위해 우리는 그것을 뒤로하고 떠나야 합니다."
 SOV_enforce_liberal_values: "자유주의 가치의 우월성"
 SOV_enforce_liberal_values_desc: "자유주의는 자유롭고 번영하는 러시아의 토대입니다. 국가를 재건하면서 이러한 가치를 지키고 확산시켜야 합니다."
 SOV_focus_on_economy: "러시아의 경제 기적"
 SOV_focus_on_economy_desc: "자유주의 시대는 경제 부흥을 약속합니다. 시장을 개방하고 개혁을 시행함으로써 번영, 평화, 자유의 새 시대를 열 것입니다."
 SOV_abandon_foreign_policy: "대외 정책 포기"
 SOV_abandon_foreign_policy_desc: "냉전은 끝났습니다. 우리는 더 이상 서방에 대한 공산주의의 위협이 아닙니다. 과거의 원한을 내려놓고 지속적인 평화를 받아들일 때입니다."
 SOV_age_of_stability: "안정된 러시아"
 SOV_age_of_stability_desc: "수십 년의 혼란과 불평등 끝에 러시아는 평화를 찾았습니다. 선견지명 있는 개혁가가 이끄는 가운데 우리는 지속적인 안정과 민족 단합의 시대로 들어서고 있습니다."
 SOV_establish_controlled_opposition: "통제된 야당 수립"
 SOV_establish_controlled_opposition_desc: "두마 내의 통제된 야당은 민주주의의 외양을 만들어내면서도 우리가 방해받지 않고 개혁을 통과시킬 수 있게 해줄 것입니다."
 SOV_special_economic_operation: "특별 경제 작전"
 SOV_special_economic_operation_desc: "벨라루스와 우크라이나는 푸틴주의 시대가 끝났음을 보아야 합니다. 우리는 강압이 아닌 협력으로 그들과 관계를 맺고 새로운 조건에서 관계를 재건할 것입니다."
 SOV_the_iron_dimon: "철권통치 (Iron Rule)"
 SOV_the_iron_dimon_desc: "The people are tired of weakness. They demand strength. A true leader, firm, unyielding, and resolute, will rise to answer that call."
 SOV_the_new_dictatorship: "신 독재"
 SOV_the_new_dictatorship_desc: "우리의 권위를 공고히 하기 위해 현대의 필요에 맞게 조정된 새로운 독재의 구조와 효율성을 받아들일 것입니다."
 SOV_medvedeism: "메드베데프주의"
 SOV_medvedeism_desc: "푸틴주의는 국가를 실패로 이끌었습니다. 이제 새로운 교의, 즉 과거를 바로잡고 러시아를 미래로 인도하도록 설계된 메드베데프주의가 도래합니다."
 SOV_defend_national_interests: "국익 수호"
 SOV_defend_national_interests_desc: "국가가 안정되었으므로 우리는 시선을 밖으로 돌릴 것입니다. 러시아 국민의 마땅한 영토는 우리의 보호 아래로 돌아와야 합니다."
 iron_dimon: "강철의 디몬"
 pro_western_dima: "진정한 자유주의자"
 russian_duumviri: "러시아 2인 집정"
 sov_medvedev.1.t: "푸틴으로부터 권력을 빼앗은 메드베데프!"
 sov_medvedev.1.d: "본래 대통령 임기 제한을 우회하기 위해 자리에 앉혀졌던 드미트리 메드베데프가 이제 푸틴의 그늘에서 벗어났습니다. 라이벌이 제거되면서 메드베데프는 홀로 러시아 권력의 키를 쥐고 있습니다. 러시아 역사의 새로운 장이 시작됩니다."
 sov_medvedev.1.a: "우리의 미래는 불확실하다."
 sov_medvedev.5.t: "거부된 외교적 접근"
 sov_medvedev.5.d: "우리의 외교적 접촉이 거절당했습니다. 대상 국가는 주권과 정치적 독립에 대한 우려를 들어 우리의 제안을 거부했습니다."
 sov_medvedev.5.a: "차질이다"
 sov_student_rallies.t: "학생 시위 발발"
 sov_student_rallies.d: "주요 도시 전역의 대학생들이 정치 개혁과 더 큰 시민적 자유를 요구하며 거리로 나섰습니다. 시위는 규모와 강도가 커지고 있습니다."
 sov_student_rallies.a: "시위를 탄압한다"
 sov_student_rallies.b: "시위를 허용한다"
 sov_medvedev.4.t: "관계 재설정을 제안하는 러시아"
 sov_medvedev.4.d: "푸틴 정권보다 더 친서방적인 입장을 가진 러시아의 새 정부가 관계 재설정을 제안했습니다. 그들의 외교관들은 협력을 위한 새로운 출발, 즉 '재시동'을 제안합니다."
 sov_medvedev.4.a: "물론이지! 러시아인들은 좋은 친구가 될 수 있다!"
 sov_medvedev.4.b: "우리는 그들과 친구가 될 수 없다."
 sov_medvedev.6.t: "2인 집정을 선포한 푸틴과 메드베데프!"
 sov_medvedev.6.d: "놀라운 정치적 행보로 러시아의 대통령과 총리는 공식적인 2인 집정 체제로 함께 통치하겠다고 공동 발표했습니다. 이 전례 없는 체제는 러시아의 권력 구조를 재편합니다."
 sov_medvedev.6.a: "좋다"
 sov_medvedev.7.t: "새로운 러시아 정권"
 sov_medvedev.7.d: "우리 대통령은 소셜 미디어에서 점점 더 목소리를 높이며 서방에 대한 대담한 새 견해를 표명하고 있습니다. 그의 수사는 극적으로 바뀌었으며, 이는 러시아가 단호한 독립의 길로 복귀하고 있음을 알립니다."
 sov_medvedev.7.a: "나는 그들이 싫다, 그들은 개자식이자 타락한 자들이다."
 sov_medvedev.8.t: "러시아의 서방 접근"
 sov_medvedev.8.d: "대통령이 대담한 새 정책을 발표했습니다. 러시아는 이제 서방을 적이 아니라 필수적인 동반자로 볼 것입니다. 우리 국가는 새로운 장을 엽니다."
 sov_medvedev.8.a: "미국에 신의 축복이 있기를!... 그리고 러시아에도!"
 SOV_kob_party_start: "개념당 \"통합\""
 SOV_kob_party_start_desc: "Conceptual Party Unity, led by our visionary leader General Konstantin Petrov, has taken power. It is time to wage ideological war against the Predictor Corrector and free Russia from its hidden chains."
 SOV_kobnod: "신의 힘을 위한 러시아 인민 운동"
 SOV_establish_militar_loyal: "군사적 충성을 확립하다"
 SOV_establish_militar_loyal_desc: "General Petrov must secure complete loyalty from the military. All branches must swear allegiance to him as Glavkoverkh, the Supreme Commander of all Russia."
 SOV_establish_loyalistii: "지역적 충성심"
 SOV_establish_loyalistii_desc: "We must place devoted party members in regional positions of power to ensure absolute loyalty and prevent any resistance to our path forward."
 SOV_regional_control: "과두정치의 정화"
 SOV_regional_control_desc: "The oligarchs have drained the lifeblood of our people for too long. Now, we will strike back and rid the land of these parasitic elites."
 SOV_establish_new_religion: "새로운 종교 정책"
 SOV_establish_new_religion_desc: "Modern organized religions were created to enslave minds and suppress independent thought. We must liberate the people from this mental bondage."
 SOV_internet_propaganda: "인터넷 선전"
 SOV_internet_propaganda_desc: "Few understand the true power of the internet. Like Predictor Corrector before us, we will wield it to reshape public thought and crush false consciousness."
 SOV_course_of_truth: "진실의 과정"
 SOV_course_of_truth_desc: "For too long, the Orthodox clergy have hidden the deeper truths from the people. Now, we shall bring light to these secrets and expose the full truth of our history."
 SOV_new_cosmic_warfare_desc: "General Petrov, a specialist in space warfare, sees the stars as Russia's next frontier. We must restore and advance the legacy of the Soviet space program."
 SOV_russian_knights_desc: "At the core of the Russian spirit lies the soul of the Vityaz, the noble warrior. Though few in number, these modern knights carry the legacy of Rus' into battle."
 SOV_russian_knights: "러시아 비티야즈(러시아 전통적 영웅)"
 SOV_new_cosmic_warfare: "새로운 우주 전쟁"
 SOV_remaking_constitution: "헌법 재개정"
 SOV_remaking_constitution_desc: "The current Constitution restricts our will to reform. It must be rewritten entirely to reflect our vision for Russia's divine future."
 SOV_iron_hand_of_koba: "스탈린주의 유산"
 SOV_iron_hand_of_koba_desc: "Stalin was the spiritual heir of the Tsars and the architect of a disciplined, strong Russia. We must revive his legacy and follow the path he forged."
 SOV_natural_bloshevism: "자연스러운 볼셰비즘"
 SOV_natural_bloshevism_desc: "The fall of the Tsarist regime and rise of Bolshevism were not coincidences. They were the natural evolution of our nation. We must embrace this destiny fully."
 SOV_slavic_reincarnation: "슬라브 환생"
 SOV_slavic_reincarnation_desc: "True spiritual revival lies in the beliefs of our ancestors. All foreign religions must be abolished in favor of a return to native Slavic paganism."
 SOV_merge_pantheons: "울리는 삼나무"
 SOV_merge_pantheons_desc: "By uniting with Zvenyashie Kedry, we can blend our sacred beliefs into a single powerful faith to stand against the manipulations of the Egyptian Priests."
 SOV_support_nod: "NOD 지원"
 SOV_support_nod_desc: "The NOD movement is fiercely anti-Western. Their ideology aligns with ours, and they should be integrated into our administration."
 SOV_educational_water: "죽은 물"
 SOV_educational_water_desc: "Dead Water, a religious-political doctrine inspired by Russian folklore and first developed by the secretive Priestly Centre of the Soviet Union, seeks to spiritually revive the people. It now forms the ideological base of our Conceptual Party Unity."
 SOV_search_for_priests: "사제들을 찾아라"
 SOV_search_for_priests_desc: "The Egyptian Priests have manipulated the world from the shadows for too long. We must root out their agents hidden within our borders."
 SOV_purge_westernists: "서구주의자들을 숙청"
 SOV_purge_westernists_desc: "Westernists are blind servants of global capitalism. Their poisonous influence must be eliminated from our government and society."
 SOV_revolutions_in_other_slavic_states: "보고로디츠나야 혁명"
 SOV_revolutions_in_other_slavic_states_desc: "We must spread revolution throughout Slavic lands to free our brethren from the Predictor Corrector's control. The age of liberation is upon us."
 SOV_seek_for_them_in_israel: "이스라엘에서 찾아보기"
 SOV_seek_for_them_in_israel_desc: "According to General Petrov, the Egyptian Priests may have agents even in Israel. We must investigate and expose their hidden influence there."
 SOV_seek_for_them_in_swiss: "스위스에서 찾기"
 SOV_seek_for_them_in_swiss_desc: "Switzerland has long been rumored as a headquarters of the Predictor Corrector. We will search every corner of it to find the truth."
 SOV_seek_for_them_in_egypt: "이집트에서 찾기"
 SOV_seek_for_them_in_egypt_desc: "Perhaps the Egyptian Priests have hidden themselves in the very cradle of their power. We must seek out the truth in their ancient homeland."
 SOV_kill_predictor_corrector: "예언자를 살해하라!"
 SOV_kill_predictor_corrector_desc: "We have uncovered the location of Predictor Corrector. It is time to begin our holy crusade: against capitalism, manipulation, and the enemies of truth."
 SOV_semibankirshina_desc: "세미반키르시나, 즉 '7인 은행가 집단'은 옐친 시대에 러시아 정치에 막대한 영향력을 행사했던 가장 강력한 과두 재벌들을 가리킵니다."
 SOV_enforce_oligarhic_rule: "과두 지배 강화"
 SOV_enforce_oligarhic_rule_desc: "국가는 너무 오랫동안 과두 재벌들을 억압하면서 경제 발전을 위해서는 거의 한 일이 없습니다. 진정으로 성장을 이끄는 이들에게 권력을 넘길 때입니다."
 SOV_revive_oligarch_influence: "과두 재벌의 영향력 부활"
 SOV_revive_oligarch_influence_desc: "우리 과두 재벌 집단이 다시 두각을 나타내고 러시아 통치에 대한 영향력을 되찾을 때입니다."
 SOV_bring_the_old_gang_from_abroad: "해외의 옛 동료들 복귀"
 SOV_bring_the_old_gang_from_abroad_desc: "우리의 옛 동맹 다수가 망명을 강요당했습니다. 이제 형세가 바뀌었으니 그들을 고국으로 초청하여 우리의 영향력 제국을 재건할 수 있습니다."
 SOV_privatize_state_corporations: "국영 기업 민영화"
 SOV_privatize_state_corporations_desc: "푸틴 치하의 국가 주도 경제는 비효율적이고 비대했습니다. 우리는 이 기업들을 해체하여 민간에 돌려주어야 합니다."
 SOV_move_oligarchic_entites_back_to_russia: "과두 재벌 법인 복귀"
 SOV_move_oligarchic_entites_back_to_russia_desc: "해외에 숨겨진 러시아의 부는 고국으로 돌아와야 합니다. 우리의 통제가 확립된 지금, 우리는 이 자원으로 이윤과 발전 모두에 자금을 댈 수 있습니다."
 SOV_exploit_natural_wealth: "러시아의 천연 자원 개발"
 SOV_exploit_natural_wealth_desc: "러시아는 방대한 천연 자원 매장량을 보유하고 있습니다. 우리는 이를 효율적으로 채굴하여 국민을 만족시키고 과두 재벌들을 부유하게 할 것입니다."
 SOV_semi_criminal_government: "반범죄 정부"
 SOV_semi_criminal_government_desc: "과두 재벌들은 오래전부터 조직 범죄와 연결되어 있습니다. 왜 싸우겠습니까? 우리는 이 관계를 공식화하고 그들을 정부에 끌어들일 것입니다."
 SOV_end_lawsuits_against_oligarchs: "과두 재벌 상대 소송 종결"
 SOV_end_lawsuits_against_oligarchs_desc: "푸틴은 자신의 통제를 확보하기 위해 과두 재벌들을 상대로 법적 전쟁을 벌였습니다. 우리는 이 부당함을 끝내고 가장 성공한 시민들의 존엄을 회복할 것입니다."
 SOV_restore_semibankirshina: "세미뱅커시나 (Semibankirshina) 복원"
 SOV_restore_semibankirshina_desc: "Semibankirshina, the seven powerful bankers, has returned. With Putin out of the way, they now stand united, ready to shape Russia's destiny again."
 SOV_back_to_the_west: "서방으로 복귀"
 SOV_back_to_the_west_desc: "서방과의 적대는 우리 경제를 황폐화했습니다. 낡은 냉전식 적대를 버리고 번영을 위한 새로운 동맹을 육성할 때입니다."
 sov_oligarchs.1.t: "정부 개편!"
 sov_oligarchs.1.d: "과두 재벌들은 한때 약화되었지만 더 이상은 아닙니다. 그들의 지지를 확보하려는 노력 속에서 대통령은 그들에게 전례 없는 영향력을 부여했습니다. 과두 재벌에게 충성하는 장관들이 권력을 잡으며 엘리트 통치의 새 시대를 열고 있습니다."
 sov_oligarchs.1.a: "신이여 러시아를 지켜주소서..."
 sov_oligarchs.2.t: "러시아로 귀환한 구신스키!"
 sov_oligarchs.2.d: "한때 이전 당국에 의해 추방되었던 러시아 언론 거물 블라디미르 구신스키가 귀국했습니다. 형세가 바뀌었고 그는 환영 속에 돌아왔습니다."
 sov_oligarchs.2.a: "돌아온 것을 환영한다!"
 sov_oligarchs.3.t: "러시아로 귀환한 베레좁스키!"
 sov_oligarchs.3.d: "러시아에서 가장 부유하고 논란 많은 과두 재벌 중 한 명인 보리스 베레좁스키가 귀국했습니다. 마치 1990년대로 되돌아간 것 같습니다."
 sov_oligarchs.3.a: "90년대처럼!"
 sov_oligarchs.4.t: "러시아에서 권력을 잡은 세미반키르시나!"
 sov_oligarchs.4.d: "과두 재벌의 영향력이 정점에 달했습니다. 옐친 시대의 7인 거물들이 모든 경쟁자를 짓밟고 권력을 장악했습니다. 이제 러시아 정부의 미래는 그들의 손에 달려 있지만, 문제는 여전히 남아 있습니다. 누가 이끌 것인가?"
 sov_oligarchs.4.a: "위원회의 직접 통치!"
 SOV_russian_oligarchs_modifier: "과두 국가"
 SOV_idea_putinism_medvedeism: "탄데모크라시"
 SOV_private_media_nationalisation_idea: "민간 언론의 국유화"
 SOV_FSB_renewed: "FSB 인사 쇄신"
 warsaw_joing_exercises_world_tension: "바르샤바 조약 합동 훈련"
 SOV_uav_product: "드론"
 SOV_fighter_product: "전투기"
 tandem: "탄뎀"
 russia.51.a: "끝났다"
 russia.51.d: "해당 영토가 러시아의 통제 아래 들어왔습니다. 우리 군은 이 지역에 대한 질서와 행정 권한을 확립했습니다."
 russia.51.t: "러시아의 통제 아래"
 SOV_koba_tooltip: "장군에게 발언을 허락하면 장차 쿠데타로 이어질 수 있습니다."
 rival: "우리의 주적"
 korea_agree: "§Y[NKO.GetNameWithFlag]§! agrees"
 SOV_borya_ded: "보리스 옐친 사망"
 SOV_pmc_gazproms: "기업 PMC"
 SOV_pmc_gazproms_desc: "가즈프롬은 자체 민간 군사 기업 대대의 창설에 자금을 대고 있습니다."
 SOV_anti_bsb: "야당 금지"
 SOV_anti_bsb_desc: "우리의 안정을 해치고 외세의 영향력을 퍼뜨리는 친서방 야권 단체들에 대해 단호한 조치를 취할 때입니다."
 SOV_pogranci_fsb: "러시아 FSB 국경경비대"
 SOV_pogranci_fsb_desc: "국경경비대는 러시아의 광대한 육상 국경을 순찰하고 방어하는 임무를 맡은 FSB의 한 부문입니다."
 SOV_idea_comp_industry: "컴퓨터 산업"
 SOV_idea_comp_industry_desc: "우리의 경제는 낙후되어 있습니다. 숙련된 과학자와 노동자들이 컴퓨터 기술을 활용하여 러시아의 경제와 군산 복합체를 새로운 높이로 끌어올려야 합니다."
 SOV_revived_politburo_modifier_desc: "소련의 당 유산은 1991년에 파괴되었습니다. 이제 우리는 잃어버리고 도난당한 모든 것을 되살려야 하는 과제에 직면해 있습니다."
 SOV_500_days_modifier: "500일 계획에 따른 경제 성장"
 SOV_just_inner_modifier: "정의로운 러시아의 내부 정책"
 SOV_500_days_category: "500일 계획"
 SOV_500_days_category_desc: "The 500 Days Program was an initiative proposed in 1990 by Soviet economist Stanislav Shatalin and Chairman of the Commission of Economic Reforms Grigory Yavlinsky. The main purpose of this program was to transition from a planned economy to market capitalism by reducing the role of the state in the economy. Unfortunately, the program was never implemented because the Soviet establishment considered it too radical.\nAfter the mistakes of Gaidar's Shock Therapy and the economic mismanagement of previous governments, the current economic situation requires us to try again and fully implement the 500 Days Program to complete the conversion to a modern market economy!"
 SOV_500_days_ticker_mission: "500일 계획 기한"
