 AFG_ai_Weight_effect_Arms: "Their willingness to accept is §GStrong§! by default\n\n [USA.GetName] is less likely to ally us if\n §R-Dont follow the same Outlook\n -They have a Low Opinion of [AFG.GetName]§!"
 AFG_ai_Weight_effect_Airlift: "그들의 수용 의지는 기본적으로 §G강함§!입니다.\n\n그들은 다음의 경우 수용할 가능성이 더 높습니다:\n§G-[USA.GetLeader]가 '항구적 자유 작전(Operation Enduring Freedom)'을 발표한 경우§!\n\n다음의 경우 수용할 가능성이 더 낮습니다:\n§R-우리가 동일한 관점을 따르지 않을 경우\n-그들이 우리에 대해 낮은 의견을 가지고 있을 경우§!"
 AFG_ai_Weight_effect_Iran: "Their willingness to accept is §GStrong§! by default\n\n They are less likely to accept if\n §R-If we don't follow the same outlook\n -If they have low opinion of us\n -We are Sunni§!"
 AFG_ai_Weight_effect_div_usa: "Their willingness to accept is §RWeak§! by default\n\n They are more likely to accept if\n §G-CIA Predator Drones are Approved\n -We Follow the same Outlook\n -They have a High Opinion of [AFG.GetNameDefCap]§!"
 AFG_ai_Weight_effect_CIA_drones: "그들이 수용할 의향은 기본적으로 §G강함§!입니다.\n\n그들이 수용할 가능성이 낮은 경우:\n§R-오사마 빈 라덴이 죽었다면\n-우리가 같은 관점을 따르지 않으면\n-[AFG.GetNameDefCap]에 대해 낮은 의견을 가질 경우§!"
 AFG_ai_Weight_effect_India_aid: "Their willingness to accept is §GStrong§! by default\n\n They are less likely to accept if\n§R -If we don't follow the same outlook\n -They have a Low Opinion of [AFG.GetNameDefCap]§!"
 AFG_available_as_leaderTT: "§GAvailable§! as §YPoltical Leader§!"
 AFG_available_as_MillleaderTT: "§GAllocated§! as §YMilitary High Commander§!"
 AFG_import_westernism: "Import Westernism"
 AFG_import_westernism_desc: "Afghanistan has long held onto its traditional values. However, the recent openness to new ideas has allowed us to selectively incorporate aspects of Western concepts. This approach lets us draw from a diverse array of Western ideas, choosing those that align with our unique needs and rejecting those that do not fit our context."
 AFG_atta_installs_leadership: "Atta Muhammad Nur Assumes Leadership"
 AFG_atta_installs_leadership_desc: "From warlord to commander, Atta Muhammad Nur does not take to things too nicely."
 AFG_liberal_society: "Liberal Society"
 AFG_afghan_morning_taliban_by_night: "A.N.A. By Day, Taliban By Night"
 AFG_afghan_morning_taliban_by_night_desc: "Much of our personnel in the Afghan National Army live double lives. Many of them are in the Taliban whilst serving in the army, giving the Taliban a major advantage over our forces. This corruption has enabled mass corruption amidst our armed forces, and a major morale drain on the men fighting for the nation."
 AFG_safed_koh_supply_network: "Safed Koh Supply Network"
 AFG_safed_koh_supply_network_desc: "Using a complex network of roads, mountains, and underground caves, the Safed Koh supply network has softened the impact of the regions harsh and isolated terrain."
 AFG_tal_insurgency_new: "[TAL.GetFlag] Taliban Insurgency"
 AFG_tal_insurgency_new_desc: "The Taliban have retreated into the Eastern outskirts of Afghanistan following several defeats. They are digging in, preparing for a drawn out and bloody guerrilla war. Taliban Strength is directly tied into their Defensive & Offensive modifiers. If they have over 30% strength by the time the United States withdraws, they will launch a full-scale invasion once more.\n\n£AFG_salafist_jihadism  §HTaliban Strength - [?AFG.taliban_attack_strength|%]§!"
 TAL_move_into_tribal_areas: "Push Into Pakistani Tribal Areas"
 TAL_move_into_tribal_areas_desc: "To survive, we will need to move our forces outwards so that we aren't concentrated in one single area. The tribal areas are the perfect hiding spot, as we we will have clear access to a good mountain range."
 AFG_414_attack_1207: "Attack Taliban Strongholds"
 AFG_414_attack_1207_desc: "While we aren't going to be able to eradicate the Taliban, we'll be able to hurt their strength... If we are successful."
 TAL_1207_attack_1154: "Strike at Kunar"
 TAL_1207_attack_1208: "Push Toward Qalat"
 AFG_414_attack_1208: "Re-Take Qalat"
 AFG_414_attack_1154: "Re-Take Kunar"
 PAK_objected: "We back down following [PAK.GetFlag] Pakistani objections"
 AFG_doing_border_raid: "Currently doing a border a raid"
 TAL_money: "Taliban Funds"
 AFG_agriculture_mech: "Agriculture"
 AFG_agriculture_mech_desc: "Almonds and pomegranates are the only Afghan exports the world will buy without hesitation. State money put into orchards, transport, and buyers turns a farmer's harvest into treasury revenue."
 AFG_pomegranate_return_tt: "Returns: §G+6%§! of GDP to §YTreasury§!"
 AFG_almond_return_tt: "Returns: §G+8%§! of GDP to §YTreasury§!"
 AFG_pomegranate_investment_limit_tt: "Pomegranate investments remaining: §Y[?AFG_pomegranate_investments]/5§!"
 AFG_almond_investment_limit_tt: "Almond investments remaining: §Y[?AFG_almond_investments]/5§!"
 TAL_1207_attack_1154_desc: "Send fighters out of the Safed Koh ranges into Kunar to bleed the Afghan garrison before it can dig in."
 TAL_1207_attack_1208_desc: "Press from Safed Koh against Qalat. Holding the highway here splits government forces across the south-east."
 TAL_1152_attack_415: "Sweep into Sistan"
 TAL_1152_attack_415_desc: "Drive west out of Registan into Sistan, threatening the government hold on the desert frontier with Iran."
 AFG_415_attack_1152: "Clear Registan"
 AFG_415_attack_1152_desc: "Counter-attack from Sistan to retake the Registan desert and deny the Taliban their staging ground."
 AFG_412_attack_415: "Liberate Sistan"
 AFG_412_attack_415_desc: "Advance from Hazarajat to push the Taliban out of Sistan and restore the southern provinces to government control."
 TAL_construct_the_safed_koh_system: "Build the Safed Koh Supply Network"
 TAL_construct_the_safed_koh_system_desc: "Carve caches, tunnels, and mule tracks through the Safed Koh range to keep fighters supplied beyond the reach of Afghan patrols."
 TAL_begin_insurgency_in_registan: "Open the Registan Front"
 TAL_begin_insurgency_in_registan_desc: "Raise militia columns across the Registan desert and seize the province, opening a second front in the south."
 TAL_begin_war_again: "Relaunch the War"
 TAL_begin_war_again_desc: "With foreign troops gone and our strength restored, abandon the ceasefire and march on Kabul to finish the war."
 AFG_taliban_insurgency_eliminated: "Taliban insurgency has been eliminated"
 AFG_active_taliban_insurgency: "Taliban insurgency is active"
 wot_supporting_afghan_counter_insurgency: "Support Afghan counter-insurgency"
 AFG_civil_war_shortcut: "Civil War"
 AFG_panjshir_shortcut: "Panjshir"
 AFG_foreign_policy_shortcut: "Foreign Policy"
 AFG_government_shortcut: "Government"
 AFG_reconstruction_shortcut: "Reconstruction"
 AFG_national_policy_shortcut: "National Policy"
 AFG_national_assembly: "National Assembly"
 AFG_anjuman_pass: "The Lion of Panjshir"
 AFG_law_of_faith: "Law of Faith"
 AFG_law_of_faith_idea: "Law of Faith"
 AFG_law_of_faith_idea_desc: "Religious law is written into the statute book. The clergy are satisfied and the countryside will answer a call to arms, but the political space for anything outside the consensus has closed."
 AFG_law_of_faith_desc: "The Law of Faith will prevail in our state to reinforce our Islamic principles within the state. Our people will be guided by our Islamic beliefs in order to keep our state pure and righteous."
 AFG_training_of_local_police_officers: "Training of Local Police Officers"
 AFG_training_of_local_police_officers_desc: "In preparation for the eventual liberation and stabilization of Afghanistan, the Northern Alliance must establish a disciplined and effective police force. This force will be crucial in maintaining law and order in the territories we aim to reclaim."
 AFG_heirs_o_the_mujahideen: "Heirs of the Mujahideen"
 AFG_heirs_o_the_mujahideen_desc: "Drawing inspiration from the legendary fighters of the past, the current leadership seeks to revive the spirit and tactics of the Mujahideen."
 AFG_the_lions_guard: "The Lion's Guard"
 AFG_the_lions_guard_desc: "A new task force has emerged to prevent potential attacks on Ahmad Shah Massoud in response to imminent threat concerns."
 AFG_the_francesc_vendrell_talks: "The Francesc Vendrell Talks"
 AFG_the_francesc_vendrell_talks_desc: "In Dushanbe, Tajikistan, U.N. Special Envoy Francesc Vendrell holds peace talks with key Afghan leaders: Northern Alliance commander Ahmed Shah Masood, former Nangarhar governor Haji Abdul Qadeer, and former Rabbani government member Syed Hussain Anwari, discussing the woes of Muhammad Asif Mohseni."
 AFG_assault_on_mazar_i_sharif: "Assault on Mazar-i-Sharif"
 AFG_assault_on_mazar_i_sharif_desc: "The important city of Mazar-i-Sharif must be recaptured, and we can rally our men to give them a boost in order to do so."
 AFG_massoud_s_mig_and_sukho: "Massoud's MiG and Sukhoi"
 AFG_massoud_s_mig_and_sukho_desc: "India's support has been covert. India has been aiding Massoud with money, radar gear, and aeroplane parts for some time now. They have sent about 30 technicians who are reportedly maintaining Massoud's MiG and Sukhoi fighter aircraft. Indian military advisors also gave tips on fighting the Taliban. Unacknowledged as it is, Indian help has become a mainstay of Massoud's forces."
 AFG_russian_air_lift_idea: "Russian Airlift"
 AFG_russian_air_lift_idea_desc: "Soviet-pattern arms and spares are coming in by air from Russia. Our crews already know the equipment, so it reaches the front cheaply and without retraining."
 AFG_russian_air_lift: "Russian Airlift"
 AFG_russian_air_lift_desc: "Russia has maintained a long-standing covert alliance with the Northern Alliance, providing weapons and essential supplies to support the remnants of our government. Just yesterday, the Russian Defense Minister, Sergei Ivanov, announced that they would be equipping our militias with well-known Soviet-era hardware that members of the Northern Alliance are already familiar with."
 AFG_mil_mi_24_gunships: "Mil Mi-24 Attack Helicopter"
 AFG_mil_mi_24_gunships_desc: "Russia has announced plans to supply us with 12 Mil Mi-24 Attack Helicopters, which will provide valuable support for our efforts in advancing against the Taliban."
 AFG_cia_predator_surveillance_drones: "CIA Predator Surveillance Drones"
 AFG_cia_predator_surveillance_drones_idea: "CIA Predator Surveillance Drones"
 AFG_cia_predator_surveillance_drones_idea_desc: "American drones are loitering over the passes and feeding us what they see. We plan around real intelligence for the first time, and our own networks grow off the back of theirs."
 AFG_cia_predator_surveillance_drones_desc: "CIA Predator surveillance drones have been instrumental in providing extensive coverage of the terrain, identifying key points of interest, and pinpointing hostile targets."
 AFG_appeal_to_washington_for_support: "Appeal to Washington for Support"
 AFG_appeal_to_washington_for_support_desc: "In the face of ongoing conflict and the threat posed by extremist factions, Afghanistan must seek the support of international allies to strengthen its military capabilities."
 AFG_imu_countermeasures: "IMU Countermeasures"
 AFG_imu_countermeasures_desc: "To counter this menace, Afghanistan seeks assistance from Uzbekistan to conduct targeted airstrikes against IMU strongholds. This collaboration aims to weaken the IMU's capabilities, disrupt their operations, and restore security along the border regions."
 AFG_shura_system: "Reinforce the Shura System"
 AFG_shura_system_desc: "Strengthening the Shura system within the Northern Alliance is crucial for maintaining unity and effective governance. By reinforcing this traditional council-based decision-making structure, we ensure that all factions are represented."
 AFG_anjuman_pass_desc: "Ahmad Shah Massoud, also known as the Lion of Panjshir, stands as a symbol of resistance and tactical leadership. By rallying around his ideas, the nation aims to adopt his strategies, inspire the troops, and solidify its defenses. His leadership principles have and will guide Afghanistan through its current struggles."
 AFG_ghanis_plan: "Ghani's Plan"
 AFG_ghanis_plan_desc: "Ghani is launching a plan to cut Taliban support through targeted military actions and development projects, aiming to stabilize key regions and restore government control."
 AFG_secretly_support_the_opium_industry: "Secret Support for the Opium Industry"
 AFG_secretly_support_the_opium_industry_desc: "Under the guise of industrialization, our urban base will believe that we are heading towards a new era of modernization. However, we cannot alienate the foundation of the nation, the farmers. We will secretly support the opium trade as a means of improving our economic prosperity and appeasing every part of Afghan society."
 AFG_parliamentary_illusion: "Parliamentary Illusion"
 AFG_parliamentary_illusion_idea: "Parliamentary Illusion"
 AFG_parliamentary_illusion_idea_desc: "The chamber sits, debates and votes, and decides nothing that matters. It costs us little to keep, and the appearance of consent is worth more than the reality."
 AFG_parliamentary_illusion_desc: "What is the parliament for anyway? Well, it is to appease our people to believe that they've got a say in their government. We cannot rule out the democratic process entirely, but we are able to manipulate it to better serve our own needs."
 AFG_the_western_kleptocracy: "The Western Kleptocracy"
 AFG_ashraf_ghani: "The Ahmadzai"
 AFG_ashraf_ghani_desc: "Ashraf Ghani has been elected as the new President of Afghanistan. With a mandate for reform, he seeks to stabilize the nation and rebuild its institutions."
 AFG_endorse_the_american_candidate: "Endorse the American Candidate"
 AFG_endorse_the_american_candidate_desc: "With the transitional government coming to an end, Hamid Karzai's control over the government remains strong. As the chosen candidate of the Bonn agreement, Karzai has formed a broad-winged government around rebuilding Afghanistan and promoting a lasting peace with our new American allies."
 AFG_the_new_chairman: "The New Chairman"
 AFG_the_new_chairman_desc: "As the election cycle passes, the head of state must not only wield control but also serve as the nation's face. With the office wide open, Karzai must take command and lead Afghanistan by example."
 AFG_aptta: "APTTA"
 AFG_aptta_desc: "The Afghanistan–Pakistan Transit Trade Agreement or APTTA is a bilateral trade agreement between Pakistan and Afghanistan, signed under the Karzai administration. This agreement aims to boost trade between the two countries, support counter-terror operations, and bring development in the border regions."
 AFG_saarc_membership: "SAARC Membership"
 AFG_saarc_membership_idea: "SAARC Membership"
 AFG_saarc_membership_idea_desc: "A seat at the South Asian table. Credit is cheaper, the tax base is steadier, and Kabul is treated as a neighbour rather than a problem."
 AFG_saarc_membership_desc: "Afghanistan's membership in the South Asian Association for Regional Cooperation or SAARC demonstrates the country's integration into the regional economic and political framework. It also provides an opportunity to lift Afghanistan out of the gutter."
 AFG_rebuilding_the_state: "Rebuilding the State"
 AFG_rebuilding_the_state_desc: "After the fall of the Taliban, one of the main objectives of nation-building in Afghanistan is to restore and rebuild the state from the ground up. Afghanistan, a state with a failing economy and little to no paved roads or railway lines, must now be rebuilt into a country that can hold its place in the global order."
 AFG_drafting_the_constitution: "Drafting the Constitution"
 AFG_drafting_the_constitution_desc: "The signing of the Constitution marks a significant turning point for the state, as it puts pen to paper to solidify steps that guarantee human rights."
 AFG_national_solidarity_program: "National Solidarity Program"
 AFG_national_solidarity_program_desc: "The Afghan National Solidarity Programme or the NSP was a government initiative to rehabilitate and develop around 5,000 villages in Afghanistan, with $900 million phased over three years. It sought to establish local, democratically elected institutions and oversee reconstruction efforts."
 AFG_reformist_path: "Reformist Path"
 AFG_reformist_path_desc: "The reformist path aims to replace the old with the new, and there is no better time for this than now, as Afghanistan is still in the early stages of nation-building."
 AFG_next_in_line_of_succession: "Next in Line of Succession"
 AFG_next_in_line_of_succession_desc: "As Hamid Karzai's tenure comes to an end, a successor must step in to take his place."
 AFG_sway_local_warlords: "Sway Local Warlords"
 AFG_sway_local_warlords_desc: "Local warlords have dominated Afghan leadership since the Soviet invasion, and removing them won't be easy. Instead, we should identify and collaborate with key strongmen to strengthen our position."
 AFG_the_islamic_republic: "The Islamic Republic"
 AFG_the_islamic_republic_desc: "As the state of Afghanistan fades away, a new age for the republic begins, marking a fresh start and a new form for our nation."
 AFG_the_mujahideen: "The Mujahideen"
 AFG_the_mujahideen_desc: "The Mujahideen, or the Afghan Mujahideen, is a broad coalition of former resistance commanders and warlords, many of whom supported the former Northern Alliance. We should focus on maintaining the status quo."
 AFG_age_of_republican_leadership: "New Age Leadership"
 AFG_age_of_republican_leadership_desc: "With the creation of the Islamic Republic, we should phase out old warlord commanders in favor of new officers for the new national defense forces."
 AFG_islamic_democracy: "Islamic Democracy"
 AFG_islamic_democracy_desc: "The new chapter continues with the Islamic society taking its mantle over the state of Afghanistan, hopefully into the future. However, now is not a time for rest, as warlords and gang figures roam the nation, posing a threat by aligning themselves with Taliban forces."
 AFG_reinforce_the_government: "Reinforce the Government"
 AFG_reinforce_the_government_desc: "With our new control over the southern regions of the nation, we believe it's a good start to command opposition and bring our leadership into the light of many."
 AFG_agricultural_modernisation: "Agricultural Modernisation"
 AFG_agricultural_modernisation_desc: "Modernising irrigation, mechanisation, and farming techniques would raise output across our rural provinces and give the treasury a new source of revenue from the agricultural sector."
 AFG_the_farmer_and_their_rifle: "The Farmer and their Rifle"
 AFG_the_farmer_and_their_rifle_desc: "With a thirst to cut through blood and bone to protect their homeland, Afghanistan's rural inhabitants have shown to be a backbone to the state. Losing support from this community would be the first domino leading to our fall."
 AFG_inheritor_of_afghanistan: "Inheritor of Afghanistan"
 AFG_inheritor_of_afghanistan_desc: "Afghanistan has only truly been peaceful under our rule. We have become the inheritors of the Afghan state and should be praised for this achievement, not dismissed by global powers."
 AFG_second_man_of_the_state: "Second Man of the State"
 AFG_second_man_of_the_state_desc: "Being a former resistance commander, Atta has taken a keen interest in power. He has established himself as a distinct leader of Afghanistan and has not shied away from engaging in large-scale conflicts with other warlords."
 AFG_dismantle_the_warlords: "Dismantle The Warlords"
 AFG_dismantle_the_warlords_desc: "Thugs and gangsters run certain regions of the nation. For us to truly transform into a modern nation-state, we must make an effort to address this warlord issue."
 AFG_a_tolerant_state: "A Tolerant State"
 AFG_a_tolerant_state_desc: "Afghanistan is home to a multitude of different people. We must keep our promises to consider every Afghan as one and stand united as a whole."
 AFG_naveen: "Naveen"
 AFG_naveen_desc: "The New Afghanistan Party, or Naveen, is a political party in Afghanistan led by Yunus Qanuni. The party was founded when Qanuni moved away from the National Movement of Afghanistan, which is led by Ahmad Wali Massoud. Yunus Qanuni aims to continue the mentality of the Northern Alliance."
 AFG_new_class_of_jam_iat_reformers: "New Class of Jam'iat Reformers"
 AFG_new_class_of_jam_iat_reformers_desc: "Yunus Qanuni represents a new wave of Jam'iat reformers who are more embracing of Islamic and traditional values. This group tends to adopt a more reformist approach, focusing on gradual change rather than aggressive conversion."
 AFG_counite_masouds_works: "Continue Massoud's Work"
 AFG_counite_masouds_works_desc: "With the defeat of the Northern Alliance and the end of Massoud's leadership, we remain committed to preserving the spirit of the Northern Alliance as we strive to build a modern Afghanistan."
 AFG_foster_innovation: "Foster Innovation"
 AFG_foster_innovation_desc: "As a former Minister of Education, Yunus Qanuni understands the critical need for innovation in the education sector."
 AFG_combat_electoral_corruption: "Combat Electoral Corruption"
 AFG_combat_electoral_corruption_desc: "In Afghanistan, officials have often used bribery to amass wealth and maintain their power. From this point forward, we must ensure that electoral fraud is no longer tolerated."
 AFG_empowering_provincial_governance: "Empowering Provincial Governance"
 AFG_empowering_provincial_governance_desc: "Empowering provincial governance in Afghanistan is essential. As demonstrated by Germany, decentralized governance allows regions to progress and catch up with the rest of the nation."
 AFG_centralise_the_apparatus_of_the_state: "Centralise the Apparatus of the State"
 AFG_centralise_the_apparatus_of_the_state_desc: "Centralization will strengthen our control, ensuring that all reviews and opposition are managed directly by us."
 AFG_expand_the_education_ministry: "Expand the Education Ministry"
 AFG_expand_the_education_ministry_desc: "Expanding the Ministry of Education would greatly benefit our state by fostering a higher-skilled workforce and developing a more educated society."
 AFG_propose_a_new_constitution: "Propose a New Constitution"
 AFG_propose_a_new_constitution_desc: "The current Afghan constitution falls short of modern standards and requires significant amendment."
 AFG_embezzle_foreign_funds: "Embezzle Foreign Funds"
 AFG_embezzle_foreign_funds_desc: "Embezzling foreign funds has been a method to maintain tight control over the nation and sustain our governance alongside the National Assembly."
 AFG_enforce_afghan_centralism: "Enforce Centralism"
 AFG_enforce_afghan_centralism_desc: "Afghans are a rural and tribal people, and have historically reacted negatively towards any form of centralization. But how can our government be of any use if we are limited by what we can, and cannot do? We must put our foot down and enforce centralism."
 AFG_urban_tribal_divisions: "Concessions to Shura Leaders"
 AFG_urban_tribal_divisions_desc: "By moving some of our tribesmen into urbanized areas, we will be able to give certain regions greater autonomy and control over their regions as they will be more organized."
 AFG_atlanticism: "Atlanticism"
 AFG_atlanticism_desc: "Atlanticism is the belief in close cooperation between North America and Europe, a doctrine that took hold after the Second World War. Afghanistan wishes to adopt a more Western model in terms of progress and governance."
 AFG_arsenal_of_democracy: "Arsenal of Democracy"
 AFG_arsenal_of_democracy_desc: "With the American arms economy booming, we should leverage this to our advantage by stocking up and preparing for the challenges that lie ahead."
 AFG_the_republic_survives_another_day: "The Republic Survived Another Day"
 AFG_the_republic_survives_another_day_desc: "As night fades into day, the banner of the Afghan people stands strong. Ready for whatever lies ahead, be it peace or war. One thing remains certain: the republic will endure until its last breath."
 AFG_defenders_of_democracy: "Defenders of Democracy"
 AFG_defenders_of_democracy_desc: "From a state with little concept of democracy to a new regime fully embracing it is unprecedented. We must fulfill our duty and protect this nation and its ideals at all costs."
 AFG_root_out_the_old_cabinet: "Root out the old Cabinet"
 AFG_root_out_the_old_cabinet_desc: "Those from past offices are still in the parliamentary system. We must disarm and expose them for the frauds they are."
 AFG_moderate_islamism: "Moderate Islamism"
 AFG_moderate_islamism_desc: "Moderate Islamism refers to a passive or traditional approach to Islam, differentiating it from more radical and revolutionary interpretations."
 AFG_basej_e_milli: "The Green Trend"
 AFG_basej_e_milli_desc: "Basej-e Milli, alternatively known as Rawand-e Sabz-e Afghanistan, is an anti-Taliban, Afghan nationalist, and pro-democracy political party. It plays a significant role in advocating for a democratic future and national unity in Afghanistan."
 AFG_knife_to_the_warlords: "Knife to the Warlords"
 AFG_knife_to_the_warlords_desc: "The warlords plague this nation and are an outdated concept. They claim to act in the name of the people, but we all stand against them."
 AFG_standardised_taxation: "Standardised Taxation"
 AFG_standardised_taxation_desc: "Standardized taxation will allow our economy to rebound from years of war."
 AFG_enlist_the_support_of_the_people: "Enlist the Support of the People"
 AFG_enlist_the_support_of_the_people_desc: "Enlisting the support of the people will save the republic from the threats that lie ahead."
 AFG_recraft_the_healthcare_system: "Recraft the Healthcare System"
 AFG_recraft_the_healthcare_system_desc: "The hospitals are old and in need of restoration and repair. We must do our part in addressing this issue."
 AFG_local_organisation: "Local Organisation"
 AFG_local_organisation_desc: "We must rally ourselves to be self-sustaining and not rely on the support of the rest of the world."
 AFG_lift_the_press_restrictions: "Lift the Press Restrictions"
 AFG_lift_the_press_restrictions_desc: "A free and independent press is the cornerstone of a vibrant and democratic society."
 AFG_progressive_tax: "A Progressive Tax"
 AFG_progressive_tax_desc: "To ensure a fair distribution of wealth and resources, Afghanistan adopts a progressive tax system."
 AFG_return_of_dostum: "Return of Dostum"
 AFG_return_of_dostum_desc: "General Abdul Rashid Dostum, a prominent Afghan military leader and influential figure, is making a return to the national stage. He is known for his formidable command of the Uzbek forces and for his strategic acumen."
 AFG_mission_to_tehran: "Mission to Tehran"
 AFG_mission_to_tehran_desc: "In a bid to strengthen regional alliances and counter external threats, Afghanistan is embarking on a diplomatic mission to Tehran. By joining the Iran-led Axis of Resistance, Afghanistan aims to secure powerful allies, enhance its military capabilities, and bolster its geopolitical standing."
 AFG_take_command_of_rabbanis_feyzabad_forces: "Commanding Rabbani's Feyzabad Forces"
 AFG_take_command_of_rabbanis_feyzabad_forces_desc: "Burhanuddin Rabbani's forces stationed in Feyzabad are crucial for controlling the northeastern regions of Afghanistan. By taking direct command of these forces, the central leadership aims to unify command structures, enhance coordination, and bolster the defense of this strategically important area."
 AFG_karim_khalilis_new_offensive: "Karim Khalili's New Offensive"
 AFG_karim_khalilis_new_offensive_desc: "Karim Khalili, a prominent leader and strategist, is spearheading a bold new offensive to reclaim key territories and push back against hostile forces. His plan involves a combination of guerrilla tactics, mobilization of local militias, and strategic coordination with allied forces."
 AFG_western_klep_tt1: "§YHijacking Foreign Aid§! impact on §YAdditional Income§! $§G0.18§! Billion"
 AFG_state_northern_stronghold_dynamic_modifier: "Gates of the Anjuman Pass"
 AFG_taliban_assault_on_taloqan: "Taliban Assault on Taloqan"
 AFG_state_battle_for_mazar_i_sharif_dynamic_modifier: "Mazar-i-Sharif Offensive"
 AFG_increase_road_toll_tt: "Increase Road Tolls\nToll Level: [?AFG_toll_level]\nState Monetary Gain: $§G[?AFG_Toll_display_var]§!\nConsumer Goods: §Y[?ROOT.AFG_consumer_goods_factor_toll|%]§!"
 AFG_increase_road_toll_tt_desc: "Toll levels can be raised up to five times, each increasing the revenue generated from state highways based on traffic and the volume of goods traded. Every level above the first costs §Y2%§! consumer goods nationally, reflecting the burden tolls place on the wider economy."
 AFG_lower_road_toll_tt: "Decrease Road Tolls\nToll Level: [?AFG_toll_level]\nState Monetary Gain: $§G[?AFG_Toll_display_var]§!\nConsumer Goods: §Y[?ROOT.AFG_consumer_goods_factor_toll|%]§!"
 AFG_lower_road_toll_tt_desc: "Lowering a toll level gives back the §Y2%§! consumer goods it cost, at the price of the revenue that level was earning. Tolls cannot be lowered below the first level."
 AFG_toll_below_maximum_tt: "This state's tolls are §Rat the highest level§!."
 AFG_toll_above_minimum_tt: "This state's tolls are §Rat the lowest level§!."
 AFG_info_box: "§GTollage§!\nToll Level: [?AFG_toll_level]\nState Monetary Gain: $§G[?AFG_Toll_display_var]§!\nNational Toll Monetary Gain: $§G[?ROOT.additional_income_AFG_tolls_income1]§!\nNational Consumer Goods: §Y[?ROOT.AFG_consumer_goods_factor_toll|%]§!"
 AFG_info_box_desc_lore: "Afghan highways are controlled by groups like the Taliban and local Warlords who used local tolls to generate income from trade routes connecting Central Asia, Iran, and Pakistan. These tolls, rooted in Silk Road traditions, are a major funding source for both the Taliban regime and warlords, with control of key roads being crucial to power and wealth."
 AFG_usa_equipment: "CIA Involvement"
 AFG_usa_equipment_desc: "The Americans don't like the foothold that the Taliban currently has, and so they have offered to sell some equipment to us on the cheap."
 AFG_join_sco: "Join the SCO"
 AFG_join_sco_desc: "The SCO is headed by China and Russia, and it is an organization that emphasizes regional peace, security, counter-terrorism and economic cooperation. It can provide many of the resources we deem necessary for our country, such as counter-terrorism drills and development assistance. We should join the SCO for our country's benefit."
 AFG_the_western_kleptocracy_desc: "Change? Who needs change? We have the West to aid us and the situation will improve as planned."
 AFG_liberal_society_desc: "Loosening the grip of the clerical establishment has given Kabul a press, a bazaar and a public argument. Trade partners take us more seriously for it, though the political capital spent holding the line is real."
 AFG_preserve_democracy: "Preserve Democracy"
 AFG_preserve_democracy_desc: "With the press unshackled and the courts left alone, the republic is being given a genuine chance to take root before the next crisis tests it."
 AFG_indian_support_and_arms_trade: "Indian Support and Arms Support"
 AFG_indian_support_and_arms_trade_desc: "The Indians have agreed to support, and arm our nation against our enemies."
 AFG_establishing_supply_lines: "Establishing Supply Lines"
 AFG_establishing_supply_lines_desc: "By establishing well-kept, and well-maintained supply lines, our troops will be sufficiently supplied in order to keep fighting."
 AFG_russian_technical_specialists: "Russian Technical Specialists"
 AFG_russian_technical_specialists_desc: "We have brought in specialists from [SOV.GetFlag] Russia to work on our mechanized units."
 AFG_the_shura_system_idea: "The Shura System"
 AFG_the_shura_system_idea_desc: "The Shura system in the Northern Alliance is a traditional form of council-based governance, rooted in tribal and communal decision-making practices. This system brings together military leaders, tribal elders, and influential figures to deliberate and make collective decisions. The Shura system enhances unity and ensures that various factions within the Northern Alliance are represented and have a voice in strategic and political matters."
 AFG_civilian_exodus_taloqan: "Civilian Exodus Taloqan"
 AFG_civilian_exodus_taloqan_desc: "The fighting around Taloqan has pushed thousands of families north and west. The camps strain what little we can spare, but the refugees carry the province with them, and fewer mouths in the line eases our supply."
 AFG_iranian_airbridge: "Iranian Airbridge"
 AFG_iranian_airbridge_desc: "After the Taliban seized Kabul, Iran's aid to the Northern Alliance surged. Iran established an airbridge between Mashhad and the Afghan airbases of Bagram and Kulyab, to supply vast amounts of arms to the Northern Alliance. Reports indicate that in a single day in 1997, 13 Iranian flights landed at Bagram, and Iran is still suspected of sending 700 tons of arms via Tajikistan."
 AFG_junbishis: "Junbishis"
 AFG_junbishis_desc: "§RWe can't manually boost §W[Conservative_L]'s§! popularity while Abdul Rashid Dostum is in in exile §!\n\nJunbish-i Milli Islami Afghanistan, commonly known as Junbish, is a major faction within the Northern Alliance, primarily consisting of ethnic Uzbeks. It was recently expelled from its stronghold Mazar-i-Sharif by Taliban forces, but Junbish continues to play a significant role within the Northern Alliance. The group is led by General Abdul Rashid Dostum, a prominent warlord who has been at odds with other members of the Northern Alliance in the Past and has a strained relationship while he is in exile."
 AFG_northern_alliance_taloqan_siege: "The Siege on Taloqan"
 AFG_northern_alliance_taloqan_siege_desc: "In recent history, Taloqan served as the strategic headquarters for Ahmad Shah Massoud, a prominent leader among the mujahideen factions, during their resistance against the Soviet Army. Following this period, it assumed the role of headquarters of [AFG.GetFlag] [AFG.GetNameDefCap] after the city of Mazar-i-Sharif was overrun by Taliban forces in 1997."
 AFG_idea_opium_economy: "Afghan Opium Economy"
 AFG_idea_opium_economy_desc: "A large proportion of Afghan farmers make their living by growing and selling poppies for opium. Huge poppy fields fill a lot of our arable land."
 AFG_idea_opium_barons: "Afghan Opium Barons"
 AFG_idea_opium_barons_desc: "A large proportion of Afghan farmers make their living by growing and selling poppies for opium. Huge poppy fields fill a lot of our arable land. The government's new policies have enabled a situation where a large clique of opium barons operates several large trading networks. The influence of these opium barons within the government is undeniable."
 AFG_idea_afghan_defence: "Extensive Defensive Measures"
 AFG_idea_afghan_defence_desc: "Our country is engulfed in a civil war. We have been losing ground, but we won't take one more step back!"
 AFG_idea_un_troops: "UN Peacekeeping Troops"
 AFG_idea_un_troops_desc: "We have requested that UN Peacekeepers be deployed in our country in the hopes of bringing stability to our country."
 AFG_political_events.1.t: "[AFG.GetNameDef] Request for Weaponry"
 AFG_political_events.1.d: "[AFG.GetNameDef] has sent an envoy to [ROOT.capital.GetName] to negotiate an agreement for us to equip them with the necessary gear to proceed with their combat operations."
 AFG_political_events.1.a: "We will Accept"
 AFG_political_events.1.b: "Not Today"
 AFG_political_events.2.t: "[FROM.GetNameDef] Rejects Our Arms Request"
 AFG_political_events.2.d: "[FROM.GetNameDef] has denied our request for arms. We will not be disheartened by this denial and will persist with our current objectives."
 AFG_political_events.2.a: "Onward"
 AFG_political_events.3.t: "[FROM.GetNameDef] Signs Arms Shipment"
 AFG_political_events.3.d: "We express our profound gratitude to [FROM.GetNameDef] for providing the much-needed equipment we have long awaited."
 AFG_political_events.3.a: "Great!"
 AFG_political_events.4.t: "First Afghan Elections"
 AFG_political_events.4.d: "Today marks the end of the vote counting. We are finally on the cusp of electing the first leader of Afghanistan."
 AFG_political_events.4.a: "Hamid Karzai's Government"
 AFG_political_events.4.b: "Naveen"
 AFG_political_events.4.c: "Jamiat-e Islami"
 AFG_political_events.4.e: "Saleh's Government"
 AFG_political_events.0.t: "Atta Installs Military Diarchy"
 AFG_political_events.0.d: "Atta Muhammad Nur, a former Mujahideen resistance commander, has marched his forces into Kabul, demanding control over certian levels of all military forces. With most men splintering to his cause, our options are severely limited, to say the least."
 AFG_political_events.0.a: "Our hands are tied"
 AFG_events.8.t: "[AFG.GetNameDef] Requests our Protection"
 AFG_events.8.d: "After decades of unrest, the Afghan government fears a reignition of war or external interference and invasion, the [AFG.GetNameWithFlag] President [AFG.GetLeader] has visited The White House and approached our President [USA.GetLeader] for a defence treaty. If we agree to protect them, we will be able to make sure that they are within our sphere of influence, but we will also have the obligation to defend [AFG.GetNameWithFlag] from external threats as well as provide assistance in maintaining the stability of their country, especially countering the £GFX_AFG_salafist_jihadism Taliban insurgency. Taking account of our country's situation, should we sign a defence treaty with [AFG.GetLeader]?"
 AFG_events.8.a: "Agree to protect them."
 AFG_events.8.b: "We don't have time for this!"
 AFG_events.9.t: "[USA.GetNameDef] has Agreed to Protect Us"
 AFG_events.9.d: "Thanks to our prudent efforts diplomatically, [USA.GetNameWithFlag]'s President [USA.GetLeader] has formally signed a defence treaty with our President [AFG.GetLeader]. By signing this defence treaty, [FROM.GetNameWithFlag] will not only protect us from external aggression, but also provide assistance on maintaining our internal stability."
 AFG_events.9.a: "Excellent!"
 AFG_events.10.t: "[USA.GetNameDef] Refused to Sign!"
 AFG_events.10.d: "Despite our President [AFG.GetLeader] visiting [USA.GetNameWithFlag] for security assistance, [USA.GetLeader] was apparently close-mouthed about any sort of treaties. [USA.GetLeader] has said in a press conference that \"We will always stand up for freedom, democracy and human rights in Afghanistan.\" But it is very obvious that [USA.GetLeader]'s commitment only remains in words, we will have to defend ourselves alone."
 AFG_events.10.a: "What a catastrophic visit..."
 AFG_events.11.t: "[AFG.GetNameDef] Requests our Protection"
 AFG_events.11.d: "After decades of unrest, the Afghan government fears a reignition of war or external interference and invasion, the [AFG.GetNameWithFlag] President [AFG.GetLeader] has visited the Zhongnanhai and approached General Secretary [CHI.GetLeader] for a defence treaty. If we agree to protect them, we will be able to make sure that they are within our sphere of influence, but we will also have the obligation to defend [AFG.GetNameWithFlag] from external threats as well as provide assistance in maintaining stability of the country, especially countering the £GFX_AFG_salafist_jihadism  Taliban insurgency. Taking account of our country's situation, should we sign a defence treaty with [AFG.GetLeader]?"
 AFG_events.11.a: "Another Iron Brother!"
 AFG_events.11.b: "We have nothing to spare for a treaty!"
 AFG_events.12.t: "[CHI.GetNameDef] has Agreed to Protect Us"
 AFG_events.12.d: "Thanks to our diplomatic efforts, [CHI.GetNameWithFlag]'s General Secretary [CHI.GetLeader] has formally signed a defence treaty with our President [AFG.GetLeader], by signing this defence treaty, [FROM.GetNameWithFlag] will not only protect us from external aggression, but also provide assistance on maintaining our internal stability."
 AFG_events.12.a: "Excellent!"
 AFG_events.13.t: "[CHI.GetNameDef] Refused to Sign!"
 AFG_events.13.d: "Despite our President [AFG.GetLeader] visiting [CHI.GetNameWithFlag] for security assistance, [CHI.GetLeader] was apparently close-mouthed about any sort of treaties. [CHI.GetLeader] has said to our president that \"We will always be committed to regional security and stability.\" But it is very obvious that [CHI.GetLeader]'s commitment only remains in words, we have to defend ourselves alone."
 AFG_events.13.a: "What a disappointment..."
 AFG_events.14.t: "[AFG.GetNameDef] Publically Denounces Durrani Line"
 AFG_events.14.d: "Just moments ago, the [AFG.GetNameWithFlag]'s president [AFG.GetLeader] announced that [AFG.GetNameWithFlag] will never recognize the Durand Line arbitrarily set up by the British in the 20th century as the border between the two countries and made a loud statement that \"We may not be able to reclaim our holy Pashtun land at the moment, but our descendants in the next generations will definitely reclaim this land, which is rightfully ours. Time will tell all!\" It has been very clear that [AFG.GetNameWithFlag] is now turning into a hostile foreign policy toward our country."
 AFG_events.14.a: "There is absolutely no justification for them to do that!"
 AFG_events.15.t: "Assassination of Burhanuddin Rabbani"
 AFG_events.15.d: "This evening, Burhanuddin Rabbani was assassinated in a suicide bombing at his home in Kabul, today is also his 71st birthday. Two men posing as representatives of the Taliban approached him to offer a hug and one of them detonated his explosives hidden inside his turban. The suicide bomber claimed to be a Taliban commander who said to have a very important and a positive message from the Taliban leaders in Pakistan. They said the Taliban wanted to discuss peace with Rabbani. Four other members of our government's High Peace Council were also killed in the blast. Our sources confirmed that Quetta Shura, the Taliban leadership hiding in Quetta, Pakistan, is responsible for this assassination.\n\nRabbani served as the chairman of our nation's High Peace Council after he left a leading role within the government. During that time, he successfully persuaded hundreds of Taliban militants to peacefully lay down their arms. The assassination is a major blow to the peace process in our country as it will be difficult to find someone of his prestige to serve in this position."
 AFG_events.15.a: "Hold a state funeral."
 AFG_events.16.t: "[AFG.GetNameDef] Seeks Recognition of Neutrality"
 AFG_events.16.d: "Recently [AFG.GetNameDef] has chosen to pursue a path of neutrality in order to become a permanent neutral nation. They have demonstrated their willingness to fulfil the obligations as a permanent neutral country but whether it will be fulfilled remains to be seen.\n\nThe government of Afghanistan is now seeking our country to become a guarantor of their neutral country status. If we do, we will have the obligation to protect Afghanistan if it is invaded. If we don't, other countries may guarantee their status and we have nothing to lose from this."
 AFG_events.16.a: "Agree to guarantee their status as a neutral power"
 AFG_events.16.b: "We don't have time for Afghanistan"
 AFG_events.17.t: "[FROM.GetNameDef] Guarantees our Status of Neutrality"
 AFG_events.17.d: "The statement from [FROM.GetAdjective] government states that [FROM.GetNameDef] is willing to guarantee our neutrality status and will come to our defence in the event of an external invasion of our country.\n\nThis is a significant achievement since we have gained recognition of neutrality status from at least one permanent member of the United Nations Security Council."
 AFG_events.17.a: "Excellent!"
 AFG_events.18.t: "Afghan People Revolt Against Taliban"
 AFG_events.18.d: "Following Operation Enduring Freedom, several tribal and ethnic minority militias launched uprisings against the Taliban, noticeably in Herat. With assistance from the United States and Iran, these militia have taken control of several areas from the Taliban and joined the command of the Northern Alliance.\n\nThe uprising was met with celebratory gunfire from local residents, some celebrations even include 'dancing on the rooftops' and honking car horns. Mohammad Ismail Khan, one of the key Northern Alliance commanders also known as the \"Lion of Herat\", granted amnesty for former Taliban fighters, but warned of repercussions if said fighters were to take up arms again."
 AFG_events.18.a: "Victory is near!"
 AFG_news.7.t: "[AFG.GetNameDef] Announces Claims on Pakistani Territory"
 AFG_news.7.d: "Just moments ago, [AFG.GetNameWithFlag]'s President [AFG.GetLeader] announced that [AFG.GetNameWithFlag] will never recognize the Durand Line arbitrarily set up by the British in the 20th century as the border between the two countries and made a loud statement that \"We may not be able to reclaim our holy Pashtun land at the moment, but our descendants in the next generations will definitely reclaim this land, which is rightfully ours. Time will tell all!\" [PAK.GetNameWithFlag]'s President [PAK.GetLeader] responded by rejecting all the claims made by [AFG.GetLeader] and strongly criticised this action stating that \"The hostile diplomatic actions done by [AFG.GetLeader] will do nothing except further damage the relationship between our two countries.\" and called the Afghan government to respect International law. It has been very clear that the diplomatic relations between both countries have further deteriorated."
 AFG_news.7.a: "Let's see what happens next."
 AFG_news.8.t: "Coup in Afghanistan"
 AFG_news.8.d: "Due to the corruption of the central government, the economic deprivation and poverty of the people, many Afghans who lost their livelihoods and were disenfranchised with the status quo have joined Hekmatyar's £GFX_AFG_kingdom Hezb-e Islami. A group of Afghan military officers who have not been paid for a long time staged a coup, overthrowing the republican government, declaring a suspension of the current Afghan constitution and the temporary imposition of military control. Gulbuddin Hekmatyar, who served twice as Afghanistan's Prime Minister in the 1990s, officially ended his exile and returned to Afghanistan as the new President of Afghanistan. Hekmatyar promised to eradicate corruption, revive the economy and lead the Afghan people into a new chapter. In response to the coup, a Taliban spokesman issued a statement that \"We are the real Afghans and we will continue to take down Hekmatyar, the \"Butcher of Kabul\"\"."
 AFG_news.8.a: "Another chapter in the forever war..."
 AFG_news.9.t: "[AFG.GetNameDef] Deploys Military into Cities"
 AFG_news.9.d: "Due to recent radical policies by [AFG.GetLeader]'s leadership, such as repressing political freedoms, personal freedoms, Taliban-style Sharia Law and removing tribal influence. A major protest has started against the ruling government, [AFG.GetLeader]'s government responded by deploying troops into cities and towns and some protestors were fatally shot by the Afghan National Army soldiers or the Afghan National Police units. It looks like [AFG.GetNameDef] is descending into totalitarianism."
 AFG_news.9.a: "That's everyday life in Afghanistan..."
 AFG_news.10.t: "Assassination of Burhanuddin Rabbani"
 AFG_news.10.d: "Burhanuddin Rabbani was assassinated in a suicide bombing tonight at his home in Kabul. Two suicide bombers posing as Taliban representatives claimed to want to discuss peace with Rabbani approached him to offer a hug and one of them detonated his explosives inside his turban. Four other members of Afghanistan's High Peace Council were also killed in the blast.\n\nRabbani served as the chairman of Afghanistan's High Peace Council after he left a leading role within the government. During that time, he successfully persuaded hundreds of Taliban militants to peacefully lay down their arms. His assassination is a major blow to the peace process in Afghanistan."
 AFG_news.10.a: "Tragic news."
 AFG_news.11.t: "Hijacking of Ariana Airlines Flight 805"
 AFG_news.11.d: "A group of nine Afghan men led by brothers Ali and Mohammed Safi who were fleeing the Taliban regime hijacked Ariana Afghan Airlines Flight 805, a Boeing 727 aircraft with the registration YA-FAY with 180 passengers and 7 crew on board. Flight 805 was a domestic flight from Kabul to Mazar-i-Sharif Airport.\n\nThe hijackers forced the crew to fly to London Stansted Airport in the United Kingdom after stopovers in Tashkent, Aktobe and Moscow. The siege of the aircraft lasted until 10th February. Whether or not the hijackers will be convicted is unknown as they are awaiting trial next year."
 AFG_news.11.a: "We should have intercepted them with one of our MiGs."
 AFG_news.12.t: "Hijacking of Ariana Airlines Flight 805"
 AFG_news.12.d: "A group of nine Afghan men led by brothers Ali and Mohammed Safi who were fleeing the Taliban regime hijacked Ariana Afghan Airlines Flight 805, a Boeing 727 aircraft with the registration YA-FAY with 180 passengers and 7 crew on board. Flight 805 was a domestic flight from Kabul to Mazar-i-Sharif Airport.\n\nThe hijackers forced the crew to fly to London Stansted Airport in the United Kingdom after stopovers in Tashkent, Aktobe and Moscow. The siege of the aircraft lasted until 10th February. Whether or not the hijackers will be convicted is unknown as they are awaiting trial next year."
 AFG_news.12.a: "Interesting"
 AFG_news.12.b: "Terrorism is a scourge on humanity."
 AFG_news.13.t: "Iran Sends refugees back to Afghanistan"
 AFG_news.13.d: "After reaching an agreement with the UNHCR, Iran started a repatriation program that would send 7,700 Afghan refugees back to their homeland over the next three weeks."
 AFG_news.13.a: "Is there an ending to this war?"
 AFG_news.14.t: "War in Afghanistan leaves thousands hungry"
 AFG_news.14.d: "The World Food Program reported that the drought situation in Kandahar province and Zabul province were desperate. The Koochi people had lost up to 80% of their cattle and irrigation systems built to collect rainwater had dried up. Apricot and almond trees had withered and were without fruit. Camels were dying. Since February, the WFP had been feeding 30,000 families in the region and planned on adding another 10,000 families in May. The WFP was offering Afghans additional flour as an incentive if they remain in their villages."
 AFG_news.14.a: "The Afghan people need us."
 AFG_events.32.t: "The Castle called Taloqan has fallen"
 AFG_events.32.d: "The Taliban's ruthless capture prompted a mass exodus, as civilians fled towards Imam Sahib and the Panjshir Valley. After a brutal siege claiming hundreds of civilian lives, our soldiers halted the Taliban's advance to the city's north and east but couldn't reclaim it. We've abandoned our Northern Alliance headquarters in the city, relocating our base of operations to Fayzabad."
 AFG_events.32.a: "A dark day"
 AFG_events.31.t: "Taloqan stands fight Another day"
 AFG_events.31.d: "After enduring a brutal siege, the Taliban faced defeat. This triumph echoes the resilience of our victories that have become before. Let this be a another step of the Taliban's ultimate demise as, \"Talaqan is a place of treasures of Allah. These treasures are not of gold and silver, but consist of people who have recognised Allah as they should have.\""
 AFG_events.31.a: "A dark day"
 AFG_investment.1.t: "[AFG.GetNameDef] Invites Us to Invest in their Projects"
 AFG_investment.1.desc: "Recently recovered from the war against the Taliban, the government of [AFG.GetNameWithFlag] is inviting us to invest in some of the projects in their country. However, whether to invest or not is up to us. if we choose to invest, we can gain some influence on their government, if the terror threat remains high in Afghanistan, we better not risk it."
 AFG_investment.1.a: "Invest in their infrastructure!"
 AFG_investment.1.b: "Invest in their civilian industry!"
 AFG_investment.1.c: "Invest in their service industry!"
 AFG_investment.1.d: "We'd better not risk it."
 AFG_investment.2.t: "[FROM.GetNameDef] Invested in our Infrastructure!"
 AFG_investment.2.d: "After days of negotiations, [FROM.GetNameWithFlag] has agreed to invest in our infrastructure in exchange for some minimal concessions. The investment will benefit our rural population in the country."
 AFG_investment.2.a: "We are grateful for their help!"
 AFG_investment.3.t: "[FROM.GetNameDef] Invested in our Civilian Industry!"
 AFG_investment.3.d: "After days of negotiations, [FROM.GetNameWithFlag] has agreed to help us build some civilian factories in exchange for some minor concessions. The investment will benefit our country's industry sector and facilitate the modernization of the country."
 AFG_investment.3.a: "We are grateful for their help!"
 AFG_investment.4.t: "[FROM.GetNameDef] Invested in our Service Industry!"
 AFG_investment.4.d: "After days of negotiations, [FROM.GetNameWithFlag] has agreed to invest in our service industry by building some offices in exchange for some minor concessions. The investment will benefit our country's financial sector and facilitate the modernization of the country."
 AFG_investment.4.a: "We are grateful for their help!"
 AFG_investment.5.t: "[FROM.GetNameDef] Declined to Invest!"
 AFG_investment.5.d: "After days of negotiations, [FROM.GetNameWithFlag] has rejected our invitation of investment, citing that the business environment in our country is not safe enough yet and will be carefully evaluating future investment deals with us."
 AFG_investment.5.a: "Guess we need to do more work!"
 AFG_taliban_insurgency.0.t: "The Start of the Taliban Insurgency"
 AFG_taliban_insurgency.0.d: "After the collapse of the main Taliban force, their battalions have fragmented into various splinter cells and have begun waging a guerrilla war in every corner of Afghanistan and launching egregious terrorist attacks. It's estimated that the insurgency will take years to quell properly but if we don't act on the situation, we will simply never have stability in our country."
 AFG_taliban_insurgency.0.a: "It's time to get to work!"
 AFG_taliban_insurgency.1.t: "Successful Raid of a Taliban Hideout"
 AFG_taliban_insurgency.1.d: "Thanks to our brave commando units, the Taliban hideout we found was destroyed, some of the Taliban militants attempted to resist but were killed by our commando units while most others surrendered with very few escaping justice. Overall, the operation was a complete success!"
 AFG_taliban_insurgency.1.a: "Excellent!"
 AFG_taliban_insurgency.2.t: "Failure of the Raid"
 AFG_taliban_insurgency.2.d: "Failing to carry out the raid conclusively was a huge blow to our counter-terror commando unit. The Taliban appeared to know our raid plans in advance and launched a preemptive attack on some of our convoys, planting IEDs on our must-go route and ambushing our commandos after the explosion occurred. Several commandos sadly died as a result.\n\nIn debriefing, some military generals suspect that there may have been sympathisers within the organisers of the operation who could have leaked the plan to the Taliban, the debriefing report also criticised corruption from the government that may have led to the loss of the commandos' lives. We must review this failure and learn a lesson from this!"
 AFG_taliban_insurgency.2.a: "Rest in peace to our heroes!"
 AFG_taliban_insurgency.3.t: "Airstrike Successful"
 AFG_taliban_insurgency.3.d: "Good news! Our air force's counter-insurgency aircraft piloted by one of our skilled servicemen has successfully destroyed a Taliban encampment based on coordinates provided by our intelligence agency, the Taliban camp was completely destroyed along with many Taliban militants killed within it.\n\nThis success has shown the effectiveness of our nation's internal security sector of the intelligence agency and proves that technology is vital in future counter-insurgency operations."
 AFG_taliban_insurgency.3.a: "A great success!"
 AFG_taliban_insurgency.4.t: "Airstrike Failure Killed Civilians"
 AFG_taliban_insurgency.4.d: "Horrible news! Our air force has bombed a target based on coordinates provided by our intelligence agency but it is now obvious that the bombs have hit civilian targets and resulted in the killing of innocent civilians instead of the intended Taliban combatants.\n\nThe local population is in mourning and is rightfully outraged by this failed operation, there are already reports of protests in the area. We must review the reasons for the failure of this particular operation in order to give an explanation to our citizens."
 AFG_taliban_insurgency.4.a: "A tragedy!"
 AFG_taliban_insurgency.5.t: "Aircraft Shot Down by Taliban Militants"
 AFG_taliban_insurgency.5.d: "Tragic news from the airstrike operation! One of our counter-insurgency aircraft has been shot down by Taliban militants using a shoulder-fired anti-aircraft missile; the pilot has been killed as a result.\n\nThis operational failure has shown that we need to reorganise our airforce for future operations and to obtain better intel of our Taliban targets."
 AFG_taliban_insurgency.5.a: "A heroic pilot, rest in peace!"
 AFG_taliban_insurgency.6.t: "Success of Unity Propaganda"
 AFG_taliban_insurgency.6.d: "Thanks to our unity propaganda efforts, some Taliban fighters have come to our police and military checkpoints and laid down their weapons, some have hugged our soldiers and local police. Our soldiers and police did not give them too much trouble, instead, they gave many of the Taliban militants who laid down their weapons some toll money to get them home. This has caused growth in public trust of the government and national unity."
 AFG_taliban_insurgency.6.a: "A successful development!"
 AFG_taliban_insurgency.7.t: "Failure of Unity Propaganda"
 AFG_taliban_insurgency.7.d: "It has been hugely disappointing to our government that our recent unity propaganda effort did not have positive returns. The word from some of the Taliban commanders at the bottom is that Taliban leadership sees the current Afghan government as a government of thieves, a puppet of a foreign government, and not at all representative of the Afghan nation. They consider themselves to be the real Afghans."
 AFG_taliban_insurgency.7.a: "Maybe we need to do more on our part..."
 AFG_taliban_insurgency.8.t: "The Elimination of the Taliban Insurgency"
 AFG_taliban_insurgency.8.d: "A few hours ago the Afghan government officially confirmed that they have successfully wiped out the Taliban insurgency. According to information released by the Afghan government, the vast majority of the Taliban have peacefully laid down their weapons and returned to their homes.\n\nA few hardened Taliban militants have fled across the Afghan-Pakistani border to the Pakistani tribal areas and joined local militant groups within the area. Since the Afghan government has sufficiently constructed security measures along the Afghan-Pakistani border, it is unlikely that the militants entrenched in Pakistan will infiltrate back across the border."
 AFG_taliban_insurgency.8.a: "Is the long-lasting conflict finally at an end?"
 AFG_taliban_insurgency.10.t: "Taliban Launches Large Scale Insurgency"
 AFG_taliban_insurgency.10.d: "The recent surge in Taliban attacks and an increase in violence has given the Taliban an opportunity to escalate the insurgency into civil war once more. The Taliban has taken a large swathe of the rural territory, making up a main southwestern stronghold along with some other rural areas falling to their rule.\n\nA small part of the Afghan National Army has seen soldiers deserting and some of those deserters have joined the Taliban, most have chosen to stay and resist the Taliban due to fear of being liquidated by the Taliban.\n\nWhether the international community will support us remains uncertain but we must rally our soldiers and fight towards victory."
 AFG_taliban_insurgency.10.a: "We have no choice but to fight!"
 AFG_taliban_insurgency.11.t: "Taliban Launches Large Scale Insurgency"
 AFG_taliban_insurgency.11.d: "The recent surge in Taliban attacks and an increase in violence has given the Taliban an opportunity to escalate the insurgency into civil war once more. The Taliban has taken a large swathe of the rural territory, making up a main southwestern stronghold along with some other rural areas falling to their rule.\n\nA small part of the Afghan National Army has seen soldiers deserting and some of those deserters have joined the Taliban, most have chosen to stay and resist the Taliban due to fear of being liquidated by the Taliban.\n\nAfghan leader [AFG.GetLeader] has announced that the insurgency will be crushed and has promised that the will fight until the peace has come."
 AFG_taliban_insurgency.11.a: "Afghanistan is at war again..."
 AFG_taliban_insurgency.14.t: "The Situation in Afghanistan"
 AFG_taliban_insurgency.14.d: "We know that the Afghan government has allowed us to station troops in their territory but our military intelligence agency warns that the Taliban is currently waging an insurgency throughout every corner of Afghanistan and that there are a multitude of other terrorist groups taking advantage of the unstable situation in Afghanistan. The terror threat has reached a critical level that could pose a real danger to our troops stationed there.\n\nIf we continue to maintain our troops' position in Afghanistan, they are likely to be targeted by the Taliban and other terrorist groups active in the nation. However, should we stay in the country, we can choose to assist the Afghan government forces in their counter-insurgency operations. If we choose to do so, our military can gain valuable experience such as different counter-insurgency and counter guerrilla warfare techniques, and can protect our citizens in Afghanistan.\n\n[ROOT.GetLeader], if you choose to continue stationing troops in Afghanistan, we won't stop you, but please think carefully if it is really worth the risk."
 AFG_taliban_insurgency.14.a: "We will contribute to Afghan counter-insurgency efforts."
 AFG_taliban_insurgency.14.b: "We'd better not risk our service members' lives."
 AFG_taliban_insurgency.15.t: "[FROM.GetNameDef] Joins our Struggle"
 AFG_taliban_insurgency.15.d: "[FROM.GetLeader], the leader of [FROM.GetNameDef] has informed our government that the [FROM.GetAdjective] troops stationed in our country are willing to join our struggle in the counter-insurgency battle against the Taliban in addition to protecting their citizens inside our country.\n\nFurthermore, [FROM.GetName] will also provide security assistance such as explosive detection devices and other more advanced military equipment."
 AFG_taliban_insurgency.15.a: "We are grateful for the help!"
 AFG_taliban_insurgency.16.t: "[FROM.GetNameDef] Begins Troop Pullout"
 AFG_taliban_insurgency.16.d: "[FROM.GetLeader], the leader of [FROM.GetNameDef] has informed our government that the [FROM.GetAdjective] troops stationed in our country has completed their mission and the soldiers are heading back home.\n\nThe commander of the [FROM.GetAdjective] troops in our country has already begun base handover processes with our commanders."
 AFG_taliban_insurgency.16.a: "Farewell!"
 AFG_taliban_insurgency.17.t: "Successful Raid of Taliban Hideout"
 AFG_taliban_insurgency.17.d: "Thanks to our brave commando units, the Taliban hideout we found was destroyed, some of the Taliban militants attempted to resist but were killed by our commando units while most others surrendered with very few escaping justice. Overall, the operation was a complete success!"
 AFG_taliban_insurgency.17.a: "Excellent!"
 AFG_taliban_insurgency.18.t: "Failure of the Raid"
 AFG_taliban_insurgency.18.d: "Failing to carry out the raid conclusively was a huge blow to our counter-terror commando unit. The Taliban appeared to know our raid plans in advance and launched a preemptive attack on some of our convoys, planting IEDs on our must-go route and ambushing our commandos after the explosion occurred. Several commandos sadly died as a result.\n\nIn debriefing, some military generals suspect that there may have been sympathisers within the organisers of the operation who could have leaked the plan to the Taliban, the debriefing report also criticised corruption from the government that may have led to the loss of the commandos' lives. We must review this failure and learn a lesson from this!"
 AFG_taliban_insurgency.18.a: "Rest in peace!"
 AFG_taliban_insurgency.21.t: "Drone Strike Successful"
 AFG_taliban_insurgency.21.d: "Our drone strike on the Taliban was successful! Our drone was able to spot, strike and destroy several Taliban hideouts near an urban zone, crippling their military capabilities in the area and temporarily leaving their local leadership structure completely disorganised.\n\nAlthough scared of the drone strike at first, the local population have now celebrated the retreat of the Taliban insurgents, at least for now."
 AFG_taliban_insurgency.21.a: "Drones are the future of warfare!"
 AFG_taliban_insurgency.22.t: "Failed Drone Strike Killed Civilians"
 AFG_taliban_insurgency.22.d: "Today, one of our drones targeted and destroyed what appeared to be a Taliban hideout near a residential area, but recent intelligence reports concluded that the targeted building was in fact a small apartment building occupied by civilians.\n\nMedia reporters are already covering the incident and many groups are criticising our involvement in this war."
 AFG_taliban_insurgency.22.a: "It was a technical error!"
 AFG_taliban_insurgency.23.t: "Bombing Operation Successful"
 AFG_taliban_insurgency.23.d: "Intelligence reports that today one of our strategic bombers destroyed a Taliban tunnel complex hidden in the mountains of eastern Afghanistan.\n\nOur successful bombing campaign is starting to paralyse Taliban operations in the isolated areas of the country and the collapse of their infrastructure will force the Taliban to surrender in time."
 AFG_taliban_insurgency.23.a: "The jihadists will learn to fear our air power!"
 AFG_taliban_insurgency.24.t: "Mistaken Bombing has Killed Civilians"
 AFG_taliban_insurgency.24.d: "Today, a catastrophic incident occurred!\n\nOur air force bombed a mountainous area in eastern Afghanistan until we discovered that there was no Taliban encampments in the area, but in fact, a small village between the mountains. The village was absolutely destroyed as a result of our bombing run.\n\nThe credibility of our air campaign has been called into serious repute. Our politicians and military command are being accused of war crimes against the Afghan people."
 AFG_taliban_insurgency.24.a: "This is terrible!"
 AFG_taliban_insurgency.25.t: "[FROM.GetNameDef] Provides Technical Equipment"
 AFG_taliban_insurgency.25.d: "A message from the [FROM.GetAdjective] government to our leadership has stated that [FROM.GetNameDef] will provide us some counter-insurgency technical equipment including explosive detection devices that can be installed on highways or in door entrances, dogs trained specifically to detect hidden explosives as well as some other electronics to improve our military and police's effectiveness in dealing with the Taliban insurgency.\n\nThe equipment is expected to arrive within a month and will hopefully reduce the growth of the Taliban insurgency, at least for a short period of time."
 AFG_taliban_insurgency.25.a: "We are grateful for the help!"
 AFG_taliban_attack.0.t: "Taliban Militants Attack Local Police Station"
 AFG_taliban_attack.0.d: "Today, a group of Taliban militants ambushed one of our government's police checkpoints without warning. Our police forces were clearly unprepared and caught off guard, they fought valiantly until their superiors gave the order to evacuate the checkpoint.\n\nTaliban militants had taken over the checkpoint until the military was informed, providing support to our police forces. There were weapons in the checkpoint's armoury that were taken by the Taliban however. During the attack, our police and military forces killed several Taliban militants, but our police force also lost several brave officers in return."
 AFG_taliban_attack.0.a: "They will pay for this!"
 AFG_taliban_attack.1.t: "Afghan Taliban Attacks Police Station"
 AFG_taliban_attack.1.d: "Today a group of Afghan Taliban militants ambushed one of the Afghan government's police checkpoints without warning. Afghan police forces were clearly unprepared and caught off guard, but they fought valiantly until their superiors gave the order to evacuate the checkpoint.\n\nTaliban militants had taken over the checkpoint until the Afghan military was informed, providing support to the police. There were weapons in the checkpoint's armoury that were taken by the Taliban however. During the attack, Afghan police and military forces killed several Taliban militants, but the police force also lost several brave officers in return."
 AFG_taliban_attack.1.a: "A troublesome development."
 AFG_taliban_attack.2.t: "Taliban Launches Bus Bombing"
 AFG_taliban_attack.2.d: "Today, a group of Taliban militants forced a bus to stop with a truck, used Kalashnikovs to shoot the civilians inside and then detonated a car bomb near the bus. After military police arrived, the Taliban militants fled the scene, some were shot and killed, while the few who did not escape were captured and taken to the military police for interrogation.\n\nFrom the results of the interrogation and subsequent investigation, we know that the terrorist attack purposefully targeted tourists and foreigners. The Taliban has offered a bounty for killing foreigners in Afghanistan. The attack has also resulted in casualties among foreign citizens and the countries of those affected are already demanding our government to conduct a full investigation of this attack."
 AFG_taliban_attack.2.a: "We must hunt those Taliban terrorists down!"
 AFG_taliban_attack.3.t: "Taliban Bus Bombing Kills our Citizens"
 AFG_taliban_attack.3.d: "Today, a group of Afghan Taliban militants forced a bus to stop with a truck, used Kalashnikovs to shoot the civilians inside and then detonated a car bomb near the bus. After the Afghan military police arrived, the Taliban militants fled the scene, some were shot and killed, while the few who did not escape were captured and taken to the military police for interrogation.\n\nThe attack has also resulted in casualties of our citizens, our ambassador to Afghanistan has contacted Afghan officials to attempt to deal with the aftermath."
 AFG_taliban_attack.3.a: "Send our condolences to the families of victims!"
 AFG_taliban_attack.4.t: "Foreigners Killed in Taliban Bus Bombing"
 AFG_taliban_attack.4.d: "Today, a group of Afghan Taliban militants forced a bus to stop with a truck, used Kalashnikovs to shoot the civilians inside and then detonated a car bomb near the bus. After the Afghan military police arrived, the Taliban militants fled the scene, some were shot and killed, while the few who did not escape were captured and taken to the military police for interrogation.\n\nThe attack has resulted in casualties of local Afghans and foreign citizens and has drawn widespread condemnation from the international community."
 AFG_taliban_attack.4.a: "Send our condolences to the victims!"
 AFG_taliban_attack.5.t: "Taliban Attacks Fuel Tanker Convoy"
 AFG_taliban_attack.5.d: "Today, Taliban militants attacked a convoy of fuel trucks that were supposed to deliver vital fuel to the military as well as military police. Taliban militants set fire to the tankers and the drivers of the tankers were kidnapped by the Taliban. The whereabouts of these drivers are as of yet, unknown.\n\nThere are no reports of casualties among local residents as of yet but the tankers were left completely burnt out and nearby roads are fully shut off by the military for safety purposes. It is predicted that it will take some time for life to return to normal in the area for local residents."
 AFG_taliban_attack.5.a: "We must rescue those drivers!"
 AFG_taliban_attack.6.t: "Afghan Taliban Burns Fuel Tankers"
 AFG_taliban_attack.6.d: "Today, Afghan Taliban militants attacked a convoy of fuel trucks that were supposed to deliver vital fuel to the military as well as military police. Taliban militants set fire to the tankers and the drivers of the tankers were kidnapped by the Taliban. The whereabouts of these drivers are as of yet, unknown.\n\nThere are no reports of casualties among local residents as of yet but the tankers were left completely burnt out and nearby roads are fully shut off by the military for safety purposes. It is predicted that it will take some time for life to return to normal in the area for local residents."
 AFG_taliban_attack.6.a: "Afghanistan is indeed a dangerous place..."
 AFG_taliban_attack.7.t: "Taliban Attacks Military Convoy"
 AFG_taliban_attack.7.d: "Today, Taliban militants have launched a shocking suicide bomb attack against one of our military convoys. The Taliban militants drove two cars and detonated both vehicles as they approached the military trucks.\n\nThe suicide attack resulted in several military trucks being destroyed by the shockwave from the blast and caused several casualties among our soldiers, thankfully our soldiers have mostly only suffered injury, the Taliban militants involved in the attack were killed immediately by their own bombs however."
 AFG_taliban_attack.7.a: "We need to increase vehicle screening!"
 AFG_taliban_attack.8.t: "Taliban Suicide Attack Targets Afghan Military"
 AFG_taliban_attack.8.d: "Today, Afghan Taliban militants have launched a shocking suicide bomb attack against one of Afghanistan's military convoys. The Taliban militants drove two cars and detonated both vehicles as they approached the military trucks\n\nThe suicide attack resulted in several military trucks being destroyed by the shockwave from the blast and caused several casualties among the Afghan military's soldiers, the Taliban militants involved in the attack were killed immediately by their own bombs however."
 AFG_taliban_attack.8.a: "How did the Afghan military let that happen?"
 AFG_taliban_attack.9.t: "Taliban Targets Foreign Troops"
 AFG_taliban_attack.9.d: "Today, a Taliban militant disguised as a local resident, quietly approached a convoy of foreign troops that were sent to our country detonated a bomb hidden in his turban. While nobody was injured in the first blast, another group of Taliban militants took advantage of the chaos created by the blast and used RPGs to fire rockets at the foreign troops.\n\nThe situation subsided after military reinforcements arrived but unfortunately this attack has resulted in many casualties and several military vehicles have been destroyed."
 AFG_taliban_attack.9.a: "Damn"
 AFG_taliban_attack.10.t: "Our Service Members Killed in Taliban Attack"
 AFG_taliban_attack.10.d: "Today, a Taliban militant disguised as a local resident, quietly approached a convoy of foreign troops that were sent to our country detonated a bomb hidden in his turban. While nobody was injured in the first blast, another group of Taliban militants took advantage of the chaos created by the blast and used RPGs to fire rockets at the foreign troops.\n\nThe situation subsided after reinforcements arrived but unfortunately this attack has resulted in many casualties of our service members and several military vehicles have been destroyed. Our local commander has been in contact with the Afghan military commanders to deal with the aftermath."
 AFG_taliban_attack.10.a: "Send condolences to the fallen soldiers!"
 AFG_taliban_attack.11.t: "Foreign Troops Killed in Taliban Attack"
 AFG_taliban_attack.11.d: "Today, a Taliban militant disguised as a local resident, quietly approached a convoy of foreign troops that were sent to our country detonated a bomb hidden in his turban. While nobody was injured in the first blast, another group of Taliban militants took advantage of the chaos created by the blast and used RPGs to fire rockets at the foreign troops.\n\nThe situation subsided after military reinforcements arrived but this attack has resulted in many casualties and several military vehicles have been destroyed."
 AFG_taliban_attack.11.a: "Why can't they eliminate the Taliban?"
 AFG_taliban_attack.12.t: "Taliban Launches Building Bombing"
 AFG_taliban_attack.12.d: "Today, a building was rocked by a massive blast in one of the buildings that includes offices of foreign investors, the subsequent investigation results has determined that the bomb was likely made from a series of artillery shells stolen or lost from an Afghan National Army armory. The Taliban have since claimed responsibility for this bombing.\n\nThere are foreigners among those killed and our government officials have been in contact with their ambassadors to deal with the aftermath."
 AFG_taliban_attack.12.a: "This will negatively impact our national image!"
 AFG_taliban_attack.13.t: "Our Contractors Killed in Taliban Bombing"
 AFG_taliban_attack.13.d: "Today, a building was rocked by a massive blast in one of the buildings that includes offices of one of our contractors, the subsequent investigation results has determined that the bomb was likely made from a series of artillery shells stolen or lost from an Afghan National Army armory. The Taliban have since claimed responsibility for the bombing.\n\nSome of our citizens are among the casualties and our ambassador to Afghanistan has been in contact with Afghan government officials to deal with the aftermath."
 AFG_taliban_attack.13.a: "They must protect our investors!"
 AFG_taliban_attack.14.t: "Foreigners Killed in Taliban Building Bombing"
 AFG_taliban_attack.14.d: "Today, a building was rocked by a massive blast in one of the buildings that includes offices of foreign contractors in a major town in Afghanistan, the subsequent investigation results has determined that the bomb was likely made from a series of artillery shells stolen or lost from an Afghan National Army armory. The Taliban have since claimed responsibility for the bombing.\n\nThere are foreign citizens among the casualties and Afghan government officials have been in contact with the ambassadors of those countries affected to deal with the aftermath."
 AFG_taliban_attack.14.a: "Why would any country invest in Afghanistan?"
 AFG_taliban_attack.15.t: "Taliban Bombs Airport"
 AFG_taliban_attack.15.d: "Today, one of our dual-use airports was hit by a car bomb when a truck carrying an explosive device rammed through the guardrail at the entrance to the airport and detonated the device mounted in the truck. The explosion caused significant damage to the airfield due to the extremely high explosive yield of the bomb in the vehicle. Shortly after the first reports came in, the Haqqani network, the most radical branch of the Taliban, claimed responsibility for the attack.\n\nThe attack has left a large number of casualties among the ground crews and the passengers waiting in the terminal. Our security services were caught completely off guard, and the public is asking how a truck packed with explosives was able to reach the gates of a guarded airfield in the first place."
 AFG_taliban_attack.15.a: "The Taliban terrorists must be hunted down!"
 AFG_taliban_attack.16.t: "Major Airport Attack in Afghanistan"
 AFG_taliban_attack.16.d: "Today, one of Afghanistan's dual-use airports was hit by a car bomb when a truck carrying an explosive device rammed through the guardrail at the entrance to the airport and detonated the device mounted in the truck. The explosion caused significant damage to the airport due to the extremely high explosive yield of the bomb in the vehicle. Shortly after the reports were coming in, the Haqqani network, the most radical branch of the Taliban, claimed responsibility for the attack.\n\nThe attack resulted in a large number of casualties, but there are no reports of any [ROOT.GetAdjective] citizens in Afghanistan killed or injured. Our leader [ROOT.GetLeader] has sent condolences to [AFG.GetLeader] for the attack and has strongly condemned the actions of the Taliban."
 AFG_taliban_attack.16.a: "The Taliban insurgency has reached a critical level!"
 AFG_news.17.t: "Anti-Taliban Uprising in Afghanistan"
 AFG_news.17.d: "Following Operation Enduring Freedom, Herat witnesses a surge of resistance as local militias, aided by the US and Iran, challenge Taliban control. Celebratory scenes fill the streets as militias seize key areas and align with the Northern Alliance. \"Lion of Herat\" Mohammad Ismail Khan offers amnesty to former Taliban fighters but warns against future hostilities. The uprisings mark a pivotal moment in Afghanistan's struggle for stability."
 AFG_news.17.a: "Interesting Turn of Events"
 AFG_events.27.t: "Role of Women"
 AFG_events.27.d: "Though the concept of women's roles in our society may seem unconventional, the state has varying ideas on how to progress forward."
 AFG_events.27.a: "They should play a more traditional role"
 AFG_events.27.b: "Let's give them a role"
 AFG_events.28.t: "Role of Religion"
 AFG_events.28.d: "The role of religion and whether Afghanistan should open up or maintain its strict adherence to Sunni Islam is a contentious issue."
 AFG_events.28.a: "We will stay closed"
 AFG_events.28.b: "We should open up"
 AFG_events.35.t: "Airlift to the Northern Alliance"
 AFG_events.35.d: "Amidst the ongoing conflict in Afghanistan, Russia finds itself in the affairs of the region. Since 1996, the Russian government has been quietly supporting the Northern Alliance, providing arms and supplies to strengthen the ousted Afghan government's resistance. This support originates from the fear of the conflict spreading into Central Asia, as seen previously with the UTO in the Tajikistani civil war. Now, with Defense Minister Ivanov revealing the extent of this assistance, the Russian leadership faces a critical decision: whether to persist in aiding the Northern Alliance despite the economic strain or to withdraw support altogether."
 AFG_events.35.a: "Request the United States takes the Cost"
 AFG_events.35.b: "We can Foot the Cost"
 AFG_events.35.c: "Cut the Flow of Aid"
 AFG_events.36.t: "Afghan Northern Alliance Open to Hosting Drones"
 AFG_events.36.d: "With the 1998 US embassy bombings and the subsequent U.S. missile strikes on al-Qaeda training camps in Afghanistan, the United States has increased efforts to dismantle terrorist networks, including demanding the surrender of Osama bin Laden. A meeting of top national security officials agreed that the Taliban would be presented with an ultimatum to hand over bin Laden. Despite previous reluctance to collaborate with the Northern Alliance, there is now an opportunity for joint action in tracing bin Laden's whereabouts."
 AFG_events.36.a: "Send in Surveillance Drones "
 AFG_events.36.b: "We have already given the goal"
 AFG_events.37.t: "Increased Support for Afghanistan's Northern Alliance"
 AFG_events.37.d: "As the conflict in Afghanistan rages, the Northern Alliance finds itself in need of increased support to combat the Taliban and al-Qaeda. India's covert assistance has been crucial, providing funds, radar gear, aeroplane parts, and technical support for maintaining fighter aircraft. With Indian military advisors being valuable in battling the Taliban, their assistance has become indispensable to [AFG.GetLeader]'s Soldiers."
 AFG_events.37.a: "The removal of Pakistani proxies is necessary."
 AFG_events.37.b: "We do not wish to continue this process."
 AFG_events.38.t: "Russian Airlift Equipment Arrives in Afghanistan"
 AFG_events.38.d: "Russian military equipment, including arms, supplies, and vehicles, has begun arriving in Afghanistan via airlift, The arrival of this equipment creates a new opening in the war"
 AFG_events.38.a: "Good news"
 AFG_events.39.t: "U.S. Approval for Drone Support"
 AFG_events.39.d: "The United States has approved the request for drone support to target al-Qaeda training camps and track Osama bin Laden. we can now utilize intelligence to gather and coordinate efforts with U.S. forces."
 AFG_events.39.a: "Great News"
 AFG_events.40.t: "Indian Support Continues"
 AFG_events.40.d: "Afghanistan receives support from India, including funds, radar gear, aeroplane parts, and military advisors."
 AFG_events.40.a: "Great"
 AFG_events.41.t: "Support Request Rejected "
 AFG_events.41.d: "Despite efforts to secure additional support, the request for assistance has been rejected. We will have to rely on existing resources."
 AFG_events.41.a: "Disappointing"
 AFG_events.42.t: "Russia Request we Foot the Bill"
 AFG_events.42.d: "Russia is not willing to cover the costs of the expensive airlift operation to supply the Northern Alliance in Afghanistan. Mr. Ivanov has approached the United States for help, and discussions have been held with British defense officials as well. The USA is faced with a decision on whether to assist Russia in this operation."
 AFG_events.42.a: "We can do it"
 AFG_events.42.b: "we cannot"
 AFG_news.18.t: "Russia's Request for the U.S. to Pay for Airlift to Afghanistan"
 AFG_news.18.d: "Russia's request for assistance in funding the airlift operation to supply the Northern Alliance in Afghanistan has been met with mockery from the global community. Despite their military prowess, Russia's reluctance to foot the bill has drawn criticism, with many questioning their commitment to the cause. Some have even suggested that Russia should reconsider its priorities and focus on addressing its own economic woes. Supplies began to flow into Afghanistan at the end of September, with ammunition and military hardware being delivered via pontoon bridges built by Russia's 201st division over the Pyandj River that divides Tajikistan and Afghanistan, as reported by Nezavismaya Gazeta"
 AFG_news.18.a: "Where Has All the Money Gone?"
 AFG_news.18.c: "Will the Eagle Come to Rescue the Wounded Bear Once Again?"
 AFG_news.18.b: "Uh Actually"
 AFG_news.19.t: "USA Deploys Predator Drones in Afghanistan"
 AFG_news.19.d: "The United States has deployed Predator drones in Afghanistan to target terrorist strongholds of al-Qaeda. This escalation in Afghanistan starts a new age of United States military presence in the region. The drones are expected to provide intelligence and surveillance, enhancing the United States military's operations in the country."
 AFG_news.19.a: "Interesting"
 AFG_news.20.t: "[AFG.GetLeader] address to the European Parliament"
 AFG_news.20.d: "During the press conference at the European Parliament, [AFG.GetLeader] urged global leaders to pressure Pakistan on its support for the Taliban and requested humanitarian aid to alleviate the suffering of the Afghan people. The plea comes as he also warns of a planned attack on western nations by al-Qaeda."
 AFG_news.20.a: "This could be a concern"
 AFG_news.21.t: "Dostum Joins Plans for Assault on Mazar-i-Sharif"
 AFG_news.21.d: "Dostum's return to Afghanistan from exile was taken as an opportunity to seize back Mazar-i-Sharif. Now, alongside Commander Ahmad Shah Massoud, Ismail Khan, and Mohammad Mohaqiq, he prepares for a offensive against the Taliban-held city of Mazar-i-Sharif. \n\nDostum, originally the commander of military unit 374 under the PDPA communist forces, had defected to the mujahideen after the fall of Kabul in 1992. He then established his Proto state in Mazar-i-Sharif, commonly known as the Northern Autonomous Zone. he printed his own currency and even operated his own airline, Balkh Air.\n\nAfter briefly losing control of Mazar-i-Sharif to the Taliban, Dostum returned from exile in October 1997 to retake charge. Despite his efforts, the Taliban returned in 1998, prompting Dostum to flee once again to Turkey."
 AFG_news.21.a: "Let's see what happens."
 AFG_events.45.t: "Mahmoud Surkha has defected to the Taliban"
 AFG_events.45.d: "Commander Mahmoud Surkha has defected to the Taliban claiming dissatisfaction with Russian interference in the war. [AFG.GetLeader] denies the allegation but says that it has the right to seek international support as the defacto recognized government of Afghanistan."
 AFG_events.48.t: "Abdullah Jan Wahidi defects"
 AFG_events.48.d: "Haji Abdul Qadeer admitted that one of their key commanders, Abdullah Jan Wahidi, had defected to the Taliban."
 AFG_events.48.a: "Nothing we can do"
 AFG_events.44.t: "Ismail Khan escapes Kandahar Prison"
 AFG_events.44.d: "Ismail Khan, a former governor of Herat and resistance leader to the ruling Taliban regime, escapes from prison in Kandahar. \nKhan could be considered one of the most respected mujahideen leaders in the insurgency against the Soviets. In 1992, mujahideen troops captured Herat, and Ismail Khan became governor. In 1995, he defended the city against the Taliban in cooperation with Ahmad Shah Massoud. Khan even went on the offensive to the Taliban stronghold of Kandahar but was driven back. This changed when General Abdul Rashid Dostum attacked Herat, forcing Ismail Khan and his 8,000 men to flee into Iran before the Taliban swept in to take control of Herat province. Two years later, while organizing resistance to the Taliban in the Faryab area, he was betrayed and captured by Abdul Majid Rouzi, who had defected to the Taliban along with Abdul Malik Pahlawan, then one of Dostum's deputies."
 AFG_events.44.a: "Taking the odds once again"
 AFG_events.45.a: "What can we do anyway"
 AFG_events.65.t: "Afghanistan Appeals for support"
 AFG_events.65.d: "Facing dwindling equipment and resources, Afghanistan urgently requests our assistance by dispatching operatives to train local Afghan fighters and provide them with necessary equipment and vehicles, enabling them to combat the Taliban independently, thus minimizing the need for direct military intervention"
 AFG_events.65.a: "Yes we will"
 AFG_events.65.b: "No we wont"
 AFG_events.66.t: "They Accept"
 AFG_events.66.d: "The United States has accepted the request and will be deploying advisers along with equipment to aid Afghanistan in its battle against the Taliban, marking a significant step in bolstering Afghan forces and strengthening collaborative efforts to combat insurgency and stabilize the region."
 AFG_events.66.a: "We shall be on the move"
 AFG_border_wars.1.t: "[event_target:AFG_ATTACKER.GetName] Wins Border War"
 AFG_border_wars.1.d: "[event_target:AFG_ATTACKER.GetName] has won the border war against [event_target:AFG_DEFENDER.GetName] and advanced into new land. They are likely to continue their offensive after this."
 AFG_border_wars.1.a: "Huzzah!"
 AFG_border_wars.1.b: "Damn"
 AFG_border_wars.1.c: "Escalate!"
 AFG_border_wars.2.t: "[event_target:AFG_ATTACKER.GetName] Loses Border War"
 AFG_border_wars.2.d: "[event_target:AFG_ATTACKER.GetName] has lost the border war against [event_target:AFG_DEFENDER.GetName]."
 AFG_border_wars.2.a: "Huzzah!"
 AFG_border_wars.2.b: "Damn"
 AFG_border_wars.3.t: "Taliban Prepares To Move Into Tribal Areas"
 AFG_border_wars.3.d: "The Taliban have been making plans to move into the tribal areas, primary the North Waziristan and Parachinar region. We've been informed by a Taliban negotiator about their plans, and they are hoping that we let them stay there for a 'temporary period of time'. While the region is quite insignificant in the grand scheme of things, it is still a loss of territory and the incursion of radical terrorists into the nation."
 AFG_border_wars.3.a: "As long as they are useful, they can stay"
 AFG_border_wars.3.b: "Absolutely not"
 AFG_border_wars.4.t: "Pakistan Condemns Plans Of Moving Into Tribal Areas"
 AFG_border_wars.4.d: "The Pakistani government has recently contacted us and expressed their dissatisfaction at the prospect of Taliban forces staying in the regions of North Waziristan and Parachinar. Though not a shocking outcome, it is still a hurdle in our efforts of retaking Afghanistan."
 AFG_border_wars.4.a: "Fine"
 AFG_border_wars.4.b: "To hell with their objections!"
 AFG_border_wars.5.t: "Pakistan Permits Movement Into The Tribal Areas"
 AFG_border_wars.5.d: "The Pakistani government has signaled that they are going to ignore our movement into the regions of North Waziristan and Parachinar. This means that we can continue to expand our operations, and increase our odds in the instance that a major Afghan assault begins."
 AFG_border_wars.5.a: "Good"
 AFG_border_wars.6.t: "The Taliban Ignores Us"
 AFG_border_wars.6.d: "The Taliban has ignored us and our objections to their recent movements into the North Waziristan and Parachinar region. It appears that we have no choice but to use force to teach them that we cannot be trampled over."
 AFG_border_wars.6.a: "They started this"
 AFG_border_wars.7.t: "Afghan Armed Forces Secure Victory"
 AFG_border_wars.7.d: "Following a skirmish with the Taliban, the Afghan Armed Forces secured a victory against Taliban forces. This battle is being paraded as a nation-wide victory by [AFG.GetLeader]."
 AFG_border_wars.7.a: "Allahu-Akbar!"
 AFG_border_wars.7.b: "Inshallah victory will come"
 AFG_border_wars.8.t: "Taliban Forces Secure Victory"
 AFG_border_wars.8.d: "Following a skirmish with the Afghan National Army, Taliban forces secured a victory against Afghan National Army forces. This battle is being paraded as a Taliban-wide victory by [TAL.GetLeader]."
 AFG_border_wars.8.a: "Allahu-Akbar!"
 AFG_border_wars.8.b: "Inshallah victory will come"
 AFG_border_wars.9.t: "Inconclusive Results Following Taliban-Afghan Skirmish"
 AFG_border_wars.9.d: "A frozen frontline was observed by international forces following a skirmish by Taliban and Afghan National Army forces. It's been stated that both sides of slowed their attacks and retreated to their pre-skirmish regions."
 AFG_border_wars.9.a: "Okay"
 AFG_uzbek_bombing_of_the_imu: "Uzbek Bombing Campaign"
 AFG_uzbek_bombing_of_the_imu_desc: "Uzbek aircraft are striking Islamic Movement of Uzbekistan camps across the northern border. The raids blunt Taliban air defence and take the edge off their offensives for as long as Tashkent keeps flying."
