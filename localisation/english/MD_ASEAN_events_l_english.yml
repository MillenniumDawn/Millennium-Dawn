l_english:

 asean.1.t: "An Invitation from ASEAN"
 asean.1.d: "[FROM.GetName], speaking for the chair, has extended a formal invitation for us to join the Association. Membership brings the safety net, the trade access, and the diplomatic weight of a bloc that seats seventy percent of the population of maritime Asia. It also brings consensus, non-interference, and the discipline of ten capitals sharing one voice."
 asean.1.a: "We accept. The Association welcomes us."
 asean.1.b: "We must decline, for now."

 asean.2.t: "The Association Welcomes a New Member"
 asean.2.d: "A ceremony in Jakarta this morning; the Association's flag added a stripe overnight; the new member's minister signed the accession instrument at the Secretariat's chamber. The bloc grows by one. The room grows by no more than the room was ready for."
 asean.2.a: "A change in the arithmetic."

 asean.3.t: "The Invitation Is Declined"
 asean.3.d: "[FROM.GetName]'s foreign ministry has returned our letter with regret. The reasons cited are diplomatic; the reasons unstated are the ones that matter. The chair's office notes the reply and files it. Another time, perhaps."
 asean.3.a: "So be it."

 asean.4.t: "A Bilateral Offer"
 asean.4.d: "[FROM.GetName]'s foreign minister has arrived in the capital without ceremony. The demarche is off the record and the terms are frank: return to the table on the pending file, and specific breaches of ours will be forgotten in the summit record. The window is thirty days."
 asean.4.a: "We take the offer."
 asean.4.b: "We keep our current course."

 asean.20.t: "The Bangkok Treaty Protocol"
 asean.20.d: "The Association's Secretary-General has arrived in the capital with the SEANWFZ protocol in a folder and thirty minutes on the schedule. Ten member states have signed. Every other nuclear-weapon-free zone has your signature. The submarines, apparently, are the objection. Answer for the record."
 asean.20.a: "We sign."
 asean.20.b: "We defer."

 asean_summit.1.t: "The [GetYear] Summit Convenes"
 asean_summit.1.d: "The delegations arrive at the appointed venue. The chair opens with the customary address. The agenda has been circulated for months; the bilaterals in the corridors have been circulated for weeks; the joint communiqué has been circulated in draft for days. Whatever the year's headline act will be, it will happen this week."
 asean_summit.1.a: "The chair takes the floor."

 asean_summit.2.t: "The Summit Closes"
 asean_summit.2.d: "The joint communiqué is read. The chair's press conference takes twenty minutes and answers half the questions. The regional press already has the working translations; the international press files by evening. The Secretariat begins turning the paragraphs into work items."
 asean_summit.2.a: "The record stands."

 asean_summit.10.t: "A Bilateral on the Margins"
 asean_summit.10.d: "[FROM.GetName]'s delegation and ours meet in a side room the schedulers did not book. Coffee is delivered without being ordered. The conversation covers the file that neither of our foreign ministers wanted to raise in plenary. The understanding reached is written on the back of a menu."
 asean_summit.10.a: "An understanding."

 asean_crisis.1.t: "The Shoal Incident"
 asean_crisis.1.d: "Chinese coast guard vessels have shadowed our fishing fleet away from the reef, again. The photographs are already on the wires; the foreign ministry demand-summons the ambassador before the news cycle closes. The next call is whether to raise this in Manila or bilaterally in Beijing."
 asean_crisis.1.a: "We respond bilaterally."
 asean_crisis.1.b: "We take it to ASEAN."
 asean_crisis.1.c: "We let the moment pass."

 asean_crisis.2.t: "The Chair Tables the Language"
 asean_crisis.2.d: "[FROM.GetName]'s foreign ministry has asked for reference to the reef question in the summit communiqué. The chair puts the paragraph on the drafting table. Every delegation reads it. One of them will move to strike it. The Secretariat is already preparing the paragraph without the paragraph, in case."
 asean_crisis.2.a: "We table the language."

 asean_crisis.3.t: "No Joint Communiqué"
 asean_crisis.3.d: "For the first time in the bloc's history, the summit closes without a joint communiqué. [FROM.GetName] refused to allow reference to the South China Sea in the final language. The chair reads a summary statement instead. The regional press notices. The Chinese foreign ministry does not comment."
 asean_crisis.3.a: "A dark day for the ASEAN Way."

 asean_crisis.10.t: "Emergency Summit"
 asean_crisis.10.d: "The bloc is called into unscheduled session. The core has thinned below the floor for a year, or Indonesia is preparing to walk, or two members are shooting at each other across a border. The chair opens with an unusually blunt speech. What the bloc decides in the next four days is what the bloc will still be at the end of the week."
 asean_crisis.10.a: "We save what can be saved."
 asean_crisis.10.b: "Prepare the mainland successor."
 asean_crisis.10.c: "Prepare the maritime successor."

 asean_crisis.11.t: "The Association Dissolves"
 asean_crisis.11.d: "The joint statement, when it comes, is short. The Association's Secretariat will remain open in a caretaker capacity until year-end. Member states are asked to consider their future arrangements. The successor blocs will meet, separately, in Bangkok and Manila within the month."
 asean_crisis.11.a: "An era closes."

 asean_crisis.12.t: "Bangkok's Choice"
 asean_crisis.12.d: "The mainland grouping is meeting in Bangkok next week. The maritime grouping is meeting in Manila the week after. Both delegations have sent formal invitations to the Foreign Ministry, and both invitations were expected. Thailand is the swing state. Whichever room we sit in will decide the map."
 asean_crisis.12.a: "The mainland."
 asean_crisis.12.b: "The maritime."
 asean_crisis.12.c: "Neither. We stand alone."

 asean_crisis.20.t: "The Junta in Naypyidaw"
 asean_crisis.20.d: "The Tatmadaw has arrested the civilian government overnight. The State Administration Council names itself the state. The refugees will cross our borders within weeks; the summit will not be able to look past it; the flexible-engagement debate we thought was academic is now the file on our desk."
 asean_crisis.20.a: "Call for a suspension vote."
 asean_crisis.20.b: "Uphold the ASEAN Way."
 asean_crisis.20.c: "Propose the Five-Point Consensus."

 asean_crisis.21.t: "The Ballot on Suspension"
 asean_crisis.21.d: "The motion to suspend [FROM.GetName] from ASEAN summits is on the floor. The chair calls the roll. The vote will be recorded for the summit's records; the vote will also be leaked before the meeting closes. Our own vote will be read against every future position we take."
 asean_crisis.21.a: "We vote for suspension."
 asean_crisis.21.b: "We vote against."
 asean_crisis.21.c: "We abstain."

 asean_crisis.22.t: "The Junta Is Barred"
 asean_crisis.22.d: "The bloc has suspended [FROM.GetName] from all summits and ministerial meetings until further notice. Its seat at the table will remain empty, its flag will remain in the hall, and its foreign ministry will remain uninvited. The Charter has no provision for expulsion; the summit found one for suspension anyway."
 asean_crisis.22.a: "The seat is empty."

 asean_crisis.30.t: "The Second Crisis"
 asean_crisis.30.d: "The baht is under pressure again. The peso followed within the hour. The rupiah is next. The pattern from 1997 is repeating; the difference this time is that the safety net exists. Whether it works is a question that will be answered in the next thirty days."
 asean_crisis.30.a: "To the Chiang Mai facility."

 asean_crisis.31.t: "The Facility Is Drawn"
 asean_crisis.31.d: "We activate our line against the common pool. The disbursement is faster than the Fund would have been. The surveillance office is already on the plane; the conditions are lighter, and known in advance; the markets calm within a week. The bloc has survived the crisis it built the pool for."
 asean_crisis.31.a: "The safety net held."
