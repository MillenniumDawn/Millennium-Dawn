 POLITICS_GERHARD_SCHRODER_DESC: "게르하르트 슈뢰더의 아버지는 아들을 보지 못한 채 루마니아에서 사망하였습니다. 배우자 없이 그의 어머니는 그를 데리고 서독의 리페로 피신하여 새 정부의 사회 복지 지원을 받으며 그곳에서 살았습니다.\n\n그는 청년기에 법학을 공부하고 변호사로 일했습니다.\n\n그의 정치 경력은 1963년 SPD에 입당하면서 시작되었습니다. 이후 차근차근 올라가 1978년 SPD 청년 조직의 신임 의장이 되었으나 1980년까지만 재임했습니다. 1990년 그는 첫 번째 중대한 승리를 거두어 니더작센 주 총리로 선출되었고 1998년까지 두 차례 더 재선되었습니다. 그해 그는 독일 연방공화국 총리로 선출되어 오늘에 이르기까지 녹색당과의 연립으로 통치하고 있습니다."
 GER_HANS_PETER_KIRCHBACH_DESC: "17세기부터 이어진 오랜 군사 전통을 지닌 가문에서 태어난 폰 키르히바흐는 그 뒤를 따라 육군에 입대할 것으로 기대되었습니다. 1960년 그는 그렇게 하였고, 육군 지도자 학교에 다녔으며 1979년에는 이미 로켓포병대대 42의 지휘관이라는 첫 번째 중요한 보직을 맡았습니다. 그러나 이는 첫 번째 거점일 뿐이었고, 이후 제14기갑척탄병사단 사령관, 이어 제4군단 사령관이 되었으며 마지막으로 국방부에서 근무하였습니다. 대중은 그를 '오데르의 영웅'으로 알고 있는데, 1997년 오데르강이 범람하여 지역이 침수되었을 때 육군의 구조 작전을 조직하고 지휘했기 때문입니다."
 GER_HELMUT_WILLMANN_DESC: "빌만은 1959년 장교가 되기 위해 신병으로 연방방위군에 입대하며 경력을 시작하였습니다. 초기에는 기갑보병으로 복무하며 계급을 올렸고, 상관들이 그를 장군에 적합하다고 판단하는 시점에 이르렀습니다. 국방부와 나토 참모부에서 10년간 보직을 거친 뒤, 그는 마침내 가장 좋아하는 병과로 돌아와 이번에는 여단장이 되었습니다. 그의 가장 큰 업적은 1996년 독일 육군 총수로 승진한 것이었습니다. 부하들은 그의 엄격한 태도 때문에 그에게 '호랑이 빌리'라는 별명을 붙였습니다."
