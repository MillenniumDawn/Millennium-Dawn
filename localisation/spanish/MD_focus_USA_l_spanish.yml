 USA_treason_event.20.t: "Derecha de la República Reformada \"2020\""
 USA_treason_event.20.d: "Felicidades, has vencido al sistema, pero ¿a quién eliges ahora? Tenemos a los libertarios anti-gobierno, a los moderados del Partido Reformista y, por último, a los amantes del papel constitucional."
 USA_treason_event.20.o1: "¡Poco poder, gobierno pequeño!"
 USA_treason_event.20.o2: "República Reformada por una razón"
 USA_treason_event.20.o3: "¡El papel es la ley!"
 USA_treason_event.20.o4: "Miremos hacia la izquierda, ¿por qué no?"
 USA_treason_event.21.t: "Izquierda de la República Reformada \"2020\""
 USA_treason_event.21.d: "Felicidades, has vencido al sistema, pero ¿a quién eliges ahora? Tenemos a los ecologistas del Partido Verde, a los progresistas de la cinta rosa y, finalmente, a los socialistas democráticos que quieren traer la política europea a Estados Unidos."
 USA_treason_event.21.o1: "Amo la naturaleza"
 USA_treason_event.21.o2: "Amo el progreso social"
 USA_treason_event.21.o3: "Amo las ideas europeas"
 USA_treason_event.21.o4: "Me gusta el picante, ¿qué sabores son estos?"
 USA_treason_event.22.t: "Coaliciones de la República Reformada \"2020\""
 USA_treason_event.22.d: "Parece que has vencido al sistema con tanta fuerza que casi lo has roto. ¿Te apetece romperlo un poco más? Tienes al Partido del Frente Nacional y al Partido del Pastor. ¿Con qué coalición vas a reventar la ventana?"
 USA_treason_event.22.o1: "Me encanta el pastel Red Velvet"
 USA_treason_event.22.o2: "Me encanta el chocolate con leche"
 USA_treason_event.22.o3: "Espera, creo que me he perdido, ¿dónde está la entrada?"
