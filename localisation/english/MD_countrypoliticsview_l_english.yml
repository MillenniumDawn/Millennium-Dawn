 # Ideological Powers TODO: rework tooltips
 IP_TITLE: "Ideological Powers"
 IP_communist_category_desc: "§YCommunists§!\nPowers available to:\n[Communist-State_L]\n[Neutral_Communism_L]"
 IP_communist_category_desc_delayed: "§LCommunists usually follow some form of Marxism-Leninism or a similar ideology. As advocates of state run economy, they have an easier time industrialising through nationalising foreign industries and their 5-year-plans. They can also boost their own Outlook more effectively with their spies.§!"
 IP_communist_spread_the_revolution: "§YSpread the Revolution§!\n[IP_communist_spread_the_revolution_tooltip]: §G+25%§!"
 IP_communist_spread_the_revolution_tooltip_key: "$BOOST_IDEOLOGY_MISSION_FACTOR$"
 IP_communist_spread_the_revolution_delayed: "§LWorkers of the World unite! Our proletariat brethren are exploited by the capitalist bourgeoisie. We can't rest until the entire world is liberated from their chains!§!"
 IP_communist_five_year_plans: "§Y5-Year-Plans§!\nCan implement their own §Y5-Year-Plans§! using §YDecisions§!"
 IP_communist_five_year_plans_delayed: "§LThe economy needs to be tightly controlled by the state. This is the only way to maximise the productivity of our workers. By planning all production ahead for five years, we can focus and predict the exact resources we will have after the plan finishes.§!"
 IP_communist_means_of_production: "§YMeans of Production§!\nCan §YNationalise§! the assets of large foreign influencers using §YDecisions§!"
 IP_communist_means_of_production_delayed: "§LThe means of production belong to the people! Foreign powers will use their money and power to gain control parts of our economy. We must fight against these imperialists tooth and nail!§!"
 IP_communist_incompatible_economy: "§YHard Labour§!\n[IP_communist_incompatible_economy_tooltip]: §R+15%§!"
 IP_communist_incompatible_economy_tooltip_key: "$buildings_worker_requirement_modifier$"
 IP_communist_incompatible_economy_delayed: "§LThe [ROOT.GetAdjective] worker is a hard worker, they slave day and night to make our country prosper. However, even though factories are packed full of workers, we can't seem to be able to reach the efficiency levels of the capitalist countries. They must be falsifying their economic data, for if a man works 16 hours instead of 8, he must be producing twice the amount of things.§!"
 IP_socialist_category_desc: "§YSocialists§!\nPowers available to:\n[socialism_L]\n[anarchist_communism_L]\n[Neutral_green_L]\n[neutral_Social_L]"
 IP_socialist_category_delayed: "§LSocialists combine elements of market and state capitalism with progressivism. Quite often the focus is to invest all government efforts into the country itself. Socialists have an easy time improving the internal situation of their country through welfare policies and government intervention in the economy.§!"
 IP_socialist_welfare_state: "§YWelfare State§!\n[IP_socialist_welfare_state_tooltip1]: §G-15.00%§!\n[IP_socialist_welfare_state_tooltip2]: §G-15.00%§!"
 IP_socialist_welfare_state_tooltip1_key: "$health_cost_multiplier_modifier$"
 IP_socialist_welfare_state_tooltip2_key: "$social_cost_multiplier_modifier$"
 IP_socialist_welfare_state_delayed: "§LThe best use for taxes collected from the people is to invest that money back into the people. Only the government has the power to provide accessible and good quality services to the population. When we prioritise peoples' wellbeing in our organisations, we can provide an efficient and cheap welfare.§!"
 IP_socialist_economic_intervention: "§YEconomic Interventionism§!\n[IP_socialist_economic_intervention_tooltip1]: §G-25.00%§!\n[IP_socialist_economic_intervention_tooltip2]: §G-25.00%§!\n\nIf ruled by [Neutral_green_L], this bonus is replaced with:\n[IP_socialist_economic_intervention_tooltip3]: §G+50%§!"
 IP_socialist_economic_intervention_tooltip1_key: "$internal_investments_pp_cost_modifier$"
 IP_socialist_economic_intervention_tooltip2_key: "$internal_investments_money_cost_modifier$"
 IP_socialist_economic_intervention_tooltip3_key: "$modifier_state_production_speed_renewable_energy_infra_factor$"
 IP_socialist_economic_intervention_delayed: "§LSometimes the economy needs a bit of a nudge. We need to use the strong hand of the government to steer our society and economy into the right direction. Letting capitalism run its course on its own would be too dangereous.§!"
 IP_socialist_pacifism: "§YPeaceful Diplomacy§!\n[IP_socialist_pacifism_tooltip]: §G+15%§! per level of §YForeign Intervention Law§! below §YLimited Interventionism§!\n\n[IP_socialist_pacifism_tooltip]: §R-15%§! per level of §YForeign Intervention Law§! above §YLimited Interventionism§!"
 IP_socialist_pacifism_tooltip_key: "$MODIFIER_POLITICAL_POWER_FACTOR$"
 IP_socialist_pacifism_delayed: "§LWe are not like the capitalists who use force only to exploit other countries. And we are not like our communist brothers who forcefully try to spread their ideas. Our focus is on cooperation. We will influence the world with kind words and diplomacy, not with force.§!"
 IP_socialist_naive_worldview: "§YNaive Worldview§!\n[IP_socialist_naive_worldview_tooltip]: §R-15%§!"
 IP_socialist_naive_worldview_tooltip_key: "$foreign_influence_defense_modifier$"
 IP_socialist_naive_worldview_delayed: "§LChoosing a path of diplomacy is something a hard path to go down on. Being naive and believing everyone else is like us can end with us shooting ourselves into our own foot. Certainly a dictator posturing about attacking another country is just empty talk. After all, they only want our respect, right?§!"
 IP_conservative_category_desc: "§YConservatives§!\nPowers available to:\n[conservatism_L]\n[Conservative_L]\n[Mod_Vilayat_e_Faqih_L]\n[Neutral_Muslim_Brotherhood_L]\n[Neutral_conservatism_L]\n[Nat_Populism_L]"
 IP_conservative_category_desc_delayed: "§LConservatives usually want the country to stay as it is, or even roll back some more progressive laws. Conservatism often comes with hints of nationalism and deep religious beliefs as well. For this reason, conservative countries have an easier time with their political and national stability, as radical change is rare.§!"
 IP_conservative_good_old_days: "§YGood Old Days§!\n[IP_conservative_good_old_days_tooltip]: §G+15%§!"
 IP_conservative_good_old_days_tooltip_key: "$foreign_influence_defense_modifier$"
 IP_conservative_good_old_days_delayed: "§LNostalgia is a powerful tool. Everyone knows that how things used to be are better than how they are now. We need to do everything we can to prevent further change and introduction of new ideas from happening and leading the country to ruin.§!"
 IP_conservative_stable_society: "§YStable Society§!\n[IP_conservative_stable_society_tooltip]: §G+15.00%§!"
 IP_conservative_stable_society_tooltip_key: "$MODIFIER_STABILITY_FACTOR$"
 IP_conservative_stable_society_delayed: "§LOur people know that with us in charge, nothing unexpected is going to happen. They have nothing to fear and they can put all their trust into us.§!"
 IP_conservative_patriotism: "§YPatriotism§!\n[IP_conservative_patriotism_tooltip1]: §G+15.00%§!\n\nIf ruled by [Mod_Vilayat_e_Faqih_L] or [Neutral_Muslim_Brotherhood_L], this bonus is replaced with:\n[IP_conservative_patriotism_tooltip2]: §G+15%§!"
 IP_conservative_patriotism_tooltip1_key: "$MODIFIER_WAR_SUPPORT_FACTOR$"
 IP_conservative_patriotism_tooltip2_key: "$MODIFIER_COMPLIANCE_GROWTH$"
 IP_conservative_patriotism_delayed: "§LWe are all of the same stalk. We need to encourage common ideals and values for our people so that they are willing to give their utmost to the state.§!"
 IP_conservative_homefront_first: "§Y[ROOT.GetName] First!§!\n[IP_conservative_homefront_first_tooltip]: §R-15.00%§!"
 IP_conservative_homefront_first_tooltip_key: "$foreign_influence_modifier$"
 IP_conservative_homefront_first_delayed: "§LOur supporters expect us to put our own country first. This makes sending foreign aid and entangling in the politics of another country quite challenging. Unless of course we have to go to war, our supporters love that. If you win, that clearly means you're first.§!"
 IP_liberal_category_desc: "§YLiberals§!\nPowers available to:\n[liberalism_L]\n[Neutral_Libertarian_L]\n[technocrats_scripted_loc]"
 IP_liberal_category_desc_delayed: "§LLiberals tend to promote ideas of freedom, though some parties take more progressive (social liberal) approach to issues. At the core of most liberal parties is the idea of a free market with very limited government intervention.§!"
 IP_liberal_high_risk_investment: "§YHigh Risk Investments§!\n[IP_liberal_high_risk_investment_tooltip]: §G+2.00%§!"
 IP_liberal_high_risk_investment_tooltip_key: "$return_on_investment_modifier$"
 IP_liberal_high_risk_investment_delayed: "§LMany governments take a reserved approach as to what they invest their money in, talking about things like 'sustainability' and 'ethicality'. We will invest our money into whatever brings the greatest profit. After all, that's the whole point of investing.§!"
 IP_liberal_invisible_hand: "§YThe Invisible Hand§!\n[IP_liberal_invisible_hand_tooltip1]: §G-15%§!\n[IP_liberal_invisible_hand_tooltip2]: §G-15%§!\n[IP_liberal_invisible_hand_tooltip3]: §G0.75§!"
 IP_liberal_invisible_hand_tooltip1_key: "$economic_cycles_cost_factor$"
 IP_liberal_invisible_hand_tooltip2_key: "$econ_cycle_upg_cost_multiplier_modifier$"
 IP_liberal_invisible_hand_tooltip3_key: "$productivity_growth_modifier$"
 IP_liberal_invisible_hand_delayed: "§LThe great invisible hand is what controls the economy. With very limited changes in monetary policy and government investment into the economy, we can easily make the economy turn good without socialist tricks.§!"
 IP_liberal_business_friendly_environment: "§YBusiness Friendly§!\n[IP_liberal_business_friendly_environment_tooltip]: §G+10.00%§!"
 IP_liberal_business_friendly_environment_tooltip_key: "$corporate_tax_income_multiplier_modifier$"
 IP_liberal_business_friendly_environment_delayed: "§LWe are a friend of the corporations and they know it. Business oriented lawmaking will attract a lot of business for our country.§!"
 IP_liberal_anti_military: "§YAnti-Military§!\n[IP_liberal_anti_military_tooltip1]: §R-15.00%§!\n[IP_liberal_anti_military_tooltip2]: §R-15.00%§!"
 IP_liberal_anti_military_tooltip1_key: "$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$"
 IP_liberal_anti_military_tooltip2_key: "$MODIFIER_INDUSTRIAL_CAPACITY_DOCKYARD_FACTOR$"
 IP_liberal_anti_military_delayed: "§LWar is bad for business and so it should be avoided at all cost. It is better to focus on the civilian sector and wealth generation. Why topple a dictator with a horrible human rights record when you can make money with them by abusing those human rights!§!"
 IP_autocrat_category_desc: "§YAutocrats§!\nPowers available to:\n[Western_Autocracy_scripted_loc]\n[Autocracy_L]\n[Neutral_Autocracy_L]\n[oligarchism_L]\n[Nat_Fascism_L]\n[Nat_Autocracy_L]"
 IP_autocrat_category_desc_delayed: "§LAutocrats rely on the power of strongmen (and in rare cases strongwomen) to to run the country. The demagogues are not afraid to use questionable methods and backroom deals to get what they want. Autocrats will have an easier time tolerating high corruption and holding control of the nation with an iron fist.§!"
 IP_autocrat_scratch_my_back: "§YCronyism§!\n[IP_autocrat_scratch_my_back_tooltip]: §G+0.3§! per §YCorruption Level§! above §YNegligible Corruption§!"
 IP_autocrat_scratch_my_back_tooltip_key: "$MODIFIER_POLITICAL_POWER_GAIN$"
 IP_autocrat_scratch_my_back_delayed: "§LPutting close friends and relatives into important positions in the government will guarantee easier deal making. Some call this corruption, we call it ensuring loyalty.§!"
 IP_autocrat_good_connections: "§YGood Connections§!\nIncreasing the §YOpinion§! of §YInternal Factions§! is more effective\n\nIf ruled by [oligarchism_L], this bonus is replaced with:\n[IP_autocrat_good_connections_tooltip]: §G+10.00%§!"
 IP_autocrat_good_connections_tooltip_key: "$resource_export_multiplier_modifier$"
 IP_autocrat_good_connections_delayed: "§LOur rule is cemented in place by strong supporters. The clandestine groups are perfectly happy knowing that the government has their back.§!"
 IP_autocrat_emergency_powers: "§YPower Through Strength§!\n[IP_autocrat_emergency_powers_tooltip]: §G+25%§!\n\nIf ruled by [Nat_Fascism_L], this bonus is replaced with:\nCan form §YParamilitary Units§! through §YDecisions§!"
 IP_autocrat_emergency_powers_tooltip_key: "$MODIFIER_STABILITY_POPULARITY_FACTOR$"
 IP_autocrat_emergency_powers_delayed: "§LA strong country must be ruled by a strong leader. We must show our people all the things we can achieve, and they will never rise against us.§!"
 IP_autocrat_yes_men_army: "§YArmy of Yes-Men§!\n[IP_autocrat_yes_men_army_tooltip1]: §R-15.0%§!\n[IP_autocrat_yes_men_army_tooltip2]: §R-15.0%§!\n[IP_autocrat_yes_men_army_tooltip3]: §R-15.0%§!"
 IP_autocrat_yes_men_army_tooltip1_key: "$MODIFIER_XP_GAIN_ARMY_FACTOR$"
 IP_autocrat_yes_men_army_tooltip2_key: "$MODIFIER_XP_GAIN_NAVY_FACTOR$"
 IP_autocrat_yes_men_army_tooltip3_key: "$MODIFIER_XP_GAIN_AIR_FACTOR$"
 IP_autocrat_yes_men_army_delayed: "§LWhile having a loyal officer cadre is the core of holding power, being surrounded by yes-men and bootlickers can lead to us completely being misinformed on the quality of our military. Turns out that people who are afraid of losing their job or worse lie to save their own skin.§!"
 IP_monarchist_category_desc: "§YMonarchists§!\nPowers available to:\n[Kingdom_L]\n[Monarchist_L]"
 IP_monarchist_category_desc_delayed: "§LMonarchists rely on lineage and glory to rule over countries. Focusing power into one family has its benefits. This family brings power and monarchs are good at inspiring their people.§!"
 IP_monarchist_keep_it_in_the_family: "§YRoyal Decree§!\n£economy_laws_cost_texticon  Laws Cost: §G-15%§!"
 IP_monarchist_keep_it_in_the_family_delayed: "§LThe monarch is not bound by a political progress. When the country needs to switch its direction, it can be done so at the whim of the ruler.§!"
 IP_monarchist_for_king_and_queen: "§YFor King and Queen§!\n[IP_monarchist_for_king_and_queen_tooltip1]: §G+10.0%§!\n[IP_monarchist_for_king_and_queen_tooltip2]: §G+10.0%§!"
 IP_monarchist_for_king_and_queen_tooltip1_key: "$MODIFIERS_ARMY_CORE_ATTACK_FACTOR$"
 IP_monarchist_for_king_and_queen_tooltip2_key: "$MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$"
 IP_monarchist_for_king_and_queen_delayed: "§L[IP_monarch_name] inspires our people and soldiers to fight on even when the situation is desperate. Those who are worthy will be rewarded, either on Earth or in Heaven.§!"
 IP_monarchist_crown_estate: "§YCrown Estate§!\n[IP_monarchist_crown_estate_tooltip]: §G+10.00%§!"
 IP_monarchist_crown_estate_tooltip_key: "$population_tax_income_multiplier_modifier$"
 IP_monarchist_crown_estate_delayed: "§LThe Royal Family holds much land in [ROOT.GetName]. The utilization of that land brings massive monetary gains to the state, and perhaps, in the pockets of [IP_monarch_name].§!"
 IP_monarchist_outdated_ideals: "§YOutdated Ideals§!\n[IP_monarchist_outdated_ideals_tooltip]: §R-15.00%§!"
 IP_monarchist_outdated_ideals_tooltip_key: "$MODIFIER_STABILITY_FACTOR$"
 IP_monarchist_outdated_ideals_delayed: "§LMonarchy isn't exactly the latest fashion on government. People these days yearn for other options than absolute monarchy. You would have to be Danish or something to think that monarchies are still cool.§!"
 IP_fundamentalist_symbol_desc: "§YFundamentalists§!\nPowers available to:\n[Vilayat_e_Faqih_L]\n[Caliphate_L]"
 IP_fundamentalist_symbol_desc_delayed: "§LFundamentalists are hardline conservatives following a radical of ultraconservative form of Islam. Their main goal is to spread those conservative views to other countries as well.§!"
 IP_fundamentalist_religious_law: "§YSharia Law§!\n£salafist_outlook_campaign_cost_modifier_texticon Daily Outlook Support: §G+0.10§!"
 IP_fundamentalist_religious_law_delayed: "§LOur justice and legal system is heavily influenced by the idea of Sharia, or Islamic law. By using the Quran as a basis for our institutions we can rid the populace of decadent ideas.§!"
 IP_fundamentalist_recruitment_campaign: "§YForeign Fighters§!\n[IP_fundamentalist_recruitment_campaign_tooltip]: §G+300§!"
 IP_fundamentalist_recruitment_campaign_tooltip_key: "$MODIFIER_WEEKLY_MANPOWER$"
 IP_fundamentalist_recruitment_campaign_delayed: "§LThe world is full of disenfranchised young Muslims. We should entice to come to us and join our military. They are hardworking, loyal and they can easily be manipulated to believe in our cause.§!"
 IP_fundamentalist_national_liberation_movements: "§YNationalist Liberation Movements§!\n[IP_fundamentalist_national_liberation_movements_tooltip1]: §G-10.0%§!\n[IP_fundamentalist_national_liberation_movements_tooltip2]: §G-10.0%§!\n[IP_fundamentalist_national_liberation_movements_tooltip3]: §G+2§!"
 IP_fundamentalist_national_liberation_movements_tooltip1_key: "$MODIFIER_SEND_VOLUNTEERS_TENSION_LIMIT$"
 IP_fundamentalist_national_liberation_movements_tooltip2_key: "$MODIFIER_LEND_LEASE_TENSION_LIMIT$"
 IP_fundamentalist_national_liberation_movements_tooltip3_key: "$MODIFIER_SEND_VOLUNTEER_SIZE$"
 IP_fundamentalist_national_liberation_movements_delayed: "§LThere are several groups fighting against Zionist oppressors. As devout Muslims, it is our duty to help these groups against their oppressors!§!"
 IP_fundamentalist_international_pariah: "§YInternational Pariah§!\n[IP_fundamentalist_international_pariah_tooltip]: §Y-50%§!"
 IP_fundamentalist_international_pariah_tooltip_key: "$MODIFIER_MIN_EXPORT_FACTOR$"
 IP_fundamentalist_international_pariah_delayed: "§LBeing extreme can be challenging as it is very difficult to find countries willing to do trade with us. Maybe people just understand the phrase \"theocracies are radical\" differently than we do?§!"

 IP_monarch_name_monarch: "The Monarch"
 IP_monarch_name_current_leader: "[ROOT.GetLeader]"

 # Political Parties
 POLITICAL_PARTIES_TITLE: "Parties"
 POLITICAL_PARTIES_SORT_OUTLOOK: "Outlook"
 POLITICAL_PARTIES_SORT_POPULARITY: "Popularity"
 POLITICAL_PARTIES_SORT_BANNED: "Banned"

 boost_party_TT: "§HBoost [party_name_by_index] ([party_support_by_index])§!\nIn a bid to dilute the power of our real political opponents, we can use our political machine to boost the popularities of other parties\n\n§YPrerequisite:§!\n[!boost_button_click_enabled]\n\n§YEffects:§!\n[!boost_button_click]"
 attack_party_TT: "§HAttack [party_name_by_index] ([party_support_by_index])§!\nWe can use disinformation campaigns and dirt we have collected on major parties outside the government to strike hard at their popularity - ensuring they aren't in a position to challenge our position of power. Since any attention at all will bring popularity to minor parties, this will only work with major parties over the election threshold of [?election_threshold|%0]\n\n§YPrerequisite:§!\n[!attack_button_click_enabled]\n\n§YEffects:§!\n[!attack_button_click]"
 ban_party_TT: "§HBan [party_name_by_index] ([party_support_by_index])§!\nBy outlawing a political party or movement makes sure they can never win power through elections, and persecuting their members easier.\n\n§YPrerequisite:§!\n[!ban_button_click_enabled]\n\n§YEffects:§!\n[!ban_button_click]"
 allow_party_TT: "§HLegalize [party_name_by_index] ([party_support_by_index])§!\nThe time has come for us to lift our ban and let their members run for public offices and organize legally.\n\n§YPrerequisite:§!\n[!allow_button_click_enabled]\n\n§YEffects:§!\n[!allow_button_click]"
 
 # Triggers
 party_greater_than_election_threshold_by_index_tt: "[party_name_by_index] popularity ([party_support_by_index]) more than the $election_threshold$ ([?election_threshold|%0])"
 party_is_in_power_or_coalition_TT: "§Y[party_name_by_index]§! is in ruling coalition."
 party_is_in_power_or_coalition_TT_NOT: "§Y[party_name_by_index]§! is not in ruling coalition."

