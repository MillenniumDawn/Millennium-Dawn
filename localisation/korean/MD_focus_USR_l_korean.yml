 union_state.1.t: "우리와의 연합 국가 창설에 동의한 그들"
 union_state.1.d: "마침내 연합 국가는 서류상으로만이 아니라 현실이 될 것입니다. 우리 앞에는 밝은 미래가 놓여 있습니다."
 union_state.1.a: "드디어"
 union_state.3.t: "연합 국가 문제를 둘러싼 러시아의 최후통첩"
 union_state.3.d: "러시아 정부가 연합 국가 문제에 관해 강경한 최후통첩을 보내오고 있습니다. 서명하지 않으면 부정적인 결과가 따를 것입니다. 이러한 도발에 굴복해야 하겠습니까?"
 union_state.3.a: "연합 국가로의 통합에 서명하겠다"
 union_state.3.b: "아니요"
 union_state.4.t: "연합 국가"
 union_state.4.d: "벨라루스 정부가 연합 국가 창설 조약에 즉시 전면 서명하기로 동의했습니다."
 union_state.4.a: "좋다"
 union_state.5.t: "연합 국가"
 union_state.5.d: "벨라루스 정부가 연합 국가 창설 조약에 즉시 전면 서명하는 것을 거부했습니다."
 union_state.5.a: "유감이다"
 union_state.6.t: "연합 국가 문제를 둘러싼 러시아의 최후통첩"
 union_state.6.d: "러시아 정부가 연합 국가 문제에 관해 강경한 최후통첩을 보내오고 있습니다. 서명하지 않으면 부정적인 결과가 따를 것입니다. 이러한 도발에 굴복해야 하겠습니까?"
 union_state.6.a: "연합 국가로의 통합에 서명하겠다"
 union_state.6.b: "아니요"
 union_state.7.t: "연합 국가"
 union_state.7.d: "연합 국가가 다시 귀하를 찾아와 창설 협정의 비준에 우리와 함께 서명할 준비가 되어 있습니다. 우리가 이처럼 위험한 정치적 조치를 취할 준비가 되었는지만 결정하면 됩니다."
 union_state.7.a: "그렇다, 연합 국가를 창설하겠다"
 union_state.7.b: "아니요"
 union_state.8.t: "[FROM.GetNameWithFlag]의 연합 국가 창설 거부"
 union_state.8.d: "우리는 다시 거절당했습니다. 아마도 그들의 정부가 아직 성숙하지 못한 것이겠지만, 우리는 다시 시도할 것입니다."
 union_state.8.a: "유감이다"
 union_state.9.t: "[FROM.GetNameWithFlag]과(와)의 연합 국가"
 union_state.9.d: "[FROM.GetNameWithFlag]이(가) 연합 국가 가입 준비를 시작했습니다. 이미 한 번 신청한 적이 있으나 그것은 그들에게는 비극적인 사건이 벌어지던 때이고 우리에게는 끔찍한 상황이었으므로, 우리에게는 뜻밖의 소식입니다. 어쩌면 이번에는 다를지도 모릅니다."
 union_state.9.a: "좋다"
 union_state.10.t: "연합 국가"
 union_state.10.d: "연합 국가가 다시 귀하를 찾아와 창설 협정의 비준에 우리와 함께 서명할 준비가 되어 있습니다. 우리가 이처럼 위험한 정치적 조치를 취할 준비가 되었는지만 결정하면 됩니다."
 union_state.10.a: "그렇다, 연합 국가를 창설한다"
 union_state.10.b: "아니요"
 union_state.11.t: "연합 국가 통합을 원하는 [UKR.GetNameWithFlag]"
 union_state.11.d: "[UKR.GetNameWithFlag]이(가) 연합 국가로의 통합을 위한 모든 절차를 완료했다고 밝혔으며, 이제 우리는 그들과 이 국가를 창설할 준비가 되었는지를 결정하게 됩니다."
 union_state.11.a: "그렇다"
 union_state.11.b: "아니요"
 union_state.12.t: "연합 국가"
 union_state.12.d: "러시아가 우리와의 연합 국가 창설을 거부했으며, 이는 우리에게 뜻밖이었습니다."
 union_state.12.a: "유감이다"
 union_state_news.1.t: "러시아와 벨라루스의 연합 국가 창설"
 union_state_news.1.d: "연합 국가 프로젝트는 90년대 말부터 존재해 왔으며, 러시아와 벨라루스 간의 초국가적 실체를 창설하는 것을 골자로 합니다. 지난 수년간 양국은 이 연합 창설을 향해 서로 다른 속도로 나아갔으며, 마침내 새로운 국제 관계의 주체인 러시아-벨라루스 연합 국가의 창설을 발표할 준비를 마쳤습니다."
 union_state_news.1.a: "흥미롭군"
 union_state_news.2.t: "러시아와 세르비아의 연합 국가 창설"
 union_state_news.2.d: "연합 국가 프로젝트는 90년대 말부터 존재해 왔으며, 러시아와 벨라루스 간의 초국가적 실체를 창설하는 것을 골자로 합니다. 90년대에 세르비아는 연합 국가 가입을 신청했으나 러시아 국가두마가 이 제안을 거부했습니다. 이제 세르비아 정부는 이 프로젝트를 실현하여 러시아-세르비아 연합 국가를 창설하는 데 성공했습니다."
 union_state_news.2.a: "흥미롭군"
 union_state_news.3.t: "러시아와 우크라이나의 연합 국가 창설"
 union_state_news.3.d: "연합 국가 프로젝트는 90년대 말부터 존재해 왔으며, 러시아와 벨라루스 간의 초국가적 실체를 창설하는 것을 골자로 합니다. 우크라이나는 처음에는 이 실체의 일원이 되기를 열망한 적이 없으나, 많은 이들이 연합 국가 가입을 예견했고 어쩌면 헛된 일이 아니었을지도 모릅니다. 이제 세계 정치 지도에는 러시아-우크라이나 연합 국가가 존재합니다."
 union_state_news.3.a: "흥미롭군"
 union_state.13.t: "연합 국가"
 union_state.13.d: "연합 국가가 다시 귀하를 찾아와 창설 협정의 비준에 우리와 함께 서명할 준비가 되어 있습니다. 우리가 이처럼 위험한 정치적 조치를 취할 준비가 되었는지만 결정하면 됩니다."
