 CHI_local_debt_category: "Local Government Debt"
 CHI_local_debt_category_desc: "Provincial financing vehicles borrow against future land sales to fund the factories, office parks and infrastructure that cadre evaluations reward. The bill never reaches Beijing's books, until it does.\n\n§YDebt Pressure§!: [?CHI_local_debt_pressure|0] / 100\n§YFiscal Tolerance§!: §Y$industrial_complex$§! and §Y$offices$§! supported: [?CHI_local_debt_tolerance|0]\n§YCurrent§!: [?industrial_complex_total|0] §Y$industrial_complex$§! and [?office_park_total|0] §Y$offices$§!. Total: [?CHI_local_debt_buildings|0]\n\n§YHow it moves§!\nEvery month Fiscal Tolerance rises by §G+0.25§!. If the building total exceeds it, Debt Pressure rises by §R+1§! per building over the line. If it does not, Pressure falls by §G-0.5§!.\n\n§GThresholds§!\nPressure sets the tier of §Y$CHI_local_government_debt$§!.\n§G20§!: interest and consumer goods penalties.\n§G45§!: adds return on investment and stability penalties.\n§G70§!: adds construction speed and factory productivity penalties.\n§G90§!: all penalties peak and political power suffers.\nDrop below a threshold and the tier eases again.\n\n§GLowering it§!\nIndustrial focuses raise Debt Pressure. Fiscal reform focuses such as §Y$CHI_property_tax_pilot_program$§! and §Y$CHI_cadre_evaluation_reform$§! raise Fiscal Tolerance or cut Pressure outright. §Y$CHI_provincial_debt_swap$§! below cuts Pressure by §G15§! once a year for §R2%§! of GDP.\n\n§GEnding it§!\nOnce Debt Pressure falls below §Y1§! the §Y$CHI_local_debt_resolution_mission$§! mission starts. Hold it there for §Y5 years§! and the local debt system is retired permanently. If Pressure climbs back to 1 or more the mission is cancelled and restarts when Pressure drops again."
 CHI_provincial_debt_swap: "Provincial Debt Swap"
 CHI_provincial_debt_swap_desc: "The central government allows provinces to refinance their financing-vehicle loans into longer-dated bonds, absorbing part of the burden into the national budget. The swap relieves the immediate debt pressure but does nothing to change the growth model that produced it."
 CHI_local_debt_resolution_mission: "Hard Budget Constraints"
 CHI_local_debt_resolution_mission_desc: "With local debt pressure at zero, Beijing can dismantle the financing-vehicle model instead of managing it. Provinces borrow only through the official bond quota, land revenue is no longer pledged against bank loans, and cadre evaluations stop rewarding construction for its own sake. If Debt Pressure stays below 1 for five years the local debt system is retired for good. If it rises again, the mission is cancelled and will restart once pressure falls back below 1."
 CHI_local_debt_resolved_tt: "The §YLocal Government Debt§! system is §Gretired permanently§!. Debt Pressure and Fiscal Tolerance no longer change and the decision category is removed."
 CHI_semiconductor_backwardness_2: "$CHI_semiconductor_backwardness_1$"
 CHI_semiconductor_backwardness_2_desc: "China's semiconductor industry remains structurally dependent on foreign foundries, design software, and manufacturing equipment. Domestic fabs operate two to three generations behind the frontier, design houses lack mature EDA toolchains, and no domestic equipment firm can supply advanced lithography. The gap throttles domestic chip-plant construction and foundry output, and constrains both civilian electronics and the military electronics supply chain.\n§W--------------§!\nThis national spirit will §GImprove§! if we complete the §Y$CHI_domestic_eda$§! focus."
