 ukraine_equipment_develop_domestic_atgm.1.b: "Запустить полномасштабное производство"
 ukraine_equipment_develop_domestic_atgm.1.c: "Подготовиться к полномасштабному производству"
 UKR_Develop_Domestic_ATGM_Stuhna_P_kyiv_expansion_tt: "Через §Y240–300 дней§! §YКиев§! получит §G1 военный завод§!, а мы — проект §YРК-2 «Стугна-П»§! с собственной производственной линией."
 ukraine_equipment_develop_domestic_atgm.2.name: "ПТРК РК-2 «Стугна-П»: готов к производству"
 ukraine_equipment_develop_domestic_atgm.2.desc: "Мы завершили расширение завода КБ «Луч» и переоснащение его оборудования, так что можно начинать полномасштабное производство ПТУР РК-2 «Стугна-П»."
 ukraine_equipment_develop_domestic_atgm.2.a: "Отлично! Запускайте производство"
 UKR_equipment_develop_domestic_corsar_atgm: "Разработать ПТРК §YРК-3 «Корсар»§!"
 UKR_equipment_develop_domestic_corsar_atgm_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_rk3_corsar_for_tooltip\n\n\n\n\n\n\n\n\n§W§YРК-3 «Корсар»§! — §Y[ROOT.GetFlag]украинский§! лёгкий переносной противотанковый ракетный комплекс, разработанный §LКБ «Луч»§!.\n§Y«Корсар»§!, вероятно, заменит противотанковые комплексы советской эпохи, такие как §Y9К113 «Конкурс»§! и §Y9К111 «Фагот»§!.\nОн предназначен для поражения неподвижных и движущихся бронированных целей, а также может применяться против огневых точек, легкобронированных объектов и вертолётов.\nСтрельба ведётся как со станка, так и с бруствера окопа. Наведение — по лазерному лучу.\n------------------\nЭто решение — §Rобязательное условие§! для открытия следующего §Y1§! решения этой категории техники. Если §Rпропустить§! его, вы §Rпотеряете§! возможность выполнить последующее.§!"
 UKR_equipment_develop_domestic_corsar_atgm_flag: "Выполнено решение §YРазработать ПТРК РК-3 «Корсар»§!"
 ukraine_equipment_develop_domestic_atgm.3.name: "ПТРК РК-3 «Корсар»: разработка завершена"
 ukraine_equipment_develop_domestic_atgm.3.desc: "Замечательные специалисты КБ «Луч» завершили разработку ПТРК РК-3 «Корсар», и теперь мы можем выбрать следующий шаг по принятию этой новой системы на вооружение [ROOT.GetFlag] Вооружённых сил страны [ROOT.GetName]."
