 UNITS_VIEW_BTN_DRAW_OFFENCE: "§HOffensive line§!\n§GRight-click and hold the mouse button§! on the map to draw §YOffensive Line§!.\nLines can be painted only on territory you have assigned a §HFront Line§! or §HNaval Invasion§! to.\n\nBrigades assigned to a plan with an Offensive Line will try to take territory to move their front line there. \n\n§GHold mouse button§! and §Grelease§! it on an execute behavior button to change plan's execution type"
 UNITS_VIEW_BTN_DRAW_DEFENCE: "§HFront Line§!\n - §GClick§! on one of the borders against another country to set the assigned front along entire border.\n - §GRight-click and drag the mouse§! on one of the borders against another country to set the front in a shorter interval.\n - §GRight-click and drag the mouse§! on the existing frontline endings to edit them.\n\nFront lines are the start point of attacks into enemy territory towards Offensive Lines, but also allows you to quickly position Brigades along a foreign border."
 UNITS_VIEW_BTN_DRAW_DEFENCE_ARMY_GROUP: "§HFront Line§!\n - §GClick§! on one of the borders against another country to set the assigned front along entire border.\n - §GShift + Click§! on one of the borders against another country to set the assigned front without sub-army fronts along entire border.\n - §GRight-click and drag the mouse§! on one of the borders against another country to set the front in a shorter interval.\n - §GShift + Right-click and drag the mouse§! on one of the borders against another country to set the front without sub-army fronts in a shorter interval.\n - §GRight-click and drag the mouse§! on the existing frontline endings to edit them.\n\nFront lines are the start point of attacks into enemy territory towards Offensive Lines, but also allows you to quickly position Brigades along a foreign border."
 UNITS_VIEW_BTN_DRAW_FALLBACK: "§HFallback line§!\n - §GRight-click and drag the mouse§! on the friendly territory to draw the §YSingle use§! defensive order.\n\nFallback lines are useful for positioning Brigades for defence, for example, behind a river, or somewhere else in friendly territory."
 UNITS_VIEW_BTN_AREA_DEFENSE: "§HArea Defense§!\n - §GClick§! on states to add/remove them from the army's order.\nAn Army with this order cannot have other types at the same time.\n\nBrigades assigned to an Army with this order will spread out over the assigned area to guard important cities, ports or other objects as well as handle minor enemy presence."
