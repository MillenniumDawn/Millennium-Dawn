 seasonal_workers_pap: "Programme des travailleurs de Papouasie-Nouvelle-Guinée"
 seasonal_workers_ton: "Programme des travailleurs des Tonga"
 seasonal_workers_kir: "Programme des travailleurs de Kiribati"
 dissolution_election_ongoing_ast_tt: "§YLes voix seront dépouillées…§!"
 election_season_ast: "Saison électorale"
 election_season_ast_desc: "C'est cette période de l'année où les Australiens de partout se rassemblent dans leurs écoles ou salles communautaires locales pour savourer une saucisse et voter pour le prochain dirigeant du pays."
 organise_rallies_ast: "Organiser des rassemblements"
