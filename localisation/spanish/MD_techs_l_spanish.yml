 module_esm_4: "ESM IV"
 module_esm_4_desc: "Las medidas de apoyo electrónico hiperavanzadas integran procesamiento de datos a alta velocidad y fusión de sensores en red, lo que permite una identificación precisa de amenazas, una alerta temprana optimizada y una mejor coordinación con los sistemas de combate y guerra electrónica.\n\n§GConsejo de diseño: Las ESM aumentan los puntos de vida y reducen la visibilidad de superficie, mejorando la supervivencia contra la detección y el ataque. Son útiles en combatientes valiosos, pero elevan el coste de producción y requieren microchips.§!"
 module_esm_5: "ESM V"
 module_esm_5_desc: "Las medidas de apoyo electrónico ultraavanzadas integran procesamiento de datos a alta velocidad y fusión de sensores en red, lo que permite una identificación precisa de amenazas, una alerta temprana optimizada y una mejor coordinación con los sistemas de combate y guerra electrónica.\n\n§GConsejo de diseño: Las ESM aumentan los puntos de vida y reducen la visibilidad de superficie, mejorando la supervivencia contra la detección y el ataque. Son útiles en combatientes valiosos, pero elevan el coste de producción y requieren microchips.§!"
 module_sub_esm_4: "ESM IV"
 module_sub_esm_4_desc: "Hyper advanced Electronic Support Measures integrate high-speed data processing and networked sensor fusion, allowing precise threat identification, improved early warning, and enhanced coordination with electronic warfare and combat systems.\n\n§GDesigner Hint: Submarine ESM increases Health Power and reduces Sub Visibility, improving survivability and stealth. It is useful for boats operating near enemy sensors, but raises production cost and requires Microchips.§!"
 module_sub_esm_5: "ESM V"
 module_sub_esm_5_desc: "Ultra advanced Electronic Support Measures integrate high-speed data processing and networked sensor fusion, allowing precise threat identification, improved early warning, and enhanced coordination with electronic warfare and combat systems.\n\n§GDesigner Hint: Submarine ESM increases Health Power and reduces Sub Visibility, improving survivability and stealth. It is useful for boats operating near enemy sensors, but raises production cost and requires Microchips.§!"
