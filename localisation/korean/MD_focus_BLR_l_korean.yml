 uniate_church: "합동 동방 가톨릭 교회"
 uniate_church_desc: "동방귀일교회는 로마의 수위권을 인정하면서도 동방 정교회의 전례를 유지하는, 정교회와 가톨릭 전통의 연합체입니다. 1439년 피렌체 공의회에서 초기의 연합이 체결되었으나 곧 해소되었습니다. 15세기 말부터 폴란드 봉건 영주들이 이 구상을 되살렸는데, 폴란드와 리투아니아 인구의 상당수가 여전히 정교도였기 때문이며, 교회 연합은 우크라이나인과 벨라루스인을 점진적으로 가톨릭으로 끌어들이는 수단이 되었습니다. 16세기에 일부 정교회 성직자와 귀족은 가톨릭교도와 동등한 권리를 얻고자 연합을 지지했습니다. 1595년 블라디미르 볼린의 히파티우스 포테이 주교와 루츠크의 키릴 테를레츠키 주교가 교황에게 연합을 청원했습니다. 1596년 브레스트 공의회에서 주교 여섯 명이 성직자와 민중 대다수의 반발에도 불구하고 브레스트 연합을 선포했습니다. 국왕은 연합을 승인하고 정교회를 불법으로 선언했으며, 그 재산을 동방귀일교회에 이전했습니다. 17세기에는 연합을 추진하기 위해 예수회와 함께 바실리오 수도회가 설립되었습니다. 시간이 흐르면서 동방귀일교회는 점차 가톨릭 의식에 가까워졌고, 제의와 성전 양식, 전례 관행이 모두 변했으며 정교회 축일은 폐지되었습니다. 이러한 변화는 1720년 자모시치 교회회의에서 성문화되었습니다. 자카르파타 지방에서는 1649년 우주호로드 대성당에서 연합이 선포되었고 18세기 말에 완전히 정착되었습니다. 16~17세기 우크라이나와 벨라루스에서 종교적, 민족적 자유를 내세워 연합에 맞선 저항은 주로 정교회 형제단이 이끌었습니다."
 BLR_church_reforms: "Church Reform"
 BLR_church_reforms_desc: "우리 국가는 모스크바가 후원하는 정교회를 버려야 합니다. 우리 땅에서 동방귀일교회를 부활시킬 때가 되었습니다."
 BLR_separate_rel: "국가와 분리된 종교"
 BLR_state_rel: "국가와 종교의 통합"
 BLR_church_separate: "종교의 분리"
 BLR_church_separate_desc: "종교는 국가 업무에 간섭해서는 안 되며, 오직 우리 사회의 버팀목으로서만 기능해야 합니다."
 BLR_church_state: "국교"
 BLR_church_state_desc: "종교는 국가 업무를 적극적으로 이끌어야 하며, 그렇지 않으면 우리는 정신적 쇠락을 피할 수 없습니다."
 BLR_riot_finance: "폭동 경찰 지원"
 BLR_riot_finance_desc: "우리의 진압 경찰 부대에는 가능한 최상의 장비를 갖춰 주어야 합니다. 이 부분에서 자금을 아껴서는 안 됩니다."
 BLR_Increase_funding_Police: "Increase Police Funding"
 BLR_Increase_funding_Police_desc: "최근의 사건들은 내무부와 그 산하 여러 부서의 예산을 늘릴 필요가 있음을 보여 주었습니다."
 BLR_new_equipment_omon: "특수 부대 - 알파"
 BLR_new_equipment_omon_desc: "벨라루스 공화국 국가보안위원회 산하 \\"A\\" 그룹(\\"알파\\")은 벨라루스 KGB의 대테러 부대이자 이 나라 법 집행 기관 중 가장 비밀스러운 특수부대 중 하나입니다. 알파 대원들은 KGB 부대가 수행하는 작전 및 전투 활동에 투입되며, 간첩 행위, 인질극, 마약 밀매, 밀수, 무기 및 방사성 물질의 불법 거래, 갈취, 불법 이민과 관련된 용의자 검거를 담당합니다."
 BLR_Increase_funding_Almaz: "특수 부대 - 알마즈"
 BLR_Increase_funding_Almaz_desc: "The Almaz Special Unit for Combating Terrorism is an anti-terrorist special unit of the Ministry of Internal Affairs of Belarus that performs a wide range of tasks to prevent and respond to terrorist acts. It reports directly to the Minister of Internal Affairs of the Republic of Belarus. According to media reports, the unit also takes part in the suppression of political opposition and is involved in the dispersal of mass protests."
 BLR_military_police_training: "헌병 훈련"
 BLR_military_police_training_desc: "우리나라에서 벌어질 수 있는 시위와 대규모 소요에 대비해야 합니다. 그러한 소요는 해외에서 선동될 수 있기 때문입니다. 우리 경찰관들은 이러한 소요를 진압할 수 있도록 훈련이 잘 되어 있어야 합니다."
 BLR_peoples_security: "항시 통제"
 BLR_peoples_security_desc: "국민의 안전을 위해, 물론, 21세기의 기술적 성과를 활용하여 주민 감시를 개선해야 합니다."
 BLR_procurement_of_espionage_equipment: "스파이 장비 조달"
 BLR_procurement_of_espionage_equipment_desc: "값비싼 카메라에 지출하는 대신, 용맹한 법 집행 요원들에게 적절한 장비를 갖춰 주어 우리 마음에 들지 않는 자는 누구든 신속하게 추적할 수 있도록 하는 편이 낫습니다."
 BLR_occupation_management_strategies: "Intimidate and Dominate"
 BLR_occupation_management_strategies_desc: "합법 정부를 감히 전복하기 전에 모두가 세 번은 생각할 것입니다. 우리 특수 기관의 손에 떨어진 자에게 좋은 일이 기다리고 있지 않다는 것을 모두가 너무나 잘 알고 있기 때문입니다."
 BLR_fin_snipes: "사코 TRG 스나이퍼"
 BLR_fin_snipes_desc: "사코 TRG-22 소총은 벨라루스 공화국 내무부 내무군 SOBR의 저격수들이 사용합니다."
 BLR_ger_guns: "독일제 기관단총"
 BLR_ger_guns_desc: "우리는 특수 기관을 위해 독일제 기관단총을 대량으로 구매할 준비가 되어 있습니다."
