 floating_harbor_equipment: "Système de chaussée modulaire"
 floating_harbor_equipment_desc: "Sections de pontons préfabriquées remorquées en place et ancrées au large d'une côte non aménagée, permettant à une force de débarquement de décharger du fret là où aucun port opérationnel n'existe. Exposé aux attaques aériennes et navales, et il se désagrège en quelques semaines."
 floating_harbor_equipment_1: "Système de chaussée modulaire"
 floating_harbor_equipment_1_desc: "Sections de pontons préfabriquées remorquées en place et ancrées au large d'une côte non aménagée, permettant à une force de débarquement de décharger du fret là où aucun port opérationnel n'existe. Exposé aux attaques aériennes et navales, et il se désagrège en quelques semaines."
 module_light_surface_fut_reactor_power: "Réacteur léger de pointe"
 module_light_surface_fut_reactor_power_desc: "Les réacteurs légers de nouvelle génération améliorent densité de puissance et endurance, donnant aux petits combattants de surface davantage de vitesse et une portée d'opération mondiale.\n\n§GIndice du concepteur : ce moteur offre une grande vitesse et une grande portée sans coût de carburant, mais est extrêmement coûteux à produire. Recommandé pour les nations ayant besoin de navires légers capables de projection mondiale.§!"
 module_light_surface_fut_reactor_power2: "Réacteur léger hyper-avancé"
 module_light_surface_fut_reactor_power2_desc: "$module_light_surface_fut_reactor_power_desc$"
 UKR_module_light_helipad_1: "Ka-25/Ka-27"
 UKR_module_helipads_1: "Ka-25"
 UKR_module_helipads_2: "Ka-27"
 UKR_module_chain_gun: "2M-3M"
 UKR_module_chain_gun_desc: "Le 2M-3 est un affût d'artillerie navale automatique soviétique à deux tubes de 25 mm. C'est un moyen d'autodéfense pour les navires pouvant frapper des cibles jusqu'à une portée oblique de 3000 m."
 UKR_module_ciws_1: "AK-230"
 UKR_module_ciws_1_desc: "L'AK-230 est un canon naval bitube de 30 mm entièrement automatique soviétique. Sa fonction principale est l'anti-aérien. Il est monté dans une tourelle automatique fermée et dirigé par radar."
 UKR_module_ciws_2: "AK-630"
 UKR_module_ciws_2_desc: "L'AK-630 est un système de défense rapprochée (CIWS) à canon rotatif naval entièrement automatique d'origine soviétique et russe. La désignation '630' fait référence aux six tubes du canon et à leur calibre de 30 mm."
 UKR_module_ciws_3: "35mm Oerlikon Millénaire"
 UKR_module_ciws_3_desc: "Le Rheinmetall Oerlikon Millennium Gun ou Rheinmetall GDM-008 est un système CIWS conçu par Rheinmetall Air Defence AG pour les navires. Basé sur le canon revolver 35/1000, il utilise des munitions AHEAD."
 UKR_module_naval_ammo_air_defense_2: "Fort S-300F"
 UKR_module_naval_ammo_air_defense_2_desc: "Le S-300F Fort est un système SAM soviétique, introduit en 1984. C'est un système de missiles antiaériens embarqué à lancement vertical conçu pour détruire des cibles rapides, manœuvrantes et de petite taille sur toute la gamme d'altitudes, de l'ultra-basse à la grande."
 UKR_module_naval_ammo_air_defense_4: "Dniepr"
 UKR_module_naval_ammo_air_defense_4_desc: "Le Dnipro est un système de missiles antiaériens (SAMS) ukrainien de moyenne portée en perspective, développé par plusieurs entreprises du complexe militaro-industriel ukrainien. Il devait être monté sur les corvettes de classe « Volodymyr Velykyi »."
 UKR_module_ram_3: "3M87 'Kortik'"
 UKR_module_ram_3_desc: "Le CIWS 3M87 'Kortik' est un système de défense antiaérienne navale moderne combinant canon et missiles. Sa version d'exportation est connue sous le nom de 'Kashtan'."
 UKR_module_naval_ammo_anti_ship_1: "Terme P-15"
 UKR_module_naval_ammo_anti_ship_1_desc: "Le P-15 Termit est un missile antinavire développé par le bureau d'études Raduga de l'Union soviétique dans les années 1950. Le P-15M est plus lourd et plus long que le P-15 d'origine ; il avait une portée de 80 km et plusieurs améliorations mineures."
 UKR_module_naval_ammo_anti_ship_2: "P-270 Moskit"
 UKR_module_naval_ammo_anti_ship_2_desc: "Le P-270 Moskit est un missile de croisière antinavire soviétique supersonique à statoréacteur. Sa désignation GRAU est 3M80, la variante air-sol est le Kh-41. Le système a été conçu par le bureau d'études Raduga dans les années 1970 comme successeur du P-120 « Malakhit » et remplacement du P-15 Termit."
 UKR_module_naval_ammo_anti_ship_3: "P-500 Bazalt"
 UKR_module_naval_ammo_anti_ship_3_desc: "Le P-500 Bazalt est un missile de croisière supersonique à turboréacteur utilisé par les marines soviétique et russe. Une version du P-500 Bazalt à guidage et moteurs améliorés est utilisée sur les croiseurs de classe Slava. Les seize tubes de lancement flanquant la superstructure sont une caractéristique indéniable de cette classe."
 UKR_module_naval_ammo_anti_ship_4: "R-360 Neptun"
 UKR_module_naval_ammo_anti_ship_4_desc: "Le R-360 Neptune est un missile de croisière subsonique ukrainien tout-temps développé par le bureau d'études Luch à Kiev. Avec une portée de plus de 200 kilomètres, il est destiné à neutraliser des cibles navales jusqu'à 9 000 tonnes."
 UKR_module_naval_ammo_anti_ship_5: "Korshun-2"
 UKR_module_naval_ammo_anti_ship_5_desc: "Korshun-2 est un projet prometteur de missile de croisière subsonique ukrainien. Le missile peut être placé sur un châssis terrestre mobile ou un navire, ainsi que sous un pylône d'aéronef. Le bureau d'études « Pivdenne » l'a dévoilé pour la première fois au salon international « Armes et sécurité-2014 »."
 UKR_module_naval_ammo_anti_ship_6: "Korshun-2M"
 UKR_module_naval_ammo_anti_ship_6_desc: "Korshun-2M est un projet de modernisation prévu pour le missile de croisière Korshun-2, préparé par le bureau d'études Pivdenne."
 UKR_naval_ammo_asw_1: "RPK-1 Vikhr"
 UKR_naval_ammo_asw_1_desc: "Le RPK-1 Vikhr OTAN était un système soviétique de missiles anti-sous-marins nucléaires. FRAS-1 était le code OTAN du missile lui-même. Le développement a été ordonné en 1960 pour combattre les nouveaux sous-marins nucléaires américains."
 UKR_naval_ammo_asw_2: "URK-5 Rastrub-B"
 UKR_naval_ammo_asw_2_desc: "L'URK-5 Rastrub-B est un système soviétique de missiles anti-sous-marins embarqué. Le complexe est une modernisation du complexe URPK-3 « Metel ». Il sert à détruire sous-marins ainsi que navires de combat de surface et bâtiments d'un ennemi potentiel."
 UKR_module_torpedoes_1: "ENSEMBLE-40"
 UKR_module_torpedoes_1_desc: "La SET-40 est une torpille acoustique électrique soviétique de petite taille conçue pour détruire les sous-marins silencieux. Développée dans les années 1960, elle était en service dans l'URSS et le Pacte de Varsovie."
 UKR_module_torpedoes_2: "JEU-65"
 UKR_module_torpedoes_2_desc: "La SET-65 est une torpille électrique anti-sous-marine soviétique de calibre 533 mm. Entrée en service en 1965 sous la direction de V. A. Golubkov."
 UKR_module_torpedoes_3: "Impact MU90"
 UKR_module_torpedoes_3_desc: "La MU90 Impact est une torpille anti-sous-marine légère franco-italienne avancée de troisième génération développée pour les marines française et italienne, ainsi que pour l'exportation."
 UKR_module_anti_ship_torpedoes_1: "53-57"
 UKR_module_anti_ship_torpedoes_1_desc: "La 53-57 est une torpille soviétique rectiligne à longue portée et sans sillage, pour la destruction de navires et de structures côtières situées au bord de l'eau."
 UKR_module_anti_ship_torpedoes_2: "53-65K"
 UKR_module_anti_ship_torpedoes_2_desc: "La famille 53-65 comprend des torpilles russes à sillage conçues pour détruire les navires de surface. Les versions K et M sont devenues opérationnelles en 1969."
 UKR_module_aa_missiles_1: "MTU-4 'Igla-1'"
 UKR_module_aa_missiles_1_desc: "Système de défense antiaérienne situé à la poupe, consistant en une installation marine stabilisée avec quatre rails pour missiles 9K310 'Igla-1'."
 UKR_module_aa_missiles_2: "M-4 'Osa-M'"
 UKR_module_aa_missiles_2_desc: "L'M-4 'Osa-M' est un système de missile antiaérien naval automatisé russe, version marine du système de défense aérienne Osa."
 UKR_module_aa_missiles_4: "Koral"
 UKR_module_aa_missiles_4_desc: "'Koral' est un projet ukrainien de missile guidé antiaérien pour systèmes à moyenne portée. Développé par le bureau 'Luch' depuis 2016 pour être un missile modulaire unifié terre-mer."
 UKR_module_esm_1: "'Vympel-R2' avec\nPK-16 / PK-10"
 UKR_module_esm_1_desc: "Le radar de guerre électronique 'Vympel-R2' est conçu pour détecter les radiations des radars adverses et des têtes chercheuses de missiles afin de générer des interférences actives.\nLes PK-16/PK-10 sont des systèmes de brouillage électronique soviétiques (leurres thermiques et réflecteurs dipolaires)."
 UKR_module_esm_2: "MP-401S 'Start-S'\navec PK-10 / PK-2"
 UKR_module_esm_2_desc: "Le complexe de ciblage et de brouillage MP-401S 'Start-S' est conçu pour supprimer les radars de détection et les radars de missiles antinavires.\nLes PK-2/PK-10 sont des systèmes de brouillage passif soviétiques."
 UKR_module_esm_3: "TK-25E\navec PK-10 / PK-2"
 UKR_module_esm_3_desc: "Le TK-25E intercepte les radiations des radars ennemis, analyse les menaces automatiquement et crée des interférences dans les directions les plus dangereuses.\nLes PK-2/PK-10 assurent le brouillage passif complémentaire."
 UKR_module_76mm_battery: "2x2 57mm AK-725"
 UKR_module_76mm_battery_desc: "L'AK-725 est un affût d'artillerie navale bitube universel soviétique de calibre 57 mm. Système automatique de la deuxième génération d'après-guerre."
 UKR_module_100mm_battery: "2x2 76mm AK-726"
 UKR_module_100mm_battery_desc: "L'AK-726 est un canon naval bitube de 76 millimètres développé en Union soviétique, toujours en service dans diverses marines."
 UKR_module_127mm_battery: "2x1 100mm AK-100"
 UKR_module_127mm_battery_desc: "L'AK-100 est un canon naval soviétique de 100 mm avec une cadence de 60 coups/min, tirant des munitions antiaériennes ou à fragmentation de 26,8 kg."
 UKR_module_76mm_gun_1: "57mm AK-725"
 UKR_module_76mm_gun_1_desc: "L'AK-725 est un affût d'artillerie navale bitube universel soviétique de calibre 57 mm. Système automatique de la deuxième génération d'après-guerre."
 UKR_module_76mm_gun_2: "76mm AK-176"
 UKR_module_76mm_gun_2_desc: "L'AK-176 est un canon naval soviétique de 76 mm en tourelle fermée contre cibles navales, côtières et aériennes. Comprend le radar de conduite de tir MR-123-02/76."
 UKR_module_76mm_gun_3: "OTO Melara 76 mm"
 UKR_module_76mm_gun_3_desc: "Le canon OTO Melara 76 mm est un canon automatique naval conçu par la société italienne OTO Melara. C'est une référence mondiale évoluant vers les versions SR et Strales."
 UKR_module_127mm_guns_1: "100mm AK-100"
 UKR_module_127mm_guns_1_desc: "L'AK-100 est un canon naval soviétique de 100 mm avec une cadence de 60 coups/min, tirant des munitions antiaériennes ou à fragmentation de 26,8 kg."
 UKR_module_127mm_guns_2: "130mm AK-130"
 UKR_module_127mm_guns_2_desc: "L'AK-130 est un canon naval automatique bitube de conception russe de calibre 130 mm, capable de tirer 10 à 40 coups par minute par tube."
 UKR_module_radar_1: "MR-302 §7'Rubka'§! / MR-310 §7'Angara'§!"
 UKR_module_radar_1_desc: "Le MR-302 'Rubka' est un radar de recherche aérienne et de surface opérant en bande F. Le MR-331 'Rangout' est un radar en bande X utilisé pour la navigation et le ciblage des missiles P-15."
 UKR_module_radar_2: "MR-220 §7Reyd§! / MR-352 §7Positiv§!"
 UKR_module_radar_2_desc: "Le MR-302 'Rubka' opère en bande F pour la recherche air/surface. Le MR-331 'Rangout' opère en bande X pour la navigation et le guidage de missiles P-15 'Termit'."
 UKR_module_radar_3: "MR-750 §7Fregat-M§! / MR-755 §7Fregat-MA§!"
 UKR_module_radar_3_desc: "!!!"
 UKR_module_radar_4: "MR-800 §7Flag§!"
 UKR_module_radar_4_desc: "Le MR-800 'Flag' est un complexe incluant le MR-600 'Voskhod', un radar de surveillance aérienne 3D longue portée en bande D, couplé au radar MR-500 'Cleaver' pour la recherche de surface."
 UKR_module_radar_5: "Thales SMART-S"
 UKR_module_radar_5_desc: "Le SMART-S est un radar de surveillance 3D opérant en bande S. Capteur principal pour la gestion des données et le contrôle des armes, performant en présence de brouillage électronique intense."
 UKR_module_sonar_1: "MG-322 §7'Agrun'§! avec MG-339 §7'Shelon'§!"
 UKR_module_sonar_1_desc: "§7'Agrun'§! est un sonar de coque basse fréquence soviétique de §72e gén§! pour la veille panoramique.\n§7'Shelon'§! est un sonar remorqué moyenne fréquence de §72e gén§! avec antenne immergeable à la poupe."
 UKR_module_sonar_2: "MG-332 §7'Titan-2'§! avec MG-325 §7'Vega'§!"
 UKR_module_sonar_2_desc: "§7'Titan-2'§! est un sonar de coque basse fréquence de §72e gén§! pour la veille panoramique.\n§7'Vega'§! est un sonar remorqué moyenne fréquence de §72e gén§! avec antenne immergeable."
 UKR_module_sonar_3: "MG-335 §7'Platina'§! avec MG-345 §7'Bronza'§!"
 UKR_module_sonar_3_desc: "§7'Platina'§! est un sonar de coque basse fréquence de §73e gén§!.\n§7'Bronza'§! est un sonar remorqué moyenne fréquence de §73e gén§! avec antenne immergeable."
 UKR_module_sonar_4: "MGK-365 §7Zvezda M1§!"
 UKR_module_sonar_4_desc: "§7'Zvezda'§! est un sonar de coque basse fréquence soviétique de §74e gén§! pour la veille panoramique et la désignation de cibles."
 UKR_module_naval_radar_jammer_2: "§7Protydiya§!"
 UKR_module_naval_radar_jammer_2_desc: "§7Protydiya§! est une suite de guerre électronique navale proposée, conçue pour équiper une corvette de classe Volodymyr Velykyi du projet 28250. Le système a pour but d'intercepter et de brouiller les signaux radar ennemis, ainsi que de fournir des contre-mesures électroniques contre les missiles entrants."
