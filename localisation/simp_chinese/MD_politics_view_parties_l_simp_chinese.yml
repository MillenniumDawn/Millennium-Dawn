 PMR.oligarchism_desc: "（亲俄专制主义） - 共和党的正式名称是‘复兴’，是一个未被承认的德涅斯特河沿岸政党，是国际公认的摩尔多瓦一部分的实体。它一直是最高委员会的议会多数党。"
 PMR.socialism: "£PMR_western_social_democrat (SD)  - 社会民主党"
 PMR.socialism_desc: "与德涅斯特河沿岸其他政党不同，它支持有条件地重新融入摩尔多瓦，并赋予德涅斯特河沿岸高度自治权。"
