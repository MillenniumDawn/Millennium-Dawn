 # Chinese thermal plant financing
 BOS_thermal_chinese_financing_tt: "§YBeijing will be told the loan is signed, and will take its influence in Bosnia in return.§!"
 BOS_events.72.t: "Sarajevo Signs for Tuzla"
 BOS_events.72.d: "Bosnia has signed the credit line for the Tuzla lignite expansion — 0.10 billion out of our books, and our contractors on the ground. The plant is the smaller prize. What the loan really buys is a seat at the table in Sarajevo, and a partner in the Balkans who owes us."
 BOS_events.72.a: "Splendid."

 # Foreign investor courtship
 BOS_court_turkish_investment_tt: "§YAnkara will be told the market is open, and will take its influence in Bosnia in return.§!"
 BOS_court_gulf_investment_tt: "§YRiyadh will be told the funds are welcome, and will take its influence in Bosnia in return.§!"
 BOS_events.73.t: "Sarajevo Opens the Door"
 BOS_events.73.d: "Bosnia has cleared the way for our construction firms and our banks. Highway sections, housing, a branch network in Sarajevo — work for our contractors and a foothold in a country that still looks to us as kin. Ankara's word will carry weight in the Federation now."
 BOS_events.73.a: "Excellent."
 BOS_events.74.t: "Buroj Ozone Finds Its Backers"
 BOS_events.74.d: "Sarajevo has invited Gulf capital into property, tourism, and finance. The resort city at Trnovo is the showpiece, but the money reaches further — apartments, hotels, and the banks that hold their paper. Whatever the projects deliver, Bosnia's Muslim leadership will remember whose funds arrived."
 BOS_events.74.a: "Splendid."
