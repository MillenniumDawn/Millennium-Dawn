l_korean:
 Republic_of_Lakota_focus: "라코타 공화국 중점 계통도"
 LKT_Sakakawea_capital: "§Y사카카위아§!를 수도로 삼았음"
 LKT_Sakakawea_capital_name: "사카카위아"
 LKT_Pierre_capital: "§Y피어§!를 수도로 삼았음"
 LKT_Pierre_capital_name: "피어"
 LKT_Fort_Nakanin_capital: "§Y포트 나카닌§!을 수도로 삼았음"
 LKT_Fort_Nakanin_capital_name: "포트 나카닌"
 LKT_New_Cheyenne_capital: "§Y뉴샤이엔§!을 수도로 삼았음"
 LKT_New_Cheyenne_capital_name: "뉴샤이엔"
 LKT_Old_Cheyenne_capital_name: "올드샤이엔"
 LKT_decisions_war_time_mobilization_category: "전시 동원"
 LKT_decisions_war_time_mobilization_category_desc: "필요한 때가 되면 전선의 빈틈이라도 메울 자원 군단을 소집할 수 있습니다. 전쟁이 언제 올지는 모르지만, 반드시 올 것임은 알고 있기 때문입니다."
 LKT_war_time_mobilization: "1차 동원"
 LKT_war_time_mobilization_desc: "무기를 들라는 부름이 우리에게 닥쳤으며, 우리는 집을 지키기 위해 결집해야 합니다. 딕시의 사나이들이여, 무기를 들라!"
 LKT_war_second_wave_defenders: "2차 방어군"
 LKT_war_second_wave_defenders_desc: "적이 밀고 들어오고 있으므로, 우리는 또 한 차례의 방어군을 징집해야 합니다. 국민의 사기는 떨어지겠지만 병력이 필요합니다."
 LKT_war_desperate_defenders: "절박한 방어군"
 LKT_war_desperate_defenders_desc: "상황이 암담해지고 있습니다. 가능하든 아니든 전선을 지킬 수 있는 모든 인원이 필요합니다. 어쩌면, 어쩌면 아직 이길 수도 있을지 모릅니다."
 LKT_ideas_economic_development_commission: "경제 개발 위원회"
 LKT_ideas_economic_development_commission_desc: "개간 전선과 국가 정부 사이의 단결이 그 어느 때보다 강해진 가운데, 국가 경제 구성을 발전시키고 이해하기 위한 새로운 경제 위원회가 만들어졌습니다. 이제 밑바닥과 정점이 함께 일하고 있으니, 우리 위대한 나라의 미래는 진정한 통합을 향해 한 조각만 남았을 뿐입니다."
 LKT_event.1.t: "정부 소재지"
 LKT_event.1.d: "지금으로서는 더 북쪽을 바라볼 의도가 없으므로, 수도의 안전은 최북단의 네 개 주, 즉 다코타, 몬태나, 와이오밍에 달려 있습니다. 수도가 전선에서 멀수록 지원과 관심도 그만큼 멀어진다고 보아 이 구상을 만류하는 이들도 있습니다. 그럼에도 우리는 이런 산만한 논쟁에 발목 잡혀서는 안 됩니다. 한편 수도의 이름을 평범하게 지을지, 아니면 땅의 원주민 기원에 호소할지를 궁금해하는 이도 많습니다. 현재 이 네 후보 주는 국가 건설 위원회에 더 매력적으로 보이도록 각자의 출발 구상을 마련하고 있습니다."
 LKT_event.1.o1: "이런 일 때문에 무너진 게 아니었나?"
 LKT_event.2.t: "마음속의 논쟁"
 LKT_event.2.d: "네 후보 가운데 옛 방식을 따르려는 쪽과 땅의 원주민 영향에 더 가까워지려는 쪽으로 의견이 갈립니다. 원주민 쪽에서는 몬태나가 포트 나카닌을 내세웁니다. 이는 나코다족과 아아나닌족을 위해 인근에 있던 옛 원주민 보호구역에서 따온 이름입니다. 노스다코타는 주에서 가장 큰 강의 이름을 딴 사카가위아를 내세웁니다. 남쪽 참가자로는 사우스다코타가 피어를 내세우는데, 이 주에서는 개발이 거의 진행되지 않았으므로 새 연방 수도가 피어 대도시권이라는 더 큰 퍼즐의 한 조각으로서 독자적인 특별구를 쉽게 만들 수 있다고 주 내 다수가 믿습니다. 마지막으로 뉴샤이엔이 있습니다. 주의 중앙에서 약간 오른쪽에 자리한 이곳은 와이오밍의 옛 주도보다 우선하게 되며, 옛 주도는 올드샤이엔으로 개명됩니다. 일부 주민은 이 구상에 상처를 입지만, 연방 수도가 젊은 국가의 역사에서 새로운 페이지의 횃불을 이어받는 갱신의 상징이라고 보는 이가 많습니다."
 LKT_event.2.o1: "사카가위아"
 LKT_event.2.o2: "피어"
 LKT_event.2.o3: "포트 나카닌"
 LKT_event.2.o4: "뉴샤이엔"
 LKT_event.3.t: "남부 감사"
 LKT_event.3.d: "국가를 안정시키기 위한 길고 지루한 노력 끝에, 마침내 우리를 돕고 있다고 알려진 이른바 \\"개척 전선\\" 조직을 다룰 수 있게 되었습니다. 그러나 이미 터를 잡고 살던 집을 떠나 갑자기 새 터전을 만든 진짜 이유를 알아내기 위해 감사관을 그곳에 파견했습니다. 어쨌든 우리가 실제로 움직이려면 정확히 무엇이 보고되는지 기다려야 합니다."
 LKT_event.3.o1: "그렇게 나쁘진 않겠지?"
 LKT_event.4.t: "초기 보고"
 LKT_event.4.d: "정보가 일부 들어왔는데, 좋게 봐도 엇갈리고 나쁘게 보면 혼란스럽습니다. 일부 보고는 RF가 정말로 그들의 말 그대로라고 시사합니다. 남부 공화국을 탈출해 스스로 새 터전을 일구려는 원주민 집단이라는 것입니다. 그 결과 캔자스의 경제 상황은 나머지 국가보다 빠르게 성장했습니다. 그러나 반대로 일부 RF 구성원이 지역 주민을 상대로 범죄를 저지르고, 평판을 유지하기 위해 마피아 비슷한 활동까지 벌인다는 보고도 있습니다. 이렇게 오락가락하니, 우리는 재건에 진짜 힘을 보탤 수도 있고 배에 진짜 칼을 맞을 수도 있습니다. 어쨌든 우리는 중대한 선택을 해야 하며, 훗날 후회할 수도 있는 행동으로 이어질 수 있습니다."
 LKT_event.4.o1: "전부 범죄자다!"
 LKT_event.4.o2: "잠깐, 뭔가 다른 사정이 있을지도 모른다"
 LKT_event.5.t: "거절할 수 없는 제안"
 LKT_event.5.d: "RF의 더 불법적인 활동에 관한 충격적인 보고가 나오자, 한 감사관이 독자적으로 RF 지도부를 만나 사실상 제안을 내놓았습니다. 그들의 요란한 과시를 조금 누그러뜨리고 북부 정부가 더 많은 공을 가져가도록 하면 내버려 두겠다는 것입니다. 당연히 RF 지도부 반응은 엇갈렸고, 가장 큰 목소리가 점점 커지는 집단적 반응이 되었습니다. 그 답변은 이렇게 인용되었습니다. \\"우리는 평화로운 민족이며, 우리를 옛 백인들처럼 흔한 범죄자나 조직 폭력배쯤으로 여기는 데 철저히 모욕감을 느낍니다. 우리 민족에게 낙인을 찍는 그런 무례하고 모욕적인 발언을 용납하지 않겠다는 것을 보여 주겠습니다.\\" 감사관은 쫓겨나 네브래스카 국경까지 내내 괴롭힘을 당했으며, 이로써 우리의 추정이 옳았고 곧 행동에 나서야 함이 분명해졌습니다."
 LKT_event.5.o1: "한 치를 내주면 주 하나를 통째로 가져간다"
 LKT_event.6.t: "국가를 결집하라"
 LKT_event.6.d: "RF 구성원과 지역 지도부가 이 반란 운동 전체에 가담하기 시작하면서 캔자스의 불안이 커지고 있습니다. 이에 북부 주들이 결집하기 시작했으며, 조만간 어디로든 나아가려면 어떤 형태로든 동원을 시작해야 합니다."
 LKT_event.6.o1: "이 나라는 우리의 것이지 그들의 것이 아니다"
 LKT_event.7.t: "공공연한 반란"
 LKT_event.7.d: "그 빌어먹을 반역자들이 결국 해냈습니다. 캔자스 주기를 높이 게양하고 공화국으로부터의 주 독립을 선언했습니다. 이웃 나라들이 약점을 보기 전에 군대를 정비하여 이 일을 끝내야 합니다."
 LKT_event.7.o1: "집결 나팔을 불어라"
 LKT_event.8.t: "전쟁으로!"
 LKT_event.8.d: "국가는 동원되었습니다. 그 가치가 얼마나 되든, 우리는 이 반역적이고 기회주의적인 해충들로부터 우리 땅을 지키기 위해 남쪽으로 진군합니다. 선의니 뭐니 하는 것들은, 쳇, 좋게 봐야 헛소리이고 나쁘게 보면 거짓말투성이입니다."
 LKT_event.8.o1: "남쪽으로 진군한다!"
 LKT_event.9.t: "선택지를 남기지 않는 그들"
 LKT_event.9.d: "그들은 우리를 도둑, 사기꾼, 범죄자라 부릅니다. 우리는 그런 사람들이 아니며, 이 너그럽고 뜻이 통하는 캔자스 사람들과 함께 우리 자신을 지킬 것입니다. 캔자스와 진정한 자유를 위하여!"
 LKT_event.9.o1: "우리는 자유를 위해 싸운다!"
 LKT_event.5000.t: "추가 조사"
 LKT_event.5000.d: "계속되는 보고에 따르면 이 조직의 불법 활동에 관한 주장이 점점 더 전제부터 거짓으로 밝혀지고 있습니다. 이에 따라 국가 경제를 활성화하고 국민 간의 보다 조화로운 연합을 지향하는 협상이 시작되었습니다."
 LKT_event.5000.o1: "더 살펴보길 다행이다"
 LKT_event.5001.t: "추가 계획"
 LKT_event.5001.d: "초기 논의와 투자 계획으로 경제가 전반적으로 성장하고 있습니다. 이러한 성장으로 몇 달은 걸릴 것으로 생각했던 개발이 가시화되었습니다. 상황이 이렇게 흘러가는 만큼, 위대한 국가와 다양한 국민의 균형 잡히고 안정적인 경제 발전을 보장할 경제 위원회를 설립하는 방안을 검토해야 합니다."
 LKT_event.5001.o1: "번영을 위하여!"
 LKT_event.5002.t: "위원회"
 LKT_event.5002.d: "계속된 협상과 발전의 결과로 \\"경제 개발 위원회\\"가 구성되었습니다. 이 위원회는 보다 일관된 경제 계획과 성장 교리를 낳았으며, 이는 앞으로 여러 세대에 걸쳐 우리 국가에 도움이 될 것입니다."
 LKT_event.5002.o1: "뭉치면 살고, 다시는 흩어지지 않으리라"
 LKT_organizing_the_farmers: "농민 조직화"
 LKT_organizing_the_farmers_desc: "우리가 가진 것은 많지 않지만, 가진 것은 필요할 때를 대비해 결집시키고 준비시켜야 합니다."
 LKT_creating_infantry_reserves: "예비대 창설"
 LKT_creating_infantry_reserves_desc: "사방이 적으로 둘러싸인 만큼 최악의 상황을 예상해야 합니다. 때가 왔을 때 적에 맞설 수 있도록 즉응 예비대를 창설합시다."
 LKT_mobilizing_the_reserves: "예비대 동원"
 LKT_mobilizing_the_reserves_desc: "때가 임박했으며 우리는 소중한 시민들의 안전을 보장해야 합니다. 예비대를 소집하여 우리의 집을 지키러 나아갑시다."
 LKT_focus_a_capital_conundrum: "수도의 난제"
 LKT_focus_a_capital_conundrum_desc: "우리가 국가라고 부르는 것이 간신히 한데 묶여 있는 상황에서, 우리는 국가의 수도라 부를 수 있는 근거지를 찾아야 합니다. 우리는 북쪽을 바라보며 해결책이 있기를 희망합니다."
 LKT_focus_montana_monster: "몬태나의 괴물"
 LKT_focus_montana_monster_desc: "재건이 마침내 시작되었으며, 다른 무엇을 생각하기 전에 우리나라는 스스로를 부양하고 먹여 살릴 수 있어야 합니다. 따라서 이 초기에는 농업이 최우선입니다."
 LKT_focus_montana_marvel: "몬태나의 경이"
 LKT_focus_montana_marvel_desc: "누더기에서 부유함으로, 아니 최소한 빈 배에서 채워진 배로 나아갔습니다. 이제 민간 및 일반 지방 행정 서비스를 가동하여 주 내의 사회를 안정시키고 이 땅에 새로운 평화를 가져올 수 있습니다."
 LKT_focus_northern_troubles: "북부의 골칫거리"
 LKT_focus_northern_troubles_desc: "다코타는 우리나라 대부분의 지역과 마찬가지로 일부 주의 인구수에도 불구하고 매우 희박하고 개발이 제대로 이루어지지 않았습니다. 어쨌든 기회주의자들이 북부 국경 지역을 빼앗으려 시도하기 전에 이를 공고히 해야 하며, 떠나려는 사람들 또한 우리나라에 큰 손실이 될 것입니다. 지금으로서는 어떤 형태로든 경제를 돌리기 시작합시다."
 LKT_focus_our_northern_light: "우리의 북극광"
 LKT_focus_our_northern_light_desc: "노스다코타에 경제와 사회 안정의 시작이 돌아오고 있는 지금, 우리는 지역 응급 및 민간 서비스를 확대하기 시작할 수 있습니다. 이를 통해 우리 신생 국가 내의 통제 영역을 넓힐 수 있습니다."
 LKT_focus_yellowstone_yelling: "옐로스톤의 외침"
 LKT_focus_yellowstone_yelling_desc: "이 땅은 혼돈과 위험이 전역에 퍼져 있어 울부짖고 있으며, 우리는 이 지역에 평화와 고요를 되찾기 위한 계획을 세워야 합니다. 이 주에는 사람이 많지 않지만, 이는 곧 개발된 것도 활용할 것도 더 적다는 뜻입니다. 그래도 사람들에게는 무언가가 있어야 하며, 우리는 그들의 배를 채울 음식을 줄 것입니다."
 LKT_focus_worland_wonder: "워랜드의 기적"
 LKT_focus_worland_wonder_desc: "마침내 평화의 외양이 회복되었고, 이와 함께 민간 서비스와 기타 지방 편의 시설을 복구하여 나라 더 많은 곳에 사회적 결속을 되찾아줄 수 있습니다. 머지않아 우리는 진정으로 집이라 부를 수 있는 곳을 누리게 될 것입니다."
 LKT_focus_southern_turmoil: "남부의 소란"
 LKT_focus_southern_turmoil_desc: "끓어라 끓어라, 수고와 고난이여, 우리는 모든 시름의 솥을 휘젓는다. 절망의 밑바닥에서 닦고 고칠 수 있는 무언가를 수면 위로 끌어올린다. 경제와 식탁 위의 음식을 갖추었으니, 한때 우리를 괴롭히던 우화 같은 이야기들을 들려주리라. 이제 앞으로 행군하며 속도를 정하자, 우리 국민은 이 절박한 운명의 시기에 우리를 필요로 하니."
 LKT_focus_rapid_city_revival: "래피드시티 부흥"
 LKT_focus_rapid_city_revival_desc: "안정된 손길로 우리는 평화를 이루고, 이 땅의 사람들에게 잔치를 열어주리라...좋습니다, 형편없는 운율은 이쯤 하겠습니다. 당신은 어느 정도의 경제를 구축했으니, 이제 정부 행정과 민간 서비스를 가동하여 사회적 결속을 회복하고 나라의 또 다른 부분의 연대를 되찾으십시오."
 LKT_focus_industry_what_industry: "산업이라고요, 무슨 산업?"
 LKT_focus_industry_what_industry_desc: "많은 이들이 주장하고 싶어하는 것과는 달리, 명백한 현실은 우리에게도 어느 정도의 산업 역량이 있다는 것입니다...대단하진 않지만 그럼에도 불구하고 무언가는 있습니다. 이는 적어도 우리 경제 구성 전반을 안정시키고 다각화하는 데 도움이 됩니다."
 LKT_focus_nebraska_neck_breaker: "네브래스카의 목 부러뜨리기"
 LKT_focus_nebraska_neck_breaker_desc: "나라 전체가 상처 입은 지금, 우리는 그 상처를 치유하기 위해 노력해야 합니다. 어떤 형태로든 경제의 기초선을 회복하면 사람들이 함께 모여 우리가 아는 사회를 다시 시작할 수 있을 것입니다."
 LKT_focus_from_broken_bow_to_fixed: "부러진 활에서 고쳐진 활로"
 LKT_focus_from_broken_bow_to_fixed_desc: "상처는 아물지만 흉터는 남습니다. 완전히 치유되어 과거를 딛고 나아가는 데에는 시간이 걸리겠지만, 한 걸음씩 해낼 수 있습니다."
 LKT_focus_kansas_city_catastrophe: "캔자스시티의 대참사"
 LKT_focus_kansas_city_catastrophe_desc: "캔자스주 캔자스시티는 사람도, 할 일도, 맥락에서 떼어내 놀려먹을 거리도 가득한 대단한 곳이었습니다. 그러나 그것은 많은 것에 대해 말할 수 있는 이야기이며, 불꽃이 일어 도시는 야유와 환호 이상의 것으로 불타올랐습니다. 이제 우리는 한때 잃어버린 것을 되찾고 재생을 향한 새로운 길을 열어야 합니다."
 LKT_focus_the_kansas_city_kitty: "캔자스시티의 고양이"
 LKT_focus_the_kansas_city_kitty_desc: "이제 경제가, 뭐, 존재하게 되었으니 다시 일상으로 돌아갈 수 있습니다. 중심가의 클럽이 문을 열었다고 들었으니, 옛 좋은 시절처럼 밤새 춤을 출 수 있겠군요."
 LKT_focus_the_new_republic: "새로운 공화국"
 LKT_focus_the_new_republic_desc: "옛 것의 잿더미에서 새로운 것이 일어납니다. 이제 우리는 우리 자신뿐 아니라 우리가 만들고자 하는 미래도 발견하기 위해 나아갑니다."
 LKT_focus_new_elections_begin: "새로운 선거의 시작"
 LKT_focus_new_elections_begin_desc: "이제 정치적 기반을 닦기 시작할 때입니다. 첫 전국 선거를 실시함으로써 우리는 국민이 스스로 결론을 내리고 원하는 운명의 주도권을 쥘 수 있는 무대를 마련합니다."
 LKT_focus_the_councils_of_authority: "권위 평의회"
 LKT_focus_the_councils_of_authority_desc: "운명의 흥미로운 장난으로, 수많은 거의 \\"과두제적\\"인 정당 중 하나가 선거에서 승리한 것으로 보입니다. 이제 진짜 문제는 이 정당들이 나라를 위해 무엇을 계획하고 있느냐입니다. 과두제라는 말은 워낙 위압적인 구분이라 나라에 좋은 징조는 아닐 것 같습니다. 국민은 대체 무슨 생각이었을까요?"
 LKT_focus_DDP_political_plan: "다코타 민주당 정치 계획"
 LKT_focus_DDP_political_plan_desc: "첫 선거가 마무리되며 다코타 민주당이 승리를 거머쥔 것으로 보입니다. 이제 그들은 이 초기의 불확실한 시기에 나라와 국민을 빚어내기 위해 정책을 시행할 계획입니다."
 LKT_focus_skill_assessment_fairs: "기술 평가 박람회"
 LKT_focus_skill_assessment_fairs_desc: "SAF는 인구가 모든 분야에서 자신의 기술을 갈고닦고 이해하도록 하기 위해 설계된 연방 후원 행사입니다. 이를 통해 개인을 고용하는 데 도움이 될 뿐 아니라 우리나라에 어떤 인재가 있는지 더 잘 파악할 수 있습니다."
 LKT_focus_light_industry_investment: "경공업 투자"
 LKT_focus_light_industry_investment_desc: "우리나라에 제한적이지만 의미 있는 산업을 세우면 새로운 기술 역량과 일자리 기회에 자연스럽게 노출될 것입니다. 대단하진 않지만, 흔히 말하듯 정직한 일입니다."
 LKT_focus_business_taxes_redraft: "기업 세금 재편"
 LKT_focus_business_taxes_redraft_desc: "개별 기업에 대한 세금 재편을 우선 마무리함으로써, 우리의 조세 정책이 실제로 시행될 수 있는 새로운 기준선을 마련할 것입니다. 우리 경제에는 세부 사항이 많지 않지만, 일괄적인 법인세로 해당 기업들에 대한 요구를 과도하게 부풀리면 세수에 부정적인 영향을 미칠 것이 틀림없습니다."
 LKT_focus_education_streamlining: "교육 간소화"
 LKT_focus_education_streamlining_desc: "교육과정을 학생들이 일상에서 활용할 수 있는 기초 위주로 단순화하면 더 나은 학급 운영을 모색할 수 있을 뿐 아니라 향후 교육과정을 개혁하는 방법도 구상할 수 있습니다."
 LKT_focus_basic_arms_industry_investment: "기초 무기 산업 투자"
 LKT_focus_basic_arms_industry_investment_desc: "우리나라는 인구가 희박하고 개발이 덜 되었습니다. 많은 이들이 우리를 손쉬운 표적으로 볼 것이며, 우리는 손쉬운 표적이 되고 싶지 않지만, 그렇게 이른 군사적 야망을 키우려면 그만한 이유가 있어야 합니다. 따라서 우리는 사냥을 지원하고 상비군의 무기를 유지하기 위한 지역 무기 제조의 기반을 마련할 것입니다."
 LKT_focus_extensive_geological_surveys: "광범위한 지질 조사"
 LKT_focus_extensive_geological_surveys_desc: "\\"저가치 매장지\\"로 여겨지는 땅에 대한 광범위한 연구와 조사를 통해, 보잘것없어 보이는 이 자원 매장지들을 의미 있는 무언가로 바꿀 방법을 찾기 시작할 수 있습니다. 초기에는 비용이 많이 들겠지만, 장기적인 이익과 국가 독립의 안정은 충분히 그만한 가치가 있습니다."
 LKT_focus_KCK_political_plan: "KCK 정치 계획"
 LKT_focus_KCK_political_plan_desc: "캔자스시티 연합은 나라를 합리적으로 가능한 한 빨리 궤도에 올리고자 하는 기업 지도자와 정치 인사들의 집단입니다. 그들의 주요 관심사는 \\"대붕괴\\"로 인한 경제 안정과 인구 관리에 집중하는 것입니다."
 LKT_focus_zoning_reforms: "용도 지역 개혁"
 LKT_focus_zoning_reforms_desc: "보다 유연하고 전통적인 용도 지역 방식과는 다른 접근법을 허용하면, 우리 마을과 도시가 시민과 경제 전반의 필요에 더 잘 적응할 수 있게 될 것입니다."
 LKT_focus_integrated_health_plans: "통합 건강 계획"
 LKT_focus_integrated_health_plans_desc: "기업에 의무적으로 제공되는 건강 보험 계획을 통합하면 더 유연한 채용 수단이 마련될 뿐 아니라 직원의 필요와 근무 환경의 요구를 간소화할 수 있습니다."
 LKT_focus_regulatory_cutbacks: "규제 축소"
 LKT_focus_regulatory_cutbacks_desc: "번거롭고 역효과를 낳는 규제를 대폭 없애면 기업들이 나라와 고용한 사람들을 더 잘 뒷받침할 수 있게 될 것입니다."
 LKT_focus_national_employment_commission: "국가 고용 위원회"
 LKT_focus_national_employment_commission_desc: "NEC는 일자리를 채우고 더 안정적이고 균형 잡힌 경제를 키우기 위해 국내외 인접 인력을 찾아내는 임무를 맡은 국가 기구입니다. 물론 외국인 노동자를 \\"스카우트\\"하는 것은 다소 위험하지만, 이 계획의 취지는 경제가 가용 노동력을 앞지르지 않도록 하는 것이므로 대륙의 형제자매들은 일반 시민으로 대우받을 것입니다."
 LKT_focus_ensuring_military_stockpiles: "군 비축물자 확보"
 LKT_focus_ensuring_military_stockpiles_desc: "국방은 중요하지만, 자국을 실제로 방어하려면 먼저 그에 필요한 장비가 있어야 합니다. 따라서 NEC를 확대하면 더 많은 사람을 공장에 고용해 이러한 비축물자를 만들 수 있으며, 육군과 공군이 부당한 관심으로부터 나라를 지킬 수 있게 될 것입니다."
 LKT_focus_LTP_political_plan: "LTP 정치 계획"
 LKT_focus_LTP_political_plan_desc: "라코타 기술관료당은 진보와 혁신의 정당입니다. 교육과 연구개발은 물론 이러한 노력에 자금을 댈 경제적 환경을 조성하는 데에도 집중하여, LTP는 더 나아지려 노력하고 한층 더 나아질 방법을 찾는 나라를 만들기를 희망합니다."
 LKT_focus_mandatory_education_programs: "의무 교육 프로그램"
 LKT_focus_mandatory_education_programs_desc: "MEP는 단순한 초등 교육 수준을 거치는 데 그치지 않고 교육의 한계를 넓히기 위해 설계된 프로그램입니다. 나이에 관계없이 사람들에게 새로운 기회를 장려하기 위한 표준 밖의 독립적인 프로그램입니다."
 LKT_focus_the_means_of_efficiency: "효율의 수단"
 LKT_focus_the_means_of_efficiency_desc: "우리나라는 인구가 희박하므로 이러한 현실에 집중하고 적응해야 합니다. 따라서 우리는 효율의 수단을 장악하고 가진 것으로 해내기 위해 노력해야 합니다."
 LKT_focus_ends_of_a_means: "수단의 목적"
 LKT_focus_ends_of_a_means_desc: "우리는 핵심 자원인 철광석을 확보하고 있습니다. 이 광석을 현대 경제 퍼즐의 근본적인 조각인 강철로 바꿀 수 있습니다. 따라서 자급자족을 위한 진정한 디딤돌을 마련하려면 이 자원의 채굴에 막대한 투자를 해야 합니다."
 LKT_focus_economic_expansion_act: "경제 확장법"
 LKT_focus_economic_expansion_act_desc: "전반적인 산업 발전은 우리의 경제 기반을 확장할 수 있게 해줄 것입니다. 이는 다시 추가 투자를 위한 더 많은 자본을 만들어낼 것입니다."
 LKT_focus_peoples_defense_act: "국민 방위법"
 LKT_focus_peoples_defense_act_desc: "PDA는 우리 병사들에게 장비를 갖출 수단을 제공하기 위해 제한적인 산업 및 계약 기회를 창출한 제한적 국방 계획입니다."
 LKT_focus_militarized_politics_plan: "군사화된 정치 계획"
 LKT_focus_militarized_politics_plan_desc: "앞으로 나아갈 길에서 무엇이 옳고 그른지를 두고 나라가 갈라진 가운데, 라코타 군대(AFL)의 일부 세력이 주도권을 잡고 어떻게든 과반수의 표를 확보하여 이번 첫 선거에서 승리했습니다. 덜 분열적인 선거였다면 이기지 못했으리라 의심하는 이도 많지만, 미지의 세계를 헤매는 것보다 방향이 있다는 것만으로 기뻐하는 이는 더 많습니다."
 LKT_focus_national_conscription_period: "국가 징병 기간"
 LKT_focus_national_conscription_period_desc: "해안 이웃 나라에 비해 압도적으로 적은 인구 때문에, 우리는 최소 반년의 의무 징병 기간을 도입해야 합니다. 많은 이들이 이 조치를 못마땅해하겠지만, 우리가 진정으로 국방에 집중하고 다른 열강들의 어떠한 어리석은 짓에도 대비하려면 반드시 해야 합니다."
 LKT_focus_military_classroom_standards: "군사 교육 기준"
 LKT_focus_military_classroom_standards_desc: "신체 능력과 소부대 전술은 물론 제식 훈련에 대한 기초 지식 같은 간단한 요건을 포함시킴으로써, 앞으로 징집될 청년들이 의무 징병 기간을 준비할 수 있도록 하는 느슨한 형태의 기초 훈련을 만들 수 있습니다."
 LKT_focus_basic_economic_investments: "기초 경제 투자"
 LKT_focus_basic_economic_investments_desc: "우리 스스로를 방어할 가능성이 있으려면 그러한 노력을 뒷받침할 수단이 실제로 있어야 합니다. 따라서 우리는 그러한 수단을 갖추기 위해 제한적인 산업 확장 사업을 추진할 것입니다."
 LKT_focus_military_industrial_sector: "군수 산업 부문"
 LKT_focus_military_industrial_sector_desc: "MIS는 우리 방식의 군산복합체입니다. 그러나 핵심적인 차이는 이 공장들이 적응성을 갖추도록 지어진 다목적 시설이라는 점입니다. 즉, 평시에는 제한적인 형태로 민간 경제에 기여하다가 때가 되면 쉽게 전환하여 전쟁 물자의 생산을 늘릴 수 있다는 뜻입니다."
 LKT_focus_less_for_more: "적게 들여 많이 얻기"
 LKT_focus_less_for_more_desc: "개별 기업과 경제 부문에서 더 적은 인력이 필요하도록 투자하는 데 집중하면 군대와 경제 확장을 위한 더 많은 인력이 확보됩니다. 이런 점에서 우리 인구는 사실상 대륙의 나머지에 비해 지독히도 적습니다. 따라서 우리는 식량 생산, 공급망, 그리고 생식의 수단을 장악하는 데 투자하여 시민들이 원하는 대로 살고 사랑할 수 있도록 할 것입니다."
 LKT_focus_general_military_improvements_funding: "일반 군사 개선 자금"
 LKT_focus_general_military_improvements_funding_desc: "GMIF는 우리가 마주칠 수 있는 잠재적 전장에서 필요하다고 판단되는 방식으로 군대를 개선할 수 있도록 하는 대규모 자금 지원 패키지입니다. 공중이 가장 큰 위협이므로, 당분간은 공군과 육군에 투자를 균등하게 나눌 것입니다."
 LKT_focus_the_parties_for_tradition: "전통을 위한 정당들"
 LKT_focus_the_parties_for_tradition_desc: "중도우파에서 보다 노골적인 우파 성향에 이르는 정당들이 모여 전통을 위한 정당들이라는 투표 연합을 결성하고 있습니다. 따라서 나라의 첫 선거에서 국민이 어느 정당에 끌릴지, 또 끌린다면 어떤 정당일지가 궁금해집니다."
 LKT_focus_ORP_political_plan: "ORP 정치 계획"
 LKT_focus_ORP_political_plan_desc: "구공화당은 안정과 신중함이라는 강령을 사용합니다. 이 강령은 느리지만 꾸준한 자가 경주에서 이긴다는 것으로 볼 수 있으며, 우리 나라가 처한 상황을 고려하면 일부 정당처럼 성급하게 나섰다면 그들에게 투표한 사람은 많지 않았을 것이라고 생각합니다."
 LKT_focus_strategic_mechanization_act: "전략적 기계화법"
 LKT_focus_strategic_mechanization_act_desc: "우리 경제가 어느 정도 농업에 지나치게 의존하고 있다는 것은 많은 사람이 이 일에 묶여 있다는 뜻입니다. 따라서 이로 인해 소란이 일더라도, 우리가 가진 가용 노동력을 더 잘 분배하기 위한 수단으로서 일정한 형태의 기계화 노력을 강제해야 합니다."
 LKT_focus_better_neighbors_act: "더 나은 이웃법"
 LKT_focus_better_neighbors_act_desc: "주된 경제 부문이 농업이므로 식량이 풍부한 것은 드문 일이 아닙니다. 따라서 우리는 이웃 나라의 \\"망명 신청자\\"들에게 인센티브를 제공하여 인구를 늘리고 경제 전체를 재건하는 데 도움을 받을 수 있습니다. 결국 일자리를 채울 사람이 없다면 일자리는 아무 의미가 없습니다."
 LKT_focus_green_thumb_officers_act: "녹색 손 경관법"
 LKT_focus_green_thumb_officers_act_desc: "GTO법은 법 집행에 대한 자금을 개선하고, 더 외딴 지역에 사는 이들의 동네와 생계에 자원을 더 잘 배분하기 위해 만들어졌습니다."
 LKT_focus_kansas_economic_upgrade: "캔자스 경제 개선"
 LKT_focus_kansas_economic_upgrade_desc: "개발이 중요한 지역은 우리의 최남단 주인 캔자스입니다. 이 주는 개발되었음에도 예상보다 농업 의존도가 높습니다. 따라서 상당한 투자를 통해 광범위한 농업 경제의 특정 지역을 경공업과 중공업이 혼합된 형태로 전환할 계획입니다."
 LKT_focus_better_budgeting_act: "예산 개선법"
 LKT_focus_better_budgeting_act_desc: "예산 개선법은 기존 교육 예산을 전면적이고 상세하게 감사하여 재정 자원을 간소화하고 더 잘 배분하도록 돕습니다. 이를 통해 예산 실패가 학생과 교직원에게 미칠 수 있는 불일치를 최대한 없애 교육 수준을 높이고자 합니다."
 LKT_focus_experimental_extractions_act: "실험적 채굴법"
 LKT_focus_experimental_extractions_act_desc: "우리나라는 핵심 강철이나 하다못해 괜찮은 철광석 공급이 부족합니다. 따라서 순수익성과 관계없이 캔자스와 네브래스카 주에서 지질 조사와 대규모 투자를 실시하여, 우리나라가 현대 경제의 이 핵심 구성 요소를 확보할 수 있도록 할 것입니다."
 LKT_focus_GLP_political_plan: "대자유당 정치 계획"
 LKT_focus_GLP_political_plan_desc: "온건한 자유주의 정책을 활용해 농업을 개선하면 나라와 국민에게 도움이 될 것입니다. 많은 이들이 대자유당을 느린 진보의 정당, 즉 사람들이 적응하고 이해할 수 있는 형태의 변화를 추구하는 정당으로 보았기 때문에 표를 던졌습니다. 그러나 이것이 계속 사실로 남을지는 시간만이 말해줄 것입니다."
 LKT_focus_food_bank_securities_act: "푸드뱅크 증권법"
 LKT_focus_food_bank_securities_act_desc: "FBS법은 가정에서 흔히 필요로 하는 식료품 구입에 사용될 국채와 민간 투자 채권을 조성하기 위한 법안입니다. 이러한 \\"푸드뱅크\\"는 어려운 시기에 감당하기 힘든 가정이 일상 필수품을 얻도록 돕는 데 쓰일 것입니다. 노숙자와 기타 빈곤한 시민들을 먹이는 안정적이고 일관된 체계를 갖춘 자선 단체 또한 이러한 증권을 신청할 수 있으나, 재원과 식량이 의도된 목적에 사용되는지 확인하기 위해 연방 규제 당국이 동행할 것입니다."
 LKT_focus_audit_commissions_act: "감사 위원회법"
 LKT_focus_audit_commissions_act_desc: "ACA 또는 감사법은 연방 기관과 인력이 재정 및 물적 자원을 명시되고 의도된 용도에 배분하고 있는지 확인하기 위해 독립적인 감사 위원회를 설립하기 위한 법안입니다. 이 기구는 어떠한 정치 기관이나 정당과도 관련이 없는 개인들로 구성되며, 공정성을 보장하기 위해 각각 재무와 규제 분야에서 선발될 것입니다."
 LKT_focus_raw_value_act: "원자재 가치법"
 LKT_focus_raw_value_act_desc: "우리나라는 농업에서 얻을 수 있는 가치에 한계가 있습니다. 사람들은 물건을 원하고 물건에는 광물 자원이 필요하므로, 적절한 표현이 없지만 국가의 포트폴리오를 다각화할 수 있도록 희토류와 기타 고부가가치 광물 광산에 투자할 것입니다."
 LKT_focus_improving_immigration_processes: "이민 절차 개선"
 LKT_focus_improving_immigration_processes_desc: "이민 단속과 시민이 되는 일반 절차에 할당된 자원을 개선하는 데 투자함으로써, 외국인들에게 더 원활하고 더 나은 호소력을 기대할 수 있습니다. 바라건대 그들이 우리나라를 새로운 고향으로 택하고, 우리는 그들에게 새로운 삶과 그 소중한 의미를 줄 수 있을 것입니다."
 LKT_focus_invest_care_act: "투자 돌봄법"
 LKT_focus_invest_care_act_desc: "투자 돌봄은 의료 서비스에 보다 일관된 자금을 투입하기 위한 예산 사업입니다. 이렇게 개선된 자금 지원 노력으로 직원의 사기를 높이고 향후 고용 기회를 장려하며, 건물이 기준에 맞고 장비가 의도대로 작동하도록 보장하기를 바랍니다. 여러분의 돌봄이 우리의 투자이며, 더 나은 국민이 곧 더 나은 나라를 뜻하기 때문입니다."
 LKT_focus_national_defense_upgrades: "국방 개선"
 LKT_focus_national_defense_upgrades_desc: "장비를 개선하고 인력이 해당 장비에 익숙해지도록 투자를 늘리면 외국의 침략 행위로부터 나라를 방어하는 능력이 높아질 것입니다."
 LKT_focus_TTP_political_plan: "TTP 정치 계획"
 LKT_focus_TTP_political_plan_desc: "부족 전통당은 많은 이들이 짐작하는 정도는 아니지만 어느 정도 토착주의적 성향을 지닌 정당입니다. 토착주의는 이 땅이 한때 부족의 땅이었다는 점에서 비롯되지만, 앞으로 나아가고 보존하며 살아남으려면 우리가 수많은 민족으로 이루어진 하나의 국가로 뭉쳐야 한다는 생각에 기반합니다. 가족, 공동체, 그리고 스스로 지키기로 한 원칙에 대한 믿음과 같은 전통을 통합을 위해 활용하는 것입니다."
 LKT_focus_defense_spending_program: "국방비 지출 계획"
 LKT_focus_defense_spending_program_desc: "DSP는 나라가 보다 방어적인 태세를 갖추도록 준비시키기 위해 마련된 지출 패키지입니다. 우리 땅은 넓은 지역에 걸쳐 트여 있기도 하고 막혀 있기도 하므로, 이러한 지형을 우리에게 유리하게 활용해야 합니다."
 LKT_focus_families_security_stipend: "가족 안전 수당"
 LKT_focus_families_security_stipend_desc: "많은 이들이 부르는 가족 수당은 가족이 신청하여 받을 수 있는 수당으로, 가족의 필요와 관련해 직면한 경제적 긴장을 덜어주는 데 도움이 됩니다. 식량, 의류, 보육 비용은 물론 연방 수당 카드로 등록된 기타 품목도 이 수당에 포함됩니다."
 LKT_focus_food_supply_mandate: "식량 공급 의무"
 LKT_focus_food_supply_mandate_desc: "우리 국민은 비옥한 땅에서 살고 있으며, 이 땅은 그곳에 사는 사람들을 쉽게 먹여 살릴 수 있어야 합니다. 이에 우리는 가능한 한 모든 끼니에 시민들이 값싸고 좋은 음식을 언제나 누릴 수 있도록 투자하고 의무를 제정할 것입니다. 우리나라의 존립 자체가 식량 공급에 달려 있기 때문입니다."
 LKT_focus_limited_industrialization_efforts: "제한적 산업화 노력"
 LKT_focus_limited_industrialization_efforts_desc: "경제를 다각화하고 건전하고 탄탄한 일자리 시장을 보장하려면, 이 땅이 제공하는 만큼 인적 자원을 다양하게 확보할 수 있도록 제한적인 산업 개발에 투자해야 합니다."
 LKT_focus_setting_up_new_contracts: "신규 계약 체결"
 LKT_focus_setting_up_new_contracts_desc: "군수 생산 능력의 제한적 기준선을 마련하면, 북아메리카 대륙에서 전쟁이 발발할 경우 마주할 수 있는 수요를 적어도 가늠할 수 있게 될 것입니다."
 LKT_focus_strategic_mining_operations: "전략 채굴 작전"
 LKT_focus_strategic_mining_operations_desc: "우리나라에는 자원이 있지만, 더 가치 있고 경제적으로 파급력이 큰 광물을 확보하려면 상당한 투자가 필요합니다. 이를 염두에 두고 와이오밍의 귀금속 채굴과 사우스다코타의 제한적인 경금속 작업에 투자할 것입니다. 대단하진 않겠지만, 연구개발 자금을 일부 보충하면 때가 되어 결실을 볼 것입니다."
 LKT_focus_LTSP_political_plan: "LTSP 정치 계획"
 LKT_focus_LTSP_political_plan_desc: "라코타 전통 연대당은 꽤 평범한 보수적 수단을 쓰는 정당입니다. 공동체와 가족 문제에 집중하고 이를 국가 통합을 도모하는 수단으로 사용하려 하지만, 많은 이들은 이처럼 분열된 상황에서 이 정당과 비슷한 보수 정당들이 왜 존재하는지 의아해합니다."
 LKT_focus_community_improvement_programs: "공동체 개선 프로그램"
 LKT_focus_community_improvement_programs_desc: "CIP는 공동체를 하나로 묶고 소규모 또는 농촌 지역에서의 전반적 발전을 장려하기 위해 지역 사회 봉사와 일반적인 개선 노력을 제공하도록 설계되었습니다."
 LKT_focus_farming_expansion_efforts: "농업 확장 노력"
 LKT_focus_farming_expansion_efforts_desc: "우리나라의 안정은 비옥한 땅이 풍부하다는 사실에 힘입어 번성하며, 따라서 우리는 국민이 자신이 일구는 들판과 함께 성장하도록 이 땅을 개발할 것입니다."
 LKT_focus_building_to_new_heights: "새로운 높이로"
 LKT_focus_building_to_new_heights_desc: "사무 및 기술 부문을 확대해야 합니다. 경제와 시민의 잠재력을 제대로 다각화하려면 새로운 개발은 물론 이를 뒷받침할 교육에도 투자해야 합니다."
 LKT_focus_manufacturing_new_industries: "신산업 육성"
 LKT_focus_manufacturing_new_industries_desc: "경제의 핵심 기반을 발전시키는 것은 전반적인 확장의 기본입니다."
 LKT_focus_securing_armaments: "무기 확보"
 LKT_focus_securing_armaments_desc: "병력에 보급할 수 있다는 것은 국방에 필수적입니다. 가까운 시일 내에 아무 일도 일어날 것으로 예상하지 않으므로, 소규모로 시작하여 기본 장비 부족을 해결할 공장 몇 곳을 세울 것입니다."
 LKT_focus_natural_resources_act: "천연자원법"
 LKT_focus_natural_resources_act_desc: "우리나라의 자원 역량을 혁신하고자 하는 광범위하고 균형 잡힌 채굴 투자 패키지입니다. 비용은 많이 들겠지만 시간이 흐르면 스스로 비용을 충당할 것입니다."
 LKT_focus_the_common_folk_progress_parties: "서민 진보 정당들"
 LKT_focus_the_common_folk_progress_parties_desc: "일부 사람들이 선호하여 부르는 서민 정당들은 떠오르는 사회주의 경제 성향의 정당들로, 어떤 식으로든 \\"극우\\"가 힘을 얻지 못하도록 자신들이 동력을 얻어야 한다고 믿는 정당들의 집단입니다. 이 여러 집단의 일부 당 관계자들이 어떤 변명을 내세우든, 많은 이들은 이 정당들을 나라를 보는 보다 공통적인 방식으로 봅니다. 대부분의 땅이 개발되지 않아 \\"대기업\\"이 전통적인 의미에서는 사실상 존재하지 않기 때문입니다."
 LKT_focus_FPP_political_plan: "FPP 정치 계획"
 LKT_focus_FPP_political_plan_desc: "농민 노동당을 기반으로 하는 농민 진보당은 농민의 나라를 위해 민주사회주의 원칙이라는 사상을 사용하고 있습니다. 본질적으로 주된 관심을 산업 노동자에 두는 대신, 농업 노동자의 처우 개선에 초점을 맞출 것입니다. 우리나라 경제의 구성을 고려하면 그들이 선거에서 승리한 것도 놀랄 일이 아닙니다."
 LKT_focus_american_asylum_act: "\\"아메리칸\\" 망명법"
 LKT_focus_american_asylum_act_desc: "일부에서 AAA법이라 부르는 이 법은 사실상 준개방 국경 정책입니다. 기본적으로 옛 공화국의 영토에서 오랜 기간 살았음을 증명할 수 있는 이들에게 이 나라에서의 망명이 허용됩니다. 동부의 자유의 여신상 주위에서 쓰이는 표어를 이렇게 응용한 것은 사람들을 우리나라로 불러들이고, 우리가 채울 사람보다 더 많이 만들어내는 듯한 일자리를 채움으로써 경제를 성장시키는 훌륭한 방법입니다."
 LKT_focus_expanded_health_services: "의료 서비스 확대"
 LKT_focus_expanded_health_services_desc: "의료 역량을 개선하고 합리적인 시간 내에 누구에게나 닿을 수 있게 하면 생존율이 보장되고 시민들의 전반적인 건강이 증진될 것입니다."
 LKT_focus_fine_tuning_industrial_regulations: "산업 규제 미세 조정"
 LKT_focus_fine_tuning_industrial_regulations_desc: "우리의 경제 구성은 산업에 크게 의존하지 않지만, 여러 나라의 시민들을 억누르거나 아예 해를 끼친 일부 골치 아픈 규제를 조정하고 선제적으로 철폐함으로써 앞서 나갈 수 있습니다."
 LKT_focus_more_for_more_act: "더 많이 더 많은 법"
 LKT_focus_more_for_more_act_desc: "이 자금 지원 사업은 농업 관행을 더 효율적으로 간소화하는 동시에 새로운 농장과 관련 산업의 건설을 장려할 것입니다. ‘'더 많이 더 많은’이라는 말은 장기적으로 농업에 종사하는 사람은 줄어들지만 같은 종류의 농민들은 여전히 참여할 수 있다는 사실을 반영한 것입니다."
 LKT_focus_farmer_jims_research_emporium: "농부 짐의 연구 상점"
 LKT_focus_farmer_jims_research_emporium_desc: "농업 연구 상점은 새로운 세대의 농민을 길러내는 데 도움이 될 뿐 아니라 농산물을 더 잘 만들기 위한 연구 시설로도 겸용할 수 있습니다."
 LKT_focus_steeled_veins_act: "강철 혈관법"
 LKT_focus_steeled_veins_act_desc: "현대 경제와 구조물의 핵심 기둥인 강철을 만드는 생명의 피, 철광석이 바로 우리 발밑에 있습니다. 안정적이고 기능적인 경제를 원한다면 흔히 요구되는 이 자원을 확보할 수 있도록 투자해야 합니다."
 LKT_focus_LAS_political_plan: "LAS 정치 계획"
 LKT_focus_LAS_political_plan_desc: "라코타 농업 협회는 농업 정책을 현대화하는 동시에 정부를 줄여 국민 자신에게 더 많은 권력을 돌려주는 방법을 모색하는 집산주의 운동입니다."
 LKT_focus_asylum_experiment: "망명 실험"
 LKT_focus_asylum_experiment_desc: "우리는 우리의 땅과 농장, 그리고 나라 자체를 사람으로 채우고자 합니다. 따라서 가장 좋은 망명 수용 방식을 모색하고, 이러한 치명적인 부족분을 메우기 위해 무엇이든 해야 합니다."
 LKT_focus_improving_farming_methods: "영농 방식 개선"
 LKT_focus_improving_farming_methods_desc: "식량 생산과 같은 기본적인 경제적 필요를 개선하는 데 투자하는 것은 배경에 관계없이 모든 개인에게 이익이 됩니다. 따라서 식량 공급을 개선하기 위해 영농을 어떤 방식으로든 개선할 방법을 모색할 것입니다."
 LKT_focus_mechanized_agriculture_union: "기계화 농업 연합"
 LKT_focus_mechanized_agriculture_union_desc: "산업과 농업이라는 경제 부문을 통합함으로써, 이 부문들이 서로의 발전 없이는 기능할 수 없다는 상호적 선례를 세웁니다. 따라서 진정으로 평등한 사회를 이루려면 상호 성장과 발전이 보장되어야 합니다."
 LKT_focus_local_farming_initiatives: "지역 영농 사업"
 LKT_focus_local_farming_initiatives_desc: "식량 안보에 가장 큰 문제는 보급선입니다. 상품을 대량으로 생산할 수 있어도 가게 선반에 닿기 전에 상해 버린다면 아무 의미가 없습니다. 이를 염두에 두고, 식료품의 장거리 운송 필요성을 줄이도록 지역 개발을 더 장려할 것입니다. 이는 품목당 가격을 개선하고 국민이 필요한 데 쓸 수 있는 가용 자금을 늘릴 것입니다."
 LKT_focus_more_ways_to_work_the_land: "땅을 일구는 더 많은 방법"
 LKT_focus_more_ways_to_work_the_land_desc: "농업만으로는 한계가 있으며 현대 농업 방식의 요구는 곧 우리가 땅을 제대로 훑어 광물 자원을 찾아야 한다는 뜻입니다. 따라서 전국적으로 균형 잡힌 지질 조사와 채굴 작업, 그리고 새로운 가공 시설의 건설이 우리나라를 현대에 전례 없는 높이에 올려놓을 것입니다."
 LKT_focus_the_land_of_opportunity: "기회의 땅"
 LKT_focus_the_land_of_opportunity_desc: "우리의 땅은 넓고 비어 있으며 공동체가 번성하고 함께 일하기에 무르익었습니다. 더 나은 내일을 찾는 이들을 환영하는 방침을 세웁시다."
 LKT_focus_PNP_political_plan: "PNP 정치 계획"
 LKT_focus_PNP_political_plan_desc: "국가 보존당은 꽤 표준적인 녹색당입니다. 보다 전통적인 녹색당에 비해 타협적이긴 하지만, PNP는 현대화를 추구하는 동시에 나라의 자연미가 온전히 유지되도록 하고자 합니다."
 LKT_focus_building_tall_not_wide: "넓게 말고 높게 짓기"
 LKT_focus_building_tall_not_wide_desc: "새로운 형태의 공장 효율성을 연구함으로써, 그 과정에서 너무 많은 땅을 소모하지 않고도 사회의 수요를 따라갈 방법을 함께 찾을 수 있습니다."
 LKT_focus_stable_economics: "안정적 경제"
 LKT_focus_stable_economics_desc: "경제 안정에 집중하여, 공장과 기타 경제 부문의 효율성 사이에서 균형을 찾는 동시에 달라진 일자리 시장을 보완할 방법도 모색해야 합니다. 따라서 사회 서비스와 경제 계획 사업에 대한 투자를 개선해야 합니다."
 LKT_focus_local_food_producers: "지역 식량 생산자"
 LKT_focus_local_food_producers_desc: "LFP 프로그램은 지역 주민을 먹여 살리도록 설계된 소수의 농장을 설립합니다. 식량 비용을 크게 낮추고 해외 수출입보다 국내 지출을 장려합니다."
 LKT_focus_sufficient_tech_investments: "충분한 기술 투자"
 LKT_focus_sufficient_tech_investments_desc: "우리나라의 기술 부문은 거의 없는 것이나 다름없습니다. 하지만 상당한 투자를 할 자원은 있으므로, 적어도 일자리의 다양성과 추가로 활용할 수 있는 자원을 모두 갖출 수 있습니다."
 LKT_focus_domestic_arms_production_efforts: "국내 무기 생산 노력"
 LKT_focus_domestic_arms_production_efforts_desc: "우리의 땅과 국민을 지킬 수 있는 능력은 오직 상비군의 능력에 달려 있습니다. 가까운 시일 내에 아무 일도 일어나지 않을 것처럼 보이지만, 시작부터 아무것도 없는 것은 어떤 의미로도 계획이라 할 수 없습니다."
 LKT_focus_eco_extraction_efforts: "친환경 채굴 노력"
 LKT_focus_eco_extraction_efforts_desc: "자원 채굴 수단을 정밀하게 조정하고 정제함으로써, 방대하고 다양한 자원 풀을 확보할 수 있습니다. 그러나 채굴 작업에 대한 우리 스스로의 절제 때문에 직접적인 양은 크게 제한될 것입니다. 하지만 기술이 발전함에 따라 더 적은 것으로 더 많은 것을 얻는 수단을 더욱 발전시키기를 희망합니다."
 LKT_focus_RBP_political_plan: "RBP 정치 계획"
 LKT_focus_RBP_political_plan_desc: "장미 덤불당은 노동자의 권리를 증진하고 진보적 산업화 노선을 통해 나라를 전반적으로 앞으로 나아가게 하려 합니다. 경제 발전과 사회 발전 사이에 더 많은 결합을 만들고자 합니다. RBP는 경영자와 노동자 사이의 안정과 번영을 보장하기 위해 할 수 있는 모든 일을 할 것입니다."
 LKT_focus_revamped_corporate_taxes: "법인세 개편"
 LKT_focus_revamped_corporate_taxes_desc: "특히 더 표준화된 법인세율을 중심으로 세법을 정비함으로써, 안정적인 수입원을 확보하고 세금 부담의 더 많은 부분을 일반 납세자가 아닌 기업 및 사무 부문 주체에게 옮길 수 있습니다."
 LKT_focus_education_for_all: "모두를 위한 교육"
 LKT_focus_education_for_all_desc: "교육 체계와 모든 시민이 우리를 둘러싼 세계의 지식을 습득할 수 있는 능력을 대폭 확장합니다. 이를 통해 국민이 더 많이 교육받고 기준이 점점 더 높아지면서 자연스러운 이익을 거둘 수 있습니다."
 LKT_focus_fixing_our_ore_deal: "광석 문제 바로잡기"
 LKT_focus_fixing_our_ore_deal_desc: "철과 강철은 콘크리트 다음으로 모든 경제를 떠받치는 현대의 기둥입니다. 우리 스스로 오래 버티려면 자체적인 강철 보급선을 만드는 데 상당히 투자해야 합니다. 우리는 사방이 미지로 둘러싸여 있으니, 적어도 한 가지만큼은 확실히 알도록 합시다."
 LKT_focus_from_fields_to_cities_act: "들판에서 도시로 법"
 LKT_focus_from_fields_to_cities_act_desc: "농촌과 도시 중심지 모두에서의 전반적인 개발은 일자리 시장의 전반적이고 다양한 확대와 시민들에게 제공되는 일자리의 질 향상을 가능하게 합니다."
 LKT_focus_from_it_sector_developments: "IT 부문 발전"
 LKT_focus_from_it_sector_developments_desc: "작지만 자립적인 IT 또는 기술 부문을 갖추는 것은 경제 구성을 제대로 다각화하려는 노력을 지속하는 데 가장 큰 도움이 될 것입니다."
 LKT_focus_supplying_our_military_needs: "군사적 필요 충족"
 LKT_focus_supplying_our_military_needs_desc: "민간이든 군이든 기본적인 필요는 언제나 충족되어야 합니다. 외국의 어떠한 침략으로부터도 우리를 방어하려면, 군수 생산이 우리의 필요에 맞게 실현 가능하도록 몇몇 공장을 세워야 합니다."
 LKT_focus_new_lakotan_nationals_parties: "신 라코타 민족주의자들, 정당들"
 LKT_focus_new_lakotan_nationals_parties_desc: "사회주의 경제 사상의 부상, 옛 공화국의 갑작스럽고 폭력적인 붕괴, 그리고 우리나라가 차지하고 있는 변하지 않고 손대지 않은 땅. 이것들은 영광스러운 우리나라의 시민 여러분이 우리 중 하나에게 투표해야 하는 이유의 일부에 불과합니다. 신 라코타 민족주의자들입니다! 우리가 벼려 낸 새로운 정체성을 외세의 간섭과 마르크스주의, 심지어 마오주의 이념으로부터 자유롭게 지키는 일에 함께하십시오. 오늘 투표하여 본분을 다하십시오!"
 LKT_focus_YIP_political_plan: "YIP 정치 계획"
 LKT_focus_YIP_political_plan_desc: "YIP, 곧 젊은 산업가당은 현대화에 집중하고 번영을 정책의 최우선에 두는 정당입니다. 일부에서는 그들이 단지 망토를 두른 과두 지배층에 불과하다고 우려하지만, 당내 다수는 전통적인 정치적 진흙탕 싸움에 응하기보다 계획된 사업을 보여주고 증명하는 데 집중합니다."
 LKT_focus_sponsored_immigration: "후원 이민"
 LKT_focus_sponsored_immigration_desc: "우리의 땅은 황량하고 시민은 적으므로, 더 나은 삶을 찾는 새로운 이주민들을 데려와야 합니다. 채워지기를 기다리는 빈 일자리 시장과 눈길이 닿는 곳까지 정착할 수 있는 땅. 이것이 이 새로운 개척자들에게 하는 우리의 약속입니다."
 LKT_focus_recruiting_talent: "인재 영입"
 LKT_focus_recruiting_talent_desc: "인구 수를 늘리는 또 다른 방법은 숙련 노동자들에게 기회를 제공하는 것입니다. 더 나은 임금과 생활 환경은 언제나 좋은 유인책입니다."
 LKT_focus_south_munitions: "남부 군수품"
 LKT_focus_south_munitions_desc: "군수품의 지역 생산 사슬을 확보하면 우리 군인들이 우리에 맞서 도사리는 모든 위협에 대처할 수 있게 될 것입니다."
 LKT_focus_central_industries: "중앙 산업"
 LKT_focus_central_industries_desc: "국민 자체를 부양하지 않고서는 군대를 부양할 수 없습니다. 따라서 일자리를 위한 이동 필요를 더 잘 수용하도록 산업 개발을 집중시킬 것입니다."
 LKT_focus_bismarck_bombs: "비스마르크의 폭탄"
 LKT_focus_bismarck_bombs_desc: "북부 평원에 더 많은 군수 공장을 두면, 만일의 사태가 발생하더라도 부수적 피해를 제한하면서 더 휘발성이 높은 물질을 다룰 수 있게 될 것입니다."
 LKT_focus_promoting_human_resources: "인적 자원 증진"
 LKT_focus_promoting_human_resources_desc: "들판은 수확하기에 무르익었고 사람들도 마찬가지입니다. 농업 생산과, 이를 들판에서 전국의 식탁으로 옮기는 사람들에게 인센티브를 줌으로써, 이민 정책의 표적 개발은 물론 이를 위한 경제적 지원도 보장해야 합니다."
 LKT_focus_CDS_political_plan: "CDS 정치 계획"
 LKT_focus_CDS_political_plan_desc: "지리적 민족주의와 확고한 고립주의. 이 두 기둥이 \\"협회\\"의 핵심 가치를 떠받치고 있으며, 많은 이들이 혼란스러워하는 점이기도 합니다. 첫째, \\"지리적 민족주의자\\"가 되는 것이 대체 무엇이며, 둘째, 애초에 개발된 것이 거의 없는 우리에게 고립주의가 어떻게 도움이 될 수 있는지 말입니다. 어쨌든 농약 살포기 협회는 선거에서 승리를 거머쥐며 앞으로 돌진합니다."
 LKT_focus_learning_social_values: "사회적 가치 배우기"
 LKT_focus_learning_social_values_desc: "우리 사회는 국민이 무엇을 우리 자신의 것으로 지켜야 할지 알지 못하기 때문에 엉망이 되었습니다. 가족, 국가, 그리고 우리가 사는 땅의 정신은 모두 더 안정적이고 정의로운 사회를 보장하고 증진하기 위한 핵심 가치입니다."
 LKT_focus_character_creation_programs: "인성 형성 프로그램"
 LKT_focus_character_creation_programs_desc: "교육과 병역의 일부를 통합한 자원 및 의무 프로그램을 혼합하여, 많은 시민과 미래 세대는 책임과 의무에 대한 이해를 갖추게 될 것입니다. 이는 나라뿐 아니라 자기 자신과 가족, 그리고 소중한 이들에 대한 것이기도 합니다."
 LKT_focus_supply_chains: "공급망"
 LKT_focus_supply_chains_desc: "우리나라는 넓고 대체로 평탄하며 전반적으로 개발이 상당히 덜 된 나라입니다. 나라를 뒷받침할 강하고 유연한 보급선을 만들기 위해 최선을 다해야 합니다."
 LKT_focus_domestic_families_act: "국내 가족법"
 LKT_focus_domestic_families_act_desc: "DFA는 대가족을 장려하고 실제로 보조하여 국내 인구 증가를 촉진하기 위해 설계된 예산 패키지입니다. 우리의 문화적 기준에 맞는 외국 인재를 찾기 어려울 수 있으므로, 적은 인구가 우리 자신의 생존에 결정적인 요인이 되는 일이 결코 없도록 해야 합니다."
 LKT_focus_encouraging_favorable_migrants: "우호적 이민자 장려"
 LKT_focus_encouraging_favorable_migrants_desc: "우리는 나라와 시민에게 필요한 인재와 기술을 살피고 찾아야 합니다. 우리의 생존은 오직 우리의 능력에 의해서만 제한되므로, 우리가 가질 수 있는 바로 그 능력을 끌어올리도록 힘써야 합니다."
 LKT_focus_increased_military_investments: "군사 투자 증대"
 LKT_focus_increased_military_investments_desc: "우리 군인들이 우리 땅에 닥칠 수 있는 어떠한 적 병력에도 대비하여 장비를 갖추고 준비되어 있도록 해야 합니다."
 LKT_focus_LGF_political_plan: "LGF 정치 계획"
 LKT_focus_LGF_political_plan_desc: "많은 이들이 부르는 황금 들판 연맹은 이길 것이라고 믿은 이가 많지 않은 정당이지만, 우리는 지금 여기에 있습니다. 애초에 이런 정당이 어떻게 승리했는지 의아해하는 이가 많지만, 이토록 불확실한 시기에는 할 수 있는 일이 거의 없는 듯합니다. 나쁜 것보다 좋은 것이 더 많기를 바랄 뿐입니다."
 LKT_focus_improved_food_production: "식량 생산 개선"
 LKT_focus_improved_food_production_desc: "국민을 위한 식량을 확보하면 국내 성장과 사회 안정이 촉진됩니다."
 LKT_focus_increasing_industrial_base: "산업 기반 확대"
 LKT_focus_increasing_industrial_base_desc: "산업 역량을 키우면 경제를 다각화하고 전반적인 건전성을 개선하며, 국경을 맞댄 이웃 나라들에서 찾을 수 있는 것보다 더 많은 기회를 시민들에게 제공할 수 있습니다."
 LKT_focus_local_military_production: "지역 군수 생산"
 LKT_focus_local_military_production_desc: "지역 군수 생산에 투자하면 우리 군대를 위한 장비를 확보할 수 있고 군대의 쇠퇴를 막을 수 있습니다. 그러나 탐욕과 시기의 눈으로 우리 땅을 노리는 야만인들로부터 진정으로 우리를 방어하려면 이에 대해 더 깊이 살펴보아야 합니다."
 LKT_focus_increasing_lawful_order: "법질서 강화"
 LKT_focus_increasing_lawful_order_desc: "경찰 및 보안 서비스 예산을 늘림으로써 모든 종류의 범죄를 추적할 수 있습니다. 이를 통해 기업 주체는 물론 법을 지키는 시민들 속에 섞여들 수 있는 외국의 간섭자들도 통제할 수 있습니다."
 LKT_focus_military_education_act: "군사 교육법"
 LKT_focus_military_education_act_desc: "MEA는 군 조직의 지침에 맞추어 교육을 표준화하는 법입니다. 더 이상 지식인들이 우리 사회의 토대를 침식하는 떠들썩한 사상으로 청년들의 정신을 오염시키지 못할 것입니다. 이제는 의무, 명예, 용기, 존중, 희생입니다. 고향과 가족, 그리고 모든 시민의 마음과 생각 속에 소중히 간직된 이들을 위하여."
 LKT_focus_self_mobilization: "자가 동원법"
 LKT_focus_self_mobilization_desc: "자가 동원법은 이를테면 \\"4분의 1 태세\\"라 할 만한 방식으로 국가와 시민을 동원하기 위한 종합 경제 계획입니다. 이는 경제를 더 효율적으로 개편하고, 실제 동원에 대비해 선제적으로 더 많은 사람을 고용하며, 우리에 대한 적대적 침입의 필요에 대비해 국민이 정신적, 사회적으로 준비되도록 징병 노력을 강화하는 것을 의미합니다."
 LKT_focus_HOY_political_plan: "HoY 정치 계획"
 LKT_focus_HOY_political_plan_desc: "옐로스톤 가문은 \\"현대 군주제주의 운동\\"이라는 더 넓은 세계적 현상의 일부입니다. 이 일반적이고 다소 다양한 정치 운동에는 단 하나의 주요 교리가 있는데, 영광은 혈통이 아니라 투표에 있다는 것입니다. 이는 투표 절차를 유지하고 다듬어 더 널리, 더 유연하게 만드는 것으로 해석됩니다. 18세까지의 보통 선거권, 후보자에 대한 순위 선택 투표, 선출직을 직함으로 바꾸는 것 등이 그 예입니다. 이는 대통령이 이제 왕이 되거나 대표가 이제 영주가 되는 식을 의미합니다. 많은 이들이 혼란스러워하지만 대부분은 단지 국가의 공무원이라는 이유만으로 공작이나 남작 같은 존재가 된다는 발상에 서서히 설득되어 가고 있습니다."
 LKT_focus_office_titles_act: "관직 직함법"
 LKT_focus_office_titles_act_desc: "정부 관직을 중심으로 봉건적 직함을 표준화하면, 충분히 열심히 일하면 누구든 왕자나 공주가 될 수 있다는 것을 사람들에게 보여줄 것입니다."
 LKT_focus_expanding_mining_operations: "채굴 작업 확대"
 LKT_focus_expanding_mining_operations_desc: "우리나라가 실제로 자립할 수 있도록 해야 합니다. 따라서 우리가 심각하게 부족한 자원의 광물 채굴과 관련된 채굴 작업에 투자해야 합니다."
 LKT_focus_farmers_primacy_act: "농민 우선법"
 LKT_focus_farmers_primacy_act_desc: "우리의 식량 안보는 안정된 경제를 만드는 유일한 길입니다. 인구가 너무 적기 때문에 인구 증가를 장려하기 위해 할 수 있는 모든 일을 해야 하며, 식량은 그 최선의 방법 중 하나입니다."
 LKT_focus_expanding_immigration_efforts: "이민 노력 확대"
 LKT_focus_expanding_immigration_efforts_desc: "세계의 정세는 줄타기와도 같습니다. 어떤 나라는 좋고, 어떤 나라는 괜찮고, 또 어떤 나라는 그저 나쁩니다. 우리는 이웃 나라 사람들이 우리가 더 나은 나라 중 하나임을 알도록 노력해야 합니다. 이민을 장려하면 일자리 시장이 안정되고 심각하게 부족한 지역의 개발이 촉진됩니다."
 LKT_focus_improving_education_standards: "교육 수준 향상"
 LKT_focus_improving_education_standards_desc: "상품과 서비스를 혁신하고 생산하는 우리의 능력이 가능한 한 낭비 없이 이루어지도록 교육 수준을 높여야 합니다."
 LKT_focus_national_economic_investments: "국가 경제 투자"
 LKT_focus_national_economic_investments_desc: "경제를 다각화한다는 것은 국가 독립을 자연스럽게 확보하는 것입니다. 모든 것을 조금씩이라도 생산함으로써 이를 디딤돌 삼아 흥정하고 외교 관계와 무역 협정으로 나아갈 수 있습니다."
 LKT_focus_industrialization_question: "산업화 문제"
 LKT_focus_industrialization_question_desc: "많은 이들이 \\"그레이트플레인스 주\\"라고 부르는, 우리가 통제하는 주들의 상당 부분은 옛 공화국에서 가장 덜 개발된 땅이며 확실히 우리가 가진 새로운 공화국 내에서도 그렇습니다. 하지만 우리에게는 새 정부와 원하는 대로 할 수 있는 새 출발이 있습니다. 따라서 우리는 스스로에게 한 가지 질문을 던져야 합니다. 산업화할 것인가, 말 것인가."
 LKT_focus_the_great_northern_railway: "그레이트 노던 철도"
 LKT_focus_the_great_northern_railway_desc: "한때 벌링턴 노던 산타페 철도의 작은 톱니바퀴에 불과했던 이 철도는 이제 다시 독립된 사업이 되었습니다. 우리가 이용할 수 있는 제한된 기반시설을 재편함으로써, 철도 역사에서 사라진 깃발을 다시 세울 수 있을 뿐 아니라 성장하는 우리 기반시설을 개선하고 자금을 댈 수도 있습니다."
 LKT_focus_northern_bypass: "북부 우회로"
 LKT_focus_northern_bypass_desc: "캐나다 국경을 따라 이어지는 접경 노선은 몬태나에서 노스다코타로 물자를 수송하는 대체 경로를 제공할 것입니다. 무역 협정과 관련한 수송 수요의 가능성은 말할 것도 없습니다."
 LKT_focus_great_western_mainline: "그레이트 웨스턴 간선"
 LKT_focus_great_western_mainline_desc: "몬태나를 거쳐 와이오밍으로 구불구불 이어지는 노선은 서부 지역의 여러 구릉지와 산악 지형을 가로질러 막대한 화물을 운송할 수 있게 해줄 것입니다."
 LKT_focus_the_southern_extension: "남부 연장선"
 LKT_focus_the_southern_extension_desc: "캔자스로 노선을 연결하면 다코타 최북단에서 고립된 편인 남쪽 주에 이르기까지 물자를 실어 나를 수 있으며, 이에 따라 우리 공화국 내 모든 주 사이의 협력이 한층 증진됩니다."
 LKT_focus_completing_the_network: "연결망 완성"
 LKT_focus_completing_the_network_desc: "여러 전략적 위치에 우회로를 만들어 투자를 마무리하면, 자연재해나 인재, 혹은 기존 노선 하나 이상을 손상시킬 수 있는 어떤 일이 발생하더라도 대체 경로를 확보할 수 있습니다."
 LKT_focus_modern_agrarian_economy: "현대 농업 경제"
 LKT_focus_modern_agrarian_economy_desc: "우리 땅은 넓고 비옥하며 풍요롭습니다. 현대 산업주의의 파괴적이고 유독한 성격 아래 이 모든 것을 그냥 낭비하게 둔다면 정말 안타까운 일입니다. 우리는 경제적 자립을 얻는 더 단순하면서도 더 세련된 수단으로 돌아가야 합니다. 이 땅이 그 열쇠가 될 것이며, 이 땅의 모든 곳이 세계 전체를 먹여 살릴 농장이 될 것입니다."
 LKT_focus_northern_farms_adaptation_act: "북부 농장 적응법"
 LKT_focus_northern_farms_adaptation_act_desc: "NFAA는 북부 주의 농장과 농업 중심지에 투자하기 위한 법안입니다. 여기에는 투자와 자금 지원은 물론 겨울 적응 방식에 대한 훈련, 그리고 한겨울에도 농산물을 공급할 수 있는 잠재적으로 새로운 구조물과 수단이 포함됩니다. 온실과 가축을 위한 적절히 단열되고 난방되는 시설은 거의 일 년 내내 농사를 지을 수 있는 안정적인 수단이 된다는 뜻입니다."
 LKT_focus_centralia_farms_act: "센트럴리아 농장법"
 LKT_focus_centralia_farms_act_desc: "CFA는 우리나라 중부 주들의 농장을 공공과 민간 기업의 공동 주체 아래로 재편합니다. 이 법의 주된 목표는 성장의 균형을 이끌어내고 각 주의 역량에 따라 농산물의 다양성을 보장하는 것입니다. 국토의 거의 절반을 차지하는 가장 큰 구역이므로, 민간 부의 창출에 대한 공통된 이해관계와 식량 안보에 대한 공공의 이익 확보가 이 사업이 공동 사업인 이유입니다."
 LKT_focus_southern_farming_traditions: "남부 영농 전통"
 LKT_focus_southern_farming_traditions_desc: "우리나라 남부와 옛 공화국에서는 환금 작물을 재배하는 것의 중요성이 일종의 암묵적 전통이었습니다. 우리가 신생 국가라 할지라도, 이러한 환금 작물이 수출과 국내 가치 측면에서 지닌 중요성은 아무리 강조해도 지나치지 않습니다. 따라서 기후가 더 안정적인 남쪽의 캔자스 주가 이러한 환금 작물을 섞어 생산하는 데 더 힘쓰도록 조정할 것입니다."
 LKT_focus_targeted_mechanization_efforts: "표적 기계화 노력"
 LKT_focus_targeted_mechanization_efforts_desc: "모든 산업적 노력을 농업 부문의 증강에 집중함으로써, 생산성을 대폭 높이고 의지할 수 있는 적절히 다각화된 경제를 보장할 수 있습니다. 날씨나 전 지구적 현상이 우리를 해치려 들지 모르는 일이니까요."
 LKT_focus_bio_fuel_investments: "바이오 연료 투자"
 LKT_focus_bio_fuel_investments_desc: "교육 체계를 활용해 농업 경제의 이점을 다각화하고 개선합니다. 이제 우리의 자동차와 가정, 사업장에 동력을 공급하는 새로운 형태의 바이오 연료를 정제하고 탐구하는 방안을 살펴볼 수 있습니다."
 LKT_focus_the_farmers_tax_code: "농민 세법"
 LKT_focus_the_farmers_tax_code_desc: "세법을 전면 재작성하고 우리의 농업적 생산 수단을 보존한다는 선례를 중심으로 구성함으로써, 노동력의 안정성을 보장하고 우리나라의 미래 농장과 농민에 대한 투자를 도울 수 있습니다."
 LKT_focus_funding_general_education_improvements: "일반 교육 개선 자금 지원"
 LKT_focus_funding_general_education_improvements_desc: "예산을 교육에 전념하면 호기심과 필요 자체가 생겨남에 따라 우리의 기술적 필요를 발전시킬 미래 세대를 준비시키는 데 도움이 될 것입니다."
 LKT_focus_bio_fuel_engineering_institute: "바이오 연료 공학 연구소"
 LKT_focus_bio_fuel_engineering_institute_desc: "BFEI는 바이오 연료의 응용과 전반적인 효율성을 개선하는 데 전념하는 연구 및 고등 교육 시설입니다. 이 기관을 교육의 기둥으로 삼아 경제적 역량의 효율을 높일 것입니다."
 LKT_focus_skill_set_education_programs: "기술 역량 교육 프로그램"
 LKT_focus_skill_set_education_programs_desc: "SSEP는 시민들이 일생 동안 습득할 수 있는 일반 기술 역량을 더욱 다각화하고 개선하기 위한 자금 지원 사업입니다. 이를 통해 고용 노력이 크게 개선되고 경제 성장과 발전에 대한 더 안정적이고 균형 잡힌 접근이 이루어지기를 기대합니다."
 LKT_focus_lakotan_development_fund: "라코타 개발 기금"
 LKT_focus_lakotan_development_fund_desc: "예산의 특정 부분을 배정함으로써, 우리의 경제 기반을 균형 있게 하고 더 잘 성장시킬 표적 개발이 이루어지도록 할 수 있습니다."
 LKT_focus_the_fifth_revolution: "제5차 산업 혁명"
 LKT_focus_the_fifth_revolution_desc: "새천년이 시작될 무렵 산업화는 두 번의 큰 변화를 거쳤습니다. 이어서 세 번째는 자동화 요소의 부상이었고 네 번째는 상상 이상의 AI와 컴퓨터 통합의 부상이었습니다. 이제 우리는 다섯 번째 혁명의 무대를 마련합니다. 들판의 나라이자 산업이라고는 아무것도 없다시피 한 우리가 극동 지역의 근대화 부상에도 맞설 혁명입니다."
 LKT_focus_rushmore_revival: "러시모어 부흥 프로젝트"
 LKT_focus_rushmore_revival_desc: "다코타는 우리가 나라를 위해 선택한 더 중립적이고 새로운 정체성 이름의 상징일 뿐 아니라, 우리가 차지한 땅의 핵심 정체성의 상징이기도 합니다. 따라서 이 두 주를 나라 전반의 산업화를 위한 우리의 새로운 혁명 정책의 최우선 대상으로 삼아야 합니다."
 LKT_focus_rocky_roads_no_more: "험한 길은 이제 그만 프로젝트"
 LKT_focus_rocky_roads_no_more_desc: "로키산맥과 맞닿아 있거나 사실상 산맥의 일부 구역 전체를 차지하는 몬태나와 와이오밍 주는 전략적으로 중요합니다. 이 주들은 산맥을 통과하는 연결로로서의 역할을 하는 한편, 지형 때문에 개발에 어려움을 안겨줍니다. 따라서 이 주들이 뒤처지지 않도록 기반시설과 경제 발전에 대한 포괄적인 투자를 해야 합니다."
 LKT_focus_kansas_city_kerosene: "캔자스시티 등유 프로젝트"
 LKT_focus_kansas_city_kerosene_desc: "캔자스와 네브래스카 주에는 개발되지 않은 잠재력이 있습니다. 이 주들에는 기술적으로 텍사스에서 이어지는 눈에 띄는 석유 및 천연가스전이 있습니다. 이 자원을 활용해 우리나라를 산업주의의 최전선으로 이끌 수 있습니다. 조율된 채굴 노력과 경제 투자를 통해 위대한 성과를 기대할 수 있을 것입니다."
 LKT_focus_rare_earth_energy_act: "희토류 에너지법"
 LKT_focus_rare_earth_energy_act_desc: "희토류 원소 광산을 개발하고 국내 에너지 역량을 확대하면, 산업 기반의 성장을 이어갈 수 있을 뿐 아니라 외교적 노력을 위한 협상 카드도 확보할 수 있습니다."
 LKT_focus_project_nebraska_namesake: "네브래스카 명명 프로젝트"
 LKT_focus_project_nebraska_namesake_desc: "네브래스카 주에는 진정한 규모로 탐사되지 않았거나, 존재를 알면서도 단순히 손대지 않은 전략 자원이 많습니다. 따라서 이러한 전략 자원이 산업화에 동력을 공급할 뿐 아니라 우리의 대외 정치 자본도 높이도록, 포괄적인 채굴 및 조사 사업을 시작할 것입니다."
 LKT_focus_business_tax_reforms: "기업 세제 개혁"
 LKT_focus_business_tax_reforms_desc: "산업 기반이 계속 커짐에 따라 우리의 경제 구성은 점점 더 다양해지고 있습니다. 따라서 다양한 기업 부문의 세법을 면밀히 검토하고 개편하여 법의 공정성과 정당성을 보장해야 합니다. 이를 통해 시민들이 스스로 창업하거나 자기 돈을 저축하여 원하는 방식으로 경제에 기여할 수 있는 자연스러운 수단을 늘릴 수 있을 것입니다."
 LKT_focus_peoples_tax_reforms: "국민 세제 개혁"
 LKT_focus_peoples_tax_reforms_desc: "기업이 잘되는 것은 좋지만, 그 기업들은 국민 자신이 잘되는 만큼만 잘됩니다. 따라서 세법이 점점 산업화되는 시민층을 부양하기에 단순하고 현대적이며 합리적이 되도록 해야 합니다."
 LKT_focus_establishing_lakotan_institute_of_technology: "라코타 공과대학"
 LKT_focus_establishing_lakotan_institute_of_technology_desc: "LIT의 설립은 연구개발 노력을 집중화하는 데 있어 획기적인 진전입니다. 물적 자원과 인적 자원을 모두 더 한곳에 모을 수 있을 뿐 아니라, 이 기관은 알려진 과학을 누구나 할 수 있는 한 최선으로 발전시키고 개선하도록 설계되었습니다."
 LKT_focus_national_investment_progrmas: "국가 투자 프로그램"
 LKT_focus_national_investment_progrmas_desc: "경제가 궤도에 오르고 상황이 나아지고 있는 지금, 우리는 이제 마음을 가라앉히고 꾸준한 항로를 정할 수 있습니다. 예산 프로그램 전반에 걸친 일반적인 투자는 우리 국민이 현대의 끊임없이 변화하는 경제에 맞춰 전문화하고, 성장하고, 적응할 수 있게 해줄 것입니다."
 LKT_focus_a_new_economy: "새로운 경제"
 LKT_focus_a_new_economy_desc: "경제가 자리를 잡았으니 이제 정치에 집중할 수 있습니다. 전반적으로 우리는 내부 문제를 넘어 바깥을 바라보는 데 한 걸음 더 가까워졌습니다."
 LKT_focus_department_of_energy: "에너지부"
 LKT_focus_department_of_energy_desc: "경제를 갖추는 것은 좋은 일이지만, 실제로 동력을 공급하고 사용할 수 없다면 아무 의미가 없습니다. 따라서 당면한 이 문제를 해결하도록 라코타 에너지부를 설립할 것입니다."
 LKT_focus_fueling_agrarianism: "농본주의에 연료 공급"
 LKT_focus_fueling_agrarianism_desc: "국가 경제가 농업 우위인 만큼, 그러한 수요를 충족하도록 에너지 경제를 적응시키고 성장시켜야 합니다. 다행히 적절한 투자가 있으면 에너지 기반시설을 키울 필요는 없고, 연료가 그것을 더 필요로 하는 곳으로 얼마나 멀리 닿는지를 개선하기만 하면 됩니다."
 LKT_focus_fueling_tomorrows_economy: "내일의 경제에 연료 공급"
 LKT_focus_fueling_tomorrows_economy_desc: "우리의 수요는 방대하지만 우리의 땅과 자원은 그보다 더 방대합니다. 우리의 수요와 미래의 수요가 국내 수단으로 충족되도록 에너지 부문을 개발해야 합니다."
 LKT_focus_a_new_green_deal: "새로운 그린 딜"
 LKT_focus_a_new_green_deal_desc: "새로운 그린 딜, 즉 NGD는 현재와 바라건대 미래의 돌파구가 열어줄 가장 효율적이고 말 그대로 유일하게 진정한 녹색 에너지 생산 방식이 최대한 활용되도록 개발하고 보장하기 위한 종합 에너지 투자 계획입니다. 더 작고 효율적인 발전소, 사용후 연료 재활용 노력에 대한 제한적 투자. 가능한 모든 것을 아우릅니다."
 LKT_focus_finalizing_doe_capabilities: "에너지부 역량 완성"
 LKT_focus_finalizing_doe_capabilities_desc: "에너지 부문이 이제 경제적 필요에 맞게 정렬되었으니, 이 두 가지를 시너지로 결합시켜 우리가 만들어갈 미래로 나라를 나아가게 할 수 있습니다."
 LKT_focus_increased_funding_for_donr: "천연자원부 자금 증액"
 LKT_focus_increased_funding_for_donr_desc: "우리 발밑에 있는 천연자원을 확보하는 데 더 많이 투자함으로써, 더 자급자족적인 경제, 적어도 더 균형 잡힌 경제를 보장할 수 있습니다."
 LKT_focus_massive_investments: "대규모 투자"
 LKT_focus_massive_investments_desc: "모든 것을 확보하기 위해, 우리는 얻을 수 있는 한 최대한 많은 종류의 광물 자원을 확보하는 데 가능한 한 많이 투자할 것입니다."
 LKT_focus_need_by_need_investment_strategy: "필요 기반 투자 전략"
 LKT_focus_need_by_need_investment_strategy_desc: "우리의 채굴 노력은 주요 경제 노력을 보완해야 합니다. 따라서 수요를 통제하기 위해 필요에 따라 천연자원부에 투자할 것입니다."
 LKT_focus_iron_ore_revival: "철광석 부활법"
 LKT_focus_iron_ore_revival_desc: "우리의 철광석 매장지는 기껏해야 개발되지 않았고, 심지어 과거의 실수로 축소되기까지 했습니다. 그러나 이제 그렇지 않을 것입니다. 사우스다코타, 캔자스, 몬태나 등에 대한 투자를 통해 기존 작업을 확대하고, 환경 문제로 조기에 폐쇄되었던 캔자스의 광산 같은 옛 작업도 재개할 것입니다. 정화 작업 등에 비용이 다소 들 수 있지만, 상당한 철광석 생산은 현대 세계의 핵심 물자 중 하나인 강철의 건전한 국내 공급을 의미합니다."
 LKT_focus_bauxite_brawls_act: "보크사이트 쟁탈법"
 LKT_focus_bauxite_brawls_act_desc: "경제가 더 유연한 금속에 접근할 수 있게 되면 민간과 군사 용도 양쪽으로 진출할 수 있습니다. 따라서 에너지 소모가 많은 채굴지를 되살리고, 확대하고, 투자하는 것은 장기적으로 가치가 있을 것입니다."
 LKT_focus_precious_mines_act: "귀금속 광산법"
 LKT_focus_precious_mines_act_desc: "여러 주에 희토류(REE) 원소 매장지가 있습니다. 따라서 경제 구성에서 최고 수준의 다양성을 보장하기 위해 잠재적인 상업 규모로 작업을 개시하고 확대하는 데 투자할 것입니다. 결국 국내 물자가 많아질수록 해외의 관심도 커지게 마련입니다."
 LKT_focus_rubber_stamp_act: "고무 도장법"
 LKT_focus_rubber_stamp_act_desc: "우리는 국내 석유 생산량이 많습니다. 이 중 일부를 합성 화학물질과 고무 생산으로 전략적으로 재배분하여, 우리 땅에서 자원 다양성의 정점을 확보할 수 있습니다."
 LKT_focus_lakotan_military_development_board: "라코타 군사 개발 위원회"
 LKT_focus_lakotan_military_development_board_desc: "LMDB는 개발을 간소화하고 군사 역량을 강화하기 위해 설계되었습니다. 신경 써야 할 군이 사실상 두 개뿐임을 고려하면 간단한 일일 것입니다. 하지만 옛 공화국 해군 출신의 일부 인원들은 언젠가 라코타 해군을 창설하기를 바라고 있습니다. 그러나 지금은 육군과 공군이 전부입니다."
 LKT_focus_military_refinement: "군 정련"
 LKT_focus_military_refinement_desc: "시행착오와 물자 및 인력에 대한 막대한 투자, 그리고 시간 그 자체를 통해, 우리는 마침내 시민들과 그들의 가정에 대한 국방과 안보를 보장하는 적어도 하나의 견고한 군종을 창설했습니다."
 LKT_focus_lakotan_army_pay_standards: "라코타 육군 급여 기준"
 LKT_focus_lakotan_army_pay_standards_desc: "양질의 급여와 병사들이 자신뿐 아니라 고향의 사랑하는 이들까지도 돌볼 수 있는 능력을 보장하면 사기가 자연스럽게 오릅니다. 덤으로 이렇게 높아진 헌신은 훈련 수료율과, 그 훈련으로 배출할 수 있는 병사들의 질에까지 파급될 가능성이 높습니다."
 LKT_focus_establishing_arms_contractors: "무기 계약업체 설립"
 LKT_focus_establishing_arms_contractors_desc: "사실상 국방의 주 대들보를 떠받치기 위한 전담 무기 산업을 만드는 것이 가장 중요합니다. 따라서 병력에 양질의 무기가 안정적으로 공급되도록 자금을 확보할 것입니다."
 LKT_focus_sundance_war_college: "선댄스 전쟁대학"
 LKT_focus_sundance_war_college_desc: "전담 군사 교육 기관을 세움으로써, 미래의 부사관과 임관 장교 모두를 내일의 전장에 대비시킬 수 있습니다. 전술과 리더십, 책임의 위임을 훈련시킬 것입니다. 무엇보다 훌륭한 군인이라면 잘못될 수 있는 일은 대개 잘못된다는 점을 항상 이해해야 하므로 적응력을 가르칠 것입니다."
 LKT_focus_butte_testing_facilities: "뷰트 시험 시설"
 LKT_focus_butte_testing_facilities_desc: "전담 시험 및 연구개발 시설 단지를 만들면, 우리 병력의 지속적인 질적 향상을 보장하여 미래의 잠재적 분쟁에 대비할 수 있습니다."
 LKT_focus_research_mania: "연구 열풍"
 LKT_focus_research_mania_desc: "연구개발이 핵심입니다. 신형 무기와 탄약, 지원 장비의 개발에 막대한 투자를 하여, 어떤 방식으로든 우리를 해치려는 자들을 훨씬 뛰어넘는 병력의 질을 보장할 것입니다."
 LKT_focus_geneva_compliant_munitions: "제네바 \\"준수\\" 탄약"
 LKT_focus_geneva_compliant_munitions_desc: "물론 우리는 국제 사회의 눈에 좋게 보여야 하지만, 그렇다고 한계를 시험해 보지 못할 이유는 없습니다. 그렇지 않습니까?"
 LKT_focus_experiemental_weapons_platoon: "실험 무기 소대"
 LKT_focus_experiemental_weapons_platoon_desc: "EWP는 더 넓은 \\"실험 무기 군단\\"의 일부가 될 전담 부대입니다. 우리 육군의 이 하위 부문은 야전 시험을 돕고, 곤경에 처한 부대에 요청 시 필요한 지원을 제공할 지원 소대를 지정할 것입니다. 대부분 EWP는 무엇에든 맞서는 실험적 무기로 구성되며, 끊임없이 변하는 전장에서 육군의 요청에 따른 필요에 적응할 수 있습니다."
 LKT_focus_the_corps: "\\"군단\\""
 LKT_focus_the_corps_desc: "실험 무기 군단의 창설로 우리는 자금, 훈련, 시험 노력을 최대한 폭넓고 유연하게 지휘할 수 있게 됩니다. 이 새로운 연구개발 군단은 우리 땅의 모든 적으로부터 우리를 인도하고 방어하도록 도울 빛의 등대가 될 것입니다."
 LKT_focus_logistical_primacy: "병참 우선 학파"
 LKT_focus_logistical_primacy_desc: "전쟁 수행의 병참에 노력을 집중함으로써, 상황이 정말로 그런 타락으로 치닫는다면 순수한 소모전으로 적을 오래 버텨낼 수 있습니다."
 LKT_focus_bread_and_butter_doctrine: "빵과 버터 교리"
 LKT_focus_bread_and_butter_doctrine_desc: "경제적 인식을 생존을 위한 분쟁에 맞게 재편함으로써, 배급이라는 선제적 조치와 전략적으로 배치된 적절한 식량 저장고는 우리 군대뿐 아니라 모든 복구 노력에도 도움이 될 것입니다."
 LKT_focus_supply_heroes: "보급의 영웅들"
 LKT_focus_supply_heroes_desc: "보급이 없으면 총알은 날아가지 않습니다. 영웅이 된다는 것의 의미를 두고 따지기보다, 누구든 자신의 분야에서 뛰어난 능력을 발휘하고 사람들이 필요로 하는 영웅이 될 수 있다는 데에는 모두 동의할 수 있습니다. 따라서 보급 병과를 장려하고 별도의 보급 및 병참 기반 훈련을 개설하여 보급 사슬과 그들이 지원하는 부대 사이의 결속을 극대화할 것입니다."
 LKT_focus_logistics_corps_training_programs: "병참 병과 훈련 프로그램"
 LKT_focus_logistics_corps_training_programs_desc: "군을 모든 계층에 개방한다는 것이 모두가 최전선의 보병이어야 한다는 뜻은 아닙니다. 그리고 \\"후방 근무자\\"가 반드시 최전선 보병의 사기를 떨어뜨리는 존재일 필요도 없습니다. 따라서 최전선의 결속, 보급선의 효율성, 전장에서의 전반적인 군사 효율성을 보장하기 위해 병참 병과에 새로운 훈련과 특화된 교리를 도입할 것입니다."
 LKT_focus_lakotan_air_force_training_improvements: "라코타 공군 훈련 개선"
 LKT_focus_lakotan_air_force_training_improvements_desc: "자격 기준을 적절히 표준화함으로써 전투 상황에서의 조종사 효율성 면에서 새로운 최정예를 확립하기를 기대합니다."
 LKT_focus_fighter_priority_structure: "전투기 우선 구조"
 LKT_focus_fighter_priority_structure_desc: "FPS 조직 개편 노력은 공군의 주된 기능을 전투기 계열 항공기를 중심으로 재편하는 것입니다. 훈련과 부대 편성은 지상 지원이나 일반 전략 폭격 지원보다 전투기의 우위를 보장할 것입니다. 우리가 소수 생산하는 항공기는 전투기가 있는 곳 어디서든 적 항공기의 방해를 받지 않고 비행할 수 있어야 합니다."
 LKT_focus_fighter_supremacy_doctrine: "전투기 우세 교리"
 LKT_focus_fighter_supremacy_doctrine_desc: "공군 교리를 더욱 전적으로 전투기 중심으로 발전시키는 것은 머리 위 하늘에 대한 완전하고 전면적인 통제를 보장하기 위한 것입니다. 따라서 폭격기나 지상 지원에서 부족한 점이 있더라도, 견제받지 않는 제공권으로 이러한 측면을 위한 자유로운 시험장을 확보할 수 있습니다."
 LKT_focus_ground_support_priority_structure: "지상 지원 우선 구조"
 LKT_focus_ground_support_priority_structure_desc: "GSPS 조직 개편 노력은 공군을 지상 지원형 항공기의 개발과 배치를 우선시하도록 재편할 것입니다. 이는 우리가 완전한 제공권 확보에 부족하더라도 공중에서 적을 치고 빠지며 적어도 전선의 안정을 보장할 수 있게 해줄 것입니다."
 LKT_focus_ground_support_supremacy_doctrine: "지상 지원 우세 교리"
 LKT_focus_ground_support_supremacy_doctrine_desc: "지상 지원형 항공기를 우선시하도록 공군 교리를 발전시키면 전선의 안정을 보장할 뿐 아니라 적이 장기간 싸울 능력을 빼앗을 것입니다. 조직적 타격만으로는 한계가 있지만, 적의 보급품과 장비를 파괴하면 적은 애초에 싸울 수가 없습니다."
 LKT_focus_strategic_bomber_priority_structure: "전략 폭격기 우선 구조"
 LKT_focus_strategic_bomber_priority_structure_desc: "SBPS 조직 개편 노력은 우리 공군이 적의 전투 의지를 분쇄할 수 있게 해줄 것입니다. 산업과 기반시설은 장기전의 경우 어느 나라든 반드시 지켜야 할 핵심 요소입니다. 따라서 이러한 전쟁 기계를 파괴하고 적이 우리를 해치려 시도할 수 있게 해주는 도로와 철도의 띠를 끊어놓을 전략 폭격기를 개발할 것입니다."
 LKT_focus_strategic_bomber_supremacy_doctrine: "전략 폭격기 우세 교리"
 LKT_focus_strategic_bomber_supremacy_doctrine_desc: "전략 폭격기급 항공기를 중심으로 공군 교리를 다듬음으로써, 우리와 싸울 적의 능력을 지워버릴 것입니다. 경제나 무기 산업이 없으면 적은 자국민을 무장시키거나 고용할 수 없습니다. 결국 전쟁이 빨리 끝나지 않을 수는 있어도, 우리 국민과 우리가 지키는 이 땅을 누구도 파괴하지 못하도록 할 것입니다."
 LKT_focus_clear_skies_for_all: "모두를 위한 맑은 하늘"
 LKT_focus_clear_skies_for_all_desc: "우리 공군의 정련과 개선은 모두가 볼 수 있도록 공개될 것입니다. 대중이 볼 수 있도록 조직적인 에어쇼와 훈련 행사를 장려하면, 우리나라에 앞으로도 오래도록 밝은 하늘이 있을 것임을 시민들에게 보장할 수 있습니다."
 LKT_focus_creating_a_real_navy: "진짜 해군 창설"
 LKT_focus_creating_a_real_navy_desc: "마침내 강에서 래프팅이나 하는 선장들이 아닌 진짜 해군을 창설할 수 있는 날이 왔습니다. 그러나 강은 넓은 바다와 전혀 다르기에 그 여정은 지루할 것입니다."
 LKT_focus_early_ship_construction_efforts: "초기 함선 건조 노력"
 LKT_focus_early_ship_construction_efforts_desc: "우리의 해군력은 결코 \\"최고 수준\\"이 되지 못할지도 모르지만, 최소한 바닥에서 시작할 수는 있습니다."
 LKT_focus_formalizing_naval_training_programs: "해군 훈련 프로그램 공식화"
 LKT_focus_formalizing_naval_training_programs_desc: "새로운 해안 해역의 환경적 도움을 받아 마침내 진짜 훈련 프로그램을 도입함으로써, 우리 해군 인력의 질이 어엿한 수준이 되도록 보장할 수 있습니다."
 LKT_focus_our_naval_priority: "우리의 해군 우선순위"
 LKT_focus_our_naval_priority_desc: "해군 발전에 새로운 우선순위를 둠으로써, 적어도 미래 세대가 그 위에 쌓아 올릴 수 있는 일종의 기준을 세웁니다."
 LKT_focus_naval_command_structure: "해군 지휘 구조"
 LKT_focus_naval_command_structure_desc: "LAF의 해군 병과는 좋게 말해야 농담이었고 나쁘게 말하면 처벌이었습니다. 그러나 새로운 수변 자산의 확보와 원양 함선 건조 노력의 시작과 함께, 우리는 이 농담을 진지하고 실체 있는 병과로 바꾸어야 합니다. 따라서 해군 우수성을 향한 미래의 진전을 촉진하고 확립하기 위해 LNCS, 즉 라코타 해군 지휘 구조를 공식화할 것입니다."
 LKT_focus_gulf_dry_docking_facilities: "걸프 건선거 시설"
 LKT_focus_gulf_dry_docking_facilities_desc: "함선 건조 노력을 확대하면 우리 해군에 적응하고 성장할 수 있게 됩니다."
 LKT_focus_mid_atlantic_shipping_investments: "중부 대서양 해운 투자"
 LKT_focus_mid_atlantic_shipping_investments_desc: "이 모든 영토를 아우르려면 해군 확장을 위한 지속적인 노력이 이루어져야 합니다."
 LKT_focus_beyond_the_plains: "평원 너머로"
 LKT_focus_beyond_the_plains_desc: "고향이 안정되고 번영하게 된 지금, 우리는 국경 너머를 생각해야 합니다. 확장을 추구하든 아니든 그것은 요점이 아닙니다. 다른 많은 이들이 자국의 국경 너머를 바라보고 있다는 이유만으로도 우리는 그 너머를 생각해야 합니다. 우리의 미래가 어떠할지 결정해야 합니다."
 LKT_focus_A_New_Destiny: "새로운 운명"
 LKT_focus_A_New_Destiny_desc: "천명은 상실되었고, 북아메리카 대륙의 이들은 이를 되찾으려 합니다. 우리는 그 땅에 도는 소문을 통해 이것이 사실임을 알고 있으며, 따라서 우리의 몫을 주장하고 정상에 오를 것입니다. 이는 동부나 서부의 이들이 아닌 우리가 마주해야 할 운명이기 때문입니다."
 LKT_focus_eyeing_the_borderlands: "접경 지대를 주시하다"
 LKT_focus_eyeing_the_borderlands_desc: "우리 운명의 시작은 우리 국경 밖으로의 첫걸음에서 시작됩니다. 따라서 우리 자신의 국경이 첫걸음을 내딛는 곳이 되도록 노력해야 합니다."
 LKT_focus_the_pacific_shores: "태평양 해안"
 LKT_focus_the_pacific_shores_desc: "우리는 태평양 해안선의 바닷바람 속에서 석양을 맞이할 것입니다. 적어도 서쪽은 동쪽보다 가야 할 거리가 짧습니다."
 LKT_focus_great_lakes_great_takes: "오대호, 위대한 쟁취"
 LKT_focus_great_lakes_great_takes_desc: "동쪽으로 확장하면 넓고 다양한 땅을 다루게 됩니다. 오대호 지역의 광대함을 이해하고 헤쳐 나갈 수 있도록 노력해야 합니다."
 LKT_focus_southern_summaries: "남부 개관"
 LKT_focus_southern_summaries_desc: "습지에서 산악 고지대에 이르기까지, 미국 남부 지역은 우리가 가장 통과하기 어려운 곳이 될 가능성이 높습니다. 따라서 이 미래의 땅을 확보하려는 동안 그러한 난관에 맞서기 위한 연습, 연구, 훈련이 필요합니다."
 LKT_focus_northeastern_needs: "북동부의 필요"
 LKT_focus_northeastern_needs_desc: "눈길이 닿는 곳마다 산과 숲입니다. 이 땅을 공략하려면 시간과 분명한 에너지가 필요할 것입니다."
 LKT_focus_manifesting_strength_for_our_destiny: "운명을 위한 힘의 현현"
 LKT_focus_manifesting_strength_for_our_destiny_desc: "우리는 준비하고 병력을 계속 증강해야 합니다. 우리가 만들어 나가고자 하는 운명은 때가 되면 우리의 것이 될 것이기 때문입니다."
 LKT_focus_operation_cascadian_calamity: "캐스케이디아 재앙 작전"
 LKT_focus_operation_cascadian_calamity_desc: "대륙 안보를 위한 우리의 위대한 성전이 시작됩니다. 우리 세력에 가장 가까운 캐스케이디아부터 시작할 것입니다. 산악 지형은 험난하겠지만 병사들에게 훌륭한 훈련장이 되어 줄 것입니다."
 LKT_focus_operation_san_jose: "새너제이 작전"
 LKT_focus_operation_san_jose_desc: "서해안을 따라 휩쓸고 내려가면 태평양이라는 우리만의 장벽을 만들 수 있습니다. 따라서 캘리포니아를 점령하면 대륙 안보를 향한 다음 단계가 확보됩니다."
 LKT_focus_operation_sierra_mist: "시에라 미스트 작전"
 LKT_focus_operation_sierra_mist_desc: "에너지가 풍부한 남서부 지역과 나머지 로키산맥을 확보하면, 서부 해안이 뚫릴 경우에 대비한 훌륭한 방어선을 구축할 수 있습니다."
 LKT_focus_operation_sam_houston: "샘 휴스턴 작전"
 LKT_focus_operation_sam_houston_desc: "북아메리카 대륙에서 가장 큰 정체성을 확보한다는 것은 다양한 민족의 의지를 확보한다는 뜻입니다. 텍사스인들은 자긍심이 강하고 독립심이 투철한 사람들이며, 이들을 확보하는 것은 우리가 시도할 수 있는 모든 동부 진출의 길을 닦아 줍니다."
 LKT_focus_reorganizing_civil_services: "민간 서비스 재편"
 LKT_focus_reorganizing_civil_services_desc: "새로운 표준화된 민간 서비스를 만들면 영토를 더 잘 관리하고 통합 노력을 개선하여 사람들이 최근의 전쟁 기억을 딛고 나아가도록 도울 수 있습니다. 완벽하진 않겠지만, 분명 올바른 방향으로 가는 한 걸음입니다."
 LKT_focus_operation_rustic: "러스틱 작전"
 LKT_focus_operation_rustic_desc: "우리의 동진이 시작됩니다. 북부 경로를 택하면 더 많은 평원과 완만한 구릉, 숲을 만나게 됩니다. 분명 식은 죽 먹기는 아니겠지만, 남진에 앞서 좋은 연습이 될 것입니다."
 LKT_focus_operation_charleston: "찰스턴 작전"
 LKT_focus_operation_charleston_desc: "미시시피에서 대서양까지, 우리는 남부 경로를 확보하고 바다에서 빛나는 바다까지 우리 스스로를 연결하기 위해 진군합니다."
 LKT_focus_operation_north_east_corridor: "북동부 회랑 작전"
 LKT_focus_operation_north_east_corridor_desc: "천명을 되찾는 마지막 구간입니다. 이를 통해 우리는 대륙 공화국을 완전히 장악하고 우리의 운명을 확보할 것입니다...재건해야 한다는 점은 신경 쓰지 마십시오, 이야기가 곁길로 샜군요."
 LKT_focus_west_coast_cleanup: "서해안 정리"
 LKT_focus_west_coast_cleanup_desc: "나라가 우리 통제하에 들어온 지금, 우리는 전쟁으로 황폐해진 땅을 정리하고 재건하는 데 집중할 수 있습니다. 가장 좋은 접근법은 서쪽에서 시작해 동쪽으로 훑어나가는 것입니다."
 LKT_focus_south_central_rebuilding: "중남부 재건"
 LKT_focus_south_central_rebuilding_desc: "서부가 확보된 지금, 우리는 우리의 핵심 과제, 즉 이 경우 새 공화국의 서쪽 절반을 마무리하는 주들에 집중할 수 있습니다. 이 영토를 공고히 하면 미시시피 동쪽의 모든 것만 남게 되며, 곧 마무리될 것입니다."
 LKT_focus_mississippi_miracle: "미시시피의 기적"
 LKT_focus_mississippi_miracle_desc: "동진이 시작되고 미시시피를 건너면서, 우리는 남부 주들을 재건하고 새 나라에 통합할 수 있습니다."
 LKT_focus_reviving_the_rustbelt: "러스트벨트 부활"
 LKT_focus_reviving_the_rustbelt_desc: "옛 러스트벨트 주들을 재건하고 경제 안정을 되찾아 주면, 이 땅과 그곳 사람들을 통합하는 데 도움이 될 것입니다."
 LKT_focus_northeast_renewal: "북동부 재생"
 LKT_focus_northeast_renewal_desc: "마지막 구간입니다. 이 마지막 주들을 통합하면 태평양에서 대서양까지의 통일이 확보될 것입니다."
 LKT_focus_the_second_republic: "제2공화국"
 LKT_focus_the_second_republic_desc: "여정은 길고 대가가 컸지만, 이 땅에 평화가 돌아왔고 북아메리카 대륙에 다시 한번 통일이 모습을 드러냅니다. 우리가 스스로를 위해 만들어 나가고자 한 미래를 확보하기 위한 마지막 한 걸음만이 남았습니다."
 LKT_focus_Containment_Plan_West: "서부 봉쇄 계획"
 LKT_focus_Containment_Plan_West_desc: "이 불안정하고 적대적인 세계에서 살아남으려면 확장이 최우선입니다. 신세계는 산산조각 났고 우리는 그 일부에 대한 몫을 주장해야 합니다. 캄브리아 계획, 곧 서부 봉쇄 계획은 우리가 미시시피 서쪽 모든 곳에 대한 통제를 공고히 하는 것입니다. 이는 우리 국민을 위한 새롭고 더 안정적인 안보 의식을 강화하고 만들어 줄 것입니다."
 LKT_focus_war_plan_purple: "보라색 전쟁 계획"
 LKT_focus_war_plan_purple_desc: "북아메리카 대륙의 서쪽 절반을 확보하는 우리의 첫 단계 중 하나는 측면을 확보하는 것입니다. 따라서 캐스케이디아는 우리의 태평양 휴가를 가로막고 있습니다."
 LKT_focus_war_plan_skorpion: "스코르피온 전쟁 계획"
 LKT_focus_war_plan_skorpion_desc: "에너지가 풍부한 남서부 주들을 확보하면 경제 안정을 높일 수 있을 뿐 아니라 서부 경쟁자들에 대해 상당한 우위를 확보할 수 있습니다."
 LKT_focus_war_plan_yellow: "노란색 전쟁 계획"
 LKT_focus_war_plan_yellow_desc: "태평양 해안을 확보하면 서부 지역의 절반 정도를 확보한 셈입니다. 우리는 계속해서 우리의 미래를 주장하고 새로운 길을 위한 기반을 다질 것입니다."
 LKT_focus_war_plan_blue: "파란색 전쟁 계획"
 LKT_focus_war_plan_blue_desc: "텍사스는 우리가 맞추려 하는 서부 퍼즐의 끝에서 두 번째 조각을 확보해 줍니다. 오클라호마가 마지막 조각이 되겠지만, 미시시피를 건넌다는 것이 정치적으로 정확히 무엇을 수반할지 확신할 수 없으므로 그 논의는 다음으로 미룰 수 있습니다."
 LKT_focus_consolidating_the_territories: "영토 공고화"
 LKT_focus_consolidating_the_territories_desc: "서부가 이제 우리 통제하에 들어왔으니, 이 땅과 사람들을 통합하고 새로운 나라로 빚어내는 데 힘써야 합니다."
 LKT_focus_pacific_pearls: "태평양의 진주"
 LKT_focus_pacific_pearls_desc: "태평양 주들을 통합하고 재건하기 위해 노력하면 우리나라를 위해 세계의 많은 부분이 무역과 관광에 다시 열리게 될 것입니다. 항구와 관광 명소의 재활성화는 앞으로 나아가는 데 중요합니다."
 LKT_focus_southern_sunrise: "남부의 일출"
 LKT_focus_southern_sunrise_desc: "에너지가 풍부한 남서부와 경제적으로 풍족한 텍사스 주를 재건하면 우리나라의 안정과 번영에 절실히 필요한 활력을 불어넣을 것입니다."
 LKT_focus_the_western_identity: "서부의 정체성"
 LKT_focus_the_western_identity_desc: "우리가 통합한 이 땅과 함께 우리는 앞으로 나아갈 새로운 나라, 새로운 민족, 새로운 문화를 선포합니다."
 LKT_focus_The_Great_Barrier_Plan: "대장벽 계획"
 LKT_focus_The_Great_Barrier_Plan_desc: "근본적으로 누구도 그토록 넓은 영토를 직접 통제해서는 안 됩니다. 그러니 이를 바꾸고 북아메리카 대륙에 안정이 자리 잡도록 해야 합니다. 중간 지대를 공고히 하고 동부와 서부를 괴뢰국으로 삼거나 충성을 사들일 수 있다면, 일종의 북미 연합 연방을 만들 수 있습니다...아마 더 나은 이름이 필요할 것입니다."
 LKT_focus_vegas_odds: "라스베이거스의 승산"
 LKT_focus_vegas_odds_desc: "연방의 땅은 우리가 완전히 필요로 하지는 않으며, 따라서 우리가 추구하는 미래를 위해 이를 확보할 때 이를 유리하게 활용할 것입니다."
 LKT_focus_texas_tussle: "텍사스 난투"
 LKT_focus_texas_tussle_desc: "대장벽의 형성은 북아메리카 대륙의 지리적 중심 부근의 중부 주들을 확보하기 위한 것입니다. 텍사스를 시작으로 한 이 첫 단계는 더 많은 남부 진출의 무대를 마련하는 데 도움이 될 것입니다."
 LKT_focus_western_consolidation: "서부 공고화"
 LKT_focus_western_consolidation_desc: "우리와 맞닿은 괴뢰 영토를 공고히 하면 영토를 더 평등하게 나눌 수 있습니다. 이는 우리가 태평양 해안선을 노릴 때 새로운 괴뢰국에 더 많은 유인을 줄 것입니다."
 LKT_focus_the_great_war: "대전쟁"
 LKT_focus_the_great_war_desc: "남부 공화국의 걸프 영토를 확보하면서 대륙 대전쟁이 시작될 것입니다. 우리는 남부 주들이 반드시 필요하지는 않지만, 그들이 오클라호마 주를 내놓기를 거부하는 이상 우리에게는 다른 선택이 없습니다. 덤으로, 우리와 남부 모두에 맞설 만큼 강한 동부 세력이 등장하지 않도록 할 수도 있습니다."
 LKT_focus_eastern_consolidation: "동부 공고화"
 LKT_focus_eastern_consolidation_desc: "대륙 대전쟁이 끝났으니, 우리는 이제 원했던 중부 주들을 통합하는 한편, 남부 주들이 직접 병합되지는 않을 것이라는 점을 이해시켜 확보할 수 있습니다."
 LKT_focus_cartel_cleanup: "카르텔 소탕"
 LKT_focus_cartel_cleanup_desc: "대장벽 계획의 남쪽 범위는 멕시코를 획득하는 것입니다. 나라를 마비시키는 만연한 카르텔 조직을 청소한다는 것보다 더 나은 명분이 있겠습니까."
 LKT_focus_reorganizing_mexican_territories: "멕시코 영토 재편"
 LKT_focus_reorganizing_mexican_territories_desc: "멕시코의 영토를 분할함으로써 서부 괴뢰국에 호의를 베푸는 한편 현 상황에 대한 우리의 권력도 공고히 할 수 있습니다."
 LKT_focus_securing_the_western_coastline: "서부 해안선 확보"
 LKT_focus_securing_the_western_coastline_desc: "가까운 서부 주들이 우리 통제하에 들어오고 남부 전선이 안정된 지금, 우리는 태평양 해안이 있는 먼 서부로 눈을 돌릴 수 있습니다. 이 땅을 확보하면 우리 앞에 놓인 마지막 도전에 대비할 수 있을 것입니다."
 LKT_focus_dividing_up_the_west: "서부 분할"
 LKT_focus_dividing_up_the_west_desc: "서부의 땅이 우리 통제하에 들어온 지금, 통합과 함께 협력하며 나아갈 수 있는 능력을 증진하기 위해 이 땅을 합리적으로 어떻게 나눌지는 우리에게 달려 있습니다."
 LKT_focus_improving_the_homefront: "후방 개선"
 LKT_focus_improving_the_homefront_desc: "현재의 성과를 더 응집력 있게 만들기 위해 공고히 하고 노력함으로써, 우리는 계획의 마지막 목표를 확보할 무대를 마련합니다. 북부 정복은 머지않아 진행되겠지만, 이를 어떻게 처리할지는 또 다른 문제입니다."
 LKT_focus_northern_investment_opportunity: "북부 투자 기회"
 LKT_focus_northern_investment_opportunity_desc: "우리는 두 나라가 함께 일할 수 있도록 캐나다와 협력해야 하며, 철도를 통한 기반시설 투자가 우리를 더 잘 연결해 줄 것입니다."
 LKT_focus_operation_polar_bear: "북극곰 작전"
 LKT_focus_operation_polar_bear_desc: "우리는 장벽의 나머지를 확보하고 이로써 우리가 스스로를 위해 만들고자 하는 미래를 확보하기 위해 북쪽으로 향합니다."
 LKT_focus_the_northern_concessions: "북부 양보"
 LKT_focus_the_northern_concessions_desc: "북부를 확보한 지금, 우리는 이 땅을 다시 나누고 앞으로 올 세대를 위해 북아메리카 대륙의 안정을 보장해야 합니다."
 LKT_focus_the_continental_confederation: "대륙 연합"
 LKT_focus_the_continental_confederation_desc: "신세계가 옛 라코타 깃발 아래에서 새로운 통합을 보았기에, 우리 국가들은 자랑스럽고 단결되어 서 있으며, 따라서 우리는 새로운 나라를 위한 새로운 이름 아래 함께 나아갈 것입니다. 땅이 아닌 민족들을 새로운 정체성 아래 통합하고자 하는 나라이며, 그들이 준비되면 우리는 통합된 북미를 건설할 것입니다."
 LKT_country_flag_elections: "선거 시작"
 LKT_Canadian_War_Goal_Unlock: "그렇다면 전쟁이다"
 LKT_Prairie_Federation_desc: "[LKT.GetFlag]§Y라코타 공화국§!이 [LKT.GetFlag]§Y대초원 연방§!으로 이름을 바꿉니다"
 LKT_Free_Fields_Society_desc: "[LKT.GetFlag]§Y라코타 공화국§!이 [LKT.GetFlag]§Y자유 들판 협회§!로 이름을 바꿉니다"
 LKT_Grand_Duchy_Of_Yellowstone_desc: "[LKT.GetFlag]§Y라코타 공화국§!이 [LKT.GetFlag]§Y옐로스톤 대공국§!으로 이름을 바꿉니다"
 LKT_Second_American_Republic_desc: "[LKT.GetFlag]§Y라코타 공화국§!이 [LKT.GetFlag]§Y제2 아메리카 공화국§!으로 이름을 바꿉니다"
 LKT_Cambrian_Nation_desc: "[LKT.GetFlag]§Y라코타 공화국§!이 [LKT.GetFlag]§Y캄브리아§!로 이름을 바꿉니다"
 LKT_Continental_Confederation_desc: "[LKT.GetFlag]§Y라코타 공화국§!이 [LKT.GetFlag]§Y대륙 연합§!으로 이름을 바꿉니다"
 LKT_divided_we_fell: "분열되어 무너지다"
 LKT_divided_we_fell_desc: "잿더미는 가라앉았고, 우리는 비록 상처 입었으나 우리에게 닥친 이 갑작스럽고 전례 없는 사건에 패배하지 않았습니다. 우리는 앞으로 나아가 스스로의 두 발로 서기 시작해야 합니다."
 LKT_federal_budgets: "국가 예산"
 LKT_federal_budgets_desc: "의미 있는 어딘가에 도달하려면 우리의 필요에 맞게 예산을 평가하고 조정해야 합니다. 실패하는 것은 고치고 효과가 있는 것은 확대해야 하는데, 그것이 그렇게 쉬우면 좋겠습니다."
 LKT_domestic_policies: "라코타 국내 행정청"
 LKT_domestic_policies_desc: "LDAA는 국가 정부가 통과시킨 정책과 법률을 전국에 걸쳐 평가하고 구체화하는 일을 맡은 정부 전담 부서입니다. 요컨대 국민에게 무슨 일이 일어나고 있는지 알고 싶다면 LDAA를 확인해 보십시오."
 LKT_industrial_policies: "상무 및 경제활동부"
 LKT_industrial_policies_desc: "DCEA는 국가 경제의 운영과 발전을 맡고 있습니다. 규제, 기업 보조금 등은 비교적 균형 잡히고 안정적인 경제를 보장하기 위해 이 행정청이 수행합니다."
 LKT_resource_management_policies: "천연자원부"
 LKT_resource_management_policies_desc: "DNR은 인적이든 물적이든 우리의 국내 자원에 대한 고용과 관리를 맡고 있습니다."
 LKT_tax_policies: "세입부"
 LKT_tax_policies_desc: "DoR은 과세 수입의 징수와 집행을 맡고 있습니다. 세법이나 무역 조건의 변경은 이 부서가 상업이나 경제 활동의 모든 형태에 참여하는 시민과 거래 당사자들이 마땅히 내야 할 몫을 내도록 적응시키고 순응시켜야 함을 의미합니다."
 LKT_army_service_branch: "라코타 공화국 육군"
 LKT_army_service_branch_desc: "LRA는 우리나라를 지키는 주요 군종입니다. 머리 위 하늘은 우리 조종사들로 가득하지만, 지상의 병력이 그곳의 적군에 대해 아무것도 할 수 없다면 아무 의미가 없습니다."
 LKT_air_force_service_branch: "라코타 공군"
 LKT_air_force_service_branch_desc: "LAF는 적의 공중 침투로부터 우리 지상군과 해군이 방해받지 않도록 계속 하늘을 확보하는 일을 맡고 있습니다."
 LKT_navy_service_branch: "라코타 해군"
 LKT_navy_service_branch_desc: "LNS는 뒤죽박죽입니다. 나라를 구불구불 가로지르는 주요 수로에만 국한되어 있어, 해군은 농담이나 실업을 줄이는 값싼 방법쯤으로 여겨집니다."
 LKT_ideas_foreign_isolation_office: "대외 고립 사무소"
 LKT_ideas_foreign_isolation_office_desc: "그토록 폭력적이고 불가능해 보였던 사건의 전개 끝에, 우리나라는 이제...음, 국가입니다. 옛 공화국의 붕괴와 함께 우리는 새롭고 더 안전한 믿을 만한 공화국을 이루었습니다. 라코타라는 이름을 사용하여 토착 소수민족에게 호소함으로써 안정을 이루고 완전히 새로운 정체성을 형성할 수 있습니다. 그러나 이렇게 새로 얻은 희망과 함께, 많은 이들은 이웃 나라와 외세의 간섭 전반을 경계합니다. 이러한 정서가 우리나라 곳곳에 남아 있으며, 정부가 실질적인 외교 노력을 전혀 하지 않기 때문에 일부가 외무부를 농담 삼아 \\"대외 고립 사무소\\"라고 부르는 이유이기도 합니다."
 LKT_ideas_agrarian_fuel_economy: "농업 연료 경제"
 LKT_ideas_agrarian_fuel_economy_desc: "농업이 경제 생산의 대부분을 차지하고 있으므로, 에너지 부문을 이에 맞게 즉시 개발하고 적응시켜야 합니다. 바이오 연료 생산에 대한 연구 투자와 대규모 기반시설 장치의 필요성을 줄이는 방안은 에너지 수요를 간소화하고 최대한 활용하는 데 확실히 도움이 될 것입니다."
 LKT_ideas_a_new_green_deal: "녹색 뉴딜"
 LKT_ideas_a_new_green_deal_desc: "종합 투자 패키지인 NGD는 원자력 발전에 투자하고, 현대와 잠재적 미래의 돌파구가 허락하는 한 효율적이고 실용적으로 만들 것입니다. 더 작은 발전소, 사용후 핵연료봉 재활용 센터 등, 과학이 허락하는 만큼 추진합니다."
 LKT_ideas_well_rounded_energy_sector: "균형 잡힌 에너지 부문"
 LKT_ideas_well_rounded_energy_sector_desc: "에너지부가 국가 경제의 필요와 일치하게 되었으니, 이제 안정적이고 번영하는 미래를 보장할 수 있습니다."
 LKT_ideas_improved_rail_network: "개선된 철도망"
 LKT_ideas_improved_rail_network_desc: "철도에 투자함으로써 우리는 나라를 더 잘 연결하고 군사 및 민간 양쪽의 보급선을 개선할 수 있었습니다."
 LKT_ideas_experimental_weapons_corp: "실험 무기 군단"
 LKT_ideas_experimental_weapons_corp_desc: "가장 유연한 대응 부대를 달성하는 데 전념하는 EWC는 육군 부대가 도움이 필요할 때 필요한 도움을 받을 수 있도록 연구개발 노력과 전투 야전 시험에 전념합니다."
 LKT_ideas_lctp: "병참 병과 훈련 프로그램"
 LKT_ideas_lctp_desc: "LCT 프로그램은 최전선에 적합하지 않을 수 있는 이들에게 모병 기회를 열어 주기 위해 설계되었습니다. 최전선의 안정과 효율을 보장하려면 우리의 보급 사슬이 최상의 상태여야 하며, 따라서 그렇게 되도록 보장할 것입니다."
 LKT_ideas_fighter_supremacy: "전투기 우세"
 LKT_ideas_fighter_supremacy_desc: "공군에서 전투기의 개발과 배치를 우선시함으로써, 적 침략자들로부터 방해받지 않는 맑은 하늘을 만들 무대를 마련합니다."
 LKT_ideas_ground_support_supremacy: "지상 지원 우세"
 LKT_ideas_ground_support_supremacy_desc: "지상 지원 항공기를 우선시함으로써, 제공권에서 부족한 점이 있더라도 적 지상군을 치고 빠지는 능력이 저해되지 않도록 보장할 수 있습니다. 이를 통해 전선을 안정시키고 적이 우리 땅을 파괴하는 것을 막을 수 있습니다."
 LKT_ideas_strategic_bomber_supremacy: "전략 폭격기 우세"
 LKT_ideas_strategic_bomber_supremacy_desc: "전략 폭격기의 개발과 배치를 우선시함으로써, 우리는 적의 전투 의지와 능력을 분쇄할 것입니다. 산업과 기반시설은 우리의 강력한 폭격기 앞에 무너질 것입니다."
 LKT_ideas_strategically_cheap: "전략적 저비용 교리"
 LKT_ideas_strategically_cheap_desc: "작은 표적은 그만큼 맞히기도 어렵습니다. 우리의 강 뗏목 운용과 제한적인 해안 경험을 바탕으로 해군 함정을 설계할 새로운 일격이탈 전술을 만들어 낼 수 있습니다. 물론 단점도 있겠지만, 우리가 더 나은 방법을 아는 것도 아니니 어떻게든 배워 나가야 합니다."
 LKT_ideas_naval_command_structure: "해군 지휘 구조"
 LKT_ideas_naval_command_structure_desc: "진정으로 체계적인 해군 지휘 구조를 확립하면 실질적인 해군 병과를 창설하려는 우리의 노력이 한층 더 굳건해질 것입니다."
 LKT_anarchist_asylum_experiement: "아나키스트 피난처 실험"
 LKT_anarchist_asylum_experiement_desc: "우리의 영토는 넓고 개발이 덜 되어 있습니다. 더 나은 내일을 찾는 사람들을 사방에서 불러들여 이 땅을 채우겠다고 약속해야 합니다."
 LKT_ideas_standardized_civil_services: "표준화된 공공 서비스"
 LKT_ideas_standardized_civil_services_desc: "새로운 표준 행정 및 일반 공공 서비스 체계를 만들면 새로 얻은 영토를 자연스럽게 통합할 수 있습니다. 덤으로 대민 홍보 효과도 있으며, 사람들을 힘으로 굴복시키는 것보다 민심을 얻는 접근에 더 가깝습니다."
 LKT_ideas_the_second_american_republic: "제2 아메리카 공화국"
 LKT_ideas_the_second_american_republic_desc: "영토가 다시 통일되고 위임 통치권이 확보된 지금, 우리는 옛 폐허 위에 제2 아메리카 공화국을 세웁니다."
 LKT_ideas_cultivating_a_new_identity: "새로운 정체성 함양"
 LKT_ideas_cultivating_a_new_identity_desc: "미시시피 강 서쪽 땅은 우리의 통제 아래 있습니다. 이제 국민의 마음을 굳게 다지고 함께 새로운 길을 열어 나가야 합니다."
 LKT_ideas_securing_the_new_order: "새로운 질서의 확립"
 LKT_ideas_securing_the_new_order_desc: "우리의 대장벽 계획은 완성을 향해 계속 나아가고 있으며, 이에 따라 해당 질서의 안정도를 확보하기 위해 내정에 더욱 집중합니다. 북아메리카 대륙은 공동의 목표를 위해 협력하는 국가들의 연합을 통해 평화와 번영을 누리게 될 것입니다."
 LKT_collapse_event.1.t: "많진 않지만 딱 충분한 양"
 LKT_collapse_event.1.d: "폭풍이 지나가고 상황이 진정되기 시작하면서, 이제 우리는 각 주를 재건하고 새로운 국가로 재편해야 합니다. 그러나 애초에 개발된 것이 많지 않았으니 재건할 것도 많지 않습니다. 따라서 국민에게 던질 핵심 질문 가운데 하나는 우리 국가가 어떤 경제를 원하느냐가 될 것입니다. 어쨌든 대단치는 않아도 정직한 일입니다."
 LKT_collapse_event.1.o1: "자, 일하러 가 봅시다"
 LKT_nation_name_event.1.t: "새로운 국가"
 LKT_nation_name_event.1.d: "원주민이 이토록 소수인 이상, 이른바 \\"안전하고 지리와 역사를 존중하는\\" 이름인 라코타를 유지할 이유가 우리에게는 전혀 없습니다. 대신 우리는 새로운 프레리 연방의 대평원인이 될 것입니다."
 LKT_nation_name_event.1.o1: "이 땅은 우리의 땅이기에!"
 LKT_nation_name_event.2.t: "자유로운 국가?"
 LKT_nation_name_event.2.d: "사회가 선출되면서 많은 이들이 이것이 가까운 미래에 우리가 성공하기 위해 넘겨야 할 진정한 새 장인지 궁금해합니다. 이에 따라 국가로서 우리의 길잡이를 무엇으로 삼을 것인가를 두고 큰 논쟁이 일었습니다. 한쪽에는 자유 평원 사회의 명분 아래 성공하길 바라는 이들이 있습니다. 본질적으로 아나키스트에 가까운 체제로, 우리 스스로 우뚝 서려는 것입니다. 다른 한쪽은 현상을 유지하면서 가능하다면 더 나은 선택지를 찾는 것입니다. 그렇다면 국민은 무엇을 원합니까?"
 LKT_nation_name_event.2.o1: "자유 평원 사회!"
 LKT_nation_name_event.2.o2: "아직 이른 것일지도?"
 LKT_nation_name_event.3.t: "왕국?"
 LKT_nation_name_event.3.d: "충격적이게도 옐로스톤 가문이 선출되었습니다. 이 정당은 투표 절차의 민주적 수단을 확대하고, 국민의 최대한의 참여를 보장하기 위해 기본적인 보통 선거권을 약속합니다. 유일한 차이는 선출직에 봉건적 칭호가 붙는다는 것이며, 이는 겉보기로나마 정부 자체의 의미와 기풍을 바꾸게 됩니다. 이에 맞게 국가를 실제로 전환하기 시작할지, 아니면 현재의 길을 유지할지 고민하는 이들도 있습니다."
 LKT_nation_name_event.3.o1: "우리는 대공국이 될 것이다!"
 LKT_nation_name_event.3.o2: "실용적이기엔 너무 공상적인 건 아닐까?"
 LKT_nation_name_event.4.t: "새 공화국의 수립"
 LKT_nation_name_event.4.d: "국가의 재건이 목전에 다다른 지금, 우리는 제2 아메리카 공화국을 수립하여 우리의 위임 통치권을 굳건히 해야 합니다. 옛 잿더미에서 새로운 길이 솟아오릅니다."
 LKT_nation_name_event.4.o1: "새 공화국 만세!"
 LKT_nation_name_event.5.t: "서부의 정체성"
 LKT_nation_name_event.5.d: "서부의 땅이 하나의 깃발 아래 모였으며, 이를 계기로 우리는 새로운 국가를 선포합니다. 캄브리아입니다. 우리 영토의 상당 부분을 규정하는 불변의 지형인 로키 산맥을 가리키는 이름입니다. 산맥 곳곳에서 캄브리아기 화석이 발견되므로, 이를 기반으로 우리가 캄브리아의 시민이자 국민임을 보입니다. 우리는 영원토록 이 땅과 우리 국민을 지키고 보살필 것입니다."
 LKT_nation_name_event.5.o1: "캄브리아에 영광을!!!"
 LKT_event.10.t: "\\"상호 투자\\""
 LKT_event.10.d: "캐나다는 꼭 필요한 곳만 개발되어 있습니다. 양국의 무역과 수송 가치를 높이기 위해 상호 철도 연결에 투자함으로써 \\"그들을 도울\\" 수 있습니다. 수락한다면 문제가 없고, 거절한다면... 그때는 우리에게 문제가 생깁니다."
 LKT_event.10.o1: "수락하기를 바라자"
 LKT_event.11.t: "투자 제안"
 LKT_event.11.d: "라코타 공화국이 흥미로운 제안을 가지고 우리를 찾아왔습니다. 다코타에서 사스카체완 주 리자이나의 간선 철도, 그리고 매니토바 주 위니펙까지 철도를 건설하려는 것입니다. 이는 무역 협정, 관광, 그리고 양국 간의 전반적 협력에 도움이 될 것입니다. 우리는 별다른 문제를 느끼지 않지만, 의회 일각에서는 최근 공화국이 벌인 활동을 볼 때 이것이 거짓 구실이라고 봅니다. 그렇다면 우리의 대응은 무엇입니까?"
 LKT_event.11.o1: "거래를 승인한다"
 LKT_event.11.o2: "정중히 제안을 거절한다"
 LKT_event.111.t: "거래 결렬"
 LKT_event.111.d: "캐나다가 우리의 제안을 거절했습니다. 지금으로서는 달리 추구할 길이 없으므로 상황에 다시 접근해야 합니다."
 LKT_event.111.o1: "북소리가 들리지 않나?"
 LKT_event.12.t: "공사 착수"
 LKT_event.12.d: "거래가 승인되어 공사를 시작했습니다. 순조로운 사업이 되어 월말까지 완공되기를 바랍니다."
 LKT_event.12.o1: "모두 계획대로다"
 LKT_event.13.t: "그레이트 노던의 문제"
 LKT_event.13.d: "사업 인력들은 이상한 사고가 계속 발생하고 있다고 보고합니다. 사업이 거의 끝나가는데도 승무원이 실종되고, 우리 측 사람들이 라코타인에 대해 적대감을 키운다는 보고가 있습니다. 정확히 무슨 일이 벌어지는지는 알 수 없으나, 최소한 음모가 있다고 의심합니다."
 LKT_event.13.o1: "기분이 좋지 않다..."
 LKT_event.14.t: "피에 굶주린 캐나다인들?!?"
 LKT_event.14.d: "신문과 방송은 피에 굶주린 캐나다인들이 선량한 라코타 노동자를 살해했다고 소리치고 있으며, 우리와 캐나다 정부 간 최근 철도 사업에서 나온 소문에 국가가 들끓고 있습니다. 상황이 예상보다 잘 풀리고 있으니, 이를 이용해 우리가 치를 수 있었던 전쟁 대신 우리가 원하는 전쟁을 일으킬 것입니다."
 LKT_event.14.o1: "우리의 요구를 보내라!"
 LKT_event.15.t: "악화되는 상황"
 LKT_event.15.d: "라코타의 요구가 갑작스럽게 정부에 도달했습니다. 그들은 라코타인 사망에 대한 보상으로 산업 투자와 사업비 지급을 요구합니다. 총액은 약 350억에 달하며, 많은 캐나다인이 동포를 향한 비난에 분개하고 있습니다. 따라서 우리는 매우 어려운 결정을 내려야 합니다."
 LKT_event.15.o1: "체면을 지키고 그냥 지불한다"
 LKT_event.15.o2: "엿이나 먹어라, 본때를 보여 주겠다"
 LKT_event.16.t: "예상치 못한 결과"
 LKT_event.16.d: "어쩌다 보니 우리는 실패했는데... 성공적으로? 하지만 우리가 원했던 진짜 결과는 아니므로 차선책을 준비해야 합니다."
 LKT_event.16.o1: "군대를 편성하라"
 LKT_politics.1.t: "선거 운동의 시작"
 LKT_politics.1.d: "전국 곳곳에서 정당이 결성되고, 사람들은 이 나라를 이끌 다음 집권 세력으로 가장 알맞다고 믿는 쪽에 결집하기 시작합니다. 강경 노선 정당 사이에서도 사소한 다툼이 시작되는 가운데, 많은 이들이 앞으로 국가가 어디로 향할지 설레는 마음으로 지켜보고 있습니다."
 LKT_politics.1.o1: "사랑과 전쟁에서는 모든 것이 허용된다"
 LKT_politics.2.t: "\\"권위 정당 평의회\\""
 LKT_politics.2.d: "혼란과 표 쟁탈전 속에서 지도 방식이 어느 정도 비슷한 정당들이 모여 투표 연합을 결성했습니다. 이른바 권위 평의회는 과두 체제처럼 기능하는 정당들의 집합이라고 많은 이들이 믿습니다. 각 정당은 이런 모욕적인 비교를 거부하지만, 최근 있었던 일부 처리 방식을 부정할 수 없는 구성원도 있습니다. 그럼에도 투표하여 누가 국가를 이끌지 가리는 것은 국민의 몫입니다."
 LKT_politics.2.o1: "DDP 승리!"
 LKT_politics.2.o2: "KCK 승리!"
 LKT_politics.2.o3: "LTP 승리!"
 LKT_politics.2.o4: "AFL 승리?"
 LKT_politics.2.o5: "이게 전부일 리 없다, 다음은 누구인가"
 LKT_politics.3.t: "전통을 위한 정당들"
 LKT_politics.3.d: "상황이 계속 달아오르면서 우파와 중도우파 성향 정당들이 투표 연합을 결성하려는 새로운 권력 블록이 형성되기 시작했습니다. 이들은 이 땅과 국민에게 알려진 새로운 전통과 오랜 전통을 지킨다는 공통의 이해관계를 중심으로 결집합니다. 전통을 위한 정당들은 변화가 일어날 수는 있으나 변화를 위해 과거를 내던져서는 안 된다고 믿습니다. 그럼에도 국가를 이끌기를 바라는 정당이 승리하도록 투표하고, 투표하고, 또 투표하는 것은 국민의 몫입니다."
 LKT_politics.3.o1: "ORP 승리!"
 LKT_politics.3.o2: "TTP 승리!"
 LKT_politics.3.o3: "LTSP 승리!"
 LKT_politics.3.o4: "분명 선택지가 더 있을 것이다. 잠깐, 저쪽을 보라"
 LKT_politics.4.t: "서민 진보 정당들"
 LKT_politics.4.d: "신흥 사회주의 경제 정당 블록은 신 라코타 민족 정당들의 부상에 대한 반발만으로 지지를 얻었습니다. 이른바 \\"좌우\\" 이분법은 국가의 정치가 점점 더 많은 파벌로 쪼개지고 있음을 뜻합니다. 그러나 투표가 시작되고 국민이 나라에 옳다고 믿는 쪽으로 한 걸음 내디디려 할 때, 이 젊은 나라의 첫 집권당이 누가 될지 많은 이들이 궁금해합니다."
 LKT_politics.4.o1: "FPP 선두"
 LKT_politics.4.o2: "FRF와 LAS 접전"
 LKT_politics.4.o3: "RBP와 RRA 접전"
 LKT_politics.4.o4: "더 있다고 했나?!"
 LKT_politics.5.t: "신 라코타 민족 정당들"
 LKT_politics.5.d: "신 라코타 민족당은 고립과 새로운 정체성의 보존을 다른 무엇보다 중시하려는 정당들의 친민족주의 운동으로 떠오르고 있습니다. 국내에서는 이것이 다양한 소수 집단에 어떤 의미일지 회의적인 이들이 많지만, 대부분은 세계가 서로 얽혀 있다는 점이 옛 공화국의 대붕괴를 불러왔다고도 믿습니다. 한편 국가 영토의 제한적이거나 거의 없는 개발에서 더 자연스럽게 자라난 것으로 보이는 부상하는 사회주의 경제 정당들에 반발하여, 단지 그 이유로 이 새 정당 블록에 투표하는 이들도 있을 것입니다."
 LKT_politics.5.o1: "YIP 승리!"
 LKT_politics.5.o2: "CDS와 LGF 동률"
 LKT_politics.5.o3: "결국 카지노가 이기는가?"
 LKT_politics.5.o4: "되감을 시간이다"
 LKT_focus_metallic_bloodlines_act: "금속 혈통법"
 LKT_focus_metallic_bloodlines_act_desc: "MBA는 우리나라가 철과 강철을 국내에서 공급할 수 있는 능력을 일으켜 세우고 확보하기 위한 자금 지원 패키지입니다. 특히 강철은 인력과 콘크리트 다음으로 경제를 지탱하는 두 번째 기둥입니다."
 LKT_focus_metallic_masters: "금속의 수단"
 LKT_focus_metallic_masters_desc: "국가 독립을 위한 추가적인 수단을 찾으려면 안타깝게도 깊고 탐욕스럽게 파헤쳐야 합니다. 사우스다코타 주에서는 소량의 경금속을 찾을 수 있으며, 이는 우리의 경제 역량을 다각화하는 데 도움이 될 것입니다."
 LKT_focus_bio_fuel_prominence: "바이오 연료의 부상"
 LKT_focus_bio_fuel_prominence_desc: "바이오 연료와 그 주변에 구축되어야 할 기반에 대한 헌신적이고 끊임없는 개발 노력을 통해, 더 효율적이고 풍부한 형태의 에너지를 만들어낼 수 있습니다. 이는 전반적인 수요와 토지 및 자원 사용에 드는 잠재적 비용을 줄여, 국민과 나라 전체의 더 나은 필요를 위해 남겨둘 수 있게 해줄 것입니다."