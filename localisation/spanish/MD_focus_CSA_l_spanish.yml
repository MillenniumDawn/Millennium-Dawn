 SRA_port_charlie: "Puerto Charlie"
 SRA_port_athena: "Puerto Athena"
 SRA_port_stephenson: "Puerto Stephenson"
 SRA_port_davis: "Puerto Davis"
 SRA_port_creol: "Puerto Creole"
 CSA_New_Arlington: "Nueva Arlington"
 CSA_Mount_Columbia: "Montaña Columbia"
 CSA_Ulysses: "Ulysses"
 CSA_Quincy_capital: "Quincy"
 CSA_Southern_Kingdom_desc: "[CSA.GetFlag]§YSouthern Republic of America§! Cambia su nombre a §YReino del Sur de Dixie§!"
 CSA_confederate_states_desc: "[CSA.GetFlag]§YSouthern Republic of America§! Cambia su nombre a §YEstados Confederados de América§!"
 CSA_socialist_republic_of_dixie_desc: "[CSA.GetFlag]§YSouthern Republic of America§! Cambia su nombre a §YRepública Socialista de Dixie§!"
 CSA_republic_of_dixie_desc: "[CSA.GetFlag]§YSouthern Republic of America§! Cambia su nombre a §YRepública de Dixie§!"
 CSA_southern_union_desc: "[CSA.GetFlag]§YSouthern Republic of America§! Cambia su nombre a §YUnión del Sur§!"
 CSA_united_southern_states_desc: "[CSA.GetFlag]§YSouthern Republic of America§! Cambia su nombre a §YEstados Unidos del Sur de América§!"
 CSA_the_golden_confederation_tooltip: "[CSA.GetFlag]§YSouthern Republic of America§! Cambia su nombre a §YConfederación Dorada§!"
 CSA_second_american_republic_desc: "[CSA.GetFlag]§YSouthern Republic of America§! Cambia su nombre a §Y2da República Americana§!"
 CSA_decisions_war_time_mobilization_category: "Movilización en Tiempo de Guerra"
 CSA_decisions_war_time_mobilization_category_desc: "Cuando surja la necesidad, podemos convocar a una legión voluntaria de personas para al menos llenar los vacíos en las líneas. No sabemos cuándo llegará la guerra, pero sabemos que estará sobre nosotros."
 CSA_war_time_mobilization: "Movilización de la 1ra Ola"
 CSA_war_time_mobilization_desc: "La llamada a las armas está sobre nosotros y debemos reunirnos para asegurar la defensa de nuestros hogares. A las armas, chicos de Dixie!"
 CSA_war_second_wave_defenders: "Defensores de la 2da Ola"
 CSA_war_second_wave_defenders_desc: "El enemigo presiona, por lo que debemos reclutar otra ola de defensores. La moral de la nación sufrirá, pero necesitamos las tropas."
 CSA_war_desperate_defenders: "Defensores Desesperados"
 CSA_war_desperate_defenders_desc: "Las cosas se están poniendo graves, necesitamos cada cuerpo disponible, sea capaz o no, para mantener la línea. Tal vez, solo tal vez, podamos aún ganar esto."
 southern_republic_event.1.t: "La Cuestión de la Capital"
 southern_republic_event.1.d: "In the wake of the aftermath that was the \"Great Riots\" of the former United States, many of the local governors are scrambling to make their states as appealing to an independent body of where the new Republic's capital should be. Some believe that it should be as central as possible and place the city of Meridian Mississippi as an optimal option. Some believe only Atlanta is the real choice being one of the most developed metropolitan areas of the South. While some cite historic symbolism and wish to have Charleston as the new capital, whatever the choice is it'll need to be sooner rather than later if we are to actually focus on our more pressing problems."
 southern_republic_event.1.o1: "¿Acabamos de pasar por eso y ahora hacemos un maldito concurso de belleza?!"
 southern_republic_event.2.t: "La Elección del Comité"
 southern_republic_event.2.d: "After a handful of days as well as many pressures exerted by local officials to choose them the committee has come up with four distinctive choices. New Orleans for its trading hub and naval apparatus, Meridian in Mississippi for its strategic centrality when thinking of the old confederacy. Then there is Atlanta, the South's most developed metropolitan hub, which economically and governing wise would be kind of commonsense of a choice. Finally there is the historic symbolism that is making Charleston the capital. Charleston appeals to the right as well as it appeals to the Southern identity movement that's been growing ever more. Regardless the committee's choice is what determines who gets what."
 southern_republic_event.2.o1: "Nueva Orleans supera obviamente a Atlanta"
 southern_republic_event.2.o2: "El Corazón de Dixie debería ser el corazón, Meridian es la elegida"
 southern_republic_event.2.o3: "Atlanta es la única opción real aquí"
 southern_republic_event.2.o4: "Nuestra historia es nuestra identidad, Charleston ha sido elegida"
 southern_republic_event.3.t: "El Teatro Político"
 southern_republic_event.3.d: "The Southern states are host to a complete natural disaster's worth of political factions and ideological influences. Not only does the South have to worry about the natural disasters of mother nature herself but of the excesses and fighting of its political extremes. From niche Klan members, to Socialist revolutionaries we have to properly navigate this storm if we are to enjoy what little peace we've been able to establish so far."
 southern_republic_event.3.o1: "Esos alborotadores no representan una amenaza"
 southern_republic_event.3.o2: "Deberíamos ser más cautelosos con quién puede ser elegido"
 southern_republic_event.4.t: "Las fiestas estables"
 southern_republic_event.4.d: "A raíz de nuestro renacimiento político, debemos mirar a quién podría hacernos una nación más estable. Estos \"moderados\", como los llaman los ataques de la extrema derecha y la extrema izquierda, indican que estos son los partidos más cautelosos. Buscando el cambio pero no de una manera enmaratonada, sino más bien como un paseo tranquilo o a un paso ligero, debemos entender quiénes son estos partidos si queremos ayudar a garantizar que consoliden el apoyo sobre los otros partidos más rebeldes."
 southern_republic_event.4.o1: "Gracias a Dios por las personas cautelosas"
 southern_republic_event.5.t: "El Partido Conservador del Sur"
 southern_republic_event.5.d: "The SCP is a fairly moderate party in the grand scheme of the \"Stable\", group of parties. Being generally a center-right party it tends to be more of a reminder of the old democratic and republican parties and their moderate wings. Being more for gradual change rather than large swift changes, this party ensures that if change is needed it's tackled in a more thought out manner rather than the fanfare mentality that can arise in more sensitive topics. In terms of social policies it ensures that change is always happening but we must embrace it at a comfortable pace to keep the national cohesion. Economically they are for deregulation, but not opposed to more commonsense based regulations to curb exploitative means."
 southern_republic_event.5.o1: "El SCP trae paz"
 southern_republic_event.5.o2: "Los Pelucas Ganarán"
 southern_republic_event.5.o3: "El PDP Prevalecerá"
 southern_republic_event.6.t: "El Partido Peluca de Dixie"
 southern_republic_event.6.d: " The WPD is a more classical liberal party which aims to use the old school of liberal doctrine to secure a stable and progressing government to ensure the freedom and equality for all. Seeking more of equal opportunity availability the WPD is socially more fluid towards changes but does not see the need to enforce governmental sanctions unless the issue at hand is not truly handled at the state and or local levels first. Economically they believe in regulations overall with a focus in anti-monopoly or more generally anti-competitive practices regulation. But aside from this sort of \"fair game\" strategy in regulations the WPD prefer a more hands-off approach if and when possible."
 southern_republic_event.6.o1: "Las regulaciones sensatas tienen sentido"
 southern_republic_event.6.o2: "La verdadera competencia es la verdadera oportunidad"
 southern_republic_event.6.o3: "Las amalgamas económicas son anti-sureñas"
 southern_republic_event.7.t: "El Partido Democracia Progresiva"
 southern_republic_event.7.d: "The PDP is a more traditional democratic-socialist party like its European counterparts, the party looks to use the powers of democracy to ensure the fair treatment of the workers of the nation and wishes to usher in a soft socialism. This means socially speaking the party is more liberal with only holding traditional values on what the voting majority believe is worth keeping traditional. Economically they are soft Socialists, looking to use the power of regulations to keep the workers fed and cared for they are not entirely pro-nationalization however if the private sector acts too unruly it is not out of the question as a stand in to help the exploited masses."
 southern_republic_event.7.o1: "El SCP garantiza la estabilidad del sur"
 southern_republic_event.7.o2: "Los Wigs vestirán al estilo sureño"
 southern_republic_event.7.o3: "El PDP creará el socialismo sureño"
 southern_republic_event.8.t: "El Partido de la Federalización de Dixie"
 southern_republic_event.8.d: "The FDP is essentially the compromising party. Looking to find a happy middle ground of the federal unitarian type government of the union and the more heavily minarchist confederate government, the FDP wishes to marry the two into an earnest and father like figure of a structure to keep peace as well as order to the nation at large. Being both socially and economically off hand its only plans are to direct central funding and services to the poorest of regions to ensure the very bottomline of the nation is not so far down from the rest. Many lambast this as pseudo-socialism, but the FDP fires back at them wondering how much do these supposed \"honorable members of state\" really care about its constituents or do they care more about their friends and paycheck."
 southern_republic_event.8.o1: "La palabra Federal no es un insulto, sino una realidad"
 southern_republic_event.8.o2: "El sorbo de victoria del SIP es una victoria sureña"
 southern_republic_event.8.o3: "El SLP liberará a Dixie"
 southern_republic_event.9.t: "El Partido de la Identidad Sureña"
 southern_republic_event.9.d: "The SIP is a niche kind of single issue party. They are more socially indifferent, leading to any and all major social issues to be handled locally rather than nationally. In terms of economics they are a sort of, \"if it isn't broke don't fix it\", kind of mentality. Meaning they'll do regulations or deregulations, but only if it's perceived as a genuine issue to the economic stability of the nation. As for the supposed single issue, the SIP has most of its focus on cultivating and ensuring a real and concrete plan to create a Southern identity. Using things like the more minarchist views of the old confederacy mixed in with some stylistic inspirations from them as well as promoting local food and music culture as Southern culture. The party wishes to move away from the past and make a future that is earnestly and equally Southern for all."
 southern_republic_event.9.o1: "Libertad y alimento para Dixie"
 southern_republic_event.9.o2: "Estilo sureño para la gente sureña"
 southern_republic_event.9.o3: "Libertad de Dixie para los valores de Dixie"
 southern_republic_event.10.t: "El Partido de la Libertad Sureña"
 southern_republic_event.10.d: "The SLP is an interesting makeup of a party. Being more or less the remnants of the old Libertarian Party, the SLP has decided to embrace a compromise of Southern cultural and governmental values with a Libertarian spin to help with the complete decentralization. Many in the SLP see a full return to either pro-Libertarianism and or pro-Confederation of government as a sure way to recreating the failure that was the Articles of Confederation. Regardless the party is anti-government intervention in the economy and socially it is very hands off, leaving such things to the state governments means that locals handle local issues. Though the SLP is not afraid of things like welfare and healthcare programs to ensure the bottomline of the nation are able to have some kind of footing to kick in the door of opportunity."
 southern_republic_event.10.o1: "El FDP entiende el gobierno"
 southern_republic_event.10.o2: "El SIP creará un verdadero gobierno sureño"
 southern_republic_event.10.o3: "Libertad sureña es gobernanza sureña"
 southern_republic_event.11.t: "Los partidos marginales"
 southern_republic_event.11.d: "Within the general Overton window of the southern republic, we have two distinctive parties which some honestly debate if they are even real political parties to begin with. Regardless first off we have the DDP or Dixie & Delta Party. Founded by a former railroad enthusiast turned novice political leader, this party seems to be more of a single-issue party in relation to public transportation. However they have alluded to the fact that said investments in PT as they call it for short, would indeed have knock on economic effects when it comes to urbanization as well as connectivity within the nation itself. On the Other hand we have the Party for Economic Prosperity or PEP for short. This party styles itself as a party focused on economic development and ensuring the standards of the nation are brought up through real economic investments. What they don't tell you is that said party is also full of big agricultural money as well as a soft plantation class of supporters. Regardless both the PEP and DDP are seen as interesting forces on their own right but nothing too far to shake the foundations."
 southern_republic_event.11.o1: "El desarrollador de Dixie"
 southern_republic_event.11.o2: "El Economista de Dixie"
 southern_republic_event.100.t: "Los vientos del cambio"
 southern_republic_event.100.d: "In the lead up to the first elections, the state of the nation has been too much to bear for many. As a result rising radicalism has been seen on both sides of the political scene. With neo-confederates, fascist and much more on the right. The union of revolution and southern communist association leading the charge on the left. Many wonder just who will take the wind out of the sails of the other sides. For now continued rise in factionalism has resulted in..."
 southern_republic_event.100.o1: "Agitadores socialistas movilizan a la fuerza laboral"
 southern_republic_event.100.o2: "El orgullo histórico obstinado se apodera de las masas"
 southern_republic_event.101.t: "Identitarios confederados"
 southern_republic_event.101.d: "The Confederate Workers Party desperate to keep ahead in the polls has recently sought out the help of the Southern Tradition Party. These two while fairly opposite of one another have united on the principle of \"The Confederate Dream\". Hoping to establish the rightful south and restore the lands of old, these two opposites have seemingly attracted one another in a gamble for the first election victory of the new nation. For the first steps are the most important in the road to recovery and stability."
 southern_republic_event.101.o1: "Se forma un frente unido"
 southern_republic_event.101.o2: "Se forma una sociedad de agricultores"
 southern_republic_event.102.t: "La Sociedad Agraria"
 southern_republic_event.102.d: "The main counter push and equally as desperate Union of Revolution Party has seen fit to align itself with the Agrarian Union Party. These two working together create the perfect oxymoron as one is clearly an oligarchic big agriculture party and the other is the closest thing to anarcho-communism that you'll see. But desperate times call for desperate measures. Both parties believe that the true pillar to a stable and complacent society is that of the agrarian society. Simple organization and most production efforts and organized labor goes towards making food, what better way to mold the society than by giving it a basic fundamental of living itself. Regardless they'll have to push hard as things are heating up as the elections come ever closer."
 southern_republic_event.102.o1: "El Frente Confederado lidera en las encuestas"
 southern_republic_event.102.o2: "Las promesas de estómagos llenos muestran resultados prometedores"
 southern_republic_event.200.t: "La derecha se consolida"
 southern_republic_event.200.d: "Con el reciente cambio en la ética nacional, muchos se han estado acercando a partidos más de derecha. Esto ha preocupado enormemente a los moderados y a la izquierda dada la historia del país. Sin embargo, los temores llegaron a su punto máximo cuando el Partido Dixie First y la Liga del Sur se unieron bajo la Liga de Pureza Dixie. Muchos locales temen el retroceso de reformas sociales que la liga podría crear, lo que ya ha resultado en una migración constante fuera del país. Con el miedo de que los neoconfederados y los fascistas se unan, muchos buscan alternativas reales para evitar que una fuerza así gane las elecciones."
 southern_republic_event.200.o1: "La nación anhela la pureza"
 southern_republic_event.200.o2: "Posibles migrantes se apresuran a enlistarse"
 southern_republic_event.201.t: "El aumento del reclutamiento ve el nacionalismo de contraataque"
 southern_republic_event.201.d: "With the consolidation of the \"Fringe Right\", as opposition nationalist proclaim and sneer at them, many would be targets of such policies have begun to enlist and as a result the political clout of the military has become more and more swaying in its influence. With this the Modern Monarchist Movement known as the House Of Meridian has joined forces with the armed forces to consolidate a counter nationalist movement. Many are hopeful that if we must go down such a path that at least duty to country is better than anything a fascist or ultra-nationalist leadership would have."
 southern_republic_event.201.o1: "Las periferias siguen luchando"
 southern_republic_event.201.o2: "Un ejército \"real\", suena divertido"
 southern_republic_event.12.t: "Las demandas del Sur"
 southern_republic_event.12.d: "Nuestros vecinos al oeste han exigido nuestra subyugación, la promesa supuestamente, de emular la independencia del estado de Texas como un socio confederal dentro de la nación sureña. No estamos seguros de cuál es su objetivo final, pero depende de nuestra propia creencia en nuestras fuerzas militares si podemos rechazar sinceramente tales demandas."
 southern_republic_event.12.o1: "Somos texanos primero y solo texanos!"
 southern_republic_event.12.o2: "Si tan solo tuviéramos más tiempo... Estamos de acuerdo."
 southern_republic_event.13.t: "Texas se niega"
 southern_republic_event.13.d: "La nación texana ha rechazado nuestra generosa oferta y ahora la pelota está en nuestro campo. Podemos arriesgar un conflicto general y potencialmente hacer que se derrame, o podemos dar un paso atrás. Ambas opciones son viables, sin embargo, una claramente tiene más riesgo que la otra."
 southern_republic_event.13.o1: "Ningún sureño se echa atrás en una pelea"
 southern_republic_event.13.o2: "Tal vez apresuramos un poco las cosas"
 southern_republic_event.14.t: "Texas acepta nuestra oferta"
 southern_republic_event.14.d: "Con su aceptación ahora podemos avanzar como un frente unido para alcanzar un verdadero objetivo de unidad regional. Aunque, por supuesto, habrá algunas mentes inquietas respecto a esta nueva unión, pero al menos es un comienzo."
 southern_republic_event.14.o1: "Vaya, funcionó!"
 southern_republic_event.15.t: "La proposición sureña"
 southern_republic_event.15.d: "La nación sureña nos ha hecho una oferta para convertirnos en una unión confederal con ellos. Prometen un autogobierno justo, pero con el objetivo principal de unirnos en política exterior en una nueva unión regional. Esto podría ser muy ventajoso para nuestra situación, ya que anularía nuestras sanciones internacionales bajo la apariencia de no \"existir\". Sin embargo, esto podría ser una táctica para usarnos, sea cual sea el caso, necesitamos dar una respuesta."
 southern_republic_event.15.o1: "No nos sometemos a cualquiera"
 southern_republic_event.15.o2: "Me gusta perder sanciones, claro, estamos de acuerdo"
 southern_republic_event.16.t: "Cuba nos rechaza"
 southern_republic_event.16.d: "The Cubans have refused our demands, now the question is do we want to risk prolonged war through naval warfare and making an invasion force. We do what we can, but it may turn out more costly than what it was worth."
 southern_republic_event.16.o1: "Vamos a la guerra!"
 southern_republic_event.16.o2: "No podíamos permitirnos esto ahora mismo"
 southern_republic_event.17.t: "Cuba acepta nuestro acuerdo"
 southern_republic_event.17.d: "Los representantes cubanos han aceptado nuestro acuerdo y comenzaremos con las leyes y métricas unificadoras para crear una unión justa y estable para el futuro previsible."
 southern_republic_event.17.o1: "La ronda va por mi cuenta!"
 southern_republic_event.18.t: "Demandas sureñas"
 southern_republic_event.18.d: "La nación sureña ha exigido nuestra subyugación en una mayor unión confederal del Caribe. Estamos en una posición única, ya que la nación es más grande, pero también está lo suficientemente lejos como para permitirnos prepararnos para fuerzas de invasión. Sin embargo, está en el aire si realmente debemos arriesgar un conflicto así."
 southern_republic_event.18.o1: "No nos rendiremos!"
 southern_republic_event.18.o2: "No podemos desperdiciar las vidas de nuestros ciudadanos"
 southern_republic_event.19.t: "Haití rechaza"
 southern_republic_event.19.d: "La mancha de nación ha rechazado nuestras demandas, debemos actuar ahora o mantenernos callados. La situación diplomática es algo tensa, ahora veremos si prevalecerá la razón o la fuerza."
 southern_republic_event.19.o1: "La fuerza de voluntad gana"
 southern_republic_event.19.o2: "No podemos arriesgar esto"
 southern_republic_event.20.t: "Haití acepta"
 southern_republic_event.20.d: "Han aceptado nuestras demandas y comenzaremos a organizar las cosas, hoy es un buen día para nuestra nación."
 southern_republic_event.20.o1: "Otro paso adelante"
 southern_republic_event.21.t: "Demandas sureñas"
 southern_republic_event.21.d: "La nación sureña ha exigido nuestra subyugación en una mayor unión confederal del Caribe. Estamos en una posición única, ya que la nación es más grande, pero también está lo suficientemente lejos como para permitirnos prepararnos para fuerzas de invasión. Sin embargo, está en el aire si realmente debemos arriesgar un conflicto así."
 southern_republic_event.21.o1: "No nos rendiremos!"
 southern_republic_event.21.o2: "No podemos desperdiciar las vidas de nuestros ciudadanos"
 southern_republic_event.22.t: "La República Dominicana rechaza"
 southern_republic_event.22.d: "La mancha de una nación ha rechazado nuestras demandas, debemos actuar ahora o callar. La situación diplomática es un poco tensa, ahora prevalecerá la razón o la fuerza."
 southern_republic_event.22.o1: "La Fuerza de Voluntad Gana"
 southern_republic_event.22.o2: "No Podemos Arriesgarnos a Esto"
 southern_republic_event.23.t: "República Dominicana Acepta"
 southern_republic_event.23.d: "Han aceptado nuestras demandas y comenzaremos a organizar todo, hoy es un buen día para nuestra nación."
 southern_republic_event.23.o1: "Otro Paso Adelante"
 southern_republic_event.24.t: "Acuerdos Sureños"
 southern_republic_event.24.d: "La nación sureña ha pedido cerrar un trato con nosotros. A cambio de formar una unión confederal, nos proporcionarían cualquier ayuda material o monetaria si nuestras islas son dañadas por eventos climáticos extremos. Esto ciertamente ayudaría a aliviar la presión fiscal, pero podría ser una trampa, sin embargo, ¿qué ganaríamos si lo rechazamos... qué hacer, qué hacer?"
 southern_republic_event.24.o1: "No Podemos Aceptar en Este Momento"
 southern_republic_event.24.o2: "No Podíamos Rechazar Tal Trato"
 southern_republic_event.25.t: "The Bahamians Refuse"
 southern_republic_event.25.d: "Los representantes gubernamentales de las Bahamas han rechazado nuestro trato sumamente generoso. Podríamos usar esto como justificación, o podríamos encontrar otras maneras. De cualquier forma, necesitaremos tomar una decisión pronto si queremos mantener el rumbo de nuestros objetivos de política exterior."
 southern_republic_event.25.o1: "Al Diablo, Declaremos la Guerra"
 southern_republic_event.25.o2: "Necesitamos Replantearlo"
 southern_republic_event.26.t: "The Bahamians Accept"
 southern_republic_event.26.d: "Han aceptado nuestras demandas y comenzaremos a organizar todo, hoy es otro paso más hacia nuestra unión regional."
 southern_republic_event.26.o1: "Tantas Islas"
 southern_republic_event.27.t: "La Concesión Sureña"
 southern_republic_event.27.d: "The Southern nation has reached out to us with an offer. They will give us a 100 billion for the sale of our Caribbean lands. These islands do serve a sort of geostrategical purpose, however they do tend to be a general drain on resources. So the choice is do we need the money or do we need these islands."
 southern_republic_event.27.o1: "Nos Vendría Bien el Dinero"
 southern_republic_event.27.o2: "Esas Islas Son Británicas!"
 southern_republic_event.28.t: "Los Británicos Aceptan"
 southern_republic_event.28.d: "The United Kingdom has accepted our concession in acquiring their Caribbean islands and as such integrating these islands will be a fairly simple affair."
 southern_republic_event.28.o1: "Totalmente Vale la Pena"
 southern_republic_event.29.t: "The British Refuse"
 southern_republic_event.29.d: "Los malditos anglos han rechazado nuestra oferta sumamente generosa, el problema es que en este momento no podemos permitirnos un incidente diplomático, por lo que tendremos que replantearlo para el futuro."
 southern_republic_event.29.o1: "Maldita Sea!"
 southern_republic_event.30.t: "La Concesión Sureña"
 southern_republic_event.30.d: "The Southern nation has reached out to us with an offer. They will give us a 50 billion for the sale of our Caribbean lands. These islands do serve a sort of geostrategical purpose, however they do tend to be a general drain on resources. So the choice is do we need the money or do we need these islands."
 southern_republic_event.30.o1: "Nos Vendría Bien el Dinero"
 southern_republic_event.30.o2: "Esas Islas Seguirán Siendo Francesas!"
 southern_republic_event.31.t: "Los Franceses Aceptan"
 southern_republic_event.31.d: "France has accepted our concession in acquiring their Caribbean islands and as such integrating these islands will be a fairly simple affair."
 southern_republic_event.31.o1: "Totalmente Vale la Pena"
 southern_republic_event.32.t: "The French Refuse"
 southern_republic_event.32.d: "Los malditos francófonos han rechazado nuestra oferta sumamente generosa, el problema es que en este momento no podemos permitirnos un incidente diplomático, por lo que tendremos que replantearlo para el futuro."
 southern_republic_event.32.o1: "Sapos Chupadores!"
 southern_republic_event.33.t: "El Acuerdo Sureño"
 southern_republic_event.33.d: "The Southern nation has reached out to us with an offer. They will give us a 25 billion for the sale of our Caribbean lands. These islands do serve a sort of geostrategical purpose, however they do tend to be a general drain on resources. So the choice is do we need the money or do we need these islands."
 southern_republic_event.33.o1: "Nos Vendría Bien el Dinero"
 southern_republic_event.33.o2: "Islas Holandesas para Ciudadanos Holandeses!"
 southern_republic_event.34.t: "Los Holandeses Aceptan"
 southern_republic_event.34.d: "The Dutch have accepted our concession in acquiring their Caribbean islands and as such integrating these islands will be a fairly simple affair."
 southern_republic_event.34.o1: "Totalmente Vale la Pena"
 southern_republic_event.35.t: "The Dutch Refuse"
 southern_republic_event.35.d: "Los malditos zuecos han rechazado nuestra generosa oferta, el problema es que en este momento no podemos permitirnos un incidente diplomático y por eso tendremos que abordar esto para futuras referencias."
 southern_republic_event.35.o1: "Maldición!"
 southern_republic_event.36.t: "Debates sobre la Capital"
 southern_republic_event.36.d: "One of the problems with the old republic was the old capital of D.C. was seen as too far away for a vast majority of the nation. However, its symbolism cannot be discounted as well. We must therefore figure out just where our new capital should be."
 southern_republic_event.36.o1: "D.C. Funcionó Perfectamente"
 southern_republic_event.36.o2: "El Nuevo Plan de Arlington Es Bueno"
 southern_republic_event.36.o3: "Monte Columbia Es Suficientemente Central"
 southern_republic_event.36.o4: "Ulysses Debería Estar Bien"
 southern_republic_event.37.t: "El Nuevo Camino a Seguir"
 southern_republic_event.37.d: "With our policies set in stone and our influences assured we now have the great honor of choosing a new look for our nation. Of course the consensus is to rename the nation to the Confederate States of America as it is only right that we pay tribute to our past and origins. But the question now is the flag. Members of the Dixie First Party want to do the Virginia Battle Flag and update the color scheme so it's not just the Virginia Battle Flag as our great Confederacy is not just the tight asses of Virginian aristocracy. However members of the League of the South wish to take it a step further and use a flag their members have been using a while now which is a plain Virginia Battle Flag with no stars on it but instead a white circle in the center with one large lightning bolt in the center. Some wonder if the latter would be a bit on the nose in terms of political appeal. However more still wonder if its not going far enough, after all this land is truly our land."
 southern_republic_event.37.o1: "El Cambio de Esquema de Colores Funciona"
 southern_republic_event.37.o2: "Lightning Shall Strike Fear Into Our Enemies"
 southern_republic_event.38.t: "Un Nuevo Estándar Nacional"
 southern_republic_event.38.d: "Con la mayoría de la nación a bordo con la forma en que dirigimos las cosas, hay un debate general sobre si nuestra nación realmente se representa a sí misma. Muchos en la izquierda quieren reformar la bandera con simbolismo socialista para sentar un precedente de solidaridad con los trabajadores de la nación. Mientras que aquellos en la derecha quieren retroceder un poco para ser más simbólicos con los orígenes de nuestra nación, reintroduciendo una de las últimas banderas con las que la confederación se representaba. Esta bandera sería la antigua bandera manchada de sangre que tiene una base blanca con una barra roja sólida en el lado derecho y en la esquina superior izquierda se encuentra la Bandera de Batalla de Virginia. En consecuencia, creen que el nombre nacional debería cambiar a simplemente la República de Dixie. Sin embargo, depende del público decidir sobre esto."
 southern_republic_event.38.o1: "La República Socialista será"
 southern_republic_event.38.o2: "Somos la República de Dixie"
 southern_republic_event.39.t: "Avanzando"
 southern_republic_event.39.d: "Con nuestra astucia y la gente disfrutando de su recién encontrado orgullo nacional, buscan una reforma mostrando unidad mientras también rinden respeto a nuestra historia, sin importar si es buena o mala. Por lo tanto, a partir de ahora, seremos conocidos como la Unión Sureña y ondearemos con orgullo la bandera Bonnie Blue."
 southern_republic_event.39.o1: "Una familia sureña de verdad"
 southern_republic_event.40.t: "Viejos hábitos, ¿eh?"
 southern_republic_event.40.d: "Con nuestros caminos establecidos y la gente feliz con este nuevo propósito, creemos que es el momento adecuado para establecer una nueva bandera y un nuevo nombre. Algún día podríamos reclamar el manto. Pero como dicen, los viejos hábitos son difíciles de morir."
 southern_republic_event.40.o1: "Tal vez algún día"
 southern_republic_event.41.t: "El sueño arcadiano"
 southern_republic_event.41.d: "Hoy comienza una nueva era, una que nos lleva a una nueva identidad, un nuevo camino de unidad y una nueva era de prosperidad. Hoy nos convertimos en los pueblos arcadianos."
 southern_republic_event.41.o1: "Por Arcadia!"
 southern_republic_event.42.t: "Debate sobre la capital arcadiana"
 southern_republic_event.42.d: "La nueva nación surge y con ella comienza un nuevo capítulo. ¿Dónde debería estar nuestra capital?"
 southern_republic_event.42.o1: "El viejo confiable será"
 southern_republic_event.42.o2: "Una buena capital central funciona mejor"
 southern_republic_event.43.t: "Resistencia nacionalista"
 southern_republic_event.43.d: "En los días posteriores a nuestra justa victoria en las primeras elecciones de nuestra nación, los paletos y borrachos del desierto de Florida han arrojado más que solo vómito de sus bocas. Aunque no esperamos que esto dé lugar a nada serio, muchos se preguntan cuán tonto es realmente el \"hombre de Florida\"."
 southern_republic_event.43.o1: "Jesús, ¿no esta mierda otra vez?"
 southern_republic_event.44.t: "Creciente descontento"
 southern_republic_event.44.d: "In the aftermath of the supposed \"proclamation\" of statehood, the agitation in the state of Florida has steadily risen over the past few more days. This escalation brings fears that our young nation will soon enough be embroiled in war, not with the federals, great lakers or even the Texans but with our own people... This sad realization has resulted in a pre-emptive expansion in armaments production as a way to get ahead of potentially any trouble that may arise in the coming days."
 southern_republic_event.44.o1: "Dios nos ayude a todos..."
 southern_republic_event.45.t: "Una pelea familiar"
 southern_republic_event.45.d: "They finally did it, the damn Floridians decided that apparently it was just too god damn much to try and work things out. Well by god we'll settle this here and now and make Florida, Southern again. We need to mobilize and set forth what troops we do have to the border."
 southern_republic_event.45.o1: "Crisol de culturas, más como cerebro derretido"
 southern_republic_event.46.t: "Guerra"
 southern_republic_event.46.d: "Ha llegado el momento y recuperaremos lo que legítimamente es nuestro."
 southern_republic_event.46.o1: "Envía a las tropas!"
 southern_republic_event.1000.t: "Defiende nuestras libertades"
 southern_republic_event.1000.d: "Los escoria socialistas desean someternos a una vida de marxismo y pobreza, bueno, no más. Rompe las cadenas y lucha por tus libertades!"
 southern_republic_event.1000.o1: "Nuestro sol brillará más que todos los demás!"
 CSA_event_native_exodus.1.t: "Rumores en Oklahoma"
 CSA_event_native_exodus.1.d: "As we attempt something to organize our nation, rumors are coming out of the far lands of Oklahoma that the native population is looking to leave when and where possible. The threat and stigma of a \"Southern\" nation is still pretty strongly resonating, though who could be surprised considering most natives were relegated to specific chunks of land. We can't do much but hope it doesn't cause trouble for us in the future."
 CSA_event_native_exodus.1.o1: "Espera, si se van, ¿lo conseguimos gratis entonces?"
 CSA_event_native_exodus.2.t: "Migración en aumento"
 CSA_event_native_exodus.2.d: "A medida que continuamos solidificando nuestro control nacional, más y más nativos de la megareserva de Oklahoma, simplemente conocida como \"Territorio Indio\", han continuado organizando movimientos de migración hacia el norte, hacia Kansas. Si bien es un día triste perder a tantas personas, esto significa que, por ende, los esfuerzos de reintegración y volver a poner en línea la economía del estado probablemente serán mucho más fáciles en general."
 CSA_event_native_exodus.2.o1: "¿No deberíamos estar preocupados por cuántos se van?"
 CSA_event_native_exodus.3.t: "¿Migración o éxodo?"
 CSA_event_native_exodus.3.d: "More news out of Oklahoma as news of an organization called the Reclamation Front has been the responsible party for organizing these migration patterns from Oklahoma to Kansas. Reports from the region say that Kansas while under a new governmental entity called the Republic of Lakota is technically under their control, most real efforts have been spent on the northern four states as the debate over a new national capital and rebuilding has been a priority. The RF claims that Kansas is a fine new home away from the other \"colonial ran nations\" and that the Council of Six, a reference to the organization's leadership as well as the six tribes which comprised the mega reservation. The Council has determined Kansas to be a better suited more stable home for which we can claim if need be. We're trying to get more info but it looks like rather than fight us, this supposed Reclamation Front believes the Republic of Lakota would be easier to fight and use Kansas as their one true home."
 CSA_event_native_exodus.3.o1: "¿Crees que deberíamos decírselo? Naaah"
 CSA_event_native_exodus.4.t: "¿Cuántos de ellos había???"
 CSA_event_native_exodus.4.d: "Más noticias desde Oklahoma, ya que se ha alcanzado el número más alto de migrantes fuera del estado. Con estimaciones que superan aproximadamente el siete por ciento de despoblación debido a la migración masiva, muchos se preguntan cuántos nativos componían realmente la población del estado. Sea lo que sea, que Dios los ayude en Kansas, ya que quién sabe qué problemas les están causando los locales."
 CSA_event_native_exodus.4.o1: "Thank God It's No Longer Our Problem"
 CSA_event_native_exodus.5.t: "Una nueva prosperidad"
 CSA_event_native_exodus.5.d: "With migration numbers nearing a stoppage of sorts we have a lot of vacated land, businesses and whatnot. As such these lands and so on can be refurbished and used to create a new prosperity which the state has yet to see. Let's just hope we can keep it that way considering what's led to this somehow fortunate turn of events."
 CSA_event_native_exodus.5.o1: "Bueno, ¿ahora qué?"
 CSA_event_native_exodus.1001.t: "¿Qué ahora?"
 CSA_event_native_exodus.1001.d: "As the debates go on about the new capital, some rumors from the south have begun to reach us. Supposedly an ever-growing influx of native americans have been fleeing Oklahoma and settling into Kansas. While we don't know what the reasonings or if there is an issue to be had at hand here, we do know that right now it is not a problem."
 CSA_event_native_exodus.1001.o1: "Vuelve cuando sea un problema, por favor"
 CSA_event_native_exodus.1002.t: "Otra vez, ¿en serio?"
 CSA_event_native_exodus.1002.d: "Más noticias provenientes de Kansas, aparentemente más nativos han huido a Kansas y, como resultado, el potencial de desarrollo ha aumentado como consecuencia. No me suena tan mal, para ser honesto."
 CSA_event_native_exodus.1002.o1: "¿Hay una razón por la que regresaste?"
 CSA_event_native_exodus.1003.t: "Dios, ¿y ahora qué?"
 CSA_event_native_exodus.1003.d: "Más noticias desde Kansas, ya que un grupo llamado el Frente de Reclamación ha anunciado su intención de ayudar al estado de Kansas a reconstruir y crecer. Esto parece ser un ligero desafío a nuestra autoridad, pero con un estado tan débil y nuestro control solidificándose sobre la mayoría de la nación, no tenemos una preocupación real con estos agitadores."
 CSA_event_native_exodus.1003.o1: "Ahora, ¿puedo centrarme en mi trabajo, por favor?"
 CSA_event_native_exodus.1004.t: "¿Sí?"
 CSA_event_native_exodus.1004.d: "Kansas leadership has expressed their gratefulness in allowing the RF to help rebuild the state, over all things have been pretty peaceful and are looking to be for a while. But many up north are wary as such random kindness does not just happen for the sake of \"good will\". We'll be sending representatives to figure just what we're dealing with soon enough."
 CSA_event_native_exodus.1004.o1: "Envía a los auditores"
 CSA_focus_havana_help: "Ayuda de La Habana"
 CSA_focus_havana_help_desc: "El jugador más grande del Caribe es Cuba. Debemos asegurar este \"gran queso\", si vamos a llegar a algo con las otras naciones. Si es necesario, iremos a la guerra, sin embargo, si se puede evitar la guerra, entonces podemos ahorrar la guerra con los otros pequeños puntos en el mapa."
 CSA_focus_bahaman_bargain: "Oferta bahameña"
 CSA_focus_bahaman_bargain_desc: "Las islas dispersas que conforman las Bahamas corren un riesgo constante de destrucción debido a los huracanes anuales. Nuestra mayor ventaja es que podemos brindar ayuda económica y material a estas islas y a sus habitantes si nos unimos en una unión confederal. Claro que depende de ellos, pero con el tiempo encontraremos la manera."
 CSA_focus_bahama_blast: "Explosión en las Bahamas"
 CSA_focus_bahama_blast_desc: "These scattered islands would make perfect training grounds for future war plans along the gulf. So let's gain some experience then, besides they can't be in any meaningful position for striking deals with."
 CSA_arcadia_path_desc: "[CSA.GetFlag] §YRepública del Sur de América§! Cambia su nombre a §YArcadia§!"
 CSA_rallying_dixies_defenders: "Reuniendo a los defensores de Dixie"
 CSA_rallying_dixies_defenders_desc: "¡Muchachos! ¡Porque debemos plantarle cara al enemigo dondequiera que ataque!"
 CSA_creating_infantry_reserves: "Organizando la Fuerza de Reserva"
 CSA_creating_infantry_reserves_desc: "La creación de una fuerza de reserva lista nos permitirá prepararnos preventivamente para cualquier incursión enemiga o cualquier cosa que podamos planear hacer en el futuro."
 CSA_mobilizing_the_reserves: "Reúne a las reservas"
 CSA_mobilizing_the_reserves_desc: "¡Ánimo, muchachos, porque vuestra patria os necesita! ¡Tomemos el día y preparémonos para cualquier cosa que los norteños y los occidentales se atrevan a lanzarnos!"
 CSA_focus_gran_colombian_sub_regionalism: "Subregionalismo Grancolombiano"
 CSA_focus_gran_colombian_sub_regionalism_desc: "Creating a sort of sub-region within our confederal union will allow for more local cohesions which feed back into our new regional power. Overall we look to set the stage for unity through identity, these nations and sub-regions were proud and good nation-states at one point or another and it's our job to recognize and embrace it in order to properly move forward together as one."
 CSA_focus_soldiers_of_nature: "Soldados de la Naturaleza"
 CSA_focus_soldiers_of_nature_desc: "Las tierras que defendemos son diversas y abundantes. Tan abundantes que es fácil prever que potencias extranjeras deseen apropiarse de ellas. Por lo tanto, debemos entrenar, perfeccionar y moldear a nuestras fuerzas armadas para que comprendan estas tierras tan diversas y así no solo podamos defender nuestros propios hogares. Pero si alguna vez llega el día, podemos despojarnos de nuestra tierra de la lucha y dejar que sea su tierra y su sangre."