 SAU_pipeline_transit_SYR_t1: "Transit par pipeline saoudien (niveau I)"
 SAU_pipeline_transit_SYR_t1_desc: "Le pétrole saoudien traverse la Syrie, et les droits de transit gonflent le Trésor. L'oléoduc élève la construction et la stabilité de la nation. §GRevenu supplémentaire : 1,00 Md $§!"
