 USA_CV_MR_Fighter2: "Boeing F/A-18C/D Hornet"
 USA_CV_MR_Fighter2_desc: "McDonnell Douglas F/A-18 Hornet — двухмоторный сверхзвуковой всепогодный палубный многоцелевой боевой самолёт, созданный одновременно как истребитель и как штурмовик (отсюда и обозначение F/A). Разработанный McDonnell Douglas (ныне Boeing) и Northrop, F/A-18 был создан в 1970-х годах на основе YF-17 компании Northrop для ВМС и Корпуса морской пехоты США."
 USA_CV_MR_Fighter2_short: "F/A-18C/D Hornet"
 USA_CV_MR_Fighter3: "F/A-18E/F Super Hornet"
 USA_CV_MR_Fighter3_desc: "Boeing F/A-18E и F/A-18F Super Hornet — двухмоторные палубные многоцелевые истребители, созданные на базе McDonnell Douglas F/A-18 Hornet. Одноместный F/A-18E и двухместный (с тандемным расположением кресел) F/A-18F — более крупные и совершенные производные F/A-18C и D Hornet. Super Hornet оснащён встроенной 20-мм многоствольной пушкой M61 и может нести ракеты класса «воздух-воздух» и оружие класса «воздух-земля». Дополнительное топливо может размещаться в подвесных топливных баках (до пяти), а при установке подвесной системы дозаправки в воздухе самолёт может использоваться как воздушный заправщик."
