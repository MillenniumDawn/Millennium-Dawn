 nsb_heavy_atgm_tech_1: "ATGM pesado de 1ª Generación"
 nsb_heavy_atgm_tech_1_desc: "Los misiles guiados antitanque pesados ​​(ATGM) fueron uno de los primeros desarrollos en la tecnología de misiles, diseñados para atacar y destruir vehículos blindados. Estos sistemas generalmente empleaban guiado manual por línea de visión (MCLOS), lo que requería que los operadores dirigieran manualmente el misil hacia el objetivo durante todo su vuelo. Este método exigía un entrenamiento exhaustivo y exponía a los operadores al fuego enemigo durante el guiado del misil."
