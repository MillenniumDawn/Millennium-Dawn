 azeev.1.t: "Possível Escalada"
 azeev.1.d: "In recent weeks tension has been building up and now we can escalate situation further, but does it benefit us?"
 azeev.1.a: "Escalar!"
 azeev.1.b: "Pensando melhor..."
 azeev.2.t: "Azerbaijão Solicita Ajuda"
 azeev.2.d: "Com a recente escalada de tensões entre o Azerbaijão e o Irã, o primeiro busca nossa ajuda."
 azeev.2.a: "Nenhuma ajuda para os ímpios."
 azeev.2.b: "Let's make a commitment."
 azeev.2.c: "Eles têm nosso total apoio."
 azeev.3.t: "Visita de Estado"
 azeev.3.d: "Faz sentido fazer uma visita oficial a alguma grande potência estrangeira para solidificar nossa posição. Mas para onde devemos ir?"
 azeev.3.a: "Para a Turquia."
 azeev.3.b: "Para a Rússia."
 azeev.3.c: "Para o Irã, apesar das tensões recentes."
 azeev.4.t: "Cúpula do Petróleo do Azerbaijão"
 azeev.4.d: "O Azerbaijão realiza uma grande cúpula de petróleo e economia, nossos diplomatas foram abordados e propostos com alguns projetos de investimento. Devemos investir?"
 azeev.4.a: "Absolutamente."
 azeev.4.b: "O momento não é oportuno."
 azeev.5.t: "Primeira Ligação"
 azeev.5.d: "With our position still shaky, we need to improve relations with foreign powers before they make their move. What will be the very first call of our chairman?"
 azeev.5.a: "Turquia."
 azeev.5.b: "Rússia."
 azeev.5.c: "Irã."
 azeev.5.e: "China"
 azeev.6.t: "Azerbaijão Pede Ajuda"
 azeev.6.d: "Azerbaijan had been rearming itself for quite some time now, but in their possible conflict they still need more arms, and they had reached out to us. Should we help?"
 azeev.6.a: "Let's do this."
 azeev.6.b: "Eles estão loucos?"
 azeev.7.t: "Rússia Concorda"
 azeev.7.d: "Como esperávamos, a Rússia concordou em compartilhar armas conosco."
 azeev.7.a: "Esplêndido!"
 azeev.8.t: "Rússia Recusa"
 azeev.8.d: "Apesar de todos os nossos esforços, nossas negociações fracassaram e não receberemos nenhuma arma da Rússia."
 azeev.8.a: "Maldição"
 azeev.9.t: "Morte de Heydar Aliev"
 azeev.9.d: "Na noite passada, nosso líder faleceu. Ele liderou nosso país por quase dez anos e agora seu legado terá que enfrentar o teste do tempo."
 azeev.9.a: "Até mesmo as lendas morrem."
 azeev.10.t: "Possible Junta?"
 azeev.10.d: "Nossa agência interna nos informou sobre um possível golpe militar. Generais estavam conspirando nas sombras há algum tempo. Ao mesmo tempo, as evidências parecem ser escassas, no mínimo..."
 azeev.10.a: "Pode ser verdade?"
 azeev.11.t: "Golpe Militar!"
 azeev.11.d: "A few generals of the Armed Forces have taken matters into their own hands and arrested [Root.GetLeader]. The future of our country is now at question, but newly established power assures of stability and peace."
 azeev.11.a: "Como eles puderam?!"
 azeev.16.t: "Turquia Aceita"
 azeev.16.d: "A Turquia concordou em nos fornecer algum equipamento para um possível conflito com o Irã."
 azeev.16.a: "Muito bem."
 azeev.17.t: "Turquia Recusa"
 azeev.17.d: "A Turquia não concordou em nos fornecer ajuda em um possível conflito com o Irã."
 azeev.17.a: "Idiotas."
 azeev.18.t: "Popularidade do Culto a Aliev Mudou"
 azeev.18.d: "Nossas pesquisas recentes indicam que a percepção de Aliev e seu legado mudou na população em geral."
 azeev.18.a: "Let's see."
 aze_news.1.t: "[AZE.GetLeader] Derrubado!"
 aze_news.1.d: "A few generals of the Armed Forces have taken matters into their own hands and arrested [AZE.GetLeader]. With small fights between loyalists and military forces on the streets the situation still looks grim, and the future of Azerbaijan is uncertain."
 aze_news.1.a: "Espera, o quê?"
 aze_news.1.b: "Desenvolvimento interessante."
 azeev.15.t: "Era de Aliev"
 azeev.15.d: "O Azerbaijão, abalado pela perda na guerra de Karabakh, graças aos esforços do ex-líder do partido soviético Heydar Aliyev, conseguiu resistir politicamente, embora tenha sofrido perdas territoriais. Aliyev está tentando construir um sistema hereditário, tentando manobrar entre vários fatores internos e externos. Uma diplomacia flexível entre o Ocidente e o Oriente pode contribuir significativamente para o sucesso futuro do Azerbaijão. No entanto, o povo desencorajado exige paz e democracia, não querendo mais mortes, os nacionalistas exigem guerra total com a Armênia e o Irã, e as forças pró-russas exigem que o status quo seja mantido. Com recursos significativos de petróleo, mas, no entanto, infraestrutura e indústria subdesenvolvidas, o Azerbaijão pode se tornar uma potência regional se não cair no caos econômico e político, incendiado de fora e de dentro."
 azeev.15.a: "Sim..."
 azeev.13.t: "Exército Azerbaijani"
 azeev.13.d: "O exército azerbaijano, que sofreu um colapso absoluto após a derrota na guerra de Artsakh, mas foi patrocinado por vários grupos e países internacionais, está começando sua recuperação gradual. Generais desleais, ideólogos nacionalistas e senhores da guerra são parasitas do exército azerbaijano. É hora de mudar tudo isso."
 azeev.13.a: "De fato."
 azeev.14.t: "Economia Azerbaijani"
 azeev.14.d: "A economia pós-soviética do Azerbaijão após os anos 90 está em declínio profundo. A antiga grande indústria do petróleo e agricultura mal está respirando, permitindo que o Azerbaijão exista de alguma forma. No entanto, investidores estrangeiros e uma quantidade significativa de recursos azerbaijanos possibilitam que o Azerbaijão se torne um país economicamente desenvolvido no futuro."
 azeev.14.a: "Aqui vem o dinheiro!"
