 nsb_gun_technology_1: "Sistemas de Armas Pesadas y Artillería de 1ª Generación"
 nsb_gun_technology_1_desc: "Potentes sistemas de artillería y cohetes diseñados para aumentar la potencia de fuego en el campo de batalla. Este avance introduce obuses pesados, armamento de cohetes a gran escala y munición de artillería especializada para una mayor capacidad destructiva. Además, permite el despliegue de módulos de cohetes, lo que proporciona a las plataformas aéreas un mayor potencial de ataque. Estos sistemas ofrecen un apoyo superior a larga distancia, lo que los hace esenciales para dominar el campo de batalla."
