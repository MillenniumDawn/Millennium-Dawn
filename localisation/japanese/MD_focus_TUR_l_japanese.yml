 TT_TUR_ALIGN_AZERBAIJAN: "\n[AZE.GetName]が我々と同盟を結ぶ意欲はデフォルトで§G強い§!\n\n[AZE.GetName]は以下の場合、我々と同盟を結びやすくなる\n §G-世界観がナショナリズムの世界観である§!\n\n[AZE.GetName]は以下の場合、我々と同盟を結びにくくなる：\n §R-世界観が非同盟の世界観である\n -すでに誰かと同盟を結んでいる§!\n"
 TT_TUR_ALIGN_IRAN: "\n[PER.GetName]が我々と同盟を結ぶ意欲はデフォルトで§G強い§!\n\n[PER.GetName]は以下の場合、我々と同盟を結びにくくなる：\n §R-世界観が新興の世界観ではない\n -すでに誰かと同盟を結んでいる§!\n"
 TT_TUR_ALIGN_IRAQ: "\n[IRQ.GetName]が我々と同盟を結ぶ意欲はデフォルトで§G強い§!\n\n[IRQ.GetName]は以下の場合、我々と同盟を結びにくくなる\n §R-世界観が西側の世界観である\n -彼らがすでに誰かと同盟を結んでいる§!\n"
 TT_TUR_ALIGN_SYRIA: "\n[SYR.GetName]が我々と同盟を結ぶ意欲はデフォルトで§R弱い§!\n\n[SYR.GetName]は以下の場合、我々と同盟を結びやすくなる：\n §G-ハタイの支配権を取り戻した\n -ハタイへの主張を放棄した§!\n\n[SYR.GetName]は以下の場合、我々と同盟を結びにくくなる\n §R-世界観が新興の世界観ではない\n -すでに誰かと同盟を結んでいる\n -積極的にPKKを支援している§!"
 TT_TUR_ALIGN_SYRIA_DEMANDS: "§Y\nシリアはハタイの地位の再検討を要求するかもしれない§!"
 TUR_through_troubles: "困難を乗り越えて"
 TUR_through_troubles_desc: "Turkey is going through an economical crisis right now. We need to assure our people that the government can get through this"
 TUR_conservative_victory: "保守派の勝利"
 TUR_conservative_victory_desc: "The conservatives have won the election and can start bringing more conservative elements of Islam back to Turkey"
 TUR_gulenist_victory: "ギュレン運動の勝利"
 TUR_gulenist_victory_desc: "ギュレン運動は腐敗したAKP党員を追い出した。これは民主主義にとって大きな勝利である。"
 TUR_peace_with_religious_leaders: "宗教指導者との和平"
 TUR_peace_with_religious_leaders_desc: "ギュレン運動は非常に特定のイスラム形態を説いているが、我々がトルコの宗教指導者を考慮に入れることが重要である。我々はすべての宗派が自由に教えを広めることを許可しなければならない。"
 TUR_gulenist_schools: "ギュレン学校"
 TUR_gulenist_schools_desc: "教育はフェトフッラー・ギュレンの主要原則の一つである。適切な教育は心を健康に保ち、人々が正しい考えに従うようにする。"
 TUR_modern_islam: "現代のイスラム"
 TUR_modern_islam_desc: "イスラムは西側の価値観や民主主義と完全に両立する。我々は神への信仰が我々をより良く、より理解のある人々にすることを世界に証明しなければならない。"
 TUR_mobilising_the_movement: "運動の動員"
 TUR_mobilising_the_movement_desc: "ギュレン運動は世界中にメンバーを持っている。我々のネットワークは多くの資源を与えてくれる。"
 TUR_interfaith_dialogue: "異宗教間対話"
 TUR_interfaith_dialogue_desc: "Gülen teaches us to understand other religions. It is important that Islam has good relations with other major religions of the world, so we aren't left behind. We should hold diplomatic talks with clerics of non-Muslim countries"
 TUR_gulenist_funds: "ギュレン運動の資金"
 TUR_gulenist_funds_desc: "ギュレン運動は様々な財団やビジネスで数十億ドルの価値を保持している。我々は体制を助けるためにこれらの資金を動員すべきである。"
 TUR_gulenist_economists: "ギュレン派経済学者"
 TUR_gulenist_economists_desc: "国際的経済学者を大規模に引き抜いて、経済運営について助言を得るために雇うことができる。"
 TUR_gulenist_information: "ギュレン派情報提供者"
 TUR_gulenist_information_desc: "我々の広大なネットワークを使用して、より容易に外国に関する情報を収集することができる。"
 TUR_gulenist_education: "ギュレン派教育"
 TUR_gulenist_education_desc: "Focusing on education will be the key to bringing Turkey forward"
 TUR_the_great_mediator: "偉大な仲介者"
 TUR_the_great_mediator_desc: "フェトフッラー・ギュレンは偉大な指導者、学者、そして外交官である。彼は平和の人であり、世界に平和と繁栄のみを願っている。"
 TUR_approach_tradition: "伝統へのアプローチ"
 TUR_approach_tradition_desc: "我々の勝利は、人々が伝統を切望していることを示した。我々はイスラム世界がルネサンスを経ていること、そして間もなく地球上で支配的な文化となることを示さなければならない。"
 TUR_reduce_freedom_of_press: "報道の自由の削減"
 TUR_reduce_freedom_of_press_desc: "The so called 'free press' is nothing more than a tool to slander Islam and spread the media's vile secular ideas. We need to limit their ability to operate, and shut them down if we have to."
 TUR_mobilise_the_faithful: "信仰者の動員"
 TUR_mobilise_the_faithful_desc: "ギュレン運動は広大であり、多数の支持者が存在する。我々は支持者にトルコへ移住するよう奨励すべきである。"
 TUR_convert_radicals: "急進派の転換"
 TUR_convert_radicals_desc: "ギュレンが教えるイスラムこそが唯一正しいイスラムの形態である。これに同意しない多くの人々がおり、彼らは根絶されなければならない。"
 TUR_beacon_of_islam: "偉大な学者"
 TUR_beacon_of_islam_desc: "フェトフッラー・ギュレンはイスラムの最も偉大な学者であり、彼の教えは世界中で知られるだろう。もちろん、保守的なイスラムを説くことはいくつかの副作用を持つかもしれないが..."
 TUR_economic_reforms: "経済改革"
 TUR_economic_reforms_desc: "経済は混乱しており、我々は迅速にそれを改善する必要がある。現在、経済は外国投資に大きく依存しており、これは我々が変える必要がある何かである。"
 TUR_increase_unemployment_insurance: "失業保険の増加"
 TUR_increase_unemployment_insurance_desc: "The economic crisis has left many Turks without a job. While it will greatly hurt the government's budget, we need to increase the unemployment benefits to keep people alive. It will also inject a small amount of money into the economy, hopefully increasing consumption"
 TUR_small_imf_loans: "小規模IMFローン"
 TUR_small_imf_loans_desc: "The IMF has offered a small loan of $11.4 billion. Many analysts suggest that this is nowhere near enough to help the Turkish economy, but it's doubtful we'll be able to get more from the IMF"
 TUR_large_imf_loans: "大規模IMFローン"
 TUR_large_imf_loans_desc: "With more concessions, we might be able to negotiate with the IMF so that we would be granted a larger loan from them."
 TUR_reduce_foreign_investors: "投資家への依存削減"
 TUR_reduce_foreign_investors_desc: "トルコ経済のほとんどは、他の国々からの絶え間ない海外投資と資本の流れに基づいている。我々は政府資金で経済を注入し、外国市場への依存を減らす必要がある。"
 TUR_more_foreign_investors: "投資家への依存増加"
 TUR_more_foreign_investors_desc: "他の国々からより多くの資本を得るためには、外国投資家を活用する必要があるだろう。"
 TUR_sell_government_companies: "政府企業の売却"
 TUR_sell_government_companies_desc: "いくつかの追加収入を得るために、我々は現在トルコ国家によって所有されている企業の一部を売却する必要がある。"
 TUR_loosen_industrial_regulations: "産業規制の緩和"
 TUR_loosen_industrial_regulations_desc: "成長を奨励するためには、産業規制を緩和する必要がある。これは確実に経済を押し上げるだろう。"
 TUR_economic_crisis_over: "経済危機回復計画"
 TUR_economic_crisis_over_desc: "We need to establish an economic recovery plan as soon as possible if we expect the Turkish nation to thrive monetarily. If we do not, we put our people's lives and jobs at risk and we cannot afford such a massive loss."
 TUR_western_development: "西部の開発"
 TUR_western_development_desc: "我が国の主要都市のほとんどが西部に位置しており、人々はより高い生活水準を期待しているため、開発する必要がある。"
 TUR_centeral_development: "中央部の開発"
 TUR_centeral_development_desc: "我が国の首都アンカラは国の中心に位置している。我々は首都周辺の生活条件を改善し、政治体制が正当性の基盤を持つようにする必要がある。"
 TUR_eastern_development: "東部の開発"
 TUR_eastern_development_desc: "我々はあまりにも長い間東部州を無視してきたが、人々はより良い待遇を受けるべきだ。そこのインフラをアップグレードすることは、農村部の人々をはるかに多く助けるだろう。"
 TUR_southern_attention: "南部への注目"
 TUR_southern_attention_desc: "東部と同様に、我が国の南部も放置されてきた。南部への投資は経済が繁栄するために必要となるだろう。"
 TUR_the_industries: "産業"
 TUR_the_industries_desc: "我々の産業セクターは隣人や同盟国のそれに遅れを取り始めており、我々はそれを変えなければならない。我々はトルコの企業が自力でうまくいくように、我々の予算の一部を割り当てるだろう。"
 TUR_bereket: "ベレケト・エナジー"
 TUR_bereket_desc: "Bereket provides clean and renewable energy to the Turkish people, and it must continue doing that. Extra funding will give them the ability to expand, and grow"
 TUR_petroli_anonim: "トルコ石油公社"
 TUR_petroli_anonim_desc: "トルコ石油公社は1954年に設立され、トルコの石油セクターのために多くのことを達成してきた。我々のために、そして世界の他の地域のために、より多くの石油を生産することに産業の焦点を移す必要がある。"
 TUR_the_factories: "工場"
 TUR_the_factories_desc: "我々の工場は古く、時代遅れで、非効率的になり始めている。我が国の北西部に位置する新しい工場は状況をはるかに改善し、我々はより多くの人々をそこで働かせることができる。"
 TUR_kipas_textile: "キパシュ・テキスタイル"
 TUR_kipas_textile_desc: "Kipas Textile produces some of the highest quality fabrics in our nation, and provides our economy with something to export to other countries"
 TUR_arkas_shipping: "アルカス海運"
 TUR_arkas_shipping_desc: "Arkas is a national shipping company that transports goods globally. It is very obvious what we must do, we must focus on getting them new dockyards so that they may continue to get from place to place without a problem"
 TUR_the_people: "国民"
 TUR_the_people_desc: "我々の経済を改善する上で、我々がそれを改善する理由、すなわち国民を忘れることはできない。人々の生活水準を改善するための国家レベルでの改善を必要とするだろう。"
 TUR_hakarri_trabzone_railway: "ハッキャリ-トラブゾン鉄道"
 TUR_hakarri_trabzone_railway_desc: "We will connect Hakkari and Trabzon, for the folks that live in the east of our country. This way, they are able to get to and from the Trabzon port in case they wish to set out to travel"
 TUR_istanbul_airport: "トルコ航空の拡大"
 TUR_istanbul_airport_desc: "Turkish Airlines is our domestically run airline, and we will start construction on some new airports for them. Our people will be able to easily travel within, and outside of Turkey knowing they are flying on a Turkish plane"
 TUR_the_neighbors: "隣人たち"
 TUR_the_neighbors_desc: "我々を取り囲む隣人たちは、我々の経済危機を解決する上で不可欠だろう。我々は国家間の影響力と経済的なつながりを収穫するために投資を利用するだろう。"
 TUR_look_west: "西側の隣人"
 TUR_look_west_desc: "我々の西側の隣人であるギリシャとブルガリアは、経済に関してかなりの問題を抱えてきた。したがって、彼らは有望な経済ハブであり、彼らへの投資は賢明な判断だろう。"
 TUR_look_east: "東側の隣人"
 TUR_look_east_desc: "我々の東側の隣人であるイラン、アルメニア、ジョージアはすべて経済成長と崩壊を経験してきた。我々は彼らの経済がもう少し成長するのを助けるために彼らに投資する。"
 TUR_the_military: "軍部"
 TUR_the_military_desc: "軍部は我々の経済を浮かせ続ける上で非常に不可欠となるだろう、願わくば、彼らがクーデター起こさないことを祈ろう。"
 TUR_fix_samsites: "Repair SAM Sites"
 TUR_fix_samsites_desc: "The SAM sites in our nation are starting to grow old. If we expect them to function properly, we are going to have to repair them."
 TUR_ministry_of_defense_repairs: "国防省の満足"
 TUR_ministry_of_defense_repairs_desc: "国防省は我々にもっと軍事産業を開くよう求めてきた。そして今日、我々はまさにそれを彼らに与えるだろう。"
 TUR_funds_for_tubitak_sage: "TUBITAK SAGE"
 TUR_funds_for_tubitak_sage_desc: "TUBITAK Sage is our nation's Research and Development institute. If we want our military technology to be up to date, we are going to have to give them some extra facilities."
 TUR_stage_two: "第二段階"
 TUR_stage_two_desc: "我々はついに我々の経済計画の第二段階に入っている。この段階では、経済刺激を増加させ、統治を中央集権化する。"
 TUR_economic_stimulation: "経済刺激策"
 TUR_economic_stimulation_desc: "我々は経済を回し、手動ではなく自然に成長させるために、経済に追加資金を注入する。"
 TUR_national_power_grid: "国家電力網の拡大"
 TUR_national_power_grid_desc: "Due to an increase in our nation's population, the power grid is unable to properly function as a result of more people using electricity, causing an uptick in blackouts. By expanding it, we will be able to provide stable power for all households across the nation"
 TUR_the_budgets: "予算改訂"
 TUR_the_budgets_desc: "我々は予算を改訂し、何を優先すべきか、そして何を優先すべきでないかを見る必要がある。"
 TUR_funds_for_social_spending: "社会福祉への優先的資金提供"
 TUR_funds_for_social_spending_desc: "我々の国民、特に退職者と障害者は、生活を続けるために政府資金に依存している。我々は困っている時に彼らを助けることを優先する必要があるだろう。"
 TUR_funds_for_healthcare: "医療への優先的資金提供"
 TUR_funds_for_healthcare_desc: "人々は確実に病気になる。我々は、医療を必要とする人々が破産せず危機的状況から脱出するのを助けるために医療支出を優先する必要があるだろう。"
 TUR_funds_for_tubitak_mam: "TUBITAK MAM"
 TUR_funds_for_tubitak_mam_desc: "TUBITAK Mam is a domestically run research center, and we will need to utilize them to find cheap, but effective new solutions for our people's health and well-being"
 TUR_stage_three: "第三段階"
 TUR_stage_three_desc: "第三段階は、我々の経済を知識経済へと移行させることを優先する。これで、人々はきれいなお金を稼ぐために適切な教育を受けるようになるだろう。"
 TUR_research_grants: "研究助成金の発行"
 TUR_research_grants_desc: "We will issue research grants for our scientists and students to find new solutions to everyday life. This way, we will be able to modernize faster than ever before, and it will let us expand our technological capabilities"
 TUR_energy_research: "エネルギー研究"
 TUR_energy_research_desc: "In Stage One of our economic plan, we gave funding to an energy company to get our energy sector more efficient. However now we will have to find new ways to deliver and produce this energy so that we can cut down costs where needed"
 TUR_industrial_research: "産業研究"
 TUR_industrial_research_desc: "我々は日々、より多くのものを生産し始めたい、そのため商品を生産するための新しい方法を見つけなければならない。"
 TUR_electronic_research: "電子工学研究"
 TUR_electronic_research_desc: "全世界がデジタル化しており、トルコも例外ではない。我々は新技術を研究し始めており、それを助けるために新企業をいくつか立ち上げるつもりだ。"
 TUR_tubitak_space: "TUBITAK UZAY"
 TUR_tubitak_space_desc: "TUBITAK Space will be our domestically run space technology institute, and they will seriously assist in getting us ahead when the time comes to go to space"
 TUR_sattelite_development: "衛星開発"
 TUR_sattelite_development_desc: "人と人がつながる新しい時代に、我々は国民が世界とつながるための新しい衛星技術を開発する。"
 TUR_gokturk_launch: "ギョクテュルク衛星打ち上げ"
 TUR_gokturk_launch_desc: "我々は地球の高品質画像を得やすくするために、ギョクテュルク-1A衛星を宇宙へ打ち上げる。それは国民と軍隊の両方を支援するだろう。"
 TUR_funds_for_tai: "トルコ航空宇宙産業の拡大"
 TUR_funds_for_tai_desc: "もし我々が雇用を増やしたいならば、トルコ航空宇宙産業を拡大し始める必要がある。我々はそれを軍事化し始め、宇宙戦争技術を生産し始めるだろう。"
 TUR_asteroid_mining_missions: "小惑星採掘ミッション"
 TUR_asteroid_mining_missions_desc: "我々は地球上の資源を節約し、貴重な金属と資源を得るために小惑星を採掘し始める。"
 TUR_drilling_technology: "掘削技術"
 TUR_drilling_technology_desc: "今や小惑星採掘を開始したので、より大きくより硬い小惑星を採掘するために新しい掘削技術が必要となるだろう。"
 TUR_launching_facilities: "発射施設"
 TUR_launching_facilities_desc: "小惑星へのミッションを打ち上げるためには新しい発射施設が必要となるだろう。我々が持っているものは時代遅れで崩壊し始めており、新しいものが不可欠だ。"
 TUR_mission_to_moon: "月面のトルコ人"
 TUR_mission_to_moon_desc: "我々はトルコの宇宙飛行士を訓練し、月へのミッションのための宇宙船を準備するだろう。"
 TUR_stage_four: "第四段階"
 TUR_stage_four_desc: "Stage Four, the last and final stage for our economy is going to be focused on our domestic policies and people's daily lives"
 TUR_peoples_education: "The People's Education"
 TUR_peoples_education_desc: "教育は不可欠であり、国民が読み書きできるように、教室での教育を必要とするだろう。"
 TUR_the_security_of_people: "人民の安全保障"
 TUR_the_security_of_people_desc: "国民が身の安全を感じていないのなら、彼らの経済活動への参加は期待できない。"
 TUR_destroying_corruption: "汚職の破壊"
 TUR_destroying_corruption_desc: "我々の経済セクターには、国を改善するためのお金を自分のために盗る腐った人たちがいる。"
 TUR_the_great_economy: "偉大なるトルコ経済"
 TUR_the_great_economy_desc: "ついに、ついに我々は数年前からの目標を達成した！血と汗と涙をもって、我々はついに偉大なるトルコ経済を達成したのだ！"
 TUR_tubitak: "TUBITAKの拡大"
 TUR_tubitak_desc: "我々は新しい産業技術の研究を含むようにトルコ科学技術研究会議（TUBITAK）を拡大するつもりであり、そうすれば我々は経済をさらに改善することができる。"
 TUR_turkish_agriculture: "トルコの農業"
 TUR_turkish_agriculture_desc: "Large portions of our nation run on agriculture, and urbanized fields. And because of that, we must double our efforts in providing functional technology for the farmers and workers."
 TUR_turkish_mining: "トルコの鉱業"
 TUR_turkish_mining_desc: "我々はかなりちゃんとした鉱業を持っており、それは我々の工場と市場への材料の供給を助けることができる。"
 TUR_expansion_of_fuel_industries: "燃料産業の拡大"
 TUR_expansion_of_fuel_industries_desc: "燃料産業の拡大は、我々がますます工業化、機械化されるにつれ、長期的には我々にとって有益となり得る。"
 TUR_bridge_to_europe: "ヨーロッパへの架け橋"
 TUR_bridge_to_europe_desc: "我々はヨーロッパへの架け橋であることから、彼らにとって非常に財政的に重要である。我々は世界における立場を活用し、可能な限り多くのお金を稼ぐ必要がある。"
 TUR_taek: "TAEK"
 TUR_taek_desc: "トルコ原子力庁（TAEK）は、トルコ国内での原子力発電の開発を計画し確立することを任務としている。"
 TUR_double_steel_efforts: "鉄鋼生産倍増計画"
 TUR_double_steel_efforts_desc: "我々は鉄鋼と金属の大きな輸出国であり、より多く輸出し、より多く稼げるように、我々の努力を倍加しなければならない。"
 TUR_togg: "TOGG"
 TUR_togg_desc: "TOGG is an acronym for Türkiye'nin Otomobili Girişim Grubu. It is an automobile manufacturer of electric vehicles within our nation, and it is best that our government supports them with new facilities."
 TUR_textiles_ethiopia: "エチオピアにおけるトルコ繊維"
 TUR_textiles_ethiopia_desc: "我々はエチオピアでいくつかの小さな繊維工場を運営しているが、我々の経済的影響力を拡大できるように、それらを倍増させる方が良いだろう。"
 TUR_standardize_construction_regulations: "建設規制"
 TUR_standardize_construction_regulations_desc: "我々の建設規制は至る所にあり、不安定な建物の創設につながり、それはいつか災害につながる。我々は規制を強化、標準化し、我が国全体で普遍的になるようにしなければならない。"
 TUR_telecommunications_authority: "電気通信庁"
 TUR_telecommunications_authority_desc: "電気通信庁（ICTA）は、標準化された通信センターと電気通信回線を創設することを任務としている。"
 TUR_tighten_housing_regulation: "住宅規制"
 TUR_tighten_housing_regulation_desc: "Over 40% of our nation's housing does not conform with standard regulations, we are going to have to change that. We will run mandatory inspections and fix whatever is necessary."
 TUR_the_mafia: "マフィア"
 TUR_the_mafia_desc: "マフィアは長きにわたって問題を引き起こしており、もし我々が真の安定を望むならば、我が国からの彼らの影響力をゆっくりと取り除き始めるのが最善である。"
 TUR_end_of_organized_crime: "組織犯罪の標的化"
 TUR_end_of_organized_crime_desc: "Organized Crime is quite common in Turkey, in fact, it is running rampant now more than ever. We are going to have to target organized crimes and criminals, so that they stop disrupting daily life, and stop making governing so difficult."
 TUR_combat_their_influence: "マフィアの影響力との戦い"
 TUR_combat_their_influence_desc: "We need to combat the Mafia's influence to prevent our youth from being sworn into a life of never-ending crime."
 TUR_begin_arrests: "逮捕の開始"
 TUR_begin_arrests_desc: "Though our list of high-priority criminals is quite small at the moment, we should at least start by arresting the current suspects that we know of. We can perhaps use them to discover more of them through interrogation."
 TUR_anti_mafia_initiative: "反マフィアキャンペーン"
 TUR_anti_mafia_initiative_desc: "マフィアへの参加を思いとどまらせるキャンペーンを開始することにより、我々は数えきれないほどの命を救うことができる。"
 TUR_awareness_campaigns: "学校でのプログラム"
 TUR_awareness_campaigns_desc: "若年齢で反マフィア感情を持たせることが不可欠であり、我々は学校でプログラムを開始することによってこれを達成できる。"
 TUR_tighten_police_training: "警察訓練の強化"
 TUR_tighten_police_training_desc: "我々の警察は時に非専門的である可能性があり、そのため彼らの訓練を強化する必要がある。"
 TUR_install_cctv: "新しいCCTV"
 TUR_install_cctv_desc: "悲しいことに、監視が犯罪者を現行犯で捕まえる唯一の方法となるようだ。いくつかの反発にもかかわらず、我々にはこれを行う以外に選択肢はない。"
 TUR_tighten_border_patrol: "国境警備の強化"
 TUR_tighten_border_patrol_desc: "Criminals are bringing in drugs and illegal goods from the outside, and this is a clear indicator that our border patrol is not effective. We are going to increase border patrol to mitigate the flow of illegal goods from other borders."
 TUR_assistance_to_iraq: "イラクへの支援"
 TUR_assistance_to_iraq_desc: "イラクは現在犯罪に溺れており、その多くは麻薬関連である。我々は彼らが麻薬問題を管理できるように、専門知識を彼らに提供できる。"
 TUR_only_getting_started: "始まったばかり"
 TUR_only_getting_started_desc: "We are only getting started. Now that the government has been overrun by our organizations, we can start shaping the region, and ultimately the world to better fit our agenda, the Mafia's Agenda."
 TUR_contact_italian_mafia: "イタリアンマフィアへの接触"
 TUR_contact_italian_mafia_desc: "イタリアンマフィアはイタリアで暴れ回っており、政府は彼らを封じ込める上で非常に効果的ではなかった。我々は彼らの地位を強化するために支援と援助を提供することができる。"
 TUR_utilize_gray_wolves: "灰色の狼との同盟"
 TUR_utilize_gray_wolves_desc: "灰色の狼は過去に我々を助けてくれた。その理由から、我々は今彼らと同盟を結び、国家の統治を助けてもらえる。"
 TUR_start_global_campaign: "グローバルキャンペーンの開始"
 TUR_start_global_campaign_desc: "Our job is not done yet, we need to go international. The Mafia's reach is going to be unlimited, and we will benefit from the chaos."
 TUR_defund_police: "警察への資金提供停止"
 TUR_defund_police_desc: "The Police are quite disloyal to us, and for that reason, we need to curb their ability to fight against us. We will do this by defunding them, and seizing their weapons for ourselves."
 TUR_invite_landowners: "地主の招待"
 TUR_invite_landowners_desc: "地主は裕福なエリートであり、彼らと同盟を結ぶべきである。我々は彼らの支持を得ることができ、彼らと友人であることからより多くのお金を稼ぐことができる。"
 TUR_take_out_iran: "イランの掌握"
 TUR_take_out_iran_desc: "もし我々がイランを排除すれば、我々はさらに多くの国々へのアクセスを持つだろう。我々はイランに侵攻し、我々の影響力をアジアへとさらに輸出するためのハブとして利用するだろう。"
 TUR_central_asia: "中央アジアへ"
 TUR_central_asia_desc: "中央アジア市場はマフィアの商品にとって機が熟している。我々はこれらの市場を開き、利益を上げるために利用する。"
 TUR_the_armed_forces_of_turkiye: "トルコ軍"
 TUR_the_armed_forces_of_turkiye_desc: "The Armed Forces of Turkey, or otherwise known as the TSK, are tasked with protecting Turkey's territorial integrity and its people."
 TUR_ground_force: "陸上部隊"
 TUR_ground_force_desc: "The Land forces are the men who have boots on the ground, fighting the wars within a nation's borders. The ground forces mainly consist of Infantry and Mechanized units."
 TUR_battery_bases: "TEL砲台"
 TUR_battery_bases_desc: "我々のTEL砲台の兵器庫は老朽化し始めており、誤動作は珍しくない。我々が柔軟な発射システムを持つことを保証するために、できるだけ早く新しいものを建設しなければならない。"
 TUR_fortify_east: "東部の要塞化"
 TUR_fortify_east_desc: "我が国の東部は最も多くの混乱を見てきた。内部抵抗から、敵軍による侵略まで、東部を要塞化しないのは愚かな動きとなるだろう。"
 TUR_fortify_west: "西部の要塞化"
 TUR_fortify_west_desc: "Although the West of our country is more secure than the East, we can never be certain. Rising tensions with our neighbors have made the matter tricky, and for that reason we cannot take any risks."
 TUR_silos: "新サイロ"
 TUR_silos_desc: "現在我々にはミサイルサイロがない。そしてもし我々が大国であることを期待するならば、いくつか建設する必要があるだろう。建設はすぐに開始され、我々は敵が遠ざかるよう世界にそれを知らせるだろう！"
 TUR_sam_sites: "空の確保"
 TUR_sam_sites_desc: "SAM Sites will be crucial to close down our airspace if needed. Due to the nature of modern jets, we cannot always rely on our own aircraft to shoot them down, we will need Sam Sites, and a good amount of them."
 TUR_abm_bases: "ABM基地"
 TUR_abm_bases_desc: "Since we were capable of getting Missile Silos and the ability to launch missiles at a reasonable distance, we should also be wary of the other nations that have this same capability. We are going to have to build ABM bases to ensure we are able to shoot down enemy missiles in time."
 TUR_the_soldiers: "兵士たち"
 TUR_the_soldiers_desc: "我々の兵士こそが我々の軍隊を作るものである。我々は彼らが戦闘で準備できるように、最新かつ最高の技術で彼らを装備する必要がある！"
 TUR_tanks: "新戦車"
 TUR_tanks_desc: "すべてのヨーロッパが戦車備蓄を近代化しており、トルコも同じことをしなければならない。我々は国家が今後何年も使用できる現代的な戦車を設計するために、トップエンジニアを得るだろう。"
 TUR_afvs: "IFV"
 TUR_afvs_desc: "陸上戦闘は、IFVやAPCのような装甲歩兵車両へとシフトし始めている。我々は適応し、同じことをしなければならないだろう。"
 TUR_troop_carriers: "兵員輸送車"
 TUR_troop_carriers_desc: "我々の兵士は安全かつタイムリーな方法で戦場へ到達する方法を必要としている。APCはこれを達成するために我々が生産できる最高の装備である。"
 TUR_mandatory_draft_woman: "兵士としての女性"
 TUR_mandatory_draft_woman_desc: "性別に関わらず、誰もが我々の軍隊で奉仕しなければならない。女性は我々の社会の半分を構成している、それではなぜ彼女らを徴兵法から疎外すべきなのか？"
 TUR_other_use_woman: "Women in the Research Sector"
 TUR_other_use_woman_desc: "我々は研究に関して追加の支援を必要としており、我々の女性は積極的に軍隊で奉仕していない。だから、我々が彼女らを教育し、部隊のための最先端技術を創り出させるのが最善である。"
 TUR_new_artillery: "火砲備蓄の近代化"
 TUR_new_artillery_desc: "Our Artillery Stockpiles are starting to fall apart. This cannot continue, as artillery has consistently proved itself throughout history to be a way for armies to stage attacks before they even start!"
 TUR_the_airforce: "トルコ空軍"
 TUR_the_airforce_desc: "The Turkish Air Force is the aerial branch of the Turkish Armed Forces, and they are mainly tasked with maintaining Turkish Air Superiority in times of combat, whilst also maintaining Turkey's aerial integrity."
 TUR_expand_jet_program: "国産ジェット計画"
 TUR_expand_jet_program_desc: "Jets are now the key player when it comes to aerial combat. We will need to try and start researching ways to create domestic aircraft so that we can drop our reliance on others."
 TUR_air_superiority: "制空戦闘機"
 TUR_air_superiority_desc: "If we don't have air superiority, then we don't have anything. Developing air superiority fighters should be a very high priority as we are able to guarantee our close air support's safety."
 TUR_cas: "近接航空支援"
 TUR_cas_desc: "現代戦闘において、地上部隊への戦闘支援のための航空支援の呼び出しはそれほど珍しくない。なのでトルコは国内生産のためにいくつかの新しいCAS技術を開発する必要がある。"
 TUR_open_drone_research: "ドローン＆ヘリコプター"
 TUR_open_drone_research_desc: "しばしば他の航空機によって影が薄くなるが、ドローンとヘリコプターは戦闘において不可欠となり得る、特に地上の部隊にとって。"
 TUR_new_helicopters: "新型ヘリコプター"
 TUR_new_helicopters_desc: "ヘリコプターは必要に応じて兵士や他の人員を戦場へかなり迅速に輸送するのを助けることができ、そのような必要性を見過ごすことは我々側の間違いとなるだろう。"
 TUR_baryaktars: "Bayraktars"
 TUR_baryaktars_desc: "We will have to develop a domestic drone that is capable of taking out enemy targets from a pretty good distance. The Bayraktar will do just that!"
 TUR_purchase_from_others: "市場への注目"
 TUR_purchase_from_others_desc: "我々は国内航空機を開発するために経済にあまりにも多くのストレスをかけることはできない。だから我々はまた東側、そして西側からいくつか購入することを検討すべきである。"
 TUR_british_jets: "イギリス製制空戦闘機"
 TUR_british_jets_desc: "イギリス空軍の歴史は古く、航空機もかなり年季が入っている。彼らからいくつか航空機を購入することは賢明な判断となるだろう。"
 TUR_american_jets: "アメリカ製マルチロール機"
 TUR_american_jets_desc: "アメリカは世界の超大国であり、現在最高の空軍を誇っている。これは彼らからいくつかのマルチロール機を購入することが我々の最善の利益であることを意味する。"
 TUR_russian_jets: "ロシア製打撃戦闘機"
 TUR_russian_jets_desc: "ロシア人は打撃戦闘機に関して専門家であり、彼らは我々にいくつかのユニットを売る意思がある……代償を伴って。"
 TUR_chinese_jets: "中国製爆撃機"
 TUR_chinese_jets_desc: "現在我々は空軍に爆撃機が不足しているが、中国人はそうではない。我々が遅れを取らないように、彼らからいくつかのユニットを購入することができる。"
 TUR_the_navy: "トルコ海軍"
 TUR_the_navy_desc: "トルコ海軍はトルコ軍の海上部門であり、その基盤は1081年まで遡る。"
 TUR_upgrade_bosphorus_fleet: "ボスポラス艦隊のアップグレード"
 TUR_upgrade_bosphorus_fleet_desc: "ボスポラス艦隊は主に時代遅れのフリゲートとコルベットで構成されており、それは彼らが戦争時に大きくより先進的な艦艇によって容易に一掃される可能性があることを意味する。"
 TUR_frigate_upgrades: "フリゲート艦のアップグレード"
 TUR_frigate_upgrades_desc: "我々がかなりの数のフリゲートを持っているが、それらはあまり先進的ではない。我々はそれらが戦闘で持ちこたえることができることを保証するために、それらのいくつかをアップグレードする必要がある。"
 TUR_fortify_istanbul: "イスタンブールの要塞化"
 TUR_fortify_istanbul_desc: "Istanbul is constantly at risk of bombardment and attack due to its close proximity to the Bosphorus. If an enemy fleet tries to pass through, Istanbul will be the closest major city for them to attack and destroy."
 TUR_new_corvettes: "新型コルベット"
 TUR_new_corvettes_desc: "我々はコルベットをあまり持っていないため、古い艦隊のアップグレードをあまり気にすることなく新しいモデルを研究し創造できる。"
 TUR_bosphorus_taxation: "海兵隊との演習"
 TUR_bosphorus_taxation_desc: "我々がいつでも海軍侵攻の準備ができているように、トルコ海兵隊と演習を行う必要がある。"
 TUR_mediteranean_fleet: "Mediterranean Fleet"
 TUR_mediteranean_fleet_desc: "Our Mediterranean fleet is of a very high priority, as it is the fleet that ensures our nation an access to the outside without having to interfere with the Aegean."
 TUR_new_submarine: "新型潜水艦"
 TUR_new_submarine_desc: "我々は下から敵船を奇襲できるように潜水艦を必要とする。"
 TUR_new_cruisers: "新型巡洋艦"
 TUR_new_cruisers_desc: "Cruisers are arguably some of the most important ships we could have deployed, as they are typically the largest ship in a fleet besides an aircraft carrier."
 TUR_new_heli_pads: "航空母艦"
 TUR_new_heli_pads_desc: "大国は世界舞台での支配権を主張するために新しい航空母艦を建造し始めている。我々も同じことをしなければならず、我々自身の航空母艦を建造し始めなければならない！"
 TUR_tcg_anadolu_plans: "イスタンブール・フリゲートの配備"
 TUR_tcg_anadolu_plans_desc: "我々はTCGイスタンブールと呼ばれる最先端のフリゲートを建造しており、それは配備準備ができている！"
 TUR_navy_regulations: "海軍規制の強化"
 TUR_navy_regulations_desc: "品質は量よりも評価されなければならず、その理由から我々は海軍のための新規艦船を生産する際に規制を増加させなければならないだろう。"
 TUR_tsk_coup: "TSKの政治介入"
 TUR_tsk_coup_desc: "Our people are in grave danger of being overrun by Islamist ideology and their dangerous political views. The TSK is the only viable group that can be trusted with protecting the Turkish Republic's ideals."
 TUR_crush_kurdish_resistance: "クルド人の抵抗を粉砕"
 TUR_crush_kurdish_resistance_desc: "効果的な戦術を使用し、我々はクルド人の抵抗を彼らが回復するのが困難な点まで粉砕するだろう。"
 TUR_crush_radicalism: "急進主義の粉砕"
 TUR_crush_radicalism_desc: "急進主義はこの国家の没落となるだろうから、直ちに粉砕しなければならない。"
 TUR_upgrading_mili_infrastructure: "軍事産業の強化"
 TUR_upgrading_mili_infrastructure_desc: "我々の軍事産業は最近かなり不足しており、もし我々が適切な装備を配備したいならば、我々はそれらを少し強化する必要があるだろう。"
 TUR_subdue_kurdish_independence: "東部作戦"
 TUR_subdue_kurdish_independence_desc: "アルメニア人とジョージア人はすでにCSTOにいるか、潜在的なCSTOメンバーである。我々はその組織に彼らが参加するのを防ぐために作戦を実施しなければならないだろう。"
 TUR_root_out_ulama: "ウラマーの根絶"
 TUR_root_out_ulama_desc: "The Ulama do not wish to see a secular and non-islamist Turkey, and they most likely pray for our downfall. We will purge their positions in office if they have any, and we will replace them with maritime conglomerates."
 TUR_ban_islamist_parties: "イスラム主義政党の追放"
 TUR_ban_islamist_parties_desc: "以前の政権が対処できなかった問題の一つが、政治におけるイスラム主義者の台頭である。我々は我が国が危険なイデオロギーに曝されないように、彼ら全員が選挙に参加することを直ちに禁止しなければならない。"
 TUR_military_conglomorates: "軍産複合体"
 TUR_military_conglomorates_desc: "トルコ政治へのTSKの台頭のため、多くの軍事企業が我々の政府におけるより多くの代表権を求めて押し進めている。我々は非常に簡単にこれを彼らに与えることができるが、代償として、我々のコングロマリットを疎外することとなる。"
 TUR_train_foreign_troops: "外国軍の訓練"
 TUR_train_foreign_troops_desc: "Our armed forces has the capability to train other nations' armies without a problem. Doing it will give us influence, and experience."
 TUR_secularist_dominance: "世俗主義者の支配"
 TUR_secularist_dominance_desc: "Secularism will dominate our politics, just like it historically should have. Our nation will follow the path it was always intended to."
 TUR_reform_mit: "MIT改革"
 TUR_reform_mit_desc: "MIT is our nation's intelligence agency, and it needs reforming to better fit the agenda of our Armed Forces."
 TUR_new_airbases: "新航空規定"
 TUR_new_airbases_desc: "空軍のために新しい規定を可決することは、パイロットが適切な訓練を受け、戦闘中に正しい戦略を使用することを確実に保証するだろう。"
 TUR_cooperate_mit: "MITの活用"
 TUR_cooperate_mit_desc: "MITで働く資産とエージェントの活用は、軍隊が情報とデータを収集するために有用かもしれない。"
 TUR_military_dominance: "軍事的覇権"
 TUR_military_dominance_desc: "The new laws, changes, and overhauls to the system have ensured that the Military will have hegemony and control over all aspects of Turkish Politics."
 TUR_our_society: "トルコ社会"
 TUR_our_society_desc: "Turkish Society is constantly changing and evolving into something new. Though the government's role is typically limited when it comes to this due to certain restraints, there have been times where we needed to intervene and there will be times where we will have to intervene to make changes to our policies."
 TUR_mit: "MIT"
 TUR_mit_desc: "MIT is our nation's intelligence agency tasked with protecting the government and policies of the nation from internal and external threats."
 TUR_domestic_focus: "国内重視"
 TUR_domestic_focus_desc: "MITは、危険理想を広めて政府転覆を望む者など、国内の脅威から国家を保護することに焦点を当てるべきである。"
 TUR_foreign_focus: "国外重視"
 TUR_foreign_focus_desc: "人々は決して自国に害を及ぼしたいなんて思わないため、MITは国外からの脅威について心配すべきである。"
 TUR_disaster_relief: "災害対策"
 TUR_disaster_relief_desc: "現在、災害対策がない。これは、国民を保護し援助する準備ができていないことを意味する。"
 TUR_charity_based: "慈善主導システムの確立"
 TUR_charity_based_desc: "災害が発生した場合、慈善団体が国民をカバーするため、支出をかなり削減できる。"
 TUR_government_reliant: "政府主導システムの確立"
 TUR_government_reliant_desc: "災害が発生した場合に国民の援助をするのは政府の仕事である。たとえそれが支出増加を意味するとしても。"
 TUR_migration_problems: "移民問題"
 TUR_migration_problems_desc: "我々は常に国への移民流入問題を抱えてきた……しかし、彼らの母国での問題が終わった後、彼らをどうすればいいかはわからない。"
 TUR_open_door_policy: "門戸開放政策"
 TUR_open_door_policy_desc: "門戸開放政策を選択することにより、入ってくる移民を容易に活用して国家をより良くし、発展させることができる。"
 TUR_closed_borders: "国境閉鎖"
 TUR_closed_borders_desc: "単に国境を閉鎖することによって、国に入ってくる移民を完全に排除でき、それによって問題を解決できる。"
 TUR_drug_problem: "薬物問題"
 TUR_drug_problem_desc: "時々、薬物は医療用途に必要とされるが、それは特定の個人がシステムを悪用し、危険な結果を伴う娯楽目的で使用するのを止めるものではない。"
 TUR_tighten_punishments: "より厳しい姿勢"
 TUR_tighten_punishments_desc: "言い訳が何であれ、医療用途以外の目的で薬物を使用する者は誰でも犯罪者となるだろう。"
 TUR_relax_restrictions: "制限緩和"
 TUR_relax_restrictions_desc: "たとえ国民が娯楽目的で薬物を使用したいとして、なぜ気にする必要がある？おそらく、いくつかリスクがあるとしても、やりたいことをやらせるべきだろう。"
 TUR_rising_nationalism: "ナショナリズムの台頭"
 TUR_rising_nationalism_desc: "ナショナリズムは良いものではあるが、過剰になると悪いものになる場合がある。国内のナショナリズムは問題を引き起こし、少数派組織間で争いが勃発している。"
 TUR_utilize_it: "ナショナリズムの活用"
 TUR_utilize_it_desc: "We will utilize nationalism to our advantage, this way the enemy will know that the Turkish people won't sit back idly by in times of war."
 TUR_combat_it: "ナショナリズムと戦う"
 TUR_combat_it_desc: "国境内でさらなる不安定さを危険にさらすことはできないため、ナショナリズムと戦わなければならない。"
 TUR_turkish_medias: "メディア"
 TUR_turkish_medias_desc: "メディアはかなり大きくなっており、国内での技術利用がますます増えているため、メディアは政策や党の人気にかなりの影響を与える可能性がある。"
 TUR_deal_with_journalists: "ジャーナリスト"
 TUR_deal_with_journalists_desc: "もちろん、ジャーナリストはすべてのメディアの背後にある力である。彼らは意見を述べる者であるが、彼らの意見は時には有益ではなく有害である可能性がある。"
 TUR_passive_aggressive_approach: "受動攻撃的アプローチ"
 TUR_passive_aggressive_approach_desc: "やあ、ジャーナリストくん……昨夜の私の髪に関する発言はあまり好きではなかったのだが、少し言葉遣いを変えてくれないか……？もちろん、強制するつもりはないが、私の支持者は……時々乱暴になることがあってね。"
 TUR_no_restrictions: "制限なし"
 TUR_no_restrictions_desc: "機能的な民主主義では、誰もが好きなことを言う権利がある。ジャーナリストもこの点では変わらないだろう。"
 TUR_close_kurdish_medias: "クルドメディア閉鎖"
 TUR_close_kurdish_medias_desc: "By closing Kurdish Medias, we will be able to restrict the strength of the PKK and therefore consolidate our control over what information is spread. Though, they may get a little upset."
 TUR_sponsor_kurdish_medias: "クルドメディア許可"
 TUR_sponsor_kurdish_medias_desc: "平和的に共存できることをクルド人に示すことによって、彼らは態度を和らげ、政府に対してあまり攻撃的でなくなるだろう。"
 TUR_combat_cybercrime: "トルコ・サイバースペース"
 TUR_combat_cybercrime_desc: "一部の個人が犯罪や違法行為のためにサイバースペースを使用する可能性があるため、トルコのサイバースペース内で何が起こっているかを調査する必要がある。"
 TUR_heavy_fines: "監視されていないサイバースペース"
 TUR_heavy_fines_desc: "インターネットには、そこで何が起こっているかを監視し、管理する人々がかなりたくさんいる。それならば、よりよい使い道のある警察資源をなぜそれに浪費する必要があるのか。"
 TUR_heavy_sentences: "監視されたサイバースペース"
 TUR_heavy_sentences_desc: "We cannot risk leaving the internet unsupervised, because criminals could possibly use it as a loophole to commit crimes without us knowing!"
 TUR_kurdish_problems: "クルド問題"
 TUR_kurdish_problems_desc: "We are having quite the struggle against the PKK in the East of our country, who are fighting for an independent Kurdistan, away from Turkish control. This cannot happen, as it would completely destroy our territorial integrity."
 TUR_mediation: "調停"
 TUR_mediation_desc: "時々、暴力は答えではない。調停はPKKにアプローチし、平和的に共存させるための最良の方法となるだろう。"
 TUR_relax_security_laws: "東部治安法の緩和"
 TUR_relax_security_laws_desc: "我々が敵対的でないことを示す方法として、クルド人多数派地域における治安法を緩和する必要がある。こうすれば、彼らも我々に対する攻撃性を和らげるだろう。"
 TUR_withdraw_all_troops: "部隊移動の制限"
 TUR_withdraw_all_troops_desc: "部隊移動の制限は、戦闘意思がないことをPKKに示すだろう。"
 TUR_open_dialogue_pkk: "対話の確立"
 TUR_open_dialogue_pkk_desc: "対話を確立することにより、トルコの利益とPKKの利益の両方にある何かを解決できるだろう。"
 TUR_track_two_diplomacy: "トラックⅡ外交"
 TUR_track_two_diplomacy_desc: "人気のある人物を我々の大義の代表者として迎えることにより、おそらく取引に対する彼らの意見に影響を与えることができるだろう。"
 TUR_direct_talks: "直接対話"
 TUR_direct_talks_desc: "There is no need to play a game of hide and seek when we are trying to negotiate some serious terms. We will hold direct talks with our representatives, and theirs."
 TUR_third_party_mediators: "第三者調停者"
 TUR_third_party_mediators_desc: "政府とPKKの間の不信のため、紛争の調停を助けるために第三者を連れてくるのが最善である。"
 TUR_peshmerga_stance: "ペシュメルガの招待"
 TUR_peshmerga_stance_desc: "おそらく、PKKが地域の一部となったときに関係を安定させるためにペシュメルガを招待することができるだろう。"
 TUR_pkk_peshmerga_talks: "協議の追求"
 TUR_pkk_peshmerga_talks_desc: "By pursuing talks with the Peshmerga, the PKK and the Peshmerga can co-exist peacefully without having much conflict over border disputes."
 TUR_maintain_animosity: "敵意の維持"
 TUR_maintain_animosity_desc: "敵意を維持することにより、攻撃する正当な理由があるため、国境紛争を容易に対処できるだろう。"
 TUR_relax_policing_laws: "警察法の緩和"
 TUR_relax_policing_laws_desc: "PKKとの外交における最近の突破口により、国中の警察法を緩和でき、それによって支出を大幅に削減できる。"
 TUR_federalize_turkish_kurdistan: "ディヤルバクルの連邦化"
 TUR_federalize_turkish_kurdistan_desc: "国内のクルディスタン州を連邦化するだろう。なぜなら、それが我々の利益とPKKの利益の両方にとって最善だからだ。我々は彼らと地域に対するある程度の支配を維持するだろうが、彼らもある程度の自治権を得るだろう。"
 TUR_the_endless_war: "終わりのない戦争"
 TUR_the_endless_war_desc: "The war with the PKK cannot be solved diplomatically as our many disagreements have proven time and time again. We will double our efforts of forcefully fighting the PKK and re-asserting Turkish hegemony."
 TUR_form_eastern_security_corp: "Eastern Security Corps"
 TUR_form_eastern_security_corp_desc: "新しい部隊が訓練され、国の東部の危険な地域を守るという特別な目的で武装されるだろう。"
 TUR_redouble_army_training: "軍隊訓練の倍加"
 TUR_redouble_army_training_desc: "軍隊は訓練が必要であり、これまで以上に今それが必要である。PKKに対する戦いを強化しているため、軽く訓練された部隊を戦闘に投入するのは愚かだろう。"
 TUR_international_campaign: "国際的支援？"
 TUR_international_campaign_desc: "PKKを排除するために国際的支援を検討する必要があるかもしれない。しかし、もしそうすれば、国家への外国影響力の扉を開くリスクを冒すことになる。"
 TUR_call_on_iranian_help: "イランへの援助要請"
 TUR_call_on_iranian_help_desc: "The Iranians have fought several wars to curb Kurdish independence, and by now they know every single move and tactic used by the rebels. We could perhaps contact them and see if they are willing to support us in fighting the Kurds."
 TUR_self_sufficiency: "誰にも頼らない"
 TUR_self_sufficiency_desc: "誰にも頼ることはできない。自力でやらなければならず、一人でやらなければならない。助けを得ることが常に答えではない。"
 TUR_call_on_american_help: "アメリカへの援助要請"
 TUR_call_on_american_help_desc: "The Americans may be willing to lend us some support, but it will most likely not last very long due to their complex political system and divide in whether to intervene or not. But let's hope whatever support they give does make a difference."
 TUR_criminalize_pkk: "PKKの国際的犯罪化"
 TUR_criminalize_pkk_desc: "PKKはしばらくの間国内で犯罪化されてきたが、彼らは犯罪化されていない他の国々で安全な避難所を見つけ、攻撃を計画し調整する時間を与えている。我々の国だけでなく、すべての国で彼らを犯罪化させるためのミッションに着手する必要があるだろう。"
 TUR_focus_east_anatolia: "ディヤルバクル作戦"
 TUR_focus_east_anatolia_desc: "PKKの活動の最重要拠点の一つであるディヤルバクルが、近隣の州の日常生活を混乱させ始めている。我々は州からPKKを完全に一掃する作戦を実行する予定である。"
 TUR_focus_van: "ヴァンでの作戦"
 TUR_focus_van_desc: "PKKの活動のホットスポットの一つであるヴァンは、近隣州での日常生活を妨害し始めている。州からPKKをきっぱりと排除するための作戦を行うつもりだ。"
 TUR_hightened_security: "治安強化"
 TUR_hightened_security_desc: "PKKと戦い続け、国家を破壊する彼らの計画を妨害できるように、国内の治安プレゼンスを強化するつもりだ。"
 TUR_the_fight_goes_on: "戦いは続く"
 TUR_the_fight_goes_on_desc: "The fight goes on, and it will go on, and it has for many decades now. Though we cannot fully get rid of the PKK without capturing all their soldiers, we can subdue them for some time to come."
 TUR_forward_with_social_democracy: "社会民主主義と共に前進"
 TUR_forward_with_social_democracy_desc: "トルコの未来は社会民主主義と西側的価値観によって決定されるだろう。"
 TUR_approach_the_eu: "EUへの接近"
 TUR_approach_the_eu_desc: "長い西欧化プロセスにより、トルコは徐々に欧州連合に近づいてきた。EUとの統合政策を継続し、最終的に完全なメンバーになるべきである。"
 TUR_kemalist_social_democracy: "ケマリスト社会民主主義"
 TUR_kemalist_social_democracy_desc: "The §Y[socialism_L]§! represents the idea of 'Democratic Left', a term coined by Ecevit to link leftist values with national-cultural heritage. In other words, Kemalism mixed with democratic socialism to fit the situation of contemporary Turkey. Our party can attract both leftist and Kemalist voters"
 TUR_repair_relations_with_left: "左派との関係修復"
 TUR_repair_relations_with_left_desc: "トルコの左翼と社会主義者は、クルド人を支持することを敢えてしたために何十年もの間悪魔化されてきた。人々はイデオロギーに関係なく意見を自由に表明できるべきである。より多くの政党に政治分野を開放するために取り組む必要がある。"
 TUR_disarmament_program: "軍縮プログラム"
 TUR_disarmament_program_desc: "我々の激動の歴史は、軍隊にあまりにも多くの力を与えすぎたことを示している。軍事支出を削減し、自身の問題により焦点を当てる必要がある。"
 TUR_improve_workers_rights: "労働者の権利改善"
 TUR_improve_workers_rights_desc: "トルコの労働法は再検討される必要がある。政府職員に労働環境を団体交渉する権利を与える必要がある。加えて、同僚との関係で不当に扱われたと感じる政府職員は誰でも、国家に対して訴訟を起こすことができるようになるだろう。"
 TUR_protect_the_unions: "労働組合の保護"
 TUR_protect_the_unions_desc: "We need to remove the current restrictions on politically motivated strikes and the liability of labour unions in relations to any damages caused by workers being on a strike. We also need to give the ESK (Economic and Social Council), the board of representatives of unions, associations and confederations, constitutional protection"
 TUR_appease_conglomerate: "財閥の懐柔"
 TUR_appease_conglomerate_desc: "The industrial conglomerates are the backbone of this nation, and if we can gain their trust, then we will easily be able to gain the workers' trust"
 TUR_banking_reform: "銀行改革"
 TUR_banking_reform_desc: "トルコの銀行セクターは改革を切実に必要としている。汚職が蔓延しており、銀行は最近の不況の主な理由の一つである。"
 TUR_invest_in_iett: "IETTへの投資"
 TUR_invest_in_iett_desc: "イスタンブール電力・路面電車・トンネル公社（IETT）は、イスタンブールで運営されている輸送会社である。党員の一部は同社とつながりを持っており、イスタンブールの輸送ネットワークを改善するために彼らと協力すべきである。"
 TUR_legacy_of_ecevits: "エジェヴィト夫妻の遺産"
 TUR_legacy_of_ecevits_desc: "ビュレント・エジェヴィトと妻ラフシャンは共に、トルコにおける社会民主主義運動の創設に尽力した。彼らの遺産は称えられなければならない。"
 TUR_increase_central_bank_autonomy: "中央銀行の自治権拡大"
 TUR_increase_central_bank_autonomy_desc: "By increasing the autonomy of the central bank, we are able to let the economy flow without the interference of politicians"
 TUR_harsh_stance_pkk: "PKKへの強硬姿勢"
 TUR_harsh_stance_pkk_desc: "PKKは問題を引き起こすだけであり、より厳しい姿勢を取らなければならないだろう。"
 TUR_abolition_of_death_penalty: "死刑廃止"
 TUR_abolition_of_death_penalty_desc: "死刑は国家を後退させており、近代的で安定した国になるのを妨げている。我々は民主主義であり、その価値観と人権を堅持しなければならない。"
 TUR_subsidise_military: "軍隊への補助金"
 TUR_subsidise_military_desc: "軍隊はキプロス征服を助けた。そしてキプロスからギリシャの影響力を排除するために、軍隊の正しい行いを信頼する必要がある。"
 TUR_ataturks_heirs: "アタテュルクの後継者"
 TUR_ataturks_heirs_desc: "§Y[conservatism_L]§! is the party founded by Atatürk himself. It is our destiny to modernize Turkey and make it a real European country"
 TUR_national_chief: "国民の長の遺産"
 TUR_national_chief_desc: "Ismet Inönü, the latest §Y[conservatism_L]§! president received the title 'National Chief'. This title fits Deniz Baykal very well too"
 TUR_unban_head_scarves: "ヒジャブ禁止解除"
 TUR_unban_head_scarves_desc: "より保守的な有権者を引き付けるために、ヒジャブ禁止を解除すべきである。結局のところ、宗教の自由は西側の理想の一部である。"
 TUR_maintain_hijab_ban: "Maintain Headscarf Ban"
 TUR_maintain_hijab_ban_desc: "There is absolutely no reason to change our laws pertaining to the Hijab. It does not matter if the conservatives are outraged or upset, what matters is the preservation of the Turkish Republic, and its secular ideals"
 TUR_reform_village_institutes: "Recreate Village Institutes"
 TUR_reform_village_institutes_desc: "In the 1940s, the ruling §Y[conservatism_L]§! government founded village institutes, which were intended to improve education in rural areas by picking out good students and educating them as teachers. Many of the skills taught in the institutes were highly practical, and many of them operated farms and workshops. We should bring these institutes back to make sure even the poorest of areas can educate themselves"
 TUR_expand_shipping_industry: "漁業支援"
 TUR_expand_shipping_industry_desc: "漁業を支援することは、農村の人々とその中小企業を助け、それが長期的には国家を助けるだろう。"
 TUR_deradicalisation_program: "脱過激化プログラム"
 TUR_deradicalisation_program_desc: "デニズ・バイカルはテロリズムの断固たる反対者である。人口のより保守的なメンバーを容認する一方で、過激派要素は根絶されなければならない。"
 TUR_increase_education_spending: "教育改善"
 TUR_increase_education_spending_desc: "As an associate professor, Deniz Baykal knows the importance of education. After all, he made it into politics after writing a thesis on the election loss of §Y[conservatism_L]§! in 1965"
 TUR_increase_funds_to_resources: "エネルギー・資源省への補助金"
 TUR_increase_funds_to_resources_desc: "トルコ国家はより多くの資源を必要としている。エネルギー・資源省に補助金を出し、トルコの外国資源への依存を減らす方法を見つけられるようにすべきである。"
 TUR_chp_move_right: "右傾化"
 TUR_chp_move_right_desc: "For years Deniz Baykal has moved the §Y[conservatism_L]§! more and more right on the political spectrum taking more conservative and Islamist policies. Many of the old supporters have left the party because of this, as many feel it doesn't match the original intentions of the party. We don't need those people. Turkey has changed, and it has no room for leftist politics"
 TUR_chp_move_left: "左傾化"
 TUR_chp_move_left_desc: "For years Deniz Baykal has moved the §Y[conservatism_L]§! more and more right on the political spectrum taking more conservative and Islamist policies. Many of the old supporters have left the party because of this, as many feel it doesn't match the original intentions of the party. We need to reverse this course, and return back to our roots"
 TUR_increase_social_security_spending: "社会保障増額"
 TUR_increase_social_security_spending_desc: "社会保障機構は追加資金をいくらか貰えるだろう。"
 TUR_invest_in_is_bank: "イスバンクへの投資"
 TUR_invest_in_is_bank_desc: "イスバンクはトルコ最大の商業銀行であり、複数の国に支店を持っている。国家は追加の財政的安全保障のために彼らの株の一部を購入すべきである。"
 TUR_curtail_corruption: "汚職抑制"
 TUR_curtail_corruption_desc: "汚職はトルコ国家最大の弱点の一つである。多くの政治家が個人的利益のために政治システムを利用しており、腐敗した行動を見たときに彼らを非難することを恐れるべきではない。"
 TUR_remove_article_158: "第158条削除"
 TUR_remove_article_158_desc: "第158条はトルコ大統領を侮辱することを犯罪としている。この記事は批評家や風刺家を黙らせるために使用されており、大統領を事実上無敵にしている。そのようなことは民主主義にふさわしくないため、この条項は削除されるべきである。"
 TUR_deport_refugees: "難民追放"
 TUR_deport_refugees_desc: "A large number of refugees are a strain on the citizens and the economy. We need to send these people back to their homes. After all, every person wants to live in their place of birth"
 TUR_religious_tolerance: "宗教的寛容の説教"
 TUR_religious_tolerance_desc: "トルコは多くの宗教的少数派の故郷であり、多くの政治家がこれらの少数派から輩出されている。これらの人々の生活の質を高める必要がある。"
 TUR_approach_grey_wolves: "灰色の狼への接近"
 TUR_approach_grey_wolves_desc: "The Grey Wolves are an ultra-nationalistic organization that draws much support from the more right wing-leaning population. If we tighten our ties to them, we will be able to gain some of those supporters"
 TUR_businessmans_turkey: "ビジネスマンのトルコ"
 TUR_businessmans_turkey_desc: "トルコはあまりにも長い間、腐敗した政府によって制約されてきた。トルコ国民に経済的、社会的な自由をもたらす時が来た。"
 TUR_abolish_constitutional_court: "Abolish the Constitutional Court"
 TUR_abolish_constitutional_court_desc: "憲法裁判所はあまりにも政治的に依存しており、その構成員は議会によってあまりにも容易に影響を受けやすい。代わりに、大統領が推薦し、議会に承認され、終身在職する最高裁判所を設立するだろう。"
 TUR_privatization_drive: "民営化推進"
 TUR_privatization_drive_desc: "国家は社会保障や医療に参加する必要はない。これらは財団や民間組織を通じてより良く扱われるべきである。もちろん、人々は購入したいかなる保険に対してもわずかな税制優遇措置を与えられるだろう。"
 TUR_security_reform: "治安改革"
 TUR_security_reform_desc: "Crime is rife in Turkey, and this needs to be stopped. The Gendarmerie will be reorganised as a rural police, and we will ensure that the salary level of all security personnel will be kept at a substantial level. The police will receive the latest technological innovations to help them in the field"
 TUR_military_reform: "軍事改革"
 TUR_military_reform_desc: "効果的で、小規模で、ハイテクな部隊を持つことに焦点を当てる必要がある。軍隊に人々を大量徴兵する必要はない。加えて、軍事産業は民営化されるべきであり、国家はこれ以上の軍事産業投資のさらなる取得を追求すべきではない。"
 TUR_stern_commitment_to_nato: "NATOへの厳格な献身"
 TUR_stern_commitment_to_nato_desc: "NATOこそが自由な世界秩序を確保できる唯一のものである。トルコはNATOを厳格に支持し、世界平和を確保するために他の同様の同盟も支持しなければならない。"
 TUR_reduce_government_oversight: "政府監視の削減"
 TUR_reduce_government_oversight_desc: "The state should stop interfering with the economy completely. The job of the state is only to guarantee a free market. We do not need the massive army of bureaucrats we have now, but instead only the minimum possible should be utilized"
 TUR_tax_reform: "税制改革"
 TUR_tax_reform_desc: "銀行や他の金融機関はすべての税金から免除され、成長を促進するために民間企業として運営されるべきである。加えて、市民の生活を改善するために、すべての税金は約10%に引き下げられるべきである。"
 TUR_liberalise_trade: "貿易自由化"
 TUR_liberalise_trade_desc: "貿易に対する現行の制限はすべて廃止されるべきである。すべての関税を撤廃することにより、トルコの貿易状況だけでなく、隣国の貿易状況も改善する。また、それらをより効率的にするために、すべての港と港湾を民営化する必要がある。"
 TUR_agricultural_reform: "農業改革"
 TUR_agricultural_reform_desc: "農業の一部はまだかなり後進的である。機械化に投資し、生産者と購入者の両方に税制上の優遇措置を提供する必要がある。また、農家が商品の価格に関するライブデータを持つことができるように、農業に技術を組み込む必要があり、これにより生産を最適化し、農業廃棄物と過剰生産を削減できる。"
 TUR_business_cities: "ビジネス都市"
 TUR_business_cities_desc: "Cities are the economic hubs of the country. Cities are expensive, but that is only natural, as the bigger the possibilities, the bigger the cost. With this in mind, if you are too poor to live in a large city, you are to be relocated to an area with cheaper housing. To profit from the value of cities, we must also reform our real estate taxes, as in their current form they are very easy to circumvent"
 TUR_new_supply: "新たな駅"
 TUR_new_supply_desc: "都市がますます相互接続されるようになっているため、新しい駅を設立する必要がある。"
 TUR_destroy_totalitarian_education: "全体主義教育の破壊"
 TUR_destroy_totalitarian_education_desc: "中央集権化された教育は権威主義時代の残り物に過ぎない。教育は、カリキュラムを自由に選択できる民間組織に任せるべきである。教育は最初の8年間だけ義務であるべきであり、教育費は銀行からの安価なローンによって賄われる。"
 TUR_return_of_socialism: "社会主義の復活"
 TUR_return_of_socialism_desc: "強硬な左翼政党は何十年もの間トルコで死んでいたが、ついに立ち上がり権力を握ることに成功した！これが革命だ！"
 TUR_strong_state_for_people: "人民のための強い国家"
 TUR_strong_state_for_people_desc: "人民は彼らを導く強い国家に値する。政府に信頼を置く者は報われるだろう。"
 TUR_peoples_power: "人民の力"
 TUR_peoples_power_desc: "政府は人民のために、人民によってあるべきである。コミューンから国家に至るまで、あらゆるレベルの行政に農民と人民を民主的に組み込む必要がある。"
 TUR_destroy_old_regime: "旧体制の破壊"
 TUR_destroy_old_regime_desc: "行政から旧腐敗体制の残骸をすべて一掃し、新たに始める必要がある！"
 TUR_mixed_economy: "混合経済"
 TUR_mixed_economy_desc: "民間部門と公共部門の間の協力は、うまく機能する経済にとって必要である。邪悪な資本主義的傾向を根絶する必要がある一方で、国民が経済的に独立して運営するための余地も残さなければならない。"
 TUR_state_owned_economy: "国有経済"
 TUR_state_owned_economy_desc: "資本主義は社会から根絶されなければならない。国家と地方コミューンだけが産業を運営するのに適している。"
 TUR_rent_to_production_economy: "賃貸から生産経済へ"
 TUR_rent_to_production_economy_desc: "While having a private sector is important, we need to encourage and support our population to get ownership of businesses and living accommodations to ensure that true control of the economy stays in the hands of our people"
 TUR_land_reform: "農地改革"
 TUR_land_reform_desc: "地主は人類の災いである。トルコには依然として、農民が自由になるのを妨げる多くの後進的で封建的な構造さえ存在する。国内で土地がどのように所有されるかを完全に改革する必要がある。"
 TUR_heavy_agricultural_subsidies: "重農業補助金"
 TUR_heavy_agricultural_subsidies_desc: "WTOの規則を破り、農家に安価な燃料、安価で簡単なローン、機械を提供することにより、農業部門に重く補助金を出し始める必要がある。"
 TUR_machinery_tractor_parks: "機械的トラクターパーク"
 TUR_machinery_tractor_parks_desc: "農業機械を生産、整備、販売できるトラクターパークを設立する必要がある。これらすべては国中の中央集権化された場所で行われる。これは農業の大幅な近代化と動力化を助けるだろう。"
 TUR_communal_farming: "共同農業"
 TUR_communal_farming_desc: "共同農業は農場をより効率的にするための最良の方法である。利益に焦点を当てた大企業経営の農場の代わりに、地域利用のためのより大規模な農業を持つだろう。"
 TUR_cut_global_trade: "世界貿易の削減"
 TUR_cut_global_trade_desc: "トルコの資源はトルコのためだけに確保されるべきであり、グローバリズム帝国主義者に盗まれるべきではない。国家にとって不可欠な資源が我々の手に留まることを保証する必要がある。"
 TUR_prioritise_backwards_regions: "後進地域の優先"
 TUR_prioritise_backwards_regions_desc: "経済投資は、長い間国家によって無視されてきた、より農村的で人口の少ない地域に焦点を当てるべきである。田舎はこの国のバックボーンである。"
 TUR_urban_humanism: "都市ヒューマニズム"
 TUR_urban_humanism_desc: "都市は、人々が資本主義の歯車として行動するためだけの冷たいコンクリートブロックであってはならないように再設計される必要がある。都市部は労働者が繁栄するためにより自然に設計される必要がある。"
 TUR_equal_distribution: "平等な分配"
 TUR_equal_distribution_desc: "We can't play favourites in regional politics. This will only cause discord in our nation. We will focus on areas based on state and local needs"
 TUR_greatest_productive_force: "最大の生産力は人間"
 TUR_greatest_productive_force_desc: "人々に焦点を当てることによってのみ、国家を前進させることができる。生活、ビジネス、社会、そしてすべてのあらゆる側面は人々から生じる。"
 TUR_clamp_down_on_kurdish_culture: "クルド・アイデンティティの弾圧"
 TUR_clamp_down_on_kurdish_culture_desc: "クルド人は、望む望まざるにかかわらず、トルコ国家の一部である。これらのCIAが資金提供しているテロリスト共に屈することはないだろう。"
 TUR_federal_republic: "連邦共和国"
 TUR_federal_republic_desc: "Every people group in Turkey should have the right of self determination, autonomy and even full independence if they so wish. Demonizing our minorities will not make a strong state. We need to agree to give the Alevis some sort of autonomy for everyone's sake"
 TUR_appease_kurds: "クルド人の懐柔"
 TUR_appease_kurds_desc: "何十年もの間クルド人と戦ってきたが、どこにも到達していない。武器を置き、彼らに対してより平和的なアプローチを取る時が来た。結局のところ、彼らは平和に生きたいだけなのだ。"
 TUR_the_turkish_nation: "トルコ国家"
 TUR_the_turkish_nation_desc: "トルコはトルコの国家である。これは単に民族的トルコ人を意味するのではなく、トルコのすべての国民がトルコ人であり、分割不可能なトルコ共和国の一部である。我々は敵が蒔いた不和による我が国の分裂を許さない。"
 TUR_detach_state_from_religion: "国家と宗教の分離"
 TUR_detach_state_from_religion_desc: "Turkey was created as a secular nation, but in recent years this core principle of the Republic has been tarnished. We must cut all aspects of religion from the state; no religious education in public schools, no funding of religious organizations by the state and no religious imagery in public buildings. People are free to worship what they want but the state is above such frivolous notions"
 TUR_recognise_minorities: "少数派の承認"
 TUR_recognise_minorities_desc: "トルコが多民族国家という事実を認めなければならない。すべての国民にトルコ人らしさの考えを強制しようとすることに意味はない。トルコ人であろうとなかろうと、すべての人がトルコの国民である。"
 TUR_leverage_diaspora: "ディアスポラの活用"
 TUR_leverage_diaspora_desc: "西側諸国からアルメニア人の虐殺を非難されているが、これは帝国主義者による真っ赤な嘘である。西側諸国の政治に影響を与え、我々に対する態度を変えさせるためにディアスポラを活用すべきである。"
 TUR_commit_to_gender_equality: "男女平等へのコミット"
 TUR_commit_to_gender_equality_desc: "Equality between men and women in Turkey is abysmal. We need to commit to reducing violence against women and providing women with more opportunities when it comes to work, and increasing their participation in education and politics."
 TUR_revolutionary_education: "革命的教育"
 TUR_revolutionary_education_desc: "教育改善に焦点を当てるべきである。アクセス可能性が増加するだけでは不十分であり、学生に革命的理想を教え込み、伝統を引き継がせる必要がある。"
 TUR_free_education: "無償教育"
 TUR_free_education_desc: "教育はすべての人に無料であるべきだ。それは国家の幸福のための必需品である。"
 TUR_increase_peoples_welfare: "人民福祉の向上"
 TUR_increase_peoples_welfare_desc: "Making sure that our people are healthy is of the utmost importance. We also have to make sure that no one in our country has to starve, even if they are unemployed, old or disabled"
 TUR_leave_NATO: "NATOからの離脱"
 TUR_leave_NATO_desc: "NATOは帝国主義者が世界を支配するための道具に過ぎず、そのような組織の一部であるべきではない。"
 TUR_anti_west_sentiment: "反西側感情"
 TUR_anti_west_sentiment_desc: "西側は絶えず中東に干渉している。いつか退廃的なアメリカ合衆国を転覆させるであろう新興勢力と再連携する必要がある。"
 TUR_balanced_approach: "バランスの取れたアプローチ"
 TUR_balanced_approach_desc: "国際外交は危険を伴う可能性がある。慎重に進む必要があるが、目標はトルコの全外国勢力からの独立であるべきだ。"
 TUR_deterrent_national_defence: "抑止的国防"
 TUR_deterrent_national_defence_desc: "軍隊は、いかなる帝国主義者も我々に干渉することを敢えてしないように、抑止力として機能するほど強力でなければならない。"
 TUR_destruction_of_fascists: "ファシストの破壊"
 TUR_destruction_of_fascists_desc: "軍隊、警察、MITは、打ち壊され、人民によって提供される代替手段に置き換えられる必要があるファシスト組織に過ぎない。"
 TUR_pacifist_initiatives: "平和主義的な取り組み"
 TUR_pacifist_initiatives_desc: "紛争解決において平和的なアプローチに頼るべきである。人民の利益のためにすべての帝国主義的な取り組みを停止すべきである。"
 TUR_invest_in_police: "治安への投資"
 TUR_invest_in_police_desc: "人々が安全だと感じられるように、強力な治安機構が必要だ。警察は最善を尽くすために良い装備と良い給与が必要である。"
 TUR_national_democratic_revolution: "国民民主革命"
 TUR_national_democratic_revolution_desc: "アタテュルクによって開始された国民民主革命を続けなければならない。我々は革命の前衛であり、トルコを近代へと前進させるだろう。"
 TUR_heavy_military_investment: "重軍事投資"
 TUR_heavy_military_investment_desc: "外部勢力からトルコを守る必要がある。軍隊が将来の戦いに備えていることを確認するために、重工業に重く投資する必要がある。"
 TUR_shutdown_christian_missionaries: "キリスト教宣教師の追放"
 TUR_shutdown_christian_missionaries_desc: "国内で活動しているキリスト教宣教師は、西側帝国主義者のためのスパイに過ぎない。彼らを国から追い出し、説教することを禁止する必要がある。"
 TUR_form_anti_imperialist_vanguard: "反帝国主義前衛の形成"
 TUR_form_anti_imperialist_vanguard_desc: "The West is constantly meddling with the Middle East, especially the United States. We need to form a union of anti-imperialists in the Middle East to stop the great Middle Eastern project of the United States"
 TUR_vanguard_approach_azerbaijan: "アゼルバイジャンへの接近"
 TUR_vanguard_approach_azerbaijan_desc: "アゼルバイジャンはトルコの長年の同盟国であり、共通の宗教、遺産、政治目標を共有している。西側帝国主義を非難するよう彼らに求めるべきである。"
 TUR_vanguard_reclaim_azerbaijan_territory: "アゼルバイジャンの領土保全の回復"
 TUR_vanguard_reclaim_azerbaijan_territory_desc: "Armenia occupied parts of Azerbaijan after they gained independence from the Soviet Union under the pretext of protecting ethnic Armenians. This occupation has now lasted for more than a decade. It is time to demand Armenia to withdraw from the region or face the consequences!"
 TUR_vanguard_approach_iran: "イランへの接近"
 TUR_vanguard_approach_iran_desc: "イランは長い間アメリカ人によって抑圧され、中傷されてきた。彼らは間違いなく大悪魔に対する共通戦線に関心があるだろう。"
 TUR_vanguard_pressure_northern_cyprus: "北キプロスへの圧力"
 TUR_vanguard_pressure_northern_cyprus_desc: "Northern Cyprus only exists because we support them. We have considerable influence on their government and we should emphasize to them that they only exist because we allow it"
 TUR_vanguard_negotiate_with_syria: "シリアとの交渉"
 TUR_vanguard_negotiate_with_syria_desc: "シリアとは非常に険悪な歴史がある。かつて彼らはPKKが国境内で活動することを許可し、フランスによってハタイ地域が我々に与えられたことを決して許していない。しかし、おそらく友人になれる方法があるだろう。"
 TUR_vanguard_annex_northern_cyprus: "北キプロス併合"
 TUR_vanguard_annex_northern_cyprus_desc: "北キプロスはトルコ人でいっぱいである。この理由から、北キプロスを我々にはるかに近づけるべきである。実際、島全体がトルコの一部であるべきだ。"
 TUR_vanguard_unify_iraq: "イラクと同盟"
 TUR_vanguard_unify_iraq_desc: "イラク人はここ数年、暴れ回っており、それを解決し、我々と連携させる必要がある。"
 TUR_scientific_socialism: "科学的社会主義"
 TUR_scientific_socialism_desc: "EMEPの科学的社会主義が最良の前進方法である。強く反資本主義的で、地方分権化され、非介入主義的な道がトルコにとって最も繁栄できる道だろう。"
 TUR_unlimited_workers_rights: "無制限の労働者の権利"
 TUR_unlimited_workers_rights_desc: "The Workers of Turkey have been oppressed for decades! No more! It is time to break our chains and make Turkey a worker's paradise!"
 TUR_adherent_defence: "固守防御"
 TUR_adherent_defence_desc: "軍隊は人々の抑圧のために使用されるべきではない。軍隊の仕事は国民を守ることであり、それだけである。"
 TUR_shut_down_imperialists: "帝国主義者の追放"
 TUR_shut_down_imperialists_desc: "Our current government model is based on capitalistic ideals. All of this is pure nonsense. We need to completely overhaul our monetary system. Other powers say that we 'owe' them money but our debts will be just wiped away with the push of a button"
 TUR_retreat_from_cyprus: "キプロスからの撤退"
 TUR_retreat_from_cyprus_desc: "Turkey has no business being in Cyprus. It is nothing more than a remnant of Turkish imperialism. The inhabitants of the island, both Turks and Greeks alike should decide their fate on their own"
 TUR_devrimci_yol: "Devrimci Yol"
 TUR_devrimci_yol_desc: "Devrimci Yolは革命の道を意味し、労働組合に重点を置いたトルコ形式のマルクス・レーニン主義である。§W[anarchist_communism_L]§!の多くのメンバーは80年代にこの運動の一部であった。Devrimci Yolの理念は競合相手の外国式共産主義よりも優れており、他よりも上に高められる必要がある。"
 TUR_committees_of_resistance: "抵抗委員会"
 TUR_committees_of_resistance_desc: "国の広範な右翼的態度から自らを守るために抵抗委員会を結成する必要がある。これらのグループは街頭をパトロールし、灰色の狼として知られるテロリストを追い詰めるだろう。"
 TUR_committees_of_production: "生産委員会"
 TUR_committees_of_production_desc: "生産委員会は労働者と工場を効果的なユニットに組織化するのを助け、これらの委員会は独立して製造プロセスを制御する。"
 TUR_empower_unions: "労働組合の強化"
 TUR_empower_unions_desc: "We need to empower the labour unions so we can fully protect the rights of workers. Only by giving a voice to the worker, will our words be truthful"
 TUR_strike_pakistan: "パキスタンへの攻撃"
 TUR_strike_pakistan_desc: "パキスタン政府はいかなる形態の社会主義も拒否しているようで、積極的に我々の政府に反対を表明してきた。彼らをきっぱりと黙らせる時が来た。"
 TUR_strike_arabia: "アラビアの解放"
 TUR_strike_arabia_desc: "サウジは他のイデオロギーとあまりうまくやっていけていないようだ。ならば、我々は彼らを作り変えてあげよう。"
 TUR_islamist_victory: "イスラム主義者の勝利"
 TUR_islamist_victory_desc: "People in Turkey have been yearning for a more conservative government, one that truly follows Islam. Now they finally have it"
 TUR_lower_taxes_for_exports: "輸出のための減税"
 TUR_lower_taxes_for_exports_desc: "トルコは強力な経済を持っているが、輸出には多くの官僚的形式主義がある。国際貿易を今よりもはるかに容易にする必要がある。"
 TUR_form_new_stock_markets: "新株式市場の形成"
 TUR_form_new_stock_markets_desc: "現在、唯一の証券取引所市場はイスタンブールで機能している。これはトルコの他の地域に住む人々の権利を大いに剥奪している。より多くの地方取引所を設立し、それらをイスタンブール取引所に結びつける必要がある。"
 TUR_energy_investments: "エネルギー投資"
 TUR_energy_investments_desc: "トルコの外国エネルギー輸入への依存を減らす必要がある。"
 TUR_subsidise_farming: "農業補助金"
 TUR_subsidise_farming_desc: "トルコには広大な肥沃な土地があるが、農業生産は史上最低である。安定した効率的な食料供給を保証するために、農家に補助金を出す必要がある。"
 TUR_increase_oil_gas_production: "石油・天然ガス生産増強"
 TUR_increase_oil_gas_production_desc: "トルコは多くの石油と天然ガスを輸入しているが、国内供給もある。自給自足を高めるために、石油・天然ガス生産施設に投資する必要がある。"
 TUR_turkish_highways: "トルコの高速道路"
 TUR_turkish_highways_desc: "トルコはアジアとヨーロッパを結ぶ架け橋である。しかし、トルコを横断するための道路網は酷い状態にあり、改善されるべきである。"
 TUR_uphold_family_values: "家族価値観の擁護"
 TUR_uphold_family_values_desc: "伝統的な家族価値観は西側から攻撃を受けている。伝統的価値観を促進し、この伝統に敵対的な素材がメディアに存在しないことを保証する組織を設立する必要がある。"
 TUR_security_through_police_and_welfare: "警察と福祉による安全保障"
 TUR_security_through_police_and_welfare_desc: "国民に安全を提供するためには、警察に資金を提供するだけでは不十分である。人々が生き残るために犯罪に頼らなければならない状況に陥らないように、社会支出も増やす必要がある。"
 TUR_judicial_reform: "司法改革"
 TUR_judicial_reform_desc: "司法制度は時代遅れであり、現代社会からかけ離れている。システム全体を改革し、腐敗した裁判官を排除する必要がある。"
 TUR_remove_electoral_treshold: "Remove Electoral Threshold"
 TUR_remove_electoral_treshold_desc: "Turkey has the highest electoral threshold in the world. A party needs at least 10% of the popular vote to get seats in the parliament. This is undemocratic, and only serves to cement the power of the ruling party. We need to remove the limit altogether"
 TUR_increase_military_funding: "軍事資金増強"
 TUR_increase_military_funding_desc: "トルコ国家は包囲されており、自らを守るために強力な軍隊が必要である。資金を増やし、新しい兵士を募集する必要がある。"
 TUR_concentrate_domestic_equipment: "国産装備への集中"
 TUR_concentrate_domestic_equipment_desc: "トルコ軍はトルコ製装備を使用すべきである。現在、いわゆる「同盟国」からの装備納入にあまりにも依存しすぎている。"
 TUR_military_rnd_projects: "軍事研究開発プロジェクト"
 TUR_military_rnd_projects_desc: "国産装備の生産に加えて、外国購入品を置き換えるための国産兵器システムを開発する必要がある。"
 TUR_remove_military_from_politics: "政治からの軍の排除"
 TUR_remove_military_from_politics_desc: "民主国家において、軍隊がこれほど多くの力を持つことは倒錯している。軍隊が絶えず政治に干渉するのを防ぐために、法律と憲法改正を行う必要がある。"
 TUR_islamic_nato: "イスラム版NATO"
 TUR_islamic_nato_desc: "NATOは安全保障を提供してくれるが、NATOメンバーは中東を完全に無視していることを示してきた。もし彼らが安定と繁栄を提供できないなら、我々がその役割を引き受けなければならない。独自の軍事同盟、地中海条約機構（MTO）を結成するだろう。"
 TUR_invite_iraq: "イラクを招待する"
 TUR_invite_iraq_desc: "イラクを同盟に招待する必要がある。なぜなら、彼らは徐々にまとまり始めており、相互協力から大きな利益を得られるだろうからだ。"
 TUR_invite_syria: "シリアを招待する"
 TUR_invite_syria_desc: "国のすぐ南にシリアがいることは、非常に脆弱であることを意味する。シリアを陣営 に招待することは、安全と安心を保証するための素晴らしい方法となるだろう。"
 TUR_invite_egypt: "エジプトを招待する"
 TUR_invite_egypt_desc: "Egypt is an up and coming power-house, and with a population of its size, our alliance will be able to achieve virtually anything"
 TUR_assistance_to_bulgaria: "ブルガリアへの援助"
 TUR_assistance_to_bulgaria_desc: "国境を越えて容易にさらなる投資を行えるように、ブルガリアのインフラ開発を支援すべきである。"
 TUR_islamic_economic_cooperation: "イスラム経済協力"
 TUR_islamic_economic_cooperation_desc: "多くのイスラム諸国は金に泳いでおり、その金を無意味なことに使っている。共通の経済プロジェクトに資源をプールするための経済同盟を結成すべきである。"
 TUR_condemn_china: "中国への非難"
 TUR_condemn_china_desc: "中国による国内イスラム教徒の扱いは忌まわしく、非難されるべきである。"
 TUR_improve_relations_with_egypt: "エジプトとの関係改善"
 TUR_improve_relations_with_egypt_desc: "トルコはエジプトと険悪な歴史を持っている、主に過去の紛争のためだ。我々は皆ここでは同じ側にいるので、エジプト人に対してそれほど冷たくあるべきではない。"
 TUR_investments_in_iraq: "イラクとの友好"
 TUR_investments_in_iraq_desc: "Despite Iraq having less than ideal ties with us in the past, it is best that we warm up to each other. We can invest in Iraqi infrastructure and gain their trust"
 TUR_work_together_with_BSEC: "BSECとの協力"
 TUR_work_together_with_BSEC_desc: "黒海経済協力機構（BSEC）は、黒海周辺に繁栄をもたらすことを目的とした組織である。組織は黒海周辺国と南バルカンの一部の国々で構成されている。利益増加のためにこれらの国々と協力する必要がある。"
 TUR_fixing_ideals: "理想の修復"
 TUR_fixing_ideals_desc: "理想は何十年ものケマリストイデオロギーによる支配の結果、破壊された。しかし、それらを回復するには遅すぎることはない。犯された過ちを修正し、国家を伝統主義とイスラム主義へと戻すだろう。"
 TUR_anti_lgbtq: "結婚法の強化"
 TUR_anti_lgbtq_desc: "社会が西側の理想を中心に展開しないようにする必要がある。伝統的な結婚法を強化し、何よりも伝統主義を施行するだろう。"
 TUR_supporting_islamists: "The Ulema's Voice"
 TUR_supporting_islamists_desc: "We will let the Ulema voice their opinions in our country's affairs. Giving them a voice will let our nation steer towards a path of righteousness and purity"
 TUR_natural_medicine: "自然医学"
 TUR_natural_medicine_desc: "Natural medicine is the best type of medicine. We need to ditch the glorified lab-made medicines as they can be using ingredients more harmful than good to one's body."
 TUR_new_era: "新時代"
 TUR_new_era_desc: "地域に新時代がもたらされるだろう。抑圧と不正義から解放された、平和と安定の時代が。"
 TUR_ally_palestine: "パレスチナとの同盟"
 TUR_ally_palestine_desc: "Palestine has been occupied by the Israelis since the late 1940s. It is time we establish proper ties with them, and show our support for them."
 TUR_talks_with_iran: "イランとの協議"
 TUR_talks_with_iran_desc: "イランはパレスチナの完全な解放とイスラエル秩序の転覆を呼びかけてきた。宗教的な違いにもかかわらず、この問題について共通の基盤を見つけられるかどうか、彼らと協議を開くだろう。"
 TUR_freeing_palestine: "パレスチナ解放"
 TUR_freeing_palestine_desc: "イスラエル占領者からパレスチナ人を解放する時が来た。イスラエル人はパレスチナとレバントに苦しみと不正義しかもたらしておらず、それについて何かをする時が来た！"
 TUR_shia_dominance: "シーア派支配"
 TUR_shia_dominance_desc: "トルコのアレヴィー派、アラウィー派、ジャアファル法学派が団結し、トルコのスンナ派による抑圧を打ち破る時が来た。"
 TUR_alevi_political_shift: "アレヴィー派による政治支配"
 TUR_alevi_political_shift_desc: "トルコの政治的首都は、中央アナトリアのアレヴィー派支配地域に移される必要がある。これが権力基盤を確保する最良の方法である。"
 TUR_repair_relations_with_alawites: "アラウィー派との関係修復"
 TUR_repair_relations_with_alawites_desc: "ハタイに住むアラウィー派とシリアの政治エリートはしばしばアレヴィー派と混同される。いくつかの類似点を共有しているが、宗派は異なる時期に始まり、アラウィー派は主にアラブ人である。アラウィー派がアレヴィー派を「アラブ人の抑圧者」と見なしてきたため、歴史的な摩擦があった。この敵意は修正されるべきである。"
 TUR_invest_in_alevis: "アレヴィー派への投資"
 TUR_invest_in_alevis_desc: "トルコのアレヴィー派のほとんどは東アナトリアに住んでおり、トルコの西部よりもはるかに経済的繁栄を見ていない。アレヴィー派が富を分かち合う時が来た。"
 TUR_invest_in_alawites: "アラウィー派への投資"
 TUR_invest_in_alawites_desc: "アレヴィー派と同様に、アラウィー派は以前の政府によって経済的に権利を剥奪されてきた。同じ過ちを犯さないだろう。"
 TUR_unite_alawites: "アラウィー派の統一"
 TUR_unite_alawites_desc: "トルコはフランスからハタイ地域を不当に盗み、アラウィー派を二つの別々の国家に分裂させた。地域をシリアに返還し、すべてのアラウィー派を単一政府の下に統一する必要がある。"
 TUR_utilise_alawite_military_experience: "アラウィー派の軍事経験の活用"
 TUR_utilise_alawite_military_experience_desc: "シリアでは、軍司令部の大部分がアラウィー派で構成されている。忠実な将校幹部を持つために、同様の方法を自軍に展開する必要がある。"
 TUR_break_syrian_dependancy_iran: "シリア・イラン関係への攻撃"
 TUR_break_syrian_dependancy_iran_desc: "We need to make Syria less dependent on Iran, and more so on us. For that reason, we will be attacking their ability to exert influence within Syria"
 TUR_arm_iraqi_shias: "イラクのシーア派を解放"
 TUR_arm_iraqi_shias_desc: "Iraqis are living under a system where the Shi'ite population is under-represented. We need to change this, we will liberate them and free them from the system of oppression they currently live under"
 TUR_arm_saudi_rebels: "ヒズボラの支配"
 TUR_arm_saudi_rebels_desc: "Hezbollah has been trying to capture all of Lebanon, or at the least, exert its military control over it. We will not let an Iranian proxy do this, as we are going to be taking Lebanon as a protectorate of Turkey"
 TUR_anti_iran_diplomacy: "イラン・ドクトリンの制限"
 TUR_anti_iran_diplomacy_desc: "シリア軍はイランに出入りする多くの顧問を抱えてきた。その理由から、彼らの訓練と戦闘方法は非常に似ており、もしイランと戦争になれば、我々の戦術は予測可能であるため、問題を引き起こすだろう。"
 TUR_turkey_syria_union: "トルコ＝シリア連合"
 TUR_turkey_syria_union_desc: "我々とシリアの両方が、人々がいつも互いに混同する宗教的少数派によって統治されているため、力を合わせ、政治的連合を創設すべきだろうか？単独の宗派として、地域におけるスンナ派の影響力に抵抗するチャンスはない。"
 TUR_ottoman_revival: "オスマン復活"
 TUR_ottoman_revival_desc: "§GThe Ottomans§!, once one of the greatest empires centuries ago, have returned. However today, the political landscape has §Hshifted drastically§!, and a heightened sense of §Hnationalism§! makes reuniting the empire a §Rdaunting task for anyone§!. For this reason, the §Gnew Ottoman state§! has to find ways to prove that it will offer a better life to its §Hformer territories§!. We will have §H3 sections of peoples to appease§!, The Middle East, The Levant, and The Balkans. Each one of these sections will have §Hseveral countries§! within them that we can §Hboost our support in§!, and once we hit §H100% support§! in any of these countries, we will be able to §Hgain cores§! and the trust of its people.\n\nIn the §RMiddle East§! our support is currently:\n\n[IRQ.GetFlag]Iraq: §Y[?osman_iraq|%]§!\n\n[SYR.GetFlag]Syria: §Y[?osman_syria|%]§!\n\n[KUW.GetFlag]Kuwait: §Y[?osman_kuwait|%]§!\n\nIn the §RLevant§! our support is currently:\n\n[JOR.GetFlag]Jordan: §Y[?osman_jor|%]§!\n\n[ISR.GetFlag][PAL.GetFlag]Israel/Palestine: §Y[?osman_isr|%]§!\n\n[LEB.GetFlag]Lebanon: §Y[?osman_leb|%]§!\n\n[HEJ.GetFlag]Hejaz: §Y[?osman_sau|%]§!\n\nIn the §RBalkans§! our support is currently:\n\n[GRE.GetFlag]Greece: §Y[?osman_gre|%]§!\n\n[BUL.GetFlag]Bulgaria: §Y[?osman_bul|%]§!\n\n[FYR.GetFlag]Macedonia: §Y[?osman_fyr|%]§!"
 TUR_pan_turkic_dream: "汎テュルクの夢"
 TUR_pan_turkic_dream_desc: "Our great nation has envisioned a new §CPan Turkic Dream§!. We will utilize the §HOrganization of Turkic States§! as a means to garner support and influence within Turkic States, and slowly sway them to join us as one nation. If we are successful in doing so, we will be able to grow our nation to the point where we can be considered a great power in the world. §HTurkic Countries eligible to join the Turkic Confederation will be more likely to join if they have a higher opinion of us!§!"
 TUR_domestic_politics_category: "トルコの国内政治"
 TUR_economy_category: "経済危機"
 TUR_mafia_category: "トルコ・マフィア"
 TUR_mafia_category_desc: "The Turkish Mafia has been active for quite some time, committing crimes such as drug dealings, murders, fraud, you name it. In recent years however, they have begun becoming more and more political, and certain parties have been caught making deals with them, and slowly giving them more legitimacy.\n\n §YMafia Influence§! measures the overall influence §Hthe Mafia§! has in the nation. If their influence is  §H60§! or higher, then they will be capable of carrying out political Assassinations, either towards the leadership of our internal factions, or the military. §Hthe Mafia§! will also cause us to lose money, and lots of it too, as the higher influence allows more people to be able to commit fraud and tax related crimes. Additionally, §HMafia Influence§! will §Rincrease every two weeks by 1§! if their influence reaches §H60§!. This can happen if we neglect certain events, or if we make poor choices when it comes to dealing with §Hthe Mafia§!. We can combat §HMafia Influence§! by raiding their safe houses, increasing our police spending, or even maintaining party popularity so that our people aren't affected by their campaigns. Additionally, if we get §HMafia Influence§! Below §H30§!, we will be able to make arrests of wanted §HMafia§! criminals, eventually allowing us to completely eradicate §Hthe Mafia§!.\n\n§HMafia Influence§!: §R[?TUR.TUR_mafia_influence]§!"
 TUR_conduct_anti_mafia_raid: "対マフィア作戦の実施"
 TUR_conduct_anti_mafia_raid_desc: "マフィアを掃討作戦を実施することにより、例外的に高いコストがかかるものの、彼らの影響力を迅速に減少させることができるだろう。"
 TUR_arrest_mafia_west: "Arrest Mafia members in Western Turkey"
 TUR_arrest_mafia_central: "トルコ中央部でマフィア構成員を逮捕"
 TUR_arrest_mafia_south: "トルコ南部でマフィア構成員を逮捕"
 TUR_arrest_mafia_east: "トルコ東部でマフィア構成員を逮捕"
 TUR_victory_over_mafia: "§Pマフィア根絶§!"
 TUR_mafia_influence_mechanic: "グローバルミッション"
 TUR_mafia_influence_mechanic_desc: "§PThe Turkish Mafia§! has proven itself to be more than just a domestic group of gang members, it is much more than that. §HThe Turkish Mafia has ties and influence all over the world§!, but more so in certain places than others. Through the use of the Turkish diaspora, the Turkish Mafia is able to §Hgain support§! and §Hinfluence§! over other nations, and use them to prop up new §PMafia-Proxies§!. Doing this will let the §HTurkish Mafia§! pull strings in governments globally, and even in some cases, §Roverthrow them§!.\n\nAs indicated by the visuals below, the §Hhigher the Mafia influence§! in certain countries, the more control they have. If Mafia influence is §Rlow§!, then the Mafia is §Runable§! to do anything drastic. But if the §HMafia influence is high§!, there are §Ga lot§! more options.\n\n§HInfluence in the UK§!: §G[?mafia_uk|%]§!\n§HInfluence in Germany§!: §G[?mafia_germany|%]§!\n§HInfluence in the Netherlands§!: §G[?mafia_holland|%]§!\n§HInfluence in Australia§!: §G[?mafia_australia|%]§!\n§HInfluence in Belgium§!: §G[?mafia_belgium|%]§!\n\nNo color - Low Influence\n§YYellow§! - Some influence\n§RRed§! - A lot of influence\n"
 TUR_start_eng_operations: "イギリスでの作戦開始"
 TUR_close_eng_operations: "イギリスでの作戦終了"
 TUR_boost_british_firms: "英国企業の支援"
 TUR_fund_ira: "分離主義者への資金提供"
 TUR_sow_division: "Sow division within politics"
 TUR_shatter_the_kingdom: "§P王国の粉砕§!"
 TUR_start_ger_operations: "ドイツでの作戦開始"
 TUR_close_ger_operations: "ドイツでの作戦終了"
 TUR_gray_wolves_networks: "灰色の狼ネットワークの拡大"
 TUR_commit_vehicle_rob: "Smuggle out German vehicles"
 TUR_attack_german_politics: "汚職政治家を探す"
 TUR_take_german_industries: "§P主要産業セクターの支配権掌握§!"
 TUR_take_german_industries_desc: "Due to the high amount of corruption in German politics, we are able to easily seize important industrial sectors for our own needs."
 TUR_start_hol_operations: "オランダでの作戦開始"
 TUR_close_hol_operations: "オランダでの作戦終了"
 TUR_establish_drug_networks_rotterdam: "麻薬ネットワークの拡大"
 TUR_decrease_policing_holland: "警察資金への攻撃"
 TUR_largest_drug_network: "§P巨大麻薬ハブ設立§!"
 TUR_start_aus_operations: "オーストラリアでの作戦開始"
 TUR_close_aus_operations: "オーストラリアでの作戦終了"
 TUR_boost_honoured_society: "名誉ある社会の扇動"
 TUR_target_aussie_welfare: "オーストラリアの生活水準への攻撃"
 TUR_spread_hatred_indonesia: "Start rumours between Indonesia and Australia"
 TUR_watch_the_conflict: "§Pオーストラリアの宝物を盗む§!"
 TUR_watch_the_conflict_desc: "Using our connections and influence, we will steal Australian precious metals and use them for our own good."
 TUR_start_bel_operations: "ベルギーでの作戦開始"
 TUR_close_bel_operations: "ベルギーでの作戦終了"
 TUR_fund_bel_mafia: "ベルギーの犯罪者を引き込む"
 TUR_steal_crucial_info: "科学資料の窃盗"
 TUR_strings_in_belgian_govt: "ベルギー政府での糸引き"
 TUR_our_puppets: "§P重要なベルギーの研究者を連れ出す§!"
 TUR_our_puppets_desc: "重要なベルギーの研究者を連れ出すことにより、トルコで彼らを我々の利益のために利用できる。"
 TUR_hire_gulenist_economic_advisors: "ギュレン派経済顧問の雇用"
 TUR_hire_gulenist_economic_advisors_desc: "国際的経済学者を大規模に引き抜いて、経済運営について助言を得るために雇うことができる。"
 TUR_employ_gulenist_informants: "ギュレン派情報提供者の雇用"
 TUR_employ_gulenist_informants_desc: "ギュレン運動は世界中に広がっている。情報提供者を雇うことにより、情報収集が容易になるだろう。"
 TUR_hire_gulenist_educators: "ギュレン派教育者の雇用"
 TUR_hire_gulenist_educators_desc: "世界にいる多くの有名なギュレン派学者を雇うことにより、教育効果を大幅に高めることができる。"
 TUR_recall_gulenists: "ギュレン派の呼び戻し"
 TUR_recall_gulenists_desc: "国に奉仕するために、ギュレン派をトルコに招待すべきである。"
 TUR_call_out_ozkan: "オズカン副首相への非難"
 TUR_call_out_ozkan_desc: "[ROOT.GetLeader]を権力から排除しようとする蛇のようなオズカンを非難する必要がある。しかし、もし辞任を余儀なくされれば、彼が新しい政党を結成するリスクがある。"
 TUR_ban_fazilet_partisi: "§W[Conservative_L]§!を禁止する"
 TUR_ban_fazilet_partisi_desc: "The §W[Conservative_L]§! is an islamist political party, and in a secular Turkish state there is no room for such parties. Many of its members have already participated in now banned islamist parties before. Banning §W[Conservative_L]§! won't have a lasting effect, as its members will just form a new political party, but it might cause some factionalism and weakening of our opponents overall"
 TUR_big_crash_coming: "大暴落からの回復"
 TUR_big_crash_coming_desc: "Our economy has got much worse since 2013, and this will drag us into a depression."
 TUR_sell_reserves: "準備金の売却"
 TUR_sell_reserves_desc: "準備金を売却することで、大暴落を遅らせることができる。"
 TUR_imf_program: "IMFプログラムへの回帰"
 TUR_imf_program_desc: "The IMF Program was the economic plan of Turkey between 2001 and 2008, when the economy grew rapidly. Erdogan said \"Who gets loans today money takes orders tomorrow.\" and stated that the IMF is dangerous. Then the IMF Program was cancelled and Turkey paid all the debt taken from IMF."
 TUR_law_reform: "法の改革"
 TUR_law_reform_desc: "Reforming the law and making the courts independent is an important step to fix the economy, but there may be corruption scandals about AKP."
 TUR_reestablish_village_institutes: "村落学校の再設立"
 TUR_reestablish_village_institutes_desc: "村落学校は、より農村地域に様々なスキルを教えるために地元住民によって運営される地方教育センターである。"
 TUR_incentivise_modern_farming: "近代農業の奨励"
 TUR_incentivise_modern_farming_desc: "農家と農産物の購入者に税制上の免除を与える必要がある。また、農業プロセスにより密接に技術を組み込む必要がある。"
 TUR_heavily_subsidise_agriculture: "農業への重補助金"
 TUR_heavily_subsidise_agriculture_desc: "強力な農業部門を持つためには、農家に重く補助金を出す必要がある。"
 TUR_encourage_communal_farming: "共同農業の奨励"
 TUR_encourage_communal_farming_desc: "大規模な企業経営農場を押しやるために、共同農業を奨励する必要がある。"
 TUR_implement_revolutionary_education: "革命的教育の実施"
 TUR_implement_revolutionary_education_desc: "人々が正気を保つことを確認するために、革命的教育を教育システムに組み込む必要がある。"
 TUR_migrants: "移民法の改正"
 TUR_migrants_desc: "近隣諸国の混乱のために人々が殺到しているため、移民法を見直す必要がある。"
 TUR_mit_decision: "MIT改革"
 TUR_mit_decision_desc: "国家安全保障サービスであるMITは、新しい議題により良く適合するように改革される必要がある。"
 TUR_disaster_decision: "災害救援計画の確立"
 TUR_disaster_decision_desc: "地震や自然災害があちこちで発生しており、できるだけ早くそれらに対処する方法を見つけ出す必要がある。"
 TUR_nationalist_rise: "トルコ民族主義の高まり"
 TUR_nationalist_rise_desc: "Although nationalism is not always a bad thing, too much of it is. And that is the case in our country, as currently it is leading to ethnic conflicts within our own borders."
 TUR_drug_problems_decision: "薬物問題"
 TUR_drug_problems_decision_desc: "There are a lot of drugs coming in and out of Turkey. This causes problems for us, and our neighbors, and our people."
 TUR_redesign_bosphorus: "ボスポラス海峡の再設計"
 TUR_redesign_bosphorus_desc: "The banks of the Bosphorus are full of modern tall buildings, with a lot of the historical architecture having been completely erased. We need to limit the development of the area and return the area back to its old beautiful style. The banks will be an area where all citizens of Istanbul can spend their time"
 TUR_establish_shia_dominance: "シーア派支配の確立"
 TUR_establish_shia_dominance_desc: "トルコにおける最大の宗教的少数派の一つはアレヴィー派 (アラウィー派と混同しないように）であり、人口の10%から20%を占める。アレヴィー派はいくつかの虐殺の標的とされており、トルコ政府は彼らを支配的なスンナ派とは別の宗教グループとして指定することに乗り気ではなかった。厳密には公式なシーア派ではないが、アレヴィー派はイランの前アーヤトッラー、ルーホッラー・ホメイニーによってそのように指定された。多くのアレヴィー派も自らをシーア派と見なしている。トルコにおけるスンナ派支配を打ち破る必要がある。"
 TUR_greek_issues: "友か、敵か？"
 TUR_greek_issues_desc: "The Greeks, once our historic province, were forced to be in an alliance with us due to NATO. However, despite the alliance, our relations did not get any better because of the countless disputes we have"
 TUR_cypriot_troubles: "キプロスの厄介事"
 TUR_cypriot_troubles_desc: "Cyprus has been an island of endless conflict ever since we moved our troops into the North. The Greeks have never shut up about it, and they are seemingly trying to destroy our gains in the island nation. We will have to deal with this accordingly"
 TUR_direct_involvement: "直接介入"
 TUR_direct_involvement_desc: "NATOを脱退したので、もはやトルコの影響力を行使する能力に対する多くの制限によって妨げられることはない。これは、能力を制限する必要なく、キプロスに直接介入できることを意味する。"
 TUR_demand_british_withdrawal: "英国への撤退要求"
 TUR_demand_british_withdrawal_desc: "The British have historically stuck their noses into everything, but in recent years their empire has been crumbling. Cyprus, has been an exception however. The British still maintain a presence in Akrotiri, and it is going to cause us problems when we inevitably expand south-ward"
 TUR_bring_the_north_to_fold: "トルコとの統一"
 TUR_bring_the_north_to_fold_desc: "北キプロス人はトルコ人であり、複数のトルコ系国家が存在する意味はない。彼らの政府に我々に加わり、トルコ民族を統一するよう要求するだろう。"
 TUR_history_repeated: "始めたことを終わらせる"
 TUR_history_repeated_desc: "始めたことを終わらせる必要がある。南下を続けないという悲惨な決定の後、キプロスは二つに分裂した。軍隊を動員し、ギリシャ人が好む好まざるにかかわらず、キプロスの残りの部分への第二次侵攻を実施しなければならない！"
 TUR_indirect_involvement: "間接介入"
 TUR_indirect_involvement_desc: "共和国として、好きなときに紛争を開始して回ることはできない、もっと自制心を持たなければならない。したがって、キプロスに関しては、より間接的なアプローチを取り、北キプロスの正当な政府を支援するだろう。"
 TUR_provide_military_training: "軍事訓練の提供"
 TUR_provide_military_training_desc: "We will send some experts from the Turkish Armed Forces to train Militias in North Cyprus in preparation of their inevitable clash"
 TUR_fund_militias: "キプロス民兵への資金提供"
 TUR_fund_militias_desc: "Now that we have provided the Militias with some training, we can safely give them some weapons and extra funding as we know they will be competent enough in taking back South Cyprus"
 TUR_great_uprising: "ゲームを始めよう！"
 TUR_great_uprising_desc: "南キプロス人に対する彼らの民兵を訓練し、資金提供し、武装させることに成功したので、今や北キプロス人による我々のための戦争を座って見ることができる。"
 TUR_path_of_compromise: "妥協の道"
 TUR_path_of_compromise_desc: "隣国と別の終わりのない紛争を開始するよりも、和解し、友情を強化する方が賢明である。"
 TUR_withdraw_support_cyprus: "トルコ支援撤回"
 TUR_withdraw_support_cyprus_desc: "もはや北キプロス政府を支援せず、南キプロス政府を唯一のキプロス国家政府および国家として承認するだろう。"
 TUR_support_one_cyprus: "一つのキプロスの物語"
 TUR_support_one_cyprus_desc: "We will publically back the concept of one Cyprus, and we will backpedal decades of politics that kept Cyprus divided!"
 TUR_peaceful_unification: "平和的統一？"
 TUR_peaceful_unification_desc: "北キプロス政府に南キプロス政府と合流するよう平和的に……謙虚に要請するだろう……"
 TUR_acquire_agean: "エーゲ海要求"
 TUR_acquire_agean_desc: "Now that we have officially shown the Greeks that we are willing to compromise, even if it means abandoning our national interests, we will kindly ask them to transfer the Aegean into Turkish control"
 TUR_aegan_dispute: "エーゲ海紛争"
 TUR_aegan_dispute_desc: "The Aegean islands have been controlled by Greece ever since the end of WW1, and its disastrous consequences for the Turkish nation. Even though we have held historic claims on the islands, the Greek government is hesitant to even give us partial control of the islands, meaning that we will need to figure out a way to do it through force"
 TUR_crete_rebellion: "クレタ反乱扇動"
 TUR_crete_rebellion_desc: "If we can get the Cretan people to feel occupied under Greek control, we can perhaps gain something even if it is not the Aegean"
 TUR_arm_crete_national_army: "クレタ国軍結成"
 TUR_arm_crete_national_army_desc: "もし将来ギリシャ侵攻の日が来ることがあれば、彼らが自らを守ることができるように、クレタ国軍を結成するだろう。"
 TUR_smuggle_trucks: "トラック密輸"
 TUR_smuggle_trucks_desc: "クレタ国軍は小火器と砲兵だけでは運営できず、いくつかのトラックが必要だろう。彼らが準備できるように、いくつかのトラックを提供する。"
 TUR_let_the_games_begin: "Cretan Independence!"
 TUR_let_the_games_begin_desc: "今日はクレタがついにギリシャからの独立を宣言し、トルコの保護国となる日だ！"
 TUR_fortify_coast: "アテネに対するプロパガンダ"
 TUR_fortify_coast_desc: "We will start publically broadcasting propaganda against the Greeks by bribing Greek television stations. This will start slowly destabilizing the nation, and giving us an edge during conflict"
 TUR_border_pictures: "汚職政治家の利用"
 TUR_border_pictures_desc: "ギリシャの汚職政治家の懐は深く、望む政党に影響を与えるために彼らの選挙システムで糸を引くことができるため、まもなくトルコの現金で満たされ始めるだろう。"
 TUR_last_second_upgrades: "彼らの産業を妨害する"
 TUR_last_second_upgrades_desc: "ギリシャに対していくらか影響力を持っているので、アテネで彼らに会うときに彼らが弱くなるよう、産業を妨害し始めることができる！"
 TUR_siege_of_greece: "5分以内にアテネへ"
 TUR_siege_of_greece_desc: "It shouldn't be long before Turkish armor and infantry start rolling into Athens and raising the Crescent flag on their soil!"
 TUR_operation_sledgehammer: "エルゲネコン裁判"
 TUR_operation_sledgehammer_desc: "The AKP has been eyeing the presidential office for quite some time now... And it won't be too long before they get what they have been so patiently waiting for."
 TUR_purge_army: "軍隊再編"
 TUR_purge_army_desc: "If we want even the slightest chance of staying in power for longer than 5 days, we are going to have to reorganize the entire army even if it means cutting down spending!"
 TUR_reorganize_army: "スレッジハンマー作戦"
 TUR_reorganize_army_desc: "スレッジハンマー作戦が開始され、それが終われば、直面するいかなる政治的反対も粛清する手段としてそれを使用できる。"
 TUR_purge_judges: "司法改革"
 TUR_purge_judges_desc: "There are a lot of Gülenist sympathizers within the legal system in our country, and we cannot let this happen as our system will be corrupted and against us"
 TUR_judges_become_criminals: "囚人服の裁判官"
 TUR_judges_become_criminals_desc: "Now that we have reformed all of the judicial system, and fired all potential Gülenist members within the system, we can finally persecute them without facing much resistance. We will also publically broadcast these trials so that people know what the consequences are"
 TUR_party_of_development_and_justice: "開発と正義の党？"
 TUR_party_of_development_and_justice_desc: "我々は開発と正義の党であるが、その約束を果たすかどうかは不明である。前途には非常に長い道があり、時間が経つにつれてその道を築く必要があるだろう。"
 TUR_zero_problems_policy: "問題ゼロ政策"
 TUR_zero_problems_policy_desc: "対立ではなく、協力と外交を最前線に置き、隣国との「問題ゼロ」政策を追求するだろう。"
 TUR_economic_cooperation_iran: "イランとの取引仲介"
 TUR_economic_cooperation_iran_desc: "イラン経済は何十年もの制裁の結果、投資を切実に必要としている。トルコ企業に領土内で店を構えるよう連絡することは、我々がいくらかの影響力を得ることができ、彼らが投資を得ることができるため、双方に利益をもたらすだろう。"
 TUR_mediate_nagarno_karabakh: "カラバフ紛争調停"
 TUR_mediate_nagarno_karabakh_desc: "親しい友人であるアゼルバイジャンは、国家間のわずかな領土を巡ってアルメニア人と戦ってきた。この紛争は必要なく、おそらく誰もが満足するように両者の間で協議を仲介できるだろう。"
 TUR_promote_turkish_interests_syria: "シリアにおけるトルコの利益促進"
 TUR_promote_turkish_interests_syria_desc: "General instability down south in Syria has given us a golden opportunity to exploit them for further influence"
 TUR_legalize_kurdish_language: "クルド語合法化"
 TUR_legalize_kurdish_language_desc: "The Kurdish language has been banned in Turkey for many years now, and it is probably best to leave it that way if we want to preserve Turkic dominance in Anatolia. But at what cost? We call ourselves a republic and yet we take away a people's right to speak their language?"
 TUR_open_hostilities_with_greece: "難民利用"
 TUR_open_hostilities_with_greece_desc: "トルコは主要な難民の目的地であるため、多数の難民を抱えている。彼らを有利に利用し、不安定さと混乱を引き起こすために国境を越えてギリシャへ送ることができる。"
 TUR_side_with_azerbaijan_against_armenia: "アゼルバイジャンを支持"
 TUR_side_with_azerbaijan_against_armenia_desc: "カラバフの正当な所有者はアゼルバイジャンであり、アルメニアはこれを知る必要がある。アゼルバイジャンを公に支持し、たとえそれが紛争のリスクを冒すとしても、さらなる行動を取るよう彼らを後押しする！"
 TUR_a_new_barrier: "緩衝地帯"
 TUR_a_new_barrier_desc: "シリアのクルド人は主権を脅かしている。我々とシリアの間に直ちに緩衝地帯を確立する必要がある！"
 TUR_tighten_kurdish_restrictions: "クルド人への規制強化"
 TUR_tighten_kurdish_restrictions_desc: "何をしても、クルド人は問題を引き起こし続ける。これでは我々の手が縛られているようなものだ。彼らが問題を引き起こすのを止めるまで制限を強化するしかない。"
 TUR_erdonomics: "エルドノミクス"
 TUR_erdonomics_desc: "Erdonomics is the wave of economic reforms brought forth by Recep Tayyip Erdogan and his party. There are several ways this can go, good, bad, or terrible, but it all comes down to how the policy is pursued"
 TUR_cheaper_credit: "金利とは何か？"
 TUR_cheaper_credit_desc: "真面目な話、それは必要なのか？"
 TUR_dont_fix_what_isnt_broken: "壊れてないなら直さなくてもいい"
 TUR_dont_fix_what_isnt_broken_desc: "トルコ経済は現状でうまくいっており、それ以上いじる必要はない。もしそうすれば、経済崩壊が起こるかもしれない。"
 TUR_digitalization_of_turkey: "トルコのデジタル化"
 TUR_digitalization_of_turkey_desc: "新しい技術と新時代の知識をもって21世紀に進む必要がある、さもなければ遅れを取るだろう。"
 TUR_lift_tv_restrictions: "テレビの制限解除"
 TUR_lift_tv_restrictions_desc: "トルコのテレビには多くの検閲が課せられている。それらを解除し、ずっと前に奪われた自由を許可することが最善の利益である。"
 TUR_return_to_tradition: "伝統への回帰"
 TUR_return_to_tradition_desc: "イスラムと深く絡み合ったルーツに戻る必要がある。保守主義こそが、トルコが社会の悪い手本となることから救うものだろう！"
 TUR_islamic_politics: "新しい顧問"
 TUR_islamic_politics_desc: "内閣は指導力を誤解させる役に立たない顧問で満ちている。経済であれ政策であれ、新しい者を見つける時が来た。"
 TUR_imams_in_office: "首相解任"
 TUR_imams_in_office_desc: "We will need to abolish the position of the prime minister so that our country's democracy can evolve and be reformed"
 TUR_mosque_funding: "モスクへの資金提供"
 TUR_mosque_funding_desc: "国内の保守的要素を獲得するためにはモスクからの支援が必要であり、それは最終的に農村の人々からのより多くの支持を得るだろう。"
 TUR_islamic_society: "社会におけるイスラム"
 TUR_islamic_society_desc: "Let us re-evaluate Islam's role in our society. We will need to expand Islamic teachings in our country one way or the other"
 TUR_expand_diyanet_role: "宗教庁"
 TUR_expand_diyanet_role_desc: "宗教庁は将来非常に有用であり、権力が国中に広く及ぶように社会における役割を拡大できる。"
 TUR_strings_in_judiciary: "司法への糸引き"
 TUR_strings_in_judiciary_desc: "我々は司法制度内に多くの伝手がある……それを利用してAKPをゆっくりと、しかし確実に根絶することができる。"
 TUR_connections_in_army: "軍内の同調者"
 TUR_connections_in_army_desc: "広範な支持基盤のおかげで、軍内のコネクションを使って彼らを獲得し、いかなる潜在的なクーデターも防ぐことができる。"
 TUR_suspicious_generals_resign: "不審な将軍に辞任の圧力"
 TUR_suspicious_generals_resign_desc: "トルコ軍（TSK）には現在活動中の多くの不審な将軍がいる。彼らの一部を辞任させることができ、そうすることで抵抗なく軍のすべての部門に対する支配を強化できるだろう。"
 TUR_cracks_in_akp: "AKP指導部の亀裂"
 TUR_cracks_in_akp_desc: "AKP指導部を公に非難し始め、党内に不安定さを創り出す。これは確かに彼らの人気を下げるだろうが、ほぼ確実にいくつかの抗議の雰囲気を作り出すだろう。"
 TUR_mobilize_diaspora: "ディアスポラ"
 TUR_mobilize_diaspora_desc: "他の国々のディアスポラを使って政府の正統性を得ることができる。"
 TUR_service_to_the_community: "コミュニティへの奉仕"
 TUR_service_to_the_community_desc: "Hizmet literally stands for Service, or service to one's community. We must uphold this ideal and start improving our society for the better"
 TUR_attack_the_left: "左派への攻撃"
 TUR_attack_the_left_desc: "左派は反イスラム的理想で国家を破滅させようとするだろう。彼らの正統性を攻撃し、公の場で悪く見せる必要がある。"
 TUR_attack_the_right: "右派への攻撃"
 TUR_attack_the_right_desc: "右派はこの国家の終わりとなるだろう、なぜなら彼らは国家を世界の他の地域から孤立させるからだ。彼らの行動はトルコを隣国との終わりのない紛争に引きずり込む可能性さえある！"
 TUR_ally_fp: "FPの運命"
 TUR_ally_fp_desc: "The FP party was banned before we rose to power, and they have quite a lot of loose members and groups. We can probably negotiate with some of them."
 TUR_clean_energy_shift: "クリーンエネルギーへの転換"
 TUR_clean_energy_shift_desc: "We need to do the Earth a giant favor, and it can be done by shifting our country towards cleaner energy. By using clean energy, we will be able to provide our nation with the necessary fuel whilst also protecting the environment from pollution."
 TUR_international_community: "国際社会"
 TUR_international_community_desc: "もちろん、主な焦点はトルコにあるが、全世界をより良い場所にする義務もある。"
 TUR_condemn_gulf_monarchies: "サウジの君主制を非難"
 TUR_condemn_gulf_monarchies_desc: "悲しいことにサウジは攻撃の道を選び、我々のグループをテロ組織として指定した。そのような攻撃は容認できないことを彼らに示さなければならない。"
 TUR_support_kosovo: "コソボを支援"
 TUR_support_kosovo_desc: "コソボはしばらくの間セルビア占領下にあり、仲間のイスラム教徒として、彼らに害を及ぼすことを許すことはできない。"
 TUR_fatih_university: "ファーティ大学"
 TUR_fatih_university_desc: "Fatih University has a lot of Gülenist sympathizers within its staff. We will give them some extra funds and spread the teachings of Gülen"
 TUR_strengthen_private_sector: "Strengthen Gülenist Businesses"
 TUR_strengthen_private_sector_desc: "現在、多くのビジネスがギュレン派によって所有・運営されており、それは国家における大きな利点を与えている。彼らに資金を提供し、地位を強化することは、近い将来深刻に役立つだろう。"
 TUR_gulenist_medias: "ギュレン派メディアへの資金提供"
 TUR_gulenist_medias_desc: "集会を開くことなくギュレンのメッセージを広める新しい方法を見つける必要がある。"
 TUR_zaman_media_group: "ザマン・メディアグループ、デジタル化へ"
 TUR_zaman_media_group_desc: "Zaman Media Group is a newspaper company which operates very closely with our government. Giving them a little boost can help them go digital and spread the message of Fethullah Gülen far and wide"
 TUR_gulenist_charity: "ギュレン慈善活動"
 TUR_gulenist_charity_desc: "イスラムの主要な柱の一つは施しである。我々の運動はこれを忘れず、貧しい人々や困窮している人々を助ける新しい慈善団体を創設することにコミットする。"
 TUR_kimse_yok_mu: "Kimse Yok Mu?"
 TUR_kimse_yok_mu_desc: "Is anyone there? is the name of one of the newly founded Gülenist charities which is going to help people in need"
 TUR_cultural_centers: "財閥の懐柔"
 TUR_cultural_centers_desc: "コングロマリットは政府内に多くの影響力を持っており、非常に容易に政治に影響を与えることができる。彼らを懐柔することが最良の選択肢となるだろう。なぜなら、それはグループによって引き起こされる将来の頭痛を防ぐことができるからだ。"
 TUR_right_wing_victory: "右翼の勝利"
 TUR_right_wing_victory_desc: "The MHP has secured a win in the election, and will transform Turkey into a hyper-nationalist state with an aggressive policy towards other countries. Some fear that Turkey will soon become an international bully, as it slowly pushes its neighbors around."
 TUR_crack_down_secularists: "世俗主義者の弾圧"
 TUR_crack_down_secularists_desc: "世俗主義者は国にとって何が良いかを知らない人々のグループである。彼らがすることは、「個人の自由」を求めて泣き叫ぶだけであり、一般的に反イスラム的な見解を持っている。国家規模で彼らが勢いを得る能力を破壊し、彼らが行った変更を元に戻す必要がある！"
 TUR_crack_down_foreign_influence: "外国の影響力の弾圧"
 TUR_crack_down_foreign_influence_desc: "Foreigners are trying to run Turkiye for us! We need to get rid of them immediately and run it ourselves"
 TUR_crack_down_corruption: "汚職弾圧"
 TUR_crack_down_corruption_desc: "腐敗した政治家は国家を遅らせ、もし国家が本来あるべきように機能していなければ、遅れを取るだろう。腐敗した政治家を粛清することが、我々が前進する唯一の方法である。"
 TUR_crackdown_kurdish_resistance: "PKKの抵抗の弾圧"
 TUR_crackdown_kurdish_resistance_desc: "The PKK are causing quite a lot of problems for us. We will quite frankly need to deal with them more aggressively"
 TUR_demand_return_of_suspects: "容疑者の返還要求"
 TUR_demand_return_of_suspects_desc: "There are a lot of PKK members in other countries. We will demand these countries deport these individuals immediately so we can hold trials and limit their influence"
 TUR_the_threat_abroad: "国外の脅威"
 TUR_the_threat_abroad_desc: "There is a major threat abroad, and we are in between it. The East and the West of our country holds our nation's enemies, who so desperately try to destroy us"
 TUR_eastern_nuisance: "東方の厄介者"
 TUR_eastern_nuisance_desc: "The Iranians and Russians have been our historic enemies, for centuries. But in the modern day, they wear fake masks and pretend to be our friends, but this cannot be! We will cut them out and pursue actions that really put them in their place"
 TUR_fight_russian_influence: "ロシアの影響力への対抗"
 TUR_fight_russian_influence_desc: "ロシア人は我々の政治と隣国の政治に影響を与えようとしている。最初に行わなければならないことは、この影響力に我々自身の影響力で対抗することである。"
 TUR_hamper_the_ayatollahs: "イランの成長の抑制"
 TUR_hamper_the_ayatollahs_desc: "The Iranians are advancing, and growing quite quickly. We will need to hamper their ability to do so as soon as possible"
 TUR_balkan_pests: "バルカンの害虫"
 TUR_balkan_pests_desc: "We have historically owned the Balkans, and when we did, it was quite peaceful. But during the Balkan Wars we lost the Balkans. Today however, we will take them back, and we will take them back with great pride!"
 TUR_thrace_becomes_one: "トラキアは一つになる"
 TUR_thrace_becomes_one_desc: "Thrace is split into two, one side of it is on our territory, and the other is in Greece. Why must this be? We will make sure the people of Thrace are united under one flag, the Crescent and the Star"
 TUR_campaign_against_athens: "ブルガリアの再征服"
 TUR_campaign_against_athens_desc: "ブルガリアは我々から離脱した多くのヴィライェト（州）の一つである。彼らを取り戻し、再びトルコ民族と団結させることが我々の義務である。"
 TUR_end_of_elections: "共和国の終焉"
 TUR_end_of_elections_desc: "この日、トルコ共和国はもはや存在しないだろう。国民はいわゆる「選挙で選ばれた政府」という口実の下で抑圧され、洗脳されてきた。国民は何十年ものケマリストシステムによって誤解され、嘘をつかれ、操作されてきた。"
 TUR_pan_turkey: "汎テュルクの夢"
 TUR_pan_turkey_desc: "今日、テュルク諸語を話す人々はいくつかの異なる領土に分裂している。一部はここトルコに、一部はコーカサスに、そして一部は中央アジアにいる。テュルクの夢は忘れられず、人々は再び団結するだろう。"
 TUR_a_new_empire: "とても飢えた狼……"
 TUR_a_new_empire_desc: "The Turkish Wolf has been starving for decades, it can no longer howl. But this will change, the world will tremble as they see the Turkish nation carve the world for itself and its people"
 TUR_ottoman_politics: "[ROOT.TUR_ottomanism_name]"
 TUR_ottoman_politics_desc: "[ROOT.TUR_ottomanism_name_desc]"
 TUR_nine_light_name: "九つの光ドクトリン"
 TUR_nine_light_name_desc: "九つの光ドクトリンはトルコ民族主義とイスラム教に基づいている。それはすべての人々にとっての善の理想を表しており、我が党はそれによって大きく形作られてきた。"
 TUR_ottomanism_name: "オスマン政治"
 TUR_ottomanism_name_desc: "我々の祖先は何の問題もなく統治することができた。それは、成功するためには彼らの足跡を辿る以外道はないということだ。"
 TUR_a_new_army: "OKKへの資金刷新"
 TUR_a_new_army_desc: "Yes, the Janissaries were cool and all, but, perhaps we can try something newer. We will increase our funding for the Ozel Kuvvetler Komutanligi, or our special forces units"
 TUR_return_to_sunni_dominance: "スンナ派支配への回帰"
 TUR_return_to_sunni_dominance_desc: "我々はイスラムのルーツからあまりにも遠く離れてしまった。我々は、すべての同胞にスンナ派イスラム教を奨励することによって、古いやり方を取り戻すだろう。"
 TUR_supporting_conservatives: "保守派組織への支援"
 TUR_supporting_conservatives_desc: "我々は一党独裁国家になるつもりだが、必ずしも我々を支持しない人々が我々のイデオロギーと価値観を支持できるように、他の保守組織に資金を提供する。"
 TUR_osman_alliance: "オスマン家の強化"
 TUR_osman_alliance_desc: "新しいトルコの超大国を創設するという我々の夢には、いくらかの正統性が必要である。我々はオスマン家に連絡を取り、我々の政府に参加させ、彼らを強化し、我々の失われた帝国の栄光を復活させることができる！"
 TUR_turkish_relations: "トルコの関係"
 TUR_turkish_relations_desc: "We are centered in between Europe and Asia, making diplomacy with us very important. But, we also have a say in who we want to align with. The West, have supported us for decades, but the East is now trying to do the same."
 TUR_eastern_alignment: "東側との連携"
 TUR_eastern_alignment_desc: "NATO had all of its benefits, but they forced us to change our governance and culture in more ways than the East has. For that reason, to maintain our independence and culture, it is best we seek out formal ties with the East."
 TUR_military_coop_india: "インドとの軍事協力"
 TUR_military_coop_india_desc: "我々はインドとの長期的な軍事協力から利益を得ることができる。我々の軍隊が共に訓練し演習を行うことにより、我々は新しい戦術と戦略を学びつつ、両国をより近づけることができる。"
 TUR_support_belt_road_china: "一帯一路構想への支援"
 TUR_support_belt_road_china_desc: "The Belt and Road initiative is a massive infrastructure plan led by the Chinese to bring proper infrastructure all around the globe. Why must we oppose such an initiative?"
 TUR_schools_in_pakistan: "パキスタンでの学校への資金提供"
 TUR_schools_in_pakistan_desc: "パキスタンは適切な教育インフラを緊急に必要としており、我々は人々が学ぶための新しい学校を建設することによってそれの提供を試みる。"
 TUR_turkstream_russia_pipeline: "トルコストリーム＝ロシアパイプライン"
 TUR_turkstream_russia_pipeline_desc: "トルコストリームパイプラインは、ロシアからトルコへ走る天然ガスパイプラインである。このパイプラインは西ヨーロッパの一部に多くの天然ガスを供給し、経済を助ける上で不可欠となり得る。"
 TUR_afghan_roads: "アフガニスタンの道路"
 TUR_afghan_roads_desc: "Afghanistan has very few functioning roads due to their civil war which has lasted decades. We are able to construct some for them so that their citizens can get from place to place without problems."
 TUR_mutual_tourism_indonesia: "インドネシアとの相互観光"
 TUR_mutual_tourism_indonesia_desc: "インドネシアとの観光プログラムを確立することにより、我々の両経済は新規参入者と観光客から利益を得ることができる。"
 TUR_provide_aid_yemen: "イエメンの空港"
 TUR_provide_aid_yemen_desc: "Yemen needs adequate Airports, and we can provide that to them with the experts from our country."
 TUR_industrial_investments_egypt: "エジプト人労働者の雇用"
 TUR_industrial_investments_egypt_desc: "我々は工場のためにエジプト人労働者を大量に雇用することができる。これにより、コストを削減し、エジプトの人々に雇用機会を提供することができる。"
 TUR_religious_tourism_saudi: "サウジアラビアとの宗教観光"
 TUR_religious_tourism_saudi_desc: "サウジアラビアはその国境内にイスラム教で最も神聖な場所の一つを持っている。その理由から、我々の人々がより安全かつ迅速にそこに旅行できるように、我々は彼らといくつかの取引をする必要があるだろう。"
 TUR_investments_in_qatar: "カタールにおける軍事基地"
 TUR_investments_in_qatar_desc: "我々は軍事的に近づくことができるように、カタールに軍事基地を設立させるよう依頼するつもりである。我々はまた、地域の他の脅威から彼らを守ろうと試みることもできる。"
 TUR_western_alignment: "西側との連携を維持"
 TUR_western_alignment_desc: "西側との長年の友情の後、なぜ我々は何か他のものを探しに出かけるべきなのか？ 我々の外交政策に抜本的な変更がなされないように、我々が西側との連携を維持するのが最善である。"
 TUR_counter_terror_with_us: "テロ対策"
 TUR_counter_terror_with_us_desc: "我々は中東における対テロ作戦でアメリカ合衆国を支援するつもりである。そうすれば、地域はより安全で安定することができる。"
 TUR_archeology_coop_italy: "イタリアとの考古学における協力"
 TUR_archeology_coop_italy_desc: "We have had historic ties with the Italians, dating back hundreds of years, but we are yet to discover all of the treasures that are buried under our lands. We will call on archeological experts from Italy to come help dig them up!"
 TUR_encourage_migration_germany: "ドイツからの移民奨励"
 TUR_encourage_migration_germany_desc: "我々の多くの人々がドイツに行っているが、ドイツ人は同じことをしていない。我々が国家のるつぼとなることができるように、我々はドイツ人にいくつかの移民を送るよう依頼するつもりである。"
 TUR_sports_diplomacy_brazil: "ブラジルとのスポーツ外交"
 TUR_sports_diplomacy_brazil_desc: "ブラジル人はサッカーを愛しており、我々もそうだ。そのため、我々はブラジル人とスポーツ外交を追求し、我が国で彼らに親善試合をさせるつもりである。"
 TUR_join_business_councils_morocco: "Joint Business Councils with Morocco"
 TUR_join_business_councils_morocco_desc: "Establishing joint business councils with Morocco would help both of us greatly, as we are able to get our companies to cooperate with each other, letting them expand."
 TUR_humanitarian_help_australia: "オーストラリアからの人道専門家"
 TUR_humanitarian_help_australia_desc: "オーストラリアはあらゆる種類の災害を経験しており、最近我々も多くの災害を経験している。オーストラリア人に我々を助けてもらうことにより、何か悪いことが起こった場合に備えて、我々はもう少し準備ができるようになる。"
 TUR_great_east: "大東方"
 TUR_great_east_desc: "Our organization, The Great Eastern Islamic Raiders' Front, vows to bring historic changes to the Turkish nation. No longer will we be held back by imperialist ideology, we will persevere!"
 TUR_dismantle_the_republic: "共和国解体"
 TUR_dismantle_the_republic_desc: "我々が政権を握った今、共和国は必要ない。共和国はできるだけ早く解体されなければならず、軍隊は粛清されなければならない！"
 TUR_ties_with_saud: "サウード家との関係"
 TUR_ties_with_saud_desc: "多くの国が我が国との関係維持に興味を持たないだろうが、サウジアラビアは違う。彼らは我々と同様のイデオロギーを共有しているので、我々との関係を維持することができる。そうすれば、我々の政府は一定レベルの国際的正統性を維持することができる。"
 TUR_islamic_legacy: "イスラムの遺産"
 TUR_islamic_legacy_desc: "イスラム教は我が国で非常に長い歴史を持っており、それを忘れることはできない。我々はそれをイデオロギー的目的のために我々の利益になるように利用するだろう。"
 TUR_combat_imperialism: "帝国主義との戦い"
 TUR_combat_imperialism_desc: "帝国主義的信念とイデオロギーが、かつて偉大だった我が国にすべて浸透した。これらの理想と戦うことが、我が国をかつての栄光に回復させる最善の方法である。"
 TUR_ban_kemalism: "世俗主義政党の禁止"
 TUR_ban_kemalism_desc: "世俗主義こそがこの国を滅ぼしたものである。イスラム教を強制的に排除することにより、世俗主義者たちは彼らの信念を国に押し付けることができたが、もはやそうすることはできないだろう！"
 TUR_demand_hejaz: "ヒジャーズの要求"
 TUR_demand_hejaz_desc: "サウジアラビアはイスラム世界における多くの重要な都市の領有権を主張しており、それらの都市は主にヒジャーズに位置している。もし彼らが紛争を避けたいなら、我々は彼らが我々の政府に領土の支配権を与えるよう要求するだろう。"
 TUR_sharia_mandate: "シャリーアの義務"
 TUR_sharia_mandate_desc: "我が国はイスラムの原則、そしてイスラムの原則のみによって導かれるだろう。シャリーア法が再び施行され、我が国が再び純粋で正義のあるものになることを可能にするだろう。"
 TUR_one_banner_one_people: "一つの旗、一つの人民"
 TUR_one_banner_one_people_desc: "我々の人々は一つの旗、イスラムの旗の下で団結するだろう。いくつかの言語を許可することによって我が国に人種的分裂を作り出す必要はない。"
 TUR_legalize_languages: "一つの旗、多くの人々"
 TUR_legalize_languages_desc: "Our people are free to speak whatever language they want. We should not cause a racial divide in our land by banning the use of several languages in the state"
 TUR_crack_down_shiism: "シーア派への制限"
 TUR_crack_down_shiism_desc: "We need to make sure that everyone assimilates into the Sunni sect, even if it means creating restrictions for Shi'ites. We will prohibit Shi'ite practices from public places, and we will fund campaigns that will encourage the Shi'ites to convert"
 TUR_return_of_caliphate: "カリフ制復活"
 TUR_return_of_caliphate_desc: "カリフ制は復活しなければならず、そしてそれは復活するだろう。我々は、もし必要ならば戦争と征服を通じて、カリフ制が再び統一されることを確認するつもりである。地域はもはや困難な場所ではなくなるだろう。"
 TUR_gender_differations: "性別の分離"
 TUR_gender_differations_desc: "我々は男性と女性で別々の施設を作らなければならない。バス停、学校、職場であろうと、宗教的目的のために男女は分離される必要がある！"
 TUR_enforce_dress_code: "服装規定"
 TUR_enforce_dress_code_desc: "我々は、我が国を純粋さと正義の道へと導く厳格な服装規定を施行するだろう。もし我々の人々が不適切な服装をしているなら、我々はいかにして精神的な進歩を期待できるだろうか？"
 TUR_westard: "西方への拡大"
 TUR_westard_desc: "オスマン帝国は弱く、カリフ制の西部を失った。我々はそれを変える。我々は誇りと偉大な力でそれを取り戻すだろう。"
 TUR_southward: "南方への拡大"
 TUR_southward_desc: "アラブ反乱とアラブ民族主義の台頭は、オスマン帝国による支配を困難にした。しかし、我々の政府の台頭と我々の偉大な力により、それが二度と起こらないことを保証する。"
 TUR_eastward: "東方への拡大"
 TUR_eastward_desc: "東部は我々から奪われた、それがロシア人によるものであろうと、ペルシャ人によるものであろうと。しかし今日、コーカサスは独立しているが、彼らはそう長くはないだろう。"
 TUR_african_holdings: "アフリカの領土"
 TUR_african_holdings_desc: "The Europeans and their colonial ambitions resulted in the loss of Ottoman African holdings. Unfortunately they were unable to expand or maintain their holds in Africa for very long as a result of the Europeans, but no one is stopping us now"
 TUR_turkish_intervention: "トルコ介入主義"
 TUR_turkish_intervention_desc: "The Turkish nation has intervened in several conflicts world wide, and it has helped project Turkish military power, and influence outwards. By intervening in other nations' internal conflicts, we are able to influence the outcomes of those wars to be more favorable for us"
 TUR_intervene_syrian_civilwar: "シリア内戦"
 TUR_intervene_syrian_civilwar_desc: "シリアは混乱に陥っており、我が国との近接性のため、傍観しているのは愚かなことだろう。"
 TUR_back_assad: "アサドへの支援"
 TUR_back_assad_desc: "アサドはシリアの正当な指導者であり、他のすべては非合法と見なされるべきだ！"
 TUR_back_fsa: "自由シリア軍(FSA)への支援"
 TUR_back_fsa_desc: "自由シリア軍は非常に正義のある大義、民主主義のために戦っている。我々はいかなる方法でも彼らを支援しなければならない。そうすれば、彼らが勝利し、シリア人民に自由の喜びをもたらすことができるだろう！"
 TUR_intervene_afghan_war: "アフガニスタン内戦"
 TUR_intervene_afghan_war_desc: "Afghanistan has been in a civil war for quite some time now, and not much has changed. Perhaps we can sway the outcome to be in our favor."
 TUR_a_new_stance: "新しい姿勢"
 TUR_a_new_stance_desc: "タリバンは長い間、自国への外国の影響力と介入を追放するために戦ってきた。そして、我々が介入して彼らを止めることは我々の立場ではない。代わりに、我々は彼らの大義を支持し、彼らが外国の搾取から自国を解放できるように彼らの軍隊を強化しなければならない。"
 TUR_northern_cause: "北部の大義"
 TUR_northern_cause_desc: "The Northern Alliance have been persistent in their efforts of expelling the vile Taliban from Afghanistan. The Taliban will bring nothing but tyranny, injustice, and oppression to Afghanistan, and we must help the Northern alliance defeat the Taliban!"
 TUR_intervene_iraq_war: "イラクへの介入"
 TUR_intervene_iraq_war_desc: "By exploiting the chaos in Iraq, we will be able to achieve certain goals of ours that have been put on hold for the longest time now."
 TUR_peacekeepers: "平和維持ミッション"
 TUR_peacekeepers_desc: "It would be best for us not to fan the flames any further, as the situation is already pretty bad in Iraq. Instead, we should opt to help the Iraqi people catch a break from the war by sending peace-keeping soldiers to villages and cities in the north."
 TUR_conduct_operation: "作戦実施"
 TUR_strike_pkk_bases: "PKKの拠点の襲撃"
 TUR_arrest_members: "PKK所属の容疑者を逮捕"
 TUR_attack_on_media: "反PKKプロパガンダ"
 TUR_allow_pkk_bases: "PKKの合法化"
 TUR_appease_PKK: "PKKの懐柔"
 TUR_forbid_pkk_bases: "PKKの禁止"
 TurkicConfederation.1.t: "トルコによるテュルク連邦への招待"
 TurkicConfederation.1.d: "The Turkish Government has approached us, asking us to join the newly founded Turkic Confederation. Obviously if we do join, we will be united, but we will lose our position as a sovereign country."
 TurkicConfederation.1.a: "テュルク民族は一つ！"
 TurkicConfederation.1.b: "参加しない方が良い……"
