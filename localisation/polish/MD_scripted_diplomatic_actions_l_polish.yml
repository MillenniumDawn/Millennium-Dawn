 OFFER_CIV_SPY_ACCESS_ACTION_DESC: "Umożliwienie dostępu do naszego cywilnego systemu satelitów rozpoznawczych w celu wsparcia ich działań w zakresie obserwacji i monitorowania Ziemi. Pakiet ten obejmuje udostępnianie danych obrazowych, wsparcie w zakresie integracji technicznej oraz koordynację działań dotyczących kompatybilnych naziemnych stacji analitycznych. Taki dostęp usprawnia monitorowanie środowiska, przygotowanie na wypadek sytuacji kryzysowych oraz planowanie infrastruktury cywilnej. W przypadku akceptacji uzyskamy dostęp do ich §Ycywilnej sieci satelitów rozpoznawczych§!."
