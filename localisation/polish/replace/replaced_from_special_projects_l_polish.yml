 sp_secure_military_network: "Bezpieczna sieć wojskowa"
 sp_secure_military_network_desc: "Zabezpieczona i szyfrowana krajowa szkieletowa sieć łączności, łącząca systemy dowodzenia, sensory oraz siły własne za pomocą odpornych łączy transmisji danych o niskich opóźnieniach."
 scientist_trait_antarctica_specialist: "Specjalista ds. badań polarnych"
 scientist_trait_antarctica_specialist_desc: "Zaprawiony w bojach badacz, który doskonale odnajduje się w najsurowszym środowisku na świecie, specjalizujący się w utrzymywaniu i rozwijaniu działań na antarktycznym lodzie."
 scientist_trait_naval_armament_specialist: "Specjalista ds. uzbrojenia morskiego"
 scientist_trait_naval_armament_specialist_desc: "Specjalista w dziedzinie uzbrojenia morskiego – od dział elektromagnetycznych i torped po roje dronów i moduły środków przeciwdziałania."
 scientist_trait_naval_propulsion_specialist: "Specjalista ds. napędów okrętowych"
 scientist_trait_naval_propulsion_specialist_desc: "Ekspert w dziedzinie zaawansowanych silników morskich, zwiększający prędkość i zasięg okrętów wojennych dzięki napędowi jądrowemu i fuzji jądrowej."
 scientist_trait_tank_firepower_specialist: "Specjalista ds. siły ognia czołgów"
 scientist_trait_tank_firepower_specialist_desc: "Ekspert w dziedzinie uzbrojenia pojazdów opancerzonych – od zaawansowanych armat i automatów ładujących po działa elektromagnetyczne i lasery montowane na pojazdach."
 scientist_trait_tank_armor_specialist: "Specjalista ds. zabezpieczeń czołgów"
 scientist_trait_tank_armor_specialist_desc: "Specjalista w dziedzinie przeżywalności pojazdów opancerzonych, zajmujący się opracowywaniem pancerzy kompozytowych, systemów ochrony aktywnej oraz kamuflażu adaptacyjnego."
 scientist_trait_tank_mobility_specialist: "Specjalista ds. mobilności czołgów"
 scientist_trait_tank_mobility_specialist_desc: "Ekspert w dziedzinie układów napędowych i podwozi pojazdów opancerzonych – od napędów elektrycznych po zawieszenia pojazdów kroczących."
 scientist_trait_robotics_specialist: "Ekspert ds. robotyki i systemów autonomicznych"
 scientist_trait_robotics_specialist_desc: "Pionier w dziedzinie systemów autonomicznych, uczący maszyny – na lądzie, morzu i w powietrzu – myślenia, polowania i pracy bez udziału człowieka."
 sp_amws_combat_system_desc: "Opracuj zaawansowany system uzbrojenia dla naszych platform HACS. Ukończenie tego projektu odblokowuje moduł systemu bojowego §Y AMWS-21§!."
 sp_zamws_advanced_mws_desc: "Opracuj bardziej zaawansowany system uzbrojenia wielokrotnego dla naszych platform HACS. Ukończenie tego projektu odblokowuje moduł §Y XAMWS-24 (Zaawansowany system uzbrojenia wielokrotnego)§!."
 sp_xciws_close_in_weapon_system_desc: "Opracuj system obrony bezpośredniej dla naszych platform HACS. Ukończenie tego projektu odblokuje moduł: §YSystem obrony bezpośredniej XCIWS-2B§!."
 sp_close_range_battle_halberd_desc: "Opracuj halabardę bojową bliskiego zasięgu dla naszych platform HACS. Ukończenie tego projektu odblokuje moduł: §YHalabarda bojowa bliskiego zasięgu Typ-77§!."
 sp_great_sword_desc: "Opracuj potężny wielki miecz dla naszych platform HACS. Ukończenie tego projektu odblokuje moduł: §YWielki miecz BWS-3§!."