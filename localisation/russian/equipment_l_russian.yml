 POL_attack_helicopter_1_short: "SM-2"
 POL_attack_helicopter_1_desc: "Польский лёгкий многоцелевой вертолёт, развитие советского вертолёта Ми-1, производившегося по лицензии на заводе WSK PZL-Świdnik."
 POL_attack_helicopter_2: "Ми-24Д"
 POL_attack_helicopter_2_short: "Ми-24Д"
 POL_attack_helicopter_2_desc: "Ми-24 — это вертолёт рубежа 1970-х и 1980-х годов. Его характерной особенностью является способность перевозить восемь солдат в транспортной части, именно поэтому Ми-24 не имеет прямого аналога на Западе."
