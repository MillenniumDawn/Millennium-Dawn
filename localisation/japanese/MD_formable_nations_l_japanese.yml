 ANDES_form_category: "アンデス連邦"
 ANDES_form_category_desc: "The Andean Federation is a proposed union of states amongst the countries of [COL.GetNameWithFlag], [PRU.GetNameWithFlag], and [BOL.GetNameWithFlag]. It is loosely based around the Andean Community which is a free trade/economic union amongst the countries. The new proposed nation would have a combined population of over one hundred and thirteen million inhabitants and an area of four million seven hundred thousand square kilometers. It will be a nation similar in size to Mexico with a GDP of three quarters of a trillion dollars."
