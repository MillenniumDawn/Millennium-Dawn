 module_tank_exoskeletal_engine_gen3: "첨단 외골격 엔진"
 module_tank_exoskeletal_engine_gen3_desc: "효율, 내구성, 제어 통합이 개선된 정련된 외골격 동력 골조로, 끊임없는 고장 없이 더 강력한 성능을 발휘할 수 있습니다. 기동성과 하중 허용치를 한층 높여 주지만, 대규모로 생산하기에는 여전히 비용이 많이 들고 자원이 많이 소요됩니다."
 module_tank_exoskeletal_engine_gen4: "최첨단 외골격 엔진"
 module_tank_exoskeletal_engine_gen4_desc: "효율, 내구성, 제어 통합이 개선된 정련된 외골격 동력 골조로, 끊임없는 고장 없이 더 강력한 성능을 발휘할 수 있습니다. 기동성과 하중 허용치를 한층 높여 주지만, 대규모로 생산하기에는 여전히 비용이 많이 들고 자원이 많이 소요됩니다."
 tank_small_medium_cannon_5: "초고도 경전차포"
 tank_small_medium_cannon_5_desc: "포구 속도가 증가하고 주력 전차포의 요소가 도입된 미래의 경전차포는 전장의 거의 모든 위협에 대응할 수 있을 것입니다.\n\n§G설계 힌트: 저구경 포는 포구 속도가 낮아 고폭탄에 적합합니다. 대물 공격보다 대인 공격을 우선시하려면 사용하십시오.§!"
 tank_small_medium_cannon_6: "초첨단 경전차포"
 tank_small_medium_cannon_6_desc: "포구 속도가 증가하고 주력 전차포의 요소가 도입된 미래의 경전차포는 전장의 거의 모든 위협에 대응할 수 있을 것입니다.\n\n§G설계 힌트: 저구경 포는 포구 속도가 낮아 고폭탄에 적합합니다. 대물 공격보다 대인 공격을 우선시하려면 사용하십시오.§!"
 tank_small_cannon_5: "초고도 경전차포"
 tank_small_cannon_5_desc: "나노기술과 컴퓨터 지원 설계의 도입으로 미래 경전차 주포의 전례 없는 발전이 가능해졌으며 경전차의 생존성과 출력 능력이 더욱 향상되었습니다."
 tank_small_cannon_6: "초첨단 경전차포"
 tank_small_cannon_6_desc: "나노기술과 컴퓨터 지원 설계의 도입으로 미래 경전차 주포의 전례 없는 발전이 가능해졌으며 경전차의 생존성과 출력 능력이 더욱 향상되었습니다."
 tank_medium_cannon_5: "초고도 중형 전차포"
 tank_medium_cannon_5_desc: "매우 정교한 중형 전차포입니다."
 tank_medium_cannon_6: "초첨단 중형 전차포"
 tank_medium_cannon_6_desc: "매우 정교한 중형 전차포입니다."
 tank_large_cannon_4: "초고도 중전차포"
 tank_large_cannon_4_desc: "개선된 설계를 통해, 발전된 중전차포에서 발사되는 탄약은 기갑 차량과 보병 모두에게 효과적인 타격을 입힙니다.\n\n§G설계 힌트: 중전차포는 주로 대전차 임무에 사용됩니다. 약간의 대인 공격 능력을 유지하면서도 대물 공격을 선호할 경우 사용하십시오.§!"
 tank_large_cannon_5: "초첨단 중전차포"
 tank_large_cannon_5_desc: "개선된 설계를 통해, 발전된 중전차포에서 발사되는 탄약은 기갑 차량과 보병 모두에게 효과적인 타격을 입힙니다.\n\n§G설계 힌트: 중전차포는 주로 대전차 임무에 사용됩니다. 약간의 대인 공격 능력을 유지하면서도 대물 공격을 선호할 경우 사용하십시오.§!"
 tank_very_large_cannon_4: "초고도 초중전차포"
 tank_very_large_cannon_4_desc: "전자기 가속 보조 장치가 추가되어, 초중전차포는 탄자를 통해 장갑은 물론 건물과 벙커까지 관통할 수 있습니다.\n\n§G설계 힌트: 초중전차포는 대전차 임무에 사용됩니다. 대인 공격보다 대물 공격을 압도적으로 선호할 경우 사용하십시오.§!"
 tank_very_large_cannon_5: "초첨단 초중전차포"
 tank_very_large_cannon_5_desc: "전자기 가속 보조 장치가 추가되어, 초중전차포는 탄자를 통해 장갑은 물론 건물과 벙커까지 관통할 수 있습니다.\n\n§G설계 힌트: 초중전차포는 대전차 임무에 사용됩니다. 대인 공격보다 대물 공격을 압도적으로 선호할 경우 사용하십시오.§!"
 art_small_gun_gen6: "초고도 경곡사포"
 art_small_gun_gen6_desc: "우리 제조 업체가 생산할 수 있는 최고의 제품인 이 이동식 포병은 모든 목표 지역에 포탄을 쏟아부을 것입니다."
 art_small_gun_gen7: "초첨단 경곡사포"
 art_small_gun_gen7_desc: "우리 제조 업체가 생산할 수 있는 최고의 제품인 이 이동식 포병은 모든 목표 지역에 포탄을 쏟아부을 것입니다."
 art_med_gun_gen6: "초고도 곡사포"
 art_med_gun_gen6_desc: "중형 포병 체계의 정점입니다. 이 포가 발사되는 지역은 그저 먼지와 흙더미로 변하게 될 것입니다."
 art_med_gun_gen7: "초첨단 곡사포"
 art_med_gun_gen7_desc: "중형 포병 체계의 정점입니다. 이 포가 발사되는 지역은 그저 먼지와 흙더미로 변하게 될 것입니다."
 art_big_gun_gen6: "초고도 첨단 곡사포"
 art_big_gun_gen6_desc: "완성도 높은 중량 포신과 발사 기구는 표적을 확실히 파괴해야 할 때 극도로 효과적인 중량급 장거리 포병의 개발로 이어집니다."
 art_big_gun_gen7: "초극 첨단 곡사포"
 art_big_gun_gen7_desc: "완성도 높은 중량 포신과 발사 기구는 표적을 확실히 파괴해야 할 때 극도로 효과적인 중량급 장거리 포병의 개발로 이어집니다."
 art_med_rocket_gen6: "초고도 중형 MLRS"
 art_med_rocket_gen6_desc: "중형 MLRS는 동시에 여러 종류의 로켓을 발사할 수 있습니다. 이 발사대는 평소보다 훨씬 빠르게 재장전할 수 있어, 여러 대의 플랫폼을 배치할 필요 없이 지속적인 화력을 투사할 수 있습니다."
 art_med_rocket_gen7: "초첨단 중형 MLRS"
 art_med_rocket_gen7_desc: "중형 MLRS는 동시에 여러 종류의 로켓을 발사할 수 있습니다. 이 발사대는 평소보다 훨씬 빠르게 재장전할 수 있어, 여러 대의 플랫폼을 배치할 필요 없이 지속적인 화력을 투사할 수 있습니다."
 fire_ammo_4: "초고도 첨단 네이팜 탄약"
 fire_ammo_4_desc: "로켓의 탄두를 네이팜으로 바꾸면 연약한 표적에 대한 효과를 높일 수 있습니다. 하지만 적 장갑차량과 싸우는 능력이 심각하게 떨어집니다."
 fire_ammo_5: "초극 첨단 네이팜 탄약"
 fire_ammo_5_desc: "로켓의 탄두를 네이팜으로 바꾸면 연약한 표적에 대한 효과를 높일 수 있습니다. 하지만 적 장갑차량과 싸우는 능력이 심각하게 떨어집니다."
 mine_ammo_4: "초고도 첨단 지뢰 살포 로켓"
 mine_ammo_4_desc: "집속 로켓과 비슷하게, 지뢰 살포 로켓은 더 작은 조각으로 분리되어 목표 지역을 대인 또는 대차량 지뢰로 채웁니다."
 mine_ammo_5: "초극 첨단 지뢰 살포 로켓"
 mine_ammo_5_desc: "집속 로켓과 비슷하게, 지뢰 살포 로켓은 더 작은 조각으로 분리되어 목표 지역을 대인 또는 대차량 지뢰로 채웁니다."
 heat_ammo_4: "초고도 첨단 HEAT 탄약"
 heat_ammo_4_desc: "HEAT(고폭 대전차) 탄은 적 장갑을 무력화하기 위해 만들어진 특수 탄종입니다. 포탄이 목표에 명중하면 폭발로 금속 제트가 분출되어 적 장갑을 관통합니다. 따라서 직격이 아닌 한 보병에 대한 효과는 매우 낮습니다."
 heat_ammo_5: "초극 첨단 HEAT 탄약"
 heat_ammo_5_desc: "HEAT(고폭 대전차) 탄은 적 장갑을 무력화하기 위해 만들어진 특수 탄종입니다. 포탄이 목표에 명중하면 폭발로 금속 제트가 분출되어 적 장갑을 관통합니다. 따라서 직격이 아닌 한 보병에 대한 효과는 매우 낮습니다."
 cluster_ammo_4: "초고도 첨단 집속탄 탄약"
 cluster_ammo_4_desc: "집속탄은 하나의 큰 탄두 대신 여러 개의 작은 폭탄을 싣고 있습니다. 포탄이 목표에 접근하면 작은 폭탄들이 방출됩니다. 이렇게 하면 하나의 큰 폭발 대신 여러 개의 작은 폭발이 해당 지역에 흩뿌려집니다."
 cluster_ammo_5: "초극 첨단 집속탄 탄약"
 cluster_ammo_5_desc: "집속탄은 하나의 큰 탄두 대신 여러 개의 작은 폭탄을 싣고 있습니다. 포탄이 목표에 접근하면 작은 폭탄들이 방출됩니다. 이렇게 하면 하나의 큰 폭발 대신 여러 개의 작은 폭발이 해당 지역에 흩뿌려집니다."
 laser_guided_ammo_4: "초고도 첨단 레이저 유도 탄약"
 laser_guided_ammo_4_desc: "레이저 유도 포탄은 소형 제어 추력기를 이용해 비행 도중 경로를 바꿀 수 있습니다. 이를 통해 포탄이 목표를 더 정확하게 명중시킬 수 있습니다."
 laser_guided_ammo_5: "초극 첨단 레이저 유도 탄약"
 laser_guided_ammo_5_desc: "레이저 유도 포탄은 소형 제어 추력기를 이용해 비행 도중 경로를 바꿀 수 있습니다. 이를 통해 포탄이 목표를 더 정확하게 명중시킬 수 있습니다."
 burst_fire_gun_medium_gen4: "초고도 첨단 연발 사격 모드"
 burst_fire_gun_medium_gen4_desc: "첨단 표적 지정 컴퓨터와 자동 장전기를 갖추면 포병은 동일한 표적에 여러 발을 빠르게 연속 발사하여 제압 효과를 극대화할 수 있습니다."
 burst_fire_gun_medium_gen5: "초극 첨단 연발 사격 모드"
 burst_fire_gun_medium_gen5_desc: "첨단 표적 지정 컴퓨터와 자동 장전기를 갖추면 포병은 동일한 표적에 여러 발을 빠르게 연속 발사하여 제압 효과를 극대화할 수 있습니다."
 multiple_rounds_medium_gen4: "초고도 첨단 동시 다중 착탄 모드"
 multiple_rounds_medium_gen4_desc: "서로 다른 장약과 서로 다른 사격 궤도로 여러 발의 포탄을 연속 발사하면 발사된 모든 포탄이 동시에 목표에 착탄하게 만들 수 있습니다. 이를 위해서는 고도로 숙련된 승무원과 첨단 표적 지정 컴퓨터가 필요합니다."
 tank_composite_armor_gen5: "초고도 복합 장갑"
 tank_composite_armor_gen5_desc: "3D-printing, laser sintering and nanoscale alumina powder with carbon nanotubes provides state-of-the-art armour protection for our tanks.\n\n§GDesigner Hint: Composite armour is the standard option for modern main battle tanks§!"
 tank_composite_armor_gen6: "초첨단 복합 장갑"
 tank_composite_armor_gen6_desc: "3D-printing, laser sintering and nanoscale alumina powder with carbon nanotubes provides state-of-the-art armour protection for our tanks.\n\n§GDesigner Hint: Composite armour is the standard option for modern main battle tanks§!"
 tank_battlestation_6: "초고도 배틀스테이션"
 tank_battlestation_6_desc: "다목적 카메라 세트와 고급 전투 관측 시스템이 탑재되어 있습니다.\n\n§G설계 힌트: 배틀스테이션은 전차 운용에 필요한 사격 통제, 화기 제어, 광학 장비 및 기타 보조 장비를 나타냅니다. 더 우수한 배틀스테이션을 장착할수록 전차의 전반적인 품질이 향상됩니다.§!"
 tank_battlestation_7: "초첨단 배틀스테이션"
 tank_battlestation_7_desc: "다목적 카메라 세트와 고급 전투 관측 시스템이 탑재되어 있습니다.\n\n§G설계 힌트: 배틀스테이션은 전차 운용에 필요한 사격 통제, 화기 제어, 광학 장비 및 기타 보조 장비를 나타냅니다. 더 우수한 배틀스테이션을 장착할수록 전차의 전반적인 품질이 향상됩니다.§!"
 reactive_armor_gen5: "5세대 폭발반응장갑 (ERA)"
 reactive_armor_gen5_desc: "초고도 형태의 ERA로, 다양한 환경 조건에서 운용 가능하며 적의 화력 대부분을 효과적으로 무력화합니다.\n\n§G설계 힌트: 폭발반응장갑(ERA)은 전차의 장갑을 쉽게 업그레이드할 수 있는 방법입니다.§!"
 reactive_armor_gen6: "6세대 폭발반응장갑 (ERA)"
 reactive_armor_gen6_desc: "폭발반응장갑의 가장 발전된 형태로, 다양한 환경 조건에서 운용 가능하며 적의 화력 대부분을 효과적으로 무력화합니다.\n\n§G설계 힌트: 폭발반응장갑(ERA)은 전차의 장갑을 쉽게 업그레이드할 수 있는 방법입니다.§!"
 nera_armor_gen4: "4세대 중량 NERA"
 nera_armor_gen4_desc: "티타늄 또는 열화우라늄 판재를 추가하고 독특한 형상을 적용하면 차량의 전반적인 장갑 방호력을 높일 수 있습니다.\n\n§G설계 힌트: 중량 NERA는 더 단순한 복합 장갑보다 저항력이 높지만 비용도 더 비쌉니다.§!"
 nera_armor_gen5: "5세대 중량 NERA"
 nera_armor_gen5_desc: "티타늄 또는 열화우라늄 판재를 추가하고 독특한 형상을 적용하면 차량의 전반적인 장갑 방호력을 높일 수 있습니다.\n\n§G설계 힌트: 중량 NERA는 더 단순한 복합 장갑보다 저항력이 높지만 비용도 더 비쌉니다.§!"
 hardkill_system_gen3: "첨단 하드킬 체계"
 hardkill_system_gen3_desc: "개량된 하드킬 체계는 빠르게 날아오는 운동 에너지 관통체와 탠덤 성형 작약탄까지도 저지할 수 있습니다. 개량된 체계는 또한 전차를 모든 방향에서 방어해 줍니다.\n\n§G설계 힌트: 하드킬 체계는 적 미사일에 대한 전차의 방어 능력을 강화하는 좋은 방법입니다. 또한 우리 기갑 부대가 적 전선을 더 효과적으로 돌파하게 해 줍니다.§!"
 hardkill_system_gen4: "초고도 첨단 하드킬 체계"
 hardkill_system_gen4_desc: "개량된 하드킬 체계는 빠르게 날아오는 운동 에너지 관통체와 탠덤 성형 작약탄까지도 저지할 수 있습니다. 개량된 체계는 또한 전차를 모든 방향에서 방어해 줍니다.\n\n§G설계 힌트: 하드킬 체계는 적 미사일에 대한 전차의 방어 능력을 강화하는 좋은 방법입니다. 또한 우리 기갑 부대가 적 전선을 더 효과적으로 돌파하게 해 줍니다.§!"
 medium_tank_chassis_5_desc: "고도로 정교한 전차 차체입니다."
 medium_tank_chassis_6: "7세대 전차 차체"
 medium_tank_chassis_6_desc: "고도로 정교한 전차 차체입니다."
 medium_tank_amphibious_chassis_5: "6세대 APC 차체"
 medium_tank_amphibious_chassis_5_desc: "IFV의 저가형으로, 인간이 아니고서는 살아남을 수 없는 상황에서도 여전히 유용하게 쓰일 수 있습니다."
 medium_tank_amphibious_chassis_6: "7세대 APC 차체"
 medium_tank_amphibious_chassis_6_desc: "IFV의 저가형으로, 인간이 아니고서는 살아남을 수 없는 상황에서도 여전히 유용하게 쓰일 수 있습니다."
 medium_tank_flame_chassis_5: "6세대 IFV 차체"
 medium_tank_flame_chassis_5_desc: "첨단의 복잡한 IFV 설계입니다. 그야말로 전쟁의 야수입니다."
 medium_tank_flame_chassis_6: "7세대 IFV 차체"
 medium_tank_flame_chassis_6_desc: "첨단의 복잡한 IFV 설계입니다. 그야말로 전쟁의 야수입니다."
 medium_tank_artillery_chassis_5: "6세대 자주포 차체"
 medium_tank_artillery_chassis_5_desc: "자주포란 차량에 설치된 포병을 가리키며, 차량 차체를 이용해 자체 동력을 얻으므로 다른 차량의 견인이 필요 없습니다. 대부분 경장갑으로 보호됩니다. 포병은 일반적으로 곡사포, 박격포, 캐논포, 대전차포, 로켓 발사기 또는 대공포입니다."
 medium_tank_artillery_chassis_6: "7세대 자주포 차체"
 medium_tank_artillery_chassis_6_desc: "자주포란 차량에 설치된 포병을 가리키며, 차량 차체를 이용해 자체 동력을 얻으므로 다른 차량의 견인이 필요 없습니다. 대부분 경장갑으로 보호됩니다. 포병은 일반적으로 곡사포, 박격포, 캐논포, 대전차포, 로켓 발사기 또는 대공포입니다."
 medium_tank_destroyer_chassis_5: "6세대 경전차 차체"
 medium_tank_destroyer_chassis_5_desc: "경전차의 역할은 정찰과 공수 작전이지만, 장갑이 얇고 오늘날의 각종 대전차 무기 앞에서 생존성이 낮다는 단점이 있습니다. 보병전차의 등장과 맞물려 경전차의 발전은 쇠퇴하였습니다."
 medium_tank_destroyer_chassis_6: "7세대 경전차 차체"
 medium_tank_destroyer_chassis_6_desc: "경전차의 역할은 정찰과 공수 작전이지만, 장갑이 얇고 오늘날의 각종 대전차 무기 앞에서 생존성이 낮다는 단점이 있습니다. 보병전차의 등장과 맞물려 경전차의 발전은 쇠퇴하였습니다."
 medium_tank_aa_chassis_5: "6세대 자주 대공포 차체"
 medium_tank_aa_chassis_5_desc: "자주 대공 무기는 이동식 대공 무기라고도 하며, 대공 기관총, 대공포 또는 지대공 미사일을 군용 차량에 탑재한 기동형 대공 무기를 가리킵니다. 자주 대공포(자주식 대공포), 자주 대공 미사일 발사기, 자주 복합 미사일·포 대공 체계로 나눌 수 있습니다."
 medium_tank_aa_chassis_6: "7세대 자주 대공포 차체"
 medium_tank_aa_chassis_6_desc: "자주 대공 무기는 이동식 대공 무기라고도 하며, 대공 기관총, 대공포 또는 지대공 미사일을 군용 차량에 탑재한 기동형 대공 무기를 가리킵니다. 자주 대공포(자주식 대공포), 자주 대공 미사일 발사기, 자주 복합 미사일·포 대공 체계로 나눌 수 있습니다."
 medium_tank_rocket_chassis_5: "6세대 다연장 로켓 차체"
 medium_tank_rocket_chassis_5_desc: "다수의 로켓 묶음으로 구성된 다연장로켓발사시스템은 로켓 포격으로 한 지역을 제압하도록 설계되었습니다."
 medium_tank_rocket_chassis_6: "7세대 다연장 로켓 차체"
 medium_tank_rocket_chassis_6_desc: "다수의 로켓 묶음으로 구성된 다연장로켓발사시스템은 로켓 포격으로 한 지역을 제압하도록 설계되었습니다."
 afv_assault_gun_5: "초첨단 돌격포"
 afv_assault_gun_5_desc: "프로그래밍 가능한 신관과 자율 표적 추적 기능을 갖춘 유도탄은 빠르게 움직이거나 은폐된 표적을 상대로도 모든 탄을 헛되지 않게 합니다."
 afv_assault_gun_6: "극초첨단 돌격포"
 afv_assault_gun_6_desc: "지향성 에너지 보조와 극초음속 추진제 기술로 포구 속도와 관통력이 재래식 탄도학의 한계를 넘어섭니다. 주력 전차의 장갑이 아니고서는 안전한 것이 없습니다."
 small_autocannon_5: "초첨단 기관포"
 small_autocannon_5_desc: "최첨단 수준의 기관포로, 아무것도 남기지 않습니다."
 small_autocannon_6: "극초첨단 기관포"
 small_autocannon_6_desc: "최첨단 수준의 기관포로, 아무것도 남기지 않습니다."
 big_autocannon_5: "초첨단 중형 기관포"
 big_autocannon_5_desc: "어떤 장갑이든 파괴하도록 설계된 첨단 대구경 기관포입니다."
 big_autocannon_6: "극초첨단 중형 기관포"
 big_autocannon_6_desc: "어떤 장갑이든 파괴하도록 설계된 첨단 대구경 기관포입니다."
 afv_composite_armor_gen5: "초고도 경형 복합 장갑"
 afv_composite_armor_gen5_desc: "나노 층을 이룬 반응성 복합재가 충격 시 구조를 변화시켜 정적 장갑판보다 운동 에너지를 훨씬 효과적으로 분산시킵니다. 중량 대비 초기 세대 전차 장갑과 필적하는 방어력을 제공합니다."
 afv_composite_armor_gen6: "초첨단 경형 복합 장갑"
 afv_composite_armor_gen6_desc: "자기장 경화 스마트 복합재와 자가 치유 매트릭스 층을 갖춘 이 장갑은 기갑 전투 차량(AFV) 방어 기술의 정점입니다. 이 장갑은 차체 전반에 걸쳐 응력을 동적으로 재분배하여 이전 설계들을 무력화시킬 타격조차도 가볍게 받아냅니다."
 afv_coax_autocannon_5: "초첨단 동축 기관포"
 afv_coax_autocannon_5_desc: "동축 형식으로 사용되는 미래형 기관포입니다."
 afv_coax_autocannon_6: "극초첨단 동축 기관포"
 afv_coax_autocannon_6_desc: "동축 형식으로 사용되는 미래형 기관포입니다."
 spaa_naval_cannon_6: "초첨단 함포"
 spaa_naval_cannon_6_desc: "최첨단 소재와 최적화된 탄약 설계를 활용하여, 이 함포는 연약 표적 파괴 능력을 더욱 높은 효율로 보장합니다."
 spaa_naval_cannon_7: "극초첨단 함포"
 spaa_naval_cannon_7_desc: "최첨단 소재와 최적화된 탄약 설계를 활용하여, 이 함포는 연약 표적 파괴 능력을 더욱 높은 효율로 보장합니다."
 spaa_light_autocannon6: "초첨단 지원 기관포"
 spaa_light_autocannon6_desc: "최신 제조 기술을 활용한 이 기관포는 속도와 효율의 정점을 제공하며, 신속 대응 체계의 새로운 기준을 세웁니다."
 spaa_light_autocannon7: "1세대 극초첨단 지원 기관포"
 spaa_light_autocannon7_desc: "최신 제조 기술을 활용한 이 기관포는 속도와 효율의 정점을 제공하며, 신속 대응 체계의 새로운 기준을 세웁니다."
 spaa_light_autocannon8: "2세대 극초첨단 지원 기관포"
 spaa_light_autocannon8_desc: "최신 제조 기술을 활용한 이 기관포는 속도와 효율의 정점을 제공하며, 신속 대응 체계의 새로운 기준을 세웁니다."
 spaa_light_autocannon9: "3세대 극초첨단 지원 기관포"
 spaa_light_autocannon9_desc: "최신 제조 기술을 활용한 이 기관포는 속도와 효율의 정점을 제공하며, 신속 대응 체계의 새로운 기준을 세웁니다."
 spaa_autocannon_6: "초첨단 기관포"
 spaa_autocannon_6_desc: "기관포 설계의 정점을 대표하는 이 개량형은 최신 재료 과학과 탄약 기술을 활용하여 최적의 성능을 보장합니다."
 spaa_autocannon_7: "1세대 극초첨단 기관포"
 spaa_autocannon_7_desc: "기관포 설계의 정점을 대표하는 이 개량형은 최신 재료 과학과 탄약 기술을 활용하여 최적의 성능을 보장합니다."
