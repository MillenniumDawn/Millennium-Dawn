 EH_event.311.t: "Портал полностью стабилизировался"
 EH_event.311.d: "Спутниковые тепловые снимки подтверждают опасения аналитиков: портал над Африканским Рогом перестал колебаться и зафиксировался в стабильном, постоянном состоянии. Разведывательные дроны сообщают о скоплении роя с другой стороны, численность которого невозможно сосчитать."
 EH_event.311.a: "Вторжение началось всерьёз"
 EH_research_sites_enabled: "Доступны исследовательские площадки"
 EH_europe_defense_line_category: "Европейская линия обороны"
 EH_europe_defense_line_category_desc: "Европейские линии обороны — наш лучший шанс удержать оборону против сил Химеры в Европе. Линии будут укреплёны тяжёлой артиллерией и средствами ПВО, а также сетью окопов и бункеров. Там будут размещены армии большинства европейских стран. Мы должны убедиться, что линии обороны выдержат, когда Россия падёт."
 EH_construct_europe_defense_line: "Построить §GЕвропейскую§! линию обороны"
 EH_europe_defense_line_destruction: "Европейская линия обороны рушится"
 EH_event.810.t: "Строится Европейская линия обороны"
 EH_event.810.d: "Ввиду важности восточной границы Европы в настоящее время ведётся строительство новой линии обороны, отделяющей континент от Азии. Это крупнейшая на данный момент инвестиция в защиту этого критически важного региона от вторжения Химеры. Её уже называют «первым и последним рубежом Европы»."
 EH_event.810.a: "Интересно"
 EH_event.811.t: "Европейская линия прорвана"
 EH_event.811.d: "Сегодня утром силы Химеры прорвали огромную Европейскую оборонительную стену. Обладая подавляющей мощью, Химера сумела преодолеть укреплёния и теперь движется в сторону европейских стран. Если Европейская Федерация не подготовит эффективный план по их остановке, Европа будет потеряна."
 EH_event.811.a: "Что дальше?"
