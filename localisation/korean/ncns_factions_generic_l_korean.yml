 joint_military_exercises_goal_desc: "현대 전쟁에서는 아군 간의 상호운용성이 필수적입니다. 합동 훈련을 실시하고 장비 완비된 사단 100개에 달하는 통합 전력을 확보함으로써, 우리 진영은 어떠한 위협에도 대응할 준비가 되어 있음을 입증하고 있습니다."
 economic_integration_goal_desc: "강력한 경제는 지속적인 동맹의 토대입니다. 모든 회원국이 최소 15개의 민간 공장을 유지하도록 함으로써, 우리는 공동의 번영과 상호 원조에 필요한 산업 기반을 구축합니다."
 technology_sharing_goal_desc: "기술적 우위는 전투력을 배가시키는 요소입니다. 공동 연구 프로그램과 디지털 인프라 투자를 통해 우리 진영은 경쟁자들을 앞지르고 모든 분야에서 최첨단 위치를 유지할 수 있습니다."
 regional_stability_goal_desc: "동맹의 강도는 가장 취약한 연결의 강도에 달려 있습니다. 모든 회원국에서 안정성을 50% 이상 유지함으로써, 우리는 기회주의적인 침략과 내부 전복을 억제하는 단결된 전선을 형성합니다."
 counter_terrorism_goal_desc: "테러리즘에는 국경이 없습니다. 모든 회원국에 정보기관을 설립하면 위협이 현실화되기 전에 차단할 수 있는 네트워크가 만들어져, 우리 시민과 공동의 이익을 모두 보호합니다."
 semiconductor_supremacy_goal_desc: "마이크로칩 제조는 21세기의 전략 산업입니다. 우리 세력 전체에 걸쳐 총 50개의 마이크로칩 공장을 건설함으로써, 우리는 향후 수십 년간 공급망 독립과 기술적 우위를 확보합니다."
 strategic_resource_security_goal_desc: "핵심 원자재에 대한 접근은 경제 성장과 군사 대비 태세 모두의 기반입니다. 우리 세력은 어떤 회원국도 자원 강압에 취약하지 않도록 충분한 석유, 고무, 알루미늄을 공동으로 채굴해야 합니다."
 collective_cyber_defense_goal_desc: "디지털 시대에 암호 보안은 물리적 방어 시설만큼 중요합니다. 모든 회원국이 첨단 암호화 역량을 갖추도록 함으로써, 우리는 통신, 정보, 핵심 기반시설을 보호합니다."
 economic_powerhouse_goal_desc: "경제력은 곧바로 지정학적 영향력으로 이어집니다. 우리 세력 지도국이 높은 1인당 GDP를 달성하고 모든 회원국이 기준선을 넘어서면, 우리는 무시할 수 없는 경제 블록이 됩니다."
 faction_gdp_per_capita_target_tt: "세력 지도국의 1인당 GDP 15 초과 및 모든 회원국 5 초과"
 faction_economic_integration_idea: "경제 통합 협약"
 faction_economic_integration_idea_desc: "조율된 무역 정책과 장벽 완화를 통해 회원국들은 향상된 경제 협력과 더 빠른 발전을 누립니다."