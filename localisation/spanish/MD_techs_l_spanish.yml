 module_anti_ship_drone_torpedoes_1: "Torpedos dron antibuque I"
 module_anti_ship_drone_torpedoes_1_desc: "Los torpedos dron antibuque combinan una guía autónoma con puntería en red para mejorar la probabilidad de impacto contra buques de superficie enemigos.\n\n§GConsejo de diseño: Los torpedos dron proporcionan ataque de torpedos y guerra antisubmarina al tiempo que mejoran la probabilidad de impacto de los torpedos y reducen drásticamente las necesidades de mano de obra. Son ideales para diseños de ataque precisos y con tripulación reducida, pero requieren cantidades crecientes de microchips.§!"
