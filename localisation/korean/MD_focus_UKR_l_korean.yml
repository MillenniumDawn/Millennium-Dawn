 ukr_modernize_sov_equipment_t62_procurement_program_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_t62_procurement_for_tooltip\n\n\n\n\n\n\n\n\n§W보관 중인 §YT-62§! 차체가 §Y하르키우 장갑차 공장§!을 거쳐 우리가 개발한 개량 패키지를 달고 돌아옵니다. 계획이 종료될 때까지 하르키우의 §R군수 공장 한 곳§!이 일반 생산에서 빠집니다. §Y공장§!에서는 한 번에 조달 계획 하나만 진행할 수 있습니다.§!"
