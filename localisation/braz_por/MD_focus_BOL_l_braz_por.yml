 pro_mestizo_army_gov_tt:0 "§YUm governo interino liderado pelo [conservatism_L] assumirá o poder e convocará novas eleições gerais em 30 dias§!"
 BOL_ethnic_divide_decisions:0 "Divisão Étnica Boliviana"
 BOL_ethnic_divide_decisions_desc:0 "\n\n\n\n\n\n£BOL_desctext_ethnic_divide\n\n\n\n\n\n\n\n\nA Bolívia sofre com profundas divisões étnicas e raciais entre os mestiços, pessoas de ascendência mista europeia e indígena que formam a maioria no leste da Bolívia, coletivamente conhecido como Media Luna, e os Povos Indígenas da Bolívia, que formam a maioria no oeste do país. Nos últimos anos as tensões se acirraram, com muitos protestos indígenas por questões como falta de direitos e acesso à água. É importante manter a opinião desses grupos em níveis estáveis, caso contrário podemos ter dois tipos diferentes de instabilidade vindos de ambos os lados. Por isso devemos agir com cuidado, pois uma decisão errada pode levar à fratura da Bolívia como a conhecemos.\n\n§RSe a Opinião Indígena cair abaixo de 15, os grupos indígenas exigirão a renúncia do nosso governo por meio de protestos em massa e, se não cedermos às suas exigências, os Povos Indígenas do oeste da Bolívia se revoltarão contra o governo.§!\n\n§YSe a Opinião Mestiça cair abaixo de 15, o [Nat_Autocracy_L], historicamente influente e pró-mestiço, exigirá a renúncia do nosso governo e a instalação de um governo interino pró-mestiço até que sejam realizadas eleições antecipadas, mas, se não cedermos, os Militares darão um golpe e instalarão um regime militar no poder.§!\n\nOpinião Mestiça: [?BOL_mestizo_support]\n\nOpinião Indígena: [?BOL_indigenous_support]"
