 RULE_INFLUENCE_COOLDOWN: "Investment Influence Gain Cooldown"
 RULE_14_DAY_INFLUENCE: "14 Tage Cooldown"
 RULE_14_DAY_INFLUENCE_DESC: "The default option. The cooldown for influence gained from investing is 14 days or 2 weeks. This applies to the nation for all possible investment opportunities. Though you can still invest, you will not gain any influence in this timeframe."
 RULE_0_DAY_INFLUENCE: "Kein Cooldown"
 RULE_0_DAY_INFLUENCE_DESC: "Old school MD influence gained from the investment time limit. You can invest as often as you like whilst still gaining influence, not recommended for those who enjoy balance!"
 RULE_30_DAY_INFLUENCE: "30 Tage Cooldown"
 RULE_30_DAY_INFLUENCE_DESC: "The suggested multiplayer option. The cooldown for influence gained from investing is 30 days or roughly 1 month. This applies to the nation for all possible investment opportunities. Though you can still invest, you will not gain any influence in this timeframe."
 RULE_MONTHLY_DOMESTIC_INFLUENCE_TICK: "Enable Monthly §YDomestic Independence§! Growth Tick"
 RULE_MONTHLY_DOMESTIC_INFLUENCE_TICK_NO_DESC: "Disables the Monthly §YDomestic Independence§! Growth Tick."
 RULE_MONTHLY_DOMESTIC_INFLUENCE_TICK_YES_DESC: "Enables the Monthly §YDomestic Independence§! Growth Tick. Every month §YDomestic Independence§! will grow by the value set in the game rule \"Monthly §YDomestic Independence§! Growth Tick\" which is set to default to 0.10% per month."
 RULE_MONTHLY_DOMESTIC_INFLUENCE_GAIN_AMOUNT: "Monthly §YDomestic Independence§! Growth Tick Amount"
 RULE_MONTHLY_DOMESTIC_INFLUENCE_GAIN_AMOUNT_05: "0.05%"
 RULE_MONTHLY_DOMESTIC_INFLUENCE_GAIN_AMOUNT_05_DESC: "Each month §YDomestic Independence§! increases by 0.05% as long as the Monthly §YDomestic Independence§! Growth Tick is enabled."
 RULE_MONTHLY_DOMESTIC_INFLUENCE_GAIN_AMOUNT_10: "0.10%"
