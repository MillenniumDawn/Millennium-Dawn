 SCA_form_category: "Vereinige das Nordische Volk"
 SCA_form_category_desc: "Die nordischen Völker haben sich schon viele Nationen geteilt: Das Schwedische Reich, die Kalmarer Union und andere. Diese Gruppe von Völkern mit einer so lebendigen und reichen Geschichte, einzigartigen Kulturen und Sprachen zu vereinen, wird eine Herausforderung für jeden sein, der es wagt, dieses Kunststück zu vollbringen."
