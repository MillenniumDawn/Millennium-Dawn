 iraq_md.200.t: "イラクにおけるアメリカのプレゼンス"
 iraq_md.200.d: "我が国におけるアメリカの任務は何年も続いており、国民の観点からは、彼らの滞在は終わりを迎えるべきである。一部のアメリカ代表団は、テロリズムと過激主義と戦うために彼らのプレゼンスが必要であると主張しているが、我々は異なって見ている。政府がこの問題について選択をする時が来た。"
 iraq_md.200.a: "彼らに要請を送れ"
 iraq_md.200.b: "まだその時ではない"
 iraq_md.201.t: "イラク政府、我が軍の撤退を要請"
 iraq_md.201.d: "The Iraqi government has requested that we withdraw our forces from their nation, citing that our mission has been long due for a closure. Their diplomats have assured us that the state is able to completely operate on its own, not being in need of our assistance to maintain the Iraqi state."
 iraq_md.201.a: "兵士たちを故郷に帰そう"
 iraq_md.201.b: "いや、彼らはまだ準備ができていない"
 iraq_md.202.t: "United States Withdraws Its Forces"
 iraq_md.202.d: "The United States has decided to agree with our request, and have begun withdrawing their troops. The withdrawal will be gradual, but they have already signed into effect the transfer of all government posts currently manned by American experts."
 iraq_md.202.a: "ついに！"
 iraq_md.203.t: "アメリカ合衆国、撤退を拒否"
 iraq_md.203.d: "アメリカ政府は、我々の政府が政府に対する安定した支配を維持する準備ができていないと述べ、我々の要請を拒否した。"
 iraq_md.203.a: "残念だ"
 iraq_md.74.b: "いや！サダムは我々の永遠の指導者だ！"
 iraq_md.744.t: "サダム・フセイン死去！"
 iraq_md.744.d: "Today 6:00 AM the president was reported dead in his bed, surrounded by close family members. His life was one with many ups and downs, surviving several wars with the United States and other nations. However, with his death, comes a new beginning. Saddam had appointed one of his sons to lead the nation, though it has been widely unknown until recently."
 iraq_md.744.a: "安らかに眠れ……"
 iraq_md.300.t: "サダム、イランでの進捗状況の更新を要求？"
 iraq_md.300.d: "サダム・フセインが統合参謀本部の執務室に乱入し、イランとの戦争の進捗状況を問い詰めた。警備員が前に進み出て「大統領閣下、その戦争は何十年も前に終わっております！イランとの戦争など存在しません。」と告げた。サダムは即座にその警備員をその場で射殺した。"
 iraq_md.300.a: "Uh.. Yeah it's going great"
 iraq_md.301.t: "サダム、病院を拷問室と誤認"
 iraq_md.301.d: "During a routine hospital visit, Saddam mistook the hospital as a torture chamber and began fighting with the nurses who were preparing him for his check. He demanded that he be freed immediately, but his personal assistant re-assured him that they were not in a torture chamber. The assistant was fired yesterday, and for some reason his records such as birth certificate, and otherwise, no longer appear on our systems."
 iraq_md.301.a: "くそっ"
 iraq_md.302.t: "サダム、英国領事館を襲撃"
 iraq_md.302.d: "Whilst he was on a walk, Saddam Hussein had convinced a small group of soldiers he saw on the road to help him storm the British Consulate in Baghdad. Upon attempting to breach the compound, British guards detained the soldiers aiding Saddam and demanded for someone to come get Saddam. As Saddam was being dragged away, he started frantically kicking and screaming \"Today the colonizers have been colonized! Glory to the Iraqi nation! Glory to the Iraqi people!\". The British consulate have issued a statement, declaring they will be leaving for the time being."
 iraq_md.302.a: "おっと"
 iraq_md.303.t: "サダム、懐中電灯を爆弾と誤認"
 iraq_md.303.d: "何らかの理由で、昨夜サダムの宮殿の家政婦の一人が、彼が寝ている間にサダムのナイトスタンドの上に懐中電灯を置いた。今朝、サダムの部屋から聞こえる叫び声が彼らを大いに心配させたため、数人の警備員が必死にサダムの部屋に駆け込んだ。彼らは、部屋の反対側の角に立って懐中電灯を指さし、「アメリカ人とシオニストが私の部屋に爆弾を忍び込ませた！」と叫ぶ、怯えたサダムを目の当たりにした。警備員は速やかに懐中電灯を取り除き、サダムは再び眠りに就いた。その家政婦はもはや宮殿で働いていない。"
 iraq_md.303.a: "一体何だ？"
 iraq_md.304.t: "サダム、店員を外国外交官と誤認し、賄賂を試みる"
 iraq_md.304.d: "For several days, Saddam had been complaining about the lack of Chocolate in the palace. Because of this, his assistants could not put up with his complaining for much longer, and eventually just took him to the store as he insisted he wanted to personally pick out the brand of chocolate himself. As the guards and assistants were distracted by the crowd forming outside, one of them noticed that Saddam was trying to whisper into the ear of the clerk, and overheard him saying \"Listen, if you ensure that our ships flow through Hormuz without problem, and you go back on your deal with the Omanis and Iranians, then I will give you a very favorable price for any future oil deals\". The Guards then swiftly bought the chocolate, and escorted Saddam back to the palace."
 iraq_md.304.a: "一体何だ？"
 iraq_md.305.t: "サダム、犯していない罪について感情的な告白を書く"
 iraq_md.305.d: "In a moment of considerable guilt and confusion, Saddam began writing a very emotional and apologetic address to the nation about crimes that he did not commit. He went on to describe how he felt sorry for tainting a local town's water supply with apple-cider vinegar. A nosey maid came across this letter, and reported it to one of Saddam's close assistants, who immediately went on to have a talk with Saddam about how he did not commit such a crime. Saddam insisted that he did, and that he could no longer stand the guilt. The assistant then reluctantly brought a nutritionist to inform Saddam about the health benefits of apple-cider vinegar, and how instead he helped the locals rather than harm. Saddam then secretly wrote and published a patriotic letter pleading with everyone to drink apple-cider vinegar so that Iraq may have \"The Earth's Finest Soldiers\"."
 iraq_md.305.a: "なんてこった"
 iraq_md.306.t: "サダム、介護者に対する革命を計画"
 iraq_md.306.d: "Upon being denied exit from the palace, Saddam thought that he was under house arrest as he believed that his party had failed the coup they launched in 1963. He then began trying to sway the guards to his side, explaining to them in detail about his plot to overthrow his care-givers, and break free from the palace. The guards then realized something was wrong, and took him under their protection momentarily until he fell asleep."
 iraq_md.306.a: "なぜ？"
 iraq_md.307.t: "サダム、残り物で外交晩餐会を準備"
 iraq_md.307.d: "宮殿の厨房や、実のところ誰にも知らせずに、サダムは宮殿の食卓に皿を並べ始め、地域の問題を議論するための外交晩餐会を開くために地域の外交官数名を呼び寄せた。これにより、到着時に宮殿に駐留する警備員によってゲストが尋問されることになり、サダムが単に他の人に計画を知らせていれば完全に避けられたであろう騒動を引き起こした。ゲストは最終的に中に入れられたが、そもそもゲストを招待したことを忘れていたサダムは、ゲストのために食べ物を準備していなかったため、彼らは台所から必死にかき集めた冷たい残り物を提供された。"
 iraq_md.307.a: "何と恥ずかしい"
 iraq_md.308.t: "サダム、以前テレビ放送された演説を何時間も練習"
 iraq_md.308.d: "For hours, Saddam's care-givers had not seen him leave his room, as they believed he was rehearsing a quick speech that he had planned for later that day. Out of concern, they began trying to listen to what he was saying and one of them recognized the speech as his previous one about the American invasion. An assistant was later told to enter the room to inform Saddam that he had already given the speech years ago, and he did so with fear and reluctance. Saddam then furiously threw the papers against the wall and told the assistant to get out. Later that day the sounds of a crying Saddam could be heard throughout the palace."
 iraq_md.308.a: "くそっ……"
 iraq_md.309.t: "サダム、冷蔵庫を金庫と誤認"
 iraq_md.309.d: "今朝、サダムは金庫室内の安全な金庫に保管していたお金を必死に探して宮殿をひっくり返した。これを覚えていなかったサダムは、冷蔵庫を自分の金庫と誤認し、誰かが彼のお金を盗んでどこか別の場所に隠したと信じた。サダムはその後、金庫の場所について知らされ、彼はいくつかの贅沢品に使うためにお金を取り出すよう要求した。"
 iraq_md.309.a: "くそっ"
 iraq_md.310.t: "サダム、火事を起こす！"
 iraq_md.310.d: "今日早く、サダムがルトバ郊外の地元の村を訪れていたとき、サダムは葉巻に火をつけたが、それを消すことも、吸うことさえも忘れていた。この同じ葉巻が家の一つに接触し、火がつき、そこから火は最終的に村のほとんどに広がった。サダムは事件の原因について知らされたが、彼は何年も喫煙していないと継続的に主張している。"
 iraq_md.310.a: "被害は？"
 iraq_md.311.t: "サダム、間違った飛行機に乗る！"
 iraq_md.311.d: "Saddam had been adamant about meeting the President of France, [FRA.GetLeader]. The meeting was agreed upon, and the flight was prepared. During the flight, Saddam insisted that he knew the way to France as he in his own words, \"had been to France many times\". As a result, the pilot had to agree to Saddam's verbal directions and ended up in the middle of French Guiana instead. The meeting was then promptly cancelled."
 iraq_md.311.a: "彼を返してくれないか？"
 iraq_md.312.t: "サダム、重要な安全保障サミットを欠席"
 iraq_md.312.d: "Saddam had arranged plans for a national security summit, where his top generals and officers were asked to attend. Yesterday was when the summit was meant to take place, and upon the arrival of all the officials, they were greeted with silence as they all patiently waited for Saddam Hussein to address the room. To their surprise, Saddam Hussein never showed up. Instead it was revealed that Saddam was busy on a fishing trip with Qusay and Uday at the Euphrates river."
 iraq_md.312.a: "彼にとっては良いことだ"
 iraq_md.313.t: "サダム、祭りのパレードを軍事行進と誤認"
 iraq_md.313.d: "This morning, Saddam was being driven to an official's office for a meeting that they had arranged. On his way there, he saw a street being blocked off for a planned parade being held there, which he mistook for a military parade. He then told his driver to pull over, and Saddam rushed to the podium on the side of the street, kicking the announcer off the stage. He then began saluting in anticipation for the soldiers, but instead he was caught saluting cartoon characters as he swiftly realized that he was at a children's parade."
 iraq_md.313.a: "くそっ"
 iraq_md.314.t: "サダム、500の新しいバンカー建設を命令！"
 iraq_md.314.d: "アメリカ合衆国からの差し迫った核攻撃を恐れて、サダムはイラク全土に建設される500の新しいバンカーの建設を命じた。これは、彼がイラクがまだアメリカ合衆国と戦争状態にあると信じていたためであり、したがって彼はパニックに陥った。命令はキャンセルされたが、建設会社は依然として損失を被ったため、公正に補償されなければならない。"
 iraq_md.314.a: "くそっ"
 iraq_md.315.t: "サダム、反乱軍と戦うためにクルディスタン地域に数百の地雷設置を命令！"
 iraq_md.315.d: "軍事顧問に相談することなく、サダムは地元の反乱グループと戦うためにクルディスタン国境に数百の地雷を設置するよう命じた。この命令は、最近の攻撃の増加のために深刻なものだと信じていた受け取った者たちによって速やかに実行された。しかし今、サダムのトップ顧問たちは、地雷が我々自身の軍隊に深刻な損害をもたらす可能性があると警告している。"
 iraq_md.315.a: "おっと"
 iraq_md.316.t: "サダム・フセイン、地雷により死亡"
 iraq_md.316.d: "数ヶ月前、サダム・フセインは地元の反乱グループからの攻撃を防ぐために、クルド人国境近くに数百の地雷を設置することを決定した。クルド人に嫌われていると感じていたサダムは、地域を一人で訪れ、善意の表れとして地元民と会うことを余儀なくされたと感じた。サダムはその後、宮殿から車を取り、クルディスタン国境へ何時間も運転し始めた。車には国境に着くのに十分な燃料しかなかったため、車がガス欠に近づくと、サダムは徒歩で移動し始めた。地雷のことを忘れ、道のどこかで、サダムは地雷を踏み、その場で死亡した。"
 iraq_md.316.a: "安らかに眠れ、我らが愛する指導者"
 IRQ_temp_medical_cost: "病院費用"
 IRQ_saddam_ages_TT: "§Hサッダーム・フセイン§!は年を取り、§Rアルツハイマー病に苦しむだろう！§!"
 IRQ_saddam_is_saddened_TT: "§Hサッダームは悲しむ§!"
 IRQ_alzheimers_TT: "Due to §RSaddam's Alzheimer's§!, we may get events about §HSaddam's§! erratic behavior!"
 IRQ_saddams_pissfits: "£SOV_paranoia_text_icon [IRQ.GetLeader]の怒り"
 IRQ_saddams_pissfits_desc: "生涯を通じて、§H[IRQ.GetLeader]§!は彼の£SOV_paranoia_text_icon §R怒り§!を制御することができなかった。しばしば彼の怒りを彼の£personnel_cost_multiplier_modifier_texticon 軍人や、[IRQ.GetFlag]§Hイラク§!に住む人々に向けた。彼の£SOV_paranoia_text_icon §R怒り§!は人々に恐怖を植え付け、彼らが失敗する可能性を低くするかもしれないが、代償を伴う。\n\n£SOV_paranoia_text_icon §R怒り§!は特定の§Hイベント、ディシジョン、NF§!を通じて増加する！もし£stability_texticon §H安定度§!が§H40%§!より低い場合、£SOV_paranoia_text_icon §R怒り§!は毎月§H1§!上昇する可能性がある。もし£SOV_paranoia_text_icon §R怒り§!が§H25%§!より高い場合、結果を伴うランダムイベントがトリガーされる。もし£SOV_paranoia_text_icon §R怒り§!が§H50%§!に達した場合、§H[IRQ.GetLeader]§!はランダムな£personnel_cost_multiplier_modifier_texticon 将軍を処刑する。もし£stability_texticon §H安定度§!が§H40%§!以上であれば、£SOV_paranoia_text_icon §R怒り§!は徐々に低下するだろう。\n\n£SOV_paranoia_text_icon §R怒り§!: [?IRQ_saddam_pissboy|%]"
 IRQ_receive_influence_5_TT: "我々は[IRQ.GetFlag]§HIraq§!に対して§H5%の影響力§!を受け取るだろう！"
 IRQ_receive_influence_2_TT: "我々は[IRQ.GetFlag]§HIraq§!に対して§H2%の影響力§!を受け取るだろう！"
 IRQ_they_receive_2_influence_TT: "彼らは我々に対して§H2%の影響力§!を受け取るだろう"
 IRQ_they_receive_5_influence_TT: "彼らは我々に対して§H5%の影響力§!を受け取るだろう"
 IRQ_fedayeen_patrols: "フェダーイーン・パトロール"
 IRQ_fedayeen_patrols_desc: "The Fedayeen Saddam must be utilized in order to enforce our nation's laws. They will ensure that the people are following holy norms, and remain righteous."
 IRQ_western_engineers_in_iraq: "イラクの西側技術者"
 IRQ_western_aid_to_iraq: "イラクへの西側援助"
 IRQ_assassinate_abdullah_s_jumah: "アブドゥッラー・S・ジュムアの暗殺"
 IRQ_assassinate_abdullah_s_jumah_desc: "[SAU.GetFlag]アラムコCEO、アブドゥッラー・S・ジュムアは去らねばならない。我々は彼を始末するために秘密工作員を送り込み、うまくいけばすべてうまく行くだろう。"
 iraqi_flavor_events.10.t: "南部イラクをシーア派蜂起が覆う"
 iraqi_flavor_events.10.d: "A large-scale revolt has swept across Saddam Hussein's Ba'athist Iraq, marking the third such uprising in recent years. Shia Muslims have taken up arms against the Ba'athist state following allegations that a well-known cleric was murdered on the streets of Basra. \n\nSpeculation increases over Iranian involvement in the revolt, with rumours indicating Tehran may have been behind the assassination, sparking this latest wave of unrest. Iraqi forces are responding swiftly, deploying overwhelming force to crush the rebellion. The world now watches in anticipation of Iran's response and what it might bring."
 iraqi_flavor_events.10.a: "戦争の代償"
 iraqi_flavor_events.11.t: "黒旗がイラクに翻る"
 iraqi_flavor_events.11.t1: "Emergence of an Islamic State in Iraq"
 iraqi_flavor_events.11.d: "[ISI.GetLeader] today declared the formation of Al-Qaeda's official branch in Iraq, pledging the allegiance of Jama'at al-Tawhid wal-Jihad (Congregation of Monotheism and Jihad) to Osama bin Laden's global terror network of Al-Qaeda. Vowing to wage unyielding jihad against [PER.GetAdjective]-backed groups and Ba'athist Iraq, the organization, composed of foreign fighters and [IRQ.GetAdjective] insurgents, seeks to establish a caliphate, followed by a wave of jihad that would extend to Iraq's secular neighbours, before ending in a clash with Israel. The group has already launched several attacks against the IRGC, Shia militias, and the central Iraqi government. This comes as mass bombings rock the city of Baghdad as well as major cities across Iraq."
 iraqi_flavor_events.11.d1: "[ISI.GetLeader] has declared the establishment of the Islamic State of Iraq. Announcing the unification of various jihadist factions under its banner including Al-Qaeda in Iraq. The organization has vowed to dismantle [IRQ.GetLeader]'s Ba'athist Iraq and wage relentless jihad against [PER.GetAdjective]-backed militias and Iranian IRGC Force. With the ultimate goal of establishing an Islamic caliphate across the middle east. The group has intensified its campaign of bombings, assassinations, and raids across Baghdad and other major Iraqi cities as Iraq plunges into chaos."
 iraqi_flavor_events.11.a: "イラクは失われたのか？"
 iraqi_flavor_events.12.t: "イランが支援するイラクでのクーデター"
 iraqi_flavor_events.12.d: "Just moments ago, a coalition of Shia militia leaders backed by [PER.GetNameWithFlag] launched a coup against the Ba'athist government. Declaring the suspension of the Iraqi constitution and the establishment of Shi'ite rule. [IRQ.GetNameWithFlag]'s new leader, [IRQ.GetLeader], announced that his forces had just stormed the residence of Saddam Hussein and taken hold of his body in a targeted operation. In a fiery declaration, he proclaimed: \"We shall not rest until we root out Ba'athism from this land, which is rightfully for all!\". This comes as chaos erupts from Baghdad as Shi'ite militias have begun high-profile killings of Ba'athist officials. Meanwhile, [PER.GetNameWithFlag]'s Supreme Leader, [PER.GetLeader], has voiced his full support for the new government under [IRQ.GetLeader]"
 iraqi_flavor_events.12.a: "専制の終焉か、それとも次のページに過ぎないのか？"
 iraqi_flavor_events.13.t: "バース党忠誠派が武装蜂起"
 iraqi_flavor_events.13.d: "バース党忠誠派の残党が[IRQ.GetNameWithFlag]北西部で全面的な反乱を起こし、バース党支配の復活と現シーア派主導政府の拒否を目指して複数の主要都市を占拠している。　[IRQ.GetLeader]は蜂起を鎮圧すると誓ったが、既に不安定な政府全体に暴力と騒乱が広がる中、結果は不透明なままである。　一方、[IRS.GetLeader]は首都バグダッドを奪還するための攻勢を準備している。"
 iraqi_flavor_events.13.a1: "戦争の代償"
 iraqi_flavor_events.13.a2: "奴らを踏み潰せ"
 IRQ_leave_socialist_union: "[PER.GetFlag] イランとの社会主義連合から離脱"
 iraq_md.317.t: "ガーナー、ブレマーに交代"
 iraq_md.317.d: "Under the directive of the U.S. government, Jay Garner has been replaced with Paul Bremer. Allegations arose on what Garner's plans with Iraq were, as it was believed that he was giving too much control to the Iraqis themselves rather than going through the American forces. This move concludes Garner's short venture in Iraq, and the start of a new one."
 iraq_md.317.a: "了解"
 iraq_md.318.t: ""
 iraq_md.318.d: ""
 iraq_md.318.a: ""
 iraqi_MNF.2.t: "バグダッド陥落"
 iraqi_MNF.2.d: "栄誉ある都市バグダッドは占領軍の手に落ち、政府の建物、像、ポスターが今まさに破壊されている。複数の高官が捕らえられたり、殺害されたり、行方不明になったりしている。我々は最高司令官たちから、戦いは無駄であり、敵に対する武装闘争を続ければ、さらに多くの命を犠牲にする危険があると告げられている。しかし、我々にどんな選択肢があるというのか？彼らは我々の土地に来て、我々の民を攻撃し、我々の主権を侵害したのだ。"
 iraqi_MNF.2.a: "我々には選択肢がない"
 iraqi_MNF.2.b: "我々の辞書に降伏の文字はない！"
 iraqi_MNF.3.t: "アメリカがイラクで作戦を開始"
 iraqi_MNF.3.d: "アメリカはイラクに対して戦争状態に入り、我々はアメリカ人に対し、いかなる敵と戦うためにも彼らと共に立つと約束した。今日、我々はその約束を実行し、イラク駐留多国籍軍に部隊を送ることができる。"
 iraqi_MNF.3.a: "前進"
 iraqi_MNF.3.b: "我々は考えを変えた…"
 iraqi_MNF.4.t: "イラク統治政府が我々の撤退を要請"
 iraqi_MNF.4.d: "イラクの統治当局は、占領区域を含むあらゆる領域から米軍を撤退させるよう正式に要請した。書簡の文面は友好的な印象を与えたものの、微妙な脅迫を含んでいないわけではなかった。「イラクの主権領域からの撤退を拒否した場合、予期せぬ結果を招く可能性がある。」と記された書簡には[IRQ.GetLeader]の署名があった。"
 iraqi_MNF.4.a: "我々は去る"
 iraqi_MNF.4.b: "我々は去る…一つの条件付きで"
 iraqi_MNF.4.c: "ならば我々をこの地に埋めるがいい！"
 iraqi_MNF.5.t: "[FROM.GetName]が無条件で撤退"
 iraqi_MNF.5.d: "[FROM.GetAdjective]政府は我々の要請に従うことを決定し、占領地を直ちに明け渡した。"
 iraqi_MNF.5.a: "良い"
 iraqi_MNF.6.t: "[FROM.GetName]が石油利権付きで撤退"
 iraqi_MNF.6.d: "[FROM.GetAdjective]政府は我々の要請に従うことを決定し、占領地を直ちに明け渡した。しかし、彼らは撤退条件の一部として石油利権を要求している。"
 iraqi_MNF.6.a: "わかった、それでいい"
 iraqi_MNF.7.t: "[FROM.GetName]が退去を拒否"
 iraqi_MNF.7.d: "Those [FROM.GetAdjective] vermin have refused to let go of their occupation zones, and are further entrenching themselves in our territory. If they don't understand the language of diplomacy, then they'll understand the language of our force."
 iraqi_MNF.7.a: "残念だ…"
 iraqi_MNF.8.t: "イラク石油利権契約が失効"
 iraqi_MNF.8.d: "イラクの石油に関する我々の契約は本日失効し、その結果、我々はかつて占領していた地域の石油を管理することはなくなった。"
 iraqi_MNF.8.a: "合意通りだ"
 iraqi_MNF.9.t: "[FROM.GetName]の石油契約が失効"
 iraqi_MNF.9.d: "[FROM.GetName] will no longer control the flow of oil in the regions they once occupied, with exports and oil handling being returned to Iraqi national control once more."
 iraqi_MNF.9.a: "良い"
 iraqi_MNF.10.t: "サッダーム・フセイン捕らる！"
 iraqi_MNF.10.d: "After weeks of being on the run, Saddam Hussein was finally captured by our forces in a discreet hiding location. He has been transferred to Abu Ghraib correctional facility where he is currently being evaluated. His fate will soon be decided by the appropriate Iraqi authorities."
 iraqi_MNF.10.a: "諸君、我々は奴を捕らえた"
 iraqi_MNF.11.t: "クサイ・フセイン捕らる！"
 iraqi_MNF.11.d: "After weeks of being on the run, Qusay Hussein was finally captured by our forces in a discreet hiding location. He has been transferred to Abu Ghraib correctional facility where he is currently being evaluated. His fate will soon be decided by the appropriate Iraqi authorities."
 iraqi_MNF.11.a: "良い"
 iraqi_MNF.12.t: "ウダイ・フセイン捕らる！"
 iraqi_MNF.12.d: "After weeks of being on the run, Uday Hussein was finally captured by our forces in a discreet hiding location. He has been transferred to Abu Ghraib correctional facility where he is currently being evaluated. His fate will soon be decided by the appropriate Iraqi authorities."
 iraqi_MNF.12.a: "良い。あの狂人を街から排除しろ！"
 iraqi_MNF.13.t: "アビド・ハーミド・マフムード捕らる！"
 iraqi_MNF.13.d: "After weeks of being on the run, Abid Hamid Mahmud was finally captured by our forces in a discreet hiding location. He has been transferred to Abu Ghraib correctional facility where he is currently being evaluated. His fate will soon be decided by the appropriate Iraqi authorities."
 iraqi_MNF.13.a: "良い"
 iraqi_MNF.14.t: "「ケミカル・アリー」捕らる！"
 iraqi_MNF.14.d: "After weeks of being on the run, Ali Hassan al-Majid, AKA 'Chemical Ali' was finally captured by our forces in a discreet hiding location. He has been transferred to Abu Ghraib correctional facility where he is currently being evaluated. His fate will soon be decided by the appropriate Iraqi authorities."
 iraqi_MNF.14.a: "良い"
 iraqi_MNF.15.t: "Izzat Ibrahim Al-Douri Captured!"
 iraqi_MNF.15.d: "After weeks of being on the run, Izzat Ibrahim Al-Douri was finally captured by our forces in a discreet hiding location. He has been transferred to Abu Ghraib correctional facility where he is currently being evaluated. His fate will soon be decided by the appropriate Iraqi authorities."
 iraqi_MNF.15.a: "良い"
 iraqi_MNF.16.t: "ハーニー・アブドゥッラティーフ・ティルファー捕らる！"
 iraqi_MNF.16.d: "After weeks of being on the run, Hani Abd al-Latif Tilfah was finally captured by our forces in a discreet hiding location. He has been transferred to Abu Ghraib correctional facility where he is currently being evaluated. His fate will soon be decided by the appropriate Iraqi authorities."
 iraqi_MNF.16.a: "良い"
 iraqi_MNF.17.t: "アズィーズ・サーレハ捕らる！"
 iraqi_MNF.17.d: "After weeks of being on the run, Aziz Salih was finally captured by our forces in a discreet hiding location. He has been transferred to Abu Ghraib correctional facility where he is currently being evaluated. His fate will soon be decided by the appropriate Iraqi authorities."
 iraqi_MNF.17.a: "良い"
 iraqi_MNF.170.t: "イラクの最重要指名手配犯"
 iraqi_MNF.170.d: "Fifty-two of the former government's officials have been printed onto a deck of playing cards and issued to every unit in the country, with the aces and the face cards reserved for the men who actually ran the state. Some are still inside Iraq, moving between safe houses and relatives on a schedule nobody outside the family knows. Others crossed into neighbouring capitals that will go on denying they are there for exactly as long as it is convenient. The intelligence assessment is that the ones left at large are already organising, and that every month the deck stays unturned is another month of planning we are handing them."
 iraqi_MNF.170.a: "迅速な正義の手が彼らを捕らえるだろう"
 iraqi_MNF.200.t: "クウェート海軍基地への大規模なバアス党の反撃！"
 iraqi_MNF.200.d: "バアス党軍は我々のクウェート海軍基地に大規模な攻撃を仕掛け、基地のインフラを大々的に破壊した。この攻撃は我々の部隊を屈辱させ、士気を低下させ、動揺させ、この地域における我々の評判はひどく傷つけられた。本土では、我が党は報道機関と国民から激しい攻撃を受けている。イラク内外に隠れているバアス党員を捕らえることができなかったことが、この事態の主な原因であると報告されている。彼らは過去数年間、ほとんど遅滞なくこの攻撃を計画することができたのだ。"
 iraqi_MNF.200.a: "信じられない"
 IRQ_request_british_withdrawal: "イギリスの撤退を要請"
 IRQ_request_british_withdrawal_desc: "イギリスは荷物をまとめて南部から出ていく必要がある。ここは我々の土地であり、彼らは許可なく居座っている。"
 IRQ_request_polish_withdrawal: "ポーランドの撤退を要請"
 IRQ_request_polish_withdrawal_desc: "ポーランドは荷物をまとめて中部地域から出ていく必要がある。ここは我々の土地であり、彼らは許可なく居座っている。"
 IRQ_5_years_TT: "彼らは§H5§!年間、§H石油利権§!を得るだろう！"
 IRQ_MNF_VOLUNTEER_TT: "- 我々は戦争遂行を支援するために、[IRQ.GetFlag]§Hイラク§!の§H多国籍軍§!に義勇軍を送ることができる"
 IRQ_increase_pol_inf_15_TT: "§Hスンニ派の政治的影響力§!を§H15§!増加させる\n(現在の影響力: §H[?IRQ_sunni_political_influence]§!)"
 iraq_md.319.t: "高度な抑止力に関する聖なる調査"
 iraq_md.319.d: "In the holy city of Najaf, Grand Ayatollah Ali al-Sistani has reportedly spent several days in private reflection. Yesterday, the Grand Ayatollah reportedly asked a single question of whether the state possessed 'a man of sufficient learning to bring theory into form'. His aides, uncertain whether this referred to theology or physics, forwarded the question through the usual clerical channels. This confusion was cleared up rather quickly as through a rare written statement, Grand Ayatollah Sistani declared that the nation must develop 'special means of strategic persuasion'. Due to extensive Ba'ath purges in previous years, Sistani's aides were unable to locate any 'trustworthy' scientists capable of developing these 'special means of strategic persuasion'. Instead, they were able to locate a recent college graduate who had #OpenToNetwork on his LinkedIn page, and an offer has been extended to bring him to Iraq and provide him with a laboratory to conduct his research."
 iraq_md.319.a: "インシャアッラー、イラクは安全になるだろう"
 IRQ_renovation_of_baiji_refinery: "Renovation of Baiji Refinery"
 IRQ_renovation_of_baiji_refinery_desc: "The Baiji refinery was the center of much conflict and many different battles, and due to this, it has become quite run down. It's up to our budget to repair and rebuild the refinery."
 iraq_war.24.t: "The Afghan Question"
 iraq_war.24.d: "Our failure in Iraq has shaken public confidence in our overseas commitments. With the military stretched thin and war fatigue mounting at home, there are growing calls to end our mission in Afghanistan as well. The costs of maintaining our presence there are becoming increasingly difficult to justify to a war-weary public."
 iraq_war.24.a: "Withdraw from Afghanistan"
 iraq_war.24.b: "We will stay the course"
 IRQ_commie_paper: "Publish Al-Qaidah"
 IRQ_invite_hezbollah: "Invite [HEZ.GetFlag] [HEZ.GetName]"
 IRQ_receive_iranian_planes_TT: "We receive §G7§! §YMiG-29 Fulcrums§! from Iran."
 IRQ_resistance_jewel_aid_TT: "Each accepting ally builds infrastructure or a fossil fuel power plant in Iraq."
 IRQ_saudi_trade_refusal_TT: "Saudi Arabia refuses to expand trade relations, blocking §YRevive Basra Port§!."
 IRQ_demand_kuwait_naval_base: "Demand the [KUW.GetFlag] Kuwait Naval Base"
 IRQ_demand_kuwait_naval_base_desc: "The [KUW.GetFlag] Kuwaitis have let the Americans plant a naval base right on our doorstep. §H[IRQ.GetLeader]§! demands that [KUW.GetFlag] Kuwait hand over control of the base to us, or face the consequences."
 IRQ_propose_kurdistan_defensive_pact: "Propose a Defensive Pact with [KUR.GetFlag] Kurdistan"
 IRQ_propose_kurdistan_defensive_pact_desc: "§H[IRQ.GetLeader]§! wishes to secure our northern flank by offering [KUR.GetFlag] Kurdistan a mutual defensive pact, renouncing our claims over their territory in exchange for their guarantee of our own."
 IRQ_expel_economic_union_members_decision: "Expel Union Members"
 IRQ_expel_economic_union_members_decision_desc: "Several members of our §HUnion of Islamic Prosperity§! have grown lax in their commitments. We will expel every current member from the union, dissolving its trade and industrial benefits until new partners are brought in."
 IRQ_members_in_union_TT: "There is §Hat least one member§! currently in the §HUnion of Islamic Prosperity§! to expel."
 IRQ_demanded_kuwait_naval_base: "Already Demanded the Kuwait Naval Base"
 IRQ_proposed_kurdistan_pact: "Already Proposed the Kurdistan Defensive Pact"
 iraqi_MNF.26.t: "The Compound Was Empty"
 iraqi_MNF.26.d: "The assault element cleared the compound room by room and found bedding still warm, a satellite phone with the battery taken out, and nobody in the building. Someone was paid for a warning and earned it. By the time the site is exploited the network will have moved him somewhere else in the country, and the search starts again from whatever the documents left behind are worth."
 iraqi_MNF.26.a: "Find out who talked"
 IRQ_qusay_hussein_idea: "Qusay Hussein"
 IRQ_qusay_hussein_idea_desc: "With Qusay designated as Saddam's successor, we draw on his leadership of the Special Republican Guard to strengthen our armed forces and secure the regime."
