 CRM_artillery_4: "D-50"
 CRM_util_vehicle_1: "ZIL-131"
 CRM_util_vehicle_1_desc: "전 세계 많은 군대가 사용하는 군수 트럭이자 병력 수송차입니다."
 CRM_util_vehicle_2: "Ural-4320"
 CRM_util_vehicle_2_desc: "전 세계 많은 군대가 사용하는 군수 트럭이자 병력 수송차입니다."
 CRM_util_vehicle_3: "KamAZ-4310"
 CRM_util_vehicle_3_desc: "전 세계 많은 군대가 사용하는 군수 트럭이자 병력 수송차입니다."
 CRM_util_vehicle_4: "KamAZ-4350"
 CRM_util_vehicle_4_desc: "볼크와 마찬가지로 병력 8명을 수송할 수 있으며 상부에 중기관총도 탑재할 수 있습니다. 호송대의 선도 차량으로 쓰입니다."
 CRM_util_vehicle_5: "GAZ 티그르"
 CRM_util_vehicle_5_desc: "이 장갑 병력 수송차는 다양한 무기로 무장할 수 있으며 최대 11명을 수송할 수 있습니다."
 CRM_util_vehicle_6: "VPK-3927 볼크"
 CRM_util_vehicle_6_desc: "VPK는 2+8명을 수송할 수 있습니다. STANAG 4569 3등급 장갑을 갖추었습니다. 특수부대와 경찰 병력에 적합합니다."
 CRM_util_vehicle_7: "Z-STS 아흐마트"
 CRM_util_vehicle_7_desc: "Z-STS 아흐마트는 3축 전륜구동 차체인 카마즈-5350을 기반으로 제작되었습니다. 기동성과 주행 능력이 뛰어나며 운용이 복잡하지도 않습니다. 흥미롭게도 이 장갑차는 일반 트럭과 달리 보닛형 구조로 제작되었습니다. 덕분에 승무원 좌석을 뒤쪽으로 옮겨 안전성을 높일 수 있었습니다."
 TAT_Anti_Air_0: "9K32 스트렐라-2"
 TAT_Anti_Air_0_desc: "냉전 초기에 비례 항법 방식을 이용해 미국의 핵폭격기를 포착하고 파괴하도록 설계되었습니다. 3,700~4,200m의 표적을 타격할 수 있는 가장 기본적인 대공 무기 중 하나입니다."
 TAT_Anti_Air_1: "9K38 이글라"
 TAT_Anti_Air_1_desc: "이글라는 스트렐라의 더 현대적인 후속 모델로, 2004년 러시아가 배치했습니다. 스트렐라보다 훨씬 뛰어난 이중 파장대 적외선(S형) 유도 장치를 사용합니다."
 TAT_Anti_Air_2: "9K38 이글라-S"
 TAT_Anti_Air_2_desc: "더 긴 사거리, 더 민감한 시커, 최신 대응책에 대한 향상된 저항 및 더 무거운 탄두를 갖춘 실질적으로 개선된 변종인 최신 변종입니다. 제조업체 보고에 따르면 적중 확률은 0.8–0.9입니다."
 TAT_Anti_Air_3: "9K42"
 TAT_Anti_Air_4: "9K48"
 TAT_APC_1: "BTR-60"
 TAT_APC_1_desc: "One of the oldest vehicles still in service, the BTR-60 has a 14.5mm KPVT heavy machine gun with 500 rounds. The secondary weapon is a 7.62mm PKT coaxial machine gun with 2,000 rounds. Great for light infantry movements, and QRFs."
 TAT_APC_1_short: "BTR-60"
 TAT_APC_2: "MT-LB"
 TAT_APC_2_desc: "MT-LB는 1970년대에 만들어졌습니다. 저렴하고 빠르게 제작된 소련은 가벼운 대공 및 보병 전투에 사용했습니다."
 TAT_APC_2_short: "MT-LB"
 TAT_APC_3: "BTR-70"
 TAT_APC_3_desc: "BTR-70은 1972년 소련-아프가니스탄 전쟁에서 군대를 이동시켜 화력을 지원하는데 사용되었습니다. BTR-60과의 유일한 차이점은 장갑이 더 무겁다는 점입니다."
 TAT_APC_3_short: "BTR-70"
 TAT_APC_4: "BTR-80"
 TAT_APC_4_desc: "BTR-80은 8륜 수륙양용 병력 수송 장갑차(APC)로 소련에서 개발되었습니다. 1986년 배치되기 시작하여 이전의 차량인 BTR-60, BTR70들을 대체하기 시작했습니다. 아프가니스탄전에서 처음 그 실력을 발휘했습니다."
 TAT_APC_4_short: "BTR-80"
 TAT_APC_5: "BTR-90"
 TAT_APC_5_desc: "테러리스트와 싸우기 위해 1994년에 생산되었습니다. 강력한 무기인 30mm 시퍼노브 2A42 포를 500발의 포탄과 함께 장착하고 있습니다."
 TAT_APC_5_short: "BTR-90"
 TAT_APC_6: "K-16 Bumerang"
 TAT_APC_6_desc: "A wheeled amphibious armoured personnel carrier on the Bumerang platform, shown in 2015. A remote weapon station with a 12.7mm Kord machine gun keeps the crew under armour, and the rear ramp lets the infantry dismount quickly."
 TAT_APC_6_short: "K-16 Bumerang"
 TAT_APC_7: "쿠르가네츠-35"
 TAT_APC_7_desc: "주로 보병전투차인 25형과 마찬가지로, 장갑차인 35형은 병력 12명을 수송할 수 있으며 보병전투차 작전에서 25형과 거의 같은 역할을 수행합니다."
 TAT_APC_7_short: "쿠르가네츠-35"
 TAT_APC_8: "쿠르가네츠-45"
 TAT_APC_8_desc: "이 초대형 장갑차에 대해서는 알려진 바가 많지 않으나, 40mm 포를 탑재하고 병력 12명을 수송할 수 있습니다."
 TAT_APC_8_short: "쿠르가네츠-45"
 TAT_Heavy_Anti_tank_1: "BRDM-2 9P148 콘쿠르스"
 TAT_Heavy_Anti_tank_1_desc: "Used in many wars and on many vehicles. The effective range is 500-3,000m."
 TAT_Heavy_Anti_tank_2: "MTLB 콘쿠르스"
 TAT_Heavy_Anti_tank_3: "코르넷-E"
 TAT_Heavy_Anti_tank_4: "코르넷-DM"
 TAT_IFV_1: "BMP-1"
 TAT_IFV_1_desc: "BMP-1은 소련제 수륙양용 궤도형 보병 전투 차량입니다. 소련-아프가니스탄 전쟁에서 병력 수송 및 지하디스트와의 전투에 사용되었습니다. 73mm 2A28 주포와 대전차 미사일 발사기를 장착하고 있습니다."
 TAT_IFV_1_short: "BMP-1"
 TAT_IFV_2: "BMP-2"
 TAT_IFV_2_desc: "BMP-2는 지하드 주의자들이 가장 두려워 하던 차량으로 30mm 캐논과 캐터필러를 가져 굉장히 빠르고 효율적입니다."
 TAT_IFV_2_short: "BMP-2"
 TAT_IFV_3: "BMP-2M"
 TAT_IFV_3_short: "BMP-2M"
 TAT_IFV_4: "BMP-3"
 TAT_IFV_4_desc: "BMP-3는 소련의 보병 전투 차량(IFV)로 BMP-1과 BMP-2를 계승하는 차량입니다. 100mm 포로 고폭탄을 발사합니다."
 TAT_IFV_4_short: "BMP-3"
 TAT_IFV_5: "BMP-3M"
 TAT_IFV_5_desc: "BMP-3M은 소련의 보병 전투 차량(IFV)로 BMP-1과 BMP-2를 계승하는 차량인 동시에 BMP-3의 개량형입니다. 포와 엔진을 향상시켰습니다."
 TAT_IFV_5_short: "BMP-3M"
 TAT_IFV_6: "T-15 아르마타"
 TAT_IFV_6_desc: ""
 TAT_IFV_6_short: "T-15"
 TAT_IFV_7: "T-15M"
 TAT_IFV_7_short: "T-15M"
 TAT_IFV_8: "T-16"
 TAT_IFV_8_short: "T-16"
 TAT_Anti_tank_1: "RPG-7"
 TAT_Anti_tank_1_desc: "Used in many wars and on many vehicles."
 TAT_Anti_tank_2: "AT-4 Fagot"
 TAT_Anti_tank_2_desc: "Much lighter than the other ATGM-systems, and older. This ATGM can only hit at 70-2,500 m which compared to others is much lesser range than the others but also cheaper."
 TAT_Anti_tank_3: "9M133M Kornet-M"
 TAT_Anti_tank_4: "9M134M Bulat-M"
 TAT_MBT_1: "T-55"
 TAT_MBT_1_desc: "T-54/55는 아마 세계에서 가장 많이 생산된 전차일 것입니다. 냉전 초기에 설계되어 생산된 이 전차는 붉은 군대의 위력이자 근간이었습니다. 한때 러시아의 위력을 상징하며 두려움의 대상이었으나, 이제는 미국의 공습 속에서 파괴되는 중동 기갑 전력의 상징적인 모습이 되었습니다."
 TAT_MBT_1_short: "T-55"
 TAT_MBT_2: "T-72"
 TAT_MBT_2_desc: "T-72는 아마도 러시아가 생산한 가장 성공적인 디자인일 것입니다. 그것은 냉전 말기 소련군의 정점이었고, 수천 대가 생산되었으며, 오늘날까지도 러시아군의 중추 역할을 하고 있습니다. 비록 중동 분쟁에서 치명적인 실패로 악명이 높았지만, T-72는 미래의 러시아 전차 설계를 위한 개발 플랫폼으로 여전히 사용되고 있으며 오늘날 현대전의 기준에 부합하도록 끊임없는 수정과 업그레이드가 이루어졌습니다. 한때 소련군의 창이었던 전차를 과소평가하지 마십시오."
 TAT_MBT_2_short: "T-72"
 TAT_MBT_3: "T-80"
 TAT_MBT_3_desc: "200만 달러짜리 이 전차이자 전장의 야수는 T-72와 같은 주포에 추가 장갑과 코브라 대전차 유도 미사일을 갖추었습니다."
 TAT_MBT_3_short: "T-80"
 TAT_MBT_4: "T-90"
 TAT_MBT_4_desc: "최대한의 화력과 효율을 위해 3문 포 체계로 무장했습니다. 125mm 포 발사 장치 3문을 갖추고 있습니다."
 TAT_MBT_4_short: "T-90"
 TAT_MBT_5: "T-14 아르마타"
 TAT_MBT_5_desc: "매끈한 외형과 강력한 152mm 포를 갖춘 러시아군에서 가장 진보한 주력전차입니다."
 TAT_MBT_5_short: "T-14"
 TAT_MBT_7: "T-14M"
 TAT_MBT_7_short: "T-14M"
 TAT_MBT_8: "T-99 블랙 이글"
 TAT_MBT_8_short: "T-99"
 TAT_mbt_equipment_0: "T-62"
 TAT_mbt_equipment_1: "T-72"
 TAT_mbt_equipment_2: "T-90"
 TAT_mbt_equipment_3: "T-14"
 TAT_mbt_equipment_4: "T-24"
 TAT_Rec_tank_0: "PT-76"
 TAT_Rec_tank_0_desc: "이 초고속 수륙 양용 경전차는 강 건너편에서 적진으로 몰래 접근하여 지옥의 짐을 내릴 수 있습니다. 76.2mm D-56T 강선 전차포를 사용합니다."
 TAT_Rec_tank_0_short: "PT-76"
 TAT_Rec_tank_1: "2S25 Sprut-SD"
 TAT_Rec_tank_1_desc: "자주식 수륙양용 구축전차인 이 차량은 적 탱크에 몰래 접근하여 t-72-80이 탑재하는 125mm 대포를 발사할 수 있습니다."
 TAT_Rec_tank_1_short: "2S25 Sprut-SD"
 TAT_Rec_tank_2: "BMPT 터미네이터"
 TAT_Rec_tank_2_desc: "아마도 지금까지 만들어진 가장 치명적인 유리 대포 중 하나일 것입니다. 탱크에 대항할 수는 없지만 기둥 전체를 파괴할 수 있습니다. 4개의 130mm 발사대와 2개의 30mm 기관포를 갖추고 있습니다."
 TAT_Rec_tank_2_short: "BMPT 터미네이터"
 TAT_Rec_tank_3: "K-18 부메랑"
 TAT_Rec_tank_3_desc: "부메랑은 처음에는 현대 러시아군을 위한 비용 효율적인 장갑차이자 보병전투차로 공개되었습니다. 그러나 부메랑은 2018년에 세부 사항이 공개된 125mm 포를 장착한 전용 대전차 플랫폼으로도 쓰일 것입니다. 미국의 스트라이커 MGS와 마찬가지로, 부메랑 역시 BMPT처럼 화력 지원 차량 역할을 수행할 것입니다."
 TAT_Rec_tank_4: "경전차 2025"
 TAT_Rec_tank_4_short: "경전차 2025"
 TAT_Rec_tank_5: "경전차 2035"
 TAT_Rec_tank_5_short: "경전차 2035"
 TAT_SP_Anti_Air_0: "ZSU-23-4 실카"
 TAT_SP_Anti_Air_1: "9K35 스트렐라-10"
 TAT_SP_Anti_Air_2: "2K22 퉁구스카"
 TAT_SP_Anti_Air_2_desc: "최대 8발의 미사일을 발사할 수 있는 이 기체는 접근하는 모든 항공기를 격추할 수 있습니다. 뿐만 아니라 자동포로 수송기도 파괴할 수 있습니다."
 TAT_SP_Anti_Air_3: "판치르-S1M"
 TAT_SP_Anti_Air_4: "판치르-S4L"
 TAT_SP_R_arty_0: "BM-21 그라드"
 TAT_SP_R_arty_0_desc: "현대 작전에서는 거의 쓰이지 않지만, SAMS와 MLRS의 조상격인 이 무기는 주로 제2차 세계 대전과 아프가니스탄에서 사용되었습니다. 사거리 20km에서 효과적입니다."
 TAT_SP_R_arty_1: "BM-30 스메르치"
 TAT_SP_R_arty_1_desc: "이 차량은 그라드 전차의 현대화된 버전입니다. 눈, 얼음, 사막 등 세계 어디든 갈 수 있으며, 유효 사거리는 35km입니다."
 TAT_SP_R_arty_2: "9A52-4 토르나도"
 TAT_SP_R_arty_2_desc: "대처하지 않으면 도시 전체를 파괴할 수 있는 극도로 강력한 중포 부대입니다. 최대 사거리는 90km입니다."
 TAT_SP_arty_0: "2S1 Gvozdika"
 TAT_SP_arty_0_desc: "2S1 그보즈디카는 MT-LBu 다목적 차체를 기반으로 122mm 2A18 곡사포를 탑재한 소련의 자주 곡사포입니다. \\"2S1\\"은 GRAU 명칭입니다. 러시아식 대체 명칭은 SAU-122이지만 러시아군에서는 흔히 그보즈디카로 불립니다."
 TAT_SP_arty_1: "2S3 아카치야"
 TAT_SP_arty_1_desc: "필요하다면 태양도 쏠 수 있을 만큼 강력한 152.4mm D-22 대포로 무장한 이 포병대는 사거리가 50km에 달하는 놀라운 화력을 자랑합니다."
 TAT_SP_arty_2: "2S19M2 므스타-S"
 TAT_SP_arty_2_desc: "2S19 므스타-S는 냉전 말기에 개발되었으며, 신기술을 도입하여 전작보다 사거리가 늘어났습니다."
 TAT_SP_arty_3: "2S35 코알리치야-SV"
 TAT_SP_arty_3_desc: "2S35는 광범위한 자동화, 자동 포탄 종류 선택, 통합 지휘통제 체계를 갖춘 진정한 21세기 포병 플랫폼입니다."
 TAT_SP_arty_4: "2S38 코알리치야-M"
 TAT_artillery_1: "D-30"
 TAT_artillery_1_desc: "소련이 많은 전쟁에서 사용한 122mm 견인포 부대입니다. 사거리는 15~25km입니다."
 TAT_artillery_2: "2A65 Msta-B"
 TAT_artillery_3: "D-40"
 TAT_artillery_4: "D-50"
