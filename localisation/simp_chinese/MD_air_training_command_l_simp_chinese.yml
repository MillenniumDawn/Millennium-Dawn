 MD_atc_exercise_training: "Air Operations Readiness Exercise"
 MD_atc_exercise_training_desc: "A wing-wide readiness cycle covering sortie generation, airlift and reconnaissance coordination. Squadrons train to sustain operations from forward airfields."
 MD_atc_ex_training_short: "Training and Operations mastery for 90 days."
 MD_atc_exercise_design: "Flight Test and Evaluation"
 MD_atc_exercise_design_desc: "Test pilots and engineers fly evaluation sorties on new airframes and avionics. Findings feed directly into design and maintenance practice."
 MD_atc_ex_design_short: "Aircraft Design mastery for 90 days."
 MD_atc_exercise_heavy: "Strategic Airlift and Bomber Exercise"
 MD_atc_exercise_heavy_desc: "Long range sorties for heavy bombers and transport aircraft. Crews rehearse aerial refueling, mass formation flying and deep strike routing."
 MD_atc_ex_heavy_short: "Heavy Aircraft mastery for 90 days."
 MD_atc_exercise_multirole: "Multirole Strike Fighter Exercise"
 MD_atc_exercise_multirole_desc: "Fighter wings practice switching between air-to-air and air-to-ground roles within a single sortie. Mixed packages train with shared targeting and escort tactics."
 MD_atc_ex_multirole_short: "Multirole Aircraft mastery for 90 days."
 MD_atc_exercise_strike: "Close Air Support Exercise"
 MD_atc_exercise_strike_desc: "Strike squadrons train with ground forward air controllers on target marking, low level attack runs and fratricide avoidance."
 MD_atc_ex_strike_short: "Strike Aircraft mastery for 90 days."
 MD_atc_exercise_fighter: "Air Combat Exercise"
 MD_atc_exercise_fighter_desc: "Large force air combat drills pit fighter and interceptor squadrons against aggressor units. Pilots practice beyond visual range engagements and dogfighting."
 MD_atc_ex_fighter_short: "Fighter Aircraft mastery for 90 days."
 MD_atc_exercise_drone: "Unmanned Systems Exercise"
 MD_atc_exercise_drone_desc: "Operators train in the launch, control and recovery of unmanned aircraft. Drills cover swarm tactics, datalink resilience and operating under electronic attack."
 MD_atc_ex_drone_short: "Drone Warfare mastery for 90 days."
 MD_atc_staff_college_name: "Air Staff College"
 MD_atc_staff_college_short: "Gain air mission experience and lower experience loss for 90 days."
 MD_atc_staff_college: "Air Staff College in Session"
 MD_atc_staff_college_desc: "Senior air officers are attending the air staff college. Lessons from recent operations improve mission planning and aircrew retention."
 MD_atc_fighter_school_name: "Fighter Weapons School"
 MD_atc_fighter_school_short: "Better ace generation for 180 days."
 MD_atc_fighter_school: "Fighter Weapons School in Session"
 MD_atc_fighter_school_desc: "Selected fighter pilots are attending an advanced weapons and tactics course. Graduates return to their squadrons as instructors and tactical leaders."
 MD_atc_rnd_liaison_name: "Air R&D Liaison"
 MD_atc_rnd_liaison_short: "Gain an air breakthrough point."
 MD_atc_rnd_liaison_cooldown: "Air R&D Liaison Active"
 MD_atc_rnd_liaison_cooldown_desc: "Air force officers are seconded to aerospace research establishments, turning operational lessons into development requirements."
 MD_atc_academy_name: "Flight Training Syllabus"
 MD_atc_academy_short: "Unlocks a Spirit of the Air Force Academy, boosts exercises."
 MD_atc_academy_level_text: "Level [?ROOT.MD_atc_academy_level|0]/3"
 MD_atc_force_name: "Air Force Readiness Program"
 MD_atc_force_short: "Unlocks a Spirit of the Air Force."
 MD_atc_force_level_text: "Level [?ROOT.MD_atc_force_level|0]/3"
 MD_atc_command_name: "Air Operations Center"
 MD_atc_command_short: "Unlocks a Spirit of Air Force Command."
 MD_atc_command_level_text: "Level [?ROOT.MD_atc_command_level|0]/3"
 MD_atc_academy_1: "Air Warfare School I"
 MD_atc_academy_1_desc: "Instruction in air combat tactics, sortie planning and instructor pilot methods prepares the next generation of aircrew."
 MD_atc_academy_2: "Air Warfare School II"
 MD_atc_academy_2_desc: "$MD_atc_academy_1_desc$"
 MD_atc_academy_3: "Air Warfare School III"
