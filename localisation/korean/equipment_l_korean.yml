 SPR_MBT_4_short: "레오파르트 2A6E"
 SPR_MBT_5: "레오파르트 2A7+"
 SPR_MBT_5_desc: "레오파르트 2A7+는 저강도 및 고강도 충돌 상황 모두에서 작동하도록 설계되었습니다. 모듈식 장갑을 개선해 탱크의 보호력을 증가시켰으며, 전방부 보호를 위해 포탑과 선체 전면에 있는 듀얼키트를 개선했습니다. 전체적으로 시가전 전투를 염두하고 개발되었기 때문에 RPG-7 등에 대한 전방위 방어를 위해 측면 전체에 증가장갑을 적용시켰습니다. 이러한 모듈식 장갑은 아프가니스탄에서 캐나다가 처음 사용했습니다. 포탑에 장착해서 사용했던 MG3 기관총좌는 원격제어가 되는 고정형 FLW200으로 대체되었으며 프로그래밍 가능한 HE 탄약도 사용할 수 있게 되었습니다. 이동성, 유지력, 상황인식능력 모두 개선되었습니다."
