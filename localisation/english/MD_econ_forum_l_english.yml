 econ_forum_standing_5: "\n§YAfrican Development Conference§!: prestige [?global.econ_forum_prestige^5|0]. Its last summit drew [?global.econ_forum_last_heads^5|0] heads of government and [?global.econ_forum_last_ministers^5|0] ministerial delegations, and signed [?global.econ_forum_last_ceremonies^5|0] agreements."
