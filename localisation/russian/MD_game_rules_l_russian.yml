 RULE_SPREAD_INFLUENCE_AMOUNT_COOLDOWN: "Перезарядка распространения влияния"
 RULE_SPREAD_INFLUENCE_30_COOLDOWN: "30 дней"
 RULE_SPREAD_INFLUENCE_30_COOLDOWN_DESC: "Время восстановления по умолчанию. Раз в 30 дней вы можете распространить своё влияние на другую страну."
 RULE_SPREAD_INFLUENCE_14_COOLDOWN: "14 дней"
 RULE_SPREAD_INFLUENCE_14_COOLDOWN_DESC: "Раз в 14 дней вы можете распространить своё влияние на другую страну."
 RULE_SPREAD_INFLUENCE_0_COOLDOWN: "Нет перезарядки"
 RULE_SPREAD_INFLUENCE_0_COOLDOWN_DESC: "Нет времени восстановления для распространения влияния, когда вы хотите сбросить всю свою §Hполитическую власть§! на влияние в других странах!"
 RULE_SPREAD_INFLUENCE_60_COOLDOWN: "60 дней"
 RULE_SPREAD_INFLUENCE_60_COOLDOWN_DESC: "Раз в 60 дней вы можете распространить своё влияние на другую страну."
 RULE_INVEST_INFLUENCE_AMOUNT_GAIN: "Увеличение влияния от инвестиций"
 RULE_INVEST_DEFAULT_GAIN_1: "1%"
 RULE_INVEST_DEFAULT_GAIN_1_DESC: "+1% влияния каждый раз, когда кто-то принимает ваши инвестиции."
 RULE_INVEST_DEFAULT_GAIN_0_5: "0.5%"
 RULE_INVEST_DEFAULT_GAIN_0_5_DESC: "0,5% влияния каждый раз, когда кто-то принимает ваши инвестиции."
 RULE_INVEST_DEFAULT_GAIN_2: "2%"
 RULE_INVEST_DEFAULT_GAIN_2_DESC: "2% влияния каждый раз, когда кто-то принимает ваши инвестиции."
 RULE_INFLUENCE_COOLDOWN: "Время перезарядки прироста влияния от инвестиций"
 RULE_14_DAY_INFLUENCE: "14-дневная перезарядка"
 RULE_14_DAY_INFLUENCE_DESC: "Вариант по умолчанию. Время восстановления влияния, полученного от инвестирования, составляет 14 дней или 2 недели. Это относится к стране для всех возможных инвестиционных возможностей. Хотя вы всё еще можете инвестировать, вы не получите никакого влияния в этот период времени."
 RULE_0_DAY_INFLUENCE: "Нет перезарядки"
 RULE_0_DAY_INFLUENCE_DESC: "Старый формат действия влияния MD, полученного из-за ограничения времени инвестиций. Вы можете инвестировать так часто, как хотите, и в то же время получать влияние, что не рекомендуется для тех, кто любит баланс!"
 RULE_30_DAY_INFLUENCE: "30-дневная перезарядка"
 RULE_30_DAY_INFLUENCE_DESC: "Предлагаемый вариант многопользовательской игры. Время восстановления влияния, полученного от инвестирования, составляет 30 дней или примерно 1 месяц. Это относится к стране для всех возможных инвестиционных возможностей. Хотя вы всё ещё можете инвестировать, вы не получите никакого влияния в этот период времени."
 RULE_ENABLE_DIVISION_LIMITER: "Включить ограничитель дивизий для ИИ"
 RULE_NO_ENABLE_DIVISION_LIMITER_DESC: "Ограничитель дивизий для ИИ выключен\n\nПо умолчанию ИИ не будет ограничен в количестве дивизии, которые он может производить. Если вы хотите ограничить количество дивизии из-за производительности, пожалуйста, включите меня!"
 RULE_YES_ENABLE_DIVISION_LIMITER_DESC: "Ограничитель дивизий для ИИ включён\n\nКогда я включен, ИИ с меньшей вероятностью будет производить дивизии, что позволит игроку играть с относительным спокойствием!"
 RULE_OPTION_POTATO_EDITION: "Картофельное издание"
 RULE_POTATO_EDITION_DIVISION_LIMITER_DESC: "Включить картофельное издание для ограничения количества дивизий у ИИ\n\nЕщё больше ограничивает количество дивизий для большей производительности.\n"
 RULE_REMOVE_MICRO_STATES: "Удалить Нации"
 RULE_NO_RULE_REMOVE_MICRO_STATES_DESC: "Не удаляйте ни одну из наций в начале игры."
 RULE_ALLOW_ENABLE_LEDGER: "Включить MD Ledger"
 RULE_ALLOW_ENABLE_LEDGER_YES_DESC: "Журнал MD включен. (Некоторая информация из журнала разведки «Сопротивления» может оказаться избыточной. Отключите эту функцию, если хотите усложнить игру.)"
 RULE_ALLOW_ENABLE_LEDGER_NO_DESC: "Отключает Leadger MD. Это лучше для пользователей, которые предпочитают более аутентичный опыт и хотят использовать La Resistance для получения важной информации."
 RULE_ALLOW_HELP_GUI: "Включить MD Help GUI"
 RULE_ALLOW_HELP_GUI_YES: "Это включает MD Help GUI."
 RULE_ALLOW_HELP_GUI_NO: "Это отключает MD Help GUI."
 RULE_ALLOW_PLAYER_COLORED_PUPPETS: "Включить MD Colored Puppets"
 RULE_OPTION_MD_COLORED_PUPPETS_YES_DESC: "Поскольку это правило игры было включено - любая страна, ставшая марионеткой, автоматически сменит цвет на цвет своего сюзерена. (Например, если Китай сделает Индию своей марионеткой - то Индия станет красной, как Китай)"
 RULE_OPTION_MD_COLORED_PUPPETS_NO_DESC: "Страны не будут менять свой цвет, когда они становятся марионетками, и их цвет остаётся статичным."
 RULE_ALLOW_CHEAT_DECISIONS: "Разрешить чит-решения"
 RULE_YES_ALLOW_CHEAT_DECISIONS_DESC: "Чит-решения включены"
 RULE_NO_ALLOW_CHEAT_DECISIONS_DESC: "Чит-решения отключены"
 RULE_ALLOW_TOGGLING_CHEAT_DECISIONS: "§Y(Мультиплеер)§! Разрешить глобальное переключение чит-решений"
 RULE_YES_ALLOW_TOGGLING_CHEAT_DECISIONS_DESC: "§Y(Опционально)§!\n\nВключено переключение глобальных чит-решений\n§YПРИМЕЧАНИЕ:§! Любая страна в мире может переключать чит-решения, и последствия таковы §Yглобальны§!. Появится событие, сообщающее, какая страна его переключает.\n§YВы должны убедиться, что вам разрешено использовать это решение в многопользовательской игре!§!\n\n§YПРИМЕЧАНИЕ:§! Вам также нужно включить правило игры \"Разрешить чит-решения\", если вы хотите использовать читы!"
 RULE_NO_ALLOW_TOGGLING_CHEAT_DECISIONS_DESC: "§Y(Опционально)§!\n\nОтключено переключение глобальных чит-решений\n§YПРИМЕЧАНИЕ:§! Любая страна в мире может переключать чит-решения, и последствия таковы §Yглобальны§!. Появится событие, сообщающее, какая страна его переключает.\n§YВы должны убедиться, что вам разрешено использовать это решение в многопользовательской игре!§!\n\n§YПРИМЕЧАНИЕ:§! Вам также нужно включить правило игры \"Разрешить чит-решения\", если вы хотите использовать читы!"
 RULE_DISABLE_ANTI_BULLY: "Отключить общественную усталость от войны"
 RULE_YES_ANTI_BULLY_DESC: "Отключает систему общественной усталости от войны, позволяя вам быть любителем войны без штрафов."
 RULE_NO_ANTI_BULLY_DESC: "Система общественной усталости от войны будет включена."
