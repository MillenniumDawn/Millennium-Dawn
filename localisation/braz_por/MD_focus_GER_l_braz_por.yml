 GER_combatting_islamist_popup_TT: "Combat_extremists.exe"
 GER_combatting_islamist_popup_desc_TT: "Aqui podemos ajustar as leis de gastos no combate aos extremistas e tomar algumas ações adicionais, se necessário. Se um departamento se tornar muito instável e entrar em colapso, nossa nação pode caminhar em direção a uma guerra civil. Com base no resultado da guerra civil, partidos e grupos radicais podem tomar o controle da Alemanha."
