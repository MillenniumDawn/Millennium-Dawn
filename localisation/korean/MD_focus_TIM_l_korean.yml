l_korean:
 east_timor.1.t: "2006년 위기"
 east_timor.1.d: "동티모르 군이 지역 노선에 따라 분열되었습니다. 서부 지역 출신 병사 약 600명이 해임되면서 수도 딜리 전역으로 번지는 파벌 간 폭력이 촉발되었습니다. 정부는 치안 상황에 대한 통제력을 잃어 가고 있습니다."
 east_timor.1.a: "국제 평화유지군의 지원을 요청한다"
 east_timor.1.b: "우리 스스로 질서를 회복하겠다"
 east_timor.2.t: "동티모르의 평화유지군 요청"
 east_timor.2.d: "동티모르가 파벌 간 폭력에 빠져 질서 회복을 위한 오스트레일리아의 군사적 지원을 요청하고 있습니다. 이 지역 최대 강국으로서 우리의 대응이 국제적 개입의 방향을 정할 것입니다."
 east_timor.2.a: "국제 안정화군을 파견한다"
 east_timor.2.b: "지금은 개입할 수 없다"
 east_timor.3.t: "동티모르의 도움 요청"
 east_timor.3.d: "우리의 옛 식민지 동티모르가 나라가 혼란에 빠짐에 따라 군사적 지원을 요청하고 있습니다. 포르투갈은 역사적 책무가 있으며 티모르 주민들과 강한 유대를 맺고 있습니다."
 east_timor.3.a: "평화유지 파견대를 보낸다"
 east_timor.3.b: "요청을 거절한다"
 east_timor.4.t: "동티모르의 지원 요청"
 east_timor.4.d: "동티모르가 질서 회복을 위한 뉴질랜드의 도움을 요청했습니다. 이 작은 나라는 만연한 폭력과 붕괴하는 치안 체계로 어려움을 겪고 있습니다."
 east_timor.4.a: "평화유지군을 보낸다"
 east_timor.4.b: "거절한다"
 east_timor.5.t: "동티모르 위기"
 east_timor.5.d: "동티모르가 나라를 안정시키기 위해 말레이시아 평화유지군을 요청했습니다. 같은 동남아시아 국가로서 말레이시아의 참여는 지역적 연대를 보여 줄 것입니다."
 east_timor.5.a: "딜리에 병력을 파견한다"
 east_timor.5.b: "요청을 거절한다"
 east_timor.6.t: "오스트레일리아군 도착"
 east_timor.6.d: "오스트레일리아 평화유지군이 딜리에 도착하여 수도의 질서를 회복하고 있습니다. 국제 안정화군은 평화유지 작전의 근간입니다."
 east_timor.6.a: "감사하게 생각한다"
 east_timor.7.t: "포르투갈군 도착"
 east_timor.7.d: "포르투갈 병력이 옛 식민지에 대한 역사적 책무를 이행하기 위해 동티모르에 배치되었습니다."
 east_timor.7.a: "어서 오십시오, 친구들이여"
 east_timor.8.t: "뉴질랜드 평화유지군 도착"
 east_timor.8.d: "뉴질랜드가 동티모르의 안정화를 돕기 위해 평화유지 파견대를 보냈습니다."
 east_timor.8.a: "그들의 도움에 감사한다"
 east_timor.9.t: "말레이시아군 도착"
 east_timor.9.d: "말레이시아군이 동티모르 평화유지 작전을 돕기 위해 도착했습니다."
 east_timor.9.a: "말레이시아에 감사를 전한다"
 east_timor.10.t: "알프레두 레이나두 추적"
 east_timor.10.d: "반군 지도자 알프레두 레이나두가 당국의 추적을 피해 딜리 남쪽 산악 지대에 숨어 있습니다. 그가 계속 자유의 몸으로 있는 것은 정부의 권위를 훼손하고 다른 반체제 파벌들을 부추깁니다."
 east_timor.10.a: "오스트레일리아에 특수 부대 파견을 요청한다"
 east_timor.10.b: "우리 군으로 그를 추적한다"
 east_timor.11.t: "동티모르의 SAS 지원 요청"
 east_timor.11.d: "동티모르는 평화유지군의 추적을 계속 피하고 있는 도주 중인 반군 지도자 알프레두 레이나두를 붙잡기 위해 오스트레일리아에 공수특수임무연대(SAS) 병력 파견을 요청했습니다."
 east_timor.11.a: "SAS를 투입한다"
 east_timor.11.b: "이는 우리의 권한을 넘어선다"
 east_timor.12.t: "레이나두의 탈출"
 east_timor.12.d: "오스트레일리아 특수 부대의 작전에도 불구하고 알프레두 레이나두는 산악 지대로 탈출했습니다. 작전은 그를 체포하는 데 실패했으나, 보다 폭넓은 국제적 주둔이 딜리의 치안 상황을 안정시켰습니다."
 east_timor.12.a: "결국에는 그를 찾아낼 것이다"
 east_timor_news.1.t: "동티모르의 국제 평화유지군 요청"
 east_timor_news.1.desc: "파벌 간 폭력으로 수도 딜리에서 수백 명이 사망하거나 피난민이 되면서 동티모르가 국제 평화유지 지원을 공식 요청했습니다. 오스트레일리아, 포르투갈, 뉴질랜드, 말레이시아가 국제 안정화군에 병력을 제공해 달라는 요청을 받았습니다."
 east_timor_news.1.a: "우리는 세계의 도움을 기대한다"
 east_timor_news.1.b: "우리가 딜리의 질서를 회복하겠다"
 east_timor_news.1.c: "지역의 안정은 우리의 이익이다"
 east_timor_news.1.d: "위기에 처한 작은 나라"