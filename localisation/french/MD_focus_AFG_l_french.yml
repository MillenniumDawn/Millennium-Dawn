 AFG_ai_Weight_effect_Arms: "Leur volonté d'accepter est §Gforte§! par défaut\n\n [USA.GetName] est moins susceptible de s'allier à nous si\n §R-Nous ne partageons pas la même orientation\n -Ils ont une mauvaise opinion de [AFG.GetName]§!"
 AFG_ai_Weight_effect_Airlift: "Leur volonté d'accepter est §Gforte§! par défaut\n\n Ils sont plus susceptibles d'accepter si\n §G-[USA.GetLeader] a annoncé l'opération Enduring Freedom §!\n\n §R-Nous ne partageons pas la même orientation\n -Ils ont une mauvaise opinion de nous§!"
 AFG_ai_Weight_effect_Iran: "Leur volonté d'accepter est §Gforte§! par défaut\n\n Ils sont moins susceptibles d'accepter si\n §R-Nous ne partageons pas la même orientation\n -Ils ont une mauvaise opinion de nous\n -Nous sommes sunnites§!"
 AFG_ai_Weight_effect_div_usa: "Leur volonté d'accepter est §Rfaible§! par défaut\n\n Ils sont plus susceptibles d'accepter si\n §G-Les drones Predator de la CIA sont approuvés\n -Nous partageons la même orientation\n -Ils ont une haute opinion de [AFG.GetNameDefCap]§!"
 AFG_ai_Weight_effect_CIA_drones: "Leur volonté d'accepter est §Gforte§! par défaut\n\n Ils sont moins susceptibles d'accepter si\n §R-Oussama ben Laden est mort\n -Nous ne partageons pas la même orientation\n -Ils ont une mauvaise opinion de [AFG.GetNameDefCap]§!"
 AFG_ai_Weight_effect_India_aid: "Leur volonté d'accepter est §Gforte§! par défaut\n\n Ils sont moins susceptibles d'accepter si\n§R -Nous ne partageons pas la même orientation\n -Ils ont une mauvaise opinion de [AFG.GetNameDefCap]§!"
 AFG_available_as_leaderTT: "§GDisponible§! comme §Ydirigeant politique§!"
 AFG_available_as_MillleaderTT: "§GAssigné§! comme §Yhaut commandant militaire§!"
 AFG_import_westernism: "Importer l'occidentalisme"
 AFG_import_westernism_desc: "L’Afghanistan a longtemps conservé ses valeurs traditionnelles. Cependant, l’ouverture récente aux nouvelles idées nous a permis d’intégrer de manière sélective des aspects des concepts occidentaux. Cette approche nous permet de puiser dans un large éventail d’idées occidentales, de choisir celles qui correspondent à nos besoins spécifiques et de rejeter celles qui ne correspondent pas à notre contexte."
 AFG_atta_installs_leadership: "Atta Muhammad Nur prend la tête du gouvernement"
 AFG_atta_installs_leadership_desc: "De seigneur de guerre à commandant, Atta Mohammad Nur ne prend pas les choses à la légère"
 AFG_liberal_society: "Société libérale"
 AFG_afghan_morning_taliban_by_night: "A.N.A. le jour, Taliban la nuit"
 AFG_afghan_morning_taliban_by_night_desc: "Une grande partie de nos soldats de l'Armée nationale afghane mènent une double vie. Nombre d'entre eux s'engagent dans les rangs des talibans tout en servant dans l'armée, ce qui confère à ces derniers un avantage considérable sur nos forces. Cette corruption a favorisé une corruption généralisée au sein de nos forces armées et a fortement sapé le moral des hommes qui combattent pour la nation."
 AFG_safed_koh_supply_network: "Réseau d'approvisionnement de Safed Koh"
 AFG_safed_koh_supply_network_desc: "Grâce à un réseau complexe de routes, de montagnes et de grottes souterraines, le réseau d'approvisionnement de Safed Koh a atténué l'impact du terrain accidenté et isolé de la région."
 AFG_tal_insurgency_new: "[TAL.GetFlag] Insurrection des talibans"
 AFG_tal_insurgency_new_desc: "Après plusieurs défaites, les talibans se sont repliés dans les faubourgs est de l'Afghanistan. Ils s'y retranchent, se préparant à une guérilla longue et sanglante. Leur puissance est directement liée à leurs modificateurs défensifs et offensifs. S'ils dépassent 30 % de leur puissance au moment du retrait des États-Unis, ils lanceront une nouvelle invasion à grande échelle.\n\n£AFG_salafist_jihadism §HLa force des talibans - [?AFG.taliban_attack_strength|%]§!"
 TAL_move_into_tribal_areas: "Pousser dans les zones tribales pakistanaises"
 TAL_move_into_tribal_areas_desc: "Pour survivre, nous devrons déplacer nos forces vers l'extérieur afin de ne pas nous concentrer sur une seule zone. Les zones tribales sont un refuge idéal, car nous aurons un accès direct à une chaîne de montagnes."
 AFG_414_attack_1207: "Attaquez les bastions des talibans"
 AFG_414_attack_1207_desc: "Même si nous ne parviendrons pas à éradiquer les talibans, nous pourrons affaiblir leur pouvoir... Si nous réussissons."
 TAL_1207_attack_1154: "Frappe à Kunar"
 TAL_1207_attack_1208: "Pousser vers Qalat"
 AFG_414_attack_1208: "Reprendre Qalat"
 AFG_414_attack_1154: "Reprendre Kunar"
 PAK_objected: "Nous reculons suite aux objections pakistanaises [PAK.GetFlag]"
 AFG_doing_border_raid: "Mène actuellement un raid frontalier"
 TAL_money: "Fonds des talibans"
 AFG_agriculture_mech: "Agriculture"
 AFG_agriculture_mech_desc: "Amandes et grenades sont les seules exportations afghanes que le monde achète sans hésiter. L'argent de l'État mis dans vergers, transport et acheteurs transforme la récolte du paysan en recettes du Trésor."
 AFG_pomegranate_return_tt: "Retours : §G+6 %§! du PIB au §YTrésor§!"
 AFG_almond_return_tt: "Retours : §G+8 %§! du PIB au §YTrésor§!"
 AFG_pomegranate_investment_limit_tt: "Investissements dans la grenade restants : §Y[?AFG_pomegranate_investments]/5§!"
 AFG_almond_investment_limit_tt: "Investissements dans les amandes restants : §Y[?AFG_almond_investments]/5§!"
 TAL_1207_attack_1154_desc: "Envoyer des combattants depuis les chaînes du Safed Koh vers le Kounar pour saigner la garnison afghane avant qu'elle ne s'enterrre."
 TAL_1207_attack_1208_desc: "Pousser depuis le Safed Koh contre Qalat. Tenir l'autoroute ici divise les forces gouvernementales dans le sud-est."
 TAL_1152_attack_415: "Balayer le Sistân"
 TAL_1152_attack_415_desc: "Pousser vers l'ouest hors du Registan vers le Sistan, menaçant le contrôle gouvernemental de la frontière désertique avec l'Iran."
 AFG_415_attack_1152: "Effacer le Régistan"
 AFG_415_attack_1152_desc: "Contre-attaquer depuis le Sistan pour reprendre le désert du Registan et priver les talibans de leur base de départ."
 AFG_412_attack_415: "Libérer le Sistan"
 AFG_412_attack_415_desc: "Avancer depuis le Hazarajat pour chasser les talibans du Sistan et ramener les provinces du sud sous contrôle gouvernemental."
 TAL_construct_the_safed_koh_system: "Construire le réseau d'approvisionnement du Safed Koh"
 TAL_construct_the_safed_koh_system_desc: "Creuser caches, tunnels et pistes muletières à travers le Safed Koh pour ravitailler les combattants hors de portée des patrouilles afghanes."
 TAL_begin_insurgency_in_registan: "Ouvrir le front du Registan"
 TAL_begin_insurgency_in_registan_desc: "Lever des colonnes de milice à travers le désert du Registan et s'emparer de la province, ouvrant un second front au sud."
 TAL_begin_war_again: "Relancer la guerre"
 TAL_begin_war_again_desc: "Les troupes étrangères parties et notre force rétablie, abandonner le cessez-le-feu et marcher sur Kaboul pour en finir."
 AFG_taliban_insurgency_eliminated: "L'insurrection talibane a été éliminée"
 AFG_active_taliban_insurgency: "L'insurrection talibane est active"
 wot_supporting_afghan_counter_insurgency: "Soutien à la contre-insurrection afghane"
 AFG_civil_war_shortcut: "Guerre civile"
 AFG_panjshir_shortcut: "Panjshir"
 AFG_foreign_policy_shortcut: "Politique étrangère"
 AFG_government_shortcut: "Gouvernement"
 AFG_reconstruction_shortcut: "Reconstruction"
 AFG_national_policy_shortcut: "Politique nationale"
 AFG_national_assembly: "Assemblée nationale"
 AFG_anjuman_pass: "Le Lion du Panchir"
 AFG_law_of_faith: "Loi de la foi"
 AFG_law_of_faith_idea: "Loi de la foi"
 AFG_law_of_faith_idea_desc: "La loi religieuse est inscrite au recueil des lois. Le clergé est satisfait et les campagnes répondront à l'appel aux armes, mais l'espace politique hors du consensus s'est refermé."
 AFG_law_of_faith_desc: "La loi de la foi prévaudra dans notre État pour renforcer nos principes islamiques. Notre peuple sera guidé par nos croyances islamiques afin de garder l'État pur et droit."
 AFG_training_of_local_police_officers: "Formation d'officiers de police locaux"
 AFG_training_of_local_police_officers_desc: "En vue de la libération et de la stabilisation éventuelles de l'Afghanistan, l'Alliance du Nord doit établir une police disciplinée et efficace. Cette force sera cruciale pour maintenir l'ordre dans les territoires que nous visons à reprendre."
 AFG_heirs_o_the_mujahideen: "Héritiers des moudjahidines"
 AFG_heirs_o_the_mujahideen_desc: "S'inspirant des combattants légendaires du passé, la direction actuelle cherche à ranimer l'esprit et les tactiques des moudjahidines."
 AFG_the_lions_guard: "La Garde du Lion"
 AFG_the_lions_guard_desc: "Une nouvelle task force a émergé pour prévenir d'éventuels attentats contre Ahmad Shah Massoud face à des menaces imminentes."
 AFG_the_francesc_vendrell_talks: "Les pourparlers Francesc Vendrell"
 AFG_the_francesc_vendrell_talks_desc: "À Douchanbé, au Tadjikistan, l'envoyé spécial de l'ONU Francesc Vendrell tient des pourparlers de paix avec des dirigeants afghans clés : le commandant de l'Alliance du Nord Ahmed Shah Masood, l'ancien gouverneur du Nangarhar Haji Abdul Qadeer, et l'ancien membre du gouvernement Rabbani Syed Hussain Anwari, discutant des maux de Mohammad Asif Mohseni."
 AFG_assault_on_mazar_i_sharif: "Assaut sur Mazar-i-Sharif"
 AFG_assault_on_mazar_i_sharif_desc: "L'importante ville de Mazar-e Charif doit être reprise, et nous pouvons galvaniser nos hommes pour leur donner un élan afin d'y parvenir."
 AFG_massoud_s_mig_and_sukho: "Les MiG et Sukhoï de Massoud"
 AFG_massoud_s_mig_and_sukho_desc: "Le soutien de l'Inde a été clandestin. L'Inde aide Massoud depuis un certain temps avec de l'argent, du matériel radar et des pièces d'avion. Elle a envoyé environ 30 techniciens qui, selon les rapports, entretiennent les chasseurs MiG et Sukhoï de Massoud. Des conseillers militaires indiens ont aussi donné des conseils pour combattre les talibans. Non reconnu, l'aide indienne est devenue un pilier des forces de Massoud."
 AFG_russian_air_lift_idea: "Pont aérien russe"
 AFG_russian_air_lift_idea_desc: "Des armes et pièces de type soviétique arrivent par air depuis la Russie. Nos équipages connaissent déjà le matériel, si bien qu'il atteint le front à bas coût et sans recyclage."
 AFG_russian_air_lift: "Pont aérien russe"
 AFG_russian_air_lift_desc: "La Russie a maintenu une alliance clandestine de longue date avec l'Alliance du Nord, fournissant armes et ravitaillements essentiels pour soutenir les restes de notre gouvernement. Hier encore, le ministre russe de la Défense, Sergueï Ivanov, a annoncé qu'ils équiperaient nos milices de matériel soviétique bien connu, déjà familier aux membres de l'Alliance du Nord."
 AFG_mil_mi_24_gunships: "Hélicoptère d'attaque Mil Mi-24"
 AFG_mil_mi_24_gunships_desc: "La Russie a annoncé son intention de nous fournir 12 hélicoptères d'attaque Mil Mi-24, qui apporteront un précieux soutien à notre avancée contre les talibans."
 AFG_cia_predator_surveillance_drones: "Drones de surveillance des prédateurs de la CIA"
 AFG_cia_predator_surveillance_drones_idea: "Drones de surveillance des prédateurs de la CIA"
 AFG_cia_predator_surveillance_drones_idea_desc: "Des drones américains rôdent au-dessus des cols et nous transmettent ce qu'ils voient. Nous planifions pour la première fois autour d'un renseignement réel, et nos propres réseaux grandissent dans leur sillage."
 AFG_cia_predator_surveillance_drones_desc: "Les drones de surveillance Predator de la CIA ont été déterminants pour couvrir largement le terrain, identifier les points d'intérêt clés et localiser les cibles hostiles."
 AFG_appeal_to_washington_for_support: "Solliciter le soutien de Washington"
 AFG_appeal_to_washington_for_support_desc: "Face au conflit en cours et à la menace des factions extrémistes, l'Afghanistan doit chercher le soutien d'alliés internationaux pour renforcer ses capacités militaires."
 AFG_imu_countermeasures: "Contre-mesures de l'IMU"
 AFG_imu_countermeasures_desc: "Pour contrer cette menace, l'Afghanistan cherche l'aide de l'Ouzbékistan afin de mener des frappes aériennes ciblées contre les bastions de l'IMU. Cette collaboration vise à affaiblir les capacités de l'IMU, perturber ses opérations et rétablir la sécurité le long des régions frontalières."
 AFG_shura_system: "Renforcer le système de la shoura"
 AFG_shura_system_desc: "Renforcer le système de la shoura au sein de l'Alliance du Nord est crucial pour maintenir l'unité et une gouvernance efficace. En consolidant cette structure traditionnelle de décision en conseil, nous veillons à ce que toutes les factions soient représentées."
 AFG_anjuman_pass_desc: "Ahmad Shah Massoud, aussi connu comme le Lion du Panchir, incarne la résistance et le leadership tactique. En se rassemblant autour de ses idées, la nation vise à adopter ses stratégies, inspirer les troupes et solidifier ses défenses. Ses principes de commandement ont guidé et guideront l'Afghanistan à travers ses luttes actuelles."
 AFG_ghanis_plan: "Plan de Ghani"
 AFG_ghanis_plan_desc: "Ghani lance un plan pour couper le soutien taliban par des actions militaires ciblées et des projets de développement, visant à stabiliser des régions clés et rétablir le contrôle gouvernemental."
 AFG_secretly_support_the_opium_industry: "Soutien secret à l'industrie de l'opium"
 AFG_secretly_support_the_opium_industry_desc: "Sous le couvert de l'industrialisation, notre base urbaine croira que nous entamons une nouvelle ère de modernisation. Nous ne pouvons toutefois pas aliéner le fondement de la nation, les paysans. Nous soutiendrons secrètement le commerce de l'opium pour améliorer notre prospérité économique et apaiser chaque partie de la société afghane."
 AFG_parliamentary_illusion: "Illusion parlementaire"
 AFG_parliamentary_illusion_idea: "Illusion parlementaire"
 AFG_parliamentary_illusion_idea_desc: "La chambre siège, débat et vote, et ne décide rien qui compte. Elle nous coûte peu à conserver, et l'apparence du consentement vaut plus que la réalité."
 AFG_parliamentary_illusion_desc: "À quoi sert le parlement, au juste ? Eh bien, à faire croire à notre peuple qu'il a son mot à dire. Nous ne pouvons écarter entièrement le processus démocratique, mais nous pouvons le manipuler pour mieux servir nos propres besoins."
 AFG_the_western_kleptocracy: "La kleptocratie occidentale"
 AFG_ashraf_ghani: "Les Ahmadzaï"
 AFG_ashraf_ghani_desc: "Ashraf Ghani a été élu nouveau président de l'Afghanistan. Fort d'un mandat de réforme, il cherche à stabiliser la nation et reconstruire ses institutions."
 AFG_endorse_the_american_candidate: "Soutenir le candidat américain"
 AFG_endorse_the_american_candidate_desc: "Alors que le gouvernement de transition s'achève, le contrôle de Hamid Karzaï sur le gouvernement reste fort. Candidat choisi de l'accord de Bonn, Karzaï a formé un gouvernement large autour de la reconstruction de l'Afghanistan et d'une paix durable avec nos nouveaux alliés américains."
 AFG_the_new_chairman: "Le nouveau président"
 AFG_the_new_chairman_desc: "À mesure que le cycle électoral passe, le chef de l'État doit non seulement exercer le contrôle mais aussi servir de visage à la nation. Le poste étant grand ouvert, Karzaï doit prendre le commandement et diriger l'Afghanistan par l'exemple."
 AFG_aptta: "APTTA"
 AFG_aptta_desc: "L'accord de transit commercial Afghanistan–Pakistan ou APTTA est un accord commercial bilatéral entre le Pakistan et l'Afghanistan, signé sous l'administration Karzaï. Il vise à stimuler le commerce entre les deux pays, soutenir les opérations antiterroristes et apporter le développement dans les régions frontalières."
 AFG_saarc_membership: "Adhésion à l'ASACR"
 AFG_saarc_membership_idea: "Adhésion à l'ASACR"
 AFG_saarc_membership_idea_desc: "Un siège à la table sud-asiatique. Le crédit est moins cher, l'assiette fiscale plus stable, et Kaboul est traitée comme un voisin plutôt qu'un problème."
 AFG_saarc_membership_desc: "L'adhésion de l'Afghanistan à l'Association sud-asiatique de coopération régionale ou SAARC démontre l'intégration du pays dans le cadre économique et politique régional. Elle offre aussi une chance de tirer l'Afghanistan de l'ornière."
 AFG_rebuilding_the_state: "Reconstruire l'État"
 AFG_rebuilding_the_state_desc: "Après la chute des talibans, l'un des principaux objectifs de la construction nationale en Afghanistan est de restaurer et reconstruire l'État de fond en comble. L'Afghanistan, État à l'économie en échec et presque sans routes goudronnées ni voies ferrées, doit désormais être reconstruit en un pays capable de tenir sa place dans l'ordre mondial."
 AFG_drafting_the_constitution: "Rédiger la Constitution"
 AFG_drafting_the_constitution_desc: "La signature de la Constitution marque un tournant pour l'État, car elle met par écrit des mesures qui garantissent les droits de l'homme."
 AFG_national_solidarity_program: "Programme de solidarité nationale"
 AFG_national_solidarity_program_desc: "Le Programme national de solidarité afghan ou NSP était une initiative gouvernementale pour réhabiliter et développer environ 5 000 villages en Afghanistan, avec 900 millions de dollars échelonnés sur trois ans. Il visait à établir des institutions locales élues démocratiquement et à superviser les efforts de reconstruction."
 AFG_reformist_path: "Voie réformiste"
 AFG_reformist_path_desc: "La voie réformiste vise à remplacer l'ancien par le nouveau, et il n'y a pas de meilleur moment que maintenant, alors que l'Afghanistan en est encore aux premiers stades de la construction nationale."
 AFG_next_in_line_of_succession: "Prochain dans l'ordre de succession"
 AFG_next_in_line_of_succession_desc: "Alors que le mandat de Hamid Karzaï s'achève, un successeur doit prendre sa place."
 AFG_sway_local_warlords: "Influencez les seigneurs de guerre locaux"
 AFG_sway_local_warlords_desc: "Les seigneurs de guerre locaux dominent le leadership afghan depuis l'invasion soviétique, et les écarter ne sera pas facile. Nous devrions plutôt identifier et collaborer avec des hommes forts clés pour renforcer notre position."
 AFG_the_islamic_republic: "La République islamique"
 AFG_the_islamic_republic_desc: "Alors que l'État d'Afghanistan s'efface, un nouvel âge de la république commence, marquant un nouveau départ et une nouvelle forme pour notre nation."
 AFG_the_mujahideen: "Les moudjahidines"
 AFG_the_mujahideen_desc: "Les moudjahidines, ou moudjahidines afghans, sont une large coalition d'anciens commandants de la résistance et de seigneurs de guerre, dont beaucoup ont soutenu l'ancienne Alliance du Nord. Nous devrions nous concentrer sur le maintien du statu quo."
 AFG_age_of_republican_leadership: "Leadership Nouvel Âge"
 AFG_age_of_republican_leadership_desc: "Avec la création de la République islamique, nous devrions écarter progressivement les anciens commandants seigneurs de guerre au profit de nouveaux officiers pour les nouvelles forces de défense nationale."
 AFG_islamic_democracy: "Démocratie islamique"
 AFG_islamic_democracy_desc: "Le nouveau chapitre se poursuit avec la société islamique prenant le manteau de l'État d'Afghanistan, espérons-le vers l'avenir. Ce n'est toutefois pas le moment de se reposer, car seigneurs de guerre et figures de gangs parcourent la nation, menaçant de s'aligner sur les forces talibanes."
 AFG_reinforce_the_government: "Renforcer le gouvernement"
 AFG_reinforce_the_government_desc: "Avec notre nouveau contrôle sur les régions du sud de la nation, nous pensons que c'est un bon début pour commander l'opposition et porter notre direction à la lumière de beaucoup."
 AFG_agricultural_modernisation: "Modernisation agricole"
 AFG_agricultural_modernisation_desc: "Moderniser l'irrigation, la mécanisation et les techniques agricoles relèverait la production dans nos provinces rurales et donnerait au Trésor une nouvelle source de recettes du secteur agricole."
 AFG_the_farmer_and_their_rifle: "Le paysan et son fusil"
 AFG_the_farmer_and_their_rifle_desc: "Avec la soif de trancher chair et os pour protéger leur patrie, les habitants ruraux de l'Afghanistan se sont révélés l'épine dorsale de l'État. Perdre le soutien de cette communauté serait le premier domino menant à notre chute."
 AFG_inheritor_of_afghanistan: "Héritier de l'Afghanistan"
 AFG_inheritor_of_afghanistan_desc: "L'Afghanistan n'a vraiment connu la paix que sous notre règne. Nous sommes devenus les héritiers de l'État afghan et devrions être loués pour cet accomplissement, non écartés par les puissances mondiales."
 AFG_second_man_of_the_state: "Second homme de l'État"
 AFG_second_man_of_the_state_desc: "Ancien commandant de la résistance, Atta s'est pris d'intérêt pour le pouvoir. Il s'est établi comme un dirigeant distinct de l'Afghanistan et n'a pas hésité à s'engager dans de vastes conflits avec d'autres seigneurs de guerre."
 AFG_dismantle_the_warlords: "Démanteler les seigneurs de guerre"
 AFG_dismantle_the_warlords_desc: "Des voyous et des gangsters dirigent certaines régions de la nation. Pour vraiment nous transformer en État-nation moderne, nous devons nous attaquer à ce problème des seigneurs de guerre."
 AFG_a_tolerant_state: "Un État tolérant"
 AFG_a_tolerant_state_desc: "L'Afghanistan abrite une multitude de peuples différents. Nous devons tenir nos promesses de considérer chaque Afghan comme un et de rester unis."
 AFG_naveen: "Naveen"
 AFG_naveen_desc: "Le Parti du nouvel Afghanistan, ou Naveen, est un parti politique afghan dirigé par Yunus Qanuni. Le parti a été fondé lorsque Qanuni s'est éloigné du Mouvement national d'Afghanistan, dirigé par Ahmad Wali Massoud. Yunus Qanuni vise à poursuivre la mentalité de l'Alliance du Nord."
 AFG_new_class_of_jam_iat_reformers: "Nouvelle classe de réformateurs du Jam'iat"
 AFG_new_class_of_jam_iat_reformers_desc: "Yunus Qanuni représente une nouvelle vague de réformateurs du Jam'iat plus ouverts aux valeurs islamiques et traditionnelles. Ce groupe tend à adopter une approche plus réformiste, privilégiant le changement graduel plutôt que la conversion agressive."
 AFG_counite_masouds_works: "Continuer le travail de Massoud"
 AFG_counite_masouds_works_desc: "Avec la défaite de l'Alliance du Nord et la fin du leadership de Massoud, nous restons déterminés à préserver l'esprit de l'Alliance du Nord alors que nous nous efforçons de bâtir un Afghanistan moderne."
 AFG_foster_innovation: "Favoriser l’innovation"
 AFG_foster_innovation_desc: "En tant qu'ancien ministre de l'Éducation, Yunus Qanuni comprend le besoin critique d'innovation dans le secteur éducatif."
 AFG_combat_electoral_corruption: "Combattre la corruption électorale"
 AFG_combat_electoral_corruption_desc: "En Afghanistan, des officiels ont souvent usé de pots-de-vin pour amasser des richesses et maintenir leur pouvoir. Désormais, nous devons veiller à ce que la fraude électorale ne soit plus tolérée."
 AFG_empowering_provincial_governance: "Renforcer la gouvernance provinciale"
 AFG_empowering_provincial_governance_desc: "Autonomiser la gouvernance provinciale en Afghanistan est essentiel. Comme l'a montré l'Allemagne, une gouvernance décentralisée permet aux régions de progresser et de rattraper le reste de la nation."
 AFG_centralise_the_apparatus_of_the_state: "Centraliser l'appareil de l'État"
 AFG_centralise_the_apparatus_of_the_state_desc: "La centralisation renforcera notre contrôle, en veillant à ce que tous les examens et l'opposition soient gérés directement par nous."
 AFG_expand_the_education_ministry: "Élargir le ministère de l'Éducation"
 AFG_expand_the_education_ministry_desc: "Élargir le ministère de l'Éducation bénéficierait grandement à notre État en formant une main-d'œuvre plus qualifiée et une société plus éduquée."
 AFG_propose_a_new_constitution: "Proposer une nouvelle Constitution"
 AFG_propose_a_new_constitution_desc: "La constitution afghane actuelle n'est pas à la hauteur des normes modernes et exige d'importants amendements."
 AFG_embezzle_foreign_funds: "Détourner les fonds étrangers"
 AFG_embezzle_foreign_funds_desc: "Détourner les fonds étrangers a été une méthode pour maintenir un contrôle serré sur la nation et soutenir notre gouvernance aux côtés de l'Assemblée nationale."
 AFG_enforce_afghan_centralism: "Appliquer le centralisme"
 AFG_enforce_afghan_centralism_desc: "Les Afghans sont un peuple rural et tribal, et ont historiquement mal réagi à toute forme de centralisation. Mais à quoi sert notre gouvernement si nous sommes limités dans ce que nous pouvons et ne pouvons pas faire ? Nous devons taper du poing et imposer le centralisme."
 AFG_urban_tribal_divisions: "Concessions aux chefs de la Choura"
 AFG_urban_tribal_divisions_desc: "En déplaçant une partie de nos tribus vers des zones urbanisées, nous pourrons donner à certaines régions une plus grande autonomie et un meilleur contrôle, car elles seront plus organisées."
 AFG_atlanticism: "Atlanticisme"
 AFG_atlanticism_desc: "L'atlantisme est la croyance en une coopération étroite entre l'Amérique du Nord et l'Europe, doctrine née après la Seconde Guerre mondiale. L'Afghanistan souhaite adopter un modèle plus occidental en matière de progrès et de gouvernance."
 AFG_arsenal_of_democracy: "Arsenal de la démocratie"
 AFG_arsenal_of_democracy_desc: "L'économie d'armement américaine étant en plein essor, nous devrions en tirer parti en nous approvisionnant et en nous préparant aux défis à venir."
 AFG_the_republic_survives_another_day: "La République a survécu un jour de plus"
 AFG_the_republic_survives_another_day_desc: "Alors que la nuit cède au jour, la bannière du peuple afghan tient bon. Prête à ce qui vient, paix ou guerre. Une chose reste certaine : la république durera jusqu'à son dernier souffle."
 AFG_defenders_of_democracy: "Défenseurs de la démocratie"
 AFG_defenders_of_democracy_desc: "Passer d'un État à peine familiarisé avec la démocratie à un régime qui l'embrasse pleinement est sans précédent. Nous devons remplir notre devoir et protéger cette nation et ses idéaux à tout prix."
 AFG_root_out_the_old_cabinet: "Épurer l'ancien cabinet"
 AFG_root_out_the_old_cabinet_desc: "Ceux des anciens bureaux sont encore dans le système parlementaire. Nous devons les désarmer et les exposer pour les fraudeurs qu'ils sont."
 AFG_moderate_islamism: "Islamisme modéré"
 AFG_moderate_islamism_desc: "L'islamisme modéré désigne une approche passive ou traditionnelle de l'islam, le distinguant des interprétations plus radicales et révolutionnaires."
 AFG_basej_e_milli: "La Tendance verte"
 AFG_basej_e_milli_desc: "Basej-e Milli, aussi connu comme Rawand-e Sabz-e Afghanistan, est un parti politique antitaleb, nationaliste afghan et pro-démocratie. Il joue un rôle important dans la défense d'un avenir démocratique et de l'unité nationale en Afghanistan."
 AFG_knife_to_the_warlords: "Le couteau aux seigneurs de guerre"
 AFG_knife_to_the_warlords_desc: "Les seigneurs de guerre minent cette nation et sont un concept dépassé. Ils prétendent agir au nom du peuple, mais nous nous tenons tous contre eux."
 AFG_standardised_taxation: "Fiscalité standardisée"
 AFG_standardised_taxation_desc: "Une fiscalité standardisée permettra à notre économie de rebondir après des années de guerre."
 AFG_enlist_the_support_of_the_people: "Enrôler le soutien du peuple"
 AFG_enlist_the_support_of_the_people_desc: "Enrôler le soutien du peuple sauvera la république des menaces à venir."
 AFG_recraft_the_healthcare_system: "Refondre le système de santé"
 AFG_recraft_the_healthcare_system_desc: "Les hôpitaux sont anciens et ont besoin de restauration et de réparations. Nous devons faire notre part pour y remédier."
 AFG_local_organisation: "Organisation locale"
 AFG_local_organisation_desc: "Nous devons nous rassembler pour être autosuffisants et ne pas dépendre du soutien du reste du monde."
 AFG_lift_the_press_restrictions: "Lever les restrictions sur la presse"
 AFG_lift_the_press_restrictions_desc: "Une presse libre et indépendante est la pierre angulaire d'une société démocratique et vivante."
 AFG_progressive_tax: "Une taxe progressive"
 AFG_progressive_tax_desc: "Pour assurer une répartition équitable de la richesse et des ressources, l'Afghanistan adopte un système d'impôt progressif."
 AFG_return_of_dostum: "Retour de Dostoum"
 AFG_return_of_dostum_desc: "Le général Abdul Rashid Dostoum, dirigeant militaire afghan éminent et figure influente, fait son retour sur la scène nationale. Il est connu pour son commandement redoutable des forces ouzbèkes et pour son acuité stratégique."
 AFG_mission_to_tehran: "Mission à Téhéran"
 AFG_mission_to_tehran_desc: "Pour renforcer les alliances régionales et contrer les menaces extérieures, l'Afghanistan entame une mission diplomatique à Téhéran. En rejoignant l'Axe de la résistance dirigé par l'Iran, l'Afghanistan vise à s'assurer de puissants alliés, renforcer ses capacités militaires et consolider sa position géopolitique."
 AFG_take_command_of_rabbanis_feyzabad_forces: "Commandant les forces Feyzabad de Rabbani"
 AFG_take_command_of_rabbanis_feyzabad_forces_desc: "Les forces de Burhanuddin Rabbani stationnées à Fayzabad sont cruciales pour contrôler les régions du nord-est de l'Afghanistan. En prenant le commandement direct de ces forces, la direction centrale vise à unifier les structures de commandement, améliorer la coordination et renforcer la défense de cette zone stratégiquement importante."
 AFG_karim_khalilis_new_offensive: "La nouvelle offensive de Karim Khalili"
 AFG_karim_khalilis_new_offensive_desc: "Karim Khalili, dirigeant et stratège éminent, mène une nouvelle offensive audacieuse pour reprendre des territoires clés et repousser les forces hostiles. Son plan combine tactiques de guérilla, mobilisation de milices locales et coordination stratégique avec les forces alliées."
 AFG_western_klep_tt1: "Impact de §YDétournement de l'aide étrangère§! sur le §Yrevenu supplémentaire§! : $§G0.18§! milliard"
 AFG_state_northern_stronghold_dynamic_modifier: "Portes du col d'Anjuman"
 AFG_taliban_assault_on_taloqan: "Assaut taliban sur Taloqan"
 AFG_state_battle_for_mazar_i_sharif_dynamic_modifier: "Offensive de Mazar-i-Sharif"
 AFG_increase_road_toll_tt: "Augmenter les péages routiers\nNiveau de péage : [?AFG_toll_level]\nGain monétaire de l'État : $§G[?AFG_Toll_display_var]§!\nBiens de consommation : §Y[?ROOT.AFG_consumer_goods_factor_toll|%]§!"
 AFG_increase_road_toll_tt_desc: "Les niveaux de péage peuvent être relevés jusqu'à cinq fois, chacun augmentant les recettes générées par les autoroutes d'État selon le trafic et le volume de marchandises. Chaque niveau au-dessus du premier coûte §Y2 %§! de biens de consommation au niveau national, reflétant le fardeau des péages sur l'économie plus large."
 AFG_lower_road_toll_tt: "Diminuer les péages routiers\nNiveau de péage : [?AFG_toll_level]\nGain monétaire de l'État : $§G[?AFG_Toll_display_var]§!\nBiens de consommation : §Y[?ROOT.AFG_consumer_goods_factor_toll|%]§!"
 AFG_lower_road_toll_tt_desc: "Abaisser un niveau de péage rend les §Y2 %§! de biens de consommation qu'il coûtait, au prix des recettes que ce niveau rapportait. Les péages ne peuvent pas descendre sous le premier niveau."
 AFG_toll_below_maximum_tt: "Les péages de cet État sont §Rau niveau le plus élevé§!."
 AFG_toll_above_minimum_tt: "Les péages de cet État sont §Rau niveau le plus bas§!."
 AFG_info_box: "§GPéages§!\nNiveau de péage : [?AFG_toll_level]\nGain monétaire de l'État : $§G[?AFG_Toll_display_var]§!\nGain monétaire national des péages : $§G[?ROOT.additional_income_AFG_tolls_income1]§!\nBiens de consommation nationaux : §Y[?ROOT.AFG_consumer_goods_factor_toll|%]§!"
 AFG_info_box_desc_lore: "Les autoroutes afghanes sont contrôlées par des groupes comme les talibans et les seigneurs de guerre locaux, qui usaient de péages locaux pour générer des revenus sur les routes commerciales reliant l'Asie centrale, l'Iran et le Pakistan. Ces péages, ancrés dans les traditions de la route de la soie, sont une source de financement majeure pour le régime taliban comme pour les seigneurs de guerre, le contrôle des routes clés étant crucial pour le pouvoir et la richesse."
 AFG_usa_equipment: "Implication de la CIA"
 AFG_usa_equipment_desc: "Les Américains n'aiment pas le pied que les talibans ont actuellement, et ils ont donc proposé de nous vendre du matériel à bas prix."
 AFG_join_sco: "Rejoindre l'OCS"
 AFG_join_sco_desc: "L'OCS est dirigée par la Chine et la Russie ; c'est une organisation qui met l'accent sur la paix régionale, la sécurité, la lutte antiterroriste et la coopération économique. Elle peut fournir nombre des ressources que nous jugeons nécessaires, comme des exercices antiterroristes et une aide au développement. Nous devrions rejoindre l'OCS pour le bien du pays."
 AFG_the_western_kleptocracy_desc: "Le changement ? Qui a besoin de changement ? Nous avons l'Occident pour nous aider et la situation s'améliorera comme prévu."
 AFG_liberal_society_desc: "Desserrer l'emprise de l'establishment clérical a donné à Kaboul une presse, un bazar et un débat public. Les partenaires commerciaux nous prennent plus au sérieux, bien que le capital politique dépensé pour tenir la ligne soit réel."
 AFG_preserve_democracy: "Préserver la démocratie"
 AFG_preserve_democracy_desc: "La presse déchaînée et les tribunaux laissés tranquilles, la république a une véritable chance de s'enraciner avant que la prochaine crise ne la mette à l'épreuve."
 AFG_indian_support_and_arms_trade: "Soutien indien et soutien en armes"
 AFG_indian_support_and_arms_trade_desc: "Les Indiens ont accepté de soutenir et d'armer notre nation contre nos ennemis."
 AFG_establishing_supply_lines: "Établir des lignes d'approvisionnement"
 AFG_establishing_supply_lines_desc: "En établissant des lignes de ravitaillement bien tenues et bien entretenues, nos troupes seront suffisamment approvisionnées pour continuer à combattre."
 AFG_russian_technical_specialists: "Spécialistes techniques russes"
 AFG_russian_technical_specialists_desc: "Nous avons fait venir des spécialistes de [SOV.GetFlag] Russie pour travailler sur nos unités mécanisées."
 AFG_the_shura_system_idea: "Le système de la shoura"
 AFG_the_shura_system_idea_desc: "Le système de la shoura dans l'Alliance du Nord est une forme traditionnelle de gouvernance en conseil, ancrée dans les pratiques tribales et communautaires de décision. Ce système rassemble chefs militaires, anciens tribaux et figures influentes pour délibérer et prendre des décisions collectives. Le système de la shoura renforce l'unité et veille à ce que diverses factions de l'Alliance du Nord soient représentées et aient voix au chapitre sur les questions stratégiques et politiques."
 AFG_civilian_exodus_taloqan: "Exode civil Taloqan"
 AFG_civilian_exodus_taloqan_desc: "Les combats autour de Taloqan ont poussé des milliers de familles vers le nord et l'ouest. Les camps mettent à rude épreuve le peu que nous pouvons épargner, mais les réfugiés emportent la province avec eux, et moins de bouches sur la ligne allègent notre ravitaillement."
 AFG_iranian_airbridge: "Pont aérien iranien"
 AFG_iranian_airbridge_desc: "Après la prise de Kaboul par les talibans, l'aide iranienne à l'Alliance du Nord s'est intensifiée. L'Iran a établi un pont aérien entre Mashhad et les bases afghanes de Bagram et de Koulob, pour livrer d'énormes quantités d'armes à l'Alliance du Nord. Des rapports indiquent qu'en une seule journée de 1997, 13 vols iraniens se sont posés à Bagram, et l'Iran est encore soupçonné d'avoir envoyé 700 tonnes d'armes via le Tadjikistan."
 AFG_junbishis: "Junbishis"
 AFG_junbishis_desc: "§RNous ne pouvons pas augmenter manuellement la popularité de §W[Conservative_L]§! tant qu'Abdul Rashid Dostoum est en exil §!\n\nJunbish-i Milli Islami Afghanistan, plus connue sous le nom de Junbish, est une faction majeure de l'Alliance du Nord, principalement composée d'Ouzbeks. Elle a récemment été chassée de son fief de Mazar-e Charif par les talibans, mais Junbish continue de jouer un rôle important au sein de l'Alliance du Nord. Le groupe est dirigé par le général Abdul Rashid Dostoum, un seigneur de guerre de premier plan qui s'est souvent opposé aux autres membres de l'Alliance du Nord et dont les relations restent tendues pendant son exil."
 AFG_northern_alliance_taloqan_siege: "Le siège de Taloqan"
 AFG_northern_alliance_taloqan_siege_desc: "Dans un passé récent, Taloqan servit de quartier général stratégique à Ahmad Shah Massoud, chef éminent des factions moudjahidines, lors de leur résistance à l'armée soviétique. Par la suite, la ville devint le quartier général de [AFG.GetFlag] [AFG.GetNameDefCap] après la chute de Mazar-e Charif aux mains des talibans en 1997."
 AFG_idea_opium_economy: "Économie afghane de l’opium"
 AFG_idea_opium_economy_desc: "Une grande part des paysans afghans vivent de la culture et de la vente de pavot à opium. D'immenses champs de pavot occupent une grande partie de nos terres arables."
 AFG_idea_opium_barons: "Barons de l'opium afghans"
 AFG_idea_opium_barons_desc: "Une grande part des paysans afghans vivent de la culture et de la vente de pavot à opium. D'immenses champs de pavot occupent une grande partie de nos terres arables. Les nouvelles politiques du gouvernement ont permis l'émergence d'une clique de barons de l'opium qui contrôlent plusieurs vastes réseaux commerciaux. L'influence de ces barons au sein du gouvernement est indéniable."
 AFG_idea_afghan_defence: "Mesures défensives étendues"
 AFG_idea_afghan_defence_desc: "Notre pays est plongé dans une guerre civile. Nous avons perdu du terrain, mais nous ne reculerons plus d'un pas !"
 AFG_idea_un_troops: "Troupes de maintien de la paix de l'ONU"
 AFG_idea_un_troops_desc: "Nous avons demandé le déploiement de Casques bleus de l'ONU dans notre pays, dans l'espoir d'y ramener la stabilité."
 AFG_political_events.1.t: "Demande d'armement de [AFG.GetNameDef]"
 AFG_political_events.1.d: "[AFG.GetNameDef] a envoyé un émissaire à [ROOT.capital.GetName] pour négocier un accord afin que nous les équipions du matériel nécessaire à leurs opérations de combat."
 AFG_political_events.1.a: "Nous acceptons"
 AFG_political_events.1.b: "Pas aujourd'hui"
 AFG_political_events.2.t: "[FROM.GetNameDef] rejette notre demande d'armes"
 AFG_political_events.2.d: "[FROM.GetNameDef] a refusé notre demande d'armes. Nous ne nous laisserons pas abattre par ce refus et persévérerons dans nos objectifs actuels."
 AFG_political_events.2.a: "En avant"
 AFG_political_events.3.t: "[FROM.GetNameDef] signe une livraison d'armes"
 AFG_political_events.3.d: "Nous exprimons notre profonde gratitude à [FROM.GetNameDef] pour nous avoir fourni l'équipement tant attendu."
 AFG_political_events.3.a: "Super!"
 AFG_political_events.4.t: "Premières élections afghanes"
 AFG_political_events.4.d: "Aujourd'hui s'achève le dépouillement. Nous sommes enfin sur le point d'élire le premier dirigeant de l'Afghanistan."
 AFG_political_events.4.a: "Gouvernement de Hamid Karzaï"
 AFG_political_events.4.b: "Naveen"
 AFG_political_events.4.c: "Jamiat-e Islami"
 AFG_political_events.4.e: "Gouvernement de Saleh"
 AFG_political_events.0.t: "Atta instaure une dyarchie militaire"
 AFG_political_events.0.d: "Atta Mohammad Nur, ancien commandant de la résistance moudjahidine, a fait entrer ses troupes à Kaboul et exige le contrôle de certains échelons de toutes les forces armées. La plupart des hommes ralliant sa cause, nos options sont, pour le moins, extrêmement limitées."
 AFG_political_events.0.a: "Nous n'avons plus le choix"
 AFG_events.8.t: "[AFG.GetNameDef] demande notre protection"
 AFG_events.8.d: "Après des décennies de troubles, le gouvernement afghan craint une reprise de la guerre ou une ingérence et une invasion extérieures. Le président de [AFG.GetNameWithFlag] [AFG.GetLeader] s'est rendu à la Maison-Blanche et a sollicité auprès de notre président [USA.GetLeader] un traité de défense. Si nous acceptons de les protéger, nous pourrons les maintenir dans notre sphère d'influence, mais nous aurons aussi l'obligation de défendre [AFG.GetNameWithFlag] contre les menaces extérieures et d'aider à maintenir la stabilité du pays, notamment contre l'insurrection £GFX_AFG_salafist_jihadism talibane. Compte tenu de la situation de notre pays, devons-nous signer un traité de défense avec [AFG.GetLeader] ?"
 AFG_events.8.a: "Accepter de les protéger."
 AFG_events.8.b: "Nous n'avons pas le temps pour ça !"
 AFG_events.9.t: "[USA.GetNameDef] a accepté de nous protéger"
 AFG_events.9.d: "Grâce à nos efforts diplomatiques prudents, le président de [USA.GetNameWithFlag] [USA.GetLeader] a formellement signé un traité de défense avec notre président [AFG.GetLeader]. En signant ce traité, [FROM.GetNameWithFlag] nous protégera non seulement contre toute agression extérieure, mais nous aidera aussi à préserver notre stabilité intérieure."
 AFG_events.9.a: "Excellent!"
 AFG_events.10.t: "[USA.GetNameDef] a refusé de signer !"
 AFG_events.10.d: "Bien que notre président [AFG.GetLeader] se soit rendu chez [USA.GetNameWithFlag] pour obtenir une aide sécuritaire, [USA.GetLeader] s'est montré visiblement peu loquace sur tout traité. [USA.GetLeader] a déclaré en conférence de presse que « Nous défendrons toujours la liberté, la démocratie et les droits de l'homme en Afghanistan. » Mais il est évident que l'engagement de [USA.GetLeader] reste verbal : nous devrons nous défendre seuls."
 AFG_events.10.a: "Quelle visite catastrophique..."
 AFG_events.11.t: "[AFG.GetNameDef] demande notre protection"
 AFG_events.11.d: "Après des décennies de troubles, le gouvernement afghan craint une reprise de la guerre ou une ingérence et une invasion extérieures. Le président de [AFG.GetNameWithFlag] [AFG.GetLeader] s'est rendu à Zhongnanhai et a sollicité auprès du secrétaire général [CHI.GetLeader] un traité de défense. Si nous acceptons de les protéger, nous pourrons les maintenir dans notre sphère d'influence, mais nous aurons aussi l'obligation de défendre [AFG.GetNameWithFlag] contre les menaces extérieures et d'aider à maintenir la stabilité du pays, notamment contre l'insurrection £GFX_AFG_salafist_jihadism talibane. Compte tenu de la situation de notre pays, devons-nous signer un traité de défense avec [AFG.GetLeader] ?"
 AFG_events.11.a: "Un autre frère de fer !"
 AFG_events.11.b: "Nous n'avons rien à accorder pour un traité !"
 AFG_events.12.t: "[CHI.GetNameDef] a accepté de nous protéger"
 AFG_events.12.d: "Grâce à nos efforts diplomatiques, le secrétaire général de [CHI.GetNameWithFlag] [CHI.GetLeader] a formellement signé un traité de défense avec notre président [AFG.GetLeader]. En signant ce traité, [FROM.GetNameWithFlag] nous protégera non seulement contre toute agression extérieure, mais nous aidera aussi à préserver notre stabilité intérieure."
 AFG_events.12.a: "Excellent!"
 AFG_events.13.t: "[CHI.GetNameDef] a refusé de signer !"
 AFG_events.13.d: "Bien que notre président [AFG.GetLeader] se soit rendu chez [CHI.GetNameWithFlag] pour obtenir une aide sécuritaire, [CHI.GetLeader] s'est montré visiblement peu loquace sur tout traité. [CHI.GetLeader] a dit à notre président que « Nous resterons toujours attachés à la sécurité et à la stabilité régionales. » Mais il est évident que l'engagement de [CHI.GetLeader] reste verbal : nous devons nous défendre seuls."
 AFG_events.13.a: "Quelle déception..."
 AFG_events.14.t: "[AFG.GetNameDef] dénonce publiquement la ligne Durrani"
 AFG_events.14.d: "Il y a quelques instants, le président de [AFG.GetNameWithFlag] [AFG.GetLeader] a annoncé que [AFG.GetNameWithFlag] ne reconnaîtra jamais la ligne Durand, tracée arbitrairement par les Britanniques au XXe siècle, comme frontière entre les deux pays, et a déclaré d'une voix forte : « Nous ne pourrons peut-être pas reconquérir notre terre pachtoune sacrée pour l'instant, mais nos descendants des générations suivantes reconquerront à coup sûr cette terre, qui nous appartient de droit. Le temps dira tout ! » Il est désormais clair que [AFG.GetNameWithFlag] s'oriente vers une politique étrangère hostile à notre égard."
 AFG_events.14.a: "Ils n'ont absolument aucune justification pour cela !"
 AFG_events.15.t: "Assassinat de Burhanuddin Rabbani"
 AFG_events.15.d: "Ce soir, Burhanuddin Rabbani a été assassiné dans un attentat-suicide à son domicile de Kaboul ; c'était aussi son 71e anniversaire. Deux hommes se faisant passer pour des représentants talibans se sont approchés pour lui offrir une étreinte et l'un d'eux a fait exploser les explosifs cachés dans son turban. L'auteur affirmait être un commandant taliban porteur d'un message très important et positif des chefs talibans au Pakistan. Ils disaient que les talibans voulaient discuter de la paix avec Rabbani. Quatre autres membres du Haut Conseil de la paix de notre gouvernement ont également été tués dans l'explosion. Nos sources confirment que la Choura de Quetta, la direction talibane cachée à Quetta, au Pakistan, est responsable de cet assassinat.\n\nRabbani présidait le Haut Conseil de la paix de notre nation après avoir quitté un rôle de premier plan au gouvernement. Durant cette période, il avait convaincu des centaines de militants talibans de déposer pacifiquement les armes. Cet assassinat est un coup dur pour le processus de paix dans notre pays, car il sera difficile de trouver quelqu'un de son prestige pour occuper ce poste."
 AFG_events.15.a: "Organisez des funérailles nationales."
 AFG_events.16.t: "[AFG.GetNameDef] cherche une reconnaissance de neutralité"
 AFG_events.16.d: "Récemment, [AFG.GetNameDef] a choisi la voie de la neutralité afin de devenir une nation perpétuellement neutre. Ils ont montré leur volonté de remplir les obligations d'un pays neutre permanent, mais il reste à voir si cela sera tenu.\n\nLe gouvernement afghan cherche désormais à ce que notre pays garantisse ce statut de neutralité. Si nous acceptons, nous aurons l'obligation de protéger l'Afghanistan en cas d'invasion. Si nous refusons, d'autres pays pourront garantir ce statut et nous n'y perdrons rien."
 AFG_events.16.a: "Accepter de garantir leur statut de puissance neutre"
 AFG_events.16.b: "Nous n'avons pas le temps pour l'Afghanistan"
 AFG_events.17.t: "[FROM.GetNameDef] garantit notre statut de neutralité"
 AFG_events.17.d: "Le communiqué du gouvernement [FROM.GetAdjective] indique que [FROM.GetNameDef] est prêt à garantir notre statut de neutralité et viendra à notre défense en cas d'invasion extérieure de notre pays.\n\nC'est un succès majeur, puisque nous avons obtenu la reconnaissance de ce statut d'au moins un membre permanent du Conseil de sécurité des Nations unies."
 AFG_events.17.a: "Excellent!"
 AFG_events.18.t: "Le peuple afghan se révolte contre les talibans"
 AFG_events.18.d: "Après l'opération Enduring Freedom, plusieurs milices tribales et de minorités ethniques se sont soulevées contre les talibans, notamment à Hérat. Avec l'aide des États-Unis et de l'Iran, ces milices ont pris le contrôle de plusieurs zones aux talibans et ont rejoint le commandement de l'Alliance du Nord.\n\nLe soulèvement a été salué par des tirs de joie des habitants ; certaines célébrations allèrent jusqu'à « danser sur les toits » et klaxonner. Mohammad Ismaïl Khan, l'un des principaux commandants de l'Alliance du Nord, aussi appelé le « Lion de Hérat », a accordé l'amnistie aux anciens combattants talibans, tout en les mettant en garde contre les représailles s'ils reprenaient les armes."
 AFG_events.18.a: "La victoire est proche !"
 AFG_news.7.t: "[AFG.GetNameDef] annonce des revendications sur le territoire pakistanais"
 AFG_news.7.d: "Il y a quelques instants, le président de [AFG.GetNameWithFlag] [AFG.GetLeader] a annoncé que [AFG.GetNameWithFlag] ne reconnaîtra jamais la ligne Durand, tracée arbitrairement par les Britanniques au XXe siècle, comme frontière entre les deux pays, et a déclaré d'une voix forte : « Nous ne pourrons peut-être pas reconquérir notre terre pachtoune sacrée pour l'instant, mais nos descendants des générations suivantes reconquerront à coup sûr cette terre, qui nous appartient de droit. Le temps dira tout ! » Le président de [PAK.GetNameWithFlag] [PAK.GetLeader] a rejeté toutes les revendications de [AFG.GetLeader] et a vivement critiqué cette action, déclarant que « Les actes diplomatiques hostiles de [AFG.GetLeader] ne feront qu'aggraver encore les relations entre nos deux pays. » et a appelé le gouvernement afghan à respecter le droit international. Il est très clair que les relations diplomatiques entre les deux pays se sont encore détériorées."
 AFG_news.7.a: "Voyons ce qui se passe ensuite."
 AFG_news.8.t: "Coup d'État en Afghanistan"
 AFG_news.8.d: "En raison de la corruption du gouvernement central, de la misère économique et de la pauvreté du peuple, de nombreux Afghans privés de moyens de subsistance et désabusés par le statu quo ont rejoint le £GFX_AFG_kingdom Hezb-e Islami d'Hekmatyar. Un groupe d'officiers afghans impayés depuis longtemps a fomenté un coup d'État, renversé le gouvernement républicain, déclaré la suspension de la Constitution afghane actuelle et l'instauration temporaire d'un contrôle militaire. Gulbuddin Hekmatyar, deux fois Premier ministre de l'Afghanistan dans les années 1990, a officiellement mis fin à son exil et est rentré en Afghanistan comme nouveau président. Hekmatyar a promis d'éradiquer la corruption, de relancer l'économie et de conduire le peuple afghan vers un nouveau chapitre. En réaction au coup d'État, un porte-parole taliban a déclaré : « Nous sommes les vrais Afghans et nous continuerons à abattre Hekmatyar, le « Boucher de Kaboul ». »"
 AFG_news.8.a: "Un nouveau chapitre de la guerre sans fin..."
 AFG_news.9.t: "[AFG.GetNameDef] déploie l'armée dans les villes"
 AFG_news.9.d: "En raison des politiques radicales récentes de la direction de [AFG.GetLeader], telles que la répression des libertés politiques et personnelles, la charia à la talibane et l'élimination de l'influence tribale, une vaste protestation a éclaté contre le gouvernement. Le gouvernement de [AFG.GetLeader] a répondu en déployant des troupes dans les villes et les bourgs, et certains manifestants ont été mortellement abattus par des soldats de l'Armée nationale afghane ou des unités de la Police nationale afghane. Il semble que [AFG.GetNameDef] bascule dans le totalitarisme."
 AFG_news.9.a: "C'est le quotidien en Afghanistan..."
 AFG_news.10.t: "Assassinat de Burhanuddin Rabbani"
 AFG_news.10.d: "Burhanuddin Rabbani a été assassiné ce soir dans un attentat-suicide à son domicile de Kaboul. Deux kamikazes se faisant passer pour des représentants talibans, prétendant vouloir discuter de la paix avec Rabbani, se sont approchés pour lui offrir une étreinte et l'un d'eux a fait exploser les explosifs dans son turban. Quatre autres membres du Haut Conseil de la paix d'Afghanistan ont également été tués dans l'explosion.\n\nRabbani présidait le Haut Conseil de la paix d'Afghanistan après avoir quitté un rôle de premier plan au gouvernement. Durant cette période, il avait convaincu des centaines de militants talibans de déposer pacifiquement les armes. Son assassinat est un coup dur pour le processus de paix en Afghanistan."
 AFG_news.10.a: "Une nouvelle tragique."
 AFG_news.11.t: "Détournement du vol 805 d'Ariana Airlines"
 AFG_news.11.d: "Un groupe de neuf Afghans menés par les frères Ali et Mohammed Safi, fuyant le régime taliban, a détourné le vol 805 d'Ariana Afghan Airlines, un Boeing 727 immatriculé YA-FAY, avec 180 passagers et 7 membres d'équipage. Le vol 805 était un vol intérieur de Kaboul vers l'aéroport de Mazar-e Charif.\n\nLes pirates de l'air ont forcé l'équipage à voler vers l'aéroport de Londres Stansted au Royaume-Uni, après des escales à Tachkent, Aktioubé et Moscou. Le siège de l'appareil a duré jusqu'au 10 février. On ignore encore si les pirates seront condamnés, car leur procès est prévu l'an prochain."
 AFG_news.11.a: "Nous aurions dû les intercepter avec un de nos MiG."
 AFG_news.12.t: "Détournement du vol 805 d'Ariana Airlines"
 AFG_news.12.d: "Un groupe de neuf Afghans menés par les frères Ali et Mohammed Safi, fuyant le régime taliban, a détourné le vol 805 d'Ariana Afghan Airlines, un Boeing 727 immatriculé YA-FAY, avec 180 passagers et 7 membres d'équipage. Le vol 805 était un vol intérieur de Kaboul vers l'aéroport de Mazar-e Charif.\n\nLes pirates de l'air ont forcé l'équipage à voler vers l'aéroport de Londres Stansted au Royaume-Uni, après des escales à Tachkent, Aktioubé et Moscou. Le siège de l'appareil a duré jusqu'au 10 février. On ignore encore si les pirates seront condamnés, car leur procès est prévu l'an prochain."
 AFG_news.12.a: "Intéressant"
 AFG_news.12.b: "Le terrorisme est un fléau pour l'humanité."
 AFG_news.13.t: "L'Iran renvoie des réfugiés en Afghanistan"
 AFG_news.13.d: "Après un accord avec le HCR, l'Iran a lancé un programme de rapatriement qui renverra 7 700 réfugiés afghans dans leur patrie au cours des trois prochaines semaines."
 AFG_news.13.a: "Cette guerre aura-t-elle une fin ?"
 AFG_news.14.t: "La guerre en Afghanistan laisse des milliers de personnes affamées"
 AFG_news.14.d: "Le Programme alimentaire mondial a rapporté que la sécheresse dans les provinces de Kandahar et de Zaboul était désespérée. Les Koutchi avaient perdu jusqu'à 80 % de leur bétail et les systèmes d'irrigation destinés à collecter l'eau de pluie étaient à sec. Les abricotiers et les amandiers s'étaient flétris, sans fruits. Les chameaux mouraient. Depuis février, le PAM nourrissait 30 000 familles de la région et prévoyait d'en ajouter 10 000 en mai. Le PAM proposait aux Afghans de la farine supplémentaire s'ils restaient dans leurs villages."
 AFG_news.14.a: "Le peuple afghan a besoin de nous."
 AFG_events.32.t: "Le château appelé Taloqan est tombé"
 AFG_events.32.d: "La prise impitoyable par les talibans a provoqué un exode massif, les civils fuyant vers Imam Sahib et la vallée du Panchir. Après un siège brutal ayant coûté des centaines de vies civiles, nos soldats ont stoppé l'avance talibane au nord et à l'est de la ville, mais n'ont pu la reprendre. Nous avons abandonné le quartier général de l'Alliance du Nord dans la ville, déplaçant notre base d'opérations à Fayzabad."
 AFG_events.32.a: "Une journée sombre"
 AFG_events.31.t: "Taloqan se bat un autre jour"
 AFG_events.31.d: "Après un siège brutal, les talibans ont essuyé une défaite. Ce triomphe fait écho à la résilience de nos victoires passées. Que ce soit un nouveau pas vers la chute définitive des talibans, car « Taloqan est un lieu de trésors d'Allah. Ces trésors ne sont pas d'or et d'argent, mais des hommes qui ont reconnu Allah comme ils le devaient. »"
 AFG_events.31.a: "Une journée sombre"
 AFG_investment.1.t: "[AFG.GetNameDef] nous invite à investir dans ses projets"
 AFG_investment.1.desc: "Tout juste remis de la guerre contre les talibans, le gouvernement de [AFG.GetNameWithFlag] nous invite à investir dans certains projets du pays. Investir ou non nous appartient. Si nous choisissons d'investir, nous pourrons gagner de l'influence sur leur gouvernement ; si la menace terroriste reste élevée en Afghanistan, mieux vaut ne pas prendre le risque."
 AFG_investment.1.a: "Investir dans leurs infrastructures !"
 AFG_investment.1.b: "Investir dans leur industrie civile !"
 AFG_investment.1.c: "Investir dans leur industrie des services !"
 AFG_investment.1.d: "Mieux vaut ne pas prendre ce risque."
 AFG_investment.2.t: "[FROM.GetNameDef] a investi dans nos infrastructures !"
 AFG_investment.2.d: "Après des jours de négociations, [FROM.GetNameWithFlag] a accepté d'investir dans nos infrastructures en échange de concessions minimes. L'investissement profitera à la population rurale du pays."
 AFG_investment.2.a: "Nous leur sommes reconnaissants de leur aide !"
 AFG_investment.3.t: "[FROM.GetNameDef] a investi dans notre industrie civile !"
 AFG_investment.3.d: "Après des jours de négociations, [FROM.GetNameWithFlag] a accepté de nous aider à construire des usines civiles en échange de concessions mineures. L'investissement profitera au secteur industriel du pays et facilitera sa modernisation."
 AFG_investment.3.a: "Nous leur sommes reconnaissants de leur aide !"
 AFG_investment.4.t: "[FROM.GetNameDef] a investi dans notre industrie des services !"
 AFG_investment.4.d: "Après des jours de négociations, [FROM.GetNameWithFlag] a accepté d'investir dans notre industrie des services en construisant des bureaux en échange de concessions mineures. L'investissement profitera au secteur financier du pays et facilitera sa modernisation."
 AFG_investment.4.a: "Nous leur sommes reconnaissants de leur aide !"
 AFG_investment.5.t: "[FROM.GetNameDef] a refusé d'investir !"
 AFG_investment.5.d: "Après des jours de négociations, [FROM.GetNameWithFlag] a rejeté notre invitation à investir, arguant que le climat des affaires dans notre pays n'est pas encore assez sûr, et évaluera avec prudence de futurs accords d'investissement avec nous."
 AFG_investment.5.a: "Il nous faudra encore travailler !"
 AFG_taliban_insurgency.0.t: "Le début de l'insurrection talibane"
 AFG_taliban_insurgency.0.d: "Après l'effondrement de la force talibane principale, leurs bataillons se sont fragmentés en diverses cellules et ont commencé une guerre de guérilla dans tous les recoins de l'Afghanistan, lancant d'odieux attentats. On estime que l'insurrection prendra des années à être réellement matée, mais si nous n'agissons pas, nous n'aurons jamais de stabilité dans notre pays."
 AFG_taliban_insurgency.0.a: "Il est temps de s'y mettre !"
 AFG_taliban_insurgency.1.t: "Raid réussi sur une cache talibane"
 AFG_taliban_insurgency.1.d: "Grâce à nos braves unités de commandos, la cachette talibane que nous avions découverte a été détruite : certains militants ont tenté de résister et ont été tués par nos commandos, tandis que la plupart se sont rendus et que très peu ont échappé à la justice. Dans l'ensemble, l'opération a été un succès complet !"
 AFG_taliban_insurgency.1.a: "Excellent!"
 AFG_taliban_insurgency.2.t: "Échec du raid"
 AFG_taliban_insurgency.2.d: "L'échec du raid a été un coup dur pour notre unité de commandos antiterroristes. Les talibans semblaient connaître nos plans à l'avance et ont lancé une attaque préventive contre certains de nos convois, posant des IED sur notre itinéraire obligatoire et embusquant nos commandos après l'explosion. Plusieurs commandos ont malheureusement perdu la vie.\n\nLors du débriefing, certains généraux soupçonnent que des sympathisants parmi les organisateurs de l'opération ont pu fuiter le plan aux talibans ; le rapport a aussi critiqué la corruption du gouvernement, qui a pu coûter la vie aux commandos. Nous devons tirer les leçons de cet échec !"
 AFG_taliban_insurgency.2.a: "Repos en paix à nos héros !"
 AFG_taliban_insurgency.3.t: "Frappe aérienne réussie"
 AFG_taliban_insurgency.3.d: "Bonne nouvelle ! Un appareil de contre-insurrection de notre force aérienne, piloté par l'un de nos aviateurs expérimentés, a détruit un campement taliban grâce aux coordonnées fournies par nos services de renseignement ; le camp a été entièrement anéanti et de nombreux militants tués.\n\nCe succès a montré l'efficacité du secteur de la sécurité intérieure de notre agence de renseignement et prouve que la technologie est essentielle aux futures opérations de contre-insurrection."
 AFG_taliban_insurgency.3.a: "Une belle réussite !"
 AFG_taliban_insurgency.4.t: "Un échec de frappe aérienne tue des civils"
 AFG_taliban_insurgency.4.d: "Horrible nouvelle ! Notre force aérienne a bombardé une cible d'après les coordonnées de nos services de renseignement, mais il est désormais évident que les bombes ont frappé des cibles civiles et tué des innocents au lieu des combattants talibans visés.\n\nLa population locale est en deuil et, à juste titre, indignée par cet échec ; des manifestations sont déjà signalées dans la zone. Nous devons examiner les causes de cet échec afin de donner une explication à nos citoyens."
 AFG_taliban_insurgency.4.a: "Une tragédie !"
 AFG_taliban_insurgency.5.t: "Aéronef abattu par des militants talibans"
 AFG_taliban_insurgency.5.d: "Nouvelle tragique de l'opération aérienne ! Un de nos appareils de contre-insurrection a été abattu par des militants talibans à l'aide d'un missile sol-air porté à l'épaule ; le pilote a été tué.\n\nCet échec opérationnel montre que nous devons réorganiser notre force aérienne pour l'avenir et obtenir de meilleurs renseignements sur nos cibles talibanes."
 AFG_taliban_insurgency.5.a: "Un pilote héroïque, qu'il repose en paix !"
 AFG_taliban_insurgency.6.t: "Succès de la propagande d'unité"
 AFG_taliban_insurgency.6.d: "Grâce à nos efforts de propagande d'unité, certains combattants talibans se sont présentés à nos postes de police et militaires et ont déposé les armes ; certains ont même embrassé nos soldats et policiers locaux. Nos forces ne leur ont pas trop mis de bâtons dans les roues et ont même donné à beaucoup d'entre eux de l'argent pour rentrer chez eux. La confiance du public envers le gouvernement et l'unité nationale en ont été renforcées."
 AFG_taliban_insurgency.6.a: "Une évolution réussie !"
 AFG_taliban_insurgency.7.t: "Échec de la propagande d'unité"
 AFG_taliban_insurgency.7.d: "Notre gouvernement est extrêmement déçu : notre récente campagne de propagande d'unité n'a pas porté ses fruits. Selon certains commandants talibans de base, la direction talibane voit le gouvernement afghan actuel comme un gouvernement de voleurs, une marionnette d'une puissance étrangère, et nullement représentatif de la nation afghane. Ils se considèrent comme les vrais Afghans."
 AFG_taliban_insurgency.7.a: "Peut-être devons-nous en faire davantage de notre côté..."
 AFG_taliban_insurgency.8.t: "L'élimination de l'insurrection talibane"
 AFG_taliban_insurgency.8.d: "Il y a quelques heures, le gouvernement afghan a officiellement confirmé avoir réussi à éradiquer l'insurrection talibane. Selon les informations publiées, la grande majorité des talibans ont déposé pacifiquement les armes et sont rentrés chez eux.\n\nQuelques militants endurcis ont fui de l'autre côté de la frontière afghano-pakistanaise vers les zones tribales pakistanaises et ont rejoint des groupes militants locaux. Le gouvernement afghan ayant suffisamment renforcé les mesures de sécurité le long de la frontière, il est peu probable que ces militants retranchés au Pakistan s'infiltrent à nouveau."
 AFG_taliban_insurgency.8.a: "Le conflit interminable touche-t-il enfin à sa fin ?"
 AFG_taliban_insurgency.10.t: "Les talibans lancent une insurrection à grande échelle"
 AFG_taliban_insurgency.10.d: "La récente recrudescence des attaques talibanes et de la violence a donné aux talibans l'occasion de faire basculer l'insurrection en guerre civile. Les talibans ont pris une vaste étendue de territoire rural, constituant un bastion sud-ouest principal, tandis que d'autres zones rurales tombaient sous leur joug.\n\nUne petite partie de l'Armée nationale afghane a vu des soldats déserter, dont certains ont rejoint les talibans ; la plupart ont choisi de rester et de résister, par crainte d'être liquidés par les talibans.\n\nLe soutien de la communauté internationale reste incertain, mais nous devons rassembler nos soldats et combattre jusqu'à la victoire."
 AFG_taliban_insurgency.10.a: "Nous n'avons d'autre choix que de combattre !"
 AFG_taliban_insurgency.11.t: "Les talibans lancent une insurrection à grande échelle"
 AFG_taliban_insurgency.11.d: "La récente recrudescence des attaques talibanes et de la violence a donné aux talibans l'occasion de faire basculer l'insurrection en guerre civile. Les talibans ont pris une vaste étendue de territoire rural, constituant un bastion sud-ouest principal, tandis que d'autres zones rurales tombaient sous leur joug.\n\nUne petite partie de l'Armée nationale afghane a vu des soldats déserter, dont certains ont rejoint les talibans ; la plupart ont choisi de rester et de résister, par crainte d'être liquidés par les talibans.\n\nLe dirigeant afghan [AFG.GetLeader] a annoncé que l'insurrection sera écrasée et a promis de se battre jusqu'au retour de la paix."
 AFG_taliban_insurgency.11.a: "L'Afghanistan est de nouveau en guerre..."
 AFG_taliban_insurgency.14.t: "La situation en Afghanistan"
 AFG_taliban_insurgency.14.d: "Nous savons que le gouvernement afghan nous a autorisés à stationner des troupes sur son territoire, mais nos services de renseignement militaire avertissent que les talibans mènent actuellement une insurrection dans tous les recoins de l'Afghanistan et que de nombreux autres groupes terroristes profitent de l'instabilité. La menace terroriste a atteint un niveau critique, pouvant constituer un réel danger pour nos troupes sur place.\n\nSi nous maintenons nos troupes en Afghanistan, elles risquent d'être prises pour cible par les talibans et d'autres groupes terroristes. Toutefois, si nous restons, nous pourrons aider les forces gouvernementales afghanes dans leurs opérations de contre-insurrection. Dans ce cas, notre armée pourra acquérir une précieuse expérience des techniques de contre-insurrection et de contre-guérilla, et protéger nos citoyens en Afghanistan.\n\n[ROOT.GetLeader], si vous choisissez de maintenir le stationnement en Afghanistan, nous ne vous en empêcherons pas, mais réfléchissez bien si le risque en vaut vraiment la peine."
 AFG_taliban_insurgency.14.a: "Nous contribuerons aux efforts afghans de contre-insurrection."
 AFG_taliban_insurgency.14.b: "Mieux vaut ne pas risquer la vie de nos militaires."
 AFG_taliban_insurgency.15.t: "[FROM.GetNameDef] se joint à notre lutte"
 AFG_taliban_insurgency.15.d: "[FROM.GetLeader], le dirigeant de [FROM.GetNameDef], a informé notre gouvernement que les troupes [FROM.GetAdjective] stationnées dans notre pays sont prêtes à se joindre à notre lutte de contre-insurrection contre les talibans, en plus de protéger leurs citoyens sur notre sol.\n\nEn outre, [FROM.GetName] fournira une assistance sécuritaire, notamment des détecteurs d'explosifs et d'autres équipements militaires plus avancés."
 AFG_taliban_insurgency.15.a: "Nous sommes reconnaissants de cette aide !"
 AFG_taliban_insurgency.16.t: "[FROM.GetNameDef] Début du retrait des troupes"
 AFG_taliban_insurgency.16.d: "[FROM.GetLeader], le dirigeant de [FROM.GetNameDef], a informé notre gouvernement que les troupes [FROM.GetAdjective] stationnées dans notre pays ont achevé leur mission et que les soldats rentrent chez eux.\n\nLe commandant des troupes [FROM.GetAdjective] dans notre pays a déjà entamé les procédures de transfert des bases avec nos commandants."
 AFG_taliban_insurgency.16.a: "Adieu!"
 AFG_taliban_insurgency.17.t: "Raid réussi sur une cache talibane"
 AFG_taliban_insurgency.17.d: "Grâce à nos braves unités de commandos, la cachette talibane que nous avions découverte a été détruite : certains militants ont tenté de résister et ont été tués par nos commandos, tandis que la plupart se sont rendus et que très peu ont échappé à la justice. Dans l'ensemble, l'opération a été un succès complet !"
 AFG_taliban_insurgency.17.a: "Excellent!"
 AFG_taliban_insurgency.18.t: "Échec du raid"
 AFG_taliban_insurgency.18.d: "L'échec du raid a été un coup dur pour notre unité de commandos antiterroristes. Les talibans semblaient connaître nos plans à l'avance et ont lancé une attaque préventive contre certains de nos convois, posant des IED sur notre itinéraire obligatoire et embusquant nos commandos après l'explosion. Plusieurs commandos ont malheureusement perdu la vie.\n\nLors du débriefing, certains généraux soupçonnent que des sympathisants parmi les organisateurs de l'opération ont pu fuiter le plan aux talibans ; le rapport a aussi critiqué la corruption du gouvernement, qui a pu coûter la vie aux commandos. Nous devons tirer les leçons de cet échec !"
 AFG_taliban_insurgency.18.a: "Qu'ils reposent en paix !"
 AFG_taliban_insurgency.21.t: "Frappe de drone réussie"
 AFG_taliban_insurgency.21.d: "Notre frappe de drone contre les talibans a réussi ! Notre drone a pu repérer, frapper et détruire plusieurs cachettes talibanes près d'une zone urbaine, affaiblissant leurs capacités militaires dans la région et laissant temporairement leur structure de commandement locale complètement désorganisée.\n\nD'abord effrayée par la frappe, la population locale a ensuite célébré le repli des insurgés talibans, du moins pour l'instant."
 AFG_taliban_insurgency.21.a: "Les drones sont l'avenir de la guerre !"
 AFG_taliban_insurgency.22.t: "Une frappe de drone ratée tue des civils"
 AFG_taliban_insurgency.22.d: "Aujourd'hui, l'un de nos drones a visé et détruit ce qui semblait être une cachette talibane près d'une zone résidentielle, mais des rapports de renseignement récents ont conclu que le bâtiment visé était en fait un petit immeuble occupé par des civils.\n\nLes médias couvrent déjà l'incident et de nombreux groupes critiquent notre implication dans cette guerre."
 AFG_taliban_insurgency.22.a: "C'était une erreur technique !"
 AFG_taliban_insurgency.23.t: "Opération de bombardement réussie"
 AFG_taliban_insurgency.23.d: "Les renseignements indiquent qu'aujourd'hui l'un de nos bombardiers stratégiques a détruit un complexe de tunnels taliban caché dans les montagnes de l'est de l'Afghanistan.\n\nNotre campagne de bombardement réussie commence à paralyser les opérations talibanes dans les zones isolées du pays, et l'effondrement de leur infrastructure forcera les talibans à se rendre avec le temps."
 AFG_taliban_insurgency.23.a: "Les djihadistes apprendront à craindre notre puissance aérienne !"
 AFG_taliban_insurgency.24.t: "Un bombardement erroné a tué des civils"
 AFG_taliban_insurgency.24.d: "Aujourd'hui, un incident catastrophique s'est produit !\n\nNotre force aérienne a bombardé une zone montagneuse de l'est de l'Afghanistan jusqu'à ce que nous découvrions qu'il n'y avait aucun campement taliban, mais en réalité un petit village entre les montagnes. Le village a été entièrement détruit par notre raid.\n\nLa crédibilité de notre campagne aérienne est gravement mise en cause. Nos responsables politiques et le commandement militaire sont accusés de crimes de guerre contre le peuple afghan."
 AFG_taliban_insurgency.24.a: "C'est terrible !"
 AFG_taliban_insurgency.25.t: "[FROM.GetNameDef] Fournit un équipement technique"
 AFG_taliban_insurgency.25.d: "Un message du gouvernement [FROM.GetAdjective] à notre direction indique que [FROM.GetNameDef] nous fournira du matériel technique de contre-insurrection, notamment des détecteurs d'explosifs pouvant être installés sur les routes ou aux entrées, des chiens dressés à détecter les explosifs cachés, ainsi que d'autres appareils électroniques pour améliorer l'efficacité de notre armée et de notre police face à l'insurrection talibane.\n\nLe matériel devrait arriver dans le mois et, nous l'espérons, réduira la croissance de l'insurrection talibane, du moins pour un temps."
 AFG_taliban_insurgency.25.a: "Nous sommes reconnaissants de cette aide !"
 AFG_taliban_attack.0.t: "Des militants talibans attaquent un poste de police local"
 AFG_taliban_attack.0.d: "Aujourd'hui, un groupe de militants talibans a embusqué sans sommation l'un des postes de police du gouvernement. Nos forces de police, clairement prises au dépourvu, se sont battues vaillamment jusqu'à ce que leurs supérieurs ordonnent l'évacuation du poste.\n\nLes militants talibans ont occupé le poste jusqu'à ce que l'armée soit informée et vienne en appui. Des armes de l'arsenal du poste ont toutefois été emportées par les talibans. Pendant l'attaque, nos forces de police et militaires ont tué plusieurs militants talibans, mais notre police a aussi perdu plusieurs braves officiers."
 AFG_taliban_attack.0.a: "Ils paieront pour cela !"
 AFG_taliban_attack.1.t: "Les talibans afghans attaquent un commissariat de police"
 AFG_taliban_attack.1.d: "Aujourd'hui, un groupe de militants talibans afghans a embusqué sans sommation l'un des postes de police du gouvernement afghan. Les forces de police afghanes, clairement prises au dépourvu, se sont battues vaillamment jusqu'à ce que leurs supérieurs ordonnent l'évacuation du poste.\n\nLes militants talibans ont occupé le poste jusqu'à ce que l'armée afghane soit informée et vienne en appui. Des armes de l'arsenal du poste ont toutefois été emportées par les talibans. Pendant l'attaque, la police et l'armée afghanes ont tué plusieurs militants talibans, mais la police a aussi perdu plusieurs braves officiers."
 AFG_taliban_attack.1.a: "Une évolution préoccupante."
 AFG_taliban_attack.2.t: "Les talibans lancent un attentat contre un bus"
 AFG_taliban_attack.2.d: "Aujourd'hui, un groupe de militants talibans a forcé un bus à s'arrêter avec un camion, a mitraillé les civils à l'intérieur au Kalachnikov, puis a fait exploser une voiture piégée près du bus. À l'arrivée de la police militaire, les militants ont fui : certains ont été abattus, les quelques-uns qui n'ont pas échappé ont été capturés et emmenés pour interrogatoire.\n\nD'après l'interrogatoire et l'enquête, l'attentat visait délibérément touristes et étrangers. Les talibans ont mis à prix la mort d'étrangers en Afghanistan. L'attaque a aussi fait des victimes parmi des citoyens étrangers, et les pays concernés exigent déjà de notre gouvernement une enquête complète."
 AFG_taliban_attack.2.a: "Nous devons traquer ces terroristes talibans !"
 AFG_taliban_attack.3.t: "Un attentat taliban contre un bus tue nos citoyens"
 AFG_taliban_attack.3.d: "Aujourd'hui, un groupe de militants talibans afghans a forcé un bus à s'arrêter avec un camion, a mitraillé les civils à l'intérieur au Kalachnikov, puis a fait exploser une voiture piégée près du bus. À l'arrivée de la police militaire afghane, les militants ont fui : certains ont été abattus, les quelques-uns qui n'ont pas échappé ont été capturés et emmenés pour interrogatoire.\n\nL'attaque a aussi fait des victimes parmi nos citoyens ; notre ambassadeur en Afghanistan a contacté les autorités afghanes pour gérer les suites."
 AFG_taliban_attack.3.a: "Présenter nos condoléances aux familles des victimes !"
 AFG_taliban_attack.4.t: "Des étrangers tués dans un attentat taliban contre un bus"
 AFG_taliban_attack.4.d: "Aujourd'hui, un groupe de militants talibans afghans a forcé un bus à s'arrêter avec un camion, a mitraillé les civils à l'intérieur au Kalachnikov, puis a fait exploser une voiture piégée près du bus. À l'arrivée de la police militaire afghane, les militants ont fui : certains ont été abattus, les quelques-uns qui n'ont pas échappé ont été capturés et emmenés pour interrogatoire.\n\nL'attaque a fait des victimes parmi les Afghans locaux et des citoyens étrangers, et a suscité une large condamnation de la communauté internationale."
 AFG_taliban_attack.4.a: "Présenter nos condoléances aux victimes !"
 AFG_taliban_attack.5.t: "Les talibans attaquent un convoi de pétroliers"
 AFG_taliban_attack.5.d: "Aujourd'hui, des militants talibans ont attaqué un convoi de camions-citernes censé livrer du carburant vital à l'armée et à la police militaire. Les militants ont incendié les citernes et les chauffeurs ont été enlevés par les talibans. On ignore encore où ils se trouvent.\n\nAucun bilan parmi les habitants n'est encore signalé, mais les citernes sont entièrement calcinées et les routes voisines sont totalement fermées par l'armée pour des raisons de sécurité. Il faudra du temps pour que la vie reprenne son cours dans la zone."
 AFG_taliban_attack.5.a: "Nous devons sauver ces chauffeurs !"
 AFG_taliban_attack.6.t: "Les talibans afghans brûlent des pétroliers"
 AFG_taliban_attack.6.d: "Aujourd'hui, des militants talibans afghans ont attaqué un convoi de camions-citernes censé livrer du carburant vital à l'armée et à la police militaire. Les militants ont incendié les citernes et les chauffeurs ont été enlevés par les talibans. On ignore encore où ils se trouvent.\n\nAucun bilan parmi les habitants n'est encore signalé, mais les citernes sont entièrement calcinées et les routes voisines sont totalement fermées par l'armée pour des raisons de sécurité. Il faudra du temps pour que la vie reprenne son cours dans la zone."
 AFG_taliban_attack.6.a: "L'Afghanistan est vraiment un endroit dangereux..."
 AFG_taliban_attack.7.t: "Les talibans attaquent un convoi militaire"
 AFG_taliban_attack.7.d: "Aujourd'hui, des militants talibans ont lancé un attentat-suicide choquant contre l'un de nos convois militaires. Ils ont conduit deux voitures et les ont fait exploser à l'approche des camions militaires.\n\nL'attentat a détruit plusieurs camions militaires sous l'effet de souffle et a fait plusieurs victimes parmi nos soldats ; heureusement, la plupart n'ont subi que des blessures. Les militants impliqués ont été tués sur le coup par leurs propres bombes."
 AFG_taliban_attack.7.a: "Nous devons renforcer le filtrage des véhicules !"
 AFG_taliban_attack.8.t: "Un attentat-suicide taliban vise l'armée afghane"
 AFG_taliban_attack.8.d: "Aujourd'hui, des militants talibans afghans ont lancé un attentat-suicide choquant contre l'un des convois militaires d'Afghanistan. Ils ont conduit deux voitures et les ont fait exploser à l'approche des camions militaires\n\nL'attentat a détruit plusieurs camions militaires sous l'effet de souffle et a fait plusieurs victimes parmi les soldats afghans ; les militants impliqués ont toutefois été tués sur le coup par leurs propres bombes."
 AFG_taliban_attack.8.a: "Comment l'armée afghane a-t-elle pu laisser faire ?"
 AFG_taliban_attack.9.t: "Les talibans visent les troupes étrangères"
 AFG_taliban_attack.9.d: "Aujourd'hui, un militant taliban déguisé en habitant s'est discrètement approché d'un convoi de troupes étrangères envoyées dans notre pays et a fait exploser une bombe cachée dans son turban. Personne n'a été blessé dans la première explosion, mais un autre groupe de militants a profité du chaos pour tirer des roquettes RPG sur les troupes étrangères.\n\nLa situation s'est apaisée à l'arrivée de renforts militaires, mais malheureusement cette attaque a fait de nombreuses victimes et plusieurs véhicules militaires ont été détruits."
 AFG_taliban_attack.9.a: "Mince."
 AFG_taliban_attack.10.t: "Nos militaires tués dans une attaque talibane"
 AFG_taliban_attack.10.d: "Aujourd'hui, un militant taliban déguisé en habitant s'est discrètement approché d'un convoi de troupes étrangères envoyées dans notre pays et a fait exploser une bombe cachée dans son turban. Personne n'a été blessé dans la première explosion, mais un autre groupe de militants a profité du chaos pour tirer des roquettes RPG sur les troupes étrangères.\n\nLa situation s'est apaisée à l'arrivée de renforts, mais malheureusement cette attaque a fait de nombreuses victimes parmi nos militaires et plusieurs véhicules militaires ont été détruits. Notre commandant local a contacté les commandants afghans pour gérer les suites."
 AFG_taliban_attack.10.a: "Présenter nos condoléances aux soldats tombés !"
 AFG_taliban_attack.11.t: "Des troupes étrangères tuées dans une attaque talibane"
 AFG_taliban_attack.11.d: "Aujourd'hui, un militant taliban déguisé en habitant s'est discrètement approché d'un convoi de troupes étrangères envoyées dans notre pays et a fait exploser une bombe cachée dans son turban. Personne n'a été blessé dans la première explosion, mais un autre groupe de militants a profité du chaos pour tirer des roquettes RPG sur les troupes étrangères.\n\nLa situation s'est apaisée à l'arrivée de renforts militaires, mais cette attaque a fait de nombreuses victimes et plusieurs véhicules militaires ont été détruits."
 AFG_taliban_attack.11.a: "Pourquoi ne peuvent-ils pas éliminer les talibans ?"
 AFG_taliban_attack.12.t: "Les talibans lancent des bombardements sur des bâtiments"
 AFG_taliban_attack.12.d: "Aujourd'hui, un immeuble abritant des bureaux d'investisseurs étrangers a été secoué par une énorme explosion ; l'enquête a déterminé que la bombe était probablement constituée d'obus d'artillerie volés ou perdus dans un arsenal de l'Armée nationale afghane. Les talibans ont depuis revendiqué l'attentat.\n\nDes étrangers figurent parmi les morts et nos responsables ont contacté leurs ambassadeurs pour gérer les suites."
 AFG_taliban_attack.12.a: "Cela nuira à notre image nationale !"
 AFG_taliban_attack.13.t: "Nos contractants tués dans un attentat taliban"
 AFG_taliban_attack.13.d: "Aujourd'hui, un immeuble abritant des bureaux de l'un de nos contractants a été secoué par une énorme explosion ; l'enquête a déterminé que la bombe était probablement constituée d'obus d'artillerie volés ou perdus dans un arsenal de l'Armée nationale afghane. Les talibans ont depuis revendiqué l'attentat.\n\nCertains de nos citoyens figurent parmi les victimes et notre ambassadeur en Afghanistan a contacté les autorités afghanes pour gérer les suites."
 AFG_taliban_attack.13.a: "Ils doivent protéger nos investisseurs !"
 AFG_taliban_attack.14.t: "Des étrangers tués dans un attentat taliban contre un immeuble"
 AFG_taliban_attack.14.d: "Aujourd'hui, un immeuble abritant des bureaux de contractants étrangers dans une grande ville d'Afghanistan a été secoué par une énorme explosion ; l'enquête a déterminé que la bombe était probablement constituée d'obus d'artillerie volés ou perdus dans un arsenal de l'Armée nationale afghane. Les talibans ont depuis revendiqué l'attentat.\n\nDes citoyens étrangers figurent parmi les victimes et les autorités afghanes ont contacté les ambassadeurs des pays concernés pour gérer les suites."
 AFG_taliban_attack.14.a: "Pourquoi un pays investirait-il en Afghanistan ?"
 AFG_taliban_attack.15.t: "Les talibans bombardent l'aéroport"
 AFG_taliban_attack.15.d: "Aujourd'hui, l'un de nos aéroports à usage mixte a été frappé par une voiture piégée lorsqu'un camion chargé d'explosifs a enfoncé la barrière d'entrée et a fait détoner le dispositif. L'explosion a gravement endommagé le terrain d'aviation en raison de la très forte charge. Peu après les premiers rapports, le réseau Haqqani, branche la plus radicale des talibans, a revendiqué l'attaque.\n\nL'attentat a fait un grand nombre de victimes parmi le personnel au sol et les passagers dans le terminal. Nos services de sécurité ont été pris totalement au dépourvu, et le public demande comment un camion chargé d'explosifs a pu atteindre les portes d'un aérodrome gardé."
 AFG_taliban_attack.15.a: "Les terroristes talibans doivent être traqués !"
 AFG_taliban_attack.16.t: "Attaque majeure contre un aéroport en Afghanistan"
 AFG_taliban_attack.16.d: "Aujourd'hui, l'un des aéroports à usage mixte d'Afghanistan a été frappé par une voiture piégée lorsqu'un camion chargé d'explosifs a enfoncé la barrière d'entrée et a fait détoner le dispositif. L'explosion a gravement endommagé l'aéroport en raison de la très forte charge. Peu après les rapports, le réseau Haqqani, branche la plus radicale des talibans, a revendiqué l'attaque.\n\nL'attentat a fait un grand nombre de victimes, mais aucun citoyen [ROOT.GetAdjective] en Afghanistan n'est signalé tué ou blessé. Notre dirigeant [ROOT.GetLeader] a présenté ses condoléances à [AFG.GetLeader] et a vivement condamné les actes des talibans."
 AFG_taliban_attack.16.a: "L'insurrection talibane a atteint un niveau critique !"
 AFG_news.17.t: "Soulèvement anti-taliban en Afghanistan"
 AFG_news.17.d: "Après l'opération Enduring Freedom, Hérat connaît une vague de résistance alors que des milices locales, aidées par les États-Unis et l'Iran, défient le contrôle taliban. Des scènes de joie remplissent les rues tandis que les milices s'emparent de zones clés et s'alignent sur l'Alliance du Nord. Le « Lion de Hérat » Mohammad Ismaïl Khan offre l'amnistie aux anciens combattants talibans, tout en les mettant en garde contre de futures hostilités. Ces soulèvements marquent un tournant dans la lutte de l'Afghanistan pour la stabilité."
 AFG_news.17.a: "Un tournant intéressant"
 AFG_events.27.t: "Rôle des femmes"
 AFG_events.27.d: "Bien que le rôle des femmes dans notre société puisse sembler peu conventionnel, l'État a diverses idées sur la manière d'avancer."
 AFG_events.27.a: "Elles devraient jouer un rôle plus traditionnel"
 AFG_events.27.b: "Donnons-leur un rôle"
 AFG_events.28.t: "Rôle de la religion"
 AFG_events.28.d: "Le rôle de la religion et la question de savoir si l'Afghanistan doit s'ouvrir ou maintenir sa stricte adhésion à l'islam sunnite restent un sujet controversé."
 AFG_events.28.a: "Nous resterons fermés"
 AFG_events.28.b: "Nous devrions nous ouvrir"
 AFG_events.35.t: "Pont aérien vers l'Alliance du Nord"
 AFG_events.35.d: "Au milieu du conflit afghan, la Russie se trouve mêlée aux affaires de la région. Depuis 1996, le gouvernement russe soutient discrètement l'Alliance du Nord, fournissant armes et ravitaillement pour renforcer la résistance du gouvernement afghan destitué. Ce soutien naît de la crainte que le conflit ne s'étende en Asie centrale, comme précédemment avec l'OTU lors de la guerre civile tadjike. Désormais, le ministre de la Défense Ivanov ayant révélé l'ampleur de cette aide, la direction russe doit décider : persister à aider l'Alliance du Nord malgré la pression économique, ou retirer tout soutien."
 AFG_events.35.a: "Demander aux États-Unis de prendre en charge le coût"
 AFG_events.35.b: "Nous pouvons assumer le coût"
 AFG_events.35.c: "Couper le flux d'aide"
 AFG_events.36.t: "L'Alliance du Nord afghane ouverte à l'accueil de drones"
 AFG_events.36.d: "Avec les attentats de 1998 contre les ambassades américaines et les frappes de missiles américaines contre les camps d'entraînement d'al-Qaïda en Afghanistan, les États-Unis ont intensifié leurs efforts pour démanteler les réseaux terroristes, notamment en exigeant la reddition d'Oussama ben Laden. Une réunion des plus hauts responsables de la sécurité nationale a convenu que les talibans se verraient présenter un ultimatum pour livrer ben Laden. Malgré une réticence antérieure à collaborer avec l'Alliance du Nord, une occasion d'action conjointe s'ouvre désormais pour retracer le lieu où se trouve ben Laden."
 AFG_events.36.a: "Déployer des drones de surveillance "
 AFG_events.36.b: "Nous avons déjà fixé l'objectif"
 AFG_events.37.t: "Soutien accru à l'Alliance du Nord afghane"
 AFG_events.37.d: "Alors que le conflit fait rage en Afghanistan, l'Alliance du Nord a besoin d'un soutien accru pour combattre les talibans et al-Qaïda. L'aide clandestine de l'Inde a été cruciale, fournissant fonds, matériel radar, pièces d'avion et assistance technique pour l'entretien des chasseurs. Les conseillers militaires indiens étant précieux contre les talibans, leur aide est devenue indispensable aux soldats de [AFG.GetLeader]."
 AFG_events.37.a: "L'élimination des proxys pakistanais est nécessaire."
 AFG_events.37.b: "Nous ne souhaitons pas poursuivre ce processus."
 AFG_events.38.t: "Du matériel de pont aérien russe arrive en Afghanistan"
 AFG_events.38.d: "Du matériel militaire russe, armes, ravitaillement et véhicules, a commencé à arriver en Afghanistan par pont aérien. L'arrivée de cet équipement ouvre une nouvelle brèche dans la guerre."
 AFG_events.38.a: "Bonne nouvelle"
 AFG_events.39.t: "Accord américain pour un soutien par drones"
 AFG_events.39.d: "Les États-Unis ont approuvé la demande de soutien par drones pour viser les camps d'entraînement d'al-Qaïda et pister Oussama ben Laden. Nous pouvons désormais utiliser le renseignement pour coordonner nos efforts avec les forces américaines."
 AFG_events.39.a: "Bonne nouvelle"
 AFG_events.40.t: "Le soutien indien se poursuit"
 AFG_events.40.d: "L'Afghanistan reçoit le soutien de l'Inde, notamment des fonds, du matériel radar, des pièces d'avion et des conseillers militaires."
 AFG_events.40.a: "Super."
 AFG_events.41.t: "Demande d'assistance rejetée"
 AFG_events.41.d: "Malgré nos efforts pour obtenir un soutien supplémentaire, la demande d'aide a été rejetée. Nous devrons nous appuyer sur les ressources existantes."
 AFG_events.41.a: "Décevant"
 AFG_events.42.t: "La Russie demande que nous payions la facture"
 AFG_events.42.d: "La Russie n'est pas disposée à couvrir les coûts du coûteux pont aérien destiné à ravitailler l'Alliance du Nord en Afghanistan. M. Ivanov a sollicité l'aide des États-Unis, et des discussions ont également eu lieu avec des responsables britanniques de la défense. Les États-Unis doivent décider s'ils aident la Russie dans cette opération."
 AFG_events.42.a: "Nous pouvons le faire"
 AFG_events.42.b: "nous ne pouvons pas"
 AFG_news.18.t: "Demande russe aux États-Unis de financer le pont aérien vers l'Afghanistan"
 AFG_news.18.d: "La demande russe d'aide au financement du pont aérien destiné à ravitailler l'Alliance du Nord en Afghanistan a été accueillie par les moqueries de la communauté internationale. Malgré leur puissance militaire, la réticence de la Russie à payer a attiré les critiques, beaucoup s'interrogeant sur leur engagement. Certains ont même suggéré que la Russie revoie ses priorités et s'occupe de ses propres maux économiques. Les livraisons ont commencé à affluer en Afghanistan fin septembre, munitions et matériel militaire étant acheminés via des ponts flottants construits par la 201e division russe sur le Piandj, qui sépare le Tadjikistan de l'Afghanistan, selon la Nezavissimaya Gazeta."
 AFG_news.18.a: "Où est passé tout l'argent ?"
 AFG_news.18.c: "L'aigle viendra-t-il encore une fois au secours de l'ours blessé ?"
 AFG_news.18.b: "Euh en fait"
 AFG_news.19.t: "Les États-Unis déploient des drones Predator en Afghanistan"
 AFG_news.19.d: "Les États-Unis ont déployé des drones Predator en Afghanistan pour viser les bastions terroristes d'al-Qaïda. Cette escalade inaugure un nouvel âge de présence militaire américaine dans la région. Les drones devraient fournir renseignement et surveillance, renforçant les opérations militaires américaines dans le pays."
 AFG_news.19.a: "Intéressant"
 AFG_news.20.t: "Discours de [AFG.GetLeader] au Parlement européen"
 AFG_news.20.d: "Lors de la conférence de presse au Parlement européen, [AFG.GetLeader] a exhorté les dirigeants mondiaux à faire pression sur le Pakistan concernant son soutien aux talibans et a demandé une aide humanitaire pour soulager les souffrances du peuple afghan. Cet appel s'accompagne aussi d'un avertissement sur une attaque prévue par al-Qaïda contre des nations occidentales."
 AFG_news.20.a: "Cela pourrait être préoccupant"
 AFG_news.21.t: "Dostoum se joint aux plans d'assaut sur Mazâr-e Charîf"
 AFG_news.21.d: "Le retour de Dostoum en Afghanistan depuis l'exil a été saisi comme une occasion de reprendre Mazar-e Charif. Désormais, aux côtés du commandant Ahmad Shah Massoud, d'Ismaïl Khan et de Mohammad Mohaqiq, il prépare une offensive contre la ville de Mazar-e Charif tenue par les talibans. \n\nDostum, à l'origine commandant de l'unité militaire 374 des forces communistes du PDPA, avait fait défection vers les moudjahidines après la chute de Kaboul en 1992. Il établit alors son proto-État à Mazar-e Charif, communément appelé Zone autonome du Nord. Il imprimait sa propre monnaie et exploitait même sa propre compagnie aérienne, Balkh Air.\n\nAprès avoir brièvement perdu Mazar-e Charif aux talibans, Dostoum revint d'exil en octobre 1997 pour reprendre le contrôle. Malgré ses efforts, les talibans revinrent en 1998, poussant Dostoum à fuir une nouvelle fois vers la Turquie."
 AFG_news.21.a: "Voyons ce qui se passe."
 AFG_events.45.t: "Mahmoud Surkha a fait défection vers les talibans"
 AFG_events.45.d: "Le commandant Mahmoud Surkha a fait défection vers les talibans, invoquant son mécontentement face à l'ingérence russe dans la guerre. [AFG.GetLeader] nie l'allégation mais affirme avoir le droit de chercher un soutien international en tant que gouvernement de facto reconnu de l'Afghanistan."
 AFG_events.48.t: "Défauts d'Abdallah Jan Wahidi"
 AFG_events.48.d: "Haji Abdul Qadeer a admis que l'un de leurs commandants clés, Abdallah Jan Wahidi, avait fait défection vers les talibans."
 AFG_events.48.a: "Nous n'y pouvons rien"
 AFG_events.44.t: "Ismaïl Khan s'échappe de la prison de Kandahar"
 AFG_events.44.d: "Ismaïl Khan, ancien gouverneur de Hérat et chef de la résistance au régime taliban, s'évade de prison à Kandahar. \nKhan peut être considéré comme l'un des chefs moudjahidines les plus respectés de l'insurrection contre les Soviétiques. En 1992, les troupes moudjahidines prirent Hérat et Ismaïl Khan en devint gouverneur. En 1995, il défendit la ville contre les talibans avec Ahmad Shah Massoud. Khan passa même à l'offensive vers le bastion taliban de Kandahar, mais fut repoussé. Tout changea lorsque le général Abdul Rashid Dostoum attaqua Hérat, forçant Ismaïl Khan et ses 8 000 hommes à fuir en Iran avant que les talibans n'envahissent la province. Deux ans plus tard, alors qu'il organisait la résistance aux talibans dans la région de Faryab, il fut trahi et capturé par Abdul Majid Rouzi, qui avait fait défection vers les talibans avec Abdul Malik Pahlawan, alors l'un des adjoints de Dostoum."
 AFG_events.44.a: "Tenter le sort une fois de plus"
 AFG_events.45.a: "Que pouvons-nous y faire de toute façon"
 AFG_events.65.t: "L'Afghanistan appelle au soutien"
 AFG_events.65.d: "Face à un matériel et des ressources en berne, l'Afghanistan nous demande urgemment d'envoyer des opérateurs pour former les combattants afghans locaux et leur fournir l'équipement et les véhicules nécessaires, afin qu'ils puissent combattre les talibans de façon autonome, réduisant ainsi le besoin d'intervention militaire directe"
 AFG_events.65.a: "Oui, nous le ferons"
 AFG_events.65.b: "Non, nous ne le ferons pas"
 AFG_events.66.t: "Ils acceptent"
 AFG_events.66.d: "Les États-Unis ont accepté la demande et déploieront des conseillers ainsi que du matériel pour aider l'Afghanistan dans sa lutte contre les talibans, marquant une étape importante pour renforcer les forces afghanes et la coopération contre l'insurrection et pour stabiliser la région."
 AFG_events.66.a: "Nous serons en mouvement"
 AFG_border_wars.1.t: "[event_target:AFG_ATTACKER.GetName] remporte la guerre frontalière"
 AFG_border_wars.1.d: "[event_target:AFG_ATTACKER.GetName] a gagné la guerre frontalière contre [event_target:AFG_DEFENDER.GetName] et a avancé sur de nouvelles terres. Ils sont susceptibles de poursuivre leur offensive ensuite."
 AFG_border_wars.1.a: "Huzzah !"
 AFG_border_wars.1.b: "Mince."
 AFG_border_wars.1.c: "Intensifier!"
 AFG_border_wars.2.t: "[event_target:AFG_ATTACKER.GetName] perd la guerre frontalière"
 AFG_border_wars.2.d: "[event_target:AFG_ATTACKER.GetName] a perdu la guerre frontalière contre [event_target:AFG_DEFENDER.GetName]."
 AFG_border_wars.2.a: "Huzzah !"
 AFG_border_wars.2.b: "Mince."
 AFG_border_wars.3.t: "Les talibans se préparent à entrer dans les zones tribales"
 AFG_border_wars.3.d: "Les talibans prévoient de s'installer dans les zones tribales, principalement le Waziristan du Nord et la région de Parachinar. Un négociateur taliban nous a informés de leurs plans, et ils espèrent que nous les laisserons y rester pour une « période temporaire ». La région est assez insignifiante dans le grand schéma des choses, mais c'est tout de même une perte de territoire et l'incursion de terroristes radicaux dans le pays."
 AFG_border_wars.3.a: "Tant qu'ils sont utiles, ils peuvent rester"
 AFG_border_wars.3.b: "Absolument pas"
 AFG_border_wars.4.t: "Le Pakistan condamne les plans d'entrée dans les zones tribales"
 AFG_border_wars.4.d: "Le gouvernement pakistanais nous a récemment contactés pour exprimer son mécontentement à l'idée que des forces talibanes restent dans les régions du Waziristan du Nord et de Parachinar. Ce n'est pas une surprise, mais c'est un obstacle de plus dans nos efforts pour reprendre l'Afghanistan."
 AFG_border_wars.4.a: "Bien"
 AFG_border_wars.4.b: "Au diable leurs objections !"
 AFG_border_wars.5.t: "Le Pakistan autorise le mouvement vers les zones tribales"
 AFG_border_wars.5.d: "Le gouvernement pakistanais a indiqué qu'il ignorerait notre mouvement vers les régions du Waziristan du Nord et de Parachinar. Nous pouvons donc continuer à étendre nos opérations et améliorer nos chances si une grande offensive afghane commence."
 AFG_border_wars.5.a: "Bien."
 AFG_border_wars.6.t: "Les talibans nous ignorent"
 AFG_border_wars.6.d: "Les talibans ont ignoré nos objections à leurs récents mouvements vers le Waziristan du Nord et Parachinar. Il semble que nous n'ayons d'autre choix que d'employer la force pour leur apprendre que l'on ne nous piétine pas."
 AFG_border_wars.6.a: "Ce sont eux qui ont commencé"
 AFG_border_wars.7.t: "Les forces armées afghanes remportent la victoire"
 AFG_border_wars.7.d: "Après une escarmouche avec les talibans, les forces armées afghanes ont remporté une victoire. Cette bataille est présentée comme une victoire nationale par [AFG.GetLeader]."
 AFG_border_wars.7.a: "Allahu-Akbar !"
 AFG_border_wars.7.b: "Inshallah, la victoire viendra"
 AFG_border_wars.8.t: "Les forces talibanes remportent la victoire"
 AFG_border_wars.8.d: "Après une escarmouche avec l'Armée nationale afghane, les forces talibanes ont remporté une victoire. Cette bataille est présentée comme une victoire talibane par [TAL.GetLeader]."
 AFG_border_wars.8.a: "Allahu-Akbar !"
 AFG_border_wars.8.b: "Inshallah, la victoire viendra"
 AFG_border_wars.9.t: "Résultats peu concluants après l’escarmouche taliban-afghane"
 AFG_border_wars.9.d: "Un front figé a été observé par les forces internationales après une escarmouche entre talibans et Armée nationale afghane. Les deux camps auraient ralenti leurs attaques et se seraient repliés sur leurs positions d'avant l'escarmouche."
 AFG_border_wars.9.a: "D'accord"
 AFG_uzbek_bombing_of_the_imu: "Campagne de bombardement ouzbèke"
 AFG_uzbek_bombing_of_the_imu_desc: "Des appareils ouzbeks frappent les camps du Mouvement islamique d'Ouzbékistan de l'autre côté de la frontière nord. Les raids émoussent la défense aérienne talibane et réduisent la vigueur de leurs offensives tant que Tachkent continue de voler."
 AFG_uzbek_bombing_of_the_imu_tt: "§Campagne de bombardement en Youzbek :§!"
