 USA_anduril_industries_arsenal_one: "Línea de producción Arsenal-1"
 usa_economic_events.406.t: "Cuatro días en noviembre"
 usa_economic_events.406.d: "La junta directiva de OpenAI destituyó a Sam Altman un viernes e informó a Microsoft apenas unos minutos antes de hacerlo público, con trece mil millones de dólares y toda la hoja de ruta de los modelos sentados al otro lado de la mesa. Para el lunes, casi todos los empleados de OpenAI habían firmado una carta amenazando con marcharse con él, y los directores que lo despidieron se vieron obligados a negociar las condiciones de su propio reemplazo. La lectura comercial en Redmond es que un socio cuya gobernanza corporativa puede hacer esto sin previo aviso no es un socio en absoluto; la contralectura es que la carta demostró que el activo real es el personal y no los estatutos de fundación, y al personal se le puede contratar."
 usa_economic_events.406.a: "Respaldar su restitución y asumir un asiento en la junta directiva"
 usa_economic_events.406.b: "Contratar a Altman y a los firmantes en Redmond"
 usa_economic_events.500.t: "La propuesta de las torres fronterizas"
 usa_economic_events.500.d: "Anduril Industries, fundada este año en el condado de Orange por Palmer Luckey y un puñado de antiguos alumnos de Palantir, afirma que puede vigilar un tramo de la frontera con torres autónomas y un único software, en lugar de recurrir a un contrato de integración de una década. El último intento exacto de hacer eso, el SBInet, se canceló en 2011 tras costar mil millones de dólares. Anduril propone construir las torres primero y venderlas después, lo cual no coincide con la forma en que el departamento suele comprar sus suministros."
 usa_economic_events.500.a: "Financiar las torres y permitirles construir primero"
 usa_economic_events.500.b: "Mantener la vigilancia fronteriza dentro del programa oficial registrado"
 usa_economic_events.501.t: "Más barato que el objetivo"
 usa_economic_events.501.d: "Están apareciendo drones pequeños sobre las bases y la respuesta actual es un misil superficie-aire que cuesta más que todo lo que derriba. El Anvil de Anduril es un dron diseñado para embestir a otros drones, y Lattice es el software que los localiza. Comprar eso significa aceptar un interceptador que nadie ha certificado contra una amenaza que las fuerzas militares aún no se han puesto de acuerdo en cómo catalogar."
 usa_economic_events.501.a: "Comprar el interceptador barato"
 usa_economic_events.501.b: "Responder a los drones con la defensa aérea por capas que ya financiamos"
 usa_economic_events.502.t: "Comprar la fábrica o comprar las piezas"
 usa_economic_events.502.d: "Anduril ha adquirido Area-I y sus sistemas lanzados Altius, y quiere poseer las estructuras, el entorno de autonomía y las líneas de producción en lugar de integrar los de otras personas. La integración vertical es precisamente la única forma en que puede competir en precios contra los contratistas principales tradicionales. También significa que una startup de defensa está solicitando ser financiada como fabricante antes de haber fabricado nada en grandes volúmenes."
 usa_economic_events.502.a: "Respaldar a Anduril como fabricante"
 usa_economic_events.502.b: "Mantenerla como un integrador que compra a la base de suministro existente"
 usa_economic_events.503.t: "Ucrania recibe la entrega"
 usa_economic_events.503.d: "Las municiones merodeadoras Altius-600 y el kit antidrones de Anduril están entrando en Ucrania dentro de los paquetes de asistencia por decreto presidencial, y las unidades que los utilizan están informando de los resultados más rápido de lo que podría hacerlo cualquier campo de pruebas estadounidense. Enviar volumen al este compra datos de combate que nadie más tiene. También consume un inventario para el cual las fuerzas militares aún no han terminado de redactar una doctrina."
 usa_economic_events.503.a: "Enviar volumen a Ucrania y recopilar los datos"
 usa_economic_events.503.b: "Retener las existencias para las unidades estadounidenses"
 usa_economic_events.504.t: "Un caza sin un contratista principal tradicional"
 usa_economic_events.504.d: "La Fuerza Aérea ha seleccionado a Fury de Anduril y a General Atomics para la primera fase de las Aeronaves de Combate Colaborativas (CCA), dejando fuera a Lockheed Martin, Boeing y Northrop Grumman. Una empresa que no existía hace una década está construyendo ahora un avión de combate. Los contratistas principales tradicionales argumentan que no se puede matar de hambre a la base industrial que construye todo lo demás solo para demostrar un punto sobre la contratación pública."
 usa_economic_events.504.a: "Permitir que el recién llegado asuma el programa"
 usa_economic_events.504.b: "Mantener a los contratistas principales establecidos al frente del programa"
 usa_economic_events.505.t: "En lo que se convirtió Anduril"
 usa_economic_events.505.d: "Una década de torres, interceptadores, fábricas y un avión de combate ha definido lo que es Anduril y lo que cambió en la forma en que Estados Unidos compra armas: si el arsenal es de propiedad o se alquila, y si los contratistas principales tradicionales siguen interponiéndose entre el Pentágono y la gente que construye."
 usa_economic_events.505.a: "Un arsenal de nuestra propiedad absoluta"
 usa_economic_events.505.b: "Un arsenal mercantil que vende a cualquiera que cumpla los requisitos"
 usa_economic_events.505.c: "Un contratista principal de software con fábricas ajenas"
 usa_economic_events.505.e: "Un proveedor más financiado por capital de riesgo"
 USA_anduril_autonomous_arsenal: "Arsenal autónomo"
 USA_anduril_autonomous_arsenal_desc: "Anduril construye sus propias estructuras, autonomía y líneas de producción en suelo estadounidense, y el Pentágono compra sistemas terminados en lugar de programas de integración. La capacidad de producción que pertenece al país no puede ser renegociada en precio por un proveedor."
 USA_anduril_merchant_arsenal: "Arsenal mercantil"
 USA_anduril_merchant_arsenal_desc: "Anduril es propietaria de las fábricas pero vende a todos los compradores cualificados, tanto aliados como nacionales. El volumen mantiene las líneas operativas y las relaciones de exportación abiertas, a costa de cualquier reclamación sobre la prioridad de suministro."
 USA_anduril_software_prime: "Contratista principal de software"
 USA_anduril_software_prime_desc: "Anduril ganó los programas sin ser propietaria de las plantas, por lo que Lattice y el entorno de autonomía se ejecutan sobre hardware construido por otras personas. Es rápido y barato, y depende de proveedores que responden ante sus propios accionistas."
 USA_anduril_venture_supplier: "Proveedor financiado por riesgo"
 USA_anduril_venture_supplier_desc: "Anduril sigue siendo un proveedor entre muchos, vendiendo componentes dentro de programas que los contratistas principales establecidos continúan liderando. La ingeniería es real; la capacidad de influencia no lo es."
