 HON_infantry_weapons_3_desc: "Разработка винтовки M16A2 была первоначально запрошена Корпусом морской пехоты США по итогам боевого опыта во Вьетнаме с XM16E1 и M16A1. Она была официально принята на вооружение Министерством обороны под обозначением «Винтовка США калибра 5,56 мм, M16A2» в 1982 году. Морская пехота стала первым видом Вооружённых сил США, принявшим её на вооружение, в начале/середине 1980-х годов, а Армия США последовала её примеру в конце 1980-х."
