l_korean:
 japan_classic.15.t: "오부치 게이조, 뇌졸중으로 쓰러지다"
 japan_classic.15.d: "자민당과 일본 국민의 충성스러운 신하인 오부치 게이조는 1998년 참의원 선거에서 자민당이 패배하고 하시모토 류타로가 사임한 후 1998년 7월 30일부터 일본 총리를 맡아 왔습니다.\n오부치 게이조는 침착하고 유능하며 유능한 것으로 묘사되었지만 그의 갑작스러운 건강 악화를 목격한 사람은 거의 없었습니다. 2000년 4월 1일, 오부치는 뇌졸중으로 쓰러져 병원으로 실려갔습니다."
 japan_classic.15.o1: "좋은 일만 있길 바라자."
 japan_classic.16.t: "모리 요시로가 총리직에 취임"
 japan_classic.16.d: "Following the stroke suffered by then-Prime Minister Keizō Obuchi, senior members of the Liberal Democratic Party convened a closed-door meeting of five key figures and selected Yoshirō Mori as his successor in order to avoid a power vacuum.\n\nThe transition took place without any formal explanation to the public, prompting a wave of criticism from the public accusing the government of \"backroom politics\" and \"excluding the people from leadership decisions.\" As a result, the Mori administration faced strong headwinds from the very start.\n\nAll eyes are now on Yoshirō Mori's leadership and whether he can regain the public's trust."
 japan_classic.16.o1: "권력 공백을 막는 것이 유일한 우선순위였다."
 japan_classic.18.t: "모리 요시로의 정치적 실수"
 japan_classic.18.d: "2000년 5월 15일 모리 요시로 신임 총리는 공식적으로 자국을 \"천황을 중심으로 한 신국\"이라고 언급하면서 그의 임기 최초로 부정적인 헤드라인을 장식했습니다. 야당과 여당인 자민당의 관점에서 이것은 일본의 민주주의 이상과 군주제의 역할에 의문을 제기하는 것과 마찬가지입니다.\n수상에 대한 국민 지지율이 하락했습니다."
 japan_classic.18.o1: "바보 같으니라고!"
 japan_classic.18.o2: "그의 진술을 두 배로 줄여라."
 japan_focus: "일본 중점 계통도"
 Japan.3.t: "새 시대의 여명"
 Japan.3.d: "The Emperor, the symbol of Japan, is abdicating and a new Emperor is ascending the throne, an exceptionally rare national turning point in modern Japan. With Emperor Akihito's abdication, Crown Prince Naruhito will ascend as the 126th Emperor, and the era name will be renewed.\n\nSeveral years ago, Emperor Akihito's words about his duties came as a surprise to many people. At first, shock and uncertainty spread, but through debate and the necessary procedures, preparations for the ceremonies steadily moved forward.\n\nAnd now, after solemn rites, the \"Heisei\" era comes to an end and \"Reiwa\" begins. The political system will not change directly. However, the nation's atmosphere will clearly shift, likely influencing social cohesion and public expectations of the government."
 Japan.3.a: "새로운 시대를 조용히 맞이합시다."
 Japan.8.t: "중국이 센카쿠 열도를 요구하다!"
 Japan.8.d: "중국은 센카쿠 열도 영유권을 놓고 우리와 다시 분쟁을 벌이고 있습니다. 만약 우리가 중국의 요구에 굴복한다면, 중국은 우리의 외교 정책에 영향력을 행사할 수 있다는 자신감을 얻게 될 뿐 아니라, 우리 국민 중 민족주의 성향이 강한 사람들 사이에서 우리의 인기가 떨어질 수도 있습니다. 하지만 거부할 경우의 결과 또한 우리에게 유리하게 작용할 것 같지는 않습니다."
 Japan.8.a: "그들에게 어업권을 주도록 하세요..."
 Japan.8.b: "일본은 굴복하지 않는다!"
 Japan.4.t: "일본이 섬들을 넘겨주었다!"
 Japan.4.d: "일본은 우리의 주장이 정당하다는 것을 명확히 인정하고 센카쿠 열도를 정당한 소유자인 우리에게 반환했습니다."
 Japan.4.a: "어쩌면 일본인들에게도 나름의 지혜가 있는지도 모르겠다!"
 Japan.5.t: "일본은 여전히 ​​저항하고 있다!"
 Japan.5.d: "일본은 여전히 ​​우리의 숙적으로 남겠다는 의지가 확고한 것이 분명하다."
 Japan.5.a: "그들은 이를 후회할 것이다"
 Japan.6.t: "중국 전투기가 우리가 요격하려고 출격시킨 항공기를 공격했습니다!"
 Japan.6.d: "우리 전투기들은 중국의 영공 침범에 정기적으로 대응해 왔으며, 대개는 별다른 사건 없이 대응해 왔습니다. 그러나 이번에는 우리 전투기들이 중국군의 공격을 받아 조종사 여러 명이 사망하고 항공기 여러 대가 손실되었습니다. 최근 중국의 행보를 고려할 때, 이번 사건이 고의적인 도발이었는지 아니면 불행한 사고였는지 평가하고 그에 따라 대응 방안을 결정해야 합니다."
 Japan.6.a: "우리는 자기방어권을 가지고 있다!"
 Japan.6.b: "우리는 우리를 보호해 줄 자들에게 도움을 요청해야 합니다!"
 Japan.6.c: "이건 아마 사고였을 거예요..."
 Japan.7.t: "중국과 일본 전투기, 공중전 벌여"
 Japan.7.d: "동중국해에서 중국과 일본 항공기 간의 충돌로 분쟁이 격화되었습니다. 보도에 따르면, 이번 충돌은 일본 전투기가 일본 영공에서 중국 전투기를 요격하기 위해 출격하면서 시작되었습니다. 과거 유사 사례에서 중국 측이 후퇴했던 것과는 달리, 이번에는 일본 항공기가 공격을 받아 여러 명의 일본 조종사가 사망하고 다수의 일본 항공기가 격추되었습니다.[JAP.GetLeader]는 이번 사건을 강력히 규탄했으며, 일본 정부의 대응 방안을 놓고 비공개 긴급 회담을 진행 중인 것으로 알려졌다."
 Japan.7.a: "제3차 중일전쟁이 임박한 것일까?"
 idea_JAP_emperor_naruhito: "나루히토 천황"
 idea_JAP_emperor_naruhito_desc: "Naruhito was born on 23 February 1960, son of Akihito and Michiko Shōda. He studied at many prestigious schools around Japan and is said to have had a joyful childhood, also studying at Oxford University."
