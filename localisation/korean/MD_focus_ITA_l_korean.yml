 italy_md.71.t: "§t마피아§!와의 전쟁의 패배"
 italy_md.71.d: "2년간의 급습, 도청, 그리고 방송으로 중계된 체포에도 불구하고 조직들은 무너지지 않았습니다. 갈취 수익은 작전이 시작되었을 때보다 오히려 높아졌고, 증인들은 공개 법정에서 증언을 번복하고 있으며, 팔레르모와 레조칼라브리아의 검사들은 시의회 전체가 조용히 다시 장악되었다고 보고하고 있습니다. 내무부는 체면을 살리기 위해 '방식의 전환'에 관한 성명을 작성했지만, 로마의 모든 이는 그것이 무엇을 의미하는지 이해하고 있습니다. 국가는 싸움을 멈추었고, 그 가문들도 이를 알고 있습니다."
 italy_md.71.o1: "이번 판은 우리가 졌다."
 ITA_mafia_unchallenged: "도전받지 않는 §t마피아§!"
 ITA_mafia_unchallenged_desc: "반마피아 운동은 조직 하나 해체하지 못한 채 포기되었습니다. 남부의 업체들은 법원을 믿기보다 다시 피초를 내고 있고, 투자자들은 모든 계약에 보호비 갈취 비용을 반영하며, 가문들을 무너뜨리겠다고 약속했던 정당들은 설득력을 잃었습니다."
 ITA_decrease_police_effectivness_TT: "이로 인해 경찰의 실효성이 감소합니다."
 ITA_resume_war_on_mafia: "§t마피아§!와의 전쟁 재개"
 ITA_resume_war_on_mafia_desc: "새로운 반마피아 검사, 새로운 의회 다수파, 그리고 피초에 지친 국민은 우리에게 두 번째 기회를 줍니다. 운동을 재개한다는 것은 우리가 방치해 약화시킨 경찰 부대를 재건하고, 첫 번째 시도가 실패했음을 인정하는 정치적 대가를 받아들이는 것을 의미합니다. §Y이전 운동이 붕괴한 지 2년 후에 실행할 수 있습니다.§!"
