l_korean:
 Cascadia_focus: "캐스케이디아 중점 계통도"
 CAS_focus_olympia_rises: "올림피아의 부상"
 CAS_focus_olympia_rises_desc: "시애틀이 지나치게 개발된 탓에 워싱턴주의 주도가 새로운 국가 수도가 될 것입니다. 어쨌든 올림피아라는 이름은 어감이 좋습니다."
 CAS_focus_stabilization_of_washington: "워싱턴의 안정화"
 CAS_focus_stabilization_of_washington_desc: "우리나라의 연방 수도를 확립했으니, 이제 수도가 자리한 주를 안정시키는 일을 시작할 수 있습니다. 인프라와 기본적인 경제 활동을 정비하면 일종의 사회적 결속이 회복될 것이며, 이는 곧이어 투자하고 더 나은 통합 노력으로 나아갈 수 있게 해 줄 것입니다."
 CAS_focus_the_new_home: "새로운 보금자리"
 CAS_focus_the_new_home_desc: "경제적 안정이 이루어졌고 그 값어치가 얼마인지는 몰라도, 사회 구조의 외양을 갖추려는 국민의 결속된 노력도 이루어졌습니다. 이제 워싱턴주 전역에 민간 및 응급 서비스를 도입하는 과정을 시작하고, 대륙의 이 잔여 한구석을 우리의 새로운 보금자리라 부르기 시작할 수 있습니다."
 CAS_focus_our_oregon_trail: "우리의 오리건 트레일"
 CAS_focus_our_oregon_trail_desc: "원주민과 개척민은 대륙의 절반을 가로질러 이동해야 했지만, 우리는 이제 남쪽으로 이동하여 이웃한 오리건주 영토의 재건을 시작해야 합니다. 이곳 워싱턴에 기지를 마련했으니 비교적 짧은 시간 안에 그들을 복구할 수 있을 것입니다."
 CAS_focus_another_pacific_gem: "또 하나의 태평양 보석"
 CAS_focus_another_pacific_gem_desc: "경제와 사회 기능이 회복되었으니, 오리건주를 우리의 출발점에 묶어 줄 민간 및 응급 서비스를 연결하고 구축하기 시작할 수 있습니다. 비록 조금씩이지만 미래는 갈수록 밝아집니다."
 CAS_focus_i_dont_know: "모르겠는데요?"
 CAS_focus_i_dont_know_desc: "아니, 아이다호라고 했잖습니까. 물론 그 주의 상태를 알 리가 없었습니다. 주의 대부분을 빌어먹을 산맥이 통째로 뒤덮고 있으니까요. 어쨌든 우리는 광업과 기타 경제 활동 같은 것들을 되살려 이 사람들에게 다시 희망을 줄 수 있습니다."
 CAS_focus_mountain_marvel: "산악의 경이"
 CAS_focus_mountain_marvel_desc: "경제, 양호. 국민, 행복. 형편, 그럭저럭 괜찮음. 훌륭합니다. 이제 이 주를 나머지 국가와 연결할 때입니다. 여기서부터 세상 속에서 새롭게 얻은 우리의 위치에서 정확히 무엇을 할지 구상하기 시작할 수 있습니다."
 CAS_focus_a_new_beginning: "새로운 시작"
 CAS_focus_a_new_beginning_desc: "나라가 안정되었으니, 이제 우리가 정확히 무엇을 하고 싶은지 살펴보아야 합니다. 우리의 위치는 유리하지도 불리하지도 않다는 뜻이지만, 대륙의 상황이 다시 뜨거워지기 전에 지금 행동해야 합니다."
 CAS_ideas_domestic_centric_policy: "내치 중심 정책"
 CAS_ideas_domestic_centric_policy_desc: "우리나라는 젊고 약하며 매우 영향을 받기 쉽습니다. 역사 속의 한순간으로 끝나지 않으려면 안정과 성장, 그리고 우리가 삶에서 원하는 미래를 얻을 능력을 보장하기 위해 진정으로 우리 자신에게 집중해야 합니다."
 CAS_ideas_rocky_mountain_resistance: "로키산맥 저항군"
 CAS_ideas_rocky_mountain_resistance_desc: "우리가 만들어 낸 단합에도 불구하고, 로키산맥이라는 거대한 분단선은 서로 가까이 있으면서도 멀리 떨어져 있다고 믿는 자들을 대담하게 만들었습니다. 따라서 아이다호와의 연합은 기껏해야 불안정합니다. 사태가 끓어 넘쳐 감당할 수 없는 문제를 일으키기 전에 이를 처리해야 합니다."
 CAS_ideas_rocky_mountain_crackdowns: "로키산맥 단속"
 CAS_ideas_rocky_mountain_crackdowns_desc: "초기 수사는 순조롭게 진행되었고, 범죄는 줄어들고 있으며, RMR 집단의 조직원도 서서히 감소하고 있습니다."
 CAS_ideas_rocky_mountain_rescue: "로키산맥 구조"
 CAS_ideas_rocky_mountain_rescue_desc: "RMR 조직원은 줄었고 범죄는 사상 최저 수준입니다. 상황은 안정되었으며 날이 갈수록 더 희망적으로 보입니다. 지역 법 집행 기관이 점점 더 많은 작전을 인수하고 있으며 전반적인 통제권도 맡고 있습니다."
 CAS_ideas_cascadian_union: "캐스케이디아 연합"
 CAS_ideas_cascadian_union_desc: "아이다호에 평화가 회복되었으며, 우리의 작은 주 연합은 그 어느 때보다 강력합니다. 이제 RMR의 전술과 조직원을 완전히 처리하고 해산했으니, 우리가 겪은 이 초기의 성장통에서 배우고 개선하여 국민과 나라를 더 낫게 만들 수 있습니다."
 CAS_decisions_war_time_mobilization_category: "전시 동원"
 CAS_decisions_war_time_mobilization_category_desc: "필요가 생기면 최소한 전선의 빈틈을 메울 자원병 군단을 소집할 수 있습니다. 전쟁이 언제 닥칠지는 알 수 없으나, 반드시 닥치리라는 것만은 알고 있기 때문입니다."
 CAS_war_time_mobilization: "제1차 동원"
 CAS_war_time_mobilization_desc: "무기를 들어야 할 때가 왔으며, 우리는 고향을 지키기 위해 총궐기해야 합니다. 무기를 들어라, 캐스캐디아의 사나이들이여!"
 CAS_war_second_wave_defenders: "제2차 방위군"
 CAS_war_second_wave_defenders_desc: "적이 계속 밀고 들어오고 있으므로, 또 한 차례 방위군을 징집해야 합니다. 국민의 사기는 떨어지겠지만 병력이 필요합니다."
 CAS_war_desperate_defenders: "필사의 방위군"
 CAS_war_desperate_defenders_desc: "상황이 암울해지고 있으며, 전선을 지키려면 가용한 모든 인원이 필요합니다. 건강하든 아니든 상관없습니다. 어쩌면, 정말 어쩌면 아직 승리할 수도 있을 것입니다."
 cascadia_event.1.t: "저항 세력의 부상"
 cascadia_event.1.d: "건국 초기부터 아이다호 주는 우리에게 '문제'를 안겨 왔다고 해도 과언이 아닙니다. 세 개 주 가운데 가장 고립된 아이다호에서는 독자적인 주체가 되는 편이 더 안전하고 쉽다고 믿는 사람이 많습니다. 그것이 실현되리라고는 보지 않지만, 선동이 계속되면서 혼돈과 무정부 상태가 지나간 지 얼마 되지 않아 또다시 분쟁이 벌어질 수 있다는 두려움도 커지고 있습니다."
 cascadia_event.1.o1: "한시도 쉴 틈이 없군"
 cascadia_event.2.t: "범죄 급증"
 cascadia_event.2.d: "아이다호 주에 범죄가 급증하고 있습니다. 전반적인 법과 질서를 회복하는 과정에서 생긴 일시적 혼란일 수도 있지만, 이것이 무엇을 의미할지 우려하는 이들이 있습니다. 명확한 증거는 없으나 일부 시민과 장관들까지 상황을 수습하기 위해 특별 수사대를 파견하라고 정부를 압박하고 있습니다."
 cascadia_event.2.o1: "지역 경찰이 처리할 수 있다"
 cascadia_event.2.o2: "RMR 회원 수 자료를 가져오라"
 cascadia_event.3.t: "로키 산맥 행진"
 cascadia_event.3.d: "로키 산맥 저항군으로 알려진 단체가 행진을 조직하기 시작했습니다. 불법적인 점은 없으나 단체의 회원 수가 늘어나면서 올림피아 전역에서 우려가 커지고 있습니다. 이에 중앙 정부는 아이다호 사태에 대한 우려가 계속 커지는 가운데 은밀한 동원을 시작하라는 명령을 내렸습니다."
 cascadia_event.3.o1: "끝이 없구나"
 cascadia_event.4.t: "산사나이의 등장"
 cascadia_event.4.d: "로키 산맥 저항군이 아이다호 주를 장악했으며, 이와 함께 단체의 지도자가 모습을 드러냈습니다. 로버트 \\"산사나이\\" 존슨이라는 뚱뚱한 남자입니다. 겉보기에는 별것 아닌 인물이지만, 그와 그의 단체는 우리 나라의 이 어린 시기에 많은 이들이 피하고 싶어 했던 일을 해냈습니다. 따라서 세계가 이미 시도했을 법한 것 이상으로 우리에게 간섭하기 전에 이 문제를 처리하도록 나라를 동원하여 나서야 합니다."
 cascadia_event.4.o1: "하느님, 우리를 도우소서"
 cascadia_event.5.t: "우리의 진군"
 cascadia_event.5.d: "이 일을 매듭지을 때가 왔습니다. 우리는 산악 지대를 가로질러 진군하여 그토록 갈망해 온 평화를 쟁취할 것입니다."
 cascadia_event.5.o1: "전쟁에 나선다!"
 cascadia_event.300.t: "특별수사대 도착"
 cascadia_event.300.d: "올림피아 정부에 대한 오랜 호소 끝에, 정부는 얼마 전 특별수사대를 아이다호 주에 파견했습니다. 초기 수사에서는 부스러기 같은 단서밖에 나오지 않았습니다. 그러나 시간이 흐르면서 조직적으로 결탁한 범죄 행각이 서서히 드러났고, 곧 RMR 단원들이 해당 범죄 혐의로 구금되어 다행히 체포되었습니다."
 cascadia_event.300.o1: "그래도 뭔가 성과는 있군"
 cascadia_event.301.t: "범죄 감소"
 cascadia_event.301.d: "특별수사대와 지역 법 집행 기관이 범죄 급증에 계속 대응하고 있으며, 무기 절도와 수많은 다른 범죄로 체포되는 RMR 단원이 점점 늘어나고 있습니다. 아이다호 주의 안정이 나아질 기미를 보이면서 회원 수가 줄어들기 시작했고, 많은 이들이 이 사태가 언제쯤 평화롭게 끝날지 궁금해하고 있습니다."
 cascadia_event.301.o1: "가능하면 빨리 끝나길"
 cascadia_event.302.t: "계속되는 노력"
 cascadia_event.302.d: "시간이 지나면서 특별수사대는 자문과 지원 역할로 물러났고, 지역 법 집행 기관이 상황에 대한 작전 통제권을 점점 더 넓게 넘겨받았습니다. 범죄는 계속 줄어들고 있으며 RMR의 회원 수는 사상 최저 수준에 이르렀습니다. 소문에 따르면 \\"산사나이\\"라고만 알려진 그들의 지도자가 앞으로 며칠 안에 연설을 할 예정이라고 합니다. 법과 질서가 대부분 회복된 것으로 보이는 만큼, 이제 주를 떠날 때가 되었는지를 두고 특별수사대 지휘부가 논의 중입니다."
 cascadia_event.302.o1: "시간이 걸렸지만 그만한 가치가 있었다"
 cascadia_event.303.t: "평화 회복"
 cascadia_event.303.d: "오늘 이른 시각, RMR의 지도자가 단체의 공식 해산을 발표했습니다. 많은 단원이 분노했지만 크게 낙담한 나머지 그저 집으로 돌아갔습니다. 지역 법 집행 기관은 범죄가 사상 최저 수준이며 아이다호 주에 안정이 다시 찾아왔다고 밝혔습니다. 이제 우리는 하나의 국가로서 함께 앞으로 나아갈 수 있습니다."
 cascadia_event.303.o1: "마침내 숨 좀 쉬겠군"
 CAS_focus_preparing_for_elections: "선거 준비"
 CAS_focus_preparing_for_elections_desc: "나라가 정당을 조직하고 지정 구역에서 투표를 실시할 수 있을 만큼 충분한 상태에 이르렀습니다. 아이다호의 RMR 문제도 처리했으므로, 이제 첫 공식 전국 선거를 향해 준비를 갖출 차례입니다. 가장 큰 문제는 현재 우리가 어쩐지 선택지가 너무 많은 호사를 누리고 있는 것처럼 보인다는 점입니다. 하지만 더 나쁠 수도 있었습니다."
 CAS_focus_setting_the_stage: "무대 마련"
 CAS_focus_setting_the_stage_desc: "우리 국민이 전국에서 생겨나는 신흥 정당들 사이에서 자신의 목소리를 찾는 동안, 우리는 모두가 준비하고 있는 선거를 실시하고 치를 수 있도록 국가의 인프라와 실제 역량을 준비하고 마련해야 합니다."
 CAS_focus_western_politics: "서부 정당"
 CAS_focus_western_politics_desc: "첫 전국 선거를 앞두고 치르는 과정에서 유권자들이 서부의 사상, 이상, 원칙을 중심으로 하는 정당과 운동에 점점 더 매료된 것으로 보입니다. 따라서 이는 승리한 정당이 승리의 행진을 시작할 무대를 마련할 뿐 아니라, 새로운 정당들이 나서서 정치적 파이의 한 조각이라도 차지할 수 있는지 시험해 볼 무대를 마련하기도 합니다."
 CAS_focus_consumers_party_victory: "소비자당의 승리"
 CAS_focus_consumers_party_victory_desc: "개표가 끝났고 캐스캐디아 소비자당이 승리했으며, 이제 소비자의 필요와 기업의 필요 모두에 눈을 돌리고 있습니다. 우리나라가 대륙의 다른 어느 나라보다 먼저 경제적으로 올바른 출발을 할 수 있으리라는 것은 확실합니다."
 CAS_focus_tax_business_act: "기업 과세법"
 CAS_focus_tax_business_act_desc: "TBA, 일부에서 소비자가 아닌 기업에 과세하라 법이라 부르는 이 법은 경제의 소비자 측면보다 기업과 부를 창출하는 측면에 더 많은 세금을 부과하는 세제 개혁입니다. 그 논거는, 원칙적으로 기업을 세우기는 더 어려워지겠지만 소비자들이 더 많은 가용 현금으로 더 자유롭게 소비하고 저축하여 자신의 사업까지 시작할 수 있다는 것입니다. 일종의 단기적 손해를 감수하고 장기적 이익과 미래 투자를 얻는 셈입니다."
 CAS_focus_economic_education_act: "경제 교육법"
 CAS_focus_economic_education_act_desc: "EEA는 우리 청소년이 일상생활의 관점에서 경제와 기초 경제학을 배우고 이해할 수 있도록 더 잘 투자하고 뒷받침하기 위한 일반 교육 투자 및 개혁 법안입니다. 자금 관리 기술과 예산 균형 잡기 등 미래에 도움이 될 수 있는 기술을 익히게 하는 것이 목표입니다."
 CAS_focus_young_founders_program: "청년 창업가 프로그램"
 CAS_focus_young_founders_program_desc: "YFP는 젊고 야심 찬 기업 지도자들이 실제로 자본을 갖고 자신의 사업을 만들고 시작할 수 있도록 돕는 전담 프로그램입니다. 이들은 서류를 제출하고 어떤 종류의 사업을 하고 싶은지, 어디에 입지하려는지, 맞닥뜨릴 것으로 예상되는 경쟁은 무엇인지 기본 개요를 상세히 밝혀야 합니다. 요컨대 이는 중소기업 부문의 단단한 토대를 마련하고 시동을 거는 것이며, 시간과 운에 따라 그들이 한 단계 도약하거나 현상을 유지하게 될 것입니다."
 CAS_focus_general_economics_plan: "종합 경제 계획"
 CAS_focus_general_economics_plan_desc: "나라를 가능한 한 꾸준하고 균형 있게 정상화하려면, 각 주와 그 일반적인 필요에 포괄적으로 투자하고 각 주의 특성을 이해해야 합니다. 이를 위해 각 주마다 최소 하나의 전담 경제 부문에 투자할 것입니다."
 CAS_focus_retooling_regulations: "규제 재정비"
 CAS_focus_retooling_regulations_desc: "새로운 산업 및 상업 지역을 확장하고 구획하는 것과 관련한 규제 개혁은 물론, 이러한 새 건물을 실제로 착공하는 것과 관련된 규제에 대한 이해도 바뀌어야 합니다. 일부 구식 규제는 실제로 좋은 일도 나쁜 일도 하지 않으면서 너무나 번거로워 전체 과정을 늦추고 있습니다. 어디로든 나아가려면 이를 신속히 바로잡아야 합니다."
 CAS_focus_national_defense_act: "국방법"
 CAS_focus_national_defense_act_desc: "국방법은 최소한 우리나라의 전반적인 독립을 확보하기 위해 산업을 선제적으로 군사화하는 조치입니다."
 CAS_focus_energy_security_act: "에너지 안보법"
 CAS_focus_energy_security_act_desc: "ESA는 교육, 연구개발, 그리고 전반적인 에너지 안보를 개선하는 방안에 더 잘 투자하기 위한 법안입니다. 이를 통해 외국에 대한 경제적 독립성이 높아지고, 장차 모든 협상 테이블에 조금이나마 더 많은 것을 가져갈 수 있게 될 것입니다."
 CAS_focus_cascade_care_program: "캐스케이드 케어 프로그램"
 CAS_focus_cascade_care_program_desc: "캐스케이드 케어는 보다 보편적인 의료 체계로 가는 연착륙으로서 모든 시민이 가입하는 연방 선택형 보험입니다. 이로써 시민들은 필요할 때 선택할 수 있게 되며, 모두가 기여하므로 이 세금으로 조성되는 직접 재원과 수입이 일반 공공 의료 시설과 인력의 설립과 운영에 투입되어, 시민의 선택과 관계없이 대중이 더 잘 보살핌을 받게 됩니다."
 CAS_focus_cascadian_securities: "캐스캐디아 증권 프로그램"
 CAS_focus_cascadian_securities_desc: "CSP는 본질적으로 국가 사회보장 프로그램이지만, 대부분의 국가와는 접근 방식에 차이가 있습니다. CSP는 본질적으로 각 납세자의 저축을 모아 보관하는 은행과 유사한 시설을 다수 갖추고 있습니다. 이는 특정 기업이나 사업체를 거치지 않는 연방 차원의 401(k) 프로그램과 같은 것입니다. 해당 납세자의 명시적인 서명 동의가 없는 한 연방 정부가 이 자금을 사용하지 못하도록 보호하는 법안이 이미 마련될 것입니다."
 CAS_focus_new_conservative_victory: "신보수당의 승리"
 CAS_focus_new_conservative_victory_desc: "선거가 끝나고 NCP가 승리를 거두었으며, 이제 나라의 보수 세력이 흔들림 없이 버티며 발전과 사회적 결속을 향한 진로를 설정할 차례입니다."
 CAS_focus_traditional_taxations: "전통적 과세"
 CAS_focus_traditional_taxations_desc: "NCP는 여러 과세 방식의 수단을 줄이고 국가와 그 구성 요소로부터 수입을 얻는 보다 전통적인 방법과 수단으로 되돌아감으로써 세법 전반을 간소화하여 세법의 \\"군더더기를 덜어내고자\\" 합니다."
 CAS_focus_manufacturing_investments: "제조업 투자"
 CAS_focus_manufacturing_investments_desc: "국내 수요를 충족하는 데 그치지 않고 해외 시장과 무역 협정에 진출하려면 제조 역량을 늘리기 위해 노력해야 합니다."
 CAS_focus_tech_investments: "기술 투자"
 CAS_focus_tech_investments_desc: "주된 기능은 우리의 기술 부문을 늘리는 것이지만, 이 투자 계획은 전반적으로 서비스 및 일반 \\"사무\\" 부문의 역량을 높여 경제 구성을 더욱 다변화하는 데 도움을 주려는 것입니다."
 CAS_focus_food_securities_act: "식량 안보법"
 CAS_focus_food_securities_act_desc: "식량 안보법은 국내 식량 안보를 발전시키기 위한 전담 연구 및 투자 계획입니다. 이는 국내 수요를 더 많이 뒷받침하고, 수직 농업 같은 장래의 실험적 방법을 모색할 수 있게 해 주기를 기대합니다."
 CAS_focus_automaton_research_budget: "자동화 장치 연구 예산"
 CAS_focus_automaton_research_budget_desc: "자동화, 인공지능, 그리고 기초적인 자동 기계 유형의 발전에 대한 연구 투자와 예산 편성은 가용 노동력의 전반적인 효율과 규모를 높여, 대부분의 사람들이 하고 싶어 하지 않는 반복적인 업무를 맡기게 함으로써 더 적은 시간과 더 적은 공간으로 더 많이 생산할 수 있게 해 줄 것입니다."
 CAS_focus_increasing_social_funding: "사회 지원 확대"
 CAS_focus_increasing_social_funding_desc: "복지의 기본은 사회주의적 선동에 맞서는 수단으로 1800년대에 이를 보편화한 독일 제국 및 여러 나라의 초기 복지 국가에서 형성된 기대입니다. 그러나 우리는 국가로서 상황이 좋지 않을 때 국민을 돌보아야 합니다. 누구에게나 힘든 날은 있으며, 따라서 누군가의 힘든 날이 범죄자로서의 첫날이 되지 않도록 해야 합니다."
 CAS_focus_infrastructure_projects: "인프라 사업"
 CAS_focus_infrastructure_projects_desc: "건설 능력을 전반적으로 높이면 장차 더 많은 개발이 가능해질 것입니다. 활용할 수 있는 땅이 많지 않은 만큼, 더 적은 것으로 더 많은 것을 활용하는 방법을 이해하고 이에 집중해야 합니다."
 CAS_focus_better_healthcare_options: "더 나은 의료 선택지"
 CAS_focus_better_healthcare_options_desc: "규제를 조정하고 의료 인프라 전반에 더 나은 투자를 함으로써 국민은 가능한 최상의 진료를 받을 수 있는 선택지를 더 많이 확보하게 됩니다. 따라서 정부 차원의 선택지를 제공하는 한편, 민간 선택지도 허용할 수 있는 토대를 마련해야 합니다."
 CAS_focus_seeking_trade_initiatives: "무역 구상 모색"
 CAS_focus_seeking_trade_initiatives_desc: "세계에서 진정으로 어딘가에 이르려면 우리 땅 너머를 바라보아야 합니다. 선택의 폭은 제한적이겠지만, 이 세계 속에서 아무리 작더라도 우리의 자리를 확고히 하기 위해 소규모 무역 협상부터 시작할 수 있습니다."
 CAS_focus_liberal_victory: "자유주의의 승리"
 CAS_focus_liberal_victory_desc: "투표가 이루어졌고 캐스캐디아 자유당이 선거에서 승리했습니다. 이제 이 뜻을 바탕으로 자유롭고 평등하며 진정한 사회 운동과 경제 번영의 새로운 길로 나아갈 수 있습니다."
 CAS_focus_reformed_regulations: "규제 개혁"
 CAS_focus_reformed_regulations_desc: "우리의 발전 능력은 발전을 가능하게 하는 과정을 규율하고 이해하는 능력에 전적으로 달려 있습니다. 따라서 이러한 규제를 현대적 기준과 기대에 맞추어 더 간소하게 개혁해야 합니다."
 CAS_focus_education_standards_act: "교육 기준법"
 CAS_focus_education_standards_act_desc: "ESA, 즉 교육 기준법은 학생과 교육자가 교육 제도 전반을 거치고 그 일원이 되는 과정에서 갖게 될 질과 역량의 기준을 높이기 위해 더 나은 투자를 하려는 예산안입니다."
 CAS_focus_job_fair_programs: "취업 박람회 사업"
 CAS_focus_job_fair_programs_desc: "재정적 책임을 지는 사람에게 일자리의 안정은 언제나 최우선 과제입니다. 이러한 인식 아래 취업 박람회와 각종 사업을 마련하여 국민의 고용과 경제의 지속적인 발전을 보장하고자 합니다."
 CAS_focus_office_sector_development: "사무 부문 개발"
 CAS_focus_office_sector_development_desc: "우리나라는 작습니다. 이 점에는 누구나 동의할 것입니다. 따라서 서비스업과 기술 산업, 혹은 사무 부문 전반처럼 더 많은 부를 창출하는 사업에 눈을 돌려야 합니다. 이들에게서 창출 가능한 부를 최대한 끌어낼 수 있다면, 국민에게 필요한 것을 제공하고 잠재적 위협으로부터 국방망을 지키는 재원도 마련할 수 있을 것입니다. 이 대륙이 영원히 조용하리라고는 믿기 어렵습니다."
 CAS_focus_food_supplies_act: "식량 공급법"
 CAS_focus_food_supplies_act_desc: "식량 체계를 기계화하고 국내 식량 수요를 위한 공급망을 확보하면, 가능하다면 우리 국경 너머가 되기를 바라는 미래를 내다보면서 더욱 안정적이고 결속력 있는 사회를 발전시킬 수 있을 것입니다."
 CAS_focus_basics_in_defense: "국방의 기초"
 CAS_focus_basics_in_defense_desc: "국가의 안보를 지키려면 어떤 형태로든 방위 산업이 있어야 합니다. 로키산맥 저항군만으로도 충분히 위협적이었는데, 캘리포니아나 이른바 연방주의자들이 서쪽으로 진출해 온다면 우리가 어떻게 될지는 하느님만이 아실 것입니다. 따라서 어떤 상황에도 대비하여 무기와 탄약을 비축하기 시작할 수 있도록 일정한 군수 산업을 갖추어야 합니다."
 CAS_focus_community_outreach_programs: "지역사회 협력 사업"
 CAS_focus_community_outreach_programs_desc: "효율적이고 실효성 있는 지역사회 협력 사업(COP)을 발전시키면 많은 이들이 바라는 사회적 안정을 보장할 수 있습니다. 경찰은 막중한 책임을 지고 있으므로 존중받아야 할 뿐 아니라 그들이 봉사하는 국민으로부터 보살핌을 받아야 하며, 그 반대도 마찬가지입니다. 그들이 봉사하는 공동체와 국민도 똑같이 존중과 관점을 가져야 서로에게 이익이 되고, 각 구성원이 우리나라의 결속과 법질서 유지에 왜 필수적인지 상호 이해할 수 있습니다."
 CAS_focus_bettercare_act: "의료 개선법"
 CAS_focus_bettercare_act_desc: "BCA는 간호사, 의사, 현장 직원의 급여를 인상하고 공공 의료 기관에 필요한 장비와 자원을 조달함으로써, 국민이 공공 의료 기관에서 받을 수 있는 의료의 질을 높이기 위한 재정 지원 패키지입니다."
 CAS_focus_mutual_trade_initiatives: "상호 무역 구상"
 CAS_focus_mutual_trade_initiatives_desc: "스스로 조달할 수 없는 것을 국가에 공급하려면 해외로 눈을 돌려야 합니다. 따라서 국내의 독립성을 지키면서 해외 의존과 국내 안보 사이의 균형을 유지하도록, 무역 협상의 기준을 최대한 상호적인 것으로 설정해야 합니다."
 CAS_focus_victory_for_progress: "진보의 승리"
 CAS_focus_victory_for_progress_desc: "우리 당의 이름으로 선거에서 승리했으므로, 이제 앞으로 나아갈 수단을 갖추었습니다. 사회적·경제적 이동성과 기회의 평등으로 이어지는 길을 열 것입니다."
 CAS_focus_common_sense_labor_reforms: "상식적인 노동 개혁"
 CAS_focus_common_sense_labor_reforms_desc: "노동조합과 고용주 사이의 규율된 단체 교섭 방식을 개선함으로써 협상과 기대의 기준을 세우고 노동자를 진정으로 보호할 수 있습니다. 이에 따라 노조 조합원이 다수인 기업에는 소액의 보조금을 지급하여 균형을 맞추고 노조 전반에 대한 수용성을 높일 수 있습니다."
 CAS_focus_a_more_progressive_tax_code: "더욱 누진적인 세법"
 CAS_focus_a_more_progressive_tax_code_desc: "국민이 스스로와 가족을 부양할 수단을 갖도록 하려면, 사람들이 딛고 설 수 있는 바닥을 만들어 주는 세율과 세금의 종류, 그리고 지원 사업을 조정해야 합니다."
 CAS_focus_budgeting_for_innovation: "혁신 예산 편성"
 CAS_focus_budgeting_for_innovation_desc: "시대에 앞서 나가려면 우리의 과학 역량에 주목해야 하며, 따라서 미래를 위해 투자해야 합니다. 우리나라와 국민, 그리고 우리가 활용할 수 있는 얼마 안 되는 땅을 위해서입니다."
 CAS_focus_selective_mechanization: "선별적 기계화"
 CAS_focus_selective_mechanization_desc: "현대화가 모든 것을 한꺼번에 해야 한다는 뜻은 아닙니다. 이를 이해한다면 핵심 산업과 경제 부문을 선별하여 현대화하고 기계화함으로써 더 적은 자원으로 더 많은 일을 해낼 수 있습니다. 그러면 더 많은 노동자가 산업, 사무 등 다른 직종으로 이동할 수 있으며, 우리는 끊임없이 변화하는 이 경제 세계에서 국민이 가능한 한 원활하게 자유로이 이동할 수 있도록 지원과 전환 체계를 강화하고자 합니다."
 CAS_focus_investing_in_the_future: "미래에 대한 투자"
 CAS_focus_investing_in_the_future_desc: "우리의 인프라는 경제적·사회적 이동 전반에서 우리가 기능할 수 있게 하는 기반입니다. 따라서 현재와 국가 발전의 미래를 위해 투자하고 준비하여, 앞으로 다가올 세대에 독창성의 기준을 세웁시다."
 CAS_focus_farming_investments: "농업 투자"
 CAS_focus_farming_investments_desc: "인구를 먹여 살리고 노동자를 위한 식량 공급망을 확보하는 것은 진정한 사회 결속에 무엇보다 중요합니다. 이 기본적인 생존 요건이 어떤 식으로든 훼손될 때 진짜 문제가 시작되며, 우리는 이를 피하고자 합니다. 식품 포장 및 가공 공장을 세우고 수직 농법 같은 실험적 농업 형태에 투자함으로써, 전체적으로 더 적은 토지로 더 많은 작물을 재배할 수 있습니다."
 CAS_focus_rocky_mountain_mining: "로키산맥 광업"
 CAS_focus_rocky_mountain_mining_desc: "RMM은 안정화 초기에 옛 로키산맥 저항 집단의 상당수가 지원하던 기업이었습니다. 그러나 이 기업은 새로운 모습으로 거듭난 듯하며, 정부에 토지 불하와 확장 자금을 청원하고 있습니다. 우리는 이 사업에 기꺼이 투자할 것입니다. 가용 자원을 국내에서 확장하면 국내 안보는 물론 대외 무역 협상 전반에서 우위를 점할 수 있기 때문입니다."
 CAS_focus_industrial_expansion: "산업 확장"
 CAS_focus_industrial_expansion_desc: "국민이 일자리를 찾도록 도우려면 우선 일자리부터 만들어야 합니다. 따라서 산업 및 상업 부문의 일자리에 투자하여 기본적이고 보편적인 시장을 확보하고, 국민이 가능한 한 빨리 일자리를 얻을 수 있도록 하겠습니다. 이는 앞선 사업들과 맞물려 장차 성장과 경제 다각화 전반을 촉진하는 디딤돌이 될 수 있습니다."
 CAS_focus_energy_demands_act: "에너지 수요법"
 CAS_focus_energy_demands_act_desc: "에너지 수요는 우리의 최우선 과제 중 하나가 되어야 하며, 이 법안은 국내 생산 능력을 키우기 위해 교육과 인프라, 그리고 시설 투자를 시행할 것입니다. 아울러 교육 및 연구 투자는 에너지의 수송과 저장 과정에서 생기는 손실을 줄이는 데 쓰여 전체 소비율을 낮추게 될 것입니다."
 CAS_focus_eastern_politics: "동방 정당"
 CAS_focus_eastern_politics_desc: "선거를 앞두고 치르는 동안 동방과 극동의 가치, 사상, 원칙이 유권자들을 사로잡았습니다. 우리는 숨을 죽이고 잠시 멈춰 서서, 때가 되면 결국 어떤 결과를 맞게 될지 지켜보고 있습니다."
 CAS_focus_red_mountain_victory: "붉은 산의 승리"
 CAS_focus_red_mountain_victory_desc: "승리는 우리의 것이며, 우리 국민을 위해 새로운 장을 엽니다. 더는 자본주의라는 무한한 부의 약속으로 스스로를 기만하지 않을 것입니다. 이제 우리는 욕망이 아닌 필요에 따라 모든 이를 위한 체제를 만들 것입니다."
 CAS_focus_wealth_tax_act: "부유세법"
 CAS_focus_wealth_tax_act_desc: "세제 개혁을 통해 우리는 개인에 대한 과세에 그치지 않고 부 그 자체에 과세하도록 세금 제도를 개편할 계획입니다. 물론 개인은 다양한 방식으로 부를 얻을 수 있지만, 기업과 핵심적인 부의 창출은 개인의 임금과는 전혀 별개입니다. 따라서 개인에 대한 세금은 낮게 유지할 수 있으며, 어쩌면 장차 엄밀한 의미의 소득세가 필요 없게 될지도 모릅니다."
 CAS_focus_cooperative_ownership_act: "협동 소유법"
 CAS_focus_cooperative_ownership_act_desc: "협동 소유란 기업을 구성하는 모든 이가 해당 기업에 대한 지분 및 \\"이해관계\\"를 갖는 방식입니다. 따라서 결정은 기업의 경영진과 노동자 대표가 내리게 되며, 이를 통해 모든 관계자에게 영향을 미치는 성장과 운영에 대한 결속과 공동 행동을 보장합니다. 앞으로 설립되는 모든 신규 기업은 이 조직 형태를 갖추도록 의무화하며, 기존 기업에는 새 조직으로 전환할 수 있는 5년의 유예 기간을 줍니다. 이를 지키지 않으면 합의된 강제 정산을 통해 정부에 의해 강제로 인수되거나 매수될 위험이 있습니다."
 CAS_focus_industrial_efficiency_act: "산업 효율법"
 CAS_focus_industrial_efficiency_act_desc: "비관론자들은 우리에게 땅이 별로 없으며 자연과 문명의 균형을 지켜야 한다고 떠들어댈 것입니다. 하지만 그들은 인간의 의지와 결의를 이해하지 못하는 사람들입니다. 우리는 산업 역량을 높일 새로운 방법, 새로운 기계, 새로운 생산 방식, 가능한 모든 새로운 것을 연구하고 투자할 것입니다. 우리 국민과 그들이 누려 마땅한 미래를 위해, 세상의 비관론자와 종말론자들이 뭐라 하든 우리는 승리할 것입니다."
 CAS_focus_industrial_revolutionary_program: "산업 혁명 계획"
 CAS_focus_industrial_revolutionary_program_desc: "우리나라는 새로운 수준과 기준의 산업화에 도달하기 위해 준비하고 노력해 왔습니다. 이제 우리는 IRP에 따라 전국적으로 투자하고 경제력을 새로운 높이로 끌어올릴 수단을 갖추었습니다. 머지않아 우리는 국민을 위한 미래를 만들고 세계에서 인정받게 될 것이며, 그것이 비록 작은 부분일지라도 우리가 한 역할을 맡는 일입니다."
 CAS_focus_northwestern_mining_incorporated: "노스웨스턴 광업 주식회사"
 CAS_focus_northwestern_mining_incorporated_desc: "NWM, 즉 노스웨스턴 광업은 국내 시장에 전략적으로 필요한 채굴 사업을 맡는 국영 광업 회사입니다. 일반 광업 회사들이 각자의 전문 분야에 집중하는 동안, NWM은 전략적 채굴 구역을 확보하고 조성하여 국내 수요가 시간이 갈수록 늘어남에 따라 전체 자원 채취 능력을 넓히는 데 주력할 것입니다."
 CAS_focus_cascadian_research_institute: "캐스캐디아 연구소"
 CAS_focus_cascadian_research_institute_desc: "CRI는 에너지 소비와 생산 방식 같은 분야, 그리고 우리가 일구어 온 국가와 국민, 경제를 더 성장시키고 더 효율적으로 만들 수 있는 일반 분야에서 혁신을 이끌기 위한 전담 연구 개발 시설입니다."
 CAS_focus_red_mountaineers_budget: "붉은 산악병 예산"
 CAS_focus_red_mountaineers_budget_desc: "국가의 군사적 방위는 상당히 중요한 문제이며, 그렇기에 우리는 우리의 국가적 강점인 산악 지형에 집중해야 합니다. 전선에서 수십 마일 떨어진 곳에서도 사람이 죽을 수 있는 현대전의 시대에 우리 군이 점차 발전하여 지형을 활용하는 더 많은 방법을 익힐 수 있도록, 새로운 훈련 부대를 만들 전문 부대인 붉은 산악병에 전용 예산을 배정할 것입니다."
 CAS_focus_better_social_budgeting: "더 나은 사회 예산 편성"
 CAS_focus_better_social_budgeting_desc: "우리는 국민의 보살핌을 보장해야 하며, 이를 위해 사회 사업에 배정되는 예산을 늘려야 합니다. 단기적으로는 부담이 되겠지만, 이러한 자기 투자는 국민 삶의 질의 바닥을 더 끌어올리게 하고, 이를 통해 새로운 기준을 세우고 가능한 한 빨리 이들을 다시 노동 현장으로 복귀시킬 향후 사업을 준비할 수 있게 해 줄 것입니다."
 CAS_focus_energy_diversity_act: "에너지 다양화법"
 CAS_focus_energy_diversity_act_desc: "에너지 수요를 충족하려면 전력 생산 방식의 다양성을 확보해야 합니다. 전반적으로 이는 서로 다른 에너지 생산 방식에 투자할 수 있게 할 뿐 아니라, 더 작거나 같은 규모의 장비와 인프라에서 더 많은 전력을 얻는 효율적인 방법에 관한 연구에도 투자할 수 있게 해 줄 것입니다."
 CAS_focus_the_peoples_victory: "인민의 승리"
 CAS_focus_the_peoples_victory_desc: "결과가 나왔고 인민은 의사를 밝혀 승리를 스스로 쟁취했습니다. 이를 바탕으로 중앙 권력과 그 폭력적 통치가 아닌 인민이 스스로 통제할 수 있는, 더욱 조화롭고 평등하며 자유로운 사회를 이루기 시작할 수 있습니다."
 CAS_focus_community_kitchens: "공동체 식당"
 CAS_focus_community_kitchens_desc: "우리의 일차 목표는 \\"국가\\"가 거의 존재하지 않는 상태를 달성하는 것입니다. 따라서 사업과 구상을 통해 인민에게 더 많은 권력을 주어, 돈의 출처가 애초에 있어야 할 곳, 곧 인민에게 남도록 해야 합니다."
 CAS_focus_modern_homestead_act: "현대 자영농지법"
 CAS_focus_modern_homestead_act_desc: "용도 지구제의 장벽을 허물면 인민이 어디에서 무엇을 원할지 스스로 결정할 수 있습니다. 유일한 조건은 토지 규모의 상한으로, 이는 모든 이가 우리의 위대한 나라가 제공하는 것을 나누어 가질 수 있게 하기 위한 것입니다."
 CAS_focus_tradesmen_society_act: "장인 협회법"
 CAS_focus_tradesmen_society_act_desc: "개인에게 힘을 실어 주려면 스스로 살아가고, 찾고, 만들어 낼 수 있는 도구와 수단을 주어야 합니다. 따라서 가능한 한 많은 지식과 그 지식을 갖춘 사람들에게 접근할 수 있도록 할 것입니다. 목공, 대장일, 용접 등 가정에 도움이 되는 모든 기술은 곧 자신에게 도움이 되는 기술입니다."
 CAS_focus_the_peoples_mountain_state: "인민의 산악 주"
 CAS_focus_the_peoples_mountain_state_desc: "아이다호 주는 인민에게 돌려주어야 합니다. 그들에게 스스로 일굴 수단을 주어, 서로를 위한 새롭고 더 나은 삶을 만들게 할 것입니다."
 CAS_focus_the_peoples_pacific_gem_state: "인민의 태평양 보석 주"
 CAS_focus_the_peoples_pacific_gem_state_desc: "워싱턴 주 주민들이 번영하고, 살아가며, 원하는 삶을 일굴 수단을 이제 갖게 될 것입니다."
 CAS_focus_the_peoples_state_of_trails: "인민의 길의 주"
 CAS_focus_the_peoples_state_of_trails_desc: "오리건 길은 절망과 희망과 공포의 길이었습니다. 그러나 이제 우리는 이 길의 종착지인 주를 새로운 꿈이자 새로운 내일로, 그리고 무엇보다 그곳 주민을 위한 새롭고 더 나은 미래로 만들 수 있습니다."
 CAS_focus_educations_medicine_act: "교육·의료법"
 CAS_focus_educations_medicine_act_desc: "자신과 주변 사람을 성장시키는 데 중요한 두 가지는 지식과 건강입니다. 이에 따라 인민이 스스로와 친구, 이웃, 가족을 돌볼 수 있도록 더 많은 접근 기회와 능력을 제공할 계획입니다. 이는 모든 표준 관행 면에서 의료, 생산, 그리고 일반 목적의 방법에 쓸 수 있는 자원을 늘림으로써 이루어집니다. 스스로 이루어 내는 혁신과 필요는 인민이 삶에서 필요로 하거나 원하는 바에 따라 충족되고 높아질 것입니다."
 CAS_focus_healthy_people_act: "건강한 인민법"
 CAS_focus_healthy_people_act_desc: "건강한 사람이 오래 사는 법이므로, 인민의 보살핌과 복지는 무엇보다 중요합니다. 그렇게 얻은 삶은 마음먹은 일이라면 무엇이든 해내는 데 쓸 수 있으며, 우리는 그들이 그렇게 할 수단과 능력을 갖추도록 해야 합니다."
 CAS_focus_unity_act: "통합법"
 CAS_focus_unity_act_desc: "사업과 주택을 짓는 방식을 둘러싼 장벽은 허물어졌고, 자기 땅을 사용하는 방식을 둘러싼 장벽도 허물어졌습니다. 우리는 국가 자체의 장벽을 허물고 하나로 뭉친 전진의 길을 선언합니다. 이 땅의 인민이 자신의 미래가 무엇이 될지 결정하는 진정한 주체가 될 것입니다."
 CAS_focus_victory_for_tradition: "전통의 승리"
 CAS_focus_victory_for_tradition_desc: "투표가 이루어지고 개표가 끝나자 국민은 전통을 믿는다는 뜻을 밝혔습니다. 우리나라는 젊은 나라이므로, 우리의 전통이 무엇이 될 수 있고 무엇이 될 것인지를 확고히 하고 앞으로 여러 세대에 걸쳐 이어질 사회적·국가적 결속과 자긍심의 척도를 세우기에 더없이 좋은 때입니다."
 CAS_focus_establishing_national_social_traditions: "국가 사회 전통 확립"
 CAS_focus_establishing_national_social_traditions_desc: "우리의 국가 사회 전통을 정립하면 우리 사회가 시간의 흐름에 따라 어떻게 기능하고 나아갈지에 대한 기준과 선례가 마련될 것입니다. 우리의 최우선은 가정이지만, 가정의 유연성 또한 매우 중요합니다. 가정이 어떻게 꾸려지든 안정된 가정은 그 자녀들에게 안정적이고 더 나은 삶이기 때문입니다. 이에 따라 직장에서의 여성의 평등한 기회와, 편견에 찬 판단이나 과거의 선입견이 아닌 인품의 내용을 법제화하여, 단지 경력을 쌓고 자신의 길을 개척하고자 하는 이들을 위한 부당하고 성급한 결정을 막고자 합니다. 이러한 부정적 영향을 방치하면 그들의 앞길이 가로막힐 것이기 때문입니다."
 CAS_focus_creating_economic_innovations: "경제 혁신 창출"
 CAS_focus_creating_economic_innovations_desc: "모든 국민이 장차 사업가가 될 수 있는 공간과 환경을 조성하면, 사람들이 삶에서 더 많은 이동성과 유연성을 누리게 되므로 우리는 한결 느긋하게 지켜볼 수 있습니다. 이 새로운 환경에서는 창의성 그 자체를 위한 개인적 혁신이 이루어져 시장의 현상 유지에 도전하고, 투자자든 노동자든 소비자든 참여하고자 하는 모두를 위한 새로운 미래를 열어 줄 것입니다."
 CAS_focus_creating_educational_excellence: "교육적 우수성 창출"
 CAS_focus_creating_educational_excellence_desc: "국민이 창의적이고 혁신적이며 근면하려면, 우리는 그들을 가르치고 세상에 존재하는 지식과 정보의 세계에 눈을 뜨게 해야 합니다. 이해와 지식이 없으면 진보에 대한 감각이 없고, 진보에 대한 감각이 없다면 정말로 삶에서 어딘가에 이르고 있는 것인지, 아니면 그저 가진 것에 만족하고 있는 것인지 알 수 없기 때문입니다."
 CAS_focus_growth_initiative_phase_one: "성장 구상 1단계"
 CAS_focus_growth_initiative_phase_one_desc: "GIP, 즉 성장 구상 계획은 우리나라 경제가 국민의 수요에 부응할 수준이 되도록 하기 위한 일반 경제 개발 계획입니다. 이 첫 단계는 체계적인 농업 개발과 제한적인 제조업 투자로 시작합니다."
 CAS_focus_growth_initiative_phase_two: "성장 구상 2단계"
 CAS_focus_growth_initiative_phase_two_desc: "GIP의 2단계는 아이다호 주의 광물 자원 접근성을 넓히고 이를 활용해 오리건 주의 사무 부문에 힘을 싣는 데 초점을 맞춥니다. 이로써 경제 성장과 통합, 그리고 전반적인 발전을 향한 새로운 한 걸음을 내디딥니다."
 CAS_focus_growth_initiative_phase_three: "성장 구상 3단계"
 CAS_focus_growth_initiative_phase_three_desc: "GIP의 마지막 계획은 해군 산업과 국내 무기 제조라는 경제 패키지를 완성하는 데 중점을 둡니다. 이러한 개발은 국방 개발을 시작할 수 있는 제한적인 방법에 더해 경제 성장을 한층 촉진할 것입니다."
 CAS_focus_subtle_militarization: "은밀한 군사화"
 CAS_focus_subtle_militarization_desc: "끊임없이 성장하고 번영하는 우리나라와 그 국민 자체를 지키려면, 상비군에 물자를 공급할 수 있는 국내 무기 산업에 투자해야 합니다. 많지는 않지만 일을 시작하기에는 충분합니다."
 CAS_focus_naval_yards: "해군 조선소 투자"
 CAS_focus_naval_yards_desc: "우리 해군 전력은 공화국 시절부터 남아 있는 상당한 규모입니다. 그러나 필요할 때 함선을 수리하고 정비하지 못한다면 그 함선을 보유한 것은 아무 의미가 없습니다. 따라서 해군 전력 전반의 유지를 도울 최소한의 시설은 갖추도록 하겠습니다."
 CAS_focus_family_tax_breaks: "가족 세금 감면"
 CAS_focus_family_tax_breaks_desc: "우리나라 전역에서 가정이 평화롭게 발전하도록 하려면, 아이를 돌본다는 생각 자체를 장려할 뿐 아니라 새내기 부모가 겪을 수 있는 재정적 부담과 어려움에 대한 걱정도 덜어 주어야 합니다. 이러한 부담 때문에 부모는 그런 환경에서 자녀를 키우고 싶지 않아 아이를 갖기를 꺼리게 되고, 그 결과 온갖 부정적 영향이나 노골적인 \\"나쁜 선택\\"이 생길 수 있습니다. 따라서 부모가 자녀의 삶과 양육 과정을 헤쳐 나가도록 돕고 이끌어 줄 전용 세금 감면이 마련될 것입니다."
 CAS_focus_greater_cascadian_victory: "대캐스캐디아의 승리"
 CAS_focus_greater_cascadian_victory_desc: "진정한 캐스캐디아 애국자들이 투표소로 가서 자신의 목소리를 냈습니다. 이 승리로 우리는 젊은 나라와 그 고결한 국민을 위한 더 위대한 미래를 확보할 기반을 마련했습니다. 캐스캐디아를 위하여!"
 CAS_focus_militaristic_primacy: "군사 우선주의"
 CAS_focus_militaristic_primacy_desc: "국가로서의 목표를 이루려면, 이러한 목표를 달성하게 해 줄 확실성을 만드는 길로 나아가야 합니다. 군사 우선은 새로운 대캐스캐디아로 향하는 문을 여는 열쇠가 될 것입니다."
 CAS_focus_economic_militarism: "경제적 군국주의"
 CAS_focus_economic_militarism_desc: "우리나라는 장차 있을 정복의 가능성에 맞추어 갖추어져야 합니다. 이를 위해 군수 생산에 적합하도록 경제를 선제적으로 재편할 것입니다. 제한적인 배급제 등을 통해 국민이 국가적 야망을 달성하는 데 필요한 잠재적 어려움과 희생을 이해하도록 길들일 것입니다."
 CAS_focus_creating_our_own_complex: "독자적 복합체 구축"
 CAS_focus_creating_our_own_complex_desc: "군에는 무기와 장비가 필요하며, 우리는 독자적인 군산복합체를 구축하여 이를 공급할 것입니다. 우리는 군의 수요를 더욱 충족할 기반을 마련하고 승리로 가는 길을 열 것입니다."
 CAS_focus_manufacturing_navies: "해군 건조"
 CAS_focus_manufacturing_navies_desc: "민간 경제의 발전이 제한적인 만큼, 이는 우리 해군 산업력을 확보하기 위한 지원책입니다. 상선이든 군함이든 우리 선박은 칠대양을 누비며, 외국의 악마들과 양의 탈을 쓴 늑대들로부터 국내의 독립을 지킬 것입니다."
 CAS_focus_improving_national_logistics: "국가 물류 개선"
 CAS_focus_improving_national_logistics_desc: "우리나라는 이동하기가 매우 까다로운 나라이며, 이는 우리에게 도움이 되는 동시에 전장에서 적을 우리 손아귀로 끌어들이는 데에도 도움이 됩니다. 국가로서 물류망을 확충하고 간소화하려는 우리의 노력은 우리나라의 공격 및 방어 능력 양쪽 모두에 무엇보다 중요합니다. 이러한 개선을 통해 적이 선택된 경로만 택하도록 시야를 좁히고 더욱 예측 가능한 양상으로 몰아넣을 능력을 추구할 수 있습니다. 물론 우리는 언제나 예상치 못한 일을 예상해야 하지만, 예상치 못한 일을 더 예상할 수 있게 만들 수 있다면 마다할 이유가 없습니다."
 CAS_focus_olympia_soars: "올림피아의 비상"
 CAS_focus_olympia_soars_desc: "우리나라의 중추이자 신경 중추는 워싱턴 주입니다. 자원을 확대하고 이를 수도권으로 끌어옴으로써 이를 공고히 해야 합니다. 간접적으로는 나라 전체의 경제를 발전시키고, 기본 교리로는 우리나라의 주권을 지키기 위해 우리가 구축할 올림피아 요새를 굳건히 할 것입니다."
 CAS_focus_fortress_cascadia: "요새 캐스캐디아"
 CAS_focus_fortress_cascadia_desc: "국방은 제일 가는 일차 목표이며, 이를 위해 요새 캐스캐디아 계획이 성공하여 최대한 발전하도록 할 것입니다. 이로써 우리가 해안 지대의 바로 그 물가까지 밀려나더라도 계속 생존할 수 있게 하겠습니다."
 CAS_focus_coastal_command_project: "연안 사령부 계획"
 CAS_focus_coastal_command_project_desc: "육지를 확보했으니 이제 바다를 확보해야 합니다. 이러한 취지에서 연안 사령부 그룹, 즉 CCG를 설립합니다. 이 그룹은 철벽같은 우리 방어망을 우회하려는 후방 상륙을 막기 위한 연안 안보와 방어를 보장하는 토대를 마련할 것입니다."
 CAS_focus_solidifying_the_network_into_society: "방어망의 사회 통합"
 CAS_focus_solidifying_the_network_into_society_desc: "거대하고 겹겹이 이루어진 방어망은 우리 국가적 결의를 보여 주는 훌륭한 증거입니다. 그러나 현실은, 이러한 부담이 시간이 흐를수록 민간의 의지와 정신력을 은연중에 소모시킬 수 있다는 것입니다. 따라서 우리는 방어망을 중심으로 발전시켜, 우리나라의 사회라는 기계를 움직이는 또 하나의 톱니바퀴로 만들 것입니다."
 CAS_focus_home_grown_politics: "토착 정치"
 CAS_focus_home_grown_politics_desc: "선거가 가열되면서 유권자들이 정당과 운동으로 결집했습니다. 캐스캐디아의 문제와 캐스캐디아의 사상 및 이상을 가진다는 것의 의미에 더 집중하는, 지역에서 비롯된 풀뿌리 움직임이 국민을 사로잡았습니다. 외부의 영향을 받지 않은 일련의 운동이 이 선거의 결말을 향해 이미 자리를 잡았습니다."
 CAS_focus_victory_for_a_greater_cascadia: "대캐스캐디아를 위한 승리"
 CAS_focus_victory_for_a_greater_cascadia_desc: "캐스캐디아의 애국자들이 목소리를 내어 위대하고 고결한 우리나라의 승리를 거머쥐었습니다. 이제 우리는 국민과 이상, 그리고 국가 정체성 그 자체를 위한 위대함의 길을 닦을 수단을 갖추었습니다."
 CAS_focus_national_security_act: "국가 안보법"
 CAS_focus_national_security_act_desc: "국가 안보는 국민을 보호하는 으뜸가는 수단이며, 군이든 경찰이든 어떤 대가를 치르더라도 국민의 안전과 안보를 보장할 것입니다."
 CAS_focus_innovation_station_act: "혁신 거점법"
 CAS_focus_innovation_station_act_desc: "혁신 거점은 수많은 연구 개발 사업에 전념하는 연구 단지입니다. 그 범위는 방위 사업에서 에너지 생산 방식, 자원 활용과 채취에 이릅니다. 결국 이 단지는 장차 우리나라를 방어하고 우리가 추구하는 영광을 찾아 나설 능력을 높여 줄 것입니다."
 CAS_focus_all_roads_lead_to_olympia: "모든 길은 올림피아로 통한다"
 CAS_focus_all_roads_lead_to_olympia_desc: "유럽의 모든 길이 로마로 통하듯, 신세계의 모든 길은 올림피아로 통하게 할 것입니다. 올림피아는 국민이 갈망하는 자유와 열정의 불을 밝히는 빛나는 중심 등불이 되기 때문입니다. 일자리와 식량, 집과 삶이 올림피아에서 만들어질 것이며, 우리는 이를 모두가 볼 수 있는 확고한 사실로 만들 것입니다."
 CAS_focus_interstate_revitalization_act: "주간 활성화법"
 CAS_focus_interstate_revitalization_act_desc: "활성화법은 우리나라를 더욱 긴밀히 연결하고 공급망을 더 효율적으로 만들 것입니다. 이는 물자와 자재, 그리고 사람의 수송 효율이 높아져 전체 생산 노력에 순증 효과가 생기기 때문입니다."
 CAS_focus_domestic_armaments_industry: "국내 무기 산업"
 CAS_focus_domestic_armaments_industry_desc: "나라를 지키려면 실제로 군에 물자를 공급할 수 있어야 합니다. 따라서 국내 무기 산업의 확립이 이 목표를 달성하는 데 무엇보다 중요합니다."
 CAS_focus_domestic_naval_yards: "국내 해군 조선소"
 CAS_focus_domestic_naval_yards_desc: "우리의 해역은 지켜질 것이며, 우리에게는 그럴 해군력이 있습니다. 그러나 이러한 전력을 유지하려면 인력과 자재, 시설이 필요합니다. 따라서 해역과 연안 해안의 방어를 위해 이러한 것들을 조성하고 배분하도록 하겠습니다."
 CAS_focus_army_expansion_act: "육군 확장법"
 CAS_focus_army_expansion_act_desc: "우리 육군은 나라의 방어와 목표를 달성하기 위한 주된 지상 방어력입니다. 장차 국경 너머의 목표를 진지하게 고려한다면 육군 확장에 주력해야 합니다."
 CAS_focus_naval_expansion_act: "해군 확장법"
 CAS_focus_naval_expansion_act_desc: "NEA는 해군 전력에 할당되는 능력과 자원을 확대하기 위한 전담 예산 증액입니다. 이 투자금은 기존 능력을 개발하고 다듬는 데는 물론, 훈련과 시설을 개선하여 상비 해군의 전반적인 질을 높이는 데에도 쓰일 것입니다."
 CAS_focus_militarization_of_the_budget: "예산의 군사화"
 CAS_focus_militarization_of_the_budget_desc: "예산과 세금 징수 방식을 조정함으로써 군에 배정할 전용 군사 예산 흑자를 확립할 수 있습니다. 이 예산은 모든 군종의 상비 인원을 늘리고 각 군종 전반의 개선 작업을 진행하는 데 쓰입니다."
 CAS_focus_in_the_business_of_victory: "승리라는 사업"
 CAS_focus_in_the_business_of_victory_desc: "유권자들이 의사를 밝혔고 기업이 선거에서 승리했습니다. 우리 구호가 말하듯, 보이시 비즈니스는 여러분의 비즈니스입니다. 우리가 경제에 집중하여 나라와 국민이 제대로 보살핌을 받도록 하는 동안 이 구호는 진실이 될 것입니다. 옛 아메리칸 드림이 아니라, 크든 작든 삶 그 자체를 누릴 캐스캐디아인의 권리인 캐스캐디아의 명징함을 되살리는 것입니다."
 CAS_focus_reforming_tax_breaks: "세금 감면 개혁"
 CAS_focus_reforming_tax_breaks_desc: "세금 감면을 단순히 초과 자본 이득을 챙기는 데 쓰이지 않고, 기업의 자체 투자와 성장을 더 장려하도록 개혁하면 유동적이고 경쟁력 있는 사업 환경이 만들어져, 장차 국내 투자와 가능하다면 해외 투자까지 촉진할 수 있습니다."
 CAS_focus_refining_regulatory_blocks: "규제 장벽 정비"
 CAS_focus_refining_regulatory_blocks_desc: "규제상의 걸림돌을 더 매끄러운 요철로 바꾸고 비껴가게 만들어, 새로운 개발 등을 이루기 위한 더욱 결속력 있고 주도적인 환경을 조성합니다. 이를 염두에 두면 더 많은 이익을 거둘 수 있으며, 우리가 진지하게 투자해야 할 것은 지역 법 집행 기관 등을 통한 현장 보안 정도뿐일 것입니다."
 CAS_focus_oregon_petrochemicals: "오리건 석유화학"
 CAS_focus_oregon_petrochemicals_desc: "오리건 석유화학 산업의 확대와 개선에 대한 투자는 플라스틱과 해당 경제 부문이 공급할 수 있는 제품 측면에서 광범위한 에너지 및 국내 수요를 확보하게 해 줄 것입니다."
 CAS_focus_aspen_construction_contracting: "애스펀 건설 계약"
 CAS_focus_aspen_construction_contracting_desc: "애스펀 건설은 아이다호 주의 유력한 건설 회사입니다. 우리는 그들의 환심을 사 새 개발 사업을 계약으로 맡기고, 그 대가로 광물 채취를 위한 토지 접근권을 내주고 일부 규제를 완화하여 이 모든 과정을 원활하게 만들 수 있습니다."
 CAS_focus_capital_computing_corporation: "캐피털 컴퓨팅 코퍼레이션"
 CAS_focus_capital_computing_corporation_desc: "CCC는 컴퓨터와 기술 분야에 주력하는 신흥 기업으로, 최근 경제적·학술적 측면에서 이 분야에 다양한 일자리와 전문 기술을 가져오는 데 두각을 나타냈습니다. 우리는 이들의 확장에 투자하고, 지역 제철소를 지원하여 고층 건물의 건축 자재를 더 저렴하게 하고 장기적으로 미래 개발 수요를 더 지속 가능하게 만드는 일을 도와야 합니다."
 CAS_focus_communicate_cascadia: "커뮤니케이트 캐스캐디아 유한회사"
 CAS_focus_communicate_cascadia_desc: "커뮤니케이트 캐스캐디아는 워싱턴 주 일대에서 시작한 텔레마케팅 및 인터넷 회사였습니다. 시간이 흘러 지역 개발이 인터넷과 휴대전화 및 전화 서비스를 점점 더 필요로 하게 되면서, 이 회사는 전국 규모로 성장하여 우리나라 전체에 혜택을 주었습니다. 이들이 확장하여 국민에게 더 많은 통신 범위와 서비스를 제공하도록 돕는다면 일반 시민의 삶이 이전보다 더욱 나아질 것입니다."
 CAS_focus_policing_expansions_act: "치안 확대법"
 CAS_focus_policing_expansions_act_desc: "치안 확대법, 일명 경찰 플러스법은 주 및 지방 법 집행 기관을 늘리고 보안 기관에 매우 제한적인 권한을 일부 부여하는 예산 및 개혁 법안입니다. 여기에 연구 개발 지출 패키지가 더해지면, 국내외의 악용 세력이 행동에 나서도록 유인하는 고가치 표적 구역을 만들었을 때 이러한 새로운 치안 구상과 그 효과를 시험해 볼 수 있습니다."
 CAS_focus_rocky_mountain_flatlands_act: "로키산맥 평지법"
 CAS_focus_rocky_mountain_flatlands_act_desc: "새로운 자원에 대한 국가적 수요는 국가 안보에 있어 중대한 이해가 걸린 문제입니다. 이러한 자원의 주된 공급원으로 앞으로 해외에 의존하는 일을 막기 위해, 로키산맥 일대를 포함하여 전용 광산 확장을 더 많이 허용할 것입니다. 로키산맥이 자연의 독특한 지형지물인 것은 사실이지만, 우리의 국가적 필요는 수 에이커에 걸친 땅을 차지하는 이러한 것들의 \\"진정한 보존\\"이라는 의사 도덕적 외침보다 중요합니다."
 CAS_focus_future_investments_act: "미래 투자법"
 CAS_focus_future_investments_act_desc: "행복한 기업은 이익을 내는 기업이며, 행복한 노동자가 행복한 기업을 만들고 그것이 좋은 이익을 낳습니다. 나라를 위한 건전하고 성장하는 경제 기반을 확보하려면 현재와 미래 노동자의 복지와 의료에 투자해야 합니다."
 CAS_focus_liberty_victorious: "자유의 승리"
 CAS_focus_liberty_victorious_desc: "국민이 투표를 했고 자유와 자립이 승리를 거두었습니다. 이제 국가 정부를 올바른 아버지와 같은 존재로 빚어 낼 것입니다. 필요할 때는 이끌고 돕되, 자녀, 곧 우리 국민이 스스로 필요한 것을 알기에 스스로 해결하도록 맡겨 두는 존재입니다."
 CAS_focus_yellow_ribbon_care: "옐로 리본 의료"
 CAS_focus_yellow_ribbon_care_desc: "국민의 복지를 보장하는 것은 중요하며, 이를 위해서는 의료 혁신과 서로를 돌보려는 마음을 장려해야 합니다. 은근한 세금 감면과 의료 시설 및 연구에 대한 개인 투자 확대는 미래 세대가 진정으로 서로를 보살필 수 있게 해 줄 것입니다."
 CAS_focus_self_sustainment_act: "자립법"
 CAS_focus_self_sustainment_act_desc: "사람들은 타인을 돌보는 법뿐 아니라 스스로를 돌보는 법도 배워야 합니다. 이를 위해 합법적이고 지속 가능한 방식으로 생계를 꾸릴 수 있는 모든 종류의 수단을 장려해야 합니다. 따라서 현재와 미래 세대에게 더 많은 지식과 경험을 주는 교육 투자가 여기서 핵심적인 역할을 할 것입니다."
 CAS_focus_retirement_earnings_act: "퇴직 소득법"
 CAS_focus_retirement_earnings_act_desc: "평생을 일했다면 노년에는 마침내 쉴 자격이 있습니다. 이에 따라 사회보장 제도를 개혁하여 국가 단위의 401k처럼 운영할 것입니다. 물론 고용과 관련된 401k도 가질 수 있지만, 사회보장세는 이제 소득 신고 및 신고서와 연결된 세무망을 통해 일종의 별도 은행 계좌에 적립됩니다. 따라서 신고하는 해마다 자신이 낸 금액과 그간 쌓은 금액을 확인할 수 있습니다."
 CAS_focus_reindustrialization_act: "재산업화법"
 CAS_focus_reindustrialization_act_desc: "중공업과 경공업은 대부분 대륙의 우리 지역을 떠나 다른 지역이나 해외로 옮겨 갔습니다. 그러나 이제 우리는 아름다운 우리나라에 어떤 형태로든 산업화라는 개념을 되살릴 능력이 있습니다. 취업 박람회와 공공 및 민간 사업을 통한 국가 투자는 우리와 나라가 다시 일터로 돌아가게 해 줄 것입니다."
 CAS_focus_securing_tomorrows_meal: "내일의 식사 확보"
 CAS_focus_securing_tomorrows_meal_desc: "내일은 결코 우리에게 진정으로 약속되어 있지 않으며, 그렇기에 최소한 한 가지, 다음 끼니만큼은 약속하려 합니다. 국내 식량 안보는 새로우면서도 안정된 사회를 위한 중요한 척도이며, 따라서 우리는 농업 사업과 식량 잉여를 진정으로 만들어 낼 더 많은 방법에 투자할 것입니다."
 CAS_focus_limiting_central_banking_authority: "중앙은행 권한 제한"
 CAS_focus_limiting_central_banking_authority_desc: "중앙은행은 본질적으로 나쁜 것은 아니지만, 대출이나 주택담보대출 같은 국가 기능과 관련된 금리의 통제라는 가장 교묘한 형태의 남용에 노출될 수 있습니다. 이에 대한 직접적인 지시 권한을 박탈하고, 계약 내용상 상한과 변경 조건을 명시하는 조건 아래 이를 지방 지점과 기관에 위임하도록 절차를 재규제할 것입니다."
 CAS_focus_reducing_tax_burdens: "세금 부담 경감"
 CAS_focus_reducing_tax_burdens_desc: "세법의 지나치게 까다로운 부분을 줄이면 사람들이 돈을 더 잘 모을 수 있고, 실제로 자기 돈을 원하는 대로 쓸 수 있는 여유도 늘어납니다. 이러한 재정적 안정은 여력이 있는 이들이 어떤 방식으로든 저축하고 투자할 수 있게 해 줄 것입니다. 전반적인 목표는 국내 소비와 투자를 촉진하여 우리가 깎은 만큼을 본질적으로 되돌려 받는 것입니다. 많지는 않겠지만, 우리 능력에 대한 대중의 신뢰를 얻기에는 충분하고도 남을 것입니다."
 CAS_focus_energy_highways: "에너지 고속도로"
 CAS_focus_energy_highways_desc: "우리나라의 지형은 곳곳에 산맥이 널려 있어 개발하기 가장 어려운 편에 속합니다. 따라서 에너지 안보와 국가 연결성을 전반적으로 더 효율적이고 원칙적으로 더 안전하게 만들기 위해 에너지 고속도로를 건설해야 합니다. 이는 분명 적의 표적이 되겠지만, 그러한 예상을 염두에 두고 있으면 여차하면 이를 가장 중요한 미끼로 활용할 수 있습니다."
 CAS_focus_expanded_r_and_d_investments: "연구 개발 투자 확대"
 CAS_focus_expanded_r_and_d_investments_desc: "혁신과 연구는 앞서 나가고 실제 문제를 의미 있는 방식으로 해결하는 길입니다. 우리는 국가와 사회 전반의 여러 측면에 장기적인 순긍정 효과를 낳기를 바라며, 전체 연구 개발 능력을 높이기 위해 공공 및 민간 사업에 더 많이 투자할 것입니다."
 CAS_focus_the_robin_flies_to_victory: "개똥지빠귀는 승리를 향해 난다"
 CAS_focus_the_robin_flies_to_victory_desc: "정의, 평등, 공정. 이 세 가지는 우리가 모두를 돕기 위해 노력할 경제 기반 위에 놓인 세 개의 기둥입니다. 이곳은 모두를 위한 나라이지 한 사람을 위한 나라가 아니기 때문입니다."
 CAS_focus_pro_labor_regulations: "친노동 규제"
 CAS_focus_pro_labor_regulations_desc: "블루칼라 노동자와 현대의 근로자 계층은 우리 경제 기능의 근간입니다. 우리는 그들과 함께하며 그들이 제대로 보살핌을 받고 진정으로 보호받도록 해야 합니다. 결국 행복한 노동자가 더 생산적이고 효율적인 노동자입니다."
 CAS_focus_agrarian_influences: "농본주의의 영향"
 CAS_focus_agrarian_influences_desc: "안정적인 식량 공급은 사회 안정과 노동자와 고용주 간의 결속을 보장하는 핵심 신조입니다. 이 균형을 유지하기 위해 제한적인 형태의 농업 우대 투자를 시행하고, 가능하다면 잉여분 일부를 바이오 연료에 투자할 수도 있습니다. 대단치는 않지만, 정직한 일이라고들 합니다."
 CAS_focus_olympian_technical_institute: "올림피아 기술 연구소"
 CAS_focus_olympian_technical_institute_desc: "OTI는 연방이 후원하는 교육 및 연구 개발 시설로, 혁신 측면에서 국가적 이익을 돕고 미래 세대에게 더 많은 교육 기회를 장려합니다."
 CAS_focus_soldiering_workers_act: "노동자 병사화법"
 CAS_focus_soldiering_workers_act_desc: "모든 노동자는 병사라는 이 말은 싸우는 이가 일할 수 있고 일하는 이가 싸울 수 있다는 것을 구현한 것입니다. 이러한 삶의 호환성은 한쪽은 군사적으로, 다른 한쪽은 경제적으로 사회의 안정을 지킨다는 원칙에 기반합니다. 우리는 1년간의 지원 복무 제도를 도입하여 노동자들이 가족과 가정, 그리고 우리의 삶의 방식을 지킬 수 있도록 화기를 다루고 운용하는 훈련을 받게 할 것입니다."
 CAS_focus_streamlining_tax_codes_and_enforcement: "세법 및 집행 간소화"
 CAS_focus_streamlining_tax_codes_and_enforcement_desc: "세법과 그 집행을 표준화하면 국민과 기업이 개인 또는 기업의 재산과 전체 가치를 더 잘 이해하고, 적응하며, 키울 수 있습니다. 이해와 징수가 쉬워지면 시간이 지남에 따라 세수가 늘어날 것이며, 이 새 세수를 활용해 국민과 경제에 더 많이 되돌려 투자할 수 있기를 기대합니다."
 CAS_focus_mineral_rights_expansion: "광물권 확대"
 CAS_focus_mineral_rights_expansion_desc: "광물권, 그리고 천연자원 채취를 위해 토지를 점유할 수 있는 능력이라는 개념은 상당히 흔한 관행입니다. 우리는 이 권리를 확대하여 지역 주민이 새 사업을 일으키도록 장려하고, 이를 후원하여 광물 자원에서 비롯되는 나라의 부를 늘려야 합니다. 이를 통해 우리가 무역과 상업을 위해 계속 국경 너머로 손을 뻗는 가운데 경제적 독립을 키울 수 있습니다."
 CAS_focus_national_labor_corps: "국가 노동단"
 CAS_focus_national_labor_corps_desc: "NLC는 일자리를 원하거나 필요로 하는 사람이 일자리를 가질 수 있도록 하는 정부 구상입니다. 뉴딜의 노동 기반 기관과 비슷한 방식으로, 도움이 필요한 이들이 인프라와 경제 개발 사업을 유지하고 건설하도록 하여 경제 전반의 안정을 보장할 계획입니다. 기억하십시오. 일만 하고 놀지 않으면 조니가 둔한 아이가 될 수 있지만, 놀기만 하고 일하지 않으면 조니는 가난한 아이가 됩니다."
 CAS_focus_expanding_energy_production_capabilities: "에너지 생산 능력 확충"
 CAS_focus_expanding_energy_production_capabilities_desc: "EEPC법은 전력을 생산하는 새 시설을 만들어 전국 전력망과 사회로서 끊임없이 늘어나는 우리의 수요에 더 많은 전기를 공급하기 위한 전담 예산 편성입니다. 단기적인 해결책이기는 하지만, 토지가 부족한 만큼 이미 지어 놓은 것에서 최대한 많은 것을 끌어낼 방법을 살펴보아야 합니다."
 CAS_focus_cascadian_family_program: "캐스캐디아 가족 사업"
 CAS_focus_cascadian_family_program_desc: "CFP는 우리나라 청소년의 유년기와 성장이 삶의 경제적·기타 영향에 짓눌리지 않도록, 임신 중인 가정과 현재의 가정을 돕는 데 전념합니다. CFP는 유용한 정보를 제공하고, 필요하고 신청한 경우에는 제한적인 물품이나 금전적 지원을 제공하여 가정 전체가 이 시기를 조금 더 수월하게 보낼 수 있도록 노력합니다. 항상 아이들만이 문제인 것은 아니며, 때로는 부모가 자신이 세상에 데려온 아이들만큼, 혹은 그보다 더 많은 관심을 필요로 합니다."
 CAS_focus_nationalist_fever_rises: "민족주의 열기의 고조"
 CAS_focus_nationalist_fever_rises_desc: "선거가 계속되고 국민이 자신의 진정한 필요와 욕구를 말하기 시작하면서, 이제 더 민족주의적인 관점과 가치로 향하는 추세가 보입니다. 일부 온건파와 관망하는 이들은 우려하지만, 우리는 세상이 험난한 곳임을 알기에 이 모든 사태에 어쩌면 일리가 있을지도 모른다고 봅니다."
 CAS_focus_victory_for_strength: "힘의 승리"
 CAS_focus_victory_for_strength_desc: "국민이 말하고 있으며, 그들은 힘을 외치고 단결을 갈망합니다. 따라서 우리는 승리의 고삐를 쥐었고 국민이 바라는 바를 정확히 주겠습니다."
 CAS_focus_family_promotion_programs: "가족 증진 사업"
 CAS_focus_family_promotion_programs_desc: "구 공화국의 실패는 인구, 나아가 경제 자체를 키우기 위해 이민에 의존했다는 점입니다. 우리는 이 실수를 되풀이하지 않을 것입니다. 가족 지원 사업을 만들면 새 가정이 재정적 어려움이나 스트레스의 부담 없이 삶을 누리도록 도울 수 있습니다."
 CAS_focus_automation_developments_act: "자동화 개발법"
 CAS_focus_automation_developments_act_desc: "ADA는 우리나라의 자동화 노력을 발전시키고 키우기 위한 재정 및 예산 패키지입니다. 새 FPP와 맞물려, 노동력이 줄어들 가능성을 보완하는 동시에 장차 노동력이 늘어날 가능성도 내다보며 교육과 전반적인 생산성을 높여야 합니다."
 CAS_focus_national_diversity_act: "국가 다양성법"
 CAS_focus_national_diversity_act_desc: "국가 다양성법은 우리나라의 경제 기반을 키우는 동시에 그 기반을 실제로 이루는 구성을 다양화하는 데 쓰일 경제 개발 패키지입니다."
 CAS_focus_energy_investments: "에너지 투자"
 CAS_focus_energy_investments_desc: "전력 생산 능력을 키우는 국가 투자는 인구와 경제 전반을 모두 확대할 수 있게 해 줍니다."
 CAS_focus_mining_expansion_act: "광업 확대법"
 CAS_focus_mining_expansion_act_desc: "이 법안은 목표로 삼은 광산 부지의 산출량을 늘리는 데 도움이 되도록 새로운 채취 및 정제 기술에 자금을 대는 데 쓰입니다."
 CAS_focus_military_industrial_investments: "군수 산업 투자"
 CAS_focus_military_industrial_investments_desc: "군수 산업 기반을 확대함으로써 우리 국민에게 해를 끼치려는 외부의 적으로부터 나라의 독립을 지킬 수 있습니다."
 CAS_focus_future_leaders_program: "미래 지도자 사업"
 CAS_focus_future_leaders_program_desc: "JROTC 사업과 유사한 사업에 투자함으로써, 미래 세대에게 군대와 규율, 그리고 자신의 행동에 대한 자존감을 접할 기회를 줄 수 있습니다. 이 사업은 미래 세대가 민간 노동 현장에서 지도적 위치에 설 수 있도록 준비시킬 잠재력을 넓히는 데 쓸 수 있으며, 필요한 경우에는 군사적으로도 도움이 됩니다."
 CAS_focus_young_sailors_program: "젊은 선원 사업"
 CAS_focus_young_sailors_program_desc: "젊은 선원 사업은 FLP와 비슷하지만, 해군 및 더 넓은 해운 산업 부문에 초점을 맞춥니다. 우리는 미래 세대에게 소박하면서도 강인한 해군 정신을 심어 주고자 합니다. 해운이 어디서 비롯되었으며 오늘날에도 국가 안보뿐 아니라 우리나라의 경제 기능에 있어서도 핵심 기둥 중 하나인 이유를 이해시키려는 것입니다."
 CAS_focus_expanding_military_civilian_joint_programs: "군·민 공동 사업 확대"
 CAS_focus_expanding_military_civilian_joint_programs_desc: "공동 사업을 확대함으로써 군 인력을 계속 바쁘게 하면서 평시에 경제의 일정 부분을 개선하는 이익을 얻을 수 있습니다."
 CAS_focus_the_scarlet_brigade_marches_to_victory: "진홍 여단, 승리를 향해 행진하다"
 CAS_focus_the_scarlet_brigade_marches_to_victory_desc: "국민은 국가적 자긍심과 자결, 그리고 외세의 간섭에 맞선 자존을 요구했습니다. 이에 우리는 승리를 향해 전진하며, 우리 자신의 필요와 국민의 필요를 스스로 충족하고 외세의 분노와 영향으로부터 자립하는 나라를 보장할 것입니다."
 CAS_focus_penal_labor_corps: "형벌 노동단"
 CAS_focus_penal_labor_corps_desc: "사회의 하수구와도 같은 이들을 쓸모 있게 만들지 않으면 그 하수구를 뚫을 방법을 찾아야 합니다. 이에 사회를 해치려 했던 자들을 갱생시킬 새로운 형벌 노동단을 설립하겠습니다. 이제 그들은 자신이 파괴하고 타락시키려 했던 것을 바로잡고 개선할 수 있습니다."
 CAS_focus_young_cascadians_association: "청년 캐스캐디아인 협회"
 CAS_focus_young_cascadians_association_desc: "YCA는 캐스캐디아의 미래 세대에게 국가적 자긍심과 의무를 심어 주기 위해 설립된 청년 연맹입니다. 이 연맹은 어떤 길을 택하든 규율, 리더십, 자존감에 관한 군사 및 민간 교육을 제공할 것입니다."
 CAS_focus_cascadian_defense_phase_one: "캐스캐디아 방위 1단계"
 CAS_focus_cascadian_defense_phase_one_desc: "CDP, 즉 캐스캐디아 방위 계획은 우리의 낙원에 간섭하려는 모든 외부 위협에 선제적으로 대비하기 위한 국가의 군사화입니다. 1단계는 필요하다면 최소한 전선을 지킬 수 있도록 생산 노력을 끌어올리기 위한 초기 군수 산업화 작업입니다."
 CAS_focus_homefront_is_still_a_front: "후방도 전선이다"
 CAS_focus_homefront_is_still_a_front_desc: "전선에서 싸우려면 먼저 후방에서 싸운다는 것이 어떤 것인지 이해해야 합니다. 이에 따라 국내 산업 수요를 늘리고, 전쟁이 지나치게 길어진다고 느껴질 때에 대비해 민간인을 더 잘 무장시킬 연구 사업에도 투자할 것입니다."
 CAS_focus_cascadian_defense_phase_two: "캐스캐디아 방위 2단계"
 CAS_focus_cascadian_defense_phase_two_desc: "CDP의 2단계는 전략적 자급자족에 중점을 둡니다. 우리가 이전에는 갖고 있지 않았던 일부 핵심 자원을 확보하고, 봉쇄당하더라도 나라가 버틸 수 있도록 해야 합니다."
 CAS_focus_cascadian_defense_phase_three: "캐스캐디아 방위 3단계"
 CAS_focus_cascadian_defense_phase_three_desc: "CDP의 3단계는 탄탄한 국내 식량 공급을 확립하는 것입니다. 조직화된 농업 부문을 확대하고, 소규모 농장에서 생산되는 식량의 질과 양을 개선하는 연구에 더 많은 자금을 투입할 것입니다. 봉쇄당할 가능성이 있더라도 앞서 생각한 덕분에 조금은 더 오래 버틸 수 있을 것입니다."
 CAS_focus_peace_time_lottery_conscription: "평시 추첨 징병"
 CAS_focus_peace_time_lottery_conscription_desc: "PTL은 국민이 잠재적인 군 복무에 익숙해지도록 특정 연령대와 생일이 속한 시기를 무작위로 순환시키는 국가 의무 징병 기간 사업입니다. 이 기간은 4~6개월에 불과하며, 보병 전투 교육에만 국한되지 않습니다."
 CAS_focus_improving_military_logistical_needs: "군 물류 수요 개선"
 CAS_focus_improving_military_logistical_needs_desc: "물류 인프라와 공급망에 투자함으로써 우리 군의 전반적인 생존성과 질을 개선할 수 있습니다."
 CAS_focus_the_first_of_many_victories: "수많은 승리 중 첫 번째"
 CAS_focus_the_first_of_many_victories_desc: "국민은 친구와 가족, 그리고 생계 수단 자체를 지키고 소중히 하기를 바랍니다. 이에 따라 군 내부의 정치 분파가 국가 정부에 승리를 안겨 준 듯합니다. 이 안정 위에서 이제 우리는 사회와 경제를 국민뿐 아니라 군을 위해 복무하도록 재편하여 국방을 정점에 올려놓을 수 있습니다."
 CAS_focus_promoting_strategic_mining: "전략 광업 촉진"
 CAS_focus_promoting_strategic_mining_desc: "표적 투자를 통해 전략적으로 중요한 원자재의 광물 채취를 확대하고 개선할 수 있습니다. 지나치게 외국에 의존하지 않고 전반적인 입지를 개선한다는 우리의 목표는 현실이 될 것입니다."
 CAS_focus_national_economics: "국가 경제"
 CAS_focus_national_economics_desc: "새로운 경제 개발에 대한 폭넓은 투자를 통해 국가 경제를 성장시키고 국민이 스스로 생계를 꾸리도록 일하게 할 수 있습니다. 이는 전반적인 발전이 조금씩 눈덩이처럼 불어나기 시작하는 데 도움이 될 것입니다. 덧붙이자면, 우리는 이를 발판 삼아 충분히 탄탄한 경제 기반을 갖추어, 그만큼 기여한 이들에게 더 많이 돌려줄 수 있기를 바랍니다."
 CAS_focus_establishing_defense_industry: "국방 산업 구축"
 CAS_focus_establishing_defense_industry_desc: "외세의 간섭으로부터 나라의 독립을 지키려면 어떤 형태로든 군산복합체를 확보해야 합니다. 이를 위해 그러한 것을 만들기 위한 국가 투자를 시작할 것입니다."
 CAS_focus_setting_up_mandatory_conscription: "의무 징병제 도입"
 CAS_focus_setting_up_mandatory_conscription_desc: "우리 쪽이든 적의 쪽이든 어떠한 침략에도 나라를 선제적으로 대비시키려면, 우리 인력이 안정적이고 예상보다 많도록 해야 합니다. 따라서 6개월의 의무 징병 기간은 어떤 상황에서도 우리의 국가 이익을 지킬 수 있게 해 줄 것입니다."
 CAS_focus_automation_conscription_act: "자동화 징병법"
 CAS_focus_automation_conscription_act_desc: "ACA 법안은 특정 산업을 최대한 자동화하고, 그 대가로 해고된 노동력을 징집하기 위한 지출 패키지입니다. 다만 새로운 \\"강제 징집\\" 병사들은 원한다면 보급, 통신, 행정 등 더 많은 예비 직위를 살펴볼 수 있습니다."
 CAS_focus_general_military_investments: "일반 군사 투자"
 CAS_focus_general_military_investments_desc: "GMI는 우리 군의 능력을 전반적으로 향상시키기 위한 전담 지출 패키지입니다. 이에 따라 참모진과 장교단이 받는 훈련을 개선하는 데도 추가 자금이 배정됩니다. 이는 우리나라가 이 단기 투자의 초기 성과는 물론 장기적으로도 혁신하고 군을 개선할 수 있게 해 줄 것입니다."
 CAS_focus_army_funding_improvements: "육군 재정 개선"
 CAS_focus_army_funding_improvements_desc: "육군에 대한 재정 지원을 늘림으로써 육군 복무 인원의 전투 능력을 높이는 데 도움이 될 훈련 과정을 개선할 수 있습니다."
 CAS_focus_naval_funding: "해군 재정 지원"
 CAS_focus_naval_funding_desc: "전담 해군 재정 지원을 늘리면 무기 체계와 훈련 과정을 개선하여 해군 함정의 생존성과 전투력을 높일 수 있습니다."
 CAS_focus_air_force_investments: "공군 투자"
 CAS_focus_air_force_investments_desc: "공군에 대한 일반 재정 지원은 기존 항공기를 개선하고 신규 조종사 훈련을 강화할 수 있게 해 줍니다. 아울러 공군의 전투력을 강화하는 방안으로서 공격과 방어 양면에서 생존성 조치를 개선하기 위한 제한적인 연구 개발에도 투자할 수 있습니다."
 CAS_focus_modern_victory_for_old_ideas: "옛 사상을 위한 현대의 승리"
 CAS_focus_modern_victory_for_old_ideas_desc: "승리는 언제나 하우스의 몫이며, 이번 경우에도 그렇습니다. 올림피아 가문으로 알려진 현대 군주주의 운동이 선거에서 승리를 거두었습니다. 민주적 정부 조직은 그대로 두되 관직 명칭만 옛 봉건 직함에 맞게 겉으로만 바꾼 현대적 선출 군주제를 수립할 기반이 마련되었습니다. 이제 엄마 아빠가 왕자나 공주가 될 것이라고 거짓말하는 일은 없을 것입니다."
 CAS_focus_modernizing_nobility_act: "귀족 현대화법"
 CAS_focus_modernizing_nobility_act_desc: "현대적 군주제를 수립하려면 먼저 귀족이 무엇인지 재정의해야 합니다. 이 제도의 전통적 의미는 기껏해야 매우 번거롭기 때문입니다. 따라서 캐스캐디아의 귀족은 얻을 수 있는 작위로 이루어진 계층 제도가 될 것입니다. 주요 작위는 각각의 선출직과 연계됩니다. 그러나 각 사회 계층에도 자신의 귀족 작위를 얻는 방법에 대한 개요가 마련될 것입니다."
 CAS_focus_reorganizing_traditional_military_ranks: "전통 군 계급 재편"
 CAS_focus_reorganizing_traditional_military_ranks_desc: "현대 군대는 대규모 부대 중심이거나 소규모 부대 중심인 편제가 뒤섞여 있습니다. 그렇다면 계급 구조를 확대하고 재편하여 부대 유형과 규모 단계를 전반적으로 늘리면 어떨까요? 이를 위해서는 부사관은 물론 일반 장교 계급도 늘려야 할 가능성이 높으며, 그에 따라 다양한 지휘 단계에 대한 더 역동적인 충원이 장려될 것입니다."
 CAS_focus_the_new_nation: "새로운 국가"
 CAS_focus_the_new_nation_desc: "옛 재의 깊은 곳에서 새로운 나라와 국민이 일어설 것입니다. 우리는 이제 캐스캐디아 연합 공국이며, 캐스캐디아 국민이며, 우리의 집과 가족, 삶의 방식을 지켜 낼 것입니다."
 CAS_focus_developing_new_settlements: "신규 정착지 개발"
 CAS_focus_developing_new_settlements_desc: "새로운 정착지와 지역 경제를 조성함으로써 인구를 더 잘 분산시킬 수 있으며, 적이 우리 해안과 땅에 쳐들어올 경우 국가로서 더 분산된 형태를 갖출 수 있습니다."
 CAS_focus_defense_towns: "방어 도시"
 CAS_focus_defense_towns_desc: "띄엄띄엄 있거나 무시할 만한 정착지를 겨냥하여 방위 산업 계약업체가 시설을 짓도록 장려하고, 지역 주민 혹은 인근의 다른 이들까지 새로운 마을과 잠재적인 도시를 만들도록 장려하면 더욱 역동적인 물류가 가능해집니다. 이 지역들에는 이렇다 할 개발이 없으므로 우리가 개발을 가져다줄 것입니다. 말하자면 우리가 지으면 그들이 올 것입니다."
 CAS_focus_cascade_redoubts: "캐스케이드 보루"
 CAS_focus_cascade_redoubts_desc: "전략적인 산악 보루를 구축하면 잠재적인 후퇴선을 확보할 수 있고, 이러한 새로운 군사 건설 지역을 이끌 인프라와 경제 개발도 장려할 수 있습니다."
 CAS_focus_green_mountain_guards: "녹색 산악 방위대"
 CAS_focus_green_mountain_guards_desc: "주방위군 제도와 비슷하지만, 이 비상근 인력은 현역에서 퇴역했으면서도 여전히 즉응 태세의 일원으로 남고자 하는 이들을 위한 것입니다. 따라서 GMG 복무 부문은 참모단의 하위 부문이며, 가능한 때와 장소에서는 세 주요 군종의 부대를 모두 포함할 수 있습니다."
 CAS_focus_expanding_military_industries: "군수 산업 확대"
 CAS_focus_expanding_military_industries_desc: "군수 산업 기반을 확대함으로써 국가로서의 방어 능력, 그리고 필요하다면 공격 능력도 높일 수 있습니다."
 CAS_focus_cascadian_power: "캐스캐디아의 전력"
 CAS_focus_cascadian_power_desc: "새로운 시설, 그리고 에너지를 찾고 만들고 사용하는 물류와 수단에 대한 전략적 투자를 통해 에너지 네트워크를 키워 경제와 국민의 삶의 질을 전반적으로 개선할 수 있습니다."
 CAS_focus_cascadian_economy: "캐스캐디아 경제"
 CAS_focus_cascadian_economy_desc: "이제 우리는 어느 정도 정신을 차렸으니, 국가 경제를 재건하고 사회를 괴롭히는 주요 문제들을 바로잡기 시작할 수 있습니다."
 CAS_focus_strategic_autarky_economy: "전략적 자급자족 경제 계획"
 CAS_focus_strategic_autarky_economy_desc: "SAEP는 경제와 그 운영 방식에 대한 국가 재정의 포괄적인 재활성화가 될 것입니다. 세부 사항은 아직 다듬어야 하지만, 요컨대 전 세계적으로 통합된 경제에 전적으로 다시 몰두하기보다 전반적으로 우리 스스로에게 더 의존하고자 합니다."
 CAS_focus_creating_a_real_agricultural_sector: "진정한 농업 부문 육성"
 CAS_focus_creating_a_real_agricultural_sector_desc: "굽이치는 언덕과 산맥 때문에 우리에게는 직접 개발할 수 있는 경작지가 많지 않습니다. 의미 있는 인구 증가를 진정으로 지탱하려 한다면 농업을 어떻게 발전시킬지 깊이 고민해야 합니다."
 CAS_focus_experimental_idaho_farms: "아이다호 실험 농장"
 CAS_focus_experimental_idaho_farms_desc: "아이다호 주의 땅은 광업과 기타 개발에 더 적합합니다. 따라서 이 주에 있는 농경지는 가능한 한 혁신과 효율에 맞추어야 합니다. 아이다호 농업은 우리나라 농업의 실험 부문이 될 것입니다. 물론 여전히 낼 수 있는 곳에서 낼 수 있는 만큼은 공급하겠지만, 어떤 형태로든 자급자족을 추구한다면 이미 가진 것을 키우기 위한 상당한 연구 개발이 있어야 합니다."
 CAS_focus_washington_pasture_products_and_more: "워싱턴 목초 제품 외"
 CAS_focus_washington_pasture_products_and_more_desc: "일반 목초 제품을 개발하면 대체 연료도 실험해 볼 수 있습니다. 에탄올은 휘발유의 직접 사용을 줄이는 상당히 흔한 수단입니다. 그러나 엔진 부품을 그리 해치지 않으면서 에탄올 사용을 더 지배적으로 확대할 수 있다면, 자급자족에 대한 농업적·과학적 영향을 한층 넓힐 수 있습니다."
 CAS_focus_oregon_vertical_farming_techniques: "오리건 수직 농법 기술"
 CAS_focus_oregon_vertical_farming_techniques_desc: "수직 농법의 발전을 밀어붙이면 이 시설에서 실제로 재배되는 식품을 다양화하고 늘릴 수 있습니다. 부수적인 이점으로, 이 농장들은 도움이 필요한 이들에게 적절하고 풍부한 영양을 공급함으로써 의료 시설과 복지 사업을 개선하는 데 도움이 될 것입니다."
 CAS_focus_mountain_agriculture_planning: "산악 농업 계획"
 CAS_focus_mountain_agriculture_planning_desc: "MAP는 우리가 기울인 노력의 결실입니다. 재정과 연구 양면에서 폭넓은 노력을 기울인 끝에, 이제 특정 지형에 전적으로 의존하지 않는 농업 부문을 만들 수 있게 되었습니다. 물론 완벽하지는 않지만 늘어나는 인구를 제대로 부양하기에는 충분합니다."
 CAS_focus_civilian_centric_economics: "민간 중심 경제"
 CAS_focus_civilian_centric_economics_desc: "CCE는 나라의 경제 발전을 위한 전담 국가 방침입니다. 요컨대 군사 위주가 아닌 민간 중심 일자리에 초점을 맞추는 것이 목표입니다. 다시 말해 인접 영토의 정복을 염두에 둔 경제가 아니라, 더 전통적이면서도 다양한 경제입니다."
 CAS_focus_home_grown_tech: "토착 기술"
 CAS_focus_home_grown_tech_desc: "기술 부문의 기초를 마련함으로써 연구 개발 능력을 넓히고, 그 혁신을 통해 경제 전체를 더 낫게 할 수 있습니다."
 CAS_focus_societal_workforce_program: "사회 노동력 사업"
 CAS_focus_societal_workforce_program_desc: "SWP는 국가 차원의 대규모 일자리 및 고용 사업입니다. 이 광범위한 사업은 복지, 의료와 정부의 직접 재정 지원을 결합한 공동 재정 구상을 활용해 가능한 한 누구든 모두를 위해 일자리를 만들고 고용할 것입니다. 안정을 가져오는 동시에 경제의 국가적 균형에 대한 장기적 영향도 살피는 것이 주된 희망입니다."
 CAS_focus_how_high_can_our_sky_rise: "우리의 하늘은 얼마나 높이 솟을까"
 CAS_focus_how_high_can_our_sky_rise_desc: "사무 및 기업 부문의 전반적인 개발은 국민이 기술 지향적 일자리와 기타 화이트칼라 일자리를 다양하게 접할 수 있게 해 줄 것입니다. 이는 국민 전체를 위한 추가 교육 사업을 장려하고, GDP와 화폐 가치에 의미 있는 상승을 가져오며, 이 모든 개발에 드는 비용을 상쇄하는 데에도 도움이 되기를 바랍니다."
 CAS_focus_greater_olympian_development_scheme: "대올림피아 개발 계획"
 CAS_focus_greater_olympian_development_scheme_desc: "GODS는 대수도권 일대의 전반적인 경제 확장입니다. 우리는 이 경제력의 중심지가 영향력을 키워 주변 마을과 도시, 심지어 우리가 지배하는 인접 영토까지 성장시키는 연쇄 효과를 낳기를 바랍니다."
 CAS_focus_industrialize_cascadia: "캐스캐디아 산업화"
 CAS_focus_industrialize_cascadia_desc: "전반적인 개발 계획을 통해 일자리 시장과 산업 다양성을 키울 수 있습니다. 국민을 고용하는 일은 그 어느 때보다 쉬워질 것이며, 국가 경제의 순조롭고 이로운 성장을 위한 토대를 마련할 것입니다."
 CAS_focus_improving_naval_and_shipping_industries: "해군 및 해운 산업 개선"
 CAS_focus_improving_naval_and_shipping_industries_desc: "해양 산업에 대한 전반적인 개발은 전국적으로 대체로 이로운 효과를 낼 것입니다. 첫째, 전체 경제를 성장시키고 그 경제의 다각화를 지속합니다. 둘째, 군사적 수요가 생길 때 그 잠재적 수요를 충족하는 데에도 도움이 됩니다. 마지막으로, 주된 쟁점은 군수 산업 일자리가 채워지고 창출되는 것이겠지만, 새로운 기업 및 민간 혹은 \\"블루칼라\\" 일자리와 관련된 파급 효과는 모두를 밑바닥부터 성장시킵니다."
 CAS_focus_developing_a_domestic_arms_industry: "국내 무기 산업 육성"
 CAS_focus_developing_a_domestic_arms_industry_desc: "무기 산업의 핵심 취지는 군을 무장시키는 것이지만, 실제로는 민간 시장도 상당합니다. 사냥꾼, 법 집행 기관, 보안 경력을 가진 연방 기관들도 임무를 수행하려면 무기가 필요합니다. 가정 방어와 자기 방어 수단도 잊어서는 안 됩니다. 이는 국민에게 더 많은 고용 경로를 열어 주므로 전반적으로 모든 면에서 이익이 될 것입니다."
 CAS_focus_continued_diversification_efforts: "다각화 노력 지속"
 CAS_focus_continued_diversification_efforts_desc: "CCE 사업의 막바지에 접어들면서, 국민을 위한 고용 기회를 복합적으로 늘릴 수 있도록 경제 다각화를 우선시해야 합니다."
 CAS_focus_a_true_economy: "진정한 경제"
 CAS_focus_a_true_economy_desc: "이 훌륭한 경제를 지켜 내려면 그 미래에 투자해야 합니다. 그 미래는 캐스캐디아를 고향으로 삼는 국민이며, 우리 모두가 일궈 낸 것을 그들도 누릴 수 있도록 바로 이 국민에게 투자할 것입니다."
 CAS_focus_militarized_economy_plan: "군사화 경제 계획"
 CAS_focus_militarized_economy_plan_desc: "우리나라는 작고 대륙과 더 넓은 세계는 더 불안정한 곳이 되었습니다. 따라서 경제 문제를 해결할 신속한 방안을 찾아야 합니다. 가장 빠른 길은 일자리가 군의 확장과 성장을 중심으로 돌아가는 군사화 경제를 만드는 것입니다. 지속 가능성이 크지는 않지만, 이후 경제를 진정으로 재편하는 데 쓸 수 있는 제한적인 확장 계획에 시동을 거는 데는 도움이 될 것입니다."
 CAS_focus_cascadian_corps_of_engineers_program: "캐스캐디아 공병단 사업"
 CAS_focus_cascadian_corps_of_engineers_program_desc: "CCoE는 군과 민간이 함께하는 사업으로, 나라를 재건하고 개발 노력을 가속하기 위해 힘을 합칠 수 있게 합니다. 또한 민간인이 \\"죽을 수도 있다\\"는 점을 본능적으로 걱정하지 않고 군에 합류할 기회도 줍니다."
 CAS_focus_idaho_innovations: "아이다호 혁신"
 CAS_focus_idaho_innovations_desc: "아이다호 부문은 연구 개발 요소와 일반 무기 생산으로 구성됩니다. 우리는 화기에 대한 지역 수요를 촉발하고 고용 문제 해결에 시동을 걸기를 바랍니다."
 CAS_focus_oregon_armaments: "오리건 군수"
 CAS_focus_oregon_armaments_desc: "OA 위원회는 오리건 주의 고용을 보장하고 지역 개발과의 조율을 도울 것입니다. 이 초기 단계에서는 대단치 않겠지만, 없는 것보다는 낫습니다."
 CAS_focus_washington_war_machines: "워싱턴 전쟁 기계"
 CAS_focus_washington_war_machines_desc: "수도 지역인 워싱턴은 가장 값비싼 전쟁 기계를 건조하는 책임을 맡을 것입니다. 이를 통해 고용을 보완하고, 주민들이 임금 등을 얻으면서 지역 개발이 더 촉진되기를 기대합니다."
 CAS_focus_oregon_shipping: "오리건 해운"
 CAS_focus_oregon_shipping_desc: "오리건 해운 주식회사는 나라의 해군 수요를 충족하는 동시에 상업 해운과 기타 해양 관련 산업을 확립하기 시작하는 다목적 사업입니다. 해군 개발의 장점은 모두가 더 평등하게 몫을 가져갈 수 있다는 것입니다."
 CAS_focus_washington_naval_industries: "워싱턴 해군 산업"
 CAS_focus_washington_naval_industries_desc: "워싱턴의 지속적인 개발은 경제 개발의 눈덩이 효과를 이어 가게 해 줍니다. 좋은 점은 해군 산업이 육상 기반 군수 산업에 비해 훨씬 더 범용적이라는 것입니다."
 CAS_focus_establishing_basic_industries: "기초 산업 구축"
 CAS_focus_establishing_basic_industries_desc: "우리가 시도한 도박에도 불구하고, 어떤 도박도 대비책 없이는 온전하지 않습니다. 따라서 가장 기본적인 것만은 충족되도록 제한적인 민간 개발을 실시하겠습니다."
 CAS_focus_establishing_basic_tech_industries: "기초 기술 산업 구축"
 CAS_focus_establishing_basic_tech_industries_desc: "어떤 식으로든 경제를 활용하려면 민간 부문의 혁신 분야에 투자해야 합니다. 어느 경제에서든 기술 부문은 대체로 경제적·기술적 혁신과 돌파구를 이루는 소규모의 정수입니다. 완전히 군사화된 경제는 폭넓은 혁신을 이루지 못하겠지만, 작은 부문만 한정해 두면 전체 패키지를 얻을 수 있습니다."
 CAS_focus_an_economy_with_a_state: "국가를 가진 경제"
 CAS_focus_an_economy_with_a_state_desc: "이제 우리나라의 경제는 거의 궤도에 올랐으므로, 우리의 필요와 수단을 확보하고 균형을 맞추기 위해 지평선 너머를 내다보기 시작할 수 있습니다. 모두를 위한 더 밝은 미래, 그리고 우리가 누릴 더 단합된 미래를 위하여."
 CAS_focus_powering_the_nation: "국가에 동력을 공급하기"
 CAS_focus_powering_the_nation_desc: "경제를 세우고 사람들을 다시 일터로 돌려보내는 것은 모두 좋고 훌륭하지만, 무언가를 돌릴 전기가 없으면 아무것도 할 수 없습니다. 물론 증기 시대로 돌아간다면 모르겠지만, 이야기가 샜군요."
 CAS_focus_bringing_washington_online: "워싱턴 전력 연결"
 CAS_focus_bringing_washington_online_desc: "인프라와 새로운 발전 시설에 대한 초기 투자는 수도 주인 워싱턴에 더 균형 잡힌 전력망을 가져다줍니다. 대단치는 않지만 다른 많은 민간 서비스와 경제 자체를 가동하는 데 도움이 될 것입니다."
 CAS_focus_bringing_idaho_online: "아이다호 전력 연결"
 CAS_focus_bringing_idaho_online_desc: "일종의 국가 전력망을 하나로 묶으려는 우리의 지속적인 노력은 아이다호 주로 이어집니다. 가장 큰 장애물은 캐스케이드 산맥과 로키 산맥을 넘어 사업을 진행하는 것입니다. 그러나 결국 우리는 상황을 안정시키고 구축하여 모든 것이 자리를 잡도록 도울 것입니다."
 CAS_focus_bringing_oregon_online: "오리건 전력 연결"
 CAS_focus_bringing_oregon_online_desc: "국가 전력망을 정식화하는 작업을 이어 가며 오리건 주로 넘어갑니다. 이 주를 연결하면 수도 지역과 이어질 수 있고, 경제와 민간 서비스를 포함한 모든 형태의 국가 활동을 늘리는 데 도움이 될 것입니다."
 CAS_focus_stabilizing_the_national_grid: "국가 전력망 안정화"
 CAS_focus_stabilizing_the_national_grid_desc: "집중적인 노력 끝에 우리는 국가 전력망을 가동하여 필요한 거의 모든 곳에 연결할 수 있었습니다. 물론 완벽하지는 않으며 미래의 수요도 확신할 수 없습니다. 그러나 우리는 경제를 일구고, 국민을 보살피고, 실제로 현대 사회로서 기능할 수 있는 기준선을 확보했습니다."
 CAS_focus_raising_the_northern_pacific_flag: "북태평양의 깃발을 올리다"
 CAS_focus_raising_the_northern_pacific_flag_desc: "노던 퍼시픽 철도를 재건함으로써 우리나라 철도망의 미래를 확보할 수 있습니다."
 CAS_focus_northern_pacific_southern_route: "노던 퍼시픽 남부 노선"
 CAS_focus_northern_pacific_southern_route_desc: "오리건 주 세일럼과 유진에서 아이다호 주 보이시에 이르는 전용 남부 노선을 건설함으로써 나라와 국민을 더 잘 연결할 새로운 길을 다질 수 있습니다."
 CAS_focus_northern_pacific_rocky_mountain_route: "노던 퍼시픽 로키산맥 노선"
 CAS_focus_northern_pacific_rocky_mountain_route_desc: "아이다호 주도 보이시를 워싱턴 주 스포캔과 연결함으로써, 이제 국가 경제를 가동하기 위한 상당한 규모의 보급 및 물류망을 구축할 수 있습니다."
 CAS_focus_northern_pacific_beyond_boise_route: "노던 퍼시픽 보이시 너머 노선"
 CAS_focus_northern_pacific_beyond_boise_route_desc: "나라의 가장 외곽 정착지까지 철도 연결을 구축함으로써, 국경 너머의 구상에 대비하거나 선제 타격에 나설 준비도 할 수 있습니다."
 CAS_focus_excavating_the_nation: "국토 발굴"
 CAS_focus_excavating_the_nation_desc: "우리나라는 작지만 활용할 수 있는 천연자원이 여기저기 있습니다. 진정으로 제대로 기능하는 경제를 일굴 기회를 얻으려면 건전하고 전반적인 투자를 해야 합니다."
 CAS_focus_wenatchee_iron_works_complex: "웨나치 제철 단지"
 CAS_focus_wenatchee_iron_works_complex_desc: "우리나라가 보유한 철광석을 중심으로 핵심 광업 단지를 조성하면 수많은 제품을 만들 수 있습니다. 강철은 말할 것도 없으며, 철을 사용하는 제품은 콘크리트 다음으로 가장 많이 소비되는 제품 중 하나입니다."
 CAS_focus_yakima_bauxite_mills: "야키마 보크사이트 제련소"
 CAS_focus_yakima_bauxite_mills_desc: "보크사이트는 알루미늄으로 가공되는 주된 광석으로, 옛 미국인들은 이를 'Aluminum'이라 불렀습니다. 신문을 찍기 전에 철자 검사를 하지 않던 1800년대는 사랑스러울 따름입니다. 어쨌든 보크사이트와 기타 경량 소재 광석은 곧 채굴, 가공되어 경제를 전례 없는 규모로 성장시키고 다각화하는 데 쓰일 것입니다."
 CAS_focus_making_a_valley_out_of_a_mountain: "산을 골짜기로 만들다"
 CAS_focus_making_a_valley_out_of_a_mountain_desc: "RMMC, 즉 로키산맥 광업 회사의 설립은 기술 기반 금속을 발굴하고 확대하는 초석입니다. 마이크로칩 등을 만드는 데 도움이 되는 것들은 우리의 효율과 국내 기반 전체를 키워 줄 것입니다."
 CAS_focus_growing_the_precious_metals_sector: "귀금속 부문 육성"
 CAS_focus_growing_the_precious_metals_sector_desc: "금, 보석과 기타 희귀 광물은 상당한 경제적 지렛대를 얻는 좋은 방법입니다. 이에 따라 오스뮴 같은 희귀 광석도 탐사해 볼 만합니다. 더 찾기 어려운 것들은 나중에 생각하고, 지금은 국내 수요를 충족해야 하며 우리에게는 그럴 땅이 있습니다."
 CAS_focus_investing_in_fossil_fuel_developments: "화석 연료 개발 투자"
 CAS_focus_investing_in_fossil_fuel_developments_desc: "워싱턴에는 석탄이, 오리건에도 석탄이, 아이다호에는 석탄과 석유가 있습니다. 각 석유화학 산업을 위한 적절하고 내구성 있는 합성 소재를 만드는 방법을 찾을 때까지는, 한정된 이 잠재 자원을 확대하고 투자할 수밖에 없습니다. 하지만 당분간은 국내 수요를 재편하고 균형을 맞출 수 있을 때까지 당장의 호황을 만들 토대를 마련합니다."
 CAS_focus_strategic_rubber_production_facilities: "전략 고무 생산 시설"
 CAS_focus_strategic_rubber_production_facilities_desc: "전문 기후 시설의 고무나무든 갖가지 합성 방식이든 우리에게는 고무와 고무 기반 제품이 필요합니다. 국민의 수요와 잠재적 군사 수요는 나라의 독립 전체를 진정으로 생각할 때 비용을 능가합니다."
 CAS_focus_natural_resource_institute_of_cascadia: "캐스캐디아 천연자원 연구소"
 CAS_focus_natural_resource_institute_of_cascadia_desc: "NRIC는 천연자원의 진흥과 확대에 전념하는 과학 시설입니다. 우리는 큰 나라가 아니지만, 생산 및 채굴 방식을 더 효율적으로 만들어 이미 가진 것을 혁신하고 확대할 수 있다면 어떨까요. 합성 소재의 세계는 말할 것도 없고, 우리는 어쩌면 세계 최초로 진정한 자급자족 국가가 될지도 모릅니다. 물론 이는 원대하고 이상향 같은 꿈이지만, 꿈은 결코 나쁜 것이 아니며 내일을 위한 동기를 부여하는 수단일 뿐입니다."
 CAS_focus_cascadian_military: "캐스캐디아군"
 CAS_focus_cascadian_military_desc: "우리가 차지한 지형은 우리 존재에 구원이 될 수도, 해가 될 수도 있습니다. 따라서 캐스캐디아 군을 공식화하면, 최소한 우리가 지배하는 바로 이 땅을 지킬 수 있는 군사력을 빚어내고 만들 수 있습니다."
 CAS_focus_mountaineering_army: "산악 육군"
 CAS_focus_mountaineering_army_desc: "CA, 즉 캐스캐디아 육군은 우리 영토를 지배하는 산맥이 낳은 군종입니다. 따라서 적군이 들이닥쳤을 때 이러한 전술 지식이 헛되이 쓰이지 않도록 훈련 노력을 전반적으로 간소화해야 합니다."
 CAS_focus_filling_in_logistical_holes: "물류 공백 메우기"
 CAS_focus_filling_in_logistical_holes_desc: "제대로 기능하는 군은 고사하고 육군이라도 갖추려면, 현재 상황을 그토록 비효율적으로 만들고 있는 보급 문제와 징발 문제부터 바로잡아야 합니다."
 CAS_focus_streamlining_personnel_placement: "인원 배치 간소화"
 CAS_focus_streamlining_personnel_placement_desc: "인사 위원회와 물류단의 노력이 합쳐지면서 이제 우리는 노력을 통합할 수 있게 되었으며, 병사들이 필요한 것을 받고 필요한 곳에 배치되는 과정이 더욱 매끄럽고 효율적일 것으로 기대합니다."
 CAS_focus_expanding_training_camps: "훈련소 확충"
 CAS_focus_expanding_training_camps_desc: "나라를 제대로 방어할 만한 수를 확보하려면 훈련 시설 전반을 확충하고 개선해야 합니다."
 CAS_focus_codifying_equipment_standardizations: "장비 표준화 성문화"
 CAS_focus_codifying_equipment_standardizations_desc: "새로운 장비를 부대에 보급하는 것은 언제나 최우선 과제이지만, 전장에 이르기 전까지 부대의 결속력과 경험이 동등한 수준이 되도록 하는 것도 지휘부의 책임입니다. 따라서 야전 장구와 무기를 표준화하면 더 효율적으로 훈련하고 물류망의 일부 과도한 사용을 억제할 수 있습니다."
 CAS_focus_targeted_motorization_efforts: "표적 차량화 노력"
 CAS_focus_targeted_motorization_efforts_desc: "TME는 우리의 첫 차량화 장비를 어디에 배정할지 정한 우선순위 목록입니다. 물류와 병력의 일반 대량 수송 같은 분야는 충분한 병력을 전장에 투입하고 국경을 지키려는 우리의 노력을 계속할 수 있게 해 줄 것입니다."
 CAS_focus_general_refinement_programs: "일반 숙련 사업"
 CAS_focus_general_refinement_programs_desc: "훈련 기준을 확보하고 습득한 기술을 유지하는 것은 전투 우수성의 새로운 기준선을 유지하고 만들어 내는 좋은 방법입니다."
 CAS_focus_army_defensive_strategy: "육군 방어 전략"
 CAS_focus_army_defensive_strategy_desc: "대체로 고립된 우리의 위치 때문에, 대륙으로부터의 어떠한 침입에서도 살아남으려면 더욱 방어적인 정신을 길러야 합니다."
 CAS_focus_strengthening_defensive_counter_measures: "방어 대응책 강화"
 CAS_focus_strengthening_defensive_counter_measures_desc: "현대 육군은 다양한 수단을 갖추고 있으며, 이를 알기에 그러한 수단에 대한 대응책에 더 투자해야 합니다. 연약한 인간이 전차를 손쉽게 파괴할 수는 없으니, 그들에게 파괴의 수단을 쥐여 줍시다."
 CAS_focus_anti_air_developments: "대공 개발"
 CAS_focus_anti_air_developments_desc: "선제적 대공 체계에 투자함으로써 병사들의 생존성을 높이고, 그 생존성을 통해 전투 경험도 쌓을 수 있습니다."
 CAS_focus_defense_social_benefit_contracts: "국방 사회 혜택 계약"
 CAS_focus_defense_social_benefit_contracts_desc: "육군 내에 DSBC 부서를 설립하면 나라를 지키는 것 이상의 이유로 입대하도록 더 잘 장려할 수 있습니다. 불확실성에 대한 이 선제 조치는, 육군에 입대하는 사람이 병사와 직계 가족을 위한 금전적, 복지 및 의료 혜택의 일정 기준을 정한 법적 구속력 있는 계약에 서명할 수 있다는 뜻입니다. 전쟁이 발생하면 이 혜택은 상황에 따라 배우자나 가까운 친족에게 즉시 이전됩니다."
 CAS_focus_aggression_strategy: "공세 전략"
 CAS_focus_aggression_strategy_desc: "우리의 입지는 앉아서 기다리는 시한폭탄과 같으며, 이 어려운 시기에 진정으로 어딘가에 이르려면 공세로 나서야 합니다."
 CAS_focus_emphasis_on_mobility: "기동성 중시"
 CAS_focus_emphasis_on_mobility_desc: "육군의 기동 요소를 촉진하면 기동성과 공격 능력이 크게 높아져 적의 의사 결정 능력을 압도할 가능성이 커집니다."
 CAS_focus_rearming_soldiers: "병사 재무장"
 CAS_focus_rearming_soldiers_desc: "병사들의 표준 장비를 더 공격 지향적으로 바꾸면 병사들이 앉아서 지키기보다 공격할 준비를 더 잘 갖추게 할 수 있습니다."
 CAS_focus_securing_dedicated_conscription: "전담 징병 확보"
 CAS_focus_securing_dedicated_conscription_desc: "징병 노력을 개선하고 징병 요건을 다듬으면, 특히 전선이 알려진 예상 범위를 넘어 확대될 경우에도 필요한 인원을 유지할 수 있습니다."
 CAS_focus_all_terrain_combat_training: "전 지형 전투 훈련"
 CAS_focus_all_terrain_combat_training_desc: "병력을 가능한 한 다양한 유형의 지형에 노출시킬 새로운 전투 훈련 시설을 구축함으로써, 전반적인 전투 능력에서 훈련과 적응력의 새로운 기준을 세웁니다."
 CAS_focus_cascadian_navy: "캐스캐디아 해군"
 CAS_focus_cascadian_navy_desc: "CN 군종은 연안 방어의 초석입니다. 우리가 가진 함선을 활용하여 이 함선들과 승조원을 재편하고 정비하며 새로운 힘의 역학을 만들어야 합니다. 태평양의 진주가 밝게 빛날 것입니다."
 CAS_focus_updating_fleet_logistics: "함대 물류 개선"
 CAS_focus_updating_fleet_logistics_desc: "수리와 정비에는 자재와 인력, 그리고 원자재가 필요합니다. 제대로 기능하는 해군 전력을 갖추려면 우리의 강력한 해군 기계의 이 중요한 톱니바퀴를 고쳐야 합니다."
 CAS_focus_remodeling_training_facilities: "훈련 시설 개조"
 CAS_focus_remodeling_training_facilities_desc: "낡은 시설을 갱신하고 현대화함으로써 인원의 질과 그들의 조함 능력, 그리고 배치된 해군 함정에 대한 숙달도를 높일 수 있습니다."
 CAS_focus_navy_personnel_advancements_training: "해군 인원 진급 훈련"
 CAS_focus_navy_personnel_advancements_training_desc: "해군 인원이 계급과 책임의 진급에 대비하도록 훈련 사업을 늘리면, 소규모 함대 내에서 무기 체계를 더 효율적으로 다루고 협조할 수 있게 됩니다."
 CAS_focus_fixing_outdated_propulsion_systems: "낡은 추진 체계 수리"
 CAS_focus_fixing_outdated_propulsion_systems_desc: "추진 체계에 대한 정비가 거의 이루어지지 않았으며, 이는 용납할 수 없는 일입니다. 이 핵심 부품을 수리하여 해군 전력에 싸울 기회를 주어야 합니다."
 CAS_focus_standardizing_repair_facilities: "수리 시설 표준화"
 CAS_focus_standardizing_repair_facilities_desc: "건선거 시설을 표준화함으로써 손상되거나 파손된 함정을 수리하는 능력을 높일 수 있습니다. 이는 가동 중단 시간이 줄고 우리 해역에 나타난 적에게 더 신속하게 대응할 수 있다는 뜻입니다."
 CAS_focus_weapons_system_task_force: "무기 체계 기동대"
 CAS_focus_weapons_system_task_force_desc: "수리와 교체를 전담하는 팀을 꾸림으로써 우리 함정이 가장 잘 작동하고 최신인 무기 체계를 갖추도록 할 수 있습니다."
 CAS_focus_naval_firepower_strategy: "해군 화력 전략"
 CAS_focus_naval_firepower_strategy_desc: "해군 함정의 무기 체계에 재정을 집중함으로써, 각 함정이 매서운 화력을 갖추게 되어 각 함정의 생존성을 보장할 수 있습니다."
 CAS_focus_future_navies_program: "미래 해군 사업"
 CAS_focus_future_navies_program_desc: "우리 함대를 위한 신형 무기와 방어 수단의 연구 개발에 재정을 투입하면 전투 영향력과 전반적인 생존성이 높아질 것입니다."
 CAS_focus_strategic_shipbuilding: "전략 조선"
 CAS_focus_strategic_shipbuilding_desc: "SSB 사업은 해군 함대 구성, 그리고 이 함정들에 탑재될 것으로 예상되는 화력을 미래에 대비하고 간소화하는 데 전념합니다."
 CAS_focus_naval_replacement_strategy: "해군 보충 전략"
 CAS_focus_naval_replacement_strategy_desc: "함정은 손실되기 마련입니다. 이는 사실입니다. 그러나 그 과정에서 경제를 잃고 싶지 않다면 수리와 개장, 그리고 해군 인원의 생존성을 최우선으로 삼아야 합니다."
 CAS_focus_ship_design_standards_commission: "함정 설계 표준 위원회"
 CAS_focus_ship_design_standards_commission_desc: "SDS 위원회는 비용 절감과 생산 감축 방안을 모색하여 더 적은 자원으로 더 많은 함정을 건조할 수 있게 하려는 재정 구상입니다. 단점은 물론 어느 정도 분명하겠지만, 생존성이 최우선입니다."
 CAS_focus_survivability_designing_priority: "생존성 설계 우선"
 CAS_focus_survivability_designing_priority_desc: "신형 해군 함정을 생존성 대책과 함께 선제적으로 설계하면, 손상되거나 파괴된 함정에서도 더 많은 인력을 건져 낼 수 있습니다."
 CAS_focus_coastal_primary_training: "연안 우선 훈련"
 CAS_focus_coastal_primary_training_desc: "국방을 보장하는 것이 일차 목표이며, 따라서 훈련도 이를 반영할 것입니다."
 CAS_focus_air_force_of_cascadia: "캐스캐디아 공군"
 CAS_focus_air_force_of_cascadia_desc: "캐스캐디아 공군, 즉 CAF의 창설과 공식화는 우리나라의 독립을 향한 진정한 디딤돌입니다. 크고 작은 모든 외국 세력이 자국의 하늘을 지킬 수 있는 공군을 보유하고자 하며, 우리도 그렇게 할 것입니다."
 CAS_focus_fighter_priority_strategy: "전투기 우선 전략"
 CAS_focus_fighter_priority_strategy_desc: "우리 영공을 지키는 것은 장기적 생존을 위한 최우선 목표입니다. 적 공군이 날뛰도록 내버려 둔다면 시작하기도 전에 그만두는 편이 낫습니다."
 CAS_focus_improved_weapons_testing: "개선된 \\"무기 시험\\""
 CAS_focus_improved_weapons_testing_desc: "무기 시험 시설은 공중에서의 공격 능력을 높이는 훌륭한 방법입니다. 다만 시설을 영리하게 설계하면 대응책과 일반 개량 기술에 대한 시험도 함께 진행할 수 있습니다."
 CAS_focus_retooling_aircraft_production: "항공기 생산 재설비"
 CAS_focus_retooling_aircraft_production_desc: "전투기 생산 모델을 우선시함으로써 국민과 적 모두에게 우리 하늘에는 오직 우리 항공기만 있을 것임을 확신시킬 수 있습니다."
 CAS_focus_bomber_priority_strategy: "폭격기 우선 전략"
 CAS_focus_bomber_priority_strategy_desc: "우리는 공군의 능력을 확신하지만, 적이 싸움을 계속하려는 의지 또한 그만큼 확신합니다. 따라서 폭격기 계열 항공기를 우선시하여 전선과 후방 양쪽에서 적을 격파해야 합니다."
 CAS_focus_payload_developments: "탑재량 개발"
 CAS_focus_payload_developments_desc: "적을 반드시 격파하려면 폭격 탑재량과 이것이 목표에 도달하는 방식을 개선해야 합니다."
 CAS_focus_retooling_aircraft_production_two: "항공기 생산 재설비"
 CAS_focus_retooling_aircraft_production_two_desc: "생산 자원을 더 많은 폭격기 계열 항공기 모델에 배분함으로써 적에게 최대한 압박을 가할 수 있습니다. 어떤 식으로든 적의 항복을 받아 낼 것입니다."
 CAS_focus_simulator_investments: "시뮬레이터 투자"
 CAS_focus_simulator_investments_desc: "우리 조종사가 최고임을 입증하려면 가능한 한 현실적인 모의 훈련을 거치게 해야 합니다. 훈련은 혹독할 것이며 일부에게는 벅찰 수도 있겠지만, 결국 우리는 세계가 이제껏 알지 못한 조종사의 새로운 기준을 만들어 낼 것입니다."
 CAS_focus_general_infrastructure_investments: "일반 기반시설 투자"
 CAS_focus_general_infrastructure_investments_desc: "공군 기반시설과 항공기를 출격 비행장 등으로 옮기는 물류를 개선하는 투자를 통해, 항공 군종의 전투 준비 태세를 크게 향상시킬 것입니다."
 CAS_focus_air_force_assistance_department: "공군 지원 부서"
 CAS_focus_air_force_assistance_department_desc: "지원 부서, 혹은 일부에서 부르는 이름으로 합동 준비 태세 부서는 전투 작전 중 육군 및 기타 지상군과 긴밀히 협력하기 위해 공군이 사용하는 조정 부서입니다. 이는 아군 오폭 사고를 줄이고 전장의 명확성을 보장하기 위한 것입니다."
 CAS_focus_clear_skies_ahead: "맑은 하늘이 앞에"
 CAS_focus_clear_skies_ahead_desc: "지칠 줄 모르는 노력 끝에, 이제 우리는 머리 위의 하늘을 마음 놓고 누릴 수 있다고 말해도 좋겠습니다. 하늘을 어둡게 하려는 어떤 적군으로부터도 우리가 지켜 낼 것이기 때문입니다."
 CAS_focus_a_refined_fighting_force: "정예화된 전투 부대"
 CAS_focus_a_refined_fighting_force_desc: "우리 군은 먼 길을 걸어왔으며, 이제 우리는 국경이 지켜질 것이고 적들이 더 이상 단순히 \\"우리를 짓밟고 지나갈\\" 수 없다고 말할 수 있습니다."
 CAS_focus_beyond_the_mountain_home: "산악의 고향 너머"
 CAS_focus_beyond_the_mountain_home_desc: "위대한 우리나라를 바라보면 잠재력을 지닌 땅과 국민이 보입니다. 이 아름다운 땅의 거대한 산맥 너머를 바라보면, 야만인, 착취자, 온갖 부랑자들이 대륙을 어지럽히고 있는 모습이 공포스럽게 보입니다. 이 현대 시대에 우리의 흔적을 진정으로 남기려면 대담해져야 합니다. 무엇을 택하든 우리는 당당하고 자랑스럽게, 그리고 우리 주위의 부패를 보존하려는 이들에 맞서 하나로 뭉쳐 서야 합니다."
 CAS_focus_pan_pacific_plan: "범태평양 계획"
 CAS_focus_pan_pacific_plan_desc: "캐스캐디아는 태평양 지향 국가이며, 우리는 이곳이 바로 그 태평양의 국가가 되도록 해야 합니다. 이에 따라 태평양 연안에 걸친 더 위대한 나라가 될 수 있도록 바퀴를 굴리기 시작할 것입니다."
 CAS_focus_preparing_for_the_hunt: "사냥 준비"
 CAS_focus_preparing_for_the_hunt_desc: "우리의 이 거대한 계획에서 가장 쉬운 부분은 퇴보하고 본능적으로 자기중심적인 캘리포니아 공화국을 쓰러뜨리는 일입니다. 서커스였다면 일종의 곰이겠지만, 우리는 서커스단이 아닙니다. 따라서 캘리포니아의 땅을 손에 넣고 이 소극을 끝내기 위한 준비를 시작할 것입니다."
 CAS_focus_strike_down_the_bear: "곰을 쓰러뜨려라"
 CAS_focus_strike_down_the_bear_desc: "때가 되었으니 우리는 곰을 칠 것이며, 승리하여 캐스캐디아의 새로운 시대를 열 것입니다!"
 CAS_focus_the_great_southern_expedition: "대남방 원정"
 CAS_focus_the_great_southern_expedition_desc: "멕시코는 강한 나라이지만, 동시에 혼란스럽고 다소 실망스러운 나라이기도 합니다. 이는 지금까지 가장 큰 도전이 될 것이며, 따라서 이 거대한 전투에 대비해야 합니다."
 CAS_focus_operation_yucatan: "유카탄 작전"
 CAS_focus_operation_yucatan_desc: "유카탄 작전은 멕시코 침공 계획입니다. 우리는 신속하고 강하게 타격하여 바하칼리포르니아 반도를 휩쓴 뒤 남쪽으로 전면 진격을 시작하여, 마침내 유카탄의 마지막 저항 세력까지 소탕할 것입니다."
 CAS_focus_rio_grande_republic: "리오그란데 공화국"
 CAS_focus_rio_grande_republic_desc: "광대한 영토를 통제하는 일은 번거로울 뿐 아니라 얼마 안 되는 인적 자원을 소모시킵니다. 따라서 멕시코 잔존 세력과 함께 동등한 파트너로서 전략적 괴뢰국을 세워야 합니다."
 CAS_focus_yucatan_power_bloc: "유카탄 세력권"
 CAS_focus_yucatan_power_bloc_desc: "태평양 영토를 공고히 하려면 통합된 멕시코 민족이라는 관념을 해체해야 합니다. 따라서 유카탄 국가와 문화를 부활시키면 더 큰 멕시코의 또 다른 일부를 떼어 낼 수 있고, 남부를 더 잘 통치하는 데 도움이 될 것입니다."
 CAS_focus_our_pacific_territories: "우리의 태평양 영토"
 CAS_focus_our_pacific_territories_desc: "태평양에서 우리의 해군 주둔이 점점 더 도전받기 어렵게 만들려면 주요 태평양 연안 영토를 확보하고 통합해야 합니다. 이는 통일된 범태평양 강국 조약, 즉 PPPP를 만드는 데에도 도움이 될 것입니다. 우리는 멕시코를 우리에게 도전할 만큼 강하지는 않지만, 우리와 다른 구성 회원국을 돕고 서로 이익을 줄 만큼은 강한 지역들로 더 잘 나눌 수 있습니다."
 CAS_focus_central_mexico_administration: "멕시코 중부 행정부"
 CAS_focus_central_mexico_administration_desc: "멕시코의 옛 정부는 권력을 유지하고 구 멕시코 국가의 중부 지역을 통치하도록 허용됩니다. 주된 조건은 새 국가와 행정부가 캐스캐디아 및 그 외교 정책 목표와 보조를 맞추는 것입니다. 내정은 캐스캐디아의 개입 없이 새 행정부 아래에서 계속될 수 있습니다."
 CAS_focus_ensuring_public_stability: "대중의 안정 보장"
 CAS_focus_ensuring_public_stability_desc: "남방 원정이 끝났으니 이제 대중을 결집하고 앞으로 나아갈 새로운 길을 만들 수 있습니다. 하나의 민족으로 단결하면 우리는 전에 없이 번영할 수 있습니다."
 CAS_focus_eastern_bulwark: "동방의 방벽"
 CAS_focus_eastern_bulwark_desc: "우리의 궁극적인 목표는 태평양 연안 영토를 영유권으로 차지하는 것입니다. 알래스카에서 바하칼리포르니아에 이르기까지 태평양의 평화와 안정을 지키기 위한 거대한 해군을 건설할 것입니다. 다만 먼저 기반부터 다져야 합니다. 미시시피 강 동쪽의 불길한 움직임은 성장하는 대항 세력에 대한 우려를 낳고 있으며, 캐나다의 지정학적 위치 역시 그들을 단순히 침공하기는 그리 쉽지 않게 만듭니다. 따라서 동방에 대한 방벽으로서, 그리고 우리의 권력 기반을 구축하기 위해 데저렛 연방을 봉쇄해야 합니다."
 CAS_focus_operation_morman: "모르몬 작전"
 CAS_focus_operation_morman_desc: "데저렛 연방은 1800년대에 옛 미국 연방정부를 상대로 전쟁을 벌인 적이 있습니다. 이제 그들은 우리와 또 한 차례 맞붙게 됩니다. 서쪽으로 진군하라!"
 CAS_focus_securing_eastern_holdings: "동부 보유지 확보"
 CAS_focus_securing_eastern_holdings_desc: "방벽을 확보했으니 이제 상황을 안정시키고 치안을 회복해야 합니다."
 CAS_focus_pushing_buttons_testing_waters: "도발과 떠보기"
 CAS_focus_pushing_buttons_testing_waters_desc: "가장 큰 난관이 앞에 놓여 있습니다. 캐나다에 대놓고 선전포고하기보다는, 캐나다가 우리를 공격하도록 설득하기 위해 가능한 모든 일을 시작해야 합니다. 물론 선전포고를 할 수도 있지만, 뻔한 점을 고려하면 좋은 생각은 아닙니다."
 CAS_focus_border_escalation: "국경 긴장 고조"
 CAS_focus_border_escalation_desc: "캐나다 정부가 자기들 조건으로 전쟁을 일으키도록 부추기기 위해 가능한 모든 일을 해야 합니다. 따라서 다소 무모하더라도, 이 지역 분쟁이 더 큰 분쟁으로 번지는 것을 원치 않는다면 필요한 일을 해야 합니다."
 CAS_focus_operation_great_north: "대북방 작전"
 CAS_focus_operation_great_north_desc: "다른 모든 방법이 실패하면 그냥 직접 나서십시오."
 CAS_focus_stabilizing_the_great_north: "대북방 안정화"
 CAS_focus_stabilizing_the_great_north_desc: "우리의 조건으로 사태를 사실상 종결했으니, 이제 이 땅에 평화와 질서를 되찾기 시작할 수 있습니다."
 CAS_focus_operation_big_dipper: "북두칠성 작전"
 CAS_focus_operation_big_dipper_desc: "마지막 개척지입니다. 석유가 풍부한 주인 알래스카는 우리 범태평양 연합에 훌륭한 보탬이 될 것이며, 우리의 해군력을 이어 갈 전략적 요충지가 될 것입니다."
 CAS_focus_connecting_the_frigid_north: "혹한의 북쪽 연결"
 CAS_focus_connecting_the_frigid_north_desc: "분쟁이 멈추었으니 이제 알래스카 영토를 연결하고 안정시키기 시작할 수 있습니다."
 CAS_focus_pan_pacific_proclamation: "범태평양 선언"
 CAS_focus_pan_pacific_proclamation_desc: "우리의 과업은 끝나지 않았지만 가장 어려운 부분은 이제 지나갔습니다. 우리는 영광스러운 나라의 국민에게 우리가 하나임을 약속할 수 있습니다. 태평양 연안 주민들은 이제 하나가 되었으며, 우리는 이 단합을 널리 세계에 선포할 것입니다."
 CAS_focus_cambrian_unity_plan: "캄브리아 통합 계획"
 CAS_focus_cambrian_unity_plan_desc: "공화국은 사라졌고, \\"합중국\\"이라는 관념은 내부 붕괴와 함께 죽었습니다. 따라서 우리는 앞으로 나아갈 새로운 길을 만들고, 우리를 하나로 묶을 새로운 정체성을 찾아야 합니다. 일부 거대한 산맥은 캄브리아기까지 거슬러 올라가는 연대를 지니고 있으니, 이 땅의 유산을 기리는 것보다 새로운 연합을 만드는 더 좋은 방법이 있겠습니까. 캄브리아, 우리의 고향입니다."
 CAS_focus_coastal_claims: "연안 영유권"
 CAS_focus_coastal_claims_desc: "새로운 연합을 만들려면 먼저 태평양 연안 통합으로 가는 길을 놓아야 합니다. 따라서 결함투성이인 캘리포니아 정부에 대한 우리의 정당한 영유권을 움직여 공고히 하기 시작할 것입니다."
 CAS_focus_southwestern_securities: "남서부 확보"
 CAS_focus_southwestern_securities_desc: "남서부는 화석 연료와 주요 광물 자원이 풍부합니다. 이 새롭고 위대한 나라를 제대로 돌보려면 이 땅을 취득할 우리의 권리를 공고히 하기 시작해야 합니다."
 CAS_focus_securing_a_stable_food_supply: "안정적인 식량 공급 확보"
 CAS_focus_securing_a_stable_food_supply_desc: "대평원 주들은 신세계의 곡창지대로 여겨집니다. 우리는 이 곡창지대로 국민을 먹여 살리고 다가올 날들의 단합과 번영을 키울 것입니다."
 CAS_focus_operation_angel_city: "천사의 도시 작전"
 CAS_focus_operation_angel_city_desc: "진정으로 단합된 전선을 만들려면 먼저 서부 해안을 통합해야 합니다. 우리는 남쪽을 타격하여 천사들의 도시에서 승리를 자축할 것입니다."
 CAS_focus_operation_bread_bowl: "빵 그릇 작전"
 CAS_focus_operation_bread_bowl_desc: "대평원 지역은 먼저 싸우기에 더 나은 지역입니다. 이곳을 휩쓴 뒤에는 남쪽으로 향해 우리의 연합을 공고히 할 수 있습니다."
 CAS_focus_operation_just_deserts: "정당한 응보 작전"
 CAS_focus_operation_just_deserts_desc: "우리 거대한 퍼즐의 마지막 핵심 조각이 바로 눈앞에 있습니다. 많은 이들이 왜 대륙 전체를 통일하지 않느냐고 물을 것입니다. 사실 언젠가는 그렇게 할 것입니다. 하지만 지금은 단합하고 성과를 공고히 하며, 단결의 의식을 키우고 우리가 바라는 미래를 위한 새로운 길을 만들어야 합니다."
 CAS_focus_beginning_a_new_chapter: "새로운 장의 시작"
 CAS_focus_beginning_a_new_chapter_desc: "우리와 가장 가까운 연안 지역을 안정시켜 민간 서비스를 통합하기 시작합니다."
 CAS_focus_restoring_southern_order: "남부 질서 회복"
 CAS_focus_restoring_southern_order_desc: "민간 서비스를 통합함으로써 새로운 남부 지역에 법과 질서를 회복하기 시작할 수 있으며, 이곳에서 국가 통합의 시작이 가능해집니다."
 CAS_focus_sowing_new_fields_of_unity: "통합의 새로운 들판에 씨를 뿌리다"
 CAS_focus_sowing_new_fields_of_unity_desc: "이 비옥한 땅에 질서와 평화를 되찾음으로써, 안정적이고 다양한 식량 공급을 보장하여 공공의 법질서를 회복할 수 있습니다."
 CAS_focus_the_new_republic: "새로운 공화국"
 CAS_focus_the_new_republic_desc: "오랜 세월이 걸렸지만, 이제 이 책의 마지막 장을 넘겨 새로운 책을 쓸 때가 되었습니다. 캄브리아의 이야기는 오늘 시작됩니다."
 CAS_focus_old_republic_plan: "옛 공화국 계획"
 CAS_focus_old_republic_plan_desc: "우리 땅은 질서를 되찾았으며, 따라서 우리는 수많은 이들이 저지른 잘못을 바로잡을 것입니다. 우리는 동쪽으로 진군하여 함께 대륙을 다시 한번 통일할 것입니다."
 CAS_focus_coastline_clearance: "해안선 정리"
 CAS_focus_coastline_clearance_desc: "앞길은 길고 험난합니다. 조심하지 않으면 동부 해안의 광인이 우리와 비슷한 생각을 품을지도 모릅니다. 따라서 태평양 연안 주들을 하나의 깃발 아래 통합하는 것으로 시작하는 동시에, 앞으로의 전역에 대비해 병력을 준비할 수 있습니다."
 CAS_focus_taking_the_gamble: "도박을 감행하다"
 CAS_focus_taking_the_gamble_desc: "대륙의 이쪽 편 남쪽 절반은 사막으로 덮여 있습니다. 이 험난한 지형 때문에 보급에 신중을 기하고, 실제 전투보다 더위와 질병으로 더 큰 피해를 입지 않도록 해야 합니다."
 CAS_focus_working_for_our_meal: "끼니를 위한 노동"
 CAS_focus_working_for_our_meal_desc: "대륙의 이쪽 편 북쪽 절반은 대체로 평원이지만, 로키산맥과 굽이치는 언덕과 계곡 때문에 여정은 길고 지루할 것입니다. 힘든 일을 마친 뒤에는 푸짐한 식사를 즐길 수 있기를 바랄 뿐입니다."
 CAS_focus_a_lone_star_no_more: "더 이상 외로운 별이 아니다"
 CAS_focus_a_lone_star_no_more_desc: "중간 지점이자 우리의 수복주의적 영광의 책에서 다음 장의 시작입니다. 텍사스는 숨을 고르고 현재의 성과를 재편한 뒤, 눈앞의 임무를 끝낼 다음 전투를 준비하기에 훌륭한 정차지가 될 것입니다."
 CAS_focus_war_plan_movie_star: "전쟁 계획 영화배우"
 CAS_focus_war_plan_movie_star_desc: "우리는 남쪽의 곰을 친다. 저 자유주의 가발들과 그들의 상류 사회는 결코 버텨 내지 못할 것이다."
 CAS_focus_war_plan_farmville: "전쟁 계획 팜빌"
 CAS_focus_war_plan_farmville_desc: "농부 존에게는 믿음직한 낡은 산탄총이 있을지 모르지만, 우리에게는 전차와 항공기가 있다. 이 누더기 무리는 우리 앞길을 막지 못할 것이다."
 CAS_focus_war_plan_skorpion: "전쟁 계획 스코르피온"
 CAS_focus_war_plan_skorpion_desc: "모르몬교도라니... 진심인가?! 이 작자들은 웃기는 존재들이다. 그들의 이른바 군대보다 질병과 날씨 때문에 더 많은 손실을 입을 것 같다."
 CAS_focus_war_plan_alamo: "전쟁 계획 알라모"
 CAS_focus_war_plan_alamo_desc: "알라모를 기억하라. 이곳이 통일된 대륙의 영광과 명예를 되찾는 중간 지점이 될 것이기 때문이다."
 CAS_focus_beginning_clean_up_operations: "정리 작전 개시"
 CAS_focus_beginning_clean_up_operations_desc: "우리의 이 \\"위대한 게임\\" 전반부의 먼지가 가라앉으면서, 이제 마음을 가다듬고 우리가 만들어 낸 후방을 정비해야 합니다."
 CAS_focus_peace_land_and_bread: "평화, 토지, 빵"
 CAS_focus_peace_land_and_bread_desc: "새 땅을 활용하고 국민이 배를 채울 만큼 빵을 확보하도록 함으로써 평화를 지키고 치안을 회복할 것입니다."
 CAS_focus_bread_and_circuses: "빵과 서커스"
 CAS_focus_bread_and_circuses_desc: "이곳 남서부의 치안을 확보하려면 국민을 즐겁게 하고 굶지 않게 해야 합니다. 이에 따라 라스베이거스의 영향력을 확대하고, 사막에 시달리는 이 지역에 값싼 식량을 공급하는 방안을 살펴볼 수 있습니다."
 CAS_focus_a_wild_west_no_more: "더 이상 와일드 웨스트가 아니다"
 CAS_focus_a_wild_west_no_more_desc: "대륙 서쪽 절반이 재편되어 당분간 안정되었으니, 이제 미시시피 강을 건너는 진군을 준비하기 시작할 수 있습니다."
 CAS_focus_southern_bell_tolls: "남부의 종이 울린다"
 CAS_focus_southern_bell_tolls_desc: "동쪽으로의 진군은 계속되며, 미시시피 강을 건너는 데 그 이름을 딴 주 자체를 통과하는 것보다 더 좋은 방법이 있겠습니까."
 CAS_focus_rusting_chance_to_make_new: "녹슨 것을 새로 만들 기회"
 CAS_focus_rusting_chance_to_make_new_desc: "오대호 지역은 옛 공화국에서 가장 산업화된 지역 중 하나였습니다. 그러나 안타깝게도 그 오대호는 연안과 인근 주들을 녹슬게 했습니다. 이를 위해 우리는 동쪽으로 진군하여 싸움을 이어 갈 것입니다."
 CAS_focus_capitalizing_the_capital: "수도를 자본화하다"
 CAS_focus_capitalizing_the_capital_desc: "옛 공화국의 연방 지역은 특별구의 유해한 영향으로 크게 고통받았습니다. 이제 우리는 이를 바로잡기 위해 노력할 것입니다."
 CAS_focus_northeastern_nitwits: "북동부의 얼간이들"
 CAS_focus_northeastern_nitwits_desc: "대체로 북동부 지역을 이루는 자기중심적이고 상류층인 사람들은 식은 죽 먹기일 것입니다. 그러나 이들이 통제하는 지형을 과소평가해서는 안 됩니다. 한 무리의 불량배라도 알맞은 장소에 있다면 얼마든지 피해를 줄 수 있기 때문입니다."
 CAS_focus_war_plan_dixie: "전쟁 계획 딕시"
 CAS_focus_war_plan_dixie_desc: "우리는 딕시로 진군한다. 우리가 스스로 만들어 낸 임무를 끝내기 위해 동쪽으로 진군한다."
 CAS_focus_war_plan_industrial_revolution: "전쟁 계획 산업 혁명"
 CAS_focus_war_plan_industrial_revolution_desc: "우리는 동쪽으로 진군하여 이 녹슨 유물들을 번영의 세련된 연단으로 바꿀 것이다."
 CAS_focus_war_plan_washington: "전쟁 계획 워싱턴"
 CAS_focus_war_plan_washington_desc: "수도 특별구는 결승선은 아니지만, 대륙에 대한 우리의 새로운 천명을 공고히 하는 마지막 주요 단계입니다. 우리는 수도를 정복하여 옛 공화국을 새롭게 만들 것이기 때문입니다."
 CAS_focus_war_plan_marathon: "전쟁 계획 마라톤"
 CAS_focus_war_plan_marathon_desc: "여러분, 우리는 마지막 구간에 들어섰습니다. 이제 마라톤을 끝내고 탁 트인 대양을 바라보기만 하면 됩니다. 메인 주에서는 멀리 평화로운 캐나다의 노바스코샤 주가 보일 것입니다. 그곳에서 유혈은 끝나고 재건이 시작될 수 있습니다."
 CAS_focus_southern_sweethearts: "남부의 연인들"
 CAS_focus_southern_sweethearts_desc: "남부의 환대는 그 자체로 독특한 것입니다. 진정으로 법과 질서를 되찾고, 하물며 다시 주들의 연합이 될 생각을 하려면 그들이 우리에게 보여 주는 것과 같은 공손한 태도를 보여야 합니다. 전쟁은 전쟁이지만, 평화를 지키는 것은 생각보다 훨씬 어렵습니다."
 CAS_focus_midwestern_goodbye: "중서부식 작별"
 CAS_focus_midwestern_goodbye_desc: "아, 미안하네 친구, 거기 있는 줄 몰랐어. 이봐, 정말 즐거운 시간이었지만 아내가 화려한 방식으로 난리를 치기 전에 챙기고 마무리해야 할 일이 있어서 말이야. 그래도 우리 언제 또 이렇게 하자고. 내가 맥주를 가져올 테니 자네는 경기 볼 때 먹을 괜찮은 핫도그를 가져오게."
 CAS_focus_capital_clean_up: "수도 정리"
 CAS_focus_capital_clean_up_desc: "이 과거의 유물을 정리할 때가 되었습니다. 언젠가 이곳에 국가 통치의 중심지를 다시 세울 수도 있고, 각 주에 그냥 돌려주어 미래 세대를 위한 교훈으로만 삼을 수도 있습니다."
 CAS_focus_liberty_shines_once_more: "자유가 다시 한번 빛나다"
 CAS_focus_liberty_shines_once_more_desc: "오늘 우리는 거리를 청소하고 자유의 여신상을 닦습니다. 우리의 위대한 제2의 명백한 운명이 완수된 것을 기념해야 하기 때문입니다."
 CAS_focus_second_republic: "제2공화국"
 CAS_focus_second_republic_desc: "땅은 질서를 되찾았고, 국민은 단결했으며, 이제 세계는 제2 아메리카 공화국이 다시 한번 세계 무대의 주역임을 알게 될 것입니다. 단결하면 서고 분열하면 쓰러지기 때문입니다."
 CAS_flag_western_outlook: "서방의 이상이 자리 잡다"
 CAS_flag_emerging_outlook: "동방의 이상이 자리 잡다"
 CAS_flag_non_aligned_outlook: "토착의 이상이 자리 잡다"
 CAS_flag_nationalist_outlook: "민족주의적 가치가 나라를 사로잡다"
 CAS_flag_mount_fort_baker: "베이커 산 요새"
 CAS_flag_fort_ruby_mountain: "루비 마운틴 요새"
 CAS_flag_fort_yakama: "야카마 요새"
 CAS_flag_fort_saint_helens: "세인트헬렌스 요새"
 CAS_flag_sprague: "스프레이그"
 CAS_flag_umatilla: "유매틸라"
 CAS_flag_arock: "에이록"
 CAS_flag_grimes_pass: "그라임스 고개"
 CAS_ideas_developing_foreign_policy: "외교 정책 발전"
 CAS_ideas_developing_foreign_policy_desc: "이제 우리는 마음을 가다듬었으니, 이 세계에서 우리의 입지를 확보하기 위해 국경 너머를 바라보기 시작할 수 있습니다."
 CAS_ideas_officer_training_funding: "장교 훈련 재정 지원"
 CAS_ideas_officer_training_funding_desc: "재정 지원이 개선되면서 우리 장교와 장군들이 복무 기간 동안 받는 훈련을 확대할 수 있게 되었습니다. 이는 시간이 흐름에 따라 군의 지휘 통제 요소를 개선하고, 군을 정예화하는 데 활용할 수 있는 교리를 강화할 수 있게 해 줍니다."
 CAS_ideas_the_wegonian_rank_structure: "웨고니아식 계급 구조"
 CAS_ideas_the_wegonian_rank_structure_desc: "더 특수한 지휘 통제 방식에서 영감을 얻은 웨고니아식 계급 구조는 각 군종의 군 계급을 더 폭넓게 나눈 형태로, 더 작고 더 확장 가능한 군 부대 규모를 가능하게 합니다. 주된 단점은 이러한 계급과 부대 위계가 확대되면 모든 단계에서 더 많은 지휘 직위가 필요하다는 점입니다. 그러나 잠재적인 장점은 부대 간 협조와, 더 높은 제대를 사용하더라도 부대의 유연성을 높일 수 있다는 점입니다."
 CAS_ideas_mountain_agriculture: "산악 농업"
 CAS_ideas_mountain_agriculture_desc: "지루한 계획과 연구 개발에 대한 상당한 투자를 거쳐, 이제 우리는 우리에게 해를 끼치려는 외세에 포위당하더라도 최소한 진정한 자급자족을 고려할 만한 상당한 규모의 농업 부문을 갖추게 되었습니다."
 CAS_ideas_cascadian_armed_services_infancy: "캐스캐디아 군 \\"유아기\\""
 CAS_ideas_cascadian_armed_services_infancy_desc: "군사력을 세우는 초창기에는 언제나 의욕만 앞서는 약탈자들과 안전한 곳에 앉아 있는 게으름뱅이들로 가득 차기 마련입니다. 대단치는 않지만, CAS는 필요한 때와 장소에서 가정과 가족을 지키기 위해 할 수 있는 일을 할 것입니다."
 CAS_ideas_army_anti_air_defenses: "육군 대공 방어"
 CAS_ideas_army_anti_air_defenses_desc: "대공 체계의 개발을 우선시함으로써 일반 병사의 생명을 연장할 수 있으며, 이는 곧 육군 병사들이 공유하는 전반적인 경험 또한 끌어올립니다."
 CAS_ideas_cascading_offensives: "연쇄 공세"
 CAS_ideas_cascading_offensives_desc: "병력과 장교를 더 공격적으로 재훈련하고 병력에 더 기동적인 요소를 갖추게 함으로써, 기회가 오면 일종의 \\"끊임없는 공세\\"를 보장할 수 있습니다."
 CAS_ideas_all_terrain_combat_training: "전 지형 전투 훈련"
 CAS_ideas_all_terrain_combat_training_desc: "ATC 훈련 사업은 가능한 때와 장소에서 병사들을 순환시키며 온갖 형태의 전투에 노출시키도록 특별히 설계된 훈련소입니다. 이는 우리 병사들의 숙련도와 다양한 환경에서 전투를 지속하는 능력을 높일 것입니다."
 CAS_ideas_future_navies_program: "미래 해군 사업"
 CAS_ideas_future_navies_program_desc: "재정을 무기 체계에 집중하고 여러 함정의 화력을 선제적으로 확대함으로써 전반적인 전투 능력을 높일 수 있습니다."
 CAS_ideas_tomorrows_navy: "내일의 해군"
 CAS_ideas_tomorrows_navy_desc: "조선과 함대 구성을 미래에 대비함으로써 해군의 화력과 유연성을 크게 높일 수 있습니다."
 CAS_ideas_design_standards: "설계 표준"
 CAS_ideas_design_standards_desc: "해군 함정의 설계를 표준화함으로써 자원 사용의 초과분을 줄일 수 있습니다."
 CAS_ideas_survivability_designs: "생존성 설계"
 CAS_ideas_survivability_designs_desc: "해군 인원의 생존율에 집중함으로써, 장기전에서 발생하는 경험 손실과 인적 자원 손실을 최대한 최소화할 수 있습니다."
 CAS_ideas_weapons_testing_facilities: "무기 시험 시설"
 CAS_ideas_weapons_testing_facilities_desc: "일반적인 무기 시험 시설이라는 이름을 내걸면 명목상의 역할을 수행할 뿐 아니라, 여러 무기 사이에 다른 대응책 개발을 숨길 수도 있습니다. 전반적으로 우리의 제공권 장악 능력은 거의 도전받지 않을 것입니다."
 CAS_ideas_improved_payload_methods: "개선된 탑재 방식"
 CAS_ideas_improved_payload_methods_desc: "탑재물 투하와 항공기가 목표를 명중시키는 능력을 개선하는 전반적인 투자는 적의 의지를 꺾기 위해 우리에게 필요한 것입니다."
 CAS_ideas_bomber_centric_production: "폭격기 중심 생산"
 CAS_ideas_bomber_centric_production_desc: "폭격기와 유사한 항공기 유형에 생산 노력을 집중함으로써, 폭격으로 적을 굴복시켜 그 사기를 꺾을 수 있습니다."
 CAS_ideas_assistance_department: "육군 야전 지원 부서"
 CAS_ideas_assistance_department_desc: "AFAD는 육군 전투 작전과의 조율을 돕는 합동 군종 준비 태세 부서입니다."
 CAS_ideas_cascadian_armed_services_refined: "캐스캐디아 군 \\"정예\\""
 CAS_ideas_cascadian_armed_services_refined_desc: "인력과 원자재를 포함한 시간, 에너지, 자원에 대한 지속적인 투자를 통해 우리는 마침내 제대로 기능하는 군사력을 갖추게 되었습니다. 이제 이 새로운 전투 부대가 쇠퇴하여 시들지 않도록, 훈련과 지도력 향상에 더 많이 투자할 수 있습니다."
 CAS_ideas_domestic_stability_programs: "국내 안정 사업"
 CAS_ideas_domestic_stability_programs_desc: "지역사회 사업, 치안 개혁, 그리고 대중에게 더 잘 다가가는 올바른 방법이 DSP의 주된 목표입니다. 우리는 끊임없는 분열이 아닌 단합의 의식을 키우기를 바랍니다."
 CAS_ideas_cambrian_unity_initiatives: "캄브리아 통합 구상"
 CAS_ideas_cambrian_unity_initiatives_desc: "영토를 공고히 하고 국민을 단결시키려면, 국민이 하나라고 느낄 수 있게 하는 사업을 만들어야 합니다."
 CAS_ideas_civil_service_integration_programs: "민간 서비스 통합 사업"
 CAS_ideas_civil_service_integration_programs_desc: "사회적 결속을 보장하고 국가 단합을 키우려면 먼저 민간 서비스를 통합하고 표준화하기 시작해야 합니다. 그렇게 하면 지역사회 접촉과 대중과의 전반적인 사회적 교류에서 더 선제적으로 대응할 수 있습니다."
 cascadia_divided_we_fell: "분열하여 쓰러졌다"
 cascadia_divided_we_fell_desc: "공화국은 사라졌고, 우리는 대륙의 이 작은 구석에서 그림자 속을 헤치고 나왔습니다. 국내 불안과 전반적으로 기능하지 못하는 사회와 씨름하고 있으며, 로키산맥 저항군이라는 집단과의 긴장도 날로 커지고 있습니다. 앞으로 나아갈 생각을 하기 전에 기본부터 확보해야 합니다."
 cascadia_domestic_policies: "내무부"
 cascadia_domestic_policies_desc: "DoDA는 대중이 밖을 바라보는 태도를 개선하고, 연구, 지역사회, 일부 사회 사업 같은 주요 국내 기둥에 대한 접근성을 높이고자 하는 일반 국내 정책 부서입니다. 전반적으로 이 부서는 DoDA의 역량에 영향을 줄 수 있는, 보다 구체적인 임무를 지닌 다른 부서들과 협력하여 국민의 전반적인 복지를 보장합니다."
 cascadia_federal_budgets: "예산부"
 cascadia_federal_budgets_desc: "DoB는 초과 지출과 전반적인 연방정부 및 각종 사업의 비용을 규제하는 책임을 맡습니다. 주로 재무부와 협력하여 운영됩니다."
 cascadia_tax_policies: "재무부"
 cascadia_tax_policies_desc: "재무부는 우리나라와 국민이 창출하는 소득의 집행과 회계를 책임집니다. 재무부는 발생하는 모든 세입을 처리한 뒤 예산부와 협력하여, 나라의 전반적인 기능을 위한 균형 잡히고 비교적 공정한 예산 편성 계획과 세법을 만듭니다."
 cascadia_industrial_policies: "산업개발부"
 cascadia_industrial_policies_desc: "DoID는 제조 및 산업 능력에 대한 규제와 전반적인 국가 개발을 책임집니다. 이 부서는 농업, 주택, 지형이 나라의 인구와 경제 양면에서의 전반적인 성장 능력을 갉아먹는 가운데, 개발에 쓸 수 있는 얼마 안 되는 땅을 효율적으로 활용하도록 돕습니다."
 cascadia_resource_management_policies: "노동부"
 cascadia_resource_management_policies_desc: "DoL은 우리나라 노동력 구성의 고용과 체계를 책임집니다. DoDA 및 DoID와 협력하여 유연하고 제대로 기능하는 노동력이 경제 전체에 적응하고 일원이 될 수 있도록 보장합니다."
 cascadia_army_service_branch: "캐스캐디아 산악 육군"
 cascadia_army_service_branch_desc: "CMA는 캐스캐디아 군의 육군 군종입니다. 이 군종은 지상 요소로서, 캐스캐디아의 땅 자체를 이루는 여러 산맥 때문에 일반적으로 산악전과 산악전에 준하는 유형의 전투에 특화되어 있습니다."
 cascadia_air_force_service_branch: "캐스캐디아 공군"
 cascadia_air_force_service_branch_desc: "CAF는 캐스캐디아 군의 항공 군종입니다. 이 군종은 항공 요소로서, 지상 목표 타격을 시도할 때 지나가야 하는 거칠고 일정하지 않은 지형 때문에 기민성 훈련에 특화되는 경향이 있습니다."
 cascadia_navy_service_branch: "캐스캐디아 해군"
 cascadia_navy_service_branch_desc: "CN은 캐스캐디아 군의 해군 군종입니다. 이 군종은 해상 요소로서 연안 해역과 나라 해안선을 따라 흩어진 마을 및 도시를 방어합니다. 전적으로 독특한 것은 아니지만, 캐스캐디아 해군은 워싱턴 주 연안 해역이라는 구성과 훈련장 덕분에 더 방어적인 이점을 지니고 있습니다."
 CAS_monarchism_tooltip_desc: "§Y캐스캐디아§!의 국명이 §Y캐스캐디아 연합 공국§!으로 바뀝니다."
 CAS_pan_pacific_union_tooltip_desc: "§Y캐스캐디아§!의 국명이 §Y범태평양 연합§!으로 바뀝니다."
 CAS_cambria_path_complete_desc: "§Y캐스캐디아§!의 국명이 §Y캄브리아§!로 바뀝니다."
 CAS_second_american_republic_desc: "§Y캐스캐디아§!의 국명이 §Y제2 아메리카 공화국§!으로 바뀝니다."
 CAS_flag_we_go_to_war: "그렇다면 무력으로 쟁취하겠다!"
 CAS_Olympia_capital_desc: "§Y유타 올림피아§!가 새로운 연방 수도로 비준됩니다."
 CAS_Centralia_capital_desc: "§Y캔자스 센트럴리아§!가 새로운 연방 수도로 정해집니다."
 CAS_Shelby_capital_desc: "§Y켄터키 셸비§!가 새로운 연방 수도로 확정됩니다."
 CAS_DC_capital_desc: "§Y워싱턴 D.C.§!가 연방 수도로 복원됩니다."
 CAS_Olympia_capital: "올림피아"
 CAS_Old_Olympia: "구 올림피아"
 CAS_Centralia_capital: "센트럴리아"
 CAS_Shelby_capital: "셸비"
 CAS_creating_the_mountain_marauders: "산악 약탈자 창설"
 CAS_creating_the_mountain_marauders_desc: "우리에게 닥칠 수 있는 어떤 상황에도 맞서려면 동원할 수 있는 어떤 형태의 즉응 전력이 필요합니다."
 CAS_creating_infantry_reserves: "보병 예비대 창설"
 CAS_creating_infantry_reserves_desc: "미래는 불확실합니다. 우리가 지평선 너머로 뻗어 나갈 쪽이 될지, 외세가 그렇게 될지는 중요하지 않습니다. 따라서 그때가 왔을 때 대비할 수 있도록 즉응 예비대를 편성해야 합니다."
 CAS_mobilizing_the_reserves: "예비대 동원"
 CAS_mobilizing_the_reserves_desc: "때가 왔으며, 우리는 바라는 미래를 향해 한 걸음 내딛습니다. 예비대를 동원하라, 우리는 전쟁에 나선다!"
 cascadian_politics_event.1.t: "선택지의 홍수"
 cascadian_politics_event.1.d: "나라가 첫 총선거를 준비하면서 많은 이들이 저마다의 정당을 만들고 있습니다. 진짜 문제는 국민이 실제로 어떤 방향을 원하느냐입니다. 초기 단계라 말하기 어렵지만, 지금까지는 군부, 보이시 상업당, 붉은 산맥당 같은 정당의 요소들이 힘을 얻는 듯합니다. 다만 이는 각 정당의 세력을 공고히 하기보다는 유권자라는 정치적 파이를 나누는 데 더 기여하는 것으로 보입니다. 하지만 누가 알겠습니까, 일찍 일어나는 새가 벌레를 잡는다고들 하니 말입니다."
 cascadian_politics_event.1.o1: "맙소사, 누구를 골라야 하지?"
 cascadian_politics_event.2.t: "케이크 자르기"
 cascadian_politics_event.2.d: "투표소와 지정 투표 구역이 만들어지고 선거를 치르기 위한 투표 절차 전반이 준비되고 있습니다. 국민은 정당과 서로 다른 관점으로 결집하기 시작했으며, 나라가 나아갈 방향에 대한 견해도 갈리고 있습니다. 어떤 이들은 진정한 서방 민주주의 원칙을 지키려 하고, 어떤 이들은 전제주의나 사회주의, 그리고 동방의 전반적인 영향에 더 눈을 돌립니다. 또 다른 이들은 다른 나라를 기준으로 삼지 않고 자신들의 이념 원칙을 우리 나라에 적용하여 우리 자신을 들여다보기를 원합니다. 말하자면 캐스캐디아 중심의 관점이라 할 수 있습니다. 마지막으로 캐스캐디아 중심 사상을 받아들이되 더 단호하고 권위적이며 더 민족주의적이기를 바라는 이들도 있습니다. 어느 쪽이든 선거까지는 아직 시간이 남아 있습니다."
 cascadian_politics_event.2.o1: "서방의 원칙이 우리를 번영으로 이끌 것이다"
 cascadian_politics_event.2.o2: "동방의 약자들이 우리를 연대로 이끌 것이다"
 cascadian_politics_event.2.o3: "우리 나라는 우리 스스로 이끌고 키워 나간다"
 cascadian_politics_event.2.o4: "우리 나라는 우리 스스로 주장하고 확장한다!"
 cascadian_politics_event.100.t: "서방의 영향력 확대"
 cascadian_politics_event.100.d: "지난 몇 주 사이 서방의 원칙과 관행이 점점 더 많은 유권자의 마음을 얻은 것으로 보입니다. 최종 단계에 접어든 지금, 이 흐름에서 성장한 주요 정당들이 주도권을 잡기 위해 나서야 할 때입니다. 캐스캐디아 소비자당, 신보수당, 캐스캐디아 자유당, 사회진보당은 분명 할 일이 산더미입니다."
 cascadian_politics_event.100.o1: "어서 와서 오늘 우리와 함께하십시오"
 cascadian_politics_event.101.t: "최종 4강"
 cascadian_politics_event.101.d: "투표가 시작되어 집계가 진행되면서 이제 최종 네 정당으로 좁혀졌습니다. 박빙의 경쟁은 친기업 정당인 캐스캐디아 소비자당, 중도우파 신보수당, 중도좌파 캐스캐디아 자유당, 그리고 진보 운동인 사회진보당 사이에서 벌어지고 있습니다. 이 넷은 곧 한 명의 승자로 압축되거나, 결과가 충분히 분명하지 않으면 모종의 연립으로 정리될 것입니다."
 cascadian_politics_event.101.o1: "돈만이 아니라 더 큰 것으로 투표하십시오, 캐스캐디아 소비자당에 투표하십시오!"
 cascadian_politics_event.101.o2: "안정된 손이 안정된 표를 만듭니다, 신보수당에 투표하십시오!"
 cascadian_politics_event.101.o3: "변화에 투표하십시오, 캐스캐디아 자유당에 투표하십시오!"
 cascadian_politics_event.101.o4: "진보에 투표하십시오, 사회진보당에 투표하십시오!"
 cascadian_politics_event.200.t: "동방의 가치 확산"
 cascadian_politics_event.200.d: "러시아, 중국, 중앙아시아 등 동방과 극동 지역의 전제주의적, 사회주의적 가치가 점점 인기를 얻고 있습니다. 전반적으로는 두 흐름이 함께 성장하는 흥미로운 양상이지만, 사회주의자와 전제주의자 사이의 균열도 커지고 있습니다. 이 역학은 표를 갈라놓을 가능성이 높지만, 결국 나라의 앞날에는 더 평등주의적이거나 더 철의 의지를 가진 접근이 필요한 듯합니다. 우리가 내릴 수 있는 최선의 선택이기를 바랄 뿐입니다."
 cascadian_politics_event.200.o1: "어... 정말 괜찮은 건가?"
 cascadian_politics_event.201.t: "전제주의 대 공산주의"
 cascadian_politics_event.201.d: "표 집계가 시작되면서 마지막 남은 소수 정당들 사이의 간극이 점점 벌어지고 있습니다. 곧 우리 나라가 어떤 방향으로 나아갈지 알게 될 것입니다. 현재의 분열은 대캐스캐디아당과 캐스캐디아 보수당을 포함한 전제주의 우위의 정당들과, 공산주의 진영의 붉은 산맥당과 캐스캐디아 인민당 사이에서 벌어지고 있습니다. 이를 통해 미래가 자리 잡을 무대가 마련되고 향후 수년간의 선례가 세워질 것입니다."
 cascadian_politics_event.201.o1: "붉은 산맥당에 대한 한 표는 평등 속의 강함에 대한 한 표입니다"
 cascadian_politics_event.201.o2: "캐스캐디아 인민당에 대한 한 표는 단결에 대한 한 표입니다"
 cascadian_politics_event.201.o3: "우파에 대한 한 표는 캐스캐디아 보수당에 대한 한 표입니다"
 cascadian_politics_event.201.o4: "힘에 대한 한 표는 위대한 캐스캐디아에 대한 한 표입니다"
 cascadian_politics_event.300.t: "선택지가 더 늘어나다니"
 cascadian_politics_event.300.d: "투표가 시작되고 더 많은 유권자가 국내 문제에 집중하는 정당들 주위로 계속 결집하면서 상황이 앞으로 나아가고 있습니다. 우리의 젊은 나라에는 외부나 외세의 영향이 본래 작용하지 않은 탓인지, 국민은 좌파와 우파 성향 정당이 흥미롭게 뒤섞인 쪽으로 돌아선 듯합니다. 그러나 승자, 혹은 \\"승자들\\"을 꼽기에는 아직 이릅니다."
 cascadian_politics_event.300.o1: "좌든 우든, 위든 아래든, 룰렛을 돌려라 빙글빙글"
 cascadian_politics_event.301.t: "꿩 먹고 알 먹고"
 cascadian_politics_event.301.d: "상황이 막바지에 가까워지고 있으며, 젊은 나라가 걸어갈 길은 이제 국민 스스로 결정할 몫입니다. 대캐스캐디아당, 보이시 상업당, 캐스캐디아 자유지상당, 로빈 캐스캐디아당 중 하나가 단독 승리를 거두거나, 누구도 과반을 확보하지 못하면 서로 연립을 이루어 앞으로 수년, 어쩌면 수십 년에 걸친 정치적 결속과 행동의 선례를 세워야 할 것입니다."
 cascadian_politics_event.301.o1: "위대함에 대한 한 표는 캐스캐디아 자체에 대한 한 표입니다"
 cascadian_politics_event.301.o2: "경제적으로 투표하려면 사업에 투표하십시오, 오늘 보이시 상업당에 투표하십시오"
 cascadian_politics_event.301.o3: "자유에 대한 한 표는 당신을 위한 한 표입니다"
 cascadian_politics_event.301.o4: "사회 복지와 경제적 형평, 오늘 로빈당에 투표하십시오"
 cascadian_politics_event.400.t: "나라를 사로잡은 민족주의 열풍"
 cascadian_politics_event.400.d: "상황이 전개됨에 따라 점점 더 많은 유권자가 민족주의 색채가 강한 정당으로 돌아서고 있습니다. 이들 정당은 폭넓은 우파 스펙트럼을 이루며, 일부는 온건한 유권자에게 다소 불쾌하게 비칠 수 있습니다. 그러나 이 민족주의의 성장에서 무엇이 구체화될지 파악하려면 시간이 필요합니다."
 cascadian_politics_event.400.o1: "캐스캐디아인을 위한 캐스캐디아"
 cascadian_politics_event.401.t: "우린 얼마나 쓰라린가?"
 cascadian_politics_event.401.d: "서로 매우 다른 정당들이 1위 자리를 놓고 다투면서 열기가 계속 달아오르고 있습니다. 허무주의자들이 주요 선택지를 '괴짜 4인방'이라 부르기 시작했는데, 아이러니하게도 그중 가장 온건한 것은 신물결 운동에 속한 군주주의 정당인 올림피아 가문입니다. 이 정당은 헌법을 법적 구속력을 지닌 권위로 삼는 선출 군주제를 추진합니다. 이러한 \\"동화 같은\\" 강령에 회의적인 이가 많은 반면, 옛 사상과 새 이상의 화해에 더 끌리는 이들도 있습니다. 다음은 힘과 단결당으로, 전형적인 우익 포퓰리즘 성향 정당입니다. 일부는 유연하지만 친캐스캐디아 쪽으로 기운 강령 때문에 '캐스캐디아 제일당'이라며 농담 삼아 부르기도 합니다. 그 뒤를 잇는 것은 캐스캐디아 군부의 정치 조직으로 보이는 정당으로, 경제적으로는 더 유연하나 사회적으로는 더 보수적이며 모든 것이 더 군사화되는 성향입니다. 의무 복무 기간 제안을 달가워하지 않는 이도 있지만, \\"어떤 상황에도 대비하자\\"는 일관된 프로그램은 꽤 매력적이기도 합니다. 마지막으로 눈총을 많이 받는 주홍 여단이 있습니다. 힘과 단결당이 하는 일을 10배쯤으로 끌어올리자는 척도에 기반한 운동 또는 정당으로, 그들이 \\"진짜\\" 문제에는 꽤 무르다는 이유에서입니다. 어쨌든 누가 승리할지 확실히 알려면 표 집계를 기다려야 합니다."
 cascadian_politics_event.401.o1: "힘과 단결을 함께"
 cascadian_politics_event.401.o2: "주홍 여단이 승리를 향해 진군한다"
 cascadian_politics_event.401.o3: "앞으로 올 수많은 군사적 승리의 첫걸음"
 cascadian_politics_event.401.o4: "올림피아는 별을 향해 솟아오르고, 그 국민도 그러하리라"
 cascadian_foreign_policy_event.1.t: "격앙된 감정이 낳은 사상자"
 cascadian_foreign_policy_event.1.d: "이날 일찍 여러 집단이 국경 수비대를 도발하는 모습이 포착되었습니다. 캐스캐디아 정부는 책임을 부인하며 자국민의 범죄적 과실을 엄중히 처벌하겠다고 제안했습니다. 그러나 이미 대륙 곳곳에서 그토록 많은 책략을 부린 나라가 단지 \\"결백하다\\"는 말을 믿기는 어렵습니다. 따라서 우리는 실질적인 선택을 해야 합니다. 확전하여 그들에게 싸움을 걸 수도 있고, 겉으로만 그들의 조건에 동의하며 다음 계획이 무엇인지 파악할 수도 있습니다. 우리의 지정학적 위치 덕분에 공은 우리 손에 있으며, 캐스캐디아는 그 공을 되찾거나 부수려는 듯 보입니다."
 cascadian_foreign_policy_event.1.o1: "우리가 직접 상대하겠다"
 cascadian_foreign_policy_event.1.o2: "진심 어린 사과를 전하라"
 cascadian_foreign_policy_event.2.t: "캐나다의 사과"
 cascadian_foreign_policy_event.2.d: "캐나다 정부가 행동에 나서도록 자극하려던 우리의 최선의 노력은 실패했습니다. 이제 우리는 어려운 선택에 직면했습니다. 물러나 현재 가진 것에 만족하든가, 병력을 규합해 우리의 조건으로 전쟁을 준비하든가 둘 중 하나입니다."
 cascadian_foreign_policy_event.2.o1: "그런 확전은 감당할 수 없다"
 cascadian_foreign_policy_event.2.o2: "될 대로 되라, 병력을 규합하라!"
 CAS_revanchist_event.1.t: "수도를 둘러싼 난제"
 CAS_revanchist_event.1.d: "대륙은 우리 손에 들어왔지만 모든 것이 여전히 폐허 상태이며, 새로운 문제가 떠올랐습니다. 새 중앙 정부를 어디에 둘 것인가 하는 문제입니다. 물론 많은 이들이 간단히 워싱턴 D.C.로 되돌리면 된다고 말할 것입니다. 그러나 옛 수도의 위치 때문에 정부와 국민 사이에 자연스러운 장벽이 생겼다고 보는 이들도 많습니다. 그래서 우리는 유타, 캔자스, 켄터키에 측량 인력을 보내 더 중심에 있거나 적어도 더 개방된 좋은 입지를 찾을 수 있는지 알아보고 있습니다. 그래야 국민이 정부를 더 잘 보고 목소리를 낼 수 있을 것입니다. 물론 옛 수도를 재건하는 방안도 검토할 수 있으며, 손해 볼 것은 없습니다."
 CAS_revanchist_event.1.o1: "이런 소란이 정말 필요한가?"
 CAS_revanchist_event.2.t: "결정"
 CAS_revanchist_event.2.d: "준비가 끝나고 선택지가 정리되었으니, 이제 제2공화국의 미래 연방 수도를 어디에 둘지 결정해야 합니다. 중서부, 대륙 중앙, 중동부 중 하나로 할지, 아니면 컬럼비아 특별구에 되돌려 줄지가 관건입니다."
 CAS_revanchist_event.2.o1: "서부 중심지"
 CAS_revanchist_event.2.o2: "대륙의 중앙"
 CAS_revanchist_event.2.o3: "동부 중심지"
 CAS_revanchist_event.2.o4: "있는 것을 그대로 쓰자"
 CAS_focus_military_automation_investments: "군사 자동화 투자"
 CAS_focus_military_automation_investments_desc: "군수 산업 능력을 키울수록 경제 쪽에서는 더 많은 인력이 필요해집니다. 따라서 군수 산업이 전통적인 경우보다 경제와 국민에게 더 큰 부담이 되지 않도록 자동화에 전략적이고 표적화된 투자를 해야 합니다."