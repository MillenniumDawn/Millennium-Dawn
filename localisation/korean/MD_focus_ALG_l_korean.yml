 deep_state_purge_complete_tt: "§G숙청이 완료되었습니다. 민간 통제가 상당 부분 회복되었습니다.§!"
 deep_state_cooperation_tt: "§Y군 지도부와의 협력은 안정을 제공하지만 그들의 영향력을 키웁니다.§!"
 deep_state_stability_boost_tt: "§G군과의 협력을 통해 단기적으로 안정도가 향상되었습니다.§!"
 deep_state_cooperation_warning_tt: "§R딥 스테이트 권력이 위험한 수준에 도달하고 있습니다! 추가 협력은 위험합니다.§!"
 deep_state_intel_reform_started_tt: "§Y민간 감독을 보장하도록 정보기관을 재편하고 있습니다.§!"
 deep_state_expect_pushback_tt: "§R정보기관이 이러한 개혁에 저항할 것입니다. £pol_power 정치력 생성량이 감소합니다.§!"
 deep_state_intel_reformed_tt: "§G정보기관이 이제 적절한 민간 감독하에 운영됩니다.§!"
 deep_state_surveillance_removed_tt: "§Y제거됨: 확대된 감시 국가 정신§!"
 deep_state_loyal_officers_tt: "§Y민간 정부에 충성하는 장교들을 핵심 보직에 임명합니다.§!"
 deep_state_loyalists_placed_tt: "§G충성파 장교들이 이제 군 지휘 체계의 핵심 보직을 차지하고 있습니다.§!"
 deep_state_emergency_declared_tt: "§R비상사태 선포!§!"
 deep_state_emergency_effect_tt: "§Y비상 권한 발동:\n• 딥 스테이트 성장 180일간 동결\n• 안정도 감소\n• 전쟁 지지도 증가§!"
 deep_state_negotiation_started_tt: "§Y군 지도부와 비밀 협상을 시작합니다.§!"
 deep_state_negotiation_success_tt: "§G협상 성공!\n장군들이 정치 개입을 줄이는 데 동의했습니다.\n딥 스테이트 권력: -4\n 안정도: +2%§!"
 deep_state_negotiation_partial_tt: "§Y부분적 성공\n일부 양보가 이루어졌으나 군은 여전히 영향력을 유지합니다.\n딥 스테이트 권력: -2§!"
 deep_state_negotiation_failed_tt: "§R협상 실패!\n장군들이 귀하의 제안을 거부했으며 이제 더욱 공고히 자리를 잡았습니다.\n딥 스테이트 권력: +2\n 안정도: -3%§!"
