 SOV.Western_Autocracy_ed: "£SOV_western_autocracy (UR) 统一俄罗斯 - §C自由保​​守派俱乐部§!"
 SOV.Western_Autocracy_ed_icon: "£SOV_western_autocracy"
 SOV.Western_Autocracy_ed_desc: "（亲西方观点）统一俄罗斯党\n\n统一俄罗斯党宣称其官方意识形态为‘俄罗斯保守主义’，但实际上它并没有真正的意识形态，而是作为一个大帐篷民粹主义政党，以促进稳定为核心美德，与普京上台前后苏联时代俄罗斯的革命混乱形成鲜明对比。"
 SOV.Conservative_ed: "£SOV_emerging_reactionary (UR) 统一俄罗斯党"
 SOV.Conservative_ed_icon: "£SOV_emerging_reactionary"
 SOV.Conservative_ed_desc: "（大帐篷）统一俄罗斯\n\n统一俄罗斯党宣称其官方意识形态为‘俄罗斯保守主义’，但在很大程度上缺乏实际的意识形态的功能，只是一个充当民粹主义大帐篷功能的政党，以促进稳定为核心美德，这与后苏联时代在俄罗斯的革命性混乱大相径庭。"
 SOV.oligarchism_ed: "£SOV_non_aligned_oligarchism 统一俄罗斯 - §g社会保守派俱乐部§!"
 SOV.oligarchism_ed_icon: "£SOV_non_aligned_oligarchism"
 SOV.oligarchism_ed_desc: "（寡头政治）统一俄罗斯党\n\n统一俄罗斯党宣称其官方意识形态为‘俄罗斯保守主义’，但实际上它并没有真正的意识形态，而是作为一个大帐篷民粹主义政党，以促进稳定为核心美德，与普京上台前后苏联时代俄罗斯的革命混乱形成鲜明对比。"
