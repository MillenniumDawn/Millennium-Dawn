 DIVISION_MODIFICATION_NEED_FILLED_GARRISON: "\t- Для укомплектования бригад и гарнизонов нужно ещё $AMOUNT|H0$ ед. $EQUIPMENT|H$ ( в наличии $STOCK_AMOUNT|H0^$ )"
