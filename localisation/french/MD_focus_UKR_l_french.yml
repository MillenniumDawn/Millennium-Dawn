 UKR_security_start: "Sécurité de l'Ukraine"
 UKR_security_start_desc: "Notre pays est immense et a donc besoin d'une forte protection intérieure ; nous commencerons à financer et à réformer nos structures gouvernementales."
 UKR_sbu_start: "Réforme du SBU"
 UKR_sbu_start_desc: "Notre service de sécurité d'Ukraine a besoin d'une réforme en profondeur et d'une efficacité accrue."
 UKR_sbu_t: "Direction principale « T »"
 UKR_sbu_t_desc: "Le Conseil de sécurité de l'Ukraine met en œuvre une politique d'État dans le domaine de la lutte contre les organisations et les individus dont le but est de saper l'État national, d'éliminer l'indépendance de l'Ukraine, de changer l'ordre constitutionnel par la force, de violer la souveraineté et l'intégrité territoriale de l'État, de saper sa sécurité, de s'emparer illégalement du pouvoir d'État, de faire la propagande de la guerre, de la violence, d'attiser l'hostilité interethnique, raciale, religieuse et autre, et de porter atteinte aux droits et libertés de l'homme.\n\nAinsi que la prévention, la détection et la répression des crimes et autres actes illégaux qui posent directement une menace aux intérêts vitaux de l'État et à la sécurité des citoyens d'Ukraine et relèvent de la compétence du Service de sécurité de l'Ukraine, il met en œuvre la prévention du crime dans ce domaine."
 UKR_sbu_corrupt: "Direction principale « K »"
 UKR_sbu_corrupt_desc: "Le Service de sécurité de l'Ukraine, selon la loi d'Ukraine « Sur les fondements organisationnels et juridiques de la lutte contre la corruption et le crime organisé du 30.06.1993 n° 3341-XII », est chargé de la lutte contre la corruption et le crime organisé.\n\nL'un des organes d'État autorisés à travailler dans ce domaine est la Direction principale de lutte contre la corruption et le crime organisé du Conseil de sécurité de l'Ukraine (GU « K »)."
 UKR_sbu_contr: "Direction principale du contre-espionnage militaire"
 UKR_sbu_contr_desc: "Des organes de contre-espionnage militaire sont créés pour le soutien de contre-espionnage des Forces armées d'Ukraine, du Service national des gardes-frontières d'Ukraine et d'autres formations militaires stationnées sur le territoire de l'Ukraine.\n\nLe système des organes de contre-espionnage militaire du Conseil de sécurité de l'Ukraine se compose de la Direction principale du contre-espionnage militaire, d'organes (unités) dans les régions au sein du Département de contre-espionnage, d'unités opérationnelles de contre-espionnage militaire dans les commandements (directions) opérationnels, régionaux et territoriaux, les corps d'armée, les unités et formations militaires individuelles."
 UKR_sbu_svr: "Service de renseignement extérieur"
 UKR_sbu_svr_desc: "Le Service de renseignement extérieur de l'Ukraine, ou SZRU, est une agence de renseignement du gouvernement ukrainien. Il mène ses activités de renseignement dans les sphères politique, économique, militaire, scientifique, d'information technique et écologique, et est subordonné directement au président de l'Ukraine."
 UKR_sbu_sviaz_desc: "Le Service d'État des communications spéciales d'Ukraine, également connu sous le nom de Derzhspetszv'yazku, est une autorité exécutive spécialisée dont les fonctions clés incluent la fourniture de communications gouvernementales sécurisées, un service de courrier gouvernemental, la protection de l'information et la défense contre les cyberattaques."
 UKR_sbu_alpha: "Alpha"
 UKR_sbu_alpha_desc: "Le groupe « A » du Centre des opérations spéciales du Service de sécurité de l'Ukraine est une unité spéciale du Service de sécurité de l'Ukraine. Officiellement, il porte le nom d'« Unité militaire E6117 »."
 UKR_sbu_administration: "Administration civilo-militaire"
 UKR_sbu_administration_desc: "L'administration civilo-militaire est une autorité d'État temporaire en Ukraine, créée dans les territoires adjacents à la zone de combat."
 UKR_peacemakers: "Programme de maintien de la paix"
 UKR_peacemakers_desc: "Notre pays a toujours cherché à participer aux missions de maintien de la paix partout sur la planète, et nous poursuivrons cette tradition."
 UKR_border_guard: "Service national des gardes-frontières"
 UKR_border_guard_desc: "Le Service national des gardes-frontières d'Ukraine est la garde-frontière de l'Ukraine. C'est un organe indépendant de l'application de la loi, organisé par la Constitution de l'Ukraine comme une formation militaire, dont le chef est subordonné au président de l'Ukraine."
 UKR_reform_vv: "Réforme des troupes intérieures"
 UKR_reform_vv_desc: "Nos troupes intérieures ont un statut incertain dans la hiérarchie des structures d'État depuis leur apparition ; il est temps d'y remédier."
 UKR_finance_vv: "Financement des bataillons spéciaux"
 UKR_finance_vv_desc: "Nous financerons les activités des bataillons spéciaux des troupes intérieures ; peut-être nous seront-ils très utiles à l'avenir."
 UKR_sbu_white_wolves: "Bataillon des Loups blancs"
 UKR_sbu_white_wolves_desc: "Le SBU enverra un bataillon créé à partir de ses employés à la guerre."
 UKR_border: "Service national des gardes-frontières"
 UKR_border_desc: "Nos frontières sont trop vastes pour s'en remettre à des unités individuelles des forces armées pour les protéger. Les troupes frontalières accompliront cette tâche plus efficacement."
