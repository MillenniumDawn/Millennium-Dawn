 low_stability_protests_category: "고조되는 혼란"
 low_stability_protests_category_desc: "지난 몇 주간의 불안정한 상황은 국민 사이의 혼란을 키웠으며, 변화를 요구하는 목소리가 시시각각 커지고 있습니다. 어떻게든 이들을 달래지 못하면 끔찍한 결과가 기다릴지도 모릅니다."
 lsp_raise_stability_mission: "국가 안정도 회복"
 lsp_raise_stability_mission_desc: "이 시위가 통제 불능으로 커지기 전에 국민을 달래기 위해 신속히 행동해야 합니다. 일부 정책을 철회하거나 인기 있는 조치를 시행해야 할지도 모릅니다."
