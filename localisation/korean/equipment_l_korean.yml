 Heavy_Anti_tank_8_desc: "중형 대전차 유도 미사일 체계는 더 긴 사거리와 더 큰 미사일 탄두 중량을 갖습니다. 이로 인해 늘어난 무게 때문에 휴대하기에 적합하지 않아 차량에 탑재됩니다. 중장갑 차량을 공격하도록 특별히 설계된 고폭 탄두를 사용합니다."
 Anti_Air_5: "휴대용 방공 시스템(MANPADS) 2045"
 Anti_Air_5_desc: "휴대용 방공 체계는 어깨에 얹어 발사하는 지대공 미사일 발사기입니다. 휴대를 위한 중량 때문에 미사일 크기에 엄격한 제한이 있어 단거리 체계입니다. 따라서 저공비행 항공기에 위협이 되며 헬리콥터에게는 치명적입니다."
 SP_Anti_Air_5: "자주 대공포 2045"
 SP_Anti_Air_5_desc: "중단거리 차량 탑재형 방공 체계는 MANPADS보다 더 크고 따라서 사거리가 더 긴 미사일을 사용할 수 있어 모든 항공기에 위협이 됩니다. 또한 더 많은 미사일을 탑재할 수 있습니다. 이러한 대공 체계는 전용 방공 소대 및 포대로 편성됩니다."
 Anti_Air_6: "휴대용 방공 시스템(MANPADS) 2055"
 Anti_Air_6_desc: "휴대용 방공 체계(Man-Portable Air-Defense Systems)는 어깨에 얹어 발사하는 지대공 미사일 발사기입니다. 휴대성을 위한 중량 요건 때문에 미사일 크기에 엄격한 제한이 따르므로 단거리 체계입니다. 따라서 저공비행하는 항공기에 위협이 되며 헬리콥터에는 치명적입니다."
