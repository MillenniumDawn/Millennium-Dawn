 STALKER_zone_overview_title: "이상 구역: §Y[?global.STALKER_active_zone_anchors^num|0]§!곳 활성"
 STALKER_zone_overview_row: "[THIS.GetName] | [THIS.STALKER_zone_leading_faction] | [THIS.STALKER_zone_overview_status]\n   활동 §Y[?STALKER_zone_activity|0]§!, 봉쇄 §Y[?STALKER_zone_containment|0]§!, 개발 §Y[?STALKER_zone_exploitation|0]§!"
 STALKER_zone_overview_row_tt: "스토커: §Y[?STALKER_zone_stalkers|0]§!\n듀티: §Y[?STALKER_zone_duty|0]§! | 프리덤: §Y[?STALKER_zone_freedom|0]§! | 도적: §Y[?STALKER_zone_bandits|0]§! | 모놀리스: §Y[?STALKER_zone_monolith|0]§!\n생태학자: §Y[?STALKER_zone_scientists|0]§! | 군: §Y[?STALKER_zone_military|0]§!\n와드: §Y[?STALKER_zone_ward|0]§! | 스파크: §Y[?STALKER_zone_spark|0]§! | 클리어 스카이: §Y[?STALKER_zone_clear_sky|0]§! | 정오단: §Y[?STALKER_zone_noon|0]§! | 용병: §Y[?STALKER_zone_mercenaries|0]§!\n지난달 아티팩트: §Y[?STALKER_zone_artifact_haul|1]§!개, 그중 §R[?STALKER_zone_black_market|1]§!개가 암시장으로 흘러감"
