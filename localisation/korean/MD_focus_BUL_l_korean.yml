 BUL_rebellion_category: "마케도니아 위기"
 BUL_rebellion_category_desc: "\n\n\n\n\n\n\n\n\n\n\n\n불가리아-마케도니아 국경 분쟁은 1990년대 초 유고슬라비아 해체로 거슬러 올라가는 오랜 문제입니다. 양국은 역사적, 정치적 이유로 국경의 정확한 경계 획정에 합의하지 못하고 있습니다. 불가리아는 북마케도니아 공화국의 민족 정체성과 언어 일부가 자국의 영토 주장을 강화하려는 목적으로 인위적으로 구성되었다고 주장합니다. 그러나 북마케도니아는 이러한 주장이 근거 없고 터무니없다며 일관되게 부인해 왔습니다. 최근 양국은 협상하고 해결을 향해 노력하려는 의지를 보였습니다. 유럽 연합 역시 양측 간 회담을 중재하고 촉진하는 데 중요한 역할을 해 왔습니다. 이 분쟁의 해결은 지역 협력을 증진하고 발칸 국가들 사이의 긴장을 완화하는 데 결정적일 것입니다. 마케도니아는 이 분쟁 때문에 주권을 잃을 수도 있습니다..."
