 module_futuristic_integrated_missile_radar_control1: "미래형 전투 정보 체계"
 module_naval_adl_1: "점방어 레이저 I"
 module_naval_adl_1_desc: "점방어 레이저는 드론과 날아오는 미사일에 신속하고 정밀하게 대응하며, 빛의 속도로 표적을 공격하고 기존 요격체와 같은 재장전 제약이 없습니다.\n\n§G설계 힌트: 점방어 레이저는 근접 방호를 위한 강력한 대공과 장갑을 제공합니다. 첨단 항공 및 미사일 위협에 유용하지만 기존 점방어 체계보다 IC 비용이 높고 연료를 더 소모합니다.§!"
 module_naval_adl_2: "점방어 레이저 II"
 module_naval_adl_2_desc: "점방어 레이저는 드론과 날아오는 미사일에 신속하고 정밀하게 대응하며, 빛의 속도로 표적을 공격하고 기존 요격체와 같은 재장전 제약이 없습니다.\n\n§G설계 힌트: 점방어 레이저는 근접 방호를 위한 강력한 대공과 장갑을 제공합니다. 첨단 항공 및 미사일 위협에 유용하지만 기존 점방어 체계보다 IC 비용이 높고 연료를 더 소모합니다.§!"
