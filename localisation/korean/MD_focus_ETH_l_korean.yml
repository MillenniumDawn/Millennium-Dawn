l_korean:
 ETH_eritrea_focus: "에티오피아-에리트레아 중점 계통도"
 ethiopia_focus: "에티오피아 중점 계통도"
 ETH_invite_foreign_investors: "외국 투자자 초청"
 ETH_invite_foreign_investors_desc: "에티오피아는 절실하게 경제 원조를 필요로 하는 상황입니다. 자국은 엄청난 노동력이 내제되어 있음과 동시에 저임금과 높은 실직률이 산재하는 곳입니다. 다른 관점에서는 선진국의 회사가 투자하기에는 딱 알맞은 곳이기도 합니다."
 ETH_invite_coca_cola: "코카콜라 유치"
 ETH_invite_coca_cola_desc: "미국의 초거대기업 코카콜라는 에티오피아의 높은 잠재적인 고객과 고용 수치를 분석했습니다. 이들이 투자하고 코카콜라의 상표를 에티오피아에서 동아프리카의 음료 회사의 지분을 나누도도록 해야합니다."
 ETH_invite_karuturi_global: "카루투리 글로벌 유치"
 ETH_invite_karuturi_global_desc: "인도 회사인 카루투리 글로벌은 농업 분야에 있어서는 막강한 영향력을 끼치고 있습니다. 주 수입원은 장식용 꽃이지만, 이 회사의 경력을 통해 국민들의 수입을 늘리고 농부들의 농업 지식 향샹을 꾀할 수 있을 것입니다."
 ETH_invite_lifan_industry: "리판 산업 유치"
 ETH_invite_lifan_industry_desc: "Lifan Industry is a heavy industrial company founded in China in 1992. Mainly focused on building cars, motorcycles and trucks, Lifan could certainly help us with the low motorization rate among our citizens."
 ETH_american_industrial_investments: "미국의 산업 투자"
 ETH_american_industrial_investments_desc: "미국 기업은 에티오피아에서의 이권을 침해하는 중국 기업에게 대단히 큰 경각심을 갖고 있습니다. 이를 이용해 자국의 이권을 챙길 수 있을 것입니다."
 ETH_request_international_loans: "국제 대차 요구"
 ETH_request_international_loans_desc: "에티오피아의 경제는 성장해가고 있지만, 국가 지출비는 낮은 신용도와 없다시피한 국가 인지도로 정체된 상태입니다. 선진국에 대차를 요구하여 이러한 문제를 고칠 수 있을지도 모릅니다."
 ETH_support_messobo_cement: "메소보 시멘트 지원"
 ETH_support_messobo_cement_desc: "The Messebo Cement factory is one of our more powerful local conglomerates, important for the building boom that we plan for the country. By increasing the funding distributed to Messebo, we will be able to finish building projects quicker."
 ETH_homegrown_companies: "자국성장 기업"
 ETH_homegrown_companies_desc: "국제 기업의 원조로 경제가 부흥한 뒤, 국민들은 지속되는 저임금과 식민경제의 반복에 대한 경각심을 가지게 되었습니다. 강력하고 독립적인 에티오피아 회사를 설립하여 국제 기업과 경쟁을 하여 이득을 서로서로간에 수익을 낼 필요가 있습니다."
 ETH_fund_ethio_agri_ceft: "에티오피아 농업-CEFT(Ethio Agri-CEFT) 자금 조성"
 ETH_fund_ethio_agri_ceft_desc: "에티오피아 농업-CEFT(Ethio Agri-CEFT)는 동아프리카 농업 시장에서는 가장 규모가 큰 개인회사가 되었습니다. 이 회사를 밀어주어서 카루투리사와 경쟁을 붙이고 다른 한편으로는 자국의 농부들을 보호해야합니다."
 ETH_fund_ethiopian_airlines: "에디오피아 에어라인 자금 조성"
 ETH_fund_ethiopian_airlines_desc: "에티오피아 에어라인은 공기업입니다. 해외 관광객들의 운송과 자국민들의 해외 운송을 담당하고 있습니다. 이곳에 자금을 조성하여 향후의 국제 영향력에 도움을 줄 수 있을 것입니다."
 ETH_fund_marathon_motors_engineering: "마라톤 모터스 엔지니어링 자금 조성"
 ETH_fund_marathon_motors_engineering_desc: "Marathon Motor Engineering PLC is a joint venture between the South Korean automotive industrial concern Hyundai and local superstar Haile Gebrselassie. The company will focus on importing Hyundai vehicles into the country - and will provide our countrymen with more choices when it comes to their vehicles. Let the Chinese and the Koreans compete with each other for the lowest-possible prices."
 ETH_industrial_buildup_1: "성장 및 전환 계획"
 ETH_industrial_buildup_1_desc: "산업 단지를 위한 추가 건물부지를 확보할 필요가 있습니다."
 ETH_industrial_buildup_2: "산업 개발 II"
 ETH_industrial_buildup_2_desc: "더 많은 건설 계획을 필요로 합니다. 추가 민간 공장 시설을 짓는 것은 발전을 위해 지금 당장 해야할 것입니다."
 ETH_industrial_buildup_3: "산업 개발 III"
 ETH_industrial_buildup_3_desc: "추가 산업 단지는 더 많은 고용을 할 수 있다는 말과 같습니다. 더 많은 고용은 더 부유해짐을 의미합니다."
 ETH_industrial_buildup_4: "산업 개발 IV"
 ETH_industrial_buildup_4_desc: "산업 단지를 위한 추가 건물부지를 확보할 필요가 있습니다."
 ETH_military_buildup_1: "군수 개발"
 ETH_military_buildup_1_desc: "자국의 산업 역량은 국가를 존속시킬 수 있을 만큼 충분하지 않습니다."
 ETH_military_buildup_2: "군수 개발 II"
 ETH_military_buildup_2_desc: "소총, 전차, 비행기를 생산할 추가 공장을 지을 필요가 있습니다! 전부 다 많이 생산해야 합니다!"
 ETH_international_diplomacy: "국제 외교"
 ETH_international_diplomacy_desc: "우리 어깨너머를 지켜봐 줄 이가 없다면 세상은 무서운 곳입니다. 우리 주변 세계의 환심을 사기 시작하는 것이 극히 중요합니다."
 ETH_african_economic_relationships: "아프리카 경제 외교"
 ETH_african_economic_relationships_desc: "아프리카는 대부분의 기준으로 볼 때 가난하지만, 에티오피아의 지도력 아래에서 우리는 각국에 개발주의를 확산시켜 더 나은 곳으로 만들 수 있습니다."
 ETH_european_economic_relationships: "유럽 경제 외교"
 ETH_european_economic_relationships_desc: "유럽은 경제를 부양하는 데 있어 우호적인 친구가 될 가능성이 높습니다. 유럽과의 계약과 투자는 가장 수익성이 높은 사업에 속하기도 합니다."
 ETH_italian_ethiopian_friendship: "이탈리아-에티오피아 협력"
 ETH_italian_ethiopian_friendship_desc: "이탈리아는 우리를 두 번 침략했지만, 그렇다고 해서 우리가 차이를 화해하고 친구가 될 수 없는 것은 아닙니다."
 ETH_request_chinese_investments: "중국 투자 요구"
 ETH_request_chinese_investments_desc: "중국은 모두가 활용할 수 있는 막대한 부를 가지고 있습니다. 중국 투자자들은 돈을 쓸 다른 곳을 찾고 있습니다. 그들이 이곳 에티오피아에서 돈을 쓰도록 설득해 봅시다!"
 ETH_african_union_commitment: "아프리카 연합 위원회"
 ETH_african_union_commitment_desc: "아프리카 연합은 다양한 우리 대륙을 모든 형태의 외세 착취에 맞서 단결시키는 데 중요합니다. 우리는 아프리카 연합의 기능과 목적에 다시 헌신해야 합니다."
 ETH_request_european_investments: "유럽 투자 요구"
 ETH_request_european_investments_desc: "우리는 유럽인들과 몇 가지 협정을 맺어야 합니다. 그들에게는 에티오피아 시장에 참여하기를 기다리는 투자자들이 있습니다."
 ETH_befriend_france: "프랑스와의 동맹"
 ETH_befriend_france_desc: "프랑스는 경제적으로 가장 발달한 나라 중 하나와 함께 더 큰 기반을 얻기 위한 자연스러운 동맹입니다."
 ETH_establish_connections_with_tongji: "Establish Connections with the CSCEC"
 ETH_establish_connections_with_tongji_desc: "아디스 아바바에 아프리카 연합 본부를 짓기위한 계획을 실현하기 위해 몇몇 건설 회사와 협력을 해야합니다. 그 중 하나인 중국의 퉁지라는 회사는 새로운 건물을 짓기에 적합한 기업입니다."
 ETH_expand_the_diplomatic_corps: "국제 외교 확대"
 ETH_expand_the_diplomatic_corps_desc: "앞으로 어떤 사업이든 추진하려면 외교는 필수입니다."
 ETH_anti_corruption_measurements: "Anti-Corruption Measures"
 ETH_anti_corruption_measurements_desc: "국가는 끔찍하게 부패해 있습니다. 이제 앞으로 나아가 국경 안의 부패를 뿌리 뽑기 시작할 때입니다. 마땅히 그래야 할 자들을 감옥에 보내는 것보다 더 보람찬 일은 없습니다."
 ETH_the_new_african_union_headquarters: "새로운 아프리카 연합 본부"
 ETH_the_new_african_union_headquarters_desc: "자국의 수도인 아디스 아바바에 새로운 아프리카 연합 본부를 짓는 것은 세계에 아프리가의 위대함을 경외심을 인식시키며, 특히 에티오피아의 국력을 과시할 수 있는 일입니다."
 ETH_stabilize_the_food_supply: "식량 공급 안정화"
 ETH_stabilize_the_food_supply_desc: "식량은 위험한 상황에 놓여 있습니다. 작물과 최근의 에리트레아와의 전쟁으로 인해 우리는 바다와의 연결을 잃었습니다. 우리는 무역을 되찾고 정상화하는 데 힘써야 하며, 그렇지 않으면 우리 국민이 굶주릴 것입니다."
 ETH_local_relationships: "지방 우호"
 ETH_local_relationships_desc: "아프리카의 뿔은 불안정하고 무서운 곳입니다. 소말리아 내전과 에티오피아-에리트레아 전쟁으로 인해 우리는 누가 우리의 친구인지 재평가하게 되었습니다. 따라서 우리는 지역 관계를 다지는 데 집중해야 합니다."
 ETH_african_alliance_initiative: "아프리카 동맹 계획"
 ETH_african_alliance_initiative_desc: "아프리카는 아직까지도 열강들의 전쟁터에 불과합니다. 미국, 유럽, 중국은 우리 대륙이자 국민들의 터전을 탐내고 있습니다. 아프리가가 초 거대기업의 꼭두각시가 되어야 할까요? 아닙니다! 개입과 침략에 저항하기 위해서는 국제 동맹을 결성해야 합니다."
 ETH_invite_european_armament_companies: "유럽 군수회사 초청"
 ETH_invite_european_armament_companies_desc: "일부 무기 제조업체를 우리 국경 안에 두는 것은 대단히 가치 있을 것입니다."
 ETH_defense_of_ethiopia: "에티오피아 방위"
 ETH_defense_of_ethiopia_desc: "에티오피아는 침략자로부터 독립을 지키기 위해 수많은 전쟁을 치러 왔습니다. 우리가 앞으로 치를 전쟁도 오래전 과거에 치른 전쟁과 다르지 않습니다."
 ETH_expand_the_endf: "에티오피아 방위군(ENDF) 확장"
 ETH_expand_the_endf_desc: "에티오피아 국방군(ENDF)은 아프리카에서 가장 강한 군대 중 하나입니다. 경쟁력을 유지하려면 우리는 군대를 확장해야 합니다."
 ETH_expand_the_etaf: "에티오피아 공세군(ETAF) 확장"
 ETH_expand_the_etaf_desc: "우리 공군은 절실히 확장이 필요합니다. 비행장은 적고 전투기와 장비는 구식입니다. 우리는 이를 바꿔야 합니다."
 ETH_secure_the_eritrean_border: "에리트레아 국경선 확보"
 ETH_secure_the_eritrean_border_desc: "에리트레아와의 국경을 따라 참호를 구축하면 두 정부 사이에 향후 분쟁이 발생할 경우 우리에게 도움이 될 것입니다."
 ETH_fund_homicho: "호미코 자금 지원"
 ETH_fund_homicho_desc: "호미코 탄약 공업은 소형화기, 특히 탄약 공급에 있어서는 에티오피아에 반드시 필요한 회사입니다. 신형 총기, 수 톤의 총알이 보관된 창고를 통해서 병사들의 역량을 늘릴 필요가 있습니다."
 ETH_air_training_program: "공군 훈련 계획"
 ETH_air_training_program_desc: "공군을 훈련시키려면 프로그램이 필요합니다. 이를 개발하도록 추진합시다."
 ETH_secure_the_somali_border: "소말리아 국경선 확보"
 ETH_secure_the_somali_border_desc: "소말리아 내전은 분쟁으로 인해 난민이 우리 국경을 넘어오고 군사 및 중요 민간 목표물 인근에서도 일부 교전이 발생하고 있어 우리에게 불안감을 안겨 주었습니다. 소말리아 국경을 따라 일부 참호를 확장할 때입니다."
 ETH_secure_the_kenyan_border: "케냐 국경선 확보"
 ETH_secure_the_kenyan_border_desc: "오모 강 댐은 우리 두 위대한 나라 사이에 큰 갈등을 일으켰습니다. 양측 부족이 수자원을 잃으면서 국경 지역에서 분쟁이 발생했습니다. 우리 군은 이 지역을 안정시키기 위해 이 지역에 몇 개의 전초와 기지를 설치해야 합니다."
 ETH_modern_officer_corps: "현대 장교단"
 ETH_modern_officer_corps_desc: "장교의 교육과 기량에 투자하면 우리는 진정으로 현대화된 장교단을 갖출 수 있을 것입니다."
 ETH_expand_the_military: "군대 확장"
 ETH_expand_the_military_desc: "군대를 필요한 규모로 키우려면 모든 군 병과의 본격적인 확장이 필요합니다."
 ETH_aircraft_production: "항공기 생산"
 ETH_aircraft_production_desc: "자국산 항공기 생산은 더 저렴할 뿐 아니라 경제에도 더 좋습니다!"
 ETH_secure_the_sudanese_border: "수단 국경선 확보"
 ETH_secure_the_sudanese_border_desc: "남수단 사태로 인해 수단과 에티오피아의 관계는 다소 긴장되어 있습니다. 전쟁이 그들의 국경 안에 머물지 않을 경우에 대비해야 합니다."
 ETH_study_foreign_armor_designs: "외국 전차 설계 연구"
 ETH_study_foreign_armor_designs_desc: "외국의 장갑 설계를 연구하면 우리 자체 장갑차량을 개발하는 방법에 대해 많은 것을 배울 수 있을 것입니다."
 ETH_study_foreign_aircraft_designs: "외국 항공기 설계 연구"
 ETH_study_foreign_aircraft_designs_desc: "미국, 러시아, 프랑스, 영국, 중국 같은 주요국의 주목할 만한 항공기 설계를 연구하는 것은 우리 공군에 매우 유익할 수 있습니다."
 ETH_request_chinese_military_assistance: "중국 군사원조 요청"
 ETH_request_chinese_military_assistance_desc: "중국은 떠오르는 강대국입니다. 그들의 군 구조는 하나의 모범이며, 이곳 에티오피아에도 비슷한 것을 도입하는 방안을 논의해야 합니다."
 ETH_request_american_military_assistance: "미국 군사원조 요청"
 ETH_request_american_military_assistance_desc: "미군은 세계에서 가장 규모가 크고 가장 앞선 군대 중 하나입니다. 군 발전을 위해 그들에게 기대를 걸어야 합니다."
 ETH_modernize_the_military: "군 현대화"
 ETH_modernize_the_military_desc: "군은 1975년의 장비를 사용하고 있으며, 차량은 무너져 가고 항공기는 간신히 이륙할 정도입니다. 지역의 강국으로 남기 위해 군을 현대화하는 방향으로 나아가야 합니다."
 ETH_land_doctrine: "육군 교리"
 ETH_land_doctrine_desc: "이웃 나라들이 끊임없이 분쟁에 휘말려 있기에 우리 지상군은 가장 중요한 병과 중 하나입니다. 우리의 육군과 전략을 개선할 새로운 방안을 논의해야 합니다."
 ETH_air_doctrine: "공군 교리"
 ETH_air_doctrine_desc: "우리의 공군 교리는 시대에 뒤떨어져 있습니다. 우리의 가장 뛰어난 인재들을 해외 사관학교에 보내 그 지식 일부를 가져올 수 있는지 알아보십시오."
 ETH_the_future_of_ethiopia: "에티오피아의 미래"
 ETH_the_future_of_ethiopia_desc: "에티오피아는 지난 50년간 절대왕정, 공산주의, 민주주의를 겪어왔습니다. 또한 가난함, 기아, 내전, 정치적 혼란도 겪어왔습니다."
 ETH_legacy_of_abyssinia: "아비시니아의 유산"
 ETH_legacy_of_abyssinia_desc: "Ethiopia has had a glorious history as one of Africa's first western-style nation states, led by the emperor. This country, generally called 'Abyssinia' in the west, would be destined to take a leading role in Africa and the world if it were ever to be reborn."
 ETH_endorse_the_monarchists: "군주주의자 지지"
 ETH_endorse_the_monarchists_desc: "1974년 9월 12일, 하일레 셀라시에 1세가 개발 및 경제 연구 기관을 해체한 뒤, 에티오피아 왕실은 실질적으로 힘을 잃었습니다. 1993년, 왕실은 다시금 그 위상이 떨어져 결과적으로는 '에티오피아 황제'라는 직함만 존재하고 있는 상황입니다. 왕실을 다시금 연방 정부의 일원으로써 받아들여야할 것입니다."
 ETH_glorify_the_italo_ethiopian_wars: "이탈리아-에티오피아 전쟁 미와"
 ETH_glorify_the_italo_ethiopian_wars_desc: "나라, 국가와 국수주의자들은 싸움을 들어가게 되었습니다. 에티오피아는 1895년, 1935년 전쟁을 한 과거를 가지고 있습니다. 이탈리아로부터 얻은 교훈과 기술적으로 열등하지만 용맹했던 에티오피아 군을 잊어서는 안됩니다. 이탈리아는 자국을 위협하고 있으며, 더 나아가서 멸망시키려하고 있습니다. 하지만 아직 우리는 굳건합니다!"
 ETH_restore_the_throne: "왕정 복고"
 ETH_restore_the_throne_desc: "현재는 연방의 일원인 왕실은 에티오피아 제국의 부활을 주장하고 있습니다. 그냥... 뭐 새로운 헌법을 제정하는 것일 뿐이겠죠."
 ETH_befriend_jamaica: "자베이카와의 동맹"
 ETH_befriend_jamaica_desc: "하일레 셀라시에가 집권은 에티오피아 군주제의 복권으로 전 황제를 메시아라고 믿고 있는 종교인인 래스터패리언 신자들과의 관계를 돈독히 해야 합니다. 이들의 주요 분포지는 자메이카이므로, 자메이카와의 동맹을 성사시켜야할지도 모릅니다."
 ETH_invite_zera_yacob: "제라 야콥 초청"
 ETH_invite_zera_yacob_desc: "제라 야콥 아마 살라시에는 하일레 셀라시에 1세의 손자로 에티오피아 황자에 적합한 계승자입니다. 이튼 칼리지에서 교육을 받으면서 1974년 공산주의 혁명으로 추방당했습니다. 현재는 영국, 미국을 오가며 살고 있습니다."
 ETH_weaken_the_parliament: "의회 약화"
 ETH_weaken_the_parliament_desc: "에티오피아를 다스리는 집권기관이 두개나 있으면, 이는 국가, 나라의 영향력에 큰 지장을 주게될 뿐입니다. 의회를 해산시키고 그 인원으로 하여금 황실을 위해 전념하도록 해야 합니다."
 ETH_imperial_nostalgia: "황제의 향수"
 ETH_imperial_nostalgia_desc: "Don't you wish we could turn back time, to the good old days?"
 ETH_imperial_guard: "에티오피아 근위대"
 ETH_imperial_guard_desc: "케부르 자바나는 우리군에서 가장 용감하고 명예로운 전사들로 구성된 엘리트 부대로, 우리 수도와 황제를 방어하는 임무를 맡고 있습니다."
 ETH_reclaim_eritrea: "에리트레아 영유권 주장"
 ETH_reclaim_eritrea_desc: "에리트레아는 정당한 에티오피아의 영토입니다! 이 도둑 국가의 존재로 해상으로 향하는 길 자체가 그 존속을 위협받고 있습니다. 저놈들의 영토가 누구 것인지 인지를 시켜주어야 합니다."
 ETH_strengthen_the_republic: "공화국 강화"
 ETH_strengthen_the_republic_desc: "국민의 권리를 보장하고 공산주의자, 군주주의자들의 힘을 약화시키는 1995년 재정된 에티오피아 헌법은 에티오피아 사회의 등불이 되어주었습니다. 민주주의와 아프리카 통합주의가 우리가 나아가야할 길입니다."
 ETH_guarantee_freedom_of_speech: "표현의 자유 보장"
 ETH_guarantee_freedom_of_speech_desc: "에티오피아는 종교적, 관습적, 정치적으로 다양한 분포를 나타내고 있는 곳입니다. 다른 사상과 학교의 가르침을 뛰어넘어 민주주의의 우월성을 퍼뜨리기 위해서는 개인, 공공의 정치적 표현의 자유를 보장할 필요가 있습니다. 이를 위해 정치담화 라디오, 텔레비전 프로에 자금을 조성할 것입니다."
 ETH_healthcare_program: "보험"
 ETH_healthcare_program_desc: "에티오피아와 같은 나라에서 굶주림, 병과 같은 문제를 해결하는 국가보험의 발의는 엄청난 고난을 겪어왔습니다. 하지만 세계 곳곳의 나라로부터의 도움과 의료교육과 지역 의료시설 및 의사들에 대한 문제 해결 집중을 통해서 보험은 궤도에 들어설 수 있었습니다."
 ETH_guarantee_freedom_of_religion: "종교의 자유 보장"
 ETH_guarantee_freedom_of_religion_desc: "에티오피아는 에티오피아 정교회(43%), 개신교(18%), 수니 이슬람(34%), 기도료(1%), 전통종교(3%)의 고향입니다.이 다양하고 다양한 종교집단이 평화롭게 살아가도록 각각을 인정할 필요가 있습니다. 종교 학교가 철폐될 필요가 있습니다."
 ETH_education_program: "교육 계획"
 ETH_education_program_desc: "국민들의 생각을 현대인처럼 만들고 활력을 띄게 만들려면, 아이들을 교육할 필요가 있습니다."
 ETH_endorse_the_african_union: "아프리카 연합 지지"
 ETH_endorse_the_african_union_desc: "Ethiopia on its own is not powerful enough. We should instead focus on uniting the political leaderships across Africa and encourage the AU to become more like the EU."
 ETH_reckless_industrial_expansion: "마구잡이 산업 확충"
 ETH_reckless_industrial_expansion_desc: "에티오피아는 현대화대며, 강해지고 자유로워야 합니다! 새로운 마을, 도시, 그리고 특히 산업시설을 위한 부지를 필요로 합니다."
 ETH_secure_agricultural_production: "농업 생산 확보"
 ETH_secure_agricultural_production_desc: "국가를 먹여 살리는 것보다 국민들 먹이는 것이 더 중요합니다. 국민들을 살리는 것이 대규모 농업 생산을 유치하는 것이라면 그래야할 것입니다."
 ETH_declare_mengistu_innocent: "멩기스투의 무죄 공표"
 ETH_declare_mengistu_innocent_desc: "멩기스투 하일레 마리암은 전 에티오피아의 공산주의 독재자입니다. 1997년부터 1991년까지 있은 이 독재자의 집권시기동안, 에티오피아는 군사적 부흥, 반대자들, 내전에 대한 억압을 겪었습니다. 1991년 짐바브웨로 도망쳤고, 그러한 도피생활 중에 에티오피아 법원에 의해 대학살 건이 유죄판결되었습니다. 하지만 사실 대학살과 족재는 모든 점에서 나쁜 것은 아닙니다. 멩기스투에게 무죄를 선고할 수 있을지도 모릅니다."
 ETH_condemn_the_pretenders: "왕가 규탄"
 ETH_condemn_the_pretenders_desc: "1970년대 폐위된 이후부터 전 에티오피아 왕가는 추방자 생활을 해왔습니다. 왕가로 하여금 에티오피아로 오는 것은 죽음을 의미한다고 알려주어야할 것입니다."
 ETH_return_of_mengistu: "멩기스투의 귀환"
 ETH_return_of_mengistu_desc: "전 위대한 지도자에 대한 불공평한 우리의 처우 이후, 다시금 국내 귀환을 허하기를 마음 먹었습니다."
 ETH_restore_the_pdre: "에티오피아 인민민주의공화국 복원"
 ETH_restore_the_pdre_desc: "The People's Democratic Republic of Ethiopia marked the greatest era of our national history. We should announce the restoration of the PDRE - and the return of Mengistu to the world stage."
 ETH_national_communism: "공산주의 확산"
 ETH_national_communism_desc: "아프리카 인민들은 오랫동안 타국의 제국주의에 억압받아왔습니다. 중국의 사기꾼 공산주의자와 동맹을 맺는 것은 반란행위이자 위선행위입니다. 에티오피아는 혼자서 나아갈 것입니다."
 ETH_align_to_china: "중국과 제휴"
 ETH_align_to_china_desc: "마오쩌둥은 블라디미르 레닌보다 뛰어난 인물로 보입니다. 나라가 아직도 존속하고 있으니 말입니다. 중화인민공화국이 소련과 맺었던 친교는 과거의 잔재에 불과합니다. 진정으로 강대국인 중국과 동맹을 맺어야 합니다."
 ETH_pan_african_communism: "범아프리카 공산주의"
 ETH_pan_african_communism_desc: "혁명의 고향이 확보되었다! 이제 퍼뜨려나가야 한다, 동지여! 노동자들의 세상을 위해 단결하라!"
 ETH_eritrea_start: "전쟁이 끝난다..."
 ETH_eritrea_start_desc: "...하지만 테러리스트와의 전쟁은 이제 시작일 뿐이다. 에리트레아의 전 군인들이 이웃국 수단에서 새롭게 (다시) 결성된 에리트레아 자유전선에 합류하고 다시금 전투를 준비하고 있다. 향후 미래는 우리 손에 달려 있다."
 ETH_eritrea_annex: "에리트레아 합병"
 ETH_eritrea_annex_desc: "Since 1991, Eritrea has been independent, it was ruled as a one party state under the dictatorial regime of Afwerki. Now that we have well and truly defeated this regime and worn down the resistance of the local populace, we can institute our own governance entirely."
 ETH_eritrea_arrest_leaders: "아페웨르키 처벌"
 ETH_eritrea_arrest_leaders_desc: "Isaias Afwerki's trial date is due, it likely won't be a good time for him, nor should it be. We need to show the Eritrean people what will happen if they try to fight against the Ethiopian nation and the inevitable change that is, in the end, better for everyone."
 ETH_eritrea_teach_amharic: "임하라어 교육"
 ETH_eritrea_teach_amharic_desc: "How can we expect to rule over the Eritrean people if they can't understand us? By introducing Amharic as a compulsory subject to the Eritrean population in special language schools, we expect the younger Eritreans to pick up on it first, the older generations may be more difficult to teach however."
 ETH_eritrea_federation: "에리트레아-에티오피아 연방법"
 ETH_eritrea_federation_desc: "The first Federation between our two countries dissolved because of, frankly, the imperialistic ambitions of Haile Selassie. We're confident that now is the right time to revive it in a democratic fashion."
 ETH_eritrea_assembly: "Allow Eritrean Branches of Ethiopian Parties"
 ETH_eritrea_assembly_desc: "Whilst we condemn the solidification of power that Afwerki had, it may be necessary to exploit the power structures there in order to push for federalisation, by allowing our own parties to form branches and then run for elections within Eritrea, Ethiopia friendly candidates who are in favour of the Federation Act will almost certainly win, and thus we can achieve our goals in integrating the former Eritrean state as an autonomous region of the new Ethiopia."
 ETH_eritrea_constitution: "새로운 헌법 제정"
 ETH_eritrea_dissolve_assembly: "에리트레아 국가 연합 해체"
 ETH_eritrea_propaganda: "선전 네트워크"
 ETH_stabilize_the_food_supply_TT: "§Y서둘러 식량공급을 하지않으면 기근이 더 악화될 수 있습니다.§!\n"
 ETH_secure_the_eritrean_border_TT: "에리트레아와의 국경에 §Y육군 요새 3§!를 추가합니다"
 ETH_secure_the_somali_border_TT: "소말리아와의 국경에 §Y육군 요새 3§!를 추가합니다"
 ETH_secure_the_kenyan_border_TT: "케냐와의 국경에 §Y육군 요새 3§!를 추가합니다"
 ETH_secure_the_sudanese_border_TT: "수단과의 국경에 §Y육군 요새 3§!를 추가합니다"
 ETH_eritrea_dissolve_assembly_desc: "에리트레아 국민의회는 끔찍하고 낡은 체제이며, 우리는 이 체제를 해산하고 그들에게 잘못된 방식을 일깨우기 위해 최선을 다해야 합니다. 에리트레아인들은 실제로 대표권을 부여받겠지만, 그것은 인민대표원과 연방원을 통해서일 것입니다."
 ETH_detain_rabble_rousers: "분리주의 지도자 후보 구금"
 ETH_detain_rabble_rousers_desc: "재판 중 법원 주변에 추가 경비가 배치되었으나 다행히 필요하지 않았습니다. 그러나 몇몇 주목할 만한 인물을 가려내는 데에는 성공했으며, 이 선동가들이 적대적인 생각을 품지 못하도록 구금해야 합니다..."
 ETH_maintain_a_watchful_eye: "감시의 눈길 유지"
 ETH_maintain_a_watchful_eye_desc: "최악의 선동가들이 더 이상 위협이 되지 않는 지금, 에티오피아 중앙 정부 아래에서 사는 것이 관련된 모든 이에게 더 낫다는 것을 그들이 받아들일 때까지만이라도 새 영토를 감시하는 것이 중요합니다."
 ETH_eritrea_propaganda_desc: "이를 '선전'이라 부르는 것은 거칠 수 있으나, 에티오피아 통치의 이점을 내세우는 문서를 배포하는 것은 필요합니다. 선전망이 클수록 더 많이 배포할 수 있고, 에리트레아인들에게 우리의 관점을 보여 주기도 더 쉬워질 것입니다."
 ETH_eritrea_lawbooks: "법전 재작성"
 ETH_eritrea_lawbooks_desc: "에리트레아의 현행 법률은 원시적이고 시대에 뒤떨어져 있으며, 예를 들어 어떤 신앙을 가질지 정부에 등록해야 하는 일은 있어서는 안 됩니다. 우리가 현대적 연방이며 앞으로도 그러할 것이라는 사실을 더 잘 강조하도록 이 법들을 다시 써야 합니다."
 ETH_eritrea_constitution_desc: "옛 에리트레아 헌법은 목적에 너무나 맞지 않아 제대로 시행조차 되지 않았습니다. 우리 헌법에 맞서지 않고 이를 보완하는 헌법을 다시 쓰고, 이번에는 실제로 제대로 시행되도록 해야 합니다."
 ETH_eritrean_federal_state: "에리트레아와 제대로 연방화"
 ETH_eritrean_federal_state_desc: "마침내, 우리의 노력은 결실을 맺었고, 마지막 단계가 진행될 것으로 예상되며, 에티오피아인과 에리트레아인 모두 거리와 시장에서 서로를 껴안고 있는 것으로 보고되었습니다. 10년 전만 해도 불가능하다고 생각했던 목표가 가능해졌습니다."
 ETH_ERI_acceptance_100_TT: "§H통합§!에 대한 수용도가 §G100%§!입니다"
 ETH_ERI_federalisation_100_TT: "§H연방화§!에 대한 수용도가 §G100%§!입니다"
 ETH_eritrea_federal_parties_allowed_TT: "§Y[ETH.GetNameWithFlag]§!의 이 지역에 대한 통제권을 유지하면서 §Y[ERI.GetNameWithFlag]§!이(가) 자체 사무와 선거 절차를 관리하도록 허용합니다.\n\n지방 선거는 앞으로 몇 주 안에 예정되어 있습니다."
 ETH_eritrea_locked_TT: "§R이 중점의 효과는 에리트레아의 운명을 선택하기 전에는 알 수 없습니다!§!"
 ETH_annexation_support_TT: "통합 진행도가 §G100%§!입니다"
 ETH_federation_support_TT: "연방 지지도가 §G100%§!입니다"
 ethiopia.1.t: "에티오피아의 대출 요청"
 ethiopia.1.d: "에티오피아 정부는 국제 기업의 유치와 정부 투자를 통한 지역 및 지방 경제 부문의 강화로 국가 경제를 정상 궤도에 올리려 시도하고 있습니다.\n\n이제 에티오피아가 우리 재무부에 에티오피아의 산업 및 경제 개발 부문에 대한 추가 정부 대출을 승인해 달라고 요청해 왔습니다. 우리 정부에는 얻을 것이 별로 없어 보이지만, 우리 사업가들은 우리가 에티오피아에 대출을 승인하지 않으면 다른 누군가가 할 것이라고 경고하고 있습니다. 그리고 이 나라에 대한 우리의 적대적 입장 때문에 우리 기업들이 거부당한다면, 다른 누군가의 기업들은 틀림없이 받아들여질 것입니다."
 ethiopia.1.a: "추가 대출을 승인하겠다."
 ethiopia.1.b: "지금은 아무것도 나눌 수 없다."
 ethiopia.2.t: "투자를 모색하는 에티오피아"
 ethiopia.2.d: "에티오피아의 산업 부문은 최근 엄청난 호황을 겪었으며 [ETH.GetLeader]의 정부는 이를 더 확대하려 하고 있습니다. 그러나 에티오피아를 산업 강국으로 만들겠다는 희망은 외국의 투자가 있어야만 실현될 수 있으며, 에티오피아 정부는 우리 자국 기업들이 에티오피아의 성장하는 경제를 지원하도록 설득하기 위해 우리에게 접근했습니다."
 ethiopia.2.a: "승인한다!"
 ethiopia.2.b: "시장이 결정하게 두자."
 ethiopia.3.t: "투자를 모색하는 에티오피아"
 ethiopia.3.d: "에티오피아의 산업 부문은 최근 엄청난 호황을 겪었으며 [ETH.GetLeader]의 정부는 이를 더 확대하려 하고 있습니다. 그러나 에티오피아를 산업 강국으로 만들겠다는 희망은 외국의 투자가 있어야만 실현될 수 있으며, 에티오피아 정부는 우리 자국 기업들이 에티오피아의 성장하는 경제를 지원하도록 설득하기 위해 우리에게 접근했습니다."
 ethiopia.3.a: "승인한다!"
 ethiopia.3.b: "시장이 결정하게 두자."
 ethiopia.4.t: "투자를 모색하는 에티오피아"
 ethiopia.4.d: "에티오피아의 산업 부문은 최근 엄청난 호황을 겪었으며 [ETH.GetLeader]의 정부는 이를 더 확대하려 하고 있습니다. 그러나 에티오피아를 산업 강국으로 만들겠다는 희망은 외국의 투자가 있어야만 실현될 수 있으며, 에티오피아 정부는 우리 자국 기업들이 에티오피아의 성장하는 경제를 지원하도록 설득하기 위해 우리에게 접근했습니다."
 ethiopia.4.a: "승인한다!"
 ethiopia.4.b: "시장이 결정하게 두자."
 ethiopia.7.t: "아디스아바바 경전철 완공"
 ethiopia.7.d: "아디스아바바 경전철이 마침내 건설 단계를 마치고 이제 시험 운행에 들어갑니다. 이 경전철은 원래 두 개 노선에 총 41개 역을 두도록 계획되었으며(이 중 39개가 완공됨), 각 열차는 286명의 승객을 수송할 수 있습니다. 이로써 경전철은 시간당 편도 1만 5천 명, 4개 방향 전체로 6만 명의 승객에게 교통 서비스를 제공할 수 있으며 요금은 에티오피아 비르 2~6입니다.\n\n이 철도는 중국철도그룹이 시공을 맡았으며 선전 지하철 그룹이 운영합니다. 아디스아바바 경전철은 현재 CNR 창춘이 제작한 3량 편성 70% 저상 트램 41대를 보유하고 있습니다."
 ethiopia.7.a: "드디어 교통 체증이 사라진다!"
 ethiopia.8.t: "에티오-지부티 철도 운행 중단"
 ethiopia.8.d: "제2차 세계 대전 이후 이 철도는 장기 쇠퇴기에 접어들었습니다. 도로 운송이 화물을 두고 경쟁하기 시작하면서 1953년부터 1957년까지 철도 수송량은 절반으로 줄었습니다. 1977~1978년의 오가덴 전쟁은 철도에 또 한 번 타격을 입혔는데, 소말리아군이 우리를 침공하여 디레다와까지의 철도를 점령했기 때문입니다. 전쟁 중 철도 일부가 폭파되었고 철도 운행은 다시 절반으로 줄었습니다. 전쟁이 끝난 뒤에도 철도는 정비 부족과 오가덴 해방 전선 같은 반군의 공격으로 계속 쇠퇴했습니다.\n\n정비 부족과 야심 찬 도로 건설 계획 모두 철도 운송의 경쟁력을 점점 떨어뜨렸습니다. 1985년 1월 아와시 철도 참사에서는 열차가 아와시 강 다리에서 탈선하여 아래 협곡으로 추락하면서 승객 429명이 사망했습니다. 올해 아디스아바바와 디레다와 사이의 철도 운행이 마침내 끝났으나, 디레다와와 지부티 사이에서는 열차가 계속 운행되었습니다. 디레다와와 아디스아바바 사이의 선로는 완전히 황폐해졌고, 많은 레일이 도난당해 고철로 팔렸습니다."
 ethiopia.8.a: "더 일찍 수리했어야 했다"
 ethiopia.9.t: "아디스아바바 경전철 확장"
 ethiopia.9.d: "새로 건설된 노선은 완전히 입체 교차 방식입니다. 기존 노선을 연장하는 것 외에 두 개의 신규 노선이 건설되었습니다. 첫 번째 노선은 성 조지 대성당에서 시작하여 멕시코 광장을 지나 아프리카 연합 본부까지 이어지고 레부에서 종착하며, 새 국가 철도망과 연결됩니다. 두 번째 노선은 메게냐냐 로터리에서 시작하여 볼레 공항, 웰로 세페르 지역, 사리스 시장 지역, 좀모 지역을 거쳐 레부에서 종착합니다."
 ethiopia.9.a: "아디스아바바에서 지부티까지!"
 ethiopia.10.t: "아디스아바바-지부티 철도 완공"
 ethiopia.10.d: "이 철도는 새로운 에티오피아 국가 철도망의 근간 역할을 할 것입니다. 우리 수도 아디스아바바를 지부티 및 도랄레 항과 연결하여 바다로 나가는 통로를 제공합니다."
 ethiopia.10.a: "우리 경제에 도움이 될 것이다"
 ETH_railway_destroyed_flg: "에티오-지부티 철도가 파괴되었습니다"
 ethiopia.11.t: "다시... 무기를 든 EPLF!"
 ethiopia.11.d: "제2차 세계 대전 종전 이후 두 번째로 에리트레아는 에티오피아의 점령 아래 놓이게 되었습니다. 많은 전직 고위 정치인과 군 지도자들이 에티오피아군을 피해 탈출하여 수단에서 자발적인 망명 생활에 들어갔습니다. 그곳에서 그들은 에리트레아 인민 해방 전선을 재건한 것으로 보입니다.\n\n원래의 EPLF는 1991년 에티오피아로부터의 에리트레아 독립 직후 민주정의인민전선으로 탈바꿈하여, 최근 해체되기까지 에리트레아의 유일한 합법 정당으로 활동했습니다. 이사이아스가 최근 체포되어 가택 연금 중인 이후, 그의 대통령 고문 예마네 게브레압이 당의 잔존 세력을 넘겨받아 EPLF의 깃발 아래 다시 무기를 들도록 규합하고 있는 것으로 알려졌습니다."
 ethiopia.11.a: "그들이 아무리 애써도 우리는 흔들리지 않는다."
 ethiopia.13.t: "이사이아스 아페웨르키 체포"
 ethiopia.13.d: "아스마라 일대의 총성이 잦아들고 에리트레아의 마지막 정예 수비대가 무기를 내려놓았을 때, 이사이아스 아페웨르키와 그의 가장 충성스러운 부하들은 에티오피아의 심판을 피하려는 마지막 필사적 시도로 비교적 눈에 띄지 않는 차량 행렬을 이끌고 이미 이웃 수단으로 향하는 길에 올라 있었습니다. 그의 경호원들이 끌어낼 수 있는 한 미약한 저항을 했으나, 수적으로 도저히 상대가 되지 않았습니다.\n\n이사이아스 아페웨르키는 곧바로 붙잡혀 아디스아바바행 군용 차량에 실렸으며, 그의 운명은 여전히 불투명하지만 그때까지 그는 에티오피아 최정예 병사들의 감시 아래 가택 연금 상태에 있습니다."
 ethiopia.13.a: "정의가 실현될 것이다."
 ethiopia.14.t: "이사이아스 아페웨르키 재판"
 ethiopia.14.d: "오늘은 에리트레아의 전 지도자 이사이아스 아페웨르키의 재판 날짜입니다. 이미 소란스러운 법정 절차 가운데서도 이사이아스는 모든 이를 압도하는 목소리로 자신의 처지에 항의했습니다. 그가 법정에 들어서자 카메라가 그를 향했고, 그는 법원과 에티오피아 사법 체계 전반에 대한 부패 혐의를 반박하며 이 재판은 그의 운명이 모든 절차 이전에 이미 정해져 있었던 만큼 쇼에 불과하다고 주장했습니다.\n\n그의 처지에 동정적인 많은 국제 기자와 재판 참관인들이 그의 우려에 동조했으나, 부패와 조작된 절차를 외치는 목소리로는 에리트레아의 폭군으로 지목된 인물을 구할 수 없습니다. 며칠에 걸친 숙의와 모든 증거의 검토 끝에 그에게는 신속히 유죄 평결이 내려졌으며, 그의 형량은..."
 ethiopia.14.a: "...사형."
 ethiopia.14.b: "...종신형."
 ethiopia.18.t: "에티오피아로 돌아온 제라 셀라시에"
 ethiopia.18.d: "제라 셀라시에가 에티오피아의 왕으로서 다시금 그 직분을 맡기 위해 돌아옵니다. 그가 오래 살고, 그의 위대한 지도력 아래 그의 나라가 번영하기를 바랍니다."
 ethiopia.18.a: "그를 환영한다"
 ethiopia.19.t: "제라 셀라시에의 대관식"
 ethiopia.19.d: "날짜는 완벽하게 선택되었습니다. 해는 밝게 빛나고 하늘에는 구름 한 점 없습니다. 제라 셀라시에는 환호하는 거대한 군중에 둘러싸여 말을 타고 아디스아바바의 메다네 알렘 대성당으로 향합니다. 오늘은 그가 '하느님이 택하신 자, 유다 지파의 정복하는 사자, 에티오피아의 만왕의 왕, 황제 폐하 암하 셀라시에 1세'로 공식 즉위하는 대관식 날입니다.\n\n그는 하나뿐인 자식과 함께 제국의 깃발로 장식된 대성당 앞에 서서 입구를 향해 걸음을 옮깁니다. 대성당 안에는 에티오피아의 중요 인사들이 모두 대관식을 간절히 기다리고 있습니다.\n\n제라가 사제장을 향해 걸어갈수록 그의 심장은 더 빨리 뛰기 시작합니다. 이것은 그가 결코 잊지 못할 순간이며, 가장 엉뚱한 꿈에서도 상상하지 못했던 순간입니다. 의식 자체는 꽤 빨리 끝났고, 그가 정통 에티오피아의 왕으로서 걸어 나오자 모두가 그에게 허리를 숙입니다."
 ethiopia.19.a: "폐하 만세!"
 ethiopia.20.t: "닥쳐온 기근!"
 ethiopia.20.d: "이웃 나라들 사이의 최근 분쟁과 에리트레아와 에티오피아 간 협력의 거부는 훨씬 더 파괴적인 결과를 낳았습니다. 나라는 기근에 빠졌고, 이웃 나라들의 비협조로 국내 식량 시장이 질식하면서 사람들이 죽어 가기 시작했습니다. 정부는 국민을 돕기 위해 무언가를 해야 합니다. 나라가 안으로부터 무너지기 전에 손을 써야 합니다."
 ethiopia.20.a: "오, 안 돼"
 ethiopia.21.t: "전장에서의 패배"
 ethiopia.21.d: "몇 달간의 교착 끝에 적이 마침내 우리 전선을 돌파하여 우리 본토를 침공했습니다. 아마도 1998년 아프리카 통일 기구가 마련한 평화 틀에 동의하고 휴전을 제안해야 할지도 모릅니다."
 ethiopia.21.a: "평화가 유일한 선택이다"
 ethiopia.21.b: "전쟁이 유일한 선택이다"
 ethiopia.22.t: "[FROM.GetName]의 휴전 제안"
 ethiopia.22.d: "우리 군이 적 전선을 돌파한 뒤, [FROM.GetAdjective] 정부가 아프리카 통일 기구의 평화 틀에 동의한다며 연락해 왔습니다. 그들은 즉각적인 휴전을 제안하고 있습니다"
 ethiopia.22.a: "마침내! 승리다!"
 ethiopia.22.b: "그들이 우리 앞에 무릎을 꿇을 때까지 멈추지 않는다!"
 ethiopia.23.t: "에리트레아 대리인들의 재판"
 ethiopia.23.d: "아페웨르키와 마찬가지로, 에리트레아 선동에 나선 이들도 에티오피아와 그 국민에 대한 범죄로 재판을 받아야 합니다. 이제 문제는 이 대리인들에게 사형을 선고해야 하는지, 아니면 단지 종신형을 선고해야 하는지입니다."
 ethiopia.23.a: "사형이다!"
 ethiopia.23.b: "종신형이면 충분하다."
 ethiopia.24.t: "에리트레아의 운명"
 ethiopia.24.d: "에리트레아는 전쟁에서 패배했으며, 많은 이들이 에리트레아 국민을 완전히 우리 손아귀에 넣기 위해 점령을 유지해야 한다고 주장합니다. 그러나 다른 많은 이들은 이 문제에 더 자유주의적으로 접근하여 제2의 연방법을 원합니다. 에리트레아 국가가 어떻게 될지는 궁극적으로 [ETH.GetLeader]에게 달려 있습니다."
 ethiopia.24.a: "점령을 유지하라!"
 ethiopia.24.b: "연방화해야 한다."
 ethiopia_news.1.t: "중국의 군사 지원을 얻은 에티오피아"
 ethiopia_news.1.d: "에티오피아 군에 장비를 공급하기 위한 미국과 중국 군수 기업 간의 장기간 경쟁 끝에, 에티오피아 정부는 중국 기업들에 막대한 자유를 부여하고 중화인민공화국과 여러 건의 군사·경제 조약에 서명했습니다.\n\n미국 국무장관은 이미 에티오피아의 결정에 대해 깊은 유감을 표명했습니다."
 ethiopia_news.1.a: "에티오피아가 미국에 맞섰다."
 ethiopia_news.2.t: "미국의 군사 지원을 얻은 에티오피아"
 ethiopia_news.2.d: "미합중국과 중화인민공화국은 지난 몇 달간 에티오피아 국방부와 무기 계약을 따내기 위해 애써 왔습니다.\n\n에티오피아는 이제 미국 기업들로부터 대량의 무기를 주문하기로 결정했습니다. 중화인민공화국은 감히 자신들에게 맞선 동아프리카 국가를 응징하기 위해 중국 기업들이 에티오피아와 거래하기 더 어렵게 만드는 법안을 이미 시행하기 시작했습니다."
 ethiopia_news.2.a: "에티오피아가 중국에 맞섰다."
 ethiopia_news.3.t: "에티오피아로 돌아온 제라 야코브"
 ethiopia_news.3.d: "에티오피아는 최근 공산 에티오피아 인민민주공화국(PDRE)과 그에 뒤이은 1995년 민주 헌법 아래에서 폐지되었던 제위의 복원을 발표했습니다.\n\n제위의 정당한 계승 후보이자 하일레 셀라시에 1세의 손자인 제라 야코브는 1970년대부터 가족과 함께 미국 플로리다에서 살아왔습니다. 그는 이제 에티오피아 정부의 공식 초청을 받아들여 조상의 땅으로 돌아가 정당한 왕좌를 주장하고 에티오피아 황제라는 정당한 지위에 오르겠다는 의사를 공개적으로 밝혔습니다."
 ethiopia_news.3.a: "황제의 역습."
 ethiopia_news.4.t: "멩기스투 무죄 석방"
 ethiopia_news.4.d: "에티오피아 대법원은 오늘 전직 에티오피아 공산 독재자 멩기스투 하일레 마리암에 대한 유죄 판결이 부당했음을 확인하고 모든 혐의에 대해 공식적으로 무죄를 선고했습니다. 현재 로버트 무가베의 짐바브웨에 망명 중인 마리암은 이전에 소수 민족에 대한 집단 학살과 자국민에 대한 반인도적 범죄로 유죄 판결을 받은 바 있습니다. 그는 이제 에티오피아에서 무고한 사람으로 여겨지지만, 고국으로 돌아올 의사가 있는지는 아직 분명하지 않습니다.\n\n이 결정은 아프리카 대륙 안팎에서 국제적 비난을 받았습니다."
 ethiopia_news.4.a: "위험한 조치."
 ethiopia_news.5.t: "멩기스투 귀환"
 ethiopia_news.5.d: "오랜 숙고와 에티오피아 정부의 공식 초청 끝에, 전직 공산 독재자 멩기스투 하일레 마리암이 에티오피아로 돌아오기로 결정했습니다. 그곳에서 그는 다시 한번 에티오피아 공산당 내 지도적 지위를 맡을 것으로 예상됩니다."
 ethiopia_news.5.a: "독재자가 돌아온다."
 ethiopia_news.6.t: "PDRE의 복원"
 ethiopia_news.6.d: "정치적 충격 속에 에티오피아 정부는 1995년 헌법을 폐기하고 권력을 다시 공산당에 이양하기로 결정했습니다.\n\n멩기스투 하일레 마리암은 오늘 다시 한번 나라의 지도권을 장악했으나, 국내에서 다시 한계가 없어진 자신의 권력을 정해진 규칙에 묶어 둘 선서를 하기를 거부했습니다. 남아 있는 몇 안 되는 국제 기자 중 한 명이 이에 대해 묻자 그는 \\"나는 국민에게 무엇이 최선인지 안다. 선서는 필요 없다\\"고 논평했습니다.\n\n에티오피아는 이제 1980년대의 어두웠던 옛 시절로 되돌아갈 것으로 널리 예상됩니다."
 ethiopia_news.6.a: "PDRE가 세계 무대로 복귀했다."
 ethiopia_news.7.t: "에티오피아와 에리트레아의 휴전"
 ethiopia_news.7.d: "The governments of Ethiopia and Eritrea have agreed to cease hostilities and declare a ceasefire. Ever since the conflict started in 1998, the Organization of African Unity has been trying to propose a peace plan to solve the border conflict between the two countries. It seems that the countries have finally agreed to try and solve their issues peacefully."
 ethiopia_news.7.a: "마침내"
 ethiopia_news.8.t: "에리트레아-에티오피아 전쟁에서 에리트레아 패배!"
 ethiopia_news.8.d: "1998년 5월 6일 적대 행위가 발발한 이래 벌어진 치열한 전투는 전문가들에 의해 교착 상태로 귀결될 것으로 판단되었으나, 전문가들의 예상은 틀렸음이 입증되었습니다!\n\n이사이아스 아페웨르키가 에티오피아군에 구금된 것으로 보도되었으며, 에리트레아 국가의 운명이 어떻게 될지는 불확실합니다."
 ethiopia_news.8.a: "우려스러운 일이다!"
 ETH_looming_famine: "다가오는 기근"
 ETH_idea_stabilized_food_supply: "안정된 식량 공급"
 ETH_idea_famine_strikes: "기근!"
 ETH_idea_cscec: "CSCEC 투자"
 ETH_eritrean_friction: "에리트레아의 지속되는 마찰"
 ETH_eritrean_friction_desc: "에리트레아에서 계속되는 마찰로 인해 국내 안정도가 떨어졌으며, 앞으로 닥칠 일을 두려워하여 나라를 떠나는 난민이 많습니다."
 ETH_dissolved_the_assembly: "에리트레아의 혼란!"
 ETH_dissolved_the_assembly_desc: "에리트레아 국민의회의 해산은 많은 에리트레아인으로 하여금 옛 조국의 국경 안에서의 변화를 받아들이는 데 극도로 저항하게 만들었습니다. 이 저항은 시간이 지나면 약해지겠지만, 점령 지역에서의 불복종으로 이어질 것입니다."
 ETH_1984_mode: "에리트레아 감시망"
 ETH_1984_mode_desc: "아페웨르키와 그 대리인들의 재판으로 인해 CCTV와 정보원으로 이루어진 광범위하고 뿌리 깊은 감시망의 설치가 정당화되었습니다. 이 감시망이 오래 필요하지 않기를 바라지만, 이는 전적으로 에리트레아 국민이 얼마나 빨리 통합되어 새로운 정체성을 받아들이느냐에 달려 있습니다."
 ETH_eritrean_constitution: "에티오피아-에리트레아 연방 헌법"
 ETH_eritrean_constitution_desc: "새 헌법이 마련됨으로써 에티오피아는 에리트레아에 대한 장악력을 굳혔으나, 그 대가로 에리트레아 내정에 대한 재정적 책임의 적어도 일부를 스스로 부담하게 되었습니다."
 ETH_eritrean_federalisation_underway: "연방화 협상 진행 중"
 ETH_eritrean_federalisation_underway_desc: "연방화가 진행되는 동안 협상이 계속되므로 상당한 이주 요인이 있을 것으로 예상됩니다."
 ETH_idea_messebo: "메세보 시멘트"
 ETH_idea_messebo_desc: ""
 ETH_diplomacy_corps: "외교단"
 ETH_diplomacy_corps_desc: ""
 ETH_aircraft_investments: "에티오피아 항공"
 ETH_aircraft_investments_desc: ""
 ETH_motorization_investments: "마라톤 모터스 엔지니어스"
 ETH_motorization_investments_desc: ""
 ETH_agricultural_investments: "에티오 애그리-CEFT"
 ETH_agricultural_investments_desc: ""
 ETH_eritrean_integration_category: "에리트레아 통합 노력"
 ETH_eritrean_integration_category_desc: "우리는 현재 에리트레아 국민을 우리나라에 통합하기 위해 열심히 노력하고 있습니다. 최종 목적지에 도달하기까지 어려운 길이 될 수 있으나, 하나의 깃발 아래 있는 국가가 되려면 반드시 필요한 길입니다.\n\n\n§H현재 통합 수준§!: §G[?ETH_eritrean_acceptance|2]%§!\n\n§H암하라어 보급률§!: §G[?ETH_amharic_speakers|2]%§!\n\n§H선전물 보급률§!: §G[?ETH_propaganda_distribution|2]%§!\n\n§H분리주의 탄압도§!: §G[?ETH_crackdown_on_bozos|2]%§!"
 ETH_integration_process_tick: "통합 과정"
 ETH_full_integration: "완전한 통합 단행"
 ETH_fund_amharic_schools: "암하라어 학습 강제"
 ETH_fund_amharic_schools_desc: "암하라어 학교에 자금을 대는 데에는 약 §Y$1.00 billion§!이 들 것으로 추산됩니다. §Y[ERI.GetAdjective]§! 국민이 우리의 공용어를 이해하도록 하는 것은 필수적입니다. 우리 말을 이해하지 못한다면 어떻게 그들을 다스리겠습니까?"
 ETH_distribute_propaganda: "선전 캠페인"
 ETH_distribute_propaganda_desc: "어떤 메시지는 비용이 많이 들지만, \\"얌전히 굴어라, 아니면 각오하라\\"라는 메시지는 광고판을 세우는 데 비교적 저렴합니다. 새로 병합된 영토의 광고판은 §Y$0.50 billion§!이라는 적은 비용으로 이 메시지를 가득 도배할 수 있습니다."
 ETH_utilise_informants: "정보원망 활용"
 ETH_utilise_informants_desc: "정보원은 비용이 많이 들지만, 다행히 §Y[ERI.GetName]§!은(는) 가난했으므로 큰 비용이 들지는 않을 것입니다. 점령 사령부는 적절한 곳에 뇌물을 주는 데 §R$1.00 billion§!을 배정해야 할 것으로 추산합니다."
 ETH_harsh_crackdowns: "분리주의자에 대한 가혹한 탄압"
 ETH_harsh_crackdowns_desc: "우리의 새로운 §Y[ETH.GetName]§!에서 반대 의견은 환영받습니다. 결국 그것이 말썽꾼을 뿌리 뽑는 가장 빠른 방법이니까요. 적절한 자원을 배정함으로써 주민 사이의 이러한 반대 의견을 탄압하는 작전을 수행할 수 있습니다."
 ETH_make_arrests: "거침없는 비판자 체포"
 ETH_make_arrests_desc: "\\"누구나 비평가다\\"라는 말은 어리석은 말이며, 모두가 평등하다는 뜻을 함축합니다. 그들은 평등하지 않으며, 이 딜레마에 대한 가장 단순한 해법은 우리와 우리 정부에 대해 부정적인 비판을 하는 이들을 그냥 체포하는 것입니다."
 ETH_eritrean_federalisation_category: "에리트레아 연방화 진행도"
 ETH_eritrean_federalisation_category_desc: "우리는 현재 연방법을 통과시키기 위해 열심히 노력하고 있습니다. 최종 목적지에 도달하기까지 어려운 길이 될 수 있으나, 연방의 깃발 아래 어느 정도 통합된 국가가 되려면 반드시 필요한 길입니다.\n\n\n§H현재 연방화 진행도§!: §G[?ETH_eritrean_federation_process|2]%§!\n\n§H암하라어 보급률§!: §G[?ETH_amharic_speakers|2]%§!\n\n§H선전물 보급률§!: §G[?ETH_propaganda_distribution|2]%§!\n\n§H분리주의 탄압도§!: §G[?ETH_crackdown_on_bozos|2]%§!"
 ETH_federalisation_process_tick: "연방화 과정"
 ETH_full_federalisation: "제2차 연방법 서명"
 ETH_encourage_language_schools: "암하라어 학교에 추가 자금 지원"
 ETH_encourage_language_schools_desc: "암하라어 학교에 자금을 대는 데에는 약 §Y$1.00 billion§!이 들 것으로 추산됩니다. §Y[ERI.GetAdjective]§! 국민이 우리의 공용어를 이해하도록 돕는 것은 중요합니다. 우리 말을 이해하지 못한다면 어떻게 그들을 다스리겠습니까?"
 ETH_show_off_benefits_federation: "연방화의 이점 홍보"
 ETH_show_off_benefits_federation_desc: "광고판, 전단, 포스터, 스티커. 이 모두는 비용이 많이 들며, 정확히는 약 §Y$2.50 billion§!입니다. 그러나 연방법의 이점을 제대로 알리려면 필요한 투자입니다."
 ETH_falsify_evidence: "불법 행위 증거 조작"
 ETH_falsify_evidence_desc: "결국 선동가들은 사라져야 하며, 그들이 법을 어기지 않았을 때 이를 처리하는 가장 좋은 방법은... \\"대안적 사실\\"을 제시하는 것입니다. 이를 증거 조작이라 말하는 이들도 있지만, 그런 말은 철창 뒤에서나 할 수 있습니다."
 ETH_deport_agitators: "선동가 추방"
 ETH_deport_agitators_desc: "최악 중의 최악은 갱생시키거나 재교육할 수 없으며, 대신 다른 누군가의 문제가 되게 하면 됩니다. 군 조직을 활용하여 우리의 새 법을 어긴 자들을 국경 밖으로 내다 버릴 것입니다."
 ETH_railway_repaired_tt: "에티오-지부티 철도가 수리되었습니다"
 ETH_educating_the_people: "국민 교육"
 ETH_refactor_our_debt: "부채 재조정"
 ETH_refactor_our_debt_desc: "부채를 재조정하면 전후 문제로 인한 우리 경제의 부담을 덜 수 있을 것입니다. 그러나 이는 모든 채권 보유자들에게 극도로 인기가 없을 것입니다."
 ETH_idea_refactored_debt: "재조정된 부채"
 ETH_idea_refactored_debt_desc: "부채를 재조정하는 것은 우리나라에 더 큰 안정을 가져오는 확실한 방법입니다."
 ETH_chi_investments_category: "중국 투자 프로젝트"
 ETH_chi_investments_category_desc: "일련의 표적 투자를 통해 중국 정부는 우리와 투자 조약을 체결하는 데 성공했습니다. 이 조약은 중국 정부가 우리나라에서 영향력을 얻게 하는 한편, 우리는 그 대가로 핵심 기반시설과 경제 개발 프로젝트를 얻습니다."
 ETH_european_investments_category: "유럽 투자 프로젝트"
 ETH_european_investments_category_desc: "유럽 연합과의 몇 주에 걸친 협상 끝에, 우리는 우리나라에 대한 투자와 관련된 일련의 거래를 성사시키는 데 성공했습니다."
 ETH_light_rail: "아디스아바바 경전철 건설"
 ETH_light_rail_desc: "성장하는 도시 아디스아바바는 매일 교통 체증으로 가득하지만, 중국에는 이미 이 문제에 대한 훌륭한 해법이 있습니다. 바로 우리의 중국 친구들이 후원하는 완전히 새로운 경전철 시스템입니다."
 ETH_construct_light_rail: "아디스아바바 경전철 건설 중"
 ETH_light_rail_2: "경전철망 확장"
 ETH_light_rail_2_desc: "우리 경전철망의 네 방향 모두에 확장의 여지가 있습니다. 또한 경전철을 최근 건설된 아디스아바바-지부티 철도와 연결할 수 있습니다."
 ETH_construct_light_rail_2: "경전철망 확장 중"
 ETH_construct_light_rail_2_desc: "예산 조치에 대한 간단한 논의 끝에, 우리는 경전철망을 확장하기로 결정했습니다. 이 확장은 국내에서 더 큰 경제적 자유를 허용하는 동시에 해안에서 나라로 식량을 수입하는 데 따른 일부 문제를 완화할 것입니다."
 ETH_rehabilitation: "에티오-지부티 철도 복구"
 ETH_rehabilitation_desc: "에티오-지부티 철도는 운행을 중단했으며, 이를 수리하려는 어떤 시도도 시간 낭비일 것입니다. 운행을 재개하려면 이제 많은 선로를 완전히 교체해야 합니다."
 ETH_rehabilitation_railway: "에티오-지부티 철도 복구"
 ETH_rehabilitation_railway_desc: "에티오-지부티 철도를 복구하는 작업이 시작되었습니다."
 ETH_repair_railway: "에티오-지부티 철도 수리"
 ETH_repair_railway_desc: "에티오-지부티 철도는 시급한 수리가 필요하며, 지금 하지 않으면 그 결과는 큰 비용이 될 수 있습니다."
 ETH_rehabilitation_railway_2: "에티오-지부티 철도 복구"
 ETH_rehabilitation_railway_2_desc: "에티오-지부티 철도를 수리하는 작업이 시작되었습니다"
 ETH_addis_ababa_djibouti_railway: "아디스아바바-지부티 철도 건설"
 ETH_addis_ababa_djibouti_railway_desc: "에티오피아 무역의 95% 이상이 지부티를 통과하므로 지부티는 우리 경제에 필수적입니다. 우리 수도를 지부티와 현대적인 철도로 직접 연결함으로써 우리 물자의 이동 시간과 비용을 대폭 줄일 수 있습니다."
 ETH_construct_addis_ababa_djibouti_railway: "아디스아바바-지부티 철도 건설 중"
 ETH_construct_addis_ababa_djibouti_railway_desc: "아디스아바바-지부티 철도를 건설하는 작업이 시작되었습니다."
 ETH_provide_assistance_to_somalia: "소말리아 지원 제공"
 ETH_provide_assistance_to_somalia_desc: "이슬람 법정 연합이 현재 우리 국경을 위협하고 있습니다. 급진 이슬람의 부상이 우리의 문제가 되기 전에 격파할 수 있도록 [SOM.GetName]에 병력과 지원을 보내야 합니다."
 ETH_make_a_choice_FT_TT: "중점 트리에서 §Y$ETH_eritrea_start$§! 분기가 §Y잠금 해제§!되며, §Y에리트레아§!의 미래에 대한 결정을 내려야 합니다"
 ETH_eritrea_assembly_TT: "이미 어리석은 짓을 하고 있으니 돈이나 좀 받으십시오"
 ETH_eritrea_integration_trigger_TT: "§Y$ethiopia.24.t$§!에서 §Y통합§!의 길을 선택했거나 이후에 의회를 §R해산§!하기로 선택했습니다"
 ETH_eritrea_federation_trigger_TT: "§Y$ethiopia.24.t$§!에서 §Y연방화§!의 길을 선택했거나 이후에 §G연방화§!하기로 선택했습니다"
 ETH_blocked_from_ERI_decisions_INT_TT: "추가적인 §Y통합§! 정책이 차단되어 있지 않습니다"
 ETH_block_from_ERI_decisions_INT_TT: "추가적인 §Y통합§! 시도가 모두 §R차단§!됩니다"
 ETH_federalise_ERI_flip_TT: "현재 §Y통합§! 작전을 시행하는 결정을 진행 중이지 않습니다"
 ETH_blocked_from_ERI_decisions_FED_TT: "추가적인 §Y연방화§! 정책이 차단되어 있지 않습니다"
 ETH_block_from_ERI_decisions_FED_TT: "추가적인 §Y연방화§! 시도가 모두 §R차단§!됩니다"
 ETH_dissolve_ERI_assembly_flip_TT: "현재 §Y연방화§! 작전을 시행하는 결정을 진행 중이지 않습니다"
 ETH_BANNED_RELEASE_ERI_TOOLTIP: "§Y[ROOT.GetNameWithFlag]§!은(는) 적절한 §Y연방화§! 결정을 선택해야만 §Y[FROM.GetNameWithFlag]§!을(를) 해방할 수 있습니다.\n\n이 결정을 사용할 수 없다면 §Y[FROM.GetNameWithFlag]§!은(는) 영구적으로 §Y[ROOT.GetAdjective]§! 통치하에 있습니다."
 ETH_locked_federalisation_TT: "§Y연방법§!이 시행되는 동안 §Y[ETH.GetNameWithFlag]§!은(는) §Y[ERI.GetNameWithFlag]§!을(를) 병합하는 것이 §R금지§!됩니다"
 ETH_locked_annexation_TT: "§Y통합 과정§!이 진행되는 동안 §Y[ETH.GetNameWithFlag]§!은(는) §Y[ERI.GetNameWithFlag]§!을(를) 해방하는 것이 §R금지§!됩니다"
 update_ETH_amharic_speakers_TT: "§Y암하라어 보급률§!: [?ETH_amharic_change|2+]% (현재 §Y암하라어 보급률§!: [?ETH_amharic_speakers|2Y]%)"
 update_ETH_propaganda_distribution_TT: "§Y선전물 배포율§!: [?ETH_propaganda_change|2+]% (현재 §Y선전물 배포율§!: [?ETH_propaganda_distribution|2Y]%)"
 update_ETH_bozo_crackdown_TT: "§Y분리주의 탄압도§!: [?ETH_crackdown_change|2+]% (현재 §Y분리주의 탄압도§!: [?ETH_crackdown_on_bozos|2Y]%)"
 ETH_looming_famine_desc: "기근이 수평선 위에 계속 다가오고 있습니다. 우리나라의 안정도를 곧 안정시키지 못한다면 광범위한 기근을 맞이하게 될 가능성이 높습니다. 에리트레아와의 전쟁과 해안 영토의 상실은 이 문제를 더욱 악화시켰을 뿐입니다."
 ETH_idea_stabilized_food_supply_desc: "식량 공급이 마침내 안정되어 우리는 국민을 계속 부양하고 공급할 수 있게 되었습니다. 안전하고 안정적인 식량 공급은 우리나라의 성장에 필수적입니다."
 ETH_idea_famine_strikes_desc: "기근이 나라를 덮쳤습니다! 사태가 더 악화되어 나라가 크게 고통받기 전에, 우리의 관심을 안으로 돌려 식량 공급을 바로잡는 데 집중해야 합니다."
 ETH_idea_cscec_desc: "중국건축공정총공사(CSCEC)가 우리나라에 투자를 시작했습니다. 이는 우리의 발전을 계속 돕지만, 그 대가로 우리는 이 지역에서 중국의 영향력에 더 취약해집니다. "
 ETH_ethiopian_intervention_forces: "에티오피아 개입군"
 ETH_ethiopian_intervention_forces_desc: ""
 ETH_educating_the_people_desc: ""
 ETH_full_integration_desc: "§Y[ERI.GetAdjective]§! 국민이 확고히 우리 손아귀에 들어온 지금, 한때 §Y[ERI.GetName]§!로 알려졌던 가짜 국가의 마지막 잔재를 분쇄할 때가 왔습니다."
 ETH_federalise_ERI_flip: "§Y연방화§! 과정 시작"
 ETH_federalise_ERI_flip_desc: "§Y[ERI.GetAdjective]§! 국가에 대한 계속된 점령은 더 이상 실행 가능한 과업이 아닙니다. 그리고 그곳 사람들은 대표권을 가질 방법을 요구하고 있으므로, 우리의 관점과 부합하는 새 정부를 수립해야 합니다."
 ETH_federalisation_process_tick_desc: "§Y30일§!마다 §Y[ERI.GetAdjective]§! 국민과 제도를 우리의 사고방식에 맞추는 방향으로의 진행 상황이 갱신됩니다."
 ETH_full_federalisation_desc: "§Y[ERI.GetAdjective]§! 국민이 연방법에 찬성하는 지금, 이를 공식적으로 법률로 서명할 수 있습니다. 다만 이로써 §Y[ETH.GetNameWithFlag]§!은(는) 이 지역을 병합할 수 없게 됩니다."
 ETH_dissolve_ERI_assembly_flip: "§Y[ERI.GetNameWithFlag]§!의 의회 해산"
 ETH_dissolve_ERI_assembly_flip_desc: "연방화 실험은 처참한 실패였습니다. §Y[ERI.GetAdjective]§! 국민은 우리가 그들을 위해 계획한 자치를 허용하기에는 너무나 불안정한 요인이므로, 그들의 의회를 해산하고 \\"자치\\" 논의를 탄압해야 합니다."
 ETH_eritrea_tackle_separatist: "대반란 작전"
 ETH_eritrea_tackle_separatist_desc: "우리는 어떤 이유에선지 과거의 통치 방식으로 돌아가기를 원하는 분리주의자들의 잠재적 테러 위협을 아직 완전히 처리하지 못했습니다. 당근으로 그들을 설득할 수 없다면, 대신 채찍을 써야 할지도 모릅니다."
 ETH_zera_yacob_returns_TT: "제라 야코브가 에티오피아로 돌아옵니다!\n"
 ETH_imperial_guard_TT: "§G케부르 자바냐는 황제의 공식 근위대였습니다. 이를 복원함으로써 우리는 새 황제의 안전과 위신을 모두 지킬 것입니다.§!"
 ETH_eritrea_assembly_parties_tt: "§Y에리트레아§!가 어느 지부가 선거 운동을 할 수 있는지 결정합니다.\n\n우리의 §Y에티오피아 계열 지부§!가 의회를 차지하는 것이 가장 가능성 높은 결과이며 §Y연방화 진행도§!를 §G10%§! 진전시킵니다.\n§Y에리트레아 토착 정당§!의 승리는 §G5%§! 진전시킵니다.\n§Y군주제 복고§!는 전혀 진전시키지 못하고, 우리의 §R안정도§!를 깎으며 §Y에리트레아§!에 대한 우리의 장악력을 느슨하게 합니다."
