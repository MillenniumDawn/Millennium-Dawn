 MD_sftc_command_short: "解锁特种作战司令部。"
 MD_sftc_command_level_text: "等级[?ROOT.MD_sftc_command_level|0]/3"
 MD_sftc_qualification_name: "特种部队资格课程"
 MD_sftc_qualification_short: "一位陆军将领可能获得特种部队特质。"
 MD_sftc_qualification_cooldown: "特种部队资格课程正在进行中"
 MD_sftc_qualification_cooldown_desc: "被选中的军官正在完成特种部队资格认证。本期学员毕业后，下一期课程随即开始。"
 MD_sftc_joint_course_name: "联合特种作战课程"
 MD_sftc_joint_course_short: "每名特种部队指挥官都获得经验。"
 MD_sftc_joint_course_cooldown: "联合特种作战课程正在进行中"
 MD_sftc_joint_course_cooldown_desc: "来自各军种的特种作战军官正在联合特别行动课程中一起训练。本期学员毕业后，下一期课程随即开始。"
 MD_sftc_school_1: "特种作战学校 I"
 MD_sftc_school_1_desc: "一所永久性的特种作战学校负责选拔和训练候选人，统一战术，并缩短组建新特种部队所需的时间。"
