 module_vls_sub_asm_1: "VLS 대함 미사일 I"
 module_vls_sub_asm_1_desc: "초기 VLS 기반 대함 미사일 체계는 군함이 방호된 수직 발사 셀에서 원거리 무기를 발사할 수 있게 합니다. 이는 전통적인 갑판 탑재 발사기에 비해 생존성과 교전 유연성을 높입니다.\n\n§G설계 힌트: 이 모듈은 대함 공격력과 대함 관통력, 그리고 체력을 높여 주지만 IC 비용이 증가합니다.§!"
 module_vls_sub_asm_2: "VLS 대함 미사일 II"
 module_vls_sub_asm_2_desc: "개량된 VLS 대함 미사일은 향상된 유도 체계와 늘어난 사거리를 갖추어, 수직 발사 통합의 이점을 유지하면서 수상 표적에 대한 더 안정적인 타격을 가능하게 합니다.\n\n§G설계 힌트: 이 모듈은 대함 공격력과 대함 관통력, 그리고 체력을 높여 주지만 IC 비용이 증가합니다.§!"
 module_vls_sub_asm_3: "VLS 대함 미사일 III"
 module_vls_sub_asm_3_desc: "현대식 VLS 대함 미사일 체계는 첨단 탐색기와 해면 밀착 비행 궤적을 통합하여 협동 장거리 공격과 적 대응책에 대한 저항력 향상을 가능하게 합니다.\n\n§G설계 힌트: 이 모듈은 대함 공격력과 대함 관통력, 그리고 체력을 높여 주지만 IC 비용이 증가합니다.§!"
 module_vls_sub_asm_4: "VLS 대함 미사일 IV"
 module_vls_sub_asm_4_desc: "고도로 발전한 VLS 대함 미사일은 네트워크 조준과 정밀 유도를 활용하여 신속한 다중 표적 교전과 현대 해군 방어 체계에 대한 향상된 효과를 가능하게 합니다.\n\n§G설계 힌트: 이 모듈은 대함 공격력과 대함 관통력, 그리고 체력을 높여 주지만 IC 비용이 증가합니다.§!"
