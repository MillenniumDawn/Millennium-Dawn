 kosovo_rec.12.b: "Não agora"
 kosovo_rec.16.t: "Revolta em Montenegro"
 kosovo_rec.16.d: "Fomos capazes de financiar os rebeldes montenegrinos e agora estão prontos para lançar uma insurgência militar em seu país."
 kosovo_rec.16.a: "Liberdade de Montenegro!"
 kosovo_rec.17.t: "Revolta em Montenegro"
 kosovo_rec.17.d: "We were able to prepare the militia quickly and efficiently, the Serbian troops will be defeated!"
 kosovo_rec.17.a: "Liberdade de Montenegro!"
 kosovo.7.t: "Kosovo quer criar uma federação"
 kosovo.7.d: "O governo kosovar nos enviou um pedido muito estranho. Eles estão pedindo para nos juntarmos a eles na criação de um novo estado balcânico, a Federação dos Balcãs Ocidentais."
 kosovo.7.a: "Sim, vamos nos juntar"
 kosovo.7.b: "Não"
 kosovo.8.t: "Albânia aceita"
 kosovo.8.d: "A Albânia aceitou nosso pedido de formar um único estado. Hoje será um dia importante em nossa história."
 kosovo.8.a: "Somos um povo"
 kosovo.9.t: "Albânia rejeita"
 kosovo.9.d: "A Albânia rejeitou nosso pedido de formar um estado unificado. Não esqueceremos a traição à causa!"
 kosovo.9.a: "Lamentável"
 kosovo.9.b: "Se a diplomacia não funcionar, então a guerra funcionará!"
 kosovo_rec.4.t: "Kosovo solicita reconhecimento"
 kosovo_rec.4.d: "Diplomatas do Kosovo vieram até nós e pediram que os reconhecêssemos como um país. Este será um processo complicado, mas não teríamos nenhum dano em reconhecê-los."
