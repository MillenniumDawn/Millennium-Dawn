 RULE_ENABLE_DIVISION_LIMITER: "Włącz ogranicznik dywizji AI"
 RULE_NO_ENABLE_DIVISION_LIMITER_DESC: "Wyłączony limiter dywizji AI\n\nDomyślnie sztuczna inteligencja nie będzie ograniczona liczbą jednostek, które może wyprodukować. Jeśli chcesz ograniczyć dywizje ze względu na wydajność, włącz mnie!"
 RULE_YES_ENABLE_DIVISION_LIMITER_DESC: "Włączono ogranicznik dywizji AI\n\nKiedy jestem włączony, sztuczna inteligencja będzie rzadziej produkować jednostki, co zapewni bardziej usprawnione wrażenia i umożliwi graczowi względny spokój!"
 RULE_OPTION_POTATO_EDITION: "Edycja Ziemniaczana"
 RULE_POTATO_EDITION_DIVISION_LIMITER_DESC: "Włączono limiter dywizji AI w wersji ziemniaczanej\n\nJeszcze bardziej ogranicza sztuczną inteligencję ze względu na wydajność.\n"
