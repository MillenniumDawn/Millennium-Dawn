 module_naval_anti_ship_nuclear_torpedo_1: "핵 대함 어뢰 I"
 module_naval_anti_ship_nuclear_torpedo_1_desc: "핵 대함 어뢰는 기존 어뢰의 운반 방식에 매우 강력한 탄두를 결합하여 수상 전투함에 대한 파괴 잠재력을 극대화합니다.\n\n§G설계 힌트: 핵 대함 어뢰는 높은 어뢰 공격력과 추가적인 대잠수함전 능력을 제공합니다. 수상 표적과 잠수함 표적 모두와 싸울 것으로 예상되는 함선에 적합하지만 기존 어뢰보다 IC와 인력 비용이 높습니다.§!"
 module_naval_anti_ship_nuclear_torpedo_2: "핵 대함 어뢰 II"
 module_naval_anti_ship_nuclear_torpedo_2_desc: "$module_naval_anti_ship_nuclear_torpedo_1_desc$"
