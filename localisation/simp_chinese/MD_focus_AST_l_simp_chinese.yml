 nhmrc_grants: "国家健康与医学研究理事会拨款"
 nhmrc_grants_desc: "国家健康与医学研究委员会是我们领先的医学研究机构。我们的医疗水平取决于他们所能开展的研究。为他们提供一些短期资助，可能会为业界带来一些令人鼓舞的成果。"
 encourage_electrical_vehicles_ast: "鼓励使用电动汽车"
 encourage_electrical_vehicles_ast_desc: "为混合动力和低排放汽车的制造奠定基础至关重要，这关系到我们所追求的未来能否实现。此外，这也有助于我们实现短期内的燃料配给目标。"
