 MER_SUR_civilian_industry: "Investir dans l'industrie civile du Suriname"
 MER_SUR_civilian_industry_desc: "Parrainer un nouveau projet d'investissement civil dans la capitale du Suriname, dans le cadre de son chemin vers le statut de membre à part entière.$MER_full_membership_step_two_desc$"
 MER_SUR_commercial_infrastructure: "Développer les infrastructures commerciales au Suriname"
 MER_SUR_commercial_infrastructure_desc: "Étendre l'infrastructure commerciale dans la capitale du Suriname afin que l'adhésion produise des gains économiques visibles.$MER_full_membership_step_three_desc$"
 MER_MEX_industrial_investment_agreement: "Accord d'investissement industriel avec le Mexique"
 MER_MEX_industrial_investment_agreement_desc: "Financer le pilier industriel du paquet d'adhésion mexicain par un accord d'investissement majeur centré sur sa capitale.$MER_full_membership_step_one_desc$"
 MER_MEX_commercial_investment_framework: "Cadre d'investissement commercial avec le Mexique"
 MER_MEX_commercial_investment_framework_desc: "Établir un cadre d'investissement commercial plus large avec le Mexique, renforçant la base institutionnelle et économique d'une adhésion pleine.$MER_full_membership_step_two_desc$"
 MER_MEX_financial_cooperation_package: "Paquet de coopération financière pour le Mexique"
 MER_MEX_financial_cooperation_package_desc: "Livrer le paquet final de coopération financière pour le Mexique, combinant investissement commercial et numérique avant l'achèvement de l'adhésion.$MER_full_membership_step_three_desc$"
 MER_launch_corridor_investment_round: "Lancer une vague d'investissement dans les corridors du MERCOSUR"
 MER_launch_corridor_investment_round_desc: "Un bloc plus fort ne peut exister seulement sur le papier. En libérant une nouvelle ronde de financement de corridors adossé au Trésor, nous pouvons accélérer l'infrastructure et l'intégration des réseaux chez les membres à part entière actuels du MERCOSUR, améliorant l'épine dorsale physique du bloc."
 MER_release_development_fund_round: "Libérer une vague du Fonds de développement du MERCOSUR"
 MER_release_development_fund_round_desc: "Les promesses d'intégration convainquent davantage quand elles sont adossées à un investissement visible. En décaissant une nouvelle ronde du Fonds de développement du MERCOSUR, nous pouvons accélérer la construction civile et l'expansion des bureaux dans le bloc, renforçant les fondations économiques de ses membres à part entière."
