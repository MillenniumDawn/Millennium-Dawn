l_simp_chinese:
 vatican_focus: "梵蒂冈国策树"
 crusader_pope: "十字军教宗"
 caliph_pope: "新哈里发"
 HLS_idea_vatican_library: "梵蒂冈图书馆"
 HLS_idea_vatican_library_desc: "梵蒂冈图书馆藏有世界上最古老的原手稿收藏之一。使其保持完好状态需要持续照料与投入资金，但它仍是圣座的丰碑。\n§W--------------§!\n若我们完成§Y$HLS_refurbish_the_vatican_library$§!国策，此国家精神将得到§G升级§!。"
 HLS_idea_refurbished_vatican_library: "翻新后的梵蒂冈图书馆"
 HLS_idea_refurbished_vatican_library_desc: "恢复后的梵蒂冈图书馆仅需更少的维护且已向世界各地的学者开放了阅览室。"
 HLS_idea_rise_of_islam: "伊斯兰的崛起"
 HLS_idea_rise_of_islam_desc: "天主教的中心已皈依新的信仰，而且是最不可思议的一种。教宗如今在圣彼得大教堂的阳台上宣讲真主之道。"
 HLS_idea_holy_soldiers: "十字军"
 HLS_idea_holy_soldiers_desc: "我们的士兵拥有十字军的头衔。尽管率领他们的神职人员对政治事业毫无耐心，宗教狂热仍然让他们在故土上更加坚定。"
 HLS_idea_allahs_will: "真主的意志"
 HLS_idea_allahs_will_desc: "新兵们纷纷涌向梵蒂冈哈里发国。他们中受过训练的人寥寥无几，但没有一个人缺乏信念。"
 HLS_idea_holy_war: "对梵蒂冈的战争"
 HLS_idea_holy_war_desc: "我们正与圣座交战，圣座已宣布这场冲突为圣战，但尚未号召欧洲其他国家参战。"
 HLS_idea_global_crusade_target: "十字军的目标"
 HLS_idea_global_crusade_target_desc: "教宗已号召对我们发动十字军东征，欧洲各国均被要求加入其中。"
 HLS_idea_fortress_vatican: "梵蒂冈堡垒"
 HLS_idea_fortress_vatican_desc: "梵蒂冈已得到严密布防。教宗的任何敌人都将发现其城墙难以攻克。"
 HLS_idea_religious_recruits: "宗教新兵"
 HLS_idea_religious_recruits_desc: "虔诚的信徒愿为圣座而战。他们大多数人从未持有过步枪，因此训练他们需要时间。"
 HLS_idea_rejected_islam: "谴责伊斯兰教"
 HLS_idea_rejected_islam_desc: "教宗已正式谴责伊斯兰教，与穆斯林世界的关系已彻底破裂。"
 HLS_idea_accepted_islam: "接受伊斯兰教"
 HLS_idea_accepted_islam_desc: "教宗已正式承认伊斯兰教为姐妹信仰，这开启了两大宗教关系的新篇章。"
 HLS_idea_crusader_state: "十字军国家"
 HLS_idea_crusader_state_desc: "教宗再次宣布梵蒂冈为十字军国家。"
 HLS_idea_italian_power_supply: "意大利电力供应协议"
 HLS_idea_italian_power_supply_desc: "梵蒂冈几乎全部电力都从意大利购买。与意大利公用事业公司签订的长期供电协议以公平的价格保障了圣彼得大教堂灯火通明。"
 HLS_idea_carbon_neutral_state: "首个碳中和国家"
 HLS_idea_carbon_neutral_state_desc: "梵蒂冈通过在海外植树造林来抵消其碳排放，并向信众宣扬其关爱受造之物。清洁能源项目在教廷内部寻得了慷慨的资助者。"
 HLS_idea_papal_diplomacy: "教宗国外交"
 HLS_idea_papal_diplomacy_desc: "教宗特使几乎遍布全世界各国首都。很少有政府会拒绝与教宗特使会面。"
 HLS_idea_vatican_observatory: "梵蒂冈天文台"
 HLS_idea_vatican_observatory_desc: "梵蒂冈天文台是世界上最古老的天文机构之一。其耶稣会天文学家为圣座赢得了少有国家能匹敌的科学声誉。"
 HLS_idea_lacks_an_army: "缺乏职业军队"
 HLS_idea_lacks_an_army_desc: "梵蒂冈除了瑞士卫队和宪兵队之外从来不曾需要其他武装力量，也没有机构来组建军队。\n§W--------------§!\n如果我们完成§Y$HLS_question_of_the_land_forces$§!国策，此国家精神将§G改善§!。"
 HLS_idea_forming_an_army: "建立一支军队"
 HLS_idea_forming_an_army_desc: "建立一支配得上圣座的军队的时机已经到来。"
 HLS_idea_swiss_guard_reform: "改革瑞士卫队"
 HLS_idea_swiss_guard_reform_desc: "瑞士卫队只忠于教宗而不效忠于任何其他人。将其扩充为一支完整的军队，使我们能够传承数百年的纪律传统。"
 HLS_idea_fanatics_reform: "狂信军团"
 HLS_idea_fanatics_reform_desc: "信仰是我们唯一充裕的资源。只要狂信军团学会列阵作战，便永不缺少志愿者。"
 HLS_idea_papal_states: "教宗国"
 HLS_idea_papal_states_desc: "教宗再次成为世俗君主，其统治范围远不止圣彼得大教堂墙后的几英亩土地。教会如今不仅要作为牧者引领信众，还要治理一个国家。"
 HLS_idea_roman_curia: "罗马教廷"
 HLS_idea_roman_curia_desc: "教廷是圣座的行政机构，从国务院到梵蒂冈银行皆属其列。教廷运转顺畅，整个教会便运转顺畅；教廷失灵，则一切都无从谈起。"
 HLS_idea_pilgrim_pope: "朝圣教宗"
 HLS_idea_pilgrim_pope_desc: "我们不等待世界来到罗马。教宗走向世界，从马尼拉的贫民窟到华沙的广场，无论他降落在哪里，人群都会聚集。"
 HLS_idea_moral_authority: "道德权威"
 HLS_idea_moral_authority_desc: "我们不统率任何军队，但每当教宗发言时，各国元首依然会侧耳倾听。我们的声音之所以举足轻重，是因为我们从来无需提高嗓门。"
 we_are_the_true_vatican: "真正的梵蒂冈"
 agreed_to_our_aid: "接受了我们的援助"
 disagreed_to_our_aid: "拒绝了我们的援助"
 accepted_islam: "拥抱伊斯兰教"
 rejected_islam: "拒绝伊斯兰教"
 HLS_decision_category: "教宗陛下的议程"
 HLS_decision_category_desc: "[HLS.GetLeader]承载着圣彼得宝座的权威。教廷正等待他的决定。"
 HLS_ask_for_more_swiss_guard_unit: "请求增派瑞士卫队"
 HLS_ask_for_more_swiss_guard_unit_desc: "瑞士人自1506年起便守护教宗。随着圣座的发展，对其保护的需求也日益增长。"
 HLS_ask_for_more_swiss_guard_tt: "请§Y瑞士§!再派出一支§Y瑞士卫队§!师。"
 HLS_accept_islam: "接受伊斯兰教"
 HLS_accept_islam_desc: "伊斯兰教与基督教之间的关系是当代重大议题之一。梵蒂冈的正式承认将让和平之鸽飞向穆斯林世界。"
 HLS_accept_islam_tooltip: "每个穆斯林国家都会对我们更有好感，我们也会对他们更有好感。"
 HLS_condemn_islam: "谴责伊斯兰教"
 HLS_condemn_islam_desc: "教廷中有些人希望教宗直接谴责伊斯兰教，并打破数十年的跨宗教对话。"
 HLS_condemn_islam_tooltip: "每个穆斯林国家都会对我们更加反感。解锁§Y$HLS_anti_islamist_crusade$§!国策并关闭§Y$HLS_a_dark_path$§!国策。"
 HLS_general_audience: "举行一次公开接见"
 HLS_general_audience_desc: "教宗每周都会在圣彼得广场向人群发表讲话。良好的听众能提升我们的声望，但一个用词不当就可能被用来对付我们。"
 HLS_convene_a_consistory: "召开枢机会议"
 HLS_convene_a_consistory_desc: "召开枢机会议将枢机团聚集在教宗周围。一次妥善管理的会议能保持教会众枢机的忠诚，并使教廷规范行事。"
 HLS_convene_the_ulema: "召开乌里玛会议"
 HLS_convene_the_ulema_desc: "指导梵蒂冈哈里发国的学者们期望哈里发能寻求他们的建议。在罗马召集他们，可以安抚他们使他们确信新信仰得到了妥善的传承。"
 HLS_rename_istanbul: "将伊斯坦布尔重更名为君士坦丁堡"
 HLS_rename_istanbul_desc: "自1453年以来，这座城市便未曾落入一位基督教统治者之手。如今它再次归我们所有，我们应恢复其古老的名称。"
 HLS_religious_recruits_decision: "招募宗教志愿者"
 HLS_religious_recruits_decision_desc: "我们虽是小国，但全欧洲的信徒都渴望加入上帝的军队。"
 HLS_religious_recruits_tt: "在我国首都生成§Y5§!个§G圣战者§!师。"
 HLS_international_jihadists_decision: "招募外国战士"
 HLS_international_jihadists_decision_desc: "来自整个穆斯林世界的志愿者希望为梵蒂冈哈里发国效力。我们应当在他们自行组织起来之前将他们组织起来。"
 HLS_international_jihadists_decision_tt: "在我们的首都生成§Y5§!个§G耶路撒冷突击队§!师。"
 vatican.1.t: "梵蒂冈要求整合"
 vatican.1.d: "圣座已命令我们解散意大利共和国并加入教宗国，将我们土地的完全管辖权交给教宗。"
 vatican.1.o1: "一切为了上帝"
 vatican.1.o2: "决不！"
 vatican.2.t: "意大利同意了"
 vatican.2.d: "[FROM.GetNameDefCap]已同意加入我们。教宗国重获新生，罗马再次成为一个基督教国度的首都。"
 vatican.2.o1: "好极了！"
 vatican.3.t: "意大利拒绝"
 vatican.3.d: "[FROM.GetNameDefCap]拒绝自行解散。它仍是我们的附庸，但这一拒绝让教廷难堪。"
 vatican.3.o1: "他们会后悔的。"
 vatican.4.t: "梵蒂冈号召对我们发动一场十字军"
 vatican.4.d: "圣座已宣布发起反伊斯兰主义十字军，并将我国政府列为敌人。教宗要求我们屈服。"
 vatican.4.o1: "他们会为此付出代价"
 vatican.5.t: "一次十字军远征还是圣战？"
 vatican.5.d: "我们以主的名义与[FROM.GetNameDef]开战。我们应当号召十字军，让盟友和欧洲各国参战，还是让这场战争仅限于我们自己？"
 vatican.5.o1: "这是我们的战斗"
 vatican.5.o2: "团结一致对抗[FROM.GetNameDef]！"
 vatican.6.t: "梵蒂冈要求我们效忠"
 vatican.6.d: "在一个史无前例的举措下，教廷已要求意大利政府接受教宗为其世俗君主，并将共和国置于梵蒂冈的管辖之下。"
 vatican.6.o1: "我们服从圣父"
 vatican.6.o2: "这太荒谬了"
 vatican.7.t: "发动一场十字军？"
 vatican.7.d: "我们现在正与[FROM.GetNameDef]交战。我们是否应该号召欧洲的基督教国家及我们的盟友作为十字军参战？"
 vatican.7.o1: "不，这是我们自己的战争"
 vatican.7.o2: "是的，团结起来的我们将无比强大！"
 vatican_holy_war_event_tooltip: "宣布这场战争为一场§Y十字军远征§!。邀请所有非萨拉菲主义的欧洲国家以及我方阵营的所有成员加入针对目标的战争。"
 vatican.10.t: "梵蒂冈哈里发国提供援助"
 vatican.10.d: "梵蒂冈哈里发国向穆斯林国家提供了武器、资金和保护，承诺建立信徒联盟以对抗他们的敌人。"
 vatican.10.o1: "我们接受"
 vatican.10.o2: "我们独自行动会更好"
 vatican.11.t: "教宗号召我们加入十字军远征"
 vatican.11.d: "[HLS.GetLeader]发起了对[FROM.GetNameDef]的十字军，并呼吁欧洲所有基督教国家拿起武器或向圣座提供援助。"
 vatican.11.o1: "主的旨意！"
 vatican.11.o2: "我们会提供一些援助"
 vatican.11.o3: "胡说，这都21世纪了！"
 vatican.12.t: "一场针对我们的十字军远征被发起"
 vatican.12.d: "教宗正在呼吁欧洲各国向我们宣战。我们应当做最坏的打算。"
 vatican.12.o1: "让他们试试看！"
 vatican.13.t: "教宗请求增派瑞士卫队"
 vatican.13.d: "圣座已要求我们派遣另一支宗座瑞士卫队常驻梵蒂冈城。"
 vatican.13.o1: "为了教宗？当然！"
 vatican.13.o2: "他已有足够的保护"
 vatican.14.t: "瑞士派遣更多卫兵"
 vatican.14.d: "我们的请求已获批准。一支新的瑞士卫队已进驻我们的城墙之内。"
 vatican.14.o1: "好消息！"
 vatican.15.t: "瑞士拒绝"
 vatican.15.d: "瑞士目前已拒绝派遣更多的瑞士卫队。"
 vatican.15.o1: "也许等他们有人手空闲的时候吧"
 vatican.16.t: "意大利接受教宗的宗主权"
 vatican.16.d: "出乎所有人意料，[FROM.GetNameDef]已接受教宗为其君主。罗马再次听命于梵蒂冈。"
 vatican.16.o1: "愿上帝的旨意成就"
 vatican.17.t: "意大利拒绝教宗的宗主权"
 vatican.17.d: "[FROM.GetNameDefCap]已拒绝了我们的要求。如果意大利不愿屈服，就必须使其屈服。"
 vatican.17.o1: "那我们就用武力夺取它"
 vatican.18.t: "朝圣者涌向罗马参加禧年"
 vatican.18.d: "教宗宣布了禧年，数百万朝圣者涌入罗马，穿过圣彼得大教堂的圣门。教廷必须决定如何接待这些人群。"
 vatican.18.o1: "欢迎每一位朝圣者"
 vatican.18.o2: "保持禧年庄严而克制"
 vatican.19.t: "世界青年日将在哪里举行？"
 vatican.19.d: "来自各大洲的年轻天主教徒已准备好聚集在教宗身边参加世界青年日。教廷必须选择主办地区，而这一选择将在很大程度上表明教会认为其未来在何处。"
 vatican.19.o1: "在欧洲举办"
 vatican.19.o2: "在美洲举办"
 vatican.19.o3: "在非洲和亚洲举办"
 vatican.20.t: "在阿西西为和平祈祷"
 vatican.20.d: "我们已召集世界各宗教领袖前往圣方济各的故乡阿西西，为和平祈祷。教廷内部对于邀请哪些人出现意见分歧。"
 vatican.20.o1: "邀请每个信仰的领袖"
 vatican.20.o2: "仅邀请基督教教派"
 vatican.21.t: "宗教会议讨论改革与传统"
 vatican.21.d: "来自各大洲的主教们已齐聚罗马以共同商讨教会的未来。改革派希望教会更加开放，而传统派则警告不要抛弃世代传承的教义。"
 vatican.21.o1: "拥抱改革"
 vatican.21.o2: "维护传统"
 vatican.21.o3: "寻求妥协"
 vatican.22.t: "泄露文件曝光教廷财政"
 vatican.22.d: "关于梵蒂冈银行的机密文件已泄露给媒体，其中列出了可疑账户和捐赠者。欧洲各地的编辑纷纷要求圣座作出解释。"
 vatican.22.o1: "公开档案并起诉泄密者"
 vatican.22.o2: "噤声"
 vatican_news.1.t: "教宗号召一场十字军远征"
 vatican_news.1.d1: "教宗在最近谴责伊斯兰教之后，号召对[FROM.GetNameDef]发动十字军。梵蒂冈敦促其盟友立即对他们开战。"
 vatican_news.1.d2: "教宗号召对[FROM.GetNameDef]发动所谓的十字军远征，宣称我们的信仰是虚假的。愿真主赐予[FROM.GetName]力量，让教宗俯首称臣。"
 vatican_news.1.o1: "十字军？现在是12世纪吗？"
 vatican_news.1.o2: "如果是真主所愿"
 vatican_news.2.t: "教宗承认伊斯兰教"
 vatican_news.2.d1: "在一次历史性的宣告中，[HLS.GetLeader]宣布伊斯兰教与基督教在上帝面前平等，并呼吁与各地的穆斯林建立持久的友谊。"
 vatican_news.2.d2: "基督徒的领袖[HLS.GetLeader]已在全世界面前承认了伊斯兰教的真理。许多信徒将其视之为将来之事的一种征兆。"
 vatican_news.2.o1: "双方互相减少敌意将会是受欢迎的"
 vatican_news.2.o2: "也许基督教和伊斯兰教可以并肩共存"
 vatican_news.3.t: "教宗谴责伊斯兰教"
 vatican_news.3.d1: "[HLS.GetLeader]正式谴责伊斯兰教，抛弃了数十年的宗教间对话。中东的几个政府已经对梵蒂冈发出了威胁。"
 vatican_news.3.d2: "基督教教宗[HLS.GetLeader]在全世界面前侮辱了十亿穆斯林的信仰。我们不会对这种诽谤置之不理。"
 vatican_news.3.o1: "教宗谴责伊斯兰教？接下来还有什么，一场十字军吗？"
 vatican_news.3.o2: "教宗会为这些话后悔的"
 vatican_news.4.t: "君士坦丁堡重生"
 vatican_news.4.d1: "[HLS.GetLeader]正式将伊斯坦布尔重新命名为君士坦丁堡。该城于1453年落入奥斯曼帝国之手，1930年正式更名，如今这座城市重归基督教势力掌控。"
 vatican_news.4.d2: "教宗从法理拥有者手中夺取伊斯坦布尔后，将其更名为君士坦丁堡。这一侮辱不会被遗忘。"
 vatican_news.4.o1: "这个名字更高贵"
 vatican_news.4.o2: "它不会在教宗手中停留太久"
 holywar_wargoal: "圣战"
 holywar_wargoal_desc: "由圣座宣布的圣战。"
 holywar_wargoal_short_desc: "此战争目标旨在发动一场由教宗领导的圣战。"
 crusade_wargoal: "十字军远征"
 crusade_wargoal_desc: "教宗对该国发起的一场十字军远征。"
 crusade_wargoal_short_desc: "这个战争目标是由教宗发起的一场十字军远征。"
 jihad_wargoal: "圣战"
 jihad_wargoal_desc: "梵蒂冈哈里发国宣布的圣战。"
 jihad_wargoal_short_desc: "此战争目标是为了梵蒂冈哈里发国发起的圣战。"
 vatican_islamist_alliance: "真主信徒"
 vatican_holy_christian_alliance: "神圣同盟"
 HLS_retake_african_coast_tt: "对曾经属于罗马的北非海岸宣称主权。"
 HLS_anti_islamist_crusade_tt: "每个§Y萨拉菲§!政权都会得知这场圣战。随后我们将对每一个政权选择是发动§Y圣战§!，还是号召全欧洲的§Y十字军§!。"
 HLS_aid_our_brethren_tt: "所有与我们未处于战争状态的穆斯林国家都将获得我们的援助。接受援助的国家将获得§G稳定度§!和§G战争支持度§!，若我们领导一个阵营，它们将加入我们的阵营。"
 HLS_sympathizers_for_the_cause_tt: "在每个§Y萨拉菲主义§!国家获得§G3%§!影响力。"
 HLS_vatican_radio_tt: "在§Y意大利§!、§Y波兰§!、§Y西班牙§!、§Y葡萄牙§!、§Y爱尔兰§!、§Y巴西§!、§Y墨西哥§!和§Y菲律宾§!获得§G2%§!影响力。"
 HLS_swiss_guard_tooltip: "§Y瑞士§!向梵蒂冈派遣了一支§Y瑞士卫队§!师。"
 HLS_anti_islamist_crusade_custom_trigger: "已正式谴责伊斯兰教"
 HLS_a_dark_path_custom_trigger: "未谴责伊斯兰教"
 HLS_ecumenical_outreach_tt: "在每一个§Y东正教§!国家获得§G3%§!影响力。"
 vatican_wyd_europe_tt: "在§Y欧洲§!的每个§Y基督教§!国家获得§G3%§!影响力。"
 vatican_wyd_americas_tt: "在§Y美洲§!的每个§Y基督教§!国家获得§G3%§!影响力。"
 vatican_wyd_global_south_tt: "获得§G3%§!影响力，在所有§Y非洲§!和§Y亚洲§!的§Y基督教§!国家。"
 vatican_assisi_muslim_tt: "每个§Y穆斯林§!国家对我们好感度提升。"
 vatican_assisi_orthodox_tt: "在每个§Y东正教基督教§!国家获得§G2%§!影响力。"
 HLS_improve_the_city: "改善城市"
 HLS_improve_the_city_desc: "梵蒂冈的街道和庭院需要修缮，城市的每一平方米都必须得到充分利用。"
 HLS_strengthen_the_walls: "加固城墙"
 HLS_strengthen_the_walls_desc: "利奥尼内城墙已守护教宗逾千年。应对现代威胁需以现代防御应对。"
 HLS_electrical_deals: "电气交易"
 HLS_electrical_deals_desc: "梵蒂冈从意大利购买电力。与意大利公用事业公司签订长期协议将确保获得廉价且可靠的电力供应。"
 HLS_vatican_factories: "梵蒂冈工厂"
 HLS_vatican_factories_desc: "这并非一项神圣的事业，但圣座需要有自己的工业。"
 HLS_carbon_neutrality: "碳中和"
 HLS_carbon_neutrality_desc: "通过植树造林抵消碳排放，梵蒂冈可以成为世界上第一个碳中和国家，并引领信众关爱受造物。"
 HLS_solar_panels: "太阳能电池板"
 HLS_solar_panels_desc: "保禄六世大厅的屋顶宽阔、平坦且日照充足。在屋顶上铺设太阳能电池板将使梵蒂冈成为清洁能源的典范。"
 HLS_heavy_restructuring: "大量重建"
 HLS_heavy_restructuring_desc: "梵蒂冈必须发展壮大，不再局限于飞地。这项工作需要数年时间，耗资巨大，但将使我们变得强大。"
 HLS_vatican_fortress: "梵蒂冈防御工事"
 HLS_vatican_fortress_desc: "梵蒂冈不仅仅是一座城市，更是教宗的驻地。与其建造更多工厂，我们不如大力加强它的防御工事。"
 HLS_refurbish_the_vatican_library: "翻新梵蒂冈图书馆"
 HLS_refurbish_the_vatican_library_desc: "梵蒂冈图书馆需要进行全面修复，方能继续成为流传后世的奇迹。"
 HLS_road_to_greatness: "通往伟大之路"
 HLS_road_to_greatness_desc: "世界嘲笑地球上最小的国家。是时候复兴古老的方式以引领世界进入信仰的新时代了。"
 HLS_status_quo: "维持现状"
 HLS_status_quo_desc: "圣座目前处境良好。无需重拾过去的野心。"
 HLS_swiss_guard: "瑞士卫队"
 HLS_swiss_guard_desc: "瑞士卫队一直守护着我们，但现代世界局势要求我们强化它。"
 HLS_great_jubilee: "大庆典"
 HLS_great_jubilee_desc: "在禧年期间，数百万朝圣者来到罗马，穿过圣彼得大教堂的圣门。教会计划欢迎他们中的每一个人。"
 HLS_pastoral_journeys: "牧师之旅"
 HLS_pastoral_journeys_desc: "教宗不再在梵蒂冈坐等世界前来朝见他。去访问遥远国家能让圣座走近信众，并使其声音传达到它们的总统和民众之中。"
 HLS_interfaith_dialogue: "宗教间对话"
 HLS_interfaith_dialogue_desc: "1986年，教宗在阿西西召集世界各宗教领袖共同祈求和平。再次将他们召集在一起，能够彰显信仰可以成为反对暴力的见证，而非暴力的根源。"
 HLS_world_youth_day: "世界青年日"
 HLS_world_youth_day_desc: "每隔几年，教宗都会号召全世界的年轻人参加一场盛大的祈祷与庆祝集会。数百万人响应号召，令许多人带着更坚定的信仰回到家乡。"
 HLS_synod_of_bishops: "主教会议"
 HLS_synod_of_bishops_desc: "来自各大洲的主教齐聚罗马，就教会面临的诸多问题向教宗献策。他们的谏言使圣座得以与各地信众保持联系。"
 HLS_ecumenical_outreach: "普世教会外展事工"
 HLS_ecumenical_outreach_desc: "东西方教会大分裂已近千年。与东正教会进行耐心的对话，或许仍能让基督教世界的两半走得更近。"
 HLS_moral_authority: "道德权威"
 HLS_moral_authority_desc: "教宗虽无军队，但当他谈及战争、贫困和人类尊严时，各国的政府和人民都会倾听。这种信任是圣座最宝贵的财富。"
 HLS_italy_our_puppet: "意大利，我们的附庸"
 HLS_italy_our_puppet_desc: "为了开始我们的崛起之路，我们必须重新夺回对意大利本土的管辖权。说到底，意大利是我们的祖国。"
 HLS_retake_rome: "收复罗马"
 HLS_retake_rome_desc: "梵蒂冈永远是我们国度的心脏，但我们需要整个罗马及其工业来维持它。"
 HLS_italian_integration: "整合意大利"
 HLS_italian_integration_desc: "当一个附庸还不够。意大利应当直接并入教宗国。"
 HLS_rebuild_italy: "重建意大利"
 HLS_rebuild_italy_desc: "在意大利归于我们的管辖之下后，我们必须为其重建腾出空间。"
 HLS_reinstate_latin_language: "重新使用拉丁语"
 HLS_reinstate_latin_language_desc: "一国应说一种语言。教会之舌拉丁语，将取代意大利语用于我们的行政管理。"
 HLS_the_rise_of_christianity: "基督教的崛起"
 HLS_the_rise_of_christianity_desc: "是时候向世界证明，教会不仅能引领灵魂，更能引领国家。"
 HLS_new_alliance: "新梵蒂冈联盟"
 HLS_new_alliance_desc: "梵蒂冈无法独自克服这个世界的固执。我们需要盟友。"
 HLS_religious_recruits: "宗教新兵"
 HLS_religious_recruits_desc: "许多信徒希望为我们而战。但他们中很少有人适合战斗，因此训练需要时间。"
 HLS_restore_roman_empire: "恢复罗马帝国"
 HLS_restore_roman_empire_desc: "自罗马的教会曾引领一个帝国。它必能再度如此。"
 HLS_divide_et_impera: "分而治之"
 HLS_divide_et_impera_desc: "“分而治之。”将较大的势力分裂为无力抵抗我们的碎片，一个新罗马将会崛起。"
 HLS_strike_gaul: "打击高卢"
 HLS_strike_gaul_desc: "高卢、伊斯帕尼亚和不列颠尼亚都曾臣服于罗马。我们的军团将让他们重新记起这一点。"
 HLS_retake_african_coast: "重夺非洲海岸"
 HLS_retake_african_coast_desc: "北非如同高卢一样，是罗马不可或缺的一部分。我们应当恢复罗马对其海岸的统治。"
 HLS_recover_balkans: "收复巴尔干"
 HLS_recover_balkans_desc: "自南斯拉夫解体以来，巴尔干半岛除了冲突之外几乎一无所知。若把它们置于罗马的统治之下，其人民方能得享和平。"
 HLS_recover_anatolia: "收复安纳托利亚"
 HLS_recover_anatolia_desc: "东方帝国必须复兴，而这一次它将不再与西方分裂。君士坦丁堡正等待着。"
 HLS_holy_soldiers: "十字军"
 HLS_holy_soldiers_desc: "“十字军”的头衔曾授予所有参加过十字军东征的人。将这一头衔授予我们的士兵，将使他们与教会紧密相连。"
 HLS_anti_islamist_crusade: "反伊斯兰主义十字军"
 HLS_anti_islamist_crusade_desc: "世界上的萨拉菲政权已经招致了教会的盛怒。是时候举起我们的剑了。"
 HLS_retake_the_holy_land: "收复圣地"
 HLS_retake_the_holy_land_desc: "谁说第一次十字军东征是个坏主意？"
 HLS_second_anti_islamist_crusade: "第二次反伊斯兰主义十字军"
 HLS_second_anti_islamist_crusade_desc: "第一次十字军未竟全功。是时候再来一次了。"
 HLS_a_dark_path: "黑暗之路"
 HLS_a_dark_path_desc: "梵蒂冈的基督教气数已尽。教宗已寻得新的信仰，圣座亦将追随其后。"
 HLS_jihad: "宣布圣战"
 HLS_jihad_desc: "世界必须知道，梵蒂冈哈里发国对于传播其信仰是认真的。"
 HLS_take_jerusalem: "夺取耶路撒冷"
 HLS_take_jerusalem_desc: "耶路撒冷对亚伯拉罕三大宗教皆为圣地。梵蒂冈哈里发国意图统治此地。"
 HLS_anti_america: "反美"
 HLS_anti_america_desc: "美国的反恐战争已使穆斯林世界转而反对它。梵蒂冈哈里发国将领导这场抵抗。"
 HLS_aid_our_brethren: "援助我们的同胞"
 HLS_aid_our_brethren_desc: "穆斯林国家常常受制于外国势力。我们可以团结起来互相保护对方。"
 HLS_allahs_will: "真主的意志"
 HLS_allahs_will_desc: "虔诚的信众涌向梵蒂冈哈里发国，准备为事业献出生命。"
 HLS_sympathizers_for_the_cause: "事业的同情者"
 HLS_sympathizers_for_the_cause_desc: "世界各地的萨拉菲派政府将有助于传播我们的信息。我们应该拉拢他们。"
 HLS_papal_armed_forces: "教宗武装部队"
 HLS_papal_armed_forces_desc: "自1870年教宗国灭亡以来，教宗便不再需要军队。现在是时候盘点我们的兵力了。"
 HLS_question_of_the_land_forces: "陆军问题"
 HLS_question_of_the_land_forces_desc: "我们的陆军力量几乎为零。我们是扩充瑞士卫队，还是在罗马训练年轻的狂热信徒？"
 HLS_maintain_the_swiss_guard: "维持瑞士卫队"
 HLS_maintain_the_swiss_guard_desc: "瑞士卫队始终忠于我们。我们将保留这一传统及其高标准的纪律。"
 HLS_drill_the_guard: "操练卫队"
 HLS_drill_the_guard_desc: "瑞士卫队从来不是为了发动进攻性战争而存在的。艰苦的训练将使它能胜任这项任务。"
 HLS_offensive_swiss_guard: "进攻型瑞士卫队"
 HLS_offensive_swiss_guard_desc: "瑞士卫队训练有素，准备率领我军投入进攻。"
 HLS_refined_equipment_procurement: "精良装备采购"
 HLS_refined_equipment_procurement_desc: "用更便宜的方式把步枪交到我们的部队手中，意味着更多士兵能带上武器"
 HLS_latium_military_industrial_complex: "罗马军工复合体"
 HLS_latium_military_industrial_complex_desc: "罗马军团自行维护装备。类似的制度将加快动员速度，并为国家带来收入。"
 HLS_bring_fanatics_to_rome: "将狂热分子带到罗马"
 HLS_bring_fanatics_to_rome_desc: "狂热者总能找到通往教会的路。现在我们要让他们穿上军装。"
 HLS_fanatic_infantry: "狂热步兵"
 HLS_fanatic_infantry_desc: "狂热者是不可靠的士兵，但成千上万的狂热者同时冲锋可以突破任何防线。"
 HLS_disciplined_rabble: "纪律严明的乌合之众"
 HLS_disciplined_rabble_desc: "凭借严明的纪律，我们的狂热信徒能够成为一支可怕的战斗力量。"
 HLS_papal_fleet: "教宗舰队"
 HLS_papal_fleet_desc: "教宗海军最后一次航行是在1870年。如今一段海岸线已归我们统治，我们可以再一次组建舰队。"
 HLS_angelforce: "天使部队"
 HLS_angelforce_desc: "梵蒂冈已经为教宗保留了一个直升机停机坪。它可以成为一支小型教宗航空部队的雏形。"
 HLS_reform_the_curia: "改革罗马教廷"
 HLS_reform_the_curia_desc: "教廷的各个部和会议已变得行动迟缓、争吵不休。对教宗官僚体系的改革早已刻不容缓。"
 HLS_clean_up_the_vatican_bank: "清理梵蒂冈银行"
 HLS_clean_up_the_vatican_bank_desc: "宗教工作研究所数十年来一直与丑闻纠缠不清。向欧洲监管机构公开其账簿将恢复人们对我们金融体系的信任。"
 HLS_peters_pence: "伯多禄献金"
 HLS_peters_pence_desc: "世界各地天主教徒每年通过伯多禄献金向教宗奉献。再次呼吁将充实我们的金库。"
 HLS_open_the_vatican_museums: "开放梵蒂冈博物馆"
 HLS_open_the_vatican_museums_desc: "每年有数百万游客前来参观西斯廷教堂。延长开放时间并增开新展馆将吸引更多游客。"
 HLS_vatican_observatory: "梵蒂冈天文台"
 HLS_vatican_observatory_desc: "梵蒂冈天文台研究天球已逾百年。资助其在亚利桑那州的望远镜将使教会始终立于科学前沿。"
 HLS_vatican_radio: "梵蒂冈广播电台"
 HLS_vatican_radio_desc: "梵蒂冈广播电台用数十种语言播送教宗的声音。扩大其覆盖范围将加强我们与天主教世界的联系。"
 HLS_papal_diplomacy: "教宗国外交"
 HLS_papal_diplomacy_desc: "圣座与世界上几乎所有国家都保持着外交关系。我们应当让这一关系网络发挥作用。"
 HLS_praedicate_evangelium: "你们去宣讲福音"
 HLS_praedicate_evangelium_desc: "2022年，宗座宪章《你们去宣讲福音》围绕宣讲福音的使命对罗马教廷进行了重组。部会取代了圣部和委员会，平信徒也有资格领导这些机构。"