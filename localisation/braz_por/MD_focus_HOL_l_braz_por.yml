 HOL_lion_bronse:0 "Leão de Bronze"
 HOL_empowering_local_governments_idea:0 "Governo Descentralizado"
 HOL_empowering_local_governments_idea_desc:0 "O poder foi delegado aos governos regionais, melhorando a autonomia local e a eficiência administrativa. O esforço de descentralização reforçou a estabilidade e fomentou uma estrutura econômica mais eficiente."
 HOL_centralized_governance_idea:0 "Governo Centralizado"
 HOL_centralized_governance_idea_desc:0 "A Coroa centralizou a autoridade, criando um sistema de governo unificado, porém rígido. Os custos burocráticos aumentaram, mas o poder político foi consolidado para fortalecer o controle da monarquia."
 HOL_restore_nobility_influence_idea:0 "Influência da Nobreza Restaurada"
 HOL_restore_nobility_influence_idea_desc:0 "A nobreza retomou seu papel como pilar do governo real. Sua influência reforça a autoridade da monarquia, fomenta a lealdade política e promove um senso de unidade cultural."
 HOL_nobility_backed_military_idea:0 "Forças Armadas Lideradas pela Nobreza"
 HOL_nobility_backed_military_idea_desc:0 "A nobreza assumiu papéis de liderança nas forças armadas, garantindo lealdade à Coroa. A eficiência militar melhorou e a autoridade da monarquia está assegurada por meio das forças armadas."
 HOL_nato_commitments_idea:0 "Compromissos com a OTAN"
 HOL_nato_commitments_idea_desc:0 "Com as crescentes tensões globais, a OTAN continua sendo o alicerce da segurança holandesa. Ao reafirmar nosso compromisso com a aliança, podemos garantir cooperação em defesa e vantagens tecnológicas de nossos aliados."
