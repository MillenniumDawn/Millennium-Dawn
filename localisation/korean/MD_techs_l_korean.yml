 module_naval_anti_ship_nuclear_torpedo_3_desc: "$module_naval_anti_ship_nuclear_torpedo_1_desc$"
 module_naval_anti_ship_nuclear_torpedo_4: "핵 대함 어뢰 IV"
 module_naval_anti_ship_nuclear_torpedo_4_desc: "$module_naval_anti_ship_nuclear_torpedo_1_desc$"
 module_naval_asw_nuclear_torpedoes_1: "핵 대잠 어뢰 I"
 module_naval_asw_nuclear_torpedoes_1_desc: "핵 대잠 어뢰는 대잠 운반 방식에 매우 강력한 탄두를 결합하여 잠항 중인 표적에 대한 치사율을 극대화합니다.\n\n§G설계 힌트: 핵 대잠 어뢰는 탐지된 잠수함을 격침하기 위한 탁월한 대잠수함전 능력을 제공합니다. 전담 잠수함 사냥함에 적합하지만 기존 대잠 어뢰보다 IC와 인력 비용이 높습니다.§!"
 module_naval_asw_nuclear_torpedoes_2: "핵 대잠 어뢰 II"
 module_naval_asw_nuclear_torpedoes_2_desc: "핵 대잠 어뢰는 대잠 운반 방식에 매우 강력한 탄두를 결합하여 잠항 중인 표적에 대한 치사율을 극대화합니다.\n\n§G설계 힌트: 핵 대잠 어뢰는 탐지된 잠수함을 격침하기 위한 탁월한 대잠수함전 능력을 제공합니다. 전담 잠수함 사냥함에 적합하지만 기존 대잠 어뢰보다 IC와 인력 비용이 높습니다.§!"
