 iraq_md.200.t: "Presença americana no Iraque"
 iraq_md.200.d: "A missão americana na nossa nação está em curso há muitos anos e, na opinião do nosso povo, a sua permanência aqui deve chegar ao fim. Apesar de algumas delegações americanas insistirem que a sua presença é necessária para combater o terrorismo e o extremismo, vemos de forma diferente. Já é hora de nosso governo fazer uma escolha sobre esse assunto."
 iraq_md.200.a: "Envie-lhes o pedido"
 iraq_md.200.b: "A hora não está certa"
 iraq_md.201.t: "O governo iraquiano solicita a nossa retirada"
 iraq_md.201.d: "The Iraqi government has requested that we withdraw our forces from their nation, citing that our mission has been long due for a closure. Their diplomats have assured us that the state is able to completely operate on its own, not being in need of our assistance to maintain the Iraqi state."
 iraq_md.201.a: "Vamos trazer nossos meninos para casa"
 iraq_md.201.b: "Não, eles ainda não estão prontos"
 iraq_md.202.t: "United States Withdraws Its Forces"
 iraq_md.202.d: "The United States has decided to agree with our request, and have begun withdrawing their troops. The withdrawal will be gradual, but they have already signed into effect the transfer of all government posts currently manned by American experts."
 iraq_md.202.a: "Finalmente！"
 iraq_md.203.t: "Estados Unidos se recusam a retirar-se"
 iraq_md.203.d: "O governo americano recusou o nosso pedido, alegando que o nosso governo não está preparado para manter um controlo estável sobre o governo."
 iraq_md.203.a: "Infeliz"
 iraq_md.74.b: "NÃO! Saddam é nosso eterno líder!"
 iraq_md.744.t: "Saddam Hussein morre!"
 iraq_md.744.d: "Today 6:00 AM the president was reported dead in his bed, surrounded by close family members. His life was one with many ups and downs, surviving several wars with the United States and other nations. However, with his death, comes a new beginning. Saddam had appointed one of his sons to lead the nation, though it has been widely unknown until recently."
 iraq_md.744.a: "Descanse em paz.."
 iraq_md.300.t: "Saddam quer uma atualização sobre o nosso progresso no Irão?"
 iraq_md.300.d: "Saddam Hussein invadiu o gabinete do Estado-Maior Conjunto, exigindo saber como está o nosso progresso na guerra com o Irão. Um guarda se aproximou e declarou: \"Sr. Presidente, a guerra terminou há décadas! Não há guerra com o Irã\". Saddam imediatamente atirou no guarda no local."
 iraq_md.300.a: "Uh.. Yeah it's going great"
 iraq_md.301.t: "Saddam confunde hospital com câmara de tortura"
 iraq_md.301.d: "During a routine hospital visit, Saddam mistook the hospital as a torture chamber and began fighting with the nurses who were preparing him for his check. He demanded that he be freed immediately, but his personal assistant re-assured him that they were not in a torture chamber. The assistant was fired yesterday, and for some reason his records such as birth certificate, and otherwise, no longer appear on our systems."
 iraq_md.301.a: "Droga"
 iraq_md.302.t: "Saddam ataca o consulado britânico"
 iraq_md.302.d: "Whilst he was on a walk, Saddam Hussein had convinced a small group of soldiers he saw on the road to help him storm the British Consulate in Baghdad. Upon attempting to breach the compound, British guards detained the soldiers aiding Saddam and demanded for someone to come get Saddam. As Saddam was being dragged away, he started frantically kicking and screaming \"Today the colonizers have been colonized! Glory to the Iraqi nation! Glory to the Iraqi people!\". The British consulate have issued a statement, declaring they will be leaving for the time being."
 iraq_md.302.a: "Ops."
 iraq_md.303.t: "Saddam confunde lanterna com bomba"
 iraq_md.303.d: "Por alguma razão, ontem à noite um dos zeladores do palácio de Saddam colocou uma lanterna em cima da mesa de cabeceira de Saddam enquanto ele dormia. Esta manhã, vários guardas correram freneticamente para o quarto de Saddam, pois os gritos que saíam do quarto de Saddam os preocupavam muito. Eles foram presenteados com Saddam aterrorizado, enquanto ele estava no canto oposto da sala apontando para a luz do flash e gritando \"Os americanos e os sionistas enfiaram uma bomba no meu quarto!\". Os Guardas retiraram rapidamente a lanterna e Saddam voltou a dormir. A governanta não trabalha mais no palácio."
 iraq_md.303.a: "O Que Diabos?"
 iraq_md.304.t: "Saddam tenta subornar balconistas, confundindo-os com diplomatas estrangeiros"
 iraq_md.304.d: "For several days, Saddam had been complaining about the lack of Chocolate in the palace. Because of this, his assistants could not put up with his complaining for much longer, and eventually just took him to the store as he insisted he wanted to personally pick out the brand of chocolate himself. As the guards and assistants were distracted by the crowd forming outside, one of them noticed that Saddam was trying to whisper into the ear of the clerk, and overheard him saying \"Listen, if you ensure that our ships flow through Hormuz without problem, and you go back on your deal with the Omanis and Iranians, then I will give you a very favorable price for any future oil deals\". The Guards then swiftly bought the chocolate, and escorted Saddam back to the palace."
 iraq_md.304.a: "O Que Diabos?"
 iraq_md.305.t: "Saddam escreve uma confissão emocional por crimes que não cometeu"
 iraq_md.305.d: "In a moment of considerable guilt and confusion, Saddam began writing a very emotional and apologetic address to the nation about crimes that he did not commit. He went on to describe how he felt sorry for tainting a local town's water supply with apple-cider vinegar. A nosey maid came across this letter, and reported it to one of Saddam's close assistants, who immediately went on to have a talk with Saddam about how he did not commit such a crime. Saddam insisted that he did, and that he could no longer stand the guilt. The assistant then reluctantly brought a nutritionist to inform Saddam about the health benefits of apple-cider vinegar, and how instead he helped the locals rather than harm. Saddam then secretly wrote and published a patriotic letter pleading with everyone to drink apple-cider vinegar so that Iraq may have \"The Earth's Finest Soldiers\"."
 iraq_md.305.a: "Ah não..."
 iraq_md.306.t: "Saddam planeja uma revolução contra seus cuidadores"
 iraq_md.306.d: "Upon being denied exit from the palace, Saddam thought that he was under house arrest as he believed that his party had failed the coup they launched in 1963. He then began trying to sway the guards to his side, explaining to them in detail about his plot to overthrow his care-givers, and break free from the palace. The guards then realized something was wrong, and took him under their protection momentarily until he fell asleep."
 iraq_md.306.a: "Por quê?"
 iraq_md.307.t: "Saddam prepara um jantar diplomático com sobras de comida"
 iraq_md.307.d: "Sem informar a cozinha do palácio, nem ninguém, Saddam começou a colocar os pratos na mesa de jantar do palácio e convocou alguns diplomatas regionais para realizar um jantar diplomático para discutir problemas regionais. Isto resultou no interrogatório dos convidados pelos guardas estacionados no palácio à sua chegada, causando uma comoção que poderia ter sido totalmente evitada se Saddam tivesse apenas informado outros sobre os seus planos. Os convidados acabaram por ser autorizados a entrar, esquecendo-se que ele os convidou em primeiro lugar, Saddam não tinha preparado nenhuma comida para os convidados, por isso foram presenteados com restos de comida fria que ele tirou freneticamente da cozinha."
 iraq_md.307.a: "Que embaraçoso"
 iraq_md.308.t: "Saddam ensaia durante horas um discurso previamente televisionado"
 iraq_md.308.d: "For hours, Saddam's care-givers had not seen him leave his room, as they believed he was rehearsing a quick speech that he had planned for later that day. Out of concern, they began trying to listen to what he was saying and one of them recognized the speech as his previous one about the American invasion. An assistant was later told to enter the room to inform Saddam that he had already given the speech years ago, and he did so with fear and reluctance. Saddam then furiously threw the papers against the wall and told the assistant to get out. Later that day the sounds of a crying Saddam could be heard throughout the palace."
 iraq_md.308.a: "Droga"
 iraq_md.309.t: "Saddam confunde uma geladeira com um cofre"
 iraq_md.309.d: "Esta manhã, Saddam virou o palácio de cabeça para baixo enquanto procurava freneticamente o dinheiro que tinha guardado num cofre dentro de um cofre. Não se lembrando disso, Saddam confundiu a geladeira com o seu cofre, acreditando que alguém havia roubado seu dinheiro e escondido em outro lugar. Saddam foi então informado sobre a localização do cofre e exigiu levar algum dinheiro para gastar em alguns luxos."
 iraq_md.309.a: "Droga"
 iraq_md.310.t: "Saddam inicia um incêndio!"
 iraq_md.310.d: "Hoje cedo, quando Saddam visitava uma aldeia local nos arredores de Rutbah, Saddam acendeu um charuto que se esqueceu de apagar ou até mesmo de fumar. Este mesmo charuto entrou em contacto com uma das casas, que pegou fogo e, a partir daí, o fogo acabou por se espalhar por grande parte da aldeia. Saddam foi informado da causa do incidente, mas tem insistido continuamente que não fuma há muitos anos."
 iraq_md.310.a: "Qual é o dano?"
 iraq_md.311.t: "Saddam entra no voo errado!"
 iraq_md.311.d: "Saddam had been adamant about meeting the President of France, [FRA.GetLeader]. The meeting was agreed upon, and the flight was prepared. During the flight, Saddam insisted that he knew the way to France as he in his own words, \"had been to France many times\". As a result, the pilot had to agree to Saddam's verbal directions and ended up in the middle of French Guiana instead. The meeting was then promptly cancelled."
 iraq_md.311.a: "Podemos tê-lo de volta, por favor?"
 iraq_md.312.t: "Saddam perde cimeira crucial sobre segurança"
 iraq_md.312.d: "Saddam had arranged plans for a national security summit, where his top generals and officers were asked to attend. Yesterday was when the summit was meant to take place, and upon the arrival of all the officials, they were greeted with silence as they all patiently waited for Saddam Hussein to address the room. To their surprise, Saddam Hussein never showed up. Instead it was revealed that Saddam was busy on a fishing trip with Qusay and Uday at the Euphrates river."
 iraq_md.312.a: "Bom para ele"
 iraq_md.313.t: "Desfile do Festival de Erros de Saddam para uma Marcha Militar"
 iraq_md.313.d: "This morning, Saddam was being driven to an official's office for a meeting that they had arranged. On his way there, he saw a street being blocked off for a planned parade being held there, which he mistook for a military parade. He then told his driver to pull over, and Saddam rushed to the podium on the side of the street, kicking the announcer off the stage. He then began saluting in anticipation for the soldiers, but instead he was caught saluting cartoon characters as he swiftly realized that he was at a children's parade."
 iraq_md.313.a: "Droga"
 iraq_md.314.t: "Saddam ordena a construção de 500 novos bunkers!"
 iraq_md.314.d: "Temendo um ataque nuclear iminente dos Estados Unidos, Saddam ordenou a construção de 500 novos bunkers em todo o Iraque. Isto porque ele acreditava que o Iraque ainda estava em estado de guerra com os Estados Unidos e, portanto, entrou em pânico. As encomendas foram canceladas, mas as construtoras continuaram a perder dinheiro e por isso devem ser compensadas com justiça."
 iraq_md.314.a: "Droga"
 iraq_md.315.t: "Saddam ordena a colocação de centenas de minas terrestres na região do Curdistão para combater os insurgentes!"
 iraq_md.315.d: "Sem consultar os seus conselheiros militares, Saddam ordenou a colocação de centenas de minas na fronteira do Curdistão, a fim de combater grupos insurgentes locais. Esta ordem foi rapidamente cumprida por aqueles que a receberam, por acreditarem que se tratava de uma ordem grave devido ao recente aumento dos ataques. Mas agora os principais conselheiros de Saddam alertam que as minas podem causar danos graves às nossas próprias tropas."
 iraq_md.315.a: "Ui..."
 iraq_md.316.t: "Saddam Hussein é morto por uma mina terrestre"
 iraq_md.316.d: "Há alguns meses, Saddam Hussein decidiu que quer colocar centenas de minas terrestres perto da fronteira curda, a fim de evitar ataques de insurgentes locais. Sentindo-se odiado pelo povo curdo, Saddam sentiu-se compelido a visitar a região sozinho e encontrar-se com os habitantes locais como uma demonstração de boa fé. Saddam então pegou um carro no palácio e começou a dirigir durante horas até a fronteira com o Curdistão. O carro tinha combustível suficiente para levá-lo até a fronteira e, quando o carro ficou sem gasolina, Saddam começou a andar a pé. Esquecendo-se das minas, em algum lugar do caminho, Saddam pisou em uma mina terrestre e morreu no local."
 iraq_md.316.a: "Descanse em paz, nosso querido líder"
 IRQ_temp_medical_cost: "Taxas hospitalares"
 IRQ_saddam_ages_TT: "§HSaddam Hussein§! envelhecerá e §RSofrerá de Alzheimer!§!"
 IRQ_saddam_is_saddened_TT: "§HSaddam fica triste§!"
 IRQ_alzheimers_TT: "Due to §RSaddam's Alzheimer's§!, we may get events about §HSaddam's§! erratic behavior!"
 IRQ_saddams_pissfits: "£SOV_paranoia_text_icon A raiva de[IRQ.GetLeader]"
 IRQ_saddams_pissfits_desc: "Ao longo de sua vida, §H[IRQ.GetLeader]§! não conseguiu controlar sua §Rraiva de§! £SOV_paranoia_text_icon . Freqüentemente, direcionando sua raiva para seus militares £personnel_cost_multiplier_modifier_texticon ou para pessoas que vivem em [IRQ.GetFlag] §HIraq§!. Sua §Rraiva§! £SOV_paranoia_text_icon  inspira medo nas pessoas, o que pode torná-las menos propensas a cometer deslizes, mas a um custo.\n\n£SOV_paranoia_text_icon  A §Rraiva§! aumentará através de certos §HEventos, decisões e focos§! Se £stability_texticon  §HSestabilidade§! for inferior a §H40%§!, então a §Rraiva§! de £SOV_paranoia_text_icon  terá uma chance de aumentar em §H1§! todos os meses. Se a §Rraiva§! de £SOV_paranoia_text_icon  for maior que §H25%§!, haverá eventos aleatórios com consequências que serão desencadeadas. Se a §Rraiva§! de £SOV_paranoia_text_icon  atingir §H50%§!, §H[IRQ.GetLeader]§! executará um £personnel_cost_multiplier_modifier_texticon geral aleatório. A §Rraiva§! de £SOV_paranoia_text_icon  diminuirá gradualmente se £stability_texticon  A §Hestabilidade§! for §H40%§! ou superior.\n\n£SOV_paranoia_text_icon §Rraiva§!: [?IRQ_saddam_pissboy|%]"
 IRQ_receive_influence_5_TT: "Receberemos §H5% de influência§! em [IRQ.GetFlag] §HIraq§!"
 IRQ_receive_influence_2_TT: "Receberemos §H2% de influência§! em [IRQ.GetFlag] §HIraq§!"
 IRQ_they_receive_2_influence_TT: "Eles receberão §H2% de influência§! sobre nós"
 IRQ_they_receive_5_influence_TT: "Eles receberão §H5% de influência§! sobre nós"
 IRQ_fedayeen_patrols: "Patrulhas Fedayeen"
 IRQ_fedayeen_patrols_desc: "The Fedayeen Saddam must be utilized in order to enforce our nation's laws. They will ensure that the people are following holy norms, and remain righteous."
 IRQ_western_engineers_in_iraq: "Engenheiros ocidentais no Iraque"
 IRQ_western_aid_to_iraq: "Ajuda ocidental ao Iraque"
 IRQ_assassinate_abdullah_s_jumah: "Assassinar Abdullah S. Jum'ah"
 IRQ_assassinate_abdullah_s_jumah_desc: "O CEO da [SAU.GetFlag] Aramco, Abdullah S. Jum'ah, precisará ir. Enviaremos nossos agentes secretos para cuidar dele, e espero que tudo corra bem."
 iraqi_flavor_events.10.t: "Revolta xiita toma conta do sul do Iraque"
 iraqi_flavor_events.10.d: "A large-scale revolt has swept across Saddam Hussein's Ba'athist Iraq, marking the third such uprising in recent years. Shia Muslims have taken up arms against the Ba'athist state following allegations that a well-known cleric was murdered on the streets of Basra. \n\nSpeculation increases over Iranian involvement in the revolt, with rumours indicating Tehran may have been behind the assassination, sparking this latest wave of unrest. Iraqi forces are responding swiftly, deploying overwhelming force to crush the rebellion. The world now watches in anticipation of Iran's response and what it might bring."
 iraqi_flavor_events.10.a: "O Custo da Guerra"
 iraqi_flavor_events.11.t: "A Bandeira Negra se ergue sobre o Iraque"
 iraqi_flavor_events.11.t1: "Emergence of an Islamic State in Iraq"
 iraqi_flavor_events.11.d: "[ISI.GetLeader] today declared the formation of Al-Qaeda's official branch in Iraq, pledging the allegiance of Jama'at al-Tawhid wal-Jihad (Congregation of Monotheism and Jihad) to Osama bin Laden's global terror network of Al-Qaeda. Vowing to wage unyielding jihad against [PER.GetAdjective]-backed groups and Ba'athist Iraq, the organization, composed of foreign fighters and [IRQ.GetAdjective] insurgents, seeks to establish a caliphate, followed by a wave of jihad that would extend to Iraq's secular neighbours, before ending in a clash with Israel. The group has already launched several attacks against the IRGC, Shia militias, and the central Iraqi government. This comes as mass bombings rock the city of Baghdad as well as major cities across Iraq."
 iraqi_flavor_events.11.d1: "[ISI.GetLeader] has declared the establishment of the Islamic State of Iraq. Announcing the unification of various jihadist factions under its banner including Al-Qaeda in Iraq. The organization has vowed to dismantle [IRQ.GetLeader]'s Ba'athist Iraq and wage relentless jihad against [PER.GetAdjective]-backed militias and Iranian IRGC Force. With the ultimate goal of establishing an Islamic caliphate across the middle east. The group has intensified its campaign of bombings, assassinations, and raids across Baghdad and other major Iraqi cities as Iraq plunges into chaos."
 iraqi_flavor_events.11.a: "O Iraque está perdido?"
 iraqi_flavor_events.12.t: "Golpe apoiado pelo Irã no Iraque"
 iraqi_flavor_events.12.d: "Just moments ago, a coalition of Shia militia leaders backed by [PER.GetNameWithFlag] launched a coup against the Ba'athist government. Declaring the suspension of the Iraqi constitution and the establishment of Shi'ite rule. [IRQ.GetNameWithFlag]'s new leader, [IRQ.GetLeader], announced that his forces had just stormed the residence of Saddam Hussein and taken hold of his body in a targeted operation. In a fiery declaration, he proclaimed: \"We shall not rest until we root out Ba'athism from this land, which is rightfully for all!\". This comes as chaos erupts from Baghdad as Shi'ite militias have begun high-profile killings of Ba'athist officials. Meanwhile, [PER.GetNameWithFlag]'s Supreme Leader, [PER.GetLeader], has voiced his full support for the new government under [IRQ.GetLeader]"
 iraqi_flavor_events.12.a: "O fim da tirania ou apenas a próxima página?"
 iraqi_flavor_events.13.t: "Os legalistas do Baath pegam em armas"
 iraqi_flavor_events.13.d: "Remanescentes de apoiadores do Baath lançaram uma rebelião em larga escala no noroeste [IRQ.GetNameWithFlag], tomando várias cidades importantes na tentativa de restaurar o domínio do Baath e rejeitar o atual governo liderado pelos xiitas. [IRQ.GetLeader] prometeu reprimir a revolta, mas o resultado permanece incerto, com a violência e a turbulência se espalhando por todo o governo já instável. Enquanto isso, [IRS.GetLeader] prepara uma ofensiva para retomar a capital, Bagdá."
 iraqi_flavor_events.13.a1: "O Custo da Guerra"
 iraqi_flavor_events.13.a2: "Acabar com eles"
 IRQ_leave_socialist_union: "Deixe a União Socialista com [PER.GetFlag] Irã"
 iraq_md.317.t: "Garner substituído por Bremer"
 iraq_md.317.d: "Under the directive of the U.S. government, Jay Garner has been replaced with Paul Bremer. Allegations arose on what Garner's plans with Iraq were, as it was believed that he was giving too much control to the Iraqis themselves rather than going through the American forces. This move concludes Garner's short venture in Iraq, and the start of a new one."
 iraq_md.317.a: "OK"
 iraq_md.318.t: ""
 iraq_md.318.d: ""
 iraq_md.318.a: ""
 iraqi_MNF.2.t: "Cataratas de Bagdá"
 iraqi_MNF.2.d: "A honrosa cidade de Bagdá caiu nas mãos das forças de ocupação, e prédios governamentais, estátuas e cartazes estão sendo destruídos neste exato momento. Vários oficiais de alta patente foram capturados, mortos ou desaparecidos. Nossos principais generais nos dizem que lutar é inútil e que corremos o risco de sacrificar mais vidas se optarmos por continuar nossa luta armada contra os inimigos. Mas que escolha temos? Eles vieram à nossa terra, atacaram nosso povo e violaram nossa soberania."
 iraqi_MNF.2.a: "Não temos escolha"
 iraqi_MNF.2.b: "Rendição não está no nosso vocabulário!"
 iraqi_MNF.3.t: "América inicia operações no Iraque"
 iraqi_MNF.3.d: "Os Estados Unidos se colocaram em estado de guerra contra o Iraque, e prometemos aos americanos que estaríamos ao lado deles para lutar contra qualquer inimigo. Hoje, podemos cumprir essa promessa enviando tropas para a Força Multinacional no Iraque."
 iraqi_MNF.3.a: "Em diante"
 iraqi_MNF.3.b: "Mudamos de ideia..."
 iraqi_MNF.4.t: "O Governo Iraquiano Solicita a Nossa Retirada"
 iraqi_MNF.4.d: "A autoridade governante no Iraque solicitou formalmente a retirada de nossas forças do Iraque, incluindo todas as zonas de ocupação. Embora a carta parecesse bastante amigável em sua abordagem, certamente continha ameaças sutis. \"A recusa em desocupar territórios soberanos iraquianos pode levar a consequências indesejadas\", dizia a carta, assinada por [IRQ.GetLeader]."
 iraqi_MNF.4.a: "Nós iremos embora"
 iraqi_MNF.4.b: "Nós iremos embora... com uma condição"
 iraqi_MNF.4.c: "Então vocês terão que nos enterrar aqui mesmo nesta terra!"
 iraqi_MNF.5.t: "[FROM.GetName] Retira incondicionalmente"
 iraqi_MNF.5.d: "O governo [FROM.GetAdjective] decidiu atender ao nosso pedido e desocupar seus territórios ocupados imediatamente."
 iraqi_MNF.5.a: "Ótimo."
 iraqi_MNF.6.t: "[FROM.GetName] Retira-se com concessões de petróleo"
 iraqi_MNF.6.d: "O governo [FROM.GetAdjective] decidiu atender ao nosso pedido e desocupar os territórios ocupados imediatamente. No entanto, eles estão exigindo direitos de exploração de petróleo como parte dos termos de sua saída."
 iraqi_MNF.6.a: "Ok, Tudo Bem"
 iraqi_MNF.7.t: "[FROM.GetName] Recusa-se a desocupar"
 iraqi_MNF.7.d: "Those [FROM.GetAdjective] vermin have refused to let go of their occupation zones, and are further entrenching themselves in our territory. If they don't understand the language of diplomacy, then they'll understand the language of our force."
 iraqi_MNF.7.a: "Infeliz"
 iraqi_MNF.8.t: "Contrato de direitos de exploração de petróleo no Iraque expira"
 iraqi_MNF.8.d: "Nosso contrato para o petróleo iraquiano expirou hoje e, como resultado, não controlamos mais o petróleo nas regiões que antes ocupávamos."
 iraqi_MNF.8.a: "Conforme combinado"
 iraqi_MNF.9.t: "[FROM.GetName] Contrato de petróleo expira"
 iraqi_MNF.9.d: "[FROM.GetName] will no longer control the flow of oil in the regions they once occupied, with exports and oil handling being returned to Iraqi national control once more."
 iraqi_MNF.9.a: "Ótimo."
 iraqi_MNF.10.t: "Saddam Hussein capturado!"
 iraqi_MNF.10.d: "After weeks of being on the run, Saddam Hussein was finally captured by our forces in a discreet hiding location. He has been transferred to Abu Ghraib correctional facility where he is currently being evaluated. His fate will soon be decided by the appropriate Iraqi authorities."
 iraqi_MNF.10.a: "Senhoras e senhores, nós o pegamos."
 iraqi_MNF.11.t: "Qusay Hussein capturado!"
 iraqi_MNF.11.d: "After weeks of being on the run, Qusay Hussein was finally captured by our forces in a discreet hiding location. He has been transferred to Abu Ghraib correctional facility where he is currently being evaluated. His fate will soon be decided by the appropriate Iraqi authorities."
 iraqi_MNF.11.a: "Ótimo."
 iraqi_MNF.12.t: "Uday Hussein capturado!"
 iraqi_MNF.12.d: "After weeks of being on the run, Uday Hussein was finally captured by our forces in a discreet hiding location. He has been transferred to Abu Ghraib correctional facility where he is currently being evaluated. His fate will soon be decided by the appropriate Iraqi authorities."
 iraqi_MNF.12.a: "Good. Get that maniac off the streets!"
