 Japan.104.f: "Рост влияния имперских реставрационистов"
 JAP_electronics.320.t: "Сколько стоит Metal Gear"
 JAP_electronics.320.d: "Konami выпустила Metal Gear Solid 2 и Silent Hill 2 в одном и том же году, при этом бюджеты были оправданы только успехом игры, а команды разработчиков состояли из одного режиссера. Спортивная и карточная серии приносят стабильный доход и не нуждаются в авторе. Финансирование обеих серий — это то, что компания больше не может себе позволить."
 JAP_electronics.320.a: "Финансируйте команды под руководством директоров."
 JAP_electronics.320.b: "Профинансируйте ежегодные спортивные и карточные турниры."
 JAP_electronics.321.t: "Коллекторы зарабатывают больше, чем диски."
 JAP_electronics.321.d: "Konami может взять под контроль Hudson Soft и расшириться в сферу пачислотов и аркадных автоматов, где один автомат на площадке приносит за год больше прибыли, чем консольная игра за весь срок своего существования. Заводы и производственные площади являются реальными активами в Японии. Оставаясь издателем программного обеспечения, компания избегает бизнеса, который игровая пресса не уважает."
 JAP_electronics.321.a: "Вложитесь в игровые автоматы"
 JAP_electronics.321.b: "Оставайтесь издателем программного обеспечения."
 JAP_electronics.322.t: "Коллекция драконов"
 JAP_electronics.322.d: "Карточная игра Konami на GREE приносит на одного разработчика больше дохода, чем любая консольная команда в компании, и на её создание ушло несколько месяцев, а не лет. Перевод студий на социальные и мобильные платформы следует за деньгами. Для поддержания финансирования консольных команд необходимо извлекать средства из коротких проектов для оплаты долгосрочных."
 JAP_electronics.322.a: "Перенесите разработку в сферу социальных сетей и мобильных приложений."
 JAP_electronics.322.b: "Обеспечьте финансирование команд, занимающихся разработкой консольных игр."
 JAP_electronics.323.t: "Кодзима уходит"
 JAP_electronics.323.d: "Konami завершила работу над Metal Gear Solid V, отменила Silent Hills и может распустить студию, создавшую обе игры, и убрать имя режиссера с обложки. Президент уже публично заявил, что будущее бизнеса — за мобильными играми. Сохранение студии означает финансирование продюсера, затраты на которого превышают прибыль подразделения."
 JAP_electronics.323.a: "Расформировать студию и удалить упоминание в титрах."
 JAP_electronics.323.b: "Сохраните за собой студию и авторские права."
 JAP_electronics.324.t: "eFootball"
 JAP_electronics.324.d: "Konami переработала Pro Evolution Soccer в формате бесплатного сервиса и выпустила его в состоянии, которое, по мнению её собственных игроков, было ниже, чем у любой другой игры на платформе. Каталог игр Silent Hill, Metal Gear и Castlevania лежит без дела, и его переиздание требует реальных денег. А вот работа сервисов и фитнес-клубов приносит прибыль без подобных рисков."
 JAP_electronics.324.a: "Профинансируйте снова весь старый каталог."
 JAP_electronics.324.b: "Управляйте службами и клубами."
 JAP_electronics.325.t: "Во что превратилась компания Konami"
 JAP_electronics.325.d: "Двадцать пять лет выбора между директорами, кабинетами и телефоном определили, что представляет собой Konami и что экспортирует японская индустрия развлечений."
 JAP_electronics.325.a: "Восстановленные студии разработки"
 JAP_electronics.325.b: "Издательство, занимающееся переизданием и возрождением старых произведений."
 JAP_electronics.325.c: "Оператор развлекательных и фитнес-центров"
 JAP_electronics.325.e: "Бизнес по лицензированию мобильных устройств"
 JAP_konami_restored_development_houses: "Восстановленные студии разработки"
 JAP_konami_restored_development_houses_desc: "Konami снова финансирует директоров и выпускает игры, которые эти директора хотят создавать. Это обходится дороже, чем когда-либо обходился мобильный бизнес, и именно поэтому название компании известно всем за пределами Японии."
 JAP_konami_remake_publisher: "Издательство, выпускающее ремейки и возрожденные произведения"
 JAP_konami_remake_publisher_desc: "Konami перерабатывает то, что уже имеет, для тех, кто играл в игру впервые. Каталог игр ограничен, а аудитория пока ещё не сформирована."
 JAP_konami_amusement_fitness_operator: "Оператор развлекательных и фитнес-центров"
 JAP_konami_amusement_fitness_operator_desc: "Игровые автоматы Pachislot, аркадные залы и крупнейшая в Японии сеть фитнес-клубов — все это построено на территории и оборудовании, полностью принадлежащих Konami. Игры являются лицензионным подразделением физического бизнеса."
 JAP_konami_mobile_licensing: "Бизнес по лицензированию мобильных устройств"
 JAP_konami_mobile_licensing_desc: "Konami сдаёт в аренду Yu-Gi-Oh!, Metal Gear и Silent Hill тем, кто захочет их разрабатывать, и получает прибыль на определённых условиях. Ничего не создаётся внутри компании, и в этом нет необходимости."
 JAP_electronics.330.t: "Бесплатные модемы на углу"
 JAP_electronics.330.d: "SoftBank может раздавать модемы Yahoo! BB на улицах Токио и продавать широкополосный доступ по цене ниже себестоимости до тех пор, пока не ослабнет контроль NTT над местной сетью. Масаёси Сон рассчитывает терять деньги на каждом абоненте в течение многих лет. Перепродажа линий NTT с наценкой приносит прибыль немедленно и оставляет монополию в том же положении, в котором она находится сейчас."
 JAP_electronics.330.a: "Раздайте модемы и смиритесь с убытками."
 JAP_electronics.330.b: "Перепродавайте действующие линейки услуг."
 JAP_electronics.331.t: "Vodafone Япония"
 JAP_electronics.331.d: "Vodafone продаст свою японскую сеть за 1,75 триллиона иен, и SoftBank сможет занять почти всю эту сумму в кредит, что станет крупнейшей сделкой по выкупу с использованием заемных средств в Японии. Компания покупает национальную мобильную сеть и абонентов. Долг обеспечен бизнесом, которым SoftBank никогда не управлял."
 JAP_electronics.331.a: "Возьмите кредит под залог сети и купите его."
 JAP_electronics.331.b: "Избегайте мобильных устройств."
 JAP_electronics.332.t: "Спринт"
 JAP_electronics.332.d: "SoftBank может заплатить $21,6 млрд за Sprint, третьего американского оператора связи, и унаследовать проект по перестройке сети, стоимость которого никто толком не оценил. Это впервые выведет японскую компанию на американский рынок в таком масштабе. Те же самые капиталовложения внутри страны усугубляют ситуацию, поскольку SoftBank уже управляет существующей сетью."
 JAP_electronics.332.a: "Купите американского перевозчика"
 JAP_electronics.332.b: "Реинвестируйте средства дома"
 JAP_electronics.333.t: "Сто миллиардов долларов"
 JAP_electronics.333.d: "SoftBank может привлечь сто миллиардов долларов, большая часть которых поступит из государственного инвестиционного фонда Саудовской Аравии, и выписать чеки, которые не мог выписать ни один венчурный фонд. Vision Fund сделал бы Масаёси Сона крупнейшим из ныне живущих инвесторов в технологические компании. Инвестирование вне баланса происходит медленнее, требует меньших объемов средств и не подотчетно никому в Эр-Рияде."
 JAP_electronics.333.a: "Привлечь средства из стран Персидского залива"
 JAP_electronics.333.b: "Инвестиции вне баланса"
 JAP_electronics.334.t: "WeWork"
 JAP_electronics.334.d: "Размещение акций WeWork на бирже сорвалось еще на пути к рынку, и SoftBank владеет крупнейшей долей в компании. Спасение компании означает списание многомиллиардных убытков и заявление акционерам о том, что решение было ошибочным. Допущение краха защитит все остальные инвестиции SoftBank и подтвердит все сомнения относительно правильности сделанных ставок."
 JAP_electronics.334.a: "Спасите его и спишите убытки."
 JAP_electronics.334.b: "Пусть оно потерпит неудачу, а остальное защитите."
 JAP_electronics.335.t: "Во что превратилась компания SoftBank"
 JAP_electronics.335.d: "Четверть века заимствований под залог сетей и ставок полученных средств на чужие компании определили, что представляет собой SoftBank и как японский капитал проникает в остальной мир."
 JAP_electronics.335.a: "Глобальная технологическая холдинговая компания"
 JAP_electronics.335.b: "венчурный андеррайтер"
 JAP_electronics.335.c: "Группа внутренних авиаперевозчиков"
 JAP_electronics.335.e: "Реселлер широкополосного доступа"
 JAP_softbank_global_technology_holding: "Глобальный технологический холдинг"
 JAP_softbank_global_technology_holding_desc: "SoftBank владеет операторами связи на двух континентах и миноритарными долями в нескольких сотнях компаний, которыми она не управляет. Стоимость этих долей зависит от того, как рынок оценит их в этом квартале."
 JAP_softbank_venture_underwriter: "Андеррайтер венчурных проектов"
 JAP_softbank_venture_underwriter_desc: "SoftBank выписывает чек, который никто другой не выпишет, и занимает место в совете директоров, которое ему полагается. Прибыль поступает неравномерно, а убытки приходят внезапно."
 JAP_softbank_domestic_carrier_group: "Группа внутренних авиаперевозчиков"
 JAP_softbank_domestic_carrier_group_desc: "Волоконно-оптические сети, частотный спектр и коммутаторы по всей Японии были приобретены за счет заемных средств и погашены за счет абонентской платы. Инфраструктура принадлежит SoftBank, а не компании, которая ею владеет."
 JAP_softbank_broadband_reseller: "Реселлер широкополосного доступа"
 JAP_softbank_broadband_reseller_desc: "SoftBank продает доступ к линиям связи, принадлежащим действующему оператору, и конкурирует исключительно по цене. Маржа невелика, и компании никогда не требовалась помощь."
