 module_futuristic_integrated_missile_radar_control1: "Systèmes d'information de combat futuristes"
 module_naval_adl_1: "Laser de défense ponctuelle I"
 module_naval_adl_1_desc: "Les lasers de défense rapprochée offrent une réponse rapide et précise contre drones et missiles entrants, engageant les cibles à la vitesse de la lumière et sans les contraintes de rechargement des intercepteurs conventionnels.\n\n§GIndice du concepteur : les lasers de défense rapprochée offrent une forte DCA et un fort blindage pour la protection à courte portée. Utile contre les menaces aériennes et missiles avancées, mais coûtent plus de CI et consomment plus de carburant que la défense rapprochée conventionnelle.§!"
 module_naval_adl_2: "Laser de défense ponctuelle II"
 module_naval_adl_2_desc: "Les lasers de défense rapprochée offrent une réponse rapide et précise contre drones et missiles entrants, engageant les cibles à la vitesse de la lumière et sans les contraintes de rechargement des intercepteurs conventionnels.\n\n§GIndice du concepteur : les lasers de défense rapprochée offrent une forte DCA et un fort blindage pour la protection à courte portée. Utile contre les menaces aériennes et missiles avancées, mais coûtent plus de CI et consomment plus de carburant que la défense rapprochée conventionnelle.§!"
 module_naval_adl_3: "Laser de défense ponctuelle III"
 module_naval_adl_3_desc: "Les lasers de défense rapprochée offrent une réponse rapide et précise contre drones et missiles entrants, engageant les cibles à la vitesse de la lumière et sans les contraintes de rechargement des intercepteurs conventionnels.\n\n§GIndice du concepteur : les lasers de défense rapprochée offrent une forte DCA et un fort blindage pour la protection à courte portée. Utile contre les menaces aériennes et missiles avancées, mais coûtent plus de CI et consomment plus de carburant que la défense rapprochée conventionnelle.§!"
 module_naval_adl_4: "Laser de défense ponctuelle IV"
 module_naval_adl_4_desc: "Les lasers de défense rapprochée offrent une réponse rapide et précise contre drones et missiles entrants, engageant les cibles à la vitesse de la lumière et sans les contraintes de rechargement des intercepteurs conventionnels.\n\n§GIndice du concepteur : les lasers de défense rapprochée offrent une forte DCA et un fort blindage pour la protection à courte portée. Utile contre les menaces aériennes et missiles avancées, mais coûtent plus de CI et consomment plus de carburant que la défense rapprochée conventionnelle.§!"
 module_naval_railgun_battery_1: "Batterie de canons à rail I"
 module_naval_railgun_battery_1_desc: "Les batteries de canons électromagnétiques utilisent l'accélération électromagnétique pour tirer des projectiles à haute vitesse, offrant une perforation exceptionnelle contre les navires de surface tout en fournissant un puissant bombardement terrestre à longue portée.\n\n§GIndice du concepteur : les batteries de canons électromagnétiques combinent attaque de canon, missiles antinavires et forte perforation de canon pour le combat de surface et le bombardement côtier. Puissantes sur les grands combattants, mais exigent beaucoup de CI, de main-d'œuvre et de ressources stratégiques.§!"
 module_naval_railgun_battery_2: "Batterie de canons à rail II"
