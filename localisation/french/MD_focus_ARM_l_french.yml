l_french:
 armenia_focus: "Priorités nationales arméniennes"
 ARM_Kocharjan: "§YL'ère de Kotcharian§!"
 ARM_Kocharjan_desc: "After his predecessor Levon Ter-Petrosyan was ousted as President, Kocharyan was elected as Armenia's second President, defeating his main rival, Karen Demirchyan (who was a former leader of Soviet Armenia), in an early presidential election marred by irregularities and violations by both sides as reported by international electoral observers."
 ARM_manifestation_power: "Manifestation du pouvoir politique"
 ARM_manifestation_power_desc: "Pour prouver que notre rôle dans la gouvernance du pays ne sera pas ébranlé, nous devons démontrer notre volonté et soumettre l'appareil d'État."
 ARM_place_agreement: "Accords locaux"
 ARM_place_agreement_desc: "Pour renforcer l'emprise de Kocharyan sur le pays, nous devons négocier discrètement avec les politiciens, les fonctionnaires et certains députés de la région."
 ARM_confrontation_mafia: "Confrontation avec la mafia"
 ARM_confrontation_mafia_desc: "La mafia arménienne, qui a de nombreux liens avec les criminels russes, a trop d'influence sur ce qui se passe en Arménie. Nous devons changer cela."
 ARM_liquidation_bosses: "Élimination des parrains"
 ARM_liquidation_bosses_desc: "La mafia est faible. Le temps est venu de décapiter l'hydre avec un coup de grâce de la justice."
 ARM_installing_loyal: "Installez le vôtre"
 ARM_installing_loyal_desc: "Bien que coûteuse à court terme, la consolidation du pouvoir de Kotcharian exige l'épuration de l'appareil d'État de tout dissident. Il n'y a rien à négocier avec eux."
 ARM_suppress_opposition: "Supprimer l'opposition"
 ARM_suppress_opposition_desc: "L'opposition est trop active en raison d'influences extérieures en Arménie. Il est temps d'appliquer des mesures fermes et de procéder à quelques arrestations ciblées pour freiner son élan."
 ARM_deals_with_bandits: "Accords avec la mafia"
 ARM_deals_with_bandits_desc: "Les milieux criminels d'Arménie, bien qu'ils aient tendance à sévir et à violer systématiquement la loi, influencent largement ce qui se passe en Arménie. Peut-être ne devrions-nous pas les combattre, mais vassaliser le banditisme et le rendre profitable pour nous-mêmes."
 ARM_domination_over_bandits: "Dominer les bandits"
 ARM_domination_over_bandits_desc: "Bien que nous ayons décidé de négocier avec les bandits, nous ne devons pas leur donner trop de pouvoir. Kotcharian doit établir son contrôle sur eux."
 ARM_autocrats_power: "Pouvoir autocratique"
 ARM_autocrats_power_desc: "Finalement, Kocharyan n’a aucun obstacle dans son domaine politique."
 ARM_Zhirayr_Sefilyan: "§YPôle national-démocrate§!"
 ARM_Zhirayr_Sefilyan_desc: "Jirair Sefilian est un commandant militaire et un activiste politique arménien. Pendant la première guerre du Nagorny-Karabakh, il a commandé le bataillon militaire spécial de Shushi. Il a longtemps fait campagne contre toute concession territoriale à l'Azerbaïdjan dans le Haut-Karabakh et contre l'influence russe en Arménie. Sefilian est l'une des figures clés du parti panarménien Sasna Tsrer."
 ARM_protectorate: "Bulwark caucasien"
 ARM_protectorate_desc: "L'OTAN a envie de se rapprocher de la Russie, et bien qu'ils aient déjà la Turquie, nous pouvons les rapprocher encore plus. Bien sûr, nos conditions seront que les membres de l'OTAN garantissent notre indépendance nationale."
 ARM_mobilization_of_economy: "Mobilisation de l'économie"
 ARM_mobilization_of_economy_desc: "In order to rebuild the country anew, it is necessary to mobilize the economy and use all our small resources to triple economic indicators."
 ARM_army: "L'armée dans une nouvelle ère"
 ARM_army_desc: "After the end of the Artsakh War, the Armenian army, which had proven itself, experienced a significant decline, which began even after the collapse of the Soviet Union. Thanks to the Soviet legacy, as well as a large-scale militia, the Armenians managed to defeat Azerbaijan and establish a precarious balance in the region. Old doctrines, as well as outdated weapons, ossified generals and economic problems put an end to the development of the armed forces. The main way of development is the continuation of cooperation with Russia, as well as with other neighbors and partners in the CSTO. However, some military experts insist on a complete overhaul of the military doctrine and structure of the army along the Western lines. Armenia, being in a diplomatically advantageous position, can try to take the best from each side, or take a clear course of cooperation with certain forces. Even without significant resources, Armenia has great potential if it can correctly distribute its priorities."
 ARM_dashnak: "§YDashnaktsutyun§!"
 ARM_dashnak_desc: "La seule force politique habilitée à gouverner l'Arménie est sans conteste le Dachnaktsoutioun, le plus ancien parti d'Arménie, qui a dirigé la Première République d'Arménie dès sa création. Seul son programme nationaliste de gauche peut mener l'Arménie vers la grandeur."
 ARM_monarch: "§YRestauration de la monarchie§!"
 ARM_monarch_desc: "Aucun militaire, aucun parti ni aucune autre personnalité n'a le droit de diriger le pays. Le dirigeant le plus légitime ne peut être qu'un monarque dont l'approche paternaliste peut conduire l'Arménie à la grandeur."
 ARM_Tsarukyan: "§GTsarukyan§!"
 ARM_Tsarukyan_desc: "Gagik Tsarukyan est un homme d'affaires, homme politique et ancien athlète arménien. Tsarukyan est le fondateur et le dirigeant du parti politique Arménie prospère. Il possède également plusieurs grandes entreprises et est considéré comme l'un des hommes les plus riches d'Arménie."
 ARM_patriotism: "Patriotisme"
 ARM_patriotism_desc: "Le patriotisme arménien est abstrait. Beaucoup cherchent leur patrie dans une brume, dans le brouillard mystique, mais elle est si proche de nous et a tellement besoin de notre attention, de notre dévotion, de notre admiration. Pour beaucoup, l'Arménie n'est qu'une idée, une amnésie, Sion, un autel. L'Arménie a besoin d'un patriotisme concret et vivant. La patrie est pour l'homme, et non l'homme pour la patrie."
 ARM_berkut: "Où est notre Berkut ?"
 ARM_berkut_desc: "La société de sécurité privée arménienne Berkut a (bizaremment) toujours été une unité lourdement équipée, composée d'anciennes figures criminelles et d'anciens militaires. Cela vaut peut-être la peine de la placer dans les régions."
 ARM_remove_competitors: "Éliminer les concurrents"
 ARM_remove_competitors_desc: "Only Tsarukyan can do business in Armenia. It is his realm and other oligarchs either must obey, or else."
 ARM_hard_way: "La manière dure"
 ARM_hard_way_desc: "Si quelqu'un refuse d'obéir au nouveau gouvernement, nous l'y contraindrons. Il faudra emprunter la voie difficile du vol des affaires aux dissidents indisciplinés."
 ARM_Group: "Gouvernement de Multi"
 ARM_Group_desc: "Multi Group concern was founded in 1998 on the initiative of Gagik Tsarukyan. The development process and intensive activity of the concern began in 2001, when the concern was created and many large companies were involved in it. The concern regularly ranks in the top ten of the list of Armenia's largest taxpayers."
 ARM_buy_small_business: "Les racheter"
 ARM_buy_small_business_desc: "Nous devons acheter toutes les petites entreprises des mains des spéculateurs de la classe moyenne. Nous devons franchir cette étape pour atteindre la Corporatocratie."
 ARM_sports_promotion: "Développer le sport"
 ARM_sports_promotion_desc: "Nous devons développer notre sport et le promouvoir partout où nous le pouvons !"
 ARM_pooling_capital: "Mise en commun des capitaux"
 ARM_pooling_capital_desc: "Il est temps de fusionner tous les capitaux et d'en tirer un bon profit."
 ARM_savoya: "Maison de Savoie"
 ARM_savoya_desc: "The last royal family of Armenia was the Lusignan family. When in 1375 the Kingdom of Cilicia was destroyed, the last king Levon VI (Leo VI) passed the title of King of Armenia to James I (Hakob I), King of Cyprus, who was from the same Lusignan family. In 1485, Queen Charlotte passed the title to her cousin Charles the Warrior, Duke of Savoy (in Italy)."
 ARM_monopoly: "Corporatocratie complète"
 ARM_monopoly_desc: "Désormais, Multi Group doit contrôler toutes les structures gouvernementales. Quelle excellente idée !"
 ARM_bagratuni: "Prétendant Bagratuni ?"
 ARM_bagratuni_desc: "The Bagratuni or Bagratid dynasty is an Armenian royal dynasty which ruled the medieval Kingdom of Armenia. Originating as vassals of the Kingdom of Armenia of antiquity, they rose to become the most prominent Armenian noble family during the period of Arab rule in Armenia, eventually establishing their own independent kingdom. They are also the progenitors of the Georgian royal Bagrationi dynasty. However, Roland von Bagratuni did not fully prove his descendancy from the Bagratuni dynasty, which brings many concerns to the members of the Meliq Union."
 ARM_triump_revolution_barhat: "§4Triomphe de la révolution de velours§!"
 ARM_triump_revolution_barhat_desc: "Nikol Pashinyan a pris le pouvoir en Arménie dans la foulée de la Révolution de velours."
 arme.51.d: "[GEO.GetNameWithFlag] La Fédération révolutionnaire arménienne veut se réconcilier avec nous"
 arme.51.t: "[GEO.GetNameWithFlag] Lettre de l'ARDF"
 arme.51.a: "Merveilleux !"
 arme.52.t: "[GEO.GetNameWithFlag] Coopération Arménie-Russie-Iran"
 arme.52.d: "[GEO.GetNameWithFlag] a rejeté notre proposition d’amitié et d’échange."
 arme.52.a: "Nous devons abandonner nos tentatives de nous lier d'amitié avec la Géorgie"
 arme.53.t: "[ARM.GetNameWithFlag] Demande un accès à la mer Noire !"
 arme.53.d: "Recently, the Armenian government showed a will to pay us for access to the Black Sea. Should we agree to their offer?"
 arme.53.a: "Bien sûr"
 arme.53.b: "Malheureusement, non."
 arme.2.t: "Attentat contre le président du Haut-Karabakh"
 arme.2.d: "La tentative d'assassinat d'Arkadi Ghukasian a montré que tout le monde n'accepte pas sa politique. Vers une heure du matin, la voiture du président a été la cible de tirs provenant d'une embuscade tendue à seulement 200 mètres de la résidence. Les terroristes ont ouvert un feu croisé des deux côtés simultanément. Ghukasian a été blessé aux jambes, et deux de ses gardes ont été grièvement blessés."
 arme.2.a: "C'est affreux !"
 arme.2.b: "Confrontation caucasienne."
 arme.2.c: "Il faut mettre fin au banditisme."
 arme.2.o1: "C'est dommage qu'ils ne l'aient pas tué !"
 arme.3.t: "Les communistes de Transcaucasie se sont unis pour former le « Pont Rouge »."
 arme.3.d: "Samedi, les communistes d'Azerbaïdjan, d'Arménie et de Géorgie se sont à nouveau unis. Au cours de la réunion des hauts dirigeants des partis communistes de Transcaucasie, qui a eu lieu au Pont rouge (l'endroit où les frontières des trois républiques se rejoignent), un protocole a été signé sur la création de l'organisation communiste publique arméno-azerbaïdjano-géorgienne « Pont rouge - Fraternité et amitié ». « Les communistes sont la seule force capable de régler tous les conflits dans la région », a déclaré le camarade Georgadze."
 arme.3.a: "Les communistes sont en train de comploter quelque chose."
 arme.3.b: "L'inertie du siècle dernier."
 arme.3.c: "Ils perdent leur temps."
 arme.3.o1: "Qu’espèrent-ils ?"
 arme.5.t: "Résultats de l'enquête"
 arme.5.d: "Les enquêteurs n'arrivent pas à identifier le véritable commanditaire de l'attaque, et toutes les preuves, d'une manière ou d'une autre, mènent soit à nous, soit à d'anciens membres du parti Dashnaktsutyun. Dans tous les cas, nous devons clore cette affaire démonstrative avant qu'elle n'aille trop loin. Mais que dirons-nous dans le rapport ?"
 arme.5.a: "Clôturez simplement l'affaire."
 arme.5.b: "Euh, accusez les Dashnaks !"
 arme.9.t: "Projet de l'Avenue du Nord"
 arme.9.d: "L'Avenue du Nord est un projet d'avenue piétonne que nous devons construire afin d'attirer des investissements et potentiellement générer beaucoup de revenus. Cependant, la question est : que devons-nous faire des anciens bâtiments et de leurs résidents ?"
 arme.9.a: "Compenser partiellement les pertes"
 arme.9.b: "Compenser entièrement les pertes"
 arme.50.t: "[ARM.GetNameWithFlag] Propose un accord commercial !"
 arme.50.d: "[ARM.GetNameWithFlag] a récemment proposé un accord d'amitié et de commerce entre nos deux pays. Devons-nous accepter cette proposition ?"
 arme.10.t: "Accord de propriété contre dette"
 arme.10.d: "L'Arménie a accepté de nous fournir des biens en échange de l'annulation de nos dettes d'État. L'Arménie était le seul pays dont nous n'avons pas annulé les dettes d'État en prévision de pressions futures, et cela a joué un rôle."
 arme.10.a: "Merveilleux !"
 arme.101.t: "[PER.GetNameWithFlag] D'accord !"
 arme.101.d: "Un accord de défense secrète a été signé."
 arme.101.a: "Super!"
 arme.102.t: "[PER.GetNameWithFlag] Refuse !"
 arme.102.d: "L’accord de défense secrète n’a pas été signé."
 arme.102.a: "Eh..."
 arme.103.t: "Rébellion au Kurdistan"
 arme.103.d: "Les Kurdes se sont rebellés dans leurs régions de résidence situées sur le territoire de notre pays, et ont manifestement bénéficié de l'aide d'un étranger. Nos services de renseignement rapportent qu'il s'agissait d'une activité des services spéciaux arméniens."
 arme.103.a: "L'Arménie paiera pour cela"
 arme.12.t: "Contacter les oligarques"
 arme.12.d: "Lors du congrès suivant, où se déroulent les discussions entre le gouvernement et les oligarques, Gagik Tsarukyan a proposé de nous aider à établir un contrôle sur l’opposition en créant une coalition informelle entre les partis."
 arme.12.a: "Bien sûr!"
 arme.13.t: "L’opposition affaiblie !"
 arme.13.d: "Les organisations d'opposition et les bureaucrates déloyaux sont purgés de notre pays et l'opposition est considérablement affaiblie, ce qui nous est très utile dans notre situation. Le règne de Kotcharian se prolonge, pour l'instant."
 arme.13.a: "Très bien..."
 arme.131.t: "[USA.GetNameWithFlag] Agrees!"
 arme.131.d: "We were able to get the payments because the [USA.GetNameWithFlag] government is confident that we are fully prepared for it"
 arme.131.a: "Bien"
 arme.132.t: "[USA.GetNameWithFlag] Rejected Our Proposal"
 arme.132.d: "Our government has not made all the necessary reforms to get the [USA.GetNameWithFlag] to agree"
 arme.132.a: "Mmh."
 arme.14.t: "[ARM.GetNameWithFlag] Joins the §GUnion State!§!"
 arme.14.d: "Récemment, le président arménien Robert Kotcharian a décidé de rejoindre le projet d’État de l’Union et de s’unir à nous et aux autres États membres !"
 arme.14.a: "Merveilleux !"
 arme.4.t: "Enquête sur l'attentat de 1999"
 arme.4.a: "Ouais, bien sûr..."
 ARM_develop_infrusture: "Impact de la construction des autoroutes"
 ARM_build_house: "Construction d'impact de nouveaux bâtiments"
 ARM_build_factory: "Choc du secteur de la construction"
 AZE_karabakh_defeat: "Défaite dans la guerre du Karabakh"
 AZE_karabakh_defeat_desc: "The defeat in the war of the 90s was a sore wound for our nation. Azerbaijanis crave revenge in order to return their historical lands, as well as return thousands of refugees to their homes."
 AZE_karabakh_revanchism: "Le revanchisme du Karabakh"
 AZE_karabakh_revanchism_desc: "Le peuple azerbaïdjanais, qui a perdu la guerre de l'Artsakh avec un grand soutien international, est resté humilié sur la scène internationale, et le peuple, aveuglé par l'échec, est de plus en plus enclin au nationalisme et à rejoindre les forces armées."
 ARM_high_emigration_5: "Niveau d'émigration énorme"
 ARM_high_emigration_5_desc: "Avec l'effondrement de l'URSS et la détérioration de la situation économique, de nombreux pays de la CEI sont devenus otages d'une migration externe accrue. Dans les réalités d'aujourd'hui, l'Arménie est menacée d'extinction, ce que l'on ne peut pas dire de son voisin oriental et principal ennemi politique. La résolution de la question démographique doit devenir l'agenda principal de la politique arménienne.\n§W--------------§!\nCet esprit national §Gs'améliorera§! si notre §HPIB§! dépasse §H$20B§! et que la stabilité est d'au moins §H15%§!."
 ARM_high_emigration_4: "Niveau substantiel d'émigration"
 ARM_high_emigration_4_desc: "Avec l'effondrement de l'URSS et la détérioration de la situation économique, de nombreux pays de la CEI sont devenus otages d'une migration externe accrue. Dans les réalités d'aujourd'hui, l'Arménie est menacée d'extinction, ce que l'on ne peut pas dire de son voisin oriental et principal ennemi politique. La résolution de la question démographique doit devenir l'agenda principal de la politique arménienne.\n§W--------------§!\nCet esprit national §Gs'améliorera§! si notre §HPIB§! dépasse §H$30B§! et que la stabilité est d'au moins §H24%§!."
 ARM_high_emigration_3: "Niveau élevé d'émigration"
 ARM_high_emigration_3_desc: "Avec l'effondrement de l'URSS et la détérioration de la situation économique, de nombreux pays de la CEI sont devenus otages d'une migration externe accrue. Dans les réalités d'aujourd'hui, l'Arménie est menacée d'extinction, ce que l'on ne peut pas dire de son voisin oriental et principal ennemi politique. La résolution de la question démographique doit devenir l'agenda principal de la politique arménienne.\n§W--------------§!\nCet esprit national §Gs'améliorera§! si notre §HPIB§! dépasse §H$40B§! et que la stabilité est d'au moins §H24%§!."
 ARM_high_emigration_2: "Faible niveau d'émigration"
 ARM_high_emigration_2_desc: "Avec l'effondrement de l'URSS et la détérioration de la situation économique, de nombreux pays de la CEI sont devenus otages d'une migration externe accrue. Dans les réalités d'aujourd'hui, l'Arménie est menacée d'extinction, ce que l'on ne peut pas dire de son voisin oriental et principal ennemi politique. La résolution de la question démographique doit devenir l'agenda principal de la politique arménienne.\n§W--------------§!\nCet esprit national §Gs'améliorera§! si notre §HPIB§! dépasse §H$50B§! et que la stabilité est d'au moins §H34%§!."
 ARM_high_emigration_1: "Émigration très faible"
 ARM_high_emigration_1_desc: "Avec l'effondrement de l'URSS et la détérioration de la situation économique, de nombreux pays de la CEI sont devenus otages d'une migration externe accrue. Dans les réalités d'aujourd'hui, l'Arménie est menacée d'extinction, ce que l'on ne peut pas dire de son voisin oriental et principal ennemi politique. La résolution de la question démographique doit devenir l'agenda principal de la politique arménienne.\n§W--------------§!\nCet esprit national §Gs'améliorera§! si notre §HPIB§! dépasse §H$60B§! et que la stabilité est d'au moins §H44%§!."
 ARM_immigration: "Immigration positive"
 ARM_victory_karabakh: "Victoire dans la guerre du Karabakh"
 ARM_victory_karabakh_desc: "La victoire dans la guerre du Haut-Karabakh a renforcé le sentiment national des Arméniens et a permis à de nombreuses personnes originaires de l'Artsakh d'occuper des postes élevés dans le gouvernement arménien. Dans le même temps, elle a ôté toute motivation à poursuivre le développement militaire et politique."
 ARM_armenian_mafia_6: "Mafia arménienne"
 ARM_armenian_mafia_4: "La mafia a subi des pertes"
 ARM_armenian_mafia_3: "Accords avec la mafia"
 ARM_armenian_mafia_2: "Domination sur la mafia"
 ARM_mafia_strikes_back: "La mafia contre-attaque"
 ARM_loyal_in_power: "« Nos » personnes au pouvoir"
 ARM_loyal_in_power_desc: "Now the regional authorities are under Kocharyan's control. However, for the sake of political power, the fight against corruption is becoming increasingly impossible.\n§W--------------§!\nThis national spirit will be §RRemoved§! if Robert Kocharyan is no longer our leader."
 ARM_deals_with_bandits_3: "Accords avec des bandits"
 ARM_deals_with_bandits_3_desc: "Au lieu de lutter contre la mafia, nous allons établir des relations, réduire la pression sur les petites entreprises et commencer à contrôler les flux de trésorerie importants."
 ARM_deals_with_bandits_2: "Domination sur les bandits"
 ARM_deals_with_bandits_2_desc: "Maintenant, la mafia ne pourra pas s'opposer à nous. Nous contrôlons la circulation de l'argent dans le pays, ce qui nous donne la possibilité d'utiliser tous les leviers d'influence sur l'oligarchie."
 ARM_deals_with_bandits_1: "Séparation des sphères d'influence"
 ARM_deals_with_bandits_1_desc: "Nous avons partagé les sphères d'influence avec les autorités de la mafia arménienne. Nous avons laissé les bandits continuer à exister, mais nous nous sommes débarrassés de l'ennemi intérieur."
 ARM_scince_poten_idea: "Potentiel scientifique"
 ARM_gaz_energy_problems: "Problèmes d'approvisionnement en gaz et en électricité"
 ARM_unistrim_idea_debuf: "Absence de système de transaction"
 ARM_unistrim_idea_debuf_desc: "Après l'effondrement de l'URSS et de ses liens économiques et de transport à l'ère du développement numérique, l'Arménie reste à la périphérie du commerce mondial, sans système de transfert d'argent numérique."
 eastern_church_arm: "Église apostolique arménienne"
 eastern_church_eth: "Église orthodoxe éthiopienne"
 eastern_church_eth_desc: "The Ethiopian Orthodox Church is one of the Ancient Eastern (pre-Chalcedonian) churches. Until 1959, it was an autonomous church, in canonical dependence on the Coptic Church, after which it received autocephaly. Like other Ancient Eastern churches, it recognizes three Ecumenical Councils and professes Miaphysite Christology. It has its own Ethiopian rite, as well as a special hierarchical structure of the clergy that has no analogues in other church traditions."
 arme.4.d: "Notre gouvernement a lancé une enquête officielle sur l'attentat terroriste perpétré contre le Parlement en 1999. Afin de ne pas provoquer trop de troubles, l'affaire est confiée à des enquêteurs semi-indépendants. Voyons ce qu'ils en pensent."
