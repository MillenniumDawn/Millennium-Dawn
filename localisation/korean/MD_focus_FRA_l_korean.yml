 FRA_PS: "사회당"
 FRA_PS_desc: "프랑수아 미테랑 아래 에피네 대회에서 재창당된 사회당은 프랑스 좌파의 지배 세력으로서 공산당을 앞질렀으며, 그 후 줄곧 공화 우파와 번갈아 집권해 왔습니다. 우리의 지지 기반은 넓고 대부분의 계층에 걸쳐 있으며, 엘리제궁으로의 복귀는 시간문제일 뿐입니다."
 FRA_UDF_LREM: "중도 연합"
 FRA_UDF_LREM_desc: "1978년 발레리 지스카르 데스탱을 지지하기 위해 결성된 프랑스 민주 연합은 단일 정당이 아니라 자유주의자, 기독교 민주주의자, 급진주의자의 연합체입니다. 20년 동안 소수 파트너로 밀려나 있었던 우리는 독자적으로 집권하는 중도를 건설하고자 합니다."
 FRA_LR: "공화 우파"
 FRA_LR_desc: "드골주의 우파는 제5공화국만큼이나 오래되었으며 1995년부터 대통령직을 유지해 왔지만, 실패한 의회 해산으로 큰 대가를 치르고 마티뇽에 사회당 인사를 들여놓게 되었습니다. 우리는 양쪽 측면의 경쟁자들이 우리를 앞지르기 전에 중도우파를 결집시켜야 합니다."
 FRA_RPF: "프랑스 연합"
 FRA_RPF_desc: "샤를 파스쿠아와 필리프 드 빌리에는 주류 우파가 브뤼셀에 지나치게 유화적이라고 판단한 드골주의자들을 위해 1999년 프랑스 연합을 창당했습니다. 오늘날 우리의 영향력은 작지만, 유럽 연합에 양보가 이루어질 때마다 우리의 지지자가 늘어납니다."
 FRA_FN: "국민 전선"
 FRA_FN_desc: "1972년 장마리 르펜을 중심으로 창당된 국민 전선은 다른 모든 정당이 이에 맞서 결속하는 동안 30년 가까이 제도권 정치 밖에 머물러 왔습니다. 방역선이 닳기 시작했으며, 우리는 그것이 무너질 때를 대비하려 합니다."
 FRA_LFI: "굴복하지 않는 프랑스"
 FRA_LFI_desc: "사회당은 중도파에게 수프를 퍼 주며 스스로를 소모했고 두 노선 사이에서 죽어 가고 있습니다. 라 프랑스 앵수미즈는 신자유주의 질서에 맞서는 유일한 진정한 좌파 야당이며, 우리는 그들과 타협을 모색하지 않을 것입니다."
 FRA_EELV: "녹색당"
 FRA_EELV_desc: "생태주의 운동은 1984년부터 프랑스 선거에 출마해 왔지만 한 번도 진지하게 받아들여지지 않았으며, 우리의 지지 기반은 도시 밖으로 거의 확장되지 못했습니다. 시간은 우리가 선거 운동으로 얻을 수 없는 유일한 자원이므로, 다른 정당들을 설득해 전환시키거나 그들을 대체해야 합니다."
 FRA_PCF: "프랑스 공산당"
 FRA_PCF_desc: "프랑스 공산당은 그들이 묶여 있던 소련과 함께 몰락했으며, 우리의 노동자 계층 지지 기반은 극우 또는 기권 쪽으로 흘러가고 있습니다. 이러한 쇠퇴를 되돌리는 것이 우리 앞에 놓인 전부의 과제입니다."
 FRA_friend_eu: "EU와 친선"
 FRA_friend_eu_desc: "유럽 연합에는 우리와 유사한 정당이 이끄는 많은 국가들이 있습니다. 우리는 이러한 이념적 수렴을 활용하여 친유럽 입장이 민족주의에 맞서는 방벽임을 부각시켜야 합니다."
 FRA_eternal_challenge: "영원한 도전자"
 FRA_eternal_challenge_desc: "수십 년 동안 우리는 거리와 의회 양쪽에서 노동자를 지키기 위해 싸운 유일한 정당이었습니다. 우리의 적은 분명합니다. 우익과 극단주의자들입니다. 국민은 우리가 이들에 맞설 것이라고 믿을 수 있음을 알고 있습니다. 우리의 적은 결코 잠들지 않으며, 우리는 이를 기억해야 합니다. 단결한다면 어떤 위협도 물리칠 수 있습니다."
 FRA_eu_federalism: "EU 연방주의"
 FRA_eu_federalism_desc: "다른 나라들은 우리가 유럽 연합으로서 지지하는 가치를 기억해야 합니다. 그 가치를 지키고, 발전시키고, 유럽의 다른 나라들 사이에 퍼뜨리는 것입니다."
 FRA_let_industry: "산업을 떠나보내자"
 FRA_let_industry_desc: "중공업은 시간과 에너지의 낭비입니다. 우리와 같은 세계화된 경제에서는 더 이상 충분히 생산적이지 않습니다. 세계의 새로운 산업 중심지로의 이전을 가로막아서는 안 됩니다. 대신 새로운 형태의 경제인 서비스 부문으로 관심을 돌려야 합니다. 앞으로 몇 년간 사무직이 우리의 주된 초점이 될 것입니다. 이를 우선시함으로써 실업을 줄이고 그들이 창출하는 소득을 늘릴 수 있습니다."
 FRA_finance_minister: "새로운 경제 정책"
 FRA_finance_minister_desc: "변화하는 세계에서 우리 또한 진화하여 경제의 초점을 옮겨야 합니다. 경제 위기는 케인스 경제학의 한계를 드러냈으며, 따라서 우리는 사고방식을 바꿔야 합니다. 그러므로 금융 부문을 위한 다음 경제 프로그램을 선택해야 합니다. 이는 지출을 줄일 수 있게 해 주겠지만, 문제는 누구를 신뢰할 수 있느냐 하는 것뿐입니다."
 FRA_atlantist_drift: "대서양주의로의 표류"
 FRA_atlantist_drift_desc: "NATO는 현존하는 가장 강력한 동맹입니다. 이를 계속 그렇게 유지하려면 우리의 군대 훈련을 개선해야 합니다."
 FRA_greece_eurozone: "유로존의 그리스"
 FRA_greece_eurozone_desc: "그리스는 부채 문제로 잘 알려져 있습니다. 우리는 약간의 자금으로 그들을 도와, 유럽 연합 내 국가들이 서로를 진정으로 아낀다는 것을 보여 줄 수 있습니다."
 FRA_tax_evasion: "탈세와의 전쟁"
 FRA_tax_evasion_desc: "여러 가지 수법으로 세금 납부를 계속 회피하는 사람들이 너무 많습니다. 우리는 이를 막겠다고 약속했으므로 반드시 근절해야 합니다."
 FRA_liberal_turn: "자유주의로의 전환"
 FRA_liberal_turn_desc: "우리는 너무 오랫동안 경제와 금융 부문을 통제하려 해 왔지만, 세계화된 세상에서 자본의 흐름을 통제하기는 점점 어려워지고 있습니다. 그러니 시장이 스스로 규제하도록 두어야 합니다. 대체 무슨 문제가 생기겠습니까?"
 FRA_ease_interventionism: "개입주의 완화"
 FRA_ease_interventionism_desc: "우리는 다른 나라의 전쟁에 국민을 보낼 것이 아니라 유럽 내 외교 관계 개선에 집중해야 합니다. 유럽은 현재 평화의 대륙이며, 주요 지역 강국으로서 모두에게 좋은 본보기를 보여야 합니다."
 FRA_modern_interest: "현대적 이익"
 FRA_modern_interest_desc: "우리는 너무 오랫동안 끊임없이 위기에 처해 있는 비생산적인 계층을 보호하는 데 시간을 써 왔습니다. 이제는 미래를 바라볼 때이며, 미래는 서비스와 기술에 있습니다."
 FRA_cut_with_unions: "노조와의 결별"
 FRA_cut_with_unions_desc: "노동조합은 더 이상 과거만큼 우리나라에 유용하지 않습니다. 이제 그들의 요구에 굴복해서는 안 됩니다. 결국 우리는 그들의 인질이 아닙니다."
 FRA_vigipirate: "보안 강화"
 FRA_vigipirate_desc: "비지피라트 계획은 우리의 국가 안보 및 대테러 경보 체계가 될 것입니다. 이는 정부, 군, 지방 당국, 시민이 참여하는 상설 체계로, 테러 위협을 예측하고 예방하며 국가를 보호하기 위해 설계되었습니다."
 FRA_not_done: "우리는 아직 끝나지 않았다"
 FRA_not_done_desc: "4월 21일은 전례 없는 굴욕이었습니다. 우리 후보는 1차 투표에서 탈락했고 공화국은 우파와 극우파 사이에서 선택을 강요당했습니다. 그러나 투사들은 집으로 돌아가지 않았고, 지부들은 여전히 모이고 있으며, 극좌로 흘러간 유권자들은 달리 갈 곳이 없습니다. 우리는 기층에서부터 다시 세우고, 멀어졌던 노조들과 화해해야 합니다."
 FRA_meet_friends: "친구들과의 만남"
 FRA_meet_friends_desc: "지금은 다른 사회주의 국가들과 만나 현재의 세계 정세와 사회주의로 가는 길을 논의하기 좋은 때입니다."
 FRA_turn_ecology: "생태주의로의 전환"
 FRA_turn_ecology_desc: "녹색당은 다음 총선에서 대가 없이 우리에게 양보하지 않을 것이며, 그 대가는 원자로에 적혀 있습니다. 페센하임을 시작으로 24기를 폐쇄하고, 이번 10년이 끝날 때까지 전력 구성의 절반을 포기해야 합니다. CGT의 에너지 연맹은 이미 자신들의 입장을 분명히 밝혔습니다. 우리는 이 연대가 원전 함대를 내줄 만한 가치가 있는지 결정해야 합니다."
 FRA_military_coop: "군사 협력"
 FRA_military_coop_desc: "NATO와의 긴밀한 협력을 바탕으로, 우리는 다른 나라들을 초청하여 합동 군사 훈련을 실시해야 합니다. 모두가 이익을 얻을 것이며, 우리가 얼마나 단결해 있고 준비되어 있는지를 적들에게 보여 줄 것입니다."
 FRA_party_unity: "당의 단결"
 FRA_party_unity_desc: "모든 전당대회는 똑같이 끝납니다. 계파들이 사흘 동안 논쟁하지만 아무도 이기지 못하고, 모두가 승리를 주장할 수 있도록 밤사이에 종합 동의안이 작성됩니다. 랭스 대회에서는 42표 차이로 우리가 거의 쪼개질 뻔했습니다. 단결은 가능하지만 그것은 장관직과 서기직으로 사야 하며, 그 청구서는 언제나 정실 인사로 치러집니다."
 FRA_strenght_throught_EU: "EU를 통한 강화"
 FRA_strenght_throught_EU_desc: "EU는 민주주의 가치를 대변하며 우리 또한 그렇습니다. 이것만으로도 이 기구를 살아 있게 하고 강하고 안정적으로 유지할 이유가 충분합니다. EU가 무너지면 유럽은 다시 분열될 수 있습니다."
 FRA_stole_voter: "유권자와의 재연결"
 FRA_stole_voter_desc: "탄광 지대와 미디는 한 세기 동안 우리의 땅이었으나 지금은 극우파의 가장 안전한 지역이 되었습니다. 그 유권자들을 훈계하는 것은 효과가 없었습니다. 그들을 되찾으려면 빈손이 아니라 무언가를 들고 찾아가야 합니다. 다시 불을 붙인 용광로, 열린 일자리, 공개적으로 한 산업 공약입니다. 공약을 하고 반드시 지켜야 합니다. 그곳에서 공약을 어기면 한 세대 동안 그 지역을 잃게 될 것이기 때문입니다."
 FRA_ps_lgbt: "LGBT 권리 보장"
 FRA_ps_lgbt_desc: "시민 연대 협약은 처음부터 반쪽짜리 조치에 불과했습니다. 혼인, 입양, 법 앞에서의 부부의 완전한 평등은 우리 유권자들이 기대하는 개혁이며, 우파가 거리에서 맞서 싸우겠다고 공언한 개혁입니다. 라 마니프 푸르 투스는 이미 샹드마르스를 예약하고 있습니다. 우리는 법안을 온전히 밀어붙일 수도 있고, 일부를 덜어내고 평화를 유지할 수도 있습니다."
 FRA_ps_win: "사회주의는 구원받았다"
 FRA_ps_win_desc: "해냈습니다! 우리는 불가능을 이루어 냈습니다. 붕괴 직전과 프랑스 국민 앞, 그리고 역사의 눈앞에서의 굴욕적인 패배를 간신히 피한 끝에 상황을 반전시켰습니다. 적들은 우리가 끝났다고 생각했지만, 우리는 유권자를 되찾고 극단주의의 유혹에서 그들을 멀어지게 했습니다. 우리의 승리는 전 세계에서 사회주의가 안정적이라는 신호입니다. 그러나 우리의 승리는 시작일 뿐이며, 이 경험으로 무장한 우리는 같은 실수를 두 번 반복하지 않을 것입니다."
 FRA_Neither_right_nor_left: "좌도 우도 아닌"
 FRA_Neither_right_nor_left_desc: "우리나라를 발전시키는 가장 좋은 방법은 분열을 조장하는 정치를 멀리하는 것입니다. 지나치게 우파도, 지나치게 좌파도 아닌 중도의 자리를 차지합시다."
 FRA_Get_indecisives: "부동층 공략"
 FRA_Get_indecisives_desc: "좌도 우도 아닙니다. 이 나라에는 투표소까지 걸어갈 만한 가치가 있는 정당을 한 번도 찾지 못한 유권자들이 있으며, 그들의 집 문을 두드려 무엇을 원하는지 묻고자 하는 수천 명의 자원봉사자가 있습니다. 라 그랑드 마르슈는 두 기성 정당 모두에서 그들을 우리에게 데려올 것입니다. 하지만 지역 지부 하나조차 데려오지는 못할 것입니다."
 FRA_abolish_ISF: "ISF 폐지"
 FRA_abolish_ISF_desc: "연대 부유세는 거두는 것은 적고 내보내는 것은 많습니다. 30년 동안 자본은 브뤼셀과 제네바로 빠져나갔고, 세수는 그 이탈을 정당화한 적이 없습니다. 우리는 이를 부동산에만 부과하는 세금으로 대체합니다. 돈은 돌아올 것입니다. 하지만 우리가 부자를 위해 통치한다는 비난 또한 다음 선거 때까지 모든 헤드라인에 따라올 것입니다."
 FRA_Fight_Deficit: "적자와의 전쟁"
 FRA_Fight_Deficit_desc: "우리의 부채는 높습니다. 갚을 수 없는 빚에 익사하고 싶지 않다면 대가를 치르더라도 이와 싸워야 합니다. 국민은 이러한 필요한 조치를 분명 이해할 것입니다."
 FRA_Reconize_Mistakes: "과오 인정"
 FRA_Reconize_Mistakes_desc: "과거 프랑스 지도자들은 식민지 국가들을 매우 부당하게 대했습니다. 우리는 그들의 행위에 대한 대가를 치름으로써 마침내 바로잡아야 합니다. 우리 역사의 이 장을 이제 닫읍시다."
 FRA_Western_policy: "서방 정책"
 FRA_Western_policy_desc: "유럽 연합과 대서양 동맹은 이 대륙의 안전을 지키는 것이며, 그렇지 않은 척해 봐야 우리에게 얻는 것은 없습니다. 동맹국들과의 긴밀한 통합은 브뤼셀에서의 영향력과 워싱턴에서의 호의를 가져다줍니다. 하지만 이는 드골주의자든 민족주의자든 주권주의자들에게 그들이 필요로 했던 유일한 논거, 즉 공화국이 속국이 되었다는 주장을 쥐여 주기도 합니다."
 FRA_independant_Euro: "독립적인 유럽"
 FRA_independant_Euro_desc: "다른 나라들은 통합된 유럽 안에서 우리가 그들의 안정에 대해 과도한 영향력을 추구하지 않는다는 것을 알아야 합니다. 홀로라면 우리 중 일부는 취약할 수 있지만, 함께라면 이러한 문제를 극복할 만큼 강해야 합니다."
 FRA_reduce_tax: "세금 인하"
 FRA_reduce_tax_desc: "주거세는 이를 감당하기 가장 어려운 가구에 가장 무겁게 부과되며, 고용 세액 공제는 부담 경감이 고용에 어떤 효과를 내는지 이미 보여 주었습니다. 우리는 이를 완전히 단계적으로 폐지할 것입니다. 지방 자치체(코뮌)는 세입 기반을 잃게 되므로 국가가 파리에서 이를 보전해 주어야 하며, 프랑스의 모든 시장이 이 문제로 우리에게 서한을 보낼 것입니다."
 FRA_increase_pension_age: "연금 수령 연령 상향"
 FRA_increase_pension_age_desc: "사람들이 좋아하지 않을 수 있지만, 의학의 새로운 돌파구 덕분에 기대 수명이 늘어나는 만큼 우리는 사회 복지 제도를 계속 유지할 재원을 마련해야 합니다. 그러나 점점 늘어나는 노인들의 연금을 부담할 젊은 층은 갈수록 줄어들고 있어 선택의 여지가 없습니다. 이러한 세대 교체의 부족을 보완하기 위해 노동 인구가 더 오래 일하도록 해야 합니다."
 FRA_growing_tensions: "고조되는 긴장"
 FRA_growing_tensions_desc: "우리의 세계는 점점 덜 안전해지고 있으며 유럽에 전쟁이 되돌아올 수도 있습니다. 불시에 당하지 않도록 이에 대비해야 합니다."
 FRA_befriend_china: "중국과의 친선"
 FRA_befriend_china_desc: "중국은 프랑스의 주요 교역 상대국이며, 그들과 유리한 조약을 협상하는 것은 우리의 이익에 크게 부합합니다."
 FRA_nuclear_eu: "EU의 원자력화"
 FRA_nuclear_eu_desc: "원자로는 56기가 있지만 브뤼셀에서는 누구도 이를 친환경이라고 부르려 하지 않습니다. 분류 체계가 지금 작성되고 있으며, 여기서 원자력이 제외되면 우리의 원전 함대 전체가 서류상 부담으로 전락합니다. 베를린과 빈은 우리에게 맞설 것입니다. 프라하, 바르샤바, 헬싱키는 그렇지 않을 것입니다. 우리는 동맹을 구축하고 표결에서 승리하며, 독일이 이를 기억하리라는 점을 감수합니다."
 FRA_reise_tertiary: "3차 산업의 부상"
 FRA_reise_tertiary_desc: "오늘날의 서방 경제는 생산에 관여하는 다양한 주체들을 한데 모으는 서비스 기반 경제입니다. 프랑스도 이러한 경제 전환에서 자기 몫을 해야 하며, 다른 길은 없습니다."
 FRA_reduce_public_service: "공공 서비스 축소"
 FRA_reduce_public_service_desc: "정부 지출을 삭감함으로써 우리는 부채를 다시 줄일 수 있을 것입니다. 사람들은 이를 싫어하겠지만, 우리는 차악을 선택해야 합니다. 나라가 부채 때문에 무너진다면 사회 지출 축소는 그들의 가장 작은 문제일 것입니다."
 FRA_strat_indus: "전략 산업 지원"
 FRA_strat_indus_desc: "우리의 산업이 예전만큼 경쟁력을 갖추지는 못하지만, 없어서는 안 될 산업이 있습니다. 방위 산업이 그중 하나인데, 국방을 다른 나라에 의존할 수는 없기 때문입니다. 프랑스는 늘 자국의 무기를 직접 생산해 왔습니다. 따라서 특히 긴장이 고조되는 세상에서 이것이 계속 유지되는 것이 무엇보다 중요합니다."
 FRA_arms_deal: "무기 수출 확대"
 FRA_arms_deal_desc: "우리의 군산 복합체가 훌륭한 무기를 생산한다는 것은 널리 알려진 사실입니다. 그 덕분에 우리는 수년간 주요 무기 수출국 중 하나였습니다. 이 무기 거래는 국제적으로 우리의 힘을 투사할 수 있게 해 줄 뿐 아니라 막대한 돈과 영향력도 안겨 줍니다. 따라서 이는 좋은 일일 수밖에 없습니다."
 FRA_eu_mil: "EU 군비 증강 지원"
 FRA_eu_mil_desc: "우리나라는 유럽에 전쟁이 되돌아오는 상황에 대처할 준비가 비교적 잘 되어 있지만, 모든 유럽 파트너가 그렇다고는 할 수 없습니다. 그들 대부분은 맞서 싸울 가능성이 없습니다. 그들의 안보가 곧 우리의 안보이므로, 그들이 역량을 키울 수 있도록 도와야 합니다."
 FRA_finance_student: "금융 모범생"
 FRA_finance_student_desc: "신자유주의 공식을 완벽하게 적용한 덕분에 우리 경제는 국제적 흐름에 이처럼 긴밀하게 통합된 적이 없었습니다. 이는 다른 나라들의 발전의 혜택을 누리고 전 세계에 투자해 그 결실을 거둘 수 있게 해 주므로 좋은 일입니다."
 FRA_right_left_money: "진정한 중도"
 FRA_right_left_money_desc: "우리나라는 너무 오랫동안 좌우 분열의 인질로 잡혀 있었습니다. 금융과 지정학에서의 모든 진전을 거치며 우리는 질서자유주의의 힘을 입증했습니다. 우리의 역할은 프랑스에서 시장이 번영하도록 하고, 프랑스 국민이 그것이 창출하는 부의 혜택을 누리도록 하는 것입니다."
 FRA_demograph_arms: "인구 재무장 장려"
 FRA_demograph_arms_desc: "훌륭한 인구 증가 캠페인은 우리나라의 미래를 위한 장기 투자입니다."
 FRA_share_eu: "EU와 힘을 공유하다"
 FRA_share_eu_desc: "우리의 적들은 우리가 유럽 연합 회원국의 독립을 지키는 일에 매우 진지하다는 것을 알아야 합니다. 필요하다면 어떤 억압자에게든 우리의 핵무기로 위협할 것입니다."
 FRA_handle: "상황 수습"
 FRA_handle_desc: "그들은 연료세 때문에 왔다가 다른 모든 것을 이유로 눌러앉았습니다. 로터리는 점거되었고, 샹젤리제는 두 번 불탔으며, 플래시볼 탄환은 눈과 헤드라인을 똑같이 앗아 갔습니다. 우리는 시위대 방지법을 통과시켜 무력으로 해산시킬 수도 있고, 국민 토론을 열어 우리에게 없는 100억 유로로 평화를 살 수도 있습니다."
 FRA_startup_nation: "스타트업 국가"
 FRA_startup_nation_desc: "대담한 정책과 저항하는 골족들 앞에서 물러서지 않은 덕분에 우리는 목표를 달성했습니다. 한때 기업가 정신에 적대적이던 사회를 변혁하여 그 발목을 잡던 세금과 규제에서 해방시켰습니다. 혁신과 자유주의의 밝은 미래가 우리 앞에 놓여 있습니다. 그것이 우리의 비전입니다."
 FRA_Neo_gaulism: "신드골주의"
 FRA_Neo_gaulism_desc: "신드골주의는 샤를 드골 장군의 본래 원칙을 현대의 세계화 시대에 맞게 변형한 프랑스의 정치 운동입니다. 그는 국가 주권, 강력한 행정부 대통령제, 외교 정책의 독립성을 강조했습니다."
 FRA_known: "불가피한 정당"
 FRA_known_desc: "제3공화국이 세워지고 안정적인 공화주의가 등장한 이래로 보수주의자들은 늘 존재해 왔습니다. 우리는 그들의 가장 최근의 화신일 뿐입니다. 수십 년 동안 우리는 모든 결선 투표에 진출해 왔습니다. 다음 선거라고 달라질 이유는 없습니다. 우리의 새 천년은 불확실성으로 가득하며, 따라서 우리는 극단주의자들에 맞서 안정과 상식의 목소리가 되어야 합니다."
 FRA_oppose_immigration: "이민 반대"
 FRA_oppose_immigration_desc: "이민자들은 특히 끝없는 전쟁 지역 출신자들이 얼마나 위험할 수 있는지 이미 보여 주었습니다. 우리는 그들이 도착하지 못하도록 조치를 취해야 합니다."
 FRA_continue_liberal: "자유주의 정책 지속"
 FRA_continue_liberal_desc: "우리는 경제 자유화 프로그램을 계속 시행할 것입니다. 경제는 이렇게 할 때 가장 잘 돌아가기 때문입니다."
 FRA_patriotism: "애국심"
 FRA_patriotism_desc: "프랑스 국민은 자신의 국적과 거기에 담긴 역사를 자랑스러워해야 합니다. 그 결과 그들은 국가에 덜 요구하는 데 익숙해져야 합니다. 우리는 더 이상 과거와 같은 관대함을 감당할 수 없습니다. 그들은 국가 편에 서는 법을 배우고 공적 자금을 끊임없이 요구하는 것을 그만두어야 합니다."
 FRA_turn_west: "서방으로의 전환"
 FRA_turn_west_desc: "우리는 대서양 건너 미국의 친구들과의 관계를 개선해야 합니다. 그들의 정치인은 바뀔 수 있지만, 우리는 그들 중 누구도 프랑스에 등을 돌리지 않도록 해야 합니다."
 FRA_third_voice: "프랑스의 제3의 목소리"
 FRA_third_voice_desc: "NATO와 소련의 잔재로 여전히 나뉘어 있는 세계에서 프랑스는 늘 그래 왔듯 자신만의 길을 개척해야 합니다. 우리를 지키러 오지 않을 먼 동맹에 의존할 수는 없습니다. 따라서 동방이든 서방이든 어느 쪽의 억압도 거부하는 이들과 함께 우리 자신의 운명을 만들어 가야 합니다."
 FRA_austerity: "긴축 시행"
 FRA_austerity_desc: "적자는 구조적이며 신용 평가 기관들이 주위를 맴돌고 있습니다. 우리는 삭감할 수 있는 곳을 삭감합니다. 은퇴하는 공무원 두 명당 한 명만 충원하고, 부처를 통합하며, 건설을 미룹니다. 노조는 이를 있는 그대로 규정하고 연금 수령 연령을 놓고 백만 명을 거리로 내보낼 것이며, 좌파는 이 단 하나의 결정에 맞서 한 십 년을 선거 운동에 쓸 것입니다."
 FRA_question_ref: "유럽 통합 가속화"
 FRA_question_ref_desc: "프랑스는 유럽 연합의 창립 기둥 중 하나이지만, 그 국민은 이제 유럽 연합에 가장 회의적인 축에 속합니다. 프랑스인들은 새로운 조약의 도입에 거듭 반대해 왔습니다. 모든 사안마다 그들의 의견을 묻는 것은 유럽 통합 과정을 크게 늦추므로 중단해야 합니다. 많은 이가 이를 불쾌히 여겨 유럽 연합에 더욱 반대하게 될 것이지만, 적어도 우리가 유럽 연합의 발목을 잡는 쪽은 아니게 될 것입니다."
 FRA_nato_integration: "NATO 통합"
 FRA_nato_integration_desc: "이 대륙의 안전을 높이기 위한 또 하나의 걸음입니다. NATO가 없었다면 오늘날 유럽이 어떤 상태일지 누가 알겠습니까."
 FRA_national_indep: "국가 독립"
 FRA_national_indep_desc: "동방과 서방 사이 어딘가의 입장을 취함으로써 프랑스는 자국의 이익을 지킬 수 있으며, 더 이상 워싱턴 관료의 견해를 고려하지 않아도 됩니다."
 FRA_end_proximity_police: "근접 경찰 폐지"
 FRA_end_proximity_police_desc: "경찰은 자신들이 감시해야 하는 사람들과 뒤섞여서는 안 됩니다. 신속 대응 경찰력이 더 비용 효율적일 것입니다."
 FRA_reform_wealth: "복지 국가 개혁"
 FRA_reform_wealth_desc: "프랑스는 너무 오랫동안 복지 국가였습니다. 이제 프랑스 국민이 항상 공적 자금에 의존하지 않고 스스로 살아갈 때입니다."
 FRA_looming_crisis: "다가오는 위기"
 FRA_looming_crisis_desc: "1월에 소시에테 제네랄은 아무도 눈치채지 못하는 사이 트레이더 한 명이 거의 50억 유로를 잃었다는 사실을 발견했습니다. 그것이 경고였습니다. 미국 주택 담보 시장은 더 나쁘고, 우리 은행들은 그에 노출되어 있으며, 덱시아는 이미 곤경에 처했습니다. 우리는 지금 감독 체계를 구축하며 우리 경제를 둔화시킬 수도 있고, 경기 순환을 믿고 희망을 걸 수도 있습니다."
 FRA_defend_interest: "프랑스의 이익 수호"
 FRA_defend_interest_desc: "독립한다는 것은 국내에서든 우리의 이해관계가 있는 곳 어디서든 외세의 영향으로부터 스스로를 지켜야 함을 의미합니다. 프랑스가 위대한 국가로 남도록 이러한 방향으로 조치를 취해야 합니다."
 FRA_lower_expanse: "비생산적 기업 지원 중단"
 FRA_lower_expanse_desc: "경제 활동에 대한 보조금 지급은 갈수록 막대해지는 비용을 수반합니다. 우리는 지출을 면밀히 검토하고 효율적이며 경쟁력 있는 산업에만 보조금을 지급해야 합니다."
 FRA_oppose_lgbt: "워키즘에 맞서다"
 FRA_oppose_lgbt_desc: "전통적 규범에 점점 더 적대적인 사조가 우리 사회에 스며들고 있습니다. 이러한 규범에는 존재 이유가 있으며 언제나 지배적이었습니다. 우리는 이러한 침투를 막아야 합니다."
 FRA_return_rurality: "농촌을 받아들이자"
 FRA_return_rurality_desc: "대도시는 점점 퇴폐와 범죄의 온상이 되고 있습니다. 우리는 시민들이 대도시를 떠나, 비록 덜 풍요롭지만 상식에 더 가까운 지역으로 이주하도록 장려해야 합니다."
 FRA_end_assisted: "의존 문화의 종식"
 FRA_end_assisted_desc: "우리 인구 중 지나치게 많은 비율이 일하지 않고도 받는 무조건적 급여에 의존하고 있습니다. 이러한 상황은 용납할 수 없으며 우리의 재정에 부담을 주고 있습니다. 이러한 급여를 중단해야 하며, 그렇게 하면 사람들이 일자리를 얻게 될 것입니다."
 FRA_hostile_bear: "곰에 대한 적대"
 FRA_hostile_bear_desc: "러시아는 다시 유럽의 이익과 안전에 대한 위협이 되고 있습니다. 최전선 국가들은 동방으로부터의 어떠한 적대 행위에도 스스로를 방어할 준비를 시작해야 합니다."
 FRA_wake_up: "프랑스를 깨우자"
 FRA_wake_up_desc: "퇴폐와 무위의 유혹에서 벗어난 프랑스 국민은 다시 일터로 돌아갈 수 있습니다."
 FRA_eternal_france: "영원한 프랑스"
 FRA_eternal_france_desc: "우리는 우리나라를 그 어느 때보다 강하게 만들었습니다. 외부 위협으로부터의 방어를 강화하고, 내부 문제를 줄였으며, 부채 문제를 덜었습니다. 우리는 나라의 미래를 확보했습니다. 프랑스는 언제나 그곳에 있었고 앞으로도 영원히 있을 것입니다."
 FRA_enought_soc: "사회주의는 이제 그만"
 FRA_enought_soc_desc: "보수 정당으로서 진보주의자들과 사회당은 우리의 주된 적수입니다. 그들은 자유주의 유럽을 옹호하는데, 이는 사람들이 더 이상 원하지 않는 바로 그것이며, 우리는 이로부터 벗어나기 위해 노력할 것입니다. 우리는 안정과 보호를 향한 국민의 열망이 실현되는 수단이 우리이며 앞으로도 영원히 그럴 것임을 보여야 합니다. 우리는 자유주의적 유럽 연합과 진보주의에 반대합니다."
 FRA_sovereignism: "우리의 주권을 묻다"
 FRA_sovereignism_desc: "프랑스 국민은 너무 오랫동안 무시당해 왔습니다. 우리나라의 누구도 유럽 연합이 이 정도 규모로 커지기를 바라지 않았습니다. 조약이든 확대든 국민은 매번 회의적이었고 매번 무시당했습니다. 이제 한 정당이 프랑스의 주권 문제를 다시 제기할 때입니다."
 FRA_sacrifice: "필요한 희생"
 FRA_sacrifice_desc: "우리는 어려운 시기로 접어들고 있으며, 앞에 놓인 험난한 길은 프랑스 국민의 규율과 선의를 요구할 것입니다. 프랑스인들은 프랑스를 위해 희생해야 하는 것은 자신들이지, 그 반대가 아니라는 점을 다시금 배워야 합니다."
 FRA_elder_view: "원로의 시각"
 FRA_elder_view_desc: "전국 저항 위원회는 제2차 세계 대전의 폐허에서 우리나라를 재건하는 데 엄청난 일을 해냈으나, 그 과정에서 미국의 속국이 되었습니다. 그러나 수십 년 전부터 그들의 업적은 앞선 이보다 더 자유주의적인 정치인들에 의해 점차 훼손되어 왔습니다. 우리는 뿌리로 돌아가 장군의 본보기를 따르고, 산업에 투자하며, 수십 년간의 유럽 통합과 탈산업화로 황폐해진 나라를 재건하는 데 착수해야 합니다."
 FRA_neccesity_leaving: "탈퇴의 필요성"
 FRA_neccesity_leaving_desc: "유럽 연합 탈퇴를 향한 우리의 여정은 이제 막 시작되었습니다. 너무 늦기 전에 이 유럽을 떠나야 한다는 점을 국민이 이해하도록 해야 합니다."
 FRA_fight_renouncement: "포기론자들과의 싸움"
 FRA_fight_renouncement_desc: "장군은 다른 유럽 강국들이 미국으로부터 독립적인 유럽을 만들 의지가 있다고 믿지 않았습니다. 그의 말이 옳았습니다. 그가 세상을 떠난 지 수십 년이 지난 지금, 우리의 파트너들은 유럽의 독립을 위해 노력하기보다 미국에 굽실거리며 그들에게서 장비를 사들이는 데 더 몰두하고 있습니다. 우리는 이 하향 나선을 규탄해야 하며, 이것만으로도 미국의 속국인 이 유럽을 떠날 이유가 됩니다."
 FRA_back_gaulism: "전략적 드골주의"
 FRA_back_gaulism_desc: "프랑스는 워싱턴의 의지로부터 독립적인 외교 정책을 가져야 합니다. 누구도 우리의 정치에 간섭하도록 허용해서는 안 되며, 우리를 굴복시키려 늘 애써 온 미국은 더더욱 그렇습니다."
 FRA_social_gaulism: "사회적 드골주의"
 FRA_social_gaulism_desc: "행복한 세계화의 종말과 극단주의의 유혹에 직면하여, 우리는 프랑스 국민을 이성의 길로 되돌려 놓아야 합니다. 사회적 드골주의는 자본주의와 공산주의를 모두 거부합니다. 이는 고용의 독립성과 안정을 보장하기 위한 국가 개입을 수반합니다. 이러한 안정이 있다면 국민은 이 모든 복지 지원이 필요하지 않습니다."
 FRA_return_nation: "국가로의 귀환"
 FRA_return_nation_desc: "해외에서 활동하는 프랑스 기업들이 어떤 수단을 써서라도 본국으로 돌아오도록 장려해야 합니다."
 FRA_anti_eu: "반EU 캠페인"
 FRA_anti_eu_desc: "유럽 연합이 더 이상 창립자들의 이익에 봉사하지 않으며 오히려 그들의 정체성을 침식하려 한다는 사실을 국민이 깨닫기 시작한 지금, 우리는 유럽 연합에 맞선 캠페인을 강화할 수 있습니다. 국민이 자신들의 문제 대부분이 거기서 비롯된다는 점을 이해하도록 해야 합니다."
 FRA_anti_usa: "미국에 대한 적대"
 FRA_anti_usa_desc: "미국은 드골주의가 권력에 복귀하는 것을 못마땅하게 여깁니다. 그들이 우려하는 것은 당연합니다. 우리가 집권하면 우리가 더 이상 그들의 동맹이 아님을 곧 분명히 알게 될 것입니다. 어쨌든 미국에는 동맹이 없고, 무엇보다 이익이 있을 뿐이라는 것은 잘 알려져 있습니다."
 FRA_RPF_death: "사형제 부활"
 FRA_RPF_death_desc: "사형제는 프랑스 대중 대다수의 뜻에 반하여 수십 년 전에 폐지되었습니다. 그 이후 온갖 범죄자들은 국가가 자신들을 결코 제대로 처벌하지 않을 것이라 확신하며 대담해졌습니다. 주권 국가는 자국의 법을 최대한 집행할 수 있어야 합니다. 우리는 이를 부활시킬 것입니다."
 FRA_destroy_liberalism: "경제적 자유주의 타파"
 FRA_destroy_liberalism_desc: "우리의 경제 정책은 너무 오랫동안 혐오스러운 초자유주의에 지배당해 왔습니다. 우리 시민들은 일자리와 산업의 힘이 하나씩 사라지는 것을 지켜보았습니다. 장군은 그 시대에도 이미 인간적 관점에서 자본주의가 나쁜 것이라고 경고했습니다. 우리는 국가 개입으로 되돌아가야 합니다. 공공 재정과 남아 있는 우리 경제의 질서를 회복해야 합니다."
 FRA_campaign_frexit: "프렉시트 캠페인"
 FRA_campaign_frexit_desc: "프랑스인들은 마침내 유럽 연합이 나쁜 것임을 깨달았으며, 이제 남은 일은 그들이 분노를 표출할 수단을 쥐여 주는 것뿐입니다. 프랑스의 해체를 멈추게 하는 데에는 투표함 속의 투표용지 한 장이면 충분합니다."
 FRA_rebalance_foreign_policy: "외교 정책 재균형"
 FRA_rebalance_foreign_policy_desc: "우리는 미국과 결별하겠다는 의사를 분명히 밝혔지만, 우리 정치 계층은 여전히 그들의 정치, 생활 방식, 기업에 침투당해 있습니다. 미국과의 결별이 진짜가 아니라고 생각할 수 있는 이들에게 강력한 메시지를 보내야 합니다. 우리는 미국의 패권에 줄곧 맞서 온 강국들과 대화를 복원할 것입니다."
 FRA_leave_nato: "NATO와의 결별"
 FRA_leave_nato_desc: "독립을 지키기 위해 우리는 한 번도 필요하지 않았고 얻은 것도 거의 없는 동맹에서 벗어나야 합니다. 우리는 스스로 우리의 이익을 지킬 능력이 있습니다."
 FRA_frexit_ref: "프렉시트 국민투표"
 FRA_frexit_ref_desc: "이제 유럽 연합을 영원히 떠날 때가 왔습니다. 우리 국민은 유럽 연합을 영구히 거부할 만큼 충분히 준비되었습니다."
 FRA_strategic_autonomy: "전략적 자율성 확보"
 FRA_strategic_autonomy_desc: "우리는 프랑스의 독립을 회복하는 데 성공했으며, 이 세상에서 원하는 대로 할 자유가 있습니다. 프랑스는 강하고 자유로우며, 우리는 이를 지킬 준비가 되어 있습니다."
 FRA_strong_people: "강한 국민"
 FRA_strong_people_desc: "더 이상 나태를 부추기는 유인은 없으며, 자본주의는 국가의 통제를 받습니다. 우리는 국민과의 사회 계약을 갱신했습니다. 국민은 우리가 그들을 보호하고 있으며 그들이 우리에게 복종과 선의를 빚지고 있음을 알고 있습니다."
 FRA_recover: "경제 재건"
 FRA_recover_desc: "유럽 연합 탈퇴를 준비하기 위한 모든 노력에도 불구하고 우리 경제는 타격을 입었습니다. 억압자들에게 복수할 생각을 하기 전에 먼저 견고한 토대 위에 경제를 재건해야 합니다."
 FRA_our_own_sphere: "우리만의 권역"
 FRA_our_own_sphere_desc: "미국 제국주의에서 벗어나는 데 성공한 것은 우리만이 아닙니다. 독립 강국들 사이의 상호 존중에 기초한 동맹을 만들 동맹국을 찾을 수 있습니다."
 FRA_paid_reconnexion: "유럽 봉쇄"
 FRA_paid_reconnexion_desc: "이제 유럽 연합을 안전하고 성공적으로 탈퇴했으니, 그들에게 되갚을 방법을 생각할 수 있습니다. 유럽 연합과 그 연결망은 우리나라를 통과해야 합니다. 이는 우리에게 복수할 절호의 기회를 제공합니다."
 FRA_certain_idea: "프랑스에 대한 어떤 생각"
 FRA_certain_idea_desc: "불과 몇 년 만에 우리는 프랑스를 본래 있어야 할 모습, 곧 자랑스럽고 자유로운 강대국으로 되돌리는 데 성공했습니다. 장군은 우리가 그의 유산을 복원한 것을 자랑스러워할 것입니다. 그의 말이 옳았습니다. 프랑스는 강대국일 수밖에 없으며, 그렇지 않다면 프랑스가 아닙니다."
 FRA_salvage_mondialisation: "세계화의 피해자 구제"
 FRA_salvage_mondialisation_desc: "우리 국민은 세계화로 인해 큰 고통을 겪었습니다. 특히 일자리가 사라지고 나라가 무너지며 가치가 짓밟히는 것을 지켜본 노동 인구가 그러합니다. 우리가 변화를 가져올 편이며, 올바른 질문을 던질 용기가 있고, 이러한 문제에 대한 아주 단순한 해법을 가지고 있음을 보여 주어야 합니다."
 FRA_raise_tariff: "관세 인상"
 FRA_raise_tariff_desc: "관세를 인상하면 해외의 불공정한 경쟁을 끝내고 프랑스 국민이 프랑스산 제품을 구매할 수 있게 될 것입니다."
 FRA_dynamise_periph: "외곽 지역 활성화"
 FRA_dynamise_periph_desc: "농촌과 교외 지역은 도시 계획 정책에서 늘 소외되어 왔습니다. 투자가 부족하며 불안정한 환경에 살지만 선의로 가득한 주민들이 사는 경우가 많습니다. 우리는 이들이 대도시와 같은 기반 시설을 이용할 수 있도록 도와야 합니다."
 FRA_focus_insecurity: "치안 불안에 집중"
 FRA_focus_insecurity_desc: "이민으로 인해 국내 치안 불안이 크게 증가했습니다. 경찰 인력을 늘리고, 더 엄격한 단속을 시행하며, 범죄를 강력히 단속함으로써 이 문제를 매우 심각하게 받아들이고 있음을 국민에게 보여야 합니다."
 FRA_eurosepticism: "유럽 연합에 대한 위협"
 FRA_eurosepticism_desc: "유럽 연합은 자신들의 초세계주의 정책에 반대하는 우리와 같은 나라들의 입을 막으려 해 왔습니다. 상황이 바뀌어야 하며 우리가 프랑스의 유럽 회의주의 운동에 다시 불을 지필 수 있음을 그들이 이해하도록 해야 합니다."
 FRA_sovergnism_policies: "주권주의 정책"
 FRA_sovergnism_policies_desc: "프랑스는 경제, 외교 정책, 그리고 무엇보다 국경에 대한 통제를 강화해야 합니다. 그렇지 않으면 나라를 다시 일으켜 세우려는 우리의 노력은 헛될 것입니다. 우리나라를 스스로 통치하겠다는 결의를 천명해야 합니다."
 FRA_economical_patriotism: "경제 애국주의"
 FRA_economical_patriotism_desc: "해외로 이전한 프랑스 기업들에 프랑스로 돌아올 것을 촉구해야 합니다. 이를 거부할 경우 프랑스 내 사업 운영에 대한 불이익이 따를 것입니다."
 FRA_social_populism: "사회적 포퓰리즘"
 FRA_social_populism_desc: "유권자 기반을 굳히고 집권을 유지하려면, 국민이 요구하는 것을 주고 그들이 증오하는 대상을 강력히 단속하기만 하면 됩니다."
 FRA_criticize_eu_migrant: "유럽 이민 정책 비판"
 FRA_criticize_eu_migrant_desc: "유럽 연합은 이민자 유입을 막기 위해 충분히 노력하지 않으며 회원국에 이들을 받아들이도록 강요하고 있습니다. 이를 중단시키기 위해 압력을 가해야 합니다."
 FRA_common_accord_eu: "EU와의 협상"
 FRA_common_accord_eu_desc: "유럽 집행위원회는 우리를 무시할 수 없다는 것을 깨달았습니다. 이제 우리가 원하는 것을 주면 우리의 지지를 확보할 수 있음을 그들이 이해하도록 해야 합니다."
 FRA_reinforce_nuke: "핵 역량 강화"
 FRA_reinforce_nuke_desc: "원자력은 그 신뢰성을 입증했습니다. 이러한 전문성을 갖추고 있는데 왜 다른 에너지원으로 눈을 돌립니까? 위기 상황에 대처할 수 있도록 원자력 역량을 확대해야 합니다."
 FRA_FN_death: "사형제 부활"
 FRA_FN_death_desc: "사형제는 수십 년 전에 폐지되었으며 그 이후 강력 범죄는 더욱 대담해지기만 했습니다. 우리 시민들은 자신의 나라에서 다시 안전하다고 느낄 자격이 있습니다. 우리는 이를 부활시킬 것이며, 가장 중한 범죄에는 다시 가장 엄중한 결과가 따를 것입니다."
 FRA_reject_immigration: "이민 거부"
 FRA_reject_immigration_desc: "이제 국경을 더 잘 통제하게 되었으니, 불법 이민을 단속하는 우리의 정책을 시행할 수 있습니다."
 FRA_pro_russian_fn: "친러시아 정책"
 FRA_pro_russian_fn_desc: "EU는 초세계주의를 그치지 않을 것입니다. 우리는 서방의 타락과 늘 거리를 유지해 온 러시아와 가까워져야 합니다. 함께라면 우리는 멀리 갈 것입니다."
 FRA_oppose_lgbt_fn: "워키즘 종식"
 FRA_oppose_lgbt_fn_desc: "어떤 사람들은 우리나라에 입국하도록 허용되어서는 안 됩니다. 이 터무니없는 일을 끝내고 유일하게 올바른 가족 모델에 기반한 질서를 회복하는 데 집중합시다."
 FRA_end_right_soil: "출생지주의 폐지"
 FRA_end_right_soil_desc: "프랑스에서 태어났다는 것만으로 프랑스인이 되어서는 안 됩니다. 우리는 출생지주의 원칙을 끝내야 하며, 누가 프랑스 시민이 될 수 있는지 선택할 자격이 있습니다."
 FRA_support_rus_claim: "러시아의 주장 지지"
 FRA_support_rus_claim_desc: "러시아는 NATO의 확장에 위협을 느낄 모든 권리가 있습니다. 그들이 겪은 부당함을 바로잡도록 돕겠다는 우리의 의지를 보여야 합니다."
 FRA_electoral_reform: "선거 개혁"
 FRA_electoral_reform_desc: "프랑스의 선거는 점점 선거 제도와 정당의 대표성을 둘러싼 논란 속에서 치러지고 있습니다. 우리는 집권을 유지할 수 있도록 우리에게 유리하게 작동하는 방식으로 이러한 개혁을 시행할 수 있습니다."
 FRA_our_identity: "우리의 정체성"
 FRA_our_identity_desc: "유럽과 같은 실체 안에서 민족주의자가 되기는 어렵습니다. 우리는 탈퇴 구상을 포기했으므로, 유럽 연합 내 우리의 위치에 걸맞되 외국인 노동력 속에 우리를 희석시키려 하지 않는 새로운 정체성을 만들어야 합니다."
 FRA_boreal_space: "러시아에 대한 우리의 입장"
 FRA_boreal_space_desc: "우리는 러시아와 협력하려는 의지를 보여 주었고, 우리의 노력은 간과되지 않았습니다. 이제 러시아에서 무엇을 원하는지 결정할 때이며, 그들에게 손을 내밀 때입니다."
 FRA_long_travel: "프랑스의 승리"
 FRA_long_travel_desc: "지난 몇 년간 집권하면서, 우리는 결단력만 있다면 한 나라의 문제가 아주 쉽게 해결될 수 있음을 프랑스 국민에게 보여 주었습니다. 우리는 프랑스를 더 위대하게 만들었고 이웃 나라와 이민자 흐름에 대한 의존을 줄였으며, 이민자 흐름을 억제하는 데 성공했습니다."
 FRA_sound_fury: "소리와 분노"
 FRA_sound_fury_desc: "프랑스 국민은 더 이상 유화책을 원하지 않습니다. 온건파는 그들을 실망시켰고 진정한 변화를 가져온 적이 없습니다. 우리는 변화의 정당이며, 기성 질서에 도전하겠다는 결의를 프랑스 국민에게 보여야 합니다."
 FRA_silent_france: "기권자 동원"
 FRA_silent_france_desc: "많은 시민이 우리 공화국과 그 제도에 대한 신뢰를 잃었습니다. 진정한 변화를 이루기 위해 그들이 다시 투표소로 돌아오도록 장려해야 합니다."
 FRA_end_privatisation: "민영화 중단"
 FRA_end_privatisation_desc: "수익성을 높이기 위해 많은 기업이 계속해서 생산 시설을 프랑스 밖으로 이전했습니다. 이는 실업을 증가시키고 우리의 전문성을 잃게 만들고 있습니다. 필요하다면 이러한 기업들에 대한 통제권을 되찾음으로써 이 출혈을 막아야 합니다."
 FRA_pro_lgbt_lfi: "차별 시정 조치 추진"
 FRA_pro_lgbt_lfi_desc: "잘못 규범으로 여겨지는 것에서 벗어난 사람들이 너무 오랫동안 받아 온 차별을 끝내야 합니다. 우리 사회는 모든 차이를 받아들이는 법을 배워야 합니다."
 FRA_toward_6th_rep: "제6공화국을 향하여"
 FRA_toward_6th_rep_desc: "이제 국민이 우리에게 맡긴 임무에서 가장 중요한 부분을 시작할 수 있습니다. 우리는 변화를 약속했고 국민은 그것을 얻게 될 것입니다. 모두에게 어울리는 새로운 공화국을 빚어낼 때가 왔습니다."
 FRA_distance_nato_lfi: "블록 정치 거부"
 FRA_distance_nato_lfi_desc: "NATO는 모스크바와의 동맹이 우리를 그들의 전쟁에 묶어 놓는 것과 똑같이 우리를 워싱턴의 전쟁에 묶어 놓습니다. 우리는 두 블록을 똑같이 거부합니다. 진정한 비동맹이야말로 독립된 프랑스에 걸맞은 유일한 외교 정책입니다."
 FRA_oppose_eu_treaty: "EU 조약 반대"
 FRA_oppose_eu_treaty_desc: "불공정한 조약이 우리 시민들에게 강요되어 왔습니다. 우리에게는 이를 준수할 의무가 없습니다. 이 불공정한 유럽을 바꾸려면 먼저 그 법적 틀에 이의를 제기하는 것에서 시작해야 합니다."
 FRA_guarante_employment: "고용 보장"
 FRA_guarante_employment_desc: "우리나라에는 위기로 인한 일자리 부족으로 잠재력을 발휘하지 못하는 재능 있는 사람들이 가득합니다. 우리는 모든 사람에게 안정적이고 품위 있는 일자리를 보장해야 하며, 이것이 모든 사회 계약의 토대가 되어야 합니다."
 FRA_state_power: "국가의 권력"
 FRA_state_power_desc: "제5공화국의 제도는 공화국 대통령직에 지나치게 집중되어 있습니다. 새로운 공화국이 어떤 모습이어야 할지 국민이 결정할 수 있도록 공개 토론을 장려해야 합니다."
 FRA_democracy: "개인의 자유"
 FRA_democracy_desc: "우리나라가 겪은 수많은 위기는 국민의 안전에 대한 현실적인 의문을 제기했습니다. 시민을 보호하려면 감시가 필요하지만, 국가는 어디까지 갈 수 있습니까? 우리는 시민들이 자신의 목소리를 낼 권리를 허용해야 합니다."
 FRA_foreign_recognition_lfi: "외교 정책 재설정"
 FRA_foreign_recognition_lfi_desc: "우리나라는 너무 오랫동안 독재 정권을 떠받쳐 왔고 주권 국가의 존재를 인정하기를 거부해 왔습니다. 우리는 이를 끝내야 합니다."
 FRA_oppose_eu_immigration_lfi: "EU의 이민 입장에 이의 제기"
 FRA_oppose_eu_immigration_lfi_desc: "유럽 연합은 극우 포퓰리스트들에게 점점 더 관대해지고 있습니다. 곤경에 처한 이웃들을 돕기 위해 충분히 노력하지 않으며 그들을 값싼 노동력의 원천으로만 봅니다. 우리는 이러한 접근과 거리를 두고 보다 인도적인 정책을 제안해야 합니다."
 FRA_economic_question: "경제의 방향"
 FRA_economic_question_desc: "국가 예산과 그 운용은 다른 모든 것이 달려 있는 중요한 문제입니다. 이 문제에 대해서도 시민들이 의견을 내야 합니다."
 FRA_ho_topic: "프랑스적 특수성 해체"
 FRA_ho_topic_desc: "프랑스 문화에 내재한 많은 법과 관습은 다른 문화가 통합되기 쉽지 않게 만듭니다. 우리는 시민들에게 소수 집단의 통합 문제를 논의해 달라고 요청해야 합니다."
 FRA_balance_tax: "세금 균형"
 FRA_balance_tax_desc: "중산층과 불안정한 처지에 있는 사람들은 세금으로 쥐어짜이는 반면 부유층은 응분의 몫을 내지 않는 것은 용납할 수 없습니다. 우리는 균형을 되찾아야 합니다."
 FRA_climate_war_eco: "우리 천년의 도전"
 FRA_climate_war_eco_desc: "환경과 기후는 빠른 속도로 악화되고 있습니다. 우리는 남아 있는 생물 다양성을 보호하고 앞으로 닥칠 어려운 시기에 사회가 대비하도록 해야 합니다."
 FRA_dawn_6th_rep: "제6공화국의 여명"
 FRA_dawn_6th_rep_desc: "제6공화국을 향한 우리의 작업이 완료되었습니다. 결과가 어떠하든 우리의 일은 끝났습니다. 우리는 아마도 역사에 우리의 흔적을 남겼을 것입니다."
 FRA_creolisation: "크레올화"
 FRA_creolisation_desc: "우리나라가 목격해 온 수 세기에 걸친 문화 교류는 새로운 문화를 빚어냈습니다. 그러나 이 문화는 많은 이들에게 부정당하고 있습니다. 미래는 함께 사는 데 있음을 시민들이 이해하도록 해야 합니다. 우리는 아직도 세상에서 배울 것이 매우 많습니다."
 FRA_work_less: "적게 일하고 더 잘 일하기"
 FRA_work_less_desc: "우리의 전임자들은 프랑스인들이 점점 더 열악한 조건에서 점점 더 오랜 시간 일하게 만들겠다는 결의에 차 있었습니다. 우리는 이 추세를 되돌리고 시민들이 일을 더 즐길 수 있도록 도와야 합니다. 그러면 그들은 일에 더욱 창의적이고 열정적이게 될 것입니다."
 FRA_reform_police: "프랑스 경찰 개혁"
 FRA_reform_police_desc: "경찰은 너무 오랫동안 시민들에 대한 부당한 탄압의 도구로 쓰여 왔습니다. 우리는 모든 사람의 안전을 보장하면서도 시민들에게 가해지는 압박을 완화하는 데 필요한 개혁을 시행해야 합니다."
 FRA_post_empire: "국제 정책의 탈식민화"
 FRA_post_empire_desc: "우리의 식민지 과거는 옛 식민지들에 막대한 해를 끼쳤습니다. 그들 중 다수는 아직도 그로부터 회복하기 위해 고군분투하고 있습니다. 우리는 그들의 재건 노력을 지원하고 그들을 지배하려는 시도를 그만두어야 합니다."
 FRA_push_social_green_eu: "유럽에 불복종을 확산"
 FRA_push_social_green_eu_desc: "우리는 프랑스에서 많은 것을 이루었지만, 유럽 파트너들도 같은 길을 가도록 장려해야 합니다. 우리만이 유럽에서 진보주의를 추진하는 처지가 되지 않도록 그들의 국민을 결집시켜 자국 정부에 압력을 가하게 할 수 있습니다."
 FRA_social_green_fair_rep: "랭수미시옹"
 FRA_social_green_fair_rep_desc: "불과 몇 년 만에 우리는 많은 것을 이루었습니다. 우리는 프랑스를 경제적 자유주의와 불안정에서 벗어나게 했으며 더 인본주의적인 프랑스를 만들었습니다. 그러나 국내에서든 세계 어디에서든 우리는 기성 질서에 대한 도전을 결코 멈추지 않을 것입니다."
 FRA_no_time: "우리에겐 시간이 없다"
 FRA_no_time_desc: "과학자들은 수십 년 동안 기후 변화의 파괴적 영향에 대해 경고해 왔습니다. 그들이 예측한 것, 곧 점점 더 극심해지는 기상 이변이 이제 현실이 되고 있습니다. 다음 세대가 삶의 기회를 얻기를 바란다면 사람들은 깨어나야 합니다."
 FRA_strong_eu: "EU의 힘"
 FRA_strong_eu_desc: "프랑스는 세계가 기후 변화를 진지하게 받아들이도록 강제할 수 없습니다. 반면 유럽 연합은 세계의 나머지 국가들에 본보기가 될 수 있습니다."
 FRA_ecology_available: "생태주의를 모두에게"
 FRA_ecology_available_desc: "생태주의는 너무 오랫동안 부유층에게만 허락된 특권으로 여겨져 왔습니다. 우리는 이를 모두를 위해 돈을 아끼고 비극을 막는 방법으로서 계속 홍보해야 합니다."
 FRA_right_vote: "투표권 확대"
 FRA_right_vote_desc: "환경과 그 미래에 대한 관심이 열여덟 살이 될 때까지 기다려야 할 이유는 없습니다. 우리는 투표권을 더 넓은 계층의 인구로 확대해야 합니다."
 FRA_question_growth: "경제 성장에 이의 제기"
 FRA_question_growth_desc: "수십 년 동안 사람들은 환경을 돕는 최선의 방법이 지속 가능한 개발이라고 믿도록 이끌려 왔습니다. 하지만 왜 우리는 항상 발전하고 성장해야 합니까? 지구와 그 자원에는 한계가 있습니다. 우리는 그 대신 성장 둔화를 향해 나아가야 합니다."
 FRA_cooperate_eu: "EU 파트너와의 협력"
 FRA_cooperate_eu_desc: "우리의 유럽 파트너들이 모두 기후 변화에 대응하기 위한 경제 전환에 같은 자원이나 같은 의지를 갖고 있는 것은 아닙니다. 우리는 주요 파트너들의 국가에 친환경 기반 시설을 투자함으로써 그들이 이를 달성하도록 도울 수 있습니다."
 FRA_push_eco_eu: "녹색 미래 촉진"
 FRA_push_eco_eu_desc: "유럽 파트너들은 기후 변화에 대응하기 위해 우리만큼 노력하고 있지 않습니다. 우리는 그들의 환경 운동가들이 행동에 나서 프랑스의 본보기를 따르도록 촉구함으로써 그들의 국민이 행동하도록 장려할 수 있습니다."
 FRA_question_agriculture: "지속 가능한 농업"
 FRA_question_agriculture_desc: "프랑스 농업은 지난 세기의 수요를 충족하기 위해 대량 생산으로 나아갔습니다. 환경적으로는 다른 많은 형태의 농업보다 책임 있는 편이지만 여전히 개선의 여지가 있습니다. 유럽 기준에 더해, 농민들이 책임감 있는 고품질 생산을 위해 방식을 바꾸도록 장려해야 합니다. 우리는 그들의 농산물이 홍보되고 그것이 그들에게 수익이 되도록 보장할 것입니다."
 FRA_cooperation_no_compet: "경쟁이 아닌 협력"
 FRA_cooperation_no_compet_desc: "우리나라와 세계의 사회적 성공 모델은 개인의 성공과 부의 과시에 기반합니다. 이러한 행태는 과소비와 시민 간의 해로운 경쟁을 부추기므로 지구에 해롭습니다. 우리 사회가 지구에 미치는 영향을 줄이려면 이러한 사회 모델에 이의를 제기해야 합니다."
 FRA_nuke_choice: "에너지 믹스 다변화"
 FRA_nuke_choice_desc: "수십 년 동안 프랑스의 에너지는 수십 기의 원자로로 생산되어 왔습니다. 이 기술은 단기적으로는 신뢰할 수 있고 비교적 안전할지 모르나, 우리가 처리할 수 없는 폐기물을 발생시킵니다. 따라서 지속 가능한 미래를 위한 이상적인 에너지원이 아닙니다. 재생 에너지에 더 많이 투자하여 에너지 공급을 다변화해야 합니다."
 FRA_green_eu: "더 푸른 EU를 향하여"
 FRA_green_eu_desc: "국내외에서 기후 변화에 대응해 온 우리의 성공은 유럽 연합의 다른 나라들에 본보기가 됩니다. 우리는 그것을 자랑스러워할 수 있습니다."
 FRA_eco_life: "생태적 생활 방식"
 FRA_eco_life_desc: "보다 지속 가능한 생산 방식을 채택하는 것만으로는 충분하지 않습니다. 시민들이 덜 소비하도록 장려해야 합니다. 여기에는 어디에나 있는 광고를 억제하고 절제를 장려하는 것이 포함됩니다. 우리에게는 이 모든 것이 필요하지 않으며, 더 적은 것으로도 행복할 수 있습니다."
 FRA_upgrade_transport: "교통망 개선"
 FRA_upgrade_transport_desc: "우리의 교통망은 효율적일지 몰라도 매우 불균등하며, 외곽 지역 주민들이 더 비싸고 더 오염을 일으키는 교통수단을 이용하도록 강요합니다. 우리는 모든 지역에서 이용 가능한 대안을 마련해야 합니다. 이는 유럽의 몇몇 도시만 잇는 더욱 빠른 교통망을 계속 개발하기보다 외곽 지역과의 연결을 개선하는 것을 의미합니다."
 FRA_dynamise_research: "연구 활성화"
 FRA_dynamise_research_desc: "우리는 연구를 계속 발전시켜야 합니다. 더 적은 자원으로 더 많은 일을 하고 재생 에너지를 개발할 방법을 찾는 일을 결코 멈추지 않을 것입니다."
 FRA_help_transi: "유럽의 전환 지원"
 FRA_help_transi_desc: "우리의 유럽 파트너들은 기후 변화가 자신들에게 점점 더 영향을 미칠 심각한 문제임을 깨닫기 시작하고 있습니다. 그러나 일부는 이 부문에 투자할 수 있는 발전 단계에 아직 이르지 못했습니다. 우리는 저탄소 경제로의 전환에 전념하는 양국 간 공동 기금을 설립하여 이를 도울 수 있습니다."
 FRA_end_fossile: "화석 연료 종식"
 FRA_end_fossile_desc: "녹색 전환의 중요성이 유럽 연합 내에서 더 널리 인정받게 된 지금, 우리는 노력을 강화할 수 있습니다. 파트너들에게 화석 연료의 단계적 폐지를 향해 나아가자고 제안할 수 있습니다."
 FRA_opti_indus: "산업 최적화"
 FRA_opti_indus_desc: "우리는 대기업 경영진이 진정한 환경 조치를 시행하는 것이 그들 자신의 최선의 이익이 됨을 이해하도록 해야 합니다. 그들 또한 더 적은 자원을 사용함으로써 더 많은 일을 할 수 있습니다. 다만 이것이 그들이 오히려 더 많이 생산하도록 부추기지 않도록 주의해야 합니다."
 FRA_promote_local: "지역 소비 촉진"
 FRA_promote_local_desc: "이제 더 책임 있는 산업을 갖게 되었으니, 시민들이 실제로 그 제품을 구매할 수 있도록 해야 합니다. 그러나 시장의 힘은 저비용 생산을 유리하게 합니다. 따라서 우리 산업의 제품이 지구 반대편의 제품보다 더 쉽게 구할 수 있도록 해야 합니다. 이를 위해서는 자유 무역의 규칙을 구부려야 할 것입니다. 하지만 우리는 해낼 수 있을 것입니다."
 FRA_subsidies_green: "친환경 산업 보조금"
 FRA_subsidies_green_desc: "기업이 친환경적으로 변화하도록 장려하는 것만으로는 모두를 동참시킬 수 없습니다. 필요한 자원을 제공하고 지구에 대한 헌신과 효율성에 따라 기업에 보조금을 지급해야 합니다. 이번에는 그린워싱이 없을 것입니다."
 FRA_pressure_supply: "공급망 압박"
 FRA_pressure_supply_desc: "우리나라가 필요한 모든 원자재를 국내에서 생산할 수 없다는 것은 사실입니다. 유럽 연합은 환경 기준이 느슨한 나라들로부터 매우 많은 자원을 수입합니다. 우리의 생산 기준에 맞지 않는 자원을 수입하는 것은 용납할 수 없습니다. 그렇지 않다면 규제가 무슨 소용입니까? 이들 수출국이 변화하도록 압박하기 위해 다른 유럽 강국들과 힘을 합쳐야 합니다."
 FRA_reduce_extraction: "자원 채굴 감축"
 FRA_reduce_extraction_desc: "광물과 석유의 채굴은 오염을 유발하는 과정이며 종종 지구의 재생 능력을 넘어섭니다. 우리는 유전 위에 앉아 있지는 않지만, 광물과 연료의 채굴을 규제하는 더 엄격한 규정을 도입함으로써 세계에 모범을 보여야 합니다."
 FRA_power_rail: "EU 철도 확장"
 FRA_power_rail_desc: "유럽 연합에는 이미 광범위한 철도망이 있지만 우리는 더 잘할 수 있습니다. 여전히 너무 많은 화물이 트럭으로 운송되고 있으며 우리는 이를 줄여야 합니다."
 FRA_altermondialism: "대안 세계화주의 촉진"
 FRA_altermondialism_desc: "세계화가 더 이상 대중에게 이익이 되지 않는다는 사실은 누구에게도 놀라운 일이 아닙니다. 그러나 우리는 대중이 반세계화 운동으로 기울지 않도록 이끌어야 합니다. 이러한 경향은 세계화를 종종 공격적인 민족주의적 해법과 대립시키기 때문에 위험합니다. 주된 적이 자본주의임을 그들에게 보여 주어야 합니다."
 FRA_unite_struggle: "투쟁의 수렴"
 FRA_unite_struggle_desc: "성별, 종교, 피부색 또는 그 밖의 어떤 특성 때문이든 억압받는 모든 이들을 결집시켜야 합니다. 그들은 모두 자본주의와 그 사회적 결과의 희생자입니다. 그들의 모든 문제에는 원인과 해법이 있음을 보여 주어야 합니다."
 FRA_retake_past: "노동자를 되찾다"
 FRA_retake_past_desc: "소련 붕괴와 '행복한 세계화'의 종말 이후, 과거 우리 노동자 계층 유권자의 상당수가 극우 포퓰리스트로 돌아섰거나 대부분은 아예 투표를 하지 않게 되었습니다. 오늘 우리는 선거에서 승리했지만, 장기적인 생존을 확보하려면 우리 당의 DNA 그 자체인 노동자 계층 기반을 재건해야 합니다. 이를 위해 그들의 요구를 진지하게 받아들여야 하며, 그 시작은 자유주의적이던 전임자들이 중국으로 내보낸 일자리를 되찾아 오는 것입니다."
 FRA_turn_reform: "혁명이 아닌 개혁"
 FRA_turn_reform_desc: "이제 우리는 이러한 제도의 키를 되찾았으므로 더 이상 국가에 도전하는 행동을 고려할 필요가 없습니다. 우리가 이미 국가의 일부이기 때문입니다. 혁명적 이상은 접어 두고 사회를 내부에서부터 개혁할 수 있을 것입니다."
 FRA_leave_nato_PCF: "미국 제국주의와의 결별"
 FRA_leave_nato_PCF_desc: "NATO는 미국 제국주의의 도구이며 유럽에 대한 지배의 수단입니다. 우리는 이와 결별하고 대신 워싱턴의 패권에 저항하는 모든 민족과 연대해야 합니다."
 FRA_renogociate_treaty: "EU 조약 재협상"
 FRA_renogociate_treaty_desc: "우리 국민은 자신들이 반대했던 유럽 조약을 받아들이도록 강요당했습니다. 우리의 강령을 실행하려면 유럽 연합이 우리에게 부과한 법적 틀을 개정해야 합니다. 유럽 기구들과의 힘겨루기와 제재가 있으리라는 점은 의심의 여지가 없지만, 프랑스 국민의 이익을 위해 진정으로 행동하고자 한다면 다른 선택지가 없습니다."
 FRA_undo_lib_PCF: "자유주의 괄호를 닫다"
 FRA_undo_lib_PCF_desc: "미테랑 대통령 임기 이래로 프랑스 국민은 좌파와 우파 양쪽의 자유주의 정책을 견뎌야 했습니다. 이를 끝내고 우리가 다르다는 것을 보여 줄 때입니다. 설령 WTO나 유럽 연합과 충돌하더라도 자본주의에 맞서 싸우겠다는 결의를 보여 주어야 합니다."
 FRA_protect_indus_pcf: "산업 보호"
 FRA_protect_indus_pcf_desc: "프랑스 내 산업에 투자하는 것만으로는 충분하지 않습니다. 노동력이 더 싸고 규제가 더 적은 곳으로 산업이 이전하는 것을 막아야 합니다. 이는 우리의 생산 수단에 대한 주권을 지키고 노동자에게 품위 있는 일자리와 생활 조건을 보장하는 문제입니다."
 FRA_left_front: "연립 확대"
 FRA_left_front_desc: "우리 정부는 구성되어 있지만 그다지 안정적이지 않으며 동맹이 부족합니다. 아마도 다른 급진 좌파 정당들 가운데서 동맹을 찾아야 할 것입니다. 그들은 우리 정부에 참여하는 데 동의하지 않았지만, 설득할 수 있을지도 모릅니다. 지지의 대가로 그들에게 몇 개의 장관직을 제안할 수 있습니다."
 FRA_deal_devil_pcf: "사회당과의 거래"
 FRA_deal_devil_pcf_desc: "다른 급진 좌파 정당들만으로는 우리가 바라는 안정을 확보하기에 부족할 것입니다. 사회당과 공통분모를 찾을 수도 있을 것입니다. 어쨌든 유럽 탈퇴는 한 번도 우리 계획의 일부였던 적이 없습니다. 그들을 우리 연립에 끌어들이기 위한 공통분모를 분명 찾을 수 있을 것입니다."
 FRA_tie_moscow: "모스크바와의 결속"
 FRA_tie_moscow_desc: "냉전 내내, 그리고 그 이후에도 우리 당은 줄곧 모스크바 편에 서 왔습니다. 소련의 시대는 끝났지만 현재의 러시아 당국은 공산주의 이상에 우호적인 것으로 보입니다. 우리가 떠난 이후 우리는 옛 동맹들로부터 위협을 받아 왔습니다. 러시아 동맹은 꿈같은 일일 것이며, 경제 협력을 구축할 수 있을 것입니다."
 FRA_eu_communism_PCF: "유로코뮤니즘 촉진"
 FRA_eu_communism_PCF_desc: "소련은 이제 먼 기억에 불과하며, 오늘날 우리는 과거의 모범이었던 러시아가 과두제와 초민족주의 사이에서 흔들리는 세계에서 소련 없이 헤쳐 나가야 합니다. 공산주의와 유럽 연합은 양립 불가능하지 않으며, 다른 유럽 국가들도 이에 적대적이지 않습니다. 우리는 유럽에 남아 유럽이 자본주의와 파시즘에서 벗어나도록 최선을 다할 수 있습니다."
 FRA_retake_sovereign: "주권 회복"
 FRA_retake_sovereign_desc: "이제 생산 기구에 대한 통제권을 되찾았으니 더 나아갈 수단이 생겼습니다. 독자적으로 행동할 수단을 갖춘 지금, 외세의 영향에서 벗어나야 합니다."
 FRA_empower_union_PCF: "노동조합 육성"
 FRA_empower_union_PCF_desc: "과거의 힘에도 불구하고 노동조합은 오늘날 큰 영향력을 갖지 못합니다. 이는 당국이 노동자 계급을 분열시키고 고용 안정을 훼손하여 일부러 노조를 약화시켰기 때문입니다. 그러나 우리나라에서는 고용주에 맞설 수 있는 세력이 필수적입니다. 우리가 모든 곳에 동시에 있을 수는 없으며, 노동자 계급이 스스로 미래에 대한 통제권을 되찾아야 합니다. 노동자 계급의 눈에서 그들의 정당성을 회복하도록 도와야 합니다."
 FRA_green_communism: "녹색당에 손 내밀기"
 FRA_green_communism_desc: "자본주의의 희생자는 인류만이 아닙니다. 인류의 무분별한 행동 때문에 지구 또한 위험에 처해 있습니다. 우리는 녹색당과 공통분모를 찾을 수 있으며, 그들은 우리에게도 필요할 생태 강령을 설계하는 데 도움을 줄 수 있습니다."
 FRA_no_russian_claim: "러시아의 위협"
 FRA_no_russian_claim_desc: "유럽 연합이 조만간 러시아와 충돌하게 될 가능성이 매우 높습니다. 러시아는 우크라이나와 발트 영토를 노릴 가능성이 높으므로, 먼저 우크라이나인들에게 손을 내밀어 우리의 지원을 제안해야 합니다."
 FRA_green_turn: "녹색 공산주의"
 FRA_green_turn_desc: "녹색 동맹들과 협력하여 우리는 프랑스가 기후 변화가 제기하는 도전에 대비할 수 있도록 하는 환경 강령을 마련했습니다. 이를 위해서는 탄소 발자국을 제한하면서 생산 수단을 재건하는 데 상당한 노력이 필요할 것입니다. 하지만 우리는 이를 해야 합니다. 노동자 계급에게도 살 만한 세상에서 자라야 할 아이들이 있기 때문입니다."
 FRA_favor_lgbt: "차별 종식"
 FRA_favor_lgbt_desc: "일자리와 미래를 제공함으로써 국민의 기본적인 생계 수단을 확보한 지금, 우리는 사회 계층 내부의 차별 또한 다루어야 합니다. 어떤 이유로든 차별은 용납할 수 없다는 점을 국민에게 상기시켜야 합니다. 우리 사회는 모든 차이를 받아들이는 법을 배워야 합니다."
 FRA_dna_restored: "DNA의 회복"
 FRA_dna_restored_desc: "연립을 확보했으니 노동자 계급을 다시 전면에 세우는 데 집중할 수 있습니다. 광범위한 고용 보호법을 도입함으로써 우리의 선거 기반을 되찾을 수 있을 것입니다. 이는 재계를 기쁘게 하지 못하겠지만, 그것은 우리의 목표가 아니었습니다."
 FRA_condemn_rus: "동유럽 보호"
 FRA_condemn_rus_desc: "러시아의 침략은 우크라이나에서 멈추지 않을지도 모릅니다. 우리의 신흥 유럽을 보호하려면 동유럽과 북유럽 국가들이 러시아의 잠재적 침공에 저항할 수 있도록 해야 합니다."
 FRA_by_ourself: "개혁주의의 승리"
 FRA_by_ourself_desc: "강력한 연립을 구축함으로써 우리는 프랑스가 좌파 국가로 남기 위한 토대를 마련했습니다. 우리는 좌파와 그 제도에 대한 유권자들의 신뢰를 회복했습니다. 과거를 지워 버리지 않은 채, 우리가 이곳에 있는 한 유럽과 전 세계에서 자본주의와 파시즘에 맞서는 투쟁을 결코 멈추지 않을 것입니다."
 FRA_friend_of_past_pcf: "새로운 코민테른을 향하여"
 FRA_friend_of_past_pcf_desc: "러시아 공산주의 정부 또한 충분히 공고해진 것으로 보입니다. 우리는 그들에게 협력 확대를 제안할 수 있습니다. 공산주의에 옛 영광을 되찾아 줄 때입니다. 자본가와 파시스트는 다시 우리를 두려워하는 법을 배워야 합니다."
 FRA_struggle_end: "투쟁은 이제 시작일 뿐"
 FRA_struggle_end_desc: "집권한 이 몇 년 동안 우리는 공산주의를 정치 지형에 되돌려 놓았습니다. 우리는 유권자들과 다시 연결되었고 앞으로 올 세대를 위한 미래를 확보했습니다. 하지만 아직 끝나려면 멀었습니다. 해결해야 할 과제는 언제나 더 있을 것입니다. 그러나 적어도 좌파가 더 이상 신자유주의의 트로이 목마가 되지 않도록 보장했습니다."
 FRA_new_18th_brumaire: "새로운 브뤼메르 18일"
 FRA_new_18th_brumaire_desc: "우리 보나파르트주의자들은 공화국의 최고 관직을 확보했습니다. 공화파 야당은 침묵하게 되었고, 이 나라를 이끌 수 있는 것은 우리뿐입니다. 우리의 적은 무수히 많지만 어떤 것도 프랑스와 그 운명 사이를 가로막지 못할 것입니다."
 FRA_revolution_bonapart: "혁명의 유산"
 FRA_revolution_bonapart_desc: "나폴레옹 1세와 프랑스 제국은 프랑스 혁명의 직계 후계자입니다. 프랑스 국민은 이러한 가치에 깊이 애착을 갖고 있으므로, 우리 제국이 복고가 아님을 보여 주어야 합니다. 우리 제국은 새로운 혁명의 전령입니다."
 FRA_despotism: "무질서보다는 전제"
 FRA_despotism_desc: "최근 몇 달간의 불안은 우리 국민과 금융 시장에 상당한 우려를 낳았습니다. 우리가 권력을 잡고 있는 한 어떠한 무질서도 용납되지 않을 것임을 그들에게 안심시켜야 합니다."
 FRA_napoleon_constitution: "나폴레옹 헌법"
 FRA_napoleon_constitution_desc: "구 공화국의 제도는 더 이상 오늘날과 우리의 권위에 맞지 않습니다. 이를 개편하여 그 어느 때보다 강력한 국가를 만들어야 합니다."
 FRA_reform_military_napoleon: "신 그랑다르메"
 FRA_reform_military_napoleon_desc: "우리의 군대는 우리와 같은 나라에는 충분하고도 남습니다. 그러나 다수의 외국 열강을 상대로 장기전을 지속할 수는 없습니다. 우리는 처음부터 다시 시작하여 누구도 패배시킬 수 없는 군대를 건설해야 합니다."
 FRA_question_eu: "유럽인가 제국인가"
 FRA_question_eu_desc: "우리나라는 유럽 연합의 창립 회원국이므로 깊이 통합되어 있어, 결별하는 것은 쉬운 일이 아닙니다. 다만 우리는 실제로 다른 유럽 강국들과 싸울 작정입니다. 새 프랑스 정부처럼 유럽 연합의 기구에 다시 가입해야 합니까, 아니면 단호히 영구 탈퇴해야 합니까? 어느 쪽이든 우리는 그들과 싸울 수밖에 없을 것입니다."
 FRA_centralised_admin: "행정 중앙집권주의"
 FRA_centralised_admin_desc: "지방 분권은 우리나라에 잘못된 선택이었습니다. 우리에게 필요한 것은 명확한 지휘 계통과 수직적인 조직 구조입니다."
 FRA_blame_ennemy: "공격적 수사"
 FRA_blame_ennemy_desc: "우리의 신생 제국은 미래의 적들에게 둘러싸여 있습니다. 조만간 우리는 그들과 싸울 수밖에 없지만, 우리 사회는 과거의 동맹국을 상대로 전쟁을 치를 준비가 되어 있지 않습니다. 우리는 평화로운 미래를 이야기하며 그들을 현혹해 왔으나, 조만간 현실로 돌아오게 될 것입니다. 이를 위해, 옛 파트너들에 대한 그들의 신뢰를 흔들고 우리가 나머지 모두에 맞서 홀로 서 있음을 깨닫게 함으로써 그들을 준비시킬 수 있습니다."
 FRA_proclaim_empire: "제국 선포"
 FRA_proclaim_empire_desc: "짧은 기간 동안 우리는 권력을 공고히 하고 프랑스가 국제 무대에 복귀할 조건을 만들어 내는 데 성공했습니다. 이제 가식을 버릴 때입니다. 우리는 군사 역량의 전모를 보여 주는 열병식에 이어 프랑스 제국의 부활을 선포할 것입니다. 힘의 과시이자 경고이며 프랑스의 새 시대의 여명입니다. 그 후에는 상황이 분명히 보일 것입니다. 잠재적 동맹은 우리에게 다가올 것이고 적대 세력은 정체를 드러낼 것입니다."
 FRA_la_grande_armee: "군의 근간"
 FRA_la_grande_armee_desc: "지휘 계통을 개혁했으니, 이제 군 구조에 대한 더 구체적인 개혁으로 관심을 돌릴 수 있습니다. 먼저 작전 수행에 실제로 가용한 자원을 기준으로 공세 교리에 집중할 수 있습니다."
 FRA_europe_nationalism: "유럽 민족주의 지원"
 FRA_europe_nationalism_desc: "우리에게 지지를 약속한 유럽 국가는 거의 없습니다. 그들은 민족주의 정당이 이끄는 프랑스의 복귀를 못마땅하게 봅니다. 그들의 입장은 잘못입니다. 우리 편에 서는 것이 우리에 맞서는 것보다 낫다는 것을 알아야 합니다. 우리는 그들의 무위에 대가를 치르게 할 것입니다. 그들 나라의 민족주의 단체들을 지원할 것입니다. 그러면 자국에서 한바탕 큰 혼란이 일 것이며, 그들이 집권한다면 우리는 동맹을 얻게 됩니다."
 FRA_plebiscites: "국민투표 통치"
 FRA_plebiscites_desc: "공화국의 종말이 국민이 자신의 견해를 표명할 수단을 잃게 된다는 의미는 결코 아니었습니다. 우리는 국민에게 우리 정책의 여러 사안에 대해 결정하도록 요청함으로써 그들에게 여전히 발언권이 있음을 보여야 합니다. 황제께서는 그들을 설득하는 데 어려움이 없을 것이며, 이 허울뿐인 민주주의는 대부분의 사람들에게 충분할 것입니다."
 FRA_firepower: "현대적 화력"
 FRA_firepower_desc: "나폴레옹 전쟁 당시 그랑다르메는 반혁명 세력에게 전례 없는 화력을 퍼부을 수 있게 해 준 여러 혁신의 덕을 보았습니다. 오늘날에는 전장에 공격기와 드론이 등장하면서 포격의 규칙이 크게 바뀌었습니다. 우리나라는 다행히 포병과 항공 양쪽에서 모두 뛰어납니다. 따라서 전장 지원을 위한 생산을 간소화하기 위해 어느 쪽을 우선시할지 결정해야 합니다."
 FRA_8th_coalition: "적에게 둘러싸이다"
 FRA_8th_coalition_desc: "나폴레옹 전쟁 시대와 마찬가지로 정치적 게임이 분명하게 형성되고 있습니다. 우리의 적들은 우리를 두려워하며 약점의 첫 징후가 보이기만 하면 힘을 합쳐 우리에게 맞서려 기다리고 있습니다. 우리는 그들에게 그런 만족을 주지 않을 것입니다. 우리의 국경은 필요한 만큼 군사화된 채로 유지될 것입니다. 프랑스 제국은 적대 세력과 맞서야만 살아남을 수 있습니다. 과거와의 차이점은 이번에는 연합이 결성될 시간이 없을 것이라는 점입니다. 우리가 그들을 하나씩 격파할 것이기 때문입니다."
 FRA_renew_meritocracy: "능력주의 제국"
 FRA_renew_meritocracy_desc: "결함이 있다고 알려져 있었지만, 제1제국은 사회 계급보다 경험과 전문성을 선호했기에 성공할 수 있었습니다. 오늘날 우리는 프랑스 국민에게 사회적 신분 상승이라는 이 약속을 갱신해야 합니다. 그들은 제국과 프랑스를 위해 열심히 일함으로써 그 어느 때보다 높이 올라갈 수 있음을 이해해야 합니다."
 FRA_last_deluge: "그 어느 때보다 강하게"
 FRA_last_deluge_desc: "우리는 지휘 계통, 교리, 보급망에서 광범위한 개혁을 단행했습니다. 이제 남은 일은 군의 문을 대규모 모집에 열어 주는 것뿐입니다. 징병제는 오랫동안 현실이 아니었지만, 프랑스인들은 제국을 위해 싸울 준비가 되어 있습니다. 그랑다르메는 유럽 정복을 위해 출정할 준비를 마칠 것입니다."
 FRA_ennemy_isolate: "적대 세력 침투"
 FRA_ennemy_isolate_desc: "우리에게는 적대 세력의 민방위 체계에 침투하여 가장 아픈 곳을 타격할 수단이 있습니다. 이는 우리 정보 기관에 훌륭한 훈련이 되겠지만, 그들이 우리를 경계하게 될 위험도 있습니다."
 FRA_history_allies: "제국의 동맹들"
 FRA_history_allies_desc: "우리는 적에게 둘러싸여 있지만 혼자가 아닙니다. 많은 나라들이 여전히 우리와 우호 관계를 유지하고 있으며 우리 동맹에 가입하는 데 관심이 있을 수 있습니다. 미래의 동맹을 정당화하기 위해 그들과의 공유된 역사를 부각시킬 수 있습니다. 우리는 그들에게 상당한 혜택을 제공할 수 있으며, 그들은 우리에게 큰 도움이 될 것입니다."
 FRA_imperial_pride: "제국의 자긍심"
 FRA_imperial_pride_desc: "프랑스 국민은 자긍심을 되찾았습니다. 우리는 평화와 공화국이 환상에 불과했으며 프랑스의 미래는 제국이 되는 데 있음을 보여 주었습니다. 그들은 자국을 자랑스러워하고 우리의 적대 세력을 증오합니다. 우리 사회와 경제는 장기 분쟁에 맞추어져 있습니다."
 FRA_declare_hostile: "적의 방어 시험"
 FRA_declare_hostile_desc: "우리는 더 이상 미래의 적들에게 우리의 팽창주의적 야망을 숨길 이유가 없습니다. 그들의 국민에게 우리를 두려워할 모든 이유가 있으며 소란 없이 복종하는 것이 낫다는 것을 보여 줄 때입니다."
 FRA_our_own_system: "우리만의 체제"
 FRA_our_own_system_desc: "모든 제국에는 저마다의 동맹이 있으며, 홀로 승리하려는 것은 큰 대가를 치르게 됩니다. 이미 여러 나라가 우리와 동맹을 맺겠다는 의사를 밝혔습니다. 서로를 존중하는 파트너들 사이의 강력한 동맹을 만들어 이러한 협력을 공식화할 때입니다."
 FRA_reclaim_empire: "제국 수복"
 FRA_reclaim_empire_desc: "우리의 제국을 되찾기 위해 나설 때가 왔습니다. 우리는 사회, 경제, 군대를 준비하는 데 수년을 보냈습니다. 이 노력이 결실을 맺고 프랑스가 세계 질서 속에서 합당한 자리를 되찾을 때입니다."
 FRA_french_commune: "승리한 혁명"
 FRA_french_commune_desc: "우리는 온건 공산주의자들과 기타 약한 세력, 혹은 자본주의의 꼭두각시들로부터 제도의 통제권을 빼앗는 데 성공했습니다. 프랑스 국민은 우리의 집권을 받아들임으로써 우리에게 신뢰를 보내고 있습니다. 그들 또한 자본주의를 물리칠 수 있다고 믿으며, 우리가 하려는 일이 바로 그것입니다. 우리는 사회를 재건하고 자본주의 세력과의 대결에 대비할 것입니다."
 FRA_purge_military: "참모부 장악"
 FRA_purge_military_desc: "우리가 제도의 통제권을 장악하는 데 성공했지만, 개입하지 않았던 군대가 언제나 우리 편에 남아 있으리라는 보장은 없습니다. 조만간 우리는 다른 열강과 군사적으로 대결해야 할 것입니다. 그들의 충성을 보장하려면 지휘 계통의 정점에서부터 시작해야 합니다. 그들은 선택의 여지가 없음을 곧 깨닫겠지만 몇 달 동안은 분명 얼마간 저항을 보일 것입니다. 지휘 계통의 정점이 길들여지면 나머지는 명령에 복종할 것입니다."
 FRA_worker_right_comm: "노동자 안심시키기"
 FRA_worker_right_comm_desc: "우리 혁명의 어려운 국면은 이제 끝났지만, 시민 사회는 우리나라의 상황에 대해 심각한 우려를 표명했습니다. 노동자들에게 일자리와 고용 안정을 보장함으로써 그들을 안심시켜야 합니다. 이를 위해 우리의 생산 라인이 적응해야 하겠지만, 이러한 보장은 우리의 미래에 이로울 것입니다."
 FRA_people_constitution_comm: "프롤레타리아 독재"
 FRA_people_constitution_comm_desc: "구 공화국의 제도는 근본적으로 불공정했습니다. 소수의 부패한 계급이 나라를 전적으로 통제했습니다. 우리의 혁명은 노동자들이 자신들이 운영에 기여하는 나라의 정치 생활에 참여할 수단을 주어야 합니다. 불공정한 공화국을 끝내고 새로운 형태의 통치를 고안할 때입니다."
 FRA_revolution_soil: "혁명의 땅"
 FRA_revolution_soil_desc: "자크리의 난에서 프랑스 혁명들에 이르기까지 프랑스 국민은 권위주의 체제의 부당함에 맞서 왔음을 보여 주었습니다. 우리 혁명의 여파 속에서, 우리는 그들의 기도가 응답받았음을 보여 주고 반혁명 세력의 모든 공격을 견딜 수 있는 평등한 사회를 건설해야 합니다."
 FRA_hostile_nato_comm: "타락한 서방"
 FRA_hostile_nato_comm_desc: "NATO는 미국과 자본주의의 꼭두각시입니다. 이 둘은 우리의 불구대천의 적이므로 우리는 더 이상 이 동맹에 머물러서는 안 됩니다. 조만간 그들은 우리의 적수가 될 것입니다."
 FRA_fate_eurocommunism: "유럽 실험의 포기"
 FRA_fate_eurocommunism_desc: "아무리 최선을 다해도 우리는 유럽 연합의 제도를 올바른 궤도로 되돌릴 수 없을 것입니다. 그들은 자본주의와 로비의 부패로 가득합니다. 게다가 이 나라들은 우리의 국내 정책에 단호히 반대합니다. 이 결별은 고도로 통합된 우리 경제에 타격을 주겠지만 이러한 분리는 필요합니다."
 FRA_legacy_patriwar: "대조국전쟁의 유산"
 FRA_legacy_patriwar_desc: "지난 세기에 소련은 파시즘이 무력으로 패배할 수 있음을 세상에 보여 주었습니다. 그들이 성공적으로 치러 낸 그 전쟁은 국가가 군대와 하나로 뭉쳐야 한다는 것을 우리에게 가르쳐 주었습니다. 소련 사회의 회복력이 없었다면 붉은 군대는 결코 승리하지 못했을 것입니다. 앞으로의 분쟁에서 대중의 열의가 최고조로 유지되도록 해야 합니다. 앞으로 닥칠 일에는 우리의 모든 힘이 필요할 것입니다."
 FRA_focus_education: "민중 교육"
 FRA_focus_education_desc: "정치에 참여하기 위해서든 직장에서 효율적이고 행복하기 위해서든, 우리 국민은 정보를 갖추어야 합니다. 자본가와 파시스트의 선전에 속지 않고 세상을 이해하는 데 필요한 모든 것을 누구나 배울 수 있는 기회를 주어야 합니다."
 FRA_loyalty_cause: "대의에 대한 충성"
 FRA_loyalty_cause_desc: "우리는 더 나은 노동 조건에서 정치적 대표권에 이르기까지 국민에게 수많은 권리를 부여했으며 많은 잘못을 바로잡았습니다. 그러나 이러한 새로운 권리에는 책임이 따릅니다. 이견은 허용되지만 모든 시민은 집단의 의지에 온전히 복종해야 합니다. 우리는 이 사회를 함께 통치하므로, 사회가 계속 제대로 기능하도록 보장할 책임은 모두에게 있습니다."
 FRA_paris_commune: "파리 코뮌의 교훈"
 FRA_paris_commune_desc: "파리 코뮌과 우리가 신봉하는 공산주의 이념 사이의 연관성은 결코 분명하지 않지만, 우리는 이 격동의 시기에서도 교훈을 얻을 수 있습니다. 파리 코뮌은 반혁명 세력에 맞설 자원과 투지가 부족했기 때문에 멸망했습니다. 세계화로 부패한 이 잔혹한 세상에서 우리는 혁명의 생존이 반혁명 세력을 분쇄하는 데 달려 있음을 명심해야 합니다. 우리 사회는 이를 인식하고 적대 세력에 맞서 함께 서야 합니다."
 FRA_unleash_agent: "자본가 교란"
 FRA_unleash_agent_desc: "우리가 언제나 전장에서 적대 세력과 맞설 수 있는 것은 아니며, 그것은 너무 많은 대가를 치르고 패배로 끝날 수도 있습니다. 그러나 그들의 사회를 내부에서부터 파괴함으로써 일을 수월하게 할 수 있습니다. DGSE라는 첩보와 교란 공작에 훈련된 정보 기관이 있으므로 이를 잘 활용할 수 있습니다. 우리는 전쟁을 벌이지 않고 혁명을 수출할 것이며, 자본가들은 이를 막을 방법이 없습니다."
 FRA_spread_communism_eu: "유럽에 공산주의 확산"
 FRA_spread_communism_eu_desc: "우리는 유럽 기구를 바꿀 수는 없지만 일부 회원국이 반란을 일으키도록 장려할 수는 있습니다. EU 전역에서 시행되는 신자유주의 정책이 모두의 마음에 드는 것은 아니므로, 그들 인구의 일부가 우리와 함께하도록 설득하는 데 어려움은 없을 것입니다."
 FRA_red_army_comm: "신 붉은 군대"
 FRA_red_army_comm_desc: "우리의 개혁 덕분에 군대는 코뮌의 통제 아래 완전히 놓였으며, 시민 사회는 군대와 나란히 싸울 준비가 되어 있습니다. 우리의 개혁은 군의 잠재력도 최대한 끌어냈으며, 우리 병사들은 정의가 우리 편에 있음을 알고 있습니다. 코뮌은 무너져서는 안 됩니다. 혁명의 횃불을 들고 있기 때문입니다."
 FRA_collectivisation: "경제의 집산화"
 FRA_collectivisation_desc: "경제의 통제권은 언제나 노동자 계급의 손을 벗어나 소수 가문의 수중에 있었습니다. 혁명 이전에 이 나라에서는 과두 지배층이 군림했습니다. 그러나 이제 그것은 끝났습니다. 프랑스 국민은 생산 수단에 대한 통제권을 되찾고 있습니다. 이로써 우리는 생산 수단의 충성과 국민의 재정적 안정을 확보할 것입니다."
 FRA_enforce_unions: "노동조합 권한 강화"
 FRA_enforce_unions_desc: "이제 프랑스 경제를 집산화하고 노동자에게 더 큰 정치적 책임을 부여했으니, 국가가 덜 신중해지더라도 노동자들이 통제권을 유지할 수 있도록 해야 합니다. 노동조합은 우리의 온건한 전임자들이 복원했을지 모르나, 우리는 그 이상을 할 수 있습니다. 우리는 노동조합에 더 많은 권력을 부여하고 노동자들이 가입하도록 장려할 것입니다. 단결한 노동자는 우리나라의 의사 결정에서 중요한 역할을 결코 멈춰서는 안 됩니다."
 FRA_glorious_past_comm: "공산주의의 의심스러운 과거"
 FRA_glorious_past_comm_desc: "특히 동유럽을 비롯해 유럽 전체가 스탈린주의 공산주의에 좋은 기억을 가지고 있는 것은 아니므로, 우리는 그들에게 우리가 다르다는 점을 상기시켜야 합니다. 이 나라들은 스탈린주의 전체주의에 짓밟혔고, 이는 인민을 해방시키지 않고 새로운 주인을 안겨 주었을 뿐입니다. 우리의 유일한 적은 자본주의와 파시즘입니다. 이 나라들이 그것에서 해방되어야 한다면 우리가 도울 수 있습니다. 그러나 우리의 목표는 그들을 노예화하는 것이 아니라 모든 민족의 프롤레타리아 연합에 통합하는 것입니다."
 FRA_befriend_comm: "노동자 단결"
 FRA_befriend_comm_desc: "이 새 천년에 공산주의는 인기가 덜하지만, 그 가르침을 따르는 것은 우리만이 아닙니다. 앞으로의 투쟁에서 우리는 동맹이 필요하며, 우리처럼 자본주의에 저항하기로 한 나라들 가운데서 찾을 수 있습니다. 이 나라들에 전 세계에서 자본주의를 무너뜨리기 위해 서로 돕자고 제안해야 합니다. 그들은 혼자가 아니며 우리도 마찬가지입니다."
 FRA_final_struggle: "최후의 투쟁"
 FRA_final_struggle_desc: "우리 사회와 군대는 자본주의에 맞서 싸울 준비가 되어 있습니다. 그들은 우리가 이룬 진전과 자본주의 열강이 우리를 지도에서 지우려는 결의를 알고 있습니다. 우리는 자본주의를 무너뜨리기 위해 끝까지 싸울 것입니다."
 FRA_UFSR_born: "프랑스적 특색의 공산주의"
 FRA_UFSR_born_desc: "공산주의 이념과 자신의 권리를 지키려는 프랑스 국민의 결의를 결합한 것은 매우 훌륭한 발상이었습니다. 우리는 대중에게 정치에 참여해야 하며 그럴 수단이 있음을 분명히 했습니다. 연맹제가 우리의 국경일을 기념하듯, 이제 혁명이 프랑스 국민에게 진정으로 받아들여졌다고 할 수 있습니다. 오늘은 우리나라의 역사적인 날입니다."
 FRA_new_kommintern: "새로운 인터내셔널을 향하여"
 FRA_new_kommintern_desc: "전 세계의 많은 단체가 세계 혁명을 향한 우리의 호소에 응답했습니다. 이제 동맹을 실천에 옮기고 자본주의와 맞설 준비를 할 때입니다."
 FRA_cold_war_round2: "세계 혁명"
 FRA_cold_war_round2_desc: "자본주의와 파시즘에 맞서 싸울 때가 왔습니다. 우리는 모든 나라의 노동자에게 자유를 가져다줄 것입니다. 과두 지배층은 패배할 것입니다."
 FRA_kingdom_history: "군주제의 오랜 역사"
 FRA_kingdom_history_desc: "프랑스에 군주제가 돌아왔습니다. 우리의 지지자들이 구 공화국의 제도를 장악하고 우리의 귀환을 요청했습니다. 그리하여 절대 군주제가 무너진 지 두 세기 만에 우리는 프랑스의 왕좌로 돌아왔습니다. 긴 여정이 우리 앞에 놓여 있습니다. 새로운 프랑스 왕국을 재건하는 동시에 혁명의 공화주의적 유산을 뿌리 뽑아야 합니다. 그동안 우리의 적들은 어둠 속에서 우리를 노리고 있지만, 우리는 성공할 것입니다. 하느님께서 언제나 그러셨듯 우리와 함께하시기 때문입니다."
 FRA_camelot: "왕의 카믈로"
 FRA_camelot_desc: "국민이 순종적으로 남아 새로운 공화국을 꿈꾸지 않도록 하려면 감시를 강화해야 하며, 이를 위해서는 정치 경찰이 필요합니다. 이를 위해 DGSI에서 훈련받은 악시옹 프랑세즈 전 구성원들을 활용할 수 있습니다. 우리는 이 조직들을 지난 세기의 왕당파 활동가들에게 경의를 표하는 의미에서 '왕의 카믈로'라는 새로운 기구로 통합할 것입니다."
 FRA_decentralisation_king: "완전한 지방 분권"
 FRA_decentralisation_king_desc: "자코뱅주의와 혁명에서 물려받은 중앙집권은 프랑스인을 시민이 아니라 신민으로 만들었습니다. 하위 수준에서 작동하던 관습법 체계는 시민과 중앙 국가를 잇는 고리로서 매우 훌륭히 기능했습니다. 다행히 우리나라는 유럽 연합 기준에 맞추기 위해 이미 중앙집권주의에서 벗어나기 시작했습니다. 따라서 우리는 유럽 지역의 틀에 맞추기 위해서가 아니라 혁명 이전과 같은 지방 권력 체계를 복원하기 위해 이 전환을 완료할 수 있습니다."
 FRA_king_rule: "레그눔 레기스"
 FRA_king_rule_desc: "혁명의 기억을 지우는 첫걸음은 옛 체제의 폐허 위에 새로운 체제를 세우는 것입니다. 따라서 우리는 공화국의 폐지와 새 헌법의 기초를 선언할 수 있습니다. 이 헌법은 좋았던 옛 시절처럼 절대 권력을 쥔 국왕을 중심으로 할 것입니다."
 FRA_national_integralism: "통합 민족주의"
 FRA_national_integralism_desc: "프랑스 국민이 혁명이 얼마나 실패였고 그 결과가 어떠했는지 이해하도록 돕기 위해, 사상가 샤를 모라스가 제시한 유명한 이론을 부각시켜야 합니다. 통합 민족주의는 프리메이슨, 이단자, 외국인이 일으킨 혁명의 결과로 애국심을 저버린 공화국을 묘사합니다. 이는 민족 단결과 가톨릭교회가 구현하는 도덕 질서로의 복귀를 주창합니다. 이러한 가르침은 덕목으로 가득하며 우리의 신생 왕국에 전적으로 적용할 수 있습니다. 우리 왕국은 이제 막 선언문을 찾았습니다."
 FRA_no_more_eu: "유럽 연합 탈퇴"
 FRA_no_more_eu_desc: "유럽 연합은 우리가 맞서 싸우는 모든 것, 즉 무분별한 자유주의, 역겨운 이상주의, 참담한 순진함, 만연한 부패를 구현합니다. 이 기구의 유일한 목적은 우리의 국가와 문화를 해체하는 것입니다. 따라서 우리는 이 연합에 남아 있을 이유가 없습니다. 어떤 결과가 따르더라도 너무 늦기 전에 떠나야 합니다."
 FRA_eu_kingdom: "몰락한 군주국들"
 FRA_eu_kingdom_desc: "수 세기 전 유럽은 군주국의 대륙이었습니다. 당시의 국제 질서는 어떤 의미에서 세력 균형과 동맹에 의해 형성되었습니다. 그러나 그런 시절은 오래전에 지나갔습니다. 민족주의는 군주제를 쓸어 버렸거나 관광 명소 수준으로 전락시켰습니다. 따라서 동맹을 찾기 위해 우리가 할 수 있는 최선은 유럽의 절대주의 지지자들이 공화파 억압자들에 맞서 봉기하도록 돕는 것입니다."
 FRA_king_modern_chivalry: "현대의 기사도"
 FRA_king_modern_chivalry_desc: "프랑스 왕국은 언제나 기병과, 기병이 치른 전투에서 결정적 역할을 한 것으로 명성을 떨쳤습니다. 오늘날 기병은 60톤짜리 강철 괴물과 닮아 있습니다. 그러나 그 역할은 여전히 결정적입니다. 우리 군은 기갑 기병을 폭넓게 활용하는 데 집중하는 것이 좋을 것입니다."
 FRA_no_deceit: "퇴폐 종식"
 FRA_no_deceit_desc: "우리의 주된 적은 공화국이 우리 사회에 심어 놓은 퇴폐, 즉 도덕 질서에서 벗어나 국가가 모든 것을 부담해 주기를 기대하는 시민들입니다. 우리는 그들을 현실로 되돌려야 합니다. 공화국의 시대는 끝났습니다. 우리 왕국은 덕망 있는 시민을 원합니다."
 FRA_frankish_ancestor: "우리의 선조, 프랑크족"
 FRA_frankish_ancestor_desc: "우리 프랑스인은 프랑크족의 후손이며, 그것이 우리의 민족이자 정체성입니다. 공화파는 군주제와 프랑크족을 말살하려 했지만, 누구도 한 문명과 문화를 내부에서부터 지워 버릴 수는 없습니다. 그것은 우리의 유산이며 되찾는 것은 우리의 몫입니다."
 FRA_against_liberalism: "자유주의와 사회주의에 반대"
 FRA_against_liberalism_desc: "공화국은 시민들이 더 많은 자유와 권리가 필요하다고 믿게 만들었습니다. 우리 왕국은 이러한 잘못을 바로잡는 것을 목표로 합니다. 무엇보다 우리 시민들은 도덕 질서로 가는 길과 국왕을 중심으로 한 민족의 단결을 다시 발견해야 합니다. 나머지는 모두 부차적입니다."
 FRA_historical_ennemy: "영원한 적"
 FRA_historical_ennemy_desc: "수 세기에 걸쳐 우리가 충돌해 온 단 하나의 적을 꼽는다면 그것은 의심할 여지 없이 영국입니다. 영국 또한 군주국이지만 군주에게는 이제 실권이 없습니다. 조만간 우리는 분명 그들과 맞서게 될 것입니다. 그러나 그들이든 다른 상대든, 우리 해군은 해양 강국과의 전투에 대비해야 합니다."
 FRA_friend_pope: "교황청 보호"
 FRA_friend_pope_desc: "교회의 장녀로서 프랑스는 교황청을 공격하려는 모든 자로부터 보호할 의무가 있습니다."
 FRA_army_of_elites: "정예 부대"
 FRA_army_of_elites_desc: "징병제의 개념을 도입한 것은 혁명이었습니다. 우리는 지난 두 차례의 세계 대전에서 그것이 반드시 최선의 생각은 아니었음을 보았습니다. 항상 제대로 훈련받은 것은 아니었던 병사들이 죽음으로 내몰렸습니다. 이러한 결정은 지난 세기에 프랑스 인구를 크게 감소시켰습니다. 우리는 모집 기준을 강화하여 군이 전문성을 유지하도록 해야 합니다. 이는 또한 우리 대열 속에 말썽꾼이 섞이는 것도 막아 줄 것입니다."
 FRA_positive_inequality: "긍정적 불평등"
 FRA_positive_inequality_desc: "모든 것이 평등주의적일 필요는 없습니다. 우리 모두가 평등해야 한다는 생각은 혁명이 만들어 낸 또 하나의 발명품입니다. 어떤 이는 이끌도록, 어떤 이는 따르도록 태어났습니다. 프랑스인들은 이를 깨달아야 합니다. 다른 사람의 성공에 불평하며 시간을 보내는 것은 모두의 효율을 떨어뜨리기 때문입니다."
 FRA_destroy_republicanism: "공화주의 타파"
 FRA_destroy_republicanism_desc: "절대주의가 우리 왕국에 돌아왔습니다. 정치라는 이 민주주의의 환상을 더 이상 이어 갈 이유가 없습니다. 존재할 권리가 있는 정당은 국왕의 당뿐입니다. 프랑스인들은 짐이 곧 국가임을 이해해야 합니다!"
 FRA_catholic_league: "가톨릭 동맹 결성"
 FRA_catholic_league_desc: "교회와의 접근은 모두에게 무관심하게 받아들여지지 않았습니다. 몇몇 나라는 우리에 대한 지지를 표명했습니다. 우리는 십자군을 다른 가톨릭 강국으로 확대할 수 있을지도 모릅니다. 어쨌든 그들 또한 성지를 되찾기 위해 싸울 권리가 있습니다."
 FRA_burry_revolution: "혁명을 묻다"
 FRA_burry_revolution_desc: "프랑스 국민은 마침내 혁명이 비참함만 가져왔으며 프랑스 군주제의 우위가 자연스러운 질서였음을 깨닫게 되었습니다. 우리의 제도에서도 혁명적 요소가 숙청되었습니다. 따라서 우리는 그 저주받은 혁명의 책장을 성공적으로 넘겼다고 말할 수 있습니다."
 FRA_elder_daughter: "교회의 장녀"
 FRA_elder_daughter_desc: "프랑스는 세계 질서 속에서 자리를 되찾았습니다. 우리는 오랫동안 그래 왔듯 그리스도교 세계의 수호자가 될 것이며, 수없이 그랬듯 성지를 되찾을 것입니다."
 FRA_republican_cancer: "공화주의라는 암"
 FRA_republican_cancer_desc: "우리나라는 공화주의에서 벗어나는 데 성공했지만, 유럽에서 더 이상 공화주의의 지배를 받지 않는 나라는 우리가 거의 유일합니다. 우리가 전투에서 패한다면 적대 세력이 우리를 다시 공화주의의 악몽에 빠뜨릴 것은 말할 필요도 없습니다. 우리는 공화주의의 위협이 어디에 있든 파괴해야 합니다. 그래야만 우리는 안전할 것입니다."
 France_news.100.t1: "엘리제궁 위의 붉은 깃발"
 France_news.100.d1: "프랑스 국영 방송이 동트기 전에 꺼졌습니다. 방송이 돌아왔을 때 스튜디오는 군복 차림의 사내들이 장악하고 있었으며, 이들은 스스로를 공안 위원회라 칭하는 조직의 성명을 낭독했습니다. 기갑 부대가 엘리제궁과 국민의회를 둘러싸고 있으며, 제5공화국의 어떤 장관도 자정 이후 모습을 보이지 않았습니다. 브뤼셀은 긴급 회의를 소집했고 워싱턴은 대사관 직원들에게 실내 대피를 명령했습니다."
 France_news.100.t2: "파리, 전통주의자들에게 함락"
 France_news.100.d2: "전통주의 조직망에 충성하는 헌병대 부대들이 밤사이 정부 청사 구역으로 진입했으나, 비켜서라는 지시를 받았음이 분명한 군 지휘부의 저항은 받지 않았습니다. 아침이 되자 엘리제궁 위의 삼색기는 1944년 이래 어떤 프랑스 정부도 용인하지 않았던 깃발들과 나란히 휘날렸습니다. 공화국의 제도는 음모자들이 국가 복고라 부르는 것이 마무리될 때까지 정지되었습니다."
 France_news.100.a: "제5공화국은 끝났다."
 France_news.100.b: "유럽은 이를 묵인할 수 없다."
 France_news.100.c: "프랑스가 또 하나의 공화국을 묻었다."
 France_news.101.t: "투표소로 향하는 프랑스"
 France_news.101.d: "오늘 아침 프랑스 전역에서 대통령 선거 1차 투표를 위한 투표소가 문을 열었습니다. 투표율은 저조할 것으로 예상됩니다. 좌파는 넷으로 쪼개졌고, 우파는 공화당과 주권주의자들로 나뉘었으며, 평론가들이 선거 운동 내내 논의를 거부해 온 국민전선이 있습니다. 결선 투표는 2주 뒤이며, 이번만큼은 파리의 누구도 누가 올라갈지 장담하지 못합니다."
 France_news.101.a: "결선은 우리가 지지만 않으면 된다."
 France_news.101.b: "파리를 주시해야 한다."
 France_news.102.t1: "혁명 세포 일제 검거"
 France_news.102.d1: "DGSI와 GIGN의 합동 급습이 동트기 전에 급진 조직망을 와해시켰습니다. 세포 지도자들은 생드니와 빌뢰르반의 아파트에서 체포되었고, 세 개 도에서 무기 은닉처가 압수되었으며, 그들이 2년간 침투해 온 당 조직은 숙청되었습니다. 정부는 공화국이 위험에 처한 적이 없다고 주장합니다. 체포 영장은 그렇지 않다고 말합니다."
 France_news.102.t2: "복고주의 음모 분쇄"
 France_news.102.d2: "DGSI와 GIGN의 합동 급습이 동트기 전에 전통주의 조직망을 와해시켰습니다. 악시옹 프랑세즈 조직자들은 자택에서 체포되었고, 세 개 도에서 무기 은닉처가 압수되었으며, 음모자들에게 군의 침묵을 약속했던 장교들은 이제 군사 법정에 서게 되었습니다. 제5공화국은 40년 만에 가장 아슬아슬한 고비를 넘겼습니다."
 France_news.102.a: "공화국은 건재하다."
 France_news.102.b: "안도할 일이자 경고이다."
 france_md.20.t: "중도 정당의 현황"
 france_md.20.d: "본래 중도우파 정당이었던 UDF는 중도 정당으로 자리 잡았으며, 과거에는 발레리 지스카르 데스탱 대통령 아래에서 집권할 수 있었습니다. 그러나 그 뒤로 우리는 뒷전으로 밀려나, 때로는 동거 정부에서 복무하기도 했지만 공화주의 우파와 사회당에 가려져 있습니다. 하지만 세계는 변하고 있으며, 서방에서는 신자유주의 흐름이 힘을 얻고 있습니다. 오늘날 우리는 그리 크지 않지만, 언젠가 우리가 집권하리라는 것은 의심의 여지가 없습니다."
 france_md.20.a: "그렇다, 기다릴 수가 없다!"
 france_md.21.t: "공화주의 우파의 현황"
 france_md.21.d: "우리 당은 공화국만큼 오래되었으며 1995년 자크 시라크의 임기 아래 집권해 왔지만, 그는 더 이상 순풍을 타고 있지 못합니다. 실패한 의회 해산으로 사회주의자 총리를 받아들여야 했던 뒤, 우리는 사회당이든 국민전선이든 경쟁자들의 부상을 목격하고 있습니다. 우리나라는 여느 때처럼 재정난을 겪고 있으며 그 이익은 해외 곳곳에서 위협받고 있습니다. 한 가지는 확실합니다. 국내외에서 싸워 프랑스의 힘을 의심할지 모를 이들에게 주장해야 합니다."
 france_md.21.a: "일에 착수하자"
 france_md.22.t: "RPF의 현황"
 france_md.22.d: "1999년에 창당한 프랑스를 위한 집회(RPF)는 우파 주권주의 정당입니다. 샤를 파스카가 만들었으며 유럽 연합에 강하게 반대하고 이에 맞서 열심히 활동해 왔습니다. 지금으로서는 우리의 영향력이 작지만 수레바퀴는 돌고 있습니다. 유럽 연합은 모두를 행복하게 만들지 못하고 있으며, 우리는 다른 곳에서는 프렉시트를 실행할 의지를 찾지 못한 다른 정당의 이탈자들, 실망한 사람들을 점점 더 많이 맞이하고 있습니다. 우리는 물론 현존하는 가장 드골주의적인 정당이며, 이 공화국을 드골이 세웠으니 우리가 있을 자리는 마티뇽 말고는 없습니다!"
 france_md.22.a: "드골 장군 만세, 프랑스 만세!"
 france_md.23.t: "국민전선의 현황"
 france_md.23.d: "1972년 장마리 르펜이 창당한 국민전선은 극우 정당입니다. 창당 이래 우리는 이민에 반대한다는 이유로 정치 지형 전체가 우리에게 맞섰기에 진지한 정당으로 여겨지지 않았습니다. 그 뒤 상황은 바뀌었고, 다른 정당들은 자신들의 태도가 우리나라를 혼란으로 이끌었음을 깨닫기 시작하고 있습니다. 우리는 이민에 반대하는 전반적인 추세가 될 흐름의 선구자입니다. 그러나 우리는 여전히 불가촉천민으로 치부되고 극단주의자로 낙인찍혀 있으므로, 의회와 유권자에게 받아들여질 수 있는 정당으로 만들기 위해 노력해야 합니다."
 france_md.23.a: "우리는 해낼 것이다!"
 france_md.24.t: "사회당의 현황"
 france_md.24.d: "공화주의 우파의 역사적 라이벌인 우리 당은 정전이라 할 만큼 오래되었습니다. 공화주의 우파는 이제 동거를 강요당해 곤경에 처해 있습니다. 우리는 대부분의 계층에 걸쳐 탄탄한 선거 기반을 갖고 있으며, 투표에서의 승리는 불가피합니다. 우리는 우리가 건설하고 있는 유럽에 적응하기 위해 선배들보다 더 자유주의적인 접근을 주장합니다. 그러나 우리 당은 내부 분열에 직면해 있습니다. 자유주의 중도를 갈망하는 우파와 급진화될 위험이 있는 좌파입니다. 우리가 이기리라는 것은 의심할 여지가 없지만, 일단 정상에 오르면 살얼음판을 걷게 될 것입니다."
 france_md.24.a: "모든 것이 잘될 것이다."
 france_md.25.t: "굴복하지 않는 프랑스의 현황"
 france_md.25.d: "사회당은 두 경향 사이에서 찢어져 좌파의 이상을 집권으로 이끌지 못했습니다. 우리 당인 불복하는 프랑스는 신자유주의 질서에 맞서는 유일한 진정한 좌파 야당입니다. 사회당이 스스로를 파묻은 것은 무분별하게 타협을 추구했기 때문이므로, 우리는 언론의 반발을 감수하더라도 항의를 수사의 바탕으로 삼을 것입니다. 우리의 주요 프로젝트는 새로운 공화국을 건설하여 우리가 너무 오래 견뎌 온 대통령 군주제를 끝내는 것입니다. 우리 당은 젊은 층에서 성공을 거두었지만, 언젠가 집권하고자 한다면 안주해서는 안 됩니다."
 france_md.25.a: "또 다른 세상은 가능하다."
 france_md.26.t: "녹색당의 현황"
 france_md.26.d: "프랑스의 환경주의 정당은 1984년부터 존재해 왔지만, 우리가 바란 만큼의 성공을 거두지 못했습니다. 우리는 한 번도 진지하게 받아들여지지 않으며, 우리의 선거 기반은 도심 밖에서는 거의 찾을 수 없습니다. 우리가 존재감을 남기려면 다른 정당들과 협력하고 그들의 견해에 맞춰야 할 것입니다. 하지만 지구의 상태를 고려하면 우리가 마티뇽에 입성하는 일은 결국 합당한 것이 될 것입니다. 일단 그곳에 가면 우리는 후세를 위한 미래를 보장하기 위해 삶과 생산의 방식을 바꾸려 애쓸 것입니다. 장애물은 많지만 잠재적 동맹도 부족하지 않습니다."
 france_md.26.a: "시간이 얼마 남지 않았다."
 france_md.27.t: "프랑스 공산당의 현황"
 france_md.27.d: "프랑스 공산당은 굳게 결속했던 소련과 함께 무너졌습니다. 패배한 쪽에 서는 일은 결코 쉽지 않습니다. 우리의 처지는 위기 이상입니다. 신뢰를 잃어 가면서 노동 계층의 선거 기반은 극우나 기권 쪽으로 흘러가고 있습니다. 우리는 이 추세를 뒤집고 그들을 다시 끌어들일 새로운 방법을 찾아야 합니다. 당분간은 다른 정당들과 협상해야 할 것이 분명하지만, 일단 정권을 잡으면 옛 유권자들의 신뢰를 되찾고 자율성을 회복할 수 있을지도 모릅니다. 우리 당은 오랜 역사를 가졌고 여기서 멈출 수는 없습니다."
 france_md.27.a: "우리는 돌아올 것이다."
 france_md.30.t: "경제의 방향"
 france_md.30.d: "재무 장관을 선택할 때가 왔습니다. 우리나라는 개혁이 시급하여 재정 면에서 우리의 기대에 부합할 두 인물을 찾았습니다. 첫 번째는 우리 당 내부 출신인 올리비에 페랑이라는 인물로, 경제 분야에서의 경력 내내 이 분야에 정통해 왔습니다. 두 번째는 전직 재정 감찰관으로 정치는 처음이지만 우리 선거 운동을 지지했습니다. 사회자유주의적인 사회관은 우리가 되고자 하는 모습과 닮아 있으며, 그가 정부에 있으면 자유주의 진영의 승인을 얻을 수도 있을 것입니다."
 france_md.30.a: "운동의 쇄신이다! 에마뉘엘 마크롱을 즉시 베르시에 임명하라!"
 france_md.30.b: "아니, 진정으로 믿을 수 있는 사람을 앉히는 편이 낫다. 올리비에 페랑을 임명하라."
 france_md.150.t: "프랑스의 추가 원조"
 france_md.150.d: "프랑스 정부가 우리가 유럽 연합에 가입한 이래 겪고 있는 재정 위기에서 추가 도움을 주겠다고 제안했습니다. 이를 수락해야 하겠습니까?"
 france_md.150.a: "물론이다, 돈이 필요하다!"
 france_md.150.b: "아니다, 필요 없다."
 france_md.151.t: "국제 회의를 제안하는 프랑스"
 france_md.151.d: "프랑스 사회당이 전 세계 사회주의 지도자들의 회의를 조직하기로 했으며, 우리를 초청할 생각을 했습니다. 우리는 이를 통해 정통성을 얻을 수 있습니다. 참석해야 하겠습니까, 아니면 정중히 거절해야 하겠습니까?"
 france_md.151.a: "참석하겠다!"
 france_md.151.b: "아니다, 더 중요한 일이 있다."
 france_md.160.t: "사회당의 붕괴"
 france_md.160.d: "사회당 내부에서 1년간 이어진 불안과 분열 끝에, 당은 거의 아무것도 남지 않은 상태가 되었습니다. 역사적인 순간이지만, 프랑스 역사에서 그토록 중추적인 역할을 한 정당의 종말을 보는 것은 안타까운 일입니다. 제1서기직을 물려받는 이에게 그 임무는 무거울 것입니다."
 france_md.160.a: "실수가 있었다"
 france_md.161.t: "계속되는 이탈"
 france_md.161.d: "당원과 지지자의 상당수가 우리 집단과 거리를 두고 있습니다. 몰락을 피하려면 정치인과 대중의 지지를 유지하기 위해 쓸 수 있는 모든 수단을 동원해야 한다는 것이 분명합니다."
 france_md.161.a: "한시도 낭비할 수 없다!"
 france_md.162.t: "위협받는 우리 당"
 france_md.162.d: "전반적인 반대에도 불구하고 우리가 추진한 수많은 인기 없는 개혁은 우리에게 투표한 것이 옳은 선택이었는지 의문을 품는 주민들의 분노를 불러왔습니다. 게다가 우리가 흉내 내려 했던 자유주의 중도와의 수많은 연합은 당 내부에 많은 균열을 낳았습니다. 우리의 선택에 실망한 좌파는 급진 좌파의 품으로 넘어가겠다고 위협하고 있으며, 우파는 우리가 자유주의 후보들에 비해 너무 물렁하다고 여깁니다. 우리는 때때로 본의 아니게 그들을 도와주기도 했습니다. 기회가 아직 남아 있다면 그것을 얻기 위해 열심히 일해야 합니다."
 france_md.162.a: "아, 젠장."
 france_md.163.t: "누구의 탓인가?"
 france_md.163.d: "우리의 붕괴 이후 일부 유권자는 중도파로, 다른 일부는 스스로를 '단절' 좌파라 칭하며 '급진주의'를 내세우는 더 좌파적인 조직으로 옮겨 갔습니다. 이러한 태도는 언론의 거센 비판을 받으며 그들에 대한 반대를 결집시킵니다. 지금 우리가 어느 쪽 진영에 맞서기로 하느냐가 옛 유권자들이 우리에게 돌아올지를 결정할 것입니다."
 france_md.163.a: "어떤 종류의 극단주의자든 우리 사회를 위태롭게 한다"
 france_md.163.b: "극단적 중도가 나타내는 위험에 비하면 아무것도 아니다"
 france_md.164.t: "합동 군사 훈련을 제안하는 프랑스"
 france_md.164.d: "프랑스 외교관들이 합동 군사 훈련 제안을 보내 왔습니다. 실제로 최근의 국제 긴장 고조는 최악에 대비하기 위해 유럽 국가들 사이에서 단결하도록 우리를 독려하고 있습니다. 이는 언제든 터질 수 있는 고강도 분쟁에 대비해 우리 군을 훈련시킬 아주 좋은 구상이 될 수 있습니다. 그들에게 무엇이라고 답해야 하겠습니까?"
 france_md.164.a: "기꺼이, 그들과 함께 훈련하겠다"
 france_md.164.b: "아니다, 감사하지만 그들의 도움은 필요 없다"
 france_md.165.t: "닥쳐오는 폭풍"
 france_md.165.d: "여러 분야의 전문가들이 한동안 우리에게 지구상 어디에서든 경제 위기가 발생할 경우에 대비해 규제 조치를 마련하라고 제안해 왔습니다. 이번이 처음도 마지막도 아니겠지만, 이러한 조치는 그런 위기에 수반되는 혼란과 거리를 유지할 수 있게 해 줄 것입니다. 하지만 이는 경제 부문을 규제하고 운영을 감독할 많은 전문가에게 급여를 지급해야 함을 뜻합니다. 정말 이렇게 해야 하겠습니까? 우리의 금융 파트너들이 나쁘게 받아들일 수도 있습니다."
 france_md.165.a: "상황이 실로 매우 우려스럽다. 규제 조치를 시급히 마련해야 한다"
 france_md.165.b: "이는 사업에 해로워 보이는 추측일 뿐이다"
 france_md.170.t: "전쟁 배상을 제안하는 프랑스"
 france_md.170.d: "프랑스 정부는 우리 영토에서 7년간 벌어진 참혹한 인도차이나 전쟁에 대해 우리에게 보상하기로 결정했습니다. 이 돈은 독립을 위해 죽은 50만 베트남인의 목숨을 결코 대신할 수 없지만, 거절해서는 안 되는 명예로운 제스처입니다."
 france_md.170.a: "이제 미국인들을 기다린다"
 france_md.171.t: "전쟁 배상을 제안하는 프랑스"
 france_md.171.d: "프랑스 정부가 마침내 우리나라에서 저지른 범죄 일부를 인정하는 데 동의한 듯하며, 독립 전쟁에 대한 보상을 제안하고 있습니다. 이 돈은 자유를 위해 죽은 60만 알제리인의 목숨을 대신하지 못하지만, 서구인이 처음으로 자신의 죄를 인정하는 마당에 거절하는 것은 어리석은 일입니다."
 france_md.171.a: "때맞춰 잘 왔다."
 france_md.172.t: "핵 전문 기술을 제안하는 프랑스"
 france_md.172.d: "프랑스 대통령실이 적은 금액을 받고 자국의 핵 전문 기술을 우리와 공유하겠다고 제안했습니다. 이는 불안정한 원자를 다루고 최대한 활용하는 데 매우 유용할 수 있습니다. 수락하면 국민에게 전력을 밝혀 주고 이 분야 연구를 촉진하는 데 크게 도움이 될 것입니다. 그렇지만 이 돈을 프랑스에 우리나라에서 마땅하지 않은 자리를 내주는 일 말고 다른 곳에 쓸 수도 있을 것입니다."
 france_md.172.a: "우라늄 235 거래"
 france_md.172.b: "아니다, 시한폭탄은 당신들끼리 간직하라"
 france_md.173.t: "자국의 보호를 제안하는 프랑스"
 france_md.173.d: "세계가 여러 위기로 폭발하는 가운데, 프랑스는 유럽 동맹국들의 보호를 보장하기로 결정했습니다. 실제로 오늘 아침 프랑스 대통령실은 외국 유럽 강국의 침략이 있을 경우 핵무기 사용을 거론하는 한이 있더라도 개입을 망설이지 않을 것이라고 우리에게 확약했습니다. 이 보호는 그 자체로 주권의 상실이지만, 이런 시기에는 결정적일 수 있습니다."
 france_md.173.a: "아무리 조심해도 지나치지 않다"
 france_md.173.b: "그들의 보호는 필요 없다"
 france_md.175.t: "우리에게 제재를 가하는 유럽 연합"
 france_md.175.d: "우리의 최근 입장과 회원국들과 우리를 묶는 조약에서 탈퇴하려는 의지에 따라, 저 저주받을 유럽 관료들이 우리에게 벌금을 부과했습니다. 그렇더라도 우리에게 이를 내도록 강제하는 것은 없습니다. 변화를 갈망하는 우리 유권자들은 오히려 이를 나약함이나 배신의 표시로 볼 것입니다. 하지만 납부를 거부하면 유럽 회원국들과의 관계가 해를 입고 우리에 대한 제재가 촉발될 수 있습니다. 끝까지 가야 하겠습니까?"
 france_md.175.a: "우리는 규칙을 지키므로 벌금을 내겠다. 규칙을 따름으로써 승리할 것이다"
 france_md.175.b: "그것 말고 또 뭐가 있나? 우리는 이미 충분히 피를 빨렸다"
 france_md.180.t: "역사적 투표"
 france_md.180.d: "국민이 말했습니다. 프렉시트를 위한 긴 선거 운동 끝에, 저주받을 유럽주의자들의 함정과 우리의 성과를 가로채려 한 비열한 포퓰리스트들의 함정을 피한 끝에 우리는 해냈습니다. 프랑스는 가능한 한 빨리 유럽을 떠납니다. 분명히 저 브뤼셀의 뱀들은 우리에게 가능한 한 많은 대가를 치르게 하려 들겠지만, 이러한 제재는 우리가 되찾은 자유에 비하면 아무것도 아닙니다."
 france_md.180.a: "지금도 영원히도, 프랑스는 자유롭다"
 france_md.181.t: "유럽 연합을 탈퇴하는 프랑스"
 france_md.181.d: "수많은 유럽회의주의 허위 정보 선동 끝에 프랑스 민족주의 운동이 마침내 프랑스를 프렉시트 쪽으로 돌려놓는 데 성공했습니다. 프랑스의 탈퇴는 시간문제일 뿐이지만, 그럼에도 EU의 창립 회원이자 구조적 축을 이루는 나라가 이토록 빨리 떠나는 모습을 보는 것은 매우 심각한 일입니다."
 france_md.181.a: "포퓰리즘 앞에서 신중해야 한다"
 france_md.182.t: "우리의 영유권을 인정하는 프랑스"
 france_md.182.d: "프랑스 정부는 최근 우리에게서 빼앗긴 역사적으로 우리 것이었던 여러 영토에 대한 우리의 입장을 지지한다고 발표했습니다. 또한 양국 간 군사 협력의 시작도 제안했으며, 지금은 우리 군사 기반시설에 접근하는 시설에 한정됩니다. 이 갑작스러운 프랑스의 지지는 환영할 만하지만, 정말로 그들이 우리 기반시설의 혜택을 누리도록 허용해야 하겠습니까?"
 france_md.182.a: "물론이다, 그들은 우리를 지지하며 환영받아 마땅하다"
 france_md.182.b: "우리는 그들의 도움을 요청한 적이 없다. 거리를 유지하게 하라"
 france_md.183.t: "협력 심화를 제안하는 프랑스"
 france_md.183.d: "우리에게 유리한 입장을 여러 번 취하고 NATO에 대한 분명한 거부를 발표한 뒤, 파리는 경제적 유대에서 공통의 적에 맞선 완전한 군사 동맹에 이르기까지 협력을 심화하자고 제안했습니다. 이전 동맹국들을 이토록 빨리 버린 서구인들을 정말 믿을 수 있겠습니까?"
 france_md.183.a: "그 향수 세 상자를 주시오. 거래하겠소"
 france_md.183.b: "훈련은 사헬의 사구에서 하시겠소, 아니면 우리의 얼어붙은 스텝에서 하시겠소? 우리 군은 더욱 강해져서 나올 것이오"
 france_md.183.c: "그들은 혼자 있게 두자"
 france_md.184.t: "경제 협력을 수락한 모스크바"
 france_md.184.d: "모스크바의 답은 오래 걸리지 않았습니다. 우리 두 경제 모두 이 협정에서 이익을 얻을 수 있습니다. 우리의 사치품과 첨단 기술 제품에 상당한 시장이 열릴 뿐 아니라, 원자재가 필요한 우리 산업도 더 안심하게 될 것입니다. 이 역사적 협정은 우리에게 뜻밖의 횡재이자 유럽 연합의 관에 박는 못입니다. 연합을 만든 우리가 이제 그 최악의 적과 무역을 합니다."
 france_md.184.a: "샴페인과 석유가 흐르게 하라"
 france_md.185.t: "경제·군사 협력을 수락한 모스크바"
 france_md.185.d: "모스크바의 답은 오래 걸리지 않았습니다. 우리 두 경제와 군대 모두 이 협정에서 이익을 얻을 수 있습니다. 우리의 사치품과 첨단 기술 제품에 상당한 시장이 열릴 뿐 아니라, 원자재가 필요한 우리 산업도 더 안심하게 될 것입니다. 게다가 양국 군대 간 협력이 강화되면 새로운 전역에서 경험을 쌓고 그들의 기술적·전략적 발전의 혜택을 누릴 수 있습니다. 이 역사적 협정은 우리에게 뜻밖의 횡재이자 NATO의 관에 박는 못입니다. 이제 우리는 이 새 천년을 헤쳐 나갈 믿을 만한 파트너를 얻었습니다."
 france_md.185.a: "사헬에서 다시 만나겠지만, 이번에는 서로 싸우기 위해서가 아니다"
 france_md.187.t: "협상을 결렬시킨 러시아"
 france_md.187.d: "우리 외교관들이 기울인 모든 노력에도 불구하고 러시아 상대측과 합의에 이르지 못했습니다. 마치 우리와 거래할 의지가 없는 것처럼 말입니다. 유감스러운 일입니다. 양자 협정의 잠재력은 우리 두 나라에 귀중했을 것입니다. 또한 우리를 계속 손아귀에 두기 위해 옛 서구 친구들이 압력을 가했을 가능성도 배제할 수 없습니다. 하지만 심각한 일은 아닙니다. 다른 파트너를 찾을 것입니다."
 france_md.187.a: "미국이라는 암이 우랄까지 번졌구나. 나쁜 친구와 함께하느니 혼자가 낫다"
 france_md.188.t: "프랑스의 양보 요구"
 france_md.188.d: "프랑스에서 포퓰리즘이 승리하고 유럽 연합을 탈퇴한 이후, 프랑스는 우리에 대한 적대감을 계속 드러내 왔습니다. 탈퇴 이후 부과된 경제 제재는 프랑스에 아무런 상처도 남기지 않은 것이 아니었으나, 이제 회복을 마치고 배상을 요구하고 있습니다. 오늘 외교관들이 도착하여, 우리가 유럽 중앙은행에 영향을 미쳐 그들의 부채 금리를 낮추지 않으면 자국 영토에 대한 접근을 차단하겠다고 위협했습니다. 그들의 영토에 대한 접근 상실의 결과는 유럽 연합 내 교류를 크게 복잡하게 만들 수 있습니다. 그럼에도 그들의 협박에 굴복하는 것은 우리의 이점을 해로운 일에 쓰게 만들 것입니다."
 france_md.188.a: "저주받을 놈들. 가장 피해가 적은 길을 택하겠다"
 france_md.188.b: "소수 포퓰리스트들의 협박에 굴복하지 않겠다"
 france_md.189.t: "우리 요구에 굴복한 독일"
 france_md.189.d: "우리가 가한 압력에 따라 독일 정부는 마지못해 ECB에 압력을 넣어 우리의 금리를 낮추는 데 동의했습니다. 이는 옛 압제자들에 대한 대단한 복수입니다. 저 독일인들은 계속 우리의 로터리를 즐길 수 있겠지만, 그들 덕분에 우리는 브뤼셀의 비용으로 먹고삽니다."
 france_md.189.a: "눈에는 눈, 이에는 이, 가능하면 라틴어로"
 france_md.190.t: "우리 요구를 거부한 독일"
 france_md.190.d: "우리 외교관들은 독일 사촌들에게 무시당하고 빈손으로 베를린에서 돌아왔습니다. 우리의 요구가 너무 높았거나 그들이 우리 말고 다른 곳에서 찾으려는 것일지도 모릅니다. 오늘은 유럽 연합에 대한 복수를 이루지 못하겠지만, 이는 미룰 수 없는 일입니다."
 france_md.190.a: "우리는 자유롭지만 그들은 아니다. 동쪽 국경을 닫아라"
 france_md.191.t: "프랑스의 양보 요구"
 france_md.191.d: "프랑스에서 포퓰리즘이 승리하고 유럽 연합을 탈퇴한 이후, 프랑스는 우리에 대한 적대감을 계속 드러내 왔습니다. 탈퇴 이후 부과된 경제 제재는 프랑스에 아무런 상처도 남기지 않은 것이 아니었으나, 이제 회복을 마치고 배상을 요구하고 있습니다. 오늘 외교관들이 도착하여, 우리가 이민자 구금 작전에서 그들의 해상 및 해안 경찰을 대체하지 않으면 자국 영토에 대한 접근을 차단하겠다고 위협했습니다. 그들의 영토에 대한 접근 상실의 결과는 유럽 연합 내 교류를 크게 복잡하게 만들 수 있습니다. 그럼에도 그들의 협박에 굴복하는 것은 우리의 이점을 해로운 일에 쓰게 만들 것입니다."
 france_md.191.a: "저주받을 놈들. 가장 피해가 적은 길을 택하겠다"
 france_md.191.b: "소수 포퓰리스트들의 협박에 굴복하지 않겠다"
 france_md.192.t: "우리 요구에 굴복한 이탈리아"
 france_md.192.d: "우리가 가한 압력에 따라 이탈리아 정부는 마지못해 우리의 해상 국경에서 우리 경찰을 대체하는 데 동의했습니다. 이는 옛 압제자들에 대한 대단한 복수입니다. 저 이탈리아인들은 이민자 유입을 즐기며 기뻐하겠지만, 그들 덕분에 우리는 브뤼셀의 비용으로 먹고삽니다."
 france_md.192.a: "눈에는 눈, 이에는 이, 가능하면 라틴어로"
 france_md.193.t: "우리 요구를 거부한 이탈리아"
 france_md.193.d: "우리 외교관들은 라틴 이웃들에게 무시당하고 빈손으로 로마에서 돌아왔습니다. 우리의 요구가 너무 높았거나 그들이 우리 말고 다른 곳에서 찾으려는 것일지도 모릅니다. 오늘은 유럽 연합에 대한 복수를 이루지 못하겠지만, 이는 미룰 수 없는 일입니다."
 france_md.193.a: "우리는 자유롭지만 그들은 아니다. 남동쪽 국경을 닫아라"
 france_md.194.t: "프랑스의 양보 요구"
 france_md.194.d: "프랑스에서 포퓰리즘이 승리하고 유럽 연합을 탈퇴한 이후, 프랑스는 우리에 대한 적대감을 계속 드러내 왔습니다. 탈퇴 이후 부과된 경제 제재는 프랑스에 아무런 상처도 남기지 않은 것이 아니었으나, 이제 회복을 마치고 배상을 요구하고 있습니다. 오늘 외교관들이 도착하여, 우리가 유치하고 있는 기관들을 그들의 목적에 이용하지 않으면 자국 영토에 대한 접근을 차단하겠다고 위협했습니다. 그들은 우리에게 유럽 기관들의 결정과 그 정보기관들에 영향력을 행사하라고 요구합니다. 그들의 영토에 대한 접근 상실의 결과는 유럽 연합 내 교류를 크게 복잡하게 만들 수 있습니다. 그럼에도 그들의 협박에 굴복하는 것은 우리의 이점을 해로운 일에 쓰게 만들 것입니다."
 france_md.194.a: "저주받을 놈들. 가장 피해가 적은 길을 택하겠다"
 france_md.194.b: "소수 포퓰리스트들의 협박에 굴복하지 않겠다"
 france_md.195.t: "우리 요구에 굴복한 벨기에"
 france_md.195.d: "우리가 가한 압력에 따라 벨기에 정부는 유럽 기관들에 우리에게 유리하도록 압력을 넣는 데 동의했습니다. 이는 옛 압제자들에 대한 대단한 복수입니다. 저 벨기에인들은 의회에서 기꺼이 초과 근무를 할 것이며, 그들 덕분에 우리는 브뤼셀의 비용으로 먹고삽니다."
 france_md.195.a: "눈에는 눈, 이에는 이, 가능하면 라틴어로"
 france_md.196.t: "우리 요구를 거부한 벨기에"
 france_md.196.d: "우리 외교관들은 왈롱과 플랑드르 형제들에게 무시당하고 빈손으로 브뤼셀에서 돌아왔습니다. 우리의 요구가 너무 높았거나 그들이 우리 말고 다른 곳에서 찾으려는 것일지도 모릅니다. 오늘은 유럽 연합에 대한 복수를 이루지 못하겠지만, 이는 미룰 수 없는 일입니다."
 france_md.196.a: "우리는 자유롭지만 그들은 아니다. 북쪽 국경을 닫아라"
 france_md.197.t: "프랑스의 양보 요구"
 france_md.197.d: "유럽 연합을 탈퇴하고 그에 따른 제재에서 회복한 프랑스는 우리에 대한 적대감을 계속 드러내고 있습니다. 오늘 프랑스 외교관들이 도착하여, 우리가 영토 내에 보유된 은행 계좌의 상세 명부를 넘기지 않으면 프랑스 영토에 대한 접근을 차단하겠다고 위협했습니다. 이는 우리가 지키려 애쓰는 금융 비밀 보호에 대한 중대한 침해입니다. 그 접근을 잃으면 연합 전역에서의 우리 무역이 복잡해지겠지만, 굴복하면 우리가 그들의 협박에 공모하는 셈이 됩니다."
 france_md.197.a: "저주받을 놈들. 가장 피해가 적은 길을 택하겠다"
 france_md.197.b: "소수 포퓰리스트들의 협박에 굴복하지 않겠다"
 france_md.198.t: "우리 요구에 굴복한 룩셈부르크"
 france_md.198.d: "우리가 가한 압력에 따라 룩셈부르크 정부는 마지못해 자국 은행 업계에 압력을 넣어 그들이 보유한 계좌의 상세 명부를 우리에게 제공하는 데 동의했습니다. 우리는 의무에서 벗어나려는 수많은 반역자를 찾아냈을 뿐 아니라, 우리 영토에 거주하는 많은 민간 기업에 관한 정보도 얻었습니다. 이러한 발견은 불량 애국자를 추적하고 우리나라에서 우리를 속이려 한 기업들에 대가를 치르게 하려는 세무 당국의 노력에 도움이 될 것입니다. 룩셈부르크인들은 은행업에서의 신뢰를 크게 잃었을지 모르나, 그들 덕분에 우리는 브뤼셀의 비용으로, 그리고 저주받을 자유 무역의 희생으로 먹고삽니다."
 france_md.198.a: "눈에는 눈, 이에는 이, 가능하면 라틴어로"
 france_md.199.t: "우리 요구를 거부한 룩셈부르크"
 france_md.199.d: "우리 외교관들은 백만장자 이웃들에게 무시당하고 빈손으로 룩셈부르크에서 돌아왔습니다. 우리의 요구가 너무 높았거나 그들이 우리 말고 다른 곳에서 찾으려는 것일지도 모릅니다. 오늘은 유럽 연합에 대한 복수를 이루지 못하겠지만, 이는 미룰 수 없는 일입니다."
 france_md.199.a: "우리는 자유롭지만 그들은 아니다. 북동쪽 국경을 닫아라"
 france_md.200.t: "프랑스의 양보 요구"
 france_md.200.d: "유럽 연합을 탈퇴하고 그에 따른 제재에서 회복한 프랑스는 우리에 대한 적대감을 계속 드러내고 있습니다. 오늘 프랑스 외교관들이 도착하여, 우리가 남부에서 우리 자체 사업과 직접 경쟁하는 감귤 프로젝트를 개발 중인 그들의 농업 부문을 돕지 않으면 프랑스 영토에 대한 접근을 차단하겠다고 위협했습니다. 그 접근을 잃으면 연합 전역에서의 우리 무역이 복잡해지겠지만, 굴복하면 우리가 그들의 협박에 공모하는 셈이 됩니다."
 france_md.200.a: "저주받을 놈들. 가장 피해가 적은 길을 택하겠다"
 france_md.200.b: "소수 포퓰리스트들의 협박에 굴복하지 않겠다"
 france_md.201.t: "우리 요구에 굴복한 스페인"
 france_md.201.d: "우리가 가한 압력에 따라 스페인 정부는 프랑스와 스페인 시장을 뒤덮을 우리의 새 감귤 품종의 생산과 판매에 기술적·상업적 지원을 제공하는 데 동의했습니다. 스페인인들은 이제 손가락만 깨물 수 있을지 모르나, 그들 덕분에 우리는 브뤼셀의 비용으로 먹고살며 대륙에 대한 우리의 식량 패권을 보여 주었습니다."
 france_md.201.a: "눈에는 눈, 이에는 이, 가능하면 라틴어로"
 france_md.202.t: "우리 요구를 거부한 스페인"
 france_md.202.d: "우리 외교관들은 이베리아 이웃들에게 무시당하고 빈손으로 마드리드에서 돌아왔습니다. 우리의 요구가 너무 높았거나 그들이 우리 말고 다른 곳에서 찾으려는 것일지도 모릅니다. 오늘은 유럽 연합에 대한 복수를 이루지 못하겠지만, 이는 미룰 수 없는 일입니다."
 france_md.202.a: "우리는 자유롭지만 그들은 아니다. 남서쪽 국경을 닫아라"
 france_md.203.t: "여정의 끝"
 france_md.203.d: "몇 달에 걸친 대화와 내용을 둘러싼 투쟁 끝에, 헌법 개정안이 마침내 표결에 부쳐질 준비를 마쳤습니다. 정치적 반대자들이 초안 작성 과정을 이용해 자신들의 이상에 부합하는 조항을 끼워 넣었을 수도 있으나, 이토록 긴 과정 끝에 국민에게 투표권을 주지 않는다면 국민은 당연히 배신당했다고 느낄 것입니다. 헌법 제11조에 따라 국민투표를 소집하는 것은 오로지 우리의 결정이며, 그 결과는 우리만이 책임질 것입니다."
 france_md.203.a: "이제 끝을 맺을 때다. 국민투표를 소집한다"
 france_md.203.b: "이 개정안은 너무 위험하므로 표결에 부쳐서는 안 된다"
 france_md.204.t: "개정안 통과"
 france_md.204.d: "오늘은 역사적인 날입니다. 처음으로 온 국민이 자신들의 헌법 제정에 참여했습니다. 투표 결과는 놀랍지 않게도 찬성의 압도적 승리였습니다. 물론 프랑스인에게 자신의 권리를 스스로 결정할 권리를 주면, 그는 자신에게서 그것을 박탈하지 않을 것입니다. 이 개정안은 완벽하지 않을지 모르나, 오늘 시작되는 새 시대를 반영하며, 우리는 이것이 시민의 권리를 수호하는 동시에 국민이 정치적 반대자들의 달콤한 유혹에 넘어가지 않도록 하기 위해 최선을 다했습니다. 여기서 제5공화국은 끝나고, 이 분명하고 압도적인 찬성과 함께 제6공화국이 시작됩니다."
 france_md.204.a: "영광의 날이 왔다"
 france_md.205.t: "크게 부결된 개정안"
 france_md.205.d: "모든 예상과 달리, 우리가 몇 달에 걸쳐 계획한 헌법 개정은 투표함에서 부결되었습니다. 우리가 토론을 이끈 것이 사람들에게 조종하려 했다는 인상을 남겼을 수도 있고, 시민들이 변화를 원하면서도 그것이 어떤 모습이어야 하는지에 합의하지 못했을 수도 있습니다. 모든 것을 잃은 것은 아닙니다. 법률을 하나씩 통과시키며 공화국에 대한 우리의 구상을 계속 추진할 수 있으나, 우리가 바랐던 전면적 개혁은 기다려야 할 것입니다."
 france_md.205.a: "전혀 이해할 수 없다"
 france_md.206.t: "제도 토론 제1부"
 france_md.206.d: "제도 문제는 1958년 제5공화국이 수립되어 대통령 권력이 제4공화국의 불안정을 대체한 이래 프랑스를 갈라놓았습니다. 그 권력은 이제 지나치다고 여겨지며, 악의를 가진 대통령이 견제 장치가 거의 없이 진전을 막을 수 있게 하는 한편, 더 대표성이 있는 국민의회는 독자적인 배타적 권한을 거의 쥐지 못합니다. 이 낡은 헌법을 개편하는 일이 이제 테이블에 올라 있으며, 우리가 어디까지 가느냐에 따라 권력이 다시 의회로 기울지, 대통령직에 남을지가 결정될 것입니다."
 france_md.206.a: "의회에 끊임없이 위협받지 않는 것은 꽤 실용적이다"
 france_md.206.b: "대통령제 공화국을 타도하라. 대통령은 국화 전시회 개막 테이프나 끊게 될 것이다"
 france_md.206.c: "적극적인 시민 참여를 장려하는 데만 집중하자"
 france_md.207.t: "타협의 승리"
 france_md.207.d: "며칠에 걸친 숙의 끝에 시민들은 권력의 재균형에 합의한 듯합니다. 49.3조는 당연하게도 민중의 분노가 향한 첫 번째 표적이었습니다. 대통령 권한은 가볍게 넘어갔고 국민은 자신들의 작업에 만족하는 듯합니다. 이제 민주적 쿠데타는 가능성이 낮아 보입니다. 우리의 제도는 정통성과 효율성을 얻습니다. 대통령 군주제의 종식을 약속받았던 가장 헌신적인 지지자들의 약간의 실망은 안타까울 뿐입니다. 우리가 어떻게 생각하든 국민이 결정했습니다. 이제 다음 토론으로 관심을 돌릴 수 있습니다."
 france_md.207.a: "좋다, 다음 질문으로! 우리 집무실은 이번 일을 꽤 잘 넘겼다."
 france_md.208.t: "대통령 독재의 종말"
 france_md.208.d: "시민들은 마침내 합의에 이르렀습니다. 제5공화국은 남용된 대통령 결정으로 너무 많은 원한을 쌓았으며, 한 사람의 변덕에 그토록 큰 권력이 달려 있는 위험을 더는 감수할 수 없습니다. 대통령의 권한은 이제 총사령관의 직무와 엘리제궁의 의례적 인물로 한정되며, 국민의회는 다시 한번 전능해집니다. 개혁은 안정성을 일부 잃을 수 있으나 훨씬 쉽게 진행될 것이고, 이로 인해 제도에 대한 프랑스인의 신뢰는 커질 것입니다."
 france_md.208.a: "그렇게 하라. 토론을 계속하자."
 france_md.209.t: "제도 토론 제2부:"
 france_md.209.d: "제도 토론이 마무리되면서 한 가지 문제가 시민들을 갈라놓고 있습니다. 대통령에게 책임을 지는 비밀 기관에 대한 감독입니다. 이 기관들은 오랫동안 프랑스의 이익을 수호해 왔지만, 1981년 오리올 살인 사건을 비롯한 과거의 행태와 법 밖에서 행동할 수 있는 자유는 투명성에 대한 우려를 낳았습니다. 더 큰 개방성은 우리 제도에 대한 신뢰를 쌓겠지만, 갈수록 불안정해지는 세계에서의 우리 안보는 가볍게 여길 수 없습니다."
 france_md.209.a: "시민의 안전이 무엇보다 우선이다! 사생활이 지나치게 위협받지 않도록만 하겠다."
 france_md.209.b: "국민에게는 투명성이 필요하다! 국민에게는 정의가 필요하다. 국가는 시민에게 답해야 한다."
 france_md.209.c: "이 토론은 긴장을 너무 많이 일으킨다. 거리를 두는 편이 낫다."
 france_md.210.t: "온전히 살아남은 비밀 기관"
 france_md.210.d: "시민들은 비밀 기관을 행정부의 통제 아래 두기로 결정했습니다. 실제로 특히 이런 시기에는 우리의 수동적 방어가 외국의 악의적 행위와 테러로부터 우리를 보호하는 최전선에 있어야 합니다. 그럼에도 이 결과는 더 큰 투명성과 민주주의를 원했던 우리 활동가들을 실망시켰습니다. 많은 시민은 평시에 국가 방위가 자신들의 사생활을 대가로 해서는 안 된다고 계속 생각합니다. 또 일부는 악의를 가진 정부가 이 기관들을 반대 세력을 감시하거나 반대 세력에 대한 정보 유출을 막는 데 오용할 것을 두려워합니다. 유권자들이 결정했고, 그들은 자유보다 안보를 택했습니다. 어쨌든 그것은 그들의 선택입니다."
 france_md.210.a: "힘이 국제법보다 앞서는 세계에서 경계를 늦출 때가 아닌 것이다."
 france_md.211.t: "걷힌 장막"
 france_md.211.d: "힘겨운 협상 끝에 우리는 마침내 비밀 기관의 완전한 불투명성을 끝내기로 결정했습니다. 많은 시민은 자신도 모르게 끊임없이 감시당하고 있다는 사실을 알고 더는 안전하다고 느끼지 못했으며, 우리의 해외 개입은 시민들이 신문으로 알고 싶어 하지 않을 논란을 자주 일으킵니다. 이 새로운 투명성은 우리가 국내 안보와 대외 영향력을 일부 잃더라도 시민들이 경찰과 군대에 더 큰 신뢰를 갖게 할 것입니다."
 france_md.211.a: "외세의 간섭으로부터 우리를 지켜 줄 비밀 기관은 필요 없다."
 france_md.212.t: "개인 권리 토론 제1부:"
 france_md.212.d: "개인 권리 문제는 헌법 토론의 핵심에 있습니다. 국가에 맞서 개인의 자유를 강화해야 합니까, 아니면 집단 안보를 우선해야 합니까? 논의는 개인 정보 보호, 사생활에 대한 권리, 국가 감시의 한계에 집중됩니다. 진보주의자들은 기본권의 확대를 주장하는 반면, 보수주의자들은 공권력의 약화를 우려합니다. 이 문제에 대한 우리의 입장은 새 헌법의 방향을 부분적으로 결정할 것입니다."
 france_md.212.a: "개인의 자유를 확고히 수호한다."
 france_md.212.b: "집단 안보가 우선되어야 한다."
 france_md.212.c: "우리 없이 토론이 계속되게 하라."
 france_md.213.t: "개인 자유의 승리"
 france_md.213.d: "토론은 개인의 자유를 강화하는 쪽으로 결론이 났습니다. 새 헌법은 국가가 시민의 사생활에 침입하는 것에 대한 보호를 강화하여 보장할 것입니다. 진보주의자들의 이 승리는 공권력과의 관계에서 전환점이 되지만, 일부는 국가 안보에 미칠 영향을 걱정합니다."
 france_md.213.a: "시민들은 이 새로운 보장에 기뻐할 수 있다."
 france_md.214.t: "안보의 우세"
 france_md.214.d: "자유 옹호자들의 노력에도 불구하고, 헌법 토론에서는 안보 중심의 관점이 승리했습니다. 국가는 폭넓은 감시 및 개입 권한을 유지할 것입니다. 이는 인구 일부를 안심시키지만, 시민권 활동가들은 민주주의의 후퇴라고 규탄합니다."
 france_md.214.a: "안정에는 대가가 따른다."
 france_md.215.t: "개인 권리 토론 제2부:"
 france_md.215.d: "우리나라는 소요로 유명하며, 선거 결과가 어떠하든 불만은 결국 거리로 번집니다. 시위 중 시민을 보호하는 문제가 이제 의제에 올랐습니다. 한쪽에는 경찰의 과잉 대응이, 다른 쪽에는 불충분한 보호가 있으며 많은 시위가 부상으로 끝납니다. 경찰을 억제하면 국민의 신뢰를 회복하겠지만 비용이 늘어나고, 경찰을 지지하면 질서는 유지되나 운동이 급진화되면서 추가 사건의 위험이 있습니다."
 france_md.215.a: "경찰력을 규제해야 한다."
 france_md.215.b: "그들이 맡은 일을 하게 두자."
 france_md.215.c: "국민이 결정할 것이다. 어차피 그들은 이 법에 항의하러 거리에 나올 것이다."
 france_md.216.t: "경찰 제한을 택한 국민"
 france_md.216.d: "몇 시간의 토론 끝에 다수는 새로운 스캔들을 막기 위해 경찰력을 규제해야 한다는 데 동의했습니다. 치안 유지 기술은 향상되고 있으며 우리는 이미 이 점에서 매우 효과적인 국가이므로 더 나아갈 필요는 없습니다. 게다가 시위대의 심각한 신체 부상을 피하면 의료 지출이 줄어들 것이 분명합니다. 국가도 국민에게 더 많이 답해야 하는데, 국민이 덜 위험하게 거리에서 시위할 수 있기 때문입니다. 다만 법 집행의 효과가 떨어질 것이므로 경찰에 대한 추가 비용이 예상됩니다."
 france_md.216.a: "그렇다면 우리 국민은 계속 우리를 견제할 것이다. 다음 질문으로!"
 france_md.217.t: "질서를 택한 국민"
 france_md.217.d: "우리가 선호했던 결과는 아니지만, 경찰의 효율성이 승리했습니다. 일부 시위가 변질되어 광범위한 재산 피해를 낳는 것은 사실이므로, 치안 기관의 효율성이 떨어지는 만큼 외부 감독이 필요합니다. 우리는 전례 없는 예산 위기와 사회 위기에 직면해 있으며, 어느 시점에는 국민 일부를 적으로 돌려야 할 것입니다. 따라서 어떤 사회 운동이 닥쳐도 맞설 수 있는 능력을 갖추는 것이 여전히 중요합니다. 어쨌든 그들이 우리를 선출했으니까요."
 france_md.217.a: "국민은 우리에게 책임을 묻는 권리보다 안보를 택했다. 그들을 탓할 수 있겠는가? 다음 질문으로."
 france_md.218.t: "경제 토론 제1부"
 france_md.218.d: "경제 운영은 미래 정부의 몫이겠지만, 우리는 지금 사회적, 생태적, 경제적 기본 원칙을 헌법에 명시하여 이를 위반하는 법률을 위헌으로 만들 수 있습니다. 사회적 보호를 우선하면 일자리와 복지가 보장되지만 생태가 뒤처지고 그에 따른 부채가 투자자를 불안하게 할 수 있습니다. 생태를 우선하면 삶의 질이 향상되고 새로운 에너지원으로의 전환이 이뤄지지만 일부 수입과 투자가 뒤처집니다. 또한 다른 세력과 불화를 심기 위해 경제를 지지하는 척할 수도 있고, 이 문제를 그들에게 완전히 맡길 수도 있습니다."
 france_md.218.a: "사회적 지원이 우선이다! 우리는 시민 곁에 서야 한다."
 france_md.218.b: "지구는 우리가 가만히 앉아 있기에는 너무 빠르게 훼손되고 있다."
 france_md.218.c: "좋은 생각이다. 자유주의자들이 배후에 있다고 믿게 만들겠다."
 france_md.218.e: "다른 정당들이 이 문제를 두고 서로 물어뜯게 두자."
 france_md.219.t: "사회적 지원 우선을 택한 국민"
 france_md.219.d: "오랜 시간 망설인 끝에 시민들은 마침내 공화국의 사회적 기둥에 합의했습니다. 실제로 평범한 사람들과 그들의 일자리를 보호함으로써 우리는 더 나은 미래로의 건전한 전환을 보장할 것입니다. 게다가 우리 공장이 기준에 맞게 지어져 이곳에서 오염을 일으키는 편이, 이 문제에 덜 신경 쓰는 나라로 이전되는 것보다 낫습니다. 이 결과는 놀랍지도 나쁜 소식도 아닙니다."
 france_md.219.a: "우리가 답을 제시할 수 있었던 또 하나의 질문이다. 잘했다."
 france_md.220.t: "생태를 택한 국민"
 france_md.220.d: "이 결과는 우리를 불쾌하게 하지 않습니다. 실제로 지구의 건강은 그 거주자들의 건강으로 되돌아옵니다. 따라서 이러한 각성이 사회의 여러 층위에서 일어난 것은 놀랍지 않을뿐더러 오히려 유익합니다. 그러므로 우리는 삶의 방식과 재화 및 에너지를 생산하는 방식을 바꾸는 법을 배워야 할 것입니다. 그 길은 장애물로 가득하며 항상 다수의 이익에 부합하지는 않을 것입니다. 그러나 이것이 우리가 따라야 할 길입니다."
 france_md.220.a: "이제 대기업에 투표한 사람들을 재활용하는 일만 남았다."
 france_md.221.t: "경제를 택한 국민"
 france_md.221.d: "오늘 토론의 결과는 놀라운 것이었습니다. 국민은 이 나라의 발전을 이끌기 위해 모든 종류의 기업을 보호하기로 택했습니다. 일부는 여전히 낙수 효과 이론을 믿고 있음을 알 수 있습니다. 또한 언론이 흔히 소수 과두 지배층의 손에 있으니, 그들이 저울을 기울이기 위해 가능한 모든 일을 했으리라는 짐작도 할 수 있습니다. 우리 활동가들에게는 다소 실망스러운 하루입니다. 그러나 이제 와서 주권을 가진 국민의 의견을 문제 삼을 수는 없습니다."
 france_md.221.a: "국민의 의견을 묻는 것이 정말 그렇게 좋은 생각이었나?"
 france_md.222.t: "경제 토론 제2부"
 france_md.222.desc: "다른 사회 문제는 미래의 공화국들로 미루어지겠지만, 헌법의 방향은 지금 정할 수 있습니다. 우리의 탁월하지만 비용이 많이 드는 사회 보장을 누가 부담해야 합니까? 이번 개혁이 지금 과세, 예산 재원, 지출 삭감과 관련해 무엇을 결정하든 그것은 여러 세대에 걸쳐 우리 복지 국가의 재정적 근간을 형성할 것입니다."
 france_md.222.a: "자본주의를 타도하라!"
 france_md.222.b: "국가가 제도를 재정적으로 뒷받침한다. 새로운 세금은 피하도록 최선을 다하겠다."
 france_md.222.c: "시민들을 실직 상태로 내몰 위험을 감수할 수는 없다."
 france_md.222.d: "이 토론에 관여하지 않는 편이 낫다."
 france_md.223.t: "자본 과세를 택한 국민"
 france_md.223.d: "최근 몇 주간의 긴 토론은 이 이념 대결에서 우리의 승리로 끝났습니다. 국민의 사회 보장을 위한 재원을 대는 것은 자본과 최고 부유층의 소득이 될 것입니다. 이 상징적 행위는 거대 자본에 맞선 국민의 큰 승리입니다. 금융에 대한 프랑스의 승리는 옛 지배자들에 맞서 하나로 뭉친 모든 국민의 승리입니다. 경제에 관한 우리 토론은 당분간 끝났지만, 우리는 다가올 세대를 위한 터전을 마련했습니다. 이렇게 몇 가지 개혁만으로 우리는 혁명을 이루었습니다."
 france_md.223.a: "프랑스 국민의 위대한 승리다."
 france_md.224.t: "국가의 역할을 재확인한 국민"
 france_md.224.d: "지난주 토론의 결과는 분명합니다. 국민은 현재의 경제를 뒤엎기를 원하지 않습니다. 이것이 텔레비전에서 매일 쏟아지는 신자유주의 선전 때문일까요? 아마 그럴 것이지만, 국민의 평결만이 중요한 유일한 것이므로 우리는 이를 받아들여야 합니다. 적어도 이 사업의 재원을 대기 위해 다른 국가 서비스의 삭감을 부추기지 않았다는 점은 다행이지만, 우리의 후임자들은 우리 제도의 재원을 대기 위해 사회에 덜 관대할 수 있습니다. 우리는 그런 일이 일어나지 않도록 하겠습니다."
 france_md.224.a: "우리가 바랐던 승리는 아니지만 이것으로 만족해야 할 것이다."
 france_md.225.t: "다른 곳의 삭감을 택한 국민"
 france_md.225.d: "평결이 이렇게 나올 줄 알았다면 이 토론을 투표에 부치지 않았을지도 모르지만, 이제 와서 그런 생각을 하기엔 너무 늦었습니다. 실제로 국민은 방금 우리 사회 제도의 운명을 결정했습니다. 그들은 앞으로의 입법부가 필수 국가 서비스는 보존하되 다른 국가 지출은 삭감하도록 권고했습니다. 그들의 주된 표적은 아마도 공무원과 그들이 필수적이라고 여기지 않는 많은 보조금이 될 것입니다. 사회 보호 제도는 재원이 마련되겠지만, 우리는 방금 자유주의라는 늑대가 국가 회계에 들어오는 것을 정당화했습니다. 우리가 집권하는 동안은 막을 수 있겠으나 미래 정부가 무엇을 할지는 아무도 모릅니다."
 france_md.225.a: "이 헌법 개혁은 정확히 계획대로 진행되고 있지 않다."
 france_md.226.t: "사회 문제 토론 제1부:"
 france_md.226.d: "프랑스의 소수자 통합 제도는 오랫동안 공화주의 교육과 능력주의라는 '용광로' 이상에 의존해 왔지만, 그 원칙은 한계를 드러내고 있습니다. 사회적 이동성의 하락은 실업과 공동체주의적 이탈을 키웁니다. 이제 토론은 이 제도의 개혁으로 향합니다. 더 포용적인 모델을 추진하면 여러 세대에 걸쳐 지배해 온 틀을 흔들 위험이 있지만, 손대지 않고 두면 반대자들에게 그것을 오히려 경직시킬 기회를 주게 될 뿐입니다. 어느 쪽이든 여기서 우리의 선택은 앞으로 여러 세대 동안 나라를 빚어낼 것입니다."
 france_md.226.a: "가능한 한 많은 사람이 더 나은 삶을 누릴 수 있도록 제도는 더 포용적이어야 한다."
 france_md.226.b: "시민들이 이 문제를 스스로 결정하게 하자."
 france_md.227.t: "제도 조정을 택한 국민"
 france_md.227.d: "토론의 결과는 우리의 새 천년에 내재한 다양성에 맞춰 현행 제도를 조정하는 쪽으로 기운 듯합니다. 우리는 분명 자원을 투자해야 하겠지만, 이러한 포용을 허용함으로써 우리 제도는 우리나라로 흘러드는 새로운 인재를 놓치지 않을 것입니다. 모두에게 손에 닿는 미래를 줌으로써 우리는 사회 안정을 돕는 동시에 장기적 발전도 도모했습니다."
 france_md.227.a: "우리는 타인에게서 배울 것이 매우 많다."
 france_md.228.t: "현행 제도 강화를 택한 국민"
 france_md.228.d: "우리의 노력에도 불구하고 현재 사회는 우리 공화국의 근본을 문제 삼을 준비가 되어 있지 않은 듯합니다. 프랑스의 통합 제도는 여전히 밝은 미래가 있는 듯 보입니다. 이번 투표는 기능 장애에도 불구하고 이미 자리 잡고 있다는 장점을 지닌 제도에 대한 프랑스인의 애착을 확인해 줍니다. 이 제도는 장기적으로 언제든 개혁할 수 있지만, 우리는 또 하나의 요새를 무너뜨릴 기회를 놓쳤습니다."
 france_md.228.a: "안타깝다"
 france_md.229.t: "사회 문제 토론 제2부:"
 france_md.229.d: "예배의 자유는 우리 천년에서 가장 뜨거운 문제 가운데 하나입니다. 제3공화국의 정교분리법 이래 프랑스는 시민 자신의 자유를 희생하면서까지 이를 맹렬히 지켜 왔으며, 그중에서도 공립 초등학교에서의 종교 상징 금지가 대표적인데, 이 규정은 갈수록 긴장된 국민적 논쟁의 중심에 서고 있습니다. 이 법적 틀을 완화하면 공동체 간 관계를 안정시킬 수 있지만, 시민들이 소중히 여기는 근본적 법률에 의문을 제기해야 합니다."
 france_md.229.a: "우리 사회는 종교 공동체의 인정 욕구에 적응해야 한다."
 france_md.229.b: "시민들이 이 문제를 스스로 결정하게 하자."
 france_md.230.t: "정교분리 완화를 택한 국민"
 france_md.230.d: "정교분리에 관한 토론은 현행 법적 틀을 완화하는 쪽으로 끝났습니다. 종교 상징의 착용은 결국 이전보다 더 많은 곳에서 일상화될 것입니다. 다양한 신앙도 국가의 우위와 종교로부터의 분리를 유지하면서 사회에서 더 큰 대표성을 가질 권리를 얻게 됩니다. 이는 승리입니다. 옛 제도의 가장 좋은 부분을 지키면서 가장 논란이 되는 부분은 완화하는 데 성공했기 때문입니다. 이 근본적 법률의 틈이 예배의 자유를 보호하는 이 틀에 대한 점진적인 의문 제기로 이어지지 않기를 바랄 뿐입니다. 이 점에서는 우리 후임자들을 믿을 수 있습니다."
 france_md.230.a: "잘되어야 할 텐데."
 france_md.231.t: "정교분리법 강화를 택한 국민"
 france_md.231.d: "정교분리에 관한 토론을 시작하는 것이 기존보다 더 엄격한 제도를 낳으리라고는 예상하지 못했습니다. 감수할 만한 위험이었고, 우리는 그것을 감수했습니다. 이제 종교 상징은 공공 기관에서 더욱 용납되지 않을 것입니다. 우리 선조들이 우리가 그 방향으로 이만큼 멀리 밀어붙이리라고 예견했을까요? 우리는 지금 여기 있으며, 이러한 변화가 우리를 어디로 이끄는지 지켜볼 것입니다. 분명한 것은 우리의 관용이라는 이상이 그 어느 때보다 멀어 보인다는 점입니다."
 france_md.231.a: "적어도 양심의 자유는 여전히 보장된다."
 france_md.235.t: "내일의 공화국 건설"
 france_md.235.d: "우리의 임기가 시작되었으니, 가장 기다려 온 공약인 제6공화국을 출범시킬 때입니다. 우리가 강요가 아니라 토론을 통해 이루고자 하는 이 새로운 공화국은, 시민들이 내일 사회의 토대를 놓는 동안 몇 달간 그들의 관심을 사로잡을 것입니다. 우리는 토론이 표류하지 않도록 때때로 방향을 잡아야 할 수도 있지만, 지나치게 관여하는 것처럼 보이면 국민의 신뢰를 잃을 위험이 있습니다. 이 프로젝트는 끝까지 완수되어야 하며, 우리가 민주주의 자체를 지연시키는 것처럼 보이지 않을 만큼 빨라야 합니다."
 france_md.235.a: "제5공화국은 마지막 순간을 맞고 있다"
 france_md.236.t: "좌초한 제6공화국"
 france_md.236.d: "몇 주째 토론 공간은 텅 비어 있고 제6공화국 프로젝트는 전쟁이나 위기가 아니라 순전한 무관심으로 정체되고 있습니다. 토론을 조직하고 시민들의 기여에 따라 움직이는 데 너무 오래 걸린 탓에 우리가 북돋운 대중의 열의가 사그라들고 말았습니다. 제도를 바꿀 우리의 기회는 이제 빠져나가고 있습니다. 이 작업의 일부는 여전히 일반 개혁으로 추진할 수 있지만 우리가 바랐던 범위에는 못 미치며, 우리는 나라의 최고 법인 헌법에 내재한 불의를 바로잡는 데 실패했습니다."
 france_md.236.a: "우리는 제도를 바꿀 기회를 놓쳤다"
 france_md.238.t: "우리에게 금수 조치를 취하는 프랑스"
 france_md.238.d: "프랑스는 물자 인도에서 일반 무역에 이르기까지 모든 것을 포괄하는 우리에 대한 전면 금수 조치를 발표했습니다. 불복하는 프랑스의 당선 이래 파리는 팔레스타인 문제를 두고 우리에 대한 수사를 강경하게 바꾸었으며, 우리 정부가 이 지역의 분쟁을 부추긴다고 비난하다가 이제는 아예 우리에게 금수 조치를 취하기에 이르렀습니다. 설상가상으로 그들은 나머지 유럽에 동참하도록 로비를 벌이고 있습니다. 우리의 유럽 무역 파트너는 필수적이며, 이 캠페인이 성공하도록 둘 수는 없습니다."
 france_md.238.a: "그들은 많은 이들을 설득하지 못할 것이다"
 france_md.239.t: "이스라엘 국가에 대한 금수 조치를 요청하는 프랑스"
 france_md.239.d: "프랑스가 이스라엘 국가에 금수 조치를 취하기로 결정한 데 따라, 프랑스 외교관들이 우리에게 접촉하여 같은 조치를 취하라고 촉구했습니다. 그들은 정당화 근거로 이웃 나라들에 대한 이스라엘 국가의 공격적 정책, 그에 따른 지역의 불안정, 그곳의 인도적 상황을 듭니다. 이러한 주장에는 일리가 없지 않으며, 우리 유권자의 상당수가 이를 지지합니다. 그러나 그러한 행동은 국제적으로 우리에게 큰 대가를 치르게 할 위험이 있고, 게다가 우리에게는 이스라엘 동맹에서 등을 돌릴 지정학적 이익이 없습니다. 어떻게 결정해야 하겠습니까?"
 france_md.239.a: "당연히 이스라엘 국가는 팽창주의 정책을 억제해야 한다"
 france_md.239.b: "우리는 이스라엘 파트너를 저버리지 않겠다"
 france_md.240.t: "우리나라의 안정화 지원을 제안하는 프랑스"
 france_md.240.d: "한 세기의 식민 지배와 수십 년의 신식민주의 끝에 프랑스의 아프리카 정책이 방향을 바꾼 것으로 보입니다. 그들은 우리나라에 대한 통제를 줄이는 한편 안정화를 돕겠다고 제안합니다. 이 소식은 축복처럼 보이며, 우리나라는 이 원조가 그 어느 때보다 필요합니다. 그럼에도 이 원조에는 주민 사이의 이완과 함께 가는 평화에 대한 필수적인 약속이 따를 가능성이 큽니다. 우리의 옛 식민 지배자는 이제 자신의 행동의 결과를 성찰한 듯합니다. 우리도 그렇게 해야 하겠습니까?"
 france_md.240.a: "원조는 언제나 환영이다"
 france_md.240.b: "우리는 그들이 필요 없다. 그들은 이곳에서 더 이상 아무것도 아니다"
 france_md.244.t: "사회 입법을 밀어붙이는 프랑스"
 france_md.244.d: "프랑스에서 불복하는 프랑스가 승리한 이래, 우리나라에서도 프랑스에서 채택된 것과 유사한 법률을 채택하자는 여러 목소리가 들립니다. 프랑스에서 좌파 단절이 거둔 성공은 우리와 유럽 연합의 다른 나라들에도 번지는 듯합니다. 우리 나라들 곳곳에서 프랑스 이웃과 같은 입법 혁신을 요구하는 운동이 조직되고 있습니다. 이러한 제안 대부분은 특히 인권, 사회 정의, 생태와 관련됩니다. 이 법률들을 받아들여 우리에게 채택해야 하겠습니까? 이는 동료 시민들에게 이로울 수 있습니다."
 france_md.244.a: "이 법률들은 우리 헌법에 좋은 추가가 될 수 있다"
 france_md.244.b: "아니다, 그것은 불가능하다"
 france_md.245.t: "생태 입법을 밀어붙이는 프랑스"
 france_md.245.d: "프랑스에서의 생태주의자들의 승리는 유럽 전역에 충격파를 보냈습니다. 우리 연합의 창립 회원국이 이제 EU가 세워진 토대인 자유 무역과 성장의 서사보다 기후 입법을 촉구하고 있습니다. 활동가들은 이미 이 기세를 우리나라로 옮기기 시작했습니다. 그들의 의제 일부를 채택하여 진보 세력에게는 제스처를 보이되 경제 발전에는 걸림돌이 되는 길을 택해야 하겠습니까, 아니면 상황이 우리 없이 그쪽으로 더 나아가기 전에 분명한 입장을 취해야 하겠습니까?"
 france_md.245.a: "우리도 기후 변화로부터 스스로를 보호해야 한다"
 france_md.245.b: "무슨 기후 변화?"
 france_md.246.t: "집행위원회를 차지한 녹색 프랑스"
 france_md.246.d: "유럽 집행위원회 임명을 위한 최근 투표 이후, 생태가 승리를 거둔 듯합니다. 프랑스에서 생태주의자들이 승리한 후, 녹색당인 유럽 생태가 유럽 연합의 최고위층에 올랐는데, 이는 연합이 기후 문제를 향해 점점 나아가고 있음을 보여 주는 두드러진 징표입니다. 시민들의 의식을 높이는 것을 넘어, 이 승리는 자신들의 기후 안보를 진지하게 여기는 유럽에 대한 시민들의 신뢰를 강화합니다."
 france_md.246.a: "우리는 녹색 유럽을 향해 가고 있는가?"
 france_md.248.t: "유럽 의회에서 행동을 늘리는 생태주의 의원들"
 france_md.248.d: "프랑스에서 선출된 이래 생태주의 의원들이 유럽 의회에서 눈에 띄게 늘어난 듯합니다. 유럽 연합 회원국들에서 생태 문제에 대한 관심이 다시 높아지고 있는 것으로 보입니다. 중요성이 커지는 것으로 보이는 이 의원 수는 유럽 의회의 세력 균형을 점점 더 좌우하여 앞으로의 유럽 집행위원회를 둘러싼 쟁점이 될 정도입니다. 유럽 연합에 대한 생태주의자들의 이러한 영향력 증대는 우리나라에도 번지는 듯하며, 우리의 생태 정당들의 인기에 영향을 미칠 뿐 아니라 보건 및 생태 문제에 더 주의를 기울이는 유럽 연합에 대한 신뢰를 강화합니다."
 france_md.248.a: "그들은 유럽 의회에서 많은 것을 이루지 못할 것이다"
 france_md.249.t: "녹색 전환 기금을 제안하는 프랑스"
 france_md.249.d: "이번에는 프랑스 친구들이 새로운 제안을 들고 왔습니다. 그들은 유럽 국가들의 생태 전환을 돕기 위해 유럽 국가들 사이에 참여형 기금을 조성하자고 제안합니다. 이 기금은 가능하다면 녹색 에너지로 우리의 에너지 부문을 발전시킬 수 있게 해 줄 것입니다. 그들은 이 수단이 우리의 에너지 주권을 확인하고 지속 가능한 토대 위에 세우는 방법이라고 강조합니다. 다만 이 수단에는 이러한 투자를 위한 우리 민간 부문의 더 큰 동원이 따를 것입니다. 참여해야 하겠습니까?"
 france_md.249.a: "어디에 서명하면 되는가?"
 france_md.249.b: "아니다, 감사하지만 우리는 혼자서도 잘하고 있다"
 france_md.250.t: "유럽 탄소 배출 감축을 제안하는 프랑스"
 france_md.250.d: "프랑스 생태주의 친구들이 EU가 그린 딜을 마무리하는 가운데, 우리와 이웃 나라들 모두에게 제시하는 대폭적인 탄소 배출 감축안을 들고 돌아왔습니다. 그들은 화석 연료 사용을 줄이면 우리 국민이 더 편히 숨 쉴 수 있고 연합의 에너지 주권도 구축할 수 있다고 주장하는데, 우리 나라 가운데 자체 석유를 생산하는 곳은 없기 때문입니다. 이러한 구조 개편은 비용이 많이 들고 더디겠지만, 우리의 주요 화석 연료 공급원인 러시아와의 긴장이 폭발할 경우 결정적일 수 있습니다."
 france_md.250.a: "그들이 옳다. 화석 연료는 우리를 취약하게 만든다"
 france_md.250.b: "어떤 세상에서 우리가 러시아와 불화할 수 있다는 것인지 모르겠다"
 france_md.251.t: "프랑스의 우리 통상 정책 간섭"
 france_md.251.d: "프랑스 주재 우리 대사는 프랑스 대통령실이 우리가 식품 부문을 규제하기를 원한다고 보고합니다. 그들은 우리 제품 일부, 특히 EU에서 금지된 성장 분자를 써서 생산한 고기가 소비에 부적합하다고 주장합니다. 따르지 않으면 우리 상품에 대한 보호무역 조치와 나머지 연합에 동참하도록 하는 압력의 위험이 있지만, 프랑스 자국의 농식품 산업이 우리 수출품을 불공정 경쟁으로 낙인찍는 데 분명한 이해관계가 있습니다. 규제하면 우리 국민이 농업에서 더 큰 혜택을 누리겠지만 우리 농식품 부문의 성장에는 상한이 생길 것입니다."
 france_md.251.a: "그들이 옳다. 이러한 규제는 필요하다"
 france_md.251.b: "내 소에게 무엇을 먹이든 내 마음이다."
 france_md.252.t: "브라질에 대한 관세 장벽 설치를 제안하는 프랑스"
 france_md.252.d: "프랑스 파트너는 브라질이 농식품 생산에 유럽의 보건 규제를 적용하기를 거부하여 생긴 분쟁을 이유로 브라질산 수입을 금지하라고 우리에게 촉구합니다. 이로 인해 남미 식품은 더 저렴하지만 우리 시민에게 위험한 제품이 포함될 가능성이 더 높아집니다. 유럽 산업은 이를 불공정 경쟁이라 부르고, 금융가들은 자유 무역이라 부릅니다. 프랑스 자국의 식품 산업이 이 불만을 부추겼음은 분명하지만, 그럼에도 우리 국민에 대한 보건상의 위험은 실재합니다."
 france_md.252.a: "그들이 옳다. 불공정 경쟁이다"
 france_md.252.b: "이 모든 것에서 자유 무역은 어떻게 되는가?"
 france_md.253.t: "프랑스의 우리 통상 정책 간섭"
 france_md.253.d: "프랑스 주재 우리 대사는 프랑스 대통령실이 우리가 제조 및 채굴 부문을 규제하기를 원한다고 보고합니다. 우리 생산의 상당수는 유럽 산업 기준을 무시하면서도 그들의 시장을 가득 채우고 있으며, 그들의 산업은 그로 인한 무역 불균형을 불공정 경쟁이라 부릅니다. 우리는 무역 파트너로서 유럽이 필요하며, 그들의 기준을 거부하면 우리 상품에 대한 수입 제한이라는 훨씬 더 큰 타격을 입을 위험이 있습니다. 따르면 국민과 지구를 위해 더 책임 있게 생산할 수 있지만, 우리 산업 부문의 성장은 제한될 것입니다."
 france_md.253.a: "우리는 유럽 파트너를 잃을 수 없다"
 france_md.253.b: "그들은 이 값싼 제품이 필요하며, 그들도 그것을 안다."
 france_md.254.t: "중국에 대한 관세 장벽 설치를 제안하는 프랑스"
 france_md.254.d: "프랑스 파트너는 중국이 자국 생산에 유럽의 산업 규제를 적용하기를 거부하여 생긴 분쟁을 이유로 중국산 수입을 금지하라고 우리에게 촉구합니다. 이로 인해 공산품과 원자재는 더 저렴하지만 의심스러운 조건에서 생산되었을 가능성이 더 높아집니다. 유럽 산업은 이를 불공정 경쟁이라 부르고, 금융가들은 자유 무역이라 부릅니다. 프랑스 자국의 산업 부문이 이 불만을 부추겼음은 분명하지만, 그럼에도 이 제품들이 지구와 우리 산업에 끼치는 피해는 실재합니다."
 france_md.254.a: "그들이 옳다. 불공정 경쟁이다"
 france_md.254.b: "이 모든 것에서 자유 무역은 어떻게 되는가?"
 france_md.255.t: "프랑스의 우리 통상 정책 간섭"
 france_md.255.d: "프랑스 주재 우리 대사는 프랑스 대통령실이 우리가 석유 채굴 및 정제 부문을 규제하기를 원한다고 보고합니다. 우리 생산의 상당수는 유럽의 채굴 및 산업 기준을 무시하면서도 그들의 시장을 가득 채우고 있으며, 그들의 산업은 그로 인한 무역 불균형을 불공정 경쟁이라 부릅니다. 우리는 유럽이 필요하며, 그들의 기준을 거부하면 우리 상품에 대한 수입 제한이라는 훨씬 더 큰 타격을 입을 위험이 있습니다. 따르면 국민과 지구를 위해 더 책임 있게 생산할 수 있지만, 우리 석유 기업의 성장은 제한될 것입니다."
 france_md.255.a: "우리는 유럽 파트너를 잃을 수 없다"
 france_md.255.b: "이번 겨울에 난방이나 잘해 보시길."
 france_md.256.t: "러시아에 대한 관세 장벽 설치를 제안하는 프랑스"
 france_md.256.d: "프랑스 파트너는 러시아가 유럽의 채굴 및 정제 규제를 적용하기를 거부하여 지구에 한탄스러운 조건에서 연료를 생산한다는 분쟁을 이유로 러시아산 탄화수소 수입을 제한하라고 우리에게 촉구합니다. 일부 유럽 채굴 부문은 이를 불공정 경쟁이라 부르며 외세에 대한 의존을 줄이기를 원하지만, 러시아는 우리가 생각하는 것보다 덜 위협적일 수 있으며 그들의 느슨한 기준이 우리 연료 비용을 낮추어 줍니다."
 france_md.256.a: "그들이 옳다. 연료 의존도를 제한해야 한다"
 france_md.256.b: "이 모든 것에서 자유 무역은 어떻게 되는가?"
 france_md.257.t: "철도 중심의 대계획 수립을 제안하는 프랑스"
 france_md.257.d: "프랑스 파트너들이 새로운 프로젝트를 들고 돌아왔습니다. 유럽의 화물 수송을 트럭이 아닌 철도 중심으로 재편하자는 것으로, 화물 운송을 더 효율적이고 생태적으로 만들기 위해 프랑스 생태주의자들이 주창한 구상입니다. 이를 위해서는 효율적이고 통합된 철도망이 필요한데 우리에게는 현재 그것이 없으며, 스페인의 서로 다른 철도 궤간 같은 불일치가 여전히 국경을 넘는 이동을 늦추고 있습니다. 화물 유통은 연합의 핵심이고 이 철도망은 사람의 이동도 원활하게 할 수 있으므로, 이미 번창하고 있는 도로 운송 부문과 비교해 비용이 많이 들더라도 추진할 가치가 있습니다."
 france_md.257.a: "우리도 참여한다"
 france_md.257.b: "나는 내 트럭이 좋다"
 france_md.258.t: "우리 국내 정치를 뒤흔드는 프랑스 공산주의자들의 승리"
 france_md.258.d: "프랑스 공산당의 승리는 유럽 전역에 충격파를 보냈습니다. 공산 진영에 대항해 세워진 연합의 창립 회원국이 이제 자국민에게 투쟁에 동참하라고 촉구하고 있으며, 이는 많은 나라가 오래전에 묻혔다고 여겼던 소련에 대한 공포를 되살리고 있습니다. 활동가들은 이미 이 기세를 우리나라로 옮기기 시작했습니다. 시위의 물결을 일찍 차단하기 위해 그들의 의제 일부를 채택하여 진보 세력에게는 제스처를 보이되 경제 발전에는 걸림돌이 되는 길을 택해야 하겠습니까, 아니면 상황이 우리 없이 더 나아가기 전에 분명한 입장을 취해야 하겠습니까?"
 france_md.258.a: "그리 나쁜 생각은 아니다"
 france_md.258.b: "빨갱이가 되느니 죽는 게 낫다"
 france_md.259.t: "공산주의 프랑스가 내민 손"
 france_md.259.d: "우리 국가는 창설 이래 러시아의 지배 아래 있거나 그것을 두려워하는 것을 멈춘 적이 없습니다. 그러나 이번에는 원조가 도착할 준비가 된 듯합니다. 실제로 프랑스 외교관들이 러시아와의 분쟁 가능성에 대비하기 위한 전략적 동반자 관계를 우리에게 제안했습니다. 지금으로서는 별것 아닙니다. 몇 가지 서류와 장비일 뿐이지만, 무엇보다 다가올 지원의 약속입니다. 가장 놀라운 점은 이 지원이 공산주의 프랑스에서 온다는 것입니다. 이는 프랑스 공산당이 스탈린주의적이던 시절 소련에게 겪었던 억압을 떠올리게 하지 않을 수 없습니다. 이것이 러시아의 우리에 대한 입장을 굳힐 뿐임을 알면서도 프랑스와 유럽을 신뢰할 수 있겠습니까?"
 france_md.259.a: "이 동반자 관계가 우리의 구원이다"
 france_md.259.b: "우리는 스스로를 돌볼 수 있다"
 france_md.260.t: "대러시아 원조를 제안하는 프랑스"
 france_md.260.desc: "소련의 억압에서 벗어난 지 수십 년이 지났음에도 러시아의 복귀에 대한 두려움은 멈추지 않았으며, 프랑스는 러시아 팽창주의가 다시 한번 동유럽으로 향할 수 있다는 우리의 두려움을 공유하며 분쟁이 발생할 경우의 원조를 제안했습니다. 제안은 장비 대여에서 기술 교류에 이르며, NATO가 동원되기도 전에 우리에게 싸울 기회를 줄 수 있는 원조입니다. 다만 NATO와 유럽이 실제로 우리를 도와줄 경우에만 해당됩니다. 수락하면 모스크바와의 관계가 악화될 것이며, 어쩌면 그 관계를 유지하는 편이 더 안전한 길일지도 모릅니다."
 france_md.260.a: "러시아인들을 멀리 두기 위한 장비만 있으면 된다"
 france_md.260.b: "고강도 전쟁을 수행하기 위한 훈련이 필요하다"
 france_md.260.c: "장기적으로 더 많은 무기를 생산해야 할 것이다"
 france_md.260.d: "원조는 필요 없다. 러시아는 우리의 적이 아니다"
 france_md.261.t: "동맹의 공식화를 제안하는 프랑스"
 france_md.261.desc: "프랑스에서 과거 스탈린주의 정당이 거둔 승리는 서유럽의 잠재적 동맹과의 관계 문제를 제기합니다. 이 동맹은 서방과 미국인에 대한 적대감을 표명하고 옛 소련과의 이념적 친밀감을 보였으며 심지어 그 유산이 긍정적이라고까지 했습니다. 파리는 미국 제국주의와 이를 따르는 유럽의 맹목을 규탄하는 성명을 거듭 냈으며, 이제 그들의 옛 소련에 대한 충성이 신뢰할 가치가 있다고 우리가 판단한다면 무역에서 완전한 군사·전략적 동반자 관계에 이르는 협력을 제안합니다."
 france_md.261.a: "당신들과 거래하는 것은 언제나 즐겁다"
 france_md.261.b: "실로 우리는 미국 제국주의로부터 스스로를 지켜야 한다"
 france_md.261.c: "그 무엇도 공산주의 형제애를 갈라놓지 못한다"
 france_md.261.d: "우리는 공산주의자들과 협력하지 않는다"
 france_md.262.t: "우리와의 무역 관계 확대에 동의한 러시아"
 france_md.262.d: "러시아는 관계를 확대하자는 우리의 제안에 긍정적으로 답했습니다. 그들은 우리가 그들의 원자력 및 3차 산업 부문 구축을 돕는 조건으로 산업 및 채굴 지식을 우리와 공유하겠다고 제안했습니다. 이는 우리와 러시아의 관계에서 중대한 진전입니다. 다만 잠재적인 전략적 동반자 관계에 대한 우리의 제안은 보류되었습니다. 러시아가 아직 우리에게 충분한 신용을 주지 않는 것일 가능성이 크지만, 우리 쪽으로 향한 이 첫걸음은 좋은 일입니다. 시간이 걸리겠지만 이 협정은 제국주의자들의 종말의 시작입니다."
 france_md.262.a: "신뢰는 언제나 장기간에 걸쳐 쌓인다"
 france_md.263.t: "우리와의 군사·무역 동반자 관계 수립에 동의한 러시아"
 france_md.263.d: "러시아는 관계를 확대하자는 우리의 제안에 긍정적으로 답했습니다. 그들은 우리가 그들의 원자력 및 3차 산업 부문 구축을 돕는 조건으로 산업 및 채굴 지식을 우리와 공유하겠다고 제안했습니다. 이는 우리와 러시아의 관계에서 중대한 진전입니다. 러시아는 또한 제국주의의 위협이 행동으로 옮겨질 때 대비할 수 있도록 우리를 공동으로 훈련시키기 위한 군사적 요소를 더해 이 동반자 관계를 확대하자고 제안했습니다. 그들은 우리에게 훈련장과 툰드라에서의 전문 지식을 제공할 것이며, 우리는 그들에게 사막 및 정글전 경험에 대한 접근을 제공할 것입니다."
 france_md.263.a: "함께라면 우리는 막을 수 없다"
 france_md.264.t: "동맹을 제안하는 러시아"
 france_md.264.d: "우리는 러시아 파트너로부터 이처럼 긍정적인 반응을 예상하지 못했습니다. 그들은 서방 제국주의에 맞선 동맹을 결성하자고 제안했습니다. 경제적, 지정학적 요소를 결합한 이 동맹은 우리가 서방과의 대결에 대비해 경제적, 군사적, 외교적으로 준비할 수 있게 해 줄 것입니다. 우리는 지식과 산업 전통은 물론 훈련장과 분쟁 시 상호 지원 보장도 교환할 것입니다. 우리는 제1차 세계 대전 이후 그들과 이러한 동맹을 맺은 적이 없었으며, 어쩌면 불길한 징조일 수도 있습니다. 그렇지만 이 동맹은 매우 환영할 만하며 공산주의에 대체로 적대적인 세계에서 우리가 살아남을 수 있게 해 줄 것입니다."
 france_md.264.a: "서방 제국주의는 우리 앞에서 무력할 것이다"
 france_md.265.t: "우리와의 관계 확대를 거부한 러시아"
 france_md.265.d: "우리 외교관들이 크게 놀랍게도 러시아는 프랑스 공화국과의 어떤 형태의 협력도 거절하는 듯합니다. 상반된 이해관계. 신뢰의 부재. 소련에 대한 기억은 그들에게서 멀리 떨어져 나간 듯합니다. 어쩌면 한때 미국 제국주의에 맞선 보루였던 러시아에도 마침내 서방의 부패가 닿았는지도 모릅니다. 한 가지는 확실합니다. 우리는 혼자이며, 우리를 이해하지 못하고 언제나 적대적일 유럽에서 홀로 서 있습니다."
 france_md.265.a: "우리야말로 진정한 공산주의자다!"
 france_md.266.t: "이민 문제로 EU와 충돌하는 프랑스"
 france_md.266.d: "우리 국민전선 동료들이 몇 달째 프랑스를 이끌고 있으며, 집권한 이래 유럽의 이민 정책이 너무 관대하다고 줄곧 비판해 왔습니다. 자유주의 및 사회주의 세력은 연합 내에서 이 문제에 관한 우리의 목소리를 오랫동안 잠재웠지만, 이제 우리 동맹이 파리에서 승리한 이상 그들은 우리를 더는 무시할 수 없습니다. 스스로 민족주의 이상을 받아들인 우리 국민은 길을 잃은 유럽에서 우리의 목소리가 처음부터 옳았음을 입증하는 것으로 이 승리를 환영합니다."
 france_md.266.a: "자유주의자들의 종말의 시작이다"
 france_md.267.t: "이민 문제로 EU와 충돌하는 프랑스"
 france_md.267.d: "프랑스에서 국민전선이 승리한 이래 유럽 의회에는 비판이 쏟아졌으며, 이러한 변화는 민족주의 및 유럽회의주의 정당들이 갈수록 강한 득표를 기록하면서 유럽 정치 전반에 물결을 일으킨 듯합니다. 논쟁은 이민에 집중되고 있으며, 의원들은 국내 정치에 대한 민족주의적 비전으로 돌아선 여론을 점점 더 반영하며 지나치게 관대하다고 보는 정책을 규탄합니다. 우리 유권자도 예외가 아니며, 프랑스가 일으킨 격변이 그들도 흔들기 시작하고 있습니다. 이 민족주의적 표류에 맞서 싸워야 하겠습니까, 아니면 형성되는 새로운 유럽의 방향을 받아들여야 하겠습니까?"
 france_md.267.a: "그래도 그들이 옳다"
 france_md.267.b: "유럽은 이미 민족주의의 대가를 치렀다"
 france_md.268.t: "브뤼셀에서 승소한 프랑스"
 france_md.268.d: "프랑스의 정치 정책은 새로운 국면을 맞았습니다. 역사적인 유럽회의주의에도 불구하고 이 당은 유럽 연합과 거래를 성사시켰으며, 국내와 동맹국들 사이의 유럽회의주의 캠페인을 이용해 브뤼셀에 자신들이 제기하는 위험을 납득시키고, 이제 그 지렛대를 이용해 EU가 불법 이민자를 추방하도록 강제하고 있습니다. 이는 그들의 대통령직에게 진정한 성공입니다. 우리 민족주의 정부도 같은 주권 문제에 직면해 있습니다. 우리 당의 상당수가 그 입장을 창당 가치로 보고 있음을 알면서도, 우리 자신의 유럽회의주의를 완화하는 대가로 EU의 이점을 추구해야 하겠습니까?"
 france_md.268.a: "유럽을 그냥 떠나면 되는데 왜 협상하는가."
 france_md.268.b: "영리하다. 우리도 똑같이 해야 한다"
 france_md.269.t: "유럽 정체성을 옹호하는 프랑스"
 france_md.269.d: "브뤼셀로부터 이민 문제에서 양보를 얻어 낸 프랑스 지도부는 이제 유럽회의주의 수사를 완전히 버리고, 자유주의 및 사회주의 성향과 계속 거리를 두는 한 유럽 연합에 대한 가입을 장려하기까지 하는 듯합니다. 연합 내부에서 민족주의 운동이 늘어나는 것으로 보여 국가들의 유럽이 다시 매력적으로 보이지만, 이러한 변화는 EU의 전면 거부에 애착을 가진 유권자들을 불안하게 할 수 있습니다. 특히 EU 지도부가 계속 우리 쪽으로 기운다면, 프랑스의 선례를 따라야 하겠습니까?"
 france_md.269.a: "매우 좋은 구상이다"
 france_md.269.b: "민족주의자이면서 동시에 유럽인일 수는 없다"
 france_md.270.t: "우리 국방에 대한 투자를 제안하는 프랑스"
 france_md.270.d: "최근 몇 년 사이 유럽 대륙에 새로운 전쟁이 일어날 가능성은 그 어느 때보다 커 보입니다. 우리 연합은 아직 어떤 침략도 겪지 않았지만, 러시아 이웃의 우려스러운 행동은 이러한 걱정을 확인해 주는 듯합니다. 프랑스가 제안을 들고 우리를 찾아왔습니다. 그들은 우리의 군산 복합체에 투자하여 이를 구축하는 것을 돕겠다고 제안합니다. 이 무기 공장들이 있으면 우리나라와 유럽 파트너를 위해 싸워야 할 날에 효과적으로 대비할 수 있습니다. 그러나 그들이 우리 군수 산업에 투자하도록 허용하면 우리는 그들에게 더 의존하게 되므로 좋은 생각이 아닐 수 있습니다. 게다가 평화주의적인 우리 국민은 이러한 자본 동원을 걱정할 수도 있습니다."
 france_md.270.a: "이 중요한 원조에 감사한다"
 france_md.270.b: "걱정할 이유가 없다"
 france_md.271.t: "우크라이나에 대한 우리의 영유권을 인정하는 프랑스"
 france_md.271.d: "프랑스에서 권력이 국민전선으로 넘어간 이래 그들은 우리에게 점점 더 우호적이 되었으며, 동쪽을 향한 우리의 야망에 늘 반대해 온 유럽과 결별했습니다. 그들은 우크라이나 영토에 대한 우리의 영유권 주장을 지지하는 발언을 했을 뿐 아니라, 병력과 물자를 이동할 수 있도록 자국 영토와 항만에 대한 접근을 제공하여 우리의 보급을 수월하게 하고 향후 유럽의 금수 조치를 무디게 해 주었습니다. 이 새로운 동맹은 우리가 어쩌면 착수할지도 모를 전쟁의 길로 나아가는 것을 뒷받침해 줍니다."
 france_md.271.a: "첫 번째 도미노가 쓰러진다"
 france_md.271.b: "우리는 우크라이나 형제들과 싸울 생각이 없다"
 france_md.272.t: "협력 확대를 제안하는 프랑스"
 france_md.272.desc: "우리에게 유리한 수많은 성명과 협정 끝에, 프랑스는 이제 퇴폐적이라고 보는 유럽과 서방에서 도덕과 신앙의 수호자를 자처하며 우리와의 관계를 확대할 준비가 된 듯합니다. 이 새로운 동맹에서 충분한 잠재력을 본다면 우리의 관계는 무역에서 완전한 군사·전략적 동반자 관계로 발전할 수 있으며, 또는 현재의 유럽 연합과 좋은 관계를 계속 기대한다면 거절할 수도 있습니다."
 france_md.272.a: "우리 경제에 이로울 것이다"
 france_md.272.b: "우리 경제와 군대에 이로울 것이다"
 france_md.272.c: "세계가 우리 앞에서 떨 것이다"
 france_md.272.d: "우리는 프랑스와 협력할 생각이 없다"
 france_md.273.t: "우리와의 무역 관계 확대에 동의한 러시아"
 france_md.273.d: "러시아는 관계를 확대하자는 우리의 제안에 긍정적으로 답했습니다. 그들은 우리가 그들의 원자력 및 3차 산업 부문 구축을 돕는 조건으로 산업 및 채굴 지식을 우리와 공유하겠다고 제안했습니다. 이는 우리와 러시아의 관계에서 중대한 진전입니다. 다만 잠재적인 전략적 동반자 관계에 대한 우리의 제안은 보류되었습니다. 러시아가 아직 우리에게 충분한 신용을 주지 않는 것일 가능성이 크지만, 우리 쪽으로 향한 이 첫걸음은 좋은 일입니다. 시간이 걸리겠지만 이 협정은 극단적 세계화주의자들의 종말의 시작입니다."
 france_md.273.a: "신뢰는 언제나 장기간에 걸쳐 쌓인다"
 france_md.274.t: "우리와의 군사·무역 동반자 관계 수립에 동의한 러시아"
 france_md.274.d: "러시아는 관계 확대 제안에 긍정적으로 응답했습니다. 러시아는 우리가 그들의 핵 산업과 3차 산업 육성을 돕는 것을 조건으로 자국의 산업 및 채굴 지식을 우리와 공유하겠다고 제안했습니다. 이는 러시아와의 관계에서 중대한 진전입니다. 러시아는 또한 이 협력 관계를 군사 분야로 확대하자고 제안했는데, 이는 극단적 세계주의의 위협이 행동에 나설 때 대비할 수 있도록 양국이 공동으로 훈련하기 위한 것입니다. 러시아는 우리에게 훈련장과 툰드라 지대에서의 전문 지식을 제공할 것이며, 우리는 사막과 정글 전투에서 쌓은 경험을 그들에게 공유할 것입니다."
 france_md.274.a: "함께라면 우리는 막을 수 없다"
 france_md.275.t: "동맹을 제안하는 러시아"
 france_md.275.d: "러시아 파트너로부터 이토록 긍정적인 응답이 올 줄은 예상하지 못했습니다. 실제로 그들은 외세의 침략이 있을 경우 상호 원조를 보장하는 동맹을 맺자고 제안했습니다. 경제적 요소와 지정학적 요소를 결합한 이 동맹은 세계의 나머지 국가들과의 대결에 대비해 경제적, 군사적, 외교적으로 준비할 수 있게 해 줄 것입니다. 이 동맹은 이웃 나라들이 빠져든 극단적 세계주의에 맞서 끝까지 싸울 힘을 줄 것입니다. 우리가 제1차 세계 대전 이후 그들과 이러한 동맹을 맺은 적이 없다는 점은 나쁜 징조일지도 모릅니다. 그러나 이 동맹은 매우 환영할 만하며 우리 정치의 커다란 성공입니다."
 france_md.275.a: "우리는 자유주의의 퇴폐로부터 보호받고 있다"
 france_md.276.t: "우리와의 관계 확대를 거부한 러시아"
 france_md.276.d: "우리 외교관들이 크게 놀랄 만하게도, 러시아는 프랑스 공화국과의 어떠한 형태의 협력도 거부하는 것으로 보입니다. 이해관계의 불일치와 신뢰의 부족 때문일 것입니다. 어쩌면 한때 강하고 자긍심 넘치던 러시아에도 서방의 부패가 마침내 닿았는지도 모릅니다. 그러나 이 반전이 극적인 것은 아닙니다. 어쩌면 우리는 애초에 그리 공통점이 많지 않았는지도 모릅니다. 대륙에서 다른 민족주의 동맹국을 분명히 찾게 될 것입니다."
 france_md.276.a: "유감이군"
 france_md.277.t: "러시아의 영향력으로부터 우리를 보호하겠다고 제안하는 프랑스"
 france_md.277.d: "수년 전부터 러시아인들은 아프리카 대륙에 투자해 왔으며, 구 프랑스령 아프리카 국가들에서 번지고 있는 지하디스트 및 독립 반란에 맞서 싸우겠다며 자신들의 서비스를 제공하고 있는 듯합니다. 프랑스와 러시아는 이 대륙에서 영향력을 두고 명백히 충돌하고 있습니다. 이들 사이에서는 서구 자유주의와 권위주의라는 가치가 부딪힙니다. 우리 아프리카 국가들이 러시아의 영향력의 표적이 되고, 이것이 때로 지역 소수 민족 간의 긴장을 악화시키는 이 상황에서, 프랑스는 러시아를 대신해 우리를 도와 그들의 존재감을 줄이도록 돕겠다고 제안합니다. 그러나 이는 과거의 식민 지배국과 가까워진다는 뜻이며, 좋은 생각이 아닐 수도 있습니다. 무엇을 결정해야 합니까."
 france_md.277.a: "그들의 말이 옳다. 러시아의 영향력은 위험하다"
 france_md.277.b: "과거의 식민 지배국이라니, 절대 안 된다"
 france_md.278.t: "유럽 연합을 탈퇴하는 프랑스 코뮌"
 france_md.278.d: "몇 달 전 프랑스는 공화국의 종말을 선언하고 혁명적 공산주의에 기반한 새로운 체제인 프랑스 코뮌을 수립했으며, 오래지 않아 유럽 연합을 탈퇴했습니다. 유럽 연합은 그들의 새로운 노선이 이제 배척하는 경제적 자유주의 위에 세워진 조직입니다. 탈퇴는 즉각적이고 최종적이었으며 협상할 의사는 전혀 보이지 않았습니다. 이는 새로운 분쟁을 막는 것이 무엇보다 존재 이유였던 유럽 연합에게 좋지 않은 징조이며, 이토록 혁명적인 이념을 동반한 갑작스러운 탈퇴는 조만간 맞서야 할 문제가 될 것입니다."
 france_md.278.a: "예상된 일이었다"
 france_md.279.t: "우리 정치에 압력을 가하는 프랑스 코뮌"
 france_md.279.d: "예견했던 대로 프랑스 코뮌의 유럽 연합 탈퇴는 막다른 길이 아니었습니다. 연합에서 벗어나자마자 그들은 이미 경제를 되살리고 있으며, 그 성공은 자유주의적 유럽의 가치에 별다른 애정이 없는 국내 사람들로부터 찬사를 얻기 시작하고 있습니다. 국제 선전 기구로 재편된 프랑스 정보기관이 이러한 선동가들을 훈련하는 것을 돕고 있으며, 우리가 그들과 같은 처지에 놓이기 전에 이를 심각하게 받아들여야 합니다. 우리는 유럽의 가치와 그것이 가져다주는 평화를 옹호할 수도 있고, 다가올 폭력을 무디게 하기 위해 그들의 의제를 스스로 따라갈 수도 있지만, 후자는 공산주의적이고 반유럽적인 정치를 받아들인다는 뜻입니다."
 france_md.279.a: "그들의 방식으로 이길 수 있다면 굳이 싸울 필요가 없다"
 france_md.279.b: "이 극단주의자들에 맞서 싸워야 한다"
 france_md.280.t: "우리를 세계 혁명 정상회담에 초대하는 프랑스 코뮌"
 france_md.280.d: "국내 통제권을 확보한 프랑스의 혁명적 공산주의자들은 이제 혁명을 수출하려 하며, 우리 정부가 이미 새 프랑스 코뮌이 소중히 여기는 공산주의 가치에 편을 들었다는 이유로 우리를 세계 혁명 정상회담에 초대했습니다. 그들은 이러한 가치를 전 세계로 퍼뜨리기로 결심했으며, 이 초대는 우리가 따를 것인지를 시험하는 것임이 분명합니다. 많은 열강이 결코 이를 받아들이지 않을 것이므로, 이러한 혁명은 전쟁 없이, 그것도 아마 피비린내 나는 전쟁 없이는 오지 않을 것입니다. 공산주의 이상은 우리에게 소중하지만, 이를 달성하기 위해 우리 시민들의 목숨을 걸 준비가 되어 있습니까?"
 france_md.280.a: "우리도 함께하겠다. 혁명 만세"
 france_md.280.b: "역사는 자유가 총구로 얻어지지 않음을 증명해 왔다"
 france_md.281.t: "프랑스군에 대한 근본적 개혁에 착수한 황제"
 france_md.281.d: "우리 황제는 앞으로 치르게 될 전쟁에 더 잘 적응할 수 있도록 군대에 대한 근본적 개혁에 착수했습니다. 이를 수행하려면 막대한 투자와 우리의 전적인 관심이 필요하며, 즉각적인 전투 준비 태세에는 여력이 줄어들기 때문에 군을 다시 증강하기 전까지 한동안은 더 취약해질 것입니다. 이번 첫 번째 개혁은 앞으로의 개혁에 부적합하다고 판단된 육군 지휘부 자체를 대상으로 하며, 지휘 체계의 재편에는 1년이 채 걸리지 않을 것입니다. 이 기간 동안 우리는 장기적 이익을 위해 군사 작전을 제한해야 합니다."
 france_md.281.a: "이 개혁은 필요하다"
 france_md.282.t: "완료된 우리의 참모본부 개혁"
 france_md.282.d: "우리의 개혁이 기록적인 속도로 완료되었습니다. 일부는 저항했지만 대부분의 참모진은 지휘 체계 재편을 받아들였습니다. 이 개혁은 지도부를 더 효율적으로 만들 뿐 아니라, 더 높은 수준의 훈련이 요구되는 대신 재능 있는 새로운 장군들에게도 문을 열어 주며, 군대 개조의 첫 번째 벽돌에 불과합니다. 앞으로 몇 달 동안 추가 개혁을 통해 군의 수단과 목표가 정해지고 군산복합체에는 더 명확한 수주 계획이 주어질 것입니다. 이는 장기적인 도박이었으며, 우리가 이긴 것으로 보입니다."
 france_md.282.a: "우리는 굳건히 버텼다. 이제 더 중요한 문제로 넘어갈 수 있다"
 france_md.283.t: "우리 군의 근간"
 france_md.283.d: "전장에 대한 우리의 접근 방식을 다루는 첫 번째 개혁안이 도착했으며, 미래의 적을 상대로 한 대규모 분쟁에서 우리가 채택해야 할 전략을 규정하고 있습니다. 제2차 세계 대전 이후의 재편 이래 우리 군은 항상 기동성과 기동전에 기반한 공세적 전략을 선호해 왔으며, 돌격 전차와 신속한 목표 점령을 중심으로 교리와 장비 발주를 구성함으로써 이를 심화할 수 있습니다. 대안은 보병에 초점을 맞춰 그 역할과 장비를 강화하고, 우월한 화력으로 적의 반격에 대응하는 것입니다. 이는 더 안전한 접근 방식이지만 과거의 교리를 의문시하게 될 것입니다."
 france_md.283.a: "보병은 언제나 중심적 역할을 해 왔다. 이것이 가장 안전한 접근이다"
 france_md.283.b: "우리 군은 냉전 이래 기동전을 중심으로 구축되어 왔으며, 이를 바꿀 이유가 없다"
 france_md.284.t: "우리의 화력"
 france_md.284.d: "마지막 교리 개혁안이 도착하여, 우리 군이 원거리에서 적 병력을 어떻게 격파할지 결정하도록 요구하고 있습니다. 우리는 오랫동안 포병과 항공 전력의 균형을 맞춰 왔으나, 앞으로의 길은 전문화를 요구합니다. 우리의 카이사르 곡사포는 기동성이 뛰어나고 효과적이어서 안전한 곳에서 적 부대를 포격할 수 있게 해 줍니다. 공군과 헬리콥터는 다용도 화력을 제공하지만 적의 방공망에 취약하며, 제공권을 잃으면 재앙이 될 수 있습니다. 우리는 최소한의 위험과 더 큰 화력 사이에서 선택해야 합니다."
 france_md.284.a: "포병이 더 비용 효율적이다"
 france_md.284.b: "우리 항공 전력은 매우 효과적이다. 이를 쓰지 않는 것은 어리석은 일이다"
 france_md.285.t: "유럽 연합에 대한 우리의 입장"
 france_md.285.d: "너무 오랫동안 우리나라는 자국의 발전보다 유럽 연합을 우선시했습니다. 우리의 발전과 안보를 제쳐 둔 결과 전례 없는 민주주의의 위기를 맞았지만, 그럼에도 우리는 승리하여 이를 극복했습니다. 그러나 오늘 우리에게는 이러한 흐름을 되돌릴 기회가 있습니다. 과거의 민주주의 제도에서 벗어난 지금, 우리는 스스로 선택할 자유가 있으며 원한다면 유럽 연합을 탈퇴할 수 있습니다. 그러나 자유주의적 억압에서 막 회복 중인 우리나라에 하룻밤 사이의 탈퇴는 심각한 타격이 될 수 있습니다. 유럽 연합과 협상하여 잔류를 대가로 이익을 챙겨야 합니까, 아니면 유럽 연합 탈퇴를 완료하여 관계를 완전히 끊어야 합니까?"
 france_md.285.a: "브뤼셀의 주머니를 비우든가, 아니면 우리는 떠난다!"
 france_md.285.b: "유럽 연합은 우리에게 충분히 해를 끼쳤다. 프렉시트다!"
 france_md.286.t: "유럽 연합을 탈퇴하는 프랑스"
 france_md.286.d: "프랑스 파트너국에서 일어난 큰 격변 이후, 보나파르트주의를 내세우는 민족주의 운동이 프랑스를 장악했습니다. 그들은 즉시 프랑스 내에 남아 있던 친유럽 정서의 잔재를 파괴하는 데 나섰습니다. 이제 그들은 프랑스의 유럽 연합 탈퇴를 선언합니다. 그들은 협상을 단호히 거부했습니다. 이 민족주의 운동의 승리는 단지 유럽 건설 사업의 균열일 뿐 아니라, 연합 전역의 유럽 회의주의자들에게 하나의 본보기이기도 합니다."
 france_md.286.a: "민족주의는 우리 유럽 연합에 위험하다"
 france_md.287.t: "우리의 요구에 굴복한 유럽 연합"
 france_md.287.d: "유럽 기관으로의 복귀를 협상하기로 한 우리의 결정은 옳았던 것으로 보입니다. 우리는 경제 위기를 피했을 뿐 아니라 유럽 중앙은행에서 자금까지 끌어냈습니다. 이것이야말로 성공적인 금융 작전이라 할 만합니다! 언젠가 전장에서 우리의 파트너들과 마주하게 될 것은 의심의 여지가 없지만, 그들이 망상 속에서 잠들어 있도록 내버려 둡시다. 한 가지는 확실합니다. 유럽 중앙은행과의 협상이 성공했다는 사실에 우리의 적들은 분명 분노하고 있을 것입니다."
 france_md.287.a: "우리의 때가 올 것이다"
 france_md.288.t: "실패한 우리의 협상"
 france_md.288.d: "우리의 시도는 대담했으나 성공하지 못했습니다. 어쩌면 우리가 너무 많은 것을 요구했거나, 유럽의 협상 상대들에게 신뢰를 주지 못했는지도 모릅니다. 어쨌든 유럽 중앙은행은 우리가 남아 있는 대가로 지불하기를 거부했습니다. 이는 그들의 결정이며 우리의 이익에 부합하지 않지만, 그것이 현실입니다. 이제 우리는 유럽 연합에 남을지 결정해야 합니다. 탈퇴는 경제적으로 큰 비용이 들겠지만, 잔류는 연합 앞에서 우리의 실패를 확인하는 것이 될 것입니다. 어느 쪽이든 우리는 유럽 연합 회원국이든 아니든 결국 전장에서 그들과 마주할 것입니다. 유일한 문제는 탈퇴의 금전적 비용이 잔류의 도덕적 비용을 넘어서는가 하는 것입니다."
 france_md.288.a: "연합 탈퇴는 너무 큰 비용이 든다. 당장은 감당할 수 없다"
 france_md.288.b: "이곳에서 더 할 일은 없다"
 france_md.289.t: "유럽 연합과 합의를 이끌어낸 프랑스"
 france_md.289.d: "몇 달간의 외교적 압박과 탈퇴 위협 끝에, 보나파르트주의 프랑스는 유럽 연합을 자신의 뜻대로 굴복시켰으며, 잔류를 대가로 추가적인 혜택을 얻어 냈습니다. 이 합의는 우리와 우리 파트너들에게 재앙입니다. 복수에 사로잡힌 민족주의자들이 지배하는 지금 프랑스가 얌전히 행동하리라는 보장은 없습니다. 프랑스는 여전히 필수적인 회원국이지만 오늘날에는 대륙 전체에 위험이 되고 있으며, 우리 국민은 파트너의 변덕에 대한 대가를 치러야 합니다."
 france_md.289.a: "정말로 좋은 생각이었을까?"
 france_md.290.t: "새로운 제국의 여명"
 france_md.290.d: "수개월의 내부 혼란과 헌법 개혁 끝에 우리는 성공했습니다. 우리는 수치스러운 공화국의 제도와 권력을 성공적으로 뿌리 뽑았습니다. 이제 프랑스는 결코 그만두어서는 안 되었던 모습, 즉 제국이 되어야 합니다! 제국의 귀환을 기념하기 위해 프랑스 전역에 방송되는 성대한 기념행사를 준비했습니다. 이 행사를 통해 우리 국민은 우리의 힘과 프랑스를 과거의 영광으로 되돌리겠다는 결의를 깨닫게 될 것입니다. 이 기념행사는 또한 적들에게 명확한 메시지, 곧 힘의 과시를 보낼 것입니다. 이제 그들은 우리를 무시할 수 없으며, 프랑스가 마땅한 몫을 찾으러 올 때까지 그들의 날은 얼마 남지 않았습니다. 이번에는 어떤 대연합도 우리를 막을 수 없습니다!"
 france_md.290.a: "제국은 과거의 위대함을 되찾을 것이다!"
 france_md.291.t: "민족주의 연합을 촉구하는 프랑스"
 france_md.291.d: "프랑스에서 민족주의 동지들이 거둔 승리는 유럽을 뒤흔들었고, 보나파르트 일파는 외교 정책의 방향을 유럽 연합과 그 가치, 그리고 그 미래에 맞서는 쪽으로 돌렸습니다. 이제 그들은 우리 정부가 자신들과 공동의 대의를 이룰 만큼 성향이 비슷하다고 믿고 우리에게 손을 내밀었습니다. 프랑스와의 암묵적 동맹은 매력적으로 보이지만, 그들이 나중에 우리에게 등을 돌리지 않으리라는 보장은 없습니다. 결과를 신중하게 따져 보아야 합니다."
 france_md.291.a: "그들은 옳은 길을 가고 있다. 합류하는 것이 현명할 것이다"
 france_md.291.b: "우리는 이러한 민족주의관을 공유하지 않는다"
 france_md.292.t: "우리 정치에 압력을 가하는 보나파르트주의 프랑스"
 france_md.292.d: "예상한 대로 프랑스의 민족주의적이고 반유럽적인 수사는 우연이 아니었습니다. 보나파르트 일파가 권력을 잡은 이후 유럽 연합은 모든 곳의 민족주의자들의 표적이 되었습니다. 이제 우리 국민 중 일부는 전쟁의 재래를 두려워하는 반면, 다른 일부는 민족주의 대의에 합류하여 우리 정부를 상대로 불안정을 조장하는 활동을 벌이고 있으며, 이들은 국제 선전 기구로 기능하는 프랑스 정보기관의 폭넓은 지원과 훈련을 받고 있습니다. 그들의 목표는 우리를 분열시키는 것이므로 이를 가장 엄중하게 받아들여야 합니다. 유럽 연합은 단결을 유지해야 합니다!"
 france_md.292.a: "유럽은 결국 민족주의를 이길 것이다"
 france_md.293.t: "적들에게 둘러싸여"
 france_md.293.d: "혁명 전쟁 시대처럼, 우리 나라에서 일어난 필연적인 변화가 반감을 낳고 있는 듯합니다. 우리가 재건하는 동안 적들은 이미 우리에게 맞서 음모를 꾸미며 대결을 준비하고 있습니다. 그들이 경계하는 것은 옳습니다. 필요하다면 우리는 힘으로 영토를 되찾을 준비가 되어 있기 때문입니다. 어쨌든 우리는 당연히 우리를 위협으로 여기는 유럽에 맞서 고립되어 있습니다. 당분간 우리는 무엇보다 적들과의 수년간의 분쟁에 대비해야 합니다. 동맹을 맺을 수도 있겠지만, 주로 우리 자신에게 의지해야 합니다. 그러나 한 가지는 확실합니다. 유럽주의와 대서양주의의 위협을 물리치고 나면 우리는 막을 수 없는 존재가 될 것입니다."
 france_md.293.a: "나폴레옹은 몇 번의 대연합을 무찔렀던가? 우리도 쉽게 해치울 것이다"
 france_md.294.t: "자국 동맹에 가입할 것을 제안하는 프랑스"
 france_md.294.d: "방금 프랑스 외교관들로부터 제안을 받았습니다. 유럽에서 고립되어 스스로 만든 적들에게 둘러싸여 있음을 깨달은 보나파르트 일파가 우리에게 호소해 온 것입니다. 그들은 특히 우리나라가 그들과의 동맹을 맺을 만큼 충분히 존중할 만하다고 여기기 때문입니다. 이것이 단순한 방어 조약이 아니며, 가입하면 반드시 우리의 문제가 아닌 분쟁에 곧바로 휘말리게 될 것임은 말할 필요도 없습니다. 그러나 이 동맹은 우리의 적과 맞서는 데 도움이 될 수 있으며, 다른 조건이 같다면 그들에 맞서기보다 편에 서는 것이 낫습니다. 프랑스와의 동맹은 솔깃해 보이지만, 그들이 곧 유럽에 전쟁을 가져올 것이므로 합류하는 것은 지옥행 티켓일지도 모릅니다."
 france_md.294.a: "우리는 이 동맹으로 이익을 얻을 수 있다"
 france_md.294.b: "절대 안 된다"
 france_md.295.t: "자국 코민테른에 가입할 것을 제안하는 프랑스"
 france_md.295.d: "프랑스를 통치하는 혁명적 공산주의 세력은 분쟁에 대한 욕구를 키워 왔으며, 세계 혁명을 추구하면서 어떤 수단을 써서든 이를 수출할 동맹국을 모집하고 있습니다. 그들은 특히 우리도 사회주의를 받아들였다는 이유로 우리에게 호소했으며, 이는 전장에서 자본주의와 파시즘을 격파할 기회를 제공합니다. 그러나 이것은 단순한 방어 조약이 아니며, 가입하면 반드시 우리의 문제가 아닌 분쟁에 곧바로 끌려들어 가게 될 것입니다."
 france_md.295.a: "그들의 말이 옳다. 혁명을 수출할 때이다"
 france_md.295.b: "절대 안 된다"
 france_md.296.t: "우리에게 공격을 촉구하는 프랑스 국민"
 france_md.296.d: "우리의 끊임없는 민족주의 선전은 너무나 잘 먹혀들었습니다. 경쟁 강국들이 우리의 파괴를 꾀한다고 확신한 대중은 이제 우리가 먼저 공격하기를 기대하고 있습니다. 민병대가 국경에 집결하여 이웃 나라 보안군과 맞설 태세를 갖추었으며, 여론은 들끓고 있습니다. 이 강국들이 때 이르게 우리에 맞서 동맹을 맺을 정도로 겁을 주지 않도록 조심해야 합니다."
 france_md.296.a: "결판을 낼 때가 되었다"
 france_md.296.b: "우리의 때가 올 것이다"
 france_md.297.t: "영불 해저터널에서의 소규모 충돌"
 france_md.297.d: "새로운 보나파르트주의 지도자에게 고무된 극단적 민족주의 성향의 프랑스 민병대가 영불 해저터널 인근에서 우리 시민과 경찰을 공격하여 약 스무 명이 사망하고 수십 명이 부상을 입었습니다. 우리만 당한 것이 아닙니다. 어젯밤 이들 집단은 새로운 나폴레옹 제국에 대한 우리의 반발을 공유하는 프랑스 이웃 나라 대부분을 공격했습니다. 우리가 최우선 표적임은 분명하며, 보나파르트주의 프랑스와의 대결은 이제 불가피해 보입니다."
 france_md.297.a: "잠재적 표적을 보호함으로써 프랑스의 침략을 저지해야 한다"
 france_md.297.b: "그들과의 분쟁에 대비해야 한다"
 france_md.298.t: "프랑스 국경에서의 소규모 충돌"
 france_md.298.d: "새로운 보나파르트주의 지도자에게 고무된 극단적 민족주의 성향의 프랑스 민병대가 공유 국경을 따라 우리 시민과 경찰을 공격하여 약 열다섯 명이 사망하고 수십 명이 부상을 입었습니다. 우리만 당한 것이 아닙니다. 어젯밤 이들 집단은 보나파르트주의 팽창의 잠재적 표적인 프랑스 이웃 나라 대부분을 공격했습니다. 우리가 최우선 표적임은 분명하며, 새로운 나폴레옹 제국과의 대결은 이제 불가피해 보입니다."
 france_md.298.a: "잠재적 표적을 보호함으로써 프랑스의 침략을 저지해야 한다"
 france_md.298.b: "그들과의 분쟁에 대비해야 한다"
 france_md.298.c: "걱정할 이유가 없다"
 france_md.299.t: "우리에게 원조를 요청하는 [FROM.GetName]"
 france_md.299.d: "프랑스가 제기한 새로운 임박한 위협에 직면하여, 공격받은 다른 나라들도 재빨리 반응했습니다. 다른 많은 나라와 마찬가지로 [FROM.GetName]은(는) 잠재적 침공에 대비한 방어를 위해 우리에게 원조를 요청했습니다. 분명 그들은 우리보다 먼저 공격을 받을 것입니다. 그러나 우리는 정말로 그들을 지킬 준비가 되어 있습니까? 우리의 몇 달에 걸친 준비를 [FROM.GetName]을(를) 위해 희생해야 합니까? 이번 위기는 우리 외교 정책을 뒤집어 놓았고 원조 요청이 쇄도하고 있습니다. 우리 앞에는 두 갈래 길이 있습니다. [FROM.GetName]을(를) 우리의 전략적 파트너십에 포함시켜 원조하거나, 나폴레옹과 홀로 맞서도록 내버려 두는 것입니다. 결국 [FROM.GetName] 같은 상대에게 그가 스스로 지치도록 놔두는 것에도 장점은 있습니다."
 france_md.299.a: "그들을 보호해야 한다"
 france_md.299.b: "왜 [FROM.GetName]을(를) 위해 죽어야 하는가"
 france_md.300.t: "자국 동맹에 가입할 것을 제안하는 프랑스"
 france_md.300.d: "프랑스의 보나파르트주의 지도자는 조국의 위대함을 회복하기 위한 전쟁 준비가 되었음을 선언하여 유럽의 분노를 샀으며, 이제 우리에게 손을 내밀고 있습니다. 프랑스 외교관들은 과거 나폴레옹이 슬라브와 게르만의 억압에 맞서 폴란드 민족을 도왔던 역사를 언급하며 그 협약을 갱신하자고 제안합니다. 이러한 동맹은 상존하는 러시아의 위협으로부터 우리를 지켜 주겠지만, 이길 수 없는 전쟁으로 우리를 끌어들일 수도 있습니다."
 france_md.300.a: "우리가 새로운 동브로프스키와 크니아지에비치가 되겠다!"
 france_md.300.b: "파리를 위해 왜 죽어야 하는가? 묻겠다"
 france_md.301.t: "자국 동맹에 가입할 것을 제안하는 프랑스"
 france_md.301.d: "프랑스의 보나파르트주의 지도자는 조국의 위대함을 회복하기 위한 전쟁 준비가 되었음을 선언하여 유럽의 분노를 샀으며, 이제 우리에게 손을 내밀고 있습니다. 프랑스 외교관들은 나폴레옹의 원수였던 장 바티스트 베르나도트로부터 이어진 우리 왕가의 혈통을 언급하며, 선조들을 기리는 뜻에서 서로의 노력을 합치자고 제안합니다. 이러한 동맹은 상존하는 러시아의 위협으로부터 우리를 지켜 주겠지만, 이길 수 없는 전쟁으로 우리를 끌어들일 수도 있습니다."
 france_md.301.a: "다시 복무에 나설 때가 되었다"
 france_md.301.b: "과거는 과거일 뿐이다"
 france_md.302.t: "미국, 친구인가 적인가"
 france_md.302.desc: "유럽에서 찾을 수 있는 몇 안 되는 잠재적 동맹국에 동맹 제안을 보낸 지금, 한 가지 질문이 남아 있습니다. 미국을 어떻게 대해야 할 것인가입니다. 혁명기와 나폴레옹 치하에서 우리는 영국에 대한 공통의 증오를 공유하며 미국과 좋은 관계를 유지했습니다. 그러나 시대는 변했습니다. 제2차 세계 대전과 유럽에서의 미국의 행태는 종종 프랑스의 이익에 반했으며, 우리가 집권하기 전까지 관계는 유지되었으나 이제 워싱턴이 우리의 패권을 향한 길을 가로막을지도 모릅니다."
 france_md.302.a: "그들에게 우리 동맹에 가입하자고 제안한다"
 france_md.302.b: "그들의 상업적 힘이 국제 제재를 극복하는 데 도움이 될 것이다"
 france_md.302.c: "그들과의 대결에 대비한다"
 france_md.302.d: "유럽을 확보하는 것이 여전히 우리의 우선순위이다"
 france_md.303.t: "우리에게 동맹을 제안하는 프랑스"
 france_md.303.d: "프랑스의 보나파르트주의 지도자는 유럽의 분노를 샀으며, 이제 자신들의 문제에 간섭하지 않는다는 조건으로 동맹을 제안하고 있습니다. 프랑스 외교관들은 나폴레옹과 혁명기 프랑스가 오랫동안 우리에게 중요한 동맹이었음을 강조합니다. 그러나 프랑스는 다른 유럽 열강, 그중 다수는 우리의 동맹국이기도 한 나라들과 싸우는 데 전념해 왔으며, 우리의 역사적 동맹이자 소중한 파트너인 영국을 최우선 표적으로 선언했습니다. 우리가 프랑스에 합류하여 런던과의 전쟁을 감수해야 합니까?"
 france_md.303.a: "그들은 우리를 믿어도 좋다"
 france_md.303.b: "영국인들은 무엇보다 우리의 동맹이다"
 france_md.304.t: "무역 관계 확대를 제안하는 프랑스"
 france_md.304.d: "프랑스의 보나파르트주의 지도자는 유럽의 분노를 샀으며, 이제 과거 파트너들에 대한 적대감으로 고립된 자국 경제가 그 어느 때보다 우리의 전문성과 산업 역량을 필요로 한다며 무역 관계 확대를 제안하고 있습니다. 프랑스 외교관들은 나폴레옹과 혁명기 프랑스가 오랫동안 우리에게 중요한 동맹이었음을 강조합니다. 그러나 프랑스는 다른 유럽 열강, 그중 대부분은 우리의 동맹국이기도 한 나라들과 싸우는 데 전념해 왔으며, 무역을 통해 그들의 전쟁 수행을 지원하는 것은 그들의 불만을 살 수 있습니다."
 france_md.304.a: "무역이 늘어나는 것은 언제나 좋은 일이다"
 france_md.304.b: "우리는 그들의 공범이 되지 않겠다"
 france_md.305.t: "유럽 연합을 탈퇴하는 프랑스"
 france_md.305.d: "프랑스 파트너국의 큰 위기에 뒤이어, 절대 군주제로의 복귀를 요구하는 민족주의 운동이 프랑스 국가를 장악했습니다. 그 이후 그들은 프랑스 내에 남아 있던 친유럽 정서의 잔재를 파괴하는 데 나섰습니다. 이제 그들은 프랑스의 유럽 연합 탈퇴를 선언합니다. 그들은 협상을 단호히 거부하는 모습을 보였습니다. 이 민족주의 운동의 승리는 유럽 통합에 생긴 균열일 뿐 아니라 연합 내 모든 유럽 회의주의자들의 본보기이기도 합니다."
 france_md.305.a: "민족주의는 우리 유럽 연합에 위협이다"
 france_md.306.t: "프랑스에서 승리한 군주주의자들"
 france_md.306.d: "프랑스에서 군주주의 동지들이 거둔 승리는 유럽 전체를 뒤흔들었습니다. 연합의 한 축이 민족주의를 받아들인 것만으로도 브뤼셀을 격분시키기에 충분했습니다. 왕당파는 외교 정책의 방향을 유럽 연합과 그 가치, 그리고 그 미래에 맞서는 쪽으로 돌렸으며, 이는 우리 군주주의자들이 오랫동안 우리의 입을 막으려 한 연합과 맞서 온 것과 같습니다. 유럽 전역에서 프랑스의 사례는 유럽 관료제에 대한 반대를 부추기는 듯합니다. 우리나라는 이미 군주주의 대의에 헌신하고 있으므로, 프랑스의 승리는 곧 모든 곳의 유럽 민족주의자들의 승리입니다."
 france_md.306.a: "유럽 민족주의의 승리"
 france_md.307.t: "우리 정치에 압력을 가하는 프랑스 왕국"
 france_md.307.d: "예견한 대로 프랑스의 민족주의적이고 반유럽적인 수사는 우연이 아니었습니다. 군주제의 승리 이후 유럽 연합은 모든 곳의 민족주의자들의 표적이 되었으며, 프랑스는 적으로 간주하는 상대에게 전쟁을 벌일 명백한 의지를 보였습니다. 이제 우리 국민 중 일부는 전쟁의 재래를 두려워하고, 이미 유럽에 미지근했던 다른 일부는 민족주의자들의 편에 서서 우리 정부를 상대로 불안정을 조장하는 활동을 벌이고 있으며, 이들은 국제 선전 기구로 변모한 프랑스 정보기관의 지원과 훈련을 받고 있습니다. 이를 심각하게 받아들여야 합니다. 그들의 목표는 우리를 분열시키는 것입니다."
 france_md.307.a: "유럽은 결국 민족주의를 이길 것이다"
 france_md.308.t: "우리를 자국의 십자군에 초대하는 프랑스"
 france_md.308.d: "프랑스에서 민족주의 동지들이 거둔 승리는 유럽 전체를 뒤흔들었습니다. 자신들의 적대 세력으로 보는 연합을 넘어, 프랑스 왕국은 유럽과 세계 전역에서 기독교 신앙을 수호하겠다고 선언했으며, 서구 민주주의를 사람들을 종교에서 멀어지게 한 타락이라고 규탄하고 교회의 권력 복귀를 촉구하고 있습니다. 우리나라는 기독교인이 다수이므로 이 호소는 부분적으로 우리를 향한 것이며, 그들은 기독교를 과거의 힘으로 되돌리기 위해 연합하자고 제안합니다. 이 초대는 주님을 위한 권력을 가져다줄 수 있지만, 유럽에서의 전쟁 재개를 보장하는 것이기도 합니다."
 france_md.308.a: "우리는 그들의 십자군에 합류하겠다"
 france_md.308.b: "우리는 이러한 기독교관을 공유하지 않는다"
 france_md.309.t: "제10차 십자군을 준비하라"
 france_md.309.d: "몇 주째 우리 국왕은 성지를 되찾겠다는 흔들림 없는 결의를 보이고 있지만, 우리는 그 지역에 발판이 전혀 없습니다. 우리의 레바논 파트너들은 우리와 우호적인 관계를 유지하고 있으나, 그들의 정부는 너무 불안정하고 이란의 영향을 받고 있어 도움이 되지 못합니다. 그럼에도 상당한 마론파 기독교 소수 집단이 있는 레바논은 우리 십자군의 이상적인 상륙 지점입니다. 상륙 개입을 준비할 수도 있는데, 이는 우리 해군을 강화하겠지만 우리를 무고한 국가에 대한 침략자로 낙인찍을 것입니다. 또는 정치적 압력을 가할 수도 있는데, 이는 위험이 적지만 성공을 보장하지는 못합니다."
 france_md.309.a: "먼저 그들에게 (물론 정중하게) 요청해야 한다"
 france_md.309.b: "우리와 함께하지 않는 자들은 어차피 우리의 적이다"
 france_md.310.t: "우리의 독립을 위협하는 프랑스 왕국"
 france_md.310.d: "프랑스 왕국은 몇 달 전 성지를 재정복하겠다는 의사를 밝히고 예루살렘을 향한 제10차 십자군을 준비해 왔습니다. 이를 위해 그들은 예루살렘 인근의 발판이 필요하며, 우리나라의 강력한 마론파 소수 집단 때문에 우리가 그들의 표적이 되었습니다. 프랑스 선동가들은 이제 우리의 정통성을 훼손하고 마론파가 우리 정부를 전복하도록 압박하는 데 힘쓰고 있습니다. 프랑스의 지배는 이스라엘과 헤즈볼라의 간섭으로부터 우리를 지켜 줄 수 있겠지만, 형제 간의 전쟁으로 우리나라를 갈가리 찢어 놓을 가능성이 높습니다. 이것이 정말 우리가 원하는 바입니까?"
 france_md.310.a: "그들이 호전적인 이웃으로부터 우리를 지켜 줄 것이다"
 france_md.310.b: "그들은 분쟁만 더 가져올 것이다!"
 france_md.311.t: "우리의 요구에 굴복한 레바논"
 france_md.311.d: "오늘 아침은 위대한 날입니다. 우리의 압력에 따라 레바논 정부는 마론파 기독교 시위대의 요구에 굴복한다고 발표했습니다. 곧이어 마론파가 다수인 정부가 구성되었으며 레바논을 우리의 보호 아래 두었습니다. 우리는 외교를 우선시한 올바른 선택을 했습니다. 이는 이란의 영향력을 약화시키므로 서방 열강도 반대할 이유를 찾지 못할 것입니다. 우리는 지정학적으로 훌륭하게 움직였습니다. 이제 남은 것은 우리와 천국의 왕국 사이를 가로막는 자들을 상대로 한 지상 분쟁을 준비하는 일입니다."
 france_md.311.a: "예루살렘이 손에 닿을 곳에 있다"
 france_md.312.t: "우리를 거부한 레바논"
 france_md.312.d: "오늘 아침 레바논은 자국 정치에 대한 프랑스의 압력에 굴복하지 않겠다고 공개적으로 발표했습니다. 우리의 선동가들은 아무 효과도 내지 못했던 것으로 보이며, 우리 대의에 대한 마론파의 지지도 충분하지 않았습니다. 우리의 실패는 레바논이 이란과 헤즈볼라의 통제 아래 굳건히 남아 있기 때문일 가능성이 높습니다. 그러나 레바논이 우리와의 협력을 거부했다고 해서 끝은 아닙니다. 필요할 때 언제든 그들에게 돌아갈 수 있으며, 이번에는 그들이 저항하지 못할 것입니다. 하지만 우리의 정치적 노력은 실패한 듯합니다. 어쩌면 앞으로 필요할지도 모르니, 타국에 압력을 가하는 방식과 국제 외교 강화에 집중해야 할 것입니다."
 france_md.312.a: "해상 개입을 준비한다"
 france_md.312.b: "외교를 강화해야 한다. 우리의 강점은 아닌 듯하다"
 france_md.313.t: "우리 정부의 몰락을 요구하는 프랑스 코뮌"
 france_md.313.d: "몇 달 전 프랑스 코뮌은 세계에 혁명을 가져오겠다는 의지를 선언했으며, 이제는 우리에게 압력을 가하는 듯합니다. 선전 선동가들이 우리 국민 사이에 잠입해 시민들이 그들의 대의에 합류하도록 선동하고 있으며, 시위대와 공산주의 극단주의자 집단이 이미 조직되었습니다. 프랑스 사절들은 우리가 굴복하지 않으면 개입하겠다고 경고했습니다. 우리는 항복하고 프랑스에 합류하여 독립을 잃을 수도 있고, 우리 정부를 위협하는 극단주의자들을 투옥할 수도 있습니다."
 france_md.313.a: "혁명 만세"
 france_md.313.b: "붉게 사느니 차라리 죽겠다"
 france_md.314.t: "세계 혁명에 합류한 [FROM.GetName]"
 france_md.314.d: "[FROM.GetName]은(는) 방금 우리의 시위와 외교적 압력에 따라 정부가 무너졌다고 발표했습니다. 이는 우리에게 아주 좋은 소식입니다. 새로운 세력이 피 한 방울 흘리지 않고 혁명에 합류했습니다. 다른 자본주의 열강들은 세계 질서의 이 극적인 변화에 충격을 받았다고 발표했습니다. 그들은 항의할 수 있겠지만 인민의 의지에 맞설 수는 없습니다. 혁명은 결국 그들에게도 찾아갈 것입니다. [FROM.GetName]의 몰락은 시작에 불과하며, 다른 나라들도 뒤를 이을 것입니다."
 france_md.314.a: "혁명이 커져 간다"
 france_md.315.t: "인민의 뜻을 거부한 [FROM.GetName]"
 france_md.315.d: "[FROM.GetName] 정부의 몰락을 요구하던 시위는 사그라든 것으로 보입니다. 실제로 [FROM.GetName] 정부는 시위를 폭력적으로 진압하고 어떠한 타협도 거부했습니다. 이 분출이 인민의 의지를 꺾은 것처럼 보인다면, 어쩌면 우리가 [FROM.GetName]의 혁명에 더 깊이 관여해야 할지도 모릅니다. 우리 군은 주권을 가진 인민의 뜻을 관철하기 위해 군사적으로 개입할 준비가 되어 있습니다. 그러나 이 개입은 대규모 분쟁으로 번질 수 있습니다. 개입해야 합니까, 말아야 합니까?"
 france_md.315.a: "그들이 좋아하든 싫어하든 혁명은 올 것이다"
 france_md.315.b: "우리는 돌아올 것이다"
 france_md.316.t: "유럽의 승리한 코뮌"
 france_md.316.d: "오늘은 우리 코뮌에게 위대한 날입니다. 우리는 유럽 전체에 혁명을 가져왔습니다. 소비에트 연방이 무너진 이후 이 대륙에는 자본주의자들과 싹트는 민족주의자들이 가득했지만, 제재도, 폭격도, 프롤레타리아를 권력에 올리기 위해 치른 전쟁도 우리를 막지 못했습니다. 때로는 억압자들에게 대포로 교훈을 가르쳐야 했지만, 혁명의 승리는 그 수단을 정당화합니다. 인민의 군대가 파리를 행진하는 가운데, 유럽은 자본주의에서 멀리 떨어진 건전한 토대 위에서 재건을 시작합니다. 우리의 다음 목표는 모든 곳의 국제주의자들의 꿈, 즉 모든 노동자가 고향처럼 느끼는 거대한 연방을 실현하는 것입니다."
 france_md.316.a: "인터내셔널은 인류가 될 것이다"
 france_md.317.t: "아르덴을 가로질러"
 france_md.317.d: "우리 황제는 오랫동안 신생 제국에 필수적인 베네룩스 침공을 논의해 왔습니다. 벨기에는 왈로니아에 상당한 프랑스어권 소수 집단을 두고 있으며 유럽 연합의 신경 중추이면서도 방어가 허술해, 우리의 정당한 국경을 회복하기 위한 완벽한 첫 번째 표적입니다. 우리는 이 땅을 정당하게 우리의 것으로서 영구히 점령할 것이므로, 황제는 폭격을 피하고 적이 준비하기 전에 신속히 타격하라고 명령했습니다. 이제 아르덴 너머 프랑크 민족의 요람을 되찾을 때입니다."
 france_md.317.a: "그들에게는 승산이 없다"
 france_md.318.t: "제2차 스페인 원정"
 france_md.318.d: "우리 황제는 모스크바를 향한 동진에 앞서 서쪽 측면을 확보하는 데 필수적인 이베리아 반도의 정복을 명령했습니다. 스페인을 차지하면 지중해 장악의 열쇠인 지브롤터에 가까워집니다. 산악 지형은 방어자에게 유리하므로, 황제는 알프스 엽병을 앞세운 느리지만 확실한 진격을 요구하면서도 적이 준비하기 전에 서두를 것을 촉구합니다. 나폴레옹의 패배는 정복한 땅을 유지해야 함을 가르쳐 주었습니다. 우리는 안정적인 괴뢰국을 세우거나 점령군을 강화해야 합니다."
 france_md.318.a: "이번에는 그들을 면밀히 감시할 것이다"
 france_md.319.t: "라인강 너머로"
 france_md.319.d: "우리 황제는 다음 적으로 독일을 지명했습니다. 독일은 유럽의 경제적 심장부이며 우리가 혐오하는 유럽관에 헌신하고 있습니다. 충돌은 불가피했으며, 이는 궁극의 적인 모스크바를 향한 동진의 첫걸음입니다. 프로이센에 대한 나폴레옹의 전격전부터 스당과 두 차례의 세계 대전에 이르기까지, 우리는 이 적을 잘 알고 있습니다. 황제는 목표를 확보하기 위해 강력한 전차와 항공 전력을 동반한 확실하고 준비된 진격을 명령했으나, 전면 점령은 필요하지 않습니다. 이 전쟁은 불행하지만 불가피합니다."
 france_md.319.a: "다시는 스당이 되풀이되지 않는다!"
 france_md.320.t: "알프스를 위한 전쟁"
 france_md.320.d: "나폴레옹 1세의 러시아 퇴각 때 동맹국들은 그가 약해지는 순간 반기를 들었습니다. 그러므로 모스크바로 진군하기에 앞서 우리 황제는 남쪽 측면, 곧 이탈리아와 구 오스트리아-헝가리 영토를 확보하라고 명령했습니다. 지금은 사소한 위협이지만 러시아 원정이 길어지면 위험해질 수 있습니다. 이들 지역의 산악 지형은 거점의 방어자를 몰아내기 위한 알프스 엽병과 포병을 요구하며, 러시아에서 필요할 병력을 낭비하지 않고 후방을 확보할 수 있게 해 줍니다. 이 나라들은 잘못된 시간에 잘못된 장소에 있습니다."
 france_md.320.a: "신성 로마 제국을 이번에야말로 완전히 묻어 버리겠다!"
 france_md.321.t: "우리에게 전쟁 준비를 촉구하는 황제"
 france_md.321.d: "우리의 프랑스 동맹국은 러시아를 유럽과 우리가 이제 공유하는 제국에 대한 위협으로 보고 이를 파괴하는 방안을 논의하기 위한 회의를 소집했습니다. 그들은 우리에게 군사 역량을 구축할 것을 촉구하고 우리의 생산을 최적화하기 위해 무기 전문가들을 파견했으며, 구호는 하나입니다. 길고 힘든 전쟁에 대비하라는 것입니다. 이 발표는 죽음으로 부름받을 수 있는 시민들에게는 암울한 소식이지만, 이 전쟁은 필요하고 정당합니다. 우리가 그들의 표적이 되기 전에 러시아로부터 유럽을 지켜야 합니다."
 france_md.321.a: "감사합니다, 폐하"
 france_md.322.t: "글라시스를 돌파하라"
 france_md.322.d: "모스크바로의 진군이 임박했지만, 먼저 출발점을 확보해야 합니다. 동유럽은 한때 러시아의 팽창에 대한 완충 지대였으나 이제는 우리 자신에게 장애물이 되었습니다. 우리는 함께할 의사가 있는 이들에게 손을 내밀었으나 나머지는 우리의 호소를 무시했고, 이제 그들에게 심판의 날이 왔습니다. 갓 독립한 이 나라들을 짓밟는 것은 어렵지 않을 것입니다. 우리는 포병의 지원을 받는 기갑 돌파로 신속히 진격합니다. 그들은 끝까지 싸울 것입니다. 자비를 베풀지 마십시오."
 france_md.322.a: "프랑스는 세계에 평화와 자유를 모두 선사할 것이다"
 france_md.475.t: "제2차 러시아 원정"
 france_md.475.d: "수년간의 준비 끝에 때가 되었습니다. 우리 황제는 가장 큰 적이자 나폴레옹 1세 때와 마찬가지로 불가피한 위협인 러시아에 대한 원정의 최종 명령을 내렸습니다. 이번에는 그도 망설입니다. 언제나 자국 영토를 지켜 온 강국을 상대로 어떠한 실수도 허용되지 않기 때문입니다. 무엇을 결정하든 속도가 필수적입니다. 적 또한 준비하고 있기 때문입니다. 올바른 선택을 하되, 이것만은 그들에게 알리십시오. 주권을 가진 인민이 전진할 것이며, 폭군들은 무덤으로 내려가 숨을 것이다!"
 france_md.475.a: "신속한 공세다. 2주 안에 모스크바에 입성하겠다!"
 france_md.475.b: "소모전에 대비하자"
 france_md.476.t: "봉쇄를 돌파하라"
 france_md.476.d: "우리 경제와 국민은 배신자 알비온의 손에 이미 충분히 고통받았으며, 이제 유럽을 확보한 지금 우리는 가장 오래된 적에게 눈을 돌릴 수 있습니다. 그들의 비참한 섬으로 향하는 길을 막고 있는 것은 오직 영불 해협뿐입니다. 우리 황제는 두 가지 선택지를 제시합니다. 제공권을 장악하여 폭탄으로 그들을 짓누른 뒤 병력을 낙하산으로 투하하는 방안, 또는 약해진 그들의 해군을 이용해 함대를 집중하고 직접 상륙하는 방안입니다. 속도가 필수적입니다. 올바른 선택을 하십시오, 시민이여. 우리의 승리는 임박했습니다."
 france_md.476.a: "그들의 해군은 이제 과거의 그림자일 뿐이다. 라 루아얄이 쉽게 해치울 것이다"
 france_md.476.b: "블리츠 2.0이라, 좋다"
 france_md.477.t: "대륙 봉쇄령의 승리를 선포한 황제"
 france_md.477.d: "그들은 우리에게 제재를 가했고, 금수 조치를 했고, 우리를 폭격했습니다. 그러나 우리의 정신을 꺾지는 못했습니다. 수년간의 전쟁 끝에 우리 황제는 승리를 선언했습니다. 유럽은 다시 한번 프랑스 제국 앞에 고개를 숙였습니다. 이 정복은 수천 명의 프랑스인의 목숨이라는 대가를 치렀으며, 이들은 잊히지 않을 순교자입니다. 승전일은 이제 이들을 기리는 공휴일입니다. 그러나 유럽에서의 우리 승리가 모든 것을 해결하는 것은 아닙니다. 조만간 우리는 다른 전선에서 다른 강국들과 맞서게 될 것입니다. 프랑스는 영원합니다. 전쟁도 그렇습니다."
 france_md.477.a: "영광의 날이 도래했다"
 france_md.478.t: "우리 왕국은 어떤 과업을 택할 것인가?"
 france_md.478.d: "프랑스 왕국의 수장으로서 우리의 입지는 확고합니다. 우리는 혁명을 분쇄하고 종교를 합당한 자리로 되돌렸습니다. 이제 문제는 과거의 영광을 되찾는 일을 어디서부터 시작할 것인가입니다. 우리는 조상 대대로의 프랑크 땅을 되찾을 수 있지만, 이는 그 땅을 내주려 하지 않는 과거의 동맹국과의 전쟁을 촉발할 것입니다. 또는 성지 해방을 위해 먼저 진군함으로써 모든 곳의 기독교인들의 마음을 얻을 수도 있으며, 이 경우 우리 영토에서 전쟁을 치르는 일은 피할 수 있습니다. 무엇을 결정하든 우리는 두려울 것이 없습니다. 하나님이 우리 편이기 때문입니다."
 france_md.478.a: "우리는 무엇보다 먼저 프랑크인이다"
 france_md.478.b: "십자군은 기다려 주지 않는다. 우리의 성지를 해방해야 한다"
 france_md.479.t: "우리의 병합을 요구하는 프랑스 왕국"
 france_md.479.d: "오늘 아침 프랑스 동료들로부터 매우 이상한 요구가 도착했습니다. 그들의 국왕은 더 이상 우리의 주권을 인정하지 않으며, 우리 영토와 비축물, 군대를 그의 지휘 아래 넘기라고 요구하면서 우리 국민이 원활하게 통합될 것이라고 약속합니다. 만우절 장난처럼 읽히지만, 프랑스 참모본부는 특별 동원령을 발표했고 모든 증거가 우리 영토에 대한 임박한 개입을 가리키고 있습니다. 항복할 것인가, 싸울 것인가. 무엇을 결정하든 신속히 행동해야 합니다."
 france_md.479.a: "분쟁은 우리 국민에게 불필요한 고통을 안길 것이다"
 france_md.479.b: "감히 어떻게? 우리는 주권 국가이다"
 france_md.480.t: "우리의 요구를 충족한 [FROM.GetName]"
 france_md.480.d: "첫 포성이 울리기도 전에 [FROM.GetName] 정부는 해산과 우리 왕국에 대한 무조건 항복을 발표했습니다. 이는 우리 국민과 우리 외교적 노력에 매우 좋은 소식입니다. 우리 국왕은 새로운 프랑스 시민들의 신분이 가능한 한 빨리 정식화되고 가능한 한 효과적으로 통합될 것이라고 약속했습니다. 이것은 그들이 내릴 수 있었던 가장 현명한 결정이었습니다. 그들은 우리의 개입에 저항할 수 없었을 것입니다."
 france_md.480.a: "때로는 정중히 부탁하기만 하면 된다"
 france_md.481.t: "굴복을 거부한 [FROM.GetName]"
 france_md.481.d: "[FROM.GetName] 정부는 방금 자국을 위협하려는 우리의 시도를 규탄한다고 발표했습니다. 우리의 민족적 요구는 협상 테이블에 오를 자리가 없다는 것입니다. 이 외교적 차질은 예상된 일이었습니다. 주권 국가가 싸워 보지도 않고 항복을 발표한다면 오히려 이상했을 것입니다. 다행히 우리는 바로 이러한 사태에 대비해 두었습니다. 우리 군은 그들의 영토에 개입할 준비가 되어 있습니다. 그러나 공개적인 분쟁이 정의를 확보하는 최선의 방법이라고는 확신할 수 없습니다."
 france_md.481.a: "그들은 후회하게 될 것이다"
 france_md.481.b: "이것이 우리의 끝은 아니다"
 france_md.482.t: "우리의 복종을 요구하는 프랑스 왕국"
 france_md.482.d: "오늘 아침 프랑스 동료들로부터 매우 이상한 요구가 도착했습니다. 카롤루스 왕조 시대를 들먹이는 그들의 국왕은 고조되는 긴장 속에서 더 이상 우리가 교황청을 보호하리라 신뢰하지 않으며, 우리 정부에 대한 완전한 통제권과 자신이 직접 관할하려는 바티칸으로의 통로를 요구하고 있습니다. 이는 용납할 수 없는 일입니다. 우리는 단 한 번도 교황청을 저버린 적이 없으며, 종교가 이웃 나라의 민족주의적 야망을 정당화할 수는 없습니다. 그러나 이것은 빈말이 아닙니다. 프랑스 참모본부는 특별 동원령을 내렸고 모든 증거가 우리 영토에 대한 개입을 가리키고 있습니다. 굴복할 것인가, 싸울 것인가. 무엇을 결정하든 신속히 행동해야 합니다."
 france_md.482.a: "우리는 그들의 상대가 되지 못한다"
 france_md.482.b: "감히 어떻게? 우리는 주권 국가이다"
 france_md.483.t: "우리의 요구를 거부한 [FROM.GetName]"
 france_md.483.d: "[FROM.GetName] 정부는 방금 자국을 위협하려는 우리의 시도를 규탄한다고 발표했습니다. 그들은 우리의 요구에 굴복하기를 거부하며 자국의 결정과 정책에 대한 주권을 지키고자 합니다. 그들이 이성에 호소하는 우리의 말을 거부한 것으로 보입니다. 이대로 넘어가게 둘 수는 없습니다. 우리 군은 그들의 나라에 군사적으로 개입할 준비가 되어 있습니다. 우리의 적들이 힘을 합쳐 우리에게 맞서는 위험을 감수할 수는 없습니다. 그들을 본보기로 삼아야 합니다. 그러나 [FROM.GetName]과(와)의 전쟁은 우리가 필요로 하는 것이 아닐 수도 있습니다."
 france_md.483.a: "그들은 자신들이 총구 앞에 서 있다는 것을 깨닫지 못했다"
 france_md.483.b: "다른 방법으로도 그들을 굴복시킬 수 있다"
 france_md.484.t: "우리의 복종을 요구하는 프랑스 왕국"
 france_md.484.d: "오늘 아침 프랑스 동료들로부터 매우 이상한 요구가 도착했습니다. 그들의 국왕은 더 이상 우리가 국민을 보호하리라 신뢰하지 않으며, 우리 정부가 현재의 동맹 균형에서 잘못된 편에 서 있다고 주장하면서 우리 정부와 군대에 대한 완전한 통제권을 요구하고 있습니다. 이 요구는 터무니없습니다. 우리는 영토를 통치하는 데 실패한 적이 없으며, 우리의 권위는 오직 국민의 위임에서 나옵니다. 그러나 이것은 빈말이 아닙니다. 프랑스 참모본부는 특별 동원령을 내렸고 모든 증거가 우리 영토에 대한 개입을 가리키고 있습니다. 굴복할 것인가, 싸울 것인가. 무엇을 결정하든 신속히 행동해야 합니다."
 france_md.484.a: "우리는 그들의 상대가 되지 못한다"
 france_md.484.b: "오직 우리 국민만이 주권자이다"
 france_md.485.t: "서방 제국의 부상"
 france_md.485.d: "수년간의 투쟁과 배신 끝에 프랑크 민족이 승리했습니다. 우리가 찬탈한 공화국을 전복했을 때 유럽은 우리를 배척하고 제재했지만, 하나님은 언제나 우리 편이었습니다. 교회의 장녀인 프랑스는 결코 공화국이 될 운명이 아니었습니다. 프랑크 민족의 적들은 멸망할 수밖에 없었으며, 이제 프랑크인들은 자신들의 땅을 되찾았습니다. 이제 우리 제국을 선포할 때입니다. 서방의 제국, 신앙의 제국, 우리의 영원한 보호를 위해 교황청이 축성한 제국입니다. 어쩌면 동쪽으로 출발해 성지를 되찾을 때이기도 할 것입니다."
 france_md.485.a: "그리고 이번에는 내가 직접 왕관을 씌우겠다"
 france_md.485.b: "신이 그것을 원하신다!"
 france_md.486.t: "우리의 복종을 요구하는 프랑스 왕국"
 france_md.486.d: "오늘 아침 프랑스 동료들로부터 매우 이상한 요구가 도착했습니다. 자신이 개시한 제10차 십자군을 끝까지 완수하려는 그들의 국왕은 우리의 섬 영토가 그의 진로에 놓여 있다고 주장하며, 덤으로 우리 정부에 대한 완전한 통제권과 함께 이를 요구하고 있습니다. 이는 용납할 수 없는 일입니다. 종교가 이웃 나라의 민족주의적 야망을 정당화할 수는 없습니다. 그러나 이것은 빈말이 아닙니다. 프랑스 참모본부는 특별 동원령을 내렸고 모든 증거가 우리 영토에 대한 개입을 가리키고 있습니다. 굴복할 것인가, 싸울 것인가. 무엇을 결정하든 신속히 행동해야 합니다."
 france_md.486.a: "이것이 이 원정의 성공을 보장하는 최선의 방법이다. 받아들이겠다"
 france_md.486.b: "감히 어떻게? 우리는 주권 국가이다"
 france_md.487.t: "승리한 제10차 십자군"
 france_md.487.d: "지중해와 중동 전역에서 벌어진 수개월의 치열한 전투 끝에 우리는 승리를 거두었습니다. 섬에서 섬으로 이동하며 마지막 기독교 거점을 확보한 뒤 예루살렘 자체를 포위했습니다. 수많은 적이 우리 앞을 가로막았고 많은 프랑스인이 우리의 복수심 어린 힘에 쓰러진 무고한 이들과 함께 목숨을 잃었지만, 목적은 수단을 정당화합니다. 우리의 성과를 공고히 하고 중동의 불안정을 무력화한 지금, 한 가지 질문이 남아 있습니다. 여기서 멈춰야 합니까, 아니면 유럽의 종교 전쟁이 이루지 못한 일을 끝마쳐야 합니까?"
 france_md.487.a: "새로운 십자군이 있을 것이다"
 france_md.487.b: "예루살렘 왕국을 복원하여 우리의 목표를 달성했다. 더 나아갈 필요는 없다"
 france_md.488.t: "우리에게 자국 동맹에 가입할 것을 촉구하는 프랑스 왕국"
 france_md.488.d: "프랑스 외교관들로부터 제안이 도착했습니다. 중동 원정을 마무리한 프랑스의 국왕은 가톨릭 교회의 수호자로서 이제 자신의 권위를 거부하는 모든 자들에게 선전포고하며, 다가오는 홍수 앞의 노아의 방주에 비유한 동맹에 우리를 초대합니다. 이 발표는 두려울 만큼 광기 어린 것이며, 귀향 중인 십자군 병력의 동원령이 동반되었습니다. 이 제안은 그들이 십자군을 수행한 맹렬함을 감안하면 최후통첩에 가깝게 읽히며 진지하게 받아들여야 합니다. 무엇을 결정하든 신속히 해야 합니다."
 france_md.488.a: "그들이 적이 되기보다 우리 편에 서 있는 것이 낫다"
 france_md.488.b: "그들이 미쳤단 말인가?"
 france_md.489.t: "유럽에서 승리한 제11차 십자군"
 france_md.489.d: "이번 십자군은 지난번보다 더 피비린내 났습니다. 강대국들을 상대했기에 수행하기도 더 어려웠습니다. 그러나 우리는 해냈습니다. 우리는 승리했습니다. 하지만 상처를 보살피고 우리나라와 우리가 정복한 지역들을 재건하는 가운데 한 가지 의문이 생깁니다. 그들이 올바른 길을 걷도록 정책에 엄격한 통제를 가해야 합니까? 아니면 그들에게 빛을 보여 주고 스스로 결정하게 해야 합니까? 선택하게 해 준다면 우리는 관용을 보여 줄 수 있으며 그들이 반란을 일으킬 가능성도 낮아질 것입니다. 반대로 더 엄격한 통제를 행사하면 다른 어떤 양도 길을 벗어나지 않도록 하는 데 도움이 될 것입니다. 우리는 어떻게 해야 합니까?"
 france_md.489.a: "그들을 감시해야 한다"
 france_md.489.b: "때가 되면 주님께서 그들을 심판하실 것이다"
 france_md.490.t: "자연 국경의 회복"
 france_md.490.d: "리슐리외에서 드골에 이르기까지 프랑스의 자연 국경이라는 개념은 한 번도 버려진 적이 없습니다. 이는 프랑크 민족의 민족적 영유권과 우리의 안보 모두에 뿌리를 둔 근본적인 관심사입니다. 오늘 우리는 이 운명을 완수할 수 있습니다. 우리는 라인강 연안에서 적들을 몰아냈고 산악 진지를 확보했으며, 현지 주민들은 마침내 새로운 질서를 받아들였습니다. 이제 남은 것은 이 병합을 공식화하는 일입니다. 이를 통해 우리는 혁명의 복수를 하고 제국과 프랑스 국민을 위한 안전과 번영의 시대를 엽니다."
 france_md.490.a: "프랑스의 국경은 자연이 정한다 (당통, 1793)"
 france_md.491.t: "프랑크 민족의 통합"
 france_md.491.d: "너무 오랫동안 프랑스의 영향력을 제한하려는 세력들이 프랑크 민족의 통일을 방해해 왔으며, 베네룩스 같은 국가들을 프랑크인과 다른 게르만 민족 사이의 전장으로 떼어 내고 유럽 연합이 우리의 진정한 조국이라고 우리를 설득해 왔습니다. 그러나 프랑크인의 운명은 오직 프랑크인에게 속하며, 그 무엇도 그들을 영원히 갈라놓을 수 없었습니다. 우리는 프랑스 민족을 낳은 조상 대대로의 땅을 되찾았으며, 몇 달 후 우리의 피를 나눈 형제들은 자신들의 운명이 우리와 함께 있음을 깨달았습니다. 이제 왕국이 온전해졌으니 정의가 실현되었습니다."
 france_md.491.a: "모든 프랑크인을 위한 국가"
 france_md.492.t: "카롤루스 왕조의 귀환"
 france_md.492.d: "카롤루스 대제가 죽자 그의 제국은 서프랑크, 중프랑크, 동프랑크로 나뉘었고, 프랑크인들이 땅을 빼앗기면서 프랑크 황제의 유산은 퇴색하기 시작했습니다. 우리는 이 실수를 바로잡았습니다. 수년간의 분쟁 끝에 우리는 찬탈자들을 우리 영토에서 몰아냈으며, 그곳 주민들에게 그들이 결코 독일인이나 이탈리아인, 스위스인이 아니라 단지 잊고 있었던 프랑크인이었음을 보여 주었습니다. 이 재통일을 통해 우리는 베르됭 조약의 잘못과, 잘못된 토대 위에 세워진 천 년의 유럽을 바로잡습니다. 이날은 새로운 프랑크 유럽의 시작을 알립니다."
 france_md.492.a: "제국과 프랑크 국가는 하나이다"
 france_md.493.t: "다시 떠오른 예루살렘 왕국"
 france_md.493.d: "천 년 가까이 전, 우리의 십자군 선조들은 가장 소중한 소유물을 빼앗기는 것을 지켜보았습니다. 아홉 번의 십자군으로도 우리의 성지를 정복하고 지키기에는 부족했지만, 우리는 주님께 한 이 약속을 이행하기 위해 돌아왔습니다. 우리는 레바논의 마지막 기독교 거점 안에서 중동의 발판을 되찾았고, 예루살렘과 성지를 탈환했습니다. 이어서 중동에 우리 왕국을 세우고 성지가 안전을 보장하기 위해 우리의 통제 아래 있어야 함을 주민들에게 이해시키기 위한 투쟁이 이어졌습니다."
 france_md.493.a: "제10차 십자군이 승리했다!"
 france_md.494.t: "다시 태어난 제국"
 france_md.494.d: "약 150년 전 나폴레옹의 제2제국은 프로이센과 게르만 민족에게 무너졌고, 이는 프랑스에게 한 세기에 걸친 복수와 분쟁의 시작이었습니다. 모두가 과거 식민 강국이었던 우리의 완만한 쇠퇴를 예측했지만, 우리 보나파르트주의자들은 불안정한 공화국으로부터 권력을 빼앗고 프랑스를 과거의 영광으로 되돌림으로써 그들이 틀렸음을 증명했습니다. 대가가 따랐지만, 우리는 나폴레옹 1세의 제1제국 국경을 되찾고 적대 세력을 몰아냈습니다. 제8차 대연합에 대한 이 역사적 승리로 프랑스는 세계에 자신이 돌아왔음을 보여 주었고, 대륙 봉쇄령이 이제 유럽에서 승리를 거두고 있습니다."
 france_md.494.a: "삼세번째는 성공이다"
 france_md.495.t: "식민 제국의 귀환"
 france_md.495.d: "보나파르트주의 제국들은 언제나 유럽 지배를 중심에 두었지만, 아이티 반란에서 나폴레옹 3세의 아프리카 팽창에 이르기까지 식민지 또한 매우 중요했습니다. 식민 제국이 무너진 이후 우리는 한때 통제하던 나라들에서 점차 밀려났으며, 이제 자연스러운 질서를 회복할 때입니다. 우리 황제는 해외 도와 지역의 병력을 동원하여 과거 식민지로의 프랑스 복귀를 준비하라고 명령했으며, 이들은 이러한 환경에 더 적합합니다. 우리는 해안 도시를 침공해 해군 기지를 확보한 뒤 기후가 더욱 혹독해지는 내륙으로 진격할 것입니다."
 france_md.495.a: "식민지의 그 축복받은 시절"
 france_md.496.t: "우리의 병합을 요구하는 프랑스 종주국"
 france_md.496.d: "프랑스가 우리 정치에 가한 통제가 조만간 이런 결말을 맞으리라는 것을 깨달았어야 했습니다. 프랑스 당국은 방금 우리나라가 곧 프랑스에 흡수될 것이라고 발표했습니다. 이 발표는 갑자기 나온 것이 아닙니다. 프랑스는 오랫동안 우리 영토 일부를 노려 왔으며 이번에는 이를 차지하기로 결심한 듯합니다. 그들은 자신들이 우리보다 우리나라를 더 잘 통치할 수 있다고 믿습니다. 이 암울한 시기에 우리는 독립뿐 아니라 국민의 안전을 위해서도 선택을 해야 합니다. 굴복하느냐 싸우느냐, 이것이 우리의 선택지입니다. 무엇을 결정하든 신속히 행동해야 합니다."
 france_md.496.a: "우리에게는 이에 맞설 수단이 없다"
 france_md.496.b: "이 땅은 우리의 것이다. 와서 빼앗아 보라고 해라"
 france_md.497.t: "우리의 종주권에 반기를 든 [FROM.GetName]"
 france_md.497.d: "[FROM.GetName] 정부는 우리의 병합 시도를 규탄하며 어떤 대가를 치르더라도 독립을 지킬 준비가 되어 있습니다. 그들은 종속은 받아들이지만 우리가 요구한 영토의 양도를 거부하고 우리 행정부를 추방하며 우리에 맞설 준비를 하고 있습니다. 우리는 본보기를 보이기 위해 지금 이 반란을 진압할 수도 있고, 우리의 복귀를 막을 것이 아무것도 없으므로 처벌을 나중으로 미룰 수도 있습니다."
 france_md.497.a: "이는 그들과, 유혹을 느낄 수 있는 모든 이들에게 교훈이 될 것이다"
 france_md.497.b: "나중에 짓밟아 주겠다"
 france_md.498.t: "우리 산업에 투자하겠다고 제안하는 프랑스"
 france_md.498.d: "프랑스 파트너들이 솔깃한 제안을 해 왔습니다. 유럽은 자신들이 통제할 수 있는 생산 역량에 다시 집중하고자 하며, 이에 프랑스는 유럽의 주권과 회복 탄력성을 강화하는 더 넓은 프로젝트의 일환으로 우리 영토 내 공장 설립을 도와 우리 경제에 투자하겠다고 제안합니다. 이는 우리에게 큰 이익이 되겠지만, 우리의 자본과 기업에 지분을 확보할 수 있는 프랑스인들에게도 이익이 됩니다. 우리 산업을 돕기 위해 주권을 조금 희생해야 합니까?"
 france_md.498.a: "어디에 서명하면 되는가?"
 france_md.498.b: "유럽과 프랑스가 우리 경제에 간섭할 이유는 없다"
 france_md.499.t: "우리의 인프라망에 투자하겠다고 제안하는 프랑스"
 france_md.499.d: "프랑스 파트너들과의 유쾌한 논의 중에 그들은 꽤 매력적인 제안을 해 왔습니다. 유럽의 주요 목표는 EU 국가 간 사람과 물자의 이동을 원활하게 하는 것이며, 그들은 이 점에서 우리나라를 돕고자 합니다. 그리하여 프랑스 정부는 우리의 인프라 현대화를 도와 교통망에 투자하겠다고 제안했습니다. 이 제안은 유럽의 주권을 높이면서 회원국들이 향후 위기를 헤쳐 나갈 수 있도록 돕는 것을 목표로 하는 프로젝트의 일부입니다. 이 제안은 우리에게 매우 유익하겠지만, 우리 인프라 운영에 영향력을 얻을 수 있는 프랑스인들에게도 이익이 될 것입니다. 인프라를 현대화하기 위해 주권을 조금 희생해야 합니까?"
 france_md.499.a: "어디에 서명하면 되는가?"
 france_md.499.b: "우리 인프라망은 그들 없이도 이미 매우 잘 돌아가고 있다"
 france_md.502.t: "우리의 생태 전환에 투자하겠다고 제안하는 프랑스"
 france_md.502.d: "프랑스 파트너들과의 유쾌한 논의 중에 그들은 꽤 솔깃한 제안을 해 왔습니다. 그들의 장기 목표는 유럽을 더 친환경적으로 만드는 것이며, 이에 우리가 녹색 전환에 공동으로 투자할 것을 제안하고 있습니다. 그리하여 프랑스 정부는 우리의 재생 에너지 생산 인프라에 투자할 것을 제안했습니다. 이 제안은 우리에게 매우 유익하겠지만, 우리의 전력 생산에 발판을 얻을 수 있는 프랑스인들에게도 이익이 될 것입니다. 녹색 전환을 추진하기 위해 주권을 조금 희생해야 합니까?"
 france_md.502.a: "어디에 서명하면 되는가?"
 france_md.502.b: "우리에게 그들의 생태 전환은 필요 없다"
 france_md.520.t: "계속되는 분열"
 france_md.520.d: "불행은 홀로 오지 않습니다. 지지율이 떨어지는 가운데 우리 당은 쪼개지고 있습니다. 자유주의 계파는 중도 정당 뒤에 결집했고, 에마뉘엘 마크롱 장관은 우리에게 도전하기 위해 자신의 정당인 라 레퓌블리크 앙 마르슈를 창당했습니다. 좌파 계파 역시 우리의 사회·경제 문제 실적에 실망하여 이탈했으며, 장뤼크 멜랑숑 뒤에 결집하여 자신들만의 급진 좌파 정당을 세우고 있습니다. 이러한 사태는 재앙이지만, 너무 늦기 전에 흐름을 되돌리고 유권자를 되찾을 수 있다는 신호이기도 합니다."
 france_md.520.a: "빌어먹을!"
 france_md.521.t: "우리의 방어 체계를 뚫은 프랑스 요원들"
 france_md.521.d: "오늘 새벽 동틀 무렵, 우리는 자동차 경적과 충돌음에 잠에서 깼습니다. 우리 수도의 거리는 교통 인프라에 대한 사보타주로 보이는 행위 때문에 멈춰 섰습니다. 우리 기술자들은 상황을 복구하기 위해 최선을 다하고 있지만, 사고로 이미 경찰관 여러 명이 목숨을 잃었고 우리 군의 안전 역시 위험에 처했을지 모른다고 우려하고 있습니다. 이 공격은 수개월째 우리에게 적대적인 수사를 쏟아내고 있는 보나파르트주의 프랑스에서 비롯된 것이 분명합니다. 비밀 요원들이 벌이는 이러한 작은 게임이 일상이 되기 전에 대비해야 합니다."
 france_md.521.a: "저주받을 놈들"
 france_md.522.t: "프랑스의 습격을 격퇴한 우리 경찰"
 france_md.522.d: "우리 경찰이 수도에서의 대규모 사보타주를 막아 냈다는 소식을 듣고 안도의 한숨을 내쉬었습니다. 적은 도주하는 데 성공했지만 우리는 최악의 사태를 막았습니다. 그럼에도 이번 공격으로 수도 거리에서 산발적으로 벌어진 충돌 중에 경찰관 두 명이 목숨을 잃었습니다. 이 작전은 수개월째 우리에게 적대적인 수사를 쏟아내고 있는 보나파르트주의 프랑스에서 비롯된 것이 분명합니다. 비밀 요원들이 벌이는 이러한 작은 게임이 일상이 되기 전에 대비해야 합니다."
 france_md.522.a: "언제나 이렇게 운이 좋지는 않을 것이다"
 france_md.523.t: "제3제정을 선포한 프랑스"
 france_md.523.d: "프랑스가 방금 제국의 복귀를 선언했습니다. 얼마 전 민족주의 군주주의 세력이 프랑스에서 권력을 잡았고 분명히 권력 기반을 공고히 했습니다. 그들은 이에 제국의 귀환을 알리는 성대한 의식을 열었으며, 이제 그것이 화제가 되고 있습니다. 실제로 이 의식은 언론에 보도되었고 소셜 미디어에서 널리 공유되었습니다. 이 기념행사는 단순한 예술적 행사가 아닙니다. 이는 프랑스의 무력 과시이기도 합니다. 수개월째 프랑스는 정복과 분쟁에 대한 욕망을 공공연히 드러내 왔습니다. 따라서 이 선언은 끝이 아니라 시작입니다. 유럽과 전 세계에서 복잡한 사태가 시작되는 것입니다."
 france_md.523.a: "이 위협을 진지하게 받아들여야 한다"
 france_md.523.b: "그들은 오랫동안 위협이 아니었다"
 france_md.524.t: "군에 더 많은 자금을?"
 france_md.524.d: "최근 국방에 대한 우리의 투자는 유럽 방위 전략 속에서 우리의 위치를 유지하는 데 필수적이었지만, 우리가 더 할 수는 없을까요? 유럽에 전쟁이 되돌아올 위협에 직면하여 많은 동맹국이 고강도 분쟁에 대비해 군을 준비시키려고 막대한 자원을 투입했습니다. 어쩌면 우리도 그렇게 하여 무기 생산 역량에 더욱 투자해야 할지 모릅니다."
 france_md.524.a: "아무리 조심해도 지나치지 않다"
 france_md.524.b: "우리는 이미 많은 비용을 썼다"
 france_md.525.t: "우리의 야망을 이루기 위한 자원"
 france_md.525.d: "프랑스 국민에게 더 열심히 일하고 의존 문화를 벗어던지라고 촉구했음에도 현실은 냉혹합니다. 크고 의욕적이며 재능 있는 노동력이 있음에도 우리나라에는 안정적인 일자리가 부족합니다. 시장이 스스로 바로잡기를 기다리면 수 세기가 걸릴 수 있으므로 경제의 전략 부문에 자금을 투입하여 고용을 늘릴 수도 있고, 아니면 소화할 자원이 없을 만큼 주문이 쇄도하는 최첨단 방위 산업에 자금을 지원하고 민간 부문은 스스로 알아서 하도록 내버려 둘 수도 있습니다."
 france_md.525.a: "우리 시민들에게는 이 일자리가 필요하다"
 france_md.525.b: "우리 방위 산업이 이 자금을 더 잘 활용할 것이다"
 france_md.526.t: "경제 활동의 부흥"
 france_md.526.d: "수년간의 극단적 자유주의는 우리 경제를 약화시켰지만, 유럽 연합 탈퇴 이후 살아남으려면 튼튼하고 EU 제재에서 자유로운 경제가 필요합니다. 프랑스 민간 기업의 자본에 투자하여 이들이 프랑스에 자리 잡도록 장려함으로써 회복에 대한 국가의 개입을 줄일 수 있지만, 인건비가 더 저렴한 다른 곳에 투자하지 않으리라는 보장은 없습니다. 아니면 신규 기업의 설립과 성장에 직접 보조금을 지급할 수도 있는데, 금융 부문은 이를 싫어하겠지만 효과는 확실합니다."
 france_md.526.a: "시장에 투자하여 그들이 프랑스에 투자하게 할 것이다."
 france_md.526.b: "인간적인 관점에서 자본주의는 만족스러운 해법을 제시하지 못한다 (샤를 드골)"
 france_md.527.t: "농촌 지원의 확대"
 france_md.527.d: "농촌 및 도시 근교 지역에 경제적 활력을 불어넣으려는 우리의 프로젝트는 이미 순조롭게 진행되고 있으며, 이제 다음 단계를 결정해야 합니다. 인구가 적은 지역의 교통망과 일자리를 계속 확대할지, 아니면 주요 의사결정 중심지에서 고립되어 같은 특권을 누리지 못하는 농업과 그에 의존하는 부문으로 눈을 돌릴지입니다. 이들에게 보조금을 지급하면 생산과 소비의 중심지에 대한 접근성이 개선되고 그들의 호의도 얻을 수 있을 것입니다."
 france_md.527.a: "교외 지역에 연결성과 일자리를 계속 제공할 것이다"
 france_md.527.b: "그 돈을 대신 농식품 부문에 주자. 그들이 더 잘 쓸 것이다."
 france_md.528.t: "새로운 경제"
 france_md.528.d: "비용이 많이 들고 비생산적이어서 이전되고 있는 산업을 정리한 지금, 우리는 점점 더 학력이 높아지지만 여전히 불완전 고용 상태인 인구에게 새로운 일자리를 찾아 주어야 합니다. 서비스 부문은 우리 같은 선진국에 가장 안전한 선택입니다. 수익이 크고 직접적인 오염이 적으며 민간 부문과 소비자 사이의 간극을 메워 주기 때문입니다. 그러나 프랑스는 국방에서 의학, 화학에 이르는 연구로도 명성이 높으며, 거듭된 위기로 과학 예산이 대폭 삭감되었습니다. 연구 프로그램에 보조금을 지급하여 이에 더 많은 투자를 해야 할지도 모릅니다."
 france_md.528.a: "서비스 부문이 더 수익성이 높으며 실업을 줄이는 데 도움이 될 것이다"
 france_md.528.b: "우리는 이 지식 사회의 일원이 되어야 한다"
 france_md.529.t: "더 많은 일자리인가, 더 많은 서비스인가?"
 france_md.529.d: "생산 부문에 대한 최근의 투자가 결실을 맺고 있습니다. 우리는 빈곤화의 악순환을 멈추고 안정적인 노동 시장을 재건하기 시작했습니다. 우리는 미래 세대에게 이익이 될 일자리를 계속 창출할 수도 있고, 아니면 선임자들이 그 일자리와 함께 해체한 공공 서비스를 재건하는 쪽으로 돌아설 수도 있습니다. 후자의 경우 시민들은 계속 줄어드는 서비스에 무거운 세금을 내고 있습니다. 더 나은 교육은 노동자를 더 효율적으로 만들고, 더 나은 의료는 그들이 더 오래 살게 해 줄 것입니다. 공공 서비스에 다시 집중해야 합니까, 아니면 여전히 노동 시장이 우리의 우선순위입니까?"
 france_md.529.a: "우리의 우선순위는 더 많은 일자리를 창출하는 것이다"
 france_md.529.b: "노동 분야에서는 충분히 했다. 공공 서비스를 재건해야 한다"
 france_md.530.t: "식량 공급의 국내 회귀"
 france_md.530.d: "식량 공급을 국내로 되돌릴 준비를 하면서 한 가지 의문이 생깁니다. 어떻게 할 것인가입니다. 우리 농식품 부문만으로도 우리를 먹여 살릴 수 있지만, 불공정한 경쟁 때문에 우리가 필요로 하지 않는 물품을 수입해야 하고, 이는 운송과 해외의 무책임한 생산을 통해 지구를 훼손합니다. 우리가 필요로 하지 않거나 우리 기준에 미달하는 식품에 관세 장벽을 부과할 수도 있지만, 유럽 파트너들과 WTO의 분노를 살 위험이 있습니다. 아니면 시장 규칙을 지키면서 농식품 부문이 경쟁하고 수입 의존도를 줄일 수 있도록 보조금을 지급할 수도 있습니다. 무엇을 결정하든 우리에게는 수단이 있습니다. 문제는 의지입니다."
 france_md.530.a: "시장과 자유 경쟁은 우리 주민과 지구에 해롭다"
 france_md.530.b: "우리는 규칙을 지켜야 한다"
 france_md.531.t: "자유 무역법을 위반하는 프랑스"
 france_md.531.d: "프랑스 정부의 보도자료를 통해 방금 정부가 식품 수입에 대한 관세 장벽을 재도입하기로 결정했다는 사실을 알게 되었습니다. 이 조치는 그들이 식량 공급의 현지화 계획이라고 부르는 것의 시작을 알립니다. 이를 옹호하는 논거가 많음에도 이 계획은 세계 무역 기구와 유럽 연합의 여러 법을 위반합니다. 프랑스는 자유 무역 협정에 서명했으므로 이를 준수할 의무가 있습니다. 그들이 제재를 받을지는 확실하지 않지만, 이 조치는 유럽 통합에 해롭습니다. 그럼에도 우리 국민은 우리가 이 문제에 어떻게 대응할지 기다리고 있습니다. 그들은 옳은 일을 했습니까, 그른 일을 했습니까?"
 france_md.531.a: "용납할 수 없는 일이다"
 france_md.531.b: "우리도 똑같이 해야 한다"
 france_md.532.t: "우리의 경제적 주권"
 france_md.532.d: "오랫동안 우리를 지배해 온 세력에서 벗어나는 데는 대가가 따릅니다. 수십 년의 자본주의 통치가 우리 산업의 상당 부분을 외국 자본에 팔아넘겼고, 이 자본이 이제 빠져나갈 수 있어 민간 부문이 붕괴하기 전에 이를 되찾아야 합니다. 우리는 대규모 일자리 계획을 시작할 수 있는데, 이는 빠르지만 새로운 거점이 건설되는 동안 유지하는 데 비용이 많이 듭니다. 또는 기존 부문 안에서 일자리를 창출할 수 있는데, 추가 노동력을 흡수할 수만 있다면 비용이 더 저렴하고 지속 가능합니다."
 france_md.532.a: "우리는 1년 안에 이러한 새 일터를 만들 수 있다"
 france_md.532.b: "더 짓지 않고도 기존 시설에서 더 많은 사람을 고용할 수 있다"
 france_md.533.t: "좌파 연립을 향하여"
 france_md.533.d: "오랜 협상 끝에 우리는 다양한 좌파 정당들과 공통점을 찾았으며, 이들은 우리 정부에 반대하지 않고 더 공정한 프랑스를 위한 공동 강령 아래 우리 연립에 참여하기로 동의했습니다. 이는 신의 한 수입니다. 우리 정부는 정통성을 인정하지 않으려는 정당들에게 도전받고 있었는데, 우리는 원칙을 타협하지 않고도 더 견고한 과반수를 구축했습니다. 이 합의는 사회 복지 혜택의 소폭 인상을 의미하지만, 우리는 어차피 이 인상을 계획하고 있었습니다."
 france_md.533.a: "불신임안의 위협이 사라지고 있다"
 france_md.534.t: "우리의 연립을 거부한 다른 좌파 정당들"
 france_md.534.d: "다른 좌파 단체 소속 의원들은 오늘 아침, 우리의 강령과 우선순위 사이에 차이가 너무 많다는 이유로 우리가 제안한 연립을 지지하지 않겠다고 발표했습니다. 이는 분열된 국민의회에서 이미 입지를 지키느라 애쓰는 정부에 나쁜 소식입니다. 법안마다 협상할 수는 있겠지만, 그때마다 사방에서 압박을 받을 것입니다. 이 정당들은 무책임하게 행동했으며, 여론의 일부가 우리의 통합 접근을 지지하긴 해도 정부의 존속을 보장하기에는 충분하지 않을 수 있습니다."
 france_md.534.a: "용감한 시도였다"
 france_md.535.t: "정부에 합류한 사회당"
 france_md.535.d: "오랜 협상 끝에 우리는 사회당과 공통점을 찾았으며, 사회당은 우리에 대한 반대를 멈추고 정부에 합류하기로 동의했습니다. 그들은 자신들의 강령을 강요할 입장이 아니었으므로 공동 강령은 대체로 우리의 강령을 본떴습니다. 이는 신의 한 수입니다. 우리 정부는 정통성을 인정하지 않으려는 정당들에게 도전받고 있었는데, 우리는 최소한의 비용으로 더 안정적인 과반수를 구축했습니다. 이 합의에는 민간 부문에 대한 투자가 필요한데, 유권자들이 기대한 바와는 다르지만 입법을 통과시킬 수 있다면 그만한 가치가 있습니다."
 france_md.535.a: "레옹 블룸이 자랑스러워했을 것이다"
 france_md.536.t: "정부 합류를 거부한 사회당"
 france_md.536.d: "사회당 의원들은 오늘 아침, 우리의 강령 사이에 차이가 너무 많다는 이유로 우리의 연립 제안을 지지하지 않겠다고 발표했으며, 선거 운동 기간 중 우리가 가한 공격에 여전히 분개하고 있음이 분명합니다. 이는 분열된 국민의회에서 이미 입지를 지키느라 애쓰는 정부에 나쁜 소식입니다. 법안마다 협상할 수는 있겠지만, 그때마다 사방에서 압박을 받을 것입니다. 이 정당들은 무책임하게 행동했으며, 여론의 일부가 우리의 통합 접근을 지지하긴 해도 정부의 존속을 보장하기에는 충분하지 않을 수 있습니다."
 france_md.536.a: "레옹 블룸이 무덤에서 돌아눕고 있다"
 france_md.537.t: "마무리해야 할 임기"
 france_md.537.d: "대통령의 임기는 아직 2년이 남았으며, 당 기구는 그 기간을 어떻게 할지를 두고 벌써 논쟁하고 있습니다. 우리는 현직 대통령의 깃발 아래 지금 통치하며 그의 강령을 우리의 것으로 삼을 수도 있고, 한 쪽에 헌신하기 전에 물러서서 2002년 선거가 어느 정당이 프랑스를 이끌지 결정하도록 놔둘 수도 있습니다."
 france_md.537.a: "현직 대통령 아래에서 지금 통치한다"
 france_md.537.b: "2002년 선거를 기다린다"
 france_md.538.t: "정계에서 물러나는 자크 시라크"
 france_md.538.d: "대통령 선거에서 소속 정당이 패배한 뒤, 시라크 전 대통령은 정치 경력에 종지부를 찍기로 결정했습니다. 장관에서 대통령까지 그는 먼 길을 걸어왔으며 제4공화국과 제5공화국에 걸쳐 프랑스가 변하는 것을 지켜보았습니다. 그러나 선거 운동 중 그의 정당이 겪은 어려움은 모든 이의 마음에 들지는 않았던 그의 정책과도 관련되어 있었습니다. 그럼에도 그의 실패에서 얻을 교훈이 하나 있다면, 상황이 변했다는 것입니다. 세계는 더 이상 예전과 같지 않으며, 위험을 감수하지 않고서는 예전처럼 생각할 수 없습니다. 이제 우리가 할 수 있는 일은 그보다 더 잘하기를 바라는 것뿐입니다."
 france_md.538.a: "사과를 먹을 시간이 생기겠군"
 france_md.539.t: "멘히르의 몰락"
 france_md.539.d: "우리 당의 창립자이자 전 대표인 장마리 르펜이 좋지 않은 이유로 다시 뉴스에 오르고 있습니다. 수년간의 홀로코스트 부정 및 반유대주의 발언 끝에, 그는 이제 페탱 원수를 반역자라고 부르기를 거부하고 있습니다. 대표직에서 물러난 이후 그는 연금에서 지난 세기의 분쟁에 이르기까지 여러 문제에서 당의 새로운 노선과 충돌해 왔으며, 그의 발언은 우리가 마침내 공화주의 주류 안에서 자리를 잡는 것을 가로막고 있습니다. 그를 제명할 수도 있지만, 이는 그와 견해를 공유하는 원로 세력을 멀어지게 할 위험이 있습니다. 우리는 정말로 당을 공화주의 기준에 맞게 변모시키기를 원합니까, 아니면 정체성을 잃을 위험을 감수해야 합니까?"
 france_md.539.a: "골칫거리가 되었다. 당에서 제명해야 한다"
 france_md.539.b: "그냥 처신을 조심하라고 상기시키기만 하라"
 france_md.540.t: "국민전선에서 국민연합으로"
 france_md.540.d: "당내 수많은 토론과 회의를 거쳐 국민전선의 고위 인사들은 당의 정책과 지위에 중대한 변화를 발표했습니다. 이 당은 이제 국민연합으로 불릴 것이며, 극우 정당이라는 꼬리표를 떨쳐내려는 결의가 분명합니다. 이를 위해 그들은 지나치게 극단적이라고 판단된 수많은 활동가의 제명을 발표했고 유럽 연합에 남겠다는 약속을 재확인했습니다. 이 사태는 더 받아들일 만한 모습으로 개편되는 낡은 국민전선의 쇠퇴의 마지막 단계를 알립니다. 이러한 변화는 사소하지만, 대중이 이것이 무언가를 바꾼다고 믿지 않도록 최선을 다해야 합니다."
 france_md.540.a: "그럼에도 그들은 위험하다"
 france_md.541.t: "성좌의 몰락"
 france_md.541.d: "외세가 현재 바티칸을 점령하고 있습니다. 따라서 바티칸이 우리 적들의 통제 아래 있는 동안은 교황청의 안전을 보장할 수 없습니다. 그러나 우리나라는 이미 아비뇽의 교황청 궁전에 교황청의 안식처를 제공한 바 있습니다. 따라서 추기경단과 현 교황을 아비뇽으로 모셔 오는 것을 막을 것은 아무것도 없습니다. 이는 전 세계 기독교계에 중대한 변화가 될 것이지만, 바티칸이 점령된 상황에서 우리 왕국이 언제나 그래 왔듯 교회의 보호를 보장할 만큼 강한 것은 우리뿐입니다."
 france_md.541.a: "교황청은 이곳 우리와 함께라면 안전할 것이다."
 france_md.550.t: "대통령직에 오른 니콜라 사르코지"
 france_md.550.d: "결선 투표는 여론 조사가 시사한 바를 확인해 주었습니다. 도시 소요에 대한 강경 노선으로 명성을 쌓은 내무부 장관 니콜라 사르코지가 대중운동연합을 이끌고 세골렌 루아얄을 뚜렷한 격차로 제치며 엘리제궁에 입성했습니다. 이번 선거 운동은 노동, 권위, 국가 정체성을 두고 치러졌으며 투표율은 한 세대 만에 가장 높았습니다. 신임 대통령은 시라크 시대와의 단절을 약속합니다. 연금 개혁, 더 엄격한 노동 시장, 그리고 대서양 동맹의 통합 지휘 체계로의 프랑스 복귀입니다. 그의 반대자들은 이 단절이 가장 감당하기 어려운 이들에게 가장 크게 느껴질 것이라고 경고합니다."
 france_md.550.a: "더 일해서 더 벌자."
 france_md.551.t: "대통령직에 오른 프랑수아 올랑드"
 france_md.551.d: "사르코지 대통령 5년 후, 사회당이 권력에 복귀했습니다. 오랫동안 정치가라기보다 당 관리자로 폄하되어 온 프랑수아 올랑드는 재정 정의, 재협상된 유럽 예산 조약, 아프가니스탄 철수를 내세운 공약으로 결선 투표에서 승리했습니다. 금융 위기와 유로존 비상사태가 모든 토론을 지배했고, 퇴임하는 대통령은 자신의 실적에서 벗어날 수 없었습니다. 신정부는 침체된 경제, 압박받는 재정 적자, 그리고 프랑스가 반대하기보다 주도하기를 기대하는 유럽 파트너십을 물려받습니다."
 france_md.551.a: "변화는 지금이다."
 france_md.552.t: "대통령직에 오른 에마뉘엘 마크롱"
 france_md.552.d: "낡은 정당 체제가 무너졌습니다. 사회당도 공화당도 결선에 오르지 못했고, 결선 투표는 창설된 지 겨우 1년 된 운동과 국민전선 사이에서 치러졌습니다. 전직 투자은행가이자 경제부 장관인 에마뉘엘 마크롱은 노동 시장 자유화, 유럽 통합, 그리고 우파도 좌파도 아니라고 주장하는 정치를 내세운 공약으로 여유롭게 승리했습니다. 그의 운동은 이제 의회 기반도 지역 조직도 없이 총선을 맞이하게 되었고, 양 극단의 반대자들은 이미 거리에서 조직을 갖추고 있습니다."
 france_md.552.a: "우파도 좌파도 아니다."
 france_md.553.t: "재선된 에마뉘엘 마크롱"
 france_md.553.d: "결선 투표는 두 번째로 대통령과 국민연합의 대결로 치러졌고, 두 번째로 공화주의 전선이 버텼지만 5년 전보다는 더 좁은 격차였습니다. 선거 운동은 유럽의 전쟁, 에너지 가격, 그리고 대통령이 무슨 일이 있어도 추진하겠다고 약속한 연금 개혁에 가려졌습니다. 그는 20년 만에 재선에 성공한 첫 프랑스 대통령이 되었으며, 극우가 권력에 이토록 가까이 다가선 적이 없던 상황에서 재선에 성공한 첫 대통령이기도 합니다."
 france_md.553.a: "두 번째 임기, 그리고 더 좁은 격차."
 france_md.503.t: "[FRA.GetLeader]에 대한 반대 세력: 추세는 어떠한가?"
 france_md.503.d: "[FRA.GetLeader] 대통령의 임기가 끝나 감에 따라 대통령 선거 운동은 마지막 국면에 접어들고 있으며 선거 세력 균형이 분명해지고 있습니다. 가장 유력한 후보인 리오넬 조스팽은 시라크 치하에서 총리를 지내며 사회주의 전통과는 거리를 두고 유럽 기준에 부합하는 사회민주주의 정책을 추진했습니다. 현대적이지만 사회주의는 아닙니다. 녹색당과 프랑스 공산당 등의 여러 좌파 후보는 단독으로 승리할 자원이 부족하지만 여전히 기세를 얻을 수 있습니다. 좌파 전체가 명백한 유력 세력입니까, 아니면 그 분열이 다른 후보를 결선으로 밀어 올릴 수도 있습니까?"
 france_md.503.a: "좌파가 유권자를 사로잡는 데 성공하고 있다"
 france_md.503.b: "좌파 후보 누구도 기대했던 만큼의 지지를 확보하지 못했다"
 france_md.986.t: "비판에 직면한 리오넬 조스팽"
 france_md.986.d: "리오넬 조스팽은 다가오는 선거에서 좌파가 가장 선호하는 후보이지만, 일부에서는 지나치게 자유주의적이고 시라크의 공약과 너무 비슷하다고 보는 그의 공약에 대해 좌파 내에서 만장일치의 지지를 받지는 못하고 있습니다. 그에 맞서는 것은 프랑스 공산당입니다. 냉전 종식 이후 과거의 그림자에 불과해졌지만, 여전히 급진 좌파 내에 동맹이 있으며 미테랑 전 대통령의 두 번째 임기에 환멸을 느낀 이들에게 호소할 수 있습니다. 공산당은 조스팽의 자유주의로의 전환을 공격할 수 있지만, 과연 그렇게 할까요?"
 france_md.986.a: "프랑스 공산당은 리오넬 조스팽을 공격하지 않기로 했다"
 france_md.986.b: "프랑스 공산당이 좌파 유권자들을 사로잡는 데 성공했다"
 france_md.986.c: "프랑스 공산당의 결정타가 되지 못한 공격"
 france_md.987.t: "크게 앞설 것으로 점쳐진 리오넬 조스팽"
 france_md.987.d: "리오넬 조스팽과 사회당의 승리는 좌파 내에서 논란의 여지가 없습니다. 그는 이전에 비판을 받았지만, 그의 반대자들은 그에게 도전하거나 결선에 오를 처지가 아닙니다. 우리가 그의 공약에 동의하든 말든, 대통령 선거 결선 투표는 그와 [FRA.GetLeader]의 대결이 될 것입니다."
 france_md.987.a: "다른 결과는 있을 수 없었다"
 france_md.988.t: "공산주의의 재부상"
 france_md.988.d: "조스팽의 자유주의적 노선 전환을 공격한 것은 옳은 판단이었습니다. 사회당 표는 좌파와 중도로 갈라졌고, 이로써 공산당은 너무 오래 지배해 온 자유주의 및 보수 정책에 대한 반대 세력을 이끌 신뢰를 얻게 되었습니다. 공산당은 혁명적 공산주의자 동맹과 노동자 투쟁 같은 다른 좌파 파트너들과 동맹을 확보했습니다. 그러나 [FRA.GetLeader]에 불만을 가진 중도파는 급진 동맹보다 조스팽을 선호했을 것이며, 결선에서 우리에게 반대표를 던질 가능성이 높습니다. 어쩌면 그들의 침묵을 대가로 그들 도시에 대한 지역 투자를 마련할 수 있을지도 모릅니다."
 france_md.988.a: "중도파는 기권할 것이다"
 france_md.988.b: "중도파는 극좌에 맞선 통합 전선을 촉구할 것이다"
 france_md.989.t: "뜻밖의 유력 후보"
 france_md.989.d: "이번 대통령 선거 운동의 막바지는 많은 정당에게 격동의 시기였습니다. 공산당이 리오넬 조스팽을 공격한 이후 공산당과 사회당은 끝없는 언론 공방을 벌이기 시작했고, 어느 쪽도 자신의 주장을 관철하지 못하자 좌파 유권자들은 논란이 덜하고 더 절제된 후보에게 눈을 돌렸습니다. 녹색당은 폭풍 속에서 평온과 이성의 목소리로 자신을 내세울 기회를 붙잡았습니다. 따라서 녹색당이 결선에 오를 가능성이 매우 높으며, 그곳에서 임기 말에 약해진 퇴임 대통령과 맞붙게 될 것입니다."
 france_md.989.a: "누가 이럴 줄 알았겠는가?"
 france_md.990.t: "좌파도 우파도 아닌"
 france_md.990.d: "보수파가 이미 결선에 올라 있고 좌파가 혼란에 빠진 가운데, 퇴임 대통령은 불확실성이 남아 있기는 하나 승리가 확실해 보입니다. 일부 프랑스인들은 수십 년간 정치를 규정해 온 좌우 분열에 지쳤으며, 이는 안정과 유럽 통합에 초점을 맞춘 시대에는 더 이상 맞지 않습니다. 따라서 자유주의 정당인 프랑스 민주연합에도 내세울 주장이 있습니다. 새로운 강국과 블록이 부상하는 세계에서 시라크의 독립 지향 정책은 더 이상 큰 비중을 차지하지 못한다는 것입니다. 자유주의 중도에게는 할 역할이 있지만, 유권자들에게 이 새로운 현실을 납득시킬 수 있을까요?"
 france_md.990.a: "자유주의자들이 사람들의 관심을 사로잡는 데 성공할 것이다"
 france_md.990.b: "프랑스인들은 여전히 자국의 주권을 고수한다"
 france_md.991.t: "분열된 주권주의 진영"
 france_md.991.d: "자유주의 중도가 자신의 주장을 펼치지 못하자, 좌우 분열에 지친 유권자들은 주권주의자들에게 눈을 돌렸습니다. 그러나 그 진영은 두 가지 목소리를 냅니다. 공화국연합은 국가 독립이라는 드골주의 전통을 존중받을 만하고 통치에 적합한 주류로 이끌고 있으며, 국민전선은 기성 정당들이 20년 동안 봉쇄해 온 더 강경한 노선을 제시합니다. 둘 다 같은 환멸을 느낀 유권자층에 대한 권리를 주장합니다. 이들 중 누가 결선에 오르느냐가 프랑스의 유럽 회의주의가 집권 우파의 일로 남을지, 아니면 방역선을 완전히 벗어날지를 결정할 것입니다."
 france_md.991.a: "드골주의 전통이 여전히 주권주의 표를 지배한다"
 france_md.991.b: "국민전선이 불만을 이용할 것이다"
 france_md.510.t: "아무도 예상하지 못했던 일"
 france_md.510.d: "정당들이 유권자의 관심을 사로잡지 못한 탓에, 어느 쪽도 [FRA.GetLeader]을(를) 상대로 결선에 오를 힘이 없습니다. 경쟁자들이 주목에서 사라진 덕을 본 국민전선은 그들의 논란에서 벗어났고, 대표인 장마리 르펜에도 불구하고 진출할 가능성이 충분합니다. 그럴 가능성은 여전히 낮습니다. 리오넬 조스팽이 여전히 유력 후보이며, 그는 분명 [FRA.GetLeader]에게 패할 것입니다. 하지만 국민전선이 결선에 오른다면 다른 정당들은 어떻게 반응할까요?"
 france_md.510.a: "정당들은 극단주의의 부상을 우려하지 않을 것이다"
 france_md.510.b: "모든 정당이 유권자들에게 국민전선에 반대표를 던지도록 촉구할 것이다"
 france_md.511.t: "선거일"
 france_md.511.d: "격동의 반전이 가득한 수개월의 선거 운동 끝에, 마침내 프랑스인들이 투표할 때가 왔습니다. 이것은 프랑스 대중으로부터 가장 많은 지지를 얻은 두 후보로 후보를 좁히기 위한 첫 번째 라운드일 뿐입니다. 어느 후보도 과반수를 확보하지 못하면 둘 사이를 가리기 위해 결선 투표가 치러집니다."
 france_md.511.a: "투표하러 가자!"
 france_md.512.t: "대통령 선거에서 승리할 것으로 예측되는 국민전선"
 france_md.512.d: "모든 예측이 조스팽과 [FRA.GetLeader]의 양자 대결을 가리켰음에도, 모두의 예상을 뒤엎고 국민전선이 1차 투표에서 승자로 떠올랐습니다. 다른 후보들이 유권자를 사로잡지 못한 탓에 국민전선은 결선에 진출했으며, [FRA.GetLeader]에게는 상황이 암울해 보입니다. 다른 정당들은 유권자들에게 그를 지지하라고 촉구하지 않았고, 그의 정책은 일부에게는 지나치게 논쟁적이었습니다. 유권자의 일부가 극우 후보에 맞서 결집할 것으로 예상되지만, 반체제 선택으로 자신을 내세우는 르펜을 꺾는 것은 결코 보장되어 있지 않습니다."
 france_md.512.a: "방금 무슨 일이 일어난 것인가?"
 france_md.513.t: "결선에 오른 국민전선"
 france_md.513.d: "모든 예측이 조스팽과 [FRA.GetLeader]의 양자 대결을 가리켰음에도, 모두의 예상을 뒤엎고 국민전선이 1차 투표에서 승자로 떠올랐습니다. 다른 후보들이 유권자를 사로잡지 못한 탓에 국민전선은 결선에 진출했습니다. 다행히 [FRA.GetLeader]이(가) 승리할 것으로 보입니다. 극우 정당의 결선 진출에 충격을 받은 정당들과 시민 사회가 르펜에 맞선 대규모 투표를 촉구했습니다. 퇴임하는 대통령을 지지하는 대규모 시위가 전국에서 열렸습니다. 이는 역사적인 사건입니다. 이것이 유일한 사건이기를 바랍니다."
 france_md.513.a: "대체 어떻게 이런 상황에 이르게 되었는가?"
 france_md.514.t: "대통령 선거 승자로 선언된 프랑스 공산당"
 france_md.514.d: "모두의 예상을 뒤엎고 프랑스 공산당이 1차 투표에서 승자로 떠올랐습니다. 불과 몇 달 전만 해도 냉전 종식 이후 최저점에서 헤매던 정당입니다. 조스팽 후보의 약점과 급진 좌파의 동맹 덕분에 공산당은 좌파를 결집하고 결선에서 뚜렷한 우위를 확보할 수 있었으며, 사회당과 중도파는 공산당이 EU를 떠나지 않는 한 반대하지 않기로 동의했습니다. 공산당 대표는 중도파를 멀리하지 않기 위해 자유주의 질서에 대한 반대와 개혁주의 사이에서 균형을 맞추었습니다. 공산당의 승리는 의심의 여지가 없지만, 연합을 유지할 수 있을까요?"
 france_md.514.a: "마침내 더 나은 날이 왔다"
 france_md.515.t: "결선에 오른 프랑스 공산당"
 france_md.515.d: "모두의 예상을 뒤엎고 프랑스 공산당이 1차 투표에서 승자로 떠올랐습니다. 불과 몇 달 전만 해도 냉전 종식 이후 최저점에서 헤매던 정당입니다. 조스팽 후보의 약점과 급진 좌파의 동맹 덕분에 공산당은 결선 진출권을 확보할 수 있었습니다. 그러나 승리는 완전하지 않습니다. 중도파는 급진 좌파의 승리가 유럽 통합과 시장에 나쁜 징조라고 보고 [FRA.GetLeader]에게 투표할 것이라고 발표했습니다. 결선 투표는 아직 치러지지 않았지만, [FRA.GetLeader]이(가) 다시 한번 승리할 가능성이 높습니다."
 france_md.515.a: "아슬아슬했다"
 france_md.516.t: "결선에 오른 프랑스 국민연합"
 france_md.516.d: "모두의 예상을 뒤엎고 퇴임하는 대통령이 결선 진출 전에 탈락했으며, 자신의 정당 때문에 무너졌습니다. 드골주의자 샤를 파스쿠아가 우파에서 충분한 보수파와 주권주의자를 끌어와 [FRA.GetLeader]의 선거 운동을 교란하는 데 성공했습니다. 그러나 결선에 오른 것은 프랑스 국민연합만이 아닙니다. 그곳에서 국민연합은 좌파 내부의 분열에도 불구하고 결선에 오른 사회당 후보 리오넬 조스팽과 맞붙게 됩니다. 이 대결은 치열할 것입니다. 단순히 사회주의 대 보수주의의 대결이 아니기 때문입니다. 다음 주 프랑스 국민은 유럽을 더 원하는지 덜 원하는지 결정할 것입니다."
 france_md.516.a: "주권이 승리할 것이다"
 france_md.516.b: "항의 투표는 여전히 소수에 머문다"
 france_md.517.t: "결선에 오른 프랑스 민주연합"
 france_md.517.d: "친유럽 유권자들이 프랑스 민주연합 뒤에 결집한 덕분에 이 정당은 결선에 오를 수 있었습니다. 유럽 연합을 홍보한 것은 사회당만이 아니었고, 자유주의자들이 유럽 연합의 자유주의 가치에 더 가까웠습니다. 사람들은 흔히 모방보다 원본을 선호하는 경향이 있습니다. 그리하여 프랑스 민주연합은 결선에서 현직 대통령과 맞서게 되었습니다. 이는 시라크의 독립 지향 정책과 자유주의자들의 유럽 최우선 입장 간의 대결입니다. 주요 블록 자체가 이 문제를 두고 깊이 분열되어 있어 이번 선거는 접전이 될 가능성이 높습니다. 다행히 결선이 코앞이므로 오래 기다릴 필요는 없습니다."
 france_md.517.a: "낡은 보수주의자는 저지되었다"
 france_md.517.b: "프랑스 민주연합의 공약은 유권자에게 다소 지나치게 자유주의적인 것으로 드러나고 있다"
 france_md.518.t: "결선에 오른 녹색당"
 france_md.518.d: "좌파 정당들 간의 선거 운동 끝에, 녹색당은 모두의 예상을 뒤엎고 결선에 진출하는 데 성공했습니다. 이들의 사회 및 환경 강령은 진보의 최첨단에 있으며, 공산당과 사회당의 충돌 속에서도 냉정함을 유지함으로써 가장 현명하고 공정한 해법을 대표하게 되었습니다. 이들은 이제 결선에서 퇴임하는 대통령과 맞붙습니다. 대결은 치열할 가능성이 높지만, 이번에는 각 블록 내에 만장일치가 있습니다. 좌파는 진보주의에, 우파는 보수주의에 투표하며, 다음 주의 충돌은 사회 문제만큼이나 환경에 관한 것이 될 것입니다."
 france_md.518.a: "낡고 보수적인 소프트웨어로는 더 이상 우리 새 천년의 과제를 감당할 수 없다"
 france_md.518.b: "환경은 아직 충분한 우선순위를 부여받지 못하고 있다."
 france_md.519.t: "결선 진출 자격을 얻은 리오넬 조스팽"
 france_md.519.d: "모든 여론 조사가 예측한 대로 사회당 후보는 큰 어려움 없이 결선에 진출했습니다. 그의 현대적이고 친유럽적인 공약은 사회당 지지자와 중도파를 모두 사로잡아 탄탄한 지지 기반을 제공했으며, 더 급진적인 좌파 정당들은 깊이 분열되어 전 총리에게 위협이 되지 못했습니다. 그는 이번 주 다시 한번 진보주의와 보수주의의 대결로서 라이벌과 맞붙게 됩니다. 그러나 여론 조사는 박빙이며, 사회주의자 대통령을 받아들이려 하지 않는 더 우익적인 집단들로부터 공화국연합이 이익을 볼 수 있기 때문에 조스팽에게는 좌파 정당들의 지지가 필요할 수도 있습니다."
 france_md.519.a: "조스팽이 나머지 좌파를 사로잡는 데 성공한다"
 france_md.519.b: "조스팽의 공약이 지나치게 자유주의적이어서 더 왼쪽의 유권자들을 끌어들이지 못했다"
 FRA_Macron_eco: "마크롱 법"
 FRA_Macron_eco_desc: "우리는 재무부 장관 에마뉘엘 마크롱이 제시한 정책을 따르기로 했습니다. 정부 지출을 삭감하면서 투자와 고용을 간소화하는 법안입니다."
 FRA_Ferrand_eco: "페랑 법"
 FRA_Ferrand_eco_desc: "우리는 재무부 장관 올리비에 페랑이 제시한 정책을 따르기로 했습니다. 정부 지출을 삭감하면서 투자와 고용을 간소화하는 법안입니다."
 FRA_ineluctable_collapse: "붕괴하는 연립"
 FRA_ineluctable_collapse_desc: "우리 당과 연립이 무너지고 있습니다. 너무 늦기 전에 신속히 수습해야 합니다!"
 FRA_manif_pour_tous: "모두를 위한 시위"
 FRA_manif_pour_tous_desc: "매달 거리에 나온 수십만 명, 우파가 20년 동안 구축하지 못했던 보수 운동, 그리고 이제 그 운동을 거쳐 입법해야 하는 집권당."
 FRA_grand_debat: "국가 대토론"
 FRA_grand_debat_desc: "1만 개의 타운홀, 200만 건의 기여, 그리고 로터리를 텅 비울 만큼 무거운 양보 패키지. 평화는 진짜였습니다. 청구서도 그랬습니다."
 FRA_bassin_minier: "광산 지대 공약"
 FRA_bassin_minier_desc: "옛 탄전 지대와 미디 지방에서 용광로에 다시 불을 지피고 일자리를 열었습니다. 이 약속은 지켜지는 동안에만 극우를 저지합니다."
 FRA_resist_inevitable: "안정화 노력"
 FRA_resist_inevitable_desc: "쇠퇴는 되돌릴 수 없는 것이 아닙니다. 우리 투사들은 다시 집집마다 방문하고 있으며, 우리에게서 멀어지는 흐름은 둔화되었습니다."
 FRA_resist_inevitable2: "안정화 노력"
 FRA_resist_inevitable2_desc: "출혈이 멈췄습니다. 우리는 당을 안정시켰고, 유권자들이 의존하는 산업 기반으로 관심을 돌렸습니다."
 FRA_resist_inevitable3: "안정화 노력"
 FRA_resist_inevitable3_desc: "우리는 부고 기사들보다 오래 살아남았습니다. 당은 안정된 기반과 경쟁자들이 이제 답해야 할 강령을 갖추고 다시 굳건한 땅 위에 서 있습니다."
 FRA_socialism_renew: "쇄신된 사회주의"
 FRA_socialism_renew_desc: "우리는 견고한 토대 위에 당의 정통성을 재건했습니다. 미래는 우리 앞에 있습니다."
 FRA_pension_reform: "연금 개혁"
 FRA_pension_reform_desc: "우리가 직면한 예산 위기를 감안하여 시민들의 은퇴 연령을 높여야 했습니다. 그들은 이를 달가워하지 않았지만 우리는 해야만 했습니다."
 FRA_french_rearmament: "재무장 1단계"
 FRA_french_rearmament_desc: "유럽에서 다시 긴장이 고조됨에 따라 최악의 사태를 피하려면 재무장하는 것 외에는 선택의 여지가 없습니다."
 FRA_french_rearmament2: "재무장 2단계"
 FRA_french_rearmament2_desc: "더 많은 병사를 훈련하는 것만으로는 충분하지 않습니다. 무기 생산 능력을 늘려야 합니다."
 FRA_french_rearmament3: "재무장 완료"
 FRA_french_rearmament3_desc: "우리 국민과 군대는 대규모 분쟁에 맞설 준비가 되어 있습니다."
 french_nuclear_expert: "프랑스 원자력 전문가"
 french_nuclear_expert_desc: "우리는 프랑스 원자력 기술 전문가들의 지원을 받아들였습니다. 이들은 우리의 에너지 독립을 구축하도록 도울 것입니다."
 french_dissuasion: "프랑스의 핵 억지력"
 french_dissuasion_desc: "우리는 적대 세력과의 분쟁 시 프랑스와 유럽 연합의 보호를 받아들이기로 합의했습니다."
 FRA_Our_project: "프랑스를 위한 우리의 프로젝트"
 FRA_Our_project_desc: "대중의 초기 저항에도 불구하고, 그들은 우리가 하는 모든 일이 프랑스의 미래를 지키기 위한 것임을 깨닫게 되었습니다. 그 어느 때보다 우리는 경제적, 지정학적 혼란으로부터 보호받고 있습니다. 그리고 이는 앞으로도 오랫동안 그럴 것입니다."
 FRA_french_independant1: "우리만의 길"
 FRA_french_independant1_desc: "프랑스는 어느 블록의 뒤에도 줄을 서지 않을 것입니다. 거리를 두는 것은 주인을 고르기를 거부하는 모든 다른 국가들의 귀를 얻게 해 줍니다."
 FRA_french_independant2: "어느 수도에도 응하지 않는다"
 FRA_french_independant2_desc: "우리의 비동맹 거부는 확고한 정책으로 굳어졌습니다. 워싱턴도 모스크바도 이제 우리의 표를 기대하지 않으며, 비동맹 세계는 우리를 자기 식구로 대합니다."
 FRA_french_independant3: "무장한 독립"
 FRA_french_independant3_desc: "독립은 더 이상 외교적 자세가 아니라 방어 교리입니다. 누구에게도 종속되지 않는 나라는 도움 없이 자국 영토를 지킬 수 있어야 하며, 이제 우리는 그럴 수 있습니다."
 FRA_NATO_support: "나토 지원"
 FRA_NATO_support_desc: "동맹에 대한 지지를 재확인함으로써 우리는 다른 회원국들과 파트너십을 구축했습니다."
 FRA_entente_china: "중국과의 협상"
 FRA_entente_china_desc: "우리는 양국 간 무역을 촉진하기 위해 중국과 협정을 체결했습니다."
 FRA_regulation: "시장 규제"
 FRA_regulation_desc: "시장과 그 활동을 규제하기로 합의함으로써 우리는 미래의 위기를 피할 수 있습니다."
 FRA_eternal_fra: "영원한 프랑스"
 FRA_eternal_fra_desc: "우리는 프로그램의 끝에 다가가고 있으며, 프랑스가 돌아왔고 국제 무대에서 결코 사라지지 않을 것임을 세계에 보여 주었다고 확신합니다."
 FRA_europhile_anger_idea: "친유럽 시위"
 FRA_europhile_anger_idea_desc: "우리 국민 중 일부는 유럽 연합을 떠나는 것을 꺼리고 있습니다. 이는 한동안만 지속되겠지만, 프랑스 국민이 이것이 유일한 전진의 길임을 이해하도록 해야 합니다."
 FRA_EU_Retaliate: "회복 중인 경제"
 FRA_EU_Retaliate_desc: "유럽 연합 탈퇴는 우리를 어려운 경제적 위치에 놓았지만, 우리는 어떤 대가를 치르더라도 반등할 것입니다."
 FRA_EU_Retaliate2: "초기 회복"
 FRA_EU_Retaliate2_desc: "우리의 노력이 결실을 맺기 시작하고 있습니다. 경제가 회복되고 있으며, 이번에는 우리에게 압력을 가하거나 우리 돈으로 원하는 일을 하는 것을 막을 이가 아무도 없습니다."
 FRA_russian_cooperation1: "러시아와의 협력"
 FRA_russian_cooperation1_desc: "러시아 정부는 자국의 산업 전문 지식을 우리와 공유하기로 합의했습니다. 이 협력이 계속되기를 바랍니다."
 FRA_russian_cooperation2: "러시아와의 동반자 관계"
 FRA_russian_cooperation2_desc: "러시아 정부는 자국의 산업 및 군사 전문 지식을 우리와 공유하기로 합의했습니다. 이 협력이 계속되기를 바랍니다."
 FRA_a_certain_idea: "프랑스에 대한 어떤 관념"
 FRA_a_certain_idea_desc: "우리는 여정의 끝에 도달했습니다. 유럽을 위해 프랑스가 소외되는 것을 막아 냈습니다. 프랑스의 독립은 확고합니다. 우리의 스승 샤를 드골도 우리를 자랑스러워할 것입니다."
 FRA_blocade: "교란된 무역 흐름"
 FRA_blocade_desc: "우리는 프랑스의 협박에 굴복하기를 거부했고, 그들은 유럽 연합의 나머지 지역에서 오는 물자가 우리에게 도달하지 못하도록 할 수 있는 모든 일을 하고 있습니다."
 FRA_shocking: "실망한 국민"
 FRA_shocking_desc: "우리 국민은 제6공화국 계획에 매우 열광했지만, 결국 우리는 헌법을 그대로 유지하기로 결정했습니다. 그들은 이를 달가워하지 않았습니다."
 FRA_draft6threp: "정치적 불안정"
 FRA_draft6threp_desc: "우리 공화국 헌법의 근본적 변화를 바라는 우리의 열망은 국민 사이에 큰 열의를 불러일으켰습니다. 이는 국민에게 새로운 지평을 엽니다. 그러나 이는 또한 우리에게 늘 유리하지만은 않을 새로운 정치 운동이 등장할 길도 열어 줍니다."
 FRA_fail6threp: "개혁의 실패"
 FRA_fail6threp_desc: "우리는 국민을 제5공화국에서 해방시키는 데 실패했습니다. 합의에 이르기 어려운 현실 앞에서 국민은 결국 희망을 잃었습니다. 어쩌면 법을 바꾸는 데는 성공할지 모르지만, 국민의 입장에서는 그들이 바라던 변화를 가져다주지 못한 것입니다."
 FRA_ecological_transition: "생태 전환 보장"
 FRA_ecological_transition_desc: "다음 세대의 미래를 보장하기 위해 우리는 환경을 보호해야 합니다. 이를 위해 우리는 소비하고 생산하는 방식을 바꾸어야 합니다."
 FRA_insoumission: "불복종"
 FRA_insoumission_desc: "우리는 당선의 근거가 된 강령을 성공적으로 수행했습니다. 우리는 프랑스를 그 어느 때보다 사회적이고 환경을 의식하며 인본주의적인 나라로 만들었습니다. 하지만 아직 이루어야 할 일이 많으며, 우리는 그 도전에 맞설 것입니다. 우리는 더 잘해야 합니다."
 FRA_eu_social_climate: "사회 및 환경 개혁"
 FRA_eu_social_climate_desc: "우리는 불복종하는 프랑스가 보인 모범을 따르기로 합의했습니다. 우리 국민은 그들의 모범에서 영감을 받았습니다. 이는 재정에 부담을 주고 있지만 장기적인 투자로 볼 수 있습니다."
 FRA_research_boost: "연구 투자"
 FRA_research_boost_desc: "우리는 미래 세대가 현대의 도전에 더욱 잘 대처할 수 있도록 연구와 교육에 막대한 투자를 했습니다. 이는 장기적으로 결실을 맺을 것입니다."
 FRA_refit_network: "교통망 개선"
 FRA_refit_network_desc: "물자와 승객의 수송을 최적화하려면 먼저 교통망을 현대화해야 합니다. 이를 위해 필요한 자원을 확보해 두었습니다."
 FRA_eden_garden: "우리의 에덴 동산"
 FRA_eden_garden_desc: "기후 변화의 참화로부터 우리나라와 세계를 지키기 위해 최선을 다함으로써, 우리는 우리 천년의 도전에 맞설 수 있는 사회의 토대를 놓았습니다. 기후 변화에 대처하려면 더 많은 노력이 필요하겠지만, 우리는 이 운동을 이끌기 위해 최선을 다했습니다."
 FRA_eu_green_reform: "환경 개혁"
 FRA_eu_green_reform_desc: "우리는 녹색 전환에 투자함으로써 프랑스 녹색당의 모범을 따르기로 했습니다. 이는 우리나라의 성장을 둔화시키겠지만, 미래 세대를 위한 투자입니다."
 FRA_EU_transit: "생태 전환 지원 기금"
 FRA_EU_transit_desc: "우리는 생태 전환 지원 기금에 참여하기로 합의했습니다. 프랑스 녹색당이 시작한 이 구상은 탄소 기반 경제에서 저탄소 경제로의 전환을 돕는 것을 목표로 합니다."
 FRA_eu_ban_fossile: "화석 연료의 단계적 폐지"
 FRA_eu_ban_fossile_desc: "우리는 화석 연료를 단계적으로 폐지하는 중입니다. 우리의 차량은 전기로 달리게 되며, 화석 연료는 부차적인 용도로만 쓰일 것입니다. 프랑스 녹색당이 시작한 이 전환에는 많은 비용이 들 것입니다. 그러나 이는 우리의 미래와 산유국으로부터의 독립을 위한 투자입니다."
 FRA_regulation_agra: "농업 규제"
 FRA_regulation_agra_desc: "우리는 유럽 연합의 식품 생산 규제를 준수하기로 합의했습니다. 핵심 무역 파트너를 잃고 싶지 않다면 이것이 유일한 선택이었습니다."
 FRA_regulation_indus: "산업 규제"
 FRA_regulation_indus_desc: "우리는 유럽 연합의 물품 생산 규제를 준수하기로 합의했습니다. 핵심 무역 파트너를 잃고 싶지 않다면 이것이 유일한 선택이었습니다."
 FRA_regulation_fuel: "석유 채굴 규제"
 FRA_regulation_fuel_desc: "우리는 유럽 연합의 연료 채굴 규제를 준수하기로 합의했습니다. 핵심 무역 파트너를 잃고 싶지 않다면 이것이 유일한 선택이었습니다."
 FRA_EU_rail: "유럽 교통망 구축"
 FRA_EU_rail_desc: "우리는 무역을 촉진하고 물자 수송을 최적화하기 위해 더 나은 교통망을 구축하는 데 프랑스 및 유럽 연합의 나머지 국가들과 협력하는 것을 돕기로 합의했습니다."
 FRA_eu_pcf_reform: "사회적 평화의 구매"
 FRA_eu_pcf_reform_desc: "우리는 프랑스에서 공산주의가 승리한 뒤 급진 좌파가 동요하기 시작하자 이들에게 양보하기로 합의했습니다. 우리는 그들이 원하는 것을 주었고, 이제 그들은 잠잠해져야 합니다."
 FRA_fr_military_assistance: "프랑스의 군사 지원"
 FRA_fr_military_assistance_desc: "우리는 러시아와의 고강도 분쟁에 대비해 군을 준비시키는 프랑스의 지원을 받아들였습니다. 그들이 우리 국경을 넘는 날, 우리는 준비되어 있을 것입니다."
 FRA_european_internationale: "유럽 인터내셔널"
 FRA_european_internationale_desc: "우리는 유럽의 또 다른 공산주의 세력과 동맹을 맺었습니다. 우리는 함께 자본주의와 파시즘을 영원히 격파할 것입니다."
 FRA_international_will_be_humankind: "인터내셔널은 인류가 될 것이다"
 FRA_international_will_be_humankind_desc: "우리는 힘들게 얻은 권력을 공고히 하는 데 성공했습니다. 우리는 불가능을 이루었습니다. 프랑스에서 공산주의의 영속적인 승리를 확보한 것입니다. 아직 해야 할 일이 많지만, 우리는 프랑스에서 자본주의와 파시즘에 맞서 싸우기 위한 올바른 토대를 마련했습니다."
 FRA_eu_FN_reform: "안보 보장"
 FRA_eu_FN_reform_desc: "우리는 국가 우선권을 시행하고 불안 문제를 해결하라는 국민의 요구에 긍정적으로 응답했습니다. 이 개혁은 유럽 내 극우의 부상의 결과이지만, 국민에 대한 통제력을 행사하는 우리의 능력도 강화하므로 좋은 일입니다."
 FRA_nuke_boost: "원자력 우위"
 FRA_nuke_boost_desc: "원자력은 수십 년 동안 우리에게 에너지를 공급해 왔습니다. 이는 저비용으로 저탄소 에너지를 생산하는 훌륭한 방법입니다. 심각한 일이 일어나지 않도록 이 원자로들에 대한 감시를 강화하기만 하면 됩니다."
 FRA_Boreal_Space: "보레알 공간"
 FRA_Boreal_Space_desc: "보레알 공간은 러시아권과 프랑스어권 사이의 파트너십으로, 러시아를 유럽 동맹에 통합하는 것을 목표로 합니다. 오늘 우리의 목표는 우리가 공유하는 적인 극단적 세계주의의 위협에 맞서 싸우는 것입니다."
 FRA_france_for_french: "프랑스인을 위한 프랑스"
 FRA_france_for_french_desc: "창당 이래 우리는 언제나 우리에 맞서 단결해 온 이민 찬성 세력과 맞서야 했습니다. 그러나 이제 우리의 강령을 완수했으므로, 우리는 프랑스를 운명을 향해 이끌고 인도할 능력을 입증했습니다. 이제 더 이상의 저항은 무의미합니다."
 FRA_red_purges: "장교단 숙청"
 FRA_red_purges_desc: "옛 장교단은 결코 우리 편이 아니었으므로, 우리는 그것을 깨뜨리고 대신 일반 병사들 중에서 승진시켰습니다. 이제 지휘부는 충성스럽고 교체하는 데 비용도 적게 들지만, 전문적인 군대를 포기하고 전장에서 여전히 기술을 배우고 있는 군대를 얻었습니다."
 FRA_people_constitution: "인민 헌법"
 FRA_people_constitution_desc: "우리의 혁명은 성공했지만, 노동자들이 어떻게 통치받기를 원하는지 스스로 결정할 기회를 줌으로써 권력을 공고히 해야 합니다."
 FRA_commies_redarmy1: "새로운 붉은 군대"
 FRA_commies_redarmy1_desc: "우리의 혁명에는 스스로를 지키고 대의를 전파할 군대가 필요합니다. 프랑스군의 토대 위에, 우리는 인민과 혁명을 지킬 새로운 군대를 창설했습니다."
 FRA_commies_redarmy2: "새로운 붉은 군대"
 FRA_commies_redarmy2_desc: "우리의 혁명에는 스스로를 지키고 대의를 전파할 군대가 필요합니다. 프랑스군의 토대 위에, 우리는 인민과 혁명을 지킬 새로운 군대를 창설했습니다."
 FRA_red_agent_lar: "혁명 행동 총국"
 FRA_red_agent_lar_desc: "우리는 반동적이고 자본주의적인 적들에 대한 핵심 정보를 얻기 위해 대외안전총국의 기법을 본떠 접근 방식을 구성했습니다."
 FRA_red_agent_non_lar: "혁명 행동 총국"
 FRA_red_agent_non_lar_desc: "우리는 반동적이고 자본주의적인 적들에 대한 핵심 정보를 얻기 위해 대외안전총국의 기법을 본떠 접근 방식을 구성했습니다."
 FRA_monarchist_anger: "군주주의자들의 분노"
 FRA_monarchist_anger_desc: "우리의 군주주의 동맹은 귀족 특권을 복원하기를 거부한 우리의 결정에 실망했습니다. 보나파르트주의는 혁명의 후계자이며, 달리 될 수는 없습니다."
 FRA_bonapart_constitution: "보나파르트주의 헌법"
 FRA_bonapart_constitution_desc: "제3공화국 이래 우리의 제도는 더 이상 우리와 같은 위상의 황제를 수용하도록 설계되지 않았습니다. 따라서 다가올 우리의 치세에 맞게 헌법을 조정해야 합니다. 이 기회에 국민이 이전 공화국들에 제기했던 비판의 일부를 해결할 수 있으며, 이는 그들에게 올바른 방향으로 나아가는 한 걸음이 될 것입니다."
 FRA_bonapart_military_reform: "그랑다르메 재편"
 FRA_bonapart_military_reform_desc: "우리 군은 영토 내 안보를 보장하기에는 충분하지만, 제국을 되찾으려는 우리의 계획을 수행하기에는 충분하지 않습니다. 재편이 필수적입니다. 우리는 최상층부터 모든 것을 해체한 뒤 각 부문을 더 효과적으로 개편할 것입니다."
 FRA_army_reformed_1: "재편된 지휘 체계"
 FRA_army_reformed_1_desc: "지휘 체계가 재편되었으므로 이제 기술과 주문 계획을 포함하여 군에 대한 보다 광범위한 개혁을 수행할 여유가 생겼습니다. 큰 과업이 앞에 놓여 있지만, 이는 우리의 야망을 실현할 자원을 제공할 것입니다."
 FRA_army_reformed_infantry: "그랑다르메 개혁: 보병 전열"
 FRA_army_reformed_infantry_desc: "우리 황제는 느리고 통제된 진격을 지지하는 결정을 내렸습니다. 따라서 보병과 그들에게 필요한 장비가 우선시될 것입니다."
 FRA_army_reformed_cavalry: "그랑다르메 개혁: 기갑 쐐기"
 FRA_army_reformed_cavalry_desc: "우리 황제는 빠르고 강력한 공격을 지지하는 결정을 내렸습니다. 따라서 전차 대대와 그들에게 필요한 장비가 우선시될 것입니다."
 FRA_army_reformed_artillery_infantry: "그랑다르메 개혁: 보병과 포병"
 FRA_army_reformed_artillery_infantry_desc: "우리 황제는 포병의 지원을 받는 느리고 통제된 진격을 지지하는 결정을 내렸습니다. 따라서 보병과 포병, 그리고 관련 장비가 우선시될 것입니다."
 FRA_army_reformed_artillery_cavalry: "그랑다르메 개혁: 기갑과 포병"
 FRA_army_reformed_artillery_cavalry_desc: "우리 황제는 포병의 지원을 받는 빠르고 강력한 공격을 지지하는 결정을 내렸습니다. 따라서 전차 대대와 포병, 그리고 관련 장비가 우선시될 것입니다."
 FRA_army_reformed_air_infantry: "그랑다르메 개혁: 보병과 항공 전력"
 FRA_army_reformed_air_infantry_desc: "우리 황제는 공격기의 지원을 받는 느리고 통제된 진격을 지지하는 결정을 내렸습니다. 따라서 보병 대대와 항공기의 대량 생산이 우선시될 것입니다."
 FRA_army_reformed_air_cavalry: "그랑다르메 개혁: 기갑과 항공 전력"
 FRA_army_reformed_air_cavalry_desc: "우리 황제는 공격기의 지원을 받는 빠르고 강력한 공격을 지지하는 결정을 내렸습니다. 따라서 전차 대대와 항공기의 대량 생산이 우선시될 것입니다."
 FRA_BCE_money: "EU의 자금"
 FRA_BCE_money_desc: "우리는 유럽 은행의 원조를 대가로 유럽 연합 기관으로의 복귀를 협상하는 데 성공했습니다. 이 원조는 우리가 그들을 상대로 벌일 전쟁을 준비하는 데 필수적일 것입니다!"
 FRA_4th_empire_desc: "보나파르트주의 제국이 그 어느 때보다 강력하게 돌아왔으며, 이번에는 어떤 대연합도 우리를 패배시키지 못할 것입니다."
 FRA_grande_arme_art_inf: "현대의 그랑다르메"
 FRA_grande_arme_art_inf_desc: "수개월의 개혁 끝에 우리 군은 제국의 잃어버린 영토를 되찾기 위해 출발할 준비를 완전히 마쳤습니다. 체계를 전면 개편한 뒤, 우리는 적의 전선에 대한 집중 포격의 지원을 받는 느리고 꾸준한 진격 전략을 중심으로 군을 재건했습니다. 보병은 여전히 전장의 왕이지만, 공격 항공 전력이 그 임무를 훨씬 수월하게 해 줄 것입니다."
 FRA_grande_arme_art_cav: "불과 강철의 홍수"
 FRA_grande_arme_art_cav_desc: "수개월의 개혁 끝에 우리 군은 제국의 잃어버린 영토를 되찾기 위해 출발할 준비를 완전히 마쳤습니다. 체계를 전면 개편한 뒤, 우리는 집중 포격의 지원을 받는 신속하고 잔혹한 진격 전략을 중심으로 군을 재건했습니다. 이 전략은 기술적으로 진보한 자원에 의존하지만, 우리에게는 나폴레옹의 홍수를 능가할 수단이 있습니다."
 FRA_grande_arme_air_inf: "하늘이 길을 열다"
 FRA_grande_arme_air_inf_desc: "수개월의 개혁 끝에 우리 군은 제국의 잃어버린 영토를 되찾기 위해 출발할 준비를 완전히 마쳤습니다. 우리는 소총수가 투입되기 전에 타격기와 정찰기가 각 진지를 무너뜨리는, 전적으로 우리 공군의 엄호 아래 이루어지는 절제된 보병 진격을 중심으로 군을 재건했습니다. 보병은 여전히 땅을 차지하지만, 더 이상 눈먼 채로 그곳을 걷지는 않습니다."
 FRA_grande_arme_air_cav: "돌격 앞의 천둥"
 FRA_grande_arme_air_cav_desc: "수개월의 개혁 끝에 우리 군은 제국의 잃어버린 영토를 되찾기 위해 출발할 준비를 완전히 마쳤습니다. 우리는 공군이 이미 지나간 곳으로만 이동하는 기갑 종대를 중심으로 군을 재건했으며, 포병 수송대를 진격 속도에 맞추는 타격 비행대로 대체했습니다. 그 무엇도 돌격을 늦추지 못하며, 그 앞에서 살아남는 것은 아무것도 없습니다."
 FRA_surrounded: "대륙 봉쇄"
 FRA_surrounded_desc: "우리의 권력 장악은 주목받지 않을 수 없었으며, 다른 유럽 열강들이 이미 우리를 겨냥해 음모를 꾸미고 있음은 분명합니다. 특히 과거 우리의 불구대천의 원수였던 영국이 그러합니다. 우리는 이 유럽 열강들을 하나도 빠짐없이 쓰러뜨려야 합니다. 우리의 생존과 혁명의 존속이 여기에 달려 있습니다."
 FRA_Sachons_vaincre: "대홍수"
 FRA_Sachons_vaincre_desc: "수개월 동안 고강도 분쟁에 대비하도록 국민을 준비시킨 결과, 그들은 이제 오랫동안 기다려 온 이 전쟁에 나설 준비가 되었습니다. 그들의 열정과 신념은 산도 움직일 수 있으나, 그것이 시들기 전에 신속히 행동해야 합니다. 최대한 빠르게 적들을 짓밟아야 합니다."
 FRA_prepare_to_fight: "복귀 준비"
 FRA_prepare_to_fight_desc: "우리는 신중한 접근을 택했습니다. 국민이 우리의 팽창 야망을 전적으로 지지하고 있음을 알기에, 이제 남은 일은 그 야망을 실현할 수단을 제공하는 것뿐입니다. 때가 왔을 때 준비가 되어 있도록 만전을 기해야 합니다."
 FRA_defense_napoleon: "비상사태"
 FRA_defense_napoleon_desc: "보나파르트주의자들이 국경에서 자행한 테러 공격 이후, 우리나라는 고도의 경계 태세에 들어갔습니다. 무슨 일이 일어나더라도 우리는 대비되어 있을 것입니다."
 FRA_thousands_planes: "항공 군비 경쟁"
 FRA_thousands_planes_desc: "우리는 너무 오랫동안 우리와 나머지 유럽을 지배하려 해 온 미국과 싸우기로 결정했습니다. 유럽을 지키려면 그들을 파괴해야 하며, 그들을 파괴하려면 공중에서 대등하게 겨룰 수 있어야 합니다. 해상에서 그들을 이길 수단은 우리에게 없기 때문입니다."
 FRA_trade_USA: "대서양 횡단 무역"
 FRA_trade_USA_desc: "미국과 프랑스 제국은 대서양을 가로지르는 무역을 위해 손을 잡았습니다. 이 협정은 평화의 보장을 대가로 양국에 평화와 번영을 가져다줄 것입니다."
 FRA_king_camelot_lar: "국왕의 카믈로"
 FRA_king_camelot_lar_desc: "모든 혁명적 성향과 기타 반왕정 운동을 진압하는 임무를 맡은 우리의 비밀경찰입니다."
 FRA_king_camelot_non_lar: "국왕의 카믈로"
 FRA_king_camelot_non_lar_desc: "모든 혁명적 성향과 기타 반왕정 운동을 진압하는 임무를 맡은 우리의 비밀경찰입니다."
 FRA_king_constitution: "군주주의 헌법"
 FRA_king_constitution_desc: "우리나라가 거쳐 온 모든 공화국은 불안정한 토대 위에 제도를 세웠습니다. 이 쓰레기 같은 것을 다시 써야 합니다. 우리의 절대적 통치 아래에서도 모든 국가에는 법이 필요하기 때문입니다."
 FRA_chivalry: "현대의 기사도"
 FRA_chivalry_desc: "프랑스 왕정은 언제나 강력한 기병 전력에 의존해 왔습니다. 우리는 보병보다 기계화 기병을 우선시함으로써 이러한 전통을 이어 가기로 했습니다."
 FRA_elite_army: "정예 군대"
 FRA_elite_army_desc: "혁명 전쟁은 징병제를 가져왔습니다. 그러나 우리가 겪은 수많은 분쟁은 인명 면에서 극도로 큰 대가를 치르게 했습니다. 국왕의 신민이 늘 전쟁에 잘 훈련되어 있는 것은 아닙니다. 따라서 우리는 규모는 작되 훨씬 더 잘 훈련된 병력에 집중하기로 했습니다."
 FRA_prepare_crusade: "제10차 십자군"
 FRA_prepare_crusade_desc: "우리 병력은 성지를 정복하기 위해 출정할 준비를 마쳤습니다."
 FRA_political_preassure: "외교력 강화"
 FRA_political_preassure_desc: "우리는 레바논을 외교적으로 설득하는 데 실패했으므로, 외국 세력과 교섭하는 방식을 개선해야 합니다."
 FRA_navy_crusade: "해상 십자군"
 FRA_navy_crusade_desc: "우리는 바다를 통해 성지를 되찾기로 결정했습니다. 이를 위해서는 효과적인 상륙 공세 능력이 필요합니다."
 FRA_commie_europe_integration: "유럽 동화"
 FRA_commie_europe_integration_desc: "우리는 나머지 유럽에 혁명과 공산주의를 가져다주었습니다. 이제 모든 나라의 프롤레타리아트를 하나로 묶어, 혁명이 지속되도록 보장할 수 있는 유럽 연방을 만들 때입니다."
 FRA_counter_insurgency: "효율적인 군사 치안 활동"
 FRA_counter_insurgency_desc: "스페인의 게릴라는 나폴레옹 1세에게 문제가 되었으나, 우리에게는 그렇지 않을 것입니다."
 FRA_attack_benelux: "작전 계획: 베네룩스"
 FRA_attack_benelux_desc: "베네룩스 병력의 섬멸에 집중해야 합니다. 황제께서 그들을 신속히 격파할 수단을 우리에게 주셨습니다."
 FRA_attack_iberia: "작전 계획: 이베리아"
 FRA_attack_iberia_desc: "이베리아 병력의 섬멸에 집중해야 합니다. 황제께서 그들을 신속히 격파할 수단을 우리에게 주셨습니다."
 FRA_attack_germany: "작전 계획: 독일"
 FRA_attack_germany_desc: "독일 병력의 섬멸에 집중해야 합니다. 황제께서 그들을 신속히 격파할 수단을 우리에게 주셨습니다."
 FRA_attack_holy_roman: "작전 계획: 남유럽"
 FRA_attack_holy_roman_desc: "남유럽 잔존 병력의 섬멸에 집중해야 합니다. 황제께서 그들을 신속히 격파할 수단을 우리에게 주셨습니다."
 FRA_BON_support_allies: "장기전 준비"
 FRA_BON_support_allies_desc: "프랑스 측 파트너는 우리가 러시아와의 고강도 분쟁에 대비할 것을 제안했습니다."
 FRA_attack_east: "작전 계획: 동유럽"
 FRA_attack_east_desc: "동유럽 병력의 섬멸에 집중해야 합니다. 황제께서 그들을 신속히 격파할 수단을 우리에게 주셨습니다. 이것이 마지막 원정을 앞둔 최종 단계입니다."
 FRA_attack_russia_fast: "총구에 꽃을"
 FRA_attack_russia_fast_desc: "2주 후면 우리는 모스크바에 있을 것이다!"
 FRA_attack_russia_slow: "신중한 진격"
 FRA_attack_russia_slow_desc: "이번에는 베레지나 강의 비극이 없을 것이다."
 FRA_attack_UK_naval: "해협 도하"
 FRA_attack_UK_naval_desc: "영국 해군은 더 이상 우리에게 위협이 아닙니다. 승리는 손에 닿는 곳에 있습니다."
 FRA_attack_UK_air: "해협 비월"
 FRA_attack_UK_air_desc: "우리는 제공권을 유지하고 적의 허를 찔러야 합니다."
 FRA_BON_victory: "제국 보호령"
 FRA_BON_victory_desc: "우리는 나폴레옹 제국에 정복당했습니다."
 FRA_expansion_europe: "샤를마뉴의 후계자"
 FRA_expansion_europe_desc: "카롤링거 제국을 되찾는 것이 우리의 운명입니다."
 FRA_expansion_europe_crusades: "카롤링거 십자군"
 FRA_expansion_europe_crusades_desc: "프랑크인은 자신들의 땅을 되찾았습니다. 이제 성지를 향해 출정해야 합니다."
 FRA_expansion_crusades: "성왕 루이의 후계자"
 FRA_expansion_crusades_desc: "신을 섬기고 성지를 되찾는 것이 우리 왕국의 의무입니다."
 FRA_EMPIRE_occident: "서방 제국"
 FRA_EMPIRE_occident_desc: "우리는 카롤링거 제국을 재정복하고 서방의 황제로 즉위했습니다."
 FRA_crusade_done_jerusalem: "승리한 십자군"
 FRA_crusade_done_jerusalem_desc: "제10차 십자군은 예루살렘과 성지를 되찾음으로써 목표를 달성했습니다."
 FRA_expansion_crusades_plus: "마지막 십자군"
 FRA_expansion_crusades_plus_desc: "성지를 되찾은 우리는 과거의 잘못을 바로잡기로 결정했습니다. 모든 분열은 끝나야 합니다."
 FRA_protestant_anger: "개신교도의 저항"
 FRA_protestant_anger_desc: "개신교도를 향한 우리의 공격적인 언사가 국내에서 그들의 분노를 불러일으켰습니다."
 FRA_harsh_subjugation: "가혹한 예속"
 FRA_harsh_subjugation_desc: "우리의 종주국인 프랑스 국왕이 우리의 경제와 정책을 통제하기로 결정했습니다. 패배에는 무거운 대가가 따릅니다."
 FRA_victory_crusade_2_conversion: "묵시록의 다섯 번째 기사"
 FRA_victory_crusade_2_conversion_desc: "신의 진노가 우리의 적들 위에 쏟아졌습니다."
 FRA_enlightment: "교회의 보호령"
 FRA_enlightment_desc: "우리의 종주국인 프랑스 국왕이 우리나라의 재건을 돕고, 우리 사회의 물리적·문화적 재건을 지원하기로 결정했습니다."
 FRA_victory_crusade_2_freedom_light: "교회의 맏딸"
 FRA_victory_crusade_2_freedom_light_desc: "길 잃은 양들은 극진한 친절로 대해야 합니다."
 FRA_attack_colonies: "제국 식민지 수복"
 FRA_attack_colonies_desc: "대륙 체제는 존속을 보장하기 위한 자원을 찾아야 합니다."
 france_md.404.t: "녹색당과의 협약"
 france_md.404.d: "협상이 끝났고 문서가 탁자 위에 놓여 있습니다. 원자로 24기 폐쇄, 그 첫 번째는 페센하임이며, 10년 안에 원자력을 전력 구성의 절반으로 줄이는 내용입니다. 그 대가로 녹색당은 60개 선거구에서 후보를 내지 않을 것이며 다수당 지위는 유지됩니다. 에너지 노조 연맹들은 이미 반대표를 던졌으며, 몽트부르는 의원단의 절반이 사석에서 하는 말을 공개적으로 밝혔습니다. 서명하시겠습니까?"
 france_md.404.a: "서명한다. 동맹은 원자로보다 가치가 크다"
 france_md.404.b: "함대는 흥정 대상이 아니다"
 france_md.405.t: "모두를 위한 시위"
 france_md.405.d: "우리의 최근 법안이 동료 시민들 사이에서 만장일치의 지지를 얻지는 못한 것으로 보입니다. 그들은 샹 드 마르스를 가득 메웠으며, 법안이 폐기될 때까지 매달 같은 일을 반복할 작정입니다. 주최측은 신중하고, 팻말은 분홍색과 파란색이며, 그 뒤에는 이 나라의 모든 보수 단체와 우파 의원단의 상당수가 버티고 있습니다. 초안으로 작성된 법안은 혼인, 입양, 친자 관계를 다룹니다. 세 가지 모두에서 입장을 고수할 수도 있고, 가장 많은 군중을 모으는 부분을 삭제하고 나머지를 조용히 통과시킬 수도 있습니다."
 france_md.405.a: "법안을 전부 통과시킨다. 행진하게 두어라"
 france_md.405.b: "법안을 손질하여 얻을 수 있는 것을 얻는다"
 france_md.406.t: "점거된 로터리"
 france_md.406.d: "여덟 번의 주말이 지났습니다. 도청들은 천 곳의 로터리가 점거되었다고 보고하고, 개선문은 훼손되었으며, 플래시볼 탄환은 카메라 앞에서 사람들의 눈을 앗아갔습니다. 협상할 지도부는 없습니다. 그들이 지도부를 두기를 거부하기 때문입니다. 내무부는 시위 방지법과 재량권을 원합니다. 다른 이들은 전국 토론, 모든 코뮌에서의 주민 회의, 그리고 유럽 의회 선거 전에 이 사태를 끝낼 만큼 큰 규모의 양보안을 원합니다."
 france_md.406.a: "시위 방지법을 통과시키고 로터리를 정리한다"
 france_md.406.b: "대토론회를 열고 평화의 대가를 치른다"
 FRA_change_politics_nationalist: "§Y$FRA_political_balance$§!: $FRA_balance_domestic_nationalist_drift$이(가) [?temp_change|%+]만큼 변화합니다\n"
 FRA_truly_absolutism_TT: "§g우리는 다른 모든 정당을§! §R금지§!§g하고 왕국이§! §Y진정한 절대 군주제§!임을 선포할 것이다"
 FRA_social_welf_need_tooltip_modifier_effect_TT: "§Y$FRA_social_balance$§!: $FRA_SOC_welf_ned$이(가) [?temp_change|%-]만큼 변화합니다\n"
 FRA_4th_empire: "제3 프랑스 제국"
 threat_FRA_napo_empire: "나폴레옹이 돌아왔다"
 FRA_liberal_arms_contracts: "자유로운 무기 수출 정책"
 FRA_liberal_arms_contracts_desc: "다소, 나발 그룹, 탈레스, MBDA는 세계에서 가장 앞선 방위 산업 중 하나를 이끌고 있습니다. 자유로운 수출 정책은 현대화를 모색하는 국가들과의 수익성 높은 계약을 추진하게 해 주며, 우리 공장의 수주 장부를 채우는 동시에 군사 파트너십을 통해 프랑스의 영향력을 확대해 줍니다."
 FRA_liberal_arms_contracts_tt: "앞으로 몇 달 동안 §Y사우디아라비아§!, §Y아랍에미리트§!, §Y세르비아§!, §Y그리스§!, §Y이집트§!, §Y인도§!에 무기 계약을 제안할 것입니다."
 FRA_arms_contract_opinion: "무기 계약 파트너십"
 france_md.323.t: "리야드 구애"
 france_md.323.d: "리야드는 유로파이터와 함께 운용할 전투기를 물색하고 있으며, 나발 그룹의 엔지니어들은 사와리 계획에 따라 건조된 알리야드급 호위함을 여전히 정비하고 있습니다. 국방부는 [SAU.GetNameWithFlag]에 제시할 제안서를 작성했습니다. 무엇을 제안해야 합니까?"
 france_md.323.a: "경무기 패키지 (50억 달러)"
 france_md.323.b: "중무기 패키지 (150억 달러)"
 france_md.323.c: "프리미엄 라팔 패키지 (300억 달러)"
 france_md.323.e: "이 계약은 추진하지 않는다"
 france_md.324.t: "프랑스의 제안을 저울질하는 리야드"
 france_md.324.d: "[FRA.GetNameWithFlag]이(가) 유로파이터 비행대의 대안으로 라팔을, 그리고 나발 그룹이 수십 년간 정비해 온 사와리 호위함 계획의 연장을 함께 제안하고 있습니다."
 france_md.324.a: "계약을 수락한다"
 france_md.324.b: "제안을 거절한다"
 france_md.325.t: "아부다비 구애"
 france_md.325.d: "에미리트 공군은 1990년대에 다소가 아부다비를 위해 특별히 제작한 파생형인 미라주 2000-9를 여전히 운용하고 있습니다. 이 기단이 노후화되면서, 국방부는 그 후속기인 라팔을 [UAE.GetNameWithFlag]에 제안할 기회를 보고 있습니다. 무엇을 제안해야 합니까?"
 france_md.325.a: "경무기 패키지 (50억 달러)"
 france_md.325.b: "중무기 패키지 (150억 달러)"
 france_md.325.c: "프리미엄 라팔 패키지 (300억 달러)"
 france_md.325.e: "이 계약은 추진하지 않는다"
 france_md.326.t: "프랑스의 제안을 저울질하는 아부다비"
 france_md.326.d: "[FRA.GetNameWithFlag]이(가) 30년 전 다소가 우리를 위해 제작한 맞춤형 파생형인 미라주 2000-9 기단의 후속기로 라팔을 제안하고 있습니다."
 france_md.326.a: "계약을 수락한다"
 france_md.326.b: "제안을 거절한다"
 france_md.327.t: "베오그라드 구애"
 france_md.327.d: "[SER.GetNameWithFlag]은(는) 여전히 소련 시대의 MiG-29를 운용하며 단거리 방공 체계를 모스크바에서 구입하고 있습니다. 우리는 라팔을 그 대체기로 제안할 수 있으며, 방공 부대용으로 MBDA의 미스트랄 휴대용 미사일을 함께 지원할 수 있습니다. 무엇을 제안해야 합니까?"
 france_md.327.a: "경무기 패키지 (30억 달러)"
 france_md.327.b: "중무기 패키지 (80억 달러)"
 france_md.327.c: "프리미엄 라팔 패키지 (150억 달러)"
 france_md.327.e: "이 계약은 추진하지 않는다"
 france_md.328.t: "프랑스의 제안을 저울질하는 베오그라드"
 france_md.328.d: "[FRA.GetNameWithFlag]이(가) 노후화된 MiG-29 기단의 서방측 대안으로 라팔을, 그리고 방공 부대용 MBDA의 미스트랄 미사일을 함께 제안하고 있습니다. 이를 수락하면 러시아 세력권 밖에서 맺는 우리의 첫 주요 무기 거래가 될 것입니다."
 france_md.328.a: "계약을 수락한다"
 france_md.328.b: "제안을 거절한다"
 france_md.329.t: "아테네 구애"
 france_md.329.d: "[GRE.GetNameWithFlag]은(는) 이미 우리의 라팔을 운용하고 있으며 그 관계를 해군으로 확장하고자 합니다. 나발 그룹은 공군 주문에 걸맞게 FREMM 파생 호위함 패키지를 제안했습니다. 그리스 동맹국에 무엇을 제안해야 합니까?"
 france_md.329.a: "경무기 패키지 (40억 달러)"
 france_md.329.b: "중무기 패키지 (120억 달러)"
 france_md.329.c: "프리미엄 라팔 패키지 (200억 달러)"
 france_md.329.e: "이 계약은 추진하지 않는다"
 france_md.330.t: "프랑스의 제안을 저울질하는 아테네"
 france_md.330.d: "[FRA.GetNameWithFlag]이(가) FREMM 파생 호위함을 중심으로 한 패키지를 제안하고 있으며, 이는 우리의 앞선 라팔 주문으로 이미 굳건해진 방위 관계를 확장하는 것입니다."
 france_md.330.a: "계약을 수락한다"
 france_md.330.b: "제안을 거절한다"
 france_md.331.t: "카이로 구애"
 france_md.331.d: "[EGY.GetNameWithFlag]은(는) 이미 우리의 라팔을 운용하고 있고, 러시아를 위해 건조되었다가 카이로로 행선지가 바뀐 미스트랄급 항공모함 두 척을 운용하며, 우리 해군의 발주 목록에서 FREMM 호위함 타히아 미스르를 주문했습니다. 이 파트너십을 심화하려면 무엇을 제안해야 합니까?"
 france_md.331.a: "경무기 패키지 (40억 달러)"
 france_md.331.b: "중무기 패키지 (120억 달러)"
 france_md.331.c: "프리미엄 라팔 패키지 (250억 달러)"
 france_md.331.e: "이 계약은 추진하지 않는다"
 france_md.332.t: "프랑스의 제안을 저울질하는 카이로"
 france_md.332.d: "[FRA.GetNameWithFlag]이(가) 우리의 라팔 비행대, 미스트랄급 항공모함, FREMM 호위함 타히아 미스르를 아우르는 기존 파트너십을 확대하겠다고 제안하고 있습니다."
 france_md.332.a: "계약을 수락한다"
 france_md.332.b: "제안을 거절한다"
 france_md.333.t: "뉴델리 구애"
 france_md.333.d: "[IND.GetNameWithFlag]은(는) 세계 최대 규모의 방위 시장 중 하나를 운영하고 있습니다. 뉴델리는 이미 라팔 36기를 운용하고 있으며 마자곤 도크에서 스코르펜급 잠수함을 면허 생산하고 있습니다. 이 파트너십을 확대하려면 무엇을 제안해야 합니까?"
 france_md.333.a: "경무기 패키지 (60억 달러)"
 france_md.333.b: "중무기 패키지 (200억 달러)"
 france_md.333.c: "프리미엄 라팔 패키지 (400억 달러)"
 france_md.333.e: "이 계약은 추진하지 않는다"
 france_md.334.t: "프랑스의 제안을 저울질하는 뉴델리"
 france_md.334.d: "[FRA.GetNameWithFlag]이(가) 인도 공군에서 이미 운용 중인 라팔과 마자곤 도크에서 면허 생산된 스코르펜급 잠수함을 토대로 협력을 확대하겠다고 제안하고 있습니다."
 france_md.334.a: "계약을 수락한다"
 france_md.334.b: "제안을 거절한다"
 FRA_joint_weapon_projects_category: "공동 무기 개발 프로젝트"
 FRA_joint_weapon_projects_category_desc: "프랑스는 영국과의 재규어 공격기부터 독일과의 티게르 헬리콥터에 이르기까지 공동 방위 계획의 오랜 역사를 가지고 있습니다. 새로운 공동 프로젝트는 개발 비용을 분담하게 해 주며, 어느 한쪽 파트너 혼자서는 감당할 수 없는 장비를 배치할 수 있게 해 줍니다."
 FRA_joint_project_germany: "SCAF/MGCS 공동 프로젝트 제안"
 FRA_joint_project_germany_desc: "SCAF(Système de Combat Aérien du Futur, 미래 공중 전투 체계)는 다소와 에어버스를 짝지어 라팔과 유로파이터의 뒤를 이을 6세대 전투기를 설계합니다. MGCS(Main Ground Combat System, 주력 지상 전투 체계)는 KNDS에 르클레르와 레오파르트 2를 대체할 신형 주력 전차를 맡깁니다. 이 둘은 함께 냉전 이후 양국이 추진한 가장 큰 방위 계획이 될 것입니다."
 FRA_socialist_government_required_tt: "§Y사회주의§! 또는 §Y좌익§! 정부가 집권 중이어야 합니다"
 FRA_joint_project_russia: "프랑스-러시아 ATOM 프로젝트 제안"
 FRA_joint_project_russia_desc: "우리는 ATOM 보병 전투차를 모스크바와의 공동 계획으로 제안합니다. 이는 넥스터의 설계팀과 러시아 장갑차 기술자들을 짝짓는 것입니다. 서방 동맹국들과 이렇게까지 깊이 결별하려면 먼저 EU를 탈퇴해야 합니다."
 FRA_nationalist_government_required_tt: "§Y민족주의§! 또는 §Y국민연합§! 정부가 집권 중이어야 합니다"
 FRA_joint_project_opinion: "공동 무기 개발 파트너"
 france_md.335.t: "프랑스-독일 SCAF/MGCS 프로젝트 제안"
 france_md.335.d: "[FRA.GetNameWithFlag]이(가) 라팔과 유로파이터의 뒤를 이을 6세대 전투기와 르클레르와 레오파르트 2를 대체할 주력 전차를 공동 계획으로 하는 SCAF(Système de Combat Aérien du Futur)와 MGCS(Main Ground Combat System)의 출범을 제안하고 있습니다. 다소, 에어버스, KNDS가 파리와 베를린 사이에서 엔지니어링 작업을 분담하게 될 것입니다."
 france_md.335.a: "유럽 방위의 미래를 함께 건설하자"
 france_md.335.b: "우리는 독자적으로 체계를 개발하는 쪽을 선호한다"
 france_md.336.t: "SCAF/MGCS 프로젝트를 수락한 독일"
 france_md.336.d: "[GER.GetNameWithFlag]이(가) SCAF와 MGCS에 대한 우리의 제안을 수락했습니다. 다소와 에어버스의 엔지니어들이 전투기 계획에서 독일 측 기술자들과 협력하며, 전차는 KNDS가 주도합니다."
 france_md.336.a: "훌륭하다! 프랑스-독일 협력이여 영원하라!"
 france_md.337.t: "프랑스-러시아 ATOM 프로젝트 제안"
 france_md.337.d: "[FRA.GetNameWithFlag]이(가) ATOM 보병 전투차를 넥스터의 엔지니어들과 러시아 장갑차 설계자들을 짝짓는 프랑스-러시아 공동 계획으로 제안하고 있습니다. 이미 전통적인 서방 동맹국들과 거리를 둔 파리는 이제 방위 파트너를 동쪽에서 찾고 있습니다."
 france_md.337.a: "프랑스-러시아 협력의 새 시대가 시작된다"
 france_md.337.b: "이 제안은 너무 논란이 많다"
 france_md.338.t: "ATOM 프로젝트를 수락한 러시아"
 france_md.338.d: "[RUS.GetNameWithFlag]이(가) ATOM 계획에 대한 우리의 제안을 수락했습니다. 넥스터의 엔지니어들이 러시아 측 기술자들과 협력하여 신형 보병 전투차를 개발하며, 이는 냉전 이후 모스크바와의 첫 주요 방위 파트너십입니다."
 france_md.338.a: "프랑스-러시아 관계의 새로운 장!"
 FRA_FCAS_MGCS_project: "SCAF/MGCS 개발 계획"
 FRA_FCAS_MGCS_project_desc: "프랑스와 독일은 다소와 에어버스가 주도하는 6세대 전투기 SCAF(Système de Combat Aérien du Futur)와 KNDS가 주도하는 신형 주력 전차 MGCS(Main Ground Combat System)를 공동 개발하고 있습니다. 이 둘은 함께 냉전 이후 양국이 추진한 가장 큰 방위 계획입니다."
 GER_FCAS_MGCS_project: "SCAF/MGCS 개발 계획"
 GER_FCAS_MGCS_project_desc: "독일과 프랑스는 에어버스와 다소가 주도하는 6세대 전투기 SCAF(Système de Combat Aérien du Futur)와 KNDS가 주도하는 신형 주력 전차 MGCS(Main Ground Combat System)를 공동 개발하고 있습니다. 이 둘은 함께 냉전 이후 양국이 추진한 가장 큰 방위 계획입니다."
 FRA_RUS_joint_project: "프랑스-러시아 ATOM 계획"
 FRA_RUS_joint_project_desc: "프랑스와 러시아는 ATOM 보병 전투차 프로젝트라는 공동 군사 개발 계획을 출범시켰습니다. 넥스터의 엔지니어들이 러시아 장갑차 설계자들과 짝을 이루어 새로운 보병 전투차 플랫폼을 개발합니다."
 RUS_FRA_joint_project: "프랑스-러시아 ATOM 계획"
 RUS_FRA_joint_project_desc: "러시아와 프랑스는 ATOM 보병 전투차 프로젝트라는 공동 군사 개발 계획을 출범시켰습니다. 러시아 장갑차 설계자들이 넥스터의 엔지니어들과 짝을 이루어 새로운 보병 전투차 플랫폼을 개발합니다."
 FRA_constitutional_crisis_pcf: "혁명의 유혹"
 FRA_constitutional_crisis_pcf_desc: "좌파 연립 내에서 급진파가 영향력을 키우고 있습니다. 이 혁명적 강경파는 민주사회주의가 너무 더디게 움직인다고 믿으며 즉각적이고 전면적인 변혁을 요구합니다. 불복하는 프랑스와 프랑스 공산당(PCF)의 온건파 지도부는 총파업을 혁명의 첫걸음으로 여기는 극단주의자들을 억제하느라 고군분투하고 있습니다."
 FRA_abolish_fifth_republic_pcf: "극단주의자들이 장악하다"
 FRA_abolish_fifth_republic_pcf_desc: "좌파 내 급진파가 온건파 지도부를 앞질렀습니다. 멜랑숑과 PCF 개혁파는 제5공화국의 '부르주아 민주주의'를 전면 거부하는 혁명적 강경파에 의해 밀려났습니다. 그들은 새 헌법을 기초할 제헌의회를 요구하며, 자신들의 의지를 관철할 만큼의 거리 세력을 등에 업고 있습니다."
 FRA_sixth_republic: "제6공화국 선포"
 FRA_sixth_republic_desc: "온건파가 어느 정도 영향력을 되찾아, 혁명을 노골적인 공산주의가 아닌 민주사회주의 제6공화국으로 이끌었습니다. 이 타협안은 공화 제도를 보존하면서 의회 수단을 통해 프랑스 사회를 근본적으로 변혁합니다."
 FRA_french_commune_peaceful: "프랑스 코뮌 수립"
 FRA_french_commune_peaceful_desc: "혁명적 강경파가 완전히 승리했습니다. 1871년 파리 코뮌의 정신에 따라 프랑스는 진정한 노동자 국가가 될 것입니다. 생산 수단은 집단화되고, 노동자 평의회가 모든 수준에서 통치하며, 온건 개혁파는 통제권을 완전히 잃었습니다."
 FRA_republic_safe_pcf: "가장 소중한 자산"
 FRA_republic_safe_pcf_desc: "우리는 급진파 지도자들을 체포하고 그들의 준군사 조직을 해체했습니다. 공화국은 살아남았습니다. 멜랑숑과 온건 개혁파가 좌파의 통제권을 유지합니다. 혁명의 꿈은 끝났고, 더디지만 더 안정적인 민주적 개혁의 길이 그 자리를 대신했습니다."
 FRA_question_republic_fn: "의문스러운 공화국"
 FRA_question_republic_fn_desc: "국민연합 내에서 전통주의 분파가 영향력을 키워 왔습니다. [FRA.GetLeader]와(과) 주류 지도부는 여전히 공화국에 헌신하고 있으나, 악시옹 프랑세즈와 가톨릭 전통주의 운동에서 영감을 받은 이 극단주의자들은 민주주의 자체가 프랑스에 실패했는지를 공공연히 의문시합니다. 너무 늦기 전에 행동해야 합니다."
 FRA_referendum_republic: "강경파가 국민투표를 강요하다"
 FRA_referendum_republic_desc: "전통주의 분파가 르펜의 온건 공화파를 앞질렀습니다. 악시옹 프랑세즈 활동가, 가톨릭 인테그리스트, 향수에 젖은 군주제 지지자들이 당 기구를 장악했습니다. 그들은 공화국의 존립 자체에 대한 국민투표를 요구하며, 주류 지도부는 더 이상 이들을 막을 수 없습니다."
 FRA_restore_kingdom_fn: "왕국 복원"
 FRA_restore_kingdom_fn_desc: "운동 내 군주제 분파가 승리했습니다. 오를레앙파 왕위 계승 주장자 장 도를레앙을 '프랑스인의 왕'으로 추대하든, 정통왕당파 왕위 청구자 루이 드 부르봉을 '프랑스의 왕'으로 추대하든, 정부 연립의 공화 온건파는 전통주의 극단주의자들에 의해 완전히 밀려났습니다."
 FRA_restore_empire_fn: "제국 복원"
 FRA_restore_empire_fn_desc: "보나파르트파가 승리했습니다. 장크리스토프 나폴레옹 보나파르트가 나폴레옹 7세로 즉위할 것입니다. 한때 정부를 이끌던 온건 공화파는 제국의 영광을 꿈꾸는 이들에게 휩쓸려 사라졌습니다. 그들이 꿈꾸는 것은 말다툼하는 의원들이 아닌 황제 아래 하나로 뭉친 강력한 프랑스입니다."
 FRA_republic_safe_fn: "공화국 구하기"
 FRA_republic_safe_fn_desc: "우리는 전통주의 분파 지도자들을 체포하고 그들의 준군사 조직을 해체했습니다. 공화국은 살아남았습니다! 우리 정부와 온건 민족주의자들이 통제권을 유지합니다. 이 위기를 명분 삼아 국가 권력을 강화하는 개혁을 통과시킵니다. 보안 기관의 확대, 극단주의 조직에 대한 더 엄격한 통제, 행정부 권한의 강화가 그것입니다. 제5공화국은 그 어느 때보다 강력하게 존속합니다."
 france_md.370.t: "깨끗한 손을 유지하기"
 france_md.370.d: "우리의 집권은 이미 정치 운동들의 주목을 끈 것으로 보입니다. 오늘 아침 혁명적 공산주의 세포 조직들이 우리에게 접촉해 왔습니다. 그들은 우리의 정치적 반대 세력에 관한 정보를 수집하고 우리에게 해를 끼치지 못하도록 극우 분파 단체를 추적하는 등 우리의 권력 장악을 공고히 하는 데 도움을 주겠다고 제안했습니다. 우리는 이제 개혁과 공화국에 헌신하고 있으므로 그러한 단체와 얽혀서는 안 됩니다. 하지만 이 수단을 갖는 것은 여전히 유용할 것입니다."
 france_md.370.a: "조직화를 허용한다. 우리는 그들의 지지가 필요하다"
 france_md.370.b: "거부한다. 우리는 혁명가가 아닌 민주주의자다"
 france_md.371.t: "그림자 속의 목소리"
 france_md.371.d: "선거에서의 성공과 민족주의 강령을 실행하는 우리의 효율성은 주목을 받지 않을 수 없었습니다. 우리는 다양한 전통주의 분파 단체들로부터 제안을 받았습니다. 악시옹 프랑세즈 동조자, 가톨릭 인테그리스트, 그리고 군주제 복원을 꿈꾸는 이들입니다. 그들은 우리의 성과에 감명받았으며, 공개적으로 조직화하는 것을 허용해 주는 대가로 자신들의 준군사 조직망과 정치적 연줄을 제공하겠다고 합니다. 그들의 진짜 의도는 여전히 베일에 싸여 있습니다."
 france_md.371.a: "조직화를 허용한다. 그들의 지지가 우리를 강하게 한다"
 france_md.371.b: "거부한다. 우리는 공화국의 편에 선다"
 france_md.372.t: "건재한 공화국"
 france_md.372.d: "급진파는 무너졌습니다. 그들의 지도자는 체포되었고, 세포 조직은 해체되었으며, 혁명의 꿈은 짓밟혔습니다. 온건 개혁파가 계속 통제권을 쥐고 있으며, 프랑스는 변모했을지언정 여전히 뚜렷하게 민주적인 공화국으로 남아 있습니다. 극단주의자들은 도박을 했고 패배했습니다."
 france_md.372.a: "개혁주의는 언제나 승리한다"
 france_md.373.t: "공화국 만세!"
 france_md.373.d: "전통주의자들의 쿠데타가 저지되었습니다! DGSI가 신속히 움직였습니다. 악시옹 프랑세즈 지도자들은 구금되었고, 군주제 세포 조직들은 급습을 받았으며, 복고의 꿈은 폐허가 되었습니다. 르펜이 국민에게 연설하는 가운데 시민들은 거리에서 환호합니다. 제5공화국은 굳건히 서 있습니다. 이 위기를 명분 삼아 국가 권위를 강화하고 이러한 위협이 다시는 일어나지 않도록 하는 전면적인 개혁을 통과시킵니다."
 france_md.373.a: "공화국은 그 어느 때보다 강력하게 구원받았다!"
 france_md.374.t: "권력을 두고 싸우는 분파들"
 france_md.374.d: "쿠데타는 성공했습니다. 공화국은 무너졌습니다. 그러나 이제 전통주의 분파들이 서로에게 칼끝을 겨눕니다. 군주제파는 부르봉 혹은 오를레앙 가문의 복위를 요구합니다. 보나파르트파는 나폴레옹 7세 아래의 제국의 영광을 꿈꿉니다. 승리할 수 있는 분파는 하나뿐입니다. 어느 비전이 우세하겠습니까?"
 france_md.374.a: "군주제파가 승리한다. 왕국을 복원하라!"
 france_md.374.b: "보나파르트파가 승리한다. 제국을 복원하라!"
 france_md.340.t: "임박한 봉기"
 france_md.340.d: "급진파가 지나치게 대담해졌습니다. 그들의 준군사 조직이 노출되었고, 당 기구에 대한 침투가 드러났습니다. 그들이 우리 군 최고 사령부에까지 침투하여 쿠데타를 준비하고 있다는 소문마저 돕니다. 우리는 선택해야 합니다. 지금 그들을 단속하여 공화국을 지킬 것인가, 아니면 그들이 하던 일을 계속하게 두고 어디로 이어지는지 지켜볼 것인가. DGSI가 우리의 명령을 기다리고 있습니다."
 france_md.340.a: "단속한다. 급진파 지도자들을 체포하라"
 france_md.340.b: "내버려 둔다. 혁명은 계속되어야 한다"
 france_md.341.t: "권력을 장악한 급진파"
 france_md.341.d: "하룻밤 사이에 벌어진 일이었습니다. 급진파는 정밀하게 움직였습니다. 그들의 준군사 조직이 핵심 건물들을 점령했고, 군 내 침투자들이 중요한 기지를 확보했습니다. [FRA.GetLeader]와(과) 온건 개혁파는 눈을 떠 보니 이름만 아닐 뿐 사실상 죄수가 되어 있었습니다. 혁명적 강경파가 쿠데타를 실행한 것입니다. 제5공화국은 죽었습니다."
 france_md.341.a: "혁명이 시작되었다"
 france_md.345.t: "다시 일어서는 코뮌"
 france_md.345.d: "혁명적 강경파가 완전히 승리했습니다. '부르주아 민주주의'와의 어떠한 타협도 거부한 그들은 1871년의 전통을 잇는 진정한 노동자 국가인 프랑스 코뮌을 선포했습니다. 원래의 연립을 세운 온건 개혁파는 숙청되었거나 달아났습니다. 붉은 깃발이 엘리제궁 위에 휘날리며, 혁명은 이제 막 시작되었을 뿐입니다."
 france_md.345.a: "코뮌 만세! 인터내셔널이 인류가 되리라!"
 france_md.375.t: "싸울 것인가 굴복할 것인가"
 france_md.375.d: "전통주의 분파가 지나치게 자신만만해졌습니다. 그들의 준군사 조직망이 노출되었고, 당 기구에 대한 침투가 드러났습니다. 그들이 우리 군 최고 사령부에까지 침투하여 쿠데타를 준비하고 있다는 소문마저 돕니다. 우리는 선택해야 합니다. 지금 그들을 단속하여 공화국을 지킬 것인가, 아니면 그들이 하던 일을 계속하게 두고 어디로 이어지는지 지켜볼 것인가. DGSI가 우리의 명령을 기다리고 있습니다."
 france_md.375.a: "단속한다. 전통주의 지도자들을 체포하라"
 france_md.375.b: "내버려 둔다. 복고는 계속되어야 한다"
 france_md.376.t: "권력을 장악한 전통주의자들"
 france_md.376.d: "하룻밤 사이에 벌어진 일이었습니다. 전통주의 분파는 정밀하게 움직였습니다. 그들의 준군사 조직이 핵심 건물들을 확보했고, 군 내 동조 세력이 불개입을 보장했습니다. [FRA.GetLeader]와(과) 온건 공화파는 눈을 떠 보니 완전히 밀려나 있었습니다. 극단주의자들이 쿠데타를 실행한 것입니다. 제5공화국은 죽었습니다. 그러나 새로운 프랑스를 누가 통치하겠습니까?"
 france_md.376.a: "이제 분파들이 결정해야 한다"
 france_md.354.t: "왕을 선택하는 군주제파"
 france_md.354.d: "운동 내 군주제 분파는 이제 자신들의 군주를 선택해야 합니다. 두 명의 청구자가 나섰습니다. 파리 백작 장 도를레앙은 오를레앙파를 대표하며 입헌 군주인 '프랑스인의 왕'이 될 것입니다. 앙주 공작 루이 드 부르봉은 루이 14세의 정통왕당파 계보를 대표하며 신권에 의한 '프랑스의 왕'이 될 것입니다. 악시옹 프랑세즈 전통주의자들이 결정해야 합니다."
 france_md.354.a: "장 도를레앙을 프랑스인의 왕으로 추대한다"
 france_md.354.b: "루이 드 부르봉을 프랑스의 왕으로 추대한다"
 france_md.357.t: "보나파르트파의 승리"
 france_md.357.d: "운동 내 보나파르트파가 내부 투쟁에서 승리했습니다. 장크리스토프 나폴레옹 보나파르트가 나폴레옹 7세로 즉위할 것입니다. 군부와 제국의 영광을 꿈꾸는 이들이 군주제파를 이겼습니다. 마린 르펜과 국민연합의 구 공화파 세력은 완전히 밀려났습니다. 프랑스는 다시 한번 제국이 될 것입니다."
 france_md.357.a: "황제 만세! 프랑스 만세!"
 france_md.358.t: "프랑스에서 권력을 장악한 보나파르트파"
 france_md.358.d: "[FRA.GetNameWithFlag]에서 충격적인 소식이 들어왔습니다. 집권당 내 극단주의 분파가 통제권을 장악하고 제5공화국을 폐지했습니다. 급진파가 제정을 복원하면서 온건 지도부는 밀려났습니다. 민주주의에 대한 이 극적인 쿠데타는 세계를 충격에 빠뜨렸습니다. 어떻게 대응해야 합니까?"
 france_md.358.a: "이 극단주의자들의 장악을 규탄한다"
 france_md.358.b: "이것은 프랑스의 내정이다"
 FRA_extremist_paramilitary_left: "혁명 준군사 조직"
 FRA_extremist_paramilitary_left_desc: "우리는 급진파가 준군사 조직망을 공개적으로 조직하도록 허용했습니다. 이 혁명 세포 조직들은 우리에게 거리 세력과 잠재적 반대 의견에 대한 통제력을 제공합니다. 그러나 그 대가는 무엇일까요? 그들의 진정한 충성은 당 지도부가 아니라 혁명에 있습니다."
 FRA_extremist_paramilitary_right: "전통주의 준군사 조직"
 FRA_extremist_paramilitary_right_desc: "우리는 전통주의 분파가 준군사 조직망을 공개적으로 조직하도록 허용했습니다. 이 악시옹 프랑세즈 세포 조직들은 우리에게 거리 세력과 잠재적 반대 의견에 대한 통제력을 제공합니다. 그러나 그 대가는 무엇일까요? 그들의 진정한 충성은 당 지도부가 아니라 복고에 있습니다."
 FRA_radical_infiltration: "급진파의 침투"
 FRA_radical_infiltration_desc: "급진파가 은밀히 당 기구와 군에 침투하고 있습니다. 그들의 혁명 세포 조직이 기관들 전반으로 퍼지며, 때가 오면 필요할 조직망을 구축하고 있습니다. 온건 지도부는 침투가 얼마나 깊은지 여전히 알지 못합니다."
 FRA_traditionalist_infiltration: "전통주의자의 침투"
 FRA_traditionalist_infiltration_desc: "전통주의 분파가 은밀히 당 기구와 군에 침투하고 있습니다. 그들의 군주제 세포 조직이 기관들 전반으로 퍼지며, 때가 오면 필요할 조직망을 구축하고 있습니다. 온건 지도부는 침투가 얼마나 깊은지 여전히 알지 못합니다."
 FRA_republic_stabilized_left: "공화국 안정화"
 FRA_republic_stabilized_left_desc: "급진파의 위협은 무력화되었습니다. DGSI는 극단주의 지도자들을 체포하고 그들의 준군사 조직을 해체했습니다. 프랑스는 여전히 공화국이며, 온건 개혁파가 좌파의 통제권을 유지합니다. 혁명은 일어나지 않겠지만, 우리는 국민이 다른 방식으로 자신을 표현할 수단을 갖도록 할 것입니다."
 FRA_republic_stabilized_right: "강력한 공화국"
 FRA_republic_stabilized_right_desc: "전통주의자의 위협은 분쇄되었으며, 우리는 이 위기를 국가 권력을 강화하는 전면적인 개혁을 통과시키는 데 활용했습니다. DGSI는 이제 확대된 감시 권한을 가지고, 경찰은 극단주의 조직에 대한 새로운 권한을 얻었으며, 행정부 권한은 강화되었습니다. 제5공화국은 더 강력하고, 더 중앙집권적이며, 확고하게 민족주의의 통제 아래에서 존속합니다."
 FRA_general_strike: "혁명적 총파업"
 FRA_general_strike_desc: "좌파 연립 내 급진파가 온건 지도부가 의도한 것 이상으로 노동자들을 총파업에 동원했습니다. CGT는 이를 공화국을 완전히 끝내기 위한 첫걸음으로 여기는 혁명적 강경파에게 장악되었습니다. 당 지도부는 자신들이 시작한 운동에 대한 통제력을 잃었습니다."
 FRA_sixth_republic_idea: "제6공화국"
 FRA_sixth_republic_idea_desc: "더 이상 아무도 제5공화국을 원하지 않았기에, 우리는 이를 민주적으로 끝내고 국민에게 더 가까운 새 공화국을 세웠습니다.\n§g--------------§!\n급진파가 공화국을 끝내면 이 국가 정신은 §R제거§!됩니다.\n- §Y프랑스 공산당§!: §Y$FRA_turn_reform$§!을(를) 완료하고 급진파의 조직화를 허용하십시오. §Y$FRA_radical_infiltration$§!이(가) 만료되면 §Y$FRA_constitutional_crisis_pcf$§!을(를) 완료하고 그들을 내버려 두어 §Y프랑스 코뮌§!을 선포하십시오.\n- §Y국민전선§!: §Y$FRA_focus_insecurity$§!을(를) 완료하고 전통주의자들의 조직화를 허용하십시오. §Y$FRA_traditionalist_infiltration$§!이(가) 만료되면 §Y$FRA_question_republic_fn$§!을(를) 완료하고 그들을 내버려 두어 §Y왕국§! 또는 §Y제국§!을 복원하십시오."
 FRA_commune_reborn_idea: "프랑스 코뮌"
 FRA_commune_reborn_idea_desc: "혁명적 강경파가 완전히 승리했습니다. 한때 좌파를 이끌던 온건 개혁파는 프랑스가 노동자 국가로 변모하는 가운데 숙청되었습니다. 1871년의 정신에 따라 이제 노동자 평의회가 통치하고 생산 수단은 집단화되었습니다. 삼색기가 휘날리던 곳에 붉은 깃발이 휘날립니다."
 FRA_kingdom_restored_idea: "왕국 복원"
 FRA_kingdom_restored_idea_desc: "민족주의 운동 내 전통주의 극단주의자들이 꿈을 이루었습니다. 프랑스에 다시 왕이 생긴 것입니다. 국민연합의 온건 공화파는 악시옹 프랑세즈가 환호하고 삼색기가 백합 문장으로 대체되는 모습을 믿기지 않는 눈으로 지켜봅니다."
 FRA_exploitation: "본국을 위해 피를 흘리다"
 FRA_exploitation_desc: "우리의 공장, 무역, 세금은 먼저 파리로 흘러가고 우리 국민은 그다음입니다. 부두를 떠나는 모든 선적물은 우리 안에 약간 더 많은 분노를, 제국과의 약간 더 먼 거리를 사 줄 뿐입니다."
 FRA_empire_restored_idea: "제국 복원"
 FRA_empire_restored_idea_desc: "운동 내 보나파르트파가 나폴레옹 7세 아래에서 프랑스 제국을 복원했습니다. 국민연합을 세운 온건 공화파는 제국의 영광을 꿈꾸는 이들에게 휩쓸려 사라졌습니다. 프랑스는 다시 한번 황제가 통치하며, 군부-전통주의 동맹은 완전한 승리를 자축합니다."
 FRA_investing_eu: "EU 국가에 투자"
 FRA_investing_eu_desc: "우리는 현재 다른 EU 국가가 성장하도록 돕고 있습니다"
 FRA_election_result: "결과"
 FRA_election_result_desc: "대통령 선거는 끝났거나 곧 끝납니다. 당분간 투표 성향은 바뀔 가능성이 낮습니다."
 FRA_spy_napoleon_lar: "보나파르트파 비밀 정보국"
 FRA_spy_napoleon_lar_desc: "적들 사이에 불화의 씨앗을 뿌리도록 훈련받은 신세대 비밀 요원들로, 재정복이 속도를 내는 가운데 육군, 해군, 공군 참모부에 실시간 정보를 제공합니다."
 FRA_spy_napoleon_non_lar: "보나파르트파 비밀 정보국"
 FRA_spy_napoleon_non_lar_desc: "적들 사이에 불화의 씨앗을 뿌리도록 훈련받은 신세대 비밀 요원들로, 왕좌를 노리는 다음 음모에 대비해 우리의 병영과 부처를 감시합니다."
 FRA_5th_republic: "제5공화국"
 FRA_5th_republic_desc: "1958년부터 시행되어 온 현재의 프랑스 정치 체제입니다. 드골 장군 아래 수립되어 그의 필요에 맞게 만들어진 공화국입니다. 안정적인 체제이지만, 전능한 대통령이 있는 점점 균형을 잃어 가는 나라에서 그 한계를 드러내기 시작하고 있습니다.\n§g--------------§!\n§Y불복하는 프랑스§!가 §Y$FRA_dawn_6th_rep$§! 중점을 완료하고 국민투표에서 승리하면 이 국가 정신은 §R제거§!되고 §Y제6공화국§!으로 대체됩니다. §Y불복하는 프랑스§!를 집권시키려면 §Y사회당§!을 선출하고 §Y$FRA_cut_with_unions$§! 중점을 완료하십시오.\n\n급진파가 공화국을 끝내는 경우에도 §R제거§!됩니다.\n- §Y프랑스 공산당§!: §Y$FRA_turn_reform$§!을(를) 완료하고 급진파의 조직화를 허용하십시오. §Y$FRA_radical_infiltration$§!이(가) 만료되면 §Y$FRA_constitutional_crisis_pcf$§!을(를) 완료하고 그들을 내버려 두어 §Y프랑스 코뮌§!을 선포하십시오.\n- §Y국민전선§!: §Y$FRA_focus_insecurity$§!을(를) 완료하고 전통주의자들의 조직화를 허용하십시오. §Y$FRA_traditionalist_infiltration$§!이(가) 만료되면 §Y$FRA_question_republic_fn$§!을(를) 완료하고 그들을 내버려 두어 §Y왕국§! 또는 §Y제국§!을 복원하십시오."
 FRA_war_against_republic: "공화주의와의 전쟁"
 FRA_war_against_republic_desc: "프랑스 왕정은 절대주의 아래에서 가장 강력했습니다. 그 이후 우리나라는 수십 년간 공화국을 겪었고, 그것들은 하나같이 앞선 것보다 불안정했습니다. 공화주의와 민주주의 가치는 우리나라에 위험하며 암처럼 전 세계로 퍼지고 있습니다. 우리는 이를 끝장내야 합니다."
 FRA_EU_strong: "EU와 함께하는 힘"
 FRA_EU_strong_desc: "유럽 연합의 기둥이 되는 것은 큰 책임이지만 또한 큰 힘이기도 합니다. 우리가 좋든 싫든 우리의 운명은 유럽 연합의 운명과 얽혀 있습니다."
 FRA_NOTRe_law: "NOTRe 법"
 FRA_NOTRe_law_desc: "프랑스에서는 지방 분권이 제대로 시행되지 않아 수많은 법적 허점과 모순을 남겼습니다. 공화국 영토의 새로운 조직에 관한 법(NOTRe)은 이러한 결함을 바로잡고 우리 영토의 조직과 계획을 단순화할 수 있게 해 줄 것입니다."
 FRA_military_indus_boost: "방위 산업에 투자"
 FRA_military_indus_boost_desc: "국제적 긴장이 고조되고 있는 만큼, 있을 수 있는 분쟁에 대비하는 데 비용을 아껴서는 안 됩니다."
 FRA_civilian_jobs_boost: "일자리 창출에 집중"
 FRA_civilian_jobs_boost_desc: "국민에게 다양한 일자리 기회를 제공하기 위해 노동 시장에 더 많은 투자를 해야 합니다."
 FRA_internal_investment_boost: "내부 투자에 집중"
 FRA_internal_investment_boost_desc: "민간 부문에 보조금을 제공함으로써 더 많은 일자리를 창출하도록 장려할 수 있을 것입니다."
 FRA_direct_construction_boost: "공공사업에 투자"
 FRA_direct_construction_boost_desc: "시장이 제대로 작동하지 않는 만큼, 우리의 노동력을 활용해 내일의 경제를 건설해야 합니다."
 FRA_indusfarm_boost: "농업 보조금 지급"
 FRA_indusfarm_boost_desc: "수단을 가리지 않고 생산을 늘려, 농업 부문이 유럽 시장을 되찾도록 도와야 합니다."
 FRA_civilian_infra_boost: "기반시설에 투자"
 FRA_civilian_infra_boost_desc: "본토 외 지역에도 투자하여 그곳 사람들이 본토 지역과 같은 서비스를 이용할 수 있도록 해야 합니다."
 FRA_indusbuild_services_boost: "서비스 산업에 투자"
 FRA_indusbuild_services_boost_desc: "우리는 경쟁력 없고 오염을 일으키는 산업에서 벗어난 내일의 경제를 건설하고 있습니다."
 FRA_techno_boost: "교육 투자"
 FRA_techno_boost_desc: "우리에게 필요한 것은 모두가 가장 앞선 학업을 추구할 수 있게 하는 것입니다."
 FRA_res_health_boost: "공공 서비스에 집중"
 FRA_res_health_boost_desc: "너무 오랫동안 극단적 자유주의 정책의 표적이 되어 온 서비스 제공 체계를 재건해야 합니다."
 FRA_local_consumption_boost: "식량 공급 재국내화 지원"
 FRA_local_consumption_boost_desc: "우리의 식탁은 지구 반대편에서 온 식품으로 채워지는 동안 프랑스 농장은 문을 닫고 있습니다. 들판과 접시 사이의 유통 사슬을 줄이면 그 가치를 나라 안에 지킬 수 있습니다."
 FRA_job_planned_boost: "산업에 투자"
 FRA_job_planned_boost_desc: "우리 기업들이 더 많은 일자리를 창출하고 해고를 하지 않도록 도와야 합니다. 이를 통해 실업을 끝내고 고용 안정성을 높일 수 있을 것입니다."
 FRA_ps_EUtrain: "프랑스 훈련 임무"
 FRA_ps_EUtrain_desc: "프랑스 정부가 다른 유럽 연합 국가들과 함께하는 합동 군사 훈련에 참가하도록 우리를 초청했습니다."
 FRA_PCF_EUtrain: "동방 확전 대비"
 FRA_PCF_EUtrain_desc: "러시아의 잠재적 침략에 직면하여, 우리는 전장에서 이에 맞설 준비를 해야 합니다."
 FRA_EU_LEAVE: "경제 재건"
 FRA_EU_LEAVE_desc: "우리 경제는 유럽 연합과 너무 긴밀히 통합되어 있었으며, 그로부터 떨어져 나오는 일은 광범위한 파급 효과를 가져왔습니다. 우리는 경제를 더욱 강하고 더욱 자립적으로 재건할 것입니다."
 FRA_patriotic_fervor: "애국적 열정"
 FRA_patriotic_fervor_desc: "제국 재정복은 이제 막 시작되었을 뿐입니다."
 FRA_learning_from_worforce: "사회 통합"
 FRA_learning_from_worforce_desc: "우리는 형제 국가의 지식과 노동력을 통합하는 과정에 있습니다."
 FRA_attack_UK_king: "라 루아얄"
 FRA_attack_UK_king_desc: "프랑스의 옛 적국인 영국에 우리의 관심이 쏠려 있을 수도 있습니다. 그러나 어느 쪽이든 우리는 조만간 해양 강국과 싸워야 할 것입니다. 따라서 프랑스 해군은 해상에서 싸울 준비가 되어 있어야 합니다."
 FRA_french_papacy: "통제 하의 교황청"
 FRA_french_papacy_desc: "우리는 가톨릭 교회의 본부를 프랑스에 유치하기로 결정했습니다. 그리하여 우리는 이를 보호할 수 있는 위치에 서게 되고, 다른 기독교 국가들의 눈에 더 큰 정당성을 누릴 수 있게 됩니다."
 FRA_gaullist_foreign_policy: "드골주의 외교 정책"
 FRA_gaullist_foreign_policy_desc: "드골 장군의 구상에 따라 프랑스는 두 초강대국 모두로부터 전략적 독립을 추구하는 정책을 펼칩니다. 우리는 미국의 패권과 거리를 두는 한편 러시아 및 중국과는 실용적으로 교류합니다. 프랑스는 워싱턴의 속국이 아니라 그 자체로 강대국이어야 합니다."
 FRA_anti_american_stance: "반미 노선"
 FRA_anti_american_stance_desc: "프랑스 정부는 미국에 대해 공공연히 적대적인 태도를 취했습니다. 미국의 군사 작전은 프랑스의 지지를 받지 못할 것이며, 외교 관계는 크게 냉각되었습니다. 프랑스는 대서양의 구속에서 벗어나 자신만의 길을 갑니다."
 FRA_fn_russia_alignment_idea: "국민연합-러시아 연대"
 FRA_fn_russia_alignment_idea_desc: "국민연합 정부는 역사적 연관성과 미국식 자유주의에 대한 공통된 반대를 반영하여 러시아와의 긴밀한 관계를 키워 왔습니다. 마린 르펜이 푸틴의 '전통적 가치'를 찬양한 것은 여러 사안에서 구체적인 정책 연대로 이어졌습니다."
 FRA_fn_protectionism: "경제적 애국주의"
 FRA_fn_protectionism_desc: "관세와 공공 조달은 이제 값싼 수입품보다 프랑스 생산자에게 유리하며, 우리 공장은 수년 만에 가장 활발하게 돌아가고 있습니다. 우리의 무역 상대국들은 이를 알아차렸고, 고마워하지 않습니다."
 FRA_fn_nationalist_policy: "국민 우선"
 FRA_fn_nationalist_policy_desc: "우리의 핵심 조치 중 하나는 국민 우선입니다. 프랑스적이지 않은 모든 것을 뒷전으로 밀어내는 것입니다."
 FRA_communist_foreign_policy: "공산주의 외교 정책"
 FRA_communist_foreign_policy_desc: "공산당은 프랑스 외교 정책의 급진적 재편을 시행했습니다. 미국과의 동맹은 불가능하며, 프랑스는 대신 전 세계 사회주의 국가들과의 연대를 추구합니다. 나토 가입은 우리 이념과 근본적으로 양립할 수 없습니다."
 FRA_lfi_non_aligned_policy: "비동맹 프랑스"
 FRA_lfi_non_aligned_policy_desc: "불복하는 프랑스는 미국의 패권과 러시아의 권위주의를 모두 배격하는 비동맹 정책을 시행했습니다. 프랑스는 미국의 군사적 모험에 참여하지 않으며, 새로운 비동맹 운동의 주도권을 모색하는 한편 나토 지휘 구조로부터 독립성을 유지합니다."
 FRA_lfi_anti_nato: "반나토 정책"
 FRA_lfi_anti_nato_desc: "우리는 나토에서 성공적으로 탈퇴했습니다. 더 이상 미국 제국주의의 행태를 용납할 수 없었습니다. 현재의 입장은 우리에게 외교 정책에 대한 더 큰 통제권을 부여합니다."
 FRA_worker_internationalism: "국제주의의 등대"
 FRA_worker_internationalism_desc: "프랑스에서 공산주의는 성공을 거두었으며, 이는 사실입니다. 이 성공은 우리에게 만족한 노동력을 주고, 전 세계의 노동자들을 끌어들일 수 있게 해 줍니다."
 FRA_lfi_social_europe: "유럽 공공 서비스 개혁"
 FRA_lfi_social_europe_desc: "LFI의 프랑스는 유럽 연합을 위한 새로운 사회 의제를 제시하는 데 성공했습니다. 이는 이 뿌리 깊은 신자유주의 기구에 맞선 큰 승리입니다."
 FRA_strategic_independance: "전략적 독립"
 FRA_strategic_independance_desc: "프랑스는 독자적인 핵 억지력을 유지하고 어떤 외세에도 종속되기를 거부하며 완전한 전략적 자율성을 추구하기로 약속했습니다. 미군 기지는 프랑스 땅에서 환영받지 못하며, 프랑스는 군사 개입에 관해 스스로 결정할 것입니다."
 FRA_global_south_solidarity: "글로벌 사우스 연대"
 FRA_global_south_solidarity_desc: "식민주의가 글로벌 사우스 국가들의 발전에 상당한 영향을 미쳤음은 부정할 수 없습니다. 이들이 이를 극복하도록 돕는 것은 올바른 일이 될 것입니다."
 FRA_sovereigntist_eu_policy: "주권주의 EU 정책"
 FRA_sovereigntist_eu_policy_desc: "프랑스는 브뤼셀의 기술관료에 맞서 국가 주권을 수호하며 EU의 추가 연방화를 저지합니다. EU에 남아 있으면서도 우리는 주권 이양을 거부하고 유럽 초국가의 창설에 반대합니다. 프랑스는 하나의 속주가 되지 않을 것입니다."
 FRA_distance_nato: "나토와의 거리 두기"
 FRA_distance_nato_desc: "1966년 드골의 선례를 따라, 프랑스는 조약 회원국으로 남으면서도 나토의 통합 지휘 구조와는 거리를 둡니다. 미군은 프랑스 땅에 주둔하지 않으며, 프랑스는 독자적인 군사 행동을 취할 권리를 보유합니다."
 FRA_left_nato: "나토 탈퇴"
 FRA_left_nato_desc: "프랑스는 북대서양 조약 기구에서 완전히 탈퇴했습니다. 더 이상 제5조에 구속받지 않는 프랑스는 미국의 패권을 단호히 배격하며 군사 문제에서 진정으로 독립적인 길을 갑니다."
 FRA_political_balance: "여론 동향"
 FRA_political_balance_desc: "우리의 제도는 안정을 보장하도록 설계되었지만, 정치적 균형은 이토록 불안정했던 적이 없습니다. 정당들은 흥하고 망합니다. 당신이 누구이든, 여론에 대한 우리의 장악력을 굳건히 해야 합니다."
 FRA_econ_policy: "프랑스 경제 현황"
 FRA_econ_policy_desc: "프랑스 경제는 새천년이 열릴 무렵 산업 강국에서 구조 조정 중인 경제로 전환하는 서방 경제의 좋은 사례입니다. 당신의 개혁이 그 향후 방향에 어떤 영향을 미칠지 지켜보게 될 것입니다."
 FRA_social_balance: "프랑스 사회 정책"
 FRA_social_balance_desc: "프랑스는 모든 수준에서 사회 정책에 막대한 투자를 하는 나라입니다. 그러나 대부분의 정당은 이 정책에 불만을 가지고 있습니다. 모두가 그것이 어떻게 바뀌어야 하는지에 대해 저마다의 견해를 가지고 있습니다. 당신의 결정이 이에 어떤 영향을 미칠지 지켜보게 될 것입니다."
 FRA_6th_rep: "제6공화국의 개혁"
 FRA_6th_rep_desc: "불복하는 프랑스는 제5공화국을 개혁하는 데 성공했습니다. 그러나 제도를 넘어, 이 개혁은 프랑스 사회와 프랑스 경제에 광범위한 영향을 미칠 것입니다."
 FRA_Commies_agenda: "프랑스 코뮌의 정책"
 FRA_Commies_agenda_desc: "프랑스 코뮌은 과거와 완전히 단절하기로 결정했으며, 사회를 처음부터 다시 세우기로 결의했습니다."
 FRA_Bonapartist_agenda: "제국 사회"
 FRA_Bonapartist_agenda_desc: "새 황제는 다가올 분쟁에 맞서 프랑스 사회를 더 위대하고 더 강하게 만들기 위해 개혁하기로 결정했습니다."
 FRA_Royalist_agenda: "새로운 프랑크 사회"
 FRA_Royalist_agenda_desc: "저주받은 혁명이 만들어 낸 모든 악마적 발명품을 끝장내야 합니다. 우리는 프랑크 사회를 견고한 토대 위에 재건할 것입니다."
 FRA_World_revolution: "세계 혁명"
 FRA_World_revolution_desc: "우리가 민중을 자본주의로부터 해방시킴에 따라, 지식과 희망을 함께 가져오는 민중들이 우리와 합류하고 있습니다. 머지않아 인터내셔널은 전 인류가 될 것입니다."
 FRA_arab_solidarity_tt: "아랍 및 무슬림 다수 국가와의 관계 개선"
 FRA_blocks_eu_federalization_tt: "프랑스는 주권주의 정책으로 인해 EU 연방화를 저지함"
 FRA_cannot_ally_usa_hard_tt: "미국과 동맹을 맺을 수 없음"
 FRA_cannot_host_american_bases_tt: "미군 기지를 유치할 수 없음"
 FRA_cannot_join_american_coalitions_tt: "미국 주도의 군사 연합에 참여할 수 없음"
 FRA_debt_forgiveness_tt: "글로벌 사우스에 대한 부채 탕감과 개발 협력을 지지함"
 FRA_demands_eu_social_reform_tt: "유럽 연합 기구들의 사회 개혁을 요구함"
 FRA_immigration_restrictions_tt: "프랑스로의 이민이 엄격히 제한됨"
 FRA_improved_russia_relations_tt: "러시아와의 관계 개선"
 FRA_israel_relations_penalty_tt: "이스라엘과의 관계 악화"
 FRA_left_nato_command_tt: "프랑스는 나토 통합 지휘 구조에서 탈퇴했음"
 FRA_non_aligned_policy_tt: "프랑스는 비동맹 정책을 추구함"
 FRA_opposes_nato_expansion_tt: "나토의 추가 확대에 반대함"
 FRA_socialist_solidarity_tt: "사회주의 및 공산주의 국가와의 관계 개선"
 FRA_trade_protectionism_tt: "국내 산업이 외국과의 경쟁으로부터 보호됨"
 FRA_usa_relations_penalty_tt: "미국과의 관계 악화"
 FRA_worker_solidarity_tt: "국제 노동자 연대를 통해 전 세계의 노동자를 끌어들임"
 france_md.800.t: "미국에 등을 돌리는 프랑스"
 france_md.800.d: "새 프랑스 정부는 공공연히 반미 노선을 채택하여 워싱턴과의 협력을 거부하고 미국의 외교 정책을 신랄하게 비판했습니다. 이는 대서양 관계의 극적인 전환을 의미합니다. 미국은 파리의 이 적대적 전환에 어떻게 대응해야 합니까?"
 france_md.800.a: "이 적대적 정책을 규탄한다"
 france_md.800.b: "외교적 접근을 시도한다"
 france_md.801.t: "미국의 외교적 접근"
 france_md.801.d: "우리의 반미 노선에도 불구하고, 워싱턴은 어느 정도의 협력을 유지하려는 외교적 타진을 해 왔습니다. 국무부는 제한적인 교류를 대가로 우리의 수사를 눈감아 줄 의향이 있어 보입니다. 이러한 미국의 노력에 어떻게 대응해야 합니까?"
 france_md.801.a: "미국의 접근을 전면 거부한다"
 france_md.801.b: "제한적 협력을 고려한다"
 france_md.802.t: "러시아로 기우는 프랑스"
 france_md.802.d: "새 프랑스 정부는 워싱턴과 거리를 두는 한편 모스크바와의 긴밀한 관계를 모색하며 외교 정책의 극적인 전환을 시사했습니다. 이는 서유럽에서 러시아의 영향력을 확대할 기회입니다. 이 프랑스의 재편에 어떻게 대응해야 합니까?"
 france_md.802.a: "프랑스와의 관계를 강화한다"
 france_md.802.b: "신중하게 진행한다"
 france_md.803.t: "공산주의 외교 정책의 결과"
 france_md.803.d: "우리의 공산주의 외교 정책은 전통적인 서방 동맹국들로부터 우리를 고립시켰으나 전 세계 사회주의 및 반제국주의 운동에는 문을 열어 주었습니다. 쿠바, 베네수엘라 등 좌파 정부들은 우리의 새로운 방향을 환영합니다. 그러나 이는 나토 동맹국 및 전통적 파트너들과의 관계에 부담으로 작용합니다."
 france_md.803.a: "사회주의 연대를 받아들인다"
 france_md.803.b: "접근 방식을 완화한다"
 france_md.804.t: "나토와 거리를 두는 프랑스"
 france_md.804.d: "[FRA.GetNameWithFlag]이(가) 1966년 드골의 통합 지휘 구조 탈퇴를 연상시키는 나토와의 거리 두기 정책을 발표했습니다. 프랑스 정부는 '전략적 독립'을 강조하고 미국의 군사 지휘에 대한 종속을 거부했습니다. 이 사태를 어떻게 바라보아야 합니까?"
 france_md.804.a: "동맹의 결속력에 대한 우려를 표명한다"
 france_md.804.b: "프랑스의 정책에 중립을 유지한다"
 france_md.805.t: "팔레스타인 승인"
 france_md.805.d: "우리의 극좌 외교 정책은 팔레스타인 국가를 승인하고 두 국가 해법을 지지할 것을 약속합니다. 이는 아랍 국가들과의 관계를 개선하고 우리의 반제국주의 원칙에 부합하지만, 이스라엘 및 잠재적으로 미국과의 관계를 해칠 것입니다. 공식 승인을 진행해야 합니까?"
 france_md.805.a: "팔레스타인을 즉시 승인한다"
 france_md.805.b: "승인을 당분간 미룬다"
 france_md.806.t: "팔레스타인을 승인한 프랑스"
 france_md.806.d: "프랑스 정부는 팔레스타인 국가를 공식 승인하여 파리 외교 정책의 중대한 전환을 알렸습니다. 이 결정은 프랑스를 많은 유럽 국가와 같은 편에 서게 하지만 이전의 신중한 접근에서 벗어났음을 의미합니다. 이스라엘은 이 외교적 사태에 어떻게 대응해야 합니까?"
 france_md.806.a: "프랑스의 승인을 강력히 규탄한다"
 france_md.806.b: "절제된 대응을 내놓는다"
 france_md.807.t: "우크라이나 전쟁의 딜레마"
 france_md.807.d: "러시아의 우크라이나 침공은 우리의 친러시아 외교 정책에 위기를 안겨 줍니다. 러시아 전차가 주권을 가진 유럽 국가로 밀고 들어가는 지금, 모스크바와의 기존 연대는 몹시 곤란한 것이 되었습니다. 중립을 유지하는 정치적 비용은 막대하지만, 러시아를 규탄하는 것은 완전한 방향 전환이 될 것입니다. 프랑스는 어떤 입장을 취해야 합니까?"
 france_md.807.a: "러시아의 침략을 규탄한다"
 france_md.807.b: "중립을 유지한다"
 france_md.807.c: "러시아의 입장을 지지한다"
 france_md.808.t: "프랑스의 주권주의 정책"
 france_md.808.d: "[FRA.GetNameWithFlag]이(가) 유럽 연합 내에서 강한 주권주의 노선을 채택하여 추가 통합을 가로막고 브뤼셀로의 주권 이양을 거부하고 있습니다. 프랑스 정부는 연방 초국가가 아닌 '국민 국가들의 유럽'을 주장합니다. 이 프랑스의 방해 행위에 어떻게 대응해야 합니까?"
 france_md.808.a: "프랑스의 방해 행위에 맞선다"
 france_md.808.b: "주권에 대한 우려에 공감한다"
 france_md.809.t: "비동맹 운동 구상"
 france_md.809.d: "우리의 비동맹 외교 정책은 미국과 러시아의 세력권 모두에 대한 대안을 찾는 다른 국가들의 관심을 끌었습니다. 우리는 인도, 브라질 등 기존 블록 밖의 주요 강국들과 협력하며 프랑스를 새로운 비동맹 운동의 지도국으로 자리매김할 기회를 얻었습니다."
 france_md.809.a: "비동맹 운동의 주도권을 추구한다"
 france_md.809.b: "국내 우선 과제에 집중한다"
 france_md.810.t: "프랑스의 전략적 독립"
 france_md.810.d: "[FRA.GetNameWithFlag]이(가) 어떤 외세에도 종속되기를 거부하고 프랑스 핵 억지력의 역할을 강조하는 완전한 전략적 독립 정책을 발표했습니다. 이는 유럽 협력의 기초가 되어 온 프랑스-독일 파트너십에 영향을 미칠 수 있습니다. 독일은 어떻게 대응해야 합니까?"
 france_md.810.a: "양국 관계에 대한 우려를 표명한다"
 france_md.810.b: "프랑스의 주권을 존중한다"
 france_md.811.t: "다극화를 받아들이는 프랑스"
 france_md.811.d: "프랑스 정부는 미국의 패권을 배격하고 신흥 강국들과의 긴밀한 관계를 모색하며 다극 세계 질서에 대한 지지를 선언했습니다. 이는 중국이 유럽에서 영향력을 확대할 기회입니다. 베이징은 프랑스의 이 개방에 어떻게 대응해야 합니까?"
 france_md.811.a: "프랑스와의 관계를 강화한다"
 france_md.811.b: "신중한 교류를 유지한다"
 france_md.812.t: "나토를 탈퇴하는 프랑스"
 france_md.812.d: "우리는 북대서양 조약 기구에서 공식 탈퇴하여 미국의 패권과의 단절을 완료했습니다. 이제 프랑스는 제5조에 구속받지도, 미국의 군사 지휘를 받지도 않은 채 홀로 서 있습니다. 이 결정은 새로운 가능성과 실질적 위험을 동시에 열어 줍니다. 프랑스는 어떤 길을 추구해야 합니까?"
 france_md.812.a: "완전한 전략적 독립을 받아들인다"
 france_md.812.b: "새로운 동맹을 모색한다"
 FRA_extremist_foreign_policy_category: "극단주의 외교 정책"
 FRA_extremist_foreign_policy_category_desc: "극단주의 또는 드골주의 통치 아래 프랑스가 취할 수 있는 외교 및 대외 정책 행동입니다."
 FRA_rejoin_nato_command: "나토 통합 지휘 구조 재가입"
 FRA_rejoin_nato_command_desc: "나토와 거리를 둔 후, 우리는 통합 군사 지휘 구조에 다시 가입하기로 선택할 수 있습니다. 이는 동맹 내 우리의 입지를 회복시키고 미국 및 유럽 동맹국과의 관계를 개선할 것입니다."
 FRA_seek_russian_partnership: "러시아와의 파트너십 모색"
 FRA_seek_russian_partnership_desc: "우리의 독자적 외교 정책은 모스크바와의 관계를 강화할 기회를 만들어 줍니다. 러시아와 더 긴밀한 외교 및 경제 관계를 추구할 수 있으나, 이는 워싱턴과의 관계를 더욱 긴장시킬 것입니다."
 FRA_recognize_palestine: "팔레스타인 승인"
 FRA_recognize_palestine_desc: "우리의 반제국주의 외교 정책은 팔레스타인 국가를 승인하고 팔레스타인 민족의 자결권을 지지할 것을 요구합니다. 이는 아랍 국가들과의 관계를 개선하겠지만 이스라엘과의 관계를 해칠 것입니다."
 FRA_condemn_russia_ukraine: "러시아의 침략 규탄"
 FRA_condemn_russia_ukraine_desc: "러시아의 우크라이나 침공으로 인해 우리의 친러시아 입장은 정치적으로 유지할 수 없게 되었습니다. 우리는 침략을 규탄하고 모스크바와 거리를 두는 쪽을 선택할 수 있으나, 이는 중대한 정책 전환을 의미합니다."
 FRA_non_aligned_initiative: "비동맹 주도권 구상"
 FRA_non_aligned_initiative_desc: "우리의 비동맹 외교 정책은 프랑스를 미국의 패권과 러시아의 영향력 모두에 대한 대안을 찾는 국가들의 새로운 운동을 이끌 위치에 놓습니다. 인도, 브라질 등 기존 블록 밖의 주요 강국들과 관계를 강화할 수 있습니다."
 FRA_socialist_solidarity: "사회주의 연대"
 FRA_socialist_solidarity_desc: "우리의 공산주의 외교 정책은 전 세계 사회주의 국가들과의 연대를 요구합니다. 쿠바, 베네수엘라 등 좌파 정부들과의 관계를 강화하여 반자본주의 협력의 국제 네트워크를 구축할 수 있습니다."
 FRA_veto_eu_federalization: "EU 연방화 거부권 행사"
 FRA_veto_eu_federalization_desc: "EU 내 주권 국가로서 우리는 거부권을 행사해 추가적인 연방화와 브뤼셀로의 주권 이양을 막을 수 있습니다. 이는 프랑스의 독립을 지키지만 통합을 지지하는 회원국들과의 관계를 긴장시킵니다."
 FRA_immigration_wave: "이민 물결 활용"
 FRA_immigration_wave_desc: "프랑스의 현재 자유로운 이민 정책은 상당한 이민자 유입을 낳았습니다. 일부는 이를 인도주의적 필요 혹은 경제적 기회로 보는 반면, 다른 이들은 커져 가는 우려 속에 바라봅니다. 국민연합은 이러한 정서를 활용해 프랑스의 정체성과 안보의 수호자로 자신을 내세울 수 있습니다. 국경이 열려 있을수록 우리가 끌어낼 수 있는 반발도 커집니다."
 FRA_high_immigration_tooltip: "프랑스는 §Y국경 개방§! 또는 §Y약간 규제된 이민§! 법을 시행 중이어야 합니다"
 FRA_immigration_backlash: "이민 반발"
 FRA_immigration_backlash_desc: "반이민 정서의 물결이 프랑스 사회를 휩쓸고 있습니다. 이민, 안보, 국가 정체성에 관한 국민연합의 메시지는 인구의 점점 더 많은 부분에서 공감을 얻고 있으며, 정치 지형을 우경화시키고 현상 유지에 대한 지지를 약화시키고 있습니다."
 FRA_end_extraction: "자원 채굴 제한"
 FRA_end_extraction_desc: "환경에 대한 우리의 비전을 추구하기 위해, 우리는 프랑스 본토 전역의 광업, 석유 채굴, 중공업 활동에 엄격한 규제를 시행할 것입니다. 이는 국내 자원 생산을 약 3분의 1 줄이겠지만 환경 보호를 위한 필수적인 조치입니다. 여건이 바뀌면 향후 정부가 이 정책을 되돌릴 수도 있습니다."
 FRA_green_extraction_ban: "환경 채굴 제한"
 FRA_green_extraction_ban_desc: "프랑스는 자원 채굴에 대한 포괄적인 환경 제한을 시행했습니다. 광업은 엄격한 제한에 직면하고, 석유 시추는 강하게 규제되며, 산업 채굴은 까다로운 환경 기준을 충족해야 합니다. 이로 인해 국내 자원 가용량은 약 3분의 1 감소했으나, 오염 감소는 눈에 띄는 건강 개선으로 이어졌습니다. 과거 산업 지역의 암 발병률이 크게 떨어졌고 의료 비용은 줄어들고 있습니다."
 FRA_environmental_policy_decisions: "환경 정책"
 FRA_environmental_policy_decisions_desc: "프랑스의 환경 정책과 자원 채굴 규제에 관련된 결정입니다."
 FRA_reverse_extraction_ban: "광업법 제한 폐지"
 FRA_reverse_extraction_ban_desc: "새로 쓰인 광업법은 우리의 채굴 산업을 채산이 맞지 않게 만들어 폐업 지경에 이르게 했고 정유소를 수입에 의존하게 만들었습니다. 이를 폐지하면 국내 생산이 회복되지만, 이를 입안한 녹색당 및 환경 단체들과는 결별하게 됩니다."
 france_md.960.t: "광업법을 새로 쓰는 프랑스"
 france_md.960.d: "[FRA.GetNameWithFlag]이(가) 광업법을 새로 써서 탄화수소 허가를 폐지하고 프랑스 본토 전역의 채굴량에 상한을 두었습니다. 프랑스 국내 생산의 약 3분의 1이 이와 함께 사라집니다. 환경 단체들은 환호하고 있으며, 산업 연합들은 벌써 브뤼셀에서 선례의 위험성을 경고하고 있습니다."
 france_md.960.a: "따를 만한 선례다"
 france_md.960.b: "유럽 산업이 이 대가를 치를 것이다"
 france_md.900.t: "예산 장관의 숨겨진 계좌"
 france_md.900.d: "베르시에서 탈세 단속 운동을 이끄는 우리 예산 장관은 국민의회에서 해외 계좌 보유를 부인했습니다. 한 탐사 보도 매체가 이제 그 흔적을 공개했습니다. 먼저 제네바, 그다음 싱가포르입니다. 부인 발언은 기록에 남아 있으며, 그것은 거짓말이었습니다."
 france_md.900.a: "장관을 해임하고 사건을 검찰에 넘긴다"
 france_md.900.b: "조용한 사임을 받아들인다"
 france_md.900.c: "장관을 옹호한다"
 france_md.901.t: "공직 투명성 기구"
 france_md.901.d: "이번 스캔들로 인해 재산 신고는 피할 수 없게 되었습니다. 우리는 모든 장관, 하원의원, 상원의원이 자신의 이해관계와 재산을 신고하도록 의무화하고 의심스러운 사례를 검찰에 회부할 권한을 가진 독립적인 공직 투명성 기구를 설립할 수 있습니다. 국민의회는 그 모든 조항을 못마땅해할 것입니다."
 france_md.901.a: "투명성 기구를 설립한다"
 france_md.901.b: "행동 강령을 공표하고 넘어간다"
 france_md.902.t: "후보의 허위 의회 보좌관"
 france_md.902.d: "《르 카나르 앙셰네》가 급여 명세서를 폭로했습니다. 유력한 대통령 후보가 사무실의 누구도 증언할 수 없는 업무를 이유로 가족 구성원을 의회 급여 명단에 올렸습니다. 국가재정검찰청은 같은 날 아침 예비 조사에 착수했습니다. 후보는 이를 제도권의 음모라 부르며 물러나기를 거부하고 있습니다."
 france_md.902.a: "후보를 경선에서 사퇴시킨다"
 france_md.902.b: "그럼에도 선거운동을 계속한다"
 france_md.902.c: "판사와 언론을 탓한다"
 france_md.903.t: "피고석에 선 전직 대통령"
 france_md.903.d: "전직 공화국 대통령이 파리 납세자들이 급여를 지급한 허위 시청 직책과 열리지도 않은 집회에 대해 한 기업에 청구된 선거 비용 청구서로 기소되었습니다. 대통령 면책 특권은 임기와 함께 끝났습니다. 형사 법원은 날짜를 잡았습니다."
 france_md.903.a: "법원이 제 할 일을 하게 둔다"
 france_md.903.b: "정치 재판이라고 규탄한다"
 france_md.910.t: "로터리의 노란 조끼"
 france_md.910.d: "경유에 대한 탄소세로 인해 전국 모든 로터리에 형광 조끼가 등장했습니다. 뒤에는 노조도, 정당도, 협상할 대표단도 없습니다. 주유소에서 단 1상팀도 더 감당할 수 없는 운전자, 소상공인, 연금 수급자들뿐입니다. 토요일은 상시 시위가 되었습니다."
 france_md.910.a: "연료세 인상을 철회한다"
 france_md.910.b: "세금은 유지하고 대화를 시작한다"
 france_md.910.c: "세금에 대한 입장을 고수한다"
 france_md.911.t: "토요일에 불타는 샹젤리제"
 france_md.911.d: "토요일 행진은 이제 샹젤리제의 최루탄으로 끝나며, 개선문은 낙서로 뒤덮이고 대로변의 브라스리는 약탈당합니다. 파리 경찰청은 쉴 수 있는 CRS 중대가 바닥나고 있으며 오후 내내 벌어진 일의 책임을 뒤집어쓰고 있습니다. 상점들은 시즌 내내 문을 판자로 막고 있습니다."
 france_md.911.a: "국민 대토론회를 소집한다"
 france_md.911.b: "최저임금을 인상하고 연금에 대한 CSG를 인하한다"
 france_md.911.c: "CRS를 투입한다"
 france_md.912.t: "로터리 점거 다섯 번째 달"
 france_md.912.d: "점거는 다섯 번째 달에 접어들었으며, 우리 경찰이 쏜 고무탄은 그 자체로 사법 조사 대상이 되었습니다. 도심 매출은 붕괴했고 도청들은 더 이상 새 중대를 계속 찾아낼 수 없습니다. 마티뇽은 이번 주 안에 결정을 원합니다."
 france_md.912.a: "경제·사회 비상사태를 선포한다"
 france_md.912.b: "행진을 금지하고 비상사태를 선포한다"
 france_md.920.t: "본부를 잃은 사회당"
 france_md.920.d: "공적 자금은 의석을 따라가며, 지난 두 차례 선거 이후 솔페리노의 불을 유지할 만큼 의석이 남아 있지 않습니다. 반란파는 당을 다시 좌파로 되돌리기를 원하고, 시장들과 퇴임 장관들은 당이 집권할 수 있는 상태로 유지되기를 원하며, 두 날개 모두 외부로부터 구애를 받고 있습니다. 건물은 이미 감정가가 매겨졌습니다."
 france_md.920.a: "당을 다시 좌파로 돌린다"
 france_md.920.b: "당을 집권 중도에 닻 내린다"
 france_md.920.c: "두 날개가 떠나게 둔다"
 france_md.921.t: "탈악마화를 논의하는 당"
 france_md.921.d: "국민연합의 새 지도부는 존경받기를 원합니다. 인종적 논거 대신 경제적 논거를, 수용소에 관한 도발은 더 이상 없이, 텔레비전 인터뷰를 견뎌 낼 수 있는 후보들을 내세우겠다는 것입니다. 목표는 당을 모든 결선투표에서 배제해 온 공화 전선입니다. 창당 세대는 이를 항복이라 부릅니다."
 france_md.921.a: "당이 스스로 정상화하게 둔다"
 france_md.921.b: "당을 옛 노선에 묶어 둔다"
 france_md.921.c: "창당 일가가 공개적으로 다투게 둔다"
 france_md.922.t: "자기 당에 맞서는 창당자"
 france_md.922.d: "창당자는 자신이 출마하지도 않은 선거운동 한복판에서 카메라 앞에서 수용소에 관한 예의 도발 발언을 되풀이했습니다. 지도부는 징계 위원회를 소집하고 당규에서 명예 총재직을 삭제하고 있습니다. 당이 이름을 유지할지는 전당대회가 결정할 것입니다."
 france_md.922.a: "당을 새 세대에게 넘긴다"
 france_md.922.b: "창당자를 제명한다"
 france_md.923.t: "공화 전선을 깬 우파"
 france_md.923.d: "전통 우파의 대표는 자신의 정치국에 안건을 올리지도 않고 저녁 뉴스에 나와 국민연합과의 선거 협약을 발표했습니다. 그가 당 본부를 잠가 버렸기 때문에 정치국은 빌린 방에서 모여야 했습니다. 40년에 걸친 공화 전선은 단 한 번의 방송으로 끝났습니다."
 france_md.923.a: "그를 제명하고 협약을 거부한다"
 france_md.923.b: "결선투표를 위한 협약을 비준한다"
 france_md.923.c: "당이 둘로 쪼개지게 둔다"
 france_md.930.t: "연금 개혁에 맞선 8개 노조"
 france_md.930.d: "법정 정년 연장은 한 세대 만에 처음으로 대표 노조 8곳 모두를 같은 연단에 세웠습니다. SNCF와 RATP는 릴레이 파업을 벌이고 있고, 다음은 정유소이며, 국민의회에는 이 법안의 과반이 없습니다. 마티뇽에서는 제49조 3항이 안건으로 올라 있습니다."
 france_md.930.a: "49.3으로 법안을 밀어붙인다"
 france_md.930.b: "개혁파 노조와 협상한다"
 france_md.930.c: "법안을 철회한다"
 france_md.931.t: "조건을 제시하는 개혁파 노조"
 france_md.931.d: "개혁파 노총들은 정년이 분기별 단계로 늦춰지고 장기 경력자와 고된 노동에 면제가 적용된다면 더 늦은 정년을 받아들이겠다고 합니다. 절감액은 절반으로 줄고 강경파 연합들은 아무것에도 서명하지 않을 것입니다. 이것이 서명이 담긴 유일한 안입니다."
 france_md.931.a: "타협안에 서명한다"
 france_md.931.b: "거부하고 파업이 계속되게 둔다"
 france_md.932.t: "봉쇄된 대학"
 france_md.932.d: "고용주가 사유를 밝히지 않고 26세 미만을 해고할 수 있게 하는 최초 고용 계약은 소르본과 지방 캠퍼스 절반의 정문 앞에 쓰레기통 바리케이드를 쌓게 했습니다. 학생 노조에 고등학교와 CGT가 합류했습니다. 도청은 건물을 비워도 되겠느냐는 허가를 요청하고 있습니다."
 france_md.932.a: "계약을 철회한다"
 france_md.932.b: "학생 노조와 협상한다"
 france_md.932.c: "캠퍼스를 비운다"
 france_md.940.t: "긴장된 선거"
 france_md.940.d: "지방 선거 1차 투표에서 프랑스 대부분의 도시에서 집권 후보들이 탈락했고 극단주의 정당이 결선에 올랐습니다. 한 시간도 지나지 않아 공화 전선을 호소하는 목소리가 나왔습니다. 남은 사람이 누구든 그에게 투표하고, 따지는 것은 그 뒤에 하자는 것입니다. 다른 이들은 그런 식으로 짜낸 표는 위임이 아니라고 답합니다."
 france_md.940.a: "공화 전선을 호소한다"
 france_md.940.b: "결선투표를 유권자에게 맡긴다"
 france_md.940.c: "이 결과를 우리에 대한 심판으로 받아들인다"
 france_md.941.t: "구 정당 밖의 운동"
 france_md.941.d: "한 전직 장관이 좌도 우도 아닌 자신만의 운동을 만들기 위해 정부를 떠났습니다. 입장권을 받는 집회로 자금을 모으고 집집마다 방문해 모은 당원 명부 위에 세운 운동입니다. 두 집권당의 의원들은 벌써 그의 명부에 자리가 있는지 문의하고 있습니다. 어느 당에도 그보다 지지율이 높은 후보가 없습니다."
 france_md.941.a: "이 운동을 지지한다"
 france_md.941.b: "스쳐 가는 유행이라고 일축한다"
 france_md.941.c: "구 정당들이 스스로 쇄신하도록 압박한다"
 france_md.950.t: "방리유의 폭동의 밤"
 france_md.950.d: "센생드니의 한 시테에서 신분 검문을 피해 달아나던 10대 두 명이 사망했습니다. 사흘째 밤이 되자 북부 교외에서 툴루즈와 스트라스부르에 이르기까지 불탄 자동차가 수천 대로 헤아려졌습니다. 시장들은 1955년 법에 따른 통행금지를 요청하고 있습니다."
 france_md.950.a: "1955년 법에 따라 통행금지를 시행한다"
 france_md.950.b: "도시재생청과 우선 지구에 자금을 지원한다"
 france_md.950.c: "단지를 말끔히 정리하겠다고 약속한다"
 france_md.949.t: "파리 전역에서 동시다발 공격"
 france_md.949.d: "공격은 동부 구들과 스타드 드 프랑스에서 여전히 진행 중입니다. BRI는 인질이 있는 콘서트홀 입구에 도착해 있습니다. 일드프랑스의 모든 병원이 비상 계획에 들어갔습니다."
 france_md.949.a: "사흘간의 국가 애도 기간을 선포한다"
 france_md.951.t: "합동 회의를 소집한 의회"
 france_md.951.d: "행진은 끝났고 양원은 베르사유로 소집되었습니다. 보보 광장(내무부)은 비상사태 연장과 센티넬 병력의 두 배 증강을 원하고, 케도르세(외무부)는 항모 전단을 동쪽으로 보내기를 원하며, 국사원은 이미 행정 수색에 대해 경고하고 있습니다."
 france_md.951.a: "비상사태를 연장한다"
 france_md.951.b: "항모 전단을 동쪽으로 보낸다"
 france_md.951.c: "비상 권한을 거부한다"
 france_md.952.t: "유럽 헌법 국민투표"
 france_md.952.d: "조약은 의회 합동 회의가 아닌 국민에게 부쳐질 것이며, 이 운동은 두 집권당을 한가운데에서 갈라놓았습니다. 반대론은 좌파에서는 파견 노동 헌장으로, 우파에서는 프랑스 주권의 종말로 주장됩니다. 마지막 여론조사는 두 진영을 오차 범위 안에 놓았습니다."
 france_md.952.a: "찬성 운동을 적극 펼친다"
 france_md.952.b: "운동에서 손을 뗀다"
 france_md.952.c: "대신 의회 합동 회의로 비준한다"
 france_md.953.t: "공동 강령을 협상하는 좌파"
 france_md.953.d: "사회당, 공산당, 녹색당, 불복파가 선거구를 후보 한 명씩 서로 나누고 있습니다. 걸림돌은 지난 시도 이후 달라지지 않았습니다. 유럽 조약, 그리고 누가 강령을 이끄느냐입니다. 모든 정당이 이 거래로 얻는 의석보다 잃는 의석이 더 많지 않을지 계산하고 있습니다."
 france_md.953.a: "온건파를 연합의 선두에 세운다"
 france_md.953.b: "불복파가 강령을 정하게 둔다"
 france_md.953.c: "협상이 결렬되게 둔다"
 france_md.954.t: "과반 없는 국민의회"
 france_md.954.d: "국민의회는 세 개의 블록으로 돌아왔으며 어느 쪽도 289석에 이르지 못합니다. 마티뇽의 어떤 후보도 임명 당일 불신임될 수 있으며, 예산은 회기가 끝나기 전에 통과되어야 합니다. 엘리제궁은 정당 대표들을 한 명씩 접견하고 있지만 아무 성과도 얻지 못하고 있습니다."
 france_md.954.a: "기술관료 정부를 임명한다"
 france_md.954.b: "해산하고 국민에게 돌아간다"
 france_md.954.c: "블록을 가로지르는 연립을 구성한다"
 FRA_ps_platform: "사회당 강령"
 FRA_ps_platform_desc: "당은 복수 좌파의 실적을 내세워 선거에 나섭니다. 주 35시간제, 보편적 의료 보장, 청년 고용 계약이며, 이 모두는 차입이 아니라 더 넓어진 과세 기반으로 재원을 마련합니다. 전당대회에서 한 모든 약속의 뒤에는 예산의 한 줄이 있으며, 솔페리노 가는 돈이 도착하는지로 평가받겠다는 입장입니다."
 FRA_udf_platform: "중도연합 강령"
 FRA_udf_platform_desc: "중도파는 기업에 대한 부담금 인하, 노동법에 대한 가벼운 손길, 그리고 모든 문제에 새로운 부과금으로 답하는 반사적 습관의 종식을 내걸고 선거운동을 합니다. 프랑스가 투자를 처벌받아야 할 대상으로 대하기를 그만둘 때에만 자본이 프랑스에 머물 것이라는 것이 그들의 논거입니다."
 FRA_lr_platform: "공화 우파 강령"
 FRA_lr_platform_desc: "드골주의 우파는 제5공화국의 고전적 거래를 제시합니다. 공화국이 요구할 때 단독으로 행동할 수 있도록 자금을 댄 군대, 그리고 그 주위에 쌓인 행정 계층을 걷어 낸 국가입니다. 국내의 질서와 국외의 독립은 하나의 정책으로 제시됩니다."
 FRA_rpf_platform: "주권주의 강령"
 FRA_rpf_platform_desc: "파스쿠아와 드 빌리에는 어떤 조약도 프랑스 국민에게 속한 것을 이양할 수 없다는 단 하나의 명제를 내걸고 선거운동을 하며, 이를 유로, 솅겐, 집행위원회의 권한에 똑같이 적용합니다. 무역 상대국들은 이 강령을 파리와 맺은 모든 합의에 대한 위협으로 받아들입니다."
 FRA_fn_platform: "국민전선 강령"
 FRA_fn_platform_desc: "주거, 고용, 복지에서의 국민 우선, 가족 재결합 중단, 국경 통제의 재도입이 강령의 전부를 이룹니다. 이는 어떤 다른 정당도 모을 수 없는 군중을 끌어모으며, 동시에 그 정당에 맞선 다른 모든 이들의 반대를 똑같이 굳힙니다."
 FRA_lfi_platform: "불복하는 프랑스 강령"
 FRA_lfi_platform_desc: "이 운동은 대통령제 군주정을 매장할 제헌의회를 위해 선거운동을 하며, 국민의회가 아니라 거리와 집회장에서 논거를 쌓아 갑니다. 이용 시점 무상 의료가 대표 요구이며, 선거운동이 지나가는 곳마다 오랜 정당 충성은 녹아내립니다."
 FRA_eelv_platform: "생태주의 강령"
 FRA_eelv_platform_desc: "녹색당은 원자로 계획의 단계적 축소, 건설 사업에 대한 환경 심사 의무화, 그리고 두 가지를 대체할 것에 관한 연구에 자금을 투입할 것을 요구합니다. 그들이 묘사하는 전환은 현실이며, 그에 필요한 10년간의 더딘 건설 또한 현실입니다."
 FRA_pcf_platform: "공산당 강령"
 FRA_pcf_platform_desc: "당은 여전히 붉은 벨트의 지방 자치체들과 대형 공장의 노조 지부를 쥐고 있으며, 가장 강한 곳인 작업 현장에서 임금, 노동 시간, 산업 고용 수호를 두고 선거운동을 합니다. 세포 조직이 활발한 곳에서는 공장이 장부가 예측하는 것보다 더 잘 돌아갑니다."
 FRA_idea_transparency_reforms: "공직 투명성"
 FRA_idea_transparency_reforms_desc: "이제 모든 장관, 하원의원, 상원의원은 이해관계와 재산에 관한 신고서를 독립 기구에 제출하며, 이 기구는 이를 공개하고 의심스러운 사례를 검찰에 회부할 수 있습니다. 정치계는 이 의무에 분개했지만 이를 따랐습니다."
 FRA_idea_national_debate: "국민 대토론회"
 FRA_idea_national_debate_desc: "두 달 동안 시장들은 시의회 회의장을 찾아오는 누구에게나 개방하고 있으며, 접수되는 의견은 수만 건 단위로 기록되고 있습니다. 비용과 장관들의 시간이 들지만, 논쟁을 로터리에서 시청으로 옮겨 놓습니다."
 FRA_idea_social_emergency_measures: "경제·사회 비상사태"
 FRA_idea_social_emergency_measures_desc: "최저임금 보조금이 인상되었고, 초과근무는 세금에서 제외되었으며, 소액 연금에 대한 CSG 인상은 철회되었습니다. 청구서는 같은 분기에 재정 적자로 떨어지며, 브뤼셀이 이를 눈여겨보았습니다."
 FRA_idea_pension_reform_passed: "49.3조에 의한 연금 개혁"
 FRA_idea_pension_reform_passed_desc: "정년은 정부의 책임을 거는 조항에 따라 표결 없이 늦춰졌고, 불신임안은 불과 몇 명 차이로 부결되었습니다. 연금 재정은 개선되었으며, 이후 우리가 국민의회에 보내는 모든 법안은 이것을 통해 읽힐 것입니다."
 FRA_idea_pension_compromise: "협상된 연금 개혁"
 FRA_idea_pension_compromise_desc: "정년은 분기별 단계로 늦춰지며, 장기 경력자와 고된 노동으로 분류된 업무에는 면제가 적용됩니다. 개혁파 노총들은 서명했고 강경파 연합들은 서명하지 않았으며, 절감액은 원안이 약속한 것의 대략 절반입니다."
 FRA_idea_political_renewal: "정치계 쇄신"
 FRA_idea_political_renewal_desc: "국민의회 의석의 절반은 선출직을 맡아 본 적이 없는 이들이며, 정당 기구들은 더 이상 자신의 공천조차 통제하지 못합니다. 새로 들어온 이들은 눈에 띄고 활기차며 전적으로 경험이 없습니다."
 FRA_idea_urban_renewal: "시테의 도시 재생"
 FRA_idea_urban_renewal_desc: "도시재생청은 우선 지구의 시장들과 15년짜리 협약을 체결하며, 최악의 고층 단지를 철거하고 그 자리에 학교를 재건하고 있습니다. 성과는 그것을 지시한 정부가 물러난 한참 뒤에야 나타납니다."
 FRA_idea_national_unity: "공격 이후의 국민 통합"
 FRA_idea_national_unity_desc: "야당은 불신임안을 철회했고, 창문마다 삼색기가 걸려 있으며, 예비군과 헌병대에는 처리할 수 있는 수보다 많은 지원자가 몰렸습니다. 이는 올해를 넘기지 못하겠지만, 지속되는 동안에는 값어치가 있습니다."
 FRA_idea_technocratic_government: "기술관료 정부"
 FRA_idea_technocratic_government_desc: "도지사, 재정감찰관, 전직 중앙은행 관계자들이 부처를 맡고 있습니다. 엘리제궁에서 임명되었고, 다른 어떤 것에도 합의하지 못하는 국민의회가 용인하는 이들입니다. 그들은 예산을 통과시킬 수 있습니다. 개혁은 통과시킬 수 없습니다."
 FRA_heightened_security: "비지피라트 계획 발동"
 FRA_heightened_security_desc: "비지피라트가 강화 경계로 격상되었고, 주요 시설의 경비는 센티넬 작전에 따라 경찰에서 군으로 넘어갔습니다. 수천 명의 병사가 이제 역, 학교, 예배 장소 밖에 서 있으며, 군은 그 비용을 내무부가 아닌 자신의 전투 준비 태세에 청구합니다."
 FRA_state_of_emergency_terrorism: "비상사태 선포"
 FRA_state_of_emergency_terrorism_desc: "1955년 법이 시행 중입니다. 도지사는 판사 없이 수색을 명령하고, 개인에게 거주지를 지정하고, 자신의 권한으로 집회를 금지할 수 있습니다. 의회는 석 달마다 이를 갱신하며 국사원은 이의 신청 건수를 집계합니다."
 FRA_terror_threat_elevated: "고조된 테러 위협"
 FRA_terror_threat_elevated_desc: "DGSI는 귀환자와 급진화된 개인에 관한 사건 파일을 이를 감시할 요원보다 많이 안고 있으며 목록은 계속 늘어납니다. 대규모 행사는 경비되기보다 도지사 명령으로 취소되고 있습니다."
 FRA_terror_threat_critical: "심각한 테러 위협"
 FRA_terror_threat_critical_desc: "정보기관은 여러 개의 작전 세포를 동시에 감시하고 있으며, 더 이상 그 모두를 차단할 수 있으리라 기대하지 않습니다. 경찰과 헌병대 전체의 휴가가 취소되었고, 내무 장관은 날짜를 말하기를 그만두었습니다."
 FRA_national_mourning: "국가 애도 기간"
 FRA_national_mourning_desc: "모든 공공 건물에 조기가 걸려 있고, 정오에 1분간 묵념이 지켜지며, 앵발리드에서 희생자의 이름이 낭독됩니다. 이번 주에는 어떤 업무도 진행되지 않습니다."
 FRA_damaged_infrastructure: "손상된 핵심 기반시설"
 FRA_damaged_infrastructure_desc: "공격으로 지하철 환승역 하나와 고압 송전망 일부 구간이 파괴되었으며, 복구는 비상 일정보다 뒤처지고 있습니다. 운영사들은 도지사의 징발 아래 작업하고 있으며 비용은 국가가 부담합니다."
 FRA_tourism_crisis: "관광 위기"
 FRA_tourism_crisis_desc: "일드프랑스의 호텔 투숙률은 붕괴했고 장거리 여행사들은 시즌 내내 상품을 취소했습니다. 관광은 우리의 가장 큰 외화 수입원이며, 우리 보안 정책의 속도가 아니라 해외 뉴스 보도의 속도에 맞춰 돌아올 것입니다."
 france_md.970.t: "출근 시간 RER 폭탄 테러"
 france_md.970.d: "객차에 남겨진 장치가 아침 출근 시간대 환승역에서 폭발했으며, 구조대가 도보로만 접근할 수 있는 터널 구간에서 일어났습니다. 수십 명이 사망했고 부상자 수는 계속 늘고 있습니다. 전 노선이 멈췄고 대량 인명 피해 계획이 시행 중입니다."
 france_md.970.a: "병원과 응급 서비스를 징발한다"
 france_md.970.b: "국가 애도의 날을 선포한다"
 france_md.970.c: "노선을 재개하고 비상 권한을 거부한다"
 france_md.971.t: "경찰서를 습격한 무장 괴한"
 france_md.971.d: "돌격 소총과 차량 폭탄으로 무장한 공격자들이 BRI가 도착하기까지 40분 동안 북부 교외의 경찰서와 교전을 벌였습니다. 경찰관들이 사망했고 건물은 사용할 수 없게 되었습니다. 이를 계획한 자는 근무 교대 시간을 알고 있었습니다."
 france_md.971.a: "도를 봉쇄하고 공범을 추적한다"
 france_md.971.b: "전국의 모든 경찰서를 요새화한다"
 france_md.972.t: "수도 전역을 강타한 자살 공격조"
 france_md.972.d: "돌격 소총과 폭탄 벨트로 무장한 세 개 조가 같은 시간 안에 경기장 진입로, 줄지은 술집들, 콘서트홀을 공격했습니다. 100명이 넘는 사람이 사망했으며 일드프랑스의 외과의들은 전시 체제로 수술하고 있습니다. 전쟁 이후 우리 땅에서 이 정도 규모의 일이 벌어진 적은 없습니다."
 france_md.972.a: "비상사태를 선포한다"
 france_md.972.b: "유럽 상호 방위 조항을 발동한다"
 france_md.972.c: "해외에 있는 그 조직의 기지를 타격한다"
 france_md.973.t: "루브르 공격"
 france_md.973.d: "칼을 든 남자가 카루젤 검문소에서 저지되었지만, 그 뒤의 조는 폭발물을 들고 튈르리 입구로 들어와 현재 드농관에 있습니다. 관람객들은 그들 위층의 전시실에 바리케이드를 치고 있습니다. 보존 직원들은 아직 옮길 수 있는 것을 옮길 시간을 요청하고 있습니다."
 france_md.973.a: "관람객을 먼저 대피시킨다"
 france_md.973.b: "돌입 전에 소장품을 확보한다"
 france_md.974.t: "군 기지 내부의 공격자들"
 france_md.974.d: "한 조가 울타리 보수가 중단되어 있던 한 지점에서 공군 기지의 경계를 넘어 경비 병력이 저지하기 전에 경보 대기 분산 구역에 도달했습니다. 그들은 근무 일정표와 출입문 암호를 알고 있었습니다. 군 방첩대는 이제 우리 자신의 인원을 조사하고 있습니다."
 france_md.974.a: "모든 시설의 보안을 재검토한다"
 france_md.974.b: "방첩 부대에 병력을 점검하게 한다"
 france_md.975.t: "에펠탑의 인질들"
 france_md.975.d: "무장한 자들이 그날 첫 관광객들과 함께 승강기를 타고 올라와 수백 명의 인질과 함께 상부 전망대를 장악했습니다. 승강기 장치에는 폭발물이 설치되어 있으며, GIGN은 샹 드 마르스를 가로질러 접근하면 1킬로미터 밖에서도 발각됩니다. 그들은 수감자 석방과 방송을 요구하고 있습니다."
 france_md.975.a: "GIGN을 탑 위로 투입한다"
 france_md.975.b: "대화로 시간을 번다"
 france_md.975.c: "모든 요구를 거부한다"
 france_md.976.t: "원자력 발전소 습격"
 france_md.976.d: "공격자들이 루아르 계곡에 있는 발전소의 행정동과 사용후핵연료 건물을 장악했습니다. 이들은 현장에 접근하는 즉시 연료 저장조를 열겠다고 밝혔습니다. 방사선 연구소의 분석에 따르면 방사성 기둥은 세 나라의 국경을 넘어갑니다."
 france_md.976.a: "원자로를 냉각 상태로 확보하고 GIGN을 투입한다"
 france_md.976.b: "가용한 모든 전력으로 현장을 공격한다"
 france_md.980.t: "파리를 뒤흔든 동시다발 공격"
 france_md.980.d: "파리의 경기장 진입로, 공연장, 그리고 늘어선 술집들에 대한 동시 공격으로 100명이 넘는 사람이 목숨을 잃었습니다. 프랑스는 국경을 폐쇄하고 군대를 거리에 투입했습니다. 유럽 각국의 내무부는 귀환자들에 관한 자체 기록을 다시 검토하고 있습니다."
 france_md.980.a: "우리는 프랑스와 함께한다"
 france_md.981.t: "무장 괴한들의 루브르 습격"
 france_md.981.d: "무장한 공격자들이 루브르의 드농관 내부에 있으며, 방문객들은 주변 전시실에 바리케이드를 치고 숨어 있습니다. 이 박물관에는 어떤 보험이나 복원으로도 대체할 수 없는 작품들이 소장되어 있습니다. 대륙의 주요 소장처들은 모두 자신들의 대응책을 검토하고 있습니다."
 france_md.981.a: "프랑스에 지원을 제안한다"
 france_md.982.t: "에펠탑에 억류된 인질들"
 france_md.982.d: "승강기 장치에 폭발물을 설치한 무장 괴한들이 에펠탑 상부 전망대에서 수백 명의 방문객을 억류하고 있습니다. 프랑스 특수부대가 전 세계 카메라 앞에서 샹 드 마르스에 집결하고 있습니다. 각국 외무부는 방문객 명단에서 자국민을 확인하고 있습니다."
 france_md.982.a: "프랑스가 받아들이는 모든 도움을 제안한다"
 france_md.983.t: "공격받는 프랑스 원자력 발전소"
 france_md.983.d: "테러리스트들이 프랑스의 원자력 시설을 공격하면서 유럽 전역에 긴급 경보가 발령되었습니다. 당국은 당장의 방사선 위험은 없다고 주장하지만, 체르노빌 규모의 재앙이 일어날 가능성에 대륙 전체가 충격에 빠졌습니다. 각국 정부는 비상 계획을 준비하고 있으며, 시설 인근 주민들에게는 실내 대피령이 내려졌습니다."
 france_md.983.a: "비상 대응 계획을 준비한다"
 france_md.985.t: "테러 음모 저지"
 france_md.985.d: "프랑스 정보기관이 대규모 테러 음모를 성공적으로 저지했습니다. 수개월에 걸친 감시와 잠입 작전, 그리고 국제 협력 끝에 이루어진 합동 급습으로 음모자들이 공격을 감행하기 전에 체포되었습니다. 자세한 내용은 기밀로 남아 있지만, 계획된 공격이 파국적인 결과를 낳았을 수 있었다는 것이 관계자들의 전언입니다. 이번 성공은 대테러 역량에 대한 막대한 투자가 옳았음을 입증합니다."
 france_md.985.a: "정보기관을 치하한다"
 france_md.985.b: "강화된 경계 태세를 유지한다"
 FRA_counter_terrorism_category: "대테러 작전"
 FRA_french_communism_expansionism_decision_category: "자본주의와의 전쟁"
 FRA_3rd_empire_decision_category: "제3제국 확장"
 FRA_LFI6th_decision_category: "새로운 공화국의 여명"
 FRA_french_socialist_downfall_decision_category: "사회주의의 몰락"
 FRA_frexit_decision_category: "유럽 연합 탈퇴"
 FRA_royalist_expansion_decision_category: "재정복"
 FRA_EU_assistance_decision_category: "유럽 경제 동반자 관계"
 FRA_GREEN_EU_assistance_decision_category: "유럽 생태 전환"
 FRA_activate_vigipirate: "비지피라트 발동"
 FRA_activate_vigipirate_desc: "프랑스의 국가 안보 경보 체계를 발동하여 무장 병력을 공공장소 순찰에 투입하고 민감한 장소의 경비를 강화합니다. 테러 공격을 막아 주지만 지속적인 비용이 듭니다."
 FRA_declare_state_of_emergency: "비상사태 선포"
 FRA_declare_state_of_emergency_desc: "심각한 테러 위협에 대응하여 국가 비상사태를 선포합니다. 보안 부대의 권한이 확대되는 대신 일부 시민의 자유가 정지됩니다."
 FRA_end_state_of_emergency: "비상사태 해제"
 FRA_end_state_of_emergency_desc: "당면한 위협이 줄어들었으므로 비상사태를 해제하고 정상적인 시민의 자유를 회복합니다. 일상생활이 정상화되고 정치적 긴장이 완화될 것입니다."
 FRA_intelligence_surge: "정보 역량 대폭 강화"
 FRA_intelligence_surge_desc: "정보기관에 대한 자금과 자원을 대폭 늘려 감시 능력과 대테러 작전을 개선합니다. 테러 조직망에 대한 선제적 작전이 가능해집니다."
 FRA_secure_critical_infrastructure: "핵심 기반시설 보호"
 FRA_secure_critical_infrastructure_desc: "발전소, 교통 거점, 통신 시설 등 핵심 기반시설을 테러 공격에 견딜 수 있도록 보강하는 데 투자합니다. 비용이 많이 들지만 대규모 공격에 대한 취약성이 줄어듭니다."
 FRA_operation_sentinelle: "센티넬 작전"
 FRA_operation_sentinelle_desc: "수천 명의 병력을 국내 치안 임무에 투입하여 거리를 순찰하고, 민감한 장소를 보호하며, 경찰 작전을 지원합니다. 눈에 보이는 군 병력의 존재가 대중을 안심시키지만 군대에 부담을 줍니다."
 FRA_anti_terror_raid: "대테러 급습 실시"
 FRA_anti_terror_raid_desc: "수집된 정보를 바탕으로 테러 용의 조직에 대한 급습을 실시합니다. 성공하면 계획된 공격을 저지하고 전반적인 위협 수준을 낮출 수 있습니다."
 FRA_terrorism_defeated: "테러와의 전쟁 승리 선언"
 FRA_terrorism_defeated_desc: "안정도가 회복되고 최근 공격이 없었으므로 테러 위협이 무력화되었음을 공식 선언합니다. 사기가 진작되고 국가가 앞으로 나아갈 수 있게 됩니다."
 FRA_rebuild_after_attack: "파괴된 기반시설 재건"
 FRA_rebuild_after_attack_desc: "테러 공격으로 파괴된 기반시설을 복구하는 데 투자합니다. 이러한 시설의 복구는 일상으로의 복귀와 회복탄력성을 보여 주는 데 필수적입니다."
 FRA_tourism_recovery_campaign: "관광 회복 캠페인"
 FRA_tourism_recovery_campaign_desc: "프랑스가 안전한 관광지임을 알리는 대규모 국제 캠페인을 전개합니다. 관광의 회복은 경제에 필수적이며, 테러리스트가 프랑스의 생활 방식을 파괴할 수 없음을 보여 줍니다."
 FRA_6threp_mission: "대중의 열광"
 FRA_6threp_mission_desc: "정치 체제를 개혁하겠다는 우리의 의지는 많은 사람을 기쁘게 했습니다. 많은 이들이 변화를 원하지만, 우리가 과정을 지연시키려는 세력으로 비쳐서는 안 됩니다."
 FRA_rally_support: "우리의 성과를 보여 주기"
 FRA_rally_support_desc: "반대 세력은 과정을 늦추려 하며 우리가 하는 모든 변화에 의문을 제기하고 있습니다. 그러나 우리는 굳건히 버텨야 합니다. 우리는 많은 것을 이루었고, 그것을 보여 주어야 합니다."
 FRA_rally_ennemy: "개혁을 비판하는 야당"
 FRA_rally_ennemy_desc: "이러한 변화는 필수적이지만 모두가 환영하는 것은 아닙니다. 야당은 우리 공화국의 미래에 관한 모든 결정을 비판하기 위해 가능한 모든 수단을 동원하고 있습니다."
 FRA_timebomb_mission: "피할 수 없는 결별"
 FRA_timebomb_mission_desc: "사회당 내의 두 주요 파벌이 상황이 해결되지 않으면 당을 떠나겠다고 위협하고 있습니다. 너무 늦기 전에 사회당에 미래가 있음을 그들에게 보여 주어야 합니다."
 FRA_support_decrease_mission: "분열하는 우리 당"
 FRA_support_decrease_mission_desc: "당원들을 안심시키는 일이 늦어질수록 더 많은 이들이 자신의 이념에 가까운 집단으로 떠나게 될 것입니다. 상황을 신속히 바로잡아야 합니다."
 FRA_campaign_against_extremism: "극단주의 반대 캠페인"
 FRA_campaign_against_extremism_desc: "이 혼란한 시기에, 우리 사회주의자들이야말로 부상하는 정치적 극단주의에 맞설 올바른 선택임을 좌파와 중도층에 상기시켜야 합니다."
 FRA_campaign_clash_traitors: "당 배신자들에 대한 보복"
 FRA_campaign_clash_traitors_desc: "더 유행하는 정당을 찾아 우리를 떠나는 자라면 우리가 언론에 그들의 정체를 폭로하리라 각오해야 합니다. 그들은 기회주의자이자 혼란의 앞잡이일 뿐입니다."
 FRA_boost_eurosceptism: "유럽 연합 반대 캠페인"
 FRA_boost_eurosceptism_desc: "공개 토론에서 거리의 포스터에 이르기까지, 우리 사회 전체가 유럽 회의주의를 뿜어내야 합니다. 유럽의 관료들이 우리 모든 문제의 원인임을 프랑스 국민이 이해하게 만들어야 합니다."
 FRA_disobey_treaties: "유럽 조약 위반"
 FRA_disobey_treaties_desc: "우리는 더 이상 이 어리석은 법들에 굴복해서는 안 됩니다. 우리는 우리 집의 주인이며, 어차피 유럽 연합을 떠나는 것은 시간문제입니다."
 FRA_denounce_eu_policies: "유럽 정책 폭로"
 FRA_denounce_eu_policies_desc: "우리가 반대할 수도 없이 유럽 의회에서 쏟아져 나오는 부당한 법들에 항의의 초점을 맞추어야 합니다. 결과가 더 이상 우리에게 달려 있지 않다면 선거에서 투표하는 것이 무슨 소용입니까?"
 FRA_threaten_media: "친유럽 언론 위협"
 FRA_threaten_media_desc: "친유럽 정서는 언론에 이르기까지 우리 기관들에 스며들었습니다. 이 글쟁이들에게 자신의 수준에 더 맞는 주제만 다루고 분위기를 거스르는 일은 그만두라고 상기시켜야 합니다."
 FRA_red_benelux: "베네룩스 해방"
 FRA_red_benelux_desc: "우리는 베네룩스를 자본주의와 유럽 자유주의로부터 해방해야 합니다."
 FRA_benelux_boost: "베네룩스 문화 통합"
 FRA_benelux_boost_desc: "네덜란드, 플랑드르, 왈로니아의 노동자들이 이제 하나가 되어 혁명에 합류하며, 그들의 공장과 노조는 우리의 사회주의 프로젝트에 흡수됩니다."
 FRA_done_with_dumping: "조세 피난처의 종말"
 FRA_done_with_dumping_desc: "조세 피난처 노릇을 하며 존재하는 이 나라들의 존재 자체가 평등과 연대라는 개념 그 자체에 대한 모욕입니다. 이를 끝내야 합니다."
 FRA_dumping_boost: "스위스 문화 통합"
 FRA_dumping_boost_desc: "우리는 조세 피난처를 지탱하던 은행 간부층을 무너뜨렸으며, 스위스 노동력은 우리의 경제 프로젝트에 재통합되고 있습니다."
 FRA_red_iberia: "독재자는 다시는 없다"
 FRA_red_iberia_desc: "우리의 남쪽 측면이 다시는 파시즘의 영향 아래 떨어지지 않도록 해야 합니다."
 FRA_iberia_boost: "이베리아 문화 통합"
 FRA_iberia_boost_desc: "스페인과 포르투갈의 노동 운동은 1936년이 이루지 못한 약속을 마침내 목격하며, 동등한 자격으로 우리의 혁명에 합류합니다."
 FRA_ciao_bella: "차오 벨라"
 FRA_ciao_bella_desc: "공산주의 혁명은 이탈리아에서 실패했지만 이탈리아 국민에게 깊은 인상을 남겼습니다. 과거의 잘못을 바로잡을 때가 왔습니다."
 FRA_italy_boost: "이탈리아 문화 통합"
 FRA_italy_boost_desc: "이탈리아 공산당(PCI)의 유산은 살아 있습니다. 이탈리아 노동자들이 시작했으나 끝내지 못한 붉은 2년을 우리가 완수합니다."
 FRA_avenge_long_knife: "긴 낫의 밤"
 FRA_avenge_long_knife_desc: "게르만 국가들에 혁명을 일으켜 자본주의에서 해방하고 민족주의가 다시 승리하는 것을 막아야 합니다."
 FRA_ger_aus_boost: "게르만 문화 통합"
 FRA_ger_aus_boost_desc: "동독의 산업 간부와 오스트리아의 노동조합이 자신들의 규율과 경험을 우리의 혁명 프로젝트에 가져옵니다."
 FRA_ostalgia: "동유럽에 혁명을 되돌리기"
 FRA_ostalgia_desc: "동유럽 국가들은 소련 점령 아래서 크게 고통받았습니다. 공산주의에도 좋은 점이 있음을 그들에게 보여 주어야 합니다."
 FRA_ostalgia_boost: "동유럽 문화 통합"
 FRA_ostalgia_boost_desc: "동유럽 전역에 여전히 남아 있는 오스탈기를 우리 혁명에 대한 진정한 열정으로 이끕니다."
 FRA_birthplace_revolution: "공산주의의 발상지 수복"
 FRA_birthplace_revolution_desc: "공산주의의 지난 영광을 잊어버린 러시아인들에게 혁명을 되돌려 주어야 합니다."
 FRA_birthplace_boost: "슬라브 문화 통합"
 FRA_birthplace_boost_desc: "우리는 혁명의 발상지를 되찾고, 러시아인과 슬라브 민족들이 한때 이끌었던 운동으로 다시 맞이합니다."
 FRA_no_more_neutrality: "북부의 중립 타파"
 FRA_no_more_neutrality_desc: "북유럽 국가들은 너무 오랫동안 사회주의와 자본주의 사이의 선택을 회피해 왔습니다. 이제 그들이 선택할 때입니다."
 FRA_neutrality_boost: "북유럽 문화 통합"
 FRA_neutrality_boost_desc: "북유럽의 사회민주주의는 마침내 전향했으며, 그 노동자들과 제도들은 우리의 더 큰 혁명 프로젝트에 편입됩니다."
 FRA_cold_war2: "더 이상의 냉전은 없다"
 FRA_cold_war2_desc: "우리는 NATO의 잔재를 파괴함으로써 소련과 바르샤바 조약 기구의 붕괴에 복수할 것입니다."
 FRA_cold_war_boost: "영국 문화 통합"
 FRA_cold_war_boost_desc: "만국의 노동자여, 단결하라! 영미권 고유의 노동 전통이 마침내 우리 혁명 안에서 제자리를 찾습니다."
 FRA_red_Europe: "유럽 혁명 완수"
 FRA_red_Europe_desc: "우리는 여전히 자본가들의 억압 아래 있는 유럽 전체에 혁명을 가져올 것입니다."
 FRA_red_victory: "유럽 혁명의 승리"
 FRA_red_victory_desc: "우리는 유럽 국가들을 자본주의의 족쇄에서 해방했습니다. 이것은 혁명의 위대한 승리입니다."
 FRA_annex_puppet_napo: "우리의 영유권 행사"
 FRA_annex_puppet_napo_desc: "우리의 종속국 한 곳이 우리가 영유권을 주장하는 영토를 가지고 있습니다. 그 영토가 우리에게 돌아올 때가 되었습니다."
 FRA_reunionism: "재통합주의 실현"
 FRA_reunionism_desc: "프랑스 문화권의 사람들을 하나로 모을 때가 되었습니다. 그리고 이번에는 영원히 말입니다."
 FRA_Never_another_guerilla: "남서부 확보"
 FRA_Never_another_guerilla_desc: "우리는 동쪽으로 향하므로 뒤에서 아무도 다가오지 못하게 해야 합니다. 이번에는 어떤 저항도 짓밟을 것이므로 게릴라전은 없을 것입니다."
 FRA_Avenge_Sedan: "스당의 복수"
 FRA_Avenge_Sedan_desc: "과거 프랑스 제국에 종말을 가져온 것은 독일 제국의 부상이었습니다. 이 모욕에 복수하고 우리의 자연 국경을 되찾아야 합니다."
 FRA_natural_border: "자연 국경 통합"
 FRA_natural_border_desc: "정복된 영토의 주민들은 결국 새로운 현실을 받아들이게 되었습니다. 라인강이 프랑스의 국경을 이룹니다."
 FRA_crush_coalition: "중부 유럽 확보"
 FRA_crush_coalition_desc: "이 영토들은 현재 준비 중인 모스크바를 향한 장대한 행군에 결정적인 역할을 할 것입니다."
 FRA_napoleon_empire: "나폴레옹 제국 통합"
 FRA_napoleon_empire_desc: "정복된 영토의 주민들은 결국 새로운 현실을 받아들이게 되었습니다. 그들은 이제 프랑스 제3제국의 온전한 시민입니다."
 FRA_prepare_russia: "동유럽 통일"
 FRA_prepare_russia_desc: "러시아 침공이 임박했습니다. 동맹국의 안전을 확보하고, 러시아와의 고강도 분쟁에 대비하게 해야 합니다."
 FRA_2nd_empire_colonies: "식민 제국 회복"
 FRA_2nd_empire_colonies_desc: "나폴레옹 3세와 제3공화국이 시작한 일을 우리가 완수할 것입니다. 우리는 안정적인 식민 제국을 건설할 것입니다."
 FRA_no_more_berezina: "티슬리트 작전"
 FRA_no_more_berezina_desc: "러시아 제국을 완전히 무너뜨릴 때가 왔습니다. 이번에는 그들이 모스크바를 불태울 시간이 없을 것입니다."
 FRA_the_Foe: "배신의 앨비언을 끝장내기"
 FRA_the_Foe_desc: "우리는 이 대륙 봉쇄를 영원히 끝낼 것입니다. 혁명의 제1의 적이 쓰러질 것입니다."
 FRA_new_order: "새로운 유럽 질서 선포"
 FRA_new_order_desc: "대륙에 대한 우리의 지배는 확고합니다. 우리는 유럽을 우리 제국 아래 통일했습니다. 유럽 역사의 새로운 장이 시작되고 있습니다."
 FRA_Expansion_policy: "확장 정책 선택"
 FRA_Expansion_policy_desc: "새로운 프랑크 왕국은 정복이라는 목표를 스스로 설정해야 합니다."
 FRA_operation_clovis: "클로비스 작전"
 FRA_operation_clovis_desc: "이른바 베네룩스 국가들로부터 프랑크 문명의 요람을 되찾을 것입니다."
 FRA_operation_bouvines: "부빈 작전"
 FRA_operation_bouvines_desc: "프랑크 제국이 탄생하려면 신성 로마 제국이 다시 한번 무너져야 합니다."
 FRA_operation_marignan: "마리냐노 작전"
 FRA_operation_marignan_desc: "이탈리아 반도를 재정복해야 합니다. 가톨릭 교회의 중심지에 대한 통제권을 되찾기 위해서입니다. 로마의 교황만이 우리에게 황제의 관을 씌울 수 있습니다."
 FRA_operation_roland: "롤랑 작전"
 FRA_operation_roland_desc: "후위는 다시는 무너지지 않을 것입니다."
 FRA_unite_frank_europe: "프랑크 민족 통일"
 FRA_unite_frank_europe_desc: "우리처럼 프랑크족의 후손인 모든 민족을 다시 통합했습니다. 프랑크 민족에게 위대한 날입니다."
 FRA_frankish_empire: "프랑크 제국 통합"
 FRA_frankish_empire_desc: "프랑크 제국이 재통일되었습니다. 베르됭 조약의 불의가 바로잡혔습니다."
 FRA_annex_puppet_king: "우리의 영유권 행사"
 FRA_annex_puppet_king_desc: "우리의 종속국 한 곳이 우리가 영유권을 주장하는 영토를 가지고 있습니다. 그 영토가 우리에게 돌아올 때가 되었습니다."
 FRA_glacis: "글라시스 돌파"
 FRA_glacis_desc: "동쪽 국가들이 우리와 우리의 운명 사이를 가로막고 있습니다. 우리는 서방을 우리의 깃발 아래 단결시켜야 합니다."
 FRA_a_war_for_europe: "유럽을 위한 전쟁"
 FRA_a_war_for_europe_desc: "서유럽 열강과 러시아는 언제나 유럽의 지배권을 두고 다투어 왔습니다. 이 분쟁을 끝내고 서방을 통일할 때가 되었습니다."
 FRA_operation_hastings: "헤이스팅스 작전"
 FRA_operation_hastings_desc: "역사를 빚어 온 이 경쟁을 끝낼 때가 되었습니다. 이번에는 100년씩 걸리지 않을 것을 약속드립니다."
 FRA_king_europe_victory: "유럽 승전 선포"
 FRA_king_europe_victory_desc: "우리의 적들은 더 이상 존재하지 않습니다. 우리는 아직 서 있는 유일한 유럽 열강입니다. 서방은 우리 뒤로 단결할 수밖에 없을 것입니다."
 FRA_recover_7_year_war_charlemagne: "왕국의 식민지 수복"
 FRA_recover_7_year_war_charlemagne_desc: "유럽은 안전합니다. 이제 우리에게서 빼앗긴 식민지에 대한 통제권을 되찾을 수 있습니다."
 FRA_start_crusade: "지중해 확보"
 FRA_start_crusade_desc: "십자군이 성지로 출발하려면 우리 항로를 따라 있는 섬들을 장악해야 합니다. 우리의 보급선을 확보해야 합니다."
 FRA_crusade_siege: "성지의 교두보"
 FRA_crusade_siege_desc: "점령자들에 대한 정면 공격으로 성지를 되찾으려면 모든 전력을 투입해야 합니다. 인근에 전력을 배치할 수 있도록 해야 합니다."
 FRA_claim_jerusalem: "성지 수복"
 FRA_claim_jerusalem_desc: "예루살렘과 성지를 탈환할 때가 왔습니다. 제10차 십자군이 목표를 달성했습니다."
 FRA_revenge_over_saladin: "중동의 안정 보장"
 FRA_revenge_over_saladin_desc: "분쟁으로 지역을 불안정하게 만드는 지역 강국들을 하나씩 격파하여 이 지역을 안정시켜야 합니다."
 FRA_king_crusade1_victory: "제10차 십자군의 승리 선포"
 FRA_king_crusade1_victory_desc: "우리는 성지를 탈환했습니다."
 FRA_kingdom_heaven: "예루살렘 왕국 선포"
 FRA_kingdom_heaven_desc: "예루살렘 왕국이 다시 일어설 것입니다."
 FRA_rally_frank: "프랑크족 보호"
 FRA_rally_frank_desc: "유럽은 곧 새로운 전쟁의 무대가 될 것입니다. 이러한 상황에서 우리의 프랑크 형제들이 그 희생양이 되지 않도록 해야 합니다."
 FRA_unite_frank: "프랑크족 재통합"
 FRA_unite_frank_desc: "우리처럼 프랑크족의 후손인 모든 민족을 다시 통합했습니다. 프랑크 민족에게 위대한 날입니다."
 FRA_noah_ark: "가톨릭 국가 결집"
 FRA_noah_ark_desc: "유럽의 가톨릭 국가들을 우리의 깃발 아래 단결시킬 것입니다."
 FRA_war_against_protestantism: "개신교와의 전쟁"
 FRA_war_against_protestantism_desc: "이단자들에 맞선 처음 여덟 차례의 십자군은 실패했습니다. 아홉 번째에는 실패하지 않을 것입니다."
 FRA_end_the_schism: "하나만이 남을 수 있다"
 FRA_end_the_schism_desc: "유럽의 수호자가 됨으로써 유럽의 모든 정교회 국가를 상대해야 합니다. 교회는 영원히 안전할 것입니다."
 FRA_king_crusade2_victory: "교회의 완전한 승리 선포"
 FRA_king_crusade2_victory_desc: "우리는 유럽 위에 군림합니다."
 FRA_recover_7_year_war_holy: "왕국의 식민지 수복"
 FRA_recover_7_year_war_holy_desc: "우리의 적들은 더 이상 존재하지 않습니다. 우리는 아직 서 있는 유일한 유럽 열강입니다. 서방은 우리 뒤로 단결할 수밖에 없을 것입니다."
 FRA_inst_civ_GER: "독일 경제에 투자"
 FRA_inst_civ_GER_desc: "독일 엔지니어링 기업에 직접 투자하여 우리 공동 연합의 산업적 근간을 강화합니다."
 FRA_inst_civ_GRE: "그리스 경제에 투자"
 FRA_inst_civ_GRE_desc: "그리스 해운업은 여전히 그 경제의 생명줄이며, 우리의 투자는 이 중요한 해양 산업을 강화합니다."
 FRA_inst_civ_ITA: "이탈리아 경제에 투자"
 FRA_inst_civ_ITA_desc: "이탈리아의 공작기계 부문을 후원하여 그 산업의 핵심을 이루는 정밀 공학 기반을 강화합니다."
 FRA_inst_civ_BEL: "벨기에 경제에 투자"
 FRA_inst_civ_BEL_desc: "벨기에의 화학 산업은 그 경제의 중심축이며, 우리의 자본은 생산 및 수출 역량을 확대할 것입니다."
 FRA_inst_civ_SPR: "스페인 경제에 투자"
 FRA_inst_civ_SPR_desc: "수십만 명의 노동자를 고용하고 있는 조립 라인을 지원하며 스페인의 자동차 부문에 투자합니다."
 FRA_inst_civ_POL: "폴란드 경제에 투자"
 FRA_inst_civ_POL_desc: "폴란드 조선소는 한때 유럽 조선업을 선도했으며, 우리의 투자는 그 산업 역량을 복원하는 데 도움이 될 것입니다."
 FRA_inst_inf_GER: "독일 교통망에 투자"
 FRA_inst_inf_GER_desc: "라인-론 회랑의 개선에 자금을 지원하여 두 경제 사이의 물류 흐름을 원활하게 합니다."
 FRA_inst_inf_GRE: "그리스 교통망에 투자"
 FRA_inst_inf_GRE_desc: "아테네-테살로니키 회랑에 대한 투자는 그리스의 주요 남북 교통 동맥을 현대화할 것입니다."
 FRA_inst_inf_ITA: "이탈리아 교통망에 투자"
 FRA_inst_inf_ITA_desc: "브렌너 회랑의 개선을 지원하여 이탈리아와 북유럽을 잇는 핵심 철도 연결을 강화합니다."
 FRA_inst_inf_BEL: "벨기에 교통망에 투자"
 FRA_inst_inf_BEL_desc: "북해-지중해 철도 회랑에 투자하여 벨기에 항구를 통과하는 화물 동맥을 강화합니다."
 FRA_inst_inf_SPR: "스페인 교통망에 투자"
 FRA_inst_inf_SPR_desc: "피레네 철도 횡단로에 대한 우리의 투자는 마침내 이베리아와 프랑스의 철도망을 제대로 연결할 것입니다."
 FRA_inst_inf_POL: "폴란드 교통망에 투자"
 FRA_inst_inf_POL_desc: "비아 발티카 회랑에 자금을 지원하여 마침내 폴란드를 더 넓은 유럽 교통망과 연결합니다."
 FRA_inst_eco_GER: "독일 생태 전환에 투자"
 FRA_inst_eco_GER_desc: "독일의 탈원전 전환을 지원하며, 그 공백을 메우는 데 필요한 재생 에너지 설비에 자금을 지원합니다."
 FRA_inst_eco_GRE: "그리스 생태 전환에 투자"
 FRA_inst_eco_GRE_desc: "그리스는 여전히 갈탄에 크게 의존하고 있으며, 우리의 투자는 더 깨끗한 에너지원으로의 전환을 가속할 것입니다."
 FRA_inst_eco_ITA: "이탈리아 생태 전환에 투자"
 FRA_inst_eco_ITA_desc: "이탈리아는 수입 가스에 위험할 정도로 의존하고 있으며, 우리의 투자는 재생 에너지로의 다변화를 지원합니다."
 FRA_inst_eco_BEL: "벨기에 생태 전환에 투자"
 FRA_inst_eco_BEL_desc: "벨기에의 탈원전 이행을 도와, 전력 공급을 유지하는 데 필요한 전력망 용량에 자금을 지원합니다."
 FRA_inst_eco_SPR: "스페인 생태 전환에 투자"
 FRA_inst_eco_SPR_desc: "스페인은 막대한 태양광 잠재력을 지니고 있으며, 우리의 투자는 재생 에너지 발전 용량의 확대를 도울 것입니다."
 FRA_inst_eco_POL: "폴란드 생태 전환에 투자"
 FRA_inst_eco_POL_desc: "폴란드는 전력의 대부분을 여전히 석탄에 의존하고 있으며, 우리의 투자는 더 깨끗한 에너지로의 전환을 지원합니다."
