 SAU_pipeline_transit_TUR_t1: "Transit par pipeline saoudien (niveau I)"
 SAU_pipeline_transit_TUR_t1_desc: "Le pétrole saoudien traverse la Turquie, et les droits de transit gonflent le Trésor. L'oléoduc élève la production d'acier et de chrome de la nation. §GRevenu supplémentaire : 1,00 Md $§!"
