l_japanese:
 Proscription_LTTE_as_a_terrorist_organization: "タミル・タイガーズのテロ組織指定"
 Proscription_LTTE_as_a_terrorist_organization_Trade: "タミル・イーラム解放のトラのテロ組織指定"
 State_sponsor_of_the_LTTE: "軍需品供給業者"
 news.91.t: "スリランカ内戦が終結"
 news.91.d: "スリランカ政府は、タミル・イーラム解放のトラ（LTTE）に対する完全な勝利を宣言した。北東部全域で行われた一連の最終攻勢により、政府軍はLTTEの最後の拠点も制圧した。戦争終盤、残存するタミル人戦闘員たちはムライティヴのラグーンやジャングル沿いで包囲された。脱出の道を断たれた彼らは、海路による脱出を試みたが、すべて阻止された。また長らく手出しできないとされてきた指導部は、紛争の最終段階で殺害されたと報じられている。[SRI.GetName]大統領は議会での演説で、国家が「テロリズムから解放された」と宣言した。今のところ、ライオンの旗は島全土で誰にも妨げられることなく翻っている。"
 news.91.a: "平和の代償は大きい……"
 news.92.t: "タミル・イーラム解放のトラ"
 news.92.d: "かつての消耗戦は終結し、タミル・イーラム解放のトラ（LTTE）が勝利を収めた。紛争の最終段階において、タミル・イーラムの地に残っていたスリランカ政府軍の最後の拠点は、容赦ない攻撃の下で崩壊した。補給路は断たれ、滑走路は焼き払われ、かつては強大だった軍隊は包囲され、見捨てられた。タミル・イーラムのトラ達は、反乱軍としてではなく、指導者としてジャングルから勝利を収めた。血と犠牲によって綴られたタミル・イーラムの夢が、ついに実現したのだ。"
 news.92.a: "興味深い"