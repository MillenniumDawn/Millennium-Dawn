 RULE_SYRIA_ARAB_SPRING_CHOICE_DEFAULT_DESC: "叙利亚将正常评估“阿拉伯之春”选项。"
 RULE_SYRIA_ARAB_SPRING_CHOICE_HISTORICAL_CIVIL_WAR_DESC: "如果“阿拉伯之春”爆发并引发历史性内战，叙利亚将确保自己做出选择。"
 RULE_SYRIA_ARAB_SPRING_CHOICE_HISTORICAL_ISIS_SPAWN_DESC: "叙利亚将始终做出阿拉伯之春时期的选择，以确保史实伊斯兰国的诞生。这也意味着史实内战的爆发。"
 RULE_SYRIA_ARAB_SPRING_CHOICE: "阿拉伯之春期间叙利亚的行为选择"
 RULE_HISTORIC_EVENTS: "史实事件触发"
 RULE_HISTORIC_EVENTS_NO: "历史事件将随机触发。这是游戏的默认设置。"
 RULE_HISTORIC_EVENTS_YES: "历史事件不会随机触发。大多数事件仍会随机触发，但某些事件将保证在其历史日期对应的月份内触发，以降低其被显著延迟的可能性。这并不意味着游戏会完全还原历史，只是有助于使其更接近历史。"
 RULE_ALLOW_MD_ANNEX: "启用边境碎块清理"
