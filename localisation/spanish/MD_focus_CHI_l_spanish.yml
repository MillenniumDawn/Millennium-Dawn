 BRI_apply_named_PORT_desc: "Solicitar a Pekín la construcción de: §Y[THIS.GetBRINextProjectPORT]§!. La solicitud cuesta 30 de Poder Político. Tras la aprobación, pagamos §Y40§! de nuestra tesorería o recibimos un préstamo chino. Requiere un Estado costero y estar en paz."
