l_english:
 STALKER.170.t: "The Second Disaster"
 STALKER.170.d: "A flash has lit the sky over the Chornobyl plant, and the instruments around the old exclusion zone have gone mad. The scientists who were still inside call it an accident in a programme named Project X. The government is drawing a new perimeter. A handful of them have already walked south, into the swamps."
 STALKER.170.a: "Close the road."
 STALKER.171.t: "The Great Emission"
 STALKER.171.d: "An emission larger than any recorded since 2006 has swept the Zone. Stalkers caught in the open are dead. From the swamps, a group called Clear Sky says the Zone is answering someone who keeps walking north."
 STALKER.171.a: "The swamps will answer for themselves."
 STALKER.172.t: "Clear Sky Goes to the Plant"
 STALKER.172.d: "Lebedev believes a stalker named Strelok is the reason the Zone keeps lashing out, and he has sent Scar north to stop him. Clear Sky is gathering in the swamps for an assault on the plant. The trader at the Cordon is buying every anti-radiation drug on the road, the Bar is full of people who do not mean to go any farther, and the Ecologist bunkers have sealed their doors."
 STALKER.172.a: "Back Clear Sky and stop Strelok."
 STALKER.172.a_tt: "Clear Sky stays in the swamps. Strelok does not reach the center in 2012."
 STALKER.172.b: "Let the assault go."
 STALKER.172.b_tt: "Clear Sky's influence falls to §R0§!. Scar survives. Strelok reaches the center in 2012 with no memory of his own name."
 STALKER.172.c: "Help Strelok through."
 STALKER.172.c_tt: "Clear Sky's influence falls to §R0§!. Scar survives. Strelok reaches the center in 2012 already knowing what is there."
 STALKER.173.t: "After the Assault"
 STALKER.173.d_spared: "Clear Sky turned Strelok back before he reached the plant. Lebedev is keeping what is left of the group in the swamps, and Scar is still with them. The center of the Zone has gone quiet."
 STALKER.173.d_marked: "An emission hit the assault on the plant. Clear Sky was wiped out. Scar walked out alone. Strelok was pulled from the center with his memory gone, and the Cordon will know him as the Marked One."
 STALKER.173.d_helped: "Clear Sky died on the road to the plant. Scar walked out alone. Strelok went through, and he still knows his own name."
 STALKER.173.a: "The Zone keeps its secrets."
 STALKER.174.t: "Operation Fairway"
 STALKER.174.d_open: "The north of the Zone is open. The army has sent five helicopters toward Pripyat to take a foothold at the plant, and none of them have reported back. Major Alexander Degtyarev is on the ground where they fell. The Ecologist bunkers want their people taken out before the next emission."
 STALKER.174.d_closed: "The army has sent helicopters toward Pripyat even though the Brain Scorcher is still running. They have gone down inside the Zone. Major Alexander Degtyarev is looking for the crews. The Ecologist bunkers want their people taken out, and there will be no foothold at the plant."
 STALKER.174.d_massacre: "The army sent helicopters toward a plant the Monolith still holds. The crews are dead, and the Monolith is already moving over the wrecks. Major Alexander Degtyarev has asked for permission to bring out whoever is still alive."
 STALKER.174.a: "Evacuate the scientists."
 STALKER.174.a_open_tt: "Ecologist influence rises by §G8§!. Military influence rises by §G5§!, and containment rises by §G5§!."
 STALKER.174.a_closed_tt: "Ecologist influence rises by §G5§!. The helicopters are lost: military influence falls by §R5§!. Containment rises by §G5§!."
 STALKER.174.b: "Hold a foothold in Pripyat."
 STALKER.174.b_tt: "Military influence rises by §G10§!, Ecologist influence by §G5§!, and containment by §G5§!. The army keeps a foothold in Pripyat."
 STALKER.174.c: "Bury the operation."
 STALKER.174.c_open_tt: "Military influence falls by §R5§!. Activity rises by §R5§!."
 STALKER.174.c_closed_tt: "Military influence falls by §R10§!. Activity rises by §R5§!."
 STALKER.174.e: "Recover who we can."
 STALKER.174.e_tt: "Military influence falls by §R10§!. The Monolith gains §R10§!, and activity rises by §R5§!."
 STALKER.175.t: "Fairway Reports"
 STALKER.175.d_evacuate_open: "The scientists are out of the bunkers, and Degtyarev's report says the helicopter crews died in the anomalies north of Pripyat. The army is still on the ground."
 STALKER.175.d_evacuate_closed: "Degtyarev brought the scientists out. The helicopters never had a chance against the Brain Scorcher, and the crews that lived are walking south."
 STALKER.175.d_foothold: "Colonel Kovalsky's men are holding a block in Pripyat. Degtyarev's report says the helicopters fell to the anomalies, and the foothold is what the operation has left."
 STALKER.175.d_bury_open: "Operation Fairway has been struck from the briefings. The helicopters are listed as lost to weather, and Degtyarev's report has been locked in a drawer."
 STALKER.175.d_bury_closed: "Operation Fairway has been struck from the briefings. The Scorcher took the helicopters, and the official story is that they never flew."
 STALKER.175.d_massacre: "Nothing came back from the plant but a radio call. The Monolith holds the wrecks, and Degtyarev has been ordered to stop looking."
 STALKER.175.a: "File the report."
 STALKER.176.t: "A Charter for the Zone"
 STALKER.176.d_scar: "The state wants a scientific institute for the Zone, SIRCAA, under a director named Dalin, and a private regiment to police it. Colonel Korshunov would command that regiment, the Ward. Scar, who walked out of Clear Sky, has people of his own now. They call themselves the Spark, and they will not accept the Ward quietly.\n\n[STALKER_field_yantar_history]"
 STALKER.176.d: "The state wants a scientific institute for the Zone, SIRCAA, under a director named Dalin, and a private regiment to police it. Colonel Korshunov would command that regiment, the Ward.\n\n[STALKER_field_yantar_history]"
 STALKER.176.a: "Charter SIRCAA and bring in the Ward."
 STALKER.176.a_scar_tt: "The Ward's influence rises to at least §Y15§!. The Spark's influence rises to at least §Y10§!."
 STALKER.176.a_tt: "The Ward's influence rises to at least §Y15§!."
 STALKER.176.b: "Keep the Zone under the army."
 STALKER.176.b_scar_tt: "Military influence rises by §G10§!. The Spark's influence rises to at least §Y10§!. The Ward is not chartered."
 STALKER.176.b_tt: "Military influence rises by §G10§!. The Ward is not chartered."
 STALKER.177.t: "SIRCAA"
 STALKER.177.d_charter_scar: "SIRCAA has its charter, and Colonel Korshunov's Ward has taken the roads the army used to patrol alone. Scar's Spark has answered by gathering stalkers who want the Zone left alone."
 STALKER.177.d_charter: "SIRCAA has its charter, and Colonel Korshunov's Ward has taken the roads the army used to patrol alone."
 STALKER.177.d_army_scar: "The government has refused SIRCAA a regiment. The army will keep the perimeter. Scar's Spark stays in the Zone, and it has not signed on with the army."
 STALKER.177.d_army: "The government has kept the Zone under the army. SIRCAA does not have its regiment."
 STALKER.177.a: "The Zone has new landlords."

 # ---- MD_STALKER_strelok_l_english.yml (consolidated) ----
 STALKER.161.t: "Strelok Reaches the Center"
 STALKER.161.d: "A stalker the Cordon calls Strelok has passed the Brain Scorcher and reached the center of [STALKER_zone_name]. He means to shut down the C-Consciousness. The Monolith is already moving to stop him, and the military wants the road closed before either of them finishes."
 STALKER.161.d_marked: "The amnesiac the Cordon called the Marked One has remembered the name Strelok. He has passed the Brain Scorcher and reached the center of [STALKER_zone_name]. He means to shut down the C-Consciousness. The Monolith is already moving to stop him, and the military wants the road closed before either of them finishes."
 STALKER.161.d_remembers: "Strelok has passed the Brain Scorcher and reached the center of [STALKER_zone_name]. He already knows what is there. He means to shut down the C-Consciousness. The trader at the Cordon says Clear Sky died trying to walk him in. The Monolith is moving to stop him, and the military wants the road closed."
 STALKER.161.a: "Let him shut the C-Consciousness down."
 STALKER.161.a_tt: "The Monolith loses up to §G40§! influence. Activity rises by §R15§!, containment falls by up to §R10§!, and the stalker population rises by §Y10§!. Strelok lives, and he remains opposed to the Zone."
 STALKER.161.b: "Stop him at the Brain Scorcher."
 STALKER.161.b_tt: "Costs §R50§! political power. Military influence and containment each rise by §G15§!, and the Monolith gains §R5§!. Strelok does not return."
 STALKER.161.c: "Leave him to the C-Consciousness."
 STALKER.161.c_tt: "The Monolith gains §R20§! influence. Activity falls by up to §G10§! and containment rises by §G5§!. Strelok does not come back as himself."
 STALKER.162.t: "The Center of the Zone"
 STALKER.162.d_turned_back: "Strelok never reached the power plant. Clear Sky turned him back in the swamps a year ago, and the center has stayed shut."
 STALKER.162.d_shutdown_marked: "The Marked One remembered the name Strelok at the center of the Zone and shut the C-Consciousness down. The Monolith's outer posts have gone quiet. The emissions have not."
 STALKER.162.d_shutdown_remembers: "Strelok reached the center knowing the C-Consciousness was there, and he shut it down. The Monolith's outer posts have gone quiet. The emissions have not."
 STALKER.162.d_shutdown: "Strelok reached the center of the Zone and shut the C-Consciousness down. The Monolith's outer posts have gone quiet. The emissions have not."
 STALKER.162.d_stopped: "The army turned Strelok back before he reached the power plant. The Brain Scorcher is still running, and the Monolith still holds the center."
 STALKER.162.d_taken: "Strelok entered the center and did not come out. The Monolith's patrols are moving south again, and the Zone has gone quiet in a way nobody trusts."
 STALKER.162.a: "The Zone is still there."

 # ---- MD_STALKER_field_campaigns_l_english.yml (consolidated) ----
 STALKER.200.a: "Authorize the first assignment."
 STALKER.200.a_tt: "Unlock a 25 Political Power investigation lasting 60 days."
 STALKER.200.b: "Leave the case unresolved."
 STALKER.200.b_tt: "Close this campaign without its rewards. Bandits gain 10 influence; the next campaign can begin."
 STALKER.200.t: "Yantar: The Silent Survey"
 STALKER.200.d: "A survey party has stopped answering the Ecologists at Yantar. Its last instruments agreed on nothing: a clear road, a lethal radiation reading, and voices on an unused channel. The scientists want an escort to recover the equipment before another group takes it."
 STALKER.201.a: "Prepare the recovery assignment."
 STALKER.201.a_tt: "Unlock a 50 Political Power field intervention lasting 60 days."
 STALKER.201.t: "The Survey Markers"
 STALKER.201.d: "The escort finds markers laid by two different parties. One points toward the missing camp; the other follows a safer ridge. The surviving technician insists that the instruments, rather than the missing people, were the intended prize."
 STALKER.202.a: "Share the findings with the Ecologists."
 STALKER.202.a_tt: "Scientists gain 10 influence and exploitation rises by 5. Preserved findings aid the 2018 SIRCAA decision."
 STALKER.202.b: "Restrict the route and seal the readings."
 STALKER.202.b_tt: "Containment rises by 10 and exploitation falls by 5. The findings remain restricted."
 STALKER.202.c: "Place the project under military supervision."
 STALKER.202.c_tt: "The military gains 10 influence and scientists lose 5. Civilian access is restricted."
 STALKER.202.t: "The Yantar Record"
 STALKER.202.d: "The recovered readings can guide later research, but publishing the route would draw more stalkers into the same anomalies. The Ecologists, the perimeter command, and their military escort each ask for custody of the record."
 STALKER_field_name_1: "Yantar: The Silent Survey"
 STALKER.203.a: "Authorize the first assignment."
 STALKER.203.a_tt: "Unlock a 25 Political Power investigation lasting 60 days."
 STALKER.203.b: "Leave the case unresolved."
 STALKER.203.b_tt: "Close this campaign without its rewards. Bandits gain 10 influence; the next campaign can begin."
 STALKER.203.t: "Army Warehouses: The Contested Road"
 STALKER.203.d: "Duty blames Freedom for a missing supply convoy. Freedom says the checkpoint diverted it onto a bandit road. Both offer guides, and both demand authority over the route before the next convoy leaves the Army Warehouses."
 STALKER.204.a: "Prepare the recovery assignment."
 STALKER.204.a_tt: "Unlock a 50 Political Power field intervention lasting 60 days."
 STALKER.204.t: "Tracks at the Checkpoint"
 STALKER.204.d: "Spent cartridges and altered convoy papers undermine both factions' first accounts. The supplies were diverted after the patrol changed shifts. There is time to secure the next convoy, provided someone accepts responsibility for its passage."
 STALKER.205.a: "Negotiate shared passage."
 STALKER.205.a_tt: "Duty and Freedom each gain 5 influence; activity falls by 5. Secured passage reduces the 2022 containment loss by 5."
 STALKER.205.b: "Give Duty responsibility for the road."
 STALKER.205.b_tt: "Duty gains 10 influence; Freedom and bandits lose 5. Secured passage reduces the 2022 containment loss by 5."
 STALKER.205.c: "Authorize Freedom's escorts."
 STALKER.205.c_tt: "Freedom gains 10 influence; Duty and bandits lose 5. Secured passage reduces the 2022 containment loss by 5."
 STALKER.205.t: "The Road Agreement"
 STALKER.205.d: "The convoy reaches the warehouses. Its escort can leave the road under one faction, or broker a passage agreement neither faction can enforce alone. The stalkers who carried the supplies ask only that the checkpoints stop changing without warning."
 STALKER_field_name_2: "Army Warehouses: The Contested Road"
 STALKER.206.a: "Authorize the first assignment."
 STALKER.206.a_tt: "Unlock a 25 Political Power investigation lasting 60 days."
 STALKER.206.b: "Leave the case unresolved."
 STALKER.206.b_tt: "Close this campaign without its rewards. Bandits gain 10 influence; the next campaign can begin."
 STALKER.206.t: "Red Forest: The Returning Patrol"
 STALKER.206.d: "A patrol reported missing in the Red Forest has returned with one fewer member and two accounts of the same night. A recovered radio carries a mercenary call sign. The men remember receiving orders from their own command on a frequency it never used."
 STALKER.207.a: "Prepare the recovery assignment."
 STALKER.207.a_tt: "Unlock a 50 Political Power field intervention lasting 60 days."
 STALKER.207.t: "A Voice on the Wrong Channel"
 STALKER.207.d: "The first debriefing finds a recorded command among bursts of psi interference. The mercenaries were following the patrol's instruments rather than its route. A second team must recover the abandoned recorder before the remaining witness changes his account again."
 STALKER.208.a: "Protect the witnesses and preserve the record."
 STALKER.208.a_tt: "Stalkers gain 10 influence and mercenaries lose 5. The record discounts one MDST purge to 50 Political Power for the Zone controller."
 STALKER.208.b: "Examine the recorder under scientific supervision."
 STALKER.208.b_tt: "Scientists gain 10 influence and activity rises by 5. Gain one 25% electronics research bonus and one discounted MDST purge."
 STALKER.208.c: "Destroy the material and conceal the losses."
 STALKER.208.c_tt: "Containment rises by 10 and stalkers lose 5 influence. The witnesses' evidence cannot be used against MDST."
 STALKER.208.t: "The Red Forest Evidence"
 STALKER.208.d: "The recorder survives. Its voices can help an investigator recognize a compromised channel, but the living witnesses need protection. The perimeter command offers to close the file; the scientists ask to examine it before its contents disappear into another classified archive."
 STALKER_field_name_3: "Red Forest: The Returning Patrol"
 STALKER_field_investigate: "Investigate the field report"
 STALKER_field_investigate_desc: "Commit 25 Political Power to this assignment. It takes 60 days and follows the original Zone if control changes. The report reaches the current controller on the next monthly pulse."
 STALKER_field_recover: "Send the recovery assignment"
 STALKER_field_recover_desc: "Commit 50 Political Power to this assignment. It takes 60 days and follows the original Zone if control changes. The report reaches the current controller on the next monthly pulse."
 STALKER_field_supplies: "Escort scientific supplies"
 STALKER_field_supplies_desc: "Spend 25 Political Power on a 60-day scientific supply escort. On completion: scientists and containment each rise by 5. The next escort opens after 180 days. This grants no research or later campaign payoff."
 STALKER_field_patrol: "Patrol the contested road"
 STALKER_field_patrol_desc: "Spend 25 Political Power on a 60-day patrol. On completion: bandits and activity each fall by 5. An accord adds 5 Duty and 5 Freedom; backing one faction adds 5 to it and removes 5 from its rival. The next patrol opens after 180 days. This grants no research or later campaign payoff."
 STALKER_field_campaign_category: "Zone Field Campaigns"
 STALKER_field_campaign_category_desc: "[STALKER_field_campaign_name]\n[STALKER_field_assignment_status]\nReports and completed outcomes remain with the original Zone. Only one field assignment can run at a time. Unfinished dossiers close without preparation benefits when the 2022 battle begins."
 STALKER_field_name_done: "The field campaign register is complete or awaits the Zone's opening policy."
