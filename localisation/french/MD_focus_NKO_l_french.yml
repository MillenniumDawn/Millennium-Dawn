 NKO_naval_invest_specops_tt: "§HOpérations spéciales navales§! progression : §G+5§! (§Y[?NKO_naval_specops_progress|0]§!§L/100§!)"
 NKO_naval_focus_submarine_track_tt: "§HDoctrine navale Songun Poussée sous-marine§!\n• Points de montée navale : §G+3§!\n• Progression de la §YForce sous-marine§! : §G+15§! (vers le palier suivant)\n• Ajoute l'idée §HÉlan d'exercices de la force sous-marine§! pendant §Y90§! jours\n  §L+5 % org. marine, +5 % portée max. marine, +10 % gain d'XP marine§!\n• Le Bureau sous-marin débloque les traits OIM : §YProduction sous-marine§! et §YMatériaux de revêtement§!\n• Les paliers basculent à §Y25§!/§Y50§!/§Y75§!/§Y100§! de progression au prochain clic sur §HInvestir dans la force sous-marine§!\n• Déclenche l'événement unique §HLes coques sous-marines nationales prennent forme§!"
 NKO_naval_focus_strategy_tt: "§HDoctrine navale Songun Poussée stratégique§!\n• Points de montée navale : §G+5§!\n• Progression des §Yquatre voies§! : §G+5§! (sous-marins, vedettes, défense côtière, FS navales)\n• Ajoute l'idée §HÉlan de stratégie navale§! pendant §Y180§! jours\n  §L-10 % coût de doctrine navale, +15 % gain d'XP marine, +5 % org. marine§!\n• Le Bureau sous-marin débloque le trait OIM : §YDépartement des moteurs de soutien§!\n• Le Bureau des destroyers débloque le trait OIM : §YBlindage lourd moderne§!\n• Les paliers basculent au prochain clic §HInvestir§! de chaque voie une fois §Y25§!/§Y50§!/§Y75§!/§Y100§! atteint\n• Déclenche l'événement unique §HUne doctrine stratégique pour la mer§!"
 NKO_naval_focus_destroyer_buildup_tt: "§HDoctrine navale Songun Montée des destroyers§!\n• Points de montée navale : §G+3§!\n• Progression des §YFlotilles de vedettes lance-missiles§! : §G+15§! (vers le palier suivant)\n• Progression du §YRéseau de défense côtière§! : §G+5§!\n• Ajoute l'idée §HÉlan d'essaim de vedettes§! pendant §Y90§! jours\n  §L+5 % vitesse navale, +10 % attaque de frappe navale, +10 % gain d'XP marine§!\n• Le Bureau des destroyers débloque les traits OIM : §YProduction de navires lourds§! et §YInvestissement dans la survivabilité§!\n• Les paliers basculent au prochain clic §HInvestir§! de chaque voie une fois §Y25§!/§Y50§!/§Y75§!/§Y100§! atteint\n• Déclenche l'événement unique §HPremiers destroyers nationaux§!"
 NKO_naval_focus_destroyer_unleashed_tt: "§HDoctrine navale Songun Destroyers déchaînés§!\n• Points de montée navale : §G+5§!\n• Progression des §YFlotilles de vedettes lance-missiles§! : §G+20§! (vers le palier suivant)\n• Progression du §YRéseau de défense côtière§! : §G+10§!\n• Ajoute l'idée §HÉlan d'essaim de vedettes§! pendant §Y180§! jours\n  §L+5 % vitesse navale, +10 % attaque de frappe navale, +10 % gain d'XP marine§!\n• Le Bureau des destroyers débloque les traits OIM : §YSoutien au combat terrestre§! et §YBatteries antiaériennes§!\n• Les paliers basculent au prochain clic §HInvestir§! de chaque voie une fois §Y25§!/§Y50§!/§Y75§!/§Y100§! atteint\n• Déclenche l'événement unique §HEscadrons de destroyers déchaînés§!"
 NKO_naval_focus_missile_boat_track_tt: "Si la §HDoctrine navale Songun§! est débloquée : §G+3§! points de montée navale et §G+10§! de progression des flotilles de vedettes, les passages de palier déclenchant leurs événements."
 NKO_naval_focus_coastal_defense_track_tt: "Si la §HDoctrine navale Songun§! est débloquée : §G+3§! points de montée navale et §G+10§! de progression du réseau de défense côtière, les passages de palier déclenchant leurs événements."
 NKO_naval_focus_specops_track_tt: "Si la §HDoctrine navale Songun§! est débloquée : §G+3§! points de montée navale et §G+10§! de progression des opérations spéciales navales, les passages de palier déclenchant leurs événements."
 NKO_naval_capstone_news_tt: "Diffuse un §Hévénement d'actualité majeur§! : §Y« La ceinture maritime de Pyongyang est forgée »§!   célébré au pays, remarqué à l'étranger."
 NKO_naval_allocate_party_funds: "Allouer les fonds du parti"
 NKO_naval_allocate_party_funds_desc: "Rediriger discrètement les indemnités du Parti vers le programme naval. Un filet de ressources fiable, au prix du capital politique."
 NKO_naval_mobilize_nampo_shipyards: "Mobiliser les chantiers navals de Nampo"
 NKO_naval_mobilize_nampo_shipyards_desc: "Immobiliser une usine civile à Nampo pour trois mois de fabrication en heures supplémentaires. Les chantiers nous récompensent d'un surcroît de points de montée à l'achèvement."
 NKO_naval_juche_drive: "Lancement d'une campagne navale du Juche"
 NKO_naval_juche_drive_desc: "Une mobilisation nationale pour la flotte. Les chantiers tournent à plein régime pendant six mois tandis que l'économie civile absorbe le coût, et le programme gagne d'un coup un afflux de points. Exige un front intérieur stable."
 NKO_naval_invest_submarine: "Investir dans la force sous-marine"
 NKO_naval_invest_submarine_desc: "Dépenser un point de montée navale pour faire progresser la voie sous-marine. Les équipages gagnent de l'expérience navale à mesure que les conceptions mûrissent. Franchir §Y25§!, §Y50§!, §Y75§! et §Y100§! de progression débloque le palier suivant de modernisation sous-marine."
 NKO_naval_invest_missile_boat: "Investir dans les flottilles de vedettes lance-missiles"
 NKO_naval_invest_missile_boat_desc: "Dépenser un point de montée navale pour élargir le programme de vedettes. Chaque cycle de refonte affine notre frappe littorale. Franchir §Y25§!, §Y50§!, §Y75§! et §Y100§! de progression débloque le palier suivant des vedettes."
 NKO_naval_invest_coastal_defense: "Investir dans le réseau de défense côtière"
 NKO_naval_invest_coastal_defense_desc: "Dépenser un point de montée navale pour durcir le littoral. Équipages de bunkers et batteries côtières gagnent de l'expérience. Franchir §Y25§!, §Y50§!, §Y75§! et §Y100§! de progression débloque le palier suivant de défense côtière."
 NKO_naval_invest_specops: "Investir dans les opérations spéciales navales"
 NKO_naval_invest_specops_desc: "Dépenser un point de montée navale pour former hommes-grenouilles du Bureau de reconnaissance et infanterie navale. Les forces spéciales affûtent leurs compétences amphibies. Franchir §Y25§!, §Y50§!, §Y75§! et §Y100§! de progression débloque le palier suivant des opérations spéciales navales."
 NKO_naval_capstone_complete: "Forger la ceinture maritime"
 NKO_naval_capstone_complete_desc: "Les quatre voies ont atteint leur palier final. Déclarez la Doctrine navale Songun achevée et accordez au pays son bonus durable."
 NKO_songun_navy_capstone: "Doctrine navale du Songun"
 NKO_songun_navy_capstone_desc: "Des années de montée concentrée ont forgé une marine asymétrique cohérente. Sous-marins à long rayon, essaims de vedettes, défenses côtières étagées et forces spéciales navales d'élite opèrent désormais comme une seule doctrine."
 NKO_sub_drill_momentum: "Dynamisme des exercices de la Force sous-marine"
 NKO_sub_drill_momentum_desc: "Les récents exercices ont relevé le moral et la discipline procédurale dans tout le service silencieux."
 NKO_mb_swarm_momentum: "Momentum de l'essaim de bateaux lance-missiles"
 NKO_mb_swarm_momentum_desc: "Les flotilles surfent sur une vague de confiance après leurs derniers exercices."
 NKO_cd_bunker_momentum: "Alerte élevée de la ceinture de bunker"
 NKO_cd_bunker_momentum_desc: "Les garnisons côtières sont en alerte renforcée ; les ingénieurs accélèrent les fortifications au double du rythme."
 NKO_so_recon_momentum: "Rythme de fonctionnement du bureau de reconnaissance"
 NKO_so_recon_momentum_desc: "Le Bureau de reconnaissance tourne à plein régime, équipes d'hommes-grenouilles et cadres FS navales en rotation constante."
 NKO_naval_strategy_momentum: "Dynamique de la stratégie navale"
 NKO_naval_strategy_momentum_desc: "Une doctrine stratégique unifiée a galvanisé tous les bureaux navals. Recherche, formation et organisation de la flotte bénéficient du regain de sens."
 NKO_sub_tier_1: "Modernisation Sang-O"
 NKO_sub_tier_1_desc: "Refontes et formation d'équipages dans toute la flotte côtière Sang-O."
 NKO_sub_tier_2: "Programme de sous-marins de poche Yono"
 NKO_sub_tier_2_desc: "Les infiltrateurs de classe Yono et de meilleures contre-mesures sonar étendent notre portée."
 NKO_sub_tier_3: "Révision de la Classe Roméo"
 NKO_sub_tier_3_desc: "Les coques Romeo reçoivent de nouvelles électroniques, batteries et une propulsion plus silencieuse."
 NKO_sub_tier_4: "Programme SLBM Sinpo"
 NKO_sub_tier_4_desc: "Le sous-marin de classe Sinpo met en œuvre la famille Pukguksong. Portée stratégique, véritable dissuasion."
 NKO_mb_tier_1: "Komar rénove"
 NKO_mb_tier_1_desc: "Les vieilles coques Komar reçoivent de nouveaux lanceurs et des moteurs plus puissants."
 NKO_mb_tier_2: "Production Soju et Nongo"
 NKO_mb_tier_2_desc: "Les vedettes nationales Soju et Nongo entrent en service en nombre croissant."
 NKO_mb_tier_3: "Intégration ASCM Kumsong-3"
 NKO_mb_tier_3_desc: "Les missiles de croisière antinavires Kumsong-3 donnent à nos flotilles une frappe longue portée crédible."
 NKO_mb_tier_4: "Doctrine de meute"
 NKO_mb_tier_4_desc: "Tactiques d'essaim coordonnées : salves, ECM étagé et vedettes-leurres."
 NKO_cd_tier_1: "Ceinture de bunker"
 NKO_cd_tier_1_desc: "Une chaîne continue de bunkers renforcés le long des côtes est et ouest."
 NKO_cd_tier_2: "Artillerie côtière mobile"
 NKO_cd_tier_2_desc: "Des batteries montées sur camion se déplacent entre des positions préparées pour déjouer les tirs de contre-batterie."
 NKO_cd_tier_3: "Caps fortifiés"
 NKO_cd_tier_3_desc: "Les caps stratégiques reçoivent tunnels profonds, soutes durcies et radars intégrés."
 NKO_cd_tier_4: "Missiles antinavires basés à terre"
 NKO_cd_tier_4_desc: "Les lanceurs Kumsong mobiles nient aux flottes adverses le droit d'approcher notre côte."
 NKO_so_tier_1: "Hommes-grenouilles du Bureau de reconnaissance"
 NKO_so_tier_1_desc: "Les équipes d'hommes-grenouilles du Bureau général de reconnaissance élargissent formation et parc d'équipement."
 NKO_so_tier_2: "Brigade de tireurs d'élite de la mer"
 NKO_so_tier_2_desc: "Une brigade dédiée de tireurs d'élite maritimes se spécialise dans les raids côtiers rapides."
 NKO_so_tier_3: "Infanterie légère maritime"
 NKO_so_tier_3_desc: "Des bataillons d'infanterie légère sont réorganisés avec un élément maritime pour les opérations amphibies."
 NKO_so_tier_4: "Corps d'assaut naval"
 NKO_so_tier_4_desc: "Les éléments du Storm Corps reçoivent des rattachements navals permanents. Notre pointe de lance atteint n'importe quel rivage."
 nko_naval_buildup.1.t: "Une doctrine navale pour la nouvelle ère"
 nko_naval_buildup.1.d: "L'État-major a préparé un plan à long terme : quatre voies parallèles, avancées par l'accumulation de points de montée navale. Trois décisions génèrent des points ; quatre décisions d'investissement les dépensent. Atteignez le palier final de chaque voie pour forger la Doctrine navale Songun."
 nko_naval_buildup.1.a: "Nous dirigerons le programme."
 nko_naval_buildup.11.t: "Les équipes de Sang-O intensifient leurs efforts"
 nko_naval_buildup.11.d: "Les chantiers de refonte liquident un arriéré de coques Sang-O. Les équipages s'entraînent jour et nuit et la confiance dans le service silencieux grandit."
 nko_naval_buildup.11.a: "En avant."
 nko_naval_buildup.12.t: "Les Yono nains glissent entre les filets"
 nko_naval_buildup.12.d: "Les infiltrateurs de classe Yono mènent des exercices réussis contre nos propres radars côtiers, échappant à des lignes de détection qui auraient dû les attraper."
 nko_naval_buildup.12.a: "Un véritable avantage."
 nko_naval_buildup.13.t: "Roméo révise Bear Fruit"
 nko_naval_buildup.13.d: "Les Romeo modernisés patrouillent désormais plus loin et plus silencieusement que leurs concepteurs originels ne l'imaginaient."
 nko_naval_buildup.13.a: "Excellent."
 nko_naval_buildup.14.t: "Surfaces Sinpo"
 nko_naval_buildup.14.d: "Le sous-marin de classe Sinpo fait surface dans les délais, tubes Pukguksong montés et testés. La dissuasion stratégique n'est plus un rêve."
 nko_naval_buildup.14.a: "Gloire au programme."
 nko_naval_buildup.21.t: "Les rénovations de Komar sont terminées"
 nko_naval_buildup.21.d: "Les vieilles coques Komar quittent les chantiers avec de nouveaux lanceurs, des moteurs plus puissants et des équipages étonnamment agressifs."
 nko_naval_buildup.21.a: "Un bon début."
 nko_naval_buildup.22.t: "Les flotilles Soju et Nongo se forment"
 nko_naval_buildup.22.d: "Les premières flotilles dédiées Soju et Nongo se constituent. Plus rapides, plus légères et bien plus dangereuses que ce qui précède."
 nko_naval_buildup.22.a: "Continuer."
 nko_naval_buildup.23.t: "Le Kumsong-3 prend la mer"
 nko_naval_buildup.23.d: "Les missiles antinavires Kumsong-3 achèvent leurs derniers essais à bord. Nos flotilles peuvent désormais frapper à des portées que l'ennemi ne peut facilement contrer."
 nko_naval_buildup.23.a: "Portée étendue."
 nko_naval_buildup.24.t: "Doctrine de meute adoptée"
 nko_naval_buildup.24.d: "Salves, brouillage étagé et vedettes-leurres : la doctrine de meute est formellement adoptée dans toute la flotte de vedettes."
 nko_naval_buildup.24.a: "La meute est prête."
 nko_naval_buildup.31.t: "Ceinture de bunker complète"
 nko_naval_buildup.31.d: "Une chaîne continue de bunkers renforcés s'étend désormais sur les deux littoraux. Les commandants locaux rapportent une nette amélioration du moral des garnisons."
 nko_naval_buildup.31.a: "Tenir la ligne."
 nko_naval_buildup.32.t: "Artillerie côtière mobile déployée"
 nko_naval_buildup.32.d: "Les batteries montées sur camions répètent leurs manœuvres de tir et repli jusqu'à pouvoir quitter une position de tir avant l'arrivée des obus de contre-batterie."
 nko_naval_buildup.32.a: "Travail discipliné."
 nko_naval_buildup.33.t: "Caps fortifiés"
 nko_naval_buildup.33.d: "Les caps les plus stratégiques reçoivent tunnels profonds, soutes durcies et radars intégrés. Les planificateurs adverses font désormais face à une côte véritablement défendue."
 nko_naval_buildup.33.a: "Côte de fer."
 nko_naval_buildup.34.t: "Missiles antinavires basés à terre en ligne"
 nko_naval_buildup.34.d: "Les batteries Kumsong mobiles prennent position sur le littoral. Toute approche de nos rives se paiera cher."
 nko_naval_buildup.34.a: "Laissez-les venir."
 nko_naval_buildup.41.t: "Agrandissement de la piscine Frogman"
 nko_naval_buildup.41.d: "Le Bureau général de reconnaissance double discrètement le recrutement d'hommes-grenouilles et standardise son matériel de plongée."
 nko_naval_buildup.41.a: "Former le cadre."
 nko_naval_buildup.42.t: "La brigade des tireurs d'élite des mers se lève"
 nko_naval_buildup.42.d: "Une brigade dédiée de snipers maritimes est officiellement activée. Ses premiers exercices contre des cibles côtières simulées dépassent les attentes."
 nko_naval_buildup.42.a: "Aiguisé."
 nko_naval_buildup.43.t: "L'infanterie légère passe à la marine"
 nko_naval_buildup.43.d: "Des bataillons d'infanterie légère sélectionnés sont réorganisés avec un élément maritime. La doctrine amphibie dépasse désormais une poignée d'unités spécialisées."
 nko_naval_buildup.43.a: "Sur n’importe quel rivage."
 nko_naval_buildup.44.t: "Le Storm Corps prend la mer"
 nko_naval_buildup.44.d: "Les éléments du Storm Corps reçoivent des rattachements navals permanents. Notre pointe de lance est désormais une véritable force mer-terre."
 nko_naval_buildup.44.a: "Frappez n’importe où."
 nko_naval_buildup.51.t: "Exercice naval à Wonsan"
 nko_naval_buildup.51.d: "La flottille sous-marine de Wonsan a son exercice trimestriel au calendrier. Les équipages attendent les ordres avant d'appareiller."
 nko_naval_buildup.51.a: "Appuyer fort, les faire suer"
 nko_naval_buildup.51.b: "Un rythme mesuré et routinier suffira"
 nko_naval_buildup.51.c: "Annuler, carburant et pièces manquent"
 nko_naval_buildup.52.t: "Navire de reconnaissance étranger aperçu"
 nko_naval_buildup.52.d: "Le radar côtier peint un navire non identifié qui stationne dans nos eaux revendiquées. Le commandant du rivage veut une décision."
 nko_naval_buildup.52.a: "Intercepter et le renvoyer"
 nko_naval_buildup.52.b: "Le suivre à distance mais ne pas engager"
 nko_naval_buildup.52.c: "Se retirer, éviter un incident"
 nko_naval_buildup.53.t: "Crise de défection des sous-marins"
 nko_naval_buildup.53.d: "Un officier subalterne d'un de nos sous-marins de patrouille a disparu lors d'une escale. Le Bureau de reconnaissance veut l'autorisation d'agir."
 nko_naval_buildup.53.a: "Envoyer le corps Storm, récupérer ou éliminer"
 nko_naval_buildup.53.b: "Suivre passivement, sans opération"
 nko_naval_buildup.53.c: "Enterrer le rapport"
 nko_naval_buildup.54.t: "Les chantiers de Nampo dépassent leur quota"
 nko_naval_buildup.54.d: "Les contremaîtres des chantiers de Nampo rapportent un mois record. La main-d'œuvre est galvanisée mais fatiguée."
 nko_naval_buildup.54.a: "Les récompenser publiquement d'une ration bonus"
 nko_naval_buildup.54.b: "En demander plus, le quota a toujours été bas"
 nko_naval_buildup.56.t: "Un navire contrebandier capturé"
 nko_naval_buildup.56.d: "Une patrouille côtière saisit un petit navire de contrebande. Le commandant local demande comment traiter la prise."
 nko_naval_buildup.56.a: "Le montrer à la télévision, victoire de propagande"
 nko_naval_buildup.56.b: "Saisie discrète, intégrer la cargaison aux stocks"
 nko_naval_buildup.56.c: "Prendre le pot-de-vin du capitaine et détourner le regard"
 nko_naval_buildup.60.t: "Le service silencieux marche la tête haute"
 nko_naval_buildup.60.d: "Le Sinpo et ses sœurs rentrent au port, pavillons triomphants. L'arme sous-marine de la Marine populaire de Corée a atteint sa maturité. Une force sous-marine crédible protégeant la Patrie."
 nko_naval_buildup.60.a: "Les profondeurs sont nôtres."
 nko_naval_buildup.61.t: "Loups de la côte"
 nko_naval_buildup.61.d: "La doctrine de meute est formellement adoptée dans chaque flottille. Salves, ECM étagé et vedettes-leurres. Nos forces de frappe littorale opèrent comme un seul organisme."
 nko_naval_buildup.61.a: "Lâcher les loups."
 nko_naval_buildup.62.t: "La côte de fer"
 nko_naval_buildup.62.d: "De Sinuiju à Wonsan, chaque approche est verrouillée par bunkers durcis, artillerie mobile et missiles antinavires côtiers. Nulle flotte n'approchera notre côte indemne."
 nko_naval_buildup.62.a: "Le mur tient."
 nko_naval_buildup.63.t: "Le corps Storm prend la mer"
 nko_naval_buildup.63.d: "Les éléments du Storm Corps prennent place dans l'ordre de bataille maritime. Bureau de reconnaissance, snipers marins, hommes-grenouilles et infanterie légère navale forment désormais une seule pointe d'élite capable de frapper n'importe quel rivage."
 nko_naval_buildup.63.a: "Frappez n’importe où."
 nko_naval_buildup.70.t: "Une doctrine stratégique pour la mer"
 nko_naval_buildup.70.d: "Le bureau naval de l'État-major ratifie une doctrine unifiée : sous-marins étagés, essaims de vedettes, côtes fortifiées et commandos navals travaillant de concert. Chaque chantier, base et école de formation tire désormais dans le même sens."
 nko_naval_buildup.70.a: "Tous à bord du programme."
 nko_naval_buildup.71.t: "Les premiers destroyers nationaux quittent leurs amarres"
 nko_naval_buildup.71.d: "Les chantiers de Nampo et Wonsan lancent les premiers destroyers lance-missiles construits chez nous depuis des années. Les équipages envahissent les nouvelles coques, jusqu'à la mise en service. La flotte de surface se sent à nouveau vivante."
 nko_naval_buildup.71.a: "Les envoyer en mer."
 nko_naval_buildup.72.t: "Les coques de sous-marins domestiques prennent forme"
 nko_naval_buildup.72.d: "Les chantiers sous-marins sortent de nouveaux bateaux d'attaque à un rythme serré. Les équipages formés sur les anciennes coques Sang-O et Romeo sont rotés vers les nouvelles plates-formes, accélérant la qualification."
 nko_naval_buildup.72.a: "Discrètement, vers les profondeurs."
 nko_naval_buildup.73.t: "Des escadrons de destroyers se déchaînent"
 nko_naval_buildup.73.d: "Un escadron complet de destroyers, construit et équipé chez nous, se déploie à la Flotte de l'Est. Combiné aux flotilles de vedettes formées à la meute, l'ordre de bataille de surface devient un dissuasif sérieux."
 nko_naval_buildup.73.a: "Que les escadrons courent."
 nko_naval_buildup.74.t: "Une flotte moderne se réveille"
 nko_naval_buildup.74.d: "La coque de destroyer millésime 2005 et le sous-marin d'attaque classe 1995 entrent ensemble dans nos chantiers, baptisés §Yclasse Choe Hyon§! et §Yclasse Sinpo§!. Cinq de chaque ont été livrés au stock, et des chaînes dédiées aux deux classes sont déjà posées à Nampo et Wonsan le §HBureau des sous-marins§! et le §HBureau des navires de surface§! prenant le commandement direct.\n\nLe jalon débloque les traits OIM de palier tardif dans les deux bureaux : §YArmes mer-terre§!, §YMatériaux modernes§! et §YConception sous-marine affinée§! au Bureau sous-marin, et §YProduction optimisée§! et §YTechnologie radar à grande échelle§! au Bureau des navires de surface."
 nko_naval_buildup.74.a: "Une ère d'acier commence."
 nko_naval_buildup.99.t: "La ceinture maritime de Pyongyang se forge"
 nko_naval_buildup.99.d: "Après des années d'effort concentré, la Marine populaire de Corée achève la Doctrine navale Songun. Sous-marins à long rayon, essaims de vedettes, défenses côtières étagées et forces spéciales navales d'élite opèrent comme un tout. La flotte asymétrique est un fait."
 nko_naval_buildup.99.a: "La ceinture maritime est forgée."
 nko_naval_buildup.99.b: "La marine de Pyongyang se modernise."
 NKO_naval_modern_fleet_milestone: "Commissionner la flotte moderne"
 NKO_naval_modern_fleet_milestone_desc: "Le sous-marin d'attaque de classe Sinpo et le destroyer de classe Choe Hyon ont atteint la capacité de production. Commissionnez les cinq premières coques de chaque classe dans la Marine populaire de Corée, semez des chaînes de production dédiées et attribuez des fonds aux deux bureaux navals."
 NKO_more_arms_factories_desc: "L'industrie militaire ne doit pas stagner, plus d'usines pour notre armée !"
 NKO_spa_focus_lifts_industry_tt: "§GSupprime définitivement la pénalité permanente §!§Y« Stagnation industrielle »§!§G.§!"
 NKO_spa_focus_lifts_production_tt: "§GSupprime définitivement la pénalité permanente §!§Y« Déclin des chaînes de production »§!§G.§!"
 NKO_spa_focus_lifts_military_tt: "§GSupprime définitivement la pénalité permanente §!§Y« Force creuse »§!§G.§!"
 NKO_spa_focus_lifts_economy_tt: "§GSupprime définitivement la pénalité permanente §!§Y« Thésaurisation des ressources »§!§G.§!"
 NKO_spa_focus_lifts_research_tt: "§GSupprime définitivement la pénalité permanente §!§Y« Stagnation de la recherche »§!§G.§!"
 NKO_spa_focus_lifts_agriculture_tt: "§GSupprime définitivement la pénalité permanente §!§Y« Agriculture de subsistance »§!§G.§!"
 NKO_spa_focus_lifts_foreign_tt: "§GSupprime définitivement la pénalité permanente §!§Y« Isolement diplomatique »§!§G.§!"
 NKO_spa_focus_lifts_construction_tt: "§GSupprime définitivement la pénalité permanente §!§Y« Goulot de construction »§!§G (infrastructure défensive).§!"
 NKO_spa_umbrella: "Assemblée populaire suprême"
 NKO_spa_umbrella_desc: "L'Assemblée populaire suprême vous permet de garder §Yjusqu'à deux mandats de productivité§! actifs à la fois. Chaque mandat suspend l'un des huit dysfonctionnements chroniques de la planification centrale pendant §Y365 jours§! et applique son propre bonus ; lorsqu'un mandat expire, son créneau se libère. Les pénalités permanentes peuvent être supprimées définitivement en achevant les focuses correspondants."
 NKO_spa_debuff_industry: "Stagnation industrielle"
 NKO_spa_debuff_industry_desc: "Des décennies d'allocation centrale ont laissé les usines affamées d'intrants et de main-d'œuvre qualifiée. La construction rampe."
 NKO_spa_debuff_production: "Dégradation de la chaîne de production"
 NKO_spa_debuff_production_desc: "L'outillage est usé, les chaînes improvisées, et le contrôle qualité est ce que le contremaître décide ce matin-là."
 NKO_spa_debuff_military: "Force creuse"
 NKO_spa_debuff_military_desc: "Sur le papier, l'Armée populaire de Corée compte des millions d'hommes. En pratique, l'entraînement est du théâtre et le moral est fragile."
 NKO_spa_debuff_economy: "Accumulation de ressources"
 NKO_spa_debuff_economy_desc: "Les cadres provinciaux écument ce qui transite par leurs districts. Les ressources allouées au centre arrivent en retard, en sous-poids, ou pas du tout."
 NKO_spa_debuff_research: "Stagnation de la recherche"
 NKO_spa_debuff_research_desc: "Sanctions, fuite des cerveaux et mauvais matériel de laboratoire rendent même la recherche de base nettement plus lente."
 NKO_spa_debuff_agriculture: "Agriculture de subsistance"
 NKO_spa_debuff_agriculture_desc: "Les fermes coopératives produisent à peine de quoi nourrir leurs villages. Les villes manquent."
 NKO_spa_debuff_foreign: "Isolement diplomatique"
 NKO_spa_debuff_foreign_desc: "Sanctions et statut de paria font que chaque ouverture diplomatique coûte plus qu'elle ne devrait et rapporte moins qu'elle ne pourrait."
 NKO_spa_debuff_construction: "Goulot d’étranglement dans la construction"
 NKO_spa_debuff_construction_desc: "Le génie défensif est le secteur le plus touché. Les forts s'effondrent avant d'être finis, les mâts radar montent à moitié câblés, les bases navales restent à moitié draguées, et les aérodromes sont piquetés par le mauvais entretien."
 NKO_spa_resolution_industry: "Accélération industrielle"
 NKO_spa_resolution_industry_desc: "L'Assemblée émet une directive industrielle contraignante. Les usines civiles s'élèvent plus vite, les complexes militaires suivent."
 NKO_spa_resolution_production: "Mandat de production d'équipement"
 NKO_spa_resolution_production_desc: "Les lignes de production exécutent un cycle de surmultiplication planifié. Les plafonds d’efficacité sont levés ; les nouveaux équipements arrivent plus rapidement."
 NKO_spa_resolution_military: "Résolution Songun"
 NKO_spa_resolution_military_desc: "L'armée d'abord est de saison. Les calendriers d'exercice se resserrent, la doctrine d'attaque s'affine, le Parti réaffirme ses priorités."
 NKO_spa_resolution_economy: "L’autonomie du Juche"
 NKO_spa_resolution_economy_desc: "Une poussée d'autosuffisance extrait chaque gramme du sol et des mines. Les ressources locales affluent."
 NKO_spa_resolution_research: "Impulsion de recherche"
 NKO_spa_resolution_research_desc: "Tous les instituts travaillent en heures supplémentaires, et les laboratoires classifiés tournent en continu. Briser sanctions et fuite des cerveaux est le mandat le plus coûteux que l'Assemblée puisse voter."
 NKO_spa_resolution_agriculture: "Campagne agricole"
 NKO_spa_resolution_agriculture_desc: "Les fermes coopératives dépassent les quotas. Les pénuries civiles s'atténuent et les usines voient une petite hausse de production."
 NKO_spa_resolution_foreign: "Directive de politique étrangère"
 NKO_spa_resolution_foreign_desc: "Les émissaires du ministère des Affaires étrangères se déploient. Améliorer les relations coûte moins cher, et les partenaires commerciaux nous regardent un peu plus favorablement."
 NKO_spa_resolution_construction: "Bataillon de construction"
 NKO_spa_resolution_construction_desc: "Des brigades de génie militaire mobilisées en masse s'abattent sur chaque site défensif. Forts, radars, positions SHORAD, aérodromes, bases navales, silos de carburant, chemins de fer et hubs logistiques s'élèvent à un rythme sans précédent."
 NKO_spa.0.t: "L'Assemblée populaire suprême se réunit"
 NKO_spa.0.d: "Camarade secrétaire général, le Cabinet a préparé l'ordre du jour. L'Assemblée est réunie. Huit problèmes chroniques exigent l'attention ; à tout moment nous pouvons en garder §Yn'importe lesquels deux§! sous mandat contraignant.\n\nChaque mandat tient §Y365 jours§! ; lorsqu'un expire, un créneau se libère pour le suivant."
 NKO_spa.0.a: "Convoquer l'Assemblée."
 NKO_spa.20.t: "Héros stakhanovistes"
 NKO_spa.20.d: "Les ouvriers de la ceinture industrielle du Hwanghae ont pulvérisé leurs quotas dès les premières semaines de la nouvelle directive. Leurs portraits s'affichent déjà dans tout le pays, et leurs dirigeants rapportent un sursaut de capacité qui sera mis à profit immédiatement."
 NKO_spa.20.a: "Récompenser les héros."
 NKO_spa.21.t: "Innovation en outillage"
 NKO_spa.21.d: "Les ingénieurs de l'usine de machines lourdes de Pyongyang ont conçu un nouveau procédé de montage qui double le débit des chaînes de véhicules blindés. Une série de 75 châssis des plus récents sort : chars, VCI, VTT, véhicules de reconnaissance ou canons automoteurs, selon la chaîne chargée cette semaine."
 NKO_spa.21.a: "Diffuser la technique."
 NKO_spa.22.t: "Héros de la République"
 NKO_spa.22.d: "Le leadership exemplaire d'un officier subalterne lors des exercices Songun a retenu l'œil de l'État-major. Les réservistes affluent aux bureaux d'enrôlement, inspirés par l'exemple."
 NKO_spa.22.a: "Promouvoir et décorer."
 NKO_spa.23.t: "Découverte minérale"
 NKO_spa.23.d: "Des prospecteurs déployés dans les montagnes du Nord ont identifié un filon inconnu. Les premiers essais détermineront quelle ressource stratégique le gisement livre. Le Bureau des ressources d'État a autorisé l'extraction immédiate."
 NKO_spa.23.a: "Commencez l’extraction."
 NKO_spa.24.t: "Défection d'un scientifique étranger"
 NKO_spa.24.d: "Un ingénieur expatrié a contourné les contrôles de sanctions et rejoint un centre de recherche de la RPDC. Ses aperçus accélèrent l'un des programmes prioritaires de l'Académie d'État."
 NKO_spa.24.a: "Accueillir le camarade."
 NKO_spa.25.t: "Récolte exceptionnelle"
 NKO_spa.25.d: "Les fermes coopératives du Hamgyong du Nord rapportent des rendements bien au-dessus du quota. Les réserves de grains gonflent ; les bureaux de recrutement ruraux se remplissent de jeunes agriculteurs cherchant du travail dans l'armée."
 NKO_spa.25.a: "Distribuer le surplus."
 NKO_spa.26.t: "Coup d'État diplomatique"
 NKO_spa.26.d: "Les émissaires du ministère des Affaires étrangères ont transformé la nouvelle directive en une victoire diplomatique discrète — une concession en coulisses d'un partenaire majeur qui se traduit en devises."
 NKO_spa.26.a: "Empocher les gains."
 NKO_spa.27.t: "Avant-garde de la construction"
 NKO_spa.27.d: "Les bataillons de construction volontaires ont dépassé toutes les projections. Avec de la capacité restante, le cabinet propose les travaux au projet civil le plus en retard. Si la main-d'œuvre n'est pas disponible, le travail peut être liquidé contre des devises."
 NKO_spa.27.factory_take: "Construire une usine civile."
 NKO_spa.27.factory_cash: "Liquider le travail. (§Y+0,5§! trésor)"
 NKO_spa.27.offices_take: "Construisez un immeuble de bureaux."
 NKO_spa.27.offices_cash: "Liquider le travail. (§Y+0,75§! trésor)"
 NKO_spa.27.refinery_take: "Construisez une raffinerie synthétique."
 NKO_spa.27.refinery_cash: "Liquider le travail. (§Y+0,45§! trésor)"
 NKO_spa.27.agri_take: "Construisez un district agricole."
 NKO_spa.27.agri_cash: "Liquider le travail. (§Y+0,45§! trésor)"
 NKO_spa.30.t: "Le plan quinquennal commence"
 NKO_spa.30.d: "Les banderoles fleurissent à chaque porte d'usine. L'Assemblée a décrété que les 365 prochains jours sont un plan quinquennal en miniature, avec des quotas de production concrets pour chaque ceinture industrielle."
 NKO_spa.30.a: "Mettre le Plan en mouvement."
 NKO_spa.31.t: "Quotas atteints en avance"
 NKO_spa.31.d: "À mi-parcours de la directive, les usines le long du Taedong rapportent des coulées de béton et d'acier bien au-dessus du plan. Les brigades ouvrières rivalisent pour les honneurs."
 NKO_spa.31.a: "Récompenser les brigades de tête."
 NKO_spa.32.t: "Records industriels établis"
 NKO_spa.32.d: "La directive s'achève par un rassemblement triomphal sur la place Kim Il-sung. De nouveaux créneaux industriels ont été ajoutés à la capacité productive de la République, et le prestige du Parti a grimpé."
 NKO_spa.32.a: "Célébrer la réussite."
 NKO_spa.33.t: "Un nouvel outillage arrive"
 NKO_spa.33.d: "Par des canaux du marché gris, de l'outillage de remplacement a atteint les usines d'équipement. Les contremaîtres recyclent les ateliers selon les nouvelles spécifications."
 NKO_spa.33.a: "Déployer le nouvel outillage."
 NKO_spa.34.t: "Les lignes de production bourdonnent"
 NKO_spa.34.d: "La production des ceintures d'équipement de Pyongyang et Hamhung est la plus fluide depuis une décennie. Les taux de défauts baissent, la qualité de finition monte."
 NKO_spa.34.a: "Pousser un raffinement supplémentaire."
 NKO_spa.35.t: "Contrôle qualité Triomphe"
 NKO_spa.35.d: "Le Mandat de production d'équipement s'achève par une inspection d'État qui trouve les critères de qualité au plus haut de mémoire d'homme. Les officiers d'approvisionnement de l'APC sont satisfaits."
 NKO_spa.35.a: "Documenter les nouvelles normes."
 NKO_spa.36.t: "Les exercices s'intensifient"
 NKO_spa.36.d: "Le Songun est de saison. Dans chaque corps, le rythme d'exercice double. Les tirs réels suspendus depuis des années reprennent."
 NKO_spa.36.a: "Pousser les troupes plus fort."
 NKO_spa.37.t: "Le corps des officiers excelle"
 NKO_spa.37.d: "Une nouvelle génération d'officiers de compagnie et de bataillon s'est affirmée sous le régime d'entraînement intensifié. Les promotions remontent la chaîne de commandement."
 NKO_spa.37.a: "Récompenser et promouvoir."
 NKO_spa.38.t: "Triomphes de Songun"
 NKO_spa.38.d: "La Résolution Songun se clôt par un défilé de Grande Victoire à Pyongyang. Les rappels de réservistes ont regarni les rangs ; l'APC est à son plus fort depuis des années."
 NKO_spa.38.a: "Défiler en formation."
 NKO_spa.39.t: "Début des études minérales"
 NKO_spa.39.d: "Des équipes de prospection géologique se déploient dans les montagnes du Nord. D'anciennes cartes soviétiques sont dépoussiérées et mises à jour avec des instruments modernes."
 NKO_spa.39.a: "Autoriser les prospections."
 NKO_spa.40.t: "La production minière augmente"
 NKO_spa.40.d: "Les nouvelles prospections ont orienté les mineurs vers des filons plus riches. Charbon, magnésite et terres rares sont tous en forte hausse."
 NKO_spa.40.a: "Exploiter l'avantage."
 NKO_spa.41.t: "Autonomie atteinte"
 NKO_spa.41.d: "Le Mandat d'autosuffisance Juche s'achève avec des réserves de devises reconstituées par les ventes à l'export. Camarade secrétaire général, la République se dresse."
 NKO_spa.41.a: "Mettre les réserves en banque."
 NKO_spa.42.t: "Portes du laboratoire ouvertes"
 NKO_spa.42.d: "L'Académie des sciences d'État reçoit l'appel : chaque programme prioritaire est déverrouillé, chaque dossier classifié accessible. Des chercheurs qui attendaient des années d'habilitation sont briefés du jour au lendemain."
 NKO_spa.42.a: "Autoriser les priorités."
 NKO_spa.43.t: "Les programmes d’urgence portent leurs fruits"
 NKO_spa.43.d: "Plusieurs programmes longtemps bloqués de l'Académie d'État aboutissent à des percées en succession rapide. L'État-major est briefé sur la discipline qui a tourné le coin cette fois."
 NKO_spa.43.a: "Briefer l'État-major."
 NKO_spa.44.t: "Rattraper son retard"
 NKO_spa.44.d: "La Poussée de recherche s'achève avec la RPDC plus proche de la frontière technologique qu'à aucun moment depuis les années 1970. Le Parti célèbre un triomphe discret."
 NKO_spa.44.a: "Exploiter le nouvel avantage."
 NKO_spa.45.t: "Début des semis de printemps"
 NKO_spa.45.d: "Les fermes coopératives du pays se mobilisent pour une saison de semis agressive. Des brigades volontaires des villes renforcent la main-d'œuvre rurale."
 NKO_spa.45.a: "Mobiliser les brigades."
 NKO_spa.46.t: "Entretien d'été"
 NKO_spa.46.d: "Les inspections de mi-saison montrent des champs en meilleur état depuis des années. Les canaux d'irrigation coulent ; les stocks de pesticides sont arrivés de Chine."
 NKO_spa.46.a: "Maintenir l'effort."
 NKO_spa.47.t: "Récolte exceptionnelle"
 NKO_spa.47.d: "Les rendements dépassent le plan de 20 %. Les réserves de grains gonflent ; pour la première fois depuis des années, certains districts verront une ration complète."
 NKO_spa.47.a: "Distribuer le surplus."
 NKO_spa.48.t: "Ouvertures diplomatiques"
 NKO_spa.48.d: "Des délégations de la RPDC sont discrètement dépêchées dans des capitales amies, portant des termes favorables et des demandes discrètes : Pékin, Moscou, Téhéran, Damas."
 NKO_spa.48.a: "Envoyer les émissaires."
 NKO_spa.49.t: "Canaux arrière silencieux"
 NKO_spa.49.d: "Plusieurs délégations reviennent avec des accords sous la table : coentreprises-écrans, prêts d'infrastructure et participations discrètes de partenaires étrangers sympathisants. L'application des sanctions a été un peu moins rigoureuse que d'habitude."
 NKO_spa.49.a: "Recevoir les livraisons."
 NKO_spa.50.t: "Concessions commerciales"
 NKO_spa.50.d: "La Directive de politique étrangère s'achève par un faisceau de nouveaux arrangements qui améliorent nettement les flux de capitaux étrangers. Des engagements d'investissement sont signés pour la décennie à venir."
 NKO_spa.50.a: "Signer les accords."
 NKO_spa.51.t: "L'avant-garde de la construction se mobilise"
 NKO_spa.51.d: "Le Mandat des bataillons de construction est une aubaine pour la faction interne que le Cabinet décide de créditer. Le Parti peut orienter le dividende politique vers une faction dont il a plus besoin de la coopération."
 NKO_spa.51.military: "Créditer §Yl'Armée§!. (§G+15§! opinion)"
 NKO_spa.51.cadres: "Créditer les §Ycadres communistes§!. (opinion §G+15§!)"
 NKO_spa.51.donju: "Crédit aux §YDonju§!. (§G+15§! d'opinion)"
 NKO_spa.51.farmers: "Créditer les §Yagriculteurs§!. (opinion §G+15§!)"
 NKO_spa.51.labour: "Créditer les §Ysyndicats§!. (opinion §G+15§!)"
 NKO_spa.51.none: "Prendre le crédit politique. (§G+25 PP§!)"
 NKO_spa.52.t: "Chantiers à travers la République"
 NKO_spa.52.d: "La construction est en cours dans chaque province. Routes nivelées, embranchements ferroviaires soudés, lignes électriques retendues. Ce travail d'infrastructure ingrat qui compose sur des décennies."
 NKO_spa.52.a: "Serrer le calendrier."
 NKO_spa.53.t: "Projets terminés"
 NKO_spa.53.d: "Le Mandat des bataillons de construction se clôt par des inaugurations diffusées dans toute la République. Le Parti récolte le dividende politique ; la population est plus calme ; le trésor voit un petit surplus de projets."
 NKO_spa.53.a: "Couper les rubans."
