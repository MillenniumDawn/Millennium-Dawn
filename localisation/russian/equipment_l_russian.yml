 TAT_util_vehicle_2: "Урал-4320"
 TAT_util_vehicle_2_desc: "Грузовик тылового обеспечения и перевозчик войск, используемый многими военными по всему миру."
 TAT_util_vehicle_3: "КамАЗ-4310"
 TAT_util_vehicle_3_desc: "Грузовик и транспортное средство для перевозки войск, используемые многими армиями мира."
 TAT_util_vehicle_4: "КамАЗ-4350"
