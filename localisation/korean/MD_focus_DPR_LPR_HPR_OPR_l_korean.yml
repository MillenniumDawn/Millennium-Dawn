 DPR_donbass_go: "나아가라 돈바스!"
 DPR_donbass_go_desc: "우리의 개혁이 결실을 맺어 마침내 경제 성장으로 나아갔습니다!"
 DPR_donbass_workers: "돈바스 노동자"
 DPR_donbass_workers_desc: "노동 계급은 우리 경제의 혈관이므로 우리는 이들에게 각별한 관심을 기울여야 합니다."
 DPR_donbass_medicine: "의료 보험 비용 인상"
