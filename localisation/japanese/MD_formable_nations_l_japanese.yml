 HBL_form_category: "ベネルクス"
 HBL_form_category_desc: "ベネルクスは、オランダ、ベルギー、ルクセンブルクの3カ国からなる政治経済連合だ。歴史的に、3カ国は互いに友好的で親密な関係を築いてきた。現在の組織は、国際舞台における政治経済問題に関する単なる国家連合に過ぎない。この国家連合をより具体的なものにするための密かな協議が行われている。低地諸国の人々を代表する新たな国家を樹立し、国民に新たな未来をもたらし、この輝かしい未来へと導く。"
 HBL_integrate_start: "[GetHBLNameDef]形成の開始"
 HBL_integrate_start_desc: "ベネルクスの形成に着手する時が来た。\n\n"
 HBL_integrate_belgium: "[GetHBLNameAdj][BEL.GetAdjective]地域の統合"
 HBL_integrate_belgium_desc: "ベルギーはベネルクス諸国の中で最大でも最小でもない。他2つの加盟国の間に位置するのと同様に、中央に位置している。ブリュッセル市内にはEUの官僚機構が複数あり、オランダ人、フランス人、そしてEU域外からの観光客にとって人気の観光地となっている。"
 HBL_integrate_netherlands: "[GetHBLNameAdj][HOL.GetAdjective]地域の統合"
 HBL_integrate_netherlands_desc: "オランダはベネルクス三国の中で最大の国だ。人口、国土面積、経済規模の大部分を占め、複数の海外領土を有している。オランダの統合により、ベネルクス三国の大部分が新たな国家に加わり、新たな連合の正当性が大幅に強化される。"
 HBL_integrate_luxembourg: "[GetHBLNameAdj][LUX.GetAdjective]地域の統合"
 HBL_integrate_luxembourg_desc: "ルクセンブルクは三カ国の中で最も小さい国である。一人当たりGDPは最大を維持し、小規模な観光地がいくつか存在する。国内では複数の言語が混在して話されており、特に顕著なのはフランス語、ドイツ語、英語である。国家の規模を考慮すれば、ルクセンブルクの統合は大きな事業ではないが、いくつかの官僚的な課題が生じるだろう。"
 HBL_update_flag: "[GetHBLNameDef]形成の完遂"
 HBL_update_flag_desc: "すべての構成地域が統合されれば、我々は変革を完遂し、[GetHBLNameDef]を宣言するとともに、その統一された国旗と名称を採用することができる。"
 USNA_form_category: "北アメリカの統一"
 USNA_form_category_desc: "The North American continent has historically repelled foreign influence since Mexico, the United States, and Canada were founded as nation-states. They form the backbone of the world's economy, with a collective eleven trillion GDP at the beginning of the new millennium. Uniting the nations and setting our sights on the grander tomorrow will see us go forward to the future."
 USNA_integrate_start: "[GetUSNANameDef]形成の開始"
 USNA_integrate_start_desc: "北アメリカ連邦の形成に着手する時が来た。\n\n"
 USNA_integrate_canada: "[GetUSNANameAdj][CAN.GetAdjective]地域の統合"
 USNA_integrate_canada_desc: "カナダは新連合の中で最大の国土面積を誇り、未開発の石油埋蔵量も豊富だ。この二つの事実だけでも、カナダは新北アメリカ連合の不可欠なピースと言えるだろう。新国家への統合が進むにつれて、カナダの弁明は最小限に抑えられることを期待する。"
 USNA_integrate_usa: "[GetUSNANameAdj][USA.GetAdjective]地域の統合"
 USNA_integrate_usa_desc: "アメリカ合衆国は北米諸州連合の大部分を占めている。世界最大の経済規模、第二位の国土面積、そして軍事力など、多くの強みを有している。アメリカ合衆国の統合は、その巨大な規模と世界舞台における影響力ゆえに、多くの課題を伴うが、この統合によって経済的には世界最大の超大国としての地位を確立するだろう。"
 USNA_integrate_mexico: "[GetUSNANameAdj][MEX.GetAdjective]地域の統合"
 USNA_integrate_mexico_desc: "Mexico is the second most populous nation of the three nations forming the new state. It brings to bear a large military. The nation has several challenges, such as the density of cartels. Nevertheless, integrating Mexico will be one of the main focal points for the new nation."
 USNA_update_flag: "[GetUSNANameDef]形成の完遂"
 USNA_update_flag_desc: "すべての構成地域が統合されれば、我々は変革を完遂し、[GetUSNANameDef]を宣言するとともに、その統一された国旗と名称を採用することができる。"
 UTS_form_category: "テュルク領土を統一する"
 UTS_form_category_desc: "テュルク諸国連合は、ウズベキスタン、キルギスタン、カザフスタン、トルクメニスタンを含むテュルク語圏諸国の連合体である。これらの国々以外にも、ロシアと中国にはタタール人やウイグル人といったテュルク語圏の民族が存在する。彼らは我々の連合の目標の一つではあるが、当初の目標ではない。我々は、現在存在する国民国家を統一し、国民が故郷に帰還、あるいは再び共存できるよう促す。"
 UTS_integrate_start: "[GetUTSNameDef]形成の開始"
 UTS_integrate_start_desc: ""
