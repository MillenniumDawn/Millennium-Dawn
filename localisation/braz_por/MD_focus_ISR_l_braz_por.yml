 israel_economy.143.t: "Fórum Econômico do Bahrein"
 israel_economy.143.d: "Israel nos oferece um acordo no qual quer que façamos investimentos em infraestrutura na Palestina para aliviar as tensões e dar um alívio econômico à Palestina. O que devemos fazer?"
 israel_economy.143.a: "Claro, concordamos!"
