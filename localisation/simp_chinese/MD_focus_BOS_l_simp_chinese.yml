 BOS_bnttmih_header_towed: "Towed Artillery"
 BOS_bnttmih_header_rockets: "Rockets & Self-Propelled"
 BOS_bnttmih_header_antitank: "Anti-Tank Guns"
 BOS_bnttmih_mio_trait_bratstvo_foundry: "Bratstvo Heritage"
 BOS_bnttmih_mio_trait_m56_howitzer: "M-56 Howitzer"
 BOS_bnttmih_mio_trait_mortar_foundry: "Mortar Foundry"
 BOS_bnttmih_mio_trait_cannon_howitzer_152: "152mm Cannon-Howitzer"
 BOS_bnttmih_mio_trait_m56a1_barrel: "M-56A1 Long Barrel"
 BOS_bnttmih_mio_trait_rifling_metallurgy: "Rifling Metallurgy"
 BOS_bnttmih_mio_trait_field_cannon_130: "130mm Field Cannon"
 BOS_bnttmih_mio_trait_self_propelled_program: "Self-Propelled Program"
 BOS_bnttmih_mio_trait_soko_spg: "M-09 Soko"
 BOS_bnttmih_mio_trait_mlrs_battery: "Rocket Battery Line"
 BOS_bnttmih_mio_trait_sph155_prototype: "155mm SPH Prototype"
 BOS_bnttmih_mio_trait_mlrs_128: "128mm Light Rockets"
 BOS_bnttmih_mio_trait_mlrs_262: "262mm Heavy Rockets"
 BOS_bnttmih_mio_trait_gps_fire_control: "GPS Fire Control"
 BOS_bnttmih_mio_trait_lightweight_chassis: "Lightweight Chassis"
 BOS_bnttmih_mio_trait_barrel_forge: "Barrel Forge"
 BOS_bnttmih_mio_trait_m60_recoilless: "M60 Recoilless Rifle"
 BOS_bnttmih_mio_trait_gun_125_m84: "M-84 125mm Gun"
 BOS_bnttmih_mio_trait_gun_100_t55: "T-55 100mm Gun"
 BOS_bnttmih_mio_trait_m84_recoilless: "M84 Recoilless Rifle"
 BOS_bnttmih_mio_trait_at_gun_100: "100mm Anti-Tank Gun"
 BOS_bnttmih_mio_trait_mountain_gun_100: "100mm Mountain Gun"
 BOS_croat_secession_crisis: "Croat Secession Crisis"
 BOS_croat_secession_crisis_desc: "Herceg-Bosna institutions are drafting withdrawal legislation and drilling their own units. If Croat grievances are not addressed before the standoff runs out, the south breaks away in arms."
 BOS_dayton_two: "Revised Dayton Settlement"
 BOS_dayton_two_desc: "A renegotiated constitutional settlement traded broader entity autonomy for an end to the fighting. It buys stability, at the cost of a looser center."
 BOS_srpska_secession_crisis_opens_tt: "Republika Srpska opens a secession crisis. If it is not resolved before the window closes, the entity goes to war."
 BOS_croat_secession_crisis_opens_tt: "Herceg-Bosna opens a secession crisis. Raise Croat Trust to Friendly before the window closes to keep the south in the country."
 bos_srpska_reconciliation_full_tt: "Serb Trust in the government is reset to Hostile as the entity is brought fully back under central authority."
 bos_srpska_negotiated_autonomy_tt: "Serb Trust in the government is set to Friendly under the negotiated autonomy terms."
 BOS_croat_deescalation_hint_tt: "Raise Croat Trust to Friendly through the faction decisions to defuse the crisis before it expires."
 BOS_rotate_presidency_hint_tt: "Use the Rotation of Leaders decision to hand over the presidency and reset the waiting community's patience."
 BOS_croat_neutrality_pact_honored_tt: "The Croat Neutrality Pact holds. Herceg-Bosna stays out of the war and does not secede."
 BOS_political.82.t: "Republika Srpska Prepares to Secede"
 BOS_political.82.d: "The entity assembly has set a date to withdraw from state institutions. There is still a narrow window to pull it back before independence is declared outright."
 BOS_political.82.a: "Find a way to defuse it"
 BOS_political.83.t: "Herzegovina Threatens to Break Away"
 BOS_political.83.d: "Croat leaders in the south are moving toward secession, citing years of being outvoted. Mending relations now is the only way to keep them in the country."
 BOS_political.83.a: "Reach out to the Croat community"
 BOS_political.84.t: "The Presidency Rotation Stalls"
 BOS_political.84.d: "The seat was due to change hands, but the handover keeps being put off. The community waiting its turn is starting to see the delay as deliberate."
 BOS_political.84.a: "Note their frustration"
 BOS_offer_amnesty: "Offer Amnesty"
 BOS_offer_amnesty_desc: "Extend amnesty to fighters who lay down their arms. It steadies the Serb community's footing but reads as weakness on the home front."
 BOS_forced_requisition: "Forced Requisition"
 BOS_forced_requisition_desc: "Seize supplies and materiel from the entities to keep the war effort funded. It fills the treasury and hardens Serb resentment."
 BOS_sign_croat_neutrality_pact: "Sign the Croat Neutrality Pact"
 BOS_sign_croat_neutrality_pact_desc: "Guarantee Croat autonomy in exchange for their neutrality. If an Islamic takeover follows, Herzegovina will stay in the country rather than splinter away."
 BOS_canton_pressure_campaign: "Canton Pressure Campaign"
 BOS_canton_pressure_campaign_desc: "Lean on the Bosniak and Croat cantons to fall in line with the central program. It steadies the state at the expense of both communities' goodwill."
 BOS_serbian_alignment_overtures: "Serbian Alignment Overtures"
 BOS_serbian_alignment_overtures_desc: "Deepen political and economic ties with Belgrade. Serb influence in Bosnia grows, the Serb community warms to the government, and Bosniak patience wears thin."
 BOS_srpska_supremacy_measures: "Serb Supremacy Measures"
 BOS_srpska_supremacy_measures_desc: "Promote Serb nationalist and security priorities in government policy and institutions."
 BOS_bosniak_governing_partner: "Bosniak Governing Partner"
 BOS_bosniak_governing_partner_desc: "A loyal Bosniak partner keeps coalition politics stable and lowers unrest."
 BOS_croat_governing_partner: "Croat Governing Partner"
 BOS_croat_governing_partner_desc: "A loyal Croat partner supports economic reform but reduces domestic coalition flexibility."
 BOS_srpska_governing_partner: "Serb Governing Partner"
 BOS_srpska_governing_partner_desc: "A loyal Serb partner improves security cooperation but weakens federal oversight."
 BOS_reconstruction_dividends: "Reconstruction Dividends"
 BOS_reconstruction_dividends_desc: "A post-war coalition that cooperates with reconstruction programs can generate short-term economic gains."
 BOS_governing_partner_dividends_tt: "§GIf our governing coalition partner is loyal:§! reconstruction pays dividends for 180 days."
 BOS_internal_faction_balance_stability_tt: "§YCommunity trust:§! each community below §R25§! Trust applies §R-15%§! national Stability, each above §G50§! grants §G+5%§!, each above §G74§! grants §G+10%§!."
 BOS_internal_faction_balance_manpower_tt: "§YCommunity manpower:§! each community below §R25§! Manpower applies §R-15%§! recruitable population, each above §G50§! grants §G+15%§!, each above §G74§! grants §G+20%§!."
 BOS_revanchism_peacekeepers_warning_tt: "§YNote:§! EUFOR peacekeepers must leave the country before the National Awakening can proceed."
 BOS_national_awakening_consequences_tt: "§RThis commits us to war with Republika Srpska. Should we then declare the Islamic takeover, the government turns Islamist and Herzegovina secedes with part of the army.§!"
 BOS_islamic_takeover_consequences_tt: "§RThe government becomes Islamist and Herzegovina secedes, taking part of the army with it.§!"
 BOS_eufor_withdrawal_threat: "Bosnia demands the withdrawal of EUFOR"
 BOS_csto_accept_tt: "Bosnia joins the CSTO at our side."
 BOS_csto_reject_tt: "We turn down Bosnia's application to the CSTO."
 BOS_euro_defence_accept_tt: "We extend a defence guarantee to Bosnia and the EUFOR mission concludes."
 BOS_euro_defence_decline_tt: "We decline to underwrite Bosnia's security."
 BOS_events.56.t: "Bosniak Bloc Presses for Central Authority"
 BOS_events.56.d: "Bosniak parties in the state parliament are pushing to strengthen central institutions at the entities' expense, and they expect the government to back them."
 BOS_events.56.a: "Back the centralizing push"
 BOS_events.56.b: "Hold the line on the entities"
 BOS_events.56.c: "Fund development in the Federation instead"
 BOS_events.57.t: "Croat Bloc Demands Entity Guarantees"
 BOS_events.57.d: "Croat leaders in Herzegovina want firmer guarantees for Croat representation, warning that without them they will obstruct the state institutions."
 BOS_events.57.a: "Accommodate the Croat bloc"
 BOS_events.57.b: "Refuse fresh guarantees"
 BOS_events.57.c: "Invest in Herzegovina instead"
 BOS_events.58.t: "Republika Srpska Demands Competencies"
 BOS_events.58.d: "Banja Luka is again demanding that powers transferred to the state be handed back to the entity, framing it as a matter of the Dayton settlement."
 BOS_events.58.a: "Negotiate a limited transfer"
 BOS_events.58.b: "Reject the demand outright"
 BOS_events.58.c: "Devolve revenue powers to the entity"
 BOS_events.61.t: "A Chinese Offer for Republika Srpska"
 BOS_events.61.d: "The Srpska-led government wants to approve a Chinese-financed infrastructure project in the entity. Beijing gains a foothold, and Sarajevo's Bosniak parties are wary of the strings attached."
 BOS_events.61.a: "Approve the project"
 BOS_events.61.b: "Block the financing"
 BOS_events.62.t: "A Push for Fiscal Autonomy"
 BOS_events.62.d: "With a Croat at the head of government, Herzegovina's leaders press for another transfer of revenue powers, a third entity in all but name."
 BOS_events.62.a: "Devolve the powers"
 BOS_events.62.b: "Keep fiscal control central"
 BOS_events.63.t: "Expanding the Central Budget"
 BOS_events.63.d: "The Bosniak-led government wants to expand the central budget, funding state institutions the entities have long starved. Banja Luka will resent every convertible mark."
 BOS_events.63.a: "Expand the budget"
 BOS_events.63.b: "Leave the budget as it is"
 BOS_events.64.t: "The Buses Keep Leaving"
 BOS_events.64.d: "Emigration has become impossible to ignore. Whole shifts go unfilled and young families are selling up. Jobs programs, youth retention grants, the Corridor Vc trade link and diaspora remittances are the levers that can slow the outflow."
 BOS_events.64.a: "We must keep our people home"
 BOS_events.65.t: "A Country Emptying Out"
 BOS_events.65.d: "The exodus has reached crisis pitch. Clinics close for lack of nurses and villages stand half-empty. Only sustained work on jobs programs, youth retention grants, the Corridor Vc link and remittances will pull the pressure back down."
 BOS_events.65.a: "Reverse the decline"
 BOS_entity_competency_transfer: "Devolved Entity Competencies"
 BOS_entity_competency_transfer_desc: "Revenue-raising powers have been handed down to the entity, buying political calm at the cost of a slower, more contested central government."
 BOS_corruption_hits_weakest_tt: "§RThe community with the least trust in the government loses further ground as the scandal breaks.§!"
 BOS_eu_accession_push: "European Accession Push"
 BOS_eu_accession_push_desc: "With formal candidate status secured and every community behind the bid, press the accession agenda forward. International lenders reward the momentum and confidence in the reform government rises."
 BOS_electoral_reform_package: "Electoral Reform Package"
 BOS_electoral_reform_package_desc: "Once every community trusts the state, the discriminatory presidency structure can finally be replaced. Ending the ethnic quota system retires the secession threat that shadowed the old rotating office while keeping its stabilising benefits."
 BOS_open_balkan_initiative: "Open Balkan Initiative"
 BOS_open_balkan_initiative_desc: "Join the Serbian-led regional market for the free movement of goods, labour, and capital. Belgrade gains influence in Sarajevo, but Serb representatives welcome the closer ties and small business flourishes."
 BOS_berlin_process_commitment: "Berlin Process Commitment"
 BOS_berlin_process_commitment_desc: "Anchor regional cooperation in the German-sponsored Berlin Process rather than Belgrade's orbit. The pro-European track reassures Croat and Bosniak partners and opens the door to Western financing."
 BOS_confront_entity_obstruction: "Confront Entity Obstruction"
 BOS_confront_entity_obstruction_desc: "Republika Srpska has spent years blocking state institutions and threatening withdrawal. Decide whether to face the obstruction head on or buy calm through concessions."
 BOS_energy_transition_strategy: "Energy Transition Strategy"
 BOS_energy_transition_strategy_desc: "Move beyond the coal-versus-hydro divide with renewable capacity spread across both entities. Shared projects reassure Croat and Serb communities and give young workers a reason to stay."
 BOS_digital_diaspora_economy: "Digital Diaspora Economy"
 BOS_digital_diaspora_economy_desc: "Connect the technology sector to the large emigrant community abroad. Remote work and returning talent ease emigration pressure and win over small and medium business owners."
 BOS_census_2023: "2023人口普查"
 BOS_census_2023_desc: "Conduct the long-delayed population census. The results will settle disputes over each community's numbers, but whichever people the government emphasises will feel recognised at a rival's expense."
 BOS_eu_candidacy_momentum: "EU Candidacy Momentum"
 BOS_eu_candidacy_momentum_desc: "Formal candidate status has energised the reform camp and steadied public confidence in the government."
 BOS_reformed_presidency: "Reformed Presidency"
 BOS_reformed_presidency_desc: "The rotating ethnic presidency has been replaced by a system open to every citizen. Governance is calmer and more legitimate, and the constant threat of entity secession has lifted."
 BOS_open_balkan_market: "开放巴尔干市场"
 BOS_open_balkan_market_desc: "加入区域市场为波斯尼亚企业扩大了出口机会，而对国内消费的影响却不大。"
 BOS_digital_economy_idea: "数字经济"
 BOS_digital_economy_idea_desc: "对网络连接和软件的投资提高了研究产出，并帮助工厂采用了现代化的生产方式。"
 BOS_events.66.t: "实体障碍"
 BOS_events.66.d: "塞族共和国领导层再次阻挠国家立法，并扬言退出联邦机构。政府必须在瘫痪局面蔓延之前做出回应。"
 BOS_events.66.a: "采取强硬姿态"
 BOS_events.66.b: "提出让步"
 BOS_events.67.t: "2023人口普查"
 BOS_events.67.d: "人口普查数据已准备就绪，即将公布。各社区领导人都在积极游说，希望本社区的数据能在官方结果中得到突出展示。"
 BOS_events.67.a: "强调波斯尼亚克族人口数量"
 BOS_events.67.b: "强调克罗地亚族人口数量"
 BOS_events.67.c: "强调塞尔维亚族人口数量"
 BOS_confront_entity_obstruction_choice_tt: "§Y摆在我们面前的选择是：直接与塞族共和国对抗，还是寻求妥协。§!"
 BOS_hardline_rs_crisis_warning_tt: "§R如果米洛拉德·多迪克领导塞族共和国期间，塞尔维亚人的信任度降至25以下，那么对峙可能会升级为分裂危机。§!"
 BOS_reformed_presidency_tt: "§G以改革后的总统制取代轮值总统制，既消除了分裂风险，又保留了其稳定性优势。§!"
 BOS_emigration_eased_energy_tt: "§G移民压力降低5§!"
 BOS_emigration_eased_digital_tt: "§G移民压力降低10§!"
 BOS_digital_diaspora_synergy_tt: "§G侨汇款资助兴建一座新的民用工厂，无需国库支出。§!"
 RSK_requisition_the_mines: "征用矿山"
 RSK_requisition_the_mines_desc: "夺取该实体矿场的产出，充实军火库。工人们不会感谢我们的。"
 RSK_appeal_to_belgrade: "呼唤贝尔格莱德"
 RSK_appeal_to_belgrade_desc: "要求塞尔维亚公开支持该实体，以提振士气并改善与贝尔格莱德的关系。"
 HZG_war_levy: "黑塞哥维那战争税"
 HZG_war_levy_desc: "向各地征收紧急税款以资助战争。这将损害社会稳定。"
 HZG_appeal_to_zagreb: "呼唤萨格勒布"
 HZG_appeal_to_zagreb_desc: "请克罗地亚支持波斯尼亚-黑塞哥维那，以提振士气并改善与萨格勒布的关系。"
 BOS_events.68.t: "实体的呼唤"
 BOS_events.68.d: "塞族共和国向塞尔维亚请求提供武器和志愿者。贝尔格莱德必须权衡公开支持塞族共和国与引发更大规模战争的风险。"
 BOS_events.68.a: "送去武器和志愿者"
 BOS_events.68.b: "我们不能被人发现干预。"
 BOS_events.69.t: "贝尔格莱德回复"
 BOS_events.69.d: "塞尔维亚的物资运抵前线。实体士兵们士气大振。"
 BOS_events.69.a: "为了塞尔维亚人"
 BOS_events.70.t: "各州的呼唤"
 BOS_events.70.d: "波斯尼亚-黑塞哥维那向克罗地亚请求提供武器和志愿者以守住防线。"
 BOS_events.70.a: "武装各州守军"
 BOS_events.70.b: "萨格勒布必须置身事外。"
 BOS_events.71.t: "萨格勒布回复"
 BOS_events.71.d: "克罗地亚的武器运抵波斯尼亚-黑塞哥维那。各州守军士气大振。"
 BOS_events.71.a: "为了克罗地亚人"
 RSK_serbian_support_accept_tt: "§G向塞族共和国运送2000件步兵武器，并开放志愿者前往。§!"
 RSK_serbian_support_decline_tt: "§R塞族共和国的战争支持率下降。§!"
 HZG_croat_support_accept_tt: "§G向波斯尼亚-黑塞哥维那运送1500件步兵武器，并开放志愿者前往。§!"
 HZG_croat_support_decline_tt: "§R波黑的战争支持率下降。§!"
 BOS_thermal_chinese_financing_tt: "§Y北京方面将被告知贷款已签署，并将获得在波斯尼亚的影响力作为回报。§!"
 BOS_events.72.t: "萨拉热窝签署图兹拉协议"
 BOS_events.72.d: "波斯尼亚已经签署了图兹拉褐煤扩建项目的信贷额度 - 1亿美元来自我们的账目以及我们的现场承包商。工厂只是较小的回报。这笔贷款真正买到的是萨拉热窝的一席之地，以及欠我们的巴尔干合作伙伴。"
 BOS_events.72.a: "棒极了！"
 BOS_court_turkish_investment_tt: "§Y安卡拉将被告知市场已经开放，并将获得在波斯尼亚的影响力作为回报。§!"
 BOS_court_gulf_investment_tt: "§Y利雅得方面将被告知，我们欢迎他们的注资，并将获得在波斯尼亚的影响力作为回报。§!"
 BOS_events.73.t: "萨拉热窝敞开大门"
 BOS_events.73.d: "波斯尼亚为我们的建筑公司和银行扫清了障碍。高速公路路段、住房、在萨拉热窝建立的分支机构网络 - 这些都为我们的承包商提供了工作机会，也让我们在这个仍然视我们为亲人的国家站稳了脚跟。现在，安卡拉的话语在联邦中将具有举足轻重的地位。"
 BOS_events.73.a: "棒极了。"
 BOS_events.74.t: "布罗伊奥宗找到了支持者"
 BOS_events.74.d: "萨拉热窝已将海湾资本引入房地产、旅游和金融领域。特尔诺沃度假城是其中的亮点，但资金的影响远不止于此 - 公寓、酒店以及持有相关债券的银行都从中受益。无论这些项目最终成果如何，波斯尼亚的穆斯林领导层都将铭记这笔资金的来源。"
 BOS_events.74.a: "棒极了！"