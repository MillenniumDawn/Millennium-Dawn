 ukr_modernize_sov_equipment_s125_orders_tt: "대대 1개가 §G0.04§!십억에 구매국으로 넘어가며, 거점(해당국 주 한 곳에 대공 §G+1§!) 또는 기동 발사대 §Y4§!기로 인도됩니다. 우리에 대한 호감도가 §Y10§! 이상이어야 하며, 이미 우리 보관 물자를 산 적이 있다면 §Y0§!이면 됩니다.\n캅카스 국가 중 한 곳을 고르면 나머지 두 나라의 우리에 대한 호감도가 §R-10§! 떨어집니다."
