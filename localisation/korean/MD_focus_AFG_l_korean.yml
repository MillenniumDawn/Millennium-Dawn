 AFG_Asif_Mohsenim_leaderTT: "§Y무함마드 아시프 모흐세니§!, §g[Vilayat_e_Faqih_L]§!의 지도자 풀에 추가됩니다"
 AFG_abdul_rashid_dostum_leader_exileTT: "§Y압둘 라시드 도스툼§!, £GFX_AFG_conservative §g준비시-밀리§!의 지도자 풀에 추가됩니다\n§Y§!"
 AFG_ai_Weight_effect_Arms: "수락 의향이 기본적으로 §G강함§!\n\n [USA.GetName]은(는) 다음의 경우 우리와 동맹을 맺을 가능성이 낮아집니다\n §R-우리가 같은 이념 성향을 따르지 않는 경우\n -그들이 [AFG.GetName]에 대해 낮은 관계를 가진 경우§!"
 AFG_ai_Weight_effect_Airlift: "그들의 수용 의지는 기본적으로 §G강함§!입니다.\n\n그들은 다음의 경우 수용할 가능성이 더 높습니다:\n§G-[USA.GetLeader]가 '항구적 자유 작전(Operation Enduring Freedom)'을 발표한 경우§!\n\n다음의 경우 수용할 가능성이 더 낮습니다:\n§R-우리가 동일한 관점을 따르지 않을 경우\n-그들이 우리에 대해 낮은 의견을 가지고 있을 경우§!"
 AFG_ai_Weight_effect_Iran: "수락 의향이 기본적으로 §G강함§!\n\n 다음의 경우 수락할 가능성이 낮아집니다\n §R-우리가 같은 이념 성향을 따르지 않는 경우\n -그들이 우리에 대해 낮은 관계를 가진 경우\n -우리가 수니파인 경우§!"
 AFG_ai_Weight_effect_div_usa: "수락 의향이 기본적으로 §R약함§!\n\n 다음의 경우 수락할 가능성이 높아집니다\n §G-CIA 프레데터 드론이 승인된 경우\n -우리가 같은 이념 성향을 따르는 경우\n -그들이 [AFG.GetNameDefCap]에 대해 높은 관계를 가진 경우§!"
 AFG_ai_Weight_effect_CIA_drones: "그들이 수용할 의향은 기본적으로 §G강함§!입니다.\n\n그들이 수용할 가능성이 낮은 경우:\n§R-오사마 빈 라덴이 죽었다면\n-우리가 같은 관점을 따르지 않으면\n-[AFG.GetNameDefCap]에 대해 낮은 의견을 가질 경우§!"
 AFG_ai_Weight_effect_India_aid: "수락 의향이 기본적으로 §G강함§!\n\n 다음의 경우 수락할 가능성이 낮아집니다\n§R -우리가 같은 이념 성향을 따르지 않는 경우\n -그들이 [AFG.GetNameDefCap]에 대해 낮은 관계를 가진 경우§!"
 AFG_available_as_leaderTT: "§Y정치 지도자§!로 §G선택 가능§!"
 AFG_available_as_MillleaderTT: "§Y군 최고 사령관§!으로 §G배정됨§!"
 AFG_import_westernism: "서구주의 도입"
 AFG_import_westernism_desc: "아프가니스탄은 오랫동안 전통적 가치를 고수해 왔습니다. 그러나 최근 새로운 사상에 대한 개방성 덕분에 서구적 개념의 일부 측면을 선별적으로 받아들일 수 있게 되었습니다. 이러한 접근은 다양한 서구 사상 가운데 우리 고유의 필요에 부합하는 것은 취하고, 우리 상황에 맞지 않는 것은 거부할 수 있게 해 줍니다."
 AFG_atta_installs_leadership: "아타 무함마드 누르, 지도부 장악"
 AFG_atta_installs_leadership_desc: "군벌에서 지휘관이 된 아타 무함마드 누르는 일이 순조롭게 풀리는 것을 달가워하지 않습니다."
 AFG_liberal_society: "자유주의 사회"
 AFG_afghan_morning_taliban_by_night: "낮에는 아프가니스탄군, 밤에는 탈레반"
 AFG_afghan_morning_taliban_by_night_desc: "아프가니스탄 국군 인원 다수가 이중생활을 하고 있습니다. 상당수가 군에 복무하면서 탈레반에 속해 있어 탈레반에게 우리 군에 대한 큰 이점을 안겨 줍니다. 이 부패는 우리 군 내 대규모 부패를 가능하게 했고, 조국을 위해 싸우는 병사들의 사기를 크게 떨어뜨리고 있습니다."
 AFG_safed_koh_supply_network: "사페드코 보급망"
 AFG_safed_koh_supply_network_desc: "도로, 산악, 지하 동굴로 이루어진 복잡한 망을 이용하는 사페드코 보급망은 이 지역의 험준하고 고립된 지형이 미치는 영향을 완화했습니다."
 AFG_tal_insurgency_new: "[TAL.GetFlag] 탈레반 반란"
 AFG_tal_insurgency_new_desc: "탈레반은 여러 차례 패배한 끝에 아프가니스탄 동부 외곽으로 후퇴했습니다. 그들은 참호를 구축하며 장기적이고 피비린내 나는 게릴라전을 준비하고 있습니다. 탈레반 세력은 그들의 방어 및 공격 변동치와 직접 연동되어 있습니다. 미국이 철수할 때 세력이 30%를 넘는다면, 그들은 다시 한번 전면 침공을 개시할 것입니다.\n\n£AFG_salafist_jihadism  §H탈레반 세력 - [?AFG.taliban_attack_strength|%]§!"
 TAL_move_into_tribal_areas: "파키스탄 부족 지대로 진출"
 TAL_move_into_tribal_areas_desc: "생존하려면 우리 병력이 한 곳에 집중되지 않도록 바깥으로 이동시켜야 합니다. 부족 지대는 훌륭한 산악 지형에 확실히 접근할 수 있으므로 최적의 은신처입니다."
 AFG_414_attack_1207: "탈레반 거점 공격"
 AFG_414_attack_1207_desc: "탈레반을 근절하지는 못하겠지만, 그들의 세력에 타격을 줄 수는 있을 것입니다... 성공한다면 말입니다."
 TAL_1207_attack_1154: "쿠나르 타격"
 TAL_1207_attack_1208: "칼라트 방면 진격"
 AFG_414_attack_1208: "칼라트 탈환"
 AFG_414_attack_1154: "쿠나르 탈환"
 PAK_objected: "[PAK.GetFlag] 파키스탄의 반대에 따라 물러남"
 AFG_doing_border_raid: "현재 국경 습격 중"
 TAL_money: "탈레반 자금"
 AFG_agriculture_mech: "농업"
 AFG_agriculture_mech_desc: "아몬드와 석류는 세계가 주저 없이 사 주는 유일한 아프가니스탄 수출품입니다. 과수원, 운송, 구매자에게 국가 자금을 투입하면 농부의 수확물이 국고 수입으로 바뀝니다."
 AFG_pomegranate_return_tt: "수익: §Y국고§!로 GDP의 §G+6%§!"
 AFG_almond_return_tt: "수익: §Y국고§!로 GDP의 §G+8%§!"
 AFG_pomegranate_investment_limit_tt: "남은 석류 투자 횟수: §Y[?AFG_pomegranate_investments]/5§!"
 AFG_almond_investment_limit_tt: "남은 아몬드 투자 횟수: §Y[?AFG_almond_investments]/5§!"
 TAL_1207_attack_1154_desc: "사페드코 산맥에서 전투원들을 쿠나르로 내보내 아프가니스탄 수비대가 방어 태세를 갖추기 전에 출혈을 강요합니다."
 TAL_1207_attack_1208_desc: "사페드코에서 칼라트를 압박합니다. 이곳의 고속도로를 장악하면 남동부 전역의 정부군이 분단됩니다."
 TAL_1152_attack_415: "시스탄 소탕"
 TAL_1152_attack_415_desc: "레지스탄에서 서쪽으로 진격해 시스탄으로 들어가, 이란과 맞닿은 사막 국경 지대에 대한 정부의 장악을 위협합니다."
 AFG_415_attack_1152: "레지스탄 소탕"
 AFG_415_attack_1152_desc: "시스탄에서 반격하여 레지스탄 사막을 되찾고 탈레반의 집결지를 빼앗습니다."
 AFG_412_attack_415: "시스탄 해방"
 AFG_412_attack_415_desc: "하자라자트에서 진격해 탈레반을 시스탄에서 몰아내고 남부 지방을 정부 통제 아래로 되돌립니다."
 TAL_construct_the_safed_koh_system: "사페드코 보급망 구축"
 TAL_construct_the_safed_koh_system_desc: "사페드코 산맥에 은닉처, 터널, 노새길을 뚫어 아프가니스탄 순찰대의 손이 닿지 않는 곳에서도 전투원들에게 보급이 이어지도록 합니다."
 TAL_begin_insurgency_in_registan: "레지스탄 전선 개설"
 TAL_begin_insurgency_in_registan_desc: "레지스탄 사막 전역에서 민병 종대를 편성해 해당 지방을 장악하고 남부에 제2전선을 엽니다."
 TAL_begin_war_again: "전쟁 재개"
 TAL_begin_war_again_desc: "외국군이 떠나고 우리의 세력이 회복된 지금, 휴전을 파기하고 카불로 진군하여 전쟁을 끝냅니다."
 AFG_taliban_insurgency_eliminated: "탈레반 반란이 소탕되었음"
 AFG_active_taliban_insurgency: "탈레반 반란이 진행 중임"
 wot_supporting_afghan_counter_insurgency: "아프가니스탄 대반란 지원"
 AFG_civil_war_shortcut: "내전"
 AFG_panjshir_shortcut: "판지시르"
 AFG_foreign_policy_shortcut: "외교 정책"
 AFG_government_shortcut: "정부"
 AFG_reconstruction_shortcut: "재건"
 AFG_national_policy_shortcut: "국가 정책"
 AFG_national_assembly: "국민회의"
 AFG_anjuman_pass: "판지시르의 사자"
 AFG_law_of_faith: "신앙법"
 AFG_law_of_faith_idea: "신앙법"
 AFG_law_of_faith_idea_desc: "종교법이 법전에 명문화되었습니다. 성직자들은 만족하고 농촌 지역은 소집 요청에 응하겠지만, 합의 바깥의 모든 것에 대한 정치적 공간은 닫혔습니다."
 AFG_law_of_faith_desc: "신앙법이 우리 국가에서 우세를 점하여 국가 내 이슬람 원칙을 강화할 것입니다. 우리 국민은 국가를 순수하고 올바르게 유지하기 위해 이슬람 신앙의 인도를 받게 될 것입니다."
 AFG_training_of_local_police_officers: "지역 경찰관 훈련"
 AFG_training_of_local_police_officers_desc: "아프가니스탄의 해방과 안정화에 대비하여, 북부동맹은 규율 있고 효율적인 경찰력을 구축해야 합니다. 이 경찰력은 우리가 수복하고자 하는 지역의 법과 질서를 유지하는 데 결정적일 것입니다."
 AFG_heirs_o_the_mujahideen: "무자헤딘의 후예"
 AFG_heirs_o_the_mujahideen_desc: "현 지도부는 과거의 전설적인 전사들에게서 영감을 얻어 무자헤딘의 정신과 전술을 되살리고자 합니다."
 AFG_the_lions_guard: "사자의 근위대"
 AFG_the_lions_guard_desc: "임박한 위협에 대한 우려에 대응하여 아흐마드 샤 마수드에 대한 잠재적 공격을 막기 위한 새로운 임무 부대가 등장했습니다."
 AFG_the_francesc_vendrell_talks: "프란세스크 벤드렐 회담"
 AFG_the_francesc_vendrell_talks_desc: "타지키스탄 두샨베에서 국제연합 특사 프란세스크 벤드렐이 아프가니스탄의 주요 지도자들, 즉 북부동맹 사령관 아흐마드 샤 마수드, 전 낭가르하르 주지사 하지 압둘 카디르, 전 랍바니 정부 인사 사이드 후세인 안와리와 평화 회담을 열고 무함마드 아시프 모흐세니의 곤경을 논의합니다."
 AFG_assault_on_mazar_i_sharif: "마자르이샤리프 공격"
 AFG_assault_on_mazar_i_sharif_desc: "중요한 도시 마자르이샤리프를 탈환해야 하며, 이를 위해 우리는 병사들을 결집시켜 사기를 북돋울 수 있습니다."
 AFG_massoud_s_mig_and_sukho: "마수드의 미그와 수호이"
 AFG_massoud_s_mig_and_sukho_desc: "인도의 지원은 은밀하게 이루어져 왔습니다. 인도는 한동안 마수드에게 자금, 레이더 장비, 항공기 부품을 지원해 왔습니다. 약 30명의 기술자를 파견했으며, 이들은 마수드의 미그와 수호이 전투기를 정비하고 있다고 전해집니다. 인도 군사 고문들은 탈레반과 싸우는 요령도 조언했습니다. 공식적으로 인정되지는 않지만, 인도의 지원은 마수드 군대의 주축이 되었습니다."
 AFG_russian_air_lift_idea: "러시아 공중 수송"
 AFG_russian_air_lift_idea_desc: "소련식 무기와 예비 부품이 러시아에서 공중으로 들어오고 있습니다. 우리 병력은 이미 이 장비를 잘 알고 있으므로, 별도의 재훈련 없이 저렴하게 전선에 도달합니다."
 AFG_russian_air_lift: "러시아 공중 수송"
 AFG_russian_air_lift_desc: "러시아는 북부동맹과 오랫동안 은밀한 동맹 관계를 유지하며 우리 정부의 잔존 세력을 지원하기 위해 무기와 필수 물자를 제공해 왔습니다. 바로 어제 러시아 국방장관 세르게이 이바노프는 북부동맹 구성원들이 이미 익숙한 잘 알려진 소련 시대 장비로 우리 민병대를 무장시키겠다고 발표했습니다."
 AFG_mil_mi_24_gunships: "밀 Mi-24 공격 헬리콥터"
 AFG_mil_mi_24_gunships_desc: "러시아는 밀 Mi-24 공격 헬리콥터 12대를 우리에게 공급할 계획을 발표했으며, 이는 탈레반을 상대로 한 우리의 진격 노력에 귀중한 지원이 될 것입니다."
 AFG_cia_predator_surveillance_drones: "CIA 프레데터 감시 드론"
 AFG_cia_predator_surveillance_drones_idea: "CIA 프레데터 감시 드론"
 AFG_cia_predator_surveillance_drones_idea_desc: "미국 드론이 고갯길 상공을 선회하며 포착한 정보를 우리에게 전달하고 있습니다. 우리는 처음으로 실제 정보를 바탕으로 계획을 세우고 있으며, 우리 자체 네트워크도 그들의 네트워크를 기반으로 성장하고 있습니다."
 AFG_cia_predator_surveillance_drones_desc: "CIA 프레데터 감시 드론은 지형을 광범위하게 관측하고, 주요 관심 지점을 식별하며, 적대 목표물의 정확한 위치를 파악하는 데 크게 기여했습니다."
 AFG_appeal_to_washington_for_support: "워싱턴에 지원 호소"
 AFG_appeal_to_washington_for_support_desc: "지속되는 분쟁과 극단주의 세력이 제기하는 위협에 직면하여, 아프가니스탄은 군사 능력을 강화하기 위해 국제 동맹의 지원을 구해야 합니다."
 AFG_imu_countermeasures: "IMU 대응책"
 AFG_imu_countermeasures_desc: "이 위협에 대응하기 위해 아프가니스탄은 IMU 거점에 대한 표적 공습을 실시하도록 우즈베키스탄의 지원을 구하고 있습니다. 이 협력은 IMU의 능력을 약화시키고, 작전을 교란하며, 국경 지역의 치안을 회복하는 것을 목표로 합니다."
 AFG_shura_system: "슈라 체제 강화"
 AFG_shura_system_desc: "북부동맹 내 슈라 체제를 강화하는 것은 단결과 효율적인 통치를 유지하는 데 결정적입니다. 이 전통적인 협의체 기반 의사 결정 구조를 강화함으로써 모든 파벌이 대표되도록 보장합니다."
 AFG_anjuman_pass_desc: "판지시르의 사자로도 알려진 아흐마드 샤 마수드는 저항과 전술적 지도력의 상징입니다. 그의 사상을 중심으로 결집함으로써 국가는 그의 전략을 채택하고, 병사들을 고무하며, 방어를 공고히 하고자 합니다. 그의 지도 원칙은 지금까지 그래왔듯 앞으로도 아프가니스탄이 현재의 투쟁을 헤쳐 나가도록 이끌 것입니다."
 AFG_ghanis_plan: "가니의 계획"
 AFG_ghanis_plan_desc: "가니는 표적 군사 행동과 개발 사업을 통해 탈레반에 대한 지지를 차단하는 계획에 착수하고 있으며, 이를 통해 주요 지역을 안정시키고 정부의 통제를 회복하는 것을 목표로 합니다."
 AFG_secretly_support_the_opium_industry: "아편 산업 비밀 지원"
 AFG_secretly_support_the_opium_industry_desc: "산업화를 명분으로, 도시 기반은 우리가 새로운 현대화의 시대로 나아가고 있다고 믿게 될 것입니다. 그러나 우리는 국가의 근간인 농민들을 소외시킬 수 없습니다. 우리는 경제적 번영을 높이고 아프가니스탄 사회의 모든 부분을 달래는 수단으로 아편 거래를 은밀히 지원할 것입니다."
 AFG_parliamentary_illusion: "의회의 환상"
 AFG_parliamentary_illusion_idea: "의회의 환상"
 AFG_parliamentary_illusion_idea_desc: "의사당은 열리고, 토론하고, 표결하지만 중요한 것은 아무것도 결정하지 않습니다. 이를 유지하는 데 드는 비용은 적으며, 동의의 외양은 현실보다 더 큰 가치가 있습니다."
 AFG_parliamentary_illusion_desc: "도대체 의회는 무엇을 위한 것입니까? 바로 국민이 정부에 발언권이 있다고 믿게 하여 달래기 위한 것입니다. 민주적 절차를 완전히 배제할 수는 없지만, 우리는 이를 조작하여 우리의 필요에 더 잘 부합하도록 만들 수 있습니다."
 AFG_the_western_kleptocracy: "서방 도둑정치"
 AFG_ashraf_ghani: "아흐마드자이"
 AFG_ashraf_ghani_desc: "아슈라프 가니가 아프가니스탄의 새 대통령으로 선출되었습니다. 개혁이라는 위임을 받은 그는 국가를 안정시키고 제도를 재건하고자 합니다."
 AFG_endorse_the_american_candidate: "미국이 지지하는 후보 지지"
 AFG_endorse_the_american_candidate_desc: "과도 정부가 끝나가는 가운데에도 하미드 카르자이의 정부 장악력은 여전히 강력합니다. 본 합의가 선택한 후보인 카르자이는 아프가니스탄 재건과 새로운 미국 동맹국과의 지속적인 평화 증진을 중심으로 폭넓은 정부를 구성했습니다."
 AFG_the_new_chairman: "새 의장"
 AFG_the_new_chairman_desc: "선거 주기가 지나가면서 국가 원수는 통제력을 행사할 뿐만 아니라 국가의 얼굴 역할도 해야 합니다. 직위가 완전히 열려 있는 만큼, 카르자이는 지휘권을 잡고 모범을 보이며 아프가니스탄을 이끌어야 합니다."
 AFG_aptta: "APTTA"
 AFG_aptta_desc: "아프가니스탄-파키스탄 통과무역협정(APTTA)은 카르자이 행정부 시기에 서명된 파키스탄과 아프가니스탄 간의 양자 무역 협정입니다. 이 협정은 양국 간 무역을 촉진하고, 대테러 작전을 지원하며, 국경 지역의 발전을 가져오는 것을 목표로 합니다."
 AFG_saarc_membership: "SAARC 가입"
 AFG_saarc_membership_idea: "SAARC 가입"
 AFG_saarc_membership_idea_desc: "남아시아 협의 테이블의 한 자리를 차지했습니다. 신용은 더 저렴해지고, 세원은 더 안정적이며, 카불은 골칫거리가 아닌 이웃으로 대우받습니다."
 AFG_saarc_membership_desc: "아프가니스탄의 남아시아지역협력연합(SAARC) 가입은 이 나라가 지역 경제 및 정치 체제에 통합되었음을 보여 줍니다. 또한 아프가니스탄을 나락에서 끌어올릴 기회를 제공합니다."
 AFG_rebuilding_the_state: "국가 재건"
 AFG_rebuilding_the_state_desc: "탈레반 몰락 이후, 아프가니스탄 국가 건설의 주요 목표 중 하나는 국가를 밑바닥부터 복원하고 재건하는 것입니다. 경제가 무너지고 포장도로나 철도가 거의 없는 아프가니스탄은 이제 세계 질서 속에서 제 자리를 지킬 수 있는 나라로 재건되어야 합니다."
 AFG_drafting_the_constitution: "헌법 기초"
 AFG_drafting_the_constitution_desc: "헌법 서명은 인권을 보장하는 조치를 문서로 공고히 한다는 점에서 국가의 중대한 전환점이 됩니다."
 AFG_national_solidarity_program: "국민연대 프로그램"
 AFG_national_solidarity_program_desc: "아프가니스탄 국민연대 프로그램(NSP)은 3년에 걸쳐 9억 달러를 단계적으로 투입하여 아프가니스탄의 약 5,000개 마을을 복구하고 개발하려 한 정부 사업이었습니다. 이 사업은 민주적으로 선출된 지역 기관을 세우고 재건 활동을 감독하는 것을 목표로 했습니다."
 AFG_reformist_path: "개혁주의 노선"
 AFG_reformist_path_desc: "개혁주의 노선은 낡은 것을 새것으로 대체하는 것을 목표로 하며, 아프가니스탄이 아직 국가 건설의 초기 단계에 있는 지금보다 더 좋은 때는 없습니다."
 AFG_next_in_line_of_succession: "다음 후계자"
 AFG_next_in_line_of_succession_desc: "하미드 카르자이의 임기가 끝나감에 따라, 후임자가 나서서 그의 자리를 이어받아야 합니다."
 AFG_sway_local_warlords: "지역 군벌 회유"
 AFG_sway_local_warlords_desc: "지역 군벌들은 소련 침공 이래 아프가니스탄 지도부를 지배해 왔으며, 이들을 제거하는 것은 쉽지 않을 것입니다. 대신 핵심 실력자들을 파악하고 그들과 협력하여 우리의 입지를 강화해야 합니다."
 AFG_the_islamic_republic: "이슬람 공화국"
 AFG_the_islamic_republic_desc: "아프가니스탄 국가가 사라져 감에 따라 공화국의 새로운 시대가 시작되며, 이는 우리 나라의 새 출발과 새로운 형태를 의미합니다."
 AFG_the_mujahideen: "무자헤딘"
 AFG_the_mujahideen_desc: "무자헤딘, 즉 아프가니스탄 무자헤딘은 전직 저항군 사령관과 군벌들의 폭넓은 연합이며, 그 다수는 과거 북부동맹을 지지했습니다. 우리는 현상 유지에 집중해야 합니다."
 AFG_age_of_republican_leadership: "새 시대의 지도부"
 AFG_age_of_republican_leadership_desc: "이슬람 공화국이 수립되었으므로, 우리는 옛 군벌 지휘관들을 점차 퇴출하고 새로운 국방군을 위한 새로운 장교들로 대체해야 합니다."
 AFG_islamic_democracy: "이슬람 민주주의"
 AFG_islamic_democracy_desc: "새로운 장은 이슬람 사회가 아프가니스탄 국가의 주도권을 쥐고 미래로 나아가는 것으로 이어집니다. 그러나 군벌과 갱단 인물들이 탈레반 세력과 손잡고 위협을 가하며 나라를 배회하고 있는 지금은 쉴 때가 아닙니다."
 AFG_reinforce_the_government: "정부 강화"
 AFG_reinforce_the_government_desc: "나라 남부 지역에 대한 새로운 통제권을 확보했으므로, 반대 세력을 지휘하고 우리의 지도력을 많은 이들에게 드러내기에 좋은 출발이라고 생각합니다."
 AFG_agricultural_modernisation: "농업 현대화"
 AFG_agricultural_modernisation_desc: "관개, 기계화, 영농 기술을 현대화하면 농촌 지방 전역의 생산량이 늘어나고 국고는 농업 부문이라는 새로운 수입원을 얻게 될 것입니다."
 AFG_the_farmer_and_their_rifle: "농부와 소총"
 AFG_the_farmer_and_their_rifle_desc: "조국을 지키기 위해 피와 뼈를 가르는 것도 마다하지 않는 아프가니스탄의 농촌 주민들은 국가의 근간임을 보여 주었습니다. 이 공동체의 지지를 잃는 것은 우리의 몰락으로 이어지는 첫 번째 도미노가 될 것입니다."
 AFG_inheritor_of_afghanistan: "아프가니스탄의 계승자"
 AFG_inheritor_of_afghanistan_desc: "아프가니스탄은 오직 우리의 통치 아래에서만 진정으로 평화로웠습니다. 우리는 아프가니스탄 국가의 계승자가 되었으며, 세계 강대국들에게 무시당할 것이 아니라 이 업적으로 찬사를 받아야 합니다."
 AFG_second_man_of_the_state: "국가의 2인자"
 AFG_second_man_of_the_state_desc: "전직 저항군 사령관인 아타는 권력에 깊은 관심을 가져 왔습니다. 그는 아프가니스탄의 독자적인 지도자로 자리매김했으며, 다른 군벌들과의 대규모 충돌도 마다하지 않았습니다."
 AFG_dismantle_the_warlords: "군벌 해체"
 AFG_dismantle_the_warlords_desc: "깡패와 갱단이 나라의 일부 지역을 운영하고 있습니다. 우리가 진정한 현대 국민국가로 거듭나려면 이 군벌 문제를 해결하기 위해 노력해야 합니다."
 AFG_a_tolerant_state: "관용의 국가"
 AFG_a_tolerant_state_desc: "아프가니스탄은 수많은 서로 다른 민족의 고향입니다. 모든 아프가니스탄인을 하나로 여기고 전체로서 단결하겠다는 약속을 지켜야 합니다."
 AFG_naveen: "나빈"
 AFG_naveen_desc: "신아프가니스탄당, 즉 나빈은 유누스 카누니가 이끄는 아프가니스탄의 정당입니다. 이 정당은 카누니가 아흐마드 왈리 마수드가 이끄는 아프가니스탄 민족운동에서 떨어져 나오면서 창당되었습니다. 유누스 카누니는 북부동맹의 정신을 계승하는 것을 목표로 합니다."
 AFG_new_class_of_jam_iat_reformers: "자미아트 개혁가의 새로운 계층"
 AFG_new_class_of_jam_iat_reformers_desc: "유누스 카누니는 이슬람적이고 전통적인 가치를 더 포용하는 자미아트 개혁가들의 새로운 물결을 대표합니다. 이 집단은 공격적인 개종보다는 점진적인 변화에 초점을 맞춘 보다 개혁적인 접근을 채택하는 경향이 있습니다."
 AFG_counite_masouds_works: "마수드의 업적 계승"
 AFG_counite_masouds_works_desc: "북부동맹의 패배와 마수드 지도력의 종말에도 불구하고, 우리는 현대적인 아프가니스탄을 건설하기 위해 노력하면서 북부동맹의 정신을 보존하는 데 변함없이 헌신합니다."
 AFG_foster_innovation: "혁신 육성"
 AFG_foster_innovation_desc: "전직 교육부 장관으로서 유누스 카누니는 교육 부문 혁신의 절실한 필요성을 이해하고 있습니다."
 AFG_combat_electoral_corruption: "선거 부패 척결"
 AFG_combat_electoral_corruption_desc: "아프가니스탄에서 관리들은 흔히 뇌물을 이용해 부를 쌓고 권력을 유지해 왔습니다. 이제부터 우리는 선거 부정이 더 이상 용납되지 않도록 해야 합니다."
 AFG_empowering_provincial_governance: "지방 행정 강화"
 AFG_empowering_provincial_governance_desc: "아프가니스탄에서 지방 행정을 강화하는 것은 필수적입니다. 독일이 보여 주었듯이, 분권형 통치는 각 지역이 발전하여 나머지 지역을 따라잡을 수 있게 합니다."
 AFG_centralise_the_apparatus_of_the_state: "국가 기구 중앙집권화"
 AFG_centralise_the_apparatus_of_the_state_desc: "중앙집권화는 우리의 통제력을 강화하여 모든 검토와 반대 세력을 우리가 직접 관리하도록 보장할 것입니다."
 AFG_expand_the_education_ministry: "교육부 확대"
 AFG_expand_the_education_ministry_desc: "교육부를 확대하면 더 숙련된 노동력을 양성하고 더 교육받은 사회를 발전시켜 우리 국가에 크게 이로울 것입니다."
 AFG_propose_a_new_constitution: "새 헌법 제안"
 AFG_propose_a_new_constitution_desc: "현행 아프가니스탄 헌법은 현대적 기준에 미치지 못하며 대폭적인 개정이 필요합니다."
 AFG_embezzle_foreign_funds: "외국 자금 횡령"
 AFG_embezzle_foreign_funds_desc: "외국 자금 횡령은 국가에 대한 엄격한 통제를 유지하고 국민회의와 함께 우리의 통치를 지탱하는 수단이 되어 왔습니다."
 AFG_enforce_afghan_centralism: "중앙집권제 강제"
 AFG_enforce_afghan_centralism_desc: "아프가니스탄인은 농촌 중심의 부족 사회이며, 역사적으로 어떤 형태의 중앙집권화에도 부정적으로 반응해 왔습니다. 그러나 할 수 있는 일과 할 수 없는 일에 제약을 받는다면 우리 정부가 무슨 쓸모가 있겠습니까? 우리는 단호하게 나서서 중앙집권제를 강제해야 합니다."
 AFG_urban_tribal_divisions: "슈라 지도자들에 대한 양보"
 AFG_urban_tribal_divisions_desc: "일부 부족민을 도시화된 지역으로 이주시키면 그들이 더 조직화되므로 특정 지역에 더 큰 자치권과 지역 통제권을 부여할 수 있습니다."
 AFG_atlanticism: "대서양주의"
 AFG_atlanticism_desc: "대서양주의는 북아메리카와 유럽 간의 긴밀한 협력을 믿는 신념으로, 제2차 세계 대전 이후 자리 잡은 교리입니다. 아프가니스탄은 발전과 통치 면에서 보다 서구적인 모델을 채택하기를 원합니다."
 AFG_arsenal_of_democracy: "민주주의의 조병창"
 AFG_arsenal_of_democracy_desc: "미국의 무기 경제가 호황을 누리고 있으므로, 이를 우리에게 유리하게 활용하여 물자를 비축하고 앞으로 닥칠 도전에 대비해야 합니다."
 AFG_the_republic_survives_another_day: "공화국이 또 하루를 버텨냈다"
 AFG_the_republic_survives_another_day_desc: "밤이 지나 낮이 오듯, 아프가니스탄 국민의 깃발은 굳건히 서 있습니다. 평화든 전쟁이든 앞에 놓인 어떤 일에도 대비가 되어 있습니다. 한 가지는 분명합니다. 공화국은 마지막 숨이 다할 때까지 존속할 것입니다."
 AFG_defenders_of_democracy: "민주주의의 수호자"
 AFG_defenders_of_democracy_desc: "민주주의 개념이 거의 없던 국가에서 이를 온전히 받아들이는 새 정권으로 변모한 것은 전례 없는 일입니다. 우리는 의무를 다하여 이 나라와 그 이상을 어떤 대가를 치르더라도 지켜야 합니다."
 AFG_root_out_the_old_cabinet: "구 내각 척결"
 AFG_root_out_the_old_cabinet_desc: "과거 관직에 있던 자들이 여전히 의회 체제 안에 남아 있습니다. 우리는 그들을 무장 해제하고 사기꾼으로서의 정체를 폭로해야 합니다."
 AFG_moderate_islamism: "온건 이슬람주의"
 AFG_moderate_islamism_desc: "온건 이슬람주의는 이슬람에 대한 소극적이거나 전통적인 접근을 가리키며, 보다 급진적이고 혁명적인 해석과 구별됩니다."
 AFG_basej_e_milli: "녹색 흐름"
 AFG_basej_e_milli_desc: "바세즈에밀리는 라완데사브즈에아프가니스탄이라고도 불리며, 반탈레반, 아프가니스탄 민족주의, 친민주주의 성향의 정당입니다. 이 정당은 아프가니스탄의 민주적 미래와 민족 단결을 옹호하는 데 중요한 역할을 합니다."
 AFG_knife_to_the_warlords: "군벌에게 칼날을"
 AFG_knife_to_the_warlords_desc: "군벌은 이 나라를 괴롭히는 시대착오적인 개념입니다. 그들은 국민의 이름으로 행동한다고 주장하지만, 우리 모두는 그들에 맞섭니다."
 AFG_standardised_taxation: "세금 표준화"
 AFG_standardised_taxation_desc: "세금 표준화는 우리 경제가 수년간의 전쟁에서 회복하도록 해 줄 것입니다."
 AFG_enlist_the_support_of_the_people: "국민의 지지 확보"
 AFG_enlist_the_support_of_the_people_desc: "국민의 지지를 확보하면 공화국이 앞으로 닥칠 위협으로부터 구원받을 것입니다."
 AFG_recraft_the_healthcare_system: "의료 체계 재정비"
 AFG_recraft_the_healthcare_system_desc: "병원은 낡았고 복원과 수리가 필요합니다. 우리는 이 문제를 해결하는 데 우리의 역할을 해야 합니다."
 AFG_local_organisation: "지역 조직"
 AFG_local_organisation_desc: "우리는 스스로 지탱할 수 있도록 결집해야 하며, 세계 나머지 지역의 지원에 의존해서는 안 됩니다."
 AFG_lift_the_press_restrictions: "언론 규제 해제"
 AFG_lift_the_press_restrictions_desc: "자유롭고 독립적인 언론은 활기찬 민주 사회의 초석입니다."
 AFG_progressive_tax: "누진세"
 AFG_progressive_tax_desc: "부와 자원의 공정한 분배를 보장하기 위해 아프가니스탄은 누진 세제를 채택합니다."
 AFG_return_of_dostum: "도스톰의 귀환"
 AFG_return_of_dostum_desc: "아프가니스탄의 저명한 군 지도자이자 영향력 있는 인물인 압둘 라시드 도스톰 장군이 국가 무대로 복귀하고 있습니다. 그는 우즈베크 병력에 대한 강력한 지휘력과 전략적 통찰력으로 알려져 있습니다."
 AFG_mission_to_tehran: "테헤란 사절단"
 AFG_mission_to_tehran_desc: "지역 동맹을 강화하고 외부의 위협에 대응하기 위해 아프가니스탄은 테헤란으로 외교 사절단을 파견합니다. 이란이 이끄는 저항의 축에 가입함으로써 아프가니스탄은 강력한 동맹을 확보하고, 군사 능력을 높이며, 지정학적 입지를 강화하고자 합니다."
 AFG_take_command_of_rabbanis_feyzabad_forces: "랍바니의 파이자바드 병력 지휘"
 AFG_take_command_of_rabbanis_feyzabad_forces_desc: "파이자바드에 주둔한 부르하누딘 랍바니의 병력은 아프가니스탄 북동부 지역을 통제하는 데 필수적입니다. 중앙 지도부는 이 병력을 직접 지휘함으로써 지휘 체계를 통합하고, 협조를 강화하며, 이 전략적으로 중요한 지역의 방어를 강화하고자 합니다."
 AFG_karim_khalilis_new_offensive: "카림 칼릴리의 새로운 공세"
 AFG_karim_khalilis_new_offensive_desc: "저명한 지도자이자 전략가인 카림 칼릴리가 주요 영토를 되찾고 적대 세력을 몰아내기 위한 대담한 새 공세를 이끌고 있습니다. 그의 계획은 게릴라 전술, 지역 민병대 동원, 동맹군과의 전략적 협조를 결합한 것입니다."
 AFG_western_klep_tt1: "§Y외국 원조 가로채기§!가 §Y추가 수입§!에 미치는 영향 $§G0.18§! 십억"
 AFG_state_northern_stronghold_dynamic_modifier: "안주만 고개의 관문"
 AFG_taliban_assault_on_taloqan: "탈레반의 탈로칸 공격"
 AFG_state_battle_for_mazar_i_sharif_dynamic_modifier: "마자르이샤리프 공세"
 AFG_increase_road_toll_tt: "도로 통행료 인상\n통행료 단계: [?AFG_toll_level]\n주 재정 수익: $§G[?AFG_Toll_display_var]§!\n소비재: §Y[?ROOT.AFG_consumer_goods_factor_toll|%]§!"
 AFG_increase_road_toll_tt_desc: "통행료 단계는 최대 다섯 번까지 올릴 수 있으며, 단계마다 교통량과 거래된 상품의 양에 따라 국도에서 발생하는 수입이 늘어납니다. 첫 단계를 넘는 각 단계는 전국 소비재를 §Y2%§! 감소시키며, 이는 통행료가 경제 전반에 지우는 부담을 반영합니다."
 AFG_lower_road_toll_tt: "도로 통행료 인하\n통행료 단계: [?AFG_toll_level]\n주 재정 수익: $§G[?AFG_Toll_display_var]§!\n소비재: §Y[?ROOT.AFG_consumer_goods_factor_toll|%]§!"
 AFG_lower_road_toll_tt_desc: "통행료 단계를 낮추면 그 단계로 인해 감소했던 소비재 §Y2%§!가 돌아오지만, 그 단계가 벌어들이던 수입을 잃게 됩니다. 통행료는 첫 단계 아래로 낮출 수 없습니다."
 AFG_toll_below_maximum_tt: "이 주의 통행료는 §R최고 단계§!입니다."
 AFG_toll_above_minimum_tt: "이 주의 통행료는 §R최저 단계§!입니다."
 AFG_info_box: "§G통행료 징수§!\n통행료 단계: [?AFG_toll_level]\n주 재정 수익: $§G[?AFG_Toll_display_var]§!\n전국 통행료 재정 수익: $§G[?ROOT.additional_income_AFG_tolls_income1]§!\n전국 소비재: §Y[?ROOT.AFG_consumer_goods_factor_toll|%]§!"
 AFG_info_box_desc_lore: "아프가니스탄의 고속도로는 탈레반과 지역 군벌 같은 집단이 통제하며, 이들은 중앙아시아, 이란, 파키스탄을 잇는 교역로에서 수입을 얻기 위해 지역 통행료를 이용합니다. 비단길 전통에 뿌리를 둔 이 통행료는 탈레반 정권과 군벌 모두의 주요 자금원이며, 핵심 도로를 통제하는 것이 권력과 부의 관건입니다."
 AFG_usa_equipment: "CIA 개입"
 AFG_usa_equipment_desc: "미국인들은 탈레반이 현재 가진 거점을 달가워하지 않으며, 그래서 우리에게 일부 장비를 싼값에 팔겠다고 제안했습니다."
 AFG_join_sco: "SCO 가입"
 AFG_join_sco_desc: "SCO는 중국과 러시아가 이끄는 조직으로, 지역 평화, 안보, 대테러, 경제 협력을 강조합니다. SCO는 대테러 훈련과 개발 지원 등 우리나라에 필요하다고 판단되는 많은 자원을 제공할 수 있습니다. 우리는 나라의 이익을 위해 SCO에 가입해야 합니다."
 AFG_the_western_kleptocracy_desc: "변화? 변화가 누구에게 필요합니까? 우리에게는 우리를 도와줄 서방이 있고 상황은 계획대로 나아질 것입니다."
 AFG_liberal_society_desc: "성직자 기득권의 장악력을 느슨하게 하면서 카불은 언론, 시장, 공개 토론을 얻었습니다. 그 덕에 무역 상대국들은 우리를 더 진지하게 대하지만, 전선을 지키는 데 쓰는 정치적 자본은 실제로 소모됩니다."
 AFG_preserve_democracy: "민주주의 수호"
 AFG_preserve_democracy_desc: "언론이 족쇄에서 풀려나고 법원이 간섭받지 않으면서, 공화국은 다음 위기가 시험하기 전에 뿌리를 내릴 진정한 기회를 얻고 있습니다."
 AFG_indian_support_and_arms_trade: "인도의 지원과 무기 거래"
 AFG_indian_support_and_arms_trade_desc: "인도인들은 우리의 적에 맞서 우리나라를 지원하고 무장시키기로 합의했습니다."
 AFG_establishing_supply_lines: "보급선 구축"
 AFG_establishing_supply_lines_desc: "잘 관리되고 정비된 보급선을 구축함으로써 우리 병력은 계속 싸울 수 있을 만큼 충분히 보급을 받게 될 것입니다."
 AFG_russian_technical_specialists: "러시아 기술 전문가"
 AFG_russian_technical_specialists_desc: "우리는 우리 기계화 부대 작업을 위해 [SOV.GetFlag] 러시아의 전문가들을 들여왔습니다."
 AFG_the_shura_system_idea: "슈라 체제"
 AFG_the_shura_system_idea_desc: "북부동맹의 슈라 체제는 부족과 공동체의 의사 결정 관행에 뿌리를 둔 전통적인 협의체 기반 통치 형태입니다. 이 체제는 군 지도자, 부족 원로, 유력 인사를 한데 모아 숙의하고 집단적으로 결정을 내립니다. 슈라 체제는 단결을 강화하고 북부동맹 내 다양한 파벌이 전략적·정치적 사안에서 대표되고 발언권을 갖도록 보장합니다."
 AFG_civilian_exodus_taloqan: "탈로칸 민간인 대탈출"
 AFG_civilian_exodus_taloqan_desc: "탈로칸 일대의 전투로 수천 가구가 북쪽과 서쪽으로 밀려났습니다. 수용소는 우리가 할애할 수 있는 얼마 안 되는 자원을 압박하지만, 난민들은 그 지방과 함께 떠나며 전선의 입이 줄어들면 보급 부담이 가벼워집니다."
 AFG_iranian_airbridge: "이란 공중 가교"
 AFG_iranian_airbridge_desc: "탈레반이 카불을 장악한 뒤, 북부동맹에 대한 이란의 원조가 급증했습니다. 이란은 북부동맹에 막대한 양의 무기를 공급하기 위해 마슈하드와 아프가니스탄 공군 기지인 바그람 및 쿨랴브 사이에 공중 가교를 구축했습니다. 보고에 따르면 1997년 하루 동안 이란 항공기 13편이 바그람에 착륙했으며, 이란은 여전히 타지키스탄을 경유해 무기 700톤을 보낸 것으로 의심받고 있습니다."
 AFG_junbishis: "준비시"
 AFG_junbishis_desc: "§R아브둘 라시드 도스톰이 망명 중이므로 §W[Conservative_L]§!의 인기도를 수동으로 올릴 수 없습니다 §!\n\n보통 준비시로 알려진 준비시밀리이슬라미아프가니스탄은 주로 우즈베크 민족으로 구성된 북부동맹 내의 주요 파벌입니다. 최근 탈레반 세력에게 거점인 마자르이샤리프에서 쫓겨났지만, 준비시는 북부동맹 내에서 계속 중요한 역할을 하고 있습니다. 이 집단은 과거 북부동맹의 다른 구성원들과 불화했던 저명한 군벌 압둘 라시드 도스톰 장군이 이끌고 있으며, 그가 망명 중인 지금 관계는 긴장되어 있습니다."
 AFG_northern_alliance_taloqan_siege: "탈로칸 포위전"
 AFG_northern_alliance_taloqan_siege_desc: "최근 역사에서 탈로칸은 무자헤딘 파벌의 저명한 지도자 아흐마드 샤 마수드가 소련군에 맞선 저항 기간에 전략 사령부로 삼았던 곳입니다. 이후 1997년 마자르이샤리프가 탈레반 세력에게 함락된 뒤에는 [AFG.GetFlag] [AFG.GetNameDefCap]의 사령부 역할을 맡았습니다."
 AFG_idea_opium_economy: "아프가니스탄 아편 경제"
 AFG_idea_opium_economy_desc: "아프가니스탄 농민의 상당수가 아편용 양귀비를 재배하고 판매하여 생계를 유지합니다. 거대한 양귀비밭이 우리 경작지의 상당 부분을 채우고 있습니다."
 AFG_idea_opium_barons: "아프가니스탄 아편 거물"
 AFG_idea_opium_barons_desc: "아프가니스탄 농민의 상당수가 아편용 양귀비를 재배하고 판매하여 생계를 유지합니다. 거대한 양귀비밭이 우리 경작지의 상당 부분을 채우고 있습니다. 정부의 새로운 정책은 대규모 아편 거물 일당이 여러 대형 거래망을 운영하는 상황을 가능하게 했습니다. 정부 내 이 아편 거물들의 영향력은 부인할 수 없습니다."
 AFG_idea_afghan_defence: "광범위한 방어 조치"
 AFG_idea_afghan_defence_desc: "우리나라는 내전에 휩싸여 있습니다. 우리는 계속 밀려 왔지만 이제 한 걸음도 더 물러서지 않을 것입니다!"
 AFG_idea_un_troops: "국제연합 평화유지군"
 AFG_idea_un_troops_desc: "우리는 나라에 안정을 가져오기를 바라며 국제연합 평화유지군을 우리나라에 배치해 달라고 요청했습니다."
 AFG_political_events.1.t: "[AFG.GetNameDef]의 무기 요청"
 AFG_political_events.1.d: "[AFG.GetNameDef]이(가) 전투 작전을 계속 수행하는 데 필요한 장비를 우리가 공급해 주는 협정을 협상하기 위해 [ROOT.capital.GetName]에 특사를 보냈습니다."
 AFG_political_events.1.a: "수락한다"
 AFG_political_events.1.b: "오늘은 곤란하다"
 AFG_political_events.2.t: "[FROM.GetNameDef]의 우리 무기 요청 거절"
 AFG_political_events.2.d: "[FROM.GetNameDef]이(가) 우리의 무기 요청을 거부했습니다. 우리는 이 거부에 낙담하지 않고 현재의 목표를 계속 추진할 것입니다."
 AFG_political_events.2.a: "전진"
 AFG_political_events.3.t: "[FROM.GetNameDef]의 무기 수송 서명"
 AFG_political_events.3.d: "우리가 오랫동안 기다려 온 절실히 필요한 장비를 제공해 준 [FROM.GetNameDef]에 깊은 감사를 표합니다."
 AFG_political_events.3.a: "훌륭하군!"
 AFG_political_events.4.t: "최초의 아프가니스탄 선거"
 AFG_political_events.4.d: "오늘로 개표가 끝납니다. 우리는 마침내 아프가니스탄의 첫 번째 지도자를 선출하기 직전에 와 있습니다."
 AFG_political_events.4.a: "하미드 카르자이 정부"
 AFG_political_events.4.b: "나빈"
 AFG_political_events.4.c: "자미아트에이슬라미"
 AFG_political_events.4.e: "살레 정부"
 AFG_political_events.0.t: "아타의 군사 이두정치 수립"
 AFG_political_events.0.d: "전직 무자헤딘 저항군 사령관 아타 무함마드 누르가 병력을 이끌고 카불로 진군하여 모든 군사력의 일정 수준에 대한 통제권을 요구하고 있습니다. 대부분의 병력이 그의 편으로 갈라져 나간 만큼, 우리의 선택지는 극히 제한적이라고 할 수밖에 없습니다."
 AFG_political_events.0.a: "우리는 손발이 묶였다"
 AFG_events.8.t: "[AFG.GetNameDef]의 우리 보호 요청"
 AFG_events.8.d: "수십 년간의 불안 끝에 아프가니스탄 정부는 전쟁의 재발이나 외세의 간섭과 침략을 우려하고 있으며, [AFG.GetNameWithFlag]의 대통령 [AFG.GetLeader]이(가) 백악관을 방문하여 우리 대통령 [USA.GetLeader]에게 방위 조약을 요청했습니다. 우리가 그들을 보호하기로 동의하면 그들을 우리의 세력권 안에 둘 수 있겠지만, 외부 위협으로부터 [AFG.GetNameWithFlag]을(를) 방어하고 특히 £GFX_AFG_salafist_jihadism 탈레반 반란에 맞서는 등 국가 안정을 유지하는 데 지원을 제공해야 할 의무도 지게 될 것입니다. 우리나라의 상황을 고려할 때, [AFG.GetLeader]와(과) 방위 조약을 체결해야 합니까?"
 AFG_events.8.a: "그들을 보호하기로 동의한다."
 AFG_events.8.b: "이럴 시간이 없다!"
 AFG_events.9.t: "우리를 보호하기로 동의한 [USA.GetNameDef]"
 AFG_events.9.d: "우리의 신중한 외교적 노력 덕분에 [USA.GetNameWithFlag]의 대통령 [USA.GetLeader]이(가) 우리 대통령 [AFG.GetLeader]와(과) 방위 조약을 정식으로 체결했습니다. 이 방위 조약에 서명함으로써 [FROM.GetNameWithFlag]은(는) 외부의 침략으로부터 우리를 보호할 뿐만 아니라 우리의 국내 안정 유지에도 지원을 제공할 것입니다."
 AFG_events.9.a: "훌륭하다!"
 AFG_events.10.t: "서명을 거부한 [USA.GetNameDef]!"
 AFG_events.10.d: "우리 대통령 [AFG.GetLeader]이(가) 안보 지원을 요청하러 [USA.GetNameWithFlag]을(를) 방문했음에도, [USA.GetLeader]은(는) 어떤 종류의 조약에 대해서도 입을 굳게 다문 듯합니다. [USA.GetLeader]은(는) 기자회견에서 \\"우리는 아프가니스탄의 자유, 민주주의, 인권을 위해 언제나 맞설 것입니다.\\"라고 말했습니다. 그러나 [USA.GetLeader]의 약속이 말뿐이라는 것은 매우 분명하며, 우리는 홀로 우리 자신을 방어해야 할 것입니다."
 AFG_events.10.a: "참담한 방문이었다..."
 AFG_events.11.t: "[AFG.GetNameDef]의 우리 보호 요청"
 AFG_events.11.d: "수십 년간의 불안 끝에 아프가니스탄 정부는 전쟁의 재발이나 외세의 간섭과 침략을 우려하고 있으며, [AFG.GetNameWithFlag]의 대통령 [AFG.GetLeader]이(가) 중난하이를 방문하여 총서기 [CHI.GetLeader]에게 방위 조약을 요청했습니다. 우리가 그들을 보호하기로 동의하면 그들을 우리의 세력권 안에 둘 수 있겠지만, 외부 위협으로부터 [AFG.GetNameWithFlag]을(를) 방어하고 특히 £GFX_AFG_salafist_jihadism  탈레반 반란에 맞서는 등 국가 안정을 유지하는 데 지원을 제공해야 할 의무도 지게 될 것입니다. 우리나라의 상황을 고려할 때, [AFG.GetLeader]와(과) 방위 조약을 체결해야 합니까?"
 AFG_events.11.a: "또 한 명의 철의 형제다!"
 AFG_events.11.b: "조약에 쓸 여력이 없다!"
 AFG_events.12.t: "우리를 보호하기로 동의한 [CHI.GetNameDef]"
 AFG_events.12.d: "우리의 외교적 노력 덕분에 [CHI.GetNameWithFlag]의 총서기 [CHI.GetLeader]이(가) 우리 대통령 [AFG.GetLeader]와(과) 방위 조약을 정식으로 체결했습니다. 이 방위 조약에 서명함으로써 [FROM.GetNameWithFlag]은(는) 외부의 침략으로부터 우리를 보호할 뿐만 아니라 우리의 국내 안정 유지에도 지원을 제공할 것입니다."
 AFG_events.12.a: "훌륭하다!"
 AFG_events.13.t: "서명을 거부한 [CHI.GetNameDef]!"
 AFG_events.13.d: "우리 대통령 [AFG.GetLeader]이(가) 안보 지원을 요청하러 [CHI.GetNameWithFlag]을(를) 방문했음에도, [CHI.GetLeader]은(는) 어떤 종류의 조약에 대해서도 입을 굳게 다문 듯합니다. [CHI.GetLeader]은(는) 우리 대통령에게 \\"우리는 언제나 지역 안보와 안정에 헌신할 것입니다.\\"라고 말했습니다. 그러나 [CHI.GetLeader]의 약속이 말뿐이라는 것은 매우 분명하며, 우리는 홀로 우리 자신을 방어해야 합니다."
 AFG_events.13.a: "실망스럽군..."
 AFG_events.14.t: "[AFG.GetNameDef]의 두란트 선 공개 규탄"
 AFG_events.14.d: "방금 전, [AFG.GetNameWithFlag]의 대통령 [AFG.GetLeader]이(가) [AFG.GetNameWithFlag]은(는) 19세기에 영국이 임의로 설정한 두란트 선을 양국 간 국경으로 결코 인정하지 않을 것이라고 발표하며, \\"우리는 현재로서는 신성한 파슈툰의 땅을 되찾지 못할지 모르지만, 다음 세대의 우리 후손들은 정당히 우리 것인 이 땅을 반드시 되찾을 것입니다. 시간이 모든 것을 말해 줄 것입니다!\\"라고 큰 소리로 선언했습니다. [AFG.GetNameWithFlag]이(가) 이제 우리나라에 적대적인 외교 정책으로 돌아서고 있다는 것은 매우 분명합니다."
 AFG_events.14.a: "그런 짓을 할 정당성은 전혀 없다!"
 AFG_events.15.t: "부르하누딘 랍바니 암살"
 AFG_events.15.d: "오늘 저녁 부르하누딘 랍바니가 카불의 자택에서 자살 폭탄 테러로 암살당했으며, 오늘은 그의 71번째 생일이기도 합니다. 탈레반 대표를 자처한 두 남자가 포옹을 하겠다며 그에게 다가갔고, 그중 한 명이 터번 안에 숨긴 폭발물을 터뜨렸습니다. 자폭범은 파키스탄의 탈레반 지도부로부터 매우 중요하고 긍정적인 메시지를 전달받았다고 주장하는 탈레반 지휘관이라고 밝혔습니다. 그들은 탈레반이 랍바니와 평화를 논의하고 싶어 한다고 말했습니다. 우리 정부 고등평화위원회의 다른 위원 네 명도 폭발로 사망했습니다. 파키스탄 퀘타에 숨어 있는 탈레반 지도부인 퀘타 슈라가 이번 암살의 배후라는 사실을 우리 정보원이 확인했습니다.\n\n랍바니는 정부 내 주요 직책에서 물러난 뒤 우리나라의 고등평화위원회 위원장을 맡았습니다. 그 기간 그는 수백 명의 탈레반 무장 세력을 설득해 평화적으로 무기를 내려놓게 하는 데 성공했습니다. 이번 암살은 그만한 명망을 가진 인물을 이 자리에 앉히기 어렵다는 점에서 우리나라 평화 프로세스에 큰 타격입니다."
 AFG_events.15.a: "국장을 치른다."
 AFG_events.16.t: "[AFG.GetNameDef]의 중립 승인 요구"
 AFG_events.16.d: "최근 [AFG.GetNameDef]은(는) 영세 중립국이 되기 위해 중립의 길을 추구하기로 했습니다. 그들은 영세 중립국으로서의 의무를 이행할 의지를 보여 주었으나, 실제로 이행될지는 지켜봐야 합니다.\n\n아프가니스탄 정부는 이제 우리나라가 그들의 중립국 지위를 보장해 주기를 구하고 있습니다. 우리가 보장한다면 아프가니스탄이 침공당할 경우 이를 지킬 의무를 지게 됩니다. 보장하지 않더라도 다른 나라들이 그들의 지위를 보장할 수 있으며, 우리는 이로 인해 잃을 것이 없습니다."
 AFG_events.16.a: "중립 강국으로서의 지위를 보장하기로 동의한다"
 AFG_events.16.b: "아프가니스탄에 쓸 시간이 없다"
 AFG_events.17.t: "[FROM.GetNameDef]의 우리 중립 지위 보장"
 AFG_events.17.d: "[FROM.GetAdjective] 정부의 성명에 따르면 [FROM.GetNameDef]은(는) 우리의 중립 지위를 보장할 용의가 있으며, 우리나라가 외부의 침공을 받을 경우 우리를 방어하러 올 것입니다.\n\n우리가 유엔 안전보장이사회 상임이사국 최소 한 곳으로부터 중립 지위를 승인받았다는 점에서 이는 중대한 성과입니다."
 AFG_events.17.a: "훌륭하다!"
 AFG_events.18.t: "탈레반에 맞서 봉기한 아프가니스탄 국민"
 AFG_events.18.d: "항구적 자유 작전 이후 여러 부족 및 소수 민족 민병대가 특히 헤라트에서 탈레반에 맞선 봉기를 일으켰습니다. 미국과 이란의 지원으로 이 민병대들은 탈레반으로부터 여러 지역의 통제권을 빼앗았으며 북부동맹의 지휘 아래 들어갔습니다.\n\n봉기는 현지 주민들의 축하 총성으로 맞이되었으며, 일부 축하 행사에는 '옥상 위의 춤'과 자동차 경적 소리까지 있었습니다. \\"헤라트의 사자\\"로도 알려진 북부동맹의 핵심 사령관 중 한 명인 무함마드 이스마일 칸은 전직 탈레반 전투원들에게 사면을 부여했으나, 이들이 다시 무기를 든다면 보복이 있을 것이라고 경고했습니다."
 AFG_events.18.a: "승리가 가까웠다!"
 AFG_news.7.t: "[AFG.GetNameDef]의 파키스탄 영토 영유권 선언"
 AFG_news.7.d: "방금 전, [AFG.GetNameWithFlag]의 대통령 [AFG.GetLeader]이(가) [AFG.GetNameWithFlag]은(는) 19세기에 영국이 임의로 설정한 두란트 선을 양국 간 국경으로 결코 인정하지 않을 것이라고 발표하며, \\"우리는 현재로서는 신성한 파슈툰의 땅을 되찾지 못할지 모르지만, 다음 세대의 우리 후손들은 정당히 우리 것인 이 땅을 반드시 되찾을 것입니다. 시간이 모든 것을 말해 줄 것입니다!\\"라고 큰 소리로 선언했습니다. [PAK.GetNameWithFlag]의 대통령 [PAK.GetLeader]은(는) [AFG.GetLeader]이(가) 제기한 모든 영유권 주장을 거부하며 이에 응답했고, \\"[AFG.GetLeader]이(가) 취한 적대적 외교 행위는 양국 관계를 더욱 해치는 것 외에는 아무것도 가져오지 못할 것입니다.\\"라며 이 행동을 강력히 비판하고 아프가니스탄 정부에 국제법을 존중할 것을 촉구했습니다. 양국의 외교 관계가 더욱 악화되었음이 매우 분명합니다."
 AFG_news.7.a: "다음에 무슨 일이 일어나는지 지켜보자."
 AFG_news.8.t: "아프가니스탄에서 쿠데타"
 AFG_news.8.d: "중앙 정부의 부패와 국민의 경제적 궁핍 및 빈곤으로 생계를 잃고 현 상황에 환멸을 느낀 많은 아프가니스탄인이 헤크마티아르의 £GFX_AFG_kingdom 헤즈베이슬라미에 합류했습니다. 오랫동안 급여를 받지 못한 일군의 아프가니스탄 군 장교들이 쿠데타를 일으켜 공화제 정부를 무너뜨리고, 현행 아프가니스탄 헌법의 효력 정지와 군정의 임시 시행을 선포했습니다. 1990년대에 두 차례 아프가니스탄 총리를 지낸 굴부딘 헤크마티아르는 공식적으로 망명 생활을 끝내고 아프가니스탄의 새 대통령으로 귀국했습니다. 헤크마티아르는 부패를 근절하고, 경제를 되살리며, 아프가니스탄 국민을 새로운 장으로 이끌겠다고 약속했습니다. 쿠데타에 대응하여 탈레반 대변인은 \\"우리가 진정한 아프가니스탄인이며, 우리는 \\"카불의 도살자\\" 헤크마티아르를 계속 쓰러뜨릴 것입니다.\\"라는 성명을 발표했습니다."
 AFG_news.8.a: "끝나지 않는 전쟁의 또 다른 장..."
 AFG_news.9.t: "[AFG.GetNameDef]의 도시 내 군 배치"
 AFG_news.9.d: "정치적 자유와 개인의 자유 억압, 탈레반식 샤리아 법, 부족 영향력 제거 등 [AFG.GetLeader] 지도부의 최근 급진적 정책으로 인해 집권 정부에 맞선 대규모 시위가 시작되었으며, [AFG.GetLeader]의 정부는 도시와 마을에 군을 배치하는 것으로 대응했고 일부 시위대는 아프가니스탄 국군 병사나 아프가니스탄 국가경찰 부대의 총격에 치명상을 입었습니다. [AFG.GetNameDef]이(가) 전체주의로 빠져들고 있는 것으로 보입니다."
 AFG_news.9.a: "그것이 아프가니스탄의 일상이지..."
 AFG_news.10.t: "부르하누딘 랍바니 암살"
 AFG_news.10.d: "부르하누딘 랍바니가 오늘 밤 카불의 자택에서 자살 폭탄 테러로 암살당했습니다. 랍바니와 평화를 논의하고 싶다고 주장한 탈레반 대표를 자처한 두 명의 자폭범이 포옹을 하겠다며 그에게 다가갔고, 그중 한 명이 터번 안에 든 폭발물을 터뜨렸습니다. 아프가니스탄 고등평화위원회의 다른 위원 네 명도 폭발로 사망했습니다.\n\n랍바니는 정부 내 주요 직책에서 물러난 뒤 아프가니스탄 고등평화위원회 위원장을 맡았습니다. 그 기간 그는 수백 명의 탈레반 무장 세력을 설득해 평화적으로 무기를 내려놓게 하는 데 성공했습니다. 그의 암살은 아프가니스탄 평화 프로세스에 큰 타격입니다."
 AFG_news.10.a: "비극적인 소식이다."
 AFG_news.11.t: "아리아나 항공 805편 납치"
 AFG_news.11.d: "탈레반 정권을 피해 달아나던 알리와 무함마드 사피 형제가 이끄는 아프가니스탄 남성 아홉 명이 승객 180명과 승무원 7명을 태운 등록번호 YA-FAY의 보잉 727 항공기, 아리아나 아프가니스탄 항공 805편을 납치했습니다. 805편은 카불에서 마자르이샤리프 공항으로 향하는 국내선이었습니다.\n\n납치범들은 타슈켄트, 악퇴베, 모스크바에 기착한 뒤 승무원들에게 영국 런던 스탠스테드 공항으로 비행하도록 강요했습니다. 항공기 포위는 2월 10일까지 이어졌습니다. 납치범들이 내년에 재판을 앞두고 있어 유죄 판결을 받을지는 알 수 없습니다."
 AFG_news.11.a: "우리 미그기로 요격했어야 했다."
 AFG_news.12.t: "아리아나 항공 805편 납치"
 AFG_news.12.d: "탈레반 정권을 피해 달아나던 알리와 무함마드 사피 형제가 이끄는 아프가니스탄 남성 아홉 명이 승객 180명과 승무원 7명을 태운 등록번호 YA-FAY의 보잉 727 항공기, 아리아나 아프가니스탄 항공 805편을 납치했습니다. 805편은 카불에서 마자르이샤리프 공항으로 향하는 국내선이었습니다.\n\n납치범들은 타슈켄트, 악퇴베, 모스크바에 기착한 뒤 승무원들에게 영국 런던 스탠스테드 공항으로 비행하도록 강요했습니다. 항공기 포위는 2월 10일까지 이어졌습니다. 납치범들이 내년에 재판을 앞두고 있어 유죄 판결을 받을지는 알 수 없습니다."
 AFG_news.12.a: "흥미롭군"
 AFG_news.12.b: "테러리즘은 인류의 재앙이다."
 AFG_news.13.t: "이란의 아프가니스탄 난민 송환"
 AFG_news.13.d: "UNHCR과 합의에 이른 후, 이란은 향후 3주 동안 아프가니스탄 난민 7,700명을 고국으로 돌려보내는 송환 프로그램을 시작했습니다."
 AFG_news.13.a: "이 전쟁에 끝은 있을까?"
 AFG_news.14.t: "수천 명을 굶주리게 한 아프가니스탄 전쟁"
 AFG_news.14.d: "세계식량계획은 칸다하르 주와 자불 주의 가뭄 상황이 절박하다고 보고했습니다. 쿠치 부족은 가축의 최대 80%를 잃었고 빗물을 모으기 위해 만든 관개 시설은 말라 버렸습니다. 살구나무와 아몬드나무는 시들어 열매를 맺지 못했습니다. 낙타들은 죽어 가고 있었습니다. 2월 이후 세계식량계획은 이 지역의 3만 가구에 식량을 공급해 왔으며 5월에 1만 가구를 추가할 계획이었습니다. 세계식량계획은 아프가니스탄인들이 마을에 남아 있는 조건으로 추가 밀가루를 제공하고 있었습니다."
 AFG_news.14.a: "아프가니스탄 국민은 우리가 필요하다."
 AFG_events.32.t: "함락된 탈로칸 성"
 AFG_events.32.d: "탈레반의 무자비한 점령은 대규모 탈출을 불러왔고, 민간인들은 이맘 사히브와 판지시르 계곡을 향해 달아났습니다. 수백 명의 민간인 목숨을 앗아간 잔혹한 포위전 끝에 우리 병사들은 도시 북쪽과 동쪽으로의 탈레반 진격을 저지했으나 도시를 되찾지는 못했습니다. 우리는 도시에 있던 북부동맹 사령부를 포기하고 작전 기지를 파이자바드로 옮겼습니다."
 AFG_events.32.a: "어두운 날"
 AFG_events.31.t: "또 하루를 버텨낸 탈로칸"
 AFG_events.31.d: "잔혹한 포위전을 견뎌낸 끝에 탈레반은 패배를 맛보았습니다. 이 승리는 우리가 앞서 거둔 승리들의 회복력을 되울립니다. 이것이 탈레반의 궁극적인 파멸을 향한 또 하나의 걸음이 되기를 바랍니다. \\"탈로칸은 알라의 보물이 있는 곳입니다. 그 보물은 금과 은이 아니라, 마땅히 그래야 하듯 알라를 알아본 사람들로 이루어져 있습니다.\\""
 AFG_events.31.a: "어두운 날"
 AFG_investment.1.t: "[AFG.GetNameDef]의 자국 사업 투자 초청"
 AFG_investment.1.desc: "탈레반과의 전쟁에서 최근 회복한 [AFG.GetNameWithFlag] 정부가 우리를 자국의 일부 사업에 투자하도록 초청하고 있습니다. 그러나 투자 여부는 우리에게 달려 있습니다. 투자하기로 한다면 그들의 정부에 어느 정도 영향력을 얻을 수 있지만, 아프가니스탄의 테러 위협이 여전히 높다면 위험을 감수하지 않는 편이 낫습니다."
 AFG_investment.1.a: "그들의 기반시설에 투자한다!"
 AFG_investment.1.b: "그들의 민수 산업에 투자한다!"
 AFG_investment.1.c: "그들의 서비스 산업에 투자한다!"
 AFG_investment.1.d: "위험을 감수하지 않는 편이 낫다."
 AFG_investment.2.t: "우리 기반시설에 대한 [FROM.GetNameDef]의 투자!"
 AFG_investment.2.d: "며칠간의 협상 끝에 [FROM.GetNameWithFlag]은(는) 약간의 최소한의 양보를 대가로 우리의 기반시설에 투자하기로 합의했습니다. 이 투자는 나라의 농촌 인구에게 이익이 될 것입니다."
 AFG_investment.2.a: "그들의 도움에 감사한다!"
 AFG_investment.3.t: "우리 민수 산업에 대한 [FROM.GetNameDef]의 투자!"
 AFG_investment.3.d: "며칠간의 협상 끝에 [FROM.GetNameWithFlag]은(는) 약간의 사소한 양보를 대가로 우리가 민간 공장을 짓는 것을 돕기로 합의했습니다. 이 투자는 우리나라의 산업 부문에 이익이 되고 나라의 현대화를 촉진할 것입니다."
 AFG_investment.3.a: "그들의 도움에 감사한다!"
 AFG_investment.4.t: "우리 서비스 산업에 대한 [FROM.GetNameDef]의 투자!"
 AFG_investment.4.d: "며칠간의 협상 끝에 [FROM.GetNameWithFlag]은(는) 약간의 사소한 양보를 대가로 사무실을 짓는 방식으로 우리의 서비스 산업에 투자하기로 합의했습니다. 이 투자는 우리나라의 금융 부문에 이익이 되고 나라의 현대화를 촉진할 것입니다."
 AFG_investment.4.a: "그들의 도움에 감사한다!"
 AFG_investment.5.t: "[FROM.GetNameDef]의 투자 거절!"
 AFG_investment.5.d: "며칠간의 협상 끝에 [FROM.GetNameWithFlag]은(는) 우리나라의 사업 환경이 아직 충분히 안전하지 않다며 우리의 투자 초청을 거절했으며, 향후 우리와의 투자 거래를 신중히 평가할 것이라고 밝혔습니다."
 AFG_investment.5.a: "더 노력해야겠군!"
 AFG_taliban_insurgency.0.t: "탈레반 반란의 시작"
 AFG_taliban_insurgency.0.d: "탈레반 주력이 붕괴한 후, 그들의 대대는 여러 분파 세포로 쪼개져 아프가니스탄 구석구석에서 게릴라전을 벌이고 극악한 테러 공격을 감행하기 시작했습니다. 이 반란을 제대로 진압하는 데는 수년이 걸릴 것으로 추정되지만, 우리가 이 상황에 대처하지 않는다면 나라에 안정은 결코 찾아오지 않을 것입니다."
 AFG_taliban_insurgency.0.a: "이제 일을 시작할 때다!"
 AFG_taliban_insurgency.1.t: "탈레반 은신처 급습 성공"
 AFG_taliban_insurgency.1.d: "용감한 특공대 덕분에 우리가 발견한 탈레반 은신처가 파괴되었습니다. 일부 탈레반 무장 세력은 저항하려 했으나 우리 특공대에 의해 사살되었고, 대부분은 항복했으며 법망을 피해 달아난 자는 극소수였습니다. 전반적으로 작전은 대성공이었습니다!"
 AFG_taliban_insurgency.1.a: "훌륭하다!"
 AFG_taliban_insurgency.2.t: "급습 실패"
 AFG_taliban_insurgency.2.d: "급습을 결정적으로 수행하는 데 실패한 것은 우리 대테러 특공대에 큰 타격이었습니다. 탈레반은 우리의 급습 계획을 미리 알고 있었던 것으로 보이며, 우리 호송대 일부를 선제 공격하여 반드시 지나야 하는 경로에 급조폭발물을 설치하고 폭발이 일어난 뒤 우리 특공대를 매복 공격했습니다. 그 결과 안타깝게도 여러 특공대원이 목숨을 잃었습니다.\n\n사후 보고에서 일부 군 장성들은 작전 기획자들 가운데 탈레반에 계획을 유출했을 수 있는 동조자가 있었을 것으로 의심하고 있으며, 사후 보고서는 특공대원들의 희생을 초래했을 수 있는 정부의 부패도 비판했습니다. 우리는 이 실패를 검토하고 교훈을 얻어야 합니다!"
 AFG_taliban_insurgency.2.a: "우리 영웅들이여, 편히 잠드소서!"
 AFG_taliban_insurgency.3.t: "공습 성공"
 AFG_taliban_insurgency.3.d: "좋은 소식입니다! 숙련된 우리 군인이 조종하는 공군의 대반란 항공기가 정보기관이 제공한 좌표를 바탕으로 탈레반 야영지를 성공적으로 파괴했으며, 탈레반 야영지는 완전히 파괴되고 그 안에 있던 다수의 탈레반 무장 세력이 사살되었습니다.\n\n이 성공은 우리나라 정보기관 내부 보안 부문의 효율성을 보여 주었으며, 향후 대반란 작전에서 기술이 필수적임을 입증합니다."
 AFG_taliban_insurgency.3.a: "대성공이다!"
 AFG_taliban_insurgency.4.t: "공습 실패로 민간인 사망"
 AFG_taliban_insurgency.4.d: "끔찍한 소식입니다! 우리 공군은 정보기관이 제공한 좌표를 바탕으로 목표물을 폭격했으나, 폭탄이 민간 목표물에 떨어져 의도했던 탈레반 전투원이 아닌 무고한 민간인이 사망했음이 이제 분명해졌습니다.\n\n지역 주민들은 애도에 잠겨 있으며 이 실패한 작전에 당연히 분노하고 있고, 이미 이 지역에서 시위가 일어났다는 보고가 있습니다. 우리 시민들에게 설명하기 위해 이 작전이 실패한 이유를 검토해야 합니다."
 AFG_taliban_insurgency.4.a: "비극이다!"
 AFG_taliban_insurgency.5.t: "탈레반 무장 세력에게 항공기 격추"
 AFG_taliban_insurgency.5.d: "공습 작전에서 비극적인 소식이 들어왔습니다! 우리 대반란 항공기 한 대가 탈레반 무장 세력이 어깨에 메고 쏘는 대공 미사일에 격추되었으며, 조종사는 사망했습니다.\n\n이 작전 실패는 향후 작전을 위해 공군을 재편하고 탈레반 목표물에 대한 더 나은 정보를 확보해야 함을 보여 주었습니다."
 AFG_taliban_insurgency.5.a: "영웅적인 조종사여, 편히 잠드소서!"
 AFG_taliban_insurgency.6.t: "단결 선전 성공"
 AFG_taliban_insurgency.6.d: "단결 선전 노력 덕분에 일부 탈레반 전투원들이 우리 경찰과 군 검문소로 찾아와 무기를 내려놓았고, 일부는 우리 병사와 지역 경찰을 얼싸안기도 했습니다. 우리 병사와 경찰은 그들을 지나치게 괴롭히지 않았으며, 오히려 무기를 내려놓은 많은 탈레반 무장 세력에게 집에 돌아갈 노잣돈을 주었습니다. 이는 정부에 대한 국민의 신뢰와 국민 통합을 높이는 결과를 낳았습니다."
 AFG_taliban_insurgency.6.a: "성공적인 진전이다!"
 AFG_taliban_insurgency.7.t: "단결 선전 실패"
 AFG_taliban_insurgency.7.d: "최근의 단결 선전 노력이 긍정적인 성과를 거두지 못한 것은 우리 정부에게 크게 실망스러운 일입니다. 하부 탈레반 지휘관들이 전하는 말에 따르면, 탈레반 지도부는 현 아프가니스탄 정부를 도둑들의 정부이자 외국 정부의 꼭두각시이며 아프가니스탄 민족을 전혀 대표하지 않는 정부로 봅니다. 그들은 자신들이 진정한 아프가니스탄인이라고 생각합니다."
 AFG_taliban_insurgency.7.a: "우리 쪽에서 더 노력해야 할지도 모른다..."
 AFG_taliban_insurgency.8.t: "탈레반 반란 소탕"
 AFG_taliban_insurgency.8.d: "몇 시간 전 아프가니스탄 정부는 탈레반 반란을 성공적으로 소탕했다고 공식 확인했습니다. 아프가니스탄 정부가 공개한 정보에 따르면 탈레반의 압도적 다수가 평화적으로 무기를 내려놓고 집으로 돌아갔습니다.\n\n소수의 강경한 탈레반 무장 세력은 아프가니스탄-파키스탄 국경을 넘어 파키스탄 부족 지역으로 달아나 그곳의 지역 무장 단체에 합류했습니다. 아프가니스탄 정부가 아프가니스탄-파키스탄 국경을 따라 보안 조치를 충분히 구축했으므로, 파키스탄에 자리 잡은 무장 세력이 국경을 넘어 다시 침투할 가능성은 낮습니다."
 AFG_taliban_insurgency.8.a: "오랜 분쟁이 마침내 끝난 것일까?"
 AFG_taliban_insurgency.10.t: "탈레반의 대규모 반란 개시"
 AFG_taliban_insurgency.10.d: "최근 탈레반 공격의 급증과 폭력의 증가는 탈레반에게 반란을 다시 한번 내전으로 확대할 기회를 주었습니다. 탈레반은 농촌 지역의 넓은 지역을 장악했으며, 남서부의 주요 거점을 이루고 다른 일부 농촌 지역도 그들의 지배 아래 떨어졌습니다.\n\n아프가니스탄 국군 일부에서는 병사들이 이탈했고 그중 일부는 탈레반에 합류했으나, 대부분은 탈레반에게 숙청당할까 두려워 남아서 탈레반에 저항하기로 했습니다.\n\n국제 사회가 우리를 지원할지는 불확실하지만, 우리는 병사들을 결집시켜 승리를 향해 싸워야 합니다."
 AFG_taliban_insurgency.10.a: "싸우는 것 외에 선택의 여지가 없다!"
 AFG_taliban_insurgency.11.t: "탈레반의 대규모 반란 개시"
 AFG_taliban_insurgency.11.d: "최근 탈레반 공격의 급증과 폭력의 증가는 탈레반에게 반란을 다시 한번 내전으로 확대할 기회를 주었습니다. 탈레반은 농촌 지역의 넓은 지역을 장악했으며, 남서부의 주요 거점을 이루고 다른 일부 농촌 지역도 그들의 지배 아래 떨어졌습니다.\n\n아프가니스탄 국군 일부에서는 병사들이 이탈했고 그중 일부는 탈레반에 합류했으나, 대부분은 탈레반에게 숙청당할까 두려워 남아서 탈레반에 저항하기로 했습니다.\n\n아프가니스탄 지도자 [AFG.GetLeader]은(는) 반란을 진압하겠다고 발표했으며, 평화가 찾아올 때까지 싸우겠다고 약속했습니다."
 AFG_taliban_insurgency.11.a: "아프가니스탄은 다시 전쟁 중이다..."
 AFG_taliban_insurgency.14.t: "아프가니스탄의 상황"
 AFG_taliban_insurgency.14.d: "아프가니스탄 정부가 자국 영토에 우리 군을 주둔시키도록 허용했지만, 우리 군 정보기관은 탈레반이 현재 아프가니스탄 구석구석에서 반란을 벌이고 있으며 아프가니스탄의 불안정한 상황을 이용하는 수많은 다른 테러 단체가 있다고 경고합니다. 테러 위협은 그곳에 주둔한 우리 병력에게 실질적인 위험이 될 수 있는 위험 수준에 이르렀습니다.\n\n아프가니스탄에서 병력의 위치를 계속 유지한다면, 그들은 탈레반과 이 나라에서 활동하는 다른 테러 단체의 표적이 될 가능성이 높습니다. 그러나 이 나라에 남는다면 아프가니스탄 정부군의 대반란 작전을 지원하기로 선택할 수 있습니다. 그렇게 한다면 우리 군은 다양한 대반란 및 대게릴라전 기술 같은 귀중한 경험을 얻을 수 있고, 아프가니스탄에 있는 우리 시민도 보호할 수 있습니다.\n\n[ROOT.GetLeader] 각하, 아프가니스탄에 병력을 계속 주둔시키기로 결정하신다면 말리지 않겠습니다만, 그만한 위험을 감수할 가치가 정말 있는지 신중히 생각해 주십시오."
 AFG_taliban_insurgency.14.a: "아프가니스탄의 대반란 노력에 기여한다."
 AFG_taliban_insurgency.14.b: "우리 장병들의 목숨을 걸지 않는 편이 낫다."
 AFG_taliban_insurgency.15.t: "우리의 투쟁에 동참한 [FROM.GetNameDef]"
 AFG_taliban_insurgency.15.d: "[FROM.GetNameDef]의 지도자 [FROM.GetLeader]이(가) 우리 정부에, 우리나라에 주둔한 [FROM.GetAdjective] 병력이 자국 시민을 보호하는 것에 더해 탈레반에 맞선 대반란 전투에서 우리의 투쟁에 기꺼이 동참할 것이라고 알려 왔습니다.\n\n또한 [FROM.GetName]은(는) 폭발물 탐지 장치 및 기타 보다 선진적인 군사 장비 같은 보안 지원도 제공할 것입니다."
 AFG_taliban_insurgency.15.a: "도움에 감사한다!"
 AFG_taliban_insurgency.16.t: "[FROM.GetNameDef]의 병력 철수 시작"
 AFG_taliban_insurgency.16.d: "[FROM.GetNameDef]의 지도자 [FROM.GetLeader]이(가) 우리 정부에, 우리나라에 주둔한 [FROM.GetAdjective] 병력이 임무를 완수했으며 병사들이 귀국길에 오르고 있다고 알려 왔습니다.\n\n우리나라 내 [FROM.GetAdjective] 병력의 지휘관은 이미 우리 지휘관들과 기지 인계 절차를 시작했습니다."
 AFG_taliban_insurgency.16.a: "안녕히 가시오!"
 AFG_taliban_insurgency.17.t: "탈레반 은신처 급습 성공"
 AFG_taliban_insurgency.17.d: "용감한 특공대 덕분에 우리가 발견한 탈레반 은신처가 파괴되었습니다. 일부 탈레반 무장 세력은 저항하려 했으나 우리 특공대에 의해 사살되었고, 대부분은 항복했으며 법망을 피해 달아난 자는 극소수였습니다. 전반적으로 작전은 대성공이었습니다!"
 AFG_taliban_insurgency.17.a: "훌륭하다!"
 AFG_taliban_insurgency.18.t: "급습 실패"
 AFG_taliban_insurgency.18.d: "급습을 결정적으로 수행하는 데 실패한 것은 우리 대테러 특공대에 큰 타격이었습니다. 탈레반은 우리의 급습 계획을 미리 알고 있었던 것으로 보이며, 우리 호송대 일부를 선제 공격하여 반드시 지나야 하는 경로에 급조폭발물을 설치하고 폭발이 일어난 뒤 우리 특공대를 매복 공격했습니다. 그 결과 안타깝게도 여러 특공대원이 목숨을 잃었습니다.\n\n사후 보고에서 일부 군 장성들은 작전 기획자들 가운데 탈레반에 계획을 유출했을 수 있는 동조자가 있었을 것으로 의심하고 있으며, 사후 보고서는 특공대원들의 희생을 초래했을 수 있는 정부의 부패도 비판했습니다. 우리는 이 실패를 검토하고 교훈을 얻어야 합니다!"
 AFG_taliban_insurgency.18.a: "편히 잠드소서!"
 AFG_taliban_insurgency.21.t: "드론 공격 성공"
 AFG_taliban_insurgency.21.d: "탈레반에 대한 우리의 드론 공격이 성공했습니다! 우리 드론은 도시 지역 인근의 탈레반 은신처 여러 곳을 포착하고 타격하여 파괴할 수 있었으며, 이 지역에서 그들의 군사 능력을 마비시키고 현지 지휘 구조를 일시적으로 완전히 와해시켰습니다.\n\n처음에는 드론 공격을 두려워했지만, 지역 주민들은 이제 적어도 당분간은 탈레반 반군의 퇴각을 축하하고 있습니다."
 AFG_taliban_insurgency.21.a: "드론은 전쟁의 미래다!"
 AFG_taliban_insurgency.22.t: "드론 공격 실패로 민간인 사망"
 AFG_taliban_insurgency.22.d: "오늘 우리 드론 한 대가 주거 지역 인근의 탈레반 은신처로 보이는 곳을 표적으로 삼아 파괴했으나, 최근 정보 보고서는 표적이 된 건물이 실제로는 민간인이 거주하던 소규모 아파트 건물이었다고 결론지었습니다.\n\n언론 기자들이 이미 이 사건을 보도하고 있으며 많은 단체가 이 전쟁에 대한 우리의 개입을 비판하고 있습니다."
 AFG_taliban_insurgency.22.a: "기술적 오류였다!"
 AFG_taliban_insurgency.23.t: "폭격 작전 성공"
 AFG_taliban_insurgency.23.d: "정보 보고에 따르면 오늘 우리 전략 폭격기 한 대가 아프가니스탄 동부 산악에 숨겨진 탈레반 터널 단지를 파괴했습니다.\n\n우리의 성공적인 폭격 작전은 나라의 고립된 지역에서 탈레반의 작전을 마비시키기 시작했으며, 그들의 기반시설이 붕괴하면 결국 탈레반은 항복할 수밖에 없을 것입니다."
 AFG_taliban_insurgency.23.a: "지하디스트들은 우리의 공군력을 두려워하는 법을 배울 것이다!"
 AFG_taliban_insurgency.24.t: "오폭으로 민간인 사망"
 AFG_taliban_insurgency.24.d: "오늘 참담한 사건이 발생했습니다!\n\n우리 공군은 아프가니스탄 동부의 산악 지대를 폭격했으나, 그곳에는 탈레반 야영지가 없고 산 사이에 작은 마을이 있었다는 사실을 뒤늦게 알게 되었습니다. 우리의 폭격 비행의 결과로 마을은 완전히 파괴되었습니다.\n\n우리 공중 작전의 신뢰성이 심각한 의문에 부쳐졌습니다. 우리 정치인들과 군 지휘부는 아프가니스탄 국민에 대한 전쟁 범죄 혐의로 비난받고 있습니다."
 AFG_taliban_insurgency.24.a: "끔찍한 일이다!"
 AFG_taliban_insurgency.25.t: "[FROM.GetNameDef]의 기술 장비 제공"
 AFG_taliban_insurgency.25.d: "[FROM.GetAdjective] 정부가 우리 지도부에 보낸 메시지에 따르면, [FROM.GetNameDef]은(는) 고속도로나 출입구에 설치할 수 있는 폭발물 탐지 장치, 은닉된 폭발물을 탐지하도록 특별히 훈련된 개, 그리고 탈레반 반란에 대처하는 우리 군과 경찰의 효율성을 높이기 위한 기타 전자 장비를 포함한 대반란 기술 장비를 제공할 것입니다.\n\n장비는 한 달 안에 도착할 예정이며, 적어도 단기간 동안은 탈레반 반란의 확산을 줄여 주기를 기대합니다."
 AFG_taliban_insurgency.25.a: "도움에 감사한다!"
 AFG_taliban_attack.0.t: "지역 경찰서를 공격한 탈레반 무장 세력"
 AFG_taliban_attack.0.d: "오늘 탈레반 무장 세력 한 무리가 경고 없이 우리 정부의 경찰 검문소 한 곳을 매복 공격했습니다. 우리 경찰은 분명 준비가 되어 있지 않아 허를 찔렸으며, 상관들이 검문소 철수 명령을 내릴 때까지 용감히 싸웠습니다.\n\n군이 통보를 받고 경찰을 지원하기 전까지 탈레반 무장 세력이 검문소를 점령하고 있었습니다. 다만 검문소 무기고에 있던 무기는 탈레반에게 탈취당했습니다. 공격 중 우리 경찰과 군은 여러 탈레반 무장 세력을 사살했지만, 우리 경찰 역시 용감한 대원 여럿을 잃었습니다."
 AFG_taliban_attack.0.a: "그들은 이 대가를 치를 것이다!"
 AFG_taliban_attack.1.t: "탈레반의 경찰서 공격"
 AFG_taliban_attack.1.d: "오늘 아프가니스탄 탈레반 무장 세력 한 무리가 경고 없이 아프가니스탄 정부의 경찰 검문소 한 곳을 매복 공격했습니다. 아프가니스탄 경찰은 분명 준비가 되어 있지 않아 허를 찔렸지만, 상관들이 검문소 철수 명령을 내릴 때까지 용감히 싸웠습니다.\n\n아프가니스탄 군이 통보를 받고 경찰을 지원하기 전까지 탈레반 무장 세력이 검문소를 점령하고 있었습니다. 다만 검문소 무기고에 있던 무기는 탈레반에게 탈취당했습니다. 공격 중 아프가니스탄 경찰과 군은 여러 탈레반 무장 세력을 사살했지만, 경찰 역시 용감한 대원 여럿을 잃었습니다."
 AFG_taliban_attack.1.a: "골치 아픈 사태다."
 AFG_taliban_attack.2.t: "탈레반의 버스 폭파 공격"
 AFG_taliban_attack.2.d: "오늘 탈레반 무장 세력 한 무리가 트럭으로 버스를 멈춰 세운 뒤 칼라시니코프로 안에 있던 민간인들에게 총격을 가하고 버스 근처에서 차량 폭탄을 터뜨렸습니다. 헌병이 도착한 후 탈레반 무장 세력은 현장에서 달아났고, 일부는 사살되었으며 탈출하지 못한 소수는 체포되어 심문을 위해 헌병대로 넘겨졌습니다.\n\n심문 결과와 이어진 조사를 통해 이번 테러 공격이 관광객과 외국인을 의도적으로 노린 것임을 알게 되었습니다. 탈레반은 아프가니스탄 내 외국인을 죽이는 데 현상금을 내걸었습니다. 이 공격으로 외국 시민들도 사상자가 발생했으며, 피해자 국가들은 이미 우리 정부에 이번 공격에 대한 전면 조사를 실시하라고 요구하고 있습니다."
 AFG_taliban_attack.2.a: "탈레반 테러범들을 반드시 추적해야 한다!"
 AFG_taliban_attack.3.t: "우리 시민이 사망한 탈레반의 버스 폭파"
 AFG_taliban_attack.3.d: "오늘 아프가니스탄 탈레반 무장 세력 한 무리가 트럭으로 버스를 멈춰 세운 뒤 칼라시니코프로 안에 있던 민간인들에게 총격을 가하고 버스 근처에서 차량 폭탄을 터뜨렸습니다. 아프가니스탄 헌병이 도착한 후 탈레반 무장 세력은 현장에서 달아났고, 일부는 사살되었으며 탈출하지 못한 소수는 체포되어 심문을 위해 헌병대로 넘겨졌습니다.\n\n이번 공격으로 우리 시민들도 사상자가 발생했으며, 주아프가니스탄 대사가 사태 수습을 위해 아프가니스탄 관리들과 접촉했습니다."
 AFG_taliban_attack.3.a: "희생자 가족들에게 조의를 전한다!"
 AFG_taliban_attack.4.t: "탈레반 버스 폭파로 외국인 사망"
 AFG_taliban_attack.4.d: "오늘 아프가니스탄 탈레반 무장세력 일당이 트럭으로 버스를 강제로 세운 뒤 칼라시니코프로 안에 있던 민간인들에게 총격을 가하고, 이어 버스 근처에서 차량 폭탄을 터뜨렸습니다. 아프가니스탄 헌병대가 도착하자 탈레반 무장세력은 현장에서 달아났으며, 일부는 사살되었고 도주하지 못한 소수는 체포되어 심문을 받기 위해 헌병대로 압송되었습니다.\n\n이번 공격으로 현지 아프가니스탄인과 외국인 다수가 사상자를 냈으며, 국제사회의 광범위한 규탄을 불러일으켰습니다."
 AFG_taliban_attack.4.a: "희생자들에게 애도를 표하라!"
 AFG_taliban_attack.5.t: "탈레반, 연료 탱크로리 호송대 공격"
 AFG_taliban_attack.5.d: "오늘 탈레반 무장세력이 군과 헌병대에 필수 연료를 운송하던 연료 트럭 호송대를 공격했습니다. 탈레반 무장세력은 탱크로리에 불을 질렀고, 탱크로리 운전사들은 탈레반에 납치되었습니다. 이들 운전사의 행방은 아직 알려지지 않았습니다.\n\n현재까지 지역 주민 사상자는 보고되지 않았으나, 탱크로리는 완전히 불에 타 버렸으며 인근 도로는 안전을 위해 군이 전면 봉쇄했습니다. 이 지역 주민들의 일상이 정상으로 돌아오기까지는 얼마간 시간이 걸릴 것으로 예상됩니다."
 AFG_taliban_attack.5.a: "운전사들을 반드시 구출해야 한다!"
 AFG_taliban_attack.6.t: "아프가니스탄 탈레반, 연료 탱크로리 방화"
 AFG_taliban_attack.6.d: "오늘 아프가니스탄 탈레반 무장세력이 군과 헌병대에 필수 연료를 운송하던 연료 트럭 호송대를 공격했습니다. 탈레반 무장세력은 탱크로리에 불을 질렀고, 탱크로리 운전사들은 탈레반에 납치되었습니다. 이들 운전사의 행방은 아직 알려지지 않았습니다.\n\n현재까지 지역 주민 사상자는 보고되지 않았으나, 탱크로리는 완전히 불에 타 버렸으며 인근 도로는 안전을 위해 군이 전면 봉쇄했습니다. 이 지역 주민들의 일상이 정상으로 돌아오기까지는 얼마간 시간이 걸릴 것으로 예상됩니다."
 AFG_taliban_attack.6.a: "아프가니스탄은 정말 위험한 곳이다..."
 AFG_taliban_attack.7.t: "탈레반, 군 호송대 공격"
 AFG_taliban_attack.7.d: "오늘 탈레반 무장세력이 아군 호송대 중 하나를 겨냥해 충격적인 자살 폭탄 공격을 감행했습니다. 탈레반 무장세력은 차량 두 대를 몰고 군용 트럭에 접근하며 두 차량을 모두 폭파했습니다.\n\n이 자폭 공격으로 폭발의 충격파에 군용 트럭 여러 대가 파괴되었고 아군 병사들 중 다수가 사상자가 되었습니다. 다행히 대부분의 병사는 부상에 그쳤으나, 공격에 가담한 탈레반 무장세력은 자신들의 폭탄에 의해 즉사했습니다."
 AFG_taliban_attack.7.a: "차량 검문을 강화해야 한다!"
 AFG_taliban_attack.8.t: "탈레반 자살 공격, 아프가니스탄군 겨냥"
 AFG_taliban_attack.8.d: "오늘 아프가니스탄 탈레반 무장세력이 아프가니스탄 군 호송대 중 하나를 겨냥해 충격적인 자살 폭탄 공격을 감행했습니다. 탈레반 무장세력은 차량 두 대를 몰고 군용 트럭에 접근하며 두 차량을 모두 폭파했습니다.\n\n이 자폭 공격으로 폭발의 충격파에 군용 트럭 여러 대가 파괴되었고 아프가니스탄군 병사들 중 다수가 사상자가 되었으며, 공격에 가담한 탈레반 무장세력은 자신들의 폭탄에 의해 즉사했습니다."
 AFG_taliban_attack.8.a: "아프가니스탄군은 어쩌다 이런 일을 막지 못했는가?"
 AFG_taliban_attack.9.t: "탈레반, 외국군 겨냥"
 AFG_taliban_attack.9.d: "오늘 현지 주민으로 위장한 탈레반 무장대원 한 명이 우리나라에 파견된 외국군 호송대에 조용히 접근하여 터번에 숨겨 둔 폭탄을 터뜨렸습니다. 첫 번째 폭발로는 부상자가 없었으나, 또 다른 탈레반 무장세력 일당이 폭발이 만든 혼란을 틈타 RPG로 외국군에 로켓을 발사했습니다.\n\n군 증원 병력이 도착한 뒤 상황은 진정되었으나, 안타깝게도 이번 공격으로 많은 사상자가 발생했고 군용 차량 여러 대가 파괴되었습니다."
 AFG_taliban_attack.9.a: "젠장"
 AFG_taliban_attack.10.t: "탈레반 공격으로 아군 장병 사망"
 AFG_taliban_attack.10.d: "오늘 현지 주민으로 위장한 탈레반 무장대원 한 명이 우리나라에 파견된 외국군 호송대에 조용히 접근하여 터번에 숨겨 둔 폭탄을 터뜨렸습니다. 첫 번째 폭발로는 부상자가 없었으나, 또 다른 탈레반 무장세력 일당이 폭발이 만든 혼란을 틈타 RPG로 외국군에 로켓을 발사했습니다.\n\n증원 병력이 도착한 뒤 상황은 진정되었으나, 안타깝게도 이번 공격으로 아군 장병 다수가 사상자가 되었고 군용 차량 여러 대가 파괴되었습니다. 현지 지휘관은 사태 수습을 위해 아프가니스탄군 지휘관들과 연락을 취하고 있습니다."
 AFG_taliban_attack.10.a: "전사한 장병들에게 애도를 표하라!"
 AFG_taliban_attack.11.t: "탈레반 공격으로 외국군 사망"
 AFG_taliban_attack.11.d: "오늘 현지 주민으로 위장한 탈레반 무장대원 한 명이 우리나라에 파견된 외국군 호송대에 조용히 접근하여 터번에 숨겨 둔 폭탄을 터뜨렸습니다. 첫 번째 폭발로는 부상자가 없었으나, 또 다른 탈레반 무장세력 일당이 폭발이 만든 혼란을 틈타 RPG로 외국군에 로켓을 발사했습니다.\n\n군 증원 병력이 도착한 뒤 상황은 진정되었으나, 이번 공격으로 많은 사상자가 발생했고 군용 차량 여러 대가 파괴되었습니다."
 AFG_taliban_attack.11.a: "왜 탈레반을 제거하지 못하는가?"
 AFG_taliban_attack.12.t: "탈레반, 건물 폭파 감행"
 AFG_taliban_attack.12.d: "오늘 외국인 투자자들의 사무실이 입주한 건물 중 한 곳이 거대한 폭발로 뒤흔들렸습니다. 이어진 조사 결과, 폭탄은 아프가니스탄 국군 무기고에서 도난당했거나 분실된 포탄 여러 발로 만들어졌을 가능성이 높은 것으로 밝혀졌습니다. 이후 탈레반이 이번 폭파의 배후를 자처했습니다.\n\n사망자 중에는 외국인도 포함되어 있으며, 우리 정부 관리들은 사태 수습을 위해 해당 국가 대사들과 연락을 취하고 있습니다."
 AFG_taliban_attack.12.a: "이는 우리의 국가 이미지에 악영향을 미칠 것이다!"
 AFG_taliban_attack.13.t: "탈레반 폭파로 아군 계약업체 직원 사망"
 AFG_taliban_attack.13.d: "오늘 아군 계약업체 중 한 곳의 사무실이 입주한 건물이 거대한 폭발로 뒤흔들렸습니다. 이어진 조사 결과, 폭탄은 아프가니스탄 국군 무기고에서 도난당했거나 분실된 포탄 여러 발로 만들어졌을 가능성이 높은 것으로 밝혀졌습니다. 이후 탈레반이 이번 폭파의 배후를 자처했습니다.\n\n사상자 중에는 우리 국민도 있으며, 주아프가니스탄 대사는 사태 수습을 위해 아프가니스탄 정부 관리들과 연락을 취하고 있습니다."
 AFG_taliban_attack.13.a: "우리 투자자들을 반드시 보호해야 한다!"
 AFG_taliban_attack.14.t: "탈레반 건물 폭파로 외국인 사망"
 AFG_taliban_attack.14.d: "오늘 아프가니스탄의 주요 도시에서 외국 계약업체들의 사무실이 입주한 건물 중 한 곳이 거대한 폭발로 뒤흔들렸습니다. 이어진 조사 결과, 폭탄은 아프가니스탄 국군 무기고에서 도난당했거나 분실된 포탄 여러 발로 만들어졌을 가능성이 높은 것으로 밝혀졌습니다. 이후 탈레반이 이번 폭파의 배후를 자처했습니다.\n\n사상자 중에는 외국 국민도 포함되어 있으며, 아프가니스탄 정부 관리들은 사태 수습을 위해 피해를 입은 국가들의 대사들과 연락을 취하고 있습니다."
 AFG_taliban_attack.14.a: "어느 나라가 아프가니스탄에 투자하려 하겠는가?"
 AFG_taliban_attack.15.t: "탈레반, 공항 폭파"
 AFG_taliban_attack.15.d: "오늘 우리의 군민 겸용 공항 한 곳이 차량 폭탄 공격을 받았습니다. 폭발물을 실은 트럭이 공항 입구의 방호 난간을 들이받고 돌진한 뒤 차량에 장착된 폭발물을 터뜨렸습니다. 차량에 실린 폭탄의 폭발력이 극히 높아 비행장에 막대한 피해가 발생했습니다. 첫 보고가 들어온 직후, 탈레반의 가장 급진적인 분파인 하카니 네트워크가 이번 공격의 배후를 자처했습니다.\n\n이번 공격으로 지상 근무자와 터미널에서 대기 중이던 승객들 사이에서 다수의 사상자가 발생했습니다. 우리 보안 기관은 완전히 허를 찔렸으며, 여론은 폭발물을 가득 실은 트럭이 어떻게 경비가 삼엄한 비행장 정문까지 도달할 수 있었는지 묻고 있습니다."
 AFG_taliban_attack.15.a: "탈레반 테러리스트들을 반드시 추적해 소탕해야 한다!"
 AFG_taliban_attack.16.t: "아프가니스탄 주요 공항 공격"
 AFG_taliban_attack.16.d: "오늘 아프가니스탄의 군민 겸용 공항 한 곳이 차량 폭탄 공격을 받았습니다. 폭발물을 실은 트럭이 공항 입구의 방호 난간을 들이받고 돌진한 뒤 차량에 장착된 폭발물을 터뜨렸습니다. 차량에 실린 폭탄의 폭발력이 극히 높아 공항에 막대한 피해가 발생했습니다. 보고가 들어오기 시작한 직후, 탈레반의 가장 급진적인 분파인 하카니 네트워크가 이번 공격의 배후를 자처했습니다.\n\n이번 공격으로 다수의 사상자가 발생했으나, 아프가니스탄에 있는 [ROOT.GetAdjective] 국민이 사망하거나 부상을 입었다는 보고는 없습니다. 우리 지도자 [ROOT.GetLeader]은(는) [AFG.GetLeader]에게 이번 공격에 대한 애도를 전했으며 탈레반의 행위를 강력히 규탄했습니다."
 AFG_taliban_attack.16.a: "탈레반의 반란이 심각한 수준에 이르렀다!"
 AFG_news.17.t: "아프가니스탄 반탈레반 봉기"
 AFG_news.17.d: "항구적 자유 작전 이후, 헤라트에서는 미국과 이란의 지원을 받은 현지 민병대가 탈레반의 지배에 도전하며 저항이 급격히 고조되고 있습니다. 민병대가 주요 지역을 장악하고 북부 동맹에 합류하자 거리마다 환호하는 모습이 가득합니다. \\"헤라트의 사자\\" 모하마드 이스마일 칸은 전직 탈레반 전투원들에게 사면을 제의하면서도 향후의 적대 행위에 대해서는 경고했습니다. 이번 봉기는 안정을 위한 아프가니스탄의 투쟁에서 중대한 전환점이 되고 있습니다."
 AFG_news.17.a: "흥미로운 사태 전개"
 AFG_events.27.t: "여성의 역할"
 AFG_events.27.d: "우리 사회에서 여성의 역할이라는 개념은 낯설게 느껴질 수도 있으나, 국가는 앞으로 나아갈 방향에 대해 다양한 견해를 가지고 있습니다."
 AFG_events.27.a: "보다 전통적인 역할을 맡아야 한다"
 AFG_events.27.b: "여성에게도 역할을 주자"
 AFG_events.28.t: "종교의 역할"
 AFG_events.28.d: "종교의 역할, 그리고 아프가니스탄이 문호를 개방해야 하는지 아니면 수니파 이슬람에 대한 엄격한 고수를 유지해야 하는지는 논쟁적인 사안입니다."
 AFG_events.28.a: "문호를 닫은 채로 유지한다"
 AFG_events.28.b: "문호를 개방해야 한다"
 AFG_events.35.t: "북부 동맹에 대한 공중 수송"
 AFG_events.35.d: "아프가니스탄에서 분쟁이 이어지는 가운데, 러시아는 이 지역 사안에 휘말려 있습니다. 1996년 이래 러시아 정부는 쫓겨난 아프가니스탄 정부의 저항을 강화하기 위해 북부 동맹에 무기와 물자를 제공하며 은밀히 지원해 왔습니다. 이러한 지원은 타지키스탄 내전에서 UTO가 보여 주었듯 분쟁이 중앙아시아로 번질 수 있다는 우려에서 비롯되었습니다. 이제 이바노프 국방장관이 지원의 규모를 공개한 가운데, 러시아 지도부는 경제적 부담에도 북부 동맹에 대한 지원을 지속할 것인지, 아니면 지원을 완전히 철회할 것인지라는 중대한 결정에 직면해 있습니다."
 AFG_events.35.a: "미국이 비용을 부담하도록 요청한다"
 AFG_events.35.b: "우리가 비용을 감당할 수 있다"
 AFG_events.35.c: "지원 물량을 끊는다"
 AFG_events.36.t: "아프가니스탄 북부 동맹, 드론 주둔에 개방적"
 AFG_events.36.d: "1998년 미국 대사관 폭탄 테러와 이에 뒤따른 아프가니스탄 내 알카에다 훈련 캠프에 대한 미국의 미사일 공격 이후, 미국은 오사마 빈 라덴의 신병 인도 요구를 포함하여 테러 조직망 해체를 위한 노력을 강화해 왔습니다. 국가안보 최고위 관리 회의에서는 탈레반에 빈 라덴을 넘기라는 최후통첩을 제시하기로 합의했습니다. 북부 동맹과의 협력에 대한 기존의 망설임에도 불구하고, 이제 빈 라덴의 행방을 추적하기 위한 공동 행동의 기회가 생겼습니다."
 AFG_events.36.a: "감시 드론을 투입한다"
 AFG_events.36.b: "이미 목표를 제시했다"
 AFG_events.37.t: "아프가니스탄 북부 동맹에 대한 지원 확대"
 AFG_events.37.d: "아프가니스탄의 분쟁이 격화되면서 북부 동맹은 탈레반과 알카에다에 맞서기 위해 더 많은 지원이 필요한 상황입니다. 자금, 레이더 장비, 항공기 부품, 전투기 정비를 위한 기술 지원을 제공해 온 인도의 은밀한 도움이 결정적이었습니다. 인도 군사 고문관들은 탈레반과의 전투에서 귀중한 역할을 하고 있으며, 이들의 지원은 [AFG.GetLeader]의 병사들에게 없어서는 안 될 존재가 되었습니다."
 AFG_events.37.a: "파키스탄의 대리 세력을 제거하는 것이 필요하다."
 AFG_events.37.b: "이 과정을 계속하고 싶지 않다."
 AFG_events.38.t: "러시아의 공중 수송 장비, 아프가니스탄에 도착"
 AFG_events.38.d: "무기, 물자, 차량을 포함한 러시아 군 장비가 공중 수송을 통해 아프가니스탄에 도착하기 시작했습니다. 이 장비의 도착은 전쟁에 새로운 돌파구를 열어 줍니다."
 AFG_events.38.a: "좋은 소식이다"
 AFG_events.39.t: "미국, 드론 지원 승인"
 AFG_events.39.d: "미국은 알카에다 훈련 캠프를 타격하고 오사마 빈 라덴을 추적하기 위한 드론 지원 요청을 승인했습니다. 이제 우리는 정보를 활용해 미군과 함께 노력을 수집하고 조율할 수 있습니다."
 AFG_events.39.a: "대단한 소식이다"
 AFG_events.40.t: "인도의 지원 지속"
 AFG_events.40.d: "아프가니스탄은 인도로부터 자금, 레이더 장비, 항공기 부품, 군사 고문관을 포함한 지원을 받고 있습니다."
 AFG_events.40.a: "훌륭하다"
 AFG_events.41.t: "지원 요청 거부됨"
 AFG_events.41.d: "추가 지원을 확보하려는 노력에도 불구하고 지원 요청은 거부되었습니다. 우리는 기존의 자원에 의존할 수밖에 없습니다."
 AFG_events.41.a: "실망스럽다"
 AFG_events.42.t: "러시아, 우리에게 비용 부담을 요구"
 AFG_events.42.d: "러시아는 아프가니스탄의 북부 동맹에 물자를 공급하는 값비싼 공중 수송 작전의 비용을 부담하려 하지 않습니다. 이바노프 장관은 미국에 도움을 요청했으며, 영국 국방 당국과도 논의가 진행되었습니다. 미국은 이 작전에서 러시아를 지원할지 여부를 결정해야 하는 상황에 놓였습니다."
 AFG_events.42.a: "우리가 할 수 있다"
 AFG_events.42.b: "우리는 할 수 없다"
 AFG_news.18.t: "러시아, 아프가니스탄 공중 수송 비용을 미국에 요구"
 AFG_news.18.d: "아프가니스탄의 북부 동맹에 물자를 공급하는 공중 수송 작전의 자금 지원을 요청한 러시아의 입장은 국제사회의 조롱을 받았습니다. 막강한 군사력에도 불구하고 비용 부담을 꺼리는 러시아의 태도는 비판을 불러일으켰으며, 많은 이들이 이 대의에 대한 러시아의 의지를 의문시하고 있습니다. 일각에서는 러시아가 우선순위를 재고하고 자국의 경제적 난관을 해결하는 데 집중해야 한다는 주장까지 내놓았습니다. 《네자비시마야 가제타》의 보도에 따르면, 9월 말부터 아프가니스탄으로 물자가 유입되기 시작했으며, 탄약과 군사 장비는 러시아 제201사단이 타지키스탄과 아프가니스탄을 가르는 퍄니 강에 가설한 부교를 통해 전달되고 있습니다."
 AFG_news.18.a: "그 많던 돈은 다 어디로 갔는가?"
 AFG_news.18.c: "독수리가 다시 한번 상처 입은 곰을 구하러 올 것인가?"
 AFG_news.18.b: "저, 사실은 말이죠"
 AFG_news.19.t: "미국, 아프가니스탄에 프레데터 드론 배치"
 AFG_news.19.d: "미국은 알카에다의 테러 거점을 타격하기 위해 아프가니스탄에 프레데터 드론을 배치했습니다. 아프가니스탄에서의 이러한 확전은 이 지역에서 미군 주둔의 새로운 시대를 열게 됩니다. 드론은 정보와 감시 능력을 제공하여 이 나라에서의 미군 작전을 강화할 것으로 기대됩니다."
 AFG_news.19.a: "흥미롭군"
 AFG_news.20.t: "[AFG.GetLeader], 유럽 의회 연설"
 AFG_news.20.d: "유럽 의회에서 열린 기자회견에서 [AFG.GetLeader]은(는) 세계 지도자들에게 탈레반을 지원하는 파키스탄에 압력을 가할 것을 촉구하고, 아프가니스탄 국민의 고통을 덜어 줄 인도적 지원을 요청했습니다. 이번 호소는 그가 알카에다의 서방 국가 공격 계획에 대해서도 경고하는 가운데 나왔습니다."
 AFG_news.20.a: "우려할 만한 일일 수 있다"
 AFG_news.21.t: "도스툼, 마자르이샤리프 공격 계획에 합류"
 AFG_news.21.d: "도스툼이 망명지에서 아프가니스탄으로 돌아온 것은 마자르이샤리프를 되찾을 기회로 받아들여졌습니다. 그는 이제 아흐마드 샤 마수드 사령관, 이스마일 칸, 모하마드 모하케크와 함께 탈레반이 장악한 도시 마자르이샤리프에 대한 공세를 준비하고 있습니다. \n\n도스툼은 본래 아프가니스탄 인민민주당(PDPA) 공산 정권군 소속 374 군사 부대의 지휘관이었으나 1992년 카불 함락 이후 무자헤딘으로 전향했습니다. 이후 그는 마자르이샤리프에 흔히 북부 자치 지대로 알려진 자신의 준국가를 세웠습니다. 그는 자체 화폐를 발행했고 발흐 항공이라는 자체 항공사까지 운영했습니다.\n\n마자르이샤리프의 지배권을 탈레반에 잠시 빼앗긴 뒤, 도스툼은 1997년 10월 망명지에서 돌아와 다시 지휘권을 장악했습니다. 그의 노력에도 불구하고 1998년 탈레반이 돌아오면서 도스툼은 다시 한번 튀르키예로 달아나야 했습니다."
 AFG_news.21.a: "어떻게 되는지 지켜보자."
 AFG_events.45.t: "마흐무드 수르카, 탈레반으로 전향"
 AFG_events.45.d: "마흐무드 수르카 사령관이 러시아의 전쟁 개입에 불만을 품고 탈레반으로 전향했다고 주장했습니다. [AFG.GetLeader]은(는) 이러한 주장을 부인하면서도, 사실상 인정받는 아프가니스탄 정부로서 국제적 지원을 모색할 권리가 있다고 밝혔습니다."
 AFG_events.48.t: "압둘라 잔 와히디 전향"
 AFG_events.48.d: "하지 압둘 카디르는 핵심 지휘관 중 한 명인 압둘라 잔 와히디가 탈레반으로 전향했음을 인정했습니다."
 AFG_events.48.a: "우리가 할 수 있는 일은 없다"
 AFG_events.44.t: "이스마일 칸, 칸다하르 교도소 탈출"
 AFG_events.44.d: "헤라트의 전직 주지사이자 집권 탈레반 정권에 맞선 저항 지도자인 이스마일 칸이 칸다하르 교도소에서 탈출했습니다. \n칸은 소련에 맞선 반란 투쟁에서 가장 존경받는 무자헤딘 지도자 중 한 명으로 평가받을 만합니다. 1992년 무자헤딘 부대가 헤라트를 점령했고 이스마일 칸은 주지사가 되었습니다. 1995년 그는 아흐마드 샤 마수드와 협력하여 탈레반으로부터 이 도시를 방어했습니다. 칸은 탈레반의 거점 칸다하르를 향해 공세에 나서기까지 했으나 격퇴되었습니다. 이는 압둘 라시드 도스툼 장군이 헤라트를 공격하여 이스마일 칸과 그의 부하 8,000명이 이란으로 피신하게 되고, 이후 탈레반이 밀려들어 헤라트 주를 장악하면서 바뀌었습니다. 2년 뒤 파르야브 지역에서 탈레반에 대한 저항을 조직하던 중, 그는 당시 도스툼의 부관 중 한 명이었던 압둘 말리크 파흘라완과 함께 탈레반으로 전향한 압둘 마지드 루지에게 배신당해 붙잡혔습니다."
 AFG_events.44.a: "다시 한번 승산에 도박을 건다"
 AFG_events.45.a: "어차피 우리가 할 수 있는 일이 무엇이겠는가"
 AFG_events.65.t: "아프가니스탄, 지원 호소"
 AFG_events.65.d: "장비와 자원이 바닥나 가는 아프가니스탄은 현지 아프가니스탄 전투원들을 훈련시키고 필요한 장비와 차량을 제공할 요원들을 파견해 달라고 우리에게 긴급히 요청하고 있습니다. 이를 통해 그들이 독자적으로 탈레반에 맞설 수 있게 하여 직접적인 군사 개입의 필요를 최소화할 수 있습니다"
 AFG_events.65.a: "그렇다, 돕겠다"
 AFG_events.65.b: "아니다, 돕지 않겠다"
 AFG_events.66.t: "그들의 승인"
 AFG_events.66.d: "미국은 요청을 승인했으며, 탈레반과의 전투에서 아프가니스탄을 돕기 위해 장비와 함께 고문관들을 파견할 예정입니다. 이는 아프가니스탄군을 보강하고 반란 진압과 지역 안정화를 위한 협력 노력을 강화하는 중대한 조치입니다."
 AFG_events.66.a: "움직일 때가 되었다"
 AFG_border_wars.1.t: "[event_target:AFG_ATTACKER.GetName], 국경 전쟁에서 승리"
 AFG_border_wars.1.d: "[event_target:AFG_ATTACKER.GetName]은(는) [event_target:AFG_DEFENDER.GetName]에 맞선 국경 전쟁에서 승리하여 새로운 영토로 진출했습니다. 이들은 이후에도 공세를 계속할 가능성이 높습니다."
 AFG_border_wars.1.a: "만세!"
 AFG_border_wars.1.b: "젠장"
 AFG_border_wars.1.c: "확전하라!"
 AFG_border_wars.2.t: "[event_target:AFG_ATTACKER.GetName], 국경 전쟁에서 패배"
 AFG_border_wars.2.d: "[event_target:AFG_ATTACKER.GetName]은(는) [event_target:AFG_DEFENDER.GetName]에 맞선 국경 전쟁에서 패배했습니다."
 AFG_border_wars.2.a: "만세!"
 AFG_border_wars.2.b: "젠장"
 AFG_border_wars.3.t: "탈레반, 부족 지대 진출 준비"
 AFG_border_wars.3.d: "탈레반은 주로 북와지리스탄과 파라치나르 지역을 중심으로 부족 지대로 진출할 계획을 세우고 있습니다. 탈레반 협상가가 우리에게 이 계획을 알려 왔으며, 그들은 우리가 '일시적인 기간' 동안 그곳에 머무르도록 허락해 주기를 바라고 있습니다. 이 지역은 큰 틀에서 보면 그다지 중요하지 않지만, 그래도 영토의 상실이자 급진 테러리스트들이 국내로 침투하는 일입니다."
 AFG_border_wars.3.a: "쓸모가 있는 동안에는 머물러도 좋다"
 AFG_border_wars.3.b: "절대 안 된다"
 AFG_border_wars.4.t: "파키스탄, 부족 지대 진출 계획 규탄"
 AFG_border_wars.4.d: "파키스탄 정부가 최근 우리에게 연락해 탈레반 세력이 북와지리스탄과 파라치나르 지역에 머무르게 될 전망에 대해 불만을 표했습니다. 놀라운 결과는 아니지만, 아프가니스탄을 되찾으려는 우리의 노력에는 여전히 걸림돌입니다."
 AFG_border_wars.4.a: "좋다"
 AFG_border_wars.4.b: "그들의 반대 따위는 알 바 아니다!"
 AFG_border_wars.5.t: "파키스탄, 부족 지대로의 이동 묵인"
 AFG_border_wars.5.d: "파키스탄 정부는 북와지리스탄과 파라치나르 지역으로의 우리 이동을 무시하겠다는 신호를 보냈습니다. 이는 우리가 작전을 계속 확대할 수 있으며, 아프가니스탄에서 대규모 공세가 시작될 경우 승산을 높일 수 있음을 의미합니다."
 AFG_border_wars.5.a: "좋다"
 AFG_border_wars.6.t: "우리를 무시하는 탈레반"
 AFG_border_wars.6.d: "탈레반은 북와지리스탄과 파라치나르 지역으로의 최근 이동에 대한 우리의 반대를 무시했습니다. 우리가 짓밟히지 않는다는 것을 가르치려면 무력을 사용하는 수밖에 없어 보입니다."
 AFG_border_wars.6.a: "먼저 시작한 건 그들이다"
 AFG_border_wars.7.t: "아프가니스탄군, 승리 확보"
 AFG_border_wars.7.d: "탈레반과의 교전 끝에 아프가니스탄군이 탈레반 세력에 맞서 승리를 거두었습니다. 이번 전투는 [AFG.GetLeader]에 의해 전국적인 승리로 선전되고 있습니다."
 AFG_border_wars.7.a: "알라후 아크바르!"
 AFG_border_wars.7.b: "인샬라, 승리가 올 것이다"
 AFG_border_wars.8.t: "탈레반 세력, 승리 확보"
 AFG_border_wars.8.d: "아프가니스탄 국군과의 교전 끝에 탈레반 세력이 아프가니스탄 국군에 맞서 승리를 거두었습니다. 이번 전투는 [TAL.GetLeader]에 의해 탈레반 전체의 승리로 선전되고 있습니다."
 AFG_border_wars.8.a: "알라후 아크바르!"
 AFG_border_wars.8.b: "인샬라, 승리가 올 것이다"
 AFG_border_wars.9.t: "탈레반-아프가니스탄 교전, 결론 없이 종결"
 AFG_border_wars.9.d: "탈레반과 아프가니스탄 국군의 교전 이후 국제군은 전선이 고착된 것을 확인했습니다. 양측 모두 공격 속도를 늦추고 교전 이전의 지역으로 후퇴한 것으로 알려졌습니다."
 AFG_border_wars.9.a: "알겠다"
 AFG_uzbek_bombing_of_the_imu: "우즈베키스탄 폭격 작전"
 AFG_uzbek_bombing_of_the_imu_desc: "우즈베키스탄 항공기가 북쪽 국경 너머의 우즈베키스탄 이슬람 운동 캠프를 타격하고 있습니다. 이 공습은 탈레반의 방공망을 무디게 하고, 타슈켄트가 계속 출격하는 한 탈레반 공세의 예봉을 꺾어 줍니다."
