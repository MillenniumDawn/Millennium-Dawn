 STL_infantry_weapons_3_desc: "Разработка винтовки M16A2 была первоначально запрошена Корпусом морской пехоты США по итогам боевого опыта во Вьетнаме с XM16E1 и M16A1. Она была официально принята на вооружение Министерством обороны под обозначением «Винтовка США калибра 5,56 мм, M16A2» в 1982 году. Морская пехота стала первым видом Вооружённых сил США, принявшим её на вооружение, в начале/середине 1980-х годов, а Армия США последовала её примеру в конце 1980-х."
 STL_infantry_weapons_4_desc: "M16A4 — четвёртое поколение серии M16. Она оснащена съёмной ручкой для переноски и четырьмя планками Пикатинни по всей длине для установки оптики и другого дополнительного оборудования. FN M16A4 с режимами огня «предохранитель/одиночный/отсечка очереди» стала штатным оружием Корпуса морской пехоты США. Армейские винтовки также оснащаются цевьём M5 RAS производства Knight's Armament Company, позволяющим крепить вертикальные рукоятки, лазерные целеуказатели, тактические фонари и другие аксессуары, благодаря чему в полевых уставах Армии США появилось обозначение M16A4 MWS (Modular Weapon System — модульная система оружия)."
