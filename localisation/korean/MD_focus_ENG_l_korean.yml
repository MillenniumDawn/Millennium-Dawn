 ENG_andrew_epstein_punishment: "$ENG_prince_andrew_leader_name$은(는) 활동 중인 왕실 구성원이 아님"
 ENG_queen_elizabeth_class_carrier: "퀸 엘리자베스급 항공모함"
 ENG_queen_elizabeth_class_carrier_desc: "퀸 엘리자베스급 항공모함은 영국 해군 항공의 정점으로, 항공모함 능력의 혁신적 도약을 의미했습니다. 이 거함들은 첨단 기술, 항공기 수용력, 광대한 작전 범위로 현대성을 구현하며 영국의 해양 투사력을 강화하고 국가의 세계적 방위 위상을 공고히 했습니다."
 ENG_elizabeth_line_decision: "엘리자베스 선 완공"
 ENG_elizabeth_line_decision_desc: "우리는 런던을 가로지르는 엘리자베스 선을 완공하여 히스로, 웨스트엔드, 시티, 카나리 워프를 빠르고 잦은 도심 횡단 열차로 연결함으로써 이동 시간을 단축하고 생산성을 높입니다."
 ENG_elizabeth_queen: "엘리자베스 2세"
 ENG_elizabeth_queen_trait: "여왕"
 ENG_elizabeth_queen_idea: "$ENG_elizabeth_queen_trait$"
 ENG_elizabeth_queen_charles_andrew: "$ENG_queen_eldest$"
 ENG_elizabeth_queen_anne_edward: "$ENG_queen_middle$"
 ENG_elizabeth_queen_philip_william: "$ENG_queen_youngest$"
 ENG_elizabeth_ruling_monarch: "§Y$ENG_elizabeth_queen$§!이(가) 현 §Y재위 군주§!임"
 ENG_typhoon_tranche_debate: "타이푼 1차 도입분 논쟁"
 ENG_typhoon_tranche_debate_desc: "타이푼 1차 도입분 논쟁은 여러 유럽 국가가 개발한 다목적 전투기 유로파이터 타이푼을 둘러싼 논의와 분석을 가리킵니다. 이러한 논쟁은 흔히 성능, 능력, 비용 효율성, 현대 공중전에서의 전략적 중요성 등 타이푼의 다양한 측면을 깊이 다룹니다."
 ENG_silicon_glenn: "실리콘 글렌"
 ENG_silicon_glenn_tt: "§Y$CAT_information_technology$, $CAT_internet$ 또는 $CAT_artificial_intelligence$ 연간 기술 증진§!"
 ENG_operation_excellence_desc: "우리 군은 규모는 작지만 전문적이고 유능한 병력으로, 요청이 있을 때 본토에 신속히 배치되어 민간 권력과 기타 정부 부처를 지원할 수 있습니다. 이 국내 보안 역량을 확대하고 지원하여 영국을 안전하게 지킬 수 있습니다."
 ENG_modern_littoral_force_desc: "영국 현대 연안 전력은 해안 지역의 해군 역량을 강조하는 전략적 구상입니다. 영국이 주도하는 이 현대화된 전력은 첨단 해군 기술, 다목적 함정, 신속 대응 능력을 통합하여 연안 환경에서의 해양 우세를 보장합니다. 기민성과 적응력에 중점을 두어, 이 전력은 해안 이익을 수호하고 새로운 위협에 대응하며 지역 안정에 기여하는 영국의 능력을 강화합니다."
 ENG_trident_nuclear_program_desc: "트라이던트 계획은 트라이던트 II D5 탄도 미사일을 탑재한 뱅가드급 잠수함을 배치하는 영국의 상시 해상 핵 억지력입니다. 올더마스턴과 버그필드의 시설에서 관리되는 이 전략적 구상은 기민하고 강력한 방위 능력에 대한 국가의 의지를 강조합니다."
 ENG_mothballing_operations: "예비역 보관 작전"
 ENG_mothballing_operations_desc: "재정적 제약에 대응하여 영국 정부는 해군 함정을 예비역으로 보관하는 현실적인 길을 택했으며, 이 결정은 해군 산업계, 특히 BAE의 우려를 샀습니다. 자원을 아끼려는 이 조치는 생산과 인력에 미칠 잠재적 영향에 대해 업계 내에서 우려를 낳고 있습니다."
 ENG_modern_landing_craft_desc: "해군 역량 강화에 대한 지속적인 의지 속에 영국은 신형 상륙정 투자를 포함한 현대화 계획을 추진해 왔습니다. 미래 코만도 부대 계획에 발맞추어 영국은 특히 영국 해병대를 중심으로 상륙 전력을 강화하여 연안 및 상륙 작전의 효율을 높이고자 합니다."
 ENG_mechanised_amphibious_assault_desc: "적응력과 속도를 강조하는 영국은 포괄적인 기계화 상륙 강습 교리를 수립합니다. 영국 해병대와 영국 해군의 시너지를 기반으로 한 이 전략은 신속한 해안 전개를 위해 특수 상륙 돌격 차량(AAV)과 상륙정을 운용합니다. 통합된 지휘 통제, 항공 지원, 전용 상륙 강습함의 배치는 강력하고 다재다능한 전력을 유지하려는 영국의 의지를 강조하며, 엄격한 훈련과 연습을 통해 다양한 시나리오에 대한 대비 태세를 보장합니다."
 ENG_strike_brigades_desc: "변화하는 위협에 대응하여 영국은 기민한 지상 작전을 위해 설계된 다목적 신속 전개 부대인 영국 타격 여단을 편성합니다. 보병, 기갑, 포병으로 구성된 이 여단들은 신속하고 적응력 있는 군사 대응에 대한 국가의 의지를 구현합니다. 타격 여단에 대한 집중은 역동적이고 다양한 안보 도전에 효과적으로 대응하고 힘을 투사하는 영국의 능력을 강화합니다."
 ENG_carrier_group_debate_desc: "항공모함 타격 전력은 현대 해군의 필수 요소입니다. 이를 구성하는 최선의 방법에 대해 논의해야 합니다."
 ENG_mothballing_operations_idea: "해군 예비 보존 작전"
 ENG_mothballing_operations_idea_desc: "재정적 압박이 커지면서 영국 정부는 해군 함선을 예비 보존하는 쪽으로 기울고 있으며, 이는 BAE를 비롯한 해군 산업계에서 엇갈린 반응을 얻고 있는 현실적인 조치입니다. 자원 절약을 목표로 하지만 이 결정은 업계 내에 우려를 불러일으켜 생산과 인력 문제 모두에 그림자를 드리웁니다."
 ENG_quality_over_quantity_desc: "양보다 질이라는 원칙에 따라 영국은 군에서 우수성과 기술적 우위를 우선시합니다. 이 국가 정신은 첨단의 정교한 장비 조달을 강조하여 강력하고 기술적으로 앞선 방위 태세를 보장합니다. 질에 집중함으로써 영국은 군의 효율을 극대화하여 현대적 도전 앞에서 전략적 우위를 확보하고자 합니다."
 ENG_mothballing_operations_idea_tt: "이 국가 정신이 활성화되어 있는 동안에는 §Y해군 국가 중점§!을 선택할 수 §R없습니다§! "
 ENG_mothballing_operations_negative_opinion_tt: "이 국가 정신이 있는 동안 §Y해양 산업 관계§!가 §R-20§! 보정됩니다"
 ENG_Space_Command: "영국 우주사령부"
 ENG_Space_Command_desc: "영국 우주사령부는 우주 작전, 우주 인력, 우주 역량을 총괄하는 국방 부문의 주무 기관입니다. RAF 하이 위컴에 기반을 둔 합동 사령부이며, 왕립 해군, 영국 육군, 왕립 공군의 인원과 더불어 공무원 및 계약 인력으로 구성되어 있습니다."
 ENG_Space_Command2_desc: "영국 우주사령부는 우주 작전, 우주 인력, 우주 역량을 총괄하는 국방 부문의 주무 기관입니다. RAF 하이 위컴에 기반을 둔 합동 사령부이며, 왕립 해군, 영국 육군, 왕립 공군의 인원과 더불어 공무원 및 계약 인력으로 구성되어 있습니다. 유명한 붉은 군복이 되돌아오면서 이 조직은 더 높은 사기와 새로워진 자부심을 누리고 있습니다."
 ENG_british_spaceports_privatized: "영국 우주기지 민영화"
 ENG_british_spaceports_privatized_desc: "영국은 우주 탐사의 새로운 개척지를 받아들여 우주기지를 민영화함으로써 지구 너머의 상업 활동을 촉진합니다. 이 민간 운영 시설들은 혁신을 육성하고 영국의 신흥 상업 우주 산업을 지원하는 쪽으로의 전환을 나타냅니다."
 ENG_establish_asteroid_mining_network_mission: "소행성 채굴망 구축"
 ENG_establish_asteroid_mining_network_mission_desc: "영국 우주청이 지구 밖 자원 사업을 시작하기 위해 궤도 플랫폼과 탐사 장비를 배치하고 있습니다."
 ENG_asteroid_mining_light_operation: "탐사 조사"
 ENG_asteroid_mining_light_operation_desc: "소규모 조사 임무로 로봇 탐사선을 투입하여 채굴이 가능한 지구 근접 소행성을 식별합니다."
 ENG_asteroid_mining_medium_operation: "채굴 임무"
 ENG_asteroid_mining_medium_operation_desc: "전담 채굴 임무가 식별된 소행성 매장지를 목표로 삼아 영국 산업에 쓸 수 있는 금속을 회수합니다."
 ENG_asteroid_mining_heavy_operation: "전면 채굴 원정"
 ENG_asteroid_mining_heavy_operation_desc: "영국의 가장 첨단 궤도 채굴 자산을 동원하여 소행성대로 완전한 산업 규모의 작전을 개시합니다."
 ENG_sovereign_capability_doctrine: "주권 역량 교리"
 ENG_sovereign_capability_doctrine_desc: "영국은 독립적이고 전방위적인 방위 산업 기반을 유지하기로 약속합니다. 구조 전환 비용은 공장이 설비를 교체하는 동안 민간 생산에 단기적인 부담을 줍니다."
 ENG_consolidate_national_champions: "국가 대표 기업 통합"
 ENG_consolidate_national_champions_desc: "BAE 시스템즈, 롤스로이스, 밥콕이 전략적 산업 거점으로 지정됩니다. 정부 계약, 우선 조달, 수출 지원이 이들 기업에 집중됩니다."
 ENG_rolls_royce_raynesway_expansion: "롤스로이스 레인즈웨이 확장"
 ENG_rolls_royce_raynesway_expansion_desc: "영국 해군 잠수함용 원자력 추진 체계를 제조하는 더비의 레인즈웨이 시설에 대규모 자본이 투입됩니다. 이스트미들랜즈에 두 개의 새 군수 공장이 가동을 시작합니다."
 ENG_barrow_strategic_shipyard: "배로 전략 조선소"
 ENG_barrow_strategic_shipyard_desc: "BAE 시스템즈의 배로인퍼니스 조선소가 보호받는 주권 자산으로 지정됩니다. 차세대 원자력 잠수함의 건조 능력을 확보하기 위해 컴브리아 해군 단지에 세 개의 새 조선소가 추가됩니다."
 ENG_combat_air_sovereignty: "전투 항공 주권"
 ENG_combat_air_sovereignty_desc: "세계 전투 항공 계획은 영국의 미래 전투기 능력을 규정합니다. BAE 시스템즈가 설계 단계를 주도하며, 정부가 지원하는 연구개발 보조금이 플랫폼의 개발 일정을 앞당깁니다."
 ENG_rolls_royce_aerospace_centre: "롤스로이스 항공우주 센터"
 ENG_rolls_royce_aerospace_centre_desc: "브리스틀 필턴에 새로운 엔진 시험 및 생산 시설이 문을 열며, 이는 GCAP 계획을 위한 차세대 추진 체계 개발의 중심이 됩니다."
 ENG_munitions_strategic_reserve: "탄약 전략 비축"
 ENG_munitions_strategic_reserve_desc: "비축량 감사에서 정밀 유도 탄약의 심각한 부족이 드러났습니다. 작전 비축량을 냉전 시대 수준으로 되돌리기 위해 두 개의 새 생산 라인이 가동에 들어갑니다."
 ENG_land_systems_sovereignty: "지상 체계 주권"
 ENG_land_systems_sovereignty_desc: "아약스와 챌린저 3 계획은 장갑차량의 완전한 국내 생산으로 가는 길을 규정합니다. 계획의 인도 일정을 뒷받침하기 위해 하나의 새 군수 시설이 가동에 들어갑니다."
 ENG_skills_pipeline_apprenticeship_act: "기술 인력 파이프라인 및 견습 제도법"
 ENG_skills_pipeline_apprenticeship_act_desc: "산업계와 정부의 협약으로 5만 개의 방위 공학 견습 과정이 창설되어, 냉전 이후 산업 위축이 남긴 기술 격차를 해소합니다. 인력이 늘어남에 따라 두 개의 군수 생산 시설이 추가로 문을 엽니다."
 ENG_national_armaments_director: "국가 군수 책임자"
 ENG_national_armaments_director_desc: "국방부 내에 국가 군수 책임자 직위가 신설되어, 조달, 수출 허가, 동맹 상호 운용성을 조율하면서 주권 산업 기반을 전략적으로 총괄합니다."
 ENG_strategic_export_pact: "전략 수출 협약"
 ENG_strategic_export_pact_desc: "BAE 시스템즈는 오스트레일리아, 캐나다, 일본, 이탈리아와 정부 보증 수출 협정을 체결할 권한을 부여받습니다. AUKUS와 세계 전투 항공 틀이 외교적 토대를 제공합니다."
 ENG_full_spectrum_industrial_base: "전방위 산업 기반"
 ENG_full_spectrum_industrial_base_desc: "영국은 잠수함, 전투기, 장갑차량, 탄약, 정밀 무기라는 방위 산업의 다섯 기둥 전반에서 자급자족을 달성합니다. 이 복합체는 공식적으로 국가 전략 자산으로 지정됩니다."
 ENG_lean_defence_posture: "간소화된 국방 태세"
 ENG_lean_defence_posture_desc: "국방부는 수요 신호 모델을 채택하여 국내 산업 투입을 줄이고 동맹 공급자에 대한 의존을 더 크게 받아들입니다. 국고 절감 효과가 즉시 나타납니다."
 ENG_value_for_money_review: "재정 효율성 검토"
 ENG_value_for_money_review_desc: "국가회계감사원의 국방부 조달 검토는 구조적인 비용 초과를 지적합니다. 주요 계약의 포괄적인 재협상으로 단가가 낮아지고 중복 계획이 제거됩니다."
 ENG_mothball_strategic_yards: "전략 조선소 보관 전환"
 ENG_mothball_strategic_yards_desc: "영국 해군 조선소 시설 세 곳이 유지 보수 축소 상태로 전환됩니다. 당장의 절감 효과는 상당하지만, 해군 건조 능력은 향후 상당한 투자 없이는 회복되지 않을 것입니다."
 ENG_cancel_legacy_programmes: "기존 계획 취소"
 ENG_cancel_legacy_programmes_desc: "님로드 MRA4, 센티널 R1 및 그 후속 계획이 인도 전에 취소됩니다. 이 결정은 자본을 풀어 주지만 해소하는 데 수년이 걸릴 감시 및 해상 초계 능력의 공백을 낳습니다."
 ENG_off_the_shelf_procurement: "기성품 조달"
 ENG_off_the_shelf_procurement_desc: "영국은 맞춤형 개발을 포기하고 검증된 외국 플랫폼을 선택합니다. 이 방식은 초기 비용을 낮추지만 국내 산업 처리량을 줄이고 연구 기반을 축소합니다."
 ENG_f35_partnership_deepening: "F-35 파트너십 심화"
 ENG_f35_partnership_deepening_desc: "영국은 F-35B 도입을 48기로 앞당기고 통합 타격 전투기 공급망과의 통합을 심화합니다. 영국 기업들은 생산되는 각 항공기의 약 15퍼센트를 공급합니다."
 ENG_european_defence_cooperation: "유럽 방위 협력"
 ENG_european_defence_cooperation_desc: "영국은 프랑스, 독일, 이탈리아와의 양자 간 역량 협력을 다시 추진합니다. 공동 연구는 중복을 줄이지만, 해외 조달이 늘어남에 따라 국내 군수 공장 생산량은 감소합니다."
 ENG_smart_acquisition_reform: "스마트 획득 개혁"
 ENG_smart_acquisition_reform_desc: "국방 획득 개혁 계획이 전면 시행됩니다. 초기 투자 분석과 전 수명 주기 비용 모델링이 의무화되어 비용이 큰 후반 단계 변경이 줄어듭니다."
 ENG_dual_use_innovation: "이중 용도 혁신"
 ENG_dual_use_innovation_desc: "군민 기술 이전 체계가 공식화되어 전자 및 통신 기업이 군사 C4ISR 계획에 기여합니다. 전자 연구 보조금이 두 차례 지급됩니다."
 ENG_naval_squeeze_efficiency: "해군 긴축 효율화"
 ENG_naval_squeeze_efficiency_desc: "함대 준비태세국은 로사이스에서 정비 주기를 통합하고, 공동 장비와 인력풀을 활용해 선체당 월 비용을 줄입니다. 통합된 업무량을 흡수하기 위해 새로운 조선소 시설이 문을 엽니다."
 ENG_minimum_viable_industrial_base: "최소 존립 산업 기반"
 ENG_minimum_viable_industrial_base_desc: "영국은 주권 생산 능력의 더 이상 줄일 수 없는 하한선을 정합니다. 이 하한선 아래로는 더 이상의 감축이 허용되지 않습니다. 이 약속은 산업계의 기대를 안정시키고 노동 불안을 가라앉힙니다."
 ENG_strategic_reliance_doctrine: "전략적 의존 교리"
 ENG_strategic_reliance_doctrine_desc: "국가안보회의는 중간 규모 경제에는 주로 미국에 대한 동맹 의존이 가장 비용 효율적인 태세라고 결론짓습니다. 무기 대여 조건이 영구적으로 개선됩니다."
 ENG_industrial_realignment_idea: "방위 산업 재편"
 ENG_industrial_realignment_idea_desc: "자원이 민간 생산 라인에서 방위 생산 라인으로 돌려지고 있습니다. 주권 무기 계획을 위해 설비를 교체하는 공장들이 민간 생산량을 일시적으로 감소시킵니다."
 ENG_capability_gap_idea: "능력 공백"
 ENG_capability_gap_idea_desc: "기존 계획의 취소로 군이 대체 체계 없이 남게 되었습니다. 신규 조달이 완료될 때까지 작전 준비태세가 저하됩니다."
 ENG_p125_revival: "P.125 계획 부활"
 ENG_p125_revival_desc: "P.125 사업의 부활은 국내 전투기 제조업에 다시 활력을 불어넣어, 계획이 성숙해지는 동안 경항공기 생산 비용을 낮추었습니다."
 ENG_charles_2_idea: "웨일스 공"
 ENG_charles_3_idea: "웨일스 공"
 ENG_charles_4_idea: "찰스 3세"
 ENG_andrew_2_idea: "영국 해군 사령관"
 ENG_andrew_4_idea: "요크 공작"
 ENG_andrew_5_idea: "요크 공작"
 ENG_anne_2_idea: "프린세스 로열"
