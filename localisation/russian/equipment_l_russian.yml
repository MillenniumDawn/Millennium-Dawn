 SIN_infantry_weapons_3: "SR 88"
 SIN_infantry_weapons_4: "SAR 21"
 SIN_infantry_weapons_4_desc: "Первая успешная отечественная штурмовая винтовка, разработанная и произведённая компанией ST Kinetics, SAR 21 — современное решение для нужд SAF в XXI веке. Несмотря на внешнее сходство со Steyr AUG, её механизмы основаны на моделях AR-15, модифицированных и улучшенных для нужд SAF. Заменив устаревшую M16S1, SAR 21 теперь служит основным оружием каждого солдата, военнослужащего и резервиста SAF."
 SIN_infantry_weapons_5: "SAR 21 MMS"
 SIN_infantry_weapons_5_desc: "В начале 2000-х годов Министерство обороны представило новую концепцию технологически продвинутых вооружённых сил, выдвинув инициативу по преобразованию SAF в армию третьего поколения. SAR 21 MMS — это модифицированный вариант SAR 21, входящий в состав Advanced Combat Man System. Он был представлен в 2005 году, чтобы дать каждому военнослужащему информацию об обстановке, необходимую на современном поле боя, и полностью интегрирован с дисплеями HUD, тактическими каналами передачи данных и развитой сетью связи в рамках перехода SAF к вооружённым силам третьего поколения."
 SIN_infantry_weapons_6: "BR 18 BMCR"
 SIN_infantry_weapons_6_desc: "BMCR была впервые представлена на Сингапурском авиасалоне 2014 года как часть перспективных технологий SAF. Вскоре она превратилась в штурмовую винтовку BR-18, которая заменит SAR 21, и уже в 2018 году была запущена в производство."
 SIN_util_vehicle_6: "Belrex PCSV"
 SIN_util_vehicle_6_short: "Belrex"
 SIN_util_vehicle_6_desc: "Belrex PCSV был представлен в 2016 году в рамках инициативы SAF по преобразованию своей армии в боевую силу 3-го поколения. Первоначально созданный на основе южноафриканского Marauder MRAP, Belrex предназначен для выполнения аналогичной роли, но с возможностью модификации для различных задач и потребностей. Belrex должен был заменить 5-тонные грузовики и бронетранспортёры SAF."
