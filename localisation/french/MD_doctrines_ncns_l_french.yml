 GRAND_DOCTRINE_AIR_BATTLEFIELD_SUPPORT: "Soutien sur le champ de bataille"
 category_all_ranger: "Tous les régiments de Rangers"
 category_inf_ranger: "Régiment de Rangers d'infanterie"
 category_rcon_ranger: "Régiment de Rangers de reconnaissance"
 heavy_frigate: "Frégate lourde"
 GRAND_DOCTRINE_LOCAL_AIRSPACE_DEFENCE_DESC: "Cette grande doctrine structure les forces aériennes autour de la protection et du contrôle de l'espace aérien national et régional. Les concepts de défense de l'espace aérien local mettent l'accent sur une surveillance et une réponse coordonnées dans des domaines aériens définis."
 GRAND_DOCTRINE_AIR_BATTLEFIELD_SUPPORT_DESC: "Cette grande doctrine structure les opérations aériennes pour soutenir directement les forces terrestres et navales dans les zones de combat actives. Les concepts de soutien au champ de bataille mettent l'accent sur l'intégration de la puissance aérienne dans la planification opérationnelle interarmées."
 GRAND_DOCTRINE_AIR_SUPREMACY_DESC: "Cette grande doctrine organise les forces aériennes pour établir et maintenir le contrôle du domaine aérien. Les concepts de suprématie aérienne mettent l'accent sur des opérations aériennes coordonnées pour garantir la liberté d'action sur toutes les zones opérationnelles."
 GRAND_DOCTRINE_MIXED_ROLE_DESC: "Cette grande doctrine structure les forces aériennes pour équilibrer plusieurs rôles opérationnels dans un cadre unifié. Les concepts de rôle mixte mettent l'accent sur la flexibilité d'emploi de la puissance aérienne sur des ensembles de missions divers."
 GRAND_DOCTRINE_EQUIPMENT_LIGHT_DESC: "Cette grande doctrine organise les forces autour d'ensembles d'équipement légers et simplifiés. Les concepts d'équipement léger mettent l'accent sur la facilité de déploiement et l'adaptabilité dans des environnements opérationnels variés."
 GRAND_DOCTRINE_EQUIPMENT_HEAVY_DESC: "Cette grande doctrine structure les forces autour de systèmes d'équipement fortement protégés et de haute capacité. Les concepts d'équipement lourd mettent l'accent sur une présence soutenue et une capacité de combat robuste au sein des formations."
 GRAND_DOCTRINE_EQUIPMENT_MOBILE_DESC: "Cette grande doctrine organise l'équipement des forces pour soutenir une haute mobilité opérationnelle et une manœuvre rapide. Les concepts d'équipement mobile mettent l'accent sur le mouvement, le repositionnement et la portée opérationnelle."
 GRAND_DOCTRINE_EQUIPMENT_FIRES_DESC: "Cette grande doctrine structure le développement d'équipement autour de systèmes dédiés aux feux indirects et d'appui. Les concepts d'équipement d'appui-feu mettent l'accent sur l'application coordonnée de la puissance de combat sur le champ de bataille."
 GRAND_DOCTRINE_EQUIPMENT_FULL_DESC: "Cette grande doctrine organise les forces autour d'un approvisionnement en équipement complet. Les concepts d'équipement complet mettent l'accent sur une dotation standardisée pour soutenir des opérations soutenues et étendues."
 GRAND_DOCTRINE_BLUE_WATER_DESC: "Cette grande doctrine structure les forces navales pour des opérations soutenues sur les océans ouverts et les théâtres maritimes lointains. Les concepts de marine hauturière mettent l'accent sur la portée mondiale, la projection de puissance et une présence de flotte continue."
 GRAND_DOCTRINE_GREEN_WATER_DESC: "Cette grande doctrine organise les forces navales autour d'opérations dans les environnements maritimes littoraux et régionaux. Les concepts de marine côtière mettent l'accent sur l'influence côtière et le contrôle régional de la mer."
 GRAND_DOCTRINE_JEUNE_ECOLE_DESC: "Cette grande doctrine structure la stratégie navale autour de bâtiments plus petits, spécialisés, et d'opérations maritimes distribuées. Les concepts de Jeune École mettent l'accent sur l'asymétrie et l'application sélective de la force dans la guerre navale."
 GRAND_DOCTRINE_GUERRE_DE_COURSE_DESC: "Cette grande doctrine organise les opérations navales autour de la perturbation de l'activité maritime par une guerre orientée vers le commerce. Les concepts de guerre de course mettent l'accent sur des actions navales ciblées le long des lignes de communication maritimes."
 marine_commandos: "Commandos marines"
 air_assault_artillery: "Unités aéroportées"
 SUBDOCTRINE_DESIGN_DRONE_DESC: "Cette doctrine priorise le développement de conceptions d'aéronefs sans pilote autour de l'opération à distance et de systèmes de soutien autonomes. Les conceptions de drones mettent l'accent sur l'intégration modulaire et une configuration de mission flexible pour élargir les options de puissance aérienne."
