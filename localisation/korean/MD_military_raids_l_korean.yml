 strike_aborted_tt: "전술 핵 타격 중단됨"
 nuclear_power_def_tt: "§Y전술 핵 타격§!과 §Y주 단위 핵 타격§!은 §Y중핵§! 및 §Y영유권§! 주에만 수행할 수 있습니다.\n\n또한 §Y핵 타격§!을 선제 타격으로 수행하려면 §Y50%§!의 §R항복 한계§!가 필요합니다."
 nuclear_power_off_tt: "§Y전술 핵 타격§!과 §Y주 단위 핵 타격§!은 어떤 목표에도 수행할 수 있습니다.\n\n§Y핵 타격§!은 분쟁 중 언제든 수행할 수 있으나, §R항복 한계§!가 §Y50%§! 미만인 상태에서 선제 타격을 가하는 국가는 부정적인 결과를 겪게 됩니다."
 no_use_case_tt: "이 국가는 어떠한 핵 타격도 수행할 수 없습니다."
 strat_retaliation_only_tt: "이 국가는 먼저 핵 타격을 받은 이후에만 §R전면 핵 타격§!을 수행할 수 있습니다."
 tac_and_strat_retaliation_tt: "이 국가는 먼저 핵 타격을 받은 이후에만 핵 타격을 수행할 수 있습니다."
 tac_first_use_strat_retal_tt: "이 국가는 자국의 §Y핵 태세§!에 따라 §Y전술 핵 타격§!과 §Y주 단위 핵 타격§!을 수행할 수 있으며, 먼저 핵 타격을 받은 이후에는 §R전면 핵 타격§!을 수행할 수 있습니다."
 full_first_use_tt: "이 국가는 먼저 핵 타격을 받지 않고도 자국의 §Y핵 태세§!가 허용하는 범위 내에서 어떠한 핵 타격이든 수행할 수 있습니다."
 MD_raid.1.t: "우리의 영토 보전을 침해한 [FROM.GetName]!"
 MD_raid.1.d: "[FROM.GetName]의 지도자 [FROM.GetLeader]이(가) 우리나라에 대한 일련의 협동 공격을 승인했다는 보고가 들어왔습니다. 이러한 침략은 양국 영토 간 경계에 대한 노골적인 무시, 혹은 착각을 시사합니다. 이곳의 많은 이들, 특히 민족주의자와 애국자들은 이를 강력한 대응이 필요한 명백한 전쟁 행위로 보고 있습니다. 그러나 국내외의 다른 이들은 전면전을 피하기 위해 자제하고 긴장을 완화할 것을 촉구하고 있습니다."
 MD_raid.1.a: "전쟁 행위를 응징 없이 넘어갈 수는 없다!"
 MD_raid.1.b: "국민에게 대응을 약속한다!"
 MD_raid.1.c: "[FROM.GetName]에 배상과 긴장 완화를 요구한다"
 MD_raid.1.e: "외교적 항의를 제기한다"
 MD_raid.2.t: "배상을 요구하는 [FROM.GetName]"
 MD_raid.2.d: "[FROM.GetName]으로부터 방금 공문이 도착했습니다. 그들은 자신들이 입었다고 주장하는 경제적 피해에 대한 보상을 요구하고 있습니다. [FROM.GetLeader]은(는) 최근 대국민 연설에서 지급을 거부할 경우 \\"신속하고 가혹한\\" 결과가 따를 것이라고 경고했습니다."
 MD_raid.2.a: "한 푼도 줄 수 없다."
 MD_raid.2.b: "평화의 대가인가?"
 MD_raid.3.t: "배상에 동의하고 긴장 완화를 약속한 [FROM.GetName]"
 MD_raid.3.d: "우리의 보복 위협이 [FROM.GetName] 지도부를 설득하여 양보하게 했으며, 그들은 우리 영토 보전에 대한 부당하고 불법적인 침해로 발생한 피해를 보전하는 데 필요한 자금을 제공했습니다. 또한 열린 대화에 임하고 앞으로 어떠한 침략 행위나 적대 행동도 삼가겠다고 약속함으로써 긴장을 완화하고 지역에 어느 정도의 안정을 되찾겠다고 다짐했습니다."
 MD_raid.3.a: "좋다"
 MD_raid.4.t: "배상을 거부한 [FROM.GetName]"
 MD_raid.4.d: "[FROM.GetLeader]은(는) 최근 군중 앞에서 한 연설에서 자국 정부가 \\"단 한 푼도\\" 지불하지 않을 것이라고 대담하게 선언했습니다. 이는 우리나라에 깊은 굴욕의 순간입니다. 그들의 최초 공격으로 우리의 영토 보전이 훼손되었을 뿐 아니라, 이제 국제 무대에서의 신뢰도마저 위협받고 있습니다."
 MD_raid.4.a: "보복해야 한다!"
 MD_raid.4.b: "아무 일도 없었던 것처럼 넘어간다."
 MD_raid.4.c: "국제 제재를 요청한다!"
 MD_raid.5.t: "국내외에서 굴욕을 당하는 우리 정부"
 MD_raid.5.d: "전 세계 기자들은 외세의 최근 공격에 대한 우리의 대응을 \\"빈말\\", \\"공허한 위협\\", \\"종이호랑이\\"와 같은 표현으로 묘사했습니다. 단호하게 대응하지 못한 결과 정부의 신뢰도는 심각한 타격을 입었고 방어 수단으로서 우리 군의 실효성에 의문이 제기되었습니다."
 MD_raid.5.a: "젠장"
 MD_raid.6.t: "보복!"
 MD_raid.6.d: "외국 영토에서의 우리의 최근 군사 작전은 [FROM.capital.GetCapitalVictoryPointName] 정권의 주의를 피하지 못했습니다. 이에 그들은 엄중한 경고를 발령하며 우리나라에 신속하고 단호한 보복을 하겠다고 공언했습니다. 그들이 예고한 임박한 대응에 대비하는 가운데 우리나라의 긴장은 고조되고 있습니다."
 MD_raid.6.a: "허세일지도 모른다"
 MD_raid.10.t: "[FROM.GetName]의 이웃 [FROM.FROM.GetName] 공격!"
 MD_raid.10.d: "이웃 나라 [FROM.FROM.GetName]이(가) 방금 [FROM.GetName]의 공격을 받았습니다! 타격에 앞선 공식적인 선전포고가 없었으므로, 이는 명백히 적대 세력에 의한 지역 영토 보전의 침해입니다. 지역 전체가 이번 타격에 대한 그들의 대응을 초조하게 기다리고 있습니다."
 MD_raid.10.a: "다음은 우리 차례인가?"
 MD_raid.12.t: "[FROM.GetName]의 [FROM.FROM.GetName] 타격!"
 MD_raid.12.d: "충격적이고 악랄한 침략 행위로, [FROM.GetLeader]은(는) 우리의 동맹 [FROM.FROM.GetName]에 대한 자국군의 군사 타격을 승인했습니다. 이 뻔뻔한 공격은 우리나라에 충격파를 일으켜 국민의 분노를 샀고 정부 안에서 단호한 조치를 요구하는 목소리를 불러일으켰습니다. 메시지는 분명합니다. 이러한 도발 없는 공격을 간과할 수 없으며 간과하지도 않을 것입니다."
 MD_raid.12.a: "우리는 언제나 동맹의 곁을 지킬 것이다!"
 MD_raid.13.t: "제재를 촉구하는 [FROM.GetName]!"
 MD_raid.13.d: "[FROM.GetLeader]은(는) 우리가 터무니없는 배상 요구를 거부한 이후 국제 사회에 우리에 대한 제재를 요청했습니다. 세계가 그 요청에 따를지는 시간이 말해 줄 것입니다.\n\n우리는 국제 관계, 정치, 경제 면에서 불이익을 겪게 되며, 우리에 대한 제재에 동참하는 국가가 많을수록 그 정도는 더 심해질 것입니다! 우리에게 적대적일수록, 또는 외교적·경제적으로 우리와 대립할수록 각국이 제재에 동참할 가능성이 높아집니다."
 MD_raid.13.a: "우리 경제는 버텨 낼 것이다!"
 MD_raid.14.t: "국제 제재를 요청하는 [FROM.FROM.GetName]!"
 MD_raid.14.d: "[FROM.FROM.GetLeader]은(는) 국제 사회가 [FROM.GetName]을(를) 제재해 줄 것을 요청했습니다. 해당국이 [FROM.FROM.GetName]에 대한 군사 타격을 가한 뒤 요구된 배상금의 지급을 거부했기 때문입니다. 이제 세계는 그 요청에 답해야 합니다."
 MD_raid.14.a: "우리는 제재에 동참한다!"
 MD_raid.14.b: "아니, 지금은 아니다."
