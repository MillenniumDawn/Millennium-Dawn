 USA_Anti_Air_0: "FIM-43 Redeye"
 USA_Anti_Air_0_desc: "Эта ракетная система, разработанная нашей собственной компанией General Dynamics, использует пассивное инфракрасное самонаведение и отслеживает самолёты по теплу их выхлопа после того, как оператор визуально возьмёт цель на сопровождение, как при стрельбе из любого другого стрелкового оружия. Для поражения требуется прямое попадание, поэтому это оружие примитивное, но эффективное."
 USA_Anti_Air_1: "FIM-92 Stinger"
 USA_Anti_Air_1_desc: "Спроектированная так же, как и её предшественница, эта пассивная ракета класса «воздух — земля» имеет ряд улучшений по сравнению с более ранней моделью, таких как улучшенная баллистика, программное обеспечение и вариант с двойным ИК- и УФ-обнаружением."
 USA_Anti_Air_2: "FIM-92J Stinger"
 USA_Anti_Air_2_desc: "Продолжая повышать надёжность платформы Stinger, General Dynamics улучшила систему, добавив новый датчик крена и переработанное программное обеспечение управления; также значительно улучшились полётные характеристики. Кроме того, резко возросла эффективность против малых целей, таких как беспилотные летательные аппараты, крылатые ракеты и лёгкие разведывательные вертолёты."
 USA_Anti_Air_3: "FIM-194 Speargun"
 USA_Anti_Air_3_desc: "Поскольку самолёты 5-го поколения заметно присутствуют на поле боя, в этой новейшей версии нашего ПЗРК реализовано множество изменений для борьбы с новым противником. Прежде всего это возможности наведения: командное наведение по линии визирования, лазерное наведение, а также УФ- и ИК-наведение."
 USA_Anti_Air_4: "FIM-245 Heartstriker"
 USA_Anti_Air_4_desc: "Эта система, созданная усилиями DARPA, — вершина наших платформ ПЗРК. Благодаря последним достижениям, а также миниатюризации датчиков наши инженеры дали 1 человеку реальную возможность уничтожить или вывести из строя некоторые из самых малозаметных самолётов, доступных нашим противникам."
 USA_APC_1: "M113 APC"
 USA_APC_1_desc: "Разработанный FMC (Food Machinery Corp), этот БТР получил от Вьетконга прозвище «Зелёный дракон», поскольку использовался для прорыва сквозь густые заросли в джунглях, чтобы быстро атаковать и захватывать позиции противника."
 USA_APC_1_short: "M113 APC"
 USA_APC_2: "M113 ACAV"
 USA_APC_2_short: "M113 ACAV"
 USA_APC_3: "M113A3"
 USA_APC_3_short: "M113A3"
 USA_APC_4: "LAV-25A1"
 USA_APC_4_desc: "Эти новые колёсные бронированные машины обеспечивают повышенную защиту по сравнению с более ранними моделями, особенно от угрозы СВУ. Не менее впечатляющим является набор функций этой платформы, включая лазерный целеуказатель, лазерный дальномер, GPS, а также радиостанции и компьютеры, которые принимают данные о местоположении цели и передают их удалённым артиллерийским подразделениям или бомбардировщикам в воздухе."
 USA_APC_4_short: "LAV-25A1"
 USA_APC_5: "M1126 Stryker ICV"
 USA_APC_5_desc: "Stryker, который на самом деле ведёт происхождение от машин наших канадских соседей, удовлетворяет потребности морской пехоты, а также оснащён автоматической системой пожаротушения, системой защиты от ОМП (CBRN), дневным/ночным тепловизором и бортовыми системами связи нового поколения."
 USA_APC_5_short: "M1126 Stryker ICV"
 USA_APC_6: "M1127A2"
 USA_APC_6_short: "M1127A2"
 USA_APC_7: "LAV30"
 USA_APC_7_short: "LAV30"
 USA_APC_8: "M967 Smith"
 USA_APC_8_desc: "Любимый проект DARPA в области БТР по сути породил быстроходного, более смертоносного и лучше бронированного Зверя. Эта вершина технологий БТР гарантирует, что американский боец будет не только защищён, но и в комфорте, а также станет ещё эффективнее в бою, поскольку сможет быстрее, чем когда-либо, маневрировать между позициями противника и прорываться сквозь них."
 USA_APC_8_short: "Smith"
