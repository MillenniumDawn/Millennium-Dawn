 engine_light_quadcopter: "Двигательная установка квадрокоптера"
 engine_light_quadcopter_desc: "Четырехдвигательная система, предназначенная для легких, небольших дронов. Он способен летать на небольшие расстояния и нести несколько гранат для подрыва."
 internal_weapons_3: "Передовое внутреннее вооружение"
 internal_weapons_3_desc: "После жалоб пилотов истребителей на невозможность перевозить большое количество боеприпасов из-за ограничений по размеру внутренних отсеков конструкторы постарались сделать эти отсеки ещё больше, чтобы ещё больше увеличить грузоподъёмность."
 weap_drone_hand_grenade: "Ручная граната для сброса с дрона"
 weap_drone_hand_grenade_desc: "Ручная граната с системой дистанционного спуска, предназначенная для сброса на цели с помощью беспилотных систем квадрокоптеров."
 avionics_drone_quadcopter: "Системы беспилотных квадрокоптеров"
 avionics_drone_quadcopter_desc: "Ваш типичный беспилотник из Walmart, только перепрофилированный для более агрессивных целей."
 wing_quadcopter: "Конструкция квадрокоптера"
 wing_quadcopter_desc: "Конструкция дрона, используемая для создания чрезвычайно дешевых и надежных дронов для массового использования."
 weap_int_ag_strat_2: "Внутренний бомбоотсек"
 weap_int_ag_strat_2_desc: "Внутренний бомбовый отсек, повышающий скрытность самолёта, а также позволяющий ему нести большой объём боеприпасов.\n\n§GПодсказка дизайнера: Этот модуль позволяет строить малозаметные бомбардировщики, повышая их радиолокационное преимущество и давая возможность стратегических бомбардировок.§!\n\n§WИспользование в качестве основного оружия создаст §! §Bстратегический бомбардировщик§!"
 weap_int_mp_light_hardpoint_2: "Внутренняя лёгкая точка подвески 1-го поколения"
 weap_int_mp_light_hardpoint_2_desc: "Внутренние лёгкие узлы подвески позволяют самолёту нести смешанный набор вооружения во внутренних отсеках, повышая его скрытность. Эти узлы подвески дешевы и предназначены либо для оснащения лёгких самолётов ограниченным вооружением, либо для дополнения боевой нагрузки других самолётов. На них размещаются ракеты «воздух-воздух» малой дальности, бомбы массой 250-500 фунтов и блоки неуправляемых ракет.\n\n§GПодсказка дизайнера: Эти точки подвески позволяют строить малозаметные самолёты с лёгким вооружением — идеально для стран с ограниченным бюджетом.§!\n\n§WИспользование этого узла в качестве основного вооружения создаст§! §Bмногоцелевой истребитель§!\n\n§RПРЕДУПРЕЖДЕНИЕ: палубные многоцелевые истребители будут атаковать в морском бою только вражеские корабли§!"
 weap_int_mp_light_hardpoint_3: "Внутренняя лёгкая точка подвески 2-го поколения"
 weap_int_mp_light_hardpoint_3_desc: "$weap_int_mp_light_hardpoint_2_desc$"
 weap_int_mp_light_hardpoint_4: "Внутренняя лёгкая точка подвески 3-го поколения"
 weap_int_mp_light_hardpoint_4_desc: "$weap_int_mp_light_hardpoint_2_desc$"
 weap_int_a2a_hardpoint_1: "Внутренняя точка подвески «воздух-воздух» 1-го поколения"
 weap_int_a2a_hardpoint_1_desc: "Внутреннее вооружение класса «воздух-воздух» обеспечивает лучшую маскировку, но при этом вмещает меньше боеприпасов, которые могут быть менее мощными.\n\n§GПодсказка дизайнера: Внутренние точки подвески «воздух — воздух» предназначены прежде всего для малозаметных истребителей завоевания превосходства в воздухе. Они дают бонус к радиолокационному преимуществу и некоторую воздушную атаку, но меньше, чем внешние точки подвески.§!\n\n§W Использование этого оружия в качестве основного создаст§! §B истребитель превосходства в воздухе§!\n\n§R ВНИМАНИЕ: истребители превосходства в воздухе будут атаковать вражеские самолёты только во время морского боя§!"
 weap_int_a2a_hardpoint_2: "Внутренняя точка подвески «воздух-воздух» 2-го поколения"
 weap_int_a2a_hardpoint_2_desc: "$weap_int_a2a_hardpoint_1_desc$"
 weap_int_a2a_hardpoint_3: "Внутренняя точка подвески «воздух-воздух» 3-го поколения"
 weap_int_a2a_hardpoint_3_desc: "$weap_int_a2a_hardpoint_1_desc$"
 weap_int_mp_med_hardpoint_2: "Внутренняя средняя точка подвески 1-го поколения"
 weap_int_mp_med_hardpoint_2_desc: "Узлы подвески, предназначенные для размещения вооружения среднего размера. Легкие противокорабельные ракеты, высокоточные боеприпасы, противотанковые ракеты, крылатые ракеты средней дальности, ракеты класса «воздух-воздух» большой дальности, пушечные контейнеры и многое другое. Эти узлы подвески позволяют использовать широкий спектр вооружения, а также повышают скрытность самолета\n\n§GПодсказка дизайнера: Средние точки подвески — воплощение многоцелевого самолёта: они открывают доступ почти ко всем заданиям и дают нужные для них характеристики ценой роста стоимости производства. С этими модулями получается сбалансированный универсальный самолёт.§!\n\n§WЕсли использовать его в качестве основного оружия, получится§! §Bмногоцелевой истребитель§!\n\n§RВНИМАНИЕ: многоцелевые истребители CV будут атаковать вражеские корабли только во время морского боя§!"
 weap_int_ag_cas_hardpoint_2: "Внутренняя точка подвески для штурмовика 1-го поколения"
 weap_int_ag_cas_hardpoint_2_desc: "Узлы подвески, предназначенные для перевозки большого количества боеприпасов «воздух-земля». Эти узлы подвески позволяют перевозить большее количество боеприпасов, а также несколько систем вооружения, таких как ракеты «воздух-земля», более тяжёлые бомбы и большее количество противорадиолокационных ракет, а также улучшают характеристики скрытности.\n\n§GПодсказка дизайнера: Точки подвески для непосредственной авиаподдержки значительно повышают атаку по наземным целям и стратегические бомбардировки, но лишают самолёт воздушной атаки и снижают радиолокационное преимущество.§!\n\n§WИспользование этого оружия в качестве основного создаст§! §BCAS-самолет§!"
