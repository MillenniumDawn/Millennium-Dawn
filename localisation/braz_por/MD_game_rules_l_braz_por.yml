 RULE_ALLOW_TOGGLING_CHEAT_DECISIONS: "§Y(Multiplayer)§! Permitir Ativação Global de Decisões de Trapaça"
 RULE_YES_ALLOW_TOGGLING_CHEAT_DECISIONS_DESC: "§Y(Opcional)§!\n\nAtivação Global de Decisões de Trapaça Habilitada\n§YNOTA:§! Qualquer nação no mundo pode ativar ou desativar as Decisões de Trapaça, e os efeitos são §Yglobais§!. Um evento aparecerá informando qual nação ativou ou desativou.\n§YCertifique-se de que você está autorizado a usar a decisão em um jogo multijogador!§!\n\n§YNOTA:§! Você também precisa habilitar a regra do jogo \"Permitir Decisões de Trapaça\" se quiser usar trapaças!"
 RULE_NO_ALLOW_TOGGLING_CHEAT_DECISIONS_DESC: "§Y(Opcional)§!\n\nAtivação Global de Decisões de Trapaça Desabilitada\n§YNOTA:§! Qualquer nação no mundo pode ativar ou desativar as Decisões de Trapaça, e os efeitos são §Yglobais§!. Um evento aparecerá informando qual nação ativou ou desativou.\n§YCertifique-se de que você está autorizado a usar a decisão em um jogo multijogador!§!\n\n§YNOTA:§! Você também precisa habilitar a regra do jogo \"Permitir Decisões de Trapaça\" se quiser usar trapaças!"
