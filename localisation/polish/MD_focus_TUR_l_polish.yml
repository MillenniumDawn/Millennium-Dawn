l_polish:
 turkey_focus: "Tureckie drzewo fokusowe"
 TUR_PKK_autonomy_idea: "PKK Opór"
 TUR_PKK_autonomy_idea_desc: "Włączenie PKK do innego kraju będzie prawie niemożliwe."
 TUR_traditional_ideals: "Tradycyjne ideały"
 TUR_traditional_ideals_desc: "Odrzucenie obcych ideałów i wpływów to najlepsza droga, jaką może obrać nasz naród, aby być wolnym i niezależnym."
 TUR_archeology_cooperation: "Współpraca Archeologiczna"
 TUR_archeology_cooperation_desc: "Współpracujemy z innymi narodami przy wydobywaniu starożytnych skarbów świata"
 TUR_tubitak_idea_name: "TUBITAK"
 TUR_belgian_workers: "Belgijscy naukowcy"
 TUR_tubitak_idea_name_desc: "Wysłaliśmy samolotami belgijskich naukowców, aby wykonali dla nas ciężką pracę badawczo-rozwojową."
 TUR_islamic_legacy2: "The Caliphate's Legacy"
 TUR_islamic_legacy2_desc: "Kalifat będzie miał w naszym narodzie bardzo długą historię i musimy to podkreślić. Wykorzystamy to na naszą korzyść do celów ideologicznych"
 TUR_mit_reform: "Reformy MIT"
 TUR_mit_reform_desc: "MIT został zreformowany, aby śledzić aktywność w życiu cywilnym."
 TUR_tourism: "Napływ turystyki"
 TUR_tourism_desc: "We've had a lot of tourists coming into the country recently."
 TUR_mit_coop: "Współpraca z MIT"
 TUR_mit_coop_desc: "MIT obecnie bardzo blisko współpracuje z naszymi siłami zbrojnymi, monitorując nawet kluczowe dokumenty i informacje wojskowe."
 TUR_new_armed_forces: "Odnowione Siły Zbrojne"
 TUR_new_armed_forces_desc: "Nasza armia została odnowiona i odrodzona w wyniku naszych gruntownych reform."
 TUR_airforce: "Kontrakty lotnicze"
 TUR_airforce_desc: "Podpisaliśmy umowy z kilkoma firmami lotniczymi, aby zapewnić nam lepsze oferty."
 TUR_naval_idea_name: "Marynarka Turecka"
 TUR_naval_idea_name_desc: "Zadaniem tureckiej marynarki wojennej jest zapewnienie Turcji hegemonii na oceanach i wodach terytorialnych."
 TUR_alawite_mili_experience: "Doświadczenie wojskowe Alawitów"
 TUR_alawite_mili_experience_desc: "Alawici mają spore doświadczenie w walce. Z tego powodu nie musimy ich szkolić i uczyć ich własnych."
 TUR_our_own_experience: "Tureckie doświadczenie wojskowe"
 TUR_our_own_experience_desc: "Wykorzystamy tureckie doświadczenie wojskowe jako środek dowodzenia jednostkami alawitów w walce"
 TUR_service_community_name: "Służba społeczeństwu"
 TUR_service_community_name_desc: "Hizmet oznacza usługę. Z tego powodu naszym obowiązkiem jest pomaganie ludziom na całym świecie."
 TUR_revised_budgetting_name: "Zmienione budżety"
 TUR_revised_budgetting_name_desc: "Dokonaliśmy korekty naszego budżetu, aby lepiej dostosować go do obecnych potrzeb społeczeństwa tureckiego."
 TUR_akp_protests: "Protesty AKP"
 TUR_akp_protests_desc: "Zwolennicy AKP nie są zbyt zadowoleni z naszych ostatnich decyzji i z tego powodu wyszli na ulice"
 TUR_major_military_reform: "Główne reformy wojskowe"
 TUR_major_military_reform_desc: "Wojsko pozostało praktycznie takie samo od czasu dojścia Ataturka. Zreformowanie go było najlepszą rzeczą, jaką mogliśmy dla niego zrobić, ponieważ teraz będzie to potężna siła w XXI wieku."
 TUR_religious_directorate: "The Diyanet's Role"
 TUR_religious_directorate_desc: "Diyanet, czyli inaczej nasza dyrekcja ds. religii, będzie torować drogę nowemu i zaktualizowanemu systemowi edukacji w naszym kraju."
 TUR_no_prime_minister: "Republika Prezydencka"
 TUR_no_prime_minister_desc: "We have removed the Prime Minister's position from power, therefore shifting Turkey's politics to a Presidential Republic."
 TUR_threat_abroad: "Zagrożenie za granicą"
 TUR_threat_abroad_desc: "Not only is Turkey in danger because of dangerous people running around within the nation, but also bad actors outside of the country wish to seek harm upon us. We will make sure these bad actors are busy as we can now send our own troops to their lands without declaring war."
 TUR_military_happy: "Zadowolony wojskowy"
 TUR_military_happy_desc: "The Military is currently §GPleased§! with our party and policies, and is not going to cause us any problems.\n§W--------------§!\nThis national spirit will be §RReplaced§! if our standing with the military §HDrops below 0§! or we remove §HThe Military Internal Faction§!."
 TUR_military_anger1: "Niezadowolony wojskowy"
 TUR_military_anger1_desc: "The Military is currently §RUnsatisfied§! with our party and policies, and is not going to cause us any problems for the time being.\n§W--------------§!\nThis national spirit will be §RReplaced§! if our standing with the military §HDrops below -50§! or we exceed §H0§!.This national spirit will also cancel if remove §HThe Military Internal Faction§!."
 pkk_static_modifier: "Echa kurdyjskiego ruchu oporu"
 pkk_static_modifier_desc: "Ever since the end of the Great War, and the Treaty of Sevres, the Kurds have been yearning for a country of their own, free and independent from that of ours. Their independence from our nation will bring devastating consequences, but their occupation will do no good either."
 kurdish_resistance_dynamic_modifier: "Kurdyjski ruch oporu"
 kurdish_resistance_dynamic_modifier_desc: "Od zakończenia wielkiej wojny i traktatu z Sèvres Kurdowie tęsknią za własnym krajem, wolnym i niezależnym od naszego. Ich niepodległość od naszego narodu przyniesie katastrofalne skutki, ale okupacja również nie przyniesie żadnych korzyści."
 TUR_military_anger2: "Sfrustrowana armia"
 TUR_military_anger2_desc: "The Military is currently §RFrustrated§! with our party and policies, and is starting to cause us some problems.\n§W--------------§!\nThis national spirit will be §RReplaced§! if our standing with the military §HDrops below -100§! or exceeds §H-50§!. This national spirit will also cancel if remove §HThe Military Internal Faction§!."
 TUR_military_anger3: "Wściekła Armia"
 TUR_military_anger3_desc: "The Military is currently §RFurious§! with our party and policies, and they are causing problems.\n§W--------------§!\nThis national spirit will be §RReplaced§! if our standing with the military §HDrops below -150§! or we exceed §H-100§!. This national spirit will also cancel if remove §HThe Military Internal Faction§!."
 TUR_military_anger4: "Nielojalna armia"
 TUR_military_anger4_desc: "The Military is currently §RDisloyal§! because of our party and policies, and they are causing major problems.\n§W--------------§!\nThis national spirit will be §RReplaced§! if our standing with the military §HDrops below -200§! or we exceed §H-150§!. This national spirit will also cancel if remove §HThe Military Internal Faction§!."
 TUR_military_anger5: "Ukarana Armia"
 TUR_military_anger5_desc: "The Military is currently §RCrippled§! due to our party policies and low standing. The armed forces of Turkey are virtually useless unless we increase our standing with the military.\n§W--------------§!\nThis national spirit will be §RReplaced§! if our standing with the military exceeds §H-200§!. This national spirit will also cancel if we remove §HThe Military Internal Faction§!."
 TUR_highways: "Tureckie autostrady"
 TUR_highways_desc: "Nasze drogi zaczynają się kruszyć i rozpadać, dlatego będziemy musieli rozpocząć budowę nowych autostrad dla naszych obywateli."
 TUR_guards_of_kemalism: "Strażnicy kemalizmu"
 TUR_guards_of_kemalism_desc: "Turecka armia postrzega siebie jako obrońcę Republiki i jej świeckich ideałów kemalistycznych. Wojsko wielokrotnie interweniowało w politykę Turcji przez cały okres istnienia republiki i jest gotowe zrobić to ponownie, jeśli uzna, że ​​jego wartości są zagrożone. Jednak po swojej interwencji często w sposób pokojowy oddawali władzę narodowi i tego właśnie oczekują ludzie.\n\nWojsko sprzeciwia się nieświeckim partiom politycznym, takim jak §W[Nat_Populism_L]§!. Wojsko §Ystoi§! na rząd wpływa wiele czynników, takich jak §GSkonserwatyzm społeczny - Rząd§!. Jeśli nasz §YStały§! wraz z nimi spadnie poniżej §Y0§!, wojsko podejmie działania mające na celu obalenie rządu.\n\n§YWojsko§! również przeciwstawią się próbom zmniejszenia jego mocy, ale jeśli uda nam się je usunąć, nie będą mogły nam przeszkadzać."
 TUR_between_east_and_west: "Między Wschodem a Zachodem"
 TUR_between_east_and_west_desc: "Even though Turkey is part of NATO, it is a close rival to its NATO ally Greece. Turkey also has close economic ties with Russia, while at the same time working against their interests. Balancing between the great powers and keeping our own interests at heart will be the key to our success.\n\nIf we ally ourselves too closely with a §YGreat Power§! or a §YSuper Power§!, we have clearly chosen our side on the world stage."
 TUR_no_economic_plan: "Brak planu gospodarczego"
 TUR_no_economic_plan_desc: "§RWe can't increase our §YEconomic Cycle§! above §YRecession§!§!\n\nSeveral attempts to form governments in the late 90s, a subsequent military coup with a newly elected government and IMF warnings of a collapsing economy have caused dozens of billions of dollars to disappear from the economy as foreign investors have pulled out of the country. As the Turkish economy is practically built on foreign investment, this has stopped any economic growth."
 TUR_economic_insecurity_name: "Niepewność gospodarcza"
 TUR_economic_insecurity_name_desc: "Several attempts to form governments in the late 90s, a subsequent military coup with a newly elected government and IMF warnings of a collapsing economy have caused dozens of billions of dollars to disappear from the economy as foreign investors have pulled out of the country. As the Turkish economy is practically built on foreign investment, this has stopped any economic growth."
 TUR_economic_security_name: "Bezpieczeństwo Gospodarcze"
 TUR_economic_security_name_desc: "Udało nam się przywrócić bezpieczeństwo gospodarcze. Mimo to nie jesteśmy niepokonani w przypadku kolejnych kraks. Będziemy musieli zawsze monitorować i ulepszać turecką gospodarkę, aby nasz naród mógł prosperować."
 TUR_economic_security3: "Wielka gospodarka turecka"
 TUR_economic_security3_desc: "Nasza gospodarka jest teraz większa niż wcześniej, dzięki całej ciężkiej pracy, którą w nią włożyliśmy. Teraz możemy być pewni, że bez względu na wszystko gospodarka będzie w stanie się odbić i być lepsza niż kiedykolwiek wcześniej."
 TUR_asteroid_mining: "Wydobycie asteroid"
 TUR_asteroid_mining_desc: "Wydobywamy asteroidy, abyśmy mogli dostarczać ich metale szlachetne do naszych fabryk. Lepsze materiały przełożą się na lepszą produkcję."
 TUR_radicalism_destroy: "Program antyislamistyczny"
 TUR_radicalism_destroy_desc: "Forsujemy program antyislamistyczny, aby przeciwdziałać wzrostowi islamizmu w kraju. Będziemy także promować dyplomację antyislamistyczną i zrywać stosunki z krajami o twardej linii islamistycznej."
 TUR_osman_v: "Osman W"
 TUR_osman_v_desc: "Born on August 18, 1912, in Istanbul, Osman V or otherwise known as Ertugrul Osman, was the son of Mehmed Burhaneddin. He is often referred to as the \"Last Ottoman\", but ironically enough there are now successors to the Ottoman throne following the return of the Osmanoglu family."
 TUR_mit_reformed: "MIT – Koncentracja krajowa"
 TUR_mit_reformed_desc: "MIT skupi się bardziej na sprawach wewnętrznych niż zewnętrznych"
 TUR_mit_emboldened: "MIT – Fokus zagraniczny"
 TUR_mit_emboldened_desc: "MIT będzie bardziej martwić się tym, co dzieje się poza naszym krajem"
 TUR_government_led_disasters: "Plan kierowany przez rząd"
 TUR_government_led_disasters_desc: "Zamiast organizacjom charytatywnym rząd zamierza zapewnić pomoc osobom, które doświadczyły klęsk żywiołowych, chociaż mogą one również pomóc, jeśli chcą"
 TUR_refugees_maintained: "Uchodźcy utrzymani"
 TUR_refugees_maintained_desc: "Zamiast deportować naszych uchodźców, zdecydowaliśmy się ich zatrzymać i wykorzystać jako siłę roboczą"
 TUR_drugs_illegalized: "Narkotyki kryminalizowane"
 TUR_drugs_illegalized_desc: "Jeśli ktoś używa narkotyków do celów innych niż medyczne, może popaść w konflikt z prawem"
 TUR_drugs_legalized: "Narkotyki zalegalizowane"
 TUR_drugs_legalized_desc: "Nie interesuje nas, do czego ludzie używają narkotyków, to i tak jest ich życie"
 TUR_nationalist_advantage: "Nacjonalista wykorzystany"
 TUR_nationalist_advantage_desc: "We are utilizing Nationalism for an extra boost to governance, making it easier to pursue certain policies"
 TUR_fight_nationalist: "Walka z nacjonalizmem"
 TUR_fight_nationalist_desc: "Nacjonalizm jest niebezpieczną siłą, może siać spustoszenie i niestabilność w naszym narodzie"
 TUR_turkish_media_unctrolled2: "Tureckie media – §CUdochodzenie§!"
 TUR_turkish_media_unctrolled2_desc: "Obecnie trwa dochodzenie w sprawie naszych mediów i w najbliższej przyszłości zostaną wprowadzone reformy"
 TUR_party_rumours: "Plotki imprezowe"
 TUR_party_rumours_desc: "§RWnie możemy ręcznie zwiększyć popularności §W[socialism_L]§!§!\n\nPremier Bülent Ecevit jest już osobą w podeszłym wieku i krążą pogłoski o pogarszającym się zdrowiu. Krążą także pogłoski, że wicepremier Hüsamettin Özkan należy do grupy §W[socialism_L]§! parlamentarzystów, którzy planują obalić Ecevita ze względu na jego stan zdrowia i nieefektywną administrację. Tego rodzaju pogłoski i sprzeciw wewnątrz partii zatruwają zdolność rządu do funkcjonowania.\n\nPubliczne wezwanie Özkana zmusiłoby go do opuszczenia partii, ale mógłby zabrać ze sobą kilku innych parlamentarzystów. Alternatywnie możemy poczekać i mieć nadzieję, że to tylko plotki."
 TUR_reformed_airforce: "Zreformowane Siły Powietrzne"
 TUR_reformed_airforce_desc: "Siły powietrzne zostały zreformowane, aby lepiej działać w powietrzu i utrzymywać przewagę powietrzną nad wrogiem."
 TUR_PKK_insurgency_ceasefire: "Powstanie PKK - zawieszenie broni"
 TUR_PKK_insurgency_ceasefire_desc: "§RWnie możemy zwiększać popularności §W[Neutral_Communism_L]§!§!\n\nPKK to lewicowa kurdyjska grupa powstańcza, która od lat 70. walczy o większą autonomię Kurdów. Obie strony zaangażowały się w taktykę terroru, próbując osiągnąć nad sobą zwycięstwo.\n\nObecnie PKK ogłosiła jednostronne zawieszenie broni.\n\n-Proces pokojowy i negocjacje mogą być kontynuowane jedynie w przypadku aktywnego zawieszenia broni\n-Zawieszenie broni pozwala nam zebrać siły i przygotować niespodziewany atak na PKK."
 TUR_PKK_insurgency_active: "Powstanie PKK - aktywne"
 TUR_PKK_insurgency_active_desc: "§RWnie możemy zwiększać popularności §W[Neutral_Communism_L]§!§!\n\nPKK to lewicowa kurdyjska grupa powstańcza, która od lat 70. walczy o większą autonomię Kurdów. Obie strony zastosowały taktykę terroru, próbując osiągnąć nad sobą zwycięstwo.\n\nObecnie PKK aktywnie walczy z rządem.\n\n-Proces pokojowy i negocjacje mogą być kontynuowane jedynie pod warunkiem aktywnego zawieszenia broni\n-Zawieszenie broni nam na to pozwala zebrać siły i przygotować niespodziewany atak na PKK."
 TUR_kurdish_trouble_name: "Kurdyjskie kłopoty"
 TUR_kurdish_trouble_name_desc: "The East of our country is essentially an active warzone as a result of decades of fighting with the PKK.§W\n------------\n§!We can get rid of this national spirit by either §Hfederalizing Kurdistan§! or destroying the §HPKK insurgency§! through the mechanic."
 TUR_kurdish_trouble3_name: "Mediacja kurdyjska"
 TUR_kurdish_trouble3_name_desc: "The East of our country is essentially an active warzone as a result of decades of fighting with the PKK.§W\n------------\n§!We can get rid of, or modify this debuff by §HFederalizing Diyarbakir§!"
 TUR_kurdish_trouble5_name: "Niekończąca się wojna"
 TUR_kurdish_trouble5_name_desc: "The East of our country is essentially an active warzone as a result of decades of fighting with the PKK.§W\n------------\n§!We can modify this debuff by completing the §HEndless War§! focus path"
 TUR_mafia_active: "Turecka mafia - §RActive§!"
 TUR_mafia_active_desc: "The Mafia in our country has been organizing crime for many years now, and it has been disrupting daily life for our citizens. Our streets are currently somewhat safe, but they are less than ideal.§W\n------------\n§!We can get rid of the Mafia by §Hreducing its strength to 30 or less§!, and then doing the §Hdecisions§! made available. We must also complete §HThe Mafia§! focuses."
 TUR_mafia_active2: "Turecka mafia - §Robecnie§!"
 TUR_mafia_active2_desc: "The Mafia in our country has been organizing crime for many years now, and it has been disrupting daily life for our citizens. Our streets are currently somewhat safe, but they are less than ideal.§W\n------------\n§!We can get rid of the Mafia by §Hreducing its strength to 30 or less§!, and then doing the §Hdecisions§! made available."
 TUR_mafia_weakened: "Turecka mafia - §GOsłabiony§!"
 TUR_mafia_weakened_desc: "The Mafia in our country has been organizing crime for many years now, and it has been disrupting daily life for our citizens. Our streets are currently somewhat safe, but they are less than ideal.§W\n------------\n§!We can get rid of the Mafia by §Hreducing its strength to 30 or less§!, and then doing the §Hdecisions§! made available."
 TUR_mafia_weak: "Turecka mafia - §GSłaby§!"
 TUR_mafia_weak_desc: "The Mafia in our country has been organizing crime for many years now, and it has been disrupting daily life for our citizens. Our streets are currently somewhat safe, but they are less than ideal.§W\n------------\n§!We can get rid of the Mafia by §Hreducing its strength to 30 or less§!, and then doing the §Hdecisions§! made available."
 TUR_neo_ottomanism: "Neoosmanizm"
 TUR_neo_ottomanism_desc: "Neoosmanizm jest formą agresywnej polityki zagranicznej Turcji, która pozwoliła rządowi wpływać na kraje sąsiednie i wywierać wpływy Turcji na zewnątrz."
 TUR_zero_problems: "Polityka Zero Problemów"
 TUR_zero_problems_desc: "Polityka Zero Problemów jest formą pokojowej polityki zagranicznej Turcji, która pozwala rządowi wpływać na kraje sąsiadujące poprzez współpracę i inwestycje."
 TUR_turkish_media_unctrolled: "Tureckie media - §RUNiekontrolowane§!"
 TUR_turkish_media_unctrolled_desc: "Obecnie nasze media są całkowicie wolne od kontroli i wpływów rządu, co może powodować pewne problemy w przyszłości"
 TUR_win_over_workers: "Uspokojenie pracownika"
 TUR_win_over_workers_desc: "Apelujemy do pracowników naszych fabryk, dzięki czemu chętniej wspierają nasz rząd"
 TUR_no_disasters_plan: "Żadnych planów na wypadek katastrofy"
 TUR_no_disasters_plan_desc: "Obecnie nasz rząd nie ma planów gotowości na wypadek klęski żywiołowej, co oznacza, że ​​w przypadku wystąpienia katastrofy nie jesteśmy na nią gotowi"
 TUR_charity_disasters: "Plan biegu charytatywnego"
 TUR_charity_disasters_desc: "Nasz plan reagowania na katastrofy opiera się na życzliwości obywateli i darowiznach, które pozwolą na pomoc ludziom w potrzebie."
 TUR_government_led_disaster: "Plan kierowany przez rząd"
 TUR_government_led_disaster_desc: "Zamiast zlecać plan gotowości na wypadek katastrofy innej grupie, rząd stworzy i sfinansuje plany"
 TUR_turkish_media_restricted: "Tureckie media - §GZastrzeżone§!"
 TUR_turkish_media_restricted_desc: "We are restricting what can be put in the media to prevent the spread of dangerous ideals"
 TUR_turkish_media_unrestricted: "Tureckie media - §GUbez ograniczeń§!"
 TUR_turkish_media_unrestricted_desc: "Media mogą robić, co chcą, ale pod warunkiem wprowadzenia pewnych drobnych kontroli, aby zapobiec potencjalnym katastrofom"
 TUR_turkish_cyberspace: "Turecka cyberprzestrzeń"
 TUR_turkish_cyberspace_desc: "Coraz więcej naszych obywateli korzysta z Internetu, co oznacza, że ​​nie będziemy w 100% pewni, co się dzieje. Będziemy musieli określić, czy ograniczamy cyberprzestrzeń"
 TUR_turkish_cyberspace_restricted: "Ograniczona cyberprzestrzeń"
 TUR_turkish_cyberspace_restricted_desc: "Postanowiliśmy ograniczyć naszą cyberprzestrzeń, aby korzystanie z niej było bezpieczniejsze"
 TUR_turkish_cyberspace_unrestricted: "Nieograniczona cyberprzestrzeń"
 TUR_turkish_cyberspace_unrestricted_desc: "To nie nasza sprawa, co nasi ludzie robią w Internecie"
 TUR_erdonomics_name: "Erdonomika"
 TUR_erdonomics_name_desc: "Erdonomics refers to Erdogan's economic policies which brought sweeping reforms to the Turkish economy, for the better or for the worse"
 TUR_gulenist_economic_advisors: "Ekonomiści Gülenista"
 TUR_gulenist_economic_advisors_desc: "We have hired economists to advise the government on all matters economical"
 TUR_gulenist_intelligence_network: "Sieć wywiadowcza Gülenista"
 TUR_gulenist_intelligence_network_desc: "Wykorzystujemy fakt, że Güleniści rozprzestrzenili się po całym świecie, aby zbierać informacje"
 TUR_gulenist_intelligence_network2: "Sieć wywiadowcza Gülenista"
 TUR_gulenist_intelligence_network2_desc: "Wykorzystujemy fakt, że Güleniści rozprzestrzenili się po całym świecie, aby zbierać informacje"
 TUR_unban_erdogan: "§HUnban Erdogan z polityki§!"
 TUR_unban_erdogan_desc: "Erdoganowi od dawna wyrzucono z polityki, ale teraz, gdy AKP zapewniła sobie zwycięstwo, nadszedł czas, aby go odblokować."
 TUR_gulenist_educators: "Edukacja Gülenistyczna"
 TUR_gulenist_educators2: "Zaawansowana edukacja Gülenistów"
 TUR_gulenist_educators_desc: "Skupiliśmy się na poprawie naszej edukacji i musimy szerzyć nauki Gülena, póki możemy"
 TUR_mobilise_the_faithful_soldiers: "Mobilizacja Wiernych"
 TUR_mobilise_the_faithful_soldiers_desc: "Zmobilizowano Ruch Gülenista. Zachęcamy wszystkich członków do migracji do Turcji i wzmocnienia kraju"
 TUR_mobilise_the_faithful_soldiers2: "Mobilizacja Wiernych"
