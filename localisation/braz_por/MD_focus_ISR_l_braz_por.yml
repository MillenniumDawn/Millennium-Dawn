 israel_economy.53.t: "Israel oferece investimentos na indústria petroquímica!"
 israel_economy.53.d: "Israel ofereceu ao nosso país um acordo de investimento mutuamente benéfico. Devemos aceitar?"
 israel_economy.53.a: "Claro!"
 israel_economy.53.b: "Desculpe, não"
 israel_economy.54.t: "[From.GetName] aceita!"
 israel_economy.54.d: "Eles aceitaram nossa oferta!"
 israel_economy.54.a: "Ótimo!"
 israel_economy.55.t: "[From.GetName] rejeita!"
 israel_economy.55.d: "Eles não querem cooperar com o nosso país."
 israel_economy.55.a: "Pois é."
 israel_economy.56.t: "Acordo de Armas Israelense"
 israel_economy.56.d: "As forças armadas israelenses querem vender ao nosso país fuzis de assalto Tavor. Devemos comprá-los deles?"
 israel_economy.56.a: "Concordamos!"
 israel_economy.56.b: "Não"
 israel_economy.57.t: "[From.GetName] aceita"
 israel_economy.57.d: "Fechamos um acordo com [From.GetName] para vender alguns fuzis de assalto novinhos em folha!"
 israel_economy.57.a: "Ótimo!"
 israel_economy.58.t: "[From.GetName] recusa"
 israel_economy.58.d: "Eles não vão comprar nossos fuzis de assalto."
 israel_economy.58.a: "Droga"
 israel_economy.59.t: "Drones e Ponte Aérea Israelenses"
 israel_economy.59.d: "As forças armadas israelenses querem vender seus drones ao nosso país e pedem acesso aéreo às nossas bases. Devemos concordar?"
 israel_economy.59.a: "Concordamos!"
 israel_economy.59.b: "Não"
 israel_economy.60.t: "[From.GetName] aceita"
 israel_economy.60.d: "Fechamos um acordo com [From.GetName]!"
 israel_economy.60.a: "Ótimo!"
 israel_economy.61.t: "[From.GetName] recusa"
 israel_economy.61.d: "Eles não concordaram."
 israel_economy.61.a: "Droga"
 israeli_intelligenc_idea: "Rede do Mossad"
 israeli_intelligenc2_idea: "Rede do Mossad Aprimorada"
 israeli_intelligenc3_idea: "Rede do Mossad Totalmente Aprimorada"
 israel_economy.65.t: "Parceria Estratégica Israelense!"
 israel_economy.65.d: "Israel nos oferece um programa de parceria estratégica, no qual construirá para nós uma nova base aérea e pedirá que assinemos um acordo secreto com eles contra o Irã. Devemos concordar?"
 israel_economy.65.a: "Concordamos!"
 israel_economy.65.b: "Não podemos arriscar..."
 israel_economy.66.t: "[From.GetName] aceita."
 israel_economy.66.d: "Eles concordaram com nosso plano de parceria estratégica e aceitaram atacar o Irã caso o Irã nos ataque."
 israel_economy.66.a: "Ótimo."
 israel_economy.67.t: "[From.GetName] recusou nosso plano."
 israel_economy.67.d: "Eles não concordaram."
 israel_economy.67.a: "Argh."
 israel_economy.68.t: "Israel oferece cooperação econômica!"
 israel_economy.68.d: "Israel decidiu nos procurar e oferece uma cooperação econômica mutuamente benéfica. Devemos concordar?"
 israel_economy.68.a: "Claro!"
 israel_economy.68.b: "Desculpe, não."
 israel_economy.69.t: "[From.GetName] aceita."
 israel_economy.69.d: "Eles aceitaram nossa oferta!"
 israel_economy.69.a: "Ótimo!"
 israel_economy.70.t: "[From.GetName] rejeita!"
 israel_economy.70.d: "Eles rejeitaram nossa oferta!"
 israel_economy.70.a: "Muito lamentável."
 israel_economy.71.t: "Israel reconhece o Genocídio Armênio!"
 israel_economy.71.d: "Recentemente, o governo israelense anunciou que reconhece plenamente o genocídio armênio. Também traçou um novo roteiro para a cooperação política e econômica israelo-armênia."
 israel_economy.71.a: "Obrigado!"
 israel_economy.72.t: "Israel reconhece Artsakh!"
 israel_economy.72.d: "Recentemente, os governos israelense e armênio decidiram reconhecer simultaneamente Artsakh e declarar um tratado oficial. Agora, Israel pede para estabelecer bases militares em nosso território. Devemos concordar?"
 israel_economy.72.a: "Claro!"
 israel_economy.72.b: "Obrigado, mas não."
 ifweagree_tt: "Se concordarmos, a influência deles sobre Artsakh aumentará em 6%, e em 4% sobre a Armênia. Eles já nos influenciaram em 5% antes disso."
 israel_economy.73.t: "A Armênia concorda!"
 israel_economy.73.d: "A Armênia aceitou nossa oferta."
 israel_economy.73.a: "Ótimo!"
 israel_economy.74.t: "A Armênia recusou nossa oferta."
 israel_economy.74.d: "Eles não concordaram."
 israel_economy.74.a: "Affe."
 israel_economy.75.t: "Israel quer assinar um tratado de amizade!"
 israel_economy.75.d: "Recentemente, o governo de Israel nos propôs assinar um tratado de amizade com eles. Devemos concordar?"
 israel_economy.75.a: "Claro!"
 israel_economy.75.b: "Desculpe, não."
 israel_economy.76.t: "A Geórgia concorda!"
 israel_economy.76.d: "Eles assinaram o tratado de amizade conosco."
 israel_economy.76.a: "Ótimo!"
 israel_economy.77.t: "A Geórgia não concordou."
 israel_economy.77.d: "Eles não assinaram o tratado de amizade conosco."
 israel_economy.77.a: "Muito lamentável."
