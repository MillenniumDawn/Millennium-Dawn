 RULE_INFLUENCE_COOLDOWN: "투자 영향력 획득 대기시간"
 RULE_14_DAY_INFLUENCE: "14일 대기시간"
 RULE_14_DAY_INFLUENCE_DESC: "기본 설정입니다. 투자로 인한 영향력 획득의 대기시간은 14일(2주)입니다. 이는 해당 국가에 대한 모든 투자 기회에 적용됩니다. 대기시간 중에도 투자는 계속할 수 있지만, 영향력은 획득할 수 없습니다."
 RULE_0_DAY_INFLUENCE: "쿨다운 없음"
 RULE_0_DAY_INFLUENCE_DESC: "구버전 밀레니엄 던 방식의 투자 영향력 획득 규칙입니다. 원할 때마다 투자가 가능하며 그때마다 영향력을 얻습니다. 게임 밸런스를 중시하는 분들께는 권장하지 않습니다!"
 RULE_30_DAY_INFLUENCE: "30일 쿨다운"
 RULE_30_DAY_INFLUENCE_DESC: "멀티플레이 권장 설정입니다. 투자로 인한 영향력 획득의 대기시간은 30일(약 1개월)입니다. 이는 해당 국가에 대한 모든 투자 기회에 적용됩니다. 대기시간 중에도 투자는 계속할 수 있지만, 영향력은 획득할 수 없습니다."
 BOT_AI_BEHAVIOR: "@BOT 보츠와나"
 RULE_ALLOW_EDGY_FLAGS: "논란이 되는 깃발 허용"
 RULE_ALLOW_EDGY_FLAGS_BLOCKED_DESC: "논란이 될 수 있는 일부 깃발 옵션이 표시되지 않도록 합니다."
 RULE_ALLOW_EDGY_FLAGS_ALLOWED_DESC: "평소라면 검열되었을 논란의 여지가 있는 깃발 옵션을 허용합니다."
 RULE_SPREAD_INFLUENCE_AMOUNT_GAIN: "영향력 확장 획득량"
 RULE_SPREAD_INFLUENCE_AMOUNT_GAIN_DESC: "영향력 확산으로 얻는 영향력 양을 변경합니다."
 RULE_SPREAD_INFLUENCE_GAIN_0_5: "0.5%"
 RULE_SPREAD_INFLUENCE_GAIN_0_5_DESC: "영향력 확산 활동 1회당 0.5%의 영향력을 획득합니다. 영향력 획득 속도를 크게 늦추고 싶을 때 선택하십시오."
 RULE_SPREAD_INFLUENCE_GAIN_2: "2%"
 RULE_SPREAD_INFLUENCE_GAIN_2_DESC: "2% influence gained per spread action. For if you really want to ramp up influence gain."
 RULE_SPREAD_INFLUENCE_GAIN_4: "4%"
 RULE_SPREAD_INFLUENCE_GAIN_4_DESC: "영향력 확산 활동 1회당 4%의 영향력을 획득합니다. 영향력 획득 속도를 크게 높이고 싶을 때 선택하십시오."
 RULE_SPREAD_INFLUENCE_AMOUNT_COOLDOWN: "영향력 확장 재사용 대기"
 RULE_SPREAD_INFLUENCE_30_COOLDOWN: "30일"
 RULE_SPREAD_INFLUENCE_30_COOLDOWN_DESC: "기본 재사용 대기시간입니다. 30일마다 한 번씩 타국에 영향력을 확산할 수 있습니다."
 RULE_SPREAD_INFLUENCE_14_COOLDOWN: "14일"
 RULE_SPREAD_INFLUENCE_14_COOLDOWN_DESC: "14일마다 한 번씩 타국에 영향력을 확산할 수 있습니다."
 RULE_SPREAD_INFLUENCE_0_COOLDOWN: "재사용 대기시간 없음"
 RULE_SPREAD_INFLUENCE_0_COOLDOWN_DESC: "영향력 확산에 재사용 대기시간이 없습니다. 보유한 모든 §H정치력§!을 타국에 영향력을 행사하는 데 쏟아붓고 싶을 때 사용하십시오!"
 RULE_SPREAD_INFLUENCE_60_COOLDOWN: "60일"
 RULE_SPREAD_INFLUENCE_60_COOLDOWN_DESC: "60일마다 한 번씩 타국에 영향력을 확산할 수 있습니다."
 RULE_INVEST_INFLUENCE_AMOUNT_GAIN: "투자 시 영향력 획득량"
 RULE_INVEST_DEFAULT_GAIN_1: "1%"
 RULE_INVEST_DEFAULT_GAIN_1_DESC: "상대국이 투자를 수락할 때마다 1%의 영향력을 획득합니다."
 RULE_INVEST_DEFAULT_GAIN_0_5: "0.5%"
 RULE_INVEST_DEFAULT_GAIN_0_5_DESC: "상대국이 투자를 수락할 때마다 0.5%의 영향력을 획득합니다."
 RULE_INVEST_DEFAULT_GAIN_2: "2%"
 RULE_INVEST_DEFAULT_GAIN_2_DESC: "상대국이 투자를 수락할 때마다 2%의 영향력을 획득합니다."
