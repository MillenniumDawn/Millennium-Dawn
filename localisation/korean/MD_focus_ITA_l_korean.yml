 not_has_statalist_government_or_in_coalition_TT: "연립에 국가주의 정당이 없어야 합니다 \n 국가주의 정당 목록은 \\"유럽의 병자 중점\\"에서 확인하십시오"
 has_statalist_government_or_in_coalition_TT: "연립에 국가주의 정당이 있어야 합니다 \n 국가주의 정당 목록은 \\"유럽의 병자 중점\\"에서 확인하십시오"
 has_statalist_government_TT: "집권 정당이 국가주의 정당이어야 합니다 \n 국가주의 정당 목록은 \\"유럽의 병자 중점\\"에서 확인하십시오"
