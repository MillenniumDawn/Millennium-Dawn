 SOV_reforming_army_spetcnaz: "새로운 러시아 군대"
 SOV_reforming_army_mto: "새로운 러시아 군대"
 SOV_reforming_army_arta: "새로운 러시아 군대"
 SOV_reforming_army_mechanize: "새로운 러시아 군대"
 SOV_military_exercises_allied_resolve_idea: "동맹의 결의 훈련"
 SOV_disorg_in_army_idea: "Chaos in the Army"
 SOV_disorg_in_army_idea_desc: "러시아 정규군 외에도 국방부와 계약을 체결하지 않는 새로운 전투 부대들이 등장하고 있으며, 이는 군 지휘에 혼란을 초래합니다."
 SOV_disorg_in_army2_idea: "Chaos in the Army"
 SOV_disorg_in_army2_idea_desc: "러시아 정규군 외에도 국방부와 계약을 체결하지 않는 새로운 전투 부대들이 등장하고 있으며, 이는 군 지휘에 혼란을 초래합니다."
 SOV_idea_outer_politics: "러시아 외교 정책"
 SOV_idea_outer_politics1: "러시아 외교 정책"
 SOV_idea_governorate: "러시아로의 통합"
 SOV_idea_governorate_desc: "이 실체는 러시아로의 통합 과정을 겪고 있습니다. 머지않아 완전히 흡수될 것입니다."
 SOV_anti_lgbtqa_stance_idea: "성소주자에 부정적인 입장"
 SOV_anti_lgbtqa_stance_idea_desc: "우리 정부는 반 LGBT 입장을 채택했습니다."
 SOV_wagner_military_advisors: "와그너 민간군사기업 전문가"
 SOV_prepare_for_worst_idea: "최악에 상황에 대비하다"
 SOV_prepare_for_worst_idea_desc: "국가를 요새화하고 무장하기 위한 대대적인 노력이 한창 진행 중입니다."
 SOV_russian_airforce_idea_3: "£text_icon_sov_army 러시아 공군"
 SOV_russian_airforce_idea_3_desc: "Consolidating design and production under a single corporation has steadied the fleet, though the training pipeline is still thinner than the force it has to supply.\n§W--------------§!\nThis national spirit will be §Geased§! one step by the last remaining §HReorganize the Air Force§!, §HReforms in Structures§! or §HForm the UAC§! focus. It is §RRemoved§! entirely by the §HRussian Aerospace Forces§! focus."
 SOV_russian_airforce_idea_4: "£text_icon_sov_army 러시아 공군"
 SOV_russian_airforce_idea_4_desc: "Little is left of the old malaise beyond a training tempo that has yet to catch up with the rest of the force.\n§W--------------§!\nThis national spirit will be §RRemoved§! by the §HRussian Aerospace Forces§! focus."
 SOV_npp_anti_sanctions_exports: "§Y국가 프로젝트§!: 병행 수입"
 SOV_npp_anti_sanctions_construction: "§Y국가 프로젝트§!: 국산 건설"
 sov_communists.6.t: "재스탈린화"
 sov_communists.6.d: "흐루쇼프주의자들은 우리의 가장 위대한 지도자의 유산을 보존하지 못했습니다. 이를 바로잡을 때입니다. 스탈린과 소련의 과거를 기리는 뜻에서 도시 이름을 어디까지 바꿀지 결정해야 합니다."
 sov_communists.6.a: "역사적인 선택지를 유지한다."
 sov_communists.6.b: "완전한 스탈린주의로 나아가자!"
 SOV_Stalinodar: "스탈리노다르"
 SOV_Stalingrad: "스탈린그라드"
 SOV_Leningrad: "레닌그라드"
 SOV_Stalingrad_on_Neva: "네바강변의 스탈린그라드"
 SOV_Kalinin: "칼리닌"
 SOV_Gorky: "고리키"
 SOV_Stalinsk_on_Volga: "볼가강변의 스탈린스크"
 SOV_Kuybyshev: "쿠이비셰프"
 SOV_Stalinsk: "스탈린스크"
 SOV_Moscow: "모스크바"
 SOV_Novokuznetsk: "노보쿠즈네츠크"
 SOV_Saint_Petersburg: "상트페테르부르크"
 SOV_Novonikolaevsk: "볼고그라드"
 SOV_Ekaterinodar: "예카테리노다르"
 SOV_Stavropol_on_Volga: "볼가 강변의 스타브로폴"
 SOV_Bring_back_the_legacy_of_the_Russian_Empire: "러시아 제국의 유산을 되살리다."
 SOV_Bring_back_the_legacy_of_the_Russian_Empire_desc: "\n\n\n\n\n\n£SOV_desctext_empire \n\n\n\n\n\n\n\n\nIt is time to restore the historical names of Russian cities, honoring our heritage. This revival will reconnect us to our glorious past and inspire national pride across the nation."
 SOV_Former_Russian_capital: "구 러시아 수도"
 SOV_Former_Russian_capital_desc: "To reclaim Russia's heritage, we must make St. Petersburg our capital once again. This symbolic move will restore the city's historical status and reaffirm our commitment to tradition."
 sov_nationalists.7.t: "보호를 제안하는 §Y[SOV.GetNameWithFlag]§!"
 sov_nationalists.7.d: "러시아 정부는 외국의 침략으로부터 우리를 보호하겠다고 보장하는 일련의 협정에 서명할 것을 제안합니다. 이 안보 조약을 받아들이시겠습니까?"
 sov_nationalists.7.a: "러시아는 우리를 수호할 것이다!"
 sov_nationalists.7.b: "안된다"
 sov_nationalists.8.t: "동맹 가입을 제안하는 §Y[SOV.GetNameWithFlag]§!"
 sov_nationalists.8.d: "러시아 정부는 외부 위협으로부터 우리를 보호하기 위한 일련의 협정을 통해 동맹을 결성할 것을 제안합니다. 받아들이시겠습니까?"
 sov_nationalists.8.a: "러시아는 우리를 수호할 것이다!"
 sov_nationalists.8.b: "안된다"
 russia_med.2.t: "피칼료보로 향하는 푸틴"
 russia_med.2.d: "Amid a deep financial crisis, two of the town of Pikalyovo's three key industrial plants were shut down, leaving the workers jobless and desperate. Mass protests erupted, prompting government intervention. Putin personally visited the town, summoned the oligarchs involved, and demanded the factories be reopened, demonstrating his authority over Russia's economic elite."
 russia_med.2.a: "내 펜 돌려줘!"
 SOV_continue_etatist_rise: "국가주의적 부상 지속"
 SOV_continue_etatist_rise_desc: "러시아는 자원을 수출해 사익을 챙기는 제멋대로인 올리가르히 일족들에게 지배당할 여유가 없습니다. 우리에게는 확고한 지도력이 필요하며, 우리는 그것을 제공할 준비가 되어 있습니다."
 SOV_union_of_right_forces: "우파 연합"
 SOV_union_of_right_forces_desc: "이제 우리가 권력의 열쇠를 쥐게 됩니다. 우파 연합은 러시아를 민주적 가치와 시장 자유주의로 인도하는 것을 목표로 합니다. 노련한 개혁파 인사들과 명확한 의제를 바탕으로, 우리는 국가를 내부로부터 현대화해 나갈 것입니다."
 SOV_conservative_russia: "보수적인 러시아"
 SOV_conservative_russia_desc: "Global changes almost destroyed Russia again, it's time to return to peaceful reforms. A conservative course will help preserve traditional values, restore order, and stabilize our nation during uncertain times."
 SOV_tsar_boris: "차르 보리스"
 SOV_tsar_boris_desc: "Decades under Soviet rule deprived our people of spiritual balance and led Russia astray. Only a monarchy, even if symbolic, can return our nation to the righteous path. A restored monarchy will serve as a unifying cultural force in a fractured society."
 SOV_reform_constitution: "개헌"
 SOV_reform_constitution_desc: "Our constitution must be reformed in view of the return of the monarchy, albeit very limited. These changes will enshrine the monarchy's ceremonial role while preserving democratic institutions and rule of law."
 SOV_curb_corruption: "부패와의 전쟁"
 SOV_curb_corruption_desc: "Corrupt officials are the enemies of Russia. Rooting them out is essential to building trust in government and attracting investment. This effort will require sweeping reforms and firm political will."
 SOV_economical_liberalism: "경제적 자유주의"
 SOV_economical_liberalism_desc: "Free markets are the key to lifting Russia out of poverty. We should get the government out of the private sector and let businesses operate independently. Reducing bureaucracy and encouraging entrepreneurship will unleash the country's true economic potential."
 SOV_affirm_orthodoxy: "교회는 우리의 친구이다"
 SOV_affirm_orthodoxy_desc: "The years of state atheism under the Soviet Union distanced us from God. By reviving our churches and returning property taken from the clergy, we will begin the spiritual healing of our nation. The Orthodox Church will serve as a moral foundation in our national rebirth."
 SOV_russian_history_patr: "러시아의 역사 존중"
 SOV_russian_history_patr_desc: "It is impossible to follow the Soviet model of denigrating our imperial past. We must honor the full scope of Russian history, from the Tsars to the modern age. A strong future depends on understanding and respecting our heritage."
 SOV_joint_us_ventures: "Partnership with the USA"
 SOV_joint_us_ventures_desc: "We will allow the United States to establish military bases on our territory and support joint economic ventures. This will strengthen diplomatic ties, modernize our economy, and increase our influence on the global stage."
 SOV_iron_guard_militarism: "철위대"
 SOV_iron_guard_militarism_desc: "We will create a special unit, the Iron Guard. They will serve as the royal elite, responsible for protecting the monarchy, conducting sensitive missions, and leading from the front. Their loyalty and training will make them a symbol of the new era."
 SOV_laying_the_bricks: "벽돌 하나하나로 멋진 국가를 건설하다"
 SOV_laying_the_bricks_desc: "Every step we take, like a brick in the construction of a house, brings us closer to building a Great Russia. Progress will come gradually, through patience, vision, and hard work. This is the foundation of our national revival."
 SOV_new_russia: "새로운 러시아"
 SOV_new_russia_desc: "It is time for Russia to choose a new direction, a path it has been moving toward for centuries."
 SOV_release_prisoners: "Release the Political Prisoners"
 SOV_release_prisoners_desc: "Political prisoners have no place in our beautiful country. We must grant them their freedom."
 SOV_true_federalism: "진정한 연방주의"
 SOV_true_federalism_desc: "It's time to end the false federalism imposed in the 1990s. We will restore true autonomy to the regions."
 SOV_rework_constituion: "Constitutional Democratic Referendum"
 SOV_rework_constituion_desc: "We will undertake a comprehensive reform of the constitution, focusing especially on the rights and interactions of the federal subjects."
 SOV_referendum_start: "Referendum of the Subjects of Russia"
 SOV_referendum_start_desc: "Each federal subject will hold its own referendum to decide whether to remain part of Russia or become independent."
 SOV_return_arms_subject: "Return the Subjects by Force"
 SOV_return_arms_subject_desc: "We do not recognize their desire to secede and will use force to bring them back."
 SOV_subject_guarantee: "Guarantee the Independence"
 SOV_subject_guarantee_desc: "We will respect their independence and even guarantee it formally."
 SOV_usr: "러시아 합중국"
 SOV_usr_desc: "Inspired by the success of the USA, we will reform our system to resemble theirs more closely."
 SOV_new_establishment: "새로운 확립"
 SOV_new_establishment_desc: "New republics will require fresh leadership to defend their interests within the Russian state."
 SOV_like_usa_weapon: "무기에 대한 자유로운 접근"
 SOV_like_usa_weapon_desc: "Long live the freedom of arms! We will establish policies that allow citizens to exercise their right to bear arms, inspired by the American model. This will empower individuals and reinforce the idea of liberty and self-reliance."
 SOV_our_own_section_230: "제230조"
 SOV_our_own_section_230_desc: "We apply the practice of Section 230 in our legislation. By protecting online platforms from liability for user-generated content, we encourage a freer and more open internet. Innovation thrives when speech is protected."
 SOV_karabakh_question_desc: "It's time to deal with this. The Artsakh conflict continues to be a source of instability in the region. Russia must take a clear and principled stance to bring lasting peace."
 SOV_georgia_question: "조지아 문제"
 SOV_georgia_question_desc: "It's time to deal with this. Relations with Georgia have been tense, and unresolved territorial issues linger. A long-term strategy must be developed to resolve the conflict and stabilize the Caucasus."
 SOV_first_bars_start_desc: "쿠반 영토에서 코사크 지원병으로 편성되었습니다."
 SOV_four_bars_start: "§YBARS 4, 5§! 및 §Y7§!"
 SOV_six_bars_start: "§YBARS 6§! - '포르슈타트'"
 SOV_eight_bars_start: "§YBARS 8§! - 루스"
 SOV_nine_bars_start: "§YBARS 9, 10, 11§! 및 §Y12§!"
 SOV_thirdteen_bars_start: "§YBARS 13§! - 루스키 미르"
 SOV_fiveteen_bars_start: "§YBARS 15§! - 예르마크"
 SOV_eighteen_bars_start: "§YBARS 18§! - 빔펠"
 SOV_eighteen_bars_start_desc: "돈 군 소속 코사크와 로스토프 지역 주민들로 편성되었습니다"
 SOV_thirty_two_bars_start: "§YBARS 32§! - P. A. 수도플라토프 기념 지원병 대대"
 SOV_malorossia_flag: "말로로시야 프로젝트가 자금을 지원받았다"
 SOV_vitebsk_flag: "비텝스크 프로젝트가 자금을 지원받았다"
 SOV_friend_assad: "아사드는 떠나서는 안 된다"
 SOV_friend_assad_desc: "시리아는 우리에게 필수적인 동맹입니다. 이 지역에서 우리의 이익을 지키기 위해 아사드 정권이 안정을 유지하도록 해야 합니다."
 sov_other.22.t: "우리의 야포 구매를 제안하는 러시아"
 sov_other.22.d: "러시아는 다량의 우리 야포 체계를 구매하겠다는 수익성 높은 제안을 했습니다. 그 자금은 우리 경제에 상당한 활력이 될 것입니다."
 sov_other.22.a: "좋은 제안이야!"
 sov_other.22.b: "We refuse."
 sov_other.23.t: "북한과의 거래"
 sov_other.23.d: "북한은 우리에게 다량의 야포 체계를 공급하기로 동의하여 우리의 군사 역량을 강화해 주었습니다."
 sov_other.23.a: "좋은 제안이야!"
 sov_other.24.t: "북한과의 거래"
 sov_other.24.d: "북한은 야포를 공급해 달라는 우리의 제안을 거절했습니다. 안타깝게도 이는 또 하나의 실망입니다."
 sov_other.24.a: "Unfortunate."
 sov_other.25.t: "북한과의 거래"
 sov_other.25.d: "러시아는 북한과 야포 체계를 구매하는 거래를 체결했으며, 그중 일부가 우리에게 배정되었습니다."
 sov_other.25.a: "Good."
 sov_other.32.t: "우리 공화국의 지위에 관한 국민투표"
 sov_other.32.d: "러시아의 헌법 개혁으로 우리는 새로운 지위를 선택할 수 있게 되었습니다. 러시아의 일부로 남거나 독립을 선언하는 것입니다. 우리는 이 결정을 내릴 준비가 되었습니까?"
 sov_other.32.a: "우리는 러시아의 일부로 남을 것이다."
 sov_other.32.b: "우리는 독립을 지지한다."
 sov_other.33.t: "우리와 함께 남는 그들"
 sov_other.33.d: "[FROM.GetNameWithFlag]은(는) 러시아의 일부로 남기로 결정했습니다."
 sov_other.33.a: "만세!"
 sov_other.34.t: "또다른 공화국이 우리를 떠나다"
 sov_other.34.d: "[FROM.GetNameWithFlag] has decided to leave our country. We respect their decision."
 sov_other.34.a: "Unfortunate"
 sov_other.35.t: "국가 두마에서 발언을 요청하는 전직 장군"
 sov_other.35.d: "지금은 해체된 우주군의 전직 장군이 다음 국가 두마 회기에서 발언하게 해 달라고 요청했습니다. 그는 망상적이고 어쩌면 조현병적인 사상을 품고 있으며, 이를 널리 퍼뜨리려 한다고 알려졌습니다."
 sov_other.35.a: "그래도 발언하게 허락하자."
 sov_other.35.b: "그를 무시한다"
 sov_other.36.t: "인기를 얻는 퇴역 장군의 사상"
 sov_other.36.d: "페트로프 장군의 논란 많은 사상이 특히 군 내부에서 전례 없는 지지를 얻고 있습니다. 이러한 추세는 우리의 안정에 깊은 우려를 불러일으킵니다."
 sov_other.36.a: "Do nothing."
 sov_other.36.b: "장군과 그의 충성스러운 추종자들을 체포한다"
 sov_other.37.t: "쿠데타를 일으키는 장군!"
 sov_other.37.d: "어떻게 이를 놓쳤단 말입니까? 페트로프 장군이 군사 쿠데타를 일으켜 정부를 전복했습니다. 그는 저항 없이 크렘린에 입성했습니다."
 sov_other.37.a: "이건 재앙이다"
 sov_other.38.t: "새로운 중앙은행 총재"
 sov_other.38.d: "우리는 엘비라 나비울리나를 새로운 중앙은행 총재로 임명할 준비가 되어 있습니다. 경제부 장관으로서 능력을 입증한 그녀의 지도력이 우리 경제에 긍정적인 영향을 미칠 것으로 기대됩니다."
 sov_other.38.a: "축하해 준다"
 SOV_unite_with_nkpr: "북한과의 거래"
 SOV_unite_with_nkpr_desc: "우리는 북한에 비축분을 보충하기 위해 그들의 야포를 대량으로 구매하는 거래를 제안할 것입니다."
 sov_final_strike.1.t: "군사 작전 선언"
 sov_final_strike.1.d: "오늘 이른 아침, 우리 대통령은 탈나치화와 비무장화를 목표로 하는 우크라이나에서의 특별 작전 개시를 발표했습니다. 전면 침공이 임박했으며, 이는 분쟁의 심각한 확대를 의미합니다."
 sov_final_strike.1.a: "이것은 심각한 결과를 초래할 것이다"
 russia_news.11.t: "군사 작전을 선언한 러시아!"
 russia_news.11.d: "오늘 러시아 대통령은 우크라이나에서의 군사 작전을 발표했습니다. 내세운 목표는 완전한 탈나치화와 비무장화입니다. 러시아 국방부는 이 작전이 군사 시설만을 겨냥한다고 주장하지만, 서방 지도자들은 이미 키이우에 대한 지원을 약속했습니다."
 russia_news.11.o1: "전진!"
 russia_news.11.o2: "우리는 러시아를 지지할 것이다!"
 russia_news.11.o3: "우리는 우크라이나를 지지할 것이다!"
 russia_news.11.o4: "Cursed Russians."
 russia_news.11.o5: "연방의 폐허 위에서 벌어지는 또 한 번의 전쟁."
 sov_final_strike.2.t: "주요 목표 달성에 실패한 군"
 sov_final_strike.2.d: "진행 중인 작전은 주로 우리 방위군 내의 만연한 부패로 인해 목표에 미치지 못했습니다. 이 실패는 우리 군사 역량의 진정한 상태를 드러냅니다."
 sov_final_strike.2.a: "장기전에 대비한다."
 SOV_slow_advance_idea: "준비가 부족한 군대"
 sov_final_strike.3.t: "주요 목표 달성에 성공한 군"
 sov_final_strike.3.d: "진행 중인 작전은 순조롭게 진행되고 있으며, 이는 최근의 개혁과 성공적인 반부패 운동 덕분에 우리 군의 높은 질을 보여 줍니다."
 sov_final_strike.3.a: "훌륭하군."
 sov_final_strike.4.t: "러시아 제재"
 sov_final_strike.4.a: "Impose industrial sanctions."
 sov_final_strike.4.b: "We will not take part in this."
 sov_final_strike.4.d: "우크라이나에서의 분쟁은 끝나야 합니다. 경제 제재를 통해 러시아를 무력화하려 할 수 있으나, 이는 우리 경제에도 해가 될 수 있습니다. 전면적인 제재 전쟁을 준비해야 할까요?"
 sov_final_strike.5.t: "우리에게 제재를 가한 [FROM.GetName]!"
 sov_final_strike.5.d: "[FROM.GetName]은(는) 우크라이나를 지원하기 위해 우리에게 제재를 가했습니다. 이러한 조치는 우리 경제에 심각한 피해를 줄 수 있습니다."
 sov_final_strike.5.a: "그들을 저주한다."
 sov_final_strike.6.t: "우크라이나 특별 군사 작전 참여를 제안하는 러시아!"
 sov_final_strike.6.d: "러시아 대통령은 개인적인 회담에서 우리를 우크라이나에서의 특별 군사 작전에 참여하도록 초청했습니다. 전쟁에 뛰어드는 것은 오래도록 지속될 결과를 낳을 것이므로 이 제안을 신중히 검토해야 합니다."
 sov_final_strike.6.a: "우리는 형제들을 도울 것이다!"
 sov_final_strike.6.b: "우리는 개입해서는 안 된다고 생각한다."
 sov_final_strike.7.t: "제재 이후의 금융 붕괴"
 sov_final_strike.7.d: "서방의 제재는 우리 국민들 사이에 심각한 금융 공황을 일으켜 루블의 수요와 공급에 위험한 불균형을 초래했습니다. 이 위기를 완화할 수 있었던 국가복지기금의 붕괴는 상황을 악화시킵니다. 우리는 이제 임박한 금융 붕괴에 직면해 있습니다."
 sov_final_strike.7.a: "신이시여, 우리를 도우소서..."
 SOV_western_sanctions_modifier: "서방의 제재"
 SOV_western_sanctions_modifier_desc: "우리의 공격적인 행동으로 서방 국가들과 그 동맹국들이 우리에게 가혹한 제재를 가했습니다. 이는 심각한 경고이며, 우리는 그들로부터의 더 큰 위협에 대비해야 합니다."
 SOV_ruble_collapse: "경제 붕괴"
 SOV_ruble_collapse_1: "금융 위기"
 SOV_ruble_collapse_2: "침체"
 SOV_sanction_backfire_idea_harsh: "제재로 인한 중간 정도의 피해"
 SOV_sanctions_warning_TT: "§Y이 결정§!은 §R심각한§! 경제적 결과를 초래할 것입니다."
 SOV_sanctions_eras_TT: "제재의 영향이 우리에게는 §G감소§!합니다."
 SOV_western_sanctions: "Sanctions imposed against us"
 SOV_russian_resistance_economy: "러시아 저항 경제"
 SOV_russian_resistance_economy_desc: "서방의 극심한 경제 전쟁에 직면한 우리의 유일한 선택은 회복력 있고 자급자족하는 경제, 즉 진정한 저항 경제를 구축하는 것입니다."
 SOV_fnb_destroyed: "국가복지기금 파괴"
 SOV_fnb_destroyed_desc: "국가복지기금의 자원은 제재의 영향을 완화하는 데 매우 중요합니다."
 SOV_prevent_panic_on_currency_exchange: "증시의 공황을 진정시켜라"
 SOV_prevent_panic_on_currency_exchange_desc: "주식, 선물, 채권 시장이 대중의 공황을 일으켰습니다. 사람들은 계좌에서 외화를 인출하려고 몰려들고 있습니다. 이를 막아야 합니다."
 SOV_stop_moex_sessions: "모스크바 증권거래소 일시 폐쇄"
 SOV_stop_moex_sessions_desc: "시장을 일시적으로 폐쇄하면 최근의 혼란 이후 시장을 진정시키는 데 도움이 될 것입니다."
 SOV_prevent_ruble_collapse: "루블의 붕괴를 막아라"
 SOV_prevent_ruble_collapse_desc: "붕괴를 막으려면 루블의 환율을 통제하는 것이 필수적입니다."
 SOV_stabilized_finances: "Stabilize the Economy"
 SOV_stabilized_finances_desc: "우리는 공황의 최악의 시기를 극복했습니다. 이제 서서히 경제를 안정시킬 때입니다."
 SOV_expansion_of_importozamesheniye: "수입 대체 확립"
 SOV_expansion_of_importozamesheniye_desc: "국내 산업을 발전시키고 수입 의존도를 줄일 때입니다."
 SOV_add_liquidity: "경제에 유동성 공급"
 SOV_add_liquidity_desc: "우리 경제가 계속 작동하려면 유동성 공급이 시급히 필요합니다."
 SOV_consumer_goods_replacement: "국내 브랜드"
 SOV_consumer_goods_replacement_desc: "우리에게 외국 제품은 필요 없습니다. 우리에게는 품질 좋은 국산 브랜드가 있습니다."
 SOV_the_turn_to_the_east: "동방으로의 유턴"
 SOV_the_turn_to_the_east_desc: "서방은 믿을 수 없는 파트너임이 입증되었습니다. 이제 우리의 초점을 동쪽으로 옮길 때입니다."
 SOV_creation_of_sovereign_economy: "독립 경제"
 SOV_creation_of_sovereign_economy_desc: "우리 국가는 외세의 영향에서 벗어난 주권적이고 독립적인 경제를 건설할 것입니다."
 SOV_back_to_growth: "그리고 다시 성장으로"
 SOV_back_to_growth_desc: "그 무엇도 우리를 오래 막을 수 없습니다. 어떤 차질도 우리를 일시적으로 늦출 뿐입니다."
 SOV_help_prigoba: "사헬에 장비 지원"
 SOV_help_prigoba_desc: "사헬 지역의 우리 대리국은 긴급한 군사 지원을 필요로 합니다."
