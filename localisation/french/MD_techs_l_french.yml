 module_naval_mineclearing_drone: "Drone de déminage"
 module_naval_mineclearing_drone_desc: "Les drones de dragage sans équipage éloignent des équipages la part la plus dangereuse des opérations littorales, utilisant des véhicules téléopérés ou semi-autonomes pour détecter, classer et neutraliser les mines navales devant la flotte.\n\n§GIndice du concepteur : les drones de dragage offrent un dragage très élevé avec un petit bonus de détection de sous-marins et une moindre consommation de carburant que le matériel conventionnel. Conviennent aux dragueurs spécialisés, mais coûtent plus de CI et exigent des puces.§!\n§GIndice concepteur : les drones de dragage offrent un dragage très élevé avec un petit bonus de détection sous-marine et une consommation de carburant inférieure au matériel de dragage conventionnel. Ils conviennent aux dragueurs spécialisés, mais coûtent plus de CI et exigent des microprocesseurs.§!"
