 attack_helicopter_6: "공격 헬리콥터 2055"
 attack_helicopter_6_desc: "공격 헬리콥터는 공격용 무기를 장착한 군용 헬리콥터입니다. 주 무장은 속사 자동 화기(기관포와 기관총), 로켓 발사기, 정밀 유도 무기(미사일)입니다. 많은 공격 헬리콥터는 대공 미사일도 장착할 수 있으나 주로 자기 방어용으로 사용됩니다. 오늘날의 공격 헬리콥터는 기능 면에서 고정익 공격기와 유사하며, 보병, 장갑 차량, 건물 등 지상 표적을 공격하도록 특별히 설계되었습니다."
 attack_helicopter_7: "공격 헬리콥터 2075"
 attack_helicopter_7_desc: "공격 헬리콥터는 공격용 무기를 장착한 군용 헬리콥터입니다. 주 무장은 속사 자동 화기(기관포와 기관총), 로켓 발사기, 정밀 유도 무기(미사일)입니다. 많은 공격 헬리콥터는 대공 미사일도 장착할 수 있으나 주로 자기 방어용으로 사용됩니다. 오늘날의 공격 헬리콥터는 기능 면에서 고정익 공격기와 유사하며, 보병, 장갑 차량, 건물 등 지상 표적을 공격하도록 특별히 설계되었습니다."
