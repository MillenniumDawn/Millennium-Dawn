l_english:
  #Tooltips
 Nepali_Congress_wins_tt: "The Nepali Congress will become the ruling party."
 Communist_Party_of_Nepal_wins_tt: "The Communist Party of Nepal (Maoist) will become the ruling party."
 NEP_guerrilla_conflict: "Guerrilla Conflict"
 nep_civil_war_info_tt: "Both sides are entrenched in their respective zones. The Maoists control vast swathes of the countryside, while the government holds the major cities and towns. Neither side has gained a decisive advantage after years of fighting."
  #Events
 nepal.1.t: "The 2008 Nepalese Election"
 nepal.1.d: "After a decade of civil war, Nepal held Constituent Assembly elections on 10 April 2008. The Nepali Congress and the Communist Party of Nepal (Maoist) emerged as the two largest blocs, tasked with drafting a new constitution."
 nepal.1.a: "Back the Nepali Congress"
 nepal.1.b: "Back the Communist Party of Nepal (Maoist)"
 news.87.t: "Nepalese Civil War Ends"
 news.87.d: "Prime Minister Girija Prasad Koirala and Maoist Chairman Prachanda have signed the Comprehensive Peace Accord, ending the decade-long Nepalese Civil War. After years of bloodshed that ravaged the country, the government and the Maoists have agreed to disarm and draft a new constitution. Reconciliation and reconstruction will require concerted effort from the government, civil society, and the international community."
 news.87.a: "Interesting"
 news.88.t: "Maoists Claim Victory in Nepal"
 news.88.d: "Maoist forces have captured the last government stronghold, bringing an end to years of war in Nepal. The fall of the Kingdom marks a turning point. While the victory is decisive, concerns remain that the revolution could spill over into neighboring nations, and the international community has called for a peaceful settlement."
 news.88.a: "Interesting"
 news.89.t: "Maoist Forces Crushed"
 news.89.d: "Pro-monarchist forces have driven the last Maoist fighters from the country and secured all remaining strongholds, ending the long insurgency. Nepal can now begin rebuilding its economy and infrastructure. With stability restored and international support, the country has a chance to emerge from this dark chapter as a stronger, more resilient nation."
 news.89.a: "Interesting"
 news.90.t: "Massacre of the Nepalese Royal Family"
 news.90.d: "King Birendra and much of the royal family were killed in a massacre at Narayanhiti Palace on 1 June 2001. Officially attributed to Crown Prince Dipendra, the killings ended the 240-year Shah dynasty and plunged the country into turmoil."
 news.90.a: "Interesting"
  #Ideas
 NEP_Himalayan_Rebellion_Struggle: "Himalayan Rebellion Struggle"
 NEP_Himalayan_Rebellion_Struggle_desc: "Maoist forces persist despite government counterattacks in the civil war. Strategic patience and careful planning will determine the revolution's course."
 NEP_National_Unity_Campaign: "National Unity Campaign"
 NEP_National_Unity_Campaign_desc: "Achieving peace in Nepal requires defeating the Communist forces that have been jeopardizing our interests for years."
 NEP_The_National_vendetta: "The National Vendetta"
 NEP_The_National_vendetta_desc: "After the murder of the royal family, the nation has lost its sense of purpose. Many now rally in the name of the Shahs and their anti-radical legacy."
