l_russian:
 balkan_news.1.t: "Караджич осужден за геноцид"
 balkan_news.1.d: "Гаагский трибунал признал Радована Караджича виновным в геноциде в Сребренице и в преступлениях против человечности на территории Боснии и приговорил его к сорока годам лишения свободы. Спустя двадцать лет после подписания Дейтонского соглашения лидер боснийских сербов, правивший во время войны, был осужден судом, который был создан именно благодаря той войне, которую он развязал."
 balkan_news.1.a: "В Сараево огласили приговор"
 balkan_news.1.b: "Некоторые говорят, что это приговор всем сербам."
 balkan_news.1.c: "Правосудие, отложенное"
 balkan_news.2.t: "Пожизненное заключение для Караджича"
 balkan_news.2.d: "Апелляционная палата отклонила апелляцию Радована Караджича и повысила его приговор до пожизненного заключения, признав первоначальный сорокалетний срок недостаточным для тяжести его преступлений. Это окончательное решение по делу человека, который руководил Республикой Сербской во время войны."
 balkan_news.2.a: "Гаага закрывает дело."
 balkan_news.3.t: "Младич осужден за геноцид"
 balkan_news.3.d: "Трибунал признал Ратко Младича виновным в геноциде, военных преступлениях и преступлениях против человечности и приговорил его к пожизненному заключению. Бывший генерал кричал на судей, и его пришлось вывести из зала суда до окончания оглашения приговора. В Сребренице матери погибших молча наблюдали за происходящим."
 balkan_news.3.a: "Наконец, общие ответы."
 balkan_news.4.t: "Самоубийство в зале суда"
 balkan_news.4.d: "Сразу же после того, как судьи оставили в силе приговор к двадцати годам лишения свободы, боснийско-хорватский генерал Слободан Праляк заявил, что он не является военным преступником, и выпил пузырек с ядом на глазах у телекамер. Он скончался в течение нескольких часов. Апелляционная палата подтвердила обвинительные приговоры всем шестерым бывшим лидерам Боснии и Герцеговины, установив факт существования преступного сообщества, влияние которого простиралось до Загреба."
 balkan_news.4.a: "Он отверг решение суда"
 balkan_news.4.b: "Мрачный финал последнего дела трибунала"
 balkan_news.5.t: "Апелляция Младича отклонена"
 balkan_news.5.d: "Судьи Организации Объединенных Наций оставили в силе приговор Ратко Младичу за геноцид и пожизненное заключение, тем самым завершив последнее крупное судебное разбирательство, связанное с боснийской войной. Спустя четверть века после событий в Сребренице судебное расследование последствий войны завершено. Политическое расследование же продолжается."
 balkan_news.5.a: "Архив закрывается"
 CRO_nat_populism_gain_tt: "§RПравые националисты набирают популярность.§!"
 balkan_news.6.t: "Сербская всемирная декларация"
 balkan_news.6.d: "Белград и Баня-Лука совместно приняли тринадцатистраничную декларацию об объединении сербских земель в рамках постоянного Высшего совета по сотрудничеству между Сербией и Республикой Сербской. Этот документ не обладает юридической силой, но содержит четкие намерения."
 balkan_news.6.a: "Достойный покровитель"
 balkan_news.6.b: "Авторитет Сараево продолжает ослабевать"
 balkan_news.6.c: "Новости от соседей"
 balkan_news.7.t: "СЕС повышает ставки"
 balkan_news.7.d: "Спустя несколько дней после того, как российские танки вторглись на территорию Украины, ЕС примерно вдвое увеличил численность гарнизона СЕС «Алтея» в Боснии и Герцеговине, перебросив туда резервные войска в качестве меры предосторожности против распространения нестабильности."
 balkan_news.7.a: "Обнадеживающая демонстрация решимости"
 balkan_news.7.b: "Меры предосторожности, принятые в других местах"
 balkan_news.8.t: "Эрдоган выступил с предвыборной речью в Сараево"
 balkan_news.8.d: "Поскольку Эрдогану запретили проводить предвыборную агитацию в странах Западной Европы, он провёл свой единственный предвыборный митинг в Европе в Сараево, собрав тысячи людей и встретившись с Бакиром Изетбеговичем из СДА. Додик называет это вмешательством."
 balkan_news.8.a: "Друг, на которого Сараево может положиться"
 balkan_news.8.b: "Предвыборный митинг в чужой стране"
 balkan_news.9.t: "Визит Лаврова в Сараево"
 balkan_news.9.d: "Сергей Лавров посетил Сараево, где его в аэропорту встретил только Додик. По этому случаю не был поднят ни один боснийский флаг. Он уехал, увез с собой многовековую православную икону, происхождение которой восходит к Луганску — подарок, по поводу которого Киев требует объяснений."
 balkan_news.9.a: "Собственная внешняя политика Республики Сербской"
 balkan_news.9.b: "Обычный визит"