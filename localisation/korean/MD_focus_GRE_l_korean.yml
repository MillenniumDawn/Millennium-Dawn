 GRE_unify_cyp: "§G북키프로스와 남키프로스가 그리스로 통일됩니다!§!"
 TUR_unify_cyprus: "키프로스 통일"
 GRE_unify_cyprus: "키프로스 통일"
 GRE_enemy_blocked_us: "§R이 결정들을 이용할 수 없다면, 적이 일시적으로 우리의 세력 확대를 막았거나 다른 요건을 충족하지 못한 것입니다!§! (차단 남은 일수: [?TUR_greece_blocked_us:days_left|R0])"
