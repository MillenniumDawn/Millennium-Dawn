 nsb_artillery_ammo_5: "Munitions d'artillerie de 5e génération"
 nsb_artillery_ammo_5_desc: "Munitions spécialisées conçues pour être utilisées dans des armes de gros calibre telles que les obusiers, les canons de campagne et l'artillerie automotrice. Elles sont de différents types, chacun adapté à des rôles spécifiques sur le champ de bataille, notamment les munitions à forte explosion pour un impact destructeur, les obus perforants pour pénétrer les cibles fortifiées et les munitions fumigènes ou d'éclairage pour le soutien tactique."
 nsb_special_ammo_1: "Basic Ordnance Upgrade"
 nsb_special_ammo_1_desc: "Introduces improvements to conventional munitions, refining shell designs and increasing explosive efficiency."
 nsb_special_ammo_2: "Enhanced Munitions Development"
 nsb_special_ammo_2_desc: "Enhanced explosive yields, and optimized aerodynamic designs. Advancements in propulsion systems and detonation mechanisms increase range, accuracy, and overall effectiveness, ensuring superior battlefield performance against a variety of targets."
 nsb_special_ammo_3: "Advanced Warhead Systems"
 nsb_special_ammo_3_desc: "Specialized warhead technologies designed to maximize impact across different combat scenarios. Innovations in blast efficiency, penetration capabilities, and adaptive fuzing enhance both direct-fire and area-effect applications, significantly improving lethality and operational flexibility."
 nsb_barrel_conversions: "Conversion de canon de première génération"
 nsb_barrel_conversions_desc: "La conversion de canon de première génération représente une première étape dans l'amélioration de la puissance de feu de l'artillerie en modifiant les conceptions de canons existantes pour améliorer les performances balistiques. Cette mise à niveau augmente la durabilité du canon, améliore la vitesse du projectile et étend la portée de tir efficace, permettant un bombardement plus cohérent et fiable. En affinant les techniques de rayures et en renforçant les matériaux du canon, cette conversion améliore la précision et l'efficacité globale, jetant les bases de développements d'artillerie plus avancés. Bien que toujours limitée par les contraintes de fabrication de première génération, cette amélioration marque un bond en avant significatif dans l'efficacité de l'artillerie sur le champ de bataille."
 nsb_fire_modes_1: "Doctrine de barrage standard"
 nsb_fire_modes_1_desc: "La doctrine de barrage standard établit une approche fondamentale de la guerre d'artillerie, axée sur des missions de tir coordonnées et planifiées à l'avance pour affaiblir les positions ennemies avant un assaut. Cette doctrine repose sur des schémas de tir calculés pour perturber les formations ennemies, détruire les structures défensives et créer des opportunités pour les forces qui avancent. En maintenant un équilibre entre la puissance de feu et la précision, elle garantit une suppression efficace du champ de bataille sans dépense excessive de munitions. Bien que moins intense que les tactiques de tir de saturation, la doctrine de barrage standard reste une méthode polyvalente et fiable pour fournir un soutien de tir soutenu dans les opérations offensives et défensives."
 nsb_fire_modes_2: "Doctrine de tir soutenu"
 nsb_fire_modes_2_desc: "La doctrine de tir soutenu met l'accent sur le bombardement d'artillerie continu et méthodique pour maintenir la pression sur les forces ennemies pendant de longues périodes. En assurant un flux constant de puissance de feu, cette doctrine perturbe les mouvements ennemis, supprime les contre-attaques et affaiblit les positions défensives grâce à un engagement prolongé. Conçue pour la guerre d'usure, elle maximise l'efficacité logistique en équilibrant la cadence de tir et la conservation des munitions, permettant aux unités d'artillerie de maintenir leur efficacité au combat tout au long des opérations prolongées. Bien que n'étant pas aussi immédiatement accablant que les tactiques de tir de masse, le tir soutenu assure le contrôle du champ de bataille en dégradant progressivement les forces et le moral de l'ennemi."
 nsb_fire_modes_3: "Doctrine de soutien de tir supérieur"
 nsb_fire_modes_3_desc: "La doctrine de tir de masse se concentre sur l'écrasement des positions ennemies avec des barrages d'artillerie soutenus et à grande échelle. En privilégiant le volume de tir plutôt que la précision, cette doctrine assure la domination du champ de bataille grâce à un bombardement incessant, en supprimant les forces ennemies, en détruisant les fortifications et en créant des effets de zone dévastateurs. Les missions de tir coordonnées permettent à plusieurs unités d'artillerie de saturer des zones désignées, forçant les ennemis à adopter des positions défensives et limitant leur mobilité. Bien que gourmande en ressources, cette doctrine est très efficace dans les engagements prolongés et la guerre à grande échelle, assurant une suprématie de la puissance de feu."
 nsb_AA_autocannon_1: "Post-War Autocannon Development"
 nsb_AA_autocannon_1_desc: "This development focuses on refining autocannons for both ground and anti-aircraft applications. Improvements in fire rate, ammunition efficiency, and barrel durability allow for more effective suppression of infantry, vehicles, and aerial threats. With the integration of enhanced ballistic engineering, these new-generation autocannons offer superior reliability and lethality on the battlefield."
 nsb_AA_autocannon_2: "Cold-War Autocannon Development"
 nsb_AA_autocannon_2_desc: "As military technology advanced during the Cold War, the development of modern autocannons became a priority for both ground and aerial combat. This advancement introduces refined designs with improved recoil management, higher rates of fire, and better heat dissipation, allowing for sustained engagements. Enhanced targeting systems and upgraded ammunition further increase their effectiveness against armored vehicles, infantry, and low-flying aircraft. These innovations mark a significant leap in firepower, ensuring superior battlefield performance in rapidly evolving combat scenarios."
 nsb_AA_autocannon_3: "Modern Autocannon Development"
 nsb_AA_autocannon_3_desc: "Building upon Cold War-era advancements, modern autocannon development focuses on high-precision, rapid-fire weaponry capable of engaging a wide range of threats. These next-generation autocannons feature advanced recoil compensation, increased durability, and integration with smart targeting systems. Ammunition improvements, including programmable airburst rounds and armor-piercing munitions, further enhance their versatility. With superior accuracy, sustained fire capability, and adaptability across multiple platforms, these weapons form the backbone of modern infantry fighting vehicles, aircraft, and naval systems."
 nsb_AA_autocannon_4: "Advanced Autocannon Development"
 nsb_AA_autocannon_4_desc: "Pushing the limits of firepower, Advanced Autocannon Development introduces state-of-the-art weapon systems designed for superior lethality, precision, and adaptability. These next-generation autocannons feature automated fire-control systems, integrated AI-assisted targeting, and multi-role capabilities, allowing for effective engagement against infantry, armor, aircraft, and drones. Advances in electromagnetic propulsion, high-energy munitions, and adaptive ammunition types ensure unparalleled performance. With reduced recoil, higher sustained rates of fire, and seamless integration with digital warfare networks, these weapons redefine battlefield supremacy."
 nsb_SHORAD_missile_1: "Post-War Missile Development"
 nsb_SHORAD_missile_1_desc: "Advancements in missile technology following World War II led to the development of more sophisticated short-range and long-range guided missile systems. This research introduces improved propulsion systems, enhanced targeting mechanisms, and increased warhead effectiveness, allowing for greater precision and lethality. Short-range missiles provide quick-response tactical firepower, while long-range missiles extend engagement capabilities, enabling strikes on distant targets with high accuracy. These innovations mark the beginning of modern missile warfare, shaping future air, ground, and naval engagements."
 nsb_SHORAD_missile_2: "Cold-War Missile Development"
 nsb_SHORAD_missile_2_desc: "The Cold War era saw rapid advancements in missile technology, leading to the creation of more precise, powerful, and versatile missile systems. This development enhances both short-range and long-range missile capabilities, improving guidance systems, propulsion efficiency, and warhead effectiveness. Short-range missiles provide tactical strike options for immediate battlefield impact, while long-range missiles enable strategic engagements, deep strikes, and deterrence operations. These advancements lay the foundation for modern missile warfare, increasing both offensive and defensive capabilities across multiple military platforms."
 nsb_SHORAD_missile_3: "Modern Missile Development"
 nsb_SHORAD_missile_3_desc: "Modern missile development focuses on enhancing accuracy, speed, and adaptability across various engagement ranges. This advancement integrates advanced guidance systems, multi-stage propulsion, and modular warheads, allowing missiles to perform effectively in air-to-air, ground-to-ground, and naval warfare scenarios. Short-range missiles now feature fire-and-forget capabilities, improved maneuverability, and enhanced target acquisition, while long-range missiles incorporate stealth technology, precision strike capabilities, and networked targeting for superior effectiveness. These advancements provide modern forces with unmatched firepower, rapid response capabilities, and strategic superiority on the battlefield."
 nsb_SHORAD_missile_4: "Advanced Missile Systems"
 nsb_SHORAD_missile_4_desc: "Pushing the limits of modern warfare, Advanced Missile Systems integrate cutting-edge technology to enhance speed, precision, and adaptability across multiple combat scenarios. These next-generation missiles feature hypersonic propulsion, AI-assisted targeting, and multi-role modular warheads, allowing them to engage ground, air, and naval targets with unprecedented accuracy and efficiency. With the ability to perform mid-flight course corrections, electronic countermeasure resistance, and networked battlefield integration, these missiles ensure superior lethality and strategic dominance. Long-range variants now include stealth coatings and autonomous swarm coordination, making them a critical asset in next-gen military operations."
 nsb_dual_role_missile_0: "Développement des missiles à double usage d'après-guerre"
 nsb_dual_role_missile_0_desc: "Suite aux avancées de la technologie des missiles après la Seconde Guerre mondiale, des missiles à double usage ont été développés pour améliorer la polyvalence et l'efficacité dans plusieurs rôles de combat. Ces missiles sont conçus pour engager des cibles au sol et aériennes, offrant aux militaires une solution rentable et adaptable pour une variété de scénarios de champ de bataille. Avec des améliorations des systèmes de guidage, de l'efficacité de la propulsion et de l'adaptabilité des ogives, ces armes offrent une précision, une portée et une flexibilité tactique accrues, ce qui les rend essentielles pour la guerre interarmes moderne."
 nsb_dual_role_missile_1: "Développement des missiles à double usage de la Guerre Froide"
 nsb_dual_role_missile_1_desc: "Pendant la Guerre Froide, les avancées de la technologie des missiles ont conduit au développement de systèmes de missiles à double usage capables d'engager des cibles au sol et aériennes avec précision et adaptabilité. Ces armes ont été conçues pour améliorer la flexibilité militaire, permettant à une seule plateforme de missiles d'accomplir plusieurs rôles de combat, réduisant les charges logistiques et augmentant l'efficacité sur le champ de bataille. Dotés de systèmes de guidage améliorés, d'ogives modulaires et d'une propulsion améliorée, ces missiles sont devenus un élément crucial de la guerre moderne, permettant des capacités de réponse rapide dans les opérations défensives et offensives. Leur développement a ouvert la voie à des doctrines de missiles polyvalents qui continuent de façonner la stratégie militaire aujourd'hui."
 nsb_dual_role_missile_2: "Systèmes de missiles à double usage modernes"
 nsb_dual_role_missile_2_desc: "La guerre moderne exige des systèmes d'armes très adaptables et efficaces, ce qui a conduit au développement de missiles à double usage capables d'engager des cibles au sol et aériennes avec précision et polyvalence. Ces missiles avancés sont dotés de la technologie « tire et oublie », de systèmes de guidage multimodes (infrarouge, radar et GPS) et d'ogives modulaires pouvant être ajustées pour différents scénarios de combat. Leur capacité à fonctionner dans les rôles air-sol, air-air et antinavire en fait un élément essentiel des arsenaux militaires modernes, améliorant à la fois les opérations stratégiques et tactiques. Avec des capacités de furtivité, une résistance à la guerre électronique et une intégration de ciblage en temps réel, ces missiles offrent une flexibilité et une efficacité inégalées sur tous les champs de bataille."
 nsb_dual_role_missile_3: "Systèmes de missiles à double usage avancés"
 nsb_dual_role_missile_3_desc: "À mesure que la technologie militaire évolue, les systèmes de missiles à double usage avancés repoussent les limites de la précision, de l'adaptabilité et de la létalité. Ces missiles de nouvelle génération sont dotés d'un ciblage assisté par l'IA, d'un guidage multispectre (infrarouge, radar, laser et suivi par satellite) et d'ogives adaptatives capables de s'ajuster de manière autonome aux menaces aériennes, terrestres et navales. Grâce à la propulsion hypersonique, à une maniabilité améliorée et à une résistance à la guerre électronique, ces missiles peuvent échapper aux contre-mesures, frapper plusieurs cibles simultanément et opérer dans des environnements fortement contestés. Leur intégration transparente dans la guerre centrée sur le réseau assure une coordination du champ de bataille en temps réel, ce qui en fait la pierre angulaire de la future supériorité militaire."
 nsb_dual_role_missile_4: "Systèmes de missiles à double usage futuristes"
 nsb_dual_role_missile_4_desc: "La prochaine ère de la guerre des missiles introduit les systèmes de missiles à double usage futuristes, conçus pour engager plusieurs types de cibles à travers des menaces aériennes, terrestres, maritimes et même spatiales avec une vitesse et une adaptabilité sans précédent. Ces missiles très avancés utilisent la coordination de nuées pilotée par l'IA, le ciblage crypté quantique et les systèmes de guidage auto-apprenants pour détecter, suivre et neutraliser de manière autonome les menaces en temps réel. Équipés d'ogives à base de plasma, de charges utiles à énergie dirigée et d'une propulsion hypersonique dépassant Mach 10, ces missiles peuvent échapper à toutes les contre-mesures connues, s'ajuster dynamiquement en plein vol et exécuter des frappes de précision à des portées intercontinentales. Intégrées aux réseaux de combat autonomes, ces armes sont le fondement de la domination stratégique et tactique de la prochaine génération, assurant la suprématie totale sur le champ de bataille dans les scénarios de guerre conventionnels et asymétriques."
 SOV_module_light_helipad_1: "Ka-25/Ka-27"
 SOV_module_light_helipad_2: "Ka-27M"
 LBA_guided_missile_equipment_3: "Hwasong-7"
 IRQ_guided_missile_equipment_3: "Al-Abbas"
 IRQ_nuclear_missile_equipment_1: "Al-Abid"
 nsb_defense_tech_4: "Hélicoptère APS Laser Hard-Kill"
 nsb_defense_tech_4_desc: "Un système de défense à énergie dirigée capable de désactiver physiquement les projectiles entrants. Tire un laser à haute énergie pour détruire ou dévier les missiles avant l'impact. Représente la dernière génération de protection active pour les aéronefs à voilure tournante."
 armored_vehicle_tt: "La recherche de cette technologie vous permet de concevoir et de construire tous les véhicules blindés tels que les §YAPC§!, les §YVCI§!, les §YSPA§!, les §YMBT§!, et plus encore."
 CAT_fortifications: "Fortifications"
 CAT_naval_modules: "Naval Modules"
 CAT_naval_modules_research: "$CAT_naval_modules$ Research"
 Early_APC_desc: "La conception de véhicules blindés couvre une multitude de principes de conception variés pour nos véhicules blindés. Rechercher et investir dans nos équipes de conception nous permet de concevoir et construire des chars de combat principaux (MBT), des transports de troupes blindés (APC), des véhicules de combat d’infanterie (IFV), des véhicules blindés légers (LAV) et des véhicules utilitaires."
 NAVAL_TITLE_CORVETTES: "CORVETTES"
 NAVAL_TITLE_CORVETTES_DESC: "La plus petite classe de navire considérée comme un navire de guerre, les navires de classe corvette ne font généralement pas partie des marines en haute mer. Ces petits navires rapides sont généralement armés d’un assortiment d’armes, leur permettant d’accomplir une gamme de tâches. Beaucoup de pays peuvent déployer des corvettes en raison de leur abordabilité pour les marines petites et moyennes. Elles sont typiquement utilisées pour : défense côtière et surveillance, dragage de mines, anti-sous-marin, anti-aérien, anti-navire et, à l’époque moderne, attaques terrestres."
 NAVAL_TITLE_STEALTH_CORVETTES: "CORVETTES FURTIVES"
 NAVAL_TITLE_STEALTH_CORVETTES_DESC: "Ce sont des corvettes avec des caractéristiques furtives leur permettant d’éviter la détection par les forces ennemies."
 NAVAL_TITLE_FRIGATES: "FRÉGATES"
 NAVAL_TITLE_FRIGATES_DESC: "Formant le cœur de nombreuses marines modernes, les frégates peuvent être utilisées comme partie des forces navales en haute mer. Elles ont une portée étendue et sont plus grandes comparées à la classe corvette. Bien que le plus souvent utilisées comme plateforme pour la défense de flotte, elles peuvent accomplir une gamme assez étendue de rôles au sein d’une flotte et peuvent être personnalisées pour répondre aux exigences de nombreux rôles et situations différents (incluant des tâches plus offensives). Elles sont typiquement utilisées pour : défense de flotte, anti-sous-marin, anti-aérien, et escortes de convois maritimes."
 NAVAL_TITLE_STEALTH_FRIGATES: "FRÉGATES FURTIVES"
 NAVAL_TITLE_STEALTH_FRIGATES_DESC: "Avec de plus en plus de systèmes de détection avancés, il est devenu nécessaire d’équiper nos frégates de technologie furtive pour les rendre plus difficiles à détecter."
 NAVAL_TITLE_DESTROYERS_DESC: "Destinés à escorter des navires plus grands dans une flotte, convoi ou groupe de bataille, ces navires de guerre rapides, maniables et à longue endurance sont également capables d’opérations indépendantes. Les itérations plus récentes, portant un large et mortel éventail de missiles guidés, missiles de croisière et autres armes, sont en effet des navires multi-missions. Plus lourds en tonnage, et plus offensifs et mortels en puissance de feu, que votre frégate ou corvette. Ils sont typiquement utilisés pour : défense de flotte, tâches offensives, anti-aérien, anti-navire, anti-sous-marin, ainsi que attaques terrestres, selon la configuration."
 NAVAL_TITLE_STEALTH_DESTROYERS: "DESTROYERS FURTIFS"
 NAVAL_TITLE_STEALTH_DESTROYERS_DESC: "Les changements dans la technologie moderne de la guerre ont poussé les flottes plus avancées à chercher de nouvelles réponses pour la survivabilité de leurs flottes. Les destroyers furtifs sont devenus un focus prééminent. Rester caché des capteurs et radars ennemis avancés signifie que ces armes puissantes peuvent frapper plus près, plus vite, et avec une létalité accrue, avec le bonus ajouté d’une survivabilité augmentée dans les conflits modernes."
 NAVAL_TITLE_CRUISERS: "CROISEURS"
 NAVAL_TITLE_CRUISERS_DESC: "Typiquement les plus grands navires d’assaut dans une flotte moderne (à part les porte-avions et navires d’assaut amphibie), ces puissants actifs peuvent couvrir les océans et mers du globe entier. Historiquement orientés vers la défense aérienne (tandis que les destroyers étaient chargés de la guerre de surface), les croiseurs modernes ont un arsenal incroyable d’armes à leur disposition - plus grand que tout autre navire de combat. Les croiseurs peuvent servir de base à un groupe de bataille entier, avec une grande capacité pour les capteurs et systèmes de gestion de combat. Ils sont typiquement utilisés pour : commandement et contrôle, anti-aérien, anti-navire, et attaques terrestres."
 NAVAL_TITLE_BATTLESHIPS: "CUIRASSÉS/CROISEURS DE BATAILLE"
 NAVAL_TITLE_BATTLESHIPS_DESC: "Les cuirassés et croiseurs de bataille sont des reliques du passé. Alors qu’ils régnaient autrefois sur les mers, les avancées en aviation et missiles les ont rendus des cibles faciles pour des navires plus petits. Mais peut-être qu’avec suffisamment d’avancées technologiques, ils pourront à nouveau régner sur les mers."
 NAVAL_TITLE_HELI_OPERATORS: "PORTE-HÉLICOPTÈRES"
 NAVAL_TITLE_HELI_OPERATORS_DESC: "Ressemblant à des porte-avions, ces navires d’assaut amphibie polyvalents fournissent un grand coup pour beaucoup moins de coût, tant en production qu’en main-d’œuvre. Capables d’opérer des hélicoptères, des avions à décollage court et atterrissage vertical (STOVL), ainsi que des embarcations d’assaut marines, beaucoup ont aussi un puits de radoub - accordant des assauts amphibies rapides sur les positions ennemies. Ces navires fournissent un énorme bonus de soutien à tout débarquement amphibie. Ils sont typiquement utilisés pour : commandement et contrôle, anti-sous-marin, guerre de surface, guerre aérienne (si équipés d’avions à aile fixe), bombardement côtier, et soutien aux débarquements amphibies."
 NAVAL_TITLE_CARRIERS_DESC: "Ces bases aériennes flottantes sont le summum de la puissance navale, capables d’atteindre les océans du monde pour projeter la puissance d’une nation à travers le globe entier. Signifiant le sang et le trésor d’une nation forte, ces actifs incroyablement précieux doivent être protégés à tout prix. Avec une vaste portée, ils nécessitent un véritable groupe de bataille en haute mer pour permettre d’exploiter pleinement leurs capacités opérationnelles en mer. Tout pays déployant un groupe de bataille de porte-avions pleinement opérationnel peut être vraiment fier de ce que représente sa marine, et de la puissance terrifiante qu’elle exerce. Ils sont typiquement utilisés pour : projection de puissance loin et large, guerre aérienne, guerre de surface, guerre amphibie."
 NAVAL_TITLE_ATTACK_SUBMARINES: "SOUS-MARINS D’ATTAQUE"
 NAVAL_TITLE_ATTACK_SUBMARINES_DESC: "Les tueurs silencieux des océans du monde, ces plateformes de guerre sous-marine incorporent une gamme d’aptitudes utiles, incluant la furtivité, le renseignement et les systèmes d’armes. Les sous-marins d’attaque sont spécialisés dans l’engagement de sous-marins et navires ennemis à une portée plus proche que leurs homologues plus grands."
 NAVAL_TITLE_MISSILE_SUBMARINES: "SOUS-MARINS LANCEURS DE MISSILES"
 NAVAL_TITLE_MISSILE_SUBMARINES_DESC: "Les tueurs silencieux des océans du monde, ces plateformes de guerre sous-marine incorporent une gamme d’aptitudes utiles, incluant la furtivité, le renseignement et les systèmes d’armes. Les sous-marins lanceurs de missiles sont conçus avec des capacités bien supérieures à celles des sous-marins d’attaque."
 NAVAL_TITLE_SUB_ENGINES: "MOTEURS DE SOUS-MARIN"
 NAVAL_TITLE_SUB_ENGINES_DESC: "Les sous-marins opèrent généralement en utilisant des moteurs diesel pour la propulsion et la charge des batteries à bord. En immersion, le sous-marin opère via un moteur électrique."
 NAVAL_TITLE_SYSTEM_ENGINEERING: "INGÉNIERIE DES SYSTÈMES"
 NAVAL_TITLE_SYSTEM_ENGINEERING_DESC: "L’ingénierie des systèmes constitue toutes les parties auxiliaires des navires, telles que les moteurs, l’électronique et le radar."
 NAVAL_TITLE_NUCLEAR_ENGINES: "MOTEURS NUCLÉAIRES"
 NAVAL_TITLE_NUCLEAR_ENGINES_DESC: "Les moteurs nucléaires ont essentiellement un carburant illimité, permettant à nos navires d’opérer sur l’océan tant qu’il y a des provisions pour les marins à bord."
 NAVAL_TITLE_INTERNAL_DEFENSES: "CONTRÔLE DE TIR"
 NAVAL_TITLE_INTERNAL_DEFENSES_DESC: "Les ordinateurs de contrôle de tir sont responsables du ciblage des navires ennemis et du calcul des vecteurs de frappe."
 NAVAL_TITLE_RADAR: "RADAR"
 NAVAL_TITLE_RADAR_DESC: "Un radar utilise des ondes radio pour détecter des objets dans l’air ou sur l’eau. Le radar aide nos navires à détecter et identifier les cibles."
 NAVAL_TITLE_SONAR: "SONAR"
 NAVAL_TITLE_SONAR_DESC: "Un sonar utilise des ondes sonores pour détecter des objets sous l’eau. Cela est principalement utilisé pour détecter des sous-marins, mais peut aussi servir à détecter des mines marines, des torpilles ou mesurer la profondeur de l’eau."
 NAVAL_TITLE_ARMAMENT: "ARMEMENT NAVAL"
 NAVAL_TITLE_ARMAMENT_DESC: "Tous les navires nécessitent des armes pour opérer en mer. Alors que les navires commençaient avec de grandes batteries comme armement principal, l’armement a rapidement évolué vers l’utilisation de différents types de missiles car ceux-ci permettent même aux plus petits navires de cibler des navires plus lourds."
 NAVAL_TITLE_ASM: "MISSILES ANTI-NAVIRE"
 NAVAL_TITLE_ASM_DESC: "Les missiles anti-navire sont l’arme principale des navires contre d’autres navires. Les missiles anti-navire incluent des systèmes de missiles tant contre les navires de surface que sous-marins."
 NAVAL_TITLE_AAMISSILES: "MISSILES ANTI-AÉRIENS"
 NAVAL_TITLE_AAMISSILES_DESC: "Les missiles anti-aériens sont ce que nos navires utilisent comme principale défense contre les cibles aériennes. Les missiles anti-aériens peuvent être des missiles sol-air traditionnels (SAM) ou des missiles à cadre roulant (RAM) principalement destinés contre les missiles entrants."
 NAVAL_TITLE_VLS_SURFACE: "SYSTÈMES DE LANCEMENT VERTICAL DE SURFACE"
 NAVAL_TITLE_VLS_SURFACE_DESC: "Les systèmes de lancement vertical (VLS) sont des missiles lancés verticalement depuis la coque du navire. Cela permet aux navires de transporter plus de missiles par surface utilisée et le système d’arme a une signature radar plus petite comparée aux missiles lancés par bras traditionnels."
 NAVAL_TITLE_VLS_AIR: "SYSTÈMES DE LANCEMENT VERTICAL AÉRIENS"
 NAVAL_TITLE_VLS_AIR_DESC: "Les systèmes de lancement vertical (VLS) sont des missiles lancés verticalement depuis la coque du navire. Cela permet aux navires de transporter plus de missiles par surface utilisée et le système d’arme a une signature radar plus petite comparée aux missiles lancés par bras traditionnels."
 NAVAL_TITLE_TORPEDOES: "TORPILLES"
 NAVAL_TITLE_TORPEDOES_DESC: "Les torpilles sont des missiles sous-marins utilisés contre les navires. Une torpille est généralement lancée depuis un sous-marin, mais peut aussi l’être depuis un navire ou un avion."
 NAVAL_TITLE_LANDING_CRAFT: "EMBARCATIONS DE DÉBARQUEMENT"
 NAVAL_TITLE_LANDING_CRAFT_DESC: "Les embarcations de débarquement sont nécessaires pour effectuer tout type d’assaut amphibie. Cela peut être des vedettes rapides, des embarcations de débarquement dédiées, des hovercrafts ou même des navires massifs capables de débarquer plusieurs véhicules à la fois."
 battleship_hull_4: "Coque de cuirassé 2045"
 battleship_hull_4_desc: "Les navires de surface sont le composant principal de la flotte et entreprennent toutes les fonctions maritimes de la flotte traditionnelle."
 battle_cruiser_hull_4: "Coque de croiseur de bataille 2045"
 battle_cruiser_hull_4_desc: "Les navires de surface sont le composant principal de la flotte et entreprennent toutes les fonctions maritimes de la flotte traditionnelle."
