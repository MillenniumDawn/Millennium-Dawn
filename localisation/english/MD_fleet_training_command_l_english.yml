 MD_ftc_open_button_text: "Fleet Training"
 MD_ftc_open_button_tt: "Open Fleet Training Command.\nSpend navy experience on fleet exercises, academy upgrades and officer courses."
 MD_ftc_title: "Fleet Training Command"
 MD_ftc_close_tt: "Close Fleet Training Command."
 MD_ftc_xp_text: "Navy experience: §Y[?ROOT.navy_experience|0]§!"
 MD_ftc_exercises_header: "Fleet Exercises"
 MD_ftc_academy_header: "Naval Academy"
 MD_ftc_officers_header: "Officer Training and R&D"
 MD_ftc_status_active: "§GActive§!"
 MD_ftc_cooldown_text: "§ROn cooldown§!"
 MD_ftc_start_button_text: "Start (100 XP)"
 MD_ftc_staff_button_text: "Train (50 XP)"
 MD_ftc_flag_button_text: "Train (100 XP)"
 MD_ftc_rnd_button_text: "Liaise (200 XP)"
 MD_ftc_upgrade_level_1: "Upgrade (150 XP)"
 MD_ftc_upgrade_level_2: "Upgrade (250 XP)"
 MD_ftc_upgrade_level_3: "Upgrade (400 XP)"
 MD_ftc_fully_upgraded: "Fully Upgraded"
 MD_ftc_exercise_capital: "Carrier and Surface Group Exercise"
 MD_ftc_exercise_capital_desc: "Carrier strike group workups and surface action drills. Flight deck cycles, air defense coordination and replenishment at sea are rehearsed together."
 MD_ftc_ex_capital_short: "Capital ship doctrine mastery for 90 days."
 MD_ftc_start_capital_tt: "Costs §Y100§! navy experience.\nFor 90 days, adds daily mastery to the §YCapital Ships§! doctrine track, §G+3%§! capital ship attack and §R+25%§! naval fuel consumption.\nRequires at least one carrier, helicopter operator, battleship, battle cruiser or cruiser."
 MD_ftc_exercise_escort: "Escort Exercise"
 MD_ftc_exercise_escort_desc: "Convoy screening and anti-submarine drills for destroyers, frigates and corvettes. Sonar handling, helicopter coordination and formation station keeping are practiced at sea."
 MD_ftc_ex_escort_short: "Escort doctrine mastery for 90 days."
 MD_ftc_start_escort_tt: "Costs §Y100§! navy experience.\nFor 90 days, adds daily mastery to the §YEscort Ships§! doctrine track, §G+3%§! screen attack and §R+25%§! naval fuel consumption.\nRequires at least one destroyer, frigate or corvette of any type."
 MD_ftc_exercise_submarine: "Submarine Exercise"
 MD_ftc_exercise_submarine_desc: "Patrol and torpedo firing exercises for the submarine service. Crews rehearse quiet running, evasion against surface escorts and coordinated attacks."
 MD_ftc_ex_submarine_short: "Submarine doctrine mastery for 90 days."
 MD_ftc_start_submarine_tt: "Costs §Y100§! navy experience.\nFor 90 days, adds daily mastery to the §YSubmarines§! doctrine track, §G+3%§! submarine attack and §R+25%§! naval fuel consumption.\nRequires at least one attack or missile submarine."
 MD_ftc_exercise_operations: "Fleet Readiness Exercise"
 MD_ftc_exercise_operations_desc: "A fleet-wide readiness cycle covering command and control, logistics and damage control. Ships train to sustain operations far from home ports."
 MD_ftc_ex_operations_short: "Naval operations mastery for 90 days."
 MD_ftc_start_operations_tt: "Costs §Y100§! navy experience.\nFor 90 days, adds daily mastery to the §YOperations§! doctrine track, §G+3%§! naval organization and §R+25%§! naval fuel consumption.\nRequires a navy of more than 4 ships."
 MD_ftc_exercise_program_name: "Exercise Program"
 MD_ftc_exercise_program_short: "Raises mastery gained from fleet exercises."
 MD_ftc_exercise_level_text: "Level [?ROOT.MD_ftc_exercise_level|0]/3"
 MD_ftc_exercise_program_tt: "Permanent upgrade in three levels, costing §Y150§!, §Y250§! and §Y400§! navy experience.\nDaily mastery from each fleet exercise rises from §Y0.5§! to §G0.75§!, §G1.0§! and §G1.25§!."
 MD_ftc_doctrine_center_name: "Maritime Doctrine Center"
 MD_ftc_doctrine_center_short: "Permanent naval mastery and leader bonuses."
 MD_ftc_doctrine_level_text: "Level [?ROOT.MD_ftc_doctrine_center_level|0]/3"
 MD_ftc_doctrine_center_tt: "Permanent upgrade in three levels, costing §Y150§!, §Y250§! and §Y400§! navy experience.\nLevel 1: §G+5%§! naval mastery gain.\nLevel 2: §G+10%§! naval mastery gain and new navy leaders start at skill level §G+1§!.\nLevel 3: §G+15%§! naval mastery gain, new navy leaders start at skill level §G+1§! and §G+3%§! naval organization."
 MD_ftc_doctrine_center_1: "Maritime Doctrine Center I"
 MD_ftc_doctrine_center_1_desc: "A small staff cell records lessons from exercises and feeds them into fleet doctrine."
 MD_ftc_doctrine_center_2: "Maritime Doctrine Center II"
 MD_ftc_doctrine_center_2_desc: "The center runs formal officer instruction and publishes doctrine manuals for the whole fleet."
 MD_ftc_doctrine_center_3: "Maritime Doctrine Center III"
 MD_ftc_doctrine_center_3_desc: "A permanent doctrine institute links war games, fleet trials and staff training into one cycle."
 MD_ftc_staff_course_name: "Staff Course"
 MD_ftc_staff_course_short: "Every navy leader gains experience."
 MD_ftc_staff_course_tt: "Costs §Y50§! navy experience.\nEvery navy leader gains §G50§! experience.\nCooldown: 90 days.\nRequires at least one navy leader."
 MD_ftc_flag_officer_course_name: "Flag Officer Course"
 MD_ftc_flag_officer_course_short: "One navy leader gains a skill level."
 MD_ftc_flag_officer_course_tt: "Costs §Y100§! navy experience.\nA random navy leader below skill level 9 gains §G1§! skill level.\nCooldown: 180 days.\nRequires a navy leader below skill level 9."
 MD_ftc_rnd_liaison_name: "Naval R&D Liaison"
 MD_ftc_rnd_liaison_short: "Gain a naval breakthrough point."
 MD_ftc_rnd_liaison_tt: "Costs §Y200§! navy experience.\nGrants §G1§! naval breakthrough point.\nCooldown: 365 days.\nRequires the Gotterdammerung expansion."
