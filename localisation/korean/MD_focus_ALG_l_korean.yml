 ALG_state_falls_TT: "§Y이 주§!가 시위대의 영향 아래 넘어갔습니다."
 algerian_events.201.t: "시위대에 넘어간 음자브"
 algerian_events.201.a: "또 하나의 지역이 떨어져 나간다"
 algerian_events.202.t: "시위대에 넘어간 오레스"
 algerian_events.202.a: "시위가 확산된다"
 algerian_events.203.t: "시위대에 넘어간 타만라세트"
 algerian_events.203.a: "남부가 불안하다"
 algerian_events.204.t: "시위대에 넘어간 서부 대사구"
 algerian_events.204.a: "사막조차 들고일어난다"
 algerian_events.205.t: "시위대에 넘어간 알제리 아틀라스"
 algerian_events.205.a: "불안이 확대된다"
 algerian_events.206.t: "시위대에 넘어간 콩스탕티누아"
 algerian_events.206.a: "동부가 폭발한다"
 algerian_events.207.t: "시위대에 넘어간 카빌리아"
 algerian_events.207.a: "카빌리아가 다시 일어선다"
 algerian_events.208.t: "시위대에 넘어간 알제루아"
 algerian_events.208.a: "알제리의 심장이 흔들린다"
 algerian_events.209.t: "시위대에 넘어간 오라네"
 algerian_events.209.a: "서부를 잃었다"
 algerian_events.201.d: "음자브 지역 주민들이 정부의 통제에 맞서 거리를 장악했습니다.\n모자브인 민심: [ALG_mozabite_satisfaction_text]"
 algerian_events.202.d: "오레스 산악 지대에서 불안이 노골적인 저항으로 번졌습니다.\n샤위인 민심: [ALG_chaoui_satisfaction_text]"
 algerian_events.203.d: "고립된 곳임에도 타만라세트가 폭발하여 정부가 이 지역의 통제권을 잃고 있습니다.\n투아레그인 민심: [ALG_tuareg_satisfaction_text]"
 algerian_events.204.d: "서부 대사구의 사막 공동체들이 시위의 물결에 합류했습니다.\n대중의 불만: [ALG_grievance_text]"
 algerian_events.205.d: "한때 조용했던 아틀라스 지역이 반정부 불안의 온상이 되었습니다.\n아랍인 민심: [ALG_arab_satisfaction_text]"
 algerian_events.206.d: "동부의 시위가 현지 보안 병력을 압도하여 콩스탕티누아가 무너졌습니다.\n아랍인 민심: [ALG_arab_satisfaction_text]"
 algerian_events.207.d: "저항의 오랜 전통을 지닌 카빌리아가 다시 한 번 국가에 노골적으로 맞서고 있습니다.\n카빌인 민심: [ALG_kabyle_satisfaction_text]"
 algerian_events.208.d: "수도권마저 통제 불능의 시위로 흔들리고 있습니다.\n군의 장악력: [ALG_army_grip_text]"
 algerian_events.209.d: "서부에서는 오라네가 알제리 전역을 휩쓰는 불안의 물결에 합류했습니다.\n아랍인 민심: [ALG_arab_satisfaction_text]"
 algerian_events.200.t: "시위 진압"
 algerian_events.200.d: "보안 병력이 최근의 시위 물결을 진압하는 데 성공했지만, 대중의 분노는 수면 아래에서 끓고 있습니다."
 algerian_events.200.a: "일단은 질서가 회복되었다."
 algerian_events.2015.t: "진압의 역효과"
 algerian_events.2015.d: "시위를 단속하려는 시도가 오히려 분노를 더 키워 시위대를 대담하게 만들고 정부의 권위를 약화시켰습니다."
 algerian_events.2015.a: "상황이 악화된다."
 algerian_events.2025.t: "시위의 종식"
 algerian_events.2025.d: "수개월간의 투쟁 끝에 최근의 시위 물결이 사그라들었습니다. 긴장은 남아 있지만, 지금은 거리가 다시 조용해졌습니다."
 algerian_events.2025.a: "마침내 평온이 돌아왔다."
 algerian_events.301.t: "전국적 시위 발발!"
 algerian_events.301.d: "우리의 최근 조치를 국민이 가볍게 받아들이지 않은 듯하며, 전국적인 시위가 터져 나왔습니다. 더 많은 사람이 정부의 사임을 요구하고 있는 것으로 보이지만, 우리는 물러날 생각이 없습니다."
 algerian_events.301.a: "이럴 줄 알았어야 했는데!"
 ALG_khenchela_arms_manufacturer: "켄셀라 무기 제조 단지"
 ALG_seriana_small_arms: "세리아나 소형 화기 공장"
 ALG_dgi_missile_systems: "DGI - 군수산업총국(Direction Générale de l'Industrie Militaire)"
