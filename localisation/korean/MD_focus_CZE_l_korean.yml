 CZE_petr_pavel_scripted_gui_missions_text_text: "[CZE_petr_pavel_scripted_gui_missions_scripted_text]"
 CZE_petr_pavel_scripted_gui_missions_scripted_text_one: "군사 임무는 파벨의 훈련에 더 큰 영향을 미치지만 완료하는 데도 더 오래 걸립니다. 이 유형의 임무는 군사 작전과 핵심 결정에 초점을 맞춥니다.\n§R활성 임무는 1개만 가질 수 있습니다!§!"
 CZE_petr_pavel_scripted_gui_politics_text_text: "[CZE_petr_pavel_scripted_gui_politics_scripted_text]"
 CZE_petr_pavel_scripted_gui_politics_scripted_text_one: "정치 임무는 완료하는 데 시간이 덜 걸리지만 때로는 군사 임무보다 더 강력한 영향을 미치기도 합니다. 주로 전략 수립과 기타 작전에 초점을 맞춥니다.\n§R활성 임무는 1개만 가질 수 있습니다!§!"
 CZE_petr_pavel_scripted_gui_north_flank_button_text_text: "[CZE_petr_pavel_scripted_gui_north_flank_button_one_scripted_text]"
 CZE_petr_pavel_scripted_gui_north_button_one_scripted_text_one: "원정군 방어 프로그램"
 CZE_petr_pavel_scripted_gui_north_button_one_scripted_text_two: "§G원정군 방어 프로그램§!"
 CZE_petr_pavel_scripted_gui_north_flank_button_delayed_text: "합동원정군(JEF)은 신속 대응과 원정 작전을 위해 만들어진, 영국이 주도하는 북유럽 다국적 군사 파트너십입니다.\n\n[CZE_petr_pavel_scripted_gui_north_flank_button_one_delayed_scripted_text]\n\n§Y전제 조건:§!\n[!CZE_petr_pavel_scripted_gui_north_flank_button_click_enabled]\n\n§Y효과:§!\n[!CZE_petr_pavel_scripted_gui_north_flank_button_click]"
 CZE_petr_pavel_scripted_gui_north_flank_politics_button_text_text: "[CZE_petr_pavel_scripted_gui_north_flank_politics_button_one_scripted_text]"
 CZE_petr_pavel_scripted_gui_north_politics_button_one_scripted_text_one: "브뤼쉼 대표"
 CZE_petr_pavel_scripted_gui_north_politics_button_one_scripted_text_two: "§G브뤼쉼 대표§!"
 CZE_petr_pavel_scripted_gui_north_flank_politics_button_delayed_text: "연합합동군사령부 브뤼쉼(JFCBS)은 네덜란드 브뤼쉼에 본부를 둔 나토 사령부입니다. 2004년 나토 군사 지휘 구조 본부의 수를 줄이는 재편의 일환으로 창설되었습니다.\n\n[CZE_petr_pavel_scripted_gui_north_flank_politics_button_one_delayed_scripted_text]\n\n§Y전제 조건:§!\n[!CZE_petr_pavel_scripted_gui_north_flank_politics_button_click_enabled]\n\n§Y효과:§!\n[!CZE_petr_pavel_scripted_gui_north_flank_politics_button_click]"
 CZE_petr_pavel_scripted_gui_north_flank_politics_button_two_text_text: "[CZE_petr_pavel_scripted_gui_north_flank_politics_button_two_scripted_text]"
 CZE_petr_pavel_scripted_gui_north_politics_button_two_scripted_text_one: "웨일스 대표"
 CZE_petr_pavel_scripted_gui_north_politics_button_two_scripted_text_two: "§G웨일스 대표§!"
 CZE_petr_pavel_scripted_gui_north_flank_politics_button_two_delayed_text: "2014년 북대서양 조약 기구(NATO) 웨일스 정상회의는 나토 회원국 국가 원수 및 정부 수반들의 제25차 정상회의로, 2014년 9월 4일과 5일 웨일스 뉴포트에서 열렸습니다. 이러한 정상회의는 간헐적으로 열리며, 나토 동맹국의 지도자와 관료들이 공동의 현안을 논의하고 전략 활동을 계획할 수 있게 해 줍니다. 미 해군 제독 제임스 G. 스타브리디스는 2014년 정상회의를 베를린 장벽 붕괴 이후 가장 중요한 회의라고 평가했습니다.\n\n[CZE_petr_pavel_scripted_gui_north_flank_politics_button_two_delayed_scripted_text]\n\n§Y전제 조건:§!\n[!CZE_petr_pavel_scripted_gui_north_flank_politics_button_two_click_enabled]\n\n§Y효과:§!\n[!CZE_petr_pavel_scripted_gui_north_flank_politics_button_two_click]"
 CZE_petr_pavel_scripted_gui_north_flank_politics_button_three_text_text: "[CZE_petr_pavel_scripted_gui_north_flank_politics_button_three_scripted_text]"
 CZE_petr_pavel_scripted_gui_north_politics_button_three_scripted_text_one: "SHAPE 대표"
 CZE_petr_pavel_scripted_gui_north_politics_button_three_scripted_text_two: "§GSHAPE 대표§!"
 CZE_petr_pavel_scripted_gui_north_flank_politics_button_three_delayed_text: "유럽연합군최고사령부(SHAPE)는 전 세계의 모든 나토 작전을 지휘하는 나토 연합작전사령부(ACO)의 군사 본부입니다. SHAPE는 벨기에 몽스 인근의 카스토 마을에 있습니다. 1951년부터 2003년까지 SHAPE는 유럽연합군사령부(ACE)의 본부였습니다. 2003년부터는 ACO의 본부로서 유럽 밖에서도 나토를 통제하고 있습니다. 활동 범위가 확대되었음에도 SHAPE는 유럽을 가리키는 전통적인 명칭을 유지했습니다.\n\n[CZE_petr_pavel_scripted_gui_north_flank_politics_button_three_delayed_scripted_text]\n\n§Y전제 조건:§!\n[!CZE_petr_pavel_scripted_gui_north_flank_politics_button_three_click_enabled]\n\n§Y효과:§!\n[!CZE_petr_pavel_scripted_gui_north_flank_politics_button_three_click]"
 CZE_petr_pavel_scripted_gui_east_south_flank_button_text_text: "[CZE_petr_pavel_scripted_gui_east_south_button_scripted_text]"
 CZE_petr_pavel_scripted_gui_east_south_button_scripted_text_one: "올리브 가지 작전"
 CZE_petr_pavel_scripted_gui_east_south_button_scripted_text_two: "§G올리브 가지 작전§!"
 CZE_petr_pavel_scripted_gui_east_south_flank_button_delayed_text: "올리브 가지 작전은 튀르키예군과 시리아 국민군(SNA)이 시리아 북서부의 쿠르드족 다수 거주 지역인 아프린 지구에서 시리아 민주군(SDF)의 인민수비대(YPG)를 상대로 수행한 국경 간 군사 작전입니다. SNA 소속 아랍 및 투르크멘 민병대가 2018년 3월 18일 아프린 시에 진입하면서 공중전과 대규모 포병 사용은 끝났고, 북부 알레포에서 SDF의 반란이 시작되었습니다.\n\n[CZE_petr_pavel_scripted_gui_east_south_button_delayed_scripted_text]\n\n§Y전제 조건:§!\n[!CZE_petr_pavel_scripted_gui_east_south_flank_button_click_enabled]\n\n§Y효과:§!\n[!CZE_petr_pavel_scripted_gui_east_south_flank_button_click]"
 CZE_petr_pavel_scripted_gui_east_south_flank_politics_button_text_text: "[CZE_petr_pavel_scripted_gui_east_south_politics_button_scripted_text]"
 CZE_petr_pavel_scripted_gui_east_south_politics_button_scripted_text_one: "국방 백서"
 CZE_petr_pavel_scripted_gui_east_south_politics_button_scripted_text_two: "§G국방 백서§!"
 CZE_petr_pavel_scripted_gui_east_south_flank_politics_button_delayed_text: "백서는 국가가 방어 체계를 어떻게 발전시켜야 하는지에 대한 지침, 제안, 전략을 제공합니다. 페트르 파벨은 체코 공화국 방위 프로그램을 위한 백서를 작성할 때 참여한 장성 중 한 명이었습니다. 동맹국들을 살펴보면, 우리 계획에 헝가리와 슬로바키아의 안보도 포함해야 하는지 물어볼 수 있습니다.\n\n[CZE_petr_pavel_scripted_gui_east_south_politics_button_delayed_scripted_text]\n\n§Y전제 조건:§!\n[!CZE_petr_pavel_scripted_gui_east_south_flank_politics_button_click_enabled]\n\n§Y효과:§!\n[!CZE_petr_pavel_scripted_gui_east_south_flank_politics_button_click]"
 CZE_petr_pavel_scripted_gui_east_south_flank_politics_button_two_text_text: "[CZE_petr_pavel_scripted_gui_east_south_politics_button_two_scripted_text]"
 CZE_petr_pavel_scripted_gui_east_south_politics_button_two_scripted_text_one: "KFOR 작전 지원"
 CZE_petr_pavel_scripted_gui_east_south_politics_button_two_scripted_text_two: "§GKFOR 작전 지원§!"
 CZE_petr_pavel_scripted_gui_east_south_flank_politics_button_two_delayed_text: "코소보군(KFOR)은 코소보에 주둔하는 나토 주도의 국제 평화유지군입니다. 2009년 창설된 코소보 안보군이 자립할 때까지 작전 규모는 점차 줄어들고 있습니다. KFOR는 국제연합 안전보장이사회가 결의 1244호를 채택한 지 이틀 후인 1999년 6월 12일 코소보에 진입했습니다. 당시 코소보는 심각한 인도주의 위기를 겪고 있었으며, 유고슬라비아군이 코소보 해방군(KLA)을 상대로 매일같이 교전을 벌이고 있었습니다.\n\n[CZE_petr_pavel_scripted_gui_east_south_politics_button_two_delayed_scripted_text]\n\n§Y전제 조건:§!\n[!CZE_petr_pavel_scripted_gui_east_south_flank_politics_button_two_click_enabled]\n\n§Y효과:§!\n[!CZE_petr_pavel_scripted_gui_east_south_flank_politics_button_two_click]"
 CZE_petr_pavel_scripted_gui_east_south_flank_politics_button_three_text_text: "[CZE_petr_pavel_scripted_gui_east_south_politics_button_three_scripted_text]"
 CZE_petr_pavel_scripted_gui_east_south_politics_button_three_scripted_text_one: "알테아 작전"
 CZE_petr_pavel_scripted_gui_east_south_politics_button_three_scripted_text_two: "§G알테아 작전§!"
 CZE_petr_pavel_scripted_gui_east_south_flank_politics_button_three_delayed_text: "알테아 작전은 공식 명칭이 유럽연합군 보스니아 헤르체고비나(EUFOR)로, 데이턴 협정의 군사적 이행을 감독하기 위해 보스니아 헤르체고비나에 배치된 군사 부대입니다. 이는 나토의 SFOR와 IFOR의 후속 부대입니다. SFOR에서 EUFOR로의 전환은 대체로 명칭과 지휘관만 바뀐 것이었으며 병력의 80%가 그대로 남았습니다. 이 부대는 2004년 12월 2일 SFOR를 대체했습니다.\n\n[CZE_petr_pavel_scripted_gui_east_south_politics_button_three_delayed_scripted_text]\n\n§Y전제 조건:§!\n[!CZE_petr_pavel_scripted_gui_east_south_flank_politics_button_three_click_enabled]\n\n§Y효과:§!\n[!CZE_petr_pavel_scripted_gui_east_south_flank_politics_button_three_click]"
 CZE_petr_pavel_scripted_gui_eastern_flank_button_text_text: "[CZE_petr_pavel_scripted_gui_eastern_flank_button_scripted_text]"
 CZE_petr_pavel_scripted_gui_eastern_flank_button_scripted_text_one: "강화된 전진 배치"
 CZE_petr_pavel_scripted_gui_eastern_flank_button_scripted_text_two: "§G강화된 전진 배치§!"
 CZE_petr_pavel_scripted_gui_eastern_flank_button_delayed_text: "강화된 전진 배치는 북유럽, 중부 유럽, 동유럽에 전방 배치된 나토 동맹의 방어 및 억지 군사력입니다. 러시아의 크림반도 침공 이후, 나토 회원국들은 2016년 바르샤바 정상회의에서 공격받을 가능성이 가장 높은 지역에 4개의 다국적 대대 전투단을 전방 배치하기로 합의했습니다.\n\n[CZE_petr_pavel_scripted_gui_eastern_flank_button_delayed_scripted_text]\n\n§Y전제 조건:§!\n[!CZE_petr_pavel_scripted_gui_eastern_flank_button_click_enabled]\n\n§Y효과:§!\n[!CZE_petr_pavel_scripted_gui_eastern_flank_button_click]"
 CZE_petr_pavel_scripted_gui_eastern_flank_button_two_text_text: "[CZE_petr_pavel_scripted_gui_eastern_flank_button_two_scripted_text]"
 CZE_petr_pavel_scripted_gui_eastern_flank_button_two_scripted_text_one: "대서양 결의 작전"
 CZE_petr_pavel_scripted_gui_eastern_flank_button_two_scripted_text_two: "§G대서양 결의 작전§!"
 CZE_petr_pavel_scripted_gui_eastern_flank_button_two_delayed_text: "대서양 결의 작전은 유럽 억지 구상에 따라 자금이 지원되었습니다. 미국과 영국은 이 지역의 공군, 지상군, 해군 주둔을 늘리고 기존에 예정된 훈련을 강화하는 등 나토 동부 측면의 억지 태세를 강화하기 위한 여러 즉각적인 조치를 취했습니다.\n미국은 이 활동을 나토의 군사 계획과 방어 능력을 강화하고 중부 유럽과 동유럽에 상시 주둔을 유지하기 위한 조치라고 설명했습니다. 대서양 결의 순환 배치는 이 지역에 맞춰 편성된 사령부가 감독합니다.\n\n[CZE_petr_pavel_scripted_gui_eastern_flank_button_two_delayed_scripted_text]\n\n§Y전제 조건:§!\n[!CZE_petr_pavel_scripted_gui_eastern_flank_button_two_click_enabled]\n\n§Y효과:§!\n[!CZE_petr_pavel_scripted_gui_eastern_flank_button_two_click]"
 CZE_petr_pavel_scripted_gui_eastern_flank_political_button_text_text: "[CZE_petr_pavel_scripted_gui_eastern_flank_political_button_scripted_text]"
 CZE_petr_pavel_scripted_gui_eastern_flank_political_button_scripted_text_one: "발트해 공중 경계 지원"
 CZE_petr_pavel_scripted_gui_eastern_flank_political_button_scripted_text_two: "§G발트해 공중 경계 지원§!"
 CZE_petr_pavel_scripted_gui_eastern_flank_political_button_delayed_text: "발트해 공중 경계 임무는 에스토니아, 라트비아, 리투아니아 발트 3국의 영공을 지키기 위한 나토 방공 신속 대응 경계 태세(QRA)입니다.\n\n[CZE_petr_pavel_scripted_gui_eastern_flank_political_button_delayed_scripted_text]\n\n§Y전제 조건:§!\n[!CZE_petr_pavel_scripted_gui_eastern_flank_political_button_click_enabled]\n\n§Y효과:§!\n[!CZE_petr_pavel_scripted_gui_eastern_flank_political_button_click]"
 CZE_petr_pavel_scripted_gui_usa_button_text_text: "[CZE_petr_pavel_scripted_gui_usa_button_scripted_text]"
 CZE_petr_pavel_scripted_gui_usa_button_scripted_text_one: "중부사령부 연락 장교"
 CZE_petr_pavel_scripted_gui_usa_button_scripted_text_two: "§G중부사령부 연락 장교§!"
 CZE_petr_pavel_scripted_gui_usa_button_delayed_text: "미국 중부사령부(USCENTCOM 또는 CENTCOM)는 미국 국방부의 11개 통합 전투 사령부 중 하나입니다. 1983년에 창설되었습니다. 책임 지역(AOR)에는 중동(아프리카의 이집트 포함), 중앙아시아, 남아시아 일부가 포함됩니다. 이 사령부는 1991년 걸프전의 사막의 폭풍 작전, 아프가니스탄 전쟁, 2003년부터 2011년까지의 이라크 전쟁을 비롯한 수많은 군사 작전에서 미국의 주축을 맡아 왔습니다.\n\n[CZE_petr_pavel_scripted_gui_usa_button_delayed_scripted_text]\n\n§Y전제 조건:§!\n[!CZE_petr_pavel_scripted_gui_usa_button_click_enabled]\n\n§Y효과:§!\n[!CZE_petr_pavel_scripted_gui_usa_button_click]"
 CZE_petr_pavel_scripted_gui_usa_button_two_text_text: "[CZE_petr_pavel_scripted_gui_usa_button_two_scripted_text]"
 CZE_petr_pavel_scripted_gui_usa_button_two_scripted_text_one: "항구적 자유 작전"
 CZE_petr_pavel_scripted_gui_usa_button_two_scripted_text_two: "§G항구적 자유 작전§!"
 CZE_petr_pavel_scripted_gui_usa_button_two_delayed_text: "항구적 자유 작전(OEF)은 아프가니스탄 전쟁(2001~2021)의 첫 단계(2001~2014)와 더 큰 규모의 대테러 전쟁 모두에 미국 정부가 사용한 공식 명칭입니다. 2001년 10월 7일, 조지 W. 부시 대통령은 9.11 테러에 대한 대응으로 알카에다와 탈레반을 겨냥한 공습이 아프가니스탄에서 시작되었다고 발표했습니다.\n\n[CZE_petr_pavel_scripted_gui_usa_button_two_delayed_scripted_text]\n\n§Y전제 조건:§!\n[!CZE_petr_pavel_scripted_gui_usa_button_two_click_enabled]\n\n§Y효과:§!\n[!CZE_petr_pavel_scripted_gui_usa_button_two_click]"
 CZE_petr_pavel_scripted_gui_usa_politics_button_text_text: "[CZE_petr_pavel_scripted_gui_usa_politics_button_scripted_text]"
 CZE_petr_pavel_scripted_gui_usa_politics_button_scripted_text_one: "펜타곤 회의"
 CZE_petr_pavel_scripted_gui_usa_politics_button_scripted_text_two: "§G펜타곤 회의§!"
 CZE_petr_pavel_scripted_gui_usa_politics_button_delayed_text: "펜타곤은 워싱턴 인근 버지니아주에 있는 미국 국방부 본부입니다. 오각형이라는 독특한 형태를 지닌 세계 최대 규모의 사무용 건물 중 하나입니다. 제2차 세계 대전 중인 1943년에 완공되어 미군의 작전 중심지 역할을 해 왔습니다.\n\n국방부의 군인 및 민간인 사무실과 미군의 가장 중요한 사령부들의 본부가 이곳에 있습니다. 전략 기획의 핵심 중심지입니다.\n\n페트르 파벨은 미국의 가장 중요한 전략가들과 협력할 수 있으며, 이는 그가 더욱 성장하는 데 분명 도움이 될 것입니다.\n\n[CZE_petr_pavel_scripted_gui_usa_politics_button_delayed_scripted_text]\n\n§Y전제 조건:§!\n[!CZE_petr_pavel_scripted_gui_usa_politics_button_click_enabled]\n\n§Y효과:§!\n[!CZE_petr_pavel_scripted_gui_usa_politics_button_click]"
 CZE_petr_pavel_scripted_gui_russia_politics_button_text_text: "[CZE_petr_pavel_scripted_gui_russia_politics_button_one_scripted_text]"
 CZE_petr_pavel_scripted_gui_russia_politics_button_one_scripted_text_one: "관계 개선"
 CZE_petr_pavel_scripted_gui_russia_politics_button_one_scripted_text_two: "§G관계 개선§!"
 CZE_petr_pavel_scripted_gui_russia_politics_button_delayed_text: "러시아가 다시 한번 더 공격적으로 행동하고 있습니다. 이 상황이 더 악화되도록 놔둘 수는 없으며, 그 나라와 최소한 무난한 관계를 유지하는 것이 좋은 수가 될 것입니다.\n\n[CZE_petr_pavel_scripted_gui_russia_politics_button_one_delayed_scripted_text]\n\n§Y전제 조건:§!\n[!CZE_petr_pavel_scripted_gui_russia_politics_button_click_enabled]\n\n§Y효과:§!\n[!CZE_petr_pavel_scripted_gui_russia_politics_button_click]"
 CZE_petr_pavel_scripted_gui_russia_button_text_text: "[CZE_petr_pavel_scripted_gui_russia_button_one_scripted_text]"
 CZE_petr_pavel_scripted_gui_russia_button_one_scripted_text_one: "외교 사절단"
 CZE_petr_pavel_scripted_gui_russia_button_one_scripted_text_two: "§G외교 사절단§!"
 CZE_petr_pavel_scripted_gui_russia_button_delayed_text: "러시아는 항상 주시해야 하는 나라입니다. 우리는 양국 관계를 좋은 수준으로 유지하기 위해 페트르 파벨을 외교 사절단과 함께 보낼 것입니다.\n\n[CZE_petr_pavel_scripted_gui_russia_button_one_delayed_scripted_text]\n\n§Y전제 조건:§!\n[!CZE_petr_pavel_scripted_gui_russia_button_click_enabled]\n\n§Y효과:§!\n[!CZE_petr_pavel_scripted_gui_russia_button_click]"
 CZE_petr_pavel_scripted_gui_qatar_button_text_text: "[CZE_petr_pavel_scripted_gui_qatar_button_scripted_text]"
 CZE_petr_pavel_scripted_gui_qatar_button_scripted_text_one: "제2차 걸프전"
 CZE_petr_pavel_scripted_gui_qatar_button_scripted_text_two: "§G제2차 걸프전§!"
 CZE_petr_pavel_scripted_gui_qatar_button_delayed_text: "제2차 걸프전은 이라크에 대한 신속한 침공이었으며, 이후 점령지에서 8년간의 전쟁으로 이어졌습니다. 침공 중 페트르 파벨은 연락 장교로서 카타르에서 미군과 협력했습니다. 또한 이라크의 생물 무기 공격 가능성에 대해 최고 사령부에 경고한 사람도 그였습니다.\n\n[CZE_petr_pavel_scripted_gui_qatar_button_delayed_scripted_text]\n\n§Y전제 조건:§!\n[!CZE_petr_pavel_scripted_gui_qatar_button_click_enabled]\n\n§Y효과:§!\n[!CZE_petr_pavel_scripted_gui_qatar_button_click]"
 CZE_petr_pavel_scripted_gui_qatar_politics_button_text_text: "[CZE_petr_pavel_scripted_gui_qatar_politics_button_scripted_text]"
 CZE_petr_pavel_scripted_gui_qatar_politics_button_scripted_text_one: "제2차 걸프전 이후 관계 유지"
 CZE_petr_pavel_scripted_gui_qatar_politics_button_scripted_text_two: "§G제2차 걸프전 이후 관계 유지§!"
 CZE_petr_pavel_scripted_gui_qatar_politics_button_delayed_text: "제2차 걸프전 이후에도 예기치 못한 일이 벌어질 경우에 대비해 카타르와 좋은 관계를 유지하는 것이 바람직합니다.\n\n[CZE_petr_pavel_scripted_gui_qatar_politics_button_delayed_scripted_text]\n\n§Y전제 조건:§!\n[!CZE_petr_pavel_scripted_gui_qatar_politics_button_click_enabled]\n\n§Y효과:§!\n[!CZE_petr_pavel_scripted_gui_qatar_politics_button_click]"
 CZE_petr_pavel_scripted_gui_iraq_text_text: "[CZE_petr_pavel_scripted_gui_iraq_button_scripted_text]"
 CZE_petr_pavel_scripted_gui_iraq_button_scripted_text_one: "제2차 걸프전 지원"
 CZE_petr_pavel_scripted_gui_iraq_button_scripted_text_two: "§G제2차 걸프전 지원§!"
 CZE_petr_pavel_scripted_gui_iraq_delayed_text: "미국에게는 이라크를 침공할 권리가 없었습니다. 우리 정부도 같은 의견이며, 그들이 동맹이든 아니든 이 침략은 막아야 합니다.\n\n[CZE_petr_pavel_scripted_gui_iraq_button_delayed_scripted_text]\n\n§Y전제 조건:§!\n[!CZE_petr_pavel_scripted_gui_iraq_button_click_enabled]\n\n§Y효과:§!\n[!CZE_petr_pavel_scripted_gui_iraq_button_click]"
 CZE_petr_pavel_scripted_gui_iraq_politics_text_text: "[CZE_petr_pavel_scripted_gui_iraq_politics_button_scripted_text]"
 CZE_petr_pavel_scripted_gui_iraq_politics_button_scripted_text_one: "정부 간 밀착"
 CZE_petr_pavel_scripted_gui_iraq_politics_button_scripted_text_two: "§G정부 간 밀착§!"
 CZE_petr_pavel_scripted_gui_iraq_politics_delayed_text: "이라크는 이 전쟁으로 많은 고통을 겪었습니다. 그들은 우리의 지지를 받고 있다는 것을 알아야 합니다. 페트르 파벨은 앞선 제2차 걸프전에서 훌륭한 성과를 냈으니 그를 다시 그곳으로 보내도록 합시다.\n\n[CZE_petr_pavel_scripted_gui_iraq_politics_button_delayed_scripted_text]\n\n§Y전제 조건:§!\n[!CZE_petr_pavel_scripted_gui_iraq_politics_button_click_enabled]\n\n§Y효과:§!\n[!CZE_petr_pavel_scripted_gui_iraq_politics_button_click]"
 CZE_petr_pavel_scripted_gui_afghanistan_button_text_text: "[CZE_petr_pavel_scripted_gui_afghanistan_button_scripted_text]"
 CZE_petr_pavel_scripted_gui_afghanistan_button_scripted_text_one: "국제안보지원군"
 CZE_petr_pavel_scripted_gui_afghanistan_button_scripted_text_two: "§G국제안보지원군§!"
 CZE_petr_pavel_scripted_gui_afghanistan_button_delayed_text: "국제안보지원군은 아프가니스탄에서 활동한 다국적 군사 임무입니다. ISAF의 주된 목표는 아프가니스탄 국가안보군(ANSF)을 훈련시키고 아프가니스탄이 핵심 정부 기관을 재건하도록 돕는 것이었으며, 점차 탈레반 반군에 맞선 더 광범위한 아프가니스탄 전쟁에도 참여하게 되었습니다.\n\n[CZE_petr_pavel_scripted_gui_afghanistan_button_delayed_scripted_text]\n\n§Y전제 조건:§!\n[!CZE_petr_pavel_scripted_gui_afghanistan_button_click_enabled]\n\n§Y효과:§!\n[!CZE_petr_pavel_scripted_gui_afghanistan_button_click]"
 CZE_petr_pavel_scripted_gui_afghanistan_button_two_text_text: "[CZE_petr_pavel_scripted_gui_afghanistan_button_two_scripted_text]"
 CZE_petr_pavel_scripted_gui_afghanistan_button_two_scripted_text_one: "탈레반 대응 전략 계획"
 CZE_petr_pavel_scripted_gui_afghanistan_button_two_scripted_text_two: "§G탈레반 대응 전략 계획§!"
 CZE_petr_pavel_scripted_gui_afghanistan_button_two_delayed_text: "우리의 노력에도 불구하고 아프가니스탄은 여전히 우리의 도움이 필요합니다. 앞서 받은 훈련 덕분에 페트르 파벨은 훌륭한 공세 작전을 계획할 수 있을 것입니다. 이는 파벨의 경력에서 중요한 시험이 될 것이며, 이를 통과한다면 전쟁이 훨씬 빨리 끝날 수도 있습니다.\n\n[CZE_petr_pavel_scripted_gui_afghanistan_button_two_delayed_scripted_text]\n\n§Y전제 조건:§!\n[!CZE_petr_pavel_scripted_gui_afghanistan_button_two_click_enabled]\n\n§Y효과:§!\n[!CZE_petr_pavel_scripted_gui_afghanistan_button_two_click]"
 CZE_petr_pavel_scripted_gui_afghanistan_political_button_text_text: "[CZE_petr_pavel_scripted_gui_afghanistan_political_button_scripted_text]"
 CZE_petr_pavel_scripted_gui_afghanistan_political_button_scripted_text_one: "확고한 지원 작전"
 CZE_petr_pavel_scripted_gui_afghanistan_political_button_scripted_text_two: "§G확고한 지원 작전§!"
 CZE_petr_pavel_scripted_gui_afghanistan_political_button_delayed_text: "확고한 지원 임무(RSM) 또는 확고한 지원 작전은 아프가니스탄에서 나토가 주도한 다국적 임무였습니다. 2015년 1월 1일 국제안보지원군의 후속으로 시작되었습니다. 이는 아프가니스탄 안보군에 조언하고 훈련하여 나라에 장기적 안보를 제공하는 것을 목표로 한 비전투 임무였습니다.\n\n[CZE_petr_pavel_scripted_gui_afghanistan_political_button_delayed_scripted_text]\n\n§Y전제 조건:§!\n[!CZE_petr_pavel_scripted_gui_afghanistan_political_button_click_enabled]\n\n§Y효과:§!\n[!CZE_petr_pavel_scripted_gui_afghanistan_political_button_click]"
 CZE_petr_pavel_scripted_gui_afghanistan_political_button_two_text_text: "[CZE_petr_pavel_scripted_gui_afghanistan_political_button_two_scripted_text]"
 CZE_petr_pavel_scripted_gui_afghanistan_political_button_two_scripted_text_one: "탈레반 승리 전략"
 CZE_petr_pavel_scripted_gui_afghanistan_political_button_two_scripted_text_two: "§G탈레반 승리 전략§!"
 CZE_petr_pavel_scripted_gui_afghanistan_political_button_two_delayed_text: "탈레반과의 전쟁은 끝나지 않습니다. 탈레반을 다시 몰아붙일 새로운 전략을 준비할 때입니다. 안타깝게도 이러한 작전을 수행하려면 아프가니스탄 최고 사령부의 허가가 필요합니다. 그들이 거절한다면 페트르 파벨은 이번 임무 후 아프가니스탄에서의 훈련을 마쳐야 합니다.\n\n[CZE_petr_pavel_scripted_gui_afghanistan_political_button_two_delayed_scripted_text]\n\n§Y전제 조건:§!\n[!CZE_petr_pavel_scripted_gui_afghanistan_political_button_two_click_enabled]\n\n§Y효과:§!\n[!CZE_petr_pavel_scripted_gui_afghanistan_political_button_two_click]"
 CZE_adaptation_to_urban_fight_tactics_modifier: "도시전 전술 적응"
 CZE_skoda_laboratories_modifier: "슈코다 연구소"
 CZE_skoda_superb_productivity_modifier: "£GFX_CZE_skoda_small 슈코다 슈페르브 자동차 생산성 계수"
 CZE_petr_pavel_modifier: "페트르 파벨 임무"
 CZE_SLO_open_political_court: "정치 궁정 개설"
 CZE_SLO_open_political_court_desc: "체코슬로바키아가 붕괴한 뒤 체코 공화국과 슬로바키아는 독립 국가가 되었습니다. 두 나라는 문화와 역사, 관계를 공유합니다. 현재의 정치 목표는 다를 수 있지만 여전히 몇몇 공통의 프로그램을 공유합니다. 한 나라가 양국 모두에 영향을 미칠 수 있으며, 어쩌면 언젠가 재통합이 다시 가능해질지도 모릅니다."
 CZE_SLO_start_looking_into_the_future: "미래를 내다보기 시작하다"
 CZE_SLO_start_looking_into_the_future_desc: "공산주의는 유럽에서 완전히 물러났습니다. 이제 낡은 전통을 버리고 민주적이고 독립적인 태세로 나아갈 때입니다."
 CZE_SLO_question_divide: "분리에 대한 의문"
 CZE_SLO_question_divide_desc: "공산 정권은 우리 민족을 약화시켜 분열을 강요했고 거의 완전히 무너뜨렸습니다... 어쩌면 우리가 정말 열심히 노력한다면 다시 하나의 나라가 될 수 있을지도 모릅니다."
 CZE_SLO_close_up_of_the_governments: "정부 간 밀착"
 CZE_SLO_close_up_of_the_governments_desc: "두 정부는 공통된 목표를 공유하며 견해 차이도 근소합니다. 서로 조금 더 보조를 맞춰 볼 수 있습니다."
 CZE_SLO_upgrade_industrial_sector: "산업 부문 고도화"
 CZE_SLO_upgrade_industrial_sector_desc: "우리 산업은 군수 부문에 매우 치우쳐 있었습니다. 그 대신 민수 산업을 지향해야 합니다."
 CZE_SLO_stop_border_controls: "국경 통제 중단"
 CZE_SLO_stop_border_controls_desc: "우리 두 민족을 더 이상 갈라놓을 필요가 없습니다. 국경 제한은 불필요합니다."
 CZE_SLO_d1_highway_construction: "D1 고속도로 건설"
 CZE_SLO_d1_highway_construction_desc: "엄밀히 말해 D1 고속도로는 두 개입니다. 하나는 체코 공화국에, 다른 하나는 슬로바키아에 있습니다. 함께하면 마침내 이 사업들을 끝낼 수 있습니다."
 CZE_SLO_discuss_about_european_union: "유럽 연합에 관한 논의"
 CZE_SLO_discuss_about_european_union_desc: "저 유명한 유럽 연합입니다. 좋은 것이기는 하나, 어쩌면 더 중립적인 길을 고려해야 할지도 모릅니다."
 CZE_SLO_protect_democratic_values: "민주주의 가치 수호"
 CZE_SLO_protect_democratic_values_desc: "그렇다면 실제로 나머지 유럽과 함께하는 편이 낫습니다. 양국 모두 그 덕을 볼 것입니다."
 CZE_SLO_stay_neutral: "중립 유지"
 CZE_SLO_stay_neutral_desc: "우리 두 민족은 EU의 도움 없이도 잘 발전하고 있습니다. 우리는 괜찮을 것입니다."
 CZE_SLO_further_eu_integration: "EU 통합 심화"
 CZE_SLO_further_eu_integration_desc: "EU 국가들과 더 우호적일수록, 그들이 미래에 우리의 가입을 받아들일 가능성이 높아집니다."
 CZE_SLO_focus_on_internal_sphere: "내부 영역 집중"
 CZE_SLO_focus_on_internal_sphere_desc: "우리 민족에게는 외부에도, 국경 안에도 적이 있습니다. 우리는 강해야 하며 적들이 우리의 결정에 영향을 미치게 해서는 안 됩니다."
 CZE_SLO_secure_common_interests: "공동 이익 확보"
 CZE_SLO_secure_common_interests_desc: "자금을 아끼고 부채를 줄여야 합니다. 이는 향후 발전에 도움이 될 것입니다."
 CZE_SLO_nato_problem: "나토 문제"
 CZE_SLO_nato_problem_desc: "나토는 특히 큰 나라에 군 발전에 대한 매우 높은 압력을 가하는 동맹입니다. 그러나 큰 군대를 갖추는 것이 필수 요건은 아닙니다. 어쩌면 더 내부 중심의 해법을 고려해야 할지도 모릅니다."
 CZE_SLO_mutual_army_training: "공동 군사 훈련"
 CZE_SLO_mutual_army_training_desc: "체코인과 슬로바키아인은 수많은 분쟁에서 함께 싸웠습니다. 우리는 다시 단결하여 함께 싸워야 합니다."
 CZE_SLO_join_nato_conflicts: "나토 분쟁 참여"
 CZE_SLO_join_nato_conflicts_desc: "나토군은 오늘날의 수많은 분쟁에 투입되어 있습니다. 우리도 그들과 함께하며 그들의 전투 방식에서 많은 군사 경험을 얻을 수 있습니다."
 CZE_SLO_regional_protectionism: "지역 보호주의"
 CZE_SLO_regional_protectionism_desc: "체코슬로바키아는 언제나 더 방어적인 해법을 선호해 왔습니다. 세계적 분쟁에 참여하기보다 지역 보호주의에 집중해야 합니다."
 CZE_SLO_connect_army_doctrines: "군 교리 연계"
 CZE_SLO_connect_army_doctrines_desc: "우리의 교리는 비슷하지만 약간 다릅니다. 공통 교리를 도입하면 이를 쉽게 해결할 수 있습니다."
 CZE_SLO_re_integration_project: "재통합 프로젝트"
 CZE_SLO_re_integration_project_desc: "우리는 이미 너무 오랫동안 갈라져 있었습니다. 이제 진지하게 받아들여 재통합 프로젝트를 시작할 때이며, 이를 통해 우리 두 민족은 하나의 깃발 아래 다시 하나가 될 수 있습니다."
 CZE_SLO_begin_reforming_czechoslovakia: "체코슬로바키아 재건 개시"
 CZE_SLO_begin_reforming_czechoslovakia_desc: "우리의 계획은 두 나라의 평화적인 통일을 전제로 합니다. 우리는 국민이 이것이 좋은 생각이라고 확신하도록 만들고, 새 법률을 준비하며, 이것이 반역 같은 것이 아니라고 군의 지지를 얻어야 합니다... 할 일이 많으니 서둘러 움직입시다!"
 CZE_SLO_no_more_dividing: "더 이상의 분열은 없다"
 CZE_SLO_no_more_dividing_desc: "우리는 마침내 두 민족을 통합할 준비가 되었습니다. 마지막 단계는 이웃 나라에 달려 있습니다. 그들이 우리의 제안을 받아들인다면 체코슬로바키아는 다시 일어설 것입니다."
 CZE_SLO_defensive_posture: "방어 태세"
 CZE_SLO_defensive_posture_desc: "체코슬로바키아는 언제나 방어 교리를 지향했습니다. 다른 나라를 침공하기보다 우리 민족을 지키는 것이 더 중요합니다."
 CZE_SLO_bring_back_sudetenland_forts: "주데텐란트 요새 복원"
 CZE_SLO_bring_back_sudetenland_forts_desc: "독일은... 복잡한 이웃입니다. 과거의 체코슬로바키아는 훌륭한 방어선을 활용하기도 전에 주데텐란트의 통제권을 잃었습니다. 우리는 그 실수를 되풀이하지 않을 것입니다."
 CZE_SLO_improve_strategic_targets: "전략 목표 개선"
 CZE_SLO_improve_strategic_targets_desc: "우리의 해외 수도들은 현재 방어해야 할 가장 중요한 전략 요충지입니다. 아무도 그곳의 요새를 돌파하지 못하도록 하겠습니다."
 CZE_SLO_advantage_of_mountain_areas: "산악 지대의 이점"
 CZE_SLO_advantage_of_mountain_areas_desc: "체코의 주데텐란트와 슬로바키아의 카르파티아가 있습니다. 우리에게는 산악병을 훈련시키고 통과하기 가장 어려운 산길을 요새화하기에 완벽한 지형이 있습니다."
 CZE_SLO_homeland_defence: "본토 방위"
 CZE_SLO_homeland_defence_desc: "우리 병사들은 자국 영토에서만 훈련해 왔습니다. 이제 우리는 한 나라 안에 두 민족이 있습니다. 지형은 비슷하지만, 우리 군은 여전히 국토의 모든 땅을 지키는 법을 배워야 합니다."
 CZE_SLO_power_of_the_two_economies: "두 경제의 힘"
 CZE_SLO_power_of_the_two_economies_desc: "체코 공화국에는 슈코다와 타트라 같은 강력한 산업 기업들이 있습니다. 슬로바키아도 자동차 산업을 발전시켜 왔습니다. 두 나라의 기업들이 함께 일하기 시작한다면, 독일의 폭스바겐보다도 자동차 시장에 더 큰 영향을 미칠 수 있을지도 모릅니다."
 CZE_SLO_blur_industrial_differences: "산업 격차 해소"
 CZE_SLO_blur_industrial_differences_desc: "일부 지역은 다른 지역보다 빠르게 발전했습니다. 새로운 건설 프로그램은 취약한 지역의 발전을 도와 우리 산업을 더 분산시킬 것이며, 이는 전쟁 시 적이 우리 경제를 파괴하기 더 어렵게 만들 것입니다."
 CZE_SLO_slovakian_nuclear_reactors: "슬로바키아 원자로"
 CZE_SLO_slovakian_nuclear_reactors_desc: "체코 과학자들의 도움으로 슬로바키아 지역은 원자로를 개선하고 새로운 원자로 블록 건설을 준비할 수 있습니다."
 CZE_SLO_take_advantage_of_green_energy: "친환경 에너지 활용"
 CZE_SLO_take_advantage_of_green_energy_desc: "재생 에너지는 우리나라와 전 세계의 미래입니다. 원자로는 배출이 적거나 없는 훌륭한 에너지 발전원입니다. 이러한 방식의 에너지 생산을 촉진하기 위해 최선을 다해야 합니다."
 CZE_SLO_intensify_coal_extraction: "석탄 채굴 강화"
 CZE_SLO_intensify_coal_extraction_desc: "우리 발밑에는 아직 석탄과 가스 등 천연 에너지원이 많이 남아 있습니다. 친환경 에너지로 전환하기 전에 이 광산들을 고갈시켜 자원을 하나도 낭비하지 않는 것이 좋습니다."
 CZE_SLO_czechoslovakian_army: "체코슬로바키아군"
 CZE_SLO_czechoslovakian_army_desc: "우리는 언제나 내부 안보와 억지 전략을 지지해 왔습니다. 그 덕분에 우리가 얻은 것이 무엇입니까? 독일과 소련의 점령입니다. 방어 방식은 우리를 실패하게 했으니, 180도 방향을 틀어 공세적 접근을 위해 군을 준비하기 시작할 때입니다."
 CZE_SLO_military_concerns: "군수 기업"
 CZE_SLO_military_concerns_desc: "체코의 VOP CZ는 잘 알려진 군용 차량 제조업체입니다. 이 기업이 더 낫고 빠르게 발전하도록 도와 우리 군도 더 빨리 성장하게 하겠습니다."
 CZE_SLO_always_be_ready_for_war: "항상 전쟁에 대비하라"
 CZE_SLO_always_be_ready_for_war_desc: "적은 우리가 예상하지 못할 때 공격할 수도 있습니다. 이제부터 우리 군을 놀라게 할 것은 아무것도 없습니다."
 CZE_SLO_begin_smaller_demands: "소규모 요구 개시"
 CZE_SLO_begin_smaller_demands_desc: "모두가 우리에게 무언가를 요구해 왔으니, 이제 우리가 그들에게 요구할 차례입니다. 우리는 오래전에 잃은 영토를 되찾으려 합니다."
 CZE_SLO_claim_zaolzi: "자올지에 영유권 주장"
 CZE_SLO_claim_zaolzi_desc: "폴란드, 폴란드, 폴란드... 자올지에는 우리의 것이어야 하며, 귀국 남부 지역의 절반 또한 마찬가지입니다."
 CZE_SLO_forever_together: "영원히 함께"
 CZE_SLO_forever_together_desc: "최근의 개혁과 군사적 변화는 우리의 공통된 방식에 매우 잘 맞는 것으로 드러났습니다. 체코슬로바키아는 진정으로 개혁되었으며 그 무엇도 다시는 우리를 갈라놓지 못할 것입니다."
 CZE_SLO_diplomatic_proposition: "외교적 제안"
 CZE_SLO_diplomatic_proposition_desc: "그들이 우리와 통합하도록... 설득하기 전에, 지금 당장 싸우지 않고 항복하라는 제안을 건넬 수 있습니다."
 CZE_SLO_rapid_intervention: "신속 개입"
 CZE_SLO_rapid_intervention_desc: "외교는 이 프로젝트에 도움이 되지 않을 것입니다. 더 무자비한 조치를 취할 때입니다."
 CZE_SLO_new_dawn_of_czechoslovakia: "체코슬로바키아의 새로운 여명"
 CZE_SLO_new_dawn_of_czechoslovakia_desc: "우리 나라들은 다시 하나가 되었습니다. 마침내 오래전에 잃어버린 체코슬로바키아를 다시 세울 때입니다. 이번에는 새로운 체제 아래에서 말입니다."
 CZE_SLO_far_reaching_ambitions: "원대한 야망"
 CZE_SLO_far_reaching_ambitions_desc: "이제 무엇이 우리의 옛 영토를 되찾고 더 멀리 뻗어나가는 것을 가로막겠습니까? 천 년기 초의 평화로운 여명은 오래전에 끝났습니다."
 CZE_SLO_restore_sudetenland_forts: "주데텐란트 요새 복구"
 CZE_SLO_restore_sudetenland_forts_desc: "독일은 믿을 수 없습니다. 어리석은 과거의... 음, 과거 체코슬로바키아 정부 중 하나는 외국 침략자들로부터 나라를 지키지 못했습니다. 이제 아무도 우리의 굴복을 아무런 대가 없이 요구하지 못할 것입니다!"
 CZE_SLO_western_charge: "서방 돌격"
 CZE_SLO_western_charge_desc: "나토는 40년이 넘도록 우리를 공산 정권 아래 내버려 둔 대가를 치르게 될 것입니다! 서유럽이여 각오하라, 우리가 너희를 치러 간다, 이 배신자 쓰레기들아!"
 CZE_SLO_ensure_dominance_in_the_center_europe: "중부 유럽 패권 확보"
 CZE_SLO_ensure_dominance_in_the_center_europe_desc: "가장 가까운 이웃들은 여러 차례 우리 민족을 공격해 왔습니다. 우리는 헝가리에 승리했지만 전사한 병사들과 민간인들은 아무도 되살려 주지 못합니다. 모두가 과거 정부들의 잘못에 대한 대가를 치르게 될 것입니다!"
 CZE_SLO_protect_the_karpaty_mountains: "카르파티아 산맥 수호"
 CZE_SLO_protect_the_karpaty_mountains_desc: "우크라이나는 강한 나라이지만 카르파티아 지역은 그다지 크지 않아, 여러 방향에서 동시에 공격받으면 정복하기가 매우 쉬울 수 있습니다. 우리는 산악 통로를 강화해야 합니다."
 CZE_SLO_eastern_charge: "동방 돌격"
 CZE_SLO_eastern_charge_desc: "41년... 41년간의 공산 정권이었습니다. 러시아는 언제나 제국주의적 야망을 품고 있었습니다. 소련이든 러시아 연방이든, 새 정부는 언제나 이전 정부보다 더 나빠지려고 합니다. 더 이상의 억압은 없습니다. 마침내 그들에게 반격할 때입니다!"
 CZE_SLO_post_unification_chaos: "통일 이후의 혼란"
 CZE_SLO_post_unification_chaos_desc: "우리의 공세적인 외교는 많은 불만과 미처리된 서류를 남겼습니다. 이 혼란을 수습해야 할 것 같습니다..."
 CZE_SLO_media_propaganda: "언론 선전"
 CZE_SLO_media_propaganda_desc: "사람들은 텔레비전이 보여 주는 모든 것을 믿을 것입니다. 인터넷을 이용해 신뢰할 만한 사이트에 대응할 수도 있습니다."
 CZE_SLO_form_new_parliament: "신 의회 구성"
 CZE_SLO_form_new_parliament_desc: "병합한 이웃 나라의 정치인들을 의회에 들이면 그쪽에서 더 많은 수용을 얻을 수 있으며, 그들이 행정을 안정시키는 데 도움을 줄 것입니다."
 CZE_SLO_ensure_loyalty_in_the_army: "군의 충성 확보"
 CZE_SLO_ensure_loyalty_in_the_army_desc: "페트르 파벨이라는 어떤 체코 장군이 있습니다. 그는 이 혼란에 가담하고 싶어 하지 않지만, 앞으로 우리에게 많은 문제를 일으킬 수 있을 것 같은 느낌이 듭니다... 어쨌든 군이 반란을 일으키고 있으며 전복당하고 싶지 않다면 이를 막아야 합니다."
 CZE_SLO_return_of_the_heavy_industry: "중공업의 귀환"
 CZE_SLO_return_of_the_heavy_industry_desc: "체코 지역에는 지난 세기에 군사 장비를 생산하던 군수 기업이 많이 있습니다. 이들에게 접촉해 군수 공장 일부를 복구해야 합니다."
 CZE_SLO_new_skoda_works_factory: "신 슈코다 공장"
 CZE_SLO_new_skoda_works_factory_desc: "슈코다는 과거에 군용 차량과 기계화 트럭을 생산했습니다. 그들이 이런 종류의 장비를 어떻게 만드는지 아직 기억하는지 확인해 봅시다."
 CZE_SLO_restoration_of_the_zbrojovka_brno: "즈브로요프카 브르노 복구"
 CZE_SLO_restoration_of_the_zbrojovka_brno_desc: "즈브로요프카 브르노는 체코 공화국 브르노에 있는 소형 화기 제조업체로, 콜트-CZ 그룹이 전액 소유하고 있습니다. 과거에는 경포, 자동차, 오토바이, 트랙터, 그리고 타자기와 초기 컴퓨터 같은 각종 도구도 생산했습니다."
 CZE_SLO_modernized_tanks_production: "전차 현대화 생산"
 CZE_SLO_modernized_tanks_production_desc: "옛 슈코다 설계도 덕분에 그 시제품을 현대화하여 최신 전쟁 환경에 맞게 개조할 수 있습니다."
 CZE_SLO_cooperation_with_vop_cz: "VOP CZ와의 협력"
 CZE_SLO_cooperation_with_vop_cz_desc: "VOP CZ는 체코 공화국에서 여전히 활동하고 있습니다. 이 기업은 무기 생산을 한 번도 그만둔 적이 없으며 훌륭한 협력 파트너가 될 것입니다."
 CZE_SLO_mass_equipment_production: "장비 대량 생산"
 CZE_SLO_mass_equipment_production_desc: "때로는 건설 시간이 늘어나는 대가를 치르더라도 공장을 더 빠르게 돌려야 합니다."
 CZE_SLO_czechoslovakia_category: "체코슬로바키아 정세"
 CZE_SLO_czechoslovakia_category_desc: "체코슬로바키아는 제1차 세계 대전 말 동맹국이 항복한 뒤 세워졌습니다. 이 나라는 제2차 세계 대전이 일어나기 1년 전 제3제국에 병합되기 전까지 유럽에서 비교적 안정된 나라 중 하나로 빠르게 자리 잡았습니다. 이때 첫 번째 분열이 일어나 보헤미아-모라비아와 슬로바키아 공화국이 수립되었습니다. 전쟁은 다시 독일의 패배로 끝났고, 체코슬로바키아는 제3 체코슬로바키아 공화국으로서 국경이 복원되었습니다.\n\n1948년 소련이 개입하여 공산 정권을 수립했고 제3 체코슬로바키아 공화국은 체코슬로바키아 사회주의 공화국으로 개칭되었습니다. 이 나라는 1989년 반공 시위를 계기로 벨벳 혁명을 일으켜 공산주의를 무너뜨렸습니다. 41년간의 공산주의 지배는 나라를 불안정하게 하고 국민을 분열시켰으며, 1992년 12월 31일 체코슬로바키아의 붕괴로 이어졌습니다. 체코 공화국과 슬로바키아는 서로 다른 두 정부와 국경, 외교를 가진 독립 국가가 되었습니다.\n\n하지만 국민은 그대로였고 문화와 역사도 마찬가지였습니다. 몇 해 전에는 분열이 불가피했지만, 상황이 다시 안정되는 오늘날에는 재결합의 기회가 있을지도 모르며, 약간의 결정적인 추진력만 있다면 두 나라는 다시 하나가 될 수 있습니다."
 CZE_SLO_stop_reunification: "재통일 중단"
 CZE_SLO_stop_reunification_desc: "체코슬로바키아의 부활은 우리 민족에게 좋은 일을 가져오지 않을 것입니다. 너무 늦기 전에 이 절차를 중단합시다."
 CZE_SLO_welfare_sector: "§C복지 부문 개방§!"
 CZE_SLO_welfare_sector_desc: "분리로 인해 우리 국민은 갈라졌습니다. 그들을 다시 하나의 민족으로 만들고 싶다면 우리는 함께 노력해야 합니다."
 CZE_SLO_welfare_sector_close: "§C복지 부문 폐쇄§!"
 CZE_SLO_welfare_sector_announce_cooperation_in_media: "언론에 협력 발표"
 CZE_SLO_welfare_sector_organize_common_events: "공동 행사 개최"
 CZE_SLO_welfare_sector_increase_culture_expenditure: "문화 지출 확대"
 CZE_SLO_welfare_sector_decrease_opinion_mission: "§R국민 여론 하락§!"
 CZE_SLO_welfare_sector_decrease_opinion_mission_desc: "우리의 강압적인 개입은 국민들이 최근의 행동에 불만을 품게 만들었습니다... 대중을 진정시킬 필요가 있을 것입니다."
 CZE_SLO_welfare_sector_seek_support_among_politicians: "정치인들 사이에서 지지 모색"
 CZE_SLO_welfare_sector_media_propaganda: "언론 선전"
 CZE_SLO_law_sector: "§O법률 부문 개방§!"
 CZE_SLO_law_sector_desc: "우리에게는 두 개의 헌법이 있지만 이 둘은 매우 비슷합니다. 우리 나라들은 서로 다른 정부를 구성하고 서로 다른 법을 도입했습니다. 이러한 차이를 없애고 법을 하나로 만들어야 합니다."
 CZE_SLO_law_sector_close: "§O법률 부문 폐쇄§!"
 CZE_SLO_law_sector_change_the_criminal_law: "형법 통합"
 CZE_SLO_law_sector_change_the_constitutional_law: "헌법 개정"
 CZE_SLO_law_sector_change_the_civil_law: "민법 개정"
 CZE_SLO_law_sector_change_the_labor_law: "신 노동법"
 CZE_SLO_law_sector_decrease_opinion_mission: "§R법률 유사도 하락§!"
 CZE_SLO_law_sector_decrease_opinion_mission_desc: "법을 통합하지 않은 채 이웃 나라를 병합했기 때문에 행정은 이제 완전한 혼란에 빠졌습니다. 관청과 의회를 정비하지 않으면 우리는 완전한 무정부 상태로 치달을 것입니다!"
 CZE_SLO_law_sector_quick_law_change: "신속한 법률 개정"
 CZE_SLO_law_sector_reform_the_administration: "행정 개혁"
