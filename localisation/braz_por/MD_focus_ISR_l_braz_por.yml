 israel.112.d: "Recentemente, depois que [HAM.GetNameWithFlag] capturou três cidadãos israelenses, [HAM.GetNameWithFlag] teve sucesso contra as forças israelenses."
 israel.112.a: "Um golpe doloroso."
 israel.112.b: "Allahu Akbar!"
