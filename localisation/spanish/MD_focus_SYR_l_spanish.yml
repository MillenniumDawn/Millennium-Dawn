 FSA_rebel_fighting_spirit_idea: "Espíritu rebelde y luchador"
 FSA_rebel_fighting_spirit_idea_desc: "El Ejército Libre Sirio ha comenzado con espíritu combativo y está dispuesto a luchar contra el régimen de Al-Assad. Están dispuestos a luchar por la libertad del país y por los derechos del pueblo."
 SyriaFocus.108.d1: "Hemos establecido una potente industria de animación. Gracias a la cooperación de nuestros estudios con Japón y a nuestro fuerte impulso digital, muchas obras destacadas han llegado a un gran público dentro y fuera del país."
 SyriaFocus.108.d2: "Hemos establecido una potente industria de animación. Gracias a la cooperación de nuestros estudios con China y a nuestro fuerte impulso digital, muchas obras destacadas han llegado a un público amplio dentro y fuera del país."
 SyriaFocus.108.d3: "Gracias a una fuerte inversión en digitalización, hemos formado nuestra propia y respetable industria de animación, responsable de la creación de obras notables que han ganado popularidad tanto dentro como fuera del país. Hemos mostrado al mundo la creatividad de nuestra gente y la estética distintiva que poseemos."
