 UKR_crimean_bop_central_asia_phase_3_desc: "§WFinance the 3. phase of organized §YCrimean Tatar§! repatriation from consenting Central Asian partners to §Y[669.GetName]§!.§!\n\n§YBudget:§! §R$950 million§!\n§YDuration:§! 300 days\n§YMaximum migration:§! §G+9,000 residents§! in §Y[669.GetName]§! and an equivalent decrease in the source states.\n§YMaximum political effect:§! §G+9 influence points§! influence: §YCrimean Tatars§!; §R−9 influence points§! influence: [SOV.GetFlag] §Y[SOV.GetName]§!.\n\n§YRequires at least one eligible partner to consent.§! §LMigration and influence scale with the eligible partners at completion. The budget is fixed.§!"
