 SAU_pc_works_finished_tt: "§GСтандарт соблюден§! - Провинция сохраняет достигнутые улучшения, а Совет поднимает планку на следующий раз."
 SAU_pc_works_gate_tt: "Номер §Hstanding§! Совета — как минимум §Y60§! (теперь §Y[?SAU_pc_standing|0]§! или §Y100§!)"
 SAU_pc_works_named_tt: "Совет назначает провинцию и устанавливает ее стандарты. §Y[?SAU_pc_mandate_civ|0]§! гражданские заводы, §Y[?SAU_pc_mandate_off|0]§! офисы и §Y[?SAU_pc_mandate_inf|0]§! инфраструктура, или столько, сколько позволит провинция."
 SAU_pc_works_somewhere_tt: "Существует ключевая провинция, которую Совет еще не улучшил, и в которой еще многое можно сделать."
