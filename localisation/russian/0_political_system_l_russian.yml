 FULL_POLITICS_VIEW_BUTTON_TT: "Развернуть представление группы"
 si_title_text: "Партии и движения"
 si_title_text_tt: "§YТекущие политические законы:§!\nЕсть выборы: [has_elections_check]\nЭлекторальный порог: [?election_threshold|%0] [term_limit_text]\"western_desc: \"Западные и прозападные правительства стремятся сохранить либеральный мировой порядок с центром в США, который господствовал после падения Советского Союза. Через такие институты, как Всемирный банк и МВФ, они продвигают экономическую либерализацию и денационализацию. Хотя подавляющее большинство стран с западным мировоззрением являются различными формами демократий, за ними стоят также прозападные сильные правительства, извлекающие выгоду из статус-кво."
 western_desc: "Западные и прозападные правительства стремятся сохранить ориентированный на США либеральный мировой порядок, господствующий со времен распада Советского Союза. Через такие институты, как Всемирный банк и МВФ, они продвигают экономическую либерализацию и денационализацию. Хотя подавляющее большинство стран с западным мировоззрением представляют собой различные формы демократии, их поддерживают и прозападные авторитарные правительства, извлекающие выгоду из существующего положения вещей."
 emerging_desc: "Правительства с формирующимся мировоззрением — это прежде всего государства Глобального Юга и постсоветского пространства, стремящиеся заменить господствующий либеральный мировой порядок собственными альтернативными институтами и многополярным подходом к глобальной политике. Они часто по-разному относятся к глобализации, формам правления и внутренней политике."
 salafist_desc: "Салафизм — ультраконсервативная, нетерпимая, фундаменталистская ветвь основного суннитского ислама. Он приобрёл известность, поскольку ваххабитские монархии Залива с середины XX века предоставили миллиарды на финансирование его учений. Салафизм проявился в особенно жестоких воплощениях в Талибане, Аль-Каиде и ИГИЛ."
 non_aligned_desc: "Неприсоединившиеся правительства сильно различаются по типам правления и суб-идеологиям и обычно придерживаются весьма прагматичного подхода к своим внешним союзам. Многие просто хотят укрепить собственную национальную независимость или другие региональные цели. Другие разрываются между великими державами, которые в борьбе за влияние тянут их в разные стороны."
 communist_state_pop_election: "Получила [?party_pop_elect_array^4|%1] на последних выборах"
 generic.communist_state: "£generic_Communist_State_small Коммунисты"
 generic.communist_state_desc: "Коммунизм в широком смысле обозначает идеологию, выступающую за конец капиталистической системы ради создания общего рабочего рая. В действительности коммунистические государства сохраняют капиталистические экономические системы и часто по своей природе недемократичны."
 generic.communist_state_icon: "£generic_Communist_State_small"