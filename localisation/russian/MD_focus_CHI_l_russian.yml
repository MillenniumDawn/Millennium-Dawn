 CHI_legitimacy_concentrated_desc: "Постоянному комитету Политбюро больше не нужен кворум — окружение генерального секретаря слилось с сетью. Центральная комиссия по дисциплинарной инспекции теперь носит чисто формальный характер."
 CHI_Lips_and_Teeth: "Lips and Teeth"
 CHI_Lips_and_Teeth_desc: "Историческая характеристика китайско-северокорейских отношений как «тесных, как губы и зубы» определяет политику Китая со времён Корейской войны. Официальное закрепление этой доктрины обязывает Китай обеспечивать выживание режима Кима и углублять связи с Пхеньяном в ущерб более широкому примирению на Корейском полуострове."
 CHI_mass_line_campaign: "Mass Line Campaign"
 CHI_mass_line_campaign_desc: "Чиновников направляют в сельские населённые пункты, где они обязаны обедать вместе с фермерами и составлять отчёты о положении дел на местах. Из государственных учреждений изымаются предметы роскоши, а расточительные государственные расходы подвергаются публичному осуждению. Эта кампания меняет поведение чиновников на глазах у общественности и сдерживает неформальное потребление, в результате которого государственные ресурсы утекали в частные каналы."
 CHI_Mount_Paektu_Understanding: "Mount Paektu Understanding"
 CHI_Mount_Paektu_Understanding_desc: "Секретное двустороннее соглашение, заключенное в тени горы Пэкту — мифологизированного места зарождения династии Ким, — закрепляет порядок проведения китайских консультаций по вопросам безопасности с военным руководством Северной Кореи."
