l_japanese:
 Solomon_Islands.1.t: "ムンダ合意"
 Solomon_Islands.1.d: "コモンウェルス特別特使のシティヴェニ・ラブカによる集中的な仲介を経て、州政府と野党指導者らはムンダ合意に署名した。この合意では、民族間の暴力の沈静化を図り、憲法改正に向けたロードマップを確立することを目的とした9項目計画が盛り込まれている。"
 Solomon_Islands.1.a: "不安定な平和でも、平和じゃないよりはマシだ"
 Solomon_Islands.1.b: "協定を葬り去れ"
 Solomon_Islands.2.t: "マライタ・イーグル・フォースによるクーデター"
 Solomon_Islands.2.d: "政治情勢は限界点に達した。今朝早く、準軍事警察部隊の一部から支援を受けたと報じられているマライタ・イーグル・フォースの構成員が、ホニアラ市内の主要な戦略拠点を制圧した。[SOL.GetLeader]首相は銃を突きつけられ、自宅で軟禁状態に置かれている。マライタ・イーグル・フォースの指導部は、政府がマライタ人の利益を守れなかったと主張し、直ちなる政権移譲を要求している。民主的なプロセスは事実上停止された。"
 Solomon_Islands.2.a: "マナセ・ソガヴァレ"
 Solomon_Islands.2.b: "ジミー・“ラスタ”・ルシバエア"
 Solomon_Islands.3.t: "イサタブ自由運動によるホニアラへの襲撃"
 Solomon_Islands.3.d: "イサタブ自由運動は、島からマライタ人の影響力を排除するため、大規模な反撃を開始した。ゲリラ兵たちがジャングルから現れ、首都ホニアラを包囲している。公式の警察組織が民族間の対立によって分裂したため、同国は全面的な内戦状態に陥っている。イサタブ自由運動は、マライタ人入植者の全面追放を要求している一方、政府支配下の政権は、都市中心部を守るための血なまぐさい防衛戦に備えている。"
 Solomon_Islands.3.a: "太平洋での戦争"
 Solomon_Islands.4.t: "ソロモン諸島での危機"
 Solomon_Islands.4.d: "[SOL.GetNameWithFlag]は、内政崩壊の状態に陥っている。[SOL.GetLeader]首相率いる政権は、イサタブ自由運動とマライタ・イーグル・フォース間の緊張の高まりにより、機能不全に陥っている。この紛争の根底には、ガダルカナル島への国内移住をめぐる争いや先住民の土地権をめぐる紛争がある。特に深刻なのは、ゴールド・リッジ鉱山をはじめとする重要な産業が操業を停止しており、南太平洋における我々の経済的利益が脅かされている点である。"
 Solomon_Islands.4.a: "この不安定な状況を無視することはできない。"
 Solomon_Islands.4.b: "誰が気にする？私は[ROOT.GetLeader]だぞ。"
 Solomon_Islands.5.t: "調停の申立て"
 Solomon_Islands.5.d: "人道的惨事を未然に防ぐための必死の試みとして、[FROM.GetNameWithFlag]は、我々に平和サミットの開催を正式に要請してきた。彼らの提案では、民族派閥をなだめるため、地方分権化と自治改革を通じた和解の枠組みが示されている。さらに、過激派の干渉によって改革プロセスが中断されないよう、行政・軍事顧問団の派遣も要請している。"
 Solomon_Islands.5.a: "和平プロセスを受け入れる"
 Solomon_Islands.5.b: "これは我々の問題だ。余所者は帰ってくれ。"
 Solomon_Islands.6.t: "調停の拒否"
 Solomon_Islands.6.d: "[SOL.GetNameWithFlag]は、現在進行中の危機について我々が提案した仲介をきっぱりと拒否した。指導部は厳しい声明の中で、自国の内政に対する新植民地主義的な干渉は決して容認しないと述べた。同国は、外国の顧問や外交的干渉を歓迎しないことを明確にし、ソロモン諸島は外部の監視なしに自らの紛争を解決すると主張している。"
 Solomon_Islands.6.a: "そうなれば、その代償は彼らだけで背負うことになるだろう。"
 Solomon_IslandsNews.1000.t: "オーストラリアによるソロモン諸島での停戦仲介"
 Solomon_IslandsNews.1000.d: "クイーンズランド州タウンズビルのオーストラリア空軍基地で数日間にわたる交渉が行われた結果、妥協案がまとまり、[SOL.GetNameWithFlag]政府は包括的な平和条約に署名した。[AST.GetNameWithFlag]は、30日間の銃器引き渡し期間および引き渡された武器の廃棄を監督するため、国際平和監視団を率いることを約束した。一方、[AST.capital.GetName]は任務の拡大に依然として警戒感を抱いている。"
 Solomon_IslandsNews.1000.a: "ソロモン諸島に安定が戻る"
 Solomon_IslandsNews.1001.t: "ソロモン諸島での停戦"
 Solomon_IslandsNews.1001.d: "[FROM.GetNameWithFlag]は、[SOL.GetNameWithFlag]の対立する派閥間の停戦交渉を成功裏に仲介した。この合意には、武装解除と憲法改正に向けたロードマップが盛り込まれている。すべての当事者は、敵対行為の即時停止と中立的な監視部隊の設置に合意した。"
 Solomon_IslandsNews.1001.a: "ソロモン諸島に安定が戻る"
 Solomon_IslandsNews.1002.t: "ソロモン諸島でクーデター"
 Solomon_IslandsNews.1002.d: "マライタ系武装組織であるマライタ・イーグル・フォースが首都を掌握した。盗んだ警察の武器を用い、さらに警察機動部隊の離反分子の支援を受けたマライタ・イーグル・フォースは、本日早朝、首相バーソロミュー・ウルファアルの邸宅を包囲した。厳重な監視下に置かれ、市内の武器庫も反乱側の手に落ちる中、ウルファアルは辞任を余儀なくされた。現在、マライタ・イーグル・フォースに支援された政府が、ホニアラにおける唯一の権威であると主張している。"
 Solomon_IslandsNews.1002.a: "迫り来る嵐"
 Solomon_IslandsNews.1003.t: "ソロモン諸島で反乱が発生"
 Solomon_IslandsNews.1003.d: "内戦はイサタブ自由運動の完全な勝利をもって終結した。長期にわたるゲリラ戦を経て、イサタブ自由運動は、ホニアラにおけるマライタ・イーグル・フォースと結託した政権の崩壊を成功裏に引き起こした。"
 Solomon_IslandsNews.1003.a: "ホニアラで民主主義が崩壊した。"
 Solomon_IslandsNews.1004.t: "ソロモン諸島内戦の終結"
 Solomon_IslandsNews.1004.d: "内戦はイサタブ自由運動の完全な勝利をもって終結した。長期にわたるゲリラ戦を経て、イサタブ自由運動は、ホニアラにおけるマライタ・イーグル・フォースと結託した政権の崩壊を成功裏に引き起こした。"
 Solomon_IslandsNews.1004.a: "次の章は？"
 Solomon_IslandsNews.1005.t: "ソロモン諸島内戦の終結"
 Solomon_IslandsNews.1005.d: "マライタ・イーグル・フォースと国家警察の残存部隊による共同作戦により、イサタブ自由運動の反乱はついに鎮圧された。ガダルカナル島内陸部への激しい攻勢の末のことである。"
 Solomon_IslandsNews.1005.a: "次の章は？"
 SOL_Histoical_path_TT: "これは[SOL.GetNameWithFlag]の§Y歴史的選択§!である"
 SOL_Lead_to_hostilities_TT: "これにより、[SOL.GetNameWithFlag]で§R敵対行為§!が発生する。"
 SOL_IFM: "イサタブ自由運動"