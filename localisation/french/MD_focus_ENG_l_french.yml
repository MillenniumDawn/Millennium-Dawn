 ENG_create_new_faction_TT: "Créera une nouvelle faction : Organisation de sécurité atlantique\n\nNous pourrons renverser des gouvernements étrangers grâce aux [ADS.GetFlag] Albionis !\n - Nous obtenons 3 utilisations de cette capacité, disponible via le menu d'influence par le bouton de coup. Une option supplémentaire apparaîtra, permettant d'employer les [ADS.GetFlag] Albionis pour renverser ledit gouvernement en Europe, vous octroyant un vassal et un allié."
 ENG_collapse_of_society_TT: "£text_icon_kaldanger Choisir cette option peut entraîner le renversement du gouvernement !\n - Cela nous permettra de suivre les focuses §HRoyaume fracturé, État uni§!\n - L'armée interviendra à un moment donné et prendra les rênes de l'État"
 ENG_do_fp_TT: "Has completed at least §H3§! £GFX_text_icon_uk_flag Foreign Policy focuses"
 ENG_core_desc_TT: "En atteignant l'hégémonie économique, militaire et politique, nous montrerons aux trois principaux États du Commonwealth que nous pouvons les pourvoir et les protéger. De plus, leurs citoyens seront plus enclins à nous rejoindre si nos conditions sont meilleures."
 ENG_econ_hegemony_TT: "« L'argent arrange tout »\n\nEn atteignant l'hégémonie économique, nous serons en mesure d'intégrer d'autres économies, comme celles des États du Commonwealth. Pour y parvenir, il nous faut :\n\nUn PIB supérieur à celui des 3 combinés\n- Le nôtre est actuellement de $[?gdp_total|1] (milliers)\n- Le leur est actuellement de $[?commonwealth_total_gdp|1] (milliers)"
 ENG_military_hegemony_TT: "« Une armée forte équivaut à un règne fort »\n\nEn atteignant l'hégémonie militaire, nous montrerons que nous savons défendre nos territoires et notre peuple. Pour y parvenir, il nous faut :\n\nPlus d'effectifs déployés que les 3 combinés\n- Nous avons actuellement [?ENG.deployed_army_manpower_k] (milliers) de troupes déployées\n- Ils ont actuellement [?commonwealth_total_army] (milliers) de troupes déployées"
 ENG_political_hegemony_TT: "« Tirer les ficelles suffit »\n\nEn atteignant l'hégémonie politique, nous démontrerons que le règne de Westminster est stable, connecté et à l'écoute de tous les milieux. Pour y parvenir, il nous faut :\n\nUne sphère d'influence solide\n- Au moins 50 % d'influence dans les 3 pays"
 ENG_tooltip_TT: "A rempli toutes les conditions de l'hégémonie économique"
 ENG_tooltip2_TT: "A rempli toutes les conditions de l'hégémonie militaire"
