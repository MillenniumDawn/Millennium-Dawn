 message_from_iran.1.t: "Irán nos ha enviado equipo"
 message_from_iran.1.d: "Hoy, recibimos un gran y confidencial envío en una de las bases, que descubrimos que fue enviado desde Irán. Este envío incluye equipo militar para la guerra terrestre y de guerrilla, y podemos usarlo para defendernos y confrontar a nuestros enemigos."
 message_from_iran.1.o1: "Gracias"
 message_from_iran.2.t: "Irán nos ha enviado dinero"
 message_from_iran.2.d: "Hemos sido contactados desde una de nuestras bases, informando que se han enviado envíos de dinero en dólares estadounidenses en un gran número de maletines."
 message_from_iran.2.o1: "Gracias"
 message_from_iran.3.t: "Irán nos ha construido una fábrica"
 message_from_iran.3.d: "Irán nos ha construido una fábrica subterránea que podemos utilizar para construir otras estructuras sin preocuparnos de que se dañe."
 message_from_iran.3.o1: "Gracias"
