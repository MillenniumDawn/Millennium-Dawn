 BOT_anti_poaching_raid_succesful: "§GNous avons réussi à éliminer §Y[?poachers_killed]§! braconniers !§!"
 BOT_anti_poaching_raid_normal: "§GNous somme parvenus à éliminer §Y[?poachers_killed]§! braconniers !§!"
