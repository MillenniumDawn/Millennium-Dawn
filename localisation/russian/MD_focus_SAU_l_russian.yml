l_russian:
 saudi_focus_tree: "Дерево фокусировки Саудовской Аравии"
 SAU_crackdown_on_the_opposition: "Жесткие меры против оппозиции"
 SAU_crackdown_on_the_opposition_desc: "Мабахит хранит обширные досье на шиитских организаторов, священнослужителей из движения «Сахва» и либеральных просителей. Совет будет использовать эти записи для выявления и подавления оппозиции военному правлению."
 SAU_modernisation_balance_of_power_category: "§HБудущее Королевства§!"
 SAU_shia_rights_reform: "Реформа прав шиитов"
 SAU_shia_rights_reform_desc: "Кодифицировать права шиитов в законодательстве страны.\n\n§G-Сопротивление шиитов, +Стабильность, +Шиитское население§!."
 SAU_trials_of_the_old_order: "Испытания старого порядка"
 SAU_trials_of_the_old_order_desc: "Совет будет преследовать членов бывшего королевского ордена в публичных судах. В отличие от частных соглашений по чистке в отеле Ritz-Carlton в 2017 году, в этих разбирательствах обвинения и решения будут представлены открыто, что также послужит политическим интересам Совета."
 SAU_unif_command_control_tt: "§HВ вооруженных силах стран Персидского залива создана единая структура командования и управления.§!"
 SAU_unif_cross_border_tt: "§YТребуется развитая трансграничная инфраструктура в приграничном регионе (уровень инфраструктуры 3 или выше).§!"
 SAU_unif_exploit_authority_tt: "§YТребует, чтобы Королевство оказывало ведущее иностранное влияние в каждом другом государстве-члене ССГПЗ.§!"
 SAU_unif_increase_autonomy_tt: "§HРасширение региональной автономии смягчает межконфессиональные разногласия. Усиливается внутреннее влияние, и радикализация ослабевает.§!"
 HOU_houthi_resilience: "Стойкость Ансар Аллаха"
 HOU_houthi_resilience_desc: "«Ансар Аллах» действует в горных районах севера Йемена уже несколько десятилетий. Благодаря хорошему знанию местности и прочным позициям в высокогорье, силы хуситов трудно выбить из строя."
 PER_houthi_defense_buff: "Горные укрепления"
 PER_houthi_defense_buff_desc: "Построенные Ираном оборонительные сооружения превращают высокогорные районы в крепость. +15% защиты от правительственных войск."
 SAU_arab_shield_member: "Член Арабского щита"
 SAU_arab_shield_member_desc: "Эта страна участвует в механизмах коллективной обороны «Арабского щита», повышая обороноспособность и моральный дух своих вооруженных сил."
 SAU_aramco_01: "Саудовская Арамко"
 SAU_aramco_01_desc: "Саудовская нефтяная компания (Aramco) — крупнейшее в мире нефтяное предприятие, полностью национализированное с 1980 года. Aramco контролирует огромные запасы нефти Королевства и является основой саудовской экономики, обеспечивая большую часть государственных доходов. Несмотря на огромную прибыльность, компания работает с ограниченной прозрачностью и до сих пор не модернизировала свою корпоративную структуру."
 SAU_aramco_02: "Saudi Aramco - Расширение деятельности"
 SAU_aramco_02_desc: "Компания Aramco расширила свою деятельность за пределы добычи сырой нефти, инвестируя в нефтеперерабатывающие мощности, нефтехимические предприятия и международные партнерства. Повышение эффективности компании и диверсификация портфеля укрепили ее позиции в качестве краеугольного камня саудовской экономики."
 SAU_aramco_03: "Saudi Aramco - мировой лидер в энергетической отрасли"
 SAU_aramco_03_desc: "Компания Saudi Aramco превратилась в современного глобального энергетического гиганта. Благодаря успешному выходу на биржу, расширению деятельности в сфере переработки и сбыта, а также стратегическим международным инвестициям, компания сегодня является одной из самых ценных корпораций в мире. Ее доходы пополняют не только бюджет Королевства, но и способствуют реализации амбициозных программ развития по всей стране."
 SAU_aramco_downstream: "§HSaudi Aramco§! - Интеграция в нисходящий поток"
 SAU_aramco_downstream_desc: "Компания Aramco расширила свою деятельность в области нефтепереработки и химического производства, что позволяет ей получать доход на каждом этапе — от добычи сырой нефти до розничной продажи топлива."
 SAU_aramco_engineers: "§HSaudi Aramco§! - Саудовские инженеры-нефтяники"
 SAU_aramco_engineers_desc: "Новое поколение саудовских инженеров-нефтяников, получивших образование в KFUPM и за рубежом, заменило иностранных специалистов, которые когда-то управляли месторождениями."
 SAU_aramco_export: "§HСаудовская Аравия§! - Экспортный гигант"
 SAU_aramco_export_desc: "Компания Aramco создана как экспортная машина, ее терминалы и танкерный флот настроены на поставку большего количества сырой нефти на большее количество рынков, чем у любого конкурента."
 SAU_aramco_gas: "§HSaudi Aramco§! - Главная газовая система"
 SAU_aramco_gas_desc: "Система Master Gas System улавливает природный газ, который ранее сжигался на факелах, и транспортирует его на электростанции и промышленные предприятия по всей Саудовской Аравии."
 SAU_aramco_ghawar: "§HSaudi Aramco§! - Месторождение Гавар"
 SAU_aramco_ghawar_desc: "Гавар — крупнейшее в мире месторождение традиционной нефти, добывающее миллионы баррелей в сутки. Его добыча имеет центральное значение как для Aramco, так и для экономики Саудовской Аравии."
 SAU_aramco_giant: "§HSaudi Aramco§! - Самая ценная компания в мире"
 SAU_aramco_giant_desc: "Компания Aramco является самой дорогой компанией на Земле, ее добыча, запасы и прибыль не имеют себе равных в корпоративной истории."
 SAU_aramco_megafields: "§HSaudi Aramco§! - Новые мега-месторождения"
 SAU_aramco_megafields_desc: "Масштабные разработки на месторождениях Шайба, Хурайс и шельфовом месторождении Манифа расширили производственные мощности Саудовской Аравии и продолжили инвестиции Королевства в крупные нефтяные проекты."
 SAU_aramco_national: "§HSaudi Aramco§! - Полная национализация"
 SAU_aramco_national_desc: "Завершённый в 1980 году выкуп компании американскими акционерами полностью превратил Aramco в саудовскую компанию. Теперь нефть Королевства поставляется исключительно Эр-Риядом."
 SAU_aramco_opec: "§HСаудовская Аравия§! - Производитель свинг-инвестиций ОПЕК"
 SAU_aramco_opec_desc: "Саудовская Аравия располагает достаточными резервными производственными мощностями, чтобы увеличивать или уменьшать поставки нефти в рамках ОПЕК и оказывать большее влияние на мировые цены на нефть, чем любой другой член организации."
 SAU_aramco_petrochem: "§HСаудовская Аравия§! - Интегрированная нефтепереработка"
 SAU_aramco_petrochem_desc: "PetroRabigh и SATORP, совместные предприятия с Sumitomo и Total, объединяют нефтепереработку и нефтехимию в единые интегрированные комплексы на Красном море и в Персидском заливе."
 SAU_aramco_production: "§HSaudi Aramco§! - Максимизация производства"
 SAU_aramco_production_desc: "Компания Aramco уделяет первостепенное внимание максимальному устойчивому производству, сохраняя при этом резервные мощности. Это позволяет Саудовской Аравии быстро реагировать на изменения спроса или государственной политики в области производства."
 SAU_aramco_rastanura: "§HSaudi Aramco§! - Рас Танура и Абкайк"
 SAU_aramco_rastanura_desc: "Экспортный терминал Рас-Танура и перерабатывающий комплекс Абкайк обрабатывают значительную часть саудовской нефти перед ее поступлением на мировые рынки. Вместе они входят в число крупнейших нефтеперерабатывающих комплексов такого типа."
 SAU_aramco_rnd: "§HSaudi Aramco§! — исследования EXPEC"
 SAU_aramco_rnd_desc: "Передовой исследовательский центр EXPEC в Дахране является мировым лидером в области разработки месторождений, позволяя добывать больше нефти на каждом месторождении с меньшими затратами."
 SAU_baathist_party_1: "Оплот арабского национализма"
 SAU_baathist_party_1_loc: "\n[SAU.GetFlag]Оплот арабского национализма\n§HИностранное влияние§! Множитель: §G+5.00%§!\n§HИностранное влияние§! Фактор успеха государственного переворота: §G+25.0%§!\n\n"
 SAU_baathist_party_3: "Единство, свобода, социализм"
 SAU_baathist_party_3_loc: "[SAU.GetFlag]Единство, свобода, социализм\nСкорость строительства: §G+10.00%§!\nМножитель стоимости националистической пропагандистской кампании: §G-10.00%§!\nЕжемесячный рост производительности: §G+0.05§!\n\n"
 SAU_banking_649_hybrid: "§HЗакон о процентах§! - §YГибрид (сукук + неформальный)§!"
 SAU_banking_649_hybrid_desc: "Сукук и исламские банковские услуги функционируют наряду с неформальным традиционным кредитованием. Система официально соответствует шариату, но допускает ограниченную практическую гибкость."
 SAU_banking_649_hybrid_loc: "\n§HЗаконодательство о процентах:§! §YСукук + Неформальный интерес§!\n  §G+2.0%§! Налог на офисные парки\n  §G+1.0%§! Политическая власть\n  §G+0.5%§! Стабильность\n"
 SAU_banking_649_islamic: "Закон о процентах §H Закон о процентах §! - §R Строгий запрет ростовщичества §!"
 SAU_banking_649_islamic_desc: "Ростовщичество (риба) запрещено без исключения. Финансовые потоки осуществляются через структуры распределения прибыли и мурабаха, а верный банк обладает чистой совестью."
 SAU_banking_649_islamic_loc: "\n§HЗаконодательство о процентах:§! §BСтрогий запрет на ростовщичество (риба)§!\n  §G+3.0%§! Политическая власть\n  §G+2.0%§! Стабильность\n  §G+0.5%§! Салафитский дрейф\n"
 SAU_banking_649_secular: "§HЗаконодательство о процентах§! - §GОбычный§!"
 SAU_banking_649_secular_desc: "Проценты законны и устанавливаются открыто. Традиционная банковская система процветает, и капитал свободно циркулирует, что бы ни проповедовали священнослужители по пятницам."
 SAU_banking_649_secular_loc: "\n§HЗакон о процентах:§! §GТрадиционный§!\n §G+4.0%§! Налог на офисные парки\n §G+3.0%§! Корпоративный налог\n §G+0.5%§! Демократический дрейф\n §R-1.0%§! Стабильность\n"
 SAU_banking_650_hybrid: "§HРезервное право§! - §YУмеренный§!"
 SAU_banking_650_hybrid_desc: "Умеренные требования к резервам позволяют банкам расширять кредитование, сохраняя при этом более значительные финансовые резервы, чем в системе с мягким регулированием."
 SAU_banking_650_hybrid_loc: "\n§HЗапасы:§! §YУмеренные запасы§!\n §G+1,0%§! Скорость строительства\n §G+0,5%§! Стабильность\n"
 SAU_banking_650_islamic: "§HРезервное обеспечение§! - §RПолное обеспечение активами§!"
 SAU_banking_650_islamic_desc: "Каждый депозит обеспечен реальными активами. Кредитование развивается медленно, но ни один саудовский банк не может обанкротиться в результате массового изъятия вкладов."
 SAU_banking_650_islamic_loc: "\n§HРезервный мандат:§! §BПолная поддержка активов (шариат)§!\n §G+2,5%§! Стабильность\n §G+2,0%§! Поддержка войны\n §R-2,0%§! Скорость строительства\n"
 SAU_banking_650_secular: "§HРезервный мандат§! - §GЧастичный резерв§!"
 SAU_banking_650_secular_desc: "Банки выдают кредиты под залог лишь небольшой части своих депозитов, тем самым, по западной модели, многократно увеличивая кредитоспособность экономики."
 SAU_banking_650_secular_loc: "\n§HРезервный мандат:§! §GЧастичный резерв (Западный)§!\n §G+3.0%§!Скорость строительства\n §G+5.0%§!Ремонт промышленности\n §R-2.0%§!Использование потребительских товаров\n §R-1.5%§!Стабильность\n"
 SAU_banking_651_hybrid: "§H Код спекуляции §! - §Y Регулируемые производные инструменты §!"
 SAU_banking_651_hybrid_desc: "Торговля производными финансовыми инструментами осуществляется в строгих рамках, хеджирование разрешено, спекуляции контролируются."
 SAU_banking_651_hybrid_loc: "\n§HКод спекуляции: §! §YТолько регулируемые деривативы§!\n §G+1,5%§! Налоговый доход\n §G+0,5%§! Стабильность\n"
 SAU_banking_651_islamic: "§HКод спекуляции§! - §RБез Гарара§!"
 SAU_banking_651_islamic_desc: "Запрет на использование производных финансовых инструментов, коротких продаж и других финансовых продуктов, основанных на чрезмерной неопределенности или спекуляциях."
 SAU_banking_651_islamic_loc: "\n§HКодекс спекуляций:§! §BБез гарара — без азартных игр§!\n §G+2.5%§! Стабильность\n §G+2.0%§! Политическая власть\n §G+3§! Принятие нейтралитета\n"
 SAU_banking_651_secular: "§HКод спецификации§! - §GРегулировка освещения§!"
 SAU_banking_651_secular_desc: "Торговля опционами, фьючерсами и другими производными финансовыми инструментами разрешена при ограниченном регулирующем надзоре."
 SAU_banking_651_secular_loc: "\n§HКодекс спекуляций:§! §GДеривативы и фьючерсы разрешены§!\n §G+3.0%§! Налоговый доход\n §G+2.0%§! Скорость исследований\n §R-2.0%§! Стабильность\n"
 SAU_banking_652_hybrid: "§HМежбанковский код§! - §YДвойные каналы§!"
 SAU_banking_652_hybrid_desc: "Параллельно функционируют два межбанковских канала: традиционный и исламский, и каждый банк выбирает себе кассу."
 SAU_banking_652_hybrid_loc: "\n§HМежбанковский кодекс:§! §YДвойные каналы§!\n §G+1.5%§! Налог на офисные парки\n §G+1.0%§! Политическая власть\n"
 SAU_banking_652_islamic: "§H Межбанковский код §! - §RМурабаха§!"
 SAU_banking_652_islamic_desc: "Межбанковская ликвидность перемещается посредством товарной мурабахи, удерживая даже средства, предоставленные на одну ночь, в рамках шариата."
 SAU_banking_652_islamic_loc: "\n§HМежбанковский кодекс:§! §BНа основе мурабахи§!\n §G+2.5%§! Политическая власть\n §G+1.5%§! Стабильность\n §G+0.5%§! Салафитский дрейф\n"
 SAU_banking_652_secular: "§HМежбанковский код§! - §GLIBOR-style§!"
 SAU_banking_652_secular_desc: "Банки кредитуют друг друга по базовым процентным ставкам, тем самым интегрируя саудовские финансы в мировые денежные рынки."
 SAU_banking_652_secular_loc: "\n§HМежбанковский кодекс:§! §GКоридор обычных процентных ставок§!\n §G+3.0%§! Налог на офисные парки\n §G+2.0%§! Корпоративный налог\n §G+0.5%§! Демократический дрейф\n §R-1.0%§! Стабильность\n"
 SAU_banking_653_hybrid: "§HУправление банковскими операциями§! - §YПараллельные структуры§!"
 SAU_banking_653_hybrid_desc: "Традиционные и исламские банки подчиняются параллельным системам надзора под эгидой одного центрального банка."
 SAU_banking_653_hybrid_loc: "\n§HБанковский контроль:§! §YПараллельные структуры SAMA + шариата§!\n  §G+2.0%§! Налог на прибыль\n  §G+1.5%§! Политическая власть\n"
 SAU_banking_653_islamic: "§HБанковское управление§! - §RSAMA + Совет по шариату§!"
 SAU_banking_653_islamic_desc: "SAMA разделяет полномочия с советом по надзору за соблюдением шариата, и ни одна банковская лицензия не выдерживает вето ученых."
 SAU_banking_653_islamic_loc: "\n§HКонтроль над банками:§! §BSAMA + шариатский надзор§!\n §G+4.0%§! Политическая власть\n §G+2.5%§! Стабильность\n §G+1.0%§! Салафитский дрейф\n"
 SAU_banking_653_secular: "§HКонтроль над банками§! - §GНезависимая SAMA§!"
 SAU_banking_653_secular_desc: "SAMA регулирует банковскую деятельность как независимый центральный банк, подотчетный лишь доверию рынка и ничему другому."
 SAU_banking_653_secular_loc: "\n§HБанковское управление:§! §GНезависимый SAMA§!\n §G+4.0%§! Налоговый прирост\n §G+2.0%§! Скорость исследований\n §G+1.0%§! Демократический дрейф\n §R-1.0%§! Стабильность\n"
 SAU_banking_654_pragmatic: "§HИсламские финансы§! - §YГлобальный исламский центр§!"
 SAU_banking_654_pragmatic_desc: "Эр-Рияд превращается в международный центр исламских финансов. Его правила сохраняют авторитет шариата, одновременно предоставляя возможности для учреждений из других крупных финансовых рынков."
 SAU_banking_654_pragmatic_loc: "\nОплот исламских финансов: §HОплот исламских финансов: §! §YГлобальный центр исламских финансов: §!\n §G+3.0%§!Политическая власть\n §G+2.5%§!Стабильность\n §G+5.0%§!Налог на офисные парки\n §G+4.0%§!Корпоративный налог\n §G+5§!Принятие нейтралитета\n"
 SAU_banking_654_strict: "§HИсламские финансы§! - §RСтрогое православие§!"
 SAU_banking_654_strict_desc: "Королевство требует полного соблюдения ортодоксальных исламских финансовых правил. Это ограничивает гибкость, но привлекает клиентов, которые отдают приоритет строгому соблюдению шариата."
 SAU_banking_654_strict_loc: "\n§HОплот исламских финансов:§! §BСтрогое православие§!\n  §G+5.0%§! Политическая власть\n  §G+5.0%§! Стабильность\n  §G+2.0%§! Салафитский дрейф\n  §G+10§! Принятие нейтралитета\n  §G+10.0%§! Защита от дрейфа\n"
 SAU_banking_655_full: "§HСекуляризованные финансы§! - §GПолностью англосаксонский§!"
 SAU_banking_655_full_desc: "Саудовская Аравия полностью переняла англосаксонскую банковскую модель. Эти изменения расширяют традиционные рынки капитала, но сталкиваются с противодействием со стороны религиозного истеблишмента."
 SAU_banking_655_full_loc: "\n§HСекуляризованные финансы:§! §GПолностью англосаксонский§!\n §G+10.0%§! Налог на офисные парки\n §G+7.0%§! Корпоративный налог\n §G+5.0%§! Налог на прибыль\n §G+4.0%§! Скорость исследований\n §G+2.0%§! Демократический дрейф\n §R-3.0%§! Стабильность\n §R-2.0%§! Использование потребительских товаров\n"
 SAU_banking_655_gradual: "§HСекуляризованные финансы§! - §YПостепенный§!"
 SAU_banking_655_gradual_desc: "Постепенно вводятся традиционные финансовые правила с целью снижения организованного религиозного сопротивления секуляризации."
 SAU_banking_655_gradual_loc: "\n§HСекуляризованные финансы:§! §YПостепенный переход§!\n  §G+6.0%§! Налог на офисные парки\n  §G+4.0%§! Корпоративный налог\n  §G+3.0%§! Налог на прибыль\n  §G+1.0%§! Демократический дрейф\n  §R-1.0%§! Стабильность\n"
 SAU_banking_system: "§H Банковская система §!"
 SAU_banking_system_desc: "Финансовый сектор Королевства. Каждый вариант развития банковского права предоставляет игроку выбор: §Lsecular§!, §Lislamic§! или §Lhybrid§!; результат отображается здесь как §Hsub-system§!. Общий модификатор получается путем суммирования всех выбранных подсистем."
 SAU_banking_system_tt: "[SAU_banking_649_loc][SAU_banking_650_loc][SAU_banking_651_loc][SAU_banking_652_loc][SAU_banking_653_loc][SAU_banking_654_loc][SAU_banking_655_loc]"
 SAU_black_february_bailout_idea: "Февральская интервенция"
 SAU_black_february_bailout_idea_desc: "Государство потратило государственные средства на то, чтобы замедлить обвал Tadawul и защитить мелких инвесторов от самых больших потерь. Это вмешательство сокращает доступные средства Казначейства и создает дорогостоящий прецедент для будущих рыночных кризисов."
 SAU_black_february_idea: "Чёрный февраль"
 SAU_black_february_idea_desc: "Валюта «Тадавул» потеряла две трети своей стоимости, что привело к потере значительной части сбережений, вложенных саудовскими домохозяйствами. Бездействие правительства вызвало широкое общественное негодование."
 SAU_communist_state_2: "Пролетарская нация"
 SAU_communist_state_2_loc: "[SAU.GetFlag]Пролетарская нация\n§HНаселение Налоговые поступления§! Мультипликатор: §G+5.00%§!\n§HСельское хозяйство§! Мультипликатор налоговых поступлений: §G+5.00%§!\n§HРайон коммерциализированного сельского хозяйства§! Производительность: §G+10.00%§!\n\n"
 SAU_communist_state_2_tt: "[SAU_communist_state_1_loc][SAU_communist_state_2_loc][SAU_communist_state_3_loc][SAU_communist_state_4_loc][SAU_communist_state_5_loc]"
 SAU_Cooperation_West_East: "[USA.GetFlag] Сотрудничество в разделённом мире [CHI.GetFlag]"
 SAU_Cooperation_West_East_desc: "В разделенном мире, состоящем из двух основных блоков, восточный мир поддерживает восходящую сверхдержаву. [CHI.GetFlag] Китай и западная сторона, возглавляемые [USA.GetFlag] Америка в этом мире и в новом тысячелетии"
 SAU_Cooperation_West_East_tt: "[SAU_IMEC_india_deal_new_loc][SAU_OPEC_Russia_deal_new_loc]"
 SAU_custodian_of_the_cause: "Хранитель Дела"
 SAU_custodian_of_the_cause_desc: "Эр-Рияд сделал Палестину эталоном своего лидерства в арабском мире, и арабская общественность отвечает ему преданностью."
 SAU_cyber_defensive_posture: "Позиция киберзащиты"
 SAU_cyber_defensive_posture_desc: "Операции по усилению защиты сети GIP обеспечивают безопасность сетей Королевства и замедляют сбор враждебной разведывательной информации."
 SAU_cyber_defensive_target: "Саудовские меры противодействия киберпреступлениям"
 SAU_cyber_defensive_target_desc: "Киберзащита GIP привела к ухудшению координации и управления наступательными действиями."
 SAU_cyber_offensive_target: "Кибератака Саудовской Аравии"
 SAU_cyber_offensive_target_desc: "Кибер-операции GIP парализовали координацию командования и обороны, а также нарушили работу промышленности."
 SAU_decisive_storm_air_cover: "Коалиционное воздушное прикрытие"
 SAU_decisive_storm_air_cover_desc: "Авиация Саудовской Аравии и коалиции обеспечивает воздушное прикрытие правительственных сил Йемена, увеличивая защиту от хуситов на 10%. Эта поддержка прекращается в случае принятия соглашения о прекращении огня или прекращения существования движения хуситов."
 SAU_decree_abdullah_kaec_construction: "Ускоренное строительство KAEC"
 SAU_decree_abdullah_kaec_construction_desc: "Строительные работы по всему Королевству ведутся в темпе, сопоставимом с темпами, заданными на побережье Красного моря."
 SAU_decree_abdullah_kasp_scholarship: "Зарубежная стипендия KASP"
 SAU_decree_abdullah_kasp_scholarship_desc: "Поколение, получившее образование за рубежом, возвращается в министерства, университеты и компании."
 SAU_decree_abdullah_kaust_grants: "Гранты KAUST в области высоких технологий"
 SAU_decree_abdullah_kaust_grants_desc: "Расширение грантов KAUST ускоряет университетские исследования и увеличивает объемы производства в высокотехнологичной промышленности."
 SAU_decree_abdullah_national_dialogue: "Национальные диалоговые форумы"
 SAU_decree_abdullah_national_dialogue_desc: "Разногласия обсуждаются в конференц-залах, а не на улице."
 SAU_decree_abdullah_sang_subsidies: "Субсидии на модернизацию SANG"
 SAU_decree_abdullah_sang_subsidies_desc: "Субсидируемые контракты сдерживают рост цен на бронетехнику и позволяют поддерживать боеготовность формирований."
 SAU_decree_mbn_border_surveillance: "Сети наблюдения пограничной охраны"
 SAU_decree_mbn_border_surveillance_desc: "Граница контролируется от начала до конца, а находящиеся на ней войска окопались за заранее подготовленными позициями."
 SAU_decree_mbn_mabahith_campaign: "Кампания по борьбе с подрывной деятельностью Мабахита"
 SAU_decree_mbn_mabahith_campaign_desc: "Группа \"Мабахит\" отслеживает коммуникации и усиливает слежку за предполагаемыми диссидентами по всему Королевству."
 SAU_decree_mbn_rehabilitation_center: "Реабилитационный центр принца Наефа"
 SAU_decree_mbn_rehabilitation_center_desc: "Центр имени принца Наефа стремится реабилитировать боевиков и вернуть их к гражданской жизни, вместо того чтобы допускать тюремное заключение или смертную казнь для усиления вербовки экстремистов."
 SAU_decree_mbn_special_security_forces: "Специальные силы безопасности Министерства внутренних дел"
 SAU_decree_mbn_special_security_forces_desc: "Силы Министерства внутренних дел вышли на улицы, и любому, кто пытается противостоять Королевству, стало намного труднее."
 SAU_decree_mbn_western_intel_networks: "Западные объединенные разведывательные сети"
 SAU_decree_mbn_western_intel_networks_desc: "Совместное использование ресурсов союзных служб заполняет то, что недоступно для сбора саудовских отходов."
 SAU_decree_mbs_anticorruption_drive: "Поселения «Ритц-Карлтон»"
 SAU_decree_mbs_anticorruption_drive_desc: "Задержания в отеле Ritz-Carlton вынудили состоятельных саудовцев передать свои активы государству и продемонстрировали контроль руководства над частными состояниями."
 SAU_decree_mbs_aramco_liquidity: "Стратегическая ликвидность Арамко"
 SAU_decree_mbs_aramco_liquidity_desc: "Нефтяные доходы поступают напрямую в руки государства, и промышленность освобождается от участия в торговом балансе."
 SAU_decree_mbs_gami_localization: "Локализация ОПК через GAMI"
 SAU_decree_mbs_gami_localization_desc: "Оружие поступает с саудовских, а не с иностранных рубежей, и количество оружейных заводов растет."
 SAU_decree_mbs_pif_neom: "Проекты NEOM и Frontier"
 SAU_decree_mbs_pif_neom_desc: "Государственный инвестиционный фонд финансирует проект NEOM и связанные с ним перспективные проекты, включая транспортную инфраструктуру, необходимую для их поддержки."
 SAU_decree_mbs_vision2030_blitz: "Кампания «Видение 2030»: массированная рекламная кампания"
 SAU_decree_mbs_vision2030_blitz_desc: "Правительственные министерства и государственные инвестиции направляются на скорейшую реализацию программы «Видение 2030» наследного принца."
 SAU_decree_mutaib_capital_garrison: "Столичная гарнизонная сетка"
 SAU_decree_mutaib_capital_garrison_desc: "Национальная гвардия установила кордон безопасности и разветвленную сеть наблюдения по всему Эр-Рияду."
 SAU_decree_mutaib_janadriyah_festival: "Фестиваль наследия Джанадрия"
 SAU_decree_mutaib_janadriyah_festival_desc: "Фестиваль Джанадрия способствует популяризации племенного наследия и укреплению отношений между правительством и племенными общинами."
 SAU_decree_mutaib_sang_logistics: "Автономная логистика SANG"
 SAU_decree_mutaib_sang_logistics_desc: "Национальная гвардия обеспечивает себя продовольствием и топливом самостоятельно, при этом значительно сокращая потери."
 SAU_decree_mutaib_sang_procurement: "SANG Aviation & Armoror Procurement"
 SAU_decree_mutaib_sang_procurement_desc: "Контракты на охранные работы заключаются в первую очередь по ценам, недоступным для регулярной армии."
 SAU_decree_mutaib_tribal_reserves: "Племенные резервации SANG"
 SAU_decree_mutaib_tribal_reserves_desc: "Племенные отряды пополняют ряды Национальной гвардии быстрее, чем это могли бы сделать одни только вербовщики."
 SAU_decree_salman_cpsa_council: "Совет по политическим вопросам и вопросам безопасности"
 SAU_decree_salman_cpsa_council_desc: "Теперь один совет утверждает как политические, так и вопросы безопасности, и работа персонала ведется со скоростью, соответствующей темпам председателя совета."
 SAU_decree_salman_ksrelief: "Операции по оказанию помощи КС"
 SAU_decree_salman_ksrelief_desc: "KSrelief использует видимые гуманитарные операции Саудовской Аравии для оказания помощи за рубежом и улучшения международной репутации Королевства."
 SAU_decree_salman_riyadh_metro_plan: "План развития столичного региона Эр-Рияда"
 SAU_decree_salman_riyadh_metro_plan_desc: "Строительная программа столицы задала темп строительству во всем мире."
 SAU_decree_salman_royal_decrees: "Королевские структурные указы"
 SAU_decree_salman_royal_decrees_desc: "Королевские указы реорганизуют министерства и централизуют реализацию государственной политики."
 SAU_decree_salman_spark_park: "Энергетический парк имени короля Салмана"
 SAU_decree_salman_spark_park_desc: "Отечественное производство энергоресурсов выжимает все больше и больше из каждого месторождения и каждого резервуарного парка."
 SAU_div_construction: "§HDiversification§! - Строительство и недвижимость"
 SAU_div_construction_desc: "Строительство и развитие недвижимости становятся важными составляющими несырьевой экономики Саудовской Аравии."
 SAU_div_defence: "§HДиверсификация§! - Оборонная промышленность"
 SAU_div_defence_desc: "Развитие отечественной оружейной промышленности позволяет удерживать оборонные расходы внутри Королевства, строя заводы и накапливая опыт, а не просто закупая их."
 SAU_div_energy: "§HDiversification§! - Возобновляемая энергия"
 SAU_div_energy_desc: "Крупные проекты в области солнечной энергетики снижают внутренний спрос на энергию, вырабатываемую на нефтяных электростанциях, что позволяет увеличить объемы сырой нефти для экспорта и повысить государственные доходы."
 SAU_div_governance: "§HДиверсификация§! - Управление и верховенство права"
 SAU_div_governance_desc: "Более последовательная работа судов и подотчетных министерств улучшает деловую среду и упрощает реализацию государственной политики."
 SAU_div_logistics: "§HDiversification§! - Логистика и транспорт"
 SAU_div_logistics_desc: "Инвестиции в порты, железные дороги и автомагистрали укрепляют роль Саудовской Аравии в торговле между Азией, Африкой и Европой."
 SAU_div_social: "§HДиверсификация§! - Социальное развитие"
 SAU_div_social_desc: "Школы, больницы и жилье дают обычным саудовцам заинтересованность в новой экономике и основание верить в нее."
 SAU_div_tech: "§HDiversification§! - Технологии и инновации"
 SAU_div_tech_desc: "Научно-исследовательские парки и стартап-капитал дают толчок развитию технологического сектора в Саудовской Аравии, который нанимает выпускников, которых нефтяная промышленность никогда не смогла бы трудоустроить."
 SAU_div_tourism: "§HDiversification§! - Туризм и развлечения"
 SAU_div_tourism_desc: "Курортные комплексы, исторические достопримечательности и развлекательные районы открывают Королевство для посетителей, которым оно раньше отказывалось принимать гостей, и их деньги остаются в стране."
 SAU_diversification: "§HEЭкономическая диверсификация§!"
 SAU_diversification_desc: "Королевство развивает §Lне нефтяная экономика§! чтобы снизить свою зависимость от изменений цен на нефть. Каждый завершенный раздел, включая управление, промышленность, туризм, технологии, энергетику и социальное развитие, представлен здесь. §Gснижает зависимость от нефти§!."
 SAU_diversification_tt: "[SAU_div_governance_loc][SAU_div_construction_loc][SAU_div_tourism_loc][SAU_div_logistics_loc][SAU_div_tech_loc][SAU_div_defence_loc][SAU_div_energy_loc][SAU_div_social_loc]"
 SAU_doctrine_american: "Доктрина: Американское партнерство"
 SAU_doctrine_american_desc: "Тренируйтесь с американскими войсками, покупайте американские товары и сражайтесь по-американски. Самый эффективный путь — ценой зависимости и скрытого внутреннего недовольства.\n\n§G+10%§! Получение армейского опыта\n§G+10%§! Получение опыта в авиации\n§G+5%§! Организация подразделения\n§R-10%§! Приобретение политической власти"
 SAU_doctrine_domestic: "Доктрина: Самостоятельность в семье"
 SAU_doctrine_domestic_desc: "Создать собственную оборонную промышленность и вооруженные силы, не зависящие от иностранных поставщиков. Гордые и самодостаточные, хотя и немного отстающие от передовых технологий.\n\n§G+10%§! Производительность оружейных заводов\n§G+5%§! Коэффициент восстановления дивизий\n§R-5%§! Прирост армейского опыта"
 SAU_doctrine_gcc: "Доктрина: Коллективная оборона стран Персидского залива"
 SAU_doctrine_gcc_desc: "Крепость обороны Королевства в составе Совета сотрудничества стран Персидского залива и Сил обороны полуострова. Мощный союзник на родине, но действует коллегиально и осторожно в нападении.\n\n§G+15%§! Дивизионная оборона на основной территории\n§G+5%§! Потенциальная численность населения, способная к вербовке\n§R-5%§! Дивизионная атака"
 SAU_doctrine_nato: "Доктрина: профессионализм НАТО"
 SAU_doctrine_nato_desc: "Принять стандарты НАТО: профессиональный офицерский корпус, планирование общевойсковых операций и тщательная штабная работа. Превосходное командование и управление, но дорогостоящие в содержании силы.\n\n§G+10%§! Скорость планирования\n§G+10%§! Макс Планирование\n§G+5%§! Организация подразделения\n§R+5%§! Использование потребительских товаров"
 SAU_eco_bureau_bad: "Экономика Саудовской Аравии §R §! - Бюрократия"
 SAU_eco_bureau_bad_desc: "Саудовские предприятия сталкиваются с медленным получением лицензий, дублированием процедур согласования и повсеместным покровительством. Эти бюрократические барьеры снижают ценность государственных инвестиций."
 SAU_eco_bureau_good: "§GСаудовская экономика§! - Упрощенное государство"
 SAU_eco_bureau_good_desc: "Разрешения оформляются за дни, а не за годы. Упрощенная государственная система позволяет саудовскому бизнесу развиваться в соответствии с рыночными темпами."
 SAU_eco_capital_bad: "§RСаудовская экономика§! - Отток из столицы"
 SAU_eco_capital_bad_desc: "Частные активы Саудовской Аравии сосредоточены в Лондоне, Женеве и Нью-Йорке. Самые богатые люди Королевства инвестируют повсюду, кроме своей страны."
 SAU_eco_capital_good: "§GСаудовская экономика§! - Национальная столица"
 SAU_eco_capital_good_desc: "Саудовский капитал остается и работает в Королевстве, финансируя заводы и проекты, а не зарубежные пентхаусы."
 SAU_eco_diversify_bad: "§RЭкономика Саудовской Аравии§! - Государство-рантье"
 SAU_eco_diversify_bad_desc: "Правительство зависит от доходов от нефти, а многие граждане зависят от государственной занятости и социальных пособий. Поэтому изменения цен на один товар влияют на всю экономику."
 SAU_eco_diversify_good: "§GСаудовская экономика§! - Диверсифицированный"
 SAU_eco_diversify_good_desc: "Туризм, промышленность, логистика и финансы теперь имеют реальный вес наряду с нефтью. Доходы Королевства больше не зависят от одной-единственной цены."
 SAU_eco_industry_bad: "§RСаудовская экономика§! - Импорт зависимостей"
 SAU_eco_industry_bad_desc: "Практически все товары, поступающие на саудовский рынок, доставляются морским транспортом. За исключением нефтяного сектора, Королевство производит лишь небольшую часть того, что потребляет."
 SAU_eco_industry_good: "§GСаудовская экономика§! - Отечественная промышленность"
 SAU_eco_industry_good_desc: "В настоящее время саудовские заводы поставляют то, что Королевство когда-то импортировало, и это подтверждается торговыми отчетами."
 SAU_eco_labour_bad: "§RСаудовская экономика§! - Трудовые мигранты"
 SAU_eco_labour_bad_desc: "Миллионы иностранцев выполняют работу, необходимую Королевству, в то время как молодые саудовцы ждут государственных синекур, которых больше не существует."
 SAU_eco_labour_good: "§GСаудовская экономика§! - Рабочие силы Саудовской Аравии"
 SAU_eco_labour_good_desc: "Саудовцы занимают рабочие места в Саудовской Аравии, от рядовых сотрудников до руководителей высшего звена. Заработная плата остается в Королевстве."
 SAU_econ_industry_first: "§HEЭкономичная модель§! - Первая в отрасли"
 SAU_econ_industry_first_desc: "Королевство отдает приоритет сталелитейной, металлургической, металлообрабатывающей и другим отраслям тяжелой промышленности. Это увеличивает объем промышленного производства, но требует больше потребительских товаров и рабочей силы."
 SAU_econ_mixed: "Экономическая модель §HE§! - Смешанный путь"
 SAU_econ_mixed_desc: "Королевство развивает промышленность и сферу услуг одновременно. Рост менее сконцентрирован, чем при стратегии, ориентированной на один сектор, что делает экономику более устойчивой."
 SAU_econ_services: "§HEЭкономическая модель§! - Сервис прежде всего"
 SAU_econ_services_desc: "Королевство отдает приоритет банковскому сектору, логистике, финансам и туризму как источникам квалифицированных рабочих мест для саудовцев. Это способствует развитию экономики знаний, но снижает потенциал промышленного производства."
 SAU_economic_cities: "Инициатива «Экономические города»"
 SAU_economic_cities_desc: "Экономический город имени короля Абдаллы и другие спланированные городские центры привлекают инвестиции в офисную, промышленную и сервисную сферы. Эти специально построенные города служат двигателями экономического роста, не связанного с нефтью."
 SAU_economy: "§HСаудовская экономика§!"
 SAU_economy_desc: "Экономика Саудовской Аравии 2000 года: §Lбогатая нефтью, но недиверсифицированная§!, обремененная оттоком капитала, зависимостью от импорта, бюрократической волокитой, зависимостью от иностранной рабочей силы и пристрастием к одному товару. Каждый пункт в §HEэкономическом дереве§! исправляет одну слабость и укрепляет промышленную базу SABIC. Завершите дерево, и §Rсильный дебафф§! превратится в §Gсбалансированную, диверсифицированную экономику§!.\n\n§YНиже: каждая экономическая подсистема, красным цветом обозначены все еще неисправные системы, зеленым — восстановленные.§!"
 SAU_economy_tt: "[SAU_eco_capital_loc][SAU_eco_industry_loc][SAU_eco_bureau_loc][SAU_eco_labour_loc][SAU_eco_diversify_loc][SAU_eco_model_loc][SAU_eco_cities_loc]"
 SAU_faisalite_balanced: "Фейсалитские весы"
 SAU_faisalite_balanced_desc: "Королевство сочетает внутреннюю самодостаточность с ограниченным участием во внешних делах, не делая ни один из этих подходов своей неизменной доктриной. Поддержание этого баланса становится все сложнее по мере увеличения внешних обязательств."
 SAU_faisalite_closed_schools: "Школы закрыты."
 SAU_faisalite_closed_schools_desc: "Зарубежные учебные программы устарели, и ничего не было написано взамен. Из-за этого группа студентов потеряет несколько лет обучения."
 SAU_faisalite_conviction_decided: "Фейсалитский круг: Решено"
 SAU_faisalite_conviction_dormant: "Фейсалитский круг: спящий"
 SAU_faisalite_conviction_gathering: "Фейсалитский круг: собрание"
 SAU_faisalite_conviction_insistent: "Фейсалитский круг: Настойчивый"
 SAU_faisalite_conviction_stirring: "Фейсалитский круг: Взволнование"
 SAU_faisalite_creditor_of_the_ummah: "Кредитор уммы"
 SAU_faisalite_creditor_of_the_ummah_desc: "Долгосрочные саудовские кредиты мусульманским странам дают Эр-Рияду влияние на правительства стран-должников. Отсрочка погашения усиливает их краткосрочную зависимость и укрепляет добрые отношения."
 SAU_faisalite_foreign_endowments: "Зарубежные пожертвования"
 SAU_faisalite_foreign_endowments_desc: "На саудовские деньги создаются кафедры и библиотеки в десятке зарубежных университетов, и саудовские студенты беспрепятственно занимают в них места."
 SAU_faisalite_import_rationing: "Нормирование импорта"
 SAU_faisalite_import_rationing_desc: "Лицензии выдаются скудно, и перед зданием министерства выстраиваются очереди. То, что Королевство не может купить, оно должно найти у себя дома, и находит оно гораздо больше, чем ожидалось."
 SAU_faisalite_interventionist_dominant: "§RИнтервенционизм Восходящий§!"
 SAU_faisalite_interventionist_dominant_desc: "Саммиты, субсидии и военные советники превратили Саудовскую Аравию в центральную силу в мусульманском мире. Это влияние также делает Королевство ответственным за дорогостоящие споры за пределами своих границ."
 SAU_faisalite_interventionist_leaning: "§RСпециалист по коррекции обучения§!"
 SAU_faisalite_interventionist_leaning_desc: "Королевство снова тратит средства за рубежом, и это заметно. Фейсал, вероятно, осознает это направление, хотя пока не понимает масштабов."
 SAU_faisalite_isolationist_dominant: "§OIsolationism Ascendent§!"
 SAU_faisalite_isolationist_dominant_desc: "Саудовская Аравия закрылась от большей части иностранного влияния и обязательств. Это сохраняет её независимость, но ограничивает доступ к внешним знаниям и оставляет её в дипломатической изоляции."
 SAU_faisalite_isolationist_leaning: "§OСклонность к изоляционизму§!"
 SAU_faisalite_isolationist_leaning_desc: "Королевство сжимается. Меньше иностранных специалистов, меньше внешнеполитических обязательств, и дипломатическому корпусу остается все меньше работы."
 SAU_faisalite_labour_shortage: "Нехватка рабочей силы"
 SAU_faisalite_labour_shortage_desc: "Половина строительных лесов в Королевстве пустует. Рабы, которые их держали, ушли домой, а те, кто должен был их заменить, еще не прибыли."
 SAU_faisalite_nationalised_management: "Национализированное управление"
 SAU_faisalite_nationalised_management_desc: "Иностранные менеджеры ушли, и их преемники осваивают профессию на практике. Заводы, хоть и работают, но в определённом режиме."
 SAU_faisalite_officers_abroad: "Офицерский корпус за рубежом"
 SAU_faisalite_officers_abroad_desc: "Лучшие из штабных офицеров дают советы чужой армии. Их собственные формирования замечают их отсутствие."
 SAU_faisalite_street_movement: "Улица помнит Фейсала"
 SAU_faisalite_street_movement_desc: "Популярное движение представляет короля Фейсала как образец независимости Саудовской Аравии, подчеркивая нефтяное эмбарго и его сопротивление давлению Запада. Упрощенная версия его правления распространилась из мечетей в университетские кампусы и теперь поддерживает организованное оппозиционное движение."
 SAU_forces_modernized: "Модернизированные вооруженные силы"
 SAU_forces_modernized_desc: "Полностью современная, профессиональная армия, не уступающая ни одной в регионе и являющаяся настоящим противовесом Ирану."
 SAU_forces_modernizing: "Модернизирующие силы"
 SAU_forces_modernizing_desc: "Подготовка, доктрина и оснащение догоняют западные стандарты. Вооруженные силы теперь не уступают своим соседям."
 SAU_forces_reforming: "Силы реформ"
 SAU_forces_reforming_desc: "Первые реформы приносят свои плоды, и худшие из старых недостатков отступают. Продолжайте модернизацию."
 SAU_forces_unmodernized: "Немодернизированные вооруженные силы"
 SAU_forces_unmodernized_desc: "Десятилетия зависимости от иностранных подрядчиков и устаревшая доктрина сделали вооруженные силы неподготовленными. Используйте решение §YМодернизация вооруженных сил§!, чтобы реформировать их шаг за шагом."
 SAU_fortified_kingdom: "Крепость Аравия"
 SAU_fortified_kingdom_desc: "Укрепленные базы, многоуровневая противовоздушная оборона и прибрежные гарнизоны повышают способность Саудовской Аравии противостоять иранскому нападению."
 SAU_french_investment_pact_FRA: "Саудовско-французское инвестиционное соглашение"
 SAU_french_investment_pact_FRA_desc: "Соглашение, заключенное при поддержке государства, открывает саудовские рынки для французской промышленности и привлекает капитал стран Персидского залива во Францию."
 SAU_grievance_bitter: "Офицерский корпус: Горький"
 SAU_grievance_brink: "Офицерский корпус: на грани"
 SAU_grievance_contained: "Офицерский корпус: Сдержанный"
 SAU_grievance_mutinous: "Офицерский корпус: мятежный"
 SAU_grievance_restive: "Офицерский корпус: Непокорный"
 SAU_guardian_of_palestine: "Хранитель Палестины"
 SAU_guardian_of_palestine_desc: "Защищая палестинское дело, Королевство заслужило авторитет во всем мусульманском мире, что придало трону легитимность как внутри страны, так и за рубежом."
 SAU_gulf_war_lessons: "Уроки войны в Персидском заливе"
 SAU_gulf_war_lessons_desc: "Война в Персидском заливе 1991 года выявила серьезные недостатки в саудовском вооружении, доктрине и командовании. Генеральный штаб изучает конкурирующие модели военной реформы, но еще не выбрал ни одну.\n\n§G+5%§! Прирост армейского опыта\n§G+5%§! Скорость планирования\n\n§YЗапустите решение «Военные игры: уроки Персидского залива», чтобы выбрать доктрину.§!"
 SAU_hajj_management_01: "Хранитель двух священных мечетей"
 SAU_hajj_management_01_desc: "Будучи хранителями Мекки и Медины, правительство Саудовской Аравии курирует ежегодное паломничество хадж, принимая около двух миллионов мусульман со всего мира каждый год. Паломничество приносит значительный доход за счет туризма, транспорта и гостиничного бизнеса, а также придает Королевству беспрецедентный религиозный престиж во всем мусульманском мире."
 SAU_hormuz_shield: "Щит Ормуз"
 SAU_hormuz_shield_desc: "Саудовская военно-морская эскортная служба защищает танкеры, проходящие через Ормузский пролив, и снижает возможности Ирана по срыву поставок нефти."
 SAU_IMEC_india_deal_new: "Коридор IMEC"
 SAU_IMEC_india_deal_new_desc: "Коридор «Индия — Ближний Восток — Европа» направляет индийскую торговлю через саудовские порты и железные дороги. Королевство собирает пошлины нового Шёлкового пути."
 SAU_IMEC_india_deal_new_loc: "\n§H[RAJ.GetFlag] Индийско-Ближневосточно-Европейский экономический коридор§! (IMEC) [SAU.GetFlag]\nСкорость строительства: §G+5,00%§!\nПрирост топлива на единицу ископаемого топлива: §G+3,00%§!\n§HДоходы от экспорта ресурсов§!Мультипликатор: §G+1,50%§!\n"
 SAU_India_one_IMEC_india_deal: "[RAJ.GetFlag] §HЭкономический коридор Индия-Ближний Восток-Европа§![SAU.GetFlag] (IMEC)"
 SAU_India_one_IMEC_india_deal_desc: "Экономический коридор Индия-Ближний Восток-Европа связывает индийские порты через Персидский залив с европейскими рынками по железной дороге и морю. Индия находится у восточных ворот этого коридора и получает прибыль с каждой отправленной грузом."
 SAU_iraq_border_defense: "Северные пограничные оборонительные сооружения"
 SAU_iraq_border_defense_desc: "Армия окопалась вдоль иракской границы, готовая к повторению событий 1990 года. +10% к обороне Ирака. Отменяется после свержения Саддама."
 SAU_iraq_pipeline_t1: "Европейский трубопровод (первый уровень)"
 SAU_iraq_pipeline_t1_desc: "Саудовская нефть течет на север через Ирак в сторону Турции и европейского рынка, который Москва так ревностно оберегает. §GДополнительный доход: $2,25 млрд§! от экспорта по трубопроводу против §RДополнительных расходов: $1,00 млрд§! на транзитные сборы странам, через которые проходит линия, — чистыми §G+$1,25 млрд§! в неделю. Саботаж понижает линию на один уровень, срезая и то и другое; перерезанная линия 1-го уровня закрывает маршрут."
 SAU_iraq_pipeline_t2: "Европейский трубопровод (второго уровня)"
 SAU_iraq_pipeline_t2_desc: "Саудовская нефть течет на север через Ирак в сторону Турции и европейского рынка, который Москва так ревностно оберегает. §GДополнительный доход: $2,75 млрд§! от экспорта по трубопроводу против §RДополнительных расходов: $1,15 млрд§! на транзитные сборы странам, через которые проходит линия, — чистыми §G+$1,60 млрд§! в неделю. Саботаж понижает линию на один уровень, срезая и то и другое; перерезанная линия 1-го уровня закрывает маршрут."
 SAU_iraq_pipeline_t3: "Европейский трубопровод (третий уровень)"
 SAU_iraq_pipeline_t3_desc: "Саудовская нефть течет на север через Ирак в сторону Турции и европейского рынка, который Москва так ревностно оберегает. §GДополнительный доход: $3,25 млрд§! от экспорта по трубопроводу против §RДополнительных расходов: $1,25 млрд§! на транзитные сборы странам, через которые проходит линия, — чистыми §G+$2,00 млрд§! в неделю. Саботаж понижает линию на один уровень, срезая и то и другое; перерезанная линия 1-го уровня закрывает маршрут."
 SAU_islamic_leadership: "Лидер исламского мира"
 SAU_islamic_leadership_desc: "Благодаря тому, что Саудовская Аравия контролирует Мекку и Медину, а также участвует в крупных исламских саммитах, Эр-Рияд обладает значительным влиянием во всем мусульманском мире."
 SAU_israel_tech_partnership: "Кремний и песок"
 SAU_israel_tech_partnership_desc: "Эр-Риядские соглашения объединяют саудовские инвестиции с израильскими технологиями и поддерживают совместные исследования в обеих странах."
 SAU_junta_accepted: "Совет: Принято"
 SAU_junta_contested: "Совет: спорный вопрос"
 SAU_junta_illegitimate: "Совет: нелегитимный"
 SAU_junta_rejected: "Совет: Отклонено"
 SAU_junta_tolerated: "Совет: Терпимо"
 SAU_laf_offensive: "Операция «Кедровая резня»"
 SAU_laf_offensive_desc: "Финансирование и поставка техники из Саудовской Аравии повысили возможности и готовность ливанской армии проводить наступательные операции против «Хезболлы»."
 SAU_national_water_pride_minus1: "§HСуверенные воды§! - §YСомнительно§!"
 SAU_national_water_pride_minus1_desc: "При уровне стабильности 35-44% общественное доверие к §LСаудовская Аравия§! Программа водоснабжения ослабевает. Это приводит к... §Yнебольшая потеря легитимности§! для династии."
 SAU_national_water_pride_minus2: "§HСуверенные воды§! - §RНапряжённо§!"
 SAU_national_water_pride_minus2_desc: "Низкая стабильность привела к усилению частной критики в адрес §Lнациональная программа водоснабжения§!Низкие показатели династии наносят ущерб ее репутации."
 SAU_national_water_pride_minus3: "§HСуверенные воды§! - §RОбратный эффект§!"
 SAU_national_water_pride_minus3_desc: "Программа водоснабжения стала ярким примером неэффективного управления со стороны правительства. Продолжающаяся нехватка воды приводит к... §Rсерьезная потеря поддержки§! для династии."
 SAU_national_water_pride_minus4: "§HСуверенные воды§! - §RКатастрофические§!"
 SAU_national_water_pride_minus4_desc: "В условиях §Rкрайняя нестабильность§!Нехватка воды серьезно подорвала легитимность §HДом аль-Сауд§!Только восстановление стабильности или падение династии положат конец этому наказанию."
 SAU_national_water_pride_neutral: "§HСуверенные воды§! - §YУстойчиво§!"
 SAU_national_water_pride_neutral_desc: "При уровне стабильности около 50% национальная программа водоснабжения не приносит ни политической выгоды, ни негативных последствий. Изменение уровня стабильности приведет к переходу программы в положительную или отрицательную категорию."
 SAU_national_water_pride_plus1: "§HСуверенные воды§! - §GУдовлетворительно§!"
 SAU_national_water_pride_plus1_desc: "Достаточная стабильность и надежное водоснабжение сохраняют репутацию династии и обеспечивают §Gскромный§! политическая выгода."
 SAU_national_water_pride_plus2: "§HСуверенные воды§! - §GПроцветание§!"
 SAU_national_water_pride_plus2_desc: "Высокая стабильность и надежная работа §LСаудовская Аравия§! Системы опреснения воды демонстрируют компетентность правительства и повышают уважение к... §HДом аль-Сауд§!."
 SAU_national_water_pride_plus3: "§HСуверенные воды§! - §GУверенно§!"
 SAU_national_water_pride_plus3_desc: "Высокая стабильность сделала национальную программу водоснабжения §Hисточник внутреннего престижа§!Спрос на §LКАУС§! Дополнительными преимуществами являются опыт работы за рубежом и финансовая отдача от программы."
 SAU_national_water_pride_plus4: "§HСуверенные воды§! - §GТриумф§!"
 SAU_national_water_pride_plus4_desc: "Программа водоснабжения, принадлежащая Саудовской Аравии (§LSaudi-owned§!), широко признана крупным национальным достижением. Ее успех обеспечивает Дому аль-Саудов (§HHouse of al Saud§!) максимальную легитимность, которую программа обеспечивает."
 SAU_nda_free_press: "Свободная пресса"
 SAU_nda_free_press_loc: "[SAU.GetFlag]A Свободная пресса\n§HУвеличение политической власти:§! §G+5.00%§! \n§HЗащита от иностранного влияния:§! §G+20.00%§!\n\n"
 SAU_nda_free_world: "Член свободного мира"
 SAU_nda_free_world_loc: "[SAU.GetFlag]A Член свободного мира\n§HТорговое мнение:§! §G+15.00%§!\n§HЕжемесячный прирост мнения:§! §G+20.00%§!\n\n"
 SAU_nda_knowledge_economy: "Экономика знаний"
 SAU_nda_knowledge_economy_loc: "[SAU.GetFlag]A Экономика знаний\n§HСкорость исследований:§! §G+5.00%§!\n§HСтабильность:§! §G+3.00%§!\n\n"
 SAU_nda_open_market: "Открытые рынки"
 SAU_nda_open_market_loc: "[SAU.GetFlag]Открытые рынки\n§HПотребительские товары:§! §G-10.00%§!\n§HСтоимость иностранных инвестиций:§! §G-5.00%§!\n§HРентабельность инвестиций:§! §G+5.00%§!\n\n"
 SAU_neom_aqaba_zone: "Экономическая зона NEOM-Акаба"
 SAU_neom_aqaba_zone_desc: "Саудовский мегаполис NEOM и иорданский порт Акаба функционируют как единая трансграничная экономическая зона, ускоряя строительство и пополняя государственную казну."
 SAU_oil_defend_price_idea: "Защита цены"
 SAU_oil_defend_price_idea_desc: "Саудовская Аравия сократила добычу нефти, чтобы поддержать мировые цены. Это увеличивает выручку с барреля, но снижает долю рынка в пользу производителей, которые сохраняют объемы добычи."
 SAU_oil_dependence_t1: "§GНефтяная экономика§! - Диверсифицированная"
 SAU_oil_dependence_t1_desc: "§HЗависимость от нефти: §!§Y[?oil_dependence|0]§!§H / 100§!\n§RМенялось автоматически каждые 3 месяца.§!\n\nСовременная, диверсифицированная экономика. Нефть — лишь один из многих экспортных товаров, которые экспортирует Королевство. §Gустойчивый§! Независимо от колебаний цены на нефть. Видение 2030 достигнуто."
 SAU_oil_dependence_t2: "§YНефтяная экономика§! - Широкомасштабная"
 SAU_oil_dependence_t2_desc: "§HЗависимость от нефти: §!§Y[?oil_dependence|0]§!§H / 100§!\n§RМенялось автоматически каждые 3 месяца.§!\n\nПромышленность, сфера услуг и технологии теперь имеют реальное значение. Нефтяной кризис можно пережить, но он не является катастрофой."
 SAU_oil_dependence_t3: "§YНефтяная экономика§! - Диверсификация"
 SAU_oil_dependence_t3_desc: "§HЗависимость от нефти: §!§Y[?oil_dependence|0]§!§H / 100§!\n§RМенялось автоматически каждые 3 месяца.§!\n\nЭкономика расширяется. Нефть остается крупнейшей опорой, но уже не единственной."
 SAU_oil_dependence_t4: "§RНефтяная экономика§! - Зависимость от нефти"
 SAU_oil_dependence_t4_desc: "Зависимость от нефти: §HЗависимость от нефти: §!§Y[?oil_dependence|0]§!§H / 100§!\n§RИзменяется каждые 3 месяца автоматически§!\n\nНефтяные сектора растут, но нефть по-прежнему покрывает почти все расходы. Обвал цен все равно сильно ударит по экономике."
 SAU_oil_dependence_t5: "§RНефтяная экономика§! - Total Petrostate"
 SAU_oil_dependence_t5_desc: "§HЗависимость от нефти: §!§Y[?oil_dependence|0]§!§H / 100§!\n§RМенялось автоматически каждые 3 месяца.§!\n\nКоролевство живет и умирает от бочки. Нефть — это... §Gпочти все§! из бюджета - чрезвычайно прибыльно, но §Rопасно подверженный§! к любому обвалу мировых цен.\n§YЗависимость от нефти меняется только в зависимости от ваших приоритетов и решений: выбор нефтяных ресурсов повышает её, диверсификация снижает. Королевство изначально находится в глубокой зависимости; только последовательные реформы позволяют её снизить, и она остаётся на том же уровне, на котором вы её оставили.§!"
 SAU_oil_embargoed: "§RНефтяное эмбарго§!"
 SAU_oil_embargoed_desc: "Саудовская Аравия и ее партнеры по ОПЕК прекратили поставки нефти. Очереди на топливо, закрытие заводов и стремительный рост цен парализуют экономику до тех пор, пока эмбарго не будет снято."
 SAU_oil_for_security_pact: "Нефть для безопасности"
 SAU_oil_for_security_pact_desc: "Королевство поставляет нефть на американские рынки, а Вашингтон обеспечивает безопасность Саудовской Аравии. Эта договоренность служит опорой как для риала, так и для доллара и для династии Саудов."
 SAU_oil_for_security_pact_loc: "[USA.GetFlag]Нефть для безопасности\n§HМультипликатор доходов от экспорта ископаемого топлива:§! §G+5.00%§!\n"
 SAU_oil_for_security_pact_USA: "Нефть для безопасности"
 SAU_oil_for_security_pact_USA_desc: "Эр-Рияд гарантирует поставки нефти на американские рынки: дешевое и надежное топливо в обмен на американскую защиту."
 SAU_oil_market_share_idea: "Защита доли рынка"
 SAU_oil_market_share_idea_desc: "Саудовская Аравия поддерживает высокий уровень добычи и соглашается на более низкие цены, чтобы сохранить свою долю на нефтяном рынке. Низкие затраты на добычу позволяют ей выживать дольше, чем более дорогие производители."
 SAU_oil_price_collapse_idea: "Обвал цен на нефть"
 SAU_oil_price_collapse_idea_desc: "Цены на нефть значительно ниже уровня, заложенного в государственном бюджете. Экспортные доходы сократились, в то время как социальные расходы остаются высокими, что вынуждает правительство использовать свои резервы."
 SAU_OPEC_Russia_deal_new: "Координация ОПЕК+"
 SAU_OPEC_Russia_deal_new_desc: "Эр-Рияд и Москва совместно устанавливают квоты на добычу. Две нефтяные сверхдержавы управляют одним рынком."
 SAU_OPEC_Russia_deal_new_loc: "\n§H[SAU.GetFlag]Соглашение ОПЕК+[SOV.GetFlag]§!\n§HМультипликатор доходов от экспорта ископаемого топлива:§! §G+5,00%§!\n"
 SAU_pipeline_empire: "Перекресток энергии"
 SAU_pipeline_empire_desc: "Теперь Саудовская Аравия имеет нефтеэкспортные маршруты по трем морям и больше не зависит от Ормузского пролива как единственного крупного канала сбыта."
 SAU_pipeline_transit_IRQ_t1: "Транзитный трубопровод Саудовской Аравии (первый уровень)"
 SAU_pipeline_transit_IRQ_t1_desc: "Саудовская нефть транспортируется через Ирак, и транзитные сборы пополняют казну. Трубопровод увеличивает добычу нефти в стране. §GAДополнительный доход: $1.00B§!"
 SAU_pipeline_transit_IRQ_t2: "Транзитный трубопровод Саудовской Аравии (второй уровень)"
