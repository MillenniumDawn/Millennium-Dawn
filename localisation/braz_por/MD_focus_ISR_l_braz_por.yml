 israel_news.16.t: "Isratina é Unificada!"
 israel_news.16.d: "Recentemente, devido a uma mudança radical na esfera política israelense, Israel e Palestina decidiram se unificar em um Estado binacional chamado Isratina.\n\nMuitos dizem que a união é muito instável e só o futuro mostrará o que acontecerá a seguir..."
