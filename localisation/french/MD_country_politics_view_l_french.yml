 increase_election_threshold_TT: "Le seuil électoral est le pourcentage minimum qu'un parti politique doit atteindre avant d'être considéré comme un parti valide à la représentation législative.\n\n§YPrérequis :§! \n[!increase_election_threshold_click_enabled]\n§YEffets :§!\n[!increase_election_threshold_click]\n\nCe changement s'appliquera aux prochaines élections, ce qui rendra plus difficile l'accès au pouvoir des petits partis."
 decrease_election_threshold: "§YDiminuer le seuil électoral§!"
 decrease_election_threshold_TT: "Le seuil électoral est le pourcentage minimum qu'un parti politique doit atteindre avant d'être considéré comme un parti valide à la représentation législative.\n\n§YPrérequis :§!\n[!decrease_election_threshold_click_enabled]\n§YEffets :§!\n[!decrease_election_threshold_click]\n\nCe changement s'appliquera aux prochaines élections, ce qui rendra plus facile l'accès au pouvoir des petits partis."
