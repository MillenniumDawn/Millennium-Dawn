 NKO_china_economic_assistant: "Aide économique chinoise"
 NKO_china_economic_assistant_desc: "L'aide économique de la Chine à la Corée du Nord représente environ la moitié de toute l'aide étrangère chinoise. Pékin fournit cette aide directement à Pyongyang, ce qui lui permet de contourner les Nations Unies. Pendant la période de grave pénurie alimentaire entre 1996 et 1998, Pékin a fourni une aide alimentaire inconditionnelle à la Corée du Nord."
 CHI_china_economic_assistant: "Aide économique chinoise"
 CHI_china_economic_assistant_desc: "L'aide économique de la Chine à la Corée du Nord représente environ la moitié de toute l'aide étrangère chinoise. Pékin fournit l'aide directement à Pyongyang, ce qui lui permet de contourner les Nations Unies. Pendant la période de grave pénurie alimentaire entre 1996 et 1998, Pékin a fourni une aide alimentaire inconditionnelle à la Corée du Nord.\n§W--------------§!\nCet esprit national sera §Rsupprimé§! si §Y[NKO.GetNameWithFlag]§! cesse d'exister, n'est plus gouverné par un gouvernement communiste ou entre en guerre contre nous."
 NKO_rus_friend_category: "Alliance russo-nord-coréenne"
 NKO_rus_friend_category_desc: "L'histoire des relations entre [NKO.GetFlag]§YCorée§! et [SOV.GetFlag]§YRussie§! remonte à plusieurs décennies, depuis les premières relations avec §Yl'Empire russe§! jusqu'à l'assistance de §Rl'Union soviétique§! pendant la §Rguerre§! avec [KOR.GetFlag]§YCorée du Sud§!. Il est maintenant temps de §Gréveiller§! les anciennes relations entre les pays et de les élever à un nouveau niveau pour ne pas répéter les erreurs du passé."
