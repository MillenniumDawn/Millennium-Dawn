 floating_harbor_equipment: "모듈식 가설 부두 체계"
 floating_harbor_equipment_desc: "조립식 부교 구획을 제자리로 예인하여 정비되지 않은 해안에서 떨어진 곳에 고정함으로써, 가동 중인 항구가 없는 곳에서도 상륙군이 화물을 하역할 수 있게 합니다. 공중 및 해상 공격에 노출되며 몇 주 안에 파손됩니다."
 floating_harbor_equipment_1: "모듈식 가설 부두 체계"
 floating_harbor_equipment_1_desc: "조립식 부교 구획을 제자리로 예인하여 정비되지 않은 해안에서 떨어진 곳에 고정함으로써, 가동 중인 항구가 없는 곳에서도 상륙군이 화물을 하역할 수 있게 합니다. 공중 및 해상 공격에 노출되며 몇 주 안에 파손됩니다."
 module_light_surface_fut_reactor_power: "최첨단 경량 원자로"
 module_light_surface_fut_reactor_power_desc: "차세대 경량 원자로는 출력 밀도와 항속 시간을 개선하여 소형 수상 전투함에 더 높은 속도와 전 지구적 작전 범위를 부여합니다.\n\n§G설계 힌트: 이 기관은 연료 비용 없이 높은 속력과 항속거리를 제공하지만 생산 비용이 극단적으로 비쌉니다. 전 지구적 전력 투사가 가능한 경량 함선이 필요한 국가에 권장됩니다.§!"
 module_light_surface_fut_reactor_power2: "하이퍼 첨단 경량 원자로"
 module_light_surface_fut_reactor_power2_desc: "$module_light_surface_fut_reactor_power_desc$"
 UKR_module_light_helipad_1: "Ka-25/Ka-27"
 UKR_module_helipads_1: "Ka-25"
 UKR_module_helipads_2: "Ka-27"
 UKR_module_chain_gun: "2M-3M"
 UKR_module_chain_gun_desc: "2M-3은 소련의 자동 쌍열 25mm 함포 거치대입니다. 함선의 자위 수단이며 최대 사거리 3000 m의 경사 거리에 있는 표적을 타격할 수 있습니다."
 UKR_module_ciws_1: "AK-230"
 UKR_module_ciws_1_desc: "AK-230은 소련의 완전 자동 쌍열 30mm 함포입니다. 주된 기능은 대공 방어입니다. 밀폐형 자동 포탑에 장착되며 레이더로 지향됩니다."
 UKR_module_ciws_2: "AK-630"
 UKR_module_ciws_2_desc: "AK-630은 소련 및 러시아의 완전 자동 함상 회전식 기관포 근접 방어 무기 체계입니다. '630'이라는 명칭은 이 무기의 6개 포신과 30mm 구경을 가리킵니다."
 UKR_module_ciws_3: "35mm 외를리콘 밀레니엄"
 UKR_module_ciws_3_desc: "라인메탈 외를리콘 밀레니엄 건, 즉 라인메탈 GDM-008은 라인메탈 에어 디펜스 AG(구 외를리콘 콘트라베스)가 함선 탑재용으로 설계한 근접 방어 무기 체계입니다. 지상 배치형 대공 방어 체계인 35/1000 리볼버 건을 기반으로 하며 AHEAD(Advanced Hit Efficiency And Destruction) 탄약을 사용합니다."
 UKR_module_naval_ammo_air_defense_2: "S-300F 포트"
 UKR_module_naval_ammo_air_defense_2_desc: "S-300F 포트는 1984년에 도입된 소련의 지대공 미사일(SAM) 체계입니다. 초저고도에서 고고도에 이르는 전 고도 범위에서 고속, 고기동 및 소형 표적을 파괴하도록 설계된 수직 발사 체계를 갖춘 해상 기반 대공 미사일 체계입니다."
 UKR_module_naval_ammo_air_defense_4: "드니프로"
 UKR_module_naval_ammo_air_defense_4_desc: "드니프로는 우크라이나 방위 산업 단지의 여러 기업이 개발한 우크라이나의 유망한 중거리 대공 미사일 체계(SAMS)입니다. '볼로디미르 벨리키' 급 초계함에 탑재될 예정이었습니다."
 UKR_module_ram_3: "3M87 코르티크"
 UKR_module_ram_3_desc: "3M87 코르티크 CIWS는 러시아 해군이 배치한 현대적인 함상 대공 방어 포·미사일 복합 체계입니다. 수출형은 '카슈탄'으로 알려져 있습니다."
 UKR_module_naval_ammo_anti_ship_1: "P-15 테르미트"
 UKR_module_naval_ammo_anti_ship_1_desc: "P-15 테르미트는 1950년대 소련의 라두가 설계국이 개발한 대함 미사일입니다. P-15M은 원래의 P-15보다 더 무겁고 길며, 사거리는 80 km(50 마일)이고 몇 가지 사소한 개선이 있었습니다."
 UKR_module_naval_ammo_anti_ship_2: "P-270 모스키트"
 UKR_module_naval_ammo_anti_ship_2_desc: "P-270 모스키트는 소련의 초음속 램제트 추진 대함 순항 미사일입니다. GRAU 제식명은 3M80이며, 공중 발사형은 Kh-41입니다. 이 미사일 체계는 1970년대에 라두가 설계국이 P-120 '말라히트'의 후속이자 P-15 테르밋의 대체용으로 설계했습니다."
 UKR_module_naval_ammo_anti_ship_3: "P-500 바잘트"
 UKR_module_naval_ammo_anti_ship_3_desc: "P-500 바잘트는 소련 및 러시아 해군이 사용하는 터보제트 추진 초음속 순항 미사일입니다. 유도 장치와 엔진을 개선한 P-500 바잘트 버전은 슬라바급 순양함에 사용됩니다. 상부 구조물 양측에 늘어선 16개의 발사관은 이 순양함급의 틀림없는 특징입니다."
 UKR_module_naval_ammo_anti_ship_4: "R-360 넵툰"
 UKR_module_naval_ammo_anti_ship_4_desc: "R-360 넵툰은 키이우의 루치 설계국이 개발한 전천후 능력을 갖춘 우크라이나의 아음속 순항 미사일입니다. 사거리가 200 킬로미터를 넘으며, 최대 9,000 톤의 해상 표적을 무력화하는 것을 목적으로 합니다."
 UKR_module_naval_ammo_anti_ship_5: "코르슌-2"
 UKR_module_naval_ammo_anti_ship_5_desc: "코르슌-2는 유망한 우크라이나의 아음속 순항 미사일 프로젝트입니다. 이 미사일은 이동식 지상 차체나 함선, 항공기 하부 파일런에 모두 배치할 수 있습니다. 설계국 '피우덴네'가 국제 군사 전시회 '무기와 안보-2014'에서 처음 공개했습니다."
 UKR_module_naval_ammo_anti_ship_6: "코르슌-2M"
 UKR_module_naval_ammo_anti_ship_6_desc: "코르슌-2M은 설계국 피우덴네가 준비한 코르슌-2 순항 미사일의 개량 계획 프로젝트입니다."
 UKR_naval_ammo_asw_1: "RPK-1 비흐르"
 UKR_naval_ammo_asw_1_desc: "RPK-1 비흐르(나토 보고명 SUW-N-1)는 소련의 핵 대잠수함 미사일 체계였습니다. FRAS-1은 미사일 탄체 자체에 대한 나토 코드명이었습니다. 이 미사일의 개발은 새로운 미국 핵잠수함에 대응하기 위해 1960년에 지시되었습니다."
 UKR_naval_ammo_asw_2: "URK-5 라스트루브-B"
 UKR_naval_ammo_asw_2_desc: "URK-5 라스트루브-B는 소련의 함상 대잠수함 미사일 체계입니다. 이 복합체는 URPK-3 '메텔' 복합체를 개량한 것입니다. 잠수함은 물론 적이 될 수 있는 상대의 수상 전투함과 선박을 파괴하는 데 사용됩니다."
 UKR_module_torpedoes_1: "SET-40"
 UKR_module_torpedoes_1_desc: "SET-40은 소음이 적은 잠수함을 파괴하기 위한 소련의 소형 전기 추진 음향 유도 대잠 어뢰의 한 종류입니다. 이 어뢰는 1960년대에 개발되어 소련과 바르샤바 조약 국가들의 수상함, 잠수함, 해군 항공대에서 운용되었습니다."
 UKR_module_torpedoes_2: "SET-65"
 UKR_module_torpedoes_2_desc: "SET-65는 잠수함을 파괴하기 위해 설계된 구경 533 mm의 소련 대잠 유도 전기 어뢰입니다. V. A. 골루브코프의 지휘 아래 기드로프리보르 연구소가 개발했으며 1965년에 취역했습니다."
 UKR_module_torpedoes_3: "MU90 임팩트"
 UKR_module_torpedoes_3_desc: "MU90 임팩트는 프랑스 및 이탈리아 해군과 수출을 위해 개발된 프랑스-이탈리아의 3세대 고급 경량 대잠 어뢰입니다."
 UKR_module_anti_ship_torpedoes_1: "53-57"
 UKR_module_anti_ship_torpedoes_1_desc: "53-57은 수상함과 선박을 파괴하고, 물가에 위치한 해안 구조물을 파괴하기 위한 소련의 직진식 장거리 항적 없는 어뢰입니다."
 UKR_module_anti_ship_torpedoes_2: "53-65K"
 UKR_module_anti_ship_torpedoes_2_desc: "53-65 어뢰 계열은 수상함을 파괴하기 위해 설계된 러시아제 항적 추적 어뢰입니다. 53-65는 1965년에 운용을 개시했고, 53-65K와 53-65M은 모두 1969년에 운용을 개시했습니다."
 UKR_module_aa_missiles_1: "MTU-4 이글라-1"
 UKR_module_aa_missiles_1_desc: "대공 미사일 체계는 선미에 위치하며 9K310 '이글라-1' 대공 미사일용 유도 레일 4개를 갖춘 안정화된 해상 받침대 설치형입니다."
 UKR_module_aa_missiles_2: "M-4 오사-M"
 UKR_module_aa_missiles_2_desc: "M-4 오사-M은 러시아의 자동화된 군용 함상 쌍붐 대공 미사일 체계이며, 오사 방공 체계의 해군형입니다."
 UKR_module_aa_missiles_4: "코랄"
 UKR_module_aa_missiles_4_desc: "코랄은 중거리 체계용 대공 유도 미사일을 만드는 우크라이나의 프로젝트입니다. 2016년부터 루치 설계국이 개발하고 있습니다. 이 제품은 함정 및 지상 기반 대공 미사일 체계와 공군을 위한 모듈식 설계의 기본 통합 미사일이 될 예정입니다."
 UKR_module_esm_1: "벰펠-R2 및\nPK-16 / PK-10"
 UKR_module_esm_1_desc: "전자전 레이더 벰펠-R2는 작동 중인 함정 및 항공기 레이더와 미사일 유도 탐색기에서 방출되는 전파를 탐지하고 이에 대한 능동 간섭을 생성하도록 설계되었습니다.\nPK-16/PK-10은 수동 교란(다이폴 반사체 및 가짜 열 표적)을 설치하기 위한 소련의 함상 전자 교란 체계입니다."
 UKR_module_esm_2: "MP-401S 스타르트-S 및\nPK-10 / PK-2"
 UKR_module_esm_2_desc: "MP-401S '스타르트-S' 표적 지정 및 교란 복합체는 무기 탐지 및 통제 레이더와 대함 미사일 레이더를 제압하도록 설계되었습니다.\nPK-2/PK-10은 수동 교란(다이폴 반사체 및 가짜 열 표적)을 설치하기 위한 소련의 함상 전자 교란 체계입니다."
 UKR_module_esm_3: "TK-25E 및\nPK-10 / PK-2"
 UKR_module_esm_3_desc: "TK-25E는 항공기 및 함상 무기 탐지·통제 레이더 기지와 대함 미사일의 레이더 유도 탐색기의 전파를 수신하고, 전파를 자동으로 분석하여 함선에 대한 공격의 가장 위험한 방향을 판별하며, 위험한 방향에 간섭을 생성하도록 설계되었습니다.\nPK-2/PK-10은 수동 교란(다이폴 반사체 및 가짜 열 표적)을 설치하기 위한 소련의 함상 전자 교란 체계입니다."
 UKR_module_76mm_battery: "2x2 57mm AK-725"
 UKR_module_76mm_battery_desc: "AK-725는 57mm 구경의 소련제 범용 쌍열 함포 거치대입니다. 전후 2세대 자동 포 체계입니다."
 UKR_module_100mm_battery: "2x2 76mm AK-726"
 UKR_module_100mm_battery_desc: "AK-726은 소련에서 개발되어 여러 해군에서 여전히 운용 중인 쌍열 76밀리미터(3인치) 함포입니다."
 UKR_module_127mm_battery: "2x1 100mm AK-100"
 UKR_module_127mm_battery_desc: "AK-100은 분당 최대 60발의 발사 속도를 가진 소련의 100mm 함포로, 26.8 kg 탄약을 고폭 대공탄 또는 고폭 파편탄으로 발사합니다."
 UKR_module_76mm_gun_1: "57mm AK-725"
 UKR_module_76mm_gun_1_desc: "AK-725는 57mm 구경의 소련제 범용 쌍열 함포 거치대입니다. 전후 2세대 자동 포 체계입니다."
 UKR_module_76mm_gun_2: "76mm AK-176"
 UKR_module_76mm_gun_2_desc: "AK-176은 밀폐형 포탑에 장착된 소련의 76mm 함포로, 해상, 해안 및 공중 표적은 물론 저공 비행하는 대함 미사일에도 사용할 수 있습니다. 이 체계는 배수량이 작은 함선을 무장시키기 위해 설계되었으며 MR-123-02/76 사격 통제 레이더 체계를 갖춘 포 거치대로 구성됩니다."
 UKR_module_76mm_gun_3: "76mm 오토 멜라라"
 UKR_module_76mm_gun_3_desc: "OTO 76/62 포 거치대라는 이름으로 판매되는 오토 멜라라 76 mm 포는 이탈리아 방산 업체 오토 멜라라가 제작·설계한 함상 기관포입니다. 오토 멜라라 76/62C를 기반으로 하며 76/62 SR과 76/62 스트랄레스로 발전했습니다."
 UKR_module_127mm_guns_1: "100mm AK-100"
 UKR_module_127mm_guns_1_desc: "AK-100은 분당 최대 60발의 발사 속도를 가진 소련의 100mm 함포로, 26.8 kg 탄약을 고폭 대공탄 또는 고폭 파편탄으로 발사합니다."
 UKR_module_127mm_guns_2: "130mm AK-130"
 UKR_module_127mm_guns_2_desc: "AK-130은 구경이 130 밀리미터(5.1인치)이며 분당(포신당) 10~40발을 발사할 수 있는, 러시아가 설계한 자동 쌍열 함포입니다."
 UKR_module_radar_1: "MR-302 §7루브카§! / MR-310 §7안가라§!"
 UKR_module_radar_1_desc: "MR-302 루브카는 1960년부터 개발된 F밴드로 작동하는 대공 및 대수상 탐색 레이더입니다.\nMR-331 란구트는 소형 함선이 항해, 대공 및 대수상 탐색, 그리고 P-15 테르미트 계열 지대지 미사일의 표적 획득에 사용하는 X밴드 함상 레이더였습니다."
 UKR_module_radar_2: "MR-220 §7레이드§! / MR-352 §7포지티프§!"
 UKR_module_radar_2_desc: "MR-302 루브카는 1960년부터 개발된 F밴드로 작동하는 대공 및 대수상 탐색 레이더입니다.\nMR-331 란구트는 소형 함선이 항해, 대공 및 대수상 탐색, 그리고 P-15 테르미트 계열 지대지 미사일의 표적 획득에 사용하는 X밴드 함상 레이더였습니다."
 UKR_module_radar_3: "MR-750 §7프레가트-M§! / MR-755 §7프레가트-MA§!"
 UKR_module_radar_3_desc: "!!!"
 UKR_module_radar_4: "MR-800 §7플라크§!"
 UKR_module_radar_4_desc: "MR-800 플라크는 주파수 다양성을 이용하는 D밴드 작동 장거리 3D 대공 감시 레이더 MR-600 보스호트와, 대수상 탐색용 MR-500 '클리버' 레이더를 결합한 복합체입니다."
 UKR_module_radar_5: "탈레스 SMART-S"
 UKR_module_radar_5_desc: "SMART-S는 고속 초계정 이상의 모든 유형의 함정을 대상으로 하는 S밴드 작동 전천후 3D 표적 지시 및 감시 레이더 체계입니다. 주된 용도는 자료 처리와 무기 체계 통제를 위한 주 센서이며, 심한 클러터와 전자 대응 수단이 존재하는 환경에서도 매우 높은 성능을 발휘합니다."
 UKR_module_sonar_1: "MG-322 §7아그룬§! 및 MG-339 §7셸론§!"
 UKR_module_sonar_1_desc: "§7아그룬§!은 §7전방위§! 탐지와 표적 지정을 위한 소련의 §72세대§! 저주파 선체 장착 소나입니다.\n§7셸론§!은 선미 상부 구조물에 하강식 안테나를 갖춘 소련의 §72세대§! 중주파 예인 소나입니다."
 UKR_module_sonar_2: "MG-332 §7티탄-2§! 및 MG-325 §7베가§!"
 UKR_module_sonar_2_desc: "§7티탄-2§!는 §7전방위§! 탐지와 표적 지정을 위한 소련의 §72세대§! 저주파 선체 장착 소나입니다.\n§7베가§!는 선미 상부 구조물에 하강식 안테나를 갖춘 소련의 §72세대§! 중주파 예인 소나입니다."
 UKR_module_sonar_3: "MG-335 §7플라티나§! 및 MG-345 §7브론자§!"
 UKR_module_sonar_3_desc: "§7플라티나§!는 §7전방위§! 탐지와 표적 지정을 위한 소련의 §73세대§! 저주파 선체 장착 소나입니다.\n§7브론자§!는 선미 상부 구조물에 하강식 안테나를 갖춘 소련의 §73세대§! 중주파 예인 소나입니다."
 UKR_module_sonar_4: "MGK-365 §7즈베즈다 M1§!"
 UKR_module_sonar_4_desc: "§7즈베즈다§!는 §7전방위§! 탐지와 표적 지정을 위한 소련의 §74세대§! 저주파 선체 장착 소나입니다."
 UKR_module_naval_radar_jammer_2: "§7프로티디야§!"
 UKR_module_naval_radar_jammer_2_desc: "§7프로티디야§!는 28250 계획 볼로디미르 벨리키급 초계함에 장착하도록 설계된 제안된 해군 전자전 체계입니다. 이 체계의 목적은 적의 레이더 신호를 수신하고 교란하며, 날아오는 미사일에 대한 전자 대응 수단을 제공하는 것입니다."
