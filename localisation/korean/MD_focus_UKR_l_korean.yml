 UKR_develop_bastion03: "§Y'바스티온-03'§! 다연장 로켓 개발"
 UKR_develop_Vilkha: "§Y'빌하'§! 다연장 로켓 개발"
 UKR_develop_bureviy: "차세대 다연장 로켓 §Y'부레비'§! 개발"
 UKR_modernize_mi24pu1: "§YMi-24PU1§! 현대화 개발"
 ukraine_reorganize_navy_build_simferopol_recon_ship.1.name: "심페로폴 - 리발스키 선대 위의 선체"
 ukraine_reorganize_navy_build_simferopol_recon_ship.1.desc: "이 조선소는 1971년 이래 이런 선박을 347척 진수시켰으며 도면을 훤히 알고 있다. 지금 선대에는 미완성 502EM이 놓여 있다. 어선이지만, 우리에게 필요한 배수량과 항속거리, 지속 항해 능력을 갖춘 어선이다.\n\n대안은 버려진 선체를 완성하는 대신 같은 502EM 도면으로 새 용골을 놓는 것이다. 조선소는 기뻐할 것이다. 재무부는 그렇지 않을 것이다."
 ukraine_reorganize_navy_build_simferopol_recon_ship.1.a: "트롤어선 선체를 개조한다."
 ukraine_reorganize_navy_build_simferopol_recon_ship.1.b: "같은 도면으로 새 용골을 놓는다."
 ukraine_reorganize_navy_build_simferopol_recon_ship.1.c: "해군에는 더 시급한 수요가 있다."
 ukraine_reorganize_navy_build_simferopol_recon_ship.2.name: "심페로폴 - 무엇으로 엿듣는가"
 ukraine_reorganize_navy_build_simferopol_recon_ship.2.desc: "선체는 값싼 부분이다. 이 함정의 본질은 안테나이며, 문제는 누구의 안테나인가이다.\n\n우리 연구소들은 여러 대역에 걸친 무선전자 정찰, 식별, 방향 탐지를 아우르는 수동 복합 체계를 만들 수 있다. 더 오래 걸리겠지만 그것은 우리의 것이 될 것이다. 서방의 전자정보 패키지는 통합되고 검증된 채로 도착하겠지만 값이 비싸고 조건이 따라붙을 것이다."
 ukraine_reorganize_navy_build_simferopol_recon_ship.2.a: "국산 복합 체계를 장착한다."
 ukraine_reorganize_navy_build_simferopol_recon_ship.2.b: "서방의 전자정보 패키지를 구매한다."
 ukraine_reorganize_navy_build_simferopol_recon_ship.3.name: "심페로폴 - 드니프로강을 따라 내려가다"
 ukraine_reorganize_navy_build_simferopol_recon_ship.3.desc: "함정이 리발스키에서 진수된다. 이제 곤란한 부분이 남았다. 조선소는 키이우에 있고 함대는 흑해에 있으며, 그 사이에는 다리가 놓인 600킬로미터의 강이 있다.\n\n안전한 방법은 헤르손과 그 너머까지 내내 부유식 독에 실어 옮기는 것이다. 값싼 방법은 자체 선체로 내려보내면서 흘수와 교량 높이가 맞기를 바라는 것이다."
 ukraine_reorganize_navy_build_simferopol_recon_ship.3.a: "부유식 독에 실어 옮긴다."
 ukraine_reorganize_navy_build_simferopol_recon_ship.3.b: "자체 선체로 내려보낸다."
 ukraine_reorganize_navy_build_simferopol_recon_ship.4.name: "심페로폴 - 드니프로강에서 좌초하다"
 ukraine_reorganize_navy_build_simferopol_recon_ship.4.desc: "함정은 헤르손 하류에서 추진 장치가 손상된 채 꼼짝 못 하고 있으며, 인도 승조원들은 매우 난처해하고 있다. 조선소는 고칠 수 있다고 말한다. 조선소는 언제나 그렇게 말한다."
 ukraine_reorganize_navy_build_simferopol_recon_ship.4.a: "수리 비용을 지불한다."
 ukraine_reorganize_navy_build_simferopol_recon_ship.4.b: "헤르손에 내버려 둔다."
 ukraine_reorganize_navy_build_simferopol_recon_ship.5.name: "심페로폴 - 이송 완료"
 ukraine_reorganize_navy_build_simferopol_recon_ship_program_over_flag: " §Y심페로폴§! 정찰함 사업이 종료되었다"
 ukraine_reorganize_navy_build_simferopol_recon_ship.5.desc: "우리는 마침내 최신 정찰함을 드니프로강을 따라 아무 사고 없이 성공적으로 이동시켰다! 이제 승조원 훈련을 시작할 수 있으며, 그 후에는 이 소중한 해군 자산을 마침내 우리에게 이롭게 사용할 수 있다."
 ukraine_reorganize_navy_build_simferopol_recon_ship.5.a: "드디어!"
 ukraine_develop_btr3.1.name: "BTR-3 - UAE 입찰 결과"
 ukraine_develop_btr3.1.desc: "오늘 우리는 UAE 해병대용 장갑차 90대를 위한 진행 중인 입찰의 일환으로 UAE 현지 박람회에서 새로 개발한 BTR-3U '가디언'을 선보였습니다.\n기온이 극도로 높았음에도 발표는 훌륭했습니다.\n우리는 오늘 우리 차량의 모든 핵심 장점을 부각하는 데 성공했으며, 이제 그들 측이 발표할 최종 결과를 기다리고 있습니다."
 ukraine_develop_btr3.1.a: "그리고 우리가 이겼다!"
 ukraine_develop_btr3.1.b: "이번에는 아니었다..."
 ukraine_develop_btr3.2.name: "UAE에 BTR-3 첫 번째 물량 인도"
 ukraine_develop_btr3.2.desc: "BTR-3 장갑차의 첫 번째 물량이 아랍에미리트에 성공적으로 인도되었습니다.\n이는 우크라이나 방산 수출의 중요한 이정표이며, 새로 개발한 우리 차량이 국제 시장에서 자리를 찾았음을 보여 줍니다.\n에미리트 해병대는 이제 첫 차량들로 자체 평가와 훈련을 시작할 수 있습니다."
 ukraine_develop_btr3.2.a: "훌륭하다!"
 ukraine_develop_btr3.3.name: "UAE에 BTR-3 두 번째 물량 인도"
 ukraine_develop_btr3.3.desc: "BTR-3 장갑차의 또 다른 물량이 아랍에미리트에 도착하여 계약 조건 이행에 한 걸음 더 다가섰습니다.\n이 차량들은 초기 훈련과 평가 중에 이미 능력을 입증했으며, 현대식 장갑차의 믿을 만한 공급자라는 우리의 평판을 강화하고 있습니다.\n주문의 대부분이 인도되었으므로 계약의 성공적인 완료가 눈앞에 와 있습니다."
 ukraine_develop_btr3.3.a: "훌륭하다!"
 ukraine_develop_btr3.4.name: "UAE에 BTR-3 마지막 물량 인도"
 ukraine_develop_btr3.4.desc: "BTR-3 장갑차의 마지막 물량이 아랍에미리트에 인도되어, 이 차량의 첫 대규모 수출 계약이 완료되었습니다.\n주문의 성공적인 이행은 우크라이나 방위 산업의 중요한 성과이며 UAE와의 추가 협력의 문을 열어 줍니다.\nBTR-3가 이제 에미리트군에서 자리를 잡았으므로, 우리는 이 동반자 관계를 더욱 확대할 기회를 얻었습니다. 이 독특한 가능성을 향해 협의를 발전시키겠습니까?"
 ukraine_develop_btr3.4.a: "이것으로 끝이다"
 ukraine_develop_btr3.4.b: "라이선스 생산을 추진한다"
 ukraine_develop_btr3.5.name: "UAE에 대한 BTR-3 요청을 이행하지 못했다"
 ukraine_develop_btr3.5.desc: "부끄러운 일입니다!\n낮은 효율과 가용 생산 시설의 부족으로 UAE용 BTR-3 장갑차 생산 주문을 충족하지 못했습니다. 지금까지 단 한 대도 인도하지 못했습니다!\n이 주문을 한 번 더 재협상해 보겠으나, 솔직히 가능성은 낮습니다. 우리에 대한 그들의 관계가 50 미만이라면 계약 갱신에 동의하지 않을 것입니다."
 ukraine_develop_btr3.5.a: "재협상하자"
 ukraine_develop_btr3.5.b: "더는 계속할 수 없다"
 ukraine_develop_btr3.6.name: "UAE에 대한 BTR-3 요청을 이행하지 못했다"
 ukraine_develop_btr3.6.desc: "부끄러운 일입니다!\n낮은 효율과 가용 생산 시설의 부족으로 UAE용 BTR-3 장갑차 생산 주문을 충족하지 못했습니다. 이미 30대는 인도하였습니다!\n이 주문을 한 번 더 재협상해 보겠으나, 솔직히 가능성은 낮습니다. 우리에 대한 그들의 관계가 50 미만이라면 계약 갱신에 동의하지 않을 것입니다."
 ukraine_develop_btr3.6.a: "재협상하자"
 ukraine_develop_btr3.6.b: "더는 계속할 수 없다"
 ukraine_develop_btr3.7.name: "UAE에 대한 BTR-3 요청을 이행하지 못했다"
 ukraine_develop_btr3.7.desc: "부끄러운 일입니다!\n낮은 효율과 가용 생산 시설의 부족으로 UAE용 BTR-3 장갑차 생산 주문을 충족하지 못했습니다. 인도해야 할 물량은 30대만 남아 있었습니다!\n이 주문을 한 번 더 재협상해 보겠으나, 솔직히 가능성은 낮습니다. 우리에 대한 그들의 관계가 50 미만이라면 계약 갱신에 동의하지 않을 것입니다."
 ukraine_develop_btr3.7.a: "재협상하자"
 ukraine_develop_btr3.7.b: "더는 계속할 수 없다"
