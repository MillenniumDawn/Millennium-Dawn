 Proscription_LTTE_as_a_terrorist_organization_Trade: "Uznanie LTTE za organizację terrorystyczną (handel)"
 State_sponsor_of_the_LTTE: "Dostawca amunicji"
 news.91.t: "Koniec wojny domowej na Sri Lance"
 news.91.d: "Rząd Sri Lanki ogłosił całkowite zwycięstwo nad organizacją Tygrysy Wyzwolenia Tamilskiego Ilamu. W serii ostatnich ofensyw przeprowadzonych na północnym wschodzie siły rządowe zdobyły ostatnie bastiony Tygrysów. W końcowej fazie wojny niedobitki tamilskich bojowników zostały okrążone na obszarze lagun i dżungli w rejonie Mullaitivu. Odcięto im drogę ucieczki, a wszelkie próby wydostania się drogą morską były udaremniane. Według doniesień, przywódcy Tygrysów – dotąd uważani za nietykalnych – zginęli w ostatnich godzinach konfliktu. W przemówieniu do parlamentu prezydent [SRI.GetLeader] ogłosił, że naród został „uwolniony od terroryzmu”. Obecnie nad całą wyspą niepodzielnie powiewa flaga z lwem."
 news.91.a: "Pokój… za pewną cenę."
 news.92.t: "Tamilskie Tygrysy wyzwoliły Eelam"
 news.92.d: "Wojna na wyczerpanie dobiegła końca. Tygrysy Wyzwolenia Tamilskiego Ilamu odniosły zwycięstwo. W ostatnich dniach konfliktu ostatnie bastiony państwa Sri Lanki na ziemiach Tamilskiego Ilamu upadły pod naporem nieustannych ataków. Linie zaopatrzeniowe zostały przerwane, pasy startowe płonęły, a niegdyś potężna armia znalazła się w okrążeniu i została pozostawiona własnemu losowi. Tygrysy Tamilskiego Ilamu wyszły z dżungli nie jako rebelianci, lecz jako przywódcy. Sen o Tamilskim Ilamie – okupiony krwią i ofiarami – wreszcie się ziścił."
 news.92.a: "Interesujące."