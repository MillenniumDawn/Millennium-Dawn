 NKO_spa.54.t: "횡재를 두고 논의하는 조달 감독관들"
 NKO_spa.54.d: "장비 권한 위임은 여분의 공구와 숙련된 노동력을 남겼습니다. 조달 장교들은 이를 새 군수 공장에 할애하거나 즉시 무기로 전환할 수 있습니다."
 NKO_spa.54.factory: "향후 주문에 대비해 군수 공장을 건설한다."
 NKO_spa.54.equipment: "지금 보병 무기 2,500점을 인도한다."
 NKO_spa.55.t: "수확물 분배"
 NKO_spa.55.d: "수확량이 계획을 초과했습니다. 지방 관리들이 잉여분을 가구 배급에 충당할지, 경화를 위해 판매할지 묻습니다."
 NKO_spa.55.rations: "가구 배급을 채운다. (안정도 §G+3%§!)"
 NKO_spa.55.exports: "잉여분을 판매한다. (국고 §G+0.5§!)"
 NKO_spa_chain_economy_exhausted_tt: "§Y일회성 보고서가 완료되었습니다. 이 권한 위임은 여전히 일반적인 혜택과 25% 확률의 광물 발견을 제공하지만, 더 이상의 후속 연쇄는 없습니다.§!"
 NKO_spa.56.t: "평양의 레이더 감시망"
 NKO_spa.56.d: "건설 대대가 평양을 보호하고 우리 방공망을 조율하기 위한 레이더 단지를 제안합니다. 70억 달러를 배정하면 수도에 4단계 레이더 기지가 즉시 완공됩니다.\n\n이 제안은 단 한 번만 제시됩니다. 거절하면 대대는 다른 임무를 계속 수행할 것이며 이 사업을 다시 제출하지 않을 것입니다."
 NKO_spa.56.a: "70억 달러를 배정하여 레이더 단지를 건설한다."
 NKO_spa.56.b: "사업을 거절한다."
