 TUR_support_in_lebanon: "Renforcer le soutien en §HLiban§!"
 TUR_support_in_jordan: "Renforcer le soutien en §HJordanie§!"
 TUR_support_in_saudi: "Renforcer le soutien en §HHedjaz§!"
