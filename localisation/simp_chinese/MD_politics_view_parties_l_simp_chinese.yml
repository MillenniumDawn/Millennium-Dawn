 ABK.Neutral_conservatism: "£ABK_Neutral_conservative (UA) - 统一阿布哈兹"
 ABK.Neutral_conservatism_icon: "£ABK_Neutral_conservative"
 ABK.Neutral_conservatism_desc: "（社会保守主义）- 统一阿布哈兹\n\n统一阿布哈兹党成立于2004年3月25日，旨在推出一位反对派候选人与阿尔津巴阵营抗衡。该党与祖先之光和艾泰拉联手，推举其联合创始人谢尔盖·巴加普什，在同年10月以微弱优势赢得大选，但选举结果充满争议。2005年1月的重选中，该党更是以压倒性优势获胜。在接下来的十年里，该党一直是总统执政的政党，立场偏右，社会保守，并将与俄罗斯的联盟视为国家的基础。2007年，该党在35个席位中赢得28席，并在2009年1月由道尔·塔尔巴正式成为政党。2012年大选后，该党的统治地位终结，席位锐减至3席。自2016年1月起担任主席的谢尔盖·尚巴领导该党，成立了民族团结委员会，作为政府和反对派之间的第三股力量。"
 ABK.socialism: "£ABK_western_social_democrat (Aitaira) - 复兴"
 ABK.socialism_icon: "£ABK_western_social_democrat"
 ABK.socialism_desc: "（改革主义）- 复兴\n\n“复兴运动”是一场社会政治运动，它自2001年起聚集了反对弗拉迪斯拉夫·阿尔津巴政府的改革派反对派，由前外交部长列昂尼德·拉克尔巴亚共同领导，并以亚历山大·安克瓦布为核心力量。该运动主张建立运转良好的机构和对公民负责的政府，但从未质疑过独立或与俄罗斯的联盟。2004年总统选举委员会将安克瓦布从候选人名单中剔除后，转而支持谢尔盖·巴加普什以及“统一阿布哈兹”和“祖先之光”等政党。最终达成的妥协结束了选举后的危机，安克瓦布出任总理；2011年他当选总统，使该运动的影响力达到顶峰；然而，2014年5月革命后他被推翻，该运动也随之瓦解。“复兴运动”于2016年7月重组，成为反对劳尔·哈吉姆巴的一部分，并在人民议会中占有一席之地。"
 ABK.Conservative: "£ABK_emerging_reactionary (Amtsakhara) - 祖先之光"
 ABK.Conservative_icon: "£ABK_emerging_reactionary"
 ABK.Conservative_desc: "（退伍军人民族主义）- 祖先之光\n\n祖先之光成立于1999年3月31日，最初是由参加过1992-1993年阿布哈兹与格鲁吉亚战争的老兵组成的协会。2002年，该协会发展成为一个社会政治运动，并于2013年6月注册成为政党。其政治立场与参战老兵一脉相承：坚持独立，反对与第比利斯达成任何和解，并坚信与俄罗斯结盟是阿布哈兹生存的保障。2003年4月，老兵们施加的压力迫使根纳季·加古利亚政府下台，使他们成为一股政治力量。2004年，他们与“爱塔拉”和“统一阿布哈兹”联合推举谢尔盖·巴加普什参选，对抗阿尔津巴阵营。祖先之光党后来支持亚历山大·安克瓦布，在2014年8月推出阿斯兰·布扎尼亚与劳尔·哈吉姆巴竞争，并领导了2016年提前举行总统选举的运动，至今仍是少数几个在人民议会中拥有席位的政党之一。"
 ABK.Autocracy: "£generic_Autocracy_small (FNUA) - 阿布哈兹民族团结论坛"
 ABK.Autocracy_desc: "（民族保守主义）- 阿布哈兹民族团结论坛\n\n该论坛成立于2005年2月8日，旨在将十二个反对党、运动和青年组织联合起来，聚集了前安全局长兼总理劳尔·哈吉姆巴的支持者。哈吉姆巴在2004年10月备受争议的总统选举中落败，此后该论坛成为反对谢尔盖·巴加普什和亚历山大·安克瓦布的组织核心。该论坛于2008年注册为政党，并于2010年推举哈吉姆巴担任主席，其纲领以国家为中心，主张建立强有力的总统制，对格鲁吉亚采取强硬路线，并无条件与俄罗斯结盟。2012年大选后，该论坛成为格鲁吉亚最大的有组织政党，并推动了2014年迫使安克瓦布下台的抗议活动，同年8月，哈吉姆巴当选总统，执政至2019年备受争议的选举，最终导致他于2020年1月辞职。"
 ABK.Monarchist: "£ABK_nationalist_monarchist 查赫巴-舍尔瓦希泽王室"
 ABK.Monarchist_icon: "£ABK_nationalist_monarchist"
 ABK.Monarchist_desc: "（君主主义）- 查赫巴-舍尔瓦希泽王室\n\n恰奇巴家族是阿布哈兹的统治家族，从中世纪一直延续到1864年俄罗斯帝国废除该公国为止。该家族的第一位代表于1325年左右在格鲁吉亚国王的统治下掌握了王权。米哈伊尔·舍尔瓦什泽于1822年成为亲王，是该家族最后一位统治者。随着他的废黜，阿布哈兹被直接并入俄罗斯帝国。该家族的后裔在格鲁吉亚和海外均有延续。在现代阿布哈兹，恢复公国从未被认真考虑过，该王朝更多地被视为俄罗斯吞并前国家主权的象征。"
 ACE.Neutral_Muslim_Brotherhood: "£muslim_brotherhood_small (GAM) - 自由亚齐运动"
 ACE.Neutral_Muslim_Brotherhood_desc: "（亚齐民族主义）- 自由亚齐运动\n\n1976年12月4日，哈桑·迪·蒂罗宣布成立自由亚齐运动。他因中央政府控制洛克塞马韦新天然气田而与雅加达决裂。该运动将亚齐民族主义与伊斯兰认同相结合，要求建立一个能够将该省资源留给本省人民的独立国家。运动初期几乎被彻底摧毁，但在1989年，据报道得到了利比亚的支持，该运动卷土重来，引发了长达十年的军事行动，导致数千名亚齐人丧生或遭受虐待。1998年苏哈托政权垮台后，该运动发展壮大至数千人，但在2003年军方在戒严令下发起的攻势中，其力量被削弱了一半。2004年12月海啸后，该运动放弃独立，换取自治权和组建地方政党的权利。2005年8月15日，该运动签署了《赫尔辛基备忘录》，并在同年12月解散了其武装力量。"
 AFG.conservatism: "£generic_conservatism_small (RPA) - 阿富汗共和党"
 AFG.conservatism_desc: "（社会自由主义）- 阿富汗共和党\n\n共和党成立于1999年11月6日，反对塔利班酋长国，并以《世界人权宣言》为纲领。在塞卜加图拉·桑贾尔的领导下，该党于2004年3月6日成为新宪法下第一个注册的政党。共和党主张建立世俗总统制共和国，提供免费教育和医疗保健，保障妇女权利，并结束军阀割据。该党聚集了进步人士、自由派人士和温和保守派人士，他们除了反对武力统治和毛拉统治之外，几乎没有其他共同点。\n\n该党的影响力并非体现在议席上，而是体现在宪法大国民议会中各民主党派的联盟以及喀布尔和赫拉特的城市青年群体中 - 非政党选举制度剥夺了该党获得议席的机会。桑贾尔于2012年5月5日在喀布尔遇刺身亡，该党于2021年8月塔利班重新进入首都当天被取缔。"
 AFG.liberalism: "£generic_liberalism_small (NCA) - 阿富汗全国大会"
 AFG.liberalism_desc: "（世俗自由主义）- 阿富汗全国大会\n\n全国大会是巴达赫尚知识分子阿卜杜勒·拉蒂夫·佩德拉姆的政党。佩德拉姆曾是左翼政党阿富汗革命劳动者组织的成员，先后反对过共产党、圣战者和塔利班政权。他于2004年创立了全国大会党，其纲领明确阐述了自由主义原则。该党主张建立世俗国家，实行自治联邦制，并保障非普什图族人民的平等权利。它是阿富汗为数不多的几个纲领未随领导人结盟而改变的政党之一。\n\n该党的优势在于非普什图族左翼知识分子和塔吉克斯坦北部地区。佩德拉姆在2004年总统选举中位列第五，并在2009年和2014年再次参选。该党的优势在于其对腐败和中央集权的批评，而非对权力的争夺。与其他所有政党一样，该党于2023年被塔利班取缔。"
 AFG.socialism: "£generic_socialism_small (ASDP) - 阿富汗社会民主党"
 AFG.socialism_desc: "（社会自由主义）- 阿富汗社会民主党\n\n阿富汗梅拉特党由古拉姆·穆罕默德·法哈德于1966年3月8日创立，是一个由受过教育的普什图族官僚组成的社会民主党。该党始终将福利纲领与普什图民族主义以及对杜兰线以东普什图族土地的主权声索相结合。1978年政变后，该党被取缔并分裂成多个派系流亡海外。1995年，安瓦尔·哈克·阿哈迪接管了该党的主要派系，并淡化了其民族色彩以争取非普什图族选民的支持，该党才得以复兴。\n\n该党在2001年后的影响力主要来自阿哈迪在哈米德·卡尔扎伊执政期间担任中央银行行长和财政部长的经历，而非其在议会中的席位，其支持者仍然是东部受过良好教育的城市普什图族人。该党于2004年注册成立，自2012年10月起由斯坦纳古尔·谢尔扎德领导，并于2023年8月16日被塔利班取缔。"
 AFG.Western_Autocracy: "£AFG_western_autocracy (IND) - 独立人士"
 AFG.Western_Autocracy_desc: "（总统赞助）- 独立人士\n\n独立人士并非一个政党，而是主导伊斯兰共和国议会的势力集团：2005年、2010年和2018年人民院选举采用的单一不可转移投票制，使得所有候选人都没有党派归属，大多数议员以独立人士身份就职，他们与某个省份、部落或赞助人而非某个纲领紧密相连。他们倾向于支持掌握总统职位及其西方资助预算的人，并支持那些能够同时赢得捐助者和军阀支持的温和技术官僚政策。\n\n他们的优势在于，任何政府都无法组建，预算也无法通过，都必须通过收买他们的选票才能实现。这也正是他们腐败成名、掏空共和国的原因。哈米德·卡尔扎伊和阿什拉夫·加尼都是通过他们而非他们自己的政党来执政的。"
 AFG.anarchist_communism: "£AFG_anarchist_communism (NUPA) - 阿富汗民族统一党"
 AFG.anarchist_communism_desc: "（民主社会主义）- 阿富汗民族统一党\n\n民族统一党于2003年8月21日由前阿富汗人民民主党成员、坎大哈陆军司令努尔·哈克·乌鲁米将军创立，旨在将20世纪80年代执政党的前成员重新团结起来，组成一个致力于民主、世俗阿富汗的温和左翼政党。它代表着强大的国家、社会福利和民族和解，并且与人民派和共产主义时期的罪行保持距离。\n\n民族统一党的优势在于其前任军官和官员的人脉网络，该网络在2005年为乌鲁米赢得了坎大哈的席位，并使其在阿卜杜拉·阿卜杜拉的全国联盟中占有一席之地。2015年1月，民族统一党出任内政部长，其影响力达到顶峰。与所有政党一样，该党于2023年8月16日被塔利班取缔。"
 AFG.Conservative: "£AFG_conservative (Junbish) - 阿富汗民族伊斯兰运动"
 AFG.Conservative_desc: "（世俗左翼民族主义）- 阿富汗民族伊斯兰运动\n\n阿富汗民族伊斯兰运动是阿卜杜勒·拉希德·杜斯塔姆将军的政党，成立于1992年，由乌兹别克斯坦北部的民兵和人民民主党支持者组成，这些人曾帮助推翻纳吉布拉政权。该党奉行世俗的左翼纲领，致力于捍卫乌兹别克斯坦和土库曼斯坦的利益，反对普什图人的统治。人民解放阵线一直将北部的朱兹詹省、巴尔赫省、法里亚布省和萨尔波勒省视为自己的势力范围，并根据其领导人的利益在塔利班、北方联盟和喀布尔之间摇摆不定。\n\n该党的筹码是乌兹别克斯坦选民的支持以及杜斯塔姆的民兵组织。尽管杜斯塔姆在内战中劣迹斑斑，但民兵组织仍在2014年拥立他为第一副总统。2021年8月塔利班占领北部地区后，该党停止运作，杜斯塔姆逃往乌兹别克斯坦。"
 AFG.Autocracy: "£AFG_autocracy (APM) - 阿富汗和平运动"
 AFG.Autocracy_desc: "（左翼民族主义）- 阿富汗和平运动\n\n和平运动党是沙赫纳瓦兹·塔奈将军的政党。塔奈将军曾于1986年至1988年担任陆军参谋长，并于1988年至1990年担任国防部长。1990年3月，他发动政变推翻纳吉布拉政权失败后逃往巴基斯坦，并在流亡期间与希克马蒂亚尔领导的伊斯兰党结盟。该党以普什图民族主义、建立强大的中央集权国家以及与伊斯兰右翼和解为纲领，团结了原阿富汗人民民主党中的强硬派人民党。\n\n该党于2004年注册成立，是新共和国的第二十九个政党。在2005年的选举中，它与民族党和民族团结党组成联盟，但仅获得微弱席位。该党的优势并非来自民众选票，而是来自前人民军军官的人脉网络。"
 AFG.Mod_Vilayat_e_Faqih: "£AFG_moderate_shiites (Wahdat) - 阿富汗伊斯兰统一党"
 AFG.Mod_Vilayat_e_Faqih_desc: "（什叶派伊斯兰主义）- 阿富汗伊斯兰统一党\n\n阿富汗伊斯兰统一党成立于1989年，由阿卜杜勒·阿里·马扎里将德黑兰八人组的八个什叶派圣战者政党合并而成，代表哈扎拉族人民。该党主张什叶派伊斯兰主义、哈扎拉族权利，并力求在逊尼派普什图族和塔吉克族占主导地位的国家中，为什叶派少数群体争取权力。马扎里于1995年3月被塔利班杀害，此后，团结党作为北方联盟的支柱，与塔利班作战，直至1998年巴米扬陷落。\n\n该党优势在于喀布尔的哈扎拉贾特和哈扎拉族聚居区，卡里姆·哈利利在2004年至2014年担任副总统，穆罕默德·穆哈奇克在2004年总统选举中位列第三。其弱点在于分裂：到2009年，至少有四个派系分别以哈利利、穆哈奇克、阿克巴里和埃尔法尼的名义声称拥有该党的名义。"
 AFG.Vilayat_e_Faqih: "£AFG_hardline_shiites (Hezbollah) - 阿富汗真主党"
 AFG.Vilayat_e_Faqih_desc: "（霍梅尼主义）- 阿富汗真主党\n\n阿富汗真主党成立于1980年，是德黑兰八人组中的一个什叶派圣战组织，旨在将伊朗革命的思想带入阿富汗。自成立以来，该组织一直由卡里·艾哈迈德·阿里领导。它主张以伊朗模式维护法学家的权威，维护什叶派少数群体的权利，并与德黑兰保持密切联系。该组织曾在阿富汗西部和中部省份部署约四千名战士对抗苏联军队。\n\n该党于2005年注册为合法政党，至今仍是一支边缘力量，其影响力主要来自与伊朗以及被招募到叙利亚作战的阿富汗什叶派武装“法蒂米扬师”的密切关系。2021年塔利班重返阿富汗后，该党领导人宣称该党并不反对新政府。"
 AFG.Caliphate: "£AFG_salafist_jihadism (Taliban) - 阿富汗伊斯兰酋长国"
 AFG.Caliphate_desc: "（迪奥班迪学派伊斯兰主义）- 阿富汗伊斯兰酋长国\n\n塔利班于1994年在坎大哈附近由毛拉·穆罕默德·奥马尔领导的伊斯兰学校学生和前圣战者组成，于1996年9月占领喀布尔，并以伊斯兰酋长国的名义统治该国大部分地区，直到2001年美国干预为止。他们主张严格执行德奥班迪学派和普什图族习俗所解读的伊斯兰教法，将妇女排除在公共生活之外，并拒绝宪政共和国及其外国支持者。\n\n他们的力量源于普什图族南部和东部农村地区，以及他们在巴基斯坦享有的庇护。长达二十年的叛乱最终耗尽了巴基斯坦共和国的实力，导致其于2021年8月15日垮台。在希巴图拉·阿洪扎达的统治下，复辟的酋长国于2023年8月16日取缔了所有政党。"
 AFG.Kingdom: "£AFG_kingdom (HIK) - 伊斯兰党哈利斯分部"
 AFG.Kingdom_desc: "（传统伊斯兰主义）- 伊斯兰党哈利斯分部\n\n伊斯兰党哈利斯派是毛拉维·穆罕默德·尤努斯·哈利斯于1979年从希克马蒂亚尔领导的伊斯兰党分裂出来的派别。伊斯兰党是楠格哈尔和帕克蒂亚东部普什图部落的圣战者组织，它将伊斯兰教义与部落权威相结合，并涌现出阿卜杜勒·哈克和贾拉鲁丁·哈卡尼等指挥官。该派别主张通过部落和宗教机构的传统结构进行伊斯兰统治。1996年，哈利斯派别接纳了塔利班，并在奥萨马·本·拉登抵达贾拉拉巴德时为其提供庇护。\n\n2006年哈利斯去世后，该党分裂为两派：一派是哈吉丁·穆罕默德，他保留了合法政党并为卡尔扎伊政府效力；另一派是哈利斯的儿子安瓦尔·乌尔·哈克·穆贾希德，他领导的托拉博拉军事阵线与共和国作战，并于2016年加入塔利班。"
 AFG.neutral_Social: "£AFG_neutral_social (Watan) - 阿富汗祖国党"
 AFG.neutral_Social_desc: "（社会民主主义） - 阿富汗祖国党\n\n穆罕默德·纳吉布拉在1990年放弃马克思列宁主义、寻求民族和解和多党制国家时，将人民民主党改名为阿富汗祖国党的政党。1992年他的政府垮台后，该党被取缔。1997年6月28日，穆罕默德·伊萨·贾苏尔在慕尼黑流亡期间重建了阿富汗祖国党，该党是一个民族的、民主的、进步的和改革的政党，它既否定了人民党派系，也否定了旗帜党派系，并禁止旧政权的领导人担任公职。\n\n该党的力量主要来自纳吉布拉时代的官员和军官，以及海外侨民。其2000年的代表大会声称拥有13000名成员。由于司法部拒绝以人民民主党的名义注册，该党在喀布尔的影响力受到限制。2017年7月，数千人参加了该党在喀布尔的重新集会。2023年8月16日，塔利班宣布该党为非法组织。"
 AFG.Neutral_Autocracy: "£AFG_neutral_autocracy (Dawat) - 阿富汗伊斯兰宣教组织"
 AFG.Neutral_Autocracy_desc: "（萨拉菲主义）- 伊斯兰宣教组织\n\n伊斯兰宣教组织是阿卜杜勒·拉苏尔·萨亚夫的政党，他于20世纪80年代初创立了该党，当时名为“阿富汗解放伊斯兰联盟”，是沙特资助的“白沙瓦七国”成员之一。该党于2005年注册为现名。它主张沙特学派的正统逊尼派伊斯兰教，以伊斯兰教法为国家基础，并尊崇击败苏联的圣战者。但自2001年以来，该党与西方和巴基斯坦采取了务实的妥协策略。\n\n其力量源于萨亚夫的家乡喀布尔郊外的帕格曼地区、他的财富以及他在前圣战者中的地位 - 这使他得以在2005年进入国民议会，并在2014年总统选举中位列第四。其影响力在于圣战一代对共和国任何政府都拥有否决权。"
 AFG.Neutral_Muslim_Brotherhood: "£AFG_neutral_muslim_brotherhood (Jamiat) - 伊斯兰促进会"
 AFG.Neutral_Muslim_Brotherhood_desc: "（伊斯兰民主主义） - 伊斯兰促进会\n\n伊斯兰促进会是阿富汗历史最悠久、规模最大的政党，由喀布尔大学神学家布尔汉丁·拉巴尼于1972年创立，其前身是20世纪60年代的伊斯兰学生团体，后经艾哈迈德·沙阿·马苏德发展成为最强大的圣战者政党。该党成员以塔吉克族为主，主张建立一个拥有民主制度和社群社会秩序的伊斯兰国家。1992年至1996年间，该党执政阿富汗，之后领导北方联盟对抗塔利班。\n\n该党的优势在于塔吉克斯坦北部地区及其遍布全国的指挥官网络，这些指挥官后来成为共和国的部长、省长和将军。2001年以后，该党的影响力在于，任何政府都无法脱离其控制。马苏德于2001年9月9日遇刺身亡，拉巴尼于2011年9月20日遇刺身亡。在萨拉赫丁·拉巴尼的领导下，该党继续存在，直到2023年被塔利班取缔。"
 AFG.Neutral_conservatism: "£AFG_neutral_conservatism (NAP) - 新阿富汗党"
 AFG.Neutral_conservatism_desc: "（民族保守主义） - 新阿富汗党\n\n新阿富汗党由潘杰希尔族前内政和教育部长穆罕默德·尤努斯·卡努尼于2004年创立。当时他离开民族运动党，竞选总统，与哈米德·卡尔扎伊竞争，最终获得16.3%的选票，位列第二。该党秉承伊斯兰促进会和协商会议的圣战传统，并融入现代化理念，主张通过议会制衡总统权力，维护塔吉克斯坦北部地区的利益。\n\n该党的影响力在2005年达到顶峰，当时赢得了13个席位，领导了由11个反对党组成的全国理解阵线，并推举卡努尼担任人民院议长。同年12月，该党宣布重新并入伊斯兰促进会。2010年，该党席位锐减至仅剩1个，此后几乎沦为卡努尼的个人工具。"
 AFG.Neutral_Communism: "£AFG_neutral_communism (ALO)  - 阿富汗解放组织"
 AFG.Neutral_Communism_desc: "（毛泽东思想） - 阿富汗人民解放组织\n\n阿富汗解放组织由费兹·艾哈迈德于1973年创立，最初名为阿富汗人民革命团体，源于毛主义的贾维德革命运动，并于1980年更名为现名。该组织主张独立于莫斯科和伊斯兰主义者的毛主义革命，并在反哈尔基马克思主义者和温和伊斯兰主义者的阵线内与苏联占领军和阿富汗人民民主党作战，在战争中损失了一百二十多名干部。\n\n它的影响力一直存在于地下组织和受过良好教育的左翼人士中，而非选举箱。费兹·艾哈迈德于1986年11月12日被希克马蒂亚尔领导的伊斯兰党谋杀，该组织以秘密网络的形式继续存在，敌视塔利班、前共和国以及外国势力。"
 AFG.Nat_Autocracy: "£AFG_nat_autocracy (AAF) - 阿富汗武装部队"
 AFG.Nat_Autocracy_desc: "（军政府） - 阿富汗武装部队\n\n阿富汗武装部队作为统治集团，代表着以国家统一为名的军官团政府，这一传统可以追溯到1973年达乌德汗发动的政变，经由阿富汗人民民主党的将领，直至内战时期的军阀军队。阿富汗国民军于2002年在美国和北约的资助下重建，本应成为共和国第一支非派系武装力量，其名义上的规模也达到了约30万士兵和警察。\n\n它的优势在于强大的火力以及外国的支持；其弱点在于指挥系统混乱、大量“幽灵士兵”的出现、腐败横行以及对指挥官而非国家的忠诚。2021年外国军队撤离后，该组织在数周内瓦解，任何阿富汗军政府都必须从其残余势力和幸存下来的民兵组织中重建。"
 AFG.Nat_Populism: "£AFG_nat_populism (NIFA) - 阿富汗全国伊斯兰阵线"
 AFG.Nat_Populism_desc: "（保皇派民族主义）- 阿富汗全国伊斯兰阵线\n\n全国伊斯兰阵线于1979年在白沙瓦由卡迪里苏菲教团世袭领袖皮尔·赛义德·艾哈迈德·盖拉尼创立。作为圣战者联盟中温和的保皇派成员，该组织拒绝共产主义和伊斯兰主义，拥护民族主义和民主，并呼吁查希尔·沙阿国王复辟。它主张建立一个保留部落、圣地和君主制的传统阿富汗，并保障个人、新闻和社团的自由。\n\n该党的实力主要来自东南部的普什图族部落和难民，他们在1987年的选举中将其支持率超过了其他所有政党。尽管巴基斯坦因其温和立场而限制其武器供应，但该党仍获得了这些群体的支持。2001年后，该党支持哈米德·卡尔扎伊，自身赢得的选举寥寥无几。自2017年皮尔去世后，该党一直由其子哈米德·盖拉尼领导。"
 AFG.Monarchist: "£AFG_monarchist (Barakzai) - 巴拉克宰王朝"
 AFG.Monarchist_desc: "（立宪君主制）- 巴拉克宰王朝\n\n巴拉克宰王室是杜兰尼普什图族王朝，自1826年多斯特·穆罕默德·汗攻占喀布尔至1973年统治阿富汗，经历了两次英国入侵和“大博弈”，作为缓冲国维系着国家的统一。阿卜杜勒·拉赫曼·汗建立了中央集权国家，阿曼努拉·汗于1919年赢得完全独立，但因现代化进程过快而被推翻，穆罕默德·查希尔·沙阿统治了四十年，并于1964年颁布了阿富汗宪法，后于1973年7月17日被其堂兄穆罕默德·达乌德·汗废黜。\n\n复辟君主制代表着民族团结高于种族和党派，在2001年和2002年曾进行过认真的讨论，之后扎希尔·沙阿放弃了任何复辟君主制的主张，接受了“国父”的称号，并一直保持到2007年去世。王室在流亡中得以延续，其影响力主要来自人们的记忆，而非任何有组织的追随者。"
 AFR.Nat_Autocracy: "£generic_Nat_Autocracy_small (AFRC)  - 武装部队革命委员会"
 AFR.Nat_Autocracy_desc: "军政府） - 武装部队革命委员会\n\n武装部队革命委员会是由一些低级军官和士兵组成的军政府，他们于1997年5月25日推翻了艾哈迈德·泰詹·卡巴赫的民选政府，并释放了约翰尼·保罗·科罗马少校担任领导人。他们还邀请了此前一直与之作战的革命联合阵线叛军加入，组建了一支联合人民军。该委员会除了抱怨军队薪饷不足、纪律涣散以及其领导人通过钻石贸易中饱私囊之外，别无其他诉求。其统治时期充斥着掠夺、公共服务崩溃以及对新闻界和公民社会的镇压。\n\n其力量源于与革命联合阵线的联盟以及国际社会的无力应对，这种情况一直持续到1998年2月尼日利亚领导的西非国家经济共同体部队攻入弗里敦并恢复卡巴政权为止。军政府残余势力于1999年1月卷土重来，洗劫了首都，随后分裂成多个派系，例如西区男孩。2007年，塞拉利昂特别法庭以战争罪判处其领导人亚历克斯·坦巴·布里马、布里马·巴齐·卡马拉和桑蒂吉·博尔博尔·卡努有罪。"
 AFR.Nat_Fascism: "£generic_Nat_Fascism_small (WSB) - 西区男孩"
 AFR.Nat_Fascism_desc: "（军事盗匪统治）-西区男孩\n\n“西区男孩”是一个武装团伙，成立于1998年，由军政府被逐出弗里敦后，残余的武装部队革命委员会和塞拉利昂军队成员组成。在福代·卡莱和布里马·巴齐·卡马拉的领导下，他们控制着弗里敦至马西亚卡公路沿线的奥克拉山，手下约有四六百名武装分子，其中许多是被绑架的儿童。除了抢劫、毒品和模仿美国匪帮说唱的嚣张气焰（他们的名字、女伴的假发和人字拖都取自美国匪帮说唱）之外，他们没有任何其他目标。他们靠抢劫公路和开采钻石为生。\n\n他们的筹码在于能够挟持和平进程，他们在2000年8月利用这一优势，劫持了11名皇家爱尔兰军团士兵及其塞拉利昂联络官。2000年9月10日的“巴拉斯行动”解救了人质，击毙了数十名团伙成员，并抓获了卡莱，“西区男孩”帮派从此不复存在。"
 AGL.conservatism: "£AGL_western_conservative (UNITA) - 争取安哥拉彻底独立全国联盟"
 AGL.conservatism_desc: "（自由保守主义）- 争取安哥拉彻底独立全国联盟\n\n争取安哥拉彻底独立全国联盟由若纳斯·萨文比和安东尼奥·达科斯塔·费尔南德斯于1966年3月13日创立，是第三个解放运动，其根基在于中部高地的奥温本杜地区。在先后得到中国、美国和南非的支持后，安盟与安哥拉人民解放运动政府进行了长达27年的斗争，直至2002年2月22日萨文比在伏击中身亡，战争结束。自2002年4月《卢埃纳备忘录》签署以来，安盟一直是一个中右翼的议会政党，主张自由企业、权力下放、打击安哥拉人民解放运动政府的腐败以及权力轮替。\n\n其优势在于高原省份，以及日益壮大的城市地区。自2003年伊萨亚斯·萨马库瓦执政以来，以及自2019年阿达尔贝托·科斯塔·儒尼奥尔执政以来，该党在城市地区的席位从2008年的16个增加到2017年的51个，并在2022年以43.95%的得票率在220个席位中占据90席。其优势在于，它是安哥拉历史上唯一真正可信的替代政府。"
 AGL.liberalism: "£AGL_western_liberalism (PLD) - 自由民主党"
 AGL.liberalism_desc: "（自由主义）- 自由民主党\n\n自由民主党由阿纳莉亚·德·维多利亚·佩雷拉于1983年在流亡期间创立。佩雷拉回国后带领该党参加了安哥拉首次多党选举，并成为该国首位竞选总统的女性。该党主张建立自由市场经济、保障公民自由，并在两大武装阵营之外实现民族和解，同时也是自由国际的成员。\n\n该党的优势在于罗安达的小型城市中产阶级，他们既不想要安哥拉人民解放运动，也不想要争取安哥拉彻底独立全国联盟，这使得该党在1992年获得了2.4%的选票和三个席位。到2008年，该党的选票下降到0.33%，没有获得任何席位，并于2013年根据一项法律被解散，该法律规定得票率低于0.5%的政党将被取缔。"
 AGL.socialism: "£AGL_western_socialism (PSD) - 社会民主党"
 AGL.socialism_desc: "（社会民主主义）- 社会民主党\n\n社会民主党于1988年11月16日在罗安达成立，由本吉·佩德罗·若昂领导，是一个欧洲社会民主主义类型的中左翼政党，主张混合经济、福利国家和多党民主制。当时，安哥拉人民解放运动仍然垄断着左翼阵营。该党将自身定位为与参与内战的两大运动不同的、非暴力的平民政党。\n\n该党实力从未超过1992年大选中赢得的一个席位，此后支持率一路下滑，跌至不足百分之一。2013年5月1日，该党与其他未能达到0.5%门槛的政党一同解散。"
 AGL.anarchist_communism: "£AGL_emerging_left_wing_radical (MPLA) - 安哥拉人民解放运动"
 AGL.anarchist_communism_icon: "£AGL_emerging_left_wing_radical"
 AGL.anarchist_communism_desc: "（国际社会主义）- 安哥拉人民解放运动\n\n安哥拉人民解放运动于1956年12月10日由罗安达的民族主义和共产主义团体发起成立，在阿戈斯蒂尼奥·内图的领导下于1975年11月11日带领安哥拉走向独立，此后一直执政至今，先后由若泽·爱德华多·多斯桑托斯（1979年至2017年）和若昂·洛伦索（此后）领导。该党于1990年放弃马克思列宁主义，自称社会民主主义政党，并加入了社会党国际。然而，在安哥拉，该党、总统和石油公司索南戈尔之间的界限却模糊不清。\n\n其优势在于国家机器和石油繁荣带来的财富，这使其在2008年赢得了81.64%的选票和191个席位；其影响力则来自于军队和安全部门的忠诚。然而，随着每次选举的进行，这种控制力都在减弱，2017年仅获得150个席位，2022年更是只获得220个席位中的124个，得票率为51.17%，创下其历史最差战绩。"
 AGL.Neutral_conservatism: "£AGL_neutral_conservatism (FNLA) - 安哥拉民族自由阵线"
 AGL.Neutral_conservatism_desc: "（基督教民主主义）- 安哥拉民族自由阵线\n\n安哥拉民族自由阵线是历史最悠久的解放运动，于1954年由刚果巴刚果流亡者组成的北安哥拉人民联盟成立，由霍尔顿·罗伯托领导了半个世纪。在美、扎伊尔和中国的支持下，该组织与安哥拉人民解放运动作战，直至在1975年至1976年的战争中战败。自1992年以来，该组织已成为一个中右翼的文职政党，主张基督教民主、公民民族​​主义和巴刚果北部地区的利益。\n\n其势力范围仅限于扎伊尔省威热市和罗安达的巴刚果区，1992年获得5个席位，2008年获得3个席位，2022年获得2个席位。罗伯托于2007年去世，导致该党分裂为相互敌对的领导层，如今它只是一个历史悠久但实际影响力有限的政党名称。"
 AGL.neutral_Social: "£AGL_neutral_social (PRS) - 社会革新党"
 AGL.neutral_Social_desc: "（区域进步主义）- 社会革新党\n\n社会革新党成立于1990年11月18日，自成立以来一直由爱德华多·库安加纳领导。该党主张联邦制，主张将权力和收入下放至各省，并在和平、民主和进步的口号下推行进步的社会政策。该党是钻石资源丰富的北隆达省和南隆达省乔克韦族人的政党，他们不满财富流向罗安达。\n\n该党的优势在于其区域基础，这使其在1992年成为安哥拉第三大党，赢得6个席位，并在2008年获得8个席位和3.17%的得票率，创下历史最佳成绩。此后，该党席位有所下降，2022年仅获得2个席位。其影响力在于能够代表安哥拉人民解放运动和争取安哥拉彻底独立全国联盟均未代表的东部省份发声。"
 AGL.Nat_Autocracy: "£AGL_military_junta (FAA) - 安哥拉武装力量"
 AGL.Nat_Autocracy_desc: "（军政府）- 安哥拉武装力量\n\n安哥拉武装部队于1991年10月9日根据《比塞塞协议》成立，旨在将安哥拉人民解放运动的安哥拉人民解放军与争取安哥拉彻底独立全国联盟的游击队合并。然而，在1992年战争重燃之前，合并从未实现。1993年，安哥拉武装部队以如今的规模正式成立，成为非洲规模最大、战斗力最强的军队之一。作为执政集团，他们代表着赢得战争的将军们领导的政府，维护秩序、民族团结，并捍卫这个石油和钻石大国免受任何挑战。\n\n他们的优势在于拥有数十万兵力、一支强大的空军，以及在刚果（金）和2021年进军莫桑比克德尔加杜角省的军事干预记录。他​​们的弱点在于，他们始终是安哥拉人民解放运动的军队，而非国家军队，而且将军们的命运与他们即将取代的政党紧密相连。"
 ALB.conservatism: "£ALB_western_conservative (PD) - 阿尔巴尼亚民主党"
 ALB.conservatism_desc: "(自由保守主义) - 阿尔巴尼亚民主党\n\n阿尔巴尼亚民主党是该国主要的中右翼力量，由萨利·贝里沙、阿泽姆·哈伊达里和格拉莫兹·帕什科于1990年12月12日创立，是霍查政权下第一个被允许成立的反对党。该党以反共主义、私有财产、坚定的欧洲-大西洋外交政策以及终结一党专政的记忆为核心，同时也是欧洲人民党的准成员。\n\n该党曾于1992年至1997年以及2005年至2013年执政，带领阿尔巴尼亚加入北约，并走上了加入欧盟的候选国之路。然而，1996年该党在140个议席中赢得122席的压倒性胜利，以及随后的“金字塔骗局”崩盘，至今仍影响着该党的声誉。2013年至2022年由卢尔齐姆·巴沙领导，此后由贝里沙再次执政。该党的优势在于其忠诚的北方选民和反社会主义选民，而其弱点在于一旦失去政权，便容易发生派系分裂。"
 ALB.liberalism: "£ALB_western_liberal (PBDNJ) - 人权团结党"
 ALB.liberalism_desc: "(社会自由主义) - 人权团结党\n\n人权统一党是阿尔巴尼亚希腊少数民族在议会的代言人，成立于 1992 年，是希腊少数民族民主联盟在种族协会被禁止参加后的政治延续。在万杰尔·杜勒的领导下，它主张少数民族语言权利、南部财产归还以及与雅典的密切联系，这些都是在社会自由主义、亲欧洲计划的框架内进行的，该计划吸引了希腊社区以外的人。\n\n该党的实力集中在希腊语区南部，1997年赢得四个议席，此后在大多数议会中都拥有一个席位，通常是通过与民主党结成选举联盟获得的。该党的优势在于其作为摇摆少数党的地位，它利用其议席和与希腊的关系，换取在少数族裔政策上的让步。"
 ALB.socialism: "£ALB_western_social_democrat (PS) - 阿尔巴尼亚社会党"
 ALB.socialism_desc: "(社会民主主义) - 阿尔巴尼亚社会党\n\n阿尔巴尼亚社会党是劳动党的改革继承者，于1991年6月13日重建，是一个社会民主党，它摒弃了霍查主义，但保留了原劳动党的组织和农村基础。在法托斯·纳诺和自2005年起由埃迪·拉马领导的时期，该党将自身定位为欧洲一体化、公共部门现代化和混合经济的政党，并且是社会党国际的正式成员和欧洲社会党的准成员。\n\n该党自1997年至2005年执政，并自2013年以来持续执政，已成为阿尔巴尼亚政坛的主导力量，在2021年占据140个席位中的74个，预计在2025年将获得83个席位，得票率为53%。其优势在于对国家机器的控制以及拉马的个人统治，其劣势在于一党独大带来的裙带关系指控。"
 ALB.Western_Autocracy: "£ALB_western_autocracy (PLL) - 合法性运动党"
 ALB.Western_Autocracy_desc: "(君主制) - 合法运动党\n\n合法性运动党是战时合法性抵抗运动和流亡运动的政治继承者，后者在共产主义统治的几十年间一直坚持佐古家族的统治主张。该党于1992年2月多元政治恢复后注册成立。它主张恢复君主立宪制，使阿尔巴尼亚拥有一位超越氏族和党派的国家元首，并以此为基础，奉行亲西方、反共的保守主义，支持北约和欧洲一体化。\n\n实际上，该党是中右翼的一个小盟友，1997年以3.25%的得票率获得两个席位，并在2021年和2025年通过民主党领导的联盟赢得单个议员席位。在埃克雷姆·斯帕希乌的领导下，该党在2000年代通过国际君主主义大会保持君主主义事业的组织性和国际联系，其影响力在于为右翼联盟提供保皇主义合法性，而不是依靠自身的选票。"
 ALB.Neutral_conservatism: "£ALB_non_aligned_conservative (PR) - 阿尔巴尼亚共和党"
 ALB.Neutral_conservatism_desc: "(民族保守主义) - 阿尔巴尼亚共和党\n\n阿尔巴尼亚共和党是一个民族保守主义政党，由萨布里·戈多于1991年1月10日创立，并得到了意大利共和党的支持。该党以美国共和党为蓝本，强调自由企业、法律秩序和强烈的民族认同。它主张缩小国家规模，对阿尔巴尼亚北部和科索沃的利益采取更强硬的立场，并对欧洲一体化持保守解读。该党是欧洲保守派和改革派的全球合作伙伴。\n\n在政治上，该党一直是民主党最可靠的小党伙伴，在2005年达到鼎盛时期，在比例代表制选举中赢得11个席位，得票率接近20%，并在法特米尔·梅迪乌的领导下执掌国防部，直到2008年格尔德茨事件迫使他辞职。该党的影响力主要体现在右翼联盟的“填充”作用上，此后其选举结果下滑至仅获得一到三个席位，且这些席位均来自联合名单。"
 ALB.Neutral_green: "£ALB_non_aligned_greens (PAS) - 阿尔巴尼亚农业党"
 ALB.Neutral_green_desc: "(农业主义) - 阿尔巴尼亚农业党\n\n阿尔巴尼亚农业党是一个中间派农民政党，由卢夫特·舒韦利于1991年创立，旨在代表因集体农场解体而产生的小农户发声。该党主张建立自由市场农村经济，保障土地所有权，为农村地区提供信贷和灌溉，并保护阿尔巴尼亚农产品。它自诩为这个仍然以农业为主的国家的务实之声，而非西方意义上的绿色政党。\n\n实际上，这是一个倾向于社会主义的小党，在2001年以2.6%的得票率赢得三个席位，并加入了社会主义的执政联盟。它的优势在于能够为任何拉拢它的联盟带来农村选票，并在2003年更名为“环境农业党”，在其农业核心之外加入了生态环保理念。"
 ALB.Nat_Autocracy: "£ALB_nationalist_military_junta (FARSH) - 阿尔巴尼亚武装力量"
 ALB.Nat_Autocracy_desc: "(军政府) - 阿尔巴尼亚武装力量\n\n阿尔巴尼亚武装部队作为执政派别，代表着总参谋部的统治，其合法性源于1997年国家崩溃、当年军火库遭洗劫的惨痛记忆，以及对政党政治再次沦为武装集团的担忧。其信条将领土完整、科索沃边境安全和内部秩序置于议会谈判之上，各部委置于军方监督之下，警察也并入单一指挥系统。\n\n实际上，自20世纪90年代以来，阿尔巴尼亚军队一直是一支规模较小、亲西方的职业化部队。该军于2009年4月1日加入北约，2010年废除了征兵制，并将部队派往驻科索沃国际安全部队和阿富汗，而非涉足政治。如果建立军政府，阿尔巴尼亚将以联盟信誉换取国内控制权，而其影响力将主要体现在其作为唯一一个在1997年之后完整保留下来的国家机构。"
 ALB.Monarchist: "£ALB_nationalist_monarchist (HZ) - 索古王室"
 ALB.Monarchist_desc: "(君主制) - 索古王室\n\n索古家族作为执政派别，代表着艾哈迈德·索古于1928年登基、后在1939年意大利入侵中失去王位的复辟。其论点是，凌驾于氏族、党派和地域之上的君主制是阿尔巴尼亚人唯一认可的、民族而非派系权威。该家族的信条主张在国王的领导下建立强有力的行政机构，奉行保守且亲西方的外交政策，并利用王室威望在危机中维系国家团结。\n\n实际上，这一主张的基础十分薄弱。1997年6月29日举行的全民公投显示，33%的选民支持君主制，但莱卡一世认为这一结果存在舞弊，予以否认。这位王位觊觎者于2011年11月30日在地拉那去世。他的儿子莱卡二世继承了王位，并继续留在政坛，而合法性运动党则为其提供竞选平台。"
 ALG.conservatism: "£ALG_conservatism_small (ANR) - 全国共和联盟"
 ALG.conservatism_desc: "（世俗共和主义） - 全国共和联盟\n\n全国共和联盟是“根除者”政党，由前总理雷达·马利克于1995年5月5日创立，旨在捍卫世俗共和国，反对与伊斯兰救世阵线达成任何妥协。该党认为，国家绝不能与政治伊斯兰进行谈判，1995年的圣埃吉迪奥纲领是一种投降，阿尔及利亚的未来在于现代化、法语国家和坚定的共和民族主义。\n\n实际上，其毫不妥协的路线使其势力范围缩小。该党拒绝承认2002年选举舞弊，2007年仅获得4个席位，2017年仅获得6个席位，得票率不足2%，且其创始人也在2017年去世。该党的影响力主要体现在思想层面而非选举层面，因为它是世俗阵营中最鲜明的声音，而军队在内战期间曾极力拉拢该阵营，但此后对它的需求有所减少。"
 ALG.liberalism: "£ALG_liberalism_small (RND) - 民主民族联盟"
 ALG.liberalism_desc: "（专制保守主义） - 民主民族联盟\n\n民主民族联盟是阿尔及利亚政权政党体系的第二大支柱，成立于1997年2月21日，旨在为总统利亚明·泽鲁阿尔和军队提供一个除民族解放阵线之外的民用平台。该联盟主张赋予总统强大的权力，在国家指导下进行市场改革，对伊斯兰主义暴力采取强硬路线，并与欧洲建立紧密的经济联系。其成员主要来自政府部门、国家工会和退伍军人组织。\n\n实际上，该党在其首次参选的选举中便取得了胜利，在1997年的380个席位中赢得了156席。此后，该党一直是历届总统联盟中与民族解放阵线的执政伙伴，艾哈迈德·乌亚希亚曾四次担任总理，直至2019年反腐运动中被捕入狱。该党的优势在于其强大的国家机器，而其弱点在于它脱离国家机器便无法存在，正如2017年“人民运动”打破旧秩序后，该党席位从2017年的100席锐减至2021年的58席所表明的那样。"
 ALG.socialism: "£ALG_socialist_small (UDR) - 民主与共和联盟"
 ALG.socialism_desc: "（社会民主主义） - 民主与共和联盟\n\n民主与共和国联盟是一个卡比尔社会民主党，由阿玛拉·本尤内斯和其他一些前文化与民主联盟成员于2003年9月26日在贝贾亚创立。该党主张建立世俗共和国、联邦权力下放和承认阿马齐格人的身份，但同时又愿意与现有体制和总统府合作，而这是卡比尔老牌政党所拒绝的。\n\n实际上，它是一个亲政权的中左翼小党，其主要优势在于其创始人与总统的密切关系。为了在2012年大选前摆脱其地区性形象，该党于2012年2月更名为阿尔及利亚人民运动。当社会主义力量阵线和民主变革联盟抵制选举时，该党作为卡比利亚地区的对话者，其影响力在于国家可以以此为筹码。"
 ALG.socialism_2012: "£ALG_socialist_2012_small (MPA) - 阿尔及利亚人民运动"
 ALG.socialism_2012_desc: "（社会民主主义） - 阿尔及利亚人民运动\n\n阿尔及利亚人民运动是民主与共和国联盟在2012年2月的代表大会上通过的名称。当时，阿玛拉·本尤内斯试图将一个卡比尔地区的政党转型为一支全国性的社会民主力量。该党主张建立一个世俗的、权力下放的共和国，维护柏柏尔人的权利，并发展现代经济。与以往的卡比尔政党不同，该党始终保持着对总统的忠诚支持。\n\n实际上，该党在2012年赢得了7个席位，在2017年赢得了13个席位，从而将自己定位为政权联盟中柏柏尔政治可接受的代表。它的弱点也恰恰在于这种依赖性，一旦“人民运动”推翻了它所服务的布特弗利卡体系，它便失去了议会地位。"
 ALG.Autocracy: "£ALG_Autocracy_small (FLN) - 民族解放阵线"
 ALG.Autocracy_icon: "£ALG_Autocracy_small"
 ALG.Autocracy_desc: "（阿拉伯社会主义） - 民族解放阵线\n\n民族解放阵线是1954年阿尔及利亚独立战争的领导政党，曾作为单一政党执政至1989年，至今仍声称代表整个国家，而非其内部的一个派系。其信条是阿拉伯民族主义、以油气资源为资金来源的国家主导型发展、与巴勒斯坦和撒哈拉人民团结一致反对殖民主义，以及建立凌驾于各党派之上的总统制，并由军队和安全部门作为这一制度的捍卫者。\n\n实际上，自内战结束后，该党一直是历届立法机构中的最大党，在阿卜杜勒-阿齐兹·布特弗利卡的领导下，分别于2002年和2012年获得199个和208个席位，并在2019年布特弗利卡下台后继续作为执政联盟的核心力量存在，在2021年获得98个席位。该党的优势在于国家本身，而其弱点在于“人民运动”一代将其视为一切必须被抛弃之物的象征。"
 ALG.Conservative: "£ALG_Conservative_small (FNA) - 阿尔及利亚民族阵线"
 ALG.Conservative_desc: "（右翼民粹主义） - 阿尔及利亚民族阵线\n\n阿尔及利亚民族阵线是一个民族主义民粹主义政党，由穆萨·图阿蒂于1999年创立。图阿蒂认为，国家已被腐败的将军、部长和进口商寡头集团所把持，阿尔及利亚需要一个强大、廉洁、社会保守的政府，将穷人的利益放在首位。该党以住房、就业、国家主权和革命记忆为竞选纲领，并致力于争取被主流政党忽视的小城镇和工人阶级青年的支持。\n\n实际上，在2000年代，它是规模最大的右翼小党，2007年席位增至13席，图阿蒂分别在2009年和2014年竞选总统。它的弱点在于选举制度，2017年仅获得9.5%的选票，却未能赢得任何席位。它的筹码是抗议性投票，而政权已经学会容忍这种投票，因为它从未在其创始人之外组织过任何团体。"
 ALG.Caliphate: "£ALG_Caliphate_small (GSPC) - 萨拉菲派宣教与战斗组织"
 ALG.Caliphate_desc: "（萨拉菲圣战主义） - 萨拉菲派宣教与战斗组织\n\n萨拉菲宣教与战斗组织是1998年在哈桑·哈塔卜领导下从武装伊斯兰组织分裂出来的圣战派别。该组织认为武装伊斯兰组织对村民的大屠杀背叛了斗争，并主张战争应该针对国家、其军队及其外国支持者。该组织寻求在阿尔及利亚建立一个实行伊斯兰教法的伊斯兰酋长国，并拒绝接受《​​国内和解》和2005年《和解宪章》中的特赦条款，认为这是投降。\n\n实际上，它成为了内战中最后一个主要武装组织，在卡比利山区和撒哈拉沙漠地区顽强抵抗，而其余地区则被国家吞并。自2003年纳比勒·萨赫拉维和2004年阿卜杜勒马利克·德鲁克德尔领导以来，该组织转向基地组织，于2006年9月宣誓效忠，并于2007年1月更名为“伊斯兰马格里布基地组织”。其影响力在于，即使在战争结束后，它仍能长期维持叛乱活动。"
 ALG.Caliphate_2006: "£generic_Caliphate_small (AQIM) - 伊斯兰马格里布基地组织"
 ALG.Neutral_Muslim_Brotherhood_desc: "（伊斯兰民主主义） - 伊斯兰马格里布基地组织\n\n和平社会运动是穆斯林兄弟会的阿尔及利亚分支，由马赫福德·纳赫纳于1990年12月6日创立。该组织是一个伊斯兰主义政党，主张参与而非对抗，并拒绝跟随伊斯兰救国阵线卷入内战。它主张通过选举、保守的社会秩序和混合经济，逐步实现法律和社会的伊斯兰化，同时务实地接受总统制和军队作为其运作框架。\n\n实际上，该党因其选择而获得回报，在1997年赢得了多个部长职位和69个议席。从1999年到2012年，该党一直与民族解放阵线和民族民主联盟组成总统联盟，直到2012年退出联盟，转而领导绿色阿尔及利亚联盟。在布格拉·索尔塔尼、阿卜杜勒拉扎克·马克里及其继任者的领导下，该党已成为最大的反对党，在2021年拥有65个议席。该党的优势在于，它是阿尔及利亚政权唯一能够与之共存的伊斯兰主义力量。"
 ALG.Neutral_Autocracy: "£ALG_Neutral_Autocracy_small (MRN) - 民族改革运动"
 ALG.Neutral_Autocracy_desc: "（伊斯兰保守主义） - 民族改革运动\n\n民族改革运动（简称“伊斯兰改革党”）是阿卜杜拉·贾巴拉于1999年创建的第二个政党。此前，贾巴拉领导的复兴运动因支持政权总统候选人而与其决裂。该党主张建立伊斯兰民主，既不与总统制保持距离，也不与穆斯林兄弟会妥协。其纲领包括以伊斯兰教法为基础的法律、阿拉伯化、社会保守主义，并反对布特弗利卡时代的经济自由化政策。\n\n实际上，其创始人的固执使该党在21世纪初成为最强大的伊斯兰主义政党，在2002年的选举中以43个席位位居第二，但随后又将其摧毁。2007年4月，贾巴拉被一个亲政权的派系赶下台，该党席位锐减至3个，如今作为绿色阿尔及利亚联盟的一部分而存在，而其创始人则于2012年转投第三个政治阵营。"
 ALG.Neutral_conservatism: "£ALG_Neutral_conservatism_small (MRI) - 伊斯兰复兴运动"
 ALG.Neutral_conservatism_desc: "（伊斯兰保守主义） - 伊斯兰复兴运动\n\n伊斯兰复兴运动是一个温和的伊斯兰政党，由阿卜杜拉·贾巴拉于1990年创立，他来自君士坦丁大学伊斯兰协会。该党旨在游走于伊斯兰救世阵线和穆斯林兄弟会之间，主张建立保守的伊斯兰民主、推动公共生活的阿拉伯化和社会正义。在内战期间，该党选择参与选举，而不是诉诸武力或退出政治舞台。\n\n实际上，该党在1997年达到鼎盛时期，拥有34个席位和8.7%的得票率。1999年，领导层支持政权候选人，贾巴拉退出，导致该党分裂，2002年仅剩一个席位。此后，该党一直作为一个小型保守伊斯兰主义政党存在于各种联盟之中，例如2012年的绿色阿尔及利亚联盟和2017年与贾巴拉所属政党的联合名单。该党的影响力主要体现在其名称和位于君士坦丁的根基上，而非席位数量。"
 ALG.neutral_Social: "£ALG_neutral_Social_small (FFS) - 社会主义力量阵线"
 ALG.neutral_Social_desc: "（社会民主主义） - 社会主义力量阵线\n\n社会主义力量阵线是阿尔及利亚历史最悠久的反对党，由独立领袖侯赛因·艾特·艾哈迈德于1963年9月29日发起武装起义，反对民族解放阵线的一党制国家，直到1990年才获得合法地位。该党主张建立民主和社会共和国、地区自治和承认阿马齐格人的身份，实践中奉行世俗主义，但不愿加入打击伊斯兰主义者的行列，并且是社会党国际和进步联盟的成员。\n\n该党的优势在于卡比利亚地区，它是该地区历史悠久的政党，其道德资本在于它从未向政权妥协，这一点体现在它抵制了2002年、2007年和2009年的选举，认为选举存在舞弊。该党参选时席位不多，2012年获得27席，此后也只有十几席左右。其影响力在于，自2015年艾特·艾哈迈德去世后，它能够决定任何政治机会的合法性。"
 ALG.Neutral_Communism: "£ALG_Neutral_Communism_small (PT) - 工人党"
 ALG.Neutral_Communism_desc: "（托洛茨基主义） - 工人党\n\n阿尔及利亚工人党是该国的托洛茨基主义政党，成立于1990年，自成立之初便由路易莎·哈努内领导。该党主张国家石油财富必须掌握在公共手中，私有化和外商投资法等同于重新殖民化，并认为国家应捍卫工资、补贴和公共部门，使其免受国际货币基金组织和私人资产阶级的侵害。该党与国际托洛茨基主义的兰伯特主义思潮密切相关，并将经济激进主义与捍卫世俗法律和妇女权利相结合。\n\n实际上，该党一直是左翼最大的政党，在2007年获得了26个席位和5%的得票率，此后又赢得了大约十几个议席。2004年，哈努内成为阿拉伯世界第一位竞选总统的女性。该党的优势在于其在工会中拥有纪律严明的群众基础，以及连其反对者都承认的始终如一的声誉。"
 ALG.Nat_Populism: "£ALG_Nat_Populism_small (Ahd 54) - Ahd 54"
 ALG.Nat_Populism_desc: "（民族保守主义）- Ahd 54\n\nAhd 54是一个民族主义政党，由阿里·法齐·雷班于1991年创立，其名称源自革命者1954年11月1日的誓言，该党主张国家背叛了独立战争的承诺，必须回归《11月宣言》的价值观。它将捍卫国家主权、阿拉伯语和解放斗争的记忆与雷班作为活动家多年来继承的人权话语结合起来。\n\n实际上，这是一个由一人一理念组成的政党，它为雷班在2004年、2009年和2014年的总统选举中提供了平台，尽管他的得票率从未超过1%，但在2007年至2017年间，该党也只赢得了两到三个议席。它的影响力是象征性的，提醒人们该政权的合法性仍然建立在其声称已经放弃的革命之上。"
 ALG.Nat_Fascism: "£ALG_Nat_Fascism_small (Ba'ath) - 阿尔及利亚阿拉伯复兴社会党"
 ALG.Nat_Fascism_desc: "（复兴党） - 阿尔及利亚阿拉伯复兴社会党\n\n阿尔及利亚阿拉伯复兴社会党是伊拉克主导的复兴党在阿尔及利亚的被禁分支。该党主张阿尔及利亚属于一个统一的阿拉伯民族，只有建立一个效仿萨达姆·侯赛因时期伊拉克的纪律严明的先锋党，才能确保民族团结、社会主义以及摆脱西方控制。该党认为民族解放阵线的民族主义止步于国界，伊斯兰主义者是宗教异端，自由主义者是法国的代理人，并将柏柏尔人问题视为殖民主义的产物。\n\n实际上，这是一个由艾哈迈德·舒特里领导的秘密教派。舒特里在20世纪90年代的镇压下逃往巴格达，2003年美国入侵后返回阿尔及利亚，并发表了一份信仰萨达姆复兴党的宣言。该教派从未参加过任何选举，影响力微乎其微，其意义在于维持泛阿拉伯威权主义思潮在阿尔及利亚政治边缘的存续。"
 ALG.Nat_Autocracy: "£ALG_Nat_Autocracy_small (ANP) - 阿尔及利亚人民国家武装力量"
 ALG.Nat_Autocracy_desc: "（军政府） - 阿尔及利亚人民国家武装力量\n\n国家人民军作为执政派别，代表着自阿尔及利亚独立以来一直支持历届政府的机构的公开统治，它是民族解放军的继承者，也是革命合法性的捍卫者。其信条将文官政治视为军队所允许的幌子，只要它不威胁国家安全。它以内战记忆、与利比亚、马里和摩洛哥接壤的边境安全以及维护支撑一切的油气经济为由，为其直接指挥辩护。\n\n实际上，军方在1992年1月取消了伊斯兰主义者的选举，并在总参谋长艾哈迈德·盖德·萨拉赫的领导下，于2019年4月2日迫使阿卜杜勒-阿齐兹·布特弗利卡下台，此前该国爆发了为期五周的“人民运动”抗议活动，随后清洗了总统的亲信。自2019年12月赛义德·成格里哈上台以来，军方仍然是阿尔及利亚政治的仲裁者，其优势在于，没有任何一届政府能够与之抗衡。"
 AQY.Caliphate: "£generic_Caliphate_small (AQAP) - 阿拉伯半岛的基地组织"
 AQY.Caliphate_desc: "（萨拉菲圣战主义） - 阿拉伯半岛的基地组织\n\n阿拉伯半岛基地组织是基地组织的也门分支，于2009年1月由也门和沙特阿拉伯的基地组织合并而成，由奥萨马·本·拉登的前秘书纳赛尔·瓦希希领导，沙特人赛义德·希赫里担任其副手。该组织也门核心力量在2006年2月3日23名武装分子（包括瓦希希和卡西姆·雷米）从萨那监狱越狱后得以重建。该组织信奉萨拉菲圣战主义，主张将沙特君主制和西方势力驱逐出阿拉伯半岛，建立一个实行伊斯兰教法的伊斯兰酋长国，并对美国发动战争。多年来，它一直是基地组织对西方最危险的分支，并于2010年1月19日被华盛顿认定为外国恐怖组织。\n\n自2011年起，该组织以“安萨尔沙里亚”的名义参与也门内战，于2011年5月至2012年6月控制了津吉巴尔和阿比扬省的大部分地区，并于2015年4月至2016年4月控制了穆卡拉港，在那里设立了行政机构并对贸易征税。2015年6月12日，美国无人机袭击炸死了瓦希希，2020年1月29日又炸死了雷米；2024年3月10日，哈立德·巴塔菲的死讯公布，萨阿德·奥拉基接任其职务。该组织的优势在于阿比扬省、舍卜沃省和哈德拉毛省的部落腹地以及胡塞武装与政府军之间战争造成的混乱；其劣势在于美国的无人机袭击以及伊斯兰国对其招募人员的竞争。"
 ARM.conservatism: "£ARM_western_conservative (RP) - 共和党"
 ARM.conservatism_icon: "£ARM_western_conservative"
 ARM.conservatism_desc: "(保守自由主义) - 共和党\n\n共和党是一个中间偏右、亲欧的政党，由阿拉姆·萨尔基相和其他前共和党人士以及耶尔克拉帕老兵于2001年4月1日创立，他们在1999年议会枪击事件后与罗伯特·科恰良决裂。该党将自由主义经济政策与保守主义社会立场相结合，并推动与欧盟和北约建立更紧密的联系。\n\n在选举方面，该党在2003年和2012年分别赢得一个席位，并在2017年通过“出路联盟”进入议会，但在2021年单独参选时，其得票率下降至3.04%。该党的影响力来自于萨尔基相作为前总理和被暗杀的瓦兹根·萨尔基相的兄弟的身份，这使得该党在反对派联盟的构建中保持着核心地位。"
 ARM.liberalism: "£ARM_western_liberalism (OEK) - 法治"
 ARM.liberalism_icon: "£ARM_western_liberalism"
 ARM.liberalism_desc: "(自由保守主义) - 法治\n\n法治党是一个中间偏右、亲欧的政党，由阿图尔·巴格达萨良于1998年创立。巴格达萨良认为，亚美尼亚只有在完成波罗的海三国已实施的法律、社会和政治改革之后，才能启动加入欧盟的谈判。该党融合了自由保守主义和基督教民主主义立场，并曾作为共和党领导的政府的附属伙伴。\n\n在选举方面，该党在2003年达到顶峰，获得19个席位和12.9%的选票，当时巴格达萨良当选议长。之后，该党在2012年跌至6个席位，并在2017年失去议席。此后，该党的影响力主要依靠巴格达萨良在安全机构中的关系网，而不是任何群众基础。"
 ARM.Neutral_Libertarian: "£ARM_Neutral_Libertarian (ANC) - 亚美尼亚国民大会"
 ARM.Neutral_Libertarian_desc: "(社会自由主义) - 亚美尼亚国民大会\n\n亚美尼亚国民大会党成立于2008年8月1日，是前总统列翁·特尔-彼得罗相在有争议的选举和3月1日屠杀事件后组建的反对派联盟，并于2013年成为单一政党。该党主张与土耳其和阿塞拜疆实现关系正常化，通过谈判解决阿尔察赫问题，加入欧洲一体化，并与欧亚联盟、欧洲、美国和中国等各方开展开放贸易。\n\n在选举方面，该党在2009年埃里温选举中获得17.57%的选票，2012年获得7个席位，随后在列翁·祖拉比扬的领导下，2017年和2021年分别下滑至1.66%和1.54%。该党的影响力在于其创始人捷尔-彼得罗相的权威以及其作为欧洲自由民主联盟成员的身份。"
 ARM.socialism: "£ARM_western_socialism (PANM) - 泛亚美尼亚民族运动"
 ARM.socialism_icon: "£ARM_western_socialism"
 ARM.socialism_desc: "(自由民族主义) - 泛亚美尼亚民族运动\n\n泛亚美尼亚民族运动源于1988年2月的卡拉巴赫委员会，并在列翁·特尔-彼得罗相的领导下，于1990年至1998年成为独立亚美尼亚的执政党。它将自由民主和市场改革与务实的外交政策相结合，寻求通过谈判解决纳戈尔诺-卡拉巴赫问题。\n\n1998年特尔-彼得罗相被迫辞职后，该党在1999年失去了所有席位，2012年重新获得一个席位，随后于2013年4月解散并入亚美尼亚国民大会。其政治遗产通过国民大会和一群前部长级人物延续至今，这些人仍然影响着自由派反对派。"
 ARM.Conservative: "£ARM_Conservative (KA) - 科恰良政府"
 ARM.Conservative_icon: "£ARM_Conservative"
 ARM.Conservative_desc: "(威权保守主义) - 科恰良政府\n\n科恰良政府是以罗伯特·科恰良为核心的执政集团。科恰良曾任纳戈尔诺-卡拉巴赫总统，1997年与瓦兹根·科恰良和谢尔日·萨尔基相联手迫使列翁·捷尔-彼得罗相下台后，于1998年出任总理和总统。该集团没有自己的政党，而是依靠地方强人、忠诚官员以及依赖总统恩宠的商业利益来维持权力。\n\n实际上，这意味着受操控的选举、一个权力下放的议会，以及一个被随意用于镇压街头的安保机构，正如2008年3月1日十人被杀事件所表明的那样。它的承诺是稳定和增长，其代价是清除政治舞台上真正的反对派。"
 ARM.Nat_Autocracy: "£ARM_military_junta (YVU) - 国土卫士志愿者联盟"
 ARM.Nat_Autocracy_icon: "£ARM_military_junta"
 ARM.Nat_Autocracy_desc: "(军事主义) - 国土卫士志愿者联盟\n\n国土卫士是第一次卡拉巴赫战争老兵的联盟，由瓦兹根·萨尔基相于1993年7月创立，成员人数估计在5000至30000人之间。在萨尔基相的领导下，该联盟在1994年后成为该国最有影响力的组织，到1998年，其在国民议会中拥有69名议员的党团成为议会第一大党团，之后该党团并入了共和党。\n\n1999年10月27日，萨尔基相在议会枪击事件中丧生后，该联盟失去了政治领袖和对国家的控制。如今，它的筹码在于可以动员退伍军人走上街头，以及在2016年和2020年战争中发挥的准军事作用。"
 ARM.Nat_Fascism: "£ARM_anarchist_communism (ARF) - 亚美尼亚革命联盟 (§8民族主义§!派)"
 ARM.Nat_Fascism_icon: "£ARM_anarchist_communism"
 ARM.Nat_Fascism_desc: "(革命民族主义) - 亚美尼亚革命联盟民族主义派\n\n亚美尼亚革命联盟于1890年在第比利斯由克里斯塔波尔·米卡埃利安、斯捷潘·佐里安和西蒙·扎瓦里安创立，是一个为亚美尼亚民族事业而奋斗的革命政党。其民族主义派系优先考虑统一亚美尼亚对西亚美尼亚、阿尔察赫和纳希切万的领土主张，并将该党的社会主义传统置于民族利益之后。\n\n在亚美尼亚，该党于1994年至1998年被列翁·特尔-彼得罗相取缔，之后成为共和党的执政伙伴，后来又成为科恰良领导的亚美尼亚联盟的核心，在2021年拥有10个席位。其影响力来自侨民组织、青年运动和激进传统，这是任何国内政党都无法比拟的。"
 ARM.Nat_Populism: "£ARM_Conservative_alt (RPA) - 亚美尼亚共和党 (§8民族主义§!派)"
 ARM.Nat_Populism_desc: "(民族保守主义) - 亚美尼亚共和党民族主义派\n\n亚美尼亚共和党由阿肖特·纳瓦萨尔迪扬于1990年4月2日创立，其信奉加列金·恩杰德的民族宗教教义“民族宗教”。该党的民族主义派系至今仍坚持这一信条，并将其视为党的立党之本。该党将亚美尼亚民族国家、教会、军队和阿尔察赫置于首位，而非那些在党执政后加入的官员所奉行的经济实用主义。\n\n纳瓦萨尔迪扬于1997年11月去世后，民族主义派的势力逐渐衰落，先后被安德拉尼克·马尔加良和谢尔日·萨尔基相的势力所取代，后者在党内安插了大量亲信。民族主义派的影响力在于其建党理念和信奉这一理念的老党员，而非党的组织机构。"
 ARM.Monarchist: "£ARM_Monarchist (MU) - 贵族联盟"
 ARM.Monarchist_icon: "£ARM_Monarchist"
 ARM.Monarchist_desc: "(贵族君主主义) - 贵族联盟\n\n贵族联盟是一个亚美尼亚贵族协会，于2012年7月27日在司法部注册成立。该协会得名于在波斯宗主权下统治卡拉巴赫和休尼克亚美尼亚公国的世袭贵族。它与亚美尼亚贵族联盟共同聚集了约450名自称是古老家族后裔的成员，致力于恢复贵族传统、纹章学和家谱学。\n\n作为一支政治力量，该联盟扮演着君主制选举团的角色，负责在亚美尼亚王位的竞争者中做出最终决定。它的影响力在于社会声望以及与格鲁吉亚巴格拉季昂王室的联系，而非任何民众基础。"
 ARM.oligarchism: "£ARM_oligarch (BHK) - 繁荣亚美尼亚"
 ARM.oligarchism_desc: "(社会保守主义) - 繁荣亚美尼亚\n\n“繁荣亚美尼亚”是亚美尼亚最富有的商人之一加吉克·察鲁基扬的政治工具，成立于2004年4月30日，建立在其商业帝国和慈善赞助之上。该党融合了经济自由主义、社会保守主义和温和的疑欧主义，主张与俄罗斯保持密切联系，同时与欧盟保持经济伙伴关系。\n\n在选举中，该党在2007年位居第二，获得25个席位；在2012年成为主要反对党，获得35个席位；在2018年再次位居第二，获得26个席位；但在2021年暴跌至3.95%。该党的影响力来自察鲁基扬的资金和他旗下企业所拥有的忠诚度，而不是意识形态。"
 ARM.Neutral_Autocracy: "£ARM_Neutral_Autocracy (CRU) - 宪法权利联盟"
 ARM.Neutral_Autocracy_icon: "£ARM_Neutral_Autocracy"
 ARM.Neutral_Autocracy_desc: "(保守主义) - 宪法权利联盟\n\n宪法权利联盟是一个右翼疑欧派政党，成立于1989年，由海克·巴布汉扬担任主席，该党反对共产主义和自由主义。它希望亚美尼亚成为俄罗斯、格鲁吉亚、伊朗和阿拉伯世界之间的合作中心，并支持亚美尼亚加入欧亚联盟和与俄罗斯建立联盟国家。\n\n该党在1999年法律与团结联盟中赢得七个席位，此后未再参加过全国大选。其影响力主要来自其旗下报纸《权利报》以及其在2021年成立的亲俄政党联盟“新联盟”中的地位。"
 ARM.Western_Autocracy: "£ARM_Western_Autocracy (UNSD) - 民族自决联盟"
 ARM.Western_Autocracy_icon: "£ARM_Western_Autocracy"
 ARM.Western_Autocracy_desc: "(民族自由主义) - 民族自决联盟\n\n民族自决联盟是一个亲西方的民族主义政党，由帕鲁伊尔·海里基扬于1987年创立。海里基扬曾是苏联异见人士，因要求亚美尼亚独立而被监禁多年。该联盟主张全面融入欧洲，脱离俄罗斯的安全保障，并主张建立一个高度武装的国家，将军事化视为在敌对邻国之间生存的必要代价。\n\n该党在选举中于1995年达到鼎盛时期，获得三个议席，自1999年以来一直是议会外的一股力量，海里基扬的总统竞选仅获得微弱支持。该党的影响力源于其创始人的异议人士身份，以及其作为亚美尼亚政坛大西洋主义最悠久代表的地位。"
 ARM.anarchist_communism: "£ARM_anarchist_communism (ARF) - 亚美尼亚革命联盟(§7新兴主义§!派)"
 ARM.anarchist_communism_icon: "£ARM_anarchist_communism"
 ARM.anarchist_communism_desc: "(民主社会主义) - 亚美尼亚革命联盟新兴主义派\n\n亚美尼亚革命联盟是一个民族主义社会主义政党，于1890年在第比利斯成立，自2003年起成为社会党国际正式成员，在黎巴嫩、伊朗和美洲等亚美尼亚侨民社区设有分支机构。该党的社会主义派别在关注民族问题的同时，也优先考虑其对社会正义、工人组织和国家主导经济的历史承诺。\n\n在亚美尼亚，该党自2007年起加入共和党领导的联盟，拥有16个席位；2018年席位跌破门槛；2021年重返联盟，在亚美尼亚联盟中获得10个席位。该党的优势在于其海外侨民的资金和组织能力，这是任何纯粹的国内政党都无法比拟的。"
 ARM.Autocracy: "£ARM_Autocracy (NU) - 民族团结党"
 ARM.Autocracy_icon: "£ARM_Autocracy"
 ARM.Autocracy_desc: "(民族保守主义) - 民族团结党\n\n民族团结党是一个保守的亲俄政党，由阿尔塔什·格加米扬于 1997 年创立，他一直领导该党直至 2024 年去世。该党主张亚美尼亚留在集体安全条约组织和欧亚联盟内，同时追求欧洲一体化，并警告西方基金会和北约在亚美尼亚领土上的部署。\n\n该党在2003年赢得9个议席，得票率为8.8%，格加米扬在当年的总统选举中获得17.54%的选票。但到了2007年，该党得票率跌至3.69%，此后便再未参加过议会选举。尽管如此，该党仍拥有46700名党员，并在2021年后支持亲俄的“新联盟”联盟，其影响力依然存在。"
 ARM.Neutral_conservatism: "£ARM_neutral_conservative (PP) - 爱国者党"
 ARM.Neutral_conservatism_icon: "£ARM_neutral_conservative"
 ARM.Neutral_conservatism_desc: "(民族保守主义) - 爱国者党\n\n爱国者党是一个保守党，成立于2021年1月13日，当时正值反对尼科尔·帕希尼扬的抗议活动期间，其根源可以追溯到1994年已解散的民族国家党。该党致力于团结其所谓的重要的民族力量，建立一个捍卫亚美尼亚语言、信仰、文化和祖国的诚实国家。\n\n从政治上看，该党属于战后民族主义反对派，在国民议会中没有席位。其影响力仅限于抗议政治以及众多争夺同一批选民的小型爱国政党。"
 ARM.Neutral_green: "£ARM_Neutral_Green (GPA) - 亚美尼亚绿党"
 ARM.Neutral_green_icon: "£ARM_Neutral_Green"
 ARM.Neutral_green_desc: "(环保主义) - 亚美尼亚绿党\n\n亚美尼亚绿党由阿尔梅纳克·多夫拉蒂扬于1999年2月创立，至今仍是该国主要的绿色政治力量，致力于在全国范围内开展环境保护运动。该党将生态与经济发展相结合，力求遏制人口外流，加强与海外侨民的联系，并结束外国对亚美尼亚事务的干涉。\n\n该党在选举中从未进入过议会，在2018年埃里温选举中得票率不足1%，在2021年自由祖国联盟内部的选举中也仅获得0.32%的选票。其影响力主要来自环保运动，而非选票。"
 ARM.neutral_Social: "£ARM_neutral_Social (DPA) - 亚美尼亚民主党"
 ARM.neutral_Social_icon: "£ARM_neutral_Social"
 ARM.neutral_Social_desc: "（民主社会主义） - 亚美尼亚民主党\n\n亚美尼亚民主党由苏联时期亚美尼亚共产党最后一任第一书记阿拉姆·加斯帕尔·萨尔基相于1991年创立。他解散了声名狼藉的执政党，并将其重建为一个民主社会主义政党。该党主张社会市场经济、强大的福利国家以及在俄罗斯和西方之间保持平衡的外交政策。\n\n在选举中，该党从未跨越过门槛，1999年的得票率为0.98%，2021年的得票率为0.39%。它的影响力如同一个老政治家的纲领，在共产主义和民族主义阵营之外维持着社会主义的声音。"
 ARM.Neutral_Communism: "£ARM_Neutral_Communism (PPA) - 亚美尼亚人民党"
 ARM.Neutral_Communism_icon: "£ARM_Neutral_Communism"
 ARM.Neutral_Communism_desc: "（民主社会主义） - 亚美尼亚人民党\n\n亚美尼亚人民党由卡伦·德米尔奇扬于1998年创立。德米尔奇扬是苏联时期亚美尼亚的领导人，在当年的总统决选中以40.1%的得票率击败了罗伯特·科恰良。1999年，德米尔奇扬在议会枪击事件中遇难，之后该党由其子斯捷潘·德米尔奇扬领导。该党主张恢复社会主义经济和上世纪90年代损失的工业产能，并在2007年之前从亲俄立场转向亲欧立场。\n\n选举方面，该党在1999年与共和党组成团结联盟赢得62个席位，在2003年与正义联盟赢得14个席位，之后在2007年跌至1.68%，此后再未进入议会。该党的影响力主要依赖于德米尔奇扬家族的姓氏以及人们对苏联时期工业国家的怀旧之情。"
 AUS.conservatism: "£AUS_western_conservative (ÖVP) - 奥地利人民党"
 AUS.conservatism_desc: "（基督教民主主义） - 奥地利人民党\n\n奥地利人民党是第二共和国的主要中右翼力量，成立于1945年，是两次世界大战之间基督教社会运动的继承者，其根基在于天主教社会训导、构成其联邦结构的农民联盟和商业联盟，以及坚定的亲欧立场。该党主张社会市场经济、预算纪律、联邦制下放权力以及捍卫家庭和教会在公共生活中的地位，并且是欧洲人民党和国际民主联盟的成员。\n\n该党在战后的大部分时间里都与社会民主党组成大联盟执政，但此后却屡次打破这一共识，转而与自由党联合执政。在年轻一代的领导下，该党已将自身重塑为一个现代化、反对移民的运动型政党。其支持者主要集中在西部和南部农村地区以及工商会和农业商会，而其反复面临的困境在于联盟的格局，迫使其在左翼和民粹主义右翼之间做出选择。"
 AUS.liberalism: "£AUS_western_liberal (LIF) - 自由论坛"
 AUS.liberalism_desc: "（自由主义）- 自由论坛\n\n自由论坛由海德·施密特和其他四位自由党议员于1993年创立，他们拒绝追随约尔格·海德尔转向民族主义民粹主义的路线。自由论坛成为战后国民议会中第一个纯粹的自由主义政党。它主张公民自由、政教分离、少数群体权利以及摆脱社会伙伴间社团主义讨价还价的市场经济，并隶属于自由国际和欧洲自由主义阵营。\n\n在1999年的选举中失去议会席位后，论坛党作为一个由维也纳和西方城市专业人士和知识分子组成的小党派仍然存在，其影响力主要体现在毒品政策、商店营业时间和公民身份等议题的辩论中，而非选举投票中。它仍然是一个以城市专业人士为主导的政党，在辩论中比在选票上更有分量。"
 AUS.socialism: "£AUS_western_social_democrat (SPÖ) - 奥地利社会民主党"
 AUS.socialism_desc: "（社会民主主义） - 奥地利社会民主党\n\n奥地利社会民主党是该国历史最悠久的政党，由维克托·阿德勒于1888年末至1889年初在海因费尔德创立，是红色维也纳、克莱斯基时代以及战后社会伙伴关系制度的政治继承者。该党捍卫福利国家、工会和劳工商会、公共住房、积极中立和亲欧外交政策，并隶属于欧洲社会党和进步联盟。\n\n该党进入二十一世纪时是国民议会中最强大的力量，但随后被人民党和自由党组成的联盟推向反对派。此后，该党在领导大联盟和失去工人阶级选民（转而支持民粹主义右翼）之间摇摆不定。其力量主要集中在维也纳、上施蒂利亚的工业城镇以及工会组织；其内部反复出现的斗争是务实派和左翼之间如何应对自由党的问题。"
 AUS.anarchist_communism: "£AUS_emerging_left_wing_radical (SOV) - 社会主义进攻前锋"
 AUS.anarchist_communism_desc: "（托洛茨基主义） - 社会主义进攻前锋\n\n社会主义进攻前进是工人国际委员会的奥地利分部，由“前进”小组于1996年创立。“前进”小组自1981年起便在社会民主党青年团内部活动，后因其托洛茨基主义渗透而被开除。该组织主张推行革命社会主义纲领，主张在工人控制下实现国有化，与社会伙伴关系和欧盟（该组织认为欧盟是企业联盟）决裂，并在社会民主党之外建立一个全新的工人政党。\n\n它的活动主要集中在街头而非选票上：反对自由党的反法西斯动员、学生罢课、在学徒和移民青年中开展运动。它即将更名并以自己的名义参加选举。"
 AUS.Neutral_conservatism: "£AUS_non_aligned_conservative (BZÖ) - 奥地利未来联盟"
 AUS.Neutral_conservatism_desc: "（共国家保守主义） - 奥地利未来联盟\n\n奥地利未来联盟由约尔格·海德尔和自由党执政派系于2005年创立。此前，他们失去了对自由党的控制权，该党被其强硬派夺取控制权，同时失去了内阁部长、大部分议会席位以及克恩顿州的控制权。该联盟自诩为一个有能力执政的右翼政党：在移民和庇护问题上立场强硬，但在欧洲问题上务实，对企业友好，并愿意与人民党维持联合执政关系。\n\n海德尔去世后，自由党在约瑟夫·布赫尔的领导下转向经济自由主义和减税政策，旨在争取中产阶级的支持。这一政策使其失去了克恩顿州的基本盘，却未能赢得城市中心的支持。如今，自由党在克恩顿州以及那些希望保留其政策但摒弃其空洞言辞的选民中，仍然保留着一部分支持者。而自由党后来也重新夺回了这部分选民基础。"
 AUS.Neutral_green: "£AUS_non_aligned_greens (GRÜNE) - 绿党 - 绿色替代"
 AUS.Neutral_green_desc: "（环保主义） - 绿党 - 绿色替代\n\n绿党起源于反对茨文滕多夫核电站和海恩堡大坝的运动，于 1986 年由保守的联合绿党和替代名单党合并而成，并于 1993 年更名为现在的名称。他们主张环境保护和气候保护、生态税制改革、人权以及少数群体和移民的权利、坚持中立并积极参与欧洲事务，并且是欧洲绿党的成员。\n\n该党是奥地利政坛的第四大力量，在维也纳、因斯布鲁克和格拉茨等城市受过良好教育的中产阶级以及西部各州拥有强大的影响力，并在这些州曾与其他政党联合执政。该党内部长期存在的争论在于务实派和原教旨主义派之间的冲突。务实派希望执政，而原教旨主义派则将妥协视为背叛。这种争论导致该党失去了整个领导层，有时甚至失去了部分选民。"
 AUS.Nat_Autocracy: "£AUS_nationalist_military_junta (BH) - 奥地利武装部队"
 AUS.Nat_Autocracy_desc: "（军政府） - 奥地利武装部队\n\n德国联邦国防军是永久中立国家的义务兵役制军队，于1955年占领国撤离后重建。根据宪法规定，联邦国防军的职责包括保卫国家、维护民主制度和宪政秩序、在民事当局要求时维护公共秩序以及在灾难中提供援助。联邦国防军从未掌握政治权力，也没有这样做的传统；其军官均为公务员，应征入伍者来自社会各阶层。\n\n作为执政联盟，它将代表奥地利法律未曾预见的紧急政府：以命令取代民意，各部委置于军事监督之下，经济以韧性和动员为导向。制服在危机中将赋予合法性，但联邦国防军规模小、资金不足，其组建目的是为了救灾和维和，而非统治。"
 AUS.Nat_Populism: "£AUS_nationalist_right_wing_populist (FPÖ) - 奥地利自由党"
 AUS.Nat_Populism_desc: "（右翼民粹主义） - 奥地利共产党\n\n自由党成立于1956年，是独立联盟的继承者。独立联盟是战后德国民族主义和民族自由主义阵营以及众多​​前纳粹分子的聚集地。自由党的首任主席安东·莱因塔尔曾在奥地利被德国吞并期间担任部长。自1986年约尔格·海德尔执政以来，自由党成为欧洲右翼民粹主义的典范：敌视移民、伊斯兰教和欧盟，蔑视大联合政府及其庇护，并忠于奥地利作为德意志文化国家的理念。\n\n该党进入二十一世纪时，已成为国民议会第二大党，并与人民党结成联合执政联盟。此后，该党经历了分裂、丑闻缠身的垮台，并在海因茨-克里斯蒂安·斯特拉赫和赫伯特·基克尔的领导下重建。该党从两大政党手中吸引工人阶级和农村选民，但迄今为止，其每次执政都以丑闻和党员叛逃告终。"
 AUS.Monarchist: "£AUS_nationalist_monarchist (HHL) - 哈布斯堡-洛林王室"
 AUS.Monarchist_desc: "（君主主义） - 哈布斯堡-洛林王室\n\n哈布斯堡-洛林王朝由玛丽亚·特蕾莎和洛林的弗朗茨·斯蒂芬于1736年联姻而建立，曾拥有神圣罗马帝国皇位，统治过奥地利帝国和奥匈帝国，于1918年被废黜，其成员被驱逐出共和国，直至放弃王位继承权。奥托·冯·哈布斯堡及其子卡尔接受了共和国，此后，该家族更多地活跃于公共领域，成为欧洲议会议员、泛欧活动家和中欧历史的守护者，而非王位觊觎者。\n\n作为执政派别，它代表着一种复兴，在这种复兴中，合法性源于王朝和延续，而非党派竞争；王室成为国家统一和多瑙河理念的保障，即多民族在一位君主统治下的中欧。其支持者称之为稳定与认同；反对者则称之为共和国建立之初旨在终结的一切的回归。"
 AZE.liberalism: "£AZE_western_liberal (AXCP) - 阿塞拜疆人民阵线党"
 AZE.liberalism_icon: "£AZE_western_liberal"
 AZE.liberalism_desc: "（自由民族主义） - 阿塞拜疆人民阵线党\n\n人民阵线由阿布法兹·埃尔奇贝伊和持不同政见的知识分子于1989年创立，是争取脱离苏联独立的群众运动，并于1992年至1993年执政，直至盖达尔·阿利耶夫发动政变上台；该组织于1995年成为政党。人民阵线主张亲西方的自由民主、市场经济、阿塞拜疆民族主义、与土耳其保持密切联系以及收复卡拉巴赫，属于欧洲保守派和改革派阵营。\n\n埃尔奇贝去世后，该党由阿里·卡里姆利及其改革派主导，而传统派则分裂出去，随后又出现其他派系。但该阵线仍然是政权最顽固的对手，每次选举后都组织街头抗议，并为政治犯发声。该阵线对独立遗产的宣称也正是其反复分裂的根源。"
 AZE.socialism: "£generic_socialism_small (ASDP) - 阿塞拜疆社会繁荣党"
 AZE.socialism_desc: "（社会民主主义） - 阿塞拜疆社会繁荣党\n\n阿塞拜疆社会民主党由阿拉兹·阿里扎德和扎尔杜什特·阿里扎德兄弟于1989年创立。他们是人民阵线左翼的异见人士，希望建立欧洲社会民主主义而非民族阵线。该党是阿塞拜疆唯一的社会党国际成员。它主张建立福利国家、保障工人权利、建立世俗多元共和国、通过谈判与亚美尼亚实现和平，以及奉行在俄罗斯和西方之间保持平衡而非选边站队的外交政策。\n\n该党始终只是巴库一小群知识分子，曾短暂地任命流亡的前总统阿亚兹·穆塔利博夫为联合主席，偶尔也参加某个选区的竞选，它既不属于民族主义反对派，也不属于现政权。其国际影响力使其在海外的地位远超其在国内的支持者。"
 AZE.Neutral_conservatism: "£AZE_non_aligned_conservative (VHP) - 公民团结党"
 AZE.Neutral_conservatism_icon: "£AZE_non_aligned_conservative"
 AZE.Neutral_conservatism_desc: "（民族保守主义） - 公民团结党\n\n公民团结党由诗人萨比尔·鲁斯塔姆汗利于1992年创立。鲁斯塔姆汗利曾是人民阵线成员，是一位广受欢迎的爱国诗人。该党倡导民族团结、阿塞拜疆语言和文化、纳戈尔诺-卡拉巴赫的收复、社会市场经济以及与任何执政党进行建设性合作。该党自诩为建设性反对派，并在几乎所有问题上都与政府保持一致。\n\n该党规模很小，仅凭其议会党团、报纸以及创始人鲁斯塔姆汗利在文化知识分子中的地位就足以构成其全部存在，而它的存在也恰恰证明了议会中存在着除其自身党派之外的其他政党。鲁斯塔姆汗利的个人声望为其保驾护航。"
 AZE.Nat_Autocracy: "£AZE_nationalist_military_junta (ASQ) - 阿塞拜疆武装部队"
 AZE.Nat_Autocracy_icon: "£AZE_nationalist_military_junta"
 AZE.Nat_Autocracy_desc: "（军政府） - 阿塞拜疆武装部队\n\n阿塞拜疆武装部队于1991年重建，继承了苏联时期的驻军和卡拉巴赫战争中的志愿营，但它却是在失败中建立起来的：1994年卡拉巴赫及其周边地区的丧失以及由此导致的停火协议的冻结。这支部队的目标是收复失地，为此，国家利用石油繁荣时期的资源，从土耳其和以色列购买装备，并组建了一支专业的军官队伍。\n\n作为执政集团，军队将以总参谋部的名义代表政府，为国家利益服务，而议会和各政党则被视为动员的障碍；20世纪90年代的政变和兵变就体现了这种模式，阿利耶夫政权的存在部分原因就是为了防止此类事件重演。军官团享有真正的威望，但总统是最高统帅，他确保军队没有自己的政治主张。"
 BAH.conservatism: "£generic_conservatism_small (FNM) - 自由国民运动"
 BAH.conservatism_desc: "（保守主义） - 自由国民运动\n\n自由国民运动是巴哈马政坛主要的中右翼力量，其根基在于拿骚的商人和专业人士阶层。该党通常优先考虑财政纪律、私营企业、问责制政府以及与美国在安全和贸易方面保持密切合作关系，并将自身标榜为反对进步自由党裙带关系的稳健管理政党。\n\n该党在政府中倾向于吸引外资、限制公共部门支出，并支持以旅游业和金融业为主导的基础设施建设。其优势在于新普罗维登斯岛的专业人士和商界人士的选票；其劣势在于习惯于与进步自由党轮流执政，而非建立持久的多数派。"
 BAH.liberalism: "£generic_liberalism_small (PLP) - 进步自由党"
 BAH.liberalism_desc: "（社会自由主义） - 进步自由党\n\n进步自由党是巴哈马黑人多数群体的政党，也是该国主要的中间偏左力量，其立场与巴哈马湾街的商业寡头集团截然相反。该党将社会自由主义与民粹主义的中间偏左经济政策相结合，主张国家在发展中发挥重要作用，巴哈马人拥有经济自主权，并加大对其他岛屿的社会投资。此外，该党在海地移民和离岸金融问题上对美国持更为强硬的态度。\n\n它执政时依靠其数十年来建立的统治机器，依靠工人阶级和外岛居民的选票进行统治。它的弱点在于裙带关系盛行的名声以及过去执政丑闻的阴影。"
 BAH.Nat_Autocracy: "£generic_Nat_Autocracy_small (RBDF) - 巴哈马皇家国防军"
 BAH.Nat_Autocracy_desc: "（军政府） - 巴哈马皇家国防军\n\n巴哈马皇家国防军是一支纯粹的海上力量，约有1600名人员驻扎在珊瑚港，其职责包括巡逻群岛、拦截贩毒船只和海地移民船只、保护渔业以及提供灾害救援。该部队与美国海岸警卫队密切合作，并且没有参与政治干预的传统。\n\n作为统治集团，它将代表由军官组成的紧急政府，以维护秩序和打击毒品和人口走私为名，掌控港口和海岸线，而民事机构则徒有其名。它的弱点在于规模太小，无法在没有警察、公务员和华盛顿的默许下进行有效运作。"
 BAL.Neutral_Autocracy: "£BAL_neutral_autocracy 反巴拉卡"
 BAL.Neutral_Autocracy_desc: ""
 BAN.conservatism: "£generic_conservatism_small (JaPa) - 国家党"
 BAN.conservatism_desc: "（保守主义） - 国家党\n\n国家党是孟加拉国政坛的中右翼第三股力量，以前总统侯赛因·穆罕默德·艾尔沙德为核心，根植于朗布尔周边北部地区。该党以稳定、基础设施建设和温和的穆斯林国家认同为竞选纲领，并将自身定位为两大家族政党之外的务实选择，而非与之竞争。\n\n实际上，该党以小党身份执政，用其席位集团换取部委和选区。自2008年与人民联盟结盟以来，该党在2014年至2024年期间担任官方反对党，同时参与执政，批评者称之为“驯服的反对党”。该党的筹码在于其地方选票基础以及随时准备为执政党凑数。"
 BAN.liberalism: "£generic_liberalism_small (GF) - 人民论坛党"
 BAN.liberalism_desc: "（世俗自由主义） - 人民论坛党\n\n人民论坛党是一个由宪法律师卡迈勒·侯赛因领导的小型自由派政党。它主张世俗民主、法治、司法独立和廉洁政府，并以恢复宪法原有的民主性质为竞选纲领，反对两大政党的庇护政治。\n\n该党的基础是城市专业人士和公民社会选民，其影响力远超其规模：2018年，它召集了全国团结阵线，这一反对派联盟为孟加拉国民族主义党提供了一个无党派的领袖。该党于2021年分裂，并于2024年重新合并。其影响力在于道德权威和法律专长，而非群众组织。"
 BAN.Conservative: "£generic_Conservative_small (AL) - 人民联盟"
 BAN.Conservative_desc: "（孟加拉民族主义） - 人民联盟\n\n人民联盟是解放战争时期谢赫·穆吉布·拉赫曼家族的政党，由其女儿谢赫·哈西娜领导。该党主张孟加拉民族主义、世俗主义和国家主导的发展模式，并声称对独立遗产拥有唯一所有权，反对孟加拉国民族主义党和伊斯兰主义者。\n\n执政期间，该党将大型基础设施项目和出口导向型增长与加强对法院、安全部门和选举进程的控制相结合，并依赖印度作为其主要外国伙伴。其力量源于遍布全国的政党机器和世俗的中产阶级。该党的长期统治于2024年结束，当时一场由学生领导的起义迫使哈西娜下台，其活动于2025年被禁止。"
 BAN.anarchist_communism: "£generic_anarchist_communism_small (BASAD) - 孟加拉社会党"
 BAN.anarchist_communism_desc: "（革命马列主义） - 孟加拉社会党\n\n孟加拉社会党是一个反修正主义的马克思列宁主义政党，它拒绝任何家族政治阵营，并通过罢工、学生运动和街头宣传等方式在议会之外开展活动。该党主张走革命道路实现社会主义，主张关键产业国有化，并结束其所谓的两党对国家的掠夺。\n\n该党由总书记巴兹鲁尔·拉希德·菲罗兹领导，是2018年与孟加拉国共产党共同组建的左翼民主联盟的创始成员之一。该党抵制其认为受到操纵的选举，并支持2024年的起义。2013年的一次分裂产生了与之竞争的马克思主义派别。该党的优势在于其学生阵线和动员服装工人的能力，而非议席。"
 BAN.Caliphate: "£generic_Caliphate_small (JMB) - 孟加拉国圣战者大会"
 BAN.Caliphate_desc: "（萨拉菲圣战主义） - 孟加拉国圣战者大会\n\n孟加拉国圣战者组织是一个被取缔的萨拉菲圣战组织，其根源可追溯至圣训派时期，该组织企图以武力取代共和国，建立伊斯兰教法国家。它拒绝民主，视两大政党为叛教者，并攻击法院、非政府组织、文化活动和世俗作家。\n\n该组织于2005年被取缔，同年便以几乎同时在孟加拉国所有地区发动爆炸袭击的方式宣告复出；其创始人于2007年被处决；其与伊斯兰国结盟的继承派系“新伊斯兰圣战者组织”于2016年在达卡发动了霍利面包店袭击事件。该组织通过从伊斯兰学校边缘招募的小型小组运作，没有群众基础；其影响力在于制造恐惧以及引发安全部门的镇压行动。"
 BAN.Nat_Populism: "£generic_Nat_Populism_small (BNP) - 孟加拉国民族主义党"
 BAN.Nat_Populism_desc: "（孟加拉民族主义） - 孟加拉国民族主义党\n\n孟加拉国民族主义党是该国两党制中的中间偏右政党，由齐亚·拉赫曼创建，现由其遗孀卡莉达·齐亚和儿子塔里克·拉赫曼领导。该党主张孟加拉国民族主义，强调国家的穆斯林身份，反对人民联盟的孟加拉世俗主义、市场经济以及对印度保持警惕、更亲近中国和海湾国家的外交政策。\n\n在执政时期，它与伊斯兰大会党及其他较小的伊斯兰政党合作，例如2001年至2006年的四党联盟；在野时期，它抵制其认为存在舞弊的选举，例如2014年和2024年的选举，并忍受其领导人和干部遭受的起诉。它的影响力在于其遍布全国的组织，以及每当穆斯林联盟越权行事时，它所获得的反联盟选票。"
 BAR.liberalism: "£generic_liberalism_small (DLP) - 民主工党"
 BAR.liberalism_desc: "（社会民主主义）- 民主工党\n\n民主工党是埃罗尔·巴罗及其独立运动的代表政党，名义上属于社会民主共和主义阵营，但实际上比工党两大分支更为传统和民族主义。该党声称其遗产包括免费中学教育和国民保险，并在2008年至2018年执政期间，选择推行财政紧缩和公共部门裁员，而非接受国际货币基金组织的援助计划。\n\n它反对2021年共和国的成立程序，要求举行全民公投；在众议院之外，它一直深陷领导权之争，最终在2024年吸纳了倒戈的拉尔夫·索恩担任领导人。它的影响力在于巴巴多斯农村和传统派选民的支持，以及赢得独立的政党的品牌。"
 BAR.socialism: "£generic_socialism_small (BLP) - 巴巴多斯工党"
 BAR.socialism_desc: "（社会民主主义）- 巴巴多斯工党\n\n巴巴多斯工党是格兰特利·亚当斯和劳工运动的政党，属于社会民主主义政党，带有贸易自由主义倾向，主张通过商业而非国家扩张实现增长。在欧文·阿瑟的领导下，该党是加勒比共同体单一市场和经济的缔造者；在米娅·莫特利的领导下，该党带领巴巴多斯加入国际货币基金组织项目，在2021年未经全民公投的情况下使该国成为共和国，并领导了布里奇顿气候融资倡议。\n\n该党在议会中拥有绝对主导地位，并在加勒比共同体内部拥有强大的话语权。其影响力源于巴巴多斯工人联盟（该联盟总书记是其议员之一）以及将其视为天然执政党的专业人士基础。"
 BAR.Nat_Autocracy: "£generic_Nat_Autocracy_small (BDF) - 巴巴多斯国防军"
 BAR.Nat_Autocracy_desc: "（军政府）- 巴巴多斯国防军\n\n巴巴多斯国防军是一支规模较小的专业军队，约有六百名人员，由巴巴多斯军团、巴巴多斯海岸警卫队和少年军校组成。其职责包括领土防御、协助警方、缉毒、搜救以及在东加勒比地区开展灾害救援，并负责区域安全系统总部的设立和大部分资金筹措。该部队没有参与政治干预的传统。\n\n作为统治集团，它将代表由军官组成的紧急政府，以维护秩序和打击毒品犯罪为名，掌控港口和沿海地区。其弱点在于规模太小，无法脱离警察、公务员队伍和加勒比共同体邻国的配合进行有效治理。"
 BEL.conservatism: "£BEL_western_conservative (CVP) - 基督教人民党"
 BEL.conservatism_desc: "（基督教民主主义）- 基督教人民党\n\n基督教人民党是弗拉芒基督教民主党，也是天主教支柱的政治力量，其力量源自基督教工会、农民联盟和小企业联合会。该党主张社会市场经济、家庭、辅助性原则和共识政治，并将比利时国家视为需要通过谈判进行改革而非瓦解的对象。\n\n它坚定地支持欧洲一体化和大西洋主义，认为欧盟和北约是小型贸易国的天然框架。它的优势在于其长期的执政经验、基督教社会组织网络以及其作为弗拉芒语区和法语区利益之间斡旋者的角色。"
 BEL.liberalism: "£BEL_western_liberal (VLD) - 佛兰芒自由民主党"
 BEL.liberalism_icon: "£BEL_western_liberal"
 BEL.liberalism_desc: "（自由主义）- 佛兰芒自由民主党\n\n弗拉芒自由民主党是弗兰德斯地区的市场自由主义政党，主张降低税收、缩小政府规模并提高政府透明度、实行直接民主，并在安乐死和同性婚姻等问题上采取符合伦理进步的立场。该党自诩为基督教之外的现代选择，其成员构成也超越了传统的自由主义家庭。\n\n它强烈支持欧洲一体化和大西洋主义，认为更深层次的融合是解决比利时国力不足的根本之道。它的影响力源于弗兰德斯地区的商业和专业阶层，源于它愿意领导跨越语言边界的联盟，以及它与法语区自由派人士的紧密合作。"
 BEL.socialism: "£BEL_western_social_democrat (PS) - 社会党"
 BEL.socialism_icon: "£BEL_western_social_democrat"
 BEL.socialism_desc: "（社会民主主义）- 社会党\n\n社会党是瓦隆尼亚和法语区左翼的主导政党，其根基在于社会主义工会、互助医疗基金和公共部门。该党主张建立强大的福利国家、公共投资、工资指数化和再分配，并捍卫将资金从弗拉芒输送到瓦隆尼亚的联邦团结机制，反对弗拉芒方面提出的任何进一步权力下放的要求。\n\n它秉持社会民主主义的亲欧立场，支持北约，但对以牺牲社会预算为代价的国防开支持谨慎态度。它的影响力主要来自瓦隆大区政府、工业带的市政机构以及其工会基础。"
 BEL.Neutral_Libertarian: "£BEL_non_aligned_libertarian (LDD) - 荷语人口常识党"
 BEL.Neutral_Libertarian_icon: "£BEL_non_aligned_libertarian"
 BEL.Neutral_Libertarian_desc: "（自由意志保守主义）- 荷语人口常识党\n\n荷语人口常识党由柔道教练兼参议员让-马里·德德克尔于2007年创立。此前，他被弗拉芒自由党开除，该党旨在为主流共识政党提供一个直言不讳的右翼自由主义替代方案。荷语人口常识党主张实行单一税率、缩小政府规模、实行具有约束力的全民公投、制定更严格的移民政策以及赋予弗拉芒更大的自治权，并将政治正确和“隔离区”视为封闭体制的体现。\n\n它是欧洲怀疑论者和大西洋主义者，反对进一步转移到布鲁塞尔。它的影响力在于德德克尔在沿海地区以及幻灭的自由派和民族主义选民中的个人追随者，以及它从既定右翼中吸引抗议选票的能力。"
 BEL.Neutral_green: "£BEL_non_aligned_greens (Ecolo) - 生态党"
 BEL.Neutral_green_icon: "£BEL_non_aligned_greens"
 BEL.Neutral_green_desc: "（环保主义）- 生态党\n\n生态党是瓦隆尼亚和布鲁塞尔法语区的绿党，由一男一女共同担任主席，并与弗拉芒语区的姊妹党绿党组成联合议会党团。该党主张逐步淘汰核能、发展公共交通、将税收从劳动税转向污染税和财富税、推行参与式民主和开放的移民政策，并在能够赢得环境事务部长职位时加入联合政府。\n\n它秉持亲欧和和平主义立场，主张多边外交而非国防开支。其影响力源于布鲁塞尔和瓦隆布拉班特的城市居民和受过良好教育的选民，以及在气候运动中的支持，并得益于其在中左翼多数派选举中扮演的“造王者”角色。"
 BEL.Nat_Autocracy: "£BEL_nationalist_military_junta (BAF) - 比利时武装部队"
 BEL.Nat_Autocracy_icon: "£BEL_nationalist_military_junta"
 BEL.Nat_Autocracy_desc: "（军政府）- 比利时武装部队\n\n比利时武装部队是一支规模较小的专业军队，约有2.6万名官兵，下辖陆军、空军、海军和医疗部队，隶属于同一国防参谋部。其职责包括北约框架内的集体防御、参与盟军海外行动、执行空中警戒任务、与荷兰联合指挥开展扫雷行动以及为民事当局提供支持。比利时是北约总部及其欧洲司令部的所在地，并参与核共享。\n\n作为执政联盟，这些力量将主张由军官团领导的紧急政府，结束以维护秩序和履行联盟义务为名而导致的联合政府组建瘫痪。他们的弱点在于长期资金不足，以及脱离各地区就无法有效运作的国家体制。"
 BEL.Nat_Fascism: "£generic_Nat_Fascism_small (Nation) - 民族党"
 BEL.Nat_Fascism_desc: "（革命民族主义）- 民族党\n\n“民族”运动是由埃尔韦·范·莱特姆从法语区极右翼的激进边缘群体中创立的革命民族主义和团结主义运动。它宣扬比利时血统与土地的民族主义，主张建立反对自由资本主义和马克思主义的社团主义经济，倡导移民回流，捍卫欧洲身份认同，抵制伊斯兰教和美国文化。该运动还吸纳了弗拉芒团结主义团体，在语言边界两侧开展活动。\n\n它推举候选人以提高知名度，并通过街头活动、纪念活动以及与更广泛的欧洲民族主义阵营的联系进行组织。它的影响力在于一小群激进分子，而不是选票。"
 BEL.Nat_Populism: "£BEL_nationalist_right_wing_populist (VB) - 弗拉芒集团"
 BEL.Nat_Populism_icon: "£BEL_nationalist_right_wing_populist"
 BEL.Nat_Populism_desc: "（弗拉芒民族主义）- 弗拉芒集团\n\n弗拉芒集团是一个激进的弗拉芒民族主义政党，其主张弗兰德斯独立、非欧洲移民返回家园，并对犯罪和伊斯兰教采取强硬立场。该党视比利时政府和法语区政党为弗拉芒资源的掠夺者。所有其他政党都同意设立“隔离区”，将弗拉芒联盟排除在历届政府之外。弗拉芒联盟则将此视为当权者惧怕选民的证据。\n\n它持疑欧立场，对多边机构抱有怀疑态度。它的影响力在于安特卫普和弗兰德斯的工人阶级郊区，在于其严密的组织以及其为主流右翼设定移民议程的能力。"
 BEL.Monarchist: "£BEL_nationalist_monarchist (HOB) - 比利时王室"
 BEL.Monarchist_icon: "£BEL_nationalist_monarchist"
 BEL.Monarchist_desc: "（立宪君主主义）- 比利时王室\n\n比利时王室，即萨克森-科堡-哥达王朝的比利时分支，统治着一个联邦君主立宪制国家，在这个国家里，每一项王室法令都需要大臣的副署。国王的真正权力在于其在组阁中的作用，他任命信息官和组阁官，负责跨越语言边界组建联合政府；此外，国王作为唯一一个既不属于弗兰德斯也不属于瓦隆尼亚的机构，也拥有独特的地位。\n\n作为执政派别，它将代表王室维护比利时统一，抵御各地区的拉拢，其权力源自王室而非各党派。支持者称其为“最后的比利时人”；弗兰德斯的反对者则称其为自治的绊脚石。"
 BEN.liberalism: "£generic_liberalism_small (RB) - 贝宁复兴党"
 BEN.liberalism_desc: "（自由主义）- 贝宁复兴党\n\n贝宁复兴党是索格洛家族的自由主义政党，由前总统尼塞福尔·索格洛及其妻子罗西娜·维埃拉·索格洛创立，总部位于科托努，该家族长期把持科托努市长一职。该党主张市场主导型增长、结构调整和强有力的行政机构，并将克雷库时代的国家主义视为亟待解决的问题。\n\n它以南方城市中产阶级的旗手自居，并加入反对马蒂厄·凯雷库和博尼·亚伊的主要反对派联盟。围绕索格洛继承人的内部纷争削弱了它的力量，其大部分机构后来被并入进步联盟。它的影响力主要体现在索格洛的名号和科托努市政厅的地位上。"
 BEN.socialism: "£generic_socialism_small (FARD-Alafia) - 复兴与发展行动阵线"
 BEN.socialism_desc: "（社会民主主义）- 复兴与发展行动阵线\n\n复兴与发展行动阵线是前马克思主义军事统治者、现任总统马蒂厄·凯雷库的议会政治工具，他通过选举重返政坛。该党名义上是社会民主党，实则作为总统运动的核心力量，聚集了北方各界名流和前单一政党干部，支持凯雷库融合和解、虔诚和务实经济政策的理念。\n\n在政府层面，该党倾向于与法国和捐助国保持稳定关系，推行国际货币基金组织指导下的改革，并通过国家权力进行庇护。它与社会民主党一起，在“未来贝宁联盟”内参与选举。其影响力主要体现在总统职位本身以及北部地区的选票上；一旦失去克雷库，该党就会被边缘化。"
 BEN.neutral_Social: "£generic_neutral_Social_small (PSD) - 社会民主党"
 BEN.neutral_Social_desc: "（社会民主主义）- 社会民主党\n\n社会民主党是布鲁诺·阿穆苏的政党，他是来自莫诺省和库福省的长期担任部长和议会策略师。该党主张社会市场经济、权力下放和与捐助国合作，并声称继承了社会党国际的传统。\n\n它与其说是一个群众运动，不如说是一个专业的联盟伙伴：它先是在马蒂厄·凯雷库的总统多数派中效力，然后成为“团结建国联盟”反对派联盟对抗博尼·亚伊的核心力量，最终为进步联盟提供领导层，并被该联盟吸收。它的影响力在于阿穆苏的谈判技巧、其西南地区的根基以及其作为联盟构建者的可靠性。"
 BEN.Neutral_green: "£generic_Neutral_green_small (Les Verts) - 贝宁绿党"
 BEN.Neutral_green_desc: "（环保主义）- 贝宁绿党\n\n贝宁绿党是一个小型生态主义政党，由图桑·欣维领导，隶属于非洲绿党联盟和全球绿党。他们的竞选活动关注海岸侵蚀、森林砍伐、科托努泻湖污染等问题，并认为贝宁的发展应该以小农农业、可再生能源和保护彭贾里和W保护区为基础。\n\n该党仅有数百名党员，没有民选官员，依靠联盟维持运作，例如以联合名单的形式参选，如“星盟”，并授权独立候选人使用其党名。其影响力在于其国际网络以及一套环境议程 - 这套议程并非反对，而是被其他大党借鉴。"
 BEN.Nat_Autocracy: "£generic_Nat_Autocracy_small (FAB) - 贝宁武装部队"
 BEN.Nat_Autocracy_desc: "（军政府）- 贝宁武装部队\n\n贝宁武装部队由陆军、海军、空军和共和国卫队组成。共和国卫队是一支规模较小的专业部队，其军官团曾一度掌控国家政权，但此后一直保持政治中立。作为一个执政集团，它代表着由军官组成的委员会的统治，其理由是来自布基纳法索和尼日尔的圣战威胁蔓延至北部公园。\n\n实际上，这意味着优先发展北部战线，扩大内部安全权力，继续与法国、美国和西非国家经济共同体（西非经共体）邻国合作，以及通过法令进行统治。其影响力在于对武力的垄断，但一支忠诚的共和国卫队使得任何政变都成为一场赌博。"
