 CZE_social_committee: "사회 위원회"
 CZE_social_committee_desc: "사회·경제 문제를 다루는 EU 기구 가운데 하나입니다. 다른 EU 기구에 자문을 제공하는 것도 그 기능 중 하나입니다. 공산주의자들의 영향력이 충분히 미치면 유럽 연합의 결정에 뜻밖의 변화를 가져올 수 있습니다."
 CZE_social_committee_idea: "§RKSČM§! - 사회 위원회"
 CZE_642_name: "흐라데츠크랄로베 주"
 CZE_a_soldier_and_a_politician_warning_TT: "§R페트르 파벨이 더 이상 [CZE.GetName]와(과) 뜻을 같이하지 않게 되면 이 가지 전체가 사라집니다§!"
 CZE_prague_castle_renovation_decisions: "프라하성 개보수"
 CZE_prague_castle_renovation_decisions_desc: "프라하성은 체코 공화국 대통령의 공식 관저입니다. 세계에서 가장 큰 성 가운데 하나이자 우리나라의 상징입니다. 이 성은 현재의 세계 기준에 맞게 현대화되었으나, 이제 다시 한번 개보수하여 우리의 새 국왕에 걸맞은 장소로 만들 때가 되었습니다."
 CZE_first_renovation: "대통령 집무실 교체"
 CZE_second_renovation: "왕실 거처 준비"
 CZE_third_renovation: "대강당 확장"
 CZE_last_renovation: "방 준비"
 CZE_SLO_monarchy_reunite: "슬로바키아와의 재통합"
 CZE_SLO_monarchy_reunite_desc: "머지않은 과거에 우리는 하나의 나라였습니다. 이제 국왕 카를 폰 합스부르크는 몇 년 안에 재통일을 이루기 위해 슬로바키아와 몇 가지 공동 정책을 시행하고자 합니다."
