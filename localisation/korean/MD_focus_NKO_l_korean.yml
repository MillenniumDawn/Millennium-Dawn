 NKO_cease_propaganda_broadcasts_yo_jong: "선전 방송 중단"
 NKO_cease_propaganda_broadcasts_yo_jong_desc: ""
 NKO_conciliatory_rhetoric: "화해적 수사"
 NKO_conciliatory_rhetoric_desc: "외국은 너무 오랫동안 우리를 오해해 왔으며, 우리의 개방 정책은 그들에게 우리의 친평화적 입장을 납득시킬 수 있습니다."
 NKO_offer_negotiations_yo_jong: "협상 제안"
 NKO_offer_negotiations_yo_jong_desc: ""
 NKO_propose_north_led_unification_yo_jong: "통일 정부 제안"
 NKO_propose_north_led_unification_yo_jong_desc: "The leaders of the South are unlikely to agree to a deal that would see them removed from power and potentially punished for their past actions. A unity government between North and South is the best way to pursue the cause of Korean reunification."
 NKO_propose_unity_government_yo_jong: "북한 주도의 통일 제안"
 NKO_propose_unity_government_yo_jong_desc: "우리의 공정한 복지 체계부터 더 강력한 핵무기에 이르기까지, 공화국 모델이 조선반도가 나아갈 길임은 명백합니다. 우리는 강력한 통일 이후의 미래를 향해 조선을 이끌어갈 주체가 바로 우리여야 한다고 강력히 주장해야 합니다."
 NKO_pave_the_way_for_reunification_yo_jong: "통일을 향한 길"
 NKO_pave_the_way_for_reunification_yo_jong_desc: "북남 관계 정상화를 향한 큰 진전이 이루어졌으므로, 이제 통일을 위한 준비를 시작할 수 있습니다."
 NKO_strong_prosperous_nation: "강성대국"
