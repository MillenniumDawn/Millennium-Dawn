 civil_war_bosnia: "Guerra Civil da Bósnia Ativa"
 BOS_EUFOR: "EUFOR"
 BOS_EUFOR_desc:0 "A Força da União Europeia na Bósnia e Herzegovina é uma missão de paz liderada pela UE na Bósnia e Herzegovina que sucedeu a SFOR, voltada a manter a paz e a estabilidade, apoiar as autoridades locais e implementar os Acordos de Dayton, que encerraram a Guerra da Bósnia."
 BOS_SFOR: "SFOR"
 BOS_SFOR_desc:0 "A Força de Estabilização na Bósnia e Herzegovina é uma força multinacional de paz liderada pela OTAN.\n§W---------------§!\n Após a Guerra da Bósnia, parceiros internacionais, incluindo o Banco Mundial, a União Europeia, o Programa das Nações Unidas para o Desenvolvimento e a USAID, financiaram a reconstrução da Bósnia. Seus programas reconstruíram a infraestrutura, fortaleceram a governança e os serviços públicos e apoiaram a recuperação econômica."
 BOS_attack_upon_nato: "Ataque à OTAN"
 BOS_bosniak_balkan_aspiration: "Aspirações dos Balcãs Bósnios"
 BOS_srpska_balkan_aspiration: "Aspirações dos Balcãs Sérvios"
 BOS_croat_balkan_aspiration: "Aspirações dos Balcãs Croatas"
 BOS_post_yugoslav_war_state: "Estado Pós-Guerra da Iugoslávia"
 BOS_post_yugoslav_war_state_desc:0 "Bosnia is one of four republics that managed to declare independence during the Yugoslav wars of the 1990s. Of the four, it experienced the most horrors, with thousands of refugees fleeing the country. Vast areas of land are tainted by landmines and unexploded ordnance. Many of its former citizens now live abroad. These events gave the United Nations a new, unflattering reputation as an organization unable or unwilling to protect those in danger."
 BOS_police_high: "High Police Budget"
 BOS_grant_more_rights_to_serbian_peoples: "Protect Serbian Rights"
