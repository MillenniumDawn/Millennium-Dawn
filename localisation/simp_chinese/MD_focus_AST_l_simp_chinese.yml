 ast_international_missions: "国际任务"
 ast_international_missions_desc: "我们的理念体现了一种灵活性，即在尊重原有机遇的同时，探索我们认为富有成效的新机遇。澳大利亚正站在一个辉煌未来的门槛上。我们只需要再推一把。"
 aus_us_visit: "对美国进行国事访问"
