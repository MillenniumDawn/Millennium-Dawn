 TAI_pc_industry_events.11.t: "Acer Reaches for Gateway"
 TAI_pc_industry_events.11.d: "Acer's agreement to acquire Gateway promises immediate scale in North America and Europe, including Packard Bell, but integration will add cost to an already thin-margin business. Taiwan can back the acquisition, favor organic brand growth, or impose profitability discipline."
 TAI_pc_industry_events.11.a: "Finance the Gateway acquisition"
 TAI_pc_industry_events.11.a_tt: "Treasury: §R-$6.00 billion§!\nGlobal Brand Reach: §G+1§!\nSystems Breadth: §G+1§!."
 TAI_pc_industry_events.11.b: "Grow the Acer brand organically"
 TAI_pc_industry_events.11.b_tt: "Treasury: §R-$4.00 billion§!\nGlobal Brand Reach: §G+2§!\nSystems Breadth: §G+1§!."
 TAI_pc_industry_events.11.c: "Prioritize profitable markets"
 TAI_pc_industry_events.11.c_tt: "Global Brand Reach: §G+1§!\nSystems Breadth: §G+1§!."
 TAI_pc_industry_events.12.t: "ASUS Separates Brand from Manufacturing"
 TAI_pc_industry_events.12.d: "ASUS will divide its branded computer business from the contract-manufacturing operations that serve other customers. A clean separation can protect design and brand control, continued integration can preserve operational breadth, or ASUS can retreat toward components and OEM platforms."
 TAI_pc_industry_events.12.a: "Separate manufacturing and retain design control"
 TAI_pc_industry_events.12.a_tt: "Component Depth: §G+1§!\nGlobal Brand Reach: §G+1§!."
 TAI_pc_industry_events.12.b: "Preserve vertical integration"
 TAI_pc_industry_events.12.b_tt: "Treasury: §R-$5.00 billion§!\nComponent Depth: §G+1§!\nSystems Breadth: §G+2§!."
 TAI_pc_industry_events.12.c: "Retreat to components and OEM platforms"
 TAI_pc_industry_events.12.c_tt: "Component Depth: §G+2§!\nGlobal Brand Reach: §R-1§!."
 TAI_pc_industry_events.13.t: "VIA Nano and the Third x86 Question"
 TAI_pc_industry_events.13.d: "The Nano architecture gives VIA a new out-of-order x86 core, but translating a processor into a durable platform requires software support, board partners, capital, and years of credible road maps. VIA can defend a focused niche, attempt a costly third ecosystem if earlier foundations exist, or monetize its intellectual property through licensing."
 TAI_pc_industry_events.13.a: "Focus Nano on efficient platforms"
 TAI_pc_industry_events.13.a_tt: "Platform Independence: §G+1§!\nSystems Breadth: §G+1§!."
 TAI_pc_industry_events.13.b: "Build a third x86 ecosystem"
 TAI_pc_industry_events.13.b_tt: "Requires VIA's earlier x86 confrontation, cross-license settlement, a C7 or broad-CPU route, and at least §Y6 Platform Independence§!.\nTreasury: §R-$8.00 billion§!\nPolitical Power: §R-25§!\nComponent Depth: §G+1§!\nPlatform Independence: §G+3§!\nSystems Breadth: §G+1§!."
 TAI_pc_industry_events.13.c: "License VIA's processor intellectual property"
 TAI_pc_industry_events.13.c_tt: "Component Depth: §G+1§!\nGlobal Brand Reach: §G+1§!\nPlatform Independence: §R-2§!."
 TAI_pc_industry_events.14.t: "Acer Confronts the Margin Squeeze"
 TAI_pc_industry_events.14.d: "After years of acquisition-led growth, Acer has warned that performance will fall short and its leadership is changing. The company can reset around sustainable margins, defend market share through another costly push, or rebuild around premium systems."
 TAI_pc_industry_events.14.a: "Reset the business around sustainable margins"
 TAI_pc_industry_events.14.a_tt: "Global Brand Reach: §R-1§!\nStability: §G+1.00%§!."
 TAI_pc_industry_events.14.b: "Defend market share at all costs"
 TAI_pc_industry_events.14.b_tt: "Treasury: §R-$6.00 billion§!\nGlobal Brand Reach: §G+1§!\nSystems Breadth: §G+1§!."
 TAI_pc_industry_events.14.c: "Rebuild around premium systems"
 TAI_pc_industry_events.14.c_tt: "Treasury: §R-$4.00 billion§!\nGlobal Brand Reach: §G+1§!\nSystems Breadth: §G+2§!."
 TAI_pc_industry_events.15.t: "Taiwan's PC Ecosystem Assessed"
 TAI_pc_industry_events.15.d: "More than a decade of restructuring has left Taiwan with world-class board makers, international PC brands, specialized gaming firms, and VIA's contested processor ambitions. This assessment records how coherently those capabilities now reinforce one another."
 TAI_pc_industry_events.15.a: "Take stock of the national ecosystem"
 TAI_pc_industry_events.15.a_tt: "Resolve exactly one national outcome in priority order:\n§YFull-Spectrum Computing Ecosystem§! requires all four capabilities at §Y8§! or higher; VIA's third x86 ecosystem; independent Gigabyte systems; an ASUS separation or integration route; an MSI consumer or professional route; and an Acer margin or premium reset.\n§YBranded Systems Powerhouse§! requires Global Brand Reach §Y9§!, Systems Breadth §Y8§!, Acer profitability discipline, the ASUS brand/OEM separation, an MSI consumer or professional route, and an Acer margin or premium reset.\n§YGlobal Component Commonwealth§! requires Component Depth §Y9§!; independent Gigabyte components plus a later independent route; ASUS component leadership plus a later separation or retreat; MSI component specialization plus a later systems route; and a focused or licensed VIA Nano route.\nOtherwise, gain §YFragmented Margin Squeeze§!."
