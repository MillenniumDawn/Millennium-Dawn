 nsb_gun_technology_6: "Systèmes d'armes lourdes et d'artillerie de 6e génération"
 nsb_gun_technology_6_desc: "Puissants systèmes d'artillerie et de roquettes conçus pour renforcer la puissance de feu du champ de bataille. Cette avancée introduit obusiers lourds, armement de roquettes à grande échelle et munitions d'artillerie spécialisées. Elle permet aussi le déploiement de pods de roquettes, offrant aux plates-formes aériennes un potentiel de frappe accru. Ces systèmes offrent un soutien supérieur à longue portée, essentiels pour dominer le champ de bataille."
 nsb_artillery_ammo_6: "Munitions d'artillerie de 5e génération"
 nsb_artillery_ammo_6_desc: "Munitions spécialisées conçues pour les armes de gros calibre telles qu'obusiers, canons de campagne et artillerie automotrice. Elles se déclinent en divers types, chacun adapté à des rôles : obus explosifs pour l'impact destructeur, obus perforants pour les cibles fortifiées, et obus fumigènes ou d'éclairage pour le soutien tactique."
 nsb_special_ammo_4: "Integrated Ordnance Modernization"
 nsb_special_ammo_4_desc: "Intégration à grande échelle d'ogives adaptatives de nouvelle génération, de munitions modulaires et de systèmes explosifs à fort impact."
 nsb_special_ammo_5: "Modernisation des munitions de 5e génération"
 nsb_special_ammo_5_desc: "Intégration à grande échelle d'ogives adaptatives de nouvelle génération, de munitions modulaires et de systèmes explosifs à fort impact."
 nsb_fire_modes_4: "Doctrine d'appui-feu supérieure II"
