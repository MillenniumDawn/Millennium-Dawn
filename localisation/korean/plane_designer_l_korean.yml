 large_transport: "중수송기"
 avionics_manned_1: "1세대 항공 전자 공학"
 avionics_manned_1_desc: "1세대 항공계기. 자이로스코프와 다이얼로 이루어져있으며, 조종사가 직접 방향을 계산해야될 뿐만 아니라 계기판 또한 조작해야합니다.\n\n§G설계 힌트: 항공 전자 공학은 항공기의 기반과 같습니다. 이를 통해 항공기 대부분의 성능을 전반적으로 향상시킬 수 있습니다. 그러나 성능의 향상에 따라 더 많은 자원과 비용이 필요할 것입니다.§!"
 avionics_manned_2: "2세대 항공 전자 공학"
 avionics_manned_2_desc: "항속, 고도, 공격각, 나침반 방향 등 항공기의 전방을 바라보고 있는 경우 상황 판단 능력을 향상시켜주는 필수 정보를 제공합니다.\n\n§G설계 힌트: 항공 전자 공학은 항공기의 기반과 같습니다. 이를 통해 항공기 대부분의 성능을 전반적으로 향상시킬 수 있습니다. 그러나 성능의 향상에 따라 더 많은 자원과 비용이 필요합니다.§!"
 avionics_manned_3: "3세대 항공 전자 공학"
 avionics_manned_3_desc: "현대 전자 장비 덕분에 조종사는 계기판과 MFD를 맞춤 설정하여 어떤 비행 및 진단 정보를 어디에 표시할지 직접 정할 수 있습니다.\n\n§G설계 힌트: 항전 장비는 항공기의 기반을 형성합니다. 자원 비용이 증가하는 대신 대부분의 항공기 능력치가 전반적으로 상승합니다§!"
 avionics_manned_4: "4세대 항공 전자 공학"
 avionics_manned_4_desc: "조종사에게 필요한 모든 정보가 헬멧 내부의 HUD에 투영되어 시선이 향하는 곳을 따라갑니다. 또한 카메라와 센서 체계는 조종사가 기체를 '투과해서' 볼 수 있게 하여, 전투 공간에 대한 전례 없는 상황 인식을 제공합니다.\n\n§G설계 힌트: 항전 장비는 항공기의 기반을 형성합니다. 자원 비용이 증가하는 대신 대부분의 항공기 능력치가 전반적으로 상승합니다§!"
 avionics_drone_1: "1세대 드론 시스템"
 avionics_drone_1_desc: "The first generation of drone technology allowed aircraft to fly without needing a pilot inside the aircraft, allowing the exploration of new combat capabilities from the air.\n\n§GDesigner Hint: Drone systems allow players to design aircraft that have reduced manpower costs, but will also take a hit to their air combat stats and air defense stats. Use these to have aircraft for flying missions where you expect losses, and want to reduce manpower and equipment losses.§!\n\n§WUsing this as the primary weapon will create a§! §BDrone/Transport Aircraft§!"
 avionics_drone_2: "2세대 드론 시스템"
 avionics_drone_2_desc: "2세대 드론은 더 긴 항속 거리와 더 나은 통신 능력을 갖추었으며 재밍하거나 격추하기가 더 어렵습니다. 이 드론은 장거리 및 장시간 체공을 위한 것으로, 조종석에 조종사가 없이도 지역을 폭넓게 정찰할 수 있습니다.\n\n§G설계 힌트: 드론 체계를 사용하면 인력 비용이 감소한 항공기를 설계할 수 있지만 공중전 및 방공 능력치가 하락합니다. 손실이 예상되는 임무에 항공기를 투입하면서 인력과 장비 손실을 줄이고자 할 때 사용하십시오.§!\n\n§W이를 주무장으로 사용하면 다음이 만들어집니다:§! §B드론/수송기§!"
 avionics_drone_3: "3세대 드론 시스템"
 avionics_drone_3_desc: "드론이 무장을 갖추게 되면서, 이 항공기는 주로 정밀 타격과 근접 항공 지원이 가능하며 기체를 희생하는 대신 정밀 타격을 가하는 자폭 드론으로도 사용할 수 있습니다.\n\n§B설계 힌트: 드론 체계를 사용하면 IC와 인력 비용이 모두 감소한 항공기를 설계할 수 있지만 공중전 및 방공 능력치가 하락합니다. 어느 정도의 공중전 및 타격 능력을 갖추되 기본 소형 항공기만큼은 성능이 나오지 않는 저렴한 항공기를 생산하고자 할 때 사용하십시오.§!\n\n§W이를 주무장으로 사용하면 다음이 만들어집니다:§! §B드론/수송기§!"
 avionics_drone_4: "4세대 드론 시스템"
 avionics_drone_4_desc: "유인 항공기처럼 모든 임무를 수행할 수 있는 현대식 공중전 드론입니다. 이 세대의 드론은 찰나의 독립적 판단이 가능하도록 대폭 개량되었으며, 이는 현대 전투 공간에서의 전투에 필수적입니다.\n\n§B설계 힌트: 드론 체계를 사용하면 IC와 인력 비용이 모두 감소한 항공기를 설계할 수 있지만 공중전 및 방공 능력치가 하락합니다. 괜찮은 공중전 및 타격 능력을 갖추되 피해에 취약한 저렴한 항공기를 생산하고자 할 때 사용하십시오.§!\n\n§W이를 주무장으로 사용하면 다음이 만들어집니다:§! §B드론/수송기§!"
 wing_delta: "삼각익 (델타익)"
 wing_delta_desc: "A solid, standard wingform design, meant to make aircraft more maneuverable.\n\n§BDesigner Hint: Wingforms provide stat adjustments to aircraft, in exchange for IC cost.§!\n\n§GThis wingform will provide a mild increase to speed and radar advantage, while also providing a moderate increase to air defense, creating a slightly more survivable aircraft without the heavy IC increase of investing into stealth technology.§!"
 wing_diamond: "다이아몬드 형"
 wing_diamond_desc: "An experimental wingform variant of the delta wing, trading the maneuverability of the delta wing for greater speed and better stealth characteristics.\n\n§BDesigner Hint: Wingforms provide stat adjustments to aircraft, in exchange for IC cost.§!\n\n§GThis wingform will provide moderate increases to radar advantage and speed, and a mild increase to air defense. If paired with additional stealth technologies, this will create a solid stealth fighter that will be very hard to hit and kill in air combat.§!"
 wing_flyingwing: "전익 (Flying Wing) "
 wing_flyingwing_desc: "Endurance is the name of the game. This wingform is designed to maximize both range and speed, perfect for aircraft that need to cover a large distance quickly.\n\n§BDesigner Hint: Wingforms provide stat adjustments to aircraft, in exchange for IC cost.§!\n\n§GThis wingform provides a significant increase to range, alongside moderate radar advantage and speed upgrades, but comes with a heavy IC cost, and a reduction to air defense. This wingform is recommended for larger nations who want to produce long-range aircraft.§!"
 wing_fwdswept: "Forward Swept Wing"
 wing_fwdswept_desc: "Sacrificing range and speed for even greater maneuverability, this wingform is designed for close in dogfighters and aircraft meant to close with and kill enemy airplanes in close in fighting.\n\n§BDesigner Hint: Wingforms provide stat adjustments to aircraft, in exchange for IC cost.§!\n\n§GThis wingform provides a significant increase to air defense and air attack stats, at the cost of radar advantage and flight range, and an increased IC cost. Use this if you want to have a higher damage output alongside an increased survivability, and are willing to let aircraft be hit more often to do so.§!"
 wing_straight: "직선익 (Straight)"
 wing_straight_desc: "The classic; this wing style puts you in the air and keeps you there. Additionally, it allows for easy placement of large amounts of ordnance on the wings, but at the cost of maneuverability when compared to other wingforms.\n\n§BDesigner Hint: Wingforms provide stat adjustments to aircraft, in exchange for IC cost.§!\n\n§GThis wingform will provide moderate buffs to air defense and ground attack, at the cost of radar advantage and speed. This wingform also comes with a reduced IC cost to produce. Recommended for nations building CAS or strike fighters on a budget.§!"
 wing_swept: "후퇴익 (Swept)"
 wing_swept_desc: "Swept wing aircraft are just straight wings that are more maneuverable, are faster, and can fly farther, but design costs drive up the price to produce these types of airframe.\n\n§BDesigner Hint: Wingforms provide stat adjustments to aircraft, in exchange for IC cost.§!\n\n§GThis wingform is the basic wingform for aircraft. It provides moderate buffs to speed, and mild buffs to air defense and flight range, with no IC cost adjustment. Recommended for building on a budget, or for aircraft meant to fill a wide range of roles.§!"
 wing_variable: "가변익 (Variable)"
 wing_variable_desc: "Variable wing airframes take the best of both worlds from swept wing and straight wing aircraft, but at a cost: they become more expensive to build, more difficult to maintain, and require more training time and skill to fly.\n\n§BDesigner Hint: Wingforms provide stat adjustments to aircraft, in exchange for IC cost.§!\n\n§GThis wingform provides moderate buffs to speed and air defense, alongside a minor buff to ground attack, at the cost of decreased reliability and increased IC cost. Recommended if you want a faster ground attack aircraft.§!"
 wing_blended: "혼합형"
 wing_blended_desc: "차세대 항공기 설계입니다. 이 날개 형태는 스텔스 및 생존성을 극대화하도록 설계되어 공중전을 현대 및 근미래 시대로 이끕니다.\n\n§B설계자 힌트: 날개 형태는 IC 비용을 대가로 항공기에 능력치 조정을 제공합니다.§!\n\n§G이 날개 형태는 속도, 공중 방어, 항속거리에 대한 적절한 버프와 함께 상당한 레이더 우위 버프를 제공하지만, 높은 IC 증가와 대지 공격 능력 감소를 동반합니다. 다목적 전투기 및 공중우세기를 중심으로 고도로 발전된 공군을 생산하고자 하는 대규모 산업 기반을 갖춘 국가에 권장됩니다.§!"
 spec_mad_1: "소노부이 (Sonobuoy)"
 spec_mad_1_desc: "항공기에서 투하하는 소나 체계로, 대잠 승무원이 적 잠수함을 더 효과적으로 탐색할 수 있게 합니다.\n\n§G설계 힌트: 이 모듈을 사용하면 잠수함 탐지 능력치가 증가하기 시작하지만, 레이더 우위, 속도, 항속 거리가 감소합니다.§!"
 spec_mad_2: "자기변화탐지기 (MAD)"
 spec_mad_2_desc: "물속의 자기 이상을 통해 잠수함을 탐지하는 체계입니다.\n\n§G설계 힌트: 이 모듈을 사용하면 잠수함 탐지 능력치가 증가하기 시작하지만, 레이더 우위, 속도, 항속 거리가 감소합니다.§!"
 spec_mad_3: "향상된 소나 체계"
 spec_mad_3_desc: "데이터링크 능력을 갖춘 첨단 MAD 및 소노부이 체계입니다.\n\n§G설계 힌트: 이 모듈을 사용하면 잠수함 탐지 능력치가 증가하기 시작하지만, 레이더 우위, 속도, 항속 거리가 감소합니다.§!"
 spec_refuel_1: "외부연료탱크"
 spec_refuel_1_desc: "항공기의 항속 거리를 늘리는 데 사용하는 투하 가능 연료탱크입니다.\n\n§G설계 힌트: 이 모듈을 사용하면 항공기의 항속 거리가 약간 늘어나지만, 연료 소비가 증가하고 레이더 우위가 감소합니다. 다른 모듈 때문에 항속 거리 증대가 필요한 항공기에 사용하십시오.§!"
 spec_refuel_2: "항공기 설계 중심 연료 탱크"
 spec_refuel_2_desc: "공기역학을 해치지 않는 외부 연료탱크입니다.\n\n§G설계 힌트: 이 모듈을 사용하면 항공기의 항속 거리가 약간 늘어나지만, 연료 소비가 증가하고 레이더 우위가 극히 미미하게 감소합니다. 다른 모듈 때문에 항속 거리 증대가 필요한 항공기에 사용하십시오.§!"
 spec_redundant_1: "다중 유압 시스템"
 spec_redundant_1_desc: "항공기를 위한 초기 예비 체계입니다.\n\n§G설계 힌트: 이 모듈을 사용하면 항공기의 신뢰도가 증가합니다. 항공기는 신뢰도 100% 이상을 목표로 해야 하며, 이렇게 하면 항공 사고 위험이 0%가 되어 사고 확률 증가로 조종사와 기체를 잃지 않고 항공기를 더 효과적으로 훈련시킬 수 있습니다.§!"
 spec_redundant_2: "다중 전기 시스템"
 spec_redundant_2_desc: "플라이 바이 와이어 항공기를 위한 예비 전기 체계입니다.\n\n§G설계 힌트: 이 모듈을 사용하면 항공기의 신뢰도가 증가합니다. 항공기는 신뢰도 100% 이상을 목표로 해야 하며, 이렇게 하면 항공 사고 위험이 0%가 되어 사고 확률 증가로 조종사와 기체를 잃지 않고 항공기를 더 효과적으로 훈련시킬 수 있습니다.§!"
 spec_redundant_3: "보조 운항 통제"
 spec_redundant_3_desc: "비행 조종 장치가 손상될 경우를 대비한 추가 예비 체계입니다.\n\n§G설계 힌트: 이 모듈을 사용하면 항공기의 신뢰도가 증가합니다. 항공기는 신뢰도 100% 이상을 목표로 해야 하며, 이렇게 하면 항공 사고 위험이 0%가 되어 사고 확률 증가로 조종사와 기체를 잃지 않고 항공기를 더 효과적으로 훈련시킬 수 있습니다.§!"
 spec_protection_1: "항공기 장갑"
 spec_protection_1_desc: "무게 증가와 속도 감소를 대가로 생존성을 높입니다.\n\n§G설계 힌트: 항공기 장갑은 방공을 크게 높이지만 IC, 무게, 항속 거리, 레이더 우위를 희생해야 합니다. 높은 방공이 필요하며 레이더 우위와 항속 거리 능력치를 잃어도 괜찮은 항공기에 이 모듈을 사용하십시오.§!"
 spec_protection_2: "초기 자가 수리 시스템"
 spec_protection_2_desc: "손상 후 다시 결합하여 항공기가 기지로 귀환해 수리받을 수 있도록 설계된 소재로, 장갑보다는 방호력이 훨씬 떨어집니다.\n\n§G설계 힌트: 이 모듈은 방공을 중간 정도, 신뢰도를 소폭 높이지만 IC 비용과 자원 비용이 더 커집니다. 항공기의 신뢰도를 크게 높이면서 장갑의 이점도 원할 때 이 모듈을 사용하십시오.§!"
 spec_protection_3: "Advanced Self-Healing Material"
 spec_protection_3_desc: "손상을 입은 후 거의 완전히 스스로 복구할 수 있는 소재입니다.\n\n§G설계 힌트: 이 모듈은 방공을 중간 정도, 신뢰도를 소폭 높이지만 IC 비용과 자원 비용이 더 커집니다. 항공기의 신뢰도를 크게 높이면서 장갑의 이점도 원할 때 이 모듈을 사용하십시오.§!"
 spec_recon_1: "냉전기 정찰 카메라"
 spec_recon_1_desc: "항공기가 정찰 임무를 수행할 수 있게 하는 카메라 체계입니다.\n\n§G설계 힌트: 항공기가 크게 감소한 비용으로 정찰 임무를 수행할 수 있게 하려면 이 모듈을 사용하십시오.§!"
 spec_tgp_1: "냉전기 타게팅 포드"
 spec_tgp_1_desc: "항공기가 목표에 정밀하게 폭장을 투하할 수 있게 하는 표적 지정 포드입니다.\n\n§G설계 힌트: 이 모듈은 모든 지상 공격 능력치를 높이고 야간 페널티를 줄이지만 레이더 우위가 일부 감소합니다.§!"
 spec_recon_2: "Advanced Recon Camera"
 spec_recon_2_desc: "$spec_recon_1_desc$"
 spec_tgp_2: "Advanced Targeting Pod"
 spec_tgp_2_desc: "$spec_tgp_1_desc$"
 spec_recon_3: "Modern Recon Camera"
 spec_recon_3_desc: "$spec_recon_1_desc$"
 spec_tgp_3: "Modern Targeting Pod"
 spec_tgp_3_desc: "$spec_tgp_1_desc$"
 spec_stealthshape_1: "초기 스텔스 성형"
 spec_stealthshape_1_desc: "레이더 탐지를 회피하도록 설계된 초기 설계입니다.\n\n§G설계 힌트: 이 모듈은 레이더 우위와 방공 능력치를 크게 높이지만 생산 비용이 크게 증가합니다. 이러한 항공기를 생산할 여력이 있는 국가에만 권장됩니다.§!"
 spec_stealthshape_2: "향상된 스텔스 성형"
 spec_stealthshape_2_desc: "현대 레이더 체계를 회피하도록 설계된 고급 설계입니다.\n\n§G설계 힌트: 이 모듈은 레이더 우위와 방공 능력치를 크게 높이지만 생산 비용이 크게 증가합니다. 이러한 항공기를 생산할 여력이 있는 국가에만 권장됩니다.§!"
 spec_stealthmats_1: "전파 흡수 물질 (RAM)"
 spec_stealthmats_1_desc: "탐지를 회피하기 위해 레이더파를 흡수하도록 설계된 소재입니다.\n\n§G설계 힌트: 이 모듈은 레이더 우위와 방공 능력치를 크게 높이지만 자원 요구량이 증가합니다. 이러한 항공기를 생산할 여력이 있는 국가에만 권장됩니다.§!"
 spec_stealthmats_2: "향상된 전파 흡수 물질 (RAM)"
 spec_stealthmats_2_desc: "현대 레이더 탐지를 회피하는 데 도움이 되도록 설계된 소재입니다.\n\n§G설계 힌트: 이 모듈은 레이더 우위와 방공 능력치를 크게 높이지만 자원 요구량이 증가합니다. 이러한 항공기를 생산할 여력이 있는 국가에만 권장됩니다.§!"
 spec_thrust_vector_1: "STO/VL (단거리 이륙-수직 착륙) 엔진"
 spec_thrust_vector_1_desc: "초기 추력 편향 및 회전식 엔진 설계입니다.\n\n§G설계 힌트: 이 모듈은 신뢰도를 대가로 항공기의 방공을 높입니다. 스텔스 비용을 들이지 않고 더 튼튼한 항공기를 만들고자 할 때 권장됩니다.§!"
 spec_thrust_vector_2: "단일 축 추력 벡터"
 spec_thrust_vector_2_desc: "기동성을 높이기 위해 설계된 추력 편향 체계입니다.\n\n§G설계 힌트: 이 모듈은 신뢰도를 대가로 항공기의 방공을 높입니다. 스텔스 비용을 들이지 않고 더 튼튼한 항공기를 만들고자 할 때 권장됩니다.§!"
 spec_thrust_vector_3: "이중 축 추력 벡터"
 spec_thrust_vector_3_desc: "여러 축에 걸쳐 기동성을 높이는 첨단 추력 편향입니다.\n\n§G설계 힌트: 이 모듈은 신뢰도를 대가로 항공기의 방공을 높입니다. 스텔스 비용을 들이지 않고 더 튼튼한 항공기를 만들고자 할 때 권장됩니다.§!"
 spec_countermeasures_1: "Countermeasures and early RWR"
 spec_countermeasures_1_desc: "미사일 공격에 대한 초기 방어 수단입니다.\n\n§G설계 힌트: 항공기의 방공 능력치를 전반적으로 높입니다. 항공기에는 특히 스텔스 모듈이 없는 경우 최소한 하나의 대응 수단 모듈을 장착하는 것이 권장됩니다.§!"
 spec_countermeasures_2: "Countermeasures and modern RWR"
 spec_countermeasures_2_desc: "현대식 채프와 플레어입니다.\n\n§G설계 힌트: 항공기의 방공 능력치를 전반적으로 높입니다. 항공기에는 특히 스텔스 모듈이 없는 경우 최소한 하나의 대응 수단 모듈을 장착하는 것이 권장됩니다.§!"
 spec_countermeasures_3: "Electronic Warfare Suite"
 spec_countermeasures_3_desc: "전자전 장비입니다.\n\n§G설계 힌트: 항공기의 방공 능력치를 전반적으로 높이고 레이더 우위도 높입니다. 항공기에는 특히 스텔스 모듈이 없는 경우 최소한 하나의 대응 수단 모듈을 장착하는 것이 권장됩니다.§!"
 spec_countermeasures_4: "레이저 능동파괴체계 시스템"
 spec_countermeasures_4_desc: "모든 미사일 위협으로부터 보호하는 하드킬 대응 수단입니다.\n\n§G설계 힌트: 항공기의 방공 능력치를 전반적으로 높이고 레이더 우위도 높입니다. 항공기에는 특히 스텔스 모듈이 없는 경우 최소한 하나의 대응 수단 모듈을 장착하는 것이 권장됩니다.§!"
