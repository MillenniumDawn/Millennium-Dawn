 COM_MIL_STATS: "[COM_mil_level_gui]\n£GFX_COM_satellite_texticon [?var_COM_mil_sat_system_num]\n£GFX_satellite_coverage_texticon [?var_COM_mil_coverage|G%]\n\n£GFX_sat_network_traffic_texticon [sat_network_traffic_mil]\n\n£GFX_satellite_bonus_texticon [?var_COM_mil_sat_system_bonus|G1%]"
 COM_MIL_STATS_TT: "£GFX_COM_satellite_texticon  체계에 연결된 §Y[COM_mil_level_gui]§! 위성의 수입니다.\n£GFX_satellite_coverage_texticon  체계의 전 지구적 도달범위입니다.\n£GFX_sat_network_traffic_texticon  네트워크 트래픽:\n§Y군용 수신기 용량§!: [?var_COM_mil_receiver_cap|C]\n§Y총 수신기 수§!: [?var_COM_mil_receiver_num|O]\n§Y대대§!: [?num_battalions]\n§Y함선§!: [?num_ships]\n§Y항공기§!: [?num_deployed_planes]\n§Y타국 제공분 (접근 허용됨)§!: [?var_treaty_COM_mil_receiver_num]\n£GFX_satellite_bonus_texticon  체계 보너스입니다."
 COM_MIL_STATS_TT_DELAYED: "£GFX_satellite_coverage_texticon  §Y전 지구적 도달범위§!: 이 체계 등급에서 최대 가능한 위성 수 대비 연결된 §Y[COM_mil_level_gui]§!의 비율입니다.\n£GFX_sat_network_traffic_texticon  §Y네트워크 트래픽§!: 체계가 제한 없이 처리할 수 있는 총 수신기 수에 대한 활성 수신기의 비율입니다 (체계 등급 이상의 모든 £GFX_COM_satellite_texticon 위성은 그 수신기 용량에 합산됩니다). 한도에 도달하면 §R100%§!를 초과하는 매 1% 포인트마다 보너스가 §R1%§! 감소합니다. 배치된 모든 §Y대대§!, §Y함선§!, §Y항공기§!는 §Y1§!개의 수신기를 가집니다. 다른 국가들이 위성 체계에 접근할 수 있는 경우, 그들의 수신기도 더해집니다.\n£GFX_satellite_bonus_texticon  §Y체계 보너스§!: §g위성 통신 체계§!가\n§Y사단 조직력\n계획 수립 속도\n최대 지휘력\n호위 효율\n요격 임무 효율\n함대 조직§!\n에 제공하는 §G보너스§! 비율입니다. 보너스는 체계의 최대치로 제한됩니다."
