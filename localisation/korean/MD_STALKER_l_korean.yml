 STALKER_global_zone_category: "세계 구역 현안"
 STALKER_global_zone_category_desc: "카이마노프 사태 이후 이상 구역과 거기서 나오는 아티팩트는 모든 정부의 관심사가 되었습니다.\n\n세계 아티팩트 가격: 개당 §Y$[?global.STALKER_artifact_price|2]§!십억\n공개 시장의 아티팩트: §Y[?global.STALKER_market_artifacts|0]§!"
 STALKER_mdst_category: "MDST 방첩 활동"
 STALKER_mdst_category_desc: "X-연구소 문서에 따르면 국방 비밀기술부(MDST)는 우리 기관을 포함한 국가 기관 내부의 프로젝트 X 통로를 여전히 활용하고 있습니다.\n\nMDST 침투도: §Y[?ROOT.STALKER_mdst_penetration|0]§! / 80\n매월 §R1§!씩 증가합니다. §Y9§!를 넘으면 아티팩트와 X-연구소 진척도를 훔칠 월간 확률이 침투도의 5분의 1이 되며, §Y180일§!에 최대 한 번 발생합니다."
