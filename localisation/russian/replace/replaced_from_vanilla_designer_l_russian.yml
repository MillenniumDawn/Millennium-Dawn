 REGIMENT_WINDOW_DESC: "Выберите, чтобы изменить или добавить взвод"
 DESIGNER_BLOCKED: "Этот слот линейной роты §Rзаблокирован§!"
 DESIGNER_ADD_FILL_REGIMENT: "§GCtrl + щелчок§!, чтобы заполнить остаток батальона копиями слота выше"
