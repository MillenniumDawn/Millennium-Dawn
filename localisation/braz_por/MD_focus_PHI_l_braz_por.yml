 PHI_corruption_strength_exact_tt: "§YForça da Corrupção§! reduzida em §R[?PHI_corruption_roll|0]§! (Atual: §Y[?PHI_corruption_strength|0]§!)"
 PHI_edsa_dos_category: "A Crise EDSA Dos"
 PHI_edsa_dos_category_desc: "Acusações de corrupção desestabilizaram o governo. O julgamento de impeachment paralisou a administração. O povo está de olho e ficando impaciente. Tome a decisão §YAbrir o Segundo Envelope§! antes que o cronômetro termine."
 PHI_the_people_grow_disillusioned: "O Povo Fica Desiludido..."
 PHI_the_people_grow_disillusioned_desc: "O voto do senado para suprimir provas fundamentais do impeachment indignou o público. Centenas de milhares convergem para o Santuário EDSA. O tempo está se esgotando."
 PHI_open_the_second_envelope: "Abrir o Segundo Envelope"
 PHI_open_the_second_envelope_desc: "Apesar do voto de 11 a 10 do senado para suprimi-lo, ainda temos o poder de permitir que as provas controversas sejam abertas. Isso nos prejudicará politicamente, mas pode ser a única forma de preservar a confiança nas instituições e evitar a queda do governo."
 PHI_edsa_corruption_below_55_tt: "A §YForça da Corrupção§! deve estar abaixo de §Y55§! (Atual: [?PHI.PHI_corruption_strength|Y0])"
 PHI_edsa_stability_above_60_tt: "A §YEstabilidade§! deve estar acima de §Y60%§!"
 PHI_edsa_dos_impeachment_atmosphere: "Paralisia do Impeachment"
 PHI_edsa_dos_impeachment_atmosphere_desc: "O julgamento de impeachment domina todos os noticiários. O capital político se esvai diariamente enquanto a nação observa o governo lutar pela sobrevivência."
 PHI_edsa_dos_recovery_spirit: "Estabilização Pós-EDSA"
 PHI_edsa_dos_recovery_spirit_desc: "O novo governo assumiu o poder em circunstâncias extraordinárias. As promessas de reforma geram um otimismo público cauteloso, embora feridas políticas profundas permaneçam."
 PHI.1.t: "O Escândalo Juetengate Explode"
 PHI.1.d: "Um denunciante veio a público acusando o presidente Joseph Estrada e membros de seu círculo íntimo de receberem milhões em propinas do jueteng. A indignação pública cresce rapidamente à medida que reportagens expõem camadas mais profundas de corrupção no governo. Figuras da oposição, líderes da Igreja e organizações da sociedade civil começaram a organizar manifestações exigindo prestação de contas do governo. Com as tensões aumentando em todo o país, o governo deve decidir como responderá à crescente agitação. Ou enfrentar o fim completo da administração."
 PHI.1.a: "Isso pode virar algo maior..."
 PHI.2.t: "O Fim da Linha"
 PHI.2.d: "Tudo começou com uma debandada. Quando o senado votou 11 a 10 para suprimir provas fundamentais do impeachment, toda a equipe de acusação abandonou o tribunal. Em poucas horas, centenas de milhares de filipinos começaram a inundar o Santuário EDSA numa manifestação em massa que lembrava a Revolução do Poder Popular original de 1986. Em poucos dias, as Forças Armadas das Filipinas e a Polícia Nacional Filipina retiraram seu apoio ao governo. Ministros renunciaram em massa. O Presidente da Suprema Corte, Hilario Davide Jr., deu posse à vice-presidente Gloria Macapagal-Arroyo. Joseph Estrada deixou o Palácio de Malacañang sem renunciar formalmente. Um novo capítulo começa."
 PHI.2.a: "O povo falou."
 PHI.3.t: "Posse de Gloria Macapagal Arroyo"
 PHI.3.d: "Logo após Joseph Estrada deixar o cargo de presidente das Filipinas, Gloria Arroyo, vice de Joseph Estrada e do partido £PHI_conservatism Lakas-CMD, tomou posse como a 14ª presidente das Filipinas. Embora alguns digam que a ascensão de Arroyo à presidência foi ilegítima, o povo comemora a queda de mais um líder corrupto, derrubado pelas barricadas da revolução e dos protestos. Embora o governo Arroyo leve tempo para se recuperar, talvez a mudança finalmente esteja no ar, já que Arroyo promete curar as feridas deixadas pelo ex-presidente deposto."
 PHI.3.a: "A mudança pode estar no ar."
 PHI.4.t: "O Segundo Envelope é Aberto"
 PHI.4.d: "Após dias de turbulência política, o Senado votou pela abertura do controverso 'Segundo Envelope'. O que se esperava ser o momento decisivo do julgamento de impeachment trouxe, em vez disso, um breve suspiro de alívio por todo o país. Com as provas agora entrando no processo judicial, a acusação abandona os planos de debandada em massa, e os apelos por uma nova Revolução do Poder Popular perdem força rapidamente.\nO presidente Joseph Estrada sobrevive à tempestade política do dia, mas seu governo continua profundamente ferido. As acusações de corrupção seguem dominando as manchetes, os mercados financeiros permanecem apreensivos, e aliados e opositores entendem que a batalha do impeachment está longe de terminar. O governo evitou o colapso, mas seu futuro agora depende inteiramente do resultado do julgamento."
 PHI.4.a: "A República resiste... por ora"
 PHI.5.t: "A Campanha de Mindanao Termina"
 PHI.5.d: "Os últimos comandos de base organizados da Frente Moro de Libertação Islâmica foram dominados. O que resta da Frente é um punhado de comandantes foragidos, sem território, receita ou uma cadeia de comando capaz de coordená-los. O Comando Sul devolveu a responsabilidade pelos municípios recuperados às autoridades civis, e as Forças Armadas reduzem o efetivo ao nível de guarnição.\n\nA insurgência termina sem a assinatura de nenhum documento. Se as queixas que a originaram terminaram com ela é outra questão."
 PHI.5.a: "Mindanao está sob nossa autoridade."
 PHI.6.t: "O Acordo Abrangente sobre o Bangsamoro"
 PHI.6.d: "Após anos de negociação mediada pela Malásia, o governo e a Frente Moro de Libertação Islâmica assinaram um acordo abrangente. A Frente desarmará suas armas e combatentes sob verificação independente. Em troca, a Região Autônoma no Mindanao Muçulmano dá lugar a uma entidade Bangsamoro, com parlamento próprio, uma parcela definida da receita nacional e autoridade sobre seus assuntos internos.\n\nA transição custará a Manila muito dinheiro e uma parcela de soberania sobre o sul. Também encerra quatro décadas de guerra."
 PHI.6.a: "A paz vale o preço."
 PHI.7.t: "A Rebelião Mais Longa é Quebrada"
 PHI.7.d: "As frentes guerrilheiras do Novo Exército do Povo foram desmanteladas, uma região por vez. Seus comitês regionais foram capturados ou dispersos, suas redes rurais de cobrança de impostos foram rompidas, e o que resta do Comitê Central não dirige nada a partir do exílio nos Países Baixos.\n\nO Partido Comunista das Filipinas lançou sua guerra popular prolongada em 1969. Ela sobreviveu à ditadura de Marcos, a quatro presidentes e a todos os processos de paz tentados desde então. Não sobreviverá a este."
 PHI.7.a: "Cinquenta anos de guerra acabaram."
 PHI.8.t: "Acordo em Oslo"
 PHI.8.d: "O governo norueguês sediou a rodada final de negociações entre Manila e a Frente Democrática Nacional. O acordo concede anistia a presos políticos e compromete o governo com um programa de reforma agrária e investimento rural. Em troca, o Novo Exército do Povo se desmobilizará permanentemente e a Frente disputará o poder por meio de partidos legais.\n\nOs linha-dura de ambos os lados denunciam o acordo. Nenhum dos lados comanda forças para continuar sem o outro."
 PHI.8.a: "A guerra termina à mesa."
 PHI.9.t: "A Lei Antidinastia é Aprovada"
 PHI.9.d: "Contra todas as expectativas, o Congresso aprovou a legislação regulamentadora do Artigo II, Seção 26 da Constituição. Parentes de ocupantes de cargos, até o segundo grau de consanguinidade, ficam impedidos de sucedê-los ou de ocupar cargos simultaneamente na mesma jurisdição.\n\nOs clãs provinciais que forneceram governadores, deputados e presidentes por gerações agora enfrentam um mapa eleitoral que não podem herdar. A liderança dos partidos está aberta a candidatos sem uma família por trás, e muitas carreiras terminaram no momento em que o presidente sancionou a lei."
 PHI.9.a: "As famílias não são donas da República."
 PHI_news.1.t: "Estrada Deposto na Segunda Revolução do Poder Popular"
 PHI_news.1.d: "O presidente Joseph Estrada foi forçado a deixar o cargo após dias de manifestações em massa e o colapso de seu processo de impeachment, que desencadeou uma crise política em Manila. Com as Forças Armadas e a Polícia Nacional Filipina retirando seu apoio ao presidente acuado, a vice-presidente Gloria Macapagal Arroyo tomou posse, pondo fim ao governo Estrada. Governos de toda a Ásia saudaram a transferência pacífica de poder, observando de perto o futuro político das Filipinas."
 PHI_news.1.a: "Um fim dramático para a presidência de Estrada."
 PHI_news.2.t: "Estrada Sobrevive à Crise"
 PHI_news.2.d: "O presidente filipino Joseph Estrada superou por pouco o que parecia ser a mais grave crise política de seu mandato. Depois que o Senado votou pela admissão do controverso Segundo Envelope como prova, o julgamento de impeachment foi retomado em vez de mergulhar em caos político.\nA decisão aliviou temporariamente o temor de manifestações em massa e de outro movimento do Poder Popular, permitindo que Estrada permaneça no cargo enquanto o processo judicial prossegue. Apesar desse alívio, as acusações de corrupção continuam a lançar uma longa sombra sobre o governo, deixando governos estrangeiros e mercados financeiros incertos quanto ao futuro político do país."
 PHI_news.2.a: "Estrada permanece no poder."
 PHI_edsa_dos_tt: "§YO presidente Joseph Estrada foi flagrado lidando com dinheiro ilegal, e o povo se reúne nas ruas. Se não resolvermos isso§!, §Rpode ser o fim de todo o nosso governo como o conhecemos§!."
