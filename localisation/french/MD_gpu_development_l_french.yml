l_french:
 gpu_development.1.t: "Radeon défie GeForce"
 gpu_development.1.d_usa: "Quelques mois après que la GeForce de NVIDIA a introduit la transformation et l'éclairage matériels, ATI s'apprête à dévoiler Radeon, un défi direct sur la vitesse, les pilotes et la fidélité des développeurs. La concurrence pousse la conception graphique américaine à la frontière, pourtant les deux firmes sont fabless, et chaque progrès approfondit leur dépendance à une poignée de fonderies taïwanaises. Washington peut maintenir ouverts les standards graphiques et la recherche fédérale, ou concentrer son soutien derrière les plus solides bureaux d'études nationaux."
 gpu_development.1.a_usa: "Soutenir les standards ouverts et la recherche"
 gpu_development.1.b_usa: "Appuyer les principaux bureaux d'études"
 gpu_development.1.d_can: "ATI Technologies s'apprête à dévoiler Radeon depuis son siège de Markham, défiant NVIDIA pour le leadership en performances que GeForce a revendiqué quelques mois plus tôt. La firme est l'un des rares champions semi-conducteurs du Canada, mais rivaliser à la frontière exigera un accès plus profond au capital, à la capacité de fonderie et aux développeurs logiciels qui décident quel matériel l'emporte. Ottawa peut protéger l'indépendance d'ATI comme bureau d'études national, ou l'intégrer aux chaînes d'approvisionnement continentales qui lient la conception canadienne au capital américain et à la fabrication asiatique."
 gpu_development.1.a_can: "Protéger l'indépendance d'ATI"
 gpu_development.1.b_can: "Intégrer ATI à l'approvisionnement continental"
 gpu_development.1.d_tai: "La joute entre Radeon et GeForce arrive sous forme de nouvelles commandes de wafers à Taïwan, où les deux concepteurs fabless dépendent des fonderies locales pour fabriquer leurs puces. Ce marché graphique naissant peut élargir la clientèle de l'industrie des microprocesseurs de l'île, ou concentrer une capacité de pointe rare derrière les bureaux d'études à la croissance la plus rapide. Taipei doit décider s'il faut garder l'accès aux fonderies ouvert à de nombreux clients ou sécuriser des contrats de long terme avec quelques concepteurs d'ancrage."
 gpu_development.1.a_tai: "Élargir l'accès à la fonderie"
 gpu_development.1.b_tai: "Contrats de conception d’ancrage sécurisés"
 gpu_development.2.t: "Les shaders deviennent programmables"
 gpu_development.2.d_usa: "DirectX 8 et une nouvelle génération de processeurs graphiques ont remplacé les pipelines fixes par des shaders de vertex et de pixels programmables. Fabricants de matériel, studios de jeux et développeurs de systèmes d'exploitation rivalisent désormais pour définir les interfaces qui façonneront le graphisme en temps réel."
 gpu_development.2.a_usa: "Standardiser les interfaces des shaders"
 gpu_development.2.b_usa: "Laisser les fabricants étendre leurs piles logicielles"
 gpu_development.2.d_can: "Les ingénieurs Radeon d'ATI intègrent le support des shaders programmables dans une architecture graphique en rapide progression. Des interfaces communes élargiraient le marché des conceptions canadiennes, tandis que des extensions propriétaires pourraient donner à ATI un avantage technique temporaire."
 gpu_development.2.a_can: "Construire autour d’interfaces communes"
 gpu_development.2.b_can: "Différencier la plateforme Radeon"
 gpu_development.2.d_jap: "Le graphisme programmable change la façon dont les fabricants de consoles et les studios de jeux répartissent le travail entre matériel et logiciel. Les détenteurs de plateformes japonais peuvent promouvoir des standards de shaders portables ou préserver des architectures étroitement optimisées pour leurs propres consoles."
 gpu_development.2.a_jap: "Soutenir les normes graphiques portables"
 gpu_development.2.b_jap: "Optimiser pour les consoles nationales"
 gpu_development.3.t: "AMD acquiert ATI"
 gpu_development.3.d_usa: "AMD a accepté d'acquérir ATI dans une opération qui réunit processeurs x86, chipsets et graphismes sous une même société. La fusion promet des plateformes informatiques intégrées, mais elle réduit aussi le nombre de firmes indépendantes en lice pour les conceptions graphiques et la capacité de fonderie."
 gpu_development.3.a_usa: "Préserver la concurrence autour de la fusion"
 gpu_development.3.b_usa: "Encourager une plateforme informatique intégrée"
 gpu_development.4.t: "CUDA ouvre le calcul parallèle"
 gpu_development.4.d_usa: "NVIDIA a publié CUDA, permettant aux programmeurs d'utiliser des processeurs graphiques compatibles pour des travaux bien au-delà du rendu. Le calcul scientifique, la simulation et l'analyse de données peuvent désormais exploiter des milliers de threads parallèles, à condition que les développeurs s'engagent dans l'écosystème logiciel de NVIDIA."
 gpu_development.4.a_usa: "Promouvoir les normes de calcul portables"
 gpu_development.4.b_usa: "Déployer l'écosystème CUDA"
 gpu_development.5.t: "AlexNet change la course à l'IA"
 gpu_development.5.d_usa: "Le résultat décisif d'AlexNet sur ImageNet a montré que de grands réseaux de neurones entraînés sur des processeurs graphiques peuvent surpasser les méthodes établies de vision par ordinateur. Laboratoires américains et entreprises technologiques se précipitent pour sécuriser accélérateurs, jeux de données et chercheurs avant que des concurrents ne reproduisent la percée à grande échelle."
 gpu_development.5.a_usa: "Garder la recherche sur les accélérateurs largement accessible"
 gpu_development.5.b_usa: "Faire évoluer les clusters d’IA commerciaux"
 gpu_development.5.d_can: "Des chercheurs de l'Université de Toronto ont utilisé des processeurs graphiques NVIDIA pour entraîner AlexNet et transformer la compétition ImageNet. Le Canada détient désormais une concentration inhabituelle d'expertise en apprentissage automatique, mais des firmes étrangères rivalisent déjà pour recruter l'équipe et commercialiser ses méthodes."
 gpu_development.5.a_can: "Élargir le réseau de recherche public"
 gpu_development.5.b_can: "Transformer la percée en industrie de l'IA"
 gpu_development.6.t: "Les Tensor Cores entrent dans le centre de données"
 gpu_development.6.d_usa: "L'architecture Volta de NVIDIA introduit des Tensor Cores conçus pour accélérer les opérations matricielles utilisées dans l'apprentissage profond. Les processeurs graphiques deviennent des moteurs spécialisés de centres de données, accroissant la demande de fabrication avancée, de mémoire à haute bande passante et de logiciels étroitement intégrés."
 gpu_development.6.a_usa: "Élargir l'accès aux accélérateurs d'IA"
 gpu_development.6.b_usa: "Se concentrer sur des plateformes complètes"
 gpu_development.6.d_tai: "Les accélérateurs de classe Volta exigent une fabrication de pointe et un packaging de plus en plus complexe. Les fonderies taïwanaises peuvent traiter les puces d'IA comme une classe de clients parmi d'autres, ou réserver une capacité avancée rare aux concepteurs d'accélérateurs à la croissance la plus rapide."
 gpu_development.6.a_tai: "Garder la capacité avancée largement disponible"
 gpu_development.6.b_tai: "Prioriser les commandes d’accélérateurs stratégiques"
 gpu_development.6.d_kor: "Les accélérateurs d'IA ont besoin de mémoire à haute bande passante pour alimenter des milliers d'unités de calcul. Les producteurs de mémoire coréens peuvent étendre la HBM comme standard industriel ouvert, ou lier étroitement la nouvelle capacité aux principales plateformes d'accélération."
 gpu_development.6.a_kor: "Standardiser et élargir l'offre de HBM"
 gpu_development.6.b_kor: "Sécuriser des partenariats d’accélérateurs à long terme"
 gpu_development.7.t: "L'approvisionnement en GPU se tarit"
 gpu_development.7.d_shortage: "Les perturbations pandémiques, la demande électronique en forte hausse et la concurrence pour la capacité de fonderie ont laissé notre économie à court de microprocesseurs. Cartes graphiques, véhicules, serveurs et appareils grand public se disputent désormais le même approvisionnement contraint."
 gpu_development.7.d_resilient: "Les perturbations pandémiques et la demande électronique en forte hausse ont tendu le marché mondial des microprocesseurs, mais notre approvisionnement actuel reste résilient. La pénurie à l'étranger demeure un avertissement et une occasion de sécuriser la capacité future."
 gpu_development.7.a_usa: "Coordonner l'accès des utilisateurs critiques"
 gpu_development.7.b_usa: "Accélérer l’expansion des capacités nationales"
 gpu_development.7.a_can: "Protéger la recherche et les petits concepteurs"
 gpu_development.7.b_can: "Verrouiller des contrats d'approvisionnement continentaux"
 gpu_development.7.a_tai: "Répartir les wafers entre davantage de clients"
 gpu_development.7.b_tai: "Accélérer l’expansion de la fonderie"
 gpu_development.7.a_kor: "Stabiliser l'offre de mémoire"
 gpu_development.7.b_kor: "Développer la production stratégique de puces"
 gpu_development.7.a_chi: "Rationner les importations dans l'industrie civile"
 gpu_development.7.b_chi: "Accélérer la substitution nationale"
 gpu_development.7.a_jap: "Protéger la production automobile et électronique"
 gpu_development.7.b_jap: "Reconstruire la capacité nationale de semi-conducteurs"
 gpu_development.8.t: "Hopper devient un moteur d'IA"
 gpu_development.8.d_usa: "L'architecture Hopper de NVIDIA et l'accélérateur H100 combinent Transformer Engines, mémoire à haute bande passante et interconnexions à haut débit pour les grands modèles d'IA. L'accélérateur de centre de données n'est plus une carte graphique adaptée, mais un système de calcul stratégique à part entière."
 gpu_development.8.a_usa: "Soutenir un écosystème d'accélérateurs plus large"
 gpu_development.8.b_usa: "Mettre à l'échelle la principale plateforme full-stack"
 gpu_development.8.d_tai: "Hopper dépend du procédé personnalisé de TSMC et du packaging avancé pour relier de grandes puces processeur à de la mémoire à haute bande passante. La demande d'IA transforme à la fois les lancements de wafers et les lignes de packaging en goulets stratégiques pour l'industrie taïwanaise des microprocesseurs."
 gpu_development.8.a_tai: "Élargir l'accès au packaging avancé"
 gpu_development.8.b_tai: "Réserver la capacité aux clients d'ancrage"
 gpu_development.8.d_kor: "Les accélérateurs de classe H100 consomment des piles de HBM3, plaçant les producteurs de mémoire coréens au centre de la chaîne d'approvisionnement de l'IA. La capacité peut être élargie pour un marché diversifié ou engagée par de profondes partenariats avec les principaux vendeurs de plateformes."
 gpu_development.8.a_kor: "Élargir l'offre de HBM3"
 gpu_development.8.b_kor: "Prioriser les contrats de plateformes stratégiques"
 gpu_development.9.t: "La montée en puissance du calcul d'IA"
 gpu_development.9.d_usa: "L'IA générative a déclenché une ruée pour construire des centres de données remplis d'accélérateurs avancés. Les hyperscalers se disputent microprocesseurs, électricité, équipements réseau et main-d'œuvre qualifiée, faisant de la capacité de calcul une préoccupation industrielle nationale."
 gpu_development.9.a_usa: "Garder les marchés du calcul largement accessibles"
 gpu_development.9.b_usa: "Soutenir un déploiement national stratégique"
 gpu_development.9.d_can: "La base de recherche canadienne en IA et l'abondance d'électricité ont attiré des projets de nouveaux clusters d'accélérateurs et de centres de données. Le déploiement pourrait élargir l'accès pour les universités et les start-up, ou lier plus étroitement les talents nationaux à quelques grandes plateformes étrangères."
 gpu_development.9.a_can: "Réserver le calcul à un réseau de recherche ouvert"
 gpu_development.9.b_can: "Utiliser des entreprises phares pour accroître les capacités"
 gpu_development.9.d_tai: "La demande de processeurs d'IA a rempli les carnets de commandes des fonderies de pointe et du packaging avancé. Taïwan peut élargir l'accès à cette capacité dans tout l'écosystème semi-conducteur, ou concentrer l'investissement derrière les clients capables de financer l'expansion la plus rapide."
 gpu_development.9.a_tai: "Diversifier l'accès à la capacité avancée"
 gpu_development.9.b_tai: "Se concentrer sur une expansion rapide des fonderies"
 gpu_development.9.d_kor: "La HBM est devenue l'une des contraintes les plus serrées de la production d'accélérateurs d'IA. Les firmes coréennes doivent décider s'il faut élargir la qualification et l'offre sur le marché, ou dédier de nouvelles lignes de fabrication à des clients stratégiques de long terme."
 gpu_development.9.a_kor: "Élargir la qualification et l'offre de HBM"
 gpu_development.9.b_kor: "Construire autour de clients stratégiques"
 gpu_development.9.d_chi: "La demande de calcul d'IA augmente alors que l'accès aux accélérateurs étrangers les plus avancés reste incertain. Concepteurs nationaux, fonderies et producteurs de mémoire doivent assembler une chaîne d'approvisionnement complète sans supposer que chaque composant de pointe restera disponible."
 gpu_development.9.a_chi: "Soutenir des normes nationales ouvertes d'accélérateurs"
 gpu_development.9.b_chi: "Concentrer les ressources sur les champions nationaux"
 gpu_development.9.d_jap: "Le boom de l'IA a renouvelé la valeur stratégique des matériaux semi-conducteurs japonais, des équipements de fabrication, de l'expertise en packaging et des nouveaux projets de fonderie. Un investissement coordonné pourrait relier ces atouts, mais l'industrie doit choisir entre un accès large aux fournisseurs et un programme national concentré."
 gpu_development.9.a_jap: "Renforcer l'écosystème ouvert des fournisseurs"
 gpu_development.9.b_jap: "Coordonner un programme national de capacité"
 gpu_2000_graphics_market: "Boom du marché graphique"
 gpu_2000_graphics_market_desc: "La demande en forte hausse pour les plus récents accélérateurs graphiques attire ingénieurs et commandes vers les conceptions leaders, accélérant la recherche tout en tendant l'approvisionnement en microprocesseurs dont tous dépendent."
 gpu_accelerator_demand: "Demande d’accélérateur"
 gpu_accelerator_demand_desc: "La demande de processeurs graphiques et d'accélérateurs d'IA attire investissements, talents et microprocesseurs vers le calcul avancé. L'expansion qui en résulte soutient la recherche et la croissance des centres de données tout en exerçant une pression supplémentaire sur l'approvisionnement plus large en puces."
 gpu_foundry_expansion: "Agrandissement de la fonderie"
 gpu_foundry_expansion_desc: "L'investissement public et privé élargit la capacité des usines de microprocesseurs, le packaging avancé et la production de mémoire à haute bande passante pour répondre à la demande croissante de processeurs graphiques et d'accélérateurs d'IA."