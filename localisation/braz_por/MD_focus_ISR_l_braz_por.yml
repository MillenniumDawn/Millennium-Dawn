 PAL_closing_gates_kerem_takeover_restrictions: "§9Fechando os Portões§! §tBloqueio Total§!"
 PAL_closing_gates_erez_closed: "§9Fechando os Portões§! §tBloqueio Deteriorante§!"
 PAL_closing_gates_kerem_shalom_closed: "§9Fechando os Portões§! §tBloqueio Sufocante§!"
 PAL_closing_gates_rafah_closed: "§9Fechando os Portões§! §tBloqueio Extremamente Sufocante§!"
 israel.129.t: "Israel bloqueia Gaza!"
 israel.129.d: "Recentemente, depois que tomamos Gaza, Israel decidiu bloquear economicamente nossa fronteira com eles. Agora estamos parcialmente isolados do lado israelense."
 israel.129.a: "Malditos sionistas!"
 israel.130.t: "Israel pede para bloquear Gaza!"
 israel.130.d: "Recentemente, o governo israelense nos procurou para propor um bloqueio mútuo da Faixa de Gaza, o que enfraquecerá severamente os terroristas em Gaza, protegerá nossas fronteiras de contrabandistas de armas e aumentará nossa segurança em geral. O que devemos responder?"
 israel.130.a: "Claro!"
 israel.130.b: "Não, não faremos isso."
 israel.131.t: "O Egito bloqueia Gaza!"
 israel.131.d: "Recentemente, o governo do Egito decidiu bloquear a Faixa de Gaza após a recente tomada de Gaza por extremistas.\n\nMuitos especialistas afirmam que essa decisão foi tomada devido aos laços estreitos do governo egípcio com Israel."
 israel.131.a: "Ótimo!"
 israel.131.b: "Traidores!"
 israel.132.t: "O Egito se recusa a bloquear!"
 israel.132.d: "O governo egípcio recusou nossa proposta de bloquear Gaza, pois a vê como uma possível base para criar uma crise humanitária."
 israel.132.a: "Hum."
 egyopi_tt: "Se a opinião de [EGY.GetNameWithFlag] for §Yalta o suficiente§!, eles §Gbloquearão§! §R[HAM.GetNameWithFlag]§! e causarão sérios problemas à Faixa de Gaza."
 israel.133.t: "Israel limita os direitos de pesca!"
 israel.133.d: "Israel fechou a fronteira marítima de Gaza. Agora os direitos de pesca estão restritos e estamos ainda mais bloqueados."
 israel.133.a: "Argh!"
 tur_mrmr_tt: "Realizaremos uma §Yincursão militar§! contra navios §R[TUR.GetFlag]turcos§! que abastecem §R[HAM.GetNameWithFlag]§!. Isso pode ter §Yvárias consequências§!."
 willincr_bloc_tt: "Isso §Gaumentará o bloqueio§! de §R[HAM.GetNameWithFlag]§!"
 ISR_gazan_workers: "Mão de Obra Barata de Gaza"
 ISR_gazan_workershama: "Imigração de Trabalhadores"
 israel.134.t: "Dinheiro dos nossos patrocinadores..."
 israel.134.d: "Recentemente, nossos patrocinadores e Israel chegaram a um acordo para que não ataquemos Israel por 2 anos, e em troca nossos patrocinadores nos darão dinheiro."
 israel.134.a: "Não temos escolha a não ser aceitar."
 focus_eff_ch_tt: "O §GEfeito§! deste foco depende do §Ypartido governante§! em §R[HAM.GetNameWithFlag]§!"
 israel.135.t: "Israel propõe um investimento mútuo."
 israel.135.d: "Após a recente Hudna entre Israel e o novo governo de Gaza, Israel quer que o ajudemos a construir cassinos na Faixa de Gaza. Devemos concordar?"
 israel.135.a: "Claro!"
 israel.135.b: "Ugh? Não."
 gaza_casinos: "Cassinos em Gaza"
 israel.136.t: "Os EUA aceitam!"
 israel.136.d: "Os Estados Unidos aceitaram nossa proposta e dividirão conosco o custo dos Cassinos em Gaza."
 israel.136.a: "Ótimo!"
 israel.137.t: "Os EUA rejeitam!"
 israel.137.d: "Os Estados Unidos rejeitaram nossa proposta, portanto arcaremos com a cobertura total do projeto dos cassinos em Gaza."
 israel.137.a: "Tudo bem, então."
 gazan_casino_tt: "Proporemos uma §Yoferta de investimento mútuo§! a §Y[USA.GetNameWithFlag]§!. Se §Y[USA.GetNameWithFlag]§! rejeitar a oferta, §Ycobriremos as despesas§! por conta própria.\n\nApós o evento, Gaza receberá:"
 PAL_newsingapore: "Nova Singapura"
 israel.138.t: "Israel pede doações para Gaza!"
 israel.138.d: "Após a Hudna com Gaza, Israel nos pede para doar dinheiro ao desenvolvimento de Gaza. Devemos concordar?"
 israel.138.a: "Claro!"
 israel.138.b: "Estamos ocupados com outras coisas."
 israel.139.t: "[FROM.GetNameWithFlag] doa dinheiro a Gaza!"
 israel.139.d: "Recentemente, eles doaram algum dinheiro ao projeto de desenvolvimento de Gaza, a pedido de Israel."
 israel.139.a: "Ótimo!"
 israel.139.b: "Maravilhoso."
 israel.140.t: "[FROM.GetNameWithFlag] recusa doar dinheiro a Gaza!"
 israel.140.d: "Eles não querem participar do projeto de desenvolvimento de Gaza."
 israel.140.a: "Certo."
 israel.141.t: "Acordo Shalit"
 israel.141.d: "Um dos nossos soldados capturado por terroristas de Gaza, Gilad Shalit, está em cativeiro palestino há tempo demais.\n\nNossos especialistas políticos querem trocá-lo sozinho por 1027 terroristas palestinos de nossas prisões. Devemos aceitar esta proposta?"
 israel.141.a: "Sim. Traga nosso garoto para casa."
 israel.141.b: "Proposta muito estúpida!"
 israel.142.t: "O Conselho Yesha é formado!"
 israel.142.d: "Recentemente, o Conselho Yesha foi reformado e Israel precisa decidir em que se concentrará em relação aos seus assentamentos em nosso território. Eles já endureceram o controle sobre nossos territórios."
 israel.142.a: "Argh!"
 israel.143.t: "Israel se concentra nos exclaves!"
 israel.143.d: "Os assentamentos foram endurecidos por causa do foco de Israel nos exclaves da Cisjordânia!"
 israel.143.a: "Devemos resistir a isso."
 israel.144.t: "A Questão de Amona"
 israel.144.d: "O procurador-geral alerta contra a apreensão de terras privadas em Amona.\n\nLegisladores favoráveis aos colonos tentaram encontrar uma brecha legal para manter o posto avançado no lugar, mas o procurador-geral Avichai Mandelblit alertou que tentar legislar a aprovação da apreensão de terras privadas seria inconstitucional.\n\nO que devemos fazer?"
 israel.144.a: "Modificar a lei para atender às exigências da Suprema Corte."
 israel.144.b: "Ignorar as observações do procurador-geral."
 amona_tt: "Decidiremos o §Yfuturo§! da §Gapreensão de terras privadas§! em §R[PAL.GetFlag]Amona§!."
 israel.145.t: "Negociações de Eviatar"
 israel.145.d: "O Ministério da Segurança e os colonos estão negociando sobre Eviatar.\n\nO Conselho Regional da Samaria se referiu a Eviatar como um assentamento em vez de um posto avançado, uma caracterização também absorvida pela mídia israelense e internacional, que desconhece a precisão das definições legais exclusivas da Cisjordânia. Estabelecer um assentamento segue um procedimento legal, ao passo que o estabelecimento de um posto avançado é ilegal segundo as leis israelenses.\n\nDe que lado devemos ficar?"
 israel.145.a: "Destinar um terreno próximo ao assentamento."
 israel.145.b: "Autorizar Eviatar no estado atual."
 eviatar_tt: "Decidiremos o §Yfuturo§! dos §YPostos Avançados§! em §R[PAL.GetFlag]Eviatar§!."
 israel.146.t: "Incidente fora de Homesh leva colonos a julgamento!"
 israel.146.d: "Recentemente, ocorreu um incidente entre colonos fanáticos e o conselho Yesha. O que devemos fazer?"
 israel.146.a: "Eles são inocentes, capturem os autores!"
 israel.146.b: "Temos que respeitar o direito internacional."
 homesh_tt: "Decidiremos o §Yfuturo§! do §YAssentamento§! em §R[PAL.GetFlag]Homesh§!."
 ISR_operation_pager: "Operação Nova Ordem"
 ISR_operation_pager_desc: "Devemos eliminar o chefe do Hezbollah e cortar sua cadeia de comando antes da invasão."
 israel.147.t: "Explosões de pagers no sul do Líbano!"
 israel.147.d: "A agência de espionagem Mossad de Israel plantou uma pequena quantidade de explosivos dentro de 5.000 pagers fabricados em Taiwan encomendados pelo grupo libanês Hezbollah meses antes das detonações de terça-feira, disseram à Reuters uma fonte sênior da segurança libanesa e outra fonte.\n\nA operação foi uma violação de segurança sem precedentes do Hezbollah, que viu milhares de pagers detonarem em todo o Líbano, matando nove pessoas e ferindo quase 3.000 outras, incluindo combatentes do grupo e o enviado do Irã em Beirute.\n\nAgora, Israel começa a bombardear os territórios controlados pelo Hezbollah."
 israel.147.a: "Tzrich le'ashot nikma."
 israel.147.b: "Malditos sionistas!"
 ISR_gay_parades: "Paradas de Tel Aviv"
 prev_foc_dec_efe_tt: "§YNossa escolha anterior determinará o efeito deste foco!§!"
