 ENG_made_smarter_programme: "Programme Made Smarter"
 ENG_made_smarter_programme_desc: "Suite aux recommandations du rapport « Made Smarter », nous finançons l’adoption des technologies numériques industrielles tout au long des chaînes d’approvisionnement manufacturières. La robotique, la fabrication additive et l’analyse des données sont désormais accessibles aux ateliers des petites entreprises, ce qui permet une modernisation plus rapide des lignes de production et une efficacité accrue."
