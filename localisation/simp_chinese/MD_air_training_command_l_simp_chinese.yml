 MD_atc_force_1: "Flight Safety and Maintenance Program I"
 MD_atc_force_1_desc: "Standardized maintenance schedules and flight safety reviews keep aircraft serviceable and reduce losses outside of combat."
 MD_atc_force_2: "Flight Safety and Maintenance Program II"
 MD_atc_force_2_desc: "$MD_atc_force_1_desc$"
 MD_atc_force_3: "Flight Safety and Maintenance Program III"
