 UKR_start_workforce_modifier: "Soviet Staffing Norms"
 UKR_start_workforce_modifier_desc: "Our former collective farms, civilian plants, and mines still carry the payrolls of the Soviet planned economy, while the arms plants, shipyards, and new private offices already run lean.\n§W--------------§!\n$UKR_start_workforce_progress$"
 UKR_start_workforce_progress: "§YWorkplace§!: Current/Target (§GChange, per each§!)\n§YAgriculture Districts§!: [?agriculture_district_total|0]/[?UKR_start_workforce_agriculture_target|0] (§G-10%§!)\n§YCivilian Industry§!: [?industrial_complex_total|0]/[?UKR_start_workforce_civ_facs_target|0] (§G-2.5%§!)\n§YMilitary Industry and Naval Yards§!: [?UKR_start_workforce_mil_facs_count|0]/[?UKR_start_workforce_mil_facs_target|0] (§R+2%§!)\n§YOffice Sector§!: [?office_park_total|0]/[?UKR_start_workforce_offices_target|0] (§R+2%§!)\n§YResource Extraction§!: §G-2.5%§! for each step of the workplaces above\n§YReaching a target§! adds Monthly Population to §YUkrainian Economic Development§! for good: §G+10%§! for Agriculture Districts or Civilian Industry, §G+5%§! for Military Industry and Naval Yards or Office Sector\n\nChecked monthly. Lost buildings do not bring the old staffing back. This national spirit will be §Rremoved§! once every workplace reaches its target."
 UKR_start_workforce_removed_tt: "Every workplace has reached its target, so §YSoviet Staffing Norms§! is §RRemoved§!."
 ukr_start_workforce.1.t: "Staffing Norms Revised"
 ukr_start_workforce.1.d: "New construction has let the ministries rewrite more of the Soviet-era staffing norms.\n\n$UKR_start_workforce_progress$"
 ukr_start_workforce.1.d_done: "The last Soviet-era staffing norms are gone. Our farms, plants, mines, and offices now hire like any modern economy."
 ukr_start_workforce.1.a: "Keep building"
