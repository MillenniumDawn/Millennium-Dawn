 HOL_dutch_mining_operations: "네덜란드 채굴 작전"
 HOL_dutch_mining_operations_desc: "네덜란드는 이 지역에 대규모 채굴 사업을 구축하여 경제 성장과 산업 발전을 뒷받침할 귀중한 자원을 추출하고 있습니다. 이러한 사업은 현지 생산을 크게 끌어올리는 동시에 이 지역에 대한 네덜란드의 통제를 강화합니다."
 HOL_grey_society1: "고령 사회"
 HOL_grey_society1_desc: "네덜란드는 고령화 인구라는 과제에 직면해 있으며, 늘어나는 노년층 비율이 경제, 의료 제도, 노동력에 상당한 압박을 가하고 있습니다. 과거 세대의 기여는 높이 평가받지만, 노동력 부족, 의료비 상승, 세대 간 불평등을 해소하여 모두를 위한 지속 가능한 미래를 보장하기 위한 시급한 개혁이 필요합니다.\n------------\n§Y고령 사회 메커니즘§!의 정책 채택을 마치면 이 §R국가 정신§!을 없앨 수 있습니다"
 HOL_antilles_office_construction: "앤틸리스 제도의 사업 확장"
 HOL_antilles_office_construction_desc: "사무 공간과 상업 중심지의 개발은 앤틸리스 제도의 경제 생산성을 높였으며, 이 지역을 사업과 금융 성장의 거점으로 만들었습니다."
 HOL_antilles_civ_construction: "앤틸리스 제도의 산업 성장"
 HOL_antilles_civ_construction_desc: "민간 산업에 대한 최근의 투자는 현지 제조 역량을 끌어올려 앤틸리스 제도의 경제 안정과 산업 생산을 개선했습니다."
 HOL_antilles_mil_construction: "앤틸리스 제도의 전략적 군사 개발"
 HOL_antilles_mil_construction_desc: "앤틸리스 제도는 이제 군수 생산과 병참의 중요한 거점으로 기능하며 카리브 해 지역에서 네덜란드의 군사적 준비태세를 강화하고 있습니다."
 HOL_antilles_agriculture_construction: "앤틸리스 제도의 농업 개발"
 HOL_antilles_agriculture_construction_desc: "농업 인프라에 대한 새로운 투자는 앤틸리스 제도의 식량 생산과 지속 가능성을 높였으며, 이는 현지 농민과 국가 식량 안보 모두에게 이익이 됩니다."
 HOL_antilles_economic_zone: "앤틸리스 경제 구역"
 HOL_antilles_economic_zone_desc: "앤틸리스 경제 구역(Antillen Economische Zone)의 설립으로 네덜란드령 카리브 지역은 외국인 투자의 매력적인 목적지가 되었습니다. 관료적 장벽 완화와 재정적 유인책 덕분에 국제 기업들이 이곳에 사업체를 세우기가 쉬워졌습니다. 그러나 이러한 이점은 현지 산업이 새로운 경제 현실에 적응하는 동안 국내 건설 사업이 더뎌지는 대가를 수반합니다."
 HOL_antilles_economic_zone_tt: "§Y[THIS.GetName]§!에 대한 §Y투자§! 비용이 §Y15%§! 저렴해집니다. AI도 이 주에 투자할 가능성이 더 높아집니다."
 HOL_economy.001.t: "보르설러 개조 계획"
 HOL_economy.001.d: "보르설러 원자로의 미래는 귀하의 손에 달려 있습니다. 두 가지 선택지가 있습니다. 원자로의 용량을 확장하여 원자력 에너지 생산량을 늘리거나, 최첨단 청정 석탄 발전소로 개조하는 것입니다. 원자로를 확장하면 에너지 효율과 혁신이 향상되고, 청정 석탄으로 전환하면 산업 역량과 안정이 높아집니다. 이 결정이 네덜란드의 에너지 지형을 좌우할 것이니 신중히 선택하십시오."
 HOL_economy.001.a: "원자력으로 간다"
 HOL_economy.001.b: "번쩍이는 석탄 발전소"
 HOL_economy.002.t: "네덜란드, 분더라인 철도 제안"
 HOL_economy.002.d: "네덜란드는 두 나라 사이의 지역 연결성을 높이기 위한 최첨단 국경 간 노선인 분더라인 철도를 개발하자는 야심 찬 제안을 내놓았습니다. 향후 경제 협력의 초석으로 구상된 이 사업은 기존 인프라를 현대화하고, 이동 시간을 단축하며, 네덜란드와 독일의 관계를 강화할 것입니다. 이 제안은 교통망을 발전시키고 이웃 나라들과 더 강한 유대를 증진하려는 네덜란드의 의지를 반영합니다."
 HOL_economy.002.a: "분더바!"
 HOL_economy.002.b: "아니오, 우리는 낡은 열차를 고수하겠습니다"
 HOL_economy.003.t: "독일, 분더라인 협력 승인"
 HOL_economy.003.d: "독일 정부는 분더라인 사업에 참여하기로 합의하여 흐로닝언과 브레멘 사이의 철도 연결을 강화하게 되었습니다. 이 공동 구상은 지역 경제 관계를 강화하고, 국경 간 이동성을 개선하며, 네덜란드와 독일 협력의 새로운 시대를 상징할 것입니다."
 HOL_economy.003.a: "지역 연결성의 새로운 장이 열립니다!"
 HOL_economy.004.t: "분더라인을 원치 않는 독일"
 HOL_economy.004.d: "네덜란드의 외교적 노력과 분더라인 철도의 잠재적 이점에도 불구하고 독일은 이 사업을 지원하지 않기로 결정했습니다. 이 거부는 더욱 긴밀하게 연결된 유럽이라는 네덜란드의 비전에 상당한 차질을 빚습니다. 독일의 거부로 분더라인의 미래는 불투명해졌습니다. 이제 네덜란드는 흐로닝언 연결에 중점을 둔 축소판으로 사업을 진행할지, 아니면 지역 협력의 한계를 인정하고 계획을 완전히 포기할지 결정해야 합니다."
 HOL_economy.004.a: "적어도 흐로닝언까지는 철도를 건설한다"
 HOL_economy.004.b: "계획을 폐기한다"
 HOL_economy.005.t: "네덜란드, HSL-Oost 통합 제안"
 HOL_economy.005.d: "유럽의 교통망을 더욱 통합하기 위해 네덜란드는 HSL-Oost 고속철도를 독일의 기존 인프라에 통합하자고 제안했습니다. 이 구상은 두 나라 사이에 끊김 없는 고속 연결을 만들어 국경을 넘나드는 이동과 경제 교류에 혁신을 가져올 수 있는 것을 목표로 합니다. 성공하면 이 사업은 국경 간 수송의 효율을 높일 뿐 아니라 네덜란드와 독일 사이의 경제적 유대와 협력을 강화하여 유럽 통합의 중요한 이정표가 될 수 있습니다."
 HOL_economy.005.a: "하이(high) 스피드로 대마초까지"
 HOL_economy.005.b: "어차피 우리는 고속으로 달리지 않는다"
 HOL_economy.006.t: "독일, HSL-Oost 사업 승인"
 HOL_economy.006.d: "독일 정부는 HSL-Oost(동부 고속선) 사업에 참여하기로 공식 합의했습니다. 이 공동 사업은 네덜란드와 독일 사이에 끊김 없는 고속철도 연결을 만들어 유럽 전역의 경제 협력, 이동성, 전략적 인프라 유대를 촉진할 것입니다."
 HOL_economy.006.a: "훌륭하다! 즉시 건설에 착수하라."
 HOL_economy.007.t: "독일, HSL-Oost 사업 거부"
 HOL_economy.007.d: "독일 정부는 HSL-Oost(동부 고속선) 사업 참여를 공식적으로 거부했습니다. 네덜란드의 외교적 노력에도 불구하고 베를린은 독일 영내로의 확장이 현재로서는 경제성이 없다고 판단했습니다. 이제 네덜란드는 국경까지 노선 건설을 계속할지, 아니면 사업을 완전히 포기할지 결정해야 합니다."
 HOL_economy.007.a: "독일 국경까지 건설을 계속한다."
 HOL_economy.007.b: "HSL-Oost 사업을 전면 취소한다."
 HOL_economy.008.t: "네덜란드, §Y[BEL.GetNameWithFlag]§!와(과) 3개국 노선 제안"
 HOL_economy.008.d: "네덜란드는 네덜란드, §Y[BEL.GetNameWithFlag]§!, §Y[GER.GetNameWithFlag]§!을(를) 포괄적인 철도망으로 연결하려는 야심 찬 철도 사업인 새로운 3개국 노선을 제안하며 대담한 발걸음을 내디뎠습니다. 이 사업은 세 나라 사이의 무역, 이동, 경제 통합을 증진할 것으로 기대되며 국경 간 수송의 판도를 바꿀 가능성이 있다고 평가됩니다. 이 제안은 유럽의 단결을 강화하고 지역 인프라를 개선하려는 네덜란드의 의지를 보여 줍니다. 그러나 이 사업의 성공 여부는 §Y[BEL.GetNameWithFlag]§!와(과) 독일의 협력과 지지에 달려 있습니다."
 HOL_economy.008.a: "무엇이 잘못될 수 있겠는가? 훌륭한 생각이다!"
 HOL_economy.008.b: "벨기에는 먼저 도로나 고쳐야 한다"
 HOL_economy.009.t: "§Y[HOL.GetNameWithFlag]§!, §Y[GER.GetNameWithFlag]§!와(과) 함께 3개국 노선 제안"
 HOL_economy.009.d: "§Y[HOL.GetNameWithFlag]§!은(는) §Y[GER.GetNameWithFlag]§!와(과) 협력하여 3개국 노선 개발 제안을 추진했습니다. 이 사업은 네덜란드, §Y[GER.GetNameWithFlag]§!, §Y[BEL.GetNameWithFlag]§! 사이에 끊김 없는 철도 연결을 구축하여 유럽의 수송과 경제 교류를 위한 새로운 회랑을 만드는 것을 목표로 합니다. 네덜란드와 §Y[GER.GetNameWithFlag]§!의 공동 노력은 더욱 긴밀히 연결된 유럽에 대한 공통의 비전을 반영합니다. 이제 마지막 퍼즐 조각은 벨기에의 손에 달려 있으며, 이 사업이 실현되려면 벨기에의 동의가 필수적입니다. 그 결과가 이 야심 찬 계획의 성사 여부를 결정할 것입니다."
 HOL_economy.009.a: "도로 위에 철도를!"
 HOL_economy.009.b: "우리는 돈 쓰는 것을 좋아하지 않는다"
 HOL_economy.010.t: "§Y[BEL.GetNameWithFlag]§!와(과) §Y[GER.GetNameWithFlag]§!, 3개국 노선 수락"
 HOL_economy.010.d: "획기적인 결정으로 §Y[BEL.GetNameWithFlag]§!와(과) §Y[GER.GetNameWithFlag]§! 모두 3개국 노선 개발에 참여하기로 합의했으며, 이는 유럽 교통 협력의 중요한 성과입니다. 이 합의는 연결성을 높이고, 이동 시간을 단축하며, 세 나라 사이의 경제적 유대를 강화할 새로운 철도 회랑 건설의 길을 열어 줍니다. 이 사업의 성공적인 협상은 더욱 통합되고 번영하는 유럽을 위해 함께 노력하겠다는 네덜란드, §Y[BEL.GetNameWithFlag]§!, 독일의 의지를 보여 주는 증거입니다. 이 철도 사업은 유럽 인프라 역사의 이정표가 될 것입니다."
 HOL_economy.010.a: "철도 교통의 유럽적 이정표!"
 HOL_economy.011.t: "네덜란드, 2개국 열차 제안"
 HOL_economy.011.d: "독일이 3개국 노선을 거부한 후, 네덜란드는 대안으로 네덜란드와 §Y[BEL.GetNameWithFlag]§!을(를) 직접 연결하도록 설계된 2개국 열차를 제안했습니다. 이 새로운 제안은 원래 계획의 폭넓은 범위에는 미치지 못하지만, 양자 관계를 개선하고 지역 수송을 향상한다는 점에서 여전히 상당한 이점을 제공합니다. 이 대안의 성공 여부는 벨기에가 기꺼이 협력하고 사업에 투자할지에 달려 있습니다. 네덜란드는 규모가 작더라도 교통 인프라를 발전시키겠다는 의지를 굽히지 않고 있습니다."
 HOL_economy.011.a: "네덜란드와 협력하여 2개국 노선을 개발한다"
 HOL_economy.011.b: "우리에게는 이미 최고의 철도가 있다"
 HOL_economy.012.t: "§Y[BEL.GetNameWithFlag]§!만 3개국 노선에 동의"
 HOL_economy.012.d: "독일은 참여를 거부했지만 §Y[BEL.GetNameWithFlag]§!은(는) 3개국 노선 사업을 진행할 의향을 밝혔습니다. 이 부분적인 합의는 네덜란드에 어려운 결정을 남깁니다. 규모가 축소되더라도 §Y[BEL.GetNameWithFlag]§!과(와) 함께 사업을 진행할지, 아니면 계획 전체를 재고할지입니다. 독일의 불참은 사업을 복잡하게 만들지만 지역 연결성에 미칠 잠재적 영향을 줄이지는 않습니다. 네덜란드는 이제 §Y[BEL.GetNameWithFlag]§!과(와)의 협력이 주는 이점과 완전한 국제적 지지 없이 추진하는 데 따르는 어려움을 저울질해야 합니다."
 HOL_economy.012.a: "좋다... 그러자꾸나"
 HOL_economy.013.t: "§Y[BEL.GetNameWithFlag]§!와(과) §Y[GER.GetNameWithFlag]§!, 3개국 노선 거부"
 HOL_economy.013.d: "실망스러운 사태 전개로 §Y[BEL.GetNameWithFlag]§!와(과) §Y[GER.GetNameWithFlag]§! 모두 3개국 노선 제안을 거부했으며, 이는 포괄적인 국경 간 철도망이라는 네덜란드의 구상을 사실상 중단시켰습니다. 이 거부는 상당한 차질로, 네덜란드가 교통 전략을 재평가하도록 만듭니다. 원래 계획이 더는 실현 가능하지 않으므로, 네덜란드 국경 안의 기존 노선을 개선하거나 자원을 다른 국가 사업에 재배분하는 등 대안으로 중점을 옮겨야 합니다. 이 결과는 국제 협력의 어려움과 지역 인프라 개발의 복잡성을 보여 줍니다."
 HOL_economy.013.a: "자금을 암스테르담-마스트리흐트 노선에 투자한다"
 HOL_economy.014.t: "네덜란드, 우리의 바이오에탄올 생산에 투자"
 HOL_economy.014.d: "네덜란드 다국적 기업 DSM이 사우스다코타에 바이오에탄올 공장을 설립하면서 지속 가능한 에너지 개발의 새로운 장이 열립니다. 첨단 생명공학 기술을 활용하는 이 공장들은 주의 풍부한 농업 생산물을 탄소 배출과 화석 연료 의존을 줄이기 위한 재생 에너지원인 바이오에탄올로 전환할 것입니다. 이 구상은 사우스다코타의 에너지 인프라를 강화할 뿐 아니라 지역에 수많은 일자리도 창출합니다. DSM의 투자는 네덜란드와 미국 사이의 경제 협력이 커지고 있음을 보여 주며, 청정 에너지로 향하는 세계적 전환에서 중요한 진전을 이룬 것입니다."
 HOL_economy.014.a: "네덜란드에게 좋은 일이다"
 HOL_economy.015.t: "고속철도 협력 제안: 암스테르담-브뤼셀(HSL Zuid)"
 HOL_economy.015.d: "네덜란드는 암스테르담과 브뤼셀을 연결하는 고속철도 HSL Zuid를 건설하기 위해 §Y[BEL.GetNameWithFlag]§!과(와) 공동 인프라 사업을 제안하고 있습니다. 이 사업은 이동 시간을 크게 줄이고, 양국의 경제적 유대를 강화하며, 지역 연결성을 높이는 현대적인 철도 회랑을 만들 것입니다. 네덜란드는 이 혁신적인 사업에서 §Y[BEL.GetNameWithFlag]§!과(와) 함께 일하기를 열망합니다. §Y[BEL.GetNameWithFlag]§!은(는) 이 고속 연결을 만드는 데 동참하겠습니까?"
 HOL_economy.015.a: "네덜란드와 함께 HSL Zuid를 건설한다"
 HOL_economy.015.b: "HSL Zuid 협력을 거절한다"
 HOL_economy.016.t: "§Y[BEL.GetNameWithFlag]§!, HSL Zuid 협력 수락"
 HOL_economy.016.d: "§Y[BEL.GetNameWithFlag]§!은(는) 암스테르담과 브뤼셀을 연결하는 고속철도 HSL Zuid 건설에 네덜란드와 함께하기로 합의했습니다. 이 공동 사업은 지역 연결성을 크게 개선하고, 이동 시간을 단축하며, 양국의 경제적, 문화적 유대를 강화할 것입니다. 양국이 이 사업에 헌신하기로 한 만큼 고속철도 건설이 곧 시작될 예정이며, 이는 유럽 교통의 새로운 시대를 열 것입니다."
 HOL_economy.016.a: "HSL Zuid 건설에 착수한다"
 HOL_economy.017.t: "§Y[BEL.GetNameWithFlag]§!, HSL Zuid 협력 거절"
 HOL_economy.017.d: "§Y[BEL.GetNameWithFlag]§!은(는) 안타깝게도 고속철도 HSL Zuid 사업에 협력하지 않기로 결정했습니다. 이러한 차질에도 불구하고 네덜란드는 결정을 내려야 합니다. 벨기에 국경까지 HSL Zuid 사업을 진행할 것인가, 아니면 계획을 완전히 폐기할 것인가. 국경까지 고속 연결을 건설하면 여전히 지역 수송을 향상하고 향후 협력의 토대를 마련할 수 있지만, 상당한 투자가 필요합니다."
 HOL_economy.017.a: "국경까지 HSL Zuid를 건설한다"
 HOL_economy.017.b: "HSL Zuid 사업을 폐기한다"
 HOL_economy.018.t: "독일로의 베튜웨 노선 연장 제안"
 HOL_economy.018.d: "네덜란드는 두 나라 사이의 무역과 수송 효율을 높이기 위해 핵심 화물 철도 노선인 베튜웨 노선을 독일까지 연장할 것을 제안합니다. 이 연장은 경제적 유대를 강화하고 화물을 위한 더 효율적인 경로를 만들어 네덜란드와 독일 모두의 경제 성장을 뒷받침할 것입니다. 독일은 이 중요한 인프라 사업에 협력하는 데 동의하겠습니까?"
 HOL_economy.018.a: "네덜란드와 함께 베튜웨 노선 연장을 추진한다"
 HOL_economy.018.b: "베튜웨 노선 연장 사업을 거절한다"
 HOL_economy.019.t: "독일, 베튜웨 노선 협력 수락"
 HOL_economy.019.d: "독일은 베튜웨 노선 연장에 네덜란드와 협력하기로 합의했습니다. 이 화물 철도 연결은 두 나라 사이의 무역 경로를 크게 개선하여 화물을 더 빠르고 효율적으로 운송할 수 있게 해 줄 것입니다. 양국이 사업에 헌신하기로 한 만큼 건설이 곧 시작될 것이며, 이는 지역 무역과 수송의 커다란 진전입니다."
 HOL_economy.019.a: "베튜웨 노선 연장 건설에 착수한다"
 HOL_economy.020.t: "독일, 베튜웨 노선 협력 거절"
 HOL_economy.020.d: "독일은 베튜웨 노선 연장 사업에 협력하지 않기로 결정했습니다. 그럼에도 네덜란드는 이제 화물 철도 노선을 독일 국경까지 연장할지, 아니면 사업을 완전히 포기할지 결정해야 합니다. 국경까지 노선을 완공하면 여전히 국내 화물 수송을 향상하고 향후 무역 성장에 대비할 수 있습니다."
 HOL_economy.020.a: "독일 국경까지 베튜웨 노선을 건설한다"
 HOL_economy.020.b: "베튜웨 노선 연장 사업을 폐기한다"
 HOL_economy.021.t: "ASML 확장 제안"
 HOL_economy.021.d: "네덜란드는 기술 투자와 경제 성장을 대가로 귀국 영내에 ASML 시설을 건설할 것을 제안했습니다. 이 동반자 관계를 수락하시겠습니까?"
 HOL_economy.021.a: "제안을 수락한다"
 HOL_economy.021.b: "제안을 거절한다"
 HOL_economy.022.t: "[FROM.GetName], ASML 확장 승인"
 HOL_economy.022.d: "ASML 시설 건설 제안이 [ROOT.GetName]의 승인을 받았습니다. 이는 경제적, 기술적 유대를 강화하는 중요한 진전입니다."
 HOL_economy.022.a: "훌륭한 소식이다!"
 HOL_economy.023.t: "[FROM.GetName], ASML 확장 거절"
 HOL_economy.023.d: "[FROM.GetName]은(는) 자국 영내에 ASML 시설을 건설하자는 네덜란드의 제안을 거절했습니다. 이는 우리의 세계적 확장 노력에 차질입니다."
 HOL_economy.023.a: "유감이지만 우리는 계속 나아갈 것이다."
 HOL_economy.024.t: "네덜란드의 제안: 델타-라인 에너지 회랑"
 HOL_economy.024.d: "네덜란드 정부는 대규모 인프라 및 에너지 구상인 델타-라인 에너지 회랑을 제안했습니다. 이 사업은 파이프라인, 수소, 전력망을 결합하여 네덜란드의 해상 에너지 거점과 항만 시설을 라인강을 통해 독일의 산업 지역과 연결할 것입니다. 이는 장기적인 경제적 이익과 지역 에너지 통합을 약속합니다. 이를 지지하시겠습니까?"
 HOL_economy.024.a: "델타-라인 회랑을 승인한다"
 HOL_economy.024.b: "제안을 거절한다. 우리는 에너지 주권을 지켜야 한다"
 HOL_economy.025.t: "독일, 델타-라인 회랑 수락"
 HOL_economy.025.d: "독일은 델타-라인 에너지 회랑에 대한 우리의 제안을 수락했습니다. 우리의 항만을 라인강 유역과 연결하는 초국가적 에너지 및 물류망의 건설이 시작될 것입니다. 이는 북해 에너지 거점으로서 우리의 영향력을 강화하고 유럽 산업의 핵심부에 우리를 더 가까이 데려다 줍니다."
 HOL_economy.025.a: "중요한 한 걸음이다."
 HOL_economy.026.t: "독일, 델타-라인 회랑 거부"
 HOL_economy.026.d: "독일은 에너지 독립에 대한 우려와 인프라에 대한 전략적 통제를 이유로 델타-라인 에너지 회랑 참여를 거절했습니다. 실망스럽지만, 이 결과는 우리가 지역 협력을 위한 다른 길을 모색하도록 합니다."
 HOL_economy.026.a: "차질이지만 끝은 아니다."
 HOL_military.001.t: "네덜란드, BAE 시스템즈 투자 제안"
 HOL_military.001.d: "네덜란드는 영국 정부와 BAE 시스템즈에 유럽 최대 방산 업체 중 하나에 투자하겠다는 제안을 해 왔습니다. 네덜란드 정부는 영국과의 유대를 강화하고 첨단 방위 기술에 접근하고자 합니다. 이 투자는 연구 개발과 생산을 위한 추가 자본을 제공하여 BAE 시스템즈에 이익이 되는 한편, 네덜란드와 영국 사이의 더 긴밀한 군사 협력을 촉진할 것입니다. 네덜란드의 이 투자를 허용하시겠습니까?"
 HOL_military.001.a: "네덜란드의 BAE 시스템즈 투자를 허용한다"
 HOL_military.001.b: "네덜란드의 투자 제안을 거절한다"
 HOL_military.002.t: "네덜란드, 나발 그룹 투자 제안"
 HOL_military.002.d: "네덜란드 정부는 프랑스의 선도적인 해군 방산 기업인 나발 그룹에 투자하는 데 관심을 표명했습니다. 네덜란드는 첨단 해군 기술 개발에 기여함으로써 프랑스와의 유대를 강화하고자 합니다. 이 투자는 연구, 조선, 첨단 해양 체계 개발을 위한 새로운 재원을 제공하여 나발 그룹의 역량을 높일 것입니다. 방위 분야에서 프랑스와 네덜란드의 협력을 심화하는 네덜란드의 투자를 수락해야 하겠습니까?"
 HOL_military.002.a: "네덜란드의 나발 그룹 투자를 허용한다"
 HOL_military.002.b: "네덜란드의 투자 제안을 거절한다"
 HOL_military.003.t: "네덜란드, 레오나르도 투자 제안"
 HOL_military.003.d: "네덜란드는 이탈리아 굴지의 항공우주 및 방산 기업 중 하나인 레오나르도에 투자하겠다고 제안했습니다. 네덜란드 정부의 제안은 항공 및 방위 기술 분야의 공동 사업을 통해 이탈리아와의 유대를 강화하려는 의지를 보여 줍니다. 이 투자는 레오나르도에 첨단 항공우주 체계와 방위 사업을 위한 귀중한 자금을 제공할 것입니다. 이탈리아와 네덜란드 사이의 협력을 증진하도록 네덜란드의 투자를 허용해야 하겠습니까?"
 HOL_military.003.a: "네덜란드의 레오나르도 투자를 허용한다"
 HOL_military.003.b: "네덜란드의 투자 제안을 거절한다"
 HOL_military.004.t: "네덜란드, 라인메탈 투자 제안"
 HOL_military.004.d: "라인메탈은 네덜란드 정부로부터 투자 제안을 받았습니다. 네덜란드는 특히 장갑차와 군사 체계 개발 분야에서 이 선도적인 방산 업체에 투자함으로써 독일과의 협력을 심화하고자 합니다. 이 투자는 라인메탈에 생산 능력을 확대하고 군사 기술을 더욱 혁신할 추가 자원을 제공할 것입니다. 양국 방위 부문 간 협력을 강화하는 네덜란드의 투자를 승인해야 하겠습니까?"
 HOL_military.004.a: "네덜란드의 라인메탈 투자를 허용한다"
 HOL_military.004.b: "네덜란드의 투자 제안을 거절한다"
 HOL_military.005.t: "네덜란드, 사브 AB 투자 제안"
 HOL_military.005.d: "네덜란드 정부는 스웨덴과 네덜란드 사이의 방위 유대를 강화하기 위한 투자 제안을 들고 사브 AB에 접근했습니다. 네덜란드는 특히 전투기와 미사일 체계 분야에서 사브의 첨단 항공우주 및 방위 프로그램에 기여하기를 희망합니다. 이 투자는 사브에 핵심 분야의 개발과 혁신을 가속할 추가 자금을 제공할 것입니다. 방위 분야에서 우리의 동반자 관계를 더욱 강화할 이 네덜란드의 투자를 허용해야 하겠습니까?"
 HOL_military.005.a: "네덜란드의 사브 AB 투자를 허용한다"
 HOL_military.005.b: "네덜란드의 투자 제안을 거절한다"
 HOL_military.006.t: "[FROM.GetNameWithFlag], 네덜란드의 방위 투자 수락"
 HOL_military.006.d: "[FROM.GetNameWithFlag] 정부는 자국 방위 산업에 투자하겠다는 네덜란드의 제안을 수락했습니다. 이 협력은 [FROM.GetNameWithFlag]와(과)의 방위 유대를 강화하고 첨단 군사 기술에 접근하는 데 있어 중요한 진전입니다. 네덜란드는 이제 [FROM.GetNameWithFlag]의 방위 부문과 긴밀히 협력하여 양국의 군수 산업 역량을 높이고 유럽 전체의 방위 준비태세에 기여할 수 있습니다."
 HOL_military.006.a: "강화된 동반자 관계를 기념한다"
 HOL_military.007.t: "[FROM.GetNameWithFlag], 네덜란드의 방위 투자 거절"
 HOL_military.007.d: "[FROM.GetNameWithFlag] 정부는 안타깝게도 자국 방위 산업에 투자하겠다는 네덜란드의 제안을 거절했습니다. 이 결정으로 [FROM.GetNameWithFlag]와(과)의 방위 유대를 심화하고 핵심 군사 기술에 접근할 우리의 능력이 제한됩니다. 이 결과는 실망스럽지만, 우리는 유럽의 다른 곳에서 방위 산업과 동반자 관계를 강화할 대안적 기회를 찾아야 합니다."
 HOL_military.007.a: "차질이지만 우리는 계속 나아갈 것이다"
 HOL_military.008.t: "네덜란드, QRA 협력 제안"
 HOL_military.008.d: "네덜란드는 긴급 대응 경보(QRA) 체계의 구축을 제안했습니다. 네덜란드는 §Y[BEL.GetNameWithFlag]§!에 공동 베네룩스 방공 체계에 참여할 것을 요청합니다. 이를 수락하면 지역 내 군사 협력을 강화할 수 있습니다."
 HOL_military.008.a: "QRA 제안을 수락한다"
 HOL_military.008.b: "QRA 제안을 거절한다"
 HOL_military.009.t: "§Y[BEL.GetNameWithFlag]§!와(과) 네덜란드, QRA 협력 제안"
 HOL_military.009.d: "벨기에가 QRA 체계를 수락한 데 이어, 네덜란드는 이제 룩셈부르크에 초청장을 보냅니다. 이 체계는 베네룩스 전 지역의 공동 방공 체계를 구축할 것입니다. 룩셈부르크는 이 역사적인 협력에 참여하겠습니까?"
 HOL_military.009.a: "QRA 제안을 수락한다"
 HOL_military.009.b: "QRA 제안을 거절한다"
 HOL_military.010.t: "§Y[BEL.GetNameWithFlag]§!, 베네룩스 QRA 참여에 동의"
 HOL_military.010.d: "§Y[BEL.GetNameWithFlag]§!은(는) 공동 베네룩스 방공 체계를 구축하자는 네덜란드의 제안을 수락했습니다. 다음 단계는 룩셈부르크에 제안을 전달하는 것입니다."
 HOL_military.010.a: "훌륭하다! 앞으로 나아가자."
 HOL_military.011.t: "§Y[BEL.GetNameWithFlag]§!, QRA 제안 거절"
 HOL_military.011.d: "§Y[BEL.GetNameWithFlag]§!은(는) 베네룩스 긴급 대응 경보 체계 참여 제안을 거절하여 이 구상은 무산되었습니다."
 HOL_military.011.a: "유감이다."
 HOL_military.012.t: "[LUX.GetNameWithFlag], 베네룩스 QRA 참여에 동의"
 HOL_military.012.d: "룩셈부르크는 베네룩스 긴급 대응 경보 체계 참여 초청을 수락했습니다. 네덜란드, §Y[BEL.GetNameWithFlag]§!, 룩셈부르크에 걸친 방공 협력의 새 시대가 시작됩니다."
 HOL_military.012.a: "훌륭하다! 이는 지역에 이익이 될 것이다."
 HOL_military.013.t: "룩셈부르크, QRA 제안 거절"
 HOL_military.013.d: "룩셈부르크는 베네룩스 긴급 대응 경보 체계 참여 제안을 거절했습니다. 지역 전체의 완전한 협력은 실현되지 않을 것입니다."
 HOL_military.013.a: "실망스럽다."
 HOL_military.014.t: "베네룩스 QRA 구축"
 HOL_military.014.d: "§Y[HOL.GetNameWithFlag]§!, §Y[BEL.GetNameWithFlag]§!, §Y[LUX.GetNameWithFlag]§! 사이에 긴급 대응 경보(QRA) 체계가 성공적으로 구축되었습니다. 이 새로운 동맹은 지역에 강력한 협력 방공 체계를 제공할 것입니다."
 HOL_military.014.a: "지역을 위한 강력한 동맹이다!"
 HOL_military.015.t: "베네룩스 항공 지휘 통제 센터 제안"
 HOL_military.015.d: "네덜란드는 지역 방공 조율을 강화하기 위해 베네룩스 항공 지휘 통제 센터(BENECC)의 설립을 제안했습니다. §Y[BEL.GetNameWithFlag]§!이(가) 참여하면 다음 단계는 룩셈부르크를 초청하는 것입니다."
 HOL_military.015.a: "BENECC 제안을 수락한다"
 HOL_military.015.b: "BENECC 제안을 거절한다"
 HOL_military.016.t: "베네룩스 항공 지휘 통제 센터 제안"
 HOL_military.016.d: "벨기에가 베네룩스 항공 지휘 통제 센터(BENECC) 구상을 수락한 데 이어, 룩셈부르크가 참여를 초청받고 있습니다. 이는 베네룩스 국가 전체에 걸친 공동 방공 조율 체계를 구축할 것입니다."
 HOL_military.016.a: "BENECC 제안을 수락한다"
 HOL_military.016.b: "BENECC 제안을 거절한다"
 HOL_military.017.t: "§Y[BEL.GetNameWithFlag]§!, BENECC 참여에 동의"
 HOL_military.017.d: "§Y[BEL.GetNameWithFlag]§!은(는) 베네룩스 항공 지휘 통제 센터(BENECC)를 설립하자는 네덜란드의 제안을 수락했습니다. 다음 단계는 룩셈부르크에 제안을 전달하는 것입니다."
 HOL_military.017.a: "훌륭하다! 앞으로 나아가자."
 HOL_military.018.t: "§Y[BEL.GetNameWithFlag]§!, BENECC 제안 거부"
 HOL_military.018.d: "§Y[BEL.GetNameWithFlag]§!은(는) 베네룩스 항공 지휘 통제 센터(BENECC) 설립 제안을 거절하여 이 구상은 무산되었습니다."
 HOL_military.018.a: "유감이다."
 HOL_military.019.t: "룩셈부르크, BENECC 참여에 동의"
 HOL_military.019.d: "룩셈부르크는 베네룩스 항공 지휘 통제 센터(BENECC) 참여 초청을 수락했습니다. 세 나라가 모두 합의함에 따라 BENECC가 이제 설립될 것입니다."
 HOL_military.019.a: "좋다! 계획이 추진되고 있다."
 HOL_military.020.t: "룩셈부르크, BENECC 제안 거부"
 HOL_military.020.d: "룩셈부르크는 베네룩스 항공 지휘 통제 센터(BENECC) 설립 제안을 거절하여 협력 방공 구상이 중단되었습니다."
 HOL_military.020.a: "실망스럽다."
 HOL_military.021.t: "BENECC 설립"
 HOL_military.021.d: "모든 베네룩스 국가의 수락으로 베네룩스 항공 지휘 통제 센터(BENECC)가 성공적으로 설립되었습니다. 우리의 방공 조율이 크게 강화되었습니다."
 HOL_military.021.a: "훌륭하다!"
 HOL_military.022.t: "베네룩스 항공 항행 위원회 제안"
 HOL_military.022.d: "네덜란드는 지역의 항공 항행 조율을 더욱 강화하기 위해 베네룩스 항공 항행 위원회(BNLC)의 설립을 제안했습니다. §Y[BEL.GetNameWithFlag]§!이(가) 참여하면 다음 단계는 룩셈부르크를 초청하는 것입니다."
 HOL_military.022.a: "BNLC 제안을 수락한다"
 HOL_military.022.b: "BNLC 제안을 거절한다"
 HOL_military.023.t: "베네룩스 항공 항행 위원회 제안"
 HOL_military.023.d: "§Y[BEL.GetNameWithFlag]§!이(가) 베네룩스 항공 항행 위원회(BNLC) 구상을 수락한 데 이어, 룩셈부르크가 참여를 초청받고 있습니다. 이는 베네룩스 국가 전체에 걸친 공동 항공 항행 조율 체계를 구축할 것입니다."
 HOL_military.023.a: "BNLC 제안을 수락한다"
 HOL_military.023.b: "BNLC 제안을 거절한다"
 HOL_military.024.t: "§Y[BEL.GetNameWithFlag]§!, BNLC 참여에 동의"
 HOL_military.024.d: "§Y[BEL.GetNameWithFlag]§!은(는) 베네룩스 항공 항행 위원회(BNLC)를 설립하자는 네덜란드의 제안을 수락했습니다. 다음 단계는 룩셈부르크에 제안을 전달하는 것입니다."
 HOL_military.024.a: "훌륭하다! 앞으로 나아가자."
 HOL_military.025.t: "§Y[BEL.GetNameWithFlag]§!, BNLC 제안 거부"
 HOL_military.025.d: "§Y[BEL.GetNameWithFlag]§!은(는) 베네룩스 항공 항행 위원회(BNLC) 설립 제안을 거절하여 이 구상은 무산되었습니다."
 HOL_military.025.a: "유감이다."
 HOL_military.026.t: "룩셈부르크, BNLC 참여에 동의"
 HOL_military.026.d: "룩셈부르크는 베네룩스 항공 항행 위원회(BNLC) 참여 초청을 수락했습니다. 세 나라가 모두 합의함에 따라 BNLC가 이제 설립될 것입니다."
 HOL_military.026.a: "좋다! 계획이 추진되고 있다."
 HOL_military.027.t: "룩셈부르크, BNLC 제안 거부"
 HOL_military.027.d: "룩셈부르크는 베네룩스 항공 항행 위원회(BNLC) 설립 제안을 거절하여 협력 항공 항행 구상이 중단되었습니다."
 HOL_military.027.a: "실망스럽다."
 HOL_military.028.t: "BNLC 설립"
 HOL_military.028.d: "모든 베네룩스 국가의 수락으로 베네룩스 항공 항행 위원회(BNLC)가 성공적으로 설립되었습니다. 우리의 항공 항행 조율이 크게 강화되었습니다."
 HOL_military.028.a: "훌륭하다!"
 HOL_military.029.t: "네덜란드: 에어버스 MRTT 구매"
 HOL_military.029.d: "네덜란드는 에어버스 MRTT 수송기 50대를 구매할 기회를 얻었습니다. 참여하는 베네룩스 국가가 많을수록 비용은 낮아집니다."
 HOL_military.029.a: "에어버스 MRTT를 구매한다"
 HOL_military.029.b: "제안을 거절한다"
 HOL_military.030.t: "[BEL.GetNameWithFlag]: 에어버스 MRTT 구매"
 HOL_military.030.d: "§Y[BEL.GetNameWithFlag]§!은(는) 에어버스 MRTT 수송기 50대를 구매할 기회를 얻었습니다. 참여하는 베네룩스 국가가 많을수록 비용은 낮아집니다."
 HOL_military.030.a: "에어버스 MRTT를 구매한다"
 HOL_military.030.b: "제안을 거절한다"
 HOL_military.031.t: "룩셈부르크: 에어버스 MRTT 구매"
 HOL_military.031.d: "룩셈부르크는 에어버스 MRTT 수송기 50대를 구매할 기회를 얻었습니다. 참여하는 베네룩스 국가가 많을수록 비용은 낮아집니다."
 HOL_military.031.a: "에어버스 MRTT를 구매한다"
 HOL_military.031.b: "제안을 거절한다"
 HOL_military.032.t: "에어버스 캐시백 "
 HOL_military.032.d: "에어버스 MRTT 구매에 참여한 베네룩스 국가의 수에 따라 국고가 조정됩니다."
 HOL_military.032.a: "베네룩스의 이익"
 HOL_military.033.t: "F-35A 도착"
 HOL_military.033.d: "F-35A의 개발이 완료되었으며, 5세대 경전투기 기술의 연구가 완전히 끝났으므로 이제 F-35A 50대를 실전에 배치할 수 있습니다."
 HOL_military.033.a: "F-35A를 배치한다"
 HOL_military.034.t: "F-35C 도착"
 HOL_military.034.d: "5세대 함재기 연구가 완료됨에 따라, 이제 F-35C 50대를 배치하여 항공모함 작전에 투입할 수 있습니다."
 HOL_military.034.a: "F-35C를 배치한다"
 HOL_military.035.t: "미래 대공 방어함 프로그램 초청"
 HOL_military.035.d: "[FROM.GetName]은(는) 최첨단 방공 호위함을 건조하는 공동 프로그램을 제안합니다. 설계를 공유하고 조선소를 공동 운영하면 비용을 절감할 수 있으며, 프로그램이 종료되면 완성된 함선이 우리 해군에 직접 편입됩니다."
 HOL_military.035.a: "프로그램에 참여한다"
 HOL_military.035.b: "초청을 거절한다"
 HOL_military.036.t: "[FROM.GetName], 미래 대공 방어함 프로그램 참여"
 HOL_military.036.d: "[FROM.GetName]은(는) 미래 대공 방어함 프로그램에 참여하기로 약속하고 자국 조선소를 사업에 보태어 인도 시기를 앞당겼습니다."
 HOL_military.036.a: "함께 하늘과 바다를 지킨다."
 HOL_military.037.t: "[FROM.GetName], 미래 대공 방어함 프로그램 탈퇴"
 HOL_military.037.d: "[FROM.GetName]은(는) 미래 대공 방어함 프로그램을 끝까지 함께하지 않을 것입니다. 우리는 남은 협력국들과 계속 추진하며 부족분을 자체적으로 메울 것입니다."
 HOL_military.037.a: "우리는 계속 추진할 것이다."
 HOL_military.049.t: "제럴드 R. 포드급 항공모함 생산 요청"
 HOL_military.049.d: "네덜란드 정부는 제럴드 R. 포드급 항공모함 건조를 위해 미국과 공동 생산 협정을 맺자는 요청을 공식적으로 제출했습니다. 네덜란드는 해군 역량을 현대화하고 대서양 동반자와의 전략적 유대를 심화하고자 합니다. 워싱턴은 이제 이 합작 사업을 승인할지, 아니면 국내 우선순위를 이유로 거부할지 결정해야 합니다."
 HOL_military.049.a: "네덜란드의 요청을 승인한다"
 HOL_military.049.b: "요청을 거절한다"
 HOL_military.050.t: "미국, 항공모함 건조 거래 승인"
 HOL_military.050.d: "미국 정부는 네덜란드 왕립 해군을 위한 제럴드 R. 포드급 항공모함 생산을 지원하기로 합의했습니다. 미국의 건선거, 병참, 감독이 사업을 뒷받침할 것입니다. 전략적 협력의 상징이 이제 시작되었습니다."
 HOL_military.050.a: "기념비적인 방위 동반자 관계다."
 HOL_military.051.t: "미국, 항공모함 건조 요청 거부"
 HOL_military.051.d: "전략적 우려와 국내 정치적 압력을 이유로 미국 정부는 제럴드 R. 포드급 항공모함을 건조하자는 우리의 요청을 거부했습니다. 이는 우리의 해군 현대화 계획에 차질이며 대서양 횡단 협력에 대한 타격입니다."
 HOL_military.051.a: "대안을 모색해야 할 것이다."
 HOL_military.052.t: "퀸 엘리자베스급 항공모함 생산 요청"
 HOL_military.052.d: "네덜란드는 퀸 엘리자베스급 항공모함을 공동 개발하고 생산하자는 공식 요청을 영국 정부에 전달했습니다. 이 협력은 영국과 네덜란드의 해군 유대를 강화하고 북해와 그 너머에서의 해양 방위 단결을 보여 줄 것입니다. 이제 결정은 화이트홀에 달려 있습니다. 이 전략적 구상을 승인하겠습니까?"
 HOL_military.052.a: "네덜란드의 제안을 승인한다"
 HOL_military.052.b: "제안을 거절한다"
 HOL_military.053.t: "영국, 항공모함 협정 승인"
 HOL_military.053.d: "영국 정부는 퀸 엘리자베스급 항공모함 건조 협력 요청을 승인했습니다. 이 함선은 영국 해군의 표준과 조선소 역량을 활용하여 공동 설계 및 조립될 것입니다. 이는 영국과 네덜란드 해군 협력의 심화를 의미합니다."
 HOL_military.053.a: "해양 동맹의 현대적 부활이다."
 HOL_military.054.t: "영국, 항공모함 협력 거부"
 HOL_military.054.d: "영국은 퀸 엘리자베스급 항공모함을 공동 생산하자는 우리의 제안을 거부했습니다. 방위 독립과 산업 우선순위에 대한 우려가 이유로 제시되었습니다. 이는 북대서양에서의 우리 해군 야망에 차질입니다."
 HOL_military.054.a: "유감이지만 끝은 아니다."
 HOL_military.055.t: "샤를 드골급 항공모함 생산 요청"
 HOL_military.055.d: "네덜란드는 샤를 드골급 항공모함을 공동 생산하자는 요청을 프랑스 정부에 공식적으로 제출했습니다. 프랑스의 해군 전문 지식과 조선소 역량을 활용하여 네덜란드는 원양 해군 능력을 강화하고 프랑스와 네덜란드의 방위 유대를 심화하고자 합니다. 파리는 이제 협력을 승인할지, 아니면 국가의 해군 자율성을 지킬지 결정해야 합니다."
 HOL_military.055.a: "요청을 승인한다"
 HOL_military.055.b: "거절한다"
 HOL_military.056.t: "프랑스, 항공모함 협력 승인"
 HOL_military.056.d: "프랑스 정부는 네덜란드의 샤를 드골급 항공모함 건조를 지원하기로 합의했습니다. 이 사업은 해군 전문 지식, 전략적 조율, 병참 지원을 결합하여 공동 산업 활동을 통해 유럽의 해양 전력을 강화할 것입니다."
 HOL_military.056.a: "프랑스-네덜란드 단결의 진정한 증거다."
 HOL_military.057.t: "프랑스, 항공모함 협력 거부"
 HOL_military.057.d: "해군 주권과 생산 능력에 대한 우려를 이유로 프랑스는 샤를 드골급 항공모함 협력에 대한 네덜란드의 요청을 거부했습니다. 외교 채널은 여전히 열려 있지만, 이는 양국 방위 산업 협력의 차질입니다."
 HOL_military.057.a: "유럽 방위 통합의 놓친 기회다."
 HOL_military.058.t: "아드미랄 쿠즈네초프급 항공모함 생산 요청"
 HOL_military.058.d: "네덜란드 정부는 러시아 연방에 아드미랄 쿠즈네초프급 항공모함을 공동 생산하자는 공식 요청을 전달했습니다. 지정학적으로 이례적이지만 이러한 협력은 상호 전략적 이익을 제공하고 네덜란드가 해군 항공 능력을 빠르게 확대할 수 있게 해 줄 것입니다. 모스크바는 이제 어떻게 대응할지 결정해야 합니다."
 HOL_military.058.a: "제안을 수락한다"
 HOL_military.058.b: "요청을 거절한다"
 HOL_military.059.t: "러시아, 항공모함 생산 거래 승인"
 HOL_military.059.d: "대담한 지정학적 행보로 러시아 정부는 아드미랄 쿠즈네초프급 항공모함을 공동 생산하자는 네덜란드의 요청을 승인했습니다. 이 사업은 네덜란드의 자금 조달과 부분적인 승무원 통합을 통해 러시아의 해군 기반 시설에서 건조될 것입니다. 이 예상치 못한 동맹은 유럽의 해군 역학을 바꿔 놓을 수 있습니다."
 HOL_military.059.a: "파격적인 동맹이지만 강력한 동맹이다."
 HOL_military.060.t: "러시아, 항공모함 협력 거부"
 HOL_military.060.d: "크렘린은 쿠즈네초프급 항공모함 협력에 대한 네덜란드의 요청을 공식적으로 거부했습니다. 전략적 불신과 기술 이전에 대한 우려를 이유로 모스크바는 자국 해군 설계에 대한 완전한 국가적 통제를 유지하기로 했습니다."
 HOL_military.060.a: "처음부터 가능성이 희박한 일이었다."
 HOL_military.061.t: "산둥급 항공모함 생산 요청"
 HOL_military.061.d: "네덜란드는 중화인민공화국에 산둥급 항공모함을 건조하는 공동 생산 구상을 제안하는 공식 요청을 보냈습니다. 이 거래는 커지는 유라시아 방위 협력을 상징할 수 있으며 네덜란드 해군에 대대적인 해양 전력 향상을 가져다줄 것입니다. 베이징은 이제 유럽의 동반자를 도울지, 내부에 집중할지 결정해야 합니다."
 HOL_military.061.a: "승인한다: 중국의 세계적 리더십을 보여 준다"
 HOL_military.061.b: "거절한다: 우리 조선소는 우리의 이익에 봉사한다"
 HOL_military.062.t: "중국, 항공모함 건조 협정 승인"
 HOL_military.062.d: "중국은 산둥급 항공모함을 공동 건조하자는 네덜란드의 제안을 수락했습니다. 중국의 조선 전문 지식과 네덜란드의 투자를 활용하는 이 동반자 관계는 전략적이면서도 상징적입니다. 강력한 함선이 곧 공동 지휘 아래 건조에 들어갈 것입니다."
 HOL_military.062.a: "베이징의 부상하는 세계적 유대를 알리는 신호다."
 HOL_military.063.t: "중국, 항공모함 협력 거부"
 HOL_military.063.d: "베이징은 산둥급 항공모함 협력에 대한 우리의 요청을 거부했습니다. 중국 군수 생산에 대한 외국의 개입에 대한 우려와 변화하는 지정학적 연대가 이 결정에 영향을 미쳤을 것으로 보입니다."
 HOL_military.063.a: "예상했지만 여전히 실망스럽다."
 HOL_military.064.t: "라인메탈의 스토르크 PWV 인수"
 HOL_military.064.d: "라인메탈이 스토르크 PWV 인수를 제안하고 있습니다. 네덜란드 정부는 이 인수를 허용해야 하겠습니까?"
 HOL_military.064.a: "라인메탈의 인수를 허용한다"
 HOL_military.064.b: "인수를 차단한다"
 HOL_military.065.t: "2005 구축함 기술 이미 연구됨"
 HOL_military.065.d: "귀하는 이미 2005 구축함 기술의 연구를 완료했습니다. 스텔스 구축함의 발전에 집중하시겠습니까, 아니면 차세대 구축함 설계의 향상에 집중하시겠습니까?"
 HOL_military.065.a: "스텔스 구축함에 집중한다"
 HOL_military.065.b: "미사일 구축함에 집중한다"
 HOL_military.066.t: "플리싱언 해병대 이전 계획 폭로"
 HOL_military.066.d: "네덜란드 왕립 해병대를 플리싱언으로 이전하는 계획을 상세히 담은 기밀 보고서가 대중에게 유출되었습니다. 이 이전은 플리싱언의 전략적인 해안 위치를 활용하여 해병대의 작전 준비태세를 높이는 것을 목표로 합니다. 그러나 이 폭로는 정치인, 군 관계자, 지역 사회 사이에서 엇갈린 반응을 불러일으켰습니다."
 HOL_military.066.a: "이는 국가 안보에 이익이 될 전략적 결정이다."
 HOL_military.066.b: "이 조치의 영향을 신중히 고려해야 한다."
 HOL_military.066.c: "이 계획은 논란이 너무 크므로 포기해야 한다."
 HOL_military.067.t: "해병대 이전을 둘러싼 의회의 격렬한 논쟁"
 HOL_military.067.d: "네덜란드 의회는 해병대를 플리싱언으로 이전하자는 제안을 둘러싼 논쟁으로 떠들썩합니다. 지지자들은 이것이 국가 안보를 높이고 지역에 경제적 이익을 가져다줄 것이라고 주장합니다. 그러나 비판자들은 재정 비용과 지역 사회에 대한 잠재적 혼란을 우려합니다."
 HOL_military.067.a: "더 큰 대의를 위해 이전을 추진해야 한다."
 HOL_military.067.b: "모든 우려를 해소하는 절충안을 찾자."
 HOL_military.067.c: "이 계획을 중단하고 다른 선택지를 모색하는 것이 최선이다."
 HOL_military.068.t: "해병대 이전에 관한 공개 조사"
 HOL_military.068.d: "대중의 항의와 의회 논쟁 이후, 정부는 해병대를 플리싱언으로 이전하는 제안에 관해 더 많은 정보와 대중의 의견을 수집하기 위해 공개 조사를 실시하기로 했습니다."
 HOL_military.068.a: "조사는 우리에게 필요한 통찰을 제공할 것이다."
 HOL_military.068.b: "이는 우리의 전략적 결정을 지연시키고 있다. 조사를 중단하라."
 HOL_military.069.t: "해병대 이전 계획에 대한 대중의 반응"
 HOL_military.069.d: "해병대의 플리싱언 이전을 둘러싸고 여론이 갈라져 있습니다. 지역 주민들은 지역 사회에 미칠 잠재적 영향을 우려하는 반면, 국가 안보 옹호자들은 전략적 이점을 칭찬합니다. 이전에 대한 찬성자와 반대자 모두 시위와 집회를 조직하고 있습니다."
 HOL_military.069.a: "지역 주민들의 우려를 해소해야 한다."
 HOL_military.069.b: "이 이전의 이점을 대중에게 교육한다."
 HOL_military.069.c: "정부가 가장 잘 알고 있으므로 계획대로 추진할 것이다."
 HOL_military.070.t: "해병대 이전 절충안"
 HOL_military.070.d: "찬성과 반대를 모두 해소하기 위한 노력으로 절충안이 제안되었습니다. 여기에는 이전을 뒷받침하고 지역 사회에 미치는 영향을 완화하기 위한 지역 인프라에 대한 추가 투자가 포함되어 있습니다."
 HOL_military.070.a: "이 계획은 모든 이해관계의 균형을 맞추므로 승인해야 한다."
 HOL_military.070.b: "이 절충안을 검토할 시간이 더 필요하다."
 HOL_military.070.c: "이 절충안은 만족스럽지 않다. 새로운 계획이 필요하다."
 HOL_military.071.t: "해병대 이전 공개 조사 결과"
 HOL_military.071.d: "공개 조사가 종료되어 해병대의 플리싱언 이전이 가져올 잠재적 이점과 단점에 대한 상세한 통찰이 제시되었습니다. 보고서는 전략적 이점과 지역 사회의 우려를 모두 부각합니다."
 HOL_military.071.a: "조사는 전략적 이점을 뒷받침한다. 이전을 추진한다."
 HOL_military.071.b: "조사의 의견을 바탕으로 이전 전략을 조정한다."
 HOL_military.071.c: "제기된 우려가 너무 크다. 이전을 취소한다."
 HOL_military.072.t: "해병대 이전에 관한 지역 사회 대화"
 HOL_military.072.d: "정부는 플리싱언의 지역 사회들과 우려를 해소하고 이전의 이점에 대한 더 많은 정보를 제공하기 위한 일련의 대화를 시작했습니다."
 HOL_military.072.a: "지지를 얻기 위해 지역 사업에 투자한다."
 HOL_military.072.b: "모든 과정이 투명하고 포용적이도록 보장한다."
 HOL_military.073.t: "해병대 이전에 관한 전국 홍보 캠페인"
 HOL_military.073.d: "해병대의 플리싱언 이전이 가져올 전략적 이점을 대중에게 알리기 위한 전국적인 홍보 캠페인이 시작되었습니다."
 HOL_military.073.a: "더 넓은 대중에게 닿도록 더 많은 자원을 배정한다."
 HOL_military.073.b: "반대가 가장 심한 지역에 캠페인을 집중한다."
 HOL_military.074.t: "절충안의 경제적 영향"
 HOL_military.074.d: "절충안에는 지역 사회의 우려를 해소하기 위한 지역 인프라에 대한 추가 투자와 완화 조치가 포함되어 있습니다. 경제학자들은 이 계획과 관련된 잠재적 경제적 이익과 비용을 평가했습니다."
 HOL_military.074.a: "이 계획은 모든 이해관계의 균형을 맞추므로 승인해야 한다."
 HOL_military.074.b: "이 절충안을 검토할 시간이 더 필요하다."
 HOL_military.075.t: "절충안 연장 검토"
 HOL_military.075.d: "절충안에 대한 연장 검토가 종료되어 더 깊은 통찰과 추가적인 대중의 의견이 제시되었습니다. 정부는 이제 절충안을 추진할지, 아니면 새로운 대안을 모색할지 결정해야 합니다."
 HOL_military.075.a: "절충안을 추진한다"
 HOL_military.075.b: "새로운 대안을 모색한다"
 HOL_military.076.t: "해병대 이전에 대한 정부의 최종 결정"
 HOL_military.076.d: "수개월에 걸친 논쟁과 공론 끝에, 정부는 해병대의 플리싱언 이전에 대한 최종 결정을 내리려 하고 있습니다. 이 선택은 국가 안보, 경제 발전, 정부에 대한 대중의 신뢰에 오래도록 영향을 미칠 것입니다."
 HOL_military.076.a: "해병대는 계획대로 플리싱언으로 이전한다."
 HOL_military.076.b: "대중과 의회의 의견을 바탕으로 이전 전략을 조정한다."
 HOL_military.076.c: "해병대는 현재 기지에 남는다."
 HOL_military.077.t: "공동 대잠 호위함 건조 제안"
 HOL_military.077.d: "네덜란드는 신세대 대잠수함전(ASW) 호위함을 공동으로 개발하고 건조하기 위해 §Y[BEL.GetNameWithFlag]§!과(와)의 협력을 제안했습니다. 이 합의에 따라 각국은 함선 3척씩을 받게 되어 해군 협력을 강화하고 양국 함대의 미래 능력을 보장할 것입니다. 벨기에는 이제 이 제안을 수락할지 결정해야 합니다."
 HOL_military.077.a: "협력을 수락한다: 더 강력한 북해 함대!"
 HOL_military.077.b: "제안을 거절한다: 국내 대안을 추진한다."
 HOL_military.078.t: "§Y[BEL.GetNameWithFlag]§!, 대잠 호위함 협력 수락"
 HOL_military.078.d: "§Y[BEL.GetNameWithFlag]§!은(는) 신세대 대잠수함전(ASW) 호위함을 공동으로 건조하자는 우리의 제안을 수락했습니다. 양국이 사업에 헌신하기로 한 만큼 이제 생산을 시작할 수 있으며, 이는 우리의 해군력을 강화하고 방위 동반자 관계를 심화합니다."
 HOL_military.078.a: "함께 바다를 지킨다."
 HOL_military.079.t: "§Y[BEL.GetNameWithFlag]§!, 대잠 호위함 협력 거부"
 HOL_military.079.d: "§Y[BEL.GetNameWithFlag]§!은(는) 신세대 대잠수함전(ASW) 호위함을 공동으로 건조하자는 우리의 제안을 거절했습니다. 서로 다른 우선순위와 전략적 우려를 이유로 벨기에는 독자적으로 자국의 해군 현대화 노선을 추구하기로 했습니다."
 HOL_military.079.a: "유감이다. 우리 단독으로 추진할 것이다."
 HOL_military.083.t: "네덜란드의 군사 위기"
 HOL_military.083.d: "네덜란드가 더는 국제적 지원의 혜택을 받지 못하는 가운데, 군수 생산의 자급자족 부족이 우리 군을 위기에 빠뜨렸습니다. 장비 부족이 우리의 작전 능력을 심각하게 저해하고 있어, 이 중대한 시기에 위험할 정도로 취약한 상태입니다."
 HOL_military.083.a: "이 위기에 신속히 대처해야 한다!"
 HOL_military.084.t: "네덜란드의 우주 협력 제안"
 HOL_military.084.d: "네덜란드는 우주 연구와 기술 발전에서 국제 협력을 강화하자는 제안을 우리에게 해 왔습니다. 네덜란드는 공동 개발 프로그램을 제안하며, 이는 민간 우주 인프라와 궤도 기술 분야에서 획기적인 발견으로 이어질 수 있습니다."
 HOL_military.084.a: "수락하고 동반자 관계에 투자한다."
 HOL_military.084.b: "네덜란드의 제안을 거절한다."
 HOL_military.085.t: "우주 협력 거부"
 HOL_military.085.d: "[ROOT.GetName]은(는) 국가 안보와 자원 배분에 대한 우려를 이유로 우주 연구에서 우리와 협력하는 것을 거부했습니다. 이 차질은 첨단 우주 기술에서 우리가 발전할 능력을 제한합니다."
 HOL_military.085.a: "유감스러운 소식이다."
 HOL_military.086.t: "성공적인 우주 동반자 관계"
 HOL_military.086.d: "[ROOT.GetName]은(는) 우주 연구에서 네덜란드와 협력하기로 합의했습니다. 이 동반자 관계는 공유된 기술 발전의 새로운 기회를 제공하고 우주 탐사에 대한 우리의 전문성을 심화할 것입니다."
 HOL_military.086.a: "성간 진보를 향한 강력한 한 걸음이다!"
 HOL_military.087.t: "민간 우주 공동 개발"
 HOL_military.087.d: "[ROOT.GetName]은(는) 공동 우주 구상에 대한 우리의 제안을 수락했습니다. 우리는 함께 더 나은 위성 체계, 궤도 연구 시설, 개선된 통신망을 포함한 첨단 민간 우주 기술을 개발할 것입니다."
 HOL_military.087.a: "우주의 미래를 위한 유망한 동맹이다!"
 HOL_military.088.t: "화성 식민지 명명"
 HOL_military.088.d: "식민지가 세워졌습니다. 거주지는 가압되었고, 전력은 안정적이며, 최초의 영구 네덜란드인 거주자들이 화성의 토양에 발을 디뎠습니다. 한 가지 질문이 남았습니다. 이 정착지를 무엇이라 부를 것인가? 개척자들은 그들이 떠나온 고국의 전설에서 따온 네 가지 이름을 제안했습니다."
 HOL_military.089.t: "마스 원: 자금 검토"
 HOL_military.089.d: "최초의 유인 수송선이 지구 궤도를 벗어나 화성을 향해 항로를 잡았습니다. 노르트바이크의 관제 센터가 정부에 연락해 왔습니다. 전망에 따르면 지금 추가 자금이 지급되지 않으면 식민지의 생명 유지 설비 조립이 일정보다 뒤처질 것입니다. 이 결정은 미룰 수 없습니다."
 HOL_military.090.t: "항법 소프트웨어 결함"
 HOL_military.090.d: "수송 11개월째, 자율 도킹 소프트웨어에서 타이밍 오류가 드러났습니다. 수정하지 않으면 거주 모듈은 도착 시 결합할 수 없습니다. ESTEC의 기술자들은 두 가지 선택지를 제시합니다. 추가 프로세서 시간과 자금이 필요한 전체 패치, 또는 비용은 더 저렴하지만 최종 접근 절차를 늦추고 식민지의 예상 준비 완료일을 미루게 될 수동 우회 방안입니다."
 HOL_military.091.t: "최초의 화성 토양 시료"
 HOL_military.091.d: "선발 착륙선이 이시디스 평원의 식민지 후보지에서 채취한 첫 코어 시료를 보내왔습니다. 분광 분석 결과 지하 깊은 곳에서 크롬 함유 광물의 농도가 높게 나타났음이 확인되었습니다. 과학 팀은 조사 범위를 넓히고 예비 결과를 발표하기를 원하며, 임무 관리부는 승무원이 오로지 거주지 건설에만 집중하기를 원합니다. 두 길을 동시에 추구할 수는 없습니다."
 HOL_military.092.t: "돔 압력 경고"
 HOL_military.092.d: "최종 설비 장착 중 주 거주 돔의 연결 링에서 미세 균열이 발견되었습니다. 이 결함은 수리할 수 있지만 전문 용접 장비와 24시간 교대 근무가 필요합니다. 대안은 영향을 받은 구역을 밀폐하고 다음 보급 시기까지 감압 상태로 식민지를 운영하는 것이며, 이 경우 가동 개시가 몇 달 늦어집니다."
 HOL_military.104.t: "네덜란드, 공동 해군 프로그램에 우리를 초청"
 HOL_military.104.d: "네덜란드 정부는 해양 안보를 강화하고 해군 협력을 개선하기 위한 카리브 합동 해군 프로그램에 참여하도록 우리를 초청했습니다. 이 구상은 우리 해군을 강화하고 지역 위협에 대한 귀중한 지원을 제공할 수 있습니다."
 HOL_military.104.a: "초청을 수락한다"
 HOL_military.104.b: "제안을 거절한다"
 HOL_military.105.t: "[ROOT.GetNameWithFlag], 해군 프로그램 참여!"
 HOL_military.105.d: "카리브 지역의 동맹국 중 하나가 합동 해군 프로그램에 대한 우리의 초청을 수락했습니다. 그들의 참여는 이 지역에서 우리의 해군 영향력을 강화하고 합동 해양 작전을 향상합니다."
 HOL_military.105.a: "훌륭하다!"
 HOL_military.106.t: "[ROOT.GetNameWithFlag], 해군 프로그램 거절"
 HOL_military.106.d: "카리브 지역의 동맹국 중 하나가 합동 해군 프로그램에 대한 우리의 초청을 거절했습니다. 이는 지역 협력을 약화하지만, 우리는 참여할 의사가 있는 이들과 함께 노력을 계속할 것입니다."
 HOL_military.106.a: "유감이다."
 HOL_military.107.t: "네덜란드의 참여, 에어버스에 활력"
 HOL_military.107.d: "네덜란드는 유로파이터 사업에 공식적으로 참여했습니다. 이 결정은 추가 자금과 계약을 에어버스의 프랑스 사업장에 돌려 유럽 차세대 항공 전력에서 그 역할을 강화할 것입니다."
 HOL_military.107.a: "반가운 산업적 활력이다."
 HOL_military.108.t: "네덜란드의 투자, 스페인 에어버스에 이익"
 HOL_military.108.d: "네덜란드가 유로파이터 컨소시엄에 합류함에 따라 에어버스 스페인 부문은 주문과 생산 지원이 급증할 것으로 예상되며, 이는 유럽 방위 산업에서 스페인의 입지를 높일 것입니다."
 HOL_military.108.a: "우리 부문에 긍정적인 진전이다."
 HOL_military.109.t: "BAE 시스템즈, 네덜란드의 유로파이터 참여로 수혜"
 HOL_military.109.d: "네덜란드의 유로파이터 프로그램 참여는 BAE 시스템즈와의 추가 협력을 확보합니다. 영국의 제조 및 연구 개발 부문은 이 확대된 동반자 관계로 직접적인 혜택을 입게 될 것입니다."
 HOL_military.109.a: "영국에게 경제적 기회다."
 HOL_military.110.t: "알레니아 아에로나우티카, 네덜란드 계약 확보"
 HOL_military.110.d: "네덜란드가 유로파이터 사업에 참여함에 따라 이탈리아의 알레니아는 확대된 협력의 혜택을 보게 됩니다. 양국 간 산업 유대가 더욱 굳건해지며, 향후 합작 사업을 기대하게 합니다."
 HOL_military.110.a: "이탈리아 방위 산업의 승리다."
 HOL_military.111.t: "네덜란드의 사브 JAS 39 그리펜 구매"
 HOL_military.111.d: "뜻밖의 행보로 네덜란드는 스웨덴 사브의 JAS 39 그리펜을 차세대 다목적 전투기로 선정했습니다. 이 도입은 방위 조달의 중대한 변화를 의미하며 스웨덴 국내 방위 산업에 상당한 활력을 줍니다."
 HOL_military.111.a: "스웨덴의 혁신이 계약을 따냈다."
 HOL_military.112.t: "네덜란드의 스카니아 그리프스 트럭 도입"
 HOL_military.112.d: "네덜란드는 스카니아와 그리프스 군용 수송 차량 인도에 관한 대규모 계약을 체결했습니다. 이 조치는 스웨덴의 방위 제조 부문에 활력을 주고 네덜란드와 스웨덴의 군수 산업 협력을 더욱 공고히 합니다."
 HOL_military.112.a: "믿음직하고 효율적인 훌륭한 선택이다."
 HOL_military.113.t: "네덜란드의 바라쿠다급 잠수함 발주"
 HOL_military.113.d: "네덜란드는 프랑스 나발 그룹과 첨단 바라쿠다급 잠수함 도입을 위한 대규모 조달 계약을 마무리했습니다. 이는 프랑스와 네덜란드의 방위 유대를 심화하고 프랑스 해군 산업에 상당한 활력을 줍니다."
 HOL_military.113.a: "물속으로 내딛는 강력한 한 걸음이다."
 HOL_monarchy.01.t: "왕실 결혼 승인 요청"
 HOL_monarchy.01.d: "정부는 빌럼알렉산더 왕세자와 막시마 소레기에타의 결혼 제안에 관한 중요한 결정에 직면해 있습니다. 막시마 본인은 좋은 평가를 받고 있으나, 아르헨티나 군사 독재 시절 장관을 지낸 그녀의 아버지 호르헤 소레기에타를 둘러싸고 논란이 있습니다. 결혼을 승인하면 대중적 논쟁과 정치적 반발을 일으킬 수 있습니다. 어떻게 진행해야 하겠습니까?"
 HOL_monarchy.01.a: "결혼을 승인한다"
 HOL_monarchy.01.a_desc: "§Y왕실§!이 §G만족§!합니다"
 HOL_monarchy.01.b: "결혼을 불허한다"
 HOL_monarchy.01.b_desc: "§Y왕실§!을 §R분노§!하게 할 수 있으며, §Y민족주의 인기도§!가 하락하거나 상승할 수 있습니다"
 HOL_monarchy.02.t: "논란에도 결혼 승인"
 HOL_monarchy.02.d: "정부는 막시마의 아버지 호르헤 소레기에타를 둘러싼 우려에도 불구하고 결혼을 승인했습니다. 이 결정은 여론과 정계 모두에 파장을 일으킬 수 있습니다."
 HOL_monarchy.02.a: "결혼식을 진행한다"
 HOL_monarchy.03.t: "엇갈린 대중과 언론의 반응"
 HOL_monarchy.03.d: "결혼 발표는 언론과 대중 사이에서 엇갈린 반응을 불러일으켰습니다. 막시마가 미래의 왕비로 적합한지에 대한 논쟁이 계속되고 있으며, 일부 정당은 의회에서의 논의를 촉구하고 있습니다. 정부는 어떻게 대응해야 하겠습니까?"
 HOL_monarchy.03.a: "막시마가 발언하도록 허용한다"
 HOL_monarchy.03.b: "정부의 지지를 철회한다"
 HOL_monarchy.04.t: "막시마의 성명"
 HOL_monarchy.04.d: "한 인터뷰에서 막시마는 '미 파파 에스 운 부엔 옴브레'(나의 아버지는 좋은 분입니다)라고 밝혔습니다. 논란에도 불구하고 이 부부는 헌신적인 모습과 대중 앞에서의 활동으로 폭넓은 지지를 얻고 있습니다."
 HOL_monarchy.04.a: "그들의 노력을 지지한다"
 HOL_monarchy.05.t: "결혼식 거행"
 HOL_monarchy.05.d: "결혼식은 2002년에 열렸으며 대중의 큰 열광과 국가적 자부심 속에서 축하받았습니다. 막시마는 이후 매우 인기 있는 인물이 되었고, 네덜란드 군주제의 안정과 인기에 크게 기여했습니다."
 HOL_monarchy.05.a: "이 경사를 축하한다"
 HOL_monarchy.06.t: "정부, 지지 철회"
 HOL_monarchy.06.d: "정부는 계속되는 논란을 이유로 결혼에 대한 지지를 철회하기로 결정했습니다. 왕실 부부는 이제 어려운 결정에 직면했습니다. 빌럼알렉산더는 정부의 승인 없이 결혼을 강행할 것인가?"
 HOL_monarchy.06.a: "그들의 결정을 기다린다"
 HOL_monarchy.07.t: "사랑을 택한 빌럼알렉산더"
 HOL_monarchy.07.d: "빌럼알렉산더는 정부의 결정에도 불구하고 결혼을 강행하기로 했으며, 이는 그의 왕위 계승권 상실로 이어질 것입니다. 이는 헌정 위기를 촉발했고 여론을 분열시켰습니다."
 HOL_monarchy.07.a: "상황을 주시한다"
 HOL_monarchy.08.t: "대중의 반발"
 HOL_monarchy.08.d: "정부의 승인 없이 이루어진 결혼으로 군주제에 대한 지지가 하락했으며, 현대 사회에서 군주제가 지니는 의의를 둘러싼 논쟁이 커지고 있습니다."
 HOL_monarchy.08.a: "위기를 수습한다"
 HOL_monarchy.09.t: "왕실 부부에 대한 대중의 지지"
 HOL_monarchy.09.d: "정부가 결혼 승인을 거부하자 왕실 부부를 지지하는 강력한 대중 운동이 일어났습니다. 시위와 청원이 이어지며 정부에 결정을 재고할 것을 요구하고 있습니다."
 HOL_monarchy.09.a: "계속 주시한다"
 HOL_monarchy.10.t: "대중 압력 운동"
 HOL_monarchy.10.d: "대중의 압력이 거세지고 있습니다. 영향력 있는 여러 인사와 시민이 정부가 결혼을 허용할 것을 촉구하고 있습니다. 왕실은 대중의 공감을 얻기 위해 지지자들과 적극적으로 접촉하고 있습니다."
 HOL_monarchy.10.a: "상황을 검토한다"
 HOL_monarchy.11.t: "승인 재검토"
 HOL_monarchy.11.d: "높아지는 대중의 지지에 정부는 입장을 재고할 수밖에 없게 되었습니다. 정부는 이제 결혼을 허락해야 합니까, 아니면 금지를 유지해야 합니까?"
 HOL_monarchy.11.a: "허락한다"
 HOL_monarchy.11.b: "금지를 유지한다"
 HOL_monarchy.12.t: "정치적 결정을 가로막는 군주"
 HOL_monarchy.12.d: "결혼 승인이 계속 거부되는 데 분노한 군주제 측이 보복의 일환으로 정부의 주요 결정을 가로막기 시작했습니다. 이 조치로 정치적 교착 상태가 빚어졌으며 상황은 더욱 불안정해졌습니다."
 HOL_monarchy.12.a: "위기에 대처한다"
 HOL_monarchy.13.t: "네덜란드의 최후통첩"
 HOL_monarchy.13.d: "네덜란드 왕국이 룩셈부르크에 즉각적인 통합을 요구하는 최후통첩을 보냈습니다. 룩셈부르크는 이에 응하겠습니까, 아니면 전쟁의 위험을 무릅쓰겠습니까?"
 HOL_monarchy.13.a: "네덜란드와의 통합을 받아들인다."
 HOL_monarchy.13.b: "우리는 굴복을 거부한다!"
 HOL_monarchy.14.t: "최후통첩을 수락한 룩셈부르크"
 HOL_monarchy.14.d: "룩셈부르크가 네덜란드 왕국에 통합되기로 동의했습니다. 이 평화적인 결과로 이 지역에서 네덜란드의 영향력이 공고해졌습니다."
 HOL_monarchy.14.a: "평화로운 승리다!"
 HOL_monarchy.15.t: "룩셈부르크의 최후통첩 거부"
 HOL_monarchy.15.d: "룩셈부르크가 네덜란드의 최후통첩을 거부하고 통합을 받아들이지 않았습니다. 이제 네덜란드는 무력으로 요구를 관철할지 결정해야 합니다."
 HOL_monarchy.15.a: "전쟁을 준비하라!"
 HOL_monarchy.16.t: "네덜란드의 최후통첩"
 HOL_monarchy.16.d: "네덜란드 왕국이 아일랜드에 즉각적인 통합을 요구하는 최후통첩을 보냈습니다. 아일랜드는 이에 응하겠습니까, 아니면 전쟁의 위험을 무릅쓰겠습니까?"
 HOL_monarchy.16.a: "네덜란드와의 통합을 받아들인다."
 HOL_monarchy.16.b: "우리는 굴복을 거부한다!"
 HOL_monarchy.17.t: "최후통첩을 수락한 아일랜드"
 HOL_monarchy.17.d: "아일랜드가 네덜란드 왕국에 통합되기로 동의했습니다. 이 평화적인 결과로 이 지역에서 네덜란드의 영향력이 공고해졌습니다."
 HOL_monarchy.17.a: "평화로운 승리다!"
 HOL_monarchy.18.t: "아일랜드의 최후통첩 거부"
 HOL_monarchy.18.d: "아일랜드가 네덜란드의 최후통첩을 거부하고 통합을 받아들이지 않았습니다. 이제 네덜란드는 무력으로 요구를 관철할지 결정해야 합니다."
 HOL_monarchy.18.a: "전쟁을 준비하라!"
 HOL_monarchy.19.t: "잉글랜드에 대한 네덜란드의 최후통첩"
 HOL_monarchy.19.d: "네덜란드가 잉글랜드에 통합을 요구하는 대담한 최후통첩을 보냈습니다. 이 과감한 조치로 잉글랜드가 네덜란드의 요구에 굴복할지, 아니면 맞서 버틸지가 주목받고 있습니다."
 HOL_monarchy.19.a: "네덜란드의 통치를 받아들인다."
 HOL_monarchy.19.b: "우리는 결코 항복하지 않는다!"
 HOL_monarchy.20.t: "네덜란드 통치에 대한 잉글랜드의 복종"
 HOL_monarchy.20.d: "충격적인 상황 전개 속에서 잉글랜드가 네덜란드의 요구에 동의하여 네덜란드 왕국에 통합되었습니다. 이제 네덜란드는 방대한 새로운 자원과 위신을 손에 넣었습니다."
 HOL_monarchy.20.a: "사자가 네덜란드의 왕관 앞에 머리를 숙인다!"
 HOL_monarchy.21.t: "굳건히 맞서는 잉글랜드"
 HOL_monarchy.21.d: "잉글랜드가 네덜란드의 최후통첩을 거부하고 통합을 받아들이지 않은 채 충돌을 준비하고 있습니다. 이제 네덜란드는 다음 행동 방침을 결정해야 합니다."
 HOL_monarchy.21.a: "무기를 들어라!"
 HOL_monarchy.22.t: "스코틀랜드에 대한 네덜란드의 최후통첩"
 HOL_monarchy.22.d: "네덜란드가 스코틀랜드에 네덜란드 왕국으로의 통합을 요구하는 대담한 최후통첩을 보냈습니다. 스코틀랜드는 네덜란드의 요구에 굴복하겠습니까, 아니면 저항을 준비하겠습니까?"
 HOL_monarchy.22.a: "우리는 네덜란드에 합류한다."
 HOL_monarchy.22.b: "하일랜드는 결코 고개를 숙이지 않는다!"
 HOL_monarchy.23.t: "네덜란드 통치에 대한 스코틀랜드의 복종"
 HOL_monarchy.23.d: "뜻밖에도 스코틀랜드가 네덜란드의 최후통첩을 수락하여 네덜란드 왕국에 통합되었습니다. 이제 네덜란드가 하일랜드의 땅을 지배하게 되었습니다."
 HOL_monarchy.23.a: "스코틀랜드는 네덜란드의 영토가 되었다."
 HOL_monarchy.24.t: "스코틀랜드의 최후통첩 거부"
 HOL_monarchy.24.d: "스코틀랜드가 네덜란드의 최후통첩을 당당히 거부하고 저항을 준비하고 있습니다. 이제 네덜란드는 전쟁으로 요구를 관철할지 결정해야 합니다."
 HOL_monarchy.24.a: "전쟁이다!"
 HOL_monarchy.25.t: "동군연합 제안"
 HOL_monarchy.25.d: "네덜란드가 룩셈부르크에 동군연합을 맺자고 제안했습니다. 이 제안은 두 나라 사이에 더욱 긴밀한 정치적, 경제적 통합을 약속합니다. 룩셈부르크는 이 역사적인 기회를 받아들이겠습니까, 아니면 제안을 거절하겠습니까?"
 HOL_monarchy.25.a: "동군연합에 동의한다"
 HOL_monarchy.25.b: "동군연합을 거절한다"
 HOL_monarchy.26.t: "제안을 수락한 룩셈부르크"
 HOL_monarchy.26.d: "룩셈부르크가 동군연합 제안에 동의했습니다! 두 나라는 이제 더욱 깊은 유대로 맺어졌으며, 룩셈부르크는 네덜란드의 이익과 긴밀히 보조를 맞추게 됩니다. 이 지역의 역사에 새로운 장이 열렸습니다."
 HOL_monarchy.26.a: "훌륭한 소식이다!"
 HOL_monarchy.27.t: "제안을 거절한 룩셈부르크"
 HOL_monarchy.27.d: "룩셈부르크가 네덜란드와의 동군연합 제안을 거절했습니다. 외교적 노력에도 불구하고 룩셈부르크 지도부는 독립을 유지하기로 결정했습니다. 이 결과는 네덜란드의 야망에 실망스러운 것입니다."
 HOL_monarchy.27.a: "실망스럽다"
 HOL_monarchy.28.t: "아일랜드와의 연합 제안"
 HOL_monarchy.28.d: "네덜란드가 흥미로운 제안을 보내왔습니다. 바로 아일랜드와 동군연합을 맺자는 것입니다. 이 협정이 체결되면 우리는 네덜란드 왕관 아래에 놓이지만 내정에 대한 자치권은 유지하게 됩니다. 그들은 이러한 연합이 우리의 경제적 안정을 보장하고 유럽에서의 입지를 강화할 것이라고 주장합니다. 이 제안을 받아들이겠습니까, 아니면 그들의 야망을 거절하겠습니까?"
 HOL_monarchy.28.a: "제안을 수락한다"
 HOL_monarchy.28.b: "제안을 거절한다"
 HOL_monarchy.29.t: "제안을 수락한 아일랜드"
 HOL_monarchy.29.d: "아일랜드가 네덜란드 왕관 아래의 동군연합 제안에 동의했습니다. 이 역사적인 순간은 양국 사이의 협력과 운명 공동체라는 새로운 시대의 시작을 알립니다. 이제 네덜란드 왕국이 아일랜드의 사안을 감독하며 상호 번영과 안보를 보장하게 됩니다."
 HOL_monarchy.29.a: "시대를 아우르는 연합"
 HOL_monarchy.30.t: "제안을 거절한 아일랜드"
 HOL_monarchy.30.d: "아일랜드가 동군연합 제안을 거절하고 완전한 독립을 유지하기로 했습니다. 이 결정은 실망스럽지만 우리는 그들의 주권을 존중해야 합니다. 당분간 아일랜드는 네덜란드 왕관과 거리를 둔 채 남게 될 것입니다."
 HOL_monarchy.30.a: "실망스러운 결과"
 HOL_monarchy.31.t: "잉글랜드와의 연합 제안"
 HOL_monarchy.31.d: "네덜란드가 네덜란드 왕관 아래 동군연합을 맺자는 대담한 제안을 들고 우리에게 접근했습니다. 그들은 이러한 동반 관계가 잉글랜드의 주권을 보존하면서 양국의 안정과 번영을 보장할 것이라고 주장합니다. 이 제안은 협력의 새로운 시대를 열 수도 있고, 우리의 독립에 대한 도전이 될 수도 있습니다. 어떻게 결정하겠습니까?"
 HOL_monarchy.31.a: "제안을 수락한다"
 HOL_monarchy.31.b: "제안을 거절한다"
 HOL_monarchy.32.t: "제안을 수락한 잉글랜드"
 HOL_monarchy.32.d: "중대한 결정으로 잉글랜드가 네덜란드 왕관 아래 네덜란드와 동군연합을 맺기로 동의했습니다. 이 동반 관계는 공동의 미래의 시작을 알리며, 양국의 강점을 결합하여 안정과 상호 번영을 보장할 것입니다. 우리는 함께 유럽의 운명을 만들어 나갈 것입니다."
 HOL_monarchy.32.a: "역사적인 합의"
 HOL_monarchy.33.t: "제안을 거절한 잉글랜드"
 HOL_monarchy.33.d: "잉글랜드가 네덜란드의 동군연합 제안을 거절하고 완전한 독립을 유지하기로 했습니다. 이 결정은 주권에 대한 그들의 의지를 보여 주지만, 네덜란드와의 향후 관계는 불투명하게 남았습니다."
 HOL_monarchy.33.a: "놓쳐 버린 기회"
 HOL_monarchy.34.t: "스코틀랜드와의 통합 제안"
 HOL_monarchy.34.d: "네덜란드 정부가 스코틀랜드에 동군연합을 맺어 두 나라를 네덜란드 왕관의 지도 아래 통합하자는 제안을 내놓았습니다. 이 연합은 불확실한 세계에서 상호 이익과 번영, 안보를 약속합니다. 스코틀랜드는 이 제안에 동의하겠습니까, 아니면 독립을 유지하겠습니까?"
 HOL_monarchy.34.a: "통합 제안을 수락한다."
 HOL_monarchy.34.b: "통합 제안을 거절한다."
 HOL_monarchy.35.t: "스코틀랜드의 연합 수락"
 HOL_monarchy.35.d: "스코틀랜드가 네덜란드와 동군연합을 맺기로 동의했습니다. 이 역사적인 합의는 양국의 유대를 공고히 하고 스코틀랜드에 대한 네덜란드 왕관의 지도력을 확립하며, 협력과 단합의 새로운 시대를 알립니다."
 HOL_monarchy.35.a: "새로운 장이 시작된다!"
 HOL_monarchy.36.t: "스코틀랜드의 연합 거절"
 HOL_monarchy.36.d: "스코틀랜드가 네덜란드의 동군연합 제안을 거절하고 독립을 유지하기로 했습니다. 실망스럽지만, 이 결정은 스스로의 길을 개척하려는 스코틀랜드의 의지를 보여 줍니다."
 HOL_monarchy.36.a: "놓쳐 버린 기회다."
 HOL_monarchy.37.t: "네덜란드의 전략적 동반자 관계 요청"
 HOL_monarchy.37.d: "입헌 군주가 이끌며 서방과의 협력에 헌신하고 있는 네덜란드가 주요 비NATO 동맹국 지위를 공식 요청했습니다. 이를 부여하면 대서양 횡단 관계가 강화되고 유럽의 핵심 파트너를 확보할 수 있을 것입니다."
 HOL_monarchy.37.a: "요청을 승인한다. 가치 있는 동맹국이다."
 HOL_monarchy.37.b: "거절한다. 이런 지정에는 신중해야 한다."
 HOL_monarchy.38.t: "주요 비NATO 동맹국 지위 부여"
 HOL_monarchy.38.d: "미국이 우리의 요청에 긍정적으로 응답했습니다. 이제 네덜란드는 공식적으로 주요 비NATO 동맹국으로 인정받았으며, 이는 서방과의 외교 정책 정렬에서 하나의 이정표입니다."
 HOL_monarchy.38.a: "우리 군주제에 중요한 한 걸음이다."
 HOL_monarchy.39.t: "전략적 동반자 관계 요청 거부"
 HOL_monarchy.39.d: "우리의 외교적 노력과 확고한 서방 지향에도 불구하고 미국이 주요 비NATO 동맹국 지위 요청을 거절했습니다. 우리는 세계 무대에서 더욱 스스로를 증명해야 할 것입니다."
 HOL_monarchy.39.a: "실망스럽지만 끝은 아니다."
 HOL_politics.01.t: "동성 결혼에 관한 결정"
 HOL_politics.01.d: "네덜란드 의회가 동성 결혼 합법화를 논의하고 있습니다. 이 획기적인 결정은 나라의 사회적, 정치적 지형을 좌우할 것입니다. 동성 결혼을 허용해야 합니까, 아니면 전통적 가치를 지켜야 합니까?"
 HOL_politics.01.a: "동성 결혼을 합법화한다"
 HOL_politics.01.b: "전통적 가치를 수호한다"
 HOL_politics.02.t: "포르퇴인의 밤"
 HOL_politics.02.d: "네덜란드의 정치 분위기가 긴장된 가운데, 핌 포르퇴인이 논란이 되는 발언과 정책으로 세간의 관심을 한 몸에 받고 있습니다. 그의 목숨을 노리는 위협이 점점 잦아지고 있습니다. 다음에는 어떤 일이 벌어질까요?"
 HOL_politics.02.a: "시간이 말해 줄 것이다."
 HOL_politics.03.t: "핌 포르퇴인 암살"
 HOL_politics.03.d: "2002년 5월 6일, 핌 포르퇴인이 비극적으로 암살되어 온 나라가 뿌리째 흔들렸습니다. 그의 죽음은 네덜란드 정치에 공백을 남겼고 불안의 물결을 일으켰습니다."
 HOL_politics.03.a: "국가의 비극적인 손실이다."
 HOL_politics.04.t: "핌 포르퇴인 암살 시도 실패"
 HOL_politics.04.d: "핌 포르퇴인의 목숨을 노린 시도가 있었으나 그는 간신히 위기를 모면했습니다. 국민은 안도했지만 긴장은 여전히 높습니다."
 HOL_politics.04.a: "포르퇴인은 훗날을 기약하며 살아남았다."
 HOL_politics.05.t: "VVD 지도자 선택"
 HOL_politics.05.d: "VVD는 기로에 서 있으며 다음 지도자를 선택해야 합니다. 실용주의자인 마르크 뤼터를 지지하겠습니까, 아니면 반이민 성향의 강경파를 지지하겠습니까?"
 HOL_politics.05.a: "마르크 뤼터를 지지한다"
 HOL_politics.05.b: "헤이르트 빌더르스를 지지한다"
 HOL_politics.06.t: "기후 협약"
 HOL_politics.06.d: "정부는 온실가스 배출을 줄이고 기후 목표를 달성하기 위해 노력하고 있습니다. 우리의 공약을 이행할 주요 선택지는 두 가지입니다. 원자력 에너지에 투자하거나 재생 에너지 자원을 확대하는 것입니다. 각 방안에는 저마다의 이점과 과제가 있습니다."
 HOL_politics.06.a: "원자력 에너지에 투자한다"
 HOL_politics.06.b: "재생 에너지 자원을 확대한다"
 HOL_politics.07.t: "CDA의 지도부"
 HOL_politics.07.d: "얀 페터르 발케넨더가 네 번째 내각의 붕괴 이후 사임함에 따라, CDA는 당을 이끌어 갈 새 지도자를 선택해야 합니다. 당은 경험이 풍부한 막심 페르하헌을 택하겠습니까, 아니면 미래로 이끌 젊은 시브란트 부마를 택하겠습니까?"
 HOL_politics.07.a: "막심 페르하헌을 지지한다"
 HOL_politics.07.b: "시브란트 부마를 지지한다"
 HOL_politics.08.t: "녹색 도시 개발"
 HOL_politics.08.a: "대중교통에 집중한다"
 HOL_politics.08.b: "녹지를 우선한다"
 HOL_politics.08.c: "지속 가능한 주택을 촉진한다"
 HOL_politics.08.d: "PvdA 정부는 지속 가능한 도시 개발에 전념하고 있으며, 나아갈 길은 여러 가지입니다. 대중교통 개선, 녹지 확대, 지속 가능한 주택 촉진, 스마트 시티 기술 투자 중 어디에 집중해야 합니까? 각 방안은 저마다의 방식으로 우리 도시의 미래를 빚어낼 것입니다."
 HOL_politics.09.t: "녹색 에너지 전환"
 HOL_politics.09.d: "지속 가능한 미래에 대한 약속의 일환으로, 앞으로 네덜란드에 어떻게 전력을 공급할지 선택해야 합니다. 안정적인 공급을 위해 원자력 에너지에 집중해야 합니까, 풍력과 태양광 같은 재생 에너지원에 투자해야 합니까, 아니면 당장의 에너지 수요를 위해 전통적인 석탄 채굴에 의존해야 합니까?"
 HOL_politics.09.a: "원자력 에너지에 집중한다"
 HOL_politics.09.b: "재생 가능 에너지에 투자"
 HOL_politics.09.c: "석탄 채굴을 되살린다"
 HOL_politics.11.t: "교육의 미래에 투자"
 HOL_politics.11.a: "3D 기술에 집중한다"
 HOL_politics.11.b: "인공지능에 집중한다"
 HOL_politics.11.c: "굴착 기술에 집중한다"
 HOL_politics.11.d: "PvdA 정부는 내일의 과제에 대비하기 위해 교육 제도 현대화 노력을 이끌고 있습니다. 미래의 노동력이 번영하는 데 필요한 기술을 갖추도록 3D 기술, 인공지능, 첨단 굴착 기술, 해군 전자 장비 등 최첨단 기술을 우선하겠습니다."
 HOL_politics.12.t: "VVD에서 갈라선 헤이르트 빌더르스"
 HOL_politics.12.d: "이민과 유럽 통합 같은 핵심 쟁점에 대한 VVD의 입장에 불만이 커지자, 헤이르트 빌더르스가 VVD를 떠나기로 결정했습니다. 그는 민족주의 정책과 이민에 대한 강력한 반대에 초점을 맞춘 자신만의 정당을 창당할 계획입니다. 이는 네덜란드 정치 내의 중대한 분열이자 자유당의 부상을 의미합니다"
 HOL_politics.12.a: "헤이르트 빌더르스가 VVD를 떠나 PVV를 창당한다"
 HOL_politics.13.t: "사회 혁신 구상"
 HOL_politics.13.d: "네덜란드에 새로운 사회 혁신의 물결이 일어났습니다. 민간 부문의 장기적인 연구 속도 향상에 집중해야 합니까, 아니면 핵심 프로젝트를 가속하기 위해 즉각적인 기술 증진을 활용해야 합니까?"
 HOL_politics.13.a: "연구 속도를 높인다"
 HOL_politics.13.b: "즉각적인 기술 진보에 집중한다"
 HOL_politics.14.t: "아프리카너의 자원 양허"
 HOL_politics.14.d: "아프리카너 세력이 네덜란드에 강한 유대감을 표명하며, 남아프리카의 자원이 풍부한 주 한 곳의 자원 권리를 네덜란드 정부에 넘기려 하고 있습니다. 이 조치는 사실상 남아프리카 당국을 우회하여 네덜란드의 영향력을 강화할 것입니다. 이 양허를 막기 위해 개입해야 합니까, 아니면 이를 무시하고 아프리카너들이 추진하도록 두어야 합니까?"
 HOL_politics.14.a: "양허를 무시한다"
 HOL_politics.14.b: "개입하여 양허를 막는다"
 HOL_politics.15.t: "아프리카너 자원 권리 부여"
 HOL_politics.15.d: "아프리카너 세력이 네덜란드에 자원 권리를 성공적으로 이전했습니다. 그들의 결정에 따라 네덜란드는 이제 남아프리카의 귀중한 주 한 곳에 대한 권리를 보유하게 되었으며, 네덜란드와 아프리카너 사이의 유대가 깊어졌습니다."
 HOL_politics.15.a: "하우텡의 아프리카너 지지 "
 HOL_politics.15.b: "나탈의 아프리카너 지지"
 HOL_politics.16.t: "플랑드르 통합 1단계 달성"
 HOL_politics.16.d: "§Y[FLN.GetNameWithFlag]§!에서 네덜란드의 존재감이 눈에 띄는 수준에 이르렀습니다. 통합에 대한 지지는 이제 1단계에 도달했으며, 문화적, 경제적 유대가 강화되고 있습니다."
 HOL_politics.16.a: "알겠다"
 HOL_politics.17.t: "플랑드르 통합 2단계 달성"
 HOL_politics.17.d: "플랑드르 통합 추진이 2단계에 도달했으며, 현지 정당들의 협력과 지지가 늘고 있습니다."
 HOL_politics.17.a: "알겠다"
 HOL_politics.18.t: "플랑드르 통합 3단계 달성"
 HOL_politics.18.d: "통합 노력이 3단계에 도달하여 무역, 문화, 정치적 보조에서 강력한 동반 관계가 형성되었음을 보여 줍니다."
 HOL_politics.18.a: "알겠다"
 HOL_politics.19.t: "플랑드르 통합 4단계 달성"
 HOL_politics.19.d: "4단계 통합은 플랑드르와 네덜란드가 거의 완전히 보조를 맞추고 있으며 모든 분야에서 상호 협력하고 있음을 나타냅니다."
 HOL_politics.19.a: "알겠다"
 HOL_politics.20.t: "플랑드르 통합 5단계 달성"
 HOL_politics.20.d: "플랑드르와 네덜란드의 통합이 완료되었습니다. 문화적, 정치적 유대가 최대 강도에 도달했습니다."
 HOL_politics.20.a: "알겠다"
 HOL_politics.21.t: "위기에 이른 §Y[FLN.GetNameWithFlag]§! 문제"
 HOL_politics.21.d: "§Y[FLN.GetNameWithFlag]§!에서 네덜란드의 존재감이 전례 없는 수준에 이르러 네덜란드와의 완전한 통합을 강하게 요구하고 있습니다. §Y[BEL.GetNameWithFlag]§!은(는) 이제 중대한 결정에 직면했습니다. §Y[FLN.GetNameWithFlag]§!을(를) 평화적으로 내줄 것인가, 아니면 저항하여 네덜란드와의 전쟁 위험을 감수할 것인가."
 HOL_politics.21.a: "플랑드르 국민의 뜻이다"
 HOL_politics.21.b: "저항하고 전쟁을 선포한다"
 HOL_politics.22.t: "§Y[HOL.GetNameWithFlag]§!의 제안"
 HOL_politics.22.d: "네덜란드 정부가 서유럽의 세력 균형을 재편할 대담한 외교적 제안을 들고 우리에게 접근했습니다. 그들은 벨기에를 해체하여 그 영토를 네덜란드와 프랑스가 나누자고 제안합니다. 이 제안은 벨기에 국민의 운명을 결정할 국민투표를 전제로 합니다. 이 제안을 수락하면 이 지역에서 우리의 영향력을 새롭게 정의할 수 있지만, 국제적 비난과 잠재적 충돌의 위험이 따릅니다. 네덜란드의 이 야심 찬 제안에 어떻게 응답해야 합니까?"
 HOL_politics.22.a: "벨기에에 국민투표를 압박한다"
 HOL_politics.22.b: "네덜란드의 제안을 거절한다"
 HOL_politics.23.t: "네덜란드와 프랑스의 공동 최후통첩"
 HOL_politics.23.d: "네덜란드와 프랑스 정부가 공동으로 우리에게 이례적인 요구를 제시했습니다. 벨기에의 운명을 결정할 국민투표를 실시하라는 것입니다. 그들은 이것이 벨기에 국민과 지역 안정을 위한 최선이라 주장하며 우리나라를 자기들끼리 나누자고 제안합니다. 요구에 동의하면 주권 국가로서 벨기에의 존립 자체를 위태롭게 할 수 있고, 거부하면 긴장이 위험하게 고조될 수 있습니다. 우리 나라의 미래가 갈림길에 놓여 있습니다. 어떻게 응답하겠습니까?"
 HOL_politics.23.a: "국민투표에 동의한다"
 HOL_politics.23.b: "거부하고 입장을 고수한다"
 BEL_referendum_mission_tooltip: "국민투표 절차를 시작합니다"
 HOL_politics.24.t: "벨기에의 국민투표 동의"
 HOL_politics.24.d: "강력한 외교적 압력 끝에 벨기에 정부가 나라의 미래를 두고 국민투표를 실시하기로 동의했습니다. 이 역사적인 투표는 벨기에가 통일 국가로 남을지, 네덜란드와 프랑스 사이에서 분할될지를 결정할 것입니다. 벨기에의 운명이 이제 국민의 손에 달려 있으므로, 이 결정은 유럽 역사의 결정적인 순간이 될 것입니다."
 HOL_politics.24.a: "국민투표가 확정되었다"
 HOL_politics.25.t: "벨기에의 국민투표 거부"
 HOL_politics.25.d: "벨기에 정부가 나라의 미래를 두고 국민투표를 실시하자는 네덜란드와 프랑스의 제안을 거절했습니다. 그들은 벨기에의 주권에 대한 흔들림 없는 의지를 선언하며 나라를 분할한다는 발상 자체를 일축했습니다. 네덜란드와 프랑스가 이러한 반발에 대응할 다음 수를 저울질함에 따라, 이 결정은 지역의 긴장을 고조시킬 수 있습니다."
 HOL_politics.25.a: "그 결과에 대비한다"
 HOL_politics.26.t: "국민투표 결과: 벨기에 해체"
 HOL_politics.26.d: "국민투표 결과가 나왔습니다. 벨기에 국민은 나라를 해체하기로 표결했습니다. 플랑드르와 왈로니아의 영토는 이제 네덜란드와 프랑스로 나뉘며, 벨기에 동부 일부는 독일에 편입됩니다. 이 결정은 통일 국가로서 벨기에의 종말이자 유럽 지정학의 새로운 장의 시작을 알립니다. 정부는 이제 이 역사적인 전환을 관리해야 하지만, 나라의 해체는 또 다른 불안을 일으킬 수 있습니다."
 HOL_politics.26.a: "국민의 결정을 받아들인다"
 HOL_Belgium_gameover: "§R게임 오버!§!"
 HOL_politics.27.t: "국민투표 결과: 통일을 유지하는 벨기에"
 HOL_politics.27.d: "국민투표 결과가 나왔으며, 벨기에 국민은 압도적으로 나라의 통일을 유지하기로 표결했습니다. 이 결정은 네덜란드와 프랑스의 외부 압력을 물리치고 벨기에의 주권과 정체성을 공고히 합니다. 이 결과는 국가 통합의 승리이지만 이 과정에서 생긴 긴장은 남을 수 있으므로, 분열을 치유하고 안정을 되찾을 조치가 필요합니다."
 HOL_politics.27.a: "우리의 단결을 기념한다"
 HOL_politics.28.t: "벨기에 해체"
 HOL_politics.28.d: "국민투표가 마무리되었으며 벨기에 국민은 나라를 해체하기로 표결했습니다. 합의에 따라 벨기에의 영토가 이제 분할되고 있습니다. 네덜란드는 플랑드르를, 프랑스는 왈로니아를 편입하며, 벨기에 동부 일부는 독일에 편입됩니다. 유럽 국경에서 일어난 이 기념비적인 변화는 지역 지정학의 새 시대를 알리며 서유럽의 세력 균형을 새롭게 정의합니다."
 HOL_politics.28.a: "역사적인 투표"
 HOL_politics.29.t: "통일을 유지하는 벨기에"
 HOL_politics.29.d: "국민투표 결과가 나왔으며, 벨기에 국민은 나라의 통일을 지키기로 결정했습니다. 이 결과는 벨기에의 주권을 공고히 하고 영토를 이웃 나라들이 나누려던 야망에 종지부를 찍습니다. 지역을 재편하려는 노력이 멈추면서, 네덜란드와 프랑스, 독일은 이제 강화된 벨기에 국가라는 현실에 대처해야 합니다."
 HOL_politics.29.a: "실망스러운 결과"
 HOL_politics.30.t: "베네수엘라 해상 가스 동반 관계에 대한 네덜란드의 제안"
 HOL_politics.30.d: "네덜란드 정부가 셸과 함께 베네수엘라의 해상 가스 매장량을 채굴하고 정제하는 합작 사업을 제안했습니다. 이 동반 관계는 지역 에너지 생산을 늘리고 외교 관계를 강화할 수 있습니다."
 HOL_politics.30.a: "네덜란드의 제안을 수락한다"
 HOL_politics.30.b: "제안을 거절한다"
 HOL_politics.31.t: "베네수엘라의 에너지 거래 수락"
 HOL_politics.31.d: "베네수엘라 정부가 네덜란드와의 해상 가스 채굴 동반 관계에 동의했습니다. 이 거래는 경제 및 에너지 관계를 강화할 것입니다."
 HOL_politics.31.a: "큰 성공이다!"
 HOL_politics.32.t: "베네수엘라의 에너지 거래 거절"
 HOL_politics.32.d: "베네수엘라 정부가 주권에 대한 우려를 이유로 제안된 에너지 동반 관계를 거절했습니다."
 HOL_politics.32.a: "유감이다."
 HOL_politics.33.t: "아르헨티나 LNG 수출 산업에 대한 네덜란드의 투자"
 HOL_politics.33.d: "셸을 비롯한 네덜란드 에너지 기업들이 아르헨티나의 LNG 수출 기반시설 확장에 관심을 표명했습니다. 이 거래는 경제 관계를 강화하고 아르헨티나를 세계 천연가스 무역의 핵심 주체로 만들 수 있습니다."
 HOL_politics.33.a: "투자를 승인한다"
 HOL_politics.33.b: "제안을 거절한다"
 HOL_politics.34.t: "아르헨티나의 네덜란드 LNG 투자 승인"
 HOL_politics.34.d: "아르헨티나가 LNG 기반시설에 대한 네덜란드의 투자를 승인하여 양국의 에너지 협력이 강화되었습니다. 이는 에너지 무역을 개선하고 수출 역량을 높일 것입니다."
 HOL_politics.34.a: "무역의 커다란 성공이다!"
 HOL_politics.35.t: "아르헨티나의 네덜란드 LNG 투자 거절"
 HOL_politics.35.d: "아르헨티나가 경제적 독립과 전략적 우려를 이유로 LNG 기반시설 확장에 대한 네덜란드의 제안을 거절했습니다."
 HOL_politics.35.a: "유감이다."
 HOL_politics.36.t: "멕시코 해군 현대화 지원에 대한 네덜란드의 제안"
 HOL_politics.36.d: "네덜란드의 선도적 해군 장비 제조사인 다멘 조선소가 멕시코에 네덜란드산 초계정으로 해군 함대를 확장할 기회를 제안했습니다. 이는 멕시코의 해상 안보를 강화하고 네덜란드와 멕시코의 국방 관계를 개선할 수 있습니다."
 HOL_politics.36.a: "해군 동반 관계를 승인한다"
 HOL_politics.36.b: "제안을 거절한다"
 HOL_politics.37.t: "멕시코의 해군 현대화 거래 승인"
 HOL_politics.37.d: "멕시코가 네덜란드의 제안을 수락하여 다멘이 건조한 선박을 자국 해군에 편입하기로 동의했습니다. 이 거래는 네덜란드와 멕시코 사이의 군사 협력을 강화합니다."
 HOL_politics.37.a: "훌륭하다!"
 HOL_politics.38.t: "멕시코의 네덜란드 해군 지원 거절"
 HOL_politics.38.d: "멕시코 정부가 네덜란드의 제안을 거절하고 해군 확장을 위해 국내 생산에 의존하기로 했습니다."
 HOL_politics.38.a: "실망스럽다."
 HOL_politics.39.t: "콜롬비아 카르타헤나 항만 확장에 대한 네덜란드의 투자"
 HOL_politics.39.d: "네덜란드가 라틴 아메리카 최대의 해운 거점 중 하나인 카르타헤나 항의 확장을 제안했습니다. 네덜란드 기반시설 기업들이 항만 물류를 개선하여 무역과 전략적 해군 작전 모두에 도움이 될 것입니다."
 HOL_politics.39.a: "네덜란드의 투자를 승인한다"
 HOL_politics.39.b: "제안을 거절한다"
 HOL_politics.40.t: "콜롬비아의 네덜란드 항만 투자 수락"
 HOL_politics.40.d: "콜롬비아가 네덜란드의 항만 확장 사업에 동의했습니다. 이 동반 관계는 무역 효율을 높이고 지역 물류에서 콜롬비아의 역할을 강화할 것입니다."
 HOL_politics.40.a: "중요한 경제적 걸음이다!"
 HOL_politics.41.t: "콜롬비아의 네덜란드 항만 투자 거절"
 HOL_politics.41.d: "콜롬비아 정부가 경제 주권을 이유로 항만 확장에 대한 네덜란드의 참여를 거절하기로 결정했습니다."
 HOL_politics.41.a: "유감이다."
 HOL_politics.42.t: "파라과이 그린 수소 투자에 대한 네덜란드의 제안"
 HOL_politics.42.d: "네덜란드 기업들이 파라과이의 그린 수소 및 암모니아 부문에 1억 달러 이상을 투자하겠다고 제안했습니다. 이 사업은 파라과이를 라틴 아메리카 재생 에너지 전환의 선도국으로 자리매김하게 할 수 있습니다."
 HOL_politics.42.a: "투자를 승인한다"
 HOL_politics.42.b: "거래를 거절한다"
 HOL_politics.43.t: "파라과이의 네덜란드 그린 수소 투자 승인"
 HOL_politics.43.d: "파라과이가 네덜란드 주도의 그린 수소 사업을 승인했습니다. 이 사업은 경제 성장을 가져오는 동시에 라틴 아메리카의 재생 에너지 야망을 진전시킬 것입니다."
 HOL_politics.43.a: "지속 가능성을 향한 한 걸음이다!"
 HOL_politics.44.t: "파라과이의 네덜란드 그린 수소 투자 거절"
 HOL_politics.44.d: "파라과이가 네덜란드의 제안을 거절하고 독자적으로 재생 에너지 부문을 개발하기로 했습니다."
 HOL_politics.44.a: "실망스럽다."
 HOL_politics.45.t: "페루 푼타 로미타스 풍력 발전 단지에 대한 네덜란드의 투자"
 HOL_politics.45.d: "네덜란드의 지원을 받는 ENGIE 에네르히아 페루가 페루에 대규모 풍력 발전 단지 사업을 제안했습니다. 네덜란드는 이 지역의 재생 에너지 기반시설을 확장하기 위해 추가 지원을 제안했습니다."
 HOL_politics.45.a: "네덜란드의 참여를 승인한다"
 HOL_politics.45.b: "제안을 거절한다"
 HOL_politics.46.t: "페루의 네덜란드 풍력 에너지 투자 수락"
 HOL_politics.46.d: "페루가 푼타 로미타스 풍력 발전 단지에 대한 네덜란드의 참여를 승인했습니다. 이는 페루의 에너지 안보를 높이고 라틴 아메리카 녹색 에너지 시장에서 네덜란드의 입지를 강화할 것입니다."
 HOL_politics.46.a: "지속 가능성의 승리다!"
 HOL_politics.47.t: "페루의 네덜란드 풍력 에너지 투자 거절"
 HOL_politics.47.d: "페루 정부가 네덜란드의 제안을 거절하고 재생 에너지 사업을 자체적으로 처리하는 쪽을 택했습니다."
 HOL_politics.47.a: "유감이다."
 HOL_politics.48.t: "미국에 '마켓 비전 작전' 제안"
 HOL_politics.48.d: "미국과의 전략적 동반 관계를 심화하기 위해 국방부가 네덜란드와 미국의 군수 산업 역량을 통합하려는 공동 구상인 '마켓 비전 작전'의 제안서를 작성했습니다. 이 계획에는 항공우주, 사이버 방어, 물류 기반시설 분야의 공동 연구 개발이 포함됩니다. 미국이 동의한다면 이는 네덜란드 국방 현대화의 전환점이 될 수 있습니다."
 HOL_politics.48.a: "제안서를 워싱턴에 보낸다"
 HOL_politics.48.b: "지금은 적절한 때가 아니다"
 HOL_politics.49.t: "네덜란드의 '마켓 비전 작전' 제안"
 HOL_politics.49.d: "네덜란드 정부가 '마켓 비전 작전'이라는 이름의 공동 군수 산업 구상을 제안했습니다. 이 계획은 사이버 방어, 국방 물류, 첨단 제조 분야의 공동 투자를 골자로 합니다. 신뢰와 의지의 상징이기도 하지만, 실질적인 협력과 자금 또한 요구될 것입니다."
 HOL_politics.49.a: "제안을 수락한다. 동맹을 심화한다"
 HOL_politics.49.b: "정중히 거절한다. 우리의 우선순위는 다른 곳에 있다"
 HOL_politics.50.t: "마켓 비전 작전 거부"
 HOL_politics.50.d: "미국이 네덜란드와 미국의 국방 산업 협력을 강화하기 위한 공동 구상인 '마켓 비전 작전'을 시작하자는 우리의 제안을 거절했습니다. 외교적 어조는 정중했지만, 이 거절은 워싱턴이 현재 전략적 국방 통합을 심화할 의사가 없다는 분명한 신호입니다. 우리는 단독으로든 다른 파트너와 함께든 현대화 계획을 재고해야 합니다."
 HOL_politics.50.a: "실망스러운 차질이다."
 HOL_politics.51.t: "네덜란드의 무역 및 개발 협정 제안"
 HOL_politics.51.d: "네덜란드 정부가 수리남에 포괄적인 무역 및 개발 협정을 공식 제안했습니다. 제안된 거래에는 기반시설 투자, 유리한 무역 접근, 기술 지원이 포함되며, 그 대가로 외교 및 경제 관계의 강화를 요구합니다. 이 협정을 수락하면 우리의 발전에 도움이 될 수 있습니다. 하지만 우리 내정에 대한 네덜란드의 영향력도 커질 수 있습니다."
 HOL_politics.51.a: "네덜란드의 제안을 수락한다"
 HOL_politics.51.b: "독립을 지키기 위해 제안을 거절한다"
 HOL_politics.52.t: "수리남의 무역 및 개발 협정 수락"
 HOL_politics.52.d: "수리남이 무역 및 개발 협정 제안을 공식적으로 수락했습니다. 이는 네덜란드와 수리남 협력의 새로운 장을 열며 상호 투자와 더 깊은 경제 통합의 기회를 제공합니다."
 HOL_politics.52.a: "역사적인 전진이다."
 HOL_politics.53.t: "네덜란드 무역 제안을 수락한 수리남"
 HOL_politics.53.d: "협상 끝에 수리남 정부가 제안된 무역 및 개발 협정에 동의했습니다. 조건에는 기반시설 원조, 항만 투자, 장기적인 무역 접근이 포함됩니다. 이 거래는 남아메리카에서 우리의 입지를 강화하고 네덜란드의 지역적 존재감을 재확인합니다."
 HOL_politics.53.a: "훌륭하다. 함께 나아가자."
 HOL_politics.54.t: "수리남 기반시설 개발에 대한 네덜란드의 제안"
 HOL_politics.54.d: "네덜란드 정부가 §Y[SUR.GetNameWithFlag]§!의 핵심 기반시설 현대화와 확장을 돕겠다는 제안을 내놓았습니다. 이 제안에는 경제 성장과 지역 연결성을 높이기 위한 도로망, 항만 시설, 공공 설비 투자가 포함됩니다. 수리남은 이제 이 구상을 수락할지 결정해야 합니다."
 HOL_politics.54.a: "네덜란드의 투자와 협력을 수락한다."
 HOL_politics.54.b: "거절한다. 국내 사업을 우선한다."
 HOL_politics.55.t: "수리남의 기반시설 협정 수락"
 HOL_politics.55.d: "§Y[SUR.GetNameWithFlag]§!이(가) 수리남의 기반시설을 공동으로 개발하고 현대화하자는 우리의 제안을 수락했습니다. 도로, 항만, 공공 설비에 대한 투자가 곧 시작되어 경제적 유대를 강화하고 양국의 역사적 관계를 깊게 할 것입니다."
 HOL_politics.55.a: "훌륭하다. 더 강한 협력을 향한 한 걸음이다."
 HOL_politics.56.t: "수리남의 기반시설 협정 거절"
 HOL_politics.56.d: "§Y[SUR.GetNameWithFlag]§!이(가) 기반시설 개발과 현대화를 돕겠다는 우리의 제안을 거절했습니다. 수리남은 더 큰 국가적 독립과 내부 사업에 대한 통제권을 원한다는 이유로 네덜란드의 개입 없이 자신들의 길을 가기로 했습니다."
 HOL_politics.56.a: "실망스럽지만 그들의 결정을 존중한다."
 HOL_politics.63.t: "해양 협력 협정"
 HOL_politics.63.d: "네덜란드 정부가 수리남에 해양 협력 협정을 체결하자는 공식 제안을 내놓았습니다. 이 계획에는 항만 기반시설 투자, 준설 작업, 해안 물류, 해군 훈련 지원이 포함됩니다. 이 구상은 수리남의 해양 역량과 지역 무역에서의 입지를 높일 수 있습니다. 또한 네덜란드의 전략적 영향력도 커질 수 있습니다."
 HOL_politics.63.a: "협정을 수락한다"
 HOL_politics.63.b: "제안을 거절한다"
 HOL_politics.64.t: "수리남의 해양 협정 수락"
 HOL_politics.64.d: "수리남이 네덜란드의 해양 협력 제안에 동의했습니다. 곧 해안 기반시설 개발과 해군 역량 구축에 관한 공동 구상이 시작될 것입니다. 이는 지역 안보와 경제적 접근에 초점을 맞춘, 네덜란드와 수리남 관계의 새로운 장을 의미합니다."
 HOL_politics.64.a: "구상을 개시한다"
 HOL_politics.65.t: "수리남의 해양 협정 거절"
 HOL_politics.65.d: "수리남이 해양 협력 제안을 거절했습니다. 이 거절은 주권, 영향력 또는 국내 정치에 대한 우려로 인해 양자 관계를 심화하는 데 망설이고 있음을 보여 줍니다. 그 결과 해양 협력 계획은 당분간 보류됩니다."
 HOL_politics.65.a: "놓쳐 버린 기회"
 HOL_politics.66.t: "합동 군사 훈련 제안"
 HOL_politics.66.d: "네덜란드 정부가 합동 군사 훈련을 제안해 왔습니다. 이 구상은 양국 군대 사이의 전술적 협력, 지역 대비 태세, 상호 신뢰를 강화하는 것을 목표로 합니다."
 HOL_politics.66.a: "제안을 수락한다"
 HOL_politics.66.b: "당분간 거절한다"
 HOL_politics.67.t: "군사 훈련 제안을 수락한 수리남"
 HOL_politics.67.d: "수리남이 우리 군과 합동 훈련 작전을 실시하기로 동의했습니다. 물류, 정글전, 국경 작전에 초점을 맞춘 일련의 양자 훈련이 준비되고 있습니다."
 HOL_politics.67.a: "협력을 통한 강함"
 HOL_politics.68.t: "군사 훈련 제안을 거절한 수리남"
 HOL_politics.68.d: "수리남이 합동 군사 훈련에 참여하자는 우리의 제안을 거절했습니다. 실망스러운 결정이지만, 우리는 지역 국방 관계를 심화할 방법을 계속 모색할 것입니다."
 HOL_politics.68.a: "알겠다"
 HOL_politics.69.t: "네덜란드의 자원 투자 제안"
 HOL_politics.69.d: "네덜란드 정부가 우리의 자원 부문에 투자하겠다는 제안을 들고 접근했습니다. 이 계획에는 장기 수출 계약과 함께 알루미늄 채굴 및 정련에 대한 자본 투입이 포함됩니다. 이는 발전의 기회를 제공할 수 있지만, 네덜란드 자본에 다시 의존하게 될 것을 우려하는 목소리도 있습니다."
 HOL_politics.69.a: "투자를 수락한다"
 HOL_politics.69.b: "제안을 거절한다"
 HOL_politics.69_tt: "§R우리는 [1006.GetName]의 자원 권리를 [HOL.GetName]에 넘깁니다§!"
 HOL_politics.70.t: "수리남의 자원 투자 수락"
 HOL_politics.70.d: "수리남이 우리의 자원 투자 제안에 동의했습니다. 네덜란드 기업과 기술 고문들이 곧 선정된 지역에서 활동을 시작할 것입니다."
 HOL_politics.70.a: "이행을 진행한다"
 HOL_politics.71.t: "수리남의 자원 투자 거절"
 HOL_politics.71.d: "수리남이 천연자원 부문에 투자하겠다는 우리의 제안을 거절했습니다. 주권과 외국인 소유에 대한 우려가 경제적 유인보다 더 컸던 것으로 보입니다."
 HOL_politics.71.a: "그들의 결정을 존중한다"
 HOL_politics.72.t: "코크 2기 내각의 붕괴"
 HOL_politics.72.d: "스레브레니차 함락에 대한 네덜란드의 역할을 다룬 NIOD 보고서가 발표된 후, 빔 코크 총리와 그의 정부가 사임을 표명했습니다. 이 조치는 책임을 지는 상징적 행위로 여겨지지만, 총선을 불과 몇 달 앞두고 정치 지형을 혼란에 빠뜨렸습니다."
 HOL_politics.72.a: "내각이 물러난다"
 HOL_politics.73.t: "네덜란드 임시 총선"
 HOL_politics.73.desc: "코크 2기 내각이 붕괴하면서 조기 선거가 실시됩니다. 정치 분위기는 격동적이며 여러 주요 정당이 권력을 두고 경쟁할 준비를 하고 있습니다. 포퓰리즘의 부상, 책임 문제, 국가 정체성이 논쟁을 지배하고 있습니다."
 HOL_politics.73.a: "PvdA를 지지한다 - 중도좌파의 연속성"
 HOL_politics.73.b: "CDA를 지지한다 - 기독교 민주주의적 안정"
 HOL_politics.73.c: "VVD를 지지한다 - 자유주의적 경제 개혁"
 HOL_politics.73.d: "PVV를 지지한다 - 포르퇴인주의 유산의 계승"
 HOL_politics.73.e: "LPF를 지지한다 - 포르퇴인의 포퓰리스트 운동"
 HOL_politics.73_tt: "§Y우리의 선거는 14일 후에 시작됩니다§!"
 HOL_politics.74.t: "NATO 합동 훈련 구상"
 HOL_politics.74.d: "대서양 횡단 국방 협력을 강화하기 위해 네덜란드가 미국, 영국, 독일, 벨기에, 프랑스가 참여하는 합동 군사 훈련 프로그램을 시작했습니다. 이 훈련은 NATO 회원국 간의 상호 운용성, 대비 태세, 전략적 보조를 개선하는 것을 목표로 합니다."
 HOL_politics.74.a: "함께하면 우리는 더 강하다."
 HOL_politics.75.t: "아프리카너에게 내민 네덜란드 정부의 손"
 HOL_politics.75.d: "현재 PVV가 통치하는 네덜란드가 남아프리카의 아프리카너 공동체와의 문화적, 역사적 유대를 강화하는 것을 목표로 한 새로운 정책을 공식 발표했습니다. 이 구상은 두 민족이 공유하는 유산에 대한 새로운 관심을 불러일으켰습니다."
 HOL_politics.75.a: "우리도 행동에 나서야 한다!"
 HOL_politics.76.t: "아프리카너의 권리를 보호하라는 네덜란드의 압력"
 HOL_politics.76.d: "네덜란드 정부가 상징적 제스처를 넘어, 이제 남아프리카에 아프리카너 공동체의 권리를 보호하겠다고 공식적으로 약속하라며 정치적 압력을 가하고 있습니다. 네덜란드의 영향력은 커지고 있으며 그들의 기대는 분명합니다. 동족을 보호하든가, 아니면 외교적 파장을 감수하라는 것입니다."
 HOL_politics.76.a: "우리의 내정이 복잡해진다"
 HOL_politics.77.t: "아프리카너 기업에 대한 네덜란드의 투자"
 HOL_politics.77.d: "네덜란드 정부가 아프리카너 소유 기업과의 무역 및 투자 관계를 강화하는 데 초점을 맞춘 표적 경제 프로그램을 시작했습니다. 이 조치는 병행 협력 경로를 육성하고 두 공동체 사이의 역사적 유대를 깊게 하려는 것이며, 우리가 남아프리카를 통치하는 방식을 공격하는 것입니다"
 HOL_politics.77.a: "이것은 영원한 도전이 될 수 있다"
 HOL_common_event.1.t: "베아트릭스 여왕의 퇴위 발표"
 HOL_common_event.1.d: "베아트릭스 여왕이 전국에 중계된 연설에서 아들 빌럼알렉산더 왕자에게 왕위를 넘기고 퇴위하겠다는 결정을 공식 발표했습니다. 30년이 넘는 재위 끝에, 그녀는 이제 새로운 세대가 이끌 때가 되었다고 밝혔습니다. 권력 이양은 4월 30일 암스테르담 왕궁에서 이루어질 예정입니다."
 HOL_common_event.1.a: "왕실의 교체가 시작된다."
 HOL_common_event.2.t: "빌럼알렉산더 국왕 즉위"
 HOL_common_event.2.d: "베아트릭스 여왕의 퇴위에 따라 빌럼알렉산더 왕자가 네덜란드 왕국의 새 군주로 공식 즉위했습니다. 암스테르담 왕궁에서 열린 이 의식은 네덜란드 입헌 군주제의 새로운 장의 시작을 알립니다. 그의 즉위는 국민적 자긍심과 함께 현대적인 왕실 역할에 대한 기대를 받고 있습니다."
 HOL_common_event.2.a: "국왕 폐하 만세!"
 HOL_common_event.3.t: "빌럼알렉산더 국왕의 퇴위 발표"
 HOL_common_event.3.d: "수년간 군주로 재위한 끝에 빌럼알렉산더 국왕이 왕위에서 물러나겠다는 뜻을 공식 선언했습니다. 현대 네덜란드의 전통에 따라, 그는 아말리아 왕세녀가 왕국을 새로운 시대로 이끌 능력에 확신을 표명했습니다. 즉위식은 적절한 때에 열릴 것입니다."
 HOL_common_event.3.a: "횃불이 다시 한번 넘겨진다."
 HOL_common_event.4.t: "아말리아 여왕 즉위"
 HOL_common_event.4.d: "카타리나아말리아 공주가 네덜란드 여왕으로 공식 즉위하여 이 나라 현대사에서 가장 젊은 군주가 되었습니다. 그녀의 즉위는 네덜란드 입헌 군주제의 연속성과 쇄신을 동시에 상징하며, 기대와 국민적 자긍심 속에 맞이되고 있습니다."
 HOL_common_event.4.a: "여왕 폐하 만세!"
 HOL_common_event.5.t: "말레이시아 항공 MH17편 격추"
 HOL_common_event.5.d: "말레이시아 항공 MH17편이 우크라이나 동부 상공에서 격추되었습니다. 네덜란드 국민 193명을 포함한 탑승자와 승무원 298명 전원이 사망했습니다. 국제 조사단은 러시아제 지대공 미사일이 사용되었다고 의심하고 있습니다. 네덜란드는 애도에 잠겼습니다. 우리는 대응해야 합니다."
 HOL_common_event.5.a: "이제 세계가 우리를 지켜보고 있다."
 HOL_common_event.6.t: "국제연합에서의 티메르만스 연설"
 HOL_common_event.6.a: "러시아의 협조와 보상을 요구한다"
 HOL_common_event.6.b: "평화를 유지하기 위해 긴장을 완화한다"
 HOL_common_event.6.c: "전쟁을 준비해야 한다. 전쟁 명분을 만든다"
 HOL_common_event.6.d: "프란스 티메르만스 외무장관이 국제연합에서 MH17 격추에 대한 정의와 책임을 촉구하는 강력한 연설을 했습니다. 이제 우리는 어디까지 나아갈 의향이 있는지 결정해야 합니다. 외교를 추구할 것인지, 긴장을 완화할 것인지, 아니면 군사적 결과에 대비할 것인지입니다."
 HOL_common_event.7.t: "네덜란드의 NATO 군사적 대응 요청"
 HOL_common_event.7.d: "네덜란드 정부가 제5조와 침략 행위를 근거로 MH17 격추에 대응하여 군사 행동을 취해 달라고 NATO에 공식 요청했습니다. 동맹의 주요 강국으로서, 우리는 이 요청에 응하여 러시아와의 더 큰 충돌 위험을 감수할지 결정해야 합니다."
 HOL_common_event.7.a: "네덜란드를 지지하고 전쟁을 준비한다"
 HOL_common_event.7.b: "이를 세계적 분쟁으로 확대할 수는 없다"
 HOL_common_event.8.t: "미국의 NATO 행동 지지"
 HOL_common_event.8.d: "미국이 MH17에 대응한 NATO의 군사 행동 요청을 승인했습니다. 이로 인해 즉각적인 충돌이 벌어지겠지만 우리는 홀로 서지 않을 것입니다. 러시아가 공식 선전포고를 했습니다."
 HOL_common_event.8.a: "단결하여 맞서자."
 HOL_common_event.9.t: "미국의 NATO 확전 거부"
 HOL_common_event.9.d: "NATO가 행동해 달라는 우리의 요청에도 불구하고, 미국이 군사적 대응을 승인하기를 거부했습니다. 우리는 이 위기의 순간에 홀로 서 있지만, 어쨌든 행동할 것입니다. 러시아와의 잠재적 충돌에 대한 준비가 진행 중입니다."
 HOL_common_event.9.a: "그렇다면 홀로 나아가야 한다."
 HOL_common_event.10.t: "엔스헤데 불꽃놀이 참사"
 HOL_common_event.10.d: "엔스헤데 룸베이크 지구의 SE 불꽃놀이 창고에서 대참사급 폭발이 일어났습니다. 폭발은 한 동네 전체를 파괴하여 23명이 사망하고 거의 천 명이 부상을 입었습니다. 이 참사는 온 나라에 충격을 주었고 산업 안전 규정에 대한 의문을 제기했으며 수백 명의 이재민을 낳았습니다."
 HOL_common_event.10.a: "국가적 비극이다."
 HOL_common_event.11.t: "암스테르담에서 암살당한 테오 판 호흐"
 HOL_common_event.11.d: "논란이 많은 영화감독이자 칼럼니스트인 테오 판 호흐가 암스테르담에서 대낮에 살해되었습니다. 네덜란드계 모로코인 극단주의자인 범인은 판 호흐의 영화 '복종'을 동기로 들었습니다. 이 사건은 네덜란드 사회에 충격을 안겨 표현의 자유, 사회 통합, 종교적 극단주의를 둘러싼 전국적 논쟁을 불러일으켰습니다."
 HOL_common_event.11.a: "네덜란드의 암울한 날이다."
 HOL_common_event.12.t: "여왕의 날 퍼레이드 공격"
 HOL_common_event.12.d: "아펠도른에서 열린 전국적인 여왕의 날 기념행사 중 왕실 퍼레이드를 구경하던 군중 속으로 차량이 의도적으로 돌진하는 비극이 벌어졌습니다. 이 공격으로 8명이 목숨을 잃고 다수가 부상을 입었으나 왕실 가족은 무사히 빠져나왔습니다. 이 사건은 평소 단결과 축하의 날이던 이날에 어두운 그림자를 드리웠습니다."
 HOL_common_event.12.a: "국가적 자긍심의 날에 벌어진 끔찍한 만행이다."
 HOL_common_event.13.t: "알펜 안 덴 레인 총기 난사"
 HOL_common_event.13.d: "비극적인 폭력 행위로, 한 총기범이 알펜 안 덴 레인의 쇼핑센터에서 총을 난사하여 6명을 숨지게 하고 17명을 다치게 한 뒤 스스로 목숨을 끊었습니다. 이 사건은 온 나라를 충격에 빠뜨렸으며 총기 접근성, 정신 건강 관리, 공공 안전에 대한 시급한 의문을 제기했습니다."
 HOL_common_event.13.a: "충격적인 비극이다."
 HOL_common_event.14.t: "림뷔르흐의 심각한 홍수"
 HOL_common_event.14.d: "기록적인 강우로 림뷔르흐 주에 대참사급 홍수가 발생했습니다. 강이 범람하여 팔컨뷔르흐와 루르몬트 같은 도시가 물에 잠겼습니다. 수천 명이 대피했고 기반시설이 손상되었으며 전국에 긴급 구조대가 투입되었습니다. 인명 피해는 없었지만, 이 재난은 기후 적응과 물 관리에 대한 논쟁을 다시 불붙였습니다."
 HOL_common_event.14.a: "기후 위기가 매우 현실이 되고 있다."
 HOL_common_event.15.t: "림뷔르흐의 향후 홍수를 예방할까?"
 HOL_common_event.15.d: "림뷔르흐의 파괴적인 홍수 이후, 공학 전문가들이 향후 재난을 완화하기 위한 대규모 댐과 저수 시스템을 제안했습니다. 이 사업은 상당한 투자가 필요하지만 수천 채의 주택을 보호하고 핵심 기반시설을 지킬 수 있습니다. 우리는 단호하게 행동하겠습니까, 아니면 다시 한번 미루겠습니까?"
 HOL_common_event.15.a: "림뷔르흐 홍수 방어 댐을 건설한다"
 HOL_common_event.15.b: "지금은 비용이 너무 크다"
 HOL_common_event.17.t: "프리소 왕자 서거"
 HOL_common_event.17.d: "비극적인 스키 사고 이후 1년이 넘도록 혼수상태에 있던 요한 프리소 왕자가 44세의 나이로 서거했습니다. 그의 죽음에 온 나라가 깊은 슬픔에 잠겼습니다. 왕위 계승 순위에는 들지 않았지만, 프리소는 많은 이들의 마음속에 특별한 자리를 차지하고 있었습니다."
 HOL_common_event.17.a: "그는 따뜻하게 기억될 것이다."
 HOL_common_event.16.t: "눈사태에 휘말린 프리소 왕자"
 HOL_common_event.16.d: "요한 프리소 왕자가 오스트리아에서 스키를 타던 중 눈사태로 위독한 부상을 입었습니다. 20분이 넘도록 눈 속에 묻혀 있다가 구조되었으나 산소 결핍으로 심각한 뇌 손상을 입었습니다. 왕실 가족은 그의 상태가 불확실한 동안 사생활 보호를 요청했습니다."
 HOL_common_event.16.a: "끔찍한 사고가 나라를 뒤흔든다."
 HOL_request_carrier_production_USA: "항공모함 건조에 대한 미국의 지원 요청"
 HOL_request_carrier_production_USA_desc: "미국은 항공모함 기반 해전에서 타의 추종을 불허하는 전문성을 보유하고 있습니다. 공식적으로 지원을 요청하면 미국의 조선소 역량과 기술에 접근하여 공동 방위 산업 협정에 따라 현대적인 네덜란드 항공모함 건조를 시작할 수 있습니다."
 HOL_request_carrier_production_FRA: "항공모함 건조에 대한 프랑스의 지원 요청"
 HOL_request_carrier_production_FRA_desc: "프랑스는 핵 추진 항공모함을 포함해 유럽에서 가장 앞선 해군력 중 하나를 유지하고 있습니다. 프랑스 조선 산업과 협력하면 새 항공모함을 배치하는 능력을 앞당기고 유럽 방위 통합을 심화할 수 있습니다."
 HOL_request_carrier_production_RUS: "항공모함 건조에 대한 러시아의 지원 요청"
 HOL_request_carrier_production_RUS_desc: "논란이 있기는 하지만, 러시아와의 협력은 서방권 밖의 대안적인 해군 기술과 설계에 접근할 기회를 제공할 수 있습니다. 공동 건조 노력은 지정학적으로 대담하지만 전략적으로 유연할 것입니다."
 HOL_Flanders_Influence_variable: "§Y[FLN.GetNameWithFlag]§!에서의 §Y[HOL.GetAdjective]§! 존재감: §Y[?HOL.dutch_influence]§!"
 HOL_Flanders_Integration_level: "§Y[HOL.GetAdjective]§! 통합 단계: §Y[?HOL.HOL_integration_level]§!"
 HOL_pro_dutch_coalition: "§Y[HOL.GetAdjective]§! 지지 연립 후원"
 HOL_pro_dutch_coalition_desc: "§Y[FLN.GetNameWithFlag]§! 내에서 §Y[HOL.GetAdjective]§! 통합에 호의적인 정치 연립을 후원합니다. 이는 §Y[FLN.GetNameWithFlag]§!에서 §Y[HOL.GetAdjective]§! 영향력을 높이고 그들의 대의를 뒷받침할 것입니다."
 HOL_pro_dutch_in_power: "§Y[HOL.GetAdjective]§! 지지 정부 집권"
 HOL_pro_dutch_in_power_desc: "§Y[FLN.GetNameWithFlag]§!에 §Y[HOL.GetAdjective]§! 지지 정부가 들어서면서 우리의 영향력이 크게 커집니다. 이 기회를 잡아 통합 노력을 밀어붙이십시오."
 HOL_flanders_high_productivity: "§Y[FLN.GetNameWithFlag]§!의 생산성 성장"
 HOL_flanders_high_productivity_desc: "§Y[FLN.GetNameWithFlag]§!의 생산성이 벨기에 전국 평균을 넘어서 통합 정서를 북돋고 네덜란드의 영향력을 높이고 있습니다."
 BEL_counter_influence_flanders: "§Y[FLN.GetNameWithFlag]§!에서의 §Y[HOL.GetAdjective]§! 존재감에 대응"
 BEL_counter_influence_flanders_desc: "네덜란드가 §Y[FLN.GetNameWithFlag]§!에 대한 존재감을 넓히려 하고 있습니다. 이러한 노력에 맞서 벨기에의 통일과 주권을 지키십시오."
 HOL_influence_increased5: "§Y[FLN.GetNameWithFlag]§!에서의 §Y[HOL.GetAdjective]§! 존재감이 §Y5§!!만큼 증가합니다"
 HOL_influence_increased2: "§Y[FLN.GetNameWithFlag]§!에서의 §Y[HOL.GetAdjective]§! 존재감이 §Y2§!!만큼 증가합니다"
 HOL_influence_decreased10: "§Y[FLN.GetNameWithFlag]§!에서의 §Y[HOL.GetAdjective]§! 존재감이 §Y10§!!만큼 감소합니다"
 HOL_voc_india_mission1: "§Y[RAJ.GetNameWithFlag]§!에서 영향력 공고화"
 HOL_voc_india_mission2: "§Y[RAJ.GetNameWithFlag]§!에 [HOL.GetFlag]§Y[HOL.GetAdjective]§! 함대 배치"
 HOL_voc_india_water: "§Y[HOL.GetAdjective]§! 물 관리 선전 개시"
 HOL_voc_india_water_desc: "§Y[HOL.GetAdjective]§! 물 관리는 전설적입니다. §Y[RAJ.GetAdjective]§! 정부는 물 문제를 해결하는 데 어려움을 겪고 있습니다. 선전 운동을 펼치면 정부가 §Y[HOL.GetAdjective]§! 측이 문제를 해결하도록 맡기게끔 압박받게 됩니다"
 HOL_voc_india_christian: "§Y[RAJ.GetNameWithFlag]§!의 기독교 공동체 지원"
 HOL_voc_india_christian_desc: "§Y[RAJ.GetNameWithFlag]§!의 기독교 공동체는 §Y[RAJ.GetAdjectiveCap]§! 정부에 매우 불만을 느끼고 있습니다. 이 기회를 이용해 기독교 공동체에서 우리의 영향력을 높여야 합니다"
 HOL_voc_india_civilwar: "§Y[RAJ.GetNameWithFlag]§!에 최후통첩 발송"
 HOL_voc_india_civilwar_desc: "§Y[RAJ.GetAdjectiveCap]§!은(는) 내전 중입니다. 이 기회를 이용해 그들이 거절할 수 없는 제안을 할 수 있습니다."
 HOL_voc_india_gujurat_rebellion1: "§YGujurat§! 지역의 치안을 강화하고 주민 지지를 확보한다"
 HOL_voc_india_gujurat_rebellion1_desc: "마오주의 반란을 기회로 삼을 수 있습니다. 치안을 강화하고 마오주의자에 맞서 주민의 지지를 얻는다면 구자라트에서 우리 자신의 영향력을 구축할 수 있습니다."
 HOL_voc_india_bengal_rebellion1: "벵골에서 §Y[HOL.GetAdjectiveCap]§!의 입지 확대"
 HOL_voc_india_bengal_rebellion1_desc: "마오주의 반군 활동으로 인한 §YBengal§!의 불안정은 §Y[HOL.GetAdjectiveCap]§!이(가) 영향력을 행사할 특별한 기회입니다. §Y[RAJ.GetAdjectiveCap]§! 정부가 주의를 빼앗겨 통제력을 유지하지 못하는 틈에, VOC는 경제적·정치적 유대를 구축하고 현지 통치를 더욱 약화시키며 이 지역에서 거점을 확보할 수 있습니다."
 HOL_voc_india_east_gujurat: "§YEast Gujarat§! 장악"
 HOL_voc_india_east_gujurat_desc: "§YEast Gujarat§!은(는) 소요와 취약한 통치로 불안정해졌습니다. VOC는 단호하게 움직여 이 지역의 통제권을 주장하고, §Y[HOL.GetAdjectiveCap]§! 행정 아래 질서를 회복하며 귀중한 무역로를 확보할 수 있습니다."
 HOL_voc_india_west_bengal: "§YWest Bengal§! 장악"
 HOL_voc_india_west_bengal_desc: "§YWest Bengal§!이(가) 혼란에 빠진 지금, VOC는 이 핵심 지역에 대한 지배권을 확립할 특별한 기회를 맞았습니다. 이곳을 장악하면 인도 동부 무역 회랑에서 §Y[HOL.GetAdjectiveCap]§! 입지가 공고해질 것입니다."
 HOL_voc_india_kerala: "§YKerala§! 장악"
 HOL_voc_india_kerala_desc: "케랄라의 전략적 위치와 §Y[HOL.GetAdjectiveCap]§!과(와)의 역사적 유대는 이곳을 VOC 개입의 일순위 표적으로 만듭니다. 이 지역을 장악하면 남인도에서 §Y[HOL.GetAdjectiveCap]§! 세력의 강력한 거점이 마련될 것입니다."
 HOL_voc_india_tamil: "타밀나두 장악"
 HOL_voc_india_tamil_desc: "타밀나두는 커져가는 불안정으로 인해 붕괴 직전에 있습니다. 이곳을 장악함으로써 VOC는 인도의 가장 중요한 지역 중 하나에 대한 지배권을 확보하고 §Y[HOL.GetAdjectiveCap]§! 이익을 보호할 수 있습니다."
 HOL_voc_taiwan_agreement_USA: "§Y[USA.GetNameWithFlag]§!과(와) 대만 협정 협상"
 HOL_voc_taiwan_agreement_USA_desc: "§Y[USA.GetNameWithFlag]§!은(는) 오랫동안 §Y[TAI.GetAdjectiveCap]§! 안보의 보증인이었습니다. 이 지역에서 §Y[HOL.GetAdjectiveCap]§! 이익을 증진하려면 §Y[USA.GetAdjectiveCap]§! 정부에 접근하여 §Y[TAI.GetNameWithFlag]§!에 대한 보호의 중단을 요청해야 합니다. 이 대담한 외교적 행보는 VOC가 영토를 되찾는 길을 열 수 있으나, 상당한 정치적 위험이 따릅니다."
 HOL_voc_agriculture_agreement_srilanka: "§Y[SRI.GetNameWithFlag]§!에 농업 협력 제안"
 HOL_voc_agriculture_agreement_srilanka_desc: "§Y[SRI.GetAdjectiveCap]§! 농업 부문은 수많은 난관에 직면해 있으며, 현대 영농 기술에 관한 §Y[HOL.GetAdjectiveCap]§! 전문성은 획기적인 해법을 제공할 수 있습니다. 농업 협력을 제안함으로써 §Y[SRI.GetNameWithFlag]§!과(와)의 유대를 강화하고 이 지역에서 거점을 확립하여 경제 생산과 §Y[HOL.GetAdjectiveCap]§! 입지를 함께 높일 수 있습니다."
 HOL_voc_investment_agreement_srilanka: "§Y[SRI.GetNameWithFlag]§!과(와) 투자 협정 재추진"
 HOL_voc_investment_agreement_srilanka_desc: "스리랑카가 우리의 최초 투자 제안을 거절한 뒤, 우리는 재협상을 통해 스리랑카 농업 부문을 강화할 기회를 다시 모색할 수 있습니다. 이는 네덜란드의 입지를 확립하고 이 지역의 경제 성장을 도모할 또 한 번의 기회입니다."
 HOL_voc_srilanka_mission1: "§Y[SRI.GetNameWithFlag]§!에서 영향력 공고화"
 HOL_voc_srilanka_mission1_desc: "§Y[SRI.GetNameWithFlag]§!에 대한 §Y[HOL.GetAdjectiveCap]§! 통제력을 재확립하려면 이 나라에서 영향력 상위 3개국 중 하나가 되어야 합니다. 이 위치를 달성하면 우리의 입지가 공고해지고 이 지역에서 더 큰 지배력을 확보하는 길이 열릴 것입니다."
 HOL_voc_srilanka_mission2: "§Y[SRI.GetNameWithFlag]§!에 [HOL.GetFlag]§Y[HOL.GetAdjective]§! 함대 배치"
 HOL_voc_srilanka_mission2_desc: "§Y[SRI.GetNameWithFlag]§!에 대한 우리의 지배력을 확보하려면 그들보다 강력한 해군 전력이 필요합니다. §Y[SRI.GetNameWithFlag]§! 주변 해역을 장악하면 중요한 무역로를 확보하고 인도양에서 우리의 권위를 확립할 수 있습니다."
 HOL_voc_taiwan_mission1: "§Y[TAI.GetNameWithFlag]§!에서 영향력 공고화"
 HOL_voc_taiwan_mission1_desc: "§Y[TAI.GetAdjectiveCap]§! 전략적 중요성은 아무리 강조해도 지나치지 않습니다. §Y[HOL.GetAdjectiveCap]§! 입지를 확대하려면 이 나라에서 영향력 상위 3개국 안에 들어, 이 핵심 지역에서의 거점을 확보해야 합니다."
 HOL_voc_taiwan_mission2: "§Y[TAI.GetNameWithFlag]§!에 [HOL.GetFlag]§Y[HOL.GetAdjective]§! 함대 배치"
 HOL_voc_taiwan_mission2_desc: "태평양에서 §Y[TAI.GetAdjectiveCap]§! 위치는 해상 우위를 필수적으로 만듭니다. 주변 해역을 장악하고 이 지역에서 우리의 이익을 확보하려면 §Y[TAI.GetAdjectiveCap]§! 해군력을 능가해야 합니다."
 HOL_voc_indonesia_attack_mission: "우리 §Y[IND.GetNameWithFlag]§! 수복이 시작된다!"
 HOL_voc_indonesia_attack_mission_desc: "한때 VOC 제국의 보석이었던 인도네시아는 §Y[HOL.GetAdjectiveCap]§! 통제에서 벗어났습니다. 이제 우리의 직할 식민지를 되찾을 때가 왔습니다. 정밀한 군사 작전과 전략적 우위를 통해 군도에 대한 §Y[HOL.GetAdjectiveCap]§! 권위를 회복하고 세계적 강국으로서의 입지를 재확립할 것입니다."
 HOL_request_military_access_australia: "§Y[AST.GetNameWithFlag]§!에 군사 통행권 요청"
 HOL_request_military_access_australia_desc: "§Y[AST.GetAdjectiveCap]§! 전략적 위치는 태평양에서의 우리 작전에 필수적입니다. 군사 통행권을 확보하면 보급이 원활해지고 대응 시간이 단축될 것입니다."
 HOL_deploy_java_commando: "VOC 병력 투입"
 HOL_deploy_java_commando_desc: "전략적 거점을 확립하기 위해 우리의 비밀 특공대를 §Y[IND.GetNameWithFlag]§!에 투입합니다. 병력의 규모와 종류는 우리의 사전 준비에 따라 결정됩니다."
 HOL_voc_small_reinvestment_sri_lanka: "§Y[SRI.GetAdjectiveCap]§! 농업에 소규모 투자"
 HOL_voc_medium_reinvestment_sri_lanka: "§Y[SRI.GetAdjectiveCap]§! 농업에 중규모 투자"
 HOL_voc_heavy_reinvestment_sri_lanka: "§Y[SRI.GetAdjectiveCap]§! 농업에 대규모 투자"
 HOL_voc_saf_mission1: "§Y[SAF.GetNameWithFlag]§!에서 영향력 공고화"
 HOL_voc_saf_mission2: "§Y[SAF.GetNameWithFlag]§!에 [HOL.GetFlag]§Y[HOL.GetAdjective]§! 함대 배치"
 HOL_increase_java_strength: "§YJava Island§!에서 우리의 전력 증강"
 HOL_increase_convoy: "침공 지원 함선 증강"
 HOL_reduce_java_detection_corruption: "§Y[IND.GetNameWithFlag]§!의 부패 관료 활용"
 HOL_contact_christian_resistance_ind: "§YChristian Rebels§!에 협정 제안"
 HOL_reduce_java_detection: "§YJava Island§!에서 비밀 보안 강화"
 HOL_voc_indonesia_counter_voc: "§Y[HOL.GetAdjectiveCap]§! 반란에 관한 새로운 보고"
 HOL_voc_prepare_for_war_mission1: "VOC 영토 수복 준비"
 HOL_voc_prepare_for_war_mission1_desc: "무역 제국의 시대는 지나갔을지 모르나 우리의 유산은 아직 미완성입니다. 희망봉에서 코로만델 해안까지, 실론에서 포르모사까지, 네덜란드 동인도 회사는 한때 중요한 해상 요충지를 지배했습니다. 이제 현대적인 병참과 군사적 준비태세를 갖추고, 특허장이 아닌 힘으로 다시 한번 우리의 영향력을 확립할 채비를 합니다. 바다가 우리의 귀환을 기다리고 있습니다."
 HOL_voc_prepare_for_war_mission2: "VOC 영토 수복 재준비"
 HOL_voc_prepare_for_war_mission2_desc: "무역 제국의 시대는 지나갔을지 모르나 우리의 유산은 아직 미완성입니다. 희망봉에서 코로만델 해안까지, 실론에서 포르모사까지, 네덜란드 동인도 회사는 한때 중요한 해상 요충지를 지배했습니다. 이제 현대적인 병참과 군사적 준비태세를 갖추고, 특허장이 아닌 힘으로 다시 한번 우리의 영향력을 확립할 채비를 합니다. 바다가 우리의 귀환을 기다리고 있습니다."
 HOL_grey_society_category: "회색 사회의 딜레마"
 HOL_grey_society_category_desc: "\n£hol_grey_society_category_picture \n\n\n\n네덜란드는 고령화 인구구조, 기대수명 증가, 출산율 하락이 사회 서비스와 연금, 경제적 지속가능성에 막대한 압박을 가하는 회색 사회로 변해가고 있습니다. 정책 입안자들은 이제 세대 간에 벌어지는 간극과 맞서야 합니다. 우리는 개혁할 것인가, 재분배할 것인가, 아니면 지속 불가능한 과거의 모델로 후퇴할 것인가?"
 HOL_grey_pvda1: "저렴한 주택 확대"
 HOL_grey_pvda1_desc: "고령화 인구가 제기하는 도전에 대응하기 위해 우리는 저렴하고 노인 친화적인 주택에 투자하고 있습니다. 주거 규모 축소를 장려하고 주택 재고를 현대화함으로써 가족 주택을 확보하는 한편 노인에게 품위 있는 주거를 제공하고자 합니다."
 HOL_grey_pvda2: "유연한 연금 개혁"
 HOL_grey_pvda2_desc: "우리는 개인의 필요에 맞게 조정되는 공정한 연금 제도를 신뢰합니다. 유연한 은퇴 선택지를 제공함으로써 노동자가 자신의 조건에 따라 은퇴할 수 있도록 하는 동시에 사회보장 제도의 장기적 지속가능성을 보장합니다."
 HOL_grey_pvda3: "노인 돌봄 노동자에 투자"
 HOL_grey_pvda3_desc: "노인 인구가 늘면서 전문 돌봄 인력에 대한 수요가 증가하고 있습니다. 우리는 훈련 프로그램에 자금을 투입하고 근로 조건을 개선하여 모든 네덜란드 노인이 마땅히 받아야 할 돌봄을 받도록 보장합니다."
 HOL_grey_pvda4: "청년-노인 통합 프로그램"
 HOL_grey_pvda4_desc: "세대를 한자리에 모음으로써 우리는 상호 이해와 지원을 키웁니다. 우리의 통합 프로그램은 사회적 교류의 대가로 노인 공동체 내 학생들에게 저렴한 주거를 제공하여 더욱 강하고 결속력 있는 사회를 만듭니다."
 HOL_grey_pvda5: "녹색·은빛 경제 촉진"
 HOL_grey_pvda5_desc: "우리는 녹색 전환을 '실버 경제'가 제시하는 기회와 연계하고 있습니다. 노인을 겨냥한 산업에 대한 투자와 재생 에너지에 대한 집중이 결합되면 지속 가능한 성장을 이끌고 일자리를 창출할 것입니다."
 HOL_grey_cda1: "가족 기반 돌봄 강화"
 HOL_grey_cda1_desc: "가족은 우리 사회의 초석입니다. 노인 친족을 돌보는 가정에 재정 지원을 제공함으로써 세대 간 유대를 강화하고 공공 의료의 부담을 덜어줍니다."
 HOL_grey_cda2: "농촌 노인 공동체 지원"
 HOL_grey_cda2_desc: "고령화 인구 문제를 다룰 때 농촌 지역이 소외되어서는 안 됩니다. 농촌 주택과 의료에 투자함으로써 모든 고령 시민이 어디에 살든 양질의 지원을 받을 수 있도록 보장합니다."
 HOL_grey_cda3: "종교 자원봉사 네트워크 강화"
 HOL_grey_cda3_desc: "신앙 기반 단체는 돌봄과 지원을 제공하는 데 매우 귀중한 존재입니다. 우리는 고령화 사회의 도전에 도덕적이고 따뜻하게 대응하기 위해 이들의 역할을 확대하고 있습니다."
 HOL_grey_cda4: "노인 돌봄에서의 윤리적 AI"
 HOL_grey_cda4_desc: "새로운 기술은 공동선에 기여해야 합니다. 돌봄 서비스에 윤리적 AI 솔루션을 도입함으로써 우리는 기독교 민주주의 가치를 지키는 동시에 노인 돌봄 분야의 인력 부족에 대응합니다."
 HOL_grey_cda5: "대가족 장려"
 HOL_grey_cda5_desc: "미래의 안정을 보장하기 위해 우리는 자녀가 셋 이상인 가정에 재정적 인센티브와 보육 보조금을 지원하며, 나라를 지탱할 새로운 세대를 키워나갑니다."
 HOL_grey_vvd1: "은퇴 연령 상향"
 HOL_grey_vvd1_desc: "생산적인 사회는 더 긴 노동 기간을 요구합니다. 은퇴 연령을 점진적으로 높임으로써 연금 부담을 줄이고 미래 세대를 위해 더욱 강력한 경제를 보장합니다."
 HOL_grey_vvd2: "노인 돌봄 민영화"
 HOL_grey_vvd2_desc: "민간 기업은 고령화 인구 문제를 더 효율적으로 해결할 수 있습니다. 노인 돌봄 부문을 민간 투자에 개방함으로써 질을 높이는 동시에 공공 비용을 절감합니다."
 HOL_grey_vvd3: "숙련 노동자 이민 장려"
 HOL_grey_vvd3_desc: "고령화 문제에는 혁신적인 해법이 필요합니다. 숙련된 이민자가 우리 노동력에 합류하도록 유인함으로써 의료와 기타 부문의 핵심적인 공백을 메웁니다."
 HOL_grey_vvd4: "의료의 디지털화"
 HOL_grey_vvd4_desc: "혁신은 지속가능성의 열쇠입니다. 의료 분야의 디지털 전환과 AI 도입을 통해 비용을 낮추고 노인을 위한 돌봄을 개선합니다."
 HOL_grey_vvd5: "연금 투자 개혁"
 HOL_grey_vvd5_desc: "공적 연금을 민간 투자 계좌로 전환함으로써 정부의 부채 부담을 줄이고 시민들이 자신의 재정적 미래를 직접 관리하도록 합니다."
 HOL_grey_pvv1: "국민 연금 보호"
 HOL_grey_pvv1_desc: "네덜란드의 연금은 계속 우선순위여야 합니다. 해외 원조와 불필요한 사업에서 자원을 돌려 열심히 일하는 시민의 연금을 지킵니다."
 HOL_grey_pvv2: "자동화 장려"
 HOL_grey_pvv2_desc: "노동력 부족에 대응하기 위해 우리는 전 산업에 걸쳐 자동화에 대규모로 투자하여 외국 노동력에 대한 의존을 줄이는 동시에 생산성을 높입니다."
 HOL_grey_pvv3: "민족주의적 인력 모집 캠페인"
 HOL_grey_pvv3_desc: "노동력을 구성할 때 네덜란드 국민을 우선시해야 할 때가 왔습니다. 모집 캠페인을 통해 노동력 부족 해소에 네덜란드 인재가 앞장서도록 보장합니다."
 HOL_grey_pvv4: "엄격한 이민 통제"
 HOL_grey_pvv4_desc: "네덜란드는 통제되지 않는 이민의 부담을 감당할 수 없습니다. 국경을 엄격히 통제함으로써 자원이 우리 시민과 그들의 복지에 배분되도록 보장합니다."
 HOL_grey_pvv5: "노인 애국심 고취"
 HOL_grey_pvv5_desc: "우리 노인들은 네덜란드 전통의 수호자입니다. 그들의 공헌을 기림으로써 국가 정체성에 대한 단합과 자부심을 키웁니다."
 HOL_grey_monarchy1: "왕실 연금 기금"
 HOL_grey_monarchy1_desc: "시민의 미래를 보장하기 위해 군주제는 왕실 연금 기금을 설립할 것입니다. 이 신탁은 모든 네덜란드 시민이 품위와 안정 속에서 나이 들 수 있도록 보장할 것입니다."
 HOL_grey_monarchy2: "국민 통합 프로그램"
 HOL_grey_monarchy2_desc: "왕실은 세대와 지역을 통합하는 프로그램을 이끌며 공동의 책임감과 국가에 대한 충성심을 키울 것입니다."
 HOL_grey_monarchy3: "국가 봉사 확대"
 HOL_grey_monarchy3_desc: "청년층에 대한 의무 국가 봉사는 우리의 노동력을 강화하고 노인 돌봄에 필수적인 지원을 제공하여 왕실의 인도 아래 더욱 강한 국가를 만들 것입니다."
 HOL_grey_monarchy4: "자동화에 투자"
 HOL_grey_monarchy4_desc: "왕실 자금을 자동화 촉진에 활용함으로써 인구가 고령화되더라도 네덜란드가 경쟁력과 지속가능성을 유지하도록 보장합니다."
 HOL_grey_monarchy5: "실버 경제 구상"
 HOL_grey_monarchy5_desc: "왕실은 고령화 인구의 필요를 충족하는 산업을 후원하여, 노인을 섬기는 동시에 일자리와 번영을 창출할 것입니다."
 HOL_grey_nvu1: "우생학 프로그램"
 HOL_grey_nvu1_desc: "강하고 순수한 네덜란드의 미래를 보장하기 위해 우리는 '이상적인' 네덜란드 시민의 출산을 장려하고 바람직하지 않은 영향을 억제하는 정책을 시행하고 있습니다."
 HOL_grey_nvu2: "비네덜란드인의 복지 배제"
 HOL_grey_nvu2_desc: "우리의 자원은 네덜란드 국민을 위해 쓰여야 합니다. 비네덜란드계 주민의 복지 이용을 박탈함으로써 우리 시민의 복지를 우선시합니다."
 HOL_grey_nvu3: "의무 병역 확대"
 HOL_grey_nvu3_desc: "신체 건강한 모든 네덜란드 남성은 군대 또는 필수 산업에 복무하게 되며, 이는 우리 국가가 강하고 자급자족하는 상태를 유지하도록 보장합니다."
 HOL_grey_nvu4: "전쟁을 위한 산업 확장"
 HOL_grey_nvu4_desc: "국가의 필요가 최우선입니다. 모든 자원을 산업 확장에 투입함으로써 장차의 분쟁에 대비하고 국가의 우위를 확보합니다."
 HOL_grey_nvu5: "노인 강제 노동"
 HOL_grey_nvu5_desc: "노인들도 국가 목표에 기여해야 합니다. 여전히 일할 수 있는 이들은 국가의 우선 과제를 지원하기 위해 경공업 노동에 동원될 것입니다."
 HOL_foreign_policy_category: "네덜란드 외교 정책"
 HOL_foreign_policy_category_desc: "\n£hol_foreign_affairs_category_picture \n\n\n\n세계 무대에서 네덜란드의 외교적, 전략적, 경제적 입지를 형성하십시오. 점점 더 다극화되는 세계에서 네덜란드의 가치를 반영하고 국익을 지키는 무역 협정, 개발 협력, 방위 약정을 추진하십시오."
 HOL_antilles_expand_civilian_industry: "안틸레스 민수 산업 확대"
 HOL_antilles_expand_civilian_industry_desc: "안틸레스는 경제적 번영을 지속하기 위해 산업 성장이 필요합니다. 민수 산업에 투자함으로써 일자리 창출을 촉진하고 기반시설을 개선하여 지역의 장기적 안정을 보장할 수 있습니다."
 HOL_antilles_expand_office_industry: "안틸레스 사무 부문 확대"
 HOL_antilles_expand_office_industry_desc: "안틸레스에 사무 공간과 업무 지구를 개발하면 상업 활동이 활발해지고 투자자를 끌어들이며 현지 기업의 행정 효율이 향상될 것입니다."
 HOL_antilles_expand_mil_industry: "안틸레스 군수 산업 확대"
 HOL_antilles_expand_mil_industry_desc: "안틸레스의 군수 산업이 강화되면 카리브해에서 전략적 이점을 얻고, 더 빠른 군수 생산과 네덜란드 해외 영토의 더 나은 안보를 보장할 것입니다."
 HOL_antilles_expand_agriculture: "앤틸리스 농업에 투자"
 HOL_antilles_expand_agriculture_desc: "농업은 식량 안보와 경제적 독립을 위한 핵심 부문입니다. 안틸레스의 영농과 지속 가능한 토지 이용에 투자하면 현지와 국가 식량 공급망 모두에 이익이 될 것입니다."
 HOL_dutch_latin_cooperation: "네덜란드-라틴 아메리카 협력"
 HOL_dutch_latin_cooperation_desc: "네덜란드는 라틴 아메리카와 경제 및 에너지 분야에서 협력해 온 오랜 역사가 있습니다. 핵심 기반시설 사업, 해상 에너지 개발, 해군 협력에 투자함으로써 우리는 이 지역에서의 영향력을 강화하는 동시에 상호 경제 성장을 보장할 수 있습니다."
 HOL_dutch_venezuela_offshore_gas: "셸-베네수엘라 해상 가스 채굴 구상"
 HOL_dutch_venezuela_offshore_gas_desc: "셸과 베네수엘라는 드래곤 가스전에서 해상 가스를 채굴하고 정제하기 위한 협상을 진행해 왔습니다. 이 합의가 마무리되면 양국에 장기적인 에너지 안보를 제공할 수 있습니다."
 HOL_dutch_argentina_lng_trade: "셸-YPF LNG 수출 확대 협정"
 HOL_dutch_argentina_lng_trade_desc: "아르헨티나의 YPF와 셸은 세계 공급을 늘리는 것을 목표로 대규모 LNG 수출 사업을 추진하고 있습니다. 이 사업에 대한 네덜란드의 투자는 무역 유대를 강화하고 안정적인 천연가스 수입을 확보할 수 있습니다."
 HOL_dutch_colombia_port_investment: "카르타헤나 항만 확장 - 로열 하스코닝DHV 파트너십"
 HOL_dutch_colombia_port_investment_desc: "콜롬비아의 카르타헤나 항은 라틴 아메리카에서 가장 중요한 무역 거점 중 하나입니다. 네덜란드 엔지니어링 기업 로열 하스코닝DHV는 이곳의 기반시설을 확장할 전문성을 갖추고 있어 효율을 개선하고 네덜란드-콜롬비아 무역 관계를 증진할 수 있습니다."
 HOL_dutch_mexico_naval_cooperation: "다멘 조선소-멕시코 해군 현대화 계약"
 HOL_dutch_mexico_naval_cooperation_desc: "멕시코 해군은 함대 현대화를 모색해 왔으며, 네덜란드 조선업체 다멘 조선소는 이미 최신 POLA급 호위함을 공급한 바 있습니다. 추가 협력은 멕시코의 해군력을 강화하는 동시에 네덜란드의 방위 수출을 뒷받침할 것입니다."
 HOL_dutch_paraguay_green_hydrogen: "파라과이 오네스트 아다 수소 투자"
 HOL_dutch_paraguay_green_hydrogen_desc: "네덜란드 기업 오네스트 아다 수소 투자 EAS는 파라과이의 녹색 수소 부문에 1억 달러 투자를 제안했습니다. 이 사업은 파라과이를 라틴 아메리카 재생 에너지 산업의 선두 주자로 만들 수 있습니다."
 HOL_dutch_peru_wind_energy: "ENGIE 에네르히아 페루 - 푼타 로미타스 풍력 단지 확장"
 HOL_dutch_peru_wind_energy_desc: "네덜란드의 지원을 받는 ENGIE 에네르히아 페루는 라틴 아메리카 최대 규모의 풍력 단지 중 하나를 건설하고 있습니다. 네덜란드의 추가 투자는 사업을 가속하고 페루의 재생 에너지 부문을 강화할 것입니다."
 HOL_usa_operation_market_vision: "마켓 비전 작전 제안"
 HOL_usa_operation_market_vision_desc: "네덜란드는 군사 연구개발을 통합하고 공급망 회복력을 개선하며 전략 역량을 공동 개발하는 것을 목표로 하는 양자 방위산업 구상인 '마켓 비전 작전'을 제안했습니다. 이 협력은 대서양 횡단 방위 유대를 강화하고 상호 투자를 촉진하며, 미래의 도전에 대비해 양국의 군수 산업을 정렬시킬 수 있습니다."
 HOL_sur_agreement: "수리남에 무역·개발 협정 제안"
 HOL_sur_agreement_desc: "남아메리카에 대한 새로운 전략의 일환으로, 우리는 수리남에 포괄적인 무역·개발 협정을 정식으로 제안할 것입니다. 이 제안에는 상호 기반시설 투자, 무역 접근권, 개발 원조가 포함되어 더 깊은 경제 통합과 지역 협력의 토대를 마련합니다."
 HOL_sur_infrastructure_agreement: "수리남에 기반시설 투자 제안"
 HOL_sur_infrastructure_agreement_desc: "수리남과의 유대를 강화하려는 새로운 전략의 일환으로, 우리는 포괄적인 기반시설 투자 패키지를 제안할 것입니다. 여기에는 네덜란드 주도의 교통망, 항만 시설, 지역 물류 개선이 포함됩니다. 수락될 경우 이 협정은 경제 협력을 심화하고 남아메리카 북부에서 우리의 영향력을 높일 것입니다."
 HOL_sur_maritime_agreement: "해양 협력 협정 제안"
 HOL_sur_maritime_agreement_desc: "정부는 수리남에 정식 해양 협력 협정을 제안할 준비를 하고 있습니다. 이 협정에는 공동 항만 개발, 해군 기반시설 지원, 전략 훈련 구상이 포함됩니다. 수락될 경우 양국 관계가 강화되고 남아메리카 북부 해안에서 우리의 영향력이 확대될 것입니다."
 HOL_sur_training_agreement: "공동 군사 훈련 제안"
 HOL_sur_training_agreement_desc: "국방부는 수리남에 공동 군사 훈련 작전 수립을 요청하는 공식 서한을 보낼 준비를 하고 있습니다. 이 제안에는 병참 협력, 부대 조율 훈련, 지역 방위 전략에 관한 전문성 공유가 포함됩니다. 수락될 경우 상호 준비태세와 외교적 유대가 강화될 것입니다."
 HOL_sur_resources_agreement: "자원 투자 협정 제안"
 HOL_sur_resources_agreement_desc: "경제부는 수리남의 자원 채굴 기반시설 개발을 목표로 하는 공식 투자 제안을 보낼 준비를 하고 있습니다. 이 협정에는 자본 투자, 기술 지원, 장기 무역 약정이 포함됩니다. 수락될 경우 네덜란드의 전략 물자 접근권이 강화되고 양국 경제 유대가 깊어질 수 있습니다."
 HOL_fourth_reich_category: "제4제국 중핵화"
 HOL_marechaussee_support_company: "왕립 헌병대 지원 대대"
 HOL_marechaussee_support_company_desc: "이 네덜란드 지원 대대는 전장 보급망 관리와 군사 법 집행을 결합합니다.\n\n§G설계 힌트: 왕립 헌병대는 공수 투입이 가능한 지원 대대에서 제압, 정찰, 사상자 회수, 소폭의 연료 절감을 제공합니다. 경비 또는 원정 편제에 사용하되, 전투 폭과 장비가 추가되는 반면 돌파력이나 대장갑 공격력에는 거의 기여하지 못합니다.§!"
 HOL_marechaussee_support_tech: "왕립 헌병대 지원 대대"
 HOL_marechaussee_support_tech_desc: "왕립 헌병대 지원 대대는 병참 및 군사경찰 역량을 결합하여 보급 효율을 개선하고 제압력을 높입니다."
 FAD_access_tech: "미래 방공 체계 프로그램 기술"
 HOL_van_halteren_armor_manufacturer: "판 할터런 테크놀로지스"
 HOL_van_halteren_armor_manufacturer_desc: "장갑차 부품과 방어 체계 개발에 대한 전문성으로 잘 알려진 판 할터런 테크놀로지스는 네덜란드 군대의 역량을 현대화하고 강화하는 최첨단 솔루션을 제공합니다."
 HOL_van_halteren_armor_manufacturer_trait: "친환경 전투 장비"
 HOL_Stork_PWV_armor_manufacturer: "스토르크 PWV"
 HOL_Stork_PWV_armor_manufacturer_desc: "스토르크 PWV(Panserwielvoertuigen)는 고품질 장갑차와 방어 체계를 생산해 온 오랜 역사를 지녔으며, 전장에서 네덜란드 군 인력의 방호와 기동성에 기여하고 있습니다."
 HOL_Stork_PWV_armor_manufacturer_trait: "경전차 개발사"
 HOL_KNDS_Group_armor_manufacturer: "KNDS 그룹"
 HOL_KNDS_Group_armor_manufacturer_desc: "넥스터와 크라우스마파이 베그만의 합병으로 탄생한 유럽의 방위산업 거대 기업 KNDS 그룹은 전차를 비롯한 군용 차량 등 최첨단 장갑 솔루션을 네덜란드에 공급합니다."
 HOL_Rheinmetall_Netherlands_armor_manufacturer: "라인메탈 네덜란드"
 HOL_Rheinmetall_Netherlands_armor_manufacturer_desc: "라인메탈 AG의 일부인 라인메탈 네덜란드는 장갑차 생산에 주력하며, 네덜란드 군에 첨단 기술과 혁신적인 방어 체계를 제공합니다."
 HOL_Rheinmetall_Netherlands_armor_manufacturer_trait: "만능 장갑의 전설"
 HOL_Damen_naval_equipment_organisation: "다멘 조선소 그룹"
 HOL_Damen_naval_equipment_organisation_desc: "다멘 조선소 그룹은 호위함, 초계함, 지원함 건조를 전문으로 하는 [HOL.GetAdjectiveCap] 최고의 해군 함정 제조업체입니다. 다멘은 [HOL.GetAdjectiveCap] 해군의 역량을 유지하고 확장하는 데 핵심적인 역할을 합니다."
 HOL_Damen_naval_equipment_organisation_trait: "국제 조선소 그룹"
 DAMEN_mio_sigma_modular_hull: "SIGMA 모듈식 선체"
 DAMEN_mio_axe_bow_design: "액스 바우 설계"
 DAMEN_mio_stealth_superstructure: "스텔스 상부구조"
 DAMEN_mio_ballistic_protection_upgrade: "방탄 보호 개량"
 DAMEN_mio_mine_sweeping_ramp: "소해 램프"
 DAMEN_mio_torpedo_defense_suite: "어뢰 방어 체계"
 DAMEN_mio_MPSS_drone_integration: "MPSS 드론 통합"
 DAMEN_mio_modular_shipyard_concept: "모듈식 조선소 개념"
 DAMEN_mio_shore_chargers: "전기 페리용 육상 충전기"
 DAMEN_mio_galati_hybrid: "갈라치 하이브리드 통합"
 DAMEN_mio_global_support_network: "글로벌 지원 네트워크"
 DAMEN_mio_standard_hull_stockpiling: "표준 선체 비축"
 DAMEN_mio_retrofit_logistics: "개조 병참 거점"
 DAMEN_mio_seabuster_USV_trials: "SeaBuster USV 시험"
 DAMEN_mio_USV_ramp: "USV/UUV 램프"
 DAMEN_mio_island_e_ferry: "섬 전기 페리 전동화"
 DAMEN_mio_cyber_hardened_systems: "사이버 강화 체계"
 DAMEN_mio_hybrid_tug_program: "하이브리드 예인선 프로그램"
 DAMEN_mio_quintum_communications: "양자 내성 통신"
 DAMEN_mio_container_ferry_modularity: "컨테이너 페리 모듈화"
 DAMEN_mio_AI_assisted_threat_response: "AI 지원 위협 대응"
 HOL_Naval_Group_naval_equipment_organisation: "해군 건조국(Direction des Constructions Navales)"
 HOL_Naval_Group_naval_equipment_organisation_desc: "해군 건조국(DCNS)은 [HOL.GetAdjectiveCap] 해군 산업의 주요 파트너로서 네덜란드 왕립 해군에 최상급 전함과 잠수함 기술을 제공합니다. 수십 년에 걸친 해군 공학 전문성을 바탕으로 네이벌 그룹은 [HOL.GetAdjectiveCap] 함대를 강화합니다."
 HOL_Naval_Group_naval_equipment_organisation_trait: "전함 설계사"
 HOL_fokker_technologies_planes_manufacturer: "포커 테크놀로지스"
 HOL_fokker_technologies_planes_manufacturer_desc: "포커 테크놀로지스는 군용기와 민간 항공기를 생산해 온 유산을 지닌 [HOL.GetAdjectiveCap]의 저명한 항공기 제조업체입니다. 항공우주 분야의 혁신으로 잘 알려진 포커는 [HOL.GetAdjectiveCap] 공군에 최첨단 기술을 계속 공급합니다."
 HOL_fokker_technologies_planes_manufacturer_trait: "경항공기 제조사"
 HOL_werkspoor_equipment_manufacturer: "베르크스포어 위트레흐트"
 HOL_werkspoor_equipment_manufacturer_desc: "한때 [HOL.GetAdjectiveCap] 산업 혁신의 초석이었던 베르크스포어 위트레흐트는 국가 공학 우수성의 상징으로 서 있습니다. 베르크스포어는 고품질 열차, 기계류, 기타 중장비 제조를 전문으로 하며, 네덜란드가 최첨단 산업 기술로 쌓은 명성을 유지하도록 보장합니다."
 HOL_werkspoor_equipment_manufacturer_trait: "철도 발전"
 WS_mio_composite_armor_plates: "복합 장갑판"
 WS_mio_mobile_aa_railcar: "이동식 대공 철도차량"
 WS_mio_infantry_support_wagon: "보병 지원 화차"
 WS_mio_field_rail_repair_depot: "야전 철도 수리창"
 WS_mio_remote_track_surveillance: "원격 선로 감시"
 WS_mio_automated_rail_depot: "자동화 철도 차량기지"
 WS_mio_prefab_rails_program: "조립식 선로 프로그램"
 WS_mio_modular_wagon_Assembly: "모듈식 화차 조립"
 WS_mio_advanced_bogie_refitting_line: "첨단 대차 개수 라인"
 WS_mio_heavy_duty_welded_rails: "중하중 용접 선로"
 WS_mio_Industrial_Assignment_optimalisation: "산업 할당 최적화"
 WS_mio_design_team_efficiency: "설계팀 효율"
