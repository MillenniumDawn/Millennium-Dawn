 AA_upgrade_8: "Buscadores adaptativos asistidos por IA"
 AA_upgrade_8_desc: "Los buscadores adaptativos asistidos por IA utilizan una fusión avanzada de sensores y discriminación de objetivos en tiempo real para mantener la fijación contra amenazas aéreas más sigilosas, frías y rápidas en espacios aéreos fuertemente disputados."
 nsb_AA_upgrade_8: "Buscadores adaptativos asistidos por IA"
 nsb_AA_upgrade_8_desc: "Los buscadores adaptativos asistidos por IA utilizan una fusión avanzada de sensores y discriminación de objetivos en tiempo real para mantener la fijación contra amenazas aéreas más sigilosas, frías y rápidas en espacios aéreos fuertemente disputados."
 AT_upgrade_8: "Municiones antiblindaje adaptativas"
 AT_upgrade_8_desc: "Las municiones antiblindaje adaptativas utilizan reconocimiento de objetivos asistido por IA, fusión de sensores, lógica de salvas coordinadas y ojivas programables para derrotar a los vehículos fuertemente protegidos en campos de batalla saturados de sensores."
 augmented_vision_3: "Soporte de visión por IA"
 augmented_vision_3_desc: "La visión aumentada de tercera generación integra superposiciones térmicas e infrarrojas en tiempo real directamente en la pantalla de visualización frontal (HUD) del soldado, mejorando drásticamente la detección de amenazas en condiciones de baja visibilidad."
 augmented_vision_4: "Análisis avanzado de visión lejana"
 augmented_vision_4_desc: "El reconocimiento de objetos asistido por IA permite al visor clasificar automáticamente objetivos, aliados y peligros. Compartir datos a nivel de escuadra significa que cada soldado se beneficia de lo que puede ver cualquier miembro del equipo."
 augmented_vision_5: "Profundidad multiespectral"
 augmented_vision_5_desc: "Las superposiciones de realidad aumentada completamente en red proyectan datos del terreno, transmisiones de drones y modelos predictivos de amenazas en el campo de visión de cada soldado, convirtiendo la conciencia individual en una imagen operativa compartida."
 augmented_vision_6: "Visión neurolocalizada"
 augmented_vision_6_desc: "Los sistemas de visión con enlace neural evitan por completo la óptica tradicional, proyectando los datos de los sensores directamente a la corteza visual del operador. El resultado es una conciencia situacional casi instantánea en todo el espectro electromagnético."
 afs_drone_2: "Dron autónomo de apoyo de fuego II"
 afs_drone_2_desc: "Los drones de apoyo de fuego mejorados operan en equipos en red, compartiendo datos de sensores con unidades de infantería, blindados y artillería para identificar amenazas, suprimir posiciones enemigas y apoyar avances a través de terrenos disputados."
 afs_drone_3: "Dron autónomo de apoyo de fuego III"
 afs_drone_3_desc: "Los drones de apoyo de fuego avanzados utilizan comunicaciones resilientes, reconocimiento de objetivos a bordo y una coordinación de enjambres limitada para mantener la vigilancia, retransmitir datos del campo de batalla y lanzar fuegos de apoyo rápidos bajo el mando humano."
 afs_drone_4: "Dron autónomo de apoyo de fuego IV"
 afs_drone_4_desc: "Los sistemas integrados de apoyo de drones combinan plataformas robóticas aéreas y terrestres en equipos de fuego coordinados, lo que permite a las unidades de maniobra proteger los flancos, exponer emboscadas y atacar objetivos endurecidos con una menor exposición de las tropas."
 afs_drone_5: "Dron autónomo de apoyo de fuego V"
 afs_drone_5_desc: "Las futuras redes autónomas de apoyo de fuego utilizan enjambres dirigidos por IA, asignación cooperativa de objetivos y rutas adaptativas en el campo de batalla para proporcionar reconocimiento persistente, supresión y fuegos de precisión en las formaciones terrestres regulares."
 special_forces_tech_7: "Fuerzas especiales del futuro II"
 special_forces_tech_7_desc: "Las fuerzas especiales del futuro mejoradas utilizan el trabajo en equipo entre humanos y máquinas, sistemas de reconocimiento autónomos y planificación de misiones asistida por IA para aumentar la conciencia situacional, reducir la exposición y coordinar incursiones complejas en múltiples dominios."
 special_forces_tech_8: "Fuerzas especiales hiperavanzadas"
 special_forces_tech_8_desc: "Las fuerzas especiales hiperavanzadas combinan camuflaje adaptativo, plataformas de apoyo robótico, redes resilientes en el campo de batalla y equipamiento optimizado para el operador con el fin de realizar operaciones profundas contra oponentes tecnológicamente avanzados."
 special_forces_tech_9: "Fuerzas especiales hiperavanzadas II"
 special_forces_tech_9_desc: "Los avances adicionales en operaciones especiales enfatizan los equipos distribuidos, los enjambres de drones, el soporte de guerra electrónica y la fusión de sensores en tiempo real, lo que permite a los operadores atacar, evadir y sobrevivir dentro de espacios de batalla fuertemente vigilados."
 special_forces_tech_10: "Fuerzas especiales ultraavanzadas"
 special_forces_tech_10_desc: "Las fuerzas especiales ultraavanzadas utilizan sistemas de apoyo coordinados por IA, logística autónoma, herramientas de mando con realidad aumentada y una monitorización médica avanzada para sostener operaciones de élite mucho más allá de las redes de apoyo tradicionales."
 special_forces_tech_11: "Fuerzas especiales ultraavanzadas II"
 special_forces_tech_11_desc: "Las fuerzas especiales más avanzadas operan como equipos en red compuestos por humanos y máquinas, combinando un entrenamiento de élite, sistemas autónomos, efectos cibernéticos e inteligencia predictiva para llevar a cabo operaciones precisas en entornos hostiles y saturados de sensores."
 body_armor_5: "Traje táctico de asalto reforzado"
 body_armor_5_desc: "Los avances en los compuestos de nanomateriales producen placas de blindaje que son significativamente más ligeras pero más duras que las soluciones cerámicas anteriores. Los sistemas modulares de cobertura completa ahora protegen las extremidades sin reducir significativamente la movilidad."
 body_armor_6: "Traje de asalto de vanguardia"
 body_armor_6_desc: "El blindaje inteligente teje sensores de impacto y capas reactivas en el propio tejido del chaleco, lo que permite que las secciones se endurezcan al contacto y distribuyan la energía cinética de manera más eficaz. La monitorización biométrica integrada alerta a los médicos sobre las bajas en tiempo real."
 body_armor_7: "Integración de traje con IA"
 body_armor_7_desc: "El revestimiento reforzado con grafeno ofrece relaciones de dureza a peso sin precedentes, deteniendo proyectiles perforantes de alta velocidad que habrían penetrado en las generaciones anteriores. Los sistemas de refrigeración activa integrados en el traje mantienen la eficacia de los operadores en climas extremos."
 body_armor_8: "Traje hiperavanzado"
 body_armor_8_desc: "El blindaje reactivo motorizado utiliza microactuadores integrados para desviar activamente los proyectiles entrantes en el momento del impacto. Combinado con capas de tratamiento de traumatismos con autosellado, la supervivencia contra las amenazas del campo de batalla alcanza niveles previamente reservados para vehículos ligeros."
 body_armor_9: "Traje ultraavanzado"
 body_armor_9_desc: "El blindaje adaptativo de cuerpo completo integra endurecimiento electromagnético, compuestos balísticos y filtración química-biológica en un único sistema sellado. El soldado queda efectivamente encajado dentro de un vehículo de combate personal."
 exoskeleton_3: "Traje de operaciones mejorado"
 exoskeleton_3_desc: "Los exoesqueletos de tercera generación son lo suficientemente ligeros para un uso prolongado en el terreno por parte de la infantería estándar. Los actuadores mejorados y la autonomía de la batería permiten a los soldados transportar armas pesadas y blindaje adicional sin penalizaciones por fatiga."
 exoskeleton_4: "Exoesqueleto hiperavanzado"
 exoskeleton_4_desc: "La predicción de movimiento impulsada por IA hace que el traje se sienta como una extensión natural del cuerpo del operador, lo que permite esprintar, escalar y combatir cuerpo a cuerpo a velocidades que ningún soldado sin mejoras puede igualar. Las celdas de energía integradas sostienen operaciones de varios días sin necesidad de recarga."
 exoskeleton_5: "Exoesqueleto ultraavanzado"
 exoskeleton_5_desc: "La evolución final de los exoesqueletos motorizados desdibuja la línea entre la infantería y los vehículos blindados. El control por interfaz neural, los compuestos estructurales autorreparables y los soportes de armas a bordo producen una plataforma de un solo operador capaz de enfrentarse a amenazas que antes estaban reservadas para unidades blindadas dedicadas."
 camouflage_6: "Camuflaje térmico activo"
 camouflage_6_desc: "El camuflaje térmico activo utiliza materiales de superficie controlables y capas de gestión térmica para alterar las emisiones infrarrojas, lo que permite a los vehículos blindados y a la infantería equipada mezclarse mejor con su entorno térmico."
 camouflage_7: "Camuflaje de engaño de sensores"
 camouflage_7_desc: "El camuflaje de engaño de sensores combina materiales de espectro múltiple, disrupción de formas y control de firmas electrónicas para confundir a los drones, ópticas de puntería, sensores asistidos por radar y sistemas de reconocimiento automatizados."
 camouflage_8: "Camuflaje adaptativo integrado"
 camouflage_8_desc: "El camuflaje adaptativo integrado vincula materiales inteligentes, regulación térmica, control de patrones visuales y datos de sensores del campo de batalla para reducir continuamente la firma detectable de la infantería, los vehículos y el equipo a través de múltiples tipos de sensores."
 mbt_tech_5: "Casco blindado hiperavanzado"
 mbt_tech_5_desc: "Cascos de vehículos blindados hiperavanzados."
 mbt_tech_6: "Casco blindado ultraavanzado"
 mbt_tech_6_desc: "Cascos de vehículos blindados ultraavanzados."
 tank_components_tech_6: "Sistemas informáticos para vehículos hiperavanzados"
 tank_components_tech_6_desc: "La visualización en 3D, el campo de batalla virtual, los sistemas de comunicación y tecnología más recientes y los algoritmos de detección mejorados nos permitirán perfeccionar nuestra tecnología de destrucción directa (hard-kill)."
 tank_components_tech_7: "Sistemas informáticos para vehículos ultraavanzados"
 tank_components_tech_7_desc: "La visualización en 3D, el campo de batalla virtual, los sistemas de comunicación y tecnología más recientes y los algoritmos de detección mejorados nos permitirán perfeccionar nuestra tecnología de destrucción directa (hard-kill)."
 era_tech_5: "ERA de 5.ª generación"
 era_tech_5_desc: "Forma muy avanzada de blindaje reactivo explosivo (ERA), capaz de operar en diversas condiciones ambientales y de reducir la eficacia de la mayor parte del fuego entrante."
 era_tech_6: "ERA de 6.ª generación"
 era_tech_6_desc: "La forma más avanzada de blindaje reactivo explosivo (ERA), capaz de operar en diversas condiciones ambientales y de reducir la eficacia de la mayor parte del fuego entrante."
 armor_tech_5: "Blindaje hiperavanzado"
 armor_tech_5_desc: "Mejoras de blindaje altamente sofisticadas."
 armor_tech_6: "Blindaje ultraavanzado"
 armor_tech_6_desc: "Mejoras de blindaje altamente sofisticadas."
 nera_armor_tech_4: "NERA de 4.ª generación"
 nera_armor_tech_4_desc: "Blindaje reactivo no explosivo (NERA) avanzado que utiliza materiales de última generación y configuraciones innovadoras, ofreciendo una defensa superior contra una amplia gama de amenazas."
 nera_armor_tech_5: "NERA de 5.ª generación"
 nera_armor_tech_5_desc: "Blindaje reactivo no explosivo (NERA) avanzado que utiliza materiales de última generación y configuraciones innovadoras, ofreciendo una defensa superior contra una amplia gama de amenazas."
 diesel_engine_tech_8: "Motor diésel hiperavanzado"
 diesel_engine_tech_8_desc: "Con los avances en la eficiencia del combustible, el control computarizado del motor y los materiales avanzados, los motores del futuro pueden ser tanto potentes como ligeros."
 diesel_engine_tech_9: "Motor diésel ultraavanzado"
 diesel_engine_tech_9_desc: "Con los avances en la eficiencia del combustible, el control computarizado del motor y los materiales avanzados, los motores del futuro pueden ser tanto potentes como ligeros."
 tech_tank_nuclear_engine_3: "Motor nuclear de tanque IV"
 tech_tank_nuclear_engine_3_desc: "Los diseños de reactores modulares compactos reducen drásticamente el peso del blindaje de protección biológica al tiempo que mejoran la eficiencia térmica, lo que hace que los vehículos de propulsión nuclear sean viables para una gama más amplia de chasis. Los sistemas de seguridad automatizados y los módulos de combustible intercambiables en el terreno simplifican el mantenimiento en las zonas de operaciones de vanguardia."
 tech_tank_nuclear_engine_4: "Motor nuclear de tanque V"
 tech_tank_nuclear_engine_4_desc: "Los microrreactores de cuarta generación logran intervalos de mantenimiento cercanos a cero y generan suficiente energía excedente para impulsar armas de energía dirigida y sistemas de defensa activa de manera simultánea. Las formaciones blindadas equipadas con estos motores operan indefinidamente sin líneas de suministro, reconfigurando fundamentalmente la planificación operativa."
 turbine_engine_tech_7: "Motor exoesquelético avanzado"
 turbine_engine_tech_7_desc: "Con materiales avanzados, se puede reducir la fricción en la turbina de gas, lo que permite una mejor potencia de salida y eficiencia de combustible."
 turbine_engine_tech_8: "Motor exoesquelético de vanguardia"
 turbine_engine_tech_8_desc: "Con materiales avanzados, se puede reducir la fricción en la turbina de gas, lo que permite una mejor potencia de salida y eficiencia de combustible."
 electric_engine_tech_5: "Motor eléctrico avanzado"
 electric_engine_tech_5_desc: "Versión mejorada del motor eléctrico con una mayor fiabilidad."
 electric_engine_tech_6: "Motor eléctrico de vanguardia"
 electric_engine_tech_6_desc: "Versión mejorada del motor eléctrico con una mayor fiabilidad."
 defensive_systems_6: "Sistemas defensivos avanzados"
 defensive_systems_6_desc: "La próxima generación de tecnologías defensivas, enfocada en mejorar la supervivencia de nuestros vehículos a través de medidas de defensa avanzadas."
 defensive_systems_7: "Sistemas defensivos de vanguardia"
 defensive_systems_7_desc: "La próxima generación de tecnologías defensivas, enfocada en mejorar la supervivencia de nuestros vehículos a través de medidas de defensa avanzadas."
 tank_ammo_1: "Munición de principios de la Guerra Fría"
 tank_ammo_1_desc: "Munición desarrollada durante los inicios del período de la Guerra Fría, diseñada para entablar combate de forma eficaz contra diversos objetivos en el campo de batalla. Estos proyectiles proporcionan un equilibrio entre las capacidades de penetración y fragmentación, siendo adecuados para los escenarios de combate de la época."
 tank_ammo_2: "Munición de la Guerra Fría"
 tank_ammo_2_desc: "Munición diseñada durante la Guerra Fría para contrarrestar una amplia gama de amenazas. Estos proyectiles presentan capacidades mejoradas de penetración y fragmentación, lo que les permite batir eficazmente tanto a objetivos de infantería como blindados en los escenarios de combate de la era de la Guerra Fría."
 tank_ammo_3: "Munición moderna"
 tank_ammo_3_desc: "Munición de última generación desarrollada para la guerra moderna. Estos proyectiles incorporan tecnologías avanzadas para lograr una mayor penetración, fragmentación y efecto de área, garantizando la máxima efectividad contra una variedad de objetivos en el campo de batalla moderno."
 tank_ammo_4: "Munición mejorada"
 tank_ammo_4_desc: "Munición innovadora diseñada para el futuro cercano. Estos proyectiles utilizan tecnologías de punta para proporcionar capacidades superiores de penetración, fragmentación y efecto de área, garantizando un rendimiento óptimo contra las amenazas en evolución."
 tank_ammo_5: "Munición avanzada"
 tank_ammo_5_desc: "Munición revolucionaria diseñada para el futuro lejano. Estos proyectiles incorporan tecnologías innovadoras para lograr una penetración, fragmentación y efecto de área sin precedentes, garantizando un impacto devastador incluso contra los objetivos más avanzados en el campo de batalla del futuro."
 tank_ammo_6: "Munición muy avanzada"
 tank_ammo_6_desc: "Munición revolucionaria diseñada para el futuro lejano. Estos proyectiles incorporan tecnologías innovadoras para lograr una penetración, fragmentación y efecto de área sin precedentes, garantizando un impacto devastador incluso contra los objetivos más avanzados en el campo de batalla del futuro."
 tank_ammo_7: "Munición de vanguardia"
 tank_ammo_7_desc: "Munición revolucionaria diseñada para el futuro lejano. Estos proyectiles incorporan tecnologías innovadoras para lograr una penetración, fragmentación y efecto de área sin precedentes, garantizando un impacto devastador incluso contra los objetivos más avanzados en el campo de batalla del futuro."
 tank_ammo_8: "Munición hiperavanzada"
 tank_ammo_8_desc: "Munición revolucionaria diseñada para el futuro lejano. Estos proyectiles incorporan tecnologías innovadoras para lograr una penetración, fragmentación y efecto de área sin precedentes, garantizando un impacto devastador incluso contra los objetivos más avanzados en el campo de batalla del futuro."
 tank_ammo_9: "Munición ultraavanzada"
 tank_ammo_9_desc: "Munición revolucionaria diseñada para el futuro lejano. Estos proyectiles incorporan tecnologías innovadoras para lograr una penetración, fragmentación y efecto de área sin precedentes, garantizando un impacto devastador incluso contra los objetivos más avanzados en el campo de batalla del futuro."
 anti_infantry_tank_ammo_1: "Munición antiinfantería de principios de la Guerra Fría"
 anti_infantry_tank_ammo_1_desc: "Munición especializada diseñada para entablar combate y neutralizar eficazmente objetivos de infantería durante los inicios del período de la Guerra Fría. Estos proyectiles están optimizados para la fragmentación y el efecto de área, maximizando su impacto contra el personal enemigo."
 anti_vehicle_tank_ammo_1: "Munición antivehículo de principios de la Guerra Fría"
 anti_vehicle_tank_ammo_1_desc: "Munición desarrollada durante los inicios de la Guerra Fría para contrarrestar los vehículos enemigos. Estos proyectiles cuentan con capacidades de penetración mejoradas, lo que les permite entablar combate de forma eficaz y dañar objetivos blindados, como tanques y transportes blindados de personal."
 anti_infantry_tank_ammo_2: "Munición antiinfantería de la Guerra Fría"
 anti_infantry_tank_ammo_2_desc: "Munición avanzada desarrollada durante la Guerra Fría para entablar combate y neutralizar eficazmente objetivos de infantería. Estos proyectiles presentan una fragmentación y efecto de área mejorados, garantizando el máximo impacto contra el personal enemigo."
 anti_vehicle_tank_ammo_2: "Munición antivehículo de la Guerra Fría"
 anti_vehicle_tank_ammo_2_desc: "Munición especializada diseñada durante la Guerra Fría para contrarrestar los vehículos enemigos. Estos proyectiles cuentan con capacidades de penetración mejoradas, lo que les permite entablar combate de forma eficaz y dañar objetivos blindados, como tanques y transportes blindados de personal."
 anti_infantry_tank_ammo_3: "Munición antiinfantería moderna"
 anti_infantry_tank_ammo_3_desc: "Munición de última generación diseñada para entablar combate y neutralizar eficazmente objetivos de infantería en la guerra moderna. Estos proyectiles presentan capacidades avanzadas de fragmentación y efecto de área, garantizando el máximo impacto contra el personal enemigo."
 anti_vehicle_tank_ammo_3: "Munición antivehículo moderna"
 anti_vehicle_tank_ammo_3_desc: "Munición de punta desarrollada para contrarrestar los vehículos enemigos en los escenarios de combate modernos. Estos proyectiles cuentan con capacidades de penetración mejoradas, lo que les permite entablar combate de forma eficaz y dañar objetivos blindados, como tanques y transportes blindados de personal."
 anti_infantry_tank_ammo_4: "Munición antiinfantería avanzada"
 anti_infantry_tank_ammo_4_desc: "Munición innovadora diseñada para entablar combate y neutralizar eficazmente objetivos de infantería en el futuro cercano. Estos proyectiles incorporan tecnologías avanzadas para lograr una mayor fragmentación y efecto de área, garantizando el máximo impacto contra el personal enemigo."
 anti_vehicle_tank_ammo_4: "Munición antivehículo avanzada"
 anti_vehicle_tank_ammo_4_desc: "Munición avanzada desarrollada para contrarrestar los vehículos enemigos en el futuro cercano. Estos proyectiles presentan capacidades de penetración de última generación, lo que les permite entablar combate de forma eficaz y dañar objetivos blindados, como tanques y transportes blindados de personal."
 anti_infantry_tank_ammo_5: "Munición antiinfantería de vanguardia"
 anti_infantry_tank_ammo_5_desc: "Munición revolucionaria diseñada para entablar combate y neutralizar eficazmente objetivos de infantería en el futuro lejano. Estos proyectiles utilizan tecnologías de punta para lograr una fragmentación y un efecto de área sin precedentes, garantizando un impacto devastador contra el personal enemigo."
 anti_vehicle_tank_ammo_5: "Munición antivehículo de vanguardia"
 anti_vehicle_tank_ammo_5_desc: "Munición de próxima generación desarrollada para contrarrestar los vehículos enemigos en el futuro lejano. Estos proyectiles incorporan capacidades innovadoras de penetración, lo que les permite entablar combate de forma eficaz y dañar incluso a los objetivos blindados más avanzados, tales como los futuros tanques y transportes blindados de personal."
 anti_infantry_tank_ammo_6: "Munición antiinfantería hiperavanzada"
 anti_infantry_tank_ammo_6_desc: "Munición revolucionaria diseñada para entablar combate y neutralizar eficazmente objetivos de infantería en el futuro lejano. Estos proyectiles utilizan tecnologías de punta para lograr una fragmentación y un efecto de área sin precedentes, garantizando un impacto devastador contra el personal enemigo."
 anti_vehicle_tank_ammo_6: "Munición antivehículo hiperavanzada"
 anti_vehicle_tank_ammo_6_desc: "Munición de próxima generación desarrollada para contrarrestar los vehículos enemigos en el futuro lejano. Estos proyectiles incorporan capacidades innovadoras de penetración, lo que les permite entablar combate de forma eficaz y dañar incluso a los objetivos blindados más avanzados, tales como los futuros tanques y transportes blindados de personal."
