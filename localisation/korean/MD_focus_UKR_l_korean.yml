 ukr_light_transport_tender: "새 §Y경수송 차량§!\n입찰 실시"
 ukr_light_transport_tender_desc: "\n\n\n\n\n\n\n£UKR_desctext_develop_domestic_dozor_a_for_tooltip\n\n\n\n\n\n\n\n\n§W우크라이나군은 노후한 소련 시대 다목적 차량을 대체할 신세대 경수송 차량을 필요로 합니다. 국내 여러 제조사가 군과 기타 국가 기관의 범용 수송 플랫폼으로 쓰일 신형 차량 제안서를 제출했습니다.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_offers: "§YBRDM-2§! 현대화 제안 수렴"
 ukraine_modernize_sov_equipment_brdm_2_modernization_offers_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2_for_tooltip\n\n\n\n\n\n\n\n\n§W우리 군은 아직도 수백 대의 소련제 §YBRDM-2§! 정찰차에 의존하고 있습니다. 국방부는 방위산업계에 이 차량을 어떻게 현대화할 수 있을지 문의할 수 있습니다.\n\n제안이 들어오면 계획을 맡길 업체 한 곳을 고르거나 계획을 영구히 종료합니다.\n------------------\n이 결정은 다른 모든 §YBRDM-2§! 현대화 결정의 §R선행 조건§!입니다. 이 결정을 §R건너뛰면§! 해당 결정들을 완료할 기회를 §R잃게§! 됩니다.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_offers_mission: "기한: §YBRDM-2§! 현대화 제안"
 ukraine_modernize_sov_equipment_brdm_2_modernization_offers_mission_desc: "$ukraine_modernize_sov_equipment_brdm_2_modernization_offers_desc$\n\n§R타이머가 끝나면 어차피 제안이 도착하며, 우리는 선택해야 합니다.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_other_manufacturers: "다른 제조사를 §YBRDM-2§! 계획에 초청"
 ukraine_modernize_sov_equipment_brdm_2_modernization_other_manufacturers_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2_other_for_tooltip\n\n\n\n\n\n\n\n\n§W미콜라이우의 BRDM-2 작업이 다른 기업들의 관심을 끌었습니다. §YNVK 테크임펙스§!, 키이우의 §Y마야크§! 공장, 크레멘추크의 §YVEPR§! 기업, 빈니차의 §Y제45 시험 기계공장§!이 계획에 참여하기를 원하지만, 착수하려면 우리 비축분에서 여분의 BRDM-2 차체를 받아야 합니다.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_late: "남은 §YBRDM-2§!의 개량 방안 결정"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_late_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2l1_for_tooltip\n\n\n\n\n\n\n\n\n§W100대가 넘는 낡은 §YBRDM-2§!가 아직 우리 비축분에서 기다리고 있습니다. §Y미콜라이우 전차 수리 공장§!은 두 가지 해법을 제안합니다. 빠르게 내놓을 수 있는 저렴한 개량형 §YBRDM-2L1§!, 또는 거의 처음부터 다시 만든 정찰 차량 §YBRM 만후스트§!입니다.\n\n제안은 §Y2018년§! 말까지 유효합니다.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_late_mission: "마지막 기회: 남은 §YBRDM-2§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_late_mission_desc: "$ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_late_desc$\n\n§R타이머가 끝나면 공장이 제안을 철회합니다.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_brdm_2t: "테크임펙스에 §YBRDM-2T§! 시제품 주문"
 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_brdm_2t_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2t_2012_for_tooltip\n\n\n\n\n\n\n\n\n§W키이우의 §YNVK 테크임펙스§!가 BRDM-2를 재제작할 준비가 되어 있습니다. 화재 위험이 큰 GAZ-41 가솔린 엔진을 D-245 디젤로 교체하고 차량 전체를 대대적으로 정비합니다. 시제품에는 약 2년이 걸립니다.\n\n제안은 §Y2011년§! 말까지 유효합니다.\n------------------\n이 결정은 §Y얀홀§! 방호 키트 결정의 §R선행 조건§!입니다. 이 결정을 §R건너뛰면§! 해당 결정을 완료할 기회를 §R잃게§! 됩니다.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_brdm_2t_mission: "마지막 기회: §YBRDM-2T§! 시제품"
 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_brdm_2t_mission_desc: "$ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_brdm_2t_desc$\n\n§R타이머가 끝나면 테크임펙스가 제안을 철회합니다.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_yanhol: "§Y얀홀§! 방호 키트 개발"
 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_yanhol_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2t_yanhol_for_tooltip\n\n\n\n\n\n\n\n\n§W승무원들이 §YBRDM-2T§!의 방호력 강화를 원합니다. §YNVK 테크임펙스§!는 우리가 이미 생산 중인 형식에 이격 강철 장갑판을 추가해 §YBRDM-2T 얀홀§!로 만들 수 있습니다.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mayak_brdm_2dp: "마야크에 §YBRDM-2DP§! 주문"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mayak_brdm_2dp_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2dp_for_tooltip\n\n\n\n\n\n\n\n\n§W키이우의 §Y마야크§! 공장이 디젤 엔진을 단 경량형 BRDM-2인 §YBRDM-2DP§!를 제안합니다. 12.7mm DShKM과 SGMB 기관총 두 정, 병력용 측면 문, 탈착식 대성형작약 방호망을 갖추고 있습니다.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_vepr_brdm_2_vepr: "VEPR에 §YBRDM-2 '베프르'§! 주문"
 ukraine_modernize_sov_equipment_brdm_2_modernization_vepr_brdm_2_vepr_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2_vepr_for_tooltip\n\n\n\n\n\n\n\n\n§W크레멘추크의 §YVEPR§! 기업이 §YBRDM-2 '베프르'§!를 제안합니다. 조종석에 방탄유리를 달아 시야를 개선하고 하부에는 장갑을 덧댑니다. 차체 하부 보조 바퀴는 병력용 대형 측면 문으로 대체되고, 선미 기관총이 수류 추진기를 대신하며, 선수에는 자동 유탄발사기를 장착할 수 있습니다.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_vinnytsia_brdm_2i: "빈니차에 §YBRDM-2I§! 주문"
 ukraine_modernize_sov_equipment_brdm_2_modernization_vinnytsia_brdm_2i_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2i_for_tooltip\n\n\n\n\n\n\n\n\n§W빈니차의 §Y제45 시험 기계공장§!이 §YBRDM-2I§!를 제안합니다. 소음이 적은 156마력 ISUZU 디젤이 가솔린 엔진을 대체하고, 중앙 타이어 공기압 조절 장치가 추가되며, 무장은 14.5mm KPVT, AGS-17 유탄발사기, §Y바리어§! 대전차 미사일로 강화됩니다.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.4.d: "VEPR 기업을 끌어들인다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.4.e: "미콜라이우만으로 충분하다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.10.c: "zr. 2012로 충분하다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.14.name: "BRDM-2를 재제작하는 아레이"
 ukraine_modernize_sov_equipment_brdm_2_modernization.14.desc: "육군과 국가방위군 지원병으로 이루어진 엔지니어링 그룹 §Y아레이§!가 자체 판단으로 BRDM-2 재제작에 착수했습니다. 이들의 §YBKM 헤콘§!은 강력한 디젤 엔진과 측면 문을 갖추고 아홉 명이 탈 수 있는 공간을 확보했습니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization.14.a: "그대로 작업하게 둔다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.14.b: "자금을 지원한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.15.name: "BKM 헤콘 공개"
 ukraine_modernize_sov_equipment_brdm_2_modernization.15.desc: "아레이가 §YBKM 헤콘§!을 공개했습니다. 유압식 구동 장치를 갖춘 제너럴 모터스 디젤 엔진, 사격 구멍, 측면 문, 더 두꺼워진 장갑이 낡은 BRDM-2를 전선이 요구한 차량으로 탈바꿈시켰습니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization.15.a: "§YBKM 헤콘§!을 채택한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.16.name: "BRDM-2T 얀홀 준비 완료"
 ukraine_modernize_sov_equipment_brdm_2_modernization.16.desc: "§YNVK 테크임펙스§!가 우리 §YBRDM-2T§!에 이격 강철 장갑판을 장착했습니다. §YBRDM-2T 얀홀§!은 승무원을 소화기 사격과 포탄 파편으로부터 훨씬 안전하게 지켜 줍니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization.16.a: "§YBRDM-2T 얀홀§!을 채택한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.17.name: "BRDM-2DP 준비 완료"
 ukraine_modernize_sov_equipment_brdm_2_modernization.17.desc: "§Y마야크§! 공장이 우리 군을 위한 §YBRDM-2DP§!를 완성했습니다. 디젤 엔진, 측면 문, 탈착식 대성형작약 방호망을 갖춘 경량형 BRDM-2입니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization.17.a: "§YBRDM-2DP§!를 채택한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.18.name: "BRDM-2I 준비 완료"
 ukraine_modernize_sov_equipment_brdm_2_modernization.18.desc: "빈니차의 §Y제45 시험 기계공장§!이 저소음 ISUZU 디젤 엔진, 중앙 타이어 공기압 조절 장치, 더 강력한 무장을 갖춘 §YBRDM-2I§!를 인도했습니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization.18.a: "§YBRDM-2I§!를 채택한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.19.name: "BRDM-2 베프르 준비 완료"
 ukraine_modernize_sov_equipment_brdm_2_modernization.19.desc: "크레멘추크의 §YVEPR§! 기업이 우리 군을 위한 §YBRDM-2 '베프르'§!를 완성했습니다. 조종석 방탄유리, 장갑을 덧댄 하부, 병력용 측면 문, 선미 기관총 진지를 갖추었습니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization.19.a: "§YBRDM-2 '베프르'§!를 채택한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_plan_tt: "§Y미콜라이우 전차 수리 공장§!은 단계별로 개량을 제안합니다. §Y2000-2001년§!에는 초기 개량형, §Y2004-2005년§!에는 §YBRDM-2DI 하자르§!, §Y2010-2012년§!에는 다른 제조사 초청, §Y2015-2018년§!에는 남은 BRDM-2의 최종 개량입니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_plan_tt: "§YNVK 테크임펙스§!는 §Y2010년§!에 §YBRDM-2T§!를 시작합니다. 개량은 단계적으로 진행됩니다. 먼저 시제품, 이어서 경량형 또는 개량형, 그다음 §Y얀홀§! 방호 키트입니다."
