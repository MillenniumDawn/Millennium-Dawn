 ZIM.communist_state: "£ZIM_emerging_communist (ZAPU-FP) - 津巴布韦非洲人民联盟-联邦党"
 ZIM.communist_state_icon: "£ZIM_emerging_communist"
 ZIM.communist_state_desc: "(联邦主义)\n津巴布韦非洲人民联盟-联邦党\n\nZAPU-FP最初是1961年成立的ZAPU的一部分，是原ZAPU内部的一个分裂派系。此次分裂发生在1987年《统一协议》之后，该协议是古库拉洪迪大屠杀的结果，当时称为爱国阵线的ZAPU整体加入了ZANU。而总部位于马塔贝莱兰、主要由恩德贝莱人组成的ZAPU-FP没有加入，恩德贝莱人以及卡兰加人正是大屠杀的目标。\n\nZAPU-FP寻求实现马塔贝莱兰的权力下放，甚至该地区的完全独立，其对马塔贝莱兰的倡导在其政治纲领中占据核心地位，而非原党的马克思列宁主义，然而，这一意识形态并未被ZAPU-FP放弃。"
 USoE.communist_state: "£EU_parl_PG_party_4 (AoC) - 共产主义联盟"
 USoE.communist_state_icon: "£EU_parl_PG_party_4"
 USoE.communist_state_desc: "（马克思列宁主义） - 共产主义者联盟（AoC）\n\n共产主义者联盟占据欧罗巴议会的最左翼，主要由共产主义者组成。它相信必须取代资本主义，建立一种所有生产资料归国家所有的经济制度。其目标是通过革命 - 必要时使用暴力以推翻现行制度，实现真正的社会主义，并接受一个由专政掌握权力的过渡时期的必要性。"
 USoE.communist_state_2017: "£EU_parliament_PG_2017_Communist_State (INITIATIVE) - 共产党和工人党倡议"
 USoE.communist_state_2017_icon: "£EU_parliament_PG_2017_Communist_State"
 USoE.communist_state_2017_desc: "（马克思列宁主义） - 共产党和工人党倡议(INITIATIVE)\n\n倡议占据欧罗巴议会的最左翼，主要由共产主义者组成。它相信必须取代资本主义，建立一种所有生产资料归国家所有的经济制度。其目标是通过革命 - 必要时使用暴力以推翻现行制度，实现真正的社会主义，并接受一个由专政掌握权力的过渡时期的必要性。"