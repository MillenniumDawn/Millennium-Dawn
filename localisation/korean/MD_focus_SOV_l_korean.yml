 SOV_rosatom_fuel_division: "로사톰 연료 부문"
 SOV_rosatom_fuel_division_desc: "운영을 간소화하기 위해 모든 핵 자산이 로사톰의 지휘 아래 연료 부문으로 통합될 것입니다."
 SOV_rosatom_fuel_division2: "시베리아 화학 콤비나트"
 SOV_rosatom_fuel_division2_desc: "1953년 톰스크-7(현 세베르스크)에 설립된 이 복합단지는 핵무기 부품 생산을 담당하며 TVEL의 자회사로 운영됩니다."
 SOV_rosatom_predmet_zoloto: "ARMZ 우라늄 홀딩"
 SOV_rosatom_predmet_zoloto_desc: "로사톰의 광업 부문인 아톰레드메트졸로토는 우라늄 생산량에서 세계 6위, 현지 침출 우라늄 매장량에서 세계 2위를 차지합니다."
 sov_nationalists.50.t: "[SOV.GetName]의 현이 된 [FROM.GetName]"
 sov_nationalists.50.d: "[FROM.GetName]이(가) 공식적으로 우리 국가의 지방으로 편입되었습니다. 이제 우리는 완전한 통합에 집중하고 불안정을 초래했던 과거의 실수를 피해야 합니다."
 sov_nationalists.50.o1: "하나이며 불가분"
 sov_nationalists.51.t: "[SOV.GetName]에 통합된 [FROM.GetName]"
 sov_nationalists.51.d: "[FROM.GetName]이(가) 우리의 위대한 제국에 완전히 흡수되었습니다. 잃어버린 영토를 되찾을수록 우리나라는 더욱 강해지며, 우리는 팽창을 멈출 계획이 없습니다."
 sov_nationalists.51.o1: "우리나라가 더 커졌다"
 sov_nationalists_news.1.t: "지리노프스키, 대통령에 당선"
 sov_nationalists_news.1.d: "최근의 정권 교체에 따라 [SOV.GetLeader] 지도하의 민족주의 정당 러시아 자유민주당이 러시아의 권력을 장악했습니다. 이들은 옛 국기 복원과 보수적 민족주의 의제 추진을 포함한 급진적인 정치 강령을 발표했습니다."
 sov_nationalists_news.1.a: "러시아에는 무엇이 기다리고 있을까?"
 sov_nationalists_news.2.t: "신 러시아 제국"
 sov_nationalists_news.2.d: "텔레비전으로 중계된 연설에서 러시아 대통령은 필요한 모든 수단을 동원해 러시아 제국을 부활시키겠다는 의지를 선언했습니다. 이는 많은 나라, 특히 이를 자국 주권에 대한 위협으로 보는 옛 소련 국가들을 불안하게 했습니다. 세계는 이 공격적인 수사가 단지 선거 운동용이기를 바라고 있습니다."
 sov_nationalists_news.2.a: "불안한 발언이다"
 SOV_economic_gazprom_turkeystream_desc: "튀르키예 스트림은 튀르키예를 남유럽의 유통 거점으로 만들고 앙카라의 에너지 안보를 우리의 에너지 안보와 묶어 줍니다. 우리 가스에 의존하는 동반자는 워싱턴이나 브뤼셀이 가하는 압력에 훨씬 덜 호응합니다."
 sov_economic.22.t: "가즈프롬 스캔들"
 sov_economic.22.d: "가즈프롬과 관련된 스캔들이 언론 폭로를 통해 대중에게 알려졌습니다. 이로 인해 회사의 주가가 하락했고 평판에 대한 우려가 커졌습니다."
 sov_economic.22.a: "언론 탓으로 돌려라."
 sov_economic.23.t: "스베르뱅크 스캔들"
 sov_economic.23.d: "스베르뱅크가 언론에 널리 보도된 스캔들에 휘말려 주가에 악영향을 받고 투자자 신뢰가 흔들렸습니다."
 sov_economic.23.a: "언론이 또 공격한다."
 sov_economic.24.t: "로스네프트 스캔들"
 sov_economic.24.d: "로스네프트가 대대적으로 알려진 스캔들에 직면해 회사의 평판이 손상되고 주가가 하락했습니다."
 sov_economic.24.a: "언론의 왜곡이다."
 sov_economic.25.t: "대기업 시가총액 붕괴"
 sov_economic.25.d: "우리나라에 대한 제재로 많은 외국인 투자자가 주요 기업에서 철수하여 시가총액이 급락했습니다."
 sov_economic.25.a: "외세를 탓하라."
 sov_economic.26.t: "올리가르히 숙청의 여파"
 sov_economic.26.d: "올리가르히에 대한 우리의 엄격한 접근은 수많은 형사 사건을 불러왔고, 투자자들이 공포에 반응해 빠져나가면서 주요 기업들에 부정적인 영향을 미쳤습니다."
 sov_economic.26.a: "어리석은 투자자들."
 sov_economic.27.t: "로스네프트 시설 사고"
 sov_economic.27.d: "로스네프트 시설에서 발생한 사고로 심각한 경제적, 환경적 피해가 발생했습니다. 투자자들은 국가의 무거운 제재를 예상하고 서둘러 주식을 팔았습니다."
 sov_economic.27.a: "누가 밸브 잠그는 걸 잊었나?"
 sov_economic.28.t: "가즈프롬 시설 사고"
 sov_economic.28.d: "가즈프롬 시설에서 대형 사고가 발생하여 경제적, 환경적 여파를 낳았습니다. 투자자들은 정부의 제재를 우려해 신속하게 주식을 팔았습니다."
 sov_economic.28.a: "또 밸브 사고인가?"
 sov_economic.29.t: "가즈프롬 가스 공급 중단"
 sov_economic.29.d: "가스 공급 중단 소식이 증시를 강타하여, 투자자들이 성장 둔화와 손실을 우려하면서 가즈프롬 주가가 급락했습니다."
 sov_economic.29.a: "근시안적인 투자자들."
 sov_economic.30.t: "신규 가스 공급 개시"
 sov_economic.30.d: "증시는 긍정적인 소식과 함께 개장했습니다. 신규 가스 공급 개시 발표 이후 가즈프롬 주가가 급등했습니다."
 sov_economic.30.a: "훌륭한 소식이다."
 sov_economic.31.t: "국유화 공포"
 sov_economic.31.d: "1990년대의 민영화를 재검토한다는 소문이 투자자들 사이에 공포를 일으켜, 이들은 자산을 잃을까 두려워 주식을 급속히 팔기 시작했습니다."
 sov_economic.31.a: "과잉 반응하는 투자자들."
 sov_economic.32.t: "WTO 가입에 대한 반응"
 sov_economic.32.d: "우리의 WTO 공식 가입 이후, 투자자들이 큰 성장을 기대하며 앞다투어 주식을 매수하면서 모스크바 증권거래소가 급등했습니다."
 sov_economic.32.a: "환상적이다!"
 sov_economic.33.t: "모스크바 증권거래소 재개"
 sov_economic.33.d: "한 달간의 강제 폐쇄를 거쳐 모스크바 증권거래소가 다시 문을 열었고 거래가 정상으로 돌아왔습니다."
 sov_economic.33.a: "돌아온 것을 환영한다."
 SOV_sanctions_capitalization_tt: "£text_icon_sov_ruble §Y회사의 자본화§!는 §R계속해서 감소할 것입니다§! 집중 §Y그리고 성장§!이 §G완료될 때까지§!."
 SOV_sanctions_over_capitalization_tt: "§R국제적 제제§! §G는 더 이상§! £text_icon_sov_ruble §Y우리 회사들의 자본화§!에 영향을 미치지 않습니다."
 SOV_stop_moex_tt: "§YTrading on the Moscow Stock Exchange§! will be §Rsuspended§! for a certain time, during which £text_icon_sov_ruble §Ycapitalization§! of companies §2will cease§! to change."
 SOV_run_moex_tt: "§Y모스크바 증권 거래소§!는 §G재개될 것이며§!, 이제 £text_icon_sov_ruble §Y회사의 자본화§!는 §G다시 변동할 것입니다§!."
 SOV_baikonur_sov_kaz_idea: "바이코누르 우주 기지"
 SOV_baikonur_kaz_idea: "바이코누르 우주 기지"
 SOV_baikonur_sov_idea: "바이코누르 우주 기지"
 SOV_return_baikonur: "§Y바이코누르 우주기지§! §G반환§!"
 SOV_baikonur_pays_tt: "[KAZ.GetFlag]§Y바이코누르 우주기지§! §Y임대§!에 대한 주간 지출 $§R0.055§!"
 SOV_baikonur_gays_tt: "[SOV.GetFlag]§Y바이코누르 우주기지§! §Y임대§!에 대한 주간 수입 $§G0.055§!"
 SOV_inter_rao: "트란스니스트리아의 인터 RAO"
 sov_economic.34.t: "쿠추르간 발전소 민영화"
 sov_economic.34.d: "러시아 기업 인터 RAO가 우리의 강력한 GRES 발전소를 민영화할 계획입니다. 이들은 지속적인 가동과 점진적인 기술 개선을 보장하겠다고 약속하며, 이는 우리 에너지 부문에 이익이 될 것입니다."
 sov_economic.34.a: "We agree."
 sov_economic.34.b: "We disagree."
 sov_economic.35.t: "쿠추르간 발전소 민영화"
 sov_economic.35.d: "트란스니스트리아 당국이 우리의 민영화 제안을 수락하여 이 지역에서 우리의 영향력이 커졌습니다."
 sov_economic.35.a: "Positive outcome."
 sov_economic.36.t: "쿠추르간 발전소 민영화"
 sov_economic.36.d: "뜻밖에도 트란스니스트리아 당국이 우리의 민영화 제안을 거부했습니다. 우리는 그들의 결정을 받아들이고 넘어가야 합니다."
 sov_economic.36.a: "Unfortunate."
 SOV_interrao_open: "§Y인터라오§! §G개방§!"
 SOV_interrao_close: "§Y인터라오§! §G폐쇄§!"
 SOV_interrao_buy_pmr_gres: "§Y추추르간 발전소§! 매입"
 SOV_Economy_unfluency_TT: "[SOV.GetFlag] 러시아 §H영향력 배수§!  §Y[ROOT.GetNameWithFlag]§!: §R+10%§!"
 PMR_gazprom_gaz: "트란스니스트리아의 가즈프롬"
 sov_economic.37.t: "가즈프롬의 무료가스"
 sov_economic.37.d: "Russia supports our independence and offers free gas supplies. However, this generosity comes with an expected political price, as it may be used to influence our policies."
 sov_economic.37.a: "Accept."
 sov_economic.37.b: "Decline."
 sov_economic.38.t: "트란스니스트리아에 무료 가스를"
 sov_economic.38.d: "트란스니스트리아 당국이 우리의 무료 가스 제안에 긍정적으로 응답하여 이 지역에서 우리의 입지가 강화되었습니다."
 sov_economic.38.a: "Good news."
 sov_economic.39.t: "트란스니스트리아에 무료 가스를"
 sov_economic.39.d: "트란스니스트리아 당국이 우리의 무료 가스 제안을 거절했으며, 이는 지역 내 우리 영향력에 실망스러운 차질입니다."
 sov_economic.39.a: "Unfortunate."
 SOV_gazprom_in_pmr: "§Y[PMR.GetFlag]트란스니스트리아§!에 무료 가스 공급"
 SOV_korean_stream_sov_idea: "대한민국 방송"
 SOV_korean_stream_idea: "대한민국 방송"
 SOV_gazprom_in_pmr_desc: "우리는 §Y[PMR.GetNameWithFlag]§!에 무료 가스를 제공하여 이 국가의 경제적 안정을 유지할 준비가 되어 있습니다. 그 대가로, 우리는 그들에 대한 영향력을 증가시킬 것입니다."
 SOV_gazprom_mechanic_stream_tt: "이 §Y가스 파이프라인§!이 활성화되어 있는 동안, £text_icon_sov_gazprom §2가즈프롬§!은 매월 §G0.035§! £text_icon_sov_ruble §Y자본화§!를 받습니다.\n"
 SOV_economic_mmvb: "모스크바 은행간 외환 거래소"
 SOV_economic_mmvb_desc: "모스크바 은행간 외환 거래소는 루블 환율을 정하고 국내 외환 및 증권 거래의 대부분을 청산합니다. 대형 국영 기업들을 규제되는 거래소에 올리면 국고는 기업 수익에 대한 신뢰할 만한 지표를 얻게 되며, 가즈프롬, 로스네프트, ALROSA의 상장으로 가는 길이 열립니다."
 SOV_economic_mosbirja: "모스크바 거래소"
 SOV_economic_mosbirja_desc: "외환 거래소와 증권 시장을 합병하면 러시아는 주식, 채권, 파생상품, 외환을 위한 단일 플랫폼을 갖게 됩니다. 뒤따르는 더 깊은 자본 풀은 기업의 £text_icon_sov_ruble §Y시가총액§!을 이전보다 훨씬 더 급격하게, 양방향으로 움직이게 할 것입니다. 좋은 소식은 더 크게 보상받고, 나쁜 소식은 더 크게 벌을 받습니다."
 SOV_economic_sber_reorg: "스베르뱅크 개혁"
 SOV_economic_sber_reorg_desc: "스베르뱅크는 운영을 현대화하고 서비스를 개선하기 위해 포괄적인 개혁을 진행하고 있습니다. 이 변혁은 변화하는 금융 환경에서 스베르뱅크를 더 고객 중심적이고 경쟁력 있게 만드는 것을 목표로 합니다."
 SOV_economic_sber_ipo: "스베르뱅크 국민 IPO"
 SOV_economic_sber_ipo_desc: "스베르뱅크는 소유권을 넓히고 자본 기반을 강화하기 위해 공모 IPO를 추진할 계획입니다. 이 구상은 투명성을 높이고 더 많은 대중의 참여를 이끌어 낼 것입니다."
 SOV_economic_vtb_ipo: "VTB 국민 IPO"
 SOV_economic_vtb_ipo_desc: "VTB 은행은 투자를 유치하고 시장 내 입지를 넓히기 위해 공모 IPO를 준비하고 있습니다. 이 조치는 재무 안정성을 높이고 성장을 뒷받침할 것입니다."
 SOV_economic_vtb: "VTB 은행"
 SOV_economic_vtb_desc: "VTB 은행은 개인과 기업에 폭넓은 은행 서비스를 제공하는 러시아의 주요 금융 기관입니다. 러시아 은행 부문에서 핵심적인 역할을 합니다."
 SOV_economic_alpha: "알파 은행"
 SOV_economic_alpha_desc: "알파 은행은 포괄적인 금융 상품과 서비스로 알려진 러시아의 선도적인 민간 은행입니다. 개인 고객과 기업 고객을 모두 상대합니다."
 SOV_economic_alpha_lab: "알파 랩"
 SOV_economic_alpha_lab_desc: "알파 랩은 알파 은행의 혁신 거점으로, 고객 경험을 높이기 위한 최첨단 금융 기술과 디지털 솔루션 개발에 집중합니다."
 SOV_economic_kasperskyi: "카스퍼스키 랩"
 SOV_economic_kasperskyi_desc: "카스퍼스키 랩은 러시아에 본사를 둔 세계적으로 인정받는 사이버 보안 기업입니다. 전 세계 사용자를 보호하는 첨단 백신 및 보안 소프트웨어를 개발합니다."
 SOV_economic_bilene: "빌라인"
 SOV_economic_bilene_desc: "빌라인은 전국에 이동통신 및 인터넷 서비스를 제공하는 러시아의 선도적인 통신 기업입니다. 사람과 기업을 연결하는 데 중요한 역할을 합니다."
 SOV_capitalisation_vtb_tt: "£text_icon_sov_vtb §YVTB§!의 £text_icon_sov_ruble §Y시가총액§!이 $§Y[?SOV_modify_capitalisation_vtb]§! 십억만큼 §Y변동§!합니다\n"
 russian_legacy: "£text_icon_sov_empire 러시아의 유산"
 russian_legacy_desc: "수 세기 동안 러시아는 고립되고 강력한 통치를 받으며 자신만의 독특한 길을 걸어왔습니다. 변화는 더디게 오지만 이제 변혁의 때가 무르익었을지도 모릅니다."
 SOV_idea_restalinization_desc: "러시아는 올바른 길에서 벗어났습니다. 우리의 힘과 독립을 되찾으려면 스탈린의 방식과 비전으로 돌아가야 합니다."
 SOV_vk_durov_idea: "프콘탁테"
 sov_economic.40.t: "프콘탁테 소셜 네트워크의 운명"
 sov_economic.40.d: "프콘탁테는 대학 소셜 네트워크로 시작했으나 러시아 최대의 플랫폼으로 성장했습니다. 사회에 대한 영향력이 급속히 커지는 만큼 이제 그 미래를 결정해야 합니다."
 sov_economic.40.a: "독립 상태로 두어라."
 sov_economic.40.b: "VK를 국가 통제 아래 두어라."
 SOV_airforce_far_aviation: "장거리 항공 사령부"
 SOV_airforce_far_aviation_desc: "우리는 장거리 항공 작전을 관리할 새로운 사령부를 설치하고 있습니다."
 SOV_airforce_transport_aviation: "군 수송 항공대"
 SOV_airforce_transport_aviation_desc: "군 수송 항공대는 전략적, 작전적 병력 및 보급 이동을 담당하여 최고사령관을 지원합니다."
 SOV_airforce_space_forces_upgrade: "우주군 개혁"
 SOV_airforce_space_forces_upgrade_desc: "발전하는 항공 부문은 우주군을 포함한 군의 모든 군종에 걸친 개혁을 요구합니다."
 SOV_air_rocket_defence: "항공우주 및 미사일 방어군"
 SOV_air_rocket_defence_desc: "이 새로운 병과는 국가 및 군의 핵심 자산을 항공우주 공격으로부터 방어할 것입니다."
 SOV_radio_defense_investments: "무선기술군"
 SOV_radio_defense_investments_desc: "레이더와 자동화 체계를 갖춘 이 병력은 항공 정찰을 수행하고 통제 기관과 전투 부대에 레이더 정보를 제공합니다."
 SOV_armyreform_anti_air: "방공군"
 SOV_armyreform_anti_air_desc: "이 병력은 다양한 작전 중 적의 공습으로부터 아군과 시설을 보호합니다."
 SOV_armyreform_engineer: "공병대"
 SOV_armyreform_engineer_desc: "공병대는 전문적인 군사 공학 임무를 수행하고 적 부대에 피해를 입히는 작전을 실시합니다."
 SOV_railway_troops: "철도 부대"
 SOV_railway_troops_desc: "철도 부대는 철도망을 관리하고 보호하여 러시아의 방어를 보장합니다."
