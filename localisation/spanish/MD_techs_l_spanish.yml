 EQ_MOD_CAT_module_surface_drone_control_category_TITLE: "Control autónomo de buques de combate de superficie"
 module_naval_surface_drone_control: "Control autónomo de buques de combate de superficie"
 module_naval_surface_drone_control_desc: "Las suites de control autónomo permiten que las fragatas y destructores operen con requisitos de tripulación significativamente reducidos, automatizando la navegación rutinaria, la fusión de sensores y la asistencia en el control de daños, al tiempo que retienen su plena capacidad de combate.\n\n§GConsejo de diseño: El control autónomo reduce drásticamente las necesidades de mano de obra al tiempo que mejora de forma generalizada los sensores, las armas, la protección y la velocidad. Es ideal para buques de combate de superficie avanzados con tripulación reducida, pero tiene altos costes de capacidad industrial (IC) y microchips.§!"
 support_ship_nuclear_upgrade: "Propulsión nuclear"
 support_ship_nuclear_upgrade_desc: "Instalar un reactor naval libera a estos buques de los límites de alcance por combustible, permitiéndoles mantener el ritmo de una fuerza de tarea nuclear en despliegues que abarcan todo el océano."
 nuclear_propulsion_upgrade_capacity_tt: "Capacidad de mejora de §Y$support_ship_nuclear_upgrade$§! §G+4§!"
 UKR_world_economical_relations: "Relaciones económicas ucranianas"
 module_futuristic_integrated_missile_radar_control1_desc: "Los sistemas de información de combate futuristas incorporan aprendizaje automático y tecnologías de IA para mejorar la capacidad del buque para rastrear el lanzamiento, el vuelo e interceptación de armas enemigas a velocidades subsónicas, supersónicas e incluso hipersónicas.\n\n§GConsejo de diseño: El control de tiro mejora el ataque de cañón, los misiles antibuque, la perforación de misiles antibuque, el ataque antiaéreo y el blindaje, haciendo que un buque armado sea más efectivo en múltiples roles. Los sistemas avanzados proporcionan mayores bonificaciones pero cuestan más capacidad industrial (IC) y microchips.§!"
