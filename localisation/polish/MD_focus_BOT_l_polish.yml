l_polish:
 botswana_focus: "Drzewo fokusowe Botswany"
 BOT_model_student_of_africa: "Wzorowy student Afryki"
 BOT_model_student_of_africa_desc: "Botswana jest jednym z najbardziej rozwiniętych krajów Afryki. Od czasu uzyskania niepodległości jest to stabilna demokracja, w której konfliktów jest niewiele. Szczycąca się najwyższym wskaźnikiem rozwoju społecznego i najniższym postrzeganą korupcją w Afryce Subsaharyjskiej, Botswana jest jasnym światłem do naśladowania dla reszty Afryki.\n\n§RIJeśli nasz §YPoziom korupcji§! jest wyższa niż §Y$corruption_level_05$§! stracimy ten bonus!§!"
 BOT_kalahari_expansion: "Pustynnienie Kalahari"
 BOT_kalahari_expansion_desc: "The Kalahari Desert in the Western part of Botswana covers a large area. Year after year, this desert expands more. As 95% of Botswana receives so little rainfall that it is not viable for agriculture, 71% of the country is being used for agricultural grazing and most people get their water from groundwater. The large cattle industry makes the desertification worse, though almost half of Botswanans get their income from it.\n\nWestern Botswana is also a home to many national parks (which make up 20% of the country's land area), the largest of which is the Central Kalahari Game Reserve, home to the San People and one of the largest diamond mines in Botswana.\n\n§YEvery January§! we will get an update on the desertification status of the Kalahari. The desert might continue to expand (§YDesertification§!), the situation might stay the same (§YStabilisation§!) or the situation could improve (§YOasification§!). The likelihoods of each outcome can be seen in the §Y$BOT_anti_poaching_decisions$§! decision category.\n\nWe can continue exploiting the already suffering Kalahari and the surrounding Savannah and make the desertification worse, or we can try to take a conservationist approach to slow down or even reverse it."
 BOT_house_of_chiefs: "Izba Szefów"
 BOT_house_of_chiefs_desc: "The House of Chiefs (Ntlo ya Dikgosi) is an advisory body of the Botswanan parliament. The House is composed of the hereditary chiefs of Botswana's 8 principal tribes, 22 elected members and 5 chiefs nominated by the President. The House holds no political or executive power, however most bills and all constitutional changes have to be reviewed and discussed in the House before making it to the National Assembly. The Dikgosi themselves hold only ceremonial and small administrative power over their tribes."
 BOT_house_of_chiefs_tt: "Koszt zmiany wydatków i polityki rządowej: §R+15%§!\nWydatki biurokratyczne: §R+5%§!"
 BOT_house_of_chiefs_empowered: "Izba Szefów – wzmocniona"
 BOT_house_of_chiefs_empowered_desc: "The House of Chiefs (Ntlo ya Dikgosi) is an advisory body of the Botswanan parliament. The House is composed of the hereditary chiefs of Botswana's 8 principal tribes, 22 elected members and 5 chiefs nominated by the President. Most bills and all constitutional changes have to be reviewed and discussed in the House before making it to the National Assembly. The House has the right to veto bills (once) and control legislation that controls tribe related activities. The Dikgosi themselves have leeway and autonomy and can pass laws that differ from the national legislature, and the Dikgosi are granted immunity from legal actions while in power."
 BOT_house_of_chiefs_empowered_tt: "Koszt zmiany wydatków i polityki rządowej: §R+20%§!\nWydatki biurokratyczne: §R+10%§!"
 BOT_house_of_chiefs_militarised: "Izba Szefów – zmilitaryzowana"
 BOT_house_of_chiefs_militarised_desc: "The House of Chiefs (Ntlo ya Dikgosi) is an advisory body of the Botswanan parliament. The House is composed of the hereditary chiefs of Botswana's 8 principal tribes, 22 elected members and 5 chiefs nominated by the President. The House holds no political or executive power, however most bills and all constitutional changes have to be reviewed and discussed in the House before making it to the National Assembly. The Dikgosi themselves hold only ceremonial and small administrative power over their tribes. However, they have been granted the right to organise and train local militias to serve as a local security force."
 BOT_house_of_chiefs_militarised_tt: "Koszt zmiany wydatków i polityki rządu: §R+20%§!\nPłace wojskowe: §R+5%§!\nWydatki biurokratyczne: §R+5%§!"
 BOT_house_of_chiefs_empowered_and_militarised: "Izba Szefów – wzmocniona i zmilitaryzowana"
 BOT_house_of_chiefs_empowered_and_militarised_desc: "The House of Chiefs (Ntlo ya Dikgosi) is an advisory body of the Botswanan parliament. The House is composed of the hereditary chiefs of Botswana's 8 principal tribes, 22 elected members and 5 chiefs nominated by the President. Most bills and all constitutional changes have to be reviewed and discussed in the House before making it to the National Assembly. The House has the right to veto bills (once) and control legislation that controls tribe related activities. The Dikgosi themselves have leeway and autonomy and can pass laws that differ from the national legislature, and the Dikgosi are granted immunity from legal actions while in power. The Dikgosi also have the right to organise and train local militias to serve as a local security force."
 BOT_house_of_chiefs_empowered_and_militarised_tt: "Koszt zmiany wydatków i polityki rządu: §R+20%§!\nPłace wojskowe: §R+5%§!\nWydatki biurokratyczne: §R+10%§!\n"
 BOT_ancestral_land_conflict: "Konflikt o ziemię przodków"
 BOT_ancestral_land_conflict_desc: "W Centralnym Rezerwacie Dzikich Zwierząt Kalahari żyją łowcy-zbieracze Lud San (znani również jako Buszmeni), jedna z najstarszych kultur na Ziemi. Żyją tam także inni ludzie z pierwszych narodów, tacy jak Bakgalagadi (od którego pochodzi nazwa pustyni). Rezerwat dzikich zwierząt został pierwotnie utworzony w celu ochrony zarówno dzikiej przyrody, jak i stylu życia Buszmenów.\n\nW latach 70. rząd Botswany twierdził, że San zaprzestał polowań na zwierzęta, a obszar będący rezerwatem przyrody zablokował dostęp rządowi od tworzenia usług dla Sanu (takich jak szkoły i szpitale). Rozpoczął się program relokacji, który zbiegł się w czasie ze znalezieniem diamentowej żyły w rezerwacie dzikich zwierząt. W latach 90. wysiłki związane z relokacją nasiliły się, gdy rząd zaczął ograniczać dostęp do usług mieszkańcom rezerwatu.\n\nLudzie San stanowią jedynie niewielki ułamek naszej populacji i jako tacy nie mają realnych możliwości przeciwstawienia się nam. Jednak ich traktowanie jest plamą na naszym międzynarodowym wizerunku."
 BOT_ancestral_land_conflict_escalated: "Eskalacja konfliktu o ziemię przodków"
 BOT_ancestral_land_conflict_escalated_desc: "W Centralnym Rezerwacie Dzikich Zwierząt Kalahari żyją łowcy-zbieracze Lud San (znani również jako Buszmeni), jedna z najstarszych kultur na Ziemi. Żyją tam także inni ludzie z pierwszych narodów, tacy jak Bakgalagadi (od którego pochodzi nazwa pustyni). Rezerwat dzikich zwierząt został pierwotnie utworzony w celu ochrony zarówno dzikiej przyrody, jak i stylu życia Buszmenów.\n\nW latach 70. rząd Botswany twierdził, że San zaprzestał polowań na zwierzęta, a obszar będący rezerwatem przyrody zablokował dostęp rządowi od tworzenia usług dla Sanu (takich jak szkoły i szpitale). Rozpoczął się program relokacji, który zbiegł się w czasie ze znalezieniem diamentowej żyły w rezerwacie dzikich zwierząt. W latach 90. wysiłki związane z relokacją nasiliły się, gdy rząd zaczął ograniczać dostęp do usług mieszkańcom rezerwatu.\n\nLudzie San stanowią jedynie niewielki ułamek naszej populacji i jako tacy nie mają realnych możliwości przeciwstawienia się nam. Jednak ich traktowanie jest plamą na naszym międzynarodowym wizerunku."
 BOT_BDP_stronghold: "£BOT_Neutral_konserwatyzm Twierdza BDP"
 BOT_BDP_stronghold_desc: "Ever since the creation of the country, the £BOT_Neutral_conservatism BDP (Botswana Democratic Party) has been ruling the country. Election after election they have been the largest party, with their smallest vote share being 55%. They are a big tent party that mixes conservatism, liberalism and socialism. Their main power comes from their Tswana supporters, so many other tribes in the country end up feeling left out. It would take a big political scandal to break the BDP hold on power.\n\n§YAs long as the A-Team and Barata-Phati factions of the £BOT_Neutral_conservatism BDP combined form the largest party, the £BOT_Neutral_conservatism BDP will stay in power after elections.\n\nIf the £BOT_Neutral_conservatism BDP becomes too strong, opposition parties will form into a single party, and any effects that would impact a single minor party will affect this new party.\n\nIf the £BOT_Neutral_conservatism BDP popularity drops too low, the reformist wing of the party will form its own party.§!"
 BOT_zimbabwean_refugees: "Uchodźcy z Zimbabwe"
 BOT_zimbabwean_refugees_desc: "The economic situation in Zimbabwe is pushing thousands of people both legally and illegally across the border into Botswana. Approximately one third of the Zimbabweans are in the country illegally, and most people crossing the border are immediately deported back to Zimbabwe. However, the mass number of refugees does have its benefits; while most Batswana get their living from cattle, most Zimbabweans work in the mining and industrial sectors, making them a disproportionate part of the Botswanan skilled labour force.\n\n§YThis National Spirit will be removed if Zimbabwe doesn't exist or is our subject§!"
 BOT_zimbabwean_refugees_encouraged: "Zachęta dla uchodźców z Zimbabwe"
 BOT_zimbabwean_refugees_encouraged_desc: "The economic situation in Zimbabwe is pushing thousands of people both legally and illegally across the border into Botswana. Approximately one third of the Zimbabweans are in the country illegally, and most people crossing the border are immediately deported back to Zimbabwe. However, the mass number of refugees does have its benefits; while most Batswana get their living from cattle, most Zimbabweans work in the mining and industrial sectors, making them a disproportionate part of the Botswanan skilled labour force.\n\n§YThis National Spirit will be removed if Zimbabwe doesn't exist or is our subject§!"
 BOT_army_of_peacekeepers: "Armia Utrzymania Pokoju"
 BOT_army_of_peacekeepers_desc: "Siły Obronne Botswany zreformowały swoją armię, aby służyła jako siła pokojowa na całym świecie. Oczywiście ludzie nie są tak podekscytowani faktem, że jedynym powodem wstąpienia do armii jest śmierć w innym kraju"
 BOT_army_against_poaching: "Armia Przeciwko Kłusownictwu"
 BOT_army_against_poaching_desc: "Siły Obronne Botswany skupiają się na walce z kłusownikami w tym kraju i uczestniczeniu w niesieniu pomocy ofiarom klęsk żywiołowych"
 BOT_army_against_poaching_tt: "Płace wojskowe: §G-10%§!\nWydatki na bezpieczeństwo wewnętrzne: §R+10%§!\n§GLiczba wyeliminowanych kłusowników wzrosła o 5§!"
 BOT_professional_military: "Profesjonalne wojsko"
 BOT_professional_military_desc: "Siły Obronne Botswany podjęły kroki, aby bardziej przypominać tradycyjne wojsko, dystansując się od swojej roli w przeciwdziałaniu kłusownictwu, utrzymywaniu pokoju i pomocy w przypadku katastrof"
 BOT_coal_focused_energy: "Rozpoczęcie Narodu Węgla"
 BOT_coal_focused_energy_desc: "Botswana zdecydowała się wykorzystać niewykorzystane zasoby węgla, aby stać się samowystarczalna w produkcji energii. Choć węgiel jest tani i łatwo dostępny, nie jest rozwiązaniem najbardziej przyjaznym dla środowiska."
 BOT_coal_focused_energy_tt: "Dodatkowe wydatki: $§R0,050§!"
 BOT_coal_focused_energy_self_sufficient: "Samowystarczalny naród węglowy"
