 news.91.t: "Fin de la guerre civile sri-lankaise"
 news.91.d: "Le gouvernement sri-lankais a déclaré la victoire totale sur les Tigres de libération de l'Eelam tamoul. Dans une dernière série d'offensives dans le nord-est, les forces gouvernementales ont submergé les derniers bastions des Tigres. Dans les derniers jours de la guerre, les combattants tamouls restants ont été encerclés le long des lagunes et des jungles de Mullaitivu. Coupés de toute fuite, les tentatives d'évasion par mer ont été interceptées. La direction des Tigres, longtemps jugée intouchable, aurait été tuée dans les dernières heures du conflit. S'adressant au Parlement, le président [SRI.GetName] a proclamé que la nation avait été « libérée du terrorisme ». Pour l'heure, le drapeau du Lion flotte sans contestation sur l'île."
 news.91.a: "La paix… à un prix."
 news.92.t: "Libération de l'Eelam par les Tigres tamouls"
 news.92.d: "Ce qui fut une guerre d'usure s'est conclu. Les Tigres de libération de l'Eelam tamoul sont victorieux. Dans les derniers jours du conflit, les derniers bastions de l'État sri-lankais dans les terres de l'Eelam tamoul se sont effondrés sous un assaut implacable. Les lignes d'approvisionnement se sont brisées, les pistes ont brûlé, et l'armée jadis redoutable s'est retrouvée encerclée et abandonnée. Les Tigres de l'Eelam tamoul ont surgi de la jungle non plus comme insurgés mais comme dirigeants. Le rêve de l'Eelam tamoul, écrit dans le sang et le sacrifice, a enfin été réalisé."
 news.92.a: "Intéressant."