 JAP_zombie_obstruction_down_20_tt: "$JAP_obstruction$: §G-20§!"
 JAP_whistleblower_protection_act: "Закон о защите лиц, сообщающих о нарушениях"
 JAP_whistleblower_protection_act_desc: "Аудиторы могут читать только то, что им передает фирма, в то время как сотрудники знают, какие кредиты были продлены, а какие счета-фактуры выставлены задним числом. Они работают на компанию, которую им пришлось бы обвинить, на рынке труда, предлагающем только одну карьеру и не имеющем второго шанса. Закон, объявляющий незаконным увольнение за разглашение информации, превращает молчаливых свидетелей в очевидцев."
 JAP_financial_revival_program: "Программа финансового возрождения"
 JAP_financial_revival_program_desc: "Банки оценивают своих заемщиков, и эти оценки скрывают неспособность погасить кредит. Программа финансового оздоровления применяет метод дисконтированных денежных потоков к каждому крупному кредиту, ужесточает ограничения по капиталу и активам, а также публикует целевой показатель по сокращению вдвое доли проблемных кредитов. Бизнес-федерации назовут это войной против промышленности, и они не совсем неправы."
 JAP_special_investigation_unit: "Отдел специальных расследований"
 JAP_special_investigation_unit_desc: "Аудит выносит заключение, прокурор выдвигает обвиняемого. Специальное следственное управление Токийской окружной прокуратуры свергало министров кабинета и является единственным учреждением, с которым правление кейрецу не может мирно договориться. Оно сосредоточено на финансовых отчетах."
 JAP_special_investigation_unit_TT: "Теперь противодействие накапливается §Gна 25% медленнее§!"
 JAP_the_lost_decade_ends: "Завершение потерянного десятилетия"
 JAP_the_lost_decade_ends_desc: "Последние неплатежеспособные фирмы проходят через суды, и реестр закрывается. Ничего не рефинансируется, все убытки записываются там, где они возникают, и теперь кредиты достаются только тем фирмам, которые могут их погасить. Экономика, в бухгалтерской отчетности которой отражена реальная правда, — это единственный фундамент, на котором можно строить все остальное.\n-------------\nЭтот фокус §Gremoves§! §Y$JAP_zombie_companies$§! и §Y$JAP_liquidation_wave$§!, который появился в результате сворачивания деятельности."
 JAP_controlled_downsize_TT: "Начинается §Yволна ликвидации§!: фирмы ликвидируются в §Gудвоенном темпе§! по сравнению с программой слияний, ценой §Rсурового национального духа§! до завершения сворачивания"
 JAP_forced_mergers_TT: "Начинается §Yпрограмма слияния§!: дёшево и мягко сейчас, §Rполовина скорости сворачивания§!, и навсегда оставленный след в японской промышленности впоследствии."
 JAP_liquidation_wave: "Волна ликвидаций"
 JAP_liquidation_wave_desc: "Ликвидация идёт полным ходом. Деловые страницы пестрят объявлениями о банкротстве, строительные площадки простаивают, пока ликвидируются их застройщики, безработица резко растёт, и правительству приходится брать кредиты, чтобы смягчить удар. Боль сильная и локализованная, но она временная.\n-------------\nСнимается, как только §YПрогресс корпоративной реструктуризации§! завершит сворачивание деятельности компаний-зомби."
 JAP_fusion_restructuring: "Административные указания"
 JAP_fusion_restructuring_desc: "Министерство проводит границы, а банки предоставляют приданое. Никого не увольняют, никто не признает неудачу, и двум отделам продаж, которые ненавидели друг друга тридцать лет, сообщают, что теперь они — одна компания. Касса с каждым кварталом становится все меньше. Цена — стагнация, а не безработица.\n-------------\nОтменяется после того, как §YПрогресс корпоративной реструктуризации§! завершит поглощение компаний-зомби."
 JAP_consolidated_conglomerates: "Consolidated Japan Inc."
 JAP_consolidated_conglomerates_desc: "Неплатежеспособные компании исчезли из реестра, их поглотили, а не ликвидировали. На их место пришли более крупные группы с дублирующимися заводами, дублирующимися исследовательскими подразделениями и менеджерами, подчиняющимися совету директоров, который выкупил их против их воли. Штат получил национальных лидеров, о которых мечтал. Он также получил промышленную базу, которая внедряет инновации медленнее, чем та, с которой он начинал."
 JAP_zombie_investigation_category: "Расследование «Фирмы-зомби»"
 JAP_zombie_investigation_category_desc: "Аудиторы и прокуроры разбирают бухгалтерию японских неплатёжеспособных заёмщиков, а фирмы с тем же усердием пытаются им помешать.\n\n$JAP_case_files$: [?JAP_zombie_case_files|0] / 14\n$JAP_obstruction$: [?JAP_zombie_obstruction|0] / 100\n\n§YЧто можно сделать§!\nКаждое дело ниже можно довести до суда, тихо спасти или пропустить. Уголовное преследование даёт самые весомые материалы, но сильнее всего портит отношения с §Yпромышленными конгломератами§!, от мнения которых зависит реальное производство. Спасение даёт более скудные материалы за счёт налогоплательщиков. Пропуск не даёт ничего.\n\n§GДоклад§!\nОценивается при закрытии расследования.\n§G10 и более§! материалов: полное разбирательство, ускоряющее сворачивание.\n§GОт 3 до 9§!: частичный доклад.\n§RМенее 3§!: замалчивание, которое стирает собранные материалы и замедляет сворачивание.\n§Y$JAP_controlled_downsize$§! требует 10 и более материалов. §Y$JAP_forced_mergers$§! требует 3 и более. Ни одна из веток не закрывается навсегда, даже если расследование брошено или замято.\n\n§RПротиводействие§!\nРастёт каждый месяц, пока вы продолжаете копать, — тем быстрее, чем злее конгломераты. При §R30§! министерство допускает утечку, при §R55§! деловая федерация выдвигает ультиматум, а при §R80§! расследование приостанавливается из-за скандала. Решения ниже снижают его обратно."
 JAP_zombie_investigation_mission: "Завершить расследование"
 JAP_zombie_investigation_mission_desc: "Расследование не может продолжаться бесконечно. Необходимо подготовить доводы, достойные публикации, прежде чем иссякнет политическая воля."
 JAP_zombie_investigation_mission_TT: "$JAP_case_files$: [?JAP_zombie_case_files|0] / 10"
 JAP_keidanren_ultimatum_mission: "Ультиматум Кейданрена"
 JAP_keidanren_ultimatum_mission_desc: "Бизнес-федерация в максимально вежливой форме сообщила правительству, что расследование подрывает доверие и должно быть прекращено. Нам дали время до конца финансового полугодия, чтобы мы поняли намек."
 JAP_keidanren_ultimatum_TT: "Снизьте $JAP_obstruction$ ниже §Y45§!"
 JAP_case_ltcb_shinsei: "Дело: Опцион пут Shinsei"
 JAP_case_ltcb_shinsei_desc: "Банк долгосрочного кредитования был национализирован, очищен за счет государственных средств и продан иностранной инвестиционной группе за символическую сумму. Контракт предоставлял покупателю право вернуть любой кредит, потерявший пятую часть своей стоимости, обратно в Корпорацию страхования депозитов по балансовой цене. Новые владельцы реализуют это право, и каждый йен убытка ложится на плечи налогоплательщиков. Кто-то в министерстве подписал этот пункт."
 JAP_case_sogo_collapse: "Материалы дела: Крах компании Sogo"
 JAP_case_sogo_collapse_desc: "Сеть универмагов задолжала почти два триллиона иен и уже много лет не получает реальной прибыли. План, лежащий на столе в министерстве, заключается в том, чтобы списать государственную часть долга и позволить компании продолжать работу. Газеты тоже знают об этом плане, и реакция общественности на спасение розничного продавца в то время, когда обычным фирмам отказывают в кредите, оказалась именно такой, какой и следовало ожидать."
 JAP_case_mycal_bankruptcy: "Материалы дела: Mycal"
 JAP_case_mycal_bankruptcy_desc: "Сеть супермаркетов Осаки расширялась во время финансового пузыря на деньги, которые ее основной банк никогда не рассчитывал получить обратно, и с тех пор она провела годы, занимаясь рефинансированием, а не реструктуризацией. В случае банкротства это будет крупнейшее банкротство розничной сети в стране, и оно повлечет за собой крах сети поставщиков в регионе Кансай."
 JAP_case_resona_injection: "Дело: Ресона"
 JAP_case_resona_injection_desc: "Аудиторы отказались подтвердить, какая часть капитала банка состоит из отложенных налоговых активов, то есть будущих прибылей, которые банк не имеет реальных перспектив получить. Без этой фикции банк недокапитализирован. Почти два триллиона иен государственных средств позволили бы ему восстановить капитал и фактически передать его государству. Отказ стал бы первым крупным банкротством банка, допущенным правительством."
 JAP_case_ashikaga_bank: "Дело: Банк Асикага"
 JAP_case_ashikaga_bank_desc: "Это не национальный банк. Это банк Тотиги, где хранятся счета префектурного правительства, большинства местных фирм и множества домохозяйств, которые никогда не пользовались услугами других банков. Кроме того, он неплатежеспособен. Национализация защитит вкладчиков и уничтожит акционеров, и каждый региональный кредитор в стране воспримет это решение как заявление о намерениях."
 JAP_case_daiei_ircj: "Материалы дела: Дайэй"
 JAP_case_daiei_ircj_desc: "Розничная сеть, которая научила Японию ценообразованию со скидками, имеет долги на триллионы долларов и держится на плаву благодаря банкам, которые не могут признать сумму этих кредитов. Корпорация по возрождению промышленности может взять ее под свой контроль, сменить руководство и продать отдельные части. Союзники основателя в партии предпочли бы, чтобы компанию еще раз рефинансировали."
 JAP_case_kanebo_accounts: "Материалы дела: Отчеты Канебо"
 JAP_case_kanebo_accounts_desc: "Группа компаний, занимающаяся производством косметики и текстиля, на протяжении пяти лет сообщала о прибыли, которой она не получала, в размере около двухсот миллиардов иен. Сам факт мошенничества не оспаривается. Спорным является вопрос о том, какая аудиторская фирма подписала каждое из этих заявлений, и может ли страна вести честную бухгалтерскую отчетность, если ее аудиторы несут коммерческую ответственность перед компаниями, которые они проверяют."
 JAP_press_the_prosecutors: "Дайте прокурорам свободу действий"
 JAP_press_the_prosecutors_desc: "Пусть отдел специальных расследований производит аресты, а не передает дела третьим лицам. Ничто так быстро не заглушает лоббистскую кампанию, как выдворение директора из его кабинета людьми с ордером на арест."
 JAP_whistleblower_immunity_decision: "Предоставление иммунитета информаторам"
 JAP_whistleblower_immunity_decision_desc: "Предложите менеджерам среднего звена, выполнившим инструкции, защиту от судебного преследования в обмен на показания против тех, кто их дал. Крупные корпорации назовут это приглашением предать своих коллег. Так оно и есть."
 JAP_publish_inspection_manual_decision: "Опубликовать результаты проверки"
 JAP_publish_inspection_manual_decision_desc: "Опубликуйте полные версии надзорных отчетов, а не их краткое изложение для министерства. Рынкам будет неприятно их читать, но компания не может лоббировать против показателей, которые уже известны всей стране."
 JAP_cooperating_bank_amnesty_decision: "Амнистия для банков-партнеров"
 JAP_cooperating_bank_amnesty_decision_desc: "Предложите любому банку, добровольно открывающему свою финансовую отчетность, гарантию того, что его руководители не будут преследоваться. Это обеспечит спокойствие, но лишит следствия дела, которое оно вело против них."
 JAP_zombie_probe_abandoned_TT: "Расследование §Rпрекращено§! и будет опубликовано как попытка замять дело, стерев все собранные материалы и замедлив процесс завершения расследования."
 JAP_zombie_report_strong_TT: "§GПолная расплата.§! Сворачивание пойдёт §Gна 25% быстрее§!"
 JAP_zombie_report_partial_TT: "§YЧастичный отчёт.§! Завершение процесса будет проходить в обычном темпе."
 JAP_zombie_report_whitewash_TT: "Сворачивание §Rна 25% медленнее§!"
 Japan_economy.06.c: "Отмените всё."
 Japan_economy.08.b: "Опубликуйте то, что у нас есть."
 Japan_economy.08.c: "Опубликуйте это и надейтесь, что никто не прочитает дальше аннотации."
 Japan_economy.09.b: "Найдите его и покажите ему пример."
 Japan_economy.23.b: "Пересмотрите условия договора в спокойной обстановке и выкупите пункт, предусматривающий досрочное расторжение."
 Japan_economy.23.c: "Сделка завершена. Пусть так и останется."
 Japan_economy.24.b: "Уберите это из заголовков и переформулируйте."
 Japan_economy.24.c: "Простите долг и двигайтесь дальше."
 Japan_economy.25.b: "Организовать упорядоченную распродажу прибыльных магазинов."
 Japan_economy.25.c: "Опирайтесь на банк еще один год"
 Japan_economy.26.b: "Вложите средства и оставьте управление на месте."
 Japan_economy.26.c: "Пусть аудиторы убедятся в этом."
 Japan_economy.27.b: "Провести рекапитализацию и оставить компанию в частных руках."
 Japan_economy.27.c: "Пусть префектура организует слияние для спасения."
 Japan_economy.28.b: "Поддержать реструктуризацию путем переговоров."
 Japan_economy.28.c: "Предоставить рефинансирование"
 Japan_economy.29.b: "Исключить компанию из биржевого списка и позволить аудиторам урегулировать вопрос."
 Japan_economy.29.c: "Рассматривайте это как единичный случай неудачи."
 Japan_economy.33.t: "Расследование возобновляется."
 Japan_economy.33.d: "В ходе проверки было установлено то, что обычно устанавливают подобные проверки. Назначен новый руководитель, материалы возвращены, и расследование возобновляется, хотя и с гораздо большими трудностями, чем раньше. У фирм было шесть месяцев на подготовку, и они их использовали."
 Japan_economy.33.a: "Начнём сначала."
 Japan_economy.34.t: "Касса чистая."
 Japan_economy.34.d: "Последние неплатежеспособные заемщики были ликвидированы. На это ушли годы, и цена была заплачена банкротствами, безработицей и правительством, которое потратило большую часть своего политического капитала на то, чтобы настаивать на необходимости этих мер. В результате осталась экономика, где кредиты предоставляются фирмам, способным их погасить, и где балансовый отчет означает то, что он говорит."
 Japan_economy.34.a: "Цена полностью оправдала себя."
 Japan_economy.35.t: "Ничто не подвело"
 Japan_economy.35.d: "Названия неплатежеспособных компаний исчезли из реестра. Ни одна из них не обанкротилась. По решению министерства они были поглощены более крупными группами, и теперь эти более крупные группы включают в себя дублирующие заводы, дублирующие лаборатории и персонал, которому в пятницу сообщили, что в понедельник он будет работать на конкурента. Ни одно рабочее место не было потеряно, и ничего не было упразднено. Промышленность Японии консолидирована, стабильна и работает медленнее, чем раньше."
 Japan_economy.35.a: "Договоренность была соблюдена."
 JAP_electronics_resilience_complete_TT: "§YElectronics Resilience§! соответствует §G5§! или выше (в настоящее время [?JAP_electronics_resilience|Y0])"
 JAP_electronics_war_won_tt: "§Y$JAP_model_competition$§! навсегда прекращает своё существование и больше не сможет вернуться, что бы ни предприняли дальше Сеул, Тайбэй и Шанхай."
 JAP_seismic_retrofitting: "Национальная программа сейсмической модернизации"
 JAP_seismic_retrofitting_desc: "Закон о строительных стандартах 1981 года устанавливает нижний, а не верхний предел, и две трети жилого фонда были построены до его принятия. Национальная программа модернизации действует по всей стране регион за регионом, финансируя сейсмоизоляцию больниц и городских администраций, несущие стены и обшивку колонн для школ, а также стальные распорки для эстакад, которые так эффектно обрушились в Кобе. Строительство замедляется и удорожается там, где работают инспекторы, но модернизированный регион переживает сильные землетрясения, сохраняя свою инфраструктуру в целости."
 JAP_news.04.t: "Япония намерена отказаться от статьи 9."
 JAP_news.04.d: "Парламент получил заключительный доклад Комитета по переходному периоду в обороне, и вместе с ним Япония сделала решающий шаг, отказавшись от статьи 9 своей послевоенной конституции. На протяжении десятилетий положение, запрещающее войну и поддержание военного потенциала, регулировалось путем последовательных переинтерпретаций, а не поправок: Силы самообороны были объявлены конституционными как минимально необходимая боеспособность, зарубежные развертывания оправдывались как восстановление и материально-техническое обеспечение, а запрет на коллективную самооборону сужался до тех пор, пока корабли и самолеты союзников не могли быть защищены в ограниченном наборе условий. Вывод комитета заключается в том, что этот накопленный свод интерпретаций больше не может охватывать потребности Японии в области безопасности, и что это ограничение следует отменить, а не переформулировать заново.\n\nПрактические последствия очевидны. Ограничения на численность и состав японских формирований снимаются, Силы самообороны могут свободно планировать операции, выходящие за рамки защиты родных островов, и Токио возвращает себе суверенные инструменты войны и лидерства в союзе, которые все остальные крупные державы считают само собой разумеющимися. Японские официальные лица подчеркивали преемственность, описывая изменения как формальное признание прав нормальной страны, а не как разрыв с семидесятилетней политикой сдержанности. В Пекине, Сеуле и Пхеньяне трактовка совершенно иная, и Вашингтон теперь оказался в союзе с партнером, способным на гораздо большее, чем просто доступ к базам и поддержка тыловых районов. Какую бы интерпретацию ни предстояло принять, архитектура безопасности Восточной Азии была переписана за один день в парламенте."
 JAP_news.04.a: "Эпоха пацифизма в Токио закончилась."
 JAP_seismic_retrofit: "Сейсмическая модернизация"
 JAP_seismic_retrofit_desc: "Каждое сооружение в этом регионе обследовано, укреплено или перестроено так, чтобы выдержать сильное землетрясение. Больницы стоят на сейсмоизоляторах, старые школы укреплены обоймами или снесены, а опоры скоростных дорог охвачены стальными бандажами. Более строгие нормы, обязательные проверки и более тяжёлые фундаменты замедляют каждый новый проект, но следующий толчок обойдётся региону парой дорог — и не более."
 JAP_seismic_retrofit_category: "Сейсмическая модернизация"
 JAP_seismic_retrofit_category_desc: "Сейсмоукрепление региона — растянутая на десятилетие работа гражданских инженеров, префектура за префектурой и здание за зданием. Укреплённый регион по-прежнему трясёт, но при толчке он теряет лишь часть инфраструктуры, а заводы и базы выстаивают; платой за это становится постоянное замедление строительства из-за более строгих норм. Сейсмоукрепление всех сейсмоопасных регионов — одно из двух условий снятия духа §Y$JAP_ring_of_fire$§!."
 JAP_seismic_retrofit_decision: "Модернизация [FROM.GetName]"
 JAP_seismic_retrofit_decision_desc: "Обследовать каждое сооружение в регионе и привести его к современным сейсмическим нормам. Год работы и значительная доля национального производства в обмен на куда меньший ущерб от землетрясений и постоянный штраф к скорости местного строительства."
 JAP_zombie_companies_1: "Компании-зомби"
 JAP_zombie_companies_1_desc: "Годы снисходительности позволили убыточным, чрезмерно задолженным фирмам выжить за счет дешевых кредитов, связывая капитал, рабочую силу и менеджмент, которые необходимы более здоровым отраслям. Никто не списал убытки, никто не закрыл завод, и никто не может сказать, насколько банковская система является фикцией.\n-------------\nПри §YПрогрессе корпоративной реструктуризации§! §G30§! вы можете принять §Y$JAP_restructure_next_tranche$§!, чтобы ослабить этот национальный дух на один шаг. См. §Y$JAP_corporate_reform_category$§! для получения текущих данных."
 JAP_zombie_companies_2: "Компании-зомби: Завершение деятельности"
 JAP_zombie_companies_2_desc: "Первый транш завершен. Кредиты списаны, а не продлены, дела самых неплатежеспособных компаний завершены в судах, и капитал, который оставался невостребованным в течение десятилетия, снова начинает двигаться. Осталось больше, лучше налажены связи и гораздо сложнее поддаться влиянию.\n-------------\nПри §YПрогрессе корпоративной реструктуризации§! §G60§! вы можете принять §Y$JAP_restructure_next_tranche$§!, чтобы ослабить этот национальный дух ещё на один шаг. См. §Y$JAP_corporate_reform_category$§! для получения текущих данных."
 JAP_zombie_companies_3: "Компании-зомби: Последние бухгалтерские книги"
 JAP_zombie_companies_3_desc: "Остались открытыми только последние бухгалтерские книги. Оставшиеся фирмы обладают наиболее глубокими банковскими связями и наибольшей политической поддержкой, и каждая из них рассчитывает пережить правительство, которое пришло к ним. Влияние на экономику в целом сейчас незначительно, но оно еще не исчезло.\n-------------\nПри §YПрогрессе корпоративной реструктуризации§! §G85§! фокус на завершении выбранного вами пути §Gустраняет§! этот национальный дух навсегда. См. §Y$JAP_corporate_reform_category$§! для получения текущих данных."
 JAP_saburoku_audit_campaign: "Провести аудит соглашений Сабуроку"
 JAP_saburoku_audit_campaign_desc: "Статья 36 Закона о трудовых стандартах позволяет фирме превышать установленный законом восьмичасовой рабочий день, заключив соглашение с представителем работников, и на протяжении десятилетий потолок, прописанный в этих соглашениях, ограничивался тем, что работодатель считал нужным написать. Теперь инспекторы изучают эти документы и сопоставляют их с записями о посещаемости, журналами учета пропусков и данными о доступе в здание, а Закон о реформе стиля работы предоставляет им конкретную цифру для сравнения: сорок пять часов в месяц, триста шестьдесят в год."
 JAP_paid_leave_enforcement_campaign: "Обеспечить соблюдение пятидневного срока"
 JAP_paid_leave_enforcement_campaign_desc: "В Японии работникам предоставлялся ежегодный отпуск, но они им не пользовались, потому что его использование выделяло их из общей массы. С 2019 года обязанность изменилась: работодатель, у сотрудников которого десять и более дней отпуска, должен обеспечить фактическое использование пяти из них и самостоятельно указать даты, если работник отказывается это сделать. Министерство проверяет учет отпусков и штрафует фирмы, в бухгалтерской отчетности которых указаны неиспользованные дни отпуска."
 JAP_equal_pay_audit_campaign: "Проверка разрыва в оплате труда"
 JAP_equal_pay_audit_campaign_desc: "Четыре из десяти японских работников являются внештатными, выполняя одну и ту же работу рядом с постоянным коллегой примерно за шестьдесят процентов от заработной платы и без бонусов. Закон о неполной занятости и срочных трудовых договорах обязывает работодателя по запросу в письменной форме объяснять любые различия в обращении, а эти объяснения должны собираться и сравниваться в рамках отрасли, а не оставаться без внимания внутри одной компании."
 JAP_inspector_sweep_campaign: "Вывести из игры самых злостных нарушителей"
 JAP_inspector_sweep_campaign_desc: "Инспекция по соблюдению трудовых стандартов выбирает отрасль, прибывает без предупреждения и проверяет табели учета рабочего времени каждой фирмы в ней. Министерство публикует названия компаний, уличенных в серьезных нарушениях, что обходится рекрутеру гораздо дороже, чем штраф, поскольку выпускник, ознакомившийся со списком, не подает заявку на работу."
 JAP_keidanren_review_campaign: "Проверьте соответствие Уставу"
 JAP_keidanren_review_campaign_desc: "Хартия корпоративного поведения Keidanren обязывает своих членов к соблюдению рабочих процедур, которые большинство из них не проверяют и никто из которых не публикует. Федерацию убеждают проводить цикл проверки соблюдения требований с предоставлением реальных отчетов по каждому члену и отчитываться о сводных результатах перед министерством. Ничто не является обязательным и ничто не регламентируется, именно поэтому группы предприятий с этим согласны."
 JAP_shunto_wage_round_campaign: "Поддержите весеннее наступление за повышение заработной платы"
 JAP_shunto_wage_round_campaign_desc: "Каждую весну филиалы Ренго называли работодателям определенную сумму, а работодатели отвечали меньшей, и в течение двух десятилетий базовая составляющая этого соглашения была равна нулю. Правительство оказывает давление на группы предприятий, чтобы те согласились на реальное повышение заработной платы, потому что работник, получающий достаточную зарплату для жизни, перестает брать сверхурочные, которые его разоряют, и сочетает это давление с налоговыми льготами для фирм, которые первыми предпримут шаги в этом направлении."
 JAP_health_stock_listing_campaign: "Развернуть список услуг по управлению здоровьем"
 JAP_health_stock_listing_campaign_desc: "Министерство и Токийская фондовая биржа ежегодно совместно называют несколько компаний, акции которых котируются на бирже, «Акциями здоровья и производительности», исходя из теории, что компания, которая не истощает своих сотрудников, является более выгодным долгосрочным вложением. Расширение выбора и публикация оценок превращают здоровье на рабочем месте в инструмент, который может оценить управляющий фондом, и который доходит до советов директоров, недоступных для инспектора труда."
 JAP_shift_rotation_campaign: "Субсидируйте утреннюю смену"
 JAP_shift_rotation_campaign_desc: "Перенесите рабочий день на более раннее время, платите дополнительную плату за ранние часы вместо поздних и отключайте электричество вечером, чтобы оставаться на работе было невозможно. Компания Itochu так и сделала, и обнаружила, что ее производительность труда выросла, а вместе с ней и рождаемость; теперь государство частично оплачивает переходные расходы для любой фирмы, желающей последовать их примеру."
 JAP_overcome_the_slump: "Продолжайте восстановление"
 JAP_overcome_the_slump_desc: "Уже принятые меры достаточно существенно изменили ситуацию, чтобы их стоило консолидировать. Поддержка, заявленная как временная, заложена в базовый бюджет, министерства перестают рассматривать спад как рабочее предположение, а компаниям прямо сообщают, что спрос, как ожидается, сохранится. Каждый шаг смягчает §Y$JAP_entrenched_demand_shortfall_idea_1$§! на один уровень; взятый в конце, он окончательно завершает затяжной спад."
 JAP_demand_recovery_progress_tier_1_TT: "§YПрогресс восстановления спроса§! составляет как минимум §G30§!"
 JAP_demand_recovery_progress_tier_2_TT: "§YПрогресс восстановления спроса§! составляет как минимум §G60§!"
 JAP_demand_recovery_progress_complete_TT: "§YПрогресс восстановления спроса§! составляет как минимум §G85§!"
 JAP_demand_shortfall_resolved: "§YСпад спроса§! в Японии преодолён."
 JAP_restructure_next_tranche: "Рассмотреть следующий транш"
 JAP_restructure_next_tranche_desc: "Достаточная часть реестра уже обработана, чтобы окончательно закрыть его часть. Регулятор публикует урегулированные дела, банки фиксируют убытки, которые они откладывали, а компании в этой группе либо выходят из кризиса, либо прекращают свое существование. Каждый транш смягчает §Y$JAP_zombie_companies$§! на один шаг; окончательное разрешение приходит вместе с фокусом в конце выбранного вами пути."
 JAP_enforce_next_reforms: "Внедрить следующие реформы"
 JAP_enforce_next_reforms_desc: "Уже существующие меры вводятся в действие, а не остаются лишь запланированными. Рекомендованные ранее ограничения становятся обязательными к исполнению, исключения, предусмотренные для крупнейших работодателей, сужаются, а инспекции выделяются сотрудники для проверки выявленных нарушений. Каждый раунд смягчает §Y$JAP_karoshi_crisis$§! на один шаг; в конце выбранного вами пути кризис снимается фокусом навсегда."
 JAP_galapagos_drift_review_mission: "Разрыв в стандартах"
 JAP_galapagos_drift_review_mission_desc: "Министерство экономики, торговли и промышленности постоянно оценивает, насколько японские спецификации отклонились от спецификаций, используемых его клиентами, и публикует данные каждые тридцать дней. Каждый отчет хуже предыдущего, потому что расхождение увеличивается, в то время как ничего не предпринимается, а органы по сертификации продолжают ставить на первое место пункт о внутреннем рынке. Чем ниже значение §YОткрытость§!, тем быстрее увеличивается разрыв; на уровне §G100§! он полностью прекращается.\n-------------\nОценка завершается окончательно, когда Япония достигает §G85§! §YОткрытость§! на пути §Y$JAP_world_integration$§!. Ничто другое не может положить этому конец."
 JAP_galapagos_cure_condition_TT: "§YОткрытость§! имеет значение §G85§! или выше (в настоящее время [?JAP_galapagos_openness|Y0]), что приводит к растворению §Y$JAP_galapagos_syndrome$§!"
 JAP_cool_japan_sphere_count_mission: "Ежеквартальный подсчет сфер"
 JAP_cool_japan_sphere_count_mission_desc: "Раз в квартал Управление по продвижению креативных индустрий подсчитывает количество стран, где японское влияние составляет двадцать процентов или выше, и публикует эти данные в качестве экспортной статистики. Торговые делегации планируют следующий квартал, исходя из этого списка, а компании, следующие за ними за границу, планируют свою деятельность, исходя из результатов работы делегаций. Сфера, рост которой прекращается, перестает приносить прибыль, и подсчет — единственное место, которое показывает рост до того, как станет известна выручка."
 JAP_cool_japan_sphere_count_step_tt: "§YКультурная сфера§!: [?JAP_galapagos_sphere_count|Y0] стран, оказывающих §G20%§! японское влияние или более по последним подсчетам. Каждая из них стоит §G+1%§! §Yиностранное влияние§! и §G+0,2%§! §Yвозврат инвестиций§!, увеличенный вдвое с §Y$JAP_electronics_superpower$§! и еще на четверть с §Y$JAP_home_electronics$§!."
 JAP_zombie_companies_resolved: "Япония §Yкомпании-зомби§! полностью свернуты"
 JAP_corporate_restructuring_complete_TT: "§YПрогресс корпоративной реструктуризации§! составляет не менее §G85§!"
 JAP_restructure_tranche_1_TT: "§YПрогресс корпоративной реструктуризации§! составляет не менее §G30§!"
 JAP_restructure_tranche_2_TT: "§YПрогресс корпоративной реструктуризации§! составляет не менее §G60§!"
