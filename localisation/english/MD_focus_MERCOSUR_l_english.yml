 MER_CHL_tariff_alignment: "Tariff Alignment for Chile"
 MER_CHL_tariff_alignment_desc: "Finance the tariff review and administrative coordination needed to align Chile more closely with the bloc's customs regime."
 MER_CHL_customs_system_modernization: "Customs System Modernization for Chile"
 MER_CHL_customs_system_modernization_desc: "Provide the funding and technical support needed to modernize Chile's customs administration for full MERCOSUR accession."
 MER_CHL_common_standards: "Support the Adoption of Common Standards in Chile"
 MER_CHL_common_standards_desc: "Support the final regulatory and technical work needed for Chile to adopt MERCOSUR common standards."
 MER_COL_tariff_alignment: "Tariff Alignment for Colombia"
 MER_COL_tariff_alignment_desc: "Finance the tariff review and administrative coordination needed to align Colombia more closely with the bloc's customs regime."
 MER_COL_customs_system_modernization: "Customs System Modernization for Colombia"
 MER_COL_customs_system_modernization_desc: "Provide the funding and technical support needed to modernize Colombia's customs administration for full MERCOSUR accession."
 MER_COL_common_standards: "Support the Adoption of Common Standards in Colombia"
 MER_COL_common_standards_desc: "Support the final regulatory and technical work needed for Colombia to adopt MERCOSUR common standards."
 MER_VEN_tariff_alignment: "Tariff Alignment for Venezuela"
 MER_VEN_tariff_alignment_desc: "Finance the tariff review and administrative coordination needed to align Venezuela more closely with the bloc's customs regime."
 MER_VEN_customs_system_modernization: "Customs System Modernization for Venezuela"
 MER_VEN_customs_system_modernization_desc: "Provide the funding and technical support needed to modernize Venezuela's customs administration for full MERCOSUR accession."
 MER_VEN_common_standards: "Support the Adoption of Common Standards in Venezuela"
 MER_VEN_common_standards_desc: "Support the final regulatory and technical work needed for Venezuela to adopt MERCOSUR common standards."
 MER_PRU_logistics_corridor: "Develop a Logistics Corridor for Peru"
 MER_PRU_logistics_corridor_desc: "Fund the first stage of a logistics corridor in Peru's capital to prepare the country for deeper integration with MERCOSUR."
 MER_PRU_cross_border_transport: "Improve Cross-Border Transport with Peru"
 MER_PRU_cross_border_transport_desc: "Expand overland transport links with Peru and strengthen the infrastructure needed for accession."
 MER_PRU_port_connectivity: "Strengthen Port Connectivity for Peru"
 MER_PRU_port_connectivity_desc: "Invest in digital and logistics connectivity for Peru's capital to support a more integrated regional market."
 MER_BOL_logistics_corridor: "Develop a Logistics Corridor for Bolivia"
 MER_BOL_logistics_corridor_desc: "Fund the first stage of a logistics corridor in Bolivia's capital to prepare the country for deeper integration with MERCOSUR."
 MER_BOL_overland_transport: "Expand Overland Transport Networks for Bolivia"
 MER_BOL_overland_transport_desc: "Back new overland transport upgrades in Bolivia's capital to make accession materially visible."
 MER_BOL_border_connectivity: "Improve Border Connectivity for Bolivia"
 MER_BOL_border_connectivity_desc: "Invest in digital and logistical border connectivity in Bolivia as part of its accession package."
 MER_PAN_logistics_corridor: "Develop a Logistics Corridor for Panama"
 MER_PAN_logistics_corridor_desc: "Fund the groundwork for a logistics corridor in Panama's capital so that accession produces immediate transport gains."
 MER_PAN_port_transport: "Strengthen Port Transport for Panama"
 MER_PAN_port_transport_desc: "Support port-facing transport upgrades in Panama to improve the movement of goods between MERCOSUR markets."
 MER_PAN_trade_connectivity: "Improve Trade Connectivity for Panama"
 MER_PAN_trade_connectivity_desc: "Invest in commercial and digital connectivity in Panama as the final step in its accession package."
 MER_ECU_development_funds: "Contribute Development Funds for Ecuador"
 MER_ECU_development_funds_desc: "Release a treasury-backed development package for Ecuador to demonstrate the economic value of full accession."
 MER_ECU_civilian_industry: "Invest in Civilian Industry for Ecuador"
 MER_ECU_civilian_industry_desc: "Sponsor a new civilian investment project in Ecuador's capital as part of its path to full membership."
 MER_ECU_infrastructure_development: "Support Infrastructure Development in Ecuador"
 MER_ECU_infrastructure_development_desc: "Back a targeted infrastructure improvement in Ecuador's capital to strengthen its readiness for accession."
 MER_GUY_development_funds: "Contribute Development Funds for Guyana"
 MER_GUY_development_funds_desc: "Release a treasury-backed development package for Guyana to demonstrate the economic value of full accession."
 MER_GUY_civilian_industry: "Invest in Civilian Industry for Guyana"
 MER_GUY_civilian_industry_desc: "Sponsor a new civilian investment project in Guyana's capital as part of its path to full membership."
 MER_GUY_infrastructure_development: "Support Infrastructure Development in Guyana"
 MER_GUY_infrastructure_development_desc: "Back a targeted infrastructure improvement in Guyana's capital to strengthen its readiness for accession."
 MER_SUR_development_funds: "Contribute Development Funds for Suriname"
 MER_SUR_development_funds_desc: "Release a treasury-backed development package for Suriname to demonstrate the economic value of full accession."
 MER_SUR_civilian_industry: "Invest in Civilian Industry for Suriname"
 MER_SUR_civilian_industry_desc: "Sponsor a new civilian investment project in Suriname's capital as part of its path to full membership."
 MER_SUR_commercial_infrastructure: "Develop Commercial Infrastructure in Suriname"
 MER_SUR_commercial_infrastructure_desc: "Expand commercial infrastructure in Suriname's capital so that accession produces visible economic gains."
 MER_MEX_industrial_investment_agreement: "Industrial Investment Agreement with Mexico"
 MER_MEX_industrial_investment_agreement_desc: "Fund the industrial pillar of Mexico's accession package through a major investment agreement centered on its capital."
 MER_MEX_commercial_investment_framework: "Commercial Investment Framework with Mexico"
 MER_MEX_commercial_investment_framework_desc: "Establish a broader commercial investment framework with Mexico, strengthening the institutional and economic base for full membership."
 MER_MEX_financial_cooperation_package: "Financial Cooperation Package for Mexico"
 MER_MEX_financial_cooperation_package_desc: "Deliver the final financial cooperation package for Mexico, combining commercial and digital investment before accession is completed."
 MER_launch_corridor_investment_round: "Launch a MERCOSUR Corridor Investment Round"
 MER_launch_corridor_investment_round_desc: "A stronger bloc cannot exist only on paper. By releasing a new round of treasury-backed corridor funding, we can accelerate infrastructure and network integration across the current full members of MERCOSUR, improving the physical backbone of the bloc."
 MER_release_development_fund_round: "Release a MERCOSUR Development Fund Round"
 MER_release_development_fund_round_desc: "Promises of integration are more convincing when backed by visible investment. By disbursing a new round from the MERCOSUR Development Fund, we can accelerate civilian construction and office expansion across the bloc, strengthening the economic foundations of its full members."

 mercosur.02.t: "Invitation to Join MERCOSUR as an Associate State"
 mercosur.02.d: "[FROM.GetName] has approached us with a proposal to join MERCOSUR as an associate state. Accepting would deepen our integration with the South American bloc without yet committing us to full membership."
