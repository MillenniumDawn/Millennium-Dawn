 steel_production_bonus: "Bonus de production d'acier"
 SWE_idea_overhalling_our_university_system: "Surenchère du système universitaire"
 generic_bureaucratic_drain_idea: "Drainage bureaucratique"
 generic_bureaucratic_drain_idea_desc: "Recent actions have taken a toll on our bureaucracy and has now become a drain. Although, this is usually temporary it could cause more issues later down the line..."
 USA_homeland_security: "Homeland Security"
 USA_homeland_security_desc: "Homeland Security is a US national security umbrella term for various reorganised US civil agencies. The main purpose of Homeland Security is to act in the likes of a ministry of interior that many other countries have."
 USA_guantanamo_bay: "Guantanamo Bay"
 USA_guantanamo_bay_desc: "Le camp de détention de Guantanamo Bay est une prison militaire des États-Unis située dans la base navale de Guantanamo Bay, également appelée Guantánamo, G-Bay, GTMO et Gitmo, qui se trouve sur la côte de la baie de Guantanamo à Cuba. Étant donné que les détenus sont incarcérés pour une durée indéterminée sans procès et que, selon certaines informations, plusieurs d'entre eux ont été torturés, les opérations de ce camp sont considérées comme une violation majeure des droits de l'homme par Amnesty International et du droit à une procédure régulière prévu par le quatorzième amendement de la Constitution des États-Unis."
 land_of_the_free: "Le pays de la liberté"
 land_of_the_free_desc: "Les États-Unis sont un phare de liberté et de démocratie pour le monde entier."
 USA_usaid: "USAID"
 USA_usaid_desc: "L'Agence des États-Unis pour le développement international (USAID) est une agence indépendante du gouvernement fédéral des États-Unis qui est principalement chargée de gérer l'aide civile à l'étranger et l'aide au développement. Avec un budget de plus de 27 milliards de dollars, l'USAID est l'une des plus grandes agences d'aide officielle au monde et représente plus de la moitié de toute l'aide étrangère des États-Unis (qui, en dollars absolus, est la plus élevée au monde).\n\n§RCette idée sera annulée dans les conditions suivantes.§!\nNous sommes en guerre avec §Y[USA.GetFlag] [USA.GetNameDef]§! ou un §Yallié [USA.GetFlag] [USA.GetAdjMS]§!, notre §YPIB/hab§! est supérieur à §Y25k§!, ou si nous avons généré plus de 10% de tension mondiale."
 USA_usaid_idea_tt: "Revenu supplémentaire: §G0.004§!$$ par 10 millions d'habitants"
 USA_usaid_idea_2_tt: "Lorsqu'il est influencé par §Y[USA.GetFlag] [USA.GetNameDef]§!, le $foreign_influence_defense_modifier$ §Y[THIS.GetFlag] [THIS.GetAdjMS]§! est §Rdiminué§! de §R5%§!\n"
 worker_strikes_1: "Grèves de travailleurs"
 worker_strikes_1_desc: "Il y a une certaine agitation parmi la main-d'œuvre de ce pays."
 worker_strikes_2: "Grèves de travailleurs considérables"
 worker_strikes_2_desc: "Les bus, les trains, les avions et les taxis ne circulent pas beaucoup dans ce pays. Seules quelques usines fonctionnent. La main-d'œuvre est mécontente."
 worker_strikes_3: "Grèves de travailleurs majeures"
 worker_strikes_3_desc: "Il y a des situations où les gens ne veulent pas travailler pour faire un acte politique. Il y a actuellement un acte politique majeur dans ce pays."
 worker_strikes_4: "Grèves de travailleurs désastreuses"
 worker_strikes_4_desc: "L'économie nationale est au bord de l'effondrement. Le gouvernement ne semble pas être en mesure de faire travailler son peuple."
 full_control_of_suez: "Autorité du canal de Suez"
 full_control_of_suez_desc: "Le canal de Suez est contrôlé et exploité par l'Autorité du canal de Suez. Les recettes de l'Autorité, rien que pour les péages, s'élèvent à 5 milliards de dollars par an. Bien que le canal de Suez soit, en vertu des traités internationaux, ouvert aux navires civils et militaires, il peut facilement être utilisé pour contrôler la navigation entre l'Asie et l'Europe."
 full_control_of_suez_idea_TT: "Additional Income: $$§G[?additional_income_suez|+3]§!, scaling with world GDP"
 partial_control_of_suez: "Autorité du canal de Suez - Propriété partagée"
 partial_control_of_suez_desc: "Le canal de Suez est contrôlé et exploité par l'Autorité du canal de Suez. Les recettes de l'Autorité, rien que pour les péages, s'élèvent à 5 milliards de dollars par an. Bien que le canal de Suez soit, en vertu des traités internationaux, ouvert aux navires civils et militaires, il peut facilement être utilisé pour contrôler la navigation entre l'Asie et l'Europe. Le canal de Suez est actuellement sous l'autorité conjointe de deux pays."
 partial_control_of_suez_idea_TT: "Additional Income: $$§G[?additional_income_suez_partial|+3]§!, scaling with world GDP"
 entry_to_china: "La porte de la Chine"
 entry_to_china_desc: "Hong Kong a une relation unique entre le continent et l'Occident. Sa récente rétrocession du Royaume-Uni a entraîné des coutumes et des pratiques commerciales occidentales. Avant les réformes de Deng, Hong Kong était le seul endroit en Chine où les investissements extérieurs pouvaient entrer.\n\nAujourd'hui, un changement s'opère et Hong Kong risque de perdre la position unique qu'elle occupait autrefois. Pourtant, le marché boursier de Hong Kong fait l'envie de nombreuses autres places asiatiques."
 full_control_of_panama: "Autorité du canal de Panama"
 full_control_of_panama_desc: "The PCA (Autoridad del Canal de Panamá) is the agency of the government of Panama responsible for the operation and management of the Panama Canal. Through fees and other operations the state has access to a steady income. Its strategic importance can also not be underestimated."
 full_control_of_panama_tt: "Additional Income: $$§G[?additional_income_panama|+3]§!, scaling with world GDP"
 asian_tigers_legacy: "L'héritage des quatre tigres asiatiques"
 asian_tigers_legacy_desc: "Les quatre économies de la Corée du Sud, de Taïwan, de Singapour et de Hong Kong ont connu une croissance sans précédent dans la dernière partie du siècle dernier. Grâce à une combinaison d'interventions du marché et de l'État, leurs entreprises ont créé des économies qui progressent rapidement.\n\nLeurs jours de gloire ont été écourtés dans le sillage de la crise financière asiatique de 1997. Contrairement aux autres pays touchés, leurs économies sont encore relativement productives."
 asian_crisis: "Crise financière asiatique de 1997"
 asian_crisis_desc: "The economic crisis that gripped developing East and Southeast Asia threw decades of growth down the drain. The Loss of confidence in the national currencies still plagues the central banks to this day. Public and private debt has also skyrocketed.\n\nPainful lessons were learned, past unwanted economic reforms are in full swing. Each country was hit differently and each has its own solutions.\n\nThe influx of investments to the affected countries was once half of the total sum in the world, but now it goes to [CHI.GetFlag]China and elsewhere."
 int_investment_china: "Investissements internationaux massifs"
 int_investment_china_desc: "Après la crise économique asiatique, les investisseurs ont choisi de détourner leurs investissements vers d'autres marchés, et principalement vers le nôtre.\n§W--------------§!\nCet esprit national sera §Rretiré§! si nous sommes en §Hguerre§!."
 mp_optimization_idea: "Optimisation MP de l'IA"
 mp_optimization_idea_desc: "Empêche l'IA de faire des choses bizarres."
 low_level_of_aids: "Prévalence faible du VIH"
 low_level_of_aids_desc: "Entre 5 et 10% de la population de ce pays ont contracté le VIH. Cette maladie mortelle a un impact considérable sur les personnes qui en souffrent, car elle les empêche finalement de travailler ou de mener une vie normale. La lutte contre le VIH est un processus lent, et le seul véritable outil est un système de soins de santé cohérent et de haute qualité pour réduire la souffrance des gens et les éduquer afin de réduire le risque de contracter la maladie.\n\n[HIV_healthcare_tooltip]"
 rising_level_of_aids: "Prévalence croissante du VIH"
 rising_level_of_aids_desc: "Entre 10 et 15% de la population de ce pays ont contracté le VIH. Cette maladie mortelle a un impact considérable sur les personnes qui en souffrent, car elle les empêche finalement de travailler ou de mener une vie normale. La lutte contre le VIH est un processus lent, et le seul véritable outil est un système de soins de santé cohérent et de haute qualité pour réduire la souffrance des gens et les éduquer afin de réduire le risque de contracter la maladie.\n\n[HIV_healthcare_tooltip]"
 high_level_of_aids: "Prévalence élevée du VIH"
 high_level_of_aids_desc: "Entre 15 et 20% de la population de ce pays ont contracté le VIH. Cette maladie mortelle a un impact considérable sur les personnes qui en souffrent, car elle les empêche finalement de travailler ou de mener une vie normale. La lutte contre le VIH est un processus lent, et le seul véritable outil est un système de soins de santé cohérent et de haute qualité pour réduire la souffrance des gens et les éduquer afin de réduire le risque de contracter la maladie.\n\n[HIV_healthcare_tooltip]."
 very_high_level_of_aids: "Prévalence très élevée du VIH"
 very_high_level_of_aids_desc: "Entre 20 et 25% de la population de ce pays ont contracté le VIH. Cette maladie mortelle a un impact considérable sur les personnes qui en souffrent, car elle les empêche finalement de travailler ou de mener une vie normale. La lutte contre le VIH est un processus lent, et le seul véritable outil est un système de soins de santé cohérent et de haute qualité pour réduire la souffrance des gens et les éduquer afin de réduire le risque de contracter la maladie.\n\n[HIV_healthcare_tooltip]"
 critical_level_of_aids: "Prévalence critique du VIH"
 critical_level_of_aids_desc: "Entre 20 et 25% de la population de ce pays ont contracté le VIH. Cette maladie mortelle a un impact considérable sur les personnes qui en souffrent, car elle les empêche finalement de travailler ou de mener une vie normale. La lutte contre le VIH est un processus lent, et le seul véritable outil est un système de soins de santé cohérent et de haute qualité pour réduire la souffrance des gens et les éduquer afin de réduire le risque de contracter la maladie.\n\n[HIV_healthcare_tooltip]"
 HIV_healthcare_tooltip_01: "Chaque année, nous ferons le point sur la situation du VIH dans notre pays. Plus notre §Ybudget de la santé§! est élevé, plus il y a de chances que la situation s'améliore.\n\nNotre estimation actuelle:\n§Y50%§!: §Rla situation s'aggrave§!\n§Y50%§!: §Wla situation reste la même§!\n§Y0%§!: §Gla situation s'améliore§!"
