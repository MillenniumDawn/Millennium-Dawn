 ukr_modernize_sov_equipment_t55_reactivation_program: "보관 중인 §YT-54/T-55§! 부대 재가동"
 ukr_modernize_sov_equipment_t55_reactivation_program_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_t55_museum_for_tooltip\n\n\n\n\n\n\n\n\n§W§R소련§!군에서 물려받은 수백 대의 §YT-54§!와 §YT-55§! 전차가 우리 보관 기지에서 §R녹슬고§! 있습니다.\n§YKMDB§!와 §Y하르키우 장갑차량 공장§!이 차체를 조사해 이 전차들을 §G다시 현역으로 되돌릴§! 방법을 제안할 수 있습니다.\n------------------\n이 결정은 우리 §YT-54/T-55§! 현대화, 조달, 수출 계획의 §R전제 조건§!이며, §Y2005§!년까지만 선택할 수 있습니다. 이를 §R건너뛰면§! 해당 차체는 §R계속 보관 상태로 남습니다§!. §Y[EGY.GetNameWithFlag]§!을(를) 위한 §YT-62-5TDF§!는 여전히 독자 개발할 수 있지만, 비용은 더 들고 개발 기간도 더 깁니다.§!\n\n$UKR_rada_modernization_adoption_tt$"
 ukr_modernize_sov_equipment_t55_modernization_stop_tt: "\n§R더 이상 §YT-55§! 현대화를 발주할 수 없습니다.§! 이미 개발한 모델은 조달용으로 §G계속 사용할 수 있습니다§!.\n "
