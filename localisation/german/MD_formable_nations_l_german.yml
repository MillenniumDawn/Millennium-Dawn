l_german:
 BLT_form_category: "Vereinige das Baltikum"
 BLT_form_category_desc: "Die Baltischen Staaten sind der Staatenbund zwischen Estland, Lettland und Litauen. Die drei Nationen sind seit langem Opfer der Raubtiere der europäischen Geopolitik und leiden weiterhin unter den Händen des europäischen Imperialismus. Der Kampf gegen den Einfluss und Druck ausländischer Wohltäter ist ein Muss und hat oberste Priorität. Wir können dieses Ziel erreichen, indem wir Nationen vereinen und vereint werden. Eine Nation von Menschen, die dem Druck ausländischer Einflüsse standhalten und sich als Mitglied auf der Weltbühne etablieren kann, nicht als Hindernis für andere Nationen, das sie ausnutzen können."
 BLT_integrate_start: "Begin forming [GetBLTNameDef]"
 BLT_integrate_start_desc: "It is time to form the Baltic States.\n\n"
 BLT_integrate_lithuania: "Integrate [GetBLTNameAdj] [LIT.GetAdjective] Territories"
 BLT_integrate_lithuania_desc: "Lithuania is the largest of the three Baltic state nations. It beats the nations of Latvia and Estonia in most earmarks, such as population, GDP, and land area. Integrating this nation will take a considerable amount of resources from our nation, but it will benefit our new Baltic State."
 BLT_integrate_latvia: "Integrate [GetBLTNameAdj] [LAT.GetAdjective] Territories"
 BLT_integrate_latvia_desc: "Lettland ist ein weiterer baltischer Staat. Es verbindet Litauen und Estland und hat eine sehr wichtige strategische Lage. Die Integration dieses Staates wird unserem Land eine beträchtliche Menge an Ressourcen abverlangen, wird aber unserem neuen baltischen Staat zugute kommen."
 BLT_integrate_estonia: "Integrate [GetBLTNameAdj] [EST.GetAdjective] Territories"
 BLT_integrate_estonia_desc: "Estland ist der kleinste der drei baltischen Staaten, besitzt jedoch die längste Küstenlinie der drei Nationen. Die Wirtschaft basiert hauptsächlich auf dieser Küstenabhängigkeit und der Forstwirtschaft. Das estnische Volk ist eine beeindruckende Bereicherung für unsere großartige neue Nation. Die Integration dieses Landes wird einige Ressourcen aus unserem eigenen Land erfordern, aber sie wird unserem neuen baltischen Staat zugutekommen."
 BLT_update_flag: "Finish Forming [GetBLTNameDef]"
 BLT_update_flag_desc: "With every constituent territory integrated, we can complete our transformation and proclaim [GetBLTNameDef], adopting its unified flag and name."
 FCA_form_category: "Vereinige Zentralamerika"
 FCA_form_category_desc: "Die Föderale Republik Zentralamerika existierte im frühen 19. Jahrhundert. Sie war ein Staatenbund aus den Gebieten der ehemaligen Generalkapitanat Guatemala von Neu-Spanien. Sie bestand aus den Ländern Costa Rica, El Salvador, Guatemala, Honduras, Nicaragua sowie Teilen von Mexiko und Belize. Die Vereinigung der Föderation wird eine Herausforderung für diese Staaten sein, da sie eine Vielzahl von Ideologien vereinen müssen."
