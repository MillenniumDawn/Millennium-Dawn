 HOL_add_dutchaid: "Établir un programme d'aide néerlandais"
 HOL_add_dutchaid_desc: "Lancer le programme d'aide néerlandais pour fournir une assistance au développement aux nations partenaires. Requiert l'achèvement du focus Programme d'aide néerlandais de la WIC et une capacité économique suffisante."
 HOL_remove_dutchaid: "Retirer le programme d'aide néerlandais"
 HOL_remove_dutchaid_desc: "Réduire le programme d'aide néerlandais, réorientant les ressources vers les priorités nationales."
 HOL_nonselfsufficient_army_emergency_tt: "\n§YConditions pour lever l'urgence :§!\n - Plus de 15 $arms_factory$\n - Ne pas avoir $HOL_nonselfsufficient_army1$\n - Plus que le montant déployé en stock de : $infantry_weapons_type$, $util_vehicle_type$, $cnc_equipment_type$, $artillery_equipment$, $medium_tank_amphibious_chassis$, $medium_tank_flame_chassis$, $medium_tank_chassis$"
 HOL_shell: "Acheter des actions de Shell"
 HOL_shell_desc: "Royal Dutch Shell, groupe énergétique mondial dont le siège est aux Pays-Bas, est un acteur majeur du secteur énergétique national. Avec un portefeuille allant du pétrole et du gaz aux énergies renouvelables et aux technologies bas carbone, Shell s'engage à conduire la transition énergétique et à fournir des solutions durables aux besoins évolutifs de la société."
 HOL_green_shell: "Shell passe au vert"
 HOL_green_shell_desc: "L'engagement de Shell en faveur de la durabilité et des renouvelables, avec une transition vers des sources plus propres : éolien, solaire et hydrogène. Par des investissements dans les technologies vertes, des solutions innovantes et des initiatives bas carbone, Shell vise à mener la transition énergétique et à répondre au défi climatique tout en contribuant à un avenir plus durable."
 HOL_blauwwind: "Bleuvent"
 HOL_blauwwind_desc: "Blauwwind est un projet éolien en mer du Nord néerlandaise, regroupant plusieurs parcs développés par un consortium. En exploitant l'énergie du vent, Blauwwind vise à soutenir les objectifs renouvelables des Pays-Bas, à réduire les émissions de carbone et à promouvoir la durabilité environnementale. Par la collaboration et l'innovation, Blauwwind contribue à l'expansion de la capacité éolienne offshore et à la transition vers une énergie propre."
 HOL_porthos_project: "Projet Porthos"
 HOL_porthos_project_desc: "Le projet Porthos est une initiative de captage et stockage du carbone (CSC) visant à réduire les émissions industrielles de gaz à effet de serre dans la région de Rotterdam. En captant le CO2 et en le stockant dans des gisements de gaz offshore épuisés, Porthos contribue à l'atténuation du changement climatique tout en soutenant la décarbonation industrielle et les objectifs de développement durable."
 HOL_energy_transition_campus: "Campus de la transition énergétique d'Amsterdam"
 HOL_energy_transition_campus_desc: "L'Energy Transition Campus Amsterdam sert de pôle de recherche, d'innovation et de collaboration sur la transition énergétique et la durabilité. En réunissant industrie, université, État et société civile, le campus favorise des solutions interdisciplinaires, l'échange de connaissances et le déploiement technologique pour accélérer le passage à un système énergétique bas carbone et résilient."
 HOL_hefa: "HEFA"
 HOL_hefa_desc: "Les esters et acides gras hydrotraités (HEFA) sont une technologie de carburant d'aviation renouvelable visant à réduire les émissions du secteur aérien. En convertissant des matières premières durables — huiles végétales et graisses animales — en biocarburants de substitution, le HEFA permet aux compagnies de réduire leur empreinte carbone et de respecter les objectifs d'émissions tout en préservant la rentabilité."
 HOL_holland_hydrogen: "Hollande Hydrogène 1"
 HOL_holland_hydrogen_desc: "Holland Hydrogen 1 vise à faire progresser la technologie et l'infrastructure de l'hydrogène aux Pays-Bas dans le cadre de la stratégie de transition énergétique. En promouvant production, distribution et utilisation de l'hydrogène, le projet cherche à libérer le potentiel de ce vecteur énergétique propre et polyvalent, au service de la décarbonation des transports, de l'industrie et du chauffage."
 HOL_no_green_shell: "La spécialité de Shell"
 HOL_no_green_shell_desc: "Shell reste attaché à ses activités cœur : exploration, production et distribution d'énergies non renouvelables, pétrole et gaz naturel. Avec un accent maintenu sur les combustibles fossiles traditionnels, ses activités couvrent forage offshore, raffinage et pétrochimie. Malgré l'attention croissante portée aux renouvelables, Shell conserve sa priorité stratégique : répondre à la demande énergétique mondiale par le développement des ressources conventionnelles."
 HOL_shell_energy_rotterdam: "Parc énergétique et chimique Shell"
 HOL_shell_energy_rotterdam_desc: "Situé à Europoort, le Shell Energy and Chemicals Park Rotterdam est un pôle industriel majeur de l'énergie et de la pétrochimie aux Pays-Bas. Avec des installations avancées et une infrastructure intégrée, le parc soutient raffinage, chimie et production d'énergie. Pierre angulaire de l'économie néerlandaise, il contribue au développement régional, à l'emploi et à l'innovation."
 HOL_europoort_modernization: "Modernisation d'Europoort"
 HOL_europoort_modernization_desc: "Europoort, l'un des plus grands complexes pétrochimiques d'Europe, est en modernisation continue pour gagner en efficacité, durabilité et compétitivité. Par des investissements technologiques, des mises à niveau d'infrastructure et l'optimisation des procédés, Europoort vise à rester un pôle énergétique et industriel de premier plan, stimulant croissance et performance environnementale dans la région de Rotterdam."
 HOL_shell_moerdijk: "Agrandissement du parc Shell Chemicals Moerdijk"
 HOL_shell_moerdijk_desc: "Situé à Moerdijk, le Shell Chemicals Park est un pôle stratégique de fabrication chimique et d'innovation. Avec des installations de pointe et un accent sur la durabilité, le parc produit plastiques, solvants et spécialités. En collaboration avec partenaires industriels et instituts de recherche, il stimule les avancées technologiques et la création de valeur dans le secteur chimique."
 HOL_borsele_choice: "Choix de la centrale de Borssele"
 HOL_borsele_choice_desc: "L'avenir du réacteur nucléaire de Borssele est à la croisée des chemins. Face à la demande croissante d'énergie durable et fiable, il faut choisir d'étendre sa capacité ou de le reconvertir en centrale à charbon propre de dernière génération. Chaque voie offre des bénéfices et des défis distincts, et façonnera l'avenir énergétique des Pays-Bas."
 HOL_syngas_production: "Production de gaz de synthèse"
 HOL_syngas_production_desc: "La production de gaz de synthèse convertit diverses matières premières — gaz naturel, charbon ou biomasse — en syngas, intermédiaire polyvalent pour la synthèse chimique et l'énergie. Avec des technologies avancées et l'innovation de procédés, les installations de syngas, notamment celles de Shell, fournissent des matières premières pour pétrochimie, engrais et carburants, au service du développement industriel et de la transition énergétique."
 HOL_solar_moerdijk: "Solaire Moerdijk"
 HOL_solar_moerdijk_desc: "Solar Moerdijk est un projet solaire dans la zone industrielle de Moerdijk. En déployant des panneaux photovoltaïques sur toits industriels et terrains vacants, il vise à produire de l'électricité renouvelable, à réduire les émissions de carbone et à renforcer la résilience énergétique, tout en utilisant l'infrastructure existante et en favorisant un usage durable des sols."
 HOL_nam: "Création de la Nederlandse Aardolie Maatschappij"
 HOL_nam_desc: "La Nederlandse Aardolie Maatschappij (NAM) est une société pétrolière et gazière néerlandaise chargée de l'exploration, de la production et du développement des hydrocarbures aux Pays-Bas. Avec des opérations onshore et offshore, la NAM joue un rôle pivot dans l'approvisionnement énergétique du pays tout en respectant sécurité, environnement et réglementation."
 HOL_nam_groningen: "NAM Groningue"
 HOL_nam_groningen_desc: "Groningue, dans le nord des Pays-Bas, abrite l'un des plus grands gisements de gaz naturel d'Europe. Pôle énergétique clé, Groningue a longtemps alimenté foyers et industries. Les préoccupations récentes sur la sismicité induite et l'impact environnemental ont toutefois conduit à une réduction progressive de l'extraction, signalant une transition vers des solutions énergétiques durables."
 HOL_nam_waddenzee: "NAM Waddenzee"
 HOL_nam_waddenzee_desc: "La mer des Wadden, site du patrimoine mondial de l'UNESCO, recèle un potentiel d'exploration pétrolière et gazière dans le nord des Pays-Bas. En équilibrant conservation et développement, cette initiative vise à débloquer de façon responsable les réserves de la Waddenzee. Par une planification soignée, des technologies avancées et des garanties environnementales, elle cherche à exploiter les ressources offshore tout en protégeant l'intégrité écologique de cet environnement marin unique."
 HOL_nam_drenthe_oil: "NAM Drenthe"
 HOL_nam_drenthe_oil_desc: "Drenthe Oil désigne l'extraction et l'utilisation des ressources pétrolières de la province de Drenthe, connue pour ses champs onshore. Dans le portefeuille d'hydrocarbures des Pays-Bas, Drenthe Oil contribue à la demande intérieure et aux économies locales, tout en suscitant des débats sur la durabilité environnementale et les stratégies de transition."
 HOL_nam_rotterdam: "NAM Rotterdam"
 HOL_nam_rotterdam_desc: "Rotterdam, plus grand port d'Europe et pôle industriel, joue un rôle vital dans le paysage énergétique néerlandais. Centre majeur de transport et de logistique, Rotterdam est une porte d'entrée pour les importations de brut, les exportations de produits raffinés et la pétrochimie. Sa situation stratégique, son infrastructure et ses initiatives innovantes en font un acteur clé de la transition énergétique mondiale."
 HOL_nam_pernis_refineries: "Raffineries de Pernis"
 HOL_nam_pernis_refineries_desc: "Les raffineries de Pernis, opérées par Royal Dutch Shell, forment l'un des plus grands complexes de raffinage d'Europe, près de Rotterdam. Avec des installations avancées et des usines pétrochimiques intégrées, Pernis transforme le brut en une large gamme de produits raffinés — carburants, lubrifiants et charges chimiques — au service des besoins énergétiques et du développement industriel de la région."
 HOL_regio: "Économie régionale"
 HOL_regio_desc: "Si le Randstad prospère, il est crucial d'assurer la prospérité du reste des Pays-Bas. Investir dans un ensemble plus divers de régions équilibrera la croissance économique et améliorera la qualité de vie dans tout le pays."
 HOL_dutch_agriculture: "Investissements agricoles néerlandais"
 HOL_dutch_agriculture_desc: "Les Pays-Bas figurent parmi les pays agricoles les plus efficaces et sont le 2e exportateur mondial de produits agricoles. Il nous faut investir dans notre secteur pour rester en tête."
 HOL_plantlab: "Création d'un laboratoire végétal"
 HOL_plantlab_desc: "PlantLab est une entreprise néerlandaise d'agrotechnologie spécialisée dans l'agriculture verticale. En combinant hydroponie et éclairage LED, PlantLab révolutionne la production alimentaire, permettant la culture toute l'année de récoltes de qualité en environnement contrôlé. Axée sur la durabilité et l'efficacité des ressources, elle contribue à l'agriculture urbaine et à des systèmes alimentaires résilients."
 HOL_kringlooplandbouw: "Kringlooplandbouw"
 HOL_kringlooplandbouw_desc: "L'agriculture circulaire est une forme d'agriculture durable où le cycle des substances est fermé. Toutes les substances retirées d'un territoire par l'agriculture y sont également restituées. La quantité de substances qui quittent une zone, comme les nitrates, doit donc y revenir. Les ressources disponibles sont utilisées le plus efficacement possible, et les agriculteurs s'efforcent d'équilibrer sorties et entrées. Les recherches de l'université de Wageningen montrent que l'agriculture circulaire réduit les concentrations de nitrates dans les nappes en diminuant les fuites d'azote des terres cultivées."
 HOL_smart_dairy_farming: "Élevage laitier intelligent"
 HOL_smart_dairy_farming_desc: "L'élevage laitier intelligent s'appuie sur le numérique et les solutions fondées sur les données pour optimiser la production et la gestion des fermes. Capteurs, automatisation et analytique prédictive améliorent le bien-être animal, la productivité et la durabilité environnementale. Axé sur l'efficacité et l'innovation, il permet aux éleveurs de décider en connaissance de cause et d'atteindre l'excellence opérationnelle."
 HOL_zero_dairy_farming: "Projet d'élevage laitier zéro émission"
 HOL_zero_dairy_farming_desc: "Le projet Zero Emission Dairy Farming vise à réduire les gaz à effet de serre et l'impact environnemental de la production laitière par des technologies innovantes et des pratiques durables. En déployant des systèmes renouvelables, le captage du méthane et la séquestration du carbone, le projet vise la neutralité carbone et des méthodes agricoles résilientes. Il ouvre la voie à une industrie laitière plus verte."
 HOL_digital_agriculture: "Programme d'agriculture numérique"
 HOL_digital_agriculture_desc: "Le secteur agricole évolue : il est temps de le faire entrer dans l'ère numérique. En déployant le programme d'agriculture numérique, nous doterons nos agriculteurs de technologies de pointe : agriculture de précision, analytique de données et irrigation intelligente. L'initiative vise à accroître l'efficacité, réduire le gaspillage et promouvoir des pratiques durables. L'avenir de l'agriculture est numérique, et ce programme fera de nos agriculteurs des pionniers."
 HOL_food_valley: "Food Valley néerlandaise"
 HOL_food_valley_desc: "Holland Food Valley est un cluster d'innovation agroalimentaire de premier plan, réunissant entreprises, instituts de recherche et agences publiques. Axé sur la R&D, le transfert de technologie et l'accès au marché, il accélère le développement et l'adoption de produits, procédés et modèles innovants, positionnant les Pays-Bas comme leader mondial de l'innovation agroalimentaire."
 HOL_floating_farm_project: "Projet de ferme flottante"
 HOL_floating_farm_project_desc: "Ouverte en 2019 dans le Merwehaven de Rotterdam, la Floating Farm est la première ferme laitière flottante au monde. Son bétail est nourri de flux de déchets circulaires urbains — drêches de brasserie, épluchures de pommes de terre et herbe des parcs et golfs — tandis que le fumier est recyclé sur place. Construite pour flotter, la plateforme sert de banc d'essai à une production alimentaire adaptée au climat, sur l'eau, dans un pays deltaïque confronté à la montée des mers et à la rareté du foncier urbain."
 HOL_stedelijke_reststromen: "Flux résiduels urbains"
 HOL_stedelijke_reststromen_desc: "Les communes acheminent les tontes de bas-côtés et les biodéchets ménagers triés vers les fermes voisines, où des digesteurs les transforment en biogaz et le digestat restant retourne aux champs comme compost. Le dispositif ferme la boucle nutriments et énergie entre la ville et la campagne."
 HOL_boeren_en_gemeenschap: "Les agriculteurs et la communauté"
 HOL_boeren_en_gemeenschap_desc: "En contrepartie des ressources qui sortent des villes, les agriculteurs parrainent clubs sportifs et associations villageoises. Cela resserre le lien entre économie rurale et vie municipale, renforçant le soutien au secteur agricole."
 HOL_enpower_gedeputeerde_staten: "Renforcer les pouvoirs publics"
 HOL_enpower_gedeputeerde_staten_desc: "Accroître l'autonomie et les ressources des gouvernements régionaux (Gedeputeerde Staten) permet des politiques locales plus adaptées et plus efficaces."
 HOL_lelystad_airport: "Création de l'aéroport de Lelystad"
 HOL_lelystad_airport_desc: "L'extension de l'aéroport de Lelystad vise à soulager Schiphol en augmentant la capacité et en améliorant les installations : allongement des pistes, modernisation des terminaux et services aux passagers. Le projet devrait stimuler la connectivité régionale, le tourisme et la croissance économique du Flevoland et des environs."
 HOL_provincial_railways: "Investissements dans les chemins de fer provinciaux"
 HOL_provincial_railways_desc: "Le projet de chemins de fer provinciaux comprend la Lelylijn, la Wunderline et le Train des Trois Pays pour améliorer la connectivité régionale et transfrontalière. La Lelylijn propose une liaison à grande vitesse entre les provinces du Nord et le Randstad. La Wunderline améliore les services entre Groningue et Brême, tandis que le Train des Trois Pays relie les Pays-Bas, §Y[BEL.GetNameWithFlag]§! et l'Allemagne."
 HOL_eindhoven_brainport: "Eindhoven-Brainport"
 HOL_eindhoven_brainport_desc: "Le projet Eindhoven Brainport transforme Eindhoven en pôle technologique et d'innovation de premier plan. En favorisant les industries de haute technologie, en soutenant la recherche et les start-up, l'initiative vise à stimuler les avancées technologiques et la croissance économique de la région."
 HOL_balanced_national_development: "Développement national équilibré"
 HOL_balanced_national_development_desc: "La regio étant désormais florissante, nous visons un développement national équilibré. Coordonner Randstad et regio permettra une croissance durable et équitable dans tout le pays, par des politiques et investissements intégrant activités économiques et infrastructures."
 HOL_diversify_groningen_economy: "Diversifier l’économie de Groningue"
 HOL_diversify_groningen_economy_desc: "Après l'arrêt de l'extraction de gaz à Groningue en raison des risques sismiques, les efforts portent sur la diversification de l'économie régionale : énergies renouvelables, secteurs technologiques et agriculture durable."
 HOL_landbouwregio: "Landbouwregio van de 21ste Eeuw"
 HOL_landbouwregio_desc: "Faire entrer les régions agricoles dans le XXIe siècle passe par des technologies avancées et des pratiques durables. L'initiative modernise les techniques agricoles, améliore la logistique des chaînes d'approvisionnement et promeut des pratiques respectueuses de l'environnement."
 HOL_health_houses: "Maisons de santé"
 HOL_health_houses_desc: "L'initiative des Maisons de santé vise à établir des centres de soins intégrés dans la région, offrant des services médicaux complets et promouvant la santé publique. Ces centres regrouperont soins primaires, traitements spécialisés et programmes de bien-être, améliorant l'accès aux soins et la qualité de vie."
 HOL_dutch_economic_landscape: "Une économie à trois piliers"
 HOL_dutch_economic_landscape_desc: "L'économie néerlandaise repose sur trois piliers : le commerce international, l'agriculture de pointe et un secteur des services mondialement intégré. Avec des ports de classe mondiale, un agribusiness innovant et une position dominante en finance et logistique, les Pays-Bas pèsent bien au-delà de leur taille. Ce modèle équilibré porte croissance et résilience, tout en restant sensible aux chocs mondiaux et aux bascules politiques."
 HOL_randstad: "Randstad"
 HOL_randstad_desc: "Le Randstad, formé d'Amsterdam, Rotterdam, La Haye et Utrecht, est le moteur économique des Pays-Bas. En investissant dans les infrastructures et le développement des affaires, nous visons à renforcer encore son rôle de locomotive nationale."
 HOL_zuidas_development: "Développement de Zuidas"
 HOL_zuidas_development_desc: "Le quartier Zuidas à Amsterdam est un centre financier clé. Étendre sa capacité et améliorer ses installations attirera davantage d'entreprises internationales et consolidera son statut de pôle financier mondial."
 HOL_randstad_rail: "Randstad Rail"
 HOL_randstad_rail_desc: "Le projet RandstadRail relie La Haye, Rotterdam et Zoetermeer par un réseau de métro léger efficace. L'améliorer renforcera la connectivité régionale."
 HOL_smart_city_initiative: "Initiative de ville intelligente"
 HOL_smart_city_initiative_desc: "Investir dans les technologies de ville intelligente à travers le Randstad rendra nos villes plus efficaces, durables et attractives pour les entreprises comme pour les habitants."
 HOL_international_peace_city: "Cité internationale de la paix et de la justice"
 HOL_international_peace_city_desc: "En s'appuyant sur le statut de La Haye comme Ville internationale de la paix et de la justice, nous renforcerons nos liens diplomatiques et notre influence mondiale en accueillant organisations et événements internationaux."
 HOL_randpowerhouse: "Randpowerhouse"
 HOL_randpowerhouse_desc: "Après des années d'investissements stratégiques et de planification visionnaire, le Randstad s'est transformé en « Randpowerhouse », moteur économique dynamique des Pays-Bas. En renforçant les infrastructures, l'innovation et la connectivité entre Amsterdam, Rotterdam, La Haye et Utrecht, la région s'impose comme leader mondial du commerce, de la culture et de la technologie. Cette transformation a accru la production du Randstad et consolidé la place des Pays-Bas sur la scène européenne."
 HOL_dutch_industry: "Industrie néerlandaise"
 HOL_dutch_industry_desc: "L'industrie néerlandaise incarne un héritage d'innovation et d'excellence dans de nombreux secteurs. Axée sur la durabilité, la technologie et la compétitivité mondiale, elle demeure à l'avant-garde de la croissance et de la prospérité."
 HOL_postbank_fusion: "Fusion Postbanque-ING"
 HOL_postbank_fusion_desc: "La fusion de Postbank et d'ING marque une étape dans l'histoire bancaire néerlandaise, consolidant deux grandes institutions en une seule. Cette fusion renforce la position d'ING comme banque mondiale de premier plan, offrant des services et solutions financiers élargis."
 HOL_randstad_takeovers: "Rachats de Randstad"
 HOL_randstad_takeovers_desc: "Les acquisitions de Randstad illustrent l'expansion stratégique et les ambitions mondiales des entreprises néerlandaises dans le recrutement. En rachetant des acteurs clés, Randstad consolide sa position de leader des solutions RH à l'échelle mondiale."
 HOL_ing_group_strategy: "Stratégies d'expansion du groupe ING"
 HOL_ing_group_strategy_desc: "La stratégie du groupe ING esquisse la vision de la banque pour une croissance durable et une transformation numérique. En embrassant l'innovation et des solutions centrées sur le client, ING réaffirme son engagement à apporter du changement positif et de la valeur aux parties prenantes."
 HOL_adyen_fintech_hub: "Adyen et le pôle fintech"
 HOL_adyen_fintech_hub_desc: "Adyen, processeur de paiements amstellodamois fondé en 2006, est devenu l'une des plus grandes fintechs d'Europe en traitant les transactions de marchands mondiaux, de Netflix à Spotify. Son succès positionne les Pays-Bas comme capitale continentale des paiements numériques, attirant investissements et emplois de services à haute valeur dans le Randstad."
 HOL_pension_fund_reform: "Réforme des fonds de pension"
 HOL_pension_fund_reform_desc: "ABP et PFZW figurent parmi les plus grands fonds de pension du monde, donnant au capital néerlandais une portée mondiale via actions, infrastructures et immobilier. La loi de 2023 sur l'avenir des pensions (Wet toekomst pensioenen) fait passer le système des régimes à prestations définies vers les cotisations définies, redessinant l'allocation de ce vaste pool pour les décennies à venir."
 HOL_booking_digital_services: "Économie des services numériques"
 HOL_booking_digital_services_desc: "Booking.com, plus grande agence de voyage en ligne au monde, a son siège à Amsterdam aux côtés de Just Eat Takeaway et TomTom, ancrant un secteur des plateformes et services numériques d'une profondeur inhabituelle pour un pays de cette taille. Ce cluster attire talents internationaux et relocalisations d'entreprises vers le Randstad."
 HOL_spring_global_mail: "Expansion de Spring Global Mail"
 HOL_spring_global_mail_desc: "Spring Global Mail incarne l'expertise néerlandaise en courrier international et logistique. En fournissant des services postaux efficaces et fiables dans le monde, elle facilite le commerce et la communication transfrontaliers."
 HOL_tata_steel_development: "Développement de Tata Steel"
 HOL_tata_steel_development_desc: "Le développement de Tata Steel marque un investissement significatif dans l'industrie manufacturière néerlandaise, assurant croissance et compétitivité de la sidérurgie. L'initiative souligne l'engagement de Tata Steel envers l'innovation et la durabilité."
 HOL_project_beethoven: "Projet Beethoven"
 HOL_project_beethoven_desc: "Face aux inquiétudes d'industriels, dont ASML, sur le climat d'investissement, le projet Beethoven vise à soutenir la croissance du secteur technologique. Cette initiative ambitieuse, adossée à plus de 2,5 milliards d'euros d'investissement public, vise à créer un environnement propice à l'expansion nationale de géants comme ASML, renforçant la position du pays comme pôle d'innovation mondial."
 HOL_phillips_healthcare_expansion: "Expansion de Phillips Healthcare"
 HOL_phillips_healthcare_expansion_desc: "L'expansion de Philips Healthcare reflète le leadership néerlandais en technologies de santé. En élargissant son portefeuille, Philips réaffirme son engagement à améliorer les résultats pour les patients et à faire progresser les solutions médicales dans le monde."
 HOL_south_dakota: "Usines DSM dans le Dakota du Sud"
 HOL_south_dakota_desc: "Les usines de bioéthanol DSM dans le Dakota du Sud témoignent du leadership néerlandais en énergie durable. En investissant dans le bioéthanol, DSM contribue à réduire les émissions de carbone et à promouvoir les renouvelables à l'échelle mondiale."
 HOL_dutch_legends: "Légendes hollandaises"
 HOL_dutch_legends_desc: "Tout au long de l'histoire, les Pays-Bas ont cultivé un héritage légendaire, mêlant maîtrise de l'eau et récits de commerce maritime. Des exploits d'ingénieurs gagnant des terres sur la mer aux audaces de marchands sur les océans lointains, ces légendes entrelacent résilience, ingéniosité et prospérité."
 HOL_trade_infrastructure: "Moderniser les infrastructures commerciales"
 HOL_trade_infrastructure_desc: "Les Pays-Bas disposent d'une infrastructure commerciale finement réglée, tissant ports, canaux et routes en un réseau fluide. Mais à mesure que le commerce mondial évolue, cette infrastructure doit se moderniser. Investir dans des technologies de pointe et moderniser les axes de transport assurera aux Pays-Bas de rester un acteur clé du commerce international."
 HOL_maasvlakte2: "Construire Maasvlakte 2"
 HOL_maasvlakte2_desc: "Les Pays-Bas entreprennent l'ambitieux projet Maasvlakte 2, gagnant des terres sur la mer pour étendre les installations portuaires et stimuler la croissance, écho à la maîtrise historique de l'eau et de l'ingénierie."
 HOL_european_railway_development: "Développements ferroviaires européens"
 HOL_european_railway_development_desc: "S'appuyant sur son héritage d'infrastructures de transport innovantes, les Pays-Bas prennent la tête des développements ferroviaires européens, favorisant connectivité, commerce et mobilité à travers le continent."
 HOL_green_harbor_amsterdam: "Port vert d'Amsterdam"
 HOL_green_harbor_amsterdam_desc: "Amsterdam transforme son port en pôle durable, embrassant pratiques écologiques et initiatives renouvelables, illustrant l'engagement néerlandais envers l'environnement et l'innovation maritime."
 HOL_nederland_maritiem_land: "Stichting Nederland Maritiem Land"
 HOL_nederland_maritiem_land_desc: "La création de la Stichting Nederland Maritiem Land souligne l'héritage maritime et le leadership industriel des Pays-Bas, promouvant collaboration et progrès dans le secteur maritime pour en assurer la prospérité et la compétitivité."
 HOL_schiphol_expansion: "Agrandissement de Schiphol"
 HOL_schiphol_expansion_desc: "L'extension de Schiphol marque un tournant pour l'aviation néerlandaise, propulsant l'aéroport d'Amsterdam au premier rang du voyage mondial. En accroissant la capacité et l'expérience passagers, elle souligne l'engagement des Pays-Bas envers l'efficacité et la connectivité aériennes."
 HOL_digital_customs: "Douanes numériques"
 HOL_digital_customs_desc: "Les douanes numériques révolutionnent les opérations commerciales néerlandaises, fluidifiant les processus par des solutions innovantes. L'initiative incarne l'adhésion du pays au progrès technologique pour consolider son rôle de plaque tournante du commerce mondial."
 HOL_daf_investments: "Investir dans DAF"
 HOL_daf_investments_desc: "Les investissements DAF témoignent de l'engagement de l'industrie automobile néerlandaise envers l'innovation et la croissance. Par des investissements stratégiques et des avancées technologiques, DAF renforce sa position de constructeur majeur de véhicules commerciaux."
 HOL_rijkswaterstaat: "Rijkswaterstaat"
 HOL_rijkswaterstaat_desc: "Rijkswaterstaat, agence gouvernementale néerlandaise de la gestion de l'eau et des infrastructures, joue un rôle pivot dans le paysage hydrique national, supervisant voies d'eau, digues et défenses contre les inondations, protégeant le pays et assurant un usage efficace et durable des ressources en eau."
 HOL_deltawerken_modernization: "Modernisation des Deltawerken"
 HOL_deltawerken_modernization_desc: "Les Pays-Bas modernisent leurs emblématiques Deltawerken, renforçant les défenses côtières et s'adaptant à la montée des mers et au climat changeant, pour protéger le littoral des générations futures."
 HOL_ruimte_voor_de_rivier: "Ruimte voor de Rivier"
 HOL_ruimte_voor_de_rivier_desc: "Adoptant une gestion proactive du risque d'inondation, les Pays-Bas mettent en œuvre le projet « Room for the River », créant de l'espace le long des rives pour accueillir les crues et protéger les zones urbaines, illustrant l'ingéniosité néerlandaise en urbanisme centré sur l'eau."
 HOL_green_water_city_building: "Bâtiment de la ville d’eau verte"
 HOL_green_water_city_building_desc: "Embrassant une vision urbaine durable, les Pays-Bas pionniers des initiatives Green Water City Building, intégrant conception sensible à l'eau et solutions fondées sur la nature dans l'urbanisme, pour des villes résilientes et habitables en harmonie avec l'environnement."
 HOL_dutch_water_sector: "Secteur néerlandais de l'eau"
 HOL_dutch_water_sector_desc: "Le secteur néerlandais de l'eau s'impose comme leader mondial de la gestion et de l'innovation hydriques, s'appuyant sur des siècles d'expertise en maîtrise des crues, défense côtière et ressources en eau pour répondre aux défis mondiaux."
 HOL_hollandse_kust_windfarm: "Construire Hollandse Kust"
 HOL_hollandse_kust_windfarm_desc: "Les Pays-Bas font avancer leur agenda renouvelable avec la zone éolienne Hollandse Kust, en exploitant l'énergie du vent pour une croissance économique durable et la réduction des émissions, en ligne avec la lutte contre le climat."
 HOL_aquatech_amsterdam: "Organiser Aquatech Amsterdam"
 HOL_aquatech_amsterdam_desc: "Aquatech Amsterdam est un salon majeur des technologies de l'eau, réunissant pionniers et experts pour explorer les innovations en gestion et durabilité. Expositions et réseautage y favorisent la collaboration vers un avenir plus sûr en eau."
 HOL_dredging_industry: "Industrie néerlandaise du dragage"
 HOL_dredging_industry_desc: "Boskalis, Van Oord et Royal IHC font ensemble des Pays-Bas le leader mondial incontesté du dragage et de l'ingénierie maritime. Leurs contrats mondiaux — approfondissement de ports, chenaux de navigation et remblais — exportent l'expertise néerlandaise et génèrent d'importantes recettes extérieures, soutenant des milliers d'emplois qualifiés au pays."
 HOL_van_oord_offshore: "Installation éolienne offshore"
 HOL_van_oord_offshore_desc: "Des navires d'installation néerlandais spécialisés érigent les turbines des parcs éoliens de mer du Nord au large de Hollandse Kust et Borssele, alliant construction navale nationale et expertise offshore. La même flotte qui bâtit la transition énergétique néerlandaise sert aussi le marché éolien offshore européen en pleine expansion."
 HOL_global_land_reclamation: "Réhabilitation mondiale des terres"
 HOL_global_land_reclamation_desc: "Les entrepreneurs néerlandais exportent dans le monde leur maîtrise du remblaiement et de la défense côtière, livrant îles artificielles, extensions portuaires et ouvrages anti-inondation, du Moyen-Orient à l'Asie du Sud-Est. Des siècles de lutte contre la mer sont devenus un service d'ingénierie premium, et les firmes qui l'exportent figurent parmi les exportations industrielles les plus distinctives des Pays-Bas."
 HOL_form_nso: "Organisation spatiale néerlandaise"
 HOL_form_nso_desc: "Une agence spatiale nationale permettra aux Pays-Bas de regrouper recherche, développement et exploration sous une structure unifiée. La création du NSO assurera un investissement de long terme dans le voyage spatial, les satellites et les futures missions interplanétaires."
 HOL_ijstad_mission: "Construire IJStad"
 HOL_ijstad_mission_desc: "IJStad est une ville-île artificielle projetée dans l'IJmeer, juste à l'est d'Amsterdam, conçue comme la continuation moderne de la tradition néerlandaise de polder. La nouvelle île accueillerait environ 45 000 logements, soulageant la pénurie du Randstad et démontrant que les Pays-Bas peuvent encore gagner des terres sur l'eau. La construction devrait prendre environ trois ans et redessinera la région West-Nederland autour d'Amsterdam, ajoutant capacité industrielle et bureaux aux nouveaux quartiers résidentiels."
 HOL_mars_colony_mission: "Établir la colonie martienne"
 HOL_mars_colony_mission_desc: "La capacité de lancement assurée et un flux régulier de recrues et d'équipements quittant les Pays-Bas, le long effort pour poser et soutenir des colons néerlandais sur Mars entre dans sa phase finale. Habitats, systèmes de survie et premières structures permanentes doivent être assemblés à travers des millions de kilomètres de vide. Quand la colonie sera prête, ses fondateurs lui donneront un nom tiré des légendes de la patrie qu'ils ont quittée."
 HOL_mars_colony1: "Hollanderhaven"
 HOL_mars_colony1_desc: "La colonie tire son nom de De Vliegende Hollander, le Hollandais volant, capitaine marchand maudit condamné à voguer sans jamais relâcher. Hollanderhaven en devient le cœur commercial, comptoir d'un monde nouveau bâti par les descendants d'une nation maritime. Ses administrateurs canalisent l'ancien instinct de profit de la VOC vers la frontière martienne."
 HOL_mars_colony2: "Barrage de Brinkerdam"
 HOL_mars_colony2_desc: "Brinkerdam honore Hans Brinker, le garçon de légende qui retint la mer en bouchant une digue fuyante de son doigt toute une nuit. L'établissement se spécialise dans les parois sous pression, dômes étanches et hydro-ingénierie qui rendent la colonie habitable face à l'environnement martien hostile. La même discipline qui bâtit les Deltawerken tient désormais le vide à distance."
 HOL_mars_colony3: "Brandaanstad"
 HOL_mars_colony3_desc: "Nommée d'après Sint-Brandaan, voyageur médiéval dont le périple légendaire le porta au bout du monde connu, Brandaanstad est le centre d'apprentissage et de recherche de la colonie. Ses laboratoires s'appuient sur l'héritage de TU Delft et d'ESTEC, poussant les frontières de la science planétaire. La ville incarne la curiosité qui envoya d'abord les Néerlandais au-delà de l'horizon."
 HOL_mars_colony4: "Brammertdelf"
 HOL_mars_colony4_desc: "Brammertdelf évoque Ellert en Brammert, les deux géants brigands qui hantaient jadis les landes de Drenthe. L'établissement ancre l'industrie minière de la colonie, arrachant minerai et volatils à la croûte martienne. Comme ses géants éponymes, il vit de la terre qu'il revendique, fournissant les matières premières de toute la colonie."
 HOL_commissariaat_militaire_productie: "Commissariat Militaire Production"
 HOL_commissariaat_militaire_productie_desc: "Le Commissariaat Militaire Productie coordonne et renforce les capacités de production militaire des Pays-Bas. L'initiative vise à fluidifier les achats, favoriser les industries de défense nationales et assurer un approvisionnement régulier en matériel avancé."
 HOL_dutch_defense_doctrine: "Doctrine de défense néerlandaise"
 HOL_dutch_defense_doctrine_desc: "La doctrine de défense néerlandaise pose les fondements de l'orientation stratégique et des principes opérationnels des forces armées. Elle met l'accent sur l'agilité, la puissance de feu et la coopération, afin que l'armée soit prête à défendre les intérêts nationaux, soutenir les alliés et répondre aux crises mondiales."
 HOL_authority_in_information: "Autorité en matière d'information"
 HOL_authority_in_information_desc: "Établir une position d'autorité informationnelle est clé pour un avantage stratégique. Cela passe par le renforcement du renseignement, de la surveillance et de la reconnaissance pour collecter et traiter l'information critique efficacement."
 HOL_integrated_actions: "Actions intégrées"
 HOL_integrated_actions_desc: "Des actions intégrées sur terre, mer, air, cyber et espace assurent des capacités de défense globales. Ce focus promeut une coordination fluide et des opérations interarmées pour accroître l'efficacité militaire d'ensemble."
 HOL_information_based: "Basé sur l'information"
 HOL_information_based_desc: "Une approche fondée sur l'information améliore la décision et l'efficacité opérationnelle. En investissant dans le renseignement, la surveillance et la reconnaissance, les Pays-Bas s'assurent de réagir vite et efficacement aux menaces émergentes."
 HOL_increase_strategic_capacity: "Accroître la capacité stratégique"
 HOL_increase_strategic_capacity_desc: "Renforcer notre capacité stratégique est essentiel face aux défis futurs. Il s'agit de développer le transport stratégique, la cyberdéfense et les opérations spatiales, pour que les Pays-Bas puissent projeter puissance et influence dans le monde."
 HOL_dutch_specialism: "Spécialité néerlandaise"
 HOL_dutch_specialism_desc: "Pour renforcer notre rôle au sein de l'OTAN, les Pays-Bas développeront des capacités spécialisées complémentaires aux besoins de l'Alliance : opérations amphibies, défense aérienne et forces de déploiement rapide."
 HOL_invest_in_europe: "Investir dans la défense en Europe"
 HOL_invest_in_europe_desc: "Investir dans les capacités de défense européennes assure un continent plus fort et plus résilient. Les Pays-Bas accroîtront leurs contributions aux initiatives européennes, renforçant coopération et interopérabilité avec les États membres de l'UE."
 HOL_military_society: "Campagne société militaire"
 HOL_military_society_desc: "Bâtir un lien fort entre l'armée et la société est crucial. Ce focus comprend des initiatives d'engagement public, de soutien aux vétérans et de culture de la défense."
 HOL_reliable_partner: "Partenaire néerlandais fiable"
 HOL_reliable_partner_desc: "Partenaire et protecteur fiable, les Pays-Bas assureront la sécurité de leurs alliés et contribueront à la stabilité internationale. Cela passe par une participation active aux missions OTAN et UE et le maintien de la préparation à protéger les intérêts nationaux et alliés."
 HOL_unique_people: "Personnel unique néerlandais"
 HOL_unique_people_desc: "Reconnaître et développer les compétences uniques de notre personnel est vital. Ce focus met l'accent sur formation avancée, éducation et carrières pour doter les forces armées d'individus hautement qualifiés et motivés."
 HOL_flexible_operations: "Opérations flexibles"
 HOL_flexible_operations_desc: "Pour rester agiles et scalables, les forces armées doivent réagir vite aux circonstances changeantes. Cela inclut des forces de réaction rapide et une mobilité accrue des troupes face à divers scénarios de menace."
 HOL_innovative_capacity: "Capacité d'innovation"
 HOL_innovative_capacity_desc: "Investir dans la R&D pour maintenir une forte capacité d'innovation est essentiel. Il s'agit d'adopter des technologies de pointe et de cultiver l'innovation pour rester en avance sur d'éventuels adversaires."
 HOL_escalation_dominance: "Domination de l'escalade"
 HOL_escalation_dominance_desc: "Atteindre la domination d'escalade exige des capacités militaires supérieures et des partenariats stratégiques solides. Cela assure que les forces armées puissent dissuader et répondre aux conflits à tout niveau."
 HOL_defensievisie_completed: "Défense terminée"
 HOL_defensievisie_completed_desc: "Avec l'achèvement de la doctrine de défense néerlandaise, les forces armées ont connu une transformation remarquable. Modernisées, résilientes et dotées de technologies de pointe, elles sont prêtes à affronter les défis du futur. Cette étape reflète le dévouement de notre personnel, qui a embrassé l'innovation, renforcé les partenariats internationaux et accru la préparation opérationnelle."
 HOL_koninklijke_luchtmacht: "Parvus Numéro, Magnus Merito"
 HOL_koninklijke_luchtmacht_desc: "Embrasser la devise Parvus numero, magnus merito (Petit en nombre, grand en mérite) en maximisant l'efficacité de l'armée de l'air néerlandaise. Optimiser la formation, améliorer la maintenance et tirer parti des technologies avancées pour que chaque appareil et chaque aviateur contribue pleinement à la mission."
 HOL_join_jsf: "Rejoindre le programme JSF"
 HOL_join_jsf_desc: "La participation des Pays-Bas au programme Joint Strike Fighter (JSF) implique l'achat d'appareils F-35 Lightning II. Ce focus dote l'armée de l'air de chasseurs furtifs de pointe, renforçant supériorité aérienne et capacités de frappe."
 HOL_join_eurofighter_project: "Rejoignez le projet Eurofighter"
 HOL_join_eurofighter_project_desc: "En rejoignant le projet Eurofighter Typhoon, les Pays-Bas investissent dans un chasseur multirôle très avancé. Ce focus renforce les capacités de l'armée de l'air en combat air-air, attaque au sol et reconnaissance."
 HOL_buy_saab_jas39: "Acheter Saab JAS39"
 HOL_buy_saab_jas39_desc: "L'achat de chasseurs Saab JAS 39 Gripen dote l'armée de l'air d'un appareil multirôle polyvalent et économique. Ce focus renforce défense aérienne, appui au sol et reconnaissance, assurant la flexibilité opérationnelle."
 HOL_buy_mq9_reaper: "Acheter MQ-9 Reaper"
 HOL_buy_mq9_reaper_desc: "Investir dans des drones MQ-9 Reaper renforce reconnaissance et frappe de l'armée de l'air. Ces UAV fournissent renseignement en temps réel, surveillance et frappes de précision, boostant nettement l'efficacité opérationnelle."
 HOL_defensie_helikopter_commando: "Création du commando d'hélicoptère Defensie"
 HOL_defensie_helikopter_commando_desc: "Le Defensie Helikopter Commando (DHC) supervise l'ensemble des hélicoptères militaires des forces armées néerlandaises. Ce focus vise à renforcer capacités, formation et coordination de la flotte d'hélicoptères, au service des missions nationales et internationales."
 HOL_ch47d_modernization: "Modernisation des CH-47D"
 HOL_ch47d_modernization_desc: "La modernisation des Chinook CH-47D comprend la mise à niveau de l'avionique, des moteurs et des systèmes de fret. Ce focus assure que ces hélicoptères lourds restent efficaces et fiables pour le transport, le MEDEVAC et l'appui."
 HOL_ah46d_upgrade: "Mise à niveau AH-64D"
 HOL_ah46d_upgrade_desc: "La mise à niveau des Apache AH-64D comprend avionique, armement et survabilité. Ce focus booste les capacités de combat de l'armée de l'air, assurant un appui aérien rapproché et des missions antichar efficaces."
 HOL_air_mobility_command: "Commandement de la mobilité aérienne et du soutien"
 HOL_air_mobility_command_desc: "Créer un commandement national pour diriger mobilité aérienne, logistique et préparation au combat, indépendamment des arrangements alliés. En centralisant le soutien sous contrôle néerlandais, l'armée de l'air peut générer des sorties et entretenir sa flotte sans s'appuyer sur un partenaire."
 HOL_woensdrecht_mro: "Pôle logistique de Woensdrecht et moteur F135"
 HOL_woensdrecht_mro_desc: "Le centre logistique de Woensdrecht accueille l'installation régionale de maintenance, réparation et révision du moteur F135 du F-35. Investir dans le dépôt fait des Pays-Bas un pôle de soutien pour les flottes alliées tout en maintenant nos propres appareils opérationnels et en réduisant la dépendance à l'entretien étranger."
 HOL_expand_fighter_fleet: "Élargir la flotte de chasse"
 HOL_expand_fighter_fleet_desc: "Commander une tranche supplémentaire de chasseurs multirôles pour porter les escadrons à effectif complet. La flotte élargie restaure la capacité déployable et donne à l'armée de l'air la masse nécessaire à la police aérienne nationale comme aux engagements expéditionnaires."
 HOL_expand_fighter_fleet_idea: "Flotte de chasse élargie"
 HOL_expand_fighter_fleet_idea_desc: "Une poussée d'achats accélérée maintient les chaînes de production de chasseurs en régime élevé, abaissant le coût unitaire des nouveaux appareils le temps de la livraison de la tranche."
 HOL_frisian_flag_training: "Programme d'exercices Frisian Flag"
 HOL_frisian_flag_training_desc: "Hébergé à la base de Leeuwarden, l'exercice annuel Frisian Flag réunit les armées de l'air alliées pour un entraînement de combat à grande échelle au-dessus de la mer du Nord. Un programme permanent affine la compétence des pilotes et accélère l'expérience des nouveaux équipages."
 HOL_precision_munitions: "Intégration de munitions de précision"
 HOL_precision_munitions_desc: "Intégrer des armes guidées telles que la GBU-39 Small Diameter Bomb, l'AIM-120 AMRAAM et le missile Meteor sur la flotte de chasse. Une suite d'armement moderne étend portée et létalité, assurant des frappes précises dans un espace aérien contesté."
 HOL_sovereign_air_operations: "Opérations aériennes souveraines"
 HOL_sovereign_air_operations_desc: "Consolider flotte, armement et équipages formés en une armée de l'air autonome capable d'opérations soutenues selon ses propres termes. Les Pays-Bas peuvent désormais tenir leur espace aérien et projeter la puissance aérienne sans dépendre d'un partenaire unique."
 HOL_commando_landstrijdkrachten: "Création du Commando Landstrijdkrachten"
 HOL_commando_landstrijdkrachten_desc: "La création du Commando Landstrijdkrachten (CLAS) en 2005 marqua une réorganisation majeure de l'armée de terre néerlandaise. Cette structure de commandement central visait à améliorer l'efficacité opérationnelle et à fluidifier la décision. En regroupant les composantes sous un seul commandement, les Pays-Bas assurèrent une meilleure coordination et préparation de leurs forces terrestres."
 HOL_jistarc: "Création du JISTARC"
 HOL_jistarc_desc: "Le Joint Intelligence, Surveillance, Target Acquisition and Reconnaissance Command (JISTARC) fut créé pour intégrer et renforcer les capacités de renseignement de l'armée de terre. L'unité combine diverses fonctions de renseignement pour une conscience situationnelle complète. Le JISTARC améliore l'efficacité des missions de reconnaissance et de surveillance."
 HOL_dglc: "Réorganisation du DGLC"
 HOL_dglc_desc: "Le Defensie Grondgebonden Luchtverdedigingscommando (DGLC) est responsable de la défense aérienne terrestre. Renforcer le DGLC passe par la modernisation des missiles et des radars contre les menaces aériennes. Ce focus assure que l'armée de terre puisse défendre efficacement ses atouts et son territoire."
 HOL_vuursteun_commando: "Déploiement de VuursteunCommando"
 HOL_vuursteun_commando_desc: "Le VuursteunCommando (commandement de l'appui-feu) intègre artillerie et éléments d'appui-feu pour une puissance coordonnée. Ce focus modernise les systèmes d'artillerie et améliore la précision. Un appui-feu renforcé accroît l'efficacité des opérations terrestres."
 HOL_supply_command: "Bevoorradings- en Transportcommando"
 HOL_supply_command_desc: "Le Bevoorradings- en Transportcommando (commandement ravitaillement et transport) est crucial pour le soutien logistique et la mobilité de l'armée de terre. Ce focus vise à améliorer chaînes d'approvisionnement, véhicules et infrastructure pour la préparation opérationnelle."
 HOL_military_production_investments: "Investir dans l'industrie de défense néerlandaise"
 HOL_military_production_investments_desc: "Le secteur de la défense néerlandais a vu des investissements clés ces dernières années, du F-35 à la modernisation des frégates de classe Zeven Provinciën. En investissant davantage dans l'industrie de défense nationale, nous pouvons stimuler l'innovation, accroître l'autonomie et doter nos forces d'un matériel de pointe. Cette décision renforcera la sécurité nationale et une économie de défense robuste."
 HOL_defense_industrial_base: "Renforcer la base industrielle de défense"
 HOL_defense_industrial_base_desc: "Les firmes néerlandaises fournissent des composants critiques aux programmes d'armes alliés, mais la capacité d'assemblage nationale reste en retard. En étendant la construction d'usines d'armement et en ancrant la production finale au pays, nous transformons un réseau de sous-traitants en véritable base industrielle nationale."
 HOL_modernize_arms_production: "Moderniser les lignes de production d'armement"
 HOL_modernize_arms_production_desc: "Un outillage obsolète ralentit la montée en cadence des nouvelles commandes. Investir dans l'automatisation menée par Thales et des lignes modernes permet à nos usines militaires d'atteindre plus vite le plein régime, raccourcissant les délais de livraison."
 HOL_lean_defense_manufacturing: "Production de défense allégée"
 HOL_lean_defense_manufacturing_desc: "Un marché du travail tendu fait des ouvriers qualifiés le goulet d'étranglement de la production d'armes. Adopter le lean manufacturing chez DAF et ses fournisseurs réduit la main-d'œuvre exigée par chaque usine militaire, libérant du personnel pour l'économie élargie."
 HOL_defense_supply_chain_integration: "Intégrer les chaînes d'approvisionnement de défense"
 HOL_defense_supply_chain_integration_desc: "Des relations fournisseurs fragmentées plafonnent l'efficacité de nos usines. Intégrer la chaîne d'approvisionnement de défense autour de firmes comme Fokker stabilise les apports et relève l'efficacité maximale de l'industrie militaire."
 HOL_defense_export_promotion: "Promouvoir les exportations de défense"
 HOL_defense_export_promotion_desc: "Les produits de défense néerlandais sont compétitifs à l'étranger, mais les recettes d'export sont sous-exploitées. Une stratégie d'export coordonnée, adossée à Werkspoor et à ses partenaires, élargit l'assiette fiscale de l'industrie militaire et finance de nouveaux investissements."
 HOL_national_defense_industrial_strategy: "Stratégie industrielle de défense nationale"
 HOL_national_defense_industrial_strategy_desc: "Avec une base moderne, des usines lean, des chaînes intégrées et des exports croissants, le gouvernement peut lier ces acquis en une stratégie industrielle unique. Coordonner les grands constructeurs relève la production globale des usines militaires et ancre la défense comme pilier de l'économie."
 HOL_netherlands_fractal_pattern: "Modèle fractal des Pays-Bas"
 HOL_netherlands_fractal_pattern_desc: "Le Netherlands Fractal Pattern (NFP) est un camouflage conçu pour les uniformes militaires néerlandais. Ce dessin avancé offre une meilleure dissimulation dans divers milieux, renforçant survabilité et efficacité au combat."
 HOL_daf_trucks: "Camions militaires DAF CF"
 HOL_daf_trucks_desc: "Investir dans DAF Trucks renforce mobilité et logistique de l'armée de terre. Ces véhicules polyvalents et fiables sont essentiels au transport de troupes, d'équipements et de ravitaillement."
 HOL_scania_trucks: "Scania Gryphus neuf"
 HOL_scania_trucks_desc: "Ajouter des camions Scania à la flotte de l'armée de terre améliore le soutien logistique et l'efficacité du transport. Réputés pour leur durabilité et leurs performances, ils conviennent aux opérations militaires."
 HOL_mrad_replacement: "Moderniser le MRAD"
 HOL_mrad_replacement_desc: "En 2020, le ministère de la Défense a lancé un projet critique de modernisation des systèmes de défense aérienne à moyenne portée (MRAD). Les systèmes actuels, dont le NASAMS, seront remplacés par des plateformes plus avancées pour mieux protéger l'espace aérien néerlandais et soutenir l'OTAN. En investissant dans de nouvelles capacités, nous assurons la défense contre les menaces aériennes modernes."
 HOL_colt_upgrade: "Modernisation du fusil Colt C7"
 HOL_colt_upgrade_desc: "En 2009, les forces armées néerlandaises ont entrepris une mise à niveau significative du fusil Colt C7, améliorant précision, fiabilité et adaptabilité. Cette modernisation comprenait optiques, ergonomie et systèmes modulaires. En y investissant, l'armée de terre dote ses soldats d'une technologie d'armes de pointe."
 HOL_pantserhouwitser_mlu: "Pantalonerhouwitser 2000 MLU"
 HOL_pantserhouwitser_mlu_desc: "Le programme MLU du Pantserhouwitser 2000 modernise ces obusiers automoteurs : conduite de tir, portée et précision. L'artillerie néerlandaise reste ainsi très efficace pour un appui-feu précis."
 HOL_puls: "Ordre PULS israélien"
 HOL_puls_desc: "Le Precise and Universal Launching System (PULS) vise à améliorer l'artillerie de l'armée de terre en intégrant des systèmes de roquettes et missiles avancés. Il permet un appui-feu précis et flexible, renforçant la puissance de feu d'ensemble."
 HOL_bushmaster_mlu: "Bushmaster MLU"
 HOL_bushmaster_mlu_desc: "Le programme MLU Bushmaster modernise blindage, communications et mobilité de ces VTT. Il renforce protection et efficacité des troupes néerlandaises dans divers milieux opérationnels."
 HOL_munition_investments: "Investissements dans les munitions"
 HOL_munition_investments_desc: "Investir dans des munitions avancées et étendre les stocks assure que l'armée de terre soit bien approvisionnée pour des opérations prolongées. Ce focus comprend des munitions guidées de précision et une meilleure logistique des munitions."
 HOL_defensienota_2022: "Défensienota 2022"
 HOL_defensienota_2022_desc: "La Defensienota 2022 esquisse investissements stratégiques et réformes pour renforcer les capacités militaires néerlandaises. Ce plan complet vise modernisation, hausse des budgets de défense et préparation opérationnelle de toutes les armes."
 HOL_procure_stinger_missiles: "Procurez-vous des missiles Stinger"
 HOL_procure_stinger_missiles_desc: "L'achat de missiles Stinger renforce la capacité de l'armée de terre à défendre contre avions et hélicoptères volant bas. Ces MANPADS offrent une défense aérienne flexible et mobile."
 HOL_procure_advanced_mortars: "Procurer des mortiers avancés"
 HOL_procure_advanced_mortars_desc: "Investir dans des mortiers avancés améliore l'appui-feu indirect. Ces systèmes offrent plus de portée, de précision et de mobilité, fournissant une puissance de feu essentielle à l'infanterie."
 HOL_develop_guide_munitions: "Développer des munitions guidées de précision"
 HOL_develop_guide_munitions_desc: "Développer des munitions guidées de 155 mm renforce précision et efficacité de l'artillerie néerlandaise. Ces munitions avancées permettent un ciblage précis, réduisant les dommages collatéraux."
 HOL_expand_patriot_systems: "Développez les systèmes de missiles Patriot"
 HOL_expand_patriot_systems_desc: "Étendre le déploiement des systèmes Patriot améliore la défense contre missiles balistiques et menaces aériennes avancées. Ce focus renforce la sécurité nationale et régionale par un réseau robuste de défense aérienne et antimissile."
 HOL_expand_command_control_centers: "Développez les centres de commande et de contrôle"
 HOL_expand_command_control_centers_desc: "Étendre et moderniser les centres de commandement et de contrôle renforce coordination opérationnelle et décision. Ce focus comprend la mise à niveau des communications et l'intégration de technologies avancées."
 HOL_establish_marechaussee_squad: "Créer une équipe de la Maréchaussée"
 HOL_establish_marechaussee_squad_desc: "La Marechaussee est une force de police militaire spéciale chargée de faire respecter la loi et de soutenir la logistique. Établir cette unité améliorera grandement l'efficacité du ravitaillement et la répression dans nos opérations."
 HOL_modernize_foxtrot: "Moderniser les systèmes de communication Foxtrot"
 HOL_modernize_foxtrot_desc: "La modernisation des systèmes de communication Foxtrot vise l'infrastructure de communication tactique de l'armée de terre : liaisons de données sécurisées à haut débit, chiffrement avancé et interopérabilité OTAN. Elle assure des communications fiables et sûres dans divers milieux."
 HOL_special_forces_helicopter: "Hélicoptère des forces d'opérations spéciales"
 HOL_special_forces_helicopter_desc: "Acquérir des hélicoptères spécialisés pour les forces spéciales néerlandaises (SOF) renforce leur mobilité et leur efficacité. Ils sont équipés pour insertion et extraction rapides, appui aérien rapproché et soutien logistique."
 HOL_defense_healthsector: "Établir l'Instituut Defence & Healthcare"
 HOL_defense_healthsector_desc: "L'Instituut Samenwerking Defensie en Relatieziekenhuizen (Institut de coopération Défense et hôpitaux civils) vise un réseau robuste de soutien médical et de réponse aux crises. Cette collaboration améliore les soins aux militaires et la capacité de l'armée à soutenir l'infrastructure médicale civile en urgence."
 HOL_develop_defensity_college: "Développer le Collège de Défense"
 HOL_develop_defensity_college_desc: "Defensity College est une initiative éducative offrant au personnel militaire des débouchés académiques et une formation spécialisée. Ce focus comprend des partenariats avec universités et instituts techniques pour des cours dans divers domaines, renforçant compétences et connaissances des soldats et officiers."
 HOL_hr_ecosystem: "Ecosystème RH"
 HOL_hr_ecosystem_desc: "L'initiative HR-Ecosysteem vise à combler le fossé entre les forces armées et la société par un réseau RH collaboratif. Le programme crée des partenariats avec des organisations civiles, améliore les débouchés de carrière et le bien-être des militaires. En reliant défense et société, il renforce le soutien pendant et après le service."
 HOL_marinestudie: "Étude marine"
 HOL_marinestudie_desc: "La Marinestudie est une étude stratégique navale complète visant à évaluer et moderniser la marine royale néerlandaise. Le projet évalue capacités actuelles, menaces futures et avancées technologiques pour une stratégie navale de long terme. L'étude met l'accent sur la préparation au combat, la modernisation de la flotte et l'intégration de nouvelles technologies."
 HOL_annual_naval_deployment: "Déploiement naval annuel"
 HOL_annual_naval_deployment_desc: "Chaque année, la marine royale néerlandaise envoie des navires en voyages de bonne volonté au long cours, faisant escale dans les ports du monde occidental. Ces déploiements projettent la présence néerlandaise, renforcent les partenariats et affûtent le savoir-faire hauturier de la flotte."
 HOL_naval_diplomacy_voyage: "Visite de bonne volonté de la marine néerlandaise"
 HOL_world_reaching_navy: "Le monde atteint la marine"
 HOL_world_reaching_navy_desc: "Les Pays-Bas visent à renforcer leurs capacités navales pour opérer efficacement dans le monde. Ce focus modernise la flotte, étend le soutien logistique et renforce les partenariats internationaux. Ainsi, la marine néerlandaise cherche à sécuriser les voies maritimes vitales, participer aux missions de paix et projeter sa puissance où nécessaire."
 HOL_european_navy: "Marine européenne"
 HOL_european_navy_desc: "Les Pays-Bas joueront un rôle de premier plan dans la formation d'une marine européenne, favorisant coopération et intégration navales entre États membres de l'UE. L'initiative vise à renforcer la sécurité maritime collective, rationaliser les ressources de défense et projeter la puissance navale européenne."
 HOL_expanding_naval_infrastructure: "Expansion des infrastructures navales"
 HOL_expanding_naval_infrastructure_desc: "Les Pays-Bas s'engagent à renforcer leur présence navale en étendant le réseau de bases. Ce focus développe de nouvelles bases et modernise les installations existantes sur le littoral et dans les territoires d'outre-mer. Ces bases élargies fourniront un soutien stratégique, amélioreront la logistique et assureront une réaction rapide."
 HOL_f35c_development: "Développement du F35C"
 HOL_f35c_development_desc: "L'achat du F-35C Lightning II dote l'armée de l'air d'une variante embarquée du chasseur furtif avancé. Ce focus renforce la capacité des Pays-Bas à projeter la puissance aérienne depuis bases terrestres et porte-avions, offrant une polyvalence et une efficacité au combat inégalées."
 HOL_future_air_defender: "Futur défenseur aérien"
 HOL_future_air_defender_desc: "Le programme Future Air Defender est un effort conjoint des Pays-Bas et de l'Allemagne pour développer des capacités avancées de défense aérienne navale. L'initiative dote les navires néerlandais et allemands de radars de pointe, de missiles antiaériens et d'une technologie de commandement intégrée."
 HOL_multi_ocean_training: "Formation multi-océans"
 HOL_multi_ocean_training_desc: "Pour se préparer à des défis maritimes divers, la marine néerlandaise mènera d'amples exercices sur plusieurs océans. Ils amélioreront l'interopérabilité avec les marines alliées et la préparation opérationnelle dans divers milieux."
 HOL_carrier_development: "Développement de porte-avions"
 HOL_carrier_development_desc: "En développant des porte-aéronefs avancés, les Pays-Bas assureront leur suprématie navale et la protection des générations futures."
 HOL_expand_dutch_naval_influence: "Développer l'influence navale néerlandaise"
 HOL_expand_dutch_naval_influence_desc: "Pour s'établir pleinement comme puissance navale mondiale, les Pays-Bas doivent favoriser de plus fortes alliances navales et accroître leur influence dans les organisations maritimes internationales. Cela assurera la représentation des intérêts néerlandais dans les opérations et stratégies navales mondiales."
 HOL_submarine_hunter_initiative: "Initiative de chasse sous-marine"
 HOL_submarine_hunter_initiative_desc: "La menace croissante des sous-marins ennemis exige une nouvelle doctrine axée sur la lutte ASM. Les Pays-Bas mèneront le développement de technologies ASM de pointe, afin que les flottes néerlandaises ne soient jamais à la merci de menaces sous-marines invisibles."
 HOL_amphibous_technology: "Corps expéditionnaires spécialisés"
 HOL_amphibous_technology_desc: "Les Pays-Bas devraient investir dans des forces expéditionnaires navales hautement spécialisées, capables d'un déploiement rapide vers des zones de conflit. Ces forces seront appuyées par des navires d'assaut amphibie et des divisions de marines d'élite, permettant une intervention rapide et décisive outre-mer."
 HOL_return_of_destroyers: "Retour des destroyers"
 HOL_return_of_destroyers_desc: "Étendre et moderniser la flotte de destroyers est crucial pour la suprématie navale. Ce focus construit de nouveaux destroyers dotés d'armements et de défenses avancés. Ces bâtiments renforceront les capacités opérationnelles de la marine, offrant défense robuste et options offensives sur divers théâtres."
 HOL_thales_investments: "Thales Investissements"
 HOL_thales_investments_desc: "Thales Nederland, filiale du groupe Thales, est une entreprise de premier plan en défense, aérospatial et sécurité aux Pays-Bas. Investir dans Thales Nederland passe par le renforcement de la production, de la R&D et de son rôle sur les marchés mondiaux de la défense."
 HOL_special_force_move: "Les Marines à Flessingue"
 HOL_special_force_move_desc: "La décision d'établir une présence significative du corps des marines à Flessingue est dictée par des avantages stratégiques et logistiques. La situation de Flessingue sur la mer du Nord offre un accès direct aux routes maritimes, idéal pour les opérations amphibies et le déploiement rapide. L'infrastructure existante et la proximité des voies de navigation renforcent préparation et flexibilité du corps des marines."
 HOL_rijksregiebureau_maritieme_industrie: "Rijksregiebureau Maritieme Industrie"
 HOL_rijksregiebureau_maritieme_industrie_desc: "La création du Rijksregiebureau Maritieme Maakindustrie marque une étape vers la centralisation et la coordination de l'industrie manufacturière maritime. Cette agence fluidifiera innovation et expansion de la construction navale et de l'ingénierie marine, assurant la compétitivité et l'avance technologique des industries maritimes néerlandaises."
 HOL_maritiem_masterplan: "Plan directeur maritime"
 HOL_maritiem_masterplan_desc: "Het Maritiem Masterplan esquisse une stratégie complète pour renforcer le secteur maritime néerlandais : investissements dans l'infrastructure, la R&D et la formation. En le mettant en œuvre, les Pays-Bas visent à conserver leur rang de leader mondial de l'innovation et de la durabilité maritimes."
 HOL_werf_van_de_toekomst: "Werf van de Toekomst"
 HOL_werf_van_de_toekomst_desc: "Le projet De Werf van de Toekomst (le chantier du futur) vise à révolutionner la construction navale néerlandaise. L'initiative intègre des technologies de fabrication avancées — automatisation, robotique et impression 3D — aux opérations des chantiers, pour des processus plus efficaces, durables et économiques."
 HOL_smart_maritime: "Maritime intelligente"
 HOL_smart_maritime_desc: "L'initiative Smart Maritime s'appuie sur le numérique pour améliorer l'efficacité et les performances du secteur maritime néerlandais : systèmes intelligents de navigation, logistique et maintenance, ainsi que navires autonomes. En embrassant la transformation numérique, les Pays-Bas visent à mener les solutions de navigation intelligente."
 HOL_robotics_navy: "Marine robotique"
 HOL_robotics_navy_desc: "Le projet Robotisering Wind op Zee (éolien offshore robotisé) intègre robotique et automatisation à l'éolien en mer. L'initiative vise à améliorer installation, maintenance et exploitation des turbines, rendant le processus plus sûr, efficace et durable. En s'appuyant sur la robotique, les Pays-Bas renforcent leurs capacités renouvelables."
 HOL_seabed_protection: "Protéger les infrastructures de la mer du Nord"
 HOL_seabed_protection_desc: "Pipelines, câbles électriques et de données, et parcs éoliens recouvrent désormais la mer du Nord néerlandaise, et le sabotage des gazoducs Nord Stream a révélé leur vulnérabilité. Un programme dédié de guerre des fonds marins associe navires hydrographiques, réseaux sonar et systèmes sous-marins sans pilote pour surveiller et défendre cette infrastructure critique."
 HOL_nuke_navy: "Nucléaire Voortstuwing van Schepen"
 HOL_nuke_navy_desc: "L'initiative Nucleaire Voortstuwing van Schepen (propulsion nucléaire des navires) explore le développement et le déploiement de systèmes de propulsion nucléaire pour les bâtiments navals et commerciaux néerlandais. Ce focus vise des solutions durables et à long rayon d'action, réduisant la dépendance aux fossiles et renforçant les capacités opérationnelles de la flotte."
 HOL_goalkeeper_modernization: "Modernisation du Goalkeeper"
 HOL_goalkeeper_modernization_desc: "Les Pays-Bas modernisent leur CIWS Goalkeeper pour renforcer la défense navale. Le projet installe de nouveaux radars et systèmes de poursuite, améliore la conduite de tir et intègre des munitions avancées. Les Goalkeeper mis à jour boosteront nettement la capacité de la marine à se défendre contre missiles et menaces rapprochées."
 HOL_smartl_radar_construction: "Construction du radar SMART-L"
 HOL_smartl_radar_construction_desc: "La construction du radar SMART-L dotera la marine d'une surveillance et d'une poursuite longue portée de pointe. Ce radar avancé détecte et suit missiles balistiques, aéronefs et autres menaces aériennes à grande distance. En le déployant, les Pays-Bas renforcent la conscience situationnelle et la défense aérienne et antimissile d'ensemble."
 HOL_vrouwenklasse_destroyer: "Développement de la Vrouwenklasse"
 HOL_vrouwenklasse_destroyer_desc: "En introduisant les destroyers anti-sous-marins de classe Vrouwenklasse, les Pays-Bas visent une flotte de frégates très avancées et polyvalentes. Ces navires disposeront de missiles de pointe, d'un radar supérieur et de solides capacités de guerre électronique. Conçus pour exceller en opérations navales offensives comme défensives, ils assureront que la marine reste une force redoutable."
 HOL_den_helder_css: "Le Helder CSS"
 HOL_den_helder_css_desc: "Le projet Den Helder CSS vise à développer un nouveau navire de soutien au combat pour l'appui logistique et opérationnel de la flotte. Il assurera que les forces navales puissent soutenir des opérations prolongées en fournissant carburant, munitions et ressources essentielles. Le Den Helder CSS sera un atout critique pour l'efficacité opérationnelle de la marine."
 HOL_joint_support_ship: "Navire de soutien commun Karel Doorman"
 HOL_joint_support_ship_desc: "Mis en service en 2015, le Zr.Ms. Karel Doorman est un Joint Support Ship combinant transport maritime, ravitaillement à la mer et opérations d'hélicoptères en une seule coque. Construit par Damen Schelde, il permet à la marine royale de soutenir des groupes expéditionnaires et le corps des marines loin des ports d'attache."
 HOL_amphibious_transport_group: "Groupe de transport amphibie"
 HOL_amphibious_transport_group_desc: "Les docks de débarquement de classe Rotterdam, menés par le Zr.Ms. Johan de Witt, dotent le Korps Mariniers d'une capacité d'assaut amphibie dédiée. Avec radier, hangars véhicules et ponts d'envol, ils mettent à terre un bataillon de marines renforcé et servent de plates-formes de commandement flottantes pour les opérations interarmées."
 HOL_nh90_mlu: "NH90 MLU"
 HOL_nh90_mlu_desc: "Le projet de modernisation de mi-vie NH90 vise à prolonger la vie opérationnelle et les capacités des hélicoptères NH90 de la marine. La mise à niveau comprend avionique avancée, capteurs améliorés et systèmes d'armes renforcés. Le NH90 MLU assurera que ces hélicoptères polyvalents restent efficaces en ASM, SAR et transport."
 HOL_flexible_navy: "Opérations navales flexibles"
 HOL_flexible_navy_desc: "La marine royale néerlandaise doit s'adapter à un environnement maritime mondial en mutation rapide. En nous concentrant sur des opérations navales flexibles, nous renforcerons la capacité de la flotte à répondre vite à diverses menaces, de la guerre sous-marine à la défense côtière. Cela permettra à la marine de maintenir sa présence sur différentes mers et de soutenir les alliés en opérations conjointes."
 HOL_submarine_modernization: "Programme de modernisation des sous-marins"
 HOL_submarine_modernization_desc: "Les Pays-Bas entreprennent un programme complet de modernisation de leur flotte sous-marine. L'initiative dote les sous-marins existants des dernières technologies furtives, de sonars avancés et d'un armement amélioré. La modernisation renforcera survabilité et efficacité au combat dans divers milieux."
 HOL_barracuda_submarine: "Ordre naval des barracudas"
 HOL_barracuda_submarine_desc: "L'acquisition de sous-marins de classe Barracuda représente un saut significatif dans la guerre sous-marine néerlandaise. Ces SNA sont équipés de furtivité avancée, de frappe à longue portée et de sonars de pointe. Ils doteront la marine de capacités sous-marines offensives et défensives inégalées."
 HOL_c71_submarine: "Développement du C71 néerlandais"
 HOL_c71_submarine_desc: "Le projet de sous-marin C-71 est un produit fier de l'industrie maritime néerlandaise, reflet d'un héritage naval ancien. Ces sous-marins sont conçus pour la défense côtière et les opérations spéciales, avec propulsion avancée, haute manœuvrabilité et communications de pointe. La classe C-71 renforcera nettement la capacité de la marine à protéger les eaux territoriales et à mener des missions clandestines."
 HOL_submarine_drones: "Développement de drones sous-marins"
 HOL_submarine_drones_desc: "Embrassant l'avenir de la guerre navale, les Pays-Bas investissent dans des drones sous-marins pour soutenir leurs opérations. Ces véhicules autonomes et téléopérés mèneront surveillance, reconnaissance et déminage. Leur intégration augmentera les capacités de la flotte sous-marine et procurera un avantage tactique significatif."
 HOL_damen_industry_expansion: "Expansion industrielle de Damen"
 HOL_damen_industry_expansion_desc: "En partenariat avec Damen Shipyards, les Pays-Bas étendent leur industrie de construction navale pour répondre aux programmes de modernisation. L'expansion comprend la mise à niveau des installations, la R&D et l'augmentation de la capacité de production. Elle assurera que le pays reste une nation maritime de premier plan."
 HOL_legendary_dockyards: "Chantiers navals légendaires néerlandais"
 HOL_legendary_dockyards_desc: "La résurgence du savoir-faire naval néerlandais produira des résultats extraordinaires : meilleure production, construction plus rapide et dessins plus robustes. Tandis que les chantiers légendaires renaissent, les Pays-Bas cimenteront leur statut de leader de la guerre navale moderne."
 HOL_paars: "Paars II"
 HOL_paars_desc: "La seconde coalition violette, formée du Parti travailliste (PvdA), du Parti populaire pour la liberté et la démocratie (VVD) et des Démocrates 66 (D66), continue de gouverner les Pays-Bas. Cette coalition vise à équilibrer politiques sociales progressistes et libéralisme économique."
 HOL_threats_against_politicians: "Protéger les politiciens"
 HOL_threats_against_politicians_desc: "De récentes menaces contre des élus ont soulevé des inquiétudes sur la sécurité de nos institutions démocratiques. Il est impératif de renforcer les mesures de sécurité et d'assurer la protection de nos représentants élus."
 HOL_royal_wedding: "Mariage Royal"
 HOL_royal_wedding_desc: "Les fiançailles du prince héritier Willem-Alexandre avec Máxima Zorreguieta ont suscité la controverse en raison du passé de son père dans la dictature militaire argentine. Cela a déclenché un débat politique et public sur sa présence au mariage, aboutissant à une décision du gouvernement et du Parlement néerlandais."
 HOL_un_mission_ehtiopia: "Rejoindre la mission de l'ONU en Éthiopie"
 HOL_un_mission_ehtiopia_desc: "Les Nations unies ont demandé la participation néerlandaise à la mission de maintien de la paix en Éthiopie. Rejoindre cette mission renforcera notre standing international et contribuera à la paix et à la stabilité mondiales."
 HOL_gay: "Mariage homosexuel"
 HOL_gay_desc: "La légalisation du mariage entre personnes de même sexe marque une étape majeure dans la lutte pour l'égalité et les droits humains. Cette décision historique consolidera la position des Pays-Bas comme société progressive et inclusive."
 HOL_vvd: "VVD Dijkstal gagne"
 HOL_vvd_desc: "Le VVD est un parti libéral-conservateur qui défend les marchés libres, la liberté individuelle et une intervention minimale de l'État dans l'économie. Sous la direction de figures pragmatiques comme Mark Rutte, le VVD met l'accent sur la croissance économique, des services publics efficaces, une sécurité nationale forte et une approche équilibrée de l'immigration. Le parti vise une économie dynamique et compétitive tout en assurant libertés personnelles et stabilité sociale."
 HOL_economic_paper: "Réduire la paperasse économique"
 HOL_economic_paper_desc: "Pour favoriser un environnement d'affaires plus dynamique et efficace, le VVD s'engage à réduire la paperasse économique inutile. En coupant dans la bureaucratie, nous permettrons aux entreprises de se concentrer sur la croissance et l'innovation."
 HOL_vvd_debt_reduction: "Réduction de la dette"
 HOL_vvd_debt_reduction_desc: "Assurer la stabilité de long terme de notre économie est primordial. Le VVD vise à réduire la dette nationale par une gestion budgétaire prudente et des coupes ciblées, garantissant un avenir prospère aux générations à venir."
 HOL_economic_stimulation_tax: "Taxe de relance économique"
 HOL_economic_stimulation_tax_desc: "Le VVD croit au pouvoir des incitations économiques pour stimuler la croissance. En introduisant des avantages fiscaux pour des secteurs clés, nous stimulerons investissement, innovation et expansion économique."
 HOL_startup_innovation_policies: "Politiques d'innovation des startups"
 HOL_startup_innovation_policies_desc: "Encourager l'entrepreneuriat est au cœur de la stratégie économique du VVD. Nous offrirons allègements fiscaux et subventions aux start-up innovantes, créant un écosystème entrepreneurial vibrant."
 HOL_vvd_leadership: "Référendum à la direction"
 HOL_vvd_leadership_desc: "En 2006, le VVD a connu un défi interne de leadership entre Mark Rutte et Rita Verdonk. Pour le résoudre et déterminer l'orientation future du parti, un référendum de leadership a été organisé parmi les adhérents. Son issue façonnerait politiques et stratégie, équilibrant le centrisme pragmatique de Rutte et la ligne dure de Verdonk."
 HOL_mark_rutte: "Marc Rutte"
 HOL_mark_rutte_desc: "Mark Rutte, leader pragmatique et centriste du VVD, est connu pour sa capacité à bâtir de larges coalitions et à naviguer des paysages politiques complexes. En 2006, il met l'accent sur une gouvernance équilibrée : libéralisme économique, services publics efficaces et politiques sociales modérées. Rutte vise à moderniser les infrastructures, promouvoir l'innovation et assurer une position forte des Pays-Bas dans l'Union européenne."
 HOL_consensus_politics: "Politique de consensus"
 HOL_consensus_politics_desc: "Sous la direction de Mark Rutte, le VVD se concentrera sur de larges coalitions et le consensus à travers le spectre politique, assurant stabilité et gouvernance efficace."
 HOL_modernize_dutch_infrastructure: "Moderniser les infrastructures néerlandaises"
 HOL_modernize_dutch_infrastructure_desc: "Investir dans les infrastructures est crucial pour la croissance. Le VVD modernisera routes, chemins de fer et réseaux numériques pour améliorer la connectivité et réduire la congestion."
 HOL_strong_netherlands_europe: "Des Pays-Bas forts dans une Europe forte"
 HOL_strong_netherlands_europe_desc: "Une Union européenne forte est essentielle à notre sécurité et à notre prospérité. Le VVD plaidera pour une coopération économique et de sécurité plus profonde au sein de l'UE."
 HOL_nato_norm: "Investir pour respecter la norme de l'OTAN"
 HOL_nato_norm_desc: "La sécurité nationale n'est pas négociable. Le VVD s'engage à augmenter les dépenses de défense pour atteindre l'objectif OTAN de 2 % du PIB, afin de protéger notre nation et d'honorer nos engagements d'alliance."
 HOL_pragmatic_immigration: "Immigration pragmatique"
 HOL_pragmatic_immigration_desc: "Équilibrant préoccupations de sécurité et besoin d'intégration, le VVD sous Rutte mettra en œuvre des politiques d'immigration pragmatiques favorisant cohésion sociale et bénéfice économique."
 HOL_teflon_mark: "Marque de téflon"
 HOL_teflon_mark_desc: "La résilience de Mark Rutte et sa capacité à surmonter les défis politiques sont des atouts inestimables. Le VVD s'appuiera sur son leadership pour maintenir stabilité et progrès."
 HOL_rita_verdonk: "Rita Verdonk"
 HOL_rita_verdonk_desc: "Rita Verdonk, figure éminente du VVD, est connue pour sa ligne dure sur l'immigration et l'ordre public. En 2006, elle plaide pour des contrôles stricts de l'immigration, des mesures robustes de sécurité nationale et la préservation de l'identité culturelle néerlandaise. Son approche résonne auprès des électeurs en quête de politiques fermes sur l'intégration et la sécurité publique."
 HOL_national_identity: "Identité nationale"
 HOL_national_identity_desc: "Préserver la culture et l'identité néerlandaises est primordial. Sous la direction de Verdonk, le VVD mettra en œuvre des politiques pour protéger et célébrer notre héritage national."
 HOL_tough_on_immigration: "Fermeté sur l'immigration"
 HOL_tough_on_immigration_desc: "Pour protéger nos frontières et maintenir l'ordre social, le VVD adoptera une ligne dure sur l'immigration, insistant sur des contrôles stricts et une réduction des flux migratoires."
 HOL_law_and_order: "Loi et ordre"
 HOL_law_and_order_desc: "Assurer la sécurité publique est une valeur fondamentale du VVD. Nous augmenterons le financement de la police et des forces militaires pour combattre le crime et garantir la sécurité nationale."
 HOL_self_reliance_citizens: "Citoyens autonomes"
 HOL_self_reliance_citizens_desc: "Promouvoir l'autonomie et réduire la dépendance à l'aide sociale sont des objectifs clés du VVD. Nous mettrons en œuvre des politiques encourageant la responsabilité individuelle et l'indépendance économique."
 HOL_promote_dutch_sovereignty: "Promouvoir la souveraineté néerlandaise"
 HOL_promote_dutch_sovereignty_desc: "Le VVD sous Verdonk mettra l'accent sur la souveraineté néerlandaise, réduisant l'influence de l'UE sur les politiques nationales et protégeant notre indépendance."
 HOL_iron_rita: "Rita de fer"
 HOL_iron_rita_desc: "Le leadership fort et décisif de Rita Verdonk guidera le VVD à travers des temps difficiles, assurant un contrôle ferme et une direction claire pour l'avenir."
 HOL_wilders_vvd: "Geert Wilders"
 HOL_wilders_vvd_desc: "Geert Wilders est la voix anti-immigration la plus franche du VVD, canalisant le malaise croissant du public sur l'intégration et l'intégration européenne. Il pousse le parti vers une ligne plus dure sur l'immigration, la sécurité et la souveraineté nationale, tout en restant dans son cadre libéral."
 HOL_immigration_hardliner: "La ligne dure en matière d’immigration"
 HOL_immigration_hardliner_desc: "Wilders exige des limites bien plus strictes à l'immigration et à l'asile. Le VVD durcit les conditions d'entrée et d'intégration, se présentant comme le parti qui protégera la société néerlandaise d'une migration incontrôlée."
 HOL_islam_integration_debate: "Le débat sur l'intégration"
 HOL_islam_integration_debate_desc: "Wilders impose un débat national sur l'islam, l'intégration et les valeurs néerlandaises. Le parti adopte une position confrontationnelle, exigeant que les nouveaux arrivants adoptent pleinement les normes libérales et culturelles du pays."
 HOL_eurosceptic_vvd_wing: "Aile eurosceptique"
 HOL_eurosceptic_vvd_wing_desc: "Une faction autour de Wilders se méfie d'une intégration européenne toujours plus étroite. Le VVD adopte une posture plus critique envers Bruxelles, résistant aux transferts de souveraineté et questionnant l'élargissement."
 HOL_security_first: "La sécurité d'abord"
 HOL_security_first_desc: "Face à la violence politique et aux craintes de terrorisme, Wilders appelle à une posture de sécurité plus dure. Le parti élargit les pouvoirs de police et de contre-terrorisme pour rassurer un public inquiet."
 HOL_wilders_dutch_sovereignty: "Souveraineté néerlandaise"
 HOL_wilders_dutch_sovereignty_desc: "L'aile Wilders place la souveraineté nationale au-dessus des engagements supranationaux. Le VVD affirme la primauté du droit et des institutions néerlandaises, réduisant la portée des autorités extérieures sur la politique intérieure."
 HOL_wilders_vvd_capstone: "Voix des mécontents"
 HOL_wilders_vvd_capstone_desc: "Wilders devient le champion incontestable des électeurs qui se sentent inentendus. Son appel populiste redessine l'image du VVD, liant un électorat agité à la nouvelle identité plus dure du parti."
 HOL_liberal_society: "Société libérale"
 HOL_liberal_society_desc: "Promouvoir un modèle économique libéral est fondamental pour la vision du VVD. Nous défendrons les marchés libres et la concurrence pour stimuler innovation et prospérité."
 HOL_modernizing_public_services: "Modernisation des services publics"
 HOL_modernizing_public_services_desc: "Moderniser les services publics par l'infrastructure numérique et des processus simplifiés est une priorité du VVD, assurant efficacité et accessibilité pour tous les citoyens."
 HOL_commitment_to_security: "Engagement pour la sécurité"
 HOL_commitment_to_security_desc: "Assurer la sécurité de notre nation est une priorité. Le VVD investira dans la police et les forces militaires pour protéger nos citoyens et faire respecter l'État de droit."
 HOL_public_private_partnerships: "Partenariats public-privé"
 HOL_public_private_partnerships_desc: "Le VVD soutient les partenariats public-privé pour renforcer le développement des infrastructures et stimuler la croissance économique par des efforts collaboratifs."
 HOL_increase_cyber_security: "Renforcer la cybersécurité"
 HOL_increase_cyber_security_desc: "Dans un monde de plus en plus numérique, le VVD investira dans des mesures de cybersécurité pour protéger l'infrastructure nationale et les actifs numériques contre les cybermenaces."
 HOL_privatize_health_sector: "Privatiser le secteur de la santé"
 HOL_privatize_health_sector_desc: "Introduire des mécanismes de marché dans le système de santé améliorera l'efficacité et réduira les coûts, assurant de meilleurs services pour tous."
 HOL_woningbouwimpuls: "Développement du logement"
 HOL_woningbouwimpuls_desc: "Remédier à la pénurie de logements est crucial. Le VVD accélérera la construction pour rendre les logements plus abordables et accessibles."
 HOL_economy_based_education: "Éducation orientée économie"
 HOL_economy_based_education_desc: "Aligner les programmes éducatifs sur les besoins du marché garantira aux étudiants des compétences recherchées, boostant leur employabilité et l'économie."
 HOL_innovation_subsidies: "Subventions à l'innovation"
 HOL_innovation_subsidies_desc: "Subventionner les projets innovants favorisera une culture de créativité et de progrès technologique, stimulant croissance et compétitivité."
 HOL_excellent_schools: "Présenter d’excellentes écoles"
 HOL_excellent_schools_desc: "Promouvoir la création d'écoles d'excellence relèvera les standards et les résultats éducatifs, assurant à nos enfants la meilleure éducation possible."
 HOL_invest_clean_energy: "Investir dans les énergies propres"
 HOL_invest_clean_energy_desc: "Investir dans les technologies d'énergie propre est crucial pour réduire la dépendance aux fossiles et les émissions de carbone. Le VVD soutiendra les projets renouvelables et les pratiques durables."
 HOL_decrease_trade_bureaucracy: "Réduire la bureaucratie commerciale"
 HOL_decrease_trade_bureaucracy_desc: "Réduire les obstacles bureaucratiques au commerce facilitera des transactions internationales plus fluides et plus rapides. Le VVD vise à simplifier les processus commerciaux pour booster l'efficacité des exportations."
 HOL_mkb_actieplan: "Plan d'action MKB"
 HOL_mkb_actieplan_desc: "Soutenir les PME est vital pour la croissance. Le VVD mettra en œuvre un plan d'action offrant allègements fiscaux, subventions et charges réglementaires réduites aux PME."
 HOL_nederland_digitaal: "Société numérique néerlandaise"
 HOL_nederland_digitaal_desc: "Le VVD envisage un gouvernement et des services publics pleinement numérisés. En investissant dans l'infrastructure informatique avancée et l'e-gouvernement, nous renforcerons efficacité, transparence et accessibilité pour tous les citoyens."
 HOL_balkenende: "Le temps de Balkenende commence"
 HOL_balkenende_desc: "Le leadership de Jan Peter Balkenende met l'accent sur les valeurs démocrates-chrétiennes de solidarité, de responsabilité et de gérance. Son approche pragmatique vise à équilibrer croissance économique, justice sociale et durabilité environnementale."
 HOL_invest_in_police: "Investir dans la police"
 HOL_invest_in_police_desc: "Renforcer les capacités de notre police assurera la sécurité publique et le respect de l'État de droit, créant un environnement sûr pour tous les citoyens."
 HOL_prohibit_soft_drugs: "Interdire les drogues douces"
 HOL_prohibit_soft_drugs_desc: "Pour protéger la santé publique et l'ordre social, le CDA mettra en œuvre une réglementation plus stricte des drogues douces, réduisant leur disponibilité et atténuant les maux associés."
 HOL_unhcr_migration_office: "Bureau des migrations du HCR"
 HOL_unhcr_migration_office_desc: "Soutenir l'établissement d'un bureau de migration du HCR aux Pays-Bas renforcera notre capacité à gérer asile et réfugiés de façon efficace et humaine."
 HOL_skilled_immigration: "Uniquement une immigration qualifiée"
 HOL_skilled_immigration_desc: "Mettre l'accent sur l'immigration qualifiée assurera que les nouveaux arrivants contribuent positivement à notre économie et à notre société, répondant aux besoins du marché du travail tout en maintenant la cohésion sociale."
 HOL_solidarity_healthcare: "Soins de santé solidaires"
 HOL_solidarity_healthcare_desc: "Le CDA croit en un système de santé fondé sur la solidarité. En assurant à chacun l'accès à des soins de qualité, nous visons une société plus inclusive et solidaire."
 HOL_living_care: "Vivre et prendre soin"
 HOL_living_care_desc: "Intégrer habitat et structures de soins assurera à notre population âgée le soutien dont elle a besoin au sein de ses communautés, favorisant dignité et bien-être."
 HOL_family_ministry: "Ministère des Familles"
 HOL_family_ministry_desc: "Créer un ministère des Familles centralisera les efforts de soutien à la vie familiale, assurant que les politiques de tout le gouvernement convergent vers le bien-être des familles."
 HOL_invest_childcare: "Investir dans la garde d'enfants"
 HOL_invest_childcare_desc: "L'accès à une garde d'enfants abordable et de qualité est vital pour les familles qui travaillent. Le CDA augmentera le financement des services de garde pour soutenir parents et enfants."
 HOL_child_subsidies: "Subventions pour enfants"
 HOL_child_subsidies_desc: "Fournir un soutien financier aux familles avec enfants aidera à alléger le coût d'élever une famille et à promouvoir le bien-être de nos plus jeunes citoyens."
 HOL_nederland_sportland: "Pays-Bas Sportland"
 HOL_nederland_sportland_desc: "Promouvoir le sport et l'activité physique est essentiel à une société en bonne santé. Le CDA investira dans les installations et programmes sportifs pour encourager des modes de vie actifs."
 HOL_invest_in_clean_energy: "Investir dans les énergies propres"
 HOL_invest_in_clean_energy_desc: "Investir dans les technologies d'énergie propre est crucial pour un avenir durable. Le CDA soutiendra projets renouvelables et initiatives de réduction des émissions de carbone."
 HOL_financial_freedom_schools: "Liberté financière des écoles"
 HOL_financial_freedom_schools_desc: "Accorder l'autonomie financière aux écoles leur permettra de mieux répondre aux besoins de leurs élèves et d'innover dans l'offre éducative."
 HOL_practical_job_education: "Formation professionnelle pratique"
 HOL_practical_job_education_desc: "Mettre l'accent sur la formation professionnelle pratique assurera aux étudiants les compétences nécessaires au marché du travail, réduisant le chômage et stimulant la croissance."
 HOL_business_risk_law: "Droit des risques commerciaux"
 HOL_business_risk_law_desc: "Pour assurer le bien-être des salariés, le CDA mettra en œuvre une loi exigeant des entreprises qu'elles assument la responsabilité de leurs travailleurs, même en cas de maladie. Cette politique vise à protéger les droits des travailleurs et à promouvoir un environnement de travail plus sain et plus solidaire."
 HOL_maatschappelijk_ondernemen: "Maatschappelijk Ondernemen"
 HOL_maatschappelijk_ondernemen_desc: "Promouvoir l'entrepreneuriat socialement responsable assurera que les entreprises contribuent positivement à la société, équilibrant profit et responsabilités sociales et environnementales."
 HOL_remove_trade_tape: "Supprimer la bureaucratie commerciale"
 HOL_remove_trade_tape_desc: "Réduire les barrières bureaucratiques au commerce facilitera des transactions internationales plus fluides, boostant exportations et croissance économique."
 HOL_diversify_housing: "Diversifier le logement"
 HOL_diversify_housing_desc: "Pour remédier à la pénurie de logements et offrir des options abordables, le CDA investira dans des projets diversifiés : logement social, locatif et accession à la propriété."
 HOL_balkenende_resigns: "Balkenende IV démissionne"
 HOL_balkenende_resigns_desc: "Respectant le principe de rotation ministérielle du CDA, le Premier ministre Jan Peter Balkenende s'est retiré après deux mandats. Cette décision marque la fin du cabinet Balkenende IV et le début d'un nouveau chapitre pour le CDA, assurant des perspectives et un leadership renouvelés."
 HOL_maxime_verhagen: "Maxime Verhagen"
 HOL_maxime_verhagen_desc: "Maxime Verhagen est un diplomate habile et un bâtisseur de coalitions, connu pour son leadership pragmatique. Son accent sur le renforcement des alliances internationales et le maintien de la stabilité en a fait une figure respectée en politique néerlandaise et mondiale."
 HOL_trust_in_people: "Confiance dans les gens "
 HOL_trust_in_people_desc: "Bâtir la confiance dans nos citoyens est essentiel à une société cohésive. Le CDA promouvra des politiques qui autonomisent les individus et favorisent le respect mutuel."
 HOL_trust_in_organizations: "Confiance dans les organisations"
 HOL_trust_in_organizations_desc: "Le CDA renforcera l'intégrité et la transparence des organisations, assurant qu'elles opèrent de façon éthique et contribuent positivement à la société."
 HOL_active_society: "Société active"
 HOL_active_society_desc: "Encourager la citoyenneté active et l'engagement communautaire est central à la vision du CDA. Nous soutiendrons les initiatives qui favorisent le bénévolat et l'engagement civique."
 HOL_micro_credit: "Autoriser le microcrédit"
 HOL_micro_credit_desc: "Faciliter l'accès au microcrédit autonomisera petites entreprises et entrepreneurs, stimulant croissance et innovation à la base."
 HOL_public_private_innovation: "Innovation public-privé"
 HOL_public_private_innovation_desc: "Promouvoir la collaboration entre secteurs privé et public stimulera l'innovation et renforcera l'efficacité des services publics."
 HOL_heavy_efforts_clean_industry: "Efforts massifs pour les énergies propres"
 HOL_heavy_efforts_clean_industry_desc: "Intensifier les efforts pour promouvoir l'énergie propre réduira notre empreinte carbone et assurera un avenir durable aux Pays-Bas."
 HOL_invest_bio_agriculture: "Investir dans la bioagriculture"
 HOL_invest_bio_agriculture_desc: "Soutenir les initiatives de bio-agriculture promouvra des pratiques agricoles durables, assurant la santé de long terme de notre environnement et de notre alimentation."
 HOL_buma: "Sybrand van Haersma Buma"
 HOL_buma_desc: "Après la démission de Balkenende, Sybrand van Haersma Buma prend la tête du CDA, apportant un regain d'attention aux valeurs traditionnelles et à la justice sociale."
 HOL_reform_justice_system: "Réformer le système judiciaire"
 HOL_reform_justice_system_desc: "Réformer le système judiciaire renforcera équité, efficacité et accessibilité, assurant à tous les citoyens un égal accès à la justice."
 HOL_modern_investments_police: "Investissements policiers modernes"
 HOL_modern_investments_police_desc: "De nouveaux investissements dans la police assureront la sécurité publique et le respect de l'État de droit, créant un environnement sûr pour tous les citoyens."
 HOL_traditional_values: "Valeurs traditionnelles"
 HOL_traditional_values_desc: "Le CDA reste attaché aux valeurs traditionnelles — famille, communauté et responsabilité sociale — comme fondement de notre société."
 HOL_rentmeesterschap: "Rentmeesterschap"
 HOL_rentmeesterschap_desc: "Embrassant le principe de « rentmeesterschap » (gérance), le CDA promouvra une gestion durable des ressources, assurant leur préservation pour les générations futures tout en stimulant la croissance économique."
 HOL_green_economy: "Économie verte"
 HOL_green_economy_desc: "La transition vers une économie verte est essentielle au développement durable. Le CDA soutiendra les initiatives de technologies et pratiques écologiques, équilibrant croissance et protection de l'environnement."
 HOL_reduce_european_influence: "Réduire l’influence européenne"
 HOL_reduce_european_influence_desc: "Pour préserver la souveraineté néerlandaise et prioriser les intérêts nationaux, le CDA plaidera pour une réduction de l'influence de l'Union européenne sur les politiques intérieures."
 HOL_fortress_of_values: "Forteresse de valeurs"
 HOL_fortress_of_values_desc: "Sybrand Buma vise à renforcer le tissu social et l'identité nationale des Pays-Bas en promouvant valeurs traditionnelles et résilience. Ses politiques visent une nation unie et sûre, insistant sur la protection de la culture et de l'héritage néerlandais. En renforçant les principes fondamentaux du pays, Buma cherche une société ferme face aux menaces extérieures et aux divisions internes, tout en encourageant une citoyenneté forte et fière."
 HOL_melkert_surprise: "Victoire surprise de Melkerts"
 HOL_melkert_surprise_desc: "Sous la direction d'Ad Melkert, le PvdA a introduit des politiques inattendues et innovantes visant à revitaliser la nation. Ces initiatives promettent des changements positifs et posent les bases d'une société plus inclusive et prospère."
 HOL_inclusive_society: "Société inclusive"
 HOL_inclusive_society_desc: "Créer une société inclusive où chacun se sent valorisé et respecté est un principe central du PvdA. Nous mettrons en œuvre des politiques de soutien à la diversité et à la cohésion sociale, assurant que tous les citoyens puissent pleinement participer à notre communauté."
 HOL_democratic_active_government: "Gouvernement démocratique et actif"
 HOL_democratic_active_government_desc: "Le PvdA s'engage à renforcer les institutions démocratiques et à promouvoir l'engagement citoyen actif en politique. Nous assurerons un gouvernement transparent, responsable et réactif aux besoins de tous les citoyens."
 HOL_strong_european_union: "Une Union européenne forte"
 HOL_strong_european_union_desc: "Le PvdA soutient une Union européenne forte, démocratique et socialement responsable. Nous travaillerons à une intégration économique et politique plus profonde, promouvant coopération et solidarité entre États membres."
 HOL_accessible_healthcare: "Soins de santé accessibles"
 HOL_accessible_healthcare_desc: "Assurer à chacun l'accès à des soins de haute qualité est une priorité du PvdA. Nous étendrons les services de santé publique, réduirons les délais d'attente et garantirons des soins abordables pour tous."
 HOL_social_security: "Sécurité sociale pour tous"
 HOL_social_security_desc: "Renforcer le système de sécurité sociale est crucial pour protéger les plus vulnérables. Le PvdA veillera à ce que les prestations suffisent aux besoins de base de tous les citoyens, offrant un soutien dans les moments difficiles."
 HOL_work_care_for_all: "Travail et soins pour tous"
 HOL_work_care_for_all_desc: "Le PvdA garantit l'accès à un travail rémunéré et à des soins de qualité pour chacun. Nous soutiendrons des politiques aidant à concilier travail, responsabilités de soin et développement personnel, créant une société plus solidaire et inclusive."
 HOL_fair_wages: "Salaires et prestations équitables"
 HOL_fair_wages_desc: "Assurer des salaires et prestations équitables pour tous les travailleurs est essentiel pour réduire les inégalités de revenus. Le PvdA mettra en œuvre des politiques de juste rémunération et soutiendra la négociation collective, assurant la sécurité financière des plus vulnérables."
 HOL_job_creation_security: "Création d'emplois et sécurité"
 HOL_job_creation_security_desc: "Créer des opportunités d'emploi pour tous les citoyens est essentiel. Le PvdA investira dans la formation, soutiendra les PME et veillera à ce que chacun ait une chance de trouver un travail significatif, favorisant la sécurité de l'emploi et réduisant le chômage."
 HOL_quality_education_for_all: "Une éducation de qualité pour tous"
 HOL_quality_education_for_all_desc: "Investir dans l'éducation à tous les niveaux est clé pour que chaque enfant et adulte ait accès à un apprentissage de qualité. Le PvdA soutiendra la formation professionnelle, l'apprentissage tout au long de la vie et veillera à ce que les programmes répondent aux besoins du marché du travail."
 HOL_sustainable_economic_growth: "Croissance économique durable"
 HOL_sustainable_economic_growth_desc: "Le PvdA mise sur une croissance économique durable bénéficiant à tous les citoyens. Nous investirons dans les renouvelables, l'innovation et les technologies vertes pour bâtir une économie résiliente et durable pour les générations futures."
 HOL_invest_childcare_pvda: "Investir dans les gardes d'enfants sociales"
 HOL_invest_childcare_pvda_desc: "Augmenter le financement des services de garde est essentiel pour soutenir les parents qui travaillent et promouvoir le développement de la petite enfance. Le PvdA veillera à ce que des options abordables et de qualité soient disponibles pour toutes les familles."
 HOL_elderly_care: "Soins aux personnes âgées"
 HOL_elderly_care_desc: "Fournir des services de soins complets aux personnes âgées est une priorité du PvdA. Nous veillerons à ce que notre population âgée reçoive le soutien nécessaire pour vivre dans la dignité et l'indépendance, promouvant les soins de proximité et soutenant les aidants familiaux."
 HOL_child_youth_welfare: "Bien-être de l'enfance et de la jeunesse"
 HOL_child_youth_welfare_desc: "Investir dans des programmes de bien-être et de développement des enfants et des jeunes est essentiel. Le PvdA assurera l'accès à l'éducation, aux soins et aux loisirs, promouvant le bien-être de nos plus jeunes citoyens."
 HOL_social_tech_revolution: "Révolution technologique"
 HOL_social_tech_revolution_desc: "Embrasser la révolution technologique est crucial pour que chacun puisse participer à la société de l'information. Le PvdA investira dans l'éducation, l'infrastructure numérique et des initiatives comblant la fracture numérique, promouvant innovation technologique et inclusivité."
 HOL_green_urban_development: "Développement urbain vert"
 HOL_green_urban_development_desc: "Promouvoir un développement urbain durable alliant forte densité de logements et haute qualité de vie est une priorité du PvdA. Nous veillerons à des villes fortes, inclusives et écologiques, investissant dans les infrastructures vertes et les espaces publics."
 HOL_sustainable_agriculture: "Agriculture durable"
 HOL_sustainable_agriculture_desc: "Soutenir des pratiques agricoles durables est vital pour la sécurité alimentaire et la protection de l'environnement. Le PvdA promouvra l'agriculture biologique, un usage responsable des terres et la réduction de la pollution agricole."
 HOL_renewable_energy_investments: "Investissements dans les énergies renouvelables"
 HOL_renewable_energy_investments_desc: "Investir massivement dans les renouvelables est crucial pour réduire notre dépendance aux fossiles et combattre le changement climatique. Le PvdA soutiendra des projets solaires, éoliens et hydroélectriques pour un avenir énergétique durable."
 HOL_new_socialist_age: "Nouvel âge de la social-démocratie"
 HOL_new_socialist_age_desc: "Pour rester pertinent et efficace, le PvdA se transformera afin de mieux répondre aux besoins de la société moderne. Cela passe par la mise à jour de nos politiques, l'engagement des nouvelles générations et l'adoption d'approches innovantes de gouvernance."
 HOL_samsom: "Samson"
 HOL_samsom_desc: "Diederik Samsom a été élu nouveau leader du PvdA. Connu pour sa forte posture environnementale, Samsom vise à orienter le parti vers un avenir plus vert et plus durable tout en maintenant justice sociale et inclusivité."
 HOL_environmental_vision: "Vision environnementale"
 HOL_environmental_vision_desc: "Sous la direction de Diederik Samsom, le PvdA priorisera la durabilité environnementale. Nous mettrons en œuvre des politiques complètes pour protéger nos ressources naturelles et promouvoir un environnement sain pour les générations futures."
 HOL_green_economy_pvda: "Économie verte"
 HOL_green_economy_pvda_desc: "Diederik Samsom plaide pour la transition vers une économie verte en promouvant technologies écologiques et pratiques durables. Cela créera des emplois, stimulera l'innovation et protégera l'environnement."
 HOL_circular_economy: "Économie Circulaire"
 HOL_circular_economy_desc: "Pour réduire les déchets et promouvoir la durabilité, nous développerons une économie circulaire qui réutilise, répare et recycle les matériaux. Cette approche assure un cycle de production durable et minimise l'impact environnemental."
 HOL_energy_transition: "Transition vers les énergies vertes"
 HOL_energy_transition_desc: "Accélérer la transition énergétique est crucial pour un avenir durable. Nous sortirons des fossiles, investirons dans les renouvelables et soutiendrons les innovations en stockage et efficacité énergétiques."
 HOL_digital_innovation: "Innovation numérique"
 HOL_digital_innovation_desc: "Promouvoir l'innovation numérique est essentiel à la croissance et à la modernisation. Nous soutiendrons les start-up tech, investirons dans l'infrastructure informatique et renforcerons la culture numérique pour garder les Pays-Bas à la pointe."
 HOL_social_justice: "Justice sociale"
 HOL_social_justice_desc: "Assurer la justice sociale est central à la vision de Diederik Samsom. Nous nous attaquerons aux inégalités de revenus, promouvrons l'égalité des chances et veillerons à ce que tous les citoyens puissent pleinement participer à la société."
 HOL_inclusive_society_pvda: "Société inclusive"
 HOL_inclusive_society_pvda_desc: "Bâtir une société inclusive où chacun se sent valorisé et respecté est essentiel. Nous promouvrons des politiques de diversité et d'inclusion dans tous les aspects de la vie."
 HOL_innovation_in_education: "Innovation sociale dans l'éducation"
 HOL_innovation_in_education_desc: "Moderniser l'éducation pour préparer les étudiants à l'avenir est clé. Nous investirons dans les outils d'apprentissage numériques, l'éducation STEM et la formation des enseignants pour un système éducatif de haute qualité."
 HOL_affordable_living: "Une vie abordable"
 HOL_affordable_living_desc: "Assurer des conditions de vie abordables est une priorité. Nous investirons dans le logement social, réglementerons le marché locatif et fournirons des subventions pour rendre le logement accessible à tous."
 HOL_public_health_initiatives: "Initiatives de santé publique"
 HOL_public_health_initiatives_desc: "Soutenir des initiatives de santé publique globales est crucial. Nous nous concentrerons sur la prévention, la santé mentale et la réduction des disparités de santé pour que chacun ait accès à des soins de qualité."
 HOL_fusion_groenlinks: "S'unir à GroenLinks"
 HOL_fusion_groenlinks_desc: "Le moment est venu pour le Parti travailliste et GroenLinks d'unir leurs forces sous la direction de Frans Timmermans. En fusionnant nos valeurs partagées et nos visions progressistes, nous pouvons créer un front uni qui défend l'action climatique, l'égalité sociale et un avenir durable pour les Pays-Bas."
 HOL_asscher: "Asscher"
 HOL_asscher_desc: "Lodewijk Asscher a été élu nouveau leader du PvdA. Connu pour son accent sur le marché du travail, la sécurité sociale et l'intégration, Asscher vise à orienter le parti vers plus d'équité sociale et de résilience économique."
 HOL_labour_market_reforms: "Réformes du marché du travail"
 HOL_labour_market_reforms_desc: "Lodewijk Asscher s'attache à créer un marché du travail inclusif. Nous soutiendrons les programmes de formation, combattrons la discrimination et assurerons des salaires équitables pour tous les travailleurs."
 HOL_integration_policies: "Politiques d'intégration"
 HOL_integration_policies_desc: "Promouvoir des politiques d'intégration efficaces est clé pour une société cohésive. Asscher soutient les initiatives facilitant l'intégration des immigrants et réfugiés dans la société néerlandaise."
 HOL_workplace_equality: "Égalité sur le lieu de travail"
 HOL_workplace_equality_desc: "Assurer l'égalité au travail est vital pour une société juste. Asscher mettra en œuvre des politiques pour prévenir la discrimination et promouvoir la diversité sur le lieu de travail."
 HOL_strengthening_social_security: "Renforcement de la sécurité sociale"
 HOL_strengthening_social_security_desc: "Un système de sécurité sociale robuste est clé. Asscher mettra en œuvre des politiques pour protéger les plus vulnérables et offrir un soutien dans les moments de besoin."
 HOL_child_welfare: "Protection de l'enfance"
 HOL_child_welfare_desc: "Le bien-être des enfants est une priorité. Asscher plaide pour un financement accru des programmes de protection de l'enfance, dont l'éducation préscolaire, les soins et le soutien aux familles."
 HOL_social_innovation: "Innovation sociale"
 HOL_social_innovation_desc: "Promouvoir l'innovation sociale est essentiel pour affronter des défis sociaux complexes. Nous soutiendrons les initiatives de collaboration pour développer des solutions innovantes."
 HOL_educational_equity: "Équité éducative"
 HOL_educational_equity_desc: "Assurer l'équité éducative pour tous les élèves est crucial. Asscher investira dans les écoles des zones défavorisées, fournira un soutien supplémentaire aux élèves en difficulté et promouvra une éducation inclusive."
 HOL_poverty_reduction: "Réduction de la pauvreté"
 HOL_poverty_reduction_desc: "Réduire la pauvreté est essentiel à une société juste. Nous mettrons en œuvre des programmes complets de réduction de la pauvreté, dont des prestations sociales accrues et un soutien ciblé aux populations vulnérables."
 HOL_digital_literacy: "Littératie numérique"
 HOL_digital_literacy_desc: "Améliorer la culture numérique est crucial dans le monde technologique d'aujourd'hui. Asscher soutient des initiatives pour que tous les citoyens aient les compétences nécessaires à réussir dans l'économie numérique."
 HOL_economic_resilience: "Résilience économique"
 HOL_economic_resilience_desc: "Bâtir la résilience économique est essentiel pour affronter les crises futures. Nous investirons dans des secteurs diversifiés, soutiendrons les PME et créerons un filet de sécurité robuste pour tous les citoyens."
 HOL_labour_rights: "Droits du travail"
 HOL_labour_rights_desc: "Asscher est un fervent défenseur des droits du travail. Nous renforcerons les protections des travailleurs, assurerons des conditions de travail sûres et soutiendrons le droit à la négociation collective."
 HOL_sustainable_urban_development: "Développement urbain durable"
 HOL_sustainable_urban_development_desc: "Soutenir un développement urbain durable est clé pour des villes habitables. Nous investirons dans les infrastructures vertes, les espaces publics et des projets de logement durable."
 HOL_social_housing: "Logement Social"
 HOL_social_housing_desc: "Étendre le logement social est crucial face à la crise du logement. Asscher investira dans la construction et la rénovation de logements abordables pour que chacun ait un toit sûr."
 HOL_bos: "Bos"
 HOL_bos_desc: "Wouter Bos a été élu nouveau leader du PvdA. Connu pour son expertise économique et son rôle pendant la crise financière, Bos vise à orienter le parti vers stabilité et croissance tout en assurant la justice sociale."
 HOL_economic_expertise: "Expertise économique"
 HOL_economic_expertise_desc: "Wouter Bos est réputé pour son expertise économique. Sous sa direction, le PvdA se concentrera sur des politiques économiques saines pour assurer la stabilité et promouvoir une croissance durable."
 HOL_crisis_management: "Gestion de crise"
 HOL_crisis_management_desc: "L'expérience de Wouter Bos dans la gestion des crises financières est inestimable. Nous mettrons en œuvre des mesures robustes pour que l'économie reste résiliente face aux défis mondiaux."
 HOL_financial_sector_reform: "Réforme du secteur financier"
 HOL_financial_sector_reform_desc: "Des réformes complètes du secteur financier sont essentielles pour prévenir de futures crises et promouvoir transparence et responsabilité. Wouter Bos mènera les efforts pour réglementer efficacement l'industrie financière."
 HOL_progressive_taxation: "Fiscalité progressive"
 HOL_progressive_taxation_desc: "Mettre en œuvre un système fiscal juste et progressif est clé pour réduire les inégalités et financer les services publics. Le PvdA sous Bos veillera à ce que les plus fortunés paient leur juste part."
 HOL_affordable_housing: "Logement abordable"
 HOL_affordable_housing_desc: "Face à la crise du logement, Wouter Bos soutient des politiques d'augmentation de l'offre abordable. Nous investirons dans le logement social et fournirons des subventions pour rendre l'accession accessible à tous."
 HOL_employment_opportunities: "Possibilités d'emploi"
 HOL_employment_opportunities_desc: "Assurer suffisamment d'opportunités d'emploi est aussi une priorité de Wouter Bos. Ce n'est qu'en garantissant l'emploi des gens que nous pourrons bâtir une société stable et en développement."
 HOL_universal_healthcare: "Soins de santé universels"
 HOL_universal_healthcare_desc: "Assurer à chacun l'accès à des soins de haute qualité est une priorité de Wouter Bos. Nous étendrons les services de santé publique, réduirons les délais d'attente et garantirons des soins abordables pour tous."
 HOL_fiscal_responsibility: "Responsabilité fiscale"
 HOL_fiscal_responsibility_desc: "Wouter Bos s'engage à maintenir un budget équilibré tout en finançant adéquatement les services publics essentiels. En exerçant une responsabilité budgétaire, nous assurerons que l'économie néerlandaise reste stable et durable pour les générations futures."
 HOL_green_economic_growth: "Croissance économique verte"
 HOL_green_economic_growth_desc: "Pour une prospérité de long terme, Wouter Bos défendra une politique économique axée sur une croissance verte et durable. Nous investirons dans l'énergie propre, les emplois verts et les infrastructures écologiques pour pérenniser l'économie et combattre le changement climatique."
 HOL_debt_relief_programs: "Programmes d'allègement de la dette"
 HOL_debt_relief_programs_desc: "Pour alléger le fardeau financier des populations vulnérables, Wouter Bos mettra en œuvre des programmes d'allègement de dette pour particuliers et PME. Cela autonomisera foyers et entrepreneurs en difficulté, favorisant mobilité économique et stabilité."
 HOL_strengthening_eurozone: "Renforcer la zone euro"
 HOL_strengthening_eurozone_desc: "Wouter Bos reconnaît l'importance d'une zone euro forte et résiliente pour la stabilité de l'économie néerlandaise. En menant les efforts pour la renforcer, nous promouvrons coordination budgétaire et coopération économique au sein de l'UE pour une prospérité de long terme."
 HOL_small_business_support: "Soutien aux petites entreprises"
 HOL_small_business_support_desc: "Soutenir les PME est clé d'une économie florissante. Wouter Bos mettra en œuvre des politiques d'allègement fiscal, d'accès au crédit et de réduction des barrières bureaucratiques, permettant aux petites entreprises de croître et de créer des emplois."
 HOL_lpf: "La nuit de Pim Fortuyn"
 HOL_lpf_desc: "La Lijst Pim Fortuyn (LPF) a été fondée pour briser le statu quo politique. Sous la direction de Pim Fortuyn, la LPF défend souveraineté nationale, ordre public et une société néerlandaise fière et sûre d'elle. Ce mouvement défiera les élites politiques installées et poussera à des réformes audacieuses qui placent les Pays-Bas en premier."
 HOL_support_sme: "Soutien aux petites et moyennes entreprises"
 HOL_support_sme_desc: "Les PME sont l'épine dorsale de l'économie néerlandaise. La LPF réduira les réglementations et offrira un soutien aux PME, leur permettant de prospérer et de stimuler la croissance."
 HOL_pvv: "L'ascension de Wilders sur la scène politique"
 HOL_pvv_desc: "Le Parti pour la liberté, ou PVV, fondé par Geert Wilders, plaide pour des politiques priorisant souveraineté néerlandaise, préservation culturelle et sécurité. Le PVV vise à réduire l'immigration, restaurer la fierté nationale et défier l'influence de l'UE, assurant que les Pays-Bas restent une patrie sûre et prospère. Axé sur l'opposition à l'extrémisme islamique et la protection des valeurs traditionnelles, le PVV se pose en voix de l'identité et de l'indépendance néerlandaises."
 HOL_restore_royal_authority: "Restaurer l’autorité royale"
 HOL_restore_royal_authority_desc: "La monarchie doit réaffirmer son autorité comme colonne vertébrale de la gouvernance néerlandaise. En consolidant le pouvoir, la Couronne assurera stabilité et unité au sein de la nation."
 HOL_establish_stadtholderate: "Établir le stathoudérat"
 HOL_establish_stadtholderate_desc: "Un stathoudérat moderne permettra une gouvernance équilibrée, assurant la responsabilité démocratique tout en préservant l'influence directrice de la monarchie."
 HOL_restore_royal_privileges: "Restaurer les privilèges royaux"
 HOL_restore_royal_privileges_desc: "Rétablir les privilèges historiques de la monarchie pour assurer la stabilité et protéger les traditions et valeurs de la nation."
 HOL_voc: "Ranimer l'esprit de la VOC"
 HOL_voc_desc: "La VOC (Compagnie néerlandaise des Indes orientales) fut jadis le moteur de l'influence mondiale des Pays-Bas, créant un empire de commerce et d'innovation. En modernisant sa mission, nous pouvons canaliser son esprit pour réaffirmer l'influence néerlandaise sur des régions clés du commerce mondial au XXIe siècle."
 HOL_reclaim_voc_territories: "Se mobiliser pour reconquérir les terres de la VOC"
 HOL_reclaim_voc_territories_desc: "Le temps des paroles est passé. L'héritage de la VOC exige l'action, et notre armée est prête à mener la charge. En reconquérant les territoires de notre passé légendaire, nous restaurerons l'influence néerlandaise et assurerons à nouveau notre place de puissance mondiale."
 HOL_asml_tsmc_partnership: "Forger un partenariat ASML-TSMC"
 HOL_asml_tsmc_partnership_desc: "La production de semi-conducteurs de TSMC et l'expertise en lithographie d'ASML font de Taïwan un nœud technologique stratégique. Un partenariat entre ASML et TSMC assurera que les Pays-Bas deviennent un acteur indispensable de la course technologique mondiale."
 HOL_voc_territory_focus: "Se concentrer sur les territoires de la VOC hors Indonésie"
 HOL_voc_territory_focus_desc: "La VOC rétablie, nous devons décider de reconquérir l'Indonésie ou de nous concentrer sur d'autres territoires clés. En nous portant vers l'Inde, l'Afrique du Sud, Taïwan et le Sri Lanka, nous pouvons reconstruire le réseau mondial de la VOC. L'Indonésie peut attendre. Notre ambition s'étend bien au-delà de ses rives."
 HOL_wic: "Ranimer la Compagnie des Indes occidentales"
 HOL_wic_desc: "La Compagnie des Indes occidentales (WIC) fut jadis la pierre angulaire de l'influence néerlandaise dans les Amériques et l'Atlantique. En raniment ses opérations, nous pouvons réaffirmer notre contrôle sur des territoires stratégiques, stimuler le commerce et étendre notre portée dans l'hémisphère occidental."
 HOL_d66: "D66"
 HOL_d66_desc: "D66 se dresse comme un phare du progressisme aux Pays-Bas, défendant démocratie, durabilité et égalité sociale. Notre vision vise à mener la nation vers un avenir d'innovation, d'inclusivité et de coopération, assurant que chaque citoyen ait voix et part à la construction d'un meilleur demain."
 HOL_d66_democratic_institutions: "Renforcer les institutions démocratiques"
 HOL_d66_democratic_institutions_desc: "D66 s'engage à sauvegarder les fondements de la démocratie. En accroissant transparence, responsabilité et participation publique, nous assurerons que notre gouvernement reste juste et efficace au service de son peuple."
 HOL_d66_direct_democracy: "Promouvoir la démocratie directe"
 HOL_d66_direct_democracy_desc: "Les citoyens méritent une voix plus forte dans les politiques qui les concernent. En défendant des initiatives comme les référendums contraignants et le budget participatif, D66 rapprochera la décision du peuple."
 HOL_d66_rule_of_law: "Défendre l'État de droit"
 HOL_d66_rule_of_law_desc: "L'État de droit est vital à une société juste et fonctionnelle. D66 veillera à l'indépendance judiciaire, à la protection des libertés civiles et à la lutte contre la corruption à tous les niveaux de gouvernance."
 HOL_d66_climate_action_plan: "Mettre en œuvre un plan d'action climatique"
 HOL_d66_climate_action_plan_desc: "La crise climatique est l'un des plus grands défis de notre temps. En agissant de façon décisive, notamment en réduisant les émissions et en promouvant les renouvelables, D66 mènera la charge vers un avenir durable."
 HOL_d66_green_energy: "Étendre les investissements dans les énergies vertes"
 HOL_d66_green_energy_desc: "La transition vers les renouvelables est clé d'un avenir plus propre. D66 priorisera les investissements dans l'éolien, le solaire et d'autres projets durables pour réduire notre dépendance aux fossiles."
 HOL_d66_european_initiative: "Renforcer la coopération européenne"
 HOL_d66_european_initiative_desc: "D66 croit que l'Union européenne est essentielle à notre prospérité et à notre sécurité collectives. Renforcer les liens avec l'UE assurera que les Pays-Bas restent un membre influent de la communauté européenne."
 HOL_d66_social_progress: "Faire progresser le progrès social"
 HOL_d66_social_progress_desc: "Égalité, inclusivité et justice sont les piliers d'une société progressiste. D66 défendra des politiques pour combattre les inégalités, protéger les minorités et promouvoir l'égalité des chances pour tous les citoyens."
 HOL_d66_education_investments: "Investir dans l'éducation"
 HOL_d66_education_investments_desc: "L'éducation est la clé du potentiel des générations futures. D66 priorisera financement et réforme pour que chaque enfant ait accès à une éducation de haute qualité."
 HOL_sgp: "Staatkundig Gereformeerde Partij"
 HOL_sgp_desc: "Le Staatkundig Gereformeerde Partij (SGP) se dresse comme un bastion du conservatisme chrétien. Dévoué à une gouvernance selon les principes bibliques, le SGP plaide pour une société morale enracinée dans la foi, la famille et la tradition."
 HOL_gl: "Liens verts"
 HOL_gl_desc: "GroenLinks se consacre à une société durable, juste et inclusive. Enraciné dans l'écologisme et la justice sociale, le parti défend énergie verte, biodiversité et égalité comme piliers de l'avenir des Pays-Bas."
 HOL_asml_high_na_euv: "Lithographie EUV Pioneer à haute NA"
 HOL_asml_high_na_euv_desc: "Les systèmes TWINSCAN EXE de nouvelle génération d'ASML poussent la lithographie à une ouverture numérique de 0,55, imprimant des circuits plus fins qu'aucun rival. Maîtriser l'EUV High-NA maintient nos machines indispensables à chaque fonderie de pointe de la planète."
 HOL_asml_imec_partnership: "Ouvrir le laboratoire conjoint High-NA avec l'imec"
 HOL_asml_imec_partnership_desc: "À Veldhoven, ASML et l'institut de recherche imec opèrent un laboratoire conjoint High-NA EUV, donnant aux fabricants de puces et aux fournisseurs de matériaux leur premier accès aux nouveaux scanners. Le labo ancre les Pays-Bas comme terrain d'essai des semi-conducteurs les plus avancés au monde."
 HOL_asml_brainport_campus: "Étendre le campus industriel Brainport"
 HOL_asml_brainport_campus_desc: "Adossé à un engagement public de plusieurs milliards d'euros, ASML s'étend sur le campus industriel Brainport près d'Eindhoven plutôt que de s'installer à l'étranger. Nouvelles salles blanches et installations de fournisseurs ancrent l'industrie des puces, et ses recettes fiscales, fermement sur le sol néerlandais."
 HOL_support_intervention_iraq: "Soutenir l'intervention en Irak"
 HOL_support_intervention_iraq_desc: "Au lendemain des attentats du 11 septembre et de l'instabilité croissante au Moyen-Orient, les États-Unis ont lancé une intervention militaire en Irak, citant la menace d'armes de destruction massive et la nécessité de démanteler des régimes autoritaires. Allié proche de l'OTAN et avocat de la sécurité internationale, les Pays-Bas doivent décider s'ils soutiennent cette opération. Si la mission reste controversée, rejoindre la coalition réaffirmerait notre partenariat transatlantique et projetterait l'influence néerlandaise dans les efforts de sécurité mondiale."
 HOL_asml_partnership_USA: "Former le partenariat technologique ASML–USA"
 HOL_asml_partnership_USA_desc: "ASML est au cœur de l'industrie mondiale des semi-conducteurs, et les États-Unis cherchent à assurer leur avance technologique dans le fossé Est-Ouest croissant. En formant une alliance stratégique entre les secteurs de R&D néerlandais et américains, nous pouvons mener l'innovation conjointe en lithographie avancée, cyberdéfense et fabrication aérospatiale. Ce partenariat renforcera notre position dans l'écosystème de défense occidental, mais peut avoir un coût diplomatique."
 HOL_lng_cooperation: "Établir l'accord stratégique Shell–GNL"
 HOL_lng_cooperation_desc: "Les défis énergétiques du XXIe siècle exigent résilience, diversification et alliances stratégiques. En étendant la coopération GNL avec Shell et en alignant notre logistique énergétique sur des partenaires clés, nous pouvons sécuriser des flux de carburant stables, renforcer l'investissement infrastructurel et soutenir nos réseaux d'approvisionnement mondiaux. Toutefois, une dépendance accrue aux routes fossiles peut provoquer un retour de bâton environnemental et politique."
 HOL_d66_climate_action_planidea: "Plan d'action climatique D66"
 HOL_d66_climate_action_planidea_desc: "Avec un engagement audacieux contre le changement climatique, le plan d'action climatique D66 accélère la transition vers les renouvelables, priorise la durabilité et réduit les émissions, positionnant les Pays-Bas en leader des efforts environnementaux mondiaux."
 HOL_shell1: "Coquille Royale"
 HOL_shell1_desc: "Shell, officiellement Royal Dutch Shell, est une compagnie pétrolière et gazière multinationale dont le siège est à La Haye, aux Pays-Bas, et constituée au Royaume-Uni. Fondée en 1907, Shell est l'une des plus grandes compagnies énergétiques mondiales, impliquée dans tous les aspects de l'industrie pétrolière et gazière : exploration, production, raffinage et distribution. Elle a aussi des intérêts significatifs dans les renouvelables et l'infrastructure des véhicules électriques."
 HOL_shell2a: "Coquille verte royale"
 HOL_shell2a_desc: "Shell, géant énergétique mondial, se concentre de plus en plus sur la transition vers un avenir durable. La compagnie s'est fixé des objectifs ambitieux pour devenir une entreprise énergétique à émissions nettes nulles d'ici 2050. Shell investit massivement dans les renouvelables — éolien, solaire et biocarburants — et étend sa présence dans l'infrastructure des véhicules électriques. Par des initiatives comme le captage et stockage du carbone, Shell vise à réduire nettement son empreinte. Ce virage vers une énergie plus verte fait partie de sa stratégie plus large d'adaptation à la demande mondiale croissante de solutions plus propres."
 HOL_shell2b: "Coquille Royale"
 HOL_shell2b_desc: "Shell, l'une des plus grandes compagnies pétrolières et gazières du monde, reste une force dominante de l'industrie fossile. Avec un vaste réseau d'opérations — exploration, extraction, raffinage et distribution — Shell joue un rôle crucial dans l'approvisionnement énergétique mondial. La compagnie dispose de réserves et d'infrastructures étendues dédiées au pétrole et au gaz, contribuant significativement à la consommation énergétique mondiale. Malgré des investissements croissants dans les renouvelables, le cœur de métier de Shell reste fortement dépendant des fossiles."
 HOL_dutch_trade1: "Commerçants légendaires"
 HOL_dutch_trade1_desc: "Les négociants néerlandais ont une longue et riche histoire, jouant un rôle pivot dans le commerce mondial depuis le Siècle d'or du XVIIe siècle. Les Pays-Bas, par leur situation stratégique et leur vaste réseau de ports, sont depuis des siècles un pôle du commerce international. Les négociants néerlandais furent déterminants dans l'établissement de routes mondiales, notamment via la VOC, l'une des premières multinationales. Aujourd'hui, ils restent influents, notamment en agriculture, logistique et finance. Connus pour leur expertise logistique, l'innovation en chaîne d'approvisionnement et de solides connexions internationales, ils aident à maintenir la réputation des Pays-Bas comme acteur clé du commerce mondial."
 HOL_project_beethoven_state_idea1: "Projet Beethoven"
 HOL_project_beethoven_state_idea1_desc: "Le projet Beethoven est une initiative majeure du gouvernement néerlandais, en collaboration avec les autorités régionales, pour investir dans le climat des affaires et l'infrastructure du secteur des microprocesseurs à Brainport Eindhoven. Le projet vise à renforcer la compétitivité mondiale de la région en semi-conducteurs en répondant à des besoins critiques : talents, infrastructures et logement. Cet investissement est jugé essentiel pour maintenir la position des Pays-Bas comme pôle de haute technologie, avec un accent particulier sur la rétention d'acteurs clés comme ASML."
 HOL_randstad_economy1: "Randstad Économie"
 HOL_randstad_economy1_desc: "L'économie du Randstad désigne le moteur économique des Pays-Bas, englobant la zone fortement urbanisée et densément peuplée autour d'Amsterdam, Rotterdam, La Haye et Utrecht. Cette région est l'un des pôles économiques les plus importants d'Europe. Le Randstad se caractérise par une base économique diversifiée : finance, logistique, technologie, industries créatives et commerce. Amsterdam sert de grand centre financier, tandis que Rotterdam accueille l'un des plus grands ports du monde. La région bénéficie aussi d'une main-d'œuvre hautement qualifiée, d'infrastructures robustes et d'un fort accent sur l'innovation et la durabilité."
 HOL_zuidas_development_idea: "Développement de Zuidas"
 HOL_zuidas_development_idea_desc: "Le développement de Zuidas est un projet urbain d'envergure à Amsterdam, visant à créer un quartier d'affaires dynamique et mixte servant de pôle international du commerce, de la finance et des services juridiques. Souvent appelé le Mile financier des Pays-Bas, Zuidas accueille de nombreuses multinationales, cabinets d'avocats et institutions financières. Le développement est conçu pour être plus qu'un centre d'affaires, avec des zones résidentielles étendues, des équipements culturels, des espaces verts et une infrastructure de haute qualité, dont d'excellentes connexions de transport public."
 HOL_international_peace_city_idea: "La Haye, ville internationale de la paix et de la justice"
 HOL_international_peace_city_idea_desc: "La Haye est internationalement reconnue comme la Ville de la paix et de la justice, titre qui reflète son rôle de centre mondial du droit international et de la diplomatie. Accueillant plus de 200 organisations internationales, La Haye héberge des institutions clés comme la Cour internationale de justice, la Cour pénale internationale et la Cour permanente d'arbitrage. Ces institutions jouent un rôle crucial dans le règlement des différends internationaux, la poursuite des crimes de guerre et l'avancement des droits humains dans le monde."
 HOL_regio_economy1: "Économie de la province"
 HOL_regio_economy1_desc: "La puissance économique des Pays-Bas est de plus en plus portée par les atouts de ses régions. Au nord, des provinces comme Groningue excellent dans les renouvelables, tandis que l'est, dont la Gueldre, sont des pôles de fabrication avancée et de logistique. Les provinces du sud, dont le Brabant-Septentrional, mènent les industries de haute technologie comme les semi-conducteurs et la biotechnologie. Cette diversité régionale assure une économie nationale équilibrée et résiliente, chaque zone contribuant significativement à la prospérité et à la compétitivité mondiales du pays."
 HOL_marine_moving: "Déménagement maritime"
 HOL_marine_moving_desc: "Le gouvernement néerlandais a décidé de relocaliser le Korps Mariniers de sa base actuelle à Doorn vers une nouvelle installation à Flessingue. Ce déménagement visait à doter les marines d'une infrastructure moderne et à renforcer leurs capacités opérationnelles. Le choix de Flessingue, en Zélande, visait aussi à stimuler le développement économique régional et à offrir aux marines une situation stratégique près de la mer du Nord. Le plan a toutefois rencontré des résistances en raison de l'impact sur le personnel et les familles, ainsi que de défis logistiques et financiers."
 HOL_marine_moved: "Base marine moderne"
 HOL_marine_moved_desc: "La relocalisation du Korps Mariniers vers sa nouvelle base à Flessingue a été menée à bien. Les marines opèrent désormais depuis des installations de pointe qui renforcent nettement leur préparation opérationnelle. Le nouvel emplacement à Flessingue offre des avantages stratégiques, dont un accès rapide à la mer du Nord. Le déménagement a aussi contribué à la croissance économique de la Zélande, créant des emplois et attirant des investissements. Malgré les défis initiaux et les résistances pendant la planification, la transition s'est faite en douceur."
 HOL_marine_debate: "La réinstallation maritime débattue"
 HOL_marine_debate_desc: "La relocalisation des marines est débattue au Parlement, retardant le processus et créant de l'incertitude au sein des forces armées."
 HOL_marine_public_support: "Soutien public au relogement des marins"
 HOL_marine_public_support_desc: "Le gouvernement et le public sont favorables à la relocalisation des marines à Flessingue, boostant moral et efficacité."
 HOL_marine_relocation_cancelled: "Délocalisation maritime annulée"
 HOL_marine_relocation_cancelled_desc: "Le plan de relocalisation des marines à Flessingue a été abandonné. Cette décision restaure la stabilité mais réduit la capacité opérationnelle des marines."
 HOL_local_communities_support: "Soutien des communautés locales au relogement"
 HOL_local_communities_support_desc: "Les investissements dans les communautés locales autour de Flessingue ont amélioré le soutien public à la relocalisation des marines, stimulant croissance économique locale et capacité de production."
 HOL_marine1: "Koninklijke Marine"
 HOL_marine1_desc: "La Koninklijke Marine, ou marine royale néerlandaise, est la branche navale des forces armées néerlandaises et l'une des plus anciennes marines du monde, avec des origines remontant au XVe siècle. Elle joue un rôle crucial dans la défense des Pays-Bas, au pays comme à l'étranger, et participe à diverses missions internationales : OTAN, maintien de la paix et efforts humanitaires. Elle est connue pour sa flotte avancée et polyvalente : frégates, sous-marins, patrouilleurs et navires amphibies. La marine opère aussi une gamme d'aéronefs et d'hélicoptères, principalement pour patrouille maritime, transport et SAR. Le Korps Mariniers, corps d'élite des marines, est partie intégrante de la marine, spécialisé dans les opérations amphibies et la réaction rapide."
 HOL_submarine_modernization_idea: "Modernisation des sous-marins"
 HOL_submarine_modernization_idea_desc: "La modernisation des sous-marins est une initiative clé de la marine royale, axée sur la mise à niveau des Walrus vieillissants. Ces mises à niveau comprennent sonars avancés, furtivité améliorée et armement renforcé, assurant l'efficacité des sous-marins dans les opérations navales modernes. La modernisation vise à prolonger leur vie de service et à maintenir leur pertinence stratégique."
 HOL_cmp_idea: "Commissariat Militaire Production"
 HOL_cmp_idea_desc: "Le Commissariaat Militaire Productie (CMP), ou commissariat à la production militaire, était un organe gouvernemental néerlandais chargé de superviser et de coordonner la production d'équipements et de fournitures militaires. Son rôle premier était d'assurer que les forces de défense soient adéquatement équipées, surtout en temps de conflit ou de préparation accrue. Le CMP gérait les contrats avec l'industrie nationale, réglementait la production d'armes, de munitions, de véhicules et d'autres nécessités militaires, et veillait au respect des normes et des délais."
 HOL_army2: "Koninklijke Landmacht"
 HOL_army2_desc: "La Koninklijke Landmacht, ou armée de terre royale néerlandaise, est la branche terrestre des forces armées, aux racines remontant au XVIe siècle. Elle est responsable de la défense du territoire néerlandais et contribue aux missions internationales, dont le maintien de la paix OTAN et ONU. L'armée est équipée de véhicules, d'artillerie et de systèmes de communication modernes. C'est une force polyvalente, prête à affronter un éventail de défis de sécurité au pays comme à l'étranger."
 HOL_defensienota_idea: "Défensienota 2022"
 HOL_defensienota_idea_desc: "La Defensienota 2022 est un document de politique stratégique esquissant l'orientation future et les priorités du ministère néerlandais de la Défense. Elle aborde l'environnement de sécurité mondial changeant, soulignant le besoin d'une force de défense plus forte et plus adaptable. Thèmes clés : hausse des dépenses de défense, modernisation des capacités et coopération internationale renforcée, notamment au sein de l'OTAN et de l'UE. Le document met en avant les investissements en cyberdéfense, renseignement et technologies avancées, ainsi que l'expansion du personnel et des niveaux de préparation. Elle vise à assurer que les forces armées néerlandaises soient prêtes à affronter les menaces actuelles et émergentes."
 HOL_air: "Koninklijke Luchtmacht"
 HOL_air_desc: "La Koninklijke Luchtmacht, ou armée de l'air royale néerlandaise, est la branche aérienne des forces armées, chargée de défendre l'espace aérien néerlandais et de soutenir les opérations militaires nationales et internationales. Établie en 1953, elle opère une flotte moderne : chasseurs, avions de transport, hélicoptères et UAV. Elle joue un rôle crucial dans les missions OTAN, la police aérienne et le déploiement rapide. Elle participe aussi à l'aide humanitaire, à la réponse aux catastrophes et à la sécurité des territoires d'outre-mer. Avec sa technologie avancée et son personnel hautement formé, elle est un composant clé de la stratégie de défense du pays."
 HOL_dutch_army_doctrine1: "Défense néerlandaise"
 HOL_dutch_army_doctrine1_desc: "La Nederlandse Defensievisie est un document stratégique esquissant la vision et les objectifs de long terme du ministère de la Défense. Elle fournit un cadre pour le développement et l'adaptation des forces armées aux défis de sécurité futurs. La Defensievisie se concentre sur le renforcement de la flexibilité, de la résilience et des capacités technologiques face à un environnement de sécurité mondial de plus en plus complexe et imprévisible."
 HOL_dutch_army_doctrine_change: "Nederlandse Defensievisie Transitie"
 HOL_dutch_army_doctrine_change_desc: "L'esprit national Nederlandse Defensievisie Transitie représente une phase pivot de transformation des forces armées néerlandaises. Il signifie une période de modernisation et d'adaptation, axée sur de nouvelles capacités, le renforcement de la cyberdéfense et de la coopération internationale. Cet esprit national souligne la volonté d'accroître résilience et flexibilité militaires, les préparant aux défis du XXIe siècle. Il incarne l'effort collectif d'aligner la défense néerlandaise sur les besoins de sécurité mondiaux évolutifs, équilibrant tradition et innovation."
 HOL_marechaussee1: "Koninklijke Maréchaussée"
 HOL_marechaussee1_desc: "La Koninklijke Marechaussee, police militaire royale néerlandaise, joue un rôle crucial dans la sécurité nationale et le maintien de l'ordre. Responsable du contrôle des frontières, de la sécurité aéroportuaire et de la police militaire, la Marechaussee assure la sûreté et la stabilité des Pays-Bas au pays comme à l'étranger. Son expertise en sécurité intérieure, immigration et ordre public en fait une force indispensable. Unité bien formée et hautement adaptable, elle soutient les opérations civiles et militaires, contribuant à la résilience de la nation en temps de crise."
 HOL_paars1: "Fin de règne du gouvernement violet"
 HOL_paars1_desc: "L'héritage du cabinet « Paars II » est celui de l'innovation, du pragmatisme et d'une gouvernance équilibrée, reflétant le paysage politique divers des Pays-Bas et établissant un précédent pour les futures coalitions."
 HOL_dbb: "Service de sécurité et de protection"
 HOL_dbb_desc: "Le Service de sécurité et de protection (Dienst Bewaken en Beveiligen, DBB) est la pierre angulaire de la sauvegarde des figures les plus éminentes et des atouts critiques de la nation. Chargé de la protection des dirigeants politiques, des membres de la famille royale et des sites sensibles, le DBB opère avec une vigilance et un professionnalisme inégalés."
 HOL_debt_reduction: "Réduction de la dette"
 HOL_debt_reduction_desc: "Sous la direction de Gerrit Zalm, le VVD pousse la responsabilité budgétaire par une réduction ciblée de la dette, renforçant l'économie et assurant la stabilité financière de long terme."
 HOL_liberal_society_modifier: "Société libérale"
 HOL_economy_education_research: "Réforme éducative axée sur le marché"
 HOL_economy_education_research_desc: "Le VVD se concentre sur l'alignement des programmes éducatifs sur les demandes du marché pour doter les étudiants de compétences recherchées. En comblant le fossé entre éducation et marché du travail, nous renforçons l'employabilité et stimulons la croissance, assurant que les générations futures soient bien préparées à un marché de l'emploi en constante évolution."
 HOL_ministry_of_family1: "Ministère de la Famille"
 HOL_ministry_of_family1_desc: "Le ministère de la Famille se consacre au bien-être des familles à travers les Pays-Bas. Il élabore et met en œuvre des politiques de garde d'enfants, de congé parental et de soutien familial, assurant aux familles l'accès aux ressources nécessaires. Le ministère œuvre à créer un environnement nourricier qui favorise un développement sain et renforce les liens familiaux."
 HOL_weed_center1: "Politique néerlandaise du cannabis"
 HOL_weed_center1_desc: "Les Pays-Bas sont connus pour leur approche unique du cannabis, où possession et vente dans des « coffeeshops » licenciés sont tolérées sous une réglementation stricte. Cette politique pragmatique vise à séparer les marchés des drogues douces et dures tout en réduisant l'activité criminelle. Bien que techniquement illégal, le cannabis est de facto décriminalisé pour usage personnel, reflétant un équilibre entre santé publique, sécurité et liberté individuelle."
 HOL_unhcr1: "Supervision du HCR sur la migration"
 HOL_unhcr1_desc: "Le Haut Commissariat des Nations unies pour les réfugiés (HCR) supervise désormais les politiques et processus migratoires auparavant gérés par les Pays-Bas. Cette transition vise à garantir le respect des normes internationales de protection et de soutien aux réfugiés et migrants, offrant une approche plus coordonnée et humaine des défis migratoires mondiaux."
 HOL_balkenende_legend: "Héritage de Balkenende"
 HOL_balkenende_legend_desc: "Le mandat de Jan Peter Balkenende comme Premier ministre est marqué par son accent sur la cohésion sociale, la responsabilité et la stabilité économique. Sa vision d'une société de « normen en waarden » (normes et valeurs) visait à renforcer les fondements moraux et éthiques des Pays-Bas. L'héritage Balkenende continue d'influencer la politique néerlandaise, promouvant une gouvernance équilibrée valorisant à la fois communauté et responsabilité individuelle."
 HOL_green_socialism1: "Socialisme vert"
 HOL_green_socialism1_desc: "Le PvdA envisage un avenir où justice sociale et durabilité environnementale vont de pair. Le socialisme vert plaide pour une société juste et équitable priorisant le bien-être des personnes et de la planète. Par des politiques climatiques ambitieuses, l'investissement dans les renouvelables et une transition juste pour les travailleurs, le PvdA vise une économie durable qui ne laisse personne de côté."
 HOL_monarchy_law_blocking: "La vengeance du monarque"
 HOL_monarchy_law_blocking_desc: "Indignée par le refus du gouvernement d'approuver le mariage royal, la monarchie a pris la mesure extraordinaire de bloquer des législations clés en représailles. Cet acte de défi a plongé le paysage politique dans le chaos, la famille royale utilisant son influence pour contester l'autorité du gouvernement. Tandis que les tensions montent, cette intervention sans précédent a déclenché un débat national sur le rôle et le pouvoir de la monarchie dans la gouvernance moderne."
 HOL_monarch_public_campaign: "Vague de soutien populaire"
 HOL_monarch_public_campaign_desc: "En réponse au refus du gouvernement d'approuver le mariage royal, une vaste campagne de pression publique a émergé. Des citoyens de tout le pays se rassemblent derrière le couple royal, organisant manifestations, signant des pétitions et exigeant que le gouvernement reconsidère sa position. Cette vague de soutien a mis une immense pression sur les dirigeants politiques, soulignant la loyauté du peuple envers la monarchie et le désir que le droit d'aimer et de se marier transcende les frontières politiques."
 HOL_monarch_backlash: "Désillusion publique"
 HOL_monarch_backlash_desc: "La décision du couple royal d'aller de l'avant malgré le refus du gouvernement a entraîné une vague de mécontentement public. Beaucoup y voient un dépassement de la monarchie et un mépris des processus démocratiques. Le retour de bâton a été rapide, les citoyens questionnant la pertinence de la monarchie dans la société moderne. Les appels à la réforme, voire à l'abolition, gagnent du terrain tandis que la confiance dans la famille royale s'érode."
 HOL_pro_gay_marriage: "Premier pays de mariage homosexuel approuvé"
 HOL_pro_gay_marriage_desc: "Les Pays-Bas sont devenus un leader mondial du progrès social et des droits humains en légalisant le mariage entre personnes de même sexe. Cette décision a renforcé l'image de la nation comme société tolérante et inclusive, boostant unité nationale et prestige international."
 HOL_anti_gay_marriage: "Loi sur le mariage traditionnel"
 HOL_anti_gay_marriage_desc: "La décision de maintenir les lois traditionnelles sur le mariage reflète un fort attachement aux valeurs conservatrices. Si elle résonne auprès des groupes religieux et traditionalistes, elle a aussi suscité les critiques des voix plus progressistes et affecté la réputation du pays comme phare du libéralisme en Europe."
 HOL_labour_market_reforms_idea: "Réformes du marché du travail"
 HOL_labour_market_reforms_idea_desc: ""
 HOL_strong_social_security: "Sécurité sociale solide"
 HOL_strong_social_security_desc: ""
 HOL_poverty_reduction_idea: "Initiative de réduction de la pauvreté"
 HOL_poverty_reduction_idea_desc: "Les Pays-Bas ont lancé une initiative complète de réduction de la pauvreté. Par des prestations sociales accrues, un soutien ciblé aux populations vulnérables et une assistance économique, le gouvernement œuvre à élever les membres les plus défavorisés de la société. Ce programme vise une économie plus équitable et inclusive."
 HOL_poverty_reduced: "Pauvreté nettement réduite"
 HOL_poverty_reduced_desc: "Grâce à la mise en œuvre réussie de programmes sociaux et de réformes, la pauvreté aux Pays-Bas a été significativement réduite. L'accent national sur l'inclusivité économique et le soutien aux défavorisés a abouti à une plus grande stabilité sociale, un niveau de vie plus élevé et une économie plus forte et plus résiliente."
 HOL_digital_literacy_idea: "Campagne d'alphabétisation numérique"
 HOL_digital_literacy_idea_desc: "Les Pays-Bas ont lancé une campagne nationale pour améliorer la culture numérique dans tous les secteurs de la société. En dotant les citoyens des compétences nécessaires à l'ère numérique, le gouvernement s'assure que la main-d'œuvre soit équipée pour les avancées technologiques, boostant productivité et innovation."
 HOL_economic_resilience_idea: "Initiative de résilience économique"
 HOL_economic_resilience_idea_desc: "Le gouvernement néerlandais a mis en œuvre des politiques complètes visant à renforcer la résilience de l'économie face aux crises mondiales. En diversifiant les secteurs, en soutenant les PME et en assurant un filet de sécurité social robuste, les Pays-Bas sont mieux préparés à affronter les défis futurs et à maintenir la stabilité économique."
 HOL_financial_sector_idea: "Réforme du secteur financier"
 HOL_financial_sector_idea_desc: "Des réformes complètes du secteur financier sont essentielles pour prévenir de futures crises et promouvoir transparence et responsabilité. Sous la direction de Wouter Bos, nous réglementerons efficacement l'industrie financière, assurant stabilité et confiance sur le marché. Ces réformes créeront une économie plus résiliente, capable d'affronter les défis mondiaux et de réduire le risque d'effondrement économique."
 HOL_afriforum1HOL: "Partenariat et protection afrikaners"
 HOL_afriforum1HOL_desc: "Les Pays-Bas ont approfondi leur relation avec la communauté afrikaner d'Afrique du Sud, offrant un soutien économique et un engagement à protéger l'héritage culturel et linguistique afrikaner. Ce partenariat assure l'accès aux ressources tout en symbolisant un lien renouvelé enraciné dans une histoire partagée et un respect mutuel."
 HOL_afriforum1SAF: "Alliance néerlando-afrikaner"
 HOL_afriforum1SAF_desc: "La communauté afrikaner a renforcé son alliance avec les Pays-Bas, favorisant préservation culturelle, collaboration économique et un réseau de soutien. Par l'influence néerlandaise, les Afrikaners gagnent un allié dans leurs efforts pour sauvegarder leur identité et leur autonomie économique au sein de l'Afrique du Sud."
 HOL_fatherland_education_idea: "Éducation patriotique"
 HOL_fatherland_education_idea_desc: "L'éducation patriotique vise à inculquer fierté nationale, héritage et responsabilité à notre jeunesse. En mettant l'accent sur l'histoire, les valeurs et la culture néerlandaises dans les programmes, nous visons une citoyenneté forte et unie, équipée pour préserver nos traditions et notre identité nationale."
 HOL_stadtholderate1: "Règne du stathouder"
 HOL_stadtholderate1_desc: "Le stathouder néerlandais mène une ère renouvelée de gouvernance, équilibrant les principes de la monarchie et les traditions de la démocratie. Mettant l'accent sur l'autonomisation locale et la réforme constitutionnelle, le stathouder cherche à unir les Pays-Bas sous une vision de liberté, de progrès et de leadership fort."
 HOL_monarchy1: "Couronne et pays unis"
 HOL_monarchy1_desc: "Les Pays-Bas ont embrassé leur héritage royal, la monarchie se dressant comme pilier d'identité nationale et de stabilité. Sous le regard attentif de la Couronne, la nation avance, cultivant la fierté culturelle et assurant un gouvernement central fort dédié à la prospérité de son peuple."
 HOL_voc_semiconductor_control_HOL: "Contrôler l'industrie des semi-conducteurs en §Y[TAI.GetNameWithFlag]§!"
 HOL_voc_semiconductor_control_HOL_desc: "Par des investissements et partenariats stratégiques, les Pays-Bas ont pris le contrôle de l'industrie des semi-conducteurs très convoitée de Taïwan. Avec la lithographie de pointe d'ASML au cœur de cette domination, les Néerlandais tiennent désormais les rênes de la production mondiale de semi-conducteurs, s'assurant un avantage critique à l'ère technologique moderne."
 HOL_voc_semiconductor_control_TAI: "Mainmise [HOL.GetAdjective] sur l'industrie des semi-conducteurs de Taïwan"
 HOL_voc_semiconductor_control_TAI_desc: "L'industrie des semi-conducteurs de Taïwan, sang de son économie, est tombée sous contrôle [HOL.GetAdjective]. Ce basculement de pouvoir, mené par le levier technologique d'ASML et la pression économique de la VOC, menace l'autonomie de Taïwan sur son industrie la plus critique tout en plaçant son avenir en des mains étrangères."
 HOL_sri_dutch_agriculture_benefits: "Partenariat agricole néerlandais"
 HOL_sri_dutch_agriculture_benefits_desc: "Par la collaboration avec les Pays-Bas, le Sri Lanka a accédé à des techniques et ressources agricoles modernes, boostant production alimentaire et croissance économique dans tout le pays."
 HOL_sri_agriculture_collaboration: "Collaboration agricole sri-lankaise"
 HOL_sri_agriculture_collaboration_desc: "En partageant l'expertise agricole néerlandaise avec le Sri Lanka, les Pays-Bas ont assuré un point d'appui vital dans la région, renforçant leur influence et rétablissant un lien avec ce territoire historique."
 HOL_voc_indonesian_focus: "COV : focus indonésien"
 HOL_voc_indonesian_focus_desc: "La VOC rétablie a mis le cap sur la reconquête de la domination en Indonésie, cœur de son empire historique. Avec des efforts concentrés sur la revitalisation économique, le contrôle stratégique et l'influence locale, ce focus vise à réaffirmer la puissance néerlandaise dans la région et à en sécuriser les précieuses ressources."
 HOL_voc_penalty_operation_extension: "Pénalité de prolongation de l’opération"
 HOL_voc_penalty_operation_extension_desc: "En prolongeant nos opérations en Indonésie au lieu de déclarer la guerre, nous avons retardé l'action décisive, causant tension politique, stabilité réduite et inefficacités industrielles."
 HOL_voc_ambassy_expansion_ind: "Agrandir l'ambassade des Pays-Bas en Indonésie"
 HOL_voc_ambassy_expansion_ind_desc: "L'expansion de l'ambassade néerlandaise en Indonésie est un geste stratégique pour approfondir les liens diplomatiques, exercer une influence et faciliter des opérations clandestines. En renforçant notre présence, nous pouvons mieux nous positionner pour de futures entreprises dans la région."
 HOL_d66_democratic_institutions_idea: "Des institutions démocratiques renforcées"
 HOL_d66_democratic_institutions_idea_desc: "Les efforts pour renforcer les processus démocratiques ont accru la confiance du public dans la gouvernance. Avec plus de transparence, de responsabilité et de participation citoyenne, les Pays-Bas se dressent comme modèle d'une démocratie moderne et efficace."
 HOL_gl_affordable_housing_plan_idea: "Initiative de logements abordables"
 HOL_gl_affordable_housing_plan_idea_desc: "Avec des investissements significatifs dans un logement durable et abordable, les Pays-Bas s'attaquent de front à la crise du logement. Cette initiative assure à chaque citoyen l'accès à un foyer sûr, sécurisé et écologique."
 HOL_gl_international_solidarity_idea: "Solidarité internationale"
 HOL_gl_international_solidarity_idea_desc: "GroenLinks a favorisé de solides partenariats internationaux pour affronter les défis mondiaux. En promouvant paix, droits humains et développement durable, les Pays-Bas se dressent comme un phare de coopération et de progrès sur la scène mondiale."
 HOL_gl_transparent_government_idea: "Gouvernance transparente"
 HOL_gl_transparent_government_idea_desc: "Avec un engagement indéfectible envers la responsabilité et l'ouverture, GroenLinks a assuré que le gouvernement opère de façon transparente, permettant aux citoyens de faire confiance à leur direction et de s'y engager."
 HOL_gl_diversify_workforce_idea: "Effectif diversifié"
 HOL_gl_diversify_workforce_idea_desc: "Par des politiques inclusives et des programmes d'égalité des chances, GroenLinks a favorisé une main-d'œuvre qui reflète la diversité et la force de la société néerlandaise, assurant équité et innovation dans chaque secteur."
 HOL_gl_fair_trade_idea: "Accord de coalition pour le commerce équitable"
 HOL_gl_fair_trade_idea_desc: "Dans le cadre de l'accord de coalition négocié avec GroenLinks, le gouvernement s'est engagé sur un nouveau cadre de commerce international. Portée par l'agenda progressiste de GroenLinks, la politique commerciale met désormais l'accent sur la responsabilité écologique, les droits des travailleurs et la justice sociale plutôt que le seul profit. Cela marque un virage clair des modèles traditionnels de marché vers une vision économique fondée sur les valeurs."
 HOL_d66_rule_of_law_idea: "Défendre l'État de droit"
 HOL_d66_rule_of_law_idea_desc: "D66 a obtenu des réformes juridiques clés dans l'accord de coalition, réaffirmant l'indépendance du judiciaire, la transparence de la gouvernance et le strict respect des normes constitutionnelles. En un temps de pression populiste et de fragmentation politique, ces mesures visent à sauvegarder les institutions démocratiques et l'État de droit au pays comme à l'étranger."
 HOL_asml1: "ASML"
 HOL_asml1_desc: "Le leadership d'ASML en lithographie place les Pays-Bas au cœur de l'industrie mondiale des microprocesseurs. Cette domination accélère notre recherche en informatique et fabrication de puces tout en transformant les exportations de semi-conducteurs en source régulière de recettes nationales."
 HOL_caribbean_naval_cooperation: "Coopération navale conjointe des Caraïbes"
 HOL_caribbean_naval_cooperation_desc: "Le programme naval conjoint des Caraïbes renforce notre marine, nous permettant de coordonner formation, patrouilles maritimes et stratégies de défense aux côtés de la marine royale néerlandaise."
 HOL_asml_USA_tech_partnership: "Pacte d’intégration technologique ASML-USA"
 HOL_asml_USA_tech_partnership_desc: "Les Pays-Bas et les États-Unis ont noué un partenariat stratégique de haut niveau centré sur l'innovation en semi-conducteurs, la cyberdéfense et la fabrication de précision. La firme néerlandaise ASML est au cœur de cette collaboration, nous octroyant un avantage de pointe en recherche et production industrielle. Toutefois, une intégration plus profonde à l'infrastructure technologique américaine a accru notre dépendance à la politique d'export américaine et tendu nos liens commerciaux avec les puissances non alignées."
 HOL_shell_lng_deal: "Accord énergétique stratégique Shell-GNL"
 HOL_shell_lng_deal_desc: "Par un pacte énergétique complet avec des partenaires internationaux, Shell a assuré aux Pays-Bas l'accès à l'infrastructure GNL, à la production de carburant offshore et aux corridors énergétiques mondiaux. Cela booste notre stabilité économique et renforce notre réseau d'approvisionnement. L'investissement continu dans les fossiles attire les critiques au pays et limite notre capacité d'innovation high-tech dans d'autres secteurs."
 HOL_strengthening_eurozone_idea: "Renforcer la zone euro"
 HOL_strengthening_eurozone_idea_desc: ""
 HOL_social_democratic_modifier: "Société sociale et démocratique"
 HOL_economy: "Économie néerlandaise"
 HOL_economy_desc: "Des grues de Rotterdam aux serres du Westland et aux salles blanches de Brainport, l'économie néerlandaise prospère comme l'un des grands carrefours commerciaux d'Europe. Des siècles de commerce, de polders et d'innovation incessante ont forgé une puissance ouverte, tournée vers l'export, couvrant agriculture, logistique, énergie, finance et haute technologie, où chaque nouvelle entreprise compose la force de l'ensemble."
 HOL_cmp: "Commissariat Militaire Production"
 HOL_cmp_desc: "Le Commissariaat Militaire Productie (CMP), ou commissariat à la production militaire, était un organe gouvernemental néerlandais chargé de superviser et de coordonner la production d'équipements et de fournitures militaires. Son rôle premier était d'assurer que les forces de défense soient adéquatement équipées, surtout en temps de conflit ou de préparation accrue. Le CMP gérait les contrats avec l'industrie nationale, réglementait la production d'armes, de munitions, de véhicules et d'autres nécessités militaires, et veillait au respect des normes et des délais."
 HOL_noordzee_parken: "Parc énergétique de Noordzee"
 HOL_army: "Koninklijke Landmacht"
 HOL_army_desc: "La Koninklijke Landmacht, ou armée de terre royale néerlandaise, est la branche terrestre des forces armées, aux racines remontant au XVIe siècle. Elle est responsable de la défense du territoire néerlandais et contribue aux missions internationales, dont le maintien de la paix OTAN et ONU. L'armée est équipée de véhicules, d'artillerie et de systèmes de communication modernes. C'est une force polyvalente, prête à affronter un éventail de défis de sécurité au pays comme à l'étranger."
 HOL_navy: "Koninklijke Marine"
 HOL_navy_desc: "La Koninklijke Marine, ou marine royale néerlandaise, est la branche navale des forces armées néerlandaises. Elle sauvegarde les intérêts maritimes néerlandais, projette la puissance à l'étranger et opère étroitement avec les flottes alliées. Ce modificateur reflète les choix cumulés de doctrine, de formation et d'achats faits à travers l'arbre de focus naval."
 HOL_economy.027.t: "Le nouveau sponsor d'un Village Club"
 HOL_economy.027.d: "Un club sportif local dévoile un nouvel équipement financé par un éleveur laitier voisin, dont les digesteurs tournent désormais aux déchets organiques de la ville. La municipalité veut marquer l'occasion."
 HOL_economy.027.a: "Le cofinancer avec des fonds municipaux"
 HOL_economy.027.b: "Gardez-le axé sur la communauté"
 HOL_megaproject_category: "Mégaprojets nationaux"
 HOL_megaproject_category_desc: "Grandes entreprises nationales, du remblaiement aux infrastructures phares, débloquées tandis que les Pays-Bas poursuivent leur grand agenda de développement."
 HOL_space_program_category: "Programme spatial néerlandais"
 HOL_space_program_category_desc: "L'effort spatial national, coordonnant infrastructure de lancement, satellites et ambitions habitées au-delà de l'orbite terrestre."
 HOL_future_air_defender_program: "Programme Future Air Defender"
 HOL_future_air_defender_program_desc: "Un programme naval conjoint pour construire la frégate de défense aérienne Future Air Defender. Chaque membre mène la construction comme une mission chronométrée ; à son terme, les navires achevés entrent directement en service. Si l'Allemagne se retire, les Pays-Bas peuvent embarquer des marines nordiques pour compenser les effectifs et rattraper le temps perdu."
 HOL_FAD_invite_partner: "Inviter un partenaire au programme"
 HOL_FAD_invite_partner_desc: "Inviter une marine nordique dans le programme Future Air Defender. Chaque partenaire qui rejoint reçoit deux frégates, en ajoute une à la commande néerlandaise et raccourcit le temps de construction restant."
 HOL_military.089.a: "Autoriser le budget supplémentaire."
 HOL_military.089.b: "Maintenir l'allocation actuelle."
 HOL_mars_invested_budget_tt: "§GUn investissement accru accélère la mission et ouvre un bonus de recherche en construction lorsque les premiers échantillons de sol sont analysés.§!"
 HOL_military.090.a: "Financer le correctif logiciel complet."
 HOL_military.090.b: "Accepter le contournement et le retard."
 HOL_military.091.a: "Étendre le levé géologique."
 HOL_military.091.b: "Donner la priorité à l’assemblage de l’habitat."
 HOL_mars_chromium_found_tt: "§GLes équipes de prospection extraient des gisements supplémentaires de chrome du sous-sol d'Isidis.§!"
 HOL_military.092.a: "Réparer le dôme immédiatement."
 HOL_military.092.b: "Isoler le segment et poursuivre."
 HOL_mars_software_bonus_tt: "§GLe correctif logiciel complet a résolu proprement la séquence d'amarrage. L'acier de construction récupéré sera réorienté vers les fondations renforcées de la colonie.§!"
 HOL_military.088.a: "Nommez-le Hollanderhaven."
 HOL_military.088.b: "Nommez-le Brinkerdam."
 HOL_military.088.c: "Nommez-le Brandaanstad."
 HOL_military.088.e: "Nommez-le Brammertdelf."
 HOL_mars_mining_colony_tt: "§GLes premiers puits d'extraction de Brammertdelf percent le sol, livrant immédiatement des matières premières de la croûte martienne.§!"
 HOL_monarchy.40.t: "La princesse d'Orange s'engage"
 HOL_monarchy.40.d: "La princesse héritière Catharina-Amalia est devenue la première femme de la maison d'Orange à servir en uniforme, s'enrôlant comme réserviste et achevant sa formation militaire générale. Son exemple a entraîné une nette hausse des candidatures aux forces armées."
 HOL_monarchy.40.a: "Un jour de fierté pour la maison d'Orange."
 HOL_monarchy.41.t: "La reine Máxima rejoint la réserve"
 HOL_monarchy.41.d: "La reine Máxima s'est enrôlée comme réserviste à l'Académie militaire royale de Bréda, suivant sa fille dans le service. Elle a déclaré que la sécurité nationale ne pouvait plus être tenue pour acquise, et qu'elle souhaitait y contribuer comme tout autre citoyen."
 HOL_monarchy.41.a: "La couronne se tient aux côtés des forces armées."
 HOL_politics.05.c: "Soutenez Rita Verdonk"
 HOL_politics.78.t: "Friction au cabinet"
 HOL_politics.78.d: "Geert Wilders s'oppose à la direction du VVD sur l'immigration. Il exige une ligne bien plus dure que ses collègues n'acceptent, et la querelle déborde dans le public."
 HOL_politics.78.a: "Soutenir la ligne dure de Wilders"
 HOL_politics.78.b: "Tenir le cap modéré"
 HOL_politics.79.t: "La Turquie aux portes de l'Europe"
 HOL_politics.79.d: "L'adhésion de la Turquie à l'Union européenne divise le parti. Wilders s'y oppose farouchement et prévient que l'ouverture de la direction aliénera les électeurs du VVD."
 HOL_politics.79.a: "S'opposer à l'adhésion de la Turquie"
 HOL_politics.79.b: "Soutenir l’élargissement de l’UE"
 HOL_politics.80.t: "Une ligne dans le sable"
 HOL_politics.80.d: "Wilders confronte la direction sur la position du parti vis-à-vis de l'islam et de l'intégration, insistant sur une position sans compromis. Sa patience s'épuise visiblement."
 HOL_politics.80.a: "Prendre la ligne sans compromis"
 HOL_politics.80.b: "Rechercher un ton conciliant"
 HOL_politics.81.t: "Séjours Wilders"
 HOL_politics.81.d: "Pour l'heure, Geert Wilders reste au VVD. La direction a fait juste assez pour garder son dur agité sous la tente, et une scission destructrice est évitée."
 HOL_politics.81.a: "Une paix fragile tient"
 HOL_voc.1.t: "Une proposition de la Compagnie néerlandaise des Indes orientales"
 HOL_voc.1.d: "Tandis que l'Inde plonge dans la guerre civile, le gouvernement [HOL.GetAdjectiveCap] et la VOC ranimée ont présenté une offre surprenante. Ils proposent un transfert pacifique d'États indiens sous contrôle [HOL.GetAdjectiveCap], citant leurs liens historiques et des promesses de stabilité et de prospérité sous administration néerlandaise. Ils préviennent toutefois que le rejet de cette offre forcera les Pays-Bas à intervenir militairement, risquant un conflit plus large et la perte de encore plus de territoire au règlement de paix. La décision repose entre vos mains."
 HOL_voc.1.a: "Accepter le transfert. La stabilité est primordiale."
 HOL_voc.1.b: "Rejeter l'offre. Se préparer à la guerre avec [HOL.GetAdjectiveCap]."
 HOL_voc.2.t: "[HOL.GetAdjectiveCap] s'empare du Gujarat oriental"
 HOL_voc.2.d: "[HOL.GetAdjectiveCap] a exploité l'instabilité du Gujarat oriental et revendiqué le contrôle de l'État. Ils proposent la coopération, mais l'alternative est une confrontation militaire."
 HOL_voc.2.a: "Riposter ! C'est un acte de guerre !"
 HOL_voc.2.b: "Refuser d'agir pour l'heure. [HOL.GetAdjectiveCap] pourrait trop s'étendre."
 HOL_voc.3.t: "[HOL.GetAdjectiveCap] s'empare du Bengale-Occidental"
 HOL_voc.3.d: "[HOL.GetAdjectiveCap] a capitalisé sur le chaos au Bengale-Occidental et établi le contrôle de l'État. Accepterez-vous leurs exigences ou vous préparerez-vous à la guerre ?"
 HOL_voc.3.a: "Riposter ! C'est un acte de guerre !"
 HOL_voc.3.b: "Refuser d'agir pour l'heure. [HOL.GetAdjectiveCap] pourrait trop s'étendre."
 HOL_voc.4.t: "[HOL.GetAdjectiveCap] prend le Kerala"
 HOL_voc.4.d: "Au milieu de troubles croissants, [HOL.GetAdjectiveCap] a revendiqué le Kerala, citant son influence historique dans la région. L'Inde doit décider de négocier ou de riposter."
 HOL_voc.4.a: "Riposter ! C'est un acte de guerre !"
 HOL_voc.4.b: "Refuser d'agir pour l'heure. [HOL.GetAdjectiveCap] pourrait trop s'étendre."
 HOL_voc.5.t: "[HOL.GetAdjectiveCap] contrôle le Tamil Nadu"
 HOL_voc.5.d: "[HOL.GetAdjectiveCap] a profité de l'instabilité au Tamil Nadu pour étendre son contrôle. Comment l'Inde répondra-t-elle à cette agression flagrante ?"
 HOL_voc.5.a: "Riposter ! C'est un acte de guerre !"
 HOL_voc.5.b: "Refuser d'agir pour l'heure. [HOL.GetAdjectiveCap] pourrait trop s'étendre."
 HOL_voc.6.t: "Demande néerlandaise de suspendre la garantie taïwanaise"
 HOL_voc.6.d: "Les Pays-Bas nous ont approchés d'une demande de suspension de notre garantie de sécurité pour Taïwan, citant leur intention de s'assurer des territoires sur l'île. Accéderons-nous à leurs exigences ?"
 HOL_voc.6.a: "Suspendre la garantie."
 HOL_voc.6.b: "Refuser leur demande."
 HOL_voc.6.c: "Suspendre, mais exiger une compensation."
 HOL_voc.7.t: "Les États-Unis acceptent de suspendre la garantie taïwanaise"
 HOL_voc.7.d: "Les États-Unis ont accepté de suspendre leur garantie de sécurité pour Taïwan, ouvrant la voie à une action néerlandaise contre l'île."
 HOL_voc.7.a: "Procéder à l'ultimatum."
 HOL_voc.8.t: "Les États-Unis refusent de suspendre la garantie taïwanaise"
 HOL_voc.8.d: "Les États-Unis ont refusé de suspendre leur garantie de sécurité pour Taïwan, compliquant les plans néerlandais de pression sur l'île."
 HOL_voc.8.a: "Nous réévaluerons notre stratégie."
 HOL_voc.9.t: "Ultimatum néerlandais à Taïwan"
 HOL_voc.9.d: "Les Pays-Bas ont lancé un ultimatum à Taïwan, exigeant le transfert de [599.GetName] et [1157.GetName]. Comment répondrons-nous ?"
 HOL_voc.9.a: "Accepter leurs exigences."
 HOL_voc.9.b: "Demander le soutien [USA.GetAdjectiveCap]."
 HOL_voc.9.c: "Céder les territoires, mais demander la protection [HOL.GetAdjective]"
 HOL_voc.10.t: "Territoires obtenus de Taïwan"
 HOL_voc.10.d: "Le gouvernement [TAI.GetAdjectiveCap] a accepté notre ultimatum et transféré le contrôle des territoires exigés. Cela marque une victoire significative pour la VOC et les Pays-Bas, consolidant notre influence dans la région et étendant notre portée en Asie."
 HOL_voc.10.a: "Excellent. La puissance de la VOC grandit."
 HOL_voc.11.t: "Taïwan recherche le soutien de [USA.GetAdjectiveCap]"
 HOL_voc.11.d: "Taïwan a demandé le soutien [USA.GetAdjectiveCap] pour résister aux exigences [HOL.GetAdjectiveCap]. Comment répondrons-nous ?"
 HOL_voc.11.a: "Faire pression sur Taïwan pour qu'elle se soumette."
 HOL_voc.11.b: "Soutenez la souveraineté de Taiwan."
 HOL_voc.12.t: "Les États-Unis font pression sur Taïwan pour qu'elle se soumette"
 HOL_voc.12.d: "Sous pression [USA.GetAdjectiveCap], Taïwan doit décider de se soumettre aux exigences néerlandaises ou de résister et risquer la guerre."
 HOL_voc.12.a: "Se soumettre aux exigences [HOL.GetAdjectiveCap]."
 HOL_voc.12.b: "Résistez à l’agression [HOL.GetAdjectiveCap], seul."
 HOL_voc.13.t: "Taïwan rejette notre ultimatum"
 HOL_voc.13.d: "Avec le soutien des États-Unis, Taïwan a purement et simplement rejeté notre ultimatum. Ce défi présente un choix critique : nous pouvons nous retirer pour éviter une nouvelle escalade ou aller de l'avant, risquant un conflit ouvert avec Taïwan et ses alliés."
 HOL_voc.13.a: "Retirer l'ultimatum. Les risques sont trop élevés."
 HOL_voc.13.b: "Maintenir l'ultimatum. La guerre est inévitable."
 HOL_voc.14.t: "Taïwan rejette notre ultimatum"
 HOL_voc.14.d: "Taïwan a purement et simplement rejeté nos exigences, refusant de céder les territoires demandés. Cet acte de défi ne nous laisse d'autre choix que de déclarer la guerre et d'affirmer l'autorité néerlandaise par la force."
 HOL_voc.14.a: "La guerre est la seule réponse !"
 HOL_voc.15.t: "Taïwan accepte de céder des territoires sous protection"
 HOL_voc.15.d: "Dans un tournant surprenant, Taïwan a accepté de transférer les territoires demandés aux Pays-Bas, mais seulement à condition que les Néerlandais garantissent la protection de Taïwan contre de futures menaces. Cet arrangement renforce l'influence néerlandaise en Asie mais a un coût de plus grande responsabilité dans la région."
 HOL_voc.15.a: "Nous acceptons leurs termes et garantissons Taïwan."
 HOL_voc.16.t: "Les États-Unis exigent une compensation pour Taïwan"
 HOL_voc.16.d: "Après nous avoir laissé prendre le contrôle des territoires taïwanais, les États-Unis exigent désormais une compensation pour leur protection suspendue. Ils arguent que leurs intérêts géopolitiques dans la région ont été minés. Nous pouvons accepter de payer, assurant des relations stables, ou refuser et risquer un conflit avec les Américains."
 HOL_voc.16.a: "Payer la compensation et préserver la stabilité."
 HOL_voc.16.b: "Rejeter leur exigence et se préparer à la guerre."
 HOL_voc.17.t: "Les Néerlandais proposent une collaboration agricole"
 HOL_voc.17.d: "Les Pays-Bas nous ont approchés d'une offre de collaboration pour moderniser notre secteur agricole. Ils proposent de partager l'expertise et les ressources néerlandaises pour améliorer la sécurité alimentaire et la production économique au Sri Lanka. Toutefois, ce partenariat pourrait s'accompagner de contreparties, accroissant potentiellement l'influence néerlandaise dans la région."
 HOL_voc.17.a: "Accepter la collaboration. Nous avons besoin de leur expertise."
 HOL_voc.17.b: "Refuser. Le Sri Lanka doit se tenir seul."
 HOL_voc.18.t: "Le Sri Lanka accepte la collaboration agricole"
 HOL_voc.18.d: "Le Sri Lanka a accepté notre offre de collaboration sur le développement agricole. Cela marque un nouveau chapitre des relations néerlando-sri-lankaises, renforçant notre influence et assurant des bénéfices mutuels dans la région."
 HOL_voc.18.a: "Un partenariat prometteur !"
 HOL_voc.19.t: "Le Sri Lanka refuse toute collaboration agricole"
 HOL_voc.19.d: "Le Sri Lanka a décliné notre offre de collaboration agricole. Sa réticence à travailler avec les Pays-Bas peut ralentir le développement régional et réduire notre influence."
 HOL_voc.19.a: "Regrettable, mais il faut passer à autre chose."
 HOL_voc.20.t: "Les Pays-Bas proposent des opportunités d'investissement"
 HOL_voc.20.d: "Les Pays-Bas ont proposé un programme d'investissement agricole pour améliorer l'économie et la production alimentaire du Sri Lanka. Le programme comporte trois niveaux — petit, moyen ou lourd — offrant des bénéfices progressivement plus importants mais exigeant un engagement plus grand. Le Sri Lanka peut aussi refuser l'offre entièrement."
 HOL_voc.20.a: "Accepter le petit programme d'investissement."
 HOL_voc.20.b: "Accepter le programme d'investissement moyen."
 HOL_voc.20.c: "Accepter le programme d'investissement lourd."
 HOL_voc.20.e: "Refuser l'offre néerlandaise."
 HOL_voc.21.t: "Petit programme d'investissement accepté"
 HOL_voc.21.d: "Le Sri Lanka a accepté notre petit programme d'investissement. Cette première étape établira l'influence néerlandaise et renforcera progressivement leur secteur agricole."
 HOL_voc.21.a: "Un bon début."
 HOL_voc.22.t: "Programme d'investissement moyen accepté"
 HOL_voc.22.d: "Le Sri Lanka a accepté notre programme d'investissement moyen. Cet engagement plus profond boostera significativement leur production agricole et étendra l'influence néerlandaise."
 HOL_voc.22.a: "Excellente progression."
 HOL_voc.23.t: "Programme d'investissement massif accepté"
 HOL_voc.23.d: "Le Sri Lanka a embrassé notre programme d'investissement lourd, s'engageant dans une refonte transformatrice de son secteur agricole. Cela marque une étape de l'influence et de la collaboration néerlandaises dans la région."
 HOL_voc.23.a: "Cela rapportera de grandes récompenses."
 HOL_voc.24.t: "Le Sri Lanka refuse l'offre d'investissement"
 HOL_voc.24.d: "Le Sri Lanka a décliné notre offre d'investissement, manquant une occasion de renforcer son secteur agricole. Nous pouvons toutefois poursuivre des investissements unilatéraux pour établir notre influence."
 HOL_voc.24.a: "Regrettable, mais nous trouverons une autre voie."
 HOL_voc.25.t: "Expansion néerlandaise du port de Colombo"
 HOL_voc.25.d: "Les Pays-Bas ont réalisé des investissements significatifs pour étendre et moderniser le port de Colombo, tout en renforçant son infrastructure de sécurité. Ce développement devrait booster la capacité économique et les opérations maritimes du Sri Lanka. Toutefois, la présence néerlandaise s'est considérablement accrue, suscitant des inquiétudes sur leur influence sur l'un des atouts les plus stratégiques du Sri Lanka."
 HOL_voc.25.a: "C'est à la fois une bénédiction et un défi."
 HOL_voc.26.t: "Les Néerlandais exigent des droits exclusifs sur le Sri Lanka"
 HOL_voc.26.d: "Les Pays-Bas ont lancé un ultimatum brutal : leur accorder des droits exclusifs de gouverner le Sri Lanka, cédant effectivement la souveraineté nationale, ou en affronter les conséquences. Cette décision façonnera l'avenir de l'indépendance sri-lankaise."
 HOL_voc.26.a: "Nous n'avons d'autre choix que de nous soumettre."
 HOL_voc.26.b: "Nous refusons de céder !"
 HOL_voc.27.t: "Le Sri Lanka refuse les demandes des Pays-Bas"
 HOL_voc.27.d: "Le Sri Lanka a rejeté notre ultimatum, défiant les exigences néerlandaises de droits exclusifs sur la nation. Cela ne nous laisse d'autre choix que d'affirmer notre domination par la force."
 HOL_voc.27.a: "La guerre est inévitable."
 HOL_voc.28.t: "Le Sri Lanka accepte les demandes des Pays-Bas"
 HOL_voc.28.d: "Le Sri Lanka a capitulé face à notre ultimatum, accordant aux Pays-Bas des droits exclusifs de gouverner la nation. Cette annexion pacifique renforce l'influence néerlandaise dans la région et marque une victoire historique pour la VOC."
 HOL_voc.28.a: "Le Sri Lanka fait désormais partie de l'héritage de la VOC."
 HOL_voc.29.t: "Aide néerlandaise à la lutte contre le VIH"
 HOL_voc.29.d: "Les Pays-Bas se sont avancés pour aider l'Afrique du Sud à combattre l'épidémie de VIH. Avec leur expertise sanitaire avancée et leurs ressources, les Néerlandais ont apporté un espoir et un soutien bienvenus à notre peuple. Cet acte de bonne volonté a non seulement renforcé notre lutte contre l'épidémie, mais aussi valu aux Néerlandais une large admiration parmi notre population."
 HOL_voc.29.a: "Ce partenariat est une bénédiction pour notre peuple mais un risque pour le gouvernement"
 HOL_voc.30.t: "Demande néerlandaise d'une base navale au Cap"
 HOL_voc.30.d: "Les Pays-Bas ont proposé d'établir une base navale au Cap, citant son importance stratégique comme hub de ravitaillement vers l'Asie. En retour, les Néerlandais ont offert des investissements significatifs dans l'infrastructure portuaire sud-africaine, renforçant les capacités maritimes de la nation. Devons-nous accepter cette proposition ?"
 HOL_voc.30.a: "Accepter la proposition et bâtir un partenariat."
 HOL_voc.30.b: "Refuser la proposition et maintenir une souveraineté pleine."
 HOL_voc.31.t: "L'Afrique du Sud accepte la proposition de base navale"
 HOL_voc.31.d: "L'Afrique du Sud a accepté de permettre aux Pays-Bas d'établir une base navale au Cap. Cet accord renforce l'accès néerlandais à des routes commerciales critiques et marque une étape significative de collaboration avec l'Afrique du Sud."
 HOL_voc.31.a: "Un succès vital pour la VOC !"
 HOL_voc.32.t: "L'Afrique du Sud refuse la proposition d'une base navale"
 HOL_voc.32.d: "L'Afrique du Sud a refusé notre proposition d'établir une base navale au Cap, citant des préoccupations de souveraineté et d'autonomie stratégique. C'est un revers pour les ambitions néerlandaises dans la région."
 HOL_voc.32.a: "Regrettable, mais il faut poursuivre."
 HOL_voc.33.t: "Les Néerlandais exigent des droits exclusifs sur l'Afrique du Sud"
 HOL_voc.33.d: "Les Pays-Bas ont lancé un ultimatum brutal : leur accorder des droits exclusifs de gouverner l'Afrique du Sud, cédant effectivement la souveraineté nationale, ou en affronter les conséquences. Cette décision façonnera l'avenir de l'indépendance sud-africaine."
 HOL_voc.33.a: "Nous n'avons d'autre choix que de nous soumettre."
 HOL_voc.33.b: "Nous refusons de céder !"
 HOL_voc.34.t: "L’Afrique du Sud refuse les demandes néerlandaises"
 HOL_voc.34.d: "L'Afrique du Sud a rejeté notre ultimatum, défiant les exigences néerlandaises de droits exclusifs sur la nation. Cela ne nous laisse d'autre choix que d'affirmer notre domination par la force."
 HOL_voc.34.a: "La guerre est inévitable."
 HOL_voc.35.t: "L'Afrique du Sud accepte les demandes néerlandaises"
 HOL_voc.35.d: "L'Afrique du Sud a capitulé face à notre ultimatum, accordant aux Pays-Bas des droits exclusifs de gouverner la nation. Cette annexion pacifique renforce l'influence néerlandaise dans la région et marque une victoire historique pour la VOC."
 HOL_voc.35.a: "L'Afrique du Sud fait désormais partie de l'héritage de la VOC."
 HOL_voc.36.t: "L'avenir de l'Indonésie"
 HOL_voc.36.d: "Le moment est venu de prendre une décision critique concernant l'Indonésie. Devons-nous déclarer la guerre et reconquérir de force notre historique Couronne coloniale, ou prolonger nos opérations clandestines d'une année, acceptant des pénalités temporaires car nous ne pouvons pas réutiliser la même ressource."
 HOL_voc.36.a: "Déclarer la guerre et reconquérir l'Indonésie !"
 HOL_voc.36.b: "Reporter les opérations d'un an."
 HOL_voc.39.t: "Les Pays-Bas demandent un droit de passage militaire"
 HOL_voc.39.d: "Les Pays-Bas ont demandé un droit de passage militaire sur le territoire australien, citant des raisons stratégiques et l'importance de la coopération régionale. Devons-nous accepter leur demande ?"
 HOL_voc.39.a: "Leur accorder le droit de passage militaire."
 HOL_voc.39.b: "Refuser leur demande."
 HOL_voc.40.t: "Droit de passage militaire accordé par l'Australie"
 HOL_voc.40.d: "L'Australie a accepté de nous accorder le droit de passage militaire, marquant une étape significative de coopération régionale et d'efficacité opérationnelle."
 HOL_voc.40.a: "Excellent. Préparer nos forces."
 HOL_voc.41.t: "Droit de passage militaire refusé par l'Australie"
 HOL_voc.41.d: "L'Australie a décliné notre demande de droit de passage militaire, citant des préoccupations de souveraineté et de stabilité régionale."
 HOL_voc.41.a: "Regrettable. Nous adapterons notre stratégie."
 HOL_voc.42.t: "Préparations pour l'invasion Java terminées"
 HOL_voc.42.d: "Nos préparatifs clandestins pour l'invasion de Java sont achevés. Nous attendons le résultat des efforts de contre-espionnage indonésiens pour déterminer si nos troupes restent non détectées."
 HOL_voc.42.a: "Continuez."
 HOL_voc.42.b: "Continuez."
 HOL_voc.43.t: "Forces secrètes détectées !"
 HOL_voc.43.d: "Nos opérations clandestines ont été découvertes par les forces indonésiennes, réduisant de moitié l'efficacité de nos troupes et leur capacité opérationnelle."
 HOL_voc.43.a: "Un revers majeur."
 HOL_voc.44.t: "Forces secrètes non détectées"
 HOL_voc.44.d: "Nos préparatifs clandestins sont passés inaperçus, et nos troupes restent à pleine force, prêtes à établir une tête de pont à Java."
 HOL_voc.44.a: "Excellent!"
 HOL_voc.45.t: "Demande néerlandaise d'achat de l'Australie-Occidentale"
 HOL_voc.45.d: "Les Pays-Bas ont fait une demande formelle d'achat de l'Australie-Occidentale, citant son importance stratégique pour leurs ambitions mondiales. En retour, ils offrent une compensation militaire ou industrielle à l'Australie. Comment devons-nous répondre ?"
 HOL_voc.45.a: "Accepter avec compensation militaire."
 HOL_voc.45.b: "Accepter avec compensation industrielle."
 HOL_voc.45.c: "Refuser leur offre."
 HOL_voc.46.t: "L'Australie accepte la proposition"
 HOL_voc.46.d: "L'Australie a accepté de vendre l'Australie-Occidentale aux Pays-Bas. Selon leur choix, nous fournirons la compensation promise pour maintenir de solides liens diplomatiques."
 HOL_voc.46.a: "Procéder à l'accord."
 HOL_voc.47.t: "L'Australie refuse la proposition"
 HOL_voc.47.d: "L'Australie a rejeté notre offre d'achat de l'Australie-Occidentale. Bien que décevant, nous devons ajuster notre stratégie en conséquence."
 HOL_voc.47.a: "Regrettable, mais nous passons à autre chose."
 HOL_voc.51.t: "Ultimatum néerlandais à Malacca"
 HOL_voc.51.d: "Les Pays-Bas ont lancé un ultimatum, exigeant la reddition immédiate de Malacca. Devons-nous accepter leurs termes et éviter le conflit, ou refuser et nous préparer à la guerre ?"
 HOL_voc.51.a: "Accepter leurs termes."
 HOL_voc.51.b: "Refuser et tenir bon."
 HOL_voc.52.t: "Malacca accepte l'ultimatum néerlandais"
 HOL_voc.52.d: "Malacca a capitulé face à nos exigences, cédant son territoire aux Pays-Bas sans résistance. Cela marque une victoire significative pour les ambitions néerlandaises dans la région."
 HOL_voc.52.a: "Intégrer Malacca au domaine néerlandais."
 HOL_voc.53.t: "Malacca refuse l'ultimatum néerlandais"
 HOL_voc.53.d: "Malacca a rejeté notre ultimatum, défiant les exigences néerlandaises de reddition. Cela ne nous laisse d'autre choix que de nous préparer à la guerre pour faire valoir nos revendications."
 HOL_voc.53.a: "Nous prendrons Malacca par la force."
 HOL_voc.54.t: "Ultimatum néerlandais à §Y[SIN.GetNameWithFlag]§!"
 HOL_voc.54.d: "Les Pays-Bas ont lancé un ultimatum, exigeant la reddition immédiate de Singapour. Devons-nous accepter leurs termes ou nous préparer à la guerre ?"
 HOL_voc.54.a: "Accepter leurs termes."
 HOL_voc.54.b: "Refuser et tenir bon."
 HOL_voc.55.t: "§Y[SIN.GetNameWithFlag]§! accepte l'ultimatum néerlandais"
 HOL_voc.55.d: "§Y[SIN.GetNameWithFlag]§! a capitulé face à nos exigences, cédant son territoire sans résistance. Cela marque une victoire significative pour les ambitions néerlandaises."
 HOL_voc.55.a: "Intégrer §Y[SIN.GetNameWithFlag]§! à notre domaine."
 HOL_voc.56.t: "§Y[SIN.GetNameWithFlag]§! refuse l'ultimatum néerlandais"
 HOL_voc.56.d: "§Y[SIN.GetNameWithFlag]§! a rejeté notre ultimatum, défiant les exigences néerlandaises. Cela ne nous laisse d'autre choix que de nous préparer à la guerre."
 HOL_voc.56.a: "Nous prendrons Singapour par la force."
 HOL_voc.57.t: "Ultimatum néerlandais à §Y[BRU.GetNameWithFlag]§!"
 HOL_voc.57.d: "§Y[HOL.GetNameWithFlag]§! a lancé un ultimatum, exigeant la reddition immédiate de Brunei. Devons-nous accepter leurs termes ou nous préparer à la guerre ?"
 HOL_voc.57.a: "Accepter leurs termes."
 HOL_voc.57.b: "Refuser et tenir bon."
 HOL_voc.58.t: "§Y[BRU.GetNameWithFlag]§! accepte l'ultimatum néerlandais"
 HOL_voc.58.d: "§Y[BRU.GetNameWithFlag]§! a capitulé face à nos exigences, cédant son territoire sans résistance. Cela marque une victoire significative pour les ambitions néerlandaises."
 HOL_voc.58.a: "Intégrer §Y[BRU.GetNameWithFlag]§! à notre domaine."
 HOL_voc.59.t: "§Y[BRU.GetNameWithFlag]§! refuse l'ultimatum néerlandais"
 HOL_voc.59.d: "§Y[BRU.GetNameWithFlag]§! a rejeté notre ultimatum, défiant les exigences néerlandaises. Cela ne nous laisse d'autre choix que de nous préparer à la guerre."
 HOL_voc.59.a: "Nous prendrons §Y[BRU.GetNameWithFlag]§! par la force."
 HOL_voc.60.t: "Préparatifs de guerre néerlandais détectés"
 HOL_voc.60.d: "Les rapports de renseignement confirment que les Pays-Bas mobilisent leurs forces pour reconquérir des territoires qu'ils croient faire partie de leur héritage historique. Des mesures immédiates doivent être prises pour se préparer à leur agression."
 HOL_voc.60.a: "Se préparer à la menace néerlandaise."
 HOL_voc.61.t: "Intensification des préparatifs défensifs"
 HOL_voc.61.d: "Les Pays-Bas ont intensifié leurs préparatifs militaires, accroissant la probabilité d'une invasion. Pour contrer cette menace, nous devons coordonner avec d'autres nations en danger et former des accords de défense mutuelle. Cela nous permettra de nous appeler mutuellement comme alliés en cas d'attaque néerlandaise."
 HOL_voc.61.a: "Renforcer nos défenses et coordonner les alliances."
 HOL_voc.62.t: "Demander de l'aide contre l'agression néerlandaise"
 HOL_voc.62.d: "Les Pays-Bas ont lancé une attaque contre nous, menaçant notre souveraineté. Nous pouvons appeler nos alliés à honorer leurs engagements et à rejoindre le combat pour repousser l'invasion néerlandaise."
 HOL_voc.62.a: "Appeler nos alliés à l'aide."
 HOL_voc.62.b: "Nous tiendrons seuls contre eux."
 HOL_voc.63.t: "[ROOT.GetNameWithFlag] demande de l'aide"
 HOL_voc.63.d: "§Y[ROOT.GetNameWithFlag]§! a été attaqué par §R[HOL.GetNameWithFlag]§! et demande notre aide pour repousser l'invasion. Honorerons-nous notre engagement et rejoindrons-nous le combat ?"
 HOL_voc.63.a: "Entrer en guerre et aider notre allié."
 HOL_voc.63.b: "Refuser d'intervenir."
 HOL_voc.64.t: "Proposition néerlandaise : corridor commercial transaustralien"
 HOL_voc.64.d: "Le gouvernement néerlandais a formellement proposé la construction d'un corridor commercial et d'infrastructure reliant l'Australie-Occidentale administrée par les Pays-Bas aux régions orientales du continent australien. Le plan comprend le développement de pôles logistiques, de réseaux ferroviaires et routiers, et l'établissement de zones économiques gérées par les Néerlandais. Si le corridor promet des bénéfices économiques de long terme, il soulève des questions de souveraineté, de gouvernance et d'équilibre d'influence à travers le continent."
 HOL_voc.64.a: "Approuver le corridor : le développement économique d'abord"
 HOL_voc.64.b: "Rejeter le plan : nous ne pouvons céder de terrain stratégique"
 HOL_voc.65.t: "L'Australie accepte la proposition de corridor commercial"
 HOL_voc.65.d: "Le gouvernement australien a approuvé notre proposition de construire un corridor commercial transcontinental reliant l'Australie-Occidentale néerlandaise aux pôles industriels et démographiques de l'est. Les travaux commenceront bientôt sur les infrastructures partagées, les zones économiques et les pôles logistiques. Cela marque une étape historique vers l'intégration économique régionale et l'influence stratégique néerlandaise dans l'Indo-Pacifique."
 HOL_voc.65.a: "Un corridor digne de l'héritage de la VOC."
 HOL_voc.66.t: "L'Australie rejette la proposition de corridor commercial"
 HOL_voc.66.d: "Le gouvernement australien a décliné notre offre de construire conjointement un corridor commercial transcontinental à travers son territoire. Les préoccupations de souveraineté stratégique et d'influence étrangère ont été citées comme raisons clés. Si la proposition aurait bénéficié économiquement aux deux parties, les préoccupations politiques intérieures l'ont emporté, pour l'heure."
 HOL_voc.66.a: "Un revers. Pas la fin."
 HOL_voc.67.t: "Les Pays-Bas soutiennent l'autonomie afrikaner"
 HOL_voc.67.d: "Dans un geste sûr de provoquer des tensions internes, le gouvernement néerlandais a publié une déclaration formelle soutenant l'autonomie culturelle et économique de la communauté afrikaner en Afrique du Sud. Les institutions néerlandaises ont annoncé des liens plus étroits avec les organisations civiles afrikaners, citant des liens historiques et un héritage partagé. Bien que présenté comme un soutien culturel, le geste a alarmé le gouvernement sud-africain, craignant une ingérence étrangère et d'éventuels troubles."
 HOL_voc.67.a: "C'est une préoccupation diplomatique sérieuse."
 HOL_voc.68.t: "Soutien néerlandais aux partis alignés sur les Boers"
 HOL_voc.68.d: "Des rapports ont confirmé que le gouvernement néerlandais offre un soutien officieux aux mouvements politiques alignés sur les Boers en Afrique du Sud. Canaux financiers, plateformes d'ONG et institutions culturelles semblent canaliser de l'influence vers des groupes plaidant pour une plus grande autonomie de la communauté afrikaner. Cette ingérence pourrait avoir de sérieuses ramifications pour l'unité nationale et la sécurité intérieure."
 HOL_voc.68.a: "C'est une ingérence étrangère inacceptable."
 HOL_voc.69.t: "Investissement néerlandais dans les mines afrikaners"
 HOL_voc.69.d: "Le gouvernement néerlandais a réalisé un investissement financier significatif dans des opérations minières afrikaners en Afrique du Sud. Le geste s'inscrit dans une campagne plus large d'approfondissement des liens économiques avec la communauté afrikaner, fournissant capital et soutien logistique pour booster la production. Bien qu'économiquement bénéfique pour certains, cela soulève de nouvelles inquiétudes sur l'influence extérieure sur les ressources naturelles sud-africaines."
 HOL_voc.69.a: "Ils prennent clairement parti."
 HOL_voc.70.t: "Investissement néerlandais dans les semi-conducteurs"
 HOL_voc.70.d: "Les Pays-Bas ont annoncé un investissement stratégique dans le secteur des semi-conducteurs de Taïwan. En partenariat avec des firmes tech néerlandaises clés, de nouveaux bureaux conjoints et installations de recherche seront construits pour soutenir le développement de puces de nouvelle génération. Cet accord approfondit la coopération bilatérale et renforce le rôle de Taïwan comme puissance mondiale des semi-conducteurs."
 HOL_voc.70.a: "Cela ancre la place de Taïwan dans l'ère numérique."
 HOL_voc.71.t: "Proposition néerlandaise : alliance technologique ASML–TSMC"
 HOL_voc.71.d: "Les Pays-Bas ont formellement proposé la création d'un groupe conjoint de partage technologique entre ASML et TSMC. Ce partenariat approfondirait la collaboration R&D, coordonnerait l'innovation en lithographie et puces, et établirait un bloc techno-industriel semi-formel. Taïwan soutiendra-t-il l'initiative ?"
 HOL_voc.71.a: "Approuver l'alliance tech : notre avenir est numérique"
 HOL_voc.71.b: "Rejeter : nous devons maintenir l'indépendance technologique"
 HOL_voc.72.t: "Taïwan accepte le partenariat ASML-TSMC"
 HOL_voc.72.d: "Taïwan a accepté la proposition néerlandaise d'un groupe conjoint de partage technologique. Avec ASML et TSMC au cœur, l'alliance prépare une innovation coordonnée en semi-conducteurs et un leadership de recherche à travers l'Europe et l'Asie."
 HOL_voc.72.a: "Une alliance industrielle pour l'ère suivante."
 HOL_voc.73.t: "Taïwan rejette la proposition de partage technologique"
 HOL_voc.73.d: "Taïwan a décliné la proposition d'une alliance technologique conjointe entre ASML et TSMC. Si les canaux diplomatiques restent ouverts, Taipei a choisi de conserver une pleine indépendance sur sa stratégie de semi-conducteurs, du moins pour l'heure."
 HOL_voc.73.a: "Un résultat décevant."
 HOL_voc.74.t: "Les Pays-Bas prennent le contrôle des exportations de semi-conducteurs"
 HOL_voc.74.d: "Dans un geste stratégique d'ampleur, le gouvernement néerlandais a adopté de nouvelles lois plaçant sous contrôle à l'exportation toutes les technologies avancées de semi-conducteurs et les systèmes de photolithographie. Avec ASML comme joyau de cette décision, les Pays-Bas tiennent désormais une position dominante dans la chaîne d'approvisionnement mondiale des puces, avec le pouvoir d'approuver, restreindre ou bloquer les exportations technologiques selon l'intérêt national et l'alignement diplomatique."
 HOL_voc.74.a: "Nous devons préparer des mesures contre les Néerlandais"
 HOL_voc.74.b: "Nous tenons désormais les clés de la tech mondiale."
 HOL_voc.75.t: "Expansion financière néerlandaise en Inde"
 HOL_voc.75.d: "Les Pays-Bas ont significativement étendu leur empreinte financière en Inde, ouvrant de nouvelles banques affiliées néerlandaises et des bureaux d'entreprises dans les grandes villes. Adossée à un effort coordonné impliquant institutions d'État néerlandaises et firmes multinationales, cette stratégie vise à approfondir l'investissement bilatéral, influencer les marchés financiers et accroître le levier économique dans l'économie indienne en croissance rapide. Sans être une manœuvre politique ouverte, elle décale subtilement la dynamique économique de la région."
 HOL_voc.75.a: "Le capital étranger porte toujours de l'influence..."
 HOL_voc.76.t: "Investissement néerlandais dans les ports du Gujarat"
 HOL_voc.76.d: "Le gouvernement néerlandais, par un mélange de firmes maritimes adossées à l'État et de canaux financiers, a investi dans la modernisation de l'infrastructure portuaire le long de la côte du Gujarat. Présenté formellement comme une initiative de facilitation du commerce, l'établissement de bureaux et d'installations portuaires néerlandais a soulevé des inquiétudes sur un levier étranger de long terme dans une région critique du commerce national. Le geste est diplomatiquement délicat, mais économiquement significatif."
 HOL_voc.76.a: "Nous surveillerons de près leur influence."
 HOL_wic.01.t: "Tracer la voie de la WIC"
 HOL_wic.01.d: "Tandis que nous nous préparons à reconquérir les territoires autrefois contrôlés par la Compagnie des Indes occidentales, nous devons décider de notre approche. Une stratégie diplomatique et économique pourrait mener à une intégration pacifique, renforçant notre influence par le soft power. Alternativement, une approche militaire pourrait offrir des résultats rapides et décisifs, au risque toutefois de résistance et d'un conflit prolongé."
 HOL_wic.01.a: "Suivre une voie diplomatique et économique"
 HOL_wic.01.b: "Adopter une stratégie militaire"
 HOL_wic.02.t: "Acquisition de dette néerlandaise"
 HOL_wic.02.d: "Les Pays-Bas ont acheté une portion significative de notre dette nationale, plaçant effectivement notre économie sous leur influence. Ce geste a apporté un certain soulagement immédiat à notre crise financière, mais cela signifie aussi que les Néerlandais tiennent désormais un poids considérable sur nos politiques et industries clés."
 HOL_wic.02.a: "Nous n'avons d'autre choix que de nous soumettre au contrôle financier néerlandais."
 HOL_wic.03.t: "Ultimatum néerlandais au Sénégal"
 HOL_wic.03.d: "Les Pays-Bas ont lancé un ultimatum exigeant le transfert de l'État du Sénégal-Centre, qui inclut l'île historique de Goeree. Le Sénégal se conformera-t-il, offrira-t-il une alternative, ou refusera-t-il d'emblée ?"
 HOL_wic.03.a: "Nous nous conformerons et transférerons le Sénégal-Centre."
 HOL_wic.03.b: "Proposez plutôt Sénégal-Nord."
 HOL_wic.03.c: "Nous refusons de céder à l'agression néerlandaise."
 HOL_wic.04.t: "Territoire sécurisé"
 HOL_wic.04.d: "Le Sénégal a accepté notre ultimatum et transféré l'État du Sénégal-Centre sous contrôle néerlandais. Cela marque une nouvelle étape dans la reconquête de l'héritage de la Compagnie des Indes occidentales."
 HOL_wic.04.a: "Une victoire pour les Pays-Bas."
 HOL_wic.05.t: "Contre-offre du Sénégal"
 HOL_wic.05.d: "Le Sénégal a refusé de transférer l'État du Sénégal-Centre mais a offert le Sénégal-Nord comme alternative. Devons-nous accepter cette contre-offre ou insister sur l'exigence originale ?"
 HOL_wic.05.a: "Accepter la contre-offre."
 HOL_wic.05.b: "Rejeter la contre-offre et exiger la conformité."
 HOL_wic.06.t: "Ultimatum rejeté"
 HOL_wic.06.d: "Le Sénégal a refusé de se conformer à notre ultimatum. Nous devons maintenant nous préparer à la guerre pour reconquérir ce qui nous revient de droit."
 HOL_wic.06.a: "La guerre est inévitable."
 HOL_wic.07.t: "Ultimatum final au Sénégal"
 HOL_wic.07.d: "Le Sénégal a rejeté notre contre-offre. Nous leur donnons une dernière chance de céder le Sénégal-Nord, ou nous répondrons par la force militaire."
 HOL_wic.07.a: "Rendez-vous au Sénégal-Nord."
 HOL_wic.07.b: "Nous nous défendrons contre l'agression néerlandaise."
 HOL_wic.08.t: "Ultimatum néerlandais : transfert du territoire de la Gold Coast"
 HOL_wic.08.d: "Les Pays-Bas ont lancé un ultimatum exigeant le transfert du territoire de la Côte-de-l'Or sous leur contrôle. Ils citent leur présence historique dans la région sous la Compagnie des Indes occidentales, dont l'exploitation de comptoirs clés comme le château d'Elmina. Si la conformité peut éviter le conflit, elle minerait la souveraineté du Ghana et déstabiliserait la région."
 HOL_wic.08.a: "Nous nous conformerons et transférerons la Côte-de-l'Or."
 HOL_wic.08.b: "Nous refusons de céder aux exigences néerlandaises."
 HOL_wic.09.t: "Le territoire de la Gold Coast sécurisé"
 HOL_wic.09.d: "Le gouvernement ghanéen a accepté de transférer le territoire de la Côte-de-l'Or, dont le château stratégique d'Elmina, sous contrôle néerlandais. Cela marque une étape significative de restauration de l'héritage de la Compagnie des Indes occidentales et de renforcement de notre présence en Afrique de l'Ouest."
 HOL_wic.09.a: "Une victoire pour les Pays-Bas et la WIC."
 HOL_wic.10.t: "Le Ghana rejette l'ultimatum néerlandais"
 HOL_wic.10.d: "Le gouvernement ghanéen a refusé notre ultimatum de transférer le territoire de la Côte-de-l'Or. Leur défi ne nous laisse d'autre choix que de nous préparer à une action militaire pour reconquérir ce que nous considérons comme nôtre de droit, restaurant l'influence néerlandaise dans la région."
 HOL_wic.10.a: "La guerre sera la seule réponse."
 HOL_wic.11.t: "Ultimatum néerlandais : transfert de la province de Luanda"
 HOL_wic.11.d: "Les Pays-Bas ont lancé un ultimatum exigeant le transfert de la province de Luanda sous contrôle néerlandais. Ils revendiquent ce territoire comme partie de leur empire maritime historique, citant l'implication de la Compagnie des Indes occidentales dans la région. Si cela éviterait le conflit, cela pourrait déstabiliser l'Angola politiquement et économiquement."
 HOL_wic.11.a: "Nous nous conformerons et transférerons la province de Luanda sous contrôle néerlandais."
 HOL_wic.11.b: "Nous refusons de nous soumettre aux exigences néerlandaises."
 HOL_wic.12.t: "L'Angola accepte l'ultimatum néerlandais"
 HOL_wic.12.d: "Le gouvernement angolais a accepté de transférer la province de Luanda sous contrôle néerlandais. Cette acquisition stratégique restaure une part clé de l'héritage maritime néerlandais dans l'Atlantique et renforce notre position dans la région."
 HOL_wic.12.a: "Une nouvelle étape vers la restauration de la WIC."
 HOL_wic.13.t: "L'Angola rejette l'ultimatum néerlandais"
 HOL_wic.13.d: "Le gouvernement angolais a refusé notre ultimatum de transférer la province de Luanda. Leur défi ne nous laisse d'autre choix que de nous préparer à une action militaire pour reconquérir ce que nous considérons comme nôtre de droit."
 HOL_wic.13.a: "Nous devons affirmer notre domination par la force."
 HOL_wic.14.t: "Ultimatum néerlandais : transfert à Sainte-Hélène"
 HOL_wic.14.d: "Les Pays-Bas ont lancé un ultimatum exigeant le transfert de Sainte-Hélène sous leur contrôle. Les Néerlandais justifient cette revendication par le lien historique de l'île avec leur empire maritime et son importance stratégique dans le réseau commercial atlantique. La conformité éviterait le conflit, mais pourrait compromettre les intérêts britanniques dans la région."
 HOL_wic.14.a: "Nous nous conformerons et transférerons Sainte-Hélène sous contrôle néerlandais."
 HOL_wic.14.b: "Nous refusons de céder aux exigences néerlandaises."
 HOL_wic.15.t: "Sainte-Hélène sécurisée"
 HOL_wic.15.d: "Le gouvernement britannique a accepté de transférer Sainte-Hélène sous contrôle néerlandais. Cette acquisition restaure un pan vital de l'héritage maritime des Pays-Bas et renforce notre domination sur les routes commerciales atlantiques."
 HOL_wic.15.a: "Une victoire majeure pour les Pays-Bas et la WIC."
 HOL_wic.16.t: "L'Angleterre rejette l'ultimatum néerlandais"
 HOL_wic.16.d: "Le gouvernement britannique a refusé notre ultimatum de transférer Sainte-Hélène. Leur décision ne nous laisse d'autre choix que de nous préparer à une action militaire pour reprendre cette île cruciale."
 HOL_wic.16.a: "Nous devons nous préparer à la guerre."
 HOL_wic.17.t: "Les Néerlandais exigent le retour de San Juan Bautista"
 HOL_wic.17.d: "Dans un geste inattendu, les Pays-Bas ont lancé un ultimatum formel exigeant le transfert de Porto Rico, historiquement connu sous le nom de San Juan Bautista. Ils revendiquent l'île comme une étape nécessaire pour restaurer l'héritage maritime de la Compagnie des Indes occidentales et rétablir leur domination dans les Caraïbes. Si les Néerlandais invoquent leurs ambitions du XVIIe siècle et la nécessité stratégique, céder marquerait une concession géopolitique majeure pour les États-Unis."
 HOL_wic.17.a: "Nous céderons Porto Rico aux Néerlandais."
 HOL_wic.17.b: "Nous ne livrerons jamais le sol américain à des puissances étrangères."
 HOL_wic.18.t: "San Juan Bautista repasse sous contrôle néerlandais"
 HOL_wic.18.d: "Les États-Unis ont accepté de céder Porto Rico au contrôle néerlandais. Cette reconquête historique de San Juan Bautista restaure un maillon vital dans les Caraïbes, consolidant nos ambitions maritimes et honorant l'héritage de la Compagnie des Indes occidentales."
 HOL_wic.18.a: "Un jour glorieux pour l'influence néerlandaise."
 HOL_wic.19.t: "Les Américains refusent l'ultimatum néerlandais"
 HOL_wic.19.d: "Les États-Unis ont catégoriquement refusé notre ultimatum de céder Porto Rico. Leur défi sape nos droits légitimes dans les Caraïbes, et nous devons désormais nous préparer à la guerre pour obtenir San Juan Bautista par la force."
 HOL_wic.19.a: "Nous le prendrons par la force. Les Caraïbes seront nôtres !"
 HOL_wic.20.t: "Les Néerlandais exigent les Antilles britanniques"
 HOL_wic.20.d: "Les Pays-Bas ont lancé un ultimatum formel exigeant le transfert des Antilles britanniques. Ils affirment que ces îles font partie intégrante de leurs ambitions historiques sous la Compagnie des Indes occidentales, invoquant leur valeur stratégique dans les Caraïbes. Un refus pourrait déclencher un conflit dans la région."
 HOL_wic.20.a: "Nous transférerons les Antilles britanniques au contrôle néerlandais."
 HOL_wic.20.b: "Nous refusons de céder des territoires britanniques."
 HOL_wic.21.t: "Antilles britanniques transférées"
 HOL_wic.21.d: "Le gouvernement britannique a accepté nos exigences, cédant les Antilles britanniques au contrôle néerlandais. Ce succès marque une nouvelle étape vers le rétablissement de l'influence de la Compagnie des Indes occidentales dans les Caraïbes."
 HOL_wic.21.a: "Les Caraïbes redeviennent néerlandaises."
 HOL_wic.22.t: "Les Britanniques rejettent l'ultimatum néerlandais"
 HOL_wic.22.d: "Les Britanniques ont refusé de nous céder les Antilles britanniques. Leur défi ne peut rester sans réponse, et nous devons nous préparer à prendre ces îles vitales par la force."
 HOL_wic.22.a: "Nous reprendrons ce qui nous appartient par la guerre."
 HOL_wic.23.t: "Les Néerlandais exigent le contrôle de Trinité"
 HOL_wic.23.d: "Les Pays-Bas ont lancé un ultimatum formel exigeant le transfert de Trinité sous contrôle néerlandais. Les Néerlandais invoquent leurs ambitions historiques sous la Compagnie des Indes occidentales, lorsque l'île fut brièvement envisagée comme « Nouvelle-Walcheren » au début du XVIIe siècle. Sa position stratégique dans la mer des Caraïbes la rend inestimable pour la domination maritime et les routes commerciales."
 HOL_wic.23.a: "Nous céderons Trinité aux Néerlandais."
 HOL_wic.23.b: "Nous refusons de céder aux exigences néerlandaises."
 HOL_wic.24.t: "Trinité repasse sous contrôle néerlandais"
 HOL_wic.24.d: "Le gouvernement trinidadien a accepté notre ultimatum et transféré le contrôle de l'île. Cette acquisition vitale renforce notre influence dans les Caraïbes et rétablit la domination néerlandaise dans la région, réalisant la vision de la Nouvelle-Walcheren."
 HOL_wic.24.a: "Une étape cruciale pour la Compagnie des Indes occidentales."
 HOL_wic.25.t: "Trinité rejette l'ultimatum néerlandais"
 HOL_wic.25.d: "Le gouvernement de Trinité a refusé de se conformer à nos exigences concernant l'île. Leur défi ne nous laisse d'autre choix que de nous préparer à la guerre pour reprendre ce territoire stratégiquement vital."
 HOL_wic.25.a: "Préparez les forces à la guerre !"
 HOL_wic.26.t: "Les Néerlandais exigent le retour du Suriname"
 HOL_wic.26.d: "Les Pays-Bas ont lancé un ultimatum formel exigeant le retour du Suriname sous leur contrôle. Autrefois colonie vitale sous domination néerlandaise, la position stratégique du Suriname et ses ressources abondantes sont vues comme essentielles au renouveau de l'influence de la Compagnie des Indes occidentales. Céder éviterait le conflit mais marquerait une perte de souveraineté."
 HOL_wic.26.a: "Nous céderons le Suriname aux Néerlandais."
 HOL_wic.26.b: "Nous refusons de nous soumettre aux exigences néerlandaises."
 HOL_wic.27.t: "Le Suriname repasse sous contrôle néerlandais"
 HOL_wic.27.d: "Le gouvernement surinamais a accepté notre ultimatum et transféré le contrôle de son territoire. Cette acquisition pacifique sécurise un maillon vital en Amérique du Sud, offrant ressources et positionnement stratégique pour poursuivre les ambitions néerlandaises."
 HOL_wic.27.a: "Un nouveau triomphe pour la WIC !"
 HOL_wic.28.t: "Le Suriname rejette l'ultimatum néerlandais"
 HOL_wic.28.d: "Le gouvernement surinamais a refusé de se conformer à nos exigences. Leur défi ne peut rester sans réponse, et nous devons nous préparer à prendre le contrôle du Suriname par les armes."
 HOL_wic.28.a: "Préparez la guerre !"
 HOL_wic.29.t: "Les Néerlandais exigent le contrôle de la Guyane"
 HOL_wic.29.d: "Les Pays-Bas ont lancé un ultimatum formel exigeant le transfert de la Guyane sous contrôle néerlandais. Historiquement partie de la Guyane néerlandaise, le territoire recèle de riches ressources et une valeur stratégique. Les Néerlandais soutiennent que reprendre la Guyane est essentiel pour relancer les ambitions de la Compagnie des Indes occidentales et consolider leur domination en Amérique du Sud."
 HOL_wic.29.a: "Nous transférerons la Guyane aux Néerlandais."
 HOL_wic.29.b: "Nous refusons de nous soumettre aux exigences néerlandaises."
 HOL_wic.30.t: "Le Guyana repasse sous contrôle néerlandais"
 HOL_wic.30.d: "Le gouvernement de la Guyane a accepté nos exigences et transféré le contrôle de son territoire. Cette acquisition pacifique relance l'influence néerlandaise en Amérique du Sud et réalise les ambitions de la Compagnie des Indes occidentales."
 HOL_wic.30.a: "Un triomphe de la détermination néerlandaise !"
 HOL_wic.31.t: "Le Guyana rejette l'ultimatum néerlandais"
 HOL_wic.31.d: "Le gouvernement de la Guyane a refusé de se conformer à notre ultimatum. Leur défi ne peut rester sans réponse, et nous devons nous préparer à prendre le contrôle du territoire par les armes."
 HOL_wic.31.a: "Nous saisirons la Guyane par la force."
 HOL_wic.32.t: "Les Néerlandais exigent le contrôle de la Guyane française"
 HOL_wic.32.d: "Les Pays-Bas ont lancé un ultimatum formel exigeant le transfert de la Guyane française sous contrôle néerlandais. Historiquement partie des ambitions coloniales néerlandaises dans les Amériques, ils revendiquent ce territoire comme une étape nécessaire pour restaurer la domination de la Compagnie des Indes occidentales dans la région. Céder évitera la guerre mais risque de miner le prestige et la souveraineté de la France."
 HOL_wic.32.a: "Nous céderons la Guyane française aux Néerlandais."
 HOL_wic.32.b: "Nous refusons de nous soumettre aux exigences néerlandaises."
 HOL_wic.33.t: "La Guyane française cédée au contrôle néerlandais"
 HOL_wic.33.d: "Le gouvernement français a accepté nos exigences et transféré le contrôle de la Guyane française. Cette victoire restaure un territoire critique sous contrôle néerlandais, consolidant notre influence en Amérique du Sud et réalisant les ambitions de la Compagnie des Indes occidentales."
 HOL_wic.33.a: "Un grand succès pour les ambitions néerlandaises !"
 HOL_wic.34.t: "La France rejette l'ultimatum néerlandais"
 HOL_wic.34.d: "Le gouvernement français a catégoriquement refusé notre ultimatum de transférer la Guyane française. Leur défi ne peut rester sans réponse, et nous devons nous préparer à la guerre pour reprendre ce territoire vital et affirmer notre domination dans les Amériques."
 HOL_wic.34.a: "Nous le saisirons par la force !"
 HOL_wic.35.t: "Les Néerlandais exigent le contrôle du nord du Brésil"
 HOL_wic.35.d: "Les Pays-Bas ont lancé un ultimatum formel exigeant le transfert de territoires du nord du Brésil. Ces régions furent autrefois sous contrôle néerlandais au XVIIe siècle, lorsque la Compagnie des Indes occidentales établit une colonie éphémère au Pernambouc et dans les environs. Les Néerlandais affirment désormais que reprendre ces terres est essentiel pour relancer leur influence en Amérique du Sud et sécuriser des ressources clés."
 HOL_wic.35.a: "Nous transférerons les territoires aux Néerlandais."
 HOL_wic.35.b: "Nous refusons leurs exigences. Le Brésil tiendra bon."
 HOL_wic.36.t: "Le Brésil transfère les territoires du nord"
 HOL_wic.36.d: "Le gouvernement brésilien a accepté nos exigences et transféré le contrôle des territoires du nord. Cette acquisition majeure restaure un fragment de notre héritage colonial en Amérique du Sud et renforce la présence néerlandaise dans la région."
 HOL_wic.36.a: "Une grande victoire pour la Compagnie des Indes occidentales !"
 HOL_wic.37.t: "Le Brésil rejette l'ultimatum néerlandais"
 HOL_wic.37.d: "Le gouvernement brésilien a refusé notre ultimatum, rejetant notre revendication sur les territoires du nord. Leur défi ne nous laisse d'autre choix que de nous préparer à une action militaire pour reprendre ces régions par la force."
 HOL_wic.37.a: "On ne nous le refusera pas ! Préparez la guerre !"
 HOL_wic.38.t: "Ultimatum néerlandais : restituez les territoires néerlando-américains"
 HOL_wic.38.d: "Les Pays-Bas ont lancé un ultimatum extraordinaire, exigeant le transfert d'anciens territoires néerlandais sur la côte Est, y compris des zones qui appartenaient autrefois à la Nouvelle-Néerlande. Ils invoquent un droit historique, citant l'héritage de La Nouvelle-Amsterdam et l'influence néerlandaise dans la fondation de ces régions. Céder serait vu comme une grande concession diplomatique et pourrait ébranler la fierté et la souveraineté américaines."
 HOL_wic.38.a: "Nous négocierons et transférerons les territoires."
 HOL_wic.38.b: "Nous ne livrerons jamais le sol américain !"
 HOL_wic.39.t: "Les États-Unis transfèrent les territoires néerlando-américains"
 HOL_wic.39.d: "Dans un retournement sans précédent, les États-Unis ont accepté de transférer le contrôle de territoires clés aux Pays-Bas. Cette victoire monumentale rétablit l'influence néerlandaise dans les Amériques et ranime l'esprit historique de La Nouvelle-Amsterdam."
 HOL_wic.39.a: "Un succès historique pour la diplomatie néerlandaise !"
 HOL_wic.40.t: "Les États-Unis rejettent l'ultimatum néerlandais"
 HOL_wic.40.d: "Les États-Unis ont purement et simplement refusé nos exigences de restitution des territoires néerlando-américains. Leur défi ne nous laisse d'autre choix que de nous préparer à la guerre pour reprendre ces terres par la force. La fierté de La Nouvelle-Amsterdam doit être restaurée !"
 HOL_wic.40.a: "Nous reprendrons ce qui nous appartient par la guerre !"
 HOL_nvu.4.t: "Réforme éducative achevée"
 HOL_nvu.4.d: "Après un an de transition, le nouveau système éducatif est pleinement opérationnel. La génération suivante est désormais façonnée par les valeurs de loyauté, de discipline et de fierté, assurant l'avenir de la nation."
 HOL_nvu.4.a: "Les réformes sont un succès retentissant !"
 HOL_nvu.5.t: "Ultimatum néerlandais : unification du Dietsland"
 HOL_nvu.5.d: "Le gouvernement néerlandais a lancé un ultimatum à la Belgique, exigeant le transfert immédiat de la Flandre pour unifier le Dietsland. La Belgique doit désormais décider d'accepter cette exigence ou d'affronter les conséquences d'un refus."
 HOL_nvu.5.a: "Accepter l'exigence et transférer la Flandre."
 HOL_nvu.5.b: "Refuser l'ultimatum."
 HOL_nvu.6.t: "La Belgique cède aux exigences néerlandaises"
 HOL_nvu.6.d: "Sous la pression de l'ultimatum néerlandais, la Belgique a accepté de transférer la Flandre aux Pays-Bas. C'est une étape significative vers l'unification du Dietsland."
 HOL_nvu.6.a: "L'unification du Dietsland commence !"
 HOL_nvu.7.t: "La Belgique refuse l'ultimatum néerlandais"
 HOL_nvu.7.d: "La Belgique a catégoriquement refusé l'ultimatum néerlandais de transférer la Flandre, défiant la vision d'un Dietsland unifié. Les Pays-Bas doivent désormais se préparer à agir et affirmer leur revendication par la force."
 HOL_nvu.7.a: "Nous revendiquerons toute la Belgique pour le Dietsland !"
 HOL_nvu.8.t: "Proposition néerlandaise : intégration de l'armée flamande"
 HOL_nvu.8.d: "Le gouvernement néerlandais a formellement demandé d'absorber les unités flamandes de nos forces armées dans leur structure militaire. Bien que politiquement sensible, la proposition est présentée comme un pas vers une plus grande coopération régionale."
 HOL_nvu.8.a: "Accepter le transfert"
 HOL_nvu.8.b: "Rejeter l'offre"
 HOL_nvu.9.t: "La Belgique accepte l'accord d'intégration"
 HOL_nvu.9.d: "Le gouvernement belge a accepté de transférer ses unités d'armée flamandes dans notre structure militaire. Les protocoles d'intégration commenceront immédiatement."
 HOL_nvu.9.a: "Excellent"
 HOL_nvu.10.t: "La Belgique rejette la proposition"
 HOL_nvu.10.d: "Le gouvernement belge a rejeté notre proposition d'intégrer leurs éléments d'armée flamands. L'offre a été jugée politiquement inacceptable par leur direction."
 HOL_nvu.10.a: "Décevant"
 HOL_nvu.11.t: "Proposition des Pays-Bas"
 HOL_nvu.11.d: "Les Pays-Bas ont proposé de former une « Fraternité germanique des nations », un pacte d'alignement militaire et culturel entre nos pays. Bien qu'idéologiquement compatible, les implications à long terme doivent être pesées avec soin."
 HOL_nvu.11.a: "Accepter la proposition"
 HOL_nvu.11.b: "Rejeter l'idée"
 HOL_nvu.12.t: "L'Allemagne accepte la Fraternité"
 HOL_nvu.12.d: "L'Allemagne a accepté de former une Fraternité germanique des nations. Un nouvel axe géopolitique a émergé en Europe."
 HOL_nvu.12.a: "L'avenir est à nous"
 HOL_nvu.13.t: "L'Allemagne rejette la fraternité"
 HOL_nvu.13.d: "Berlin a refusé notre proposition de forger une Fraternité germanique. La vision de l'unité doit être reportée, ou imposée."
 HOL_nvu.13.a: "Honteux"
 HOL_nvu.14.t: "La Fraternité germanique est née"
 HOL_nvu.14.d: "À la suite de négociations réussies avec les Pays-Bas, la Fraternité germanique des nations a été formellement établie. Cette nouvelle alliance repose sur une identité culturelle partagée, la coopération militaire et l'unité idéologique. L'Allemagne se tient désormais au cœur d'un nouvel axe nordique."
 HOL_nvu.14.a: "L'Enigkeit macht stark"
 HOL_nvu.15.t: "Projet d'infrastructure germanique"
 HOL_nvu.15.d: "Pour approfondir l'intégration et améliorer la mobilité stratégique entre les membres de la Fraternité germanique, nous nous sommes engagés à investir dans des infrastructures critiques reliant nos nations. Des réseaux ferroviaires et routiers modernes lieront le cœur de notre alliance nordique plus étroitement que jamais."
 HOL_nvu.15.a: "Poser les fondations de l'unité"
 HOL_nvu.16.t: "Investissement en ressources dans la Rhénanie"
 HOL_nvu.16.d: "Dans le cadre de notre coopération croissante avec l'Allemagne, des ingénieurs et planificateurs industriels néerlandais ont lancé une nouvelle initiative de développement en Rhénanie. Axé sur l'accès à l'acier et à l'aluminium, ce projet boostera la production industrielle de la région et sécurisera des matériaux vitaux pour la cause germanique."
 HOL_nvu.16.a: "La force grâce à l’industrie"
 HOL_nvu.17.t: "Invitation à rejoindre la Fraternité germanique"
 HOL_nvu.17.d: "Les Pays-Bas ont formellement invité l'Autriche à rejoindre la Fraternité germanique des nations. Cette alliance promet des objectifs stratégiques partagés, l'unité culturelle et la coopération militaire. Accepterons-nous leur vision d'un avenir germanique uni ?"
 HOL_nvu.17.a: "Nous acceptons leur offre"
 HOL_nvu.17.b: "Nous devons décliner"
 HOL_nvu.18.t: "L'Autriche accepte la Fraternité"
 HOL_nvu.18.d: "L'Autriche a accepté notre invitation à rejoindre la Fraternité germanique. Une autre fière nation germanique se tient à nos côtés dans l'unité et la force."
 HOL_nvu.18.a: "Bienvenue, Autriche"
 HOL_nvu.19.t: "L'Autriche rejette la fraternité"
 HOL_nvu.19.d: "L'Autriche a rejeté notre invitation à rejoindre la Fraternité germanique. Leur refus sera retenu."
 HOL_nvu.19.a: "Ils le regretteront"
 HOL_nvu.20.t: "Soutien naval néerlandais"
 HOL_nvu.20.d: "Les Pays-Bas ont tendu la main à nos ambitions navales en envoyant une aide matérielle et des investissements maritimes. Grâce à leur expertise, les fondations d'une flotte autrichienne sont enfin posées."
 HOL_nvu.20.a: "La renaissance de la marine autrichienne"
 HOL_nvu.21.t: "Renforcer l'Union germanique"
 HOL_nvu.21.d: "Pour assurer une coopération durable parmi les nations germaniques, les Pays-Bas ont initié de nouvelles politiques d'intégration, offrant coordination diplomatique, planification militaire conjointe et soutien économique. La Fraternité évolue vers une véritable Union."
 HOL_nvu.21.a: "L'union fait la force"
 HOL_nvu.22.t: "Proposition néerlandaise d'unification"
 HOL_nvu.22.d: "Les Pays-Bas ont proposé une unification complète des peuples germaniques sous un seul État. Nous devons désormais décider d'embrasser l'unité ou de rester à l'écart."
 HOL_nvu.22.a: "Nous acceptons l'union"
 HOL_nvu.22.b: "Nous rejetons leur offre"
 HOL_nvu.23.t: "Unification acceptée"
 HOL_nvu.23.d: "Notre offre d'unification a été acceptée. Un nouvel empire germanique naît sous direction néerlandaise."
 HOL_nvu.23.a: "Le rêve accompli"
 HOL_nvu.24.t: "Unification rejetée"
 HOL_nvu.24.d: "Notre proposition d'unification a été refusée. Nous devons désormais décider si la Fraternité s'arrête ici, ou se poursuit par la force."
 HOL_nvu.24.a: "Alors nous le prendrons"
 HOL_nvu.25.t: "Investissement néerlandais dans les ressources autrichiennes"
 HOL_nvu.25.d: "Dans une nouvelle phase d'intégration économique, le gouvernement néerlandais a proposé un investissement à grande échelle dans les secteurs autrichiens d'extraction et de raffinage des ressources. La manœuvre doit moderniser les infrastructures critiques et accroître la production de matières premières dans toute la région."
 HOL_nvu.25.a: "Cela renforcera notre base industrielle."
 HOL_nvu.26.t: "Investissement néerlandais dans le rail transallemand"
 HOL_nvu.26.d: "Le gouvernement néerlandais a annoncé un vaste programme d'investissement visant à moderniser et étendre les infrastructures ferroviaires à travers les régions germaniques. Les officiels affirment que le but est d'améliorer la mobilité, l'intégration économique et l'unité culturelle parmi les peuples allemands au sens large. La démarche s'aligne sur la vision continentale des Pays-Bas et leurs ambitions infrastructurelles croissantes en Europe centrale."
 HOL_nvu.26.a: "Une voie de fer pour un destin partagé."
 HOL_nvu.27.t: "Proposition néerlandaise d'unification"
 HOL_nvu.27.d: "Les Pays-Bas ont proposé une unification complète des peuples germaniques sous un seul État. Nous devons désormais décider d'embrasser l'unité ou de rester à l'écart."
 HOL_nvu.27.a: "Nous acceptons l'union"
 HOL_nvu.27.b: "Nous rejetons leur offre"
 HOL_nvu.28.t: "Unification acceptée"
 HOL_nvu.28.d: "Notre offre d'unification a été acceptée. Un nouvel empire germanique naît sous direction néerlandaise."
 HOL_nvu.28.a: "Le rêve accompli"
 HOL_nvu.29.t: "Unification rejetée"
 HOL_nvu.29.d: "Notre proposition d'unification a été refusée. Nous devons désormais décider si la Fraternité s'arrête ici, ou se poursuit par la force."
 HOL_nvu.29.a: "Alors nous le prendrons"
 HOL_common_event.18.t: "Sabaton au Musée militaire national"
 HOL_common_event.18.d: "Le Musée militaire national de Soesterberg a accueilli des projections du film de Sabaton The War To End All Wars, le cofondateur du groupe Pär Sundström y assistant en personne. La visite porte l'histoire de la Grande Guerre à un large public nouveau et attire une attention fraîche sur notre héritage militaire."
 HOL_common_event.18.a: "Notre histoire militaire inspire une nouvelle génération."
 HOL_ing_group_strategy_category: "Stratégies du groupe ING"
 HOL_ing_group_strategy_category_desc: "\n£ing_bank_category_picture \n\n\n\nAlors que les cycles économiques mondiaux oscillent entre croissance et récession, ING Bank est en position de tirer parti de ces fluctuations. Par une série de manœuvres financières calculées, ING peut étendre son influence sur les marchés nationaux et internationaux, orientant à la fois les efforts de reprise et les booms d'expansion. Ces décisions offrent aux Pays-Bas la capacité de s'appuyer sur le poids financier de la banque pour stimuler la croissance, gérer le risque et maximiser les rendements. En ajustant stratégiquement les politiques de crédit, en boostant la consommation et en étendant les réseaux commerciaux mondiaux, ING renforcera non seulement sa position de marché, mais consolidera aussi le statut des Pays-Bas comme puissance financière."
 HOL_ing_group_strategies_expansion_GER: "Deutsche ING"
 HOL_ing_group_strategies_expansion_GER_desc: "§Y[GER.GetNameWithFlag]§! a été un marché cœur pour ING, avec d'importants investissements dans la banque de détail et la finance d'entreprise. Étendre les opérations d'ING ici consolidera encore sa position dans le secteur bancaire européen."
 HOL_ing_group_strategies_expansion_POL: "ING Banque Śląski"
 HOL_ing_group_strategies_expansion_POL_desc: "ING s'est établi une forte présence en §Y[POL.GetNameWithFlag]§! via ING Bank Śląski. S'étendre davantage sur ce marché en croissance rapide renforcera l'influence d'ING en Europe centrale et orientale."
 HOL_ing_group_strategies_expansion_AST: "ING Direct Australie"
 HOL_ing_group_strategies_expansion_AST_desc: "L'économie tournée vers l'innovation §Y[AST.GetAdjective]§! offre à ING la chance de mener la banque numérique et la recherche. Étendre les opérations en Australie stimulera la croissance technologique d'ING et consolidera sa position de leader de la fintech."
 HOL_ing_group_strategies_expansion_SPR: "ING Espagne"
 HOL_ing_group_strategies_expansion_SPR_desc: "§Y[SPR.GetNameWithFlag]§! est un marché dynamique pour la banque numérique et les investissements d'infrastructure. En renforçant sa présence en Espagne, ING peut tirer parti du développement urbain croissant et améliorer son portefeuille de financement de la construction."
 HOL_ing_group_strategies_expansion_ITA: "ING Italie"
 HOL_ing_group_strategies_expansion_ITA_desc: "§Y[ITA.GetNameWithFlag]§! offre un marché financier mature avec des opportunités de croissance en banque d'entreprise. S'étendre en Italie aidera ING à établir un pied plus ferme en Europe du Sud et à booster les taux de croissance économique."
 HOL_ing_group_strategies_expansion_TUR: "Banque ING Turquie"
 HOL_ing_group_strategies_expansion_TUR_desc: "La position stratégique §Y[TUR.GetAdjective]§! entre l'Europe et l'Asie présente une opportunité unique pour ING d'étendre son influence commerciale et financière. En investissant en Turquie, ING peut accroître significativement ses opérations financières liées au commerce."
 HOL_ing_group_strategies_expansion_USA: "Gestion d'investissements ING aux États-Unis"
 HOL_ing_group_strategies_expansion_USA_desc: "§Y[USA.GetNameWithFlag]§!, plus grande économie du monde, offre d'immenses opportunités à ING, notamment en gestion d'investissement. S'étendre aux États-Unis sécurisera le rôle d'ING comme acteur mondial majeur de la gestion d'actifs."
 HOL_ing_group_strategies_expansion_ROM: "Banque ING Roumanie"
 HOL_ing_group_strategies_expansion_ROM_desc: "Le marché émergent §Y[ROM.GetAdjective]§! offre à ING l'opportunité de soutenir les infrastructures et le développement économique. Un investissement supplémentaire en Roumanie accroîtra l'influence d'ING dans le secteur financier en croissance de l'Europe de l'Est."
 HOL_ing_group_strategies_expansion_speciality1: "ING Digital First"
 HOL_ing_group_strategies_expansion_speciality1_desc: "Alors que le monde se tourne de plus en plus vers les solutions numériques, ING peut sécuriser sa position de leader de la banque digitale via la stratégie Digital First. Se spécialiser dans ce domaine améliorera la cybersécurité, réduira les coûts de transaction et renforcera l'efficacité de la banque numérique."
 HOL_ing_group_strategies_expansion_speciality2: "Approche ING Terra"
 HOL_ing_group_strategies_expansion_speciality2_desc: "Avec l'engagement d'aligner ses investissements sur les objectifs climatiques mondiaux, l'approche Terra d'ING se concentre sur le financement de projets d'énergie verte et de développement durable. Se spécialiser dans la finance durable boostera la production d'énergie verte et attirera des investissements écologiquement conscients."
 HOL_ing_group_strategies_expansion_speciality3: "Banque de gros ING"
 HOL_ing_group_strategies_expansion_speciality3_desc: "Les clients d'entreprise sont un axe clé de l'activité d'ING. En se spécialisant dans la banque de gros, ING renforcera sa capacité à offrir des solutions financières sur mesure aux grandes entreprises, stimulant la croissance corporative et les revenus."
 HOL_ing_group_strategies_expansion_speciality4: "Services de gestion de patrimoine ING"
 HOL_ing_group_strategies_expansion_speciality4_desc: "La gestion de patrimoine offre des rendements élevés et des relations clients de long terme. Se spécialiser dans la gestion de fortune permettra à ING de servir les particuliers fortunés, d'accroître la fiscalité sur les revenus du patrimoine et d'élargir ses services de finance personnelle."
 HOL_carrier_production: "Programme d'acquisition de porte-avions"
 HOL_carrier_production_desc: "\n£hol_carrier_program_decision_category \n\n\n\nLes Pays-Bas cherchent à étendre leurs capacités navales en acquérant des porte-avions auprès d'autres nations. Ces décisions nous permettront de renforcer notre flotte et de projeter notre puissance sur les mers via des partenariats stratégiques et des acquisitions militaires."
 HOL_request_carrier_production_uk: "Demander le soutien britannique pour la construction de porte-avions"
 HOL_request_carrier_production_uk_desc: "La Royal Navy a des siècles d'expérience maritime, et ses porte-avions modernes de classe Queen Elizabeth reflètent une conception navale de pointe. Un partenariat avec le Royaume-Uni pourrait nous permettre de co-développer un nouveau bâtiment taillé pour les opérations expéditionnaires néerlandaises et de l'OTAN."
 HOL_request_carrier_production_chn: "Demander le soutien chinois pour la construction de porte-avions"
 HOL_request_carrier_production_chn_desc: "L'expansion navale rapide de la Chine l'a positionnée comme une puissance mondiale de construction navale. Tirer parti de son échelle industrielle et de ses conceptions militaires modernes pourrait nous permettre d'aligner un porte-avions aux capacités uniques, bien qu'un tel alignement puisse tendre les partenariats occidentaux."
 HOL_request_carrier_production_dutch: "Investir dans la construction nationale de porte-avions"
 HOL_request_carrier_production_dutch_desc: "Les Pays-Bas lanceront la construction d'un porte-avions indigène en s'appuyant sur les chantiers nationaux et l'ingénierie néerlandaise avancée. Plus lent et plus coûteux qu'une aide étrangère, cet effort renforce la souveraineté nationale et soutient notre industrie navale."
 HOL_influence_flanders: "Prépondérance en §Y[FLN.GetNameWithFlag]§!"
 HOL_influence_flanders_desc: "Avec des liens culturels et historiques profonds entre §Y[HOL.GetNameWithFlag]§! et §Y[FLN.GetNameWithFlag]§!, une opportunité unique se présente de faire basculer la région vers un alignement avec la gouvernance néerlandaise. §Y[HOL.GetNameWithFlag]§! vise à accroître progressivement son emprise sur §Y[FLN.GetNameWithFlag]§!, pouvant mener à une intégration complète.\n\nÀ mesure que l'influence atteint des niveaux plus élevés, §Y[FLN.GetNameWithFlag]§! peut devenir plus indépendant de §Y[BEL.GetNameWithFlag]§!, avec des chances croissantes d'intégration aux Pays-Bas. Cependant, §Y[BEL.GetNameWithFlag]§! a le pouvoir de résister à cette influence, contrant les efforts néerlandais et renforçant les liens de §Y[FLN.GetNameWithFlag]§! avec son gouvernement actuel."
 HOL_high_influence_belgium: "Forte prépondérance §Y[HOL.GetAdjective]§! en §Y[BEL.GetNameWithFlag]§!"
 HOL_high_influence_belgium_desc: "Notre prééminence en §Y[FLN.GetNameWithFlag]§! a atteint un niveau notable, suscitant un soutien à l'intégration avec §Y[HOL.GetNameWithFlag]§!."
 HOL_voc_category: "L'héritage de la VOC renaît"
 HOL_voc_category_desc: "\n£hol_voc_category_picture \n\n\n\nLa Compagnie néerlandaise des Indes orientales, ou Vereenigde Oostindische Compagnie (VOC), fut autrefois l'empire commercial le plus puissant du monde. Ses flottes régnaient sur les mers, ses marchands contrôlaient le commerce mondial des épices, et ses administrateurs taillèrent un empire colonial à l'échelle des continents. Désormais, à l'âge moderne, §Y[HOL.GetNameWithFlag]§! a l'opportunité de ranimer cet héritage légendaire. En s'appuyant sur l'expertise §Y[HOL.GetFlag][HOL.GetAdjective]§! en commerce, diplomatie et innovation, la VOC peut renaître, non comme une relique du passé, mais comme une force pour façonner l'avenir.\n\n §Y[IND.GetNameWithFlag]§! est notre projet spécial. Si nous voulons reprendre notre colonie de la Couronne, nous devons préparer une invasion. Pour réussir, il faut sécuriser une tête de pont aussi vite que possible. Nous pouvons commencer les préparatifs, mais il faut garder notre §Rdétection§! aussi basse que possible. Sinon nous pourrions être découverts et un débarquement serait très difficile.\n\n Notre situation actuelle :\n §GForce§! à §Y[631.GetName]§! §Y[IND.GetNameWithFlag]§! : [?HOL_java_strength|+]\n §RChance de détection§! à §YJava Island§! §Y[IND.GetNameWithFlag]§! : [?HOL_java_detection_chance|-] \n §GForce§! à §YSumatra Island§! §Y[IND.GetNameWithFlag]§! : [?HOL_sumatra_strength|+]"
 HOL_voc_category_ind: "§Y[HOL.GetFlag][HOL.GetAdjective]§! menace pour §Y[IND.GetNameWithFlag]§!"
 HOL_voc_category_ind_desc: "Les §Y[HOL.GetFlag][HOL.GetAdjective]§! ont annoncé qu'ils feront tout pour reconquérir leur empire colonial. Nous devons nous préparer à ce danger imminent, car nous ne serons pas vaincus si facilement ! Nous pouvons accroître nos chances de détection en renforçant notre renseignement sur les §Y[HOL.GetFlag][HOL.GetAdjective]§! et en investissant dans notre §YSecurity Service§!. \n\n Chance de détection actuelle des préparatifs §Y[HOL.GetFlag][HOL.GetAdjective]§! : \n\n§GChance de détection§! à §YJava Island§! §Y[IND.GetNameWithFlag]§! : [?HOL_java_detection_chance|+]"
 HOL_wic_category: "La frontière audacieuse de la WIC"
 HOL_wic_category_desc: "\n£hol_wic_category_picture \n\n\n\nLa Compagnie néerlandaise des Indes occidentales (WIC) fut une force d'ambition et d'audace, voguant vers des eaux inexplorées pour établir l'influence néerlandaise dans les Amériques et en Afrique de l'Ouest. Des plantations de canne du Suriname aux plaques commerciales des Caraïbes et de la Côte-de-l'Or africaine, la WIC forgea un empire colonial par le commerce, le conflit et l'ingéniosité. Si ses heures de gloire se sont estompées, son héritage demeure, témoignage de la résilience et de la vision néerlandaises."
 HOL_core_german_state_schleswig_holstein: "Intégrer le Schleswig-Holstein"
 HOL_core_german_state_schleswig_holstein_desc: "Ce territoire est culturellement et stratégiquement important. Une intégration complète dans l'État néerlandais renforcera notre influence dans le monde germanique."
 HOL_core_german_state_niedersachsen: "Intégrer la Basse-Saxe"
 HOL_core_german_state_niedersachsen_desc: "Cette région forme l'épine dorsale septentrionale de l'Allemagne. L'intégrer solidifierait notre contrôle sur le cœur bas-allemand."
 HOL_core_german_state_nordrhein_westfalen: "Intégrer Nordrhein-Westfalen"
 HOL_core_german_state_nordrhein_westfalen_desc: "L'une des régions les plus industrielles d'Europe, son intégration renforcera notre position économique et stratégique."
 HOL_core_german_state_rheinland_pfalz: "Intégrer la Rhénanie-Palatinat"
 HOL_core_german_state_rheinland_pfalz_desc: "Placer cette région sous notre contrôle approfondit notre présence historique et culturelle le long du Rhin."
 HOL_core_german_state_hessen: "Intégrer la Hesse"
 HOL_core_german_state_hessen_desc: "La région hessoise relie l'ouest et le centre de l'Allemagne. La consolider soutient l'unité nationale."
 HOL_core_german_state_baden_wurttemberg: "Intégrer le Bade-Wurtemberg"
 HOL_core_german_state_baden_wurttemberg_desc: "Région riche et puissante, intégrer le Bade-Wurtemberg renforce notre prétention au leadership allemand du sud."
 HOL_core_german_state_bayern: "Intégrer la Bavière"
 HOL_core_german_state_bayern_desc: "Historiquement distincte mais indéniablement centrale pour l'Allemagne, l'intégration de la Bavière étend notre influence vers les territoires du sud."
 HOL_core_german_state_sachsen: "Intégrer la Saxe"
 HOL_core_german_state_sachsen_desc: "La Saxe a longtemps été un centre de culture et d'industrie allemandes. L'intégrer renforce à la fois l'héritage et les capacités."
 HOL_core_german_state_berlin: "Intégrer Berlin"
 HOL_core_german_state_berlin_desc: "Ancienne capitale de la Prusse et de l'Allemagne, l'intégration de Berlin est une nécessité symbolique et stratégique."
 HOL_core_german_state_steiermark: "Intégrer la Styrie"
 HOL_core_german_state_steiermark_desc: "Historiquement liée à l'Autriche, intégrer la Styrie renforce notre présence dans le monde germanique alpin."
 HOL_core_german_state_austria_proper: "Intégrer l’Autriche proprement dite"
 HOL_core_german_state_austria_proper_desc: "Au cœur de l'héritage habsbourgeois se trouve l'Autriche elle-même. Son intégration affirme notre leadership sur le monde germanique."
 HOL_core_german_state_tirol: "Intégrer le Tyrol"
 HOL_core_german_state_tirol_desc: "Les montagnes du Tyrol sont stratégiquement précieuses et culturellement liées. Les ramener dans notre giron sécurise notre frontière alpine."
 HOL_core_german_state_mecklenburg: "Intégrer le Mecklembourg"
 HOL_core_german_state_mecklenburg_desc: "Région maritime septentrionale essentielle au contrôle de l'approche baltique, son intégration étend la portée navale néerlandaise."
 HOL_core_german_state_thuringen: "Intégrer la Thuringe"
 HOL_core_german_state_thuringen_desc: "Centrale et culturellement riche, intégrer la Thuringe renforce notre position en Allemagne centrale."
 HOL_core_german_state_franken: "Intégrer la Franconie"
 HOL_core_german_state_franken_desc: "Intégrer cette région culturelle fragmentée unit l'héritage germanique sous une même bannière."
 HOL_core_german_state_koln_bonn: "Intégrer Cologne-Bonn"
 HOL_core_german_state_koln_bonn_desc: "Ce pôle économique et culturel est une pierre angulaire de l'influence allemande occidentale, essentiel à intégrer."
 HOL_core_german_state_saarland: "Intégrer la Sarre"
 HOL_core_german_state_saarland_desc: "Région frontalière aux ressources stratégiques, l'intégration de la Sarre sécurise la porte vers la France."
 HOL_core_german_state_sachsen_anhalt: "Intégrer la Saxe-Anhalt"
 HOL_core_german_state_sachsen_anhalt_desc: "Intégrer la Saxe-Anhalt renforce notre contrôle sur l'Allemagne centrale et sa base industrielle."
 HOL_core_german_state_brandenburg: "Intégrer le Brandebourg"
 HOL_core_german_state_brandenburg_desc: "Ancien siège du pouvoir prussien, l'intégration du Brandebourg est une étape vitale vers le rétablissement d'un leadership germanique."
 HOL_core_german_state_hamburg: "Intégrer Hambourg"
 HOL_core_german_state_hamburg_desc: "Port mondial et pôle économique, l'intégration de Hambourg ancre notre domination commerciale en Europe du Nord."
