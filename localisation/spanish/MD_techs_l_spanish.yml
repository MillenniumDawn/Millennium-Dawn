 module_naval_adl_1: "Láser de defensa de punto I"
 module_naval_adl_1_desc: "Los láseres de defensa de punto proporcionan una respuesta rápida y precisa contra drones y misiles entrantes, batiendo objetivos a la velocidad de la luz y sin las limitaciones de recarga de los interceptores convencionales.\n\n§GConsejo de diseño: Los láseres de defensa de punto proporcionan un fuerte ataque antiaéreo y blindaje para una protección cercana. Son útiles contra amenazas aéreas y de misiles avanzadas, pero cuestan más capacidad industrial (IC) y consumen más combustible que la defensa de punto convencional.§!"
 module_naval_adl_2: "Láser de defensa de punto II"
 module_naval_adl_2_desc: "Los láseres de defensa de punto proporcionan una respuesta rápida y precisa contra drones y misiles entrantes, batiendo objetivos a la velocidad de la luz y sin las limitaciones de recarga de los interceptores convencionales.\n\n§GConsejo de diseño: Los láseres de defensa de punto proporcionan un fuerte ataque antiaéreo y blindaje para una protección cercana. Son útiles contra amenazas aéreas y de misiles avanzadas, pero cuestan más capacidad industrial (IC) y consumen más combustible que la defensa de punto convencional.§!"
