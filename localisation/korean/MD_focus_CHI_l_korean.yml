 CHI_china_south_industries_group_materiel_manufacturer: "중국남방공업집단공사"
 CHI_china_state_shipbuilding_corporation_naval_manufacturer: "중국국유조선공사"
 CHI_shenyang_aircraft_corp_aircraft_manufacturer: "선양 항공기 공업 공사"
 CHI_xian_aircraft_corp_aircraft_manufacturer: "시안 항공기 공업 공사"
 CHI_outer_mongolia_expansion: "외몽골 수복"
 CHI_outer_mongolia_expansion_desc: "내몽골 문제는 해결되었고, 이제 외몽골 문제의 해결도 의제에 올랐습니다. 얄타 협정의 이 추악한 산물은 그 수명을 다했습니다. 역사적으로 중국의 적은 언제나 북쪽에서 왔습니다. 우리는 국경을 수도에서 멀리 두고, 몽골 초원의 분리주의 상황을 끝내며, 북방의 분리주의 뿌리를 뽑고, 북방의 방패를 되찾아야 합니다. "
 CHI_outer_mongolia_assimilation: "외몽골 동화"
 CHI_outer_mongolia_assimilation_desc: "운게른의 침공 이후 거의 한 세기가 지났으며, 중국 국경 수비대는 다시 한 번 캬흐타 국경을 순찰하고 있습니다."
 CHI_casic_df17_glide_body: "DF-17 활공체"
 CHI_casic_dfzf_test_range: "DF-ZF 시험장"
 CHI_cssc_hudong_auxiliary_line: "후둥 보조 생산 라인"
 CHI_cssc_type_901_fast_support: "901형 고속 지원함"
 CHI_cssc_type_903_replenishment: "903형 보급함"
 CHI_cssc_type_926_tender: "926형 지원함"
 CHI_norinco_trait_sharp_claw_ugv: "샤프 클로 UGV"
 CHI_norinco_trait_vu_t2_autonomy: "VU-T2 자율성"
 CHI_russian_arms_dependency_2: "$CHI_russian_arms_dependency$"
 CHI_russian_arms_dependency_2_desc: "인민해방군은 소련과 러시아의 설계 위에 세워졌습니다. 소화기는 라이선스 생산한 칼라시니코프인 56식에서 시작했고, 기갑 병과는 소련 T-54A의 직접 복제품인 59식에서 성장했으며, 이후의 전차와 보병전투차도 여전히 T-72와 BMP의 계보를 반영합니다. 포병, 수송기, 방공 포대도 같은 혈통을 공유합니다. 의존은 추진 계통에서 가장 깊습니다. AL-31F는 J-10과 J-11을 움직이고, RD-93은 JF-17을 날게 하며, Su-35 전투기와 S-400 포대는 모스크바에서 완제품으로 구입했습니다. 모든 국산 전투기 계열은 러시아제 터빈을 기다리고, 모든 라이선스 모델은 로열티를 내며, 설계국은 여전히 창조하는 것보다 복제하는 것이 더 많습니다. 중국이 자체 군수 산업 기반을 벼려 내기 전까지, 군의 심장 박동은 러시아에서 정해집니다.\n§W--------------§!\n우리의 군사적 자급자족은 §Y$CHI_norinco_rationalism$§!, §Y$CHI_own_designs$§!, §Y$CHI_ws15_bottleneck_solve$§! 같은 방위 산업 중점과 §Y$CHI_invest_domestic_arms_lines$§!, §Y$CHI_localise_licensed_system$§! 결정을 통해 상승합니다. 이 국가 정신은 자급자족이 §Y50§!를 넘으면 §G개선§!됩니다."
 CHI_russian_arms_dependency_3: "$CHI_russian_arms_dependency$"
 CHI_russian_arms_dependency_3_desc: "인민해방군은 소련과 러시아의 설계 위에 세워졌습니다. 소화기는 라이선스 생산한 칼라시니코프인 56식에서 시작했고, 기갑 병과는 소련 T-54A의 직접 복제품인 59식에서 성장했으며, 이후의 전차와 보병전투차도 여전히 T-72와 BMP의 계보를 반영합니다. 포병, 수송기, 방공 포대도 같은 혈통을 공유합니다. 의존은 추진 계통에서 가장 깊습니다. AL-31F는 J-10과 J-11을 움직이고, RD-93은 JF-17을 날게 하며, Su-35 전투기와 S-400 포대는 모스크바에서 완제품으로 구입했습니다. 모든 국산 전투기 계열은 러시아제 터빈을 기다리고, 모든 라이선스 모델은 로열티를 내며, 설계국은 여전히 창조하는 것보다 복제하는 것이 더 많습니다. 중국이 자체 군수 산업 기반을 벼려 내기 전까지, 군의 심장 박동은 러시아에서 정해집니다.\n§W--------------§!\n우리의 군사적 자급자족은 §Y$CHI_norinco_rationalism$§!, §Y$CHI_own_designs$§!, §Y$CHI_ws15_bottleneck_solve$§! 같은 방위 산업 중점과 §Y$CHI_invest_domestic_arms_lines$§!, §Y$CHI_localise_licensed_system$§! 결정을 통해 상승합니다. 이 국가 정신은 자급자족이 §Y75§!를 넘으면 §G개선§!됩니다."
 CHI_russian_arms_dependency_4: "$CHI_russian_arms_dependency$"
 CHI_russian_arms_dependency_4_desc: "인민해방군은 소련과 러시아의 설계 위에 세워졌습니다. 소화기는 라이선스 생산한 칼라시니코프인 56식에서 시작했고, 기갑 병과는 소련 T-54A의 직접 복제품인 59식에서 성장했으며, 이후의 전차와 보병전투차도 여전히 T-72와 BMP의 계보를 반영합니다. 포병, 수송기, 방공 포대도 같은 혈통을 공유합니다. 의존은 추진 계통에서 가장 깊습니다. AL-31F는 J-10과 J-11을 움직이고, RD-93은 JF-17을 날게 하며, Su-35 전투기와 S-400 포대는 모스크바에서 완제품으로 구입했습니다. 모든 국산 전투기 계열은 러시아제 터빈을 기다리고, 모든 라이선스 모델은 로열티를 내며, 설계국은 여전히 창조하는 것보다 복제하는 것이 더 많습니다. 중국이 자체 군수 산업 기반을 벼려 내기 전까지, 군의 심장 박동은 러시아에서 정해집니다.\n§W--------------§!\n우리의 군사적 자급자족은 §Y$CHI_norinco_rationalism$§!, §Y$CHI_own_designs$§!, §Y$CHI_ws15_bottleneck_solve$§! 같은 방위 산업 중점과 §Y$CHI_invest_domestic_arms_lines$§!, §Y$CHI_localise_licensed_system$§! 결정을 통해 상승합니다. 이 국가 정신은 자급자족이 §Y100§!에 도달하면 §R제거§!됩니다."
 CHI_local_government_debt: "지방 정부 부채"
 CHI_local_government_debt_desc: "성 및 시 정부는 공개적으로 차입할 수 없으므로, 미래의 토지 매각을 담보로 은행 대출과 채권을 일으키는 자금 조달 기구를 통해 돈을 마련합니다. 그 수익은 간부 평가에서 보상받는 공장, 사무 단지, 인프라에 투입되며, 재정 체계가 감당할 수 있는 수준을 넘는 모든 사업은 중앙 정부가 공식적으로 보증한 적이 없는 부채 더미를 키웁니다. 은행은 대출을 상각하는 대신 만기를 연장하고, 이자는 지방 예산의 점점 더 큰 몫을 잠식하며, 부채의 실제 규모는 신탁 상품과 부외 대출 속에 감춰져 있습니다. 베이징이 어쩔 수 없이 부채를 줄이게 되면 신용이 조여지고, 건설이 멈추며, 차입한 토지 수입 위에 세워진 성장 모델이 풀리기 시작합니다.\n§W--------------§!\n지방 부채 압력은 우리 공장과 사무 단지가 재정 허용치를 초과하는 동안 매월 상승하고, 그렇지 않을 때는 서서히 하락합니다. §Y$CHI_shadow_banking_cleanup$§!, §Y$CHI_three_red_lines_crackdown$§!, §Y$CHI_common_prosperity$§! 같은 중점은 압력을 낮추고, §Y$CHI_policy_banks_cdb$§!, §Y$CHI_wto_commercial_bank_reform$§! 같은 중점은 허용치를 높이며, §Y$CHI_provincial_debt_swap$§! 결정은 부채를 직접 상환합니다. §Y$CHI_four_trillion_stimulus$§! 같은 부양 중점은 압력을 높입니다. 이 국가 정신은 압력이 §Y90§! 아래로 떨어지면 §G개선§!됩니다."
 CHI_local_government_debt_2: "$CHI_local_government_debt$"
 CHI_local_government_debt_2_desc: "성 및 시 정부는 공개적으로 차입할 수 없으므로, 미래의 토지 매각을 담보로 은행 대출과 채권을 일으키는 자금 조달 기구를 통해 돈을 마련합니다. 그 수익은 간부 평가에서 보상받는 공장, 사무 단지, 인프라에 투입되며, 재정 체계가 감당할 수 있는 수준을 넘는 모든 사업은 중앙 정부가 공식적으로 보증한 적이 없는 부채 더미를 키웁니다. 은행은 대출을 상각하는 대신 만기를 연장하고, 이자는 지방 예산의 점점 더 큰 몫을 잠식하며, 부채의 실제 규모는 신탁 상품과 부외 대출 속에 감춰져 있습니다. 베이징이 어쩔 수 없이 부채를 줄이게 되면 신용이 조여지고, 건설이 멈추며, 차입한 토지 수입 위에 세워진 성장 모델이 풀리기 시작합니다.\n§W--------------§!\n지방 부채 압력은 우리 공장과 사무 단지가 재정 허용치를 초과하는 동안 매월 상승하고, 그렇지 않을 때는 서서히 하락합니다. §Y$CHI_shadow_banking_cleanup$§!, §Y$CHI_three_red_lines_crackdown$§!, §Y$CHI_common_prosperity$§! 같은 중점은 압력을 낮추고, §Y$CHI_policy_banks_cdb$§!, §Y$CHI_wto_commercial_bank_reform$§! 같은 중점은 허용치를 높이며, §Y$CHI_provincial_debt_swap$§! 결정은 부채를 직접 상환합니다. §Y$CHI_four_trillion_stimulus$§! 같은 부양 중점은 압력을 높입니다. 이 국가 정신은 압력이 §Y70§! 아래로 떨어지면 §G개선§!되고, §Y89§!를 넘으면 §R악화§!됩니다."
 CHI_local_government_debt_3: "$CHI_local_government_debt$"
