 ISR_raid_beit_leiha: "베이트 라히아 습격"
 israel.101.t: "작전을 성공적으로 수행한 [ISR.GetNameWithFlag]"
 israel.101.d: "최근 이스라엘은 [HAM.GetNameWithFlag]를 향한 공격을 개시하여 베이트 라히아를 습격했습니다.\n\n그 결과 인민저항위원회 수장이 암살되었습니다."
 israel.101.a: "훌륭해!"
 israel.101.b: "그들의 병사를 붙잡아라!"
 israel.101.c: "보복 공격을 금지하라."
 israel.102.t: "베이트 라히아를 성공적으로 방어한 [HAM.GetNameWithFlag]"
 israel.102.d: "최근 [ISR.GetNameWithFlag]는 베이트 라히아를 공격하여 인민저항위원회 수장을 암살하려 했습니다. 그러나 그들은 실패했고 [HAM.GetNameWithFlag]가 승리했습니다."
 israel.102.b: "훌륭해!"
 israel.103.t: "결판나지 않은 [ISR.GetNameWithFlag] - [HAM.GetNameWithFlag] 충돌!"
 israel.103.d: "양측 간의 충돌이 중단되었습니다."
 israel.102.a: "매우 유감이다..."
 israel.104.t: "우리 병사를 붙잡은 [HAM.GetNameWithFlag]!"
 israel.104.d: "최근 충돌 이후, [HAM.GetNameWithFlag]는 길라드 샬리트라는 병사를 붙잡아 인질로 억류하고 있습니다."
 israel.104.a: "젠장!"
 ISR_jabel_mukaber_judge: "자벨 무카베르에 대한 판결"
 israel.105.t: "자벨 무카베르를 어떻게 해야 하는가?"
 israel.105.d: "자벨 무카베르는 동예루살렘 남부의 주로 팔레스타인인이 거주하는 지구입니다. 서쪽으로는 동탈피오트, 북쪽으로는 아부 토르와 실완, 남쪽으로는 수르 바헤르와 접해 있습니다.\n\n우리 전문가들은 이곳이 쓰레기통에서 넘친 쓰레기가 거리 곳곳에 널려 있고, 놀이터도 녹지도 없으며, 교실과 유치원이 부족하고, 주민들이 20년간 탄원한 끝에 불과 2년 전에야 남학생용 고등학교가 하나 문을 연 우울한 빈민가라고 주장합니다. 주민들은 국가에 세금을, 지방자치단체에 재산세를 내지만 그 대가로 눈에 보이는 혜택은 거의 받지 못하는 것으로 보입니다.\n\n어떻게 하시겠습니까?"
 israel.105.a: "기한을 연장하라."
 israel.105.b: "퇴거를 요구하라!"
 israel.106.t: "자벨 무카베르를 압박하는 이스라엘!"
 israel.106.d: "최근 이스라엘은 예루살렘의 자벨 무카베르 공동체를 압박하기 시작했으며, 그들을 몰아내고 그곳에 더 많은 정착촌을 건설하려 하고 있습니다. 부역자인 서안 지구 당국은 이에 대해 아무것도 하지 않습니다! 이스라엘에 최후통첩을 보내야 하겠습니까?"
 israel.106.a: "그렇다!"
 israel.106.b: "우리가 상관할 일이 아니다."
 israel.107.t: "최근 충돌에서 성공한 [ISR.GetNameWithFlag]!"
 israel.107.d: "최근 [HAM.GetNameWithFlag]가 자벨 무카베르에 대한 압박 완화를 요구한 이후, [HAM.GetNameWithFlag]는 이스라엘군에 맞서 성공을 거두지 못했습니다."
 israel.107.a: "훌륭해!"
 israel.107.b: "다음에는 성공할 것이다!"
 israel.108.t: "최근 충돌에서 성공한 [HAM.GetNameWithFlag]!"
 israel.108.d: "최근 [HAM.GetNameWithFlag]가 자벨 무카베르에 대한 압박 완화를 요구한 이후, [HAM.GetNameWithFlag]는 이스라엘군에 맞서 성공을 거두었습니다."
 israel.108.a: "뼈아픈 타격이다."
 israel.108.b: "알라후 아크바르!"
 israel.109.t: "결판나지 않은 최근 충돌의 결과!"
 israel.109.d: "최근의 충돌은 결판이 나지 않았습니다."
 israel.109.a: "뼈아픈 타격이다."
 israel.109.b: "응?"
 operations_blocked: "최근 작전 이후 최소 1년이 지났다."
 HAM_gush_etzion_capt: "구시 에치온에서 이스라엘인 납치"
 israel.110.t: "이스라엘인 3명을 납치한 [HAM.GetNameWithFlag]!"
 israel.110.d: "최근 [HAM.GetNameWithFlag]가 이스라엘 시민 세 명을 납치했습니다. 우리는 그들을 구출하고 복수해야 합니다!"
 israel.110.a: "형제의 수호자 작전을 개시하라."
 israel.110.b: "우리는 아무것도 할 수 없다."
 israel.111.t: "최근 충돌에서 성공한 [ISR.GetNameWithFlag]!"
 israel.111.d: "최근 [HAM.GetNameWithFlag]가 이스라엘 시민 세 명을 납치한 이후, [HAM.GetNameWithFlag]는 이스라엘군에 맞서 성공을 거두지 못했습니다."
 israel.111.a: "훌륭해!"
 israel.111.b: "다음에는 성공할 것이다!"
 israel.112.t: "최근 충돌에서 성공한 [HAM.GetNameWithFlag]!"
 israel.112.d: "최근 [HAM.GetNameWithFlag]가 이스라엘 시민 세 명을 납치한 이후, [HAM.GetNameWithFlag]는 이스라엘군에 맞서 성공을 거두었습니다."
 israel.112.a: "뼈아픈 타격이다."
 israel.112.b: "알라후 아크바르!"
 HAM_start_raid_on_isr: "[ISR.GetNameWithFlag] 습격"
 israel.113.t: "최근 충돌에서 성공한 [ISR.GetNameWithFlag]!"
 israel.113.d: "최근 [HAM.GetNameWithFlag]가 이스라엘 국경을 공격한 이후, [HAM.GetNameWithFlag]는 이스라엘군에 맞서 성공을 거두지 못했습니다."
 israel.113.a: "훌륭해!"
 israel.113.b: "다음에는 성공할 것이다!"
 israel.114.t: "최근 충돌에서 성공한 [HAM.GetNameWithFlag]!"
 israel.114.d: "최근 [HAM.GetNameWithFlag]가 이스라엘 국경을 공격한 이후, [HAM.GetNameWithFlag]는 이스라엘군에 맞서 성공을 거두었습니다."
 israel.114.a: "뼈아픈 타격이다."
 israel.114.b: "알라후 아크바르!"
 israel.115.t: "홍해 정상회담"
 israel.115.d: "최근 미국 당국자들과의 협의 이후, 그들은 평화를 위한 새로운 로드맵을 제안했습니다. 여기에는 아라파트가 마흐무드 압바스를 총리로 임명하여 권력을 분산하는 대가로, 가자와 북부 사마리아에서의 철수를 시작하는 방안이 포함되어 있습니다."
 israel.115.a: "[PAL.GetLeader]가 충분히 이성적이기를 바란다."
 israel.115.b: "이 제안에 동의한다."
 israel.115.c: "정말 어리석은 제안이다!"
