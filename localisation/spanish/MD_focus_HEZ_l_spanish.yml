 hezbollah_events.15.d: "With the help of almighty Allah and the bravery of our fighter's will, we have damaged the Enemy's Armed Forces slightly!"
 hezbollah_events.15.o1: "Subhan Alá!"
 hezbollah_events.10.t: "Los asaltantes de Hezbolá son derrotados!"
 hezbollah_events.10.d: ""
 hezbollah_events.10.o1: "Muy bien."
 hezbollah_events.11.t: "Los asaltantes de Hezbolá saquearon nuestros equipos con éxito!"
