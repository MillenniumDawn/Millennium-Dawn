 UKR_kharkiv_pact_signed_tt: "Аренда §YСевастопольской бухты§! §YЧерноморским флотом§! продлена до §Y2042§! года. Если мы выберем путь в §YНАТО§!, то всё равно сможем потребовать вернуть базу начиная с §Y2017§! года."
 UKR_kharkiv_pact_refused_tt: "Аренда базы §YЧерноморским флотом§! истекает в §Y2017§! году. После этого мы потребуем вернуть §YСевастопольскую бухту§!, и §RРоссия может ответить войной§!."
 UKR_sevastopol_naval_base_category: "Севастопольская военно-морская база"
 UKR_sevastopol_naval_base_category_desc: "\n\n\n\n\n\n£UKR_desctext_sevastopol_naval_base_main\n\n\n\n\n\n\n\n\n§W[SOV.GetFlag]§Y[SOV.GetAdjective] Черноморский флот§! базируется на нашей территории по соглашениям 1997 года, и срок аренды §YСевастопольской бухты§! истекает в §Y2017§! году.\nМы можем попытаться пересмотреть соглашение и вытеснить §Y[SOV.GetNameWithFlag]§! раньше, но наши шансы во многом зависят от нашей военной мощи, успешных закупок новой военной техники или вступления в §YНАТО§!.\n\nТребование стоит §Y750§! £pol_power и §Y100§! £command_power в 2000 году и каждый год до §Y2009§! дешевеет на §G50§! £pol_power и §G10§! £command_power , после чего стоит §Y300§! £pol_power и §Y10§! £command_power . С §Y1 января 2010§! года досрочное расторжение недоступно, но вместо этого можно подготовиться к Харьковским соглашениям.§!$UKR_sevastopol_russia_answer$"
 UKR_sevastopol_naval_base_terminate_bsf_lease: "§RРасторгнуть§! договор: [SOV.GetFlag]§Y[SOV.GetAdjective]§! Черноморский флот\n§Yаренда базы§!"
 UKR_sevastopol_naval_base_terminate_bsf_lease_desc: "\n\n\n\n\n\n£UKR_desctext_sevastopol_lease_for_tooltip\n\n\n\n\n\n\n\n\n§WПо соглашениям 1997 года [SOV.GetFlag]§Y[SOV.GetAdjective]§! флот может оставаться в §YСевастополе§! до 2017 года. Мы можем уведомить §YМоскву§! о досрочном расторжении аренды и потребовать передать нам базу.\n\nЕсли §Y[SOV.GetNameWithFlag]§! согласится, §YСевастопольская бухта§! §Gвернётся под наш контроль§!. В противном случае §Rотношения§! с §Y[SOV.GetNameWithFlag]§! §Rухудшатся§!, но аренда всё равно истечёт в §Y2017§! году.\n\nОбратите внимание: это §Yоднократное§! решение. Если сейчас мы §Rне готовы§!, другой возможности выдворить их §Rне будет§! §Yдо тех пор§!, пока не истечёт исходное соглашение.\n\nПосле принятия этого решения придётся пару дней ждать, что ответит §Y[SOV.GetFlag] [SOV.GetAdjective]§! МИД. Будьте готовы!§!"
 UKR_sevastopol_naval_base_prepare_kharkiv_pact: "Подготовка к Харьковским соглашениям"
 UKR_sevastopol_naval_base_prepare_kharkiv_pact_desc: "\n\n\n\n\n\n£UKR_desctext_kharkiv_pact_for_tooltip\n\n\n\n\n\n\n\n\n§WМосква предлагает продлить аренду базы §YЧерноморским флотом§! в обмен на более дешёвый газ. Мы должны решить, подписать ли соглашение или дать аренде истечь в 2017 году.\n\n§RПодписание продлит аренду до§! §Y2042§! года. §GОтказ позволит потребовать вернуть бухту в§! §Y2017§! году, §Rхотя Россия может начать из-за этого войну§!.$UKR_sevastopol_russia_answer$§!"
 UKR_sevastopol_russia_answer: "\n\n§WКак §Y[SOV.GetNameWithFlag]§! ответит на наше требование?\n§Y[SOV.GetNameWithFlag]§! может §Gвывести флот§!, §Yотказать§! или §Rобъявить войну§!.\nКогда мы станем членом §YНАТО§!, §Y[SOV.GetNameWithFlag]§! сможет только §Gвывести флот§!.\n\n§WПредотвращение войны§!\nЕсли наши §7Вооружённые силы§! и §7оборонный сектор§! будут отвечать §Rвсем§! следующим требованиям в момент ответа §Y[SOV.GetNameWithFlag]§!, она не станет §Rобъявлять войну§!. Выполнение лишь части требований §Rне даёт эффекта§!.\n\nПоказатели силы и их отметки §Yобновляются ежемесячно§!. Россия проверяет нашу §Yтекущую силу§! в момент ответа, а не этот отчёт. Изменения после последнего обновления могут повлиять на исход:\n---§7Сила Вооружённых сил§!---\n- §Y[?UKR_manpower_total_count]§! из §Y1000000§! необходимых солдат [UKR_crimea_deterrent_status_manpower]\n- §Y[?UKR_mbts_total_count]§! из §Y5000§! необходимых ОБТ [UKR_crimea_deterrent_status_tanks]\n- §Y[?UKR_artillery_total_count]§! из §Y5000§! необходимых артиллерийских орудий [UKR_crimea_deterrent_status_artillery]\n- §Y[?UKR_spaa_total_count]§! из §Y150§! необходимых батарей ЗСУ/ЗРК [UKR_crimea_deterrent_status_spaa]\n- §Y[?UKR_aircraft_total_count]§! из §Y1000§! необходимых самолётов [UKR_crimea_deterrent_status_planes]\n- §Y[?UKR_ships_total_count]§! из §Y100§! необходимых кораблей [UKR_crimea_deterrent_status_ships]\n---§BСила ПВО§!---\n- §Y[?UKR_crimea_deterrent_aa_kyiv]§! из §Y4§! в регионе §Y[698.GetName]§! [UKR_sevastopol_status_air_defense_kyiv]\n- §Y[?UKR_crimea_deterrent_aa_kharkiv]§! из §Y4§! в регионе §Y[696.GetName]§! [UKR_sevastopol_status_air_defense_kharkiv]\n- §Y[?UKR_crimea_deterrent_aa_dnipro]§! из §Y4§! в регионе §Y[1087.GetName]§! [UKR_sevastopol_status_air_defense_dnipro]\n- §Y[?UKR_crimea_deterrent_aa_odesa]§! из §Y4§! в регионе §Y[695.GetName]§! [UKR_sevastopol_status_air_defense_odesa]\n---§OКонтроль над Донбассом§!---\n- §Y[693.GetName]§! [UKR_crimea_deterrent_status_donetsk]\n- §Y[1030.GetName]§! [UKR_crimea_deterrent_status_west_donetsk]\n- §Y[1075.GetName]§! [UKR_crimea_deterrent_status_luhansk]\n- §Y[1076.GetName]§! [UKR_crimea_deterrent_status_north_luhansk]\n\n§WСтимулы к выводу флота§!\nКаждый из следующих шагов с нашей стороны делает §Gвывод флота вероятнее§! для §Y[SOV.GetNameWithFlag]§!, а §Gвойну менее вероятной§!:\n---§CФокусы§!---\n- §Y$UKR_sapsan$§! [UKR_sevastopol_status_sapsan]\n- §Y$UKR_hur_reform$§! [UKR_sevastopol_status_hur_reform]\n- §Y$UKR_ukrainian_armed_forces_reform$§! или §Y$UKR_poroshenko_army_reform$§! [UKR_sevastopol_status_army_reform]\n---§OРешения§!---\n- ОБТ §YОбъект 477А1 «Нота»§! [UKR_sevastopol_status_nota]\n- корветы §Yпроекта 58250 «Владимир Великий»§! [UKR_sevastopol_status_58250]\n- самолёты §YАн-LBL§! или §YАн-BFV§! [UKR_sevastopol_status_an_aircraft]\n\nЕсли [SOV.GetFlag]§Y[SOV.GetAdjective]§! военный потенциал ослабнет или в §YМоскве§! будет демократическое правительство, война тоже станет менее вероятной.§!"
 ukraine_sevastopol.1.name: "Киев требует вернуть Севастополь"
 ukraine_sevastopol.1.desc_nato: "Украина теперь член НАТО и требует вернуть Севастопольскую бухту. Отказ означал бы прямое противостояние с Альянсом."
 ukraine_sevastopol.1.desc_early: "Украина уведомила нас о досрочном расторжении аренды базы Черноморского флота и требует передать ей базу. Соглашения 1997 года этого не предусматривают, но Киев настаивает."
 ukraine_sevastopol.1.desc_nato_prep: "Несмотря на продлённую аренду, Киев движется к НАТО и требует вернуть Севастопольскую бухту. Альянс пока не дал Украине никаких гарантий."
 ukraine_sevastopol.1.desc_expiry: "Срок аренды базы Черноморского флота истёк, и Киев требует вернуть Севастопольскую бухту."
 ukraine_sevastopol.1.a: "Вывести флот"
 ukraine_sevastopol.1.b: "Отклонить требование"
 ukraine_sevastopol.1.c: "Севастополь останется российским, силой"
 ukraine_sevastopol.2.name: "Севастополь возвращается Украине"
 ukraine_sevastopol.2.desc: "Российский флот ушёл, и база в Севастопольской бухте снова в украинских руках."
 ukraine_sevastopol.2.a: "Исторический день"
 ukraine_sevastopol.3.name: "Россия отказывается покинуть Севастополь"
 ukraine_sevastopol.3.desc: "Москва отклонила наше требование и настаивает, чтобы Черноморский флот остался в Севастополе. Пока она не прибегла к силе."
 ukraine_sevastopol.3.a: "Мы этого не забудем"
 ukraine_sevastopol.4.name: "Россия отказывает и вторгается"
 ukraine_sevastopol.4.desc: "Москва отклонила наше требование вернуть Севастопольскую бухту и объявила войну. НАТО не дало нам никаких гарантий."
 ukraine_sevastopol.4.a: "К оружию"
