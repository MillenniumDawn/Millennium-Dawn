 faction_SIA_seato_alliance: "SEATO 회원국"
 faction_SIA_seato_alliance_desc: "동남아시아 조약기구(SEATO)는 태국이 창설하고 아세안 회원국을 중심으로 구성된 상호 방위 조약입니다. 1954년의 원래 조약은 외부 열강의 도구였으며 1977년에 해체되었으나, 이번 조약은 설계부터 지역적입니다. 방콕이 중심에 있고 회원국은 이웃 나라들이며, 보장은 누군가의 봉쇄 전략이 아닌 동남아시아의 방어를 위한 것입니다."
 faction_SIA_seato_TT: "§R세력 특수 규칙§!:\n- 동남아시아 국가만 세력에 가입할 수 있습니다\n- 전쟁 중인 국가는 가입할 수 없습니다\n- 독립국만 선전포고를 할 수 있습니다\n- 국가는 방어 전쟁에서만 호출될 수 있습니다\n- 회원국이 발행한 보장은 세계 긴장도를 §Y15%§! 덜 발생시킵니다\n- 회원국은 인력의 §Y10%§!를 세력 예비대로 모읍니다\n- 지도부는 명부가 §Y50%§! 미만일 때에만 교체될 수 있습니다"
 faction_SIA_seato_alliance_call_ally_rule_tt: "§RSEATO 회원국은 방어 전쟁에서만 동맹을 호출할 수 있습니다!§!"
 faction_SIA_seato_alliance_join_ally_rule_tt: "§RSEATO 회원국은 방어 전쟁에서만 동맹에 참전할 수 있습니다!§!"
 faction_SIA_seato_alliance_join_faction_rule_tt: "§R동남아시아 국가만 SEATO에 가입할 수 있습니다!§!"
