 subject_rus.66.t: "[FROM.GetNameWithFlag], 종속국 지위 격상 희망"
 subject_rus.66.d: "[FROM.GetNameWithFlag]은(는) 자국 정부가 이미 경제적, 정치적으로 준비되었다고 판단하여 현재의 종속국 지위를 높이기를 원합니다. 동의하시겠습니까?"
 subject_rus.66.a: "그들의 자치를 확대한다"
 subject_rus.66.b: "아니요"
 subject_rus.67.t: "자치 확대"
 subject_rus.67.d: "러시아가 연방 내 우리의 자치 수준을 높이기로 동의했습니다. 마침내 우리는 러시아와 함께 더 발전해 나갈 준비가 되었습니다!"
 subject_rus.67.a: "알았다"
 subject_rus.68.t: "자치 확대"
 subject_rus.68.d: "러시아가 우리의 자치 수준을 높이는 것을 거부했습니다. 그들은 자신들이 얼마나 큰 실수를 하고 있는지 이해하지 못하고 있습니다!"
 subject_rus.68.a: "유감이군"
 subject_rus.69.t: "[FROM.GetNameWithFlag], 연방화 요구"
 subject_rus.69.d: "[FROM.GetNameWithFlag] 정부가 국내의 불안정한 정세를 이유로 우리에게 공식 최후통첩을 보내, 본격적인 연방화와 종속국에 대한 더 큰 권한 부여를 촉구했습니다. 그들의 요구를 받아들이시겠습니까?"
 subject_rus.69.a: "그들에게 자치를 부여한다."
 subject_rus.69.b: "동의하지 않는다"
