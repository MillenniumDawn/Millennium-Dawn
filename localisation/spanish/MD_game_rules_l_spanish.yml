 RULE_OPTION_IF_POINT_50_DESC: "La tasa de ticks mensual de la opinión de la §YFacción interna§! se establecerá en el valor predeterminado de 0,50"
 RULE_OPTION_IF_POINT_75: "0.75 Opinión Mensual"
 RULE_OPTION_IF_POINT_75_DESC: "La tasa de ticks mensuales de la opinión de la §YFacción interna§! se establecerá en 0,75 en lugar del valor predeterminado de 0,50. Los logros personalizados de Millennium Dawn se desactivarán con esta configuración."
 RULE_OPTION_GREAT_COLLAPSE: "El gran colapso"
 RULE_OPTION_GREAT_COLLAPSE_AI_DESC: "Con la caída de la URSS en 1991, el militarismo desenfrenado de los Estados Unidos se convirtió poco a poco en una carga cada vez mayor para el contribuyente. Una serie de protestas a lo largo de 1995-99 dieron como resultado un número cada vez mayor de víctimas y resentimiento entre la población y el gobierno federal, que se encontraba estancado en la Guerra Fría. Ahora, a punto de alcanzar su punto álgido a principios de siglo, a los temores del Y2K se suman los rumores de una huelga nacional de ferrocarriles, una huelga que podría paralizar la economía y la capacidad federal para coordinar operaciones de contraprotesta."
 USB_AI_BEHAVIOR: "@USB Estados libres de América"
 RULE_OPTION_REVANCHIST_PATH: "Recuperando el destino"
 RULE_OPTION_REVANCHIST_PATH_AI_DESC: "Las influencias federales impulsarán a los Estados Libres a orientar su política exterior hacia el revanchismo hacia los 48 estados continentales.§RDebe tener la regla del juego de EE. UU. Publicar United o la regla del juego de EE. UU. Gran colapso§!"
 RULE_OPTION_ISOLATION_PATH: "El gran cierre"
 RULE_OPTION_ISOLATION_PATH_AI_DESC: "El sueño americano ha muerto, el mundo parece un vacío cada vez mayor. Por ello, la gente y los líderes políticos deciden que lo mejor es alejarse del mundo y disfrutar de la dulce paz y tranquilidad que, con suerte, les traerá su pequeño rincón.§RDebe tener la regla del juego de EE. UU. Publicar United o la regla del juego de EE. UU. Gran colapso§!"
 RULE_OPTION_ARCADIA_PATH: "La identidad oriental"
 RULE_OPTION_ARCADIA_PATH_AI_DESC: "Cuando el sueño americano se convirtió en pesadilla, la influencia federal flaqueó. Por ello, el pueblo decidió que era necesario adoptar un nuevo camino y, por lo tanto, buscó crear una nueva \"identidad oriental\" a través del Plan Arcadia. §RDebe tener la regla del juego de EE. UU. Publicar United o la regla del juego de EE. UU. Gran colapso§!"
 CSA_AI_BEHAVIOR: "@CSA República del Sur de América"
 RULE_OPTION_A_SOUTHERN_AMERICA_PATH: "Una América del Sur"
 RULE_OPTION_A_SOUTHERN_AMERICA_PATH_AI_DESC: "Mientras el sueño americano sigue ardiendo en los corazones de los pueblos del Sur, muchos influyen en las opiniones del gobierno para reformar las viejas glorias y emprender la creación de un nuevo Estados Unidos. Una América del Sur. §R debe tener la regla del juego de EE. UU. Publicar Unidos o la regla del juego de EE. UU. ¡Gran colapso§!"
 RULE_OPTION_GOLDEN_CIRCLE_PATH: "El círculo dorado"
 RULE_OPTION_GOLDEN_CIRCLE_PATH_AI_DESC: "Muchos sureños creen que deberían forjar un nuevo destino, uno que sea exclusivamente de naturaleza sureña. Como tal, muchos en el poder desean revisar una vieja idea de la Confederación como una forma de solidificar esta nueva era de libertad. §R debe tener la regla del juego de EE. UU. Publicar Unidos o la regla del juego de EE. UU. ¡Gran colapso§!"
 RULE_OPTION_SOUTHERN_ARCADIA_PATH: "La identidad oriental"
 RULE_OPTION_SOUTHERN_ARCADIA_PATH_AI_DESC: "Con el sueño americano agotándose y no muchos queriendo quedar demasiado atrapados en el \"estigma confederado\". Muchos sureños recurren a las influencias francesas de los pueblos cajón y criollo para forjar una nueva identidad. Uno que no es estadounidense ni confederado, pero que al fin y al cabo es nuestro. §R debe tener la regla del juego de EE. UU. Publicar Unidos o la regla del juego de EE. UU. ¡Gran colapso§!"
 RULE_OPTION_THE_FLORIDA_UPRISING_PATH: "El levantamiento de Florida"
 RULE_OPTION_THE_FLORIDA_UPRISING_PATH_AI_DESC: "En los primeros días de la gira por la joven nación, la escoria y los simpatizantes socialistas tomaron el poder y se robaron las elecciones. Ahora es el momento de que los verdaderos patriotas del sur defiendan lo que queda de nuestros hogares de estos demonios rojos. §R debe tener la regla del juego de EE. UU. Publicar Unidos o la regla del juego de EE. UU. ¡Gran colapso§!"
 CAS_AI_BEHAVIOR: "@CAS Cascadia"
 RULE_OPTION_ROCKY_MOUNTAIN_RESISTANCE_PATH: "Resistencia de las Montañas Rocosas"
 RULE_OPTION_ROCKY_MOUNTAIN_RESISTANCE_PATH_AI_DESC: "El gobierno de Olympia permitirá que las autoridades locales manejen los crecientes disturbios en el estado de Idaho, en las Montañas Rocosas. El fracaso de las fuerzas del orden locales para controlar el creciente movimiento de resistencia da como resultado un levantamiento independentista contra la nación de Cascadia. §R debe tener la regla del juego de EE. UU. Publicar Unidos o la regla del juego de EE. UU. ¡Gran colapso§!"
 RULE_OPTION_PEACE_IN_OUR_TIME_PATH: "Paz en nuestro tiempo"
 RULE_OPTION_PEACE_IN_OUR_TIME_PATH_AI_DESC: "El gobierno de Olimpia enviará una unidad de investigación especial para ayudar y liderar el movimiento de contrarresistencia. Con el tiempo, su ayuda restablecerá la ley y el orden y obligará al líder del RMR a disolver el grupo, lo que dará como resultado una nación más pacífica y unida. §R debe tener la regla del juego de EE. UU. Publicar Unidos o la regla del juego de EE. UU. ¡Gran colapso§!"
 LKT_AI_BEHAVIOR: "@LKT Republica de Lakota"
 RULE_OPTION_RECLAMATION_FRONT_WAR_PATH: "Reclamacion de frente de guerra"
 RULE_OPTION_RECLAMATION_FRONT_WAR_PATH_AI_DESC: "El gobierno del norte descartará y degradará la afluencia aleatoria de nativos bajo la organización del Frente de Reclamación. Como tal, un auditor demasiado entusiasta enviado por el gobierno de Lakota va solo a reunirse con los líderes de RF, lo que resulta en la creación de una rápida brecha, que conduce a una eventual militarización y guerra entre Kansas, controlada por RF, y la República de Lakota. §R Debe Tener la Regla del Juego de EE.UU. Publicar unidos o la Regla del Juego de EE.UU. Gran Colapso§!"
 RULE_OPTION_RECLAMATION_FRONT_PEACE_PATH: "Reclamar frete de paz"
 RULE_OPTION_RECLAMATION_FRONT_PEACE_PATH_AI_DESC: "Al comprender la confusión de los informes, se harían más investigaciones, lo que resultaría en la rápida refutación de algunas de las afirmaciones más agresivas sobre la organización RF. Con esta nueva unidad encontrada, las conversaciones comenzarían a trabajar en la reconstrucción de la nación y trabajar juntos para formar una mejor unión económica y social en general. §R debe tener la regla del juego de EE. UU. Publicar Unidos o la regla del juego de EE. UU. ¡Gran colapso§!"
 RUS_AI_BEHAVIOR: "@SOV Federación Rusa"
 RULE_OPTION_PUTIN_AI_DESC: "La Federación Rusa buscará promover la política exterior de Rusia Unida y fortalecerla.\n"
 RULE_OPTION_PEACEFUL_REFORM_AI_DESC: "Russia will seek to make liberal reforms and pursue greater ties with the West.\n"
 RULE_OPTION_THE_RED_MENACE_AI_DESC: "Rusia comenzará a derivar hacia políticas marxistas e intentará restaurar la Unión Soviética.\n"
 RULE_OPTION_RISE_OF_RUSSIA_AI_DESC: "Russia will start to drift towards nationalist policies, and will seek to pursue an aggressive foreign policy with the aims of proclaiming Greater Russia.\n"
 RULE_OPTION_NAZBOL_RUSSIA_AI_DESC: "The National Bolsheviks are able to realize a different way for the development of their homeland. They will establish a new order in Russia in hopes of returning stability and greatness.\n"
 RULE_OPTION_IRON_DIMON_RUSSIA_AI_DESC: "Rusia necesita un nuevo gobernante que no se dé por vencido y negocie eternamente con aquellos que traicionarán nuestra gran patria en cualquier momento.\n"
 RULE_OPTION_LIBERAL_DIMON_RUSSIA_AI_DESC: "Dmitri Anatolievich finalmente emprenderá el camino liberal y conducirá a Rusia hacia el liberalismo.\n"
 RULE_OPTION_OLIGARCHS_RUSSIA_AI_DESC: "Oligarchs, already empowered heavily within Russia, will attempt to seize even more control for themselves.\n"
 CZE_AI_BEHAVIOR_MD: "@CZE Republica Checa"
 GAME_RULE_nato_disabled: "§YLA OTAN§! Está deshabilitada mediante una regla del juego"
 RULE_OPTION_HISTORICAL_PRESIDENTS: "Presidentes históricos de los Estados Unidos"
 RULE_OPTION_HISTORICAL_PRESIDENTS_AI_DESC: "La IA elegirá presidentes el 20 de enero de cada año electoral basándose en el vencedor histórico."
 RULE_GOD_OF_WAR: "Mod de Dios de la Guerra"
 RULE_GOD_OF_WAR_NO: "Desactivado"
 RULE_GOD_OF_WAR_YES: "Activado"
 RULE_GOD_OF_WAR_NO_DESC: "La IA utilizará la configuración predeterminada"
 RULE_GOD_OF_WAR_YES_DESC: "La IA utilizará plantillas avanzadas y algunos trucos."
 ROM_HISTORICAL: "Histórico"
 ROM_HISTORICAL_DESC: "Rumania seguirá su camino histórico de coexistencia pacífica y sus aspiraciones de unirse a la Unión Europea."
 RULE_OPTION_ROM_FASCIST: "Rumania radical"
 RULE_OPTION_ROM_FASCIST_DESC: "En Rumania llegarán al poder elementos radicales que podrían provocar inestabilidad en la región."
 RULE_OPTION_ROM_DEMOCRATIC: "El camino de la democracia"
 RULE_OPTION_ROM_DEMOCRATIC_DESC: "Rumania se adherirá a los valores democráticos y uno de los partidos democráticos obtendrá el poder en el país."
 RULE_OPTION_ROM_CENTER: "El centrismo en Rumania"
 RULE_OPTION_ROM_CENTER_DESC: "Rumania seguirá el camino del centrismo en su dirección política."
 POL_PHALANGA: "Falange"
 POL_PHALANGA_DESC: "Polonia elegirá el camino del movimiento nacionalista Falanga."
 RULE_OPTION_ALL_AHEAD_SLOW: "Todo adelante, lento"
 RULE_OPTION_ALL_AHEAD_SLOW_AI_DESC: "Habilite esta regla de juego para garantizar que la IA no implosione a los EE. UU. Esencialmente, elimina el factor RNG del modo de IA no histórico."
 RULE_OPTION_SECOND_COAL_WARS: "Las segundas guerras del carbón"
 RULE_OPTION_SECOND_COAL_WARS_AI_DESC: "Los Estados Libres declararán a la renovada organización UMWA que las minas de Virginia Occidental no se reabrirán basándose en los principios que las motivaron inicialmente, afirmando: «Las soluciones y los problemas modernos fueron la razón de su cierre inicial». Como resultado, los mineros comenzarán a amotinarse y declararán la independencia del estado, lo que conducirá al incidente de la Segunda Guerra del Carbón.§RDebe tener la regla del juego de EE. UU. Publicar United o la regla del juego de EE. UU. Gran colapso§!"
 NEN_AI_BEHAVIOR: "@NEN Nueva Inglaterra"
 RULE_OPTION_GREEN_MOUNTAIN_REBELLION: "Rebelión de la Montaña Verde"
 RULE_OPTION_GREEN_MOUNTAIN_REBELLION_AI_DESC: "Sin ceder a la mezquina presión política de unas pocas voces fuertes, el gobierno nacional de Nueva Inglaterra rechazará las demandas de Vermont de trasladar la sede del gobierno a Montpelier. Como resultado, la animosidad seguirá creciendo hasta que nos veamos obligados a sofocar la rebelión advenediza en el estado.§R Debe tener la regla del juego de EE. UU. Post Unidos o la regla del juego de EE. UU. Gran colapso§!"
 RULE_OPTION_THE_OTHER_NEW_CAPITAL: "La otra nueva capital"
 RULE_OPTION_THE_OTHER_NEW_CAPITAL_AI_DESC: "Al ver que a muy pocos les importaba genuinamente dónde estaría la nueva capital, el gobierno de Nueva Inglaterra acepta las \"demandas\" de los vermonteses y traslada la capital a Monteplier.§R Debe tener la regla del juego de EE. UU. Post Unidos o la regla del juego de EE. UU. Gran colapso§!"
 RULE_ALLOW_CONDITIONAL_PEACE_DEAL: "Permitir acuerdos de paz condicionales"
 RULE_OPTION_CONDITIONAL_PEACE_DEAL_YES_DESC: "Permitirá a los estados en guerra utilizar los §YAcuerdos de Paz Condicionales§!, una acción diplomática predefinida que permitirá a los estados firmar acuerdos de paz que no requieran que ninguna de las partes capitule completamente."
 RULE_OPTION_CONDITIONAL_PEACE_DEAL_NO_DESC: "Prohíbe a los estados utilizar los §YAcuerdos de Paz Condicionales§!, acciones diplomáticas preconcebidas que obligarán a los estados a soportar una guerra total para alcanzar un estado de paz."
 RULE_PEACE_PROPOSAL_BLOCKED_TT: "Mientras que §YAcuerdos de Paz Condicionales§! estén habilitados esto se bloqueará, en cambio, use §Y$CPD_OFFER_CONDITIONAL_PEACE_TITLE$§!"
 RULE_ALLOW_WORLD_WAR: "La Segunda Guerra Mundial Ferroviaria"
 RULE_ALLOW_ENABLE_WORLD_WAR: "Habilitar la guerra mundial ferroviaria"
 RULE_ALLOW_ENABLE_WORLD_WAR_YES_DESC: "Esta opción restringirá los elementos sandbox de Millennium Dawn y empujará al mundo a una Guerra Mundial en un año determinado, de manera similar a otros mods.\n\nSe recomienda encarecidamente que juegues en modo histórico y desactives la opción 'Guerras de deuda de IA'"
 RULE_ALLOW_ENABLE_WORLD_WAR_NO: "Desactivar la Guerra Mundial por Ferrocarril"
 RULE_ALLOW_ENABLE_WORLD_WAR_NO_DESC: "Millennium Dawn permanecerá en su forma convencional, un mod sandbox."
 RULE_ENABLE_INVESTMENT_COLLAPSE_LOCK: "Habilitar el bloqueo de quiebra de inversiones"
 RULE_ENABLE_INVESTMENT_COLLAPSE_LOCK_NO_DESC: "Puedes enviar inversiones a países mientras tengas activa la misión “Bankruptcy Incoming”"
 RULE_ENABLE_INVESTMENT_COLLAPSE_LOCK_YES_DESC: "Ya no puedes enviar inversiones a países mientras tengas activa la misión \"Quiebra Entrante\""
 RULE_SYRIA_ARAB_SPRING_CHOICE_DEFAULT_DESC: "Siria evaluará la opción de la Primavera Árabe con normalidad."
 RULE_SYRIA_ARAB_SPRING_CHOICE_HISTORICAL_CIVIL_WAR_DESC: "Siria se asegurará de tomar sus propias decisiones si la Primavera Árabe surge y fuerza una guerra civil histórica."
 RULE_SYRIA_ARAB_SPRING_CHOICE_HISTORICAL_ISIS_SPAWN_DESC: "Siria siempre tomará las decisiones durante la Primavera Árabe para garantizar el surgimiento del Estado Islámico (ISIS). Esto también garantiza el estallido de una guerra civil histórica."
 RULE_SYRIA_ARAB_SPRING_CHOICE: "La elección del comportamiento de Siria durante la Primavera Árabe"
 RULE_HISTORIC_EVENTS: "Desencadenantes de eventos históricos"
 RULE_HISTORIC_EVENTS_NO: "Los eventos históricos se activarán aleatoriamente. Esta es la configuración normal del juego."
 RULE_HISTORIC_EVENTS_YES: "Los eventos históricos no se activarán aleatoriamente. La mayoría de los eventos seguirán activándose aleatoriamente; sin embargo, se garantizará que algunos se activen dentro del mes de su fecha histórica para reducir la posibilidad de retrasos significativos. Esto no significa que tendrás un juego perfectamente histórico. Simplemente ayuda a encaminarlo hacia una dirección histórica."
 RULE_ALLOW_MD_ANNEX: "Habilitar la limpieza de Border Gore"
 RULE_OPTION_MD_ANNEX_NO_DESC: "No habrá ningún efecto sobre las fronteras posteriores a la paz, y permanecerán tal como fueron definidas en la conferencia."
 RULE_OPTION_MD_ANNEX_YES_DESC: "After a peace deal, if multiple instances of the same tag exist, all remaining tags will be integrated into the one with the most powerful overlord. The overlords strength will be determined by their power rank national spirit. Clean-up after a war may take up to 14 days to take place."
 RULE_DISABLE_CSTO: "Desactivar CSTO"
 RULE_YES_DISABLE_CSTO_DESC: "CSTO se desactivará al cargar el juego."
 RULE_NO_DISABLE_CSTO_DESC: "La OTSC seguirá siendo una facción."
 RULE_DISABLE_MUSLIM_BROTHERHOOD_CIVIL_WAR: "Desactivar la Guerra Civil de la Hermandad Musulmana"
 RULE_YES_DISABLE_MUSLIM_BROTHERHOOD_CIVIL_WAR_DESC: "La guerra civil de los Hermanos Musulmanes será desactivada."
 RULE_NO_DISABLE_MUSLIM_BROTHERHOOD_CIVIL_WAR_DESC: "Se permitirá la guerra civil de la Hermandad Musulmana."
 RULE_SYRIA_ARAB_SPRING_CHOICE_HISTORICAL_CIVIL_WAR: "Guerra civil histórica de Siria"
 RULE_SYRIA_ARAB_SPRING_CHOICE_HISTORICAL_ISIS_SPAWN: "Engendro de ISIS"
 RULE_OPTION_SWE_PRO_WESTERN: "Irse para el otro lado"
 RULE_OPTION_SWE_PRO_WESTERN_AI_DESC: "Sweden will draw closer to NATO and the EU."
 RULE_OPTION_SWE_RED_SWEDEN: "República Sueca"
 RULE_OPTION_SWE_RED_SWEDEN_AI_DESC: "The Swedish far-left will take power and abolish the monarchy."
 RULE_DISABLE_AI_INFLUENCE_PUPPETING: "Desactivar el uso de marionetas de influencia de IA"
 RULE_YES_DISABLE_AI_INFLUENCE_PUPPETING_DESC: "La IA no podrá controlar a otras naciones a través del sistema de influencia."
 RULE_NO_DISABLE_AI_INFLUENCE_PUPPETING_DESC: "La IA podrá controlar a otras naciones a través del sistema de influencia."
 RULE_ALLOW_MP_ENHANCEMENTS: "Mejoras de MP"
 RULE_NOT_ALLOW_MP_ENHANCEMENTS_DESC: "Will not allow the MP mechanics to speed up the game. Not recommended for Singleplayer."
 RULE_ALLOW_MP_ENHANCEMENTS_DESC: "Allow the MP mechanics to speed up the game. Also lets every country create factions, bypassing the Power Ranking requirement."
 RULE_DISABLE_WESTERN_OUTLOOK_FEATURES: "Desactivar las funciones de influencia agresiva para la perspectiva occidental"
 RULE_YES_DISABLE_WESTERN_OUTLOOK_FEATURES: "Desactiva funciones occidentales agresivas como golpe de influencia o títere de influencia."
 RULE_INTERNAL_FACTION_COST_REDUCTION: "Reducción de costos de facción interna"
 RULE_DISABLE_INTERNAL_FACTION_COST_REDUCTION_DESC: "Los costos para cambiar de facciones internas serán los costos predeterminados."
 RULE_ENABLE_INTERNAL_FACTION_COST_REDUCTION_DESC: "Se reducirán los costos para cambiar de facciones internas, lo que permitirá a todas las naciones (a menos que tengan contenido expreso que lo impida).§RSi te encuentras con focos rotos o lo que sea, es tu problema.§!"
 RULE_OPTION_EU_ONE: "1 día"
 RULE_OPTION_EU_ONE_DESC: "§RPara fines de prueba.§! El período de espera para las votaciones del Parlamento Europeo y del Consejo Europeo se establecerá en un día en lugar de los ciento ochenta días predeterminados."
 RULE_ALLOW_FORCING_A_WHITE_PEACE: "Permitir imponer la paz"
 RULE_YES_FORCING_A_WHITE_PEACE: "Le permite imponer una paz blanca en una nación que está en una guerra ofensiva."
 RULE_NO_FORCING_A_WHITE_PEACE: "No permite imponer una paz blanca en una nación que está en una guerra ofensiva."
 RULE_OPTION_IF_POINT_00: "0.00 Opinión Mensual"
 RULE_OPTION_IF_POINT_00_DESC: "La tasa de ticks mensuales de la opinión de la §YFacción interna§! se establecerá en 0,00 en lugar del valor predeterminado de 0,50. Los logros personalizados de Millennium Dawn se desactivarán con esta configuración."
 RULE_ENABLE_ENERGY_LOAD_SHARING: "Habilitar el uso Compartido de la Carga de Energía"
 RULE_ENABLE_ENERGY_LOAD_SHARING_DESC: "Permite que el Sistema de Reparto de Carga Energética compre y venda energía de naciones cercanas cuando existe un déficit energético."
 RULE_DISABLE_ENERGY_LOAD_SHARING_DESC: "Desactiva el Sistema de Reparto de Carga de Energía para comprar y vender energía de naciones cercanas cuando hay un déficit energético."
