 TAI_pc_industry_events.2.t: "VIA Challenges the Pentium 4"
 TAI_pc_industry_events.2.d: "VIA has introduced a Pentium 4 chipset without Intel's approval, promising cheaper and more flexible platforms while inviting an immediate legal confrontation. Taiwan can support an independent challenge, seek an early settlement, or retreat toward safer chipset niches."
 TAI_pc_industry_events.2.a: "Back VIA's x86 confrontation"
