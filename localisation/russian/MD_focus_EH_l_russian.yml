 EH_electric_trap_removing_flag: "Ловушка в этом регионе демонтируется"
 EH_electric_trap_active_flag: "Ловушка в этом регионе сейчас активна"
 EH_electric_trap_energy_use_TT: "§YЭта ловушка будет потреблять §R100 МВт§! энергии во время работы.§!"
