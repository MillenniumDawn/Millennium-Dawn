 sp_dutch_super_bus_project_daf_desc: "DAF, известный голландский автопроизводитель, предложил свою экспертизу для содействия в разработке Superbus. Принятие их помощи даст ценные технические знания, но несколько замедлит наш собственный прогресс в исследованиях."
