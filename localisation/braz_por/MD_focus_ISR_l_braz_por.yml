 israel_economy.213.t: "Gasoduto Israel-Turquia!"
 israel_economy.213.d: "O gasoduto Israel-Turquia está sendo finalizado e finalmente construído. Ambas as nações se beneficiarão enormemente! Todas as despesas serão cobertas por Israel."
