 CUB_alba_category_desc: "\n\n\n\n\n\n£CUB_desctext_alba\n\n\n\n\n\n\n\n\nALBA는 라틴아메리카와 카리브해 국가들의 정치적·경제적 통합이라는 구상에 기반한 정부 간 기구입니다. 쿠바는 이 동맹의 지도국 중 하나이자 동맹 프로젝트의 주요 발기국입니다. 우리와 우리 경제가 회복하는 데 도움이 될 여러 중요한 프로젝트를 추진해야 합니다\n§G[?CUB.alba_completed]§!개의 §YALBA 프로젝트§!를 완료했습니다"
 CUB_blockade_fight_category: "봉쇄에 맞선 투쟁"
 CUB_blockade_fight_category_desc: "\n\n\n\n\n\n£CUB_desctext_blockade\n\n\n\n\n\n\n\n\n[USA.GetFlag]미국의 [CUB.GetFlag]쿠바 금수 조치는 [USA.GetFlag]미국 기업은 물론 §8미국 법§!에 따라 설립되었거나 §5미국 시민이 과반 지분을 소유한§! 기업이 §t쿠바 측§!과 거래하는 것을 금지합니다. 이는 현대사에서 가장 오래 지속된 무역 금수 조치입니다.\n\n[blockade_USA_loc]\n[blockade_CAN_loc]\n[blockade_DOM_loc]\n[blockade_HAI_loc]\n[blockade_MEX_loc]"
 CUB.blockade: "§Y쿠바 봉쇄 지지§!"
