 alg_promote_arabization_desc: "Укрепить национальное единство через арабскую идентичность. Это стабилизирует страну, но разозлит кабилов и мозабитов."
 alg_recognize_tamazight: "Признать язык тамазигхт"
 alg_recognize_tamazight_desc: "Придать тамазигхту официальный статус: кабилы будут довольны, арабские националисты — разгневаны."
 alg_ethnicity.100.t: "Протесты кабилов"
 alg_ethnicity.100.d: "Накопившееся раздражение в Кабилии вылилось в протесты с требованиями культурных прав и автономии. Правительству предстоит решить: подавлять или уступать."
 alg_ethnicity.100.a: "Подавить протесты"
 alg_ethnicity.100.b: "Пойти на уступки"
 alg_ethnicity.200.t: "Кризис в Кабилии"
 alg_ethnicity.200.d: "Волнения кабилов достигли предела. Движение за самоопределение Кабилии открыто требует независимости, жандармерия потеряла контроль над Тизи-Узу, а сельские комитеты «аруш» отвергают любые предложения властей. Алжир должен ответить, пока регион не ушёл окончательно."
 alg_ethnicity.200.a: "Дать им желаемое"
 alg_ethnicity.200.b: "Пойти на риск гражданской войны"
 alg_ethnicity.200.c: "Признать тамазигхт и провести реформы"
 alg_appease_kabyles: "Умиротворить кабильское население"
 alg_appease_kabyles_desc: "Растущие волнения в Кабилии угрожают стабильности страны. Уступки — признание культуры, экономические вложения или ограниченная автономия — могут снять напряжение, но рискуют подтолкнуть другие регионы к таким же требованиям."
 alg_ethnic_policy: "Национальная политика"
 alg_ethnic_policy_desc: "\n£MAIN_arab_kabyle\n\n\n\nАлжир — многонациональная страна с крупными этническими группами: арабы, кабилы, туареги, мозабиты и шауйя. Политика правительства должна уравновешивать их требования: решения принесут выгоду, но, задев любую из групп, рискуешь получить волнения и даже отделение."
 ALG_sahara_poaching: "Браконьерство в Сахаре"
 ALG_sahara_poaching_desc: "Браконьерство — серьёзная беда для алжирской Сахары и степей. Газелей, дроф и гривистых баранов бьют незаконно, а маршруты сбыта выводят на международные рынки. Вместе с перевыпасом и чрезмерным расходом воды браконьерство ускоряет опустынивание и потерю биоразнообразия.\n\nВероятность §Yопустынивания§!: §R[?sahara_expands]%§!\nВероятность §Yстабилизации§!: [?sahara_steady]%\nВероятность §Yоазисообразования§!: §G[?sahara_retreats]%§!\n\nКаждый месяц есть\n§Y[?chance_to_not_kill_poachers]%§! вероятность, что к промыслу приступят §Y15 новых браконьеров§!.\n§Y[?chance_to_kill_poachers]%§! вероятность, что наши силы безопасности уничтожат §Y[?no_of_poachers_to_kill] браконьеров§!\n\nБольшие §Yрасходы на внутреннюю безопасность§! и адресные меры против браконьерства повышают наши шансы.\n\nОценка числа действующих браконьеров: [?no_of_poachers] ([ALG_threat_level_of_poachers])"
 ALG_bi_yearly_poaching_report: "Годовой отчёт о браконьерстве"
 ALG_bi_yearly_poaching_report_desc: "Каждые 12 месяцев оценивается ущерб от браконьерства. §GНизкая угроза§! снижает риск опустынивания, §RВысокая угроза§! — повышает."
 ALG_anti_poaching_extra_security: "Нанять дополнительных егерей"
 ALG_anti_poaching_extra_security_desc: "Набрать больше егерей и патрулей для борьбы с браконьерством в Сахаре и степях."
 ALG_anti_poaching_extra_security_tt: "§GШанс ликвидировать браконьеров повышается на 10%§!"
 ALG_anti_poaching_heavy_weapons: "Оснастить подразделения по борьбе с браконьерством"
 ALG_anti_poaching_heavy_weapons_desc: "Машины, беспилотники и тяжёлое вооружение повышают эффективность патрулей против вооружённых браконьерских групп."
 ALG_anti_poaching_heavy_weapons_tt: "§GЧисло ликвидируемых браконьеров увеличивается на 5§!"
 ALG_anti_poaching_awareness: "Кампания в защиту дикой природы"
 ALG_anti_poaching_awareness_desc: "Провести общественную кампанию, чтобы привлечь внимание к защите исчезающих видов от браконьеров."
 ALG_threat_level_of_poachers_low: "§GНизкая угроза§!"
 ALG_threat_level_of_poachers_medium: "§YСредняя угроза§!"
 ALG_threat_level_of_poachers_high: "§RВысокая угроза§!"
 ALG_eliminate_half_of_poachers: "§GСократить число браконьеров на §Y[?poachers_killed]§!§!"
 ALG_anti_poaching_decisions: "Браконьерство в Сахаре"
 ALG_anti_poaching_decisions_desc: "Браконьерство в алжирской Сахаре остаётся постоянной проблемой. Исчезающие виды — аддакс, газели, сахарские гепарды — становятся добычей ради торговли или забавы, а контрабандные маршруты нередко связывают этот промысел с криминальными и террористическими сетями Сахеля. Часть браконьеров приходит из соседних Мали, Нигера и Ливии, но участвуют и местные группы. Алжирские власти заняли жёсткую позицию в отношении §Yбраконьеров§!, и столкновения с силами безопасности не редкость.\n\nБраконьерство вместе с перевыпасом, изменением климата и хищническим землепользованием подпитывает наступление Сахары. Борьба с браконьерством и защита хрупких экосистем — важный шаг к сохранению и биоразнообразия, и источников существования людей.\n\nВероятность §Yопустынивания§!: §R[?sahara_expands]%§!\nВероятность §Yстабилизации§!: [?sahara_steady]%\nВероятность §Yоазисообразования§!: §G[?sahara_retreats]%§!\n\nКаждый месяц есть\n§Y[?chance_to_not_kill_poachers]%§! вероятность, что к промыслу приступят §Y15 новых браконьеров§!.\n§Y[?chance_to_kill_poachers]%§! вероятность, что наши силы безопасности уничтожат §Y[?no_of_poachers_to_kill] браконьеров§!\n\nПовысить шансы на уничтожение браконьеров можно, увеличив расходы на §Yвнутреннюю безопасность§! либо снарядив и подготовив войска для действий в пустыне.\n\nТекущая оценка численности браконьеров: [?no_of_poachers] ([ALG_threat_level_of_poachers])"
 ALG_anti_poaching_dehorn_camels: "Кампания по мечению верблюдов"
 ALG_anti_poaching_dehorn_camels_desc: "Мечение верблюжьих стад по всей Сахаре и внимательное наблюдение за ними могут отпугнуть браконьеров и контрабандистов. Верблюды не относятся к исчезающим видам, но их часто угоняют для контрабандных маршрутов и незаконной торговли. Бирки с опознавательными номерами, общинный присмотр и взаимодействие с патрулями затруднят браконьерам наживу на краже и перепродаже верблюдов."
 ALG_anti_poaching_dehorn_camels_tt: "§GУспешная кампания вдвое сократит число браконьеров§!"
 ALG_total_ban_on_poaching: "Полный запрет браконьерства"
 ALG_total_ban_on_poaching_desc: "Браконьерство угрожает исчезающим видам — аддаксу, газели, сахарскому гепарду. Охотничьи обычаи ещё живы, но ради сохранения природного наследия мы должны действовать решительно и ввести полный запрет на охоту в заповедниках и хрупких экосистемах."
 alg_appease_kabyles_tt: "Увеличить финансирование районов с кабильским большинством, культурных программ и местного самоуправления. Арабские националисты будут недовольны."
 alg_arabization_tt: "Продвигать арабский язык и араб-исламскую идентичность в образовании и общественной жизни. Берберские общины будут сопротивляться."
 alg_ethnic.10.t: "Признание тамазигхта приносит плоды"
 alg_ethnic.10.d: "Через три месяца после признания тамазигхта берберские общины сообщают об улучшении отношений с государством. Одобрение в обществе растёт."
 alg_ethnic.10.a: "Новая глава в истории Алжира."
 ALG_ethnic_data.1.t: "Этнический состав Алжира"
 ALG_ethnic_data.1.d: "Анализ этнического состава Алжира после Чёрной весны завершён. Кризис обнажил глубокие разломы в обществе:\n\n§YАрабы§!: [?ALG_ethnic_arab]%, удовлетворённость: [?ALG_arab_satisfaction]/100\nБольшинство населения. Их первенство ставят под вопрос.\n\n§Yⵣ Кабилы§!: [?ALG_ethnic_kabyle]%, удовлетворённость: [?ALG_kabyle_satisfaction]/100\n§RЧёрная весна многих радикализовала. Напряжение критическое.§!\n\n§YШауйя§!: [?ALG_ethnic_chaoui]%, удовлетворённость: [?ALG_chaoui_satisfaction]/100\nВнимательно следят за событиями в Кабилии.\n\n§Y⵿ Туареги§!: [?ALG_ethnic_tuareg]%, удовлетворённость: [?ALG_tuareg_satisfaction]/100\nСахарские общины чувствуют себя забытыми Алжиром.\n\n§Yⵎ Мозабиты§!: [?ALG_ethnic_mozabite]%, удовлетворённость: [?ALG_mozabite_satisfaction]/100\nХранят свои общины ибадитов.\n\n§YПрочие§!: [?ALG_ethnic_other]%\n\n§YСистема управления межнациональными отношениями запущена.§!"
 ALG_ethnic_data.1.a: "Нужно действовать осмотрительно."
 ALG_ethnic_system_active_tt: "§GСистема управления межнациональными отношениями запущена!§!\n\nСледите за удовлетворённостью на панели решений.\nИспользуйте меры, чтобы группы оставались довольны.\nЗабытые группы создадут проблемы!"
 ALG_ethnic_data_category: "[ALG.GetFlag]§YЭтнический состав§!"
 ALG_ethnic_data_category_desc: "§YЭтническая мозаика Алжира§! — это сложное переплетение народов, из которых состоит наша страна. После разрушительной §RГражданской войны (1991-2002)§! управление межнациональными отношениями стало залогом устойчивости государства. Политика национального примирения президента [ALG.GetLeader] должна ответить на обиды всех общин.\n\nОсобенно неспокойно §Yкабильское население§!: если его тревоги не услышать, на горизонте маячит §RЧёрная весна 2001 года§!. Тем временем общины §Yтуарегов§! на юге с интересом следят за событиями в соседних Мали и Нигере.\n\n§H КАК ЭТО РАБОТАЕТ §!\n\nУ каждой этнической группы есть §Yуровень удовлетворённости§! (0-100):\n§G- Выше 70§!: группа §GДОВОЛЬНА§! -> даёт бонусы стране\n§Y- 40-70§!: группа §YНЕЙТРАЛЬНА§! -> без особых эффектов\n§R- Ниже 40§!: группа §RНЕДОВОЛЬНА§! -> накладывает штрафы\n§R- Ниже 25§!: §RОПАСНОСТЬ§! -> тяжёлые штрафы, возможен мятеж\n\n§YУдовлетворённость ежемесячно падает§! у тех, кем пренебрегают. Угождая одной группе, часто злишь другие!\n\n§H ТЕКУЩЕЕ СОСТОЯНИЕ §!\n\n§YАРАБЫ§! - [?ALG_ethnic_arab]% населения\n Удовлетворённость: [?ALG_arab_satisfaction]/100\n §YКогда довольны:§! §G+политическая власть, +стабильность, +людские резервы§!\n\n§YКАБИЛЫ§! - [?ALG_ethnic_kabyle]% населения\n Удовлетворённость: [?ALG_kabyle_satisfaction]/100\n §YКогда довольны:§! §G+скорость исследований§!\n §RВнимание: при низкой удовлетворённости может начаться Чёрная весна!§!\n\n§YШАУЙЯ§! - [?ALG_ethnic_chaoui]% населения\n Удовлетворённость: [?ALG_chaoui_satisfaction]/100\n §YКогда довольны:§! §G+скорость строительства, +ресурсы§!\n\n§YТУАРЕГИ§! - [?ALG_ethnic_tuareg]% населения\n Удовлетворённость: [?ALG_tuareg_satisfaction]/100\n §YКогда довольны:§! §G+организация армии, +бой в пустыне§!\n\n§YМОЗАБИТЫ§! - [?ALG_ethnic_mozabite]% населения\n Удовлетворённость: [?ALG_mozabite_satisfaction]/100\n §YКогда довольны:§! §G-товары народного потребления, +торговля§!\n\n§YПРОЧИЕ§! - [?ALG_ethnic_other]% населения"
 ALG_census_tt: "Провести всеобщую перепись населения, чтобы обновить демографические данные и опереться на них в политике."
 ALG_ethnic_data.2.t: "Итоги переписи и национальная идентичность"
 ALG_ethnic_data.2.d: "Перепись показала этническое разнообразие Алжира. Как нам ответить политически?"
 ALG_ethnic_data.2.a: "Укрепить араб-исламскую идентичность."
 ALG_ethnic_data.2.b: "В равной мере чтить и берберское, и арабское наследие."
 ALG_ethnic_data.2.c: "Воздержаться от позиции."
 ALG_ethnic_data.20.t: "Столкновения в Гардае"
 ALG_ethnic_data.20.d: "§R2013 год — ДОЛИНА МЗАБ§!\n\nВ долине Мзаб, вокруг исторического города Гардая, вспыхнули столкновения между арабской и мозабитской общинами. Началось всё со спора о кладбище, а обернулось погромами.\n\nЛавки и дома мозабитов громят и жгут. С обеих сторон есть убитые. Мозабиты, потомки древней династии Рустамидов, чувствуют угрозу самому своему существованию.\n\nСилы безопасности с трудом удерживают положение. Как мы ответим?"
 ALG_ethnic_data.20.a: "У арабов есть законные основания для обид. Встать на их сторону."
 ALG_ethnic_data.20.b: "Защитить мозабитское меньшинство. Ввести войска в их районы."
 ALG_ethnic_data.20.c: "Попробовать беспристрастно примирить обе общины."
 ALG_ghardaia_arab_side_tt: "Мы встаём на сторону арабской общины.\n§RУдовлетворённость мозабитов -20§!\n§GУдовлетворённость арабов +5§!"
 ALG_ghardaia_mozabite_side_tt: "Мы вводим войска для защиты мозабитов.\n§RУдовлетворённость мозабитов -5§! (признательны, но потрясены)\n§RУдовлетворённость арабов -10§!"
 ALG_ghardaia_neutral_tt: "Мы пытаемся быть посредниками.\n§RУдовлетворённость мозабитов -10§!\n§RУдовлетворённость арабов -3§!\nНи одна из сторон не удовлетворена до конца."
 ALG_ethnic_data.10.t: "Межнациональное напряжение растёт"
 ALG_ethnic_data.10.d: "По сообщениям, среди недовольных этнических общин нарастает брожение. Местные чиновники предупреждают, что готовятся протесты, а некоторые опасаются и более радикальных шагов, если жалобы останутся без ответа.\n\n§RГруппы в кризисе:§!"
 ALG_ethnic_data.10.a: "Мы не можем откликнуться на каждую жалобу."
 ALG_ethnic_data.10.b: "Направить чиновников, чтобы разобраться с их бедами."
 ALG_show_ethnic_data: "§YОбзор этнических групп§!"
 ALG_show_ethnic_data_desc: "Посмотреть текущее положение всех этнических групп Алжира."
 ALG_ethnic_overview_full_tt: "§HОБЗОР ЭТНИЧЕСКИХ ГРУПП§!\n\n§YАРАБЫ§! | доля: §G[?ALG_ethnic_arab]%§! | удовлетворённость: §B[?ALG_arab_satisfaction]§!/100\n§Yⵣ КАБИЛЫ§! | доля: §G[?ALG_ethnic_kabyle]%§! | удовлетворённость: §B[?ALG_kabyle_satisfaction]§!/100\n§YШАУЙЯ§! | доля: §G[?ALG_ethnic_chaoui]%§! | удовлетворённость: §B[?ALG_chaoui_satisfaction]§!/100\n§Y⵿ ТУАРЕГИ§! | доля: §G[?ALG_ethnic_tuareg]%§! | удовлетворённость: §B[?ALG_tuareg_satisfaction]§!/100\n§Yⵎ МОЗАБИТЫ§! | доля: §G[?ALG_ethnic_mozabite]%§! | удовлетворённость: §B[?ALG_mozabite_satisfaction]§!/100\n§YПРОЧИЕ§! | доля: §G[?ALG_ethnic_other]%§!\n\n§YПомните:§! без постоянной поддержки удовлетворённость групп падает!"
 ALG_favor_arab_policies: "Проарабская политика"
 ALG_favor_arab_policies_desc: "Продвигать арабский язык и араб-исламскую культурную идентичность, отдавать приоритет арабским районам в развитии.\n\n§GЭффекты:§!\n• Удовлетворённость арабов §G+10§!\n• Удовлетворённость кабилов §R-5§!\n• Удовлетворённость шауйя §R-3§!\n• Удовлетворённость туарегов §R-3§!\n• Удовлетворённость мозабитов §R-3§!\n\n§YПерезарядка:§! 60 дней"
 ALG_favor_arab_tt: "§GАрабы довольны нашей поддержкой!§!\n§RМеньшинства чувствуют себя на обочине.§!"
 ALG_favor_kabyle_policies: "Политика в пользу кабилов"
 ALG_favor_kabyle_policies_desc: "Поддержать преподавание на тамазигхте, сохранение кабильской культуры и развитие Кабилии.\n\n§GЭффекты:§!\n• Удовлетворённость кабилов §G+10§!\n• Удовлетворённость арабов §R-5§!\n• Удовлетворённость шауйя §R-2§!\n\n§YПерезарядка:§! 60 дней"
 ALG_favor_kabyle_tt: "§GКабилы радуются признанию своего наследия!§!\n§RАрабы чувствуют угрозу своему первенству.§!"
 ALG_favor_chaoui_policies: "Политика в пользу шауйя"
 ALG_favor_chaoui_policies_desc: "Вкладываться в развитие массива Орес и поддерживать культурные начинания шауйя.\n\n§GЭффекты:§!\n• Удовлетворённость шауйя §G+10§!\n• Удовлетворённость арабов §R-3§!\n• Удовлетворённость кабилов §R-2§!\n\n§YПерезарядка:§! 60 дней"
 ALG_favor_chaoui_tt: "§GШауйя ценят развитие своего края!§!"
 ALG_favor_tuareg_policies: "Политика в пользу туарегов"
 ALG_favor_tuareg_policies_desc: "Поддержать автономию туарегов в Сахаре, вкладываться в развитие юга и вовлекать туарегские общины в жизнь страны.\n\n§GЭффекты:§!\n• Удовлетворённость туарегов §G+10§!\n• Удовлетворённость арабов §R-3§!\n\n§YПерезарядка:§! 60 дней"
 ALG_favor_tuareg_tt: "§GСиние люди пустыни ценят наше внимание!§!"
 ALG_favor_mozabite_policies: "Политика в пользу мозабитов"
 ALG_favor_mozabite_policies_desc: "Защищать ибадитские обряды, поддерживать мозабитские торговые общины и развивать долину Мзаб.\n\n§GЭффекты:§!\n• Удовлетворённость мозабитов §G+10§!\n• Удовлетворённость арабов §R-2§!\n\n§YПерезарядка:§! 60 дней"
 ALG_favor_mozabite_tt: "§GМозабитские торговцы расширяют свои сети!§!"
 ALG_recognize_tamazight_1: "Признать язык тамазигхт"
 ALG_recognize_tamazight_1_desc: "Официально признать тамазигхт национальным языком Алжира наравне с арабским. Это историческое решение отвечает главному требованию берберского движения.\n\n§GЭффекты:§!\n• Удовлетворённость кабилов §G+20§!\n• Удовлетворённость шауйя §G+15§!\n• Удовлетворённость туарегов §G+10§!\n• Удовлетворённость мозабитов §G+10§!\n• Удовлетворённость арабов §R-10§!\n• §G+5%§! к стабильности\n\n§YДоступно после 2002 года§!"
 ALG_recognize_tamazight_tt: "§GИсторическое признание тамазигхта национальным языком!§!\nВсе берберские группы довольны, но арабские националисты возмущены."
 ALG_national_unity_initiative: "Инициатива национального единства"
 ALG_national_unity_initiative_desc: "Развернуть широкую программу, ставящую алжирскую национальную идентичность выше этнических разделений, продолжая политику примирения Бутефлики.\n\n§GЭффекты:§!\n• Удовлетворённость всех групп §G+5§!\n• §G+3%§! к стабильности по завершении\n\n§YДорого, зато никого не обижает.§!\n§YПерезарядка:§! 180 дней"
 ALG_unity_policy_tt: "§GВсе алжирцы сплотились под национальным знаменем!§!"
 ALG_suppress_ethnic_unrest: "§RПодавить этнические волнения§!"
 ALG_suppress_ethnic_unrest_desc: "Силами безопасности подавить этнические протесты и восстановить порядок.\n\n§RЧРЕЗВЫЧАЙНАЯ МЕРА§! — доступна, только когда группы в кризисе (удовлетворённость < 25).\n\n§YЭффекты:§!\n• Удовлетворённость кризисных групп §G+15§!\n• §R-5%§! к стабильности\n• §R-3%§! к поддержке войны\n\n§RЭто лишь временное решение!§!"
 ALG_suppress_unrest_tt: "Силы безопасности пока восстановили порядок.\n§RКоренных причин это не устранит.§!"
 ALG_conduct_national_census: "Провести всеобщую перепись"
 ALG_conduct_national_census_desc: "Провести подробную демографическую перепись, чтобы лучше понять состав населения."
 ALG_census_arab_focus_tt: "§GАрабы довольны!§! Остальные группы чувствуют себя на обочине."
 ALG_census_balanced_tt: "§GВсе группы ценят признание многообразия!§!"
 ALG_census_neutral_tt: "Мы не занимаем официальной позиции в вопросах идентичности."
 ALG_arab_content: "Поддержка арабской общины"
 ALG_arab_content_desc: "Арабское большинство всецело поддерживает правительство, обеспечивая политическую опору и охотных новобранцев для наших вооружённых сил."
 ALG_arab_discontent: "Недовольство арабов"
 ALG_arab_discontent_desc: "Арабское население всё больше раздражено политикой правительства, которая, как кажется, благоволит меньшинствам за их счёт."
 ALG_arab_unrest: "Волнения среди арабов"
 ALG_arab_unrest_desc: "Арабское большинство глубоко недовольно. Протесты и беспорядки становятся обычным делом, угрожая стабильности, которая далась нам такой ценой после гражданской войны."
 ALG_chaoui_content: "Процветание Ореса"
 ALG_chaoui_content_desc: "Шауйя заняты на стройках и в горнодобывающих проектах по всему массиву Орес, что подстёгивает развитие региона."
 ALG_chaoui_discontent: "Запустение Ореса"
 ALG_chaoui_discontent_desc: "Шауйя чувствуют себя забытыми центральной властью. Развитие Ореса стоит на месте со времён гражданской войны."
 ALG_tuareg_content: "Союз с туарегами"
 ALG_tuareg_content_desc: "Гордые воины-туареги поддерживают правительство и передают нашей армии свой легендарный опыт войны в пустыне."
 ALG_tuareg_discontent: "Напряжённость в Сахаре"
 ALG_tuareg_discontent_desc: "Туарегские общины чувствуют себя забытыми Алжиром. Нестабильность в Мали и Нигере заставляет их сомневаться в своей верности."
 ALG_tuareg_unrest: "Восстание туарегов"
 ALG_tuareg_unrest_desc: "Туарегские бойцы сколачивают вооружённое сопротивление в Сахаре. Переходы через границы с Мали и Нигером всё усложняют. Юг становится неуправляемым."
 ALG_mozabite_content: "Мозабитская торговля"
 ALG_mozabite_content_desc: "Предприимчивая мозабитская община развивает торговые сети и своим коммерческим умением сбивает цены на товары."
 ALG_mozabite_discontent: "Напряжённость в Мзабе"
 ALG_mozabite_discontent_desc: "Мозабитская община отходит от участия в общенациональной экономике. Напряжение с арабскими соседями в долине Мзаб растёт."
 ALG_ethnic_harmony: "Межнациональное согласие"
 ALG_ethnic_harmony_desc: "Все крупные этнические группы довольны политикой правительства. Алжир един и наконец оставляет позади травму гражданской войны!"
 ALG_ethnic_tension: "Межнациональная напряжённость"
 ALG_ethnic_tension_desc: "Сразу несколько этнических групп глубоко недовольны. Хрупкий мир эпохи Бутефлики рассыпается, страна раскалывается по национальным швам."
 ALG_census_conducted: "Перепись проведена"
 ALG_ethnic_data_initialized: "Учреждено управление по делам народов"
 ALG_recent_ethnic_policy: "Недавно принятая национальная политика"
 ALG_recent_unity_policy: "Недавняя инициатива единства"
 ALG_recent_suppression: "Недавнее подавление"
 ALG_tamazight_recognized: "Тамазигхт признан"
 ALG_ghardaia_clashes_happened: "Произошли столкновения в Гардае"
 ALG_ethnic_warning_recent: "Недавно снятое межнациональное напряжение"
 ALG_arabization_hardline: "Жёсткая политика арабизации"
 ALG_arabization_pushed_once: "Первый шаг арабизации"
 ALG_arabization_recent: "Недавние меры по арабизации"
 ALG_kabyle_appeased_recently: "Кабильские настроения смягчены"
 ALG_sahara_expansion: "Опустынивание Сахары"
 ALG_sahara_expansion_desc: "Сахара занимает бо́льшую часть Алжира и неуклонно наступает на север, на степь и на без того небольшие пахотные земли. Перевыпас, неразумное орошение и добыча ресурсов ускоряют этот процесс; охрана природы, бережное земледелие и возобновляемая энергетика его замедляют.\n\nРаз в год мы получаем сводку о состоянии пустыни. Она может расшириться (§Yопустынивание§!, на ступень хуже), остаться как есть (§Yстабилизация§!) или отступить (§Yоазисообразование§!, на ступень лучше).\n\nВероятность §Yопустынивания§!: §R[?sahara_expands]%§!\nВероятность §Yстабилизации§!: [?sahara_steady]%\nВероятность §Yоазисообразования§!: §G[?sahara_retreats]%§!\n\nКаждая из этих вероятностей меняется на §Y5%§! за счёт фокусов. Развитие сельского хозяйства и промышленности — §Y$ALG_increase_cattle_grazing$§!, §Y$ALG_oil_production$§! и §Y$ALG_hassi_massoud_exploitation$§! — повышает вероятность опустынивания. Охрана природы и возобновляемая энергетика — §Y$ALG_optimize_pastoral_practices$§!, §Y$ALG_expand_nature_reserves_sahara$§! и §Y$ALG_solar_panel_grid$§! — понижают её."
 ALG_ethnic_relations_desc: "Алжир — мозаика народов, чья преданность государству очень разная.\n\n§YАрабское население:§! [ALG_arab_satisfaction_text]\n§YКабильское население:§! [ALG_kabyle_satisfaction_text]\n§YНаселение шауйя:§! [ALG_chaoui_satisfaction_text]\n§YТуарегское население:§! [ALG_tuareg_satisfaction_text]\n§YМозабитское население:§! [ALG_mozabite_satisfaction_text]"
 ALG_black_spring_event_desc: "По всей Кабилии вспыхнули протесты. Настроения населения: [ALG_kabyle_satisfaction_text]. Режим должен решить, как отвечать."
