 ENG_military.007.t: "Posto Avançado na Lua"
 ENG_military.007.d: "Nossos cientistas e engenheiros estão prontos para enviar astronautas e equipamentos para viver semipermanentemente na Lua. Um total de cerca de 12 astronautas será enviado, junto com dezenas de milhões de dólares em equipamentos, suprimentos, módulos habitacionais e itens pessoais. Este posto avançado precisará ser movido regularmente, pois o dia lunar dura 29 dias terrestres, o que é tempo demais para que as baterias mantenham energia armazenada na Lua.\n\nA própria base ficará nos polos, facilmente movível, para aproveitar ao máximo nossos painéis solares. Além disso, serão realizados experimentos para determinar as condições de vida de longo prazo na Lua. A extração de gelo lunar poderia não só fornecer água líquida para plantas e alimento aos astronautas na Lua, como também permitir separá-la em oxigênio e hidrogênio, combustível de foguete.\n\nPode levar meses ou anos para obter a pesquisa necessária para isso. Nesse meio tempo, porém, usando os fundos deste projeto, construiremos um depósito em órbita da Lua para facilitar o acesso a ela e o reabastecimento para voltar à Terra.\n\nTudo isso é alcançável na próxima década. Agora, porém, é hora de lançar."
 ENG_military.007.a: "Lançar!"
 ENG_military.008.t: "Base Lunar Alfa"
 ENG_military.008.d: "Nossos cientistas e engenheiros pousaram oficialmente na Lua e estão atualmente montando a base lunar. Cada seção é dividida em \"módulos\", não exatamente edifícios independentes, mas também não um só conjunto. Há um módulo de habitação, para descanso, um módulo de alimentos, para cultivar comida, um módulo de laboratório, o maior, com a maior parte do equipamento científico, um módulo de manutenção, contendo todas as ferramentas para consertar o que quebrar, um módulo de conveniências, já que essas pessoas ficarão aqui por 6 meses e trabalhar o dia todo, todos os dias, não faz bem à mente, e vários painéis solares. \n\nEntregas de alimentos serão comuns nestes primeiros meses, pois leva tempo para cultivar comida. Água e oxigênio serão obtidos do gelo lunar. Por fim, esses cientistas ficarão até pouco depois da mudança para o próximo local, em cerca de 6 meses, quando os painéis solares se tornarão inúteis, já que o dia e a noite lunares no local do posto duram 6 meses.\n\nA Base Lunar Alfa está completa."
 ENG_military.008.a: "Ciência!"
 ENG_military.009.t: "A Colônia Progride"
 ENG_military.009.d: "Nosso posto avançado científico na Lua teve um grande avanço. Com a expansão da rede atual de painéis solares e descobertas recentes que facilitam separar a água para obter oxigênio e hidrogênio, eles conseguiram produzir oxigênio e hidrogênio suficientes para abastecer totalmente o foguete de suprimentos mais recente. É um avanço tão necessário que permitirá que a própria Lua, com tempo e investimento suficientes, se torne um polo para futuras empreitadas espaciais rumo ao espaço profundo.\n\nO próprio espaço está ficando menor."
 ENG_military.009.a: "Somos bons em ser pioneiros"
 ENG_military.010.t: "Crise na Lua"
 ENG_military.010.d: "Medidas drásticas precisam ser tomadas imediatamente. Por razões ainda desconhecidas, o módulo de habitação se rompeu e \"explodiu\".\n\nHá uma hora, todos os 12 cientistas cumpriam suas tarefas quando, de repente, houve uma ruptura maciça no módulo de habitação.\n\nComo as ondas não se propagam no vácuo, a maioria só percebeu quando viu fisicamente o que havia acontecido.\n\nHá um fundo de emergência como parte do orçamento, portanto não é preciso destinar mais recursos ao projeto, e os cientistas sempre podem dormir nos outros módulos isolados; contudo, isso assustou muita gente, que afirma que alguns, muitos ou até todos os nossos cientistas poderiam ter morrido, e também reduziu o moral dos cientistas, já que poderiam ter morrido. Assim, tentar manter o posto avançado na Lua será politicamente custoso, e uma rotação de cientistas pode ter de acontecer agora e não depois, devido ao desgaste do moral.\n\nO que faremos?"
 ENG_military.010.a: "Enviar ajuda de emergência!"
 ENG_military.010.b: "Abandonar o projeto. Não é para nós"
 ENG_military.011.t: "A Colônia Progride Ainda Mais"
 ENG_military.011.d: "Nosso posto avançado na Lua fez outro grande avanço. Eles conseguiram enviar à Terra Hidrogênio 3, um gás que parece perfeito para a fusão, e os cientistas aqui descobriram como realizar a fusão com ele! Não só isso, como a energia gerada por essa fusão é próxima da usada para realizar a reação em primeiro lugar. Isso significa que, com algumas melhorias, isso poderia resultar em energia de fusão bem-sucedida! Além de proporcionar imensos benefícios aqui, junto com o conhecimento que talvez possamos usar para empregar outros materiais na fusão, podemos usar isso na Lua, permitindo um posto avançado permanente em vez de móveis!\n\nTudo isso está muito adiantado em relação ao cronograma, o que é uma surpresa, e muitos na UKSC ficaram despreparados para implementar isso na atual Base Lunar. Assim, é necessária uma nova Base Lunar, em um local muito melhor para a expansão rápida do que o atual da Base Lunar Alfa. É hora de começar os preparativos para a Base Lunar Beta."
 ENG_military.011.a: "A vida continua"
 ENG_military.012.t: "Outra Crise na Lua"
 ENG_military.012.d: "Mais medidas drásticas precisam ser tomadas agora. Mais dois módulos se romperam. Desta vez, foram o módulo de Alimentos e o de Conveniências.\n\nHá cerca de quarenta minutos, um cientista estava prestes a entrar no módulo de Alimentos quando ele explodiu de repente. O cientista está bem e ninguém além das plantas se feriu. No entanto, ele ficava ao lado do módulo de Conveniências e o fez se romper e explodir. Novamente, ninguém se feriu.\n\nEsta nova ocorrência, porém, deixou muita gente arrepiada aqui na Terra, questionando a segurança dos módulos. Após a explosão anterior, a UKSC substituiu os módulos, garantindo que não explodiriam, mas parece que a pressão prolongada pode fazer algo quebrar com muito mais facilidade do que normalmente. A UKSC já respondeu rapidamente, ordenando a fabricação imediata de novos módulos, bem como uma inspeção minuciosa de todos os módulos atuais (já que não é possível \"recolher\" módulos da Lua neste momento).\n\nCom a crescente pressão aqui para parar de avançar com o projeto até que todas as preocupações de segurança sejam resolvidas, a continuação do programa da Base Lunar é posta em dúvida. Além da reação política, o fundo de emergência foi cortado pela metade, de modo que a UKSC solicita mais $5 bilhões para resolver preocupações futuras. Cabe a você decidir se continua."
 ENG_military.012.a: "Enviar mais ajuda de emergência!"
 ENG_military.012.b: "Não podemos continuar fazendo coisas assim"
 ENG_military.013.t: "Base Lunar Beta"
 ENG_military.013.d: "A esta altura, nossos cientistas e engenheiros na Lua precisam se mudar para outro local nos polos. Os custos disso já estão previstos no orçamento de longo prazo, então ainda não precisamos acrescentar nenhum novo financiamento ao projeto.\n\nCom esta nova base lunar, poderemos usar as novas descobertas que fizemos para estabelecer a base de forma permanente, ao contrário da anterior. Com foguetes melhores, melhor geração de energia e melhor extração e separação de gelo, podemos usar esta nova base, em um local mais adequado à expansão rápida, para facilitar os esforços de colonização da Lua. Esta não é a única boa notícia: empresários e corporações estão inundando a UKSC em massa com pedidos para instalar seus sistemas de mineração recém-desenvolvidos na Lua. Até programas espaciais de outros países estão agora extremamente interessados em montar postos científicos e de mineração na Lua; no entanto, graças aos seus esforços diligentes, não só temos uma enorme vantagem inicial, como somos o único país tentando ativamente colonizar a Lua.\n\nO futuro em nossa Lua é brilhante e chinês."
 ENG_military.013.a: "Finalmente o Chá da Tarde na Lua!"
 ENG_Moonbase_beta_completed: "Base Lunar Beta Concluída"
 ENG_military.014.t: "Missão do Rover a Marte"
 ENG_military.014.d: "Nossos cientistas e engenheiros estão prontos para enviar nosso Rover a Marte. Ele tem cerca de 14 sensores instalados, além de dezenas de milhões de dólares em equipamentos. Este Rover precisará ser movido regularmente, pois o dia marciano dura 1 1/5 de dia terrestre, o que é tempo demais para que as baterias mantenham energia armazenada em Marte.\n\nO Rover ficará nos polos, facilmente movível, para aproveitar ao máximo nossos painéis solares. Além disso, serão realizados experimentos para determinar as condições de vida de longo prazo em Marte. A extração de gelo poderia não só fornecer água líquida para plantas e alimento aos futuros astronautas em Marte, como também permitir separá-la em oxigênio e hidrogênio, combustível de foguete.\n\nPode levar meses ou anos para obter a pesquisa necessária para isso. Nesse meio tempo, porém, usando os fundos deste projeto, construiremos um depósito em órbita de Marte para facilitar o acesso a ele e o reabastecimento para voltar à Terra.\n\nTudo isso é alcançável na próxima década. Agora, porém, é hora de lançar."
 ENG_military.014.a: "Lançar!"
 ENG_military.015.t: "Projeto da Colônia em Marte"
 ENG_military.015.d: "Se os humanos querem colonizar Marte, devem estabelecer uma base permanente e autossustentável. Este é o sonho de incontáveis exploradores espaciais e a única maneira de os humanos pisarem no espaço. Tudo isso se tornará realidade hoje."
 ENG_military.015.a: "Marte, lá vamos nós!"
 ENG_military.016.t: "Falha no Sistema de Pouso"
 ENG_military.016.d: "Após uma jornada de quase 60 milhões de quilômetros, nossa espaçonave finalmente apareceu sobre Marte. O óxido de ferro por todo Marte lhe dava uma aparência vermelha. O planeta, por muito tempo visível apenas por uma lente, agora está à vista. \nA espaçonave entra em modo de pouso. O capitão, que treinara incontáveis vezes no simulador, deu a ordem, mas parecia haver um problema com o dispositivo de pouso. Nesse momento, grandes gotas de suor cobriram instantaneamente a testa do capitão."
 ENG_military.016.a: "Londres, tivemos um problema."
 ENG_military.017.t: "Falha do Veículo"
 ENG_military.017.d: "Após meia hora de tensão, a espaçonave finalmente escapou do risco de colidir e pousou de lado na Planície Utopia de Marte. Este também é o local de pouso do rover Beagle anterior. É reconhecida como a maior bacia de impacto de Marte e do sistema solar, com diâmetro estimado de 3.300 quilômetros. \nApós o pouso, a tripulação se transferirá para um rover especial e seguirá para a parte sul da planície para estabelecer uma base, mas as vibrações do pouso anterior da espaçonave parecem ter afetado o rover. É claro que a situação evoluiu de maneira não necessariamente favorável à tripulação"
 ENG_military.017.a: "Parece que há algo errado com o nosso maldito veículo hoje."
 ENG_military.018.t: "Chegada à Base"
 ENG_military.018.d: "40 quilômetros, a primeira vez que humanos percorrem uma marcha tão longa em um planeta que não a Terra. Uma distância tão comum na Terra é um marco na história do voo espacial humano. \nDepois de passar pelo tenso processo de montar o acampamento, transmitir todos os dados necessários à Terra e verificar os parâmetros de todos os equipamentos, o capitão, sentado na cama, pôde finalmente tomar uma xícara de chá. \nPela janela de material sintético transparente acima da cabeça, um ponto de luz entre as estrelas brilhava com um leve tom azulado, e aquela era a Terra. \n\n'Melhor.', murmurou o capitão."
 ENG_military.018.a: "Não tenha medo de chegar tarde a uma boa refeição."
 ENG_military.019.t: "Pouso Bem-Sucedido"
 ENG_military.019.d: "Tudo correu perfeitamente, como esperado; a espaçonave pousou exatamente no local de pouso designado, e a jornada humana a Marte começou em paz. \n"
 ENG_military.019.a: "Eu sabia que nossa tripulação conseguiria cumprir a missão."
 ENG_military.020.t: "Chegada à Base"
 ENG_military.020.d: "O ponto de pouso da espaçonave era o endereço predefinido da base, e a tripulação começou a acampar no local para se preparar para a construção da primeira base permanente da humanidade em Marte. Ninguém notou que as botas espaciais deixaram incontáveis pegadas desordenadas no solo marciano."
 ENG_military.020.a: "Um pequeno passo para Marte, um salto gigante para a humanidade."
 ENG_military.021.t: "Localizar a Fonte de Água"
 ENG_military.021.d: "A água é um recurso essencial para a sobrevivência humana. Um dos principais objetivos das atividades anteriores de exploração de Marte era encontrar fontes de água em Marte. Embora não haja lagos ou rios na superfície como na Terra, os recursos hídricos de Marte existem basicamente na forma de gelo sob a superfície do planeta. \nNo entanto, o posicionamento preciso exige que alguém faça levantamentos no local, pessoalmente."
 ENG_military.021.a: "Não sobrevivemos sem o nosso chá!"
 ENG_military.022.t: "Proteção Subterrânea contra Radiação"
 ENG_military.022.d: "Devido à atmosfera tênue de Marte e à falta de um campo magnético planetário, a radiação do espaço chega à superfície sem obstáculos. A base não conseguiu oferecer abrigo suficiente quando foi construída, então cavar um ninho no solo tornou-se a primeira escolha para evitar a radiação. \nTestemunhar o orgulho de criar uma nova base para o Reino Unido lembrou a tripulação dos grandes dias do Império Britânico."
 ENG_military.022.a: "Britannia Governa o Espaço"
 ENG_military.023.t: "A Primeira Colheita em Marte"
 ENG_military.023.d: "O problema das fontes de água foi resolvido e a energia é fornecida temporariamente por energia solar. Portanto, a produção de alimentos (e de Chá) em Marte tornou-se o assunto mais importante no momento. \nOs cereais tradicionais foram descartados devido a seus ciclos de crescimento e processos de colheita, e as batatas tornaram-se as primeiras culturas humanas a serem cultivadas em Marte. Embora Marte não seja tão brilhante quanto a Terra devido à distância do sol, as batatas na estufa parecem crescer mais viçosas. A primeira colheita da humanidade em Marte está à vista."
 ENG_military.023.a: "Batatas totalmente naturais, orgânicas, cultivadas em Marte."
 ENG_military.024.t: "Tempestade de Areia"
 ENG_military.024.d: "Tempestades de areia são comuns em Marte. Embora a pressão atmosférica em Marte seja muito menor que a da Terra, a tempestade marciana não é tão devastadora quanto as lendas anteriores, como naquele filme. \nNo entanto, a poeira levantada ainda representa muitos perigos ocultos para as bases humanas, especialmente porque a energia solar é uma fonte de energia indispensável para as bases atuais."
 ENG_military.024.a: "Não temos como salvar Matt Damon aqui."
 ENG_military.025.t: "Acidente"
 ENG_military.025.d: "Quem sobe a montanha com frequência acaba topando com um tigre. A tempestade de poeira marciana durou muito mais do que o previsto, e a autonomia das baterias dentro da base parecia estar em situação muito pessimista. \nPara continuar a missão da colônia em Marte, precisamos tomar uma decisão: optar por evacuar e encontrar um novo local, ou continuar reparando as instalações danificadas."
 ENG_military.025.a: "Evacuar"
 ENG_military.025.b: "Consertar a Base"
 ENG_military.026.t: "Evacuar"
 ENG_military.026.d: "Não podemos esperar mais. A situação agora é crítica e é hora de usar os foguetes de reserva para a evacuação. Depois de verificar que todos os membros da equipe haviam embarcado em segurança, o capitão olhou relutante para o prédio da base que ainda estava em construção. Reprimiu a dor no coração e deu a ordem ao guia de inteligência artificial para lançar a espaçonave. \n'Nós voltaremos!' Quando uma enorme nuvem de fumaça subiu, a espaçonave se desprendeu do solo marciano e subiu lentamente ao céu."
 ENG_military.026.a: "Onde há vida, há esperança."
 ENG_military.027.t: "Reparar a Base Danificada"
 ENG_military.027.d: "Não podemos ficar de braços cruzados esperando; devemos iniciar os reparos na base imediatamente, a qualquer custo, caso contrário todos os ganhos que tivemos em Marte serão arruinados e ninguém poderá sobreviver neste caos. Salvar a base significa salvar a nós mesmos."
 ENG_military.027.a: "Em nome do sacrifício e da grande ambição, ousamos criar um novo mundo."
 ENG_military.028.t: "Projeto da Cidade em Marte"
 ENG_military.028.d: "Obtivemos conquistas notáveis na construção de uma colônia em Marte. Mas ainda há alguma distância a percorrer antes de alcançarmos nosso objetivo final. Queremos continuar investindo na construção em Marte?"
 ENG_military.028.a: "Ampliar"
 ENG_military.028.b: "Não precisamos"
 ENG_military.029.t: "Sim"
 ENG_military.029.d: "Basta dar mais um passo à frente e nossa missão em Marte estará completamente cumprida. Não há meias-medidas em nossa agenda."
 ENG_military.029.a: "Não passe a responsabilidade para a próxima geração."
 ENG_military.030.t: "Não"
 ENG_military.030.d: "A atual base em Marte está completa o bastante, e não é sensato continuar a investir mais. Ainda temos muitos problemas a enfrentar na Terra, e é impossível simplesmente jogar dinheiro no espaço."
 ENG_military.030.a: "Acredite na sabedoria das gerações futuras."
 ENG_military.031.t: "Cidade em Marte concluída"
 ENG_military.031.d: "Após nossos esforços incansáveis, nossa colônia em Marte foi finalmente concluída. Os seres humanos jamais esquecerão esses esforços, e um dia os seres humanos pisarão em toda a galáxia."
 ENG_military.031.a: "Nossa jornada é a galáxia inteira."
 ENG_military.032.t: "Nova Sub-base Estabelecida"
 ENG_military.032.d: "À medida que mais espaçonaves traziam mais pessoal e materiais, a base original em Marte começou a prosperar. Os recursos hídricos sob a base original não suportam mais gente, e é urgente estabelecer uma nova sub-base. \nEnquanto a espaçonave da primeira equipe desaparecia gradualmente de vista, o antigo capitão, hoje prefeito da primeira nova cidade de Londres, recordou o passado, quando o rover de Marte caiu em uma vala."
 ENG_military.032.a: "Mãe, hoje eu vou numa longa viagem."
 ENG_military.033.t: "Monumento da Cidade em Marte"
 ENG_military.033.d: "À medida que os humanos percorreram Marte, Marte tornou-se o novo lar dos humanos da Terra. A terraformação de Marte avança de maneira ordenada. No primeiro ponto de pouso da espaçonave humana, foi erguido um enorme monumento para homenagear os homens e mulheres que sacrificaram suas vidas durante a jornada e a construção no processo de conquista de Marte. Eles ficarão para sempre gravados na jornada da civilização humana."
 ENG_military.033.a: "Pela humanidade!"
 ENG_mars_city_building_completed: "Construção da Cidade em Marte Concluída"
 ENG_military.001.t: "Lançando a Iniciativa de Mineração de Asteroides"
 ENG_military.001.d: "A mineração de asteroides foi uma fantasia para muitos antes de nós. Os próprios asteroides contêm metais do grupo da platina, ouro, prata e metais do grupo do ferro muito desejados. Isso pode se tornar extremamente lucrativo para qualquer país com capacidade espacial. Portanto, hoje, o estabelecimento de uma Companhia Real Britânica de Mineração de Asteroides, ou BRAMC, será o primeiro passo rumo à mineração de asteroides. Usando vastas redes de telescópios por todo o Império, podemos procurar asteroides adequados no espaço próximo, depois puxá-lo para a órbita e minerá-lo. Localizar um asteroide adequado será difícil, pois, em relação à distância em que estão, são bastante pequenos. Felizmente, há vários que passam pela Terra de tempos em tempos, então não levaria muito para conseguir que um permaneça na órbita da Terra."
 ENG_military.001.a: "Só precisamos esperar por um asteroide..."
 ENG_military.002.t: "Asteroide Avistado"
 ENG_military.002.d: "Recentemente, nossos cientistas da BRAMC avistaram um asteroide adequado passando perto da Terra. Foi um alívio para a BRAMC, pois alguns duvidavam de que algum dia avistaríamos um asteroide adequado e econômico. No entanto, este asteroide se move devagar o bastante, é grande o bastante e é rico o bastante para ser colocado em órbita e minerado. O asteroide é, na verdade, maior que o País de Gales. O próximo passo é simplesmente mover este asteroide para a órbita da Terra, algo nunca feito antes. Enquanto isso, os engenheiros do Comando Espacial Britânico, e até empresas privadas como a Virgin Galactic, inventaram mecanismos para minerar o asteroide, de modo que estarão prontos quando o asteroide entrar em órbita."
 ENG_military.002.a: "Vamos colocar esse bebê em órbita"
 ENG_military.003.t: "Asteroide em Órbita"
 ENG_military.003.d: "Com o asteroide em órbita, a UKSC e a Virgin estão ambas enviando missões ao asteroide em órbita. A UKSC se preocupa principalmente com a coleta de dados científicos, enquanto a Virgin Galactic se interessa mais pela mineração do material. Sem dúvida é uma conquista digna de nota, que nos dá vantagem no espaço. Fala-se até em trazer mais asteroides, mas muitos dizem que asteroides adicionais podem vir depois, pois este é muito grande e adequado para mineração. Outros países já nos olham com inveja e consideram seus próprios programas de mineração de asteroides. Os custos são extremamente altos até para desenvolver a tecnologia necessária para chegar lá, então há pouca preocupação, entre a Virgin Galactic ou a UKSC, de que a concorrência chegue."
 ENG_military.003.a: "A mineração começará"
 ENG_military.004.t: "Os Lucros da Mineração Começam a Chegar"
 ENG_military.004.d: "Após estabelecer as operações de mineração, a Virgin Galactic e a UKSC enviaram suas primeiras remessas de material espacial a laboratórios e mercados do mundo todo. O mundo nos observa com inveja, e houve discussões abertas em suas respectivas casas legislativas sobre abrir suas próprias operações de mineração de asteroides. Embora logo possamos ter concorrência, por ora podemos desfrutar do monopólio."
 ENG_military.004.a: "Estou radiante!"
 ENG_military.005.t: "Lucros da Mineração de Asteroides"
 ENG_military.005.d: "As últimas remessas de nossas operações de mineração de asteroides chegaram e geraram muitas receitas. Essas remessas incluem platina, ouro e prata. Seria sábio dar bom uso a essas receitas."
 ENG_military.005.a: "Excelente!"
 ENG_military.006.t: "Potencial da Mineração de Asteroides"
 ENG_military.006.d: "Recentemente, a Câmara dos Comuns permitiu que a UKSC e a Virgin Galactic, uma empresa espacial privada, trouxessem um asteroide bastante grande para a órbita da Terra e o minerassem. Nossos conselheiros recomendam que invistamos neste novo setor, pois ele poderia permitir que materiais raros fossem entregues diretamente ao nosso país. Alguns, no entanto, citam a enorme conta que o Reino Unido teve de pagar apenas para iniciar as operações e se opõem à expansão rumo ao espaço. O retorno deste investimento depende de vários fatores, mas pode levar 25 anos só para empatar. Um investimento mais substancial pode reduzir esse prazo, mas ficaremos bastante atrás dos demais por um bom tempo. \n\nO que faremos quanto à Mineração de Asteroides? Iniciar um programa nacional ou ignorá-la por completo?"
 ENG_military.006.a: "Investir na Mineração de Asteroides"
 ENG_military.006.b: "Caro demais e uma perda de tempo!"
 Mobile_Fires_Platorm_Program.1.t: "Escolha de Parceiro do Programa de Plataforma de Fogos Móvel"
 Mobile_Fires_Platorm_Program.1.d: "Com o fim da Guerra Fria e a diminuição da expectativa de um conflito nas planícies alemãs, o estoque de sistemas de artilharia de 155 mm do Exército diminuiu e, agora, com novas ameaças no horizonte, o Ministério da Defesa decidiu tomar medidas para ressuscitar essa capacidade. Diversos programas e parceiros para cumprir este contrato se apresentaram, dos quais apenas um será bem-sucedido."
 ENG_military.034.a: "Aliança de Artilharia Archer"
 ENG_military.034.b: "Grupo de Desenvolvimento K9A1 Thunder"
 ENG_military.034.c: "Programa Boxer"
 ENG_military.034.e: "Colaboração Caesar"
 ENG_military.035.t: "A Grã-Bretanha nos Convida para uma Força Expedicionária Conjunta"
 ENG_military.035.d: "O Reino Unido estende um convite cordial a [Receiving Country] para se juntar à Força Expedicionária Conjunta (JEF), uma iniciativa colaborativa voltada a fomentar a cooperação internacional e aprimorar a segurança coletiva. Este importante evento marca o início de um novo capítulo em nosso compromisso compartilhado de promover a estabilidade, responder aos desafios globais e salvaguardar os valores que prezamos."
 ENG_military.035.a: "Nós aceitamos!"
 ENG_military.035.b: "Não, Obrigado, Meu Velho"
 ENG_military.036.t: "[From.GetName] Aceita!"
 ENG_military.036.d: "[From.GetName] se juntará à nossa Força Expedicionária Conjunta. Juntos, podemos preparar nossas forças militares para resposta rápida"
 ENG_military.036.a: "Bem-vindos"
 ENG_military.037.t: "[From.GetName] Recusa!"
 ENG_military.037.d: "[From.GetName] não se juntará à nossa Força Expedicionária Conjunta. Preferem se manter por conta própria"
 ENG_military.037.a: "Vão se arrepender com o tempo"
 ENG_military.038.t: "Expansão do Colégio Naval de Dartmouth"
 ENG_military.038.d: "Com foco em tecnologia de ponta, pensamento estratégico e experiência prática, o Colégio Naval de Dartmouth está pronto para desempenhar um papel fundamental na formação da próxima geração de líderes navais."
 ENG_military.038.a: "Porta-aviões são o futuro da guerra naval"
 ENG_military.038.b: "Precisamos de Contratorpedeiros e Cruzadores para derrotar nossos inimigos no mar"
 ENG_military.040.t: "Debate sobre o Typhoon Tranche 1"
 ENG_military.040.d: "Partes interessadas, como oficiais militares, analistas de defesa e representantes do governo, participam de discussões sobre a eficácia da aeronave diante de ameaças em evolução, seu papel nas estratégias de defesa nacional e seu potencial de exportação a parceiros internacionais. O Debate sobre o Typhoon Tranche 1 desempenha um papel crucial na definição de decisões relativas à aquisição, ao emprego e ao desenvolvimento futuro deste caça avançado."
 ENG_military.040.a: "Continuar a produção"
 ENG_military.040.b: "Pesquisar seu sucessor"
 ENG_military.040.c: "Reduzir o estoque"
 ENG_military.039.t: "Especialização das Forças Armadas"
 ENG_military.039.d: "Escolha sua especialização"
 ENG_military.039.a: "Exército"
 ENG_military.039.b: "Força Aérea"
 ENG_military.039.c: "Marinha"
 ENG_military.039.e: "Estado-Maior"
 ENG_military.041.t: "O Reino Unido Nos Convida a Comprar Sua Inovação em Aeronaves"
 ENG_military.041.d: "O Reino Unido fez enormes investimentos nas capacidades de sua indústria de aeronaves e aviação. Por causa de nossa relação especial, eles se oferecem para compartilhar sua inovação por um preço pequeno. Afinal, são britânicos"
 ENG_military.041.a: "Inovação? Sim, por favor!"
 ENG_military.041.b: "Não, Obrigado, Meu Velho"
 ENG_military.042.t: "O Reino Unido Nos Convida a Comprar Sua Inovação em Aeronaves"
 ENG_military.042.d: "O Reino Unido fez enormes investimentos nas capacidades de sua indústria de aeronaves e aviação. Por causa de nossa relação especial, eles se oferecem para compartilhar sua inovação por um preço pequeno. Afinal, são britânicos"
 ENG_military.042.a: "Inovação? Sim, por favor!"
 ENG_military.042.b: "Não, Obrigado, Meu Velho"
 ENG_military.043.t: "Os EUA Aceitam"
 ENG_military.043.d: "Os EUA aceitaram nossa oferta de vender nossa inovação"
 ENG_military.043.a: "Como esperado"
 ENG_military.044.t: "Os EUA Recusam"
 ENG_military.044.d: "Os EUA recusaram nossa Oferta de Venda de Inovação. Acreditam que o Reino Unido não é o parceiro viável de que precisam"
 ENG_military.044.a: "Eles vão perceber, mais cedo ou mais tarde"
 United_Kingdom.002.t: "O Silicon Glen Entrega Resultados"
 United_Kingdom.002.d: "Nossos investimentos no Silicon Glen da Escócia estão dando frutos. Universidades locais, projetistas de chips e empresas de software relatam mais um ano de crescimento, novas patentes e um fluxo constante de graduados qualificados para a economia em geral."
 United_Kingdom.002.a: "Que o Glen continue empurrando a fronteira"
 United_Kingdom.003.t: "Proposta de Cooperação Transfronteiriça"
 United_Kingdom.003.d: "O Reino Unido nos apresentou uma proposta para melhorar a logística comercial e reduzir a burocracia em nossa fronteira compartilhada. O marco de cooperação sugerido se concentra no alinhamento de infraestrutura, na simplificação alfandegária e em comitês regulatórios conjuntos.\n\nDevemos aceitar?"
 United_Kingdom.003.a: "Aceitar o marco"
 United_Kingdom.003.b: "Recusar a oferta"
 United_Kingdom.004.t: "A Irlanda Aceita a Cooperação Transfronteiriça"
 United_Kingdom.004.d: "O governo irlandês aceitou nossa proposta de coordenação econômica transfronteiriça simplificada. Foram criados comitês para reduzir a burocracia, alinhar padrões e facilitar a circulação de mercadorias através do Mar da Irlanda e da fronteira terrestre."
 United_Kingdom.004.a: "Progresso por meio da parceria"
 United_Kingdom.005.t: "A Irlanda Recusa a Oferta Transfronteiriça"
 United_Kingdom.005.d: "Apesar do interesse inicial, o governo irlandês decidiu, por fim, não participar de nosso marco de cooperação transfronteiriça. Autoridades citaram a complexidade jurídica e a hesitação política como principais razões da recusa."
 United_Kingdom.005.a: "Lamentável, mas esperado"
 scottish.1.t: "Eleições Parlamentares Escocesas"
 scottish.1.d: "Os resultados das eleições parlamentares escocesas chegaram, e finalmente podemos ver se o povo escocês votou ou não em partidos pró-independência."
 scottish.1.a: "Certo"
 britain_md.1.a: "Então vamos nos mexer"
 britain_md.2.a: "Vamos arriscar"
 britain_md.2.b: "Não gosto dessas chances"
 britain_md.3.a: "Apelar aos Sindicatos Trabalhistas"
 britain_md.3.b: "Apelar ao Complexo Militar-Industrial"
 britain_md.3.c: "Apelar à Indústria dos Combustíveis Fósseis"
 britain_md.4.a: "Tributar os industriais"
 britain_md.4.b: "Tributar os militares"
 britain_md.4.c: "Tributar as indústrias de combustíveis fósseis"
 britain_md.4.d1: "Será que realmente precisamos tributar alguém?"
 britain_md.5.a: "Avante!"
 britain_md.6.d: "Nossa infraestrutura precisa desesperadamente de melhorias. Não é necessariamente ruim, mas, para competir com os atores globais, precisaremos expandir nossas cidades. No entanto, em vez de nos concentrarmos apenas em uma ampla expansão da infraestrutura, escolheremos uma região específica para trabalhar. Assim, poderemos criar novos polos de investimento e fazer essas áreas florescerem."
 britain_md.6.a: "Trabalhar no Norte"
 britain_md.6.b: "Trabalhar no Centro"
 britain_md.6.c: "Trabalhar no Sul"
 britain_md.7.a: "Vamos ao trabalho"
 britain_md.8.a: "Certamente não estão ligados! Os migrantes são gente boa"
 britain_md.8.b: "Bem, os dados não mentem"
 britain_md.9.a: "Sem tempo a perder, vamos em frente"
 britain_md.10.a: "Vamos mudar um pouco as coisas"
 britain_md.10.b: "De jeito nenhum"
 britain_md.11.a: "Bom, agora vamos em frente"
 britain_md.12.a: "Certo"
 britain_md.12.b: "Não"
 britain_md.13.a: "Certo"
 britain_md.14.a: "Desgraçados"
 britain_md.15.a: "Certo"
 britain_md.16.a: "Um golpe brando, não buscaremos mais controle"
 britain_md.16.b: "Um golpe duro, buscaremos um Estado satélite"
 britain_md.17.a: "Bom"
 britain_md.18.a: "Merda"
 britain_md.19.a: "Bom"
 britain_md.20.a: "Como esperado"
 britain_md.21.a: "Absurdo! Mas o que podemos fazer?"
 britain_md.21.b: "Absurdo! Mobilizar o exército!"
 britain_md.22.a: "Não há mais volta agora"
 britain_md.22.b: "Calma lá, e se devolvêssemos?"
 britain_md.23.a: "É assim que o medo vai te controlar?"
 britain_md.24.a: "Ambições para a Grã-Bretanha"
 britain_md.24.b: "Grã-Bretanha para a Frente, Não para Trás"
 britain_md.24.c: "Um Futuro Justo para Todos"
 britain_md.24.a1: "É Hora do Bom Senso"
 britain_md.24.b1: "Você Está Pensando o Que Estamos Pensando?"
 britain_md.24.c1: "Convite ao Governo da Grã-Bretanha"
 britain_md.25.a: "Vamos lá!"
 britain_md.26.a: "Focar na integração das ilhas"
 britain_md.26.b: "Devemos avançar mais para o Oeste"
 britain_md.26.c: "Devolver as ilhas"
 britain_md.27.t: "A Grã-Bretanha Devolve as Falkland"
 britain_md.27.d: "Numa reviravolta astronomicamente chocante, [ENG.GetName], um Estado que lutou conosco pelas Falkland nos anos 80, decidiu devolver as ilhas ao nosso controle. Não sabemos o que motivou isso, nem por que o fizeram, mas já temos forças voltando para a ilha para ficarem estacionadas. O governo britânico declarou que a medida é uma tentativa de 'estreitar relações' conosco e com a região sul-americana em geral."
 britain_md.27.a: "Parece-nos bom!"
 britain_md.28.t: "Operação Bem-Sucedida de Mudança de Regime no Zimbábue"
 britain_md.28.d: "Após uma operação para derrubar o ditador zimbabuano, o partido Movimento pela Mudança (MDC) foi instalado por nossas forças. Isso se segue a um extenso planejamento e a uma operação de unidades de forças especiais britânicas para derrubar o regime de longa data no país."
 britain_md.28.a: "Bom, não esperávamos menos"
 britain_md.29.t: "[ENG.GetName] Realiza um Golpe!"
 britain_md.29.d: "Parece que [ENG.GetName] conduziu uma operação encoberta em nosso país que resultou na derrubada de nosso regime anterior e na instalação de um novo governo. Forças militares foram contatadas de antemão e até prepararam o caminho para que as forças britânicas entrassem no país sem serem notadas."
 britain_md.29.a: "O quê?"
 britain_md.30.t: "Aproximando-se da Operação Eastern Divide"
 britain_md.30.d: "Os egípcios detêm atualmente o controle total do Sinai, com ocasionais choques com os israelenses ao longo dos anos. No entanto, nossa nação precisa desesperadamente de rotas comerciais mais eficientes, e os impostos que nos atingem toda vez que passamos pelo Suez começaram a se acumular além da compreensão. Precisaremos fechar um acordo com os egípcios ou seremos compelidos a tomar outras medidas."
 britain_md.30.a: "Vamos iniciar as negociações"
 britain_md.30.b: "Sem tempo para negociações, avançar"
 britain_md.31.t: "Os Britânicos Pedem Controle Conjunto do Sinai"
 britain_md.31.d: "O governo britânico enviou diplomatas para receber nossos ministros em [EGY.capital.GetCapitalVictoryPointName] para discutir a possibilidade de controle conjunto no Sinai. Sugerem que seus navios e comerciantes foram tratados de forma injusta demais, e que concordar com isso demonstrará que nosso governo é digno de confiança."
 britain_md.31.a: "Todo egípcio morrerá antes de cedermos o Sinai!"
 britain_md.31.b: "Talvez possamos chegar a um acordo..."
 britain_md.32.t: "O Egito Rejeita as Negociações"
 britain_md.32.d: "Os egípcios declararam que não têm interesse em negociar conosco o controle do Suez, mesmo que isso signifique que estaremos dispostos a lhes dar grandes concessões. Não nos resta outra opção senão considerar a intervenção militar."
 britain_md.32.a: "É hora de avançar"
 britain_md.32.b: "Esqueça"
 britain_md.33.t: "O Egito Oferece Negociações"
 britain_md.33.d: "Os egípcios aceitaram nossos pedidos de negociação sobre o Sinai e solicitaram uma quantia em dinheiro a ser paga pelo acesso direto, militar e comercial, através do Sinai com impostos menores."
 britain_md.33.a: "Parece-nos bom"
 britain_md.33.b: "Sério? Isso é um insulto!"
 britain_md.34.t: "Operação Eastern Divide: Em Andamento"
 britain_md.34.d: "A Operação Eastern Divide está em andamento, com tropas tendo desembarcado no Sinai. Devemos iniciar a mobilização de uma quantidade maior de forças que permita uma operação em maior escala."
 britain_md.34.a: "Vai, vai, vai!"
 britain_md.35.t: "[FROM.GetName] Pede Integração Mais Profunda"
 britain_md.35.d: "[ENG.GetName] pediu uma integração mais profunda, alegando que, ao abrir mão de um pouco de nossa soberania, poderemos reunir nossas forças e voltar a levar nossa posição à de uma potência global. Embora muitos de nossos cidadãos desconfiem dessa proposta, [ENG.GetName] provou-se nos últimos anos um forte concorrente ao nos superar em todos os setores."
 britain_md.35.a: "Devemos nos unir"
 britain_md.35.b: "Não abriremos mão de nossa soberania"
 britain_md.36.t: "[FROM.GetName] Busca Maior Integração"
 britain_md.36.d: "[FROM.GetName] sinalizou que de fato tem interesse em integração mais profunda, oferecendo vários roteiros para fundir instituições e órgãos burocráticos centrais. Nossos diplomatas e burocratas estão trabalhando horas extras para garantir uma transição suave, segura e estável."
 britain_md.36.a: "Bom"
 britain_md.37.t: "[FROM.GetName] Recusa Maior Integração"
 britain_md.37.d: "Parece que o governo [FROM.GetAdjective] não tem interesse em maior integração, insistindo, em vez disso, que nossas medidas recentes violam sua soberania."
 britain_md.37.a: "Certo"
 britain_md.39.t: "Eleger uma Figura de Proa"
 britain_md.39.d: "Embora entendamos as implicações de conceder alguma forma de poder a outro político, precisamos reconhecer a necessidade de um representante que apazigue as multidões cansadas de um líder militar no comando do Estado. Encontraremos rapidamente alguém para sustentar como fantoche que representará o Estado."
 britain_md.39.a: "Coloquem aquele tolo do Farage"
 britain_md.39.b: "Descubram onde Griffin está escondido"
 britain_md.39.c: "Michael Holmes está por aí?"
 britain_md.39.d1: "Os militares nos servirão muito bem"
 british_flavor.1.t: "A Nissan Busca Expandir a Fábrica Perto de Sunderland"
 british_flavor.1.d: "A montadora japonesa Nissan busca expandir sua fábrica em Sunderland para incluir sua nova geração do Almera Hatchback e do Sedã, que logo entrarão à venda. Autoridades do governo temem que a expansão dificulte a competição de fábricas locais e montadoras nacionais."
 british_flavor.1.a: "Aprovar"
 british_flavor.1.b: "Não, não podemos permitir isso"
 british_flavor.2.t: "Extradição de Augusto Pinochet"
 british_flavor.2.d: "Provas médicas concluíram que Augusto Pinochet, o ex-ditador chileno, não está apto a ser julgado. Como resultado dessa investigação, aumentaram os pedidos para deportar o ex-ditador de volta ao seu país natal, o Chile, mas, em resposta à multidão que pede sua deportação, um grupo de pessoas exige a continuação de seu julgamento aqui, no Reino Unido."
 british_flavor.2.a: "Mandá-lo de volta"
 british_flavor.2.b: "Ele fica"
 british_flavor.3.t: "O Solway Harvester Afunda"
 british_flavor.3.d: "Foi relatado que o Solway Harvester afundou ao largo da costa da Ilha de Man em mar bravio. Também se relata que toda a tripulação de 11 pessoas morreu, e diz-se que o navio é recuperável, mas gravemente danificado."
 british_flavor.3.a: "Nos preocuparemos com isso depois"
 british_flavor.3.b: "Recuperar os corpos da tripulação e preparar os funerais"
 british_flavor.4.t: "Voo da Ariana Afghan Airways Sequestrado"
 british_flavor.4.d: "Um grupo de sequestradores no Afeganistão embarcou em um voo e o forçou a ir até [ENG.GetName], fazendo-o pousar em Londres. As autoridades se preparam para enviar uma pequena força para confrontar os sequestradores, mas o que faremos com eles depois não se sabe."
 british_flavor.4.a: "Prendê-los e depois deportá-los"
 british_flavor.4.b: "Prendê-los e depois enviá-los a julgamento!"
 british_flavor.5.t: "Aquisição Hostil do NatWest Bank"
 british_flavor.5.d: "Um banco escocês tenta atualmente uma aquisição hostil de um banco inglês, o NatWest Bank. O Royal Bank of Scotland é atualmente o menor dos dois, e seu sucesso depende em grande parte de outra oferta feita por outro banco, o Bank of Scotland."
 british_flavor.5.a: "Não é problema nosso"
 british_flavor.5.b: "Salvar o banco"
 british_flavor.6.t: "A BMW Anuncia Planos de Vender o Rover Group"
 british_flavor.6.d: "A montadora alemã BMW anunciou planos de vender o Rover Group, com o consórcio Alchemy, sediado em Londres, surgindo como principal candidato à aquisição. Embora essa aquisição possa nos dar mais influência no setor automotivo, acabará resultando em um passivo adicional em um cenário automotivo cada vez mais frágil."
 british_flavor.6.a: "Por nós, tudo bem"
 british_flavor.6.b: "Talvez devessem reconsiderar..."
 british_flavor.7.t: "David Trimble Vence a Eleição de Liderança do Partido Unionista do Ulster"
 british_flavor.7.d: "David Trimble venceu a eleição de liderança do Partido Unionista do Ulster, um partido político pró-União e o terceiro partido mais antigo da Grã-Bretanha. Sua vitória é celebrada entre os conservadores, enquanto os que desejam maior autonomia ficam indiferentes ou chateados com o resultado, como sempre."
 british_flavor.7.a: "Parabenizar o vencedor"
 british_flavor.8.t: "Lei de Imigração e Asilo"
 british_flavor.8.d: "A Lei de Imigração e Asilo está sendo debatida e, se for de fato aprovada, significará que todos os refugiados e migrantes terão direito a vales para cobrir o custo de alimentação e vestuário. Vetá-la pode ser um pouco desumano, mas acabará resultando em custos mais altos para o contribuinte britânico."
 british_flavor.8.a: "Aprovar"
 british_flavor.8.b: "Vetar"
 british_flavor.9.t: "Tumulto Anticapitalista na Parliament Square"
 british_flavor.9.d: "Manifestantes anticapitalistas tomaram as ruas e vandalizaram uma estátua do ex-primeiro-ministro britânico Winston Churchill. Os tumultos estão sendo chamados de tumultos do 'Primeiro de Maio', e as multidões não parecem querer se dispersar tão cedo. Alguns pedem ação, enquanto outros sugerem que se cansarão e irão para casa eventualmente."
 british_flavor.9.a: "Vamos esperar passar"
 british_flavor.9.b: "Enviar equipes de limpeza e a polícia"
 british_flavor.11.t: "A Escócia Busca Revogar a Seção 28"
 british_flavor.11.d: "O Parlamento Escocês busca revogar a controversa seção 28 da Lei do Governo Local de 1988, que impede as autoridades locais de 'promover a homossexualidade'. Permitir que revoguem essa lei pode gerar pedidos para revogá-la também em outros lugares, causando instabilidade política."
 british_flavor.11.a: "Detê-los"
 british_flavor.11.b: "Não nos importamos"
 british_flavor.12.t: "Alex Salmond Renuncia ao SNP"
 british_flavor.12.d: "Alex Salmond deixou seu cargo de liderança no Partido Nacional Escocês por disputas sobre estratégias financeiras internas do partido. Sua renúncia nos deu a oportunidade de atacar o SNP enquanto está fraco, permitindo que ocorra maior divisão em suas fileiras."
 british_flavor.12.a: "Melhor não fazer nada"
 british_flavor.12.b: "Lançar um ataque político"
 british_flavor.13.t: "Os Oitenta Finais"
 british_flavor.13.d: "Como parte do Processo de Paz da Irlanda do Norte, foram feitos preparativos para libertar os últimos 80 prisioneiros mantidos na prisão de Maze. Esses prisioneiros eram membros do Exército de Libertação Nacional Irlandês ou tinham fortes ligações com ele, com um incidente ocorrido em 1997 em que esses prisioneiros mataram a tiros um líder da Força Voluntária Legalista."
 british_flavor.13.a: "Talvez os mantenhamos.."
 british_flavor.13.b: "Tudo bem, então eles saem"
 british_flavor.14.t: "Tumultos Eclodem no Conjunto Paulsgrove"
 british_flavor.14.d: "Tumultos eclodiram no Conjunto Paulsgrove, em Portsmouth, depois que mais de 100 pessoas cercaram um bloco de apartamentos que supostamente abrigava um criminoso condenado por crimes contra crianças. Este é o mais recente caso de violência justiceira contra suspeitos de crimes sexuais desde o início da campanha de 'nomear e envergonhar' da organização News of the World."
 british_flavor.14.a: "Bem, não havia nada que pudéssemos fazer ali"
 british_flavor.14.b: "Enviar a polícia"
 british_flavor.15.t: "Eclodem Protestos por Combustível"
 british_flavor.15.d: "Manifestantes bloquearam a entrada de refinarias de petróleo em protesto contra os altos preços dos combustíveis. Motoristas começaram a comprar combustível em pânico, o que começa a levar a uma escassez nacional de combustível e a uma alta contínua nos preços do petróleo. Relata-se que um grande número de postos de gasolina começa a fechar em consequência da situação, e o governo corre para encontrar uma solução."
 british_flavor.15.a: "Culpar as indústrias de combustíveis fósseis"
 british_flavor.15.b: "Impor cotas rigorosas de uso de petróleo"
 british_flavor.15.c: "§RNão fazer nada§!"
 british_flavor.151.t: "Tumultos Eclodem Diante da Inação do Governo"
 british_flavor.151.d: "Parece que nossa falta de determinação em resolver a escassez de combustível só alimentou mais raiva, com mais e mais pessoas indo às ruas exigindo uma solução do governo. No momento, manifestantes marcham rumo a prédios do governo e vandalizam estátuas, edifícios e símbolos do governo."
 british_flavor.151.a: "Estamos tentando!"
 british_flavor.152.t: "Os Pedidos de Mudança Ficam Mais Fortes"
 british_flavor.152.d: "Parece que a determinação do povo só ficou mais forte, com ódio e raiva voltados contra [ENG.GetLeader] e o establishment governante. Além disso, cresceram os pedidos de realocação de fundos reais para ajudar nos subsídios aos combustíveis, com alguns até exigindo que a monarquia renuncie envergonhada."
 british_flavor.152.a: "Ridículo!"
 british_flavor.153.t: "Câmara dos Comuns Incendiada"
 british_flavor.153.d: "Foi declarado estado de emergência, pois os protestos e tumultos tomaram uma guinada dramática rumo à anarquia total, em vez de desobediência civil organizada. A Câmara dos Comuns foi incendiada por manifestantes furiosos, já que a polícia não conseguiu conter as multidões. Há relatos de que os manifestantes planejam marchar rumo a outras instituições do Estado, mas não está claro qual será o próximo alvo."
 british_flavor.153.a: "Ó Senhor"
 british_flavor.154.t: "A Rainha Abdica!"
 british_flavor.154.d: "Diante da recente insurreição e das contínuas falhas do governo, a Rainha declarou oficialmente que abdicará e planeja se dirigir à nação em um discurso formal mais tarde nesta tarde. Embora muitos lamentem sua saída, ainda não está claro se ela será substituída ou não, já que o ódio à monarquia só cresceu desde o início dos protestos."
 british_flavor.154.a: "Adeus à coroa de joias e ao manto de veludo"
 british_flavor.155.t: "[ENG.GetLeader] Renuncia Sem um Sucessor Claro"
 british_flavor.155.d: "[ENG.GetLeader] renunciou, e seu partido não conseguiu localizar rapidamente um substituto adequado. Esse estado de anarquia deixou o país em desordem, confusão e vulnerável. A Grã-Bretanha nunca enfrentou uma crise assim, e o governo mostrou-se inepto em sua capacidade de resolver qualquer coisa no momento."
 british_flavor.155.a: "O que acontece agora?!"
 british_flavor.156.t: "Militares Tomam o Controle"
 british_flavor.156.d: "As Forças Armadas Britânicas declararam seu envolvimento direto no restabelecimento da autoridade, com um porta-voz anunciando que quem violar o toque de recolher das 16h será 'tratado com rapidez' e declarando que tudo o que pretendem fazer será pelo 'bem maior de todos os britânicos'. Isso provocou indignação entre membros do Partido Trabalhista e do Partido Conservador, que chamam essa tomada de poder de usurpação, com alguns até denunciando a medida como uma mudança radical rumo à ditadura. Ainda assim, os políticos provaram sua incapacidade de resolver assuntos de Estado, sem sucessor claro após a renúncia de [ENG.GetLeader]."
 british_flavor.156.a: "O que o futuro reserva?"
 british_flavor.157.t: "Relatório: Estado das Coisas do Novo Governo"
 british_flavor.157.d: "Endereçado a Sua Excelência, [ENG.GetLeader],\nData:[GetDateText]\n\nAssunto I: Estado da Ordem\nExcelência, as Forças Armadas Britânicas garantiram prontamente o controle das principais áreas urbanas, como Londres, Birmingham, Manchester e Liverpool, entre outras. Por ora, pelo menos, parece que as pessoas começam lentamente a se dispersar das multidões e a voltar para casa, já que começamos a estabelecer subsídios e programas de petróleo financiados pelo governo para ajudar o país a se reerguer.\n\nAssunto II: Pedidos da Esquerda e da Direita\nPolíticos trabalhistas e conservadores começaram a exigir que nossa administração de emergência inicie o processo necessário para restabelecer o governo democrático no país, com alguns políticos declarando a nova administração um símbolo de autoritarismo e excesso militar. Um político trabalhista chegou a dizer que 'os homens com armas precisam ficar em suas bases, e os homens com canetas precisam retomar seu dever como servidores civis'.\n\nAssunto III: Consolidação Adicional\nNossos homens começaram a procurar políticos e burocratas descontentes com o antigo sistema, convocando-os a servir no lugar dos antigos políticos do sistema bipartidário. Tomar a autoridade dessa maneira quase certamente equivalerá a uma espécie de conflito nacional; no entanto, no momento, não temos outro meio de consolidar nosso controle."
 british_flavor.157.a: "Bom saber"
 british_flavor.16.t: "Conservadores em Alta nas Pesquisas"
 british_flavor.16.d: "Apoiadores do Partido Conservador comemoram ao descobrir que os Tories estão dois pontos à frente dos trabalhistas, com 38%, em uma pesquisa de opinião da MORI. É a primeira vez que os conservadores lideram o Partido Trabalhista em uma pesquisa nacional de opinião desde 1993. "
 british_flavor.16.a: "Certo"
 british_flavor.17.t: "Terremoto Abala Warwickshire"
 british_flavor.17.d: "Um terremoto atingiu o condado cerimonial de Warwickshire, causando alguns danos a edifícios próximos. Há pedidos de ajuda do governo para reconstruir alguns dos prédios danificados, mas, ultimamente, o orçamento do governo só tem apertado cada vez mais, dificultando que Westminster chegue a uma conclusão coerente."
 british_flavor.17.a: "Só nos resta torcer para que esteja tudo bem"
 british_flavor.17.b: "Autorizar ajuda do governo"
 british_flavor.18.t: "Donald Dewar É Levado às Pressas ao Hospital"
 british_flavor.18.d: "Donald Dewar, o primeiro-ministro da Escócia, foi levado às pressas ao hospital após uma queda do lado de fora da Bute House, sua residência oficial em Edimburgo. Sua saúde se deteriora rapidamente e há pedidos crescentes de intervenção do governo para trazer equipes médicas avançadas."
 british_flavor.18.a: "Rezar por sua recuperação"
 british_flavor.18.b: "Autorizar o envio de equipes médicas avançadas em seu auxílio"
 United_Kingdom_News.2.t: "Tumultos Eclodem no Reino Unido"
 United_Kingdom_News.2.d: "Após uma escassez de combustível em todo o país e uma disparada nos preços da gasolina, as autoridades britânicas optaram por esperar passar a escassez na esperança de que a economia se recuperasse sozinha naturalmente. No entanto, a situação não melhorou; pelo contrário, apenas piorou, saindo por fim de controle no início desta semana, quando manifestantes incendiaram a Câmara dos Comuns. As autoridades britânicas alegam não ser responsáveis pelas faltas e afirmam que o problema é meramente natural e passará. Um manifestante declarou: 'Não tenho combustível para pôr no meu carro! Não tenho como ir ao trabalho e não tenho aquecimento em casa para manter minha família aquecida; o que está acontecendo hoje é resultado de um sistema e de um governo ineficazes'.\nO governo insiste que está fazendo todo o possível para mitigar a situação, mas, no momento, os protestos não vão a lugar nenhum."
 United_Kingdom_News.2.a: "A raiva explode mais uma vez"
 United_Kingdom_News.3.t: "A Rainha Elizabeth II Abdicou"
 United_Kingdom_News.3.d: "Em razão dos recentes acontecimentos, a Rainha do Reino Unido, Elizabeth II, anunciou sua abdicação oficial do trono. A decisão ocorre após manifestantes passarem a exigir o fim da monarquia, associando-a a símbolos de corrupção, ganância e desperdício de dinheiro. Desta vez, a raiva foi dirigida especificamente à monarquia porque o povo exigia que o dinheiro fosse realocado para subsídios governamentais aos combustíveis, mas seus apelos caíram em ouvidos surdos em Westminster. Não se sabe se outro membro da realeza subirá ao trono, mas, por ora, a monarquia só pode ficar de lado e assistir ao país arder em chamas."
 United_Kingdom_News.3.a: "O trono desmorona"
 United_Kingdom_News.4.t: "Forças Armadas Britânicas Tomam o Controle de Londres"
 United_Kingdom_News.4.d: "As Forças Armadas Britânicas declararam oficialmente seu envolvimento na aplicação do estado de emergência decretado pelo governo, afirmando explicitamente que quem violar o toque de recolher das 16h será tratado 'com rapidez'. A medida vem após semanas de protestos e distúrbios no Reino Unido, com manifestantes tendo incendiado a Câmara dos Comuns num acesso de fúria. As intenções desse novo órgão administrativo ainda não são conhecidas, mas, segundo relatos, ele é composto por homens fortes militares que pretendem reduzir o poder que os partidos Trabalhista e Conservador detêm sobre o establishment britânico."
 United_Kingdom_News.4.a: "Seria este o fim do Reino Unido?"
 ENG_inner_circle.01.t: "A Ascensão de [GetAscendingAdvisorName]"
 ENG_inner_circle.01.desc: "[GetAscendingAdvisorName] demonstrou ambição aguçada e ampliou discretamente sua influência dentro da Casa Real. Contudo, cada passo rumo a maior autoridade provocou objeções de outros cortesãos e figuras de peso, e o palácio agora vibra com a velha disputa por acesso e precedência. A questão é se [GetAscendingAdvisorName] impressionou a Rainha o bastante para conquistar um lugar de verdade no Círculo Íntimo da Rainha."
 ENG_inner_circle.01.a: "Substituir [ENGGetAscendedAdvisorName1]"
 ENG_inner_circle.01.b: "Substituir [ENGGetAscendedAdvisorName2]"
 ENG_inner_circle.01.c: "Substituir [ENGGetAscendedAdvisorName3]"
 ENG_inner_circle.01.d: "[GetAscendingAdvisorName] não é digno."
 ENG_inner_circle_charles.03.t: "A Visita de Harmonia do Príncipe"
 ENG_inner_circle_charles.03.desc: "O Príncipe de Gales chegou em visita, combinando diplomacia cortesã com uma mensagem clara sobre a gestão ambiental. Reuniões com altos funcionários e líderes da sociedade civil focaram em restaurar a confiança, ampliar a cooperação prática e apresentar a resiliência climática como um interesse estratégico compartilhado, e não como mero discurso."
 ENG_inner_circle_charles.03.a: "Que a harmonia guie nossas relações."
 ENG_inner_circle_charles.04.t: "Príncipe Charles Defende a Proteção das Florestas Tropicais"
 ENG_inner_circle_charles.04.desc: "Fomos informados de que Sua Alteza Real o Príncipe Charles, Príncipe de Gales, pediu mais ações globais para proteger as florestas tropicais. Como fundador do Projeto Florestas Tropicais do Príncipe, ele usou sua influência para trabalhar com governos, empresas e a sociedade civil a fim de destacar a importância de deter o desmatamento e preservar esses ecossistemas críticos para a estabilidade climática e a biodiversidade."
 ENG_inner_circle_charles.04.a: "Saudamos o Príncipe Charles pela proteção das florestas tropicais"
 ENG_inner_circle_charles.05.t: "A Diplomacia Ambiental do Príncipe Charles"
 ENG_inner_circle_charles.05.desc: "Recebemos a notícia de que Sua Alteza Real o Príncipe Charles, Príncipe de Gales, concluiu uma turnê de diplomacia ambiental em nosso país, defendendo a cooperação em clima, sustentabilidade e resiliência ecológica. Como uma das vozes mais antigas em favor da ação ambiental ao longo de décadas, o Príncipe destacou a necessidade de esforços coletivos entre nações e setores para enfrentar os desafios ambientais globais e promover soluções sustentáveis."
 ENG_inner_circle_charles.05.a: "Apoiar a sustentabilidade."
 ENG_inner_circle_charles.06.t: "Príncipe Charles Promove a Agricultura Orgânica"
 ENG_inner_circle_charles.06.desc: "Soubemos que Sua Alteza Real o Príncipe Charles, Príncipe de Gales, tomou medidas ativas para apoiar o desenvolvimento da agricultura orgânica e sustentável em nossa nação. Valendo-se de décadas de trabalho pioneiro com métodos de cultivo orgânico em Highgrove e na Duchy Home Farm, ele enfatizou os benefícios ambientais e sociais das práticas orgânicas e incentivou a cooperação em sustentabilidade agrícola."
 ENG_inner_circle_charles.06.a: "Apoiar a agricultura sustentável."
 ENG_inner_circle_andrew.04.t: "Príncipe Andrew em Missão Comercial"
 ENG_inner_circle_andrew.04.desc: "Sua Alteza Real o Príncipe Andrew, atuando como representante comercial do Reino Unido, visitou nossa nação para promover laços comerciais mais fortes e cooperação econômica. Durante sua missão, ele se reuniu com autoridades do governo, líderes empresariais e potenciais investidores para destacar oportunidades de comércio e investimento que beneficiem tanto a nossa economia quanto a do Reino Unido."
 ENG_inner_circle_andrew.04.a: "Bem-vindo"
 ENG_inner_circle_andrew.05.t: "Acordo Comercial Concluído"
 ENG_inner_circle_andrew.05.desc: "Temos o prazer de informar que, após as recentes discussões e negociações lideradas por Sua Alteza Real o Príncipe Andrew, Duque de York, um novo acordo comercial foi concluído entre a nossa nação e o Reino Unido. O pacto abre caminhos para maior intercâmbio comercial, cooperação em indústrias-chave e benefício econômico mútuo, refletindo interesses compartilhados e laços fortalecidos entre as nossas economias."
 ENG_inner_circle_andrew.05.a: "Aceitar a parceria."
 ENG_military.045.t: "Pedido Britânico de Parceria Estratégica"
 ENG_military.045.d: "O Reino Unido, liderado por um monarca constitucional e comprometido com a cooperação ocidental, solicitou formalmente o status de Grande Aliado Extra-OTAN. Concedê-lo fortaleceria as relações transatlânticas e garantiria um parceiro-chave na Europa."
 ENG_military.045.a: "Aprovar o pedido, um aliado valioso."
 ENG_military.045.b: "Recusar, devemos ser cautelosos com tais designações."
 ENG_integrate_ireland: "Integrar a [IRE.GetFlag] Irlanda"
 ENG_integrate_ireland_desc: "Após décadas, finalmente subjugamos e integramos as terras da Irlanda; já é hora de formalizar o processo de integração."
 ENG_a_more_united_kingdom_decisions: "Unindo o Reino"
 ENG_a_more_united_kingdom_decisions_desc: "Após o declínio gradual do Império Britânico e a descolonização durante a Guerra Fria, nosso reino sofreu uma queda constante. Por meios diplomáticos e crescimento hegemônico, poderemos reunir nosso reino mais uma vez.\n\nPasse o mouse sobre o texto colorido para mais informações."
 ENG_core_objectives_text: "Objetivos Principais"
 ENG_econ_hegemony_text: "Hegemonia Econômica"
 ENG_military_hegemony_text: "Hegemonia Militar"
 ENG_political_hegemony_text: "Hegemonia Política"
 ENG_declare_economic_hegemony: "Declarar Hegemonia Econômica"
 ENG_declare_economic_hegemony_desc: "Chegou a hora de nos declararmos o Hegemon Econômico da Commonwealth."
 ENG_declare_military_hegemony: "Declarar Hegemonia Militar"
 ENG_declare_military_hegemony_desc: "Chegou a hora de nos declararmos o Hegemon Militar da Commonwealth."
 ENG_declare_political_hegemony: "Declarar Hegemonia Política"
 ENG_declare_political_hegemony_desc: "Chegou a hora de nos declararmos o Hegemon Político da Commonwealth."
 ENG_fractured_kingdom_united_state_decisions: "A Próxima Era"
 ENG_fractured_kingdom_united_state_decisions_desc: "Com o advento de um novo regime na [ENG.GetFlag] Grã-Bretanha, poderemos finalmente espalhar nossa influência para fora de forma rápida, veloz e agressiva.\n\nPoderemos estabelecer uma organização de EMP sob nosso comando para semear o caos no mundo."
 ENG_grant_land_in_isle_of_man: "Transformar a Ilha de Man"
 ENG_grant_land_in_isle_of_man_desc: "Apesar de sua importância histórica, a Ilha de Man tem muito pouca utilidade para nós hoje, além da extração de recursos. No entanto, se concedermos essas terras à nossa nova organização de EMP, ela poderá liberar todo o seu potencial e usá-las como possível base para operar."
 ENG_devolved_matters: "Assuntos de Devolução"
 ENG_devolved_matters_desc: "Nossos estados constituintes vêm pressionando por um §HEstado Devolvido§! mais amplo, a fim de obterem independência nominal ou total. Os três estados principais são [SCO.GetFlag] §HEscócia§!, [NIR.GetFlag] §HIrlanda do Norte§! e [WAS.GetFlag] §HPaís de Gales§!.\n\nSe a situação de nossa nação piorar, os constituintes tentarão aprovar projetos de lei que reduzam sua dependência, os quais podemos vetar ao risco de aumentar sua agitação.\n\nDecisões ficarão disponíveis conforme a devolução avançar, e mais informações podem ser encontradas na interface de devolução, no canto inferior direito da tela, representada por uma peça de quebra-cabeça.\n\nPróxima Eleição dos Constituintes: [?ROOT.ENG_election_var|Y0] Mês(es)"
 ENG_appease_scotland: "Subsídios Direcionados para a [SCO.GetFlag] Escócia"
 ENG_appease_nireland: "Subsídios Direcionados para a [NIR.GetFlag] Irlanda do Norte"
 ENG_appease_wales: "Subsídios Direcionados para o [WAS.GetFlag] País de Gales"
 ENG_doing_other_decision: "Executando outra decisão"
 ENG_welsh_referendum: "[GetYear] Referendo Galês de Independência [WAS.GetFlag]"
 ENG_welsh_referendum_desc: "O povo [WAS.GetFlag] galês votará em um referendo que determinará seu futuro como nação, constituinte e ator nas Ilhas Britânicas. A campanha corre até o dia da votação, e o resultado será o que a opinião galesa tiver se tornado quando for contado. Westminster pode gastar capital político e dinheiro do Tesouro para influenciá-lo.\n\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
 ENG_release_scotland: "Aprovar o Referendo Escocês de Independência de [GetYear] [SCO.GetFlag]"
 ENG_release_scotland_desc: "'Escócia para sempreeeeeee!'\n\nTalvez tenhamos vetado a tentativa anterior de referendo de forma precipitada; podemos reverter esse erro."
 ENG_release_ireland: "Aprovar o Referendo Norte-Irlandês de Independência de [GetYear] [NIR.GetFlag]"
 ENG_release_ireland_desc: "Talvez tenhamos vetado a tentativa anterior de referendo de forma precipitada; podemos reverter esse erro."
 ENG_release_wales: "Aprovar o Referendo Galês de Independência de [GetYear] [WAS.GetFlag]"
 ENG_release_wales_desc: "Talvez tenhamos vetado a tentativa anterior de referendo de forma precipitada; podemos reverter esse erro."
 decisions_ENG: "Decisões de [ENG.GetName]"
 decisions_ENG_desc: "Aqui o governo pode pôr em marcha missões e tomar medidas decisivas para guiar o rumo da Grã-Bretanha, apoiando a indústria, moldando a pesquisa, fortalecendo as regiões e respondendo às necessidades cambiantes da nação."
 falkland_policy: "Falkland Policy"
 denounce_status_as_the_commonwealth_of_nation_member: "§YDenunciar§! o Status de Membro da Commonwealth das Nações"
 denounce_status_as_the_commonwealth_of_nation_member_desc: "Liberte-se de laços ultrapassados. Denuncie a adesão à Commonwealth e trace um rumo para a verdadeira soberania nacional. Recupere seu destino. Forje seu próprio caminho. A independência o espera."
 ENG_bankers_switch_faction: "Apoiar os Banqueiros Internacionais"
 ENG_bankers_switch_faction_desc: "Reorganizamos nossas alianças internas para favorecer a facção dos Banqueiros Internacionais, inclinando a política para as finanças globais, os fluxos abertos de capital e uma economia baseada em serviços."
 ENG_scottish_parliament: "Parlamento Escocês [SCO.GetFlag]"
 ENG_scottish_parliament_desc: "Os membros do Parlamento Escocês [SCO.GetFlag] não são, nem sempre serão, leais a Londres. Haverá Parlamentares §HPró-Independência§! que lutarão pela criação de uma [SCO.GetFlag] Escócia autônoma ou independente.\n\nSe os Parlamentares §HPró-Independência§! tiverem a maioria, começarão a aprovar projetos de lei que lhes concedam mais autonomia, os quais podemos aprovar ou vetar. Se aceitarmos consistentemente seus pedidos, teremos um estado constituinte [SCO.GetFlag] escocês amigável e leal. Mas se os negarmos repetidamente, sua §HAgitação§! pode resultar em uma situação muito bagunçada. Se a [SCO.GetFlag] §HAgitação Escocesa§! chegar a §H100§!, eles exigirão independência.\n\n§HCadeiras Pró-Independência§!: [?ENG_scottish_nationalists]/129\n\n[SCO.GetFlag] §HAgitação Escocesa§!: [?ENG_scottish_agitation]"
 ENG_invest_northern_ireland_mission: "Retomada da Construção no Investimento na Irlanda do Norte"
 ENG_ireland_border_cooperation: "Tratado de Cooperação na Fronteira da Irlanda"
 ENG_clydach_nickel_decision: "Modernizar a Refinaria de Níquel de Clydach"
 ENG_clydach_nickel_decision_desc: "Modernizamos a refinaria de níquel de Clydach, no sul do País de Gales, ampliando a capacidade de metais para baterias e ligas de alta qualidade para fortalecer nosso suprimento de minerais críticos."
 ENG_alloys_modernisation: "Modernizar a Produção de Ligas"
 ENG_alloys_modernisation_desc: "Investimos em novas fundições e linhas de laminação para ligas especiais, melhorando a qualidade e o rendimento de tudo, de turbinas e blindagens a componentes de alto desempenho."
 ENG_ellesmere_port_decision: "Fábrica de Ímãs de Terras Raras de Ellesmere Port"
 ENG_ellesmere_port_decision_desc: "Expandimos o processamento de terras raras em Ellesmere Port, produzindo ímãs de alta qualidade para turbinas eólicas, veículos elétricos e sistemas de defesa avançados."
 ENG_shetland_hydrocarbon_decision: "Impulso aos Hidrocarbonetos a Oeste de Shetland"
 ENG_shetland_hydrocarbon_decision_desc: "Intensificamos o desenvolvimento dos campos de petróleo e gás a oeste de Shetland, explorando reservas em águas profundas para aumentar os hidrocarbonetos nacionais e a segurança energética."
 ENG_rosebank_field_decision: "Desenvolver o Campo de Petróleo de Rosebank"
 ENG_rosebank_field_decision_desc: "Damos sinal verde ao desenvolvimento completo do campo de petróleo e gás de Rosebank, pondo em operação novas plataformas offshore e oleodutos para fortalecer nossos suprimentos de energia a longo prazo."
 ENG_cambo_offshore_decision: "Desenvolver o Campo Offshore de Cambo"
 ENG_cambo_offshore_decision_desc: "Avançamos com o projeto offshore de Cambo, adicionando novos poços e conexões submarinas para colocar suas reservas de petróleo e gás em produção."
 ENG_hornsea_wind_farm_decision: "Expandir o Parque Eólico de Hornsea"
 ENG_hornsea_wind_farm_decision_desc: "Apoiamos novas fases da zona eólica offshore de Hornsea, no Mar do Norte, adicionando turbinas e conexões à rede para fornecer mais energia limpa a partir do maior parque eólico do mundo."
 ENG_drakeland_tungsten_decision: "Reabrir a Mina de Tungstênio de Drakelands"
 ENG_drakeland_tungsten_decision_desc: "Reiniciamos a mina de Drakelands, perto de Plymouth, recolocando em operação a produção de estanho e tungstênio para fortalecer o suprimento britânico de metais de tecnologia crítica."
 ENG_south_crofty_tin_decision: "Reabrir a Mina de Estanho de South Crofty"
 ENG_south_crofty_tin_decision_desc: "Financiamos a reabertura de South Crofty, na Cornualha, revivendo a mineração profunda de estanho e adicionando uma fonte doméstica estável de minério de alta qualidade para nossa indústria."
 ENG_scottish_industry_mission: "Bonança da Indústria Escocesa"
 ENG_scottish_industry_mission_desc: "Nossos investimentos no aço e na indústria pesada escoceses podem revelar novas jazidas, contratos e projetos paralelos. Há uma boa chance de que a atividade renovada nas usinas e estaleiros revele recursos extras que podemos colocar em produção."
 ENG_celsa_steel_mission: "Revisão da Produção de Aço da Celsa"
 ENG_celsa_steel_mission_desc: "A cada ano revisamos a usina da Celsa em Cardiff para ver se novos pedidos, ganhos de eficiência ou fluxos de sucata justificam mais um passo na produção de aço."
 ENG_roysth_naval_port_decision: "Expandir o Porto Naval de Rosyth"
 ENG_roysth_naval_port_decision_desc: "Expandimos as docas e as instalações de apoio em Rosyth, transformando o estuário de Forth em uma base mais forte para reparos, apoio e a futura construção de navios de guerra."
 ENG_expand_belfast_decision: "Expandir o Parque Industrial de Belfast"
 ENG_expand_belfast_decision_desc: "Limpamos e dotamos de infraestrutura novos terrenos em torno das docas e dos arredores de Belfast, abrindo espaço extra para fábricas, estaleiros e escritórios em toda a Irlanda do Norte."
 ENG_highland_main_line_decision: "Modernizar a Highland Main Line"
 ENG_highland_main_line_decision_desc: "Modernizamos a Highland Main Line entre Perth e Inverness, reduzindo o tempo de viagem e dando às cidades ao longo da rota um impulso muito necessário em conectividade e produtividade."
 ENG_titanic_quarter_decision: "Desenvolver o Titanic Quarter"
 ENG_titanic_quarter_decision_desc: "Redesenvolvemos os antigos terrenos do estaleiro de Belfast no Titanic Quarter, misturando escritórios, estúdios e indústria à beira-mar para dar nova vida ao antigo sítio da Harland & Wolff."
 ENG_productivity_gap_mission: "Perdendo Produtividade"
 ENG_hs2_mission: "Construção da High-Speed 2"
 ENG_northen_powerhouse_mission: "Construção da Northen Powerhouse Rail"
 ENG_build_london: "Desenvolvendo a Grande Londres"
 ENG_build_london_desc: "Prometemos aos nossos constituintes da região da Grande Londres que reformas estão a caminho. E, como tal, devemos cumprir essa promessa."
 ENG_promise_labour: "Promessa aos Sindicatos Trabalhistas"
 ENG_promise_labour_desc: "Fizemos uma promessa aos sindicatos trabalhistas, e devemos agir de acordo com ela."
 ENG_promise_military: "Promessa ao Complexo Militar-Industrial"
 ENG_promise_military_desc: "Fizemos uma promessa ao complexo militar-industrial, e devemos agir de acordo com ela."
 ENG_promise_fossil_fuel: "Promessa às Indústrias de Combustíveis Fósseis"
 ENG_promise_fossil_fuel_desc: "Fizemos uma promessa às indústrias de combustíveis fósseis, e devemos agir de acordo com ela."
 ENG_monarchy_decision_category: "Casa de Windsor"
 ENG_monarchy_decision_category_desc: "A Casa de Windsor reina desde 1917, conduzindo a monarquia moderna através da guerra, de mudanças sociais e das pressões de um novo século. Ela está no centro da vida pública britânica, uma dinastia entrelaçada com a cerimônia, o serviço e as rotinas silenciosas que mantêm o reino unido. Seus membros exercem influência por meio de patrocínio, visitas e intervenções discretas, alcançando instituições de caridade, a diplomacia e as forças armadas de maneiras que a política sozinha não consegue. Aqui são exibidas as iniciativas da Família Real, mostrando quais projetos cada membro pode empreender e o que sua presença pode colocar em movimento."
 ENG_monarchy: "Casa de Windsor"
 ENG_charles_youth_sustainability_decision: "Capacitar a Juventude para a Sustentabilidade"
 ENG_charles_youth_sustainability_decision_desc: "Sua Alteza Real o Príncipe Charles lançará um programa para apoiar jovens na liderança de iniciativas sustentáveis e favoráveis ao clima. Valendo-se de décadas de trabalho com instituições de caridade juvenis e causas ambientais, o Príncipe de Gales promoverá educação, desenvolvimento de habilidades e empreendedorismo alinhados à resiliência ecológica. Este programa reconhece o papel vital das gerações mais jovens na construção de um futuro mais sustentável."
 ENG_charles_sustainable_urban_planning_decision: "Promover o Planejamento Urbano Sustentável"
 ENG_charles_sustainable_urban_planning_decision_desc: "Sua Alteza Real o Príncipe Charles defenderá o planejamento urbano e comunitário sustentável, baseado em princípios de projeto holísticos que priorizam as pessoas, o meio ambiente e a resiliência de longo prazo. Valendo-se de sua antiga defesa da construção de comunidades que respeitem o clima e o contexto cultural, este programa promoverá abordagens tradicionais e ambientalmente sensíveis para arquitetura, infraestrutura e uso do solo."
 ENG_charles_organic_agriculture_decision: "Defender a Agricultura Orgânica e Sustentável"
 ENG_charles_organic_agriculture_decision_desc: "Sua Alteza Real o Príncipe Charles usará sua influência para defender métodos de cultivo orgânicos e sustentáveis em comunidades rurais e globais. Valendo-se de décadas de compromisso com a gestão ecológica e a agricultura regenerativa, o Príncipe promoverá práticas que fortalecem a saúde do solo, apoiam as fazendas familiares e reduzem o impacto ambiental."
 ENG_charles_environmental_diplomacy_tour_decision: "Turnê de Diplomacia Ambiental"
 ENG_charles_environmental_diplomacy_tour_decision_desc: "Sua Alteza Real o Príncipe Charles embarcará em uma turnê internacional de diplomacia ambiental para promover a cooperação em iniciativas de sustentabilidade e clima. Ao longo de suas décadas de serviço como Príncipe de Gales, ele visitou numerosas nações e dialogou com líderes e comunidades para incentivar a ação contra a mudança climática, a proteção das florestas tropicais e o desenvolvimento sustentável. Esta turnê buscará fortalecer parcerias globais e destacar compromissos compartilhados na proteção do mundo natural."
 ENG_charles_rainforest_help_decision: "Apoiar a Proteção Global das Florestas Tropicais"
 ENG_charles_rainforest_help_decision_desc: "Sua Alteza Real o Príncipe Charles liderará um programa para promover a ação global contra a destruição das florestas tropicais. Como fundador do Projeto Florestas Tropicais do Príncipe, ele trabalhará com governos, organizações e a sociedade civil para destacar a importância de preservar as florestas tropicais e seu papel no combate à mudança climática."
 ENG_charles_charities_network_decision: "Ativar a Rede de Instituições de Caridade do Príncipe"
 ENG_charles_charities_network_decision_desc: "Sua Alteza Real o Príncipe Charles ativará sua extensa rede de organizações de caridade para apoiar causas sociais, educacionais e ambientais no país e no exterior. Como presidente de The Prince's Charities, um grupo de organizações fundadas ou patrocinadas pelo Príncipe de Gales, ele alavancará sua experiência coletiva para construir comunidades sustentáveis, promover oportunidades e melhorar o bem-estar em várias regiões."
 ENG_charles_harmony_tour_decision: "Realizar uma Turnê de Diplomacia da Harmonia"
 ENG_charles_harmony_tour_decision_desc: "Sua Alteza Real o Príncipe Charles embarcará em uma turnê internacional para promover sua filosofia de Harmonia e incentivar a cooperação em questões ambientais e de sustentabilidade. Ao longo de suas décadas de serviço como Príncipe de Gales, ele usou consistentemente sua influência para destacar a necessidade de ação climática, proteção das florestas tropicais e desenvolvimento sustentável, e esta turnê buscará fortalecer parcerias globais em torno desses objetivos comuns."
 ENG_andrew_naval_haritage_decision: "Abraçar a Herança Naval"
 ENG_andrew_naval_haritage_decision_desc: "O Príncipe Andrew se valerá de sua longa carreira naval para destacar as tradições e o serviço marítimo de sua nação. Tendo servido como piloto de helicóptero, instrutor e comandante da Marinha Real, com serviço ativo no conflito das Malvinas, ele incentivará o respeito pela herança naval e fomentará a cooperação com frotas aliadas e instituições de treinamento marítimo ao redor do mundo."
 ENG_andrew_trade_representive_decision: "Missão de Representante Comercial"
 ENG_andrew_trade_representive_decision_desc: "O Príncipe Andrew embarcará em uma missão de representante comercial para promover os interesses comerciais britânicos no exterior. Valendo-se de sua experiência como Representante Especial do Reino Unido para Comércio e Investimento Internacionais, ele dialogará com governos estrangeiros, líderes empresariais e investidores para destacar oportunidades de exportação e investimento externo do Reino Unido, fortalecendo laços econômicos e fomentando a cooperação em comércio e empreendimentos."
 ENG_andrew_emerging_trade_agreement_decision: "Buscar Acordos Comerciais Emergentes"
 ENG_andrew_emerging_trade_agreement_decision_desc: "O Príncipe Andrew liderará os esforços para buscar acordos comerciais e parcerias empresariais em mercados globais emergentes. Valendo-se de sua vasta experiência representando interesses comerciais britânicos no exterior, ele procurará abrir oportunidades de exportação, parcerias e investimento com economias em desenvolvimento que demonstrem alto potencial de crescimento e cooperação futuros."
 ENG_andrew_emerging_economy_benefits_decision: "Alavancar Parcerias com Economias Emergentes"
 ENG_andrew_emerging_economy_benefits_decision_desc: "O Príncipe Andrew se concentrará em fortalecer parcerias com economias emergentes para ampliar oportunidades de comércio, investimento e crescimento econômico compartilhado. Valendo-se de sua vasta experiência na promoção de interesses comerciais britânicos pelo mundo, esta iniciativa visa atrair investimento e expertise de mercados em rápido desenvolvimento, impulsionar a produtividade interna e fomentar um ambiente de negócios mais dinâmico."
 ENG_andrew_digital_enterprise_decision: "Iniciativa de Empreendimento Digital"
 ENG_andrew_digital_enterprise_decision_desc: "O Príncipe Andrew lançará uma iniciativa de empreendimento digital para promover habilidades digitais e o empreendedorismo em toda a nação. Valendo-se de seu trabalho com prêmios de empreendimento digital que ajudaram pessoas a desenvolver competências online, técnicas e empresariais, este programa visa apoiar aspirantes a inovadores digitais, incentivar a alfabetização tecnológica e construir uma base mais sólida para a economia digital."
 ENG_anne_national_charity_decision: "Instituições de Caridade Nacionais da Princesa Real"
 ENG_anne_national_charity_decision_desc: "A Princesa Real ampliará e coordenará seus patrocínios nacionais para buscar resultados práticos em vez de oportunidades para fotos. Campanhas de arrecadação, mobilização de voluntários e atenção pública serão direcionadas para onde a capacidade está se esgotando.."
 ENG_anne_carers_promotion_decision: "Campanha de Reconhecimento dos Cuidadores"
 ENG_anne_carers_promotion_decision_desc: "Anne colocará os cuidadores não remunerados no centro da atenção nacional, pressionando as instituições a tratar o cuidado como serviço essencial e não como um fardo privado. A campanha eleva o apoio ao descanso, a flexibilidade no trabalho e o respeito público por meio do patrocínio real e de uma visibilidade incansável."
 ENG_anne_military_readiness_decision: "Padrões de Prontidão"
 ENG_anne_military_readiness_decision_desc: "A Princesa Real usará suas nomeações militares para exigir profissionalismo, disciplina de treinamento e as rotinas pouco glamorosas que mantêm as unidades prontas para o emprego. Inspeções, exercícios e o acompanhamento logístico serão impostos como a medida de seriedade."
 ENG_anne_navy_readiness_decision: "Inspeções de Prontidão da Frota"
 ENG_anne_navy_readiness_decision_desc: "A Marinha Real será pressionada a provar que pode navegar, lutar e se sustentar sob pressão. A presença de Anne impõe padrões: manutenção, proficiência das tripulações e ritmo operacional serão tratados como inegociáveis."
 ENG_anne_tourism_decision: "Um Impulso ao Turismo Real"
 ENG_anne_tourism_decision_desc: "A reputação da Grã-Bretanha é um ativo, e a Princesa Real o gastará com propósito. Um impulso focado ao turismo destacará o patrimônio, eventos e economias locais que precisam de demanda, transformando compromissos reais em reservas e investimentos."
 ENG_edward_beach_youth_decision: "Alcance à Juventude Costeira"
 ENG_edward_beach_youth_decision_desc: "O Conde de Wessex levará o trabalho da Coroa com a juventude ao litoral, usando visitas, programas de premiação e parcerias locais para atrair jovens para a capacitação e o serviço. A mensagem é prática: confiança, disciplina e um caminho a seguir. "
 ENG_edward_global_youth_decision: "Engajamento Global da Juventude"
 ENG_edward_global_youth_decision_desc: "Edward estenderá o engajamento da juventude para além da Grã-Bretanha, fortalecendo laços por meio de intercâmbios, treinamento e projetos cívicos compartilhados com parceiros no exterior."
 ENG_edward_arts_culture_patronage_decision: "Patrocínio das Artes e da Cultura"
 ENG_edward_arts_culture_patronage_decision_desc: "A Coroa defenderá o setor artístico e cultural da Grã-Bretanha como identidade e como influência estratégica. O patrocínio real aumentará a visibilidade, liberará financiamento e protegerá as instituições que moldam a narrativa nacional dentro e fora do país."
 ENG_edward_production_guild_decision: "Apoiar as Guildas de Produção"
 ENG_edward_production_guild_decision_desc: "As guildas e os ofícios produtivos qualificados da Grã-Bretanha são a espinha dorsal da qualidade e da força exportadora. Edward apoiará as guildas de produção por meio de reconhecimento, ligações com a formação e coordenação setorial que mantêm vivos os ofícios e abertos os canais de fornecimento. "
 ENG_edward_veteran_support_decision: "Apoio aos Veteranos de Wessex"
 ENG_edward_veteran_support_decision_desc: "O serviço não termina com a baixa, e a Coroa não tratará os veteranos como algo secundário. O Conde de Wessex coordenará instituições de caridade, empregadores e autoridades locais para melhorar o apoio à transição, a estabilidade habitacional e os caminhos de emprego. "
 ENG_philip_award_medal_decision: "Entregar a Medalha Príncipe Philip"
 ENG_philip_award_medal_decision_desc: "O Príncipe Philip embarcará em sua própria missão para entregar a Medalha Príncipe Philip a um engenheiro de destaque com impacto global excepcional. Este prêmio reconhece a realização notável em prática de engenharia e inovação, sob seu patrocínio pessoal."
 ENG_philip_award_expansion_decision: "Expandir os Prêmios da Juventude do Duque"
 ENG_philip_award_expansion_decision_desc: "O Príncipe Philip viajará para lançar uma expansão do Prêmio Duque de Edimburgo, com o objetivo de abrir este programa juvenil a um público internacional mais amplo. Seus esforços buscam fortalecer a resiliência da juventude e as habilidades cívicas em muitas nações."
 ENG_philip_trust_funds_grants_decision: "Ativar as Bolsas do Fundo Príncipe Philip"
 ENG_philip_trust_funds_grants_decision_desc: "O Príncipe Philip supervisionará pessoalmente o desembolso de subvenções do Fundo Príncipe Philip a projetos comunitários e educacionais locais. Seu envolvimento direto garante apoio a iniciativas que melhoram o lazer, o aprendizado e a vida cívica."
 ENG_philip_faith_conservation_decision: "Lançar a Iniciativa Fé e Conservação"
 ENG_philip_faith_conservation_decision_desc: "O Príncipe Philip embarcará em um programa para unir comunidades religiosas e grupos ambientais na gestão conjunta da natureza. Ele pretende mobilizar recursos morais e comunitários em prol de metas de conservação sustentável."
 ENG_philip_innovation_recognition_decision: "Estabelecer o Reconhecimento Nacional da Inovação"
 ENG_philip_innovation_recognition_decision_desc: "O Príncipe Philip iniciará um programa nacional para premiar o design industrial, a ciência e a resolução prática de problemas de destaque. Sua iniciativa realça a engenhosidade como pilar do crescimento econômico e do sucesso nacional."
 ENG_william_air_ambulance_decision: "Cumprir um Turno de Ambulância Aérea"
 ENG_william_air_ambulance_decision_desc: "O Príncipe William parte para mais um turno de ambulância aérea, pilotando missões de emergência e encontrando as equipes em terra."
 ENG_william_mental_health_at_work_decision: "Saúde Mental no Trabalho"
 ENG_william_mental_health_at_work_decision_desc: "O Príncipe William parte para mobilizar empregadores e instituições de caridade em torno de uma campanha de saúde mental no trabalho."
 ENG_william_step_into_health_decision: "Campanha Step into Health"
 ENG_william_step_into_health_decision_desc: "O Príncipe William viaja pelo país para apoiar o Step into Health e abrir caminhos no NHS para veteranos e famílias de militares."
 ENG_william_early_years_forum_decision: "Convocar o Fórum da Primeira Infância"
 ENG_william_early_years_forum_decision_desc: "O Príncipe William convoca um fórum sobre a Primeira Infância para reunir especialistas, instituições de caridade e empresas na mesma sala."
 ENG_william_chogm_youth_decision: "Mensagem à Juventude da CHOGM"
 ENG_william_chogm_youth_decision_desc: "O Príncipe William participa de uma sessão de juventude da Reunião de Chefes de Governo da Commonwealth (CHOGM) para sinalizar que a próxima geração importa para o futuro da Commonwealth."
 ENG_seize_sierra_leone_resources: "Explorar [SIE.GetFlag] Serra Leoa"
 ENG_seize_sierra_leone_resources_desc: "É hora de tirarmos algo da Operação Barras. Tomaremos recursos vitais em Serra Leoa e estabeleceremos influência econômica por um período de 500 dias."
 ENG_war_for_delta: "Guerra pelo Delta"
 ENG_war_for_delta_desc: "Talvez tenhamos pressionado os nigerianos um pouco demais, permitindo que seu ego suprima qualquer receio que tenham de enfrentar nossas forças. Mesmo assim, teremos de tomar a capital deles para mostrar quem realmente manda por aqui."
 ENG_end_of_the_world: "Conquistando o Fim do Mundo"
 ENG_end_of_the_world_desc: "A Terra do Fogo, também chamada de 'O Fim do Mundo', é um arquipélago importante e a porta de entrada para a Antártida. Tomar esse local vital poderia trazer enormes benefícios para a nação como um todo, a ponto de estarmos dispostos a lutar por ele."
 ENG_operation_eastern_divide: "Operação Divisor Oriental"
 ENG_operation_eastern_divide_desc: "Os egípcios não atenderam aos nossos pedidos de acesso justo e igualitário através de Suez e, por isso, não nos restou outra escolha senão recorrer à ação militar."
 ENG_a_more_united_kingdom: "Um Reino Mais Unido"
 ENG_a_more_united_kingdom_desc: "Embora nosso estado esteja unido tal como está, partes de nosso reino se fragmentaram e se separaram em estados independentes. Se quisermos ser verdadeiramente um Reino Unido, precisamos reunir os estados da Commonwealth de todos os cantos do mundo."
 ENG_fractured_kingdom_united_state: "Reino Fraturado, Estado Unido"
 ENG_fractured_kingdom_united_state_desc: "§R'Cidadão, não súdito'§!\nEnquanto a monarquia e o regime anterior desapareciam no esquecimento, o estado só se fortaleceu. Chegou a hora de assumirmos uma postura mais assertiva e dominante no cenário mundial e, por fim, punir aqueles que saquearam esta terra por séculos."
 ENG_deeper_commonwealth_integration: "Integração Mais Profunda da Commonwealth"
 ENG_deeper_commonwealth_integration_desc: "Se quisermos nos tornar um estado verdadeiramente unido, primeiro teremos de trabalhar para convencer aqueles que desejamos integrar de que somos um anfitrião adequado. Só então poderemos dar os próximos passos."
 ENG_sovereignty_above_all: "Soberania Acima de Tudo"
 ENG_sovereignty_above_all_desc: "Nada importa mais do que a capacidade de nossos administradores determinarem o futuro de nosso povo. Nenhum outro estado além do nosso deve ter voz sobre como conduzimos as coisas."
 ENG_establishing_new_leadership: "Estabelecendo o Novo Regime"
 ENG_establishing_new_leadership_desc: "Antes de podermos pôr mãos à obra, teremos de estabelecer um novo regime. Será necessário um desenraizamento social, e devemos começar a planejar uma nova autoridade de transição que assuma o comando em partes do país para tornar o processo mais suave."
 ENG_two_way_concessions: "Concessões Mútuas"
 ENG_two_way_concessions_desc: "Não podemos esperar avanços num acordo sobre a devolução se apenas um lado se esforçar. Faremos algumas concessões e esperamos que o outro lado, na Escócia, faça o mesmo."
 ENG_uniting_the_isle: "Unindo a Ilha"
 ENG_uniting_the_isle_desc: "Os irlandeses são a causa de grande parte de nossos problemas, desde atiçar tensões até fazer partidos políticos defenderem o separatismo norte-irlandês. Já está mais que na hora de entrarmos e darmos uma lição neles."
 ENG_revolution_not_devolution: "Revolução, Não Devolução"
 ENG_revolution_not_devolution_desc: "Para ter um estado verdadeiramente unido, devemos primeiro destruir a causa da devolução. Precisamos de uma revolução nacional, não de devolução!"
 ENG_bring_in_canada: "Trazer o Canadá"
 ENG_bring_in_canada_desc: "Devemos estender a mão ao Canadá, o maior membro da Commonwealth em extensão territorial. Nossos amigos canadenses mantiveram uma estreita proximidade ao longo do tempo, então não deve ser muito difícil trazê-los a bordo."
 ENG_the_realm_of_britain: "O Reino da Grã-Bretanha"
 ENG_the_realm_of_britain_desc: "O Reino da Grã-Bretanha é algo que jamais poderá ser despedaçado, com o espírito do povo britânico perseverando em tempos de especial dificuldade."
 ENG_glory_of_pax_britannica: "A Glória da Pax Britannica"
 ENG_glory_of_pax_britannica_desc: "Nosso passado é glorioso, e alguns dizem que o passado não se foi de verdade, mas é antes um prenúncio do que está por vir. Precisamos realizar os sonhos de nossos antepassados e restaurar a glória da Pax Britannica!"
 ENG_australian_outreach: "Aproximação com a Austrália"
 ENG_australian_outreach_desc: "Não podemos esquecer os sacrifícios que os australianos fizeram ao longo da história por nossa causa. Portanto, é imperativo que os convidemos a se juntar a nós no futuro que está por vir."
 ENG_new_zealands_offer: "Oferta da Nova Zelândia"
 ENG_new_zealands_offer_desc: "O povo kiwi há muito tempo permanece um aliado firme nosso e, nas boas e nas más, ficou ao nosso lado. É apenas apropriado que lhes peçamos que se juntem a nós."
 ENG_fracture_nato_unity: "Fraturar a Unidade da OTAN"
 ENG_fracture_nato_unity_desc: "É verdade que nos beneficiamos da segurança da OTAN por muito tempo, mas já não é mais o caso. Devemos entender que nossos antigos amigos não querem nada além de dividir e fraturar nosso estado, e nosso povo precisa ser alertado disso."
 ENG_end_eastern_suffering: "Pôr Fim ao Sofrimento do Leste"
 ENG_end_eastern_suffering_desc: "O patético aglomerado de estados da Europa Oriental, liderados pela Rússia, sofre um declínio lento e terrível. É melhor que entremos e estabeleçamos verdadeira prosperidade e ordem naquela região."
 ENG_declare_the_commonwealth: "Declarar a Commonwealth"
 ENG_declare_the_commonwealth_desc: "Agora que todas as terras (as importantes, pelo menos) da Commonwealth se juntaram a nós sob uma só bandeira, é apropriado declararmos ao mundo que a Federação da Commonwealth chegou, e que veio para ficar."
 ENG_active_resource_project: "§YProjeto de Minerais Críticos Ativo§!"
 ENG_active_productivity_project: "§YProjeto Nacional de Produtividade Ativo§!"
 ENG_ucl_east_campus: "Campus UCL East"
 ENG_mechanic_menu_explanation: "Devolução"
 ENG_devolution_HEADER_TITTLE_LOC: "Assuntos de Devolução"
 ENG_mechanic_menu_explanation_2: "A devolução nos permite devolver parte do poder às mãos de nossos constituintes. Podemos geri-los clicando no respectivo estado. Cada constituinte terá um §CParlamento§!, um nível de §RAgitação§! e um nível de §GDependência§!. Passe o mouse sobre o botão de §Ginfo§! para uma explicação detalhada."
 ENG_parliament_gui_tooltip: "Cada constituinte terá seu próprio Parlamento. Dependendo da agitação de cada constituinte, o povo pode ser mais ou menos propenso a votar em um parlamentar Pró-Independência. No entanto, uma vez que um parlamentar Pró-Independência assume o cargo, será muito improvável que seja destituído pelo voto. Se os parlamentares Pró-Independência se tornarem maioria, eles poderão começar a pressionar por projetos de lei que reduzam sua dependência e, em algum momento, poderão exigir um referendo.\n\nNossos súditos terão uma opinião sobre nós, e isso é representado por sua Agitação. Um constituinte pode ficar mais Agitado dependendo do nosso partido político, do número de projetos de lei que vetamos ou de aumentarmos à força sua dependência. A Agitação pode ser afetada por certos eventos, decisões ou focos. Um constituinte que depende muito de Westminster se acalmará por conta própria a cada mês, enquanto um que já não precisa de nós ficará cada vez mais irritado.\n\nA Dependência determina o nível em que um constituinte consegue se virar sozinho. Se a Dependência for baixa, ele poderá começar a pressionar por mais liberdades, já que consegue se virar muito bem sem o Reino. Teremos a oportunidade de reduzir ou aumentar sua dependência com base nos eventos que recebermos e nos focos que adotarmos.\n\nNacionalismo, Agitação e a parcela de autossuficiência se combinam em uma pontuação de Pressão por Independência. Quando um constituinte tem maioria Pró-Independência e sua pressão ultrapassa §R60§!, uma campanha de referendo começa. Temos então um ano para trazer essa pressão de volta abaixo de §G50§! antes que o referendo seja de fato convocado. Apenas um constituinte pode conduzir uma campanha por vez, e nenhum outro poderá fazê-lo nos cinco anos seguintes.\n\nA Tensão Norte-Irlandesa representa a tensão entre os protestantes unionistas e os católicos republicanos. As decisões que tomamos podem acirrar as tensões, e se elas atingirem 50% haverá confrontos violentos ocasionais. Se as tensões continuarem a crescer além de 50%, a frequência dos confrontos aumentará."
 ENG_dependency_gui_tooltip2: "A Dependência determina o nível em que um constituinte consegue se virar sozinho. Se a Dependência for baixa, ele poderá começar a pressionar por mais liberdades, já que consegue se virar muito bem sem o Reino. Teremos a oportunidade de reduzir ou aumentar sua dependência com base nos eventos que recebermos e nos focos que adotarmos."
 ENG_parliament_gui_tooltip2: "Cada constituinte terá seu próprio Parlamento. Dependendo da agitação de cada constituinte, o povo pode ser mais ou menos propenso a votar em um parlamentar Pró-Independência. No entanto, uma vez que um parlamentar Pró-Independência assume o cargo, será muito improvável que seja destituído pelo voto. Se os parlamentares Pró-Independência se tornarem maioria, eles poderão começar a pressionar por projetos de lei que reduzam sua dependência e, em algum momento, poderão exigir um referendo."
 ENG_agitation_gui_tooltip2: "Nossos súditos terão uma opinião sobre nós, e isso é representado por sua Agitação. Um constituinte pode ficar mais Agitado dependendo do nosso partido político, do número de projetos de lei que vetamos ou de aumentarmos à força sua dependência. A Agitação pode ser afetada por certos eventos, decisões ou focos. Um constituinte que depende muito de Westminster se acalmará por conta própria a cada mês, enquanto um que já não precisa de nós ficará cada vez mais irritado. A Agitação alimenta a pontuação de Pressão por Independência, que decide se uma campanha de referendo começa."
 ENG_irish_tension_tooltip: "A Tensão Norte-Irlandesa representa a tensão entre os protestantes unionistas e os católicos republicanos. As decisões que tomamos podem acirrar as tensões, e se elas atingirem 50% haverá confrontos violentos ocasionais. Se as tensões continuarem a crescer além de 50%, a frequência dos confrontos aumentará."
