 UKR_storage_item_s75_tt: "§YС-75 «Двина»§!\n\n\n£SOV_MISSILE_1965_SAM\n\n\n\nПолков на дежурстве: §Y[?ukraine_s75_regiments|0]§!\nПоколение: зенитный ракетный комплекс первого поколения, на вооружении с 1957 года.\nТип техники: §YЗенитный ракетный полк§! (один уровень ПВО в своей области)\n\nПолки на дежурстве:[UKR_s75_line_700][UKR_s75_line_1110][UKR_s75_line_1091][UKR_s75_line_1090][UKR_s75_line_693][UKR_s75_line_694][UKR_s75_line_669]\n\nНе на хранении: эти полки всё ещё защищают наши города. Продажа или утилизация полка убирает его уровень ПВО, поэтому они не входят в итог раздела."
