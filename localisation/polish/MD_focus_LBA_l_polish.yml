 LBA_geopolitical_thinker_idea_version: "Myśliciel geopolityczny"
 LBA_democratic_reformer_idea_version: "Demokratyczny Reformator"
 LBA_national_security_advisor_idea_version: "Doradca ds. Bezpieczeństwa Narodowego"
 LBA_claudia_schiffer_of_north_africa_idea_version: "Claudia Schiffer z Afryki Północnej"
