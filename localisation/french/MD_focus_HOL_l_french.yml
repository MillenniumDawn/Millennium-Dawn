 voc_influence_saf: "£voc_icon Influence de la VOC en §Y[SAF.GetNameWithFlag]§!"
 HOL_cape_port_investment: "Investissements portuaires néerlandais"
 HOL_cape_port_investment_tt: "Si les §Y[HOL.GetNameWithFlag]§! §Rdéclarent la guerre§! à §Y[SAF.GetNameWithFlag]§!, cette province sera immédiatement contrôlée par §Y[HOL.GetNameWithFlag]§!"
