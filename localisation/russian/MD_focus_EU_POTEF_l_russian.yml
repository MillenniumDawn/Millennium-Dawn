 breach_of_Sino_British_Joint_Declaration: "Нарушение Китайско-британской декларации"
 EU_POTEF_call_election: "Назначение выборов POTEF"
 EU_POTEF_call_election_desc: "С образованием Европейской федерации должность Президента Европейской федерации (POTEF) возникла из ротационного председательства в Совете Европейского союза. Чтобы придать POTEF большую демократическую легитимность, чем у ротационного председательства, в договорах было закреплено, что POTEF должен избираться народом, а срок его полномочий зависит от полученного большинства.\n\nВ данный момент действующего Президента Европейской федерации (POTEF) нет, поэтому необходимо назначить выборы, чтобы закрыть вакансию."
 EU_POTEF_nominee: "Выдвинуть [ROOT.GetLeader] кандидатом на выборах POTEF"
 EU_POTEF_nominee_desc: "Выдвинуть [ROOT.GetLeader] кандидатом на выборах Президента Европейской федерации (POTEF)."
 EU_POTEF_election_campaign: "Избирательная кампания POTEF"
 EU_POTEF_election_campaign_desc: "Началась гонка за пост Президента Европейской федерации. Кандидаты ведут предвыборную кампанию в государствах-членах, чтобы быть избранными следующим Президентом Европейской федерации (POTEF)."
 EU_POTEF_term: "Время до следующей избирательной кампании POTEF"
 EU_POTEF_term_desc: "Время до следующей избирательной кампании по выборам Президента Европейской федерации (POTEF)."
 EU_POTEF_show_election_polls: "Показать опросы POTEF"
 EU_POTEF_show_election_polls_desc: "Показать опросы к следующим выборам Президента Европейской федерации (POTEF)."
 EU_POTEF_hide_election_polls: "Скрыть опросы POTEF"
 EU_POTEF_hide_election_polls_desc: "Скрыть опросы к следующим выборам Президента Европейской федерации (POTEF)."
