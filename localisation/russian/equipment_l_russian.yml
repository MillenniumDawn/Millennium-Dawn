 ARM_SP_R_arty_2: "N-2"
 ARM_SP_R_arty_2_desc: "Н-2 — армянская реактивная система залпового огня, разработанная и производимая Научно-производственным объединением «Гарни-Лер» не позднее 2011 года. Армения опубликовала немного сведений об этой системе, однако очевидно, что Н-2 производится серийно и активно используется Вооружёнными силами Армении и, вероятно, Армией обороны Нагорного Карабаха. Система была разработана на базе российского военного грузовика ГАЗ-3308."
