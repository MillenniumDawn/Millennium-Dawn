 CAN_Rec_tank_1_desc: "외형은 원래의 M113과 비슷하지만, CV는 지휘 및 정찰용으로 대폭 개조되었습니다. 병력 수송실은 완전히 제거되었습니다. M113에 장착되었던 것과 동일한 제너럴 모터스 6기통 엔진이 후방에 배치되었습니다. M113의 현가장치는 유지하되 접지륜을 하나 줄여 양쪽에 4개만 남겼습니다."
 CAN_Rec_tank_2_desc: "1974년 캐나다군은 스위스의 모와그 피라냐 6x6 차량을 선정했습니다. 이 차량의 생산은 제너럴 모터스 캐나다의 한 부서인 캐나다 기업 디젤 사업부가 면허를 받아 맡았습니다. 쿠거 파생형은 FV101 스콜피온의 포탑을 사용했습니다."
 CAN_Rec_tank_3_desc: "LAV II 코요테는 제너럴 모터스(현 제너럴 다이내믹스)가 제작한 8x8 차륜형 장갑차입니다. 이 차량은 정찰 임무용으로 설계되었으며 LAV-25를 기반으로 합니다. 감시 장비로는 지상 감시 레이더와 장거리 영상 카메라 및 레이저 거리 측정기를 갖춘 전자광학/적외선 감시 체계가 있습니다. 감시 체계는 최대 12km 거리의 전차급 표적과 최대 24km 거리의 대형 트럭급 표적을 탐지할 수 있습니다."
