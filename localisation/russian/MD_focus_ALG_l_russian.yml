l_russian:
 algeria_focus: "Алжирское фокусное дерево"
 ALG_political_tree_shortcut: "Политическое Древо"
 ALG_foreign_policy_shortcut: "Внешняя политика"
 ALG_industry_shortcut: "Восстановление экономики"
 ALG_military_shortcut: "Вооруженные Силы Алжира"
 ALG_the_nation_stands_at_a_crossroads: "Нация стоит на перепутье"
 ALG_restore_the_presidency_desc: "На волне политических потрясений президентская власть была ослаблена. Пришло время восстановить авторитет нашего избранного лидера и восстановить демократические нормы, которые были подорваны. Восстановив президентство, мы сможем вернуть стабильность и доверие к нашему правительству."
 ALG_emergency_rule_continues: "§RЧрезвычайное положение продолжается§!"
 ALG_emergency_rule_continues_desc: "Поскольку в стране все еще царят беспорядки, правительство решило продлить действие чрезвычайного положения. Хотя эта мера необходима для поддержания порядка, она обходится дорого гражданским свободам и демократическим процессам. Мы должны действовать осторожно, ориентируясь в этих бурных водах."
 ALG_national_reconciliation: "Национальное примирение"
 ALG_national_reconciliation_desc: "Чтобы залечить раны раскола и конфликтов, мы должны встать на путь национального примирения. Развивая диалог между всеми группировками и устраняя недовольства, мы можем построить более сплоченное общество и заложить основу для прочного мира."
 ALG_moderate_islamist_talks: "Переговоры умеренных исламистов"
 ALG_moderate_islamist_talks_desc: "Стремясь преодолеть разногласия и способствовать стабильности, мы начинаем переговоры с умеренными исламистскими группировками. Участвуя в конструктивном диалоге, мы стремимся найти точки соприкосновения и создать политическую среду, в которой различные мнения могли бы мирно сосуществовать."
 ALG_charter_for_civil_peace: "Хартия гражданского мира"
 ALG_charter_for_civil_peace_desc: "Чтобы обеспечить прочную стабильность и социальную гармонию, мы предлагаем Хартию гражданского мира. В этом документе будут изложены права и обязанности всех граждан, способствующие терпимости, взаимопониманию и сотрудничеству между различными группами в нашем обществе."
 ALG_open_democratic_path: "Откройте демократический путь"
 ALG_open_democratic_path_desc: "Пришло время полностью принять демократию и открыть путь к светлому будущему. Осуществляя реформы, которые расширяют возможности наших граждан и способствуют участию в политической жизни, мы можем создать динамично развивающееся демократическое общество, отражающее волю народа."
 ALG_clamp_down_on_extremism: "Борьба с экстремизмом"
 ALG_clamp_down_on_extremism_desc: "Используя военные трибуналы и разведывательные службы, правительство устранит все оставшиеся радикальные исламистские и политические угрозы."
 ALG_counterterrorism_program: "Программа борьбы с терроризмом"
 ALG_counterterrorism_program_desc: "Необходимо сформировать современный аппарат безопасности для отслеживания, проникновения и устранения угроз до того, как они дестабилизируют Алжир."
 ALG_authoritarian_restoration: "Авторитарная реставрация"
 ALG_authoritarian_restoration_desc: "Стабильность может быть гарантирована только твердым, централизованным правлением. Военные возьмут на себя полную ответственность за будущее страны."
 ALG_counterterrorism_agency: "Агентство по борьбе с терроризмом"
 ALG_extremism_crackdown_modifier: "Подавление экстремизма"
 ALG_extremism_crackdown_modifier_desc: "В ответ на растущие угрозы со стороны экстремистских группировок, которые стремятся дестабилизировать нашу страну, мы осуществляем всеобъемлющую борьбу с радикализмом. Эта инициатива направлена на ликвидацию экстремистских сетей, усиление слежки и укрепление потенциала правоохранительных органов. Продвигая культуру терпимости и взаимопонимания, мы надеемся устранить коренные причины экстремизма, обеспечивая при этом безопасность наших граждан. С помощью этих мер мы будем способствовать созданию более сплоченного общества и защите наших демократических ценностей."
 ALG_military_regime_restored: "Восстановлен военный режим"
 ALG_military_regime_restored_desc: "После многих лет политической нестабильности военные восстановили контроль и восстановили порядок. Режим фокусируется на дисциплине, национальной безопасности и строгом управлении, чтобы восстановить силу и единство нации."
 ALG_reconciliation_path_category: "Национальное примирение"
 ALG_reconciliation_path_category_desc: "\n£AFG_menu1\n\n\n\nЧтобы залечить раны, нанесенные расколом и конфликтами, мы должны встать на путь национального примирения. Развивая диалог между всеми фракциями и устраняя разногласия, мы сможем построить более сплоченное общество и заложить основу для прочного мира."
 ALG_pardon_moderate_islamist: "Прошу прощения у умеренных исламистов"
 ALG_pardon_moderate_islamist_desc: "Бывшим ненасильственным исламистам может быть предложена условная амнистия в обмен на разоружение и отказ от политического насилия."
 ALG_initiate_national_dialogues: "Инициировать национальный диалог"
 ALG_initiate_national_dialogues_desc: "Будет запущен национальный форум для участия бывших повстанцев, политических партий и гражданского общества в построении нового Алжира."
 ALG_reintegrate_former_fighter: "Реинтегрировать бывших бойцов"
 ALG_reintegrate_former_fighter_desc: "Программа по реинтеграции сдавшихся повстанцев в гражданскую жизнь через работу, жилье или национальную службу."
 ALG_crackdown_category: "Авторитарные репрессии"
 ALG_crackdown_category_desc: "\n£TAJ_desctext_pamir\n\n\n\nЧтобы обеспечить стабильность государства, мы должны подавлять подрывную деятельность и укреплять наши силы внутренней безопасности."
 ALG_arrest_political_opponents: "Арестовывать политических оппонентов"
 ALG_arrest_political_opponents_desc: "Мы нейтрализуем внутренние угрозы, удалив радикальных политических акторов из общественного пространства."
 ALG_expand_surveillance_services: "Расширение служб видеонаблюдения"
 ALG_expand_surveillance_services_desc: "Надежная разведывательная сеть будет следить за населением и предотвращать беспорядки до того, как они распространятся."
 ALG_ban_opposition_parties: "Запретить оппозиционные партии"
 ALG_ban_opposition_parties_desc: "Всем политическим партиям, не поддерживающим национальное единство, будет запрещено участвовать в политике."
 ALG_economic_recovery_category: "Программа восстановления экономики"
 ALG_economic_recovery_category_desc: "\n£MAIN_desctext_dept\n\n\n\nМВФ предлагает условную поддержку, и теперь Алжир может приступить к более масштабным реформам, получению кредитов и приватизации."
 ALG_accept_imf_loan: "Принять кредит МВФ"
 ALG_accept_imf_loan_desc: "Мы можем принять финансовую помощь от МВФ, чтобы стабилизировать нашу валюту и начать реформы. Это происходит за счет долгосрочных долгов и условий."
 ALG_start_oil_licensing: "Открыть лицензирование добычи нефти для иностранных компаний"
 ALG_start_oil_licensing_desc: "Предоставление транснациональным корпорациям доступа к запасам нефти может ускорить экономический рост, но усилить иностранное влияние."
 ALG_repay_imf_loan: "Погасить кредит МВФ"
 ALG_repay_imf_loan_desc: "Когда наши финансы стабилизируются, мы сможем погасить наш кредит, чтобы уменьшить международную зависимость."
 ALG_improve_public_services: "Улучшение государственных услуг"
 ALG_improve_public_services_desc: "Мы расширим доступ к здравоохранению, образованию и поддержке жертв войны."
 ALG_international_aid_effort: "Международные усилия по оказанию помощи"
 ALG_international_aid_effort_desc: "Партнерство с ООН и донорами может дать толчок развитию основных услуг и восстановлению."
 ALG_building_civil_society: "Построение гражданского общества"
 ALG_building_civil_society_desc: "Расширение прав и возможностей местных сообществ и социальные программы могут помочь предотвратить возобновление конфликтов."
 ALG_economic_recovery_program: "Программа восстановления экономики"
 ALG_economic_recovery_program_desc: "Мы запускаем национальный план экономического роста, поддерживаемый иностранной помощью и государственными реформами."
 ALG_remove_international_monitors: "Удалить международных мониторов"
 ALG_remove_international_monitors_desc: "Алжир восстановился настолько, что смог вернуть себе полный суверенитет над своей экономической стратегией."
 ALG_postwar_recovery_program: "Программа послевоенного восстановления"
 ALG_postwar_recovery_program_desc: "Война закончилась. Теперь мы начинаем восстанавливать государство, экономику и общество."
 ALG_un_aid_mission: "Миссия ООН по оказанию помощи"
 ALG_un_aid_mission_desc: "Помощь Организации Объединенных Наций и неправительственные организации окажут содействие в предоставлении основных государственных услуг."
 ALG_social_healing_programs: "Программы социального оздоровления"
 ALG_social_healing_programs_desc: "Послевоенную травму и недоверие необходимо преодолевать с помощью социальных программ и примирения."
 ALG_public_services_funding: "Финансирование государственных услуг"
 ALG_public_services_funding_desc: "Мы восстановим доступ к программам здравоохранения, жилья и трудоустройства."
 ALG_finalize_recovery_phase: "Завершение этапа восстановления"
 ALG_finalize_recovery_phase_desc: "Восстановив стабильность, мы сможем уменьшить иностранный контроль и вернуть себе экономическую автономию."
 ALG_change_the_economy: "Изменить экономическую модель"
 ALG_change_the_economy_desc: "Пришло время сделать выбор: сохранить государственный контроль или либерализовать экономику?"
 ALG_preserve_state_controlled_oil: "Сохранить государственный контроль над нефтью"
 ALG_preserve_state_controlled_oil_desc: "Sonatrach должна оставаться опорой нашего суверенитета и экономики."
 ALG_industrial_expansion_plan: "План промышленного развития"
 ALG_industrial_expansion_plan_desc: "Мы увеличим внутреннее производство за счёт развития инфраструктуры и заводов."
 ALG_open_market_reforms: "Реформы открытого рынка"
 ALG_open_market_reforms_desc: "Алжир может привлечь инвестиции и стимулировать экономический рост за счет дерегулирования ключевых секторов экономики."
 ALG_oil_licensing_program: "Запустить программу лицензирования нефтедобычи"
 ALG_oil_licensing_program_desc: "Иностранные компании могут подавать заявки на разработку нефтяных месторождений на основании лицензионных соглашений."
 ALG_urban_or_rural_development: "Племена или города?"
 ALG_urban_or_rural_development_desc: "В послевоенный период нам следует сосредоточиться на племенных регионах или крупных городах?"
 ALG_empower_rural_provinces: "Расширение прав и возможностей сельских провинций"
 ALG_empower_rural_provinces_desc: "Наши сельские районы на юге страны и центральные районы проживания кабилов получат прямые инвестиции."
 ALG_tribal_consultative_council: "Form Tribal Consultative Council"
 ALG_tribal_consultative_council_desc: "Местные старейшины и региональные лидеры будут помогать определять приоритеты развития."
 ALG_urbanization_initiative: "Запустить инициативу по урбанизации"
 ALG_urbanization_initiative_desc: "Городские центры, такие как Алжир и Оран, являются ключом к нашей модернизации."
 ALG_expand_the_capital: "Расширить столицу"
 ALG_expand_the_capital_desc: "Мы расширим инфраструктуру и офисные площади в Алжире, чтобы превратить его в настоящий современный центр."
 ALG_foreign_policy_review: "Пересмотреть доктрину внешней политики"
 ALG_foreign_policy_review_desc: "С возвращением внутренней стабильности Алжир должен переосмыслить свою роль на мировой арене."
 MSP_foreign_policy_review: "Пересмотреть доктрину внешней политики"
 MSP_foreign_policy_review_desc: "С возвращением внутренней стабильности Алжир должен переосмыслить свою роль на мировой арене."
 ALG_africa_and_arab_nations: "Африка и арабские страны"
 ALG_africa_and_arab_nations_desc: "Мы сосредоточимся на лидерстве в дипломатии и развитии как в Африке, так и в арабском мире."
 ALG_western_sahara_position: "Поддержать Западную Сахару"
 ALG_western_sahara_position_desc: "Мы подтверждаем нашу поддержку независимости Сахары в противовес марокканским притязаниям."
 ALG_african_union_engagement: "Присоединиться к Африканскому союзу"
 ALG_african_union_engagement_desc: "Алжир должен вновь присоединиться и взять на себя лидирующую роль в континентальной дипломатии."
 ALG_sahel_initiatives: "Расшириться в регион Сахель"
 ALG_sahel_initiatives_desc: "Мы будем бороться с нестабильностью и терроризмом в Сахеле, используя мягкую силу и оборонные меры."
 ALG_choose_global_partner: "Выбрать глобального партнёра"
 ALG_choose_global_partner_desc: "Мы должны выстроить экономический и военный союз с одной из мировых сверхдержав."
 ALG_align_with_us: "Сблизиться с Соединёнными Штатами"
 ALG_align_with_us_desc: "Сотрудничество с Соединёнными Штатами может обеспечить безопасность и экономические преимущества."
 ALG_align_with_china: "Сблизиться с Китайской Народной Республикой"
 ALG_align_with_china_desc: "Китай предлагает экономическое развитие без вмешательства во внутренние дела и значительный инвестиционный потенциал."
 ALG_align_with_russia: "Согласовать с Российской Федерацией"
 ALG_align_with_russia_desc: "Россия предоставляет военные технологии и разделяет скептицизм Алжира по поводу доминирования Запада."
 ALG_non_aligned_revival: "Возродить внеблоковую внешнюю политику"
 ALG_non_aligned_revival_desc: "Мы возродим дух нейтралитета и солидарности стран Юга, как это было в 1960-х годах."
 ALG_global_south_solidarity: "Солидарность стран Глобального Юга"
 ALG_global_south_solidarity_desc: "Алжир укрепит связи с постколониальными странами посредством торговли, дипломатии и помощи."
 ALG_future_national_policy: "§G Будущее Алжира§!"
 ALG_future_national_policy_desc: "Гражданская война позади, и теперь мы должны определить новое политическое направление Алжира.\n §RПРИМЕЧАНИЕ§!: §YВыбор этого фокуса приведёт в конце к фокусам, которые заменят текущее дерево фокусов на индивидуальное для каждой партии, поэтому завершите другие важные фокусы, прежде чем заканчивать этот§!"
 ALG_approach_nato: "§CСблизиться с НАТО§!"
 ALG_approach_nato_desc: "Сближение с Западом может обеспечить экономический рост и гарантии безопасности."
 ALG_aspire_nato_support: "Стремиться к партнёрству с НАТО"
 ALG_aspire_nato_support_desc: "Выполнив определенные условия, Алжир может стать крупным союзником, не входящим в НАТО."
 ALG_invite_western_investors: "Пригласить западных инвесторов"
 ALG_invite_western_investors_desc: "Привлечь капитал и торговлю из демократических стран."
 ALG_request_us_protection: "Запросить защиту США"
 ALG_request_us_protection_desc: "Алжир обратится к Соединённым Штатам с просьбой о военной защите или гарантиях."
 ALG_remain_neutral: "§gСохранять нейтралитет§!"
 ALG_remain_neutral_desc: "Неприсоединение обеспечивает свободу дипломатии и внутреннюю стабильность."
 ALG_economy_first: "Экономика прежде всего"
 ALG_economy_first_desc: "Сократить военные расходы и увеличить вложения в образование и долгосрочное развитие."
 ALG_seek_un_protection: "Искать международную защиту"
 ALG_seek_un_protection_desc: "Если угрозы возрастут, мы обратимся за защитой к Совету Безопасности ООН."
 ALG_align_with_china1: "§tОбъединиться с Китаем и Россией§!"
 ALG_align_with_china1_desc: "Восточные державы предоставляют альтернативу сближению с НАТО."
 ALG_join_sco: "Подать заявку на вступление в ШОС"
 ALG_join_sco_desc: "Шанхайская организация сотрудничества предлагает экономические выгоды и преимущества в сфере безопасности."
 ALG_invite_eastern_investors: "Пригласить восточные инвестиции"
 ALG_invite_eastern_investors_desc: "Сотрудничайте с китайскими и российскими инфраструктурными компаниями."
 ALG_request_chinese_protection: "Запросить защиту Китая"
 ALG_request_chinese_protection_desc: "Пекин может согласиться гарантировать независимость Алжира и защиту инвестиций."
 ALG_reform_the_military: "Реформировать вооружённые силы"
 ALG_reform_the_military_desc: "Алжирская армия нуждается в глубокой структурной реформе, чтобы отвечать вызовам 21 века."
 ALG_military_academy_upgrade: "Модернизировать военную академию"
 ALG_military_academy_upgrade_desc: "Инвестиции в образование — ключ к подготовке компетентных и профессиональных офицеров."
 ALG_internal_security_brigade: "Сформировать бригады внутренней безопасности"
 ALG_internal_security_brigade_desc: "Мы должны обеспечить внутренний порядок с помощью специализированных подразделений внутренней безопасности."
 ALG_military_industry_support: "Поддержать военную промышленность"
 ALG_military_industry_support_desc: "Укрепление нашей военно-промышленной базы поможет обеспечить самодостаточность."
 ALG_anti_air_force: "Создать командование противовоздушной обороны"
 ALG_anti_air_force_desc: "Возможности противовоздушной обороны жизненно важны для защиты нашего неба."
 ALG_mechanized_modernization: "Модернизация механизированных войск"
 ALG_mechanized_modernization_desc: "Современные механизированные подразделения — основа эффективных сухопутных войск."
 ALG_uav_development: "Программа разработки беспилотников"
 ALG_uav_development_desc: "Беспилотные авиационные системы дадут нам возможности разведки и точечных ударов."
 ALG_national_guard_initiative: "Инициатива национальной гвардии"
 ALG_national_guard_initiative_desc: "Гражданский оборонный корпус может помочь стабилизировать сельские и приграничные районы."
 ALG_air_force_reform: "Реформировать военно-воздушные силы"
 ALG_air_force_reform_desc: "Обновление доктрин и техники критически важно для нашего превосходства в воздухе."
 ALG_infantry_equipment_project: "Модернизировать пехотное снаряжение"
 ALG_infantry_equipment_project_desc: "Наша пехота заслуживает самого современного оружия и защитного снаряжения."
 ALG_ballistic_program: "Программа баллистических ракет"
 ALG_ballistic_program_desc: "Расширение наших ракетных возможностей усилит стратегическое сдерживание."
 ALG_simulation_center: "Центр военного моделирования"
 ALG_simulation_center_desc: "Создание современных учебных центров значительно повысит нашу боевую готовность."
 ALG_logistics_command: "Создать командование тыла и снабжения"
 ALG_logistics_command_desc: "Оптимизация логистики обеспечивает боеспособность наших войск."
 ALG_military_doctrine_finalization: "Утвердить военную доктрину"
 ALG_military_doctrine_finalization_desc: "Мы должны объединить реформы в единую современную доктрину."
 ALG_foreign_arms_contracts: "Иностранные оружейные контракты"
 ALG_foreign_arms_contracts_desc: "Стратегические партнёрства могут помочь быстро восполнить пробелы в нашем арсенале."
 ALG_local_armor_production: "Местное производство бронетехники"
 ALG_local_armor_production_desc: "Запуск местного производства бронетранспортёров и танков обеспечит автономность и рост."
 ALG_military_university_program: "Программа военного университета"
 ALG_military_university_program_desc: "Инвестиции в военные академии подготовят наше следующее поколение лидеров."
 ALG_heavy_artillery_project: "Инициатива по тяжёлой артиллерии"
 ALG_heavy_artillery_project_desc: "Мы сделаем приоритетом отечественные исследования и разработки в области тяжёлой артиллерии."
 ALG_special_operations_command: "Командование сил специальных операций"
 ALG_special_operations_command_desc: "Централизованное командование элитными подразделениями повышает координацию и эффективность."
 ALG_joint_command_center: "Создать объединённый командный центр"
 ALG_joint_command_center_desc: "Объединение родов войск в единый оперативный центр усилит стратегическую интеграцию."
 ALG_indigenous_rifle_program: "Программа отечественного стрелкового оружия"
 ALG_indigenous_rifle_program_desc: "Разработка собственного современного стрелкового оружия — национальный приоритет."
 ALG_integrated_defense_network: "Интегрированная оборонная сеть"
 ALG_integrated_defense_network_desc: "Единая система радиолокации и связи укрепляет национальную оборону."
 ALG_advanced_command_structure: "Продвинутая командная структура"
 ALG_advanced_command_structure_desc: "Мы внедрим современную систему управления C4ISR для цифрового поля боя."
 ALG_military_modernization_complete: "Модернизация армии завершена"
 ALG_military_modernization_complete_desc: "Наш долгий путь реформ наконец принёс плоды. Теперь Алжир располагает современными, сплочёнными вооружёнными силами."
 ALG_idea_non_aligned_policy: "Внеблоковая внешняя политика"
 ALG_idea_non_aligned_policy_desc: "Наш независимый путь позволяет нам извлекать выгоду из отношений со всеми блоками, не примыкая ни к одному из них."
 ALG_presidential_succession_crisis: "Кризис президентского преемства"
 ALG_presidential_succession_crisis_desc: "По мере того как стабильность ослабевает, вновь встаёт вопрос о власти. Продолжим ли мы под старым режимом или проложим новый путь?"
 ALG_stay_with_bouteflika: "Сохранить власть Бутефлики"
 ALG_stay_with_bouteflika_desc: "Бутефлика олицетворяет преемственность. И коррупцию. Мы можем обрести финансовую стабильность, но ценой легитимности."
 ALG_choose_tebboune: "Назначить Теббуна"
 ALG_choose_tebboune_desc: "Умеренный технократ, ориентированный на стабилизирующие реформы, которые, впрочем, дорого обойдутся казне."
 ALG_choose_msp: "Назначить лидера ДОМ"
 ALG_choose_msp_desc: "Исламистская альтернатива, связанная с «Братьями-мусульманами». Она обеспечивает популярность в определённых кругах, но несёт риск гражданского конфликта с укоренившейся военной элитой."
 ALG_random_president: "Выбрать случайного президента"
 ALG_random_president_desc: "Тёмная лошадка. Этот новый президент может либо спасти Алжир, либо погубить его."
 ALG_resolve_presidency_crisis: "Кризис президентской власти разрешён"
 ALG_resolve_presidency_crisis_desc: "Вопрос лидерства решён. Теперь пришло время двигаться вперёд."
 ALG_idea_bouteflika_legacy: "Наследие Бутефлики"
 ALG_idea_bouteflika_legacy_desc: "Несмотря на глубокую коррупцию и недоверие, эпоха Бутефлики остаётся синонимом прежней системы управления Алжиром. Его сеть влияния по-прежнему сильна."
 ALG_idea_tebboune_moderate: "Умеренное президентство Теббуна"
 ALG_idea_tebboune_moderate_desc: "Создавая образ стабильности и постепенных реформ, Теббун стремится поддерживать порядок, одновременно наводя порядок в системе управления."
 ALG_idea_msp_presidency: "Президентство ДОМ"
 ALG_idea_msp_presidency_desc: "Движение общества за мир пришло к власти. Станет ли это мирным преобразованием или скатыванием к конфликту — покажет время."
 ALG_idea_random_good: "Эффективный новый президент"
 ALG_idea_random_good_desc: "Благодаря удаче или расчёту новый президент оказался компетентным и вдохновлённым, принеся с собой реформы и ясное направление."
 ALG_idea_random_bad: "Некомпетентный новый президент"
 ALG_idea_random_bad_desc: "Этот лидер неподготовлен, перегружен и, возможно, коррумпирован. Неудачный выбор в критический момент."
 ALG_presidency.1.t: "Напряжённость с военными"
 ALG_presidency.1.d: "После назначения лидера ДОМ президентом военная элита пришла в ярость. Она видит в этом угрозу своей многолетней хватке над властью. Ходят слухи о тайных мобилизациях, и вооружённые подразделения, верные старой гвардии, начинают манёвры. Примет ли армия эти перемены — или поднимет мятеж?"
 ALG_presidency.1.a: "Военные принимают новое правительство"
 ALG_presidency.1.b: "Военные поднимают мятеж — начинается гражданская война!"
 ALG_presidency_army_accepts_tt: "Армия неохотно принимает правительство ДОМ. Пока что мир сохраняется."
 ALG_presidency_army_civilwar_tt: "Военный переворот перерастает в открытую гражданскую войну!"
 ALG_economy_digital_initiative: "Инициатива цифровой экономики"
 ALG_economy_digital_initiative_desc: "Алжир должен принять цифровую эпоху, чтобы модернизировать свою экономику. Инвестиции в технологическую инфраструктуру, услуги электронного правительства и программы цифровой грамотности позволят нам занять достойное место в экономике XXI века."
 ALG_digital_initiative_tt: "§GАлжир запускает всеобъемлющую программу цифровой трансформации:§!\n- Модернизировать государственные услуги\n- Расширить интернет-инфраструктуру\n- Содействовать развитию технологических стартапов\n- Обучить рабочую силу цифровым навыкам"
 ALG_digital_economy_initiative: "Инициатива цифровой экономики"
 ALG_digital_economy_initiative_desc: "Наши инвестиции в цифровую инфраструктуру и технологическое образование приносят свои плоды. Государственные услуги стали более эффективными, предприятия внедряют современные практики, а новое поколение технически подкованных работников выходит на рынок труда."
 ALG_arpt_regulatory_framework: "Создать регулирующий орган ARPT"
 ALG_arpt_regulatory_framework_desc: "Управление по регулированию почты и телекоммуникаций (ARPT) обеспечит конкурентный рынок телекоммуникаций и защиту прав потребителей."
 ALG_algerie_telecom_expansion: "Модернизация Algerie Telecom"
 ALG_algerie_telecom_expansion_desc: "Модернизировать и расширить инфраструктуру Algerie Telecom для улучшения доступа к широкополосной связи и общественным коммуникациям."
 ALG_nedjma_and_mobilis: "Конкуренция Nedjma и Mobilis"
 ALG_nedjma_and_mobilis_desc: "Поощрение здоровой конкуренции между операторами связи, такими как Nedjma и Mobilis, снизит цены и повысит качество обслуживания."
 ALG_fiber_optic_program: "Волоконно-оптическая инфраструктура"
 ALG_fiber_optic_program_desc: "Инвестировать в развёртывание волоконно-оптической сети по всей стране для повышения качества подключения и скорости передачи данных."
 ALG_4g_rollout: "Внедрить услуги 4G"
 ALG_4g_rollout_desc: "Запуск мобильного интернета 4G изменит связь, обеспечив улучшенные электронные услуги и цифровую производительность."
 ALG_air_algerie_modernization: "Модернизация Air Algérie"
 ALG_air_algerie_modernization_desc: "Укрепление флота и маршрутов Air Algérie повысит туризм и улучшит международную логистику."
 ALG_international_airports_upgrade: "Модернизировать крупные аэропорты"
 ALG_international_airports_upgrade_desc: "Инвестировать в аэропорты, такие как Алжир, Оран и Константина, чтобы превратить их в узлы регионального и мирового воздушного сообщения."
 ALG_aadl_housing_projects: "Жилищные программы AADL"
 ALG_aadl_housing_projects_desc: "Национальное агентство по улучшению и развитию жилья реализует программы субсидированного жилья и городского развития для растущего городского населения."
 ALG_urbanization_initiatives: "Инициативы городского развития"
 ALG_urbanization_initiatives_desc: "Расширение дорог, коммунальной инфраструктуры и строительных зон поддержит наши растущие города и повысит качество жизни."
 ALG_arpt_regulation: "Регулирующий орган ARPT"
 ALG_arpt_regulation_desc: "ARPT обеспечивает справедливые рыночные практики, конкуренцию и защиту прав потребителей в секторе телекоммуникаций."
 ALG_algerie_telecom_program: "Программа Algerie Telecom"
 ALG_algerie_telecom_program_desc: "Комплексный план модернизации государственного оператора связи."
 ALG_mobile_operator_competition: "Реформа конкуренции в сфере телекоммуникаций"
 ALG_mobile_operator_competition_desc: "Рыночная конкуренция между Nedjma и Mobilis способствовала внедрению инноваций и доступным ценам."
 ALG_4g_coverage: "Национальное покрытие 4G"
 ALG_4g_coverage_desc: "Продвинутый мобильный широкополосный доступ улучшает связь и поддерживает цифровую экономику."
 ALG_national_innovation_push: "Национальный толчок к инновациям"
 ALG_national_innovation_push_desc: "Государственная инициатива по продвижению инноваций и технологического развития во всех секторах."
 ALG_highway_project: "Проект автомагистрали Восток—Запад"
 ALG_highway_project_desc: "Проект стоимостью $13 млрд, соединяющий Восток и Запад, модернизирует транспортную систему и сократит время в пути."
 ALG_air_algerie_investment: "Инвестиции в Air Algérie"
 ALG_air_algerie_investment_desc: "Расширение национальной алжирской авиакомпании открывает новые возможности для торговли и путешествий."
 ALG_air_hub_status: "Региональный авиаузел Алжир"
 ALG_air_hub_status_desc: "Алжир имеет потенциал стать центральным узлом между Африкой, Европой и Ближним Востоком."
 ALG_aadl_program: "Жилищная инициатива AADL"
 ALG_aadl_program_desc: "Национальное агентство по улучшению и развитию жилья ставит целью построить доступное жильё для тысяч семей по всему Алжиру."
 ALG_kabylia_unrest: "Волнения в Кабилии"
 ALG_kabylia_unrest_desc: "Со времён «Берберской весны» 1980 года Кабилия отмечена периодическими протестами, культурными требованиями и недоверием к центральному правительству. Эта напряжённость тлеет под поверхностью, подрывая стабильность и грозя перерасти в более широкие волнения, если её не устранить. Если проблема останется нерешённой, в будущем события могут резко обостриться."
 ALG_black_spring.1.t: "Волнения в Кабилии"
 ALG_black_spring.1.d: "После убийства Массинисы Гермаха силами жандармерии в Кабилии вспыхнули массовые протесты. Волнения нарастают день ото дня."
 ALG_black_spring.1.a: "Это необходимо решить."
 ALG_black_decade: "Чёрное десятилетие"
 ALG_black_decade_desc: "Гражданская война в Алжире, известная в стране как «Чёрное десятилетие», представляла собой войну между алжирским правительством и различными исламистскими повстанческими группировками, продолжавшуюся с 11 января 1992 года (после переворота, аннулировавшего победу исламистов на выборах) по 8 февраля 2002 года. Война началась медленно, поскольку поначалу казалось, что правительству удалось подавить исламистское движение, однако вооружённые группировки вскоре объявили джихад, и к 1994 году насилие достигло такого уровня, что власти, казалось, могли не выдержать натиска. К 1996–1997 годам стало очевидно, что исламистское сопротивление утратило народную поддержку, хотя боевые действия продолжались ещё несколько лет."
 ALG_maghreb_invite.1.t: "Приглашение в Союз стран Магриба"
 ALG_maghreb_invite.1.d: "Алжир предлагает создать североафриканский экономический и военный союз. Мы присоединимся?"
 ALG_maghreb_invite.1.a: "Вступить в Союз"
 ALG_maghreb_invite.1.b: "Отказаться (только Марокко)"
 ALG_maghreb_trade_hub: "Торговый узел Магриба"
 ALG_maghreb_trade_hub_desc: "Наша экономика процветает как центр североафриканской торговли."
 ALG_maghreb_diplomacy: "Дипломатия Магриба"
 ALG_maghreb_diplomacy_desc: "Алжир утверждает себя в качестве лидера Северной Африки, укрепляя единство посредством торговли и общей безопасности."
 ALG_maghreb_union_tt: "Создан Союз Магриба\nАлжир, Тунис и другие страны Северной Африки теперь связаны экономическими и военными узами под нашим руководством."
 ALG_trade_allies: "Торговые союзники"
 ALG_egypt_algiers_axis: "Ось Египет—Алжир"
 ALG_egypt_algiers_axis_desc: "Наши отношения с Египтом уходят корнями в прошлое. Мы должны продолжать укреплять свои позиции в Африке и вести этот континент за собой."
 FIS_Are_Terrorists: "ИФС — террористы"
 ALG_un_peacekeepers: "Развёрнуты миротворцы ООН"
 ALG_un_peacekeepers_desc: "Организация Объединённых Наций направила миротворческие силы для стабилизации региона и предотвращения дальнейшего конфликта. Их миссия — поддерживать порядок, защищать гражданское население и содействовать дипломатическим усилиям по достижению прочного мира."
 ALG_civil_war_recovered: "Гражданская война преодолена"
 ALG_civil_war_recovered_desc: "Страна вышла из потрясений гражданской войны и начала долгий процесс исцеления и восстановления. Усилия сосредоточены на восстановлении единства, реконструкции инфраструктуры и предотвращении будущих внутренних конфликтов."
 ALG_sonatrach_restructure: "Реструктуризация Sonatrach"
 ALG_sonatrach_restructure_desc: "Национальная нефтяная компания Sonatrach проходит масштабную реструктуризацию для повышения эффективности, увеличения добычи и укрепления экономической стабильности. Эти преобразования направлены на развитие энергетического сектора страны и поддержку долгосрочного роста."
 ALG_investment_boom_modifier: "Инвестиционный бум"
 ALG_investment_boom_modifier_desc: "Страна переживает резкий рост внутренних и иностранных инвестиций, что стимулирует стремительный экономический рост и развитие. Этот бум укрепляет промышленный потенциал, инфраструктуру и общее благосостояние."
 ALG_foreign_oil_licensing_bonus: "Лицензирование иностранной нефтедобычи"
 ALG_foreign_oil_licensing_bonus_desc: "Предоставляет иностранной компании временный доступ к нашим нефтяным месторождениям, повышая нашу нефтедобывающую мощность."
 ALG_idea_pro_palestinian_campaign: "Про-палестинская кампания"
 ALG_idea_pro_palestinian_campaign_desc: "Укрепляет отношения с палестинскими группировками и потенциально усиливает поддержку алжирских движений за независимость в регионе."
 ALG_idea_palestinian_backing: "Поддержка Алжиром прав палестинцев"
 ALG_idea_palestinian_backing_desc: "Анализ исторической и текущей поддержки Алжиром прав палестинцев, включая дипломатическую позицию, инициативы по оказанию помощи и более широкое политическое участие."
 ALG_idea_palestinian_aid_fund: "Алжиро-палестинский фонд помощи"
 ALG_idea_palestinian_aid_fund_desc: "Фонд, учреждённый Алжиром для оказания гуманитарной и экономической помощи палестинскому народу. Он может включать оказание экстренной помощи, развитие инфраструктуры, образование и инициативы по экономическому расширению возможностей."
 ALG_crackdown_backfired: "Репрессии дали обратный эффект"
 ALG_idea_refoming_education1: "Реформировать образование"
 ALG_idea_refoming_education: "Реформировать образование"
 ALG_university_expansion: "Расширение университетов"
 ALG_basic_income_support: "Поддержка базового дохода"
 ALG_housing_support_idea: "Жилищная поддержка"
 ALG_childcare_reform: "Реформа системы ухода за детьми"
 ALG_civil_rights: "Предоставить гражданские права"
 ALG_public_admin_reform: "Бесплатный общественный транспорт"
 MSP_switch_to_morocco: "Отказаться от сахарцев"
 MSP_switch_to_morocco_desc: "Поддержка сахарцев испортила наши отношения с Марокко. Марокко — растущая экономическая держава, могущественное государство прямо у наших границ. Было бы разумнее отказаться от бессмысленной поддержки сахарцев и вместо этого выстроить дружественные отношения с Марокко."
 MSP_influence_mauritania: "Влияние на Мавританию"
 MSP_influence_mauritania_desc: "Мавритания вела короткую войну против Марокко за Западную Сахару после ухода Испании из региона. Она больше не претендует на эту территорию, но пристально следит за конфликтом в Западной Сахаре и является одним из сторонников Фронта ПОЛИСАРИО. Важно усилить наше влияние на неё, чтобы способствовать урегулированию конфликта в Западной Сахаре."
 MSP_casablanca_accords: "Касабланкские соглашения"
 MSP_casablanca_accords_desc: "Конфликт в Западной Сахаре остаётся замороженным уже несколько десятилетий, и никому не удаётся его урегулировать. Нам необходимо использовать своё влияние в регионе, чтобы разрешить этот конфликт."
 ALG_influence_mauritania: "Влияние на Мавританию"
 ALG_influence_mauritania_desc: "Мавритания вела короткую войну против Марокко за Западную Сахару после ухода Испании из региона. Она больше не претендует на эту территорию, но пристально следит за конфликтом в Западной Сахаре и является одним из сторонников Фронта ПОЛИСАРИО. Важно усилить наше влияние на неё, чтобы способствовать урегулированию конфликта в Западной Сахаре."
 ALG_energy_reform: "Энергетическая реформа"
 ALG_energy_reform_desc: "Нам нужно решить нашу энергетическую проблему. Реформировав энергетическую отрасль, мы сможем обеспечить распределение энергии по всей стране."
 ALG_focus_on_oil: "Сделать ставку на нефть"
 ALG_focus_on_oil_desc: "По всему Алжиру есть множество неразработанных нефтяных месторождений, и, согласно некоторым исследованиям, Алжир может быть одной из богатейших нефтью стран в мире — большая часть этой нефти просто не освоена. В связи с этим нам следует сделать ставку на нефть."
 ALG_focus_on_oil_tt: "§CСтавка на нефть позволит нам получать больше прибыли от продажи энергии соседям, но обернётся катастрофой для Хасси-Мессауда!§!"
 ALG_focus_on_renewables: "Сделать ставку на возобновляемые источники энергии"
 ALG_focus_on_renewables_desc: "Алжир — страна, где нет слишком маленькой деревни для солнца. Нам нужно показать пример остальному миру и построить устойчивую энергетическую сеть. Это будет дорого, но оно того стоит ради будущих поколений."
 ALG_focus_on_renewables_tt: "§CСтавка на возобновляемую энергию принесёт меньше прибыли, чем использование нефти, но будет лучше для Хасси-Мессауда!§!"
 ALG_oil_production: "Сотрудничать с Sonatrach"
 ALG_oil_production_desc: "Основной алжирской нефтегазовой компанией является Sonatrach — государственное предприятие. Это крупный игрок на мировом энергетическом рынке, активно ищущий инвестиции и партнёрства в нефтегазовом секторе. Sonatrach задействована во всех звеньях цепочки создания стоимости углеводородов — от разведки и добычи до переработки и сбыта."
 ALG_grid_expansion: "Расширение энергосети"
 ALG_grid_expansion_desc: "Хорошо, что мы можем производить собственную электроэнергию, но нам также нужна надёжная электросеть, чтобы распределять электроэнергию по всей стране и поставлять её соседям."
 ALG_solar_panel_grid: "Сеть солнечных панелей"
 ALG_solar_panel_grid_desc: "Учитывая наше географическое положение, солнца в Алжире почти всегда в избытке. Это делает страну прекрасным местом для строительства солнечных электростанций."
 ALG_hassi_massoud_exploitation: "Эксплуатация Хасси-Мессауда"
 ALG_resource_excavation_research: "Исследования в области нефтедобычи"
 ALG_resource_excavation_research_desc: "Часть нефти залегает в труднодоступных местах. Нам нужно совместно с Университетом Алжира 1 искать способы добычи каждой возможной капли нефти."
 ALG_wind_turbine_research: "Исследования ветряных турбин"
 ALG_wind_turbine_research_desc: "При нынешнем уровне технологий строительство ветропарков в Алжире невозможно. Ветровые условия просто не подходят для современных турбин. Нам нужно инвестировать в исследования для решения этой проблемы."
 ALG_ethanol_power_plant: "Этаноловая электростанция"
 ALG_ethanol_power_plant_desc: "Используя этанол, получаемый из коровьего навоза, мы можем создать устойчивый способ производства электроэнергии."
 ALG_algeria_steelworks: "Алжирский металлургический комбинат"
 ALG_algeria_steelworks_desc: "Нам нужно добывать больше нефти! Благодаря дополнительной нефти мы также сможем построить металлургический завод."
 ALG_Adrar_wind_park: "Ветропарк Адрар"
 ALG_Adrar_wind_park_desc: "Ветряная ферма Адрар — это природная территория в южной части Алжира. Рельеф местности рядом с фермой подходит для строительства ветряных электростанций, и именно там мы построим первую ветряную ферму Алжира."
 ALG_national_space_program: "Национальная космическая программа"
 ALG_national_space_program_desc: "Алжир должен создать национальную космическую программу, чтобы войти в число космических держав. Эта инициатива заложит основу для будущих достижений в области освоения космоса и спутниковых технологий."
 ALG_arab_world_outreach: "Углубить арабские дипломатические связи"
 ALG_arab_world_outreach_desc: "Чтобы укрепить влияние Алжира в арабском мире, нам необходимо активизировать дипломатическую работу и координацию усилий. Посредством двусторонних визитов, саммитов и торговых инициатив Алжир сможет утвердить себя как объединяющую силу в регионе."
 ALG_join_arab_league: "Усилить взаимодействие с Лигой арабских государств"
 ALG_join_arab_league_desc: "Будучи действующим членом Лиги арабских государств, Алжир может выйти за рамки простого участия и взять на себя ведущую дипломатическую роль. Содействие экономической координации, консультациям по вопросам обороны и культурной солидарности повысит наш авторитет в арабском мире."
 ALG_support_palestine: "Поддержать палестинское дело"
 ALG_support_palestine_desc: "Давние отношения Алжира с Палестиной уходят корнями в общий исторический опыт и политическую солидарность. Эта связь проявляется в различных формах, включая дипломатическую поддержку права палестинцев на самоопределение и гуманитарную помощь. Приверженность палестинскому делу — ключевой аспект внешней политики Алжира."
 ALG_algeria_algiers_axis: "Сформировать ось Египет—Алжир"
 ALG_algeria_algiers_axis_desc: "Более тесно сотрудничая с Египтом, Алжир может помочь сформировать мощный региональный блок, способный направлять арабское единство, обеспечивать стабильность в Северной Африке и уравновешивать иностранное влияние."
 ALG_condemn_israel: "Осудить действия Израиля"
 ALG_condemn_israel_desc: "В свете продолжающейся агрессии и нарушений прав человека Алжир официально осудит действия Израиля на международной арене, призывая к справедливому миру и выступая против нормализации отношений без урегулирования конфликта."
 ALG_palestinian_aid_package: "Пакет помощи Палестине"
 ALG_palestinian_aid_package_desc: "Мы выделим ресурсы для оказания гуманитарной, экономической и технической помощи палестинским территориям, гарантируя, что приверженность Алжира выражается не только на словах, но и в реальной, ощутимой помощи."
 ALG_pan_african_defense_initiative: "Панафриканская оборонная инициатива"
 ALG_pan_african_defense_initiative_desc: "Для защиты африканского суверенитета и укрепления стабильности на континенте Алжир предложит скоординированную африканскую оборонную инициативу, направленную на формирование коллективной военной готовности перед лицом общих угроз."
 ALG_send_troops_to_sahel: "Развернуть силы в Сахеле"
 ALG_send_troops_to_sahel_desc: "В ответ на растущую нестабильность в Сахеле Алжир направит войска для поддержки миротворческих операций, охраны границ и антитеррористических кампаний в сотрудничестве с правительствами региона."
 ALG_sahel_stabilization_force: "Силы стабилизации Сахеля"
 ALG_sahel_stabilization_force_desc: "Алжир возьмёт на себя ведущую роль в создании постоянных Сил стабилизации Сахеля — африканской структуры безопасности под собственным руководством, призванной противостоять повстанческим движениям и преступным сетям в регионе."
 ALG_exploit_sahel_resources: "Освоить ресурсы Сахеля"
 ALG_exploit_sahel_resources_desc: "Влияние Алжира в Сахеле открывает доступ к неосвоенным природным ресурсам. Заключая контракты на добычу полезных ископаемых и развитие инфраструктуры, мы сможем обеспечить экономическую выгоду и стратегические партнёрства в регионе."
 ALG_propose_maghreb_union: "Предложить создание Союза стран Магриба"
 ALG_propose_maghreb_union_desc: "Настало время возродить идею объединённого Магриба. Алжир выступит с инициативой возобновления интеграционных усилий, сосредоточившись на экономическом сотрудничестве, совместной инфраструктуре и дипломатическом сближении."
 ALG_economic_integration_initiative: "Экономическая интеграция Магриба"
 ALG_economic_integration_initiative_desc: "С помощью снижения тарифов, инвестиций в инфраструктуру и согласованных обсуждений денежно-кредитной политики Алжир возглавит усилия по созданию единой экономической зоны Магриба, выгодной для всех стран-участниц."
 ALG_maghreb_joint_defense_pact: "Совместный оборонный пакт Магриба"
 ALG_maghreb_joint_defense_pact_desc: "Безопасность Магриба требует коллективной обороны. Мы предложим региональный военный пакт, направленный на охрану границ, обмен разведывательными данными и проведение совместных военных учений."
 ALG_idea_joint_military_arab: "Объединённые арабские вооружённые силы"
 palestine_issue_very_positive: "Поддержать палестинский вопрос"
 ALG_algerian_airforce: "Модернизировать военно-воздушные силы Алжира"
 ALG_algerian_airforce_desc: "Современные и боеспособные военно-воздушные силы — необходимое условие национальной обороны. Мы инвестируем в реструктуризацию, подготовку лётчиков и закупку техники для повышения боеготовности в воздухе."
 ALG_buy_russia_su_27: "Закупка российских СУ-27"
 ALG_buy_russia_su_27_desc: "В рамках модернизации наших военно-воздушных сил мы проведем переговоры с Россией о закупке партии истребителей СУ-27, что укрепит наше превосходство в воздухе и стратегическое сдерживание."
 ALG_oum_el_bouaghi_airbase: "Расширить авиабазу Ум-эль-Буаги"
 ALG_oum_el_bouaghi_airbase_desc: "Стратегически расположенная на востоке, авиабаза Ум-эль-Буаги будет расширена и превращена в крупный оперативный узел военно-воздушных сил Алжира, что повысит наши возможности быстрого развёртывания."
 ALG_protect_the_skies: "Защитить небо"
 ALG_protect_the_skies_desc: "На фоне роста региональных угроз с воздуха Алжир обязан обеспечить способность обнаруживать и пресекать любые вторжения. Укрепление нашей противовоздушной обороны — приоритет национальной безопасности."
 ALG_russia_mig_servicing: "Контракты на обслуживание российских самолетов МиГ"
 ALG_russia_mig_servicing_desc: "Поддержание и модернизация нашего парка самолетов МиГ требует более тесного сотрудничества с российскими подрядчиками. Эти соглашения об обслуживании обеспечат долговечность существующих воздушных судов."
 ALG_bosnian_parts: "Обеспечить поставки боснийских запчастей"
 ALG_bosnian_parts_desc: "Алжир обеспечит поставки излишков комплектующих от боснийской оборонной промышленности для поддержки и модернизации наших стареющих авиационных платформ, обеспечивая экономически эффективное обслуживание и ремонт."
 ALG_comprehensive_radar_installations: "Расширение зоны радиолокационного покрытия"
 ALG_comprehensive_radar_installations_desc: "Для достижения полного радиолокационного покрытия страны мы построим современные радиолокационные станции вдоль границ и побережья Алжира, устранив все слепые зоны в нашем воздушном пространстве."
 ALG_reform_or_control: "Реформа или контроль"
 ALG_reform_or_control_desc: "Алжир стоит на политическом перепутье. Выбор между подлинными демократическими реформами и укреплением авторитарного контроля определит будущее страны."
 ALG_legalize_moderate_islamists: "Легализовать умеренных исламистов"
 ALG_legalize_moderate_islamists_desc: "Признание умеренных исламистских партий открывает путь к стабильности через их включение в политический процесс. Тщательно контролируемое участие в выборах способно ослабить радикальные настроения."
 ALG_restore_elections: "Восстановить избирательные процессы"
 ALG_restore_elections_desc: "Чтобы восстановить легитимность государства, Алжир должен возобновить свободные и честные выборы. Прозрачность и подотчётность станут основами новой политической эпохи."
 ALG_public_media_and_transparency: "Расширить полномочия общественных СМИ и повысить прозрачность"
 ALG_public_media_and_transparency_desc: "Реформа государственных СМИ и свобода прессы жизненно важны для восстановления доверия общества. Информированное гражданское население — необходимое условие демократического развития."
 ALG_crackdown_on_opposition: "Подавить оппозицию"
 ALG_crackdown_on_opposition_desc: "Чтобы предотвратить дестабилизацию, инакомыслие необходимо сдержать. Слежка, цензура и точечные аресты нейтрализуют антиправительственные элементы."
 ALG_state_surveillance_network: "Государственная сеть наблюдения"
 ALG_state_surveillance_network_desc: "Национальная разведывательная сеть будет расширена для мониторинга политической активности, что позволит нейтрализовать угрозы до их эскалации."
 ALG_joint_governance_experiment: "Эксперимент совместного управления"
 ALG_joint_governance_experiment_desc: "Мы опробуем новую форму разделения власти между светскими и религиозными силами, чтобы предотвратить возобновление конфликта. Этот рискованный эксперимент может принести либо мир, либо паралич власти."
 ALG_a_radical_reorientation: "Радикальная переориентация"
 ALG_a_radical_reorientation_desc: "Прежний порядок потерпел крах. Через божественное предназначение и идеологическую ясность открывается новый путь — путь, направляемый бескомпромиссной верой и отрицанием легитимности светского государства."
 ALG_covert_support_for_islamist_radicals: "Тайная поддержка исламистских радикалов"
 ALG_covert_support_for_islamist_radicals_desc: "Радикальные сети продолжают действовать в тени. Благодаря стратегическому финансированию и тайной логистической поддержке мы можем усилить эти группы, чтобы они действовали против режима изнутри."
 ALG_tolerate_radical_preachers: "Терпимо относиться к радикальным проповедникам"
 ALG_tolerate_radical_preachers_desc: "Кафедра — мощный инструмент. Закрывая глаза на пламенные проповеди, мы позволяем идеологии распространяться органично через мечети и медиа, радикализируя население в наших интересах."
 ALG_welcome_militants: "Приветствовать иностранных боевиков"
 ALG_welcome_militants_desc: "Наше дело выходит за пределы границ. Иностранные боевики, разделяющие нашу идеологию, могут быть безопасно укрыты и интегрированы в местные ячейки, принося с собой боевой опыт и непоколебимую преданность делу."
 ALG_arms_smuggling: "Операции по контрабанде оружия"
 ALG_arms_smuggling_desc: "Чтобы подготовиться к будущему противостоянию, нам необходимо наладить подпольные каналы поставок оружия и боеприпасов. Союзы с транснациональными торговцами оружием послужат нашим целям."
 ALG_start_the_uprising: "Начать восстание"
 ALG_start_the_uprising_desc: "Сейчас самое подходящее время. Активировав наши сети, вооружив наших бойцов и распространив нашу идеологию, мы восстанем против режима и провозгласим новый исламский порядок."
 ALG_clamp_down_on_vices: "Искоренить пороки"
 ALG_clamp_down_on_vices_desc: "Азартным играм, алкоголю и моральному разложению нет места в нашем обществе. Масштабная кампания по искоренению этих пороков очистит нацию и утвердит религиозную власть."
 ALG_revolutionize_the_ulema: "Совершить революцию в улемах"
 ALG_revolutionize_the_ulema_desc: "Религиозный истеблишмент должен встать на сторону революционного дела. Традиционные улемы будут отстранены или подвергнуты перевоспитанию, а их место как духовных лидеров государства займут лояльные священнослужители."
 ALG_traditional_gender_roles: "Укрепить традиционные гендерные роли"
 ALG_traditional_gender_roles_desc: "Современная эпоха исказила естественный порядок вещей. Мы вернёмся к предопределённым свыше ролям мужчин и женщин, установив строгую правовую систему, отражающую эти ценности."
 ALG_pledge_allegiance_to_al_qaeda: "Присягнуть на верность Аль-Каиде"
 ALG_pledge_allegiance_to_al_qaeda_desc: "Для успеха глобального джихада необходимо единство. Мы присягнём на верность Аль-Каиде, присоединившись к их идеологии и заручившись поддержкой более широкой исламистской сети."
 ALG_pledge_allegiance_to_daesh: "Присягнуть на верность Исламскому государству"
 ALG_pledge_allegiance_to_daesh_desc: "Аль-Каида — дряхлое, разлагающееся движение, утратившее из виду свою первоначальную цель — ведение глобального джихада, увязнув вместо этого в делах локального уровня. Настало время новому движению с новым чувством цели занять его место."
 ALG_secure_the_loyalty_of_aqim: "Обеспечить лояльность АКИМ"
 ALG_secure_the_loyalty_of_aqim_desc: "Аль-Каида в исламском Магрибе должна признать наше руководство и действовать в координации с нашим государством. Их лояльность обеспечит долгосрочный контроль над джихадистскими операциями в регионе."
 ALG_war_on_daesh: "Война против ДАИШ"
 ALG_secure_the_loyalty_effect_tt: "Эффекты будут зависеть от наличия среди наших марионеточных государств любой из следующих стран: [AQY.GetNameWithFlag], [NUS.GetNameWithFlag], [TTP.GetNameWithFlag]"
 ALG_war_on_daesh_desc: "Так называемое \"Исламское государство\" представляет собой явную угрозу нашему лидерству в глобальном джихадистском движении. Их отказ признавать наш авторитет и их нетрадиционная тактика более недопустимы. Настало время начать полномасштабную войну против выскочки ДАИШ."
 ALG_jihad_in_the_maghreb: "Джихад в Магрибе"
 ALG_jihad_in_the_maghreb_desc: "Светские режимы Марокко, Туниса и Алжира должны пасть. Мы расширим наш Халифат силой, начав региональную кампанию религиозной войны и территориальной экспансии."
 ALG_jihad_in_arabia: "Джихад на Аравийском полуострове"
 ALG_jihad_in_arabia_desc: "Как родина священных городов Мекки и Медины, Аравийский полуостров, пожалуй, является самой религиозно значимой территорией в мире. Поэтому нельзя допустить, чтобы им и далее управляли недостаточно благочестивые, коррумпированные правительства."
 ALG_jihad_in_the_levant: "Джихад в Ираке и аш-Шаме"
 ALG_jihad_in_the_levant_desc: "Ирак и Левант — регионы, раздираемые иностранными силами со времён колониальной эпохи. Лишь силой оружия можно изгнать крестоносцев и сионистских оккупантов из Леванта."
 ALG_jihad_in_west_africa: "Джихад в Западной Африке"
 ALG_jihad_in_west_africa_desc: "Наша революция не ограничивается Магрибом. Настало время экспортировать джихад в Западную Африку, свергая режимы в Мали, Нигере и Мавритании по мере нашего продвижения на юг."
 AlgeriaFocus.56.t: "[FROM.GetNameDef] поддерживает нашу независимость"
 AlgeriaFocus.56.d: "[FROM.GetNameDef] подтвердила свою поддержку нашей независимости от Марокко и дала понять, что хотела бы ещё теснее сотрудничать с нами в будущем."
 AlgeriaFocus.56.a: "Отлично"
 AlgeriaFocus.57.t: "[FROM.GetNameDef] покидает нас"
 AlgeriaFocus.57.d: "[FROM.GetNameDef] отозвала свою поддержку нашей независимости. Она была нашим союзником на протяжении десятилетий, но, похоже, теперь отвернулась от нас, стремясь улучшить отношения с Марокко."
 AlgeriaFocus.57.a: "Предатели!"
 algeria_algerian_foreign_policy: "Внешняя политика Алжира"
 AlgeriaFocus.64.t: "[FROM.GetNameDef] требует автономии Крита"
 AlgeriaFocus.64.d: "Правительство [FROM.GetAdjective] заявило, что обеспокоено нашей позицией на острове Крит. По их словам, наш жёсткий контроль над островом ставит под угрозу их безопасность. Они требуют предоставить Криту ограниченную автономию, чтобы обеспечить сокращение нашего военного и политического присутствия в этом районе."
 AlgeriaFocus.64.a: "Полагаю, мы можем на это пойти"
 AlgeriaFocus.64.b: "Это абсурдно"
 AlgeriaFocus.65.t: "[FROM.GetNameDef] соглашается"
 AlgeriaFocus.65.d: "Правительство [FROM.GetAdjective] приняло наши требования о расширении автономии для критского народа."
 AlgeriaFocus.65.a: "Успех"
 AlgeriaFocus.66.t: "[FROM.GetNameDef] отклоняет"
 AlgeriaFocus.66.d: "Правительство [FROM.GetAdjective] отклонило наши требования о расширении автономии для критского народа."
 AlgeriaFocus.66.a: "Они об этом пожалеют"
 AlgeriaFocus.66.b: "Мы не будем торопиться"
 AlgeriaFocus.67.t: "ХАМАС начинает новую интифаду"
 AlgeriaFocus.67.d: "ХАМАС объявил новую интифаду против нас. Мы наблюдаем усиление активности боевиков ХАМАС, и уже прошло несколько демонстраций против нашего правления в Палестине. У нас есть данные, что за вооружением и мотивацией ХАМАС в этой новой кампании может стоять Алжир."
 AlgeriaFocus.67.a: "Они об этом пожалеют"
 AlgeriaFocus.68.t: "[FROM.GetNameDef] спонсирует новую интифаду"
 AlgeriaFocus.68.d: "[FROM.GetAdjective] направила нам оружие и деньги, чтобы мы начали новую интифаду против Израиля. У наших представительств уже выстроилась очередь новобранцев, и люди мобилизуются для протестов против израильских оккупантов."
 AlgeriaFocus.68.a: "Мы благодарим Алжир"
 AlgeriaFocus.69.t: "Хамас восстал"
 AlgeriaFocus.69.d: "Мы получаем сообщения о том, что боевики ХАМАС захватывают ключевые учреждения и здания в секторе Газа. Они поклялись, что Израиль пострадает от новой интифады."
 AlgeriaFocus.69.a: "Черт"
 AlgeriaFocus.69.b: "Уничтожить их!"
 AlgeriaFocus.70.t: "[FROM.GetNameDef] выходит на контакт с тубу"
 AlgeriaFocus.70.d: "Мы получили сообщения о том, что Алжир начал вооружать повстанцев Тубу на севере нашей страны. Если Алжир вторгнется, эти повстанцы наверняка присоединятся к их делу."
 AlgeriaFocus.70.a: "Тревожно"
 AlgeriaFocus.71.t: "[FROM.GetNameDef] предлагает совместную добычу полезных ископаемых"
 AlgeriaFocus.71.d: "Правительство [FROM.GetAdjective] предложило совместное освоение урановых месторождений в полосе Аозу. Это обеспечит ресурсами обе наши страны в будущем. Как нам следует ответить?"
 AlgeriaFocus.71.a: "Отличная идея!"
 AlgeriaFocus.71.b: "Нам всё равно"
 AlgeriaFocus.72.t: "[FROM.GetNameDef] принимает нашу сделку"
 AlgeriaFocus.72.d: "Правительство [FROM.GetAdjective] приняло нашу сделку о совместной добыче полезных ископаемых"
 AlgeriaFocus.72.a: "Отлично"
 AlgeriaFocus.73.t: "[FROM.GetNameDef] отклоняет нашу сделку"
 AlgeriaFocus.73.d: "Правительство [FROM.GetAdjective] отклонило нашу сделку о совместной добыче полезных ископаемых"
 AlgeriaFocus.73.a: "Черт"
 AlgeriaFocus.74.t: "[FROM.GetNameDef] начинает добычу урана"
 AlgeriaFocus.74.d: "[FROM.GetNameDef] начала добычу урана в полосе Аозу. Хотя большая часть ресурсов достаётся им, мы также получаем небольшую долю, а [FROM.GetAdjective] согласились покрыть все расходы на разработку месторождения."
 AlgeriaFocus.74.a: "Хорошо"
 AlgeriaFocus.91.t: "Расширение правительства"
 AlgeriaFocus.91.d: "Теперь, когда мы у власти, нам необходимо укрепить свои позиции, чтобы проводить дальнейшие реформы, расширив базу поддержки. Две партии предложили заключить с нами союз, но на определённых условиях. Небольшая, но амбициозная партия возглавляется децентралистами, стремящимися передать власть на места и внедрить инициативы прямой демократии. Другая партия возглавляется популистами-республиканцами, стремящимися создать централизованную бюрократическую базу власти, способную выступить в роли действенной объединяющей силы порядка и справедливости, полностью противостоя децентрализации. Мы заключим союз с:"
 AlgeriaFocus.91.a: "Децентралистами"
 AlgeriaFocus.91.b: "Популистами-республиканцами"
 AlgeriaFocus.91.c: "Да, мы можем обсудить это позже"
 ALG_claim_jerusalem_for_arabs: "Заявить права арабов на Иерусалим"
 ALG_claim_jerusalem_for_arabs_desc: "Ни израильтяне, ни палестинцы не заслуживают права на этот регион. Они уже показали, что способны лишь ввергнуть его в хаос. Управлять регионом и принести туда мир и стабильность должны истинные арабы."
 ALG_claim_jerusalem_for_arabs_tt: "Мы сможем превратить §Yпретензии§! государства в Леванте в §Yнациональные территори§!"
 ALG_approach_hamas: "Наладить контакт с ХАМАС"
 ALG_approach_hamas_desc: "ХАМАС — единственная подлинная сила, противостоящая сионизму. Нам необходимо наладить более тесные связи с ним, чтобы подготовиться к свержению Израиля."
 ALG_send_fighters_to_hamas: "Отправить бойцов в помощь ХАМАС"
 ALG_send_fighters_to_hamas_desc: "Хотя палестинцы храбро сопротивляются сионистским захватчикам, простая истина заключается в том, что они в меньшинстве. Нам нужно организовать группу добровольцев, которые отправятся в Палестину и пополнят ряды ХАМАС."
 MSP_claim_jerusalem_for_arabs: "Заявить права арабов на Иерусалим"
 MSP_claim_jerusalem_for_arabs_desc: "Ни израильтяне, ни палестинцы не заслуживают права на этот регион. Они уже показали, что способны лишь ввергнуть его в хаос. Управлять регионом и принести туда мир и стабильность должны истинные арабы."
 MSP_approach_hamas: "Наладить контакт с ХАМАС"
 MSP_approach_hamas_desc: "ХАМАС — единственная подлинная сила, противостоящая сионизму. Нам необходимо наладить более тесные связи с ним, чтобы подготовиться к свержению Израиля."
 MSP_send_fighters_to_hamas: "Отправить бойцов в помощь ХАМАС"
 MSP_send_fighters_to_hamas_desc: "Хотя палестинцы храбро сопротивляются сионистским захватчикам, простая истина заключается в том, что они в меньшинстве. Нам нужно организовать группу добровольцев, которые отправятся в Палестину и пополнят ряды ХАМАС."
 MSP_condemn_china: "Осудить Китай"
 MSP_condemn_china_desc: "Обращение Китая со своими коренными мусульманами отвратительно и заслуживает осуждения"
 MSP_improve_relations_with_algeria: "Улучшить отношения с Египтом"
 MSP_improve_relations_with_algeria_desc: "У Турции непростая история отношений с Египтом, главным образом из-за наших прошлых конфликтов. Мы все на одной стороне, и нам не следует быть столь холодными по отношению к египтянам"
 MSP_work_together_with_BSEC: "Сотрудничать с ОЧЭС"
 MSP_work_together_with_BSEC_desc: "ОЧЭС (Организация черноморского экономического сотрудничества) — организация, нацеленная на обеспечение процветания в Причерноморье. В её состав входят страны, расположенные вокруг Чёрного моря, а также некоторые страны Южных Балкан. Нам необходимо наладить сотрудничество с этими странами ради взаимной выгоды"
 MSP_fixing_ideals: "Восстановление идеалов"
 AlgeriaInvestment.1.t: "[ALG.GetNameDef] приглашает нас инвестировать в их проекты"
 AlgeriaInvestment.1.desc: "Выйдя из десятилетия гражданской войны, правительство [ALG.GetNameWithFlag] приглашает нас инвестировать в ряд проектов по всей стране. Решение о вложении капитала остаётся за нами. Инвестиции дадут нам влияние в Алжире, но с учётом того, что во внутренних районах страны всё ещё действуют вооружённые исламистские группировки, риск для наших активов реален."
 AlgeriaInvestment.1.a: "Инвестировать в их инфраструктуру!"
 AlgeriaInvestment.1.b: "Инвестировать в их гражданскую промышленность!"
 AlgeriaInvestment.1.c: "Инвестировать в их сферу услуг!"
 AlgeriaInvestment.1.d: "Лучше не рисковать."
 AlgeriaInvestment.2.t: "[FROM.GetNameDef] инвестировала в нашу инфраструктуру!"
 AlgeriaInvestment.2.d: "После нескольких дней переговоров [FROM.GetNameWithFlag] согласилась инвестировать в нашу инфраструктуру в обмен на минимальные уступки с нашей стороны. Эти инвестиции пойдут на пользу нашему сельскому населению."
 AlgeriaInvestment.2.a: "Мы благодарны им за помощь!"
 AlgeriaInvestment.3.t: "[FROM.GetNameDef] инвестировала в нашу гражданскую промышленность!"
 AlgeriaInvestment.3.d: "После нескольких дней переговоров [FROM.GetNameWithFlag] согласилась помочь нам построить ряд гражданских заводов в обмен на незначительные уступки с нашей стороны. Эти инвестиции пойдут на пользу промышленному сектору нашей страны и будут способствовать её модернизации."
 AlgeriaInvestment.3.a: "Мы благодарны им за помощь!"
 AlgeriaInvestment.4.t: "[FROM.GetNameDef] инвестировала в нашу сферу услуг!"
 AlgeriaInvestment.4.d: "После нескольких дней переговоров [FROM.GetNameWithFlag] согласилась инвестировать в нашу сферу услуг, построив ряд офисов, в обмен на незначительные уступки с нашей стороны. Эти инвестиции пойдут на пользу финансовому сектору нашей страны и будут способствовать её модернизации."
 AlgeriaInvestment.4.a: "Мы благодарны им за помощь!"
 AlgeriaInvestment.5.t: "[FROM.GetNameDef] отказалась инвестировать!"
 AlgeriaInvestment.5.d: "После нескольких дней переговоров [FROM.GetNameWithFlag] отклонила наше предложение об инвестициях, сославшись на то, что деловой климат в нашей стране пока недостаточно безопасен, и заявила, что будет тщательно оценивать возможные инвестиционные сделки с нами в будущем."
 AlgeriaInvestment.5.a: "Похоже, нам нужно ещё поработать!"
 AlgeriaInvestment.6.t: "Алжир ищет ближневосточные инвестиции после вступления в ВТО"
 AlgeriaInvestment.6.d: "С недавним вступлением во Всемирную торговую организацию (ВТО) Алжир рассчитывает на увеличение притока капитала для стимулирования экономического развития. Официальные лица обращаются к странам Ближнего Востока с призывом к расширению сотрудничества и инвестиций в ключевые отрасли. Этот шаг свидетельствует о приверженности Алжира использованию международных партнёрств для обеспечения роста и стабильности в регионе."
 AlgeriaInvestment.7.t: "Они подписывают торговое соглашение"
 AlgeriaInvestment.7.d: "Они хотели бы предложить торговое соглашение для расширения сотрудничества и открытия возможностей для будущих инвестиций"
 AlgeriaInvestment.7.a: "Конечно"
 AlgeriaInvestment.6.a: "Подписать торговое соглашение"
 AlgeriaInvestment.6.b: "Инвестировать в завод"
 AlgeriaInvestment.6.c: "Нет, спасибо"
 Algeria.11.t: "[ALG.GetNameDef] просит нашей защиты"
 Algeria.11.d: "После десятилетий беспорядков алжирское правительство опасается возобновления войны или внешнего вмешательства и вторжения. Президент [ALG.GetNameWithFlag] [ALG.GetLeader] посетил Чжуннаньхай и обратился к генеральному секретарю [CHI.GetLeader] с просьбой о заключении оборонного договора. Если мы согласимся защищать их, мы сможем гарантировать их нахождение в нашей сфере влияния, но при этом на нас также ляжет обязательство защищать [ALG.GetNameWithFlag] от внешних угроз, а также оказывать содействие в поддержании стабильности в стране, особенно в противостоянии повстанческому движению исламских экстремистов-салафитских джихадистов £GFX_ALG_salafist_jihadism. С учётом положения нашей страны, следует ли нам подписать оборонный договор с [ALG.GetLeader]?"
 Algeria.11.a: "Ещё один Железный брат!"
 Algeria.11.b: "У нас нет ресурсов для такого договора!"
 Algeria.12.t: "[CHI.GetNameDef] согласилась защищать нас"
 Algeria.12.d: "Благодаря нашим дипломатическим усилиям генеральный секретарь [CHI.GetNameWithFlag] [CHI.GetLeader] официально подписал оборонный договор с нашим президентом [ALG.GetLeader]. Подписав этот договор, [FROM.GetNameWithFlag] не только защитит нас от внешней агрессии, но и окажет содействие в поддержании нашей внутренней стабильности."
 Algeria.12.a: "Отлично!"
 Algeria.13.t: "[CHI.GetNameDef] отказалась подписывать!"
 Algeria.13.d: "Несмотря на визит нашего президента [ALG.GetLeader] в [CHI.GetNameWithFlag] с целью получения содействия в сфере безопасности, [CHI.GetLeader] явно не был расположен обсуждать какие-либо договоры. [CHI.GetLeader] заявил нашему президенту: «Мы всегда привержены региональной безопасности и стабильности». Но совершенно очевидно, что приверженность [CHI.GetLeader] остаётся лишь на словах — защищать себя нам придётся самостоятельно."
 Algeria.13.a: "Какое разочарование"
