 BAN_ALL_PARTIES: "Запретить все партии"
 ALLOW_ALL_PARTIES_TT: "§HОтказаться от однопартийной системы§!"
 ALLOW_ALL_PARTIES_TT_DELAYED: "Пришло время отменить наш полный запрет на другие партии.\n\n§YУсловие:§!\n[!allow_all_parties_button_click_enabled]\n§YЭффекты:§!\n[!allow_all_parties_button_click]"
 BAN_ALL_PARTIES_TT: "§HОбъявить однопартийное государство§!"
 BAN_ALL_PARTIES_TT_DELAYED: "Как единственная правящая партия, управляющая правительством, мы можем законодательно объявить все остальные политические партии незаконными.\n\nДа здравствует партия!\n\n§YУсловие:§!\n[!ban_all_parties_button_click_enabled]\n§YЭффекты:§!\n[!ban_all_parties_button_click]"
 set_partyall_banned_tt: "Запрещает все партии, кроме §Y[show_ruling_party]§!\n"
 set_partyall_allowed_tt: "Снимает запрет со всех партий в нашей стране\n"
 revolt_party_TT: "§HStart Revolution as [party_name_by_index] (§Y[?party_pop_array^v|%1]§!)§!\n\n§YPrerequisite:§!\n[!revolt_button_click_enabled]\n§YEffects:§!\n[!revolt_button_click]"
 boost_party_TT: "§HBoost [party_name_by_index] (§Y[?party_pop_array^v|%1]§!)§!\nIn a bid to dilute the power of our real political opponents, we can use our political machine to boost the popularities of other parties\n\n§YPrerequisite:§!\n[!boost_button_click_enabled]\n§YEffects:§!\n[!boost_button_click]"
 attack_party_TT: "§HAttack [party_name_by_index] (§Y[?party_pop_array^v|%1]§!)§!\nWe can use disinformation campaigns and dirt we have collected on major parties outside the government to strike hard at their popularity - ensuring they aren't in a position to challenge our position of power. Since any attention at all will bring popularity to minor parties, this will only work with major parties over the election threshold of [?election_threshold|%0]\n\n§YPrerequisite:§!\n[!attack_button_click_enabled]\n§YEffects:§!\n[!attack_button_click]"
 ban_party_TT: "§HBan [party_name_by_index] (§Y[?party_pop_array^v|%1]§!)§!\nBy outlawing a political party or movement makes sure they can never win power through elections, and persecuting their members easier.\n\n§YPrerequisite:§!\n[!ban_button_click_enabled]\n§YEffects:§!\n[!ban_button_click]"
 allow_party_TT: "§HLegalize [party_name_by_index] (§Y[?party_pop_array^v|%1]§!)§!\nThe time has come for us to lift our ban and let their members run for public offices and organize legally.\n\n§YPrerequisite:§!\n[!allow_button_click_enabled]\n§YEffects:§!\n[!allow_button_click]"
 ban_party_effect_tt: "Запрещает [party_index_L]"
 unban_party_effect_tt: "Легализует [party_index_L]"
 party_popularity_check_TT: "[party_name_by_index] ([?party_pop_array^v|%1]) > [?pop|%1] популярности"
