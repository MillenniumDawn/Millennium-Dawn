 SPYSAT9: "SPYSAT 2045"
 SPYSAT9_desc: "Satellites militaires ou de renseignement conçus pour mener un éventail de missions, du recueil de renseignement à la détection d'engins nucléaires.\n\nSatellite de reconnaissance (SPYSAT 2045) :\nLe satellite §Y$SPYSAT9$§! est un satellite de reconnaissance d'une résolution d'image de §Y0,007 m GSD§!. Ils sont requis pour un système de satellites de reconnaissance §Y0,007 m GSD§!.\n§YGSD§! - §YGround Sample Distance§! : le GSD est la distance entre les centres de pixels mesurée au sol. Pour ce satellite, les emplacements d'image des pixels adjacents sont distants de 0,007 m au sol."
