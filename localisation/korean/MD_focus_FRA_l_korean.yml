 france_md.555.t: "정치 노선 안내서"
 france_md.555.d: "정치 트리의 대부분의 노선은 2002년 선거에서 승리하게 하거나 이후 선거에서 직접 선출함으로써 잠금 해제할 수 있습니다. 그러나 일부 노선은 현실성과 논리상의 이유로 처음에는 접근할 수 없습니다. 이 안내서를 따라 이러한 노선에 접근할 수 있습니다. \n보나파르트주의 및 왕당파 노선을 잠금 해제하려면 국민전선/국민연합(민족 포퓰리즘)을 선출하십시오. \\"불안 해소에 집중\\" 국가 중점을 완료하면 급진 세력이 도움을 제안하는 사건이 발생합니다. 그들이 세력을 얻도록 허용하고 쿠데타로 권력에서 축출되면 보나파르트주의자 또는 왕당파를 집권시킬 수 있습니다. \n프랑스 코뮌도 과정은 같습니다. \\"혁명 대신 개혁\\" 국가 중점을 완료하고 극단주의자들이 당신을 권력에서 축출하도록 두십시오. \n굴복하지 않는 프랑스 노선의 경우, 사회당(서구 사회주의)을 선출하십시오. \\"노조와의 단절\\" 국가 중점을 완료하십시오. 이는 사회당의 붕괴를 일으켜 굴복하지 않는 프랑스 노선을 잠금 해제합니다. \n그 밖의 정당 변경은 여러 사건에 걸쳐 분산되어 있지만, 현재로서는 외형상의 요소에 불과합니다."
 france_md.555.a: "안내해 주셔서 감사합니다"
 france_md.556.t: "성공적인 해산"
 france_md.556.d: "의회는 더 이상 우리나라에 대한 시민들의 바람을 진정으로 반영하지 못했습니다. 의회를 해산함으로써 동료 시민들은 정부 상황이 얼마나 더 나빠질 수 있었는지를 알게 되었습니다. 그들은 극단주의자들보다 우리를 선택함으로써 옳은 선택을 했습니다."
 france_md.556.a: "훌륭한 생각이었다"
