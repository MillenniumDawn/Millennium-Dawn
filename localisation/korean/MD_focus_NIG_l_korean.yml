l_korean:
 NIG_religious_divide: "종교적 분열"
 NIG_religious_divide_desc: "나이지리아는 국가 안정도를 위협하는 깊은 종교적 긴장과 종파 간 폭력에 직면해 있습니다. 우리 국민은 남부의 기독교와 북부의 이슬람으로 극명하게 나뉘어 있어 복잡한 사회정치적 지형을 이룹니다. 이러한 종교적 분열을 신중히 관리하지 않으면 내란 혹은 더한 사태를 맞을 위험이 있습니다. 종교적 공존에 관해 지금 내리는 정책 결정은 여러 세대에 걸쳐 나이지리아의 미래를 빚고, 지속적인 국가 단결을 이룰 수 있을지를 좌우할 것입니다."
 NIG_nigerian_sects: "나이지리아의 종파"
 NIG_nigerian_sects_desc: "나이지리아의 이슬람은 위대한 말리 제국에 뿌리를 두고 있습니다. 신앙은 다양한 전통의 직물로 발전했으며, 나이지리아에는 수니파 이슬람 외에도 수많은 이슬람 종파가 있습니다. 시아파 공동체, 살라피 운동, 카디리야 수피, 티자니야 교단 등 이 나라의 복잡한 종교 지형을 이루는 여러 독자적 신학 전통이 포함됩니다."
 NIG_teachings_of_the_quaran: "쿠란의 가르침"
 NIG_teachings_of_the_quaran_desc: "쿠란은 인류를 올바른 삶으로 이끌고 그 지혜에서 벗어난 결과를 경고하기 위해 계시된 영원한 성전입니다. 나이지리아의 이슬람 전통이 계속 발전하는 만큼, 우리의 젊은 세대가 이 가르침을 깊이 이해하여 문화유산을 보존하고 국가로서의 도덕적 토대를 강화하는 것이 필수적입니다."
 NIG_uniting_the_faiths: "신앙의 통합"
 NIG_uniting_the_faiths_desc: "이슬람의 종류는 크고 많습니다. 그러나 이들은 자주 의견이 갈려 서로 합의하지 못합니다. 나이지리아와 아프리카 이슬람의 더 큰 미래를 지키기 위해 신앙들은 통합되어야 합니다."
 NIG_beliefs_of_the_mosque: "모스크의 신앙"
 NIG_beliefs_of_the_mosque_desc: "모스크는 성스러운 장소입니다. 모스크의 신앙은 그 신성한 전당을 거니는 모든 이들에게 존중받아야 하며, 존중받을 것입니다."
 NIG_islamic_preachings: "이슬람 설교"
 NIG_islamic_preachings_desc: "우리는 이슬람 설교자들을 제재하여 이 나라에서 안정감을 얻기 시작해야 합니다."
 NIG_secure_tradtionalist_support: "이슬람 전통주의"
 NIG_secure_tradtionalist_support_desc: "전통은 우리 자신과 우리나라, 그리고 우리 삶의 방식을 지키는 데 필요합니다. 나이지리아의 신앙을 보존하고 키우기 위해 이슬람 전통주의자들과 더 큰 협력을 추구할 때입니다."
 NIG_continue_sharia_law: "샤리아 법 유지"
 NIG_continue_sharia_law_desc: "샤리아 법은 우리가 따라야 하는 체제입니다. 북부 관리들과 연방 정부는 시위를 벌인 끝에 샤리아 법을 유지하는 것이 우리의 이익에 부합한다고 결정했습니다."
 NIG_line_the_government: "정부 요직 충원"
 NIG_line_the_government_desc: "일부 관리는 정부에 기독교인이 지나치게 많다고 봅니다. 정부를 더 많은 이슬람 후보자와 고문으로 채울 때입니다."
 NIG_contract_boko_haram: "보코하람과 접촉"
 NIG_contract_boko_haram_desc: "북동부의 신비한 살라피 집단이 더 큰 이슬람 전통을 추구하며 그 지역에서 움직임을 보이기 시작했습니다. 이들과 접촉해 볼 만한 가치가 있을지도 모릅니다."
 NIG_convert_the_christians: "기독교인 개종"
 NIG_convert_the_christians_desc: "기독교인들은 자신들의 경전이 자신들을 길을 잃게 만든다는 것을 알아야 합니다. 진정한 번영과 구원으로 가는 길은 우리의 삶의 방식임을 보이고 논의할 때입니다."
 NIG_justify_radcialism: "급진주의 정당화"
 NIG_justify_radcialism_desc: "급진주의는 어떤 종교든 성장하는 데 중요합니다. 신앙의 형제들은 언제나 우리의 지지를 받아야 합니다."
 NIG_disarm_the_militias: "민병대 무장 해제"
 NIG_disarm_the_militias_desc: "Christian militias have started minor armed riots and revolts in the southern portion of the country. We should mobilize and quickly disarm the militias."
 NIG_a_new_wave_of_extremism: "새로운 극단주의의 물결"
 NIG_a_new_wave_of_extremism_desc: "유일한 극단주의의 형태는 이슬람 가르침이 이끄는 새로운 통치 형태를 수립하고 쿠란과 그 가르침에 대한 신앙을 지키는 것입니다."
 NIG_fifty_fifty: "반반"
 NIG_fifty_fifty_desc: "우리나라는 이슬람과 기독교로 정확히 반으로 갈라져 있습니다. 결과는 칼날 위에 놓여 있습니다."
 NIG_tolerance: "관용"
 NIG_tolerance_desc: "어느 한쪽 신앙을 국교로 선포하면 과도한 긴장을 일으킬 것입니다. 두 신앙에 대한 관용을 법으로 명문화하는 편이 정치적으로 훨씬 건전합니다."
 NIG_islamic_tolerance: "이슬람 관용"
 NIG_islamic_tolerance_desc: "이슬람교는 북부 국가들에게 중요합니다. 우리는 젊은이들과 남부 사람들에게 믿음을 용인하는 것에 대해 교육을 시작해야 합니다."
 NIG_christian_faiths: "기독교 신앙"
 NIG_christian_faiths_desc: "기독교는 주로 이 나라 남부에 분포합니다. 신앙들을 하나로 모으는 데 도움이 되기를 바라며, 이들이 이슬람에 대해 더 배우도록 장려할 것입니다."
 NIG_land_of_harmony: "조화의 땅"
 NIG_land_of_harmony_desc: "신앙들은 대부분의 지역에서 들어 보지 못한 공존의 길을 걷기 시작했습니다. 우리는 이 소중한 균형을 지켜 우리의 고향을 진정한 조화의 땅으로 만들 것입니다."
 NIG_christian_theology: "기독교 신학"
 NIG_christian_theology_desc: "기독교는 세계에서 가장 널리 신봉되는 종교 중 하나입니다. 이는 이곳 나이지리아에서도 마찬가지입니다. 기독교 신앙과의 신학 토론을 더 장려해야 합니다."
 NIG_education_from_the_bible: "성경에 기초한 교육"
 NIG_education_from_the_bible_desc: "성경은 하나님의 책입니다. 우리가 어떻게 살아야 하고 삶을 어떻게 이어 가야 하는지 많은 것을 가르쳐 줄 것입니다."
 NIG_christian_missionaries: "기독교 선교사"
 NIG_christian_missionaries_desc: "참된 기독교 신앙을 따르지 않는 이들을 개종시키기 위해 선교사를 파견하기 시작해야 합니다."
 NIG_rights_of_the_church: "교회의 권리"
 NIG_rights_of_the_church_desc: "선량한 기독교인은 우리 교회의 권리를 결코 짓밟지 않습니다. 지금도, 앞으로도 결코."
 NIG_investments_in_the_church: "교회 투자"
 NIG_investments_in_the_church_desc: "지역 교회들이 서서히 황폐해졌습니다. 이 매우 중요한 건물들을 개선하는 방안을 살펴봐야 합니다."
 NIG_end_sharia_law: "샤리아 법 폐지"
 NIG_end_sharia_law_desc: "북부의 샤리아 법은 이 나라의 재앙입니다. 다수의 힘을 이용해 시위하고 우리의 의제를 밀어붙여 샤리아 법을 완전히 끝내야 합니다."
 NIG_secure_christian_support: "기독교인 지지 확보"
 NIG_secure_christian_support_desc: "남부의 기독교인 다수 지역에는 우리 관할의 가장 큰 도시들이 포함되어 있습니다. 그곳 사람들은 정부를 지지해야 합니다."
 NIG_christian_cabinet: "기독교 내각"
 NIG_christian_cabinet_desc: "기독교인이 다수를 이루는 지역에는 가장 많은 산업과 금융 중심지가 있습니다. 따라서 이들 지역과의 유대를 강화하도록 내각을 재편해야 합니다."
 NIG_end_boko_haram_extremism: "보코하람 소탕"
 NIG_end_boko_haram_extremism_desc: "보코하람은 이 나라의 재앙입니다. 나이지리아의 질서를 회복하려면 이들을 제압해야 합니다."
 NIG_embrace_the_chrisitans: "기독교인 포용"
 NIG_embrace_the_chrisitans_desc: "우리는 기독교인을 포용하고 북부의 이들을 규탄해야 합니다."
 NIG_christian_radicals: "기독교 급진파 육성"
 NIG_christian_radicals_desc: "더 급진적인 기독교인들에게 정부의 중요한 자리를 맡겨 힘을 실어 주는 편이 우리에게 최선의 이익일지도 모릅니다."
 NIG_rise_of_boko_haram: "보코하람의 부상"
 NIG_rise_of_boko_haram_desc: "사람들이 보코하람의 깃발 아래 결집하면서 나이지리아 북부에서 강력한 운동이 등장했습니다. 지역 이슬람 지도자들은 이 떠오르는 세력을 받아들여 자신들의 지도 아래 공동체를 동원했습니다. 지지와 영향력이 커지면서, 보코하람은 우리 국가를 변혁하고 이슬람 원칙의 엄격한 준수로 규정되는 영광스러운 미래로 이끌 태세를 갖췄습니다!"
 NIG_align_to_isis: "IS와의 제휴"
 NIG_align_to_isis_desc: "참된 칼리파국은 오직 하나뿐이며, 그것은 레반트의 이슬람 국가입니다. 우리는 자칭 칼리파에게 흔들림 없는 충성을 맹세하고 그들의 세계적 지하드에 합류할 것입니다. ISIS와 보조를 맞추면 우리의 입지가 강화되고 그들의 자원, 훈련, 극단주의 지지자들의 국제 네트워크에 접근할 수 있습니다."
 NIG_west_african_caliphate: "서아프리카 칼리파국"
 NIG_west_african_caliphate_desc: "중동의 자칭 칼리파는 참된 길에서 벗어난 거짓 지도자입니다. 우리 국민의 열망을 진정으로 대변하는 정통 서아프리카 칼리파국을 세워 우리 자신의 운명을 개척해야 합니다. 우리의 올바른 인도 아래 신자들을 이끌어 지역 전체에 전례 없는 위대함과 번영을 이룰 것입니다!"
 NIG_recognize_the_islamic_state: "이슬람 국가 인정"
 NIG_recognize_the_islamic_state_desc: "Formal recognition of the Islamic States is crucial for establishing diplomatic legitimacy and securing vital support from other Islamist nations. This strategic alliance will strengthen our position on the global stage and provide access to resources necessary for our continued expansion."
 NIG_instigate_african_salafism: "아프리카 살라피즘 선동"
 NIG_instigate_african_salafism_desc: "Salafism is a purist interpretation of Islam that emphasizes returning to the traditions of the righteous predecessors. We must spread this ideology throughout Africa, establishing a network of like-minded believers who will transform the continent into a stronghold of true Islamic faith and practice."
 NIG_support_neighboring_extremists: "이웃 극단주의자 지원"
 NIG_support_neighboring_extremists_desc: "이웃 나라에는 우리의 대의에 동조하는 상당수의 이슬람 인구가 있습니다. 이들 신자 중 다수가 은밀히 우리의 급진적 이념을 지지하여 확장을 위한 비옥한 토양을 이루고 있습니다. 이 잠재적 동맹을 찾아내고 그들의 지지를 키워 국경을 넘어 우리 운동을 강화해야 합니다."
 NIG_arm_other_extremists: "다른 극단주의자 무장"
 NIG_arm_other_extremists_desc: "전 세계의 극단주의 세력은 억압적이라고 여기는 정권을 전복하려 합니다. 뜻을 같이하는 이 집단들에 무기, 훈련, 재정 지원을 제공함으로써 국경 너머로 영향력을 넓히고 우리의 비전을 공유하는 동맹 운동의 네트워크를 만들 수 있습니다. 이 전략적 투자는 이들 집단이 우리의 적들을 불안정하게 하고 전 세계에서 우리의 이념적 의제를 진전시키면서 보답할 것입니다."
 NIG_build_ties_with_extremist_groups: "극단주의자와 유대 구축"
 NIG_build_ties_with_extremist_groups_desc: "전 세계의 뜻을 같이하는 극단주의 조직과 전략적 관계를 맺으면 우리의 비전을 공유하는 강력한 동맹 네트워크를 만들 수 있습니다. 이러한 연결은 귀중한 자원, 전술 지식, 국제적 지원을 제공하여 우리의 입지를 강화하고 국경 너머로 영향력을 확대할 것입니다. 이들 집단과의 신중한 조율을 통해 필요할 때는 책임을 부인할 여지를 유지하면서 공동의 의제를 진전시킬 수 있습니다."
 NIG_claim_niger: "니제르 영유권 주장"
 NIG_claim_niger_desc: "니제르는 니제르 호수와 우리 국경 주변의 자원을 두고 끊임없이 우리와 경쟁해 왔습니다. 그 지역의 무슬림들은 서아프리카 칼리파국에 대한 우리의 주장을 지지합니다."
 NIG_invade_across_the_western_border: "서부 국경 너머 침공"
 NIG_invade_across_the_western_border_desc: "서부 국경은 밀림이 우거져 있어 우리의 이익을 위해 신속히 이용할 수 있는 지역 중 하나로 드러났습니다."
 NIG_impose_sharia_law_across_nigeria: "나이지리아 전역에 샤리아 법 시행"
 NIG_impose_sharia_law_across_nigeria_desc: "샤리아 법은 검증된 확실한 법 체계입니다. 우리는 이를 국가의 모든 주에 제대로 시행해야 합니다."
 NIG_the_new_kid_on_the_block: "새로운 신참"
 NIG_the_new_kid_on_the_block_desc: "ISIS와 ISIL은 현재 살라피스트 극단주의가 언급될 때 주된 그룹으로 떠오르고 있습니다. 그러나 아무도 새로운 세력에 대해 예상하지 못합니다."
 NIG_the_islamic_states: "그 이슬람 국가"
 NIG_the_islamic_states_desc: "독립된 주가 아니라 하나의 단위로서 활동하기 시작하자고 제안해야 합니다. 우리는 이슬람 국가들입니다."
 NIG_invade_central_africa: "중앙아프리카 침공"
 NIG_invade_central_africa_desc: "중앙아프리카는 약하며, 그곳의 무슬림 인구는 흔히 기독교 민병대에게 착취당하거나 거칠게 해를 입고 있습니다."
 NIG_local_salafism: "나이지리아 살라피즘"
 NIG_local_salafism_desc: "우리의 살라피즘은 독자적인 것이 되어야 하며, 다른 형태를 따라가서는 안 됩니다."
 NIG_declare_a_new_caliph: "칼리파국 선포"
 NIG_declare_a_new_caliph_desc: "이제 지상에 우리의 왕국을 선포할 때입니다. 서아프리카 칼리파국이 일어설 때입니다!"
 NIG_federal_government_of_nigeria: "나이지리아 연방 정부"
 NIG_federal_government_of_nigeria_desc: "나이지리아 정부는 상당한 힘을 지니고 있지만, 효율을 해치는 만연한 부패에 시달리고 있습니다. 낭비성 지출을 없애고 부패한 관리를 기소하며 국내외에서 나이지리아의 평판을 회복하기 위해 포괄적 개혁을 시행해야 합니다."
 NIG_constiution_reforms: "헌법 개혁"
 NIG_constiution_reforms_desc: "나이지리아 헌법은 현대의 도전에 대응하기 위해 포괄적인 개정이 필요합니다. 민주주의를 강화하고 시민의 자유를 보호하며 연방 정부와 주 사이의 권력을 공평하게 분배할 개정안을 논의하기 위한 국가적 대화를 시작해야 합니다."
 NIG_the_nigerian_model: "나이지리아 모델"
 NIG_the_nigerian_model_desc: "나이지리아의 연방 정부 체제는 미국에서 상당한 영감을 얻었으며, 행정·입법·사법의 삼권으로 이루어진 대통령제 민주주의를 특징으로 합니다. 이 모델은 나이지리아 고유의 문화적·정치적 환경에 맞게 조정되었으며, 연방 정부와 36개 주 사이의 권력 균형을 도모합니다."
 NIG_the_pdp: "인민민주당"
 NIG_the_pdp_desc: "1998년에 창당된 국민민주당(PDP)은 나이지리아 정치 지형의 중도우파를 대표합니다. 이 나라의 지배적인 정치 세력 중 하나로서, PDP는 수십 년 동안 나이지리아 정치에서 막강한 영향력을 유지해 왔습니다. 이 당은 사회 문제에서는 민족 보수주의를 받아들이면서도 경제 면에서는 경제적 자유주의를 옹호하여, 자유 시장과 기업 활동에 대한 정부 개입 축소를 추진합니다. 나이지리아 남부 전역에서의 강력한 입지는 이 당이 국가 민주주의 체제의 초석으로 자리 잡는 데 기여했습니다."
 NIG_the_anpp: "[Root.anpp_pdc_name_switch]"
 NIG_the_anpp_desc: "[Root.anpp_pdc_desc_switch]"
 NIG_anpp_1: "전 나이지리아 인민당"
 NIG_anpp_1_desc: "전 나이지리아 인민당은 1998년 말, 이슬람교도가 다수인 북부 지역의 강력한 지지를 받는 우익 보수 정치 세력으로 창당되었습니다. 초기에는 사회적 보수주의와 신자유주의 경제 정책을 받아들였으며, ANPP는 종교적 호소력과 지역적 기반으로 차별화되었습니다. 시간이 흐르면서 이 당은 나이지리아의 변화하는 정치 환경에 적응하여 이념적 입장을 점차 좌측으로 옮겼으나, 핵심 지지 기반인 북부는 그대로 유지했습니다."
 NIG_anpp_2: "전진보 의회"
 NIG_anpp_2_desc: "2013년 ANPP, APGA 및 여러 정치 단체가 역사적인 합당을 통해 결성한 전진보 의회는 나이지리아 정치에서 지배적인 중도좌파 세력으로 자리매김했습니다. 이 당은 진보적 사회 개혁과 경제적 포퓰리즘을 함께 표방하며, 부의 재분배와 핵심 부문에 대한 정부 개입 확대를 주장합니다. 탄탄한 풀뿌리 조직을 바탕으로 APC는 무슬림이 다수인 북서부와 기독교도가 다수인 남동부 양쪽에서 상당한 지지 기반을 구축했으며, 나이지리아의 전통적인 지역 및 종교 분열을 성공적으로 극복하여 진정한 전국 정치 운동을 만들어 냈습니다."
 NIG_social_conservatism: "사회보수주의"
 NIG_social_conservatism_desc: "사회 정책에 대한 PDP의 공식 입장은 보수적인 노선을 유지하는 것입니다. 올바른 전통주의를 장려하는 것이 중요합니다."
 NIG_national_health_care_service: "국민 건강 보험 제도"
 NIG_national_health_care_service_desc: "나이지리아의 보건 의료 체계는 개혁이 절실합니다. 전국의 국민이 보험 없이 지내고 있습니다. 사망률은 여전히 높으며, 둔화될 기미조차 보이지 않습니다."
 NIG_found_the_ntel: "NTEL 설립"
 NIG_found_the_ntel_desc: "나이지리아 통신 회사(NTEL)는 NITEL의 독점이 깨진 뒤 설립되었습니다. 현재는 과거 독점 기업의 후신으로서 스스로를 운영하고 있습니다."
 NIG_balanced_budgets: "균형 예산"
 NIG_balanced_budgets_desc: "The budgets in Nigeria severely need to be audited and redrawn."
 NIG_free_market: "아프리카 자유 시장"
 NIG_free_market_desc: "우리의 시장은 규제 완화와 무역 개방 절차를 시작해야 합니다. 가격을 좌우해야 하는 것은 기업이 아니라 시장입니다. 규제 완화와 무역 개방은 이곳 아프리카에서 시작되어야 합니다. 그 이후에는 다른 나라로 확대하는 것을 고려해야 합니다."
 NIG_the_way_of_bible: "성경의 길"
 NIG_the_way_of_bible_desc: "성경의 가르침에 따라 삶을 영위하는 것이 중요합니다. 우리는 전통을 향한 움직임을 계속 이어 가야 합니다."
 NIG_christian_tradtionalism: "기독교 전통주의"
 NIG_christian_tradtionalism_desc: "전통주의를 지켜 내는 것은 필수적입니다. 전통은 우리를 안전하게 지켜 주며 하나로 묶어 주는 힘입니다. 나이지리아는 하나님 아래 하나의 나라이며, 앞으로도 그러할 것입니다."
 NIG_adminstrative_reforms: "행정 개혁"
 NIG_adminstrative_reforms_desc: "우리의 행정은 개혁이 절실합니다. 절차는 관료적이고 모두에게 느립니다. 간소화 노력은 행정의 전반적인 질을 크게 향상시킬 것입니다."
 NIG_reform_the_economic_departments: "경제 부처 개혁"
 NIG_reform_the_economic_departments_desc: "정부의 경제 부처는 극도로 부패해 있으며, 나이지리아 국민을 상대로 끊임없이 횡령하고 거짓말하며 온갖 사기를 저지르는 인사들이 자리를 지키고 있습니다. 이제 새로운 경제부를 구상할 때입니다."
 NIG_found_the_icpc: "ICPC 설립"
 NIG_found_the_icpc_desc: "독립 부패행위 방지 위원회(ICPC)는 모든 수준의 정부에서 부패를 추적하고 근절하는 데 전념합니다. 또한 국민을 교육하고 부패와의 싸움에 대한 대중의 지지를 이끌어 내고자 합니다. 국민과 나이지리아의 미래를 위해 이 기관에 투자하는 것이 중요합니다."
 NIG_cut_the_waste: "낭비 삭감"
 NIG_cut_the_waste_desc: "정부 지출의 충격적일 만큼 큰 부분이 실로 낭비입니다. 예산 배분을 재검토하여 전방위적으로 지원금을 삭감해야 합니다."
 NIG_foreign_grants: "해외 보조금"
 NIG_foreign_grants_desc: "해상의 해적 행위, 북부의 종교 분쟁, 남부의 니제르 삼각주 해방운동 때문에 국제 투자가 정체되었습니다. 고문들은 외국 대사들을 초청하면 보조금이나 기타 투자를 얻을 수 있을 것이라고 말합니다."
 NIG_piracy_and_militias: "해적과 민병대"
 NIG_piracy_and_militias_desc: "해적과 종교 민병대가 전국 곳곳에서 날뛰고 있습니다. 우리 경찰력은 이러한 문제에 대처하기에 장비가 심각하게 부족합니다. [NIG.GetLeader] 및 정부는 이 문제들을 해결할 방법을 길게 논의해 왔습니다."
 NIG_simpify_government_processes: "정부 절차 간소화"
 NIG_simpify_government_processes_desc: "정부 절차는 느리고 비용이 많이 듭니다. 이용 빈도가 더 높은 서비스에 집중하여 관료제 전체를 강화할 수 있습니다."
 NIG_the_togo_triangle: "'토고' 삼각지대"
 NIG_the_togo_triangle_desc: "'토고' 삼각지대는 니제르 강 삼각주 인근의 불법 해상 석유 시장입니다. 이는 수익성 높은 우리 석유 산업과 나날이 발전하는 우리나라에 오점이 되고 있습니다. 수출량을 늘리고 위대한 조국의 발목을 잡을 우려가 있는 다른 문제들에 맞서려면 이 삼각지대를 반드시 처리해야 합니다."
 NIG_northern_strength: "북부의 힘"
 NIG_northern_strength_desc: "ANPP(또는 PDC)는 지지의 상당수를 북부 주들에서 얻습니다. 가장 큰 지지층을 위한 선거 운동을 계속하는 것이 우리에게 이로울 수 있습니다."
 NIG_allocation_of_rights: "권리의 배분"
 NIG_allocation_of_rights_desc: "비대하고 위압적인 정부 아래에서 국민의 권리가 짓밟히는 일이 있을 수 있습니다. 우리는 국민을 위하고 국민에 의한 정부가 되어야 합니다."
 NIG_progressive_conservatism: "진보적 보수주의"
 NIG_progressive_conservatism_desc: "북부의 이슬람 전통주의자들로부터 지지를 얻고 있음에도 불구하고, 우리의 사회 정책은 반대 세력에 비해 진보적입니다. 남부 지역에서 계속 지지를 쌓아 가는 것이 유용할 수 있습니다."
 NIG_keynesian_economic_policies: "케인스주의 경제 정책"
 NIG_keynesian_economic_policies_desc: "PDC의 경제 정책은 흔히 케인스의 경제 이론과 궤를 같이합니다. 시장 경제에 대한 정부 개입을 강화하고, 이러한 정책을 통해 경제가 국민과 함께, 국민을 위해 작동하도록 하려 합니다."
 NIG_nigerian_socialism: "나이지리아 사회주의"
 NIG_nigerian_socialism_desc: "Even the most left-minded individuals in Nigeria still follow a more conservative approach to Social Democracy. It is time we stop modeling after other nations and decide on social policy that works for the people here. "
 NIG_state_run_markets: "국영 시장"
 NIG_state_run_markets_desc: "최선의 경우라 해도, 어떠한 통제나 규제도 없다면 시장은 스스로를 나락으로 몰고 갈 것입니다. 최악의 경우에는 이 나라의 가난한 소수를 기꺼이 이용할 것입니다."
 NIG_federal_policing: "연방 치안"
 NIG_federal_policing_desc: "The police force has no proper federal branches. Policing is often done by local forces with loose connections with our federal police. It would be to our benefit to establish more federal branches and expand our federal police force. "
 NIG_population_crisis: "인구 위기"
 NIG_population_crisis_desc: "나이지리아의 인구는 계속 폭발적으로 증가하고 있으며, 이 속도가 이어진다면 가까운 미래에 우리의 자원은 불가피하게 고갈될 것입니다. 국가의 미래를 논의해야 하며, 필요하다면 우리의 미래를 지키기 위해 더 강경한 정책을 마련해야 합니다."
 NIG_stabilize_the_regime: "정권 안정화"
 NIG_stabilize_the_regime_desc: "정부는 인기 없는 결정을 내려 왔습니다. 국민에게 다가가 그 결정이 가져오는 이점을 논의한다면 정권을 안정시킬 수 있을 것입니다."
 NIG_industrial_regulations: "산업 규제"
 NIG_industrial_regulations_desc: "산업 규제의 문제는 간단히 말해 '어디까지인가?'입니다. 대부분의 민간 기업은 잘 운영되며 이윤을 유지하고 있습니다. 그렇다면 기업 활동을 촉진하기 위해 규제를 완화해야 할까요, 아니면 수상한 행위를 하는 기업들에 대해 규제를 강화하며 지켜보아야 할까요?"
 NIG_poverty_issues: "빈곤 문제"
 NIG_poverty_issues_desc: "나이지리아는 세계 최고 수준의 경제 성장률을 자랑합니다. 평균 7~8퍼센트 정도의 성장률을 기록합니다. 그러나 이러한 급격한 성장 뒤에는 빈곤 문제가 도사리고 있습니다. 국민의 약 60퍼센트가 빈곤 속에 살고 있습니다. 국민을 돕기 위해 지방 정부와 논의를 시작할 가치가 있습니다."
 NIG_end_usaid: "USAID 종료"
 NIG_end_usaid_desc: "미국은 원조 프로그램을 통해 여전히 우리 사안에 막대한 영향력을 행사하고 있습니다. 이제 족쇄를 풀고 우리 스스로의 길을 갈 때입니다."
 NIG_petition_to_continue_usaid: "USAID 지속 청원"
 NIG_petition_to_continue_usaid_desc: "미국으로부터 받는 원조는 매우 중요합니다. 서방에서 말하듯이, ''그것이 배를 계속 떠 있게 해 줍니다''."
 NIG_expand_the_safety_net: "안전망 확충"
 NIG_expand_the_safety_net_desc: "국민은 일할 수 없을 때 의지할 안전망이 거의 없습니다. 서방 국가들에는 어떤 형태로든 국가 연금 제도가 있습니다. 이러한 발상을 참고하여 우리 국민에게 맞는 방식으로 이곳에 도입해야 합니다."
 NIG_efficent_government_spending: "효율적인 정부 지출"
 NIG_efficent_government_spending_desc: "정부 지출은 낭비 없이 효율적이어야 합니다. 여러 기관을 통합하고 보다 현대적인 체계로 개선하는 것은 우리 경제에 도움이 될 뿐입니다."
 NIG_anti_debt_agenda: "부채 감축 의제"
 NIG_anti_debt_agenda_desc: "나이지리아의 부채는 대부분 외부 계좌에 보유되어 있습니다. 부채를 줄여 정부 지원과 국내 각종 프로그램을 확대하는 것이 가치 있을 수 있습니다."
 NIG_bankers_of_africa: "아프리카의 은행가들"
 NIG_bankers_of_africa_desc: "나이지리아는 세계에서 가장 빠르게 성장하는 경제 중 하나입니다. 우리의 은행 체계에 투자하고 금융 부문을 인접국으로 확장하기 시작해야 합니다."
 NIG_water_crisis: "물 위기"
 NIG_water_crisis_desc: "나이지리아에서 물은 사치품입니다. 농민과 목축민은 중부 벨트에서 조용한 전쟁을 벌이고 있습니다. 니제르는 니제르 호수에 끊임없이 간섭하며 우리의 호수 이용권을 방해합니다. 이 위기는 반드시 해결되어야 하며, 그렇지 않으면 참담한 결과에 직면하게 될 것입니다."
 NIG_nigerian_industry: "나이지리아 산업"
 NIG_nigerian_industry_desc: "아프리카 최대의 인구를 가진 만큼, 제조업 부문을 확장하기 시작하는 것이 우리에게 이익이 될 것입니다. 많은 인구가 계속 일자리를 유지하도록 발전을 이어 가야 합니다."
 NIG_bankroll_africa: "아프리카 재정 지원"
 NIG_bankroll_africa_desc: "아프리카의 일련의 내부 분쟁, 종교 갈등, 정치적 불안정은 이곳을 위험한 투자처로 만듭니다. 다른 아프리카인들보다 더 나은 투자자가 누가 있겠습니까?"
 NIG_reform_water_legislation: "신규 물 관련 법안"
 NIG_reform_water_legislation_desc: "물 관련 법안은 국민을 더 잘 위하도록 개정되어야 합니다. 국민을 돕기 위해 수입을 늘리는 동시에 물을 비축하고 배급하기 시작해야 합니다."
 NIG_unmatched_growth: "비할 데 없는 성장"
 NIG_unmatched_growth_desc: "우리의 성장은 결코 멈추지 않을 것이며 누구도 따라올 수 없을 것입니다. 니제르 호수는 다른 모든 자원처럼 활용되어야 하며, 강 삼각주에는 생산을 위한 댐이 필요합니다. 우리는 가능한 한 빠르게 성장하며 국민의 발전을 도와야 합니다."
 NIG_nigerian_agricultural_belt: "나이지리아 농업 지대"
 NIG_nigerian_agricultural_belt_desc: "나이지리아의 중부 벨트는 대체로 이 나라의 농업 지역입니다. 농장, 목장, 식품 제조 공장이 풍경 곳곳에 자리 잡고 있습니다."
 NIG_education_programs: "교육 프로그램"
 NIG_education_programs_desc: "나이지리아의 문해율은 받아들일 수 없는 수준으로, 52%에서 60% 사이를 맴돌며 전 세계 국가 가운데 하위권에 위치합니다. 국민의 절반이 글을 읽지 못합니다! 국민을 빈곤에서 벗어나도록 교육하려면 교육 체계가 개혁되어야 합니다."
 NIG_african_investments: "나이지리아 해외 투자"
 NIG_african_investments_desc: "세계 일부 국가들은 우리의 공공 및 민간 부문의 경제 협력과 투자 확대로 혜택을 볼 수 있습니다. 계획을 구상하여 보내기 시작하십시오!"
 NIG_abuja_road_projects: "아부자 도로 사업"
 NIG_abuja_road_projects_desc: "아부자의 도로는 적고 품질도 낮습니다. 수도의 기반시설을 개선하면 광역 도시권에 거주하는 수천 명에게 도움이 될 뿐 아니라 이 지역에서 정부의 인기도 높일 수 있습니다!"
 NIG_middle_belt_legislation: "중부 벨트 입법"
 NIG_middle_belt_legislation_desc: "중부 벨트는 그들의 생활 방식을 유지하기 위한 지원이 필요합니다. 농업이 우리 노동력의 30%를 차지하므로 이들에게 더 많은 수자원을 배분해야 합니다. 또한 농지에 물을 대고 가축에게 물을 공급할 방법도 모색해야 합니다."
 NIG_reckless_agriculture: "무모한 농업"
 NIG_reckless_agriculture_desc: "농업은 확장이 필요합니다. 우리는 인구가 급증하고 있습니다! 사람들을 먹여 살리고 부양해야 합니다."
 NIG_northern_factories: "북부 공장"
 NIG_northern_factories_desc: "나이지리아 북부 지역에는 확장을 위한 새 공장이 필요하며, 더 많은 제조 시설을 생산하여 우리에게 이익이 되도록 할 수 있습니다."
 NIG_local_arms_companies: "지역 무기 회사"
 NIG_local_arms_companies_desc: "무기 회사에 보조금을 지급하여 국내에서 더 많은 무기를 생산하도록 하는 방안을 검토해야 합니다."
 NIG_spur_regional_development: "지역 개발 촉진"
 NIG_spur_regional_development_desc: "우리 주변 지역은 본격적인 개발이 필요합니다. 인접국 및 다른 건설 회사들과 거래를 중개하여 우리와 그들의 경제를 끌어올리는 방안을 검토해야 합니다."
 NIG_support_the_people: "국민 지원"
 NIG_support_the_people_desc: "국민이 우리의 지도력과 국가로서의 우리 길에 대한 믿음을 계속 유지하려면 우리의 지원이 필요합니다. 국민이 우리를 지지해 주려는 만큼 우리도 국민을 지원해야 합니다."
 NIG_desalination_projects: "담수화 사업"
 NIG_desalination_projects_desc: "물 위기는 계속해서 우리의 선거와 정치 무대를 괴롭히고 있습니다. 담수화를 전문으로 하는 기업들과 논의하는 것이 우리에게 이로울 수 있습니다."
 NIG_nigerian_oil: "피의 석유"
 NIG_nigerian_oil_desc: "나이지리아에서 생산되는 석유는 불길한 이름을 얻었습니다. 종교 분쟁, 민병대와의 충돌, 해적 행위가 여러 문제를 일으켰고, 나이지리아산 석유는 애정 어린 어조로 '피의 석유'라 불리게 되었습니다."
 NIG_homegrown_design: "자국산 설계"
 NIG_homegrown_design_desc: "나이지리아에는 대형 무기 회사가 없습니다. 이 산업에 보조금을 지급하는 방안을 탐색해야 합니다."
 NIG_neighborly_expansion: "이웃 간 확장"
 NIG_neighborly_expansion_desc: "아프리카는 외부 열강이 아닌 아프리카인 스스로에 의해 발전되어야 합니다. 이웃 국가들에 외교 사절을 파견하여 상호 이익이 되는 확장 정책과 투자 기회를 논의함으로써 나이지리아와 지역 파트너들을 모두 강화할 수 있습니다. 이러한 관계를 키워 나감으로써, 우리의 주권을 유지하면서 서아프리카 전체에 힘을 실어 주는 경제 네트워크를 만들 수 있습니다."
 NIG_west_african_highways: "서아프리카 고속도로"
 NIG_west_african_highways_desc: "서아프리카 전역의 인구 희박 지역에서는 기반시설이 여전히 심각하게 미비합니다. 지역 내 주요 경제 중심지를 잇는 통합 고속도로망을 건설하면 무역을 촉진하고, 농촌의 시장 접근성을 개선하며, 지역 운송 거점으로서 나이지리아의 입지를 강화할 수 있습니다. 이 고속도로는 경제 발전을 촉진할 뿐 아니라 서아프리카 국가들 간의 지역 안보와 협력도 강화할 것입니다."
 NIG_agricultural_investments: "농업 투자"
 NIG_agricultural_investments_desc: "농업은 나이지리아 국민 전체의 약 30퍼센트를 고용하고 있습니다. 현대적 영농 기술, 관개 시설, 농업 교육에 투자하여 생산성을 높이고 수백만 국민의 생계를 개선해야 합니다. 장비, 비료, 가뭄에 강한 작물에 보조금을 제공함으로써 이 핵심 부문을 경제 성장 전략의 초석으로 탈바꿈시킬 수 있습니다."
 NIG_industrial_expansions: "산업 확장"
 NIG_industrial_expansions_desc: "우리의 산업은 많은 분야에서 부족합니다. 나이지리아는 주로 농산물과 석유 기반 제품으로 알려져 있습니다. 가능한 곳에 제조 시설을 건설하는 방안을 조사해 볼 가치가 있습니다."
 NIG_found_the_ndcc: "NDDC 설립"
 NIG_found_the_ndcc_desc: "니제르 삼각주 개발 위원회(NDDC)는 2000년 올루세군 오바산조 대통령이 포괄적인 권한을 부여하여 설립했으며, 석유가 풍부한 나이지리아 니제르 삼각주 지역의 지속 가능한 개발, 생태 복원, 경제적 번영을 촉진하는 것을 목표로 합니다. 이 전략적 구상은 수십 년간 이어진 환경 훼손과 사회경제적 과제를 해결하는 한편, 기반시설 개발, 교육 프로그램, 의료 개선을 통해 지역 사회가 이 지역의 막대한 석유 자원의 혜택을 누리도록 하는 것을 목표로 합니다."
 NIG_browning_contracts: "브라우닝 계약"
 NIG_browning_contracts_desc: "저명한 미국 총기 제조사 브라우닝은 생산 및 유통 계약을 위한 국제 파트너를 적극적으로 찾고 있습니다. 이 권위 있는 회사와 제휴를 맺으면 나이지리아는 첨단 무기 기술, 제조 전문 지식, 그리고 잠재적 기술 이전 협정에 접근할 수 있습니다. 이 전략적 동맹은 국내 무기 산업을 강화할 뿐 아니라 나이지리아를 서아프리카의 양질의 총기 생산 거점으로 자리매김하게 할 것입니다."
 NIG_consolidations_of_arms: "무기 통합"
 NIG_consolidations_of_arms_desc: "나이지리아 군대는 현재 비효율적으로 다양한 총기를 운용하고 있어 병참상의 어려움과 유지 비용 증가를 초래하고 있습니다. 무기고를 표준화된 무기 체계로 전략적으로 통합하면 국내 생산 라인을 구축하고, 훈련 절차를 단순화하며, 운영 비용을 대폭 줄일 수 있습니다. 이러한 표준화는 전투 준비 태세를 높이는 동시에 토착 방위 산업을 육성하여, 궁극적으로 나이지리아의 군사적 자급자족과 지역 영향력을 강화할 것입니다."
 NIG_progressive_development: "진보적 발전"
 NIG_progressive_development_desc: "우리의 발전은 어떤 선거 운동에서든 중요합니다."
 NIG_european_investments: "유럽 투자자"
 NIG_european_investments_desc: "유럽 국가들은 막대한 자본력을 갖춘 세계에서 가장 정교한 투자자들에 속합니다. 유럽 국가들과의 외교적·경제적 유대를 전략적으로 강화함으로써 나이지리아의 핵심 산업에 상당한 해외 직접 투자를 유치할 수 있습니다. 이러한 제휴는 절실히 필요한 자본을 가져올 뿐 아니라 기술 이전을 촉진하고, 일자리를 창출하며, 기반시설 현대화를 도와 성장 기회를 찾는 유럽 기업들에게 나이지리아를 아프리카 제일의 투자처로 자리매김하게 할 것입니다."
 NIG_sustainable_development: "지속 가능한 발전"
 NIG_sustainable_development_desc: "위험하게 확장하기보다는 보다 지속 가능한 발전을 모색해야 합니다. 우리의 인구는 급속히 늘어 다른 나라들을 1억 명 이상 훌쩍 앞지르고 있습니다. 우리는 국민과 우리 땅이 감당할 수 있는 수준에 맞추어 발전을 지속해야 합니다."
 NIG_extreme_industrialization: "극단적 산업화"
 NIG_extreme_industrialization_desc: "환경주의자들은 알 바 아닙니다. 땅은 사업을 개선하기 위해 존재하며, 사업은 곧 이윤입니다!"
 NIG_expansion_of_renewable_resources: "재생 자원 확대"
 NIG_expansion_of_renewable_resources_desc: "니제르 강 삼각주와 나이지리아 북부의 광대한 사막은 재생 에너지 개발에 엄청난 미개척 잠재력을 지니고 있습니다. 경제 고문들은 건조한 북부의 태양광 발전소와 니제르 삼각주를 따라 조성하는 수력 발전 사업에 투자할 것을 강력히 권고합니다. 이러한 지속 가능한 구상은 화석 연료에 대한 의존을 줄일 뿐 아니라 수천 개의 일자리를 창출하고 시간이 지남에 따라 에너지 비용을 크게 낮출 것입니다. 나이지리아를 아프리카 재생 에너지의 선도국으로 자리매김함으로써 우리의 환경적 미래와 경제적 번영을 모두 확보할 수 있습니다."
 NIG_eco_factories: "친환경 공장"
 NIG_eco_factories_desc: "나이지리아는 오염과 탄소 배출을 최소화하는 친환경 제조 시설을 도입하여 환경적으로 지속 가능한 산업 발전을 개척해야 합니다. 녹색 기술, 재생 에너지 통합, 지속 가능한 폐기물 관리 체계에 투자함으로써 우리의 공장은 경제적 경쟁력을 유지하면서 환경 관리의 모범이 될 수 있습니다. 이러한 접근법은 지역의 환경 문제를 해결할 뿐 아니라 나이지리아를 아프리카 전역의 지속 가능한 산업화 선도국으로 자리매김하게 하여, 이웃 국가들이 자국의 발전에 채택할 수 있는 청사진을 만들어 낼 것입니다."
 NIG_massive_land_clearing: "대규모 토지 개간"
 NIG_massive_land_clearing_desc: "나이지리아의 광대한 사바나 지역은 기존 개발이 거의 없는 미개척 산업 전선입니다. 이 넓고 평평한 지형은 지리적 장애물이 거의 없어 대규모 건설 사업에 이상적인 조건을 제공합니다. 공격적인 토지 개간 구상을 시행하면 활용되지 않던 이 영토를 신속하게 산업 지대로 탈바꿈시켜 수천 개의 일자리를 창출하고 제조 능력을 크게 확대할 수 있습니다. 환경 단체들이 서식지 파괴에 대한 우려를 표명했지만, 늘어나는 인구를 위한 경제적 이익을 외면할 수는 없습니다. 이 대담한 발전 전략은 나이지리아를 서아프리카의 산업 강국으로 자리매김하게 할 것입니다."
 NIG_aggresive_explotation: "공격적 개발"
 NIG_aggresive_explotation_desc: "나이지리아의 광대한 사바나 지역은 기존 개발이 거의 없는 미개척 산업 잠재력을 지니고 있습니다. 이 넓고 평평한 지형은 지리적 장애물이 적어 신속한 건설에 이상적인 조건을 제공합니다. 활용되지 않던 이 영토를 공격적으로 개발하면 수천 개의 일자리를 창출하고 제조 능력을 크게 확대할 산업 지대를 신속하게 세울 수 있습니다. 환경 문제가 존재하기는 하나, 늘어나는 인구를 위한 경제적 이익을 외면할 수는 없습니다. 이 대담한 개발 전략은 나이지리아가 서아프리카의 산업 강국이라는 입지를 굳히게 할 것입니다."
 NIG_nigerian_armed_forces: "나이지리아군"
 NIG_nigerian_armed_forces_desc: "나이지리아 군대는 아프리카에서 다섯 번째로 강한 군대로, 그 뿌리는 왕립 서아프리카 국경군(RWAFF)의 나이지리아 연대로 거슬러 올라갑니다. 오늘날 군은 나이지리아 육군, 나이지리아 해군, 나이지리아 공군의 세 가지 주요 군종으로 구성됩니다. 병력 규모는 약 16만 명으로, 나이지리아 군은 지역 안보 작전과 전 세계의 국제 평화유지 임무에서 중요한 역할을 수행하며 이 나라를 서아프리카의 핵심 군사 강국으로 자리매김하고 있습니다."
 NIG_defense_industries_of_nigeria: "나이지리아 방위 산업"
 NIG_defense_industries_of_nigeria_desc: "나이지리아 방위 산업 공사(DICON)는 나이지리아 군산복합체의 초석입니다. 해외 의존도를 줄이기 위해 설립된 이 국영 시설 네트워크는 소형 화기에서 탄약, 군용 차량에 이르기까지 모든 것을 생산합니다. 아직 발전 중이기는 하나, 이 산업은 우리의 국가 안보 전략에 필수적이며, 일자리를 창출하는 동시에 토착 방위 역량을 구축하여 나이지리아의 지역 강국으로서의 입지를 강화하고 값비싼 해외 수입에 대한 의존을 줄일 것입니다."
 NIG_the_army: "군대"
 NIG_the_army_desc: "The Nigerian Army has participated in many conflicts in its brief history. From civil war and peacekeeping missions across Africa to counter-insurgency operations against various militant groups, our ground forces have gained valuable combat experience. However, equipment shortages and organizational challenges have limited their effectiveness. By modernizing our command structure, improving training programs, and investing in new equipment, we can transform the Nigerian Army into a professional fighting force capable of defending our sovereignty and contributing to regional stability."
 NIG_air_components: "공군 구성 요소"
 NIG_air_components_desc: "나이지리아 공군은 크게 쇠퇴하여 이제는 소수의 헬리콥터와 구식 경항공기만 남았습니다. 한때 국가적 자부심의 원천이었던 우리의 항공 전력은 너무 오래 방치되어 왔습니다. 현대적인 항공기, 훈련 프로그램, 정비 시설에 대한 전략적 투자를 통해 우리 군의 이 핵심 군종을 시급히 재건해야 합니다. 항공 전력 재건은 국방뿐 아니라 대반란 작전 지원과 나이지리아의 지역 군사 강국으로서의 입지 유지를 위해서도 필수적입니다."
 NIG_resource_drives: "자원 확보 운동"
 NIG_resource_drives_desc: "나이지리아는 급속히 늘어나는 인구가 보급망에 부담을 주면서 심각한 자원 부족에 직면해 있습니다. 2억 명이 넘는 국민이 필수 물자를 요구하는 상황에서, 우리는 전략적 제휴와 국내 개발을 통해 새로운 자원 공급망을 확보해야 합니다. 이러한 부족 문제를 해결하지 못하면 산업 성장은 정체될 것이며, 경제 안정과 국가 안보 모두가 위협받게 됩니다. 이 자원 확보 운동은 채굴 효율을 극대화하는 데 집중하는 한편, 가능한 곳에서는 지속 가능한 대안을 개발할 것입니다."
 NIG_abuja_armories: "아부자 무기고"
 NIG_abuja_armories_desc: "수도 아부자에는 대부분의 군종 사령부가 위치해 있습니다. 우리는 그곳의 무기고를 대폭 확장하고 현대화하여 군이 충분한 장비를 갖추고 신속한 전개에 대비할 수 있도록 해야 합니다. 이 전략 비축 시설은 군의 준비 태세를 높일 뿐 아니라 국가 방위망의 중앙 배분 거점 역할도 하여, 위기 시 보다 효율적인 자원 배분을 가능하게 할 것입니다."
 NIG_rifle_compositions: "소총 구성"
 NIG_rifle_compositions_desc: "나이지리아 군대는 현재 작전 중 기동성을 떨어뜨리고 병사의 피로를 높이는 구식 중량 소총에 의존하고 있습니다. 현대적인 폴리머 기반 무기 체계에 투자하면 병사들에게 훨씬 가벼운 총기를 제공할 수 있으며, 이는 인체공학적일 뿐 아니라 대량 생산 시 제조 비용도 저렴합니다. 이러한 현대화는 전투 효율을 높이는 동시에, 특히 우리 군이 자주 작전하는 험난한 지형에서 병참 부담을 줄여 줄 것입니다."
 NIG_combined_arms: "나이지리아 연합 병과"
 NIG_combined_arms_desc: "나이지리아의 다양한 지형은 탁 트인 들판에서의 기갑 및 차량화 작전부터 울창한 정글 위의 항공 지원, 성장하는 도시에서의 시가전에 이르기까지 여러 전투 시나리오에 고유한 기회를 제공합니다. 군사적 효율을 극대화하려면 우리 군의 모든 군종이 막힘없이 소통하고 단일한 전투 부대로 작전하는 정교한 연합 병과 교리를 발전시켜야 합니다. 이러한 통합이 없다면 중대한 작전에서 군이 분열될 위험이 있으며, 참담한 전술적 실패로 이어질 수 있습니다. 합동 훈련과 현대적 지휘 체계에 투자함으로써 나이지리아 군을 다양한 지형 전반에서 어떤 위협에도 대응할 수 있는 응집력 있는 전투 부대로 탈바꿈시킬 수 있습니다."
 NIG_helicopter_requests: "헬리콥터 요구"
 NIG_helicopter_requests_desc: "나이지리아 군대는 다양한 작전 수요에 대응하기 위해 현대적인 헬리콥터 전력이 시급히 필요합니다. 회전익 전력을 확대하면 나이지리아의 험난한 지형 전반에서 군의 기동성, 정찰 능력, 신속 대응 수단을 강화할 수 있습니다. 이 다목적 항공기들은 병력 수송과 의무 후송에서부터 근접 항공 지원과 대반란 작전에 이르기까지 여러 핵심 기능을 수행할 것입니다. 이러한 자산을 확보하는 것은 우리 국가 안보 기반시설에 대한 전략적 투자입니다."
 NIG_multirole_fighters: "다목적 전투기"
 NIG_multirole_fighters_desc: "다목적 전투기는 미래의 길입니다. 여러 기종을 더 적은 수의, 더 범용적으로 쓸모 있는 기종으로 통합하는 것은 상당히 유익할 수 있습니다."
 NIG_peacekeepers_of_africa: "아프리카의 평화유지군"
 NIG_peacekeepers_of_africa_desc: "더 많은 아프리카 국가들이 산업화하고 성장함에 따라 아프리카 평화유지군은 상당히 흔해졌습니다. 그러나 나이지리아는 군대가 참여한 평화유지 작전의 수가 많다는 점에서 두드러집니다."
 NIG_northern_armories: "북부 무기고"
 NIG_northern_armories_desc: "Armories in the North should be fleshed out and expanded."
 NIG_national_guard: "국가 방위대 창설"
 NIG_national_guard_desc: "Nigeria has no formal branch for a National Guard. However, they have spoken in-depth about establishing one to protect citizens better domestically, while also freeing up federal forces to pursue a greater venture in countering extremists or pirates."
 NIG_light_forces_investments: "기동 전력 투자"
 NIG_light_forces_investments_desc: "우리의 기동 전력은 심각하게 부족합니다. 나이지리아는 기갑전, 기계화전, 차량화전에 유리한 지형을 갖추고 있습니다. 전장에서 이웃 국가들을 앞서려면 이를 완성해야 합니다."
 NIG_armor_production: "자국 기갑 생산"
 NIG_armor_production_desc: "우리의 기갑 여단은 심각하게 구식이며, 기갑 전력의 대다수는 1960년대에 개발된 영국제 빅커스로 이루어져 있습니다. 나머지는 오늘날에도 경쟁력을 유지하는 T-72입니다. 우리에게 가장 적합한 것이 무엇인지 알아보기 위해 다른 열강의 편제를 논의하는 방안을 검토해야 합니다."
 NIG_nigerian_coastal_forces: "나이지리아 해군"
 NIG_nigerian_coastal_forces_desc: "나이지리아 해군은 누구의 머릿속에서도 앞자리를 차지한 적이 없습니다. 그러나 서아프리카 주변 해역에서 수많은 해적 소탕 작전을 수행해 왔습니다. 해안을 보존하고 해상 교통로를 더 잘 보호하기 위해 해군을 강하게 유지해야 합니다."
 NIG_kaduna_military_industries: "카두나 군수 산업"
 NIG_kaduna_military_industries_desc: "카두나는 나이지리아에서 아홉 번째로 큰 도시입니다. 이 나라 북부 절반의 주요 산업 중심지입니다. 낡은 섬유 공장 일부는 눈에 띄게 황폐해지고 방치되었습니다. 이러한 공장 중 일부를 전용하여 군대를 위한 소형 화기 생산을 시작할 수 있습니다."
 NIG_western_military_assistance: "서방 군사 원조"
 NIG_western_military_assistance_desc: "우리의 옛 식민 종주국과 미국은 최근 우리와 우리 군에 대한 더 큰 관심을 논의하기 시작했습니다. 우리는 이를 기회로 삼아 낡아 가는 무기 체계 일부를 개선하고 군 전체를 향상시킬 수 있습니다."
 NIG_eastern_doctrines: "동방 교리"
 NIG_eastern_doctrines_desc: "러시아와 중국은 서방 국가들과의 뚜렷한 교리 차이를 중심으로 최근 몇 년간 잘 발전해 왔습니다."
 NIG_lagos_drydocks: "라고스 건선거"
 NIG_lagos_drydocks_desc: "나이지리아 최대의 대도시인 라고스는 우리 해안선에서 전략적 위치를 차지하고 있습니다. 최근 몇 년간 군용 해양 산업의 방치로 우리의 해군 역량은 악화되었습니다. 나이지리아 항만청은 신규 건선거 시설에 대한 대규모 투자를 제안했으며, 이는 해군력 재건과 상업 해운 활동 증진이라는 이중 목적을 달성하여 궁극적으로 우리의 경제적 번영과 군사적 준비 태세를 모두 높일 것입니다."
 NIG_royal_naval_doctrines: "영국 해군 교리"
 NIG_royal_naval_doctrines_desc: "The Royal Navy is one of the world's leading naval powers. Our former suzerain could potentially teach us a thing or two about proper naval doctrines and tactics."
 NIG_victory_is_from_god: "승리는 오직 신으로부터"
 NIG_victory_is_from_god_desc: "'승리는 오직 신으로부터'라는 문구는 1960년대 창설 이래 나이지리아 육군의 표어였습니다. 이는 나이지리아 국민에게 종교가 지니는 중요성을 담고 있습니다."
 NIG_frigates: "호위함 설계"
 NIG_frigates_desc: "호위함이 우리가 유지할 수 있는 가장 무거운 함선으로 보입니다. 우리가 마지막으로 운용한 호위함은 1980년대에 취역했습니다. 우리 함선들은 믿기 어려울 만큼 구식이며 개선이 필요합니다."
 NIG_light_submarines: "대함 경량 잠수함"
 NIG_light_submarines_desc: "경량 잠수함은 해적 소탕 작전이나, 전쟁이 발발할 경우 지역 수송 선단 습격에서 유익할 수 있습니다."
 NIG_corvettes: "초계정"
 NIG_corvettes_desc: "나이지리아 해군의 전략적 초점은 원양 능력이 아닌 연안 방어에 맞추어져야 합니다. 초계정, 초계함, 기타 경량 함정은 우리의 해양 안보 수요에 이상적으로 부합하며, 해적 소탕 작전과 영해 보호에 비용 효율적인 해법을 제공합니다. 이러한 소형 함정은 제한된 조선소 역량을 극대화하는 한편, 기니 만을 순찰하고 해상 석유 기반시설을 보호하는 데 필요한 기동성을 제공합니다."
 NIG_the_pdp_TT: "§Y인민민주당이 권력을 잡았습니다§!\n"
 NIG_anpp_empower_TT: "§Y전 나이지리아 인민당에 힘이 실립니다§!\n"
 NIG_found_the_icpc_trigger_TT: "§Y부패§!는 아직 국가의 문제로 남아있습니다"
 NIG_establish_ng_TT: "적절한 §Y국가 방위군§!을 설립합니다.\n이 중점을 실행하면 민병대 또한 해산될 것입니다."
 NIG_establish_ng_two_TT: "Establishes a proper §YNational Guard Branch§!.\n"
 NIG_northern_tolerance_TT: "관용이 승리하면서 북부 주들이 안정되기 시작했습니다.\n§G북부의 종교 봉기를 방지합니다§!\n"
 NIG_southern_tolerance_TT: "기독교도가 많은 남부는 평화와 화합을 위해 무기를 내려놓았습니다.\n§G남부의 종교 봉기를 방지합니다§!\n"
 NIG_tolerance_toolie_TT: "§Y샤리아 법에 대한 결정을 내려야 합니다§!\n"
 NIG_religious_conversion_TT: "주민을 새로운 종교로 개종시킵니다.\n"
 NIG_hold_off_on_conversion_flag_set_TT: "§Y이 결정이 활성화되어 있는 동안에는 추가적인 주의 개종이 차단됩니다.§!\n"
 NIG_hold_off_on_conversion_flag_remove_TT: "§Y이 결정이 완료되면 추가적인 주의 개종이 다시 가능해집니다.§!\n"
 NIG_enlist_boko_haram_TT: "§Y보코 하람§!과 계약하여 그들의 지지를 확보합니다!\n"
 NIG_the_islamic_states_faction: "이슬람 국가 연방"
 NIG_rise_of_boko_haram_TT: "§Y보코 하람이 권력을 장악합니다!§!\n"
 NIG_disarm_the_militias_toolie_TT: "군대가 전국 각지의 §Y기독교 민병대§!로부터 무기를 압수하기 시작합니다.\n"
 NIG_heli_requests_toolie_TT: "Once relations have been reached with our target country, we buy 30 §YAttack Helicopters§! from either §Y[SOV.GetNameWithFlag]§!, §Y[CHI.GetNameWithFlag]§!, or §Y[USA.GetNameWithFlag]§!.\n"
 NIG_christian_majority_10_idea: "기독교 우세 -10"
 NIG_christian_majority_10_idea_desc: "기독교 세력이 다수를 차지하며 선택되었습니다!"
