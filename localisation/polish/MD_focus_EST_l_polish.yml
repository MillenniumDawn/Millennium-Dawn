 EST_foreign_research_idea_desc: "Podczas gdy ambicje wojskowe Estonii są jasne, nasze krajowe możliwości badawcze pozostają ograniczone. Poprzez wspieranie strategicznych partnerstw z naszymi sojusznikami możemy uzyskać dostęp do najnowocześniejszych systemów uzbrojenia i zaawansowanych technologii wojskowych, przyspieszając nasze wysiłki na rzecz modernizacji obronności."
 EST_domestic_research_idea: "Kontynuowanie badań krajowych"
 EST_domestic_research_idea_desc: "Zbyt długo polegaliśmy na obcokrajowcach. Estonia będzie silna, jeśli będzie dalej inwestować w swój przemysł zbrojeniowy, zmniejszając naszą zależność od zagranicznych dostawców."
