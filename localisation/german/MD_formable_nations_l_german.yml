 HBL_form_category: "Der Benelux"
 HBL_form_category_desc: "Die Benelux-Staaten sind eine politisch-wirtschaftliche Union, zu der die Niederlande, Belgien und Luxemburg gehören. Historisch gesehen haben die drei Mitgliedsländer freundschaftliche und herzliche Beziehungen zueinander. Die derzeitige Organisation ist lediglich ein Zusammenschluss von Staaten in politischen und wirtschaftlichen Fragen auf der globalen Bühne. Es gibt leise Gespräche darüber, diesen Staatenbund möglicherweise zu etwas Konkreterem zu formen. Eine neue Nation, die die Völker der Lowlands repräsentiert, eine neue Zukunft für die Menschen herbeiführt und sie in diese strahlende Zukunft führt."
 HBL_integrate_start: "Begin forming [GetHBLNameDef]"
 HBL_integrate_start_desc: "It is time to begin forming the Benelux.\n\n"
 HBL_integrate_belgium: "Integrate [GetHBLNameAdj] [BEL.GetAdjective] Territories"
 HBL_integrate_belgium_desc: "Belgien ist weder das größte noch das kleinste der Beneluxstaaten. Es liegt bequem in der Mitte, ähnlich wie seine Position zwischen den beiden anderen Mitgliedsstaaten. Es beherbergt mehrere Bürokratiezentren der Europäischen Union in der Stadt Brüssel und ist ein beliebtes Reiseziel für niederländische, französische und nicht-EU-Touristen."
 HBL_integrate_netherlands: "Integrate [GetHBLNameAdj] [HOL.GetAdjective] Territories"
 HBL_integrate_netherlands_desc: "Die Niederlande sind das größte der drei Mitgliedsländer der Benelux-Staaten. Es umfasst die Mehrheit der Bevölkerung, Landfläche und Wirtschaftsgröße und beherbergt mehrere ausländische Bestände. Die Niederlande zu integrieren bringt die Mehrheit der Benelux-Staaten in den neuen Staat und stärkt die Legitimität unserer neuen Union erheblich."
 HBL_integrate_luxembourg: "Integrate [GetHBLNameAdj] [LUX.GetAdjective] Territories"
 HBL_integrate_luxembourg_desc: "Luxemburg ist das kleinste der drei Länder. Es beherbergt das größte BIP pro Kopf und verfügt über mehrere kleinere Touristenziele. Die Nation spricht ein Netz von Sprachen, die bemerkenswertesten sind Französisch, Deutsch und Englisch. Die Integration Luxemburgs ist angesichts der Größe des Staates kein großes Unterfangen, wird jedoch einige bürokratische Herausforderungen mit sich bringen."
 HBL_update_flag: "Finish Forming [GetHBLNameDef]"
 HBL_update_flag_desc: "With every constituent territory integrated, we can complete our transformation and proclaim [GetHBLNameDef], adopting its unified flag and name."
 is_HBL: "Has formed [GetHBLNameDef]"
 USNA_form_category: "Vereinige Nordamerika"
 USNA_form_category_desc: "The North American continent has historically repelled foreign influence since Mexico, the United States, and Canada were founded as nation-states. They form the backbone of the world's economy, with a collective eleven trillion GDP at the beginning of the new millennium. Uniting the nations and setting our sights on the grander tomorrow will see us go forward to the future."
 USNA_integrate_start: "Begin forming [GetUSNANameDef]"
 USNA_integrate_start_desc: "It is time to begin forming the North American Federation.\n\n"
 USNA_integrate_canada: "Integrate [GetUSNANameAdj] [CAN.GetAdjective] Territories"
 USNA_integrate_canada_desc: "Kanada ist flächenmäßig die größte Nation innerhalb der neuen Union und verfügt über viele ungenutzte Ölreserven. Allein diese beiden Tatsachen machen Kanada zu einem wesentlichen Bestandteil der neuen Union Nordamerikas. Hoffentlich wird die Apologetik auf ein Minimum reduziert, je weiter sie in die neue Nation integriert werden."
 USNA_integrate_usa: "Integrate [GetUSNANameAdj] [USA.GetAdjective] Territories"
 USNA_integrate_usa_desc: "Die Vereinigten Staaten bilden den Großteil der Union Nordamerikanischer Staaten. Sie verfügen über die größte Wirtschaft, die zweitgrößte Landfläche, Militär und mehr. Die Integration der Vereinigten Staaten bringt aufgrund ihrer schieren Größe und ihres Gewichts auf der Weltbühne eine Vielzahl von Herausforderungen mit sich; Diese Integration wird uns jedoch wirtschaftlich zur größten Supermacht der Welt machen."
 USNA_integrate_mexico: "Integrate [GetUSNANameAdj] [MEX.GetAdjective] Territories"
 USNA_integrate_mexico_desc: "Mexico is the second most populous nation of the three nations forming the new state. It brings to bear a large military. The nation has several challenges, such as the density of cartels. Nevertheless, integrating Mexico will be one of the main focal points for the new nation."
 USNA_update_flag: "Finish Forming [GetUSNANameDef]"
 USNA_update_flag_desc: "With every constituent territory integrated, we can complete our transformation and proclaim [GetUSNANameDef], adopting its unified flag and name."
 is_USNA: "Has formed [GetUSNANameDef]"
 UTS_form_category: "Vereinige die Türkischen Gebiete"
 UTS_form_category_desc: "Die Vereinigten Turkgebiete sind ein Zusammenschluss turksprachiger Nationen, darunter Usbekistan, Kirgisistan, Kasachstan und Turkmenistan. Andere Gruppen turksprachiger Völker außerhalb der Länder, wie die Tataren und Uiguren, existieren in Russland und China. Sie sind ein Ziel für unseren Zusammenschluss, aber nicht das ursprüngliche Ziel. Wir werden die gegenwärtig existierenden Nationalstaaten vereinen und unser Volk zur Rückkehr ermutigen oder es in die Gemeinschaft zurückholen."
