 ARM_soc_pac_bop_mid_range: "상충하는 균형"
 ARM_prioritize_national_cause: "민족 대의 우선"
 ARM_prioritize_propserity: "경제적 번영 우선"
 ARM_prioritize_invest_banking: "은행 부문 투자"
 ARM_prioritize_invest_green_energy: "녹색 에너지 투자"
 ARM_prioritize_invest_energy: "에너지 투자"
 ARM_prioritize_reform_pvo: "방공군 개혁"
 ARM_prioritize_reform_vdv: "공수부대 개혁"
 ARM_prioritize_invest_davisur: "육군 장비 투자"
 ARM_balanced_solution: "균형 잡힌 해법 마련"
 ARM_ideal_balance: "새로운 아르메니아의 성향"
 ARM_armenian_mafia_6_desc: "소련 붕괴 이후 조직범죄가 흔들리는 국가가 남긴 공백을 메웠습니다. 아르메니아 마피아는 과두 지배층과 깊이 얽혀 정치력을 빼돌리고, 산업 생산을 억누르며, 공적 생활의 모든 층위를 부패시키고 있습니다. 범죄 조직은 거의 처벌받지 않고 활동하며, 자국 경제에 대한 국가의 권위는 심각하게 훼손되었습니다.\n§W--------------§!\n이 국가 정신은 §H마피아와의 대결§! 또는 §H마피아와의 거래§! 중점을 완료하면 §G개선§!되고, §H마피아 분쇄§! 중점을 완료하면 §R제거§!됩니다."
 ARM_armenian_mafia_4_desc: "국가의 압박이 아르메니아 마피아에 의미 있는 손실을 입혔습니다. 핵심 인물들이 제거되고 범죄 수익이 교란되었지만 조직망은 여전히 온전합니다. 부패와 정치적 간섭은 상당한 수준으로 지속되며, 압박이 느슨해지면 세력이 되살아날 가능성이 남아 있습니다.\n§W--------------§!\n이 국가 정신은 §H보스 제거§! 중점을 완료하거나 §Y마피아 영향력 파괴§! 결정을 실행하면 §G개선§!됩니다."
 ARM_armenian_mafia_3_desc: "정부는 마피아와 정면으로 맞서는 대신 불안한 타협을 협상했습니다. 범죄 조직은 광범위한 영향력을 유지하며 경제에서 계속 이권을 뽑아내지만, 국가와의 공개적 충돌은 보류되었습니다. 부패는 심하고 정치적 비용은 계속 부담으로 남아 있습니다.\n§W--------------§!\n이 국가 정신은 §H비적 제압§! 중점을 완료하면 §G개선§!됩니다."
 ARM_armenian_mafia_2_desc: "정부가 마피아를 굴복시켰습니다. 범죄 조직은 더 이상 독자적으로 행동하지 않으며, 그들의 자금 흐름은 국가가 통제하는 경로를 거치고 과두 지배층의 횡포도 억제됩니다. 지하 경제는 존속하고 안정도는 타격을 받지만, 수익은 이제 경쟁 권력 중심이 아닌 국고로 흘러갑니다.\n§W--------------§!\n이 국가 정신은 §H마피아 분쇄§! 중점을 완료하면 §R제거§!됩니다."
 armenian_perseverance: "아르메니아의 인내"
 armenian_perseverance_desc: "지난 3천 년 동안 수많은 문명이 흥하고 쇠했습니다. 옛 벗과 적들과 달리 아르메니아인은 여전히 견뎌내고 있습니다. 역사적 아르메니아는 돌아오지 않을지도 모르지만, 번영하고 굳건히 서고자 하는 의지는 여전히 강합니다."
 NKR_marz_arm: "[ARM.GetNameWithFlag]의 사실상 마르즈"
 NKR_marz_tt: "\n§Y추가 지출: $$§R0.350§!§! ([ARM.GetFlag]§Y아르메니아§! 세금)\n"
 ARM_echoes_1999: "1999년의 메아리 -  §9통합 야당§!"
 ARM_echoes_1999_desc: "1999년 의회 총기 난사 사건의 여파는 여전히 국민을 동요시키고 있으며, 야권 세력은 코차랸에 맞서 시위를 벌이고 있습니다.\n§W--------------§!\n로베르트 코차랸이 더 이상 우리의 지도자가 아니거나 §H예르크라파 무마§! 중점을 완료하면 이 국가 정신은 §R제거§!됩니다."
 ARM_echoes_1999_pac: "1999년의 여파 - §Y연립에서 숙청된 민족주의자들§!"
 ARM_echoes_1999_pac_desc: "1999년 의회 총기 난사 사건의 여파는 여전히 국민을 동요시키고 있으며, 야권 세력은 코차랸에 맞서 시위를 벌이고 있습니다.\n§W--------------§!\n로베르트 코차랸이 더 이상 우리의 지도자가 아니거나 §H헌법 개정§! 중점을 완료하면 이 국가 정신은 §R제거§!됩니다."
 ARM_changes_in_militar: "군 내부의 변화"
 ARM_broken_economy: "90년대 경제의 잔재"
 ARM_broken_economy_desc: "아르메니아 경제는 깊은 침체에 빠져 있습니다. 기득권을 쥔 과두 세력이 개혁에 저항하면서 구조적 문제가 방치되고 있습니다.\n§W--------------§!\n우리의 §H1인당 GDP§!가 §H$20,000§!를 넘으면 이 국가 정신은 §R제거§!됩니다."
 ARM_diaspora_links: "디아스포라와의 연결"
 ARM_diaspora_links_desc: "전 세계에 퍼진 아르메니아 디아스포라는 상당한 인맥을 보유하고 있으며, 우리가 관계를 구축하거나 다른 국가에 영향력을 행사하는 데 도움을 줄 수 있습니다.\n\n이 국가 정신은 디아스포라 관련 결정 패널을 사용할 수 있게 해 줍니다.\n§W--------------§!\n§H화해할 수 없는 모순 해소§! 중점을 완료하면 이 국가 정신은 §R제거§!됩니다."
 ARM_rural_water_issues: "농촌 용수 공급 문제"
 ARM_rural_water_issues_desc: "소련 붕괴 이후 아르메니아는 농작물 관개 인프라에 문제를 겪기 시작했습니다. 농업이 아르메니아 경제에서 상당한 비중을 차지하고 있음에도 불구하고, 이러한 문제는 아직 해결되지 않았습니다."
 ARM_102st_base: "[SOV.GetNameWithFlag] 제102 군사기지"
 ARM_102st_base_desc: "귀므리의 제102 군사기지에는 [SOV.GetNameWithFlag]의 병력이 주둔해 있습니다. 이들의 주둔은 튀르키예에 대한 우리의 방어를 강화하고 우리 장교들이 군사 훈련을 받을 수 있게 해 주지만, 주둔군을 지원하는 일은 우리 예산에 부담을 줍니다.\n§W--------------§!\n우리가 나토에 가입하거나, [SOV.GetNameWithFlag](이)가 우리 영토에 대한 군사 통행권을 잃거나, [SOV.GetNameWithFlag]와(과) 전쟁을 벌이거나, §Y$ARM_no_more_colony$§! 중점을 완료하거나, §Y$ARM_question_military_base$§! 중점을 통해 주둔군을 몰아내면 이 국가 정신은 §R제거§!됩니다."
 ARM_echoes_of_1999: "1999년의 여파"
 ARM_echoes_of_1999_desc: "아르메니아는 정치적 기로에 서 있으며 1999년 테러 공격의 결과를 감당하고 있습니다. 로베르트 코차랸의 부상은 아르메니아에 무엇을 의미하는가?"
 ARM_agree_on_places: "자리 협약"
 ARM_high_emigration_0: "극소규모 이민 유출"
 ARM_high_emigration_0_desc: "소련 붕괴와 악화된 경제 상황으로 인해 많은 독립국가연합 국가가 해외 이주 급증의 인질이 되었습니다. 오늘날의 현실에서 아르메니아는 소멸의 위기에 처해 있으나, 동쪽 이웃이자 주적인 국가는 그렇지 않습니다. 인구 문제의 해결이 아르메니아 정치의 최우선 과제가 되어야 합니다.\n§W--------------§!\n우리의 §HGDP§!가 §H$100B§!를 넘고 안정도가 최소 §H64%§! 이상이면 이 국가 정신은 §G개선§!됩니다."
 ARM_immigration_desc: "전 세계의 아르메니아인들이 체계적으로 역사적 조국으로 돌아오고 있으며, 완전한 시민으로서 대규모로 귀환하고 있습니다."
 ARM_russia_debt_wait: "[SOV.GetNameWithFlag] 부채 §W유예§! 협정"
 ARM_russia_debt_wait_desc: "[ARM.GetNameWithFlag]은(는) [SOV.GetNameWithFlag]이(가) 부채를 인수하거나 탕감해 주지 않은 유일한 국가입니다. 정치적 조치였든 실리적 조치였든, 그들은 우리가 부채 문제를 매듭짓도록 유예를 허락했습니다.\n§W--------------§!\n우리의 부채가 §H10§! 아래로 떨어지거나 §H부채 대신 자산 협정§! 중점을 완료하면 이 국가 정신은 §R제거§!됩니다."
 ARM_official_investigation: "공식 조사 개시"
 ARM_official_investigation_desc: "야권과 국제 사회를 진정시키기 위해, 우리는 1999년 테러 공격에 대한 공식 조사를 개시해야 합니다."
 ARM_pacify_yerkrapah: "예르크라파 무마"
 ARM_pacify_yerkrapah_desc: "예르크라파 군사 조직은 아르메니아에서 우리의 통치에 비해 지나치게 영향력이 큽니다. 이들은 주로 민족주의 성향의 바즈겐 사르그샨 지지자들로 구성되어 있습니다. 우리는 이들을 군 지휘부에서 제거해야 합니다."
 ARM_meet_putin: "푸틴과의 회담"
 ARM_meet_putin_desc: "어쩌면 러시아가 우리 경제에 투자하도록 설득하고, 향후 부채 협상을 위한 신뢰 분위기를 조성할 수 있을 것입니다."
 ARM_northern_avenue_project: "북부 대로 사업"
 ARM_northern_avenue_project_desc: "북부 대로는 예레반 중심부를 위한 계획 사업으로, 오래된 역사적 건물을 철거하고 새로운 현대식 건물을 세우면서 거리를 재건하는 사업입니다."
 ARM_property_for_debt: "부채 대신 자산 협정"
 ARM_property_for_debt_desc: "아르메니아는 소련 붕괴 이후 러시아로부터 부채를 탕감받지 못한 유일한 국가입니다. 그러나 돈 대신 자산을 넘기는 방식으로 합의를 이끌어낼 수 있을지도 모릅니다."
 ARM_person_business: "개인 사업 벤처"
 ARM_person_business_desc: "경제 순환에 해가 될 수 있지만, 코차랸의 개인 사업 벤처에서 일정한 이익을 얻을 수 있습니다."
 ARM_caucasian_tiger: "코카서스의 호랑이"
 ARM_caucasian_tiger_desc: "부풀려진 건설 부문 덕분에 아르메니아는 현재 지역 내 최고의 GDP 성장률을 기록하고 있습니다. 우리는 이 상황을 적극 활용해야 합니다."
 ARM_silence_hun: "후나냔 입막음"
 ARM_silence_hun_desc: "후나냔이 야권에 일부 정보를 제공할 수 있습니다. 그런 일이 일어나게 해서는 안 됩니다."
 ARM_constitutional_changes: "헌법 개정"
 ARM_constitutional_changes_desc: "야권이 우리의 통치를 막을 수 있다는 모든 희망을 끝내기 위해, 우리는 헌법을 개정하고 시위를 진압해야 합니다."
 ARM_hi_rob: "안녕, 롭!"
 ARM_hi_rob_desc: "다슈나크추툰당의 포고스 포고샨은 오랫동안 코차랸에게 골칫거리였습니다. 그는 코차랸의 오랜 \\"친구\\"였으며, 오래된 인연은 이제 우리에게 너무 위험합니다."
 ARM_political_assassinations: "정치적 암살"
 ARM_political_assassinations_desc: "우리의 정치적 지배를 위해 필요하다면 정적을 계속 제거해 나갑니다."
 ARM_union_state_proposal: "연방 국가 제안"
 ARM_union_state_proposal_desc: "마침내 우리는 미래의 번영을 위해 연방 국가 사업에 참여하는 것을 시도해 볼 수 있습니다."
 ARM_suppressed_oppos: "억눌린 야권"
 ARM_cauc_tigr: "코카서스의 호랑이"
 ARM_autocratic_grip: "독재 권력"
 ARM_armenia_kocharyan_idea: "코차랸의 아르메니아"
 ARM_political_assassinations_category: "정치적 암살"
 ARM_political_assassinations_category_desc: "1999년 쿠데타 이후 £ARM_Conservative §Y코차랸§!의 권력은 불안정한 상태에 놓여 있습니다. §Y야권§!은 여러 차례 대통령을 타도하기 위해 준비할 것입니다. 권력 유지를 확신하려면 정치 무대를 정리해야 합니다. 정치권 내부의 적과 외부의 반대 세력은 근절되어야 합니다."
 arm_opposition_backlash_ticker_mission: "야권의 반발"
 arm_opposition_backlash_ticker_mission_desc: "[ARM.GetFlag] §Y아르메니아 야권§!은 집회를 열어 £ARM_Conservative §Y코차랸§! 정부가 양보하고 공정한 선거를 치르도록 압박할 준비를 하고 있습니다. 우리는 이 시점을 지연시켜야 하며, 가능하다면 집회 자체를 막거나 야권이 패배하도록 보장해야 합니다."
 ARM_first_wave_of_assasinat: "§Y정치적 암살§!의 §Y1차 물결§! 개시"
 ARM_second_wave_of_assasinat: "§Y정치적 암살§!의 §9두 번째 물결§! 개시"
 first_assasinat_done: "§Y1차 암살 물결 완료§!"
 second_assasinat_done: "§Y2차 암살 물결 완료§!"
 ARM_armenia_kocharyan_idea_tt: "[ARM_Kocharyan_People_loc][ARM_Kocharyan_Tiger_loc][ARM_Kocharyan_Autocratic_loc][ARM_Kocharyan_Opposition_loc]"
 ARM_Kocharyan_People_loc1: "\n§g요직의 우리 사람들§!:\n£corruption_cost_factor_texticon 부패 변경 정치력 비용: §R+30.00%§!\n£political_power_texticon  정치력 획득: §G+30.00%§!\n"
 ARM_Kocharyan_Tiger_loc1: "\n§g코카서스의 호랑이§!:\n£econ_cycle_upg_cost_multiplier_modifier_texticon §Y경제 순환 업그레이드 국고 비용§! 배수: §G-10.00%§!\n£construction_speed_texticon  지역 건설 속도: §G+10.00%§!\n"
 ARM_Kocharyan_Autocratic_loc1: "\n§g독재 권력§!:\n£construction_speed_texticon  지역 건설 속도: §G+10.00%§!\n£political_power_texticon  정치력 획득: §G+5.00%§!\n£interest_rate_multiplier_modifier_texticon §Y이자율§!: §G-2§!\n£emerging_outlook_campaign_cost_modifier_texticon 일일 신흥국 지지: §G+0.06§!"
 ARM_Sargsyan: "세르지 사르그샨"
 ARM_Sargsyan_desc: "1988년 이래 세르지 사르그샨은 아르메니아의 나고르노카라바흐 방어를 목표로 내건 \\"카라바흐 운동\\"의 지도자 중 한 명이었습니다. 아르메니아의 군사 및 정치 분야에 폭넓은 연줄을 가진 그는 코차랸 이후 대통령직의 이상적인 후보가 되었습니다."
 ARM_appoint_tigran: "티그란 임명"
 ARM_appoint_tigran_desc: "향후 있을 수 있는 개혁을 위해 티그란 사르그샨을 아르메니아 중앙은행 총재로 임명해야 합니다."
 ARM_clear_out_nats: "안드라닉 마르가랸 지지자 일소"
 ARM_clear_out_nats_desc: "안드라닉 마르가랸과 당내 민족주의 계파는 억눌러야 합니다. 그들은 지나치게 불충하고 위험하여 우리 당에서 용인할 수 없습니다."
 ARM_spheres_of_influence_sep: "영향권 분리"
 ARM_spheres_of_influence_sep_desc: "이전 정부는 우리가 이 나라를 통치하도록 승인해 주었으므로, 우리는 그들의 사업 활동을 존중해야 합니다."
 ARM_befriend_oligs: "과두 세력과의 친교"
 ARM_befriend_oligs_desc: "어쩌면 과두 세력과 인맥을 쌓고 그들이 제안할 만한 거래를 들어보는 편이 좋을 것입니다."
 ARM_patriotic_educ: "애국 청소년 교육"
 ARM_patriotic_educ_desc: "우리는 청소년을 애국심의 정신으로 교육해야 합니다. 우리 당은 우리가 지도부를 장악하기 전부터 이 분야에서 매우 성공적이었으므로 이 전통을 이어가야 합니다."
 ARM_ensure_milit: "군의 지지 확보"
 ARM_ensure_milit_desc: "군이 정부와 사회에서 가장 중요한 위치 중 하나를 차지하도록 보장해야 합니다."
 ARM_priorit_loy_gener: "충성스러운 장군 우대"
 ARM_priorit_loy_gener_desc: "우리에게 충성하며 정치적 연줄을 구축한 장군들을 우선시해야 합니다."
 ARM_new_gov_builds: "신규 정부 청사"
 ARM_new_gov_builds_desc: "과두 세력과의 좋은 관계 덕분에, 정부를 위한 새로운 시설 건설에 관해 그들과 유리한 거래를 맺을 수 있을지도 모릅니다."
 ARM_navasard_legacy_sup: "나바샤르디안의 유산"
 ARM_navasard_legacy_sup_desc: "우리가 공화당의 구세력을 억눌렀지만, 그들의 방식과 유산을 활용하는 것이 우리나라의 미래에 매우 유용할 수 있습니다."
 ARM_cronies_elevated: "측근 승진"
 ARM_cronies_elevated_desc: "핵심 이념은 유지하되 교육 분야의 우선순위를 바꾸어야 합니다."
 ARM_support_monopolies: "독점 기업 지원"
 ARM_support_monopolies_desc: "국가 내 우리의 영향력을 유지하기 위해 독점 체제를 유지해야 합니다."
 ARM_hovik_guidelines: "호비크의 지침"
 ARM_hovik_guidelines_desc: "호비크 아브라하먄 총리는 경제부에 한 달 이내에 시장에 들어오는 10개 필수 품목의 수입 지침을 마련하도록 지시했습니다. 여기에는 설탕, 밀가루, 밀, 식용유, 쌀, 메밀, 버터, 마가린, 바나나, 오렌지, 이유식, 가금류, 의약품, 경유, 휘발유가 포함되었습니다. 그는 이러한 시장이 공식적으로 독점된 것은 아니지만 대중은 그렇게 인식하고 있다고 지적했습니다."
 ARM_mandatory_pension_system: "의무 적립식 연금 제도"
 ARM_mandatory_pension_system_desc: "의무 적립식 연금 제도는 국민의 노후를 보장하고 국가 복지에 대한 장기적 의존도를 줄일 것입니다."
 ARM_patronize_nats: "민족주의자 후원"
 ARM_patronize_nats_desc: "공화당은 여러 방식으로 국내 민족주의 운동을 지원합니다."
 ARM_footbal_diplo: "축구 외교"
 ARM_visit_to_russia: "러시아 국빈 방문"
 ARM_visit_to_russia_desc: "세르지 사르그샨은 아르메니아와 EU의 접근을 협상하기 위해 러시아를 방문할 것입니다."
 ARM_approach_eu_serzh: "유럽 연합 접근"
 ARM_approach_eu_serzh_desc: "유럽의 날은 우리나라의 획기적인 행사이며, 덕분에 우리는 EU에 더 가까워질 기회가 늘어납니다."
 ARM_serzh_free_speech: "EU 지지를 위한 언론 자유"
 ARM_serzh_free_speech_desc: "야권을 키우고 싶지는 않지만, 경제적 기회를 확대하기 위해 국민에게 일부 권리를 부여할 필요가 있습니다."
 ARM_ss_army: "S.S.의 군대"
 ARM_ss_army_desc: "우리는 세르지 사르그샨의 군대입니다. 세상 끝까지 그를 따를 것입니다!"
 arm_sargsyan.1.t: "축구 경기 후 아르메니아에서의 회동!"
 arm_sargsyan.1.d: "아르메니아와 튀르키예의 축구 경기를 관람한 뒤, 양국 지도자들이 여러 현안을 논의하고 있습니다. 아르메니아는 양국 경제의 상호 이익이 되는 발전과 관계 정상화를 위해 양국 간 협력에 관한 양자 협정을 체결할 것을 제안합니다."
 arm_sargsyan.1.a: "물론이지"
 arm_sargsyan.1.b: "아니요"
 arm_sargsyan.2.t: "아르메니아-튀르키예 협력 서명"
 arm_sargsyan.2.d: "튀르키예가 양자 협력 협정에 서명하기로 동의했습니다."
 arm_sargsyan.2.a: "좋다"
 arm_sargsyan.3.t: "튀르키예의 거절"
 arm_sargsyan.3.d: "관계를 회복하려는 우리의 노력은 상대측에 닿지 않았습니다."
 arm_sargsyan.3.a: "알겠다"
 arm_sargsyan.4.t: "사르그샨의 모스크바 방문"
 arm_sargsyan.4.d: "사르그샨은 아르메니아가 EU 국가들과 가까워지는 것을 허용해 달라고 요청하고 있습니다. 그는 이것이 우리와의 관계 단절로 이어지지 않을 것이라고 주장합니다."
 arm_sargsyan.4.a: "동의한다"
 arm_sargsyan.4.b: "아르메니아는 EU를 위해 우리를 떠날 수 없다"
 arm_sargsyan.4.c: "더 긴밀한 경제 동반자 관계를 제안할 수 있다"
 arm_sargsyan.5.t: "러시아, EU 접근 목표 포기를 요구"
 arm_sargsyan.5.d: "러시아는 우리와 EU의 어떠한 접근에도 단호히 반대하며, 우리가 가까워지려 할 경우 경제 제재로 위협하고 있습니다."
 arm_sargsyan.5.a: "우리의 입장을 유지한다"
 arm_sargsyan.5.b: "요구를 수용한다"
 arm_sargsyan.6.t: "우리의 위협을 두려워하지 않는 아르메니아"
 arm_sargsyan.6.d: "우리의 위협은 아르메니아 지도부를 겁먹게 하지 못했습니다. 약속한 제재를 가해야 하겠습니까?"
 arm_sargsyan.6.a: "경고했다"
 arm_sargsyan.6.b: "다음에는 어떻게든 타협할 수 있을 것이다"
 arm_sargsyan.7.t: "러시아의 거래 제안"
 arm_sargsyan.7.d: "EU와의 접근 계획을 포기하면 그 대가로 경제 원조를 받게 됩니다. 그러나 제안을 어기면 그에 따른 결과가 있을 것입니다."
 arm_sargsyan.7.a: "거래한다"
 arm_sargsyan.7.b: "이 제안을 거절한다"
 arm_sargsyan.8.t: "러시아의 동의"
 arm_sargsyan.8.d: "러시아가 우리와 유럽 연합의 접근에 동의했습니다."
 arm_sargsyan.8.a: "완벽하다"
 arm_sargsyan.9.t: "아르메니아의 후퇴"
 arm_sargsyan.9.d: "아르메니아는 우리에게 맞서지 않기로 결정하고 우리의 요구를 수용했습니다."
 arm_sargsyan.9.a: "좋다"
 arm_sargsyan.10.t: "러시아의 후퇴"
 arm_sargsyan.10.d: "러시아는 위협에서 물러서기로 결정했으며, 조용히 우리가 목표를 실행에 옮기도록 두었습니다."
 arm_sargsyan.10.a: "완벽하다"
 arm_sargsyan.11.t: "아르메니아, 거래를 거절"
 arm_sargsyan.11.d: "우호적인 경제적 제안을 내놓으려 노력했음에도 불구하고 거절당했습니다."
 arm_sargsyan.11.a: "나쁘다"
 arm_sargsyan.12.t: "아르메니아의 유럽의 날"
 arm_sargsyan.12.d: "주아르메니아 EU 대표부는 예레반과 전국 각 지역에서 축제 행사와 더불어 아르메니아 내 EU 활동을 다룬 정보 설명회, 전시회, 음악회를 개최할 것입니다."
 arm_sargsyan.12.a: "좋은 생각이다"
 arm_sargsyan.12.b: "아니요"
 arm_sargsyan.13.t: "EU의 지지"
 arm_sargsyan.13.d: "주요 EU 국가들이 우리의 유럽 구상을 지지하기로 합의했습니다."
 arm_sargsyan.13.a: "유럽과 함께 미래로"
 arm_sargsyan.14.t: "EU, 지지를 거부"
 arm_sargsyan.14.d: "EU 국가들은 우리 행사를 무시했으며 우리를 지지하지 않았습니다."
 arm_sargsyan.14.a: "알겠다"
 arme.12.b: "미안하지만 사양한다."
