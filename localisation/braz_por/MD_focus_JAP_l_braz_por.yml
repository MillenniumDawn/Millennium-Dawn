 Japan.104.f: "Crescimento dos restauracionistas imperiais"
 JAP_electronics.320.t: "Quanto Custa Metal Gear"
 JAP_electronics.320.d: "A Konami lançou Metal Gear Solid 2 e Silent Hill 2 no mesmo ano, com orçamentos que só um sucesso justifica, a partir de equipes construídas em torno de diretores únicos. As linhas de esportes e de cartas rendem de forma constante e não precisam de nenhum autor. Financiar ambas é o que a empresa não tem como continuar fazendo."
 JAP_electronics.320.a: "Financiar as equipes lideradas por diretores"
 JAP_electronics.320.b: "Financiar as linhas anuais de esportes e cartas"
 JAP_electronics.321.t: "Gabinetes Rendem Mais do que Discos"
 JAP_electronics.321.d: "A Konami pode assumir o controle da Hudson Soft e se expandir para pachislot e gabinetes de fliperama, onde uma máquina num salão rende em um ano mais do que um título de console rende em toda a vida. As fábricas e o espaço nos salões são ativos reais no Japão. Continuar como editora de software mantém a empresa fora de um negócio que a imprensa de jogos não respeita."
 JAP_electronics.321.a: "Entrar no ramo de máquinas de diversão"
 JAP_electronics.321.b: "Continuar como editora de software"
 JAP_electronics.322.t: "Dragon Collection"
 JAP_electronics.322.d: "O jogo de cartas da Konami no GREE rende mais por desenvolvedor do que qualquer equipe de console do prédio, e levou meses, e não anos, para ser feito. Mudar os estúdios para o social e o mobile é seguir o dinheiro. Manter as equipes de console financiadas significa pagar os projetos longos com os curtos."
 JAP_electronics.322.a: "Mover o desenvolvimento para o social e o mobile"
 JAP_electronics.322.b: "Manter as equipes de console financiadas"
 JAP_electronics.323.t: "Kojima Sai"
 JAP_electronics.323.d: "A Konami terminou Metal Gear Solid V, cancelou Silent Hills e pode dissolver o estúdio que fez ambos e tirar o nome do diretor da caixa. O presidente já disse publicamente que o futuro do negócio está no mobile. Manter o estúdio significa financiar um produtor que custa mais do que a divisão arrecada."
 JAP_electronics.323.a: "Dissolver o estúdio e retirar o crédito"
 JAP_electronics.323.b: "Manter o estúdio e o crédito"
 JAP_electronics.324.t: "eFootball"
 JAP_electronics.324.d: "A Konami reconstruiu o Pro Evolution Soccer como um serviço gratuito e o lançou num estado que seus próprios jogadores avaliaram abaixo de qualquer outro na plataforma. O catálogo de Silent Hill, Metal Gear e Castlevania está parado, e refazê-lo custa dinheiro de verdade. Operar serviços e as academias de ginástica rende sem nenhum desses riscos."
 JAP_electronics.324.a: "Financiar o catálogo antigo novamente"
 JAP_electronics.324.b: "Operar os serviços e as academias"
 JAP_electronics.325.t: "No Que a Konami Se Tornou"
 JAP_electronics.325.d: "Vinte e cinco anos escolhendo entre os diretores, os gabinetes e o celular definiram o que a Konami é e o que o entretenimento japonês exporta."
 JAP_electronics.325.a: "Estúdios de desenvolvimento restaurados"
 JAP_electronics.325.b: "Uma editora de remakes e revivals"
 JAP_electronics.325.c: "Uma operadora de diversão e fitness"
 JAP_electronics.325.e: "Um negócio de licenciamento mobile"
 JAP_konami_restored_development_houses: "Estúdios de Desenvolvimento Restaurados"
 JAP_konami_restored_development_houses_desc: "A Konami volta a financiar diretores e a lançar os jogos que esses diretores querem fazer. Custa mais do que o negócio mobile jamais custou e é o motivo pelo qual alguém fora do Japão conhece o nome."
 JAP_konami_remake_publisher: "Editora de Remakes e Revivals"
 JAP_konami_remake_publisher_desc: "A Konami reconstrói o que já possui para quem jogou na primeira vez. O catálogo é finito e o público não é, por ora, exatamente."
 JAP_konami_amusement_fitness_operator: "Operadora de Diversão e Fitness"
 JAP_konami_amusement_fitness_operator_desc: "Gabinetes de pachislot, salões de fliperama e a maior rede de academias de ginástica do Japão, tudo construído sobre imóveis e máquinas que a Konami possui por inteiro. Os jogos são o braço de licenciamento de um negócio físico."
 JAP_konami_mobile_licensing: "Negócio de Licenciamento Mobile"
 JAP_konami_mobile_licensing_desc: "A Konami aluga Yu-Gi-Oh!, Metal Gear e Silent Hill a quem quiser desenvolvê-los e cobra nos termos acordados. Nada é feito internamente e nada precisa ser."
 JAP_electronics.330.t: "Modems Grátis na Esquina"
 JAP_electronics.330.d: "A SoftBank pode distribuir modems Yahoo! BB nas esquinas de Tóquio e vender banda larga abaixo do custo até que o domínio da NTT sobre a última milha se quebre. Masayoshi Son espera perder dinheiro com cada assinante por anos. Revender as linhas da NTT com margem é lucrativo de imediato e deixa o monopólio exatamente onde está."
 JAP_electronics.330.a: "Dar os modems e arcar com os prejuízos"
 JAP_electronics.330.b: "Revender as linhas da operadora dominante"
 JAP_electronics.331.t: "Vodafone Japão"
 JAP_electronics.331.d: "A Vodafone vai vender sua rede japonesa por 1,75 trilhão de ienes e a SoftBank pode tomar emprestado quase tudo, no que seria a maior aquisição alavancada que o Japão já viu. Compra uma rede móvel nacional e os assinantes que estão nela. A dívida é garantida por um negócio que a SoftBank nunca operou."
 JAP_electronics.331.a: "Tomar empréstimo contra a rede e comprá-la"
 JAP_electronics.331.b: "Ficar fora do mercado móvel"
 JAP_electronics.332.t: "Sprint"
 JAP_electronics.332.d: "A SoftBank pode pagar 21,6 bilhões de dólares pela Sprint, a terceira operadora americana, e herdar uma reconstrução de rede que ninguém orçou direito. Isso poria uma empresa japonesa dentro do mercado americano pela primeira vez nessa escala. O mesmo capital gasto no país rende juros compostos sobre uma rede que a SoftBank já opera."
 JAP_electronics.332.a: "Comprar a operadora americana"
 JAP_electronics.332.b: "Reinvestir em casa"
 JAP_electronics.333.t: "Cem Bilhões de Dólares"
 JAP_electronics.333.d: "A SoftBank pode levantar cem bilhões de dólares, a maior parte do fundo de investimento público saudita, e assinar cheques que nenhum fundo de capital de risco jamais assinou. O Vision Fund faria de Masayoshi Son o maior investidor em tecnologia vivo. Investir fora do balanço é mais lento, menor e não presta contas a ninguém em Riade."
 JAP_electronics.333.a: "Levantar o fundo com dinheiro do Golfo"
 JAP_electronics.333.b: "Investir fora do balanço"
 JAP_electronics.334.t: "WeWork"
 JAP_electronics.334.d: "A abertura de capital da WeWork naufragou a caminho do mercado e a SoftBank detém a maior participação. Resgatar a empresa significa assumir uma baixa contábil de bilhões e dizer aos acionistas que o julgamento estava errado. Deixá-la quebrar protege tudo o mais que a SoftBank apoiou e confirma todas as dúvidas sobre como essas apostas foram escolhidas."
 JAP_electronics.334.a: "Resgatá-la e assumir a baixa contábil"
 JAP_electronics.334.b: "Deixá-la quebrar e proteger o resto"
 JAP_electronics.335.t: "No Que a SoftBank Se Tornou"
 JAP_electronics.335.d: "Um quarto de século tomando empréstimos contra redes e apostando o resultado em empresas alheias definiu o que a SoftBank é e como o capital japonês chega ao resto do mundo."
 JAP_electronics.335.a: "Uma holding global de tecnologia"
 JAP_electronics.335.b: "Uma subscritora de capital de risco"
 JAP_electronics.335.c: "Um grupo de operadoras domésticas"
 JAP_electronics.335.e: "Uma revendedora de banda larga"
 JAP_softbank_global_technology_holding: "Holding Global de Tecnologia"
 JAP_softbank_global_technology_holding_desc: "A SoftBank possui operadoras em dois continentes e participações minoritárias em várias centenas de empresas que não administra. Seu valor depende do que o mercado acha que essas participações valem neste trimestre."
 JAP_softbank_venture_underwriter: "Subscritora de Capital de Risco"
 JAP_softbank_venture_underwriter_desc: "A SoftBank assina o cheque que ninguém mais assina e fica com a cadeira no conselho que vem junto. Os retornos chegam de forma irregular e os prejuízos chegam todos de uma vez."
 JAP_softbank_domestic_carrier_group: "Grupo de Operadoras Domésticas"
 JAP_softbank_domestic_carrier_group_desc: "Fibra, espectro e centrais por todo o Japão, comprados com dívida e pagos com as assinaturas. A SoftBank possui a infraestrutura, e não uma posição em alguém que a possui."
 JAP_softbank_broadband_reseller: "Revendedora de Banda Larga"
 JAP_softbank_broadband_reseller_desc: "A SoftBank vende acesso a linhas que pertencem à operadora dominante e compete apenas no preço. A margem é fina e o negócio nunca precisou de resgate."
