 ###Russian Economy Dynamic Modifiers
 SOV_sber_ipo_done_tt: "Sberbank has been §Yfloated on the market§!"
 SOV_economy_modifier: "Russian Economy"
 SOV_economy_modifier_desc: "The standing ledger of the companies the state owns, part-owns or leans on. Every firm brought back under Moscow's hand leaves its mark here."
 SOV_capitalisation_modifier: "Corporate Capitalization"
 SOV_capitalisation_modifier_desc: "What the market thinks our national champions are worth. The larger their capitalization, the more the treasury and the research bench get out of them."
 SOV_landforce_modifier: "Ground Forces"
 SOV_landforce_modifier_desc: "The largest branch of the Russian Armed Forces, built around motor rifle and tank formations equipped with the BMP, BTR and T-72 through T-90 families. The New Look reform broke the inherited division structure down into permanent-readiness brigades, a decision later reversed as divisions were reconstituted along the western frontier."
 SOV_airforce_modifier: "Aerospace Forces"
 SOV_airforce_modifier_desc: "Created by merging the Air Force with the Aerospace Defense Troops, placing aviation, air defense and military space operations under a single command. Its combat strength rests on the Su-27 derivatives, the Su-34 strike fleet and the early warning network watching for missile launches."
 SOV_navy_modifier: "Naval Fleet"
 SOV_navy_modifier_desc: "Divided between the Northern, Pacific, Baltic and Black Sea Fleets and the Caspian Flotilla, with the ballistic missile submarine force as its center of gravity. It has long lived off aging Soviet hulls, waiting on the Borei and Yasen programs to deliver replacements."
 SOV_intelligence_modifier: "Security Services"
 SOV_intelligence_modifier_desc: "The cryptographic and signals portfolio once belonged to FAPSI, the Federal Agency for Government Communications and Information, until it was dissolved and its functions divided between the FSB, the SVR and the GRU. Alongside it stand the services that police the country itself: Rosgvardiya, drawn out of the Interior Ministry troops and answerable directly to the president, the OMON riot detachments it absorbed, and the GRU, which runs military intelligence and the Spetsnaz brigades abroad."
 ##Soviet Dynamic Modifier
 SOV_revived_politburo_modifier: "Revived Politburo"
 SOV_revived_politburo_modifier_desc: "The party legacy of the Soviet Union was destroyed in 1991. Now we are faced with the task of reviving all that was lost and stolen."
