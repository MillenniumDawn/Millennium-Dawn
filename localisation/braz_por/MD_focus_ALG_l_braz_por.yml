 alg.450.t: "A Argélia Mergulha em Conflito Civil"
 alg.450.d: "Queixas crescentes e a estabilidade em colapso empurraram a nação além do ponto de ruptura. Facções armadas se levantam enquanto o Estado se fragmenta, mergulhando a Argélia em uma nova era de conflito interno."
 alg.450.a: "A situação foge ao controle."
