 FRA_idea_the_francosphere: "Франкосфера"
 FRA_idea_the_francosphere_desc: "Франкосфера - это политическое и глобальное сообщество франкоязычных народов и наций. Это механизм, помогающий Франции проецировать свое влияние на бывшие колонии, но он остается всего лишь кооперацией между франкоязычными нациями."
 FRA_idea_administrative_reforms: "Административные реформы"
 FRA_idea_administrative_reforms_desc: "Бюрократическая машина Франции претерпела ряд важных реформ, которые позволили снизить расходы, а также расширить возможности правительства по принятию и реализации различных новых политик."
 FRA_idea_french_armored_production: "Французские бронемашины"
 FRA_idea_french_armored_production_desc: "Французская бронетехника входит в число лучших боевых машин в мире. Мы должны и дальше сохранять наше преимущество и продолжать производство бронетехники, чтобы противостоять росту новых глобальных угроз."
 FRA_idea_central_decentral: "Бюрократические реформы"
 FRA_idea_central_decentral_desc: "Происходит перераспределение полномочий между Парижем и регионами, и каждый переданный документ требует затрат денег и времени, прежде чем принесет свои плоды."
 FRA_idea_military_improvement_army: "Военная реформа - Армия"
 FRA_idea_military_improvement_army_desc: "Началась первая из многих реформ, в которой приоритет отдан армии. Мы выбрали армию как наиболее важную силу, поскольку она способна защищать границы нашей страны, а также границы наших союзников."
 FRA_idea_military_improvement_navy: "Военная реформа - ВМФ"
 FRA_idea_military_improvement_navy_desc: "Началась первая из многих реформ, и приоритет отдан военно-морскому флоту. Наш флот играет важную роль в поддержании важнейших каналов снабжения, проецировании военной мощи и обеспечении безопасности наших заморских территорий."
 FRA_idea_military_improvement_air_force: "Военная реформа - ВВС"
 FRA_idea_military_improvement_air_force_desc: "Началась первая из многих реформ, и приоритет отдан военно-воздушным силам. Военно-воздушные силы были выбраны из-за их способности предотвращать захват страны с воздуха и оказывать эффективную поддержку военно-морским и сухопутным силам."
 FRA_idea_military_improvement_army_and_navy: "Военная реформа - Армия и флот"
 FRA_idea_military_improvement_army_and_navy_desc: "Следующий этап реформ сосредоточен на армии и флоте. Армия и флот нуждаются в улучшении межведомственной координации, а также в эффективной защите кораблей и более эффективном использовании военно-морских сил в координации с сухопутными войсками."
 FRA_idea_military_improvement_army_and_air_force: "Военная реформа - Армия и авиация"
 FRA_idea_military_improvement_army_and_air_force_desc: "Комплексная подготовка и совершенствование вооруженных сил и военно-воздушных сил являются одними из важнейших реформ, которые мы можем провести. Взаимодействие двух различных родов войск может и обеспечит нашу победу в грядущих конфликтах."
 FRA_idea_military_improvement_air_force_and_navy: "Военная реформа - Флот и авиация"
 FRA_idea_military_improvement_air_force_and_navy_desc: "Военно-воздушные силы и военно-морской флот неразделимы и незаменимы. Усовершенствования, направленные на развитие обоих родов войск, позволят нам защитить как наши собственные интересы, так и интересы наших друзей, союзников и гражданского населения здесь, в Европе, и во всем мире."
 FRA_idea_the_french_military: "Военная реформа"
 FRA_idea_the_french_military_desc: "После многих лет, в течение которых армия находилась в состоянии хаоса, мы наконец-то заставили себя реформировать нашу стареющую армию. Теперь мы можем еще раз подчеркнуть, что Франция — это страна, с которой не стоит шутить, и страна, с которой стоит дружить!"
 FRA_idea_space_agency_name: "Национальный центр космических исследований"
 FRA_idea_space_agency_name_desc: "Национальный центр космических исследований (CNES) — это название французского национального космического агентства. Оно было основано в 1961 году тогдашним президентом Шарлем де Голлем, что делает его третьим старейшим космическим агентством в мире после НАСА и советской космической программы, а также её преемника, Роскосмоса."
 FRA_idea_reformed_cnes: "Реформирование национального центра космических исследований"
 FRA_idea_reformed_cnes_desc: "Национальный центр космических исследований (CNES) — это название французского национального космического агентства. Оно было основано в 1961 году тогдашним президентом Шарлем де Голлем, что делает его третьим старейшим космическим агентством в мире после НАСА и советской космической программы, а также её преемника — Роскосмоса. Недавние изменения в бюджете и другие политические преобразования привели к реформированию CNES в ту версию, которую мы знаем сегодня."
 FRA_idea_cnes_failing: "Недостатки бюджета национального центра космических исследований"
 FRA_idea_cnes_failing_desc: "Национальный центр космических исследований в последний год столкнулся с несколькими бюджетными трудностями, что вызвало значительное недовольство в отрасли, поскольку Европейский союз предлагает создать собственное космическое агентство."
 FRA_idea_prep_the_launch: "Подготовка к запуску"
 FRA_idea_prep_the_launch_desc: "В настоящее время Национальный центр космических исследований готовится к запуску космического корабля. Пройдет некоторое время, прежде чем он будет готов к запуску."
 FRA_idea_space_research: "Космические исследования"
 FRA_idea_space_research_desc: "Изучение космоса - один из самых полезных способов лучше понять окружающий нас мир. Сосредоточившись на исследованиях в космосе, мы можем быть уверены, что опережаем своих противников и конкурентов."
 FRA_idea_nasa_partnership: "Партнерство национального центра космических исследований и НАСА"
 FRA_idea_nasa_partnership_desc: "Партнерство между американским космическим агентством NASA и нашим- это не только выгода, но и взаимный интерес. Расширение и обсуждение с нашим союзником может помочь улучшить научные исследования по всему миру и расширить сотрудничество двух агентств, открыв новые горизонты."
 FRA_idea_Light_for_Europe: "Свет Европы"
 FRA_idea_Light_for_Europe_desc: "Избыточный ток, вырабатываемый атомными и возобновляемыми источниками энергии, поступает через межсистемные соединения. Соседние предприятия оплачивают то, что энергосистема не нуждается."
 FRA_cfa_franc_custodian: "Хранитель африканского франка"
 FRA_cfa_franc_custodian_desc: "Мы создали франк КФА, чтобы защитить наши колонии от девальвации после Второй мировой войны. Хотя мы больше не используем франк, мы по-прежнему являемся хранителями валюты стран Западной Африки. Они хранят у нас половину своих казначейских резервов, и поэтому мы можем извлекать выгоду из предоставляемых им активов.\n\n§YМы получаем 0,5% от общего ВВП.§! среди наций, которые имеют §Yфранк КФА§! как §YДополнительный доход§!. Электрический ток §YСовокупный ВВП§! из §YПользователи франка КФА§!: [?FRA.FRA_cfa_franc_gdp_total]б"
 the_eco: "ЭКО"
 the_eco_desc: "ЭКО — это предлагаемая валюта для стран Западной Африки, входящих в ЭКОВАС (Экономическое сообщество стран Западной Африки) и Западноафриканскую валютную зону. Страны, использующие франк КФА (в основном франкоязычные государства), также выразили поддержку введению новой валюты. ЭКО призвана обеспечить валютное объединение региона, упростив торговлю товарами и создав единое средство расчёта, вокруг которого государства смогут консолидироваться."
 FRA_idea_the_french_pillar_of_counterterroism: "Столп борьбы с терроризмом"
 FRA_idea_the_french_pillar_of_counterterroism_desc: "Терроризм набирает обороты, и наша задача, как граждан Франции, — остановить его и защитить себя, Европу и тех, кто может пострадать от этого. Будущее нашей страны в условиях растущего экстремизма будет зависеть не только от наших слов, но и от эффективности наших действий в борьбе с возрастающими угрозами для нашей родины."
 FRA_idea_the_french_foreign_legion: "Французский иностранный легион"
 FRA_idea_the_french_foreign_legion_desc: "Иностранный легион Франции - это элитное подразделение французской армии, состоящее из нескольких специальностей, таких как пехота, кавалерия, сапёры и воздушно-десантные войска. Иностранный легион - уникальная боевая сила, поскольку в него могут вступать все иностранные граждане, и он обладает высокой подготовкой."
 FRA_idea_Grand_ambitions: "Грандиозные амбиции в Африке"
 FRA_idea_Grand_ambitions_desc: "Африка созрела для захвата, и нам нужно двигаться вперед и заявить о наших новых грандиозных амбициях. Крайне важно продолжать укреплять наши позиции в Африке, чтобы обезопасить себя не только для настоящего, но и для будущего всего французского народа."
 FRA_idea_development_investment: "Развитие Инвестиций"
 FRA_idea_development_investment_desc: "[FRA.GetNameWithFlag] оказывает нам экономическую помощь, чтобы помочь нам развивать нашу нацию."
 AFRICA_idea_nepad_modifier: "Программа развития НЕПАД"
 AFRICA_idea_nepad_modifier_desc: "Новое партнерство для развития Африки (сокращенно НЕПАД) — это программа экономического развития, разработанная Африканским союзом совместно с партнерами из Европейского союза, Китая, Японии и других стран «Большой восьмерки». Мы особенно заинтересованы в развитии НЕПАД и стали его главным спонсором, как в финансовом, так и в политическом плане, в рамках Европейского союза. Нам следует рассмотреть возможность содействия расширению программы и увеличению ее финансирования и поддержки, чтобы помочь всей Африке.\n\n[FRA.GetNameWithFlag] является основным спонсором этой программы."
 AFRICA_idea_nepad_modifier_tt: "Влияние §Y[FRA.GetNameWithFlag]§! $foreign_influence_defense_modifier$ уменьшается на §Y10%§!\n"
 FRA_idea_nepad_modifier: "Спонсор программы развития НЕПАД"
 FRA_idea_nepad_modifier_desc: "Новое партнерство для развития Африки (сокращенно НЕПАД) — это программа экономического развития, разработанная Африканским союзом совместно с партнерами из Европейского союза, Китая, Японии и других стран «Большой восьмерки». Мы особенно заинтересованы в развитии НЕПАД и стали его основным спонсором, как в финансовом, так и в политическом плане, в рамках Европейского союза. Нам следует рассмотреть возможность содействия расширению программы и увеличению ее финансирования и поддержки, чтобы помочь всей Африке.\n\n[FRA.GetNameWithFlag] является основным спонсором этой программы, и, таким образом, мы получим дополнительные преимущества, такие как усиление иностранного влияния в странах, которые в настоящее время получают выгоду от программы.\n"
 FRA_idea_nepad_modifier_cost_tt: "Наше спонсорство развития НЕПАДа $[?FRA.FRA_nepad_sponsor_weekly_cost|-3]b еженедельно."
 FRA_unrestricted_subjugation_idea: "Неограниченное подчинение"
 FRA_unrestricted_subjugation_idea_desc: "Колонии, которыми мы владели, принесли нам невероятное богатство и огромный авторитет на мировой арене. В некоторых отношениях мы должны вернуться к прежним традициям и начать вновь противостоять другим странам, защищая то, что должно принадлежать нам по праву. Подчинение может происходить разными способами, например, с помощью военной силы, дипломатического давления и многого другого. Препятствия, мешающие нам сделать это, должны быть устранены."
 FRA_SYR_anti_assad_regime_message_idea: "Сообщения против режима Асада"
 FRA_SYR_anti_assad_regime_message_idea_desc: "[FRA.GetNameWithFlag] начал вести трансляцию и распространять пропаганду против сирийского правительства. Его сообщения подрывают авторитет правительства и продолжают радикализировать молодежь против правящего класса. Это также демонстрирует уязвимость правительства перед иностранным влиянием."
 FRA_educational_development_idea: "Развитие образования"
 FRA_educational_development_idea_desc: "[FRA.GetNameWithFlag] оказывает помощь в реализации образовательных программ в нашей стране. Развитие образования позволяет снизить затраты и одновременно модернизировать и улучшить существующие системы образования."
 FRA_resource_prospects_idea: "Поиск ресурсов"
 FRA_resource_prospects_idea_desc: "[FRA.GetNameWithFlag] в настоящее время помогает в разведке ресурсов в нашей стране, чтобы потенциально открывает больше возможностей для развития экономики."
 FRA_SYR_escalation_from_the_damascus_spring_idea: "Полдержка Дамасской весны"
 FRA_SYR_escalation_from_the_damascus_spring_idea_desc: "[FRA.GetNameWithFlag] продолжает распространять пропаганду о стремлении к демократии в нашей стране. Его усилия направлены на подрыв авторитета нашего лидера [SYR.GetLeader], в то время как мы пытаемся стабилизировать ситуацию в стране."
 FRA_faction_the_paris_accord: "Парижское соглашение"
 FRA_house_of_bonaparte_crowned: "Бонапарт коронован!"
 FRA_a_peaceful_rise_flag: "Мирная внешняя политика"
 FRA_an_aggressive_expansionism_flag: "Агрессивная внешняя политика"
 FRA_aze_supports_our_enemy: "Поддержка Армении"
 FRA_antagonize_syria_opinion: "Вы нас провоцируете!"
 FRA_haiti_demands_reparations_opinion: "Требование репараций"
 FRA_repealed_the_ordinance_opinion: "Отмена ордонанса 1825 года"
 FRA_francophone_solidarity_opinion: "Франкоязычная солидарность"
 FRA_supported_nepad_development_opinion: "Поддержка развития НЕПАД"
 FRA_preparing_launch: "Подготовка к запуску французской МКС"
 FRA_french_pillar_of_counterterrorism_tt: "Отправляя §Yиностранных советников§! в страны для §Yконтртеррористических целей§! наши советники удваивают бонус, предоставляемый §Yстране-советнику§!."
 FRA_leave_eu_tt: "Шансы на выход из ЕС возрастают, если популярность националистов превышает 25%."
 france_md.110.t: "Референдум о статусе махорана"
 france_md.110.d: "Жители Майотты решили провести референдум, чтобы определить свою судьбу в составе Французской Республики. Остров Майотта является частью Французской Республики с 1841 года, когда он был продан Франции бывшим королем Мадагаскара. Ведущие местные чиновники стремятся укрепить свою роль во Французской Республике, официально войдя в ее состав, добиваясь независимости от Франции или став частью Коморских островов. Что же нам следует сделать?"
 france_md.110.a: "Разрешить проведение Референдума"
 france_md.110.b: "Отказать в проведении референдума"
 france_md.110.c: "Предоставьте им ограниченную автономию."
 france_md.111.t: "Результаты Референдума о статусе махорана"
 france_md.111.d: "еферендум, наконец, подошел к своему естественному завершению, и результаты уже известны. Будущее Майотты зависело от этих результатов."
 france_md.111.a: "Совершенство."
 france_md.505.t: "Предложение о слиянии KMW и Nexter"
 france_md.505.d: "Правительства Франции и Германии завершают разработку плана по слиянию компаний Nexter Systems и Krauss-Maffei Wegmann в единый франко-германский оборонный холдинг. Созданный в результате консорциум KANT объединит под одной крышей производственные линии танков Leclerc и Leopard 2, сформирует общий портфель артиллерийской техники и боеприпасов, а также станет основой будущей европейской программы по созданию основных боевых танков.\n\nМинистры намерены получить политическое одобрение до того, как начнется передача акций."
 france_md.505.a: "Утвердить слияние"
 france_md.505.b: "Сохранить независимость Nexter"
 TT_FRA_knds_merge_carry_traits: "§YВсе должностные обязанности, выполненные в компании Nexter, будут перенесены в новую организацию KNDS.§!"
 france_md.506.t: "Arquus: Консолидация в промышленности"
 france_md.506.d: "Оборонные дочерние компании Volvo Group, Renault Trucks Defense и Panhard General Defense, завершили слияние в единую структуру. Новая фирма, Arquus, объединяет платформы колесной мобильности Renault с опытом Panhard в области разведывательной техники и позиционирует Францию ​​как единого игрока на европейском рынке бронированных автомобилей. Объединенные производственные знания, программы и специалисты по модификации обеих компаний переходят в новую организацию."
 france_md.506.a: "Новая глава в истории французской бронетанковой техники"
 france_md.506_tt: "Renault и Panhard объединятся в Arquus."
 FRA_arguus_established: "В 2018 году компании Renault и Panhard были объединены в Arquus."
 france_md.507.t: "Компания Eurocopter стала Airbus Helicopters."
 france_md.507.d: "С сегодняшнего дня Eurocopter Group переименована в Airbus Helicopters, объединив вертолетное подразделение EADS под единым брендом Airbus. Заводы в Мариньяне, Донаувёрте и линии по производству вертолетов Aérospatiale теперь работают под одним брендом."
 france_md.507.a: "Новая глава в истории европейского вертолетостроения."
 TT_FRA_airbus_change_carry_traits: "§YA Все характеристики, уже полученные в $FRA_eurocopter_manufacturer$, будут перенесены в $FRA_airbus_manufacturer$§!"
 france_md.508.t: "DCNS преобразуется в Naval Group"
 france_md.508.d: "С сегодняшнего дня исторический государственный арсенал Direction des Constructions Navales, давно переименованный в DCNS, принимает новое название Naval Group, что знаменует собой его трансформацию в полноценную частную корпорацию. Верфи в Лориане, Шербуре и Бресте теперь работают под одним брендом, наряду с совместным предприятием Naviris с Fincantieri и возобновленной экспортной кампанией, основанной на подводной лодке класса Suffren и фрегате FDI Belharra."
 france_md.508.a: "Новая глава во французском судостроении."
 TT_FRA_naval_takeover_carry_traits: "§YВсе исследования, уже завершённые в $FRA_dcn_manufacturer$, будут перенесены в $FRA_naval_group_naval_manufacturer$§!"
 FRA_nexter_manufacturer: "GIAT Industries"
 FRA_nexter_merge: "Компания Nexter объединилась с KMW в 2015 году."
 FRA_nexter_cold_war_legacy: "Наследие холодной войны"
 FRA_nexter_scorpion_programme: "Программа «Скорпион»"
 FRA_nexter_firepower_ammo: "Огневая мощь и боеприпасы"
 FRA_nexter_manufacturer_trait: "Доктрина огневой мощи CAESAR"
 FRA_nexter_manufacturer_trait_desc: "Начиная от кузниц Буржского арсенала и заканчивая установленной на грузовике гаубицей CAESAR, компания Nexter заслужила свою репутацию благодаря быстрой и точной огневой мощи, обеспечиваемой легкими гусеничными и колесными платформами."
 FRA_nexter_leclerc_programme: "Программа Леклерка"
 FRA_nexter_leclerc_programme_desc: "«Леклер» — флагманский основной боевой танк компании Nexter, разработанный в конце 1970-х годов и поступивший на вооружение в 1992 году. Его автоматическая система заряжания и модульная броня установили эталон для французской бронетанковой доктрины."
 FRA_nexter_leclerc_mk2: "Серия Леклер 2"
 FRA_nexter_leclerc_mk2_desc: "В рамках модернизации Series 2 были внедрены гибридная система кондиционирования воздуха, модернизированная электроника и улучшенные композитные броневые пакеты, что продлило срок службы платформы до 2020-х годов."
 FRA_nexter_leclerc_xlr: "Модернизация Leclerc XLR"
 FRA_nexter_leclerc_xlr_desc: "В рамках модернизации XLR, проведенной в середине жизненного цикла танка Leclerc, была создана система дистанционно управляемого вооружения, модульные броневые комплекты и интегрирована система управления боем SCORPION, что позволило ему оставаться конкурентоспособным по сравнению с более новыми моделями основных боевых танков."
 FRA_nexter_vbci: "Колесная БМП VBCI"
 FRA_nexter_vbci_desc: "Боевая бронированная машина пехоты (Véhicule Blindé de Combat d'Infanterie) стала первой современной колесной БМП для французской армии. Производство началось в 2008 году, и эта платформа стала основой бронетанковой мобильности моторизованных полков."
 FRA_nexter_famas: "Служебная винтовка FAMAS"
 FRA_nexter_famas_desc: "Штурмовая винтовка FAMAS с компоновкой буллпап служила стандартным оружием французской пехоты с 1981 года. Линейка стрелкового оружия Nexter выросла из производства и текущих контрактов на техническую поддержку."
 FRA_nexter_scorpion_core: "Интегрированная боевая система «Скорпион»"
 FRA_nexter_scorpion_core_desc: "Программа «Скорпион», официально утвержденная в 2014 году, объединила новое семейство колесных боевых машин французской армии в единую систему управления боем и цифровую инфраструктуру."
 FRA_nexter_griffon: "VBMR Грифон"
 FRA_nexter_griffon_desc: "«Гриффон» — это шестиколесный многоцелевой тактический бронетранспортер семейства «Скорпион», заменивший VAB в качестве стандартного французского бронированного транспортного средства для перевозки личного состава."
 FRA_nexter_jaguar: "EBRC Jaguar"
 FRA_nexter_jaguar_desc: "Шестиколесный разведывательно-боевой автомобиль Jaguar оснащен 40-мм пушкой CTA и ракетами Akeron MP, унаследовав концепции огневой мощи, проверенные на Leclerc."
 FRA_nexter_serval: "VBMR-L Сервал"
 FRA_nexter_serval_desc: "Облегченный четырехколесный Serval расширяет возможности Scorpion, позволяя использовать его в качестве машины специального назначения, патрульной машины и командного пункта благодаря компактному алюминиевому корпусу."
 FRA_nexter_40cta: "40-мм пушка CTA"
 FRA_nexter_40cta_desc: "Разработанная совместно с BAE Systems через компанию CTA International, 40-мм телескопическая пушка в кожухе обеспечивает компактную и высокоскоростную противотанковую огневую мощь для всего флота истребителей Scorpion."
 FRA_nexter_caesar: "Платформа CAESAR 155 мм"
 FRA_nexter_caesar_desc: "155-мм гаубица CAESAR, устанавливаемая на грузовик, сочетает в себе стратегическую мобильность и высокоточный огонь на большие дистанции, став самой успешной экспортной артиллерийской платформой компании Nexter."
 FRA_nexter_eurenco: "Пропелленты EURENCO"
 FRA_nexter_eurenco_desc: "Компания EURENCO поставляет порох, взрывчатые вещества и энергетические материалы, используемые во французской артиллерии и боеприпасах для стрелкового оружия, обеспечивая надежную цепочку поставок для продукции Nexter."
 FRA_nexter_nbc_sys: "Комплект NBC-Sys CBRN"
 FRA_nexter_nbc_sys_desc: "Дочерняя компания NBC-Sys специализируется на оборудовании для обнаружения и дезактивации химического, биологического, радиологического и ядерного оружия для французских и зарубежных вооруженных сил."
 FRA_nexter_lu_family: "Семейные обходы LU"
 FRA_nexter_lu_family_desc: "155-мм снаряды LU211 и семейство LU увеличивают дальность стрельбы артиллерии за счет донного кровопускания и улучшенной аэродинамики, стандартизируя стрельбу на дальние дистанции в стволах, совместимых с НАТО."
 FRA_nexter_bonus: "БОНУС: Умные боеприпасы"
 FRA_nexter_bonus_desc: "155-мм снаряд BONUS с сенсорным взрывателем представляет собой самонаводящийся суббоеприпас по бронетанковым колоннам, обеспечивая артиллерийским подразделениям возможность высокоточного поражения бронетехники, сравнимую со стандартными гаубицами."
