 israel_economy.193.t: "Israel propõe a Linha de Nitzana!"
 israel_economy.193.d: "Israel propõe a construção de uma ferrovia que ligará nossos países. O custo será dividido igualmente entre nós. Devemos concordar?"
 israel_economy.193.a: "Claro!"
 israel_economy.193.b: "Não!"
