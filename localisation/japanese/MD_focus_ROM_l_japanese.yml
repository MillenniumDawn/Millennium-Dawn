 ROM_ukrainian_ultimatum: "Ultimatum to Kyiv"
 ROM_ukrainian_ultimatum_desc: "Chernivtsi and Budjak belong to Romania. While Kyiv is too weak to refuse us, we should press our claim before someone else does."
 ROM_ukrainian_border_lands_category: "Northern Bukovina and Budjak"
 ROM_annex_bukovina_budjak: "Answer the Call of Our Kin"
 ROM_annex_bukovina_budjak_desc: "Ukraine's authority over Chernivtsi and Budjak has collapsed. Local Romanian councils are asking Bucharest to recognize a union, and no one is left in Kyiv to say no."
 ROM_333_return: "Romanianization of Budjak"
 ROM_333_return_desc: "Budjak has not been Romanian soil in decades. With the local population reconciled to Bucharest's rule, we can finish the work."
 ROM_335_return: "Romanianization of Northern Bukovina"
 ROM_335_return_desc: "Northern Bukovina was torn from us by Soviet ultimatum in 1940. With the province's compliance secured, we can make the reunion permanent."
 ROM_ukrainian_autonomies: "Karpaty Administration"
 ROM_ukrainian_autonomies_desc: "Governing the reclaimed Ukrainian border districts through local councils buys goodwill and speeds their integration, at the cost of a slower hand on the purse strings and public patience for the arrangement."
 romania_misc.20.t: "The Councils of Chernivtsi and Budjak"
 romania_misc.20.d: "With Kyiv unable to project authority this far from the capital, local assemblies in Chernivtsi and Budjak have voted to seek union with Romania. Bucharest is only too willing to oblige."
 romania_misc.20.a: "Welcome them home"
 romania_misc.21.t: "Governing the New Territories"
 romania_misc.21.d: "Chernivtsi and Budjak are Romanian on the map. Turning that into a functioning administration is another matter, and the government must decide how heavy a hand to use."
 romania_misc.21.a: "Rule through local councils"
 romania_misc.21.b: "Direct rule from Bucharest"
