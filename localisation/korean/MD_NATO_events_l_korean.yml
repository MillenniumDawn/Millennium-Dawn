l_korean:
 NATO.1.t: "[From.GetNameDef]과 NATO"
 NATO.1.d: "[From.GetNameDef] is a member of NATO. If we declare war on them, they will get the option to call upon other NATO members into the war. This means that it is quite likely that we will end up at war with the majority of NATO."
 NATO.1.a: "확인된 사항이다."
 NATO.2.t: "NATO에게 지원을 요청해야 하는가?"
 NATO.2.d: "우리는 타국의 공격을 당해왔습니다. NATO 회원국으로써 우리는 다른 NATO 회원국들이 우리를 도와 줄 것을 요구하는 조약 제 5조를 발동시킬 수 있습니다."
 NATO.2.a: "NATO를 부르자."
 NATO.2.b: "우리 혼자로도 된다"
 NATO.3.t: "[From.GetNameDef]의 지원 요청!"
 NATO.3.d: "[From.GetNameDef]은(는) 타국의 공격을 받았으며, NATO 제 5조를 발동시켰습니다. 이는 우리가 그들의 전쟁을 도와야 함을 의미합니다."
 NATO.3.a: "우리는 동맹국을 도와야만 한다!"
 NATO.3.b: "물러서는게 좋지 않을까?"
 NATO.4.t: "NATO 동원 해제"
 NATO.4.d: "이제 NATO 회원국에 대한 위협이 저지되었으므로 이들 국가 간의 군사 동맹을 해체 할 수 있습니다. NATO는 다른 회원국이 공격을 받으면 다시 모일 것입니다."
 NATO.4.a: "알겠다"
 NATO.5.t: "NATO 동원 해제"
 NATO.5.d: "이제 NATO 회원국에 대한 위협이 저지되었으므로 이들 국가 간의 군사 동맹을 해체 할 수 있습니다. NATO는 다른 회원국이 공격을 받으면 다시 모일 것입니다."
 NATO.5.a: "알겠다"
 NATO.6.t: "[From.GetNameDef]의 나토 탈퇴"
 NATO.6.d: "[From.GetNameDef]의 정부가 자신들이 NATO를 탈퇴할 것을 발표했습니다. 그들은 동맹이 더이상 자신들의 필요를 충당해주지 못하며, 옛 동맹국들과 함께 일하는 것을 불편하게 느꼈다고 말했습니다."
 NATO.6.a: "흥미롭군"
 NATO.7.t: "[From.GetNameDef] 측의 NATO 가입 요청"
 NATO.7.d: "[From.GetNameDef]은(는) NATO에 회원국으로써 가입하는 것에 관심을 보였습니다. 그들에게 가입준비단계 지위가 부여될 것이며, 그 후 그들이 NATO의 정식 회원국이 되기 위해서는 기존 NATO 회원국들 전원의 동의를 받아야만 합니다."
 NATO.7.a: "새로운 동맹인가?"
 NATO.8.t: "[From.GetNameDef]의 NATO 가입"
 NATO.8.d: "[From.GetNameDef]이(가) NATO의 정식 회원국으로 가입하는 것을 승인받았습니다. 그들은 현재 군사 동맹의 일부가 되었으며, 이제 동맹국을 방어하기 위해서라면 참전을 할것이고 혹은 그들의 새로운 동맹국들이 기꺼이 그들을 방어해줄 것입니다."
 NATO.8.a: "흥미롭군"
 NATO.14.a: "여기서 재미가 시작된다."
 NATO.14.b: "이것은 우리의 이익에 부합하지 않습니다."
 NATO.15.t: "[USA.GetNameDef]의 NATO 가입 요청 거부"
 NATO.15.d: "[USA.GetNameDef]이 우리의 NATO 가입 요청을 거부하였습니다."
 NATO.15.a: "Disappointing."
 NATO.9.t: "NATO로의 초대"
 NATO.9.d: "미합중국과 그 동맹국은 세계의 자유와 평화를 지키고 공동의 이익을 위해서 NATO로 가입할 것에 대한 연락과 설득을 보냈습니다."
 NATO.9.a: "수락하지!"
 NATO.9.b: "이 사안을 고려할 시간조차 없다."
 NATO.10.t: "[From.GetNameDef]의 NATO 가입!"
 NATO.10.d: "[From.GetNameDef]로부터의 공식적인 발표에 따르면 우리 대사관을 통해서 NATO에 가입한다는 단언을 하였습니다."
 NATO.10.a: "자유의 세계를 위해서!"
 NATO.11.t: "[From.GetNameDef]은(는) NATO 회원국이 되기를 거부했습니다."
 NATO.11.d: "[From.GetNameDef]은(는) 통지하기를 NATO 회원국은 자국의 이익과 같은 선상에 있지 않기에 절대로 함께할 수 없다고 했습니다."
 NATO.11.o1: "이런."
 NATO.14.t: "[From.GetNameDef]이(가) NATO 가입을 요청하다"
 NATO.14.d: "[From.GetNameDef]은(는) [USA.GetNameDef]에게 NATO 가입을 요청했습니다."
 NATO.16.t: "[From.GetName]의 나토 탈퇴!"
 NATO.16.d: "[From.GetNameDef]의 지도자 [From.GetLeader]는 오늘 나토를 탈퇴한다는 성명을 발표했습니다. 이는 군사동맹을 약화시킬 것입니다."
 NATO.16.o1: "좋은 선택이다"
 NATO.16.o2: "흥미롭군"
 NATO_join_tt: "당신과 다른 모든 §BNATO§! 회원국들 간의 상호 §Y의견 성장§!이 추가될 것입니다.\n모든 §BNATO§! 회원국들 간의 §Y군사적 접속§!이 추가될 것입니다.\n"
 NATO_leave_tt: "당신과 다른 국가들간의 상호 §Y의견 성장§!이 제거되며, 모든 §BNATO§! 회원국들 간의 §Y군사적 접속§!을 잃을 것입니다.\n당신에 대한 모든 §BNATO§! 회원국들의 §Y의견§!이 악화될 것입니다.\n"
 NATO_decisions: "NATO 회원국"
 NATO_decisions_desc: "\n£MAIN_desctext_nato \n\n\n\n§YNATO§!, or the §YNorth Atlantic Treaty Organisation§! is a military alliance between multiple North American and European countries. §YNATO§! constitutes a system of collective defense whereby its independent member states agree to mutual defense in response to an attack by any external party.\n\nThe buttons on the left hand side of the screen allow you to select a nation to display. The flags displayed show which nations still need to ratify that applicant's accession to NATO."
 leave_NATO: "NATO §Y탈퇴§!"
 leave_NATO_desc: "우리는 더이상 NATO에 관심이 없습니다"
 denounce_Status_As_Major_Non_NATO_Ally: "비 NATO 주요 동맹국의 지위를 §Y버리기§!"
 denounce_Status_As_Major_Non_NATO_Ally_desc: "더이상 NATO 동맹국들과 함께 군사작전을 수행할 수 없습니다."
 become_NATO_aspirant: "NATO에 야심적인 국가로 §Y변모§!"
 become_NATO_aspirant_desc: "NATO에 야심적인 국가들은 NATO 회원국이 되는데 크나큰 관심을 가지고 있습니다. NATO에 관심을 나타낸 후, NATO 가입을 허가받기 전까지 이에 필요한 절차들을 만족시킬 것입니다. 목표가 성취가 되면, 현존하는 NATO 회원국들에게 동의를 받아내는 대화의 장을 시작할 수 있을 것입니다."
 finish_NATO_membership_action_plan: "회원국 가입 절차 §Y완료§!"
 finish_NATO_membership_action_plan_desc: "By finishing the Membership Action Plan set on us by NATO, we can begin accession talks with the existing members. Each existing NATO member has to approve our application. Our status will remain as a NATO applicant until all members have approved our application."
 ratify_country_accession: "[From.GetName]의 NATO 가입 §Y비준§!"
 ratify_country_accession_desc: "[From.GetName] has finished their Membership Action Plan. Now the only thing left to do for us, along with other NATO members, is to ratify their accession, after which they will be a full NATO member."
 join_NATO: "NATO §Y가입§!"
 join_NATO_desc: "모든 다른 NATO 회원국들이 자국의 NATO 가입에 비준하였습니다. 이제 우리는 강력한 동맹국들을 보유하게 되었습니다."
 show_non_ratified_countries: "비준하지 않은 국가들 §Y보기§!"
 show_non_ratified_countries_desc: "이곳에 당신의 NATO 가입에 비준하지 않은 국가들이 있습니다. 이들과의 관계도를 올려 비준을 하도록 만들 수 있습니다."
 call_nato_to_arms: "전쟁에 NATO §Y호출!§!"
 call_nato_to_arms_desc: "우리는 외세로부터 침공을 받고 있습니다. 우리는 NATO 조약 제5조를 들어 우리의 동맹이 우리를 지키도록 할 수 있습니다."
 nato_enhance_forward_presence_brigade: "NATO의 E 여단 §Y배치§!"
 nato_enhance_forward_presence_brigade_desc: "최근 크림 반도 사태로 인해 미국은 위태로운 입장에 처했습니다. E 여단을 배치함으로써 러시아의 추가 공격을 억제하는 데 도움이 될 겁니다."
 RULE_CANT_LEAVE_NATO: "§R우리가 공격받고 있을때는 NATO를 떠날 수 없습니다!§!"
 RULE_CANT_KICK_OUT_OF_NATO: "§RWe can't kick countries out of NATO!§!"
 RULE_CANT_ASSUME_LEADERSHIP_OF_NATO: "§R전쟁에서 NATO의 지휘권은 최초의 지도자 국가로 고정되어 있습니다!§!"
 NATO.17.t: "정치적 변화"
 NATO.17.d: "Our recent shift into some less than democratic politics has caused NATO to abandon us. We no longer meet their silly requirements about so called democracy. We reject this notion and we are better off without NATO and their false protection!"
 NATO.17.o1: "그들이 없는게 더 낫다!"
 NATO_apply_to_become_major_non_nato_ally: "주요 비 NATO 동맹국 지위 요청"
 NATO_apply_to_become_major_non_nato_ally_desc: "Our overwhelmingly positive relations with the members of NATO and especially the leader of the faction has allowed us a unique opportunity to acquire Major Non-NATO allied status depending on our current situation."
 NATO_CSTO.1.t: "유럽 재래식 전력 조약 연장 제안"
 NATO_CSTO.1.d: "유럽 재래식 전력 조약은 CSTO 회원국과 나토의 유럽 회원국이 유럽에 배치하는 재래식 전력을 제한하는 것을 목표로 합니다. 이전의 바르샤바 조약기구와의 합의를 바탕으로 한 이번 제안은 향후 유럽에서 발생할 수 있는 분쟁을 방지하기 위해 최초 초안을 강화하는 것을 목적으로 합니다."
 NATO_CSTO.1.a: "우리는 동의할 것입니다"
 NATO_CSTO.1.b: "우리의 이익에 부합하지 않는다."
 NATO_CSTO.2.t: "유럽 재래식 전력 조약 수락"
 NATO_CSTO.2.d: "[FROM.GetName]의 대사들이 찾아와 자국이 협정에 서명할 의향이 있음을 알려왔습니다. 다소 예상치 못한 일이지만, 서방 외교에는 분명 기쁜 날입니다."
 NATO_CSTO.2.a: "매우 반가운 일입니다."
 NATO_CSTO.3.t: "유럽 재래식 전력 조약 거부"
 NATO_CSTO.3.d: "[FROM.GetName]의 대사들이 찾아와 자국이 협정 서명을 거부한다는 뜻을 알려왔습니다. 예상했던 일이긴 하나, 서방 외교에는 여전히 어두운 날입니다."
 NATO_CSTO.3.a: "그들이 실제로 위협이 될 수 있기라도 한 것처럼..."
 NATO_CSTO.100.t: "유럽 재래식 전력 조약 서명"
 NATO_CSTO.100.d: "CFE 조약은 냉전이 끝나갈 무렵인 1990년에 나토와 바르샤바 조약기구가 서명했습니다."
 NATO_CSTO.100.a: "Let's hope this will last."
 NATO_CSTO.100.b: "현명한 선택이었다."
 NATO_CSTO.100.c: "유럽에 평화의 세기가 찾아오는 건가?"
 NATO_CSTO.101.t: "유럽 재래식 전력 조약 단호히 거부"
 NATO_CSTO.101.d: "CFE 조약은 냉전이 끝나갈 무렵인 1990년에 나토와 바르샤바 조약기구가 서명했습니다."
 NATO_CSTO.101.a: "그들은 스스로 문제를 만들고 있을 뿐이다."
 NATO_CSTO.101.b: "우리는 우리가 옳다고 여기는 대로 행동할 것이다."
 NATO_CSTO.101.c: "A new Cold War on the horizon?"
 NATO_CSTO.103.t: "유럽 재래식 전력 조약 효력 상실"
 NATO_CSTO.103.d: "CFE 조약과 그 연장안이 이제 효력을 잃고 있습니다. 전문가들은 그 결과를 예측하느라 애쓰고 있지만, 한 가지는 분명합니다. 유럽 상공에 폭풍이 몰려오고 있다는 것입니다."
 NATO_CSTO.103.a: "그들은 절대로 믿을 수 없다"
 NATO_CSTO.103.b: "평화 회담은 여기서 끝이군."
 NATO_CSTO.103.c: "나토가 규칙을 위반하고 있습니까?"
 NATO_CSTO.104.t: "유럽 재래식 전력 조약 효력 상실"
 NATO_CSTO.104.d: "CFE 조약과 그 연장안이 이제 효력을 잃고 있습니다. 전문가들은 그 결과를 예측하느라 애쓰고 있지만, 한 가지는 분명합니다. 유럽 상공에 폭풍이 몰려오고 있다는 것입니다."
 NATO_CSTO.104.a: "Any agreement with Russia is worth less than the paper it's printed on."
 NATO_CSTO.104.b: "우린 이제서야 막 무장하고 있다."
 NATO_CSTO.104.c: "CSTO might try to bite off more than it can chew."
 nato_name_string_tt: "[THIS.GetName]"
 nato_deploy_turkish_brigade: "나토 S 여단 §Y배치§!"
 nato_deploy_turkish_brigade_desc: "튀르키예는 나토에 대한 헌신을 거듭 재확인해 왔습니다. 이 지역에 새로운 여단을 배치하여 감사를 표해야 합니다."
 NATO.20.t: "나토 지도권 이양"
 NATO.20.d: "미국이 자국의 붕괴에 몰두하느라 더 이상 동맹을 이끌 수 없게 되었습니다. 나토의 잔여 회원국들은 동맹을 유지하기 위해 새로운 지도국 아래 결집했습니다."
 NATO.20.a: "동맹은 지속된다"