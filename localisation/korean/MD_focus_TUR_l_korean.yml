 TurkicConfederation.3.d: "튀르키예 정부가 우리에게 접근하여 새로 설립된 튀르크 연합에 가입할 것을 요청했습니다. 가입하면 분명 통합되겠지만, 우리는 주권 국가로서의 지위를 잃게 될 것입니다.."
