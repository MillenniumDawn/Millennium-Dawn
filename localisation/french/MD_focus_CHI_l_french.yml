 CHI_bri_global_presence: "Présence mondiale de la BRI"
 CHI_bri_global_presence_desc: "Mesure cumulative de l'empreinte mondiale de la BRI chinoise, accumulée à mesure que les États partenaires achèvent des projets et montent dans les rangs de partenaires. Elle module en continu l'esprit Présence mondiale de la BRI et conditionne les focalisations tardives des Nouvelles routes de la soie."
