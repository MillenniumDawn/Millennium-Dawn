 CBD.conservatism: "£generic_conservatism_small 奉辛比克党"
 CBD.conservatism_desc: "（君主主义）- 奉辛比克（柬埔寨独立、中立、和平与合作全国联合阵线）由诺罗敦·西哈努克创立，是现代柬埔寨的主要反对派。它最初是西哈努克为反对红色高棉和越南支持的柬埔寨人民共和国而成立的第二个流亡组织。1992年，该组织组建为政党，其主要主张维护君主制。"
 CBD.Autocracy: "£generic_Autocracy_small (CPP) 柬埔寨人民党"
 CBD.Autocracy_desc: "（务实专制）- 柬埔寨人民革命党成立于1951年，最初是一个马克思列宁主义政党，与越南和苏联结盟，而非像其主要反对党红色高棉那样与中国结盟。该党没有与波尔布特领导的红色高棉结盟，而是在越南的支持下组建政府，以结束其推行的政策。此后，在世界剧烈变革的时代，该党统治着动荡不安的柬埔寨。随着社会主义阵营的瓦解，该党逐渐放弃了对马克思列宁主义乃至社会主义的承诺。尽管在20世纪90年代，一些持有左翼观点的派别仍然活跃，但他们被务实派边缘化，后者旨在维持对柬埔寨的控制，而不倾向于任何特定的意识形态。"
 CBD.Neutral_conservatism: "£generic_Neutral_conservatism_small (KDP) 高棉民主党"
 CBD.Neutral_conservatism_desc: "（民族保守主义）- 高棉民主党成立于1998年，主张将保守政策与名义上的改革主义观点相结合，尤其是在民主和人权方面。"
 CBD.neutral_Social: "£generic_neutral_Social_small (LDP) 民主联盟党"
 CBD.neutral_Social_desc: "（第三道路）- 民主联盟党倡导社会自由主义、进步主义和世俗主义的融合，名义上是一个左翼政党，致力于建设一个更加平等和民主的柬埔寨。该党提出了八项政治改革纲领，但尽管其纲领广泛，支持率持续增长，却鲜有选举成功。"
 CBD.Neutral_Libertarian: "£generic_Neutral_Libertarian_small (CNSP) - 柬埔寨民族永续党"
 CBD.Neutral_Libertarian_desc: "（民族自由主义）- 柬埔寨民族永续党将对君主制和强大的中央集权国家的保守支持与在妇女权利和民主改革方面的中左翼社会立场相结合，把自己标榜为一个寻求创建一个多元化国家的温和反对党。"
 CBD.Nat_Autocracy: "£generic_Nat_Autocracy_small (RCAF) 柬埔寨皇家军队"
 CBD.Nat_Autocracy_desc: "（君主制军政府）- 柬埔寨军政府最初成立于1953年，由于柬埔寨动荡的历史，此后经历了多次更迭，在数次战争、政变和入侵中幸存下来。目前较为温和的武装力量是由柬埔寨人民革命军和民主柬埔寨国民军合并而成，后者还包括一些与红色高棉结盟的反对派团体。由于政治的专制性质，军队虽然表面上不涉政治，但却深受柬埔寨人民党近乎完全的控制及其务实的统治方式的影响。"
 CBD.Nat_Fascism: "£generic_Nat_Fascism_small 高棉反贫困党"
 CBD.Nat_Fascism_desc: "（民族大西洋主义）- 高棉反贫困党利用维护柬埔寨边境完整的民族主义言论和消除贫困的民粹主义言论，宣称希望在柬埔寨建立“美式”政府。该党声称得到多位美国顾问和投资者的支持，但尽管有这些所谓的联系，却从未在选举中取得任何成功。"
 CDI.liberalism: "£CDI_liberalism_small 共和人士联盟(RDR)"
 CDI.liberalism_icon: "£CDI_liberalism_small"
 CDI.liberalism_desc: "共和人士联盟是科特迪瓦的一个主要自由党。由于与科特迪瓦民主党在1995年总统选举中选择的领导人存在分歧，该委员会于20世纪90年代初作为科特迪瓦民主党的一个分支而成立。自阿拉萨内·瓦塔拉返回科特迪瓦以来，他们已成为他的支持党，拥护严格的自由主义政策和共和主义价值观。"
 CDI.socialism: "£CDI_socialism_small 科特迪瓦劳工党(PIT)"
 CDI.socialism_icon: "£CDI_socialism_small"
 CDI.socialism_desc: "科特迪瓦劳工党是一个中左翼、民主社会主义和社会民主党。由弗朗西斯·沃迪于1990年成立，旨在参加科特迪瓦的选举。"
