 gcc_invite.1.t: "来自海湾的邀请"
 gcc_invite.1.d: "[FROM.GetName]代表海湾合作委员会正式邀请我们加入该联盟。加入将把我们的经济与安全同阿拉伯世界最富有的集团绑定在一起。海合会正等待我们的答复。"
 gcc_invite.1.a: "我们接受。海合会万岁。"
 gcc_invite.1.b: "我们现在必须拒绝。"
 gcc_invite.2.t: "海合会迎来新成员"
 gcc_invite.2.d: "在利雅得举行的一场仪式上，海湾合作委员会正式接纳了一个新成员国，首次将这一联盟的版图扩展至海湾沿岸之外。该组织的势力范围及其雄心正不断壮大。"
 gcc_invite.2.a: "历史性的一天。"
 gcc_invite.3.t: "邀请被拒绝"
 gcc_invite.3.d: "我们的邀请已被拒绝。海合会的扩张只能等待更愿意合作的伙伴，或是对方改变心意了。"
 gcc_invite.3.a: "就这样吧。"
