 Chim: "BASF와 협력"
 BLR_BM21_Grad: "BM21 그라드"
 belarus_another.6.t: "루카셴코의 추종 세력"
 belarus_another.6.d: "알렉산드르 루카셴코는 매우 오랫동안 벨라루스 공화국의 종신 대통령으로 군림해 왔습니다. 그의 통치 기간 동안 그를 둘러싸고 \\"바트카\\"에 대한 일종의 숭배가 형성되었습니다. 이 숭배는 그를 다른 CIS 독재자들과 구별 짓지만, 동시에 그가 국민과 특정한 방식으로 교류할 것을 요구합니다. 바트카 지지도 지표는 알렉산드르 그리고리예비치 루카셴코에 대한 지지가 모든 계층에 걸쳐 얼마나 강한지를 보여 줍니다. 다양한 행동에 따라 이 지표는 오르거나 내리며, 그에 따라 여러 보너스 또는 페널티가 부여됩니다."
 belarus_another.6.a: "우리 바트카 루카셴코, 벨라루스의 어머니시여"
 mensk: "민스크"
 shatilki: "스베틀로고르스크"
 berestye: "브레스트"
 BLR_sso: "특별 작전군 창설"
 BLR_sso_desc: "벨라루스 공화국 군대의 특수작전군은 기동성이 높은 벨라루스 군대의 한 병과로, 벨라루스 내 소련 공수군과 소련 GRU 특수부대의 후신입니다. 주요 임무는 방첩 활동, 정보 수집, 불법 무장 집단 소탕, 그리고 벨라루스 공화국에 대한 무력 충돌을 종결시키기 위한 특수 기법을 사용한 각종 임무 수행입니다. 이들은 전략적 억제력의 주요 요소 중 하나로 활동합니다."
 BLR_trans_army: "수송대 창설"
 BLR_trans_army_desc: "벨라루스 수송 부대는 트럭, 철도, 항공을 통한 인원과 물자의 이동을 담당하는 벨라루스 군대의 병과입니다. 전국의 다른 병과 소속 군 편제에 수송 지원 임무를 수행하도록 편성되어 있습니다."
 BLR_russian_fsb: "Let In The FSB Representative Offices"
 BLR_russian_tver: "와곤 (Wagons) 구매"
 BLR_russian_teplovzor: "Opening of Production of Thermal Imagers"
 BLR_reforming_army: "육군 개혁"
