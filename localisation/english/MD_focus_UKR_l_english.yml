 UKR_idea_pro_ukraine_reform_1: "Reformed Government."
 UKR_idea_pro_ukraine_reform_1_desc: "Anti-corruption government reforms reduce waste and inefficiency, restoring public confidence despite initial transition costs."
 UKR_west_east_rivalry_balanced: "Between East and West \n§LCurrent rivalry status:§! §GBalanced§!\n"
 UKR_west_east_rivalry_balanced_desc: "The end of the Cold War brought an unprecedented degree of independence to Ukraine. Nevertheless, the legacy of suzerainty lingered, making the country's political scene more volatile. Russia continues to influence Ukraine from the east, while the European Union began to exert its power over the country from the west. Within Ukraine, competing political factions emerged, each loyal to one foreign patron or the other. \n\n§RChanges in domestic or foreign policy may disrupt the balance of power between the pro-Western and pro-Eastern camps!§! \n\n§C(Pro-Eastern predominance)§! \nThe government will focus on closer ties with Russia (including CSTO and EACU integration), which will cause discontent among nationalist forces. \n\n§C(Pro-Western predominance)§! \nThe government will focus on EU and NATO integration, which, in turn, will cause discontent among the opponents in the pro-Russian camp."
 UKR_west_strengthened: "Between East and West \n§LCurrent rivalry status:§! §GMoving towards West§!\n"
 UKR_west_strengthened_desc: "The end of the Cold War brought an unprecedented degree of independence to Ukraine. Nevertheless, the legacy of suzerainty lingered, making the country's political scene more volatile. Russia continues to influence Ukraine from the east, while the European Union began to exert its power over the country from the west. Within Ukraine, competing political factions emerged, each loyal to one foreign patron or the other. \n\n§RChanges in domestic or foreign policy may disrupt the balance of power between the pro-Western and pro-Eastern camps!§! \n\n§C(Pro-Eastern predominance)§! \nThe government will focus on closer ties with Russia (including CSTO and EACU integration), which will cause discontent among nationalist forces. \n\n§C(Pro-Western predominance)§! \nThe government will focus on EU and NATO integration, which, in turn, will cause discontent among the opponents in the pro-Russian camp."
 UKR_west_dominant: "Between East and West \n§LCurrent rivalry status:§! §GPro-Western§!"
 UKR_west_dominant_desc: "The end of the Cold War brought an unprecedented degree of independence to Ukraine. Nevertheless, the legacy of suzerainty lingered, making the country's political scene more volatile. Russia continues to influence Ukraine from the east, while the European Union began to exert its power over the country from the west. Within Ukraine, competing political factions emerged, each loyal to one foreign patron or the other. \n\n§RChanges in domestic or foreign policy may disrupt the balance of power between the pro-Western and pro-Eastern camps!§! \n\n§C(Pro-Eastern predominance)§! \nThe government will focus on closer ties with Russia (including CSTO and EACU integration), which will cause discontent among nationalist forces. \n\n§C(Pro-Western predominance)§! \nThe government will focus on EU and NATO integration, which, in turn, will cause discontent among the opponents in the pro-Russian camp."
 UKR_east_strengthened: "Between East and West \n§LCurrent rivalry status:§! §GMoving towards East§!\n"
 UKR_east_strengthened_desc: "The end of the Cold War brought an unprecedented degree of independence to Ukraine. Nevertheless, the legacy of suzerainty lingered, making the country's political scene more volatile. Russia continues to influence Ukraine from the east, while the European Union began to exert its power over the country from the west. Within Ukraine, competing political factions emerged, each loyal to one foreign patron or the other. \n\n§RChanges in domestic or foreign policy may disrupt the balance of power between the pro-Western and pro-Eastern camps!§! \n\n§C(Pro-Eastern predominance)§! \nThe government will focus on closer ties with Russia (including CSTO and EACU integration), which will cause discontent among nationalist forces. \n\n§C(Pro-Western predominance)§! \nThe government will focus on EU and NATO integration, which, in turn, will cause discontent among the opponents in the pro-Russian camp."
 UKR_east_dominant: "Between East and West \n§LCurrent rivalry status:§! §GPro-Eastern§!"
 UKR_east_dominant_desc: "The end of the Cold War brought an unprecedented degree of independence to Ukraine. Nevertheless, the legacy of suzerainty lingered, making the country's political scene more volatile. Russia continues to influence Ukraine from the east, while the European Union began to exert its power over the country from the west. Within Ukraine, competing political factions emerged, each loyal to one foreign patron or the other. \n\n§RChanges in domestic or foreign policy may disrupt the balance of power between the pro-Western and pro-Eastern camps!§! \n\n§C(Pro-Eastern predominance)§! \nThe government will focus on closer ties with Russia (including CSTO and EACU integration), which will cause discontent among nationalist forces. \n\n§C(Pro-Western predominance)§! \nThe government will focus on EU and NATO integration, which, in turn, will cause discontent among the opponents in the pro-Russian camp."

 UKR_idea_orthodox_christian_church: "Ukrainian Orthodox Church"
 UKR_idea_shortened_general_staff: "Compact General Staff"
 UKR_idea_shortened_general_staff_desc: "Streamlining the military command structure improves planning efficiency and accelerates officer development."
 UKR_uda_encouraged: "Encouraged UDA"
 UKR_uda_encouraged_desc: "Incorporation of the UDA militia into the armed forces improves combat capability but reduces military discipline."
 UKR_uda_integrated: "Integrated UDA"
 UKR_uda_integrated_desc: "The Ukrainian Volunteer Army has been fully integrated into the regular armed forces, strengthening discipline and nationalist sentiment."
 UKR_foreign_advisors: "Foreign Advisors"
 UKR_ukrtelekom_idea: "Ukrtelecom"
 UKR_ukrtelekom_idea_desc: "Ukrtelecom, the state telecommunications monopoly, has been modernized to expand digital infrastructure and boost productivity."
 UKR_finance_and_it: "Finance & IT Sector Support"
 UKR_finance_and_it_desc: "Development of finance and information technology sectors creates high-value economic activity and improves research capabilities."
 UKR_digital_state: "Ukrainian Digital State"
 UKR_digital_state_desc: "Diia (Ukrainian: Дія, lit.'Action'; also an acronym for Ukrainian: Держава і Я, lit.'State and Me') is a mobile app, a web portal and a brand of e-governance in Ukraine. Launched in 2020, the Diia app allows Ukrainian citizens to use digital documents on their smartphones instead of physical ones for identification and sharing purposes.\n\nThe Diia portal allows access to over 50 government services. Eventually, the government plans to make all kinds of state-person interactions available through Diia."
 UKR_tax_avoidance_idea: "Negligible Tax Avoidance"
 UKR_tax_avoidance_idea_desc: "While tax may be overlooked, and even unloved, in reality it is our social superpower. Tax allows us to choose to organise our communities, at the local and national level, so that we can all live better lives, together.\n\nBut a fundamental obstacle is the ease with which powerful elites step outside of their social obligations - outside of their responsibilities to the societies they are part of, and from which they profit. - Report on Tax Justice 2023"
 UKR_nuclear_energy: "Energoatom"
 UKR_nuclear_energy_desc: "Investment in nuclear power plants increases domestic energy generation and reactor construction output."
 UKR_construction: "Construction Effort"
 UKR_construction_desc: "Construction capacities allocated to urgent State-financed projects."
 UKR_demographic_boom: "Demographic Boom"
 UKR_demographic_boom_desc: "Favorable demographic trends and population growth policies expand our available manpower and workforce."
 UKR_demographic_crisis: "Demographic Crisis"
 UKR_demographic_crisis_desc: "The country's population has been declining since the 1990s because of a high emigration rate, coupled with high death rates and low birth rates. The population has been shrinking by an average of over 300,000 annually since 1993."
 UKR_tackle_corruption: "Tackle Corruption!"
 UKR_tackle_corruption_desc: "Anti-corruption campaign and institutional reforms dramatically improve government efficiency and national productivity."
 UKR_corruption: "Deep-rooted Corruption"
 UKR_large_construction: "Large Construction Program"
 UKR_large_construction_desc: "An ambitious infrastructure development program accelerates building completion and productivity, though energy consumption increases significantly."
 UKR_medical_reform: "Medical Reform"
 UKR_medical_reform_desc: ""
 UKR_aamdf: "Anti-Air Missile Forces"
 UKR_aamdf_desc: "An organized anti-aircraft missile defense force significantly strengthens our air defense capability and reduces effectiveness of enemy close air support."
 UKR_radio_troops: "Radio Engineering Troops"
 UKR_radio_troops_desc: "Air force radio engineering and signals units enhance reconnaissance and interception while reducing aircraft losses."
 UKR_air_support_fac: "Air Force Support Facilities"
 UKR_air_support_fac_desc: "Investment in air support facilities improves fuel efficiency and aircraft reliability, reducing operational costs while enhancing performance."
 UKR_cut_subsidies: "Cut Energy Subsidies"
 UKR_cut_subsidies_desc: "Eliminating energy subsidies forces consumers to bear true production costs, improving productivity while reducing fiscal strain."
 UKR_health_cost: "Healthier Nation!"
 UKR_health_cost_desc: ""
 UKR_military_rehab: "Rehabilitation System for the Military"
 UKR_military_rehab_desc: "Veteran rehabilitation programs boost troop morale and organizational cohesion, though at increased healthcare expense."
 UKR_resource_extraction: "Increased Resource Extraction"
 UKR_resource_extraction_desc: "Expanded resource extraction operations increase domestic supply of minerals and fuels."
 UKR_research_boost: "Ukraine Research Support Program"
 UKR_research_boost_desc: "Centralized research support program accelerates technological development across military and civilian sectors."
 UKR_economy_boost: "Improvements in the Economy"
 UKR_economy_boost_desc: "A temporary economic stimulus program accelerates productivity and factory efficiency, though at increased energy cost."

