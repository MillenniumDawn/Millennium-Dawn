l_spanish:
 industrial_complex: "Industria Civil"
 industrial_complex_plural: "Industrias Civiles"
 industrial_complex_desc: "Este edificio proporciona al estado una industria para la producción de bienes civiles o la construcción de nuevos edificios. Puede convertirse en industria militar si es necesario.\n\nProporciona al estado:\nNúmero base de trabajadores requeridos:§Y206K§!\nProducto del PIB base por §Yindustria civil§!: $§Y17.5B§!\nConsumo básico de energía: §R-0.5§! GW\n"
 arms_factory: "Industria Militar"
 arms_factory_plural: "Industrias Militares"
 arms_factory_desc: "Este edificio proporciona al estado una industria para la producción de nuevo equipamiento militar. Puede convertirse en industria civil si es necesario.\n\nProporciona al estado:\nNúmero base de trabajadores requeridos:§Y18.8K§!\nProducto del PIB base por §Yindustria militar§!: $§Y1.5B§!\nConsumo básico de energía: §R-0.5§! GW"
 internet_station: "Infraestructura de Red"
 internet_station_plural: "Infraestructura de Red"
 internet_station_desc: "Las §YInfraestructuras de Red§! son estructuras altas utilizadas en los campos de las telecomunicaciones y las comunicaciones por radio para transmitir señales a largas distancias o a través de cables de fibra óptica subterráneos y sistemas de computación en la nube.\n\nProporciona al estado:\nNúmero base de trabajadores requeridos: §Y12 mil§!\nProducto base del PIB por §YInfraestructura de red§!: $§Y3.5 billones§!\n\nCada nivel de §YInfraestructura de Red§! mejora la velocidad de construcción local en §G+5.00%§!.\nCada nivel de §YInfraestructura de red§! reduce la duración de §YInversiones internacionales§! en §G-5,00%§!."
 dockyard: "Astillero Naval"
 dockyard_plural: "Astilleros Navales"
 dockyard_desc: "Los §Yastilleros navales§! son representativos de la capacidad de un estado para producir embarcaciones militares de todo tipo, desde lanchas §Ypatrulleras§!, §Yconvoyes§!, §Ydestructores§!, §Yportaaviones§! y más.\n\nProporciona al estado:\nNúmero base de trabajadores requeridos:§Y18.8K§!\nProducto del PIB base por §YPatio Naval§!: $§Y1.5B§!\nConsumo básico de energía: §R-0.5§! GW"
 air_base_desc: "Una §YBase Aérea§! es una instalación de almacenamiento y un complejo militar para el despliegue y preparación de sus fuerzas aéreas. Se puede apilar hasta el nivel diez añadiendo una capacidad adicional de §Y50§! aviones por nivel."
 radar_station_desc: "§YRadar Stations§! allows you to gain intel on enemy troops in nearby states. It consists of various radars and sensors, as well as intel assets and capacity to analyse the evolving situation.\nA higher level will increase its effective range.\nIts radars also provide the state with better detection of enemy air forces, giving your aircraft a better chance to engage them.\nIn addition the radars are increasing detection of enemy fleets at sea."
 anti_air_building: "Sitios de SHORAD"
 anti_air_building_plural: "Sitios de SHORAD"
 anti_air_building_desc: "Los §YSitios YSHORAD§! (Short Range Air Defense) son complejos y grupos de armas y tácticas antiaéreas que se encargan de la defensa aérea contra amenazas aéreas de baja altitud. Estos sitios trabajan juntos para dividir el espacio aéreo en áreas defendibles, proporcionando objetivos militares locales y cobertura aérea de infraestructura desde helicópteros hasta aviones de bajo vuelo y jets."
 nuclear_reactor_desc: "Este edificio convierte la energía nuclear en energía eléctrica, consumiendo uranio moderadamente enriquecido en el proceso.\n\nProporciona al estado:\nNúmero base de trabajadores requeridos: §Y115 mil§!\nProducto base del PIB por §YReactor Nuclear§!: $§Y4 billones§!\nGanancia de potencia base: §G+5§! GW\n"
 synthetic_refinery_desc: "Este edificio proporciona al estado una industria para la producción de caucho sintético y capacidad adicional para la producción de combustible.\n\nProporciona al estado:\nNúmero base de trabajadores requeridos: §Y245K§!\nProducción base del PIB por §YRefinería Sintética§!: $§Y10 mil millones§!\nConsumo base de energía: §R-0.2§! GW\n\nProduce §YGoma§! a precios de mercado estándar, con excedentes que generan ingresos en efectivo además del impuesto corporativo.\n"
 fuel_silo: "Reservas de Recursos Estratégicos"
 fuel_silo_plural: "Reservas de Recursos Estratégicos"
 fuel_silo_desc: "The §YStrategic Resource Reserve§! is an amalgamation of warehouses, dry storage, and other §YFuel§! like storage. This building provides your nation with more room for stockpiling §HFuel§! and §HResources§!.\n\nNOTE: §YResource Storage§! has an engine limitation to where if you are on §Y$export_economy$§! or §Y$globalized_trade_economy$§! you may end up sending more resources to export than to your needed production lines. If you need to start to withdraw from storage it is recommended you switch to §Y$mixed_economy$§! or lower.\n"
 offices: "Sector de Oficinas"
 offices_plural: "Sectores de Oficinas"
 offices_desc: "The §YOffice Sectors§! represent all the other industries of the economy beyond the extraction and heavy industries. These include financial, customer, information technology, retail services and so much more.\n\nProvides the state with:\nBase Number of Required Workers: §Y473K§!\nBase GDP Output per §YOffice Sector§!: $§Y50 Billion§!\nBase Energy Consumption: §R-0.25§! GW"
 rail_way_plural: "Vías Férreas"
 fossil_powerplant: "Central eléctrica de combustibles fósiles"
 fossil_powerplant_plural: "Central eléctrica de combustibles fósiles"
 fossil_powerplant_desc: "§YCentrales eléctricas de combustibles fósiles§! es un comodín para todas las fuentes de energía termoeléctrica de origen fósil. Estos incluyen, entre otros; carbón, gas natural y petróleo.Las §Ycentrales eléctricas de combustibles fósiles§! quedarán inactivas si la generación de energía es mayor que el consumo.\n\nProporciona al estado:\nNúmero base de trabajadores requeridos: §Y7.5K§!\nProducto base del PIB por §Ycentral eléctrica de combustibles fósiles§!: $§Y1.7 Billion§!\nGanancia de potencia base: §G+2§! GW\n"
 fossil_powerplant_amount: "$VALUE|Y0=$"
 fossil_powerplant_resource: "£resources_strip|$FRAME$"
 agriculture_district: "Distrito de agricultura comercializada"
 agriculture_district_plural: "Distrito de Agricultura Comercializada"
 agriculture_district_desc: "Los §Ydistritos de agricultura comercializada§! representan un comodín para toda la agricultura que no es de subsistencia dentro de nuestra nación. Incluye agroindustria, tierras cultivables, silos de cereales, carnicerías y más.\n\nProporciona al estado:\nNúmero base de trabajadores requeridos:§Y188K§!\nProducto del PIB base por §Ydistritos de agricultura comercializada§!: $§Y25B§!\nConsumo básico de energía: §R-0.10§! GW\n§YGanancia de combustible§! de los estados: 8\n§YSuministros locales§!: 1.5%\n"
 agriculture_district_amount: "$VALUE|Y0=$"
 rocket_site: "Sitio de lanzamiento de misiles"
 rocket_site_plural: "Sitio de lanzamiento de misiles"
 rocket_site_desc: "Los §YSitios de Lanzamiento de Misiles§! representan un lugar de almacenamiento para todos los equipos de misiles a nivel de teatro, desde §YMisiles Tierra-Aire§! hasta §YMisiles Balísticos Intercontinentales§!. Proporcionan al estado la capacidad de desplegar estos activos estratégicos en nuestras zonas aéreas estratégicas, ya sea para ayudar en nuestra defensa aérea o para proporcionar capacidades ofensivas."
 nuclear_facility: "Instalación de I+D civil"
 nuclear_facility_plural: "Instalación de I+D civil"
 nuclear_facility_desc: "Una §YInstalación de I+D Civil§! incluye todo tipo de proyectos especiales relacionados con la capacidad industrial civil, instalaciones nucleares y más."
 air_facility: "Instalación de aerodinámica y aviónica"
 air_facility_desc: "Las Instalaciones Experimentales de Aerodinámica y Aviónica permiten iniciar proyectos de investigación para aeronaves, cohetes avanzados, electrónica relacionada y proyectos espaciales."
 naval_facility_desc: "Experimental Facilities for Naval Engineering allow you to start research projects related to Surface Ships and Submarines.\nA Naval Engineering Facility can only be created in a coastal province."
 stronghold_network: "Red Defensiva Estatal"
 stronghold_network_plural: "Red Defensiva Estatal"
 stronghold_network_desc: "Una extensa red defensiva compuesta por túneles, puntos de defensa, trincheras, refugios antiaéreos, depósitos de armas y sitios de demolición planificados previamente brindan a los defensores una ventaja decisiva contra cualquier atacante."
 renewable_energy_infra: "Infraestructura de Energía Renovable"
 renewable_energy_infra_plural: "Infraestructura de Energía Renovable"
 renewable_energy_infra_desc: "La §YInfraestructura de Energía Renovable§! es un conjunto de fuentes de energía renovable. Estas incluyen, entre otras: parques solares, aerogeneradores, refinerías de biocombustibles, plantas de carbón vegetal, centrales eléctricas de biocombustibles, entre otras. Por lo tanto, utiliza fuentes renovables y produce combustible a partir de ellas.\n\nProporciona al estado:\nNúmero base de trabajadores requeridos: §Y22.5K§!\nProducto base del PIB por §YInfraestructura de energía renovable§!: $§Y2 mil millones§!\nGanancia de potencia base: §G+0.5§! GW\n"
 renewable_energy_infra_amount: "$VALUE|Y0=$"
 renewable_energy_infra_resource: "£resources_strip|$FRAME$"
 microchip_plant: "Planta de Microchips"
 microchip_plant_plural: "Plantas de Microchips"
 microchip_plant_desc: "Planta de producción que convierte metales tecnológicos y metales preciosos en microchips, para uso industrial y militar.\n\nProporciona al estado:\nNúmero base de trabajadores requeridos: §Y37.5K§!\nProducción base del PIB por §YPlanta de Microchips§!: $§Y32 mil millones§!\nConsumo base de energía: §R-0.75§! GW\n20 §YMicrochip§! Producción\n\n§YMicrochips§! obtiene el precio de mercado unitario más alto, generando importantes ingresos en efectivo por las exportaciones excedentes.\n\nCostos:\n3 §YMetales Tecnológicos§!\n2 §YMetales Preciosos§!"
 composite_plant: "Planta Compuesta"
 composite_plant_desc: "Production plant that combines Oil, Rubber, and Precious Metals into Composites, for use in the scientific, military, and industrial sectors.\n\nProvides the state with:\nBase Number of Required Workers: §Y37.5K§!\nBase GDP Output per §YComposite Plant§!: $§Y28 Billion§!\nBase Energy Consumption: §R-0.8§! GW\n20 §YAdvanced Composite§! Production\n\n§YComposites§! sell at one of the highest per-unit market prices, generating strong cash income on surplus exports.\n\nCosts:\n1 §YOil§!\n1 §YRubber§!\n1 §YPrecious Metals§!"
 composite_plant_plural: "Planta Compuesta"
 rail_terminal: "Terminal ferroviaria"
 rail_terminal_plural: "Terminales ferroviarias"
 rail_terminal_desc: "Un Estado que cuenta con una densa red de terminales desplaza tanto a personas como a mercancías con mayor rapidez, por lo que las fábricas reciben insumos de manera más constante, los trabajadores llegan a sus puestos de forma más fiable y la economía circundante obtiene margen para expandirse."
 show_construction_speed: "When checked, you can see the current £construction_speed_texticon §YConstruction Speed Bonus§! for each §YBuilding Type§!\n\nThis modifier shows only the building specific modifier. It does not take into account the §YGlobal £construction_speed_texticon Construction Speed.§!"
 landmark_kaaba: "Kaaba"
 landmark_kaaba_plural: "$landmark_kaaba$"
 landmark_kaaba_desc: "La Kaaba, una sagrada estructura en forma de cubo situada en el corazón de la Masjid al-Haram de La Meca, se erige como el lugar más santo del islam. Cubierta de seda negra adornada con caligrafía dorada, sirve como la qibla, la dirección hacia la cual los musulmanes de todo el mundo se orientan al rezar. Este antiguo santuario, conocido como la Casa de Dios, encarna siglos de fe, peregrinación e historia islámica, simbolizando la unidad de la umma musulmana.\n\nEl §YMonumento de la Kaaba§! genera ingresos por turismo basados en la población total de los Estados árabes. La cantidad exacta se puede consultar en la §YPrevisión económica§!."
 landmark_milad: "Torre Milad"
 landmark_milad_plural: "$landmark_milad$"
 landmark_milad_desc: "La Torre Milad, o Borj-e Milad, tiene sus raíces en el período prerrevolucionario de Irán, con planes iniciales que se remontan a la década de 1970. Tras la Revolución iraní de 1979, esos primeros planes se archivaron en medio de prioridades políticas cambiantes. La visión se recuperó a finales de la década de 1990 y la construcción comenzó en el año 2000, alineándose con el nuevo enfoque de Irán hacia el desarrollo y la modernización. Su diseño combina elementos de la herencia iraní con la ingeniería contemporánea, convirtiéndola en un llamativo emblema tanto de la continuidad histórica como de la evolución de la identidad del país. Hoy en todo el complejo se erige una torre multifuncional y un destacado hito cultural que ofrece a los residentes y visitantes de Teherán vistas panorámicas de la ciudad y de las distantes montañas Alborz."
 landmark_domeofrock: "Cúpula de la Roca"
 landmark_domeofrock_plural: "$landmark_domeofrock$"
 landmark_domeofrock_desc: "La Cúpula de la Roca es un renombrado santuario islámico, famoso por su cúpula dorada que domina la Ciudad Vieja de Jerusalén. Construido en el siglo VII, se alza en el Haram al-Sharif, también conocido como el Monte del Templo, un lugar sagrado tanto para musulmanes como para judíos. El santuario alberga la Piedra Fundacional, que los musulmanes creen que marca el punto donde el profeta Mahoma ascendió al cielo y que los judíos consideran el emplazamiento del Sanctasanctórum del antiguo Templo judío."
 landmark_goldengate: "Puente Golden Gate"
 landmark_goldengate_plural: "$landmark_goldengate$"
 landmark_goldengate_desc: "Completado en 1937, el puente Golden Gate cruza el estrecho que une la bahía de San Francisco con el océano Pacífico, conectando la ciudad con las colinas de Marin Headlands. Sus características torres de color naranja internacional y su larga estructura colgante lo convirtieron en el puente más largo de su clase en el mundo en el momento de su inauguración, y sigue siendo una de las estructuras más reconocibles de los Estados Unidos."
 landmark_UScongress: "Capitolio de los EE. UU."
 landmark_UScongress_plural: "$landmark_UScongress$"
 landmark_UScongress_desc: "El Capitolio de los EE. UU. se alza en el extremo este del National Mall en Washington D. C., albergando las cámaras del Senado y de la Cámara de Representantes. Su diseño neoclásico y su cúpula central lo han convertido en la sede más reconocible del poder legislativo estadounidense, anclando un corredor que incluye la Biblioteca del Congreso, el Tribunal Supremo y el complejo de museos de la Institución Smithsonian."
 landmark_fuji: "Monte Fuji"
 landmark_fuji_plural: "$landmark_fuji$"
 landmark_fuji_desc: "El monte Fuji, que con 3.776 metros es el pico más alto de Japón, es un estratovolcán activo situado en Honshu que resulta visible desde Tokio en los días despejados. Considerado sagrado desde hace mucho tiempo por las creencias sintoístas y motivo definitorio del arte japonés, es también Patrimonio de la Humanidad de la UNESCO. Su silueta cónica casi perfecta y la región de lagos que lo rodea atraen a cientos de miles de escaladores y turistas cada año."
 landmark_giza: "Pirámides de Giza"
 landmark_giza_plural: "$landmark_giza$"
 landmark_giza_desc: "Construidas durante el Imperio Antiguo de Egipto como tumbas monumentales para los faraones, las pirámides de Giza se alzan en las afueras de El Cairo. La Gran Pirámide, erigida para el faraón Keops, es la última estructura que sobrevive de las siete maravillas del mundo antiguo. El complejo, junto con la Esfinge, sigue siendo uno de los monumentos más visitados de Egipto y una pieza central de la economía turística del país."
 landmark_shuttle: "Centro Espacial Kennedy"
 landmark_shuttle_plural: "$landmark_shuttle$"
 landmark_shuttle_desc: "El Centro Espacial Kennedy, en la costa atlántica de Florida, sirve como el principal lugar de lanzamiento para las misiones de vuelos espaciales tripulados de la NASA. Cuenta con instalaciones como el icónico Edificio de Ensamblaje de Vehículos, donde se preparan los cohetes para el lanzamiento, y el Complejo de Lanzamiento 39, el histórico punto de partida de los programas Apolo y del transbordador espacial. El centro sigue siendo un núcleo de innovación y exploración que da soporte a lanzamientos tanto gubernamentales como comerciales."
 landmark_shuttle_launch: "Centro Espacial Kennedy"
 landmark_shuttle_launch_plural: "$landmark_shuttle_launch$"
 landmark_shuttle_launch_desc: "El Centro Espacial Kennedy, en la costa atlántica de Florida, sirve como el principal lugar de lanzamiento para las misiones de vuelos espaciales tripulados de la NASA. Cuenta con instalaciones como el icónico Edificio de Ensamblaje de Vehículos, donde se preparan los cohetes para el lanzamiento, y el Complejo de Lanzamiento 39, el histórico punto de partida de los programas Apolo y del transbordador espacial. El centro sigue siendo un núcleo de innovación y exploración que da soporte a lanzamientos tanto gubernamentales como comerciales."
 landmark_buran: "Cosmódromo de Baikonur"
 landmark_buran_plural: "$landmark_buran$"
 landmark_buran_desc: "El cosmódromo de Baikonur, en las estepas del sur de Kazajistán, es el puerto espacial operativo más antiguo y grande del mundo. Establecido en 1955, ha sido el lugar de lanzamiento de misiones soviéticas y rusas que marcaron hitos históricos, incluido el primer vuelo espacial tripulado por Yuri Gagarin a bordo de la Vostok 1. Rusia sigue arrendando la instalación a Kazajistán y la utiliza para los lanzamientos tripulados de las naves Soyuz con destino a la Estación Espacial Internacional."
 landmark_ICBMsilominot: "Bases aéreas Minot"
 landmark_ICBMsilominot_plural: "$landmark_ICBMsilominot$"
 landmark_ICBMsilominot_desc: "El complejo de misiles de la Base de la Fuerza Aérea de Minot consiste en una extensa red de silos subterráneos que albergan misiles balísticos intercontinentales, dispersos por las llanuras de Dakota del Norte. Los silos están blindados contra ataques nucleares y fuertemente vigilados, manteniéndose en alerta continua para formar la rama terrestre de la tríada nuclear de los Estados Unidos."
 landmark_ICBMsiloyasny: "Base de misiles de Yasny"
 landmark_ICBMsiloyasny_plural: "$landmark_ICBMsiloyasny$"
 landmark_ICBMsiloyasny_desc: "La base de misiles de Yasny, cerca de Dombarovsky en la región rusa de Oremburgo, es uno de los principales campos de silos de las Fuerzas de Cohetes Estratégicos. Construida durante la Guerra Fría, alberga misiles balísticos intercontinentales pesados en silos subterráneos blindados y constituye un componente crítico de la disuasión nuclear de Rusia."
 landmark_zenobia_wall: "Línea de defensa Zenobia"
 landmark_zenobia_wall_plural: "$landmark_zenobia_wall$"
 landmark_zenobia_wall_desc: "Una línea fuertemente fortificada que se extiende por el sur de Egipto y el desierto occidental. Muros de hormigón, complejos de búnkeres y artillería previamente emplazada asientan la Línea Zenobia, erigida para detener el avance de la Quimera desde las zonas de brecha del África subsahariana."
 landmark_hagia_sophia_plural: "$landmark_hagia_sophia$"
 landmark_hagia_sophia_desc: "Construida originalmente como catedral bizantina en el año 537, Santa Sofía se convirtió en la principal mezquita otomana de Estambul tras la conquista de la ciudad en 1453. Funcionó como museo secular durante gran parte de la historia de la República de Turquía. Su enorme cúpula central y sus mosaicos bizantinos figuran entre las obras de arquitectura religiosa más influyentes jamás construidas, atrayendo cada año a millones de visitantes a Estambul."
 landmark_forbidden_city_desc: "El complejo palaciego amurallado situado en el corazón de Pekín funcionó como residencia imperial de las dinastías Ming y Qing durante casi cinco siglos. Hoy alberga el Museo del Palacio, que custodia una de las colecciones de arte y objetos chinos más importantes del mundo. La Ciudad Prohibida es el lugar cultural más visitado del país y forma parte del Patrimonio de la Humanidad de la UNESCO, erigiéndose como el principal símbolo de la civilización china."
 landmark_tokyo_imperial_palace_desc: "La residencia principal del emperador de Japón desde la Restauración Meiji, situada en el emplazamiento del antiguo Castillo de Edo, en pleno corazón de Tokio. El palacio y sus terrenos representan la continuidad de la monarquía hereditaria más antigua del mundo. El acceso al público está restringido, pero los Jardines Orientales y las principales ceremonias imperiales atraen cada año a un volumen sustancial de turistas."
 landmark_taj_mahal_plural: "$landmark_taj_mahal$"
 landmark_taj_mahal_desc: "Encargado en 1632 por el emperador mogol Shah Jahan como mausoleo para su esposa Mumtaz Mahal, el Taj Mahal es el ejemplo mejor conservado de la arquitectura mogol. Su fachada de mármol blanco, sus intrincados trabajos de incrustación y sus jardines simétricos lo han convertido en Patrimonio de la Humanidad de la UNESCO y en uno de los monumentos más visitados de la Tierra, atrayendo cada año a millones de visitantes a Agra."
 landmark_prague_castle: "Castillo de Praga"
 landmark_prague_castle_desc: "El complejo palaciego antiguo más grande del mundo por superficie, el Castillo de Praga ha funcionado como sede de los reyes de Bohemia, de los emperadores del Sacro Imperio Romano Germánico y, en la actualidad, del presidente de la República Checa. Entre sus muros se alzan la Catedral de San Vito y siglos de arte de toda Europa Central, lo que convierte al castillo en el lugar cultural más visitado del país."
 landmark_bojnice_castle: "Castillo de Bojnice"
 landmark_bojnice_castle_desc: "Una romántica restauración neogótica de una fortaleza eslovaca medieval, el Castillo de Bojnice fue reconstruido a finales del siglo XIX bajo el mandato del conde János Pálffy al estilo de los castillos franceses del Loira. Hoy es uno de los lugares culturales más visitados de Eslovaquia; su silueta torreada y el parque que lo rodea constituyen una pieza central del turismo de patrimonio eslovaco."
 landmark_sadabad_complex: "Complejo de Sadabad"
 landmark_sadabad_complex_plural: "$landmark_sadabad_complex$"
 landmark_sadabad_complex_desc: "Un extenso complejo palaciego en las faldas montañosas al norte de Teherán, construido originalmente bajo la dinastía Kayar y ampliado drásticamente por los sahs Pahlaví. Tras la revolución de 1979, el complejo fue nacionalizado y hoy funciona como una red de museos estatales que albergan colecciones reales, arte iraní e historia natural."
 landmark_hofburg_palace_desc: "El Hofburg, en pleno corazón de Viena, funcionó durante siglos como el principal palacio imperial de la dinastía de los Habsburgo. Hoy en día, sus salas albergan las oficinas del presidente federal de Austria, la Escuela Española de Equitación, el Tesoro Imperial y varios museos de gran importancia. Sigue siendo uno de los monumentos definitorios de Viena y una pieza central del turismo cultural austriaco."
 landmark_berlin_reichstag_desc: "El edificio del Reichstag, en la Platz der Republik, se sitúa en el centro político de Berlín desde hace más de un siglo. Fuertemente dañado en 1933 y de nuevo durante la Segunda Guerra Mundial, fue restaurado tras la reunificación bajo el rediseño de Norman Foster y reabrió sus puertas en 1999 como sede del Bundestag, el parlamento federal alemán. Su cúpula de cristal se ha convertido en un símbolo definitorio de la democracia alemana moderna y en una de las principales atracciones del centro de Berlín."
 enrichment_facility: "Instalación de enriquecimiento nuclear"
 enrichment_facility_plural: "Instalaciones de enriquecimiento nuclear"
 enrichment_facility_desc: "Las instalaciones de enriquecimiento reciben uranio y lo enriquecen para su uso en reactores nucleares y, en cierta medida, en armamento nuclear."