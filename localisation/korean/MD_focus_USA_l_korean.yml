 USA_fsa_the_damascus_legion: "다마스쿠스 군단"
 USA_the_american_expedition: "미국 원정군"
 USA_logistics_nightmare: "병참의 악몽"
 USA_indiscriminate_bombings2: "무차별 폭격"
