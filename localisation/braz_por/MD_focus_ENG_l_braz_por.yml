 ENG_create_new_faction_TT: "Criará uma nova facção: Organização de Segurança do Atlântico\n\nPoderemos derrubar governos estrangeiros usando [ADS.GetFlag] Albionis!\n - Temos 3 usos para esta habilidade, disponível no menu de influência pelo botão de golpe. Uma opção adicional aparecerá permitindo usar [ADS.GetFlag] Albionis para derrubar o referido governo na Europa, concedendo-lhe um vassalo e aliado."
 ENG_collapse_of_society_TT: "£text_icon_kaldanger Escolher esta opção pode resultar na derrubada do governo!\n - Isso nos permitirá realizar os focos de §HReino Fraturado, Estado Unido§!\n - As forças armadas intervirão após certo ponto e assumirão o comando do estado"
 ENG_do_fp_TT: "Concluiu pelo menos §H3§! focos de £GFX_text_icon_uk_flag Política Externa"
 ENG_core_desc_TT: "Ao alcançar a hegemonia Econômica, Militar e Política, poderemos mostrar aos três principais estados da Commonwealth que podemos sustentá-los e protegê-los. Além disso, seus constituintes estarão mais inclinados a se juntar a nós se nossas condições forem melhores."
 ENG_econ_hegemony_TT: "'Dinheiro resolve tudo'\n\nAo alcançar a hegemonia econômica, estaremos em boa posição para integrar outras economias, como as dos estados da Commonwealth. Para isso, precisamos de:\n\nUm PIB maior que o dos 3 combinados\n- O nosso é atualmente $[?gdp_total|1]b\n- O deles é atualmente $[?commonwealth_total_gdp|1]b"
 ENG_military_hegemony_TT: "'Um exército forte equivale a um governo forte'\n\nAo alcançar a hegemonia militar, estaremos em boa posição para mostrar que somos capazes de defender nossos territórios e nosso povo. Para isso, precisamos de:\n\nMais mão de obra mobilizada que os 3 combinados\n- Atualmente temos [?ENG.deployed_army_manpower_k] (mil) soldados mobilizados\n- Eles têm atualmente [?commonwealth_total_army] (mil) soldados mobilizados"
 ENG_political_hegemony_TT: "'Mexer os pauzinhos é tudo o que é preciso'\n\nAo alcançar a hegemonia política, demonstraremos que o governo de Westminster é estável, conectado e em sintonia com todas as pessoas de todos os estratos da sociedade. Para isso, precisamos de:\n\nUma forte esfera de influência\n- Pelo menos 50% de influência ou mais nos 3 países"
 ENG_tooltip_TT: "Cumpriu todos os requisitos para a Hegemonia Econômica"
 ENG_tooltip2_TT: "Cumpriu todos os requisitos para a Hegemonia Militar"
 ENG_has_met_all_requirements_TT: "É hegemon nas três categorias"
 ENG_hold_for_280_TT: "Devemos manter nossa capital por 280 dias!"
 ENG_seize_sierra_leone_TT: "Se [SIE.GetFlag] §HSerra Leoa§! permanecer Pró-Ocidente e em paz:\n - Poderemos tomar temporariamente seus recursos em §HFreetown§! por meio de uma decisão"
