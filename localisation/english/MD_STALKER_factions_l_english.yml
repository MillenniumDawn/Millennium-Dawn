l_english:
 STALKER_faction_military: "the Military"
 STALKER.120.t: "War for the Zone"
 STALKER.120.d: "Fighting has broken out in [event_target:STALKER_zone_event_target.GetName] between [STALKER_zone_war_side_a] and [STALKER_zone_war_side_b]. Neither side can win quickly, and every month of fighting kills stalkers and wrecks perimeter posts."
 STALKER.120.a: "Back [STALKER_zone_war_side_a]."
 STALKER.120.a_tt: "Costs §R25§! political power. [STALKER_zone_war_side_a] gains §G10§! influence in the Zone. While the war lasts, the Zone loses §R3§! stalkers and §R3§! §Ycontainment§! each month."
 STALKER.120.b: "Back [STALKER_zone_war_side_b]."
 STALKER.120.b_tt: "Costs §R25§! political power. [STALKER_zone_war_side_b] gains §G10§! influence in the Zone. While the war lasts, the Zone loses §R3§! stalkers and §R3§! §Ycontainment§! each month."
 STALKER.120.c: "Let them fight it out."
 STALKER.120.c_tt: "While the war lasts, the Zone loses §R3§! stalkers and §R3§! §Ycontainment§! each month. The stronger side at the end wins §G15§! influence and the loser loses §R25§!."
 STALKER.121.t: "The War for the Zone Ends"
 STALKER.121.d_duty: "Duty has driven Freedom out of its strongholds in [event_target:STALKER_zone_event_target.GetName]. Its checkpoints now control the routes to the center."
 STALKER.121.d_freedom: "Freedom has broken Duty's hold on [event_target:STALKER_zone_event_target.GetName]. The routes to the center are open again, for anyone willing to take them."
 STALKER.121.d_military: "Army and security units have cleared the bandit gangs out of [event_target:STALKER_zone_event_target.GetName]. The survivors have scattered or gone north."
 STALKER.121.d_bandits: "The bandit gangs have fought the security forces to a standstill in [event_target:STALKER_zone_event_target.GetName], and now run the roads the soldiers abandoned."
 STALKER.121.a: "The Zone has a new order."
 STALKER_faction_ward: "the Ward"
 STALKER_faction_spark: "the Spark"
 STALKER.121.d_ward: "The Ward has broken the Spark's hold on the approaches to the power plant in [event_target:STALKER_zone_event_target.GetName]. Its patrols now decide who reaches the center, and why."
 STALKER.121.d_spark: "The Spark has driven the Ward back from the heart of [event_target:STALKER_zone_event_target.GetName]. Its followers say the Zone is finally being allowed to grow."
