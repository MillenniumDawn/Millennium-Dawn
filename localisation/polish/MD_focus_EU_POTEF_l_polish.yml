 tooltip_focus_POTEF206_trigger: "Skup się §YMeksyk§! została ukończona"
 EU_annexed_SOV_minion: "Federacja Europejska zaanektowała rosyjskiego Miniona"
 CSCE_peace_talks: "Rozmowy pokojowe KBWE"
 commonwealth_legacy: "Dziedzictwo Wspólnoty Narodów"
 contest_silk_road: "Konkurs Jedwabny Szlak"
 latin_cousins: "Kuzyni łacińscy"
 historical_friends_HKG: "Brytyjski obywatel zagraniczny"
 breach_of_Sino_British_Joint_Declaration: "Naruszenie wspólnej deklaracji chińsko-brytyjskiej"
 EU_POTEF_call_election: "Zadzwoń do wyborów POTEF"
 EU_POTEF_call_election_desc: "Wraz z utworzeniem Federacji Europejskiej urząd Prezydenta Federacji Europejskiej (POTEF) wyewoluował z rotacyjnej Prezydencji Rady Unii Europejskiej. Aby dać POTEF większą legitymację demokratyczną niż rotacyjna prezydencja, w traktatach określono, że POTEF musi być wybierany przez obywateli, a jego kadencja zależy od uzyskanej większości.\n\nNie ma pełniącego obowiązki Prezydenta Federacji Europejskiej (POTEF), dlatego musimy rozpisać wybory, aby zlikwidować wakat."
 EU_POTEF_nominee: "Zadeklaruj [ROOT.GetLeader] jako kandydata w wyborach POTEF"
 EU_POTEF_nominee_desc: "Declare [ROOT.GetLeader] as nominee for President of the European Federation (POTEF) elections."
 EU_POTEF_election_campaign: "Kampania wyborcza POTEF"
 EU_POTEF_election_campaign_desc: "The race for the Presidency of the European Federation has started. The nominees are campaigning in the member states to get elected as the next President of the European Federation (POTEF)."
 EU_POTEF_term: "Czas na kolejną kampanię wyborczą POTEF"
 EU_POTEF_term_desc: "Czas na kolejną kampanię wyborczą na Prezydenta Federacji Europejskiej (POTEF)."
 EU_POTEF_show_election_polls: "Pokaż sondaże wyborcze POTEF"
 EU_POTEF_show_election_polls_desc: "Pokaż sondaże dotyczące najbliższych wyborów Prezydenta Federacji Europejskiej (POTEF)."
 EU_POTEF_hide_election_polls: "Ukryj sondaże wyborcze POTEF"
 EU_POTEF_hide_election_polls_desc: "Ukryj ankiety dotyczące najbliższych wyborów Prezydenta Federacji Europejskiej (POTEF)."
 EU_POTEF_campaign_in_member_state: "Kampania wyborcza POTEF w [FROM.GetName]"
 EU_POTEF_campaign_in_member_state_desc: "[ROOT.GetLeader] rozpocznie kampanię wyborczą POTEF w [FROM.GetNameWithFlag]."
 EU_POTEF_news.1.t: "[FROM.GetLeader] jest kandydatem w wyborach POTEF"
 EU_POTEF_news.1.d: "[FROM.GetLeader] Lider [FROM.GetNameWithFlag] został uznany za kandydata w wyborach na Prezydenta Federacji Europejskiej (POTEF)."
 EU_POTEF_news.1.a: "Dobra"
 EU_POTEF_news.2.t: "Wynik wyborów [GetYear] POTEF"
 EU_POTEF_news.2.d: "Lider [FROM.GetNameWithFlag] [FROM.GetLeader] wygrał wybory na Prezydenta Federacji Europejskiej (POTEF). Jako POTEF [FROM.GetLeader] będzie przewodzić Federacji Europejskiej przez następne [?FROM.POTEF_years|0] lat."
 EU_POTEF_news.2.a: "Dobra"
 EU_POTEF_news.5.t: "Kampania [FROM.GetLeader] w [FROM.FROM.GetName] zakończyła się sukcesem"
 EU_POTEF_news.5.d: "[FROM.GetLeader] campaigned successfully in [FROM.FROM.GetNameWithFlag] for President of the European Federation (POTEF) elections."
