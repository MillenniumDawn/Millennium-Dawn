 ROM_ukrainian_ultimatum: "Ultimatum à Kyiv"
 ROM_ukrainian_ultimatum_desc: "Tchernivtsi et le Boudjak appartiennent à la Roumanie. Tant que Kyiv est trop faible pour nous refuser, il faut presser notre revendication avant qu'un autre ne le fasse."
 ROM_ukrainian_border_lands_category: "Bucovine du Nord et Boudjak"
 ROM_annex_bukovina_budjak: "Répondre à l'appel de nos frères"
 ROM_annex_bukovina_budjak_desc: "L'autorité ukrainienne sur Tchernivtsi et le Boudjak s'est effondrée. Les conseils locaux roumains demandent à Bucarest de reconnaître une union, et plus personne à Kyiv n'est là pour dire non."
 ROM_333_return: "Roumanisation du Boudjak"
 ROM_333_return_desc: "Le Boudjak n'est plus terre roumaine depuis des décennies. La population locale s'étant réconciliée avec Bucarest, nous pouvons achever l'ouvrage."
 ROM_335_return: "Roumanisation de la Bucovine du Nord"
 ROM_335_return_desc: "La Bucovine du Nord nous a été arrachée par l'ultimatum soviétique de 1940. La conformité de la province étant assurée, nous pouvons rendre la réunion définitive."
 ROM_ukrainian_autonomies: "Administration des Karpates"
 ROM_ukrainian_autonomies_desc: "Gouverner les districts frontaliers ukrainiens reconquis par des conseils locaux achète la bienveillance et accélère l'intégration, au prix d'une main moins ferme sur les cordons de la bourse et de la patience du public."
 romania_misc.20.t: "Les conseils de Tchernivtsi et du Boudjak"
 romania_misc.20.d: "Kyiv ne pouvant plus projeter son autorité si loin de la capitale, les assemblées locales de Tchernivtsi et du Boudjak ont voté l'union avec la Roumanie. Bucarest n'est que trop heureuse d'y consentir."
 romania_misc.20.a: "Accueillez-les à la maison"
 romania_misc.21.t: "Gouverner les nouveaux territoires"
 romania_misc.21.d: "Tchernivtsi et le Boudjak sont roumains sur la carte. En faire une administration qui fonctionne est une autre affaire, et le gouvernement doit décider de la fermeté de sa main."
 romania_misc.21.a: "Règle par l'intermédiaire des conseils locaux"
 romania_misc.21.b: "Règne direct depuis Bucarest"
