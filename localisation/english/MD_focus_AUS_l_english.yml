 AUS_economy.1.t: "Transit Expansion"
 AUS_economy.1.d: "Austria's transit network is in dire need of expansion to facilitate trade and military logistics across the nation. We must decide whether to prioritize strengthening the western corridor connecting Tirol to the Vienna Region or investing in the southern axis between Steiermark and the capital."
 AUS_economy.1.a: "Expand the Northern Region"
 AUS_economy.1.b: "Expand the Southern Region"
 AUS_economy.1.a_desc: "We will strengthen the connection between the Tirol and the Vienna Region."
 AUS_economy.1.b_desc: "We will strengthen the connection between Steiermark and the Vienna Region."
 AUS_economy.2.t: "Austria Proposes Joint Venture"
 AUS_economy.2.d: "The Austrian government is proposing a joint venture with ASML to benefit from its expertise in semiconductor manufacturing equipment and strengthen cooperation between our industries. In the future, both countries could benefit from increased production, technological development, and new opportunities in the semiconductor sector, while allowing us to gain access to advanced machinery and equipment for semiconductor production."
 AUS_economy.2.a_desc: "Accept the offer, allowing Austria to benefit from our expertise in semiconductor technology while creating new opportunities of investment and economic return for our industry.  "
 AUS_economy.2.b_desc: "Reject the offer, as theres little benefit in pursuing the proposed joint venture at this moment."
 AUS_economy_3.t: "Austria Proposes Joint Venture"
 AUS_economy.3.d: "The Austrian government is proposing a joint venture with TSMC to benefit from its semiconductor production expertise and strengthen cooperation between our industries. In the future, both countries could benefit from increased production, technological development, and new opportunities in the semiconductor sector, while allowing us to gain valuable expertise in advanced semiconductor manufacturing."
 AUS_economy.3.a_desc: "Accept the offer, allowing Austria to benefit from our expertise in semiconductor production while creating new opportunities of investment and economic return for our industry.  "
 AUS_economy.3.b_desc: "Reject the offer, as theres little benefit in pursuing the proposed joint venture at this moment."
 AUS_economy.4.t: "Austria Proposes Joint Venture"
 AUS_economy.4.d: "The Austrian government is proposing a joint venture through Infineon to expand its industrial semiconductor capabilities and strengthen cooperation between our industries. In the future, both countries could benefit from increased production, technological development, and new opportunities in the semiconductor sector, while also creating a modest financial return for our nation."
 AUS_economy.4.a_desc: "Accept the offer, allowing Austria to benefit from our expertise in semiconductor production while creating new opportunities of investment and economic return for our industry.  "
 AUS_economy.4.b_desc: "Reject the offer, as theres little benefit in pursuing the proposed joint venture at this moment."
 AUS_economy.5.t: "Austria Proposes Resource Investment"
 AUS_economy.5.d: "The Austrian government is offering to invest in our resource sector, providing capital to expand production and improve the development of our natural resources. In return, we would have to give Austria a degree of control over our resources, creating new opportunities for economic growth while deepening our cooperation."
 AUS_economy.5.a_desc: "Accept the Austrian investment, allowing our resource sector to benefit from additional capital and development while granting Austria a degree of control over our resources."
 AUS_economy.5.b_desc: "Reject the Austrian investment, choosing to retain full control over our resources and develop the sector through our own means."
 AUS_economy_answer.7.t: "Austria offers to join the Austrian Industrial Research Alliance"
 AUS_economy_answer.7.d: "Delegates from Vienna have approached our administration with a proposal to integrate into the Austrian Industrial Research Alliance. This partnership aims to streamline knowledge transfer between academia and industrial institutions across borders."
 AUS_economy.7.a: "Sure"
 AUS_economy.7.b: "Nope"
 #AUS_news.1.t: "A Rising Star in the Financial World"
 #AUS_news.1.d: "Having dropped out of school to renovate attics in Innsbruck, the young Tyrolean entrepreneur René Benko has pulled off a remarkable rise. After founding his company at just 22 years old, he has now rebranded it as the Signa Holding and #secured massive backing from high-profile international investors. With millions in fresh capital flowing in, the ambitious investor is rapidly expanding his footprint across central European real estate."
 #AUS_news.1.a: "Time will tell what lies ahead."
 #AUS_economy.6.t: "Water Investments"
 #AUS_economy.6.d: "Our country holds vast potential for hydroelectric energy, but we must decide where our investments should be directed: toward energy generation or energy storage. Choosing to invest in storage could support our broader renewable energy ambitions by providing greater flexibility and helping us make better use of future energy production."
 #AUS_economy.6.b_desc: "Choosing this option will allow us to pursue the hydroelectric energy path and provide benefits to the development and generation of hydroelectric power."
 #AUS_economy.6.a_desc: "Choosing this option will allow us to pursue the hydroelectric storage path and provide benefits to the development of energy storage infrastructure."
 #AUS_economy.6.b: "More Storage will be more beneficial"
 #AUS_economy.6.a: "We need more Electricity"
 #hydro_option_one_tt: "Has decided to invest in hydroelectric storage"
 #hydro_option_two_tt: "Has decided to invest in hydroelectric power"
