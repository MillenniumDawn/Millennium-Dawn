l_braz_por:
 AUTOMATION_SETTINGS_OPEN_TT: "Abrir Configurações de Automação"
 AUTOMATION_SETTINGS_TITLE: "Configurações de Automação"
 AUTOMATION_SETTINGS_DESC: "Gerencie ações recorrentes e preferências de notificação em um único painel. Os controles existentes em outros lugares continuam disponíveis."
 AUTOMATION_SETTINGS_GENERAL_PAGE: "Geral"
 AUTOMATION_SETTINGS_SPACE_PAGE: "Satélites"
 AUTOMATION_SETTINGS_INFLUENCE_PAGE: "Influência"
 AUTOMATION_SETTINGS_SPACE_DESC: "Configure a produção automática de satélites, os lançamentos e as melhorias de constelação."
 AUTOMATION_SETTINGS_INFLUENCE_DESC: "Configure ações recorrentes que defendem nosso governo contra influência estrangeira."
 AUTOMATION_SETTINGS_SPACE_SAVE_BUTTON_TT: "Armazene o manifesto de carga preparado no Programa Espacial como o plano §YPersonalizado§! e mude para ele.\n\n§YPré-requisitos:§!\n[!automation_space_save_button_click_enabled]"
 AUTOMATION_SETTINGS_SPACE_UPGRADE_BUTTON_TT: "Promova cada constelação para a geração mais recente pesquisada sempre que a cobertura orbital atual permitir.\n\n§YPré-requisitos:§!\n[!automation_space_upgrade_button_click_enabled]"
 AUTOMATION_SETTINGS_NOTIFICATIONS_HEADER: "Notificações e Preferências"
 AUTOMATION_SETTINGS_ECONOMY_HEADER: "Economia"
 AUTOMATION_SETTINGS_UN_HEADER: "Nações Unidas"
 AUTOMATION_SETTINGS_DIPLOMACY_HEADER: "Diplomacia"
 AUTOMATION_SETTINGS_NATO_HEADER: "OTAN"
 AUTOMATION_SETTINGS_ENERGY_HEADER: "Energia"
 AUTOMATION_SETTINGS_PP_RESERVE: "Reserva de Poder Político"
 AUTOMATION_SETTINGS_PP_RESERVE_VALUE: "£pol_power [?automation_pp_reserve|0]"
 AUTOMATION_SETTINGS_PP_RESERVE_TT: "Ações automatizadas que gastam Poder Político aguardarão até poderem pagar seu custo sem reduzir o Poder Político abaixo desta reserva. Ações manuais não são afetadas.\n\n£click_left §YClique L§!: Ajusta em §Y1§!\n£key_ctrl + £click_left §YCtrl Clique L§!: Ajusta em §Y10§!\n£key_shift + £click_left §YShift Clique L§!: Ajusta em §Y100§!"
 AUTOMATION_SETTINGS_PP_RESERVE_PLUS_TT: "£click_left §YClique L§!: Aumenta em §Y1§!\n£key_ctrl + £click_left §YCtrl Clique L§!: Aumenta em §Y10§!\n£key_shift + £click_left §YShift Clique L§!: Aumenta em §Y100§!"
 AUTOMATION_SETTINGS_PP_RESERVE_MINUS_TT: "£click_left §YClique L§!: Diminui em §Y1§!\n£key_ctrl + £click_left §YCtrl Clique L§!: Diminui em §Y10§!\n£key_shift + £click_left §YShift Clique L§!: Diminui em §Y100§!"
 AUTOMATION_SETTINGS_CORRUPTION: "Recusar Automaticamente Ofertas de Corrupção"
 AUTOMATION_SETTINGS_CORRUPTION_TT: "Ignora automaticamente ofertas de corrupção. Os eventos e suas possíveis recompensas não aparecerão enquanto isto estiver ativado."
 AUTOMATION_SETTINGS_FOREIGN_ELECTION: "Notificações de Eleições Estrangeiras"
 AUTOMATION_SETTINGS_FOREIGN_ELECTION_TT: "Mostra notificações de notícias sobre eleições em outros países."
 AUTOMATION_SETTINGS_RAID_NOTIFICATIONS: "Notificações de Incursões de Influência"
 AUTOMATION_SETTINGS_RAID_NOTIFICATIONS_TT: "Mostra eventos sobre incursões de influência entre outros países. Incursões contra nós ainda serão reportadas se isto estiver desativado."
 AUTOMATION_SETTINGS_INFLUENCE_REPORT: "Relatório Mensal de Auto-Influência"
 AUTOMATION_SETTINGS_INFLUENCE_REPORT_TT: "Mostra o relatório mensal listando os países afetados pela influência automática."
 AUTOMATION_SETTINGS_INVESTMENT_ACCEPTANCE: "Aceitar Automaticamente Ofertas de Investimento"
 AUTOMATION_SETTINGS_INVESTMENT_ACCEPTANCE_TT: "Aceita automaticamente toda oferta de investimento internacional recebida. Ativar isto desativa a recusa automática."
 AUTOMATION_SETTINGS_INVESTMENT_REJECTION: "Recusar Automaticamente Ofertas de Investimento"
 AUTOMATION_SETTINGS_INVESTMENT_REJECTION_TT: "Recusa automaticamente toda oferta de investimento internacional recebida. Ativar isto desativa a aceitação automática."
 AUTOMATION_SETTINGS_REINVESTMENT: "Reinvestimento de Investimento Internacional"
 AUTOMATION_SETTINGS_REINVESTMENT_TT: "Escolha como os retornos semanais de investimentos internacionais são divididos entre o tesouro e o reinvestimento."
 AUTOMATION_SETTINGS_REINVEST_OFF: "Desativado"
 AUTOMATION_SETTINGS_REINVEST_OFF_TT: "Envia todos os retornos de investimento internacional ao tesouro."
 AUTOMATION_SETTINGS_REINVEST_FULL: "Total"
 AUTOMATION_SETTINGS_REINVEST_FULL_TT: "Reinveste todos os retornos de investimento internacional."
 AUTOMATION_SETTINGS_REINVEST_SPLIT: "Dividido"
 AUTOMATION_SETTINGS_REINVEST_SPLIT_TT: "Envia metade dos retornos de investimento internacional ao tesouro e reinveste a outra metade."
 AUTOMATION_SETTINGS_FUEL_PURCHASE: "Compra Automática de Combustível"
 AUTOMATION_SETTINGS_FUEL_PURCHASE_TT: "Compra combustível imediatamente, depois verifica a cada 28 dias e compra novamente sempre que as reservas de combustível caírem abaixo de 20 por cento. Desative isto para cancelar compras futuras."
 AUTOMATION_SETTINGS_INTERNAL_INVESTMENTS: "Repetir Investimentos Internos Selecionados"
 AUTOMATION_SETTINGS_INTERNAL_INVESTMENTS_TT: "Paga £pol_power §R0,15§! de Poder Político diariamente enquanto ativado. Clique com o botão direito nos botões de investimento interno na visualização do estado para selecionar o estado e os tipos de investimento a repetir. Os investimentos selecionados são verificados semanalmente e executados enquanto houver um espaço livre, o tesouro puder pagar o custo atual e a Reserva de Poder Político puder ser mantida."
 AUTOMATION_SETTINGS_ANTARCTICA_RESUPPLY: "Reabastecer Automaticamente a Estação Antártica"
 AUTOMATION_SETTINGS_ANTARCTICA_RESUPPLY_TT: "Encomenda automaticamente combustível para nossa estação antártica quando restarem 15 dias ou menos, de novembro a março, ou 30 dias ou menos, de abril a outubro. As entregas custam §R$0,25 bi por 1000 de combustível§!, dobrando durante o inverno antártico. Os pedidos aguardam até o tesouro poder pagar o custo total."
 AUTOMATION_SETTINGS_ENERGY_CONSUMPTION_POLICY: "Política de Consumo Automática"
 AUTOMATION_SETTINGS_SC_VOTE: "Voto Padrão no Conselho de Segurança"
 AUTOMATION_SETTINGS_SC_VOTE_TT: "Selecione como votamos automaticamente nas resoluções do Conselho de Segurança. Clique novamente na opção selecionada para voltar ao voto manual."
 AUTOMATION_SETTINGS_GA_VOTE: "Voto Padrão na Assembleia Geral"
 AUTOMATION_SETTINGS_GA_VOTE_TT: "Selecione como votamos automaticamente nas resoluções da Assembleia Geral. Clique novamente na opção selecionada para voltar ao voto manual."
 AUTOMATION_SETTINGS_VOTE_YES: "Sim"
 AUTOMATION_SETTINGS_VOTE_NO: "Não"
 AUTOMATION_SETTINGS_VOTE_ABSTAIN: "Abster-se"
 AUTOMATION_SETTINGS_SC_ACCEPT_TT: "Vota Sim automaticamente em todas as resoluções do Conselho de Segurança."
 AUTOMATION_SETTINGS_SC_REJECT_TT: "Vota Não automaticamente em todas as resoluções do Conselho de Segurança. Membros permanentes usarão veto quando aplicável."
 AUTOMATION_SETTINGS_SC_ABSTAIN_TT: "Abstém-se automaticamente de todas as resoluções do Conselho de Segurança."
 AUTOMATION_SETTINGS_GA_ACCEPT_TT: "Vota Sim automaticamente em todas as resoluções da Assembleia Geral."
 AUTOMATION_SETTINGS_GA_REJECT_TT: "Vota Não automaticamente em todas as resoluções da Assembleia Geral."
 AUTOMATION_SETTINGS_GA_ABSTAIN_TT: "Abstém-se automaticamente de todas as resoluções da Assembleia Geral."
 AUTOMATION_SETTINGS_SATELLITE_REJECTION: "Bloquear Ofertas de Acesso a Satélites da IA"
 AUTOMATION_SETTINGS_SATELLITE_REJECTION_TT: "Impede que países controlados pela IA ofereçam acesso compartilhado aos seus sistemas de satélites militares e civis. Jogadores humanos ainda podem enviar ofertas."
 AUTOMATION_SETTINGS_NATO_RATIFICATION: "Ratificar Automaticamente Adesões à OTAN"
 AUTOMATION_SETTINGS_NATO_RATIFICATION_TT: "Gasta automaticamente £pol_power §Y20§! para ratificar cada candidato à adesão à OTAN. A ratificação aguarda até a Reserva de Poder Político poder ser mantida."
 AUTOMATION_SETTINGS_INFLUENCE_HEADER: "Defesa contra Influência"
 AUTOMATION_SETTINGS_COMBAT_FOREIGN_INFLUENCE: "Combater Automaticamente Influência Estrangeira"
 AUTOMATION_SETTINGS_COMBAT_FOREIGN_INFLUENCE_TT: "Paga £pol_power §R0,05§! de Poder Político diariamente enquanto ativado. Quando disponível, gasta automaticamente £pol_power §Y100§! para aumentar a Independência Doméstica em §G2,5%§!. Repete após 100 dias. A automação pausa enquanto o governo estiver sofrendo lobby ou quando qualquer custo reduzir o Poder Político abaixo da reserva."
 AUTOMATION_SETTINGS_ATTACK_FOREIGN_INFLUENCERS: "Atacar Automaticamente Influenciadores Estrangeiros"
 AUTOMATION_SETTINGS_ATTACK_FOREIGN_INFLUENCERS_TT: "Paga £pol_power §R0,05§! de Poder Político diariamente enquanto ativado. Gasta automaticamente £pol_power §Y125§! para iniciar uma campanha de 60 dias contra o influenciador estrangeiro elegível mais forte. Apenas uma campanha ocorre por vez. Alvos inelegíveis, sob lobby e em recarga são ignorados. A automação pausa quando qualquer custo reduzir o Poder Político abaixo da reserva."
 AUTOMATION_SETTINGS_INFLUENCE_COST_NOTE: "Cada opção ativada custa £pol_power §R0,05§! diariamente. Ambas as opções juntas custam £pol_power §R0,10§! diariamente."
 AUTOMATION_SETTINGS_ECONOMY_PAGE: "Economia"
 AUTOMATION_SETTINGS_ECONOMY_DESC: "Escolha quais impostos e gastos públicos gerenciar automaticamente. As mudanças são revisadas semanalmente e respeitam a reserva de Poder Político."
 AUTOMATION_SETTINGS_TAX_HEADER: "Alíquotas de Impostos"
 AUTOMATION_SETTINGS_BUDGET_HEADER: "Leis Orçamentárias"
 AUTOMATION_SETTINGS_TAX_SUMMARY: "Impostos ativados mudam no máximo um ponto percentual por semana em resposta ao saldo orçamentário, à dívida e à Estabilidade.\n\nAlterações manuais mantêm a automação ativada."
 AUTOMATION_SETTINGS_BUDGET_SUMMARY: "Orçamentos ativados avançam um nível em direção ao gasto esperado. No máximo um orçamento muda a cada semana, com prioridade rotativa. Aumentos exigem superávit orçamentário. Alterações manuais de leis mantêm a automação ativada."
 AUTOMATION_SETTINGS_POPULATION_TAX: "Imposto Populacional: [?population_tax_rate|0]%"
 AUTOMATION_SETTINGS_CORPORATE_TAX: "Imposto Corporativo: [?corporate_tax_rate|0]%"
 AUTOMATION_SETTINGS_POPULATION_TAX_TT: "Ajusta automaticamente o Imposto Populacional em um ponto percentual por semana usando o saldo orçamentário, a dívida e a Estabilidade. Respeita as restrições de mudança de impostos e paga o custo normal de Poder Político acima da reserva. Alterações manuais de impostos mantêm esta opção ativada."
 AUTOMATION_SETTINGS_CORPORATE_TAX_TT: "Ajusta automaticamente o Imposto Corporativo em um ponto percentual por semana usando o saldo orçamentário, a dívida e as fábricas civis disponíveis. Respeita as restrições de mudança de impostos e paga o custo normal de Poder Político acima da reserva. Alterações manuais de impostos mantêm esta opção ativada."
 AUTOMATION_SETTINGS_BUDGET_BUREAUCRACY: "Administração: [?bureau_law|0] / [?expected_adm_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_BUREAUCRACY_TT: "Move automaticamente a Administração em direção ao seu nível de gasto esperado, um nível por vez. Os números mostram os níveis atual e esperado. Restrições normais de leis e custos de Poder Político se aplicam. Aumentos exigem superávit e pausam durante falência iminente. A reserva de Poder Político é preservada. Alterações manuais de leis mantêm esta opção ativada."
 AUTOMATION_SETTINGS_BUDGET_CRIME_FIGHTING: "Policiamento: [?police_law|0] / [?expected_police_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_CRIME_FIGHTING_TT: "Move automaticamente o Policiamento em direção ao seu nível de gasto esperado, um nível por vez. Os números mostram os níveis atual e esperado. Restrições normais de leis e custos de Poder Político se aplicam. Aumentos exigem superávit e pausam durante falência iminente. A reserva de Poder Político é preservada. Alterações manuais de leis mantêm esta opção ativada."
 AUTOMATION_SETTINGS_BUDGET_EDUCATION_BUDGET: "Educação: [?education_law|0] / [?expected_edu_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_EDUCATION_BUDGET_TT: "Move automaticamente a Educação em direção ao seu nível de gasto esperado, um nível por vez. Os números mostram os níveis atual e esperado. Restrições normais de leis e custos de Poder Político se aplicam. Aumentos exigem superávit e pausam durante falência iminente. A reserva de Poder Político é preservada. Alterações manuais de leis mantêm esta opção ativada."
 AUTOMATION_SETTINGS_BUDGET_HEALTH_BUDGET: "Saúde: [?health_law|0] / [?expected_health_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_HEALTH_BUDGET_TT: "Move automaticamente a Saúde em direção ao seu nível de gasto esperado, um nível por vez. Os números mostram os níveis atual e esperado. Restrições normais de leis e custos de Poder Político se aplicam. Aumentos exigem superávit e pausam durante falência iminente. A reserva de Poder Político é preservada. Alterações manuais de leis mantêm esta opção ativada."
 AUTOMATION_SETTINGS_BUDGET_SOCIAL_BUDGET: "Assistência Social: [?social_law|0] / [?expected_welfare_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_SOCIAL_BUDGET_TT: "Move automaticamente a Assistência Social em direção ao seu nível de gasto esperado, um nível por vez. Os números mostram os níveis atual e esperado. Restrições normais de leis e custos de Poder Político se aplicam. Aumentos exigem superávit e pausam durante falência iminente. A reserva de Poder Político é preservada. Alterações manuais de leis mantêm esta opção ativada."
 AUTOMATION_SETTINGS_BUDGET_MILITARY_SPENDING: "Gastos Militares: [?military_law|0] / [?expected_military_sp|0]"
 AUTOMATION_SETTINGS_BUDGET_MILITARY_SPENDING_TT: "Move automaticamente os Gastos Militares em direção ao seu nível de gasto esperado, um nível por vez. Os números mostram os níveis atual e esperado. Restrições normais de leis e custos de Poder Político se aplicam. Aumentos exigem superávit e pausam durante falência iminente. A reserva de Poder Político é preservada. Alterações manuais de leis mantêm esta opção ativada."
 AUTOMATION_SETTINGS_GENERAL_PAGE_TT: "Configure automações gerais, como ações das Nações Unidas, preferências de notificação e outras automações menores."
 AUTOMATION_SETTINGS_SPACE_PAGE_TT: "Configure a produção automática de satélites, os lançamentos e as melhorias de constelação.\n\n§YPré-requisitos:§!\n[!automation_settings_space_page_button_click_enabled]"
 AUTOMATION_SETTINGS_INFLUENCE_PAGE_TT: "Configure a automação de influência, como defesa e ataque de influência."
 AUTOMATION_SETTINGS_ECONOMY_PAGE_TT: "Configure a automação econômica, como alíquotas de impostos e leis."
 AUTOMATION_SETTINGS_NUCLEAR_ENRICHMENT: "Bloquear Ofertas de Combustível Nuclear da IA"
 AUTOMATION_SETTINGS_NUCLEAR_ENRICHMENT_TT: "Impede que países controlados pela IA enviem pedidos de compra de §YCombustível Nuclear§! a uma nação. Jogadores humanos ainda podem enviar ofertas."