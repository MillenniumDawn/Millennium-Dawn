 marks_trade.2.t: "합의안을 승인한 [From.GetName]"
 marks_trade.2.d: "[From.GetName]의 정부가 이 합의를 승인했으며, 곧 서명하고 시행할 것으로 예상됩니다. 양국 간 상품 교역이 늘어날 것으로 기대할 수 있고, 협정 조항 덕분에 그 나라에 대한 우리 투자도 한결 간소해질 것입니다."
 marks_trade.2.a: "지역에 더없이 좋은 날이다!"
 marks_trade.3.t: "합의안을 거부한 [From.GetName]"
 marks_trade.3.d: "안타깝게도 마크의 계획은 뜻대로 풀리지 않은 듯합니다. [From.GetName]의 정부는 우리와의 교역 관계 확대보다 국내 보호를 우선하겠다며 이 합의를 거부했습니다. 당분간은 손실을 만회하고 다른 곳으로 눈을 돌려야 할 것입니다."
 marks_trade.3.a: "썩 좋지는 않군."
 ast_jap_trade.6.t: "새 협정을 수락한 오스트레일리아"
 ast_jap_trade.6.d: "협상단으로부터 오스트레일리아 측이 원래 제안에 대한 우리의 수정안을 승인했으며 곧 서명할 예정이라는 소식이 들어왔습니다. 이는 오랜만에 주요 경제국과 맺는 경제 동반자 관계 가운데 하나이며, 남쪽의 우방과의 관계에 중요한 디딤돌이 될 것입니다."
 ast_jap_trade.6.a: "또 하나의 성공적인 협정이다!"
 solomon_islands_intervention.0.t: "솔로몬 제도의 붕괴"
 solomon_islands_intervention.0.d: "일련의 무장 봉기와 무산된 무장 해제 끝에 솔로몬 제도 정부는 사실상 붕괴했고, 그 자리에는 무법 상태만 남았습니다. 오랜 민족 분쟁을 둘러싸고 대립하는 무장 단체들 사이에서 전면적인 교전이 벌어지고 있으며, 공공 서비스는 완전히 마비되었습니다. 그 결과 많은 주민이 폭력에 무방비로 노출되어 이 지역의 인도주의 위기가 커지고 있습니다. 정부가 병력을 동원하려 하고 있지만, 상황이 달라지지 않는 한 제도의 사태는 악화일로를 걸을 것으로 보입니다."
 solomon_islands_intervention.0.a: "섬들에 어둠이 드리운다."
 solomon_islands_intervention.7.t: "성공으로 끝난 개입"
 solomon_islands_intervention.7.d: "마지막 무기 은닉처가 파괴되고 남아 있던 마지막 무장 강도들이 검거되어 교도소로 압송되면서, 우리나라에 평화와 치안이 회복되었습니다. 모든 면에서 이번 개입은 성공이었으며, 머지않아 일부 기업이 지방으로 돌아올 것으로 기대할 수 있습니다. \n\n다만 점령에 대한 우리의 우려는 예상대로 현실이 되었습니다. 오스트레일리아 측은 가까운 장래에는 제한된 병력을 계속 주둔시킬 의도라는 점을 분명히 했습니다. 이 협정은 처음부터 안정을 유지하기 위한 것이었지만, 나라의 통제권을 다시 우리 손에 돌려받으려면 험난한 싸움이 기다리고 있습니다."
 solomon_islands_intervention.7.a: "대가 없는 승리는 없다."
 boat_arrivals_ast_2: "관리 가능한 보트 입국"
 boat_arrivals_ast_2_desc: "이 문제는 수십 년 동안 우리나라 정부들을 괴롭혀 왔습니다. 줄을 서지 않고 보트 밀입국 등을 통해 입국하려는 이민자들의 입국은 법적으로 승인되지 않았더라도 엄밀히는 범죄가 아닙니다. 이 때문에 이러한 불법 입국자의 처리는 고되고 비용이 많이 드는 일이 되었으며, 쉽게 해결되지 않을 문제입니다."
 boat_arrivals_ast_3: "늘어나는 보트 입국"
 boat_arrivals_ast_3_desc: "이 문제는 수십 년 동안 우리나라 정부들을 괴롭혀 왔습니다. 줄을 서지 않고 보트 밀입국 등을 통해 입국하려는 이민자들의 입국은 법적으로 승인되지 않았더라도 엄밀히는 범죄가 아닙니다. 이 때문에 이러한 불법 입국자의 처리는 고되고 비용이 많이 드는 일이 되었으며, 쉽게 해결되지 않을 문제입니다."
 boat_arrivals_ast_4: "관리되지 않는 보트 입국"
 boat_arrivals_ast_4_desc: "이 문제는 수십 년 동안 우리나라 정부들을 괴롭혀 왔습니다. 줄을 서지 않고 보트 밀입국 등을 통해 입국하려는 이민자들의 입국은 법적으로 승인되지 않았더라도 엄밀히는 범죄가 아닙니다. 이 때문에 이러한 불법 입국자의 처리는 고되고 비용이 많이 드는 일이 되었으며, 쉽게 해결되지 않을 문제입니다."
 boat_arrivals_ast_5: "§R압도적인§! 보트 입국"
 boat_arrivals_ast_5_desc: "이 문제는 수십 년 동안 우리나라 정부들을 괴롭혀 왔습니다. 줄을 서지 않고 보트 밀입국 등을 통해 입국하려는 이민자들의 입국은 법적으로 승인되지 않았더라도 엄밀히는 범죄가 아닙니다. 이 때문에 이러한 불법 입국자의 처리는 고되고 비용이 많이 드는 일이 되었으며, 쉽게 해결되지 않을 문제입니다."
 SOL_collapsing_state: "붕괴하는 국가"
 SOL_collapsing_state_desc: "이 나라에서 법과 질서는 사실상 무너졌고, 넓은 지역을 일탈한 경찰과 무장 세력의 떠돌이 갱단이 장악하고 있습니다. 남아 있는 얼마 되지 않는 경제는 자유 낙하 중이며, 정부 자체도 의사당 안에 갇혀 있습니다. 악화되는 상황을 통제할 재정도 권위도 없습니다."
 SOL_collapsing_state_1: "취약한 국가"
 SOL_collapsing_state_1_desc: "대부분의 무장 세력이 무장 해제되어 국가의 구금하에 있습니다. 몇몇 마을에는 법이 회복되었으나, 상황은 여전히 위태로운 균형 위에 놓여 있습니다."
 SOL_collapsed_state: "붕괴한 국가"
 SOL_collapsed_state_desc: "많은 주민이 계속 섬을 떠나는 동안, 남은 무장 세력은 죽은 나라의 사체를 계속 뜯어먹고 있습니다. 민주주의의 마지막 불빛은 꺼졌고, 살아남으려는 이들에게 미래에 대한 희망은 거의 없습니다."
 JAP_AST_trade_deal_1: "§4일본-오스트레일리아 경제동반자협정§!"
