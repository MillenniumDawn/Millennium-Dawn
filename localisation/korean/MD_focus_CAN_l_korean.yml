 CAN_extremely_high_french_happiness_effect: "엄청 높은 행복도:\n§H정치력 획득:§! §G+25%§!\n§H안정도:§! §G+15%§!\n"
 CAN_very_high_french_happiness_effect: "매우 높은 행복도:\n§H정치력 획득:§! §G+15%§!\n§H안정도:§! §G+10%§!\n"
 CAN_high_french_happiness_effect: "높은 행복도:\n§H정치력 획득:§! §G+10%§!\n§H안정도:§! §G+5%§!\n"
