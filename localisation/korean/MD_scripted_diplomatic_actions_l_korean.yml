 OFFER_MIL_GNSS_ACCESS_TITLE: "군용 위성항법시스템 접근 제공"
 OFFER_MIL_GNSS_ACCESS_ACTION_DESC: "전략적 파트너십의 제스처로서 우리의 암호화된 군용 위치 파악 네트워크에 대한 업링크 자격 증명을 제공합니다. 이 승인에는 차등적 접근 프로토콜, 작전 보안 브리핑, 방위 체계 통합 지원이 포함됩니다. 이러한 접근은 양국 간 신뢰와 상호 운용성에 대한 중대한 투자를 의미합니다. 수락되면 그들은 우리의 §Y군용 위성항법시스템 위성 네트워크§!에 접근할 수 있게 됩니다."
 OFFER_MIL_GNSS_ACCESS_LOC: "군용 위성항법시스템 접근 제공 보내기"
 OFFER_MIL_GNSS_ACCESS_RECIEVER_LOC: "그들이 자국의 군용 위성항법시스템 네트워크 접근을 제공하고 있습니다."
 OFFER_MIL_GNSS_ACCESS_ACCEPTED_TITLE: "제안이 받아들여지다!"
 OFFER_MIL_GNSS_ACCESS_ACCEPTED_DESC: "그들은 우리의 군용 위성항법시스템 네트워크로부터 이점을 얻게 될 것입니다."
 OFFER_MIL_GNSS_ACCESS_REJECTED_TITLE: "제안 거절"
 OFFER_MIL_GNSS_ACCESS_REJECTED_DESC: "그들이 우리의 군용 위성항법시스템 네트워크 접근 제안을 거절했습니다."
