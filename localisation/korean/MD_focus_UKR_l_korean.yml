 UKR_develop_t72mp: "§YT-72MP§! 개발"
 UKR_develop_t72mp_desc: "§W하르키우 모로조프 기계설계국이 체코 및 프랑스 기업들과 협력하여 개발한 T-72MP는 1997년에 공개된 대규모 현대화 패키지였습니다. 이 패키지는 개량된 6TD-1 파워팩, 향상된 방호력, 열상 및 파노라마 조준경을 갖춘 프랑스 사젬 사의 SAVAN 15MP 현대식 사격 통제 체계를 결합했습니다. 주로 수출 시장을 겨냥해 설계된 T-72MP는 우크라이나 기술을 현대 서방 체계와 통합하여 T-72 플랫폼의 사용 수명을 연장할 수 있음을 보여 주었습니다.§!"
