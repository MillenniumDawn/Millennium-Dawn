 antarctica_join_ccas_effect_tt: "Rejoindre le §YCCAS§!.\nAugmente les rendements des laboratoires concernés de §G+20 %§! :\n- Rendement de la §Ytechnologie génétique§!\n- Rendement du multiplicateur du coût des soins\n- Rendement de la population mensuelle\nExemple : §Y+8,0 %§! de gènes devient §G+9,6 %§!."
