 CHI_TAI_resend_mainland_access_desc: "Taipéi rechazó el acercamiento anterior. Dirigirse de nuevo al gobierno de Taiwán con la oferta de acceso preferencial al mercado del continente."
 CHI_TAI_resend_semiconductor: "Renovar propuesta de cooperación: Coordinación de semiconductores"
 CHI_TAI_resend_semiconductor_desc: "Taipéi rechazó el acercamiento anterior. Dirigirse de nuevo al gobierno de Taiwán con la propuesta de coordinación de semiconductores a través del estrecho."
