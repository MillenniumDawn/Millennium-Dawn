 SWI_the_bank_of_the_world: "La Banque du monde"
 SWI_the_bank_of_the_world_desc: "Le secret bancaire suisse a fait de Zurich et Genève les coffres du monde. Formaliser ce rôle et laisser le capital étranger s'installer ici plutôt qu'à Londres ou Francfort."
 SWI_strengthening_swiss_cooperation: "Renforcer la coopération suisse"
 SWI_strengthening_swiss_cooperation_desc: "Exercices conjoints, doctrine partagée et équipement standardisé lient la milice suisse à ses nouveaux partenaires de l'Alliance."
 SWI_bastion_of_democracy: "Bastion de la démocratie"
 SWI_bastion_of_democracy_desc: "La neutralité n'a jamais été de l'indifférence. La Suisse se dresse comme un exemple vivant d'autogouvernement, et le dit clairement."
 SWI_eu_investments: "Investissements européens"
 SWI_eu_investments_desc: "Le capital suisse afflue vers le marché unique. Nos banques souscrivent la croissance européenne, et la croissance européenne souscrit nos banques."
 SWI_on_our_own_path: "Sur notre propre voie"
 SWI_on_our_own_path_desc: "L'UE est un client parmi d'autres. La finance suisse sert qui paie, et ne répond qu'à Berne."
 SWI_staple_of_democracy: "Pilier de la démocratie"
 SWI_staple_of_democracy_desc: "Les capitales occidentales placent chez nous parce que nos institutions sont prévisibles. Cette prévisibilité est elle-même une exportation."
 SWI_eu_candidacy: "Candidature à l'Union européenne"
 SWI_eu_candidacy_desc: "Berne dépose une candidature formelle à Bruxelles. L'adhésion mettrait fin au patchwork bilatéral et lierait la Suisse à l'Union qu'elle contourne depuis des décennies."
 SWI_eu_candidacy_tt: "La Suisse devient §Ycandidat YEU§!"
 SWI_friend_for_all: "Un ami pour tous"
 SWI_friend_for_all_desc: "Pas de bloc, pas d'alignement, pas d'amis permanents. La Suisse offre ses bons offices à chaque nation et est de confiance pour toutes."
 SWI_trust_in_the_eu: "Confiance dans l'UE"
 SWI_trust_in_the_eu_desc: "La candidature n'est pas l'adhésion. Approfondir la coopération avec les États membres prouve l'engagement suisse avant le vote d'accession."
 SWI_trust_in_the_eu_tt: "Chaque §YÉtat membre de l'UE§! gagne §G+30§! d'opinion envers la Suisse"
 SWI_swiss_independence: "Indépendance suisse"
 SWI_swiss_independence_desc: "Les lobbies étrangers se sont trop bien installés à Berne. Leur influence est reculée et les institutions intérieures reprennent le contrôle."
 SWI_mutual_defence_training: "Entraînement de défense mutuelle"
 SWI_mutual_defence_training_desc: "Les écoles de guerre alpine s'ouvrent aux partenaires européens. Leurs soldats apprennent nos montagnes, et notre milice apprend à combattre à leurs côtés."
 SWI_invest_in_eu: "Investir dans l'UE"
 SWI_invest_in_eu_desc: "Les caisses de pension et les banques suisses prennent des participations directes dans l'industrie européenne, convertissant le poids financier en stature politique."
 SWI_national_investments: "Investissements nationaux"
 SWI_national_investments_desc: "Le capital qui serait allé à l'étranger est tourné vers l'intérieur, vers les infrastructures, l'industrie et la recherche suisses."
 SWI_defence_training_in_the_alps: "Entraînement de défense dans les Alpes"
 SWI_defence_training_in_the_alps_desc: "Chaque recrue apprend le terrain qu'elle défendra. Des cours de répétition entraînent la milice dans les vallées qu'elle est chargée de tenir."
 SWI_european_defence: "Défense européenne"
 SWI_european_defence_desc: "Un cadre de défense européen commun prend forme, avec l'ingénierie suisse et la neutralité suisse en son centre plutôt qu'à sa marge."
 SWI_swiss_banking: "Banque Suisse"
 SWI_swiss_banking_desc: "Nos banques ont dépassé le pays dont elles portent le nom. Consolider le secteur et le laisser travailler à l'échelle qu'il a gagnée."
 SWI_swiss_banking_two: "Le coffre du monde"
 SWI_swiss_banking_two_desc: "Les dépôts arrivent de tous les continents. La Suisse cesse de rivaliser avec les grands centres financiers et devient le lieu où ils gardent leurs réserves."
 SWI_last_man_standing: "Le dernier debout"
 SWI_last_man_standing_desc: "La doctrine suppose le pire : chaque route coupée, chaque allié disparu. La milice est entraînée à combattre quand même."
 SWI_swiss_neutrality: "Neutralité suisse"
 SWI_protect_alps: "Protecteur des Alpes"
 SWI_protect_alps_desc: "Les Alpes ne sont pas un décor. La protection fédérale des hautes vallées préserve le terrain qui a tenu les envahisseurs à l'écart pendant six siècles."
 SWI_Expanding_nuclear_research_desc: "Les réacteurs suisses vont au-delà de la production d'électricité. Les programmes de recherche des instituts fédéraux s'avancent dans les cycles du combustible et la science des matériaux."
 swiss_political_system4: "Système politique de la Suisse"
 swiss_political_system4_desc: "Power is pushed back down to the cantons. Bern coordinates rather than commands, and local government decides what local government can decide. Federal decision-making slows, but building and administration answer to the people who live with the consequences.\n\nThe arrangement only holds while Switzerland answers to itself and the Federal Council stays in the hands of the democratic parties, the neutral bloc or the national populists. Fall under a foreign master, or hand government to anyone outside those, and the consensus that makes it work is gone."
 SWI_milita: "La milice armée"
 SWI_milita_desc: "L'armée de citoyens est politisée autant qu'armée. Le service devient une école de l'État autant que du fusil."
 SWI_multilingual_workers: "Travailleurs multilingues"
 SWI_multilingual_workers_desc: "Les travailleurs germanophones, francophones, italophones et romanchophones s'organisent par-delà les frontières linguistiques qui ont longtemps divisé le travail suisse."
 SWI_propaganda_idea: "Propagande d'État"
 SWI_propaganda_idea_desc: "Le bureau de presse fédéral cesse d'informer et commence à persuader. Radio, presse écrite et programmes scolaires portent le même message."
 SWI_true_neutral: "La vraie neutralité"
 SWI_true_neutral_desc: "§YRègles spéciales :§!\n\n§YNous§! §RNE POUVONS PAS§! §Yrejoindre une faction !§!\n--------------\nPas une neutralité armée, pas une neutralité bienveillante. La Suisse ne prend aucun parti, n'accueille aucune base et ne signe aucune garantie.\n--------------\nCet esprit national peut être §RRetiré§! via la décision §HAbandonner la vraie neutralité§!."
 SWI_sig_sauer_ag: "SIG Sauer AG"
 SWI_sig_sauer_ag_desc: "Les usines de Neuhausen arment la milice. Chaque foyer suisse avec un fusil d'ordonnance détient une pièce de la production SIG."
 SWI_rheinmetall_cooperation: "Coopération Rheinmetall"
 SWI_rheinmetall_cooperation_desc: "Rheinmetall Air Defence à Zurich, héritière d'Oerlikon, lie le travail suisse sur les canons et les radars à la plus grande maison d'armement d'Allemagne."
 SWI_thales_cooperation: "Thales Coopération"
 SWI_thales_cooperation_desc: "Thales Suisse fournit les radars, l'optronique et les systèmes de commandement qui transforment une milice en force en réseau."
 SWI_local_production1: "Production locale"
 SWI_local_production1_desc: "Les armes achetées à l'étranger peuvent être embarguées. Celles construites à Thoune ne le peuvent pas. Les lignes nationales prennent en charge l'essentiel."
 SWI_pilatus_aircraft_manufacturer_trainer_header: "Avion d'entraînement"
 SWI_pilatus_aircraft_manufacturer_attack_header: "Attaque légère"
 SWI_pilatus_aircraft_manufacturer_utility_header: "Utilitaires et transports"
 switzerland.18.t: "La question de l'OTAN"
 switzerland.18.desc: "Les protocoles d'adhésion sont sur la table du Conseil fédéral. Les signer met fin à une neutralité armée qui a survécu à tous les empires d'Europe."
 switzerland.18.a: "Signer les protocoles."
 switzerland.18.b: "La neutralité n'est pas négociable."
 switzerland.22.t: "Notre place en Europe"
 switzerland.22.desc: "Bruxelles offre un accès commercial plus profond à des conditions qui lieraient la réglementation suisse au droit de l'UE. Les cantons sont divisés."
 switzerland.22.a: "Approfondir les liens avec l'UE."
 switzerland.22.b: "Commercer avec tous également."
 switzerland.23.t: "L'offre suisse"
 switzerland.23.desc: "Berne propose que la Principauté rejoigne la Fédération alpine. Le Liechtenstein utilise déjà le franc et partage notre union douanière. Il reste la couronne."
 switzerland.23.a: "Accepter l'union."
 switzerland.23.b: "La Principauté reste seule."
 switzerland.24.t: "Adhésion du Liechtenstein"
 switzerland.24.desc: "Vaduz a accepté. La Principauté entre dans la Fédération comme membre à part entière, et le dernier enclave indépendant des Alpes a disparu."
 switzerland.24.a: "Les Alpes sont entières."
 switzerland.25.t: "Le Liechtenstein refuse"
 switzerland.25.desc: "Le Prince a décliné. Vaduz gardera sa couronne, son parlement et son indépendance, si petite soit-elle."
 switzerland.25.a: "So be it."
 switzerland.26.t: "Un ultimatum alpin"
 switzerland.26.desc: "Berne a lancé un ultimatum : la Principauté doit entrer dans la Fédération alpine, par accord si possible et par la force si nécessaire. Les troupes suisses se massent le long d'une frontière qui n'a jamais eu besoin d'être défendue. Le Landtag doit maintenant décider si le Liechtenstein se soumet ou défie son voisin."
 switzerland.26.a: "Nous ne pouvons pas tenir face à la Suisse."
 switzerland.26.b: "La Principauté ne s'agenouillera pas !"
 SWI_un_member_tt: "La Suisse doit être §Ymembre des Nations unies§! (rejoindre via la décision §GRejoindre les Nations unies§!)"
 SWI_bank_established_tt: "La Suisse doit avoir établi un §Ygrand centre financier§! via §GBanque de l'Occident§!, §GLa Banque du monde§!, §GInvestissements européens§! ou §GSur notre propre voie§!"
 SWI_world_bank_established_tt: "La Suisse doit avoir établi le §Ycentre financier mondial§! via §GLa Banque du monde§!, §GInvestissements européens§! ou §GSur notre propre voie§!"
 SWI_fiscal_equalization_council: "Fonds de péréquation fiscale"
 SWI_fiscal_equalization_council_desc: "Avec le Conseil des États guidant la réforme, un nouveau fonds fédéral redistribue la richesse des cantons les plus riches vers les plus pauvres, assurant un développement uniforme et un niveau de vie élevé dans toute la Fédération tout en préservant l'autonomie régionale."
 SWI_idea_mass_produced_firearms: "Armes à feu produites en série"
 SWI_idea_mass_produced_firearms_desc: "Des lignes de production standardisées et des pièces interchangeables ont fait baisser le coût des armes légères tout en améliorant la fiabilité et les performances défensives."
 SWI_idea_gunship_development: "Développement de canonnières"
 SWI_idea_gunship_development_desc: "Des hélicoptères d'attaque lourdement armés fournissent l'appui aérien rapproché et la reconnaissance, intégrant la mobilité aérienne à la doctrine défensive de l'armée."
 switzerland.27.t: "Demande d'achat d'un Eurofighter"
 switzerland.27.d: "La Suisse a demandé l'achat d'appareils Eurofighter Typhoon à notre industrie de défense."
 switzerland.27.a: "Approuver la vente."
 switzerland.27.b: "Refuser, nos lignes de production sont occupées."
 switzerland.28.t: "Demande d'achat Rafale"
 switzerland.28.d: "La Suisse a demandé l'achat d'avions de chasse Rafale à notre industrie de défense."
 switzerland.28.a: "Approuver la vente."
 switzerland.28.b: "Refuser, nos lignes de production sont occupées."
 switzerland.29.t: "Demande d'achat du C-130J"
 switzerland.29.d: "La Suisse a demandé l'achat d'avions de transport C-130J Super Hercules à notre industrie de défense."
 switzerland.29.a: "Approuver la vente."
 switzerland.29.b: "Refuser, nos lignes de production sont occupées."
 switzerland.30.t: "Achat approuvé"
 switzerland.30.d: "Notre demande d'achat a été approuvée. Les appareils sont en cours de livraison."
 switzerland.30.a: "Excellent."
 switzerland.31.t: "Achat refusé"
 switzerland.31.d: "Notre demande d'achat a été refusée. Aucun appareil ne sera livré."
 switzerland.31.a: "Un revers pour le programme."
 SWI_heer_modifier: "Suisse Heer"
 SWI_heer_modifier_desc: "L'armée suisse est une force de milice bâtie sur la conscription universelle, où le citoyen garde son fusil à la maison et la montagne est traitée comme la première ligne de défense. Elle n'aligne pas d'armée de campagne permanente d'importance, s'appuyant plutôt sur une mobilisation rapide, des destructions préparées et un terrain alpin fortifié."
 SWI_schweizerische_luftwaffe_modifier: "Luftwaffe suisse"
 SWI_schweizerische_luftwaffe_modifier_desc: "Les Forces aériennes suisses existent pour tenir l'espace aérien au-dessus de la Confédération et rien au-delà. Leurs appareils décollent de bases alpines durcies et de hangars en caverne, chargés de l'interception et de la police aérienne plutôt que de la projection de puissance."
 SWI_military_industry_modifier: "Industrie militaire suisse"
 SWI_military_industry_modifier_desc: "La production d'armement suisse est petite, précise et jalousement indépendante. Des firmes comme RUAG, MOWAG et SIG Sauer approvisionnent la milice et exportent à l'étranger, soutenant une base industrielle de défense bien plus grande que ne le suggérerait la taille du pays."
 SWI_politica_estera_svizzera_modifier: "Politique étrangère suisse"
 SWI_politica_estera_svizzera_modifier_desc: "Les choix accumulés de Berne à l'étranger, de la neutralité armée et du maintien de la paix de l'ONU aux liens bancaires et à l'alignement sur l'Europe ou l'OTAN. Chaque étape du programme de politique étrangère façonne la stature de la Confédération, ses finances et la préparation de sa milice."
 SWI_alps_treaty: "Traité des Alpes"
 SWI_alps_treaty_trade: "Traité des Alpes"
 SWI_geneva_climate_accord: "Accord de Genève sur le climat"