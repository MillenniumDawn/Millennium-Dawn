 module_naval_radar_jammer_1: "Brouilleur de radar naval I"
 module_naval_radar_jammer_1_desc: "Les brouilleurs radar navals dégradent la capacité de l'ennemi à détecter, suivre et engager en injectant bruit, tromperie et faux échos dans les capteurs hostiles.\n\n§GIndice du concepteur : les brouilleurs radar réduisent la visibilité de surface tout en améliorant la détection, la puissance de santé, les missiles antinavires et l'attaque de torpille. Utile sur les combattants de valeur qui ont besoin de survie, mais exigent des puces.§!\n§GIndice concepteur : les brouilleurs radar réduisent la visibilité de surface tout en améliorant la détection, les points de vie, les missiles antinavires et l'attaque à la torpille. Utiles sur les combattants de valeur qui ont besoin de survivabilité, mais exigent des microprocesseurs.§!"
 module_naval_radar_jammer_2: "Brouilleur de radar naval II"
 module_naval_radar_jammer_2_desc: "$module_naval_radar_jammer_1_desc$"
