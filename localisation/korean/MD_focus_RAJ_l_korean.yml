 RAJ_neutrality_idea_desc: "인도의 중립 정책은 세계의 문제에서 벗어나 있는 섬세한 균형을 유지하는 것입니다. 이제 이러한 집단들로부터 벗어나 인도를 새로운 중립국으로 선언할 때입니다."
 RAJ_riot_police_idea: "진압 경찰"
 RAJ_riot_police_idea_desc: "전담 진압 부대가 배치되어 시민 소요와 종파 간 폭력을 진압합니다. 이들의 존재는 대규모 무질서를 억제하지만 시민의 자유를 압박하며 정부에 대한 여론을 자극할 수 있습니다."
 RAJ_outer_doctrine_idea_desc: "인도는 파키스탄 및 중국과의 잠재적 분쟁을 중심으로 한 전략 교리를 공식화했습니다. 군사 계획, 전력 태세, 조달은 모두 이 두 가지 주요 위협 방향에 맞춰 조정됩니다."
 RAJ_energy_idea: "인도 원자력 에너지"
 RAJ_restructure_spending_idea_desc: "지출 구조를 개편하면 여기저기서 비용을 절감하여 더 큰 경제 성장을 이룰 수 있습니다."
 RAJ_resource_reg_idea: "자원 프로젝트"
 RAJ_resource_reg_idea_desc: "우리나라의 자원 부문에 집중하면 훌륭한 성과를 거둘 수 있습니다. 이 경제 분야에 집중하지 않으면 다른 부문에서도 침체가 나타날 수 있습니다."
 RAJ_network_improvement_idea: "네트워크 개선"
 RAJ_a_rising_power_idea: "떠오르는 강국"
 RAJ_a_rising_power_idea_desc: "인도는 세계에서 부상하고 있으며, 국제 무대에서 강해질수록 다른 나라들의 경계 어린 시선도 계속 이어집니다."
 TRK_Not_accepted: "투르크메니스탄이 우리의 제안을 수락하지 않았습니다!"
 RAJ_Local_markets: "인도 지역 무역"
 indian_event.667.t: "미국의 동의"
 indian_event.667.d: "그들은 파키스탄의 MNNA 지위를 박탈할 것입니다."
 indian_event.667.a: "좋아"
 indian_event.668.t: "우리 제안을 거절한 미국"
 indian_event.668.d: "파키스탄은 미국의 주요 비나토 동맹국으로 남을 것이다."
 indian_event.668.a: "실망스럽군."
 RAJ_decommodify_the_basics_idea: "필수재의 탈상품화"
 indian_event.25.b: "좋은 거래다!"
 RAJ_nuclear_tests_rajasthan: "라자스탄 핵실험"
 RAJ_nuclear_tests_rajasthan_desc: "핵무기고의 갱신과 확장은 현대 인도 방위 정책의 중요한 선례입니다. 이제 라자스탄에서 새로운 실험을 실시하고 우리의 힘을 확신할 때입니다."
 RAJ_terror_and_disruptive_activities_act: "테러 및 파괴 활동 방지법"
 RAJ_terror_and_disruptive_activities_act_desc: "우리의 입법 체계는 21세기 테러라는 새로운 도전에 대비되어 있지 않았습니다. 이를 적응시키고 필요한 개정을 할 때입니다."
 RAJ_inner_network_idea_desc: "잘 갖춰진 내부 네트워크는 우리의 발전에 필수적입니다"
 indian_event.12.a: "물론이지"
 RAJ_make_threshold_higher: "문턱 상향"
 RAJ_make_threshold_higher_desc: "선거의 청렴성을 달성하려면 아마추어와 여타 멍청이들을 걸러내도록 선거 문턱을 높여, 지적이고 교육받은 사람들이 설 자리를 남겨야 합니다."
 RAJ_BRICS_integer: "BRICS 창설"
 RAJ_BRICS_integer_desc: "세계 주요 강대국들이 하나의 주먹으로 뭉쳐 다극 세계를 만들 때입니다. 상트페테르부르크 경제 포럼에서 제안된 BRICS 구상은 반드시 실현되어야 합니다."
 RAJ_appease_hindus_desc: "힌두교 공동체 프로그램과 문화 사업에 투자합니다. 힌두교도의 관계가 상승하지만 이슬람교 공동체에서는 편애로 비칠 수 있습니다."
 RAJ_appease_sikhs_desc: "시크교 공동체의 불만을 해소하고 문화 프로그램에 자금을 지원합니다. 시크교도의 관계가 상승하지만 힌두교도에게는 편애로 비칠 수 있습니다."
 RAJ_appease_buddhists_desc: "불교 유산 보존과 공동체 지원 활동을 후원합니다. 불교도의 관계가 상승하지만 힌두교도에게는 편애로 비칠 수 있습니다."
 RAJ_appease_christians_desc: "기독교 공동체 개발에 자금을 지원하고 차별 문제를 해결합니다. 기독교도의 관계가 상승하지만 힌두교도에게는 편애로 비칠 수 있습니다."
 RAJ_appease_muslims_desc: "이슬람교 공동체 복지에 투자하고 안전 문제를 해결합니다. 이슬람교도의 관계가 상승하지만 힌두교도에게는 편애로 비칠 수 있습니다."
 RAJ_naxalite_insurgency: "심각한 낙살라이트 반란"
 RAJ_naxalite_insurgency_desc: "[RAJ.GetName]은(는) 심각한 낙살-마오주의 반란을 겪고 있습니다. 붉은 회랑 지역은 대규모 게릴라 작전과 보안군에 대한 빈번한 매복, 반군의 상당한 영토 장악으로 매우 활발합니다."
 RAJ_naxalite_insurgency_severe_TT: "§R심각한 반란 수준§! - 대규모 게릴라 주둔 및 작전"
 RAJ_naxalite_insurgency_1: "강력한 낙살라이트 반란"
 RAJ_naxalite_insurgency_1_desc: "[RAJ.GetName]은(는) 매우 활발한 낙살라이트 반란에 직면해 있습니다. 반군은 농촌 지역에 강력한 근거지를 유지하며 정부 시설과 인원에 대한 공격을 빈번히 감행합니다."
 RAJ_naxalite_insurgency_high_TT: "§O높은 반란 수준§! - 빈번한 공격을 동반한 활발한 반란"
 RAJ_naxalite_insurgency_2: "중간 수준의 낙살라이트 반란"
 RAJ_naxalite_insurgency_2_desc: "[RAJ.GetName]은(는) 중간 수준의 낙살라이트 반란을 겪고 있습니다. 반군의 근거지가 자리 잡고 있어 주기적으로 사건이 발생하지만, 보안군이 전반적인 통제를 유지하고 있습니다."
 RAJ_naxalite_insurgency_moderate_TT: "§Y중간 반란 수준§! - 자리 잡은 근거지와 주기적 활동"
 RAJ_naxalite_insurgency_3: "약한 낙살라이트 반란"
 RAJ_naxalite_insurgency_3_desc: "[RAJ.GetName]의 이 지역에는 낙살라이트의 존재가 제한적입니다. 산발적인 사건이 발생하지만 반군의 기반 시설은 크게 약화되었습니다."
 RAJ_naxalite_insurgency_weak_TT: "§G약한 반란 수준§! - 산발적 사건을 동반한 제한적 존재"
 RAJ_naxalite_insurgency_4: "낮은 수준의 낙살라이트 반란"
 RAJ_naxalite_insurgency_4_desc: "[RAJ.GetName]의 이 지역에는 낙살라이트 활동이 미미합니다. 지역은 대부분 소탕되었으며 고립된 사건만 남아 있습니다."
 RAJ_naxalite_insurgency_low_TT: "§G낮은 반란 수준§! - 활동 미미, 지역 대부분 소탕됨"
 RAJ_development_boost: "개발 구상 시행 중"
 RAJ_development_boost_TT: "§G개발 구상§! - 정부 개발 프로그램으로 건설 속도 증가"
 RAJ_integrated_development_initiative: "통합 개발 구상"
 RAJ_integrated_development_initiative_desc: "낙살라이트 피해 지역에서 인프라, 교육, 의료를 포함한 포괄적인 개발 프로그램을 시작합니다. 이는 부족민의 불만을 줄이고 지역 여건을 개선하여 반란의 근본 원인을 해결합니다."
 RAJ_surrender_rehabilitation_program: "투항 및 사회 복귀 프로그램"
 RAJ_surrender_rehabilitation_program_desc: "무기를 내려놓는 낙살라이트에게 사면과 사회 복귀 혜택을 제공하는 투항 정책을 시행합니다. 이는 역사적으로 효과적이었으며, 이러한 프로그램 이후 상당한 규모의 투항이 이어졌습니다."
 RAJ_operation_green_hunt: "그린 헌트 작전"
 RAJ_operation_green_hunt_desc: "낙살라이트 거점을 겨냥한 대규모 합동 준군사 공세를 개시합니다. 이 대규모 작전에는 중앙 준군사 부대가 주 경찰과 협력하여 영토를 소탕하고 장악하는 것이 포함됩니다."
 RAJ_samadhan_doctrine: "SAMADHAN 교리 채택"
 RAJ_samadhan_doctrine_desc: "포괄적인 SAMADHAN 교리를 시행합니다. 스마트한 리더십, 공격적 전략, 동기 부여와 훈련, 실행 가능한 정보, 대시보드 기반 성과 지표, 기술 활용, 전역별 행동 계획, 자금줄 차단으로 구성됩니다."
 RAJ_naxal.10.t: "PWG-MCC 합병으로 CPI(마오주의파) 결성"
 RAJ_naxal.10.d: "인민전쟁집단과 마오주의 공산주의 센터가 합병하여 인도 공산당(마오주의파)을 결성했습니다. 이 통합은 간부, 자원, 붉은 회랑 전역의 영토 장악력을 결합하여 더욱 강력한 반군 세력을 만듭니다."
 RAJ_naxal.10.a: "이는 심각한 확전이다."
 RAJ_naxal.11.t: "대규모 낙살라이트 공격"
 RAJ_naxal.11.d: "낙살라이트 반군이 보안군에 대한 파괴적인 공격을 감행했습니다. 매복 공격으로 여러 인원이 사망하고 장비가 파괴되었습니다. 이 공격의 대담함은 반란의 힘이 계속되고 있음을 보여줍니다."
 RAJ_naxal.11.a: "단호하게 대응해야 한다."
 RAJ_naxal.12.t: "낙살라이트 대규모 투항"
 RAJ_naxal.12.d: "우리의 사회 복귀 프로그램과 지속적인 압박에 따라 상당수의 낙살라이트 간부가 당국에 투항했습니다. 전직 반군들은 사회 재통합을 위한 절차를 밟고 있습니다."
 RAJ_naxal.12.a: "우리 정책의 성공이다."
 RAJ_naxal.13.t: "낙살라이트 지도부 제거"
 RAJ_naxal.13.d: "정보 주도 작전으로 낙살라이트의 핵심 지도자가 제거되었습니다. 반군 지휘 체계에 대한 이 타격은 그들의 작전을 교란하고 후계를 둘러싼 내부 분쟁을 촉발할 가능성이 있습니다."
 RAJ_naxal.13.a: "중대한 승리다."
 RAJ_naxal.14.t: "부족민 이주 반대 시위"
 RAJ_naxal.14.d: "낙살라이트 피해 지역의 부족 공동체가 광산 및 산업 사업으로 인한 이주에 항의하고 있습니다. 낙살라이트는 이러한 불만을 이용해 새로운 간부를 모집하고 대중의 지지를 얻으려 하고 있습니다."
 RAJ_naxal.14.a: "시위를 무시한다."
 RAJ_naxal.14.b: "그들의 우려를 해결한다."
 RAJ_naxal.15.t: "그린 헌트 작전 종료"
 RAJ_naxal.15.d: "합동 준군사 공세가 상당한 성과를 거두었습니다. 여러 주에 걸친 낙살라이트의 진지가 약화되고 보급선이 교란되었으며 여러 거점이 소탕되었습니다. 반란은 약화되었습니다."
 RAJ_naxal.15.a: "압박을 계속한다."
 RAJ_naxal.16.t: "낙살 없는 인도"
 RAJ_naxal.16.d: "수년간의 지속적인 노력 끝에 인도는 낙살라이트-마오주의 반란을 사실상 제거했습니다. 붉은 회랑은 더 이상 중대한 위협이 아닙니다. 개발이 부족 지역에 도달했고 전직 반군들은 사회에 복귀했습니다. 이는 국내 안보에서 역사적인 성과입니다."
 RAJ_naxal.16.a: "새로운 시대가 시작된다."
 RAJ_operation_green_hunt_active: "그린 헌트 작전 진행 중"
 RAJ_operation_green_hunt_active_desc: "낙살라이트 거점을 겨냥한 대규모 합동 준군사 공세가 진행 중입니다. 보안군이 붉은 회랑 전역에서 영토를 소탕하고 장악하고 있습니다."
 RAJ_samadhan_doctrine_idea: "SAMADHAN 교리"
 RAJ_samadhan_doctrine_idea_desc: "스마트한 리더십, 공격적 작전, 실행 가능한 정보, 기술 활용을 결합한 포괄적인 대반란 전략이 채택되었습니다."
 RAJ_naxal_free_india: "낙살 없는 인도"
 RAJ_naxal_free_india_desc: "인도는 낙살라이트-마오주의 반란을 성공적으로 제거했습니다. 붉은 회랑은 안정되었으며 개발은 이전에 피해를 입었던 부족 지역에 도달했습니다."
 RAJ_salwa_judum_active: "살와 주둠 활동 중"
 RAJ_salwa_judum_active_desc: "논란이 많은 민간 민병대 프로그램인 살와 주둠('평화 행진' 또는 '정화 사냥')이 차티스가르에서 활동 중입니다. 마오주의자 진압에는 효과적이지만 인권 침해로 비판받아 왔습니다."
 RAJ_counter_insurgency_operations: "대반란 작전"
 RAJ_counter_insurgency_operations_desc: "붉은 회랑 전역의 낙살라이트 거점을 겨냥한 포괄적인 대반란 작전을 개시합니다. 합동 군사 작전, 정보 수집, 지역 장악 전략이 포함됩니다."
 RAJ_reduce_naxalite_level_tt: "이 주의 낙살라이트 반란 수준을 1 낮춥니다"
 RAJ_naxal.17.t: "단테와다 매복 공격"
 RAJ_naxal.17.d: "2010년 4월 6일, 낙살라이트가 차티스가르 단테와다 지구에서 CRPF 중대를 매복 공격했습니다. 이 공격으로 보안 인원 76명이 사망했으며, 반란 역사상 가장 치명적인 단일 공격 중 하나가 되었습니다. 마오주의자들은 사제 폭탄과 자동화기를 사용해 수 시간 동안 이어진 치밀하게 조율된 공격을 감행했습니다."
 RAJ_naxal.17.a: "이는 국가적 비극이다"
 RAJ_naxal.18.t: "수크마 공격"
 RAJ_naxal.18.d: "2017년 4월 24일, 낙살라이트가 차티스가르 수크마 지구에서 CRPF 인원을 겨냥해 파괴적인 매복 공격을 감행했습니다. 이 공격으로 보안 인원 25명이 사망했습니다. 마오주의자들은 수년간의 대반란 작전에도 불구하고 여전히 타격할 능력이 있음을 계속 보여주고 있습니다."
 RAJ_naxal.18.a: "우리는 굴하지 않을 것이다"
 RAJ_salwa_judum: "살와 주둠 개시"
 RAJ_salwa_judum_desc: "살와 주둠('평화 행진' 또는 '정화 사냥')은 차티스가르 주 정부가 지원하는 논란 많은 반낙살라이트 민병대입니다. 대반란에는 효과적이었으나 인권 침해로 심한 비판을 받았고, 결국 2011년 대법원에서 위헌 판결을 받았습니다."
 RAJ_road_connectivity_program: "붉은 회랑 도로 연결망"
 RAJ_road_connectivity_program_desc: "낙살라이트 피해 지역의 도로 인프라를 개선합니다. 연결성이 좋아지면 외진 부족 지역에 정부 서비스를 제공하고 반군의 활동을 어렵게 하여 마오주의자의 영향력을 줄입니다."
 RAJ_MAO_rebellion_desc: "심각한 낙살라이트 반란과 커져가는 공산주의 지지가 마오주의 세포 조직들로 하여금 정부에 맞선 대규모 시위를 조직하도록 부추겼습니다. 이들의 영향력을 억제하지 못하면 무장 반란이 뒤따를 것입니다."
 RAJ_bolywood_idea_desc: "뭄바이를 중심으로 하는 인도 영화 산업은 제작량 면에서 세계 최대입니다. 그 문화적 영향력은 남아시아, 중동, 그리고 전 세계 인도인 디아스포라에 걸쳐 있으며, 소프트 파워를 투사하는 강력한 수단으로 기능합니다."
 RAJ_settle_gujarat_unrest: "구자라트 소요 수습"
 RAJ_settle_gujarat_unrest_desc: "델리의 특정 정부를 기다리지 않고 국가 자원을 투입해 구자라트의 종파 간 긴장을 해소하고 질서를 회복합니다. 이는 힌두교도와 이슬람교도 양측의 관계를 향상시킵니다. 양측이 모두 35 이상으로 회복되면 구자라트 소요는 저절로 해소되며, 이들의 관계를 더 높게 유지할수록 지역이 계속 평온해집니다."
 RAJ_kashmir_unrest: "카슈미르 소요"
 RAJ_kashmir_unrest_desc: "카슈미르는 이슬람교도 다수가 델리로부터 소외감을 느끼는 한 계속 불안한 상태입니다. 이들의 불만이 해소되기 전까지 보안 작전은 계곡 전역의 사기와 안정도를 갉아먹습니다. 유화 결정, 종교 간 대화, 지역 중점을 통해 이슬람교도 관계를 35 이상으로 끌어올리면 이 소요가 해소됩니다."
 RAJ_punjab_unrest: "펀자브 소요"
 RAJ_punjab_unrest_desc: "시크교도의 남아 있는 반감이 펀자브를 위태롭게 하며 정치적 자본과 안정도를 소모시킵니다. 이 공동체의 우려를 해소하는 것만이 평온으로 돌아가는 유일한 길입니다. 유화 결정, 종교 간 대화, 지역 중점을 통해 시크교도 관계를 35 이상으로 끌어올리면 이 소요가 해소됩니다."
 RAJ_bengal_unrest: "벵골 소요"
 RAJ_bengal_unrest_desc: "벵골의 이슬람교도 주민과의 종파 간 마찰이 지역의 산업과 질서를 어지럽힙니다. 이 소요는 그들의 신앙이 국가와 화해할 때까지 지속됩니다. 유화 결정, 종교 간 대화, 지역 중점을 통해 이슬람교도 관계를 35 이상으로 끌어올리면 이 소요가 해소됩니다."
 RAJ_northeast_unrest: "북동부 소요"
 RAJ_northeast_unrest_desc: "북동부 전역의 기독교 공동체는 중앙 정부를 불신하며, 이는 분리주의 정서를 부추깁니다. 이들의 불만이 해소되기 전까지 모병과 안정도가 악화됩니다. 유화 결정, 종교 간 대화, 지역 중점을 통해 기독교도 관계를 35 이상으로 끌어올리면 이 소요가 해소됩니다."
 RAJ_new_army_idea_desc: "포괄적인 현대화 계획이 새로운 교리 원칙에 따라 인도군을 재편하여 모든 군종에 걸쳐 모병 체계, 작전 협조, 전투 준비 태세를 향상시켰습니다."
 RAJ_BRICS_desc: "BRICS 회원국 자격은 블록과의 무역 및 정치적 유대를 열어 주어 소규모 연구 협력을 가속하고, 동료 회원국과의 협상 테이블에서 인도 협상가들에게 더 유리한 입지를 제공합니다."
 RAJ_BRICS_associate: "BRICS 준회원국"
 RAJ_BRICS_associate_desc: "준회원 지위는 정회원 자격 없이도 BRICS 무역 및 연구와 연계시켜 주며, 블록의 혜택은 줄어들지만 승격의 문은 열려 있습니다."
 RAJ_BRICS_observer: "BRICS 옵서버"
 RAJ_BRICS_observer_desc: "옵서버 지위는 BRICS 외교에 계속 관여하게 하고 블록과의 무역 관계를 따뜻하게 하며, 더 깊은 통합으로 가는 첫걸음이 됩니다."
 RAJ_brics_leadership_TT: "BRICS의 지도국으로서 인도는 정치적 영향력과 무역 호의를 얻으며, 이는 더 많은 나라가 블록에 가입할수록 커집니다."
 RAJ_BRICS_bank_desc: "신개발은행은 회원국의 대출을 전략 자원 및 산업 프로젝트로 연결하여 지역 자원 산출량과 공장 생산량을 높입니다. 그 대가는 노출입니다. 외국 세력이 우리의 금융 결정에 영향력을 갖게 됩니다."
 RAJ_BRICS_cur_desc: "블록과 통화 정책을 조율하면 우리의 자금 조달 비용이 줄고 회원국과의 무역 조건이 개선되지만, 경제 주기를 재편하는 초기 비용이 막대하고 새로운 체제는 지속적인 주기 업그레이드 비용을 높입니다."
 RAJ_steady_elephant: "듬직한 코끼리"
 RAJ_steady_elephant_desc: "인도는 코끼리의 신중하고 멈출 수 없는 무게로 나아가야 합니다. 인내하고, 도전받을 때는 꿈쩍하지 않으며, 일깨워졌을 때는 단호해야 합니다. 강하고 독립적인 국가는 그러한 국민성의 이상을 요구합니다."
 RAJ_iri_fake_ns2_desc: "조달 감사와 국방부의 부분적인 개편이 효과를 내기 시작했습니다. 낭비되는 생산 능력과 부풀려진 전환 비용은 여전히 부담이 크지만, 면허 통치 시대의 가장 심한 왜곡은 완화되기 시작하고 있습니다."
 RAJ_iri_fake_ns3_desc: "개혁으로 관료적 형식주의가 충분히 줄어 방위 산업 공장들이 용인할 만한 효율로 가동됩니다. 민간 생산 라인의 전환이 더 이상 엄두도 못 낼 만큼 비싸지는 않으나, 일부 정실주의는 여전히 결과를 왜곡합니다."
 RAJ_iri_fake_ns4_desc: "현대적인 조달 체계, 투명한 계약, 엄정한 반부패 집행이 방위 산업을 경쟁력 있는 부문으로 바꾸어 놓았습니다. 비효율은 이제 치명적이지 않고 관리할 수 있는 수준입니다."
 RAJ_re_fake_militar2_desc: "재편된 지휘 체계와 현대화된 조정 수단이 병력 대부분을 안정시켰습니다. 포화 속에서의 조직력은 동급 군대에 아직 못 미치지만, 방어 참호 구축과 이동 규율은 개선되고 있습니다."
 RAJ_re_fake_militar3_desc: "교리 개혁과 합동참모부 통합으로 비슷한 수준의 군대와의 격차가 대부분 해소되었습니다. 이제 대부분의 부대가 현장에서 예측 가능한 결속력으로 작전합니다."
 RAJ_re_fake_militar4_desc: "한 세대에 걸친 전문화가 결실을 맺었습니다. 인도군은 이제 일류 군대의 현대적인 조율, 규율 있는 기동, 참호 구축 교리로 작전합니다."
 RAJ_industrial_expansion: "산업 확장"
 RAJ_industrial_expansion_desc: "중공업과 제조 역량에 투자하면 우리 경제가 현대화되고 전국에 일자리가 창출될 것입니다."
 RAJ_agrarian_society_desc: "농업 부문을 강화하면 식량 안보가 보장되고 우리나라의 근간을 이루는 농촌 공동체가 뒷받침됩니다."
 RAJ_expanding_at_calcutta: "캘커타 확장"
 RAJ_expanding_at_calcutta_desc: "인구가 증가함에 따라 캘커타를 확장해야 하는 현실에 직면했습니다. 우리는 다른 대도시에서 볼 수 있는 지속적인 확장 정책에서 영감을 얻습니다."
 RAJ_standard_rationing: "표준 배급제와 토지 개혁"
 RAJ_standard_rationing_desc: "토지 및 식량 배급 개혁은 농업을 현대화하는 한편 전통적인 권력 구조를 뒤흔듭니다."
 RAJ_indian_air_force: "인도 공군"
 RAJ_indian_air_force_desc: "인도 공군을 현대화하고 전투 훈련을 확대하여 우리 영공을 지휘하는 데 필요한 숙련된 항공 승무원을 양성합니다."
 RAJ_NAJA_idea_1_desc: "군용 수준의 무기와 훈련을 갖춘 준군사 조직과 경찰 병력이 분쟁 위험 지역 전반에 배치되어 국내 치안을 유지하고 반란 위협에 대응합니다."
 RAJ_network_centric_warfare: "네트워크 중심전"
 RAJ_network_centric_warfare_desc: "네트워크 중심전은 네트워크 중심 작전 또는 넷센트릭 전쟁이라고도 하며, 정보 기술에 일부 힘입은 정보 우위를 분산된 부대의 컴퓨터 네트워킹을 통해 경쟁 우위로 전환하려는 군사 교리 또는 전쟁 이론입니다."
 RAJ_interfaith_dialogue: "종교 간 대화 소집"
 RAJ_interfaith_dialogue_desc: "모든 종교를 한 테이블에 모으는 지속적인 국가 화해 프로그램에 자금을 지원합니다. 모든 공동체의 관계가 한꺼번에 상승하고 반감을 품는 집단도 없지만, 이 노력은 더디며 국고에 큰 부담을 줍니다."
 RAJ_religion_conflict_musl_hindu_title: "힌두교도와 이슬람교도의 폭력 사태 발발"
 RAJ_religion_conflict_musl_hindu_desc: "인구가 가장 많고 밀집한 도시 중 한 곳에서 힌두교도와 이슬람교도 집단이 원인을 알 수 없는 분쟁으로 싸우기 시작했습니다. 알려진 것은 양측이 서로를 갈가리 찢어놓고 있다는 것, 그리고 이것이 현지 경찰력에 심각한 부담을 주고 있다는 점뿐입니다."
 RAJ_religion_conflict_musl_christ_title: "이슬람교도와 기독교도의 대립"
 RAJ_religion_conflict_musl_christ_desc: "모스크 인근의 교회 건설을 둘러싸고 이슬람교도와 기독교도 집단이 오늘 대립하고 있습니다. 양측은 상대방이 예배 장소를 도시의 다른 곳으로 옮겨야 한다고 주장하고 있으며, 도시 곳곳에서 소규모 충돌이 있었다는 보고까지 있습니다."
 RAJ_religion_conflict_hindu_christ_title: "힌두교도와 기독교도의 충돌"
 RAJ_religion_conflict_hindu_christ_desc: "오늘 아침, 한 기독교도가 개종시키려던 힌두교도를 모욕하자 힌두교도 집단이 분노했습니다. 이 사건은 두 집단 간의 공공연한 무력 충돌로 번졌고 건물 여러 채가 불길에 휩싸였습니다."
 RAJ_religion_conflict_back_hindu: "힌두교도를 지지한다"
 RAJ_religion_conflict_back_muslim: "이슬람교도를 지지한다"
 RAJ_religion_conflict_back_christian: "기독교도를 지지한다"
 RAJ_religion_conflict_resolve: "양측을 만족시킬 해결책을 찾는다"
 RAJ_drdo_idea_desc: "국방연구개발기구는 자체 연구개발을 군에 연결하여 군사 연구를 가속하고, 민간 역량을 군수 생산으로 전환하는 비용을 줄이며, AI가 군사적 발전을 우선하도록 유도합니다."
 RAJ_indian_national_congress_desc: "인도 국민회의는 독립 이후 인도 정치에서 지배적인 세력이었습니다. 정당 조직을 강화하면 민주적 통치가 공고해질 것입니다."
 RAJ_indian_socialism_idea_desc: "네루의 혼합 경제 유산은 산업 생산, 무기 생산, 인프라에 대한 강력한 국가 주도를 이끕니다. 공장 처리량은 급증하지만, 허가 라지의 경직성 아래에서 사회적 결속은 약화됩니다."
 RAJ_scandinavian_model_idea_desc: "도입된 사회민주주의 정책 모델이 교육 비용을 줄이고 정치 질서를 안정시키지만, 그 대가로 관료제가 비대해지고 대중의 분위기는 더 조용해지며 군사화가 덜 이루어집니다."
 RAJ_true_social_democracy_idea_desc: "성숙한 복지 국가 체제는 사회 및 의료 비용을 줄이고, 눈에 보이는 국가의 유능함을 통해 전쟁 지지도를 높입니다. 재분배 부담 아래에서 인건비는 오르고 정치적 안정도는 소폭 하락합니다."
 RAJ_new_democratic_india_idea_desc: "민주적 규범에 대한 재확인된 의지가 안정도를 높이고, 정치력 생성을 가속하며, 국내 여론의 민주주의 쏠림을 강화합니다."
 RAJ_vietnamese_intervention: "베트남의 독립에 의문 제기"
 RAJ_demand_singapore: "싱가포르 요구"
 RAJ_demand_singapore_desc: "지역에서의 입지가 확보된 지금, 싱가포르에 대한 우리의 역사적 영유권을 주장하고 이 도시 국가를 우리의 영향권으로 편입시킬 때가 왔습니다."
 RAJ_arms_export_economy: "무기 수출 경제"
 RAJ_brics_leadership: "BRICS 주도"
 RAJ_religious_climate: "종교적 분위기"
 RAJ_country_has_any_naxalite_states: "인도의 한 주에 낙살라이트가 활동 중임"
 RAJ_has_severe_naxalite_states_trigger: "인도의 한 주에 심각한 낙살라이트 세력이 있음"
 RAJ_state_has_any_naxalite: "이 주에 낙살라이트가 활동 중임"
 RAJ_country_has_any_naxalite_states_TT: "어느 한 주에 낙살라이트가 활동 중임"
 RAJ_has_severe_naxalite_states_trigger_TT: "어느 한 주에 심각한 낙살라이트가 활동 중임"
 RAJ_hindu_discontent: "힌두교도의 불만"
 RAJ_hindu_discontent_desc: "다수를 차지하는 힌두교도가 정부 정책에 점점 불만을 품고 있습니다. 최대 인구 집단인 만큼 이들의 불만은 정치적 안정을 위협하고 정부의 지지 기반을 약화시킵니다. 힌두교도의 관계를 §Y35§! 이상으로 올리면 해소됩니다."
 RAJ_religious_harmony: "종교적 화합"
 RAJ_religious_harmony_desc: "인도의 모든 주요 종교 공동체가 정부에 우호적인 의견을 갖고 있습니다. 이러한 종교 간 화합은 국가 통합을 강화하고 투자를 유치합니다. 모든 종교가 §Y74§! 초과인 동안 유지됩니다."
 RAJ_religious_climate_TT: "§Y종교적 분위기§!: 안정도와 정치력은 다섯 종교의 평균 관계에 따라 변합니다. §Y50§! 초과 1점마다 각각 §G+0.4%§!이며, 미만 1점마다 같은 만큼 감소하고, 상한은 §G+10%§!, 하한은 §R-10%§!입니다."
 RAJ_settle_gujarat_unrest_TT: "[RAJ.GetNameWithFlag]의 §Y이슬람교도§! 관계가 50보다 높음\n[RAJ.GetNameWithFlag]의 §Y힌두교도§! 관계가 50보다 높음."
 RAJ_maoist_suppression: "[FROM.GetName]의 마오주의자 소탕"
 RAJ_suppression_failed_tt: "§R소탕이 실패했습니다.§! 마오주의 동조자들이 실패한 작전을 중심으로 결집하여 공산주의 지지가 증가합니다."
 RAJ_delhi_caliphate: "델리 칼리파국 선포"
 RAJ_delhi_caliphate_desc: "살라피 운동이 국가 기구를 장악하고 델리를 중심으로 한 칼리파국을 선포하여 입헌 공화국을 끝내고 새 정부를 이슬람 율법에 구속시킵니다."
 RAJ_iran_doctrinal_dispute: "이란의 교리에 맞서기"
 RAJ_iran_doctrinal_dispute_desc: "테헤란의 시아파 혁명 교리는 수니파 살라피 계획과 직접적으로 대립하는 이념적 경쟁자입니다. 이란의 지역적 영향력에 맞서는 것이 이제 전략적 우선순위입니다."
 RAJ_MAO_rebellion_armed: "무력 충돌 임박"
 RAJ_MAO_rebellion_armed_desc: "마오주의 반란이 시위를 넘어 확대되었습니다. 무장 세포 조직들이 정부에 맞선 전면전을 위해 동원되고 있습니다. 방치하면 내전은 불가피합니다."
 RAJ_central_asian_revolution: "[FROM.GetName]의 살라피 혁명"
 RAJ_central_asian_revolution_desc: "[FROM.GetNameDefCap]의 상황은 살라피 봉기에 무르익었습니다. 우리의 영향력을 현지 살라피 운동에 쏟아부어 무장 혁명을 일으키고 이 나라를 우리의 영향권에 편입시킵니다."
 RAJ_BRICS_polit_alliance_faction_warning_tt: "§R경고:§! 이 결정은 §R기존 세력을 해체§!하고 새로운 BRICS 세력으로 대체합니다. 초대한 BRICS 비회원국은 모두 §R거부§!됩니다."
 RAJ_arms_export_economy_TT: "§Y무기 수출 규모의 경제§!\n서로 다른 수출 상대국이 하나 늘어날 때마다 무기 산업이 확대되어 §G산업 역량§!이 증가합니다. 상대국당 공장 생산량 §G+1%§!"
 RAJ_energy_idea_desc: "국내 원자력 발전에 대한 투자는 발전 용량을 늘리고 수입 연료에 대한 의존도를 줄여 줍니다."
 RAJ_207_sd_idea_desc: "인도 최초의 완전한 국산 승용차인 타타 인디카는 건설과 공장 가동 확대를 가속하고 법인세 수입을 창출하며 정치적 안정과 인구 증가에 소폭 기여하는 국내 자동차 산업의 토대가 됩니다."
 RAJ_network_improvement_idea_desc: "국가 통신 기반시설을 개선하면 전국에 디지털 네트워크가 보급되는 속도가 빨라집니다."
 RAJ_socdem_stability_factor: "안정도 계수"
 RAJ_Local_markets_desc: "국내 시장과 노점 상업이 번성하여 전국의 소규모 건물 건설이 가속됩니다."
 TT_RAJ_LOCAL_MARKETS_MODIFIER: "§Y추가 수입§!: $§G0.080§!"
 indian_event.61.t: "뭄바이 열차 폭탄 테러"
 indian_event.61.d: "2006년 7월 11일 저녁 퇴근 시간대에 뭄바이 교외 철도망에서 조직적인 폭탄 7개가 연쇄 폭발하여 209명이 사망하고 700명 넘게 부상했습니다. 현지 조력자의 지원을 받은 라슈카르에타이바가 저지른 이 공격은 도시의 생명선을 겨냥하여 전국에 충격을 안겼습니다."
 indian_event.61.a: "이것은 전쟁 행위이다."
 RAJ_naxal.19.t: "다르바 계곡 매복 공격"
 RAJ_naxal.19.d: "2013년 5월 25일, 낙살 무장 세력이 차티스가르 다르바 계곡에서 인도 국민회의당 차량 행렬을 매복 공격하여 주 고위 지도자들과 경호원을 포함해 27명이 사망했습니다. 이 공격은 붉은 회랑 지역의 정보 활동과 이동로 보안에 심각한 허점이 있음을 드러냈습니다."
 RAJ_naxal.19.a: "무장 반란을 진압해야 한다."
 indian_event.62.t: "우리(Uri) 기지 공격"
 indian_event.62.d: "2016년 9월 18일, 무장 세력 4명이 잠무 카슈미르 우리(Uri) 인근의 인도 육군 여단 사령부를 공격하여 병사 19명이 사망하고 30명이 부상했습니다. 카슈미르에서 보안군을 겨냥한 가장 치명적인 공격 중 하나인 이 사건은 보복을 요구하는 목소리를 널리 불러일으켰습니다."
 indian_event.62.a: "대가를 치르게 하겠다."
 indian_event.63.t: "화폐 개혁 발표"
 indian_event.63.d: "2016년 11월 8일, 정부는 500루피와 1000루피 지폐의 통용 폐지를 갑작스럽게 발표하여 하룻밤 사이에 국내 통화의 86%를 무효화했습니다. 부정 자금과 위조 화폐를 억제하려는 목적이었지만, 이 조치는 일상생활과 비공식 경제에 막대한 혼란을 초래했습니다."
 indian_event.63.a: "필요한 희생이다."
 RAJ_eastas.6.t: "도클람 대치"
 RAJ_eastas.6.d: "2017년 6월, 인도군과 중국군이 부탄 인근 도클람 삼각 접경 지대에서 73일간 대치에 돌입했습니다. 분쟁 지역으로 도로를 연장하려는 중국의 시도를 인도군이 막아서면서, 두 핵보유국은 히말라야에서 무력 충돌 직전까지 갔습니다."
 RAJ_eastas.6.a: "한 치도 물러서지 않겠다."
 indian_event.64.t: "풀와마 테러 공격"
 indian_event.64.d: "2019년 2월 14일, 자이시 에 무함마드 소속 자폭 테러범이 폭발물을 가득 실은 차량으로 카슈미르 풀와마 인근에서 CRPF 차량 행렬을 들이받아 대원 40명이 사망했습니다. 수십 년 만에 가장 치명적인 보안군 대상 테러 공격은 국가적 위기를 불러왔고 응징을 요구하는 목소리가 커지고 있습니다."
 indian_event.64.a: "피에는 피로 갚아야 한다."
 indian_event.65.t: "헌법 제370조 폐지"
 indian_event.65.d: "2019년 8월 5일, 정부는 헌법 제370조를 폐지하여 잠무 카슈미르의 특별 자치 지위를 박탈하고 해당 주를 두 개의 연방 직할지로 분할했습니다. 보안 봉쇄와 통신 차단을 동반한 이 조치는 국내의 찬사와 국제사회의 우려를 동시에 불러일으켰습니다."
 indian_event.65.a: "카슈미르는 완전히 통합되었다."
 indian_event.66.t: "시민권법 개정 반대 시위 발발"
 indian_event.66.d: "2019년 12월, 이웃 나라에서 온 비무슬림 난민에게는 시민권을 부여하되 무슬림은 제외하는 시민권 개정법에 반대하는 대규모 시위가 전국에서 일어났습니다. 시위대는 이 법이 헌법의 세속주의 원칙을 위반한다고 주장합니다."
 indian_event.66.a: "국민의 목소리에 귀를 기울여야 한다."
 RAJ_eastas.7.t: "갈완 계곡 충돌"
 RAJ_eastas.7.d: "2020년 6월 15일, 인도군과 중국군이 라다크의 갈완 계곡에서 격렬한 백병전을 벌여 인도 병사 20명이 사망하고 중국 측에서도 규모를 알 수 없는 사상자가 발생했습니다. 이번 충돌은 1975년 이후 양국 간 국경 대치에서 발생한 첫 사망 사건입니다."
 RAJ_eastas.7.a: "그들의 희생을 기리겠다."
 RAJ_naxal.20.t: "비자푸르 매복 공격"
 RAJ_naxal.20.d: "2021년 4월 3일, 낙살 무장 세력이 차티스가르 비자푸르 지구에서 보안군을 매복 공격하여 대원 22명이 사망했으며, 이는 최근 몇 년간 가장 치명적인 공격 중 하나입니다. 이 사건은 수년간의 대반란 작전에도 붉은 회랑 지역의 위협이 여전하다는 점을 보여 줍니다."
 RAJ_naxal.20.a: "그들은 우리의 결의를 꺾지 못할 것이다."
 RAJ_naxal.21.t: "대법원, 살와 주둠 위헌 판결"
 RAJ_naxal.21.d: "2011년 7월 5일, 인도 대법원은 살와 주둠이 위헌이라고 판결하고, 국가가 후원하는 부족 민병대의 즉각적인 무장 해제를 명령했습니다. 법원은 훈련이 부족한 민간인에게 무기를 쥐여 주고 마오주의자와 싸우게 한 것이 기본권을 침해했으며 오히려 억제하려던 폭력의 악순환을 부추겼다고 판단했습니다. 국내 비판 세력과 국제 인권 단체들이 뉴델리를 예의주시하고 있습니다."
 RAJ_naxal.21.a: "판결을 따르겠다."
 RAJ_human_rights_scrutiny: "인권 감시"
 RAJ_human_rights_scrutiny_desc: "국제 인권 단체와 국내 언론이 대반란 작전의 수행 방식을 감시하고 있습니다. 안정도와 정치적 자산이 타격을 받으며, 세간의 이목이 쏠려 있는 동안에는 외국 정보기관이 인도를 더 손쉬운 표적으로 여깁니다."
 indian_event.67.t: "폭력 사태로 폭발하는 마니푸르"
 indian_event.67.d: "2023년 5월, 마니푸르에서 메이테이 공동체와 쿠키 공동체 사이에 민족 간 폭력이 폭발하여 수개월간 충돌, 방화, 난민 발생이 이어졌습니다. 토지 권리, 보호 지위, 종교적 단층선에 뿌리를 둔 이 위기는 북동부 주의 깊은 균열을 드러냈습니다."
 indian_event.67.a: "질서를 회복해야 한다."
 RAJ_regional.1.t: "국경 너머 타격"
 RAJ_regional.1.d: "2015년 6월 9일, 인도군은 미얀마 국경 너머로 정밀 타격을 감행하여, 마니푸르 찬델 지구에서 병사 18명이 사망한 매복 공격을 일으킨 NSCN-K 캠프를 파괴했습니다. 이 작전은 반군 은신처를 겨냥한 인도의 첫 공식 인정 국경 횡단 타격입니다."
 RAJ_regional.1.a: "자업자득이다."
 RAJ_regional.2.t: "방글라데시와의 월경지 교환"
 RAJ_regional.2.d: "2015년 6월 6일, 인도와 방글라데시는 68년간 이어진 국경 분쟁을 종식하는 획기적인 협정에 따라 월경지 162곳을 교환했습니다. 무국적 주민 5만 명 이상이 마침내 시민권을 받게 됩니다."
 RAJ_regional.2.a: "역사적인 날이다."
 RAJ_regional.3.t: "인도에 닥친 로힝야 위기"
 RAJ_regional.3.d: "2017년 8월, 미얀마 군부의 탄압으로 로힝야 70만 명 이상이 국경을 넘어 방글라데시로 피난했습니다. 인도에는 로힝야 난민 4만 명이 머물고 있으며, 정부는 이들을 보호할지 추방할지 결정해야 합니다."
 RAJ_regional.3.a: "모두 추방하라."
 RAJ_regional.3.b: "피난처를 제공하라."
 RAJ_regional.4.t: "티스타 회담 결렬"
 RAJ_regional.4.d: "2017년 4월, 방글라데시의 하시나 총리가 티스타강 물 분배 협정을 매듭짓기를 기대하며 뉴델리를 찾았습니다. 서벵골 주 총리가 또다시 합의를 가로막으면서 다카는 빈손으로 돌아가게 되었습니다."
 RAJ_regional.4.a: "주의 반대를 무시한다."
 RAJ_regional.4.b: "국내 정치가 우선이다."
 RAJ_regional.5.t: "수백만 명을 제외한 NRC"
 RAJ_regional.5.d: "2019년 8월, 아삼의 최종 국민 등록부(NRC)에서 190만 명이 제외되었으며 대부분 벵골계 무슬림입니다. 시민권 개정법과 맞물려 이 조치는 전국적인 시위와 다카의 격렬한 반응을 불러왔습니다."
 RAJ_regional.5.a: "국가 안보상 필요한 조치이다."
 RAJ_regional.6.t: "칼리스탄 국민투표 운동"
 RAJ_regional.6.d: "2020년, 금지 단체인 시크스 포 저스티스가 구속력 없는 전 세계 독립 국민투표를 시작하여 시크교 디아스포라 사이에서 높은 참여율을 이끌어 냈습니다. 정부의 단속에도 이 운동은 국내의 분리주의 정서를 부추기고 있습니다."
 RAJ_regional.6.a: "이 운동을 분쇄하라."
 RAJ_regional.7.t: "국경에 밀려드는 미얀마 난민"
 RAJ_regional.7.d: "2021년 2월 미얀마 군사 쿠데타 이후, 친(Chin)족 난민 수천 명이 미조람과 마니푸르로 넘어왔습니다. 중앙 정부는 주 정부들에 이들을 돌려보내라고 명령했지만, 미조람 주 총리는 뉴델리에 공공연히 맞서고 있습니다."
 RAJ_regional.7.a: "국경을 봉쇄하라."
 RAJ_regional.7.b: "통과시켜라."
 RAJ_regional.8.t: "나가 평화 기본 합의 서명"
 RAJ_regional.8.d: "2015년 8월 3일, 정부는 18년간의 협상 끝에 NSCN-IM과 기본 합의서에 서명했습니다. 이 합의는 아시아에서 가장 오래된 무장 반란 중 하나가 해결되고 북동부에 새로운 장이 열릴 것임을 약속합니다."
 RAJ_regional.8.a: "항구적 평화를 향한 한 걸음이다."
 RAJ_regional.9.t: "국경 간 무기 밀수"
 RAJ_regional.9.d: "정보 당국은 미얀마에서 북동부 붉은 회랑으로 이어지는 활발한 무기 유통로를 적발했습니다. 미얀마와 공동 작전을 펼치면 이를 차단할 수 있지만, 자원과 외교적 자산이 필요합니다."
 RAJ_regional.9.a: "공동 작전을 개시한다."
 RAJ_regional.9.b: "자원을 할애할 여유가 없다."
 RAJ_regional.10.t: "니자르 암살 위기"
 RAJ_regional.10.d: "2023년 6월, 칼리스탄 지도자 하르딥 싱 니자르가 브리티시컬럼비아에서 암살되었습니다. 캐나다 총리는 인도가 이 살해를 배후 조종했다고 공개적으로 비난했으며, 이는 수십 년 만에 가장 심각한 양국 간 외교 위기를 불러왔습니다."
 RAJ_regional.10.a: "그들의 외교관을 추방하라."
 RAJ_regional.11.t: "벵골만 해군 훈련"
 RAJ_regional.11.d: "2014년, 인도는 BIMSTEC 틀을 통해 방글라데시, 미얀마와의 해양 협력을 확대하여 공동 순찰을 실시하고 양국 해군에 초계함을 제공했습니다. 이 구상은 인도를 벵골만의 지배적인 해군 강국으로 자리매김하게 합니다."
 RAJ_regional.11.a: "우리 해역에서 힘을 과시하자."
 RAJ_regional.12.t: "국경수비대의 국경 살해"
 RAJ_regional.12.d: "인도 국경수비대가 접경 지역에서 방글라데시 민간인을 살해했다는 의혹을 또다시 받고 있습니다. 다카는 공식 항의서를 제출했고 인권 단체들은 책임 규명을 요구하고 있습니다."
 RAJ_regional.12.a: "자제를 명령하라."
 RAJ_regional.12.b: "국경은 사수해야 한다."
 RAJ_regional.13.t: "네팔 국경 봉쇄"
 RAJ_regional.13.d: "2015년 9월, 네팔이 마데시 소수민족을 소외시키는 새 헌법을 채택하자 인도는 국경을 통한 연료와 보급품 수송을 제한했습니다. 겨울이 다가오고 중국이 대체 보급로를 제안하는 가운데 네팔은 인도적 위기에 직면해 있습니다."
 RAJ_regional.13.a: "봉쇄를 강화한다."
 RAJ_regional.13.b: "제한을 완화한다."
 RAJ_regional.13.c: "봉쇄를 해제한다."
 RAJ_regional.14.t: "중국으로 선회하는 네팔"
 RAJ_regional.14.d: "수개월간의 보급 제한은 네팔 경제를 황폐화했습니다. 카트만두는 베이징과 새로운 무역 및 통과 협정을 체결했으며, 이는 오랫동안 인도의 영향권에 있던 나라에서 일어난 극적인 변화입니다. 이번 봉쇄는 지나친 개입에 대한 교훈적 사례가 되었습니다."
 RAJ_regional.14.a: "이미 엎질러진 물이다."
 RAJ_regional.14.b: "화해의 손길을 내민다."
 RAJ_regional.14.c: "우리의 자제가 결실을 맺었다."
 RAJ_regional.15.t: "칼라파니 국경 분쟁"
 RAJ_regional.15.d: "2020년 5월, 네팔 의회는 칼라파니, 리푸레크, 림피야두라에 대한 영유권을 주장하는 헌법 개정안을 만장일치로 통과시켰습니다. 분쟁 중인 이 삼각 접경 지대는 인도, 네팔, 중국 국경에 걸쳐 있어, 병력 배치는 히말라야 전 국경의 긴장을 고조시킬 수 있습니다."
 RAJ_regional.15.a: "우리의 진지를 강화한다."
 RAJ_regional.15.b: "협상을 제안한다."
 RAJ_regional.15.c: "공동 측량을 수락한다."
 RAJ_regional.16.t: "1950년 조약 재검토"
 RAJ_regional.16.d: "네팔은 1950년 평화우호조약을 불평등한 유물이라고 부르며 공식적으로 개정을 제안했습니다. 이 조약은 네팔의 외교 및 국방 정책에 대한 인도의 영향력을 뒷받침하고 있어, 재협상은 양국 관계를 재편할 수 있습니다."
 RAJ_regional.16.a: "협력 관계를 현대화한다."
 RAJ_regional.16.b: "조약은 유지된다."
 RAJ_regional.17.t: "인도에 감사를 표하는 부탄"
 RAJ_regional.17.d: "도클람 대치가 해결된 이후, 부탄은 자국 영토에서 중국에 맞서 준 인도의 의지에 깊은 감사를 비공식적으로 표했습니다. 팀푸는 더욱 강력한 국방 관계를 공식화하기를 열망하고 있습니다."
 RAJ_regional.17.a: "동맹을 강화한다."
 RAJ_regional.17.b: "악수로 충분하다."
 RAJ_regional.18.t: "부탄 수력 발전 확대"
 RAJ_regional.18.d: "망데추 수력 발전 사업이 가동에 들어가 720MW의 발전 용량이 추가되었습니다. 인도는 부탄의 댐에 자금을 대고 건설하며 잉여 전력을 구매하는데, 이는 남아시아에서 가장 비대칭적이면서도 안정적인 협력 관계 중 하나입니다."
 RAJ_regional.18.a: "협력을 확대한다."
 RAJ_regional.18.b: "이미 약속한 것만으로도 충분하다."
 RAJ_regional.19.t: "민주주의를 받아들인 부탄"
 RAJ_regional.19.d: "2008년 3월, 지그메 케사르 남기옐 왕추크 국왕은 부탄이 절대군주제에서 입헌 민주주의로 평화롭게 이행하는 것을 주도했습니다. 첫 선거는 아무런 사고 없이 치러졌습니다. 인도의 가장 가까운 동맹국이 새로운 시대에 들어섭니다."
 RAJ_regional.19.a: "민주주의에 온 것을 환영한다."
 RAJ_regional.19.b: "군주제가 더 간단했다."
 RAJ_regional.20.t: "옥죄는 인도의 봉쇄"
 RAJ_regional.20.d: "인도가 국경 통과 지점을 폐쇄하면서 네팔은 연료, 의약품, 취사용 가스가 심각하게 부족해졌습니다. 베이징은 긴급 물자와 티베트를 통한 통과권을 제안했습니다. 카트만두는 자존심과 실용주의 사이에서 냉혹한 선택을 해야 합니다."
 RAJ_regional.20.a: "중국의 제안을 수락한다."
 RAJ_regional.20.b: "견디며 협상한다."
 RAJ_regional.21.t: "책임을 요구하는 오타와"
 RAJ_regional.21.d: "캐나다는 캐나다 영토에서 벌어진 시크교 지도자 하르딥 싱 니자르 암살에 인도가 연루되었다고 공식적으로 비난했습니다. 외교적 대치가 양국 무역과 대규모 인도계 캐나다인 디아스포라를 위협하는 가운데 오타와는 다음 수를 저울질하고 있습니다."
 RAJ_regional.21.a: "인도 외교관을 추방한다."
 RAJ_regional.21.b: "외교적 해결을 모색한다."
 RAJ_regional.22.t: "로힝야 추방을 규탄하는 다카"
 RAJ_regional.22.d: "인도가 로힝야 난민을 미얀마 쪽으로 돌려보내기 시작하면서 다카의 강한 비난을 샀습니다. 이미 미얀마에서 온 난민 100만 명 이상으로 포화 상태인 방글라데시는 이번 조치가 공동의 인도적 의무에 대한 배신이라고 규탄했습니다."
 RAJ_regional.22.a: "뉴델리의 결정을 규탄한다."
 RAJ_regional.23.t: "인도의 연대를 환영하는 다카"
 RAJ_regional.23.d: "로힝야 난민을 추방하는 대신 보호하기로 한 인도의 결정은 다카에서 따뜻한 환영을 받았습니다. 방글라데시는 이를 지역의 모든 나라를 힘들게 한 위기 속에서 보여 준 진정한 연대의 행동으로 봅니다."
 RAJ_regional.23.a: "인도의 연대에 감사한다."
 RAJ_regional.24.t: "칼라파니를 증강하는 인도"
 RAJ_regional.24.d: "네팔 의회가 해당 영토에 대한 영유권을 만장일치로 주장한 지 며칠 만에, 인도군이 분쟁 중인 칼라파니 리푸레크 삼각 접경 지대의 진지를 증강하기 위해 이동했습니다. 카트만두는 인도의 군사적 태세에 맞설지, 외교적 출구를 모색할지 결정해야 합니다."
 RAJ_regional.24.a: "병력을 동원한다."
 RAJ_regional.24.b: "외교를 통해 항의한다."
 RAJ_regional.25.t: "인도와의 동맹을 저울질하는 부탄"
 RAJ_regional.25.d: "도클람 대치 이후 인도는 부탄과의 국방 협력을 심화했습니다. 팀푸는 인도의 개입에 감사하면서도, 부탄 영토에 대해 자체적인 영유권 주장을 가진 베이징을 완전한 연대가 더욱 자극할 수 있다는 점을 의식하고 있습니다."
 RAJ_regional.25.a: "인도는 우리의 방패이다."
 RAJ_regional.25.b: "중국을 자극해서는 안 된다."
 RAJ_regional.26.t: "티스타 협정에 서명한 다카"
 RAJ_regional.26.d: "서벵골의 반대로 수년간 교착되었던 협상 끝에, 인도는 마침내 국내의 반대를 무릅쓰고 티스타강 물 분배 협정에 서명하겠다고 제안했습니다. 이 합의는 방글라데시에 중대한 외교적 승리이며 양국 관계를 바꿔 놓을 수 있습니다."
 RAJ_regional.26.a: "협정에 서명한다."
 RAJ_ladakh_crisis: "라다크 분리주의 위기"
 RAJ_ladakh_crisis_desc: "라다크의 무슬림 여론이 위험할 정도로 하락했습니다. 이들의 불만을 곧 해소하지 않으면 이 지역이 독립을 선언할 수 있습니다."
 RAJ_meghalaya_crisis: "메갈라야 분리주의 위기"
 RAJ_meghalaya_crisis_desc: "메갈라야의 기독교도 여론이 위험할 정도로 하락했습니다. 이들의 불만을 곧 해소하지 않으면 이 지역이 독립을 선언할 수 있습니다."
 RAJ_manipur_crisis: "마니푸르 분리주의 위기"
 RAJ_manipur_crisis_desc: "마니푸르의 기독교도 여론이 위험할 정도로 하락했습니다. 이들의 불만을 곧 해소하지 않으면 이 지역이 독립을 선언할 수 있습니다."
 RAJ_sikkim_crisis: "시킴 분리주의 위기"
 RAJ_sikkim_crisis_desc: "시킴의 불교도 여론이 위험할 정도로 하락했습니다. 이들의 불만을 곧 해소하지 않으면 이 지역이 독립을 선언할 수 있습니다."
 RAJ_punjab_crisis: "펀자브 분리주의 위기"
 RAJ_punjab_crisis_desc: "펀자브의 시크교도 여론이 위험할 정도로 하락했습니다. 이들의 불만을 곧 해소하지 않으면 이 지역이 독립을 선언할 수 있습니다."
 RAJ_raise_muslim_opinion_tt: "무슬림 여론이 19를 넘어야 합니다"
 RAJ_raise_christian_opinion_tt: "기독교도 여론이 19를 넘어야 합니다"
 RAJ_raise_buddhist_opinion_tt: "불교도 여론이 19를 넘어야 합니다"
 RAJ_raise_sikh_opinion_tt: "시크교도 여론이 14를 넘어야 합니다"
 RAJ_rebellion.1.a: "이것은 재앙이다."
 RAJ_rebellion.1.b: "상황이 안정되었다."
 RAJ_rebellion_ladakh_title: "라다크, 독립을 선언하다"
 RAJ_rebellion_ladakh_desc: "라다크의 무슬림 주민들은 중앙 정부에 대한 신뢰를 완전히 잃었습니다. 무장 분리주의자들이 이 지역을 장악하고 독립을 선언했습니다. 우리 군은 이 지역에서 쫓겨났습니다."
 RAJ_rebellion_meghalaya_title: "메갈라야, 독립을 선언하다"
 RAJ_rebellion_meghalaya_desc: "메갈라야의 기독교 공동체들이 중앙 정부에 맞서 봉기했습니다. 부족 민병대가 주를 장악하고 독립을 선언했습니다."
 RAJ_rebellion_manipur_title: "마니푸르, 독립을 선언하다"
 RAJ_rebellion_manipur_desc: "마니푸르의 기독교 및 부족 공동체들이 중앙 정부에 맞서 봉기했습니다. 무장 단체들이 주를 장악하고 독립을 선언했습니다."
 RAJ_rebellion_sikkim_title: "시킴, 독립을 선언하다"
 RAJ_rebellion_sikkim_desc: "시킴의 불교도 주민들은 중앙 정부에 대한 신뢰를 완전히 잃었습니다. 분리주의 세력이 권력을 장악하고 시킴의 주권을 회복하겠다며 독립을 선언했습니다."
 RAJ_rebellion_punjab_title: "펀자브, 독립을 선언하다"
 RAJ_rebellion_punjab_desc: "펀자브의 시크교도 주민들은 중앙 정부에 대한 신뢰를 완전히 잃었습니다. 칼리스탄 분리주의자들이 이 지역을 장악하고 독립을 선언했습니다."
 indian_event.70.t: "BRICS 정회원국 가입 초청"
 indian_event.70.d: "[FROM.GetName](이)가 우리나라를 BRICS 정회원국으로 가입하도록 초청했습니다. 이는 세계에서 가장 역동적인 신흥 경제국들과 경제적, 정치적 유대를 심화할 중요한 기회입니다. 정회원국이 되면 투표권, 신개발은행 이용권, 그리고 모든 BRICS 사업에 대한 참여권이 부여됩니다."
 indian_event.70.a: "영광으로 여기며 초청을 수락한다"
 indian_event.70.b: "거절한다 - 요건을 충족하지 못한다"
 indian_event.71.t: "BRICS 정회원국 가입을 수락한 [FROM.GetName]"
 indian_event.71.d: "[FROM.GetName](이)가 BRICS 정회원국으로 가입해 달라는 우리의 초청을 공식적으로 수락했습니다. 이 역사적인 확대는 우리 동맹을 강화하고 무역, 금융, 안보 분야의 새로운 협력 기회를 가져다줄 것입니다."
 indian_event.71.a: "한 식구로 맞이한다"
 indian_event.72.t: "BRICS 정회원국 가입을 거절한 [FROM.GetName]"
 indian_event.72.d: "[FROM.GetName](이)가 BRICS 정회원국으로 가입해 달라는 우리의 초청을 거절했습니다. 아쉽지만 우리는 그들의 결정을 존중하며 다른 경로를 통한 외교적 교류를 이어 가기를 희망합니다."
 indian_event.72.a: "놓친 기회이다"
 indian_event.73.t: "BRICS 준회원국 가입 초청"
 indian_event.73.d: "[FROM.GetName](이)가 우리를 BRICS 준회원국으로 초청했습니다. 이 지위는 완전한 투표권 없이 강화된 협력 기회를 제공합니다. 준회원국은 경제 사업에 참여하며 정상회의에서 옵서버 자격을 가집니다."
 indian_event.73.a: "준회원국 지위를 수락한다"
 indian_event.73.b: "거절한다 - 요건을 충족하지 못한다"
 indian_event.74.t: "BRICS 준회원국 가입을 수락한 [FROM.GetName]"
 indian_event.74.d: "[FROM.GetName](이)가 BRICS 준회원국으로 가입해 달라는 우리의 초청을 수락했습니다. 이는 우리의 경제적 유대를 강화하고 새로운 협력의 길을 열어 줄 것입니다."
 indian_event.74.a: "완전한 통합에 한 걸음 더 가까워졌다"
 indian_event.75.t: "BRICS 준회원국 가입을 거절한 [FROM.GetName]"
 indian_event.75.d: "[FROM.GetName](이)가 BRICS 준회원국 가입이라는 우리의 제안을 거절했습니다. 우리는 앞으로의 협력에 여전히 열려 있습니다."
 indian_event.75.a: "다음 기회가 있을 것이다"
 indian_event.76.t: "BRICS 옵서버 지위 초청"
 indian_event.76.d: "[FROM.GetName](이)가 우리에게 BRICS 옵서버 지위를 제안했습니다. 이를 통해 우리는 정상회의에 참석하고 실무 그룹에 참여하며, 더 깊은 관여를 검토하는 동안 회원국들과 관계를 쌓을 수 있습니다."
 indian_event.76.a: "옵서버 지위를 수락한다"
 indian_event.76.b: "거절한다 - 관심이 없다"
 indian_event.77.t: "BRICS 옵서버 지위를 수락한 [FROM.GetName]"
 indian_event.77.d: "[FROM.GetName](이)가 BRICS 옵서버 지위를 제안한 우리의 초청을 수락했습니다. 이는 더 깊은 관계의 시작이 될 수 있습니다."
 indian_event.77.a: "천 리 길도 한 걸음부터"
 indian_event.78.t: "BRICS 옵서버 지위를 거절한 [FROM.GetName]"
 indian_event.78.d: "[FROM.GetName](이)가 BRICS 옵서버 지위라는 우리의 제안을 거절했습니다. 그들이 재고한다면 초청은 유효합니다."
 indian_event.78.a: "때가 되면 가능할 것이다"
 indian_event.79.t: "BRICS 준회원국 지위 제안"
 indian_event.79.d: "[FROM.GetName](이)가 BRICS 내 우리의 지위를 옵서버에서 준회원국으로 격상하겠다고 제안했습니다. 준회원국 지위는 우리에게 연합체의 경제 사업에서 한 자리를 부여하고 정상회의 논의에서 더 강한 발언권을 주어, 신흥 경제국들과의 협력 관계를 심화합니다."
 indian_event.79.a: "승격을 수락한다"
 indian_event.79.b: "거절한다 - 옵서버로 충분하다"
 indian_event.82.t: "BRICS 정회원국 지위 제안"
 indian_event.82.d: "[FROM.GetName](이)가 BRICS 내 우리의 지위를 준회원국에서 정회원국으로 격상하겠다고 제안했습니다. 정회원국 지위는 투표권, 신개발은행 이용권, 동맹의 안보 체제 참여권을 부여하며, 우리의 미래를 연합체에 묶어 둡니다."
 indian_event.82.a: "정회원국 지위를 수락한다"
 indian_event.82.b: "거절한다 - 부담이 너무 크다"
 RAJ_brics_invite_full_member: "[FROM.GetName] 정회원국으로 초청"
 RAJ_brics_invite_full_member_desc: "[FROM.GetName](이)가 BRICS 정회원국 자격을 갖출 수 있습니다. 정회원국은 투표권, 신개발은행 이용권, 모든 BRICS 사업에 대한 참여권을 얻습니다."
 RAJ_brics_invite_associate_member: "[FROM.GetName] 준회원국으로 초청"
 RAJ_brics_invite_associate_member_desc: "[FROM.GetName](이)가 준회원국 자격을 갖출 수 있으며, 강화된 경제 협력을 통해 BRICS의 세계적 영향력을 넓힙니다."
 RAJ_brics_invite_observer: "[FROM.GetName] 옵서버로 초청"
 RAJ_brics_invite_observer_desc: "[FROM.GetName](이)가 옵서버 자격을 갖출 수 있으며, BRICS 논의와 실무 그룹에 참여할 수 있게 됩니다."
 RAJ_brics_promote_to_associate: "[FROM.GetName] 준회원국으로 승격"
 RAJ_brics_promote_to_associate_desc: "[FROM.GetName]의 지위를 옵서버에서 준회원국으로 격상하여 강화된 경제 협력 권한을 부여합니다."
 RAJ_brics_promote_to_full: "[FROM.GetName] 정회원국으로 승격"
 RAJ_brics_promote_to_full_desc: "[FROM.GetName]의 지위를 준회원국에서 정회원국으로 격상하여 투표권과 BRICS 활동에 대한 전면적인 참여권을 부여합니다."
 RAJ_brics_full_member_tt: "§Y[FROM.GetName]§!(이)가 투표권과 모든 사업에 대한 전면적인 참여권을 가진 §G정회원국§!으로 BRICS에 가입합니다."
 RAJ_brics_associate_member_tt: "§Y[FROM.GetName]§!(이)가 경제 협력 참여권을 가진 §Y준회원국§!으로 BRICS에 가입합니다."
 RAJ_brics_observer_tt: "§Y[FROM.GetName]§!(이)가 제한된 참여권을 가진 §Y옵서버§!로 BRICS에 가입합니다."
 RAJ_brics_rejected_tt: "§Y[FROM.GetName]§!(이)가 요건 미충족 또는 관심 부족을 이유로 초청을 거절했습니다."
 RAJ_brics_member_opinion: "BRICS 정회원국"
 RAJ_brics_associate_opinion: "BRICS 준회원국"
 RAJ_brics_observer_opinion: "BRICS 옵서버"
 BRICS_associate_member_requirements_tt: "요건: §YBRICS 지도국 영향력 40% 초과§!, §YBRICS 지도국과의 관계 50 초과§!, §Y민주주의/중립/공산주의§!"
 BRICS_observer_requirements_tt: "요건: §YBRICS 지도국 영향력 25% 초과§!, §YBRICS 지도국과 긍정적 관계§!"
 RAJ_rehabilitation_in_progress: "재활 프로그램 진행 중"
 RAJ_green_hunt_active: "그린 헌트 작전 가동 중"
 RAJ_suppression_active: "현재 낙살 지역 진압 중"
 USA_wot_enduring_freedom: "항구적 자유 작전이 시작되었습니다"
 indian_event.83.t: "복속을 요구하는 칼리파국"
 indian_event.83.d: "델리는 [ROOT.GetName]에게 신앙 안에서의 단결을 받아들이고 [FROM.GetName]의 통치에 복종하라고 촉구합니다. 거부는 곧 전쟁을 의미합니다."
 indian_event.83.a: "칼리파국에 복속한다."
 indian_event.83.b: "거부하고 전쟁을 준비한다."
 RAJ_gas_pipeline_accept_tt: "§Y수신국이 재생 에너지 발전소를 건설하며 인도와의 관계와 무역이 개선됩니다.§!"
 RAJ_gas_pipeline_reject_tt: "§Y수신국의 인도에 대한 관계가 악화됩니다.§!"
 RAJ_bangladesh_ultimatum_accept_tt: "§Y인도가 방글라데시를 완전히 병합하여 해당 영토에 대한 완전한 통제권과 옛 주들에 대한 중핵을 얻습니다.§!"
 RAJ_bangladesh_ultimatum_reject_tt: "§Y인도가 대신 방글라데시를 무력으로 정복하기 위한 전쟁 명분을 준비합니다.§!"
 RAJ_vietnam_alliance_accept_tt: "§Y베트남과 인도가 상호 동맹을 맺고 같은 세력에 가입합니다.§!"
 RAJ_sco_join_notify_tt: "§Y인도가 대화 파트너로서 SCO에 가입합니다.§!"
 RAJ_brics_founding_invite_tt: "§Y수락하는 각국은 정회원국으로 BRICS에 가입하여 인도의 BRICS 회원국 관계 보너스를 얻으며, 인도가 세력을 이끌고 있다면 인도의 세력에 가입합니다.§!"
 RAJ_iran_brics_invite_tt: "§Y이란이 정회원국으로 BRICS에 가입합니다.§!"
 RAJ_us_pak_pressure_accept_tt: "§Y미국이 파키스탄의 주요 비NATO 동맹국 지위를 격하하여 미국과 파키스탄의 관계가 악화됩니다.§!"
 RAJ_us_pak_pressure_reject_tt: "§Y미국의 인도에 대한 관계가 악화되고 워싱턴에 대한 인도의 영향력이 감소합니다.§!"
 RAJ_pakistan_ultimatum_accept_tt: "§Y인도가 파키스탄을 완전히 병합하여 해당 영토에 대한 완전한 통제권과 옛 주들에 대한 중핵을 얻습니다.§!"
 RAJ_pakistan_ultimatum_reject_tt: "§Y인도가 대신 파키스탄을 무력으로 정복하기 위한 전쟁 명분을 준비합니다.§!"
 RAJ_cenasia_ultimatum_accept_tt: "§Y인도가 수신국을 완전히 병합하여 해당 영토에 대한 완전한 통제권을 얻습니다.§!"
 RAJ_cenasia_ultimatum_reject_tt: "§Y인도가 대신 수신국을 무력으로 정복하기 위한 전쟁 명분을 준비합니다.§!"
 RAJ_turkmen_treaty_accept_tt: "§Y투르크메니스탄이 인도와 상호 불가침 조약을 체결하여 장차 아프가니스탄을 분할할 길을 닦습니다.§!"
 RAJ_turkmen_treaty_reject_tt: "§Y투르크메니스탄이 조약을 거부하여 장차 아프가니스탄을 분할할 길이 막힙니다.§!"
 RAJ_afghan_partition_accept_tt: "§Y투르크메니스탄이 인도와 함께 탈레반과 아프가니스탄에 대한 전쟁 명분을 확보합니다.§!"
 RAJ_islamic_ulema_invite_accept_tt: "§Y해당 국가가 인도의 이슬람 울라마 세력에 가입합니다.§!"
 RAJ_islamic_ulema_invite_reject_tt: "§Y양측의 관계가 무너지며, 해당 국가는 자국의 정치 및 안정도 페널티를 입습니다.§!"
 RAJ_development_in_progress: "통합 개발 구상이 이미 진행 중입니다"
 RAJ_pak_top_influencer_tt: "§Y[ROOT.GetNameWithFlag]§!이(가) §Y[PAK.GetNameWithFlag]§!에서 가장 큰 외국 영향력의 원천임"
 RAJ_seek_permanent_unsc_seat: "UN 안전보장이사회 상임이사국 진출 추진"
 RAJ_seek_permanent_unsc_seat_desc: "인도의 인구, 경제적 비중, 국제 평화 유지에서의 역할은 국제연합 안전보장이사회 상임 대표권 주장을 뒷받침합니다. 이 주장을 이사회와 총회에 상정하는 데 필요한 외교 캠페인을 시작할 것입니다."
 RAJ_enshrine_pluralism: "다원주의 명문화"
 RAJ_enshrine_pluralism_desc: "종교적 합의를 그때그때 정부의 선의에 맡기지 않고 헌법 질서에 명시합니다. §Y다원주의적 화합§! 법과 지속적인 종교적 화합이 필요합니다. 보너스가 영구적으로 고정되며, 종교 집단 간 관계가 더 이상 소요, 분리주의 위기, 분리 독립을 좌우하지 않습니다."
 RAJ_all_faiths_content: "모든 종교의 관계가 §Y80§! 초과"
 RAJ_pluralist_harmony: "다원주의적 화합"
 RAJ_pluralist_harmony_desc: "강한 위치에서 채택된 다원주의입니다. 모든 공동체가 이미 정부를 지지하고 있으므로, 국가 앞의 평등한 지위는 반감을 품은 다수에게서 쥐어짜낸 양보가 아니라 인정으로 받아들여집니다."
 RAJ_pluralist_settlement: "다원주의적 합의"
 RAJ_pluralist_settlement_desc: "종교적 합의가 헌법 질서에 명시되어 더 이상 그때그때 정부에 좌우되지 않습니다. 공동체의 지위가 연방의 결속을 좌우하는 일은 사라졌습니다."
 RAJ_hindus_opinion_tt: "§Y힌두교도§! 관계: $RIGHT|+=0$"
 RAJ_muslim_opinion_tt: "§Y이슬람교도§! 관계: $RIGHT|+=0$"
