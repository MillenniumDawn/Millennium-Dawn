 literacy_progress_the_gap_ast: "Progrès de Combler l’écart"
 literacy_progress_the_gap_ast_1: "Poursuivre l'écart"
 closing_the_gap_event.2.t: "Résultats de Closing the Gap"
 closing_the_gap_event.2.d: "Après quelques années de suivi de notre campagne d'alphabétisation et de soutien social, les résultats sont malheureusement mitigés. Si davantage d'enfants sont scolarisés et moins d'adultes incarcérés dans l'ensemble, les taux de placement hors du foyer et la délinquance juvénile augmentent régulièrement. Il semble donc que notre effort pour ramener les Australiens défavorisés vers le courant dominant soit en partie jugé un échec. \n\nNous pouvons investir davantage dans le programme pour poursuivre le travail et peut-être l'affiner, ou couper nos pertes maintenant et tout arrêter."
 closing_the_gap_event.2.a: "Poursuivre le travail."
 closing_the_gap_event.2.b: "Arrêtez-le."
 closing_the_gap_event.3.d: "Après quelques années de suivi de notre campagne d'alphabétisation et de soutien social, les résultats sont positifs. Davantage d'enfants sont scolarisés, moins d'adultes sont incarcérés dans l'ensemble, les taux de placement hors du foyer et la délinquance juvénile diminuent régulièrement. Il semble que notre effort pour ramener les Australiens défavorisés vers le courant dominant porte réellement ses fruits."
 closing_the_gap_event.3.a: "Encore un succès."
