 module_naval_asw_nuclear_torpedoes_3_desc: "핵 대잠 어뢰는 대잠 운반 방식에 매우 강력한 탄두를 결합하여 잠항 중인 표적에 대한 치사율을 극대화합니다.\n\n§G설계 힌트: 핵 대잠 어뢰는 탐지된 잠수함을 격침하기 위한 탁월한 대잠수함전 능력을 제공합니다. 전담 잠수함 사냥함에 적합하지만 기존 대잠 어뢰보다 IC와 인력 비용이 높습니다.§!"
 module_naval_asw_nuclear_torpedoes_4: "핵 대잠 어뢰 IV"
 module_naval_asw_nuclear_torpedoes_4_desc: "핵 대잠 어뢰는 대잠 운반 방식에 매우 강력한 탄두를 결합하여 잠항 중인 표적에 대한 치사율을 극대화합니다.\n\n§G설계 힌트: 핵 대잠 어뢰는 탐지된 잠수함을 격침하기 위한 탁월한 대잠수함전 능력을 제공합니다. 전담 잠수함 사냥함에 적합하지만 기존 대잠 어뢰보다 IC와 인력 비용이 높습니다.§!"
 module_naval_recon_drone_1: "해군 정찰 드론 I"
 module_naval_recon_drone_1_desc: "함상 발진 정찰 드론은 유인 항공기를 위험에 빠뜨리지 않고 지속적인 감시와 신속한 표적 확인을 제공하여 함대의 시야를 수평선 너머로 넓혀 줍니다.\n\n§G설계 힌트: 해군 정찰 드론은 수상 탐지와 잠수함 탐지를 크게 향상시키는 동시에 대함 미사일, 어뢰 공격력, 대공을 강화합니다. 고도의 정찰 및 표적 지정 함선에 적합하지만 IC와 마이크로칩 비용이 높습니다.§!"
 module_naval_recon_drone_2: "해군 정찰 드론 II"
