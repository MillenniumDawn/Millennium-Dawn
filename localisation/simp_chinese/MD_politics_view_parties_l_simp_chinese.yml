 WAA.Autocracy_icon: "£WAA_Autocracy"
 WAA.Autocracy_desc: "（亲华专制主义） - 佤邦联合党是缅甸掸邦北部自治区佤邦的执政党。该党成立于1989年11月3日，由缅甸民族民主联合党和几个较小的非共产主义佤族团体合并而成。佤邦联合党以毛泽东思想为意识形态指导，作为唯一合法政治组织统治佤邦。该党与中华人民共和国关系密切，引导佤邦进一步融入中国，远离缅甸内部的冲突。"
