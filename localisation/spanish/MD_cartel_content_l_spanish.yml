 MEX_chihuahua_sinola_cartel_desc: "El Cartel de Sinaloa se está volviendo demasiado fuerte, necesitamos frenar su influencia en Chihuahua."
 MEX_sinola_durango_sinola_cartel: "Reducir la influencia del Cartel de Sinaloa"
 MEX_sinola_durango_sinola_cartel_desc: "El Cartel de Sinaloa se está volviendo demasiado fuerte, necesitamos frenar su influencia en Sinaloa Durango."
