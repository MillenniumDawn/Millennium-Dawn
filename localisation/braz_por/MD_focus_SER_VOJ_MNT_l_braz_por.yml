 kosovo.13.t: "The PPDK Becomes the Democratic Party of Kosovo"
 kosovo.13.d: "The Party for the Democratic Progress of Kosovo, founded by the political leadership of the Kosovo Liberation Army, has renamed itself the Democratic Party of Kosovo. Its leaders say the new name marks the move from a wartime movement to a civilian party ready to contest elections under the UN administration."
 kosovo.13.a: "From liberation army to political party"
 kosovo.14.t: "The Kosovo Security Force Is Launched"
 kosovo.14.d: "The Kosovo Protection Corps has ended its operations and handed over to the new Kosovo Security Force. The lightly armed force is trained with NATO support for crisis response, demining and civil protection, and recruits from all of Kosovo's communities."
 kosovo.14.a: "A new uniform for a new state"
 kosovo.15.t: "The LKÇK Joins the Movement for Unification"
 kosovo.15.d: "The National Movement for the Liberation of Kosovo has ended its separate existence and merged into the Movement for Unification. Its members will continue to campaign for the union of Kosovo with Albania under the banner of the larger organisation."
 kosovo.15.a: "The old guard closes ranks"
 kosovo.16.t: "The LPK Merges into Vetëvendosje"
 kosovo.16.d: "The People's Movement of Kosovo has merged into the Self-Determination Movement. The organisation from which the Kosovo Liberation Army emerged now brings its veterans and diaspora networks into Vetëvendosje's ranks."
 kosovo.16.a: "Two movements become one"
 kosovo.17.t: "The Green Party Is Deregistered"
 kosovo.17.d: "The Central Election Commission has removed the Green Party of Kosovo from the register of political parties after it stayed away from several elections in a row. Environmental campaigners will now have to work through civic groups or other parties."
 kosovo.17.a: "Kosovo's greens lose their party"