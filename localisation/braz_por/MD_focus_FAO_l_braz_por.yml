l_braz_por:
 faroe_islands_focus: "Árvore de Foco das Ilhas Faroe"
 FAO_national_decisions: "Decisões Nacionais das Faroe"
 FAO_national_decisions_desc: "As Ilhas Faroe enfrentam um cenário político único, equilibrando o desenvolvimento socioeconômico liderado por seus políticos com o debate contínuo sobre a independência definitiva da Dinamarca. Essa discussão divide opiniões entre aqueles que defendem a separação imediata e os que preferem aguardar maior estabilidade econômica, tornando o futuro político do arquipélago uma decisão conjunta entre o povo \"faroês\" e o governo dinamarquês."
 FAO_decision_independence_war: "Guerra por Independência"
 FAO_decision_independence_war_desc: "Chegou a hora e os políticos forçaram a mão do povo. A guerra foi declarada e agora é uma corrida para ver se a Dinamarca consegue manter o seu domínio ou se a coroa desmoronará à medida que a pressão pública força a paz entre todas as partes."