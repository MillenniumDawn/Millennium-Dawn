 SER_serbian_armed_forces: "As Forças Armadas Sérvias"
 SER_serbian_armed_forces_desc: "O exército é fundamental para garantir a independência da Sérvia. Vamos dar a eles o máximo de poder possível para que possamos nos proteger."
 SER_army_reform: "Reforma Militar"
 SER_army_reform_desc: "O exército precisa ser reparado urgentemente se esperamos qualquer tipo de guerra. Como está agora, não estará pronto para defender ninguém."
 SER_army: "As Forças Armadas Sérvias"
 SER_army_desc: "As Forças Armadas Sérvias são o exército da Sérvia."
 SER_doctrine: "A Nova Doutrina Militar"
 SER_doctrine_desc: "Agora não precisamos manter um exército enorme para defender nosso país, vamos mudar nossa doutrina militar."
 SER_oborona: "A Lei de Defesa"
 SER_oborona_desc: "Our country will focus on defending its territories, not attacking its neighbors."
 SER_slujba: "Transição Para um Exército de Contrato"
 SER_slujba_desc: "Temos a intenção de transformar nosso exército em uma base contratual e nos afastarmos da prática do alistamento obrigatório."
 SER_goz_granitca: "Transferência da Proteção da Fronteira Estatal"
 SER_goz_granitca_desc: "A partir de agora, os poderes para proteger a fronteira serão transferidos para o Ministério do Interior."
 SER_univer: "Academia Militar"
 SER_univer_desc: "The Military Academy of the University of Defence is a college devoted to military education and career development located in Belgrade, Serbia. The academy forms part of the Serbian higher education system, offering accredited graduate and postgraduate curriculum. It contains an undergraduate military college as well as postgraduate studies."
 SER_avia: "Força Aérea Desatualizada"
 SER_avia_desc: "The Serbian Air Force and Air Defence, is the air force of Serbia and service branch of the Serbian Armed Forces. Its mission is to guard and protect the sovereignty of Serbian airspace, and jointly with the Serbian Army, to protect territorial integrity of the country."
 SER_new_air_lines: "Formar Novas Asas Aéreas"
 SER_new_air_lines_desc: "We are optimizing the number of air wings in our fleet for better coordination and manageability."
 SER_pereosnash: "Reequipamento"
 SER_pereosnash_desc: "Começaremos a reequipar nossa frota aérea com novos modelos de peças de reposição e equipamentos."
 SER_vpk: "Indústria de Defesa da Sérvia"
 SER_vpk_desc: "The military-industrial complex of Serbia is a set of scientific research, testing organizations and manufacturing enterprises in Serbia that carry out the development, production and armament of military and special equipment, ammunition for both the Serbian army and for export."
 SER_zastava: "Armas Zastava"
 SER_zastava_desc: "Zastava Arms is a Serbian manufacturer of firearms and artillery, based in Kragujevac, Serbia. In 1853, it was founded, and cast its first cannon. It is the leading producer of firearms in Serbia and is a large contributor to the local defense industry. Zastava Arms produces and exports a wide variety of products to over forty countries, including the Zastava M70, a Kalashnikov rifle."
 SER_uniform: "Mile Dragic"
 SER_uniform_desc: "It produces uniforms, military equipment, helmets and bulletproof vests."
 SER_rszo: "EDePro"
 SER_rszo_desc: "A EDePro é uma empresa sediada em Belgrado, Sérvia, que desenvolve soluções para foguetes sólidos, mísseis turbojato e produção de materiais energéticos."
 SER_avto: "Zastava TERVO"
 SER_avto_desc: "A Zastava TERVO, abreviação de 'Zastava Terenska Vozila', é uma empresa automobilística e de defesa sérvia, especializada na produção de veículos todo-o-terreno. Com sede em Kragujevac, foi formada com todos os ativos da Zastava Trucks, incluindo a maioria de seus funcionários."
 SER_pvo: "PPT Namenska"
 SER_pvo_desc: "PPT Namenska is a Serbian manufacturer of arms, mortars, grenade launchers, unmanned ground vehicle, hydraulics and pneumatics, airplane parts and some complex weapons system including modernized M-77 Oganj, PASARS-16, and LRSVM Morava in various stages of production. There is also a production for civil and industrial users."
 SER_droni: "PR-DC"
 SER_droni_desc: "PR-DC, a privately-owned Serbian company specialised in drones, exhibited a full range of products including loitering munitions, one of them nearly ready for the market while many others are still in the development stage."
 SER_export: "Yugoimport SDPR"
 SER_export_desc: "A Yugoimport SDPR é uma fabricante estatal sérvia de armamentos, bem como empresa intermediária para importação e exportação de equipamentos relacionados à defesa."
 SER_genshtab: "Estado-Maior Sérvio"
 SER_genshtab_desc: "The General Staff of the Serbian Armed Forces is the highest authority within the Serbian Armed Forces and a significant command entity with numerous organizational units under its direct command."
 SER_guard: "Guarda das Forças Armadas Sérvias"
 SER_guard_desc: "The Guard of the Serbian Armed Forces is an honour guard unit of the Serbian Armed Forces under the direct command of the General Staff. Besides ceremonial duties its main tasks include security and logistics missions."
 SER_kobra: "As \"Cobras\""
 SER_kobra_desc: "The Detachment of the Military Police for Special Operations \"Cobras\" is a military police unit of the Serbian Armed Forces directly subordinated to the General Staff. The unit is responsible for close protection, counter-terrorism and special operations."
 SER_training: "Comando de Treinamento"
 SER_training_desc: "Training Command is command responsible for training of the members of Serbian Armed Forces."
 SER_uchenia: "Exercícios Militares Conjuntos"
 SER_uchenia_desc: "Nosso exército precisa ganhar experiência de estados mais experientes. Começaremos a realizar exercícios abertos com representantes das principais potências."
 SER_mvd: "Ministério do Interior"
 SER_mvd_desc: "The Ministry of Internal Affairs of the Republic of Serbia or the Ministry of Interior, is a cabinet-level ministry in the Government of Serbia."
 SER_police: "Polícia da Sérvia"
 SER_police_desc: "The Police of Serbia , formally the Police of the Republic of Serbia , commonly abbreviated to Serbian Police , is the national civilian police force of Serbia. The Serbian Police is responsible for all local and national law enforcement. It is under the jurisdiction of the Ministry of Internal Affairs through its Police Directorate."
 SER_jandarmi: "Gendarmaria"
 SER_jandarmi_desc: "A Gendarmaria é a força nacional de gendarmaria da Sérvia, encarregada de tarefas de aplicação da lei de alto risco e especializadas. Está sob a autoridade da Direção de Polícia da Polícia Sérvia."
 SER_anti_terror: "Unidade Especial Anti-Terrorista"
 SER_anti_terror_desc: "A Unidade Especial Anti-Terrorista é uma unidade tática de elite da Polícia Sérvia."
 SER_kto: "Unidade Contra-Terrorista"
 SER_kto_desc: "A Unidade Contra-Terrorista era uma unidade tática policial da Polícia Sérvia"
 SER_zakup: "Compra de Armas Estrangeiras"
 SER_zakup_desc: "Vamos comprar armas para nossas unidades policiais"
 SER_military: "Exército Sérvio Reformado"
 SER_defence_doctrine: "A Lei de Defesa"
 SER_usa_exer: "Exercícios Com os EUA"
 SER_sov_exer: "Exercises With Russia"
 SER_anti_rom_doc: "Doutrina Militar Anti-Romena"
 SER_anti_bos_doc: "Doutrina Militar Anti-Bósnia"
 SER_anti_bul_doc: "Doutrina Militar Anti-Búlgara"
 SER_anti_cro_doc: "Doutrina Militar Anti-Croata"
 ser_exer_start: "§YExercícios§! estão sendo realizados no momento"
 prepare_change_doctrine: "Há uma oportunidade de §Ymudar§! a doutrina"
 SER_korba_TT: "Batalhão da polícia militar - §Y\"Cobra\"§! - será criado"
 SER_guard_TT: "Batalhão da §YGarda Sérvia§! será criado"
 SER_kto_unit: "Ministério do Interior Reformado"
 SER_exercises_category: "[SER.GetFlag]Exercícios Militares"
 SER_exercises_category_desc: "\n\n\n\n\n\n£SER_desctext_export_exer \n\n\n\n\n\n\n\n\n§YNosso exército§! precisa de uma constante experiência, pois estamos longe de §Rconflitos mundiais§!. Precisamos decidir com qual país realizaremos exercícios - [SOV.GetFlag]§YRússia§! ou [USA.GetFlag]§YEstados Unidos§!"
 SER_uchenia_with_sov: "§YConduct§! exercises with [SOV.GetFlag]§YRussia§!"
 SER_uchenia_with_usa: "§YRealizar§! exercícios com os [USA.GetFlag]§YEstados Unidos§!"
 SER_doctrine_category: "[SER.GetFlag]Doutrina Militar Sérvia"
 SER_doctrine_category_desc: "\n\n\n\n\n\n£SER_desctext_export_doctrine \n\n\n\n\n\n\n\n\n§YA doutrina militar§! é um reflexo da §Ypolítica externa§! do nosso [SER.GetFlag] país, de quem consideramos nossos §Rinimigos§! e quem consideramos nossos §Galiados§!. Você está pronto para §Ratacar§! qualquer um, ou vamos nos §Gdefender§! de §Rinimigos§! externos?"
 SER_de_fence_doctrines: "[SER.GetFlag]§YDoutrina de Defesa§!"
 SER_anti_rom_doctrines: "[ROM.GetFlag]§RDoutrina Militar Anti-Romena§!"
 SER_anti_bos_doctrines: "[BOS.GetFlag]§RDoutrina Militar Anti-Bósnia§!"
 SER_anti_bul_doctrines: "[BUL.GetFlag]§RDoutrina Militar Anti-Búlgara§!"
 SER_anti_cro_doctrines: "[CRO.GetFlag]§RDoutrina Militar Anti-Croata§!"
 ser_export.1.t: "A Sérvia Oferece-Nos Comprar Suas Armas"
 ser_export.1.d: "The [SER.GetFlag]Serbian government, through its Yugoimport SDPR, makes an offer to us to purchase certain types of weapons that they produce. Will we agree?"
 ser_export.1.a: "Comprar SPART"
 ser_export.1.b: "Comprar Tanques"
 ser_export.1.c: "Comprar Rifles"
 ser_export.1.e: "Não planejamos adquirir armas sérvias"
 ser_export.2.t: "Exportação de Armas"
 ser_export.2.d: "[FROM.GetFlag]Eles compraram nossos SPART"
