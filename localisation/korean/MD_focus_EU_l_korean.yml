 active_measure_name_tt: "현재 이사회에서 투표가 진행 중인 안건입니다."
 european_council_voting_members: "§G투표권 보유국§!"
 european_council_voting_members_tt: "유럽 정상회의에 제안된 신규 안건에 대해 표를 행사할 수 있는 현재 §C[EUU.GetFlag][EUU.GetName]§! 구성국들의 목록입니다."
 european_council_header_tt: "§C[EUU.GetFlag][EUU.GetName]§!의 법률 체계\n--------------\n현재 통과된 §C[EUU.GetFlag][EUU.GetName]§!의 법률 체계입니다.\n\n유럽연합 이사회는 통칭 이중 다수결이라 불리는 가중다수결(QMV) 방식으로 작동합니다. 이는 유럽연합(EU) §C회원국§! 중 55%와, 유럽연합(EU) 전체 인구의 65%를 대변하는 §C회원국§!들의 찬성을 필요로 합니다."
 active_agenda_header: "§Y현재 활성화된 의사일정§!"
 list_of_available_laws_header: "§H가능한 유럽연합(EU) 개혁안§!"
 system_of_eu_values_text: "§Y유럽의 가치§!"
 system_of_eu_values_tt: "유럽의 가치 체계:\n유럽연합(EU) 가치:\n위반 사안 - 위반 수준\n\n법의 지배:\n마비 상태의 부패 - 5\n치명적인 부패 - 4\n만연한 부패 - 3\n통제 불능의 부패 - 2\n구조적인 부패 - 1\n\n인간의 존엄성 및 자유 존중:\n유럽연합(EU) 회원국을 상대로 한 공격 전쟁 진행 중 - 10\n공산주의 정부 - 2\n반동주의 정부 - 2\n연정 내 공산주의자 포함 - 1\n연정 내 반동주의자 포함 - 1\n\n민주주의:\n선거 없음 - 5\n독재 - 5\n공산주의 독재 - 5\n파시스트 독재 - 5\n종속국 상태 - 4\n신제국주의 - 1\n\n여성 및 소수자 권리:\n여성의 군 복무 금지 - 1\n선거 봉쇄 조항 10% - 1\n\n구제금융 금지 조항:\n부채 채무불이행(디폴트) - 1\n구제금융 수령 - 1"
 total_mep_text: "총 유럽 의회 의원: [?global.MEP_Total|C0]"
 total_mep_tt: "유럽 의회 의원(MEP)의 총 정원입니다."
 eu_parliament_majority_text: "과반수: [?global.MEP_Majority|O0]"
 eu_parliament_majority_tt: "현재 의사일정 안건을 통과시키려면 [?global.MEP_Majority|O0]명의 지지가 필요합니다. 현재 우리 안건은 [?global.active_MEP_Support|G0]명의 유럽 의회 의원(MEP)으로부터 지지를 받고 있습니다."
 eu_parliament_supporting_text: "찬성: [?global.active_MEP_Support|G0]"
 eu_parliament_supporting_tt: "현재 진행 중인 안건을 지지하는 유럽 의회 의원(MEP)의 수입니다. 집권여당의 이념을 공유하는 의원들의 지지는 항상 확보하게 됩니다."
