 australia_uranium_deal_desc: "Whilst uranium flows from Australian docks, we can enjoy an uptick in our nuclear production and research capabilities. \n§W--------------§!\nThis national spirit will be §RRemoved§! if we are at war with Australia."
 australian_developmental_aid_ast_desc: "Under the bilateral Official Development Assistance (ODA), we receive education, energy and research funding from Australia in exchange for closer collaboration on humanitarian, terrorism and curriculum matters. \n§W--------------§!\nThis national spirit will be §RRemoved§! if we are at war with Australia."
