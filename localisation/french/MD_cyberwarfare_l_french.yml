 cyber_network_hardening_complete_tt: "Durcissement réseau achevé. L'infrastructure réseau critique a été renforcée et les vulnérabilités connues corrigées."
 cyber_counter_intrusion_complete_tt: "Balayage de contre-intrusion achevé. Tous les implants étrangers et charges persistantes détectés ont été retirés de nos réseaux."
 cyber_attribution_hunt_complete_tt: "Chasse à l'attribution achevée. Les analystes du renseignement ont conclu leur examen criminalistique de l'activité d'intrusion récente."
 cyber_gps_tracking_complete_tt: "Opération de brouillage GPS close. Notre équipe de signaux a conclu sa perturbation des systèmes de navigation satellitaire de la cible."
 cyber_economic_tracking_complete_tt: "Opération de perturbation économique close. Nos équipes cyber ont conclu leur campagne visant l'infrastructure financière de l'adversaire."
 cyber_propaganda_tracking_complete_tt: "Opération de propagande close. Nos unités d'information ont conclu leur campagne d'influence contre la population cible."
 cyber_infra_tracking_complete_tt: "Attaque d'infrastructure close. Nos opérateurs ont conclu leur assaut soutenu contre les infrastructures critiques de l'adversaire."
 cyber_crit_tracking_complete_tt: "Frappe critique close. Nos unités ont exécuté leur charge utile prioritaire contre les systèmes les plus vitaux de la cible."
 cyber_sigint_surveillance_tracking_complete_tt: "Opération de surveillance SIGINT close. Nos équipes d'interception ont conclu leur collecte de renseignement d'origine électromagnétique sur la cible."
 cyber_radar_spoofing_tracking_complete_tt: "Opération de leurrage radar close. Nos équipes de guerre électronique ont conclu la perturbation du réseau de surveillance aérienne de l'adversaire."
 cyber_election_interference_tracking_complete_tt: "Opération d'ingérence électorale close. Nos unités d'influence ont conclu leur campagne clandestine visant le processus électoral de l'adversaire."
 cyber_industrial_espionage_tracking_complete_tt: "Opération d'espionnage industriel close. Nos opérateurs ont extrait des données de recherche et développement ciblées chez l'adversaire."
 cyber_comms_intercept_tracking_complete_tt: "Opération d'interception des communications close. Nos équipes ont conclu leur pénétration soutenue des réseaux de commandement et de contrôle de l'adversaire."
 cyber_financial_system_attack_tracking_complete_tt: "Attaque du système financier close. Nos unités ont conclu leur opération visant les infrastructures bancaires et de paiement de l'adversaire."
 cyber_logistics_disruption_tracking_complete_tt: "Opération de perturbation logistique close. Nos opérateurs ont conclu leur campagne contre la chaîne d'approvisionnement et la distribution de l'adversaire."
 cyber_sleeper_network_tracking_complete_tt: "Implantation de réseau dormant close. Nos équipes ont implanté des outils d'accès persistant dans les réseaux de l'adversaire, pour activation ultérieure."
 cyber_deception_campaign_tracking_complete_tt: "Campagne de tromperie close. Nos opérateurs ont conclu leur opération sous fausse bannière destinée à induire en erreur les analystes du renseignement adverse."
 cyber_zero_day_strike_tracking_complete_tt: "Frappe zero-day close. Nos unités ont exécuté un exploit à fort impact contre une vulnérabilité non divulguée des systèmes critiques de l'adversaire."
 cyber_network_hardening_active: "Réseaux renforcés"
 cyber_network_hardening_active_desc: "Nos équipes de cybersécurité ont renforcé l'authentification, corrigé les vulnérabilités connues et isolé les canaux d'accès critiques. Les tentatives d'intrusion étrangères ont nettement moins de chances de réussir tant que ces défenses tiennent."
 cyber_counter_intrusion_active: "Balayage de contre-intrusion"
 cyber_counter_intrusion_active_desc: "Les analystes chassent activement la présence étrangère dans nos réseaux : journaux, processus anormaux, implants persistants. La conscience de la sécurité opérationnelle est accrue dans tous les systèmes gouvernementaux."
 cyber_attribution_hunt_active: "Chasse aux attributions en cours"
 cyber_attribution_hunt_active_desc: "Les équipes de forensique numérique reconstituent les chemins d'attaque et cataloguent les signatures de l'acteur responsable. Le renseignement recueilli aiguisera nos défenses et éclairera une réponse proportionnée."
 MD_cyber.201.t: "Infiltration purgée"
 MD_cyber.201.d: "Nos équipes de contre-intrusion ont achevé leur balayage. Outils d'accès étrangers, implants de surveillance et portes dérobées persistantes ont été identifiés et retirés. Nos réseaux sont propres."
 MD_cyber.201.a: "Bon travail. Restez vigilant."
 MD_cyber.202.t: "Balayage terminé : réseaux effacés"
 MD_cyber.202.d: "Nos équipes de contre-intrusion ont fini le balayage de tous les systèmes critiques. Aucun outil d'accès étranger ni implant de surveillance n'a été détecté. Nos réseaux semblent sûrs."
 MD_cyber.202.a: "Maintenir la veille."
 MD_cyber.1.t: "Opération réussie"
 MD_cyber.1.d: "Nos équipes cyber ont exécuté l'opération avec succès. Aucune trace n'a été laissée. La cible n'a aucune indication de notre implication."
 MD_cyber.1.a: "Excellent travail."
 MD_cyber.2.t: "Intrusion étrangère détectée"
 MD_cyber.2.d: "Nos équipes de sécurité ont identifié des signes d'intrusion cyber externe. Les attaquants ont masqué leur origine efficacement. Nous ne pouvons déterminer qui est responsable."
 MD_cyber.2.a: "Durcir nos défenses."
 MD_cyber.3.t: "Cyberattaque par [?disp_name_agressor.GetNameWithFlag] identifiée"
 MD_cyber.3.d: "Nos services de renseignement ont retracé une intrusion cyber récente de [?disp_name_agressor.GetNameWithFlag]. L'attaque était délibérée et ciblée. Nous avons déposé une protestation diplomatique formelle."
 MD_cyber.3.a: "Condamner l'agresseur."
 MD_cyber.4.t: "Opération interrompue"
 MD_cyber.4.d: "Nos équipes cyber n'ont pas pu établir de tête de pont fiable dans les systèmes de la cible. L'opération a été interrompue avant toute action. Une préparation supplémentaire est nécessaire."
 MD_cyber.4.a: "Regrouper et évaluer."
 MD_cyber.11.t: "Perturbation du signal GPS"
 MD_cyber.11.d: "Les unités militaires signalent des pannes généralisées des systèmes de navigation par satellite. Les commandants sur le terrain peinent à se coordonner. Une attaque externe de perturbation de signal est suspectée."
 MD_cyber.11.a: "Basculer sur la navigation de secours."
 MD_cyber.12.t: "Réseaux financiers compromis"
 MD_cyber.12.d: "Banques, bourses et processeurs de paiement signalent des pannes en cascade. La perturbation n'est pas accidentelle. Nos analystes pensent que des opérateurs étrangers ont visé nos infrastructures financières."
 MD_cyber.12.a: "Isoler et contenir les dégâts."
 MD_cyber.13.t: "Espace d’information infiltré"
 MD_cyber.13.d: "Les réseaux sociaux et d'information sont inondés de désinformation coordonnée. La confiance du public dans le gouvernement s'érode. Nos analystes y voient une opération d'influence étrangère."
 MD_cyber.13.a: "Commencez une campagne de contre-récit."
 MD_cyber.14.t: "Infrastructures critiques sous attaque"
 MD_cyber.14.d: "Centrales, nœuds de transport et de communication ont subi des pannes simultanées. Les ingénieurs rapportent des signes de sabotage délibéré via nos systèmes de contrôle. C'est une escalade majeure."
 MD_cyber.14.a: "Déclarer l'état d'urgence national."
 MD_cyber.15.t: "Cyberattaque catastrophique"
 MD_cyber.15.d: "Tous les systèmes critiques du pays ont été frappés simultanément : réseaux financiers, réseaux électriques, communications militaires et chaînes d'approvisionnement. L'ampleur et la précision de l'attaque sont sans précédent. La nation est paralysée."
 MD_cyber.15.a: "Mobiliser tout ce que nous avons."
 MD_cyber.16.t: "Communications compromises"
 MD_cyber.16.d: "Des opérateurs étrangers ont pénétré nos canaux de communication chiffrés. Des transmissions sensibles sont probablement surveillées par un acteur étatique hostile."
 MD_cyber.16.a: "Initiez un verrouillage des communications."
 MD_cyber.17.t: "Réseaux de radar perturbés"
 MD_cyber.17.d: "Nos réseaux radar de défense aérienne renvoient de fausses lectures. Des contacts fantômes submergent les opérateurs. Des aéronefs ennemis pourraient exploiter la confusion."
 MD_cyber.17.a: "Basculer sur les protocoles de détection de secours."
 MD_cyber.18.t: "Opération d'influence étrangère détectée"
 MD_cyber.18.d: "Des preuves ont émergé d'une campagne d'influence étrangère coordonnée visant notre paysage politique intérieur. La désinformation se répand sur les réseaux sociaux et creuse les divisions."
 MD_cyber.18.a: "Dénonçons les ingérences étrangères."
 MD_cyber.19.t: "Réseaux de recherche violés"
 MD_cyber.19.d: "Des données de recherche classifiées et des plans industriels ont été volés dans nos laboratoires nationaux et chez nos contractants de défense. L'ampleur du vol est encore évaluée."
 MD_cyber.19.a: "Auditer tous les systèmes classifiés."
 MD_cyber.110.t: "Réseaux de commandement infiltrés"
 MD_cyber.110.d: "Nos canaux de communication militaires et diplomatiques ont été pénétrés. Des opérateurs ennemis interceptent ordres et correspondance sensible en temps réel."
 MD_cyber.110.a: "Purger tous les canaux compromis."
 MD_cyber.111.t: "Systèmes de la banque centrale sous attaque"
 MD_cyber.111.d: "Notre banque centrale et notre infrastructure principale de compensation financière subissent un assaut cyber soutenu. Le traitement des transactions s'est arrêté et les marchés des changes se déstabilisent rapidement."
 MD_cyber.111.a: "Déclarez une urgence financière."
 MD_cyber.112.t: "Chaîne d'approvisionnement militaire perturbée"
 MD_cyber.112.d: "Le logiciel de commandement et de contrôle gérant notre logistique avancée s'est effondré dans plusieurs secteurs. Les unités au front signalent des pénuries alors que la perturbation se propage."
 MD_cyber.112.a: "Revenir aux procédures d'approvisionnement manuelles."
 MD_cyber.113.t: "Intrusion persistante détectée"
 MD_cyber.113.d: "Nos services de sécurité ont découvert des points d'accès dormants enfouis profondément dans l'infrastructure réseau critique. Les implants sont sophistiqués et actifs depuis un certain temps."
 MD_cyber.113.a: "Commencez un audit complet du réseau."
 MD_cyber.114.t: "Intelligence de commandement compromise"
 MD_cyber.114.d: "Nos services de renseignement ont identifié une campagne systématique de trafic de signaux fabriqué et de fausses communications. Nos commandants militaires ont peut-être agi sur des informations délibérément empoisonnées."
 MD_cyber.114.a: "Établir un groupe de travail sur la vérification des signaux."
 MD_cyber.115.t: "Grève du jour zéro"
 MD_cyber.115.d: "Une frappe cyber de précision dévastatrice a touché simultanément nos systèmes les plus critiques via des exploits jusqu'alors inconnus. Systèmes de contrôle industriels, infrastructures électriques et réseaux de défense ont tous été affectés."
 MD_cyber.115.a: "Activer les protocoles nationaux d'urgence cybernétique."
 cyber_propaganda_ops_malus: "Espace d’information infiltré"
 cyber_propaganda_ops_malus_desc: "Une campagne de désinformation étrangère coordonnée dégrade activement la confiance du public dans notre gouvernement et nos institutions, étouffant la production politique et minant la cohésion nationale."
 cyber_gps_jamming_malus: "Systèmes GPS perturbés"
 cyber_gps_jamming_malus_desc: "Des opérateurs cyber étrangers ont compromis notre infrastructure militaire de navigation par satellite, dégradant gravement la coordination des troupes et la conscience du champ de bataille."
 cyber_economic_disruption_malus: "Réseaux financiers compromis"
 cyber_economic_disruption_malus_desc: "Une campagne cyber étrangère soutenue dégrade nos systèmes bancaires, réseaux de paiement et production industrielle. La reprise prendra du temps."
 cyber_infrastructure_damage_malus: "Dommages aux infrastructures"
 cyber_infrastructure_damage_malus_desc: "Des attaquants cyber étrangers ont gravement endommagé nos infrastructures critiques, gênant logistique, construction et distribution."
 cyber_critical_strike_malus: "Cyberattaque catastrophique"
 cyber_critical_strike_malus_desc: "Un assaut cyber tous azimuts a paralysé simultanément notre base industrielle, nos communications et notre chaîne d'approvisionnement. La reprise sera longue et douloureuse."
 cyber_sigint_surveillance_malus: "Communications sous surveillance"
 cyber_sigint_surveillance_malus_desc: "Des opérateurs étrangers ont pénétré nos infrastructures de communication chiffrées. Les transmissions sensibles sont probablement surveillées, gênant l'action politique coordonnée."
 cyber_radar_spoofing_malus: "Réseau radar compromis"
 cyber_radar_spoofing_malus_desc: "Des opérateurs cyber étrangers injectent de fausses échos dans nos réseaux radar de défense aérienne, dégradant détection et interception."
 cyber_election_interference_malus: "Campagne d'influence étrangère active"
 cyber_election_interference_malus_desc: "Une campagne de désinformation étrangère coordonnée érode la confiance du public et creuse les divisions politiques intérieures."
 cyber_industrial_espionage_malus: "Réseaux de recherche violés"
 cyber_industrial_espionage_malus_desc: "Des données de recherche classifiées et des plans industriels ont été volés dans nos laboratoires nationaux et chez nos contractants de défense, retardant nos programmes de développement."
 cyber_comms_intercept_malus: "Réseaux de commandement compromis"
 cyber_comms_intercept_malus_desc: "Nos communications militaires et diplomatiques ont été pénétrées. La sécurité opérationnelle est dégradée et la coordination en souffre."
 cyber_financial_system_attack_malus: "Infrastructures financières sous attaque"
 cyber_financial_system_attack_malus_desc: "Un assaut soutenu contre notre banque centrale et nos infrastructures de paiement a provoqué des pannes en cascade dans l'économie."
 cyber_logistics_disruption_malus: "Chaîne d'approvisionnement militaire perturbée"
 cyber_logistics_disruption_malus_desc: "Le logiciel de commandement et de contrôle gérant notre logistique avancée a été compromis. Les unités au front subissent des pénuries."
 cyber_sleeper_network_malus: "Intrusion persistante du réseau"
 cyber_sleeper_network_malus_desc: "Des opérateurs étrangers ont enfoui des points d'accès dormants au cœur de nos réseaux critiques, maintenant un accès persistant de bas niveau aux systèmes sensibles."
 cyber_deception_campaign_malus: "Le renseignement du commandement empoisonné"
 cyber_deception_campaign_malus_desc: "Nos commandants ont agi sur un trafic de signaux fabriqué et de fausses communications. Coordination militaire et conscience situationnelle sont gravement dégradées."
 cyber_zero_day_strike_malus: "Grève du jour zéro"
 cyber_zero_day_strike_malus_desc: "Une frappe de précision dévastatrice utilisant des exploits zero-day classifiés a touché simultanément nos systèmes industriels et d'infrastructure les plus critiques."
 upgrade_establish_cyber_operations_division: "Division des cyberopérations"
 upgrade_establish_cyber_operations_division_desc: "Établir une division d'opérations cyber dédiée au sein de l'agence, fournissant la capacité fondatrice de guerre numérique de base. Cette division débloquera la capacité de mener des opérations de §Yguerre cyber§!."
 upgrade_offensive_cyber_operations: "Cyberguerre offensive"
 upgrade_offensive_cyber_operations_desc: "Élargir la division avec des boîtes à outils de menaces persistantes avancées et la recherche d'exploits zero-day, permettant des opérations plus sophistiquées."
 upgrade_cyber_warfare_operational_planning: "Cyber-commande à spectre complet"
 upgrade_cyber_warfare_operational_planning_desc: "Faire évoluer la division en un commandement cyber pleinement intégré, capable de coordonner des opérations multi-vecteurs complexes contre des cibles durcies."
 upgrade_defensive_cyber_operations: "Cyber-opérations défensives"
 upgrade_defensive_cyber_operations_desc: "Constituer une équipe défensive dédiée, spécialisée dans le durcissement de nos réseaux, la détection d'intrusions et l'obscurcissement de notre empreinte numérique."
 upgrade_cyber_elite: "Arsenal du jour zéro"
 upgrade_cyber_elite_desc: "Développer et stocker un arsenal classifié d'exploits zero-day d'élite capables de pénétrer même les systèmes les plus durcis au monde."
 cyber_offense_power_modifier: "Cyberguerre offensive"
 cyber_offense_power_modifier_desc: "La valeur qui détermine la puissance de nos opérations de cyberguerre offensive."
 cyber_defense_rating_modifier: "Cyberguerre défensive"
 cyber_capability_modifier: "Capacité de cyberguerre"
 cyber_attribution_bonus_modifier: "Bonus de cyber-attribution"
