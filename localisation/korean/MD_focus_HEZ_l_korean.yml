 international_hezbollah.1.t: "새로운 군대는, 당신의 헌신으로."
 international_hezbollah.1.d: "이 나라에서의 민병대 모집은 성공적이었습니다. 우리는 이 병사들을 국제 작전망에 연결할 것이며, 그들은 추가 지시를 받을 준비를 갖출 것입니다.\\"그리고 참으로 신의 당이야말로 승리할 자들이니라.\\""
 international_hezbollah.1.o1: "아주 좋아"
 international_hezbollah.2.t: "We have sold our weapons successfully!"
 international_hezbollah.2.d: "우리는 간접 고객들에게 무기를 성공적으로 판매했으며 그들이 약속한 물자를 받았습니다. 부디 그들이 언젠가 이 무기를 우리에게 유리하게 사용해 주기를 바랍니다.\n\\"그리고 참으로 신의 당이야말로 승리할 자들이니라.\\""
 international_hezbollah.2.o1: "아주 좋아"
 international_hezbollah.4.t: "We have attacked the Zionist base in the targeted country!"
 international_hezbollah.4.d: "전능하신 분의 뜻과 도우심으로, 우리는 선택한 국가의 시오니스트 기지를 공격하여 피해를 입혔습니다! 이제 그들은 우리의 힘과 강철 같은 의지를 두려워하게 될 것입니다! \n\\"그리고 참으로 신의 당이야말로 승리할 자들이니라.\\""
 international_hezbollah.4.o1: "아주 좋아"
 international_hezbollah.3.t: "Successful Propaganda campaign!"
 international_hezbollah.3.d: "다른 영향력 행사 작전과 더불어, 우리는 목표 국가에서의 연줄을 활용해 우리 대의를 위한 지지자들을 얻고 결집하는 캠페인도 시작하는 데 성공했습니다.\n\\"그리고 참으로 신의 당이야말로 승리할 자들이니라.\\""
