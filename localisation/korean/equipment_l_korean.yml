 util_vehicle_type_desc: "일반 차량보다 특정 임무를 더 효율적으로 수행하도록 설계된, 일반적으로 차량화된 다목적 차량입니다."
 util_vehicle_8: "다목적 차량 2035"
 util_vehicle_8_desc: "다목적 차량은 차량화 보병 부대가 전장으로 이동하는 수송 수단으로 사용하는 차량입니다. 초기 세대 모델인 지프와 트럭은 사실상 비장갑이며 민간용 차량과 달리 주로 더 튼튼하고 험지에서의 기동성이 더 높다는 점이 다릅니다. 후기 세대 모델에는 더 나은 장갑을 갖춘 험비형 차량과 승무원 방호가 한층 개선된 지뢰 방호 차량이 포함됩니다. 무장을 갖추는 경우에도 보통 기관총과 같은 경무장입니다."
 attack_helicopter_1: "공격 헬리콥터 1965"
 attack_helicopter_1_desc: "공격 헬리콥터는 공격용 무기를 장착한 군용 헬리콥터입니다. 주 무장은 속사 자동 화기(기관포와 기관총), 로켓 발사기, 정밀 유도 무기(미사일)입니다. 많은 공격 헬리콥터는 대공 미사일도 장착할 수 있으나 주로 자기 방어용으로 사용됩니다. 오늘날의 공격 헬리콥터는 기능 면에서 고정익 공격기와 유사하며, 보병, 장갑 차량, 건물 등 지상 표적을 공격하도록 특별히 설계되었습니다."
 attack_helicopter_2: "공격 헬리콥터 1985"
