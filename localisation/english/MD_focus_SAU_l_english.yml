 SAU_republic_provisional_government_7: "The Social Democrats"
 SAU_republic_provisional_government_7_desc: "Build the republic on the Saudi Social Democratic Party: a welfare state funded by oil revenue, strong labour rights, and a parliamentary order between the liberal centre and the Marxist left."
 SAU_republic_provisional_government_8: "The Popular Solidarity Movement"
 SAU_republic_provisional_government_8_desc: "Entrust the transition to the Popular Solidarity Movement, the non-aligned reformists of the civic protests. They promise clean government and broad participation without binding the republic to any rigid ideology."
