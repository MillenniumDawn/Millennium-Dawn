 ast_military_decisions: "Décisions militaires"
 ast_military_decisions_desc: "La Force de défense australienne sert à la protection de la nation et à la préservation de nos intérêts nationaux. Quelles que soient les améliorations ou les ajouts que nous fassions, ils restent au service de cet objectif."
