 POL_open_dofi_czed_TT: "§Y체코§!"
 POL_open_dofi_czed_delayed_TT: "우리는 체코와 좋은 시기도, 나쁜 시기도 겪었습니다. 폴란드군을 비롯한 병력이 참여한 1968년 체코슬로바키아 무력 개입은 우리가 한 일 중 최선이 아니었습니다. 국경 분쟁도 많았으나, 그들과 통합하는 것도 해볼 만한 일일지 모릅니다.\n\n§Y비셰그라드 그룹 §!§R공산화 이후 이용 가능한 국가 정신:§!\n£GFX_organization_gain_texticon §G사단 편제율:§! §Y+4%§!\n£GFX_army_morale_texticon §G사단 회복률:§! §Y+4%§!\n£GFX_dig_in_speed_texticon §G참호 구축 속도:§! §Y+6%§!\n£GFX_defence_texticon §G사단 방어력:§! §Y+6%§!\n§G협동:§! §Y+4%§!"
 POL_open_dofi_slod_TT: "§Y슬로바키아§!"
 POL_open_dofi_slod_delayed_TT: "슬로바키아는 오랫동안 체코와 연결되어 있었으나, 그렇다고 해서 그들이 다시 통합하기를 원한다는 뜻은 아닙니다. 그들의 현재 차이점을 우리에게 유리하게 이용할 것입니다.\n\n§Y비셰그라드 그룹 §!§R공산화 이후 이용 가능한 국가 정신:§!\n£GFX_organization_gain_texticon §G사단 편제율:§! §Y+4%§!\n£GFX_army_morale_texticon §G사단 회복률:§! §Y+4%§!\n£GFX_dig_in_speed_texticon §G참호 구축 속도:§! §Y+6%§!\n£GFX_defence_texticon §G사단 방어력:§! §Y+6%§!\n§G협동:§! §Y+4%§!"
 POL_open_dofi_hund_TT: "§Y헝가리§!"
 POL_open_dofi_hund_delayed_TT: "헝가리는 풍부한 역사를 지닌 자긍심 강한 나라이며, 특히 오스트리아-헝가리 시절이 흥미롭습니다. 그들을 설득하기는 쉽지 않겠지만 헝가리는 비셰그라드 그룹의 일원이므로 시도해 볼 만합니다.\n\n§Y비셰그라드 그룹 §!§R공산화 이후 이용 가능한 국가 정신:§!\n£GFX_organization_gain_texticon §G사단 편제율:§! §Y+4%§!\n£GFX_army_morale_texticon §G사단 회복률:§! §Y+4%§!\n£GFX_dig_in_speed_texticon §G참호 구축 속도:§! §Y+6%§!\n£GFX_defence_texticon §G사단 방어력:§! §Y+6%§!\n§G협동:§! §Y+4%§!"
 POL_open_dofi_romd_TT: "§Y루마니아§!"
 POL_open_dofi_romd_delayed_TT: "유고슬라비아는 현재 너무 분열되어 있습니다. 그 나라의 옛 영토를 하나하나 훑는 것은 의미가 없으므로, 루마니아에서 시작하는 동부 노선을 택할 것입니다. 이는 우리에게 흑해로의 접근로를 제공하고 우크라이나와의 동맹 국경을 넓혀 줄 것입니다... 어떤 침공을 계획하고 있다는 뜻은 아닙니다.\n\n§Y동부 발칸 §!§R공산화 이후 이용 가능한 국가 정신:§!\n§GHP:§! §Y+8%§!\n£GFX_terrain_penalty_texticon §G지형 페널티 감소:§! §Y+8%§!\n£GFX_specops_max_texticon §G특수부대 수용량 배수:§! §Y+8%§!\n£GFX_defence_texticon §G강대국에 대한 방어력:§! §Y+8%§!"
 POL_open_dofi_buld_TT: "§Y불가리아§!"
 POL_open_dofi_buld_delayed_TT: "불가리아는 발칸에서 우리의 우위를 높이는 데 유용할 것입니다. 그리고 그리스와 튀르키예로의 접근은 우리의 노력에 대한 추가 보상일 뿐입니다.\n\n§Y동부 발칸 §!§R공산화 이후 이용 가능한 국가 정신:§!\n§GHP:§! §Y+8%§!\n£GFX_terrain_penalty_texticon §G지형 페널티 감소:§! §Y+8%§!\n£GFX_specops_max_texticon §G특수부대 수용량 배수:§! §Y+8%§!\n£GFX_defence_texticon §G강대국에 대한 방어력:§! §Y+8%§!"
 POL_open_dofi_litd_TT: "§Y리투아니아§!"
 POL_open_dofi_litd_delayed_TT: "우리는 리투아니아와 위대한 과거를 공유하고 있습니다. 리투아니아인들에게 폴란드-리투아니아 연방을 상기시켜 줄 만합니다. 그 나라를 되살릴 계획은 없으나, 리투아니아를 우리 편으로 끌어들일 만큼 강력한 논거가 될지도 모릅니다. 라트비아와 에스토니아도 뒤따를 수 있습니다.\n\n§Y발트 §!§R공산화 이후 이용 가능한 국가 정신:§!\n£GFX_experience_neutral_texticon §G사단 경험치 획득:§! §Y+6%§!\n£GFX_attack_texticon §G공격:§! §Y+4%§!\n£GFX_recon_texticon §G정찰:§! §Y+6%§!\n§G포위 페널티:§! §Y-4%§!\n£GFX_air_superiority_texticon §G전투 시 제공권 보너스:§! §Y+4%§!"
 POL_open_dofi_latd_TT: "§Y라트비아§!"
 POL_open_dofi_latd_delayed_TT: "라트비아는 몇 년 동안 꽤 조용했습니다. 우리와 아주 우호적이지도, 지나치게 부정적이지도 않은 과거를 지녔으나, 리투아니아 하나만으로는 충분하지 않습니다. 발트 국가들의 힘은 그들의 단결에 있으며, 그렇기에 우리는 라트비아와 에스토니아에 손을 뻗어야 합니다.\n\n§Y발트 §!§R공산화 이후 이용 가능한 국가 정신:§!\n£GFX_experience_neutral_texticon §G사단 경험치 획득:§! §Y+6%§!\n£GFX_attack_texticon §G공격:§! §Y+4%§!\n£GFX_recon_texticon §G정찰:§! §Y+6%§!\n§G포위 페널티:§! §Y-4%§!\n£GFX_air_superiority_texticon §G전투 시 제공권 보너스:§! §Y+4%§!"
 POL_open_dofi_estd_TT: "§Y에스토니아§!"
 POL_open_dofi_estd_delayed_TT: "에스토니아는 라트비아 옆에 있는 또 하나의 리보니아 국가입니다. 리투아니아와의 옛 연합을 통해 우리는 그들과 좋은 과거를 공유하고 있습니다. 에스토니아를 우리 동맹에 끌어들이면 러시아와의 동부 전선을 완전히 확보할 수 있을 것입니다.\n\n§Y발트 §!§R공산화 이후 이용 가능한 국가 정신:§!\n£GFX_experience_neutral_texticon §G사단 경험치 획득:§! §Y+6%§!\n£GFX_attack_texticon §G공격:§! §Y+4%§!\n£GFX_recon_texticon §G정찰:§! §Y+6%§!\n§G포위 페널티:§! §Y-4%§!\n£GFX_air_superiority_texticon §G전투 시 제공권 보너스:§! §Y+4%§!"
 POL_open_dofi_find_TT: "§Y핀란드§!"
 POL_open_dofi_find_delayed_TT: "핀란드인들은 공산주의자들에 대해 좋은 기억이 없지만, 그들의 방어 교리는 NATO나 러시아와의 전쟁에서 우리에게 매우 유용할 수 있습니다. 그들을 매수하기는 쉽지 않으므로 외교 협상을 벌일 이유가 없습니다. 국내 정치와 무관하게 우리는 단호하고 공격적으로 행동해야 합니다.\n\n§Y스칸디나비아 §!§R공산화 이후 이용 가능한 국가 정신:§!\n£GFX_defence_texticon §G방어:§! §Y+8%§!\n£GFX_war_support_modifiericons_texticon §G전쟁 지지도:§! §Y+8%§!\n£GFX_temperature_cold_texticon §G혹한 적응 획득 계수:§! §Y+12%§!"
 POL_open_dofi_swed_TT: "§Y스웨덴§!"
 POL_open_dofi_swed_delayed_TT: "스웨덴인들은 과거 우리나라에 정말 심각한 문제를 일으켰으며, 대홍수 시기에 스웨덴군이 지나간 모든 마을을 파괴하고 불태웠습니다. 이제 그들이 전쟁 범죄의 대가를 치를 때입니다. 민주 정부는 스웨덴에 배상이라는 가혹한 조건을 부과하기엔 너무 무르지만, 우리 공산주의자들은 그들에게 관대하지 않을 것입니다.\n\n§Y스칸디나비아 §!§R공산화 이후 이용 가능한 국가 정신:§!\n£GFX_defence_texticon §G방어:§! §Y+8%§!\n£GFX_war_support_modifiericons_texticon §G전쟁 지지도:§! §Y+8%§!\n£GFX_temperature_cold_texticon §G혹한 적응 획득 계수:§! §Y+12%§!"
 POL_economic_greed_idea: "경제적 탐욕"
 poland.170.t: "폴란드, 잔여 전쟁 배상금 전액 지급 요구"
 poland.170.d: "제2차 세계 대전과 놀랍게도 공산주의 정권 시기의 피해에 대한 폴란드의 예상치 못한 배상 요구는 러시아 정부에 충격을 주었습니다. 수십 년이 지난 지금까지도 러시아는 입힌 피해를 전부 보상하지 않았으며, 이로 인해 새 폴란드 정부는 결국 더욱 공세적인 정책을 채택하게 되었습니다."
 poland.170.a: "이전에는 시간이 있었지만, 지금은 감당할 수 없다."
 poland.170.b: "내버려 두자."
 poland.171.t: "지불하지 않는 러시아"
 poland.171.d: "러시아 정부에 따르면, 이렇게 오랜 세월이 지난 뒤 폴란드가 제2차 세계 대전 및 폴란드 인민 공화국 배상을 요구하는 것은 부적절하며 시대에 뒤떨어진 일입니다. 현재 러시아는 자국의 이익과 폴란드에 대한 배상금을 동시에 충당할 자금이 충분하지 않습니다."
 poland.171.a: "그렇게 쉽게 포기하지 않겠다"
 poland.172.t: "러시아, 전쟁 배상금 지급"
 poland.172.d: "러시아 정부는 제2차 세계 대전과 공산주의 지배의 결과로 발생한 모든 미지급 배상금을 폴란드에 지급하기로 결정했습니다. 러시아 국민은 정부의 결정을 환영했으며, 이는 폴란드와 러시아 관계를 강화하는 또 하나의 진전이 되었습니다."
 poland.172.a: "이 문제가 끝나서 다행이다"
 POL_question_of_democratic: "민주주의 문제"
 POL_question_of_democratic_desc: "민주주의와 협력하는 것은 가능합니다. 어쨌든 사회민주주의는 새로운 것이 아닙니다. 우리의 안보를 보장해 줄 NATO와 좋은 관계를 유지하는 동시에 사회주의 이념을 실현할 것입니다."
 POL_mandatory_service: "의무 복무"
 POL_mandatory_service_desc: "과거에는 병역이 의무였습니다. 적어도 몇 년간은 그랬습니다. 젊은이들은 전쟁이 일어났을 때 어떻게 행동해야 하는지 알게 될 것이며, 더 중요하게는 자신들과 우리의 조국을 지킬 준비를 갖추게 될 것입니다."
 POL_economic_committee: "경제 위원회"
 POL_economic_committee_desc: "우리는 상황을 검토하고 경제를 규제하는 조치를 취하여, 경제가 세계주의자가 아닌 국가를 위해 작동하도록 해야 합니다."
 POL_social_committee: "사회 위원회"
 POL_social_committee_desc: "일부 개인의 사회생활은 규율되어야 하며, 우리는 서방의 퇴폐적인 의제로부터 우리 민족을 구해야 합니다."
 POL_create_internal_network: "내부 조직망 구축"
 POL_create_internal_network_desc: "요원과 정보원의 조직망은 우리의 입지를 확보하고 사회를 안정시키는 데 도움이 될 것입니다."
 POL_economic_committee_idea: "경제 위원회"
 POL_economic_committee_idea_desc: "경제 위원회는 산업 국유화를 감독하고 시장을 규제합니다."
 POL_internal_network_idea: "내부 망"
 POL_internal_network_idea_desc: "요원과 정보원으로 구성된 내부 망이 국가 이익을 지키고 있습니다."
 POL_better_oil_exploitation_idea2: "개선된 석유 개발"
 POL_improve_oil_exploitation: "석유 개발 개선"
 POL_improve_oil_exploitation_desc: "우리는 지하에 묻혀 있는 양에 비해 석유를 충분히 생산하지 못하고 있으며, 정유소는 우리를 안정시키기에 너무 적은 연료를 생산하고 있습니다."
 POL_calm_down_the_west_desc: "그래도 NATO를 자극하지 않는 편이 낫습니다. 신중하게 행동하며 느린 발전에 집중합시다."
 POL_refineries_in_Hungary: "헝가리 정유 시설"
 POL_refineries_in_Hungary_desc: "[HUN.GetName]에 자동차 공장을 건설했으므로, 이 지역에 안정적인 연료 공급도 보장해야 합니다. 새로운 정유 시설 덕분에 우리는 경제적 독립에 한 걸음 더 다가갈 것입니다."
 POL_beginning_of_the_economic_reform_idea: "경제 개혁의 시작"
 POL_sily_zbrojne_rzeczypospolitej_polskiej_shortcut: "군사"
 POL_free_trade_shortcut: "레흐 바웬사, ChDRP"
 POL_one_country_one_nation_one_leader_shortcut: "야누시 코르빈미키에, UPR"
 POL_proclaim_forth_rp_shortcut: "정치, PiS"
 POL_truly_eu_state_shortcut: "정치, PO"
 POL_change_of_path_shortcut: "대체 역사, 공산주의 및 민족주의"
 POL_cosmonauts_training_shortcut: "우주 개발 계획"
 POL_new_alliance: "새로운 동맹"
 POL_new_alliance_desc: "우리는 세계주의 강대국의 압력을 견뎌 내기 위해 동맹을 공식화하고 다져야 합니다."
 POL_permanent_friendship: "영구적 우호"
 POL_permanent_friendship_desc: "상황은 전반적으로 불안정합니다. 지금 개별 지역의 발전을 막는다면 우리의 단결을 영구적으로 유지할 수 있을 것입니다. 이것이 비셰그라드 그룹의 완전한 통합을 향한 마지막 단계입니다."
 POL_hungarian_unification: "헝가리 통합"
 POL_hungarian_unification_desc: "우리는 [HUN.GetName]을(를) 우리 구상에 초청할 수 있습니다. 그들의 승인이 있으면 마침내 비셰그라드 그룹을 통합할 수 있습니다."
 POL_permanent_friendship_TT: "§G비셰그라드 지지 균형§! 결정 범주를 제거하고 완료되지 않은 모든 비셰그라드 중점을 차단합니다."
 POL_extend_mig29_fleet: "MiG-29 편대 확장"
 POL_extend_mig29_fleet_desc: "러시아와의 좋은 관계를 이용해 더 많은 MiG-29 전투기를 확보할 수 있습니다. 이 기체들은 여전히 매우 효과적이며 우리에게 유리하게 활용할 수 있습니다."
 POL_intolerance_of_communism_idea_tt: "이 국가 정신이 활성화되어 있는 동안에는 §Y모든 공산당§!을 지원할 수 없습니다\n"
 POL_long_live_the_revolution_idea: "혁명 만세"
 POL_communist_mindset_idea: "공산주의적 사고방식"
 POL_invites_country_to_rep_flag: "다른 국가를 이미 초청하는 중임"
 POL_rail_baltica_offer_TT: "§Y레일 발티카는 리투아니아부터 시작하여 각 국가 내에서 개별적으로 건설되어야 합니다. 리투아니아가 받아들이면 다음은 라트비아, 마지막은 에스토니아입니다.§!"
 FACTION_MEMBERS_ABOVE_75_COMMUNISM: "신흥국 지지도가 75%를 초과하는 §Y세력 회원국§!"
 FACTION_MEMBERS_BELOW_30_DEMOCRACY: "민주주의 지지도가 30% 미만인 §Y세력 회원국§!"
 long_live_the_revolution: "혁명 만세"
 long_live_the_revolution_desc: "혁명의 확산은 불가피합니다. 다른 나라들도 우리만큼 공산주의를 사랑하게 만들어야 합니다."
 POL_advanced_production_of_artillery_idea: "첨단 포병 장비 생산"
 POL_the_fourth_power_idea_TT: "§Y이 국가 정신은 소셜 미디어 중점을 완료할 때마다 더 강해집니다§!"
 POL_c_130_hercules_TT: "§Y[USA.GetFlag]§G미국§!에 대한 관계가 충분하다면 연구 보너스 대신 C-130 허큘리스의 설계를 얻을 수 있습니다§!"
 POL_sre_tools_factories_title_text: "공작 기계"
 POL_sre_tools_factories_text: "[?POL.machine_tools_factories]"
 POL_sre_increase_tools_factory_text: "공작 기계 공장 추가"
 POL_sre_increase_tools_factory_text_delayed: "유휴 공장 1개가 공작 기계 생산에 배정됩니다."
 POL_sre_decrease_tools_factory_text: "공작 기계 공장 제거"
 POL_sre_decrease_tools_factory_text_delayed: "공장 1개가 공작 기계 생산을 중단하고 유휴 공장이 되어 새로운 임무에 배정될 수 있습니다."
 POL_sre_machinery_factories_title_text: "중장비"
 POL_sre_machinery_factories_text: "[?POL.heavy_machinery_factories]"
 POL_sre_increase_machinery_factory_text: "중장비 공장 추가"
 POL_sre_increase_machinery_factory_text_delayed: "유휴 공장 1개가 중장비 생산에 배정됩니다."
 POL_sre_decrease_machinery_factory_text: "중장비 공장 제거"
