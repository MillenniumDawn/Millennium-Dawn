 clean_energy_act_ast: "§GLoi sur l'énergie propre§!"
 fair_work_amendment_ast: "§2Amendement sur le travail équitable§!"
 gillard_won_election_ast: "Les élections sont terminées."
 new_eligibility_requirements_ast: "Nouvelles conditions d'éligibilité"
 half_percent_levy_ast: "§2Prélèvement d'un demi-pour cent§!"
 defense_cuts_ast: "Coupes dans la défense"
 plain_cigarette_packaging_idea_ast: "Emballage de cigarettes ordinaire"
 healthcare_cost_mandate_ast: "§2Mandat de l'État sur les coûts des soins de santé§!"
 media_misinformation_prevention_ast: "Amendement sur la prévention de la désinformation dans les médias"
 ast_ndis_idea: "Le régime national d'assurance invalidité"
 gonski_review_idea_ast: "Mise en œuvre de la revue Gonski"
 upgrade_the_eastern_goldfields_railway: "Moderniser le chemin de fer des Eastern Goldfields"
 construct_the_pilbara_line: "Construire la ligne du Pilbara"
 upgrade_the_trans_australian_railway: "Moderniser le Trans-Australian Railway"
 farm_automation_grants_ast: "Subventions pour l'automatisation agricole"
 hung_parliament_ast: "Parlement suspendu"
 hung_parliament_ast_desc: "For the first time since 1940, Australia is experiencing a hung parliament. None of the parties have enough seats to form government, and until we can negotiate the support necessary to bring our 72 seats to 76, we're effectively in a legislative gridlock."
 hung_parliament_ast_2: "Coalition rocheuse"
 hung_parliament_ast_2_desc: "We may have formed a government, but the coalition that exists is less than ideal. Stocked with unhappy party members and independent wildcards, any failure to pass policy could trigger an early end for our government in its infancy."
 diplomacy_tightrope_ast: "La corde raide diplomatique"
 diplomacy_tightrope_ast_desc: "Nous jonglons avec un équilibre complexe : une alliance de sécurité et de défense profonde avec les États-Unis, tout en poursuivant une interdépendance commerciale stabilisée avec la Chine. Éviter d'être forcés de choisir entre les deux, voilà comment nous restons à flot."
 non_permanent_unsc_member: "Membre non permanent du Conseil de sécurité de l'ONU"
 non_permanent_unsc_member_desc: "The United Nations Security Council elects 10 non-permanent members to join the Security Council for two-year terms. These nations are able to submit resolutions and preside over voting."
 gloves_off_diplomacy_ast: "Gants hors diplomatie"
 consuls_of_peace_idea_ast: "Consuls de la paix"
 the_australian_century_tt: "§YAccélère un certain nombre de propositions de nouvelles mines en attente d'approbation.§!"
 kevin_rudd_desc: "Asian geopolitical expert and TV regular, Kevin Rudd has found himself the new face of the Labor movement. A character capable of juggling the stability of Howard, with the promise of the reform the nation demands, Rudd has shown a knack for balancing party interests whilst remaining in the good graces of the public. \n\nThanks to the reforms of Gough Whitlam, Rudd was able to attend university and use his education to join the Department of Foreign affairs in 1981. Experience that he's used throughout his whole career. Since then he's shot up in the party, and as a member during the revolving door era of Labor, Rudd is no stranger to cutthroat politics. Yet his optimism has pushed him to build the party anew. \n\nAttempting to broaden its appeal and correct the factionalism that has kept it stagnant for decades, the man from Queensland now holds the helm. The position he's idolized since joining the party at 15, and one he intends to do justice."
 ast_let_debate_decide_tt: "§YLe Parlement débattra du projet de loi.§!"
 amended_sex_discrimination_act_ast: "§4Loi modifiée sur la discrimination sexuelle§!"
 rudd_given_support_ast: "Rudd a apporté son soutien."
 rudd_the_next_leader_tt: "L'option de se retirer deviendra disponible dans les §2décisions§! politiques"
 rudd_stepping_down: "Descendre"
 ast_the_new_bear_tt: "§YRudd tentera de convaincre les Russes§!"
 special_interest_regulation_ast: "Règlement sur les intérêts spéciaux"
 australia_uranium_deal: "Accord sur l’uranium en Australie"
 sas_training_ast: "Formation SAS"
 nhmrc_grants: "Subventions du NHMRC"
 nhmrc_grants_desc: "Le National Health and Medical Research Council est notre agence de recherche médicale de pointe. Nos normes de santé dépendent des recherches qu'ils peuvent livrer. Les doter de subventions à court terme pourrait donner des résultats prometteurs pour le secteur."
 encourage_electrical_vehicles_ast: "Encourager les véhicules électriques"
 encourage_electrical_vehicles_ast_desc: "Poser les bases d'une fabrication de véhicules hybrides et à plus faibles émissions est un travail essentiel si nous voulons que l'avenir que nous visons soit réaliste. Cela aidera aussi si nous voulons obtenir un rationnement du carburant à court terme."
 launch_worker_safety_courses_ast: "Lancer des cours sur la sécurité des travailleurs"
 launch_worker_safety_courses_ast_desc: "We've been working on a range of new training videos to be played for those undergoing their White Card course, making visual learning a mandatory part of the course, and hopefully encouraging young tradies to take less risks."
 collaborate_with_foodbanks: "Collaborer avec les banques alimentaires"
 collaborate_with_foodbanks_desc: "Collaborer avec des organisations comme SecondBite allégera nos coûts d'aide sociale et le fardeau des bénéficiaires."
 cattle_exports_suspended_ast: "Les exportations de bétail suspendues"
 howardgov_focus: "Le gouvernement Howard"
 gillardgov_focus: "Le gouvernement Gillard"
 decreased_bulk_billing_coverage_ast: "§2Diminution de la couverture de facturation groupée§!"
 ast_mend_the_rift_tt: "Kevin Rudd gagnera le trait §YPersonnalité populaire§!."
 enforced_no_fly_zone_ast: "Zone d'exclusion aérienne forcée"
 airforce_intervention_ast: "Intervention de l'armée de l'air"
 military_support_ast: "Nous a soutenu militairement"
 ruddgov_return_focus: "Le second gouvernement Rudd"
 the_new_labor: "Le nouveau Labor"
 australian_jobs_act: "§2La loi australienne sur l'emploi§!"
 julia_gilard_desc: "Militante née au pays de Galles et associée en droit, Gillard a gravi les échelons du gouvernement australien et est devenue la première femme à diriger le pays. \n \nD'abord socialiste de la faction de gauche de l'ALP victorien, Gillard s'est imposée en s'appuyant sur ses liens avec le monde des affaires, un atout forgé par des années comme avocate du travail. S'élevant dans un milieu traditionnellement masculin, et défiant les pronostics tout en restant célibataire et sans croyance religieuse, Gillard a officiellement brisé le statu quo du Parlement. \n\nQuelle que soit la direction qu'elle prenne, le parti la suit avec une inquiétude prudente, s'éloignant des certitudes traditionnelles. Le moindre faux pas pourrait briser la stabilité nouvellement acquise du parti et faire chuter Gillard avant même que son leadership n'ait commencé."
 ast_election_countdown_2: "Compte à rebours des élections"
 hold_a_debate_ast: "Tenir le débat"
 opposition_campaigning_ast: "La campagne de l'opposition"
 opposition_campaigning_ast_tt: "Les partis d'opposition font leurs mouvements..."
 campaigning_liberals_ast_tt: "Nous ferons campagne pour le §BParti libéral§!"
 campaigning_labor_ast_tt: "Nous ferons campagne pour le §tParti travailliste§!"
 campaigning_one_nation_ast_tt: "Nous ferons campagne pour §YOne Nation§!"
 campaigning_greens_ast_tt: "Nous ferons campagne pour les §GVerts§!"
 election_ongoing_ast: "Une élection est en cours"
 costello_focus: "Le gouvernement Costello"
 boat_arrivals_ast: "Arrivées des bateaux"
 boat_arrivals_ast_desc: "Le problème hante les gouvernements de notre nation depuis des décennies. Pour les immigrants qui veulent court-circuiter la file d'attente et arriver par passeurs maritimes ou équivalent, leur entrée, bien que juridiquement non autorisée, n'est techniquement pas une infraction pénale. De ce fait, le traitement de ces arrivées illégales est devenu une entreprise ardue et coûteuse, qui ne se résoudra pas facilement."
 detention_centre_emergency_funding_ast: "§2Financement d'urgence des centres de détention§!"
 gst_ast: "§2The Goods and Services Tax§!"
 five_eyes_technology_sharing_group_name: "Collaboration scientifique et technologique des Five Eyes"
 five_eyes_technology_sharing_group_desc: "Un partenariat de partage technologique entre l'Australie, le Canada, la Nouvelle-Zélande, le Royaume-Uni et les États-Unis, dédié à l'innovation en matière de défense et de sécurité."
 memories_of_howard: "Souvenirs de Howard"
 memories_of_howard_desc: "Il n'est pas mort, mais le souvenir du mandat de John Howard reste dans l'esprit de beaucoup. Invoquer le roi des battlers pourrait nous valoir un peu de bonne volonté chez les classes populaires, et le poids politique dont nous avons besoin au Parlement."
 nuclear_restrictions_lifted_ast: "Les restrictions nucléaires levées"
 paved_urban_roads: "Routes de liaison pavées"
 paved_urban_roads_desc: "Des routes à quelques minutes seulement de Darwin sont encore en graviers ou en terre. Pour soutenir les besoins de transport des entreprises, il faudra y remédier."
 channel_island_power_plant: "Centrale au gaz de Channel Island"
 channel_island_power_plant_desc: "Étendre l'installation pour y intégrer des turbines à gaz flexibles General Electric et Rolls-Royce complétera nos besoins accrus en électricité."
 uterne_solar_power_plant: "Centrale solaire d'Uterne"
 uterne_solar_power_plant_desc: "Prévue juste à l'extérieur d'Alice Springs et première de son genre, la centrale devrait tripler la capacité électrique de la région."
 expand_port_darwin: "Agrandir Port Darwin"
 expand_port_darwin_desc: "Si le nord doit devenir une métropole d'exportation, le port doit le refléter. Des milliers de tonnes de produits vont en partir, et l'infrastructure doit être prête."
 nt_airport_upgrades: "Surclassements à l'aéroport NT"
 nt_airport_upgrades_desc: "Un plan de modernisation des aéroports de Darwin et d'Alice Springs, avec de nouveaux entrepôts et des extensions de pistes."
 pastoral_lease_framework: "Cadre des baux pastoraux"
 pastoral_lease_framework_desc: "En contournant un certain nombre de restrictions sur les droits fonciers, des terres agricoles seront louées à des entreprises de la région souhaitant étendre leurs lots existants."
 ast_develop_the_northern_territory_tt: "Northern Territory development projects will become available in the §2decisions§! tab."
