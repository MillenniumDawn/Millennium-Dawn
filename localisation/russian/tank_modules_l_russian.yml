 land_module_drone_launcher_1: "Пусковая установка для дронов I"
 land_module_drone_launcher_1_desc: "Пусковые установки для беспилотников объединяют одноразовые беспилотные боеприпасы с автономным наведением, что обеспечивает более мощный ударный потенциал, чем традиционные пусковые установки. Их конструкции проще и дешевле в массовом производстве, что снижает общую стоимость сборки.\n\n§GПодсказка для разработчиков: Пусковые установки для дронов дешевле в производстве и наносят больший урон, но требуют больше ресурсов из-за сложной системы наведения и бортовой электроники.§!"
