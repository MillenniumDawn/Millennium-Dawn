l_korean:
 haakons_marriage_announced: "§YHaakon's Marriage Announced!§!"
 haakon_married: "§Y왕세자가 결혼했습니다!§!"
 norway.1.t: "오스타 열차 충돌 사고"
 norway.1.d: "[GetDateText], 외스테르달렌 지역의 오스타 철도 사고로 뢰로스선의 지역 열차가 트론헤임에서 오던 전국 열차와 충돌했습니다.\n\n19명이 사망했으며, 이는 [GetYear] 노르웨이 땅에서 발생한 최초의 대형 참사로 기록되었습니다. 승객 67명이 충돌에서 살아남았습니다.\n\n사고의 책임은 정부와 노르웨이 국유철도청에 있다는 비난을 받고 있습니다. 이들은 열차 운행 전에 철로가 실제로 비어 있는지 확인하는 요건을 완화했습니다."
 norway.1.o1: "전면 조사를 개시한다"
 norway.1.o2: "침묵을 지킨다"
 norway.2.t: "호콘 왕세자의 결혼"
 norway.2.d: "하랄 국왕이 의회에 후계자인 노르웨이 왕세자 호콘이 여자친구 메테마리트 셰셈 회이비와 결혼할 것이라고 발표했습니다.\n\n신붓감의 선택은 일부의 눈살을 찌푸리게 했습니다. 회이비는 평민일 뿐만 아니라 혼외로 낳은 어린 아들까지 있기 때문입니다. 물론 왕세자의 결혼에 대한 정부의 지지와 재정 지원은 확고합니다.\n\n과연 그럴까요?"
 norway.2.o1: "흥미롭군."
 norway.3.t: "메테마리트 셰셈 회이비와 결혼한 호콘"
 norway.3.d: "노르웨이 의회는 호콘 왕세자의 미래 아내 선택에 이의를 제기하지 않았습니다. 행복한 한 쌍은 2001년 8월 25일 성대한 의식에서 부부가 되었습니다. 왕실의 후손은 시간문제로 보입니다."
 norway.3.o1: "축하합니다!"
 norway.4.t: "석유 생산에 참여하는 노르웨이"
 norway.4.d: "영국 의회와의 협상 끝에, 노르웨이는 이제 영국 석유 생산 조약에 가입하게 되었으며, 이에 따라 노르웨이는 북해에서 석유를 생산할 수 있게 되었습니다."
 norway.4.o1: "이 검은 황금을 얻을 시간이다!"
 norway.5.t: "석유 투자 가능성을 제안하는 [NRY.GetName]"
 norway.5.d: "노르웨이 대표단이 우리 외교관들에게 접촉하여 자국 내 석유 거래 가능성을 제안하고 있습니다. 우리는 그들의 국가에 투자하여 석유 지분에서 더 나은 몫과 그들 국가에 대한 일정한 영향력을 얻을 수 있습니다."
 norway_focus: "노르웨이 국가 중점 트리"
 norway.5.a: "훌륭한 계획이군"
 norway.5.b: "안된다"
 norway.6.t: "투자에 동의한 [FROM.GetName]!"
 norway.6.d: "[FROM.GetName]의 대표단이 투자에 동의했으며, 그들의 국영 기업이 곧 노르웨이로 향할 것입니다."
 norway.6.a: "좋아"
 norway.7.t: "제안을 일축한 [FROM.GetName]"
 norway.7.d: "[FROM.GetName]의 대표단은 우리나라에 대한 투자에 관여하고 싶지 않다고 결정했습니다. 양국 모두에게 안타까운 손실입니다."
 norway.7.a: "안타깝군"
 norway.81.t: "원조 패키지를 제안하는 노르웨이"
 norway.81.d: "노르웨이 정부가 최근 우리 국민, 특히 지역 기업들에게 원조 패키지를 제공하겠다는 요청을 보내 왔습니다. 이러한 원조 패키지의 유입을 허용하면 노르웨이가 우리나라 내에서 상당한 영향력을 얻게 될 수 있습니다."
 norway.81.a: "보내도록 허용한다"
 norway.81.b: "안된다"
 norway.82.t: "팔레스타인 정부, 원조 제안 거절"
 norway.82.d: "팔레스타인 정부가 별다른 이유도 밝히지 않은 채 우리의 원조 제안을 거절했습니다."
 norway.82.a: "알겠다"
 norway.8.t: "팔레스타인 정부, 원조 패키지 승인"
 norway.8.d: "팔레스타인 정부가 최근 자국 기업들에 원조를 제공하겠다는 우리의 요청을 승인했습니다. 어떻게 진행하시겠습니까?"
 norway.8.a: "소규모 패키지"
 norway.8.b: "중규모 패키지"
 norway.8.c: "대규모 패키지"
 norway.91.t: "무기를 어디에서 구해야 하는가?"
 norway.91.d: "우리는 현재 무기를 조달할 적절한 국가를 물색하고 있으며, 지금으로서는 미국과 독일이 가장 유력한 후보입니다."
 norway.91.a: "독일에 요청한다"
 norway.91.b: "미국에 요청한다"
 norway.92.t: "독일 정부, 무기 판매 승인"
 norway.92.d: "독일 정부가 우리의 무기 요청을 승인했으며, 물량은 곧 도착할 것입니다."
 norway.92.a: "좋아"
 norway.92.b: "사실 비용이 너무 많이 듭니다..."
 norway.9.t: "미국 정부, 무기 판매 승인"
 norway.9.d: "미국 정부가 우리의 무기 요청을 승인했으며, 물량은 곧 도착할 것입니다."
 norway.9.a: "좋아"
 norway.9.b: "사실 비용이 너무 많이 듭니다..."
 norway.93.t: "[FROM.GetName], 무기 판매 거절"
 norway.93.d: "[FROM.GetName]은(는) 자국의 무기를 우리에게 판매할 의향이 없다고 밝혔습니다."
 norway.93.a: "젠장"
 norway.94.t: "노르웨이, 무기 구매를 희망"
 norway.94.d: "노르웨이 정부가 최근 군용 무기 판매와 관련하여 우리에게 접촉해 왔으며, 우리의 비축 물자를 손에 넣기 위해 거액을 지불할 용의가 있습니다."
 norway.94.a: "알겠다"
 norway.94.b: "안된다"
 norway.10.t: "노르웨이 정부, 회담 개최를 희망"
 norway.10.d: "노르웨이 정부는 긴장 상황에서 새로운 소통 수단을 마련하려는 우리 정부의 의향에 관심을 보이고 있으며, 특히 소통 수단이 단절되더라도 군사력으로 대응하지 않겠다는 합의에 서명하도록 우리를 압박하고 있습니다. 또한 양국 간 교역을 원활히 할 무역 협정 체결에도 관심이 있다고 밝혔습니다."
 norway.10.a: "못 할 이유가 없다"
 norway.10.b: "안된다"
 norway.11.t: "러시아 정부, 수락"
 norway.11.d: "러시아 정부는 앞서 열린 회담에서 우리 외교관들이 제시한 요구를 수락했습니다."
 norway.11.a: "좋아"
 norway.12.t: "러시아 정부, 거절"
 norway.12.d: "러시아 정부는 앞서 열린 회담에서 우리 외교관들이 제시한 요구를 거절했습니다."
 norway.12.a: "젠장"
 norway.14.t: "성소수자 문제"
 norway.14.d: "우리나라는 두 사람 간의 시민 결합에 대한 권리를 인정하지만, 동성 간의 혼인은 아직 완전히 합법화되지 않았습니다. 오늘 이 논쟁에 종지부를 찍을 수 있습니다."
 norway.14.a: "전면 합법화를 추진한다"
 norway.14.b: "현상을 유지한다"
 norway.16.t: "이민법"
 norway.16.d: "우리는 인구가 적다는 점과, 이 나라가 가장 어려웠던 시기에 이민자들이 나라를 일구었다는 점을 고려하여 비교적 쉽게 이민자를 받아들여 왔습니다. 그러나 오늘날 논쟁의 양상이 바뀌었으며, 우리는 결단을 내려야 합니다."
 norway.16.b: "모두를 환영한다"
 norway.16.a: "이제 규제를 마련할 때가 되었다"
 norway.100.t: "노르웨이, 북해 협력 확대를 희망"
 norway.100.d: "노르웨이 정부는 시장에 더 많은 자원이 공급되기를 기대하며 셰틀랜드에서 석유를 추가로 시추하는 데 관심을 보이고 있습니다."
 norway.100.a: "알겠다"
 norway.100.b: "안된다"
 norway.101.t: "영국 정부, 수락"
 norway.101.d: "영국 정부는 셰틀랜드와 북해의 다른 해역에서 석유를 추가로 시추하겠다는 우리의 요청을 수락했으며, 이는 경제 협력 확대로 이어질 것입니다."
 norway.101.a: "좋아"
 norway.102.t: "영국 정부, 거절"
 norway.102.d: "영국 정부는 셰틀랜드와 북해의 다른 해역에서 석유를 추가로 시추하겠다는 우리의 요청을 거절했으며, 이로써 경제 협력 확대에 대한 기대는 꺾였습니다."
 norway.102.a: "좋아"
 norway.103.t: "노르웨이, 우리나라에 인프라 건설을 희망"
 norway.103.d: "노르웨이는 스칸디나비아 전역의 이동과 경제 효율을 높이는 사업을 추진하기 위해 베이데케(Veidekke) 사와 계약했으며, 이 회사는 우리나라에 필요한 인프라를 건설하고자 합니다."
 norway.103.a: "알겠다"
 norway.103.b: "안된다"
 norway.104.t: "[FROM.GetName], 동참!"
 norway.104.d: "[FROM.GetName]의 파트너들이 우리가 베이데케와 계약한 사업을 위한 인프라 건설을 허용하기로 합의했습니다!"
 norway.104.a: "좋아"
 norway.105.t: "[FROM.GetName], 관심 없음!"
 norway.105.d: "[FROM.GetName]의 파트너들은 우리가 베이데케와 계약한 사업을 위한 인프라 건설을 허용하는 데 합의하지 않았습니다."
 norway.105.a: "유감이다"
 norway.106.t: "노르웨이, 우리 정치에 영향력 행사!"
 norway.106.d: "노르웨이 정부가 최근 우리 사회 전반에 영향력을 확산시키는 움직임을 보였습니다."
 norway.106.a: "알겠다"
 NRY_the_norwegian_economy: "노르웨이 경제"
 NRY_the_norwegian_economy_desc: "노르웨이 경제는 다양성과 자원 등을 갖춘 경제입니다. 우리는 새로운 천년으로 이끌어 노르웨이를 위대함의 길 위에 올려놓을 경제 방안을 모색해야 합니다."
 NRY_north_sea_oil: "북해 석유"
 NRY_north_sea_oil_desc: "비용이 많이 드는 우리의 정책을 유지하려면 이미 풍부한 석유와 가스 공급이 꾸준히 이어지도록 해야 합니다. 이 상황에서는 '시추하라, 베이비, 시추하라!'라고 말할 수밖에 없습니다."
 NRY_increased_cooperation_with_uk: "영국과의 협력 강화"
 NRY_increased_cooperation_with_uk_desc: "영국은 성장하는 소비주의 인구 덕분에 매우 유용한 무역 파트너가 될 수 있습니다. 우리는 그들을 크게 활용할 수 있고, 그들은 우호적인 유럽 이웃으로부터 천연자원을 공급받을 수 있습니다."
 NRY_investments_into_shetland: "셰틀랜드 투자"
 NRY_investments_into_shetland_desc: "신뢰의 투자는 영국과의 관계를 긴밀히 하여 무역을 개선할 것입니다. 우리 국고에 쌓인 잉여 유동성은 활용되어야 하지 않겠습니까?"
 NRY_statoil: "스타토일"
 NRY_statoil_desc: "석유 정제 부문의 지분을 더 사들이면 우리의 영향력 확대 능력이 향상되어 풍부한 석유 공급이 국민을 위해 쓰일 수 있습니다. 개념은 이렇습니다. 사고, 사고, 사고, 그다음 팔고, 팔고, 팔아라."
 NRY_encourage_union_workers: "조합 노동자 장려"
 NRY_encourage_union_workers_desc: "유럽 연합에는 성공도 있지만 결점도 있으며, 그래서 우리는 가입을 망설여 왔습니다. 유럽 연합의 고용 재배치 당국은 모든 조합 노동자의 일자리를 찾아 주느라 어려움을 겪고 있습니다. 그들이 일할 의지가 있다면 우리는 기꺼이 받아들일 것입니다!"
 NRY_european_investments: "유럽 투자"
 NRY_european_investments_desc: "우리 석유가 스스로 바다에서 솟아오르지는 않을 것이므로, 어쩌면 유럽 형제들이 채굴 비용을 덜어 줄 수 있을 것입니다. 우리의 석유 매장량은 풍부할지 몰라도, 시추 비용을 전적으로 우리 혼자 감당하려 하면 은행 예금이 줄어드는 것을 보게 될 수도 있습니다."
 NRY_sintef_research_org: "신테프(SINTEF)"
 NRY_sintef_research_org_desc: "SINTEF는 Stiftelsen for industriell og teknisk forskning, 영어로는 산업 및 기술 연구 재단(The Foundation for Industrial and Technical Research)의 약자입니다. 스칸디나비아 전체에서 가장 큰 연구 개발 기업이며 전 세계 곳곳에서 활동합니다. 현재 이 회사는 완전히 독립적이지만, '추천된' 무역 동맹국들과 더 긴밀히 협력하도록 유인책을 제공한다고 해서 누가 해를 입겠습니까?"
 NRY_ekofisk_oil_field: "에코피스크 유전"
 NRY_ekofisk_oil_field_desc: "석유 부문을 발전시키려면 가장 중요한 공급원인 에코피스크 유전을 고려해야 합니다. 이 매장지에는 아직 수백만 톤의 석유가 남아 있으며, 이곳의 채굴 집중도를 높이면 우리 국민이 수년간 먹고살 수 있을 것입니다. 환경 보호는 물론 나중으로 미루겠습니다."
 NRY_production_twenty_fifty: "생산 2050"
 NRY_production_twenty_fifty_desc: "당분간은 석유에 더욱 집중해야 할 듯합니다. 예를 들어 2050년까지는 어떻겠습니까?"
 NRY_renewable_investments: "재생 에너지 투자"
 NRY_renewable_investments_desc: "우리의 석유는 언젠가 바닥날 것이므로, 올바른 방향, 곧 녹색 방향으로 나아가기 시작해야 합니다."
 NRY_scan_wind: "스캔윈드"
 NRY_scan_wind_desc: "우리의 지리적 위치는 풍력을 최대한 활용할 수 있게 해 줍니다. 노르웨이에는 언제나 그랬듯 우리를 감싸 줄 산이 많으며, 이제는 전력의 힘까지 더해집니다!"
 NRY_statkraft: "스타트크라프트"
 NRY_statkraft_desc: "노르웨이에는 수력 발전을 확대할 기회가 많으며, 이는 우리가 자급자족하는 녹색 에너지 국가로 나아가는 데 필요한 한 걸음을 더해 줄 수 있습니다."
 NRY_electric_vehicle_incentives: "전기차 인센티브"
 NRY_electric_vehicle_incentives_desc: "많은 사람들이 노르웨이의 친환경적인 미래를 보지 못한 채 석유 연료 차량에서 전기 차량으로의 전환을 거부합니다. 어쩌면 약간의 돈이 우리 미래의 녹색을 보는 데 도움이 될지도 모릅니다."
 NRY_green_cities: "녹색 도시"
 NRY_green_cities_desc: "공공 및 민간의 많은 서비스를 전면 전기화하기 위해 도시 기반시설을 조정해야 합니다."
 NRY_charging_stations: "충전소"
 NRY_charging_stations_desc: "많은 이들이 전기차를 원하지 않는 이유 중 하나는 충전소가 부족하기 때문이며, 그들의 생각은 옳습니다. 모두가 이용할 수 있도록 더 많은 충전소를 확보하는 것이 우리의 임무이며, 그러면 더 이상 변명거리는 없을 것입니다."
 NRY_standardize_infrastructure: "기반시설 표준화"
 NRY_standardize_infrastructure_desc: "일부 건설업자는 다른 업자들보다 비효율적입니다. 정부 모델을 강제하면 건설 사업의 혼란을 줄일 수 있습니다."
 NRY_contract_veidekke: "베이데케와 계약"
 NRY_contract_veidekke_desc: "국제 고속도로 사업은 스칸디나비아 형제들을 하나로 묶는 데 꼭 필요한 일이며, 이는 모든 나라 사이의 무역과 우호 관계를 증진할 것입니다."
 NRY_gothenburg_cultural_center: "ZEB 플렉시블 랩"
 NRY_gothenburg_cultural_center_desc: "트론헤임의 ZEB 플렉시블 랩은 세계에서 가장 지속 가능한 건축물 중 하나이며, 총 이산화탄소 배출량을 에너지 생산으로 상쇄하는 기후 회계를 검증받은 세계 최초의 건물입니다."
 NRY_contract_bilfinger_se: "빌핑거 SE와 계약"
 NRY_contract_bilfinger_se_desc: "효율성을 말할 때 독일인만 한 이들이 없습니다. 빌핑거 SE가 우리에게 놀라운 사업 기회를 제안했습니다. 노르웨이는 번개 같은 속도로 발전할 것입니다!"
 NRY_gas_industry_renovation: "가스 산업 개보수"
 NRY_gas_industry_renovation_desc: "친환경 전환은 길고 힘든 과정이므로, 당분간 천연가스 산업을 확대해야 합니다. 또한 친환경으로 전환하고 나면 석유와 가스를 오로지 수출용으로만 쓸 수 있어 주머니에 돈을 챙길 수 있다는 점도 고려해야 합니다."
 NRY_ministry_of_transport_communication: "교통통신부"
 NRY_ministry_of_transport_communication_desc: "우리는 복지 국가이므로, 삶의 질을 높이기 위해 일부 기본적인 공공 필수 시설을 확충해야 합니다."
 NRY_avinor: "아비노르"
 NRY_avinor_desc: "우리가 지분 100%를 소유한 루프트파르츠베르케트(Luftfartsverket)의 자회사를 설립하면 항공망 확장의 효율성을 높일 수 있습니다. 그러면 그들의 모든 자산을 관리하여 국가적 규모의 우월한 계획을 반영할 수 있으며, 이는 국가의 최선의 이익에 부합함이 보장됩니다."
 NRY_oslo_airport_expansion: "오슬로 공항 확장"
 NRY_oslo_airport_expansion_desc: "인구와 관광객 흐름이 증가함에 따라 공항이 혼잡해지기 시작했으며, 곧 여행이 불편하고 어려워질 것입니다. 우리의 위대한 수도를 가능한 한 매력적이고 편안하게 만들어야 합니다."
 NRY_statens_vangsen: "도로청(Statens Vegvesen)"
 NRY_statens_vangsen_desc: "노르웨이는 큰 나라이고 주요 지점들이 상당히 흩어져 있습니다. 도로청에 대한 보조금을 늘리는 것은 국민에게 큰 봉사가 될 것입니다."
 NRY_facilities_for_norde_norge: "노르드노르게 시설"
 NRY_facilities_for_norde_norge_desc: "노르웨이 본토에서 가장 외진 지역이자 세계에서 가장 접근하기 어려운 곳 중 하나가 노르드노르게입니다. 이를 바꿔 보지 않겠습니까?"
 NRY_baneservice: "바네세르비스"
 NRY_baneservice_desc: "우리의 철도는 부족합니다. 더 많은 철도를 건설하는 계획은 소비재의 전국 이동을 돕고 우리 모두를 조금 더 가깝게 이어 줄 것입니다."
 NRY_innovations_in_dovre_line: "도브레선 혁신"
 NRY_innovations_in_dovre_line_desc: "도브레선은 끊임없이 개선되고 확장되어 왔으며, 이제 또 한 번의 개보수를 할 때입니다."
 NRY_migration_to_norway: "노르웨이로의 이주"
 NRY_migration_to_norway_desc: "우리의 환대하는 환경 덕분에 노르웨이는 망명을 구하는 난민들에게 매우 매력적입니다. 시간이 지나며 이는 문제가 되었고, 난민을 계속 받아들일지 이제 충분하다고 말할지를 두고 국민 여론이 크게 갈라져 있습니다. 어떤 선택이든 입장을 정해야 하며, 그것도 신속히 정해야 합니다."
 NRY_norge_ming: "노르게 광업"
 NRY_norge_ming_desc: "우리 경제에 두 번째로 크게 기여하는 부문은 광업이며, 앞으로도 당분간 지속될 것이므로 이 산업을 확대해야 합니다."
 NRY_deep_sea_expansion: "심해 확장"
 NRY_deep_sea_expansion_desc: "우리의 광대한 해양 수역에는 발견되지 않은 매장지가 더 있으며, 이를 찾아내어 공급량에 더하도록 노력해야 합니다."
 NRY_norsk_industri: "노르스크 인더스트리"
 NRY_norsk_industri_desc: "노르웨이 산업은 부족한 점이 있으며, 이를 바로잡도록 노력합시다."
 NRY_bergen_engines_domestic: "베르겐 엔진스 국내"
 NRY_bergen_engines_domestic_desc: "자동차 산업에 대한 대규모 투자는 우리를 자동차 제조국으로 탈바꿈시켜 경제에 필요한 다각화를 제공할 수 있습니다."
 NRY_bergen_engines_rolls_royce: "베르겐 엔진스 롤스로이스"
 NRY_bergen_engines_rolls_royce_desc: "우리는 자동차 산업을 수량만이 아니라 고급스러움과 품질로 발전시켜야 합니다. 독일인들과 협력하면 이 사업이 크게 번창할 것입니다."
 NRY_shipbuilding_investments: "조선 투자"
 NRY_shipbuilding_investments_desc: "노르웨이는 해안선이 약 10만 킬로미터에 달하는데, 이를 모두 허비한다면 안타까운 일이 아니겠습니까? 우리는 바다의 민족이며, 그 정신으로 돌아갑시다!"
 NRY_aker_yards: "아케르 야즈"
 NRY_aker_yards_desc: "우리 해양 산업의 최신 지부, 아케르 야즈를 소개합니다! 건조되는 모습을 보십시오! 달려가는 모습을 보십시오! 이것이 바로 잡았다 놓아주는 경제학입니다."
 NRY_fishing_ports_regulations: "어항 규제"
 NRY_fishing_ports_regulations_desc: "어업은 우리의 거대한 산업이자 노르웨이의 전통적인 여가이므로, 여기에 제한을 가하기는 어렵습니다. 그러나 환경은 더 이상 버틸 수 없기에 우리는 해결책을 마련했습니다. 우리의 감독 아래 대형 어업 회사들이 다수의 소규모 어업 회사를 통합하여 어업과 그 규제에 관한 혼란을 정리하고 중앙집중화할 것입니다."
 NRY_ministry_of_agriculture_and_food: "농림축산식품부"
 NRY_ministry_of_agriculture_and_food_desc: "여기서 개혁이 필요합니다. 농업과 식량을 감독하도록 우리가 선택한 어떤 바보가 너무 오랫동안 자신의 자리를 지켜왔기 때문입니다..."
 NRY_food_safety_regulations: "식품 안전 규제"
 NRY_food_safety_regulations_desc: "부처 개편이 성공하려면 이전에 매우 필요했던 식품 관련 정책 상당수를 시행해야 합니다."
 NRY_pesticide_distribution: "살충제 보급"
 NRY_pesticide_distribution_desc: "우리 기후에서 이런 일이 문제가 되리라고는 생각지 못했지만, 노르웨이는 곤충의 공격을 받고 있을지도 모릅니다."
 NRY_norwegian_armed_forces: "노르웨이군"
 NRY_norwegian_armed_forces_desc: "위대한 군대의 용맹함과 적응력은 밤낮으로 어떤 위험에도 맞서 방어할 준비가 되어 있습니다. 그들은 모든 조건에 맞게 훈련받았으며, 노르웨이 국민의 지속적인 평화와 자유를 지킨다는 자신들의 임무를 알고 있습니다."
 NRY_norwegian_navy_forces: "노르웨이 해군 전력"
 NRY_norwegian_navy_forces_desc: "우리 해군의 주된 목적은 우리 무역의 이익을 보호하는 것이며, 도전받는 일은 드물지만 그럼에도 우리가 권리를 가진 바다를 장악할 억지력은 여전히 필요합니다."
 NRY_haakonsvern_naval_base: "호콘스베른 해군 기지"
 NRY_haakonsvern_naval_base_desc: "노르웨이 함대의 주 기지인 호콘스베른은 더 이상 국민을 효과적으로 지킬 기준에 미치지 못하므로 대대적인 개보수가 필요합니다."
 NRY_fleet_logistics_command: "함대 군수 사령부"
 NRY_fleet_logistics_command_desc: "우리 해군이 지휘 하의 자원을 비효율적으로 사용해 왔다는 소식을 접했습니다. 이 문제는 철저히 조사될 것이며, 우리 함대에 낭비가 있어서는 안 됩니다."
 NRY_norwegian_naval_academy: "노르웨이 해군사관학교"
 NRY_norwegian_naval_academy_desc: "노르웨이의 최전방 방어를 이끄는 자리에 무능한 자가 있어서는 안 된다는 것은 명백합니다."
 NRY_norwegian_land_forces: "노르웨이 육군 전력"
 NRY_norwegian_land_forces_desc: "노르웨이 육군은 노르웨이 군대의 지상전 군종입니다. 육군 지상군은 노르웨이 군종 중 가장 오래되었으며, 노르웨이 국왕의 지휘 아래 근대적 군사 조직으로 창설되었습니다."
 NRY_quality_over_quantity: "양보다 질"
 NRY_quality_over_quantity_desc: "우리는 언제나 군더더기 없는 생산 정신으로 알려져 왔습니다. 모든 작업은 정성을 다해 수행되며, 노르웨이에 허술함이 설 자리는 없습니다!"
 NRY_quantity_over_quality: "질보다 양"
 NRY_quantity_over_quality_desc: "품질의 힘을 완전히 무시하려는 것은 아니지만, 세세한 부분까지 모든 것이 완벽해야 할 필요는 없습니다. 충분히 괜찮다면 그냥 찍어내십시오. 우리 생산성이 강박증 때문에 저해되어서는 안 됩니다."
 NRY_norwegian_military_academy: "노르웨이 육군사관학교"
 NRY_norwegian_military_academy_desc: "가장 뛰어난 전투 전략가와 지정학 사상가들이 우리 사관학교에 다닙니다. 우리가 군 교육 기관을 소중히 여기기에 내각에서 전략 지향적인 천재적 두뇌의 혜택을 누리고 있다고 느낍니다."
 NRY_norwegian_air_forces: "노르웨이 공군"
 NRY_norwegian_air_forces_desc: "공군은 노르웨이의 최전방 방어에서 해군만큼 필요합니다. 우리 지형은 매우 험준하여, 전투가 벌어진다면 노르웨이는 하늘에서의 전장이 될 수 있습니다. 가장 유용하게는, 원한다면 우리 공군을 전 세계에서 평화 유지군으로 활용할 수 있습니다."
 NRY_orland_main_air_station: "외를란 주 공군기지"
 NRY_orland_main_air_station_desc: "외를란 주 공군기지는 노르웨이 최대의 비행장으로, 우리 항공기 대부분이 배치되어 있으며 노르웨이 대부분을 편리하게 커버하는 전략적 위치에 있습니다."
 NRY_technical_advice_from_our_friends: "우방의 기술 자문"
 NRY_technical_advice_from_our_friends_desc: "우리 공군은 훌륭하지만 뛰어나지는 않습니다. 동맹국의 기술 공유가 이를 달성하는 데 도움이 될 것입니다."
 NRY_norwegian_airforce_academy: "노르웨이 공군사관학교"
 NRY_norwegian_airforce_academy_desc: "평화로운 국가인 우리는 직접 겪는 분쟁이 많지 않으며, 덕분에 유럽의 뛰어난 전략가이자 군사 사상가가 될 수 있습니다."
 NRY_cyber_defense_force: "사이버 방위군"
 NRY_cyber_defense_force_desc: "세계가 끊임없이 디지털화되고 있으므로, 우리 역시 기술 친화적인 미래로 나아가야 합니다. 안타깝게도 모두의 의도가 선하지는 않으며, 노르웨이의 네트워크 안전을 지켜볼 팀이 필요합니다."
 NRY_german_technicians: "전차 투자"
 NRY_german_technicians_desc: "우리 전차는 최근 부족했으며, 어쩌면 이를 조사하여 어떻게 개선할 수 있을지 알아낼 수 있을 것입니다."
 NRY_party_of_labour: "노동당(Arbeiderpartiet)"
 NRY_party_of_labour_desc: "공산주의자로 오해해서는 안 되는 노동당은 노동자들의 목소리이자 우리 국민을 위한 해법입니다. 우리는 작동하는 사회민주주의의 모범 사례이며, 창당 이래 그 덕분에 가장 인기 있는 정당 중 하나였습니다. 우리는 사회민주주의가 정부가 진정으로 그래야 하듯 국민을 돕고 보호하는 공정하고 정의로운 체제임을 세계에 보여줄 수 있습니다. 전진하라, 안정과 기회와 공동체를 위하여(trygghet, muligheter, og fellesskap)!"
 NRY_modernization_of_the_welfare_state: "복지 국가 현대화"
 NRY_modernization_of_the_welfare_state_desc: "우리의 막대한 부는 도움이 필요한 수천 명의 노르웨이인을 지원할 수 있게 해 줍니다. 우리의 복지 안전망은 광범위하지만, 아직 개선의 여지가 있습니다."
 NRY_workers_youth_league: "노동자청년동맹"
 NRY_workers_youth_league_desc: "사회주의 국가를 가지려면 아이들이 사회주의 교육을 받아야 합니다. 그들은 그런 사회에서 어떻게 기능하는지 배우고, 신선하고 훌륭한 두뇌로 우리나라의 생산성과 복지에 기여할 것입니다."
 NRY_privitization_of_state_industries: "국영 산업 민영화"
 NRY_privitization_of_state_industries_desc: "정부 통제가 필수적이지 않은 기업은 국민에게 돌려주어야 합니다. 그렇게 하면 국민은 재정적 자유를 느끼고, 우리는 경제에 대한 꼭 필요한 통제만 유지할 수 있습니다."
 NRY_forest_conservation_plans: "산림 보존 계획"
 NRY_forest_conservation_plans_desc: "아름다운 자연은 노르웨이에서 가장 신성한 것이며, 우리는 그것이 결코 훼손되지 않도록 항상 확실히 해야 합니다."
 NRY_solar_investments: "태양광 투자"
 NRY_solar_investments_desc: "미래의 길은 석유와 가스가 아닙니다. 미래는 자연, 태양, 바람, 흐르는 강에서 옵니다. 우리는 햇빛을 제외한 이 모든 분야에서 풍부하지만, 오염을 일으키는 에너지에서 벗어나 더 밝은 미래를 향해 노력해야 합니다."
 NRY_vaccinations_against_poverty: "빈곤에 대한 예방 접종"
 NRY_vaccinations_against_poverty_desc: "국민의 예산을 늘리면 틀림없이 그들이 자립할 수 있게 도울 것입니다."
 NRY_transatlantic_cooperation: "대서양 횡단 협력"
 NRY_transatlantic_cooperation_desc: "우리가 서방과 완전히 우호적임을 우방에게 확신시켜야 하며, 그러면 우리에 대한 어떤 적대감도 해소될 것입니다."
 NRY_intensify_cooperation_with_partners: "파트너와의 협력 강화"
 NRY_intensify_cooperation_with_partners_desc: "일부 훈련은 우리의 가장 가까운 우방이 노르웨이 같은 훌륭한 사회민주주의 국가의 장점을 알아보는 데 도움이 될 것입니다."
 NRY_modernization_quota: "현대화 할당량"
 NRY_modernization_quota_desc: "우리의 군사 기술은 구식이며, 어쩌면 동맹국들이 우수한 장비를 보내 줄 수 있을 것입니다."
 NRY_weight_behind_gaza: "가자 지지"
 NRY_weight_behind_gaza_desc: "최근 몇 년간 이스라엘은 팔레스타인인에 대한 잔혹함을 분명히 드러냈으며, 이는 그들이 자신들의 억압자들만큼 나빠지고 있음을 보여줍니다. 우리는 팔레스타인의 형제들과 함께합니다!"
 NRY_packages_of_aid: "원조 패키지"
 NRY_packages_of_aid_desc: "이스라엘이 가련한 팔레스타인인들과 그 주변의 전쟁에 시달리는 국가들에 끼친 영향은 해로웠습니다. 우리는 노르웨이의 성공을 활용하여 이들 국가에 긍정적인 영향을 미치고 그들의 부담을 덜어줄 수 있습니다."
 NRY_constructive_dialogue_with_russia: "러시아와의 건설적 대화"
 NRY_constructive_dialogue_with_russia_desc: "소련 붕괴 이후 러시아와 서방 세계 사이의 긴장이 고조되고 있습니다. 이는 우리나라의 미래에 혼란만을 가져올 것이며, 평화와 우호를 위한 대화가 이러한 긴장을 되돌리고 더 안전한 세계를 확보하는 데 도움이 될 수 있습니다."
 NRY_the_political_earthquake: "정치적 지진"
 NRY_the_political_earthquake_desc: "노르웨이 정치에서 소수 세력에 가까웠던 우리는, 집권 정부가 우리의 이상적인 정책을 따르도록 압박하는 데에만 영향력을 사용해 왔습니다. 이제 우리가 정부의 다수가 되었으니, 우리 의제의 진전은 놀라울 것입니다!"
 NRY_christan_peoples_party: "기독인민당(Kristelig Folkeparti)"
 NRY_christan_peoples_party_desc: "기독인민당을 부흥시키고 기독교적 가치를 지속적으로 심어 줄 때입니다. 노르웨이 국민은 노르웨이의 가치와 전통을 잊어 가고 있으며, 지금 이를 지키지 않으면 우리 당과 우리가 대변하는 모든 것의 쇠퇴를 보게 될 것입니다."
 NRY_question_of_homosexuality: "동성애 문제"
 NRY_question_of_homosexuality_desc: "우리 당은 이 문제를 두고 꽤 오랫동안 분열되어 왔으며, 이미 합법화되었음에도 당내에서 결정을 내릴 때가 되었습니다. 찬성입니까, 반대입니까?"
 NRY_abortion_matter: "낙태 문제"
 NRY_abortion_matter_desc: "기독인민당은 일반적으로 낙태에 반대하지만, 강간과 산모의 생명이 걸린 경우의 예외는 강력히 찬성합니다."
 NRY_contraception_support: "피임 지원"
 NRY_contraception_support_desc: "우리 당은 낙태율을 낮추기 위해 수정만을 막고 잠재적 아기에게는 해를 끼치지 않는 피임법의 사용을 지지합니다."
 NRY_developmental_aid: "개발 원조"
 NRY_developmental_aid_desc: "사회주의 정책이 모두 나쁜 것은 아니며, 우리 당 내 자유주의 세력은 개발 사업에 대한 정부 원조가 장차 주택 거품을 막고 성장하는 부동산 산업을 부양할 것이라고 제안합니다."
 NRY_poverty_and_climate_change_reduction: "빈곤 및 기후 변화 감축"
 NRY_poverty_and_climate_change_reduction_desc: "우리는 오염 감축에 크게 기여했고 부 지수에서 최상위 국가 중 하나로 꼽히지만, 전 세계의 우방들에 대해서는 같은 말을 할 수 없습니다. 특히 남아메리카는 이 문제를 해결할 수 있을 때까지 지속 가능한 수준으로 산업화하는 데 집중하느라 신경 쓰지 못하고 있어 어려움을 겪고 있습니다. 당분간 우리가 할 수 있는 한 그들을 도와야 합니다."
 NRY_security_advancements: "안보 증진"
 NRY_security_advancements_desc: "위험한 세계에서는 위험에 대비하는 것이 필수적이며, 물론 우리 석유에 대한 위험을 말하는 것입니다."
 NRY_for_minorities: "소수자를 위하여"
 NRY_for_minorities_desc: "노르웨이는 전반적으로 진보적인 국가이며 보수적 극단주의 요소가 거의 없고, 그들 중 누구도 국민의 도덕성에 영향력을 행사하지 못합니다. 소수자에 대한 재정 지원을 늘리면 그들을 두 팔 벌려 환영하는 시민들의 마음과, 인정받게 되는 소수자들 자신의 마음을 얻을 것입니다."
 NRY_refugee_quota: "난민 할당"
 NRY_refugee_quota_desc: "안타깝게도 다른 정부들은 우리처럼 이상적이지 않으며 많은 사람들이 집을 떠나도록 강요받고 있습니다. 우리는 이 사람들을 구하기 위해 국제 무대에서 힘을 보태야 합니다. 평화를 사랑하는 모든 분들은 언제나 노르웨이에 환영받습니다!"
 NRY_relieve_pressure_from_greece: "그리스의 부담 완화"
 NRY_relieve_pressure_from_greece_desc: "그리스는 난민 수용에서 제 몫보다 훨씬 많은 일을 해 왔으며, 간신히 버티고 있는 듯하고 난민들을 수용할 수 없을 뿐 아니라 더 받을 수도 없습니다. 우리는 노르웨이에 그들을 위한 집이 있으며, 유럽 이웃에게 도움의 손길을 내밉시다."
 NRY_fair_refugee_distribution: "공정한 난민 분배"
 NRY_fair_refugee_distribution_desc: "노르웨이에서는 능력이 있는 모두가 일해야 하며, 이는 우리가 기꺼이 받아들이는 난민들도 포함됩니다. 이들을 노동자가 필요한 공장 인근 주거지에 분배함으로써 국가 산업 생산량을 최적화할 수 있습니다."
 NRY_our_european_allies: "우리의 유럽 동맹국"
 NRY_our_european_allies_desc: "세계가 우리의 입장을 알도록 북대서양 조약 기구의 우방들에게 우호 선언을 합시다."
 NRY_nato_drilling: "나토 교리"
 NRY_nato_drilling_desc: "우리가 쓸 수 있는 나토의 모범 병력 훈련과 군사 학술 연구를 활용하여 노르웨이 군을 개선해야 합니다."
 NRY_eea_free_zones: "유럽경제지역 자유 구역"
 NRY_eea_free_zones_desc: "경제 성장을 촉진하기 위해 북유럽 국가들 사이의 경제적 거리를 줄이고 국가 간 협력을 늘려야 합니다."
 NRY_tighten_arms_sales: "무기 판매 강화"
 NRY_tighten_arms_sales_desc: "우리 보병을 위한 무기를 더 확보해야 합니다. 현재로서는 별로 쓸모가 없습니다."
 NRY_maintain_eu_distance: "EU와의 거리 유지"
 NRY_maintain_eu_distance_desc: "우리는 유럽 연합의 우방들에게 평화를 기원하지만 그 결함도 보고 있으므로 가까운 시일 내에 가입하지는 않을 것입니다. 그래도 그들에게 행운을 빕니다!"
 NRY_party_of_progress: "진보당(Fremskrittspartiet)"
 NRY_party_of_progress_desc: "진보당의 목표는 더 통합된 통치 수단으로 국민을 앞으로 나아가게 하는 것입니다. 우리는 국민이 무엇을 원하는지 알고 있으며, 그것은 기본적인 필수품과 자유입니다. 우리는 해낼 수 있습니다."
 NRY_shortened_wait_times: "병원 대기 시간 단축"
 NRY_shortened_wait_times_desc: "무상 의료가 있고 모든 사람이 이용할 수 있는 나라에서 모두가 대기줄에 서 있는 듯합니다! 더 많은 병원 건설을 추진하는 것이 절대적으로 필수적입니다. 우리 국민은 로비에서 피를 흘리며 자신의 번호가 불리기를 기다릴 수 없습니다!"
 NRY_nursing_capacity: "간호 역량"
 NRY_nursing_capacity_desc: "노르웨이 국민을 돌볼 간호사가 더 필요하며, 어쩌면 토지 인센티브가 효과가 있을지도 모릅니다."
 NRY_removal_of_inheritence_tax: "상속세 폐지"
 NRY_removal_of_inheritence_tax_desc: "상속세는 노르웨이 법제에서 가장 역겨운 법 중 하나이며, 우리는 더 이상 이를 용납하지 않을 것입니다. 국민의 돈은 국민의 것입니다!"
 NRY_elderly_focus: "노인 중시"
 NRY_elderly_focus_desc: "최근 몇 년간 우리 국민의 노인들은 입법 결정에서 소외되어 왔으며 이는 정말 부끄러운 일입니다. 우리나라를 위해 가장 많은 일을 한 노인들을 보호해야 하지 않겠습니까?"
 NRY_free_fundemental_society: "자유로운 기본 사회"
 NRY_free_fundemental_society_desc: "관료와 정부가 평범한 시민의 삶을 가로막는 일이 너무 잦습니다. 정부는 국민을 보호하기 위해 만들어졌으며, 제한되어야 할 것은 국민이 아니라 정부입니다."
 NRY_youth_discipline: "청년 규율"
 NRY_youth_discipline_desc: "우리는 청년들을 고무하여 국가의 번영을 위해 동원할 수 있습니다. 노르웨이를 위하여!"
 NRY_equal_action: "평등한 행동"
 NRY_equal_action_desc: "국민의 진보를 위한 우리의 의제를 방해하는 덜 바람직한 다른 정당들을 무시할 수 있습니다."
 NRY_law_and_order: "법과 질서"
 NRY_law_and_order_desc: "노르웨이는 법의 나라입니다. 법을 어기지 않는다면 경찰의 존재에 반대할 이유가 없지 않겠습니까?"
 NRY_immigration_control: "이민 통제"
 NRY_immigration_control_desc: "우리는 이미 충분히 많은 난민과 이민자를 받았으며 속도를 늦출 때입니다. 그들이 이주하는 속도만큼 빨리 건설할 수 있다면, 분명 멈출 때입니다."
 NRY_avoid_illiterates: "문맹자 기피"
 NRY_avoid_illiterates_desc: "문맹자들을 사회에서 소외시키기 시작하면 배움을 시작하기에 완벽한 동기를 제공할 것입니다."
 NRY_state_of_norway: "노르웨이 국가"
 NRY_state_of_norway_desc: "노르웨이의 관료제는 더 효율적이 되어야 하며, 이를 위해 모든 것이 원활히 돌아가도록 더 엄격한 상급 연방 기관의 철저한 감독 아래 두어야 합니다."
 NRY_reaffirm_oil_state: "석유 국가 재확인"
 NRY_reaffirm_oil_state_desc: "우리는 여전히 석유와 가스의 나라이며, 완전한 재생 에너지와는 거리가 멀고 이는 오랫동안 그대로일 것입니다."
 NRY_privatization_of_state_dockyards: "국영 조선소 민영화"
 NRY_privatization_of_state_dockyards_desc: "노르웨이의 부는 노르웨이 국민의 것이며, 우리나라에서 가장 큰 경제 부문 중 하나는 어업과 조선업입니다. 그곳에서부터 국민에게 권한을 돌려주기 시작할 수 있습니다."
 NRY_the_nrk: "NRK"
 NRY_the_nrk_desc: "노르웨이 방송공사는 우리 국민의 주된 뉴스 출처 역할을 하는 정부 소유의 방송사입니다. 우리는 영향력을 활용해 이를 우리의 이익에 맞추고, 그럼으로써 국민을 결집시키고 정보를 제공하며 우리나라에 대한 어떤 방해나 위협으로부터도 국민을 지킬 수 있습니다."
 NRY_oslo_hydro_TT: "[NRY.GetFlag] §H외스틀란데트§!에 §H수력 발전 기반시설§! 주 변동치를 부여합니다"
 NRY_bergen_engines_TT: "추가 수입: §G$0.400§!"
 NRY_productivity_state_TT: "[NRY.GetFlag] §H외스틀란데트§!의 §H생산성§!이 §H75§! 증가합니다"
 NRY_norge_mining_decision_cat: "노르게 광업"
 NRY_norge_mining_decision_cat_desc: "노르게 광업은 산업용 금속과 광물, 특히 리튬, 석영, 금홍석의 탐사와 생산에 주력하는 영국-노르웨이 합작 광업 회사입니다.\n\n굴착 연구 수준이 높을수록 결정에서 얻는 자원이 (수준당) 늘어납니다."
 NRY_mines_in_oslo: "오슬로의 광산"
 NRY_mines_in_vestlandet: "베스틀란네의 광산"
 NRY_mines_in_norde_norge: "노르란 지방의 광산"
 NRY_deep_sea_mining_in_trondelag: "트뢴델라그 인근 심해 채굴"
 NRY_deep_sea_in_oslo: "오슬로 인근 심해 채굴"
 NRY_oil_focus: "석유 투자"
 NRY_education_reform: "교육 개혁"
 NRY_ministry_of_agri_and_food: "농업식품부"
 NRY_norsk_industri_idea: "노르스크 산업"
 NRY_bergen_engines: "베르겐 엔진"
 NRY_aker_yards_idea: "아케르 야즈"
