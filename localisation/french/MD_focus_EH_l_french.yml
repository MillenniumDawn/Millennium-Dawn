l_french:
 event_horizon_generic_focus: "Arbre de concentration de l’humanité"
 chimera_focus: "Arbre de concentration des chimères"
 EH_set_up_electric_trap: "Installer un piège électrique"
 EH_remove_electric_trap: "Supprimer le piège électrique"
 EH_activate_electric_trap: "Activer le piège électrique"
 EH_drone_mission_category: "Mission de drone"
 EH_drone_mission_category_desc: "\n£EH_gui_drone_picture\n\n\n\nLes drones sont nos meilleurs et plus sûrs outils de reconnaissance. Grâce à eux, nous pouvons rassembler du renseignement sur l'ennemi sans risquer la vie de nos soldats. Nous pouvons les utiliser pour explorer le portail voisin et voir ce que l'ennemi construit autour, ce qui pourrait nous donner un avantage tactique lors de la bataille contre l'une de ces choses."
 EH_research_sites_category: "Sites de recherche"
 EH_research_sites_category_desc: "Les sites de recherche sont notre meilleur moyen d'en apprendre davantage sur les Chimères et leur technologie. De tels avant-postes attireront les meilleurs scientifiques disponibles et accorderont un bonus de recherche à nos projets spéciaux. Espérons seulement que les forces chimères ne les remarqueront pas trop tôt."
 EH_setup_research_site: "Installer un site de recherche"
 EH_install_anti_air_weapons: "Installer des armes antiaériennes"
 EH_panic_shelters_and_land_turrets: "Construire des abris de panique et des tourelles terrestres"
 EH_hire_additional_security_for_scientists: "Embaucher une sécurité supplémentaire pour les scientifiques"
 EH_disable_site_notifications: "Désactiver les notifications de raids sur les sites de recherche"
 EH_enable_site_notifications: "Activer les notifications de raids sur les sites de recherche"
 EH_doudna_or_charpentier_project_mission: "Projet spécial de §YJennifer Doudna§! et §YEmmanuelle Charpentier§!"
 EH_doudna_or_charpentier_project_mission_desc: "§YJennifer Doudna§! et §YEmmanuelle Charpentier§! travaillent à un projet spécial qui pourrait nous aider à mieux comprendre le patrimoine génétique des Chimères. Leur expertise de l'édition génique CRISPR pourrait fournir des éclairages inestimables sur les faiblesses de ces créatures, nous permettant d'élaborer des stratégies plus efficaces pour les combattre."
 EH_find_new_veins_category: "Trouver de nouvelles veines de Randallite"
 EH_find_new_veins_category_desc: "La randallite est une ressource rare et précieuse que l'on trouve dans certains filons à travers le monde. Elle est essentielle à notre recherche et au développement de nouvelles technologies contre les Chimères. En investissant dans l'exploration et l'extraction, nous augmentons nos chances de découvrir de nouveaux filons et d'assurer un approvisionnement régulier de cette ressource cruciale.\n\nChaque mine de randallite fournira une petite quantité de randallite chaque semaine. Nous devons trouver et sécuriser autant de gisements que possible, avant que les grandes entreprises ne s'emparent de l'extraction et ne nous forcent à des décisions déplaisantes."
 EH_search_for_randallite_veins: "Chercher des filons de randallite"
 EH_set_up_mine_mission: "Création d'une nouvelle mine"
 EH_large_company_seeks_for_randallite_mission: "Une grande entreprise cherche de la randallite"
 EH_outlaw_randallite_extraction: "Interdire l’extraction non étatique de randallite"
 EH_legalize_randallite_extraction: "Légaliser l’extraction non étatique de randallite"
 EH_construct_southern_zenobia_defense_line: "Construire la ligne de défense §GZénobie du Sud§!"
 EH_construct_western_zenobia_defense_line: "Construire la ligne de défense §GZénobie de l'Ouest§!"
 EH_construct_inner_saladin_defense_line: "Construire la ligne de défense §GSaladin intérieure§!"
 EH_construct_outer_saladin_defense_line: "Construire la ligne de défense §GSaladin extérieure§!"
 EH_southern_zenobia_defense_line_destruction: "Effondrement de la ligne de défense Zénobie du Sud"
 EH_western_zenobia_defense_line_destruction: "Effondrement de la ligne de défense Zénobie de l'Ouest"
 EH_inner_saladin_defense_line_destruction: "Effondrement de la ligne de défense Saladin intérieure"
 EH_outer_saladin_defense_line_destruction: "Effondrement de la ligne de défense Saladin extérieure"
 EH_nile_defense_line_category: "Lignes de défense Zénobie et Saladin"
 EH_nile_defense_line_category_desc: "Les lignes de défense du Nil sont notre meilleure chance de tenir face aux forces chimères en Afrique. La ligne Zénobie sera notre première ligne de défense, tandis que la ligne Saladin sera notre dernier espoir si la ligne Zénobie tombe. Il faut que les deux soient bien fortifiées et tenues : elles seront la clé de notre survie dans cette guerre."
 EH_bosporus_defense_line_category: "Ligne de défense du Bosphore"
 EH_bosporus_defense_line_category_desc: "La ligne de défense du Bosphore est notre meilleure chance de tenir face aux forces chimères en Europe. La ligne sera fortifiée d'artillerie lourde et de défenses antiaériennes, ainsi que d'un réseau de tranchées et de bunkers. Les armées de la plupart des nations européennes y seront stationnées. Il faut que la ligne tienne."
 EH_construct_bosphorus_defense_line: "Construire la ligne de défense du §GBosphore§!"
 EH_bosphorus_defense_line_destruction: "Effondrement de la ligne de défense du Bosphore"
 EH_caucasus_defense_line_category: "Ligne de défense du Caucase"
 EH_caucasus_defense_line_category_desc: "L'ennemi progresse rapidement au Moyen-Orient, menaçant nos frontières méridionales. La ligne de défense du Caucase est notre meilleure chance de tenir dans cette région. La fortification sera un système à deux couches : la première de tranchées et de bunkers, la seconde d'artillerie lourde et de défenses antiaériennes. Il faut que la ligne tienne — et espérer que nous retiendrons les Chimères au Tibet, sous peine de voir notre défense s'effondrer par l'arrière."
 EH_construct_caucasus_defense_line: "Construire la ligne de défense du §GCaucase§!"
 EH_caucasus_defense_line_destruction_1: "Effondrement de la première ligne de défense du Caucase"
 EH_caucasus_defense_line_destruction_2: "Effondrement de la seconde ligne de défense du Caucase"
 EH_event.0.t: "Bienvenue à Event Horizon !"
 EH_event.0.d: "Event Horizon est notre premier grand scénario spécial, conçu pour célébrer le million d'abonnés sur le Steam Workshop. C'est un scénario axé sur la guerre, où l'humanité lutte pour sa survie contre des envahisseurs extra-terrestres inconnus. Il propose un arbre de focalisation unique, de nouveaux événements, décisions, mécaniques, unités et une ressource qui vous plongeront dans cette bataille épique. Préparez-vous à affronter l'inconnu, menez l'humanité à la victoire — et merci pour votre soutien !"
 EH_event.0.a: "Waouhuu !!! Attendez, les ÉTRANGERS ?!!!"
 EH_event.1.t: "Les lignes Zénobie et Saladin sont en construction"
 EH_event.1.d: "Face à la menace croissante surgie d'Afrique subsaharienne, l'Alliance du Moyen-Orient a autorisé la construction rapide d'une ligne fortifiée le long du Nil méridional et des secteurs désertiques occidentaux de l'Égypte. Désignée ligne Zénobie, cette position ancrera des emplacements d'artillerie lourde et des systèmes de tranchées sur les principaux axes d'approche.\n\nSi la ligne Zénobie tombe, la ligne Saladin tient derrière elle. Couvrant toute la zone du canal, de Port-Saïd à la mer Rouge, cette fortification servira de ligne de défense absolue.\n"
 EH_event.1.a: "Que le désert devienne notre bouclier"
 EH_event.300.t: "Le CERN va au-delà"
 EH_event.300.d: "Des chercheurs de l'Organisation européenne pour la recherche nucléaire (CERN) ont réussi une collision à haute énergie contrôlée, aboutissant à la création temporaire de ce qui est décrit comme une « anomalie interdimensionnelle localisée ».\n\nSi la faille n'a été mesurée qu'à l'échelle subatomique et n'a duré qu'une fraction de nanoseconde, elle marque le premier cas enregistré de signatures énergétiques incompatibles avec les lois physiques connues. Les protocoles de confinement initiaux ont tenu et aucun transfert de matière n'a été observé, mais les implications ébranlent déjà la communauté scientifique mondiale.\n\nLa frontière entre le théorique et le réel vient de se brouiller."
 EH_event.300.a: "Est-ce vraiment sûr ?"
 EH_event.301.t: "Convoi de l'ONU disparu en Afrique centrale"
 EH_event.301.d: "Un convoi humanitaire des Nations unies opérant dans la région frontalière entre le Rwanda et la République démocratique du Congo a cessé de donner signe de vie. L'imagerie satellite montre des épaves et des véhicules renversés le long d'une piste jungle, mais aucun signal de détresse n'a été reçu.\n\nAucun survivant ni corps n'a été récupéré. Aucune faction rebelle n'a revendiqué l'incident. La cause demeure officiellement inconnue."
 EH_event.301.a: "Une nouvelle attaque contre les casques bleus de l'ONU..."
 EH_event.302.t: "Activité sismique inhabituelle dans le bassin du Tarim"
 EH_event.302.d: "Un essaim de secousses superficielles à haute fréquence a été enregistré dans le bassin du Tarim, dans l'ouest de la Chine. Les schémas sismiques sont incompatibles avec un mouvement tectonique naturel ou une activité souterraine connue. Les autorités chinoises n'ont pas communiqué, mais des données sismologiques régionales partagées discrètement via un programme d'échange universitaire ont interpellé les géophysiciens."
 EH_event.302.a: "Les relevés n'ont aucun sens"
 EH_event.303.t: "Silence radio dans le Pamir"
 EH_event.303.d: "Un poste d'écoute de l'APL en haute altitude, près de la frontière sino-tadjike, a cessé toute communication. Pékin n'a rien dit officiellement, mais un radioamateur kazakh a rapporté une brève transmission d'urgence en mandarin avant le silence total. Les satellites de renseignement montrent des signes visibles de dégâts."
 EH_event.303.a: "Était-ce une attaque tadjike ?"
 EH_event.304.t: "Rangers disparus dans le nord de l'Alaska"
 EH_event.304.d: "Deux rangers du parc national patrouillant un secteur reculé du Denali National Park ont été déclarés disparus après 72 heures sans contact. Une équipe de recherche a trouvé leur camp abandonné, avec des traces claires de lutte.\n\nD'abord relaté par la presse locale, l'affaire a pris une ampleur nationale et internationale lorsque l'équipe de recherche a elle aussi disparu sans laisser de traces. Le FBI a ouvert une enquête et une chasse à l'homme est en cours."
 EH_event.304.a: "Un meurtrier en liberté ?"
 EH_event.305.t: "Étrange épidémie dans les hauts plateaux péruviens"
 EH_event.305.d: "Un village reculé des hauts plateaux andins du sud du Pérou a été mis en quarantaine par les autorités sanitaires régionales après une épidémie mystérieuse. Les premiers rapports décrivent fièvre, hallucinations et désorientation sensorielle aiguë. Les symptômes sont apparus rapidement après un « flash lumineux » et une secousse ressentis uniquement dans une vallée étroite près du village.\n\nLes officiels péruviens parlent d'une infection fongique isolée, mais des ONG sur place affirment que les équipes médicales sont escortées par des militaires. Un géologue de l'université nationale de San Marcos, membre d'une équipe étudiant des grottes voisines, compte parmi les disparus."
 EH_event.305.a: "Tenez-nous au courant"
 EH_event.306.t: "Troubles au Xinjiang : base militaire attaquée"
 EH_event.306.d: "Un incident violent s'est produit près de Kachgar, dans l'ouest du Xinjiang. Les médias d'État chinois se taisent, mais le renseignement indique que la base 36, installation de l'APL près de Yecheng, a été submergée la nuit par des éléments hostiles non identifiés. Les descriptions radio n'avaient guère de sens quant à la nature réelle des assaillants.\n\nL'Armée populaire de libération a commencé le déploiement d'urgence d'unités mécanisées et d'équipes de réponse chimique. Des avions de transport ont été vus atterrir à l'aéroport de Kachgar aux premières heures.\n\nFait rare, un détachement russe de réaction rapide a également franchi la frontière chinoise par le col de Kulma."
 EH_event.306.a: "Situation sous contrôle, selon Pékin"
 EH_event.307.t: "Détonation nucléaire tactique dans l'ouest de la Chine"
 EH_event.307.d: "Une explosion nucléaire tactique a été détectée près du désert du Taklamakan, à environ 120 kilomètres à l'est de Kachgar. Le souffle s'est produit cinq jours après le déploiement d'unités de l'APL pour contenir la menace inconnue.\n\nPékin et Moscou nient tout usage d'armes nucléaires, mais les données sismiques confirment une détonation de faible puissance compatible avec une ogive tactique russe. Les images satellites montrent un terrain calciné, des strates géologiques effondrées et un orbe sombre en expansion rapide.\n\nLes observateurs internationaux réclament des réponses, mais les canaux officiels restent muets. Dans les milieux militaires, on murmure que la frappe fut une décision unilatérale du commandement russe de terrain, au titre d'une doctrine d'engagement d'urgence."
 EH_event.307.a: "Que se passe-t-il là-bas ?!"
 EH_event.308.t: "Le voile est déchiré"
 EH_event.308.d: "Des images satellites fuitées par une source de renseignement anonyme ont fait le tour du monde : un vaste orbe violet, palpitant, surplombe les restes calcinés du site d'impact, une nuée de créatures en émerge. Les scientifiques sont incapables d'expliquer les images. Les images montrent clairement que la frappe nucléaire n'a pas détruit la chose — elle l'a plutôt fait grandir. En quelques heures, trois nouveaux portails de taille et d'effet similaires ont surgi :\n- Dans le nord-ouest de l'Alaska\n- Dans les hauts plateaux kényans, près du mont Elgon\n- Dans le sud du Chili, près du cap Horn.\n\nLes rapports affluent déjà : les créatures sont extrêmement agressives. L'âge de la normalité est révolu."
 EH_event.308.a: "La vérité ne peut plus être niée"
 EH_event.309.t: "L'ONU convoque une assemblée d'urgence"
 EH_event.309.d: "Alors que la panique publique monte et que la confiance dans les gouvernements nationaux vacille, l'Organisation des Nations unies s'est réunie en session d'urgence. L'Assemblée générale a invoqué des pouvoirs de crise rarement utilisés, et le Conseil de sécurité débat dans l'urgence de stratégies de réponse coordonnée.\n\nLes propositions vont de la coopération militaire mondiale à des task forces scientifiques conjointes. Les tensions montent entre membres permanents, tandis que les accusations circulent et que les agendas s'entrechoquent.\n\nMais si les premiers rapports d'engagement indiquent quelque chose, une vérité est déjà claire : l'humanité doit s'unir, ou affronter l'extinction."
 EH_event.309.a: "Une réponse mondiale commence à prendre forme"
 EH_event.310.t: "Un commandement uni"
 EH_event.310.d: "L'assemblée d'urgence de l'ONU s'est achevée par la création du Commandement conjoint de l'ONU (UNJC). Un organe international chargé de coordonner la stratégie militaire, le renseignement et le soutien logistique contre la menace extra-dimensionnelle en expansion rapide. Principalement consultatif, le Commandement s'est vu accorder une latitude opérationnelle sans précédent.\n\nEn parallèle, des blocs régionaux comme l'Union européenne commencent à flotter des propositions d'unification politique et militaire complète, invoquant le besoin d'une mobilisation sans couture et d'une souveraineté partagée face à l'extinction. Ce qui était impensable se discute désormais ouvertement dans les parlements du continent."
 EH_event.310.a: "Un ennemi. Une guerre"
 EH_event.401.t: "Les États-Unis d'Amérique du Nord"
 EH_event.401.d: "Notre gouvernement est prêt à appeler à l'unification de notre continent. Il est temps de nous unir et d'affronter la menace ensemble. Seuls unis, nous pourrons survivre."
 EH_event.401.a: "Allons-y"
 EH_event.402.t: "Le gouvernement [FROM.GetAdjectiveCap] appelle à l'unification"
 EH_event.402.d: "Dans une allocution historique à la nation, [FROM.GetName] a appelé à l'unification des structures militaires et politiques nord-américaines avec les États voisins, afin de former un front consolidé contre la menace chimère. Invoquant le danger existentiel des portails en expansion rapide et de leurs habitants monstrueux, le gouvernement a souligné que seule l'unité peut garantir la survie.\n\nLa proposition comprend des structures de commandement partagées, des ressources mises en commun, des systèmes de défense intégrés et un territoire unifié."
 EH_event.402.a: "Il est temps"
 EH_event.403.t: "République centraméricaine"
 EH_event.403.d: "Suivant l'exemple de l'Amérique du Nord, il est temps que notre nation s'unisse à nos voisins. Nos pays ne sont pas aussi puissants que ceux du Nord ou du Sud, mais ensemble nous pouvons faire une énorme différence."
 EH_event.403.a: "Pour la survie de notre peuple"
 EH_event.404.t: "Le gouvernement [FROM.GetAdjectiveCap] appelle à l'unification"
 EH_event.404.d: "Une offre inattendue est parvenue de [FROM.GetName], proposant l'unification des nations d'Amérique centrale en un seul État afin de mieux coordonner la défense contre la menace chimère.\n\nSi certains dirigeants s'inquiètent de la souveraineté, l'urgence de la situation a conduit à examiner sérieusement l'offre."
 EH_event.404.a: "Nous devons le faire, coûte que coûte"
 EH_event.405.t: "L'Union des nations sud-américaines"
 EH_event.405.d: "Nous sommes actuellement la seule partie non unifiée des Amériques. Nos nations sont fortes, mais pas assez pour affronter seules la menace chimère. Il est temps de nous unir et d'affronter la menace ensemble."
 EH_event.405.a: "Envoyer les invitations"
 EH_event.406.t: "Le gouvernement [FROM.GetAdjectiveCap] appelle à l'unification"
 EH_event.406.a: "Pour l'avenir de notre continent"
 EH_event.407.t: "La Fédération européenne"
 EH_event.407.d: "Notre continent n'a jamais été aussi uni qu'aujourd'hui. L'Union européenne et l'OTAN ont tissé des liens solides au fil des ans, mais il est temps de passer à l'étape suivante. Nous devons nous unir en une seule nation pour affronter ensemble la menace chimère."
 EH_event.407.a: "Retrouvons-nous à Bruxelles"
 EH_event.408.t: "Le gouvernement [FROM.GetAdjectiveCap] appelle à l'unification"
 EH_event.408.d: "Aujourd'hui, [GetDateText], le gouvernement [FROM.GetAdjectiveCap] a officiellement proposé l'unification des nations européennes en une seule entité fédérale afin de mieux coordonner la défense contre la menace chimère. Après les Amériques, il était certain qu'une nation ferait la même proposition pour notre continent.\n\nCela peut aller à l'encontre des valeurs démocratiques d'indépendance des nations, mais l'urgence de la situation a brouillé la plupart des clivages idéologiques."
 EH_event.408.a: "Unis plus tôt, unis aujourd'hui"
 EH_event.409.t: "Le Point de défense africain"
 EH_event.409.d: "Notre continent a connu beaucoup de guerres récemment, mais l'espoir demeure. Les nations africaines doivent s'unir et affronter ensemble la menace chimère. Elles doivent comprendre que c'est la seule option."
 EH_event.409.a: "Pour la survie de l'Afrique"
 EH_event.410.t: "Le gouvernement [FROM.GetAdjectiveCap] appelle à l'unification"
 EH_event.410.d: "Malgré tout, le gouvernement de [FROM.GetName] a proposé l'unification des nations africaines pour faire front commun contre la menace chimère. Si certaines nations se relèvent encore de conflits récents, l'urgence de la situation l'emporte sur nos problèmes locaux."
 EH_event.410.a: "C'est le mieux que nous puissions faire"
 EH_event.411.t: "L'Union continentale orientale"
 EH_event.411.d: "Nous devons suivre l'exemple des autres continents. Nos nations sont fortes, mais pas assez pour affronter seules la menace chimère. Il nous faut mettre de côté nos différences et nous unir."
 EH_event.411.a: "Envoyer les invitations"
 EH_event.412.t: "Le gouvernement [FROM.GetAdjectiveCap] appelle à l'unification"
 EH_event.412.d: "Nos nations ont traversé récemment de nombreux conflits brutaux. [FROM.GetName] propose de mettre de côté nos différences et de nous unir pour affronter ensemble la menace chimère. Ce n'était pas un entretien facile, mais les Chimères sont une menace pour tous, bien plus grande que nos problèmes locaux."
 EH_event.412.a: "Pour l'instant, restons unis"
 EH_event.413.t: "La Fédération eurasienne"
 EH_event.413.d: "Notre grande faction doit rester unie. La menace chimère se rapproche de nos frontières. Nos nations sont fortes, mais pas assez pour l'affronter seules. Il est temps de nous unir et d'affronter la menace ensemble."
 EH_event.413.a: "Retrouvons-nous à Moscou"
 EH_event.414.t: "Le gouvernement [FROM.GetAdjectiveCap] appelle à l'unification"
 EH_event.414.d: "Les temps sont graves. Le gouvernement de [FROM.GetName] a proposé l'unification des nations eurasiennes en une seule entité fédérale afin de mieux coordonner la défense contre la menace chimère. Sous la protection de l'armée et de l'économie russes, nous pourrons repousser les forces chimères hors de cette planète."
 EH_event.414.a: "Vive l’OTSC !"
 EH_event.415.t: "Les Trois Pics"
 EH_event.415.d: "Notre grande nation doit rester intacte : il est temps d'unir nos alliés communistes. Ensemble, nous pourrons affronter la menace chimère et survivre pour voir un autre jour."
 EH_event.415.a: "Pékin montrera la voie"
 EH_event.416.t: "Le gouvernement [FROM.GetAdjectiveCap] appelle à l'unification"
 EH_event.416.d: "La Chine n'est pas ouverte à former une autre immense fédération comme les autres continents, mais nos nations ont toujours été proches. Le gouvernement de [FROM.GetName] a proposé d'unir nos pays sous un seul drapeau pour affronter ensemble la menace chimère."
 EH_event.416.a: "Le dernier bastion communiste"
 EH_event.417.t: "La Coalition de l'ASEAN"
 EH_event.417.d: "Nous nous sommes retrouvés entourés de méga-États récemment. Et ce qui aggrave notre situation, c'est le portail chimère tout proche, en Chine. Il est temps de nous unir et d'affronter la menace ensemble."
 EH_event.417.a: "Nous avons déjà trop attendu"
 EH_event.418.t: "Le gouvernement [FROM.GetAdjectiveCap] appelle à l'unification"
 EH_event.418.d: "Le gouvernement de [FROM.GetName] a proposé l'unification des nations d'Asie du Sud-Est en une seule entité afin de mieux coordonner la défense contre la menace chimère. Après les récentes unifications sur d'autres continents, ce n'était qu'une question de temps avant qu'une de nos nations fasse la même proposition."
 EH_event.418.a: "Notre seule option"
 EH_event.419.t: "La Coalition d'Asie de l'Est"
 EH_event.419.d: "La menace se rapproche de nos frontières. Non seulement les forces chimères venues de Chine, mais aussi la Chine elle-même et ses nouveaux alliés. Montrons-leur que nous ne resterons pas les bras croisés dans cette guerre."
 EH_event.419.a: "Pour la sécurité de nos îles"
 EH_event.420.t: "Le gouvernement [FROM.GetAdjectiveCap] appelle à l'unification"
 EH_event.420.d: "Le gouvernement de [FROM.GetName] a proposé l'unification des nations d'Asie de l'Est en une seule entité afin de mieux coordonner la défense contre la menace chimère et l'influence croissante de la Chine."
 EH_event.420.a: "Se préparer au pire"
 EH_event.421.t: "L'Union de défense océanienne"
 EH_event.421.d: "Le reste du monde est uni. Nous pensions que cette guerre n'atteindrait pas nos îles, mais ce n'est qu'une question de temps. Nos nations ont vécu dans une paix générale ; il est temps de nous unir et de défendre nos foyers."
 EH_event.421.a: "Pour la survie de l'Océanie"
 EH_event.422.t: "Le gouvernement [FROM.GetAdjectiveCap] appelle à l'unification"
 EH_event.422.d: "Le gouvernement de [FROM.GetName] a proposé l'unification des nations océaniennes. Si nos pays sont loin des principales zones de conflit, les récentes unifications sur d'autres continents nous ont fait comprendre que nous devons être prêts à tout."
 EH_event.422.a: "Ainsi soit-il."
 EH_event.423.t: "L'essor des États-Unis d'Amérique du Nord"
 EH_event.423.d: "La réponse rapide du gouvernement américain à la menace chimère a abouti à l'établissement formel des États-Unis d'Amérique du Nord (USNA). Après des semaines de négociations intenses, les pays du continent ont accepté de dissoudre leurs gouvernements nationaux et de s'intégrer en une seule entité fédérale.\n\nLes USNA commandent désormais une force militaire unifiée, une logistique centralisée et un gouvernement de guerre unique."
 EH_event.423.a: "Une nouvelle ère commence"
 EH_event.424.t: "Unification de la República de Centroamérica"
 EH_event.424.d: "Les dirigeants d'Amérique centrale ont accepté de dissoudre leurs gouvernements nationaux et de s'intégrer en une seule entité : la República de Centroamérica (RCA). On ne sait pas pleinement si l'unification a été provoquée uniquement par la menace chimère, ou aussi par celle que représentent les USNA elles-mêmes. Une chose est certaine : un autre groupe de pays est prêt à affronter la menace apocalyptique."
 EH_event.424.a: "Qui l'aurait cru ?"
 EH_event.425.t: "L'Union des nations sud-américaines a été formée"
 EH_event.425.d: "La dernière partie des Amériques s'est enfin unie. Après des semaines de négociations, les nations sud-américaines ont accepté de s'unir sous un seul drapeau : l'Union des nations sud-américaines (UNASUR).\n\nToute l'Amérique est désormais prête à affronter la menace ensemble."
 EH_event.425.a: "Une lueur d'espoir"
 EH_event.426.t: "La naissance de la Fédération européenne"
 EH_event.426.d: "Après des mois de marchandages politiques, de sessions d'urgence et de pertes croissantes, l'Union européenne a voté la dissolution de son cadre supranational et sa reconstitution en un seul méga-État fédéral : la Fédération européenne.\n\nMême des pays historiquement neutres comme la Suisse et la Finlande, après de longs débats internes et des référendums, ont choisi de rejoindre, invoquant la menace existentielle des CHIMÈRES. Armées nationales consolidées et frontières effacées, la Fédération européenne aligne désormais un commandement unifié, des ressources mises en commun et un gouvernement de guerre unique.\n\nLes critiques mettent en garde contre une intégration hâtive et la perte d'indépendance ; les partisans rétorquent que rien de moins qu'une unification totale n'assurera la survie."
 EH_event.426.a: "La survie ne connaît pas de frontières"
 EH_event.427.t: "La formation du Point de défense africain"
 EH_event.427.d: "Dans un geste historique, les nations africaines se sont réunies pour former le Point de défense africain (ADF).\n\nMalgré des conflits régionaux persistants et des disparités économiques, les dirigeants ont convenu que seule l'unité pouvait leur permettre d'espérer défendre leurs peuples et leurs territoires. L'Afrique est désormais en mesure de contribuer de façon significative à la lutte mondiale contre la menace CHIMÈRE."
 EH_event.427.a: "L’Afrique est unie"
 EH_event.428.t: "Création de l'Union continentale orientale"
 EH_event.428.d: "Dans un retournement surprenant, des nations d'Asie centrale et d'Afrique du Nord ont accepté de dissoudre leurs gouvernements nationaux et de former l'Union continentale orientale (ECU).\n\nLa décision intervient alors que les incursions CHIMÈRES s'intensifient et que l'on constate que des réponses fragmentées n'ont mené qu'à de plus grandes pertes.\n\nSi certains conflits sont loin d'être résolus, l'urgence de la menace CHIMÈRE a poussé les dirigeants à privilégier la survie sur la souveraineté."
 EH_event.428.a: "Cette alliance tiendra-t-elle ?"
 EH_event.429.t: "Création officielle de la Fédération eurasienne"
 EH_event.429.d: "La réunion de Moscou s'est achevée et le monde assiste à la naissance de la Fédération eurasienne (ERF). Beaucoup se demandent si l'unification a été imposée par la Russie, mais la vérité est que toutes les nations ont accepté de s'unir pour affronter ensemble la menace chimère.\n\nDes rumeurs circulent aussi selon lesquelles la Russie pourrait profiter de la situation pour restaurer l'Union soviétique, ou redevenir une menace pour l'Europe."
 EH_event.429.a: "Trop de questions demeurent..."
 EH_event.430.t: "Les Trois Pics unis"
 EH_event.430.d: "La Corée du Nord, la Mongolie et la Chine se sont officiellement unies sous un seul drapeau : les Trois Pics. Même si l'unification a été critiquée par le gouvernement chinois, les relations solides avec ses alliés et la menace chimère les ont fait changer d'avis.\n\nLa nouvelle nation est désormais prête à affronter la menace ensemble."
 EH_event.430.a: "Juste, je suppose..."
 EH_event.431.t: "Création d'une coalition de l'ASEAN"
 EH_event.431.d: "Une autre partie de l'Asie s'est unie. Les récentes unifications des nations du Moyen-Orient et des Trois Pics ont poussé les nations d'Asie du Sud-Est à suivre la même voie."
 EH_event.431.a: "Le monde n'a jamais été aussi uni"
 EH_event.432.t: "Création d'une coalition pour l'Asie de l'Est"
 EH_event.432.d: "Les derniers pays asiatiques se sont unis. Après des semaines de négociations, les nations d'Asie de l'Est ont accepté de dissoudre leurs gouvernements nationaux et de s'intégrer en une seule entité : la Coalition d'Asie de l'Est (EAC).\n\nFace à l'influence croissante de la Chine et au portail chimère tout proche, la nouvelle nation se prépare non seulement à affronter la menace chimère, mais aussi une éventuelle agression de la Chine elle-même."
 EH_event.432.a: "Mieux unis que divisés"
 EH_event.433.t: "Union de défense océanienne créée"
 EH_event.433.d: "Les nations océaniennes se sont réunies pour former l'Union de défense océanienne (ODU). Malgré l'isolement géographique et les disparités économiques, les dirigeants ont convenu que seule l'unité pouvait leur permettre d'espérer défendre leurs peuples et leurs territoires.\n\nL'ODU est désormais en mesure de contribuer de façon significative à la lutte mondiale contre la menace chimère.\n\nL'Océanie unie, le monde est désormais entièrement partagé en plusieurs méga-États. Les Nations unies restent la dernière organisation internationale, faisant de leur mieux pour soutenir l'effort de guerre mondial."
 EH_event.433.a: "Meilleur des mondes"
 EH_event.434.t: "L'énergie des portails perturbe les communications mondiales"
 EH_event.434.d: "Dans les semaines qui ont suivi l'apparition des portails chimères, les réseaux de communication mondiaux ont connu des perturbations sans précédent. Les liaisons satellite tombent par intermittence, les câbles sous-marins montrent des pertes de données erratiques, et les réseaux terrestres sont rongés par des interférences inexpliquées.\n\nLes experts pensent que les portails émettent une forme unique de rayonnement électromagnétique qui interfère avec les technologies de communication classiques. Des efforts sont en cours pour développer de nouveaux protocoles et matériels capables de fonctionner dans cet environnement hostile, mais pour l'heure le flux d'information reste gravement compromis."
 EH_event.434.a: "Réparez ça vite !"
 EH_event.500.t: "La découverte de la randallite"
 EH_event.500.d: "Depuis que les premiers portails ont déchiré la Terre, des fragments d'une substance métallique non identifiée ont été trouvés partout dans le monde. La plupart y voyaient une transformation dimensionnelle de métaux existants, étrange mais inerte.\n\nCela a changé aujourd'hui. Le Dr Lisa Randall, physicienne théoricienne et l'un des plus grands esprits mondiaux de la physique des dimensions supplémentaires, a percé la structure et les propriétés du matériau, révélant un métal stable, léger et extrêmement résilient, au potentiel militaire immense.\n\nDésormais baptisée randallite, la substance se prête uniqueement aux alliages avancés, combinant résistance, tenue à la chaleur et flexibilité. Bien raffinée, elle pourrait servir de fondation à une nouvelle génération de machines de guerre pour nous aider à vaincre."
 EH_event.500.a: "Enfin une bonne nouvelle"
 EH_event.501.t: "Le cadre prototype HACS dévoilé"
 EH_event.501.d: "Après des mois de développement accéléré, le premier châssis prototype d'un High Agility Combat System (HACS) a été construit avec succès par l'équipe [FROM.GetAdjective].\n\nConçu avec un châssis bipède renforcé de randallite et équipé de propulseurs intégrés, la plateforme HACS devait combler l'écart entre puissance de feu et survie. Là où les chars sont trop lents et les aéronefs trop vulnérables aux menaces chimères, les HACS offrent la mobilité nécessaire sans sacrifier les charges d'armes lourdes.\n\nEncore en essais, cette percée marque une étape majeure vers des unités de première ligne de nouvelle génération. Un programme de recherche dédié a été autorisé pour rendre les HACS opérationnels au combat."
 EH_event.501.a: "Une nouvelle ère de guerre"
 EH_event.511.t: "Opération Sledgehammer"
 EH_event.511.d: "Après des mois de pertes amères en Europe de l'Est et l'effondrement du réseau défensif balkanique, la Fédération européenne a lancé l'opération Sledgehammer, une offensive militaire à haut risque pour reconquérir la ligne du Bosphore et rouvrir le corridor stratégique entre l'Europe et le Moyen-Orient. Menée par des unités HACS fraîchement déployées et appuyée par des frappes coordonnées d'artillerie, de marine et de missiles, l'offensive vise à déloger les essaims chimères retranchés dans les ruines d'Istanbul et des collines environnantes.\n\nLe succès de l'opération marquerait un tournant majeur pour rétablir la mobilité continentale et sécuriser le flanc sud de l'Europe. Mais la présence de l'essaim s'est épaissie, et le renseignement signale de nouvelles variantes inédites dans la région. La bataille à venir sera coûteuse."
 EH_event.511.a: "Les dés sont jetés"
 EH_event.800.t: "Les lignes Zénobie et Saladin sont en construction"
 EH_event.800.d: "Face à l'essaim qui avance rapidement depuis l'Afrique subsaharienne, la Ligue de défense du Moyen-Orient a ordonné la construction immédiate d'une barrière fortifiée à travers le sud de l'Égypte. Baptisée ligne Zénobie, elle s'étend le long du Nil et du flanc désertique occidental, intégrant bunkers renforcés, réseaux de tranchées et positions d'artillerie à longue portée pour briser l'élan des Chimères.\n\nSi Zénobie tombe, la ligne Saladin l'attend derrière. Ancrée le long du canal de Suez, de Port-Saïd à la mer Rouge, elle se dresse comme le dernier réduit, une ligne censée être infranchissable pour protéger le cœur culturel et spirituel de la région de l'anéantissement."
 EH_event.800.a: "La ligne est tracée"
 EH_event.801.t: "Effondrement des lignes Zénobie et Saladin"
 EH_event.801.d: "Des rapports indiquent que l'essaim chimère a percé à la fois la ligne Zénobie dans le sud de l'Égypte et la ligne Saladin le long du canal de Suez. Malgré des efforts défensifs brutaux et un appui d'artillerie lourd, l'ennemi s'est révélé trop nombreux et trop implacable.\n\nDes secteurs défensifs entiers ont été submergés, les fortifications perdues, les tranchées englouties, et de nombreuses unités ont combattu jusqu'au bout. Le QG de Suez s'est depuis tu. La Ligue de défense du Moyen-Orient a ordonné un repli général vers le Levant.\n\nLa percée de la ligne de défense ultime ouvre la porte au front nord. Il ne reste plus de tampon."
 EH_event.801.a: "Ils ont tenu aussi longtemps qu'ils le pouvaient"
 EH_event.802.t: "Les lignes Zénobie et Saladin frappées par l'arrière !"
 EH_event.802.d: "Suite à l'effondrement des lignes de défense du Moyen-Orient, les forces chimères ont désormais percé les lignes zénobienne et Saladin par leur seul côté vulnérable : l'arrière. L'essaim s'est engouffré en nombre écrasant, submergeant rapidement les défenseurs restants et s'assurant une tête de pont au cœur du continent.\n\nLes lignes compromises, les Chimères ont le champ libre pour avancer vers le nord, menaçant villes et infrastructures clés à travers l'Europe. La situation est grave, et l'Union européenne doit désormais se préparer à un combat long et brutal sur le premier front à ses frontières."
 EH_event.802.a: "Le front oriental était trop faible"
 EH_event.803.t: "Fortifier l'Europe : la ligne du Bosphore"
 EH_event.803.d: "La Coalition occidentale a autorisé la création d'un nouveau réduit continental : la ligne du Bosphore.\n\nS'étendant à travers les détroits d'Istanbul, cette ligne défensive intègre champs de mines, blocus navals, positions préparées et retranchements renforcés pour empêcher une percée vers l'Europe. En son cœur se tient la Task Force Hellespont, une unité multinationale prête à se battre jusqu'au bout.\n\nL'ordre est clair : tenir la ligne, coûte que coûte."
 EH_event.803.a: "Ils ne passeront pas sans combat"
 EH_event.804.t: "La chute de la ligne du Bosphore"
 EH_event.804.d: "Après un siège brutal et prolongé, la ligne du Bosphore a été percée. Les Chimères se sont engouffrées dans Istanbul en une marée de feu et de chair, submergeant les défenses malgré une contre-offensive désespérée.\n\nLa Task Force Hellespont a combattu jusqu'au dernier et est pleurée comme héroïne de l'Europe.\n\nL'Europe est désormais directement exposée. Le monde occidental a perdu son premier bouclier."
 EH_event.804.a: "Les gardiens de l'Europe seront pleurés"
 EH_event.805.t: "La ligne du Bosphore frappée par l'arrière !"
 EH_event.805.d: "Les forces chimères ont contourné la mer Noire par le nord et frappé la ligne du Bosphore par l'arrière, contournant complètement les fortifications et submergeant les défenseurs restants. L'essaim domine déjà les Balkans et l'Europe occidentale."
 EH_event.805.a: "L'Europe est déjà tombée"
 EH_event.806.t: "La ligne de défense du Caucase en construction"
 EH_event.806.d: "La ligne de défense du Caucase est construite pour protéger la liaison entre le Moyen-Orient et le territoire méridional de la Fédération eurasienne. Elle s'étendra à travers les montagnes du Caucase, intégrant les avantages du terrain naturel à des positions fortifiées, des emplacements d'artillerie et des unités de réaction rapide pour créer une barrière redoutable contre l'avance chimère.\n\nElle ne suffira peut-être pas à arrêter entièrement l'essaim, mais elle servira de tampon critique pour gagner du temps aux évacuations et au regroupement en Europe et dans l'ancienne Russie."
 EH_event.806.a: "Espérons qu'ils le recevront à temps"
 EH_event.807.t: "Première ligne de la défense du Caucase percée"
 EH_event.807.d: "Les forces chimères ont percé la première ligne de la défense du Caucase, submergeant les fortifications initiales et s'enfonçant dans la région montagneuse. Malgré une résistance farouche des défenseurs, l'assaut implacable de l'essaim a créé une tête de pont, menaçant de déborder vers le cœur de la Fédération eurasienne.\n\nLa situation est critique, mais l'espoir demeure que la seconde ligne tienne et empêche de nouvelles incursions."
 EH_event.807.a: "Il reste de l'espoir pour la seconde ligne"
 EH_event.808.t: "La défense du Caucase est tombée"
 EH_event.808.d: "Malgré des efforts vaillants, la ligne de défense du Caucase est tombée. Les forces chimères ont submergé les défenseurs restants et s'est assuré une tête de pont dans la région, ouvrant un nouveau front pour la Fédération eurasienne.\n\nAvec la perte de ce tampon critique, l'essaim a désormais un chemin direct vers des villes et infrastructures clés à travers la Russie et l'Europe occidentale. La situation est grave, et la Fédération eurasienne doit désormais se préparer à un combat long et brutal sur son propre sol."
 EH_event.808.a: "On ne peut plus les arrêter..."
 EH_event.809.t: "La ligne de défense du Caucase frappée par l'arrière !"
 EH_event.809.d: "Les forces chimères ont contourné les montagnes du Caucase par le nord et frappé la ligne de défense par l'arrière, contournant complètement les fortifications et submergeant les défenseurs restants. L'essaim domine déjà les régions environnantes."
 EH_event.809.a: "C'était le risque qu'il fallait prendre"
 EH_event.900.t: "Chute de Washington D.C."
 EH_event.900.d: "La capitale des anciens États-Unis d'Amérique est tombée.\n\nLes forces chimères ont lancé un assaut dévastateur, perçant les défenses de la ville et submergeant les unités militaires. Les monuments emblématiques gisent en ruines, et les rues autrefois grouillantes sont d'un silence étrange.\n\nLes survivants rapportent des récits terrifiants de chaos et de destruction alors que la ville tombait aux mains de l'essaim."
 EH_event.900.a: "Le cœur d'une nation est perdu..."
 EH_event.901.t: "Chute de New York"
 EH_event.901.d: "New York est tombée aux mains de l'essaim chimère.\n\nLes créatures ont exploité tunnels souterrains et métros pour contourner les défenses de surface, prenant les unités militaires au dépourvu. La skyline emblématique n'est plus qu'une silhouette de destruction, incendies et immeubles qui s'effondrent.\n\nStaten Island a été la première à tomber, et désormais toute la ville est sous contrôle chimère."
 EH_event.901.a: "La Statue de la Liberté a disparu..."
 EH_event.902.t: "Chute de Los Angeles"
 EH_event.902.d: "Los Angeles est tombée.\n\nAutrefois une ville magnifique, elle n'est plus qu'un souvenir pour d'innombrables réfugiés fuyant l'avance implacable des Chimères. Le panneau Hollywood se dresse désormais comme un sombre rappel de ce qui a été perdu."
 EH_event.902.a: "Une telle perte..."
 EH_event.903.t: "Chute de San Francisco"
 EH_event.903.d: "San Francisco n'est plus\n\nLes Chimères ont surgi par des fissures souterraines et des brèches côtières, contournant les lignes défensives à une vitesse terrifiante. Le Commandement du Pacifique rapporte que toutes les forces restantes ont été anéanties ou coupées. Les pertes civiles sont catastrophiques.\n\nEncore une grande ville perdue pour l'essaim."
 EH_event.903.a: "Le Golden Gate est perdu..."
 EH_event.904.t: "Chute de Moscou"
 EH_event.904.d: "Moscou est tombée.\n\nL'essaim chimère a lancé un assaut coordonné, submergeant les défenses de la ville par le nombre et la férocité. Le Kremlin, autrefois symbole de la résilience russe, gît désormais en ruines.\n\nLes survivants parlent de chaos et de désespoir alors que la ville succombait à l'avance implacable des créatures."
 EH_event.904.a: "Le cœur de la Russie est perdu..."
 EH_event.905.t: "Chute de Shanghai"
 EH_event.905.d: "Shanghai est tombée.\n\nL'essaim a frappé avec une force écrasante, d'abord par les banlieues sud, puis à travers le Huangpu, prenant les défenseurs en pleine retraite. Le Bund est devenu un cimetière d'acier calciné et de béton brisé. Les flux satellites ne montrent plus que le silence : la coquille vide d'une ville."
 EH_event.905.a: "Quand les arrêterons-nous ?"
 EH_event.1000.t: "Portail Chimère fermé !"
 EH_event.1000.d: "Le projet T.E.S.L.A. s'est révélé un énorme succès. [FROM.GetName] a mené un raid réussi pour fermer l'un des portails chimères, faisant instantanément perdre connaissance à toutes les forces chimères dans un immense périmètre. Les créatures sont encore en vie : la population locale est invitée à n'avoir aucun contact avec les corps. L'armée nationale est en route pour tuer les unités chimères dans leur sommeil."
 EH_event.1000.a: "Ces enfoirés ont réussi."
 EH_focus_event.1.t: "Grand plan de mobilisation"
 EH_focus_event.1.d: "Ils sont apparus soudainement. Ils attaquent tout ce qui bouge, et ils ne s'arrêteront pas tant que tout ne sera pas mort. Nos scientifiques tentent de comprendre ce que sont ces créatures, d'où elles viennent et comment les arrêter. Pendant ce temps, notre armée tente de tenir la ligne de front et de protéger nos citoyens. Il faut agir vite avant qu'ils n'atteignent nos frontières. Nous pouvons compter sur notre armée professionnelle, ou appeler à une mobilisation massive."
 EH_focus_event.1.a: "Lancez-leur tout ce que nous avons !"
 EH_focus_event.1.b: "Nous compterons sur l'armée professionnelle."
 EH_focus_event.2.t: "Première génération de soldats de chitine"
 EH_focus_event.2.d: "Les recherches récentes sur les troupes chimères ont permis de créer une nouvelle lignée de soldats : les soldats à chitine. La nouvelle armure rendra nos gens plus résistants aux attaques physiques des extra-terrestres, et son design futuriste apporte espoir et excitation parmi la population."
 EH_focus_event.2.a: "Quand la fiction rencontre la réalité."
 EH_focus_event.3.t: "Les drones ont atteint leur cible"
 EH_focus_event.3.d: "Les drones ont pris des clichés détaillés de la structure autour du portail. Pour en comprendre davantage le but et le fonctionnement, au-delà de la défense, les scientifiques devront analyser les données recueillies. Heureusement, un professeur de biologie voudra y regarder de plus près."
 EH_focus_event.3.a: "Espérons que cela en valait la peine."
 EH_focus_event.4.t: "Les Chimères ont détruit l'escadron de drones"
 EH_focus_event.4.d: "Les forces chimères ont intercepté et détruit l'escadron de drones avant qu'il ne puisse achever sa mission. Aucune machine n'a pu prendre la moindre photo et l'envoyer avant d'être abattue."
 EH_focus_event.4.a: "Encore un échec...."
 EH_focus_event.5.t: "Les forces chimères ont détruit le site de recherche"
 EH_focus_event.5.d: "Les forces chimères ont découvert et détruit l'un de nos sites de recherche. Une partie des données a été perdue, mais au moins les Chimères ne sont pas parties sans pertes."
 EH_focus_event.5.a: "Cherchez les survivants !"
 EH_focus_event.6.t: "Forces chimères repoussées du site de recherche"
 EH_focus_event.6.d: "Les Chimères n'ont pas réussi à détruire notre site de recherche. Aucune donnée n'a été perdue, et les scientifiques sont sains et saufs."
 EH_focus_event.6.a: "Grande victoire !"
 EH_focus_event.7.t: "Scientifique porté disparu"
 EH_focus_event.7.d: "L'un des scientifiques n'a pas réussi à quitter le site de recherche avant l'attaque chimère. Nous ne savons pas s'il est mort ou vivant, mais nous devons craindre le pire : il n'y a actuellement aucun moyen de lancer une mission de sauvetage."
 EH_focus_event.7.a: "Bon sang !"
 EH_focus_event.8.t: "Les émissions d'énergie des portails affaiblissent les forces Chimère"
 EH_focus_event.8.d: "En consacrant plus de temps à surveiller les émissions d'énergie inhabituelles du portail qui perturbaient notre réseau satellite, nos scientifiques ont découvert que ces émissions suivent des schémas très précis. De nouveaux satellites ont été équipés de capteurs spéciaux capables de les détecter et de s'en servir pour interférer avec les systèmes de communication chimères. Cette percée pourrait affaiblir considérablement les forces chimères."
 EH_focus_event.8.a: "C'est une grande percée !"
 EH_focus_event.9.t: "Le privé envoie des ouvriers aider les sites de recherche"
 EH_focus_event.9.d: "D'immenses entreprises privées se sont réunies pour aider nos scientifiques dans leurs recherches contre les Chimères. Elles envoient leurs meilleurs ouvriers pour construire de nouveaux sites de recherche, accélérant nettement tout le processus."
 EH_focus_event.9.a: "Excellente nouvelle !"
 EH_focus_event.10.t: "Les généraux offrent une sécurité supplémentaire aux sites de recherche"
 EH_focus_event.10.d: "Nos généraux ont proposé d'envoyer des troupes supplémentaires pour protéger nos sites de recherche des attaques chimères. Leur expérience au combat et leur connaissance des tactiques chimères seront inestimables pour assurer la sécurité de nos scientifiques et le succès de nos projets."
 EH_focus_event.10.a: "Nous apprécions leur soutien !"
 EH_focus_event.11.t: "Un milliardaire partage sa fortune pour financer les atouts"
 EH_focus_event.11.d: "Un milliardaire fortuné a décidé de donner une part significative de sa fortune pour financer nos sites de recherche. Cet apport énorme couvrira les coûts de construction de nouvelles installations et accélérera grandement la recherche."
 EH_focus_event.11.a: "Réduisez ses impôts !"
 EH_focus_event.12.t: "Découverte d'une veine de Randallite"
 EH_focus_event.12.d: "Un nouveau filon de randallite a été découvert par l'équipe de prospection. C'est désormais à nous de décider d'installer des opérations minières et d'extraire cette précieuse ressource."
 EH_focus_event.12.a: "Commencez les opérations minières !"
 EH_focus_event.12.b: "Nous ne pouvons pas nous le permettre."
 EH_focus_event.13.t: "Veine de fer découverte"
 EH_focus_event.13.d: "Un nouveau filon de fer a été découvert par l'équipe de prospection. C'est désormais à nous de décider d'installer des opérations minières, de l'extraire et d'augmenter notre production d'acier."
 EH_focus_event.13.a: "J'attendais davantage, mais nous en avons tout de même besoin."
 EH_focus_event.13.b: "Nous ne pouvons pas nous le permettre."
 EH_focus_event.14.t: "Découverte d'une veine d'aluminium"
 EH_focus_event.14.d: "Un nouveau filon d'aluminium a été découvert par l'équipe de prospection. C'est désormais à nous de décider d'installer des opérations minières et d'extraire cette ressource."
 EH_focus_event.14.a: "Pas de randallite ? L'affaire reste bonne."
 EH_focus_event.14.b: "Nous ne pouvons pas nous le permettre."
 EH_focus_event.15.t: "Une entreprise non étatique découvre une veine de Randallite"
 EH_focus_event.15.d: "L'une des grandes entreprises privées a découvert un nouveau filon de randallite. Elle est prête à lancer des opérations minières de son propre chef, sans aucune aide du gouvernement."
 EH_focus_event.15.a: "Euh... laissez-les faire."
 EH_focus_event.16.t: "[FROM.GetName] lance l'offensive finale"
 EH_focus_event.16.d: "Après la détonation réussie de l'arme T.E.S.L.A. au portail chimère, l'armée de [FROM.GetName] a lancé une offensive de grande envergure pour éliminer toutes les forces chimères de la zone. Le portail fermé et l'ennemi désorienté, c'est notre chance de porter un coup décisif et de reconquérir le territoire perdu."
 EH_focus_event.16.a: "Nous l'emporterons."
 EH_protect_the_homeland: "Protéger la patrie !"
 EH_protect_the_homeland_desc: "Nous avons été envahis par des forces inconnues, tout droit sorties de l'enfer. Nous devons nous défendre avec tout ce que nous avons pour repousser la menace et survivre pour voir un autre jour !"
 EH_territorial_advantages: "Avantages territoriaux"
 EH_territorial_advantages_desc: "Les envahisseurs sont plus forts au corps à corps... ou au combat en général. Si nous ne pouvons pas les battre par la force, il faut être plus malins. Un nouveau programme de défense nous aidera à utiliser le paysage à notre avantage, et cela suffira peut-être à gagner quelques batailles."
 EH_cold_acclimatization: "Acclimatation au froid"
 EH_cold_acclimatization_desc: "Les envahisseurs sont extrêmement résistants au froid. Autre problème : deux portails se trouvent en Alaska et au Tibet. Si nous voulons avoir une chance de nous en approcher, il nous faut être plus forts, ou concevoir de nouvelles façons de combattre le froid."
 EH_300: "300"
 EH_300_desc: "Les cols de montagne étroits sont un terrain incroyablement difficile à franchir. Un endroit parfait pour une embuscade, à mon avis. Tant que nous pouvons gérer leur appui aérien, nous pouvons utiliser ces cols pour un avantage considérable au combat."
 EH_heat_acclimatization: "Acclimatation à la chaleur"
 EH_heat_acclimatization_desc: "Les monstres sont très résistants aux forces de la nature. Nous aussi, nous devons être plus forts. Nous nous battons sur cette planète depuis plus longtemps qu'eux, et cette expérience doit maintenant servir à notre avantage."
 EH_sandstorms_are_our_allies: "Les tempêtes de sable sont nos alliées"
 EH_sandstorms_are_our_allies_desc: "Nous savons quand les tempêtes de sable arrivent. Avec cette connaissance, nous pourrions préparer notre défense et utiliser le sable à notre avantage. Espérons seulement que les monstres n'aient pas de « radars biologiques »."
 EH_observe_local_fauna: "Observer la faune locale"
 EH_observe_local_fauna_desc: "Les animaux offrent un système d'alerte précoce parfait. Ces monstres sont une menace pour toutes les espèces, et nos animaux semblent déjà conscients de leur présence. Un grand groupe d'animaux fuyant en panique peut être une information importante, lorsque nos radars se taisent."
 EH_our_weakness_to_their_disadvantage: "Notre faiblesse à leur désavantage"
 EH_our_weakness_to_their_disadvantage_desc: "Les plaines sont extrêmement utiles pour nos véhicules, mais chars et VCI ne suffisent pas à arrêter ces monstres. Grâce au terrain plat, nous pourrons toutefois préparer quelque chose de spécial, qui nous donnera, espérons-le, un avantage temporaire sur le champ de bataille."
 EH_electric_traps: "Pièges électriques"
 EH_electric_traps_desc: "Avec des chocs électriques puissants et contrôlés, nous devrions pouvoir offrir à nos unités quelques minutes pour attaquer les troupes ennemies. La consommation d'énergie sera énorme : il faudra trouver un moyen de réduire l'usage d'électricité dans le pays, ou préparer de nouveaux sites de construction."
 EH_transfer_energy_from_civilian_sector: "Transférer de l'énergie du secteur civil"
 EH_transfer_energy_from_civilian_sector_desc: "Nous pompions trop d'énergie lorsque les pièges sont actifs. Les charger prend trop longtemps et nous ne pouvons pas attendre une semaine entière pour les réutiliser. Nous transférerons une partie de l'énergie du secteur public vers nos banques d'énergie."
 EH_invest_in_additional_power_sources: "Investir dans des sources d'énergie supplémentaires"
 EH_invest_in_additional_power_sources_desc: "La guerre ne peut pas peser encore davantage sur les civils. Nous lancerons un nouveau projet de réacteur pour établir une sécurité énergétique pour aujourd'hui et pour tous les autres jours."
 EH_reduce_energy_loss: "Réduire les pertes d'énergie"
 EH_reduce_energy_loss_desc: "Ces pièges pompent trop d'énergie. Ils sont efficaces, mais coûteux pour notre infrastructure. Nous ne pouvons pas diminuer leur puissance, mais nous pouvons limiter la consommation d'autres sources."
 EH_nation_remains_untouched: "La nation reste intacte"
 EH_nation_remains_untouched_desc: "Quoi que soient ces créatures, nous ne pouvons pas tout abandonner pour renforcer l'armée. Les gens continueront leur vie normale comme si rien de grave ne se passait..."
 EH_put_away_internal_problems: "Mettre de côté les problèmes internes"
 EH_put_away_internal_problems_desc: "Le protectionnisme de la patrie est actuellement l'objectif le plus important. Sans armée, il n'y aura plus de nation à protéger. Les gens devront gérer leurs problèmes eux-mêmes pendant que nous renforçons le militaire. Si l'armée échoue, la société aussi."
 EH_minimal_military_focus: "Focalisation militaire minimale"
 EH_minimal_military_focus_desc: "L'industrie civile est actuellement plus importante que la production de nouvelles armes. Si la guerre est loin de nous, il n'y a pas de raison de trop dépenser pour la défense."
 EH_high_military_focus: "Focalisation militaire élevée"
 EH_high_military_focus_desc: "L'ennemi se rapproche de notre capitale chaque jour. Nous ne pouvons pas baisser la garde et devons accélérer la production."
 EH_lower_conscription: "Conscription inférieure"
 EH_lower_conscription_desc: "D'autres nations perdent beaucoup d'effectifs, mais nos soldats patrouillent surtout nos frontières. Pas besoin d'en recruter davantage seulement pour dépenser plus pour l'armée."
 EH_extended_conscription: "Conscription prolongée"
 EH_extended_conscription_desc: "Tenir l'ennemi hors de nos frontières est la tâche la plus importante : nous ne pouvons plus perdre de terre !"
 EH_prioritize_corporations: "Prioriser les entreprises"
 EH_prioritize_corporations_desc: "La guerre ruinera notre économie. Il faut garder nos entreprises loyales à l'État pour ne pas nous retrouver dans de sérieux ennuis."
 EH_prioritize_military_companies: "Prioriser les entreprises militaires"
 EH_prioritize_military_companies_desc: "La recherche et l'augmentation de la production d'armes doivent être notre priorité. Sans fusils, nos hommes ne pourront pas combattre ces créatures impies."
 EH_a_new_resource: "Une nouvelle (?) ressource"
 EH_a_new_resource_desc: "Le Dr Lisa Randall étudie depuis un moment déjà une nouvelle ressource, la randallite. Avec son équipe, elle a découvert une endurance peu commune malgré une légèreté incroyable. Après la découverte de la randallite, d'autres nations ont constaté une diminution de [RESOURCE HERE]. Il est possible que les portails la transmutent en randallite. Peut-être est-ce la ressource courante de l'autre côté du portail ? Il nous faut davantage de recherches."
 EH_a_fine_addition_to_my_collection: "Un bel ajout à ma collection"
 EH_a_fine_addition_to_my_collection_desc: "La randallite sera un excellent composant pour armes et armures. Une fois équipés de randallite, nous pourrons peut-être repousser non seulement les créatures extra-terrestres, mais aussi d'autres nations."
 EH_first_hacs_prototype: "Premier prototype HACS"
 EH_first_hacs_prototype_desc: "Jaegers, Atlas, Evangelion et ainsi de suite. Les mechs de combat avancés n'étaient que fiction jusqu'à ce que les événements récents changent tout. Le High Agility Combat System (HACS) est un mech de combat opérationnel réel, construit uniquement grâce aux propriétés de la randallite. Le poids n'est plus un gros problème depuis que nous utilisons un alliage bien plus résistant que l'acier et plus léger que le magnésium. Avec cette technologie, nous pourrons enfin infliger des dégâts significatifs aux forces ennemies."
 EH_new_enemy_new_strategy: "Nouvel ennemi, nouvelle stratégie"
 EH_new_enemy_new_strategy_desc: "Les problèmes stupides exigent des solutions stupides, et c'est le plus stupide que nous ayons jamais rencontré. Les extra-terrestres se battent comme s'ils n'avaient pas peur d'être blessés, et c'est ce dont nous tirerons parti. L'armure des unités lourdes est très protectrice, mais pas impénétrable. Il faut gagner ce combat en étant plus rapides que les unités tanky, et plus forts que les créatures volantes. Autrement dit : plus de randallite, et des balles, évidemment."
 EH_more_mechs_less_weapons: "Plus de mechs, moins d'armes"
 EH_more_mechs_less_weapons_desc: "Les mechs sont nos seules armes efficaces contre ces créatures. Leur production prend beaucoup de temps, et le stock de randallite est limité. Il vaudra mieux reconvertir certaines usines pour aider à construire des pièces de mechs, plutôt que les armes d'origine."
 EH_more_weapons_less_mechs: "Plus d'armes, moins de mechs"
 EH_more_weapons_less_mechs_desc: "La production de mechs absorbe l'essentiel de nos ressources. Si nous poursuivons cette production à grande échelle, notre économie pourrait basculer dans la dépression et nous ne nous relèverions jamais de la dette. C'est le temps de la guerre, mais nous ne pouvons pas détruire notre économie pour ces nouvelles machines."
 EH_iron_man: "Homme de fer ?"
 EH_iron_man_desc: "Les premiers nouveaux mechs combattent déjà sur le champ de bataille. Le vrai combat a commencé, celui où nous avons enfin une chance contre les Envahisseurs. Certains commencent à spéculer jusqu'où cette technologie peut aller. Bien sûr, les fans de Marvel ont commencé à nous envoyer leurs plans d'armure Iron Man... au fond, pourquoi pas ?"
 EH_second_generation_hacs: "HACS de deuxième génération"
 EH_second_generation_hacs_desc: "Grâce aux plans de geeks et d'ingénieurs professionnels, nous sommes prêts à commencer à concevoir de nouveaux mechs un peu plus tôt. Visons une nouvelle grande étape !"
 EH_highly_purified_randallite: "Randallite hautement purifiée"
 EH_highly_purified_randallite_desc: "Nous n'avons jamais pris assez de temps pour nettoyer la randallite brute : la production était la priorité. Mais puisque nous en savons davantage sur cette ressource et que nous ne sommes plus aussi pressés de découvrir ses nouvelles propriétés, nous pouvons prendre le temps d'en maximiser l'efficacité."
 EH_increase_research_budget: "Augmenter le budget de recherche"
 EH_increase_research_budget_desc: "La deuxième génération de HACS a été un grand succès, mais nous ne pouvons pas nous reposer sur nos lauriers. L'humanité appellera toujours quelque chose de mieux, et c'est le moment de commencer à préparer la 3e génération."
 EH_third_generation_hacs: "HACS de troisième génération"
 EH_third_generation_hacs_desc: "Tout notre dur labeur a mené à cet instant. Des mois de recherche, d'essais et des milliards de notre budget : nous sommes prêts à livrer le plus grand mech de combat jamais vu dans l'histoire des mechs de combat !"
 EH_military_advantages: "Avantages militaires"
 EH_military_advantages_desc: "Il nous faut apprendre comment la randallite pourra aider nos troupes. Pendant que les mechs sont construits, nous avons plus de ce minerai que nous ne pouvons en dépenser pour les nouvelles machines. Il faut trouver d'autres usages."
 EH_ranjets: "Ranjets"
 EH_ranjets_desc: "La randallite nous a permis de construire les tout premiers mechs de combat. Elle est si légère que nous n'avons pas à nous limiter à cette seule nouvelle technologie. Cela résoudra bien des problèmes liés à la poussée et au poids des aéronefs. Des avions à coque plus légère pourront emporter davantage de cargo et d'armes, et nos jets seront encore plus manœuvrables qu'auparavant."
 EH_not_so_heavy_weapons: "Armes pas si lourdes"
 EH_not_so_heavy_weapons_desc: "Nous pouvons utiliser la randallite dans la production d'armes lourdes à la place de l'acier, du titane et d'autres matériaux. Les armes seront plus légères, et plus faciles à porter et à utiliser pour les soldats. Les camions consommeront moins de carburant au transport : tout le monde y gagne."
 EH_find_new_veins: "Trouver de nouvelles veines"
 EH_find_new_veins_desc: "De nombreux sites de ressources ont été remplacés par de la randallite. Nous ne savons pas comment ce processus progresse, mais ce peut être le bon moment de creuser davantage. Peut-être trouverons-nous plus de randallite sous terre."
 EH_more_precious_than_gold: "Plus précieux que l'or"
 EH_more_precious_than_gold_desc: "La randallite est déjà partout. D'immenses entreprises dépensent des milliards de dollars pour mettre la main dessus. C'est comme une ruée vers l'or d'antan, mais la randallite est bien plus utile. On peut en faire des outils courants, des machines et des armes, et ce n'est qu'une liste très raccourcie. Nous, l'État, devons en trouver autant que possible avant que des affaires cupides n'imposent un monopole sur l'extraction, la recherche et l'export. Il est dur de croire que nous devons réellement lutter contre notre propre nation, mais des restrictions pourraient être la conséquence finale si la situation échappe."
 EH_civilian_benefits: "Avantages civils"
 EH_civilian_benefits_desc: "Notre situation de guerre est stable, nous pouvons donc nous concentrer sur l'usage de la randallite dans l'espace public. Si la situation avec les Envahisseurs s'aggrave, nous pourrons toujours basculer vers la production militaire sans trop de difficultés."
 EH_a_wonderful_prosthesis: "Une merveilleuse prothèse"
 EH_a_wonderful_prosthesis_desc: "L'incroyable endurance et la légèreté de la randallite nous ont permis de construire un nouveau modèle de prothèse de jambe, rendant ses utilisateurs encore plus « en forme » qu'avec leur ancienne jambe. Il est temps de porter les extensions synthétiques du corps humain à un niveau cyberpunk !"
 EH_market_potential: "Potentiel de marché"
 EH_market_potential_desc: "Beaucoup de gens veulent mettre la main sur de la randallite. Puisque nous ne sommes plus dans l'urgence des projets militaires, nous pouvons commencer à en vendre aux investisseurs et à l'usage commercial. Les grandes entreprises remplaceront leurs machines par des modèles en randallite, réduisant la quantité de carburant utilisée dans le monde pour alimenter engins lourds et véhicules."
 EH_study_new_enemy: "Étudier un nouvel ennemi"
 EH_study_new_enemy_desc: "Après la frappe nucléaire sur le portail mystérieux, une sorte de nouvelles créatures a commencé à se répandre en cercle autour. Elles sont extrêmement agressives et attaquent tout ce qui bouge. Nous ne savons pas si nous pouvons les arrêter, mais s'il y a un moyen de se défendre, il faut le trouver au plus vite."
 EH_launch_orbital_scans: "Lancer des scans orbitaux"
 EH_launch_orbital_scans_desc: "Nous pouvons utiliser nos satellites pour étudier les manœuvres ennemies et apprendre leurs schémas de mouvement, s'ils en ont. Cela devrait aider nos stratèges à préparer des pièges et contre-tactiques plus efficaces."
 EH_find_the_weak_spots: "Trouver les points faibles"
 EH_find_the_weak_spots_desc: "Ces créatures peuvent être tuées. Après tout, elles sont faites de sang et de matière organique. Si nous parvenons à en amener une dans notre laboratoire, nous pourrions trouver leurs organes les plus cruciaux pour les étudier à notre avantage. Dès que nous les aurons identifiés, nous entraînerons nos soldats et systèmes de combat à les viser si possible."
 EH_disassemble_invader_armor: "Démonter l'armure de l'envahisseur"
 EH_disassemble_invader_armor_desc: "La plupart des Envahisseurs résistent à nos armes grâce à leur armure dure, semblable à de la chitine. Nous pouvons commencer des recherches pour en apprendre la structure et l'adapter à l'armure corporelle humaine. Peut-être cela rendra-t-il nos troupes un peu plus résistantes aux attaques ennemies."
 EH_portals_must_be_the_key: "Les portails doivent être la clé"
 EH_portals_must_be_the_key_desc: "Il nous faut davantage de renseignement sur le portail le plus proche, tout ce qui pourrait nous être utile. Ils résistent à une frappe nucléaire, mais rien n'est indestructible. Nous trouverons un moyen de les fermer, même s'il faut envoyer drones et aéronefs en missions suicides."
 EH_investigate_strange_structure: "Enquêter sur une structure étrange"
 EH_investigate_strange_structure_desc: "Nous avons remarqué un comportement étrange chez nos ennemis. Ils semblent construire quelque chose autour des portails, probablement pour les sécuriser. S'ils érigent une sorte de forteresse, il faut agir vite avant qu'ils ne les isolent complètement. Notre prochaine étape : préparer une mission de reconnaissance détaillée avec nos drones de combat. L'ennemi domine l'espace aérien : c'est plutôt une mission suicide, mais il faut espérer qu'au moins une machine parviendra à photographier cette structure et l'envoyer au commandement."
 EH_finding_their_vulnerability: "Trouver leur vulnérabilité"
 EH_finding_their_vulnerability_desc: "Avec des bombardements assez fréquents, nous pourrions trouver la faiblesse des composants dont cette structure est faite. Les points les plus cruciaux à vérifier sont la résistance à la chaleur et au souffle, et la corrosion toxique. Impossible de tester leur densité au gel, mais nous pouvons observer le comportement d'autres matériaux issus de ces monstres face aux basses températures."
 EH_but_how_does_this_key_work: "Mais comment fonctionne cette clé ?"
 EH_but_how_does_this_key_work_desc: "Ces portails mènent à une autre dimension, c'est certain. Que ce soit le Monde à l'envers, une Anti-Terre ou autre chose, il doit y avoir quelque chose qui permet d'ouvrir et de maintenir la connexion. Comprendre comment ils s'y prennent peut être important pour saisir leur nature, leur fonctionnement, et peut-être, avec un peu de chance, trouver un moyen de perturber le travail et de rompre cette connexion."
 EH_project_tesla: "Projet T.E.S.L.A."
 EH_project_tesla_desc: "Le Tactical Electromagnetic System of Linear Annihilation sera notre plus grande chance de montrer aux monstres qui commande vraiment ici. Une fois l'arme prête, nous la tirerons sur le portail le plus proche. Si notre théorie est juste, l'impulsion électromagnétique devrait être assez forte pour interrompre les connexions et, peut-être, le fermer — temporairement, ou définitivement."
 EH_whole_new_dawn: "Une toute nouvelle aube"
 EH_whole_new_dawn_desc: "Nous savons tout ce qu'il faut pour fermer les portails. Tant que nous nous tenons au plan, nous devrions être assez forts pour enfin mettre fin à cette guerre."
