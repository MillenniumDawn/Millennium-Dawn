 BOS_mechanization_of_the_army_desc: "Защищенная мобильность позволит небольшой армии быстро перебрасывать резервы и выживать на современном поле боя."
 BOS_boots_on_the_ground_desc: "Босния может сосредоточить свою оборону на подготовленной пехоте, укрепленных позициях и обширном резерве, а не на дорогостоящей технике."
 BOS_national_high_command_desc: "Объединенное верховное командование подчинит армии субъектов национальной гражданской власти и установит общие стандарты планирования."
 BOS_aerial_dominance_desc: "В рамках программы развития боевой авиации приоритетное внимание будет уделяться боеготовности истребителей, качеству подготовки пилотов и контролю воздушного пространства Боснии."
 BOS_transportation_methods_desc: "Современные служебные транспортные средства и логистические процедуры позволят повысить скорость развертывания и сократить перебои в поставках."
 BOS_rifle_advancements_desc: "Современные служебные винтовки, бронежилеты и методы производства повысят эффективность пехоты и улучшат внутреннее снабжение."
 BOS_wave_tactics_desc: "Доктрина, предполагающая преобладание резервистов, будет использовать концентрированные пехотные формирования для удержания позиций и отражения продолжительного давления."
 BOS_civilian_training_desc: "Расширенная программа подготовки резервистов позволит подготовить гражданских лиц к мобилизации без необходимости содержать непомерно большие по стоимости постоянные войска."
 BOS_restoration_of_old_aircraft_desc: "Ремонт унаследованных вертолетов и восстановление авиабазы позволят восстановить ограниченные возможности транспортной авиации."
 BOS_aircraft_acquiring_desc: "Российские истребители предлагают быстрый путь к боевой авиации, хотя затраты на их приобретение и размещение лягут тяжелым бременем на бюджет."
 BOS_personal_carriers_desc: "Боевые машины пехоты завершат переход от моторизованного транспорта к бронированным общевойсковым подразделениям."
 BOS_resupply_equipment_desc: "Современные радиостанции, вспомогательное вооружение и логистическое оборудование позволят подразделениям на передовой стать более самодостаточными."
 BOS_artillery_refurbishment_desc: "Модернизация унаследованных орудий и стандартизация боеприпасов позволят восстановить надежную огневую поддержку."
 BOS_small_arms_purchase_desc: "Иностранные винтовки могут восполнить непосредственный дефицит в запасах, пока идёт реорганизация отечественного производства."
 BOS_mobilization_requirements_desc: "Четко определенные обязательства по резерву и процедуры призыва позволят правительству расширить армию во время чрезвычайной ситуации."
 BOS_combine_the_armies_desc: "Полная интеграция позволит устранить параллельные структуры управления и создать единую национальную систему командования."
 BOS_great_level_of_cooperation_desc: "Формирования образований могут сохранять свои отличительные традиции, одновременно переходя к совместному планированию, подготовке и закупкам."
 BOS_the_land_fleet_desc: "Единые стандарты техники позволят свести транспортные машины, бронетранспортёры и машины обеспечения в механизированные силы, удобные в обслуживании."
 BOS_main_battle_line_desc: "Противотанковое вооружение и мобильные резервы позволят Боснии противостоять более тяжелым формированиям без необходимости финансирования крупного танкового парка."
 BOS_streamline_production_desc: "Стандартизированные контракты и методы сборки позволят снизить стоимость поставок пехотного снаряжения."
 BOS_provide_equipment_updates_desc: "Регулярный цикл модернизации позволит обеспечить совместимость винтовок и вспомогательного вооружения во всех родах войск."
 BOS_general_staff_reforms_desc: "Профессиональное планирование, единые штабные процедуры и современное защитное снаряжение заменят импровизацию военного времени."
 BOS_aerial_cooperation_desc: "Командования противовоздушной обороны и авиации будут обмениваться данными наблюдения, планами размещения баз и оперативным управлением."
 BOS_officer_training_desc: "Национальная программа подготовки офицеров позволит сформировать профессиональный корпус, лояльный государственным учреждениям, а не командованию отдельных структур."
 BOS_military_drills_desc: "Совместные учения проверят новую структуру командования и выявят оставшиеся недостатки в координации."
 BOS_prepping_an_offensive_desc: "Офицеры штаба определят решающее направление наступления и создадут запасы снабжения перед следующим этапом гражданской войны."
 BOS_bosnian_elections_desc: "Глобальный финансовый кризис обнажил зависимость Боснии от иностранных кредитов, слабый экспорт и разобщенность институтов. Правительство должно выбрать политику восстановления до того, как экономический спад затянется надолго."
 BOS_economic_revision_desc: "Необходимо пересмотреть налоговую политику, чтобы обеспечить финансирование восстановления экономики без подавления инвестиций или спроса со стороны домохозяйств."
 BOS_post_war_effort_desc: "Незавершенная реконструкция, перемещенные общины и поврежденные учреждения по-прежнему сдерживают развитие спустя годы после войны."
 BOS_rally_the_troops_desc: "Местные командиры отзовут резервистов и восстановят подразделения, ослабленные в ходе первых боев."
 BOS_commence_the_offensives_desc: "Скоординированные атаки позволят использовать подготовку, проведенную нашими полевыми командованиями, и вынудить противника покинуть ключевые позиции."
 BOS_dig_in_desc: "Укрепленные позиции и подготовленные линии обороны позволят сохранить наши силы в случае, если наступление застопорится."
 BOS_detain_serbian_generals_desc: "Привлечение к ответственности офицеров, обвиняемых в военных преступлениях, укрепит международное доверие и верховенство права, но усилит сопротивление в Республике Сербской."
 BOS_release_serbian_generals_desc: "Освобождение задержанных сербских офицеров будет способствовать примирению с Республикой Сербской и Сербией, несмотря на критику со стороны групп, защищающих права жертв."
 BOS_grant_more_rights_to_serbian_peoples_desc: "Более надёжные гарантии представительства сербов могут снизить сепаратистское давление и направить инвестиции в обделённые вниманием общины."
 BOS_oppress_serbian_back_supports_desc: "Иностранные автопроизводители могут создавать рабочие места и обеспечивать производственный капитал, но именно их влияние будет определять промышленную политику Боснии."
 BOS_the_state_desc: "Необходимы компетентные национальные институты для координации восстановительных работ с соблюдением конституционного разделения властей в Боснии."
 BOS_grant_herzegovinians_more_rights_desc: "Увеличение финансирования полиции улучшит безопасность и правоприменение на местном уровне, хотя дополнительные расходы лягут бременем на национальный бюджет."
 BOS_limit_herzegovinians_desc: "Сокращение расходов на полицию позволит сохранить государственные средства, но ослабление контроля может способствовать расширению организованной преступности."
 BOS_mobilize_the_nation_desc: "Экстренная мобилизация позволит расширить резерв подготовленных кадров для замены военнослужащих."
 BOS_request_military_supplies_desc: "Турция и Албания могут предоставить пехотное вооружение, но каждое правительство само решит, сможет ли оно выделить это оборудование."
 BOS_bosnians_will_lead_the_military_desc: "Гражданское национальное командование завершит программу восстановления, направленную на интеграцию, и прекратит действие чрезвычайных финансовых мер."
 BOS_anti_serbian_propaganda_desc: "Национализация иностранных промышленных предприятий расширит государственный контроль, но нанесет ущерб доверию инвесторов и отношениям с Германией."
 BOS_improve_road_quality_in_sarajevo_desc: "Ремонт дорожной сети Сараево позволит восстановить транспортную связь между районами, сократить задержки грузоперевозок и поддержать дальнейшие инвестиции в сектор услуг."
 BOS_improvement_of_the_health_care_system_desc: "Введение национального стандарта здравоохранения расширит доступ к медицинским услугам и заменит разрозненную послевоенную систему."
 BOS_secure_regional_support_for_government_desc: "Стабильному правительству необходимо сотрудничество руководителей муниципалитетов и образований, а не только парламентское большинство в Сараево."
 BOS_crackdown_of_anti_war_propaganda_desc: "Военная цензура и контрпропаганда будут поддерживать общественную решимость за счет открытых политических дебатов."
 BOS_formation_of_a_junta_desc: "Военный совет может навязать единство в военных действиях, но гражданские институты потеряют контроль над государством."
 BOS_removal_of_the_dayton_accords_desc: "Реформирование Дейтонской системы позволит передать больше ответственности национальным институтам, сохранив при этом гарантии, предусмотренные мирным соглашением."
 BOS_post_war_clean_up_desc: "Расчистка руин, неразорвавшихся боеприпасов и заброшенных участков подготовит пострадавшие регионы к восстановлению."
 BOS_improve_service_industry_desc: "Современные офисы, надежные коммунальные услуги и более низкие налоги для бизнеса помогут Сараево развить конкурентоспособную экономику в сфере услуг."
 BOS_improvement_of_the_education_system_desc: "Единые образовательные стандарты и улучшение качества школ позволят повысить квалификацию и ограничить коррупцию в государственном управлении."
 BOS_banja_luka_mine_desc: "Современное оборудование и стандарты безопасности могут вернуть горнодобывающую отрасль Баня-Луки к прибыльному производству."
 BOS_farming_sector_desc: "Разминирование и инвестиции в сельское хозяйство помогут семейным фермам модернизироваться и поставлять продукцию на внутренний рынок."
 BOS_end_nato_desc: "Исламистское правительство бросит вызов региональной позиции НАТО и будет готовиться к конфронтации, которую, возможно, не сможет контролировать."
 BOS_national_appeasement_desc: "Программа примирения улучшит отношения между боснийцами, хорватами и сербами и обяжет правительство к мирной конституционной реформе."
 BOS_role_the_dice_desc: "Лидеры Сербской могут добиться быстрой консолидации, смирившись с серьезной нестабильностью и возобновлением риска гражданского конфликта."
 BOS_popular_support_desc: "Согласованный мандат, полученный от всех трёх государствообразующих народов, обеспечит правительству под руководством Республики Сербской более безопасный путь к реформам."
 BOS_develop_national_sentiment_desc: "Последовательная патриотическая кампания укрепит военный режим и сохранит национальную мобилизацию в целости."
 BOS_land_mine_removal_desc: "Национальная программа разминирования позволит составить карту заминированных территорий, обучить группы сапёров и снизить продолжающиеся человеческие жертвы войны."
 BOS_rebuild_infrastructure_in_sarajevo_desc: "Реконструкция Сараево позволит укрепить столичную электросеть и вновь открыть железнодорожный вокзал, что свидетельствует о том, что восстановление экономики страны остается приоритетной задачей."
 BOS_rebuild_infrastructure_in_srpska_desc: "Восстановление электросети в Баня-Луке и железнодорожного вокзала в Биелине позволит связать населенные пункты Республики Сербской с национальными рынками и учреждениями."
 BOS_rebuild_infrastructure_in_herzegovina_desc: "Укреплённая электросеть и действующий железнодорожный терминал в Герцеговине улучшат транспортное сообщение с Мостаром и оживят торговлю на юге страны."
 BOS_build_a_war_memorials_desc: "Мемориалы будут посвящены жертвам среди гражданского населения и военнослужащих, а также предоставят населенным пунктам места для публичного поминовения."
 BOS_make_way_for_more_industry_desc: "Горнодобывающая промышленность и сельское хозяйство могут способствовать развитию более широкой сельской промышленной базы, если оба сектора получат необходимую подготовку."
 BOS_military_industrialization_desc: "Завод по производству вооружений в Сараево с просчитанной сметой поддержит перевооружение — при условии, что экономика сможет обеспечить его кадрами и финансированием."
 BOS_autonomy_advancements_desc: "Предоставление Герцеговине и Республике Сербской статуса автономных субъектов формализует самоуправление образований в составе Боснии."
 BOS_cooperative_effort_desc: "Программа сотрудничества, выдвинутая Республикой Сербской, позволит сохранить федеральные институты и добиться сближения с Востоком на основе согласия, а не принуждения."
 BOS_removal_of_lands_in_herzegovina_desc: "Группы разминирования вновь откроют заминированные земли в Герцеговине для заселения, сельского хозяйства и транспорта."
 BOS_removal_of_lands_in_central_bosnia_desc: "Разминирование центральной Боснии позволит защитить густонаселенные районы и восстановить плодородные земли."
 BOS_removal_of_lands_in_central_srpska_desc: "Разминирование в центральной части Республики Сербской позволит обеспечить безопасность пострадавших сельских районов для восстановления."
 BOS_rebuild_factories_in_sarajevo_desc: "Восстановленный гражданский завод и сопутствующая инфраструктура позволят возобновить занятость в промышленности Сараево."
 BOS_the_repair_of_srpska_and_herzegovina_desc: "Сбалансированные инвестиции в промышленность и инфраструктуру в Сербской и Герцеговине продемонстрируют, что восстановление экономики распространяется за пределы Сараево."
 BOS_national_unrest_desc: "Снижение стабильности и межобщинная враждебность открыли профсоюзным организациям путь для противостояния обоим националистическим блокам."
 BOS_state_opposition_desc: "Гражданская оппозиция будет противостоять националистическим партиям Сербской на выборах, балансируя между федеральной властью и риском дальнейшего отчуждения сербских избирателей."
 BOS_eastern_trade_bloc_desc: "Взаимные торговые соглашения с Россией и Сербией позволят преобразовать политическое сближение в устойчивый коммерческий доступ."
 BOS_commence_centralization_desc: "Власти Сербской передадут полномочия образования центральному правительству и подавят конкурирующие конституционные центры."
 BOS_national_agenda_desc: "Общая законодательная программа будет сочетать в себе социальную стабильность, фискальную реформу и признание интересов всех трех составляющих народов."
 BOS_final_land_mine_removal_efforts_desc: "Координация региональных программ позволит разминировать оставшиеся обозначенные на карте минные поля и завершить послевоенную кампанию по разминированию в Боснии."
 BOS_workers_front_desc: "Рабочий фронт объединит недовольные профсоюзы в национальную политическую силу со своей собственной экономической программой."
 BOS_national_unity_desc: "После согласованного переходного периода эти образования вернутся под прямое национальное управление, восстановив плюралистическое федеративное государство."
 BOS_cooperative_alliance_desc: "Россия решит, оправдывает ли восточное партнерство Боснии вступление в ОДКБ."
 BOS_introduction_of_mandatory_conscription_desc: "Обязательная служба увеличит размер резерва за счет увеличения обязательств для домохозяйств и работодателей."
 BOS_decrease_poverty_rate_desc: "Целенаправленные социальные расходы позволят сократить бедность и стабилизировать положение общин, оказавшихся в неблагоприятном положении в период послевоенного восстановления."
 BOS_the_teachings_of_orthodox_desc: "Сотрудничество с православным духовенством укрепит восточный общественный договор, одновременно вытесняя исламские институты из государственного управления."
 BOS_concessions_to_the_work_unions_new_desc: "Обязывающее соглашение с профсоюзами обменяет социальные расходы и права работников на политическую стабильность."
 BOS_puppet_economics_new_desc: "Рабочие советы получат официальную роль в управлении, а финансирование новой системы будет осуществляться за счет более высоких корпоративных налогов."
 BOS_religious_identity_desc: "Исламистское государство будет претендовать на лидерство в боснийских общинах за пределами своих границ и разрабатывать принудительную региональную политику."
 BOS_tax_reforms_desc: "Снижение ставок налога на домохозяйства и корпорации расширит политическую поддержку, но при этом сократит непосредственные доходы государства."
 BOS_state_atheism_new_desc: "Рабочее правительство лишит государственные учреждения религиозных привилегий, получив административную свободу за счет духовенства."
 BOS_mechanical_production_new_desc: "Механизированное производство и техническая подготовка повысят производительность труда и завершат индустриальный переход экономики, ориентированной на трудящихся."
 BOS_land_doctrine_desc: "Боснии необходима оборонительная доктрина, адаптированная к горной местности, ограниченным людским ресурсам и скромному бюджету на закупки."
