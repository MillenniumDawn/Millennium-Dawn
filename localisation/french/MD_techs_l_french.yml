 module_surface_diesel_power_1_desc: "Les diesels améliorés offrent une meilleure efficacité énergétique et fiabilité, permettant des déploiements plus longs et des hausses de vitesse modérées.\n\n§GIndice du concepteur : la propulsion diesel offre une vitesse et une portée maximale modestes à faible coût de production. Convient aux flottes côtières et régionales abordables, mais augmente carburant et visibilité de surface.§!"
