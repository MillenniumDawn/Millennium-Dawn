 airborne_armor: "공수 기갑"
 module_anti_submarine_missile_1: "대잠 미사일 I"
 module_anti_submarine_missile_1_desc: "초기 대잠 미사일 체계는 함선이 원거리에서 잠수함과 교전할 수 있게 하여, 전통적인 폭뢰를 넘어 함대의 수중 방어를 개선합니다.\n\n§G설계 힌트: 이 모듈은 대잠수함전 능력치를 높여 주지만 IC 비용이 증가합니다.§!"
 module_anti_submarine_missile_2: "대잠 미사일 II"
 module_anti_submarine_missile_2_desc: "개량된 대잠 미사일은 향상된 유도 및 추진 체계를 갖추어 현대식 잠수함에 대한 명중 확률을 높이고 교전 사거리를 늘립니다.\n\n§G설계 힌트: 이 모듈은 대잠수함전 능력치를 높여 주지만 IC 비용이 증가합니다.§!"
 module_anti_submarine_missile_3: "대잠 미사일 III"
 module_anti_submarine_missile_3_desc: "현대식 대잠 미사일 체계는 첨단 조준 체계와 더 빠른 속도를 도입하여 회피하거나 은밀한 잠수함을 안정적으로 요격할 수 있게 합니다.\n\n§G설계 힌트: 이 모듈은 대잠수함전 능력치를 높여 주지만 IC 비용이 증가합니다.§!"
 module_anti_submarine_missile_4: "대잠 미사일 IV"
 module_anti_submarine_missile_4_desc: "고도로 발전한 대잠 미사일은 정교한 센서, 대대응책 체계, 연장된 사거리를 활용하여 뛰어난 수중 위협 무력화 능력을 제공합니다.\n\n§G설계 힌트: 이 모듈은 대잠수함전 능력치를 높여 주지만 IC 비용이 증가합니다.§!"
 module_anti_submarine_missile_5: "대잠 미사일 V"
 module_anti_submarine_missile_5_desc: "차세대 대잠 미사일은 은밀성, 지능 보조 유도, 극한의 사거리를 강조하여 광대한 작전 해역에서 효과적인 잠수함 차단을 가능하게 합니다.\n\n§G설계 힌트: 이 모듈은 대잠수함전 능력치를 높여 주지만 IC 비용이 증가합니다.§!"
 module_anti_submarine_missile_6: "대잠 미사일 VI"
 module_anti_submarine_missile_6_desc: "근미래 대잠 미사일은 대잠수함전의 정점으로서 인공지능 유도, 고속, 견고한 대대응책 체계를 결합합니다.\n\n§G설계 힌트: 이 모듈은 대잠수함전 능력치를 높여 주지만 IC 비용이 증가합니다.§!"
 module_anti_submarine_missile_7: "대잠 미사일 VII"
 module_anti_submarine_missile_7_desc: "하이퍼 첨단 대잠 미사일은 대잠수함전의 정점으로서 인공지능 유도, 고속, 견고한 대대응책 체계를 결합합니다.\n\n§G설계 힌트: 이 모듈은 대잠수함전 능력치를 높여 주지만 IC 비용이 증가합니다.§!"
 module_anti_submarine_missile_8: "대잠 미사일 VIII"
 module_anti_submarine_missile_8_desc: "울트라 첨단 대잠 미사일은 대잠수함전의 정점으로서 인공지능 유도, 고속, 견고한 대대응책 체계를 결합합니다.\n\n§G설계 힌트: 이 모듈은 대잠수함전 능력치를 높여 주지만 IC 비용이 증가합니다.§!"
 module_vls_asm_1: "VLS 대함 미사일 I"
 module_vls_asm_1_desc: "초기 VLS 기반 대함 미사일 체계는 군함이 방호된 수직 발사 셀에서 원거리 무기를 발사할 수 있게 합니다. 이는 전통적인 갑판 탑재 발사기에 비해 생존성과 교전 유연성을 높입니다.\n\n§G설계 힌트: 이 모듈은 대함 공격력과 대함 관통력, 그리고 체력을 높여 주지만 IC 비용이 증가합니다.§!"
 module_vls_asm_2: "VLS 대함 미사일 II"
 module_vls_asm_2_desc: "개량된 VLS 대함 미사일은 향상된 유도 체계와 늘어난 사거리를 갖추어, 수직 발사 통합의 이점을 유지하면서 수상 표적에 대한 더 안정적인 타격을 가능하게 합니다.\n\n§G설계 힌트: 이 모듈은 대함 공격력과 대함 관통력, 그리고 체력을 높여 주지만 IC 비용이 증가합니다.§!"
 module_vls_asm_3: "VLS 대함 미사일 III"
 module_vls_asm_3_desc: "현대식 VLS 대함 미사일 체계는 첨단 탐색기와 해면 밀착 비행 궤적을 통합하여 협동 장거리 공격과 적 대응책에 대한 저항력 향상을 가능하게 합니다.\n\n§G설계 힌트: 이 모듈은 대함 공격력과 대함 관통력, 그리고 체력을 높여 주지만 IC 비용이 증가합니다.§!"
 module_vls_asm_4: "VLS 대함 미사일 IV"
 module_vls_asm_4_desc: "고도로 발전한 VLS 대함 미사일은 네트워크 조준과 정밀 유도를 활용하여 신속한 다중 표적 교전과 현대 해군 방어 체계에 대한 향상된 효과를 가능하게 합니다.\n\n§G설계 힌트: 이 모듈은 대함 공격력과 대함 관통력, 그리고 체력을 높여 주지만 IC 비용이 증가합니다.§!"
 module_vls_asm_5: "VLS 대함 미사일 V"
 module_vls_asm_5_desc: "차세대 VLS 대함 미사일 플랫폼은 은밀성, 기동성, 전자전 저항력을 강조하여 분쟁 환경에서의 생존성과 타격 성공률을 크게 높입니다.\n\n§G설계 힌트: 이 모듈은 대함 공격력과 대함 관통력, 그리고 체력을 높여 주지만 IC 비용이 증가합니다.§!"
 module_vls_asm_6: "VLS 대함 미사일 VI"
 module_vls_asm_6_desc: "최첨단 VLS 대함 미사일 체계는 해군 타격 기술의 정점으로서 지능형 조준, 극한의 속도, 첨단 대응책 저항력을 결합하여 가장 정교한 함대조차 압도합니다.\n\n§G설계 힌트: 이 모듈은 대함 공격력과 대함 관통력, 그리고 체력을 높여 주지만 IC 비용이 증가합니다.§!"
 module_vls_asm_7: "VLS 대함 미사일 VII"
 module_vls_asm_7_desc: "하이퍼 첨단 VLS 대함 미사일 체계는 해군 타격 기술의 정점으로서 지능형 조준, 극한의 속도, 첨단 대응책 저항력을 결합하여 가장 정교한 함대조차 압도합니다.\n\n§G설계 힌트: 이 모듈은 대함 공격력과 대함 관통력, 그리고 체력을 높여 주지만 IC 비용이 증가합니다.§!"
 module_vls_asm_8: "VLS 대함 미사일 VIII"
 module_vls_asm_8_desc: "울트라 첨단 VLS 대함 미사일 체계는 해군 타격 기술의 정점으로서 지능형 조준, 극한의 속도, 첨단 대응책 저항력을 결합하여 가장 정교한 함대조차 압도합니다.\n\n§G설계 힌트: 이 모듈은 대함 공격력과 대함 관통력, 그리고 체력을 높여 주지만 IC 비용이 증가합니다.§!"
 module_naval_vls_drone_swarm_1: "VLS 드론 군집 I"
 module_naval_vls_drone_swarm_1_desc: "수직 발사 드론 군집은 함선이 정찰, 기만, 종말 공격 지원을 위한 다수의 무인 플랫폼을 신속히 전개할 수 있게 하며, 협동 비행 궤적과 분산 감지로 방어 체계를 압도합니다.\n\n§G설계 힌트: VLS 드론 군집은 높은 파급력의 포화 효과와 유연한 임무 활용성을 얻는 대신 더 많은 자원을 요구합니다.§!"
