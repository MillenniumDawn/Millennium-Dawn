 UNITS_VIEW_BTN_DRAW_OFFENCE: "§HLinia ofensywna§!\n§GKliknij prawym przyciskiem myszy i przytrzymaj przycisk myszy§! na mapie, aby narysować §YLinię ofensywną§!.\nLinie można wyznaczać tylko na terytorium, do którego przypisano §HLinię frontu§! lub §Hdesant morski§!\n\nBrygady przypisane do planu uwzględniającego linię natarcia będą starały się zająć terytorium, aby przesunąć tam swoją linię frontu.\n\n§GPrzytrzymaj przycisk myszy§! i §Gzwolnij§! go na przycisku określającym sposób wykonania, aby zmienić typ realizacji planu."
 UNITS_VIEW_BTN_DRAW_DEFENCE: "§HLinia frontu§!\n - §GKliknij§! na jedną z granic z innym państwem, aby wyznaczyć linię frontu wzdłuż całej tej granicy.\n - §GKliknij prawym przyciskiem myszy i przeciągnij§! wzdłuż granicy z innym państwem, aby wyznaczyć linię frontu na krótszym odcinku.\n - §GKliknij prawym przyciskiem myszy i przeciągnij§! końce istniejącej linii frontu, aby je edytować.\n\nLinie frontu stanowią punkt wyjścia dla ataków na terytorium wroga w kierunku linii ofensywnych, a także pozwalają na szybkie rozmieszczenie brygad wzdłuż granicy z innym państwem."
 UNITS_VIEW_BTN_DRAW_DEFENCE_ARMY_GROUP: "§HLinia frontu§!\n - §GKliknij§! na granicy z innym państwem, aby wyznaczyć linię frontu wzdłuż całej tej granicy.\n - §GShift + kliknięcie§! na granicy z innym państwem pozwala wyznaczyć linię frontu wzdłuż całej granicy, z pominięciem podziału na odcinki dla poszczególnych pododdziałów.\n - §GKliknij prawym przyciskiem myszy i przeciągnij§! wzdłuż granicy z innym państwem, aby wyznaczyć linię frontu na wybranym, krótszym odcinku.\n - §GShift + kliknięcie prawym przyciskiem myszy i przeciągnięcie§! wzdłuż granicy z innym państwem pozwala wyznaczyć linię frontu na wybranym, krótszym odcinku, z pominięciem podziału na odcinki dla poszczególnych pododdziałów.\n - §GKliknij prawym przyciskiem myszy i przeciągnij§! końce istniejącej linii frontu, aby dokonać ich edycji.\n\nLinie frontu stanowią punkt wyjścia do ataków na terytorium wroga w kierunku wyznaczonych linii ofensywnych; umożliwiają również szybkie rozmieszczenie brygad wzdłuż granicy z innym państwem."
 UNITS_VIEW_BTN_DRAW_FALLBACK: "§HLinia odwrotu§!\n – §GKliknij prawym przyciskiem myszy i przeciągnij§! w obrębie własnego terytorium, aby wyznaczyć §Yjednorazowy§! rozkaz obronny.\n\nLinie odwrotu przydają się do ustawiania brygad w celach obronnych – na przykład za rzeką lub w innym miejscu na własnym terytorium."
 UNITS_VIEW_BTN_AREA_DEFENSE: "§HObrona obszaru§!\n – §GKliknij§! na stany, aby dodać je do rozkazu dla armii lub usunąć je z niego.\nArmia z tym rozkazem nie może jednocześnie wykonywać innych typów zadań.\n\nBrygady przydzielone do armii z tym rozkazem zostaną rozmieszczone na wyznaczonym obszarze, aby chronić ważne miasta, porty lub inne obiekty, a także reagować na niewielkie siły wroga."
 UNITS_VIEW_BTN_UNASSIGN_HQ_ONLY: "§RNie można przydzielić jednostek §YSztabu armii§! spoza ich armii. Zamiast tego wycofaj §YSztab armii§!.§!"
 UNITS_VIEW_BTN_UNASSIGN_MIXED_HQ_NOTE: "Jednostki §YKwatery głównej armiiY§! w zaznaczeniu zostaną zignorowane."
 UNITS_VIEW_BTN_UNITS_ASSIGN: "§HTryb przydzielania brygad§!\nNaciśnij ten przycisk, aby przełączyć tryb, lub przytrzymaj klawisz §GCTRL§!.\nNastępnie wybierz jeden z wyróżnionych frontów, aby przydzielić do niego aktualnie wybrane brygady."
 UNITS_VIEW_BTN_UNITS_UNASSIGN: "§HAnuluj przydział brygad§!\nNaciśnij ten przycisk, aby anulować przydział aktualnie wybranych brygad do ich rozkazów."
