 SIA_committed_to_ballot: "致力于选举"
 SIA_bhumjaithai_coalition: "§Y[Neutral_conservatism_L]§!在权力平衡中占优。"
 SIA_tt_peace_dialogue_intensity: "要求泰南叛乱强度降至50以下"
 SIA_tt_shan_militia_support: "需要掸邦民兵支持度至少达到60。"
 SIA_tt_reform_pressure: "需要改革压力高于20。"
 SIA_tt_populist_tide_20: "需要民粹浪潮高于20。"
 SIA_tt_palace_bargain_support: "需要玛希敦王室集团在选举中获得超过15%的选票。"
 SIA_tt_china_contracts_renegotiated: "与中国的合同尚未重新谈判。"
 SIA_tt_us_security_reviewed: "美泰安全审查尚未结束。"
 SIA_tt_tax_modernized: "税收征收尚未实现现代化。"
 SIA_tt_gripen_ef_contracted: "“鹰狮”E/F合同尚未签署。"
 SIA_the_quiet_word: "沉默的话语"
 SIA_the_quiet_word_desc: "来自正确办公室的一通电话，便能起到曾经坦克所能起的作用。这张网络清楚地表明，究竟谁才是这个国家真正的主宰，而这一信息传递出去，不费一枪一弹。"
 SIA_judicial_review_route: "禁令式治理"
 SIA_judicial_review_route_desc: "宪法法院找到了一条技术性理由，执政党一夜之间被解散。没有军营，没有宵禁，只有一份裁决和一次极为平静的权力移交。"
 SIA_the_appointed_senate: "精心挑选"
 SIA_the_appointed_senate_desc: "二百五十个从未经任何选举产生的席位，由恩荫网安排，并仅对其负责。如今，每一届政府都只能在上议院的默许下进行统治。"
 SIA_coalition_kingmakers: "造王者联盟"
 SIA_coalition_kingmakers_desc: "内阁席位、预算分配，以及对关键权力掮客的私下暗示，共同构建了一个首先效忠于宫廷网络、其次才对选民负责的政府。"
 SIA_constitutional_engineering: "制定章程"
 SIA_constitutional_engineering_desc: "一部在委员会会议室而非枪口下起草的新宪法，将恩荫网的优势锁定为国家基本法律。这整个过程无需一兵一卒。"
 SIA_the_establishment_consensus: "体制共识"
 SIA_the_establishment_consensus_desc: "法院、参议院、军队和商业如今已融为一体，选举沦为形式，恩荫网总是赢得胜利。没有人需要调动坦克。"
 SIA_judicial_review_route_choice_tt: "选择宪法法院裁决的影响范围。\n- §Y完全解散§!：削弱政党声望，但加剧改革压力\n- §Y有限的技术性裁决§!：代价较小"
 SIA_coalition_kingmakers_choice_tt: "选择联盟伙伴。\n- §Y地方权力掮客§!：用国库收买\n- §Y商业精英§!：以微小的稳定度代价进行拉拢"
 SIA_royalist_no_coup_path: "已选择不发动政变的保皇派路线（恩荫君主制）"
 SIA_establishment_category: "建制管理"
 SIA_establishment_category_desc: "无需政变的恩荫君主制工具：指定的参议院、配合的法官席，以及宫廷自身的说服渠道。"
 SIA_senate_procedural_vote: "发起程序性表决"
 SIA_senate_procedural_vote_desc: "将任命产生的议院鞭策到同一阵线，以支持一项民选议院绝不会通过的法案。这需要消耗政治资本，但投票结果从未有过悬念。§G稳定度提升。§!"
 SIA_court_referral: "提交法院"
 SIA_court_referral_desc: "将民粹主义者最新的策略交由一个持同情立场的法官席处理，让裁决去完成选举所不愿完成的工作。§R执政党的支持率下降，但这一策略使用得越多，就越会助长改革压力。§!"
 SIA_palace_audience: "请求觐见"
 SIA_palace_audience_desc: "一次正式觐见，使军队与旧式地主家族相信，恩荫网络仍在为他们发声。§G军方与地主阶层的民意支持度提升。§!"
 thailand.434.t: "法庭裁决"
 thailand.434.d: "宪法法院就执政党的行为作出裁决。法庭上的每个人都已经清楚结果会如何。"
 thailand.434.a: "直接解散"
 thailand.434.b: "将裁决限定在技术性问题"
 thailand.435.t: "造王者交易"
 thailand.435.d: "组建一个恩荫网络能够接受的政府意味着要付钱给某些人。唯一的问题是给谁，以及以何种货币支付。"
 thailand.435.a: "买通地方官员"
 thailand.435.b: "拉拢商界精英"
 SIA_no_lar_dlc_tt: "需要“抵抗运动”DLC才能体验完整的情报机构机制。取而代之的是提供政治点数。"
 SIA_the_national_intelligence: "国家情报局"
 SIA_the_national_intelligence_desc: "如今，一个国家情报机构凌驾于曾为争夺同一情报而相互竞争的警察、军事和民政部门之上。成立这一机构耗资巨大，而被其整合的各部门也不会轻易放弃自己的地盘。"
 SIA_special_branch_police: "特别行动处"
 SIA_special_branch_police_desc: "专职的政治与反恐警察部门使国家对颠覆活动和社会动荡保持更敏锐的警觉。警员们期望经费与职权相匹配，而这种期望在部门成立后并不会消失。"
 SIA_counter_insurgency_south: "南方之火"
 SIA_counter_insurgency_south_desc: "情报资产向南部署至北大年、也拉和那拉提瓦的叛乱地区，追捕那些仅凭军队之力永远无法完整绘制的网络。这场镇压行动在武装分子面前赢得了地面优势，但所付出的代价却是这几个府的耐心。"
 SIA_signals_intelligence: "监听国家"
 SIA_signals_intelligence_desc: "一个信号与密码学部门为泰国提供了监听本地区无线电波与网络的“耳朵”。密码破译员和服务器群是一项持续支出，永远不会关闭。"
 SIA_humint_networks: "知情人员"
 SIA_humint_networks_desc: "情报官与受薪线人构建起一张卫星无法替代的跨境人际网络。以这种方式招募和运作间谍是一项昂贵且不风光的工作，它消耗的是政治资本，而非喧嚣的喝彩。"
 SIA_cia_partnership: "兰利联络处"
 SIA_cia_partnership_desc: "与中央情报局建立正式联络渠道，以对华盛顿的倾斜换取情报准入与培训。每一条通向兰利的线路，都是兰利可以双向读取的线路。"
 SIA_mss_cooperation: "与国安部合作"
 SIA_mss_cooperation_desc: "与中国国家安全部之间建立低调联系，以倾向北京换取合作。这一关系深化了中泰联系，但也带来了任何外国联络所固有的双向风险。"
 SIA_the_watchful_state: "监视之国"
 SIA_the_watchful_state_desc: "国内治安与对外情报已合并为一个常设安全机构，其触角因新增的部门升级和前线特工而进一步延伸。维持其运转如今已成为预算中的一项固定支出。"
 SIA_surveillance_state: "圆形监狱"
 SIA_surveillance_state_desc: "情报机构的职责已被扩张至极限，侦查与防谍能力提升至法律允许的顶点，甚至更进一步。企业界在严密监视下日益不满，国库消耗着政治资本，而稳定则为这一切买单。"
 SIA_accountable_oversight: "法治原则"
 SIA_accountable_oversight_desc: "司法审查、议会监督和公开报告要求被附加于情报机构之上——以削弱其纯粹的侦查权力为代价，换取合法性与更低程度的腐败。情报部门因此变得更迟钝、不再无所不知，但也因而对除自身以外的其他方面负责。"
 SIA_national_intelligence_idea: "国家情报学说"
 SIA_national_intelligence_idea_desc: "新情报机构的创始精神在官僚体系中蔓延：信息即权力，如今每个部门都将信息向上传递。这种时刻警惕的习惯将超越任何一届在任政府而持续存在。"
 SIA_territorial_defense: "本土防御学说"
 SIA_territorial_defense_desc: "王国的士兵接受训练，旨在坚守阵地而非追逐目标。部队构筑工事，工程人员勘察边境以规划永久防御设施，防御学说在武装力量中全面确立，强化步兵素质，并在第一声枪响之前加速堡垒建设。"
 SIA_shorad_defense: "短程防空"
 SIA_shorad_defense_desc: "短程导弹、雷达制导近防炮和加固的防空阵地交织成一张层层叠叠的防护网。闯入泰国领空的敌机会发现每一条进攻路线都已被预先锁入射界，每一座炮台都已严阵以待。"
 SIA_border_fortification_program: "边境要塞计划"
 SIA_border_fortification_program_desc: "工程兵团获得了一项常设任务和一份常设预算：沿整个边境进行勘测、浇筑和构筑工事，包括漫长且防守薄弱的老挝边境，以便新工事更快建成，驻守部队无论何处都能更坚固地防守。"
 SIA_anti_amphibious_command: "两栖防御指挥部"
 SIA_anti_amphibious_command_desc: "专门的指挥部研究入侵者可能使用的每一处海滩和河口。海岸炮台、层层布设的传感器以及训练有素的快速反应部队，使得任何试图在王国海岸登陆的行动都成为一场血腥且毫无把握的赌博。"
 SIA_defend_myanmar_border: "加强缅甸边防"
 SIA_defend_myanmar_border_desc: "缅甸边境的崎岖西线贯穿王国全境。碉堡防线和预设阵地深挖于山口与河谷之中，将原本险峻的地形化作一道坚不可摧的壁垒。"
 SIA_defend_cambodia_border: "加强柬埔寨边防"
 SIA_defend_cambodia_border_desc: "柏威夏寺冲突的记忆依然历历在目。东部边境已用新建工事加固，确保未来任何争端都不会让王国的士兵暴露在旷野之中。"
 SIA_defend_malaysia_border: "加强马来西亚边防"
 SIA_defend_malaysia_border_desc: "躁动不安的泰南地区遍布碉堡和防御据点，牢牢锚定与马来西亚的边界，为北大年的驻军提供了坚实的后撤依托。"
 SIA_fortress_thailand: "堡垒泰国"
 SIA_fortress_thailand_desc: "每一条边境都有壁垒，每一处接近路都布有火力。在本土作战，泰军部队以熟悉地形的防御者之自信，出击并坚守。入侵者在酷暑、山丘与无尽的预设防线中逐渐流血耗尽。"
 SIA_defend_myanmar_border_tt: "在§Y9§!个边境地区立即建造§Y二级§!陆地要塞。\n - §Y泰国北部§!：4个地区\n - §Y泰国中部§!：2个地区\n - §Y泰国南部§!：3个地区"
 SIA_defend_cambodia_border_tt: "在§Y6§!个边境地区立即建造§Y二级§!陆地要塞。\n - §Y泰国中部§!：3个地区\n - §Y依善地区§!：3个地区"
 SIA_defend_malaysia_border_tt: "在§Y5§!个边境地区立即建造§Y二级§!陆地要塞。\n - §Y北大年§!：4个地区\n - §Y泰国南部§!：1个地区"
 SIA_sovereign_wealth_fund_allocation: "分配主权财富基金"
 SIA_sovereign_wealth_fund_allocation_desc: "将另一批资源特许权使用费直接投入主权基金的海外投资组合。这笔配置将资金锁定一年，之后其收益才开始回流至预算。"
 SIA_state_resource_stake: "获取国家资源股份"
 SIA_state_resource_stake_desc: "财政部直接购入采矿和能源特许经营权，而非仅仅征税。现金来得快，同样快的还有那些没人愿意细看的文书工作。"
 thailand.436.t: "脱离中等收入陷阱"
 thailand.436.d: "统计学家证实：泰国已经跨越了那个困扰其邻国一代人的收入门槛。曾经为他人组装零件的工厂如今开始自行设计。内阁现在将讨论如何把握这一时刻。"
 thailand.436.a: "播报成就"
 thailand.436.b: "将余裕存入银行"
 SIA_the_army_question: "军队问题"
 SIA_the_army_question_desc: "每几百名士兵就配一名将军，晋升靠出身和派系而非功绩，军饷账单被与国防毫无关系的企业养得臃肿不堪。王国的军队能运转，但并非靠打仗。总得有人来决定这支军队究竟该成为什么样子。"
 SIA_the_professional_turn: "专业化转向"
 SIA_the_professional_turn_desc: "更少的士兵，更好的训练，凭功绩而非调动名单用人。这是一条更艰难的道路，也让每一位有私心要维护的将领都心生警惕。"
 SIA_the_reshuffle_list: "重组名单并非战争计划"
 SIA_the_reshuffle_list_desc: "年度人事调动是泰国皇家武装力量真正的运行节奏——如今，其签署权归于文职部长而非军营自身的算计。军事系统开始对当届政府负责。"
 SIA_retire_the_experts: "让“顾问”退休"
 SIA_retire_the_experts_desc: "每一位高级退役人员都理应获得一个额外的“专家”或“特别顾问”将官衔位，无论该岗位是否实际履行职责。以买断方式安置这些荣誉将军，并随之撤销这些虚设职位。"
 SIA_close_the_ledger: "清理军队资产"
 SIA_close_the_ledger_desc: "军队电视台、高尔夫球场、土地持有以及那些依靠士兵无薪劳动维持的福利项目，均移交文职管理机构管理。军营生活规模缩小，预算也回归真实面貌。"
 SIA_break_the_class_ladder: "开放晋升阶梯"
 SIA_break_the_class_ladder_desc: "按军校期数和归属旺贴万派系或东方之虎派系来决定升迁的做法，让位于依据军功记录晋升的制度。旧有的关系网因此丧失了对下一任指挥官的掌控。"
 SIA_all_volunteer_force: "完全志愿兵役制"
 SIA_all_volunteer_force_desc: "军队完全由自愿参军者组成：训练更精良，组织更严密，且薪酬与付出相称。一支能力全面的部队，全面“吃皇粮”，国库将长期承担这笔开支。"
 SIA_the_elite_spearhead: "精锐先锋"
 SIA_the_elite_spearhead_desc: "与其全面专业化整个军队，不如集中投资。打造一支小而精的特种部队，装备昂贵、维持费用高昂，却能在战场上发挥远超其规模的力量。"
 SIA_high_readiness_army: "高度戒备部队"
 SIA_high_readiness_army_desc: "常设部队始终保持临战状态——受训充分、计划周全、并在接敌之前完成侦察。维持这样的战备水平从来都不便宜，但这意味着，最终投入战场的军队战力将符合期望。"
 SIA_the_minister_decides: "将军建议，文官决定"
 SIA_the_minister_decides_desc: "最高统帅部仍在会议桌上占有一席之地，但决策由文官部长制定，由将领们执行。这是旧派势力抵抗最激烈的一项改革，也是让其他所有改革得以稳固的关键。"
 SIA_the_conscript_host: "动员兵大军"
 SIA_the_conscript_host_desc: "数量胜过精兵。更广泛的征兵能以低廉成本充实兵员，国库不再因臃肿的职业军人薪资而失血，而军官团则保留其已享有的一切特权。"
 SIA_fill_the_quota: "完成配额"
 SIA_fill_the_quota_desc: "年度征兵抽签深入到了更广的适龄人口池中。更多的名字被抽中，意味着更多的军靴有人穿，也意味着穿上这身军装的门槛降低了。"
 SIA_the_boys_in_black: "黑衣男孩归来"
 SIA_the_boys_in_black_desc: "“塔汉普兰”志愿边境巡逻队的规模扩大了一倍。他们薪饷微薄，就地招募，守卫着边疆村落，在那些比任何正规部队都更熟悉的土地上，让入侵者付出血的代价。"
 SIA_or_sor_grid: "本乡民团"
 SIA_or_sor_grid_desc: "乡村防卫志愿队——“奥索”部队，正以村为单位在农村各地陆续组建。这是一张不需要补给线的民兵网络，因为它从不离开家园。"
 SIA_cheap_steel_many_hulls: "降本增量"
 SIA_cheap_steel_many_hulls_desc: "从泰国本土装备而非外国产品为大规模部队提供武器装备。这套装备更为简朴，锋芒稍钝，但兵工厂生产速度快、成本低廉。"
 SIA_the_barracks_economy: "兵营经济"
 SIA_the_barracks_economy_desc: "让将军们的生意为动员买单，而非与之对抗。从灰色渠道到高尔夫球场，再到其余的资产组合，它们都对战争资金敞开了账簿，现在掏钱，日后便可消灾。"
 SIA_reserve_of_the_realm: "王国后备军"
 SIA_reserve_of_the_realm_desc: "每一位曾身着军装者皆已登记在册、追踪在案，随时可应召重返。预备役名册不断扩充，征召流程更为迅捷，然而代价是训练体系更加简化以应对此局面。"
 SIA_the_old_guard_endures: "军部永恒"
 SIA_the_old_guard_endures_desc: "大规模常备军已成为永久建制，军饷开支终于被控制在国库所能承受的范围之内，与之并行的军官团体系也随之固定下来。文人治军，从此不在讨论之列。老兵们只是学会了量入为出。"
 SIA_swf_windfall: "主权基金红利"
 SIA_swf_windfall_desc: "今年的拨款正在产生回报。这些收益为预算提供了缓冲，直至该头寸被逐步结清。"
