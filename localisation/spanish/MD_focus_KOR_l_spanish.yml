 KOR_local_production: "Producción nacional de acero"
 KOR_local_production_desc: "Trasladar una mayor parte de la producción a la patria reducirá la dependencia y mejorará la resiliencia en tiempos de guerra."
 KOR_worlds_second: "World's Second Steel Giant"
