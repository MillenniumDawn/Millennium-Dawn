 MBT_desc: "Основной боевой танк (ОБТ), также известный как боевой или универсальный танк, — танк, выполняющий во многих современных армиях роль защищённой бронёй машины для огня прямой наводкой и манёвра."
 MBT_1: "ОБТ 1965 года"
 MBT_1_desc: "Достижения начала холодной войны в области двигателей, подвески и более лёгкой композитной брони дали танкам огневую мощь и броню сверхтяжёлых танков и подвижность лёгких. Получив обозначение «основные боевые танки», они вытеснили практически все остальные танки, кроме специализированных лёгких разведывательных танков. ОБТ обладают тяжёлой бронёй и высокой подвижностью на равнинной местности и обеспечивают армии мощными возможностями огня прямой наводкой."
 MBT_2: "ОБТ 1975 года"
 MBT_2_desc: "По мере того как противотанковые ракеты становились всё эффективнее, а вертолёты превратились в неотъемлемую часть поля боя, в конструкцию основного боевого танка были внедрены новые типы многослойной композитной керамической брони. Улучшенные дальномеры и системы управления огнём повысили вероятность попадания с первого выстрела, а автоматы заряжания позволили уменьшить размеры башни, сократив площадь цели для противника. ОБТ обладают тяжёлой бронёй и высокой подвижностью на равнинной местности и обеспечивают армии мощными возможностями огня прямой наводкой."
 MBT_3: "ОБТ 1985 года"
 MBT_3_desc: "Компьютеризированные стабилизированные системы управления огнём дают возможность вести огонь с ходу, повышая вероятность попадания с первого выстрела. Тепловизионные прицелы улучшают обнаружение. Газотурбинные или современные дизельные двигатели обеспечивают более высокую длительную мощность, а легкозаменяемая динамическая защита (ДЗ) значительно повышает живучесть основных боевых танков. ОБТ обладают тяжёлой бронёй и высокой подвижностью на равнинной местности и обеспечивают армии мощными возможностями огня прямой наводкой."
 MBT_4: "ОБТ 1995 года"
 MBT_4_desc: "В связи с растущей угрозой ПТУР, работающих по принципу «выстрелил и забыл», внедряются комплексы активной защиты. В сочетании с системами пассивных помех это делает танк лучше приспособленным к противодействию ракетным атакам. Сварные башни вместо литых повышают качество брони танка. Дальнейшее совершенствование лазерных дальномеров позволяет подрывать осколочные снаряды на заданном расстоянии для поражения пехоты. ОБТ обладают тяжёлой бронёй и высокой подвижностью на равнинной местности и обеспечивают армии мощными возможностями огня прямой наводкой."
 MBT_5: "ОБТ 2015 года"
 MBT_5_desc: "Благодаря полностью автоматизированной, цифровой и необитаемой башне экипаж танка размещён в бронированной капсуле в передней части корпуса, что значительно повышает его живучесть и снижает силуэт танка. Новое поколение комплексов активной защиты и радаров улучшает защиту от ракет, атакующих сверху, и снарядов с обеднённым ураном. ОБТ обладают тяжёлой бронёй и высокой подвижностью на равнинной местности и обеспечивают армии мощными возможностями огня прямой наводкой."
 MBT_7: "ОБТ 2025 года"
 MBT_7_desc: "Добавление нанотрубок в состав композитной брони улучшает защиту и позволяет значительно снизить массу. Автоматизация всех систем основного боевого танка делает наличие оператора необязательным, что позволяет изменить форму корпуса для уменьшения эффективной площади рассеяния; вместе с радиопоглощающими материалами и мощной системой охлаждения выхлопа это придаёт танку характеристики частичной малозаметности. ОБТ обладают тяжёлой бронёй и высокой подвижностью на равнинной местности и обеспечивают армии мощными возможностями огня прямой наводкой."
 MBT_8: "ОБТ 2035 года"
 MBT_8_desc: "Многослойная графеновая броня для бронетехники обеспечивает защиту при беспрецедентно малой массе и способна к самовосстановлению с помощью нанороботов. Благодаря литий-воздушным аккумуляторам и электродвигателю тепловое излучение танка сводится практически к нулю, а вместе с адаптивным инфракрасным камуфляжем это делает его практически неотслеживаемым для ракетных систем с электронным наведением. ОБТ обладают тяжёлой бронёй и высокой подвижностью на равнинной местности и обеспечивают армии мощными возможностями огня прямой наводкой."
 mbt_equipment_0: "ОБТ 1965 года"
 mbt_equipment_1: "ОБТ 1975 года"
 mbt_equipment_2: "ОБТ 1995 года"
 mbt_equipment_3: "ОБТ 2015 года"
 mbt_equipment_4: "ОБТ 2035 года"
 Rec_tank_desc: "Бронированная разведка — это сочетание наземной разведки с бронетехникой, осуществляемое солдатами с использованием танков, а также колёсных или гусеничных разведывательных бронемашин."
 Rec_tank_0: "Разведывательный танк 1965 года"
 Rec_tank_0_desc: "Лёгкие танки, основа армий Второй мировой войны, теперь применяются лишь во второстепенных ролях — там, где масса и размеры основных боевых танков не позволяют их использовать. Лёгкие танки состоят на вооружении наиболее тяжело бронированных разведывательных подразделений; кроме того, их можно десантировать с воздуха, и они часто используются как плавающие. Нередко их создают на базе корпусов БМП, а не разрабатывают с нуля. В сложной местности, например в горах и лесах, они действуют гораздо лучше основных боевых танков."
