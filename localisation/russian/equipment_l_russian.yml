 USA_MBT_4: "M1A2 Abrams"
 USA_MBT_4_desc: "Производство началось в 1986 году, на вооружение танк поступил в 1992 году (77 построено для США, более 600 M1 модернизировано до M1A2, 315 — для Саудовской Аравии, 218 — для Кувейта). M1A2 даёт командиру танка независимый тепловизионный прицел и возможность в быстрой последовательности поражать две цели без необходимости поочерёдно захватывать каждую, а также компоненты брони из обеднённого урана 2-го поколения."
 USA_MBT_4_short: "M1A2"
 USA_MBT_5: "M1A2 SEPv3 Abrams"
 USA_MBT_5_desc: "В стандартную комплектацию добавлены дистанционно управляемый боевой модуль CROWS, цветные дисплеи, улучшенные интерфейсы, новая операционная система, усиленная лобовая и бортовая броня с динамической защитой (комплект TUSK), телефон для связи танка с пехотой в стандартной комплектации и модернизированная трансмиссия с повышенным ресурсом."
