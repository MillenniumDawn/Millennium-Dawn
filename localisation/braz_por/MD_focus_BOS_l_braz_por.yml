 BOS_bnttmih_mio_trait_gun_125_m84:0 "Canhão de 125mm do M-84"
 BOS_bnttmih_mio_trait_gun_100_t55:0 "Canhão de 100mm do T-55"
 BOS_bnttmih_mio_trait_m84_recoilless:0 "Canhão Sem Recuo M84"
 BOS_bnttmih_mio_trait_at_gun_100:0 "Canhão Antitanque de 100mm"
 BOS_bnttmih_mio_trait_mountain_gun_100:0 "Canhão de Montanha de 100mm"
 BOS_croat_secession_crisis:0 "Crise de Secessão Croata"
 BOS_croat_secession_crisis_desc:0 "As instituições da Herceg-Bosna redigem legislação de retirada e treinam suas próprias unidades. Se as queixas croatas não forem atendidas antes que o impasse se esgote, o sul se separa em armas."
 BOS_dayton_two:0 "Acordo de Dayton Revisado"
 BOS_dayton_two_desc:0 "Um acordo constitucional renegociado trocou maior autonomia das entidades pelo fim dos combates. Compra estabilidade, ao custo de um centro mais frouxo."
 BOS_srpska_secession_crisis_opens_tt:0 "A República Srpska abre uma crise de secessão. Se não for resolvida antes que o prazo se esgote, a entidade vai à guerra."
 BOS_croat_secession_crisis_opens_tt:0 "A Herceg-Bosna abre uma crise de secessão. Eleve a Confiança Croata a Amistosa antes que o prazo se esgote para manter o sul no país."
 bos_srpska_reconciliation_full_tt:0 "A Confiança Sérvia no governo é redefinida para Hostil, pois a entidade volta por completo à autoridade central."
 bos_srpska_negotiated_autonomy_tt:0 "A Confiança Sérvia no governo é definida como Amistosa sob os termos da autonomia negociada."
 BOS_croat_deescalation_hint_tt:0 "Eleve a Confiança Croata a Amistosa por meio das decisões das facções para aliviar a crise antes que ela expire."
 BOS_rotate_presidency_hint_tt:0 "Use a decisão Realizar uma Rotação Presidencial para passar a presidência e redefinir a paciência da comunidade que aguarda."
 BOS_croat_neutrality_pact_honored_tt:0 "O Pacto de Neutralidade Croata se mantém. A Herceg-Bosna fica fora da guerra e não se separa."
 BOS_political.82.t:0 "República Srpska Se Prepara para Se Separar"
 BOS_political.82.d:0 "A assembleia da entidade marcou uma data para se retirar das instituições estatais. Ainda há uma janela estreita para trazê-la de volta antes que a independência seja declarada de vez."
 BOS_political.82.a:0 "Encontrar um modo de desarmar a situação"
 BOS_political.83.t:0 "Herzegovina Ameaça Se Separar"
 BOS_political.83.d:0 "Líderes croatas no sul avançam rumo à secessão, citando anos de derrotas nas urnas. Reparar as relações agora é a única forma de mantê-los no país."
 BOS_political.83.a:0 "Aproximar-se da comunidade croata"
 BOS_political.84.t:0 "A Rotação da Presidência Emperra"
 BOS_political.84.d:0 "A vaga deveria mudar de mãos, mas a transferência continua sendo adiada. A comunidade que espera sua vez começa a ver o atraso como deliberado."
 BOS_political.84.a:0 "Tomar nota da frustração deles"
 BOS_offer_amnesty:0 "Oferecer Anistia"
 BOS_offer_amnesty_desc:0 "Estender anistia aos combatentes que depuserem as armas. Firma o apoio da comunidade sérvia, mas é visto como fraqueza no front interno."
 BOS_forced_requisition:0 "Requisição Forçada"
 BOS_forced_requisition_desc:0 "Confiscar suprimentos e material das entidades para financiar o esforço de guerra. Enche o tesouro e endurece o ressentimento sérvio."
 BOS_sign_croat_neutrality_pact:0 "Assinar o Pacto de Neutralidade Croata"
 BOS_sign_croat_neutrality_pact_desc:0 "Garantir a autonomia croata em troca de sua neutralidade. Se uma tomada de poder islâmica se seguir, a Herzegovina permanecerá no país em vez de se fragmentar."
 BOS_canton_pressure_campaign:0 "Campanha de Pressão sobre os Cantões"
 BOS_canton_pressure_campaign_desc:0 "Pressionar os cantões bósnios muçulmanos e croatas a se alinharem ao programa central. Estabiliza o Estado à custa da boa vontade de ambas as comunidades."
 BOS_serbian_alignment_overtures:0 "Aproximação com o Alinhamento Sérvio"
 BOS_serbian_alignment_overtures_desc:0 "Aprofundar os laços políticos e econômicos com Belgrado. A influência sérvia na Bósnia cresce, a comunidade sérvia se aproxima do governo e a paciência dos bósnios muçulmanos se esgota."
 BOS_srpska_supremacy_measures:0 "Medidas de Supremacia Sérvia"
 BOS_srpska_supremacy_measures_desc:0 "Promover as prioridades nacionalistas e de segurança sérvias na política e nas instituições do governo."
 BOS_bosniak_governing_partner:0 "Parceiro de Governo Bósnio Muçulmano"
 BOS_bosniak_governing_partner_desc:0 "Um parceiro bósnio muçulmano leal mantém a política de coalizão estável e reduz a agitação."
 BOS_croat_governing_partner:0 "Parceiro de Governo Croata"
 BOS_croat_governing_partner_desc:0 "Um parceiro croata leal apoia a reforma econômica, mas reduz a flexibilidade da coalizão interna."
 BOS_srpska_governing_partner:0 "Parceiro de Governo Sérvio"
 BOS_srpska_governing_partner_desc:0 "Um parceiro sérvio leal melhora a cooperação em segurança, mas enfraquece a supervisão federal."
 BOS_reconstruction_dividends:0 "Dividendos da Reconstrução"
 BOS_reconstruction_dividends_desc:0 "Uma coalizão pós-guerra que coopera com os programas de reconstrução pode gerar ganhos econômicos de curto prazo."
 BOS_governing_partner_dividends_tt:0 "§GSe nosso parceiro de coalizão no governo for leal:§! a reconstrução rende dividendos por 180 dias."
 BOS_internal_faction_balance_stability_tt:0 "§YConfiança das comunidades:§! cada comunidade abaixo de §R25§! de Confiança aplica §R-15%§! de Estabilidade nacional, cada uma acima de §G50§! concede §G+5%§!, cada uma acima de §G74§! concede §G+10%§!."
 BOS_internal_faction_balance_manpower_tt:0 "§YMão de obra das comunidades:§! cada comunidade abaixo de §R25§! de Mão de Obra aplica §R-15%§! de população recrutável, cada uma acima de §G50§! concede §G+15%§!, cada uma acima de §G74§! concede §G+20%§!."
 BOS_revanchism_peacekeepers_warning_tt:0 "§YNota:§! as forças de paz da EUFOR devem deixar o país antes que o Despertar Nacional possa prosseguir."
 BOS_national_awakening_consequences_tt:0 "§RIsso nos compromete com a guerra contra a República Srpska. Se depois declararmos a tomada de poder islâmica, o governo se torna islamista e a Herzegovina se separa com parte do exército.§!"
 BOS_islamic_takeover_consequences_tt:0 "§RO governo se torna islamista e a Herzegovina se separa, levando parte do exército consigo.§!"
 BOS_eufor_withdrawal_threat:0 "A Bósnia exige a retirada da EUFOR"
 BOS_csto_accept_tt:0 "A Bósnia ingressa na OTSC ao nosso lado."
 BOS_csto_reject_tt:0 "Recusamos o pedido de adesão da Bósnia à OTSC."
 BOS_euro_defence_accept_tt:0 "Estendemos uma garantia de defesa à Bósnia e a missão da EUFOR se encerra."
 BOS_euro_defence_decline_tt:0 "Recusamos garantir a segurança da Bósnia."
 BOS_events.56.t:0 "Bloco Bósnio Muçulmano Pressiona por Autoridade Central"
 BOS_events.56.d:0 "Partidos bósnios muçulmanos no parlamento estatal pressionam para fortalecer as instituições centrais às custas das entidades, e esperam que o governo os apoie."
 BOS_events.56.a:0 "Apoiar o impulso centralizador"
 BOS_events.56.b:0 "Manter a linha com as entidades"
 BOS_events.56.c:0 "Financiar o desenvolvimento da Federação em vez disso"
 BOS_events.57.t:0 "Bloco Croata Exige Garantias para as Entidades"
 BOS_events.57.d:0 "Líderes croatas na Herzegovina querem garantias mais firmes para a representação croata, alertando que sem elas obstruirão as instituições estatais."
 BOS_events.57.a:0 "Acomodar o bloco croata"
 BOS_events.57.b:0 "Recusar novas garantias"
 BOS_events.57.c:0 "Investir na Herzegovina em vez disso"
 BOS_events.58.t:0 "República Srpska Exige Competências"
 BOS_events.58.d:0 "Banja Luka volta a exigir que os poderes transferidos ao Estado sejam devolvidos à entidade, apresentando isso como uma questão do acordo de Dayton."
 BOS_events.58.a:0 "Negociar uma transferência limitada"
 BOS_events.58.b:0 "Rejeitar a exigência de imediato"
 BOS_events.58.c:0 "Devolver poderes de receita à entidade"
 BOS_events.61.t:0 "Uma Oferta Chinesa para a República Srpska"
 BOS_events.61.d:0 "O governo liderado pela Srpska quer aprovar um projeto de infraestrutura financiado pela China na entidade. Pequim ganha uma posição, e os partidos bósnios muçulmanos de Sarajevo desconfiam das condições embutidas."
 BOS_events.61.a:0 "Aprovar o projeto"
 BOS_events.61.b:0 "Bloquear o financiamento"
 BOS_events.62.t:0 "Pressão por Autonomia Fiscal"
 BOS_events.62.d:0 "Com um croata à frente do governo, os líderes da Herzegovina pressionam por mais uma transferência de poderes de receita, uma terceira entidade em tudo menos no nome."
 BOS_events.62.a:0 "Devolver os poderes"
 BOS_events.62.b:0 "Manter o controle fiscal centralizado"
 BOS_events.63.t:0 "Ampliando o Orçamento Central"
 BOS_events.63.d:0 "O governo liderado pelos bósnios muçulmanos quer ampliar o orçamento central, financiando instituições estatais que as entidades há muito deixam à míngua. Banja Luka ressentirá cada marco conversível."
 BOS_events.63.a:0 "Ampliar o orçamento"
 BOS_events.63.b:0 "Deixar o orçamento como está"
 BOS_events.64.t:0 "Os Ônibus Continuam Partindo"
 BOS_events.64.d:0 "A emigração tornou-se impossível de ignorar. Turnos inteiros ficam sem preencher e jovens famílias vendem tudo. Programas de empregos, subsídios de retenção de jovens, a ligação comercial do Corredor Vc e as remessas da diáspora são as alavancas que podem frear a saída."
 BOS_events.64.a:0 "Devemos manter nosso povo em casa"
 BOS_events.65.t:0 "Um País Se Esvaziando"
 BOS_events.65.d:0 "O êxodo chegou ao ponto de crise. Clínicas fecham por falta de enfermeiros e vilarejos ficam meio vazios. Só um trabalho sustentado em programas de empregos, subsídios de retenção de jovens, na ligação do Corredor Vc e nas remessas reduzirá a pressão."
 BOS_events.65.a:0 "Reverter o declínio"
 BOS_entity_competency_transfer:0 "Competências das Entidades Devolvidas"
 BOS_entity_competency_transfer_desc:0 "Poderes de arrecadação foram repassados à entidade, comprando calma política ao custo de um governo central mais lento e mais contestado."
 BOS_corruption_hits_weakest_tt:0 "§RA comunidade com menor confiança no governo perde ainda mais terreno quando o escândalo estoura.§!"
 BOS_eu_accession_push:0 "Impulso à Adesão Europeia"
 BOS_eu_accession_push_desc:0 "Com o status formal de candidata garantido e todas as comunidades apoiando a candidatura, impulsionar a agenda de adesão. Credores internacionais recompensam o ímpeto e a confiança no governo reformista sobe."
 BOS_electoral_reform_package:0 "Pacote de Reforma Eleitoral"
 BOS_electoral_reform_package_desc:0 "Quando todas as comunidades confiarem no Estado, a estrutura discriminatória da presidência poderá enfim ser substituída. Acabar com o sistema de cotas étnicas elimina a ameaça de secessão que pairava sobre o antigo cargo rotativo, mantendo seus benefícios de estabilidade."
 BOS_open_balkan_initiative:0 "Iniciativa Open Balkan"
 BOS_open_balkan_initiative_desc:0 "Ingressar no mercado regional liderado pela Sérvia, de livre circulação de bens, mão de obra e capital. Belgrado ganha influência em Sarajevo, mas os representantes sérvios recebem bem os laços mais estreitos e as pequenas empresas prosperam."
 BOS_berlin_process_commitment:0 "Compromisso com o Processo de Berlim"
 BOS_berlin_process_commitment_desc:0 "Ancorar a cooperação regional no Processo de Berlim, patrocinado pela Alemanha, em vez de na órbita de Belgrado. O caminho pró-europeu tranquiliza os parceiros croatas e bósnios muçulmanos e abre a porta ao financiamento ocidental."
 BOS_confront_entity_obstruction:0 "Enfrentar a Obstrução das Entidades"
 BOS_confront_entity_obstruction_desc:0 "A República Srpska passou anos bloqueando as instituições estatais e ameaçando se retirar. Decida se vai enfrentar a obstrução de frente ou comprar calma com concessões."
 BOS_energy_transition_strategy:0 "Estratégia de Transição Energética"
 BOS_energy_transition_strategy_desc:0 "Ir além da divisão entre carvão e hidrelétrica com capacidade renovável distribuída por ambas as entidades. Projetos compartilhados tranquilizam as comunidades croata e sérvia e dão aos jovens trabalhadores um motivo para ficar."
 BOS_digital_diaspora_economy:0 "Economia Digital da Diáspora"
 BOS_digital_diaspora_economy_desc:0 "Conectar o setor de tecnologia à grande comunidade emigrada no exterior. O trabalho remoto e o retorno de talentos aliviam a pressão da emigração e conquistam pequenos e médios empresários."
 BOS_census_2023:0 "O Censo de 2023"
 BOS_census_2023_desc:0 "Realizar o censo populacional há muito adiado. Os resultados resolverão as disputas sobre os números de cada comunidade, mas o povo que o governo enfatizar se sentirá reconhecido à custa de um rival."
 BOS_eu_candidacy_momentum:0 "Ímpeto da Candidatura à UE"
 BOS_eu_candidacy_momentum_desc:0 "O status formal de candidata energizou o campo reformista e firmou a confiança pública no governo."
 BOS_reformed_presidency:0 "Presidência Reformada"
 BOS_reformed_presidency_desc:0 "A presidência étnica rotativa foi substituída por um sistema aberto a todos os cidadãos. A governança é mais calma e mais legítima, e a ameaça constante de secessão das entidades diminuiu."
 BOS_open_balkan_market:0 "Mercado Open Balkan"
 BOS_open_balkan_market_desc:0 "A participação no mercado regional ampliou as oportunidades de exportação das empresas bósnias a um custo modesto para o consumo interno."
 BOS_digital_economy_idea:0 "Economia Digital"
 BOS_digital_economy_idea_desc:0 "O investimento em conectividade e software elevou a produção de pesquisa e ajudou as fábricas a adotar práticas modernas."
 BOS_events.66.t:0 "Obstrução das Entidades"
 BOS_events.66.d:0 "A liderança da República Srpska voltou a bloquear a legislação estatal e ventilou a retirada das instituições federais. O governo deve responder antes que a paralisia se espalhe."
 BOS_events.66.a:0 "Adotar linha dura"
 BOS_events.66.b:0 "Oferecer concessões"
 BOS_events.67.t:0 "O Censo de 2023"
 BOS_events.67.d:0 "Os números do censo estão prontos para publicação. Os líderes de cada comunidade pressionam para que seus números sejam destacados nos resultados oficiais."
 BOS_events.67.a:0 "Enfatizar a contagem bósnia muçulmana"
 BOS_events.67.b:0 "Enfatizar a contagem croata"
 BOS_events.67.c:0 "Enfatizar a contagem sérvia"
 BOS_confront_entity_obstruction_choice_tt:0 "§YAbre uma escolha: confrontar a República Srpska diretamente ou buscar acomodação.§!"
 BOS_hardline_rs_crisis_warning_tt:0 "§RSe a confiança sérvia cair abaixo de 25 enquanto Milorad Dodik liderar a República Srpska, o impasse pode escalar para uma crise de secessão.§!"
 BOS_reformed_presidency_tt:0 "§GSubstitui a presidência rotativa ativa pela Presidência Reformada, encerrando o risco de secessão e mantendo seus benefícios de estabilidade.§!"
 BOS_emigration_eased_energy_tt:0 "§GPressão de Emigração reduzida em 5.§!"
 BOS_emigration_eased_digital_tt:0 "§GPressão de Emigração reduzida em 10.§!"
 BOS_digital_diaspora_synergy_tt:0 "§GAs remessas da diáspora financiam uma nova fábrica civil sem custo para o tesouro.§!"
 RSK_requisition_the_mines:0 "Requisitar as Minas"
 RSK_requisition_the_mines_desc:0 "Confiscar a produção das minas da Entidade para o cofre de guerra. Os trabalhadores não vão nos agradecer."
 RSK_appeal_to_belgrade:0 "Apelar a Belgrado"
 RSK_appeal_to_belgrade_desc:0 "Pedir à Sérvia que apoie abertamente a Entidade, elevando o moral e aquecendo as relações com Belgrado."
 HZG_war_levy:0 "Taxa de Guerra da Herzegovina"
 HZG_war_levy_desc:0 "Impor uma taxa de emergência aos cantões para financiar a guerra. A estabilidade sofrerá."
 HZG_appeal_to_zagreb:0 "Apelar a Zagreb"
 HZG_appeal_to_zagreb_desc:0 "Pedir à Croácia que apoie a Herzeg-Bósnia, elevando o moral e aquecendo as relações com Zagreb."
 BOS_events.68.t:0 "A Entidade Chama"
 BOS_events.68.d:0 "A República Srpska apela à Sérvia por armas e voluntários. Belgrado deve pesar o apoio aberto contra o risco de uma guerra mais ampla."
 BOS_events.68.a:0 "Enviar armas e voluntários"
 BOS_events.68.b:0 "Não podemos ser vistos intervindo"
 BOS_events.69.t:0 "Belgrado Responde"
 BOS_events.69.d:0 "Caixotes sérvios chegam à linha de frente. Os soldados da Entidade se animam."
 BOS_events.69.a:0 "Pelo povo sérvio"
 BOS_events.70.t:0 "Os Cantões Chamam"
 BOS_events.70.d:0 "A Herzeg-Bósnia apela à Croácia por armas e voluntários para manter a linha."
 BOS_events.70.a:0 "Armar os cantões"
 BOS_events.70.b:0 "Zagreb deve ficar fora disso"
 BOS_events.71.t:0 "Zagreb Responde"
 BOS_events.71.d:0 "Armas croatas chegam à Herzeg-Bósnia. Os defensores dos cantões se animam."
 BOS_events.71.a:0 "Pelo povo croata"
 RSK_serbian_support_accept_tt:0 "§GEnviar 2000 armas de infantaria à República Srpska e abrir apoio de voluntários.§!"
 RSK_serbian_support_decline_tt:0 "§RO apoio à guerra da República Srpska cai.§!"
 HZG_croat_support_accept_tt:0 "§GEnviar 1500 armas de infantaria à Herzeg-Bósnia e abrir apoio de voluntários.§!"
 HZG_croat_support_decline_tt:0 "§RO apoio à guerra da Herzeg-Bósnia cai.§!"
 BOS_thermal_chinese_financing_tt:0 "§YPequim será informada de que o empréstimo foi assinado e cobrará em troca sua influência na Bósnia.§!"
 BOS_events.72.t:0 "Sarajevo Assina por Tuzla"
 BOS_events.72.d:0 "A Bósnia assinou a linha de crédito para a expansão da usina de linhito de Tuzla: 0,10 bilhão saídos de nossos livros e nossas empreiteiras no local. A usina é o prêmio menor. O que o empréstimo realmente compra é um lugar à mesa em Sarajevo e um parceiro nos Bálcãs que nos deve."
 BOS_events.72.a:0 "Esplêndido."
 BOS_court_turkish_investment_tt:0 "§YAncara será informada de que o mercado está aberto e cobrará em troca sua influência na Bósnia.§!"
 BOS_court_gulf_investment_tt:0 "§YRiad será informada de que os fundos são bem-vindos e cobrará em troca sua influência na Bósnia.§!"
 BOS_events.73.t:0 "Sarajevo Abre a Porta"
 BOS_events.73.d:0 "A Bósnia abriu caminho para nossas construtoras e nossos bancos. Trechos de rodovia, moradias, uma rede de agências em Sarajevo. Trabalho para nossas empreiteiras e um ponto de apoio num país que ainda nos vê como parentes. A palavra de Ancara agora terá peso na Federação."
 BOS_events.73.a:0 "Excelente."
 BOS_events.74.t:0 "Buroj Ozone Encontra Seus Financiadores"
 BOS_events.74.d:0 "Sarajevo convidou o capital do Golfo para imóveis, turismo e finanças. A cidade-resort em Trnovo é a vitrine, mas o dinheiro alcança mais longe: apartamentos, hotéis e os bancos que detêm seus títulos. Seja o que for que os projetos entreguem, a liderança muçulmana da Bósnia se lembrará de quem trouxe os fundos."
 BOS_events.74.a:0 "Esplêndido."
