 mercosur.28.t: "加盟手続き完了"
 mercosur.28.d: "[FROM.GetName]向けの加盟パッケージが完了した。これにより、同国の準加盟資格はMERCOSUR正式加盟へと転換された。"
 mercosur.28.a: "新たな加盟国だ"

 mercosur.29.t: "加盟正式化"
 mercosur.29.d: "[FROM.GetName]の支援のもとで進められていた加盟任務が完了した。我々はこれにより、MERCOSURの正式加盟国として正式に受け入れられた。"
 mercosur.29.a: "我々はブロックに加わる"

 mercosur.30.t: "南米サミット発表"
 mercosur.30.d: "新たな南米サミットが、地域協力再生の第一歩として発表された。主催者は、MERCOSURを再活性化し、経済協調を強化し、大陸に世界情勢の中でより強い集団的発言力を与えねばならないと宣言している。支持者はこれを、長らく待たれていた地域的野心への回帰として称賛している一方、批判者は南米が象徴主義を超えて持続的統合へ進めるのか疑問視している。"
 mercosur.30.a: "新たな地域章の始まりだ"

 mercosur.31.t: "[FROM.GetName]がMERCOSUR準加盟国化"
 mercosur.31.d: "[FROM.GetName]はMERCOSURに準加盟国として加わることに同意し、南米地域協力復活の新たな一歩を刻んだ。準加盟は正式加盟には及ばないが、より緊密な貿易関係、政治協調、そして将来の加盟交渉への道を開く。支持者たちは、この動きをMERCOSURが再び本格的な地域勢力となりつつある兆しと見ている。"
 mercosur.31.a: "ブロックは拡大している"

 mercosur.32.t: "[FROM.GetName]がMERCOSUR正式加盟国化"
 mercosur.32.d: "[FROM.GetName]は加盟手続きを完了し、MERCOSURの正式加盟国となった。地域外交として始まったものは、今やブロック自体の具体的拡大へと結実し、ラテンアメリカ全域でその経済的重みと政治的重要性を深めている。統合支持者にとって、これは単なる外交的成功以上のものだ。MERCOSURがなお大陸の未来を形作り得ることの証明なのである。"
 mercosur.32.a: "新加盟国、より強いブロック"
 BRA_unasul: "UNASULの設立"
 BRA_unasul_desc: "南米諸国の協力を一時的な枠組みにとどめず、恒常的な地域機構として制度化する時が来た。政治対話、インフラ整備、社会協力を束ねる枠組みを整え、南米の結束を新たな段階へ進めよう。"
 MER_expansion_unasul: "UNASULの拡大"
 MER_expansion_unasul_desc: "UNASULを大陸規模の枠組みとして定着させるには、参加の拡大と政治的求心力の維持が欠かせない。域内の諸国を取り込み、南米の共通機構としての正統性を強めよう。"
 MER_sa_corridor_development: "南米回廊整備"
 MER_sa_corridor_development_desc: "大陸統合は宣言だけでは進まない。道路、港湾、鉄道、通信、内陸回廊を結び、国境をまたぐ物流と移動を現実のものにしなければならない。"
 MER_counter_cartel: "カルテル対策協力"
 MER_counter_cartel_desc: "麻薬密輸、武器取引、越境犯罪組織は、南米の安定と統合の双方を脅かす。情報共有と共同対処を進め、国家の枠を越える脅威に地域全体で向き合わなければならない。"
 MER_sa_energy_council: "南米エネルギー評議会"
 MER_sa_energy_council_desc: "石油、ガス、水力、送電網を抱える南米は、エネルギー協力の潜在力が高い。国家間の競合を調整し、地域全体で安定供給と相互補完を目指そう。"
 MER_sa_health_council: "南米保健評議会"
 MER_sa_health_council_desc: "保健協力は目立ちにくいが、南米統合の中では最も実務的で成果を出しやすい分野の一つだ。疾病監視、医薬品、保健人材の協力を進め、生活に直結する統合を示そう。"
 MER_productive_integration_and_sme_networks: "生産連結と中小企業網"
 MER_productive_integration_and_sme_networks_desc: "南米統合を大企業や資源輸出だけの話にせず、中小企業、域内サプライチェーン、産業補完の形成へ広げる。目立ちはしないが、地域統合の実利を示す一手となる。"
 MER_sa_defense_council: "南米防衛評議会"
 MER_sa_defense_council_desc: "南米の安全保障を域外依存だけに任せず、防衛協調と信頼醸成の仕組みを地域内で整える。共同作戦より先に、対話、透明性、危機管理の土台を築くことが重要だ。"
 MER_sa_network_for_science_and_innovation: "南米技術革新網"
 MER_sa_network_for_science_and_innovation_desc: "統合を将来へつなげるには、資源輸出だけでなく知識と技術の連携が必要だ。研究協力と技術交流を通じて、南米の自立的発展を支えていこう。"
 MER_unasul_factions: "UNASUL共同防衛機構"
 MER_unasul_factions_desc: "南米の結束を政治協力にとどめる時代は終わった。域内の安全保障を守り、外部からの圧力や地域不安定化に共同で対処するため、UNASULの下で防衛協力を制度化し、南米諸国を結ぶ新たな共同防衛機構を築こう。"
