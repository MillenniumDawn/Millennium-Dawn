 raj_chi_border_crisis.2.a: "Признать спорное государство"
 raj_chi_border_crisis.2.b: "Отклонить требование"
 raj_chi_border_crisis.3.t: "Запрос на вывод средств отклонен."
 raj_chi_border_crisis.3.d: "Соперник отказывается восстановить спорное государство. Мы можем установить для этого государства ограниченную военную цель или отступить."
 raj_chi_border_crisis.3.a: "Подготовьте ограниченный ответ."
 raj_chi_border_crisis.3.b: "Отступите"
 raj_chi_border_crisis.4.t: "Государство, являющееся предметом спора, признано таковым."
 raj_chi_border_crisis.4.d: "Соперник принял наше требование и уступил спорную территорию, положив конец противостоянию без более масштабной войны."
 raj_chi_border_crisis.4.a: "Восстановить границы"
 raj_chi_border_crisis.5.t: "Срок действия претензии истек."
 raj_chi_border_crisis.5.d: "Контроль над спорным государством перешёл к другому лицу ещё до того, как конфликт удалось разрешить. Требование больше не является актуальным."
 raj_chi_border_crisis.5.a: "Закройте файл"
