 AU_member: "Membre de l'Union africaine"
 AU_member_desc: "L'Union Africaine a été créée à partir des membres de l'Organisation de l'Unité Africaine. Contrairement à l'organisation précédente, l'Union Africaine a mis en place des institutions politiques et une feuille de route pour l'intégration militaire, économique, judiciaire et financière du continent."
