 nsb_engine_tech_1: "Moteurs d'hélicoptère de 1ère génération"
 nsb_engine_tech_1_desc: "Groupes motopropulseurs spécialisés conçus pour fournir la poussée et la portance nécessaires aux aéronefs à voilure tournante."
