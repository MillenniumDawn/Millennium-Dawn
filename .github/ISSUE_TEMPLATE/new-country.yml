name: New country
description: Propose a country that has no Millennium Dawn content yet.
title: "[COUNTRY] "
labels: [type:new-country]
type: task
body:
  - type: markdown
    attributes:
      value: |
        New countries are claimed through the council. Fill this in so the wish lands on the board with the right region and scope. Leave assignees empty; the council assigns after triage.
  - type: input
    id: tag
    attributes:
      label: Country tag
      description: The three-letter HOI4 tag.
      placeholder: NIG
    validations:
      required: true
  - type: input
    id: country
    attributes:
      label: Country name
      placeholder: Nigeria
    validations:
      required: true
  - type: dropdown
    id: region
    attributes:
      label: Region
      options:
        - Africa
        - Latin America
        - East Asia
        - Middle East
        - Europe
        - Other
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      description: What the finished country should include.
      options:
        - label: Focus tree
        - label: Ideas and national spirits
        - label: Decisions
        - label: Events
        - label: Order of battle
        - label: Characters and leaders
        - label: Namelists
        - label: AI strategy
        - label: Graphics
        - label: Localisation
  - type: dropdown
    id: tagteam
    attributes:
      label: Tagteam
      description: New countries may be built by two developers.
      options:
        - Solo
        - Looking for a partner
        - Already have a partner
    validations:
      required: true
  - type: input
    id: partner
    attributes:
      label: Partner
      description: GitHub handle of the partner, if already paired.
      placeholder: "@handle"
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Sources, design notes, and why this country now.
