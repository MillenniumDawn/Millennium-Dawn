 BSH_private_farms: "지역 생산자 지원"
 BSH_private_farms_desc: "지역 생산자를 지원합니다."
 BSH_medicine: "의료 지원 확대"
 BSH_medicine_desc: "우리의 의료 체계를 재정적으로 지원할 것입니다."
 BSH_rkb: "공화국 임상 병원"
 BSH_rkb_desc: "우리 시민들에게 최고의 병원에서 최고의 치료를!"
 BSH_made_in_bashkiria: "바슈키르 품질"
 BSH_made_in_bashkiria_desc: "우리의 제품은 언제나 최고의 품질을 자랑합니다."
 BSH_transport: "교통부"
 BSH_transport_desc: "교통부는 우리나라의 물류 문제를 해결해야 합니다."
 BSH_train: "철도와의 협력"
 BSH_train_desc: "러시아 철도와의 협력은 더욱 커져야 합니다."
 BSH_highway: "우파로 가는 고속도로"
 BSH_highway_desc: "우파로 가는 길은 더욱 편리해져야 합니다."
 BSH_public_transport: "지역 대중교통"
 BSH_public_transport_desc: "대중교통은 개선되어야 합니다."
 BSH_airport_desc: "우리의 공항은 우리 공화국의 자랑이 되어야 합니다."
 BSH_airport: "우파 국제공항"
 BSH_airport2: "또 다른 공항"
 BSH_airport2_desc: "공항이 하나 더 있다고 해서 해가 되지는 않을 것입니다."
 BSH_logistic: "물류 지옥에서의 해방"
 BSH_logistic_desc: "우리 공화국의 악몽 같은 물류 문제를 해결해야 할 때입니다."
 BSH_inter_invest: "국제 투자"
 BSH_inter_invest_desc: "외국인 투자자를 우리 공화국으로 유치할 것입니다."
 BSH_inter_turkish: "튀르키예 투자"
 BSH_inter_turkish_desc: "외국인 투자자를 우리 공화국으로 유치할 것입니다."
 BSH_inter_china: "중국 투자"
 BSH_inter_china_desc: "외국인 투자자를 우리 공화국으로 유치할 것입니다."
 BSH_inter_belarus: "벨라루스의 \\"암코도르\\""
 BSH_inter_belarus_desc: "JSC 암코도르는 벨라루스의 기계 제작 기업입니다. 주요 사업 분야는 도로 건설, 물류, 이탄 채굴, 지방자치, 임업 및 농업 산업용 특수 기계의 생산과 판매입니다."
 BSH_new_bridges: "새 마을 다리"
 BSH_new_bridges_desc: "새 마을 다리를 건설합니다."
 BSH_city: "우파 시"
 BSH_city_desc: "우리 수도의 개선에 투자할 것입니다."
 BSH_science: "바슈키르과학산업"
 BSH_science_desc: "과학은 우리의 전부입니다."
 BSH_scientists: "바슈키르의 가장 뛰어난 인재들"
 BSH_scientists_desc: "우리의 가장 뛰어난 인재들에게 투자합니다!"
 BSH_uralsib: "우랄시브"
 BSH_uralsib_desc: "우리의 은행은 경제적 성공의 보증입니다."
 BSH_tourist_hub: "관광 거점"
 BSH_tourist_hub_desc: "국내 관광을 발전시켜야 할 때입니다."
 BSH_develop_turism: "바시투르 확장"
 BSH_tourist_agency: "정부 관광청"
 BSH_tourist_agency_desc: "공화국이 관광 산업을 관할할 것입니다."
 BSH_culture_eyes: "바슈키르 문화 지원"
 BSH_culture_eyes_desc: "바슈키르 문화를 지원합니다."
 BSH_jamantau: "자만타우 명소"
 BSH_jamantau_desc: "우리의 산은 훌륭한 관광 명소가 될 것입니다."
 BSH_transport_reform: "교통 개혁"
 BSH_transport_reform_desc: "우리 공화국에는 교통 개혁이 필요합니다."
 BSH_private_fight: "민간 사업자와의 싸움!"
 BSH_private_fight_desc: "소형 버스를 소유한 민간 사업자들을 처리할 것입니다."
 BSH_corrupt_police: "부패 경찰관 척결"
 BSH_corrupt_police_desc: "부패한 경찰관을 용서하지 않을 것입니다."
 BSH_internet: "바시넷"
 BSH_internet_desc: "우리 공화국에서 인터넷이 활발히 발전할 것입니다."
 BSH_new_mil: "전체 생산 주기 구축"
 BSH_new_mil_desc: "군사 장비의 전체 생산 주기를 자체적으로 구축하는 데 막대한 투자를 할 것입니다. 어려운 시기에는 장기전을 치러야 하기 때문입니다."
 BSH_garik: "아르메니아인을 받아들이자"
 BSH_garik_desc: "아르메니아 디아스포라가 현지 사업에서 큰 몫을 차지하도록 허용하고, 그 대가로 그들에게서 약간의 뇌물을 받겠습니다."
 BSH_cur: "공화국 관리 센터"
 BSH_cur_desc: "우리 공화국 관리 센터는 고향 바슈키리아의 여러 과정을 통제하기 쉽게 해 줄 것입니다."
 BSH_rosgvardia_spetznaz: "러시아 국가근위대 특수부대 배치"
 BSH_rosgvardia_spetznaz_desc: "러시아 근위대가 우리와 우리 공화국을 지켜줄 것입니다."
 BSH_drones_production: "드론 생산"
 BSH_drones_production_desc: "드론 생산"
 BSH_transport_idea: "바슈키르 인프라"
 BSH_min_selhoz: "농업부"
 BSH_min_obr: "교육부"
 BSH_coal_idea: "바슈키르 석탄 산업"
 BSH_stone_age_public_transport: "석기시대 대중교통"
 BSH_stone_age_public_transport1: "열악한 대중교통"
 BSH_stone_age_public_transport2: "대중교통 복구"
 BSH_vpk: "[BSH.GetFlag]바시코르토스탄 군산복합체"
 BSH_vpk_desc: "바시코르토스탄 영토에 위치한 군수 산업 기업들의 네트워크입니다."
 BSH_buses: "바시코르토스탄산 버스"
 BSH_social_politics: "사회 정책"
 BSH_bus_1000: "버스 1000대가 필요합니다"
 BSH_bashkiria_nationalist: "바슈키르 민족 정체성"
 BSH_bashkiria_nationalist_desc: "우리의 위대한 민족은 스스로를 위대한 러시아의 일부가 아니라 그 가장 위대한 일부로 인식해야 합니다."
 BSH_bashkiria_nationalist_first: "바슈키리아 제일주의"
 BSH_bashkiria_nationalist_first_desc: "우리 민족이 정치 의제의 최우선에 놓여야 합니다. 우리는 러시아인과 형제 민족이지만, 무엇보다도 먼저 우리 자신을 잊어서는 안 됩니다."
 BSH_bashkiria_nationalist_debur: "탈관료화"
 BSH_bashkiria_nationalist_debur_desc: "우리 국가에는 관료가 너무 많이 불어났으므로 빗자루로 쓸어내야 합니다."
 BSH_bashkiria_nationalist_youth_front: "청년 전선"
 BSH_bashkiria_nationalist_youth_front_desc: "가장 어린 바슈키르인조차도 조국을 위해 일어설 준비가 되어 있어야 합니다."
 BSH_bashkiria_nationalist_return_nationalism: "민족주의자의 인기"
 BSH_bashkiria_nationalist_return_nationalism_desc: "국민 사이에서 온갖 종류의 민족주의 운동에 대한 지지가 분명히 커지고 있으므로 이를 면밀히 주시해야 합니다."
 BSH_bashkiria_nationalist_military_invest: "군사 부문 투자"
 BSH_bashkiria_nationalist_military_invest_desc: "우리 전투원을 위한 장비와 무기를 생산하는 기업에 투자하도록 예산 자금을 배정할 것입니다. 전쟁이 닥치면 바슈키르인은 완전무장으로 맞설 준비가 되어 있을 것입니다."
 BSH_bashkiria_nationalist_power_religion: "종교 문제"
 BSH_bashkiria_nationalist_power_religion_desc: "종교가 우리 국가 체제에 영향을 미치도록 허용하지 않을 것입니다."
 BSH_bashkiria_nationalist_police_funding: "경찰 추가 재정 지원"
 BSH_bashkiria_nationalist_police_funding_desc: "우리의 법과 질서를 용감하게 수호하는 경찰의 재정을 위해 추가 자금을 배정할 것입니다."
 BSH_bashkiria_nationalist_ter_oborona: "영토 방위"
 BSH_bashkiria_nationalist_ter_oborona_desc: "러시아 법률은 공화국들이 영토 방위군을 보유하는 것을 전적으로 허용하므로, 국민의 에너지를 국경 수호로 돌려야 한다고 생각합니다."
 BSH_bashkiria_nationalist_expansion: "바슈키르 대외 교리"
 BSH_bashkiria_nationalist_expansion_desc: "우리가 국가의 일부에 불과하다 하더라도 외교 정책에 참여할 권리가 있으며, 어쩌면 다른 나라의 무력 분쟁에 참여할 수도 있습니다."
 BSH_bashkiria_nationalist_destroy_opponents: "야당 분쇄"
 BSH_bashkiria_nationalist_destroy_opponents_desc: "야당을 억압하기 위해 모든 수단을 동원할 것입니다."
 BSH_bashkiria_nationalist_mobilize: "준군사 사회"
 BSH_bashkiria_nationalist_mobilize_desc: "바슈키르 대중은 때때로 나태함이나 일자리 부족 때문에 무기력하게 지내고 있습니다. 우리는 그들에게 일자리를 줄 준비가 되어 있습니다. 다만 이미 군대의 대열 속에서 말입니다."
 BSH_bashkiria_commies: "붉은 바슈키리아"
 BSH_bashkiria_commies_desc: "바슈키르 사회는 다시 한번 사회주의의 길로 들어서고 있습니다. 자본주의는 우리나라에 아무런 좋은 것도 주지 못했습니다."
 BSH_bashkiria_commies_nationalisation: "기업 국유화"
 BSH_bashkiria_commies_nationalisation_desc: "도둑과 사기꾼의 손에서 인민의 재산을 되찾아 올 때입니다."
 BSH_bashkiria_commies_five: "5개년 계획"
 BSH_bashkiria_commies_five_desc: "소련의 5개년 계획 관행은 우리에게 상당히 가깝고 실용적이라고 여겨집니다. 이를 되살릴 가치가 있다고 생각합니다."
 BSH_bashkiria_commies_infrastructure_development: "전면적 인프라 보수"
 BSH_bashkiria_commies_infrastructure_development_desc: "우리의 인프라는 한심한 상태이며, 이를 바로잡을 것입니다."
 BSH_bashkiria_commies_purges: "야당 숙청"
 BSH_bashkiria_commies_purges_desc: "영원히 불만을 품은 야당을 처리해야 할 때입니다."
 BSH_bashkiria_commies_civ_industry: "민수 산업 중시"
 BSH_bashkiria_commies_civ_industry_desc: "군수 산업 대신 민수 산업에 대한 투자를 늘릴 것입니다."
 BSH_bashkiria_commies_mil_industry: "군수 산업 중시"
 BSH_bashkiria_commies_mil_industry_desc: "민수 산업 대신 군수 산업에 대한 투자를 늘릴 것입니다."
 BSH_bashkiria_commies_marxism: "교육 기관의 마르크스주의"
 BSH_bashkiria_commies_marxism_desc: "교육 기관에서 사회주의 사상 교육을 되살려야 합니다."
 BSH_bashkiria_commies_support_workers: "노동자 지원"
 BSH_bashkiria_commies_support_workers_desc: "가능한 모든 수단으로 노동 계급을 지원할 것입니다."
 BSH_bashkiria_commies_price_control: "가격 통제"
 BSH_bashkiria_commies_price_control_desc: "우리 시민들은 미래에 대한 확신을 가져야 합니다. 가격 통제는 이에 대한 그들의 확신을 분명히 강화할 것입니다."
 BSH_bashkiria_commies_tax_rich: "부유세"
 BSH_bashkiria_commies_tax_rich_desc: "백만장자와 억만장자에게서 초과 부를 거두어들일 때입니다."
 BSH_bashkiria_commies_worker_class: "노동 계급"
 BSH_bashkiria_commies_worker_class_desc: "노동 계급이 우리 국가의 유일한 계급이 되도록 노력할 것입니다."
 BSH_bashkiria_commies_new_economic: "새로운 바슈키르 경제"
 BSH_bashkiria_commies_new_economic_desc: "우리 바슈키리아는 새로운 경제 발전의 시대로 접어들고 있습니다."
 BSH_bashkiria_reactioners: "새로운 길"
 BSH_bashkiria_reactioners_desc: "소련 붕괴 이후 바슈키르 민족은 앞으로의 존립에 관한 문제에 직면했습니다. 그 결과 바슈키르인들은 끔찍했던 90년대를 이끌어 낸 지도자의 영도 아래 러시아와의 통합이라는 길을 선택했습니다."
 BSH_bashkiria_const_reform: "헌법 개혁"
 BSH_bashkiria_const_reform_desc: "우리 헌법을 점진적으로 러시아 헌법에 맞추어 나갈 것입니다."
 BSH_bashkiria_streng_power: "정부 권력 강화"
 BSH_bashkiria_streng_power_desc: "그 어떤 야당도 감히 우리에게 맞서지 못하도록 철권으로 권력을 유지할 것입니다."
 BSH_bashkiria_anti_opposition: "야당과의 투쟁"
 BSH_bashkiria_anti_opposition_desc: "야당은 분쇄되어야 합니다."
 BSH_bashkiria_transport_reform: "교통 개혁 착수"
 BSH_bashkiria_transport_reform_desc: "교통 개혁의 첫 단계를 시작할 준비가 되었습니다."
 BSH_bashkiria_agro_reform: "농업 개혁"
 BSH_bashkiria_agro_reform_desc: "우리는 농업 문제를 본격적으로 다룰 준비가 되었습니다."
 BSH_sport: "사회개발부"
 BSH_sport_desc: "사회개발부는 사회 사업을 더 쉽게 감독하도록 도울 것입니다."
 BSH_alga: "경제특구 \\"알가\\""
 BSH_alga_desc: "이곳은 특별한 법적 지위를 가진 기술 생산 현지화 부지입니다. 이 지역의 특별한 지위는 주민들에게 국가 차원에서 보장되는 세제 혜택과 관세 우대를 제공합니다."
 BSH_tech: "과학, 기술 및 교육 발전"
 BSH_tech_desc: "바시코르토스탄 공화국의 과학 기술 발전을 위한 국가 프로그램을 승인할 것입니다."
 BSH_bashkiria_economic_growth: "경제 및 투자 발전"
 BSH_bashkiria_economic_growth_desc: "바시코르토스탄 공화국의 경제 및 투자 발전 국가 프로그램을 승인할 것입니다."
 BSH_bashkiria_small_business: "소기업 발전 프로그램"
 BSH_bashkiria_small_business_desc: "소기업 발전 프로그램은 효과적인 지원 체계를 형성하여 바시코르토스탄 공화국의 중소기업 발전을 위한 여건을 조성하고, 바시코르토스탄 공화국의 경제적, 사회적 문제 해결에 대한 중소기업의 기여를 높이는 것을 목표로 합니다."
 BSH_social_sector: "사회 지출"
 BSH_social_sector_desc: "주민에 대한 사회적 지원을 늘릴 것입니다."
 BSH_CUR: "바슈키리아 공화국 관리 센터"
 BSH_CUR_desc: "이 센터는 공화국을 더 잘 운영하도록 도울 것입니다."
 BSH_bashkiria_free_nationalist: "자유 바슈키리아"
 BSH_bashkiria_free_nationalist_desc: "우리 민족은 마침내 자유로워졌으며 자신의 운명을 스스로 결정할 수 있습니다."
 BSH_a_pragmatic_approach: "실용적 접근"
 BSH_a_pragmatic_approach_desc: "민주주의는 좋은 것이지만, 공산 독재에서 곧바로 자본주의 민주주의로 넘어갈 수는 없습니다. 충격 요법은 효과가 없을 것이며 새로운 러시아 국가를 산산조각 낼 것입니다."
 BSH_democratic_idealism: "민주적 이상주의"
 BSH_democratic_idealism_desc: "이제 과거의 망령을 뒤로하고 어떠한 대가를 치르더라도 민주주의 개혁을 추진할 때입니다."
 BSH_bashkiria_free_nationalist_polit_nation: "국민의 정치적 의지"
 BSH_bashkiria_free_nationalist_polit_nation_desc: "우리 민족은 이제 자신의 운명을 스스로 결정할 자유가 있으며 어떠한 중심 도시에도 복종하지 않습니다."
 BSH_bashkiria_free_nationalist_freedom_speech: "언론의 자유"
 BSH_bashkiria_free_nationalist_freedom_speech_desc: "이제 우리는 진정한 민주주의와 언론의 자유를 위해 노력할 것입니다."
 BSH_Measures_of_rapprochement_with_the_West: "서방과의 관계 개선 조치"
 BSH_Measures_of_rapprochement_with_the_West_desc: "서방은 우리의 친구입니다. 우리는 이를 계속해서 되풀이할 것입니다."
 BSH_bashkiria_free_nationalist_reform_delenie: "영토 개혁"
 BSH_bashkiria_free_nationalist_reform_delenie_desc: "공화국을 더욱 편리하게 관리하기 위해 영토 구조를 바꿀 것입니다."
 BSH_bashkiria_free_nationalist_yazik: "바슈키르어를 국어로"
 BSH_bashkiria_free_nationalist_yazik_desc: "바슈키르어는 마땅한 자리를 되찾아야 합니다. 오직 바슈키르어만이 우리 공화국의 주된 언어가 되어야 합니다."
 BSH_bashkiria_free_nationalist_hym: "독자 화폐"
 BSH_bashkiria_free_nationalist_hym_desc: "독자 화폐로 전환하여 다른 국가와의 결제에 사용할 것입니다."
 BSH_bashkiria_free_nationalist_it: "IT 투자"
 BSH_bashkiria_free_nationalist_it_desc: "예산의 상당 부분을 IT 부문에 투자할 것입니다."
 BSH_economic_liberalism: "자유 시장, 자유로운 국민"
 BSH_economic_liberalism_desc: "자유 시장은 우리 공화국을 빈곤에서 끌어올리는 열쇠입니다. 정부는 민간 부문에서 손을 떼고, 정부의 위협이나 특혜 없이 기업이 알아서 하도록 맡겨야 합니다."
 BSH_bashkiria_free_nationalist_private: "사유 재산 보호"
 BSH_bashkiria_free_nationalist_private_desc: "우리 공화국의 사유 재산은 가능한 모든 방법으로 보호될 것입니다. 집단주의는 이제 충분합니다."
 BSH_bashkiria_free_nationalist_army: "바슈키리아 인민군"
 BSH_bashkiria_free_nationalist_army_desc: "우리나라에는 모든 적으로부터 우리를 지켜 줄 독자적인 군대가 필요합니다."
 BSH_bashkiria_free_separate_religion: "정교 분리"
 BSH_bashkiria_free_separate_religion_desc: "종교가 우리 국가 체제에 영향을 미치도록 허용하지 않을 것입니다."
 BSH_bashkiria_free_baskhir_nation: "바슈키르 정치 민족"
 BSH_bashkiria_free_baskhir_nation_desc: "자유롭고 정치적으로 강한 새로운 국민을 만들어 낼 것입니다."
 BSH_bashkiria_reform_nationalist_army: "군 개혁"
 BSH_bashkiria_reform_nationalist_army_desc: "우리 군은 창설된 지 얼마 되지 않았지만 개혁이 필요합니다."
 BSH_bashkiria_nationalist_army_mass: "징병제 군대"
 BSH_bashkiria_nationalist_army_mass_desc: "이미 검증된 군 병력 충원 체계를 사용할 것입니다. 징병제 군대는 우리에게 최선의 선택이며 적정 수의 병력을 유지하는 방법입니다."
 BSH_bashkiria_nationalist_army_nemass: "모병제 군대"
 BSH_bashkiria_nationalist_army_nemass_desc: "우리 군을 모병제로 전환할 것입니다. 규모는 작지만 강력한 공화국 군대를 만들 것입니다."
 BSH_bashkiria_free_eu_friendship: "유럽 연합과의 동반자 관계"
 BSH_bashkiria_free_eu_friendship_desc: "유럽 연합과의 관계를 개선하기 위해 노력할 것입니다."
 BSH_bashkiria_free_usaid: "USAID 요청"
 BSH_bashkiria_free_usaid_desc: "지원을 받기 위해 USAID에 연락하기로 했습니다."
 BSH_baskhir_polk: "바시코르토스탄 연대"
 BSH_baskhir_polk_desc: "전쟁 지원에 참여할 독자적인 연대의 편성에 착수할 것입니다."
 BSH_natbat1: "살라바트 율라예프 대대 배치"
 BSH_natbat1_desc: "첫 지원병들이 편성을 마치고 전선으로 파견될 준비가 되었습니다."
 BSH_yulaev: "살라바트 율라예프 대대 편성"
 BSH_yulaev_desc: "바슈키르 연대를 이끌 우리의 첫 대대 중 하나입니다."
 BSH_dostovalov: "도스토발로프 대대 편성"
 BSH_dostovalov_desc: "다음 대대는 우리 공화국의 전투원들로 편성되었습니다."
 BSH_vatan: "특수 부대 \\"바탄\\""
 BSH_vatan_desc: "이 부대를 창설하자는 구상은 전투 참전 용사들이 자신들을 하나의 부대로 통합할 것을 제안한 데서 나왔습니다."
 BSH_kusimov: "타기르 쿠시모프 대대 편성"
 BSH_kusimov_desc: "또 하나의 지원병 대대가 우리 공화국 주민들 가운데서 모집되었습니다."
 BSH_Zorina: "세르게이 조린 전차 대대"
 BSH_Zorina_desc: "우리의 첫 전차 대대가 공화국과 조국을 위해 복무할 준비를 마쳤습니다."
 BSH_murzi: "다얀 무르진 대대"
 BSH_murzi_desc: "우리 공화국의 또 다른 영웅을 기리는 또 하나의 대대입니다."
 BSH_suhorukova: "샤리프 수메이마노프 대공 여단"
 BSH_suhorukova_desc: "우리 군에는 대공 부대가 필요하므로 샤리프 수메이마노프 대공 여단을 편성했습니다."
 BSH_ratnik: "병사에게 \\"라트니크\\" 지급"
 BSH_ratnik_desc: "우리 병사들에게 최신 러시아 장비를 지급합니다."
 BSH_more_drones: "무인기 생산 구축"
 BSH_more_drones_desc: "21세기의 전쟁은 드론 전쟁입니다. 조국을 돕기 위해 더 많은 드론이 필요하며 우리는 드론 생산을 확대할 것입니다."
 bashkiriya.1.t: "공화국 임상 병원 완공"
 bashkiriya.1.d: "이제 우리 시민들은 최고의 의료 서비스를 받을 수 있게 될 것입니다."
 bashkiriya.1.a: "아모거스"
 bashkiriya.4.t: "[BSH.GetNameWithFlag]이(가) USAID 가입을 원함"
 bashkiriya.4.d: "[BSH.GetNameWithFlag]이(가) USAID 프로그램 가입 요청을 보냈습니다. 우리는 이 요청에 긍정적으로 응할 준비가 되었습니까?"
 bashkiriya.4.a: "그들의 요청을 받아들인다"
 bashkiriya.4.b: "안된다"
 BSH_bus_category: "네파즈"
 BSH_bus_build: "신규 버스 생산"
 BSH_bus_export_rus: "§Y[SOV.GetNameWithFlag]§!에 버스 수출"
 BSH_bus_export_blr: "§Y[BLR.GetNameWithFlag]§!에 버스 수출"
 BSH_bus_export_ukr: "§Y[UKR.GetNameWithFlag]§!에 버스 수출"
 BSH_bus_export_arm: "§Y[ARM.GetNameWithFlag]§!에 버스 수출"
 BSH_bus_export_kaz: "§Y[KAZ.GetNameWithFlag]§!에 버스 수출"
 BSH_bus_export_che: "§Y[CHE.GetNameWithFlag]§!에 버스 수출"
 BSH_eternal_reform: "영원한 교통 개혁"
 BSH_eternal_reform_desc: "교통 개혁에 관한 모든 요란한 발표에도 불구하고 현 정부는 여전히 개혁을 마무리하지 못하고 있습니다. 사람들은 오래전부터 영원한 교통 개혁을 두고 농담을 해 왔으며, 그럴 만한 이유가 있습니다."
 BSH_bashkirya_first_idea: "바슈키리아 제일주의"
 BSH_youth_front_idea: "바슈키리아 청년 전선"
 BSH_glory_to_bashkirya_idea: "위대한 바슈키르 민족"
 BSH_separate_rel: "정교 분리"
 BSH_trans_reform_idea: "교통 개혁"
 BSH_idea_agriculture_reforms: "농업 개혁"
 BSH_idea_agriculture_reforms_desc: "농업은 우리 경제의 주요 부분이므로, 어려움을 겪는 농민을 돕기 위한 정책을 입안하고 있습니다."
 BSH_Freedom_Meeting: "언론의 자유"
 BSH_private_ownership_idea: "사유 재산 보호"
 BSH_honey_idea: "주요 꿀 생산지"
 BSH_honey_idea_desc: "바슈키리아는 러시아 최대의 꿀 생산지이며, 이 때문에 다른 양봉장들 가운데서 이곳의 제품이 가장 눈에 띕니다."
 BST_bashkir_national_army: "바슈키르 국민군"
 BST_bashkir_national_army1: "바슈키르 국민군"
 BST_bashkir_great_people: "바슈키르 정치 민족"
 BSH_idelural_russia_tt: "이제 [SOV.GetNameWithFlag]에 종속국 §G이델 우랄§!을 창설하도록 제안할 수 있습니다."
 BSH_idelural_notrussia_tt: "이제 볼가 지역 국가 §G이델 우랄§!을 창설하도록 시도할 수 있습니다."
 BSH_volgassr_russia_tt: "이제 [SOV.GetNameWithFlag]에 종속국 §G볼가 소비에트 사회주의 공화국§!을 창설하도록 제안할 수 있습니다."
 Form_Idel_Ural: "이델-우랄 재통합"
 Form_Idel_Ural_desc: "'이델-우랄 운동'으로 알려진 이 구상은 지역 내 여러 민족 집단을 하나의 정치 실체로 통합하고자 합니다. 이 운동은 통합된 이델-우랄이 경제적으로나 정치적으로 더 존립 가능하며, 지역의 다양한 공동체의 이익에 더 잘 부합할 것이라고 주장합니다."
 BSH_integrate_TAT: "타타르스탄 통합"
 BSH_integrate_TATar: "타타르스탄 통합"
 BSH_integrate_TAT_desc: "이델-우랄을 재통합하기 위해 타타르스탄을 통합합니다."
 TAT_integrate_BSH: "바슈키리아 통합"
 TAT_integrate_BSHkir: "타타르스탄 통합"
 TAT_integrate_BSH_desc: "이델-우랄을 재통합하기 위해 타타르스탄을 통합합니다."
 BSH_indep_tt: "종속국의 권위가 매달 §R1§! 감소합니다."
 BSH_indep1_tt: "종속국의 권위가 매달 §R2§! 감소합니다."
 BSH_bashneft1: "바시네프트"
 BSH_bashneft1_desc: "바시네프트는 국가 석유 및 가스 산업에서 가장 오래된 기업 중 하나로, 석유와 가스의 채굴 및 가공, 석유 제품과 석유화학 제품의 판매를 담당합니다."
 BSH_bashneft_category: "바시네프트의 운명"
 BSH_bashneft_category_desc: "1945년에 뿌리를 둔 바슈키르 석유 회사입니다. 현재 회사의 운명이 결정되는 중이며, 경영권 지분을 외국인 투자자에게 매각하거나 모든 지분을 우리 공화국의 손에 집중시키는 것을 고려할 만합니다."
 BSH_bashneft_tat: "§Y[TAT.GetNameWithFlag]§!에 석유 계약 제안"
 bsh_sell_shales: "§Y바시네프트§! 지분 20% 매각"
