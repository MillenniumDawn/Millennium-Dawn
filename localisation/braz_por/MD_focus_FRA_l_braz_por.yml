 FRA_alstom_manufacturer: "Alstom"
 FRA_alstom_manufacturer_desc: "Renomeada a partir da GEC Alsthom em sua listagem em Paris em 1998, a Alstom constrói as locomotivas, os trens de alta velocidade, metrôs, bondes e a sinalização ferroviária da França. Um resgate estatal em 2004 e a venda da divisão de energia à General Electric em 2015 a deixaram uma empresa puramente ferroviária; a compra da Bombardier Transportation em 2021 a tornou a maior fabricante de material rodante fora da China."
 FRA_alstom_manufacturer_trait: "Base Industrial de Material Rodante"
 FRA_alstom_manufacturer_trait_desc: "Belfort, La Rochelle, Reichshoffen, Crespin, Le Creusot e Ornans formam uma cadeia de suprimentos ferroviária completa dentro da França, cobrindo tração, carrocerias, truques, montagem final e sinalização sem conteúdo estrangeiro."
 FRA_alstom_branch_high_speed: "Programa de Alta Velocidade"
 FRA_alstom_branch_urban_transit: "Transporte Urbano"
 FRA_alstom_branch_freight_logistics: "Ferrovia de Carga e Logística"
 FRA_alstom_tgv_duplex: "TGV Duplex"
 FRA_alstom_tgv_duplex_desc: "O TGV Duplex de dois andares entrou em serviço em 1996 e se tornou o trem de alta velocidade padrão no saturado eixo Paris-Lyon, transportando 40 por cento mais passageiros por trem sem alongar as plataformas."
 FRA_alstom_belfort_power_cars: "Locomotivas Motoras de Belfort"
 FRA_alstom_belfort_power_cars_desc: "A fábrica de Belfort constrói as cabeças de tração de todos os trens de alta velocidade franceses. Desde o contrato Avelia Horizon, tira três quartos de sua carga de trabalho de um único programa, o que concentra custo e risco em um só galpão."
 FRA_alstom_avelia_horizon: "Avelia Horizon"
 FRA_alstom_avelia_horizon_desc: "O TGV de quinta geração encomendado pela SNCF em 2018 mantém o layout de dois andares mas encurta as locomotivas motoras, acrescentando vinte por cento de capacidade com menor custo por assento e uma redução alegada de vinte por cento no consumo de energia."
 FRA_alstom_avelia_liberty: "Avelia Liberty"
 FRA_alstom_avelia_liberty_desc: "A variante pendular construída para o Corredor Nordeste da Amtrak foi a primeira exportação de alta velocidade da Alstom para os Estados Unidos. Atrasos de certificação saíram caros, mas o pedido estabeleceu uma posição em um mercado antes fechado ao material rodante francês."
 FRA_alstom_la_rochelle_assembly: "Montagem de La Rochelle"
 FRA_alstom_la_rochelle_assembly_desc: "A fábrica de La Rochelle monta os vagões de passageiros da família Avelia e projeta o bonde Citadis. É o maior empregador ferroviário isolado da costa atlântica e o local onde novas técnicas de carroceria são testadas antes de passarem às outras fábricas."
 FRA_alstom_citadis_tramway: "Bonde Citadis"
 FRA_alstom_citadis_tramway_desc: "Lançado em 2000, o Citadis modular de piso baixo se tornou o bonde europeu padrão, vendido a mais de sessenta cidades. Seus módulos padronizados permitem especificar e entregar uma rede sem um programa de projeto sob medida."
 FRA_alstom_metropolis_metro: "Metrô Metropolis"
 FRA_alstom_metropolis_metro_desc: "A família Metropolis cobre material de metrô sem condutor e convencional numa plataforma comum, de pequenos shuttles automatizados a composições de oito carros de linha principal. A produção em volume mantém o custo unitário abaixo dos projetos nacionais sob medida."
 FRA_alstom_urbalis_cbtc: "Urbalis CBTC"
 FRA_alstom_urbalis_cbtc_desc: "O Urbalis é o sistema de controle de trens baseado em comunicações da Alstom, permitindo operação sem condutor e intervalos inferiores a noventa segundos. Desenvolvido em Crespin e Villeurbanne, é a camada de sinalização sob a maioria dos contratos de metrô automatizado da empresa."
 FRA_alstom_innovia_automated_transit: "Transporte Automatizado Innovia"
 FRA_alstom_innovia_automated_transit_desc: "O people mover automatizado Innovia, herdado da Bombardier, liga terminais de aeroportos e distritos urbanos densos. Suas composições curtas e via fixa o tornam a forma mais barata de acrescentar capacidade ferroviária fixa a um local existente."
 FRA_alstom_grand_paris_express: "Grand Paris Express"
 FRA_alstom_grand_paris_express_desc: "O maior projeto de transporte da Europa acrescenta quatro linhas de metrô automatizado e duzentos quilômetros de trilhos ao redor de Paris. A Alstom fornece o material rodante e a sinalização, e o programa garante sua capacidade de transporte urbano por uma década."
 FRA_alstom_prima_locomotives: "Locomotivas Prima"
 FRA_alstom_prima_locomotives_desc: "A família Prima de locomotivas de carga elétricas e a diesel, construída em Belfort desde 2001, substituiu a frota envelhecida da SNCF e foi exportada para Marrocos, Síria e China. É o cavalo de batalha tanto do transporte ferroviário de carga francês quanto dos movimentos ferroviários militares."
 FRA_alstom_prima_h4_hybrid: "Prima H4 Híbrida"
 FRA_alstom_prima_h4_hybrid_desc: "A locomotiva de manobra H4 combina geradores a diesel com um banco de baterias, reduzindo cerca de pela metade o consumo de combustível nos pátios e permitindo movimentação silenciosa dentro de depósitos e pátios de formação."
 FRA_alstom_atlas_ertms: "Atlas ERTMS"
 FRA_alstom_atlas_ertms_desc: "O Atlas é a implementação da Alstom do Sistema Europeu de Gestão de Tráfego Ferroviário, substituindo sinalizações nacionais incompatíveis por um único padrão continental. Os equipamentos embarcados e de via são produzidos em Crespin."
 FRA_alstom_coradia_ilint: "Coradia iLint"
 FRA_alstom_coradia_ilint_desc: "O primeiro trem regional de célula de combustível a hidrogênio entrou em serviço comercial em 2018, operando em ramais não eletrificados com água como única emissão. Elimina a necessidade de estender catenária sobre rotas que jamais justificariam o custo de capital."
 FRA_alstom_bombardier_transportation: "Bombardier Transportation"
 FRA_alstom_bombardier_transportation_desc: "Concluída em janeiro de 2021 após a Comissão Europeia bloquear uma fusão com a Siemens Mobility, a aquisição da Bombardier Transportation dobrou as fábricas e a carteira de pedidos da Alstom e a tornou a segunda maior fabricante ferroviária do mundo."
 FRA_crusade_time: "Reconquistar Nosso Domínio"
