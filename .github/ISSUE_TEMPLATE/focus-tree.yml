name: Focus tree
description: Propose a new country or a rework of existing country content.
title: "[FOCUS] "
type: "Focus Trees"
body:
  - type: markdown
    attributes:
      value: |
        Focus tree wishes are claimed through the council. Fill this in so the wish lands on the board with the right kind, region, and scope. Leave assignees empty; the council assigns after triage.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - New country
        - Rework
    validations:
      required: true
  - type: input
    id: tag
    attributes:
      label: Country tag
      description: The three-letter HOI4 tag.
      placeholder: NIG
    validations:
      required: true
  - type: input
    id: country
    attributes:
      label: Country name
      placeholder: Nigeria
    validations:
      required: true
  - type: dropdown
    id: region
    attributes:
      label: Region
      options:
        - Africa
        - Latin America
        - East Asia
        - Middle East
        - Europe
        - Other
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      description: What the finished work should include.
      options:
        - label: Focus tree
        - label: Ideas and national spirits
        - label: Decisions
        - label: Events
        - label: Order of battle
        - label: Characters and leaders
        - label: Namelists
        - label: AI strategy
        - label: Graphics
        - label: Localisation
  - type: dropdown
    id: tagteam
    attributes:
      label: Tagteam
      description: Focus trees may be built by two developers.
      options:
        - Solo
        - Looking for a partner
        - Already have a partner
    validations:
      required: true
  - type: input
    id: partner
    attributes:
      label: Partner
      description: GitHub handle of the partner, if already paired.
      placeholder: "@handle"
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Sources, design notes, why now, and for a rework what is wrong with the current content.
