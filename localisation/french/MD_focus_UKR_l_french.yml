 UKR_equipment_export_skif_azerbaijan: "Offer §Y'Skif'§! ATGMs to [AZE.GetNameWithFlag]"
 UKR_equipment_export_skif_azerbaijan_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_skif_export_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[AZE.GetNameWithFlag]§! is looking for modern anti-tank weapons for its army. The §Y'Skif'§!, the export version of our §YRK-2 'Stuhna-P'§!, fits its needs.§!"
 UKR_equipment_export_skif_saudi_arabia: "Offer §Y'Skif'§! ATGMs to [SAU.GetNameWithFlag]"
 UKR_equipment_export_skif_saudi_arabia_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_skif_export_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[SAU.GetNameWithFlag]§! is buying anti-tank weapons for its operations in Yemen. The §Y'Skif'§!, the export version of our §YRK-2 'Stuhna-P'§!, can win this contract.§!"
 UKR_equipment_export_skif_georgia: "Offer §Y'Skif'§! ATGMs to [GEO.GetNameWithFlag]"
 UKR_equipment_export_skif_georgia_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_skif_export_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[GEO.GetNameWithFlag]§! wants to strengthen its defense against armored attack. The §Y'Skif'§!, the export version of our §YRK-2 'Stuhna-P'§!, fits its needs.§!"
