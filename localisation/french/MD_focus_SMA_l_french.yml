l_french:
 SMA_focus: "Priorités nationales de Saint-Marin"
 SMA_economy: "Notre économie"
 SMA_economy_desc: "L'économie de Saint-Marin est négligeable et seules nos décisions peuvent l'améliorer d'une manière ou d'une autre et la mettre au niveau au moins de celle du Liechtenstein."
 SMA_start_buildings: "Entreprises de construction de commissions"
 SMA_start_buildings_desc: "Ce n'est qu'en développant vigoureusement le secteur de la construction que notre petit pays pourra se développer davantage et se tourner vers l'avenir."
 SMA_civil_industry: "Usines Fiat"
 SMA_civil_industry_desc: "Nous pouvons demander à nos amis italiens d'envoyer FIAT produire des véhicules à Saint-Marin et aider nos deux économies."
 SMA_building_slot: "Redistribution des terres"
 SMA_building_slot_desc: "Puisque chaque centimètre carré de terre dans notre pays est précieux, chaque parcelle de terre doit être utilisée au maximum."
 SMA_roads: "Projet de réhabilitation des rues de la ville"
 SMA_roads_desc: "Si l’on veut se développer, il faut d’abord construire des routes. Un transport pratique est la base de tout développement."
 SMA_office: "Agrandir la Banque centrale de Saint-Marin"
 SMA_office_desc: "Notre argent, et celui de nos citoyens, doivent être garantis contre toute attente. Nous pouvons élargir la banque centrale pour y contribuer."
 SMA_research_center: "Centre de recherche de Saint-Marin"
 SMA_research_center_desc: "Le Centre de recherche de Saint-Marin sera le bâtiment principal des scientifiques. Tous nos plus grands esprits vont désormais travailler ensemble pour développer une technologie nationale."
 SMA_economy_of_san_marino: "De nouveaux horizons économiques"
 SMA_economy_of_san_marino_desc: "Nous devons élargir nos horizons économiques pour nous diversifier et nous adapter."
 SMA_latest_technologies: "Rattraper et dépasser"
 SMA_latest_technologies_desc: "La science et la technologie sont les principales forces productives. Saint-Marin sera à l’avant-garde des avancées technologiques mondiales."
 SMA_electronics_research: "Acquaviva Électronique"
 SMA_electronics_research_desc: "Nous pouvons demander à Acquaviva Electronics d’installer de meilleures infrastructures d’approvisionnement en eau pour notre population."
 SMA_internet_research: "Centre de R&D sur le spectre"
 SMA_internet_research_desc: "L’ère de l’information est désormais à nos portes et nous ne pouvons pas relâcher nos recherches et notre exploration de la prochaine génération d’Internet."
 SMA_new_computers: "Ordinateurs domestiques"
 SMA_new_computers_desc: "Nous rechercherons et développerons des ordinateurs et des produits informatiques ici à Saint-Marin dans le cadre de notre initiative visant à stimuler l'offre intérieure de biens."
 SMA_neural_research: "Réseaux de Serravalle"
 SMA_neural_research_desc: "Le monde futur sera un monde d’intelligence artificielle, et nous serons leader dans ce domaine grâce à Serravalle Networks !"
 SMA_industrial_research: "Chercheurs florentins"
 SMA_industrial_research_desc: "Il est très important d'améliorer encore le niveau technologique de notre industrie, et nous pouvons faire appel aux chercheurs florentins pour y contribuer."
 SMA_construction_research: "Département des bâtiments publics de Saint-Marin"
 SMA_construction_research_desc: "La recherche et le développement technologiques dans l’industrie de la construction peuvent considérablement améliorer notre vitesse et notre qualité de construction."
 SMA_sintetic_fuel_research: "Station d'approvisionnement en carburant de l'État de Saint-Marin"
 SMA_sintetic_fuel_research_desc: "Notre pays dispose de très peu de gisements de ressources, les ressources synthétiques sont donc devenues un problème urgent à résoudre."
 SMA_dna_and_gmo_research: "Centre de recherche Faetano"
 SMA_dna_and_gmo_research_desc: "Le 21ème siècle est le siècle de la biotechnologie et des fruits qu'elle apporte à notre monde."
 SMA_philosophers_stone: "Lapis philosophique"
 SMA_philosophers_stone_desc: "Nous pouvons demander à nos scientifiques de réaliser le rêve de longue date de tous les alchimistes. On peut tenter de découvrir la pierre philosophale..."
 SMA_foreign_investment: "Investissements étrangers"
 SMA_foreign_investment_desc: "Saint-Marin est ouvert aux investissements étrangers en promouvant également des accords et conventions ad hoc avec d'éventuels investisseurs internationaux. Sa situation géographique favorable, l'excellence de ses services et produits ainsi que son potentiel de croissance économique et technologique font de Saint-Marin un partenaire solide pour les initiatives commerciales."
 SMA_ask_to_build_germany: "Demander des investissements depuis l'Allemagne"
 SMA_ask_to_build_germany_desc: "L’Allemagne est un pays majeur de l’Union européenne et il est très important d’attirer les investissements allemands pour notre économie."
 SMA_ask_to_build_france: "Demander des investissements depuis la France"
 SMA_ask_to_build_france_desc: "Oui, ils pourraient avoir des troubles, mais vous savez qu’ils ont au moins une bonne économie pour eux."
 SMA_ask_to_build_italy: "Demander des investissements depuis l'Italie"
 SMA_ask_to_build_italy_desc: "Notre pays est entouré par l’Italie et les investissements italiens sont une question de notre existence."
 SMA_ask_to_build_poland: "Demander des investissements à la Pologne"
 SMA_ask_to_build_poland_desc: "La Pologne est un pays émergent au sein de l’UE et nous avons un besoin urgent d’investissements en provenance de ce pays."
 SMA_foreign_factories: "Demandez des investissements dans les usines"
 SMA_foreign_factories_desc: "Investir dans notre industrie est également excellent pour moderniser notre industrie."
 SMA_polish_build: "Entreprises de construction polonaises"
 SMA_polish_build_desc: "Les Polonais sont venus construire pour nous ! Espérons qu'ils n'ont pas laissé leurs plans chez eux."
 SMA_ger_volks: "Filiale d'usine Volkswagen"
 SMA_ger_volks_desc: "Subventionner les usines de Volkswagen pourrait attirer plus efficacement les investissements allemands."
 SMA_ger_cars: "Filiale d'usine BMW"
 SMA_ger_cars_desc: "Subventionner les usines BMW pourrait attirer plus efficacement les investissements allemands."
 SMA_researches: "Des chercheurs allemands"
 SMA_researches_desc: "L’Allemagne a récemment réalisé d’importantes avancées technologiques et il serait très judicieux de travailler avec elle sur la recherche et le développement."
 SMA_ger_electric: "Acheter de l'électricité allemande"
 SMA_ger_electric_desc: "Acheter de l'électricité en Allemagne est une bonne affaire. Quand l'Allemagne a-t-elle rencontré des problèmes d'électricité ?"
 SMA_ita_cars: "Filiale de l'usine Ferrari"
 SMA_ita_cars_desc: "Subventionner les usines Ferrari pourrait attirer plus efficacement les investissements italiens."
 SMA_italy_trade: "Commerce avec l'Italie"
 SMA_italy_trade_desc: "L’Italie est notre voisin le plus important et le maintien des liens économiques et commerciaux avec elle doit être une priorité absolue."
 SMA_farmers: "Soutenir les agriculteurs"
 SMA_farmers_desc: "Les agriculteurs sont l’épine dorsale de l’économie de notre pays et nous devons leur assurer un soutien à tout moment."
 SMA_foregin_economy: "§YL'économie des invisibles§!"
 SMA_foregin_economy_desc: "Saint-Marin sera le leader de l’économie mondiale et obtiendra de plus grands succès dans la vague de mondialisation économique."
 SMA_tourism_support: "Soutien au tourisme"
 SMA_tourism_support_desc: "Le tourisme est une industrie extrêmement rentable pour notre petit pays."
 SMA_tourism_support_ii: "Incitations touristiques"
 SMA_tourism_support_ii_desc: "En fonction des réalisations actuelles, nous continuerons à renforcer le soutien au secteur du tourisme."
 SMA_tourism_support_iii: "Développement du tourisme"
 SMA_tourism_support_iii_desc: "Il y a de plus en plus de touristes, mais nous ne pouvons pas relâcher la qualité de notre service."
 SMA_increased_level_of_tourism: "Augmentation du niveau de\ntourisme"
 SMA_increased_level_of_tourism_desc: "Même si notre industrie touristique est déjà parmi les meilleures au monde, nous devons encore l’élever à un niveau supérieur."
 SMA_build_hotel_hetel_rosa: "Construire l'hôtel\n\"Hetel Rosa\""
 SMA_build_hotel_hetel_rosa_desc: "Nous avons besoin de plus d’hôtels pour les touristes, et l’Hôtel Rosa peut faire un excellent travail pour y parvenir."
 SMA_build_hotel_public_palace: "Construire un hôtel\n\"Palais public\""
 SMA_build_hotel_public_palace_desc: "Le Palais Public serait une excellente destination touristique."
 SMA_build_hotel_prima_torre: "Construire l'hôtel\n\"Prima Torre\""
 SMA_build_hotel_prima_torre_desc: "Prima Torre pourrait contribuer à accueillir davantage de touristes dans notre pays."
 SMA_emphasis_on_tourism: "L'accent sur le tourisme"
 SMA_emphasis_on_tourism_desc: "L’industrie touristique de Saint-Marin doit être ouverte sur le monde et sur l’avenir."
 SMA_bastion_of_beautiful_buildings: "Bastion De Beaux Bâtiments"
 SMA_bastion_of_beautiful_buildings_desc: "Il n’y a pas d’endroit sur terre plus beau que la beauté de Saint-Marin."
 SMA_expansion_state_departments: "§GDévelopper les départements d'État§!"
 SMA_expansion_state_departments_desc: "Élargir l’échelle des départements gouvernementaux, optimiser la forme des départements gouvernementaux et améliorer l’efficacité des départements gouvernementaux."
 SMA_increasing_the_army: "Augmenter les dépenses pour l'armée"
 SMA_increasing_the_army_desc: "Seul l’armée peut protéger notre petit pays, et il est impératif d’augmenter les budgets militaires."
 SMA_increasing_health_care: "Augmenter les dépenses de santé"
 SMA_increasing_health_care_desc: "Des soins de santé de qualité et à large spectre constituent un moyen sûr d’améliorer le soutien aux citoyens."
 SMA_increasing_police: "Augmenter les dépenses pour la police"
 SMA_increasing_police_desc: "La condition préalable pour assurer la sécurité publique est de disposer de dépenses policières adéquates."
 SMA_increasing_education: "Augmenter les dépenses consacrées à l’éducation"
 SMA_increasing_education_desc: "L’éducation est la pierre angulaire de l’amélioration de la qualité des citoyens et de la construction d’une société civilisée."
 SMA_increasing_social_benefits: "Augmenter les dépenses consacrées aux prestations sociales"
 SMA_increasing_social_benefits_desc: "Garantir le bien-être social est une obligation fondamentale d’un pays."
 SMA_increasing_administrarion: "§YAugmenter les dépenses administratives§!"
 SMA_increasing_administrarion_desc: "Seule une augmentation des dépenses administratives peut améliorer la capacité du gouvernement à gouverner."
 SMA_fuck_euro: "Remplacer l'euro"
 SMA_fuck_euro_desc: "Nous pouvons désormais enfin nous débarrasser de cette connerie de l’euro."
 SMA_army_san_marino: "§2Armée de Saint-Marin§!"
 SMA_army_san_marino_desc: "Commençons à construire nos grandes forces militaires !"
 SMA_armed_forces_san_marino: "§GForces armées de Saint-Marin§!"
 SMA_armed_forces_san_marino_desc: "Le maximum que nos troupes peuvent faire maintenant, c'est défiler... Nous devons régler ce problème."
 SMA_purchase_italian_weapons: "Acheter des armes italiennes"
 SMA_purchase_italian_weapons_desc: "Les armes de fabrication italienne sont très adaptées à notre situation et certaines devraient être achetées."
 SMA_purchase_italian_technique: "Achetez des chars italiens"
 SMA_purchase_italian_technique_desc: "La technologie des chars italiens est étonnante et certains peuvent être acquis pour notre défense."
 SMA_ask_italian_for_Artillery: "Demandez l'artillerie à l'italien"
 SMA_ask_italian_for_Artillery_desc: "L’artillerie italienne est également impressionnante et constituera un atout pour la défense nationale."
 SMA_ask_italian_for_MANPADS_and_ATGM: "Demander aux Italiens des MANPADS et ATGM"
 SMA_ask_italian_for_MANPADS_and_ATGM_desc: "La défense aérienne est au cœur de la guerre moderne, et le déploiement d'armes antiaériennes est également une priorité de premier plan."
 SMA_purchase_italian_equipment: "Acheter du matériel italien"
 SMA_purchase_italian_equipment_desc: "Les équipements auxiliaires sont également indispensables au fonctionnement de l'armée et nécessitent des réserves suffisantes pour faire face à l'arrivée de la guerre."
 SMA_purchase_spanish_technique: "Acheter des véhicules espagnols"
 SMA_purchase_spanish_technique_desc: "L'achat de véhicules espagnols peut renforcer efficacement la puissance de notre armée."
 SMA_ask_spanish_for_BMP: "Ask Spanish For IFV"
 SMA_ask_spanish_for_BMP_desc: "Les véhicules de combat d'infanterie donneront à l'infanterie de meilleures capacités de combat dans les guerres à venir."
 SMA_ask_spanish_for_APC: "Ask Spanish For APC"
 SMA_ask_spanish_for_APC_desc: "Les véhicules de transport de troupes blindés sont un outil indispensable pour l'infanterie des guerres à venir."
 SMA_purchase_spanish_weapons: "Acheter des armes espagnoles"
 SMA_purchase_spanish_weapons_desc: "Puisque notre système militaire est saturé de véhicules de fabrication espagnole, il est naturel d'acheter des armes espagnoles."
 SMA_divisons_training: "Divisions de formation"
 SMA_divisons_training_desc: "Sans un bon entraînement, la victoire à la guerre est impossible."
 SMA_solders_training: "§YTraining Solders§!"
 SMA_solders_training_desc: "La préparation de notre armée est achevée, et la victoire s'approche."
 SMA_policy_development: "§2Political Development§!"
 SMA_policy_development_desc: "Nous sommes un pays neutre depuis longtemps, mais le nouveau millénaire ouvre une ère nouvelle. Il nous faut décider si ce sera une ère de paix et de prospérité, ou de guerre et d'expansion."
 SMA_in_country_policy: "§CDomestic Politics§!"
 SMA_in_country_policy_desc: "Nous devons stabiliser la situation intérieure, et pour cela réprimer tout parti indésirable."
 SMA_break_power_of_church: "Briser le pouvoir de l'Église"
 SMA_break_power_of_church_desc: "La société moderne ne peut laisser la religion tout dominer. Rendez à César."
 SMA_ban_communism_parties: "Interdire les partis communistes"
 SMA_ban_communism_parties_desc: "Le communisme n'a pas sa place dans notre société démocratique et il faut légiférer pour en garantir l'exclusion."
 SMA_ban_fascism: "Interdire les partis fascistes"
 SMA_ban_fascism_desc: "Le fascisme n'a pas le droit d'exister, vive la démocratie !"
 SMA_break_opposition: "Briser l'opposition"
 SMA_break_opposition_desc: "Tous les partis d'opposition sont les laquais de puissances étrangères, et leurs activités doivent être interdites."
 SMA_stabilize_policy: "§YStabilize Policy§!"
 SMA_stabilize_policy_desc: "Eh bien, Saint-Marin est béni."
 SMA_democracy: "Développement démocratique"
 SMA_democracy_desc: "La démocratie est le fondement de notre pays, et il est essentiel de préserver le développement normal de notre société démocratique."
 SMA_christdem_party: "Parti chrétien-démocrate"
 SMA_christdem_party_desc: "Les démocrates-chrétiens sont le principal parti politique du pays et représentent la communauté catholique."
 SMA_social_viplat: "Soutien social"
 SMA_social_viplat_desc: "Seul un large soutien social permettra à notre système démocratique de se développer plus sainement."
 SMA_mixed_economy: "Économie Mixte"
 SMA_mixed_economy_desc: "Faire coexister et se développer sur le long terme entreprises d'État et entreprises privées est un problème que nous devons résoudre. Par des négociations amicales avec la banque, nous pouvons parvenir à un consensus de collaboration."
 SMA_support_church: "Soutenir l'Église"
 SMA_support_church_desc: "L'histoire et l'apparence même de Saint-Marin sont indissociables de l'Église et du catholicisme. C'est pourquoi l'Église y exerce une grande influence."
 SMA_coop_with_ita_deep: "Coopération avec l'Italie"
 SMA_coop_with_ita_deep_desc: "L'Italie est notre voisin le plus important et le maintien de relations avec elle est notre priorité."
 SMA_banks_agreement: "Accords avec les banques"
 SMA_banks_agreement_desc: "Par des négociations amicales avec la banque, nous avons trouvé un consensus de collaboration."
 SMA_palom_place: "Lieu de pèlerinage"
 SMA_palom_place_desc: "Le catholicisme est tout pour nous : en Dieu nous croyons."
 SMA_mutual_vzaimovig: "Commerce mutuel avec l'Italie"
 SMA_mutual_vzaimovig_desc: "L'Italie est notre seul voisin et tout notre commerce d'import-export passe par elle."
 SMA_assoc_with_eu: "Association à l'Union européenne"
 SMA_assoc_with_eu_desc: "Le vaste marché intérieur de l'UE fournit les conditions nécessaires au développement ultérieur de notre économie."
 SMA_connect_with_profsoyuz: "Traiter avec les syndicats"
 SMA_connect_with_profsoyuz_desc: "La coordination avec les syndicats est importante."
 SMA_activity_spy: "Observer avant tout"
 SMA_activity_spy_desc: "La surveillance compte plus que tout, rien ne doit être omis."
 SMA_effectiveness_upor: "L'efficacité avant tout"
 SMA_effectiveness_upor_desc: "L'efficacité importe plus que tout. On ne survit pas sans elle."
 SMA_save_our_nature: "Préserver notre nature"
 SMA_save_our_nature_desc: "Nous devons préserver la nature et sa beauté."
 SMA_stab_aboveall: "L'unité nationale avant tout"
 SMA_stab_aboveall_desc: "L'unité de notre peuple importe plus que tout. Sans elle, que nous reste-t-il ?"
 SMA_organiz_anti_corrupt: "Effort anticorruption"
 SMA_organiz_anti_corrupt_desc: "Combattre la corruption à tous les niveaux, sinon elle nous submergera."
 SMA_reform_police: "Réformer la police"
 SMA_reform_police_desc: "Notre police connaît encore de nombreux problèmes et une réforme s'impose."
 SMA_social_media_ad: "Publicité via les réseaux sociaux"
 SMA_social_media_ad_desc: "Il faut suivre les tendances. Qu'est-ce qui plaît aux jeunes ? Tick tock / Yoytabi ? Parfait ! On ne sait pas ce que c'est, mais qu'on y fasse de la publicité."
 SMA_nonof_offshore: "Pays offshore"
 SMA_nonof_offshore_desc: "Comme chacun sait, Saint-Marin est un minuscule pays, si bien que l'accueil de sociétés offshore est devenu une activité importante pour nous."
 SMA_allow_casionos: "Réguler les casinos"
 SMA_allow_casionos_desc: "Il faut encadrer les casinos opérant sur notre territoire afin qu'ils ne corrompent ni nos politiciens ni nos citoyens."
 SMA_free_internet: "Internet libéré"
 SMA_free_internet_desc: "Nous sommes à l'ère de l'information, et offrir à nos citoyens un accès à Internet à tout moment est une exigence de l'époque, qui servira de modèle à toutes les nations."
 SMA_podoxod_tax: "Fiscalité progressive"
 SMA_podoxod_tax_desc: "Par la fiscalité, nous pouvons réduire l'écart entre riches et pauvres dans le pays."
 SMA_san_marino_for_people: "Saint-Marin pour le peuple"
 SMA_san_marino_for_people_desc: "Depuis la fondation de Saint-Marin en 301, notre mission est de servir le bien commun."
 SMA_reform_gov: "Réformer le gouvernement"
 SMA_reform_gov_desc: "Réformer le gouvernement afin d'assurer la pérennité de l'ordre social actuel."
 SMA_market_expansion: "Expansion du marché"
 SMA_market_expansion_desc: "Nous devons élargir notre marché pour permettre à notre industrie de se développer et de poursuivre sa croissance."
 SMA_stabilize_government: "Stabiliser le gouvernement"
 SMA_stabilize_government_desc: "Seul un gouvernement stable peut créer un grand marché et une grande société."
 SMA_usa_deal: "Accord avec les États-Unis"
 SMA_usa_deal_desc: "Saint-Marin est un pays faible : nous ne pourrons nous élever qu'en coopérant avec l'Occident et l'Amérique."
 SMA_approach_nato: "À l’approche de l’OTAN"
 SMA_approach_nato_desc: "Rejoindre la grande alliance de l'OTAN peut améliorer efficacement la défense de Saint-Marin."
 SMA_democracy_name: "Alliance démocratique"
 SMA_democracy_name_desc: "Les alliances démocratiques créent des sociétés démocratiques."
 SMA_spoiler_parties: "Lois pro-LGBT"
 SMA_spoiler_parties_desc: "L'orientation LGBT est une liberté personnelle et nul n'a le droit d'y interférer. Nous devons protéger cette liberté."
 SMA_stabilize_infl: "Influence stabilisatrice"
 SMA_stabilize_infl_desc: "Notre influence est connue à l'étranger : c'est notre atout."
 SMA_2006_summit: "Chemin de Saint-Marin"
 SMA_2006_summit_desc: "Saint-Marin peut s'élever sur la scène mondiale par ses propres moyens. Nous n'avons pas besoin de l'aide de l'Occident, surtout pas de celle pour laquelle nous paierions cher."
 SMA_econ_interv: "Contrer l’intervention"
 SMA_econ_interv_desc: "Bien que nous soyons un petit pays, nous devons nous opposer sans relâche à l'ingérence étrangère."
 SMA_intr_reg_togov_proj: "Projets commerciaux"
 SMA_intr_reg_togov_proj_desc: "Explorer vigoureusement les marchés étrangers et trouver un débouché plus large pour nos produits."
 SMA_europian_communism_alliacne: "§RSocial-Democratic Initiative§!"
 SMA_europian_communism_alliacne_desc: "La social-démocratie sauvera notre société et notre pays."
 SMA_general_economy: "Économie générale"
 SMA_general_economy_desc: "Le grand développement de l'économie socialiste est la tendance générale."
 SMA_business_start_up_support: "Accompagnement au démarrage d'entreprise"
 SMA_business_start_up_support_desc: "Le soutien aux jeunes entreprises est tout à fait nécessaire."
 SMA_rakulakat_banks: "Contrôler les banques"
 SMA_rakulakat_banks_desc: "Contrôler les banques pour empêcher le système financier de se retourner contre nous pendant les réformes."
 SMA_ask_limited_help_italy: "Ask Help Italy"
 SMA_ask_limited_help_italy_desc: "L'Italie est notre principal voisin et nous pouvons nous tourner vers elle pour obtenir de l'aide."
 SMA_sammaran_democratic_party: "§9Socialists for Reforms§!"
 SMA_sammaran_democratic_party_desc: "Seule une réforme socialiste peut résoudre les problèmes que le système capitaliste ne peut résoudre."
 SMA_emphasis_on_small_medium_businesses: "Priorité aux petites et moyennes entreprises"
 SMA_emphasis_on_small_medium_businesses_desc: "Soutenir le développement des PME pour faire face aux problèmes économiques à venir."
 SMA_expand_trade_unions: "Étendre les syndicats"
 SMA_expand_trade_unions_desc: "Élargir les droits syndicaux et améliorer efficacement le sort des travailleurs et l'efficacité de la production."
 SMA_usa_and_west: "§YLes États-Unis et l'Occident§!"
 SMA_usa_and_west_desc: "Nous serons avec le camp occidental et tout ira vers l'avenir."
 SMA_san_marino_path: "§YIndependence§!"
 SMA_san_marino_path_desc: "Vive l’indépendance !"
 SMA_pluralism: "Pluralisme"
 SMA_pluralism_desc: "La diversité est une tendance mondiale, et nous soutiendrons un pays divers."
 SMA_traditional_religion: "Religion traditionnelle"
 SMA_traditional_religion_desc: "Seul le catholicisme pur mérite d'être suivi."
 SMA_legacy_past: "Héritage du passé"
 SMA_legacy_past_desc: "Nos traditions ont fait la grandeur de notre pays et nous ne laisserons personne les détruire."
 SMA_country_of_freedom: "Pays de liberté"
 SMA_country_of_freedom_desc: "Saint-Marin est un pays libre, et cela est vrai depuis notre fondation."
 SMA_abolish_captaincy: "Supprimer le système des capitaines"
 SMA_abolish_captaincy_desc: "Avoir de puissants alliés rend inutile le maintien d'une armée propre et peut alléger considérablement notre budget."
 SMA_save_traditions: "Garder les traditions vivantes"
 SMA_save_traditions_desc: "Maintenir la tradition, c'est maintenir notre pays en vie."
 SMA_human_rights: "Partenariat français"
 SMA_human_rights_desc: "Nous respectons les droits de l'homme, comme la France."
 SMA_stable_stability: "Usine de vin"
 SMA_stable_stability_desc: "Quel pays a le meilleur vin ? La France ? L'Italie ? NON ! Saint-Marin !"
 SMA_take_down_the_mafia: "Détruire la mafia"
 SMA_take_down_the_mafia_desc: "Nos services de renseignement ont localisé tous les chefs de la mafia. Nous pouvons désormais les arrêter, et leurs subordonnés se disperseront comme des rats."
 SMA_church_without_authority: "Retirer le pouvoir à l'Église"
 SMA_church_without_authority_desc: "Nous priverons l'Église de toute influence, mais la laisserons aux personnes de foi."
 SMA_healthy_people: "Des personnes en bonne santé"
 SMA_healthy_people_desc: "Un peuple en bonne santé fait un pays en bonne santé. Sans santé, il n'y a rien."
 SMA_no_gmo: "Interdire les OGM"
 SMA_no_gmo_desc: "Nous ne savons pas ce qu'ils mettent dans notre nourriture : quelle raison d'autoriser cela ? Il faut interdire l'entrée des aliments génétiquement modifiés dans notre nation."
 SMA_all_for_peoples: "Tout pour les peuples"
 SMA_all_for_peoples_desc: "Le pouvoir vient du peuple, et tout ce que fait notre gouvernement est pour le peuple."
 SMA_lgbt_rights: "Droits LGBT"
 SMA_lgbt_rights_desc: "Nous soutenons la communauté LGBT dans la défense de ses droits."
 SMA_airport_remini: "Aéroport Rémini"
 SMA_airport_remini_desc: "Nous pouvons signer un accord avec l'Italie pour partager l'aéroport de Rimini, mais nous paierons le prix des droits des travailleurs italiens."
 SMA_change_history_in_textbooks: "Réviser l'histoire dans les manuels scolaires"
 SMA_change_history_in_textbooks_desc: "L'histoire de Saint-Marin est extrêmement intéressante, mais pas toujours propice à nourrir le patriotisme, et par endroits même peu commode pour nous. Nous pouvons toutefois la modifier sans peine."
 SMA_correct_prisoners: "Rééducation des détenus"
 SMA_correct_prisoners_desc: "Les criminels doivent être réhabilités en prison avant de pouvoir redevenir inoffensifs pour la société."
 SMA_com_multi_party_system: "Idéaux sociaux-démocrates"
 SMA_com_multi_party_system_desc: "L'idée de la social-démocratie coïncide avec la direction que nous prenons."
 SMA_pro_lgbtqa_stance_idea: "Position pro-LGBTQIA"
 SMA_pro_lgbtqa_stance_idea_desc: "Notre gouvernement a adopté une position favorable aux LGBT."
 SMA_half_pro_lgbtqa_stance_idea: "Position à moitié pro-LGBTQIA"
 SMA_half_pro_lgbtqa_stance_idea_desc: "Notre gouvernement a adopté une position mi-favorable aux LGBT."
 SMA_raising_taxes_idea: "Des réductions d'impôts temporaires"
 SMA_improved_administration: "Administration améliorée"
 SMA_improved_administration_desc: "Notre administration allégée et réformée peut aisément porter le fardeau des citoyens et du pays tout entier."
 SMA_liberal_state: "État progressiste"
 SMA_liberal_state_desc: "Notre patrie ne doit plus regarder vers l'arrière. Elle doit viser le progrès et la prospérité."
 SMA_pro_farmers: "Pro-agriculteurs"
 SMA_bastion_of_freedom: "Bastion de la liberté"
 SMA_gmos_banned: "OGM interdits"
 SMA_health_care: "Soins de santé pour le peuple"
 SMA_increase_army: "Augmenter le budget de l'armée"
 SMA_increase_health_care: "Augmenter le budget de la santé"
 SMA_increase_police: "Augmenter le budget de la police"
 SMA_increase_education: "Augmenter le budget de l'éducation"
 SMA_increase_social_benefits: "Augmenter le budget des prestations sociales"
 SMA_christian_state_1: "État chrétien"
 SMA_christian_state_1_desc: "Le christianisme fait partie de notre culture. Il représente nos valeurs essentielles en tant que peuple."
 SMA_christian_state_2: "État chrétien fort"
 SMA_christian_state_2_desc: "Le catholicisme est notre religion d'État. Il nous guide dans les épreuves et nous montre ce qui est bien et ce qui ne l'est pas."
 SMA_pro_west: "Pro Ouest"
 the_SMA_euro: "San-Marino Euro"
 the_SMA_euro_desc: "La monnaie officielle de Saint-Marin est l'euro. Aux termes de l'accord avec l'Union européenne, l'État a le droit de frapper un nombre limité de pièces en euro à ses propres symboles nationaux."
 SMA_buildings: "Constructions"
 SMA_buildings_desc: "À travers Saint-Marin, un immense chantier est en cours, pour un si petit pays.\n§RMais cela impose aussi des restrictions et réduit fortement les revenus pendant un temps.§!"
 SMA_effective_upor: "Priorité à l'efficacité"
 SMA_effective_upor_desc: "Les esclaves doivent travailler ou dormir !"
 SMA_increased_tourism: "Dépendance économique au tourisme"
 SMA_increased_tourism_desc: "Nous avons poussé notre nation à dépendre fortement du tourisme plutôt que d'autres leviers de croissance intérieure."
 SMA_balance_tourism_ii: "Dépendance au tourisme"
 SMA_balance_tourism_ii_desc: "En raison de notre taille et de notre situation, nous pouvons choisir de nous concentrer soit sur le tourisme, soit sur le développement national par nos propres moyens.\nPour l'heure, l'équilibre à Saint-Marin penche vers le §Ytourisme§!"
 SMA_balance_tourism_i: "Focus sur le tourisme"
 SMA_balance_tourism_i_desc: "En raison de notre taille et de notre situation, nous pouvons choisir de nous concentrer soit sur le tourisme, soit sur le développement national par nos propres moyens.\nPour l'heure, l'équilibre à Saint-Marin penche vers le §Ytourisme§!"
 SMA_balance_balance: "Économie équilibrée"
 SMA_balance_balance_desc: "En raison de notre taille et de notre situation, nous pouvons choisir de privilégier le tourisme ou le développement national par des moyens manuels.\nÀ l'heure actuelle, l'équilibre règne entre le §Ytourisme§! et l'§Yéconomie§!"
 SMA_balance_economy_i: "Focus sur l’autosuffisance"
 SMA_balance_economy_i_desc: "En raison de notre taille et de notre situation, nous pouvons choisir de nous concentrer soit sur le tourisme, soit sur le développement national par nos propres moyens.\nPour l'heure, l'équilibre à Saint-Marin penche vers l'§Yautosuffisance§!"
 SMA_balance_economy_ii: "Un peu autosuffisant économiquement"
 SMA_balance_economy_ii_desc: "En raison de notre taille et de notre situation, nous pouvons choisir de nous concentrer soit sur le tourisme, soit sur le développement national par nos propres moyens.\nPour l'heure, l'équilibre à Saint-Marin penche vers l'§Yautosuffisance§!"
 SMA_increased_economy: "Économiquement autosuffisant"
 SMA_increased_economy_desc: "Nous avons choisi la voie de l'autosuffisance économique : nous ne dépendons de personne pour nos revenus."
 SMA_emphass_on_tourism: "L'accent sur le tourisme"
 SMA_emphass_on_tourism_desc: "Saint-Marin a choisi la voie du tourisme."
 SMA_bastion_of_beautiful: "Bastion De Beaux Bâtiments"
 SMA_bastion_of_beautiful_desc: "Saint-Marin est devenu un bastion de bâtiments grandioses et magnifiques à la manière de l'Empire romain, qui tranchent nettement avec l'architecture miteuse d'aujourd'hui."
 SMA_center_i: "§RCentre de recherche non construit§!"
 SMA_center_i_desc: "Nous avons commencé à construire un centre de recherche qui aidera Saint-Marin à rester dans l'air du temps et au niveau des autres pays.\n§RNous avons rassemblé des scientifiques à ciel ouvert, mieux que rien, mais il faut continuer à construire.§!"
 SMA_center_ii: "§HPartiellement construit§!"
 SMA_center_ii_desc: "Nous avons commencé à construire un centre de recherche qui aidera Saint-Marin à rester dans l'air du temps et au niveau des autres pays.\n§HLe centre de recherche est à présent à peu près à moitié construit : y travailler n'est pas confortable, mais c'est déjà possible.§!"
 SMA_center_iii: "§GQuasiment construit§!"
 SMA_center_iii_desc: "Nous avons commencé à construire un centre de recherche qui aidera Saint-Marin à rester dans l'air du temps et au niveau des autres pays.\n§GLe centre de recherche, bien qu'inachevé, est déjà confortable pour y travailler.§!"
 SMA_center: "Centre de recherche"
 SMA_center_desc: "Saint-Marin dispose d'un immense centre de recherche qui permet au pays d'explorer les technologies de pointe et de rester au rythme de l'Europe."
 SMA_no_wars_iii: "Aucune expérience de combat"
 SMA_no_wars_iii_desc: "Bien que Saint-Marin soit le plus ancien pays d'Europe, il n'a presque jamais été en guerre, hormis lorsque l'armée allemande l'occupa durant la Seconde Guerre mondiale. \n§RDe ce fait, nous n'avons ni armée ni expérience de combat.§!"
 SMA_no_wars_ii: "Expérience de combat limitée"
 SMA_no_wars_ii_desc: "Bien que Saint-Marin soit le plus ancien pays d'Europe, il n'a presque jamais été en guerre, hormis lorsque l'armée allemande l'occupa durant la Seconde Guerre mondiale. \n§RDe ce fait, nous n'avons ni armée ni expérience de combat.§!"
 SMA_no_wars_i: "Expérience de combat moyenne"
 SMA_no_wars_i_desc: "Bien que Saint-Marin soit le plus ancien pays d'Europe, il n'a presque jamais été en guerre, hormis lorsque l'armée allemande l'occupa durant la Seconde Guerre mondiale. \n§RDe ce fait, nous n'avons ni armée ni expérience de combat.§!"
 SMA_recruits: "Recrues"
 SMA_recruits_desc: "Saint-Marin a une armée de conscription. De ce fait, nos soldats sont mal entraînés et la plupart ne sont pas prêts à risquer leur vie pour le pays. Mais… ils sont nombreux."
 SMA_contract_service: "Service contractuel"
 SMA_contract_service_desc: "Saint-Marin a une armée de métier. De ce fait, nous avons des soldats bien entraînés, prêts à aller jusqu'au bout pour défendre notre grande patrie."
 SMA_army_of_sacred_marino: "Armée de Saint-Marin"
 SMA_army_of_sacred_marino_desc: "Fondée en 301 ap. J.-C., nous sommes la plus ancienne république d'Europe. Pendant plus de dix-sept siècles, notre patrie montagneuse est restée invaincue, notre indépendance intacte. Nous sommes un peuple fier, héritier d'un legs durable, et désormais l'armée de Saint-Marin portera cet héritage dans une ère nouvelle de force et de gloire."
 SMA_loyal_army: "Armée loyale"
 SMA_loyal_army_desc: "Après les purges, à Saint-Marin, l'armée soutient pleinement le gouvernement. Gloire à la Grande Patrie !"
 SMA_lang_ita: "Langue italienne"
 SMA_lang_romanion: "Langue romagnole"
 SMA_hist_peace: "Histoire paisible"
 SMA_hist_mil: "Histoire militaire"
 SMA_ed_work: "Éduquer les travailleurs"
 SMA_ed_res: "Former les scientifiques"
 SMA_ed_mil: "Éduquer les militaires"
 SMA_rights_of_italian_workers_in_san_marino: "Droits des travailleurs italiens"
 SMA_rights_of_italian_workers_in_san_marino_desc: "Un accord a été signé avec l'Italie pour partager l'aéroport de Rimini et les droits des travailleurs italiens à Saint-Marin."
 SMA_chruch_withnout_autority: "Église dévouée"
 SMA_chruch_withnout_autority_desc: "L'Église est pleinement engagée auprès de notre gouvernement et prête à défendre nos intérêts."
 SMA_trust_in_people: "Confiance au peuple"
 SMA_trust_in_people_desc: "Nous faisons confiance aux gens de notre pays, même si cela nous coûte parfois."
 SMA_traditional_marriage: "Mariage traditionnel"
 SMA_traditional_marriage_desc: "Saint-Marin a interdit toute reconnaissance des droits LGBT. Il y a deux sexes, masculin et féminin, et tout le reste est rejeté."
 SMA_mafia: "Mafia à Saint-Marin"
 SMA_mafia_desc: "Saint-Marin compte plusieurs mafias, qui gênent grandement le fonctionnement stable de l'État. Il faut agir au plus vite pour les détruire."
 SMA_legacy_of_past: "Notre héritage"
 SMA_legacy_of_past_desc: "Saint-Marin, perché sur une colline dominant l'Adriatique, possède un héritage extraordinaire qui s'étend sur des siècles. L'une des plus anciennes républiques du monde et l'une des plus petites nations, notre pays est riche d'histoire, de culture et de tradition. Notre héritage unique a façonné ce que nous sommes et témoigne de notre résilience et de notre capacité d'adaptation au fil du temps.\nNotre patrimoine va aussi au-delà de l'architecture et de la religion. La capitale, la Cité de Saint-Marin, abrite de nombreux musées qui célèbrent notre diversité culturelle, dont le Musée national, qui conserve une vaste collection d'artefacts de diverses époques de notre histoire. De plus, nos artisanats traditionnels, comme la céramique et la broderie, continuent de prospérer, mettant en valeur le savoir-faire de nos artisans locaux.\nNous sommes un grand pays §Gindépendant§! !"
 SMA_general_field_exercises: "Soutenir les agriculteurs"
 SMA_general_field_exercises_desc: "Les agriculteurs continuent de favoriser la croissance économique de notre petite mais fière nation : il est essentiel de les soutenir."
 SMA.1.t: "Proposition de notre évêque…"
 SMA.1.d: "Notre sainte et juste Église a pris le dessus à Saint-Marin. Notre évêque d'ici veut nous unifier en un seul corps et donner à notre sainteté le plein pouvoir !"
 SMA.1.a: "Bien sûr"
 SMA.1.b: "Une proposition tellement stupide."
 SMA.2.t: "400 ans de constitution"
 SMA.2.d: "Aujourd'hui, c'est le 400e anniversaire de la constitution de Saint-Marin ! Faut-il célébrer cette date historique, ou laisser chacun à son travail ?"
 SMA.2.a: "Célébration !!!"
 SMA.2.b: "Tout le monde travaille."
 SMA.3.t: "Découverte de la pierre philosophale"
 SMA.3.d: "Nos scientifiques ont découvert la pierre philosophale ! Mais se pose maintenant la question : faut-il l'annoncer au monde entier, ou la garder pour nous ?"
 SMA.3.a: "Le dire au monde"
 SMA.3.b: "Ne le dis à personne"
 SMA.6.t: "Jean-Paul est mort !"
 SMA.6.d: "Le 2 avril 2005, Jean-Paul II, le pape le plus voyageur de l'histoire et le premier non-Italien à occuper la charge depuis le XVIe siècle, meurt à son domicile au Vatican. Six jours plus tard, deux millions de personnes se pressaient à la Cité du Vatican pour ses funérailles, dites parmi les plus grandes de l'histoire…"
 SMA.8.t: "Fusion du Parti démocratique sammarinais et des Socialistes pour les réformes"
 SMA.8.d: "Deux partis, le Parti démocratique progressiste sammarinais et les Socialistes pour la réforme, veulent fusionner, mais est-ce bon pour nous ?"
 SMA.8.a: "Autoriser la fusion"
 SMA.8.b: "Interdire la fusion"
 SMA_news.1.t: "Le Vatican et Saint-Marin s'unissent !"
 SMA_news.1.desc: "Dans un développement monumental qui capte l'attention du monde, les micro-États de Saint-Marin et de la Cité du Vatican ont décidé de s'unir, formant un seul pays sous l'autorité du pape. Cette fusion inédite réunit deux entités souveraines aux riches histoires et identités distinctes, promettant un avenir unique aux deux nations !"
 SMA_news.1.a: "Intéressant"
 SMA_news.2.t: "J'ai découvert la pierre philosophale !"
 SMA_news.2.desc: "Des scientifiques de Saint-Marin ont enfin réussi ce que d'autres tentent depuis des siècles ! Ils ont découvert un réactif qui permet de transformer n'importe quel métal en or !"
 SMA_news.2.a: "What?"
 SMA_news.2.b: "Nos scientifiques sont les meilleurs du monde !"
 SMA_countries.1.t: "Accord avec Saint-Marin"
 SMA_countries.1.d: ""
 SMA_countries.1.a: "Signer l'accord"
 SMA_countries.1.b: "Nous ne signons pas"
 SMA_countries.4.t: "Investissement à Saint-Marin"
 SMA_countries.4.d: "Rejoignez-nous pour une opportunité d'investissement unique à Saint-Marin !\nSaint-Marin ouvre désormais ses portes aux investisseurs internationaux en quête d'opportunités de croissance. Alors que la nation cherche à renforcer ses fondations économiques, elle nous invite à explorer les nombreux avantages d'investir dans ce micro-État remarquable.\nNous ne devons pas manquer cette occasion de nouer des contacts avec des esprits similaires tout en découvrant de première main pourquoi Saint-Marin devient rapidement une destination de premier plan pour l'investissement étranger en Europe."
 SMA_countries.4.a: "Bien sûr."
 SMA_countries.4.b: "Nous n'en avons pas besoin."
 SMA_countries.5.t: "Demande d'investissement rejetée"
 SMA_countries.5.d: "Nous avons récemment déposé une demande d'investissement étranger. À notre grand regret, elle a été rejetée."
 SMA_countries.5.a: "triste"
 SMA_countries.6.t: "Demande d'investissement approuvée"
 SMA_countries.6.d: "Nous avons récemment déposé une demande pour attirer des investissements étrangers. Heureusement, notre demande a été approuvée."
 SMA_countries.6.a: "D'accord"
 SMA_countries.2.t: "L'Italie refuse"
 SMA_countries.2.d: ""
 SMA_countries.2.a: "Ohh... D'accord..."
 SMA_countries.3.t: "L'Italie est d'accord"
 SMA_countries.3.d: ""
 SMA_countries.3.a: "Bien"
