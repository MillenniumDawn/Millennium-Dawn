 JAP_whistleblower_protection_act: "Whistleblower Protection Act"
 JAP_whistleblower_protection_act_desc: "Auditors can only read what a firm hands them, while the employees know which loans were rolled over and which invoices were backdated. They work for the company they would have to accuse, in a labour market that offers one career and no second chance. A statute making dismissal for disclosure unlawful turns silent witnesses into testifiers."
 JAP_financial_revival_program: "The Financial Revival Program"
 JAP_financial_revival_program_desc: "Banks grade their own borrowers, and the grades hide an inability to pay. The Financial Revival Program applies discounted cash flow assessment to every major exposure, tightens the asset-capital limits, and publishes a target to halve the bad-loan ratio. The business federations will call it a war on industry, and they are not entirely wrong."
 JAP_special_investigation_unit: "Special Investigation Department"
 JAP_special_investigation_unit_desc: "An audit produces a finding, a prosecutor produces a defendant. The Special Investigation Department of the Tokyo District Public Prosecutors Office has broken cabinet ministers and is the one institution a keiretsu board cannot quietly settle with. It is pointed at the balance sheets."
 JAP_special_investigation_unit_TT: "Obstruction now accrues §G25% more slowly§!"
 JAP_the_lost_decade_ends: "The Lost Decade Ends"
 JAP_the_lost_decade_ends_desc: "The last of the insolvent firms goes through the courts and the register is closed. Nothing was refinanced, every loss was written where it fell, and credit now reaches only the firms that can repay it. An economy whose books say what is actually true is the only foundation anything else can be built on.\n-------------\nThis focus §Gremoves§! §Y$JAP_zombie_companies$§! and the §Y$JAP_liquidation_wave$§! that came with the wind-down."
 JAP_controlled_downsize_TT: "Begins the §Yliquidation wave§!: the firms are wound up at §Gdouble the pace§! of a merger programme, at the cost of a §Rsevere national spirit§! until the wind-down completes"
 JAP_forced_mergers_TT: "Begins the §Ymerger programme§!: cheap and gentle now, §Rhalf the wind-down speed§!, and a permanent mark on Japanese industry afterwards"
 JAP_liquidation_wave: "The Liquidation Wave"
 JAP_liquidation_wave_desc: "The liquidation is under way. Bankruptcy notices fill the business pages, construction sites stand idle while their developers are wound up, unemployment surges, and the government must borrow to cushion the blow. The pain is severe and concentrated, but it is temporary.\n-------------\nLifted once §YCorporate Restructuring Progress§! finishes winding down the zombie firms."
 JAP_fusion_restructuring: "Administrative Guidance"
 JAP_fusion_restructuring_desc: "The ministry draws the lines and the banks provide the dowry. Nobody is dismissed, nobody admits failure, and two sales forces that have hated each other for thirty years are told they are now one company. The register grows shorter every quarter. The cost is in stagnation, not in unemployment.\n-------------\nLifted once §YCorporate Restructuring Progress§! finishes absorbing the zombie firms."
 JAP_consolidated_conglomerates: "Consolidated Japan Inc."
 JAP_consolidated_conglomerates_desc: "The insolvent names are gone from the register, absorbed rather than wound up. What replaced them are larger groups carrying duplicated factories, duplicated research divisions, and managers who answer to a board that bought them against their will. The state has the national champions it asked for. It also has an industrial base that innovates more slowly than the one it started with."
 JAP_zombie_investigation_category: "The Zombie Firm Investigation"
 JAP_zombie_investigation_category_desc: "Auditors and prosecutors are working through the ledgers of Japan's insolvent borrowers, and the firms are working just as hard to stop them.\n\n§YCase Files§!: [?JAP_zombie_case_files|0] / 14\n§YObstruction§!: [?JAP_zombie_obstruction|0] / 100\n\n§YWhat you can do§!\nEach case below can be prosecuted, quietly rescued, or waved through. Prosecution builds the strongest file and costs you the most with the §Yindustrial conglomerates§!, whose opinion drives real output. A rescue builds a thinner file at the taxpayer's expense. Waving a case through builds nothing.\n\n§GThe Report§!\nGraded when the investigation closes.\n§G10 or more§! files: a full reckoning that drives faster wind-down.\n§G3 to 9§!: a partial report.\n§RUnder 3§!: a whitewash that wipes the files gathered and slows the wind-down.\n§Y$JAP_controlled_downsize$§! requires 10 or more files. §Y$JAP_forced_mergers$§! requires 3 or more files. Neither branch is ever permanently closed, even if the investigation is abandoned or whitewashed.\n\n§RObstruction§!\nRises every month you keep digging, faster the angrier the conglomerates are. At §R30§! the ministry leaks, at §R55§! the business federation issues an ultimatum, and at §R80§! the probe is suspended by scandal. The decisions below push it back down."
 JAP_zombie_investigation_mission: "Conclude the Investigation"
 JAP_zombie_investigation_mission_desc: "The probe cannot run forever. Build a case worth publishing before the political will runs out."
 JAP_zombie_investigation_mission_TT: "§YCase Files§!: [?JAP_zombie_case_files|0] / 10"
 JAP_keidanren_ultimatum_mission: "The Keidanren Ultimatum"
 JAP_keidanren_ultimatum_mission_desc: "The business federation has told the government, in the politest possible language, that the investigation is damaging confidence and should be wound down. They have given us until the end of the fiscal half to take the hint."
 JAP_keidanren_ultimatum_TT: "Bring §YObstruction§! below §Y45§!"
 JAP_case_ltcb_shinsei: "Case File: The Shinsei Put Option"
 JAP_case_ltcb_shinsei_desc: "The Long-Term Credit Bank was nationalised, cleaned at public expense, and sold to a foreign investment group for a token sum. The contract gave the buyer the right to hand any loan that lost a fifth of its value straight back to the Deposit Insurance Corporation at book price. The new owners are exercising it, and every yen of the loss lands on the taxpayer. Someone in the ministry signed that clause."
 JAP_case_sogo_collapse: "Case File: The Collapse of Sogo"
 JAP_case_sogo_collapse_desc: "The department store chain owes something close to two trillion yen and has not turned a real profit in years. The plan on the ministry's desk is to forgive the public share of the debt and let it trade on. The newspapers have the plan too, and the public reaction to rescuing a retailer while ordinary firms are refused credit has been what anyone could have predicted."
 JAP_case_mycal_bankruptcy: "Case File: Mycal"
 JAP_case_mycal_bankruptcy_desc: "The Osaka supermarket group expanded through the bubble on money its main bank never expected to see returned, and it has spent the years since being refinanced rather than restructured. If it fails it will be the largest retail bankruptcy the country has recorded, and it will take a chain of suppliers in the Kansai down with it."
 JAP_case_resona_injection: "Case File: Resona"
 JAP_case_resona_injection_desc: "The auditors have refused to certify how much of the bank's capital consists of deferred tax assets, which is to say future profits it has no realistic prospect of earning. Without that fiction the bank is undercapitalised. Nearly two trillion yen of public money would make it whole and effectively hand it to the state. Refusing would be the first major bank failure the government has permitted."
 JAP_case_ashikaga_bank: "Case File: The Ashikaga Bank"
 JAP_case_ashikaga_bank_desc: "It is not a national bank. It is the bank of Tochigi, where it holds the accounts of the prefectural government, most of the local firms, and a great many households who have never used another. It is also insolvent. Nationalising it protects the depositors and destroys the shareholders, and every regional lender in the country will read the decision as a statement of intent."
 JAP_case_daiei_ircj: "Case File: Daiei"
 JAP_case_daiei_ircj_desc: "The retailer that taught Japan discount pricing carries debts in the trillions and has been kept upright by banks that cannot afford to admit what the loans are worth. The Industrial Revitalization Corporation can take it over, replace the management, and sell the pieces. The founder's allies in the party would rather it were refinanced one more time."
 JAP_case_kanebo_accounts: "Case File: The Kanebo Accounts"
 JAP_case_kanebo_accounts_desc: "The cosmetics and textiles group has been reporting profits it did not earn for five years, to the order of two hundred billion yen. The fraud is not in dispute. What is in dispute is the accounting firm that signed every one of those statements, and whether a country can have honest ledgers while its auditors answer commercially to the companies they audit."
 JAP_press_the_prosecutors: "Turn the Prosecutors Loose"
 JAP_press_the_prosecutors_desc: "Let the Special Investigation Department make arrests rather than referrals. Nothing quiets a lobbying campaign faster than a director being walked out of his office by men with a warrant."
 JAP_whistleblower_immunity_decision: "Grant Immunity to Informants"
 JAP_whistleblower_immunity_decision_desc: "Offer the middle managers who executed the instructions protection from prosecution in exchange for testimony against the men who gave them. The conglomerates will call it an invitation to betray your colleagues. It is."
 JAP_publish_inspection_manual_decision: "Publish the Inspection Findings"
 JAP_publish_inspection_manual_decision_desc: "Release the supervisory assessments in full rather than summarising them for the ministry. The markets will not enjoy reading them, but a firm cannot lobby against a number the whole country has already seen."
 JAP_cooperating_bank_amnesty_decision: "Amnesty for Cooperating Banks"
 JAP_cooperating_bank_amnesty_decision_desc: "Offer any bank that opens its books voluntarily an assurance that its officers will not be pursued. It buys peace, and it costs the investigation the case it was building against them."
 JAP_zombie_probe_abandoned_TT: "The investigation is §Rcalled off§! and will publish as a whitewash, wiping the case files gathered so far and slowing the wind-down"
 JAP_zombie_report_strong_TT: "§GA full reckoning.§! The wind-down will run §G25% faster§!"
 JAP_zombie_report_partial_TT: "§YA partial report.§! The wind-down will run at its normal pace"
 JAP_zombie_report_whitewash_TT: "§RA whitewash.§! The case files are §Rwiped§! and the wind-down will run §R25% slower§!"
