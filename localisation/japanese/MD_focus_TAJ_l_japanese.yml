 TAJ_tajik_drugs_desc: "The [TAJ.GetFlag] Tajik Government has decided that it wants to play with fire. They are intentionally letting drugs enter our country. Though they do not officially recognize this action, we know that they are doing this for economic and political leverage over our government.\n§W------------------§!\n[TAJ.GetFlag] Tajikistan will ask us for investments or assistance, and if we reject they might §Rincrease§! the amount of narcotics flowing in. We cannot officially threaten them if they are in §HCSTO§!, however if we do threaten them, then they may seek assistance from another power, removing them from our sphere of influence."
