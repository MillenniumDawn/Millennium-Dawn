 TRK.liberalism: "£TRK_western_liberal (TRP) 土库曼斯坦共和党"
 TRK.liberalism_icon: "£TRK_western_liberal"
 TRK.liberalism_desc: "（改革派自由主义） - 土库曼斯坦共和党\n\n土库曼斯坦共和党是土库曼斯坦境内被取缔的几个异见政党之一。流亡在外的土库曼斯坦共和党领导人包括2002年流亡的努尔穆哈默特·哈纳莫夫和安娜杜尔迪·哈吉尤，后者的妹妹奥古尔萨帕尔·米拉多瓦于2006年9月在土库曼斯坦监狱中去世。最新的反对党土库曼斯坦共和党在流亡中运作 - 由于土库曼斯坦境内禁止所有反对派，因此该党被迫在国外组建和运作。"
 TRK.socialism: "£TRK_western_social_democrat (TZB) 土库曼斯坦妇女联合会"
 TRK.socialism_icon: "£TRK_western_social_democrat"
 TRK.socialism_desc: "（务实社会民主主义） - 土库曼斯坦妇女联盟\n\n土库曼斯坦妇女联盟是土库曼斯坦的一个群众性妇女组织。长期以来，妇女联盟是该国唯一获准成立的妇女组织。该组织以非政府组织的名义倡导妇女权利，但实际上，妇女联盟与政府关系密切，并受政府控制。"
 TRK.Western_Autocracy: "£generic_Western_Autocracy_small (TUDF) 土库曼民主力量联盟"
 TRK.Western_Autocracy_desc: "（亲民主保守主义） - 土库曼民主力量联盟\n\n土库曼民主力量联盟是土库曼斯坦的一个政党，于2003年11月23日在奥地利维也纳成立（最初的协议于9月29日达成）。前外交部长奥迪·库利耶夫、前驻土耳其大使努尔穆哈迈特·哈纳莫夫、前央行行长胡代贝尔迪·奥拉佐夫和前农业部副部长萨帕尔米拉特·伊克利莫夫是创始成员。"
 TRK.Conservative: "£TRK_emerging_reactionary (MAYG)土库曼斯坦马格特姆古利青年组织"
 TRK.Conservative_icon: "£TRK_emerging_reactionary"
 TRK.Conservative_desc: "(民族主义) - 土库曼斯坦马格图姆古利青年组织\n\n土库曼斯坦青年组织是土库曼斯坦注册的社会政治组织。该组织在土库曼斯坦第六届议会（2013-2018年）中占有席位。尽管该组织表面上是一个非政府组织，但实际上它与政府关系密切，并受到政府的控制。"
 TRK.anarchist_communism: "£TRK_anarchist_communism (KAG) 土库曼斯坦工会组织"
 TRK.anarchist_communism_icon: "£TRK_anarchist_communism"
 TRK.anarchist_communism_desc: "（左翼社会民主主义） - 土库曼斯坦工会组织\n\n土库曼斯坦工会组织，正式名称为土库曼斯坦全国工会中心，是土库曼斯坦正式注册的社会组织，团结该国的工会。它在2013-2018年土库曼斯坦议会中有代表。该组织的成员在议会125个席位中占有33个席位。"
 TRK.Neutral_conservatism: "£TRK_non_aligned_conservative (STP) 实业家和企业家党"
 TRK.Neutral_conservatism_icon: "£TRK_non_aligned_conservative"
 TRK.Neutral_conservatism_desc: "（寡头） - 实业家和企业家党\n\n实业家和企业家党是土库曼斯坦的一个政党。该党成立于2012年8月21日，是该国第一个合法反对党。该党由萨帕尔穆拉特·奥夫加诺夫领导。"
 TRK.neutral_Social: "£TRK_non_aligned_socialist_democrat (AP)土库曼斯坦农业党"
 TRK.neutral_Social_icon: "£TRK_non_aligned_socialist_democrat"
 TRK.neutral_Social_desc: "（农业主义） - 土库曼斯坦农业党\n\n土库曼斯坦农业党是土库曼斯坦的一个政党。该党成立于2014年9月28日。土库曼斯坦农业党是土库曼斯坦合法存在的三个正式注册政党之一，在土库曼斯坦议会有代表。"
 TRK.Neutral_Autocracy: "£TRK_non_aligned_autocracy (TPD) 土库曼斯坦民主党"
 TRK.Neutral_Autocracy_icon: "£TRK_non_aligned_autocracy"
 TRK.Neutral_Autocracy_desc: "（保守专制主义） - 土库曼斯坦民主党\n\n土库曼斯坦民主党是土库曼斯坦的一个政党。该党成立于1991年12月16日，取代土库曼斯坦共产党。在2010年其他政党合法化之前，它是该国唯一的政党。"
 TRK.Nat_Autocracy: "£TRK_nationalist_military_junta 土库曼斯坦武装力量"
 TRK.Nat_Autocracy_icon: "£TRK_nationalist_military_junta"
 TRK.Nat_Autocracy_desc: "（民族主义军政府）- 土库曼斯坦武装部队成立于1992年，其装备和人员主要来自苏联解体后遗留下来的苏联。由于土库曼斯坦官方奉行中立立场，土库曼斯坦军队很少在境外开展军事行动，而执政党土库曼斯坦民主党对权力的高度集中也确保了军队对执政力量的忠诚。"
