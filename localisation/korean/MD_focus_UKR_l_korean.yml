 UKR_vv_tooltip_tt: "§Y특수 부대에 대한 재정 지원은 마이단이 일어날 경우의 여파를 크게 줄여 줍니다§!"
 UKR_arms_rebuild: "군수 산업"
 UKR_arms_rebuild_desc: "우리나라는 스스로를 지켜야 하며, 오직 강력한 군수 산업만이 이를 도울 수 있습니다."
 UKR_arms_build: "군수 생산 투자"
 UKR_arms_build_desc: "우리는 유명 공장 일부의 군수 생산 확대에 대한 투자 자금을 지원할 준비가 되어 있습니다."
 UKR_polish_ukr_brotherhood: "폴란드-우크라이나 형제애"
 UKR_polish_ukr_brotherhood_desc: "오직 함께할 때에만 우크라이나와 폴란드는 어떤 적도 물리칠 수 있습니다."
 UKR_belarus_brothers: "벨라루스 형제들"
 UKR_belarus_brothers_desc: "벨라루스 국민은 우리의 형제이며, 그들 또한 두 거대 정치 세력의 손아귀에 놓여 있습니다. 우리가 그들을 이 손아귀에서 구해낼 것입니다."
 UKR_befriend_azerbaijan: "아제르바이잔과의 우정"
 UKR_befriend_azerbaijan_desc: "아제르바이잔은 러시아의 영향력에 적극적으로 맞설 수 있는 캅카스에서 우리 정책을 추진하는 데 귀중한 동맹이 될 것입니다."
 UKR_befriend_georgia: "조지아와의 연합"
 UKR_befriend_georgia_desc: "조지아는 중요한 동반자이며 캅카스 지역에서 전략적 위치를 차지하고 있습니다. 동맹에 이러한 동맹국이 있다면 우리에게 큰 이익이 될 것입니다."
 UKR_caucasus_volunteers: "캅카스 의용병"
 UKR_caucasus_volunteers_desc: "HUR 대대를 구성하기 위해 캅카스의 많은 의용병을 초청할 것입니다."
 UKR_dagestan_reb_prepare: "다게스탄 봉기 준비"
 UKR_dagestan_reb_prepare_desc: "다게스탄에서의 특별 제한 작전을 위한 준비를 시작할 것입니다."
 UKR_befriend_chechens: "이츠케리야와의 우정"
 UKR_befriend_chechens_desc: "이츠케리야는 금세기 초에 러시아에 의해 파괴된 국가입니다. 우리는 그 진정한 애국자들을 모아 나라를 되살리려 노력할 것입니다."
 UKR_reconcista: "우크라이나의 레콩키스타"
 UKR_reconcista_desc: "유럽 국가들은 혼돈과 이민자 위기에 빠져 있습니다. 유럽의 민족들은 세계주의자들의 통제 아래 완전히 놓여 있으며, 쉬운 이익을 위해 장차 유럽을 필연적으로 붕괴로 이끌 것입니다. 우리가 이를 바꿀 것입니다."
 UKR_no_russian_language: "러시아어 금지"
 UKR_no_russian_language_desc: "러시아어를 완전히 처리할 때입니다."
 UKR_kuban_ukrainization: "쿠반의 우크라이나화"
 UKR_kuban_ukrainization_desc: "쿠반은 우크라이나 땅이 될 것이며, 우리가 이를 책임질 것입니다."
 UKR_trizub: "트리주브"
 UKR_trizub_desc: "트리주브는 민족주의자 대회의 다른 분파가 맡지 못한 특수한 성격의 기능을 위임받습니다."
 UKR_christos_nash: "기독교 민족주의"
 UKR_christos_nash_desc: "기독교와 민족주의는 우리 우크라이나 국가에서 하나로 합쳐져야 할 것들입니다."
 UKR_nationalists_congress: "민족주의자 대회의 정치"
 UKR_nationalists_congress_desc: "우크라이나의 진정한 애국자들이 이제 나라를 이끌고 있으며, 정책이 아무리 가혹하더라도 우리나라를 위대하게 만들 것입니다."
 UKR_nationalists_right_sector: "우익 섹터"
 UKR_nationalists_una_unso: "UNA-UNSO"
 UKR_nationalists_upa: "우크라이나 봉기군"
 UKR_nationalists_people_leave: "우크라이나에서 이주"
 UKR_nationalists_people_leave_desc: "우리의 정책은 국가에서 대규모 이주를 초래했지만, 우리는 모든 배신자들이 마침내 이곳을 떠날 것이라는 사실에 기쁩니다!"
 UKR_nationalists_cleane_ukraine: "진짜 우크라이나"
 UKR_nationalists_great_ukraine: "대우크라이나"
 UKR_nationalists_great_ukraine_desc: "대우크라이나는 여기서 시작됩니다!"
 UKR_nationalists_trizub: "트리주브"
 UKR_nationalists_reconcista: "부활한 레콘키스타"
 UKR_nationalists_reconcista_desc: "Ukraine will become a beacon of the revival of Christianity in Europe! The holy march from Kyiv begins."
 did_not_support_the_baltic_black_sea_union: "§Y흑해-발트 연합 구상을 지지하지 않았음§!"
 ukraine_congress.2.t: "우크라이나, 세바스토폴 점령"
 ukraine_congress.2.d: "The Ukrainian government cancels the lease agreement with us and begins the expulsion of our fleet from Sevastopol."
 ukraine_congress.2.a: "이것이 우리의 패배다"
 ukraine_congress.10.t: "발트-흑해 구상을 제안하는 우크라이나"
 ukraine_congress.10.d: "발트-흑해 연합은 오래전 폴란드가 주도했던 인터마리움 구상과 유사한 개념입니다. 이는 발트해와 흑해 사이에 있는 국가들로 이루어진 방어 동맹을 이야기합니다. 이 국가들은 협력하고 서로를 지원하는 하나의 권력 블록으로 결집할 것입니다. 수가 많으면 힘이 된다는 속담이 있습니다.\n\n§Y이를 통해 우크라이나 계통을 통한 상호 보장이 가능해집니다§!"
 ukraine_congress.10.a: "계속 검토해 보아야 한다."
 ukraine_congress.10.b: "어리석은 구상이다"
 ukraine_congress.11.t: "발트-흑해 연합"
 ukraine_congress.11.d: "법률과 조약의 초안이 마련되었습니다. 이 구상을 지지하는 나라들의 국민이 마침내 한자리에 모였습니다. 이제 포부를 실현할 때입니다. 우리를 지지해 준 이들과 동맹을 맺을 때입니다. 우크라이나가 동맹을 공식화하기 위해 우리가 서명해야 할 최종 조약을 보내왔습니다. 지금 물러설 것인가, 아니면 방침을 유지하며 새로 얻은 동맹을 지지할 것인가?"
 ukraine_congress.11.a: "조약에 서명한다"
 ukraine_congress.11.b: "물러선다. 조약을 파기한다"
 UKR_poroshenko_start: "포로셴코 대통령 체제"
 UKR_poroshenko_start_desc: "우크라이나 국가의 수반이 올리가르히가 되었습니다. 우크라이나의 역사는 분명 이런 전개를 예상하지 못했지만, 어쩌면 이것이 우크라이나를 성공으로 이끌지도 모릅니다."
 UKR_poroshenko_decentr: "지방 분권화"
 UKR_poroshenko_decentr_desc: "포로셴코 정책 강령의 주요 정치적 요점 중 하나는 지방 분권화였으며 앞으로도 그러할 것입니다. 우리는 우크라이나 국가를 개혁해야 합니다."
 UKR_poroshenko_deccomunism: "탈공산화"
 UKR_poroshenko_deccomunism_desc: "공산주의의 과거는 우리나라에 혹독하고 끔찍했습니다. 우리 민족은 기근으로 거의 멸망할 뻔했으며, 우리는 살인자들의 기념비가 전국에 서 있도록 놔두지 않을 것입니다."
 UKR_poroshenko_anti_corruption: "반부패 개혁"
 UKR_poroshenko_anti_corruption_desc: "부패는 우리나라의 아픈 주제였고 앞으로도 그러할 것이며, 우리는 일련의 반부패 개혁을 추진할 것입니다."
 UKR_poroshenko_nabu: "NABU 설립"
 UKR_poroshenko_nabu_desc: "NABU는 관할에 속하는 부패 및 기타 범죄 행위의 예방, 적발, 진압, 수사, 공개와 새로운 범죄의 예방을 맡은 특별한 지위의 중앙 행정 기관입니다."
 UKR_poroshenko_no_russian_military: "러시아군의 영향력 제거"
 UKR_poroshenko_no_russian_military_desc: "우리는 러시아군에 의존하는 것을 멈춰야 하며, 오직 독립적인 우크라이나군만이 나라를 지킬 것입니다."
 UKR_poroshenko_anti_rus_doctrine: "반러시아 교리"
 UKR_poroshenko_anti_rus_doctrine_desc: "Russia has been and will be an aggressor towards us, we must clearly reflect this in our military doctrine."
 UKR_poroshenko_smi_free: "언론의 자유"
 UKR_poroshenko_smi_free_desc: "The media should be free and not limited by the dictatorial habits of a few people."
 UKR_poroshenko_kefalia: "우크라이나 교회의 자치권"
 UKR_poroshenko_kefalia_desc: "It's time to get rid of the influence of the Moscow Orthodox Church."
 UKR_poroshenko_ukrainisation: "우크라이나화"
 UKR_poroshenko_ukrainisation_desc: "We will begin a policy of Ukrainization, and gradually eradicate the Russian language from various social environments."
 UKR_poroshenko_upa: "우크라이나 봉기군들을 기리라"
 UKR_poroshenko_upa_desc: "UPA - they were defenders of Ukraine and we will honor them."
 UKR_poroshenko_es: "EU와의 협력"
 UKR_poroshenko_es_desc: "The European Union will be our main economic partner and we will strive to maintain trade relations with them further."
 UKR_poroshenko_canada: "캐나다와의 협력"
 UKR_poroshenko_canada_desc: "We are ready to conclude several agreements with Canada to improve trade relations."
 UKR_us_friendship: "미국과의 협력"
 UKR_us_friendship_desc: "We are ready to conclude several agreements with USA to improve trade relations."
 UKR_visegrad_coop: "비세그라드 그룹과의 협력"
 UKR_visegrad_coop_desc: "We are ready to conclude several agreements with Visegrád Group to improve trade relations."
 UKR_turkey_invest_req: "터키로부터의 투자"
 UKR_turkey_invest_req_desc: "We will attract Turkish investors to our territory, their investments will help our economy."
 UKR_kazakh_improve_rel: "카자흐스탄과의 관계 개선"
 UKR_kazakh_improve_rel_desc: "Kazakhstani partners will be an excellent addition to our foreign trade activities."
 UKR_reorient_market: "서구 시장으로의 재조정"
 UKR_reorient_market_desc: "The East is closed to us, we will reorient our markets to the west."
 UKR_ukroboronprom_revival: "방위산업 투자"
 UKR_ukroboronprom_revival_desc: "Our defense industry needs investments, we will give them."
 UKR_smuggle_parts_through_russia: "러시아에서 우회적으로 부품 구매"
 UKR_smuggle_parts_through_russia_desc: "Despite our anti-Russian doctrine, we are forced to purchase spare parts from Russian factories, albeit in a roundabout way."
 UKR_reverse_engineering: "역설계"
 UKR_reverse_engineering_desc: "We will strive to create our own engineering in the field of armored vehicles."
 UKR_western_assistance: "서방 지원"
 UKR_western_assistance_desc: "Western investors are also actively investing in our defense industry."
 UKR_poroshenko_nato: "Cooperation With NATO"
 UKR_poroshenko_nato_desc: "NATO is our main military partner, and with their help we are reforming our armed forces."
 UKR_belarus_proposal_non_attack: "벨라루스와의 불가침 조약"
 UKR_belarus_proposal_non_attack_desc: "Belarus, our northern neighbor, can be used by enemies to attack us from two sides, we must prevent this."
 UKR_language_policies: "언어 정책"
 UKR_language_policies_desc: "We will continue to expand the percentage of the Ukrainian language in communication and in other areas of citizens' lives."
 UKR_support_patriotism: "애국심에 대한 지원"
 UKR_support_patriotism_desc: "Patriotism will be encouraged by the state as never before."
 UKR_donbass_okopi: "작전 벽"
 UKR_donbass_okopi_desc: "We urgently need to build a defensive line along the border of our enemy."
 UKR_transnistria_defences: "트란스니스트리아와의 국경 강화"
 UKR_transnistria_defences_desc: "Transnistria may become a springboard for an attack on us in the future, we will strengthen the border with them."
 UKR_deoligarchisation: "탈올리가르히화"
 UKR_deoligarchisation_desc: "The oligarchs have too much power in our country - we will fix it."
 UKR_rochen_expansion: "로센 생산 확대"
 UKR_rochen_expansion_desc: "Roshen factory will now be able to expand its production capabilities with the help of public investments."
 UKR_support_medium_businesses: "중소기업 지원"
 UKR_support_medium_businesses_desc: "Small businesses will receive the necessary support."
 UKR_kolomoyski_deal: "콜로모이스키와의 거래"
 UKR_kolomoyski_deal_desc: "콜로모이스키는 오랫동안 우리나라의 주요 문제 중 하나였으며, 그의 영향력은 너무 컸습니다. 이제 그를 처리할 때입니다."
 UKR_purge_church_from_rus: "러시아 정교회의 영향력 제거"
 UKR_purge_church_from_rus_desc: "러시아 정교회는 더 이상 우리에게 영향을 미치지 못할 것입니다."
 UKR_greece_letter: "세계 총대주교에게 청원"
 UKR_greece_letter_desc: "우리 교회를 독립 교회로 인정해 달라고 세계 총대주교에게 청원할 것입니다."
 UKR_upc_create: "우크라이나 정교회 설립"
 UKR_upc_create_desc: "우크라이나 정교회가 설립될 것입니다! 이제 우리는 정신적으로도 자유로운 나라입니다."
 UKR_poroshenko_army_reform: "군 개혁"
 UKR_poroshenko_army_reform_desc: "우리 군에는 대대적인 개혁이 필요하며, 지금 이를 시행하기 시작할 것입니다."
 UKR_pmc_instructors: "서방 PMC 교관"
 UKR_pmc_instructors_desc: "서방 PMC 교관들이 우리 군을 지원할 준비가 되어 있습니다."
 UKR_rally_nationalist_support: "참전 용사 지원"
 UKR_rally_nationalist_support_desc: "전투 참전 용사들은 우리의 향후 선거 운동의 중추가 될 것입니다."
 UKR_welfare_conseccions: "사회 지원 확대"
 UKR_welfare_conseccions_desc: "앞으로의 선거 운동은 사회적 보장의 확대에 초점을 맞출 것입니다."
 UKR_anti_russia_propaganda: "반러시아 선전"
 UKR_anti_russia_propaganda_desc: "우리 시민은 자신의 진정한 적이 누구인지, 우리나라를 집어삼키려 하는 자가 누구인지, 즉 러시아임을 알아야 합니다."
 UKR_saakashvili_odessa: "사카슈빌리를 오데사 주지사로 초빙"
 UKR_saakashvili_odessa_desc: "사카슈빌리를 오데사 지역 주지사로 초빙할 것입니다. 어쩌면 그가 좋은 모습을 보여 줄지도 모릅니다."
 UKR_support_minsk_agreements: "민스크 협정 지지"
 UKR_support_minsk_agreements_desc: "민스크 협정을 지지하고 모든 것을 평화적으로 해결하려 노력할 것입니다."
 UKR_continue_shelling: "분리주의자 척결"
 UKR_continue_shelling_desc: "분리주의자는 용납할 수 없습니다! 우리는 우리 땅을 해방할 것입니다."
 UKR_business_with_rf: "러시아와의 사업"
 UKR_business_with_rf_desc: "러시아와의 사업을 계속할 것입니다."
 UKR_full_rus_embargo_por: "러시아에 대한 금수 조치 부과"
 UKR_full_rus_embargo_por_desc: "러시아와의 경제 협력에 대한 금수 조치를 부과할 것입니다."
 UKR_osce_watchers: "OSCE 감시단"
 UKR_osce_watchers_desc: "OSCE 감시단이 돈바스에 초청될 것입니다."
 UKR_suppress_easterner: "동부 주민 억제"
 UKR_suppress_easterner_desc: "러시아와의 통합을 지지하는 자들은 언론을 통한 방법을 포함해 억제되어야 합니다."
 UKR_anti_emerg_1plus1: "반동부 선전 강화"
 UKR_anti_emerg_1plus1_desc: "러시아를 지지하는 자들에 대한 선전을 강화할 것입니다."
 UKR_eu_compliant_reforms: "EU 기준 부합 개혁"
 UKR_eu_compliant_reforms_desc: "유럽 연합과의 통합을 위한 기준 부합 개혁을 계속할 것입니다."
 UKR_european_education_connections: "유럽 교육 기관과의 협력"
 UKR_european_education_connections_desc: "유럽식 교육은 낡은 소련식, 전체주의적 교육보다 훨씬 많은 것을 우리에게 줄 것입니다."
 UKR_european_defence_program: "유럽 방어 프로그램"
 UKR_european_defence_program_desc: "군을 강화하기 위해 유럽 방어 프로그램에 참여할 것입니다."
 UKR_nato_application_por: "NATO 협력 프로그램"
 UKR_nato_application_por_desc: "군 분야에서의 NATO와의 파트너십은 우리가 군 개혁을 추진하는 데에도 도움이 될 것입니다."
 UKR_ukraine_anew: "새로운 우크라이나"
 UKR_ukraine_anew_desc: "우리나라는 먼 길과 수많은 개혁을 거쳐 왔으며, 이제 다시 태어나 미래를 긍정적으로 바라보고 있습니다."
 UKR_apply_to_eu_por: "EU 협력 프로그램"
 UKR_apply_to_eu_por_desc: "유럽 연합과의 협력은 앞으로도 우리의 우선 과제가 될 것입니다."
 UKR_anti_rus_doctrine: "반러시아 교리"
 UKR_anti_rus_doctrine_desc: "우리의 정치적, 이념적 적은 러시아였으며 앞으로도 그러합니다. 우리는 이를 받아들이고 전쟁에 대비해야 합니다."
 UKR_foreign_advisors_desc: "여러 PMC 소속 외국인 교관들이 우리 병사들을 훈련시킬 준비가 되어 있습니다."
 UKR_west_investors: "서방 투자자"
 UKR_operation_wall: "작전 벽"
 UKR_smuggle_parts_from_rus: "러시아에서 예비 부품 구매"
 UKR_smuggle_parts_from_rus_desc: "We continue to buy spare parts from Russia, albeit secretly."
 UKR_reverse_engineering_start: "역설계"
 UKR_reverse_engineering_start_desc: "We aim to create our own production."
 UKR_ato_supports: "재향군인 지원"
 UKR_health_supports: "의료 복지 지원"
 UKR_poroh_prepare_donbass: "돈바스에서의 재경기 준비"
 UKR_poroh_prepare_donbass_desc: "We are ready to take revenge on the separatists and solve the problem with the People's republics forever."
 UKR_poroh_osce_ukr: "OSCE 관측단"
 UKR_poroh_osce_ukr_desc: "OSCE observers have been sent to the conflict zone to stabilize the situation on the front line with the unrecognized republics."
 ukraine_poroh.1.t: "우크라이나의 불가침 조약 제안"
 ukraine_poroh.1.d: "The Ukrainian government suggests that we conclude a non-aggression pact with them, apparently they see us as potential aggressors against themselves."
 ukraine_poroh.1.a: "우리는 협정에 서명한다"
 ukraine_poroh.1.b: "그럴 필요는 없다"
 ukraine_poroh.2.t: "벨라루스와의 불가침 조약"
 ukraine_poroh.2.d: "The Belarusian government has agreed to sign a non-aggression pact with us, we are glad that they are on our side."
 ukraine_poroh.2.a: "좋아"
 ukraine_poroh.3.t: "벨라루스와의 불가침 조약"
 ukraine_poroh.3.d: "벨라루스 정부가 우리와 불가침 조약에 서명하기를 거부했으며, 이는 우리를 우려하게 만듭니다."
 ukraine_poroh.3.a: "슬프군"
 ukraine_poroh.4.t: "우크라이나 교회의 독립"
 ukraine_poroh.4.d: "우크라이나 교회가 자신의 교회가 독립 교회가 되는 것을 허가해 달라고 우리 세계 총대주교에게 청원했습니다. 우리 총대주교가 이를 허락할까요?"
 ukraine_poroh.4.a: "찬성"
 ukraine_poroh.4.b: "안된다"
 ukraine_poroh.5.t: "우크라이나 교회의 독립"
 ukraine_poroh.5.d: "세계 총대주교가 우리 교회의 독립을 승인했습니다."
 ukraine_poroh.5.a: "좋아"
 ukraine_poroh.6.t: "우크라이나 교회의 독립"
 ukraine_poroh.6.d: "세계 총대주교가 우리 교회의 독립을 승인하지 않았습니다."
 ukraine_poroh.6.a: "슬프군"
 ukraine_poroh.7.t: "비셰그라드 4개국과의 협력을 원하는 우크라이나"
 ukraine_poroh.7.d: "우크라이나 정부는 비셰그라드 4개국과의 협력 계획을 분명히 밝혔습니다. 4개국의 대표로서 이 협력에 동의할지 결정해야 합니다."
 ukraine_poroh.7.a: "찬성"
 ukraine_poroh.7.b: "안된다"
 ukraine_poroh.8.t: "비셰그라드 국가들과의 협력"
 ukraine_poroh.8.d: "그들이 협력하기로 동의했습니다."
 ukraine_poroh.8.a: "좋아"
 ukraine_poroh.9.t: "비셰그라드 국가들과의 협력"
 ukraine_poroh.9.d: "그들이 우리와의 협력을 거부했습니다."
 ukraine_poroh.9.a: "슬프군"
 UKR_kefalia_agree: "세계 총대주교의 허가"
 UKR_odessa_ssaka: "사카슈빌리 주지사직의 여파"
 UKR_odessa_ssak: "사카슈빌리 주지사직의 여파"
 ukr_industry_points_cost_35: "산업 포인트 35"
 ukr_industry_points_cost_50: "산업 포인트 50"
 ukr_industry_points_cost_75: "산업 포인트 75"
 UKR_opfl_political_reforms: "정치 개혁"
 UKR_opfl_political_reforms_desc: "최근의 사건 이후 우리나라에는 일정한 정치 개혁이 필요합니다. 이것이 없다면 우크라이나는 더 이상 발전할 수 없습니다."
 UKR_opfl_lustration_fight: "루스트라시야 반대 투쟁"
 UKR_opfl_lustration_fight_desc: "루스트라시야는 이전 정치 체제에서 고위직을 지낸 사람들의 공직 진출을 제한하는 것입니다. 최근의 사건 이후 이 정책은 우크라이나에서도 시행되고 있습니다. 이 횡포는 중단되어야 합니다."
 UKR_opfl_radicalism: "급진주의와의 싸움"
 UKR_opfl_radicalism_desc: "몇 년간의 정치적 혼란 속에서 급진주의가 우크라이나 전역으로 퍼졌습니다. 우리나라의 평화로운 존립을 위해 나라 안의 모든 급진주의의 징후에 맞서 싸워야 합니다."
 UKR_opfl_ukrainisation_policy: "우크라이나화 규탄"
 UKR_opfl_ukrainisation_policy_desc: "우크라이나화 정책은 우리의 큰 이웃인 러시아와의 우호 관계 발전을 직접적으로 방해합니다. 우크라이나화 선전을 규탄하고 중단시켜야 하며, 그렇지 않으면 좋은 결과는 나오지 않을 것입니다."
 UKR_opfl_national_ref: "전국 국민투표 실시"
 UKR_opfl_national_ref_desc: "전국 국민투표는 우리나라 국민이 스스로의 미래를 결정하는 데 도움이 될 것입니다. 가능한 한 빨리 실시해야 합니다!"
 UKR_opfl_independence_rep: "공화국들의 독립 인정"
 UKR_opfl_independence_rep_desc: "공화국 국민들은 자신의 선택을 했으며, 우리는 이를 존중해야 합니다. 새로운 국가들에 투자하고 유대를 쌓아야 할 때가 한참 지났습니다."
 UKR_opfl_take_republic: "무력으로 되찾기"
 UKR_opfl_take_republic_desc: "국민투표는 한낱 연막이었습니다. 우리의 진짜 목표는 우리 영토 안의 분리주의자를 색출하는 것이며, 이제 우리 영토를 되찾아 올 때입니다! 분리주의자들이 우크라이나 땅을 활보하게 두지 않을 것입니다!"
 UKR_opfl_federalisation_project: "연방화 프로젝트"
 UKR_opfl_federalisation_project_desc: "모든 영토 분쟁이 해결되었으니, 이제 밝은 미래를 기대할 수 있습니다. 우크라이나 연방을 세울 때입니다!"
 UKR_opfl_economic_policy: "새로운 경제 정책"
 UKR_opfl_economic_policy_desc: "새로운 경제 정책은 우리 경제를 되살리고 이후 재건하는 데 도움이 될 것입니다."
 UKR_opfl_rural_land: "농촌 토지 보전"
 UKR_opfl_rural_land_desc: "농촌 활동은 우리 경제의 큰 부분을 차지합니다. 따라서 이들이 합법적으로 취득한 토지를 보장해야 합니다. 이를 통해 이들의 토지가 다음 날 빼앗기지 않을 것이라는 확신을 줄 것입니다."
 UKR_opfl_tarif_genocide: "안 된다! 요금 학살"
 UKR_opfl_tarif_genocide_desc: "요금 학살은 우리 시민들에게 악몽입니다. 그들의 돈 대부분은 수많은 무의미한 세금을 내는 데 쓰입니다. 우리는 이 무법 상태에 \\"아니오\\"라고 말해야 합니다!"
 UKR_opfl_deindustry: "우크라이나의 탈산업화 저지"
 UKR_opfl_deindustry_desc: "우크라이나가 독립을 얻은 후, 옛 정부는 우리나라의 모든 산업적 부를 아무에게나 공짜로 넘겨주었습니다. 그 결과 우리는 산업적 구덩이에 빠졌습니다. 공장, 플랜트, 기타 기업의 건설을 재개해야 합니다."
 UKR_federaliz_tt: "우크라이나를 §Y연방화§!합니다"
 UKR_rosava: "CJSC 로사바"
 UKR_rosava_desc: "CJSC 로사바는 우크라이나 최대의 타이어 제조업체입니다. 생산 시설은 두 곳의 타이어 공장, 즉 로사바와 대형 타이어 생산 공장에 있습니다. 생산 능력은 연간 약 600만 개에 달합니다."
 UKR_land_land: "토지 개혁 지속"
 UKR_land_land_desc: "지난 세기에 시작된 토지 개혁을 계속하고 앞으로 진척시킬 준비가 되어 있습니다."
 UKR_motor_sich: "모토르 시치"
 UKR_motor_sich_desc: "모토르 시치 주식회사는 자포리자에 본사를 둔 우크라이나의 항공기 엔진 제조업체입니다. 이 회사는 비행기와 헬리콥터용 엔진은 물론 산업용 및 선박용 가스터빈과 설비도 제조합니다."
 UKR_armor_kyv: "키이우 장갑차 공장"
 UKR_armor_kyv_desc: "키이우 장갑차 공장은 우크라이나 장갑 산업의 국영 기업으로, 소련제 장갑차량의 진단, 수리, 정비, 재장비 및 현대화를 수행합니다."
 UKR_pivdenmash_idea: "PA 피우덴마시"
 UKR_kyvarmor_idea: "키이우 장갑차 공장"
 UKR_zaz_idea: "ZAZ"
 UKR_kraz_idea: "KrAZ"
 UKR_motorsich_idea: "모토르 시치"
 UKR_start_war_against_poland: "폴란드-우크라이나 전쟁"
 UKR_start_war_against_poland_desc: "우리 국가의 결정적인 순간이 왔습니다. 우리는 적을 물리치거나, 세계사에서 사라질 것입니다."
 UKR_hur_expandeds: "HUR 영향력 확대"
 UKR_hur_expandeds_desc: "HUR의 권한을 확대할 것입니다. 상황이 그것을 요구하고, 전쟁이 그것을 요구합니다!"
 UKR_unite_with_russian_genshtab: "러시아 총참모부의 도움 요청"
 UKR_unite_with_russian_genshtab_desc: "폴란드군과의 전쟁을 위해 러시아 총참모부의 도움을 요청할 준비가 되어 있습니다."
 UKR_observer_joint_shtab_kiev: "합동 사령부 창설"
 UKR_observer_joint_shtab_kiev_desc: "러시아와 우크라이나의 군은 키이우에 합동 총참모부를 창설할 것입니다."
 UKR_professional_shturm_groups: "돌격 여단"
 UKR_professional_shturm_groups_desc: "적에 더 효과적으로 맞서기 위해 돌격 여단에 인원을 모집하기 시작할 것입니다."
 UKR_pmc_zaporozhets: "PMC 자포로제츠"
 UKR_pmc_zaporozhets_desc: "일부 참전 용사들이 자포로제츠라는 자체 민간 군사 기업을 만들었습니다."
 UKR_start_the_kashubian_uprising: "카슈비아 반란 준비"
 UKR_start_the_kashubian_uprising_desc: "폴란드의 방어를 약화시키기 위해 이 지역에서 반란을 준비할 것입니다."
 UKR_silesian_rebellion: "실레시아 반란 준비"
 UKR_silesian_rebellion_desc: "폴란드의 방어를 약화시키기 위해 이 지역에서 반란을 준비할 것입니다."
 UKR_vilnoe_pospolitoe_rushenie: "포스폴리테 루셰니에 대대"
 UKR_vilnoe_pospolitoe_rushenie_desc: "적 영토에서 특별 제한 작전을 수행할 새로운 HUR 작전 대대가 창설될 것입니다."
 UKR_belarus_volunteers: "로코솝스키 대대"
 UKR_belarus_volunteers_desc: "적 영토에서 특별 제한 작전을 수행할 새로운 HUR 작전 대대가 창설될 것입니다."
 UKR_legion_free_poland: "폴란드 자유 군단"
 UKR_legion_free_poland_desc: "적 영토에서 특별 제한 작전을 수행할 새로운 HUR 작전 대대가 창설될 것입니다."
 UKR_polish_hetmanate_army: "폴란드 헤트만국 대대"
 UKR_polish_hetmanate_army_desc: "적 영토에서 특별 제한 작전을 수행할 새로운 HUR 작전 대대가 창설될 것입니다."
 UKR_air_dominance_tactics: "제공권 장악 전술"
 UKR_air_dominance_tactics_desc: "우리는 폴란드 항공 전력을 제압해야 하므로 새로운 교리를 적용할 것입니다."
 UKR_tro_expandeds: "영토 방위대 강화"
 UKR_tro_expandeds_desc: "영토 방위대의 모집을 시급히 확대할 것입니다. 우리는 당장 전투원이 필요합니다!"
 UKR_start_war_against_russia: "러시아-우크라이나 전쟁"
 UKR_start_war_against_russia_desc: "우리 국가의 결정적인 순간이 왔습니다. 우리는 적을 물리치거나, 세계사에서 사라질 것입니다."
 UKR_hur_expanded: "HUR 영향력 확대"
 UKR_hur_expanded_desc: "HUR의 권한을 확대할 것입니다. 상황이 그것을 요구하고, 전쟁이 그것을 요구합니다!"
 UKR_tro_expanded: "영토 방위대 강화"
 UKR_tro_expanded_desc: "영토 방위대의 모집을 시급히 확대할 것입니다. 우리는 당장 전투원이 필요합니다!"
 UKR_tck: "대규모 동원"
 UKR_tck_desc: "이것은 말 그대로 우리 국가의 존립을 위한 전쟁이므로, 대규모 동원을 시작해야 합니다."
 UKR_other_battaions_hur: "새로운 HUR 대대"
 UKR_other_battaions_hur_desc: "HUR는 대대에 전투원을 적극적으로 모집하고 있으며, 그중 일부는 이미 전투에 참가할 준비가 되었습니다."
 UKR_free_russia_legion: "러시아 자유 군단"
 UKR_free_russia_legion_desc: "진정한 러시아 애국자들이 우리를 위해 싸우고 러시아 위에 드리운 폭정을 타도할 준비가 되어 있습니다."
 UKR_rdk: "러시아 의용군단"
 UKR_rdk_desc: "러시아의 정책에 동의하지 않는 러시아 민족주의자들이 우리의 지휘 아래 러시아 의용군단으로 자발적으로 조직되었습니다."
 UKR_republican_army: "국가 공화국군"
 UKR_republican_army_desc: "러시아에서 망명한 의원들이 국가 공화국군을 창설했으며, 이들은 정권에 맞서 활발한 유격 활동을 벌일 것입니다."
 UKR_separatist_battalions: "분리주의 대대 유치"
 UKR_separatist_battalions_desc: "러시아인뿐 아니라 다른 민족들도 러시아 제국주의로부터의 자유를 위해 싸울 준비가 되어 있습니다."
 UKR_drone_army: "드론 군대"
 UKR_drone_army_desc: "드론의 대량 생산을 시작할 것입니다. 나라에는 수천 대의 드론이 필요합니다."
 UKR_tck_mobka: "총동원"
 UKR_tck_mobka_desc: "우리는 군을 보충하기 위해 여러 차례의 동원을 실시할 수밖에 없습니다."
 UKR_attack_guardia: "공세 근위대"
 UKR_attack_guardia_desc: "우리는 방어에서 공격으로 전환할 준비가 되어 있습니다! 근위대가 공격하여 적을 격파하라!"
 UKR_inter_legion_idea: "국제군단"
 UKR_inter_legion_idea_desc: "전 세계의 많은 외국인들이 독립을 위한 우리의 투쟁을 지원할 준비가 되어 있습니다."
 UKR_air_superior_idea: "제공권 장악 전술"
 UKR_air_superior_idea_desc: "우리는 제공권을 장악하기 위해 노력합니다."
 UKR_hur_other_battalions_created_tt: "§Y새로운 HUR 대대§!가 창설됩니다"
 UKR_free_russia_created_tt: "§Y러시아 자유 군단§!을 특별 제한 작전에 사용할 수 있게 됩니다"
 UKR_rdk_created_tt: "§Y러시아 의용군단§!을 특별 제한 작전에 사용할 수 있게 됩니다"
 UKR_republican_army_created_tt: "§Y지역 분리주의 대대§!를 특별 작전에 사용할 수 있게 됩니다"
 UKR_free_poland_created_tt: "§Y폴란드 자유 군단§!을 특별 제한 작전에 사용할 수 있게 됩니다"
 UKR_rushenie_created_tt: "§Y포스폴리테 루셰니에 대대§!를 특별 제한 작전에 사용할 수 있게 됩니다"
 UKR_rokossovski_created_tt: "§Y로코솝스키 대대§!를 특별 제한 작전에 사용할 수 있게 됩니다"
 UKR_hetmanat_created_tt: "§Y폴란드 헤트만국 대대§!를 특별 제한 작전에 사용할 수 있게 됩니다"
 UKR_polish_army_created_tt: "§Y폴란드 해방군§!을 특별 제한 작전에 사용할 수 있게 됩니다"
 ukraine_kolom.1.t: "공화국 수립을 선포한 콜로모이스키"
 ukraine_kolom.1.d: "우크라이나 최고 부호 올리가르히 중 한 명인 이호르 콜로모이스키가 우크라이나 내 자치체로서 드니프로페트롭스크 공화국의 수립을 선포했습니다.  이는 우리 정부에 충격을 안겼으며, 이제 우리는 이에 어떻게 대응할지 결정해야 합니다."
 ukraine_kolom.1.a: "자치는 없다"
 ukraine_kolom.1.b: "어쩌면 우리에게 이로울 수도 있다"
 ukraine_kolom.2.t: "우리 군대"
 ukraine_kolom.2.d: "우리가 직접 자금을 댄 부대들이 우리 편에 섰으며, 이제 그들이 우리의 주력 타격 전력입니다."
 ukraine_kolom.2.a: "드니프로의 자유를 위하여!"
 UKR_recruit_arestovich: "아레스토비치 영입"
 UKR_recruit_arestovich_desc: "아레스토비치는 우리 특수 기관의 훌륭한 요원이 될 것이며, 그의 뛰어난 능력은 우리에게 유용할 것입니다."
 UKR_korchinsky_strategy: "코르친스키의 전략"
 UKR_korchinsky_strategy_desc: "코르친스키의 전략은 서방 세력과도 싸우는 것을 포함합니다... 우크라이나의 주권을 실제로 위협하는 외부의 적에 맞선 투쟁입니다."
 UKR_psiop_operations: "심리전 작전"
 UKR_psiop_operations_desc: "우리는 심리 작전 기술을 숙달하였으며, 이를 적에게 사용할 준비가 되어 있습니다."
 UKR_bratstvo_psiop_idea: "심리전 작전"
 UKR_bratstvo_psiop_idea_desc: "적은 정신적으로도 무너뜨려야 하며, 이를 위해 심리전 작전을 수행할 것입니다."
 UKR_vitrenko_party: "신사회주의"
 UKR_vitrenko_party_desc: "우크라이나는 오랫동안 나라를 둘로 찢어 놓는 민족주의와 친서방 정서에 사로잡혀 있었습니다. 우리는 시민들이 찾는 것, 곧 안정과 번영을 줄 것입니다. 우리의 사회주의가 그들을 행복하게 할 것입니다."
 UKR_economic_orthodoxy: "경제 정통주의"
 UKR_economic_orthodoxy_desc: "우리나라는 경제적으로뿐만 아니라 정신적으로도 강해야 합니다. 이 두 가지를 결합하지 않을 이유가 있겠습니까?"
 UKR_install_christian_socialism: "기독교 사회주의"
 UKR_install_christian_socialism_desc: "우리는 하느님을 계속 믿고 있으므로 사회주의 사상을 포기하지 않을 것입니다. 사회주의 이론가들은 하느님에게서 멀어졌기에 사회주의를 붕괴로 이끌었으며, 우리는 그들의 실수를 되풀이하지 않을 것입니다."
 UKR_iron_woman: "강철의 여인"
 UKR_iron_woman_desc: "나탈리야 비트렌코는 강철처럼 우크라이나에 유일하게 옳다고 여기는 사상을 지키며, 누구에게도 굽힐 생각이 없습니다."
 UKR_resovetization: "재소비에트화"
 UKR_resovetization_desc: "소비에트 시대는 차르 치하에서도, 폴란드 치하에서도, 독립 이후에도 보지 못한 발전을 우리나라에 안겨 주었습니다. 우리는 이 사실을 받아들이고 사회주의 숭상을 장려할 것입니다."
 UKR_rally_out_the_coalition: "국민 연립"
 UKR_rally_out_the_coalition_desc: "모두 함께 조국을 역사상 최고의 국가로 탈바꿈시키고자 우리 당의 깃발 아래 결집한, 민족볼셰비키와 러시아 제국 부활파, 사회주의자, 친러파 등 서로 완전히 다른 사상을 가진 지지자들입니다."
 UKR_praymaya_electro_demokratia: "직접 전자 민주주의"
 UKR_praymaya_electro_demokratia_desc: "We have had enough of dictatorship and totalitarianism, our people deserve democracy at its best."
 UKR_storm_sturm_at_parliament: "의회 습격"
 UKR_storm_sturm_at_parliament_desc: "정부 기관에서 우리의 활동을 방해하는 자들을 제거할 것입니다."
 UKR_befriend_russia_vit: "러시아와의 동반자 관계"
 UKR_befriend_russia_vit_desc: "역사적으로 우리는 러시아와 이어져 있으며 앞으로도 영원히 이어져 있을 것입니다. 러시아와의 동반자 관계는 해돋이처럼 자명한 것이어야 합니다."
 UKR_apply_to_union_state: "연방 국가에 가입하고자 하는 열망을 발표하기"
 UKR_apply_to_union_state_desc: "연방 국가는 단일한 우리 민족 통합의 첫 번째이자 가장 중요한 단계 중 하나이며, 우리는 이 사업의 일원이 되고자 합니다."
 UKR_honor_russian_empire: "러시아 제국의 유산 존중"
 UKR_honor_russian_empire_desc: "러시아 제국은 강대국이었으며 그 업적을 부정하는 것은 어리석고 부당한 일입니다. 우리는 로마노프 왕조의 위대함을 기억합니다."
 UKR_free_healthcare: "무상 의료"
 UKR_free_healthcare_desc: "우리는 소비에트의 무상 의료 관행을 되살릴 것입니다. 시민은 건강해야 합니다!"
 UKR_national_bolshevist_rhetoric: "국가 볼셰비즘의 수사학"
 UKR_national_bolshevist_rhetoric_desc: "우리 당이 전적으로 동의하며 그 강령에서 많은 부분을 차용한 민족볼셰비키의 정책들입니다."
 UKR_russo_ukrainian_nationalism: "러시아-우크라이나 민족주의"
 UKR_russo_ukrainian_nationalism_desc: "우리 민족은 언제나 일어나 자신의 위대함을 기억해야 하며, 우리는 양국의 민족주의 운동을 적극 지원할 것입니다."
 UKR_naz_pioners: "민족 개척단"
 UKR_naz_pioners_desc: "개척단은 소비에트 지도부의 훌륭한 발상이었습니다. 우리 고유의 특색을 더하여 이를 부활시킬 것입니다."
 UKR_calm_ruthenia: "루테니아의 계승자 선언"
 UKR_calm_ruthenia_desc: "우리는 고대 루테니아의 유산 또한 잊혀서는 안 된다고 믿습니다! 이 땅에 루테니아가 존재했음을 모두에게 상기시킬 것입니다."
 UKR_proclaim_rus_ukraine: "루테니아 부활 선포"
 UKR_proclaim_rus_ukraine_desc: "루테니아가 다시 태어납니다! 바로 오늘, 이곳 우크라이나의 땅에서!"
 UKR_federalize_galicia_and_zakarpat: "갈리치아 연방화"
 UKR_federalize_galicia_and_zakarpat_desc: "갈리치아의 분리주의 문제를 해결할 때가 왔으며, 오직 연방화만이 우리를 구할 것입니다."
 UKR_lnr_dnr_peace_integrate: "동부 우크라이나 연방화"
 UKR_lnr_dnr_peace_integrate_desc: "이전 정부가 저지른 실수에 대해 이제 우리가 결단을 내려야 합니다. 우리는 나라의 분열을 끝내기 위한 연방화 계획을 추진할 준비가 되어 있습니다."
 UKR_suppress_western_and_bander: "서방 영향력 억제"
 UKR_suppress_western_and_bander_desc: "우리나라에서 서방의 영향력을 의도적으로 약화시켜야 합니다."
 UKR_restore_russian_church: "러시아 정교회로의 복귀"
 UKR_restore_russian_church_desc: "독립 교회 체제는 실수였으며, 우리는 형제들과 영적으로 멀어졌습니다. 우리는 더 이상 그러한 실수를 되풀이하지 않을 것입니다."
 UKR_no_to_upc: "우크라이나 정교회 해산"
 UKR_no_to_upc_desc: "이단자들은 해산되어야 합니다."
 UKR_clear_out_pcu: "교회 정화"
 UKR_clear_out_pcu_desc: "독립 교회 체제 지지자들과 그 동조자들 모두를 우리의 통제 아래 두어야 합니다."
 UKR_restore_apostolacy: "러시아 정교회의 귀환"
 UKR_restore_apostolacy_desc: "러시아 정교회가 다시 한번 우리 땅을 지배합니다!"
 UKR_full_socialism: "사회주의 강조"
 UKR_full_socialism_desc: "우리는 사회주의 교리에 더욱 깊이 빠져들어 이를 우리나라에 계속 적용해 나갈 것입니다."
 UKR_install_true_soviet_folk: "인민 사회주의"
 UKR_install_true_soviet_folk_desc: "우리는 시민들이 행복을 느낄 수 있도록 모든 노력을 다할 것입니다."
 UKR_appease_pro_russian_oligarchs: "친러시아 과두 재벌과의 협력"
 UKR_appease_pro_russian_oligarchs_desc: "친러시아 과두 계층의 투자가 우리 경제를 강화할 것이므로, 우리는 그들과 협력 관계를 구축할 준비가 되어 있습니다."
 UKR_loyalist_oligarchy_ens: "충성파 과두 재벌 수용"
 UKR_loyalist_oligarchy_ens_desc: "충성파 과두 재벌들 역시 우리 편에 설 것이며, 이로써 국내에서 자신들의 재산을 지킬 것입니다."
 UKR_industrial_revival: "산업 르네상스"
 UKR_industrial_revival_desc: "우리나라는 소련 붕괴 이후 산업 역량을 잃었으며, 이제 이를 되살릴 때입니다."
 UKR_national_feminism: "민족 페미니즘"
 UKR_national_feminism_desc: "여성 또한 우리나라 성장의 원동력이 되어야 하며, 우리는 모든 산업에서 여성의 참여를 장려할 것입니다."
 UKR_foreign_policy_det: "우리의 외교 노선"
 UKR_foreign_policy_det_desc: "우리나라는 외교 정책에서 어떤 길을 갈지 스스로 결정해야 합니다."
 UKR_fully_antagonize_the_west: "서방에 대한 적대"
 UKR_fully_antagonize_the_west_desc: "우리는 서방과 친구가 될 생각이 없습니다. 서방에는 친구가 없고 오직 노예와 하인만이 있다는 것을 알기 때문입니다."
 UKR_ukr_sov_mil_coop: "러시아와의 군사 협력"
 UKR_ukr_sov_mil_coop_desc: "우리는 러시아군과 일련의 합동 군사 훈련을 실시할 것입니다."
 UKR_euroscepticism_campaign: "강력한 유럽 회의주의"
 UKR_euroscepticism_campaign_desc: "우리는 과거에도 유럽 회의주의자였고 앞으로도 그러할 것입니다."
 UKR_join_csto: "CSTO 가입"
 UKR_join_csto_desc: "우리는 CSTO 가입 문서에 서명할 준비가 되어 있습니다. 오직 러시아만이 우리에게 안전 보장을 제공할 수 있습니다."
 UKR_reconcile_with_west: "서방과의 교류 개선"
 UKR_reconcile_with_west_desc: "우리는 서방 국가들과의 협력을 개선하고자 합니다."
 UKR_nato_ukr_train: "나토 회원국과의 훈련"
 UKR_nato_ukr_train_desc: "우리는 군대에 나토 교리를 부분적으로 도입하고, 나토 회원국과 일련의 훈련도 실시할 것입니다."
 UKR_join_nato_with_russia: "러시아와 함께 나토 가입"
 UKR_join_nato_with_russia_desc: "우리는 나토에 가입하고자 하되 오직 러시아와 함께할 것이며, 러시아 정부에 이 구상을 제안할 것입니다."
 UKR_full_nazbol_transition: "국가 볼셰비즘의 전성기"
 UKR_full_nazbol_transition_desc: "이제 우리나라와 슬라브 민족 전체가 다음 발전 단계로 나아갈 때가 되었습니다. 우리는 슬라브 통합의 길에 들어섭니다."
 UKR_serbia_unify: "[SER.GetName]에서의 국가 볼셰비즘 혁명"
 UKR_serbia_unify_desc: "우리 형제들은 슬라브 민족이라는 이유로 그들을 억압해 온 정부로부터 마침내 해방될 것입니다!"
 UKR_bulgaria_unification: "[BUL.GetName]에서의 국가 볼셰비즘 혁명"
 UKR_bulgaria_unification_desc: "우리 형제들은 슬라브 민족이라는 이유로 그들을 억압해 온 정부로부터 마침내 해방될 것입니다!"
