 usa_perot_meritorious_service_award_NAME: "Премия Перо за выдающиеся заслуги"
 usa_perot_meritorious_service_award_DESC: "За самоотверженную работу по воплощению в жизнь будущего, которому наш основатель Росс Перо, несомненно, улыбнулся бы."
 fij_innovation_station_NAME: "Инновационная станция"
 fij_innovation_station_DESC: "Технологические инновации объединили наш вид, и теперь мы стремимся к новым высотам за пределами гравитации нашей планеты. А теперь отправляйтесь играть в Stellaris и продолжайте приключения Объединённого Техната Земли в галактике."
